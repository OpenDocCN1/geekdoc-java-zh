  \n\n\n\n在使用意（intent）启动同一应用程序内的其他活动时，必须将这些活动列在应用程序清单文件（manifest file）中。以下 `AndroidManifest.xml`\
  \ 内容为包含名为 `ActivityA` 和 `ActivityB` 对应应用程序进行了正确配置：\n\n```xml\n<?xml version=\"1.0\"\
  \ encoding=\"utf-8\"?>\n<manifest xmlns:android=\"http://schemas.android.com/apk/res/android\"\
  \n    package=\"com.ebookfrenzy.intent1.intent1\" >\n    <application\n        android:icon=\"\
  @mipmap/ic_launcher\"\n        android:label=\"@string/app_name\" >\n        <activity\n\
  \            android:label=\"@string/app_name\"\n            android:name=\"com.ebookfrenzy.intent1.intent1.ActivityA\"\
  \ >\n            <intent-filter>\n                <action android:name=\"android.intent.action.MAIN\"\
  \ />\n                <category android:name=\"android.intent.category.LAUNCHER\"\
  \ />\n            </intent-filter>\n        </activity>\n        <activity\n   \
  \         android:name=\"ActivityB\"\n            android:label=\"ActivityB\" >\n\
  \        </activity>\n    </application>\n</manifest>\n```\n\n### 53.3 从活动返回数据\n\
  \n如上一节的示例所示，虽然数据传输到了 `ActivityB`，但没有办法将数据返回给第一个活动（我们将其称为 `ActivityA`）。然而，这可以通过将\
  \ `ActivityB` 启动为 `ActivityA` 的子活动（sub-activity）可以实现。通过创建 `ActivityResultLauncher`\
  \ 实例可以启动活动作为子活动。`ActivityResultLauncher` 实例是通过调用 `registerForActivityResult()` 方法创建的，并通过\
  \ lambda 形式传递回调处理器。当子活动返回时，该处理器会被调用并传递返回的数据。一旦创建了 `ActivityResultLauncher` 实例，就可以使用\
  \ `intent` 参数调用它来启动子活动。创建 `ActivityResultLauncher` 实例的代码通常如下：\n\n```java\nActivityResultLauncher<Intent>\
  \ startForResult = registerForActivityResult(\n    new ActivityResultContracts.StartActivityForResult(),\n\
  \    new ActivityResultCallback<ActivityResult>() {\n        @Override\n       \
  \ public void onActivityResult(ActivityResult result) {\n            if (result.getResultCode()\
  \ == Activity.RESULT_OK) {\n                Intent data = result.getData();\n  \
  \              // 处理返回数据的代码\n            }\n        }\n    });\n```\n\n一旦启动器准备就绪，就可以如下所示调用它并传递要启动的\
  \ `intent`：\n\n```java\nIntent i = new Intent(this, ActivityB.class);\n...\nstartForResult.launch(i);\n\
  ```\n\n要将数据返回给父活动，子活动必须实现 `finish()` 方法，该方法的目的是创建一个包含要返回数据的新 `intent` 对象，然后调用封装的活动的\
  \ `setResult()` 方法，传递一个结果代码（result code）和包含返回数据的 `intent`。结果代码通常为 `RESULT_OK` 或\
  \ `RESULT_CANCELED`，但也可以根据开发者的需求使用自定义值。如果子活动崩溃，父活动将接收到 `RESULT_CANCELED` 结果代码。\n\
  \n例如，以下代码说明了典型的子活动 `finish()` 方法：\n\n```java\npublic void finish() {\n    Intent\
  \ data = new Intent();\n    data.putExtra(\"returnString\", \"Message to parent\
  \ activity\");\n    setResult(RESULT_OK, data);\n    super.finish();\n}\n```\n\n\
  ### 53.4 隐式意图（Implicit Intents）\n\n与引用要启动活动类的显式意图不同，隐式意图通过指定要执行的操作（action）和接收活动处理的数据类型来标识要启动的活动。例如，类型为\
  \ `ACTION_VIEW`的操作辅以 `URI` 对象形式的网页 URL，将指示 Android 系统搜索并随后启动一个具有网络能力的活动。以下隐式意图在\
  \ Android 设备上执行时，将导致指定的网页在浏览器活动中显示：\n\n```java\nIntent intent = new Intent(Intent.ACTION_VIEW,\
  \ Uri.parse(\"https://www.ebookfrenzy.com\"));\nstartActivity(intent);\n```\n\n\
  当活动发布上述隐式意图时，Android 系统将通过一种称为“意图解析”（intent resolution）的过程搜索设备上能够处理 `http` 方案 `ACTION_VIEW`\
  \ 请求的活动。在系统使用隐式意图启动活动之前，该活动必须经过用户的验证或启用。如果这两个条件都不满足，该活动将不会被意图启动。在探索这两个选项之前，我们首先需要讨论意图过滤器（intent\
  \ filters）。\n\n### 53.5 使用意图过滤器\n\n意图过滤器是活动向 Android 意图过程“宣告”其支持的操作和数据能力的机制。这些声明还包括了执行链接验证所需的设置。以下\
  \ `AndroidManifest.xml` 文件说明了名为 `WebView` 的应用中一个名为 `WebActivity` 的活动的配置，并带有适当配置的意图过滤器：\n\
  \n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<application\n    android:allowBackup=\"\
  true\"\n    android:icon=\"@mipmap/ic_launcher\"\n    android:label=\"@string/app_name\"\
  \n    android:roundIcon=\"@mipmap/ic_launcher_round\"\n    android:supportsRtl=\"\
  true\"\n    android:theme=\"@style/Theme.WebView\">\n    <activity android:name=\"\
  WebActivity\"\n        android:exported=\"true\">\n        <intent-filter android:autoVerify=\"\
  true\">\n            <action android:name=\"android.intent.action.VIEW\" />\n  \
  \          <category android:name=\"android.intent.category.BROWSABLE\" />\n   \
  \         <category android:name=\"android.intent.category.DEFAULT\" />\n      \
  \      <data android:scheme=\"https\" />\n            <data android:host=\"www.ebookfrenzy.com\"\
  />\n        </intent-filter>\n    </activity>\n</application>\n```\n\n此清单文件配置了 `WebActivity`\
  \ 活动，使其在另一个活动通过隐式意图包含 `https://www.ebookfrenzy.com` 时响应启动。例如，以下代码将启动 `WebActivity`\
  \ 活动（假设 `WebView` 应用已被用户验证或启用为支持链接）：\n\n```java\nIntent intent = new Intent(Intent.ACTION_VIEW,\
  \ Uri.parse(\"https://www.ebookfrenzy.com\"));\nstartActivity(intent);\n```\n\n\
  ### 53.6 自动链接验证\n\n在 Android 设备上使用网络链接启动活动被认为存在潜在的安全风险。为了最小化这种风险，用于启动意图的链接必须经过自动验证，或者由用户在上添加为支持链接。要启用自动验证，目标活动中相应的意图声明必须将\
  \ `autoVerify` 设置为 `true`：\n\n```xml\n<intent-filter android:autoVerify=\"true\"\
  >\n...\n</intent-filter>\n```\n\n接下来，链接 URL 需要与基于应用链接的网站建立关联。这是通过创建一个名为 `assetlinks.json`\
  \ 的数字资产链接文件并将其安装在网站的 `.well-known` 文件夹中实现的。数字资产链接文件包含一个关系声明（relation），允许目标应用使用网站的链接\
  \ URL，以及一个目标声明（target），声明了配套应用的包名和 SHA-256 证书指纹。一个典型的资产链接文件可能如下所示：\n\n```json\n\
  [{\n  \"relation\": [\"delegate_permission/common.handle_all_urls\"],\n  \"target\"\
  : {\n    \"namespace\": \"android_app\",\n    \"package_name\": \"com.ebookfrenzy.mywebview\"\
  ,\n    \"sha256_cert_fingerprints\": [\n      \"<your certificate fingerprint here>\"\
  ]\n    ]\n  }\n}]\n```\n\n\n\n\n\n请注意，你可以手动创建此文件，也可以使用以下 URL 提供的在线工具生成：\n\n[`developers.google.com/digital-asset-links/tools/generator`](https://developers.google.com/digital-asset-links/tools/generator)\n\
  \n在进行 Android 开发时，命名空间值始终设置为 `\"android_app\"`，而包名对应于由 intent 启动的 app 包。最后，证书指纹是用于构建应用的的哈希值。当你测试应用时，这将是包含在\
  \ `debug.keystore` 文件中的调试证书。在 Windows 系统上，Android Studio 将此文件存储在以下位置：\n\n`\\Users\\\
  <your user name>\\.android\\debug.keystore`\n\n在 macOS 和 Linux 系统上，可以在以下位置找到文件：\n\
  \n`$HOME/.android/debug.keystore`\n\n一旦找到该文件，可以在终端或命令提示窗口中运行以下命令来获取 SHA 256 指纹：\n\
  \n```bash\nkeytool -list -v -keystore <path to debug.keystore file here>\n```\n\n\
  当提示输入密码时，输入 `\"android\"`，随后将出现包含 SHA 256 指纹的输出：\n\n证书指纹：\n\nSHA1: 11:E8:66:11:B6:94:3D:AA:7E:50:63:99:77:B8:6A:90:FF:B6:9C:6D\n\
  \nSHA256: 7F:EE:E3:C8:38:41:C3:EA:11:56:83:94:2A:4C:D2:EA:A0:69:F8:96:D1:17:77:02:46:EC:AD:6E:3C:64:A9:29\n\
  \n当你准备好构建应用的发布版本时，你需要确保将发布版的 SHA 256 指纹添加到资源文件中。关于生成发布密钥库（keystore）文件的详情，请参见 “创建、测试和上传\
  \ Android App Bundle” 章节。一旦拥有了发布密钥库文件，对其运行上述 `keytool` 命令即可获取指纹。\n\n一旦你将数字资源文件放在网站的正确位置，请在设备或模拟器上安装应用并等待\
  \ 30 秒以验证链接。要检查验证状态，请在命令行或终端提示符运行运行命令：\n\n```bash\nadb shell pm get-app-links --user\
  \ cur com.example.mywebview\n```\n\n结果输出应包含链接已验证的确认：\n\n```text\ncom.example.mywebview:\n\
  \    ID: 0e399bca-bf58-4cfc-8c7b-d1a6c3b065ec\n    Signatures: [7F:EE:E3:C8:38:41:C3:EA:11:56:83:94:2A:4C:D2:EA:A0:69:F8:96:D1:17:77:02:46:EC:AD:6E:3C:64:A9:29]\n\
  \    Domain verification state:\n      www.ebookfrenzy.com: verified\n    User 0:\n\
  \      Verification link handling allowed: true\n      Selection state:\n      \
  \  Disabled:\n          www.ebookfrenzy.com\n```\n\n你也可以通过设备或模拟器上的 `Settings` 应用，按照以下步骤检查状态：\n\
  \n1. 启动 `Settings` 应用。\n2. 从主列表中选择 `Apps`。\n3. 从已安装的应用列表中找到并选择你的应用。\n4. 在应用的设置页面上，选择\
  \ `Open by Default`（默认打开）选项。\n\n显示后，该页面应指示链接已通过验证，如 图 53-1 所示：\n\n![](img/as_verified_app_link.jpg)\n\
  \n图 53-1\n\n要查看哪些链接已通过验证，请点击上图中箭头指示的图标按钮以显示以下面板：\n\n![](img/as_verified_links.jpg)\n\
  \n图 53-2\n\n`assetlinks.json` 文件可以包含多个数字资源链接，这可能允许单个网站关联到多个应用。如果你无法使用自动链接验证，则需要在应用中添加代码来提示用户手动启用链接。\n\
  \n### 53.7 手动启用链接\n\n在无法通过上述步骤自动验证链接的情况下，唯一的选择是请求用户手动启用应用链接。这涉及启动目标应用在 `Settings`\
  \ 应用中的 `Open by Default` 界面，用户可以在那里启用链接。由于 `Open by Default` 界面的突然出现可能会让普通用户感到困惑，建议在启动\
  \ `Settings` 应用之前显示一个说明对话框。\n\n为了给用户提供手动启用链接的选项，需要在启动 `Settings` 之前执行以下代码：\n\n```java\n\
  // 此处编写代码以显示说明需要启用链接的对话框\nIntent intent = new Intent(Settings.ACTION_OPEN_BY_DEFAULT,\
  \ Uri.parse(\"package:com.example.mywebview\"));\nstartActivity(intent);\n```\n\n\
  上述示例将显示应用的默认打开设置，用户可以在那里点击添加：\n\n![](img/as_verified_link.jpg)\n\n图 53-3\n\n点击后，将出现一个带有链接的对话框，如\
  \ 图 53-4 所示：\n\n![](img/as_adding_link.jpg)\n\n图 53-4\n\n### 53.8 检查 Intent 的可用性\n\
  \n假设某个活动一定适用于某个 intent 是不明智的，因为缺少匹配项通常会导致应用程序崩溃。幸运的是，可以检查特定 intent 的可用性。可以使用以下方法检查活动类型的可用性：\n\
  \n```java\npublic static boolean isIntentAvailable(Context context, String action)\
  \ {\n    final PackageManager packageManager = context.getPackageManager();\n  \
  \  final Intent intent = new Intent(action);\n    List<ResolveInfo> list = packageManager.queryIntentActivities(intent,\
  \ PackageManager.MATCH_DEFAULT_ONLY);\n    return list.size() > 0;\n}\n```\n\n###\
  \ 53.9 总结\n\nIntent 是一个 Android 活动启动另一个活动的消息传递机制。显式 intent 通过引用接收应用的类名来启动特定的活动。显式\
  \ intent 通常（但不限于）用于启动同一个应用程序内的活动。隐式 intent 指明了要执行的操作和要处理的数据类型，并让 Android 运行时找到匹配的活动进行启动。在使用式\
  \ intent 时，安全限制要求在启动意之前，包含目标活动的应用必须经过自动验证或由用户手动启用。自动验证涉及在链接 URL 对应的网站上放置数字资源文件。\n\
  \n活动可以通过将键值对形式的数据封装到 intent 对象中向接收活动发送数据。\n\n### 54. Android 显式 Intent – 实例\n\n\
  “Android Intent 概述” 章节涵盖了使用 intent 启动活动的理论。本章将通过创建一个示例应用程序将这些理论付诸实践。\n\n\n\n\n\n\
  在本章创建的 Android Studio 项目中将演示如何使用显式意图（explicit intent）启动活动，包括在发送和接收活动之间传输数据。下一章（Android\
  \ 隐式意图——实例演示）将演示如何使用隐式意图（implicit intents）。\n\n## 54.1 创建显式意图示例应用程序\n\n从欢迎界面选择 `New\
  \ Project` 选项，在弹出的新项目对话框中，点击 `Next` 按钮之前先选择 `Empty Activity` 模板。\n\n在 `Name` 字段中输入\
  \ `ExplicitIntent`，并指定 `com.ebookfrenzy.explicitintent` 为包名。在点击 `Finish` 按钮之前，将\
  \ `Minimum` `API` 级别更改设置为 `API 26: Android 8.0 (Oreo)`，并将 `Language` 菜单更改为 `Java`。按照第\
  \ 11.8 将项目迁移到 View Binding 节列出的步骤，将项目转换为使用 `view binding`。\n\n## 54.2 设计 MainActivity\
  \ 的用户界面布局\n\n`MainActivity` 的用户界面将由一个 `ConstraintLayout` 视图组成，其中包含 `EditText`（纯文本）、`TextView`\
  \ 和 `Button` 视图，分别为 `editText1`、`textView1` 和 `button1`。使用 `Project` 工具窗口找到 `MainActivity`\
  \ 的 `activity_main.xml` 资源文件（位于 `app -> res -> layout`），并双击将其加载到 Android Studio\
  \ 布局编辑器工具中。选择默认的“Hello World!” `TextView` 并使用 `Attributes` 工具窗口为其分配 ID 为 `textView1`。\n\
  \n从调色板拖入一个 `Button` 对象并进行放置，使其水平居中并位于 `TextView` 底部边缘下方。更改 `text` 属性使其显示为“Send Text”，并配置\
  \ `onClick` 属性以调用名为 `sendText` 的方法。\n\n接下来，添加一个 `Plain Text` 对象，使其水平居中并位于 `TextView`\
  \ 顶部边缘上方。使用 `Attributes` 工具窗口移除分配给 `text` 属性的“Name”字符串，并将 `ID` 设置为 `editText1`。布局完成后，点击工具栏上的\
  \ `Infer constraints` 按钮添加适当的约束：\n\n![](img/Image24342.jpg)\n\n图 54-1\n\n最后，点击布局编辑器窗口右上角的红色警告按钮，并使用生成的面板将“Send\
  \ Text”字符串提取到名为 `send_text` 的资源中。布局完成后，用户界面应该看起来像图 54-2 所示所示：\n\n![](img/as_4.1_explicit_intent_ui.jpg)\n\
  \n图 54-2\n\n## 54.3 创建第二个活动类\n\n当用户触摸“Send Text”按钮时，将发布一个意图（intent），请求启动第二个活动，用户可以在其中输入响应。因此，下一步是创建第二个活动。在\
  \ `Project` 工具窗口中，右键点击 `app -> java` 下的 `com.ebookfrenzy.explicitintent` 包名，选择 `New\
  \ -> Activity -> Empty Activity` 菜单选项，显示如图 54-3 所示的新 Android Activity 对话框：\n\n![](img/as_4.2_intent_new_java_activity.jpg)\n\
  \n图 54-3\n\n在 `Activity Name` 和 `Title` 字段中输入 `SecondActivity`，并将布局文件命名为 `activity_second`，将\
  \ `Language` 菜单更改为 `Java`。由于此活动在应用程序启动时不会启动（而是在按钮时通过 `MainActivity` 的意图启动），因此在点击\
  \ `Finish` 按钮之前确保禁用 `Launcher Activity` 选项很重要。\n\n## 54.4 设计 SecondActivity 的用户界面布局\n\
  \n第二个活动的用户界面所需的元素包括 `Plain Text` `EditText`、`TextView` 和 `Button` 视图。根据这些要求，将 `activity_second.xml`\
  \ 布局加载到布局编辑器工具中并添加视图。\n\n在设计过程中，注意按钮视图上的 `onClick` 属性已配置为调用名为 `returnText` 的方法，TextView\
  \ 和 EditText 视图分别分配了 ID `textView2` 和 `editText2`。完成后，布局应像图 54-4 所示。注意按钮上的文本（显示为“Return\
  \ Text”）已提取到名为 `return_text` 的字符串资源。\n\n布局完成后，点击 `Infer constraints` 工具栏按钮为布局添加必要的约束：\n\
  \n![](img/as_4.1_explicit_intent_ui_2.jpg)\n\n图 54-4\n\n## 54.5 检查清单文件（Manifest）\n\
  \n为了让 `MainActivity` 能够使用意图启动 `SecondActivity`，`AndroidManifest.xml` 文件中需要存在 `SecondActivity`\
  \ 的项。在 `Project` 工具窗口中找到此文件（`app -> manifests`），双击将其加载到编辑器并验证 Android Studio 已自动为活动添加了条目：\n\
  \n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<manifest xmlns:android=\"\
  http://schemas.android.com/apk/res/android\">\n    ...（此处省略部分代码，以实际为准）\n</manifest>\n\
  ```\n\n在第二个活动创建并列在清单之后，现在是在 `MainActivity` 中编写代码来发布意图了。\n\n## 54.6 创建意图\n\n`MainActivity`\
  \ 的目标是在用户触摸“Send Text”按钮时创建一个意图。作为意图创建过程的一部分，输入 `EditText` 的问题字符串将作为键值对添加到意图对象中。当为\
  \ `MainActivity` 创建用户界面时，按钮对象已配置为用户点击时调用 `sendText()` 方法。现在需要按照如下所示将方法添加到 `MainActivity`\
  \ 类 `MainActivity.java` 源文件中：\n\n```java\npackage com.ebookfrenzy.explicitintent;\n\
  \nimport android.content.Intent;\nimport android.view.View;\n\npublic class MainActivity\
  \ extends AppCompatActivity {\n    public void sendText(View view) {\n        Intent\
  \ i = new Intent(this, SecondActivity.class);\n        String myString = binding.editText1.getText().toString();\n\
  \        i.putExtra(\"qString\", myString);\n        startActivity(i);\n    }\n\
  }\n```\n\n`sendText()` 方法的代码遵循“Android 意图概述`中概述的技术。首先，创建一个新的 `Intent` 实例，并将当前活动和\
  \ `SecondActivity` 类名作为参数。接下来，将输入 `EditText` 对象的文本作为键值对添加到意图对象中，并通过调用 `startActivity()`\
  \ 启动意图，传递意图对象作为参数。\n\n编译并运行应用程序，触摸“Send Text”按钮以启动 `SecondActivity`。使用返回按钮（位于显示器底工具栏）或在较新的\
  \ Android 版本上从屏幕边缘滑动返回 `MainActivity` 屏幕。\n\n## 54.7 提取意图数据\n\n\n\n\n既然 `SecondActivity`\
  \ 正在从 `MainActivity` 启动，下一步是提取 `intent` 中包含的 `String` 数据值，并将其赋值给 `SecondActivity`\
  \ 用户界面中的 `TextView` 对象。这涉及到在 `SecondActivity.java` 源文件的 `onCreate()` 方法中添加一些代码，同时还需要调整\
  \ activity 以使用视图绑定（view binding）：\n\n```java\npackage com.ebookfrenzy.explicitintent;\n\
  \nimport androidx.appcompat.app.AppCompatActivity;\n\nimport android.os.Bundle;\n\
  \nimport android.content.Intent;\n\nimport android.view.View;\n\nimport com.ebookfrenzy.explicitintent.databinding.ActivitySecondBinding;\n\
  \npublic class SecondActivity extends AppCompatActivity {\n    private ActivitySecondBinding\
  \ binding;\n\n    public void onCreate(Bundle savedInstanceState) {\n        super.onCreate(savedInstanceState);\n\
  \        setContentView(R.layout.SecondActivity);\n        binding = ActivitySecondBinding.inflate(getLayoutInflater());\n\
  \        View view = binding.getRoot();\n        setContentView(view);\n       \
  \ Bundle extras = getIntent().getExtras();\n        if (extras == null) {\n    \
  \        return;\n        }\n        String qString = extras.getString(\"qString\"\
  );\n        binding.textView2.setText(qString);\n    }\n}\n```\n\n在模拟器或物理 Android\
  \ 设备上编译并运行应用程序。在点击“Send Text”按钮之前，在 `MainActivity` 的文本框中输入一些文本。现在，消息应该出现在 `SecondActivity`\
  \ 用户界面的 `TextView` 组件上。\n\n### 54.8 将 SecondActivity 作为子 Activity\n\n为了让 `SecondActivity`\
  \ 能够向 `MainActivity` 返回数据，`SecondActivity` 必须作为 `MainActivity` 的子 activity 启动。这意味着我们需要调用\
  \ `registerForActivityResult()` 并声明一个回调处理器，以便在 `SecondActivity` 返回时调用它。该回调将提取 `SecondActivty`\
  \ 返回的数据并将其显示在 `textView1` 上。\n\n调用 `registerForActivityResult()` 会返回一个 `ActivityResultResultLauncher`\
  \ 实例，可以在 `sendText()` 内部调用它来启动 intent。编辑 `MainActivity.java` 文件使其内容如下：\n\n```java\n\
  import android.app.Activity;\nimport androidx.activity.result.ActivityResult;\n\
  import androidx.activity.result.ActivityResultCallback;\nimport androidx.activity.result.ActivityResultLauncher;\n\
  import androidx.activity.result.contract.ActivityResultContracts;\n\npublic class\
  \ MainActivity extends AppCompatActivity {\n    ActivityResultLauncher<Intent> startForResult\
  \ = registerForActivityResult(\n            new ActivityResultContracts.StartActivityForResult(),\n\
  \            new ActivityResultCallback<ActivityResult>() {\n                @Override\n\
  \                public void onActivityResult(ActivityResult result) {\n       \
  \             if (result.getResultCode() == Activity.RESULT_OK) {\n            \
  \            Intent data = result.getData();\n                        String returnString\
  \ = data.getExtras().getString(\"returnData\");\n                        binding.textView1.setText(returnString);\n\
  \                    }\n                }\n            });\n}\n```\n\n### 54.9 从子\
  \ Activity 返回数据\n\n为了让 `SecondActivity` 能够向 `MainActivity` 返回数据，`SecondActivity`\
  \ 必须作为 `MainActivity` 的子 activity 启动。这意味着我们需要调用 `registerForActivityResult()` 并声明一个回调处理器，以便在\
  \ `SecondActivity` 返回时调用它。该回调将提取 `SecondActivty` 返回的数据并将其显示在 `textView1` 上。\n\n\
  调用 `registerForActivityResult()` 会返回一个 `ActivityResultResultLauncher` 实例，可以在 `sendText()`\
  \ 内部调用它来启动 intent。编辑 `MainActivity.java` 文件使其内容如下：\n\n### 54.10 测试应用程序\n\n在模拟器或物理\
  \ Android 设备上编译并运行应用程序。在点击“Send Text”按钮之前，在 `MainActivity` 的文本框中输入一些文本。现在，消息应该出现在\
  \ `SecondActivity` 用户界面的 `TextView` 组件上。\n\n### 54.11 总结\n\n在上一章涵盖了 intent 的基础知识后，本章的目标是通过创建一个应用程序项目，演示显式意（explicit\
  \ intents）的使用，以及父 activity 与子 activity 之间的数据传输。\n\n下一章将通过一个示例来演示隐式意（implicit intents）。\n\
  \n# 55. Android 隐式意 – 完整实例演示\n\n在本章中，将在 Android Studio 中创建一个示例应用程序，以演示隐式意的实际实现。目标是创建并发送一个\
  \ intent，请求加载并向用户显示特定页面的内容。由于示例应用程序本身不包含能够执行此任务的 activity，因此将发布一个隐式意，以便 Android\
  \ 解析算法能够从另一个应用程序中识别并启动合适的 activity。这很可能是 Android 操作系统自带的 Chrome 浏览器的 activity。\n\
  \n在成功启动内置浏览器后，将创建一个包含能够显示网页的 activity 的新项目。它将被安装到设备或模拟器上，并用于演示隐式意和链接验证。\n\n## 55.1\
  \ 创建 Android Studio 隐式意项目\n\n从欢迎界面选择 New Project（新建项目）选项，在弹出的新项目对话框中，点击 Next（下一步）之前选择\
  \ Empty Activity 模板。\n\n在 Name 字段输入 `ImplicitIntent`，并将包名为 `com.ebookfrenzy.implicitintent`。由于此示例将使用最近\
  \ Android 版本才支持的功能，在点击 Finish（完成）按钮之前，将 Minimum API level 设置更改为 `API 31: Android\
  \ 12.0 (S)`，并将语言菜单改为 `Java`。\n\n## 55.2 设计用户界面\n\n`MainActivity` 类的用户界面非常简单，仅由 `ConstraintLayout`\
  \ 和两个 `Button` 对象组成。在 Project 工具窗口中，找到 `app -> res -> layout -> activity_main.xml`\
  \ 文件并双击将其加载到布局编辑器工具中。\n\n删除默认的 `TextView`，并在自动连接（Autoconnect）模式下，在布局中放置 `Button`\
  \ 组件，使其外观如下所示：\n\n![](img/as_implicit_intent_ui.jpg)\n\n图 55-1\n\n\n\n\n\n如上所述，隐式意将在名为\
  \ `showWebPage()` 的方法内部创建并发布，该方法需要在 `MainActivity` 类中实现，该类的代码位于 `MainActivity.java`\
  \ 源文件中。在 Project 工具窗口中找到该文件并双击它将其加载到编辑面板。加载后，修改代码以添加 `showWebPage()` 和 `enableLink()`\
  \ 方法以及一些必要的导入项：\n\n```java\npackage com.ebookfrenzy.implicitintent;\n\nimport androidx.appcompat.app.AppCompatActivity;\n\
  \nimport android.os.Bundle;\n\nimport android.net.Uri;\nimport android.content.Intent;\n\
  import android.view.View;\n\npublic class MainActivity extends AppCompatActivity\
  \ {\n    @Override\n    protected void onCreate(Bundle savedInstanceState) {\n \
  \       super.onCreate(savedInstanceState);\n        setContentView(R.layout.activity_implicit_intent);\n\
  \    }\n\n    public void showWebPage(View view) {\n        Intent intent = new\
  \ Intent(Intent.ACTION_VIEW,\n                    Uri.parse(\"https://www.ebookfrenzy.com\"\
  ));\n        startActivity(intent);\n    }\n\n    public void enableLink(View view)\
  \ {\n    }\n}\n```\n\n`showWebPage()` 方法执行的任务实际上非常简单。首先，创建一个新的意图对象。然而，代码并没有指定意图的类名，而是使用\
  \ `ACTION_VIEW` 选项指示了意图的性质（向用户显示某些内容）。意图对象还包含一个包含要显示的 URL 的 `URI`。这告诉 Android 意图解析器系统，该\
  \ Activity 请求显示一个网页。然后通过调用 `startActivity()` 方法发布该意图。\n\n在模拟器或物理 Android 设备上编译并运行应用程序，一旦运行，点击“Show\
  \ Web Page”按钮。点击后，应该会显示一个网络浏览器视图并加载由 URL 指定的网页。此时，一个成功的隐式意图已经执行完毕。\n\n## 55.4 添加第二个匹配的\
  \ Activity\n\n本章的剩余部分将用于演示：当设备上安装了多个符合隐式意图要求的 Activity 时会产生的效果。为了实现这一点，将在设备或模拟器上创建并安装第二个应用程序。首先，在\
  \ Android Studio 中创建一个新项目，应用程序名称设置为 `MyWebView`，并使用与在本章之前创建 ImplicitIntent 项目时相同的\
  \ SDK 配置选项，再次选择 Empty Activity。\n\n如果你有一个可以托管数字资产链接（Digital Asset Links）文件的网站，并想尝试自动验证功能，请在指定包名时使用你的网站\
  \ URL。例如，如果你的网站托管在 `www.mycompany.com`，则包名需要设置为如下：\n\n`com.mycompany.mywebview`\n\
  \n如果你没有网站或不计划使用自动验证，请使用以下包名：\n\n`com.ebookfrenzy.mywebview`\n\n点击 Finish 创建项目，然后按照节\
  \ [11.8 Migrating a Project to View Binding] 中的概述，将项目转换为使用 view bindings。\n\n##\
  \ 55.5 将 Web View 添加到 UI\n\n新 `MyWebView` 项目中包含的唯一 Activity 的用户界面将由一个 Android `WebView`\
  \ 组件的实例组成。在 Project 工具窗口中，找到 `activity_main.xml` 文件（该文件包含 Activity 的用户界面描述），并双击它将其加载到\
  \ Layout Editor 工具中。\n\n在 Design 模式下的 Layout Editor 工具中，选择默认的 `TextView` 组件，并使用键盘删除键将其从布局中移除。\n\
  \n从调色板的 Widgets 部分将一个 `WebView` 对象拖放到现有的 `ConstraintLayout` 视图上，如图 55-2 所示：\n\n\
  ![](img/as_3.5_implicit_intent_webview_ui.jpg)\n\n图 55-2\n\n在继续之前，将 `WebView` 实例\
  \ ID 改为 `webView1`，并使用 Infer constraints 按钮添加任何的约束。\n\n## 55.6 获取意图 URL\n\n当创建用于显示浏览器窗口的隐式意图对象时，显示的网页\
  \ URL 将封装在意图对象的 `Uri` 对象中。`MainActivity` 类中 `onCreate()` 方法的任务是从意图对象中提取此 `Uri`，将其转换为\
  \ URL 字符串并赋值给 `WebView` 对象。为了实现此功能，修改 `MainActivity.java` 文件，使其内容如下：\n\n```java\n\
  package com.ebookfrenzy.mywebview;\n\n.\n.\n\nimport java.net.URL;\nimport android.net.Uri;\n\
  import android.content.Intent;\nimport android.webkit.WebView;\n\npublic class MainActivity\
  \ extends AppCompatActivity {\n    private ActivityMainBinding binding;\n\n    @Override\n\
  \    protected void onCreate(Bundle savedInstanceState) {\n.\n.\n        handleIntent();\n\
  \    }\n\n    private void handleIntent() {\n        Intent intent = getIntent();\n\
  \        Uri data = intent.getData();\n        URL url = null;\n        try {\n\
  \            url = new URL(data.getScheme(), data.getHost());\n        } catch (Exception\
  \ e) {\n            e.printStackTrace();\n        }\n        binding.webView1.loadUrl(url.toString());\n\
  \    }\n}\n```\n\n添加到 `onCreate()` 中的新代码执行了以下任务：\n- 获取导致此 Activity 启动的意图的引用\n- 从意图中提取\
  \ `Uri` 数据\n- 将 `Uri` 数据转换为 `URL` 对象\n- 将 `URL` 加载到 web view\n\nMyWebView 项目的编码部分现在已完成。剩下的工作是修改\
  \ manifest 文件。\n\n## 55.7 修改 MyWebView Manifest 文件\n\n在进行测试之前，必须对 MyWebView manifest\
  \ 文件进行若干更改。首先，该 Activity 需要访问互联网的权限（因为它需要加载网页）。这通过在清单文件中添加权限行来实现：\n\n```xml\n<uses-permission\
  \ android:name=\"android.permission.INTERNET\" />\n```\n\n此外，查看 MyWebView 项目 `AndroidManifest.xml`\
  \ 文件中的 intent filter 部分，会发现以下设置：\n\n```xml\n<intent-filter>\n    <action android:name=\"\
  android.intent.action.MAIN\" />\n    <category android:name=\"android.intent.category.LAUNCHER\"\
  \ />\n</intent-filter>\n```\n\n在上述 XML 中，`android.intent.action.MAIN` 表示该 Activity\
  \ 是应用程序在无数据输入启动时的入口。另一方面，`android.intent.category.LAUNCHER` 指令表明它位于设备的应用程序启动列表中。\n\
  \n由于该 Activity 不需要作为应用程序的入口、无法在没有数据输入（在此情况下为 URL）的情况下运行且不需要出现在启动器中，因此该 Activity\
  \ 的清单文件中不需要 `MAIN` 或 `LAUNCHER` 指令。\n\n然而，`MainActivity` Activity 的意图过滤器需要修改，以指示它可以处理\
  \ `http` 数据方案的 `ACTION_VIEW` 意图操作。\n\nAndroid 要求任何未包含 `MAIN` 和 `LAUNCHER` 但能够处理隐式意图的\
  \ Activity，必须在意图过滤器中包含所谓的可浏览（browsable）和默认类别。因此，修改后的意图过滤器部分应如下所示，其中 `<website url>`\
  \ 替换为你的网站地址或 `www.ebookfrenzy.com`，取决于你在创建 MyWebView 项目时使用的包名：\n\n```xml\n<intent-filter\
  \ android:autoVerify=\"true\">\n    <action android:name=\"android.intent.action.VIEW\"\
  \ />\n    <category android:name=\"android.intent.category.BROWSABLE\" />\n</intent-filter>\n\
  ```\n\n\n\n\n```xml\n    <category android:name=\"android.intent.category.DEFAULT\"\
  \ />\n\n    <data android:scheme=\"https\" />\n\n    <data android:host=\"<website\
  \ url>\"/>\n</intent-filter>\n```\n\n将这些要求结合后得到了完整的 `AndroidManifest.xml` 文件：\n\n\
  ```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<manifest xmlns:android=\"http://schemas.android.com/apk/res/android\"\
  \n    package=\"com.ebookfrenzy.mywebview\">\n    <uses-permission android:name=\"\
  android.permission.INTERNET\" />\n    <application\n        android:allowBackup=\"\
  true\"\n        android:icon=\"@mipmap/ic_launcher\"\n        android:label=\"@string/app_name\"\
  \n        android:roundIcon=\"@mipmap/ic_launcher_round\"\n        android:supportsRtl=\"\
  true\"\n        android:theme=\"@style/Theme.MyWebView\">\n        <activity\n \
  \           android:name=\".MainActivity\"\n            android:exported=\"true\"\
  >\n            <intent-filter android:autoVerify=\"true\">\n                <action\
  \ android:name=\"android.intent.action.VIEW\" />\n                <category android:name=\"\
  android.intent.category.BROWSABLE\" />\n                <category android:name=\"\
  android.intent.category.DEFAULT\" />\n                <data android:scheme=\"https\"\
  \ />\n                <data android:host=\"<website url>\"/>\n            </intent-filter>\n\
  \        </activity>\n    </application>\n</manifest>\n```\n\n通过在 Project 工具窗口中双击文件名，将\
  \ `AndroidManifest.xml` 文件加载到 manifest 编辑器。加载后，修改 XML 以匹配上述更改，记得输入正确的网站 URL。\n\n\
  对 manifest 文件进行适当修改后，新的 activity 已准备好安装到设备上。\n\n## 55.8 在设备上安装 MyWebView 包\n\n在\
  \ MyWebView 主 activity 可以作为隐式意图（implicit intent）的接收者之前，必须将其安装到设备上。这通过正常方式运行应用程序来实现。由于\
  \ manifest 文件既不包含 `android.intent.action.MAIN` 也不包含 `android.intent.category.LAUNCHER`\
  \ 设置，需要指示 Android Studio 安装但不启动应用。要配置此行为，请从工具栏中选择 `app -> Edit configurations…`\
  \ 菜单，如图 55-3 所示：\n\n![](img/as_implicit_intent_run_edit_config.jpg)\n\n图 55-3\n\n\
  在 Run/Debug Configurations 对话框中，将位于 `Launch Options` 区域的 `Launch` 选项改为 `Nothing`，然后点击\
  \ `Apply` 并点击 `OK`：\n\n![](img/as_3.5_implicit_intent_launch_nothing.jpg)\n\n图 55-4\n\
  \n配置好此设置后，照常运行应用。注意应用已安装到设备上，但尚未启动。\n\n## 55.9 测试应用程序\n\n安装 MyWebView 应用后，再次运行 ImplicitIntent\
  \ 并点击 Show Web Page（显示网页）按钮。注意，网页仍然加载到 Chrome 浏览器中，而不是 MyWebView 应用的主 activity。这是因为\
  \ MyWebView activity 尚未经过验证或启用以打开启动意图中包含的链接。要手动启用该链接，需要在 `enableLink()` 方法中添加一些代码。\n\
  \n## 55.10 手动启用链接\n\n在 `enableLink()` 方法中，我们现在需要创建并启动一个意图，以显示 MyWebView 应用的“默认打开”（Open\
  \ by Default）设置界面。将 `MainActivity.java` 文件加载到代码编辑器并修改 `enableLink()` 方法，使其内容如下，确保将\
  \ `<reverse domain>` 替换为 `com.ebookfrenzy` 或您自己的反向域名，取决于您创建 MyWebView 项目时选择的包名：\n\
  \n```java\nimport android.provider.Settings;\n\npublic void enableLink(View view)\
  \ {\n    Intent intent = new Intent(Intent.ACTION_VIEW_BY_DEFAULT);\n    intent.setData(Uri.parse(\"\
  https://<website url>\"));\n    // ... logic\n}\n```\n\n\n\n\n# 广播意图 (Broadcast\
  \ Intents)\n\n广播意图是 `Intent` 对象，通过调用 `Activity` 类中的 `sendBroadcast()`、`sendStickyBroadcast()`\
  \ 或 `sendOrderedBroadcast()` 方法发送（后者在需要获取广播结果时使用）。除了在应用组件之间提供消息传递和事件系统外，广播意图还被 Android\
  \ 系统用于通知感兴趣的应用程序有关关键系统事件（例如外部电源或耳机的连接或断开）。\n\n在创建广播意图时，它必须包含一个动作字符串（action string），此外还可以包含可选的数据和类别字符串（category\
  \ string）。与标准意图一样，数据是结合 `intent` 对象的 `putExtra()` 方法使用键值对添加到广播意图中的。可选的类别字符串可以通过调用\
  \ `addCategory()` 方法分配给广播意图。\n\n标识广播事件的动作字符串必须是唯一的，通常使用应用程序的包名语法。例如，以下代码段创建并发送了一个包含唯一动作字符串和数据的广播意图：\n\
  \n```\nIntent intent = new Intent();\nintent.setAction(\"com.example.Broadcast\"\
  );\nintent.putExtra(\"MyData\", 1000);\nsendBroadcast(intent);\n```\n\n上述代码将在运行\
  \ Android 3.0 之前的设备上成功启动相应的广播接收器。然而，在较新的 Android 版本上，该意图不会被广播接收器接收。这是因为 Android\
  \ 3.0 引入了启动控制安全措施，防止已停止应用程序的组件通过意图启动。如果应用程序刚刚安装且尚未运行过，或者被用户使用设备上的应用程序管理器手动停止，则该应用程序被认为处于停止状态。然而，为了规避这个问题，可以在发送意图之前向意图添加一个标志，以表示允许该意图启动停止应用程序的组件。该标志为\
  \ `FLAG_INCLUDE_STOPPED_PACKAGES`，并将按照此处对述代码段的适配方式使用：\n\n```\nIntent intent = new\
  \ Intent();\nintent.addFlags(Intent.FLAG_INCLUDE_STOPPED_PACKAGES);\nintent.setAction(\"\
  com.example.Broadcast\");\nintent.putExtra(\"MyData\", 1000);\nsendBroadcast(intent);\n\
  ```\n\n## 56.2 广播接收器概述 (An Overview of Broadcast Receivers)\n\n应用程序通过注册广播接收器来监听特定的广播意图。广播接收器通过扩展\
  \ Android `BroadcastReceiver` 类并重写 `onReceive()` 方法来实现。广播接收器随后可以在代码中注册（例如在 activity\
  \ 内部），也可以在清单文件中注册。注册实现部分的后续工作涉及创建意图过滤器（intent filters），以指示接收器需要监听的特定广播意图。这是通过引用广播意图的动作字符串来实现的。当检测到匹配的广播时，会调用广播接收器的\
  \ `onReceive()` 方法，此时该方法有 5 秒钟的时间来执行任何必要的任务然后返回。需要注意的是，广播接收器不需要一直运行。如果检测到匹配的意图，Android\
  \ 运行时系统会在调用 `onReceive()` 方法之前自动启动广播接收器。\n\n以下代码列出了一个模板化的广播接收器子类：\n\n```\npackage\
  \ com.example.broadcastdetector;\n\nimport android.content.BroadcastReceiver;\n\
  import android.content.Context;\nimport android.content.Intent;\n\npublic class\
  \ MyReceiver extends BroadcastReceiver {\n    public MyReceiver() {\n    }\n\n \
  \   @Override\n    public void onReceive(Context context, Intent intent) {\n   \
  \     // 在检测到广播时\n        //在此处实现要执行的代码\n    }\n}\n```\n\n在清单文件中注册广播接收器时，必须为接收器添加一个\
  \ `<receiver>` 条目。示例清单文件注册了上述示例广播接收器：\n\n```xml\n<?xml version=\"1.0\" encoding=\"\
  utf-8\"?>\n<manifest xmlns:android=\"http://schemas.android.com/apk/res/android\"\
  \n    package=\"com.example.broadcastdetector.broadcastdetector\"\n    android:versionCode=\"\
  1\"\n    android:versionName=\"1.0\" >\n    <uses-sdk android:minSdkVersion=\"17\"\
  \ />\n    <application\n        android:icon=\"@mipmap/ic_launcher\"\n        android:label=\"\
  @string/app_name\" >\n        <receiver android:name=\"MyReceiver\" >\n        </receiver>\n\
  \    </application>\n</manifest>\n```\n\n在运行 Android 8.0 之前的 Android 版本上，与接收器关联意图过滤器可以放置在清单文件的接收器元素中，如下：\n\
  \n```xml\n<receiver android:name=\"MyReceiver\" >\n    <intent-filter>\n       \
  \ <action android:name=\"com.example.Broadcast\" >\n    </intent-filter>\n</receiver>\n\
  ```\n\n在 Android 8.0 或更高版本上，接收器必须在代码中使用 `registerReceiver()` 方法结合配置适当的 `IntentFilter`\
  \ 进行注册：\n\n```java\nIntentFilter filter = new IntentFilter(\"com.example.Broadcast\"\
  );\nMyReceiver receiver = new MyReceiver();\nregisterReceiver(receiver, filter);\n\
  ```\n\n当在代码中注册的广播接收器不再需要时，可以通过 activity 类的 `unregisterReceiver()` 方法取消注销，并将接收器对象作为参数传递。例如：\n\
  \n```\nunregisterReceiver(receiver);\n```必须记住，某些系统广播意图只有在代码中注册而非清单文件中运行时才能被广播接收器检测到。可以在此处查看\
  \ Android `Intent` 类文档，获取在线的详细概述：[`developer.android.com/reference/android/content/Intent`](https://developer.android.com/reference/android/content/Intent)\n\
  \n## 56.3 从广播获取结果 (Obtaining Results from a Broadcast)\n\n当使用 `sendBroadcast()`\
  \ 方法发送广播意图时，发起的活动无法从获取广播的广播接收器获取结果。如果需要返回结果，则必须使用 `sendOrderedBroadcast()` 方法。当使用此方法发送广播意图时，它将按顺序传递给每个感兴趣的广播接收器。\n\
  \n调用 `sendOrderedBroadcast()` 时需要多个参数，包括另一个广播接收器（称为结果接收器），在所有广播接收器处理意图后通知它，以及一组接收器可以在其中放置结果数据的引用。当所有广播接收器都获得了处理广播的机会，将调用结果接收器的\
  \ `onReceive()` 方法并传递结果数据。\n\n## 56.4 粘性广播意图 (Sticky Broadcast Intents)\n\n默认情况下，广播意图在发送并被感兴趣的广播接收器处理后就会消失。然而，广播意图可以定义为“粘性”。粘性意图及其包含的数据在执行完成后仍然存在于系统中。粘性广播意图中存储的数据可以通过\
  \ `registerReceiver()` 方法的返回值获取，使用通常参数（广播接收器和意图过滤器对象的引用）。许多 Android 系统广播都是粘性的，一个典型的例子是与电量状态相关的广播。\n\
  \n粘性广播可以随时通过调用 `removeStickyBroadcast()` 方法移除，并将要移除的广播意图作为参数传递。\n\n## 56.5 广播意图示例\
  \ (The Broadcast Intent Example)\n\n\n\n\n本章剩余部分将通过一个基于 Android Studio 的示例来演示广播意（broadcast\
  \ intents）的操作。首先，将创建一个简单的应用程序，用于发送自定义广播意。随后将创建一个相应的广播接收器，当检测到广播时，会在 Android 设备的屏幕上显示消息。最后，将修改广播接收器以检测系统发出的外部电源已断开的通知。\n\
  \n## 56.6 创建示例应用程序\n\n在欢迎界面选择 `New Project` ，在弹出的新项目对话框中，点击 `Next` 按钮之前，选择 `Empty\
  \ Activity` 模板。\n\n在 `Name` 字段中输入 `SendBroadcast`，并指定 `com.ebookfrenzy.sendbroadcast`\
  \ 为包名。在点击 `Finish` 按钮之前，将 `Minimum API level` 设置更改为 `API 26: Android 8.0 (Oreo)`，并将\
  \ `Language` 菜单设置为 `Java`。\n\n新项目创建后，在 Project 工具窗口的 `app -> res -> layout` 下找到并加载\
  \ `activity_main.xml` 布局文件。在 `Design` 模式下使用 `Layout Editor` 工具，将 `TextView` 对象替换为\
  \ `Button` 视图并设置 `text` 属性使其显示为“Send Broadcast”。设置好文本值后，按照通常步骤将字符串提取为名为 `send_broadcast`\
  \ 的资源。\n\n在布局中仍选中按钮的情况下，在 Attributes 面板中找到 `onClick` 属性并将其配置为调用名为 `broadcastIntent`\
  \ 的方法。\n\n## 56.7 创建并发送广播意\n\n创建好 `SendBroadcast` 应用程序的框架后，现在是实现发送广播意的代码了。这涉及到实现之前指定的、作为用户界面\
  \ `Button` 视图 `onClick` 目标的 `broadcastIntent()` 方法。找到并双击 `MainActivity.java` 文件，并修改它以添加创建和发送广播意的代码。修改后，该类的源代码如下：\n\
  \n```java\npackage com.ebookfrenzy.sendbroadcast;\n\nimport androidx.appcompat.app.AppCompatActivity;\n\
  \nimport android.os.Bundle;\n\nimport android.content.Intent;\n\nimport android.view.View;\n\
  \npublic class MainActivity extends AppCompatActivity {\n\n.\n\n.\n\n    public\
  \ void broadcastIntent(View view)\n    {\n        Intent intent = new Intent();\n\
  \        intent.setAction(\"com.ebookfrenzy.sendbroadcast\");\n        intent.addFlags(Intent.FLAG_INCLUDE_STOPPED_PACKAGES);\n\
  \        sendBroadcast(intent);\n    }\n}\n```\n\n注意，在此实例中，意 的 action 字符串为 `com.ebookfrenzy.sendbroadcast`。当在本章后续章节创建广播接收器类时，意图过滤器声明必须匹配此\
  \ action 字符串。\n\n发送广播意的应用程序创建完成。剩下的只需构建一个匹配的广播接收器。\n\n## 56.8 创建广播接收器\n\n要创建广播接收器，需要创建一个子类\
  \ `BroadcastReceiver` 新类。在 Project 工具窗口中，导航到 `app -> java` 并右键点击包名。在弹出的菜单中，选择 `New\
  \ -> Other -> Broadcast Receiver` 选项，将类命名为 `MyReceiver` 并确保选中 `Exported` 和 `Enabled`\
  \ 选项。这些设置允许 Android 系统在需要时启动接收器，并确保该类可以接收设备上其他应用程序发送的消息。配置好类后，点击 `Finish`。\n\n创建后，Android\
  \ Studio 将自动将新的 `MyReceiver.java` 类文件加载到编辑器中，其内容应如下：\n\n```java\npackage com.ebookfrenzy.sendbroadcast;\n\
  \nimport android.content.BroadcastReceiver;\n\nimport android.content.Context;\n\
  \nimport android.content.Intent;\n\npublic class MyReceiver extends BroadcastReceiver\
  \ {\n\n    @Override\n    public void onReceive(Context context, Intent intent)\
  \ {\n        // TODO: This method is called when the BroadcastReceiver is receiving\n\
  \        // an Intent broadcast.\n        throw new UnsupportedOperationException(\"\
  Not yet implemented\");\n    }\n}\n```\n\n如代码所示，Android Studio 为新类生成了一个模板，并为 `onReceive()`\
  \ 方法生成了一个存根。现在需要对该类进行若干更改以实现所需的行为。因此，留在 `MyReceiver.java` 文件中，修改代码如下：\n\n```java\n\
  package com.ebookfrenzy.sendbroadcast;\n\nimport android.content.BroadcastReceiver;\n\
  \nimport android.content.Context;\n\nimport android.content.Intent;\n\nimport android.widget.Toast;\n\
  \npublic class MyReceiver extends BroadcastReceiver {\n\n    @Override\n    public\
  \ void onReceive(Context context, Intent intent) {\n        // TODO: This method\
  \ is called when the BroadcastReceiver is receiving\n        // an Intent broadcast.\n\
  \        throw new UnsupportedOperationException(\"Not yet implemented\");\n   \
  \     Toast.makeText(context, \"Broadcast Detected.\", Toast.LENGTH_LONG).show();\n\
  \    }\n}\n```\n广播接收器的代码现在已完成。\n\n## 56.9 注册广播接收器\n\n项目需要公开接收器的存在，并且必须包含一个意图过滤器来指定接收器感兴趣的广播意。当在上一节创建\
  \ `BroadcastReceiver` 类时，Android Studio 在清单文件中添加了 `<receiver>` 元素。因此，剩下的是在 `MainActivity.java`\
  \ 文件中添加代码以创建意图过滤器并注册接收器：\n\n```java\npackage com.ebookfrenzy.sendbroadcast;\n\n\
  .\n\n.\n\nimport android.content.BroadcastReceiver;\nimport android.content.IntentFilter;\n\
  \n.\n\npublic class MainActivity extends AppCompatActivity {\n    BroadcastReceiver\
  \ receiver;\n\n    @Override\n    protected void onCreate(Bundle savedInstanceState)\
  \ {\n        super.onCreate(savedInstanceState);\n        setContentView(R.layout.activity_main);\n\
  \        configureReceiver();\n    }\n\n    private void configureReceiver() {\n\
  \        IntentFilter filter = new IntentFilter();\n        filter.addAction(\"\
  com.ebookfrenzy.sendbroadcast\");\n        receiver = new MyReceiver();\n      \
  \  registerReceiver(receiver, filter);\n    }\n\n.\n}\n```\n\n在不再需要时注销广播接收器也是重要的：\n\
  \n```java\n@Override\nprotected void onDestroy() {\n    super.onDestroy();\n   \
  \ unregisterReceiver(receiver);\n}\n```\n\n## 56.10 测试广播示例\n\n要测试广播发送器和接收器，请在设备或\
  \ `AVD` 上运行 `SendBroadcast` 应用并等待其显示在屏幕上。运行时，点击按钮，“Broadcast Detected.” 吐信息将弹出几秒后消失。\n\
  \n## 56.11 监听系统广播\n\n本示例的最后一个阶段是修改广播接收器的意图过滤器，以监听外部电源从设备断开时发出的系统意。该 action 是 `android.intent.action.ACTION_POWER_DISCONNECTED`。修改\
  \ `MainActivity.java` 文件中的 `configureReceiver()` 方法以添加此过滤器：\n\n```java\nprivate\
  \ void configureReceiver() {\n    IntentFilter filter = new IntentFilter();\n  \
  \  filter.addAction(\"com.ebookfrenzy.sendbroadcast\");\n    filter.addAction(\"\
  android.intent.action.ACTION_POWER_DISCONNECTED\");\n    receiver = new MyReceiver();\n\
  \    registerReceiver(receiver, filter);\n}\n```\n\n由于 `MyReceiver.java` 文件中的 `onReceive()`\
  \ 方法现在将监听两种类型的广播意，因此值得修改代码使当前意的 action 字符串也显示在吐司消息中。该字符串可以通过调用作为 `onReceive()` 方法参数传递的\
  \ `intent` 对象的 `getAction()` 方法获得：\n\n\n\n\n\n```java\npublic void onReceive(Context\
  \ context, Intent intent) {\n    String message = \"Broadcast intent detected \"\
  \ + intent.getAction();\n    Toast.makeText(context, message, Toast.LENGTH_LONG).show();\n\
  }\n```\n\n通过重新安装修改后的 `SendBroadcast` 程序包来测试接收器。现在点击 `SendBroadcast` 应用程序中的按钮，应该产生一条包含自定义动作字符串的新消息：\n\
  \n`Broadcast intent detected com.ebookfrenzy.sendbroadcast`\n\n接下来，移除当前为 Android\
  \ 设备供电的 USB 连接器，此时接收器应该在吐司消息（toast message）中报告以下内容（在竖屏设备上消息可能会被截断）。如果应用运行在模拟器上，请显示扩展控制面板，选择\
  \ `Battery` 选项并将 `Charger` 连接设置为 `None`。\n\n`Broadcast intent detected android.intent.action.ACTION_POWER_DISCONNECTED`\n\
  \n为了避免在设备每次断开电源时都出现此消息，请在设备上启动 `Settings` 应用并选择 `Apps` 选项。从结果列表中选择 `SendBroadcast`\
  \ 应用并点击 `Uninstall` 按钮。\n\n## 56.12 总结\n\n广播意（Broadcast intents）是一种机制，可以通过它可以发送意以供\
  \ Android 系统上的多个组件消费。广播通过注册 `Broadcast Receiver`（广播接收器）来检测，接收器被配置为监听匹配特定动作字符串的意。通常情况下，广播接收器保持休眠状态，直到检测到匹配的意时被系统唤醒。Android\
  \ 系统还使用广播意发布事件通知，例如低电量警告或外部电源与设备的连接或断开。\n\n除了提供广播意和接收器的概述外，本章还并实现了一个发送广播意的示例，以及一个用于监听自定义广播意和系统广播意的广播接收器实现。\n\
  \n## 57. Android 本地绑定服务 – 实例示例\n\n如上一章所述，绑定服务（Bound services）为实现 Android 服务与一个或多个客户端组件之间的通信提供了一种机制。本章的目标是在[“Android\
  \ 服务概览”]中提供的绑定服务概述的基础上，开始对本地绑定服务进行实例化的实现。\n\n### 57.1 理解绑定服务\n\n提供绑定服务是为了允许应用程序在后台执行任务。多个客户端组件可以绑定到一个绑定服务，并在绑定后，使用多种不同的机制与该服务进行交互。\n\
  \n绑定服务作为 `Android Service` 类的子类被创建，并且至少必须实现 `onBind()` 方法。客户端组件通过调用 `bindService()`\
  \ 方法绑定到服务。对绑定服务的首次绑定请求将导致对该服务的 `onBind()` 方法调用（随后的绑定请求不会触发 `onBind()` 调用）。想要绑定到服务的客户端还必须实现一个\
  \ `ServiceConnection` 子类，该子类包含 `onServiceConnected()` 和 `onServiceDisconnected()`\
  \ 方法，这些方法分别在客户端-服务器连接建立或断开后被调用。在 `onServiceConnected()` 方法的情况下，将向其传递一个 `IBinder`\
  \ 对象，该对象包含了客户端与服务交互所需的信息。\n\n### 57.2 绑定服务交互选项\n\n实现客户端组件与绑定服务之间交互有两种推荐的机制。如果绑定服务是本地的，且与客户端组件属于同一个应用程序（换句话说，它运行在同一个进程中，并且对其他应用程序中的组件不可用），推荐的方法是创建一个\
  \ `Binder` 类的子类并扩展它以为服务提供接口。然后通过 `onBind()` 方法返回该 `Binder` 对象的实例，随后供客户端组件使用该实例直接访问服务中持有的方法和数据。\n\
  \n在绑定服务不是本地的情况下（换句话说，它运行在与客户端组件不同的进程中），最佳交互方式是使用 `Messenger/Handler` 实现。\n\n在本章的剩余部分，将创建一个示例，旨在演示创建、启动和与本地私有绑定服务交互的步骤。\n\
  \n### 57.3 本地绑定服务示例\n\n在本章剩余部分创建的示例应用程序将由一个 activity 和一个绑定服务组成。绑定服务的目的是从系统获取当前时间，并将该信息返回给\
  \ activity，并在那里显示给用户。绑定服务将是本地的，且与 activity 属于同一个应用程序。\n\n从欢迎界面选择 `New Project` 选项，在出现的新项目对话框中，点击\
  \ `Next` 按钮之前选择 `Empty Activity` 模板。\n\n在 `Name` 字段输入 `LocalBound` 并指定 `com.ebookfrenzy.localbound`\
  \ 为包名。在点击 `Finish` 按钮之前，将 `Minimum API level` 设置为 `API 26: Android 8.0 (Oreo)`，并将\
  \ `Language` 菜单设置为 `Java`。使用节 [11.8 将项目迁移到 View Binding] 中的步骤将项目迁移到 view binding。\n\
  \n一旦项目创建，下一步是添加一个新类来作为绑定服务。\n\n### 57.4 向项目添加绑定服务\n\n要向项目添加新类，请在 Project 工具窗口中右键点击包名（位于\
  \ `app -> java -> com.ebookfrenzy.localbound` 下），并选择 `New -> Service -> Service`\
  \ 菜单选项。指定 `BoundService` 为类名，并在点击 `Finish` 创建类之前，确保 `Exported` 和 `Enabled` 选项均已勾选。Android\
  \ Studio 将 `BoundService.java` 文件加载到编辑器中，其内容如下：\n\n```java\npackage com.ebookfrenzy.localbound;\n\
  \nimport android.app.Service;\nimport android.content.Intent;\nimport android.os.IBinder;\n\
  \npublic class BoundService extends Service {\n    public BoundService() {\n\n \
  \   }\n\n    @Override\n    public IBinder onBind(Intent intent) {\n        // TODO:\
  \ 返回服务的通信通道。\n        throw new UnsupportedOperationException(\"Not implemented\"\
  );\n    }\n}\n```\n\n### 57.5 实现 Binder\n\n如前所述，本地绑定服务通过向客户端传递配置适当的 `Binder` 对象来与客户端通信。这是通过在绑定服务类内部创建一个\
  \ `Binder` 子类并通过扩展添加一个或多个供客户端调用的新方法来实现。在大多数情况下，这只需实现一个返回绑定服务实例引用的方法。有了引用，客户端即可直接访问绑定服务内部的数据并调用方法。\n\
  \n因此，为了本示例，需要对上一节创建的模板 `BoundService` 类进行一些更改。首先，需要声明一个 `Binder` 子类。该类将包含一个名为 `getService()`\
  \ 的方法，该方法简单地返回当前服务对象的引用（由 `this` 关键字表示）。根据这些需求，编辑 `BoundService.java` 文件并按如下方式修改：\n\
  \n```java\npackage com.ebookfrenzy.localbound;\n\nimport android.app.Service;\n\
  import android.content.Intent;\nimport android.os.IBinder;\nimport android.os.Binder;\n\
  \npublic class BoundService extends Service {\n    private final IBinder myBinder\
  \ = new MyLocalBinder();\n\n    public BoundService() {\n\n    }\n\n    @Override\n\
  \    public IBinder onBind(Intent intent) {\n```\n\n\n\n\n```java\n// TODO: Return\
  \ the communication channel to the service.\n\n        throw new UnsupportedOperationException(\"\
  Not yet implemented\");\n\n    }\n\n    public class MyLocalBinder extends Binder\
  \ {\n\n        BoundService getService() {\n            return BoundService.this;\n\
  \        }\n    }\n}\n```\n\n对类进行这些更改后，值得花一点回顾一下这里执行的步骤。首先，声明了一个新的 `Binder` 子类（命名为\
  \ `MyLocalBinder`）。该类包含单一方法，其唯一目的是返回 `BoundService` 类当前实例的引用。创建 `MyLocalBinder`\
  \ 类的新实例并将其赋值给 `myBinder` `IBinder` 引用（由于 `Binder` 是 `IBinder` 的子类，这种赋值不存在类型不匹配）。\n\
  \n接下来，需要修改 `onBind()` 方法以返回 `myBinder` 对象的引用，并实现了一个新的公共方法，以便在任何绑定到服务的客户端调用它时，返回当前时间：\n\
  \n```java\npackage com.ebookfrenzy.localbound;\n\nimport java.text.SimpleDateFormat;\n\
  import java.util.Date;\nimport java.util.Locale;\nimport android.app.Service;\n\
  import android.content.Intent;\nimport android.os.IBinder;\nimport android.os.Binder;\n\
  \npublic class BoundService extends Service {\n    private final IBinder myBinder\
  \ = new MyLocalBinder();\n\n    public BoundService() {\n    }\n\n    @Override\n\
  \    public IBinder onBind(Intent intent) {\n        return myBinder;\n    }\n\n\
  \    public String getCurrentTime() {\n        SimpleDateFormat dateformat = new\
  \ SimpleDateFormat(\"HH:mm:ss MM/dd/yyyy\", Locale.US);\n        return (dateformat.format(new\
  \ Date()));\n    }\n\n    public class MyLocalBinder extends Binder {\n        BoundService\
  \ getService() {\n            return BoundService.this;\n        }\n    }\n}\n```\n\
  \n此时，绑定的服务已经完成，并准备好添加到项目清单文件中。在 Project 工具窗口中找到并双击 LocalBound 项目的 `AndroidManifest.xml`\
  \ 文件，一旦将其加载到 Manifest 编辑器中，验证 Android Studio 是否已为该服务添加了如下的 `<service>` 条目：\n\n```xml\n\
  <?xml version=\"1.0\" encoding=\"utf-8\"?>\n<manifest xmlns:android=\"http://schemas.android.com/apk/res/android\"\
  \n    package=\"com.ebookfrenzy.localbound.localbound\" >\n    <application\n  \
  \      android:allowBackup=\"true\"\n        android:icon=\"@mipmap/ic_launcher\"\
  \n        android:label=\"@string/app_name\"\n        android:theme=\"@style/AppTheme\"\
  \ >\n        <service\n            android:name=\".BoundService\"\n            android:enabled=\"\
  true\"\n            android:exported=\"true\" >\n        </service>\n        <activity\n\
  \            android:name=\".MainActivity\" >\n            <intent-filter>\n   \
  \             <action android:name=\"android.intent.action.MAIN\" />\n         \
  \       <category android:name=\"android.intent.category.LAUNCHER\" />\n       \
  \     </intent-filter>\n        </activity>\n    </application>\n</manifest>\n```\n\
  \n下一阶段是在 activity 中实现必要的代码以绑定到服务并调用 `getCurrentTime()` 方法。\n\n### 57.6 将客户端绑定到服务\n\
  \n对于本教程而言，客户端是运行程序的 `MainActivity` 实例。如前所述，为了绑定到服务并接收服务 `onBind()` 方法返回的 `IBinder`\
  \ 对象，必须创建一个 `ServiceConnection` 子类并实现 `onServiceConnected()` 和 `onServiceDisconnected()`\
  \ 方法。编辑 `MainActivity.java` 文件并进行如下修改：\n\n```java\npackage com.ebookfrenzy.localbound;\n\
  \nimport androidx.appcompat.app.AppCompatActivity;\nimport android.os.Bundle;\n\
  import android.os.IBinder;\nimport android.content.Context;\nimport android.content.Intent;\n\
  import android.content.ComponentName;\nimport android.content.ServiceConnection;\n\
  import com.ebookfrenzy.localbound.BoundService.MyLocalBinder;\n\npublic class MainActivity\
  \ extends AppCompatActivity {\n    BoundService myService;\n    boolean isBound\
  \ = false;\n\n    @Override\n    protected void onCreate(Bundle savedInstanceState)\
  \ {\n        super.onCreate(savedInstanceState);\n        setContentView(R.layout.activity_main);\n\
  \    }\n\n    final ServiceConnection myConnection = new ServiceConnection() {\n\
  \        @Override\n        public void onServiceConnected(ComponentName className,\
  \ IBinder service) {\n            MyLocalBinder binder = (MyLocalBinder) service;\n\
  \            myService = binder.getService();\n            isBound = true;\n   \
  \     }\n\n        @Override\n        public void onServiceDisconnected(ComponentName\
  \ name) {\n            isBound = false;\n        }\n    };\n}\n```\n\n当客户端成功绑定到服务时，将调用\
  \ `onServiceConnected()` 方法。该方法通过参数接收了服务 `onBind()` 方法返回的 `IBinder` 对象。该参数被转换为 `MyLocalBinder`\
  \ 类型的对象，然后调用 binder 对象的 `getService()` 方法以获取服务实例的引用，随后将其赋值给 `myService`。使用一个布尔标志来表示连接已成功建立。\n\
  \n当连接结束时，会调用 `onServiceDisconnected()` 方法，只需将布尔标志位设置为 false。\n\n建立连接后，下一步是修改 activity\
  \ 以绑定到服务。这涉及创建一个 `intent` 并调用 `bindService()` 方法，这些操作可以在 activity 的 `onCreate()`\
  \ 方法中执行：\n\n```java\n@Override\npublic void onCreate(Bundle savedInstanceState)\
  \ {\n    super.onCreate(savedInstanceState);\n    setContentView(R.layout.activity_main);\n\
  \    Intent intent = new Intent(this, BoundService.class);\n    bindService(intent,\
  \ myConnection, Context.BIND_AUTO_CREATE);\n}\n```\n\n### 57.7 完成示例\n\n剩下的工作是实现一种调用\
  \ `getCurrentTime()` 方法并将结果显示给用户的机制。按照惯例，Android Studio 已经为 activity 创建了一个仅包含一个\
  \ `TextView` 的模板 `activity_main.xml` 文件。将此文件加载到 Layout 编辑器工具中，使用 Design 模式选择 `TextView`\
  \ 组件并将 ID 更改为 `myTextView`。在 `TextView` 下方添加一个 `Button` ，并将按钮上的文本更改为“Show Time”，将文本提取为名为\
  \ `show_time` 的字符串资源。完成这些更改后，布局应该类似于图 64-1 所示。如果缺少任何约束，点击 Layout 编辑器中的推断约束（Infer\
  \ Constraints）按钮。\n\n![图 57-1](img/as_4.1_local_bound_ui.jpg)\n\n通过选择按钮并配置 onClick\
  \ 属性调用名为 showTime 的方法来完成用户界面设计。\n\n最后，编辑 `MainActivity.java` 文件中的代码实现 `showTime()`\
  \ 方法。该方法简单地调用服务的 `getCurrentTime()` 方法（多亏于 `onServiceConnected()` 方法，现在可以通过 `myService`\
  \ 引用从 activity 内部访问），并将生成的字符串赋值给 `TextView`：\n\n```java\npublic void showTime(View\
  \ view) {\n    String currentTime = myService.getCurrentTime();\n    TextView myTextView\
  \ = findViewById(R.id.myTextView);\n    myTextView.setText(currentTime);\n}\n```\n\
  \n### 57.8 测试应用程序\n\n\n\n\n\n代码更改完成后，对应用程序进行测试运行。一旦界面显示，点击按钮并注意文本视图将更改为显示当前的日期和时间。该示例已成功启动并绑定到一个服务，然后调用了该服务的方法来执行任务并将结果返回给活动（activity）。\n\
  \n## 57.9 总结\n\n当绑定服务是本地且对应用程序私有的时，该应用程序内的组件可以与该服务进行交互，而无需诉助于进程间通信（IPC）。通常情况下，服务的\
  \ `onBind()` 方法返回一个 `IBinder` 对象，该对象包含指向运行中服务实例的引用。客户端组件实现 `ServiceConnection` 子类，该类包含回调方法，这些方法在服务连接和断开时被调用。前一种方法接收由\
  \ `onBind()` 方法返回的 `IBinder` 对象，从而允许调用服务中的公共方法。\n\n在涵盖了本地绑定服务的实现后，下一章将重点介绍使用 IPC\
  \ 与远程绑定服务进行交互。\n\n## 58. Android 远程绑定服务 – 实例详解\n\n在这一关于 Android 服务的最后一章中，将开发一个示例应用程序，演示如何使用\
  \ `messenger` 和 `handler` 配置来方便客户端与远程绑定服务之间的交互。\n\n### 58.1 客户端与远程服务的通信\n\n如上一章所述，客户端与本地服务之间的交互可以通过向客户端返回一个包含服务对象引用的\
  \ `IBinder` 对象来实现。然而，对于远程服务，这种方法并行不通，因为远程服务运行在不同的进程中，因此无法从客户端直接访问。\n\n在远程服务的情况下，必须创建一个\
  \ `Messenger` 和 `Handler` 配置，以允许消息在客户端和服务端之间跨进程边界进行传递。\n\n具体而言，服务会创建一个 `Handler`\
  \ 实例，当接收来自客户端的消息时将调用该实例。在初始化方面，`Handler` 的句工作是创建一个 `Messenger` 对象，该对象反过来创建一个 `IBinder`\
  \ 对象，并在 `onBind()` 方法中返回给客户端。客户端使用此 `IBinder` 对象来创建 `Messenger` 对象的实例，随后将消息发送给服务处理器。客户端每发送一次消息，处理器的\
  \ `handleMessage()` 方法就会被调用一次，并传递消息对象。\n\n本章创建的示例将包含一个运行在单独进程中的活动和一个绑定服务。将使用 `Messenger/Handler`\
  \ 机制向服务发送一个字符串，服务随后将在 Logcat 输出中显示该字符串。\n\n### 58.2 创建示例应用程序\n\n从欢迎界面选择“New Project”（新建项目）选项，在生成的新项目对话框中，点击“Next”（下一步）按钮之前选择\
  \ Empty Activity 模板。\n\n在 `Name` 字段输入 `RemoteBound`，并指定 `com.ebookfrenzy.remotebound`\
  \ 为包名。在点击“Finish”（完成）按钮之前，将 Minimum API 级别设置设置为 `API 26: Android 8.0 (Oreo)`，并将语言菜单更改为\
  \ Java。\n\n### 58.3 设计用户界面\n\n在 Project 工具窗口中找到 `activity_main.xml` 文件并双击它将其加载到\
  \ Layout Editor 工具中。在 Layout Editor 工具的 Design 模式下，右键点击默认的 `TextView` 实例，选择 `Convert\
  \ view...` 菜单选项，从弹出的对话框中选择 `Button` 视图并点击 Apply。将按钮的 text 属性更改为“Send Message”，并将该字符串提取为名为\
  \ `send_message` 的新资源。\n\n最后，配置 `onClick` 属性以调用名为 `sendMessage` 的方法。\n\n### 58.4\
  \ 实现远程绑定服务\n\n为了实现此示例的远程绑定服务，在 Project 工具窗口中右键点击包名（位于 `app -> java` 下），并选择 `New\
  \ -> Service -> Service` 菜单选项向项目中添加一个新类。指定 `RemoteService` 为类名，并在点击 Finish 创建类之前确保勾选了\
  \ Exported 和 Enabled 选项。\n\n下一步是为新服务实现处理器类。这通过扩展 `Handler` 类并实现 `handleMessage()`\
  \ 方法来实现。该方法将在接收来自客户端的消息时被调用。它将接收一个 `Message` 对象作为参数，其中包含客户端需要传递给服务的任何数据。在本例中，这将是一个包含要显示给用户的字符串的\
  \ `Bundle` 对象。实现此功能后，`RemoteService.java` 文件中的修改后的类应如下：\n\n```java\npackage com.ebookfrenzy.remotebound;\n\
  \nimport android.app.Service;\nimport android.content.Intent;\nimport android.os.IBinder;\n\
  import android.os.Bundle;\nimport android.os.Handler;\nimport android.os.Looper;\n\
  import android.os.Message;\nimport android.os.Messenger;\nimport android.util.Log;\n\
  \npublic class RemoteService extends Service {\n    public RemoteService() {\n\n\
  \    }\n\n    static class IncomingHandler extends Handler {\n        String TAG\
  \ = \"RemoteService\";\n\n        public IncomingHandler() {\n            super(Looper.getMainLooper());\n\
  \        }\n\n        @Override\n        public void handleMessage(Message msg)\
  \ {\n            Bundle data = msg.getData();\n            String dataString = data.getString(\"\
  Message\");\n            Log.i(TAG, \" = \" + dataString);\n        }\n\n      \
  \  @Override\n        public IBinder onBind(Intent intent) {\n            // TODO:\
  \ Return the service.\n            throw new UnsupportedOperationException(\"Not\
  \ implemented\");\n        }\n    }\n\n    final Messenger myMessenger = new Messenger(new\
  \ IncomingHandler());\n\n    @Override\n    public IBinder onBind(Intent intent)\
  \ {\n        return myMessenger.getBinder();\n    }\n}\n```\n\n实现处理器后，服务中剩下的任务是修改\
  \ `onBind()`，使其返回一个包含处理器引用的 `IBinder` 对象：\n\n```java\nfinal Messenger myMessenger\
  \ = new Messenger(new IncomingHandler());\n\n@Override\npublic IBinder onBind(Intent\
  \ intent) {\n    return myMessenger.getBinder();\n}\n```\n\n上述代码的第一行创建了处理器实例并将其传递给\
  \ `Messenger` 的构造函数。在 `onBind()` 方法中，调用 `Messenger` 的 `getBinder()` 方法返回 `IBinder`\
  \ 对象。\n\n### 58.5 在 Manifest 中配置远程服务\n\n为了准确展示客户端与远程服务之间的通信，有必要将服务配置为在与应用程序部分独立的进程中运行。这通过在\
  \ `<service>` 标签内添加 `android:process` 属性来实现。为了启动服务，还需要为服务提供意图过滤器。为了实现此更改，请修改 `AndroidManifest.xml`\
  \ 文件添加所需的条目：\n\n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<manifest xmlns:android=\"\
  http://schemas.android.com/apk/res/android\"\n    package=\"com.ebookfrenzy.remotebound\"\
  >\n    <application\n        android:allowBackup=\"true\"\n        android:icon=\"\
  @mipmap/launcher\"\n        android:label=\"@string/app_name\"\n        android:supportsRtl=\"\
  true\"\n        android:theme=\"@style/AppTheme\">\n        <service\n         \
  \   android:name=\".RemoteService\"\n            android:enabled=\"true\"\n    \
  \        android:exported=\"true\"\n            android:process=\":my_process\"\
  >\n        </service>\n        <activity\n            android:name=\".MainActivity\"\
  >\n            <intent-filter>\n                <action android:name=\"android.intent.action.MAIN\"\
  \ />\n                <category android:name=\"android.intent.category.LAUNCHER\"\
  \ />\n            </intent-filter>\n        </activity>\n    </application>\n</manifest>\n\
  ```\n\n\n\n\n\n# 58.6 启动并绑定到远程服务\n\n与本地绑定服务一样，客户端组件需要实现 `ServiceConnection` 类的实例，并包含\
  \ `onServiceConnected()` 和 `onServiceDisconnected()` 方法。此外，与本地服务相同，`onServiceConnected()`\
  \ 方法将接收由远程服务的 `onBind()` 方法返回的 `IBinder` 对象，该对象将用于向服务器处理器发送消息。在本例中，客户端是 `MainActivity`，其代码位于\
  \ `MainActivity.java` 中。加载此文件并进行修改，以添加 `ServiceConnection` 类以及一个用于存储接收到的 `Messenger`\
  \ 对象引用的变量，以及一个用于指示是否已连接的 `Boolean` 标志位：\n\n```java\npackage com.ebookfrenzy.remotebound;\n\
  \nimport androidx.appcompat.app.AppCompatActivity;\n\nimport android.os.Bundle;\n\
  import android.os.IBinder;\nimport android.os.Message;\nimport android.os.Messenger;\n\
  import android.os.RemoteException;\n\nimport android.content.ComponentName;\nimport\
  \ android.content.Context;\nimport android.content.Intent;\nimport android.content.ServiceConnection;\n\
  import android.view.View;\n\npublic class MainActivity extends AppCompatActivity\
  \ {\n    Messenger myService = null;\n    boolean isBound;\n\n    @Override\n  \
  \  protected void onCreate(Bundle savedInstanceState) {\n        super.onCreate(savedInstanceState);\n\
  \        setContentView(R.layout.activity_main);\n    }\n\n    final private ServiceConnection\
  \ myConnection =\n            new ServiceConnection() {\n                public\
  \ void onServiceConnected(\n                               ComponentName className,\n\
  \                               IBinder service) {\n                    myService\
  \ = new Messenger(service);\n                    isBound = true;\n             \
  \   }\n                public void onServiceDisconnected(\n                    \
  \           ComponentName className) {\n                    myService = null;\n\
  \                    isBound = false;\n                }\n            };\n}\n```\n\
  \n接下来，需要添加一些代码来绑定到远程服务。这涉及创建一个与清单文件中声明的服务意图过滤器匹配的 `intent`，然后调用 `bindService()`\
  \ 方法，并将 `intent` 和 `ServiceConnection` 实例引用作为参数提供。在本例中，此代码将在 Activity 的 `onCreate()`\
  \ 方法中实现：\n\n```java\n@Override\nprotected void onCreate(Bundle savedInstanceState)\
  \ {\n    super.onCreate(savedInstanceState);\n    setContentView(R.layout.activity_main);\n\
  \    Intent intent = new Intent(getApplicationContext(),\n                     \
  \          RemoteService.class);\n    bindService(intent, myConnection, Context.BIND_AUTO_CREATE);\n\
  }\n```\n\n# 58.7 向远程服务发送消息\n\n在测试应用程序之前，剩下的工作是在 `MainActivity` 类中实现 `sendMessage()`\
  \ 方法，该方法需要检查服务是否连接，并在点击按钮时创建一个 `bundle` 并将其发送到服务器：\n\n```java\npublic void sendMessage(View\
  \ view) {\n    if (!isBound) return;\n    Message msg = Message.obtain();\n    Bundle\
  \ bundle = new Bundle();\n    bundle.putString(\"MyString\", \"Message Received\"\
  );\n    msg.setData(bundle);\n    try {\n        myService.send(msg);\n    } catch\
  \ (RemoteException e) {\n        e.printStackTrace();\n    }\n}\n```\n\n# 58.8 总结\n\
  \n要实现客户端与绑定服务之间的通信，必须使用 handler。该技术的基本概念已在本章中结合示例的形式进行了介绍。\n\n# 59 线程和执行器基础概述\n\n\
  线程是任何多任务操作系统的基石，可以被认为是运行在应用程序中的微进程。在本章中，我们将探讨线程的重要性，并演示如何创建和管理它们。\n\n## 59.1 应用主线程\n\
  \n当 Android 首次启动时，运行时系统会创建一个线程，所有组件都将在该线程中运行。该线程通常被称为主线程。主线程的主要作用是处理用户界面。应用程序内启动的任何额外组件默认也会在主线程上运行。任何使用主线程执行耗时任务的组件将导致整个应用程序锁定，直到任务完成。这可以通过简单地在独立线程中启动任务来避免。\n\
  \n## 59.2 线程 Handler\n\nAndroid 开发的关键规则之一是永远不要在主线程上执行耗时操作。第二个同样重要的规则是，独立线程中的代码绝不能直接更新用户界面的任何部分。如果线程中执行的代码需要与用户界面交互，必须通过与主\
  \ UI 线程同步来实现。这通过在主线程中创建一个 handler 实现，由它接收来自另一个线程的消息并更新用户界面完成。\n\n## 59.3 线程示例\n\n\
  本章的剩余部分将通过一些简单的示例来对线程进行基础介绍。第一步将强调在于主线程的独立线程中执行耗时任务的重要性。\n\n## 59.4 构建应用程序\n\n\n\
  \n\n在用户界面上添加一个 `Button` 视图，位置直接位于现有 `TextView` 对象的下方，如图图 59-1 所示。添加按钮后，点击工具栏上的 `Infer\
  \ Constraints`（推断约束）按钮以添加缺失的约束。\n\n将文本更改为“Press Me”，并将该字符串提取为名为 `press_me` 的资源。在布局中仍选中按钮视图的情况下，找到\
  \ `onClick` 属性并输入 `buttonClick` 作为方法名。\n\n![](img/as_4.2_threadexample_ui.jpg)\n\
  图 59-1\n\n接下来，将 `MainActivity.java` 文件加载到编辑面板中，并为 `buttonClick()` 方法添加代码，当用户点击 `Button`\
  \ 视图时，该方法将被调用。由于这里的目标是演示在主线程上执行耗时任务的问题，代码将在 `TextView` 对象上显示不同的文本之前简单地暂停 20 秒：\n\
  \n```java\npublic void buttonClick(View view) {\n    long endTime = System.currentTimeMillis()\
  \ + 20 * 1000;\n    while (System.currentTimeMillis() < endTime) {\n        synchronized\
  \ (this) {\n            try {\n                wait(endTime - System.currentTimeMillis());\n\
  \            } catch (Exception e) {\n            }\n        }\n    }\n    binding.myTextView.setText(\"\
  Button Pressed\");\n}\n```\n\n完成代码更改后，在物理设备或模拟器上运行应用程序。一旦应用程序运行，点击按钮，此时应用程序将出现冻结状态。例如，将无法第二次点击按钮，在某些情况下，操作系统将报告应用程序无响应，如图图\
  \ 59-2 所示。\n\n![](img/as_4.2_threadexample_not_responding.jpg)\n图 59-2\n\n显然，在 `buttonClick()`\
  \ 方法中任何需要时间才能完成的任务都应该在单独的线程中执行。\n\n## 59.5 创建新线程\n\n要创建一个新线程，需要将在该线程中执行的代码放置在 `Runnable`\
  \ 实例的 `run()` 方法中。然后需要创建一个新的 `Thread` 对象，并将 `Runnable` 实例的引用传递给构造函数。最后，需要调用线程对象的\
  \ `start()` 方法来启动线程运行。因此，为了执行 `buttonClick()` 方法中的任务，需要进行以下更改：\n\n```java\npublic\
  \ void buttonClick(View view) {\n    Runnable runnable = new Runnable() {\n    \
  \    public void run() {\n            long endTime = System.currentTimeMillis()\
  \ + 20 * 1000;\n            while (System.currentTimeMillis() < endTime) {\n   \
  \             synchronized (this) {\n                    try {\n               \
  \         wait(endTime - System.currentTimeMillis());\n                    } catch\
  \ (Exception e) {\n                    }\n                }\n            }\n   \
  \     }\n        binding.myTextView.setText(\"Button Pressed\");\n    };\n    Thread\
  \ myThread = new Thread(runnable);\n    myThread.start();\n}\n```\n\n事实上，如果需要，可以使用\
  \ Java Lambda 表达式简化 `runnable` 的声明。进行此更改会导致如下声明：\n\n```java\nRunnable runnable =\
  \ () -> {\n    long endTime = System.currentTimeMillis() + 20 * 1000;\n    while\
  \ (System.currentTimeMillis() < endTime) {\n        synchronized (this) {\n    \
  \        try {\n                wait(endTime - System.currentTimeMillis());\n  \
  \          } catch (Exception e) {\n            }\n        }\n    }\n    binding.myTextView.setText(\"\
  Button Pressed\");\n};\nThread myThread = new Thread(runnable);\nmyThread.start();\n\
  ```\n\n当现在运行应用程序时，点击按钮会导致延迟在一个新线程中执行，留出主线程继续处理用户界面。事实上，每次点击按钮时，都会创建一个新线程，允许任务执行多次。仔细检查\
  \ `buttonClick()` 方法的更新代码可以发现，更新 `TextView` 代码已被移除。如前所述，从主线程以外的线程更新用户界面元素违反了 Android\
  \ 开发的一项关键规则。因此，为了更新用户界面，必须为该线程实现一个 `Handler`。\n\n## 59.6 实现 Handler\n\n线程处理器（Handlers）在应用程序的主线程中实现，主要用于响应应用程序内其他线程发送的消息来更新用户界面。Handler\
  \ 是继承自 `Handler` 类的，可以通过指定由线程执行的 `Runnable` 来使用，也可以通过重写 `Handler` 中的 `handleMessage()`\
  \ 回调来使用，当线程向处理器 发送消息时，该回调将被调用。\n\n为了本示例的目的，将实现一个处理器以从创建的线程内部更新用户界面。将 `MainActivity.java`\
  \ 文件加载到 Android Studio 编辑器并修改代码以添加 `Handler` 实例：\n\n```java\nimport android.os.Handler;\n\
  import android.os.Message;\nimport android.os.Looper;\n\npublic class MainActivity\
  \ extends AppCompatActivity {\n    Handler handler = new Handler(Looper.getMainLooper())\
  \ {\n        @Override \n        public void handleMessage(Message msg) {\n    \
  \        binding.myTextView.setText(\"Message Received\");\n        }\n    };\n\
  }\n```\n\n上述代码更改声明了一个 `handler` 并在该处理器中实现了 `handleMessage()` 回调，当线程发送消息时将调用该回调。在此实例中，代码简单地在\
  \ `TextView` 上显示字符串。现在剩下的就是修改创建的线程，在延迟完成后发送一条消息：\n\n```java\npublic void buttonClick(View\
  \ view) {\n    Runnable runnable = () -> {\n        long endTime = System.currentTimeMillis()\
  \ + 20 * 1000;\n        while (System.currentTimeMillis() < endTime) {\n       \
  \     synchronized (this) {\n                try {\n                    wait(endTime\
  \ - System.currentTimeMillis());\n                } catch (Exception e) {\n    \
  \            }\n            }\n        }\n        handler.sendEmptyMessage(0);\n\
  \    };\n    Thread myThread = new Thread(runnable);\n    myThread.start();\n}\n\
  ```\n\n注意，唯一的更改是调用了 handler 的 `sendEmptyMessage()` 方法。由于处理器目前不对收到的消息内容执行任何操作，因此发送了一个空消息对象。编译并运行应用程序，在执行时点击按钮。20\
  \ 秒延迟后，用户界面上的 `TextView` 对象将显示新文本。\n\n## 59.7 向 Handler 传递消息\n\n之前的示例触发了 `handleMessage()`\
  \ Handler 回调，但没有利用消息对象向处理器传递数据。在本教程的阶段，将进一步修改示例在线程和处理器之间传递数据。首先，`buttonClick()`\
  \ 方法中更新的线程将从系统获取字符串格式的日期时间，并将该信息存储在 `Bundle` 对象中。然后调用 handler 对象的 `obtainMessage()`\
  \ 方法从消息池中获取一个消息对象。最后在通过调用 handler 对象的 `sendMessage()` 方法发送之前，将 `bundle` 添加到消息对象中：\n\
  \n\n\n\n```java\nwait(endTime - System.currentTimeMillis());\n} catch (Exception\
  \ e) {\n}\n}\n}\nMessage msg = handler.obtainMessage();\nBundle bundle = new Bundle();\n\
  bundle.putString(\"myKey\", \"Thread Completed\");\nmsg.setData(bundle);\nhandler.sendMessage(msg);\n\
  };\n\nThread myThread = new Thread(runnable);\nmyThread.start();\n}\n```\n\n接下来，更新\
  \ `handler` 的 `handleMessage()` 方法，从消息的 `bundle` 对象中提取日期和时间字符串并显示在 `TextView` 对象上：\n\
  \n```java\nHandler handler = new Handler(Looper.getMainLooper()) {\n    @Override\n\
  \    public void handleMessage(Message msg) {\n        Bundle bundle = msg.getData();\n\
  \        String string = bundle.getString(\"myKey\");\n        binding.myTextView.setText(string);\n\
  \    }\n};\n```\n\n最后，编译并运行应用程序，测试点击按钮后在线程结束后，`TextView` 对象上是否会显示“Thread Complete”消息。\n\
  \n# 59.8 Java Executor 并发\n\n到本章为止，我们一直都在都是直接创建和管理 Java 线程。对于简单的多线程任务是可以接受的，但在处理涉及大量线程的复杂情况时，这可能被证明是不够的。例如，启动和停止线程涉及系统开销。因此，创建一个并销毁大量线程的应用程序面临着性能下降的风险。基础线程\
  \ API 也没有提供用于调度或重复执行任务、或从任务返回结果的预构建选项。\n\n通过使用 Java 并发框架中的 `Executor` 类（属于 `java.util.concurrent`\
  \ 包的一部分），可以克服直接直接操作线程的缺点。该框架允许创建活动线程池，并管理如何将任务分配给这些线程。这使得现有线程可以重用于其他任务，而无需不断创建新线程。\n\
  \n该框架还提供了额外功能，包括在任务完成后返回结果的能力（称为 `Callable` 任务）、检查线程状态，以及调度任务在超时后或按重复的时间间隔运行。\n\n\
  # 59.9 使用 Runnable 任务\n\n探索该框架的第一步是修改 `buttonClicked()` 方法，使用并发框架 `Executor` 在单独线程中运行任务：\n\
  \n```java\nimport java.util.concurrent.ExecutorService;\nimport java.util.concurrent.Executors;\n\
  \npublic void buttonClick(View view) {\n    ExecutorService executor = Executors.newSingleThreadExecutor();\n\
  \    executor.submit(new Runnable() {\n        public void run() {\n           \
  \ long endTime = System.currentTimeMillis() + 10 * 1000;\n            while (System.currentTimeMillis()\
  \ < endTime) {\n                synchronized (this) {\n                    try {\n\
  \                        wait(endTime - System.currentTimeMillis());\n         \
  \           } catch (Exception e) {\n                    }\n                }\n\
  \            }\n            Message msg = handler.obtainMessage();\n           \
  \ Bundle bundle = new Bundle();\n            bundle.putString(\"myKey\", \"Button\
  \ Pressed\");\n            msg.setData(bundle);\n            handler.sendMessage(msg);\n\
  \        }\n    });\n    executor.shutdown();\n}\n```\n\n执行上述代码时，超时将在像之前一样在单独线程上执行。然而，对方法的更改需要一些解释。首先，从\
  \ `Executors` 实例获取 `ExecutorService` 实例的引用：\n\n`ExecutorService executor = Executors.newSingleThreadExecutor();`\n\
  \n在这种情况下，请求了一个只包含一个线程的池。也可以如下方式请求具有指定线程数量的池：\n\n`ExecutorService executor = Executors.newFixedThreadPool(10);`\n\
  \n接下来，通过调用执行器实例的 `submit()` 方法在线程上启动 `Runnable` 任务：\n\n```java\nexecutor.submit(new\
  \ Runnable(){\n    public void run() {\n        long endTime = System.currentTimeMillis()\
  \ + 20 * 1000;\n    }\n});\n```\n\n注意，上面的声明可以通过将其转换为如下 lambda 表达式来简化：\n\n```java\n\
  executor.submit(() -> {\n    long endTime = System.currentTimeMillis() + 20 * 1000;\n\
  });\n```\n\n从现在开始，任务将一直运行直到完成。然而，执行器服务将继续运行。如果你不再需要该服务，则应该对其进行 `shutdown`（关闭）。\n\
  \n# 59.10 关闭执行器 服务\n\n`ExecutorService` 提供了几种启动关闭的技术。要通知服务在当前运行的任务完成后自动关闭，应如下所示调用\
  \ `shutdown()` 方法：\n\n`executor.shutdown();`\n\n另一方面，调用 `shutdownNow()` 方法会停止服务上正在运行的所有任务，并取消对待处理任务的处理：\n\
  \n`executor.shutdownNow();`\n\n# 59.11 使用 Callable 任务和 Future\n\n如前所述，`ExecutorService`\
  \ 支持所谓的“Callable”任务，这些任务能够在任务完成后返回结果。运行在单独线程上的任务预计需要一些时间才能完成（否则它们可能根本不需要运行在单独线程上）。这引出了一个问题：结果如何返回给启动任务的线程的代码？这是通过使用\
  \ `Future` 值类型实现的，它代表在未来某个点将提供的值。\n\n当执行可调用任务时，它返回一个 `Future` 实例，随后应用程序可以使用它在任务完成后获取结果。为了看到此效果，首先通过编辑\
  \ `activity_main.xml` 文件添加一个标记为“Status”的按钮，其 `onClick` 属性配置为调用名为 `statusClick` 的方法：\n\
  \nimage/as.2_threadexample_status.jpg\n图 59-3\n\n接下来，修改 `buttonClick()` 方法以执行 `Callable`\
  \ 任务，并通过 `Future` 变量返回字符串：\n\n```java\nimport java.util.concurrent.Callable;\nimport\
  \ java.util.concurrent.Future;\n\npublic class MainActivity extends AppCompatActivity\
  \ {\n    Future<String> future;\n\n    public void buttonClick(View view) {\n  \
  \      ExecutorService executor = Executors.newSingleThreadExecutor();\n       \
  \ future = executor.submit(new Callable<String>() {\n            public String call()\
  \ {\n                long endTime = System.currentTimeMillis() + 10 * 1000;\n  \
  \              while (System.currentTimeMillis() < endTime) {\n                \
  \    synchronized (this) {\n                        try {\n                    \
  \        wait(endTime - System.currentTimeMillis());\n                        }\
  \ catch (Exception e) {\n                        }\n                    }\n    \
  \            }\n                Message msg = handler.obtainMessage();\n       \
  \         Bundle bundle = new Bundle();\n                bundle.putString(\"myKey\"\
  , \"Thread Completed\");\n                msg.setData(bundle);\n               \
  \ handler.sendMessage(msg);\n                return \"Task Completed\";\n      \
  \      }\n        });\n        executor.shutdown();\n    }\n}\n```\n\n注意，除了导入 `java.util.concurrent.Future`\
  \ 包并声明一个存储字符串值的 `Future` 变量外，启动任务的方式也进行了一些更改：\n\n`future = executor.submit(new Callable<String>()\
  \ {`\n\n这里的关键点是，我们不是向执行器服务提交 `Runnable` 任务，而是传递了一个 `Callable` 任务（声明为返回 `String`\
  \ 值）。同样，任务的结果被赋值给 `Future` 变量。此外，使用 `call()` 代替之前提交 `Runnable` 任务时使用的 `run()` 方法。最后，添加了返回语句以返回字符串值：\n\
  \n`return(\"Task Completed\")`\n\n# 59.12 处理 Future 结果\n\n\n\n\n\n`buttonClick()`\
  \ 方法现在被配置为启动一个 `Callable` 任务，并将返回值赋值给 `Future` 变量。应用程序现在需要知道任务何时完成以及结果何时可用。一种方法是调用\
  \ `Future` 变量的 `get()` 方法。由于该方法在执行失败或被中断时可能会抛出异常，因此必须在 `try/catch` 语句中执行，如下：\n\n\
  ```java\nString result = null;\n\ntry {\n    result = future.get();\n} catch (ExecutionException\
  \ | InterruptedException e) {\n    e.printStackTrace();\n}\n```\n\n遗憾的是，`get()`\
  \ 方法会阻塞当前线程，直到线程中运行的任务完成，这违背了最初在单独线程中运行任务的初衷。另一个选项是为 `get()` 方法提供一个超时时间，超时后会将控制权交还当前线程。例如，以下代码会导致\
  \ `get()` 调用在 3 秒后超时：\n\n```java\nresult = future.get(3, TimeUnit.SECONDS);\n```\n\
  \n然而，更好的替代方案是调用 `Future` 实例的 `isDone()` 方法来检查线程状态，仅在任务完成后才调用 `get()` 方法。为了实现此行为，请在\
  \ `MainActivity.java` 文件中添加 `statusClick()` 方法，如下：\n\n```java\nimport java.util.concurrent.ExecutionException;\n\
  import java.util.concurrent.TimeUnit;\nimport java.util.concurrent.TimeoutException;\n\
  \npublic void statusClick(View view) {\n    if ((future != null && future.isDone())\
  \ {\n        String result = null;\n        try {\n            result = future.get(3,\
  \ TimeUnit.SECONDS);\n        } catch (ExecutionException | InterruptedException\n\
  \                    | TimeoutException e) {\n            e.printStackTrace();\n\
  \        }\n        binding.myTextView.setText(result);\n    } else {\n        binding.myTextView.setText(\"\
  Waiting\");\n    }\n}\n```\n\n完成更改后，运行应用程序并点击“Press Me”按钮。在任务运行期间，点击“Status”按钮。只要任务仍在运行，`TextView`\
  \ 中就会显示“Waiting”消息。然而，一旦任务完成，`isDone()` 方法将返回 `true` 值，`get()` 方法将被调用，任务返回的字符串（“Task\
  \ Complete”）将显示在 `TextView` 上。\n\n## 59.13 调度任务\n\n最后一个涵盖的领域涉及使用 `ExecutorService`\
  \ 来调度任务执行。这涉及到使用 `ScheduledExecutorService` 实例，并在其上调用 `schedule()` 方法，传入要执行的 `Runnable`\
  \ 任务以及一个时间延迟。`schedule()` 调用将返回一个 `ScheduledFuture` 实例，该实例可用于识别任务启动前的剩余时间。\n\n例如，以下代码调度了一个任务在\
  \ 30 秒后运行，并访问了剩余的延迟时间：\n\n```java\nScheduledExecutorService executor = Executors.newScheduledThreadPool(1);\n\
  Runnable task = () -> {\n    // 在处执行任务代码\n};\nScheduledFuture<?> future = executor.schedule(task,\
  \ 30, TimeUnit.SECONDS);\nlong delayRemaining = future.getDelay(TimeUnit.SECONDS);\n\
  ```\n\n同样，`ScheduledExecutorService` 可用于在可选的初始延迟后，按固定间隔重复执行任务。例如，以下代码会导致任务在初始 30\
  \ 秒延迟后每隔 10 秒执行一次：\n\n```java\nexecutor.scheduleAtFixedRate(task, 30, 10, TimeUnit.SECONDS);\n\
  ```\n\n`scheduleAtFixedRate()` 方法无论之前调度的任务是否完成，都会启动任务的下一次实例。要指定任务执行结束与下一次执行开始之间的固定时间间隔，请使用\
  \ `scheduleWithFixedDelay()` 方法。在以下示例中，第一个任务在延迟 0 秒后调度，随后的每次执行都在上一个任务完成 10 秒后进行：\n\
  \n```java\nexecutor.scheduleWithFixedDelay(task, 0, 10, TimeUnit.SECONDS);\n```\n\
  \n## 59.14 总结\n\n本章的目标是提供 Android 应用中线程的概述。当应用程序首次在进程中启动时，运行时系统创建一个主线程，所有随后启动的应用程序组件默认都在该线程中运行。主线程的主要作用是处理用户界面，因此在该线程中执行的任何耗时任务都会导致应用程序假死的假象。因此，将可能需要时间完成的任务启动在单独线程中是至关重要的。\n\
  \n由于 Android 用户界面工具包不是线程安全的，不应在主线程之外的任何线程中更改用户界面。可以通过在主线程中创建一个 `handler` 来实现用户界面更改，从其他非主线程从中发送消息。\n\
  \n## 60 在 Android 中请求运行时权限\n\n在前面的章节创建的多个项目中，对 `AndroidManifest.xml` 进行了修改，以请求应用执行某些任务的权限。在每个情况下，都请求了访问的权限以允许应用下载和显示网页。这些所谓的“危险”权限中的第一个将在下一章遇到。\n\
  \n### 60.1 理解普通权限和危险权限\n\nAndroid 通过要求用户授予应用执行某些任务的权限来实施安全。在引入 Android 6 之前，权限总是在应用安装时请求的。例如，图\
  \ 60-1 显示了在通过 Google Play 安装应用时寻求各种权限的典型界面。\n\n对于许多类型的权限，这种场景对 Android 6.0 的应用仍然适用。这些权限被称为“普通权限”，仍要求用户在安装时接受。第二类权限被称为“危险权限”，也必须以普通权限相同的方式在清单文件中声明，但在应用程序首次启动时必须向用户请求。当进行此类请求时，它将以对话框的形式出现，如图\
  \ 60-2 所示。\n\n危险权限的完整列表包含在表 60-1：\n\n| 权限组 | 权限 |\n| :--- | :--- |\n| 日历 | `READ_CALENDAR`,\
  \ `WRITE_CALENDAR` |\n| 相机 | `CAMERA` |\n| 联系人 | `READ_CONTACTS`, `WRITE_CONTACTS`,\
  \ `GET_ACCOUNTS` |\n| 位置 | `ACCESS_FINE_LOCATION`, `ACCESS_COARSE_LOCATION` |\n\
  | 麦风 | `RECORD_AUDIO` |\n| 通知 | `POST_NOTIFICATIONS` |\n| 电话 | `READ_PHONE_STATE`,\
  \ `CALL_PHONE`, `READ_CALL_LOG`, `WRITE_CALL_LOG`, `ADD_VOICEMAIL`, `USE_SIP`, `PROCESS_OUTGOING_CALLS`\
  \ |\n| 传感器 | `BODY_SENSORS` |\n| 短信 | `SEND_SMS`, `RECEIVE_SMS`, `READ_SMS`, `RECEIVE_WAP_PUSH`,\
  \ `RECEIVE_MMS` |\n| 存储 | `MANAGE_EXTERNAL_STORAGE`, `READ_EXTERNAL_STORAGE`, `WRITE_EXTERNAL_STORAGE`\
  \ |\n\n\n\n\n\n`MANAGE_EXTERNAL_STORAGE` 权限允许应用访问设备外部存储器上的所有文件，包括属于其他应用的文件。因此，只有当\
  \ Google 在审核过程中验证需要此级别的访问权限时，该权限才会为您的应用启用。为了在提交应用到 Google Play 商店之前对其进行测试，可以执行以下\
  \ `adb` 命令在测试设备上临时启用该应用的访问权限：\n\n```bash\nadb shell appops set --uid <package name>\
  \ MANAGE_EXTERNAL_STORAGE allow\n```\n\n可以通过以下方式禁用此模式：\n\n```bash\nadb shell appops\
  \ set --uid <package name> MANAGE_EXTERNAL_STORAGE default\n```\n\n## 60.2 创建权限示例项目\n\
  \n从欢迎界面选择 `New Project` ，在弹出的新项目对话框中，选择 `Empty Activity` 模板，然后点击 `Next` 按钮。\n\n\
  在 `Name` 字段中输入 `PermissionDemo`，并指定 `com.ebookfrenzy.permissiondemo` 为包名。在点击 `Finish`\
  \ 按钮之前，将 `Minimum API level` 设置为 `API 26: Android 8.0 (Oreo)`，并将 `Language` 菜单更改为\
  \ `Java`。\n\n## 60.3 检查权限\n\nAndroid Support Library 包含许多可以在 Android 应用代码中查找和管理危险权限的方法。无论应用运行在哪个版本的\
  \ Android 上，这些 API 调用都是安全的，但只有在 Android `6.0` 或更高版本上执行时才会执行有意义的任务。\n\n在应用尝试使用需要授权危险权限的功能之前，无论之前是否已授予权限，代码都必须检查权限是否已授予。可以通过调用\
  \ `ContextCompat` 类的 `checkSelfPermission()` 方法来实现，并将当前活动的引用和请求的权限作为参数传递。该方法将检查权限是否之前已授予，并返回与\
  \ `PackageManager.PERMISSION_GRANTED` 或 `PackageManager.PERMISSION_DENIED` 匹配的整数值。\n\
  \n在示例项目的 `MainActivity.java` 文件，修改代码以检查是否已授予应用录音权限：\n\n```java\npackage com.ebookfrenzy.permissiondemoactivity;\n\
  \nimport androidx.appcompat.app.AppCompatActivity;\nimport androidx.core.content.ContextCompat;\n\
  import androidx.annotation.NonNull;\nimport android.os.Bundle;\nimport android.Manifest;\n\
  import android.content.pm.PackageManager;\nimport android.util.Log;\n\npublic class\
  \ MainActivity extends AppCompatActivity {\n    private static final String TAG\
  \ = \"PermissionDemo\";\n\n    @Override\n    protected void onCreate(Bundle savedInstanceState)\
  \ {\n        super.onCreate(savedInstanceState);\n        setContentView(R.layout.activity_permission_demo);\n\
  \        setupPermissions();\n    }\n\n    private void setupPermissions() {\n \
  \       int permission = ContextCompat.checkSelfPermission(this,\n             \
  \   Manifest.permission.RECORD_AUDIO);\n        if (permission != PackageManager.PERMISSION_GRANTED)\
  \ {\n            Log.i(TAG, \"Permission to record denied\");\n        }\n    }\n\
  }\n```\n\n在运行早于 Android `6.0` 版本的设备或模拟器上运行应用，并检查 Android Studio 中的 `Logcat` 输出。应用启动后，`Logcat`\
  \ 输出应包含“Permission to record denied”消息。\n\n编辑 `AndroidManifest.xml` 文件（位于 Project\
  \ 工具窗口的 `app -> manifests` 下），并添加此行请求录音权限，如下所示：\n\n```xml\n<?xml version=\"1.0\"\
  \ encoding=\"utf-8\"?>\n<manifest xmlns:android=\"http://schemas.android.com/apk/res/android\"\
  \n    package=\"com.ebookfrenzy.permissiondemoactivity\" >\n    <uses-permission\
  \ android:name=\"android.permission.RECORD_AUDIO\" />\n    <application\n      \
  \  android:allowBackup=\"true\"\n        android:icon=\"@mipmap/ic_launcher\"\n\
  \        android:label=\"@sxtring/app_name\"\n        android:supportsRtl=\"true\"\
  \n        android:theme=\"@style/AppTheme\" >\n        <activity android:name=\"\
  .MainActivity\" >\n            <intent-filter>\n                <action android:name=\"\
  android.intent.action.MAIN\" />\n                <category android:name=\"android.intent.category.LAUNCHER\"\
  \ />\n            </intent-filter>\n        </activity>\n    </application>\n</manifest>\n\
  ```\n\n再次编译并运行应用，注意这次没有出现权限拒绝的提示。显然，在旧版本 Android 上请求此权限需要需要的所有工作都已完成。在运行 Android\
  \ `6.0` 或更高版本的设备或模拟器上运行应用，并注意尽管权限已添加到 manifest 文件，但检查仍然报告权限被拒绝。这是因为 Android 6 及更高版本要求应用在运行时也请求危险权限。\n\
  \n## 60.4 在运行时请求权限\n\n权限请求通过调用 `ActivityCompat` 类的 `requestPermissions()` 方法进行。当调用此方法时，权限请求将进行异步处理，并在任务完成后调用一个名为\
  \ `onRequestResult()` 的方法。`requestPermissions()` 方法将当前活动的引用、请求权限的标识符以及请求代码作为参数。请求代码可以是任意整数值，并将用于标识是哪个请求触发了对\
  \ `onRequestResult()` 方法的调用。修改 `MainActivity.java` 文件以声明请求代码，并在权限检查失败时请求录音权限：\n\n\
  ```java\nimport androidx.core.app.ActivityCompat;\n\npublic class MainActivity extends\
  \ AppCompatActivity {\n    private static final String TAG = \"PermissionDemo\"\
  ;\n    private static final int RECORD_REQUEST_CODE = 101;\n\n    @Override\n  \
  \  private void setupPermissions() {\n        int permission = ContextCompat.checkSelfPermission(this,\n\
  \                Manifest.permission.RECORD_AUDIO);\n        if (permission != PackageManager.PERMISSION_GRANTED)\
  \ {\n            Log.i(TAG, \"Permission to record denied\");\n            makeRequest();\n\
  \        }\n    }\n\n    protected void makeRequest() {\n        ActivityCompat.requestPermissions(this,\n\
  \                new String[]{Manifest.permission.RECORD_AUDIO},\n             \
  \   RECORD_REQUEST_CODE);\n    }\n}\n```\n\n接下来，实现 `onRequestResult()` 方法，其内容如下：\n\
  \n```java\n@Override\npublic void onRequestResult(int requestCode,\n        @NonNull\
  \ String[] permissions, @NonNull int[] grantResults) {\n    super.onRequestPermissionsResult(requestCode,\
  \ permissions, grantResults);\n    if (requestCode == RECORD_REQUEST_CODE) {\n \
  \       if (grantResults.length == 0\n            || grantResults[0] != PackageManager.PERMISSION_GRANTED)\
  \ {\n            Log.i(TAG, \"Permission has been denied by user\");\n        }\
  \ else {\n            Log.i(TAG, \"Permission has been granted by user\");\n   \
  \     }\n    }\n}\n```\n\n在 Android `6` 或更高版本的模拟器或设备上编译并运行应用，注意会出现一个请求录音权限的对话框，如图\
  \ 60-3 所示：\n\n![](img/android_permission_request.jpg)\n\n图 60-3\n\n点击“在使用应用时”按钮，并检查\
  \ `Logcat` 面板中是否出现了“Permission has been granted by user”消息。\n\n一旦用户授予了请求的权限，`checkSelfPermission()`\
  \ 方法在未来的应用调用中将返回 `PERMISSION_GRANTED` 结果，除非用户卸载并重新安装应用，或在`设置` 中更改了应用的权限。\n\n## 60.5\
  \ 为权限请求提供理由\n\n\n\n\n\n如图 60-3 所示，用户可以选择拒绝请求的权限。在这种情况下，除非用户在点击“拒绝（Deny）”按钮之前选择了“不再询问”选项，否则应用在每次被用户启动时都会继续请求该权限。用户反复拒绝可能可能表明用户不理解为什么应用需要该权限。因此，如果在发出请求时解释需要权限的原因，用户可能更容易授予权限。遗憾的是，无法更改请求对话框的内容以包含此类解释。\n\
  \n最好的做法是将解释包含在一个单独的对话框中，该对话框可以在请求对话框呈现给用户之前显示。这引出了关于何时显示此解释对话框的问题。Android 文档建议，只有在用户之前拒绝过该权限时才显示解释对话框，并提供了一种方法来识别何时发生这种情况。\n\
  \n调用 `ActivityCompat` 类的 `shouldShowRequestPermissionRationale()` 方法，如果用户之前拒绝过对指定权限的请求，则将返回\
  \ `true` 结果；如果之前没有发出过请求，则返回 `false` 结果。在结果为 `true` 的情况下，应用应该显示一个包含需要权限理由的对话框，一旦用户阅读并关闭了该对话框，就应重复权限请求。\n\
  \n要向示例应用添加此功能，请修改 `onCreate()` 方法使其内容如下：\n\n```java\nimport android.app.AlertDialog;\n\
  \nprivate void setupPermissions() {\n    int permission = ContextCompat.checkSelfPermission(this,\n\
  \            Manifest.permission.RECORD_AUDIO);\n    if (permission != PackageManager.PERMISSION_GRANTED)\
  \ {\n        Log.i(TAG, \"Permission to record denied\");\n        if (ActivityCompat.shouldShowRequestPermissionRationale(this,\n\
  \                Manifest.permission.RECORD_AUDIO)) {\n            AlertDialog.Builder\
  \ builder =\n                    new AlertDialog.Builder(this);\n            builder.setMessage(\"\
  Permission to access the microphone is required for this app to record audio.\"\
  )\n                    .setTitle(\"Permission required\");\n            builder.setPositiveButton(\"\
  OK\",\n                    (dialog, id) -> makeRequest());\n            AlertDialog\
  \ dialog = builder.create();\n            dialog.show();\n        } else {\n   \
  \         makeRequest();\n        }\n    }\n}\n```\n\n该方法仍然检查权限是否已授予，但现在还会识别是否需要显示理由。如果用户之前拒绝了请求，则会显示一个包含解释和\
  \ OK 按钮的对话框，并在按钮上配置了监听器，以便在点击按钮时调用 `makeRequest()` 方法。如果之前没有发出过请求，代码将直接跳转到获取权限。\n\
  \n## 60.6 测试权限应用\n\n在进行测试的 Android 6 或更高版本的设备或模拟器会话上，启动设置（Settings）应用，选择应用（Apps）选项，并滚动并选择\
  \ `PermissionDemo` 应用。在应用设置屏幕上，点击卸载按钮从设备中移除该应用。\n\n再次运行应用，当权限请求对话框出现时，点击“不允许（Don’t\
  \ allow）”按钮。停止并重启应用，验证理由对话框是否出现。点击 OK 按钮，当权限请求对话框出现时，点击“在使用应用期间（While using the\
  \ app）”按钮。\n\n返回设置应用，选择应用（Apps）选项并再次从列表中选择 `PermissionDemo` 应用。一旦列出应用设置，验证“权限”部分是否列出了麦克风（Microphone）权限：\n\
  \n![](img/as_permission_microphone.jpg)\n\n图 60-4\n\n## 60.7 总结\n\n在 Android 6.0\
  \ 引入之前，应用请求访问某些功能的唯一必要步骤是在应用程序清单文件（manifest file）中添加适当的行。用户将在应用安装时处被提示批准权限。对于大多数权限来说仍然如此，但被认为是“危险（dangerous）”的权限除外。在本章所述，基于\
  \ Android 6 的后续应用现在必须从清单文件中请求权限。\n\n## 61. 通知教程\n\n通知提供了一种应用在运行或未运行时向用户传达消息的方法。通知可以分为本地通知或远程通知。本地通知由设备上的应用本身触发。相反，远程通知由服务器启动并递送到设备。本章的目标是概述并演示\
  \ Android 应用中本地通知的实现。下一章（Android 直接回复教程）将涵盖直接回复（direct reply）的实现。\n\n### 61.1 通知概览\n\
  \n当在 Android 设备上启动通知时，它会以状态栏图标的形式出现。例如，图 61-1 显示了一个带有多个通知图标的状态栏：\n\n![](img/Image2454.jpg)\n\
  \n图 61-1\n\n要查看通知，用户从状态栏开始做出向下滑动的动作，以下拉通知抽，如图 61-2 所示：\n\n![](img/as_4.1_android_11_notifications.jpg)\n\
  \n图 61-2\n\n在运行 Android 8 或更高版本的设备上，对应用启动器图标进行长按，将显示与该应用相关的任何待处理通知，如图 61-3 所示：\n\
  \n![](img/Image2442.jpg)\n\n图 61-3\n\nAndroid 8 及更高版本还支持通知点（notification dots），当有通知等待用户查看时，会出现在应用启动器图标上。\n\
  \n典型的通知将仅显示消息，并在点击时启动发布该通知的应用程序。通知还可以包含操作按钮，点击时执行特定于相应应用程序的任务。例如，图 61-4 显示了一个包含两个操作按钮的通知，允许用户删除或保存存入的消息。\n\
  \n![](img/Image2450.jpg)\n\n图 61-4\n\n用户还可以在通知中输入内联文本回复并发送给应用，如下方的图 61-5 所示。这允许用户在无需将相应的应用到前台的情况下响应通知。\n\
  \n![](img/Image2458.jpg)\n\n图 61-5\n\n\n\n\n\n本章的剩余部分将介绍创建和发布包含操作的简单通知的步骤。关于直接回复支持的主题将在下一章介绍，标题为“Android\
  \ 直接回复通知教程”。\n\n## 61.2 创建 NotifyDemo 项目\n\n从欢迎界面选择 `New Project`（新建项目）选项，在弹出的新项目对话框中，点击\
  \ `Next` 按钮之前选择 `Empty Activity` 模板。\n\n在 `Name` 字段中输入 `NotifyDemo`，并指定 `com.ebookfrenzy.notifydemo`\
  \ 为包名。在点击 `Finish` 按钮之前，将 `Minimum API level` 设置更改为 `API 33: Android 13 (Tiramisu)`，并将\
  \ `Language` 菜单更改为 `Java`。\n\n## 61.3 设计用户界面\n\n主活动将包含一个按钮，其目的是创建并发布一个意图（intent）。找到\
  \ `activity_main.xml` 文件并加载到 `Layout Editor` 工具中，然后删除默认的 `TextView` 小部件。\n\n在启用\
  \ `Autoconnect` 的情况下，将 `Button` 对象从面板拖动到布局画布的中心，如图图 61-6\n\n图 61-6\n\n选择 `Button`\
  \ 小部件，在 `Attributes` 工具窗口中将 `text` 属性更改为“Notify”，并将属性值提取到字符串资源。\n\n## 61.4 创建第二个\
  \ Activity\n\n出于本示例的考虑，应用程序将包含第二个活动，该活动将由用户从通知内部启动。通过右键点击 `app -> java` 下的 `com.ebookfrenzy.notifydemo`\
  \ 包名，并选择 `New -> Activity -> Empty Activity` 菜单选项显示 `New Android Activity` 对话框，向项目添加此新活动。\n\
  \n在 `Activity Name` 字段中输入 `ResultActivity`并将布局文件命名为 `activity_result`。由于该活动在应用程序启动时启动（它将通过通知内部的意图启动），因此在点击\
  \ `Finish` 按钮之前，确保禁用了 `Launcher Activity` 选项。\n\n打开第二个活动的布局（`app -> res -> layout\
  \ -> activity_result.xml`），并拖放一个 `TextView` 小部件使其位于布局中心。编辑 `TextView` 的文本，使其显示为“Result\
  \ Activity”，并将属性值提取到字符串资源。\n\n## 61.5 创建通知通道\n\n在应用程序发送通知之前，它必须先创建一个通知通道。通知通道由一个\
  \ `ID`（在应用内唯一标识该通道）、一个通道名称和一个通道描述组成（只有后两个会被用户看到）。通道通过配置 `NotificationChannel` 实例并将该对象传递给\
  \ `NotificationManager` 类的 `createNotificationChannel()` 方法来创建。对于此示例，应用程序将包含一个名为“NotifyDemo\
  \ News”的单通知通道。编辑 `MainActivity.java` 文件并实现在应用启动时创建通道的代码：\n\n```java\nimport android.app.NotificationManager;\n\
  import android.app.NotificationChannel;\nimport android.content.Context;\nimport\
  \ android.graphics.Color;\n\npublic class MainActivity extends AppCompatActivity\
  \ {\n    NotificationManager notificationManager;\n\n    @Override\n    protected\
  \ void onCreate(Bundle savedInstanceState) {\n        super.onCreate(savedInstanceState);\n\
  \        setContentView(R.layout.activity_main);\n        notificationManager =\n\
  \            (NotificationManager)\n                getSystemService(Context.NOTIFICATION_SERVICE);\n\
  \        createNotificationChannel(\n            \"com.ebookfrenzy.notifydemo.news\"\
  ,\n            \"NotifyDemo News\",\n            \"Example News Channel\");\n  \
  \  }\n\n    protected void createNotificationChannel(String id, String name,\n \
  \           String description) {\n        int importance = NotificationManager.IMPORTANCE_LOW;\n\
  \        NotificationChannel channel =\n            new NotificationChannel(id,\
  \ name, importance);\n        channel.setDescription(description);\n        channel.enableLights(true);\n\
  \        channel.setLight(Color.RED);\n        channel.enableVibration(true);\n\
  \        channel.setVibrationPattern(new long[]{100, 200, 300, 400, 500, 400, 300,\
  \ 200});\n        notificationManager.createNotificationChannel(channel);\n    }\n\
  }\n```\n\n该代码声明并初始化了 `NotificationManager` 实例，然后根据名称和描述创建了一个低重要性（其他选项为高、最高、无）的通道。通道还添加了一系列可选设置，以自定义用户接收通知到达提醒的方式。最后，通过传递\
  \ `channel()` 创建通道。\n\n## 61.6 请求通知权限\n\n在测试应用程序之前，务必在清单文件中为应用程序请求适当的权限。具体而言，应用程序需要发布通知的权限。在\
  \ Project 窗口中，找到并双击 `AndroidManifest.xml` 文件将其加载到编辑器中，并修改 XML 添加：\n\n```xml\n<?xml\
  \ version=\"1.0\" encoding=\"utf-8\"?>\n<manifest xmlns:android=\"http://schemas.android.com/apk/res/android\"\
  \n    package=\"com.ebookfrenzy.notifydemo\">\n    <uses-permission android:name=\"\
  android.permission.POST_NOTIFICATIONS\" />\n</manifest>\n```\n\n上述步骤将确保在 Android\
  \ 6.0 之前的设备上安装应用时启用通知权限。通知访问在 Android 中被归类为危险权限，因为它可能会损害用户的隐私。因此，为了让示例应用程序在 Android\
  \ 6 或更高版本的设备上运行，需要添加代码在运行时专门请求权限。\n\n编辑 `MainActivity.java` 文件，首先添加一些额外的导入指令和常量，作为请求权限的请求码：\n\
  \n```java\nimport androidx.core.app.ActivityCompat;\nimport androidx.core.content.ContextCompat;\n\
  import androidx.annotation.NonNull;\nimport android.widget.Toast;\nimport android.Manifest;\n\
  import android.content.pm.PackageManager;\n\npublic class MainActivity extends AppCompatActivity\
  \ {\n    private static final int NOTICATION_REQUEST_CODE = 101;\n}\n```\n\n接下来，需要在类中添加一个方法，其目的是将要请求的权限和相应的请求标识码作为参数。留在\
  \ `MainActivity.java` 类文件中，如下所示实现此方法：\n\n```java\nprotected void requestPermission(String\
  \ permissionType, int requestCode) {\n    int permission = ContextCompat.checkSelfPermission(this,\
  \ permissionType);\n    if (permission != PackageManager.PERMISSION_GRANTED) {\n\
  \        ActivityCompat.requestPermissions(this, new String[]{permissionType}, requestCode);\n\
  \    }\n}\n```\n\n使用本书书中在 Android 中进行运行时权限请求章节中概述的步骤，上述方法在发出请求之前会验证指定的权限是否已授予，并将标识码作为参数传递。\n\
  \n\n\n\n当请求处理完毕后，将在 activity 上调用 `onRequestPermissionsResult()` 方法，并传递标识码和请求结果。因此，下一步是在\
  \ `MainActivity.java` 文件中按照如下方式实现该方法：\n\n```java\n@Override\npublic void onRequestPermissionsResult(int\
  \ requestCode,\n            @NonNull String[] permissions, @NonNull int[] grantResults)\
  \ {\n    super.onRequestPermissionsResult(requestCode, permissions, grantResults);\n\
  \    if (requestCode == NOTIFICATION_REQUEST_CODE) {\n        if (grantResults.length\
  \ == 0\n                || grantResults[0] !=\n                PackageManager.PERMISSION_GRANTED)\
  \ {\n            Toast.makeText(this,\n                        \"Notification permission\
  \ required\",\n                        Toast.LENGTH_LONG).show();\n        }\n \
  \   }\n}\n```\n\n上述代码通过检查请求标识码来识别是哪个权限请求返回了结果，然后检查相应的权限是否已授予。如果权限被拒绝，将向用户显示消息，指示应用将无法运行且录制按钮将被禁用。\n\
  \n在测试应用之前，剩下的工作是在应用启动时调用新添加的 `requestPermission()` 方法。继续在 `MainActivity.java` 文件中，如下所示修改\
  \ `onCreate()` 方法：\n\n```java\n@Override\nprotected void onCreate(Bundle savedInstanceState)\
  \ {\n    super.onCreate(savedInstanceState);\n    setContentView(R.layout.activity_main);\n\
  \    requestPermission(Manifest.permission.POST_NOTIFICATIONS,\n            NOTIFICATION_REQUEST_CODE);\n\
  }\n```\n\n代码更改完成后，在运行 Android 13 或更高版本的设备或模拟器上编译并运行应用。当所示图 61-7 的对话框出现时，点击“允许”（Allow）按钮以启用通知：\n\
  \n![](img/as_enable_notifications.jpg)\n图 61-7\n\n应用启动后，将其放入后台并打开“设置”应用。在设置中，选择“应用”，选择\
  \ NotifyDemo 项目，并在后续屏幕上点击“通知”项。通知屏幕应该列出 NotifyDemo News 类别对用户处于激活状态：\n\n![](img/as_app_notifications_enabled.jpg)\n\
  图 61-8\n\n在继续之前，确保已为该应用启通知点（notification dots）。\n\n虽然这不是本示例的强制，但值得注意的是，可以通过调用通知管理器的\
  \ `deleteNotificationChannel()` 方法从应用内删除通道，并传递要删除的通道 ID：\n\n```java\nString channelID\
  \ = \"com.ebookfrenzy.notifydemo.news\";\nnotificationManager.deleteNotificationChannel(channelID);\n\
  ```\n\n## 61.7 创建和发布通知\n\n通知是使用 `Notification.Builder` 类创建的，必须包含图标、标题和内容。打开 `MainActivity.java`\
  \ 文件并如下所示实现 `sendNotification()` 方法以构建基础通知：\n\n```java\n.\n.\nimport android.app.Notification;\n\
  import android.view.View;\n.\n.\npublic void sendNotification(View view) {\n   \
  \ String channelID = \"com.ebookfrenzy.notifydemo.news\";\n    Notification notification\
  \ =\n            new Notification.Builder(MainActivity.this,\n                 \
  \   channelID)\n            .setContentTitle(\"Example Notification\")\n       \
  \     .setContentText(\"This is an example notification.\")\n            .setSmallIcon(android.R.drawable.ic_dialog_info)\n\
  \            .setChannelId(channelID)\n            .build();\n}\n```\n\n一旦构建了通知，就需要使用\
  \ `NotificationManager` 实例的 `notify()` 方法进行发布。访问 `NotificationManager` 并发布通知的代码需要如下添加到\
  \ `sendNotification()` 方法中：\n\n```java\nprotected void sendNotification(View view)\
  \ {\n    int notificationID = 101;\n    String channelID = \"com.ebookfrenzy.notifydemo.news\"\
  ;\n    Notification notification =\n            new Notification.Builder(MainActivity.this,\n\
  \                    channelID)\n            .setContentTitle(\"New Message\")\n\
  \            .setContentText(\"You've received new messages.\")\n            .setSmallIcon(android.R.drawable.ic_dialog_info)\n\
  \            .setChannelId(channelID)\n            .build();\n    notificationManager.notify(notificationID,\
  \ notification);\n}\n```\n\n注意，当发布通知时，会为其分配一个通知 ID。该 ID 可以任何整数，并可以在以后更新通知时使用。编译并运行应用，点击主\
  \ activity 上的按钮。当通知图标出现在状态栏中时，从状态栏向下拖动以查看完整通知：\n\n![](img/as_notification.jpg)\n\
  图 61-9\n\n点击并按住通知查看更多信息：\n\n![](img/as_notification_details.jpg)\n图 61-10\n\n接下来，将应用放入后台，导航到显示所有应用启动图标的主屏幕，并注意\
  \ NotifyDemo 启动图标上出现了一个通知点，如图 61-11 所示：\n\n![](img/as_notification_dot.jpg)\n图 61-11\n\
  \n如果点没有出现，请检查设置应用中 NotifyDemo 的通知选项，以确认已如本章前面所述启用了通知点。如果点仍未出现，长按设备主屏幕的空白区域，从结果菜单中选择“主屏幕设置”，并启用“通知点”选项。\n\
  \n长按启动图标将显示一个包含通知的弹出窗口：\n\n![](img/as_dot_detail.jpg)\n图 61-12\n\n如果一个应用有多个待处理通知，长按弹出菜单将包含通知数量。该数字可以在构建通知时通过应用内调用\
  \ `setNumber()` 方法进行配置：\n\n```java\nNotification notification = new Notification.Builder(MainActivity.this,\
  \ CHANNEL_ID)\n        .setContentTitle(\"Example Notification\")\n        .setContentText(\"\
  This is an example notification.\")\n        .setSmallIcon(android.R.drawable.ic_dialog_info)\n\
  \        .setChannelId(CHANNEL_ID)\n        .setNumber(10)\n        .build();\n\
  ```\n\n按照目前的实现，点击通知将没有任何效果。下一步是配置通知在点击时启动 activity。\n\n## 61.8 从通知启动 Activity\n\n\
  理想情况下，通知允许用户执行某种形式的操作，例如启动相应的应用或响应通知采取其他形式的操作。一种常见需求是在用户点击通知时启动属于该应用的 activity。\n\
  \n这种方法需要启动一个 activity 并配置启动该 activity 的 `Intent`。假设应用包含一个名为 `ResultActivity` 的 activity，其创建方式如下：\n\
  \n```java\nIntent resultIntent = new Intent(this, ResultActivity.class);\n```\n\n\
  然后将此 intent 封装在 `PendingIntent` 实例中。`PendingIntent` 对象的设计允许将 `intent` 传递给其他应用程序，授予这些应用程序在未来某个时刻执行该意图的权限。在这种情况下，`PendingIntent`\
  \ 对象用于为通知系统提供一种方式，在用户点击通知面板时启动 `ResultActivity` activity：\n\n```java\nPendingIntent\
  \ pendingIntent =\n    PendingIntent.getActivity(\n            this,\n         \
  \   0,\n            resultIntent,\n            PendingIntent.FLAG_IMMUTABLE);\n\
  ```\n\n剩下的工作是在构建通知过程中使用 `setContentIntent()` 方法分配 `PendingIntent` 对象。\n\n\n\n\n\
  ```java\nimport android.app.PendingIntent;\nimport android.content.Intent;\nimport\
  \ android.graphics.drawable.Icon;\n\nprotected void sendNotification(View view)\
  \ {\n    int notificationId = 101;\n    Intent resultIntent = new Intent(this, ResultActivity.class);\n\
  \    PendingIntent pendingIntent =\n            PendingIntent.getActivity(\n   \
  \                 this,\n                    0,\n                    resultIntent,\n\
  \                    PendingIntent.FLAG_IMMUTABLE\n            );\n    String CHANNEL_ID\
  \ = \"com.ebookfrenzy.notifydemo.news\";\n    Notification notification = new Notification.Builder(MainActivity.this,\n\
  \                                                            CHANNEL_ID)\n     \
  \       .setContentTitle(\"Example Notification\")\n            .setContentText(\"\
  This is an example notification.\")\n            .setSmallIcon(android.R.drawable.ic_dialog_info)\n\
  \            .setChannelId(channelID)\n            .setContentIntent(pendingIntent)\n\
  \            .build();\n    notificationManager.notify(notificationId, notification);\n\
  }\n```\n\n再次编译并运行应用，点击按钮显示通知栏。然而，这一次点击通知将导致 `ResultActivity` 启动。\n\n## 61.9 为通知添加操作\n\
  \n为通知添加交互性的另一种方法是创建操作（actions）。这些操作以按钮的形式显示在通知消息下方，并被设计为在用户点击时触发特定的 intent。如果将以下代码添加到\
  \ `sendNotification()` 方法中，将添加一个标记为“Open”的操作按钮，在被选中时会启动引用的 pending intent：\n\n```java\n\
  final Icon icon = Icon.createWithResource(MainActivity.this,\n        android.R.drawable.ic_dialog_info);\n\
  Notification.Action action =\n    new Notification.Action.Builder(icon, \"Open\"\
  , pendingIntent)\n            .build();\nNotification notification = new Notification.Builder(MainActivity.this,\
  \ CHANNEL_ID)\n        .setContentTitle(\"Example Notification\")\n        .setContentText(\"\
  This is an example notification.\")\n        .setSmallIcon(R.drawable.ic_info_24dp)\n\
  \        .setChannelId(channelID)\n        .setContentIntent(pendingIntent)\n  \
  \      .setActions(action)\n        .build();\nnotificationManager.notify(notificationId,\
  \ notification);\n```\n\n将上述代码添加到方法中并运行应用。发出通知，并注意通知中显示的 Open 操作（取决于 Android 版本，可能需要向下拉通知面板才能显示\
  \ Open 操作）：\n\n![](img/as_notification_action.jpg)\n\n图 61-13\n\n点击操作将触发 pending\
  \ intend 并启动 `ResultActivity`。\n\n## 61.10 组合通知（Bundled Notifications）\n\n如果一个应用倾向于经常发布通知，可能会导致这些通知迅速占满状态栏和通知栏，从而为用户提供欠佳的体验。这对于每当新闻故事或新消息到达就发送通知的新闻或消息应用尤为如此。例如，考虑图\
  \ 6-14 中的通知：\n\n![](img/as_3.2_unbundled_notifications.jpg)\n\n图 6-14\n\n现在想象收到了十或二十条新消息。为了避免此类问题，Android\
  \ 允许将通知打包（bundle）。要打包通知，必须通过 `setGroup()` 方法将每个通知指定为属于同一个组，并且必须发布并配置额外的摘要通知（summary\
  \ notification）。例如，以下代码创建并发布了图 6-14 所示的三个通知，但将它们打包在同一个组中。该代码还发布了一个通知来作为摘要：\n\n```java\n\
  final String GROUP_KEY_NOTIFY = \"group_key_notify\";\nNotification.Builder builderSummary\
  \ =\n    new Notification.Builder(this, channelID)\n            .setSmallIcon(android.R.drawable.ic_dialog_info)\n\
  \            .setContentTitle(\"A Bundle\")\n            .setContentText(\"You have\
  \ 3 new messages\")\n            .setGroup(GROUP_KEY_NOTIFY)\n            .setGroupSummary(true);\n\
  Notification.Builder builder1 =\n    new Notification.Builder(this, channelID)\n\
  \            .setSmallIcon(android.R.drawable.ic_dialog_info)\n            .setContentTitle(\"\
  New Message\")\n            .setContentText(\"You have a new message from Kassidy\"\
  )\n            .setGroup(GROUP_KEY_NOTIFY);\nNotification.Builder builder2 =\n \
  \   new Notification.Builder(this, channelID)\n            .setSmallIcon(android.R.drawable.ic_dialog_info)\n\
  \            .setContentTitle(\"New Message\")\n            .setContentText(\"You\
  \ have a new message from Caitlyn\")\n            .setGroup(GROUP_KEY_NOTIFY);\n\
  Notification.Builder builder3 =\n    new Notification.Builder(this, channelID)\n\
  \            .setSmallIcon(android.R.drawable.ic_dialog_info)\n            .setContentTitle(\"\
  New Message\")\n            .setContentText(\"You have a new message from Jason\"\
  )\n            .setGroup(GROUP_KEY_NOTIFY);\nint notificationId0 = 100;\nint notificationId1\
  \ = 101;\nint notificationId2 = 102;\nint notificationId3 = 103;\nnotificationManager.notify(notificationId1,\
  \ builder1.build());\nnotificationManager.notify(notificationId2, builder2.build());\n\
  notificationManager.notify(notificationId3, builder3.build());\nnotificationManager.notify(notificationId0,\
  \ builderSummary.build());\n```\n\n当代码执行时，状态栏中会出现单个通知图标，尽管实际上发布了四个通知。在通知栏中，会显示一个摘要通知，列出了每个被组合通知的信息：\n\
  \n![](img/2528.jpg)\n\n图 61-15\n\n在通知条目上进一步向下拉，面板将展开以显示每个组合通知的详细信息：\n\n![](img/2536.jpg)\n\
  \n图 61-16\n\n\n\n\n\n在 `Name` 字段中输入 `DirectReply`，并将 `com.ebookfrenzy.directreply`\
  \ 指定包名。在点击 `Finish` 按钮之前，将 `Minimum API level` 设置为 `API 33`（Android 12），并将 `Language`\
  \ 菜单设置为 `Java`。按照第 11.8 Migrating a Project to View Binding 节概述的步骤修改项目以支持 view binding。\n\
  \n## 62.2 设计用户界面\n\n将 `activity_main.xml` 布局文件加载到布局工具中。启用 `Autoconnect` 的情况下，在现有的“Hello\
  \ World!”标签下方添加一个 `Button` 对象，如图 62-1 所示。在布局中选中 `Button` 部件后，使用 `Attributes` 工具窗口将\
  \ `onClick` 属性设置为调用名为 `sendNotification` 的方法。如有必要，使用 `Infer Constraints` 按钮为布局添加任何缺失的约束。在继续之前，选择“Hello\
  \ World!” `TextView` 并将 `id` 属性更改为 `textView`，并将按钮上的文本改为“Notify”。\n\n![](img/as_4.1_direct_reply_ui.jpg)\n\
  \n图 62-1\n\n## 62.3 请求通知权限\n\n在 `Project` 工具窗口中，找到并双击 `AndroidManifest.xml` 文件将其加载到编辑器，并修改\
  \ XML 添加 `permission` 元素：\n\n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n\
  <manifest xmlns:android=\"http://schemas.android.com/apk/res/android\"\n    package=\"\
  com.ebookfrenzy.audioapp\" >\n    <uses-permission android:name=\"android.permission.POST_NOTIFICATIONS\"\
  \ />\n```\n\n编辑 `MainActivity.java` 文件，首先添加一些额外的导入指令和常量，作为所请求权限的请求识别码：\n\n```java\n\
  import androidx.annotation.NonNull;\nimport androidx.core.app.ActivityCompat;\n\
  import androidx.core.content.ContextCompat;\nimport android.widget.Toast;\nimport\
  \ android.Manifest;\nimport android.content.pm.PackageManager;\n\npublic class MainActivity\
  \ extends AppCompatActivity {\n    private static final int NOTIFICATION_REQUEST_CODE\
  \ = 101;\n}\n```\n\n接下来，需要向类中添加一个方法，其目的是将要请求的权限和相应的请求识别码作为参数。在 `MainActivity.java`\
  \ 类文件中，按如下方式实现该方法：\n\n```java\nprotected void requestPermission(String permissionType,\
  \ int requestCode) {\n    int permission = ContextCompat.checkSelfPermission(this,\n\
  \            permissionType);\n    if (permission != PackageManager.PERMISSION_GRANTED)\
  \ {\n        ActivityCompat.requestPermissions(this,\n                new String[]{permissionType},\
  \ requestCode\n        );\n    }\n}\n```\n\n当请求处理完成后，活动将调用 `onRequestPermissionsResult()`\
  \ 方法，并传递识别码和请求结果。因此，下一步是在 `MainActivity.java` 文件中如下实现此方法：\n\n```java\n@Override\n\
  public void onRequestPermissionsResult(int requestCode,\n            @NonNull String[]\
  \ permissions, @NonNull int[] grantResults) {\n    super.onRequestPermissionsResult(requestCode,\
  \ permissions, grantResults);\n    if (requestCode == NOTIFICATION_REQUEST_CODE)\
  \ {\n        if (grantResults.length == 0\n                || grantResults[0] !=\n\
  \                PackageManager.PERMISSION_GRANTED) {\n            Toast.makeText(this,\n\
  \                    \"Notification permission required\",\n                   \
  \ Toast.LENGTH_LONG).show();\n        }\n    }\n}\n```\n\n在测试应用之前，剩下的工作是在应用启动时调用新添加的\
  \ `requestPermission()` 方法。在 `MainActivity.java` 文件中，按如下方式修改 `onCreate()` 方法：\n\n\
  ```java\n@Override\nprotected void onCreate(Bundle savedInstanceState) {\n    super.onCreate(savedInstanceState);\n\
  \    setContentView(R.layout.activity_main);\n    binding = ActivityMainBinding.inflate(getLayoutInflater());\n\
  \    View view = binding.getRoot();\n    setContentView(view);\n    requestPermission(Manifest.permission.POST_NOTIFICATIONS,\n\
  \            NOTIFICATION_REQUEST_CODE);\n}\n```\n\n## 62.4 创建通知通道\n\n与上一章的示例一样，在发送通知之前必须创建一个通道。编辑\
  \ `MainActivity.java` 文件并添加代码以创建一个新通道：\n\n```java\nimport android.app.NotificationChannel;\n\
  import android.app.NotificationManager;\nimport android.content.Context;\n\npublic\
  \ class MainActivity extends AppCompatActivity {\n    private NotificationManager\
  \ notificationManager;\n    private final String channelID = \"com.ebookfrenzy.direct.reply\"\
  ;\n\n    @Override\n    protected void onCreate(Bundle savedInstanceState) {\n \
  \       notificationManager = (NotificationManager)\n                getSystemService(Context.NOTIFICATION_SERVICE);\n\
  \        createNotificationChannel(channelID, \"DirectReply News\", \"Example Channel\"\
  );\n    }\n\n    protected void createNotificationChannel(String id, String name,\
  \ String description) {\n        int importance = NotificationManager.IMPORTANCE_HIGH;\n\
  \        NotificationChannel channel = new NotificationChannel(id, name, importance);\n\
  \        channel.setDescription(description);\n        channel.enableLights(true);\n\
  \        channel.setLightColor(Color.RED);\n        channel.enableVibration(true);\n\
  \        channel.setVibrationPattern(new long[]{100, 200, 300});\nnotificationManager.createNotificationChannel(channel);\n\
  \    }\n}\n```\n\n## 62.5 构建 RemoteInput 对象\n\n在通知中实现内联直接回复的关键元素是 `RemoteInput`\
  \ 类。之前的章节引入了 `PendingIntent` 类，并解释了它允许一个应用创建意图并授予其他应用或服务启动该意图的能力。在名为`An Notifications\
  \ Tutorial` 的章节中，创建了一个允许从通知内启动原始应用的意图。`RemoteInput` 类允许将用户请求包含在 `PendingIntent`\
  \ 对象中。当 `PendingIntent` 对象中的意触发时（例如启动活动），该活动将接收用户提供的任何输入。\n\n在通知中实现直接回复的第一步是创建 `RemoteInput`\
  \ 对象。这通过 `RemoteInput.Builder()` 方法实现。构建 `RemoteInput` 对象需要一个键字符串，用于从生成的意图中提取输入。该对象还需要一个标签字符串，显示在通知的输入字段中。编辑\
  \ `MainActivity.java` 文件并开始实现 `sendNotification()` 方法。注意还添加了一些后续章节将使用的导入指令和变量：\n\
  \n```java\npackage com.ebookfrenzy.directreply;\n\nimport android.app.PendingIntent;\n\
  import android.app.RemoteInput;\nimport android.content.Intent;\n\npublic class\
  \ MainActivity extends AppCompatActivity {\n    private static final int notificationId\
  \ = 101;\n    private static final String KEY_TEXT_REPLY = \"key_text_reply\";\n\
  \    private NotificationManager notificationManager;\n    private static final\
  \ String channelID = \"com.ebookfrenzy.directreply.news\";\n\n    public void sendNotification(View\
  \ view) {\n        String replyLabel = \"Enter your reply here\";\n        RemoteInput\
  \ remoteInput =\n                new RemoteInput.Builder(KEY_TEXT_REPLY)\n     \
  \           .setLabel(replyLabel)\n                .build();\n    }\n}\n```\n\n\n\
  \n\n现在 `RemoteInput` 对象已经创建并使用键和标签字符串完成，它将需要被放置在一个通知操作对象内部。然而，在执行该步骤之前，需要创建 `PendingIntent`\
  \ 实例。\n\n## 62.6 创建 PendingIntent\n\n创建 `PendingIntent` 的步骤与“Android 通知教程”章节中概述的步骤相同，区别在于该意图将配置为启动\
  \ `MainActivity`。在 `MainActivity.java` 文件中添加以下代码来创建 `PendingIntent`：\n\n```java\n\
  public void sendNotification(View view) {\n    String replyLabel = \"Enter your\
  \ reply here\";\n    RemoteInput remoteInput =\n            new RemoteInput.Builder(KEY_TEXT_REPLY)\n\
  \            .setLabel(replyLabel)\n            .build();\n    Intent resultIntent\
  \ = new Intent(this, MainActivity.class);\n    PendingIntent resultPendingIntent\
  \ =\n            PendingIntent.getActivity(\n                this,\n           \
  \     0,\n                resultIntent,\n                PendingIntent.FLAG_MUTABLE\n\
  \            );\n}\n```\n\n## 62.7 创建回复操作\n\n通过操作按钮，可以在通知中直接访问内联回复。现在需要创建此操作，并为其配置图标、显示在按钮上的标签、`PendingIntent`\
  \ 对象以及 `RemoteInput` 对象。修改 `sendNotification()` 方法以添加创建此操作的代码：\n\n```java\nimport\
  \ android.graphics.drawable.Icon;\nimport android.app.Notification;\n\npublic void\
  \ sendNotification(View view) {\n    String replyLabel = \"Enter your reply here\"\
  ;\n    RemoteInput remoteInput =\n            new RemoteInput.Builder(KEY_TEXT_REPLY)\n\
  \            .setLabel(replyLabel)\n            .build();\n    Intent resultIntent\
  \ = new Intent(this, MainActivity.class);\n    PendingIntent resultPendingIntent\
  \ =\n            PendingIntent.getActivity(\n                this,\n           \
  \     0,\n                resultIntent,\n                PendingIntent.FLAG_MUTABLE\n\
  \            );\n    final Icon icon =\n            Icon.createWithResource(MainActivity.this,\n\
  \                android.R.drawable.ic_dialog_info);\n    Notification.Action replyAction\
  \ =\n            new Notification.Action.Builder(\n                icon,\n     \
  \           \"Reply\", resultPendingIntent)\n            .addRemoteInput(remoteInput)\n\
  \            .build();\n}\n```\n\n在教程的这一阶段，我们已经构建了可以随时使用的 `RemoteInput`、`PendingIntent`\
  \ 和 `Action` 对象。下一阶段是构建并发布通知：\n\n```java\npublic void sendNotification(View view)\
  \ {\n    String replyLabel = \"Enter your reply\";\n    RemoteInput remoteInput\
  \ =\n        new RemoteInput.Builder(KEY_TEXT_REPLY)\n        .setLabel(replyLabel)\n\
  \        .build();\n    Intent resultIntent = new Intent(this, MainActivity.class);\n\
  \    PendingIntent resultPendingIntent =\n            PendingIntent.getActivity(\n\
  \                this,\n                0,\n                resultIntent,\n    \
  \            PendingIntent.FLAG_IMMUTABLE\n            );\n    final Icon icon =\n\
  \        Icon.createWithResource(MainActivity.this,\n            android.R.drawable.ic_dialog_info);\n\
  \    Notification.Action replyAction =\n        new Notification.Action.Builder(\n\
  \            icon,\n            \"Reply\", resultPendingIntent)\n        .addRemoteInput(remoteInput)\n\
  \        .build();\n    Notification newMessageNotification =\n        new Notification.Builder(this,\
  \ channelID)\n            .setColor(ContextCompat.getColor(this,\n             \
  \   android.R.color.holo_blue_dark))\n            .setSmallIcon(\n             \
  \   android.R.drawable.ic_dialog_info)\n            .setContentTitle(\"My Notification\"\
  )\n            .setContentText(\"This is a test message\")\n            .addAction(replyAction).build();\n\
  \    NotificationManager notificationManager =\n        (NotificationManager) getSystemService(Context.NOTIFICATION_SERVICE);\n\
  \    notificationManager.notify(notificationId, newMessageNotification);\n}\n```\n\
  \n完成更改后，编译并运行应用，允许通知，并测试点击按钮是否会发布通知。当查看通知栏时，通知应该如图 62-2 所示：\n\n(image/as_direct_reply.jpg)\n\
  图 62-2\n\n点击“回复”（Reply）操作，使输入字段出现，并显示在创建 `RemoteInput` 对象时嵌入的回复标签。\n\n(image/as_direct_reply_enter.jpg)\n\
  图 62-3\n\n输入一些文本并点击位于输入字段末尾的发送按钮。\n\n## 62.8 接收直接输入\n\n现在通知已成功向用户获取输入，应用需要对该输入进行处理。本教程的目标是让用户在通知中输入的文本显示在用户界面上的\
  \ `TextView` 组件上。\n\n当用户输入文本并点击发送按钮时，`MainActivity` 将通过 `PendingIntent` 对象包含的 `intent`\
  \ 启动。该意图中包含了用户通过通知输入的文本。在 Activity 的 `onCreate()` 方法中，调用 `getIntent()` 将返回意图的副本。通过将其传递给\
  \ `RemoteInput.getResultsFromIntent()` 方法，反将返回一个包含回复文本的 `Bundle` 对象，可以从中提取该文本并将其赋值给\
  \ `TextView` 组件。这导致了 `MainActivity.java` 文件中修改后的 `onCreate()` 方法如下：\n\n```java\n\
  @Override\nprotected void onCreate(Bundle savedInstanceState) {\n    createNotificationChannel(channelID,\
  \ \"DirectReply\", \"Example Channel\");\n    handleIntent();\n}\n\nprivate void\
  \ handleIntent() {\n    Intent intent = this.getIntent();\n    Bundle remoteInput\
  \ = RemoteInput.getResultsFromIntent(intent);\n    if (remoteInput != null) {\n\
  \        String inputString = remoteInput.getCharSequence(KEY_TEXT_REPLY).toString();\n\
  \        binding.textView.setText(inputString);\n    }\n}\n```\n\n完成代码更改后，再次构建并运行应用。点击按钮发布通知，并在通知面板内输入并发送文本。注意\
  \ `MainActivity` 中的 `TextView` 组件已更新以显示输入的内联文本。\n\n## 62.9 更新通知\n\n在通知中发送回复后，你可能注意到进度指示在通知面板内继续旋转，如图\
  \ 62-4 所示：\n\n(image/as_direct_reply_progress.jpg)\n图 62-4\n\n通知显示此指示器是因为它正在等待 Activity\
  \ 确认接收到的发送文本。执行此任务的推荐方法是更新通知，指示回复已接收并处理。由于原始通知在发布时已分配了 ID，因此可以再次使用它执行更新。将以下代码添加到\
  \ `handleIntent()` 方法中以执行此任务：\n\n```java\nprivate void handleIntent() {\n    Intent\
  \ intent = this.getIntent();\n    Bundle remoteInput = RemoteInput.getResultsFromIntent(intent);\n\
  \    if (remoteInput != null) {\n        String inputString = remoteInput.getCharSequence(KEY_TEXT_REPLY).toString();\n\
  \        binding.myTextView.setText(inputString);\n        Notification repliedNotification\
  \ =\n```\n\n\n\n\n\n```java\nnew Notification.Builder(this, channelID)\n    .setSmallIcon(android.R.drawable.ic_dialog_info)\n\
  \    .setContentText(\"Reply received\")\n    .build();\nnotificationManager.notify(notificationId,\
  \ repliedNotification);\n}\n```\n\n最后一次测试应用，并验证在内联回复文本发送后进度指示器会消失，并且会出现一个新面板显示回复已收到：\n\
  \n![](img/as_direct_reply_received.jpg)\n图 62-5\n\n## 62.10 总结\n\n直接回复通知功能允许用户在通知中输入文本，并通过\
  \ `intent` 将其传递给相应应用程序的活动（activity）。直接回复的实现依赖于 `RemoteInput` 类，该类的实例可以嵌入到操作（action）中，并与通知一起打包。在处理直接回复通知时，让\
  \ `NotificationManager` 服务知道回复已收到并处理至关重要。实现这一点的最佳方法是使用首次发布通知时提供的 `notification ID`\
  \ 来直接更新通知消息。\n\n## 63 折叠屏设备与多窗口支持\n\n无论我们是否准备好，折叠屏设备都会到来（对于第一代三星 Galaxy Fold 来说，甚至可能在设备本身准备好之前就出现了）。为了准备这一类新设备，了解应该采取的一些额外步骤非常重要，以确保你的应用在折叠屏设备上运行正常。\n\
  \n幸运的是，支持折叠屏设备的大部分行为已经以多窗口支持的形式存在于 Android 中。\n\n### 63.1 折叠屏与多窗口支持\n\n当应用运行在折叠屏设备上时，它可能会与其他应用共享屏幕，并遇到显著的配置更改（例如当用户折叠或展开显示器时屏幕尺寸发生的变化）。如果你的应用已经设计为可以处理设备方向的变化，那么它很可能也能处理由屏幕折叠引起的变化，尽管建议进行彻底测试。\n\
  \n多窗口支持最初是随 Android 7 引入的。与 Android 之前的版本不同，Android 7 中的多窗口支持允许设备屏幕上同时显示多个活动。\n\n\
  Android 中的多窗口支持提供了三种不同形式的窗口支持。分屏模式适用于大多数手机、折叠屏和平板电脑设备，它提供了一个分屏环境，其中两个活动并排或一个在上在上地显示。系统提供了一个可移动的分割线，用户通过拖动分割线可以调整分配给相邻两个活动的屏幕百分比：\n\
  \n![](img/Image24272.jpg)\n图 63-1\n\n自由窗口模式（Freeform mode）为大屏设备提供了窗口环境，目前由设备制造商决定是否启用。自由窗口与分屏模式的区别在于，它允许每个活动在独立的、可调整大小的窗口中出现，并且不限于同时显示两个活动。例如，图\
  \ 63-2 显示了一个处于自由窗口模式的设备，计算器和第二个应用显示在独立的窗口中：\n\n![](img/Image24362.jpg)\n图 63-2\n\
  \n画中画（Picture-in-picture）支持正如顾名一样，允许视频在用户执行其他任务时在较小的窗口中继续播放，该主题将在“Android 画中画模式”章节开始介绍。\n\
  \n### 63.2 使用折叠屏模拟器\n\n尽管在编写本文时市场上还没有可以进行应用测试的折叠屏设备，但 Android SDK 包含了折叠屏模拟器。要创建一个折叠屏模拟器，选择\
  \ `Android Studio Tools -> AVD Manager` 菜单选项，点击 `Create Virtual Device` 按钮，并在硬件选择屏幕上，选择下方图\
  \ 63-3 所示的 `Foldable` 选项之一：\n\n![](img/as_foldable_device_template.jpg)\n图 63-3\n\
  \n在选择折叠屏类型后，继续创建过程，选择 `Android 10 API 29` 或更高版本作为系统镜像。\n\n一旦模拟器启动运行，工具栏上会出现一个额外的按钮，允许模拟器在折叠和展开的配置之间进行切换：\n\
  \n### 63.3 进入多窗口模式\n\n可以通过显示概览（Overview）屏幕、长按应用图标并选择如图 63-5 所示的分屏（Split screen）选项来进入分屏模式：\n\
  \n![](img/as_3.5_split_screen.jpg)\n图 63-5\n\n一旦进入分屏模式，概览按钮将变为显示两个矩形 (A)，当前活动将占据屏幕部分\
  \ (B)，概览屏幕将出现在相邻部分，允许选择第二个活动 (C)：\n\n![](img/as_3.5_select_app.jpg)\n图 63-6\n\n\
  一旦选择了第二个应用，屏幕将如之前所示对半划分。要退出分屏模式，只需将分离两个活动的分割线拖动到远端边缘，使一个活动占据整个屏幕，或者长按概览按钮直到它恢复为单个正方形。\n\
  \n### 63.4 启用并使用自由窗口支持\n\n虽然在所有设备上都没有得到官方支持，但在大设备和模拟器上可以启用自由窗口多窗口模式。要启用此模式，在模拟器运行或设备连接时，运行以下\
  \ `adb` 命令：\n\n```\nadb shell settings put global enable_freeform_support 1\n```\n\
  \n在做出此更改后，可能需要重启设备设置才会生效。一旦启用，在概览屏幕中长按应用图标时，会出现一个额外的选项，如图 63-7 所示：\n\n![](img/as_3.5_freeform_button.jpg)\n\
  图 63-7\n\n### 63.5 检查自由窗口支持\n\n正如本章早期概述，Google 将是否启用自由窗口多窗口模式的选择权交给了各个设备制造商。由于自由窗口只在大设备上才有意义，因此无法保证应用可能运行的每个设备上都有自由窗口支持。幸运的是，如果设备不支持自由窗口，系统会忽略所有自由窗口特定的方法和属性，因此使用它们不会导致应用在非自由窗口设备上崩溃。但在某些情况下，我们需要检测设备是否支持自由窗口多窗口模式。幸运的是，可以通过检查包管理器中的自由窗口管理功能来实现。以下代码示例检查自由窗口支持情况，并根据测试结果返回\
  \ `Boolean` 值：\n\n```java\npublic Boolean checkFreeform() {\n    return getPackageManager().hasSystemFeature(\n\
  \        PackageManager.FEATURE_FREEFORM_WINDOW_MANAGEMENT);\n}\n```\n\n### 63.6\
  \ 在应用中启用多窗口支持\n\n清单文件的 `android:resizableActivity` 设置控制应用是否支持多窗口行为。此设置可以在应用程序级别或单个活动级别进行。例如，以下片段配置名为\
  \ `MainActivity` 的活动支持分屏和自由窗口多窗口模式：\n\n```xml\n<activity\n```\n\n\n\n\n\n```xml\n\
  <activity\n    android:name=\".MainActivity\"\n    android:resizeableActivity=\"\
  true\"\n    android:label=\"@string/app_name\"\n    android:theme=\"@style/AppTheme.NoActionBar\"\
  >\n    <intent-filter>\n        <action android:name=\"android.intent.action.MAIN\"\
  \ />\n        <category android:name=\"android.intent.category.LAUNCHER\" />\n \
  \   </intent-filter>\n</activity>\n```\n\n将该属性设置为 false 将防止 activity 出现在分屏或自由窗口（freeform）模式下，相应的按钮将不会出现在应用的概述（Overview）菜单中。在分屏配置中选择一个禁用了多窗口支持的\
  \ activity 作为第二个 activity，将显示一条消息指示该应用可能不支持多窗口模式。\n\n## 63.7 指定多窗口属性\n\n`<layout>`\
  \ 元素提供了若干属性，用于指定 activity 在多窗口模式下启动时的尺寸和位置。当 activity 在自由窗口模式下启动时，其初始高度、宽度和位置可以使用以下属性指定：\n\
  \n*   `android:defaultWidth` – 指定 activity 的默认宽度。\n*   `android:defaultHeight` –\
  \ 指定 activity 的默认高度。\n*   `android:gravity` – 指定 activity 的初始位置（start、end、left、right、top\
  \ 等）。\n\n注意，上述属性仅当 activity 在自由窗口模式下显示时生效。以下示例配置了 activity 使在屏幕起始边缘顶部以特定的高度和宽度显示：\n\
  \n```xml\n<activity android:name=\".MainActivity \">\n    <layout\n        android:defaultHeight=\"\
  350dp\"\n        android:defaultWidth=\"450dp\"\n        android:gravity=\"start|end\"\
  \ />\n</activity>\n```\n\n以下 `<layout>` 属性可指定 activity 在分屏视图或自由窗口模式下可以缩减的最小宽度和高度：\n\
  \n*   `android:minimalHeight` – 指定在分屏或自由窗口模式下，activity 可缩减的最小高度。\n*   `android:minimalWidth`\
  \ - 指定在分屏或自由窗口模式下，activity 可缩减的最小宽度。\n\n当用户将分屏分割线滑动超出最小高度或宽度边界时，系统将停止调整收缩中 activity\
  \ 的布局，并简单对用户界面进行裁剪，为相邻的 activity 留出空间。\n\n以下清单文件片段为 activity 实现了最小宽度和高度属性：\n\n```xml\n\
  <activity android:name=\".MainActivity \">\n    <layout\n        android:minimalHeight=\"\
  400dp\"\n        android:minimalWidth=\"290dp\" />\n</activity>\n```\n\n## 63.8\
  \ 在 Activity 中检测多窗口模式\n\n可能会出现这种情况：activity 需要检测其当前是否正以多窗口模式显示给用户。可以通过调用 `Activity`\
  \ 类的 `isInMultiWindowMode()` 方法获取当前状态。当调用此方法时，它根据 activity 当前是否处于全屏状态返回 true 或 false\
  \ 值：\n\n```java\nif (this.isInMultiWindowMode()) {\n    // Activity 正在多窗口模式运行\n\
  } else {\n    // Activity 不在多窗口模式\n}\n```\n\n## 63.9 接收多窗口通知\n\n如果 activity 重写了\
  \ `onMultiWindowModeChanged()` 回调方法，它将接收进入或退出多窗口模式的通知。传递给方法的第一个参数在进入多窗口模式时为 true，在\
  \ activity 退出该模式时为 false。新的配置设置包含在作为第二个参数传递的 `Configuration` 对象中：\n\n```java\n@Override\n\
  public void onMultiWindowModeChanged(boolean isInMultiWindowMode, Configuration\
  \ newConfig) {\n    super.onMultiWindowModeChanged(isInMultiWindowMode, newConfig);\n\
  \    if (isInMultiWindowMode) {\n        // Activity 已进入多窗口模式\n    } else {\n  \
  \      // Activity 已退出多窗口模式\n    }\n}\n```\n\n正如在[处理 Android Activity 状态变化]章节中所述的，Android\
  \ 10 及更高版本允许多个 activity 同时处于恢复（resumed）状态（也称为多恢复状态）。用户最近交互的 activity 被称为“顶层恢复 activity”（topmost\
  \ resumed activity）。为了跟踪 activity 获取和丢失顶层恢复状态，可以在 activity 中实现 `onTopResumedActivityChanged()`\
  \ 回调方法，例如：\n\n```java\n@Override\npublic void onTopResumedActivityChanged(boolean\
  \ isTopResumedActivity) {\n    if (isTopResumedActivity) {\n        // Activity\
  \ 现在是顶层 activity\n    } else {\n        // Activity 不是顶层 activity\n    }\n}\n```\n\
  \n在运行 Android 9 的设备上，通过在清单中启用以下属性，也可以利用多恢复状态：\n\n```xml\n<meta-data name=\"android.allow_multiple_resumed\"\
  \ value=\"true\" />\n```\n\n## 63.10 在多窗口模式下启动 Activity\n\n在本书的[显式意图 – 示例]章节中，创建了一个示例，其中\
  \ activity 使用 intent 启动第二个 activity。默认情况下，通过 intent 启动的 activity 被认为与源 activity\
  \ 处于同一个任务（task）中。然而，可以通过传递 intent 相应的标志将 activity 启动到一个新任务。\n\n要将 activity 启动到新栈，必须在\
  \ intent 上设置以下标志：\n\n*   `Intent.FLAG_ACTIVITY_ADJACENT`\n*   `Intent.FLAG_ACTIVITY_MULTIPLE_TASK`\n\
  *   `Intent.FLAG_ACTIVITY_NEW_TASK`\n\n以下代码示例配置并启动第二个 activity 以在独立窗口显示：\n\n```java\n\
  Intent i = new Intent(this, SecondActivity.class);\ni.addFlags(Intent.FLAG_ACTIVITY_ADJACENT\
  \ |\n           Intent.FLAG_ACTIVITY_MULTIPLE_TASK |\n           Intent.FLAG_ACTIVITY_NEW_TASK);\n\
  startActivity(i);\n```\n\n## 63.11 配置自由窗口 activity 的尺寸和位置\n\n默认情况下，在自由窗口模式下启动到不同任务栈的\
  \ activity 将以系统指定的尺寸位于屏幕中心。此窗口的位置和维度可以通过通过 `ActivityOptions` 类将边界设置传递给 intent 来控制。此过程的第一步是创建一个\
  \ `Rect` 对象，并配置代表 activity 窗口的左（X）、顶（Y）、右（X）和底（Y）坐标。以下代码示例创建了一个 `Rect` 对象，其左上角位于坐标\
  \ (0, 0)，右下角位于 (100, 100)：\n\n```java\nRect rect = new Rect(100, 800, 900, 700);\n\
  ```\n\n下一步是创建 `ActivityOptions` 类的基本实例，并通过 `setLaunchBounds()` 方法使用 `Rect` 设置进行初始化：\n\
  \n```java\nActivityOptions options = ActivityOptions.makeBasic();\nActivityOptions\
  \ bounds = options.setLaunchBounds(rect);\n```\n\n最后，将 `ActivityOptions` 实例转换为 `Bundle`\
  \ 对象，并同 `Intent` 对象一起传递给 `startActivity()` 方法：\n\n```java\nstartActivity(i, bounds.toBundle());\n\
  ```\n\n结合这些步骤后得到的代码序列如下：\n\n\n\n\n\n```java\nIntent i = new Intent(this, SecondActivity.class);\n\
  \ni.addFlags(Intent.FLAG_ACTIVITY_LAUNCH_ADJACENT|\n           Intent.FLAG_ACTIVITY_MULTIPLE_TASK|\n\
  \           Intent.FLAG_ACTIVITY_NEW_TASK);\nRect rect = new Rect(100, 800, 900,\
  \ 700);\n\nActivityOptions options = ActivityOptions.makeBasic();\nActivityOptions\
  \ bounds = options.setLaunchBounds(rect);\n\nstartActivity(i, bounds.toBundle());\n\
  ```\n\n当源 Activity 处于自由窗口（freeform）模式时，通过 启动第二个 Activity，新活动窗口将按照 `Rect` 对象定义的 Location\
  \ 和尺寸出现。\n\n## 63.12 总结\n\nAndroid 7 引入了多窗口支持，这种系统允许在屏幕上同时显示多个 Activity。这一功能现在已成为为折叠设备提供支持的基础。多窗口支持提供了三种模式：分屏模式、自由窗口和画中画。在分屏模式下，屏幕被水平或垂直分为两个窗格，每个窗格中显示一个\
  \ Activity。自由窗口模式仅在某些 Android 设备上支持，允许每个 Activity 出现在独立的、可移动且可调整大小的窗口中。如本文所述，Android\
  \ SDK 提供了许多方法和属性设置，用于在应用内检测、响应和控制多窗口行为。\n\n## 64. Android SQLite 数据库概述\n\n不需要存储至少某些持久化数据的移动应用寥寥其微。数据库的使用大多数应用程序不可或缺的方面，从几乎完全由数据驱动的应用，到只需要存储少量数据（如游戏的当前得分）的应用皆如此。\n\
  \n考虑到典型 Android 应用具有短暂的生命周期，持久化数据存储的重要性变得更加显现。由于 Android 运行时系统始终存在释放资源而终止应用程序组件的风险，制定全面的数据存储策略以避免数据丢失，是任何应用开发策略设计和实现的关键因素。\n\
  \n本章将概述 Android 系统捆带的 SQLite 数据库管理系统，并概述提供的 Android SDK 类，以便在 Android 应用内部实现基于 SQLite\
  \ 的持久化数据库存储。不过在探讨 Android 开发背景下的 SQLite 细节之前，将先对数据库和 SQL 进行简要概述。\n\n### 64.1 理解数据库表\n\
  \n数据库表（Database Tables）提供了数据库中最基础的数据结构级别。每个数据库可以包含多个表，每个表都设计用于存储特定类型的信息。例如，一个数据库可能包含一个客户表，其中包含特定业务的每位客户的名称、地址和电话号码。同一个数据库也可能包含一个产品表，用于存储该业务销售物品的产品描述以及相关的产品代码。\n\
  \n数据库中的每个表都分配有一个名称，该名称在相应的特定数据库中必须是唯一的。表名一旦分配给某个数据库中的表，除非在另一个数据库的上下文中，否则不能用于另一个表。\n\
  \n### 64.2 引入数据库模式（Schema）\n\n数据库模式（Database Schemas）定义了存储在数据库表中的数据特征。例如，客户数据库表的模式可能定义客户名称为长度不超过\
  \ 20 个字符的字符串，客户电话为特定格式的数值数据字段。\n\n模式还用于定义整个数据库的结构以及每个数据库中包含各种表之间的关系。\n\n### 64.3\
  \ 列与数据类型\n\n在此阶段，将数据库表视为类似于电子表格是有帮助的，其中数据存储在行和列中。\n\n每一列代表对应表中的一个数据字段。例如，表的名称、地址和电话数据字段都是列。\n\
  \n每一列又被定义为包含特定类型的数据。因此，设计用于存储数字的列将被定义为包含数值数据。\n\n### 64.4 数据库行\n\n保存到表中的每条新记录都存储在行（row）中。每一行又由与保存记录相关的数据列组成。\n\
  \n再次考虑本章前面提到的电子表格类比。客户表中的每个条目等同于电子表格中的一行，每一列都包含每位客户的数据（名称、地址、电话等）。当向表中添加新客户时，会创建一个新行，并将该客户的数据存储在新行对应的列中。\n\
  \n行（Rows）有时也被称为记录（records）或条目（entries），这些术语通常可以互换。\n\n### 64.5 引入主键\n\n每个数据库表都应该包含一个或多个列，这些列可唯一标识表中的每一行。这在数据库术语中被称为主键（Primary\
  \ Key）。例如，一个表可以使用银行账户号列作为主键。或者，客户表可以使用客户的社会安全号码作为主键。\n\n主键允许数据库管理系统唯一地识别表中的特定行。如果没有主键，将无法检索或删除表中的特定行，因为无法确定是否选择了正确的行。例如，假设存在一个表，客户的姓氏被定义为主键。想象一下，如果数据库中记录了多个名为“Smith”的客户，可能会出现什么问题。如果没有某种可靠的方法来唯一标识特定行，就无法确保在任何时刻访问的正确的数据。\n\
  \n主键可以由表中的单列或多列组成。要符合单列主键的条件，任何两行都不能包含匹配的主键值。当使用多个列构建主键时，单个列的值不需要唯一，但所有列的值组合必须是唯一的。\n\
  \n### 64.6 什么是 SQLite？\n\nSQLite 是一种嵌入式关系型数据库管理系统（RDBMS）。大多数关系型数据库（Oracle、SQL Server\
  \ 和 MySQL 是例子）是独立的服务器进程，独立与需要数据库访问的应用程序协作运行。SQLite 被称为嵌入式，是因为是以库的形式提供并链接到应用程序中的。因此，后台没有独立的数据库服务器。所有的数据库操作通过调用\
  \ SQLite 库中的函数在应用程序内部处理。\n\nSQLite 的开发者已将该技术投入公共领域，结果是它现在成为一种广泛部署的数据库解决方案。\n\nSQLite\
  \ 使用 C 语言编写，因此 Android SDK 提供了一个围绕底层数据库接口的 Java 封装器。这本质上由一组类组成，可以在应用程序的 Java 或 Kotlin\
  \ 代码中使用它们来创建和管理 SQLite 数据库。\n\n有关 SQLite 的更多信息，请参阅 `https://www.sqlite.org`。\n\n\
  ### 64.7 结构化查询语言 (SQL)\n\n在 SQLite 数据库中使用名为结构化查询语言的高级语言访问数据。这种语言通常缩写为 `SQL`，读作 sequel。`SQL`\
  \ 是大多数关系型数据库管理系统使用的标准语言。SQLite 基本符合 SQL-92 标准。\n\n\n\n\nSQL 本质上是一种非常简单且易用的语言，专门为实现读取和写入数据库数据而设计。由于\
  \ SQL 包含一组较小的关键字，因此很容易学会。此外，不同 DBMS 实现之间的 SQL 语法在很大程度上是相同的，因此学习了 SQL 后可以迁移到其他管理系统中。虽然本章将使用一些基础\
  \ SQL 语句，但对 SQL 的详细概述超出了本书的范围。不过，还有许多其他资源可以提供比我们在本章节中提供的要详得多的 SQL 概述。\n\n在 Android\
  \ 虚拟设备 (AVD) 上尝试 SQLite\n\n对于对通用数据库（尤其是 SQLite）不熟悉的读者来说，深入学习创建一个使用 SQLite 的 Android\
  \ 应用程序可能看起来有些令人令畏。幸运的是，Android 预装了 SQLite，包括一个可以在 `adb shell` 中发布 SQL 命令的交互式环境。这既是学习\
  \ SQLite 的有效方法，也是识别在模拟器中运行的应用程序所创建的数据库问题的不可价值的工具。\n\n要启动交互式 SQLite 会话，首先运行 AVD。这可以在\
  \ Android Studio 中通过启动 Android 设备管理器（Tools -> AVD），选择一个之前配置过的 AVD 并点击启动按钮来实现。一旦\
  \ AVD 启动运行，打开终端或命令行窗口，并使用 `adb` 命令行工具连接到模拟器，如下（注意 `-e` 标志指示工具查找模拟器而非物理设备）：\n\n```\n\
  adb -e shell\n```\n\n连接成功后，shell 环境将提供一个提示符，可以在其中输入命令。首先通过使用 `su` 获取超级权限：\n\n```\n\
  root@android:/ su\n```\n\n如果出现显示不允许使用超级权限的消息，很可能是该 AVD 实例包含了 Google 保护。要解决这个问题，请创建一个新的\
  \ AVD，并在“选择设备”（Choose a device）屏幕上，选择一个没有标记的设备。存储在 SQLite 数据库中的数据实际上存储在运行应用程序的 Android\
  \ 设备文件系统的数据库文件中。默认情况下，这些文件的文件系统路径如下：\n\n`/data/data/<package name>/databases/<database\
  \ filename>.db`\n\n例如，如果包名为 `com.example.MyDBApp` 的应用程序创建了一个名为 `mydatabase.db` 的数据库，则设备上的文件路径将显示如下：\n\
  \n`/data/data/com.example.MyDBApp/databases/mydatabase.db`\n\n为了进行练习，请在 `adb shell`\
  \ 中切换目录到 `/data/data` 并创建一个适合实验的子目录层次结构：\n\n```\ncd /data/data\nmkdir com.example.db\n\
  cd com.example.db\nmkdir databases\n```\n\n为数据库文件创建了合适的位置后，如下启动交互式 SQLite 工具：\n\n\
  ```\nroot@android:/data/data/databases # sqlite3 ./mydatabase.db\n```\n\n```\nSQLite\
  \ version 3.8.10 2015-05-20 18:17:19\nEnter \".help\" for usage hints.\nsqlite>\n\
  ```\n\n在 `sqlite>` 提示符处，可以输入命令来执行创建表、插入和检索数据等任务。例如，若要在我们的数据库中创建一个包含存储 ID、名称、地址和电话号码字段的新表，需要以下语句：\n\
  \n```sql\ncreate table contacts (_id integer primary key autoincrement, name text,\
  \ address text, phone text);\n```\n\n注意，表中的每一行都应该有一个对该行唯一的的主键。在上面的示例中，我们将 `_id`\
  \ 字段指定为主键，将其声明为 `integer` 类型，并要求 SQLite 在每次添加行时增加数字。这是确保每行都有唯一主键的常用方法。在大多数其他平台上，主键的名称选择是任意的。但在\
  \ Android 中，主键必须命名为 `_id`，以便使用所有的 Android 数据库相关类完全访问数据库。剩余字段每个都被声明为 `text` 类型。要列出当前选择数据库中的表，请使用\
  \ `.tables` 语句：\n\n```\nsqlite> .tables\ncontacts\n```\n\n向表中插入记录：\n\n```sql\nsqlite>\
  \ insert into contacts (name, address, phone) values (\"Bill Smith\", \"123 Main\
  \ Street, California\", \"123-555-2323\");\nsqlite> insert into contacts (name,\
  \ address, phone) values (\"Mike Parks\", \"10 Upping Street, Idaho\", \"444-444-1212\"\
  );\n```\n\n从表中检索所有行：\n\n```sql\nsqlite> select * from contacts;\n1|Bill Smith|123\
  \ Main Street, California|123-555-2323\n2|Mike Parks|10 Upping Street, Idaho|444-444-1212\n\
  ```\n\n提取符合特定标准的行：\n\n```sql\nsqlite> select * from contacts where name=\"Mike Parks\"\
  ;\n2|Mike Parks|10 Upping Street, Idaho|444-444-1212\n```\n\n退出 `sqlite3` 交互式环境：\n\
  \n```\nsqlite> .exit\n```\n\n在模拟器环境中运行 Android 应用程序时，任何数据库文件都将使用之前讨论的路径约定创建在模拟器的文件系统中。这样做的好处是，你可以通过\
  \ `adb` 连接，导航到数据库文件位置，将其加载到 `sqlite3` 交互式工具中，并对数据执行任务，以识别应用程序代码中可能发生的问题。\n\n\n\n\
  `Room` 持久库是 Android 架构组件的一部分，它专门设计用于更方便地为 Android 应用添加数据库存储支持，并且这种方式符合 Android 架构指南。在上一章涵盖了\
  \ `SQLite` 数据库基础知识之后，本章将探索基于 `Room` 的数据库管理的基本概念、在 Android 应用中实现 `Room` 支持的关键元素，以及这些元素在架构和编码方面是如何实现的。在介绍这些主题后，接下来的两个章节将通过一个\
  \ `Room` 数据库项目示例将这些理论付诸实践。\n\n## 65.1 重新审视现代应用架构\n\n“使用 Jetpack 构建现代 Android 应用架构”章节引入了现代应用架构的概念，并强调了分离应用内不同责任区域的重要性。`图\
  \ 65-1` 所示的图表概述了典型 Android 应用的推荐架构：\n\n![](img/room_diagram_1.jpg)\n\n图 65-1\n\n\
  在本书之前的几个章节中已经详细介绍了该架构的顶三层，现在是所在 `Room` 持久库的背景下开始探索仓库（repository）和数据库架构层了。\n\n##\
  \ 65.2 Room 数据库持久化的关键元素\n\n在本文稍后进行详细讨论之前，首先值得总结使用 `Room` 持久库处理 `SQLite` 数据库涉及的关键元素：\n\
  \n### 65.2.1 仓库 (Repository)\n\n正如之前过的，仓库模块包含了直接处理应用所用所有数据所需的所有代码。这避免了 UI 控制器和 `ViewModel`\
  \ 需要直接访问数据库或网络服务等源。\n\n### 65.2.2 Room 数据库\n\n`room` 数据库对象提供了底层 `SQLite` 数据库的接口。它还为仓库提供了访问数据访问对象（DAO）。应用程序应该只有一个\
  \ `room` 数据库实例，然后可以使用该实例来访问多个数据库表。\n\n### 65.2.3 数据访问对象 (DAO)\n\n`DAO` 包含了仓库在 `SQLite`\
  \ 数据库中插入、检索和删除数据所需的 SQL 语句。这些 SQL 语句映射到方法，然后从仓库内部调用这些方法来执行相应的查询。\n\n### 65.2.4 实体\
  \ (Entities)\n\n实体是定义数据库中表模式的类，它定义了表名、列名和数据类型，并指定了哪一列是主键。除了声明表模式外，实体类还包含 getter\
  \ 和 setter 方法，以提供对这些数据字段的访问。`DAO`  SQL 查询方法调用返回给仓库的数据将以这些实体类实例的形式存在。然后将调用 getter\
  \ 方法从实体对象中提取数据。同样，当仓库需要向数据库写入新记录时，它会创建一个实体实例，通过 setter 调用在对象上配置值，然后调用在 `DAO` 中声明的\
  \ `insert` 方法，传递要保存的实体实例。\n\n### 65.2.5 SQLite 数据库\n\n负责存储和提供数据访问的实际 `SQLite` 数据库。应用程序代码（包括仓库）绝不应直接访问此底层数据库。所有的数据库操作都是通过\
  \ `room` 数据库、`DAOs` 和实体的组合完成的。\n\n`图 65-2` 中的架构图说明了这些不同元素如何交互以在 Android 应用中提供基于\
  \ `Room` 的数据库存储：\n\n![](img/room_architecture_diagram.jpg)\n\n图 65-2\n\n上述架构图中的带编号的连接可以总结如下：\n\
  \n1. 仓库与 `Room Database` 交互以获取数据库实例，该实例反过来被用于获取 `DAO` 实例的引用。\n2. 仓库创建实体实例并在将其传递给\
  \ `DAO` 用于搜索和插入操作之前，对它们配置了数据。\n3. 仓库调用 `DAO` 上的方法并传递要插入到数据库的实体，并在响应搜索查询时接收实体实例。\n\
  4. 当 `DAO` 有结果要返回给仓库时，它将这些结果封装成实体对象。\n5. `DAO` 与 `Room Database` 交互以启动数据库操作并处理结果。\n\
  6. `Room Database` 处理与底层 `SQLite` 数据库的所有低级交互，提交查询并接收结果。\n\n在涵盖了使用 `Room` 持久库进行数据库访问的关键元素的基本大纲后，现在是时候详细探索实体、`DAOs`、`room`\
  \ 数据库和仓库了。\n\n## 65.3 理解实体\n\n每个数据库表都将有一个关联的实体类。该类定义了表的模式，并表现为一个穿插了一些特殊 `Room` 注解的标准\
  \ Java 类。一个声明要存储在数据库表中的数据的 Java 类示例可能如下如下：\n\n```java\npublic class Customer {\n\
  \n    private int id;\n    private String name;\n    private string address;\n\n\
  \    public Customer(String name, String address) {\n        this.id = id;\n   \
  \     this.name = name;\n        this.address = address;\n    }\n\n    public int\
  \ getId() {\n        return this.id;\n    }\n\n    public String getName() {\n \
  \       return this.name;\n    }\n\n    public String getAddress() {\n        return\
  \ this.address;\n    }\n}\n```\n\n按照目前的实现，上述代码声明了一个基础 Java 类，包含若干代表数据库字段的变量和一组 getter\
  \ 和 setter 方法。然而，该类 true 不是实体。要使该类成为实体并使其在 SQL 语句中可用，需要添加一些 `Room` 注解，如下：\n\n```java\n\
  @Entity(tableName = \"customers\")\npublic class Customer {\n\n    @PrimaryKey(autoGenerate\
  \ = true)\n    @NonNull\n    @ColumnInfo(name = \"customerId\")\n    private int\
  \ id;\n\n    @ColumnInfo(name = \"customerName\")\n    private String name;\n\n\
  \    private String address;\n\n    public Customer(String name, String address)\
  \ {\n        this.id = id;\n        this.name = name;\n        this.address = address;\n\
  \    }\n\n    public int getId() {\n        return this.id;\n    }\n\n    public\
  \ String getName() {\n        return this.name;\n    }\n\n    public String getAddress()\
  \ {\n        return this.address;\n    }\n\n    public void setId(@NonNull int id)\
  \ {\n        this.id = id;\n    }\n\n    public void setName(String name) {\n  \
  \      this.name = name;\n    }\n\n    public void setAddress(int quantity) {\n\
  \        this.address = address;\n    }\n}\n```\n\n上述注解首先声明该类表示一个实体，并分配了一个表名“customers”。这是在\
  \ `DAO` SQL 语句中引用该表的名。每个数据库表都需要一列作为主键。在这种情况下，客户 ID 被声明为主键。还添加了注解以指定在 SQL 查询中引用的列名，并指示该字段不能用于存储空值。最后，id\
  \ 值被配置为自动生成。这意味着分配给新记录的 id 将由系统自动生成，以避免键冲突。\n\n\n\n\n客户名称字段也分配了一个列名。但请注意，地址字段（address\
  \ field）没有分配列名。这意味着地址数据仍然存储在数据库中，但在 `SQL` 语句中不需要引用它。如果实体中的某个字段不需要存储在数据库中，只需使用 `@Ignore`\
  \ 注解即可：\n\n```java\n@Ignore\nprivate String myString;\n```\n\n最后，对 `id` 变量的 setter\
  \ 方法进行了修改，以防止尝试分配空值（null value）：\n\n```java\npublic void setId(@NonNull int id)\
  \ {\n    this.id = id;\n}\n```\n\n实体类中还可以包含注解，以使用关系型数据库中称为“外键”（foreign keys）的概念来与其他实体建立关系。外键允许一个表引用另一个表中的主键。例如，可以在名为\
  \ `Purchase` 的实体与现有的 `Customer` 实体之间建立如下关系：\n\n```java\n@Entity(foreignKeys = {@ForeignKey(entity\
  \ = Customer.class,\n        parentColumns = \"customerId\",\n        childColumns\
  \ = \"buyerId\",\n        onDelete = ForeignKey.CASCADE,\n        onUpdate = ForeignKey.RESTRICT})\n\
  public class Purchase {\n    @PrimaryKey(autoGenerate = true)\n    @ColumnInfo(name\
  \ = \"purchaseId\")\n    private int purchaseId;\n    @ColumnInfo(name = \"buyerId\"\
  )\n    private int buyerId;\n}\n```\n\n注意，外键声明还指定了当删除或更新父记录时要采取的操作。可用选项有 `CASCADE`、`NO_ACTION`、`RESTRICT`、`SET_DEFAULT`\
  \ 和 `SET_NULL`。\n\n### 65.4 数据访问对象 (DAO)\n\n数据访问对象（DAO）提供了访问存储在 `SQLite` 数据库中数据的方法。DAO\
  \ 被声明为标准的 Java 接口，并带有一些额外的注解，将特定的 `SQL` 语句映射到可以供存储库调用的方法。\n\n第一步是创建接口并使用 `@Dao`\
  \ 注解将其声明为 DAO：\n\n```java\n@Dao\npublic interface CustomerDao {\n}\n```\n\n接下来，添加由\
  \ `SQL` 语句和对应方法名的条目。例如，下面的声明允许通过调用名为 `getAllCustomers()` 的方法检索 `customers` 表中的所有行：\n\
  \n```java\n@Dao\npublic interface CustomerDao {\n    @Query(\"SELECT * FROM customers\"\
  )\n    LiveData<List<Customer>> getAllCustomers();\n}\n```\n\n注意，`getAllCustomers()`\
  \ 方法返回一个 `List` 对象，其中包含从数据库表中检索到的每条记录对应的 `Customer` 实体对象。DAO 还使用了 `LiveData`，以便存储库能够观察数据库的变化。\n\
  \n参数也可以传递给方法，并在相应的 `SQL` 语句中引用。考虑以下 DAO 声明，它会搜索与客户名称匹配的数据库记录（注意 `WHERE` 条件中引用的列名是实体类中分配给列的名称）：\n\
  \n```java\n@Query(\"SELECT * FROM customers WHERE name = :customerName\")\nList<Customer>\
  \ findCustomer(String customerName);\n```\n\n在此示例中，方法传递了一个字符串值，该值随后通过在变量名前前加上冒号（`:`）包含在\
  \ `SQL` 语句中。\n\n可以使用 `@Insert` 方便注解按如下声明一个基本的插入操作：\n\n```java\n@Insert\nvoid addCustomer(Customer\
  \ customer);\n```\n\n这之所以被称为方便注解，是因为 Room 持久库可以推断传递给 `addCustomer()` 方法的 `Customer`\
  \ 实体要插入到数据库中，而无需提供 `SQL` 插入语句。也可以在单个事务中插入多条数据库记录，如下：\n\n```java\n@Insert\npublic\
  \ void insertCustomers(Customer... customers);\n```\n\n下面的 DAO 声明删除所有匹配提供的客户名称的记录：\n\
  \n```java\n@Query(\"DELETE FROM customers WHERE name = :name\")\nvoid deleteCustomer(String\
  \ name);\n```\n\n作为使用 `@Query` 注解执行删除的替代方案，也可以使用 `@Delete` 方便注解。在下面的示例中，所有与传递给 `deleteCustomers()`\
  \ 方法的实体匹配的 `Customer` 记录将从数据库中删除：\n\n```java\n@Delete\npublic void deleteCustomers(Customer...\
  \ customers);\n```\n\n`@Update` 方便注解在更新记录时提供类似的行为：\n\n```java\n@Update\npublic void\
  \ updateCustomers(Customer... customers);\n```\n\n此类数据库操作的 DAO 方法也可以声明返回一个 `int`\
  \ 值，表示受事务影响的行数，例如：\n\n```java\n@Delete\npublic int deleteCustomers(Customer... customers);\n\
  ```\n\n### 65.5 Room Database\n\nRoom 数据库类通过扩展 `RoomDatabase` 类创建，并作为嵌入 Android\
  \ 操作系统的实际 `SQLite` 数据库之上的层存在。该类负责创建并返回新的 Room 数据库实例，并提供与数据库关联的 DAO 实例的访问。\n\nRoom\
  \ 持久库提供了一个用于创建数据库实例的构建器。每个 Android 应用应该只有一个 Room 数据库实例，因此最好在类内部实现防御性代码以防止创建多个实例。\n\
  \n以下代码列表列出了一个与示例客户表配合 Room 数据库实现示例：\n\n```java\nimport android.content.Context;\n\
  import android.arch.persistence.room.Database;\nimport android.arch.persistence.room.Room;\n\
  import android.arch.persistence.room.RoomDatabase;\n\n@Database(entities = {Customer.class},\
  \ version = 1)\npublic class RoomDatabase extends RoomDatabase {\n    public abstract\
  \ CustomerDao dao();\n    private static RoomDatabase INSTANCE;\n    static RoomDatabase\
  \ getDatabase(Context context) {\n        if (INSTANCE == null) {\n            synchronized\
  \ (RoomDatabase.class) {\n                if (INSTANCE == null) {\n            \
  \        INSTANCE = Room.databaseBuilder(\n                        context.getApplicationContext(),\n\
  \                        RoomDatabase.class, \"customer_database\")\n          \
  \          .build();\n                }\n            }\n        }\n        return\
  \ INSTANCE;\n    }\n}\n```\n\n上述示例中需要注意的重要区域是类声明上方的声明工作实体的注解、检查类实例是否已创建的代码以及 `customer_database`\
  \ 名称的赋值。\n\n### 65.6 存储库 (Repository)\n\n存储库负责获取 Room 数据库实例，使用该实例访问关联的 DAO，然后调用\
  \ DAO 方法执行数据库操作。一个为 Room 数据库设计的存储库构造函数可能如下：\n\n```java\npublic class CustomerRepository\
  \ {\n    private CustomerDao customerDao;\n    private RoomDatabase db;\n    public\
  \ CustomerRepository(Application application) {\n        db = RoomDatabase.getDatabase(application);\n\
  \        customerDao = db.customerDao();\n    }\n}\n```\n\n一旦存储库有了 DAO，就可以调用数据访问方法。例如，下面的代码调用了\
  \ `getAllCustomers()` DAO 方法：\n\n```java\nprivate LiveData<List<Customer>> allCustomers;\n\
  allCustomers = customerDao.getAllCustomers();\n```\n\n在调用 DAO 方法时，重要的是，除非方法返回 `LiveData`\
  \ 实例（它会自动在单独线程中运行查询），否则操作不能在应用程序的主线程上执行。事实上，尝试这样做会导致应用程序崩溃，并输出以下诊断信息：\n\n```\nCannot\
  \ access database on the main thread since it may potentially lock the UI for a\
  \ long period of time\n```\n\n\n\n\n由于某些数据库事务可能需要较长时间才能完成，在单独线程上运行操作可以避免应用出现假死现象。正如“Android\
  \ Room 数据库与仓库教程章节将演示的那样，可以通过利用 Java 线程轻松地解决这个问题（如需更多信息或复习如何使用线程，请参阅标题为 Java 线程、Handlers\
  \ 和 Executor 概述的章节）。\n\n## 65.7 内存数据库\n\n本章概述的示例涉及使用 `SQLite` 数据库，该数据库以文件的形式存在于\
  \ Android 设备的持久存储上。这确保了即使在应用进程终止后，数据仍然存在。\n\n`Room` 数据库持久化库也支持内存数据库。这些数据库完全驻留在内存中，并在应用终止时丢失。与内存数据库工作时唯一需要的更改是调用\
  \ `Room Database` 类的 `Room.inMemoryDatabaseBuilder()` 方法，而不是 `Room.databaseBuilder()`。以下代码显示了方法调用之间的区别（注意内存数据库不需要数据库名称）：\n\
  \n```java\n// 创建基于文件存储的数据库\nINSTANCE = Room.databaseBuilder(context.getApplicationContext(),\n\
  \                                 CustomerRoomDatabase.class, \"customer_database\"\
  )\n                                   .build();\n\n// 创建内存数据库\nINSTANCE = Room.inMemoryDatabaseBuilder(context.getApplicationContext(),\n\
  \                                         CustomerRoomDatabase.class)\n        \
  \                             .build();\n```\n\n## 65.8 数据库检查器\n\nAndroid Studio\
  \ 包含一个 Database Inspector 工具窗口，它允许如图 65-3 所示，查看、搜索和修改与运行应用相关的 `Room` 数据库：\n\n![](img/as_database_inspector_window.jpg)\n\
  \n图 65-3\n\n数据库检查器的用法将在“Android Room 数据库与仓库教程章节中进行介绍。\n\n## 65.9 总结\n\nAndroid `Room`\
  \ 持久化库包含在 Android 架构组件中，作为低级 `SQLite` 数据库之上的抽象层。该库的设计旨在符合 Android 架构指南的同时，使数据库工作变得更加简单。本章介绍了在\
  \ Android 应用项目中构建基于 Room 的数据库存储所需的各种交互元素，包括实体（entities）、仓库（repositories）、数据访问对象（DAO）、注解和\
  \ `Room Database` 实例。\n\n在涵盖了 `SQLite` 和 `Room` 架构组件的基础之后，下一步是创建一个将这些理论付诸的示例应用。由于示例应用程序的用户界面需要基于表单的布局，下一章标题为“Android\
  \ TableLayout 和 TableRow 教程的章节将稍微偏离核心主题，介绍 `TableLayout` 和 `TableRow` 视图的基础知识。\n\
  \n## 66. Android TableLayout 和 TableRow 教程\n\n当开始编写本书的下一章（“Android Room 数据库与仓库教程）时，最初计划是包含为\
  \ `Room` 数据库示例应用设计用户界面布局的步骤。然而，显而易见，实现用户界面的最佳方法是利用 Android `TableLayout` 和 `TableRow`\
  \ 视图，该主题值得作为一个独立的章节。因此，本章将专门专注于下一章要完成的数据库应用程序的用户界面设计，并在此过程中花一些时间介绍 Android Studio\
  \ 中表格布局的基础概念。\n\n### 66.1 TableLayout 和 TableRow 布局视图\n\n`TableLayout` 容器视图的目的是允许用户界面元素以由行和列组成的表格格式组织在屏幕上。`TableLayout`\
  \ 中的每一行由一个 `TableRow` 实例占据，而 `TableRow` 又被划分为单元格，每个单元格包含一个子视图（该单元格本身可以是一个包含多个子视图的容器）。\n\
  \n表格中的列数由列数最多的一行决定，默认情况下，每列的宽度由该列中最宽的单元格定义。列可以配置为可收缩或可伸展（或兼者），使其 own 相对于父级 `TableLayout`\
  \ 发生变化。此外，单个单元格可以配置为跨越多个列。\n\n考虑图 66-1 所示的用户界面布局：\n\n![](img/as_4.1_room_demo_ui.jpg)\n\
  \n图 66-1\n\n从布局的外观来看，很难识别出设计界面的 `TableLayout` 结构。然而，图 66-2 中的层级树使得结构稍微更容易理解：\n\n\
  ![](img/as_tree.jpg)\n\n图 66-2\n\n显然，该布局包含一个父级 `LinearLayout` 视图，带有 `TableLayout`\
  \ 和 `LinearLayout` 子视图。`TableLayout` 包含三个 `TableRow` 子视图，代表表格中的三行。`TableRows` 包含两个子视图，每个子视图代表表格单元格的内容。`LinearLayout`\
  \ 子视图包含三个 `Button` 子视图。\n\n图 66-2 所示的布局是下一章将完成的数据库所所需的精确布局。因此，本章的剩余部分将用于使用 Android\
  \ Studio 布局编辑器逐步地完成该界面的设计。\n\n### 66.2 创建 Room 数据库项目\n\n从欢迎界面选择“New Project”（新建项目）菜单选项，并在弹出的新项目对话框中，选择\
  \ `Fragment + ViewModel` 模板，点击“Next”（下一步）按钮。\n\n在 Name 字段中输入 `RoomDemo` 并指定 `com.ebookzy.roomdemo`\
  \ 为包名。在点击“Finish”（完成）按钮之前，将 Minimum API level 设置为 `API 26: Android 8.0 (Oreo)` 语言设置为\
  \ Java。\n\n### 66.3 转换为 LinearLayout\n\n在 Project 窗口（app -> res -> layout）中找到 `fragment_main.xml`\
  \ 文件并双击它将其加载到布局工具。默认情况下，Android Studio 使用 `ConstraintLayout` 作为根布局元素。这需要转换为垂直方向的\
  \ `LinearLayout`。在 Design 模式下的 Layout 编辑中，在 Component Tree 中找到 `ConstraintLayout`\
  \ 组件并右键点击它显示图 66-3 所示的菜单，并选择“Convert view...”（转换视图）选项：\n\n![](img/as_4.1_room_demo_convert_view.jpg)\n\
  \n图 66-3\n\n在结果对话框（图 66-4）中，选择转换为 `LinearLayout` 的选项，然后点击“Apply”（应用）按钮：\n\n![](img/as_4.1_room_demo_convert_linear.jpg)\n\
  \n图 66-4\n\n默认情况下，布局编辑器会将 `ConstraintLayout` 转换为水平的 `LinearLayout`，因此在 Component\
  \ Tree 窗口中选择布局组件，参考 Attributes 工具窗口并将 `orientation` 属性更改为 `vertical`：\n\n![](img/as_3.4_linearlayout_change_orientation.jpg)\n\
  \n图 66-5\n\n转换完成后，从布局中删除默认的 `TextView` 小部件。\n\n### 66.4 向用户界面添加 TableLayout\n\n\
  继续留在 `fragment_main.xml` 文件中，并参考面板中 `Layouts` 类别，拖放放置一个 `TableLayout` 视图，使其位于 `LinearLayout`\
  \ 画布区域的顶部。\n\n\n\n\n\n一旦完成这些初始步骤，布局的 `Component Tree`（组件树）应该类似于图 66-6 所示。\n\n![](img/as3.2_tablelayout_in_tree.jpg)\n\
  \n图 66-6\n\n显然，Android Studio 已自动向 `TableLayout` 添加了四个 `TableRow` 实例。由于此示例只需要三行，请选择并删除第四个\
  \ `TableRow` 实例。可以随时从调色板（palette）中拖动 `TableRow` 对象并将其到 `Component Tree` 工具窗口中的 `TableLayout`\
  \ 条目上，从而向 `TableLayout` 添加额外的行。\n\n在选中 `TableLayout` 的情况下，使用 `Attributes`（属性）工具窗口将\
  \ `layout_height` 属性更改为 `wrap_content`并将 `layout_width` 更改为 `match_parent`。\n\n\
  ## 66.5 配置 TableRows\n\n从调色板的 `Text` 部分中，将两个 `TextView` 对象拖入到 `Component Tree` 中顶部的\
  \ `TableRow` 条目上（图 66-7）：\n\n![](img/as3.2_tablerow_textviews.jpg)\n\n图 66-7\n\n\
  在屏幕布局中选择左侧的 `TextView`，并在 `Attributes` 工具窗口中将 `text` 属性更改为“Product ID”。对右侧的 `TextView`\
  \ 重复此步骤，这次将文本更改为“Not assigned”并指定 `ID` 值为 `productID`。\n\n将另一个 `TextView` 小部件拖放到\
  \ `Component Tree` 中的第二个 `TableRow` 条目上，并将视图上的文本更改为“Product Name”。在调色板中找到 `Plain\
  \ Text` 对象并将其拖入，使其位于 `Component Tree` 中 Product Name `TextView` 的正下方，如图 66-8 所示。选中\
  \ `EditText` 对象，通过点击标志、勾选“None”复选框并点击 `Apply` 按钮，将 `Attributes` 面板中的 `inputType`\
  \ 属性从 `textPersonName` 更改为 `none`。接下来，从 `text` 属性中删除“Name”字符串，并将 `ID` 设置为 `productName`。\n\
  \n![](img/as_3.6_tablelayout_produnt_name_row.jpg)\n\n图 66-8\n\n将另一个 `TextView`\
  \ 和一个数字（小数）文本字段拖放到第三个 `TableRow` 上，使 `TextView` 在层次结构中位于 `EditText` 之上。将 `TextView`\
  \ 文本更改为 Product Quantity，并将 `EditText` 对象的 `ID` 更改为 `productQuantity`。\n\n按住 Shift\
  \ 点击选择布局中的所有小部件，如下方的图 66-9 所示，并使用 `Attributes` 工具窗口将所有对象的 `textSize` 属性设为 `18sp`：\n\
  \n![](img/as_4.1_room_demo_views_selected.jpg)\n\n图 66-9\n\n在继续之前，请确保将上述步骤中添加的所有\
  \ `text` 属性提取到字符串资源中。\n\n## 66.6 为布局添加按钮栏\n\n下一步是在父 `LinearLayout` 视图中添加一个 `LinearLayout\
  \ (Horizontal)`（水平布局）视图，位置紧邻 `TableLayout` 视图下方。首先点击 `Component Tree` 中 `TableLayout`\
  \ 条目左侧的小展开箭头，使 `TableRows` 折叠隐藏。从布局编辑器调色板的 `Layouts` 部分拖出一个 `LinearLayout (horizontal)`\
  \ 实例，将其直接拖入到 `Component Tree` 面板中 `TableLayout` 条目的正下方，并将 `layout_height` 属性更改为\
  \ `wrap_content`：\n\n![](img/as3.2_tablelayout_add_linearlayout.jpg)\n\n图 66-10\n\
  \n将三个 `Button` 对象拖入新的 `LinearLayout` 中，并为每个按钮分配内容分别为“Add”、“Find”和“Delete”的字符串资源。此类按钮栏布局中的按钮通常应以无边样式显示。对于每个按钮，使用\
  \ `Attributes` 工具窗口将样式设置更改为 `Widget.AppCompat.Button.Borderless`并将 `textColor` 属性更改为\
  \ `?attr/colorPrimary`。将按钮的 `IDs` 分别更改为 `addButton`、`findButton` 和 `deleteButton`。\n\
  \n![](img/as_3.4_change_button_style.jpg)\n\n图 66-11\n\n在 `Component Tree` 中选中新的水平\
  \ `LinearLayout` 视图，将 `gravity` 属性更改为 `center_horizontal`，以便按钮在显示区域水平居中。\n\n## 66.7\
  \ 添加 RecyclerView\n\n在 `Component Tree` 中，点击新添加的水平 `LinearLayout` 条目左侧的展开箭头，以折叠所有子项。\n\
  \n从调色板的 `Containers` 部分拖出一个 `RecyclerView` 实例并将其到到 `Component Tree`，使其位于按钮栏 `LinearLayout`\
  \ 下方，如图 66-12 所示。请确保 `RecyclerView` 是父垂直 `LinearLayout` 视图的直接子级，而不是水平按钮栏 `LinearLayout`\
  \ 的子级。\n\n![](img/as_3.6_tablelayout_recyclerview.jpg)\n\n图 66-12\n\n在布局中选中 `RecyclerView`，将视图的\
  \ `ID` 更改为 `product_recycler`并将 `layout_height` 设置为 `match_parent`。在继续之前，检查布局的层次结构是否与下图所示：\n\
  \n![](img/as_4.1_room_demo_tree.jpg)\n\n图 66-13\n\n## 66.8 调整布局边距\n\n最后是调整一些布局设置。首先点击\
  \ `Component Tree` 中的第一个 `TableRow` 条目以选中它。按住键盘上的 `Cmd/Ctrl` 键点击第二个 `TableRow`、`LinearLayout`\
  \ 以及 `RecyclerView`，使其都被选中。在 `Attributes` 面板中找到 `layout_margin` 属性类别，一旦找到，将其值更改为\
  \ `10dp`，如图 66-14 所示：\n\n![](img/as_3.4_layout_margin.jpg)\n\n图 66-14\n\n设置边距后，用户界面应如图\
  \ 66-1 所示。\n\n## 66.9 总结\n\nAndroid `TableLayout` 视图提供了一种排列组件的方法。虽然 `TableLayout`\
  \ 提供了容器，但每一行及其包含的单元都是通过 `TableRow` 实现的。在本章中，使用 `TableLayout` 和 `TableRow` 设计了用户界面。\n\
  \n\n\n\n\n首先启动 Android Studio 并打开上一章节中创建的 `RoomDemo` 项目。在向项目添加任何新类之前，第一步是向构建配置添加一些额外的库，包括\
  \ Room 持久化库。现在也是在 `build.gradle` 文件启用视图绑定（view binding）的好时机。找到并编辑模块级 `build.gradle`\
  \ 文件（`app` -> `Gradle Scripts` -> `build.gradle (Module :app)`）并进行如下修改：\n\n```gradle\n\
  android {\n    buildFeatures {\n        viewBinding true\n    }\n}\n\ndependencies\
  \ {\n    implementation \"androidx.recyclerview:recyclerview:1.2.1\"\n    implementation\
  \ \"androidx.room:room-runtime:2.4.3\"\n    annotationProcessor \"androidx.room:room-compiler:2.4.3\"\
  \n}\n```\n\n## 67.3 构建实体 (Entity)\n\n该项目将从创建定义数据库表结构（schema）的实体开始。该实体将包含一个用于产品 ID\
  \ 的整数、一个用于存储产品名称的字符串列以及另一个用于存储数量的整数值。`productid` 列将作为主键并自动生成。表 67-1 总结了实体的结构：\n\n\
  | 列名 | 数据类型 |\n| :--- | :--- |\n| productid | Integer / 主键 / 自动增 |\n| productname\
  \ | String |\n| productquantity | Integer |\n\n表 67-1\n\n在 Project 工具窗口中右键点击 `app`\
  \ -> `java` -> `com.ebookfrenzy.roomdemo`，选择 `New` -> `Java Class` 菜单选项为实体添加一个类文件。在新类对话框中，将类命名为\
  \ `Product`，在列表中选择 `Class` 项并按键盘回车键生成文件。\n\n当 `Product.java` 文件在编辑器中打开时，对其进行修改使其如下：\n\
  \n```java\npackage com.ebookfrenzy.roomdemo;\n\npublic class Product {\n    private\
  \ int id;\n    private String name;\n    private int quantity;\n\n    public Product(String\
  \ name, int quantity) {\n        this.name = name;\n        this.quantity = quantity;\n\
  \    }\n\n    public int getId() {\n        return this.id;\n    }\n\n    public\
  \ String getName() {\n        return this.name;\n    }\n\n    public int getQuantity()\
  \ {\n        return this.quantity;\n    }\n\n    public void setId(int id) {\n \
  \       this.id = id;\n    }\n\n    public void setName(String name) {\n       \
  \ this.name = name;\n    }\n\n    public void setQuantity(int quantity) {\n    \
  \    this.quantity = quantity;\n    }\n}\n```\n\n该类现在拥有了数据库表的变量以及相应的 getter 和 setter\
  \ 方法。当然，在对类添加注解之前，它并不会成为实体。在编辑器中打开类文件的情况下，添加注解和相应的导入语句：\n\n```java\npackage com.ebookfrenzy.roomdemo;\n\
  import androidx.room.ColumnInfo;\nimport androidx.room.Entity;\nimport androidx.room.PrimaryKey;\n\
  \n@Entity(tableName = \"products\")\npublic class Product {\n    @PrimaryKey(autoGenerate\
  \ = true)\n    @ColumnInfo(name = \"productId\")\n    private int id;\n    @ColumnInfo(name\
  \ = \"productName\")\n    private String name;\n    private int quantity;\n}\n```\n\
  \n这些注解声明该类为名为 `products` 的表的实体，并为 `id` 和 `name` 分配了列名。`id` 列也被配置为主键并自动生成。由于在 SQL\
  \ 查询中不需要引用 `quantity` 列，因此没有为 `quantity` 变量分配列名。\n\n## 67.4 创建数据访问对象 (DAO)\n\n在定义了产品实体后，下一步是创建\
  \ DAO 接口。再次参考 Project 工具窗口，右键点击 `app` -> `java` -> `com.ebookfrenzy.roomdemo` 并选择\
  \ `New` -> `Java Class` 选项。在新类对话框中，在 `Name` 字段中输入 `ProductDao`，并如 图 67-1 所示，从列表中选择\
  \ `Interface`：\n\n![](img/as_4.1_room_demo_new_interface.jpg)\n图 67-1\n\n按下回车键生成新接口，并在\
  \ `ProductDao.java` 文件加载到代码编辑器后，进行以下更改：\n\n```java\npackage com.ebookfrenzy.roomdemo;\n\
  import androidx.lifecycle.LiveData;\nimport androidx.room.Dao;\nimport androidx.room.Insert;\n\
  import androidx.room.Query;\nimport java.util.List;\n\n@Dao\npublic interface ProductDao\
  \ {\n    @Insert\n    void insertProduct(Product product);\n    @Query(\"SELECT\
  \ * FROM products WHERE productName = :name\")\n    List<Product> findProduct(String\
  \ name);\n    @Query(\"DELETE FROM products WHERE productName = :name\")\n    void\
  \ deleteProduct(String name);\n    @Query(\"SELECT * FROM products\")\n    LiveData<List<Product>>\
  \ getAllProducts();\n}\n```\n\nDAO 实现了从 `products` 数据库中插入、查找和删除记录的方法。插入方法传递一个包含存储数据的\
  \ `Product` 实体对象，而查找和删除记录的方法传递一个包含要操作产品名称的字符串。`getAllProducts()` 方法返回一个包含所有产品的 `LiveData`\
  \ 对象。\n\n## 67.5 添加 Room 数据库\n\n在将仓库添加到项目之前，最后一个任务是实现 Room 实例。在项目中添加一个名为 `ProductRoomDatabase`\
  \ 的新类，这次选择 `Class` 选项。\n\n一旦文件生成，按照 Android 持久化库章节中的步骤对其进行修改：\n\n```java\npackage\
  \ com.ebookfrenzy.roomdemo;\nimport android.content.Context;\nimport androidx.room.Database;\n\
  import androidx.room.Room;\nimport androidx.room.RoomDatabase;\n\n@Database(entities\
  \ = {Product.class}, version = 1)\npublic abstract class ProductRoomDatabase extends\
  \ RoomDatabase {\n    public abstract ProductDao productDao();\n    private static\
  \ ProductRoomDatabase INSTANCE;\n    static ProductRoomDatabase getDatabase(final\
  \ Context context) {\n        if (INSTANCE == null) {\n            synchronized\
  \ (ProductRoomDatabase.class) {\n                INSTANCE =\n                  \
  \  Room.databaseBuilder(context.getApplicationContext(),\n                     \
  \       ProductRoomDatabase.class,\n                            \"product_database\"\
  ).build();\n            }\n        }\n        return INSTANCE;\n    }\n}\n```\n\n\
  ## 67.6 添加仓库 (Repository)\n\n向项目中添加名为 `ProductRepository` 的新类，选择 `Class` 选项。\n\n\
  仓库类负责代表 `ViewModel` 与 Room 数据库交互，并需要提供使用 `DAO` 插入、删除和查询记录的方法。除了 `getAllProducts()`\
  \ 方法（它返回 `LiveData` 对象）外，这些数据库操作需要在独立于主线程的线程中执行。\n\n在 `ProductRepository.java` 文件中，添加\
  \ `handler` 代码以将搜索结果返回给仓库：\n\n```java\npackage com.ebookfrenzy.roomdemo;\nimport\
  \ android.os.Handler;\nimport android.os.Looper;\nimport android.os.Message;\nimport\
  \ java.util.concurrent.ExecutorService;\nimport java.util.concurrent.Executors;\n\
  import androidx.lifecycle.MutableLiveData;\nimport java.util.List;\n\npublic class\
  \ ProductRepository {\n    private final MutableLiveData<List<Product>> searchResults\
  \ = new MutableLiveData<>();\n    private List<Product> results;\n\n    Handler\
  \ handler = new Handler(Looper.getMainLooper()) {\n        @Override\n        public\
  \ void handleMessage(Message msg) {\n            searchResults.setValue(results);\n\
  \        }\n    };\n}\n```\n\n上述代码声明了一个名为 `searchResults` 的 `MutableLiveData` 变量，每当异步搜索任务完成时，就会将搜索结果存入其中（在稍后的教程中，ViewModel\
  \ 内部的观察者将监控这个 live 数据对象）。\n\n\n\n\n\n`Repository` 类现在需要提供一些可以供 `ViewModel` 调用以启动这些操作的方法。然而，为了实现这一点，`repository`\
  \ 需要通过 `ProductRoomDatabase` 实例获取 `DAO` 引用。为 `ProductRepository` 类添加一个构造方法来执行这些任务：\n\
  \n```java\nimport android.app.Application;\n\npublic class ProductRepository {\n\
  \    private final MutableLiveData<List<Product>> searchResults = new MutableLiveData<>();\n\
  \    private List<Product> results;\n    private final ProductDao productDao;\n\n\
  \    public ProductRepository(Application application) {\n        ProductRoomDatabase\
  \ db;\n        db = ProductRoomDatabase.getDatabase(application);\n        productDao\
  \ = db.productDao();\n    }\n}\n```\n\n在存储了 `DAO` 引用后，就可以按照以下方法添加到 `ProductRepository`\
  \ 类文件中：\n\n```java\npublic void insertProduct(Product newproduct) {\n    ExecutorService\
  \ executor = Executors.newSingleThreadExecutor();\n    executor.submit(() -> productDao.insertProduct(newproduct));\n\
  \    executor.shutdown();\n}\n\npublic void deleteProduct(String name) {\n    ExecutorService\
  \ executor = Executors.newSingleThreadExecutor();\n    executor.submit(() -> productDao.deleteProduct(name));\n\
  \    executor.shutdown();\n}\n\npublic void findProduct(String name) {\n    ExecutorService\
  \ executor = Executors.newSingleThreadExecutor();\n    executor.submit(() -> {\n\
  \        results = productDao.findProduct(name);\n        handler.sendEmptyMessage(0);\n\
  \    });\n    executor.shutdown();\n}\n```\n\n在插入和删除方法中，创建并使用了适当的新线程来执行相应的数据库操作。在\
  \ `findProduct()` 方法中，会向 `handler` 发送消息，指示新结果可用。\n\n完成存储库类还剩最后一项任务。用户界面布局中的 `RecyclerView`\
  \ 需要能够更新数据库中存储的当前产品列表。`ProductDao` 类已经包含一个名为 `getAllProducts()` 的方法，该方法使用 SQL 查询选择所有数据库记录，并将它们封装在\
  \ `LiveData` 对象中返回。`repository` 需要在初始化时调用此方法一次，并将结果存储在 `LiveData` 对象中，该对象可以被 `ViewModel`\
  \ 观察，进而被 UI 控制器观察。一旦设置完成，数据库表每发生一次变化，UI 控制器观察者就会收到通知，`RecyclerView` 就可以更新最新的产品列表。在\
  \ `ProductRepository.java` 文件中，在构造方法内添加 `LiveData` 变量并调用 `DAO.getAllProducts()`\
  \ 方法：\n\n```java\nimport androidx.lifecycle.LiveData;\n\npublic class ProductRepository\
  \ {\n    private final MutableLiveData<List<Product>> searchResults = new MutableLiveData<>();\n\
  \    private List<Product> results;\n    private final LiveData<List<Product>> allProducts;\n\
  \    private final ProductDao productDao;\n\n    public ProductRepository(Application\
  \ application) {\n        ProductRoomDatabase db;\n        db = ProductRoomDatabase.getDatabase(application);\n\
  \        productDao = db.productDao();\n        allProducts = productDao.getAllProducts();\n\
  \    }\n}\n```\n\n为了完成存储库，添加 `ViewModel` 可以调用的获取 `allProducts` 和 `searchResults`\
  \ live 数据对象引的方法：\n\n```java\npublic LiveData<List<Product>> getAllProducts() {\n\
  \    return allProducts;\n}\n\npublic MutableLiveData<List<Product>> getSearchResults()\
  \ {\n    return searchResults;\n}\n```\n\n### 67.7 修改 ViewModel\n\n`ViewModel` 负责创建存储库实例，并提供供\
  \ UI 控制器利用的方法和 `LiveData` 对象，以保持用户界面与底层数据库同步。正如在 `ProductRepository.java` 中实现的那样，`repository`\
  \ 构造需要访问应用上下文以便获取 `Room Database` 实例。为了让 `ViewModel` 能够访问应用上下文以便将其传递给 `repository`，`ViewModel`\
  \ 需要继承 `AndroidViewModel` 而不是 `ViewModel`。\n\n因此，首先编辑 `MainViewModel.java` 文件（位于项目（Project）工具窗口的\
  \ `app -> java -> com.ebookfrenzy.roomdemo -> ui.main` 下），并将类更改为扩展 `AndroidViewModel`\
  \ 并实现默认构造方法：\n\n```java\npackage com.ebookfrenzy.roomdemo.ui.main;\n\nimport android.app.Application;\n\
  import androidx.lifecycle.AndroidViewModel;\nimport androidx.lifecycle.LiveData;\n\
  import androidx.lifecycle.MutableLiveData;\nimport com.ebookfrenzy.roomdemo.Product;\n\
  import com.ebookfrenzy.roomdemo.ProductRepository;\nimport java.util.List;\n\npublic\
  \ class MainViewModel extends AndroidViewModel {\n    private ProductRepository\
  \ repository;\n    private LiveData<List<Product>> allProducts;\n    private MutableLiveData<List<Product>>\
  \ searchResults;\n\n    public MainViewModel(Application application) {\n      \
  \  super(application);\n        repository = new ProductRepository(application);\n\
  \        allProducts = repository.getAllProducts();\n        searchResults = repository.getSearchResults();\n\
  \    }\n}\n```\n\n构造方法本质上创建了一个存储库实例，然后使用它获取 `allProducts` 和 `searchResults` 的引用，以便它们可以被\
  \ UI 控制器观察。现在 `ViewModel` 中剩下的工作是实现 UI 控制器在响应按钮点击以及在为 `LiveData` 对象设置观察者时调用的方法：\n\
  \n```java\nMutableLiveData<List<Product>> getSearchResults() {\n    return searchResults;\n\
  }\n\nLiveData<List<Product>> getAllProducts() {\n    return allProducts;\n}\n\n\
  public void insertProduct(Product product) {\n    repository.insertProduct(product);\n\
  }\n\npublic void findProduct(String name) {\n    repository.findProduct(name);\n\
  }\n\npublic void deleteProduct(String name) {\n    repository.deleteProduct(name);\n\
  }\n```\n\n### 67.8 创建项目布局\n\n数据库中的每个产品名称将出现在 `RecyclerView` 列表中。这需要一个包含 `TextView`\
  \ 的布局资源文件用于每一行。现在右键点击项目（Project）工具窗口中的 `app -> res -> layout` ，选择 `New -> Layout\
  \ Resource File` 菜单。将文件命名为 `product_list_item`，并在点击确定之前将根元素更改为 `LinearLayout` 以创建文件并加载布局编辑器。在设计模式下，从调色板拖一个\
  \ `TextView` 对象到布局中，它将默认出现在布局顶部：\n\nimage/as_3.5_roomdemo_item_layout.jpg\n图 67-2\n\
  \n选中布局中的 `TextView`，使用属性（Attributes）工具窗口将视图 ID 设置为 `product_row`，`layout_height`\
  \ 为 `30dp`。选择组件树（Component Tree）窗口中的 `LinearLayout` 项，并将 `layout_height` 属性设置为 `wrap_content`。\n\
  \n### 67.9 添加 RecyclerView 适配器\n\n正如使用 RecyclerView 和 CardView 组件章节中详细概述的那样，`RecyclerView`\
  \ 实例需要一个适配器类来提供要显示的数据。现在右键点击项目（Project）工具窗口中的 `app -> java -> com.ebookfrenzy.roomdemo\
  \ -> ui.main` 项，选择 `New -> Java Class` 。在对话框中将类命名为 `ProductListAdapter` 并从列表中选择\
  \ `Class`，然后按回车键。在编辑器加载生成的 `ProductListAdapter.java` 类后，按如下方式实现该类：\n\n```java\n\
  package com.ebookfrenzy.roomdemo.ui.main;\n\nimport android.view.LayoutInflater;\n\
  import android.view.View;\nimport android.view.ViewGroup;\nimport android.widget.TextView;\n\
  import com.ebookfrenzy.roomdemo.R;\n```\n\n\n\n\n\n```java\nimport androidx.annotation.NonNull;\n\
  \nimport androidx.recyclerview.widget.RecyclerView;\n\nimport com.ebookfrenzy.roomdemo.Product;\n\
  \nimport java.util.List;\n\npublic class ProductListAdapter\n        extends RecyclerView.Adapter<ProductListAdapter.ViewHolder>\
  \ {\n\n    private final int productItemLayout;\n\n    private List<Product> productList;\n\
  \n    public ProductListAdapter(int layoutId) {\n        productItemLayout = layoutId;\n\
  \    }\n\n    public void setProductList(List<Product> products) {\n        productList\
  \ = products;\n        notifyDataSetChanged();\n    }\n\n    @Override\n    public\
  \ int getItemCount() {\n        return productList == null ? 0 : productList.size();\n\
  \    }\n\n    @NonNull\n    @Override\n    public ViewHolder onCreateViewHolder(ViewGroup\
  \ parent, int viewType) {\n        View view = LayoutInflater.from(\n          \
  \      parent.getContext()).inflate(productItemLayout, parent, false);\n       \
  \ return new ViewHolder(view);\n    }\n\n    @Override\n    public void onBindViewHolder(final\
  \ ViewHolder holder, final int listPosition) {\n        TextView item = holder.item;\n\
  \        item.setText(productList.get(listPosition).getName());\n    }\n\n    static\
  \ class ViewHolder extends RecyclerView.ViewHolder {\n        TextView item;\n\n\
  \        ViewHolder(View itemView) {\n            super(itemView);\n           \
  \ item = itemView.findViewById(R.id.product_row);\n        }\n    }\n}\n```\n\n\
  ## 67.10 准备主 Fragment\n\n最后一个需要修改的组件是 `MainFragment` 类，它需要为 `Button` 视图配置监听器，并对位于\
  \ `ViewModel` 类中的 live data 对象配置观察者。在添加这些代码之前，需要进行一些准备工作，以添加一些导入、变量并获取视图 ID 的引用。我们还需要修改\
  \ fragment 以使用视图绑定（view binding）。编辑 `MainFragment.java` 文件并进行如下修改：\n\n```java\n\
  import com.ebookfrenzy.roomdemo.databinding.FragmentMainBinding;\n\npublic class\
  \ MainFragment extends Fragment {\n\n    private MainViewModel mViewModel;\n\n \
  \   private FragmentMainBinding binding;\n\n    private ProductListAdapter adapter;\n\
  \n    @Nullable\n    @Override\n    public View onCreateView(@NonNull LayoutInflater\
  \ inflater,\n                                 @Nullable ViewGroup container,\n \
  \                                @Nullable Bundle savedInstanceState) {\n      \
  \  return inflater.inflate(R.layout.fragment_main, container, false);\n        binding\
  \ = FragmentMainBinding.inflate(inflater, container, false);\n        return binding.getRoot();\n\
  \    }\n\n    @Override\n    public void onDestroyView() {\n        super.onDestroyView();\n\
  \        binding = null;\n    }\n\n    @Override\n    public void onViewCreated(@NonNull\
  \ View view,\n                             @Nullable Bundle savedInstanceState)\
  \ {\n        super.onViewCreated(view, savedInstanceState);\n        listenerSetup();\n\
  \        observerSetup();\n        recyclerSetup();\n    }\n```\n\n在代码的不同阶段，应用需要清除在用户界面中显示的的产品信息。为了避免代码重复，请添加以下\
  \ `clearFields()` 方便函数：\n\n```java\nprivate void clearFields() {\n    binding.productID.setText(\"\
  \");\n    binding.productName.setText(\"\");\n    binding.productQuantity.setText(\"\
  \");\n}\n```\n\n在应用构建和测试之前，需要将上述从 `onViewCreated()` 调用的三个方法添加到类中。\n\n### 67.1. 添加按钮监听器\n\
  \n主 fragment 的用户界面布局包含三个按钮，每个按钮在被用户点击时都需要执行特定的任务。编辑 `MainFragment.java` 文件并添加 `listenerSetup()`\
  \ 方法：\n\n```java\nimport com.ebookfrenzy.roomdemo.Product;\n\nprivate void listenerSetup()\
  \ {\n    binding.addButton.setOnClickListener(view -> {\n        String name = binding.productName.getText().toString();\n\
  \        String quantity = binding.productQuantity.getText().toString();\n     \
  \   if (!name.equals(\"\") && !quantity.equals(\"\")) {\n            Product product\
  \ = new Product(name,\n                    Integer.parseInt(quantity));\n      \
  \      mViewModel.insertProduct(product);\n            clearFields();\n        }\
  \ else {\n            binding.productID.setText(\"Incomplete information\");\n \
  \       }\n    });\n\n    binding.findButton.setOnClickListener(view ->\n      \
  \      mViewModel.findProduct(binding.productName.getText().toString())\n    );\n\
  \n    binding.deleteButton.setOnClickListener(view -> {\n        mViewModel.deleteProduct(binding.productName.getText().toString());\n\
  \        clearFields();\n    });\n}\n```\n\n`addButton` 监听器执行了一些基础验证，以确保用户同时输入了产品名称和数量，并使用这些数据创建一个新的\
  \ `Product` 实体对象（注意，数量字符串被转换为整数以匹配实体数据类型）。在清空字段之前，会调用 `ViewModel.insertProduct()`\
  \ 方法并传递该 `Product` 对象。\n\n`findButton` 和 `deleteButton` 监听器将产品名称传递给 `ViewModel findProduct()`\
  \ 或 `deleteProduct()` 方法。\n\n### 67.12 添加 LiveData 观察者\n\n用户界面现在需要添加观察者，以保持与 `ViewModel`\
  \ 中的 `searchResults` 和 `allProducts` live data 同步。继续留在 `Mainfragment.java` 文件中，按照如下方式实现观察者设置方法：\n\
  \n```java\nimport java.util.Locale;\n\nprivate void observerSetup() {\n    mViewModel.getAllProducts().observe(getViewLifecycleOwner(),\n\
  \            products -> adapter.setList(products));\n\n    mViewModel.getSearchResults().observe(getViewLifecycleOwner(),\n\
  \            products -> {\n                if (products.size() > 0) {\n       \
  \             binding.productID.setText(String.format(Locale.US, \"%d\",\n     \
  \                       products.get(0).getId()));\n                    binding.productName.setText(products.get(0).getName());\n\
  \                    binding.productQuantity.setText(String.format(Locale.US, \"\
  %d\",\n                            products.get(0).getQuantity()));\n          \
  \      } else {\n                    binding.productID.setText(\"No Match\");\n\
  \                }\n            });\n}\n```\n\n`allProducts` 观察者仅将当前列表传递给 `RecyclerViewAdapter`\
  \ 的 `setList()` 方法，那里将更新列表。\n\n`searchResults` 观察者检查是否至少有一个匹配的结果，从列表中提取第一个匹配的 `Product`\
  \ 对象，从对象中获取数据，必要时进行转换并赋值给 `TextView` 和 `EditText`。如果产品搜索失败，将通过显示的产品 ID TextView\
  \ 通知用户。\n\n### 67.13 初始化 RecyclerView\n\n添加最后的设置方法以初始化并配置 `RecyclerView` 和 `adapter`：\n\
  \n```java\nimport androidx.recyclerview.widget.LinearLayoutManager;\n\nprivate void\
  \ recyclerSetup() {\n    adapter = new ProductListAdapter(R.layout.product_list_item);\n\
  \    binding.productRecycler.setLayoutManager(\n            new LinearLayoutManager(getContext()));\n\
  \    binding.productRecycler.setAdapter(adapter);\n}\n```\n\n## 67.14 测试 RoomDemo\
  \ 应用\n\n在设备或模拟器上编译并运行应用，添加一些产品并确保它们自动出现在 `RecyclerView` 中。对现有产品进行搜索，并验证产品 ID 和数量字段是否相应更新。最后，输入一个现有产品的名称，从数据库中删除它，并确认它已从\
  \ `RecyclerView` 产品列表中移除。\n\n## 67.15 使用数据库检查器\n\n\n\n\n\n如之前在“Android Room Persistence\
  \ Library”中所概述，可以使用 `Database Inspector` 工具来检查与运行中的应用 关联的 `Room` 数据库的内容，并进行细微的数据更改。在使用\
  \ `RoomDemo` 应用添加一些数据库记录后，通过 `View` -> `Tool Windows` -> `App Inspection` 菜单选项显示\
  \ `Database Inspector` 工具：\n\n在检查器窗口内部，从下方图 67-3 中标记为 `A` 的菜单中选择正在运行的应用：\n\n![](img/as_database_inspector.jpg)\n\
  \n图 67-3\n\n在 `Databases` 面板 (`B`) 中双击 `products` 表格，以查看当前存储在数据库中的表格行。启用 `Live updates`\
  \ 选项 (`C`)，然后使用运行中的应用向数据库添加更多记录。请注意，`Database Inspector` 会实时更新表格数据 (`D`) 以反映更改。\n\
  \n关闭 `Live updates` 以使表格不再是只读状态，双击表格行中的 `quantity` 单元格，并在按下 `Enter` 键之前更改值。返回运行中的应用并搜索产品，以确认在检查器中对\
  \ `quantity` 的更改已保存到数据库表中。\n\n最后，点击表格查询按钮（如下方图 67-4 中的箭头所示）显示一个新的查询标签页 (`A`)，确保已选择\
  \ `product_database` (`B`)，并在查询文本字段 (`C`) 中输入 SQL 语句并点击 `Run` 按钮 (`D`)：\n\n![](img/as_database_inspector_query.jpg)\n\
  \n图 67-4\n\n行列表应会更新以反映 SQL 查询的结果 (`E`)。\n\n### 67.16 总结\n\n本章演示了如何使用 `Room` 持久化库在\
  \ `SQLite` 数据库中存储数据。完成的项目使用了仓库（repository）将 `ViewModel` 与所有数据库操作分离，并演示了实体、`DAO`\
  \ 和 `room` 数据库实例的创建，包括在执行某些数据库操作时使用异步任务。\n\n### 68. 使用 Android 存储访问框架访问云存储\n\n近年来，远程存储服务（又称为“云存储”）被广泛采用以存储用户文件和数据。驱动这一增长有两个关键因素。其之一是，大多数移动设备现在都提供持续、高速的互联网连接，从而使数据传输变得快速且廉价。第二个因素是，相对于传统的计算机系统（如台式机和笔记本电脑），这些移动设备在内部存储资源方面受到限制。例如，今天一个高配\
  \ Android 平板电脑通常带有 128Gb 的存储容量。与带有 750Gb 磁盘驱动的中端笔记本系统相比，对文件进行无缝远程存储是今天许多移动应用的关键需求。\n\
  \n为了承认这一事实，Google 在 Android 4.4 SDK 中引入了 `Storage Access Framework`（存储访问框架）。本章将提供存储访问框架的高级概述，为下一章中更侧重细节的教程做准备，该章节标题为“An\
  \ Android Storage Access Framework Example”。\n\n#### 68.1 存储访问框架\n\n从用户的角度来看，`Storage\
  \ Access Framework` 提供了一个直观的用户界面，允许用户在 Android 应用内部浏览、选择、删除和创建由存储服务（也称为文档提供者）托管的文件。使用此浏览界面（也称为选择器），用户可以浏览他们所选文档提供者托管的文件（如文档、音频、图像和视频）。例如，图\
  \ 68-1 显示了选择器用户界面显示由文档提供者服务托管的文件集合：\n\n![](img/as3.0_storage_demo_picker.jpg)\n\n\
  图 68-1\n\n文档提供者可以从云端服务到运行在与客户端应用程序同一设备上的本地文档提供者不等。在编写时，兼容 `Storage Access Framework`\
  \ 的最著名的文档提供者是 `Box`，以及意料之中的 `Google Drive`。其他云存储提供者和应用开发者很快也会提供符合 Android `Storage\
  \ Access Framework` 的服务。\n\n除了云端文档提供者外，选择器还提供了对设备内部存储的访问，为应用程序用户提供一系列文件存储选项。\n\n\
  通过一组 `Intents`，Android 开发者只需几行代码即可将这些存储功能整合到应用中。从开发者的角度来看，`Storage Access Framework`\
  \ 特别引人注目的方面是，用户选择的底层文档提供者对应用是完全透明的。一旦在应用中使用该框架实现了存储功能，它将与所有文档提供者配合，无需任何代码修改。\n\n\
  #### 68.2 使用存储访问框架\n\nAndroid 包含了一组 `Intents`，旨在将 `Storage Access Framework` 的功能集成到\
  \ Android 应用中。这些 intent 向用户显示 `Storage Access Framework` 选择器用户界面，并通过调用启动该 intent\
  \ 的 activity 的 `onActivityResult()` 方法将交互结果返回给应用。当 `onActivityResult()` 方法被调用时，它将接收所选文件的\
  \ `Uri` 以及一个指示操作成功与否的值。\n\n`Storage Access Framework` 意图（intents）可以总结如下：\n\n- `ACTION_OPEN_DOCUMENT`\
  \ – 为用户提供选择器用户界面，以便从配置的文档提供者中选择文件。选择的文件以 `Uri` 对象的形式返回给应用。\n- `ACTION_CREATE_DOCUMENT`\
  \ – 允许用户选择文档提供者、该提供者上的存储位置以及新文件的文件名。一旦选择，文件将由 `Storage Access Framework` 创建，并将文件的\
  \ `Uri` 返回给应用进行进一步处理。\n\n#### 68.3 过滤选择器列表\n\n在启动 intent 时，选择器用户界面内列出的文件可以使用选项进行过滤。例如，考虑以下配置\
  \ `ACTION_OPEN_DOCUMENT` intent 的代码：\n\n```\nIntent intent = new Intent(Intent.ACTION_OPEN_DOCUMENT);\n\
  ```\n\n启动时，上述 intent 将显示选择器用户界面，允许用户浏览并选择可用文档提供者托管的文件。一旦用户选择了文件，将以 `Uri` 对象的形式向应用提供文件的引用。应用程序可以使用\
  \ `openFileDescriptor(Uri, String)` 方法打开文件。然而，存在某些风险，并不是文档提供者列出的所有文件都可以这种方式打开。通过使用\
  \ `CATEGORY_OPENABLE` 选项修改 intent，可以在选择器中排除此类文件。例如：\n\n```\nIntent intent = new\
  \ Intent(Intent.ACTION_OPEN_DOCUMENT);\nintent.addCategory(Intent.CATEGORY_OPENABLE);\n\
  ```\n\n现在显示 intent 时，无法使用 `openFileDescriptor()` 方法打开的文件将列出，但用户无法选择。\n\n\n\n另一种实用的过滤方法允许根据文件类型限制可选择的文件。这涉及到指定应用程序能够处理的文件类型。例如，一个图像编辑应用程序可能只想为用户提供从文档提供者中选择图像文件的选项。这是通过配置\
  \ `intent` 对象并设置用户可选择的文件的 `MIME` 类型来实现的。例如以下代码指定了选择器中仅图像文件才适用于选择：\n\n```java\nintent.addCategory(Intent.CATEGORY_OPENABLE);\n\
  intent.setType(\"image/*\");\n```\n\n这可以进一步细化以将选择限制为 JPEG 图像：\n\n```java\nintent.setType(\"\
  image/jpeg\");\n```\n\n或者，音频播放器应用可能只能处理音频文件：\n\n```java\nintent.setType(\"audio/*\"\
  );\n```\n\n音频应用可能会被进一步限制为仅支持播放 MP4 格式的音频文件：\n\n```java\nintent.setType(\"audio/mp4\"\
  );\n```\n\n在配合 `Storage Access Framework` 时，可以使用广泛的 `MIME` 类型设置，其中常见的类型可以在网上找到列出的：\n\
  \nhttps://en.wikipedia.org/wiki/Internet_media_type#List_of_common_media_types\n\
  \n### 68.4 处理 Intent 结果\n\n由于我们启动了返回结果的 intent，因此需要使用 `registerForActivityResult()`\
  \ 方法（在“Android Explicit Intents – A Worked Example”,\n    new ActivityResultCallback<ActivityResult>()\
  \ {\n        @Override\n        public void onActivityResult(ActivityResult result)\
  \ {\n            if (result.getResultCode() == Activity.RESULT_OK) {\n         \
  \       Intent data = result.getData();\n                // 在此处从 Uri 读取文件内容\n  \
  \          }\n        }\n    });\n```\n\n一旦声明，就可以如下配置并启动 intent：\n\n```java\nIntent\
  \ intent = new Intent(Intent.ACTION_OPEN_DOCUMENT);\nintent.addCategory(Intent.CATEGORY_OPENABLE);\n\
  intent.setType(\"text/plain\");\nstartOpenForResult.launch(intent);\n```\n\n###\
  \ 68.5 读取文件内容\n\n读取由文档提供者托管的文件内容所需的具体步骤在很大程度上取决于文件的类型。例如，从文本文件中读取行的步骤与处理图像或音频文件的步骤不同。\n\
  \n可以通过从 `Uri` 对象中提取文件描述符，然后将图像解码为 `BitmapFactory` 实例，将其分配给 `Bitmap` 对象。例如：\n\n```java\n\
  ParcelFileDescriptor pFileDescriptor = getContentResolver().openFileDescriptor(uri,\
  \ \"r\");\nFileDescriptor fileDescriptor = pFileDescriptor.getFileDescriptor();\n\
  Bitmap image = BitmapFactory.decodeFileDescriptor(fileDescriptor);\npFileDescriptor.close();\n\
  myImageView.setImageBitmap(image);\n```\n\n注意，文件描述符是以“r”模式打开的。这表示该文件将用于读取。其他选项包括用于写访问的“w”和用于读写双访问的“rwt”，其中文件中的现有内容会被新内容截断。\n\
  \n读取文本文件的内容需要稍多的工作并并使用 `InputStream` 对象。例如，以下代码从文本文件中读取每行内容：\n\n```java\nInputStream\
  \ inputStream = getContentResolver().openInputStream(uri);\nBufferedReader reader\
  \ = new BufferedReader(new InputStreamReader(inputStream));\nString readline;\n\
  while ((readline = reader.readLine()) != null) {\n    // 对文件中的每行进行某些操作\n}\ninputStream.close();\n\
  ```\n\n### 68.6 向文件写入内容\n\n向文档提供者托管的打开文件写入内容与读取类似，但使用的是输出流而不是输入流。例如，以下代码向指定的 `Uri`\
  \ 引用的存储基础文件的输出流写入文本：\n\n```java\ntry {\n    ParcelFileDescriptor pFileDescriptor\
  \ = getContentResolver().openFileDescriptor(uri, \"w\");\n    FileOutputStream fileOutputStream\
  \ = new FileOutputStream(pFileDescriptor.getFileDescriptor());\n    String textContent\
  \ = \"Some text\";\n    fileOutputStream.write(textContent.getBytes());\n    fileOutputStream.close();\n\
  \    pFileDescriptor.close();\n} catch (FileNotFoundException e) {\n    e.printStackTrace();\n\
  } catch (IOException e) {\n    e.printStackTrace();\n}\n```\n\n首先，从 `Uri` 中提取文件描述符，随后用于获取输出流的引用。在关闭文件描述符之前，将内容（在本例中为文本）写入输出流。\n\
  \n### 68.7 删除文件\n\n是否可以删除文件取决于文档提供者是否支持删除。假设允许删除，可以如下所示对指定的 `Uri` 执行删除：\n\n```java\n\
  if (DocumentsContract.deleteDocument(getContentResolver(), uri)) {\n    // 删除成功\n\
  } else {\n    // 删除失败\n}\n```\n\n### 68.8 获取对文件的持久访问权限\n\n当应用程序通过 `Storage Access\
  \ Framework` 获取文件的访问权限时，该访问将一直持续到重启 Android 设备为止。通过“获取” `Uri` 必要的权限，可以获得对特定文件的持久访问权限。例如，以下代码为\
  \ `fileUri` 实例引用的文件持久读写权限：\n\n```java\nint takeFlags = intent.getFlags() & (Intent.FLAG_GRANT_READ_PERMISSION\
  \ | Intent.FLAG_GRANT_WRITE_PERMISSION);\ngetContentResolverPermission(fileUri,\
  \ takeFlags);\n```\n\n一旦应用程序获取了文件的权限，并且应用程序保存了该 `Uri`，用户在设备重启后应该继续访问该文件，而无需从选择器界面重新选择文件。\n\
  \n如果在任何时候不再需要持久权限，可以通过调用 content resolver 的 `releasePersistableUriPermission()`\
  \ 来释放它们：\n\n```java\nint releaseFlags = intent.getFlags() & (Intent.FLAG_GRANT_READ_PERMISSION\
  \ | Intent.FLAG_GRANT_WRITE_PERMISSION);\ngetContentResolver().releasePersistableUriPermission(fileUri,\
  \ releaseFlags);\n```\n\n### 68.9 总结\n\n考虑过去几年人们对存储的感知变化是非常有趣的。“存储”一词曾与大容量内置硬盘等同，而现在，这个词同样可能指的是托管在远程云端并并通过互联网连接访问的存储空间。随着资源受限、始终在线且内部存储容量较小的移动设备的广泛普及，这种情况变得越来越普遍。\n\
  \n`Storage Access Framework` 为用户和应用程序开发者提供了一种简单的机制，用于无缝访问云文件。通过使用一组 intent 以及用于选择文档提供者和文件的内置用户界面，现在可以使用极少的代码将全面的云存储集成到\
  \ Android 应用程序中。\n\n### 69. 一个 Android Storage Access Framework 示例\n\n\n\n\n如前所述，`Storage\
  \ Access Framework` 极大地简化了将云存储访问集成到 Android 应用程序的过程。它通过包含一个选择器用户界面和一组新的 Intent，现在可以相对轻松地将对\
  \ Google Drive 和 Box 等文档提供程序存储文件的访问构建到 Android 应用中。在上一章介绍了 Android Storage Access\
  \ Framework 的基础知识后，本章将详细介绍如何创建一个示例应用程序，该程序将使用 `Storage Access Framework` 来存储和管理文件。\n\
  \n## 69.1 关于 Storage Access Framework 示例\n\n在本章创建的 Android 应用程序作为一个基础的文本编辑器，旨在创建文本文件并将其远程存储到云存储服务中。在实践中，该示例适用于任何兼容\
  \ Storage Access Framework 的云文档存储提供程序，尽管在本例示例中，我们假设使用的是 Google Drive。\n\n从功能角度来看，应用程序将向用户展示一个多行文本视图，用户可以在其中输入和编辑文本，并有一组按钮允许创建、打开和保存基于存储的文本文件。\n\
  \n## 69.2 创建 Storage Access Framework 示例\n\n从欢迎界面选择“New Project”（新建项目）选项，在弹出的新项目对话框中，选择“Empty\
  \ Activity”（空 Activity）模板，点击“Next”（下一步）按钮。\n\n在 `Name` 字段输入 `StorageDemo`，并将 `com.ebookfrenzy.storagedemo`\
  \ 指定包包。在点击“Finish”（完成）按钮之前，将 Minimum API level（最低 API 级别）设置为 `API 26: Android 8.0\
  \ (Oreo)`，并将语言菜单更改为 `Java`。按照章节 11.8 Migrating a Project to View Binding（将项目迁移到\
  \ View Binding） 中的常规步骤为项目添加 view binding 支持。\n\n## 69.3 设计用户界面\n\n用户界面需要由三个 `Button`\
  \ 视图和一个 `EditText` 视图组成。在 Project 工具窗口中，导航到 `app -> res -> layout` 下的 `activity_main.xml`\
  \ 布局文件并双击将其加载到 Layout Editor（布局编辑器）工具中。在 Design（设计）模式下，选择并删除 Hello World! `TextView`\
  \ 对象。\n\n在布局的左上角拖动并放置 `Button` 小部件，以便在放置组件之前出现左侧和顶部的虚线引导线。放置第二个 `Button`，使其中心和顶部的引导线出现。第三个\
  \ `Button` 小部件应放置在顶部和右侧的引导线出现的位置。\n\n将三个按钮的文本属性分别更改为“New”（新建）、“Open”（打开）和“Save”（保存）。接下来，放置一个\
  \ Plain Text 小部件，使其水平居中并位于中间按钮下方，以便使用户界面布局与 图 69-1 所示所示。使用 Layout Editor 工具栏中的 `Infer\
  \ Constraints`推推约束）按钮添加任何缺失的约束。\n\n选择布局中的 Plain Text 小部件，删除当前的文本属性设置，使字段初始为空，并将\
  \ ID 设置为 `fileText`。接下来，将字符串属性提取到命名为 `string`、`open_string` 和 `save_string` 的资源值。\n\
  \n![](img/as_4.1_storage_demo_ui.jpg)\n\n图 69-1\n\n使用 Attributes（属性）工具窗口，配置 `Button`\
  \ 小部件上的 `onClick` 属性，分别调用命名为 `newFile`、`openFile` 和 `saveFile` 的方法。\n\n## 69.4 添加\
  \ Activity 启动器\n\n按照章节 #Android Explicit Intents – A Worked Example（Android 显式 Intent——实例示例）\
  \ 所示的步骤操作，我们需要开始注册 activity 启动器来处理文件内容的创建、打开和保存。在 `MainActivity.java` 文件中，为这三个操作中的每一个添加一个启动器，如下所示：\n\
  \n```java\n.\n\nimport androidx.activity.result.ActivityResult;\nimport androidx.activity.result.ActivityResultCallback;\n\
  import androidx.activity.result.ActivityResultLauncher;\nimport androidx.activity.result.contract.ActivityResultContracts;\n\
  import android.app.Activity;\nimport android.content.Intent;\nimport android.net.Uri;\n\
  import java.io.IOException;\n.\n\nActivityResultLauncher<Intent> startOpenForResult\
  \ =\n    registerForActivityResult(\n        new ActivityResultContracts.StartActivityForResult(),\n\
  \        new ActivityResultCallback<ActivityResult>() {\n            @Override\n\
  \            public void onActivityResult(ActivityResult result) {\n           \
  \     if (result.getResultCode() == Activity.RESULT_OK) {\n                    Intent\
  \ data = result.getData();\n                    if (data != null) {\n          \
  \              Uri currentUri = data.getData();\n                        try {\n\
  \                            String content =\n                            readFileContent(currentUri);\n\
  \                            binding.fileText.setText(content);\n              \
  \          } catch (IOException e) {\n                            // Handle error\n\
  \                        }\n                    }\n                }\n         \
  \   }\n        });\n\nActivityResultLauncher<Intent> startSaveForResult =\n    registerForActivityResult(\n\
  \        new ActivityResultContracts.StartActivityForResult(),\n        result ->\
  \ {\n            if (result.getResultCode() == Activity.RESULT_OK) {\n         \
  \       Intent data = result.getData();\n                if (data != null) {\n \
  \                   Uri currentUri = data.getData();\n                    try {\n\
  \                        writeFileContent(currentUri);\n                    } catch\
  \ (IOException e) {\n                        // Handle error\n                 \
  \   }\n                }\n            }\n        });\n\nActivityResultLauncher<Intent>\
  \ startCreateForResult =\n    registerForActivityResult(\n        new ActivityResultContracts.StartActivityForResult(),\n\
  \        new ActivityResultCallback<ActivityResult>() {\n            @Override\n\
  \            public void onActivityResult(ActivityResult result) {\n           \
  \     if (result.getResultCode() == Activity.RESULT_OK) {\n                    Intent\
  \ data = result.getData();\n                    if (data != null) {\n          \
  \              binding.fileText.setText(\"\");\n                    }\n        \
  \        }\n            }\n        });\n```\n\n## 69.5 创建新的存储文件\n\n当选择 New 按钮时，应用程序需要触发一个\
  \ `ACTION_CREATE_DOCUMENT` Intent 来创建一个纯文本 MIME 类型的文件。在设计用户界面时，New 按钮被配置为调用命名为 `newFile()`\
  \ 的方法。我们需要在该方法内部启动适当的 Intent。\n\n留在 `MainActivity.java` 文件中，如下实现该方法：\n\n```java\n\
  package com.ebookfrenzy.storagedemo;\n\npublic class MainActivity extends AppCompatActivity\
  \ {\n\n.\n\n    public void newFile(View view)\n    {\n        Intent intent = new\
  \ Intent(Intent.ACTION_CREATE_DOCUMENT);\n        intent.addCategory(Intent.CATEGORY_OPENABLE);\n\
  \        intent.setType(\"text/plain\");\n        intent.putExtra(Intent.EXTRA_TITLE,\
  \ \"newfile.txt\");\n        startCreateForResult.launch(intent);\n    }\n\n.\n\n\
  }\n```\n\n此代码创建了一个新的 `ACTION_CREATE_DOCUMENT` `Intent` 对象。该 Intent 经过配置，以便仅返回可以使用文件描述打开的文件（通过\
  \ `Intent.CATEGORY_OPENABLE` 类别设置）。\n\n接下来，代码指定了要打开的文件应具有纯文本 MIME 类型，并提供了一个占位文件名（用户可以在选择器界面中更改它）。\n\
  \n\n\n\n\n当此方法执行且意图已完成分配的任务时，将调用 `startCreateForResult()` lambda 表达式并传递新创建文档的 `Uri`。\n\
  \n## 69.6 保存到存储文件\n\n现在应用程序能够创建新的存储基于文件，下一步是添加将用户输入的任何文本保存到文件的功能。用户界面配置为在用户选择“保存（Save）”按钮时调用\
  \ `saveFile()` 方法。该方法将负责启动一个类型为 `ACTION_OPEN_DOCUMENT` 的新意图，这将显示选择器界面，使用户可以选择要存储文本的文件。由于我们只处理纯文本文件，因此需要配置意图以将用户的选择选项限制为匹配\
  \ `text/plain` MIME 类型的现有文件。在确定了 `saveFile()` 方法要执行的操作后，现在可以将其添加到 `MainActivity.java`\
  \ 类文件中如下：\n\n```java\npublic void saveFile(View view)\n{\n    Intent intent = new\
  \ Intent(Intent.ACTION_OPEN_DOCUMENT);\n    intent.addCategory(Intent.CATEGORY_OPENABLE);\n\
  \    intent.setType(\"text/plain\");\n    startSaveForResult.launch(intent);\n}\n\
  ```\n\n分配给 `startSaveForResult()` 的 lambda 调用名为 `writeFileContent()` 的方法，传递要写入文本的文件的\
  \ `Uri`。在 `MainActivity.java` 文件中，现在实现此方法，使其读取方式如下：\n\n```java\npackage com.ebookfrenzy.storagedemo;\n\
  \nimport java.io.FileOutputStream;\nimport android.os.ParcelFileDescriptor;\n\n\
  public class MainActivity extends AppCompatActivity {\n.\n.\n\n    private void\
  \ writeFileContent(Uri uri) throws IOException\n    {\n        try{\n          \
  \  ParcelFileDescriptor pfd =\n                    this.getContentResolver().\n\
  \                    openFileDescriptor(uri, \"w\");\n            FileOutputStream\
  \ fileOutputStream =\n                    new FileOutputStream(\n              \
  \              pfd.getFileDescriptor());\n            String textContent =\n   \
  \                 binding.fileText.getText().toString();\n            fileOutputStream.write(textContent.getBytes());\n\
  \            fileOutputStream.close();\n            pfd.close();\n        } catch\
  \ (IOException e) {\n            e.printStackTrace();\n        }\n    }\n.\n.\n\
  }\n```\n\n该方法首先从用户选择的文件的 `Uri` 获取并打开文件描述符。由于代码需要写入文件，因此以写入模式（`\"w\"`）打开描述符。然后使用文件描述符作为创建输出流的基础，以便应用程序能够写入文件。用户输入的文本从编辑对象中提取，并在文件描述符和流关闭之前写入输出流。代码中还添加了处理以处理文件写入过程中发生的任何\
  \ `IO` 异常。\n\n## 69.7 打开并读取存储文件\n\n在编写了创建和保存文件的代码后，最后的任务是添加从存储中打开和读取文件的功能。这将涉及 `openFile()`\
  \ `onClick` 事件处理程序并实现它以启动 `ACTION_OPEN_DOCUMENT` 意图：\n\n```java\npublic void openFile(View\
  \ view)\n{\n    Intent intent = new Intent(Intent.ACTION_OPEN_DOCUMENT);\n    intent.addCategory(Intent.CATEGORY_OPENABLE);\n\
  \    intent.setType(\"text/plain\");\n    startSaveForResult.launch(intent);\n}\n\
  ```\n\n下一个任务是实现由 `startSaveForResult()` lambda 调用的 `readFileContent()` 方法：\n\n```java\n\
  package com.ebookfrenzy.storagedemo;\n.\nimport java.io.BufferedReader;\nimport\
  \ java.io.InputStream;\nimport java.io.InputStreamReader;\n.\npublic class MainActivity\
  \ extends AppCompatActivity {\n.\n.\n    private String readFileContent(Uri uri)\
  \ throws IOException {\n        InputStream inputStream =\n                getContentResolver().openInputStream(uri);\n\
  \        BufferedReader reader =\n                new BufferedReader(new InputStreamReader(inputStream));\n\
  \        StringBuilder stringBuilder = new StringBuilder();\n        String currentline;\n\
  \        while ((currentline = reader.readLine()) != null) {\n            stringBuilder.append(currentline).append(\"\
  \\n\");\n        }\n        inputStream.close();\n        return stringBuilder.toString();\n\
  \    }\n.\n.\n}\n```\n\n该方法首先提取所选文本文件的文件描述符并打开读取。然后打开与 `Uri` 关联的输入流，并将其作为 `BufferedReader`\
  \ 实例的输入源。随后读取文件的每一行并存储在 `StringBuilder` 对象中。一旦读取了所有行，输入流和文件描述符都将被关闭，并将文件内容作为 `String`\
  \ 对象返回。\n\n## 69.8 测试存储访问应用程序\n\n编码阶段完成后，应用程序已准备好进行测试。编译并运行应用程序，选择“新建（New）”按钮。随后，存储访问框架应该如图\
  \ 69-2 所示显示下载用户界面：\n\n![](img/as_3.5_storage_downloads_screen.jpg)\n图 69-2\n\n点击上方高亮的菜单按钮，选择“云端硬盘（Drive）”选项，然后是“我的云（My\
  \ Drive）”，导航到 Google Drive 存储上的合适位置保存文件。在选择器界面底部的文本字段中，在选择“保存（Save）”选项之前，将名称从 `\"\
  newfile.txt\"` 更改为合适的名称（但保留 `.txt` 扩展名）。\n\n![](img/as_3.5_storage_destination_.jpg)\n\
  图 69-3\n\n一旦创建了新文件，应用程序应返回主活动，通知面板可能会出现显示“已上传文件（1 file uploaded）”的通知。\n\n![](img/as_3.5_storage_upload_notification.jpg)\n\
  图 69-4\n\n此时，应该可以在浏览器窗口中登录您的 Google Drive 账户并在请求的位置找到新文件。如果文件丢失，请确保运行应用程序的 Android\
  \ 设备已连接到互联网。\n\n## 69.9 总结\n\n本章通过创建一个示例 Android Studio 应用程序完成，该程序是一个非常简易的文本编辑器，旨在使用\
  \ Android 存储框架利用云端存储创建、保存和打开文件。\n\n## 70. 使用 VideoView 和 MediaController 类在 Android\
  \ 上进行视频播放\n\n\n\n\n\n智能手机和平板电脑的主要用途之一是访问在线内容。一种广泛使用的内容形式（特别是在平板设备上）是视频。\n\n`Android\
  \ SDK` 包含了两个类，它们在开发应用程序时使得在 Android 设备上实现视频播放变得极其简单。本章将在介绍创建视频播放应用程序之前，先对这两个类——`VideoView`\
  \ 和 `MediaController`——进行概述。\n\n## 70.1 介绍 Android VideoView 类\n\n到目前为止，在 Android\
  \ 应用中显示视频的最简单方法是使用 `VideoView` 类。这是一个视觉组件，当它添加到 `activity` 的布局中时，会提供一个可以播放视频的表面。Android\
  \ 目前支持以下视频格式：\n\n• H.263\n• H.264 AVC\n• H.265 HEVC\n• MPEG-4 SP\n• VP8\n• VP9\n\
  \n`VideoView` 类拥有许多可以调用以管理视频播放的方法。以下是一些常用的方法：\n\n- `setVideoPath(String path)` –\
  \ 指定要播放的视频媒体文件的路径（字符串形式的路径）。这可以是远程视频文件的 URL，也可以是设备本地的视频文件。\n- `setVideoUri(Uri uri)`\
  \ – 执行与 `setVideoPath()` 方法相同的任务，但接受一个 `Uri` 对象作为参数而不是字符串。\n- `start()` – 开始视频播放。\n\
  - `stopPlayback()` – 停止视频播放。\n- `pause()` – 暂停视频播放。\n- `isPlaying()` – 返回 `Boolean`\
  \ 值，表示视频是否正在播放。\n- `setOnPreparedListener(MediaPlayer.OnPreparedListener)` – 允许在视频准备好播放时调用回调方法。\n\
  - `setOnErrorListener(MediaPlayer.OnErrorListener)` - 允许在视频播放期间发生错误时调用回调方法。\n- `setOnCompletionListener(MediaPlayer.OnCompletionListener)`\
  \ – 允许在视频结束时调用回调方法。\n- `getDuration()` – 返回视频时长。除非从 `OnPreparedListener()` 回调方法内部调用，否则通常会返回\
  \ -1。\n- `getCurrentPosition()` – 返回指示当前播放位置的整数值。\n- `setMediaController(MediaController)`\
  \ – 指定一个 `MediaController` 实例，允许向用户显示播放控件。\n\n## 70.2 介绍 Android MediaController\
  \ 类\n\n如果仅使用 `VideoView` 类播放视频，用户将无法对播放进行任何控制，视频将一直运行到结束。这个问题可以通过向 `VideoView` 实例附加一个\
  \ `MediaController` 类的实例来解决。此时 `MediaController` 将提供一组控件，允许用户管理播放（例如暂停以及在视频时间轴上向后/向前快进）。\n\
  \n控件的位置通过将控制器实例锚定到用户界面布局中的特定视图（view）来指定。一旦附加并锚定，控件将在播放开始时短暂出现，随后用户可以通过点击该实例所锚定的视图在任何时间点恢复这些控件。\n\
  \n该类的一些关键方法如下：\n\n- `setAnchorView(View view)` – 指定要将控制器锚定的到的视图。这决定了控件在屏幕上的位置。\n\
  - `show()` – 显示控件。\n- `show(int timeout)` – 控件在指定的时长（毫秒）内显示。\n- `hide()` – 向用户隐藏控制器。\n\
  - `isShowing()` – 返回 `Boolean` 值，表示控件当前是否对用户可见。\n\n## 70.3 创建视频播放示例\n\n本章的剩余部分将创建一个示例应用程序，旨在使用\
  \ `VideoView` 和 `MediaController` 类播放 MPEG-4 视频文件。\n\n从欢迎屏幕上选择 `New Project`get，在弹出的新项目对话框中，点击\
  \ `Next` 按钮之前选择 `Empty Activity` 模板。\n\n在 `Name` 字段中输入 `VideoPlayer` 并指定 `com.ebookfrenzy.videoplayer`\
  \ 为包名。在点击 `Finish` 按钮之前，将 `Minimum API level` 设置为 `API 26: Android 8.0 (Oreo)`，并将\
  \ `Language` 菜单更改为 `Java`。使用章节 [11.8 Migrating a Project to View Binding] 中的步骤为项目启用视图绑定。\n\
  \n## 70.4 设计 VideoPlayer 布局\n\n主 `activity` 的用户界面将仅由一个 `VideoView` 类实例组成。使用 `Project`\
  \ 工具窗口找到 `app -> res -> layout -> activity_main.xml` 文件，双击它，将 `Layout Editor` 工具切换到\
  \ `Design` 模式并删除默认的 `TextView` 控件。\n\n从 `Palette` 面板的 `Widgets` 类别中，将 `VideoView`\
  \ 实例拖放到布局中，使其如所示填充可用画布区域。使用 `Attributes` 面板，将 `layout_width` 和 `layout_height` 属性分别更改为\
  \ `match_constraint` 和 `wrap_content`。此外，移除连接 `VideoView` 底部与父 `ConstraintLayout`\
  \ 底部的约束。最后，将组件的 `ID` 更改为 `videoView1`。\n\n![](img/as_3.5_videoplayer_ui.jpg)\n\n\
  图 70-1\n\n## 70.5 下载视频文件\n\n`VideoPlayer` 应用将播放的视频是一个 MPEG-4 格式的短动画片段。使用浏览器导航到以下\
  \ URL 以播放视频：\n\n`https://www.ebookfrenzy.com/android_book/movie.mp4`\n\n留在浏览器窗口中，右键点击视频播放并选择将其保存到本地文件，并命名为\
  \ `movie.mp4`。\n\n在 `Android Studio` 中，在 `Project` 工具窗口找到 `res` 文件夹，右键点击它并选择 `New\
  \ -> Directory` 选项，在按下 `Return` 键之前输入 `raw`。使用操作系统的文件导航器找到下载的 `movie.mp4` 文件并进行复制。返回\
  \ `Android Studio`，右键点击新创建的 `raw` 目录并选择 `Paste` 选项将视频复制到项目中。添加后，`raw` 文件夹应如 `Project`\
  \ 工具窗口所示：\n\n![](img/as_3.6_video_player_raw_file_added.jpg)\n\n图 70-2\n\n## 70.6\
  \ 配置 VideoView\n\n下一步是为 `VideoView` 配置视频路径并开始播放。这将在主 `activity` 初始化后执行，因此将 `MainActivity.java`\
  \ 文件加载到编辑器中并按照以下概述进行修改：\n\n```java\npackage com.ebookfrenzy.videoplayer;\n\nimport\
  \ androidx.appcompat.app.AppCompatActivity;\nimport android.os.Bundle;\nimport android.net.Uri;\n\
  import android.view.View;\n\npublic class MainActivity extends AppCompatActivity\
  \ {\n    private ActivityMainBinding binding;\n\n    @Override\n    protected void\
  \ onCreate(Bundle savedInstanceState) {\n        super.onCreate(savedInstanceState);\n\
  \        binding = ActivityMainBinding.inflate(getLayoutInflater());\n        View\
  \ view = binding.getRoot();\n        setContentView(view);\n        configureVideoView();\n\
  \    }\n\n    private void configureVideoView() {\n        binding.videoView1.setVideoURI(Uri.parse(\"\
  android.resource://\" + getPackageName() + \"/\" + R.raw.movie));\n        binding.videoView1.start();\n\
  \    }\n}\n```\n\n这段代码仅获取布局中 `VideoView` 实例的引用，为其分配一个指向 raw 资源目录中视频文件的 `URI` 对象，然后开始视频播放。\n\
  \n\n\n\n通过在模拟器或物理 Android 设备上运行来测试该应用程序。应用程序启动后，在视频播放之前可能会有短暂的延迟（图 70-3）。\n\n![](img/as_3.6_video_player_playing.jpg)\n\
  \n图 70-3\n\n这展示了将视频播放集成到 Android 应用程序中多么简单。本示例中的所有内容都是通过一个 `VideoView` 实例和三行代码实现的。\n\
  \n## 70.7 为 Video View 添加 MediaController\n\n目前 `VideoPlayer` 应用程序的状态是用户没有方法控制播放。如之前所述，可以使用\
  \ `MediaController` 类来实现这一点。要为 `VideoView` 添加控制器，请再次修改 `configureVideoView()` 方法：\n\
  \n```java\npackage com.ebookfrenzy.videoplayer;\n\n.\n.\n\nimport android.widget.MediaController;\n\
  \npublic class MainActivity extends AppCompatActivity {\n    private ActivityMainBinding\
  \ binding;\n    private MediaController mediaController;\n.\n.\n    private void\
  \ configureVideoView() {\n        binding.videoView1.setVideoURI(Uri.parse(\"android.resource://\"\
  \n                + getPackageName() + \"/\" + R.raw.movie));\n        mediaController\
  \ = new MediaController(this);\n        mediaController.setAnchorView(binding.videoView1);\n\
  \        binding.videoView1.setMediaController(mediaController);\n        binding.videoView.start();\n\
  \    }\n}\n```\n\n当应用这些更改启动应用程序时，点击 `VideoView` 画布将使媒体控件出现在视频播放上方。这些控件应该包含一个进度条以及快进、倒退和播放/暂停按钮。当控件从视野消失后，可以通过再次点击\
  \ `VideoView` 画布随时恢复它们。只需额外的三行代码，我们的视频播放器应用程序现在就有了如图 70-4 所示的媒体控件：\n\n![](img/as_3.6_video_player_media_controls.jpg)\n\
  \n图 70-4\n\n## 70.8 设置 onPreparedListener\n\n作为处理视频媒体的最后一个示例，现在 现在将进一步扩展，以演示配置监听器的机制。在这种情况下，将实现一个监听器，用于将视频时长作为消息在\
  \ Android Studio Logcat 面板中输出。该监听器还将配置视频播放持续循环：\n\n```java\npackage com.ebookfrenzy.videoplayer;\n\
  \n.\n.\n\nimport android.util.Log;\n\npublic class MainActivity extends AppCompatActivity\
  \ {\n    private ActivityMainBinding binding;\n    private MediaController mediaController;\n\
  \    String TAG = \"VideoPlayer\";\n\n    private void configureVideoView() {\n\
  \        binding.videoView1.setVideoURI(Uri.parse(\"android.resource://\"\n    \
  \            + getPackageName() + \"/\" + R.raw.movie));\n        MediaController\
  \ mediaController = new\n                    MediaController(this);\n        mediaController.setAnchorView(binding.videoView1);\n\
  \        binding.videoView1.setMediaController(mediaController);\n        binding.videoView1.setOnPreparedListener(mp\
  \ -> {\n            mp.setLooping(true);\n            Log.i(TAG, \"Duration = \"\
  \ +\n                    binding.videoView1.getDuration());\n        });\n     \
  \   binding.videoView.start();\n    }\n}\n```\n\n现在在视频播放开始之前，Android Studio Logcat\
  \ 面板中将出现一条如下所示的消息，并且视频将在播放结束后重启：\n\n`2022-12-13 16:41:42.867 VideoPlayer Duration\
  \ =`\n\n## 70.9 总结\n\nAndroid 是内容分发的优秀平台。正如本章概述，Android 提供了两个类，即 `VideoView` 和 `MediaController`，它们只需几行代码即可轻松集成视频播放。\n\
  \n## 71 画中画 (Picture-in-Picture)\n\n虽然已经涵盖了 Android 中的多任务处理，但画中画（PiP）允许 Activity\
  \ 在执行其他任务的同时继续。本章将提供画中画的概述以及如何使用。\n\n### 71.1 画中画功能\n\n正如本章稍后解释的，PiP 模式通过使用 `PictureInPictureParams`\
  \ 类定义，该实例可以使用 `Builder` 类创建。例如，在图 71-1 中，PiP 模式显示为：\n\n![](img/2473.jpg)\n\n图 71-1\n\
  \n图 71-2 显示了点击后的 PiP 窗口。在这种模式下，窗口看起来更大，并在右上角有一个用于关闭窗口的退出按钮。\n\n![](img/24363.jpg)\n\
  \n图 71-2\n\n### 71.2 启用画中画\n\nPiP 模式目前仅支持运行 API 26 (Android 8.0 Oreo) 或更高版本的设备。实现\
  \ PiP 模式的第一步是在项目的 manifest 文件中启用它。\n\n```xml\n<activity android:name=\".MyActivity\"\
  \n    android:supportsPictureInPicture=\"true\"\n    android:configChanges=\"screenSize|smallestScreenSize|screenLayout|orientation\"\
  >\n    <intent-filter>\n        <action android:name=\"android.intent.action.MAIN\"\
  \ />\n        <category android:name=\"android.intent.category.LAUNCHER\" />\n \
  \   </intent-filter>\n</activity>\n```\n\n`android:supportsPictureInPicture` 启用了\
  \ Activity 的 PiP 功能，而 `android:configChanges` 属性通知 Android 该 Activity 能够处理配置更改。如果没有此设置，每当\
  \ Activity 进入或退出 PiP 模式时，Activity 都会重新启动，导致视频在切换期间从头开始播放。\n\n### 71.3 配置画中画参数\n\n\
  PiP 行为通过使用 `PictureInPictureParams` 类定义，其实例可以使用 `Builder` 类如下创建：\n\n```java\nPictureInPictureParams\
  \ params = new PictureInPictureParams.Builder().build();\n```\n\n上述代码创建了一个带有特殊参数的默认\
  \ `PictureInPictureParams` 实例。可以使用以下可选的方法调用来自定义参数：\n\n- `setActions()`：用于定义 Activity\
  \ 处于 PiP 模式时在 PiP 窗口内执行的操作。操作将在本章稍后部分详细介绍。\n\n\n\n\n## 方法\n\n* `setAspectRatio()`\
  \ – 声明画中画（PiP）窗口外观的首选宽高比。此方法接受一个 `Rational` 对象作为参数，该对象包含高度除以宽度的比例。\n* `setSourceRectHint()`\
  \ – 接受一个 `Rect` 对象作为参数，定义在 PiP 窗口中显示的活动屏幕区域。\n\n例如，下面的代码在 `PictureInPictureParams`\
  \ 对象中配置了宽高比和操作参数。对于宽高比，它是通过使用 `VideoView` 实例的宽度和高度维度定义的：\n\n```java\nRational rational\
  \ = new Rational(videoView.getWidth(),\n                               videoView.getHeight());\n\
  PictureInPictureParams params =\n    new PictureInPictureParams.Builder()\n    \
  \          .setAspectRatio(rational)\n              .setActions(actions)\n     \
  \         .build();\n```\n\n一旦定义，可以使用 `setPictureInPictureParams()` 方法在任何时间设置 PiP\
  \ 参数，如下所示：\n\n```java\nsetPictureInPictureParams(params);\n```\n\n在进入 PiP 模式时也可以指定参数。\n\
  \n## 71.4 进入画中画模式\n\n通过调用 `enterPictureInPictureMode()` 方法并传递一个 `PictureInPictureParams`\
  \ 对象，可以将活动放入画中画模式：\n\n```java\nenterPictureInPictureMode(params);\n```\n\n如果不需要参数，只需按照上一节所述创建一个默认的\
  \ `PictureInPictureParams` 对象即可。如果之前已使用 `setPictureInPictureParams()` 方法设置了参数，这些参数将与在调用\
  \ `enterPictureInPictureMode()` 方法时指定的参数进行组合。\n\n## 71.5 检测画中画模式变化\n\n当活动进入 PiP\
  \ 模式时，隐藏任何不必要的视图是非常重要的，这样 PiP 窗口内就只可见视频播放。当活动重新进入全屏模式时，需要恢复任何隐藏的用户界面组件。这些以及任何其他特定于应用程序的任务可以通过重写\
  \ `onPictureInPictureModeChanged()` 方法来完成。当该方法添加到活动后，每当活动在 PiP 和全屏模式之间切换时就会被调用一次，并传递一个\
  \ `Boolean` 值，指示活动当前是否处于 PiP 模式下：\n\n```java\n@Override\npublic void onPictureInPictureModeChanged(\n\
  \            boolean isInPictureInPictureMode) {\n    super.onPictureInPictureModeChanged(isInPictureInPictureMode);\n\
  \    if (isInPictureInPictureMode) {\n        // 活动进入画中画模式\n    } else {\n     \
  \   // 活动进入全屏模式\n    }\n}\n```\n\n## 71.6 添加画中画操作\n\n画中画操作在用户点击 PiP 窗口时会以图标的形式出现。PiP\
  \ 操作的实现是一个多步骤过程，首先要实现一种让 PiP 窗口通知活动已选择某个操作的方法。这通过在活动中设置一个广播接收器（broadcast receiver）来实现，然后在\
  \ PiP 操作中创建一个 `pending intent`（待处理意图），该意图反过来配置为对广播接收器正在监听的意图进行广播。当广播接收器被意图触发时，可以使用意图中存储的数据来识别所执行的操作，并在活动中采取必要的行动。\n\
  \nPiP 操作使用 `RemoteAction` 实例进行声明，这些实例在初始化时包含图标、标题、描述以及 `PendingIntent` 对象。一旦创建了一个或多个操作，它们就会被添加到\
  \ `ArrayList` 中，并在构建 `PictureInPictureParams` 对象时通过 `setActions()` 方法传递。\n\n下面的代码段演示了\
  \ `Intent`、`PendingIntent` 和 `RemoteAction` 对象的创建，以及一个 `PictureInPictureParams`\
  \ 实例，然后该实例被应用于活动的 PiP 设置：\n\n```java\nfinal ArrayList<RemoteAction> actions = new\
  \ ArrayList<>();\nIntent actionIntent = new Intent(\"MY_PIP_ACTION\");\nfinal PendingIntent\
  \ pendingIntent =\n    PendingIntent.getBroadcast(MyActivity.this,\n           \
  \                   REQUEST_CODE, actionIntent, FLAG_IMMUTABLE);\nfinal Icon icon\
  \ = Icon.createWithResource(MyActivity.this,\n                              R.drawable.action_icon);\n\
  RemoteAction remoteAction = new RemoteAction(icon,\n                           \
  \   \"My Title\",\n                              \"My Description\",\n         \
  \                     pendingIntent);\n\nactions.add(remoteAction);\nPictureInPictureParams\
  \ params =\n    new PictureInPictureParams.Builder()\n              .setActions(actions)\n\
  \              .build();\n\nsetPictureInPictureParams(params);\n```\n\n## 71.7 总结\n\
  \n画中画模式是 Android 8.0 引入的一个功能，旨在允许用户在执行其他任务时在小窗口中继续播放视频。在使用 PiP 模式之前，必须先在清单文件中启用它。在\
  \ PiP 模式下，应只显示视频播放；这些以及其他相关任务可以通过重写 `onPictureInPictureModeChanged()` 方法来完成。PiP\
  \ 操作以叠加在 PiP 窗口上的图标形式出现。\n\n## 72. Android 画中画教程\n\n接上文，本章将采用现有的 VideoPlayer 项目并对其增强，以添加画中画的支持，包括检测\
  \ PiP 模式变化和添加 PiP 操作。\n\n### 72.1 在 Manifest 中添加画中画模式支持\n\n在 Android 应用中添加 PiP 支持的第一步是在清单文件中启用它。打开\
  \ `AndroidManifest.xml` 文件并修改 `activity` 元素以启用 PiP 支持：\n\n```xml\n<activity android:name=\"\
  .MainActivity\"\n    android:supportsPictureInPicture=\"true\"\n    android:configChanges=\"\
  screenSize|smallestScreenSize|screenLayout|orientation\"\n    android:exported=\"\
  true\">\n    <intent-filter>\n        <action android:name=\"android.intent.action.MAIN\"\
  \ />\n        <category android:name=\"android.intent.category.LAUNCHER\" />\n \
  \   </intent-filter>\n</activity>\n```\n\n### 72.2 添加画中画按钮\n\n目前的设计中，VideoPlayer\
  \ 活动布局仅包含一个 `VideoView` 实例。现在将添加一个按钮用于切换到 PiP 模式。加载 `activity_main.xml` 文件到布局编辑器从调色板中拖入\
  \ `Button` 对象到布局中，使其位置如图所示。\n\n更改按钮上的文本使其显示为“Enter PiP Mode”，并提取为名为 `enter_pip_mode`\
  \ 的资源。在继续下一步之前，将按钮的 ID 改为 `pipButton` 并配置 `onClick` 属性以调用名为 `enterPipMode` 的方法。\n\
  \n### 72.3 进入画中画模式\n\n现在需要将 `enterPipMode` `onClick` 回调方法添加到 `MainActivity.java`\
  \ 类文件中。找到该文件，在代码编辑器中打开它并如下添加此方法：\n\n```java\nimport android.app.PictureInPictureParams;\n\
  import android.util.Rational;\n\npublic void enterPipMode(View view) {\n    Rational\
  \ rational = new Rational(binding.videoView1.getWidth(),\n                     \
  \                binding.videoView1.getHeight());\n    PictureInPictureParams params\
  \ =\n```\n\n\n\n\n\n```java\nnew PictureInPictureParams.Builder()\n    .setAspectRatio(rational)\n\
  \    .build();\nbinding.pipButton.setVisibility(View.INVISIBLE);\nbinding.videoView1.setMediaController(null);\n\
  enterPictureInPictureMode(params);\n```\n\n该方法首先获取 `Button` 视图的引用，然后创建一个包含 `VideoView`\
  \ 宽度和高度的 `Rational` 对象。接着，使用 `PictureInPictureParams` Builder 创建一组画中画参数，并将 `Rational`\
  \ 对象作为视频播放的宽高比例传递。。由于视频处于 PiP（画中画）模式时，按钮不需要显示，因此将其设为不可见。视频播放控制控件也会从视图中隐藏，以确保视频视图在\
  \ PiP 模式下不会受到任何遮挡。\n\n在运行 Android 版本 8 或更高版本的设备或模拟器上编译并运行该应用，在点击 PiP 模式按钮之前等待视频播放开始。视频播放将最小化并出现在\
  \ PiP 窗口中，如图 72-2 所示：\n\n![](img/as_3.6_video_player_action_bar.jpg)\n\n图 72-2\n\
  \n虽然视频现在 PiP 窗口中播放，但大部分视图被标准的 Android Action Bar 遮挡了。要移除它，需要更改 Activity 的应用程序主题样式。在\
  \ Android Studio 中，找到并编辑 `app` -> `res` -> `values` -> `themes` -> `themes.xml`\
  \ 文件，并修改 `AppTheme` 元素使用 `NoActionBar` 主题：\n\n```xml\n<resources xmlns:tools=\"\
  http://schemas.android.com/tools\">\n    <!-- Base application theme. -->\n    <style\
  \ name=\"Theme.VideoPlayer\" parent=\"Theme.MaterialComponents.DayNight.NoActionBar\"\
  >\n        <!-- Primary brand color. -->\n        <item name=\"colorPrimary\">@color/purple_500</item>\n\
  \        <item name=\"colorPrimaryVariant\">@color/purple_700</item>\n    </style>\n\
  ```\n\n对 `themes.xml (night)` 资源文件重复此步骤。编译并运行应用，将视频播放进入 PiP 模式，并注意窗口中不再出现 Action\
  \ Bar：\n\n![](img/as_pip_video_window.jpg)\n\n图 72-3\n\n点击 PiP 窗口，然后点击窗口中心出现的全屏模式标记内。虽然\
  \ Activity 回到了全屏模式，但请注意按钮和媒体播放控件仍保持隐藏状态。\n\n显然，需要在项目中添加一些代码，以检测 Activity 发生 PiP\
  \ 模式切换的情况。\n\n## 72.4 检测画中画模式变化\n\n如前一节所述，PiP 模式的变化是通过重写受影响 Activity 内部的 `onPictureInPictureModeChanged()`\
  \ 方法来检测的。在这种情况下，需要编写该方法，以便能够检测 Activity 是正在进入还是退出 PiP 模式，并采取恰当的操作来重新激活 PiP 按钮和播放控件。留在\
  \ `MainActivity.java` 文件中，现在添加此方法：\n\n```java\n@Override\npublic void onPictureInPictureModeChanged(boolean\
  \ isInPictureInPictureMode) {\n    super.onPictureInPictureModeChanged(isInPictureInPictureMode);\n\
  \    if (isInPictureInPictureMode) {\n    } else {\n        binding.pipButton.setVisibility(View.VISIBLE);\n\
  \        binding.videoView1.setMediaController(mediaController);\n    }\n}\n```\n\
  \n当该方法被调用时，会传递一个 `Boolean` 值，指示 Activity 现在是否处于 PiP 模式。上述方法中的代码只需检查此值，以决定是否显示 PiP\
  \ 按钮并重新激活播放控件。\n\n## 72.5 添加广播接收器\n\n项目的最后一步是为 PiP 窗口添加操作。该操作的目的是显示一个包含当前播放视频名称的\
  \ `Toast` 消息。需要在 PiP 窗口和 Activity 之间进行某些通信。实现此点的简单方法之一是在 Activity 内部实现广播接收器，并使用\
  \ Pending Intent 从 PiP 窗口向 Activity 广播消息。每次 Activity 进入 PiP 模式都需要执行这些步骤，因此需要在 `onPictureInPictureModeChanged()`\
  \ 方法中添加代码。现在找到该方法，并开始添加代码以创建意过滤器并初始化广播接收器：\n\n```java\nimport android.content.BroadcastReceiver;\n\
  import android.content.Context;\nimport android.content.Intent;\nimport android.content.IntentFilter;\n\
  import android.widget.Toast;\n\npublic class MainActivity extends AppCompatActivity\
  \ {\n    private BroadcastReceiver receiver;\n\n    @Override\n    public void onPictureInPictureModeChanged(boolean\
  \ isInPictureInPictureMode) {\n        super.onPictureInPictureModeChanged(isInPictureInPictureMode);\n\
  \        if (isInPictureInPictureMode) {\n            IntentFilter filter = new\
  \ IntentFilter();\n            filter.addAction(\"com.ebookfrenzy.videoplayer.VIDEO_INFO\"\
  );\n            receiver = new BroadcastReceiver() {\n                @Override\n\
  \                public void onReceive(Context context, Intent intent) {\n     \
  \               Toast.makeText(context, \"Favorite Movie Clips\", Toast.LENGTH_LONG).show();\n\
  \                }\n            };\n            registerReceiver(receiver, filter);\n\
  \        } else {\n            binding.pipButton.setVisibility(View.VISIBLE);\n\
  \            binding.videoView1.setMediaController(mediaController);\n         \
  \   if (receiver != null) {\n                unregisterReceiver(receiver);\n   \
  \         }\n        }\n    }\n}\n```\n\n## 72.6 添加画中画操作\n\n实现广播接收器后，下一步是创建一个配置图像的\
  \ `RemoteAction` 对象以表示 PiP 窗口中的操作。对于本例，我们将使用名为 `ic_info_24dp.xml` 的图像文件。该文件可以在以下\
  \ URL 的源码下载包中找到：https://www.ebookfrenzy.com/retail/java/index.php\n\n找到此图标文件并将其复制到项目窗口中的\
  \ `app` -> `res` -> `drawable` 文件夹：\n\n![](img/Image2491.jpg)\n\n图 72-4\n\n下一步是创建一个发送给广播接收器的\
  \ `Intent`。然后需要将该意封装在 `PendingIntent` 对象中，以便在用户点击 PiP 窗口中的操作按钮时触发。\n\n编辑 `MainActivity.java`\
  \ 文件，添加如下创建 `Intent` 和 `PendingIntent` 对象的方法：\n\n```java\nimport android.app.PendingIntent;\n\
  import static android.app.PendingIntent.FLAG_IMMUTABLE;\n\npublic class MainActivity\
  \ extends AppCompatActivity {\n    private static final int REQUEST_CODE = 101;\n\
  \n    private void createPipAction() {\n        Intent actionIntent = new Intent(\"\
  com.ebookfrenzy.videoplayer.VIDEO_INFO\");\n        final PendingIntent pendingIntent\
  \ = PendingIntent.getBroadcast(MainActivity.this, REQUEST_CODE, actionIntent, FLAG_IMMUTABLE);\n\
  \    }\n}\n```\n\n现在已经创建了 `Intent` 对象以及包含它的 `PendingIntent` 实例，需要再创建一个 `RemoteAction`\
  \ 对象，其中包含显示在 PiP 窗口中的图标以及该 `PendingIntent` 对象。继续留在 `createPipAction()` 方法中，添加如下代码：\n\
  \n```java\nimport android.app.RemoteAction;\nimport android.graphics.drawable.Icon;\n\
  import java.util.ArrayList;\n\nprivate void createPipAction() {\n    final ArrayList<RemoteAction>\
  \ actions = new ArrayList<>();\n    Intent actionIntent = new Intent(\"com.ebookfrenzy.videoplayer.VIDEO_INFO\"\
  );\n    final PendingIntent pendingIntent = PendingIntent.getBroadcast(MainActivity.this,\n\
  ```\n\n\n\n\n```java\nREQUEST_CODE, actionIntent, FLAG_IMMUTABLE);\n\nfinal Icon\
  \ icon =\n        Icon.createWithResource(MainActivity.this,\n            R.drawable.ic_info_24dp);\n\
  \nRemoteAction remoteAction = new RemoteAction(icon, \"Info\",\n        \"Video\
  \ Info\", pendingIntent);\n\nactions.add(remoteAction);\n}\n```\n\n现在需要创建一个包含该操作的\
  \ `PictureInPictureParams` 对象并应用参数，以便该操作显示在 PiP（画中画）窗口中：\n\n```java\nprivate void\
  \ createPipAction() {\n    final ArrayList<RemoteAction> actions = new ArrayList<>();\n\
  \    Intent actionIntent =\n            new Intent(\"com.ebookfrenzy.videoplayer.VIDEO_INFO\"\
  );\n    final PendingIntent pendingIntent =\n        PendingIntent.getBroadcast(MainActivity.this,\n\
  \            REQUEST_CODE, actionIntent, FLAG_IMMUTABLE);\n    final Icon icon =\n\
  \            Icon.createWithResource(MainActivity.this,\n                R.drawable.ic_info_24dp);\n\
  \    RemoteAction remoteAction = new RemoteAction(icon, \"Info\",\n        \"Video\
  \ Info\", pendingIntent);\n    actions.add(remoteAction);\n    PictureInPictureParams\
  \ params =\n            new PictureInPictureParams.Builder()\n                .setActions(actions)\n\
  \                .build();\n    setPictureInPictureParams(params);\n}\n```\n\n在测试操作之前的最后一个任务是在当\
  \ activity 进入 PiP 模式时调用 `createPipAction()` 方法：\n\n```java\n@Override\npublic void\
  \ onPictureInPictureModeChanged(boolean isInPictureInPictureMode) {\n    super.onPictureInPictureModeChanged(isInPictureInPictureMode);\n\
  // ...\n        registerReceiver(receiver, filter);\n        createPipAction();\n\
  \    } else {\n        binding.pipButton.setVisibility(View.VISIBLE);\n        binding.videoView1.setMediaController(mediaController);\n\
  // ...\n}\n```\n\n### 72.7 测试画中画操作\n\n再次构建并运行应用，并将 activity 进入 PiP 模式。点击 PiP 窗口，新的操作按钮将如\
  \ 图 72-5 所示出现：\n\n![](img/as_3.6_video_player_action_button.jpg)\n\n图 72-5\n\n点击操作按钮，等待\
  \ Toast 消息出现并显示视频名称：\n\n![](img/as_pip_video_window_toast.jpg)\n\n图 72-6\n\n###\
  \ 72.8 总结\n\n本章演示了如何在 Android Studio 应用项目中添加画中画支持，包括启用和进入 PiP 模式以及 PiP 操作的实现。这包含了使用广播接收器和\
  \ `pending intents` 来实现 PiP 窗口与 activity 之间的通信。\n\n### 73. 使用 MediaPlayer 和 MediaRecorder\
  \ 进行音频录制和播放\n\n本章将概述 `MediaRecorder` 类，并解释如何使用该类录制音频或视频的基础知识。还将涵盖使用 `MediaPlayer`\
  \ 类播放音频的内容。在介绍基础知识后，将创建一个示例应用程序。\n\n#### 73.1 播放音频\n\n还将涵盖使用 `MediaPlayer` 类播放音频的内容。在介绍基础知识后，将创建一个示例应用程序。在音频播放方面，`MediaPlayer`\
  \ 有关联的方法：\n\n- `create()`：创建一个新的 `MediaPlayer` 实例。\n- `setDataSource()`：设置音频源。\n\
  - `prepare()`：准备 `MediaPlayer` 开始运行。\n- `start()`：开始播放。\n- `pause()`：暂停播放。\n- `stop()`：停止播放。\n\
  - `setVolume()`：接收浮点数参数。\n- `resume()`：恢复之前暂停的播放。\n- `reset()`：重置 `MediaPlayer`\
  \ 实例。\n- `release()`：当 `MediaPlayer` 实例不再需要时应调用此方法。\n\n一个典型的实现会实例化 `MediaPlayer`，设置源，然后调用\
  \ `prepare()` 接着调用 `start()`。例如：\n\n```java\nMediaPlayer mediaPlayer = new MediaPlayer();\n\
  mediaPlayer.setDataSource(\"youraudio.mp3\");\nmediaPlayer.prepare();\nmediaPlayer.start();\n\
  ```\n\n#### 73.2 使用 MediaRecorder 录制音频和视频\n\n本章将概述 `MediaRecorder` 类，并解释如何使用该类录制音频或视频的基础知识。与音频播放一样，`MediaRecorder`\
  \ 提供了许多方法：\n\n- `setAudioSource()`：指定要录制的音频的源（通常为 `MediaRecorder.AudioSource.MIC`）。\n\
  - `setVideoSource()`：指定要录制的视频的源（例如 `MediaRecorder.VideoSource.CAMERA`）。\n- `setOutputFormat()`：指定录制的音频或视频存储的格式（例如\
  \ `MediaRecorder.OutputFormat.AAC_ADTS`）。\n- `setAudioEncoder()`：指定用于录制音频的音频编码器（例如\
  \ `MediaRecorder.AudioEncoder.AAC`）。\n- `setOutputFile()`：配置录制的音频或视频所存储的文件路径。\n\
  - `prepare()`：准备 `MediaRecorder` 实例开始录制。\n- `start()`：开始录制过程。\n- `stop()`：停止录制过程。\n\
  - `reset()`：重置录制器。\n- `release()`：当录制器实例不再需要时应调用此方法。\n\n使用该类的典型实现将设置源、输出格式、编码格式以及输出文件。然后将调用\
  \ `prepare()` 和 `start()` 方法。例如：\n\n```java\nMediaRecorder mediaRecorder = new MediaRecorder();\n\
  mediaRecorder.setAudioSource(MediaRecorder.AudioSource.MIC);\nmediaRecorder.setOutputFormat(MediaRecorder.OutputFormat.AAC_ADTS);\n\
  mediaRecorder.setAudioEncoder(MediaRecorder.AudioEncoder.AAC);\nmediaRecorder.setOutputFile(audioFilePath);\n\
  mediaRecorder.prepare();\nmediaRecorder.start();\n```\n\n为了录制音频，应用程序清单文件必须包含 `android.permission.RECORD_AUDIO`\
  \ 权限：\n\n```xml\n<uses-permission android:name=\"android.permission.RECORD_AUDIO\"\
  \ />\n```\n\n\n\n\n\n正如“在 Android 中进行运行时权限请求”章节概述的那样，访问麦克风属于危险权限范畴。因此，为了支持 Android\
  \ 6，在应用程序启动时必须对麦克风访问提出特定请求，相关步骤将在本章稍后介绍。\n\n## 73.3 关于示例项目\n\n本章的剩余部分将通过创建一个示例应用程序，来演示如何使用\
  \ `MediaPlayer` 和 `MediaRecorder` 类在 Android 设备上实现音频的录制和播放。\n\n在开发使用特定硬件功能（以麦克风为例）的应用程序时，在尝试代码尝试访问该功能之前，检查该功能的可用性至关重要。因此，在本章创建的应用程序还将包含检测设备上是否存在麦克风的代码。\n\
  \n完成后，该应用程序将提供一个非常简单的界面，允许用户录制和播放音频。录制的音频需要存储在设备上的一个音频文件中。既然如此，本教程还将简要探索使用 SD 卡进行存储的机制。\n\
  \n## 73.4 创建 AudioApp 项目\n\n从欢迎界面选择 `New Project`（新建项目）选项，在出现的新项目对话框中选择 `Empty Activity`（空活动）模板，然后点击\
  \ `Next` 按钮。\n\n在 `Name` 字段中输入 `AudioApp`，并指定 `com.ebookfrenzy.audioapp` 为包名。在点击\
  \ `Finish` 按钮之前，将 `Minimum API level`（最低 API 级别）设置为 `API 31: Android 12.0`，并将 `Language`（语言）菜单改为\
  \ `Java`。按照第 11.8 节“迁移项目到 View Binding”中的步骤为项目添加 view binding 支持。\n\n## 73.5 设计用户界面\n\
  \n新项目完成后，从 Project 工具窗口选择 `activity_main.xml` 文件，并在 Design 模式下的 Layout Editor 工具中，选择“Hello\
  \ World!” `TextView` 并将其从布局中删除。\n\n将三个 `Button` 视图拖放到布局中。这些按钮的位置对于本示例来说并不是至关重要的，尽管图\
  \ 73-1 显示了一个使用垂直链的建议布局。\n\n配置按钮以显示名为 Play、Record 和 Stop 的字符串资源，并分别为它们赋予 `playButton`、`recordButton`\
  \ 和 `stopButton` 视图 ID。\n\n选择 Play 按钮，并在 Attributes（属性）面板中配置 `onClick` 属性，以便在用户选择时调用名为\
  \ `playAudio` 的方法。重复这些步骤配置其余按钮分别调用名为 `recordAudio` 和 `stopAudio` 的方法。\n\n![](img/as_3.5_audioapp_ui.jpg)\n\
  \n图 73-1\n\n## 73.6 检查麦克风可用性\n\n在没有麦克风的设备上尝试录制音频会导致 Android 系统抛出异常。因此，代码在进行此类尝试之前检查麦克风的存在至关重要。实现此目的多种方法，包括检查设备的物理存在。一种更简单且可能在不同\
  \ Android 设备上有效的方法是询问 Android 系统是否安装了特定功能的包。这涉及创建一个 `Android PackageManager` 类的实例，然后调用该对象的\
  \ `hasSystemFeature()` 方法。`PackageManager.FEATURE_MICROPHONE` 是本例中关注的功能。\n\n为了本示例，我们将创建一个名为\
  \ `hasMicrophone()` 的方法，可以通过调用来检查麦克风的存在。在 Project 工具窗口中，找到并双击 `MainActivity.java`\
  \ 文件，修改它以添加此方法：\n\n```java\npackage com.ebookfrenzy.audioapp;\n\n.\n\n.\n\nimport\
  \ android.content.pm.PackageManager;\n\n.\n\n.\n\npublic class MainActivity extends\
  \ AppCompatActivity {\n\n.\n\n.\n    protected boolean hasMicrophone() {\n     \
  \   PackageManager pmanager = this.getPackageManager();\n        return pmanager.hasSystemFeature(\n\
  \                PackageManager.FEATURE_MICROPHONE);\n    }\n}\n```\n\n## 73.7 初始化\
  \ Activity\n\n下一步是修改活动以执行若干初始化任务。留在 `MainActivity.java` 文件中，按如下修改代码：\n\n```java\n\
  package com.ebookfrenzy.audioapp;\n\nimport java.io.File;\nimport java.io.IOException;\n\
  import androidx.annotation.NonNull;\nimport android.media.MediaRecorder;\nimport\
  \ android.os.Environment;\nimport android.media.MediaPlayer; \n\n.\n\n.\n\npublic\
  \ class MainActivity extends AppCompatActivity {\n    private ActivityMainBinding\
  \ binding;\n    private static MediaRecorder mediaRecorder;\n    private static\
  \ MediaPlayer mediaPlayer;\n    private static String audioFilePath;\n    private\
  \ boolean isRecording = false;\n\n    @Override\n    protected void onCreate(Bundle\
  \ savedInstanceState) {\n        super.onCreate(savedInstanceState);\n        binding\
  \ = ActivityMainBinding.inflate(getLayoutInflater());\n        View view = binding.getRoot();\n\
  \        setContentView(view);\n        audioSetup();\n    }\n    private void audioSetup()\
  \ {\n        if (!hasMicrophone()) {\n            binding.stopButton.setEnabled(false);\n\
  \            binding.playButton.setEnabled(false);\n            binding.recordButton.setEnabled(false);\n\
  \        } else {\n            binding.playButton.setEnabled(false);\n         \
  \   binding.stopButton.setEnabled(false);\n        }\n        File audioFile = new\
  \ File(this.getFilesDir(), \"myaudio.3gp\");\n        audioFilePath = audioFile.getAbsolutePath();\n\
  \    }\n.\n```\n\n添加的代码调用 `hasMicrophone()` 来确定设备是否包含麦克风。如果没有，所有按钮都将被禁用；否则只禁用 Stop\
  \ 和 Play 按钮。下一行代码需要解释：`File audioFile = new File(this.getFilesDir(), \"myaudio.3gp\"\
  );` 在设备文件目录下创建一个名为 `myaudio.3gp` 的文件用于存储音频。\n\n## 73.8 实现 recordAudio() 方法\n\n当用户点击\
  \ Record 按钮时，将调用 `recordAudio()` 方法。该方法需要启用和禁用相应的按钮，并配置 `MediaRecorder` 实例设置音频源、输出格式以及存储音频的位置。最后，需要调用\
  \ `MediaRecorder` 对象的 `prepare()` 和 `start()` 方法。这些要求共同形成了 `MainActivity.java` 文件中的以下方法：\n\
  \n```java\npublic void recordAudio (View view)\n{\n    isRecording = true;\n   \
  \ binding.stopButton.setEnabled(true);\n    binding.playButton.setEnabled(false);\n\
  \    binding.recordButton.setEnabled(false);\n    try {\n        mediaRecorder =\
  \ new MediaRecorder(this);\n        mediaRecorder.setAudioSource(MediaRecorder.AudioSource.MIC);\n\
  \        mediaRecorder.setOutputFormat(\n                MediaRecorder.OutputFormat.THREE_GPP);\n\
  \        mediaRecorder.setOutputFile(audioFilePath);\n        mediaRecorder.setAudioEncoder(MediaRecorder.AudioEncoder.AMR_NB);\n\
  \        mediaRecorder.prepare();\n    } catch (Exception e) {\n        e.printStackTrace();\n\
  \    }\n    mediaRecorder.start();\n}\n```\n\n## 73.9 实现 stopAudio() 方法\n\n`stopAudio()`\
  \ 方法负责启用 Play 按钮、禁用 Stop 按钮，然后停止并重置 `MediaRecorder` 实例。实现此点的代码如下列表所示，并应添加到 `MainActivity.java`\
  \ 文件中：\n\n```java\npublic void stopAudio (View view)\n{\n    binding.stopButton.setEnabled(false);\n\
  \    binding.playButton.setEnabled(true);\n    if (isRecording)\n    {\n       \
  \ binding.recordButton.setEnabled(false);\n    }\n}\n```\n\n\n\n\n\n```java\nmediaRecorder.stop();\n\
  mediaRecorder.release();\nmediaRecorder = null;\nisRecording = false;\n} else {\n\
  \    mediaPlayer.release();\n    mediaPlayer = null;\n    binding.recordButton.setEnabled(true);\n\
  }\n```\n\n### 73.10 实现 `playAudio()` 方法\n\n`playAudio()` 方法简单地创建一个新的 `MediaPlayer`\
  \ 实例，将位于 SD 卡上的音频文件指定为数据源，然后准备并开始播放：\n\n```java\npublic void playAudio (View view)\
  \ throws IOException\n{\n    binding.playButton.setEnabled(false);\n    binding.recordButton.setEnabled(false);\n\
  \    binding.stopButton.setEnabled(true);\n    mediaPlayer = new MediaPlayer();\n\
  \    mediaPlayer.setDataSource(audioFilePath);\n    mediaPlayer.prepare();\n   \
  \ mediaPlayer.start();\n}\n```\n\n### 73.11 配置和请求权限\n\n在测试应用程序之前，必须在清单文件（manifest\
  \ file）中请求适当的权限。具体而言，应用程序需要访问麦克风的权限。在 Project 工具窗口中，找到并双击 `AndroidManifest.xml`\
  \ 文件以将其加载到编辑器中，并修改 XML 以添加权限标签：\n\n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"\
  ?>\n<manifest xmlns:android=\"http://schemas.android.com/apk/res/android\"\n   \
  \ package=\"com.ebookfrenzy.audioapp\" >\n    <uses-permission android:name=\"android.permission.RECORD_AUDIO\"\
  \ />\n    <application\n.\n.\n```\n\n上述步骤足以确保当该程序在运行 Android 6.0 之前的版本的设备上安装时，用户会启用麦克风访问权限。在\
  \ Android 中，麦克风访问被归类为“危险权限”，因为它可以让应用程序可能损害用户的隐私。因此，为了让示例应用程序在 Android 6 或更高版本的设备上运行，需要添加代码在应用程序运行时专门地请求权限。\n\
  \n编辑 `MainActivity.java` 文件，首先添加一些额外的导入指令和常量，作为所请求权限的请求识别码：\n\n```java\n.\n.\nimport\
  \ androidx.core.app.ActivityCompat;\nimport androidx.core.content.ContextCompat;\n\
  import android.widget.Toast;\nimport android.Manifest;\n.\n.\npublic class MainActivity\
  \ extends AppCompatActivity {\n    private static final int RECORD_REQUEST_CODE\
  \ = 101;\n.\n.\n```\n\n接下来，需要在类中添加一个方法，其目的是将要请求的权限和相应的请求识别码作为参数。在 `MainActivity.java`\
  \ 类文件中，按照如下方式实现此方法：\n\n```java\nprotected void requestPermission(String permissionType,\
  \ int requestCode) {\n    int permission = ContextCompat.checkSelfPermission(this,\n\
  \            permissionType);\n    if (permission != PackageManager.PERMISSION_GRANTED)\
  \ {\n        ActivityCompat.requestPermissions(this,\n                new String[]{permissionType},\
  \ requestCode\n        );\n    }\n}\n```\n\n使用本书书中[“在 Android 中进行运行时权限请求”(#Permission_Requests.xhtml__idTextAnchor1169)章节中概述的步骤，上述方法在发出请求之前验证指定的权限是否已经获得授予，并将识别码作为参数传递。\n\
  \n当请求处理完毕后，将在 Activity 上调用 `onRequestPermissionsResult()` 方法，并传递识别码和请求结果。因此，下一步是在\
  \ `MainActivity.java` 文件中按照如下方式实现此方法：\n\n```java\n@Override\npublic void onRequestPermissionsResult(int\
  \ requestCode,\n        @NonNull String[] permissions, @NonNull int[] grantResults)\
  \ {\n    super.onRequestPermissionsResult(requestCode, permissions, grantResults);\n\
  \    if (requestCode == RECORD_REQUEST_CODE) {\n        if (grantResults.length\
  \ == 0\n                || grantResults[0] != PackageManager.PERMISSION_GRANTED)\
  \ {\n            binding.recordButton.setEnabled(false);\n            Toast.makeText(this,\
  \ \"Permission required\", Toast.LENGTH_LONG).show();\n        }\n    }\n}\n```\n\
  \n在测试应用程序之前，剩下的只需调用新添加的 `setup()` 方法。在 `MainActivity.java` 中，按照如下方式修改 `setup()`：\n\
  \n```java\nprivate void setup(){\n    binding.recordButton = findViewById(R.id.recordButton);\n\
  \    binding.playButton = findViewById(R.id.playButton);\n    binding.stopButton\
  \ = findViewById(R.id.stopButton);\n    if (!hasMicrophone())\n    {\n        binding.stopButton.setEnabled(false);\n\
  \        binding.playButton.setEnabled(false);\n        binding.recordButton.setEnabled(false);\n\
  \    } else {\n        File audioFile = new File(this.getFilesDir(), \"myaudio.3gp\"\
  );\n        audioFilePath = audioFile.getAbsolutePath();\n        requestPermission(Manifest.permission.RECORD_AUDIO,\
  \ RECORD_REQUEST_CODE);\n    }\n}\n```\n\n### 73.12 测试应用程序\n\n在带有麦克风的 Android 设备上编译并运行应用程序，允许麦克风访问并点击\
  \ Record（录音）。录音完成后，触摸 Stop（停止）然后 Play（播放），此时录制的音频应通过设备扬声器播放。\n\n### 73.13 总结\n\n\
  Android SDK 提供了许多实现音频录制和播放的机制。本章查看了其中两种，即 `MediaPlayer` 和 `MediaRecorder`。在涵盖了使用这些技术的理论后，本章通过创建一个示例应用程序来录制并播放音频。在处理\
  \ Android 下的音频过程中，本章还查看了确保运行应用程序的设备具有麦克风以尝试录音的步骤。\n\n### 74. 在 Android Studio 中使用\
  \ Google Maps Android API\n\n当 Google 许多年前决定推出地图服务时，很难说他们是否预见到过会有可以集成到应用程序中的版本。当最终被称为\
  \ Google Maps 的第一个 Web 版本在 2005 年发布时，iPhone 尚未引发智能手机革命，开发 Android 操作系统的公司在六个月后才被\
  \ Google 收购。无论 Google 对 Google Maps 的未来有什么愿景，现在可以通过 Google Maps Android API 直接在\
  \ Android 应用程序中访问所有功能，令人叹。\n\n本章旨在提供 Google Maps 系统和 Google Maps Android API 的概述。本章将概述组成\
  \ API 的不同元素，详细说明配置用于处理 Google Maps 开发环境所需的步骤，然后通过代码示例演示 Google Maps 集成的一些基础知识。\n\
  \n### 74.1 Google Maps Android API 的元素\n\nGoogle Maps Android API 由一组核心类组成，这些类组合为\
  \ Android 应用程序提供地图功能。地图的关键元素如下：\n\n\n\n\n\n- `GoogleMap` – Google Maps Android API\
  \ 的主类。该类负责下载和显示地图瓦片，并显示和响应地图控件。`GoogleMap` 对象不是直接由应用程序创建的，而是在创建 `MapView` 或 `MapFragment`\
  \ 实例时创建的。在应用程序代码中可以通过调用 `MapView`、`MapFragment` 或 `SupportMapFragment` 实例的 `getMap()`\
  \ 方法获取 `GoogleMap` 引用。\n- `MapView` - `View` 类的子类，该类提供了视图画布，`GoogleMap` 对象在其上绘制地图，允许将地图放置在\
  \ Activity 的用户界面布局中。\n- `SupportMapFragment` – `Fragment` 类的子类，该类允许将地图放置在 Android\
  \ 布局的 `Fragment` 中。\n- `Marker` – `Marker` 类的作用允许在地图上标记位置。通过获取与地图关联的 `GoogleMap`\
  \ 对象引用，然后调用该对象实例的 `addMarker()` 方法，可以将标记添加到地图中。标记的位置通过 `Longitude`（经度）和 `Latitude`（纬度）定义。可以通过多种方式配置标记，包括指定标题、文本和图标。标记还可以被设置为“可拖拽”，允许用户将标记移动到地图上的不同位置。\n\
  - `Shapes` – 在地图上绘制线条和形状是通过使用 `Polyline`、`Polygon` 和 `Circle` 类实现的。\n- `UiSettings`\
  \ – `UiSettings` 类提供了从应用程序内部控制地图上显示的用户界面控件的功能。例如，使用该类应用程序可以控制缩放、当前位置和罗盘控件是否显示在地图上。该类还可以用于配置地图识别哪些触摸屏手势。\n\
  - `My Location Layer` – 启用后，“我的位置层”会在地图上显示一个按钮，用户选择该按钮时，地图将中心位于用户当前的地理位置。如果用户静止，地图上将用一个蓝色标记表示该位置。如果用户正在移动，该位置将用一个指示用户行驶方向的箭头表示。\n\
  \n熟悉 Google Maps Android API 的最佳方法是运行示例。本章的剩余部分将创建一个基于 Google Maps 的应用程序，同时突出 API\
  \ 的关键领域。\n\n## 74.2 创建 Google Maps 项目\n\n从欢迎界面选择“New Project”（新建项目）选项，在生成的新项目对话框中，在点击“Next”（下一步）按钮之前，选择\
  \ Google Maps Activity 模板。\n\n在 `Name`（名称）字段中输入 `MapDemo` 并指定 `com.ebookfrenzy.mapdemo`\
  \ 为包名。在点击“Finish”（完成）按钮之前，将 Minimum API level（最低 API 级别）设置为 `API 26`：Android 8.0\
  \ (Oreo)，并将语言菜单设置为 `Java`。\n\n## 74.3 创建 Google Cloud 结算账户\n\n在使用 Google Map APIs\
  \ 之前，你必须先创建一个 Google Cloud 结算账户（除非你已经有一个，可以跳到下一节）。要执行此操作，打开浏览器并使用以下链接导航到 Google\
  \ Cloud 控制台：\n\n`https://console.cloud.google.com/`\n\n接下来，点击控制台页面左角的菜单按钮，并选择 `Billing`（结算）项，如下图\
  \ 74-1 所示：\n\n![](img/google_cloud_billing.jpg)\n\n图 74-1\n\n在结算页面上，选择添加新结算账户的选项，然后按照步骤开始免费试用。你需要提供信用卡来开账户，但未经你的同意，免费试用结束时\
  \ Google 不会收取费用。\n\n## 74.4 创建新的 Google Cloud 项目\n\n下一步是创建一个与 `MapDemo` 应用关联的 Google\
  \ Cloud 项目。要执行此操作，使用以下 URL 返回 Google Cloud 控制台仪表板：\n\n`https://console.cloud.google.com/home/dashboard`\n\
  \n在仪表板中，点击顶部工具栏上的 `Select a project`（选择项目）按钮：\n\n![](img/google_cloud_select_project.jpg)\n\
  \n图 74-2\n\n当项目选择对话框出现时，点击 `New Project`（新建项目）按钮（如图 74-3 所示）：\n\n![](img/google_cloud_new_project_button.jpg)\n\
  \n图 74-3\n\n当出现新项目屏幕时，为项目提供一个名称。控制台将在项目名称字段下方显示项目的默认 ID。如果你不喜欢默认 ID，点击 `Edit`（编辑）按钮来更改它：\n\
  \n![](img/google_cloud_new_project_dialog.jpg)\n\n图 74-4\n\n点击 `Create`（创建）按钮，稍等片刻，你将返回仪表板，你的新项目将列在其中。\n\
  \n## 74.5 启用 Google Maps SDK\n\n现在我们已经创建了新的 Google Cloud 项目，下一步是允许项目使用 Google Maps\
  \ SDK。要启用 Google Maps 支持，在 Google Cloud 控制台中选择你的项目，点击左上角的菜单按钮并选择 `Google Maps Platform`\
  \ 项。然后，从生成的菜单中选择 `APIs` 选项，如图 74-5 所示：\n\n![](img/google_cloud_apis_menu.jpg)\n\n\
  图 74-5\n\n在 APIs 屏幕上，点击 `Maps SDK for Android` 选项，并在屏幕上点击 `Enable`（启用）按钮：\n\n![](img/google_cloud_enable.jpg)\n\
  \n图 74-6\n\n重复上述步骤启用 `Geocoding API` 凭据，我们需要它来显示用户的位置。\n\n一旦为项目启用了凭据，点击返回箭头返回产品详情页以准备下一步。\n\
  \n## 74.6 生成 Google Maps API 密钥\n\n在应用程序使用 Google Maps SDK 之前，它必须配置一个关联到 Maps Google\
  \ Cloud 项目的 API 密钥。要生成 API 密钥，选择 74-7 中的 `Credentials`（凭据）菜单，然后点击 `Create Credentials`：\n\
  \n![](img/google_cloud_credentials.jpg)\n\n图 74-7\n\n凭据创建后，将出现显示 API 密钥的对话框。在关闭\
  \ API 对话框之前复制密钥：\n\n![](img/google_console_api_key_created.jpg)\n\n图 74-8\n\n##\
  \ 74.7 将 API 密钥添加到 Android Studio 项目\n\n现在我们已经生成了应用程序所需的密钥，我们需要将其添加到项目中。返回 Android\
  \ Studio，编辑 `manifests` -> `AndroidManifest.xml` 文件并找到 API 密钥项，其内容如下：\n\n```xml\n\
  <meta-data\n    name=\"com.google.android.geo.API_KEY\"\n    value=\"YOUR_API_KEY\"\
  \ />\n```\n\n删除文本 `YOUR_API_KEY` 并将其替换为在 Google 控制台中创建的密钥。\n\n接下来，编辑 `Gradle Scripts`\
  \ -> `local.properties` 文件并添加新行，内容如下（用你的项目密钥替换 `YOUR_API_KEY`）：\n\n```\nMAPS_API_KEY=YOUR_API_KEY\n\
  ```\n\n## 74.8 添加 Apache HTTP 遗留要求\n\n由于示例项目将为 Android 9.0 或更高版本构建，需要在 `AndroidManifest.xml`\
  \ 的 `<application>` 部分中添加以下声明：\n\n```xml\n<application\n    android:allowBackup=\"\
  true\"\n    android:dataExtractionRules=\"@xml/data_extraction_rules\"\n    android:fullBackupContent=\"\
  @xml/backup_rules\"\n    android:icon=\"@mipmap/ic_launcher\"\n    android:label=\"\
  @string/app_name\"\n    android:supportsRtl=\"true\"\n    android:theme=\"@style/Theme.MapDemo\"\
  \n    tools:targetApi=\"31\">\n\n    <uses-library\n        android:name=\"org.apache.http.legacy\"\
  \n        android:required=\"false\" />\n\n</application>\n```\n\n## 74.9 测试应用程序\n\
  \n\n\n\n\n运行应用程序进行测试以验证 API 密钥是否配置正确。假设配置正确，应用程序将运行并在屏幕上显示地图。\n\n如果没有显示地图，请检查以下区域：\n\
  \n*   如果应用程序运行在模拟器上，请确保该模拟器运行的是包含 Google APIs 的 Android 版本。可以通过选择 `Tools` -> `Android`\
  \ -> `AVD Manager` 菜单选项来更改 AVD 配置的操作系统：点击 AVD `Actions` 列中的铅笔图标，然后点击当前 Android 版本旁边的\
  \ `Change…` 按钮。在系统镜像对话框中，选择一个包含 Google APIs 的目标。\n*   检查 `Logcat` 输出，查看是否有任何与 Google\
  \ Maps API 身份验证相关的问题。这通常意味着 API 密钥输入错误。请确保 `AndroidManifest.xml` 和 `local.properties`\
  \ 文件中的 API 密钥与 Google Cloud 控制台中生成的密钥匹配。\n*   在 Google API 控制台中验证是否在 `Credentials`\
  \ 凭面板中启用了适用于 Android 的 Maps SDK。\n\n## 74.10 理解地理编码和反向地理编码\n\n如果不先介绍地理编码（Geocoding）这一主题，就无法谈论地图和地理位置。地理编码可以被描述为将基于文本的地理位置（如街道地址）转换为以经度和度表示的地理坐标的过程。\n\
  \n可以使用 Android 的 `Geocoder` 类来实现地理编码。例如，可以向 `Geocoder` 类的实例传递一个表示位置的字符串，例如城市名称、街道地址或机场代码。`Geocoder`\
  \ 将尝试为该位置找到一个匹配项，并返回一个 `Address` 对象列表，这些对象可能与位置字符串匹配，并按顺序排序，最匹配的位于列表的第 0 位。然后可以从\
  \ `Address` 对象中提取各种信息，包括潜在匹配项的经度和度。\n\n例如，以下代码请求了华盛顿特区国家航空太空博物馆的位置：\n\n```java\n\
  import java.io.IOException;\nimport java.util.List;\nimport android.location.Address;\n\
  import android.location.Geocoder;\n\n.\n.\n\ndouble latitude;\ndouble longitude;\n\
  List<Address> geocodeMatches = null;\n\ntry {\n    geocodeMatches =\n        new\
  \ Geocoder(this).getFromLocationName(\n            \"600 Independence Ave SW, Washington,\
  \ DC 20560\", 1);\n} catch (IOException e) {\n    // TODO Auto-generated catch block\n\
  \    e.printStackTrace();\n}\n\nif (!geocodeMatches.isEmpty()) {\n    latitude =\
  \ geocodeMatches.get(0).getLatitude();\n    longitude = geocodeMatches.get(0).getLongitude();\n\
  }\n```\n\n注意，值 `1` 被作为第二个参数传递给 `getFromLocationName()` 方法。这仅仅是告诉 `Geocoder` 在数组中只返回一个结果。鉴于提供的地址的特定性质，应该只有一个潜在的匹配项。然而，对于较模糊的位置名称，可能需要请求更多的潜在匹配项并允许用户选择正确的项。\n\
  \n上面的代码是正向地理编码的示例，因为它是根据文本位置描述计算坐标的。反向地理编码（Reverse-geocoding）顾其实名，涉及将地理坐标翻译为人类可读的地址字符串。请考虑以下代码：\n\
  \n```java\nimport java.io.IOException;\nimport java.util.List;\nimport android.location.Address;\n\
  import android.location.Geocoder;\n\n.\n.\n\nList<Address> geocodeMatches = null;\n\
  String Address1;\nString Address2;\nString State;\nString Zipcode;\nString Country;\n\
  \ntry {\n    geocodeMatches =\n        new Geocoder(this).getFromLocation(38.8874245,\
  \ -77.0200729, 1);\n} catch (IOException e) {\n    // TODO Auto-generated catch\
  \ block\n    e.printStackTrace();\n}\n\nif (!geocodeMatches.isEmpty()) {\n    Address1\
  \ = geocodeMatches.get(0).getAddressLine(0);\n    Address2 = geocodeMatches.get(0).getAddressLine(1);\n\
  \    State = geocodeMatches.get(0).getAdminArea();\n    Zipcode = geocodeMatches.get(0).getPostalCode();\n\
  \    Country = geocodeMatches.get(0).getCountryName();\n}\n```\n\n在这种情况下，`Geocoder`\
  \ 对象通过 `getFromLocation()` 方法使用经度和度值初始化。同样，只请求了单个匹配结果。然后从生成的 `Address` 对象中提取基于文本的地址信息。\n\
  \n注意的是，地理编码实际上并不是在 Android 设备上执行的，而是在服务器上执行的，当需要翻译时设备连接到该服务器并在翻译完成后返回结果。因此，地理编码只有在设备具有活动互联网连接时才能发生。\n\
  \n## 74.11 为应用程序添加地图\n\n向应用程序添加地图最简单的方法是在 activity 的用户界面布局 XML 文件指定指定。下面的示例布局文件显示了由\
  \ Android Studio 创建的 `activity_maps.xml` 文件添加的 `SupportMapFragment` 实例：\n\n```xml\n\
  <fragment xmlns:android=\"http://schemas.android.com/apk/res/android\"\n    xmlns:tools=\"\
  http://schemas.android.com/tools\"\n    android:layout_width=\"match_parent\"\n\
  \    android:layout_height=\"match_parent\"\n    android:id=\"@+id/map\"\n    tools:context=\"\
  .MapsActivity\"\n    android:name=\"com.google.android.maps.SupportMapFragment\"\
  />\n\n## 74.12 请求当前位置\n\n正如“运行时请求”章节所述，某些权限是危险的，对于 Android 6.0 或更高版本需要特殊处理。一组权限允许应用程序识别用户的位置。编辑\
  \ `app` -> `manifests` 下的 `AndroidManifest.xml` 文件并添加以下权限行：\n\n```xml\n<uses-permission\
  \ android:name=\"android.permission.ACCESS_FINE_LOCATION\" />\n<uses-permission\
  \ android:name=\"android.permission.ACCESS_COARSE_LOCATION\" />\n```\n\n这些设置将确保在安装在旧版本\
  \ Android 上提供位置信息。然而，为了支持 Android 6.0，我们需要在 `MapsActivity.java` 文件中添加代码以请求此权限。\n\
  \n首先添加一些导入指令和一个作为请求代码的常量：\n\n```java\npackage com.ebookrenzy.map;\n\n.\n.\n\nimport\
  \ androidx.annotation.NonNull;\nimport androidx.core.content.ContextCompat;\nimport\
  \ androidx.core.app.ActivityCompat;\nimport android.Manifest;\nimport android.widget.Toast;\n\
  import android.content.pm.PackageManager;\n\n.\n.\n\npublic class MapsActivity extends\
  \ FragmentActivity implements OnMapReadyCallback {\n    private static final int\
  \ LOCATION_REQUEST_CODE = 101;\n    private GoogleMap mMap;\n.\n.\n}\n```\n\n接下来，需要在类中添加一个方法向用户请求指定的权限。在\
  \ `MapsActivity.java` 类文件中，按如下方式实现该方法：\n\n```java\nprotected void requestPermission(String\
  \ permissionType, int requestCode) {\n    ActivityCompat.requestPermissions(this,\
  \ new String[]{permissionType}, requestCode);\n}\n```\n\n当用户对权限请求响应后，`onRequestPermissionsResult()`\
  \ 方法将在活动上调用。在 `MapsActivity.java` 文件中现在实现此方法，使其内容如下：\n\n```java\n@Override\npublic\
  \ void onRequestPermissionsResult(int requestCode, @NonNull String[] permissions,\
  \ @NonNull int[] grantResults) {\n    super.onRequestPermissionsResult(requestCode,\
  \ permissions, grantResults);\n    if (requestCode == LOCATION_REQUEST_CODE) {\n\
  \        if (grantResults.length == 0 || grantResults[0] != PackageManager.PERMISSION_GRANTED)\
  \ {\n```\n\n\n\n\n```java\n        PackageManager.PERMISSION_GRANTED) {\n\n    \
  \        Toast.makeText(this,\n                        \"Unable to show location\
  \ - permission required\",\n                        Toast.LENGTH_LONG).show();\n\
  \n        } else {\n            SupportMapFragment mapFragment =\n             \
  \       (SupportMapFragment) getSupportFragmentManager()\n                     \
  \       .findFragmentById(R.id.map);\n            mapFragment.getMapAsync(this);\n\
  \        }\n}\n```\n\n如果用户未授予权限，应用程序将显示一条消息，指示无法显示当前位置。相反，如果授予了权限，地图将进行刷新，为显示位置标记提供机会。\n\
  \n## 74.13 显示用户的当前位置\n\n一旦获得了适当的权限，可以通过获取与显示的地图关联的 `GoogleMap` 对象引用，并调用该实例的 `setMyLocationEnabled()`\
  \ 方法（传入 `true` 值），从而在地图上显示用户的当前位置。\n\n当地图准备好显示时， activity 的 `onMapReady()` 方法会被调用。当地图在上述\
  \ `onRequestPermissionsResult()` 方法中进行刷新时，该方法也会被调用。默认情况下，Android Studio 已经实现了此方法并添加了一些代码，将地图对准澳大利亚，并在悉尼市上方放置了一个标记。在\
  \ `MapsActivity.java` 文件中找到并编辑 `onMapReady()` 方法，删除此模板代码，并添加代码在显示用户当前位置之前检查是否授予位置权限。如果没有授予权限，将通过调用之前添加的\
  \ `requestPermission()` 方法向用户请求权限：\n\n```java\n@Override\npublic void onMapReady(GoogleMap\
  \ googleMap) {\n    mMap = googleMap;\n    // 在悉尼添加一个标记并移动相机\n    LatLng sydney\
  \ = new LatLng(-34, 151);\n    mMap.addMarker(new MarkerOptions().position(sydney).title(\"\
  Marker in Sydney\"));\n    mMap.moveCamera(CameraUpdateFactory.newLatLng(sydney));\n\
  \    if (mMap != null) {\n        int permission = ContextCompat.checkSelfPermission(this,\n\
  \                    Manifest.permission.ACCESS_FINE_LOCATION);\n        if (permission\
  \ == PackageManager.PERMISSION_GRANTED) {\n            mMap.setMyLocationEnabled(true);\n\
  \        } else {\n            requestPermission(\n                    Manifest.permission.ACCESS_FINE_LOCATION,\n\
  \                    LOCATION_REQUEST_CODE);\n        }\n    }\n}\n```\n\n当现在运行时应用程序，会出现图\
  \ 74-9 所示的对话框，请求位置权限。如果授予了权限，地图上将出现一个蓝点，指示设备的当前位置。\n\n![](img/as_map_permission.jpg)\n\
  \n图 74-9\n\n## 74.14 更改地图类型\n\n可以通过调用相应 `GoogleMap` 对象的 `setMapType()` 方法来动态修改显示的地图类型，并传入以下值之一：\n\
  \n- `GoogleMap.MAP_TYPE_NONE`: 无地图瓦片的的空网格。\n- `GoogleMap.MAP_TYPE_NORMAL`:由经典道路地图组成标准视图。\n\
  - `GoogleMap.MAP_TYPE_SATELLITE`: 显示地图区域的卫星图像。\n- `GoogleMap.MAP_TYPE_HYBRID`: 显示带有道路地图的卫星图像。\n\
  - `GoogleMap.MAP_TYPE_TERRAIN`: 显示等高线和颜色等地形信息。\n\n例如，对 `onMapReady()` 方法进行以下代码更改可以将地图切换到卫星模式：\n\
  \n```java\nif (mMap != null) {\n    int permission = ContextCompat.checkSelfPermission(this,\
  \ Manifest.permission.ACCESS_FINE_LOCATION);\n    if (permission == PackageManager.PERMISSION_GRANTED)\
  \ {\n        mMap.setMyLocationEnabled(true);\n    } else {\n        requestPermission(Manifest.permission.ACCESS_FINE_LOCATION,\
  \ LOCATION_REQUEST_CODE);\n    }\n    mMap.setMapType(GoogleMap.MAP_TYPE_SATELLITE);\n\
  }\n```\n\n或者，也可以在嵌入地图的 XML 布局文件中指定地图类型，使用 `map:mapType` 属性结合 `none`、`normal`、`hybrid`\
  \ 或 `terrain` 值。例如：\n\n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<fragment\
  \ xmlns:android=\"http://schemas.android.com/apk/res/android\"\n    xmlns:map=\"\
  http://schemas.android.com/apk/res-auto\"\n    android:id=\"@+id/map\"\n    android:layout_width=\"\
  match_parent\"\n    android:layout_height=\"match_parent\"\n    map:mapType=\"hybrid\"\
  \n    android:name=\"com.google.android.maps.SupportMapFragment\"/>\n```\n\n## 74.15\
  \ 向用户显示地图控件\n\nGoogle Maps Android API 提供了许多可以选择性显示给用户的控件，包括放大和缩小按钮、“我的位置”按钮和指南针。\n\
  \n是否显示缩放和指南针控件，可以通过编程方式或在 XML 资源中的地图元素进行控制。要通过编程配置控件，必须获取与 `GoogleMap` 对象关联的 `UiSettings`\
  \ 对象引用：\n\n```java\nimport com.google.android.maps.UiSettings;\n\nUiSettings mapSettings;\n\
  mapSettings = mMap.getUiSettings();\n```\n\n缩放控制通过调用 `UiSettings` 对象的 `setZoomControls()`\
  \ 方法来启用或禁用。例如：\n\n```java\nmapSettings.setZoomControls(true);\n```\n\n或者，可以在 XML\
  \ 资源文件中的地图元素设置 `map:uiZoomControls`：\n\n```xml\nmap:uiZoomControls=\"false\"\n```\n\
  \n指南针可以通过调用 `UiSettings` 实例的 `setCompassEnabled()` 方法或通过 XML 资源使用 `map:uiCompass`\
  \ 属性来显示。注意，指南针图标在地图相机倾斜或离开默认方向时才会出现。\n\n“我的位置”按钮只有在本章所述启用了我的位置模式时才会出现。可以通过调用 `UiSettings`\
  \ 实例的 `setMyLocationButtonEnabled()` 方法在该模式下防止按钮出现。\n\n## 74.16 处理地图交互\n\nGoogle\
  \ Maps Android API 能够响应多种不同的用户交互。这些交互可以用于更改显示的地图区域、缩放级别甚至视角（以便显示某些城市的 3D 表示）。\n\n\
  ### 74.16.1 地图缩放手势\n\n对于放大和缩小地图的手势支持可以使用与 `GoogleMap` 实例关联的 `UiSettings` 对象的方法来启用或禁用。例如，以下代码禁用了示例地图的缩放手势：\n\
  \n```java\nUiSettings mapSettings;\nmapSettings = map.getUiSettings();\nmapSettings.setZoomGesturesEnabled(false);\n\
  ```\n\n同样，可以在 XML 资源文件中设置 `map:uiZoomGestures` 属性来实现相同的结果。\n\n启用后，当用户在屏幕上进行捏合手势时，将进行缩放。同样，双击将放大，而双指轻击将缩小。单指缩放手势（另一只手）是通过轻击两次但不释放第二次轻击，然后在屏幕上上下滑动手指分别放大和缩小。\n\
  \n### 74.16.2 地图滚动/平移手势\n\n滚动或平移手势允许用户通过单指运动在屏幕上拖动地图移动。滚动手势可以通过调用 `UiSettings` 实例的\
  \ `setScrollGesturesEnabled()` 方法在代码中启用：\n\n```java\nUiSettings mapSettings;\nmapSettings\
  \ = mMap.getUiSettings();\nmapSettings.setScrollGesturesEnabled(true);\n```\n\n\
  或者，也可以在 XML 资源文件中使用 `map:uiScrollGestures` 属性启用地图实例的滚动。\n\n### 74.16.3 地图倾斜手势\n\n\
  \n\n\n倾斜手势允许用户通过在屏幕上放置两个手指并上下移动来调整地图投影的倾斜角度。可以通过调用 `UiSettings` 实例的 `setTiltGesturesEnabled()`\
  \ 方法来启用或禁用倾斜手势，例如：\n\n```java\nUiSettings mapSettings;\nmapSettings = mMap.getUiSettings();\n\
  mapSettings.setTiltGesturesEnabled(true);\n```\n\n也可以通过在 XML 布局资源文件中使用 `map:uiTiltGestures`\
  \ 属性来启用或禁用倾斜手势。\n\n## 74.16.4 地图旋转手势\n\n通过在屏幕上放置两个手指并进行圆形运动，用户在启用地图旋转手势时，可以旋转地图的朝向。这种手势支持可以通过代码中调用\
  \ `UiSettings` 实例的 `setRotateGesturesEnabled()` 方法来启用或禁用，例如：\n\n```java\nUiSettings\
  \ mapSettings;\nmapSettings = mMap.getUiSettings();\nmapSettings.setRotateGesturesEnabled(true);\n\
  ```\n\n也可以通过在 XML 布局资源文件中使用 `map:uiRotateGestures` 属性来启用或禁用旋转手势。\n\n## 74.17 创建地图标记\n\
  \n标记（Markers）用于通知用户地图上的位置，其形式可以是标准图标或自定义图标。标记还可以包含一个标题和可选的文本（称为片段，snippet），并可以配置为允许用户将其拖动到地图上的不同位置。当用户点击标记时，会弹出一个信息窗口（info\
  \ window），显示有关标记位置的额外信息。\n\n标记由 `Marker` 类的实例表示，并通过调用相应 `GoogleMap` 对象的 `addMarker()`\
  \ 方法添加到地图中。作为此方法的参数传递的是一个 `MarkerOptions` 类实例，该实例包含了标记所需的各种选项，例如标题和片段文本。标记的位置通过指定纬度和经度值定义，这些值也包含在\
  \ `MarkerOptions` 实例中。例如，以下代码在地图的特定位置添加了一个包含标题、片段和位置的标记：\n\n```java\nimport com.google.android.gms.maps.model.Marker;\n\
  import com.google.android.gms.maps.model.LatLng;\nimport com.google.android.gms.maps.model.MarkerOptions;\n\
  \n...\n\nLatLng position = new LatLng(38.8874245, -77.0200729);\nMarker museum =\
  \ mMap.addMarker(new MarkerOptions()\n        .position(position)\n        .title(\"\
  Museum\")\n        .snippet(\"National Air and Space Museum\"));\n```\n\n执行上述代码将标记指定的位置，当点击该位置时，将显示一个包含标题和片段的信息窗口，如图\
  \ 74-10 所示：\n\n![](img/Image24513.jpg)\n\n图 74-10\n\n## 74.18 控制地图相机\n\n由于 Android\
  \ 设备的屏幕是平面的，而地球是球体，Google Maps Android API 使用墨卡托投影（Mercator projection）在平面上表示地球。地图的默认视图就像是通过一个悬挂在地图上方并直接指向地图的相机呈现给用户的。Google\
  \ Maps Android API 允许在应用程序内部实时更改相机的目标、缩放比例（zoom）、方位角（bearing）和倾斜角（tilt）：\n\n- **目标（Target）**\
  \ – 地图在设备显示中的中心位置，以经纬度指定。\n- **缩放（Zoom）** – 以级别指定的相机缩放级别。将缩放级别增加 1.0 会使显示的地图区域宽度增加一倍。\n\
  - **倾斜（Tilt）** – 相机的视角角度，指定为跨越可视地图区域正上方的弧上的位置，从弧顶开始以度测量（弧顶是弧的最低点，相机在此直接指向地图）。\n\
  - **方位角（Bearing）** – 地图的朝向，以从北极开始顺时针方向的角度测量。\n\n相机的更改通过创建一个具有适当设置的 `CameraUpdate`\
  \ 类实例来实现。`CameraUpdate` 实例是通过调用 `CameraUpdateFactory` 类的方法来创建的。一旦创建了 `CameraUpdate`\
  \ 实例，就可以通过调用 `GoogleMap` 实例的 `moveCamera()` 方法将其应用到地图。为了在相机变化时获得平滑的动画效果，可以调用 `animateCamera()`\
  \ 方法代替 `moveCamera()`。\n\n`CameraUpdateFactory` 方法摘要如下：\n\n- `CameraUpdateFactory.zoomIn()`\
  \ – 提供一个放大一级的 `CameraUpdate` 实例。\n- `CameraUpdateFactory.zoomOut()` - 提供一个缩小一级的\
  \ `CameraUpdate` 实例。\n- `CameraUpdateFactory.zoomTo(float)` - 生成一个将缩放级别更改为指定值的 `CameraUpdate`\
  \ 实例。\n- `CameraUpdateFactory.zoomBy(float)` – 提供一个缩放级别按指定量增加或减少的 `CameraUpdate`\
  \ 实例。\n- `CameraUpdateFactory.zoomBy(float, Point)` - 创建一个按指定值增加或减少缩放级别的 `CameraUpdate`\
  \ 实例。\n- `CameraUpdateFactory.newLatLng(LatLng)` - 创建一个更改相机目标经纬度的 `CameraUpdate`\
  \ 实例。\n- `CameraUpdateFactory.newLatLngZoom(LatLng, float)` - 生成一个更改相机目标纬度、经度和缩放的\
  \ `CameraUpdate` 实例。\n- `CameraUpdateFactory.newCameraPosition(CameraPosition)`\
  \ - 返回一个移动到指定位置的 `CameraUpdate` 实例。\n\n\n\n\nAndroid 的打印功能由打印框架（Printing framework）提供。简单来说，该框架由一个\
  \ `Print Manager` 和多个打印服务插件组成。`Print Manager` 负责处理来自设备应用程序的打印请求，并与安装在设备上的打印服务插件进行交互，从而确保打印请求得到执行。默认情况下，许多\
  \ Android 设备都安装了打印服务插件，以便使用 `Google Cloud Print` 和 `Google Drive` 服务进行打印。其他类型打印机的打印服务插件（如果尚未安装）也可以从\
  \ `Google Play` 商店获取。目前打印服务插件已适用于 HP、爱普、三星和佳能打印机，其他打印机制造商的插件未来很可能会发布，尽管 `Google\
  \ Cloud Print` 服务插件也可以用于从 Android 设备打印到几乎任何类型和型号的打印机。出于本书的需要，我们将使用 `HP Print Services\
  \ Plugin` 作为参考示例。\n\n## 75.2 打印服务插件\n\n打印服务插件的目的是让应用程序能够打印到通过局域无线网络或蓝牙对 Android\
  \ 设备可见的兼容打印机。\n\n可以通过加载 `Google Play` 应用并搜索“Print Service Plugin”来验证 Android 设备上是否存在打印服务插件。一旦插件在\
  \ Play 商店中列出，如果插件尚未安装，可以通过选择 `Install` 按钮进行安装。例如，图 75-1 显示了 Google Play 中的 HP 打印服务插件。\n\
  \n打印服务插件将自动检测 Android 设备当前连接的网络上的兼容打印机，并在从应用程序打印时将它们列为选项。\n\n![](img/as_4.1_hp_printer_plugin.jpg)\n\
  \n图 75-1\n\n## 75.3 Google Cloud Print\n\nGoogle Cloud Print 是 Google 提供的一项服务，允许您从任何连接互联网的地方通过网络将内容打印到自己的打印机上。Google\
  \ Cloud Print 支持以云就（Cloud Ready）和经典（Classic）打印机形式形式的各种设备和打印机型号。`Cloud Ready`打印机内置了通过网络打印的技术。提供云就打印机的制造商包括得力、佳能、戴尔、爱普、HP、柯达和三星。要确定您的打印机是否同时支持云就并受\
  \ Google Cloud Print 支持，请查看以下 URL 上的打印机列表：\n\n[`www.google.com/cloudprint/learn/printers.html`](https://www.google.com/cloudprint/learn/printers.html)\n\
  \n对于经典的非云就绪打印机，Google Cloud Print 通过在连接到经典打印机的计算机系统（直接连接或通过家庭或办公室网络连接）上安装软件来提供云打印支持。\n\
  \n要设置 Google Cloud Print，请访问以下网页并使用与登录 Android 设备时相同的 Google 账户 ID 登录：\n\n[`www.google.com/cloudprint/learn/index.html`](https://www.google.com/cloudprint/learn/index.html)\n\
  \n一旦将打印机添加到您的 Google Cloud Print 账户，当您在设备上的 Android 应用程序中打印时，它们将列为打印目标选项。\n\n##\
  \ 75.4 打印到 Google Drive\n\n除了支持物理打印机外，还可以将打印输出保存到您的 Google Drive 账户中。从设备上打印时，在打印面板中选择\
  \ `Save to Google Drive` 选项。要打印的内容将被转换为 PDF 文件并保存到与设备上当前活动 Google 账户 ID 关联的 Google\
  \ Drive 云存储。\n\n## 75.5 保存为 PDF\n\nAndroid 提供的最终打印选项允许将打印内容作为 PDF 文件本地保存到 Android\
  \ 设备上。一旦选择此选项，系统将请求 PDF 文件的名称以及在设备上保存文档的位置。\n\n在测试自己的 Android 应用程序的打印功能时，`Save as\
  \ PDF` 和 `Google Drive` 选项在节约纸方面可能是无价的。\n\n## 75.6 从 Android 设备打印\n\nGoogle 建议提供打印内容功能的应用程序通过将打印选项放在溢出菜单（Overflow\
  \ menu）中。许多与 Android 绑定的应用程序现在都包含了“打印…” 菜单选项。例如，图 75-2 显示通过选择 Chrome 浏览器应用程序溢出菜单中的“共享…”\
  \ 选项来访问打印选项：\n\n![](img/as_3.5_chrome_print_option.jpg)\n\n图 75-2\n\n一旦在应用程序内选择了打印选项，将出现标准的\
  \ Android 打印屏幕，显示要打印内容的预览，如图 75-3 所示：\n\n![](img/as_3.5_chrome_print_panel.jpg)\n\
  \n图 75-3\n\n点击屏幕顶部的面板将显示完整的打印选项：\n\n![](img/as_3.5_save_as_pdf.jpg)\n\n图 75-4\n\n\
  Android 打印面板提供了常用的打印选项，如纸张大小、颜色、方向和副本数量。可以通过点击当前打印机或 PDF 输出选择来访问其他打印目标选项。\n\n##\
  \ 75.7 在 Android 应用中构建打印支持的选项\n\n打印框架为向 Android 应用程序集成打印支持提供了多种选项。这些选项可以分类如下：\n\n\
  ### 75.7.1 图像打印\n\n顾如名，此选项允许将图像打印集成到 Android 应用程序中。在应用程序添加此功能时，第一步是创建 `PrintHelper`\
  \ 类的一个新实例：\n\n```\nPrintHelper imagePrinter = new PrintHelper(context);\n```\n\n\
  接下来，可以通过调用 `PrintHelper` 实例的 `setScaleMode()` 方法指定打印图像的缩放模式。选项如下：\n\n- `SCALE_MODE_FIT`:图像将缩放以适应纸张大小，而不进行任何裁剪或更改比例。这通常会导致在一个维度上出现空白。\n\
  - `SCALE_MODE_FILL`:图像将缩放以填充纸张大小，并在必要时进行裁剪以避免出现空白。\n\n在没有设置缩放模式的情况下，系统默认使用 `SCALE_MODE_FILL`。例如，以下代码在之前声明的\
  \ `PrintHelper` 实例上将缩放设置为适应模式：\n\n```\nimagePrinter.setScaleMode(PrintHelper.SCALE_MODE_FIT);\n\
  ```\n\n同样，也可以配置颜色模式来指示打印输出是彩色还是黑白。这是通过向 `PrintHelper` 实例的 `setColorMode()` 方法传递以下选项之一实现的：\n\
  \n- `COLOR_MODE_COLOR`:指示图像将以彩色打印。\n- `COLOR_MODE_MONOCHROME`:指示图像将以黑白打印。\n\n除非如下指定单色选项，否则打印框架将默认为彩色打印：\n\
  \n```\nimagePrinter.setColorMode(PrintHelper.COLOR_MODE_MONOCHROME);\n```\n\n完成打印操作只需要要打印的图像并调用\
  \ `PrintHelper` 实例的 `printBitmap()` 方法，传递一个表示分配给打印任务名称的字符串以及图像引用（以 `Bitmap` 对象或图像的\
  \ `Uri` 引用的形式存在）：\n\n```\nBitmap bitmap = BitmapFactory.decodeResource(getResources(),\n\
       R.drawable.oceanscene);\n\nimagePrinter.printBitmap(\"My Test Print Job\",\
  \ bitmap);\n```\n\n一旦启动打印任务，打印框架将显示打印对话框并处理后续与用户的交互以及在用户选择的打印目标上打印图像。\n\n\n\n\n\n\
  # 75.7.2 创建并打印 HTML 内容\n\nAndroid 打印框架（Printing framework）还提供了一种从应用程序内部打印 HTML 内容的简单方法。这些内容可以是托管在网站上的页面\
  \ URL 引用的 HTML 内容，也可以是在应用程序内部动态创建的 HTML 内容。\n\n为了启用 HTML 打印，`WebView` 类已经过扩展，支持以极少的代码要求来实现打印功能。\n\
  \n在动态创建 HTML 内容时（与加载并打印现有网页不同），该过程涉及创建一个 `WebView` 对象并与其关联一个 `WebViewClient` 实例。然后，配置该\
  \ web view client，以便在 HTML 加载到 `WebView` 之后启动打印任务。在配置好 web view client 之后，HTML 会被加载到\
  \ `WebView` 中，此时就会触发打印过程。\n\n例如，考虑以下代码：\n\n```java\npublic void printContent()\n\
  {\n    WebView webView = new WebView(this);\n    webView.setWebViewClient(new WebViewClient()\
  \ {\n        public boolean shouldOverrideUrlLoading(WebView view,\n           \
  \         String url)\n        {\n            return false;\n        }\n       \
  \ @Override\n        public void onPageFinished(WebView view, String url) {\n  \
  \          createWebPrintJob(view);\n            myWebView = null;\n        }\n\
  \    });\n    String htmlDocument =\n        \"<html><body><h1>Android Print Test</h1><p>\"\
  \n        + \"This is some sample content.</p></body></html>\";\n    webView.loadDataWithBaseURL(null,\
  \ htmlDocument,\n                \"text/HTML\", \"UTF-8\", null);\n    myWebView\
  \ = webView;\n}\n```\n\n此方法 `printContent()` 首先声明了一个名为 `myWebView` 的变量，其中将存储方法中创建的\
  \ `WebView` 实例的引用。在 `printContent()` 方法内部，创建了一个 `WebView` 类的实例，并为其分配了一个 `WebViewClient`\
  \ 实例。\n\n分配给 web view 对象的 `WebViewClient` 被配置为指示 HTML 内容的加载将由 `WebView` 实例处理（通过从\
  \ `shouldOverrideUrlLoading()` 方法返回 `false`）。更重要的是，声明并实现了一个 `onPageFinished()` 处理器方法，用于调用名为\
  \ `createWebPrintJob()` 的方法。当所有 HTML 内容都加载到 web view 时，将自动调用 `onPageFinished()`\
  \ 回调方法。这确保了在内容准备绪之前不会启动打印任务，从而确保所有内容都能被打印。\n\n接下来，创建了一个包含某些 HTML 的字符串作为内容。然后将其加载到\
  \ web view 中。一旦 HTML 加载完成，`onPageFinished()` 方法就会被触发。最后，该方法存储了 web view 对象的引用。如果没有这一关键步骤，存在很大的风险，即\
  \ Java 运行时系统可能会认为应用程序不再需要 web view 对象并将其丢弃以释放内存（Java 术语中称为“垃圾回收”），从而导致打印任务在完成之前就终止。\n\
  \n此示例中，剩下的工作是按如下实现 `createWebPrintJob()` 方法：\n\n```java\nprivate void createWebPrintJob(WebView\
  \ webView) {\n    PrintManager printManager = (PrintManager) this.getSystemService(Context.PRINT_SERVICE);\n\
  \    PrintDocumentAdapter printAdapter = new MyDocumentAdapter();\n    String jobName\
  \ = getString(R.string.app_name) + \" Document\";\n    PrintJob printJob = printManager.print(jobName,\
  \ printAdapter, new PrintAttributes.Builder().build());\n}\n```\n\n该方法简单地获取了 `PrintManager`\
  \ 的引用，并指示了 `new MyDocumentAdapter()`。\n\n### 75.7.3 打印网页\n\n打印网页的步骤与上述概述的类似，不同在于向\
  \ web view 传递了 URL——`webView.loadUrl(\"https://developer.android.com/\")`。\n\n同样重要的是，只有当页面在加载时需要自动打印时，才需要配置\
  \ `WebViewClient`。如果打印是由用户选择菜单启动的，则只需要包含上述的 `createWebPrintJob()` 中的代码。下一章标题为“Android\
  \ HTML 和内容打印”，将演示这样一种场景。\n\n### 75.7.4 打印自定义文档\n\n虽然框架引入的 HTML 和图像功能为从应用程序内部打印内容提供了便利，但显而易见，对于更高级的需求，这些选项将过于简单。对于更复杂的打印任务，打印框架还提供了自定义文档支持。这允许将文本和图形形式的内容绘制在画布（canvas）上然后进行打印。\n\
  \n与较较实现的 HTML 和图像打印不同，自定义文档打印是一个更复杂、多阶段的过程，该过程将在本书的“Android 文档打印指南”章节中概述。这些步骤可以总结如下：\n\
  \n- 连接到 `PrintManager`\n- 创建继承自 `PrintDocumentAdapter` 类的 `CustomDocumentAdapter`\
  \ 子类\n- 创建一个 `PdfDocument` 实例来表示文档\n- 获取 `PdfDocument` 实例页面的引用，每个页面都关联着一个 `Canvas`\
  \ 实例\n- 在页面画布上绘制内容\n- 通知打印框架文档已准备好打印\n\n上述步骤中概述的自定义打印适配器需要实现许多方法，Android 系统将在打印过程中调用这些方法来执行特定任务。其中最重要的是\
  \ `onLayout()` 方法，它负责根据用户对纸张大小或页面方向等设置的更改重新安排文档布局；以及 `onWrite()` 方法，它负责渲染要打印的页面。此主题将在“Android\
  \ 文档打印指南”章节中详细介绍。\n\n### 75.8 总结\n\nAndroid SDK 包含了在运行的应用程序内部打印内容的能力。打印输出可以定向到配置适当的打印机、本地\
  \ PDF 文件或通过 Google Drive 到云端。从 Android 应用程序开发者的角度来看，通过使用打印框架可以在程序中使用这些功能。容易实现的打印选项是涉及图像和\
  \ HTML 格式的内容。\n\n\n\n\n\n如上一章标题“使用 Android 打印框架打印”(#Printing.xhtml__idTextAnchor1448)\
  \ 所述，Android 打印框架可以用于打印网页和动态创建的 HTML 内容。虽然这两种打印方法有许多相似之处，但也存在一些需要考虑的细微差异。本章将通过创建两个示例应用程序，对这两个打印选项提供清晰的说明。\n\
  \n# 76.1 创建 HTML 打印示例应用程序\n\n从欢迎界面选择 `New Project` 选项，在弹出的新项目对话框中，点击 `Next` 按钮之前，选择\
  \ `Empty Activity` 模板。\n\n在 `Name` 字段中输入 `HTMLPrint`，并指定 `com.ebookfrenzy.htmlprint`\
  \ 为包名。在点击 `Finish` 按钮之前，将 `Minimum API level` 设置为 `API 26`：`Android 8.0 (Oreo)`，并将\
  \ `Language` 菜单设置为 `Java`。\n\n# 76.2 打印动态 HTML 内容\n\n本教程的第一阶段是向项目添加代码以创建一些 HTML\
  \ 内容，并以打印任务的形式发送到打印框架。\n\n首先，找到 `MainActivity.java` 文件（位于 `Project` 工具窗口的 `app`\
  \ -> `java` -> `com.ebookfrenzy.htmlprint` 下），并将其加载到编辑面板。加载后，修改代码使其如下方的列表所示：\n\n\
  ```java\npackage com.ebookfrenzy.htmlprint;\n\nimport androidx.appcompat.app.AppCompatActivity;\n\
  \nimport android.os.Bundle;\n\nimport android.webkit.WebView;\nimport android.webkit.WebViewClient;\n\
  import android.webkit.WebResourceRequest;\n\nimport android.print.PrintAttributes;\n\
  \nimport android.print.PrintDocumentAdapter;\n\nimport android.print.PrintManager;\n\
  \nimport android.content.Context;\n\npublic class MainActivity extends AppCompatActivity\
  \ {\n\n    private WebView myWebView;\n\n    @Override\n    protected void onCreate(Bundle\
  \ savedInstanceState) {\n        super.onCreate(savedInstanceState);\n        setContentView(R.layout.activity_htmlprint);\n\
  \        printWebView();\n    }\n\n    private void printWebView() {\n        WebView\
  \ webView = new WebView(this);\n        webView.setWebViewClient(new WebViewClient()\
  \ {\n            public boolean shouldOverrideUrlLoading(WebView view,\n       \
  \                                            WebResourceRequest request) {\n   \
  \             return false;\n            }\n            @Override\n            public\
  \ void onPageFinished(WebView view, String url) {\n                createWebPrintJob(view);\n\
  \                myWebView = null;\n            }\n        });\n        String htmlDocument\
  \ =\n            \"<html><body><h1>Android Print Test</h1><p>\"\n            + \"\
  This is some sample content.</p></body></html>\";\n        webView.loadDataWithBaseURL(null,\
  \ htmlDocument,\n            \"text/HTML\", \"UTF-8\", null);\n        myWebView\
  \ = webView;\n    }\n}\n```\n\n代码更改从声明名为 `myWebView` 的变量开始，用于存储打印操作所需的 `WebView`\
  \ 实例引用。在 `printWebView()` 方法中，创建了 `WebView` 类的实例。\n\n使用了 `webView.setWebViewClient(new\
  \ WebViewClient())` 方法。分配 `WebViewClient` 实例处理页面加载。`shouldOverrideUrlLoading` 方法返回\
  \ `false`。`onPageFinished` 方法调用了 `createWebPrintJob(view)`并将 `myWebView` 设置为 `null`。定义了\
  \ `htmlDocument` 字符串并使用 `webView.loadDataWithBaseURL()` 加载。最后，将 `webView` 赋值给 `myWebView`。\n\
  \n`createWebPrintJob` 方法实现如下：\n\n```java\nprivate void createPrintJob(WebView webView)\
  \ {\n    PrintManager printManager = (PrintManager) getSystemService(Context.PRINT_SERVICE);\n\
  \    PrintDocumentAdapter printAdapter = webView.createDocumentAdapter(\"\");\n\
  \    String jobName = getString(R.string.app_name) + \" Print Test\";\n    printManager.print(jobName,\
  \ printAdapter, new PrintAttributes.Builder().build());\n}\n```\n\n`printManager`\
  \ 获取 `PrintManager` 服务的引用。通过 `webView.createDocumentAdapter(\"\")` 创建 `printAdapter`。根据应用名称创建\
  \ `jobName` 字符串。最后，调用 `print()` 方法并传入 `jobName`、`printAdapter` 和一组 `PrintAttributes`\
  \ 设置。\n\n# 76.3 创建网页打印示例\n\n在本章中创建的第二个示例应用程序将为用户提供一个溢出菜单（Overflow menu）选项，用于打印当前在\
  \ `WebView` 实例中显示的网页。\n\n从欢迎界面选择 `New Project` 选项，在弹出的新项目对话框中，点击 `Next` 按钮之前，选择\
  \ `Basic Activity` 模板。\n\n在 `Name` 字段中输入 `WebPrint`，并指定 `com.ebookfrenzy.webprint`\
  \ 为包名。在点击 `Finish` 按钮之前，将 `Minimum API level` 设置为 `API 26`：`Android 8.0 (Oreo)`，并将\
  \ `Language` 菜单设置为 `Java`。\n\n# 76.4 移除浮动按钮\n\n选择 `Basic Activity` 模板提供了上下文菜单和一个浮动按钮。由于该应用不需要浮动按钮，可以在继续操作之前将其移除。将\
  \ `activity_main.xml` 布局文件加载到 `Layout Editor`，选择浮动按钮并按 `Delete` 键从布局中删除该对象。编辑 `MainActivity.java`\
  \ 文件，从 `onCreate` 方法中移除浮动按钮代码，如下：\n\n```java\n@Override\nprotected void onCreate(Bundle\
  \ savedInstanceState) {\n    super.onCreate(savedInstanceState);\n    binding =\
  \ ActivityMainBinding.inflate(getLayoutInflater());\n    setContentView(binding.getRoot());\n\
  \    setSupportActionBar(binding.toolbar);\n    // Floating action button code removed\n\
  }\n```\n\n\n\n\n\n```java\nSnackbar.LENGTH_LONG)\n.setAction(\"Action\", null).show();\n\
  \n}\n});\n}\n```\n\n### 76.5 移除导航功能\n\n正如《Android Studio 布局编辑器工具指南中所述，Basic Activity\
  \ 模板包含多个片段（fragments）和按钮，用于在片段之间进行导航。对于本教程而言，这些功能是不必要的，如果不移除，稍后将会产生问题。在继续教程之前，请按照以下方式修改项目：\n\
  \n1. 在 Project 工具窗口中，导航并双击 `app -> res -> navigation -> nav_graph.xml` 文件，将其加载到导航编辑器中。\n\
  2. 在编辑器中，在图表面板中选择 `SecondFragment` 条，并按下键盘上的删除键将其从图中移除。\n3. 找到并删除 `SecondFragment.java`（`app\
  \ -> java -> <package name> -> SecondFragment`）和 `fragment_second.xml`（`app -> res\
  \ -> layout -> fragment_second.xml`）文件。\n4. 找到 `FirstFragment.java` 文件，双击将其加载到编辑器，并删除\
  \ `onViewCreated()` 方法中的代码，使其内容如下：\n\n```java\npublic void onViewCreated(@NonNull\
  \ View view, Bundle savedInstanceState) {\n    super.onViewCreated(view, savedInstanceState);\n\
  \    binding.buttonFirst.setOnClickListener(new View.OnClickListener() {\n     \
  \   @Override\n        public void onClick(View view) {\n            NavHostFragment.findNavController(FirstFragment.this)\n\
  \                    .navigate(R.id.action_FirstFragment_to_SecondFragment);\n \
  \       }\n    });\n}\n```\n5. 编辑 `MainActivity.java` 文件并移除以下导航代码：\n\n```java\n\
  @Override\nprotected void onCreate(Bundle savedInstanceState) {\n    super.onCreate(savedInstanceState);\n\
