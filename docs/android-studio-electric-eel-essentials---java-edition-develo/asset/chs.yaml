  \ 字段中输入 `Tab2Fragment` 并点击 OK。\n\n编辑 `Tab2Fragment.java` 文件并修改 `onCreateView()`\
  \ 方法以加载 `fragment_tab2` 布局：\n\n```java\n@Override\npublic View onCreateView(LayoutInflater\
  \ inflater, ViewGroup container, Bundle savedInstanceState) {\n    // 实例化此片段的布局\n\
  \    return inflater.inflate(R.layout.fragment_tab2, container, false);\n}\n```\n\
  \n再次执行上述复制步骤，为其余两个片段创建布局和类文件。完成这些步骤后，项目结构应匹配图 46-5：\n\n![](img/as_tab_layout_files.jpg)\n\
  \n图 46-5\n\n## 46.6 添加 TabLayout 和 ViewPager2\n\n片段创建过程完成后，下一步是在主活动布局文件中添加 `TabLayout`\
  \ 和 `ViewPager2`。编辑 `activity_main.xml` 文件并按照下方 XML 所示添加这些元素。注意 `TabLayout` 组件嵌入在\
  \ `AppBarLayout` 元素中，而 `ViewPager2` 放置在 `AppBarLayout` 之后：\n\n```xml\n<?xml version=\"\
  1.0\" encoding=\"utf-8\"?>\n```\n\n\n\n\n\n```xml\n<androidx.coordinatorlayout.widget.CoordinatorLayout\
  \ xmlns:android=\"http://schemas.android.com/apk/res/android\"\n    xmlns:app=\"\
  http://schemas.android.com/apk/res-auto\"\n    xmlns:tools=\"http://schemas.android.com/tools\"\
  \n    android:layout_width=\"match_parent\"\n    android:layout_height=\"match_parent\"\
  \n    tools:context=\".MainActivity\">\n    <com.google.android.material.appbar.AppBarLayout\n\
  \        android:layout_width=\"match_parent\"\n        android:layout_height=\"\
  wrap_content\"\n        android:theme=\"@style/Theme.TabLayoutDemo.AppBarOverlay\"\
  >\n        <androidx.appcompat.widget.Toolbar\n            android:id=\"@+id/toolbar\"\
  \n            android:layout_width=\"match_parent\"\n            android:layout_height=\"\
  ?attr/actionBarSize\"\n            android:background=\"?attr/colorPrimary\"\n \
  \           app:popupTheme=\"@style/Theme.TabLayoutDemo.PopupOverlay\" />\n    \
  \    <com.google.android.material.tabs.TabLayout\n            android:id=\"@+id/tabLayout\"\
  \n            android:layout_width=\"match_parent\"\n            android:layout_height=\"\
  wrap_content\"\n            app:tabMode=\"fixed\"\n            app:tabGravity=\"\
  fill\"/>\n    </com.google.android.material.appbar.AppBarLayout>\n    <androidx.viewpager2.widget.ViewPager2\n\
  \        android:id=\"@+id/view_pager\"\n        android:layout_width=\"match_parent\"\
  \n        android:layout_height=\"match_parent\"\n        app:layout_behavior=\"\
  @string/appbar_scrolling_view_behavior\" />\n    <include layout=\"@layout/content_main\"\
  \ />\n    <com.google.android.material.floatingactionbutton.FloatingActionButton\n\
  \        android:id=\"@+id/fab\"\n        android:layout_width=\"wrap_content\"\n\
  \        android:layout_height=\"wrap_content\"\n        android:layout_gravity=\"\
  bottom|end\"\n        android:layout_marginEnd=\"@dimen/fab_margin\"\n        android:layout_marginBottom=\"\
  16dp\"\n        app:srcCompat=\"@android:drawable/ic_dialog_email\" />\n</androidx.coordinatorlayout.widget.CoordinatorLayout>\n\
  ```\n\n## 46.7 创建 Pager 器\n\n本示例将使用 `ViewPager2` 方法来处理分配给 `TabLayout` 标签的 fragment。在布局资源文件中添加了\
  \ `ViewPager2` 后，需要向项目中添加一个子自 `FragmentStateAdapter` 的新类，用于管理用户选择标签项时显示的 fragment。\n\
  \n在 Project 工具窗口中右键点击 `com.ebookfrenzy.tablayoutdemo` 项，选择 `New -> Java Class` 菜单选项向项目添加新类。在新类对话框中，在\
  \ `Name:` 字段输入 `TabPagerAdapter`，选择列表中的 `Class` 项并按下回车键。\n\n编辑 `TabPagerAdapter.java`\
  \ 文件，使其内容如下：\n\n```java\npackage com.ebookfrenzy.tablayoutdemo;\n\nimport androidx.annotation.NonNull;\n\
  import androidx.fragment.app.*;\nimport androidx.viewpager2.adapter.FragmentStateAdapter;\n\
  \npublic class TabPagerAdapter extends FragmentStateAdapter {\n    int tabCount;\n\
  \    public TabPagerAdapter(@NonNull FragmentActivity fragmentActivity, int numberOfTabs)\
  \ {\n        super(fragmentActivity);\n        this.tabCount = numberOfTabs;\n \
  \   }\n    @NonNull\n    @Override\n    public Fragment createFragment(int position)\
  \ {\n        switch (position) {\n            case 0:\n                return new\
  \ Tab1Fragment();\n            case 1:\n                return new Tab2Fragment();\n\
  \            case 2:\n                return new Tab3Fragment();\n            case\
  \ 3:\n                return new Tab4Fragment();\n            default:\n       \
  \         return null;\n        }\n    }\n    @Override\n    public int getItemCount()\
  \ {\n        return tabCount;\n    }\n}\n```\n\n该类声明为扩展 `FragmentStateAdapter` 类，并实现了一个构造函数，允许在创建实例时将所需的页面数量传递给该类。当需要特定页面时将调用\
  \ `createFragment()` 方法。使用 `switch` 语句识别请求页码并返回相应的 fragment 实例。最后，`getItemCount()`\
  \ 方法简单返回创建对象实例时传递的计数。\n\n## 46.8 执行初始化任务\n\n剩余的任务涉及初始化 `TabLayout`、`ViewPager2`\
  \ 和 `TabPagerAdapter` 实例，并声明主活动类实现四个标签 fragment 的 fragment 监听器。编辑 `MainActivity.java`\
  \ 文件，使其内容如下：\n\n```java\npackage com.ebookfrenzy.tablayoutdemo;\n\nimport android.net.Uri;\n\
  import com.google.android.material.tabs.TabLayoutMediator;\n\npublic class MainActivity\
  \ extends AppCompatActivity implements\n    Tab1Fragment.OnFragmentInteractionListener,\n\
  \    Tab2Fragment.OnFragmentInteractionListener,\n    Tab3Fragment.OnFragmentInteractionListener,\n\
  \    Tab4Fragment.OnFragmentInteractionListener {\n    @Override\n    protected\
  \ void onCreate(Bundle savedInstanceState) {\n        configureTabLayout();\n  \
  \  }\n    protected void configureTabLayout() {\n        for (int i = 0; i < 4;\
  \ i++) {\n            binding.tabLayout.addTab(binding.tabLayout.newTab());\n  \
  \      }\n        final TabPagerAdapter adapter = new TabPagerAdapter\n        \
  \        (this, binding.tabLayout.getTabCount());\n        binding.viewPager.setAdapter(adapter);\n\
  \        new TabLayoutMediator(binding.tabLayout, binding.viewPager,\n         \
  \       (tab, position) -> tab.setText(\"Tab \" + (position + 1) + \" Item\")).attach();\n\
  \    }\n    @Override\n    public void onFragmentInteraction(Uri uri) {\n    }\n\
  }\n```\n\n代码首先创建四个标签并将它们添加到 `TabLayout` 中。接下来，创建一个 `TabPagerAdapter` 类的实例。注意创建 `TabPagerAdapter`\
  \ 实例的代码传递了分配给 `TabLayout` 的标签数量。然后将 `TabPagerAdapter` 实例设置为 `ViewPager2` 的适配器。最后，使用\
  \ `TabLayoutMediator` 类的实例连接 `TabLayout` 和 `ViewPager2` 对象。该类确保 `TabLayout` 标签与选中的\
  \ fragment 同步。一部分是确保每个标签显示正确的文本。在本例中，文本被配置为“Tab <n> Item”。\n\n## 46.9 测试应用程序\n\n\
  编译并在设备或模拟器上运行程序，确保选择标签会导致相应的 fragment 显示在屏幕内容区域：\n\n![](img/as_tab_layout_running.jpg)\n\
  \n图 46-5\n\n## 46.10 定制 TabLayout\n\n示例项目中的 `TabLayout` 使用固定模式配置。这种模式对于数量较少且标题较短的标签效果良好。在使用固定模式时，标签数量较多或标题较长很快就会出现问题，如图\
  \ 46-7 所示：\n\n![](img/as_4.1_tab_layout_truncated.jpg)\n\n图 46-7\n\n为了让标签适应可用的显示宽度，`TabLayout`\
  \ 使用了多行文本。尽管如此，第二行明显被截断，导致无法看到完整标题。解决此问题的方案是将 `TabLayout` 切换到可滚动模式。在这种模式下，标题以全长度单行格式显示，允许用户通过滑动水平滚动查看可用项，如图\
  \ 46-8 所示：\n\n![](img/as_4.1_tab_layout_scrollable.jpg)\n\n图 46-8\n\n\n\n\n\n要将\
  \ `TabLayout` 切换到滚动模式，只需将 `activity_main.xml` 布局资源文件中的 `app:tabMode` 属性从“fixed”（固定）改为“scrollable”（滚动）即可：\n\
  \n```xml\n<android.support.design.widget.TabLayout\n    android:id=\"@+id/tabLayout\"\
  \n    android:layout_width=\"match_parent\"\n    android:layout_height=\"wrap_content\"\
  \n    app:tabMode=\"scrollable\"\n    app:tabGravity=\"fill\"/>\n</android.support.design.widget.AppBarLayout>\n\
  ```\n\n在固定模式下，可以配置 `TabLayout` 控制标签项的显示方式以占据屏幕上的可用空间。这是通过 `app:tabGravity` 属性控制的，其结果在更宽的显示器（如横屏的平板电脑）上更为明显。例如，当设置为“fill”（填充）时，项目将如图\
  \ 46-9 所示均匀分布在 `TabLayout` 的宽度上：\n\n![](img/as_4.1_tab_layout_fill.jpg)\n\n图 46-9\n\
  \n将属性值更改为“center”（居中）会导致项目相对于标签栏的中心定位：\n\n![](img/as_4.1_tab_layout_center.jpg)\n\
  \n图 46-10\n\n### 46.11 总结\n\n`TabLayout` 是作为 Android Material 设计实现的一部分引入的组件之一。`TabLayout`\
  \ 组件的目的是展示一组标签项，这些项在被选中时会向用户显示不同的内容。标签项可以显示文本、图像或两者的结合。当与 `ViewPager2` 类和片段（fragments）结合使用时，可以轻松地创建标签布局，每个标签项的选择都会显示不同的片段。\n\
  \n### 47. 使用 RecyclerView 和 CardView 组件\n\n`RecyclerView` 和 `CardView` 组件共同工作，为用户提供可滚动的信息列表，其中信息以单个卡片的形式呈现。在深入研究示例项目的设计和实现之前，本章将介绍这两个类的详细信息。\n\
  \n#### 47.1 RecyclerView 概述\n\n与标题为使用悬浮操作按钮和 Snackbar”章节中概述的 `ListView` 类类似，`RecyclerView`\
  \ 的目的是允许以可滚动列表的形式向用户展示信息。然而，`RecyclerView` 相比 `ListView` 具有许多优势。特别是，`RecyclerView`\
  \ 在管理组成列表的视图方面效率高得多，它本质上是在列表项离开屏幕时复用构成列表项的现有视图，而不是创建新的视图（因此名为“recycler”，回收器）。这既提高了性能，又减少了列表使用的资源，该特性在向用户展示大量数据时特别有益。\n\
  \n与 `ListView` 不同，`RecyclerView` 还提供了三种内置布局管理器的选择，以控制列表项向用户呈现的方式：\n\n*   `LinearLayoutManager`\
  \ – 列表项以水平或垂直滚动列表的形式呈现。\n\n![](img/Image2427.jpg)\n\n图 47-1\n*   `GridLayoutManager`\
  \ – 列表项以网格格式呈现。当列表项大小相同时，使用此管理器效果最好。\n\n![](img/Image2436.jpg)\n\n图 47-2\n*   `StaggeredGridLayoutManager`\
  \ - 列表项以交错的网格格式呈现。当列表项大小不相同时，使用此管理器效果最好。\n\n![](img/Image2443.jpg)\n\n图 47-3\n\n\
  对于三种内置管理器都无法提供所需布局的情况，可以通过子类化 `RecyclerView.LayoutManager` 类来实现自定义布局管理器。\n\n在 `RecyclerView`\
  \ 中显示的每个列表项都是作为 `ViewHolder` 类的实例创建的。`ViewHolder` 实例包含了 `RecyclerView` 显示列表项所需的所有内容，包括要显示的信息和用于显示项的视图布局。\n\
  \n与 `ListView` 一样，`RecyclerView` 依赖于适配器（adapter）作为 `RecyclerView` 实例与要向用户显示的数据之间的中间介。适配器创建为\
  \ `RecyclerView.Adapter` 类的子类，并且至少实现以下方法，这些方法将由分配给适配器的 `RecyclerView` 对象在不同的时间点调用：\n\
  \n*   `getItemCount()` – 此方法必须返回列表中要显示的项数量计数。\n*   `onCreateViewHolder()` – 此方法创建并返回一个\
  \ `ViewHolder` 对象，该对象使用用于显示数据的视图进行初始化。此视图通常通过加载（inflate）XML 布局文件创建。\n*   `onBindViewHolder()`\
  \ – 此方法接收由 `onCreateViewHolder()` 方法创建的 `ViewHolder` 对象，以及一个指示即将显示的列表项的整数值。`ViewHolder`\
  \ 对象中包含了由 `onCreateViewHolder()` 方法分配的布局。`onBindViewHolder()` 方法的责任是用与指定项对应的文本和图形填充布局中的视图，并将该对象返回给\
  \ `RecyclerView`，以便向用户展示。\n\n在布局中添加 `RecyclerView` 只需要在要显示它的 activity 的 XML 内容布局文件中添加相应的元素即可。例如：\n\
  \n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<androidx.constraintlayout.widget.ConstraintLayout\n\
  \    xmlns:android=\"http://schemas.android.com/apk/res/android\"\n    xmlns:app=\"\
  http://schemas.android.com/apk/res-auto\"\n    xmlns:tools=\"http://schemas.android.com/tools\"\
  \n    android:layout_width=\"match_parent\"\n    android:layout_height=\"match_parent\"\
  \n    app:layout_behavior=\"@string/appbar_scrolling_view\"\n    tools:context=\"\
  .MainActivity\">\n\n    <androidx.recyclerview.widget.RecyclerView\n        android:id=\"\
  @+id/recycler_view\"\n        android:layout_width=\"0dp\"\n        android:layout_height=\"\
  0dp\"\n        app:layout_constraintBottom_toBottomOf=\"parent\"\n        app:layout_constraintEnd_toEndOf=\"\
  parent\"\n        app:layout_constraintStart_toStartOf=\"parent\"\n        app:layout_constraintTop_toTopOf=\"\
  parent\"\n        tools:listitem=\"@layout/card_layout\" />\n</androidx.constraintlayout.widget.ConstraintLayout>\n\
  ```\n\n在上述示例中，`RecyclerView` 被嵌入到活动布局文件中。这提供了一些额外功能，例如当用户在 `RecyclerView` 内滚动时，配置\
  \ `Toolbar` 和 `AppBar` 离开屏幕（该主题在“使用 AppBar 和折叠工具布局”](#AppBar.xhtml__idTextAnchor1013）章节中有更详细的介绍）。\n\
  \n#### 47.2 CardView 概述\n\n`CardView` 类是一种使用卡片隐喻分组信息的界面视图。卡片通常使用 `RecyclerView`\
  \ 实例呈现，并配置为具有投影效果和圆角。例如，图 47-4 显示了三个配置为显示包含 `ImageView` 和两个 `TextView` 布局的 `CardView`\
  \ 实例：\n\n![](img/Image24512.jpg)\n\n图 47-4\n\n与 `CardView` 实例呈现的用户界面布局定义在 XML 布局文件中并在运行时加载到\
  \ `CardView` 中。`CardView` 布局可以使用标准布局管理器（如 `RelativeLayout` 和 `LinearLayout`）包含任何复杂的布局。以下\
  \ XML 布局文件表示包含 `RelativeLayout` 和单个 `ImageView` 的卡片视图布局。该卡片被配置为提升以创建投影效果并带有圆角显示：\n\
  \n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<androidx.cardview.widget.CardView\n\
  \    xmlns:card_view=\"http://schemas.android.com/apk/res-auto\"\n    android:layout_width=\"\
  match_parent\"\n    android:layout_height=\"wrap_content\"\n    card_view:cardElevation=\"\
  2dp\"\n    card_view:cardCornerRadius=\"4dp\">\n</androidx.cardview.widget.CardView>\n\
  ```\n\n\n\n\n\n```xml\n    xmlns:android=\"http://schemas.android.com/apk/res/android\"\
  \n    android:id=\"@+id/card_view\"\n    android:layout_width=\"match_parent\"\n\
  \    android:layout_height=\"wrap_content\"\n    android:layout_margin=\"5dp\"\n\
  \    card_view:cardCornerRadius=\"12dp\"\n    card_view:cardElevation=\"3dp\"\n\
  \    card_view:contentPadding=\"4dp\">\n    <RelativeLayout\n        android:layout_width=\"\
  match_parent\"\n        android:layout_height=\"wrap_content\"\n        android:padding=\"\
  16dp\" >\n        <ImageView\n            android:layout_width=\"100dp\"\n     \
  \       android:layout_height=\"100dp\"\n            android:id=\"@+id/item_image\"\
  \n            android:layout_alignParentLeft=\"true\"\n            android:layout_alignParentTop=\"\
  true\"\n            android:layout_marginRight=\"16dp\" />\n    </RelativeLayout>\n\
  </androidx.cardview.widget.CardView>\n```\n\n当与 `RecyclerView` 结合以创建一个可滚动的卡片列表时，复用视图的\
  \ `onCreateViewHolder()` 方法会膨胀卡片的布局资源文件，将其分配给 `ViewHolder` 实例并返回给 `RecyclerView`\
  \ 实例。\n\n## 47.3 总结\n\n本章引入了 Android `RecyclerView` 和 `CardView` 组件。`RecyclerView`\
  \ 提供了一种资源高效的方式，用于在 Android 应用中显示可滚动的视图列表。当以卡片形式展示组数据（例如名称和地址列表）时，`CardView` 非常有用。正如之前概述，并在下一章包含的教程中演示的那样，`RecyclerView`\
  \ 和 `CardView` 结合使用时特别有用。\n\n## 48. 一个 Android RecyclerView 和 CardView 教程\n\n在本章中，将创建一个示例项目，该项目将同时使用\
  \ `CardView` 和 `RecyclerView` 组件来创建一个可滚动的卡片列表。完成后的应用程序将显示一个包含图像和文本的卡片列表。除了显示卡片列表外，项目还将实现为：选择卡片将向用户显示消息，指明点击了哪张卡片。\n\
  \n### 48.1 创建 CardDemo 项目\n\n从欢迎屏幕上选择 `New Project` 选项，并在生成的新项目对话框中，在点击 `Next` 按钮之前选择\
  \ `Basic Activity` 模板。\n\n在 `Name` 字段中输入 `CardDemo` 并指定 `com.ebookfrenzy.carddemo`\
  \ 为包名。在点击 `Finish` 按钮之前，将 `Minimum API` 级别设置更改为 `API 26: Android 8.0 (Oreo)`，并将语言菜单设置为\
  \ Java。\n\n### 48.2 修改 Basic Activity 项目\n\n由于选择了 `Basic Activity`，布局中包含一个浮动操作按钮，该按钮对于本项目不是必需的。通过\
  \ `Layout Editor` 工具加载 `activity_main.xml` 布局文件，选择浮动操作按钮并按键盘删除键将该对象从布局中移除。编辑 `MainActivity.java`\
  \ 文件，从 `onCreate` 方法中移除浮动操作按钮和导航控制器代码，如下：\n\n```java\n@Override\nprotected void\
  \ onCreate(Bundle savedInstanceState) {\n    super.onCreate(savedInstanceState);\n\
  \    binding = ActivityMainBinding.inflate(getLayoutInflater());\n    setContentView(binding.getRoot());\n\
  \    setSupportActionBar(binding.toolbar);\n    NavController navController =\n\
  \        Navigation.findNavController(this, R.id.nav_host_fragment_content_main);\n\
  \    appBarConfiguration =\n        new AppBarConfiguration.Builder(navController.getGraph()).build();\n\
  \    NavigationUI.setupActionBarWithNavController(this, navController,\n       \
  \ appBarConfiguration);\n    binding.fab.setOnClickListener(new View.OnClickListener()\
  \ {\n        @Override\n        public void onClick(View view) {\n            Snackbar.make(view,\
  \ \"Replace with own action\", Snackbar.LENGTH_LONG)\n                .setAction(\"\
  Action\", null).show();\n        }\n    });\n}\n```\n\n同样，移除 `onSupportNavigateUp()`\
  \ 方法，然后打开 `content_main.xml` 文件并删除 `nav_host_fragment_content_main` 对象，只保留 `ConstraintLayout`。\n\
  \n### 48.3 设计 CardView 布局\n\n卡片内包含的视图布局将在单独的 XML 文件中定义。在 `Project` 窗口中，右键点击 `app`\
  \ -> `res` -> `layout` 并选择 `New` -> `Layout Resource File` 选项。在新资源对话框中，在 `File name:`\
  \ 字段中输入 `card_layout`，并在点击 `OK` 按钮之前将根元素输入 `androidx.cardview.widget.CardView`。\n\
  \n通过 `Layout Editor` 工具加载 `card_layout.xml` 文件，切换到 `Code` 模式并修改布局如下所示：\n\n```xml\n\
  <?xml version=\"1.0\" encoding=\"utf-8\"?>\n<androidx.cardview.widget.CardView\n\
  \    xmlns:android=\"http://schemas.android.com/apk/res/android\"\n    xmlns:app=\"\
  http://schemas.android.com/apk/res-auto\"\n    android:layout_width=\"match_parent\"\
  \n    android:layout_height=\"wrap_content\"\n    android:id=\"@+id/card_view\"\n\
  \    android:layout_margin=\"5dp\"\n    app:cardBackgroundColor=\"#F1F1F4\"\n  \
  \  app:cardCornerRadius=\"12dp\"\n    app:cardElevation=\"3dp\"\n    app:contentPadding=\"\
  4dp\" >\n    <androidx.constraintlayout.widget.ConstraintLayout\n        android:id=\"\
  @+id/relativeLayout\"\n        android:layout_width=\"match_parent\"\n        android:layout_height=\"\
  wrap_content\"\n        android:padding=\"16dp\">\n        <ImageView\n        \
  \    android:id=\"@+id/item_image\"\n            android:layout_width=\"100dp\"\n\
  \            android:layout_height=\"100dp\"\n            android:layout_marginRight=\"\
  16dp\"\n            app:layout_constraintLeft_toLeftOf=\"parent\"\n            app:layout_constraintStart_toStartOf=\"\
  parent\"\n            app:layout_constraintTop_toTopOf=\"parent\" />\n        <TextView\n\
  \            android:id=\"@+id/itemTitle\"\n            android:layout_width=\"\
  236dp\"\n            android:layout_height=\"39dp\"\n            android:layout_marginStart=\"\
  16dp\"\n            android:textSize=\"30sp\"\n            app:layout_constraintLeft_toRightOf=\"\
  @+id/item_image\"\n            app:layout_constraintStart_toEndOf=\"@+id/item_image\"\
  \n            app:layout_constraintTop_toTopOf=\"parent\" />\n        <TextView\n\
  \            android:id=\"@+id/itemDetail\"\n            android:layout_width=\"\
  236dp\"\n            android:layout_height=\"16dp\"\n            android:layout_marginStart=\"\
  16dp\"\n            android:layout_marginTop=\"8dp\"\n            app:layout_constraintLeft_toRightOf=\"\
  @+id/item_image\"\n            app:layout_constraintStart_toEndOf=\"@+id/item_image\"\
  \n            app:layout_constraintTop_toBottomOf=\"@+id/itemTitle\" />\n    </androidx.constraintlayout.widget.ConstraintLayout>\n\
  </androidx.cardview.widget.CardView>\n```\n\n### 48.4 添加 RecyclerView\n\n选择 `content_main.xml`\
  \ 布局文件，从调色板的 `Containers` 部分拖入 `RecyclerView` 对象到布局中，使其自动调整大小以填充整个屏幕。使用工具栏上的 `Infer\
  \ constraints` 按钮为视图添加缺失的布局约束。使用 `Attributes` 工具窗口，将 `RecyclerView` 实例的 `ID` 更改为\
  \ `recyclerView`并将`layout_width` 和 `layout_height` 属性更改为 `match_constraint`。\n\n\
  ### 48.5 添加图像文件\n\n除了两个 `TextView` 之外，卡片布局还包含一个 `ImageView`，`RecyclerView` 适配器已配置在其显示图像。在测试项目之前，必须添加这些图像。项目中使用的图像命名为\
  \ `android_image_<n>.jpg`，可以在以下 URL 示例代码 `project_icons` 文件夹中找到：\n\n[`www.ebookfrenzy.com/retail/eeljava/index.php`](https://www.ebookfrenzy.com/retail/eeljava/index.php)\n\
  \n在操作系统的文件导航器中找到这些图像，选择并复制八张图像。在 `Project` 工具窗口中右键点击 `app` -> `res` -> `drawable`\
  \ 条目并选择 `Paste` 将文件添加到文件夹中：\n\n![](img/Image24252.jpg)\n\n图 48-1\n\n\n\n\n\n# 48.6\
  \ 创建 RecyclerView 器\n\n如上一节所述，`RecyclerView` 需要一个适配器（adapter）来处理列表项的创建。在 Project\
  \ 工具窗口中，右键点击 `app` -> `java` -> `com.ebookfrenzy.carddemo`，选择 `New` -> `Java Class`\
  \ 菜单向项目中添加此新类。在新类对话框中，在 `Name` 字段中输入 `RecyclerAdapter`，并在列表中选择 `Class`，然后按 `Return`\
  \ 键创建新的 Java 类文件。\n\n编辑新的 `RecyclerAdapter.java` 文件以添加一些导入指令，并声明该类现在继承 `RecyclerView.Adapter`。我们没有创建一个独立的类来提供显示的数据，而是在适配器中添加一些基础数组来作为应用的数据：\n\
  \n```java\npackage com.ebookfrenzy.carddemo;\n\nimport android.view.LayoutInflater;\n\
  import android.view.View;\nimport android.view.ViewGroup;\nimport android.widget.ImageView;\n\
  import android.widget.TextView;\nimport androidx.annotation.NonNull;\nimport androidx.recyclerview.widget.RecyclerView;\n\
  \npublic class RecyclerAdapter extends RecyclerView.Adapter<RecyclerAdapter.ViewHolder>\
  \ {\n    final private String[] titles = {\"Chapter One\",\n            \"Chapter\
  \ Two\",\n            \"Chapter Three\",\n            \"Chapter Four\",\n      \
  \      \"Chapter Five\",\n            \"Chapter Six\",\n            \"Chapter Seven\"\
  ,\n            \"Chapter Eight\"};\n\n    final private String[] details = {\"Item\
  \ one details\",\n            \"Item two details\", \"Item three details\",\n  \
  \          \"Item four details\", \"Item five details\",\n            \"Item six\
  \ details\", \"Item seven details\",\n            \"Item eight details\"};\n\n \
  \   final private int[] images = { R.drawable.android_image_1,\n               \
  \                      R.drawable.android_image_2,\n                           \
  \          R.drawable.android_image_3,\n                                     R.drawable.android_image_4,\n\
  \                                     R.drawable.android_image_5,\n            \
  \                         R.drawable.android_image_6,\n                        \
  \             R.drawable.android_image_7,\n                                    \
  \ R.drawable.android_image_8 };\n}\n```\n\n在 `RecyclerAdapter` 类中，我们现在需要我们自己的 `ViewHolder`\
  \ 类实现，并配置为引用 `card_layout.xml` 文件中的视图元素。留在 `RecyclerAdapter.java` 文件中并如下所示实现：\n\n\
  ```java\npublic class RecyclerAdapter extends RecyclerView.Adapter<RecyclerAdapter.ViewHolder>\
  \ {\n\n    static class ViewHolder extends RecyclerView.ViewHolder {\n        ImageView\
  \ itemImage;\n        TextView itemTitle;\n        TextView itemDetail;\n\n    \
  \    ViewHolder(View itemView) {\n            super(itemView);\n            itemImage\
  \ = itemView.findViewById(R.id.itemImage);\n            itemTitle = itemView.findViewById(R.id.itemTitle);\n\
  \            itemDetail = itemView.findViewById(R.id.itemDetail);\n        }\n \
  \   }\n```\n\n`ViewHolder` 类包含一个 `ImageView` 和两个 `TextView` 变量，并有一个构造方法，使用 `card_layout.xml`\
  \ 中的三个项初始化这些变量。下一个要添加到 `RecyclerAdapter.java` 文件的项是 `onCreateViewHolder()` 方法的实现：\n\
  \n```java\n@NonNull\n@Override\npublic ViewHolder onCreateViewHolder(ViewGroup viewGroup,\
  \ int i) {\n    View v = LayoutInflater.from(viewGroup.getContext())\n         \
  \   .inflate(R.layout.card_layout, viewGroup, false);\n    return new ViewHolder(v);\n\
  }\n```\n\n此方法将由 `RecyclerView` 调用以获取一个 `ViewHolder` 对象。它膨胀 `card_layout.xml` 文件并创建一个我们的\
  \ `ViewHolder` 类的实例（带有视图层级），然后将其返回给 `RecyclerView`。\n\n`onBindViewHolder()` 方法的目的是将要显示的数据填充到\
  \ `ViewHolder` 对象中的视图层级中。它接收一个 `ViewHolder` 对象和一个表示要显示的列表项的整数值。现在应该添加此方法，使用项目编号作为数组的索引。这些数据随后将使用\
  \ `ViewHolder` 类构造方法中创建的引用显示在布局视图上：\n\n```java\n@Override\npublic void onBindViewHolder(ViewHolder\
  \ viewHolder, int i) {\n    viewHolder.itemTitle.setText(titles[i]);\n    viewHolder.itemDetail.setText(details[i]);\n\
  \    viewHolder.itemImage.setImageResource(images[i]);\n}\n```\n\n适配器类的最后一个要求是实现\
  \ `getItemCount()` 方法，在这种情况下，它只是简单地返回 `titles` 数组中的项数：\n\n```java\n@Override\npublic\
  \ int getItemCount() {\n    return titles.length;\n}\n```\n\n# 48.7 初始化 RecyclerView\
  \ 组件\n\n到此时，项目包含一个 `RecyclerView` 实例、一个 `CardView` 实例的 XML 布局文件以及一个 `RecyclerView`\
  \ 的适配器。在测试目前进展之前的最后一步是使用布局管理器初始化 `RecyclerView`，创建适配器实例并将该实例分配给 `RecyclerView` 对象。为了本示例，`RecyclerView`\
  \ 将配置为使用 `LinearLayoutManager` 布局选项。\n\n这里有一点复杂之处，因为我们需要能够使用视图绑定（view binding）从\
  \ `MainActivity` 类内部访问 `recyclerView` 组件。问题是 `recyclerView` 包含在 `content_main.xml`\
  \ 布局文件中，而该文件又包含在 `activity_main.xml` 中。为了能够进入 `content_main.xml` 文件，我们需要为其分配一个 id。为此，请编辑\
  \ `activity_main.xml` 文件并修改 `include` 元素如下：\n\n```xml\n<include\n    android:id=\"\
  @+id/contentMain\"\n    layout=\"@layout/content_main\" />\n```\n\n为包含的文件分配了 id\
  \ 后，可以使用以下绑定访问 `recyclerView` 组件：`binding.contentMain`\n\n现在编辑 `MainActivity.java`\
  \ 文件并修改 `onCreate()` 方法来实现初始化代码：\n\n```java\npackage com.ebookfrenzy.carddemo;\n\
  \nimport androidx.recyclerview.widget.LinearLayoutManager;\nimport androidx.recyclerview.widget.RecyclerView;\n\
  \npublic class MainActivity extends AppCompatActivity {\n    private RecyclerView\
  \ recyclerView;\n    private RecyclerView.LayoutManager layoutManager;\n    private\
  \ RecyclerView.Adapter adapter;\n\n    @Override\n    protected void onCreate(Bundle\
  \ savedInstanceState) {\n        setSupportActionBar(toolbar);\n        layoutManager\
  \ = new LinearLayoutManager(this);\n        binding.contentMain.recyclerView.setLayoutManager(layoutManager);\n\
  \        adapter = new RecyclerAdapter();\n        binding.contentMain.recyclerView.setAdapter(adapter);\n\
  \    }\n}\n```\n\n# 48.8 测试应用程序\n\n在物理设备或模拟器会话上编译并运行应用，滚动列表中的不同的卡片项：\n\n![](img/as_card_demo_running.jpg)\n\
  \n图 48-2\n\n# 48.9 卡片选择\n\n项目的最后阶段是使列表中的卡片可选，以便点击卡片时可以触发应用内的事件。在本示例中，卡片将被配置为用户点击时在屏幕上显示消息。为了响应点击，需要修改\
  \ `ViewHolder` 类以为每个项目视图分配 `OnClickListener`。编辑 `RecyclerAdapter.java` 文件并修改 `ViewHolder`\
  \ 类声明如下：\n\n```java\nimport com.google.android.material.snackbar.Snackbar;\n\nclass\
  \ ViewHolder extends RecyclerView.ViewHolder{\n    ImageView itemImage;\n    TextView\
  \ itemTitle;\n    TextView itemDetail;\n\n    ViewHolder(View itemView) {\n    \
  \    super(itemView);\n        itemImage = itemView.findViewById(R.id.itemImage);\n\
  \        itemTitle = itemView.findViewById(R.id.itemTitle);\n        itemDetail\
  \ = itemView.findViewById(R.id.itemDetail);\n    }\n}\n```\n\n\n\n\n\n```java\n\
  itemView.setOnClickListener(new View.OnClickListener() {\n    @Override \n    public\
  \ void onClick(View v) {\n\n    }\n});\n}\n```\n\n在 `onClick` 处理处理体内部，现在可以添加代码来显示一条消息，指示卡片已被点击。由于点击后执行的动作可能取决于点击了哪张卡片，因此识别所选的卡片同样重要。此信息可以通过调用\
  \ `RecyclerView.ViewHolder` 类的 `getAdapterPosition()` 方法获得。继续留在 `RecyclerAdapter.java`\
  \ 文件中，向 `onClick` 处理器添加代码，其内容如下：\n\n```java\n@override\npublic void onClick(View\
  \ v) {\n    int position = getAdapterPosition();\n    Snackbar.make(v, \"Click detected\
  \ on item \" + (position + 1), Snackbar.LENGTH_LONG)\n            .setAction(\"\
  Action\", null).show();\n}\n```\n\n最后一个任务是启用 Android 应用程序中点击项时出现的 Material Design\
  \ 波纹效果（ripple effect）。这仅涉及在 `card_layout.xml` 文件的 `CardView` 实例声明中添加一些属性，如下所示：\n\
  \n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<androidx.cardview.widget.CardView\n\
  \    xmlns:android=\"http://schemas.android.com/apk/res/android\"\n    xmlns:card_view=\"\
  http://schemas.android.com/apk/res-auto\"\n    android:layout_width=\"match_parent\"\
  \n    android:layout_height=\"match_parent\"\n    android:id=\"@+id/card_view\"\n\
  \    android:layout_margin=\"5dp\"\n    app:cardBackgroundColor=\"#81C784\"\n  \
  \  app:cardCornerRadius=\"12dp\"\n    app:cardElevation=\"3dp\"\n    app:contentPadding=\"\
  4dp\"\n    android:foreground=\"?selectableItemBackground\"\n    android:clickable=\"\
  true\" >\n```\n\n再次运行应用，验证点击列表中的卡片是否会同时触发接触点的标准波纹效果，以及显示报告所选项目编号的 `Snackbar`。\n\n\
  ## 48.10 总结\n\n本章详细介绍了结合 `CardView` 和 `RecyclerView` 组件以显示可滚动的卡片项列表的步骤。示例还涵盖了对列表项的点击检测，包括识别所选项目以及在被点击的\
  \ `CardView` 实例上启用波纹效果视觉反馈。\n\n## 49. 布局编辑器示例数据教程\n\n在上章中创建的 `CardDemo` 项目提供了一个很好的示例，说明了在测试完成的应用之前，很难从布局编辑器内部准确判断用户界面将呈现什么样。当用户界面中要显示的内容只有在用户安装并运行应用后才会生成或获取时，这个问题就会经常发生。\n\
  \n从以前开始，Android Studio 布局编辑器就提供了指定简单属性的功能，这些属性仅在设计布局时有效。例如，可以向一个仅在设计时使用的字符串资源分配给布局编辑器中的\
  \ `TextView`，而该资源在应用运行时不会显示。随着 Android Studio 布局编辑器中引入示例数据支持，这一功能得到了显著扩展，并在本章中，它被用于改进\
  \ `CardDemo` 项目的布局编辑器体验。\n\n### 49.1 为项目添加示例数据\n\n在用户界面布局的设计阶段，`RecyclerView` 实例（[图\
  \ 49-1](#）与上一章末尾的运行应用几乎没有相似之处\n\n![](img/as_3.6_recyclerview_no_sample_data.jpg)\n\
  图 49-1\n\n在书前面的“使用 Jetpack 构建现代 Android 架构”章节中引入了示例数据的概念。为了演示示例数据的使用，现在将修改项目，使得完全填充的卡片显示在布局编辑器内部的\
  \ `RecyclerView` 中。然而，在此之前，值得注意的是，布局编辑器有一系列预配置的示例数据模板，可以在设计用户界面时使用。要查看其中一些的用法，请将\
  \ `content_main.xml` 布局文件加载到布局编辑器中并选择 `RecyclerView` 实例。右键点击 `RecyclerView` 并选择\
  \ `Set Sample Data`（设置示例数据）菜单选项以显示设计视图属性面板：\n\n![](img/as_3.2_design_time_attributes.jpg)\n\
  图 49-2\n\n将模板更改为 `Email Client` 选项并将项目计数更改为 12，并注意 `RecyclerView` 变为显示：\n\n![](img/as_3.6_recyclerview_sample_data.jpg)\n\
  图-3\n\n这些模板可以用于无需任何额外工作即可显示示例数据，并且通常提供足够完成布局的内容。然而，对于本示例，将使用示例数据来显示。在布局编辑器中仍加载着\
  \ `content_main.xml` 文件的情况下，切换到代码（Code）模式并找到 `RecyclerView` 元素，其内容如下：\n\n```xml\n\
  <androidx.recyclerview.widget.RecyclerView\n    android:id=\"@+id/recyclerView\"\
  \n    android:layout_width=\"0dp\"\n    android:layout_height=\"0dp\"\n    app:layout_constraintBottom=\"\
  parent\"\n    app:layout_constraintEnd_toEndOf=\"parent\"\n    app:layout_constraintStart_toStartOf=\"\
  parent\"\n    app:layout_constraintTop_toTopOf=\"parent\"\n    tools:itemCount=\"\
  12\"\n    tools:listitem=\"@layout/recycler_view_item\" />\n```\n\n注意特殊的 `tools`\
  \ 属性配置为显示 12 个，每个使用名为 `recycler_view_item` 的布局。虽然这些设置的完整说明超出了本书的范围，但可以在以下 URL 找到每个属性的描述：https://developer.android.com/studio/write/tool-attributes#toolssample\n\
  \n上述 `recycler_view.xml` 文件是在选择示例数据模板时由布局编辑器自动生成的，可以在项目窗口找到。切换回设计（Design）模式，并在选中\
  \ `RecyclerView` 后，使用视图属性面板将模板切回默认。`recycler_view.xml` 文件将从项目中删除，同时删除 `content_main.xml`\
  \ 文件中的两个 tools 行（如果 Android Studio 未删除这些行，可以手动删除）。\n\n要切换到使用卡片布局作为示例数据，添加 `listitem`\
  \ 属性以引用 `card_layout.xml` 文件。在布局中选中 `RecyclerView`，在属性窗口中搜索 `listitem` 属性并输入 `@layout/card_layout`，如[图\
  \ 49-4](#）所示：\n\n![](img/as_4.1_sample_data_list_item.jpg)\n图 49-4\n\n注意每个列表项现在都显示卡片布局，尽管没有任何图像且使用的是示例文本数据：\n\
  \n![](img/as_sample_data_cards.jpg)\n图 49-5\n\n下一步是在卡片布局中的视图显示一些图像和不同的文本。这可以是布局编辑器提供的模板示例数据的形式，也可以是专门为此项目添加的示例数据。将\
  \ `card_layout.xml` 文件加载到布局编辑器，选择 `ImageView` 并按照本章前面的说明显示视图属性面板。从 `srcCompat` 菜单中选择内置的背景/风景图集，如下方的[图\
  \ 49-6](#）所示：\n\n![](img/as_3.6_recyclerview_sample_data_background_images.jpg)\n\
  图 49-6\n\n\n\n\n\n接下来，右键点击 `itemTitle` `TextView` 对象，选择 `Set Sample Data` 菜单选项，并在设计时属性面板（Design-time\
  \ attributes panel）中选择 `cities` 文本选项。对 `itemDetail` 视图重复此步骤，这次选择 `full_names` 选项，如图\
  \ 49-7 所示：\n\n![](img/as_3.6_recyclerview_sample_data_full_names.jpg)\n\n**图 49-7**\n\
  \n在 Design（设计）模式打开 `content_main.xml` 文件，并注意 `RecyclerView` 现在正在使用内置图像和示例文本数据：\n\
  \n![](img/as_3.6_recyclerview_sample_data_cities.jpg)\n\n**图 49-8**\n\n## 49.2 使用自定义样本数据\n\
  \n本章的最后一步是演示如何在布局编辑器中使用自定义样本数据和图像。这需要创建一个样本数据目录并添加一些文本和图像文件。\n\n在 Project（项目）工具窗口中，右键点击\
  \ app 入口并选择 `New -> Sample Data Directory` 菜单选项，此时 Project 工具窗口中将出现一个名为 `sampledata`\
  \ 的新目录。如果没有看到新文件夹，将 Project 工具窗口从 `Android` 模式切换到 `Project` 模式，并在 `CardDemo -> app`\
  \ 下找到文件夹，如图 49-9 所示：\n\n![](img/as_4.2_sample_data_folder.jpg)\n\n**图 49-9**\n\n\
  右键点击 `sampledata` 目录，创建一个名为 `images` 的子目录，并按照上一章概述的相同步骤将 Android 图像复制并粘贴到新文件夹中。在\
  \ `card_layout.xml` 文件中再次显示 `ImageView` 的设计时视图属性面板，这次点击 `Browse` 链接并在 Resources（资源）对话框中选择新添加的\
  \ Android 图像（如果 `images` 文件夹未出现出现，请尝试重新构建项目）：\n\n![](img/as_4.1_sample_data_pick_drawing.jpg)\n\
  \n**图 49-10**\n\n再次右键点击 `sampledata` 目录，选择 `New -> File` 选项，将文件命名为 `chapters` 并输入以下内容：\n\
  \n```\nChapter One\nChapter Two\nChapter Three\nChapter Four\nChapter Five\nChapter\
  \ Six\nChapter Seven\nChapter Eight\n```\n\n接下来，创建一个名为 `items` 的第二个文本文件，内容如下：\n\n\
  ```\nItem one details\nItem two details\nItem three details\nItem four details\n\
  Item five details\nItem six details\nItem seven details\nItem eight details\n```\n\
  \n创建样本数据文本文件后，剩下的只需在 `card_layout.xml` 文件的视图元素中如下引用它们：\n\n```xml\n<TextView\n  \
  \  android:id=\"@+id/itemTitle\"\n    android:layout_width=\"236dp\"\n    android:layout_height=\"\
  39dp\"\n    android:layout_marginStart=\"16dp\"\n    android:textSize=\"30sp\"\n\
  \    app:layout_constraintLeft_toRightOf=\"@+id/itemImage\"\n    app:layout_constraintStart_toEndOf=\"\
  @+id/itemImage\"\n    app:layout_constraintTop_toTopOf=\"parent\"\n    tools:text=\"\
  @sample/chapters\" />\n<TextView\n    android:id=\"@+id/itemDetail\"\n    android:layout_width=\"\
  236dp\"\n    android:layout_height=\"16dp\"\n    android:layout_marginStart=\"16dp\"\
  \n    android:layout_marginTop=\"8dp\"\n    app:layout_constraintLeft_toRightOf=\"\
  @+id/itemImage\"\n    app:layout_constraintStart_toEndOf=\"@+id/itemImage\"\n  \
  \  app:layout_constraintTop_toBottomOf=\"@+id/itemTitle\"\n    tools:text=\"@sample/items\"\
  \ />\n```\n\n重新构建应用并返回 `content_main.xml` 文件中的布局设计，此时自定义样本数据和图像应该已经显示在 `RecyclerView`\
  \ 列表中：\n\n![](img/as_3.6_sample_data_running.jpg)\n\n**图 49-11**\n\n与其使用两个独立的文本文件和对图像集的引用，另一种选项是在\
  \ JSON 文件中声明样本数据。例如：\n\n```json\n{\n  \"mydata\": [\n    {\n      \"chapter\" :\
  \ \"Chapter One\",\n      \"details\": \"Item one details\",\n      \"image\": \"\
  @sample/images\"\n    },\n    {\n      \"chapter\" : \"Chapter Two\",\n      \"\
  details\": \"Item two details\",\n      \"image\": \"@sample/images\"\n    },\n\
  \    ...\n  ]\n}\n```\n\n假设上述内容包含在一个名为 `chapterdata.json` 的文件中，则在视图 XML 元素中引用样本数据如下：\n\
  \n```xml\n<ImageView\n    src=\"@sample/chapterdata.json/image\" />\n<TextView\n\
  \    tools:text=\"@sample/chapterdata.json/chapter\" />\n<TextView\n    tools:text=\"\
  @sample/chapterdata.json/details\" />\n```\n\n## 49.3 总结\n\n本章演示了在布局编辑器中使用样本数据以提供更真实的表示。本教程涵盖的步骤包括使用现有的样本数据以及集成自定义数据。\n\
  \n## 50. 配合 AppBar 和折叠布局进行工作\n\n在本章中，我们将探索如何自定义应用栏（app bar）并使其能够响应滚动事件的方法。通过使用 `CoordinatorLayout`\
  \ 配合 `AppBarLayout` 和 `CollapsingToolbarLayout`，可以配置应用栏的进入和退出动画。\n\n### 50.1 AppBar\
  \ 的结构\n\n应用栏是应用运行时显示在屏幕顶部的区域，可以配置为包含状态栏、工具栏和可扩展空间。图 50-1 例如，显示了一个包含状态栏、工具栏和标签栏的应用栏：\n\
  \n![](img/24271.jpg)\n\n**图 50-1**\n\n可扩展空间可以使用空白背景颜色填充，也可以如图 50-2 所示，显示 `ImageView`\
  \ 上的图像：\n\n![](img/24361.jpg)\n\n**图 50-2**\n\n正如本章剩余部分将演示的那样，如果用户界面布局的主区域包含滚动内容，可以配置应用栏元素在屏幕内容滚动时展开或收起。\n\
  \n### 50.2 示例项目\n\n为了本示例，我们将对早期章节 Android RecyclerView 和 CardView 教程创建的 `CardDemo`\
  \ 项目进行修改。首先启动 Android Studio 并加载该项目。\n\n项目加载后，运行应用并注意当向上滚动列表时，工具栏保持可见，如图 50-3 所示：\n\
  \n![](img/24431.jpg)\n\n**图 50-3**\n\n第一步是进行一些配置更改，使工具栏在向上滚动时收起，在向下滚动时展开。\n\n###\
  \ 50.3 协调 RecyclerView 和工具栏\n\n在布局编辑器加载 `activity_main.xml` 文件，切换到 Code 模式并查看 XML\
  \ 布局设计，其层级结构如图 50-4](#AppBar.xhtml__idTextAnchor25)中的图所示：\n\n![](img/as3.0_appbar_coordinatorlayout_tree.jpg)\n\
  \n**图 50-4**\n\n层级结构的顶层是 `CoordinatorLayout`，正如名称所示，它协调其包含的各种子视图元素之间的交互。正如配合浮动按钮和\
  \ Snackbar 进行工作中所强调的，当 `Snackbar` 出现时，`CoordinatorLayout` 会自动向上移动浮动按钮以留出空间，并在消失后将其移回。\n\
  \n\n\n\n\n`CoordinatorLayout` 同样可以用于根据视图层次结构中某些视图的滚动操作，使应用栏的元素滑入或滑出视图。在图 50-4 所示的布局层次结构中，一个元素是\
  \ `ConstraintLayout`。为了实现这种协调行为，需要在发生滚动的元素以及与滚动协调的元素上都设置属性。\n\n在滚动元素（在此例中 `RecyclerView`）上，必须将\
  \ `android:layout_behavior` 属性设置为 `appbar_scrolling_view_behavior`。在 `content_main.xml`\
  \ 文件中，找到顶层 `ConstraintLayout` 元素，并注意该属性已默认设置：\n\n```xml\n<androidx.constraintlayout.widget.ConstraintLayout\n\
  \    xmlns:android=\"http://schemas.android.com/apk/res/android\"\n    xmlns:app=\"\
  http://schemas.android.com/apk/res-auto\"\n    xmlns:tools=\"http://schemas.android.com/tools\"\
  \n    android:layout_width=\"match_parent\"\n    android:layout_height=\"match_parent\"\
  \n    app:layout_behavior=\"@string/appbar_scrolling_view_behavior\" >\n```\n\n\
  接下来，在布局编辑器中打开 `activity_main.xml` 文件，切换到代码模式并找到 `AppBarLayout` 元素。注意视图层次结构中 `AppBarLayout`\
  \ 的唯一子是 `Toolbar`。为了让工具栏对 `RecyclerView` 中的滚动事件做出响应，必须在该元素上设置 `app:layout_scrollFlags`\
  \ 属性。分配给此属性的值取决于所需的交互性质，并且必须由以下一个或多个组成：\n\n- `scroll` – 表示该视图将被滚出屏幕。如果不设置此项，在滚动事件期间，该视图将固定在屏幕顶部。\n\
  - `enterAlways` – 与 `scroll` 选项结合使用时，向上滚动动作将导致视图收回。在此模式下，任何向下滚动动作都会导致视图重新出现。\n-\
  \ `enterAlwaysCollapsed` – 设置在视图上时，该视图在向下滚动动作达到列表限制之前将不会从折叠状态展开。如果设置了 `minHeight`\
  \ 属性，视图将在初始滚动动作中出现，但仅到达到最小高度。随后它将保持在该高度，直到到达列表顶部才会完全展开。注意此选项仅在同时与 `enterAlways`\
  \ 和 `scroll` 选项结合使用时有效。例如：\n\n```xml\napp:layout_scrollFlags=\"scroll|enterAlways|enterAlwaysCollapsed\"\
  \nandroid:minHeight=\"20dp\"\n```\n\n- `exitUntilCollapsed` – 设置后，视图在向上滚动过程中将折叠，直到达到\
  \ `minHeight` 阈值，此时它将保持在该高度，直到滚动方向改变。\n\n为了本示例的目的，将在 `Toolbar` 上按如下设置 `scroll` 和\
  \ `enterAlways` 选项：\n\n```xml\n<androidx.appcompat.widget.Toolbar\n    android:id=\"\
  @+id/toolbar\"\n    android:layout_width=\"match_parent\"\n    android:layout_height=\"\
  ?attr/actionBarSize\"\n    android:background=\"?attr/colorPrimary\"\n    app:popupTheme=\"\
  @style/Theme.CardDemo.PopupOverlay\"\n    app:layout_scrollFlags=\"scroll|enterAlways\"\
  \ />\n```\n\n设置好相应的属性后，再次运行应用并在 `RecyclerView` 列表中进行向上滚动。这应该导致工具栏折叠出视图（图 50-5）。向下滚动动作应导致工具栏重新出现。\n\
  \n![](img/Image2459.jpg)\n\n图 50-5\n\n### 50.4 引入折叠工具栏布局\n\n`CollapsingToolbarLayout`\
  \ 容器通过增强标准工具栏，提供了更多的选项，并对响应协调滚动操作的应用栏及其子元素的折叠提供了更级别的控制。`CollapsingToolbarLayout`\
  \ 类旨在作为 `AppBarLayout` 的子元素添加，并提供诸如随着工具栏的折叠和展开自动调整工具栏标题字体大小等功能。`parallax` 模式允许应用栏中的指定内容在折叠时淡出视图，而\
  \ `pin` 模式允许应用栏的元素在收缩期间保持固定位置。\n\n还可以使用 `scrim` 选项用于指定工具栏在折叠序列期间过渡的颜色。\n\n为了看到这些功能的效果，将修改\
  \ `activity_main.xml` 文件中包含的应用栏，以使用 `CollapsingToolbarLayout` 类，并添加 `ImageView`\
  \ 以更好地演示 `parallax` 模式的效果。使用 `CollapsingToolbarLayout` 的新视图层次结构由图 50-6 中的图所示：\n\n\
  ![](img/as3.0_appbar_collapsing_tree.jpg)\n\n图 50-6\n\n在布局编辑器工具中以代码模式加载 `activity_main.xml`\
  \ 文件，并修改布局如下：\n\n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<androidx.coordinatorlayout.widget.CoordinatorLayout\n\
  \    xmlns:android=\"http://schemas.android.com/apk/res/android\"\n    xmlns:app=\"\
  http://schemas.android.com/apk/res-auto\"\n    xmlns:tools=\"http://schemas.android.com/tools\"\
  \n    android:layout_width=\"match_parent\"\n    android:layout_height=\"match_parent\"\
  \n    tools:context=\".MainActivity\">\n    <com.google.android.material.app.AppBarLayout\n\
  \        android:layout_width=\"match_parent\"\n        android:layout_height=\"\
  wrap_content\"\n        android:theme=\"@style/Theme.CardDemo.Overlay\">\n     \
  \   <com.google.android.material.appbar.CollapsingToolbarLayout\n            android:id=\"\
  @+id/collapsing_toolbar\"\n            android:layout_width=\"match_parent\"\n \
  \           android:layout_height=\"match_parent\"\n            app:layout_scrollFlags=\"\
  scroll|enterAlways\"\n            android:fitsSystemWindows=\"true\"\n         \
  \   app:expandedTitleBottom=\"30dp\"\n            app:expandedTitleStart=\"15dp\"\
  \n            app:expandedTitleMarginEnd=\"64dp\">\n            <ImageView\n   \
  \             android:id=\"@+id/backdrop\"\n                android:layout_width=\"\
  match_parent\"\n                android:layout_height=\"200dp\"\n              \
  \  android:scaleType=\"centerCrop\"\n                android:fitsSystemWindows=\"\
  true\"\n                app:layout_collapseMode=\"parallax\"\n                android:src=\"\
  @drawable/appbar_image\" />\n            <androidx.appcompat.widget.Toolbar\n  \
  \              android:id=\"@+id/toolbar\"\n                android:layout_width=\"\
  match_parent\"\n                android:layout_height=\"?attr/actionBarSize\"\n\
  \                android:background=\"?attr/colorPrimary\"\n                app:popupTheme=\"\
  @style/Theme.CardDemo.PopupOverlay\"\n                app:layout_collapseMode=\"\
  pin\" />\n        </com.google.android.material.appbar.CollapsingToolbarLayout>\n\
  \    </com.google.android.material.app.AppBarLayout>\n    <include\n        android:id=\"\
  @+id/contentMain\"\n        layout=\"@layout/content_main\" />\n</androidx.coordinatorlayout.widget.CoordinatorLayout>\n\
  ```\n\n除了向上述布局中添加新元素外，还删除了背景颜色属性设置。此更改的优点是提供了一个透明的工具栏，允许应用栏中显示更多的图像。\n\n使用你操作系统的文件导航器，在书籍代码示例下载的\
  \ `project_icons` 文件夹中找到 `appbar_image.jpg` 图像文件并复制。在项目工具窗口中右键点击 `app` -> `res`\
  \ -> `drawable` 条目，并从出的菜单中选择“粘贴”。\n\n运行时，应用栏的显示应如图 50-7 所示：\n\n![](img/as_cardlayout_image.jpg)\n\
  \n图 50-7\n\n\n\n\n\n在滚动动作的初始阶段，工具栏保持可见（如果继续向上滚动，工具栏也会随着灵活区域的折叠而消失），这是因为 `activity_main.xml`\
  \ 文件中的工具栏元素被配置为使用 `pin`（固定）模式：\n\n```xml\napp:layout_collapseMode=\"pin\"\n```\n\
  \n如果将折叠模式设置为 `parallax`（视差），工具栏将与图像视图一起收起。\n\n继续向上滚动动作将导致工具栏也发生折叠，只留状态栏可见：\n\n![](img/as_cardlayout_image_fully_collapsed.jpg)\n\
  \n图 50-9\n\n由于 `CollapsingToolbarLayout` 元素的 `scroll_flags` 属性包含了 `enterAlways`\
  \ 选项，向下滚动动作将导致应用栏再次展开。\n\n要固定工具栏使其在向上滚动过程中不再消失，请按照下文所示，将 `activity_main.xml` 文件中\
  \ `CollapsingToolbarLayout` 元素的 `layout_scrollFlags` 属性中的 `enterAlways` 替换为 `exitUntilCollapsed`：\n\
  \n```xml\n<com.google.android.material.appbar.CollapsingToolbarLayout\n    android:id=\"\
  @+id/collapsing_toolbar\"\n    android:layout_width=\"match_parent\"\n    android:layout_height=\"\
  match_parent\"\n    app:layout_scrollFlags=\"scroll|exitUntilCollapsed\"\n    android:fitsSystemWindows=\"\
  true\"\n    app:expandedTitleMarginBottom=\"30dp\"\n    app:expandedTitleMarginStart=\"\
  15dp\"\n    app:expandedTitleMarginEnd=\"64dp\">\n```\n\n## 50.5 更改标题和遮罩颜色\n\n作为最后一个任务，编辑\
  \ `MainActivity.java` 文件并在 `onCreate()` 方法中添加一些代码，以更改折叠布局管理器实例上的标题文本，并设置不同的遮罩颜色（注意，遮罩颜色也可以在布局资源文件中设置）：\n\
