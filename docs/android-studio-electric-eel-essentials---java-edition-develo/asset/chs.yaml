  );\n    }\n\n    private void createWebPrintJob(WebView webView) {\n        // 待实现\n\
  \    }\n}\n```\n\n### 76.9 添加打印菜单选项\n\n打印网页的选项现在根据“在 Android 中创建和管理溢出菜单”章节概述的技术添加到溢出菜单中。第一个要求是用于标记菜单选项的字符串资源。在\
  \ Project 工具窗口中，找到 `app -> res -> values -> strings.xml` 文件，双击将其加载到编辑器并修改它以添加新的字符串资源：\n\
  \n```xml\n<resources>\n    <string name=\"app_name\">WebPrint</string>\n    <string\
  \ name=\"action_settings\">Settings</string>\n    <string name=\"print_string\"\
  >Print</string>\n</resources>\n```\n\n接下来，将 `app -> res -> menu -> menu_main.xml`\
  \ 文件加载到菜单编辑器，切换到 Code 并将 Settings 选项替换为打印选项：\n\n```xml\n<menu xmlns:android=\"http://schemas.android.com/apk/res/android\"\
  \n    xmlns:tools=\"http://schemas.android.com/tools\"\n    tools:context=\"com.ebookfrenzy.webprint.MainActivity\"\
  \ >\n    <item android:id=\"@+id/action_settings\"\n        android:title=\"@string/action_settings\"\
  \n        android:priority=\"100\"\n        app:showAsAction=\"never\" />\n    <item\n\
  \        android:id=\"@+id/action_print\"\n        android:priority=\"100\"\n  \
  \      app:showAsAction=\"never\"\n        android:title=\"@string/print_string\"\
  />\n</menu>\n```\n\n配置菜单选项方面剩余的所有工作是修改 `MainActivity.java` 文件中的 `onOptionsItemSelected()`\
  \ 程序方法：\n\n```java\n@Override\npublic boolean onOptionsItemSelected(MenuItem item)\
  \ {\n    int id = item.getItemId();\n    if (id == R.id.action_print) {\n      \
  \  createWebPrintJob(myWebView);\n        return true;\n    }\n    return super.onOptionsItemSelected(item);\n\
  }\n```\n\n\n\n\n在实现 `onOptionsItemSelected()` 方法后，当从溢出菜单中选择打印选项时，活动将调用一个名为 `createWebPrintJob()`\
  \ 的方法。该方法的实现与之前的 `HTMLPrint` 项目中使用的相同，现在可以将其添加到 `MainActivity.java` 文件中，其内容如下：\n\
  \n```java\npackage com.ebookfrenzy.webprint;\n\n.\n.\n.\n\nimport android.print.PrintAttributes;\n\
  import android.print.PrintDocumentAdapter;\nimport android.print.PrintManager;\n\
  import android.content.Context;\n\npublic class MainActivity extends AppCompatActivity\
  \ {\n    private WebView myWebView;\n\n.\n.\n    private void createWebPrintJob(WebView\
  \ webView) {\n        PrintManager printManager = (PrintManager) this\n        \
  \            .getSystemService(Context.PRINT_SERVICE);\n        PrintDocumentAdapter\
  \ printAdapter =\n                    webView.createPrintDocumentAdapter(\"MyDocument\"\
  );\n        String jobName = getString(R.string.app_name) +\n                  \
  \  \" Print Test\";\n        printManager.print(jobName, printAdapter,\n       \
  \             new PrintAttributes.Builder().build());\n    }\n.\n.\n}\n```\n\n代码更改完成后，在运行\
  \ Android 版本 5.0 或更高版本的物理 Android 设备或模拟器上运行应用程序。成功启动后，`WebView` 应该可见并加载指定的网页。页面加载后，从溢出菜单中选择“打印”选项，并使用生成的打印面板将网页打印到合适的目标。\n\
  \n## 76.10 总结\n\nAndroid 打印框架包含了对 `WebView` 类的扩展，使得在 Android 应用程序内部打印基于 HTML 的内容成为可能。这些内容可以是应用程序在运行时动态创建的\
  \ HTML 形式，也可以是加载到 `WebView` 实例中的现有网页。在动态创建 HTML 的情况下，使用 `WebViewClient` 实例非常重要，以确保在\
  \ HTML 完全加载到 `WebView` 之前不会开始打印。\n\n## 77. Android 自定义文档打印指南\n\n正如我们在前面的章节中所看到的，只要内容是图像或\
  \ HTML 标记的形式，Android 打印框架就能让在应用程序中构建打印支持变得相对容易。通过使用打印框架的自定义文档打印功能，可以满足更高级的打印需求。\n\
  \n### 77.1 Android 自定义文档打印概述\n\n简单来说，自定义文档打印使用画布（canvases）来表示要打印的文档页面。应用程序以形状、颜色、文本和图像的形式在这些画布上绘制要打印的内容。事实上，画布是由\
  \ Android `Canvas` 类的实例表示的，从而提供了丰富的绘制选项选择。一旦完成所有页面的绘制，就会打印文档。\n\n虽然这听起来足够简单，但实际上需要执行许多步骤来实现这一目标，这些步骤可以总结如下：\n\
  \n-   实现继承自 `PrintDocumentAdapter` 类的自定义打印适配器\n-   获取打印管理器（Print Manager Service）的引用\n\
  -   创建一个 `PdfDocument` 类的实例，用于存储文档页面\n-   以 `PdfDocument.Page` 实例的形式将页面添加到 `PdfDocument`\n\
  -   获取与文档页面相关的 `Canvas` 对象的引用\n-   在画布上绘制内容\n-   将 PDF 文档写入由打印框架提供的目标输出流\n-   通知打印框架文档已准备好进行打印\n\
  \n在本章中，将提供对这些步骤的概述，随后是一个详细的教程，旨在演示如何在 Android 应用程序中实现自定义文档打印。\n\n#### 77.1.1 自定义打印适配器\n\
  \n打印适配器的作用是为打印框架提供要打印的内容，并确保其根据用户的偏好进行正确格式化（考虑纸张大小和页面方向等因素）。\n\n在打印 HTML 和图像时，大部分工作由\
  \ Android 打印框架提供的打印适配器完成，这些适配器是专为这些特定打印任务设计的。例如，在打印网页时，当我们调用 `WebView` 类实例的 `createPrintDocumentAdapter()`\
  \ 方法时，就会为我们创建一个打印适配器。\n\n然而，在自定义文档打印的情况下，由应用程序开发者负责设计打印适配器并实现绘制和格式化内容以准备打印的代码。\n\
  \n自定义打印适配器通过子类 `PrintDocumentAdapter` 类并重写该类中的一组回调方法来创建，这些方法会在打印过程的不同阶段由打印框架调用。这些回调方法可以总结如下：如下：\n\
  \n-   `onStart()` – 该方法在打印过程开始时被调用，提供的目的是让应用程序代码有机会在创建打印作业之前执行任何必要的任务。在 `PrintDocumentAdapter`\
  \ 子类中实现此方法是可选的。\n-   `onLayout()` – 此回调方法在调用 `onStart()` 方法后调用，并在用户每次更改打印设置（如更改方向、纸张大小或颜色设置）时再次调用。此方法应根据需要调整内容和布局。一旦完成这些更改，方法必须返回要打印的页数。在\
  \ `PrintDocumentAdapter` 子类中实现 `onLayout()` 方法是强制的。\n-   `onWrite()` – 该方法在每次调用\
  \ `onLayout()` 后被调用，负责在要打印页面的画布上渲染内容。除了其他参数外，此方法接收一个文件描述符，渲染完成后必须将生成的 PDF 文档写入该描述符。然后调用\
  \ `onWriteFinished()` 回调方法，并传递有关页面范围的信息。在 `PrintDocumentAdapter` 子类中实现 `onWrite()`\
  \ 方法是强制的。\n-   `onFinish()` – 这是一个可选方法，如果实现，它将在打印过程完成后由打印框架调用一次，从而为应用程序执行任何必要的清理操作提供机会。\n\
  \n### 77.2 准备自定义文档项目\n\n在欢迎界面选择“新建项目（New Project）”，在生成的新项目对话框中选择“空活动（Empty Activity）”模板，然后点击“下一步（Next）”按钮。\n\
  \n在“名称”字段中输入 `CustomPrint`，并将 `com.ebookfrenzy.customprint` 指定包包。在点击“完成（Finish）”按钮之前，将最小\
  \ API 级别设置改为 API 26: Android 8.0 (Oreo)，并将语言菜单设置为 Java。\n\n在布局编辑器工具中加载 `activity_main.xml`\
  \ 布局文件，并在“设计”模式下，选择并删除“Hello World!”TextView 对象。从调色板的表单控件（Form Widgets）部分拖入一个按钮（Button）视图并将其放置在布局视图的中心。选中按钮视图后，将文本属性更改为“Print\
  \ Document”并将该字符串提取到新资源。完成后，用户界面布局应与图 77-1 所示：\n\n![](img/as_4.1_custom_print_ui.jpg)\n\
  \n图 77-1\n\n当应用程序中选择按钮时，将需要调用一个方法来启动文档打印过程。在属性工具窗口中，设置 `onClick` 属性以调用 `printDocument`\
  \ 方法。\n\n## 77.3 创建自定义打印适配器\n\n\n\n\n\n在 Android 应用程序内部打印自定义文档，大部分工作涉及实现自定义打印适配器（custom\
  \ print adapter）。本示例需要一个实现了 `onLayout()` 和 `onWrite()` 回调方法的打印适配器。在 `MainActivity.java`\
  \ 文件中，添加此新类的模板，使其读取内容如下：\n\n```java\npackage com.ebookfrenzy.customprint;\n\n...\n\
  \nimport android.os.CancellationSignal;\nimport android.os.ParcelFileDescriptor;\n\
  import android.print.PageRange;\nimport android.print.PrintAttributes;\nimport android.print.PrintDocumentAdapter;\n\
  import android.content.Context;\n\npublic class MainActivity extends AppCompatActivity\
  \ {\n    public static class MyPrintDocumentAdapter extends PrintDocumentAdapter\
  \ {\n        Context context;\n        MyPrintDocumentAdapter(Context context) {\n\
  \            this.context = context;\n        }\n        @Override\n        public\
  \ void onLayout(PrintAttributes oldAttributes,\n                             PrintAttributes\
  \ newAttributes,\n                             CancellationSignal cancellationSignal,\n\
  \                             LayoutResultCallback callback,\n                 \
  \            Bundle metadata) {\n        }\n        @Override\n        public void\
  \ onWrite(final PageRange[] pageRanges,\n                             final ParcelFileDescriptor\
  \ destination,\n                             final CancellationSignal cancellationSignal,\n\
  \                             final WriteResultCallback callback) {\n        }\n\
  \    }\n}\n...\n```\n\n目前该新类的状态为包含一个构造方法方法，该方法会在创建类的新实例时被调用。构造方法接收调用传入的 `context`\
  \ 作为参数，并将其存储，以便稍后在两个回调方法中引用。\n\n在建立好类的框架后，下一步是开始实现这两个回调方法，从 `onLayout()` 开始。\n\n\
  ## 77.4 实现 onLayout() 回调方法\n\n继续留在 `MainActivity.java` 文件中，首先添加 `onLayout()` 方法中的代码所需的某些导入指令：\n\
  \n```java\npackage com.ebookfrenzy.customprint;\n\n...\n\nimport android.print.PrintDocumentInfo;\n\
  import android.print.pdf.PrintedPdfDocument;\nimport android.graphics.pdf.PdfDocument;\n\
  \npublic class MainActivity extends AppCompatActivity {\n...\n}\n```\n\n接下来，修改 `MyPrintDocumentAdapter`\
  \ 类，声明在 `onLayout()` 方法中使用的变量：\n\n```java\npublic static class MyPrintDocumentAdapter\
  \ extends PrintDocumentAdapter {\n    Context context;\n    int pageHeight;\n  \
  \  int pageWidth;\n    PdfDocument myPdfDocument;\n    int totalpages = 4;\n...\n\
  }\n```\n\n注意，对于本示例而言，将打印一份四页的文档。在更复杂的情况下，应用程序可能需要根据内容的数量、布局相对于用户对纸张尺寸和页面方向的选择，动态计算需要打印的页数。\n\
  \n声明变量后，按照以下代码列表实现 `onLayout()` 方法：\n\n```java\n@Override\npublic void onLayout(PrintAttributes\
  \ oldAttributes,\n                     PrintAttributes newAttributes,\n        \
  \             CancellationSignal cancellationSignal,\n                     LayoutResultCallback\
  \ callback,\n                     Bundle metadata) {\n    myPdfDocument = new PrintedPdfDocument(context,\
  \ newAttributes);\n    pageHeight = newAttributes.getMediaSize().getHeightMils()/1000\
  \ * 72;\n    pageWidth = newAttributes.getMediaSize().getWidthMils()/1000 * 72;\n\
  \    if (cancellationSignal.isCanceled() ) {\n        callback.onLayoutCancelled();\n\
  \        return;\n    }\n    if (totalpages > 0) {\n        PrintDocumentInfo.Builder\
  \ builder = new PrintDocumentInfo\n                .Builder(\"print_output.pdf\"\
  )\n                .setContentType(PrintDocumentInfo.CONTENT_TYPE_DOCUMENT)\n  \
  \              .setPageCount(totalpages);\n        PrintDocumentInfo info = builder.build();\n\
  \        callback.onLayoutFinished(info, true);\n    } else {\n        callback.onLayoutFailed(\"\
  Page count is zero.\");\n}\n```\n\n显然，此方法执行了几项任务，每项任务都需要解释。\n\n首先，以 `PdfDocument`\
  \ 实例的形式创建了一个新的 PDF 文档。当打印框架调用 `onLayout()` 方法时，传入该方法的参数之一是 `PrintAttributes` 类型的对象，它包含了用户为打印输出选择的纸张尺寸、分辨率和颜色设置。这些设置在创建\
  \ PDF 文档时会被使用，并结合我们之前通过构造方法存储的活动 `context`：`myPdfDocument = new PrintedPdfDocument(context,\
  \ newAttributes);`\n\n然后，该方法使用 `PrintAttributes` 对象提取文档页的高度和宽度值。这些维度以英寸分之一英寸的形式存储在对象中。由于本示例中稍后使用这些值的方法是以\
  \ 1/72 英寸为单位的，因此在存储之前对这些数字进行了转换：`pageHeight = newAttributes.getMediaSize().getHeightMils()/1000\
  \ * 72;` 和 `pageWidth = newAttributes.getMediaSize().getWidthMils()/1000 * 72;`。\n\
  \n尽管此示例没有利用颜色选择，但可以通过调用 `PrintAttributes` 对象的 `getColorMode()` 方法获取此属性，该方法将返回 `COLOR_MODE_COLOR`\
  \ 或 `COLOR_MODE_MONOCHROME` 值。\n\n当 `onLayout()` 方法被调用时，会传入一个 `LayoutResultCallback`\
  \ 类型的对象。该对象允许方法通过一组方法将状态信息传回打印框架。例如，如果用户取消打印进程，将会调用 `onLayout()` 方法。进程取消的事是通过 `CancellationSignal`\
  \ 参数中的设置来指示的。如果检测到取消，`onLayout()` 方法必须调用 `LayoutResultCallback` 对象的 `onLayoutCancelled()`\
  \ 方法，通知打印框架已收到取消请求且布局任务已取消：\n\n```java\nif (cancellationSignal.isCanceled() ) {\n\
  \    callback.onLayoutCancelled();\n    return;\n}\n```\n\n当布局工作完成后，该方法需要调用 `LayoutResultCallback`\
  \ 对象的 `onLayoutFinished()` 方法，并传入两个参数。第一个参数是一个 `PrintDocumentInfo` 对象，包含了要打印文档的信息。这些信息包括用于\
  \ PDF 文档的、内容类型（此处为文档而非图像）以及页数。第二个参数是一个布尔值，表示自上次调用 `onLayout()` 方法以来布局是否发生了变化：\n\n\
  ```java\nif (totalpages > 0) {\n    PrintDocumentInfo.Builder builder = new PrintDocumentInfo\n\
  \            .Builder(\"print_output.pdf\")\n            .setContentType(PrintDocumentInfo.CONTENT_TYPE_DOCUMENT)\n\
  \            .setPageCount(totalpages);\n    PrintDocumentInfo info = builder.build();\n\
  \    callback.onLayoutFinished(info, true);\n} else {\n    callback.onLayoutFailed(\"\
  Page count is zero.\");\n}\n```\n\n如果页数为零，代码通过调用 `LayoutResultCallback` 对象的 `onLayoutFailed()`\
  \ 方法向打印框架报告此失败。\n\n\n\n\n`onWrite()` 回调方法负责渲染文档的页面，然后通知打印框架（Printing framework）文档已准备好进行打印。完成后，`onWrite()`\
  \ 方法的内容如下：\n\n```java\npackage com.ebookfrenzy.customprint;\n\nimport java.io.FileOutputStream;\n\
  import java.io.IOException;\n.\n.\n\nimport android.graphics.pdf.PdfDocument.PageInfo;\n\
  .\n.\n\n@Override\npublic void onWrite(final PageRange[] pageRanges,\n         \
  \           final ParcelFileDescriptor destination,\n                    final CancellationSignal\
  \ cancellationSignal,\n                    final WriteResultCallback callback) {\n\
  \    for (int i = 0; i < totalpages; i++) {\n        if (pageInRange(pageRanges,\
  \ i)) {\n            PageInfo newPage = new PageInfo.Builder(pageWidth,\n      \
  \              pageHeight, i).create();\n            PdfDocument.Page page =\n \
  \                   myPdfDocument.startPage(newPage);\n            if (cancellationSignal.isCanceled())\
  \ {\n                callback.onWriteCancelled();\n                myPdfDocument.close();\n\
  \                myPdfDocument = null;\n                return;\n            }\n\
  \            drawPage(page, i);\n            myPdfDocument.finishPage(page);\n \
  \       }\n    }\n    try {\n        myPdfDocument.writeTo(new FileOutputStream(\n\
  \                            destination.getFileDescriptor()));\n    } catch (IOException\
  \ e) {\n        callback.onWriteFailed(e.toString());\n        return;\n    } finally\
  \ {\n        myPdfDocument.close();\n        myPdfDocument = null;\n    }\n    callback.onWriteFinished(pageRanges);\n\
  }\n```\n\n`onWrite()` 方法首先循环遍历文档中的每个页面。然而，重要的是要考虑到用户可能并没有请求打印构成文档的所有页面。事实上，打印框架的用户面板提供了指定打印特定页面或页面范围的选项。例如，图\
  \ 77-2 显示打印面板配置为打印文档的第 1-4 页、第 9 页和第 1-13 页。（image/Image2364.jpg）\n\n### 图 77-2\n\
  \n在将页面写入 PDF 文档时，`onWrite()` 方法必须采取措施以确保只打印用户指定的页面。为了实现这一点，打印框架通过参数传递一个 `PageRange`\
  \ 对象数组，指示要打印的页面范围。在上面的 `onWrite()` 实现中，每个页面都会调用一个名为 `pageInRange()` 的方法，以验证该页面是否在指定的范围内。`pageInRange()`\
  \ 方法的代码将在本章后后实现。\n\n```java\nfor (int i = 0; i < totalpages; i++) {\n    if (pageInRange(pageRanges,\
  \ i)) {\n        // 对于位于任何指定范围内的每个页面，都会创建一个新的 PdfDocument.Page 对象。\n        // 创建新页面时，会将之前由\
  \ onLayout() 方法存储的高度和宽度值作为参数传递，以便使页面大小与用户选择的打印选项匹配：\n        PageInfo newPage =\
  \ new PageInfo.Builder(pageWidth, pageHeight, i).create();\n        PdfDocument.Page\
  \ page = myPdfDocument.startPage(newPage);\n        // 与 onLayout() 方法一样，onWrite()\
  \ 方法需要响应取消请求。\n        // 在这种情况下，代码在关闭并取消引用 myPdfDocument 变量之前，会通知打印框架已执行取消：\n \
  \       if (cancellationSignal.isCanceled()) {\n            callback.onWriteCancelled();\n\
  \            myPdfDocument.close();\n            myPdfDocument = null;\n       \
  \     return;\n        }\n        // 只要打印过程没有被取消，该方法就会在调用 myPdfDocument 对象的 finishPage()\
  \ 方法之前，调用一个方法在当前页面上绘制内容。\n        drawPage(page, i);\n        myPdfDocument.finishPage(page);\n\
  \    }\n}\n```\n\n`drawPage()` 方法负责将内容绘制到页面上，并在 `onWrite()` 方法完成后实现。所需的页面添加到 PDF\
  \ 文档后，将使用作为参数传递给 `onWrite()` 方法的文件描述符写入目标流。如果由于任何原因写入操作失败，该方法将通过调用 `WriteResultCallback`\
  \ 对象（同样作为参数传递给 `onWrite()` 方法）的 `onWriteFailed()` 方法来通知框架。\n\n```java\ntry {\n \
  \   myPdfDocument.writeTo(new FileOutputStream(\n                        destination.getFileDescriptor()));\n\
  } catch (IOException e) {\n    callback.onWriteFailed(e.toString());\n    return;\n\
  } finally {\n    myPdfDocument.close();\n    myPdfDocument = null;\n}\n```\n\n最后，调用\
  \ `WriteResultsCallback` 对象的 `onWriteFinish()` 方法，通知打印框架文档已准备好打印。\n\n## 77.6 检查页面是否在范围内\n\
  \n如前所述，当调用 `onWrite()` 方法时，会传递一个 `PageRange` 对象数组，指示文档中要打印的页面范围。`PageRange` 类设计用于存储页面范围的起始和结束页，反之，可以通过类的\
  \ `getStart()` 和 `getEnd()` 方法进行访问。\n\n在上一节实现 `onWrite()` 方法时，调用了一个名为 `pageInRange()`\
  \ 的方法，该方法接收 `PageRange` 对象数组和页码作为参数。`pageInRange()` 方法的作用是识别指定的页码是否在范围内，它可以在 `MainActivity.java`\
  \ 的 `MyPrintDocumentAdapter` 类中如下实现：\n\n```java\npublic class MyPrintDocumentAdapter\
  \ extends PrintDocumentAdapter {\n.\n.\n    private boolean pageInRange(PageRange[]\
  \ pageRanges, int page) {\n        for (PageRange pageRange : pageRanges) {\n  \
  \          if (page >= pageRange.getStart() && page <= pageRange.getEnd()) {\n \
  \               return true;\n            }\n        }\n        return false;\n\
  \    }\n.\n}\n```\n\n## 7.7 在页面上绘制内容\n\n现在我们到了需要编写代码在页面上绘制内容以准备打印的阶段。所绘制的内容完全取决于应用程序，并限于使用\
  \ `Canvas` 类所能实现的内容。然而，出于示例目的，将在画布上绘制一些文本和图形。`onWrite()` 方法被设计为调用名为 `drawPage()`\
  \ 的方法，该方法将当前页面的 `PdfDocument.Page` 对象和代表页码的整数作为参数。在 `MainActivity.java` 中，该方法现在应实现如下：\n\
  \n```java\npackage com.ebookfrenzy.customprint;\n.\n.\nimport android.graphics.Canvas;\n\
  import android.graphics.Color;\nimport android.graphics.Paint;\npublic class MainActivity\
  \ extends AppCompatActivity {\n.\n.\n    public static class MyDocumentAdapter extends\
  \ PrintDocumentAdapter {\n.\n.\n        private void drawPage(PdfDocument.Page page,\
  \ int pagenumber) {\n            Canvas canvas = page.getCanvas();\n           \
  \ pagenumber++; // 使页从 1 开始\n            int titleBaseLine = 72;\n            int\
  \ leftMargin = 54;\n            Paint paint = new Paint();\n            paint.setColor(Color.BLACK);\n\
  \            paint.setTextSize(40);\n            canvas.drawText(\n            \
  \    \"Test Print Document Page \" + pagenumber,\n                leftMargin,\n\
  \                titleBaseLine,\n```\n\n\n\n\n\n```java\npaint);\npaint.setTextSize(14);\n\
  canvas.drawText(\"This is some test content to verify that custom document printing\
  \ works\", leftMargin, titleBaseLine + 35, paint);\nif (pagenumber % 2 == 0)\n \
  \   paint.setColor(Color.RED);\nelse\n    paint.setColor(Color.GREEN);\nPageInfo\
  \ pageInfo = page.getInfo();\ncanvas.drawCircle(pageInfo.getPageWidth()/2f,\n  \
  \                pageInfo.getPageHeight()/2f,\n                  150,\n        \
  \          paint);\n}\n}\n```\n\n代码中的页码计数从 0 开始。由于文档通常从第 1 页开始，该方法首先对存储的页码进行加。然后获取与页面关联的\
  \ `Canvas` 对象的引用，并声明了一些边距和基准线值：\n\n```java\nCanvas canvas = page.getCanvas();\n\
  pagenumber++;\nint titleBaseLine = 72;\nint leftMargin = 54;\n```\n\n接下来，代码创建了用于绘制的\
  \ `Paint` 和 `Color` 对象，设置字体大小并绘制页面标题文本，包括当前的页码：\n\n```java\nPaint paint = new Paint();\n\
  paint.setColor(Color.BLACK);\npaint.setTextSize(40);\ncanvas.drawText(\"Test Print\
  \ Document Page \" + pagenumber,\n                leftMargin,\n                titleBaseLine,\n\
  \                paint);\n```\n\n随后缩小字体大小并在标题下方绘制了一些正文文本：\n\n```java\npaint.setTextSize(14);\n\
  canvas.drawText(\"This is some test content to verify that document printing works\"\
  , leftMargin, titleBaseLine + 35, paint);\n```\n\n该方法的最后一个任务是绘制一个圆圈（偶数页为红色，奇数页为绿色）。在确定页面是奇数还是偶数后，该方法获取页面的高度和宽度，然后利用这些信息将圆圈位于页面中心：\n\
  \n```java\nif (pagenumber % 2 == 0)\n    paint.setColor(Color.RED);\nelse\n    paint.setColor(Color.GREEN);\n\
  PageInfo pageInfo = page.getInfo();\ncanvas.drawCircle(pageInfo.getPageWidth()/2,\n\
  \                  pageInfo.getPageHeight()/2,\n                  150,\n       \
  \           paint);\n```\n\n绘制画布后，该方法将控制权交还给 `onWrite()` 方法。随着 `drawPage()` 方法的完成，`MyDocumentAdapter`\
  \ 类编写完毕。\n\n## 7.8 启动打印任务\n\n当用户点击“打印文档”按钮时，将调用 `printDocument()` 事件处理器。在开始测试之前，剩下的工作是将此方法添加到\
  \ `MainActivity.java` 文件中，特别注意确保将其放置在 `MyDocumentAdapter` 类之外：\n\n```java\npackage\
  \ com.ebookfrenzy.customprint;\n\nimport android.print.PrintManager;\nimport android.view.View;\n\
  \npublic class MainActivity extends AppCompatActivity {\n    public void printDocument(View\
  \ view) {\n        PrintManager printManager = (PrintManager) this\n           \
  \ .getSystemService(Context.PRINT_SERVICE);\n        String jobName = this.getString(R.string.app_name)\
  \ + \" Document\";\n        printManager.print(jobName, new MyDocumentAdapter(this),\n\
  \                null);\n    }\n}\n```\n\n该方法在创建作为打印任务名称的新 `String` 对象之前，获取了在设备上运行的\
  \ `PrintManager` 服务引用。最后，调用 `PrintManager` 的 `print()` 方法来启动打印任务，传递任务名称和我们自定义文档适配器类的实例。\n\
  \n## 7.9 测试应用程序\n\n在运行 Android 4.4 或更高版本的 Android 设备或模拟器上编译并运行应用程序。应用程序加载后，点击“打印文档”按钮启动打印任务，并为输出选择合适的目标（“保存为\
  \ PDF”选项是避免浪费纸张和打印机墨水的有用选项）。\n\n检查打印输出，它应该包含文本和图形的 4 个页面。例如，图 77-3 显示了作为 PDF 文件查看的文档四页，准备保存到设备上。\n\
  \n尝试其他的打印配置选项，例如在打印面板中更改纸张大小、方向和页面设置。每个设置更改都应反映在打印输出中，这表明自定义文档适配器正在正常工作。\n\n![](img/as_4.1_custom_print_running.jpg)\n\
  \n图 77-3\n\n## 7.10 总结\n\n尽管自定义文档打印比 Android 打印框架的 HTML 和图像打印选项实现起来更复杂，但在从 Android\
  \ 内部打印复杂内容方面，自定义文档打印提供了极大的活性。实现自定义文档打印的大部分工作涉及创建一个自定义 Print Adapter 类，使其不仅能在文档页面上绘制内容，还能在使用更改打印设置（如页面大小和打印页面范围）时做出正确响应。\n\
  \n## 8. Android App Links 简介\n\n随着技术的演进，Web 内容与移动内容之间的传统区别开始模糊。这一点在一个领域尤为明显：随着渐进式\
  \ Web 应用（PWA）的日益流行，Web 应用在外观和行为上与传统的移动应用非常相似。\n\n另一个趋势是让移动应用中的内容可以通过 Web 搜索和 URL\
  \ 链接被发现。在 Android 应用开发的背景下，App Links 功能专门设计用于让用户能够更容易发现并访问存储在 Android 应用中的内容，即使用户没有安装该应用也是。\n\
  \n### 8.1 Android App Links 概述\n\nApp Links 是一种标准的 HTTP URL，旨在从外部源（如网站或应用）直接链接到应用中的特定位置。App\
  \ Links（也称为深度链接）主要用于鼓励用户参与应用并允许用户共享应用内容。\n\nApp Links 的实现是一个多步骤过程，涉及在项目中添加意图过滤器、在关联的应用中实现链接处理代码，以及使用数字资产链接关联应用和\
  \ Web 内容。\n\n这些步骤可以通过手动修改项目来完成，也可以通过 Android Studio App Links 助手自动完成。\n\n本章剩余部分将根据对项目进行的更改概述\
  \ App Links 的实现。\n\n\n\n\n\n```xml\n<activity>\n    <intent-filter>\n        <category\
  \ android:name=\"android.intent.category.BROWSABLE\" />\n        <data\n       \
  \     android:scheme=\"http\"\n            android:host=\"www.example.com\"\n  \
  \          android:pathPrefix=\"/welcome\" />\n    </intent-filter>\n</activity>\n\
  ```\n\n模糊意图过滤器（intent filters）的处理顺序可以使用意图过滤器标签的 `order` 属性进行指定，如下：\n\n```xml\n<application>\n\
  \    <activity android:name=\"com.ebookfrenzy.myapp.MyActivity\">\n        <intent-filter\
  \ android:autoVerify=\"true\" android:order=\"1\">\n            ...\n        </intent-filter>\n\
  \    </activity>\n</application>\n```\n\n意图过滤器将导致应用链接启动正确的 activity，目标 activity\
  \ 中仍需要实现代码以适当处理该意图。\n\n## 78.3 处理 App Link 意图\n\n在大多数情况下，启动的 activity 将需要访问应用链接\
  \ URL，并根据 URL 的结构采取特定操作。接上上面的示例，当通过包含路径 `/welcome/newuser` 的 URL 启动时，该 activity\
  \ 显示的内容可能与路径设置为 `/welcome/existinguser` 的 URL 显示的内容不同。\n\n当通过链接启动 activity 时，它会接收一个\
  \ `intent` 对象，该对象包含关于启动 activity 的操作数据，其中包含包含应用链接 URL 的 `Uri` 对象。在 activity 的初始化阶段，可以添加代码来提取这些数据，如下：\n\
  \n```java\nIntent appLinkIntent = getIntent();\nString appLinkAction = appLinkIntent.getAction();\n\
  Uri appLinkData = appLinkIntent.getData();\n```\n\n获取应用链接的 `Uri` 后，可以使用构成 URL 路径的各种组件来对在\
  \ activity 内要执行的操作做出决策。在下面的代码示例中，URL 的最后一个组件被用于识别是否应该为新用户或现有用户显示内容：\n\n```java\n\
  String userType = appLinkData.getLastPathSegment();\nif (userType.equals(\"newuser\"\
  )) {\n    // 显示新用户内容\n} else {\n    // 显示现有用户内容\n}\n```\n\n## 78.4 将应用与网站关联\n\n\
  在应用链接生效之前，需要将应用链接 URL 与该应用链接所基于的网站关联。这是通过创建一个名为 `assetlinks.json` 的数字资产链接文件并将其安装在网站的\
  \ `.well-known` 文件夹实现的。请注意，数字资产链接仅基于 `https` 的网站。\n\n数字资产链接文件包含一个关系声明（relation statement），允许目标应用使用网站的链接\
  \ URL 启动，以及一个目标声明（target statement），用于声明该项目的伴侣应用包名和 SHA-256 证书指纹。一个典型的资产链接文件可能如下所示：\n\
  \n```json\n[{\n    \"relation\": [\"delegate_permission/common.handle_all_urls\"\
  ],\n    \"target\" : { \n        \"namespace\": \"android_app\",\n        \"package_name\"\
  : \"<此处填写应用包名>\",\n        \"sha256_cert_fingerprints\": [\"<此处填写应用证书>\"]\n    }\n\
  }]\n```\n\n`assetlinks.json` 文件可以包含多个数字资产链接，可能允许单个网站与多个伴侣应用关联。\n\n## 78.5 总结\n\n\
  Android App Links 允许通过来自外部网站或其他应用的 URL 链接启动应用 activity。应用链接的实现结合了项目清单文件中的意图过滤器和启动的\
  \ activity 中的意图处理代码。此外，通过使用数字资产链接文件可以将应用链接中使用的域名与相应的网站关联。一旦建立关联，当使用应用链接时，Android\
  \ 不再需要要求用户选择目标应用。\n\n## 79. Android Studio App Links 教程\n\n本章的目标是为 Android 应用链接和\
  \ Android Studio App Link 助手（App Link Assistant）提供实际演示。\n\n本章将为现有的 Android 应用添加应用链接支持，允许通过应用链接\
  \ URL 启动 activity。除了启动 activity 之外，显示的内容将在 URL 的路径中指定。\n\n### 79.1 关于示例应用\n\n本章使用的项目命名为\
  \ `AppLinking`，是一个基础应用，旨在让用户查找有关伦敦地标的信息。该应用通过标准的 Android 内容提供者（content provider）类访问\
  \ `SQLite` 数据库。该应用提供了一个现有的数据库，其中包含了伦敦一些热门旅游景点的记录。除了现有的数据库条目外，该应用还允许用户添加和删除地标描述。\n\
  \n在当前形式下，该应用允许搜索现有记录并添加和删除新记录。\n\n该项目由两个名为 `AppLinkingActivity` 和 `LandmarkActivity`\
  \ 的 activity 组成。`AppLinkingActivity` 是应用启动时启动的主 activity。该 activity 允许用户输入搜索标准并向数据库添加额外记录。当搜索找到匹配记录时，将启动\
  \ `LandmarkActivity`。\n\n### 79.2 数据库结构\n\n示例应用的数据位于 app -> assets 文件夹下的 `landmarks.db`\
  \ 文件中。数据库包含单张表 `locations`，其结构如表 79-1 所示：\n\n| 列名 | 类型 | 描述 |\n| :--- | :--- | :---\
  \ |\n| _id | String | 主索引，此列包含唯一标识数据库中地标的字符串值。 |\n| title | String | 地标的名称（例如伦敦桥）。\
  \ |\n| description | String | 地标的描述。 |\n| personal | Boolean | 表明记录是私人的还是公共的。用户添加的记录此值设置为\
  \ true。提供的现有记录设置为 false。 |\n\n### 79.3 加载并运行项目\n\n项目位于以下 URL 的示例代码下载存档中的 `AppLinking`\
  \ 文件夹：\n\n[`www.ebookfrenzy.com/retail/eeljava/index.php`](https://www.ebookfrenzy.com/retail/eeljava/index.php)\n\
  \n找到文件夹后，在 Android Studio 中打开它并在设备或模拟器上运行应用。应用启动后，将显示图 79-1 所示的屏幕。\n\n按照目前的实现，地标是通过\
  \ ID 定位的。默认数据库配置当前包含由“londonbridge”和“toweroflondon”引用的记录。通过在 ID 字段输入 londonbridge\
  \ 并点击 Find 按钮来测试搜索功能。当找到匹配记录时，将启动第二个 activity（LandmarkActivity）并传递要显示记录的信息。这些信息以添加到\
  \ `Intent` 对象的额外数据形式存在。\n\n### 79.4 添加 URL 映射\n\n现在已经将应用加载到 Android Studio 并进行了测试，项目已准备好添加应用链接支持。目标是让\
  \ `LandmarkActivity` 屏幕响应应用链接点击启动并显示信息。这是通过将 URL 映射到 `LandmarkActivity` 实现的。对于示例，URL\
  \ 的格式如下：\n\n`http://<website domain>/landmarks/<landmarkId>`\n\n完成所有步骤后，例如以下 URL\
  \ 应该导致应用显示伦敦塔的信息。\n\n\n\n\n\nhttp://www.yourdomain.com/landmarks/toweroflondon\n\
  \n要向项目添加 URL 映射，请先通过 `Tools` -> `App Links Assistant` 菜单选项打开 `App Links Assistant`。打开后，该助手程序将如图\
  \ 79-3 所示：\n\n![](img/as_4.1_app_links_assistant.jpg)\n\n图 79-3\n\n点击 `Open URL\
  \ Mapping Editor` 按钮）按钮以开始将 URL 映射到活动（activity）。在映射屏幕中，点击 `+` 按钮（如图 79-4 所示）来添加新\
  \ URL：\n\n![](img/Image2473.jpg)\n\n图 79-4\n\n在 `Add URL Mapping` 对话框的 `Host` 字段中，输入您自己的网站\
  \ URL。如果您没有自己的网站来供本教程使用，仍然可以使用 `http://www.example.com` 遵循本章的大部分内容，但无法测试需要存在 Digital\
  \ Asset Links 文件的功能。\n\n`Path` 字段（在下图 79-5 中标记为 B）是声明 URL 路径组件的地方。路径必须以 `/` 开头，因此在此字段中输入\
  \ `/landmarks`。\n\n`Path` 菜单（B）提供了以下三个路径匹配选项：\n\n- `path` – URL 必须与 URL 的路径组件完全匹配才能启动活动。例如，如果路径设置为\
  \ `/landmarks`，则 `http://www.example.com/landmarks`将被视为匹配。然而，`http://www.example.com/landmarks/londonbridge`\
  \ URL 将不被视为匹配。\n- `pathPrefix` – 指定的路径仅被视为前缀。在 `/landmarks` 组件之后可能还可以包含额外的路径组件（例如\
  \ `http://www.example.com/landmarks/londonbridge` 仍将被视为匹配）。\n- `pathPattern` – 允许使用基本正则表达式和通配符形式的模式匹配来指定路径，例如\
  \ `landmarks/*/[l-L]ondon/*`\n\n由于此示例中的路径是地标 ID 组件的前缀，请选择 `pathPrefix` 菜单选项。\n\n\
  最后，使用 `Activity` 菜单（C）选择 `LandmarkActivity` 作为响应应用链接时启动的活动：\n\n![](img/Image2481.jpg)\n\
  \n图 79-5\n\n完成对话框中的设置后，点击 `OK` 按钮提交更改。通过在映射屏幕的 `Check URL Mapping` 字段中输入以下 URL（其中\
  \ `<your domain>` 设置为上述 `Host` 字段中指定的域名），检查 URL 格式是否正确并已分配给相应的活动：\n\n`http://<your\
  \ domain>/landmarks/toweroflondon`\n\n如果配置正确，`LandmarkActivity` 将列为已映射的活动：\n\n![](img/Image2489.jpg)\n\
  \n图 79-6\n\n最新版本的 Android 要求同时为 `HTTP` 和 `HTTPS` 协议声明应用链接（App Links），即使只使用了其中一个。因此，在继续下一步之前，请重复上述步骤将\
  \ HTTPS 版本的 URL 添加到列表中\n\n下一步也将在 `App Links Assistant` 的 URL 映射屏幕中进行，因此请保持该屏幕选中状态。\n\
  \n## 79.5 添加 Intent Filter\n\n如前一节所述，需要意图过滤器（intent filter）来允许响应应用链接点击启动目标活动。事实上，当添加\
  \ URL 映射时，意图过滤器已自动添加到项目清单文件中。在 `App Links Assistant` URL 映射列表中选中 URL 映射，向下滚动屏幕直到意图过滤器的预览（Preview）部分进入视野。预览应包含修改后的\
  \ `AndroidManifest.xml` 文件，其中包含了新添加的意图过滤器：\n\n![](img/Image2496.jpg)\n\n图 79-7\n\
  \n尽管 App Links Assistant 为我们添加了意图过滤器，但它可能包含处理应用链接时所需的 `autoVerify` 设置。打开 `manifests\
  \ -> AndroidManifest.xml` 文件，并如下所示向两个意图过滤器添加此设置：\n\n```xml\n<intent-filter android:autoVerify=\"\
  true\">\n    .\n    .\n    <data\n        android:scheme=\"http\"\n        android:host=\"\
  www.ebookfrenzy.com\"\n        android:pathPrefix=\"/landmarks\" />\n</intent-filter>\n\
  \n<intent-filter android:autoVerify=\"true\">\n    .\n    .\n    <data\n       \
  \ android:scheme=\"https\"\n        android:host=\"www.ebookfrenzy.com\"\n     \
  \   android:pathPrefix=\"/landmarks\" />\n</intent-filter>\n```\n\n## 79.6 添加 Intent\
  \ 处理代码\n\n到目前为止的操作确保了在响应格式正确的应用链接 URL 时会启动正确的活动。下一步是在 `LandmarkActivity` 类中处理意图（intent），以便从数据库中提取正确的记录并将其显示给用户。在修改\
  \ `LandmarkActivity.java` 文件中的任何代码之前，审查现有代码某些区域是值得的。在代码编辑器中打开 `LandmarkActivity.java`\
  \ 文件并找到 `onCreate()` 和 `handleIntent()` 方法，它们目前的内容如下：\n\n```java\n@Override\nvoid\
  \ onCreate(Bundle savedInstanceState) {\n    super.onCreate(savedInstanceState);\n\
  \    binding = ActivityLandmarkBinding.inflate(getLayoutInflater());\n    View view\
  \ = binding.getRoot();\n    setContentView(view);\n    handleIntent();\n}\n\nprivate\
  \ void handleIntent(Intent intent) {\n    String landmarkId = intent.getStringExtra(AppLinkingActivity.LANDMARK_ID);\n\
  \    displayLandmark(landmarkId);\n}\n```\n\n在当前形式下，代码期望在 `Intent` 的额外数据（extra）中找到地标\
  \ ID。由于活动现在可以通过应用链接启动，此代码需要更改以处理这两种情况。从删除 `onCreate()` 方法中的 `handleIntent()` 调用开始：\n\
  \n```java\n@Override\nvoid onCreate(Bundle savedInstanceState) {\n    super.onCreate(savedInstanceState);\n\
  \    binding = ActivityLandmarkBinding.inflate(getLayoutInflater());\n    View view\
  \ = binding.getRoot();\n    setContentView(view);\n}\n```\n\n要添加初始的应用链接处理代码，返回 App\
  \ Links Assistant 面板并点击步骤 2 下列出的 `Select Activity` 按钮。在活动选择对话框中，点击 `Insert Code`\
  \ 按钮之前选择 `LandmarkActivity` 条目：\n\n![](img/Image2504.jpg)\n\n图 79-8\n\n返回 `LandmarkActivity.java`\
  \ 文件，注意以下代码已插入到 `onCreate()` 方法（如果 Android Studio 无法完成请求，您可以手动添加这些代码）：\n\n```java\n\
  // ATTENTION: 这是自动生成的用于处理应用链接的代码\nIntent appLinkIntent = getIntent();\nString appLinkAction\
  \ = appLinkIntent.getAction();\nUri appLinkData = appLinkIntent.getData();\n```\n\
  \n此代码访问 `Intent` 对象并提取 Action 字符串和 Uri。如果活动启动是应用链接的结果，action 字符串将设置为 `android.intent.action.VIEW`，这与意图过滤器中声明的\
  \ action 相匹配。如果活动是通过主活动 `findLandmark()` 方法中的标准意图启动的，则 action 将为 `null`。通过检查赋值给\
  \ action 的值，可以编写代码识别启动方式并采取相应行动：\n\n```java\nimport android.net.Uri;\n\n@Override\n\
  void onCreate(Bundle savedInstanceState) {\n    super.onCreate(savedInstanceState);\n\
  \    // ATTENTION: 这是自动生成的用于处理应用链接的代码\n    Intent appLinkIntent = getIntent();\n\
  \    String appLinkAction = appLinkIntent.getAction();\n    Uri appLinkData = appLinkIntent.getData();\n\
  \    String landmarkId = appLinkData.getLastPathSegment();\n    if (landmarkId !=\
  \ null) {\n        displayLandmark(landmarkId);\n    }\n}\n```\n\n剩下的是在方法中添加一些额外的代码以识别应用链接\
  \ URL 路径中的最后一个组件，并将其作为查询数据库时的地标 ID：\n\n\n\n\n\n```java\nprotected void onCreate(Bundle\
  \ savedInstanceState) {\n    // ATTENTION: This was auto-generated to handle app\
  \ links.\n    Intent appLinkIntent = getIntent();\n    String appLinkAction = appLinkIntent.getAction();\n\
  \    Uri appLinkData = appLinkIntent.getData();\n    if (appLinkAction != null)\
  \ {\n        if (appLinkAction.equals(\"android.intent.action.VIEW\")) {\n     \
  \       String landmarkId = appLinkData.getLastPathSegment();\n            if (landmarkId\
  \ != null) {\n                displayLandmark(landmarkId);\n            }\n    \
  \    }\n    } else {\n        handleIntent(appLinkIntent);\n    }\n}\n```\n\n如果\
  \ action 字符串不为空，则会检查验证其是否设置为 `android.intent.action.VIEW`，然后提取 `Uri` 路径的最后一个组件。该组件随后在进行数据库查询时用作\
  \ `landmarkId`。相反，如果 action 字符串为空，则调用现有的 `handleIntent()` 方法从 `intent` 数据中提取 ID。\n\
  \n# 79.7 测试应用程序\n\n在设备或模拟器上运行程序，并确保仍然可以搜索示例地标。我们现在已成功为应用程序添加了应用链接（app link）支持。如果你为应用链接指定了了自己的网站\
  \ URL，我们现在可以通过创建并安装数字资产链接（Digital Asset Links）文件来更进一步。\n\n# 79.8 创建数字资产链接文件\n\n\
  正如“Android Intents 概述”章节概述的，为了完全支持应用链接，我们需要在应用链接中引用的网站上安装一个数字资产链接文件。首先，按照“Android\
  \ Intents 概述”中列出的步骤找到你的 `debug.keystore` 文件并识别你的 `SHA256` 数字指纹。\n\n接下来，在网络浏览器中打开以下页面：\n\
  \n`https://developers.google.com/digital-asset-links/tools/generator`\n\n页面加载后，将你的网站\
  \ URL 输入到 Hosting site domain 字段，将 `com.ebookfrenzy.applinking` 作为 App 包名，并将你的 `SHA256`\
  \ 数字指纹输入到 App package fingerprint (`SHA256`) 字段中：\n\n![](img/asset_file_generator.jpg)\n\
  \n图 79-9\n\n点击 `Generate` 语句按钮显示生成的语句，并将其放在名为 `assetlinks.json` 的文件中，位于你 Web 服务器上的\
  \ `.well-known` 文件夹中。返回生成器页面并点击 `Test` 语句按钮以验证文件是否位于正确位置。如果测试成功，将出现类似下面的输出：\n\n\
  ![](img/asset_file_link_test.jpg)\n\n图 79-10\n\n假设测试成功，我们现在准备好尝试应用链接了。\n\n# 79.9\
  \ 测试应用链接\n\n通过返回应用链接助手（App Links Assistant）面板并点击 `Test App Links` 按钮来测试 intent 处理是否正常工作。在提示输入测试\
  \ URL 时，在点击 `Run Test` 按钮之前，输入（使用应用链接映射中引用的域名）`londonbridge` 地标 ID 的 URL：\n\n![](img/Image2513.jpg)\n\
  \n图 79-11\n\n点击按钮后，地标活动（Landmark activity）将在设备或模拟器上启动并显示关于伦敦桥（London Bridge）的信息。\n\
  \n# 79.0 总结\n\n本章演示了在 Android 应用程序项目中实现应用链接支持的步骤。本章涵盖的内容包括在 Android Studio 中使用应用链接助手、应用链接\
  \ URL 映射、intent 过滤器、使用数字资产链接文件项处理网站关联，以及应用链接测试。\n\n# 80. Android 生物识别认证教程\n\n触摸传感器现在已内置许多\
  \ Android 设备中，用于识别用户并提供对设备和应用程序功能的访问，例如使用指纹识别的应用内支付选项。指纹识别当然是许多不同认证方法之一，还包括密码、PIN\
  \ 码以及最近的面部识别。\n\n尽管目前市场上只有少数 Android 设备提供面部识别，但这在不久的将来可能会变得更加常见。针对此，Google 已开始从以指纹为中心的应用添加认证的方法，转向一种更具通性的方法，称为生物识别认证。在\
  \ Android 8 的初始发布版本中，这些生物识别功能仅涵盖指纹认证，但这将在 Android 操作系统和 SDK 的后续版本和更新中发生变化。\n\n本章提供了生物识别认证的概述，并提供了一个详细的逐步教程，演示了在\
  \ Android 应用程序项目中实现生物识别认证的实用方法。\n\n## 80.1 生物识别认证概述\n\n关键生物识别认证组件是 `BiometricPrompt`\
  \ 类。该类执行了许多在早期 Android 版本中必须通过编写代码完成的工作，包括显示标准对话框引导用户完成认证过程、执行认证并报告结果。该类处理了过度频繁的认证失败尝试，并在用户再次尝试之前强制超时。\n\
  \n`BiometricPrompt` 类包含一个伴随类 `Builder`，可以使用它来配置和创建 `BiometricPrompt` 实例，包括定义在认证对话框中显示的文本以及对对话框中出现的取消按钮（也称为负按钮）进行自定义。\n\
  \n`BiometricPrompt` 实例还被分配了一组认证回调（callbacks），这些回调将被调用以为应用程序提供认证结果。还使用了 `CancellationSignal`\
  \ 实例允许应用程序在认证处理过程中取消认证。\n\n在介绍这些基础知识后，本章剩余部分将在示例项目中实现基于指纹的生物识别。\n\n## 80.2 创建生物识别项目\n\
  \n在欢迎屏幕上选择 `New Project` 选项，并在新项目对话框中选择 `Empty Activity` 模板，然后点击 `Next` 按钮。\n\n\
  在 `Name` 字段中输入 `BiometricDemo`，并指定 `com.ebookfrenzy.biometricdemo` 为包名。在点击 `Finish`\
  \ 按钮之前，将 `Minimum API` 级别设置为 `API 29: Android 9.0 (Pie)`并将 `Language` 设置为 `Java`。\n\
  \n## 80.3 配置设备指纹认证\n\n指纹认证仅适用于带有触摸传感器且已采取相应配置步骤保护设备并录入至少一个指纹设备。有关配置模拟器测试指纹认证的步骤，请参阅“使用和配置\
  \ Android Studio AVD 模拟器”。\n\n要在物理设备上配置指纹认证，首先打开 `Settings` 应用并选择 `Security` 选项。在\
  \ `Security` 设置屏幕内，选择 `Fingerprint` 选项。在启用指纹安全之前，必须配置备份屏幕解锁方法（例如 PIN 码）。如果锁屏尚未加密，请按照步骤配置\
  \ `PIN`、`pattern` 或 `password` 安全。\n\n在锁屏加密后，继续进入指纹检测屏幕，并在提示时触摸传感器（见图 80-1），根据需要重复此过程以添加更多指纹。\n\
  \n## 80.4 向 Manifest 文件添加生物识别权限\n\n\n\n\n\n生物识别身份验证要求在项目清单文件中请求 `USE_BIOMETRIC`\
  \ 权限。在 Android Studio 项目工具窗口中找到并编辑 `app` -> `manifests` -> `AndroidManifest.xml`\
  \ 文件，按如下方式添加权限请求：\n\n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<manifest\
  \ xmlns:android=\"http://schemas.android.com/apk/res/android\"\n    package=\"com.ebookfrenzy.biometricdemo\"\
  >\n    <uses-permission        android:name=\"android.permission.USE_BIOMETRIC\"\
  \ />\n</manifest>\n```\n\n## 80.5 设计用户界面\n\n为了保持示例尽可能简单，用户界面中唯一的视觉元素将是一个 `Button`\
  \ 视图。找到并选择 `activity_main.xml` 布局资源文件，将其加载到布局编辑器（Layout Editor）工具中。\n\n删除示例 `TextView`\
  \ 对象，从调色板（palette）的 Common 类别拖入一个 `Button` 对象，并将其放置在布局画布的中心。使用 `Attributes` 属性窗口，将按钮上的\
  \ `text` 属性更改为“Authenticate”，并将字符串提取到资源中。最后，配置 `onClick` 属性以调用名为 `authenticateUser`\
  \ 的方法。\n\n完成上述步骤后，布局应与图 80-2 所示所示：\n\n![](img/as_4.1_biometric_demo_ui.jpg)\n\n\
  图 80-2\n\n## 80.6 添加 Toast 便利方法\n\n在此示例代码的各个位置，应用程序将设计为通过 `Toast` 消息向用户显示信息。为了避免多次重复相同的\
  \ `Toast` 代码，将在主 Activity 中添加一个名为 `notifyUser()` 的便利方法。该方法将接受单个 `String` 值并以 `Toast`\
  \ 消息的形式显示给用户。现在编辑 `MainActivity.java` 文件并按如下添加此方法：\n\n```java\nimport android.widget.Toast;\n\
  \nprivate void notifyUser(String message) {\n    Toast.makeText(this,\n        \
  \    message,\n            Toast.LENGTH_LONG).show();\n}\n```\n\n## 80.7 检查安全设置\n\
  \n在本章前面的部分，已经采取了步骤在配置测试应用程序的设备或模拟器上设置锁屏并注册指纹。然而，在应用中包含防御性代码以确保在尝试请求指纹身份验证之前已满足这些要求。这些步骤将在\
  \ `MainActivity.java` 文件中的 `onCreate` 方法中执行，利用 `Keyguard` 和 `PackageManager` 管理服务。注意，还添加了代码来验证是否为应用配置了\
  \ `USE_BIOMETRIC` 权限：\n\n```java\npackage com.ebookfrenzy.biometricdemo;\n\nimport\
  \ androidx.appcompat.app.AppCompatActivity;\nimport androidx.core.app.ActivityCompat;\n\
  import android.widget.Toast;\nimport android.Manifest;\nimport android.content.pm.PackageManager;\n\
  import android.app.KeyguardManager;\n\npublic class MainActivity extends AppCompatActivity\
  \ {\n    @Override\n    protected void onCreate(Bundle savedInstanceState) {\n \
  \       super.onCreate(savedInstanceState);\n        setContentView(R.layout.activity_biometric_demo);\n\
  \        checkBiometricSupport();\n    }\n\n    private void checkBiometricSupport()\
  \ {\n        KeyguardManager keyguardManager =\n                (KeyguardManager)\
  \ getSystemService(KEYGUARD_SERVICE);\n        if (!keyguardManager.isKeyguardSecure())\
  \ {\n            notifyUser(\"Lock screen security not enabled in Settings\");\n\
  \        }\n        if (ActivityCompat.checkSelfPermission(this,\n             \
  \   Manifest.permission.USE_BIOMETRIC) !=\n                PackageManager.PERMISSION_GRANTED)\
  \ {\n            notifyUser(\"Fingerprint authentication permission not enabled\"\
  );\n        }\n    }\n}\n```\n\n上述代码首先使用 `Keyguard` 管理器验证是否已配置了备用解锁方法（也就是说，可以使用\
  \ PIN 或其他身份验证方法作为指纹的备选方案来解锁屏幕）。如果锁屏未加密，代码将向用户报告问题并退出方法。然后，该方法将使用包管理器检查用户是否已为应用启用了生物识别权限，以验证设备上可以使用指纹身份验证。\n\
  \n## 0.8 配置回调函数\n\n当配置生物识别提示时，需要分配一组身份验证回调，这些回调可以被调用以通知应用程序过程的成功或失败。这些方法需要封装在 `BiometricPrompt.AuthenticationCallback`\
  \ 实例中。继续留在 `MainActivity.java` 文件中，添加一个方法来创建并返回一个实现了相应方法的类实例：\n\n```java\nimport\
  \ android.hardware.biometrics.BiometricPrompt;\n\nprivate BiometricPrompt.AuthenticationCallback\
  \ getAuthenticationCallback() {\n    return new BiometricPrompt.AuthenticationCallback()\
  \ {\n        @Override\n        public void onAuthenticationError(int errorCode,\
  \ CharSequence errString) {\n            notifyUser(\"Authentication error: \" +\
  \ errString);\n            super.onAuthenticationError(errorCode, errString);\n\
  \        }\n        @Override\n        public void onAuthenticationHelp(int helpCode,\
  \ CharSequence helpString) {\n            super.onAuthenticationHelp(helpCode, helpString);\n\
  \        }\n        @Override\n        public void onAuthenticationFailed() {\n\
  \            super.onAuthenticationFailed();\n        }\n        @Override\n   \
  \     public void onAuthenticationSucceeded(BiometricPrompt.AuthenticationResult\
  \ result) {\n            notifyUser(\"Authentication Succeeded\");\n           \
  \ super.onAuthenticationSucceeded(result);\n        }\n    };\n}\n```\n\n## 80.9\
  \ 添加 CancellationSignal\n\n一旦启动，生物识别过程将独立于应用程序运行。为了给应用程序提供取消操作的方法，创建了 `CancellationSignal`\
  \ 类的实例并将其传递给生物识别过程。然后该 `CancellationSignal` 实例可以在需要时用于取消过程。\n\n取消信号实例可以配置一个监听器，在取消完成时调用。在\
  \ Activity 类中添加一个新方法，按如下方式配置并返回 `CancellationSignal` 对象：\n\n```java\nimport android.os.CancellationSignal;\n\
  \nprivate CancellationSignal cancellationSignal;\n\nprivate CancellationSignal getCancellationSignal()\
  \ {\n    cancellationSignal = new CancellationSignal();\n    cancellationSignal.setOnCancelListener(()\
  \ -> notifyUser(\"Cancelled via signal\"));\n    return cancellationSignal;\n}\n\
  ```\n\n## 8.10 启动生物识别提示\n\n最后是在 `authenticateUser()` 方法中添加代码以创建并配置 `BiometricPrompt`\
  \ 实例并启动身份验证。按如下方式添加 `authenticateUser()` 方法：\n\n```java\nimport android.view.View;\n\
  \npublic void authenticateUser(View view) {\n    BiometricPrompt biometricPrompt\
  \ = new BiometricPrompt.Builder(this)\n            .setTitle(\"Biometric Demo\"\
  )\n            .setSubtitle(\"Authentication is required to continue\")\n      \
  \      .setDescription(\"This app uses biometric authentication to protect your\
  \ data.\")\n            .setNegativeButton(\"Cancel\", this.getMainExecutor(),\n\
  \                (dialogInterface, i) -> notifyUser(\"Authentication cancelled\"\
  ))\n            .build();\n\n    biometricPrompt.authenticate(getCancellationSignal(),\
  \ getMainExecutor(),\n            getAuthenticationCallback());\n}\n```\n\n\n\n\n\
  \n`BiometricPrompt.Builder` 类用于创建一个新的 `BiometricPrompt` 实例，该实例可以配置标题、副标题和描述文本，显示在提示对话框中。负按钮被配置为显示“取消”（Cancel）文本，并配置了一个监听器，在点击此按钮时显示消息。最后，调用\
  \ `BiometricPrompt` 实例的 `authenticate()` 方法，并传入 `AuthenticationCallback` 和 `CancellationSignal`\
  \ 实例。生物识别提示还需要知道在哪个线程上执行身份验证。这通过传递一个配置了所需线程的 `Executor` 对象来定义。在这种情况下，使用 `getMainExecutor()`\
  \ 方法将主 `Executor` 对象传递给 `BiometricPrompt` 实例，以便身份验证过程在应用的主线程上进行。\n\n###  80.11 测试项目\n\
  \n项目现在完成后，请在物理 Android 设备或模拟器会话上运行应用程序，点击“身份验证”（Authenticate）按钮显示如图 80-3 所示的 `BiometricPrompt`\
  \ 对话框：\n\n![](img/as_3.2_biometric_prompt.jpg)\n\n图 80-3\n\n运行后，可以触摸指纹传感器或使用模拟器内的扩展控制面板来模拟指纹触摸，正如标题为使用和配置\
  \ Android Studio AVD 模拟器”的章节所述。假设检测到已注册的指纹，提示对话框将返回主活动，此时将显示来自成功身份验证回调方法的吐司提示消息（toast\
  \ message）。\n\n再次点击“身份验证”按钮，这次使用未注册的指纹尝试进行身份验证。这一次，生物识别提示对话框将指示指纹未被识别：\n\n![](img/as_3.2_biometric_prompt_failed.jpg)\n\
  \n图 80-4\n\n通过点击生物识别对话框之外的活动区域来验证错误处理回调是否正常工作。提示对话框将消失，并弹出带有以下消息：\n\n身份验证错误：用户取消了指纹操作。\n\
  \n检查使用“取消”（Cancel）按钮取消提示对话框是否会触发“身份验证取消”（Authentication Canceled）吐司消息。最后，尝试使用未注册的指纹多次进行身份验证，并注意在尝试多次后，提示对话框会指示失败过多，在稍后之前无法进行后续尝试。\n\
  \n### 80.12 总结\n\n本章概述了如何将生物识别身份验证集成到 Android 应用项目中。这涉及 `BiometricPrompt` 类的使用，该类一旦配置了适当的消息文本和回调，就能自动处理大部分身份验证过程。\n\
  \n# 81. 创建、测试和上传 Android App Bundle\n\n一旦 Android 应用程序的开发工作完成，并在各种 Android 设备上通过了测试，下一步是准备将应用程序提交到\
  \ Google Play。然而，在提交之前，必须先对应用程序进行发布打包并使用私钥进行签名。本章将详细介绍获取私钥、为项目准备 Android App Bundle\
  \ 以及将其上传到 Google Play 的步骤。\n\n#### 81.1 发布准备流程\n\n在本书到目前为止，我们一直在以适用于测试和调试的模式构建应用程序项目。相比之下，为了通过\
  \ Google Play 向客户发布应用程序包，需要采取一些额外的步骤。第一个要求是应用程序必须以发布模式（release mode）而非调试模式（debug\
  \ mode）编译。其次，应用程序必须使用唯一标识你作为应用开发者的私钥进行签名。最后，应用程序必须打包成 Android App Bundle。\n\n虽然这些任务都可以在\
  \ Android Studio 环境之外执行，但正如本章其余部分所述，使用 Android Studio 构建机制可以更方便地完成这些操作。不过，重要的是进一步了解\
  \ Android App Bundles。\n\n#### 81.2 Android App Bundles\n\n当用户从 Google Play 安装应用时，应用是以\
  \ `APK` 文件的形式下载的。该文件包含了在设备上安装和运行应用所需的所有内容。在 Android Studio 3.2 引入之前，开发者生成一个或多个 `APK`\
  \ 文件并上传到 Google Play。为了支持多种设备类型、屏幕尺寸和语言，这需要为每个目标创建并上传多个 `APK` 文件，或者生成一个包含所有配置资源和平台二进制文件的巨大通用\
  \ APK。\n\n创建多个 `APK` 文件涉及大量工作，且每当应用需要更新时都要重复，增加了发布流程的开销。\n\n通用 APK 方案虽然减轻了开发者的负担，但引发了一个完全意外的问题。通过分析应用安装指标，Google\
  \ 发现安装 APK 文件越大（导致下载时间延长和存储占用增加），转化率就越低。转化率定义为在 Google Play 查看应用后完成安装的用户百分比。事实上，Google\
  \ 估计 APK 文件大小每增加 6MB，应用的转化率就会下降 1%。\n\nAndroid App Bundles 解决了这两个问题，它提供了一种方法，让开发者可以在\
  \ Android Studio 中创建一个单个包，并由 Google Play 自动生成自定义 `APK` 文件（该概念被称为动态交付，Dynamic Delivery）。\n\
  \nAndroid App Bundle 本质上是一个 ZIP 文件，包含了为项目中支持的所有设备和语言构建 `APK` 文件所需的所有文件。例如，项目可能包含不同屏幕尺寸的资源和图像。当用户安装应用时，Google\
  \ Play 会接收有关用户设备的信息，包括显示、处理器架构和语言。利用这些信息，预生成的 `APK` 文件将传输到用户的设备上。\n\n#### 81.3 注册\
  \ Google Play 开发者控制台账户\n\n\n\n\n应用程序提交流程的第一步是创建一个 Google Play 开发者控制台账号。为此，请访问 [`play.google.com/apps/publish/signup/`](https://play.google.com/apps/publish/signup/)\
  \ 并按照说明完成注册过程。请注意，注册需要支付 25 美元的一次费用。一旦应用程序开始销售，Google 将保留与应用程序相关的所有收入的 30%。账户创建后，可以通过\
  \ [`play.google.com/console`](https://play.google.com/console%20) 访问开发者控制台。\n\n\
  下一步是收集有关应用程序的信息。为了将您的应用程序推向市场，需要以下信息：\n\n- **标题** – 应用程序的标题。\n- **简短说明** - 最多 80\
  \ 个字的应用程序描述。\n- **完整说明** – 最多 4000 个字的应用程序描述。\n- **截图** – 最多 8 张应用程序运行的截图（至少需要 2\
  \ 张）。Google 建议提交应用程序在 7 英寸或 10 英寸平板电脑上运行的截图。\n- **语言** – 应用程序的语言（默认为美式英语）。\n- **推广文本**\
  \ – 当您的应用程序出现在 Google Play 环境内的特殊推广功能时将使用的文本。\n- **应用程序类型** – 您的应用程序被视为游戏还是应用程序。\n\
  - **类别** – 最能描述您应用程序的类别（例如金融、健康与健身、教育、体育等）。\n- **地区** – 您希望提供应用程序供购买的地理位置。\n- **联系详情**\
  \ – 用户通过哪些方式联系您获取有关应用程序的支持。选项包括网页、电子邮件和电话。\n- **定价与发布** – 关于应用程序价格以及拟营销和销售的地理位置的信息。\n\
  \n收集上述信息后，点击 Google Play 控制台中的 `Create app`（创建应用）按钮开始创建过程。\n\n## 81.4 在控制台中配置应用程序\n\
  \n首次点击 `Create app` 按钮时，将显示应用程序详情和声明屏幕，如下方的图 81-1 所示：\n\n![](img/as_4.1_play_create_app.jpg)\n\
  \n图 81-1\n\n一旦完全配置了应用程序项目，点击 `Create app` 按钮（如上图高亮所示）添加应用程序并显示仪表板屏幕。在仪表板中，找到 `Initial\
  \ setup`（初始设置）部分并展开步骤列表以配置应用商店列目：\n\n![](img/as_4.1_play_app_initial_steps.jpg)\n\
  \n图 81-2\n\n完成列表中的链接并为您的应用程序提供所需信息，并确保在每一步都保存更改。\n\n## 81.5 启用 Google Play 应用签名\n\
  \n直到最近，Google Play 的上传文件是在 Android Studio 内部使用发布应用签名密钥进行签名，然后上传到 Google Play 控制台。虽然此选项仍然可用，但现在推荐的上传方法是使用称为“Google\
  \ Play 应用签名”（Google Play App Signing）的过程。对于新创建的应用程序，这涉及选择 Google Play 应用签名，然后生成一个上传密钥，用于在\
  \ Android Studio 中签名应用程序包文件（app bundle）。当上传 Android Studio 生成的应用程序包文件时，Google Play\
  \ 控制台将移除上传密钥，然后使用安全存储在 Google Play 服务器中的应用签名密钥对文件进行签名。对于现有应用程序，启用 Google Play 签名还需要一些额外的步骤，将在本章末尾介绍。\n\
  \n在 Google Play 控制台中，从 `All Apps`（所有应用）屏幕（通过左侧导航面板顶部选项访问）选择新添加的应用程序项目，展开 `Setup`（设置）部分（图\
  \ 81-3 中标记为 A），并选择 `App Signing`（应用签名）选项（B）。\n\n![](img/as_4.1_play_enable_app_signing.jpg)\n\
  \n图 81-3\n\n点击 `Create release`（创建发布）按钮（C）启用 Google Play 应用签名。控制台现在准备好为您的应用程序创建第一个测试发布。然而，在此之前，下一步是在\
  \ Android Studio 内部生成上传密钥。这是生成签名应用程序包过程的一部分。请保持当前 Google Play 控制台屏幕加载在浏览器中，因为我们将在本章稍后返回此处。\n\
  \n## 81.6 创建 Keystore 文件\n\n要创建 keystore 文件，选择 Android Studio 中的 `Build`（构建）-> `Generate\
  \ Signed Bundle / APK…`（生成签名包/APK…）菜单选项，以显示 `Generate Signed Bundle or APK Wizard`\
  \ 对话框，如图 81-4 所示：\n\n![](img/android_studio_3.2_select_app_bundle.jpg)\n\n图 81-4\n\
  \n在点击 `Next`（下一步）按钮之前，验证已选择 `Android App Bundle`（Android 应用包）选项。\n\n如果您已有发布 keystore\
  \ 文件，点击下一个屏幕上的 `Choose existing…`（选择现有…）按钮并导航选择该文件。如果您尚未创建 keystore 文件，点击 `Create\
  \ new…`（创建新…）显示 `New Key Store`（新建密钥库）对话框（图 81-5）。点击 `Key store path`（密钥库路径）字段右侧的按钮，导航到文件系统上的合适位置，为\
  \ keystore 文件命名，然后点击 `OK`。\n\n`New Key Store` 对话框分为两个部分。上半部分涉及密钥库文件。在此部分，输入保护密钥库的强密码到\
  \ `Password` 和 `Confirm` 字段中。下半部分涉及存储在密钥库中的上传密钥。\n\n![](img/Image2483.jpg)\n\n图\
  \ 81-5\n\n在 `New Key Store` 对话框的 `Key`（密钥）部分，输入以下信息：\n\n- 用于引用密钥的 `alias`（别名）。可以是任何字符序列，但系统仅使用前\
  \ 8 个。\n- 保护密钥的适强密码。\n- 密钥有效期（Google 建议超过 25 年）。\n\n此外，必须为剩余字段中的至少一个提供信息（例如，您的姓名或组织名称）。\n\
  \n![](img/Image24921.jpg)\n\n图 81-6\n\n输入完成后，点击 `OK` 按钮继续创建包。\n\n## 81.7 创建 Android\
  \ 应用包\n\n下一步是指示 Android Studio 以发布模式构建应用程序包文件，然后使用新创建的私钥对其进行签名。此时，`Generate Signed\
  \ Bundle or APK` 对话框应已填充了 `keystore path`、`passwords` 和 `alias` 字段的信息：\n\n![](img/android_studio_3.2_keystore_info.jpg)\n\
  \n图 81-7\n\n确保启用了 `Export Encrypted Key`（导出加密密钥）选项，并在假设其他设置正确的情况下，点击 `Next` 按钮继续包生成（图\
  \ 81-8）。在此屏幕上，检查 `Destination Folder:`（目标文件夹）设置，以验证生成应用程序包文件的位置可以接受。如果喜欢其他位置，点击文本字段右侧的按钮导航到所需的文件系统位置。\n\
  \n![](img/android_studio_3.2_generate_app_bundle.jpg)\n\n图 81-8\n\n点击 `Finish` 按钮等待\
  \ Gradle 系统 构建应用包。构建完成后，将弹出一个对话框，提供在资源管理器中打开包含包文件文件夹的选项，或将文件加载到 APK 分析器中：\n\n![](img/android_studio_3.2_app_bundle_generated.jpg)\n\
  \n图 81-9\n\n\n\n\n此时，应用程序已准备好提交到 Google Play。点击“定位”（locate）链接打开文件系统浏览器窗口。该文件应命名为\
  \ `bundle.aab` 并位于项目文件夹的 `app/release` 子目录下，除非另有指定其他位置。\n\n在此过程中生成的私钥应在未来签名和发布后续应用程序时使用，因此，应将其保存在安全的地方并进行安全备份。\n\
  \n## 81.8 生成测试 APK 文件\n\n此阶段的一个可选步骤是从应用包（app bundle）生成 APK 文件，并地地在设备或模拟器会话上安装和运行它们。Google\
  \ 提供了一个名为 `bundletool` 的命令行工具，专门为此目的设计，可以从以下 URL 下载：\n\nhttps://github.com/google/bundletool/releases\n\
  \n在写作时，`bundletool` 以 `.jar` 文件的形式提供，可以如下方式从命令行执行（注意：自本书出版以来，版本号可能已经发生变化）：\n\n```\n\
  java -jar bundletool-all-0.9.0.jar\n```\n\n运行上述命令将列出该工具中可用的所有选项。要从应用包生成 APK 文件，需使用\
  \ `build-apks` 选项。为了生成可以安装到设备或模拟器上的 APK 文件，这些文件还需要经过签名。为了实现这一点，请包含 `--ks` 选项以指定在本节之前创建的密钥库（keystore）文件的路径，以及\
  \ `--ks-key-alias` 选项以指定生成密钥时提供的别名。\n\n最后，必须使用 `--output` 标志来指定生成 APK 文件的目标路径（称为\
  \ APK 集，APK Set）。该文件不能已经存在，并且必须具有 `.apks` 文件扩展名。将这些要求结合起来，得到如下命令行（考虑到你的操作系统的路径结构存在差异）：\n\
  \n```\njava -jar bundletool-all-0.9.0.jar build-apks --bundle=/tmp/MyApps/app/release/bundle.aab\
  \ --output=/tmp/MyApks.apks --ks=/MyKeys/release.keystore.jks --ks-key-alias=MyReleaseKey\n\
  ```\n\n当执行此命令时，将弹出一个提示请求密钥库密码，然后将 APK 文件生成到指定的 APK 集文件中。APK 集文件本质上包含从应用包生成的所有 APK\
  \ 文件的 ZIP 文件。\n\n要将适当的 APK 文件安装到连接的设备或模拟器上，请使用类似的命令：\n\n```\njava -jar bundletool-all-0.9.0.jar\
  \ install-apks --apks=/tmp/MyApks.apks\n```\n\n此命令将指示工具识别适用于连接设备的适当 APK 文件并安装它们，以便启动和测试应用程序。\n\
  \n也可以从 APK 集中提取适用于连接设备的 APK 文件，而不必安装它们。此过程的第一步是按照如下方式获取连接设备的规格说明：\n\n```\njava -jar\
  \ bundletool-all-0.9.0.jar get-device-spec --output=/tmp/device.json\n```\n\n上述命令将生成一个类似下面的\
  \ JSON 文件：\n\n```json\n{\n  \"supportedAbis\": [\"x86\"],\n  \"supportedLocales\"\
  : [\"en-US\"],\n  \"screenDensity\": 420,\n  \"sdkVersion\": 27\n}\n```\n\n接下来，使用此规格文件从\
  \ APK 集中提取匹配的 APK 文件：\n\n```\njava -jar bundletool-all-0.9.0.jar extract-apks --apks=/tmp/MyApks.apks\
  \ --output-dir=/tmp/nexus5_apks --device-spec=/tmp/device.json\n```\n\n执行时，通过 `--output-dir`\
  \ 标志指定的目录将包含适用于指定设备配置的 APK 文件。\n\n将 Android 应用程序推向市场的下一步是提交到 Google Play 开发者控制台，以便进行测试。\n\
  \n## 81.9 将应用包上传到 Google Play 开发者控制台\n\n返回 Google Play 控制台，在点击“创建新发布”（Create new\
  \ release）按钮 (B) 之前，选择导航面板测试部分中的内部测试选项（在 [图 81-10] 中标记为 A）：\n\n![](img/as_4.1_play_create_new_release.jpg)\n\
  图 81-10\n\n在结果屏幕上，点击“继续”（Continue）按钮（下方标记为 A）以确认使用 Google Play 应用签名，然后将 Android\
  \ Studio 生成的包文件拖放到上传投放点 (B)：\n\n![](img/as_4.1_play_upload_bundle.jpg)\n图 81-11\n\
  \n当上传完成后，向下滚动屏幕并输入发布名称和可选的发布说明。发布名称可以是任何帮助你识别该发布的信息，且对用户不可见。\n\n应用包文件上传后，Google\
  \ Play 将生成所有准备好测试的 APK 文件。一旦 APK 文件生成完毕，滚动到屏幕底部并点击“保存”（Save）按钮。设置保存后，点击“查看发布”（Review\
  \ release）按钮。\n\n## 81.10 探索应用包\n\n在查看屏幕上，点击已上传包右侧的箭头，如 [图 81-12] 所示：\n\n![](img/as_4.1_play_app_bundle_review.jpg)\n\
  图 81-12\n\n在弹出的面板中，点击“探索”（Explore）链接以加载应用包。这提供了与 API 级别相关的摘要信息、布局和平台：\n\n![](img/as_4.1_play_bundle_explorer.jpg)\n\
  图 13\n\n点击“前往设备”（Go to device）链接将显示支持该 APK 的设备：\n\n![](img/as_4.1_device_catalog.jpg)\n\
  图 14\n\n此时，应用程序已准备就绪，但在设置测试人员之前无法发布。\n\n## 81.11 管理测试人员\n\n如果应用程序处于内部、Alpha 或 Beta\
  \ 测试阶段，可以通过在控制台中选择应用、点击内部测试并选择测试人员选项卡来指定授权测试人员列表，如 [图 81-15] 所示：\n\n![](img/as_4.1_play_testers.jpg)\n\
  图 81-15\n\n要添加测试人员，点击创建列表按钮，命名并手动或通过上传 CSV 文件指定电子邮件地址。现在可以从屏幕复制“网页加入”（Join on the\
  \ web）URL 给测试用户，以便他们接受邀请并下载应用。\n\n## 81.12 发布应用程序\n\n现在已创建内部发布并添加了测试人员，应用程序已准备好测试。在内部测试屏幕内，选择“发布”（Releases）选项卡，然后点击最近创建发布的“编辑”（Edit）按钮：\n\
  \n![](img/as_4.1_play_ready_for_rollout.jpg)\n图 81-16\n\n在查看屏幕上，滚动到最后并点击“开始测试发布”按钮。在处理短暂延迟后，应用程序将供指定用户下载。\n\
  \n## 81.13 上传新的应用包版本\n\n为你的应用程序的第一个应用文件版本号始终为 `1`。如果尝试上传具有相同版本号的包文件，控制台将拒绝该文件并显示以下错误：你需要使用不同的版本号，因为你已经有一个版本号为\
  \ 1。要解决这个问题，需要增加嵌入包文件的版本号。这在项目的模块级 `build.gradle` 文件中完成，如 [图 81-17] 中高亮所示：\n\n```gradle\n\
  plugins {\n    id 'com.android.application'\n}\n\nandroid {\n    namespace 'com.ebookfrenzy.androidsample'\n\
  \    compileSdk 33\n    defaultConfig {\n        applicationId \"com.ebookfrenzy.androidsample\"\
  \n        minSdk 29\n        targetSdk 33\n    }\n}\n```\n\n\n\n\n```java\nversionCode\
  \ 1\nversionName \"1.0\"\n```\n\n要更改版本代码，只需更改 `versionCode` 旁声明的数字。要更改显示给应用程序用户的版本号，请更改\
  \ `versionName` 字符串。例如：\n\n```java\nversionCode 2\nversionName \"2.0\"\n```\n\n\
  完成这些更改后，重新构建 APK 文件并再次执行上传。\n\n## 81.14 分析 App Bundle 文件\n\nAndroid Studio 提供了分析应用包（app\
  \ bundle）文件内容的能力。要分析 bundle 文件，请选择 Android Studio 的 `Build` -> `Analyze APK…` 菜单选项，并导航到选择要审查的\
  \ bundle 文件。一旦加载到工具中，系统将显示有关包的原始大小和下载大小的信息，以及包的文件结构列表，如图图 81-18 所示：\n\n![](img/android_studio_3.2_bundle_analyzer.jpg)\n\
  \n图 81-18\n\n选择 `classes.dex` 文件将在下方面板显示该文件的类结构。在该面板中，可以深入探索单个类的详细信息，直到类的方法级别：\n\
  \n![](img/Image2583.jpg)\n\n图 81-19\n\n同样，在文件列表中选择资源或图像文件将在下方面板显示该文件内容。可以通过点击 `Compare\
  \ with previous APK…` 按钮并选择第二个 bundle 文件来复核两个 bundle 文件之间的大小差异。\n\n## 81.15 总结\n\
  \n一旦应用项目完成或准备好进行用户测试，即可将其上传到 Google Play 控制台并发布用于生产、内部、alpha 或 beta 测试。在上传应用之前，必须在控制台中创建一个应用条目，其中包含有关应用的信息以及用于\
  \ Play 商店的截图。随后，在 Android Studio 内部生成发布版 Android App Bundle 文件并使用上传密钥对其进行签名。bundle\
  \ 文件上传后，Google Play 会移除上传密钥并将其替换为安全存储的应用签名密钥，此时应用即可准备发布。\n\n可以随时将 bundle 文件加载到 Android\
  \ Studio APK Analyzer 工具中查看其文件内容。\n\n## 82. Android 应用内计费概述\n\n在 Android 和 iOS 等操作系统的移动应用早期，最常见的盈利方式是在下载和安装应用程序时收取预付款。不久后，通过在应用程序中嵌入广告引入了另一种收入机会。现在最常见且利润丰厚的选项可能是用户安装应用后，向其收取购买应用内物品的费用。这通常表现为访问游戏的更高层级、获取虚拟商品或货币，或者订阅数字版杂志或报纸的优质内容。\n\
  \nGoogle 通过 `Google Play In-App Billing API` 和 `Play Console` 支持应用内计费的集成。本章将提供应用内计费的概述，并概述如何将应用内计费集成到您的\
  \ Android 项目中。在探索这些主题后，下一章将引导您创建一个创建一个包含应用内计费特性的示例应用。\n\n## 82.1 为应用内计费准备项目\n\n\
  在应用中构建应用内计费需要一个 Google Play 开发者控制台帐户，其详细信息已在“创建、测试和上传 Android App Bundle”章节中介绍过。您还需要注册\
  \ Google 商户账户并配置您的支付设置。可以通过导航到 `Play Console` 中的 `Setup` -> `Payments profile` 找到这些设置。请注意，并非所有国家都提供商户注册。详情请参阅以下页面：\n\
  \n[`support.google.com/googleplay/android-developer/answer/9306917`](https://support.google.com/googleplay/android-developer/answer/9306917)\n\
  \n随后需要将应用上传到控制台并启用应用内计费。然而，除非已将 `Google Play Billing Library` 添加到模块级 `build.gradle`\
  \ 文件，否则控制台不会激活应用的应用内计费支持：\n\n```gradle\ndependencies {\n    implementation 'com.android.billingclient:billing:<latest\
  \ version>'\n}\n```\n\n一旦修改了构建文件并将应用 bundle 上传到控制台，下一步是添加用户购买的应用内产品或订阅。\n\n## 82.2\
  \ 创建应用内产品和订阅\n\n产品和订阅是通过 `Play Console` 导航面板中 `Monetize` 部分下方列出的选项进行创建和管理的，如下所示图\
  \ 82-1 所示：\n\n![](img/play_console_monetization.jpg)\n\n图 82-1\n\n每个产品或订阅都需要 ID、标题、描述和定价信息。购买分为消耗性（用户每次需要时都必须购买该物品，例如游戏中的虚拟货币）、非消耗性（用户仅需购买一次，例如内容访问）和基于订阅的。消耗性产品和非消耗性产品统称为托管产品。\n\
  \n订阅适用于销售需要定期计划更新的物品，例如访问新闻内容或应用的高级功能。在创建订阅时，会定义一个基础方案，指定价格、续订周期（每月、每年等）以及订阅是否自动续订。还可以为用户提供优惠方案并提供预购订阅选项。\n\
  \n## 82.3 计费客户端\n\n应用与 Google Play 库之间的通信由 `BillingClient` 实例处理。此外，`BillingClient`\
  \ 包含一组可以调用以执行同步和异步计费的方法。当初始化客户端时，需要提供一个 `PurchasesListener` 处理器。客户端将调用此处理器来通知应用任何活动的结果。为了避免重复通知，建议每个应用使用一个\
  \ `BillingClient`。可以使用 `newBuilder()` 方法创建 `BillingClient` 并传递当前的 activity 或 fragment。然后通过\
  \ `setListener()` 方法将购买更新分配给客户端：\n\n```java\nfinal PurchasesListener purchasesUpdatedListener\
  \ = new PurchasesListener() {\n    @Override\n    public void onPurchasesUpdated(BillingResult\
  \ billingResult, List<Purchase> purchases) {\n        if (billingResult.getResponseCode()\
  \ == BillingClient.BillingResponseCode.OK && purchases != null) {\n            //\
  \ 购买成功\n            for (Purchase purchase : purchases) {\n                // 处理购买\n\
  \            }\n        } else if (billingResult.getResponseCode() == BillingClient.BillingResponseCode.USER_CANCELED)\
  \ {\n            // 用户取消购买\n        } else {\n            // 在此处处理错误\n        }\n\
  \    }\n};\n\nprivate BillingClient billingClient = BillingClient.newBuilder(context)\n\
  \    .setListener(purchasesUpdatedListener)\n    .enablePendingPurchases()\n   \
  \ .build();\n```\n\n## 82.4 连接到 Google Play 计费库\n\n\n\n\n\n在成功创建 Billing Client\
  \ 后，下一步是初始化与 Google Play Billing Library 的连接。要建立此连接，需要调用 billing client 实例的 `startConnection()`\
  \ 方法。由于连接是异步进行的，因此需要实现一个 `BillingClientStateListener` 处理器，以接收指示连接是否成功的回调。还应该添加代码来重写\
  \ `onBillingServiceDisconnected()` 方法。当与 Billing Library 的连接丢失时，会调用此方法，并可以用它向用户报告问题并重试连接。\n\
  \n一旦设置和连接任务完成，`BillingClient` 实例将调用 `onBillingSetupFinished()` 方法，该方法可以检查客户端是否已就绪：\n\
  \n```java\nbillingClient.startConnection(new BillingClientStateListener() {\n  \
  \  @Override\n    public void onBillingSetupFinished(@NonNull BillingResult billingResult)\
  \ {\n        if (billingResult.getResponseCode() == BillingClient.BillingResponseCode.OK)\
  \ {\n            // 连接成功\n        } else {\n            // 连接失败\n        }\n   \
  \ }\n    @Override\n    public void onBillingServiceDisconnected() {\n        //\
  \ 现有连接丢失\n    }\n});\n```\n\n### 82.5 查询可用产品\n\n一旦计费环境初始化并准备就绪，下一步是请求可购买的产品或订阅的详细信息。这通过调用\
  \ `BillingClient` 的 `queryProductDetailsAsync()` 方法，并传递一个配置适当的 `QueryProductDetailsParams`\
  \ 实例来实现，该实例包含产品 ID 和类型（订阅使用 `ProductType.SUBS`，托管商品使用 `ProductType.INAPP`）：\n\n\
  ```java\nQueryProductDetailsParams queryProductDetailsParams =\n    QueryProductDetailsParams.newBuilder()\n\
  \        .setProductList(\n            ImmutableList.of(\n                QueryProductDetailsParams.Product.newBuilder()\n\
  \                    .setProductId(\"one_button_click\")\n                    .setProductType(BillingClient.ProductType.INAPP)\n\
  \                    .build()))\n        )\n        .build();\n\nbillingClient.queryProductDetailsAsync(queryProductDetailsParams,\n\
  \    new ProductDetailsResponseListener() {\n        public void onProductDetailsResponse(\n\
  \                @NonNull BillingResult billingResult,\n                @NonNull\
  \ List<ProductDetails> productDetailsList) {\n            if (!productDetailsList.isEmpty())\
  \ {\n                // 处理匹配的产品列表\n            } else {\n                // 未找到匹配的产品\n\
  \            }\n        }\n    }\n);\n```\n\n`queryProductDetailsAsync()` 方法接收一个\
  \ `ProductDetailsResponseListener` 处理器，该处理器反过来会被调用并接收一个包含匹配产品信息的 `ProductDetail`\
  \ 对象列表。例如，我们可以调用这些对象的方法来获取如产品名称、标题、描述、价格和优惠详情等信息。\n\n### 82.6 启动购买流程\n\n一旦用户查询并选择了产品或订阅进行购买，购买流程就可以启动了。我们通过调用\
  \ `BillingClient` 的 `launchFlow()` 方法来实现，传递当前 activity 以及一个包含所购买项目 `ProductDetail`\
  \ 的 `BillingFlowParams` 实例。\n\n```java\nBillingFlowParams billingFlowParams =\n\
  \    BillingFlowParams.newBuilder()\n        .setProductDetailsList(\n         \
  \   ImmutableList.of(\n                BillingFlowParams.ProductDetailsParams.newBuilder()\n\
  \                    .setProductDetails(productDetails)\n                    .build())\n\
  \        )\n        .build();\n\nbillingClient.launchFlow(this, billingFlowParams);\n\
  ```\n\n购买操作的成功与否将通过本章之前概述的 `PurchasesListener` 调用来报告。\n\n### 82.7 完成购买\n\n当购买成功时，`PurchasesListener`\
  \ 处理器将接收一个包含每个项目 `Purchase` 对象的列表。你可以如下所示调用 `Purchase` 实例的 `getPurchaseState()`\
  \ 方法来验证项目是否已购买：\n\n```java\nif (purchase.getPurchaseState() == Purchase.State.PURCHASED)\
  \ {\n    // 购买完成。\n} else if (purchase.getPurchaseState() == Purchase.State.PENDING)\
  \ {\n    // 待处理中\n}\n```\n\n注意，只有在初始化期间调用了 `enablePendingPurchases()`，你的应用才会支持待处理购买。待处理购买将一直持续直到用户完成支付流程。\n\
  \n当消耗性购买完成后，需要对其进行确认（acknowledge），以防止向用户退款。这需要该项目的购买令牌，该令牌通过调用 `Purchase` 对象的 `getPurchaseToken()`\
  \ 方法获得。此令牌用于创建一个带有 `AcknowledgePurchaseListener` 处理器的 `AcknowledgePurchaseParams`\
  \ 实例。托管商品购买和订阅通过如下方式调用 `BillingClient` 的 `acknowledgePurchase()` 方法进行确认：\n\n```java\n\
  AcknowledgePurchaseParams acknowledgePurchaseParams =\n    AcknowledgePurchaseParams.newBuilder()\n\
  \        .setPurchaseToken(purchase.getPurchaseToken())\n        .build();\n\nAcknowledgePurchaseListener\
  \ acknowledgePurchaseResponseListener =\n    new AcknowledgePurchaseListener() {\n\
  \        @Override\n        public void onAcknowledgePurchaseResponse(@NonNull BillingResult\
  \ billingResult) {\n            billingClient.acknowledgePurchase(\n           \
  \     acknowledgePurchaseParams,\n                acknowledgePurchaseResponseListener);\n\
  \        }\n    };\n```\n\n对于消耗性购买，当项目被消耗后，你需要通知 Google Play，以便用户再次购买。这需要一个包含购买令牌的配置\
  \ `ConsumeParams` 实例、一个 `ConsumeResponseListener` 以及对 billing client 的 `consumeAsync()`\
  \ 方法的调用：\n\n```java\nConsumeParams consumeParams =\n    ConsumeParams.newBuilder()\n\
  \        .setPurchaseToken(purchase.getPurchaseToken())\n        .build();\n\nConsumeResponseListener\
  \ listener = new ConsumeResponseListener() {\n    @Override\n    public void onConsumeResponse(BillingResult\
  \ billingResult, @NonNull String purchaseToken) {\n        if (billingResult.getResponseCode()\
  \ == BillingClient.BillingResponseCode.OK) {\n            // 购买已成功消耗\n        }\n\
  \    }\n};\n\nbillingClient.consumeAsync(consumeParams, listener);\n```\n\n### 82.8\
  \ 查询之前的购买\n\n在处理应用内计费时，检查用户是否已经购买过某个产品或订阅是一个常见需求。通过调用 `BillingClient` 实例的 `queryPurchasesAsync()`\
  \ 方法并实现 `PurchaseListener`，可以生成用户之前特定类型的购买列表。例如，以下代码获取了之前购买但尚未消耗的项目列表：\n\n```java\n\
  QueryPurchasesParams queryPurchasesParams =\n    QueryPurchasesParams.newBuilder()\n\
  \        .setProductType(BillingClient.ProductType.INAPP)\n        .build();\n\n\
  billingClient.queryPurchasesAsync(queryPurchasesParams,\n    new PurchasesListener()\
  \ {\n        @Override\n        public void onQueryPurchasesResponse(@NonNull BillingResult\
  \ billingResult, @NonNull List<Purchase> list) {\n            // 处理购买列表\n      \
  \  }\n    }\n);\n```\n\n要获取活跃订阅列表，请将 `ProductType` 值从 `INAPP` 改为 `SUBS`。\n\n\n\n\
  \n或者，为了获取每个产品的最近购买记录列表，可以调用 `BillingClient` 的 `queryPurchaseHistoryAsync()` 方法：\n\
  \n```java\nQueryPurchaseHistoryParams queryPurchaseHistoryParams =\n    QueryPurchaseHistoryParams.newBuilder()\n\
  \            .setProductType(BillingClient.ProductType.INAPP)\n            .build();\n\
  \nbillingClient.queryPurchaseHistoryAsync(queryPurchaseHistoryParams,\n    new PurchaseHistoryResponseListener()\
  \ {\n        @Override\n        public void onPurchaseHistoryResponse(@NonNull BillingResult\
  \ billingResult,\n                @NonNull List<PurchaseHistoryRecord> list) {\n\
  \            // Process purchase history\n        }\n    });\n```\n\n# 82.9 总结\n\
  \n内应用购买通过向用户销售虚拟产品和订阅，提供了一种从 Android 应用内部产生收入的方式。在本章中，我们探讨了受管理商品和订阅，并解释了消耗性产品和非消耗性产品之间的区别。使用\
  \ Google Play 内应用结算库可以为应用添加内应用购买支持，这涉及创建和初始化一个结算客户端，并在其上调用方法来执行诸如购买、列出可用产品和消耗现有购买等任务。下一章将包含一个教程，演示如何在\
  \ Android Studio 项目中添加内应用购买。\n\n# 83. Android 内应用购买教程\n\n在上一章中，我们探索了如何将内应用购买集成到\
  \ Android 项目中，并查看了一些可以在开发自己的项目时使用的代码示例。本章将通过创建一个示例项目将这些理论付诸实践，演示如何向 Android 应用添加一个消耗性内应用产品。该教程还将展示如何在\
  \ Google Play 管理中心中添加和管理内应用产品，并解释如何启用测试支付，以便在测试期间进行购买而无需花费真实的金钱。\n\n## 83.1 关于内应用购买示例项目\n\
  \n该项目背后的简单概念是：在点击按钮之前，必须购买一个内应用产品。该内应用产品在每次点击按钮时都会被消耗，要求用户在每次想要点击按钮时都需要重新购买该产品。在初始化时，应用将连接到应用商店，获取产品详情并显示产品名称。一旦应用确认该产品可用，将启用购买按钮，点击该按钮将进入购买流程。购买完成后，将启用第二个按钮，以便用户可以点击它并消耗购买。\n\
  \n## 83.2 创建 InAppPurchase 项目\n\n此练习的第一步是创建一个新项目。首先启动 Android Studio，并在欢迎界面选择 `New\
  \ Project` 选项。在新项目对话框中，点击 `Next` 按钮之前选择 `Empty Activity` 模板。\n\n在 `Name` 字段中输入 `InAppPurchase`，并指定一个在\
  \ Google Play 生态系统中唯一标识您的应用的包名（例如 `com.<您的公司名称>.InAppPurchase`）。在点击 `Finish` 按钮之前，将\
  \ `Minimum API level` 设置为 `API 26`：Android 8.0 (Oreo)，并将 `Language` 菜单设置为 `Java`。项目创建完成后，使用节\
  \ 11.8 迁移项目到 View Binding 中概述的步骤将项目转换为使用 view binding 的。\n\n## 83.3 向项目添加库\n\n在我们开始编写代码之前，需要向项目构建配置添加一些库，包括标准的\
  \ Android 结算客户端库。在项目的后期，我们还需要使用作为 Google Guava Core Java 库一部分的 `ImmutableList` 类。现在通过修改\
  \ `Gradle Scripts -> build.gradle (Module: InAppPurchase.app)` 文件并进行以下更改来添加这些库：\n\
  \n```gradle\ndependencies {\n    implementation 'com.android.billingclient:billing:5.1.0'\n\
  \    implementation 'com.google.guava:guava:24.1-jre'\n    implementation 'com.google.guava:guava:27.0.1-android'\n\
  }\n```\n\n点击编辑器面板顶部的 `Sync Now` 链接以提交这些更改。\n\n## 83.4 设计用户界面\n\n用户界面将由现有的 `TextView`\
  \ 和两个 `Buttons` 组成。在编辑器中加载 `activity_main.xml` 文件，将两个 `Button` 视图拖放到布局中，使一个位于 `TextView`\
  \ 上方，另一个在下方。选择 `TextView` 并将 `id` 属性更改为 `statusText`。\n\n点击工具栏上的 `Clear all Constraints`\
  \ 按钮并按住 Shift  own 所有三个视图。右键点击最上方的 `Button` 视图并选择 `Center -> Horizontally in Parent`\
  \ 菜单。再次重复此步骤，这次选择 `Chains -> Create Vertical Chain`。更改顶部按钮的 `text` 属性使其显示为“Consume\
  \ Purchase”，并将 `id` 更改为 `consumeButton`。还要配置 `onClick` 属性以调用名为 `consumePurchase`\
  \ 的方法。\n\n选择底部的按钮并重复上述步骤，这次将文本设置为“Buy Product”，`id` 设置为 `buyButton`，并将 `onClick`\
  \ 回调设置为 `makePurchase`。完成后，布局应与 图 83-1 所示：\n\n![](img/as_inapppurchase_ui.jpg)\n\
  \n图 83-1\n\n## 83.5 将应用添加到 Google Play 商店\n\n使用标题为 创建、测试和上传 Android 应用包 的章节概述概述步骤，登录\
  \ Play Console，创建一个新应用并为内部测试轨道设置测试人员电子邮件地址。返回 Android Studio 为项目生成签名发布应用包。一旦文件生成，将其上传到内部测试轨道并发布。\n\
  \n现在应用已经在 Google Play 中存在，我们准备好为项目创建一个内应用产品。\n\n## 83.6 创建内应用产品\n\n在 Play Console\
  \ 中选中应用后，向下滚动侧边面板列表，直到 `Monetize` 部分出现。在此部分，选择 `Products` 下的 `In-app products` 选项，如图\
  \ 83-2 所示：\n\n![](img/play_console_monetize1.jpg)\n\n图 83-2\n\n在内应用产品页面，点击 `Create\
  \ product` 按钮：\n\n![](img/play_console_create_product.jpg)\n\n图 83-3\n\n在新产品屏幕上，在保存新产品之前输入以下信息：\n\
  \n产品名称：Button Click\n\n描述：这是一个允许点击一次的测试内应用产品。\n\n默认价格：设置为您常用货币的最低价格。\n\n## 83.7\
  \ 启用许可人员\n\n在测试内应用结算时，能够在不花费资金的情况下进行购买是非常用的。这可以通过为内部轨道测试人员启用许可测试来实现。许可人员在购买时可以使用测试信用卡，这样就不会被收费。\n\
  \n在 Play Console 中，返回主屏幕并选择 `Setup -> License testing` 选项：\n\n![](img/play_console_license_testing.jpg)\n\
  \n图 83-4\n\n在许可测试屏幕内，添加为内部测试轨道添加的人员，将 `License response` 设置为 `RESPOND_NORMALLY`\
  \ 并保存更改：\n\n![](img/play_console_license_testing_screen.jpg)\n\n图 83-5\n\n现在应用和内应用产品已在\
  \ Play Console 中设置好，我们可以开始向项目中添加代码。\n\n## 83.8 初始化结算客户端\n\n编辑 `MainActivity.java`\
  \ 文件并进行以下更改以开始实现内应用购买功能：\n\n```java\n.\n\nimport androidx.annotation.NonNull;\n\n\
  import android.util.Log;\n\nimport com.android.billingclient.api.*;\n\n.\n```\n\n\
  \n\n```java\npublic class MainActivity extends AppCompatActivity {\n\n    private\
  \ ActivityMainBinding binding;\n    private BillingClient billingClient;\n    private\
  \ ProductDetails productDetails;\n    private Purchase purchase;\n    static final\
  \ String TAG = \"InAppPurchaseTag\";\n\n    @Override\n    protected void onCreate(Bundle\
  \ savedInstanceState) {\n        super.onCreate(savedInstanceState);\n        binding\
  \ = ActivityMainBinding.inflate(getLayoutInflater());\n        View view = binding.getRoot();\n\
  \        setContentView(view);\n        billingSetup();\n    }\n\n    private void\
  \ billingSetup() {\n        billingClient = BillingClient.newBuilder(this)\n   \
  \                 .setListener(purchasesUpdatedListener)\n                    .enablePendingPurchases()\n\
  \                    .build();\n        billingClient.startConnection(new BillingClientStateListener()\
  \ {\n            @Override\n            public void onBillingSetupFinished(\n  \
  \                      @NonNull BillingResult billingResult) {\n               \
  \ if (billingResult.getResponseCode() ==\n                            BillingClient.BillingResponseCode.OK)\
  \ {\n                    Log.i(TAG, \"OnBillingSetupFinish connected\");\n     \
  \               queryProduct();\n                } else {\n                    Log.i(TAG,\
  \ \"OnBillingSetupFinish failed\");\n                }\n            }\n        \
  \    @Override\n            public void onBillingServiceDisconnected() {\n     \
  \           Log.i(TAG, \"OnBillingSetupFinish connection lost\");\n            }\n\
  \        });\n    }\n}\n```\n\n当应用启动时，`onCreate()` 方法现在会调用 `billingSetup()`，该方法反过来创建一个新的计费客户端实例并尝试连接到\
  \ Google Play Billing Library。当连接尝试完成后，将调用 `onBillingSetupFinished()` 监听器并输出 Logcat\
  \ 消息，指示连接尝试的成功或失败。最后，我们还实现了 `onBillingServiceDisconnected()` 回调，当 Google Play Billing\
  \ Library 的连接丢失时，该回调会被调用。\n\n如果连接成功，将调用一个名为 `queryProduct()` 的方法。此方法和分配给 `billingClient`\
  \ 的 `purchasesUpdatedListener` 现在都需要被添加。\n\n### 83.9 查询产品\n\n为了确保产品可以被购买，我们需要创建一个\
  \ `QueryProductDetailsParams` 实例，并使用在 Play Console 中指定的产品 ID 进行配置，然后将其传递给 `billingClient`\
  \ 的 `queryProductDetailsAsync()` 方法。这要求我们添加 `onProductDetails()` 回调，在其中我们将检查产品是否存在、提取产品名称并将其显示在\
  \ `TextView` 上。现在我们已经获取了产品详情，还可以启用购买按钮。在 `MainActivity` 文件中，添加 `queryProduct()`\
  \ 方法，其代码逻辑如下：\n\n```java\nimport com.google.common.collect.ImmutableList;\nimport\
  \ java.util.List;\n\nprivate void queryProduct() {\n    QueryProductDetailsParams\
  \ queryProductDetailsParams =\n        QueryProductDetailsParams.newBuilder()\n\
  \            .setProductList(\n                ImmutableList.of(\n             \
  \       QueryProductDetailsParams.Product.newBuilder()\n                       \
  \ .setProductId(\"one_button_click\")\n                        .setProductType(\n\
  \                            BillingClient.ProductType.INAPP)\n                \
  \    .build()))\n            .build();\n    billingClient.queryProductDetailsAsync(\n\
  \        queryProductDetailsParams,\n        new ProductDetailsResponseListener()\
  \ {\n            public void onProductDetailsResponse(\n                @NonNull\
  \ BillingResult billingResult,\n                @NonNull List<ProductDetails> productDetailsList)\
  \ {\n                if (!productDetailsList.isEmpty()) {\n                    productDetails\
  \ = productDetailsList.get(0);\n                    runOnUiThread(() -> {\n    \
  \                    binding.buyButton.setEnabled(true);\n                     \
  \   binding.statusText.setText(productDetails.getName());\n                    });\n\
  \                } else {\n                    Log.i(TAG, \"onProductDetailsResponse:\
  \ No products\");\n                }\n            }\n        });\n}\n```\n\n这里使用的许多代码在上一章节中应该很熟悉。该监听器检查是否至少找到了一个符合标准的产品。然后从匹配的产品中提取\
  \ `ProductDetails` 对象，存储在 `productDetails` 变量中，并将产品名称显示在 `TextView` 上。需要注意的一点是，当我们在\
  \ `TextView` 上显示产品名称时，是通过调用 `runOnUiThread()` 实现的。这是必要的，因为监听器不是运行在主线程上的，因此无法安全地更改用户界面。`runOnUiThread()`\
  \ 方法提供了一种在主线程上执行代码的快速方便的方法，而无需使用协程。\n\n### 83.10 启动购买流程\n\n当用户点击购买按钮时，将调用一个名为 `makePurchase()`\
  \ 的方法来启动购买过程。我们现在可以所示添加此方法：\n\n```java\npublic void makePurchase(View view) {\n\
  \    BillingFlowParams billingFlowParams =\n        BillingFlowParams.newBuilder()\n\
  \            .setProductDetailsList(\n                ImmutableList.of(\n      \
  \              BillingFlowParams.ProductDetailsParams.newBuilder()\n           \
  \             .setProductDetails(productDetails)\n                        .build()\n\
  \                ))\n            .build();\n    billingClient.launchBillingFlow(this,\
  \ billingFlowParams);\n}\n```\n\n### 83.11 处理购买更新\n\n购买过程的结果将通过初始化阶段分配给 `billingClient`\
  \ 的 `PurchaseUpdatedListener` 报告给应用。现在如下所示添加此处理器：\n\n```java\nprivate final PurchasesUpdatedListener\
  \ purchasesUpdatedListener = new PurchasesUpdatedListener() {\n    @Override\n \
  \   public void onPurchasesUpdated(BillingResult billingResult,\n            List<Purchase>\
  \ purchases) {\n        if (billingResult.getResponseCode() ==\n               \
  \     BillingClient.BillingResponseCode.OK\n                    && purchases !=\
  \ null) {\n            for (Purchase purchase : purchases) {\n                completePurchase(purchase);\n\
  \            }\n        } else if (billingResult.getResponseCode() ==\n        \
  \            BillingClient.BillingResponseCode.USER_CANCELED) {\n            Log.i(TAG,\
  \ \"onPurchasesUpdated: Purchase Canceled\");\n        } else {\n            Log.i(TAG,\
  \ \"onPurchasesUpdated: Error\");\n        }\n    }\n};\n```\n\n如果用户取消购买或发生其他错误，处理器将输出日志消息。然而，成功的购买将导致调用名为\
  \ `completePurchase()` 的方法，该方法传递了当前的 `Purchase` 对象。如下所示添加此方法：\n\n```java\nprivate\
  \ void completePurchase(Purchase item) {\n    purchase = item;\n    if (purchase.getPurchaseState()\
  \ == Purchase.PurchaseState.PURCHASED) {\n        runOnUiThread(() -> {\n      \
  \      binding.consumeButton.setEnabled(true);\n            binding.statusText.setText(\"\
  Purchase Complete\");\n        });\n    }\n}\n```\n\n该方法在验证产品已购买且付款尚未处于待处理状态之前会存储购买信息。随后启用“消耗”按钮并通知用户购买成功。\n\
  \n### 83.12 消耗产品\n\n既然用户现在可以点击“消耗”按钮，下一步是确保产品已被消耗，这样在购买下一次按钮点击之前只能执行一次点击。这要求我们现在编写\
  \ `consumePurchase()` 方法：\n\n```java\npublic void consumePurchase(View view) {\n\
  ```\n\n\n\n\n```java\nConsumeParams consumeParams =\n        ConsumeParams.newBuilder()\n\
  \            .setPurchaseToken(purchase.getPurchaseToken())\n            .build();\n\
  \nConsumeResponseListener listener = new ConsumeResponseListener() {\n    @Override\n\
  \    public void onConsumeResponse(BillingResult billingResult,\n              \
  \                  @NonNull String purchaseToken) {\n        if (billingResult.getResponseCode()\
  \ ==\n                        BillingClient.BillingResponseCode.OK) {\n        \
  \    runOnUiThread(() -> {\n                binding.consumeButton.setEnabled(false);\n\
  \                binding.statusText.setText(\"Purchase consumed\");\n          \
  \  });\n        }\n    }\n};\n\nbillingClient.consumeAsync(consumeParams, listener);\n\
  ```\n\n此方法创建了一个 `ConsumeParams` 实例，并使用当前订单的 `purchase token` 进行配置（该令牌是从之前在 `completePurchase()`\
  \ 方法中保存的 `Purchase` 对象获取）。它被传递给 `consumePurchase()` 方法，该方法在带有 `IO` 调度器的协程中启动。如果产品被成功消耗，代码将在主线程中执行，以禁用消耗按钮并更新状态文本。\n\
  \n## 83.13 恢复之前的购买\n\n通过目前为止添加的代码，我们可以在单个会话中购买并消耗产品。如果我们在购买后但在消耗之前退出应用，那么该订单在应用重启时将会丢失。我们可以通过配置\
  \ `QueryPurchasesParams` 实例来搜索未消耗的应用内产品，并将其传递给计费客户端的 `queryPurchasesAsync()` 方法，同时带上监听器的引用，该监听器将在结果返回时被调用。在\
  \ `MainActivity.java` 文件中添加如下新函数和监听器：\n\n```java\nprivate void reloadPurchase()\
  \ {\n    QueryPurchasesParams queryPurchasesParams = QueryPurchasesParams.newBuilder()\n\
  \            .setProductType(BillingClient.ProductType.INAPP)\n            .build();\n\
  \    billingClient.queryPurchasesAsync(\n            queryPurchasesParams,\n   \
  \         purchasesListener\n    );\n}\n\nprivate final PurchasesResponseListener\
  \ purchasesListener = new PurchasesResponseListener() {\n    @Override\n    public\
  \ void onQueryPurchasesResponse(@NonNull BillingResult billingResult,\n        \
  \                                @NonNull List<Purchase> list) {\n        if (!list.isEmpty())\
  \ {\n            purchase = list.get(0);\n            binding.consumeButton.setEnabled(true);\n\
  \        } else {\n            binding.consumeButton.setEnabled(false);\n      \
  \  }\n    }\n};\n```\n\n如果传递给监听器的购买列表不为空，则将列表中的第一个购买赋值给 `purchase` 变量并启用消耗按钮（在更完整的实现中，应该通过比较产品\
  \ ID 来检查是否是正确的产品，并处理多个购买返回）。如果没有找到任何购买，则禁用消耗按钮，直到再次进行购买。剩下的只需在计费设置期间按所示调用我们的 `reloadPurchase()`\
  \ 方法：\n\n```java\nprivate void billingSetup() {\n    // ...\n    if (billingResult.getResponseCode()\
  \ ==\n                    BillingClient.BillingResponseCode.OK) {\n        Log.i(TAG,\
  \ \"OnBillingSetup connected\");\n        queryProduct();\n        reloadPurchase();\n\
  \    } else {\n        Log.i(TAG, \"OnBillingSetup failed\");\n    }\n    // ...\n\
  }\n```\n\n## 83.14 测试应用\n\n在测试应用之前，我们需要将此最新版本上传到 Play Console。由于我们已经上传了版本 1，首先需要增加\
  \ `build.gradle (Module: InAppPurchase.app)` 文件中的版本号：\n\n```gradle\ndefaultConfig\
  \ {\n    applicationId \"com.ebookrenzy.inapppurchase\"\n    minSdk 26\n    targetSdk\
  \ 32\n    versionCode 2\n    versionName \"2.0\"\n}\n```\n\n同步构建配置，然后按照“创建、测试和上传\
  \ Android Bundle”章节中的步骤生成新的应用 bundle，将其上传到内部测试轨道并推发给测试人员。使用测试轨道链接，在登录了其中一个测试账户的设备或模拟器上安装应用。\n\
  \n应用启动后，经过简短延迟后，它应该在 `TextView` 上显示产品名称。点击购买按钮将开始购买流程，如图 83-6 所示：\n\n![](img/in_app_billing_test_purchase.jpg)\n\
  图 83-6\n\n点击购买按钮使用测试卡片完成购买，并等待“消耗购买”（Consume Purchase）按钮变为可用。在点击此按钮之前，尝试再次购买产品，并验证无法再次购买，因为你已经拥有该产品。\n\
  \n点击“消耗购买”按钮，等待“购买已消耗”（Purchase consumed）消息在 `TextView` 上出现。产品被消耗后，现在应该可以再次购买了。再次进行购买，然后终止并重启应用。应用应该能够找到之前的未消耗购买订单并启用消耗按钮。\n\
  \n## 83.15 故障排除\n\n如果你在购买时遇到问题，请确保设备已通过 USB 线或 WiFi 连接到 Android Studio，并在 Logcat\
  \ 面板中选择它。在 Logcat 搜索栏中输入 `InAppPurchaseTag` 并检查诊断输出，必要时在代码中添加额外的 `Log` 调用。关于失败的更多额外信息，一个实用的技巧是从\
  \ `BillingResult` 实例中访问调试消息，例如：\n\n```java\n} else if (billingResult.getResponseCode()\n\
  \                == BillingClient.BillingResponseCode.USER_CANCELED) {\n    Log.i(TAG,\
  \ \"onPurchasesUpdated: Purchase Canceled\");\n} else {\n    Log.i(TAG, billingResult.getDebugMessage());\n\
  }\n```\n\n请注意，只要在模块级 `build.gradle` 文件中保持应用版本号不变，你现在就可以直接在设备或模拟器上运行修改后的应用，而无需重新打包并上传到控制台。\n\
  \n如果没有列出测试支付卡，请确保设备上的用户账户已添加到许可测试人员列表中。如果应用运行在物理设备上，请尝试在模拟器上运行。如果所有方法都失败了，你可以输入有效的支付方式进行测试购买，然后从\
  \ Play Console 首页访问订单管理界面进行退款。\n\n## 83.16 总结\n\n在本章中，我们创建了一个项目，演示了如何在 Android 应用中添加应用内产品。这包括在\
  \ Google Play Console 中创建产品，以及编写代码来初始化并连接计费客户端、查询可用产品，以及最后购买和消耗产品。\n\n\n\n\n\n动态交付的主要目标是减少从应用商店安装应用所需的时间和带宽，同时确保应用在安装后仅占用最少的存储空间。\n\
  \n动态功能模块（也称为按需模块）允许将一个 Android 应用的不同功能打包成独立的模块，只有在用户需要这些功能时，这些功能模块才会被下载并安装到设备上。例如，一个应用可能包含新闻和讨论功能。在这种情况下，该应用可能默认只安装新闻功能，并将讨论功能分离成一个动态功能模块。当用户尝试访问讨论功能时，应用将从\
  \ Google Play 商店下载该功能模块并启动它。如果用户从未访问该功能，则该模块将永远不会被安装，从而确保应用仅使用最少量的存储空间。\n\n使用动态功能模块的应用对模块的安装方式和时机具有完全控制权。事实上，应用还可以监控用户访问特定功能的频率，并临时移除任何不常使用的模块。\n\
  \n动态功能还可能被指定为“即时”（instant）模块。这取代了早期 Android 版本中的“即时应用”（Instant App）”概念，并允许动态功能模块在无需安装应用的情况下在设备上运行。这使得应用可以在\
  \ Google Play 商店中显示一个“立即尝试”按钮，或者通过点击网络 URL 在设备上立即启动。\n\n## 84.2 动态功能模块架构\n\nAndroid\
  \ 设计之初就考虑了模块化，特别是在意图（Intent）和活动（Activity）的概念。动态功能将这种哲学推向了逻辑上的终，允许应用在用户需要的时候安装用户所需的内容。鉴于这种能力的灵活性和强大，动态功能模块的实现相对简单。\n\
  \n简单来说，动态功能模块使用拆分 APK 文件（split APK files）构建，这些文件允许多个 APK 文件组合成一个单一应用。\n\n正如我们在“创建、测试和上传\
  \ Android App Bundle”中学习到的，动态交付和应用包通过生成自定义的 APK 文件来工作，该文件仅包含在特定设备配置上运行应用所需的字节码和资源。在这种情况下，应用仍然通过单个\
  \ APK 文件进行安装，尽管该文件是为用户的设备定制的。\n\n与此的是，动态功能模块通过将应用拆分为多个称为拆分 APK 文件的文件来工作。\n\n当应用使用拆分\
  \ APK 文件时，只有在首次下载应用时才会安装基础模块（base module）。基础模块通过可启动的活动（activity）作为应用的入口点，包含了应用基础功能的字节码和资源，以及应用其他部分运行所需的配置和构建资源。例如，基础模块的清单文件（manifest）包含了与应用一起的任何动态功能模块清单文件的合并。此外，所有动态功能模块的版本号由基础模块构建配置文件中的版本代码（version\
  \ code）设置决定。\n\n基础模块还包含应用包中包含的动态功能模块列表，所有动态功能模块必须在它们的构建配置中将基础模块列为依赖。\n\n每个动态功能以模块的形式存在，包含字节码、清单、资源和构建配置，以及该特定功能的任何其他资产（如图像或数据文件）。\n\
  \n当用户从应用商店请求应用时，商店将为模块生成基础 APK 文件，该文件包含所有设备配置通用的字节码和资源，以及一组专门为用户设备配置的配置 APK 文件。同样，安装动态功能模块的请求将生成一个动态功能\
  \ APK 文件以及相应的配置 APK 文件，如下方的图 84-1 所示：\n\n![](img/android_dynamic_feature_diagram.jpg)\n\
  \n图 84-1\n\n## 84.3 创建动态功能模块\n\n可以通过添加全新的模块或迁移现有模块来向项目添加动态功能。若要添加新模块，只需选择 Android\
  \ Studio 的 `File -> New -> New Module...` 菜单选项。在弹出的对话框中，左侧面板选择“动态功能模块”（Dynamic Feature\
  \ Module）或“即时动态功能模块”（Instant Dynamic Feature Module）选项，取决于你正在创建的动态功能类型：\n\n![](img/as_add_new_module.jpg)\n\
  \n图 84-2\n\n选择合适的动态功能选项后，命名模块并更改最小 API 设置，使其与基础模块选择的 API 级别匹配（如果这些版本不匹配，项目将无法构建）。\n\
  \n再次点击 Next 按钮配置按需（On-Demand）选项：\n\n![](img/as_4.2_dynamic_feature_options.jpg)\n\
  \n图 84-3\n\n当启用 `Fusing` 选项时，在运行动态交付之前的旧版本 Android（Android 4.4 API 20 或更早版本）的设备上，模块将与基础\
  \ APK 一起下载。模块标题字符串（Module Title string）长度可达 50 个字符，Google Play 在消息和通知中向用户描述该功能时将使用它。\n\
  \n安装时包含菜单提供了选项，用于控制模块按需安装的条件，而不是在用户设备上首次安装应用时包含。该菜单提供以下选项：\n\n- 在安装时不包含模块（仅按需） -\
  \ 无论设备配置和用户国家如何，在应用请求之前，模块不会被安装。\n- 在安装时包含模块 - 禁用所有设备和用户国家的按需动态安装。模块将在安装应用的同时被安装。\n\
  - 仅针对特定功能的设备在安装时包含模块 - 模块将在符合标准的设备配置和用户国家安装时包含。所有其他国家和设备配置将使用按需安装。当选择此选项时，会出现额外的选项允许输入设备功能。在图\
  \ 84-4 中，例如，将在具有麦克风和指纹识别器的设备上安装时包含。在所有其他设备上，模块将动态按需安装：\n\n![](img/as_4.2_dynamic_feature_device_features.jpg)\n\
  \n图 84-4\n\n其他标准如国家和 API 级别必须在项目清单（`AndroidManifest.xml`）文件中声明。例如，以下条将禁用法国用户和运行早于\
  \ API 21 版本的动态按需功能安装：\n\n```xml\n<dist:conditions>\n  <dist:user-countries exclude=\"\
  true\">\n    <dist:country code=\"FR\"/>\n  </dist:user-countries>\n  <dist:min-sdk\
  \ value=\"21\"/>\n</dist:conditions>\n```\n\n## 84.4 将现有模块转换为动态交付\n\n如果应用中包含一个非常适合动态交付的现有功能，可以通过几个基本步骤将其转换为动态功能。例如，考虑以下项目结构：\n\
  \n![](img/andorid_dynamic_feature_convert_tree.jpg)\n\n图 84-5\n\n在此项目中，app 模块将作为基础模块，而\
  \ `secondfeature` 模块是转换为动态功能模块的理想人选。\n\n\n\n\n要将应用中的现有模块转换为动态功能模块，请从编辑模块级 `build.gradle`\
  \ 文件开始（在上面的示例中为 Gradle Scripts -> `build.gradle (Module: secondfeature)`），并将其修改为使用\
  \ `com.android.dynamic-feature` 代替 `com.android.application` 插件，同时更改依赖关系，使模块仅依赖于基础（app）模块。例如：\n\
  \n```gradle\napply plugin: 'com.android.application'\n\napply plugin: 'com.android.dynamic-feature'\n\
  \ndependencies {\n    implementation fileTree(dir: 'libs', include: ['*.jar'])\n\
  \    api 'androidx.appcompat:appcompat:1.6.0'\n    api 'androidx.constraintlayout:constraintlayout:2.1.4'\n\
  \    testImplementation 'junit:junit:4.13.2'\n    androidTestImplementation 'androidx.test.ext:junit:1.1.5'\n\
  \    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'\n  \
  \  implementation project(':app')\n}\n```\n\n接下来，编辑该模块的 `AndroidManifest.xml` 文件并按如下方式进行修改（注意在本示例中，这是一个按需模块，而非即时模块）：\n\
  \n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<manifest xmlns:android=\"\
  http://schemas.android.com/apk/res/android\"\n    xmlns:dist=\"http://schemas.android.com/apk/distribution\"\
  \n    package=\"com.ebookfrenzy.mymodule\">\n    <dist:module\n        dist:instant=\"\
  false\"\n        dist:onDemand=\"true\"\n        dist:title=\"@string/title_my_dynamic_feature\"\
  >\n        <dist:fusing dist:include=\"true\" />\n    </dist:module>\n    <application\n\
  \        android:allowBackup=\"true\">\n```\n\n注意 `title` 属性引用了字符串资源，该资源也需要在 `strings.xml`\
  \ 文件中声明。此属性强制使用字符串资源而非硬编码字符串。\n\n接下来，需要修改基础模块的 `build.gradle` 文件（`build.gradle (Module:\
  \ app)`）以引用动态功能模块，并添加 Play Core 库作为依赖项：\n\n```gradle\napply plugin: 'com.android.application'\n\
  \nandroid {\n    compileSdkVersion 29\n    dynamicFeatures = [\":secondfeature\"\
  ]\n}\n\ndependencies {\n    api 'com.google.android.play:core:1.10.3'\n}\n```\n\n\
  最后，编辑基础模块的 `AndroidManifest.xml` 文件，将该模块声明为 `SplitCompatApplication` 的子类：\n\n```xml\n\
  <?xml version=\"1.0\" encoding=\"utf-8\"?>\n<manifest xmlns:android=\"http://schemas.android.com/apk/res/android\"\
  \n    package=\"com.ebookfrenzy.mydemoapp\">\n    <application\n        android:name=\n\
  \            \"com.google.android.play.core.splitcompat.SplitCompatApplication\"\
  \n        android:allowBackup=\"true\">\n```\n\n# 84. 使用动态功能模块\n\n一旦应用项目添加了一个或多个动态功能模块，就需要编写代码来安装和管理这些模块。这将涉及执行任务，例如检查模块是否已安装、安装模块、跟踪安装进度以及删除不再需要的已安装模块。所有这些任务都使用\
  \ Play Core 库提供的 API 完成，且这些 API 调用涉及使用 `SplitInstallManager` 实例，可以如下所示创建：\n\n```java\n\
  private SplitInstallManager manager;\nmanager = SplitInstallManagerFactory.create(this);\n\
  ```\n\n通常，在允许用户启动动态功能之前，第一步是检查相应的模块是否已经安装。例如，以下代码获取已安装模块列表并检查特定模块是否安装：\n\n```java\n\
  if (manager.getInstalledModules().contains(\"my_dynamic_feature\")) {\n    // 模块已安装\n\
  }\n```\n\n可以通过构建 `SplitInstallRequest` 对象并将其传递给 `SplitInstallManager` 实例的 `startInstall()`\
  \ 方法来安装一个或多个模块：\n\n```java\nprivate int mySessionID = 0;\n\nSplitInstallRequest\
  \ request =\n        SplitInstallRequest\n            .newBuilder()\n          \
  \  .addModule(\"my_dynamic_feature\")\n            .addModule(\"my_dynamic_feature2\"\
  )\n            .build();\nmanager.startInstall(request)\n    .addOnSuccessListener(new\
  \ OnSuccessListener<Integer>() {\n        @Override\n        public void onSuccess(Integer\
  \ sessionId) {\n            mySessionID = sessionId;\n        }\n    })\n    .addOnFailureListener(new\
  \ FailureListener() {\n        @Override\n        public void onFailure(Exception\
  \ exception) {\n        }\n    });\n```\n\n当执行上述代码时，将开始模块模块。或者，也可以通过将功能名称数组传递给 `deferredInstall()`\
  \ 方法来执行延迟安装：\n\n```java\nmanager.deferredInstall(Arrays.asList(\"my_dynamic_feature\"\
  , \"my_dynamic_feature2\"));\n```\n\n延迟下载由操作系统决定在后台进行。虽然无法跟踪延迟安装的状态，但后通过向 `manager`\
  \ 添加监听器来跟踪非延迟安装的状态：\n\n```java\nSplitInstallStateUpdatedListener listener = new\
  \ SplitInstallStateUpdatedListener() {\n    @Override\n    public void onStateUpdate(InstallSessionState\
  \ state) {\n        if (state.sessionId() == mySessionID) {\n            switch\
  \ (state.status()) {\n                case SplitInstallSessionStatus.REQUIRES_USER_CONFIRMATION:\n\
  \                    // 大模块需要用户权限\n                    break;\n                case\
  \ SplitInstallSessionStatus.DOWNLOADING:\n                    // 模块正在下载\n      \
  \              break;\n                case SplitInstallSessionStatus.INSTALLING:\n\
  \                    // 正在安装已下载的模块\n                    break;\n               \
  \ case SplitInstallSessionStatus.DOWNLOADED:\n                    // 模块下载完成\n  \
  \                  break;\n                case SplitInstallSessionStatus.INSTALLED:\n\
  \                    // 模块已安装\n                    break;\n                case\
  \ SplitInstallSessionStatus.CANCELLED:\n                    // 用户取消了\n         \
  \           break;\n                case SplitInstallSessionStatus.PENDING:\n  \
  \                  // 安装延迟中\n                    break;\n                case SplitInstallSessionStatus.FAILED:\n\
  \                    // 安装失败\n                    break;\n            }\n      \
  \  }\n    }\n};\n```\n\n一旦实现了监听器，需要将其注册到 `SplitInstallManager` 实例中，并在不再需要时注销。\n\n\
  ```java\nmanager.registerListener(listener);\nmanager.unregisterListener(listener);\n\
  ```\n\n# 84.6 处理大功能模块\n\nAndroid 动态交付系统不允许在请求用户许可的情况下下载大于 10MB 的功能模块。当请求下载大功能时，监听器将被调用并传递\
  \ `REQUIRES_USER_CONFIRMATION` 状态。此时，应用程序负责显示确认对话框，并可选实现 `onActivityResult()` 方法以识别用户批准还是拒绝了下载。\n\
  \n```java\nprivate final int REQUEST_CODE = 101;\n\nSplitInstallStateUpdatedListener\
  \ listener = new SplitInstallStateUpdatedListener() {\n    @Override\n    public\
  \ void onStateUpdate(InstallSessionState state) {\n        if (state.sessionId()\
  \ == mySessionID) {\n            switch (state.status()) {\n                case\
  \ SplitInstallSessionStatus.REQUIRES_USER_CONFIRMATION:\n                    try\
  \ {\n                        manager.startConfirmationDialog(state, MainActivity.this,\
  \ REQUEST_CODE);\n                    } catch (IntentSender.SendIntentException\
  \ ex) {\n                        // 请求失败\n                    }\n              \
  \      break;\n            }\n        }\n    }\n};\n```\n\n\n\n上述代码启动了一个意图（intent），随后显示内置的确认对话框。该意图会将结果代码返回到\
  \ `onActivityResult()` 方法，方法的实现可能如下：\n\n```java\n@Override\npublic void onActivityResult(int\
  \ requestCode, int resultCode, Intent data) {\n    if (requestCode == REQUEST_CODE)\
  \ {\n        if (resultCode == RESULT_OK) {\n            // 用户批准了安装\n        } else\
  \ {\n            // 用户拒绝了安装\n        }\n    }\n}\n```\n\n如果用户批准了请求，动态功能模块将自动下载并安装。\n\
  \n### 84.7 总结\n\n动态功能模块允许 Android 应用被拆分为独立的功能模块，这些功能模块在用户需要时按需下载。动态功能模块也可以配置为即时功能（instant\
  \ features）。即时功能可以在不向设备上安装应用的情况下运行，并且用户可以通过应用商店页面上的“立即尝试”（Try Now）按钮或通过 Web URL\
  \ 访问。\n\n动态功能的实现涉及将应用拆分为一个基础模块（base module）和一个或多个动态功能模块。可以在 Android Studio 中创建新的动态功能模块，也可以通过对项目配置进行少量更改，将现有模块转换为动态功能模块。\n\
  \n一旦动态功能模块被添加到应用中，应用将通过 Play Core 库的 `SplitInstall` 类处理这些模块的下载和管理。\n\n# 85 Android\
  \ Studio 动态功能教程\n\n在上一章中涵盖了 Android 动态交付和动态功能的各种概念后，本章将以示例项目的形式将理论付诸实践。在本章创建的应用将包含两个\
  \ Activity，其中第一个将作为应用的基础模块，而第二个将指定为动态功能，以便从运行中的应用内部按需下载。本教程将包括在 Android Studio 内部创建动态模块的步骤、将应用包上传到\
  \ Google Play 商店进行测试，以及使用 Play Core 库下载和管理动态功能。本章还将探索延迟动态功能安装的使用。\n\n## 85.1 创建\
  \ DynamicFeature 项目\n\n从欢迎界面选择“New Project”（新建项目）选项，在随后弹出的新项目对话框中，点击“Next”（下一步）按钮之前选择“Empty\
  \ Activity”模板。\n\n在`Name`字段中输入 `DynamicFeature`，并指定一个在 Google Play 生态系统中唯一标识您的应用的包名（例如\
  \ `com.<your company>.dynamicfeature`）作为包名。在点击“Finish”（完成）按钮之前，将 Minimum API level\
  \ 设置更改为 `API 26: Android 8.0 (Oreo)`，并将语言菜单设置为 Java。\n\n## 85.2 为项目添加动态功能支持\n\n\
  在开始实现应用之前，需要对项目进行两项更改以添加对动态功能的支持。由于项目将大量使用 Play Core 库，因此需要在构建配置中添加一条指令以包含此库。在 Android\
  \ Studio 中，打开应用级别的 `build.gradle` 文件（`Gradle Scripts -> `build.gradle (Module: DynamicFeature.app)`），定位到\
  \ `dependencies` 部分并按如下所示添加 Play Core 库（请像既往一样记住，现在可能有该库的更新版本）：\n\n```gradle\ndependencies\
  \ {\n    implementation 'com.google.android.play:core:1.10.3'\n}\n```\n\n一旦下载了动态功能模块，用户很可能需要立即访问组成该功能的代码和资源资产。但在默认情况下，在应用重启之前，新安装的功能模块对应用的其余部分不可用。幸运的是，通过在项目中启用\
  \ `SplitCompat` 库可以避免这一缺陷。到目前为止，实现此点的简单方法是在主 `AndroidManifest.xml` 文件（也称为基础模块清单）中将应用程序声明为子类\
  \ `SplitCompatApplication`，如下：\n\n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"\
  ?>\n<manifest xmlns:android=\"http://schemas.android.com/apk/res/android\"\n   \
  \ package=\"com.ebookfrenzy.dynamicfeature\">\n<application\n        android:name=\"\
  com.google.android.play.core.splitcompat.SplitCompatApplication\"\n        android:allowBackup=\"\
  true\"\n        android:icon=\"@mipmap/ic_launcher\"\n        android:label=\"@string/app_name\"\
  \n        android:roundIcon=\"@mipmap/ic_launcher_round\">\n```\n\n## 85.3 设计 Base\
  \ Activity 用户界面\n\n此时，项目包含一个 Activity，它将作为应用基础模块的入口点。该基础模块将负责请求、安装和管理动态功能模块。\n\n\
  为了演示动态功能的使用，基础 Activity 将由一系列按钮组成，允许安装、启动和删除动态功能模块。用户界面还将包含一个 `TextView`，用于显示与动态功能相关的状态信息。根据这些需求，将\
  \ `activity_main.xml` 布局文件加载到布局编辑器中，删除默认的 `TextView` 对象，并实现设计使其类似于图 85-1。\n\n一旦对齐对象，选择\
  \ `TextView` 并使用 Attributes（属性）工具窗口将 `id` 属性设置为 `status_text`。通过选择所有对象、右键点击 `TextView`\
  \ 并选择 `Center -> Horizontally`（居水平）选项开始应用布局约束，从而将所有对象约束在水平中心。\n\n在所有对象仍被选中的情况下，右键点击\
  \ TextView，这次选择 `Chains -> Vertical Chain`（链->垂直链）选项。在继续之前，将所有文本字符串提取到资源，并配置三个按钮分别调用名为\
  \ `launchFeature`、`installFeature` 和 `deleteFeature` 方法。\n\n## 85.4 添加动态功能模块\n\n\
  要向项目添加动态功能模块，选择 `File -> New -> New Module...` 菜单选项，在随后对话框中，从左侧面板选择 `Dynamic Feature`。在主面板中，将模块命名为\
  \ `my_dynamic_feature`，并将最小 API 设置更改为 `API 26: Android 8.0 (Oreo)`，以便与为基础模块选择的 API\
  \ 级别匹配，如图 85-2 所示。\n\n再次点击 Next 按钮配置 On-Demand（按需）选项，确保 Fusing（融合）选项已启用。在 `Module\
  \ Title` 字段中输入文本“My Example Dynamic”。\n\n在点击 Finish 按钮之前，将安装时包含菜单设置为 `Do not include\
  \ module at install time (on-demand only)`（安装时不包含该模块（仅限按需））。\n\n## 85.5 审查动态功能模块\n\
  \n在继续下一步之前，值得花时间查看 Android Studio 对项目进行的更改。理解这些更改在解决问题和将现有应用功能转换为动态功能时都有用。\n\n首先参考\
  \ Project 工具窗口，其中将出现一个新项代表包含新动态功能模块的文件夹：\n\n图 85-4\n\n\n\n\n\n请注意，该功能拥有自己的子结构，包括一个清单文件（manifest）、一个可以添加代码和资源的包以及一个\
  \ `res` 文件夹。打开并查看 `AndroidManifest.xml` 文件，它应该包含在功能创建过程中选择的属性设置，包括按需加载（on-demand）、融合（fusing）和功能标题的取值：\n\
  \n```xml\n<manifest xmlns:android=\"http://schemas.android.com/apk/res/android\"\
  \n    xmlns:dist=\"http://schemas.android.com/apk/distribution\"\n    package=\"\
  com.ebookfrenzy.my_dynamic_feature\">\n    <dist:module\n        dist:instant=\"\
  false\"\n        dist:title=\"@string/title_my_dynamic_feature\">\n        <dist:delivery>\n\
  \            <dist:on-demand />\n        </dist:delivery>\n        <dist:fusing\
  \ dist:include=\"true\" />\n    </dist:module>\n</manifest>\n```\n\n特别值得注意的是，模块标题字符串已作为字符串资源存储，而不是直接输入到清单文件中。这是标题字符串的前提条件，可以在基础模块的\
  \ `strings.xml` 文件（`app -> res -> values -> strings.xml`）中找到并在必要时进行修改。\n\n动态功能模块的构建配置可以在\
  \ `Gradle Scripts -> build.gradle (Module: DynamicFeature.my_dynamic_feature)` 文件中找到，内容如下：\n\
  \n```gradle\nplugins {\n    id 'com.android.dynamic-feature'\n}\n\nandroid {\n \
  \   compileSdkVersion 33\n}\n\ndependencies {\n    implementation project(\":app\"\
  )\n}\n```\n\n该文件中的关键条目应用了 `com.android.dynamic-feature` 插件，这确保了该模块被视为动态功能，以及 `implementation`\
  \ 行表示该功能依赖于基础（`app`）模块。\n\n基础模块的 `build.gradle` 文件（`Gradle Scripts -> build.gradle\
  \ (Module: DynamicFeature.app)`）包含包含列出动态功能模块的新条目。在查看该文件时，添加指令启用视图绑定（view binding）支持：\n\
  \n```gradle\nplugins {\n    id 'com.android.application'\n}\nandroid {\n    buildFeatures\
  \ {\n        viewBinding true\n    }\n    dynamicFeatures = [':my_dynamic_feature']\n\
  }\n```\n\n项目中添加的任何额外动态功能也需要在此处引用，例如：`dynamicFeatures = [\":my_dynamic_feature\"\
  , \":my_second_feature\", ...]`\n\n## 85.6 添加动态功能 Activity\n\n从上方的图 85-4 所示的 Project\
  \ 工具窗口可以清楚地看到，此时动态功能模块仅包含一个清单文件。下一步是向模块添加一个 activity，以便该功能在从基础模块内部启动时能够执行实际操作。在\
  \ Project 工具窗口中，右键点击位于 `my_dynamic_feature -> java` 下的包名，选择 `New -> Activity ->\
  \ Empty Activity` 菜单选项。将 activity 命名为 `MyFeatureActivity` 并启用 `Generate Layout File`\
  \ 选项，但在点击 `Finish` 按钮之前禁用 `Launcher Activity` 选项。\n\n![](img/as_4.2_add_dynamic_feature_activity.jpg)\n\
  图 85-5\n\n一旦 activity 添加到模块中，编辑 `AndroidManifest.xml` 文件并对其进行修改，添加意图过滤器（intent filter），这将允许基础模块启动该\
  \ activity（其中 `<com.yourcompany>` 替换为为了在 Google Play 上使应用唯一而选择的包名）：\n\n```xml\n\
  <?xml version=\"1.0\" encoding=\"utf-8\"?>\n<manifest xmlns:android=\"http://schemas.android.com/apk/res/android\"\
  \n    xmlns:dist=\"http://schemas.android.com/apk/distribution\"\n    package=\"\
  com.ebookfrenzy.my_dynamic_feature\">\n    <dist:module\n        dist:instant=\"\
  false\"\n        dist:title=\"@string/title_my_dynamic_feature\">\n        <dist:delivery>\n\
  \            <dist:on-demand />\n        </dist:delivery>\n        <dist:fusing\
  \ dist:include=\"true\" />\n    </dist:module>\n    <application>\n        <activity\
  \ android:name=\".MyFeatureActivity\" android:exported=\"true\">\n            <intent-filter>\n\
  \                <action android:name=\"android.intent.action.VIEW\" />\n      \
  \          <action android:name=\"com.yourcompany.my_dynamic_feature.MyFeatureActivity\"\
  \ />\n                <category android:name=\"android.intent.category.DEFAULT\"\
  \ />\n            </intent-filter>\n        </activity>\n    </application>\n</manifest>\n\
  ```\n\n接下来，编辑 `build.gradle (Module: DynamicFeature.my_dynamic_feature)` 文件的 `dependencies`\
