  \ 总结\n\n出现在大多数 Android 应用顶部的应用栏由许多不同的元素组成，包括工具栏、标签布局甚至图像视图。当嵌入在 `CoordinatorLayout`\
  \ 父布局中时，可以使用许多不同的选项来控制应用栏响应活动主要内容滚动事件的行为方式。为了对这种行为进行更深入的控制，`CollapsingToolbarLayout`\
  \ 管理器提供了一系列额外的控制级别，用于控制应用栏内容相对于滚动活动展开和收缩的方式。\n\n## 51. Android Studio 主列表/详情流教程\n\
  \n本章将在详细探索构成 Android Studio 包含的主列表/详情流模板的元素之前，解释主列表/详情用户界面的设计概念。随后将创建一个示例应用程序，演示修改模板以满足应用程序开发者特定需求的步骤。\n\
  \n### 51.1 主列表/详情流\n\n主列表/详情流是一种界面设计概念，其中向用户显示一个项目列表（称为主列表）。当从列表中选择一个项目时，与该项目相关的额外信息将将在详情面板（detail\
  \ pane）中呈现给用户。例如，一个电子邮件应用程序可能包含一个接收消息的主列表，其中包含发件者地址和邮件主题。从主列表中选择某条消息后，邮件正文将出现在详情面板中。\n\
  \n在横屏模式的平板电脑尺寸 Android 设备屏幕上，主列表显示在屏幕左边缘的狭窄垂直面板中。屏幕的其余部分留给详情面板，这种布局被称为“双窗模式”。例如，图\
  \ 51-1 显示了主列表/详情的双窗布局，其中列出了主项目，详情面板中显示了项目一的内容：\n\n![](img/as_detail_flow_tablet.jpg)\n\
  \n图 5-1\n\n在较小的手机尺寸设备上，主列表占据整个屏幕，当从主列表中做出选择时，详情面板将出现在单独屏幕上。在这种模式下，详情屏幕包含一个返回主列表的动作栏。\n\
  \n![](img/as_detail_flow_phone.jpg)\n\n图 5-2\n\n### 51.2 创建主列表/详情流\n\n在本章的下一节中，将介绍组成主列表/详情流的不同元素。实现此点的最佳方法是使用该模板创建一个项目。从欢迎界面选择\
  \ `New`（新建）选项，在新项目对话框中选择 `Primary/Detail` 模板。在 `Name` 字段中输入 `PrimaryDetailFlow`，并指定\
  \ `com.ebookfrenzy.primarydetailflow` 为包名。在点击 `Finish`（完成）按钮之前，将最低 API 级别改为 `API\
  \ 26: Android 8.0 (Oreo)`并将语言设置为 `Java`。\n\n### 51.3 修改主列表/详情模板\n\n虽然主列表/详情流模板的结构初看起来可能很复杂（正如后面所示），但模板提供的功能对于许多主列表/详情需求可以保持不变。在本章的剩余部分，将修改\
  \ `PrimaryDetailFlow` 项目，使主列表显示网站列表，并将详情面板更改为包含 `WebView` 对象而不是当前的 `TextView`。当用户选择网站时，相应的网页将在详情面板中加载并显示。\n\
  \n### 51.4 更改内容模型\n\n示例的内容由 `PlaceholderContent` 类定义。因此，首先选择 `PlaceholderContent.java`\
  \ 文件（位于项目窗口的 `app` -> `com.ebookfrenzy.primarydetailflow` -> `placeholder` 文件夹中）并查看代码。文件底部是\
  \ `PlaceholderItem` 类的声明，它目前可以存储表示内容和详情的三个 `String` 对象以及一个 `ID`。然而，更新后的项目需要每个对象包含一个\
  \ `ID` 字符串、一个网站名称字符串以及一个相应的 URL。为了添加这些功能，请修改 `PlaceholderItem` 类，如下所示：\n\n```java\n\
  public static class PlaceholderItem {\n    public String id;\n    public String\
  \ website_name;\n    public String website_url;\n\n    public PlaceholderItem(String\
  \ id, String website_name, String website_url) {\n        this.id = id;\n      \
  \  this.website_name = website_name;\n        this.website_url = website_url;\n\
  \    }\n}\n```\n\n\n\n\n\n```java\n        public String toString() {\n        \
  \    return website_name;\n        }\n}\n```\n\n注意，封装的 `PlaceholderContent` 类目前包含一个\
  \ for 循环，它通过多次调用 `createPlaceholderItem()` 和 `makeDetails()` 方法添加了 25 个项目。这些代码大部分将不再需要，并应按照如下方式从类中删除：\n\
  \n```java\npublic static final Map<String, PlaceholderItem> ITEM_MAP = new HashMap<String,\
  \ PlaceholderItem>();\n\nprivate static final int COUNT = 25;\n\nstatic {\n    //\
  \ 添加一些示例项。\n    for (int i = 1; i <= COUNT; i++) {\n        addItem(createPlaceholderItem(i));\n\
  \    }\n}\n\nprivate static void addItem(PlaceholderItem item) {\n    ITEMS.add(item);\n\
  \    ITEM_MAP.put(item.id, item);\n}\n\nprivate static PlaceholderItem createPlaceholderItem(int\
  \ position) {\n    return new PlaceholderItem(String.valueOf(position), \"Item \"\
  \ + position, makeDetails(position));\n}\n\nprivate static String makeDetails(int\
  \ position) {\n    StringBuilder builder = new StringBuilder();\n    builder.append(\"\
  Details about Item: \").append(position);\n    for (int i = 0; i < position; i++)\
  \ {\n        builder.append(\"\\nMore details information here.\");\n    }\n   \
  \ return builder.toString();\n}\n```\n\n此代码需要修改以用所需的网站数据初始化数据模型：\n\n```java\npublic\
  \ static final Map<String, PlaceholderItem> ITEM_MAP =\n    new HashMap<String,\
  \ PlaceholderItem>();\n\nstatic {\n    // 添加 3 个示例项。\n    addItem(new PlaceholderItem(\"\
  1\", \"eBookFrenzy\", \"https://www.ebookfrenzy.com\"));\n    addItem(new PlaceholderItem(\"\
  2\", \"Amazon\", \"https://www.amazon.com\"));\n    addItem(new PlaceholderItem(\"\
  3\", \"New York Times\", \"https://www.nytimes.com\"));\n}\n```\n\n现在代码利用了修改后的 `PlaceholderItem`\
  \ 类来存储每个项目的 ID、网站名称和 URL。\n\n## 51.5 修改详情窗格（Detail Pane）\n\n详情窗格的布局（当用户从主列表中选择项目时显示的屏幕）包含在\
  \ `activity_item_detail.xml` 文件中，该文件包含一个 `FrameContainerView` 实例，用于显示实际的详情窗格内容。如果应用以单窗格模式显示，框架容器将显示\
  \ `fragment_item_detail.xml` 文件中的布局，而多窗格模式将显示 `fragment_item_detail.xml (sw600dp)`\
  \ 布局。AndroidAndroid 为 `fragment_item_detail.xml` 提供的模板布局包含一个 Coordinator 布局，其中包含一个应用栏（app\
  \ bar）、工具栏（toolbar）、浮动按钮和一个文本视图。对于本示例，我们需要显示的是 `WebView`，因此打开此文件并删除布局中除 `item_detail_container`\
  \ 视图以外的所有视图。执行此操作最简单的方法是在组件树（Component Tree）中如如下所示选择所有不需要的视图，然后按下键盘上的删除 键：\n\n![](img/as_primary_detail_component_tree.jpg)\n\
  \n图 51-3\n\n从调色板（Palette）的 Widgets 部分拖入 `WebView` 对象并将其放置在布局画布的中心，并将 id 更改为 `website_detail`。\n\
  \n接下来，编辑 `fragment_item_detail.xml (sw600dp)` 文件，并在拖放 `WebView` 到布局之前删除默认的 `TextView`\
  \ 实例，再次将 id 更改为 `website_detail`。两个文件的布局现在应该类似于 图 51-4：\n\n![](img/as_3.5_master_detail_webview.jpg)\n\
  \n图 51-4\n\n## 51.6 修改 ItemDetailFragment 类\n\n此时，用户界面详情窗格已过修改，但相应的 Java 类仍然设计用于处理\
  \ `TextView` 对象而不是 `WebView`。在项目工具窗口中双击 `ItemDetailFragment.java` 文件来加载该类的源代码。\n\
  \n要加载与当前所选项目对应的网页 URL，只需要更改几行代码。一旦完成此更改，代码读取内容如下：\n\n```java\n.\n.\nimport android.webkit.WebResourceRequest;\n\
  import android.webkit.WebView;\nimport android.webkit.WebViewClient;\n.\npublic\
  \ class ItemDetailFragment extends Fragment {\n.\n.\n    @Override\n    public View\
  \ onCreateView(LayoutInflater inflater, ViewGroup container, Bundle savedInstanceState)\
  \ {\n        binding = FragmentItemDetailBinding.inflate(inflater, container, false);\n\
  \        View rootView = binding.getRoot();\n        mToolbarLayout = rootView.findViewById(R.id.toolbar_layout);\n\
  \        mTextView = binding.ItemDetail;\n        updateContent();\n        rootView.setOnDragListener(dragListener);\n\
  \        return rootView;\n    }\n.\n    private void updateContent() {\n      \
  \  if (mItem != null) {\n            binding.websiteDetail.setWebViewClient(new\
  \ WebViewClient(){\n                @Override\n                public boolean shouldOverrideUrlLoading(WebView\
  \ view, WebResourceRequest request) {\n                    return super.shouldOverrideUrlLoading(view,\
  \ request);\n                }\n            });\n            binding.websiteDetail.loadUrl(mItem.website_url);\n\
  \        }\n    }\n.\n}\n```\n\n在上述代码中，进行了更改以删除对工具栏布局和项目详情元素的元素的引用，这些元素之前已经从 `fragment_item_detail.xml`\
  \ 文件中删除了。\n\n接下来，修改了 `updateContent()` 以访问 `website_detail` 视图（之前是 `TextView`，现在是\
  \ `WebView`）并从所选项目中提取网站 URL。创建了 `WebViewClient` 类的实例并为其分配了 `shouldOverrideUrlLoading()`\
  \ 回调方法。实现此方法的目的是强制系统使用 `WebView` 实例加载页面，而不是 Chrome 浏览器。\n\n## 51.7 修改 ItemListFragment\
  \ 类\n\n还需要对 `ItemListFragment.java` 文件进行细微更改，以确保网站名称出现在主列表中。编辑此文件，找到 `onBindViewHolder()`\
  \ 方法并修改 `setText()` 方法调用，以如下所示引用网站名称：\n\n```java\n@Override\npublic void onBindViewHolder(final\
  \ ViewHolder holder, int position) {\n    holder.mIdView.setText(mValues.get(position).id);\n\
  \    holder.mContentView.setText(mValues.get(position).website_name);\n.\n.\n  \
  \  // 识别内容的 ID\n    ClipData.Item clipItem = new ClipData.Item(mValues.get(position).id);\n\
  \    ClipData dragData = new ClipData(\n        ((PlaceholderContent.PlaceholderItem)\
  \ v.getTag()).website_name,\n        new String[]{ClipDescription.MIMYPE_TEXT_PLAIN},\n\
  \        clipItem\n    );\n.\n.\n```\n\n## 51.8 添加 Manifest 权限\n\n最后一步是通过清单文件为应用程序添加权限。这将允许\
  \ `WebView` 对象访问互联网并下载网页。导航到项目工具窗口（app -> manifests）中的 `AndroidManifest.xml` 文件，并双击将其加载到编辑器。加载后，在文件中添加相应的权限行：\n\
  \n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<manifest xmlns:android=\"\
  http://schemas.android.com/apk/res/android\"\n    package=\"com.ebookfrenzy.PrimaryDetailflow\"\
  \ >\n    <uses-permission android:name=\"android.permission.INTERNET\" />\n    <application\n\
  \        android:allowBackup=\"true\"\n```\n\n## 51.9 运行应用程序\n\n在配置适当模拟器或连接的 Android\
  \ 设备上编译并运行应用程序。根据显示屏，应用程序将以小屏或双窗格模式显示。无论如何，主列表都应该准备好了内容模型中定义的三个网站名称。选择一个项目将导致相应的网站在详情窗格中显示，如图\
  \ 51-5 中的双窗格模式所示：\n\n![](img/as_detail_flow_running.jpg)\n\n图 51-5\n\n\n\n\n\n#\
  \ 图 51-5\n\n## 51.10 总结\n主/详情用户界面由一个主项目列表组成，当选择某一项时，会在详情面板中显示关于该选择项的额外信息。主/详情流（Primary/Detail\
  \ Flow）是 Android Studio 提供的一个模板，允许快速且相对轻松地创建主/详情布局。正如本章所示，通过对默认模板文件进行微调，就可以用极少的编码和设计工作实现广泛基于主/详情的功能。\n\
  \n## 52. Android 服务概览\n`Service` 类专门设计用于允许应用程序启动并执行后台任务。与广播接收器（broadcast receivers）不同，广播接收器旨在快速执行任务后退出，而服务设计用于执行需要较长时间才能完成的任务（例如通过互联网连接下载文件或向用户流式音乐），但不需要用户界面。\n\
  \n在本章中，将概述不同类型的可用服务，包括绑定服务（bound services）和意图服务（intent services）。在介绍这些基础之后，后续章节将通过一些服务的运行示例。\n\
  \n### 52.1 Intent Service 意图服务\n如前所述，服务默认运行在启动它的组件所在的同一个主线程中。因此，服务需要执行的任何 CPU 密集型任务应在新线程中进行，从而避免影响调用应用程序的性能。\n\
  \n`JobIntentService` 类是一个便利类（继承自 `Service` 类），它为处理后台任务设置了一个工作线程，并以异步方式处理每个请求。一旦服务处理了所有队列中的请求，它就会直接退出。使用\
  \ `JobIntentService` 类时，只需要实现 `onHandleWork()` 方法，并在其中包含每个请求要执行的代码。\n\n对于不需要对请求进行同步处理的服务，`JobIntentService`\
  \ 是推荐的选项。然而，需要同步处理请求的服务需要继承 `Service` 类，并手动实现和管理线程，以高效地处理任何 CPU 密集型任务。\n\n### 52.2\
  \ Bound Service 绑定服务\n绑定服务允许启动组件与服务交互并从其接收结果。通过实现进程间通信（IPC），这种交互也可以跨进程边界进行。例如，一个\
  \ Activity 可能会启动一个服务来处理音频播放。该 Activity 可能包含一个用户界面，为用户提供暂停播放或跳到下一曲的控制。同样，服务很可能需要向调用的\
  \ Activity 通信信息，以指示当前音频轨道已完成，并提供即将开始播放的下一曲的详情。\n\n组件（在此上下文中也称为客户端）通过调用 `bindService()`\
  \ 方法启动并绑定到绑定服务。此外，多个组件可以同时绑定到一个服务。当客户端不再需要服务绑定关系时，应调用 `unbindService()` 方法。当最后一个绑定客户端从服务取消绑定时，服务将由\
  \ Android 运行时系统终止。需要注意的是，绑定服务也可以通过调用 `startService()` 来启动。一旦启动，组件随后可以通过 `bindService()`\
  \ 调用绑定到它。当通过调用 `startService()` 启动绑定服务时，即使在最后一个客户端从其上取消绑定后，它仍将继续运行。\n\n绑定服务必须包含\
  \ `onBind()` 方法的实现，该方法在服务首次创建以及其他客户端随后绑定到正在运行的服务时都会被调用。该方法的目的是向绑定客户端返回一个类型为 `IBinder`\
  \ 的对象，该对象包含了客户端与服务通信所需的信息。\n\n在实现客户端与绑定服务之间的通信方面，推荐的技术取决于客户端和力是否位于同一个进程或不同的进程中，以及服务是否对客户端是私有的。本地通信可以通过扩展\
  \ `Binder` 类并在 `onBind()` 方法中返回一个实例来实现。相反，进程间通信需要 `Messenger` 和 `Handler` 的实现。这两种方法的细节将在后面的章节中介绍。\n\
  \n### 52.3 服务的内部结构\n正如已经提到的，服务必须创建为 Android `Service` 类（更具体说是 `android.app.Service`）或其子类（如\
  \ `android.app.IntentService`）。在子类化过程中，取决于所创建的服务的具体性质，必须重写以下一个或多个父类回调方法：\n\n- `onStartCommand()`\
  \ – 当服务通过另一个组件调用 `startService()` 方法启动时，会调用此方法。绑定服务不需要实现此方法。\n- `onBind()` – 当组件通过调用\
  \ `bindService()` 方法绑定到服务时被调用。在实现绑定服务时，此方法必须返回一个 `IBinder` 对象，以便与客户端进行通信。\n- `onCreate()`\
  \ – 意用于执行初始化任务的地方，该方法在调用 `onStartCommand()` 之前或第一次调用 `onBind()` 方法之前立即被调用。\n- `onDestroy()`\
  \ – 当服务被销毁时调用。\n- `onHandleWork()` – 仅适用于 `JobIntentService` 子类。调用此方法来处理服务的逻辑。它在主应用程序的单独线程中执行。\n\
  \n注意，`IntentService` 类包含了自己的 `onStartCommand()` 和 `onBind()` 回调方法的实现，因此在子类中不需要实现这些方法。\n\
  \n### 52.4 控制已销毁服务的重启选项\n`onStartCommand()` 回调方法要求返回一个整数值，以定义当服务被 Android 运行时系统销毁时发生什么。这些方法的可能的返回值如下：\n\
  \n- `START_NOT_STICKY` – 指示系统在服务销毁时，除非有挂起的意图，否则不要重启。\n- `START_STICKY` – 指示如果在 `onStartCommand()`\
  \ 方法返回后被销毁，应尽快重启服务。如果没有等待交付的挂起意图，调用 `onStartCommand()` 回调方法将传入 `null` 意图。销毁时正在处理的意图将被丢弃。\n\
  - `START_REDELIVER_INTENT` – 指示如果服务从 `onStartCommand()` 回调方法返回后被销毁，应重启服务并将当前意图重新传递给\
  \ `onStartCommand()` 方法，随后是任何挂起的意图。\n\n### 52.5 在清单文件中声明服务\n为了使服务可用，必须先在清单文件中进行声明。这涉及将配置适当的\
  \ `<service>` 元素嵌入现有的 `<application>` 条目中。至少`<service>` 元素必须包含一个声明服务类名的属性，如下 XML\
  \ 片段所示：\n\n```xml\n<application\n    android:icon=\"@mipmap/ic_launcher\"\n    android:label=\"\
  @string/app_name\" >\n    <activity\n        android:label=\"@string/app_name\"\n\
  \        android:name=\".MainActivity\" >\n        <intent-filter>\n           \
  \ <action android:name=\"android.intent.action.MAIN\" />\n        </intent-filter>\n\
  \    </activity>\n</application>\n```\n\n\n\n\n\n```xml\n<manifest>\n    <category\
  \ android:name=\"android.intent.category.LAUNCHER\" />\n    </intent-filter>\n \
  \ </activity>\n  <service android:name=\".MyService\">\n</service>\n</application>\n\
  </manifest>\n```\n\n默认情况下，服务被声明为公开的，这意味着它可以被应用程序包之外的组件访问。要使服务变为私有，必须在清单文件的 `<service>`\
  \ 元素中将 `android:exported` 属性声明为 `false`。例如：\n\n```xml\n<service android:name=\"\
  MyService\"\n         android:exported=\"false\">\n</service>\n```\n\n在使用 `JobIntentService`\
  \ 时，清单中的 Service 声明还必须按照如下方式请求 `BIND_JOB_SERVICE` 权限：\n\n```xml\n<service\n    android:name=\"\
  .MyJobIntentService\"\n    android:permission=\"android.permission.BIND_JOB_SERVICE\"\
  \ />\n```\n\n如前所述，默认情况下，服务运行在与调用组件相同的进程中。要强制服务运行在自己的进程中，请向 `<service>` 元素中添加 `android:process`\
  \ 属性，并声明一个以冒号 (:) 前缀的进程名称：\n\n```xml\n<service android:name=\".MyService\"\n   \
  \      android:exported=\"false\"\n         android:process=\":myprocess\">\n</service>\n\
  ```\n\n冒号前缀表示新进程是本地应用程序私有的。然而，如果进程名称以小写字母而不是冒号开头，则该进程是全局的，可供其他组件使用。\n\n最后，通过使用与\
  \ Activity 相同的意图过滤器机制，服务还可以向设备上运行的其他应用程序发布功能。有关意图过滤器的更多细节，请参阅标题为“Android Intent\
  \ 概述” 的章节。\n\n## 52.6 在系统启动时运行的服务\n\n鉴于服务的后台特性，在 Android 系统首次启动时需要启动服务并不罕见。这可以通过创建一个广播接收器（broadcast\
  \ receiver）来实现，配置意图过滤器以监听系统 `android.intent.action.BOOT_COMPLETED` 意。当检测到此类意图时，广播接收器只需调用必要的服务然后返回。注意，为了能够运行，此类广播接收器需要请求\
  \ `android.permission.RECEIVE_BOOT_COMPLETED` 权限。\n\n## 52.7 总结\n\nAndroid 服务是一种强大的机制，允许应用程序在后台执行任务。服务一旦启动，无论调用它的应用程序是否为前台任务，即使启动服务的组件被销毁，它都将继续运行。\n\
  \n服务派生自 `Android Service` 类。绑定服务（Bound services）为其他客户端组件提供了通信接口，并且通常一直运行到最后一个客户端从服务解绑。\n\
  \n默认情况下，服务在与调用应用程序相同的进程和主线程中本地运行。因此，应该在服务内部创建一个新线程，用于处理 CPU 密集型任务。远程服务可以通过对应用程序清单文件中相应的\
  \ `<service>` 条目进行细小的配置更改，在单独的进程启动。\n\n`IntentService` 类（其本身是 `Android Service`\
  \ 类的子类）提供了一种方便的机制，用于在单独的工作线程中处理异步服务请求。\n\n## 53. Android Intent 概述\n\n读到这本书的这里，应该清楚\
  \ Android 应用由一个或多个 Activity 组成。然而，一个尚未详细介绍的领域是一个 Activity 触发另一个 Activity 启动的机制。正如标题为“Android\
  \ 应用程序剖析” 的章节简述过的，这主要通过使用 Intent 实现。\n\n在接下来的章节通过一些基于 Android Studio 的 Intent 示例实现之前，本章的目标是以显式意图（explicit\
  \ intents）和隐式意图（implicit intents）的形式提供 Intent 的概述，并介绍意图过滤器。\n\n### 53.1 Intent 概述\n\
  \nIntent (`android.content.Intent`) 是一个 Activity 启动另一个 Activity 的消息系统。例如，Activity\
  \ 可以发布一个意图来请求启动同一个应用程序内的另一个 Activity。然而，Intent 还超越了这一概念，它允许 Activity 请求设备上任何已适当注册并配置了权限的另一个\
  \ Activity 的服务。例如，考虑应用程序中一个需要加载并向用户显示网页的 Activity。应用程序并不需要包含第二个 Activity 来执行此任务，代码只需发送一个意图给\
  \ Android 运行时，请求任何注册了显示网页能力的 Activity 服务。运行时系统会将该请求与设备上可用的 Activity 进行匹配，并启动匹配的\
  \ Activity，或者在存在多个匹配项的情况下，允许用户决定使用哪个 Activity。\n\nIntent 还允许将数据从发送方 Activity 传输到接收方\
  \ Activity。在之前描述的场景中，例如，发送方 Activity 需要将显示的网页 URL 发送给第二个 Activity。同样，接收方 Activity\
  \ 也可以配置为在完成任务后将数据返回给发送方 Activity。\n\n虽然在后面的章节才会介绍，但值得强调的是，Intent 除了启动 Activity 外，还用于启动并与服务及广播接收器通信。\n\
  \nIntent 分为显式意图或隐式意图。\n\n### 53.2 显式意图\n\n显式意图通过引用目标 Activity 的组件名称（实际上是类名）来请求启动特定的\
  \ Activity。这种方法在启动与发送方 位于同一应用程序的 Activity 时常见（因为开发者知道类名）。\n\n显式意图是通过创建 Intent 类实例并传递\
  \ Activity Context 和要启动的 Activity 组件名称来实现的。然后调用 `startActivity()` 方法并将 Intent 对象作为参数传递。例如，以下代码段为类名为\
  \ `ActivityB` 的 Activity 发布显式意图：\n\n```java\nIntent i = new Intent(this, ActivityB.class);\n\
  startActivity(i);\n```\n\n数据可以在启动 Intent 对象之前，通过调用其 `putExtra()` 方法传输到接收方 Activity。数据必须以键值对的形式添加。以下代码扩展了之前的示例，向\
  \ Intent 分别添加键为 `myString` 和 `myInt` 的字符串和整数：\n\n```java\nIntent i = new Intent(this,\
  \ ActivityB.class);\ni.putExtra(\"myString\", \"这是给 ActivityB 的消息\");\ni.putExtra(\"\
  myInt\", 100);\nstartActivity(i);\n```\n\n数据作为 Bundle 对象的一部分被目标 Activity 接收，可以通过调用\
  \ `getIntent().getExtras()` 获取。Activity 类的 `getIntent()` 方法返回启动 Activity 的 intent，而\
  \ `getExtras()` 方法（Intent 类的）返回一个包含数据的 Bundle 对象。例如，提取传递给 `ActivityB` 的数据值：\n\n\
  ```java\nBundle extras = getIntent().getExtras();\nif (extras != null) {\n    String\
  \ myString = extras.getString(\"myString\");\n    int myInt = extras.getInt(\"myInt\"\
  );\n}\n```\n\n[/content] ​（抱歉，在处理翻译时发现您提供的原文文本在 `53.2 Explicit Intents` 之后似乎截断了，我根据您提供的文本内容完成了翻译。如果有后续文本，请继续提供。）​（注：我注意到您提供的待翻译文本在\
