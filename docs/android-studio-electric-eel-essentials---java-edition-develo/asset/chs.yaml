  图 85-6\n\n## 85.7 实现 launch() 方法\n\n结构和界面设计完成后，现在是使用 Play Core 库开始处理动态功能模块了。第一步是实现\
  \ `launch()` 方法，其目的是使用启动启动动态功能 activity。然而，启动尚未安装的动态功能模块中的 activity 会导致应用崩溃。因此，`launch()`\
  \ 方法需要包含防御性代码以确保动态功能已安装。为了实现这一点，我们需要创建 `SplitInstallManager` 类的实例，并调用该对象的 `getInstalledModules()`\
  \ 方法来检查 `my_dynamic_feature` 模块是否已安装。如果已安装，则可以安全地启动模块包含的 activity，否则需要在状态 `TextView`\
  \ 上向用户显示消息。在 `MainActivity.java` 文件中，对类进行以下更改：\n\n```java\nimport android.content.Intent;\n\
