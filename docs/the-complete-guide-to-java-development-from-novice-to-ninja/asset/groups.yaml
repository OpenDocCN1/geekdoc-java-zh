    \ 关键字来保证更改的可见性。\n\n使用 `volatile` 的修改后的示例：\n\n```java\npublic class Singleton {\n\
    \    private static volatile Singleton instance;\n\n    private Singleton() {}\n\
    \n    public static Singleton getInstance() {\n        if (instance == null) {\n\
