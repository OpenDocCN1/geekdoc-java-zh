    ## 6.5. Important Spring Boot Annotations


    Core Annotations:


    - @SpringBootApplication:

    - Marks the main class of a Spring Boot application.

    - Combines @Configuration, @EnableAutoConfiguration, and @ComponentScan.


    - @Controller:

    - Marks a class as a Spring MVC controller.

    - Handles HTTP requests and returns views or data.


    - @RestController:

    - Specialized version of @Controller for RESTful web services.

    - Combines @Controller and @ResponseBody.


    - @RequestMapping:

    - Maps HTTP requests to handler methods.

    - Defines the URL path and HTTP methods for request mapping.


    - @GetMapping, @PostMapping, @PutMapping, @DeleteMapping:

    - Specialized annotations for HTTP GET, POST, PUT, and DELETE requests.

    - Shortcuts for @RequestMapping with specific HTTP methods.


    Dependency Injection Annotations:


    - @Autowired:

    - Injects dependencies into a Spring bean.

    - Used on fields, constructors, or methods.


    - @Qualifier:

    - Specifies which bean to inject when multiple beans of the same type exist.

    - Used in conjunction with @Autowired.


    Component Annotations:


    - @Service:

    - Marks a class as a service component in the business layer.


    - @Repository:

    - Indicates that a class is a repository, typically for database operations.


    - @Component:

    - Marks a class as a generic Spring component.


    Configuration Annotations:


    - @Configuration:

    - Designates a class as a configuration class.

    - Defines beans and configurations.


    - @EnableAutoConfiguration:

    - Enables Spring Boot''s automatic configuration feature.


    - @PropertySource:

    - Specifies the source of external property files.


    - @Value:

    - Injects values from properties files or other sources into fields.


    Conditional Annotations:


    - @Profile:

    - Specifies the profile(s) under which a component or configuration should be
    active.


    - @ConditionalOnProperty:

    - Conditionally activates a component based on the presence or value of a configuration
    property.


    - @ConditionalOnClass, @ConditionalOnBean:

    - Conditionally activates a component based on the availability of a class or
    a bean.


    ## Security Annotations:


    - @EnableWebSecurity:

    - Enables Spring Security for web applications.


    - @EnableGlobalMethodSecurity:

    - Enables method-level security.


    - @EnableTransactionManagement:

    - Enables Spring''s annotation-driven transaction management.


    ## Other Annotations:


    - @EnableCaching:

    - Enables Spring''s annotation-driven caching.


    - @Scheduled:

    - Schedules a method to be invoked periodically.


    - @Async:

    - Marks a method as asynchronous, allowing it to be executed in a separate thread.


    - @Aspect: Marks a class as an aspect, allowing the implementation of cross-cutting
    concerns.


    - @Transactional: Defines the transactional behavior of methods within a class.


    ## 6.6 Spring Boot Layers and Architecture:


    ## Spring Boot Layers:


    ### 1. Presentation Layer:

    - Handles user interaction and presentation.

    - Includes controllers, views, and static resources.

    - Responsible for processing user input and producing appropriate responses.


    ### 2. Service Layer:

    - Contains business logic and application-specific functionality.

    - Handles application workflow and business rules.


    ### 3. Data Access Layer:

    - Manages data access and persistence.

    - Utilizes repositories and DAOs to interact with the database.


    ### 4. ORM Framework (Hibernate):

    - Manages the mapping between objects and database tables.

    - Integrates with Spring Boot.

    - Simplifies database interactions by abstracting away SQL.

    - Facilitates the use of object-oriented principles.


    ### 5. Integration Layer:

    - Manages communication with external systems and services.

    - Includes components for messaging and other external interactions.

    - Ensures seamless integration with dependencies.


    ### 6. Configuration and Infrastructure Layer:

    - Manages application configuration.

    - Includes Spring Boot configurations, properties, and profiles.

    - Deals with infrastructure such as security, logging, and monitoring.


    ## Spring Boot Architecture:


    - Spring Boot Core:

    - Central module providing core functionalities.

    - Includes components for configuration, initialization, and the application context.


    - Auto-Configuration:

    - Automatically configures components based on dependencies.

    - Simplifies development by providing sensible defaults.


    - Starter Dependencies:

    - Bundles commonly used dependencies into starter packages.

    - Offers starters for web applications, data access, testing, and more.


    - Spring Boot Run:

    - Simplifies application deployment with embedded servers.

    - Allows applications to be run as standalone JAR files.


    - Spring Boot Actuator:

    - Provides production-ready features for monitoring and managing applications.

    - Includes endpoints for health checks, metrics, and environment information.

