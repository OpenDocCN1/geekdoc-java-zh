    \ Degradation)：\n\n设计系统在出现异常时能够优雅地降级是一种最佳实践。这包括向用户提供有关问题的意义反馈，并避免可能对用户体验产生负面影响的灾难性失败。\n\
    \n### 避免空 catch块：\n\n应避免空的 catch块，因为它们会使调试变得困难。如果发生异常，请恰当地记录或处理它。空的 catch块会隐藏问题，并导致难以识别问题的根源。\n\
    \n### d. 遇到的异常及修复方法：\n\n示例：处理文件未找到异常 (FileNotFoundException)\n\n```java\ntry {\n\
