    is used for storing local variables and maintaining information about method calls.


    +   - Stack memory is thread-specific, short-lived, and organized into frames,
    with each frame representing a method invocation.


    # Method Area (PermGen/Metaspace):'
  - '[PAGE 89]


    The method area stores class-level information such as class metadata, static
    variables, and the constant pool.


    In Java 8 and later versions, PermGen has been replaced by Metaspace to address
    limitations and provide more flexibility.


    c. Heap and Stack Memory:


    # Heap Memory:


    # Young Generation:


    +   - In the Young Generation, objects undergo a process called minor garbage
    collection, where unreachable objects are identified and collected.


    +   - Objects that survive this process are promoted to the Old Generation.


    # Old Generation:'
  - '[PAGE 90]


    +   Long-lived objects, which have survived multiple garbage collection cycles,
    reside in the Old Generation.


    +   Garbage collection in the Old Generation, known as a major garbage collection
    or Full GC, is less frequent but more extensive.


    # Stack Memory:


    +   Each thread maintains its own stack, and stack memory is used for storing
    local variables and tracking method calls.


    +   Stack memory is organized into frames, with each frame representing a method
    invocation. These frames are created and destroyed as methods are called and return.'
  - '[PAGE 91]


    # d. Garbage Collection and Memory Optimization:


    # Garbage Collection:


    # Young Generation Collection:


    Garbage collection in the Young Generation involves identifying and collecting
    objects that are no longer reachable, ensuring efficient use of memory resources.


    # Old Generation Collection:


    Garbage collection in the Old Generation occurs less frequently but is essential
    for reclaiming memory occupied by long-lived objects. It involves identifying
    and collecting objects that are no longer in use.


    # Memory Optimization:


    # Tuning Heap Sizes:'
  - '[PAGE 92]


    Adjusting the heap sizes based on application requirements and characteristics
    can significantly impact memory usage and application performance. Proper tuning
    can prevent issues such as frequent garbage collection and out-of-memory errors.


    # Object Pooling:


    Object pooling is a technique where a pool of reusable objects is maintained.
    Reusing objects from the pool can reduce the frequency of object creation and
    subsequent garbage collection.


    # Weak References:


    Utilizing weak references allows objects to be garbage-collected when they are
    no longer strongly referenced. This provides flexibility in memory management,
    particularly in scenarios where certain objects may become obsolete.


    # Optimizing Data Structures:'
  - '[PAGE 93]


