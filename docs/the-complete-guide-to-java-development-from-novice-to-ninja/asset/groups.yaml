    \ 4.3. SOLID 设计原则\n\nSOLID 原则概述：\n\nSOLID 是一个缩写，代表了一组五种设计原则，遵循这些原则可以编写出更具维护性、灵活性和可扩展性的软件。这些原则由\
    \ Robert C. Martin 引入，被认为是面向对象设计的基础。SOLID 原则包括：\n\n- 1. 单一职责原则 (SRP)：\n\n一个类应该只有一个改变的原因，这意味着它应该只有一个职责。这一原则提了类应该封装单一功能的思想，使代码更容易于理解、维护和扩展。\n\
    \n- 2. 开闭闭原则 (OCP)：\n\n软件实体（类、模块、函数等）应该对扩展开放，对修改关闭。这一原则鼓励开发者设计可以在不修改现有代码的情况下通过新功能轻松进行扩展的模块，从而促进代码的稳定性。\n\
    \n- 3. 里氏夫替换原则 (LSP)：\n\n子类型必须能够替换其基类类型而不改变程序的正确性。简单来说，父类对象应该可以被子类对象所替换，而不会影响程序的功能。\n\
    \n- 4. 接口隔离原则 (ISP)：\n\n一个类不应该被强制实现它未使用的接口。\n\n- 5. 依赖倒置原则 (DIP)：\n\n高层模块不应该依赖低层模块，两者都应该依赖于抽象。抽象不应该依赖于细节，细节应该依赖于抽象。\n\
    \n"
