    # 8.2.4.4. Conjunct hyperbaton


    As the preceding paragraphs have shown, Wackernagel clitics can be part of bona
    fide hyperbata. This observation becomes salient when we examine conjunct hyperbaton,
    which is defined as the intrusion of a (usually higher-order) conjunct between
    two items connected by et, aut, or an equivalent conjunction.229 In the case of
    VM 1.2 fugientem et clausum the intrusive me (to which fugientem... in position,
    as predicative equivalent to a subordinate clause) is a clitic, which means that
    its intrusion can be justified by reference to Wackernagel phenomena.230 Here
    the pattern does not appear to produce a “canonical” type of clausula. It is noteworthy
    that there seems to be no essential difference between this pattern and at 7.2
    si quam sub fasce uidissent et onere concidise (with cursus velox; fasce uidissent
    additionally produces an internal rhythm of cursus planus and cretic-trochee).
    In this passage the splitting element uidissent cannot be classed as a clitic,
    and the syntactic structure is more complex: sub fasce...et onere complements
    concidise, which in turn complements uidissent. Yet in both cases the primary
    effect of the insertion is to stress both of the conjoined words, namely both
    fugientem and clausum at 1.2 and both and onere at 7.2. This effect is therefore
    independent of Wackernagel phenomena. An more complex version of conjunct hyperbaton
    is 1.2 exerceri cupio in paruo opere et uleti quandam rubiginem linguae abstergere:
