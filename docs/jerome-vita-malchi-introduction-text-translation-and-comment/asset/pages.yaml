    # 7.3.3. Virgilian epic


    The Greek novel is in dialogue not only with history but also with epic, another
    ‘serious’ genre of high literary status.$^{115}$ In addition to the fundamental
    structural relationships with epic narrative which the VM probably inherited from
    novelistic forms of literature, it also alludes prominently to central themes
    of Virgil. *Aen. Geo.* 4, has long been recognized: the ‘marriage’ in the cave
    at VM 6 relates to the problematic wedding of Dido and Aeneas at *Aen.* 1.465–72,$^{116}$
    while Malchus’ observation of ants’ nest at VM 7 echoes in close detail the simile
    at *Aen.* 4.402–7, as well as some aspect of the bees in *Aen.* 1.430–6 and Geo.
    218.$^{117}$


    Harald Hagahl notes three verbal echoes of Virgil in the VM: 7.2 aspio formicarium
    gremem angusto caule feruere... illae uentae hemiemos (~ Aen. 4.402ff), 8.1 inter
    et metum dubii (~ Aen. 1.218 spemque metum dubii), and 9.1 meis praei saga (~
    Aen. 10.843 praasa mali mens).$^{118}$ All of these phrases are also imitated
    by other authors whose writings Jerome have drawn to addition. The VM has a number
