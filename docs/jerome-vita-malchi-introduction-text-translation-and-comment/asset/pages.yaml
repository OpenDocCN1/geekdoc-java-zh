    The use of the high-style archaic *fidus* is striking as a variation on the mundane
    *fidelis* that precedes in the same sentence. Adams (1973: 125 with n. 22) discusses
    the different stylistic registers of the two words: *fidus* is by far the more
    frequent word in epic and it is a common alternative to *fidelis* in archaic authors
    as Sallust, Curtius, Apuleius, and Livy. Tacitus uses *fidus* almost exclusively
    (forty-six times); the only instance of *fidelis* in the *Annals* is in direct
    speech (*Ann.* 15.62). By contrast, Terence only *fidelis*, which is also preferred
    in less elevated poetic genres, as the elegiacs of Ovid, Catilius, Propertius,
    and Persius''* *Satires*. The Vulgate has *fidelis*, and the Vulgate Jerome prefers
    *fidelis* by a ratio of 265:12 according to the LLT–corpus includes all instances
    of the adverb *fideliter*. It may be argued that this means the count gives a
    more pictured picture, unlike *fidus*, does not form an adverb. However, *fidus*
    can also be used predicatively to replace an adverb. One of the eleven instances
    of *fidus* is below 6.9 *fidus gregis pastor*.


    A textual variant which occurs in two of the manuscripts in E. M. Morales'' 1991
    apparatus is *et fidelem for quod dictum* (it is not clear whether these manuscripts
    also have *facere* instead of *faceter*). In addition to the superiority of the
    manuscripts which read *fidus*, the Sallustian parallel and the perhaps more elegant
    *uariato* seem to be sufficiently strong grounds for defending *fidus*.


