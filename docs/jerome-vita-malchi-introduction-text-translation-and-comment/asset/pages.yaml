    the order omnia omnium is more frequent in classical Latin; the reverse order
    omnia omnium is predominantly late.


    # CH. 8: MALCHUS FLEES WITH THE WOMAN


    Malchus cannot hide his longing for the monastic community with his companion
    (§1). He shares his thoughts and urges her to escape with him. She agrees and
    promises to keep the plan secret. Both the details and weigh up the chances of
    success in continued excited whispers. In preparation for the journey Malchus
    slaughters particularly large goats; he turns the skins into waterproof bags and
    the meat into provisions. They depart at sunset, taking advantage of their masters''
    belief that they are sleeping together (§2). On reaching the river they use the
    inflated skin bags to cross the water, so that their pursuers should lose their
    tracks (§3). After the successful crossing the couple'' provisions and water supply
    are about to run out (§4). They continue their journey in haste, fearing to be
    caught by the Saracens. Because of this fear, the days are so hot, they prefer
    to move by night. The night night affects Malchus as he tells the story (§5).


    The entire chapter is written in the historic present. As Pinkster (1990: 224–5)
    observes, this is the normal tense for narrative sections, whose temporal relationship
    to the frame needs to be marked only at the beginning and the end of the passage.


