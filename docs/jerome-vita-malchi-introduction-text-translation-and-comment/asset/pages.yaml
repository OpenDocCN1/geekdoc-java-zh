  md: '# Introduction


    # 8.3. Concluding remarks


    The language of the VM proves to be a multilayer blend of linguistic elements
    from different periods, models, and registers. The complexity of this system seems
    to count against the view that Jerome is trying in the VM to appeal to a lower
    sociolect. The work is more likely to be written for an elite audience well-versed
    in classical literature and style, but also with Christian sensibilities which
    would make them appreciate its firm yet flexible grounding in the genus humile.


    # 9. STATE OF TRANSMISSION AND SCOPE OF THE TEXTUAL WORK OF THE COMMENTARY


    Although the textual tradition of the VM formed out of three scholarly projects
    in the twentieth century, the text is not necessarily established. As part of
    a research project led by William Abbot Oldfather, Harriet Clara Jameson and other
    collaborators contributed an analysis of a large number of manuscripts of the
    VM, which results in a complex stemma of manuscript families.236 Of the twelve
    groups, which are identified on the most of shared variants,237 A and I are considered
