  md: '# Introduction


    Bethlehem, one male and one female, headed by Jerome and Paula respectively.4
    This was their home for the rest of their lives.


    The early years of his life at Bethlehem, 386–93, represent a fresh start for
    Jerome’s activities as a writer and scholar, with many new and daring projects,
    among them the first translations into Latin of the Old Testament from the Hebrew
    and the Greek Septuagint.5 Although the Vita Malchi (VM) probably belongs to the
    later part of this period (391–3),6 its opening chapter presents it as a first
    after a long silence.7 In some sense the Vita is framed as the preface to a period
    of great scholarly and literary productivity. Its advertised status as an exercise
    (prius exerceri cupio, VM 1.2) suits the general context of Jerome’s forays into
    new genres at the time of its composition.


    The closest literary kin of the VM is Jerome’s two Vitae Sanctorum, the earlier
    Vita Pauli (VP, dated to the early 370s) and the contemporary Vita Hilarionis
    (VH). Despite their overlaps in form and purpose, the narrative structure of the
    three works diverges in important ways. For example, the VP details the beginning
    and end of the ascetic life of its eponymous hero, and the second part is told
    from the perspective of Antony, who visited Paul to prove the latter’s superiority
    over the acclaimed ‘father of monasticism’ celebrated in the Vita Antonii ascribed
    to Athanasius.8 The VH, in turn, is much longer and more artificial and episodic
    in structure than the tight, dramatic action of the VM. Furthermore, both VP and
    VH are told in the third person by an omniscient narrator, whereas the bulk of
    the VM is related in the first person by Malchus himself, with the author Jerome
    presented as a sympathetic listener. Further points of difference are found in
    the events encountered in the VP and VH absent from the world of the VM, where
    providence manifests itself in ways which can also be explained in naturalistic
    terms, and in the use of references to classical authors, proudly paraded in the
    VP and VH but hidden in the VM.


    +   4 Jer. Ep. 108.20.

    5 Hale Williams (2006: 64–6, 281–3).

    6 See below, p. 5.

    7 It is unclear what this claim needs to be qualified: is it the first work of
    history, for example, of pro-ascetic polem, or the first piece of writing in general
    of Jerome’s Bethlehem period? See the Commentary, 1.2–3.

    8 For the Vita Antonii and Athanasius see below pp. 15–17.'
