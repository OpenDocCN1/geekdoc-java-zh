    hucine: words of this kind are formed by a demonstrative pronoun (most frequently,
    but not exclusively, forms of hic, haec, hoc), an adverbial form of this pronoun
    (hic, hinc, huc, illinc, etc.) or an adverbial particle (sic, nunc, tunc, etc.),
    to which a deictic suffix -ce is attached, followed by the interrogative clitic
    -ne. The suffix -ce is archaic, and -cine forms are exceptional in preserving
    this suffix into the classical period, especially in poetry, while forms -ce (i.e
    hicne etc.) became more widespread with Cicero onwards (Kiisel 1990: 388–9, 721).


    Kiisel (1990: 389) associates -cine forms with emotionally coloured language (‘emotional
    gefärbte… Umgangssprache’). This appears to be true for the archaic period, where
    forms in -cin(e) abound in Plautus (fifty-five) and Terence (forty-four). There
    is a conjectured sic in Liv. Andr. com. 2 (Ribbeck p. 1); hicine found at Naev.
    com. 81 (Ribbeck p. 20) and Pacuv. fr. 103 Schieriel, and hocestius in Accius
    trag. 96 (Ribbeck p. 148). In classical Latin -cine forms are absent from the
    corpora of Caesar, Lucretius, Virgil, and Tacitus. There are fifteen instances
    in Cicero: with the exception of the relatively usual at Or. 27 (negat in eo positas
    esse fortunes Graeciae, hocine al lle uerbo usit sit) all of these occur in highly
    stylized structures, most often or with tricola, atocclimatic points of the discourse
    (or ironically emotional ones: Tusc. 3.8, and we find eleven -cine forms (ten
    of them in books 6–10), all in speeches and usually in highly rhetorical questions.
    Four times they come in the first sentence of a speech, often as the very first
    word, for example Liv. 4.19.3 ‘hicine est’, inquest, ‘ruptor foederis humani ulterior...
    Kiisel’s characterization of the formation as ‘colloquial’, then does not hold
    for Cicero or Livy: the forms seem to be artificial reminiscences of the earlier
    habit. Late archaisers revive the formation: Apuleius has thirteen, Tertullian
