    I am boarding a vessel as an inexperienced sailor; and although I am a man who
    has not steered a rowing boat on the lake, I trust myself to the roar of the Black
    Sea. Now, while the land is disappearing from my view, there is ''sky all around,
    and all around the deep'', now the wave roughens in the dark and in a night with
    clouds the frothy billows grow white. You encourage me to hoist the swelling sails
    on the mast, until the stays, to charge of the rudder. Now obey my commands and,
    since love is capable of anything, with the Holy Spirit favouring my voyage, I
    shall be confident, I shall have comfort in either: if the current drives me to
    the desired heaven, I shall be thought a helmsman; or if my unpolished speech
    rounds around the rough twists of language, who may perhaps find fault with my
    abilities, but you will not be able to blame me by lack of good will.


    The ostensible function of Ep. 1.2 is self-deprecation and the magnification of
    the difficulty of the enterprise; yet at the same time the rhetorical skill and
