  md: '# 308 Vita Malchi


    siluas, inter deserta ferarum (cf. Aen. 3.646 in siluis inter deserta ferarum).


    pudicitiam numquam esse captiuam: on the problem of equating captua and capta
    see note on 6.2 illumam conservuam aliquando captiam. The idea of chastity being
    captive is picturesque: compare instances of pudicitia personified are Sen. Dial.
    4.13.2 uacat pudicitia, libido occupatissima est; Aug. Civ. 8.18 scaenicas turpitudines,
    dum non amat pudicitia; Novatian Pudic. 3.1 pudicitia semper uerecunda, dum innocientiae
    mater est; cf. TLL X.ii.2487.59–65, for iussa pudicitia 6.7.1–2 Iulia lex ...
    renata est / atque intra domos iussa pudicitia est. Here the meaning of the statement
    is ambiguous: either it emphasizes personal responsibility for one’s chastity
    (cavity is no excuse), or it refers to the providence of God who has saved Malchus
    from compromising his chastity without having to die for it.


    hominem Christi deditum posse mori, non posse superari: the closing phrase is
    antithetical in structure. The generalizing tone exal the narrative into an exemplum
    of Christian heroism. Given Malchus’ failures at the earlier stages of his story,
    this categorical statement is exaggerated: it might have been more appropriate
    to sum up the narrative as illustrating God’s grace in rescuing even sinners from
    both temptation and death.'
