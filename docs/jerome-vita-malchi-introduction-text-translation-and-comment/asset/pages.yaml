  md: '# Commentary


    # THE TITLE


    The incipits and explicits quoted in the description of my five chosen manuscripts
    in Oldfather (1943; see Introduction pp. 71–3) give the following titles: Neap.:
    *incipit/explicit de monacho captiu*; Mon.: *incipit Sancti malchi [sic] captiu[us>l]*;
    explicit uita uel captiuas beati malchi*; Paris.: *incipt actus monachi captiu*;
    Laur.: *incipit uita monachi captiu*; explicit uita captiu monachi*; Sess.: *incipit
    uita cuiusam monachi captiu.*


    Jerome himself does not seem to have called his piece a *Vita*: in the edition
    of the *Vir.* ill. by Ceresa-Gastaldo (1988), the title is given in Jerome’s list
    of his own works in ch. 135 as follows: *haec scribsi: uitam Pauli monachi, .
    . . de captio monacho, uitam beati Hilarionis*. Other versions recorded in the
    apparatus are *captium monachum (Malchum); captium monachum; monachi, uitam Malci
    captiuitam Malci, captiu monachi,* and *βί αἰμαλώτου μοναχο*. The phrase *monachus
    beenius* is by far the best represented element in this varied tradition, while
    terms like *uita* are less consistently found. It seems that the title *Vita Malchi*
    became attached to the text relatively late, probably to bring out the similarities
    between it and the VP and VH, of which are called *Vitae* in Jerome’s catalogue
    (cf. above).


