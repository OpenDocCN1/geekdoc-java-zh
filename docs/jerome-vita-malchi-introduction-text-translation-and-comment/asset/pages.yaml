    # 7.3.2. Historiography


    In its superficial form the genre of the ancient novel is most closely related
    to historiography.¹102 The VM likewise gestures at historical respectability:
    in the first chapter it claims to be a paedeutic for a ''larger history'' of the
    Church (historia maior, 1.2; cf. above); in the last sentence (ch. 11) the narrative
    is summarized as a historia castitatis. While its short length and its structure
    make the VM very different from historical works, there are some phrase borrowings
    from Sallust, Livy, and Tacitus, as well as a number of details and phrases shared
    with Amianus. These points of contact should not be taken to imply that the VM
    is itself a form of historiography: it is far too subjective for that. The ethnographic
    material which Jerome shares with Amianus, for example, is presented by the latter
    in an excursion, typical of the genre of history, but in the VM it is inserted
    descriptively into the main narrative itself.


    Sallust is one of the two main prose authors whose work was studied at school
    in the fourth century (cf. Jer. C. Ruf. 1.16 line 27, quoted above), and Jerome
    had a high regard for him: Sallust is known as nobis historicus in Ec. 5.9-10
    (CCLS 72 p. 295 line 129).¹⁰³ and he is frequently cited throughout Jerome''s
