  md: '# Preface


    When I began work on Jerome''s Life of Malchus I did not expect this short and
    lively tale to remain the focus of my studies for very long. Presented by its
    author as a mere exercise in storytelling, this text would serve, for a student
    trained primarily in classical literature, as a manageable introduction into the
    complex world of Late Antiquity. I underestimated the challenge. As I considered
    the structure, characterization, setting, language, and underlying concepts of
    this Life, it began to look increasingly unique, and so it became became more
    difficult to explain its relationships with other works of literature, never mind
    with historical reality. Here were a monk, ostensibly an example to younger ascetics,
    who at least initially appears unaware of the common monastic requirements to
    renounce one''s possessions and to obey one''s superior. His one defining characteristic
    as a monk is a strong aversion to marriage. Yet, as he is captured and enslaved
    by a nomadic Saracen, he accommodates himself—under duress, admittedly to cohabitation
    with a woman and is seen to continue in this arrangement when the external pressure
    is removed: that is to say, after his Saracen captor, a figure of extravagantly
    painted barbarity, is killed during the couple''s hair-raising escape from an
    exotic, yet realistically depicted, on the fringes of the Roman Empire. Thus the
    Life of Malchus features a surprisingly flawed protagonist attracted to the idea
    of owning property and worried about his susceptibility to sexual temptation.
    The story is plotted from crisis to crisis like an adventure novel; yet a narrative
    inconsistency in the very end appears to refuse the complete resolution of a conventional
    ending. The Latin idiom, in the mouth of a native speaker of Aramaic, looks back
    to archaic Roman drama as much as it anticipates some of the developments which
    became typical of Romance languages, and a host of verbal reminiscences of classical
    ‘pagan’ writings are unobrusively integrated into a determined Christian fabric.
    In this way the Life provides a vivid and detailed miniature of some late antique
    cultures and their occupations. Transmitted as one among many ‘Lives’ of holy
    men and women in just under 350 medieval Latin manuscripts, as well as translations
    into Greek and Syriac, this portrait clearly enjoyed'
