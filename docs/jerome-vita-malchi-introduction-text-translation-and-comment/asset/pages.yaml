    Even if Malchus and his narrative are partly or wholly invented by Jerome, his
    story relates in many details to verifiable historical circumstances and customs.
    For an informed reading of the VM it is therefore appropriate to ask in what ways
    it corresponds to, embellishes, or contradicts other available evidence. The central
    themes here, which stretch over most of the text, are the conditions (topographical,
    climatic, and geopolitical) of the Syrian desert, the appearance and habits of
