    Jameson (1938: 418–19) notes that it is not in Neap. and seems to be omitted in
    the Greek translation. In printing it I follow the majority of my chosen manuscripts.
    If it is left out, the moral urgency of the passage would seem more muted.


    Latin as a whole moved in the direction of replacing *fut* complementing verbs
    with a final infinitive, a long process of Jerome’s use reflects a late stage:
    cf. VM 1.2 silere quippe me facit. The simplex *hortor* was commonly used with
    *fut* in all periods of antiquity from Plautus, supplemented by the bare subjunctive
    (i.e. without *ut*) from Turpilius (d. 104 bc) and by the infinitive construction
    from *Rhet*. Her onwards (Hofmann and Szantyr 1965: 530 and 346; for the infinitive
    we see *TLL* VI.iii301.43ff.). Cicero uses the infinitive construction with hortor
    and verbs of similar meaning primarily in his early speeches, but also at Of.
    3.55: *num te er coegit, qui ne hortatus quidem?* Constructions with exhort exhibit
    a different pattern: it appears to have been originally used with the infinitive,
    first attested at Colum. Rust. 11.1.1 *plurimi septimos exhortant *ut* aliquias
    partes earum addiscere* (TLL V.ii1446.55ff.); then at Petron. 76.10, Stat. Sil.
    3 *praef.* line 22 Teubner, Aug. Adv. Don. 20.31 (CSEL 53 p. 131 line 21). *exhortor
    with fut* is a non-classical extension of the final construction, attested only
    from *Ep.* 82.20 onwards Hofmann and Szantyr (1965: 647).


    *uos narrate...superari*: this concluding exhortation seems to be modelled on
    the final chapter of the VA, where the narrator asks readers to ensure that others
    will read the *Vita* to be inspired and'
