  md: '# Commentary 8.3 271


    The detail of steering with one’s feet in Sallust, Florus (pedibus iter adgubernans),
    and Frontinus (ut crubirus uelit gubernaculus missimis dirigeret) is paralleled
    in the VM: paulatim pedibus subremigantes. Jerome’s younger contemporary Orosius
    (Hist. adv. pag. 2.6.2.14, written between 416 and 418) describes the same scene
    as Sallust, Florus, and Frontinus, using the same particle submergedans as Jerome.
    Given that Orosius knew and used other works by Jerome, for example the additions
    to Eusebius'' Chronicon (cf. Grant 1999: 109), he may have been influenced by
    the VM. See also Zwierlein (1970: 179–80, n. 65) for the relationship of these
    passages.


    Although these literary references suggest that the use of animal skins was widespread
    in the northern, eastern, and western parts of the Roman Empire and its periphery,
    it is not altogether clear the exotic writers found this method for crossing water.
    Especially in the case of Frontinus and Florus, with their comparison of the floater
    to a sea animal, there is a strong implication that this is unusual, and in Frontinus
    the exclamation horrible dictu confirms this. Jerome’s imitation of the striking
    aspects of these depictions suggests interest in paradoxography.


    cumque: cf. note on sicque, 7.2.


    peruennissem ad fluuvium—nam decem milibus erat: in a realistic mapping of events
    this river is identified with the Mygodinius, an eastern tributary to the Chobaras
    which runs past Nisibis and forms the eastern border of the Roman province of
    Mesopotamia (Tardieu 1990: 80; cf. AASS Oct. 9, 63A). This would make it different
    from the amnis on the way to the Saracen homestead, which is most plainly taken
    to be the Euphrates: see note on 5.1 grandi amnis trasm, and cf. especially Opelt
    (1979: 151). On the other hand, the use of nam seems to present the fluvius as
    already familiar to the reader (for this reason I use the definite article in
    my translation, ‘the river’, not ‘a river’). But this is only possible if it is
    thought to be the same as the amnis of 5.1. This objective contradiction need
    not be problematic from Malchus'' perspective: as a fugitive in the desert, with
    little orientation, it would be natural to assume that the present river is identical
    to that which he had crossed in the other direction.


    aquis nos credimus: cf. 9.2 sinistrae nos fueae credimus and 10.3 non taen mi
