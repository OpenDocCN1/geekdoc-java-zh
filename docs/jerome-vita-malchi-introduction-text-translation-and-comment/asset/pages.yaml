    The wording of Malchus'' parenthesis is different from that of the passages quoted,
    but its phraseology recurs in Jerome''s Commentary on Ephesians (see note on fideliter
    seruendium, below). Not all of these passages are of genuine Pauline authorship,
    but they seem to go back to a shared principle of Pauline ethics. The precepts
    do not aim at a social revolution, as one might expect from an argumentative context
    that stresses the equal dignity of all persons before Christ. Instead they deal
    with the ethics of individual relationships within the established social order,
    including masters and slaves. They are valid even for Christian slaves of non-Christian
    masters and vice versa, Malchus realizes. It is only when the master''s commands
    go against Malchus'' monastic values by threatening his chastity that the duty
    of obeying him becomes secondary to other motives.


    sciebam: the word choice may suggest a connection between knowledge and ethics
    in the Socratic tradition: Malchus'' knowledge of the precept leads to virtuous
    conduct.


    Apostolum praeposse dominis quasi Deo fideliter seruendium: praecipio with a gerundive
    in an accusative and infinitive construction; esse is elided. Constructions of
    indirect statement with the gerundive to express obligation encroach on the classical
    construction of praecipio with an indirect command clause introduced by ut. Hofmann
    and Szentár (1965: 372) this use of praecipio is characteristic of later Latin,
    but the TLL X.ii.449.22 ff. gives examples from the first century AD, for example
    Sen. 7.6.20, Sen. Benef. 2.9.1 praecipiunt ... quaedam beneficia panda, quaedam
    secreto, with several instances in Columella, Pliny the Elder and Younger. Avoiding
    an ut clause here has the advantage of making the sentenceless.


    sic is one of the correlatives frequently used with quasi (Hofmann and Szentár
    1965: 674), for example Plaut. Amph. 683 sic salutas appelles, quasi quidem non
    uideris. This correl use is not confined to early Latin and archaic authors is
    extremely frequent in Cicero. In classical Latin there is usually a separating
    element between sic and quasi in the form of a predication which is to be compared
    with a (different) predication in the quasi clause, for example sic est hoc quasi
    propositus atque editus in altum (Cic. Gerr. 2.3.98). The combination of sic and
    quasi without a separating constituent is found in early Latin: Naevius trag.
    fr. 42 Ribbeck p. 12'
