    +   1. Jerome''s use elsewhere: Jerome is notorious for quoting himself,$261$
    which means that earlier or later works provide evidence for specific phraseological
    choices (e.g. the use of the double gerundive *pugnandum ... praedauntum* at 4.2).


    +   2. The Greek translation,$262$ whose useless for supporting textual decisions
    is defended by Jameson,$263$ The date of this translation is unknown, but it probably
    belongs to the period between the early fifth and mid-seventh century. It means
    it is roughly the same age as the oldest Latin manuscript of the VM, if not older.
    Although the Greek translation of the VM is very free (it omits the prologue and
