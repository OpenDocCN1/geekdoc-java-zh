  md: '# Commentary 3.6 159


    There are many variations for describing this supplicatory position, and the patterns
    of preference in individual authors are complex. Firstly, there is the choice
    between referring to knees or feet; secondly, by aduolor and proouloir the simplex
    uuolo is used, or its frequentative, e.g. Virg. Aen. 3.607 genibusque uolutans,
    and there are different ways of syntactic construction. Livy uses proouloir with
    prepositional ad for both knees and feet and aduolor with the dative only of knees.
    Tacitus refers to knees and uses proouloir with the dative (Ann. 11.30.1, 12.18.2,
    and 14.61.2), as which Jerome is perhaps imitating here; moreover, Tacitus follows
    Sall. Hist. fr. cert. 16 Maurenbrecher in using a direct accusative object with
    aduolor (Tac. Ann. 1.13.6, 6.49.2, 15.71.1, 4.81.1). This direct object construction
    is the only version of the phrase which not found in Jerome; other than that,
    he covers all possibilities, using both the dative and the preposition for both
    feet and knees with proouloir and aduolor.


