    There are two possible motivations for the use of hyperbaton: one is in order
    to focus a word or phrase.207 I cannot give a thoroughgoing exposition of topic-focus
    pragmatics in Latin, a subject which is discussed with varying terminology by
    scholars where.208 But as a motivation for discontinuity the notion of focus is
    helpful: the interruption of the intervening constituent places stress on the
    first element, or even on both elements of the phrase which is split, thus making
    it more prominent in the reader''s or hearer''s mind.


    The other reason for using a hyperbaton is to facilitate rhythm, that is, to produce
    a sentence- or clause-ending (clausula) which creates a certain pattern based
    on syllable length (quantitative rhythm) or on the word accent (accentual rhythm,
    also known as cursus). Both types are affected by a change in word order.209 But
    a definitive analysis of a text''s rhythmical properties depends on identifying
    a limited group of patterns as desirable, a decision which risks either too narrow
    or too general: there is no definitive set of ''acceptable'' clausae. For the
    sake of convenience I have adopted Michael Winterbott''s typology to order the
    rhythmical properties of the VM.210


