    # §2. Preparation and start of the escape


    erant mihi in grege: the imperfect is used for a state which forms part of the
    background for the actions subsequently expressed in the historic present. While
    the possessive dative (erant mihi ''I had'') is vague and general to indicate
    whether or not Malchus regards the goats as his own property, the fact that they
    were mihi in grege (''in flock'') makes it much more likely that they belong to
    the master’s flock, with whose Malchus is entrusted.


    mirae magnitudinis: forms of mirus, mirari, etc. with magnitudo found in Livy
    (e.g. 21.22.8 tumidosse post serez septem mira magnitude) and Pliny the Elder
    (e.g. NH 1.8.14 mirae magnitudines serpentium, 9.10). The ablative of quality,
    which is the norm in classical Latin, is replaced by the genitive in later periods:
    Hofmann and Szantyr (1965: 68, 108), mira magnudo is often used in connection
    with the (at least potentially) supernatural. The same phrase is found three times
    in the relatively short Pass. Perp. (4.3, 4.4, 10.8, Musurillo 172: 110, 118),
    always within Perpetua’s visions. At Jer. VH 28.3 draco mirae magnitudinis is
    killed by Hilurion. For miros cf. 2 mira nesque neque respondant with note and
    my Introduction, pp. 47–8.


    utres face: the significance of the skin bags is discussed before; Sall. Ug. 91.1
    el coriis utres uti expedient, curabat. Tardieu (1990: 85–6) quotes Place (1867–70:
    II.135–7) for the preparation and use of inflated skins observed in nineteenth-century
    Mesopotamia. The manufacture of watertight goat skins in twentieth-century Persia,
    Central Asia, and Northern India is described by Hornell (1946: 9):


    Before coming to the skin of a body, the head, and part of the tail are cut off;
    this enables an expert worker to detach the skin from the body by working backwards
    from the neck without having to make a slit along the abdomen. When freed, the
    skin is turned inside after all apertures, except the cut end of one leg, have
    been sewn up or tied and closed with cord or hide thongs. When required for use
    the skin is blown out through the one leg left open, which is closed with a lashing
    of cord.


