    # 8.2.4.3. Wackernagel clitics


    In some of the ''extended'' hyperbata identified, the first discontinuous item
    is a personal pronoun ou a form of esse which can be interpreted as a clitic.^224
    Jacob Wackernagel argues that there is a tendency for clitics to occupy the second
    position of a clause, a phenomenon which originally belonged to Proto-Indo-European.^225
    The Proto-Indo-European. The transition from clitic-using word in Latin to the
    Romance system of verb-attached pronouns has been comprehensively analysed by
    Dieter Wanner, who observes that the process was slow and gradual.^226 Roman Haida
    notes Wackernagel-related rules for the positioning and ordering of clitics in
    the Itin.^227 suggests that the Wackernagel clitic was not yet completely artificial
    in the late fourth century. In terms of pragmatics, the use of clitics in discontinuous
    contexts is a product of focusing (comparable to plain hyperation). Brigitte Bauer
    explains that focused elements tend to be clause-initial, which makes it necessary
    for the clitic to split into the second.^228 There are over forty of these secondpositions
