  md: '# Introduction


    In AD 386 the ascetic and older scholar Eusebius Hieronymus de Stridon, known
    in English as Jerome, settled in Bethlehem. He had just spent a year or so touring
    the ''Holy Places'', locations in Syria, Phoenicia, and Palestine where biblical
    events were believed to have taken place; he had also visited a member of monastic
    communities in Egypt. On this pilgrimage he was accompanied by Paula, a wealthy
    Roman widow from a noble family, and her daughter Julia Eustochium, to whom Jerome
    had two years previously addressed his famous treatise on the preservation of
    virginity, Ep. 22.¹ Jerome and Paula had left Rome separately in 385 among members
    of the Church and the aristocracy. One of the catalysts for Jerome''s departure
    was the death of Paula''s older daughter Blesilla, apparently in consequence of
    a strict ascetic regime under Jerome''s guidance.² Jerome and Paula were also
    suspected of inappropriate intimacy, and this suspicion appears to have formed
    the basis of a charge for which he faced an episcopal tribunal before his departure.³
    Their travels took over, he used Paula''s remaining funds to establish a double
    monastery at


    +   ¹ Jer. Ep. 108–14.

    ² Cf. Jer. Ep. 39, a consolation for Paula over Blesilla''s death.

    ³ Cain (2009: 114–24). By contrast, Brown (2012: 262–3) interprets Jerome''s removal
    from the pope, Siricius, as a matter of enforcing Jerome''s *stabilitas loci*
    a priori; ordained in Antioch, he could be ordered to return there instead of
    unsettling his Roman colleagues with his polemics. According to Brown, Jerome''s
    relationships with aristocratic women were a secondary concern emphasized more
    by Jerome than by himself. Brown''s new interpretation illustrates the fundamental
    point that for many events of Jerome''s life we rely on his words; but Jerome''s
    own accounts of his life are rarely unbiased and require a careful and well-informed
    reading for a sound interpretation of the events. It is one aim of this book to
    contribute to an understanding of Jerome''s rhetorical habits.'
