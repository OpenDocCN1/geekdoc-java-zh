  md: '# Introduction


    The present study is an attempt to examine the VM in terms of the information
    it provides about its historical and literary backgrounds. A word-by-word, phrase-by-phrase
    analysis forms the basis for wider arguments about the aims of the work, both
    as a promotion of the ascetic life and as a display of high literary skill. Neither
    of these is as straightforward as it might seem. Malchus turns out to be an unlikely
    hero for a holy man''s biography. His idiosyncratic character part-fits a number
    of more familiar stereotypes; and the storytelling correspondingly capricious,
    as we shall see. In consequence I sought to be attentive to the text above all,
    and to contextualize it as fully as possible in order to facilitate interpretations
    that go beyond my own conclusions.


    # 1. STRUCTURE AND PLOT


    The VM is a prose text of c.2,000 words, divided into eleven chapters of varying
    length. It begins with a prologue (ch. 1) in which Jerome presents the work as
    an exercise to prepare for the composition of a comprehensive and critical history
    of the Church. The second chapter explains how Jerome knows Malchus'' story: as
    a young man, living in Marathonias, east of Antioch, on the estate of Evagrius,
    an erudite, wealthy, and powerful priest, he heard it from the protagonist himself.
    At that time Malchus was already an old man, sharing a home with an old woman.
    Jerome''s curiosity about this arrangement prompted Malchus'' narrative, which
    is related in the first person in chapters 3-10.


    In ch. 3 Malchus, the son of a smallerholder near Nisibis on the eastern border
    of Roman Empire, is pressed by his parents to marry; he tells them that he would
    rather be a monk. As a result of this conflict Malchus runs away from home and
    joins a group of monks in the desert of Chalcis, not far from Antioch. When his
    father dies, he wants to return to claim his inheritance. His ab objects to this
    proposal, not least because Malchus intends to keep some of the money for himself.
    For an unresolved quarrel, Malchus departs.


    > 9 My chapter division follows that of Leclerc et al. (2007).'
