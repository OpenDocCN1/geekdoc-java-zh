    # §3. Crossing a river with the help of inflated goat skins used as floats


    Hornell (1946: 6–20) and Tardie (1990: 71–102) provide descriptions and photographs
    of archaeological evidence for this practice using inflated skins as floats, which
    dates back to ninth-century Assyria; cf. also Casson (1971: 3 n.) for more depictions.
    For the production of skin bags see my note above on VM 8 utiles facile. The description
    of a panel from the palace of Sennacherib (705–681 bc) (British Museum, Mansell
    Collection, no. 430) to parallel the depiction of the couple''s method of crossing
    the river: ‘two men... are floating leisurely downstream, each balanced precariously
    atop an inflated skin. One skin is small, presumably that of a goat...'' (Hornell
    1946: 7). Malchus’ phrase inflatis et ascensis utribus aquis nos credimus paulatim
    debit subimregantes appears to describe a similar position to floaters observed
    in twentieth-century Persia, Central Asia, and Northern Italy:


    These skins float with the shortened legs uppermost, the owner lying across the
    body with his feet in the water. Sculling with a short-handled, broad-bl paddle
    and splashing with his feet, he makes fairly good progress across a river if the
    current be moderate; even so, his course is so oblique that he lands on the opposite
    bank some downstream from his starting-point, and this leeway has to be allowed
    for if he is to land at any specified place. (Hornell 1946: 10; my emphases.)


    On floating techniques also see the account of Turkestan and North India (Hornell
    1946: 12).


    In Greek and Latin literature the use of this type of float is overwhelmingly
    associated with armies. Soldiers had to keep their luggage as small as possible
    in order to march efficiently, and animal skins would have provided a maximum
    of buoyancy without taking much space during transport. In addition they were
    also useful as containers of drinking water, which made them doubly efficient.
    The iconographic record confirms the habit of carrying skins for Mesopotamian
    soldiers (Hornell 1946: 7). For classical antiquity see the accounts of Xen. An.
    1.5.10; Arrab. Ab. 3.29.4, 1.3.6, with Casson (1971: 3 n); Curt. 7.5.18, 7.7.16.
