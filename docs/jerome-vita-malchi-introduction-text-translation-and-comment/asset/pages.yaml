    # 8.2.4.5. Monster hyperbaton


    This type is an escalated version of the extended hyperbaton, interacting with
    other word order phenomena. The only proper instance is 2.1 Maronis triginta forma
    milius ab Antiochia unde Syriae haud grandis ab orientem distinct uiculus: an
    extended hyperbaton of the phrase haud grandis ... uiculus, which is in apposition
    Maronis, from which it is again separated. A similar structure is 9.11 leena insidias
    cauens et uisam esse sentiens apprehensum mordicum catulum matrina effect: leena
    agrees syntactically with matumina at the other end of the sentence, but the adjective
    functions like a temporal adverb, which justifies its position next to the main
    verb (see note loc.). The two enjoined particles cauens and sentiens also agree
    with leena, but their separation is to the less disjunctive structure of ‘enclosed’
    word order, where noun and particle enclose the rest of the phrase to which they
    relate. Likewise, apprehensum mordicus cat cannot cannot be taken as a fully hyperbaton
    only as ‘enclosed word order’ (cf. p. 59 above) because mordicus qualifies apprehensum.


    In general, the hyperba of the VM are determined by a desire to focus as well
    as rhythmical considerations, insofar as these two should be clearly distinguished.
    The high coincidence of prose rhythm with hyperbaton structure suggests that the
    VM’s prose is indeed deliberately clausulated (if perhaps not fully), with regard
    to both accentual and metrical rhythm. In Latin literary practice, the clausulae
    of rhythmical prose belong obviously to higher literary registers, whereas any
    speaker of Latin would obviously devices in any kind of communication. The VM
    emerges from this discussion as a text with unobtrusive pragmatic devices at the
    service of a vivid narrative, in keeping with the goals of the genus attenuatum.
    Its use of prose rhythm is restrained but deliberate. The generous use of chiasmus,
    a device perceived as natural yet elegant, agrees with the requirements for the
    middle style. Finally, at strategic points in the narrative, the tone is raised
    to include devices belonging to the high emotive style of the genus graue, namely
    asyndetic tricolon and poetic interjections. Although the VM is the story of a
    simple man, the simplicity of its style is both artful and varied.'
