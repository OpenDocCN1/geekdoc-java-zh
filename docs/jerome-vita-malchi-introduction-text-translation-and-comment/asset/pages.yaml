  md: '# Introduction


    But on his way home Malchus is kidnapped by Saracens (ch. 4). He, together with
    a woman, is assigned as a slave to one of the Saracens and given the task of herding
    the sheep in the desert (ch. 5). After Malchus has reconciled himself to this
    fate and found a way of living the life of a monk among his flocks, his success
    as a shepherd leads to an existential crisis, which is described in ch. 6. To
    reward Malchus'' good services, his Saracen master offers him as a wife the woman
    who was captured at the same time as Malchus. Because she is married already (her
    husband was abducted during the same raid by a different Saracen), and because
    Malchus as a monk is committed to preserving her virginity, he intends to take
    his own life in the cave in which the couple are expected to consummate their
    marriage. But at the last moment the woman appeals to him in the name of Christ
    and reveals that during her captivity she has committed to the same ideal of chastity.
    They agree to live together in a pretended marriage but Malchus remains on his
    guard against sexual temptation.


    In ch. 7 Malchus, still herding the sheep, observes a colony of ants and is filled
    with desire to be back in a monastic community. In ch. 8 he shares his longing
