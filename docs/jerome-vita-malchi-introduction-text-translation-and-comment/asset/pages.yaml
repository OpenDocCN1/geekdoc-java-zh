    # 8.2.4.1. Plain hyperbaton


    For the purposes of this discussion, ‘plain hyperbaton’ is defined as one phrase
    consisting of two parts, the ‘head’ and the ‘modifier’, interrupted by a single
    stress-bearing²¹⁷ constituent which is not syntactically integrated into the interrupted
    phrase. This pattern occurs in the order head—interruption—modifier or modifier—interruption—head.
    It appears to correspond to Jonathan Powell’s ‘short-range’ hyperbaton, which
    in Cicero, is ‘always a focusing device.’²¹⁸ Powell further argues that If the
    modifier comes first… it is usually just that the modifier that bears the focus,
    if the head comes first the whole phrase is focused.


