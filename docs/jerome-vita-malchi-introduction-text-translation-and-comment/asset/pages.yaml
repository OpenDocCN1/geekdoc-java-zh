    uiders onera maiora quam corpora: cf. Plin. NH 11.108 ac quis conparenet onera
    corporis earum, fateatur nullione uires maiores. Ants can in fact lift multiples
    of their body weight; the exact ratio depends on the species (cf. Keller 1909–13:
    II.419).


    uiders: probably an echo of Virg. Aen. 4.401 cernas. Pease (1935: 339) quotes
    Servius’ comment ad loc.: honesta figura si rem tertiae personae in secundam referas,
    hoc est, ‘si quis cat’ and gives parallels for the use of the present subjunctive,
    in this kind of situation is less usual than the imperfect.


    The mood is the potential of the past: ‘you could have seen’, which is always
    used in the generic second person (‘you’ = ‘one’) with a limited range of verbs
    (e.g. ‘to know’, ‘to find’, ‘to say’): cf. Handford (1947: 107). For this form
    used a conditional construction cf. Hofmann and Szantyr (1965: 334). The use is
    rare in Plautus, by Hofmann and Szantyr Curc. 331 scires uelle gratiam tuam as
    an exception. From Terence onwards the form becomes more common, although a conditional
    clause of the type si adversuis is usually implied. Yet Handford (1947: 107) argues
    against regarding the remote conditional as the origin of the potential on the
    grounds that the range of verbs and forms used is very narrow. In classical Latin
    (especially Cicero, e.g. Phil. 2.67 conchyliatis Cn. Pompei perstromatis serum
    in cella lectos stratos uiders, and Livy, e.g. 2.43.9 inniussu signa referunt
    reaugiste—crederes uicos—imperatem redeunt (ca) this subjunctive is fairly frequent,
    while in later Latin it becomes a purely literary device (cf. Salonius 1920: 23).
    The use of the imperfect instead of the pluperfect for the past potential is commonly
    explained by reference to the more immediate character of the potential compared
    to the hypothetical meaning. Mayer (1956: 133) objects whose immediacy should
    not be the norm of a general use be an option determined by pragmatics (thus the
    historic present, for example, can be interpreted as a marked variation on the
    perfect or imperfect to achieve immediacy; but see Pinkster 1990: 224–5, discussed
    below, p. 265), whereas for the past potential the imperfect is the regular, unmarked
    form. Mayer takes the use as an indication that the Latin imperfect has its morphological
    origins in the Proto-Indo-European preterite.


