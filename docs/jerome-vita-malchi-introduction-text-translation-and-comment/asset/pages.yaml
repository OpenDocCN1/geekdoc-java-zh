    # 8.1.4. Christian Latin


    The assumption that Latin-speaking Christians used an idiom which differed significantly
    in lexicon, syntax, and morphology from secular varieties is now largely discarded
    by scholars.¹194 Nevertheless, the new religion did a number of lexical and syntactic
    innovations widely embraced many of the colloquial and later Latin habits outlined
    above (depending on genre and audience), in addition to theological and institutional
    items of vocabulary, often calqu or transliterated from the Greek.¹195 The translations
    of the Bible preserved many Latin uses as well as syntactic Hebrews and Graecisms.
    Of the overwhelming importance of the biblical text in Christian discourse, many
    of these influenced the language of Christians and survived as Roman expressions.¹196
    Jerome has been credited with contributing to the development of an official language
    of the Roman Church, both in liturgical texts and administrative documents, when
    he was working for Pope Damasus.¹197 The VM is not a theological treatise, and
