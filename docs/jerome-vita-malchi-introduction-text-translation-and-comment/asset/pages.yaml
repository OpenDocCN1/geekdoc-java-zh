    # 8.2. Rhetorical devices


    All styles, including the humble genus attenuat, are supposed to contain appropriate
    ornamentation: omne genus orationis, et graue mediocre et attenuat, dignitate
    adisciunt exornation (Rhet. Her. 4.16). Cic. Or. 20 specifies the virtues of sparse
    ornamentation appropriate to this register: alii in eadem ieuniate concinniiores,
    idem faceti, florentes et leuter ornati. The most prominent of the rhetorical
    figures in the VM and their precise contribution to the work''s texture are analysed
    in the following. More details will be found in the Commentary.


    # 8.2.1. Asyndetic tricolon with homoeoteleuton


    Perhaps the most striking instance of self-conscious patterning in the VM is the
    use of three asyndetic tricola with homoeoteleuton. The first forms part of the
    abbot''s plea is taken by Malchus in reported discourse at 3.6 ne se deserunt,
    me perderem, ne aratum tenens post tergum respicerem. The three units are similar
    in meaning, and the last colon is extended by many of a participial construction
    and longer each of the preceding cola, in accordance with Otto Behaghel''s ''Gesetz
    der wachsenden Glieder¹⁸ A similar pattern is used


    > 198 ''This is the rule that [in Indo-European languages] shorter phrases tend
    to be placed before longer ones, both in and in verse, so that the sentence gains
    rather than loses weight as it develops (West 2007: 117, with reference to Behaghel
    1909). ''Behaghel''s Law is taken by West to reason phrases, and it can be generalized:
    see Bauer (2009: 299); ''According to this law, elements that have the same grammatical
