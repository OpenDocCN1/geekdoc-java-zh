    re reckoning, cf. OLD² s.v. tertius 3, not ‘after the third day’: this is clear
    from Cato Agr. 65.1: postride aut post diem tertium, quam lecta erit, facito:
    ‘do it on the next day or the next one after it has been collected’. The phrase
    is also used by Christian writers of the relation between Christ’s death and resurrection:
    Ps.-Cyprian (probably in the fourth century: Rauschen 1916: 10) De reabismatem
    9 oportet eum (sc. Iesus) ... interfici et post tertium resurgere; Lact. Div.
    Inst. 7.17.3 post diem tertium reuiscit. This timing coincides with the end of
    the couple’s provisions: 8.4nes ... uix tridui cibom poliebantur.


