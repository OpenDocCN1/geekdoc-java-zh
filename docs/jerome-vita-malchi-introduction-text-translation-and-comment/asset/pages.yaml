    #  3. DRAMATIC DATE


    There are two main temporal layers in the narrative of the VM. The framing action
    of ch. 2 takes place during Jerome’s sojourn with Evagrius near Antioch in the
    early to mid 370s, where he stayed for a few years before exploring his suitability
    for the monastic life in the desert of Chalcis.^21 Although he depicts himself
    as ardent to embrace the ascetic life.^22 he soon found himself at odds with his
    fellow monks and abandoned the experiment.^23 Even so, the romantic aspects of
    the VM and Jerome’s self-presentation as an eager novice will convey some of Jerome’s
    initial enthusiasm.


    The historically of Jerome’s encounter with Malchus is impossible to prove. Malchus’s
    existence is not recorded anywhere else; besides, there is a gap of more than
    fifteen (rather tumultuous) years between their meeting and the writing of the
    VM, which would make it challenging to remember even an authentic encounter with
    perfect accuracy. A further problem lies in the practicalities of the conversation
    between a Latin and an Arabic speaker (Malchus is Cyrus natione et lingua, 2).
    The medium would almost certain certainly have been Greek; although Jerome became
    a prolific translator from Greek into Latin, we do not know when he started to
    learn it. It is likely that his association with Evagrius, a Greek speaker who
    was capable of translating the Vita Antonii into literary Latin^24 facilitated
    his progress.^25 Eventually, Jerome acquired a working knowledge of Aramaic as
    well.^26 As for Malchus, it is entirely possible that he would have been bilingual
    in Syriac and Greek, as it seems to have been unprecedented in fourth-century
    Edessa.^27 If Jerome and Malchus had no shared language, Evagrius’ household probably
    included people who could interpret for them. All of this is speculation, and
    nothing stops us from regarding the VM as complete fiction; but as I show below,
    the work contains enough realistic aspects to make it plausible that Jerome had
    his information about conditions in the eastern fringe of the Roman Empire from
    a native traveller of the region like Malchus.


