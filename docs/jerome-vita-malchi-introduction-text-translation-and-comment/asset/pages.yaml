    # §1. The writing of the VM as naval exercise


    The image of the naval battle is a variation on a prefatory conceit favoured by
    Jerome. The general metaphor of the sea voyage symbolizing a literary undertaking
    occurs frequently in classical verse, and enters genres in late antiquity. Janson
    (1964:146–7) regards Jerome as establishing the precedent for this fashion, which
    is also found in Sedilius (Ep. ad Macedonium, CSEL 10.171), Sidonius Apollinaris
    (Ep. 1.1–3–4), and Cassian (Conl. praef. 3). An important is is. Inst. 12 proem
    2–4:


    mox uelu aura sollicante proictius, dum tamen nulla et plerisque scriptorium tractata
    praecipimimus, nem adhuc a dito procure uidebamum et multos circa uelum iedis
    se uentis creudos habebamus. item cum eloquendi rationem . ingussis, sumris, erat
    tam procur recissetis reperiebatur; postquam quem istitutibus orator, de dicendi
    magistris dimissus, aut suo iam impetur futur at maiora sibi auxilia in magnis
    sapientiae penetralibus petit, quam in altum sinus ablati coepimimus. nunc caelum
    unique et undeque punkt [Vir. Aen. 3.193].


    [L]ater, tempted as it was by a favourable wind, I sailed ahead; but so long as
    I was merely interpreting well-known doctrine which many writers had handled,
    I still did not feel from land, and I had many companions who had ventured, as
    it were, to trust themselves to the same winds. Then, when I entered upon the
    theory of Elocution . . . those who had strayed so from harbour proved to be few
    and far between. And finally, now that the orator I was educating has been dismissed
    by his teachers and is either proceeding under his power or seeking greater assistance
    from the innermost shrine of philosophy, I begin to feel how far I have been swept
    out to sea. Now I have ‘sky all around, and all around the deep’. (Tr. Russell
    2001: V.195–7.)


