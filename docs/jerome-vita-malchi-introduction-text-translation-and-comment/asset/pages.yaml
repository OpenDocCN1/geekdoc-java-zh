    # CH. 7: MALCHUS DECIDES TO RETURN

    TO THE MONASTERY


    Although content in his situation as chaste husband and shepherd,

    Malchus is seized with longing for the monastery which he aban-

    doned (§1). The virtues of the cenobitic monastic life are illustrated by

    h observation of a colony of ants (§2). He wishes to imitate the

    labour and their concern for the community (§3). The implication is

    that a community life is only possible among cenobitic monks,

    and that it is superior to his individualistic monasticism. There is no

    discussion in this chapter of the additional complication of his

    atachment to the woman (VM 6).


    The chapter is particularly significant for the polemical purposes of

    t VM as it juxtaposes the eremitical life with cenobitic monasticism

    and champions the latter (cf. de Vogué le Leclerc et al. 2007: 80–1).

    The respective status of different models... Basil, Cassian, and Pacho-

    ius all wrote rules for monastic communities. Jerome actively par-

    ticipated in this debate, for example by translating the Rule of

    Pachomius into Latin; see also his exposition of three different cat-

    egories of monks in Ep. 22.34–7. The VM can be read as an attempt to

    construct a precedent for Jerome’s own version of monastic life with

    Paula in a double community of monks and nuns (de Vogué 1991-

    2007: II.100–1). That Jerome was concerned in his hagiographic

    works to create etiologies for existing models of monastic life is

    clear from the VP’s construction of a predecessor for Antony; and

