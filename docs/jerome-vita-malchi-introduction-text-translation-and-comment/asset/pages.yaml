    # CH. 9: THE SECOND CAVE AND THE LIONESS


    The couple find themselves pursued by two figures riding on camels (§1). They
    hide in the entrance of a deep subterranean cave and entrust themselves to the
    judgement of God (\$2). The master and a fellow servant arrive at the mouth of
    the cave (\$3). The master sends the servant to drag the couple (§5). Entering
    the cave, the servant is blinded by the sudden darkness. He shouts for the couple
    to give themselves up to the master (\$6). At the sound of his voice a lioness
    appears from the cave’s recesses and kills him (\$7). While the master grows impatient.
    He comes after the servant and is killed in the same way (\$8). The couple rejoice
    over their death remain terrified for their lives (\$9). They remain in their
    hiding place, feeling protected by their chastity (\$10). In the morning the lioness
    leaves the cave, carrying her cub. The couple wait before daring to go outside
    (\$11).


