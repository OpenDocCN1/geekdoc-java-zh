    Vita Malchi


    # §2. The ants


    The moral example of the ants serves to develop Malchus'' inchoate thoughts. While
    Malchus'' experience is entirely naturalistic, the impact of his observation is
    akin to that of a supernatural revelation. Jerome''s depiction of the ants draws
    on an ancient moralizing tradition which has its roots in Near Eastern wisdom
    literature; arts are found in the Syrian versions of the Story of Ahiqar (the
    oldest version of this text, which does not refer to ants, is an Aramaic version
    preserved on a papyrus from the fifth century BC, for which see Niehr 2007); implicitly
    in He. WD 778 (τίδрис σωρῶν ἀμάραται: ''the one who gathers a pile''); and in
    the Old Testament Proverbs ascribed to Solomon (6:6, quoted in the VM). The philosophical
    interests of Greek and Latin authors produced an increasingly differentiated presentation
    of ants, with scientific observations and mythological imagination inspiring and
    illustrating each other, usually in the service of a search for universal truths.


    The descriptions of ants by Aelian (NA 2.25, 4.43 (4.44 Teubner), 6.43, 6.50),
    Pliny (NH 11.08–10), Plutarch (Soll. an. 967–968a), and Philo (De Animalibus 42,
    91–2) are closely related. In part they go back to Aristotle (HA 488a, 622b, 623b),
    but they seem to have other sources and/or copy one another. All of these authors
    provide more or less coherent accounts which share a pre preoccupations: cf. Terian
    (1981: 154).


    Christian authors drew on this scientific material, especially in the homiletic
    genre of the Hexameron, a series of sermons on the first six days of creation,
    in which the order of the natural world was interpreted in such a way to yield
    theological insights and contribute to the moral edification of the congregation.
    The earliest examples are the fourth-century Hexameron of Basil and its Latin
    adaptation in Ambrose''s Exameron, which Jerome calls, also incorporates material
    from Origen and Hippolytus: Ep. 84.7.4: nuper Ambrosius sic Exameron illius [i.e.
    Origenis] compilaut, ut magis Hippyli Sentencias Basillique sequitur. According
    to Henke (2000: 19), this refers to the Genesis commentary of Origen, the fragments
    of which are printed at PG XII.45–146; Hippolytus'' Hexameron is all but completely
    lost (Harnack 1893: 627.22 lists one possible fragment).


    The precision of Jerome''s description of the ants makes makes it likely that
    he was acquainted not only with the moral exegesis of science but'
