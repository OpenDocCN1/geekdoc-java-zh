  md: '# Commentary 11 307


    encouraged by Antony’s examples and experiences. Evagrius’ version is as follows:


    hunc itaque fratribus librum magnoporeungere curate, ut, agita fideli uita subilium
    monomachorum, sciant quod Salvator iesus Chris- glorificastes glorificat, et gentibus
    legite, ut vel sciscant quia Dominus Jesus Christus non solum Deus, Dei Filius,
    et etiam qui eum sollicite, et in eum fideliter redunt, hanc debit potestatem,
    et daemones...conculquent aequi.


    Therefore take care to read this book to the brothers, so that, when they have
    recognized the faithful lives of the reverent monks, they may know that our Saviour
    Jesus glorifies him... read it to the Gentiles, that they may recognize that our
    Lord Jesus Christ is not only God, the Son of God, but also to those who worship
    him diligently and who believe in him faithfully he has given the power to tremble
    underfoot and to do demos...


    uos narrate posteris: this phrase confirms Jerome’s audience is envisaged as younger
    than himself: they are in a position to pass the story to later generations. A
    similar emphasis on tradition can be observed at the course of some of the earliest
    martyr stories, for example the Acts of Polycarp, where each copyist inscribes
    his name at the end as an example for passing the story to Cf. Jer. Iel. 1.2–3
    (CCSL 76 p. 162–3): synes ergo habitadores terrae, filius uestis posterisque narrate:
    Cat. 68.45–6, quoted above, Liv. 305; Liv. 1.16.7 it posteris tandem nullas omnes
    humanis Romanis resistere posse (and similar passages in Livy)


    ut sciant ...superari: the ultimate goal of the story from the primary narrator’s
    point of view is moral reassurance that it is possible to preserve one chastity
    (symbolizing, of course, Christianity) in the face of the worst adversities. By
    implication the audience should feel encouraged that it is possible to overcome
    their own (presumably lesser) afflictions. For the phrasing cf. Novatian Pudic.
    8 (cited in note on 3.1), above, on the temptation of Joseph by Potiphar’s wife:
    putauit se pudiciam adolescentes... posse superbe.


    ut sciant: cf. the first two lines of the corresponding VA passage in Evagrius’
    translation (above) for a verbal parallel.


    inter gladios, inter deserta et bestias: the reading of Neap., Paris., Sess. and
    Laur.; Mon. has inter gladios et deserta et bestias. With the repetition of inter
    the phrase is reminiscent of Virg. Aen. 7.407 inter'
