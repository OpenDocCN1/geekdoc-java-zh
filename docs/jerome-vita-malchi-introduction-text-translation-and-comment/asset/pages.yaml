  md: '162 Vita Malchi


    reputans: cf. 9.2 illudque nobisiscum reputantes. reputo is a high-style alternative
    to cogito: cf. Adams (1970: 138). While cogito is frequent in all periods, the
    celebration of reputo in comedy (both Plautus and Terence), history, and authors
    such as Fronto and Apuleius suggests that it was cultivated as an archism. It
    was probably regarded as ‘high’ rather than ‘colloquial’, as is indicated by its
    use in Sallust’s Bellium Iugurthininum (eight instances) and in Tacitus, whose
    work contains the highest absolute number of instances of reputo in classical
    literature. Furthermore, twelve out of Tacitus eighteen forms of reputo are present
    participles, a higher proportion than in classical (pre-Christian) literature
    as a whole, where the present participle accounts for about one-third of the total
    instances of reputo. Jerome’s LLT-A corpus has nine present participles out of
    a total of more than 150 instances of reputo: the two instances of the participle
    in the VM are therefore significant and may be chosen in imitation of Tacitus.


