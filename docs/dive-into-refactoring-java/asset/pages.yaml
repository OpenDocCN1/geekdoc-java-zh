- img_proc: true
  md: '# Reasons for the Problem


    A single responsibility has been split up among a large number of classes. This
    can happen after overzealous application of Divergent Change.


    ![](img/a9f2bde5dbae80f6f98fa49ccbde8add_43_0.png)


    # Treatment


    +   - Use Move Method and Move Field to move existing class behaviors into a single
    class. If there''s no class appropriate for this, create a new one.


    +   - If moving code to the same class leaves the original classes almost empty,
    try to get rid of these now-redundant classes via Inline Class.'
  merge: -1
