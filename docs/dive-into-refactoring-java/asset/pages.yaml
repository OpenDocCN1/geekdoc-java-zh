  md: '# Remove Control Flag


    **Problem:** You have a boolean variable that acts as a control flag for multiple
    boolean expressions.


    **Solution:** Instead of the variable, use `break`, `continue` and `return`.


    # Replace Nested Conditional with Guard Clauses


    **Problem:** You have a group of nested conditionals and it’s hard to determine
    the normal flow of code execution.


    **Solution:** Isolate all special checks and edge cases into separate clauses
    and place them before the main checks. Ideally, you should have a “flat” list
    of conditionals, one after the other.


    # Replace Conditional with Polymorphism


    **Problem:** You have a conditional that performs various actions depending on
    object type or properties.


    **Solution:** Create subclasses matching the branches of the conditional. In them,
    create a shared method and move code from the corresponding branch of the conditional
    to it. Then replace the conditional with the relevant method call. The result
    is that the proper implementation will be attained via polymorphism depending
    on the object class.


    # Introduce Null Object


    **Problem:** Since some methods return `null` instead of real objects, you have
    many checks for `null` in your code.'
