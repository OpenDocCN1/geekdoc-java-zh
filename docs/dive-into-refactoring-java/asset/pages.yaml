  md: '# Object-Orientation Abusers


    All these smells are incomplete or incorrect application of object-oriented programming
    principles.


    # § Switch Statements


    You have a complex `switch` operator or sequence of if statements.


    # § Temporary Field


    Temporary fields get their values (and thus are needed by objects) only under
    certain circumstances. Outside of these circumstances, they''re empty.


    # § Refused Bequest


    If a subclass uses only some of the methods and properties inherited from its
    parents, the hierarchy is off-kilter. The unneeded methods may simply go unused
    or be redefined and give off exceptions.


    # § Alternative Classes with Different Interfaces


    Two classes perform identical functions but have different method names.'
  merge: -1
  pgno: 25
- img_proc: true
  md: '# Switch Statements


    # Signs and Symptoms


    You have a complex switch operator or sequence of if statements.


    ![](img/a9f2bde5dbae80f6f98fa49ccbde8add_26_0.png)


    # Reasons for the Problem


    Relatively rare use of switch and case operators is one of the hallmarks of object-oriented
    code. Often code for a single switch can be scattered in different places in the
    program. When a new condition is added, you have to find all the switch code and
    modify it.'
  merge: -1
  pgno: 26
- img_proc: true
  md: 'As a rule of thumb, when you see switch you should think of polymorphism.


    # Treatment


    +   - To isolate switch and put it in the right class, you may need Extract Method
    and then Move Method.


    +   - If a switch is based on type code, as when when the program’s runtime mode
    is switched, use Replace Type Code with Sub-classes or Replace Type Code with
    State/Strategy.


    +   - After specifying the inheritance structure, use Replace Conditional with
    Polymorphism.


    +   - If there aren’t too many conditions in the operator and they all call same
    method with different parameters, polymorphism will be superfluous. If this case,
    you can break that method into multiple smaller methods with Replace Parameter
    with Explicit Methods and change the switch accordingly.


    +   - If one of the conditional options is null, use Introduce Null Object.


    # Payoff


    Improved code organization.'
  merge: -1
