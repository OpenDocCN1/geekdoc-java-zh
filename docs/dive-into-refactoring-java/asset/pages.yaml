- img_proc: true
  md: '# Parallel Inheritance Hierarchies


    # Signs and Symptoms


    Whenever you create a subclass for a class, you find yourself needing to create
    a subclass for another class.


    ![](img/a9f2bde5dbae80f6f98fa49ccbde8add_45_0.png)


    # Reasons for the Problem


    All was well as as long as the hierarchy stayed small. But with new classes being
    added, making changes has become harder and harder.'
  merge: -1
  pgno: 45
- img_proc: true
  md: '# Treatment


    You may de-duplicate parallel class hierarchies in two steps. First, make instances
    of one hierarchy refer to instances of another hierarchy. Then, remove the hierarchy
    in the referred class, by using Move Method and Move Field.


    # Payoff


    +   - Reduces code duplication.


    +   - Can improve organization of code.


