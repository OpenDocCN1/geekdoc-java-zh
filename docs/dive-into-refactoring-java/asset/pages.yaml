    **Problem:** You have an array that contains various types of data.


    **Solution:** Replace the array with an object that will have separate fields
    for each element.


    # Duplicate Observed Data


    **Problem:** Is domain data stored in classes responsible for the GUI?


    **Solution:** Then it''s a good idea to separate the data into separate classes,
    ensuring connection and synchronization between the domain class and the GUI.


    # Change Unidirectional Association to Bidirectional


    **Problem:** You have two classes that each need to use the features of the other,
    but the association between them is only unidirectional.


    **Solution:** Add the missing association to the class that needs it.


    # Change Bidirectional Association to Unidirectional


    **Problem:** You have a bidirectional association between classes, but one of
    the classes doesn''t use the other''s features.'
