  md: '# Drawbacks


    +   - More variables are present in your code. But this is counterbalanced by
    the ease of reading your code.


    +   - When refactoring conditional expressions, remember that the compiler will
    most likely optimize it to minimize the amount of calculations needed to establish
    the resulting value. Say you have a following expression `if (a() || b())` . .
    The program won''t call the method `b` if the method `a` returns `true` because
    the resulting value will still be `true`, no matter what value returns `b`.


    However, if you extract parts of this expression into variables, both methods
    will always be called, which might hurt performance of the program, especially
    if these methods do some heavyweight work.


    # How to Refactor


    +   1. Insert a new line before the relevant expression and declare a new variable
    there. Assign part of the complex expression to this variable.


    +   2. Replace that part of the expression with the new variable.


    +   3. Repeat the process for all complex parts of the expression.'
