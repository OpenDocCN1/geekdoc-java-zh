    Extracting a variable may be the first step towards performing **Extract Method**
    if you see that the extracted expression is used in other places in your code.


    # Benefits


    More readable code! Try to give the extracted variables good names that announce
    the variable''s purpose loud and clear. More readability, fewer long-winding comments.
    Go for names like `customerValue`, `cityUnemploymentRate`, `clientSalutationString`,
