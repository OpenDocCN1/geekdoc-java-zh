  md: '# Why Refactor


    Say that a portion of code assumes something about, example, the current condition
    of an object or value of a parameter or local variable. Usually this assumption
    will always hold true except in the event of an error.


    Make these assumptions obvious by adding corresponding assertions. As with type
    hinting in method parameters, these assertions can act as live documentation for
    your code.


    As a guideline to see where your code needs assertions, check for comments that
    describe the conditions under which a particular method will work.


    # Benefits


    If an assumption isn’t true and the code therefore gives the wrong result, it''s
    better to stop execution before this causes fatal consequences and data corruption.
    This also means you neglected to write a necessary test when devising ways to
