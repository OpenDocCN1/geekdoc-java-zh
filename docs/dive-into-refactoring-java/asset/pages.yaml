    # # Why Refactor


    Returning error codes is an obsolete holdover from procedural programming. In
    modern programming, error handling is performed by special classes, which are
    named exceptions. If a problem occurs, you “throw” an error, which is then “caught”
    by one of the exception handlers. Special error-handling code, which is ignored
    in normal conditions, is activated to respond.


    # # Benefits


    +   - Frees code from a large number of conditionals for checking various error
    codes. Exception handlers are a much more succinct way to differentiate normal
    execution paths from abnormal ones.


    +   - Exception classes can implement their own methods, thus containing part
    of the error handling functionality (such as for sending error messages).


    +   - Unlike exceptions, error codes can’t be used in a constructor, since a constructor
    must return only a new object.'
  merge: -1
