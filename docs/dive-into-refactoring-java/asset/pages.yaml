  md: '# Organizing Data


    These refactoring techniques help with data handling, replacing primitives with
    rich class functionality.


    Another important result is untangling of class associations, which makes classes
    more portable and reusable.


    # § Self Encapsulate Field


    **Problem:** You use direct access to private fields inside a class.


    **Solution:** Create a getter and setter for the field, and use only them for
    accessing the field.


    # § Replace Data Value with Object


    **Problem:** A class (or group of classes) contains a data field. The field has
    its own behavior and associated data.


    **Solution:** Create a new class, place the old field and its behavior in the
    class, and store the object of the class in the original class.


    # § Change Value to Reference


    **Problem:** So you have many identical instances of a single class that you need
    to replace with a single object.


    **Solution:** Convert the identical objects to a single reference object.'
