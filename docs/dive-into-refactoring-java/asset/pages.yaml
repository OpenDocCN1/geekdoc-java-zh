  md: '# Change Preventers


    These smells mean that if you need to change something in one place in your code,
    you have to make many changes in other places too. Program development becomes
    much more complicated and expensive as a result.


    # Divergent Change


    You find yourself having to change many unrelated methods when you make changes
    to a class. For example, when adding a new product type you have to change the
    methods for finding, displaying, and ordering products.


    # Shotgun Surgery


    Making any modifications requires that you make small changes to many different
    classes.


    # Parallel Inheritance Hierarchies


    Whenever you create a subclass for a class, you find yourself needing to create
    a subclass for another class.'
  merge: -1
  pgno: 38
- img_proc: true
  md: '# Divergent Change


    Divergent Change resembles Shotgun Surgery but is actually the opposite smell.
    Divergent Change is when many changes are made to a single class. Shotgun Surgery
    refers to when a single change is made to multiple classes simultaneously.


    # Signs and Symptoms


    You find yourself having to change many unrelated methods when you make changes
    to a class. For example, when adding a new product type you have to change the
    methods for finding, displaying, and ordering products.


    ![](img/a9f2bde5dbae80f6f98fa49ccbde8add_39_0.png)'
  merge: -1
  pgno: 39
- img_proc: true
  md: '# Reasons for the Problem


    Often these divergent modifications are due to poor program structure or "copypasta
    programming".


    # Treatment


    +   - Split up the behavior of the class via Extract Class.


    +   - If different classes have the same behavior, you may want to combine the
    classes through inheritance (Extract Superclass and Extract Subclass).


    ![](img/a9f2bde5dbae80f6f98fa49ccbde8add_40_0.png)


    # Payoff


    +   - Improves code organization.


    +   - Reduces code duplication.'
