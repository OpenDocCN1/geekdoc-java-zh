  md: '# Refused Bequest


    # Signs and Symptoms


    If a subclass uses only some of the methods and properties inherited from its
    parents, the hierarchy is off-kilter. The unneeded methods may simply go unused
    or be redefined and give off exceptions.


    ![](img/a9f2bde5dbae80f6f98fa49ccbde8add_32_0.png)


    # Reasons for the Problem


    Someone was motivated to create inheritance between classes only by the desire
    to reuse the code in a superclass. But the superclass and subclass are completely
    different.'
  merge: -1
  pgno: 32
- img_proc: true
  md: '![](img/a9f2bde5dbae80f6f98fa49ccbde8add_33_0.png)


    # Treatment


    +   - If inheritance makes no sense and the subclass really does have nothing
    in common with the superclass, eliminate inheritance in favor of Replace Inheritance
    with Delegation.


    +   - If inheritance is appropriate, get rid of unneeded fields and methods in
    the subclass. Extract all fields and methods needed by the subclass from the parent
    class, put them in a new subclass, and set both classes to inherit from it (Extract
    Superclass).'
  merge: -1
