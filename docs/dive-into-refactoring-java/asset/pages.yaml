- img_proc: true
  md: '# Treatment


    +   - If a class contains public fields, use Encapsulate Field to hide them from
    direct access and require that access be performed via getters and setters only.


    +   - Use Encapsulate Collection for data stored in collections (such as arrays).


    +   - Review the client code that uses the class. In it, you may find functionality
    that would be better located in the data class itself. If this is the case, use
    Move Method and Extract Method to migrate this functionality to the data class.


    +   - After the class has been filled with well thought-out methods, you may want
    to get rid of old methods for data access that give overly broad access to the
    class data. For this, Remove Setting Method and Hide Method may be helpful.


