    # Simplifying Method Calls


    These techniques make method calls simpler and easier to understand. This, in
    turn, simplifies the interfaces for interaction between classes.


    # Rename Method


    **Problem:** The name of a method doesn''t explain what the method does.


    **Solution:** Rename the method.


    # Add Parameter


    **Problem:** A method doesn''t have enough data to perform certain actions.


    **Solution:** Create a new parameter to pass the necessary data.


    # Remove Parameter


    **Problem:** A parameter isn''t used in the body of a method.


    **Solution:** Remove the unused parameter.


    # Separate Query from Modifier


    **Problem:** Do you have a method that returns a value but also changing something
    inside an object?


    **Solution:** Split the method into two separate methods. As you would expect,
    one of them should return the value and the other one modifies the object.


    # Parameterize Method


    **Problem:** Multiple methods perform similar actions that are different only
    in their internal values, numbers or operations.


    **Solution:** Combine these methods by using a parameter that will pass the necessary
    special value.


    # Replace Parameter with Explicit Methods


    **Problem:** A method is split into parts, each of which is run depending on the
    value of a parameter.


    **Solution:** Extract the individual parts of the method into their own methods
    and call them instead of the original method.


    # Preserve Whole Object


    **Problem:** You get several values from an object and then pass them as parameters
    to a method.


    **Solution:** Instead, try passing the whole object.


    # Replace Parameter with Method Call


    **Problem:** Calling a query method and passing its results as the parameters
    of another method, while that method could call the query directly.


    **Solution:** Instead of passing the value through a parameter, try placing a
    query call inside the method body.


    # Introduce Parameter Object


    **Problem:** Your methods contain a repeating group of parameters.


    **Solution:** Replace these parameters with an object.


    # Remove Setting Method


    **Problem:** The value of a field should be set only when it''s created, and not
    change at any time after that.


    **Solution:** So remove methods that set the field''s value.


    # Hide Method


    **Problem:** A method isn''t used by other classes or is used only inside its
    own class hierarchy.


    **Solution:** Make the method private or protected.


    # Replace Constructor with Factory Method


    **Problem:** You have a complex constructor that does something more than just
    setting parameter values in object fields.


    **Solution:** Create a factory method and use it to replace constructor calls.


    # Replace Error Code with Exception


    **Problem:** A method returns a special value that indicates an error?


    **Solution:** Throw an exception instead.


    # Replace Exception with Test


    **Problem:** You throw an exception in a place where a simple test would do the
    job?


    **Solution:** Replace the exception with a condition test.


    # Rename Method


    ## Problem


    The name of a method doesn''t explain what the method does.


    | Customer |

    || getsnm() |


    ## Solution


    Rename the method.


    | Customer |

    | getSecondName() |


    ## Why Refactor


    Perhaps a method was poorly named from the very beginning – for example, someone
    created the method in a rush and didn''t give proper care to naming it well.


    Or perhaps the method was well named at first but as its functionality grew, the
    method name stopped being a good descriptor.


    ## Benefits


    Code readability. Try to give the new method a name that reflects what it does.
    Something like `createOrder()`, `renderCustomerInfo()`, etc.


    ## How to Refactor


    - 1. See whether the method is defined in a superclass or subclass. If so, you
    must repeat all steps in these classes.

    - 2. The next method is important for maintaining the functionality of the program
    during the refactoring process. Create a new method with a new name. Copy the
    code of the old method to it. Delete all the code in the old method and, instead
    of it, insert a call for the new method.

    - 3. Find all references to the old method and replace them with references to
    the new one.

    - 4. Delete the old method. If the old method is part of a public interface, don''t
    perform this step. Instead, mark the old method as deprecated.


    # Similar refactorings


    - Add Parameter

    - Remove Parameter


    # Eliminates smell


    - Alternative Classes with Different Interfaces

    - Comments


    # Add Parameter


    ## Problem


    A method doesn''t have enough data to perform certain actions.


    | Customer |

    | --- |

    | getContact() |


    ## Solution


    Create a new parameter to pass the necessary data.


    | Customer |

    | --- |

    | getContact(Date) |


    ## Why Refactor


    You need to make changes to a method and these changes require adding information
    or data that was previously not available to the method.


    ## Benefits


    The choice here is between adding a new parameter and adding a new private field
    that contains the data needed by the method. A field is preferable when you need
    occasional or frequently changing data for which there’s no point in holding it
    in an object all of the time. In this case, a new parameter will be a better fit
    than a private field and the refactoring will pay off. Otherwise, add a private
    field and fill it with the necessary data before calling the method.


    ## Drawbacks


    - Adding a new parameter is always easier than removing it, which is why parameter
    lists frequently balloon to grotesque sizes. This smell is known as the Long Parameter
    List.

    - If you need to add a new parameter, sometimes this means that your class doesn''t
    contain the necessary data or the existing parameters do not contain the necessary
    related data. In both cases, the best solution is to consider moving data to the
    main class or to other classes whose objects are already accessible from inside
    the method.


    ## How to Refactor


    - 1. See whether the method is defined in a superclass or subclass. If the method
    is present in them, you will need to repeat the steps in these classes as well.

    - 2. The following step is critical for keeping your program functional during
    the refactoring process. Create a new method by copying the old one and add the
    necessary parameter to it. Replace the code for the old method with a call to
    the new method. You can plug in any value to the new parameter (such as `null`
    for objects or a zero for numbers).

    - 3. Find all references to the old method and replace them with references to
    the new method.

    - 4. Delete the old method. Deletion isn''t possible if the old method is part
    of the public interface. If that''s the case, mark the old method as deprecated.


    # Anti-refactoring


    - Remove Parameter


    # Similar refactorings


    - Rename Method


    # Helps other refactorings


    - Introduce Parameter Object


    # Remove Parameter


    ## Problem


    A parameter isn''t used in the body of a method.


    | Customer |

    | getContact(Date) |


    ## Solution


    Remove the unused parameter.


    | Customer |

    | getContact() |


    ## Why Refactor


    Every parameter in a method call forces the programmer reading it to figure out
    what information is found in this parameter.


    And if a parameter is entirely unused in the method body, this “noggin scratching”
    is for naught.


    And in any case, additional parameters are extra code that has to be run.


    Sometimes we add parameters with an eye to the future, anticipating changes to
    the method for which the parameter might be needed. All the same, experience shows
    that it''s better to add a parameter only when it''s genuinely needed. After all,
    anticipated changes often remain just that – anticipated.


    ## Benefits


    A method contains only the parameters that it truly requires.


    ## When Not to Use


    If the method is implemented in different ways in subclasses or in a superclass,
    and your parameter is used in those implementations, leave the parameter as-is.


    ## How to Refactor


    - See whether the method is defined in a superclass or subclass. If so, is the
    parameter used there? If the parameter is used in one of these implementations,
    hold off on this refactoring technique.

