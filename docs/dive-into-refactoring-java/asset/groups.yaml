    \ |\n| LengthField_FocusLost() |\n| calculateLength() |\n| calculateEnd() |\n\n\
    ## 解决方案\n\n那么将数据分离到不同的类中是一个好主意，确保领域类与 GUI 之间的连接和同步。\n\n## 重构技术 / 观察到的重复数据\n\n\
    ![](img/a9f2bde5dbae80f6f98fa49ccbde8add_171_0.png)\n\n## 为什么要重构\n\n你希望为同一数据拥有多个界面视图（例如，你既有桌面应用又有移动应用）。如果你未能将\
    \ GUI 与领域分离，避免代码重复和大量错误将非常困难。\n\n## 益处\n\n- 你在业务逻辑类和表示类之间划分了职责（参考单一职责原则），这使得你的程序更具可读性和易理解。\n\
    - 如果你需要添加新的界面视图，只需创建新的表示类；不需要触碰业务逻辑代码（参考开闭原则）。\n- 现在不同的人可以处理业务逻辑和用户界面。\n\n## 何时不使用\n\
    \n- 这种重构技术在经典形式下使用观察者模板执行，不适用于 Web 应用，因为在每次向 Web 服务器查询之间，所有类都会重新创建。\n- 尽管如此，将业务逻辑提取到独立类的通用原则对于\
    \ Web 应用同样是合理的。但这将根据你的系统设计，使用不同的重构技术来实现。\n\n## 如何重构\n\n- 1. 在 GUI 类中隐藏对领域数据的直接访问。为此，最好使用“自封装字段”（Self\
    \ Encapsulate Field）。因此你为这些数据创建 getter 和 setter。\n- 2. 在 GUI 类事件的处理器中，使用 setter\
    \ 设置新的字段值。这将让你将这些值传递给关联的领域对象。\n- 3. 创建一个领域类，并将必要的字段从 GUI 类复制到其中。为所有这些字段创建 getter\
    \ 和 setter。\n- 4. 为这两个类创建一个观察者模式：\n  - 在领域类中，创建一个用于存储观察者对象（GUI 对象）的数组，以及注册、删除和通知它们的方法。\n\
    \  - 在 GUI 类中，创建一个用于存储领域类引用的字段以及 `update()` 方法，该方法将对对象的更改做出响应并更新 GUI 类中字段的值。注意，值更新应直接在方法中建立，以避免递归。\n\
    \  - 在 GUI 类构造函数中，创建一个领域类的实例并将其保存到你创建的字段中。将 GUI 对象注册为领域对象中的观察者。\n- 在领域类字段的 setter\
    \ 中，调用通知观察者的方法（换句话说，GUI 类中的更新方法），以便将新值传递给 GUI。\n- 修改 GUI 类字段的 setter，使其直接在领域对象中设置新值。注意确保值不会通过领域类的\
    \ setter 设置——否则会导致无限递归。\n\n## 实现的设计模式\n\n观察者 (Observer)\n\n## 消除的气味\n\n大类 (Large\
    \ Class)\n\n## 将单向关联改为双向关联\n\n## 问题\n\n你有两个类，它们都需要使用对方的功能，但它们之间的关联是单向的。\n\n![](img/a9f2bde5dbae80f6f98fa49ccbde8add_175_0.png)\n\
    \n## 解决方案\n\n向需要的类中添加缺失的关联。\n\n![](img/a9f2bde5dbae80f6f98fa49ccbde8add_175_1.png)\n\
    \n## 为什么要重构\n\n最初类之间是单向关联。随着时间的推移，客户端代码需要访问关联的双方。\n\n## 益处\n\n如果一个类需要反向关联，你可以简单地计算它。但如果这些计算很复杂，最好保留反向关联。\n\
    \n## 缺点\n\n- 双向关联的实现和维护比单向关联困难得多。\n- 双向关联使类产生相互依赖。在单向关联中，其中一个可以独立于另一个使用。\n\n##\
    \ 如何重构\n\n- 1. 添加一个用于持有反向关联的字段。\n- 2. 决定哪个类是“主导的”。该类将包含在添加或更改元素时创建或更新关联的方法，在类类中建立关联并调用工具方法在其他对象中建立关联。\n\
    - 3. 如果“非主导”类用于其他用途，则为其创建一个建立关联的方法。\n- 4. 如果控制关联的旧方法在“主导”类中，请通过对关联对象的调用来补充它们。\n\
    - 5. 如果控制关联的旧方法在“非主导”类中，则在“主导”类中创建它们并委托给关联对象。\n\n## 反重构\n\n### 将双向关联改为单向关联\n\n\
    ## 将双向关联改为单向关联\n\n## 问题\n\n类之间存在双向关联，但其中一个类并没有使用这些功能。\n\n![](img/a9f2bde5dbae80f6f98fa49ccbde8add_178_0.png)\n\
    \n## 解决方案\n\n移除未使用的关联。\n\n![](img/a9f2bde5dbae80f6f98fa49ccbde8add_178_1.png)\n\
    \n## 为什么要重构\n\n双向关联通常比单向关联更维护，需要额外的代码来创建和删除对象。这使得程序变得复杂。\n\n此外，不当的双向关联会导致垃圾回收问题（从而导致未使用对象的内存膨胀）。\n\
    \n例如：垃圾回收器从内存中移除不再被其他对象引用的对象。假设对象对 `User - Order` 被创建、使用并丢弃。由于它们互相引用，这些对象无法从内存中清除。由于编程语言的进步，这个问题变得不再重要，因为它们现在可以自动识别未使用的对象引用并将其从内存中移除。\n\
    \n还有类之间的相互依赖问题。在双向关联中，两个类必须互相感知，这意味着它们不能单独使用。如果存在许多此类关联，程序的不同部分将过度依赖，任何组件的更改可能会影响其他组件。\n\
    \n## 益处\n\n- 简化不需要关系的类。代码越少，维护工作越少。\n- 减少类之间的依赖。独立的类更容易维护，因为对类的任何更改只会影响该类本身。\n\
    \n## 如何重构\n\n- 1. 确保你的类满足以下情况之一：\n  - 没有使用关联。\n  - 有其他获取关联对象的方法，例如通过数据库查询。\n \
    \ - 关联对象可以作为参数传递给使用它的方法。\n- 2. 根据你的情况，使用包含关联对象的字段的使用应替换为参数或以另一种方式获取对象的方法调用。\n\
    - 3. 删除将关联对象赋值给字段的代码。\n- 4. 删除现在不再使用的字段。\n"
