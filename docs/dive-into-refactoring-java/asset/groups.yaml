    +   2. Create the same field with access methods in the recipient class.


    +   3. Decide how you will refer to the recipient class. You may already have
    a field or method that returns the appropriate object; if not, you will need to
    write a new method or field to store the object of the recipient class.


    +   4. Replace all references to the old field with appropriate calls to methods
    in the recipient class. If the field isn''t private, take care of this in the
    superclass and subclasses.


    +   5. Delete the field in the original class.


