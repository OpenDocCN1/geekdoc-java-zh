    +   4. Create a protected superclass constructor for initializing the new fields.


    +   5. Create or modify the existing subclass constructors so that they call the
    new constructor of the parent class and pass the relevant values to it.


    +   6. Implement each constant method in the parent class so that it returns the
    value of the corresponding field. Then remove the method from the subclass.'
  - '[PAGE 212]


    7. If the subclass constructor has additional functionality, use Inline Method
    to incorporate the constructor into the super-class factory method.


    8. Delete the subclass.


