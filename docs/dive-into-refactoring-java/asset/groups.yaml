    # Push Down Field\n\n**Problem:** Is a field used in few subclasses?\n\n**Solution:**\
    \ Move the field to subclasses.\n\n# Extract Subclass\n\n**Problem:** A class\
    \ has features that are used only in certain cases.\n\n**Solution:** Create a\
    \ subclass and use it in these cases.\n\n# Extract Superclass\n\n**Problem:**\
    \ You have two classes with common fields and methods.\n\n**Solution:** Create\
    \ a shared superclass for them and move all the fields and methods to it.\n\n\
    # Extract Interface\n\n**Problem:** Multiple clients are using the same part of\
    \ a class. Another case: part of the interface in two classes is the same.\n\n\
    **Solution:** Move this identical portion to its own interface.\n\n# Collapse\
