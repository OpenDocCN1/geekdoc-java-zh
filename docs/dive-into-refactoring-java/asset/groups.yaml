  - '[PAGE 104]


    # Split Temporary Variable


    Problem


    You have a local variable that''s used to store various intermediate values inside
    a method (except for cycle variables).


    ```

    double temp = 2 * (height + width);

    System.out.println(temp);

    temp = height * width;

    System.out.println(temp);

    ```


    # Solution


    Use different variables for different values. Each variable should be responsible
    for only one particular thing.


    ```

    final double perimeter = 2 * (height + width);

    System.out.println(perimeter);

    final double area = height * width;

    System.out.println(area);

    ```'
  - '[PAGE 105]


    # Why Refactor


    If you''re skimming on the number of variables inside a function and reusing them
    for various unrelated purposes, you''re sure to encounter problems as soon as
    you need to make changes to the code containing the variables. You will have to
    recheck each case of variable use to make sure that the correct values are used.


    # Benefits


    +   - Each component of the program code should be responsible for one and one
    thing only. This makes it much easier to maintain the code, since you can easily
    replace any particular thing without fear of unintended effects.


    +   - Code becomes more readable. If a variable was created long ago in a rush,
    it probably has a name that doesn''t explain anything: `k`, `a2`, `value`, etc.
    But you can fix this situation by naming the new variables in an understandable,
    self-explanatory way. Such names might resemble `customerValue`, `cityUnemploymentRate`,
    `clientSalutationString` and the like.


    +   - This refactoring technique is useful if you anticipate using `Extract Method`
    later.'
- md: "\n## How to Refactor\n\n1. Find the first place in the code where the variable\
    \ is given a value. Here you should rename the variable with a name that corresponds\
    \ to the value being assigned.\n2. Use the new name instead of the old one in\
    \ places where this value of the variable is used.\n3. Repeat as needed for places\
    \ where the variable is assigned a different value.\n\n## Anti-refactoring\n\n\
    ### Inline Temp\n\n## Similar refactorings\n\n### Extract Variable\n\n### Remove\
    \ Assignments to Parameters\n\n## Helps other refactorings\n\n### Extract Method\n\
    \n## Remove Assignments to Parameters\n\n### Problem\n\nSome value is assigned\
    \ to a parameter inside method's body.\n\n```java\nint discount(int inputVal,\
    \ int quantity) {\n  if (inputVal > 50) {\n    inputVal -= 2;\n  }\n  // ...\n\
    }\n```\n\n### Solution\n\nUse a local variable instead of a parameter.\n\n```java\n\
    int discount(int inputVal, int quantity) {\n  int result = inputVal;\n  if (inputVal\
    \ > 50) {\n    result -= 2;\n```}\n5 {}\n6 // ...\n7 }\n```\n\n## Why Refactor\n\
    \nThe reasons for this refactoring are the same as for Split Temporary Variable,\
    \ but in this case we're dealing with a parameter, not a local variable.\n\nFirst,\
    \ if a parameter is passed via reference, then after the parameter value is changed\
    \ inside the method, this value is passed to the argument that requested calling\
    \ this method. Very often, this occurs accidentally and leads to unfortunate effects.\
    \ Even if parameters are usually passed by value (and not by reference) in your\
    \ programming language, this coding quirk may alienate those who are unaccustomed\
    \ to it.\n\nSecond, multiple assignments of different values to a single parameter\
    \ make it difficult for you to know what data should be contained in the parameter\
    \ at any particular point in time. The problem worsens if your parameter and its\
    \ contents are documented but the actual value is capable of differing from what's\
    \ expected inside the method.\n\n## Benefits\n\n- Each element of the program\
    \ should be responsible for only one thing. This makes code maintenance much easier\
    \ going forward, since you can safely replace code without any side effects.\n\
    - This refactoring helps to extract repetitive code to separate methods.\n\n##\
    \ How to Refactor\n\n1. Create a local variable and assign the initial value of\
    \ your parameter.\n2. In all method code that follows this line, replace the parameter\
    \ with your new local variable.\n\n## Similar refactorings\n\n- Split Temporary\
    \ Variable\n\n## Helps other refactorings\n\n- Extract Method\n\n## Replace Method\
    \ with Method Object\n\n### Problem\n\nYou have a long method in which the local\
    \ variables are so intertwined that you can't apply Extract Method.\n\n```java\n\
    class Order {\n  // ...\n  public double price() {\n    double primaryBasePrice;\n\
    \    double secondaryBasePrice;\n    double tertiaryBasePrice;\n    // Perform\
    \ long computation.\n  }\n}\n```\n\n### Solution\n\nTransform the method into\
    \ a separate class so that the local variables become fields of the class. Then\
    \ you can split the method into several methods within the same class.\n\n```java\n\
    class Order {\n    // ...\n    public double price() {\n        return new PriceCalculator(this).compute();\n\
    \    }\n}\n```\n\n```java\nclass PriceCalculator {\n    private double primaryBasePrice;\n\
    \    private double secondaryBasePrice;\n    private double tertiaryBasePrice;\n\
    \n    public PriceCalculator(Order order) {\n        // initialization\n    }\n\
    \n    public double compute() {\n        // Perform long computation.\n    }\n\
    }\n```\n\n## Why Refactor\n\nA method is too long and you can't split it due to\
    \ tangled variables. The first step is to isolate the method into its own class.\
    \ Then you can split the method into several smaller methods.\n\n## Refactoring\
    \ Techniques / Replace Method with Method Object\n\nEven if you have distributed\
    \ functionality among different classes in a less-than-perfect way, there's still\
    \ hope. These refactoring techniques show how to safely move functionality between\
    \ classes, create new classes, and hide implementation details from public access.\n\
    \n### Benefits\n\nIsolating the method into its own class allows splitting the\
    \ method into smaller ones, without polluting the original class.\n\n### Drawbacks\n\
    \nAnother class is added, increasing the overall complexity.\n\n## How to Refactor\n\
    \n1. Create a new class.\n2. In the original class, replace the method with a\
