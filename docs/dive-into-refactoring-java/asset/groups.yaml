    ![](img/a9f2bde5dbae80f6f98fa49ccbde8add_157_0.png)'
  - '[PAGE 158]


    # Why Refactor


    This refactoring is basically a special case of **Extract Class**. What makes
    it different is the cause of the refactoring.


    In **Extract Class**, we have a single class that''s no longer so simple different
    things and we want to split up its responsibilities.


    With replacement of a data value with an object, we have a primitive field (number,
    string, etc) that simple due to growth of the program and now has associated data
    and behaviors. On the one hand, there''s nothing scary about these fields in and
    of themselves. However, this fields-and-behaviors family can be present in several
    classes simultaneously, creating duplicate code.


    Therefore, for all this we create a new class and move both the field and the
    related data and behaviors to it.


    # Benefits


    Improves relatedness inside classes. Data and the relevant behaviors are inside
    a single class.


    # How to Refactor


    Before you begin with refactoring, see if there are direct references to the field
    from within the class. If so, use **Self Encapsulate Field** in order to hide
    it in the original class.'
  - '[PAGE 159]


    +   1. Create a new class and copy your field and relevant getter to it. In addition,
    create a constructor that accepts the simple value of the field. This class won''t
    have a setter since each new field value that''s sent to the original class will
    create a new value object.


    +   2. In the original class, change the field type to the new class.


    +   3. In the getter in the original class, invoke the getter of the associated
    object.


    +   4. In the setter, create a new value object. You may need to also create a
    new object in the constructor if initial values had been set there for the field
    previously.


    # Next Steps


    After applying this refactoring technique, it''s wise to apply Change Value to
    Reference on the field that contains the object. This allows storing a reference
    to a single object that corresponds to a value instead of storing dozens of objects
    for one and the same value.


    Most often this approach is needed when you want to have one object responsible
    for one real-world object (such as users, orders, documents and so forth). At
    the same time, this approach won''t be useful for objects such as dates, money,
    ranges, etc.'
  - '[PAGE 160]


    # Similar refactorings


    +   - Extract Class

    - Introduce Parameter Object

    - Replace Array with Object

    - Replace Method with Method Object


    Does the same with method''s code.


    # Eliminates smell


    +   - Duplicate Code'
  - '[PAGE 161]


    # Change Value to Reference


    Problem


    So you have many identical instances of a single class that you need to replace
    with a single object.


    ![](img/a9f2bde5dbae80f6f98fa49ccbde8add_161_0.png)


    Solution


    Convert the identical objects to a single reference object.


    ![](img/a9f2bde5dbae80f6f98fa49ccbde8add_161_1.png)


    Why Refactor


    In many systems, objects can be classified as either values or references.'
  - '[PAGE 162]


    +   **References**: when one real-world object corresponds to only one object
    in the program. References are usually user/order/product/etc. objects.


    +   **Values**: one real-world object corresponds to multiple objects in the program.
    These objects could be dates, phone numbers, addresses, colors, and the like.


    The selection of reference vs. value isn’t always clear-cut. Sometimes there’s
    a simple value with a small amount of unchanging data. Then it becomes necessary
    to add changeable data and pass these changes every time the object is accessed.
    In this case it becomes necessary to convert it to a reference.


    # Benefits


    An object contains all the most current information about a particular entity.
    If the object is changed in one part of the program, these changes are accessible
    from the other parts of the program that make use of the object.


    # Drawbacks


    References are much harder to implement.'
  - '[PAGE 163]


    # How to Refactor


    +   1. Use Replace Constructor with Factory Method on the class from which the
    references are to be generated.


    +   2. Determine which object will be responsible for providing access to references.
    Instead of creating a new object, when you need one now you need to get it from
    a storage object or static dictionary field.


    +   3. Determine whether references will be created in advance dynamically as
    necessary. If objects are created in advance, make sure to load them before use.


    +   4. Change the factory method so that it returns a reference. If objects are
    created in advance, decide how to handle errors when a non-existent object is
    requested. You may also need to use Rename Method to inform that the method returns
    only existing objects.


    # Anti-refactoring


    § Change Reference to Value'
  - '[PAGE 164]


    # Change Reference to Value


    Problem


    You have a reference object that''s too small and infrequently changed to justify
    managing its life cycle.


    ![](img/a9f2bde5dbae80f6f98fa49ccbde8add_164_0.png)


    Solution


    Turn it into a value object.


    ![](img/a9f2bde5dbae80f6f98fa49ccbde8add_164_1.png)'
  - '[PAGE 165]


    # Why Refactor


    Inspiration to switch from a reference to a value may come from the inconvenience
    of working with the reference. References require management on your part:


    +   - They always require requesting the necessary object from storage.


    +   - References in memory may be inconvenient to work with.


    +   - Working with references is particularly difficult, compared to values, on
    distributed and parallel systems.


    Values are especially useful if you would rather unchangeable objects than objects
    whose state may change during their lifetime.


    # Benefits


    +   - One important property of objects is that they should be unchangeable. The
    same result should be received for each query that returns an object value. If
    this is true, no problems arise if there are many objects representing the same
    thing.


    +   - Values are much easier to implement.'
  - '[PAGE 166]


    # Drawbacks


    If a value is changeable, make sure if any object changes the values in all the
    other objects representing the same entity are updated. This is so burdensome
    that it''s easier to create a reference for this purpose.


    # How to Refactor


    +   1. Make the object unchanging. The object shouldn’t have any setters or other
    methods that change its state and data (Remove Setting Method) may help here.
    The only place where data should be assigned to the fields of a value object is
    a constructor.


    +   2. Create a comparison method to be able to compare two values.


    +   3. Check whether you can delete the factory method and make the object constructor
    public.


    # Anti-refactoring


    § Change Value to Reference'
  - '[PAGE 167]


    # Replace Array with Object


    > This refactoring technique is a special case of Replace Data Value with Object.


    # Problem


    You have an array that contains various types of data.


    ```

    String[] row = new String[2];

    row[0] = "Liverpool";

    row[1] = "15";

    ```


    # Solution


    Replace the array with an object that will have separate fields for each element.
    row


    ```

    Performance row = new Performance();

    row.setName("Liverpool");

    row.setWins("15");

    ```'
  - '[PAGE 168]


    # Why Refactor


    Arrays are an excellent tool for storing data and collections of a single type.
    But if you use an array like post office boxes, storing the username in box 1
    and the user’s address in box 14, you will someday be very unhappy that you did.
    This approach leads to catastrophic failures when somebody puts something in the
    wrong “box” and also requires your time for figuring out which data is stored
    where.


    # Benefits


    +   - In the resulting class, you can place all associated behaviors that had
    been previously stored in the main class or elsewhere.


    +   - The fields of a class are much easier to document than the elements of an
    array.


    # How to Refactor


    +   1. Create the new class that will contain the data from the array. Place the
    array itself in the class as a public field.


    +   2. Create a field for storing the object of this class in the original class.
    Don’t forget to also create the object itself in the place where you initiated
    the data array.


    +   3. In the new class, create access methods one by one for each of the array
    elements. Give them self-explanatory names for that'
