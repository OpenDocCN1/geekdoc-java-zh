    field values are easily implemented inside field getters and setters.


    +   - Second and more crucially, you can redefine getters and setters in subclasses.


    You have the option of not implementing a setter for a field at all. The field
    value will be specified only in the constructor, thus making the field unchangeable
    throughout the entire object lifespan.


    # Drawbacks


    When direct access to fields is used, code looks simpler and more presentable,
    although flexibility is diminished.


    # How to Refactor


    +   1. Create a getter (and optional setter) for the field. They should be either
    protected or public.


    +   2. Find all invocations of the field and replace them with getter and setter
    calls.


