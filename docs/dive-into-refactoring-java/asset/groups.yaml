  - '[PAGE 213]


    # Simplifying Conditional Expressions


    Conditionals tend to get more and more complicated in their logic over time, and
    there are yet more techniques to combat this as well.


    # Decompose Conditional


    **Problem:** You have a complex conditional ( if-then / else switch ).


    **Solution:** Decompose the complicated parts of the conditional into separate
    methods: the condition, then and else.


    # Consolidate Conditional Expression


    **Problem:** You have multiple conditionals that lead to the same result or action.


    **Solution:** Consolidate all these conditionals in a single expression.


    # Consolidate Duplicate Conditional Fragments


    **Problem:** Identical code can be found in all branches of a conditional.


    **Solution:** Move the code outside of the conditional.'
  - '[PAGE 214]


    # Remove Control Flag


    **Problem:** You have a boolean variable that acts as a control flag for multiple
    boolean expressions.


    **Solution:** Instead of the variable, use `break`, `continue` and `return`.


    # Replace Nested Conditional with Guard Clauses


    **Problem:** You have a group of nested conditionals and it’s hard to determine
    the normal flow of code execution.


    **Solution:** Isolate all special checks and edge cases into separate clauses
    and place them before the main checks. Ideally, you should have a “flat” list
    of conditionals, one after the other.


    # Replace Conditional with Polymorphism


    **Problem:** You have a conditional that performs various actions depending on
    object type or properties.


    **Solution:** Create subclasses matching the branches of the conditional. In them,
    create a shared method and move code from the corresponding branch of the conditional
    to it. Then replace the conditional with the relevant method call. The result
    is that the proper implementation will be attained via polymorphism depending
    on the object class.


    # Introduce Null Object


    **Problem:** Since some methods return `null` instead of real objects, you have
    many checks for `null` in your code.'
  - '[PAGE 215]


    **Solution**: Instead of null , return a null object that exhibits the default
    behavior.


    # Introduce Assertion


    **Problem**: For a portion of code to work correctly, certain conditions or values
    must be true.


    **Solution**: Replace these assumptions with specific assertion checks.'
- md: "\n## Decompose Conditional\n\n### Problem\n\nYou have a complex conditional\
    \ (if-then / else or switch).\n\n```\nif (date.before(SUMMER_START) || date.after(SUMMER_END))\
    \ {\n  charge = quantity * winterRate + winterServiceCharge;\n}\nelse {\n  charge\
    \ = quantity * summerRate;\n}\n```\n\n### Solution\n\nDecompose the complicated\
    \ parts of the conditional into separate methods: the condition, then and else.\n\
    \n```\nif (isSummer(date)) {\n  charge = summerCharge(quantity);\n}\nelse {\n\
    \  charge = winterCharge(quantity);\n}\n```\n\n## Why Refactor\n\nThe longer a\
    \ piece of code is, the harder it's to understand. Things become even more hard\
    \ to understand when the code is filled with conditions:\n\n- While you're busy\
    \ figuring out what the code in the `then` block does, you forget what the relevant\
    \ condition was.\n- While you're busy parsing `else`, you forget what the code\
    \ in `then` does.\n\n## Benefits\n\n- By extracting conditional code to clearly\
    \ named methods, you make life easier for the person who'll be maintaining the\
    \ code later (such as you, two months from now!).\n- This refactoring technique\
    \ is also applicable for short expressions in conditions. The string `isSalaryDay()`\
    \ is much prettier and more descriptive than code for comparing dates.\n\n## How\
    \ to Refactor\n\n- 1. Extract the conditional to a separate method via **Extract\
    \ Method**.\n- 2. Repeat the process for the `then` and `else` blocks.\n\n## Eliminates\
    \ smell\n\n### Long Method\n\n## Consolidate Conditional Expression\n\n### Problem\n\
    \nYou have multiple condicionals that lead to the same result or action.\n\n```\n\
    double disabilityAmount() {\n  if (seniority < 2) {\n    return 0;\n  }\n  if\
    \ (monthsDisabled > 12) {\n    return 0;\n  }\n  if (isPartTime) {\n    return\
    \ 0;\n  }\n  // Compute the disability amount.\n  // ...\n}\n```\n\n### Solution\n\
    \nConsolidate all these condicionals in a single expression.\n\n```\ndouble disabilityAmount()\
    \ {\n  if (isNotEligibleForDisability()) {\n    return 0;\n  } // Compute the\
    \ disability amount.\n  // ...\n}\n```\n\n## Why Refactor\n\nYour code contains\
    \ many alternating operators that perform identical actions. It isn’t clear why\
    \ the operators are split up.\n\nThe main purpose of consolidation is to extract\
    \ the conditional to a separate method for greater clarity.\n\n## Benefits\n\n\
    - Eliminates duplicate control flow code. Combining multiple conditionals that\
    \ have the same “destination” helps to show that you’re doing only one complicated\
    \ check leading to one action.\n\nBy consolidating all operators, you can now\
    \ isolate this complex expression in a new method with a name that explains the\
    \ conditional’s purpose.\n\n## How to Refactor\n\nBefore refactoring, make sure\
    \ that the conditionals don’t have any \"side effects\" or otherwise modify something,\
    \ instead of simply returning values. Side effects may be hiding in the code executed\
    \ inside the operator itself, such as when something is added to a variable based\
    \ on the results of a conditional.\n\n- 1. Consolidate the conditionals in a single\
    \ expression by using `and` and `or`. As a general rule when consolidating:\n\
    \    - Nested conditionals are joined using `and`.\n    - Consecutive conditionals\
    \ are joined with `or`.\n- 2. Perform Extract Method on the operator conditions\
    \ and give the method a name that reflects the expression’s purpose.\n\n## Eliminate\
    \ smell\n\n### Duplicate Code\n\n## Consolidate Duplicate Conditional Fragments\n\
    \n### Problem\n\nIdentical code can be found in all branches of a conditional.\n\
    \n```\nif (isSpecialDeal()) {\n    total = price * 0.95;\n    send();\n}\nelse\
    \ {\n    total = price * 0.98;\n    send();\n}\n```\n\n### Solution\n\nMove the\
    \ code outside of the conditional.\n\n```\nif (isSpecialDeal()) {\n    total =\
    \ price * 0.95;\n}\nelse {\n    total = price * 0.98;\n}\nsend();\n```\n\n## Why\
    \ Refactor\n\nDuplicate code is found inside all branches of a conditional, often\
    \ as the result of evolution of the code within the conditional branches. Team\
    \ development can be a contributing factor to this.\n\n## Benefits\n\nCode deduplication.\n\
    \n## How to Refactor\n\n- 1. If the duplicated code is at the beginning of the\
    \ conditional branches, move the code to a place before the conditional.\n- 2.\
    \ If the code is executed at the end of the branches, place it after the conditional.\n\
    - 3. If the duplicate code is randomly situated inside the branches, first try\
    \ to move the code to the beginning or end of the branch, depending on whether\
    \ it changes the result of the subsequent code.\n- 4. If appropriate and the duplicate\
    \ code is longer than one line, try using **Extract Method**.\n\n## Eliminates\
    \ smell\n\n### Duplicate Code\n\n## Remove Control Flag\n\n### Problem\n\nYou\
    \ have a boolean variable that acts as a control flag for multiple boolean expressions.\n\
    \n### Solution\n\nInstead of the variable, use `break`, `continue` and `return`.\n\
    \n## Why Refactor\n\nControl flags date back to the days of yore, when \"proper\"\
    \ programmers always had one entry point for their functions (the function declaration\
    \ line) and one exit point (at the very end of the function).\n\nIn modern programming\
    \ languages this style is obsolete, since we have special operators for modifying\
    \ the control flow in loops and other complex constructions:\n\n- break : stops\
    \ loop\n- continue : stops iteration\n- return : stops function\n\n## Benefits\n\
    \nControl flag code is often much ponderous than code with control operators.\n\
    \n## How to Refactor\n\n- 1. Find the control flag assignment that causes the\
    \ exit from loop.\n- 2. Replace it with `break`, if this is an exit from loop;\
    \ `continue`, if this is an exit from iteration; or `return`, if you need to return\
    \ value.\n- 3. Remove the remaining code associated with control flag.\n\n## Replace\
    \ Nested Conditional with Guard Clauses\n\n### Problem\n\nYou have a group of\
    \ nested conditionals and it's hard to determine the normal flow of code execution.\n\
    \n```\npublic double getPayAmount() {\n    double result;\n    if (isDead){\n\
    \        result = deadAmount();\n    }\n    else {\n        if (isSeparated){\n\
    \            result = separatedAmount();\n        }\n        else {\n        \
    \    if (isRetired){\n                result = retiredAmount();\n            }\n\
    \            else {\n                result = normalPayAmount();\n           \
    \ }\n        }\n    }\n    return result;\n}\n```\n\n### Solution\n\nIsolate all\
    \ special checks and edge cases into separate clauses and place them before the\
    \ main checks. Ideally, you should have a “flat” list of conditionals, one after\
    \ the other.\n\n```\npublic double getPayAmount() {\nif (isDead){\n    return\
    \ deadAmount();\n}\nif (isSeparated){\n    return separatedAmount();\n}\nif (isRetired){\n\
    \    return retiredAmount();\n}\nreturn normalPayAmount();\n}\n```\n\n## Why Refactor\n\
    \nSpotting the “conditional from hell” is fairly easy. The indentations of each\
    \ level of nestedness form an arrow, pointing to the right in the direction of\
    \ pain and woe:\n\n```\nif () {\n  if () {\n    do {\n      if () {\n        if\
    \ () {\n          if () {\n            ...\n          }\n        }\n      }\n\
    \      ...\n    }\n  } while ();\n  ...\n}\nelse {\n  ...\n}\n```\n\nIt’s difficult\
    \ to figure out what each conditional does and how, since the \"normal\" flow\
    \ of code execution isn’t immediately obvious. These conditionals indicate helter-skelter\
    \ evolution, with each condition added as a stopgap measure without any thought\
    \ paid to optimizing the overall structure.\n\nTo simplify the situation, isolate\
    \ the special cases into separate conditions that immediately end execution and\
    \ return a null value if the guard clauses are true.\n\n## How to Refactor\n\n\
    Try to rid of the code of side effects – **Separate Query from Modifier** may\
    \ be helpful for the purpose.\n\n- 1. Isolate all guard clauses that lead to calling\
    \ an exception or immediate return of a value from the method. Place these conditions\
    \ at the beginning of the method.\n- 2. After rearrangement is complete and all\
    \ tests are successfully completed, see whether you can use **Consolidate Conditional\
    \ Expression** for guard clauses that lead to the same exceptions or returned\
    \ values.\n"
  mdcn: "\n\n## 分解条件 (Decompose Conditional)\n\n### 问题\n\n你有一个复杂的条件判断（if-then / else\
    \ 或 switch）。\n\n```\nif (date.before(SUMMER_START) || date.after(SUMMER_END))\
    \ {\n  charge = quantity * winterRate + winterServiceCharge;\n}\nelse {\n  charge\
    \ = quantity * summerRate;\n}\n```\n\n### 解决方案\n\n将条件的复杂部分分解为独立的方法：条件、then 块和\
    \ else 块。\n\n```\nif (isSummer(date)) {\n  charge = summerCharge(quantity);\n\
    }\nelse {\n  charge = winterCharge(quantity);\n}\n```\n\n## 为什么要重构\n\n代码越长，越难理解。当代码中充满了条件时，理解会变得更加困难：\n\
    \n- 当你忙于弄清楚 `then` 块中代码的作用时，你忘记了相关的条件是什么。\n- 当你忙于解析 `else` 时，你忘记了 `then` 块中代码的作用。\n\
    \n## 益处\n\n- 通过将条件代码提取到命名清晰的方法中，你可以为以后维护代码的人（例如两个月后的你自己！）提供便利。\n- 这种重构技术也适用于条件中的短表达式。字符串\
    \ `isSalaryDay()` 比比较日期的代码要漂亮得多且更具描述性。\n\n## 如何重构\n\n- 1. 通过**提取方法 (Extract Method)**\
    \ 将条件提取到独立的方法中。\n- 2. 对 `then` 和 `else` 块重复此过程。\n\n## 消除异味\n\n### 长方法 (Long Method)\n\
    \n## 合并条件表达式 (Consolidate Conditional Expression)\n\n### 问题\n\n你有多个通向相同结果或动作的条件。\n\
    \n```\ndouble disabilityAmount() {\n  if (seniority < 2) {\n    return 0;\n  }\n\
    \  if (monthsDisabled > 12) {\n    return 0;\n  }\n  if (isPartTime) {\n    return\
    \ 0;\n  }\n  // 计算残障金额。\n  // ...\n}\n```\n\n### 解决方案\n\n将所有这些条件合并到一个表达式中。\n\n\
    ```\ndouble disabilityAmount() {\n  if (isNotEligibleForDisability()) {\n    return\
    \ 0;\n  } // 计算残障金额。\n  // ...\n}\n```\n\n## 为什么要重构\n\n你的代码包含许多执行相同动作的交替运算符。并不清楚为什么这些运算符被分开了。\n\
    \n合并的主要目的是将条件提取到独立的方法中，以提高清晰度。\n\n## 益处\n\n- 消除重复的控制流代码。合并多个具有相同“目的地”的条件，有助于显示你只进行了一次指向某个动作的复杂检查。\n\
    \n通过合并所有运算符，你现在可以将这个复杂的表达式隔离在一个新方法中，并用一个解释条件目的名称命名。\n\n## 如何重构\n\n在重构之前，确保条件没有任何“副作用”或修改某些内容，而只是简单地返回值。副作用可能隐藏在运算符内部执行的代码中，例如根据条件的结果向变量添加某些内容。\n\
    \n- 1. 使用 `and` 和 `or` 将条件合并到一个表达式中。合并时的一般规则是：\n    - 嵌套条件使用 `and` 连接。\n    -\
    \ 连续的条件使用 `or` 连接。\n- 2. 对运算符条件执行**提取方法**，并给方法起一个反映表达式目的的名字。\n\n## 消除异味\n\n###\
    \ 重复代码 (Duplicate Code)\n\n## 合并重复条件片段 (Consolidate Duplicate Conditional Fragments)\n\
    \n### 问题\n\n在条件的所有分支中都可以找到相同的代码。\n\n```\nif (isSpecialDeal()) {\n    total = price\
    \ * 0.95;\n    send();\n}\nelse {\n    total = price * 0.98;\n    send();\n}\n\
    ```\n\n### 解决方案\n\n将代码移动到条件之外。\n\n```\nif (isSpecialDeal()) {\n    total = price\
    \ * 0.95;\n}\nelse {\n    total = price * 0.98;\n}\nsend();\n```\n\n## 为什么要重构\n\
    \n在条件的所有分支中发现了重复代码，这通常是分支内代码演化的结果。团队开发可能是导致因素。\n\n## 益处\n\n代码去重。\n\n## 如何重构\n\n\
    - 1. 如果重复代码位于条件分支的开头，将代码移动到条件之前。\n- 2. 如果代码在分支末尾执行，将其放置在条件之后。\n- 3. 如果重复代码随机位于分支内部，首先尝试将代码移动到分支的开头或末尾，取决于它是否会改变后续代码的结果。\n\
    - 4. 如果合适且重复代码超过一行，请尝试使用**提取方法**。\n\n## 消除异味\n\n### 重复代码 (Duplicate Code)\n\n\
    ## 移除控制标志 (Remove Control Flag)\n\n### 问题\n\n你有一个布尔变量，作为多个布尔表达式的控制标志。\n\n### 解决方案\n\
    \n不要使用变量，而是使用 `break`、`continue` 和 `return`。\n\n## 为什么要重构\n\n控制标志可以追溯到过去，那时“正规”程序员总是为他们的函数只有一个入口点（函数声明行）和一个出口点（在函数的末尾）。\n\
    \n在现代编程语言中，这种风格已经过时了，因为我们有特殊的运算符来修改循环和其他复杂结构的控制流：\n\n- break：停止循环\n- continue：停止迭代\n\
    - return：停止函数\n\n## 益处\n\n使用控制标志的代码通常比使用控制运算符的代码要臃肿得多。\n\n## 如何重构\n\n- 1. 找到导致退出循环的控制标志赋值。\n\
    - 2. 如果是退出循环，将其替换为 `break`；如果是退出迭代，则替换为 `continue`；如果需要返回值，则替换为 `return`。\n- 3.\
    \ 移除与控制标志相关的剩余代码。\n\n## 用守卫语句替换嵌套条件 (Replace Nested Conditional with Guard Clauses)\n\
    \n### 问题\n\n你有一组嵌套条件，很难确定代码执行的正常流程。\n\n```java\npublic double getPayAmount() {\n\
    \    double result;\n    if (isDead){\n        result = deadAmount();\n    }\n\
    \    else {\n        if (isSeparated){\n            result = separatedAmount();\n\
    \        }\n        else {\n            if (isRetired){\n                result\
    \ = retiredAmount();\n            }\n            else {\n                result\
    \ = normalPayAmount();\n            }\n        }\n    }\n    return result;\n\
    }\n```\n\n### 解决方案\n\n将所有特殊检查和边缘情况隔离到单独语句中，并将它们放在主检查之前。理想情况下，你应该有一个“扁坦”的条件列表，一个接一个。\n\
    \n```java\npublic double getPayAmount() {\nif (isDead){\n    return deadAmount();\n\
    }\nif (isSeparated){\n    return separatedAmount();\n}\nif (isRetired){\n    return\
    \ retiredAmount();\n}\nreturn normalPayAmount();\n}\n```\n\n## 为什么要重构\n\n识别“地狱条件”其实非常容易。每一层嵌套的缩进形成了一个箭头，指向痛苦和灾难的方向：\n\
    \n```\nif () {\n  if () {\n    do {\n      if () {\n        if () {\n        \
    \  if () {\n            ...\n          }\n        }\n      }\n      ...\n    }\n\
    \  } while ();\n  ...\n}\nelse {\n  ...\n}\n```\n\n很难看出每个条件的作用和方式，因为代码执行的“正常”流程并不显而易见。这些条件表明了混乱的进化，每个条件都是作为临时措施添加的，没有考虑优化整体结构。\n\
    \n为了简化情况，将特殊情况隔离到单独条件中，如果守卫语句为真，立即结束执行并返回空值。\n\n## 如何重构\n\n尝试消除副作用——**分离查询与修改\
    \ (Separate Query from Modifier)** 对此有所帮助。\n\n- 1. 将方法中所有导致调用异常或立即返回值的守卫语句隔离出来。将这些条件放在方法的开头。\n\
    - 2. 重排完成后且所有测试成功通过后，查看对于导致相同异常或返回值的守卫语句是否可以使用**合并条件表达式**。\n\n"
