  - '[PAGE 112]


    # Refactoring Techniques / Replace Method with Method Object


    Firstly, this allows isolating the problem at the class level. Secondly, it paves
    the way for splitting a large and unwieldy method into smaller ones that wouldn''t
    fit with the purpose of the original class anyway.


    # Benefits


    Isolating a long method in its own class allows stopping a method from ballooning
    in size. This also allows splitting into submethods within the class, without
    polluting the original class with utility methods.


    # Drawbacks


    Another class is added, increasing the overall complexity of the program.


    # How to Refactor


    +   1. Create a new class. Name it based on the purpose of the method that you''re
    refactoring.


    +   2. In the new class, create a private field for storing a reference to an
    instance of the class in which the method was previously located. It could be
    used to get some required data from the original class if needed.


    +   3. Create a separate private field for each local variable of the method.'
