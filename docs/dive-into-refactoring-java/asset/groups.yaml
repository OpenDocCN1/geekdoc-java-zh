  - '[PAGE 83]


    # Refactoring Techniques


    Refactoring is a controllable process of improving code without creating new functionality.
    It transforms a mess into clean code and simple design.


    ![](img/a9f2bde5dbae80f6f98fa49ccbde8add_83_0.png)


    Clean code is code that is easy to read, write and maintain. Clean code makes
    software development predictable and increases the quality of a resulting product.


    Refactoring techniques describe actual refactoring steps. Most refactoring techniques
    have their pros and cons. Therefore, each refactoring should be properly motivated
    and applied with caution.


    In the previous chapters, you have seen how particular refactorings can help fixing
    problems with code. Now it''s the time to look over the refactoring techniques
    in more detail!'
  - '[PAGE 84]


    # Composing Methods


    Much of refactoring is devoted to correctly composing long methods. In most cases,
    excessively long methods are the root of all evil. The vagaries of code inside
    these methods conceal the execution logic and make the method extremely hard to
    understand – and even harder to change.


    The refactoring techniques in this group streamline methods, remove code duplication,
    and pave the way for future improvements.


    +   § Extract Method


    **Problem:** You have a code fragment that can be grouped together.


    **Solution:** Move this code to a separate new method (or function) and replace
    the old code with a call to the method.


    +   § Inline Method


    **Problem:** When a method body is more obvious than the method itself, use this
    technique.


    **Solution:** Replace calls to the method with the method''s content and delete
    the method itself.


    +   § Extract Variable


    **Problem:** You have an expression that''s hard to understand.'
  - '[PAGE 85]


    Solution: Place the result of the expression or its parts in sep-arate variables
    that are self-explanatory.


    # Inline Temp


    Problem: You have a temporary variable that’s assigned the result of a simple
    expression and nothing more.


    Solution: Replace the references to the variable with the expression itself.


    # Replace Temp with Query


    Problem: You place the result of an expression in a local vari-able for later
    use in your code.


    Solution: Move the entire expression to a separate method and return the result
    from it. Query the method instead of using a variable. Incorporate the new method
    in other meth-ods, if necessary.


    # Split Temporary Variable


    Problem: You have a local variable that’s used to store var-ious intermediate
    values inside a method (except for cycle variables).


    Solution: Use different variables for different values. Each variable should be
    responsible for only one particular thing.


    # Remove Assignments to Parameters


    Problem: Some value is assigned to a parameter inside method’s body.'
  - '[PAGE 86]


    **Solution:** Use a local variable instead of a parameter.


    # Replace Method with Method Object


    **Problem:** You have a long method in which the local variables are so intertwined
    that you can''t apply Extract Method.


    **Solution:** Transform the method into a separate class so that the local variables
    become fields of the class. Then you can split the method into several methods
    within the same class.


    # Substitute Algorithm


    **Problem:** So you want to replace an existing algorithm with a new one?


    **Solution:** Replace the body of the method that implements the algorithm with
    a new algorithm.'
