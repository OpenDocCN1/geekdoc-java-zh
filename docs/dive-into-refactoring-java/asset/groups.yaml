    ## Replace Type Code with Class


    **What’s type code?** Type code occurs when, instead of a separate data type,
    you have a set of numbers or strings that form a list of allowable values for
    some entity. Often these specific numbers and strings are given understandable
    names via constants, which is the reason for why such type code is encountered
    so much.


    ## Problem


    A class has a field that contains type code. The values of this type aren’t used
    in operator conditions and don’t affect the behavior of the program.


    | Person |

    | :--- |

    | O: int |

    | A: int |

    | B: int |

    | AB: bloodgroup: int |


    ## Solution


    Create a new class and use its objects instead of the type code values.


    ![](img/a9f2bde5dbae80f6f98fa49ccbde8add_195_0.png)


    ## Why Refactor


    One of the most common reasons for type code is working with databases, when a
    database has fields in which some complex concept is coded with a number or string.


    For example, you have the class User with the field user_role, which contains
    information about the access privileges of each user, administrator, editor, or
    ordinary user. So in this case, this information is coded in the field A, E, and
    U respectively.


    What are the shortcomings of this approach? The field setters often don''t check
    which value is sent, which can cause big problems when someone sends unintended
    or wrong values to these fields.


    In addition, type verification is impossible for these fields. It’s possible to
    send any number or string to them, which won’t be type checked by your IDE and
    even allow your program to run (and crash later).


    ## Benefits


    - We want to turn sets of primitive values – which is coded types are – into full-fledged
    classes with all the benefits that object-oriented programming has to offer.

    - By replacing type code with classes, we allow type hinting for values passed
    to methods and fields at the level of the programming language.


    For example, while the compiler previously didn’t see difference between your
    numeric constant and some arbitrary number when a value is passed to a method,
    now when data that doesn’t fit the indicated type class is passed, you’re warned
    of the error inside your IDE.


    Thus we make it possible to move code to the classes of the type. If you needed
    to perform complex manipulations with type values throughout the whole program,
    now this code can “live” inside one or multiple type classes.


    ## When Not to Use


    If the values of a coded type are used inside control flow structures (if, switch,
    etc.) and control a class behavior, you should use one of the two refactoring
    techniques for type code:


    - Replace Type Code with Subclasses

    - Replace Type Code with State/Strategy


    ## How to Refactor


    - 1. Create a new class and give it a new name that corresponds to the purpose
    of the coded type. Here we''ll call it *type* class.

    - 2. Copy the field containing type code to the *type* class and make it private.
    Then create a getter for the field. A value will be set for this field only from
    the constructor.

    - 3. For each value of the coded type, create a static method in *type* class.
    It''ll be creating a new *type* class object corresponding to this value of the
    coded type.

    - 4. In the original class, replace the type of the coded field with type class.
    Create a new object of this type in the constructor as well as in the field setter.
    Change the field getter so that it calls the type class getter.

    - 5. Replace any mentions of values of the coded type with calls of the relevant
    type class static methods.

    - 6. Remove the coded type constants from the original class.


    ## Similar refactorings


    - Replace Type Code with Subclasses

    - Replace Type Code with State/Strategy


    ## Eliminates smell


    - Primitive Obsession


    ## Replace Type Code with Subclasses


    **What''s type code?** Type code occurs when, instead of a separate data type,
    you have a set of numbers or strings that form a list of allowable values for
    some entity. Often these specific numbers and strings are given understandable
    names via constants, which is the reason for why such type code is encountered
    so much.


    ## Problem


    You have a coded type that directly affects program behavior (values of this field
    trigger various code in conditionals).


    | Employee |

    | :--- |

    | ENGINEER: int |

    | SALESMAN: int |

    | type: int |


    ## Solution


    Create subclasses for each value of the coded type. Then extract the relevant
    behaviors from the original class to these subclasses. Replace the control flow
    code with polymorphism.


    ![](img/a9f2bde5dbae80f6f98fa49ccbde8add_200_0.png)


    ## Why Refactor


    This refactoring technique is a more complicated twist on Replace Type Code with
    Class.


    As in the first refactoring method, you have a set of simple values that constitute
    the allowed values for a field. Although these values are often specified as constants
    and have understandable names, their use makes your code error-prone since they''re
    primitives in effect. For example, you have a method that accepts one of these
    values in the parameters. At a certain moment, instead of the constant `USER_TYPE_ADMIN`
    with the value `"ADMIN"`, the method receives the same string in lower case ("admin"),
    which will cause execution of something else that the author (you) didn''t intend.


    We''re dealing with control flow code such as the conditionals if, switch and
    ?. In other words, fields with coded values (such as $user->type === self::USER_TYPE_ADMIN)
    are used inside of the conditions of these operators. If we were to use Replace
    Type Code with Class here, all these control flow constructions would be moved
    to a class responsible for the data type. Ultimately, this would of course create
    a type very similar to the original one, with the same problems as well.


    ## Benefits


    - Delete the control flow code. Instead of a bulky switch in the original class,
    move the code to appropriate subclasses. This improves adherence to the Single
    Responsibility Principle and makes the program more readable in general.

    - If you need to add a new value for a coded type, all you need to do is add a
    new subclass without touching the existing code (cf. the Open/Closed Principle).

    - By replacing type code with classes, we pave the way for type hinting for methods
    and fields at the level of the programming language. This wouldn''t be possible
    using simple numeric or string values contained in a coded type.


    ## When Not to Use


    - This technique isn''t applicable if you already have a class hierarchy. You
    can''t create a dual hierarchy via inheritance in object-oriented programming.
    Still, you can replace type code via composition instead of inheritance. To do
    so, use Replace Type Code with State/Strategy.

    - If the values of type code can change after an object is created, avoid this
    technique. We would have to somehow replace the class of the object itself on
    the fly, which isn''t possible. Still, an alternative in this case too would be
    Replace Type Code with State/Strategy.


    ## How to Refactor


    - Use Self Encapsulate Field to create a getter for the field that contains type
    code.

    - Make the superclass constructor private. Create a static factory method with
    the same parameters as the superclass constructor. It must contain the parameter
    that will be the starting values of the coded type. Depending on this parameter,
    the factory method will create objects of various subclasses. To do so, in its
    code you must create a large conditional but, at least, it''ll be the only one
    when it''s truly necessary; otherwise, subclasses and polymorphism will do.

    - 3. Create a unique subclass for each value of the coded type. In it, redefine
    the getter of the coded type so that it returns the corresponding value of the
    coded type.

    - 4. Delete the field with type code from the superclass. Make its getter abstract.

    - 5. Now that you have subclasses, you can start to move the fields and methods
    from the superclass to corresponding subclasses (with the help of Push Down Field
    and Push Down Method).

    - 6. When everything possible has been moved, use Replace Conditional with Polymorphism
    in order to get rid of conditions that use the type code once and for all.

    '
  mdcn: '


    ## 用类替换类型代码


    **什么是类型代码？** 类型代码出现在以下场景中：你没有使用独立的数据类型，而是使用了一组数字或字符串来构成某些实体的允许取值列表。通常，这些特定的数字和字符串通过常量被赋予了易理解的名称，这也是为什么这种类型代码会频繁出现的原因。


    ## 问题


    一个类包含一个带有类型代码的字段。该类型的值没有在运算符条件中使用，也不会影响程序的行为。


    | 人员 (Person) |

    | :--- |

    | O: int |

    | A: int |

    | B: int |

    | AB: 血型 (bloodgroup): int |


    ## 解决方案


    创建一个类类并使用它的对象代替类型代码值。


    ![](img/a9f2bde5dbae80f6f98fa49ccbde8add_195_0.png)


    ## 为什么要重构


    类型代码最常见的原因之一是与数据库交互，当数据库的字段中某些复杂概念是用数字或字符串编码的时。


    例如，你有一个 `User` 类，其中包含 `user_role` 字段，它包含了每个用户、管理员、编辑或普通用户的访问权限信息。因此，在这种情况下，这些信息分别被编码在字段
    A、E 和 U 中。


    这种方法的缺点是什么？字段的设置器（setters）通常不会检查发送的是哪个值，当有人向这些字段发送非预期的或错误的值时，会导致大问题。


    此外，这些字段无法进行类型验证。你可以向它们发送任何数字或字符串，你的 IDE 不会对其进行类型检查，甚至允许你的程序运行（并在稍后崩溃）。


    ## 益处


    - 我们希望将原始值集合（即编码类型）转换为功能完备的类，利用面向对象编程提供的所有优势。

    - 通过用类替换类型代码，我们可以在编程语言层面为传递给方法和字段的值提供类型提示。


    例如，以前当将值传递给方法时，编译器无法看出你的数值常量和某些任意数字之间的区别；而现在，当传递了不符合指定类型类的数据时，你的 IDE 内部会收到错误警告。


    因此，我们使得将代码移动到类型类中成为可能。如果你需要在整个程序中对类型值进行复杂操作，现在这些代码就可以“存在”于一个或多个类型类中。


    ## 何时不使用


    如果编码类型的值被用于控制流结构（if, switch 等）内部并控制类的行为，那么你应该使用针对类型代码的两种重构技术之一：


    - 用子类替换类型代码

    - 用状态/策略替换类型代码


    ## 如何重构


    - 1. 创建一个新类，并给它一个与编码类型之目的相对应的新名称。在这里我们称之为 *type* 类。

    - 2. 将包含类型代码的字段复制到 *type* 类并将其设为私有。然后为该字段创建一个 getter（getter）。该字段的值仅从构造函数设置。

    - 3. 对于编码类型的每个值，在 *type* 类中创建一个静态方法。它将创建一个与该编码类型值对应的新 *type* 类对象。

    - 4. 在原始类中，将编码字段的类型替换为 *type* 类。在构造函数和字段设置器中也创建一个该类型的新对象。更改字段 getter，使其调用 *type*
    类 getter。

    - 5. 将对编码类型值的所有引用替换对相关 *type* 类静态方法的调用。

    - 6. 从原始类中移除编码类型常量。


    ## 相似的重构


    - 用子类替换类型代码

    - 用状态/策略替换类型代码


    ## 消除味道


    - 原始类型痴迷 (Primitive Obsession)


    ## 用子类替换类型代码


    **什么是类型代码？** 类型代码出现在以下场景中：你没有使用独立的数据类型，而是使用了一组数字或字符串来构成某些实体的允许取值列表。通常，这些特定的数字和字符串通过常量被赋予了易理解的名称，这也是为什么这种类型代码会频繁出现的原因。


    ## 问题


    你有一个编码类型，它被用在控制流结构（if, switch 等）内部并直接控制类的行为。


    | 员工 (Employee) |

    | :--- |

    | 工程师 (ENGINEER): int |

    | 销售员 (SALESMAN): int |

    | 类型 (type): int |


    ## 解决方案


    为编码类型的每个值创建一个子类。将控制流代码提取到这些子类中。用多态替换控制流。


    ![](img/a9f2bde5dbae80f6f98fa49ccbde8add_195_0.png)


    ## 为什么要重构


    这种重构技术是“用类替换类型代码”的一种复杂变体。


    在第一种重构中，你有一组构成实体允许值的简单值。虽然这些值通常以常量形式指定并具有易理解的名称，但使用它们是容易出错的。例如，在某个时刻，你通过字符串 `"admin"`
    来接收这些字段的 own，这并不是作者所预期的。


    ## 益处


    - 删除控制流代码。与其在原始类中使用臃肿的 switch，不如将代码移动到相应的子类中。这提高了对单一职责原则的遵循，并使程序更易读。

    - 如果你需要为编码类型添加新值，只需添加一个新的子类而无需触动现有代码（参见开闭原则）。

    - 通过用类替换类型代码，我们为方法和字段提供了类型提示，这在使用编码类型中的简单数值时是不可能的。


    ## 何时不使用


    - 如果你已经有了类层次结构，则该技术不适用。你无法通过继承创建双重体系。但是，你可以通过组合而不是继承来替换类型代码。要这样做，请使用状态/策略替换类型代码。

    - 如果类型代码的值在对象创建后可以更改，请避免使用这种技术。我们必须动态地替换对象本身，这是不可行的。同样，在这种情况下，替代方案也是状态/策略替换类型代码。


    ## 如何重构


    - 使用自封装字段（Self Encapsulate Field）为包含类型代码的字段创建一个 getter。

    - 将父类构造函数设为私有。创建一个与父类构造函数参数相同的静态工厂方法。它必须包含将作为编码类型初始值的参数。根据此参数，工厂方法将创建各种子类的对象。要这样做，你必须在代码中创建一个巨大的条件，但至少它会在真正需要的地方出现；否则子类和多态就足够。

    - 3. 为编码类型的每个值创建一个唯一的子类。在子类中重写编码类型的 getter，使其返回相应的编码类型值。

    - 4. 从父类中删除类型代码字段。将其 getter 设为抽象方法。

    - 5. 现在你已经有了子类，可以开始将父类中的字段和方法移动到相应的子类中（借助推下字段和推下方法）。

    - 6. 当所有可能的内容都移动完毕后，使用用多态替换条件，以彻底消除使用类型代码的条件。


    '
