    ## Replace Data Value with Object


    ### Problem


    A class (or group of classes) contains a data field. The field has its own behavior
    and associated data.


    | Order |

    | customer: String |


    ### Solution


    Create a new class, place the old field and its its behavior in the class, and
    store the object of the class in the original class.


    ![](img/a9f2bde5dbae80f6f98fa49ccbde8add_157_0.png)


    ## Why Refactor


    This refactoring is basically a special case of **Extract Class**. What makes
    it different is the cause of the refactoring.


    In **Extract Class**, we have a single class that''s no longer so simple, different
    things and we want to split up its responsibilities.


    With replacement of a data value with an object, we have a primitive field (number,
    string, etc) that simple due to growth of the program and now has associated data
    and behaviors. On the one hand, there''s nothing scary about these fields in and
    of themselves. However, this fields-and-behaviors family can be present in several
    classes simultaneously, creating duplicate code.


    Therefore, for all this we create a new class and move both the field and the
    related data and behaviors to it.


    ## Benefits


    Improves relatedness inside classes. Data and the relevant behaviors are inside
    a single class.


    ## How to Refactor


    Before you begin with refactoring, see if there are direct references to the field
    from within the class. If so, use **Self Encapsulate Field** in order to hide
    it in the original class.


    - 1. Create a new class and copy your field and relevant getter to it. In addition,
    create a constructor that accepts the simple value of the field. This class won''t
    have a setter since each new field value that''s sent to the original class will
    create a new value object.

    - 2. In the original class, change the field type to the new class.

    - 3. In the getter in the original class, invoke the getter of the associated
    object.

    - 4. In the setter, create a new value object. You may need to also create a new
    object in the constructor if initial values had been set there for the field previously.


    ## Next Steps


    After applying this refactoring technique, it''s wise to apply Change Value to
    Reference on the field that contains the object. This allows storing a reference
    to a single object that corresponds to a value instead of storing dozens of objects
    for one and the same value.


    Most often this approach is needed when you want to have one object responsible
    for one real-world object (such as users, orders, documents and so forth). At
    the same time, this approach won''t be useful for objects such as dates, money,
    ranges, etc.


    ## Similar refactorings


    - Extract Class

    - Introduce Parameter Object

    - Replace Array with Object

    - Replace Method with Method Object


    Does the same with method''s code.


    ## Eliminates smell


    - Duplicate Code


    ## Change Value to Reference


    ### Problem


    So you have many identical instances of a single class that you need to replace
    with a single object.


    ![](img/a9f2bde5dbae80f6f98fa49ccbde8add_161_0.png)


    ### Solution


    Convert the identical objects to a single reference object.


    ![](img/a9f2bde5dbae80f6f98fa49ccbde8add_161_1.png)


    ### Why Refactor


    In many systems, objects can be classified as either values or references.


    - **References**: when one real-world object corresponds to only one object in
    the program. References are usually user/order/product/etc. objects.

    - **Values**: one real-world object corresponds to multiple objects in the program.
    These objects could be dates, phone numbers, addresses, colors, and the like.


    The selection of reference vs. value isn’t always clear-cut. Sometimes there’s
    a simple value with a small amount of unchanging data. Then it becomes necessary
    to add changeable data and pass these changes every time the object is accessed.
    In this case it becomes necessary to convert it to a reference.


    ### Benefits


    An object contains all the most current information about a particular entity.
    If the object is changed in one part of the program.


    ### Drawbacks


    References are harder to implement.


    ### How to Refactor


    - 1. Convert the reference to value.

    - 2. Determine the reference is needed.

    - 3. Replace the reference with value.

    - 4. Change the value to reference.


