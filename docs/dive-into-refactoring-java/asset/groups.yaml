    +   - Helps you to spot duplication of client code.'
- md: '

    ## Dead Code


    ### Signs and Symptoms


    A variable, parameter, field, method or class is no longer used (usually because
    it''s obsolete).


    ![](img/a9f2bde5dbae80f6f98fa49ccbde8add_63_0.png)


    ### Reasons for the Problem


    When requirements for the software have changed or corrections have been made,
    nobody had time to clean up the old code. Such code could also be found in complex
    conditionals, when one of the branches becomes unreachable (due to error or other
    circumstances).


    ## Treatment


    The quickest way to find dead code is to use a good IDE.


    - Delete unused code and unneeded files.

    - In the case of an unnecessary class, Inline Class or Collapse Hierarchy can
    be applied if a subclass or superclass is used.

    - To remove unneeded parameters, use Remove Parameter.


    ![](img/a9f2bde5dbae80f6f98fa49ccbde8add_64_0.png)


    ## Payoff


    - Reduced code size.

    - Simpler support.


    ## Speculative Generality


    ### Signs and Symptoms


    There’s an unused class, method, field or parameter.


    ![](img/a9f2bde5dbae80f6f98fa49ccbde8add_65_0.png)


    ### Reasons for the Problem


    Sometimes code is created “just in case” to support anticipated future features
    that never get implemented. As a result, code becomes hard to understand and support.


    ## Treatment


    - For removing unused abstract classes, try Collapse Hierarchy.

    - Unnecessary delegation of functionality to another class can be eliminated via
    Inline Class.

    - Unused methods? Use Inline Method to get rid of them.

    - Methods with unused parameters should be given a look with the help of Remove
    Parameter.

    - Unused fields can be simply deleted.


    ![](img/a9f2bde5dbae80f6f98fa49ccbde8add_66_0.png)


    ## Payoff


    - Slimmer code.

    - Easier support.


    ## When to Ignore


    - If you’re working on a framework, it’s eminently reasonable to create functionality
    not used in the framework itself, as long as the functionality is needed by the
    framework’s users.

    - Before deleting elements, make sure that they aren’t used in unit tests. This
    happens if tests need a way to get certain internal information from a class or
    perform special testing-related actions.


    ## Couplers


    All the smells in this group contribute to excessive coupling between classes
    or show what happens if coupling is replaced by excessive delegation.


    ### § Feature Envy


    A method accesses the data of another object more than its own data.


    ### § Inappropriate Intimacy


    One class uses the internal fields and methods of another class.


    ### § Message Chains


    In code you see a series of calls resembling `$a->b()->$c()->$d()`


    ### § Middle Man


    If a class performs only one action, delegating work to another class, why does
    it exist at all?


    ## Feature Envy


    ### Signs and Symptoms


    A method accesses the data of another object more than its own data.


    ![](img/a9f2bde5dbae80f6f98fa49ccbde8add_69_0.png)


    ### Reasons for the Problem


    This smell may occur after fields are moved to a data class. If this is the case,
    you may want to move the operations on data to this class as well.


    ## Treatment


    As a basic rule, if things change at the same time, you should keep them in the
    same place. Usually data and functions that use this data are changed together
    (although exceptions are possible).


    - If a method clearly should be moved to another place, use Move Method.

    - If only part of a method accesses the data of another object, use Extract Method
    to move the part in question.

    - If a method uses functions from several other classes, first determine which
    class contains most of the data used. Then place the method in this class along
    with the other data. Alternatively, use Extract Method to split the method into
    several parts that can be placed in different places in different classes.


    ![](img/a9f2bde5dbae80f6f98fa49ccbde8add_70_0.png)


    ## Payoff


    - Less code duplication (if the data handling code is put in a central-place).

    - Better code organization (methods for handling data are next to the actual data).


    ![](img/a9f2bde5dbae80f6f98fa49ccbde8add_71_0.png)


    ## When to Ignore


    Sometimes behavior is purposefully kept separate from the class that holds the
    data. The usual advantage of this is the ability to dynamically change the behavior
    (see Strategy, Visitor and other patterns).


    ## Inappropriate Intimacy


    ### Signs and Symptoms


    One class uses the internal fields and methods of another class.


    ![](img/a9f2bde5dbae80f6f98fa49ccbde8add_72_0.png)


    ### Reasons for the Problem


    Keep a close eye on classes that spend too much time together. Good classes should
    know as little about each other as possible. Such classes are easier to maintain
    and reuse.


    ## Treatment


    - The simplest solution is to use Move Method and Move Field to move parts of
    one class to the class in which those parts are used. But this works only if the
    first class truly doesn''t need these parts.


    ![](img/a9f2bde5dbae80f6f98fa49ccbde8add_73_0.png)

    - Another solution is to use Extract Class and Hide Delegate on the class to make
    the code relations "official".

    - If the classes are mutually interdependent, you should use Change Bidirectional
    Association to Unidirectional.

    - If this "intimacy" is between a subclass and the superclass, consider Replace
    Delegation with Inheritance.


    ## Payoff


    - Improves code organization.

    - Simplifies support and code reuse.


    ![](img/a9f2bde5dbae80f6f98fa49ccbde8add_74_0.png)


    ## Message Chains


    ### Signs and Symptoms


    In code you see a series of calls resembling `$a->b()->$c()->$d()`


    ![](img/a9f2bde5dbae80f6f98fa49ccbde8add_75_0.png)


    ### Reasons for the Problem


    A message chain occurs when a client requests another object, that object requests
    yet another one, and so on. These chains mean that the client is dependent on
    navigation along the class structure. Any changes in these relationships require
    modifying the client.


    ## Treatment


    - To delete a message chain, use Hide Delegate.

    - Sometimes it''s better to think of why the end object is being used. Perhaps
    it would make sense to use Extract Method for this functionality and move it to
    the beginning of the chain, by using Move Method.


    ![](img/a9f2bde5dbae80f6f98fa49ccbde8add_76_0.png)


    ## Payoff


    - Reduces dependencies between classes of a chain.

    - Reduces the amount of bloated code.


    ![](img/a9f2bde5dbae80f6f98fa49ccbde8add_77_0.png)


    ## When to Ignore


    Overly aggressive delegate can cause code in which it''s hard to see where the
    functionality is actually occurring. Which is another way of saying, avoid the
    **Middle Man** smell as well.


    ## Middle Man


    ### Signs and Symptoms


    If a class performs only one action, delegating work to another class, why does
    it exist at all?


    ![](img/a9f2bde5dbae80f6f98fa49ccbde8add_78_0.png)


    ### Reasons for the Problem


    This smell can be the result of overzealous elimination of Message Chains. In
    other cases, it can be the result of the useful work of a class being gradually
    moved to other classes. The class remains as an empty shell that doesn’t do anything
    other than delegate.


    ## Treatment


    If most of a method''s classes delegate to another class, Remove Middle Man is
    in order.


    ## Payoff


    Less bulky code.


    ![](img/a9f2bde5dbae80f6f98fa49ccbde8add_79_0.png)


    ## When to Ignore


    Don''t delete middle man that have been created for a reason:


    - A middle man may have been added to avoid interclass dependencies.

    - Some design patterns create middle man on purpose (such as Proxy or Decorator).


    ## Other Smells


    Below are the smells which don''t fall into any broad category.


    ## Incomplete Library Class


    Sooner or later, libraries stop meeting user needs. The only solution to the problem
    – changing the library – is often impossible since the library is read-only.


    ## Incomplete Library Class


    ### Signs and Symptoms


    Sooner or later, libraries stop meeting user needs. The only solution to the problem
    - changing the library - is often impossible since the library is read-only.


    ![](img/a9f2bde5dbae80f6f98fa49ccbde8add_81_0.png)


    ### Reasons for the Problem


    The author of the library hasn''t provided the features you need or has refused
    to implement them.

    '
  mdcn: "\n\n## 死代码 (Dead Code)\n\n### 征象与症状\n\n变量、参数、字段、方法或类不再被使用（通常是因为它们已经过时）。\n\
    \n![](img/a9f2bde5dbae80f6f98fa49ccbde8add_63_0.png)\n\n### 问题原因\n\n当软件需求发生变化或进行了修正后，没有人去清理旧代码。此类代码也可能出现在复杂的条件判断中，其中某个分支由于错误或其他情况变得不可触及。\n\
    \n## 救治方法\n\n找到死代码最快的方法是使用一个良好的 IDE。\n\n- 删除未使用的代码和不需要的文件。\n- 对于不需要的类，如果存在被使用的子类或父类，可以使用\
    \ Inline Class（内联类）或 Collapse Hierarchy（折叠层级结构）。\n- 若要移除不需要的参数，请使用 Remove Parameter（移除参数）。\n\
    \n![](img/a9f2bde5dbae80f6f98fa49ccbde8add_64_0.png)\n\n## 收益\n\n- 减小了代码体积。\n\
    - 使得维护更简单。\n\n## 推测性泛化 (Speculative Generality)\n\n### 征象与症状\n\n存在未使用的类、方法、字段或参数。\n\
    \n![](img/a9f2bde5dbae80f6f98fa49ccbde8add_65_0.png)\n\n### 问题原因\n\n有时创建代码是为了“以防万一”，以支持预期的但从未实现的未来功能。结果导致代码变得难以理解和维护。\n\
    \n## 救治方法\n\n- 对于移除未使用的抽象类，可以尝试 Collapse Hierarchy（折叠层级结构）。\n- 可以通过 Inline Class（内联类）消除对另一个类不必要的委托。\n\
    - 未使用的方法？使用 Inline Method（内联方法）来清除它们。\n- 带有未使用参数的方法应该通过 Remove Parameter（移除参数）来检查。\n\
    - 未使用的字段可以直接被删除。\n\n![](img/a9f2bde5dbae80f6f98fa49ccbde8add_66_0.png)\n\n## 收益\n\
    \n- 代码更精简。\n- 更容易维护。\n\n## 何时可以忽略\n\n- 如果你正在开发一个框架，只要该功能是框架用户需要的，那么创建框架本身未使用的功能是完全合理的。\n\
    - 在删除元素之前，确保它们没有在单元测试中使用。这通常发生在测试需要某种方式从类中获取某些内部信息或执行特殊与测试相关的操作时。\n\n## 耦合器 (Couplers)\n\
    \n此组中的所有代码气味都导致了类之间的过度耦合，或者展示了当耦合被过度委托取代时发生的情况。\n\n### § 特热喜爱 (Feature Envy)\n\
    \n一个方法访问另一个对象的数据多于访问自身的数据。\n\n### § 不恰当的关系 (Inappropriate Intimacy)\n\n一个类使用了另一个类的内部字段和方法。\n\
    \n### § 消息链 (Message Chains)\n\n在代码中你看到一系列类似于 `$a->b()->$c()->$d()` 的调用。\n\n###\
    \ § 中间人 (Middle Man)\n\n如果一个类只执行一个动作并将工作委托给另一个类，那么它存在的意义是什么？\n\n## 特热喜爱 (Feature\
    \ Envy)\n\n### 征象与症状\n\n一个方法访问另一个对象的数据多于访问自身的数据。\n\n![](img/a9f2bde5dbae80f6f98fa49ccbde8add_69_0.png)\n\
    \n### 问题原因\n\n这种气味可能会在字段移动到数据类后出现。如果是此类情况，你可能也想将对数据的操作也移动到该类中。\n\n## 救治方法\n\n\
    作为一个基本原则，如果事物同时变化，你应该将它们保持在同一个地方。通常，数据和使用这些数据的数据是一起更改的（尽管存在例外）。\n\n- 如果一个方法显然应该移动到另一个地方，使用\
    \ Move Method（移动方法）。\n- 如果只有方法的部分访问了其他对象的数据，使用 Extract Method（提取方法）移动相关部分。\n-\
    \ 如果一个方法使用了来自其他几个类的中的函数，首先确定哪个类包含了大部分使用的数据。然后将该方法放在这个类中，连同其他数据。或者，使用 Extract Method\
    \ 将方法拆分为若干部分，并将它们放置在不同类的不同位置。\n\n![](img/a9f2bde5dbae80f6f98fa49ccbde8add_70_0.png)\n\
    \n## 收益\n\n- 减少了代码重复（如果将处理数据的代码放在中心位置）。\n- 更好的代码组织（处理数据的方法紧邻实际数据）。\n\n![](img/a9f2bde5dbae80f6f98fa49ccbde8add_71_0.png)\n\
    \n## 何时可以忽略\n\n有时行为被刻意与持有数据的类分开。这样做通常优点是能够动态地改变行为（参见策略、访问者等模式）。\n\n## 不恰当的关系 (Inappropriate\
    \ Intimacy)\n\n### 征象与症状\n\n一个类使用了另一个类的内部字段和方法。\n\n![](img/a9f2bde5dbae80f6f98fa49ccbde8add_72_0.png)\n\
    \n### 问题原因\n\n密切关注那些共处时间太长的类。良好的类之间应该尽可能少地了解。这样的类更容易维护和重用。\n\n## 救治方法\n\n- 最简单的解决方案是使用\
    \ Move Method（移动方法）和 Move Field（移动字段）将一个类的一部分移动到使用这些部分的类中。但只有当第一个类确实不需要这些部分时，才有效。\n\
    \n![](img/a9f2bde5dbae80f6f98fa49ccbde8add_73_0.png)\n- 另一个方案是使用 Extract Class（提取类）和\
    \ Hide Delegate（隐藏委托）。\n- 如果类之间是相互依赖的，使用 Bidirectional Association（双向关联）。\n- 如果这种“关系”发生在子类和父类之间，考虑替换继承。\n\
    \n## 收益\n\n- 改进代码组织。\n- 简化支持。\n\n![](img/a9f2bde5dbae80f6f98fa49ccbde8add_74_0.png)\n\
    \n## 消息链 (Message Chains)\n\n### 征象与症状\n\n在代码中你看到一系列类似于 `$a->b()->$c()->$d()`\
    \ 的调用。\n\n![](img/a9f2bde5dbae80f6f98fa49ccbde8add)\n\n### 问题原因\n\n消息链发生在客户端请求另一个对象，该对象再请求另一个，依此类推。这些链意味着客户端依赖类结构。\n\
    \n## 救治方法\n\n- 为了删除消息链，使用 Hide Delegate（隐藏委托）。\n- 有时为了将链的功能移动到起点，使用 Move Method（移动方法）。\n\
    \n![](img/a9f2bde5dbae80f6f98fa49ccbde8add_75_0.png)\n\n## 收益 \n\n- 减少了类之间的依赖。\n\
    - 减少了臃肿代码。\n\n![](img/a9f2bde5dbae80f6f98fa49ccbde8add_76_0.png)\n\n## 何时可以忽略\n\
    \n过度委托会导致难以看到功能实际发生在哪里。这也是另一种说法，即避免**中间人**气味。\n\n## 中间人 (Middle Man)\n\n### 征象与症状\n\
    \n如果一个类只执行一个动作并将工作委托给另一个类，那么它存在的意义是什么？\n\n![](img/a9f2bde5dbae80f6f98fa49ccbde8add_77_0.png)\n\
    \n### 问题原因\n\n这种气味可能是过度消除消息链的结果。在其他情况下，它可能是类的有用工作逐渐移动到其他类的结果。该类剩下的只是一个除了委托外什么都不做的空壳。\n\
    \n## 救治方法\n\n如果一个方法的大部分类委托给另一个类，应该 Remove Middle Man（移除中间人）。\n\n## 收益\n\n更不臃肿的代码。\n\
    \n![](img/a9f2bde5dbae80f6f98fa49ccbde8add_78_0.png)\n\n## 何时可以忽略\n\n不要删除为了某些原因而创建的人：\n\
    \n- 添加中间人可能是为了避免类间依赖。\n- 某些设计模式会有意创建中间人（例如代理或装饰器模式）。\n\n## 其他气味 (Other Smells)\n\
    \n以下是不属于任何大类别的气味。\n\n## 不完整的库类 (Incomplete Library Class)\n\n迟早以后，库不再满足用户需求。解决该问题的唯一方法——修改库——通常是不行的，因为库是只读的。\n\
    \n"
