    # Duplicate Observed Data


    # Problem


    Is domain data stored in classes responsible for the GUI?


    | IntervalWindow |

    |---||

    | startField: TextField |

    | endField: TextField |

    | lengthField: TextField |

    | StartField_FocusLost() |

    | EndField_FocusLost() |

    | LengthField_FocusLost() |

    | calculateLength() |

    | calculateEnd() |


    # Solution


    Then it''s a good idea to separate the data into separate classes, ensuring connection
    and synchronization between the domain class and the GUI.'
  - '[PAGE 171]


    # Refactoring Techniques / Duplicate Observed Data


    ![](img/a9f2bde5dbae80f6f98fa49ccbde8add_171_0.png)


    # Why Refactor


    You want to have multiple interface views for the same data (for example, you
    have both a desktop app and a mobile app). If you fail to separate the GUI from
    the domain, you will have a very hard time avoiding code duplication and a large
    number of mistakes.'
  - '[PAGE 172]


    # Benefits


    +   You split responsibility between business logic classes and presentation classes
    (cf. the Single Responsibility Principle), which makes your program more readable
    and understandable.


    +   If you need to add a new interface view, create new presentation classes;
    you don''t need to touch the code of the business logic (cf. the Open/Closed Principle).


    +   Now different people can work on the business logic and the user interfaces.


    # When Not to Use


    +   This refactoring technique, which in its classic form is performed using the
    Observer template, isn''t applicable for web apps, where all classes are recreated
    between queries to the web server.


    +   All the same, the general principle of extracting business logic into separate
    classes can be justified for web apps as well. But this will be implemented using
    different refactoring techniques depending on how your system is designed.'
  - '[PAGE 173]


    # How to Refactor


    +   1. Hide direct access to domain data in the GUI class. For this, it''s best
    to use Self Encapsulate Field. So you create the getters and setters for this
    data.


    +   2. In handlers for GUI class events, use setters to set new field values.
    This will let you pass these values to the associated domain object.


    +   3. Create a domain class and copy necessary fields from the GUI class to it.
    Create getters and seters for all these fields.


    +   4. Create an Observer pattern for these two classes:


    +   - In the domain class, create an array for storing observer objects (GUI objects),
    as well as methods for registering, deleting and notifying them.


    +   - In the GUI class, create a field for storing references to the domain class
    as well as the update() method, which will be reacting to changes in the object
    and update the values of fields in the GUI class. Note that value updates should
    be established directly in the method, in order to avoid recursion.


    +   - In the GUI class constructor, create an instance of domain class and save
    it in the field you have created. Register the GUI object as an observer in the
    domain object.'
  - '[PAGE 174]


    +   In the setters for domain class fields, call the method for notifying the
    observer (in other words, method for updating in the GUI class), in order to pass
    the new values to the GUI.


    +   Change the setters of the GUI class fields so that they set new values in
    the domain object directly. Watch out to make sure that values aren''t set through
    a domain class setter – otherwise infinite recursion will result.


    # Implements design pattern


    Observer


    # Eliminates smell


    Large Class'
  - '[PAGE 175]


    # Change Unidirectional Association to Bidirectional


    # Problem


    You have two classes that each need to use the features of the other, but the
    association between them is only unidirectional.


    ![](img/a9f2bde5dbae80f6f98fa49ccbde8add_175_0.png)


    # Solution


    Add the missing association to the class that needs it.


    ![](img/a9f2bde5dbae80f6f98fa49ccbde8add_175_1.png)'
  - '[PAGE 176]


    # Why Refactor


    Originally the classes had a unidirectional association. With time, client code
    needed access to both sides of the association.


    # Benefits


    If a class needs a reverse association, you can simply calculate it. But if these
    calculations are complex, it''s better to keep the reverse association.


    # Drawbacks


    +   - Bidirectional associations are much harder to implement and maintain than
    unidirectional ones.


    +   - Bidirectional associations make classes interdependent. With a unidirectional
    association, one of them can be used independently of the other.


    # How to Refactor


    +   1. Add a field for holding the reverse association.


    +   2. Decide which class will be “dominant”. This class will contain the methods
    that create or update the association as elements are added or changed, establishing
    the association in its class'
  - '[PAGE 177]


    and calling the utility methods for establishing the association in the associated
    object.


    +   3. Create a utility method for establishing the association in the "non-dominant"
    class. The method should use what it''s given in parameters to complete the field.
    Give the method an obvious name so that it isn''t used later for any other purposes.


    +   4. If old methods for controlling the unidirectional association were in the
    "dominant" class, complement them with calls to utility methods from the associated
    object.


    +   5. If the old methods for controlling the association were in the "non-dominant"
    class, create the methods in the "dominant" class, call them, and delegate execution
    to them.


    # Anti-refactoring


    # § Change Bidirectional Association to Unidirectional'
  - '[PAGE 178]


    # # Change Bidirectional Association to Unidirectional


    # ## Problem


    You have a bidirectional association between classes, but one of the classes doesn’t
    use the other’s features.


    ![](img/a9f2bde5dbae80f6f98fa49ccbde8add_178_0.png)


    # ## Solution


    Remove the unused association.


    ![](img/a9f2bde5dbae80f6f98fa49ccbde8add_178_1.png)'
  - '[PAGE 179]


    # Why Refactor


    A bidirectional association is generally harder to maintain a unidirectional one,
    requiring additional code for properly creating and deleting the relevant objects.
    This makes the program more complicated.


    In addition, an improperly implemented bidirectional association can cause problems
    for garbage collection (in turn leading to memory bloat by unused objects).


    Example: the garbage collector removes objects from memory that are no longer
    referenced by other objects. Let''s say that an object pair `User - Order` was
    created, used, and then abandoned. But these objects won''t be cleared from memory
    since they still refer to each other. That said, this problem is becoming less
    important thanks to advances in programming languages, which now automatically
    identify unused object references and remove them from memory.


    There''s also the problem of interdependency between classes. In a bidirectional
    association, the two classes must know about each other, meaning that they can''t
    be used separately. If many of these associations are present, different parts
    of the program become too dependent on each other and any changes in one component
    may affect the other components.'
  - "[PAGE 180]\n\n# Benefits\n\n+   - Simplifies the class that doesn’t need the\
    \ relationship. Less code equals less code maintenance.\n\n+   - Reduces dependency\
    \ between classes. Independent classes are easier to maintain since any changes\
    \ to a class affect only that class.\n\n# How to Refactor\n\n+   1. Make sure\
    \ that one of the following is true for your classes:\n  - No association is used.\n\
    \  - There’s another way to get the associated object, such through a database\
    \ query.\n  - The associated object can be passed as an argument to the methods\
    \ that use it.\n\n+   2. Depending on your situation, use of a field that contains\
    \ association with another object should be replaced by a parameter or method\
    \ call for getting the object in a different way.\n\n+   3. Delete the code that\
    \ assigns the associated object to the field.\n\n+   4. Delete the now-unused\
    \ field."
- md: "\n# Anti-refactoring\n\n§ Change Unidirectional Association to Bidirectional\n\
    \nEliminates smell\n\n§ Inappropriate Intimacy\n\n# Replace Magic Number with\
    \ Symbolic Constant\n\n## Problem\n\nYour code uses a number that has a certain\
    \ meaning to it.\n\n```\ndouble potentialEnergy(double mass, double height) {\n\
    \  return mass * height * 9.81;\n}\n```\n\n## Solution\n\nReplace this number\
    \ with a constant that has a human-readable name explaining the meaning of the\
    \ number.\n\n```\nstatic final double GRAVITATIONAL_CONSTANT = 9.81;\ndouble potentialEnergy(double\
    \ mass, double height) {\n  return mass * height * GRAVITATIONAL_CONSTANT;\n}\n\
    ```\n\n# Why Refactor\n\nA magic number is a numeric value that’s “encountered\
    \ in the source but has no obvious meaning. This “anti-pattern” makes it harder\
    \ to understand the program and refactor the code.\n\nYet more difficulties arise\
    \ when you need to change this magic number. Find and replace won't work for this:\
    \ the same number may be used for different purposes in different places, meaning\
    \ that you will have to verify every line of code that uses this number.\n\n#\
    \ Benefits\n\n- The symbolic constant can serve as live documentation of the meaning\
    \ of its value.\n\n- It’s much easier to change the value of a constant than to\
    \ search for this number throughout the entire codebase, without the risk of accidentally\
    \ changing the same number used elsewhere for a different purpose.\n\n- Reduce\
    \ duplicate use of a number or string in the code. This is especially important\
    \ when the value is complicated and long (such as 3.14159 or 0xCAFEBABE).\n\n\
    # Good to Know\n\nNot all numbers are magical.\n\nIf the purpose of a number is\
    \ obvious, there's no need to replace it. A classic example is:\n\n```\nfor (i\
    \ = 0; i < count; i++) { ... }\n```\n\n# Alternatives\n\n- 1. Sometimes a magic\
    \ number can be replaced with method calls. For example, if you have a magic number\
    \ that signifies the number of elements in a collection, you don't need to use\
    \ it for checking the last element of the collection. Instead, use the standard\
    \ method for getting the collection length.\n\n- 2. Magic numbers are sometimes\
    \ used as type code. Say that you have two types of users and you use a number\
    \ field in a class to specify which is which: administrators are 1 and ordinary\
    \ users are 2.\n\nIn this case, you should use one of the refactoring methods\
    \ to avoid type code:\n\n- Replace Type Code with Class\n- Replace Type Code with\
    \ Subclasses\n- Replace Type Code with State/Strategy\n\n# How to Refactor\n\n\
    - 1. Declare a constant and assign the value of the magic number to it.\n\n- 2.\
    \ Find all mentions of the magic number.\n\n- 3. For each of the numbers that\
    \ you find, double-check that the magic number in this particular case corresponds\
    \ to the purpose of the constant. If yes, replace the number with your constant.\
    \ This is an important step, since the same number can mean absolutely different\
    \ things (and [be] replaced with different constants, as the case may be).\n\n\
    # Encapsulate Field\n\n## Problem\n\nYou have a public field.\n\n```\nclass Person\
    \ {\n    public String name;\n}\n```\n\n## Solution\n\nMake the field private\
    \ and create access methods for it.\n\n```\nclass Person {\n    private String\
    \ name;\n    public String getName() {\n        return name;\n    }\n    public\
    \ void setName(String arg) {\n        name = arg;\n    }\n}\n```\n\n# Why Refactor\n\
    \nOne of the pillars of object-oriented programming is *Encapsulation*, the ability\
    \ to conceal object data. Otherwise, all objects would be public and other objects\
    \ could get and modify the data of your object without any checks and balances!\
    \ Data is separated from the behaviors associated with this data, modularity of\
    \ program sections is compromised, and maintenance becomes complicated.\n\n# Benefits\n\
    \n- If the data and behavior of a component are closely related and are in the\
    \ same place in the code, it's much easier for you to maintain and develop this\
    \ component.\n\n- You can also perform complicated operations related to access\
    \ to object fields.\n\n# When Not to Use\n\nIn some cases, encapsulation is ill-advised\
    \ due to performance considerations. These cases are rare but when they happen,\
    \ this circumstance is very important.\n\nSay that you have a graphical editor\
    \ that contains objects possessing x- and y-coordinates. These fields are unlikely\
    \ to change in the future. What's more, the program involves a great many different\
    \ objects in which these fields are present.\n\nSo accessing the coordinate fields\
    \ directly saves significant CPU cycles that would otherwise be taken up by calling\
    \ access methods.\n\nAs an example of this unusual case, there's the Point class\
    \ in Java. All fields of this class are public.\n\n# How to Refactor\n\n- 1. Create\
    \ a getter and setter for the field.\n\n- 2. Find all invocations of the field.\
    \ Replace receipt of the field value with the getter, and replace setting of new\
    \ field values with the setter.\n\n- 3. After all field invocations have been\
    \ replaced, make the field private.\n\n# Next Steps\n\nEncapsulate Field is only\
    \ the first step in bringing data and the behaviors involving this data closer\
    \ together. After you create simple methods for access fields, you should recheck\
    \ the places where these methods are called. It's quite possible that the code\
    \ in these areas would look more appropriate in the access methods.\n\nSimilar\
    \ refactorings\n\n§ Self Encapsulate Field\n\nCreate getters and setters for a\
    \ field instead of direct access within the class.\n\nEliminates smell\n\n§ Data\n\
    \n# Encapsulate Collection\n\n## Problem\n\nA class contains a collection field\
    \ and a simple getter and setter for working with the collection.\n\n| Person\
    \ |\n| --- |\n| getCourses() |\n| setCourses(Set) |\n\n## Solution\n\nMake the\
    \ getter read-only and create methods for adding/deleting elements of the collection.\n\
    \n| Person |\n| --- |\n| getCourses() |\n| addCourse(Course) |\n| removeCourse(Course)\
    \ |\n\n# Why Refactor\n\nA class contains a field that contains a collection of\
    \ objects. This collection could be an array, list or vector. A normal getter\
    \ and setter have been created for working with the collection.\n\nBut the method\
    \ shouldn't return the collection itself, since this would let clients change\
    \ contents without the knowledge of the class. In addition, this would show too\
    \ much of internal structures to clients. Additionally, there shouldn't be a method\
    \ that assigns a value to the collection. Instead, there should be operations\
    \ for adding and deleting elements. Thanks to this, the object gains control over\
    \ addition and deletion of elements.\n\n# Benefits\n\n- The collection field is\
    \ encapsulated inside a class. When the getter is called, it returns a copy of\
    \ the collection, which prevents accidental changing or overwriting of the collection\
    \ elements without the knowledge of the class.\n\n- If collection elements are\
    \ contained inside a primitive type, such as an array, you create more convenient\
    \ methods for working with the collection.\n\n- If collection elements are contained\
    \ inside a non-primitive container (standard collection class), by encapsulating\
    \ the collection you can restrict access to unwanted standard methods of the collection\
    \ (such as restricting addition of new elements).\n\n# How to Refactor\n\n- 1.\
    \ Create methods for adding and deleting collection elements. They must accept\
    \ collection elements in their parameters.\n\n- 2. Assign an empty collection\
    \ to the field as the initial value if this isn't done in the class constructor.\n\
    \n- 3. Find the calls of the collection field setter. Change the setter so that\
    \ it uses operations for adding and deleting elements, or make these operations\
    \ call client code.\n\nNote that setters can be used only to replace all collection\
    \ elements with others. Therefore it may be advisable to change the setter name\
    \ (**Rename Method**) to `replace`.\n\n- 4. Find all calls of the collection getter\
    \ after which the collection is changed. Change the code so that it uses your\
    \ new methods for adding and deleting elements from the collection.\n\n- 5. Change\
    \ the getter so that it returns a read-only representation of the collection.\n\
    \n- 6. Inspect the client code that uses the collection for code that would look\
    \ better inside of the collection class itself.\n"
  mdcn: "\n\n# 反重构\n\n§ 将单向关联改为双向关联\n\n消除气味\n\n§ 不恰的内聚\n\n# 将魔数替换为符号常量\n\n## 问题\n\n\
    你的代码使用了一个具有特定含义的数字。\n\n```\ndouble potentialEnergy(double mass, double height)\
    \ {\n  return mass * height * 9.81;\n}\n```\n\n## 解决方案\n\n将此数字替换为一个具有人类可读名称的常量，用以解释该数字的含义。\n\
    \n```\nstatic final double GRAVITATIONAL_CONSTANT = 9.81;\ndouble potentialEnergy(double\
    \ mass, double height) {\n  return mass * height * GRAVITATIONAL_CONSTANT;\n}\n\
    ```\n\n# 为什么要重构\n\n魔数是在源代码中遇到但没有明显含义的数值值。这种“反模式”使得理解程序和重构代码变得更加困难。\n\n当你需要更改这个魔数时，会产生更多困难。简单的查找和替换在某些情况下不起作用：同一个数字在不同的地方可能被用于不同的用途，这意味着你必须验证使用该数字的每一行代码。\n\
    \n# 收益\n\n- 符号常量可以作为其值含义的活文档。\n\n- 更改常量的值比在整个代码库中搜索该数字要容易得多，而且没有意外更改其他地方用于不同用途的相同数字的风险。\n\
    \n- 减少代码中数字或字符串的重复使用。当该值复杂且很长时（例如 3.14159 或 0xCAFEBABE），这尤为重要。\n\n# 提示\n\n并非所有数字都有魔法。\n\
    \n如果一个数字的用途显而易见，则不需要替换它。一个经典的例子是：\n\n```\nfor (i = 0; i < count; i++) { ... }\n\
    ```\n\n# 替代方案\n\n- 1. 有时魔数可以用方法调用来替换。例如，如果你有一个表示集合元素数量的魔数，你不需要用它来检查集合的最后一个元素。相反，使用获取集合长度的标准方法。\n\
    \n- 2. 魔数有时被用作类型代码。假设你有两种类型的用户，并在类中使用一个数字字段来指定是哪一种：管理员是 1，普通用户是 2。\n\n在这种情况下，你应该使用其中一种重构方法来避免类型代码：\n\
    \n- 将类型代码替换为类\n- 将类型代码替换为子类\n- 将类型代码替换为状态/策略\n\n# 如何重构\n\n- 1. 声明一个常量并将魔数的值赋值给它。\n\
    \n- 2. 找到所有提到魔数的地方。\n\n- 3. 对于你找到的每个数字，双检该特定情况下的魔数是否与常量的用途对应。如果是，将该数字替换为你的常量。这是一个重要的步骤，因为同一个数字可能意味着完全不同的含义（并且在某些情况下可能会被替换为不同的常量）。\n\
    \n# 封装字段\n\n## 问题\n\n你有一个公共字段。\n\n```\nclass Person {\n    public String name;\n\
    }\n```\n\n## 解决方案\n\n将字段设为私有，并为它创建访问方法。\n\n```\nclass Person {\n    private String\
    \ name;\n    public String getName() {\n        return name;\n    }\n    public\
    \ void setName(String arg) {\n        name = arg;\n    }\n}\n```\n\n# 为什么要重构\n\
    \n面向对象编程的支柱之一是*封装*，隐藏对象数据的能力。否则，所有对象都将是公开的，其他对象可以在没有任何任何检查的情况下获取并修改你对象的数据！数据将与与其相关的行为分离，程序段的模块化会受到破坏，维护也会变得复杂。\n\
    \n# 收益\n\n- 如果一个组件的数据和行为紧密相关且位于代码的同一位置，那么对你维护和开发该组件要容易得多。\n\n- 你还可以执行与访问对象字段相关的复杂操作。\n\
    \n# 何时不使用\n\n在某些情况下，出于性能考虑，封装是不明智的。这些情况很少见，但一旦发生，这种情况就非常重要。\n\n假设你有一个图形编辑器，包含具有\
    \ x 和 y 坐标的对象。这些字段在未来不太发生改变。此外，程序涉及许多存在这些字段的不同对象。\n\n因此，直接访问坐标字段可以节省大量的 CPU 周期，这些周期原本会被调用访问方法所占用。\n\
    \n这种异常情况的例子是 Java 中的 Point 类。该类的所有字段都是公共的。\n\n# 如何重构\n\n- 1. 为字段创建 getter 和 setter。\n\
    \n- 2. 找到该字段的所有调用。将接收字段值替换为 getter，将设置新字段值替换为 setter。\n\n- 3. 在所有字段调用都已替换后，将字段设为私有。\n\
    \n# 下一步骤\n\n封装字段只是将数据与涉及该数据的行为拉近的第一步。在你创建了访问字段的简单方法后，你应该重新检查调用这些方法的地方。这些区域的代码在访问方法中看起来可能更合适。\n\
    \n相似的重构\n\n§ 自我封装字段\n\n为字段创建 getters 和 setters，而不是在类内部直接访问。\n\n消除气味\n\n§ 数据\n\n\
    # 封装集合\n\n## 问题\n\n一个类包含一个集合字段，以及一个用于操作该集合的简单 getter 和 setter。\n\n| Person |\n\
    | --- |\n| getCourses() |\n| setCourses(Set) |\n\n## 解决方案\n\n将 getter 设为只读，并为添加/删除集合创建方法。\n\
    \n| Person |\n| --- |\n| getCourses() |\n| addCourse(Course) |\n| removeCourse(Course)\
    \ |\n\n# 为什么要重构\n\n一个类包含一个对象的集合。该集合可以是数组、列表或向量。已经创建了用于操作集合的普通 getter 和 setter。\n\
    \n但方法不应该返回集合本身，因为这会让客户端在类不知道的情况下更改内容。此外，这会向客户端暴露过内部结构。另外，不应该有一个给集合赋值的方法。相反，应该有添加和删除元素的操作。由于在此，对象获得了对添加和删除的控制。\n\
    \n# 收益\n\n- 集合字段封装在类内部。当调用 getter 时，它返回集合的副本，防止在类不知道的情况下意外更改或覆盖集合元素。\n\n- 如果集合元素包含在原生类型中（如数组），你为集合创建了更方便的方法。\n\
    \n- 如果集合元素包含在非原生容器（标准集合类）中，通过封装集合，你可以限制对不需要的标准方法的访问。\n\n# 如何重构\n\n- 1. 创建添加和删除集合元素的方法。这些方法必须接受集合元素作为参数。\n\
    \n- 2. 如果未在类构造函数中完成，将空集合赋值给字段作为初始值。\n\n- 3. 找到集合字段 setter的所有调用。更改 setter 使用添加和删除操作，或者让这些操作调用客户端代码。\n\
    \n注意 setter 可以用于替换所有集合元素。因此，将 setter 名称（重命名方法）更改为 `replace` 可能是明智的。\n\n- 4. 找到所有调用集合\
    \ getter 之后更改集合的地方。更改代码以使用你新的添加和删除集合元素的方法。\n\n- 5. 更改 getter 以返回集合的只读表示。\n\n-\
    \ 6. 检查使用集合的客户端代码，查看是否有代码放在集合类本身内部会更好。\n\n"
