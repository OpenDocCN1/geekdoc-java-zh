    \ a **subclass** from the relevant class, containing the methods and inheriting\
    \ everything else from the parent class. This way is easier but is sometimes blocked\
    \ by the utility class itself (due to `final`).\n\n- Create a **wrapper** class\
    \ that contains all the new methods and elsewhere will delegate to the related\
    \ object from the utility class. This method is more work since you need only\
    \ code to maintain the relationship between the wrapper and utility object, but\
    \ also a large number of simple delegating methods in order to emulate the public\
    \ interface of the utility class.\n\n## Benefits\n\nBy moving additional methods\
    \ to a separate extension class (wrapper or subclass), you avoid gumming up client\
    \ classes with code that doesn’t fit. Program components are more coherent and\
    \ are more reusable.\n\n## How to Refactor\n\n+ 1. Create a new extension class:\n\
    \    - Option A: Make it a child of the utility class.\n    - Option B: If you\
