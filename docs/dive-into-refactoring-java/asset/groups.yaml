    # Why Refactor


    A magic number is a numeric value that’s “encountered in the source but has no
    obvious meaning. This “uanti-pattern” makes it harder to understand the program
    and refactor the code.


    Yet more difficulties arise when you need to change this magic number. Find and
    replace won''t work for this: the same number may be used for different purposes
    in different places, meaning that you will have to verify every line of code that
    uses this number.


    # Benefits


    +   - The symbolic constant can serve as live documentation of the meaning of
    its value.


    +   - It’s much easier to change the value of a constant than to search for this
    number throughout the entire codebase, without the risk of accidentally changing
    the same number used elsewhere for a different purpose.


    +   - Reduce duplicate use of a number or string in the code. This is especially
    important when the value is complicated and long (such as 3.14159 or 0xCAFEBABE).'
  - '[PAGE 184]


    # Good to Know


    Not all numbers are magical.


    If the purpose of a number is obvious, there''s no need to replace it. A classic
    example is:


    ```

    for (i = 0; i < count; i++) { ... }

    ```


    # Alternatives


    +   1. Sometimes a magic number can be replaced with method calls. For example,
    if you have a magic number that signifies the number of elements in a collection,
    you don''t need to use it for checking the last element of the collection. Instead,
    use the standard method for getting the collection length.


    +   2. Magic numbers are sometimes used as type code. Say that you have two types
    of users and you use a number field in a class to specify which is which: administrators
    are 1 and ordinary users are 2 .


    In this case, you should use one of the refactoring methods to avoid type code:


    +   - Replace Type Code with Class

    - Replace Type Code with Subclasses'
  - '[PAGE 185]


    +   * Replace Type Code with State/Strategy


    # # How to Refactor


    +   1. Declare a constant and assign the value of the magic number to it.


    +   2. Find all mentions of the magic number.


    +   3. For each of the numbers that you find, double-check that the magic number
    in this particular case corresponds to the purpose of the constant. If yes, replace
    the number with your constant. This is an important step, since the same number
    can mean absolutely different things (and replaced with different constants, as
    the case may be).'
  - "[PAGE 186]\n\n#  Encapsulate Field\n\nProblem\n\nYou have a public field.\n\n\
    ```\nclass Person {\n    public String name;\n}\n```\n\n# Solution\n\nMake the\
    \ field private and create access methods for it.\n\n```\nclass Person {\n   \
    \ private String name;\n    public String getName() {\n        return name;\n\
    \    }\n    public void setName(String arg) {\n        name = arg;\n    }\n}\n\
    ```"
  - '[PAGE 187]


    # Why Refactor


    One of the pillars of object-oriented programming is *Encapsulation*, the ability
    to conceal object data. Otherwise, all objects would be public and other objects
    could get and modify the data of your object without any checks and balances!
    Data is separated from the behaviors associated with this data, modularity of
    program sections is compromised, and maintenance becomes complicated.


    # Benefits


    +   - If the data and behavior of a component are closely related and are in the
    same place in the code, it''s much easier for you to maintain and develop this
    component.


    +   - You can also perform complicated operations related to access to object
    fields.


    # When Not to Use


    In some cases, encapsulation is ill-advised due to performance considerations.
    These cases are rare but when they happen, this circumstance is very important.


    Say that you have a graphical editor that contains objects possessing x- and y-coordinates.
    These fields are unlikely to change in the future. What''s more, the program involves
    a great many different objects in which these fields are present.'
  - '[PAGE 188]


    So accessing the coordinate fields directly saves significant CPU cycles that
    would otherwise be taken up by calling access methods.


    As an example of this unusual case, there''s the Point class in Java. All fields
    of this class are public.


    # How to Refactor


    +   1. Create a getter and setter for the field.


    +   2. Find all invocations of the field. Replace receipt of the field value with
    the getter, and replace setting of new field values with the setter.


    +   3. After all field invocations have been replaced, make the field private.


    # Next Steps


    Encapsulate Field is only the first step in bringing data and the behaviors involving
    this data closer together. After you create simple methods for access fields,
    you should recheck the places where these methods are called. It''s quite possible
    that the code in these areas would look more appropriate in the access methods.'
  - '[PAGE 189]


    # Similar refactorings


    # § Self Encapsulate Field


    Create getters and setters for a field instead of direct access within the class''
    methods.


    # Eliminates smell


    # § Data Class'
  - '[PAGE 190]


    # # Encapsulate Collection


    # Problem


    A class contains a collection field and a simple getter and setter for working
    with the collection.


    | Person |

    | --- |

    | getCourses(): Set |

    | setCourses(courses : Set) |


    # Solution


    Make the getter-returned value read-only and create methods for adding/deleting
    elements of the collection.'
  - '[PAGE 191]


    | Person |

    | --- |

    | getCourses(): UnmodifiableSet addCourse(course : Course) removeCourse(course
    : Course) |


    # # Why Refactor


    A class contains a field that contains a collection of objects. This collection
    could be an array, list, set or vector. A normal getter and setter have been created
    for working with the collection.


    But the collections should be used by a protocol that''s bit different from the
    one used by other data types. The method shouldn''t return the collection object
    itself, since this would let clients change collection contents without the knowledge
    of the owner class. In addition, this would show too much of the internal structures
    of the object data to clients. The method for getting collection elements should
    return a value that doesn''t allow changing the collection or disclose excessive
    data about its structure.


    In addition, there shouldn''t be a method that assigns a value to the collection.
    Instead, there should be operations for adding and deleting elements. Thanks to
    this, the owner'
  - '[PAGE 192]


    object gains control over addition and deletion of collection elements.


    Such a protocol properly encapsulates a collection, which ultimately reduces the
    degree of association between the owner class and the client code.


    # Benefits


    +   - The collection field is encapsulated inside a class. When the getter is
    called, it returns a copy of the collection, which prevents accidental changing
    or overwriting of the collection elements without the knowledge of the class that
    contains the collection.


    +   - If collection elements are contained inside a primitive type, such as an
    array, you create more convenient methods for working with the collection.


    +   - If collection elements are contained inside a non-primitive container (standard
    collection class), by encapsulating the collection you can restrict access to
    unwanted standard methods of the collection (such as restricting addition of new
    elements).


    # How to Refactor


    +   1. Create methods for adding and deleting collection elements. They must accept
    collection elements in their parameters.'
  - '[PAGE 193]


    2. Assign an empty collection to the field as the initial value if this isn''t
    done in the class constructor.


    3. Find the calls of the collection field setter. Change the setter so that it
    uses operations for adding and deleting elements, or make these operations call
    client code.


    Note that setters can be used only to replace all collection elements with other
    ones. Therefore it may be advisable to change the setter name (**Rename Method**)
    to `replace`.


    4. Find all calls of the collection getter after which the collection is changed.
    Change the code so that it uses your new methods for adding and deleting elements
    from the collection.


    5. Change the getter so that it returns a read-only representation of the collection.


    6. Inspect the client code that uses the collection for code that would look better
    inside of the collection class itself.


    Eliminates smell


    # Data Class'
