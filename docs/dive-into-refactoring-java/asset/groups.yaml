  mdcn: "\n2. 下一步对于在重构过程中保持程序功能正常至关重要。通过复制旧方法创建一个新方法，并删除其中相关的参数。用对新方法的调用替换旧方法的代码。\n\
    \n3. 找到所有对旧方法的引用，并将它们替换为对新方法的引用。\n\n4. 删除旧方法。如果旧方法是公共接口的一部分，则不要执行此步骤。在这种情况下，将旧方法标记为已弃用（deprecated）。\n\
    \n## 反向重构\n\n- § 添加参数\n\n## 相似的重构\n\n- § 重命名方法\n\n## 帮助其他重构\n\n- § 将参数替换为方法调用\n\
    \n## 消除异味\n\n- § 推测性泛化\n\n## 分离查询与修改器 (Separate Query from Modifier)\n\n### 问题\n\
    \n你是否有一个方法既返回值，又改变了对象内部的内容？\n\n| 客户 (Customer) |\n|---|---|\n| getTotalOutstandingAndSetReadyForSummaries()\
    \ |\n\n### 解决方案\n\n将该方法拆分为两个独立的方法。正如你预期的，其中一个应该返回值，另一个则修改对象。\n\n| 客户 (Customer)\
    \ |\n|---|---|\n| getTotalOutstanding()<br>ReadyForSummaries() |\n\n## 为什么要重构\n\
    \n这种重构技术实现了命令与查询职责分离（CQRS）。这一原则告诉我们，要将获取数据的代码与改变对象内部内容的代码分离。\n\n获取数据的代码被称为“查询”（query）。更改对象可见状态内容的代码被称为“修改器”（modifier）。当查询和修改器结合时，你无法在不改变其状态的情况下获取数据。换句话说，你提问了一个问题，却可以在接收答案的同时改变这个答案。当调用查询的人可能不知道该方法的“副作用”时，这个问题会变得更加严严重，这通常会导致运行时错误。\n\
    \n请记住，只有在改变对象可见状态的修改器情况下，副作用才是危险的。这些状态可以是，例如从对象的公共接口访问的字段、数据库中的条目等。如果一个修改器只是缓存了一个复杂操作并将其保存在类的私有字段中，那么它几乎不会引起任何副作用。\n\
    \n## 收益\n\n如果你有一个不改变程序状态的查询，你可以随心所欲多次调用它，而而不必担心仅仅因为调用了该方法就会导致结果出现意外变化。\n\n## 缺点\n\
    \n在某些情况下，在执行命令后获取数据是很方便的。例如，从数据库中删除某些内容时，你想知道删除了多少行。\n\n## 如何重构\n\n1. 创建一个新的*查询方法*来返回原始方法所执行的结果。\n\
    \n2. 修改原始方法，使其仅返回调用新*查询方法*的结果。\n\n3. 将所有对原始方法的引用替换为对*查询方法*的调用。在这一行之前，放置一个对*修改器方法*的调用。这可以防止在原始方法被用于条件运算符或循环的条件时产生副作用。\n\
    \n4. 移除原始方法中返回值的代码，该方法现在已变成了一个适当的*修改器方法*。\n\n## 帮助其他重构\n\n§ 将临时变量替换为查询\n\n## 方法参数化\
    \ (Parameterize Method)\n\n### 问题\n\n多个方法执行相似的操作，区别仅在于它们的内部值、数字或操作。\n\n| 员工 (Employee)\
    \ |\n| --- |\n| fivePercentRaise() |\n| tenPercentRaise() |\n\n### 解决方案\n\n使用一个将传递必要特殊值的参数来合并这些方法。\n\
    \n| 员工 (Employee) |\n| --- |\n| raise(percentage) |\n\n## 为什么要重构\n\n如果你有相似的方法，你可能存在重复代码，以及随之而来的后果。\n\
    \n更重要的是，如果你需要添加此功能的另一个版本，你将不得不创建另一个方法。\n相反，你只需要使用不同的参数运行现有方法即可。\n\n## 缺点\n\n-\
    \ 有时，重构技术可能会做得过头，导致产生一个长而复杂的公共方法，而不是多个简单的方法。\n\n- 同时，在将功能的激活/去激活移动到参数时要小心。这最终可能导致创建一个巨大的条件运算符，该运算符需要通过“将参数替换为显式方法”来处理。\n\
    \n## 如何重构\n\n1. 创建一个带有参数的新方法，并通过应用“提取方法”（Extract Method）将其移动到所有类都相同的代码中。\n注意，有时只有方法的某部分实际上是相同的。在这种情况下，重构包括仅将相同部分提取到新方法中。\n\
    \n2. 在新方法的代码中，将特殊/差异值替换为参数。\n\n3. 对于每个旧方法，找到调用它的地方。将这些调用替换为对新方法的调用。然后删除该方法。\n\n\
    ## 反向重构\n\n§ 将参数替换为显式方法\n\n## 相似的重构\n\n§ 提取方法\n\n§ 模板方法\n\n## 消除异味\n\n§ 重复代码\n\
    \n## 将参数替换为显式方法 (Replace Parameter with Explicit Methods)\n\n### 问题\n\n一个方法被拆分为若干部分，每个部分根据值运行。\n\
    \n```java\nvoid setValue(String name, int value) {\n    if (name.equals(\"height\"\
    )) {\n        height = value;\n        return;\n    }\n    if (name.equals(\"\
    width\")) {\n        width = value;\n        return;\n    }\n}\n```\n\n### 解决方案\n\
    \n将方法的各个部分提取到独立的方法中并调用它们代替原始方法。\n\n```java\nvoid setHeight(int arg) {\n    height\
    \ = arg;\n}\nvoid setWidth(int arg) {\n    width = arg;\n}\n```\n\n## 为什么要重构\n\
    \n一个包含依赖参数变体的方法变得庞大。\n\n## 收益\n\n提高了代码的可读性。相比`setValue(\"engineEnabled\", true)`，理解\
    \ `startEngine()` 的目的容易得多。\n\n## 何时不使用\n\n如果一个方法很少更改且内部没有添加新变体，则不要将参数替换为显式方法。\n\
    \n## 如何重构\n\n1. 为方法的每个变体创建一个独立的方法。根据主方法中的值运行这些方法。\n\n2. 找到所有调用原始方法的地方。在这些地方调用其中一个变体方法。\n\
    \n3. 当原始方法不再被调用时，删除它。\n\n## 反向重构\n\n§ 方法参数化\n\n## 相似的重构\n\n§ 将条件替换为多态\n\n## 消除异味\n\
    \n§ Switch语句\n\n§ 长方法\n\n## 保留完整对象 (Preserve Whole Object)\n\n### 问题\n\n你从对象获取几个值，并将它们作为参数传递给方法。\n\
    \n```java\nint low = daysTempRange.getLow();\nint high = daysTempRange.getHigh();\n\
    boolean withinPlan = plan.withinRange(low, high);\n```\n\n### 解决方案\n\n相反，尝试传递整个对象。\n\
    \n```java\nboolean withinPlan = plan.withinRange(daysTempRange);\n```\n\n## 为什么要重构\n\
    \n问题在于每次调用都要调用参数对象的方法。如果这些方法或获取的数据量发生变化，你需要仔细查找程序中的多处并在每处实现这些更改。\n\n## 收益 \n\n\
    - 与一堆参数相比，你看到的是一个具有清晰名称的对象。\n\n- 如果方法需要从对象获取更多数据，你不需要重写所有调用该方法的地方——只需修改方法内部即可。\n\
    \n## 缺点\n\n有时这种转换会导致方法的灵活性降低：以前该方法可以从许多不同的来源获取数据，但现在由于重构，我们将其限制为仅适用于特定接口的对象。\n\
    \n## 如何重构\n\n1. 在方法中创建一个参数，用于表示可以从中获取所需值的对象。\n\n"
