    \n### Solution\n\nMove this behavior to the subclasses.\n\n![](img/a9f2bde5dbae80f6f98fa49ccbde8add_302_0.png)\n\
    \n## Why Refactor\n\nAlthough it was planned to use universally for all classes,\
