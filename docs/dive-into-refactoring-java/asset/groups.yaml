    \n## When to Ignore\n\nExtending a library can generate additional work if the\
    \ changes to the library involve changes in code.\n\n## Refactoring Techniques\n\
    \nRefactoring is a controllable process of improving code without creating new\
    \ functionality. It transforms a mess into clean code and simple design.\n\n![](img/a9f2bde5dbae80f6f98fa49ccbde8add_83_0.png)\n\
    \nClean code is code that is easy to read, write and maintain. Clean code makes\
    \ software development predictable and increases the quality of a resulting product.\n\
    \nRefactoring techniques describe actual refactoring steps. Most refactoring techniques\
    \ have their pros and cons. Therefore, each refactoring should be properly motivated\
    \ and applied with caution.\n\nIn the previous chapters, you have seen how particular\
    \ refactorings can help fixing problems with code. Now it's the time to look over\
    \ the refactoring techniques in more detail!\n\n## Composing Methods\n\nMuch of\
    \ refactoring is devoted to correctly composing long methods. In most cases, excessively\
    \ long methods are the root of all evil. The vagaries of code inside these methods\
    \ conceal the execution logic and make the method extremely hard to understand\
    \ – and even harder to change.\n\nThe refactoring techniques in this group streamline\
    \ methods, remove code duplication, and pave the way for future improvements.\n\
    \n### Extract Method\n\n**Problem:** You have a code fragment that can be grouped\
    \ together.\n\n**Solution:** Move this code to a separate new method (or function)\
    \ and replace the old code with a call to the method.\n\n### Inline Method\n\n\
    **Problem:** When a method body is more obvious than the method itself, use this\
    \ technique.\n\n**Solution:** Replace calls to the method with the method's content\
    \ and delete the method itself.\n\n### Extract Variable\n\n**Problem:** You have\
    \ an expression that's hard to understand.\n\n**Solution:** Place the result of\
    \ the expression or its parts in separate variables that are self-explanatory.\n\
    \n### Inline Temp\n\n**Problem:** You have a temporary variable that’s assigned\
    \ the result of a simple expression and nothing more.\n\n**Solution:** Replace\
    \ the references to the variable with the expression itself.\n\n### Replace Temp\
    \ with Query\n\n**Problem:** You place the result of an expression in a local\
    \ variable for later use in your code.\n\n**Solution:** Move the entire expression\
    \ to a separate method and return the result from it. Query the method instead\
    \ of using a variable. Incorporate the new method in other methods, if necessary.\n\
    \n### Split Temporary Variable\n\n**Problem:** You have a local variable that’s\
    \ used to store various intermediate values inside a method (except for cycle\
    \ variables).\n\n**Solution:** Use different variables for different values. Each\
    \ variable should be responsible for only one particular thing.\n\n### Remove\
    \ Assignments to Parameters\n\n**Problem:** Some value is assigned to a parameter\
    \ inside method’s body.\n\n**Solution:** Use a local variable instead of a parameter.\n\
    \n### Replace Method with Method Object\n\n**Problem:** You have a long method\
    \ in which the local variables are so intertwined that you can't apply Extract\
