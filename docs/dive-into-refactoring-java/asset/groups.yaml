    of servers of multiple types, all servers must implement the interface.'
  - '[PAGE 318]


    # Good to Know


    There''s a certain resemblance between Extract Superclass and Extract Interface.


    Extracting an interface allows isolating only common interfaces, not common code.
    In other words, if classes contain Duplicate Code, extracting the interface won''t
    help you to deduplicate.


    All the same, this problem can be mitigated by applying Extract Class to move
    the behavior to a separate component and delegating all the work to it. If the
    common behavior is large in size, you can always use Extract Superclass. This
    is even easier, of course, but remember that if you take this path you will get
    only one parent class.


    # How to Refactor


    +   1. Create an empty interface.


    +   2. Declare common operations in the interface.


    +   3. Declare the necessary classes as implementing the interface.


    +   4. Change type declarations in the client code to use the new interface.'
  - '[PAGE 319]


    # Similar refactorings


    +   § Extract Superclass'
  - '[PAGE 320]


    # Collapse Hierarchy


    Problem


    You have a class hierarchy in which a subclass is practically the same as its
    superclass.


    ![](img/a9f2bde5dbae80f6f98fa49ccbde8add_320_0.png)


    Solution


    Merge the subclass and superclass.


    ![](img/a9f2bde5dbae80f6f98fa49ccbde8add_320_1.png)'
  - '[PAGE 321]


    # Why Refactor


    Your program has grown over time and a subclass and super-class have become practically
    the same. A feature removed from a subclass, a method was moved to the super-class...
    and now you have two look-alike classes.


    # Benefits


    +   - Program complexity is reduced. Fewer classes mean fewer things to keep straight
    in your head and fewer breakable moving parts to worry about during future code
    changes.


    +   - Navigating through your code is easier when methods are defined in one class
    early. You don''t need to comb through the entire hierarchy to find a particular
    method.


    # When Not to Use


    +   - Does the class hierarchy that you''re refactoring have more than one subclass?
    If so, after refactoring is complete, the remaining subclasses should become the
    inheritors of the class in which the hierarchy was collapsed.


    +   - But keep in mind that this can lead to violations of the Liskov substitution
    principle. For example, if your program emulates city transport networks and you
    accidentally collapse the Transport superclass into the Car subclass, then the
    Plane class may become the inheritor of car . Oops!'
  - '[PAGE 322]


    # How to Refactor


    +   1. Select which class is easier to remove: the superclass or its subclass.


    +   2. Use Pull Up Field and Pull Up Method if you decide to get rid of the subclass.
    If you choose to eliminate the superclass, go for Push Down Field and Push Down
    Method.


    +   3. Replace all uses of the class that you''re deleting to which the fields
    and methods are to be migrated. Often this will be code for creating classes,
    variable and parameter typing, and documentation in code comments.


    +   4. Delete the empty class.


    # Similar refactorings


    Inline Class


    Collapse Hierarchy is a variation of Inline Class, where the code moves to superclass
    or subclass.


    # Eliminates smell


    Lazy Class


    Speculative Generality'
  - '[PAGE 323]


    # Form Template Method


    Problem


    Your subclasses implement algorithms that contain similar steps in the same order.


    ![](img/a9f2bde5dbae80f6f98fa49ccbde8add_323_0.png)


    # Solution


    Move the algorithm structure and identical steps to a superclass, and leave implementation
    of the different steps in the subclasses.'
- md: '

    # Refactoring Techniques / Form Template Method


    ![](img/a9f2bde5dbae80f6f98fa49ccbde8add_324_0.png)


    ## Why Refactor


    Subclasses are developed in parallel, sometimes by different people, which leads
    to code duplication, errors, and difficulties in code maintenance, since each
    change must be made in all subclasses.


    ## Benefits


    - Code duplication doesn''t always refer to cases of simple copy/paste. Often
    duplication occurs at a higher level, such as when you have a method for sorting
    numbers and a method for sorting object collections that are differentiated only
    by the comparison of elements. Creating a template method eliminates this duplication
    by merging the shared algorithm steps in a superclass and leaving just the differences
    in the subclasses.


    Forming a template method is an example of the Open/Closed Principle in action.
    When a new algorithm version appears, you need only to create a new subclass;
    no changes to existing code are required.


    ## How to Refactor


    - 1. Split algorithms in the subclasses into their constituent parts described
    in separate methods. Extract Method can help with this.

    - 2. The resulting methods that are identical for all subclasses can be moved
    to a superclass via Pull Up Method.

    - 3. The non-similar methods can be given consistent names by Rename Method.

    - 4. Move the signatures of non-similar methods to a superclass abstract ones
    by using Pull Up Method. Leave their implementations in the subclasses.

    - 5. And finally, pull the main method of the algorithm to the superclass. Now
    it should work with the method steps described in the superclass, both real and
    abstract.


    ## Implements design pattern


    - Template Method


    ## Eliminates smell


    - Duplicate Code


    ## Replace Inheritance with Delegation


    ## Problem


    You have a subclass that uses only a portion of the methods of its superclass
    (or it''s not possible to inherit superclass data).


    ![](img/a9f2bde5dbae80f6f98fa49ccbde8add_327_0.png)


    ## Solution


    Create a field and put a superclass object in it, delegate methods to the superclass
    object, and get rid of inheritance.


    328 Refactoring Techniques / Replace Inheritance with Delegation


    ![](img/a9f2bde5dbae80f6f98fa49ccbde8add_328_0.png)


    ## Why Refactor


    Replacing inheritance with composition can substantially improve class design:


    - Your subclass violates the Liskov substitution principle, i.e., if inheritance
    was implemented only to combine common code but not because the subclass is an
    extension of the superclass.

    - The subclass uses only a portion of the methods of the superclass. In this case,
    it''s only a matter of time before one calls a superclass method that he or she
    wasn''t supposed to call.


    In essence, this refactoring technique splits both classes and makes the superclass
    the helper of the subclass, not its parent. Instead of inheriting all subclass
    methods, the subclass will have only the necessary methods for delegating to the
    methods of the superclass object.


    lukas.holiger@gmail.com (#15312)


    ## Benefits


    - A class doesn''t contain any unneeded methods inherited from the superclass.

    - Various objects with various implementations can be put in the delegate field.
    In effect you get the Strategy design pattern.


    ## Drawbacks


    You have to write many simple delegating methods.


    ## How to Refactor


    - 1. Create a field in the subclass for holding the superclass. During the initial
    stage, place the current object in it.

    - 2. Change the subclass methods so that they use the superclass object instead
    of `this`.

    - 3. For methods inherited from the superclass that are called in the client code,
    create simple delegating methods in the subclass.

    - 4. Remove the inheritance declaration from the subclass.

    - 5. Change the initialization code of the field in which the former superclass
    is stored by creating a new object.


    ## Anti-refactoring


    - Replace Delegation with Inheritance


    ## Implements design pattern


    - Strategy


    ## Replace Delegation with Inheritance


    ## Problem


    A class contains many simple methods that delegate to all methods of another class.


    ![](img/a9f2bde5dbae80f6f98fa49ccbde8add_331_0.png)


    ```

    return $this->person->getName();

    ```


    ## Solution


    Make the class a delegate inheritor, which makes the delegating methods unnecessary.


    | Person |

    | --- |

    | getName() |

    | △ |

    | Employee |


    ## Why Refactor


    Delegation is a more flexible approach than inheritance, since it allows changing
    how delegation is implemented and placing other classes there as well. Nonetheless,
    delegation stop being beneficial if you delegate actions to only one class and
    all of its public methods.


    In such a case, if you replace delegation with inheritance, you cleanse the class
    of a large number of delegating methods and spare yourself from needing to create
    them for each new delegate class method.


    ## Benefits


    Reduces code length. All these delegating methods are no longer necessary.


    ## When Not to Use


    - Don’t use this technique if the class contains delegation to only a portion
    of the public methods of the delegate class. By doing so, you would violate the
    Liskov substitution principle.

    - This technique can be used only if the class still doesn’t have parents.


    ## How to Refactor


    - 1. Make the class a subclass of the delegate class.

    - 2. Place the current object in a field containing a reference to the delegate
    object.

    - 3. Delete the methods with simple delegation one by one. If their names were
    different, use Rename Method to give all the methods a single name.

    - 4. Replace all references to the delegate field with references to the current
    object.

    - 5. Remove the delegate field.


    ## Anti-refactoring


    - Replace Delegation with Inheritance


    ## Similar refactorings


    - Remove Middle Man


    ## Eliminates smell


    - Inappropriate Intimacy


    ## Afterword


    Congrats on reaching the last page!


    Now that you know so much about refactoring, what are you planning to do? Here’s
    a bunch of ideas, if you still haven''t decided:


    - Read Joshua Kerievsky’s book “Refactoring to Patterns”.

    - What? Don’t you know what are the design patterns? Read our section about design
    patterns

    - Print out the refactoring cheat sheet and pin it somewhere you’ll always see
    it.

    - Submit your feedback about this book and the full course. I’d be glad to hear
    any feedback, even if it’s negative 🙂

    '
