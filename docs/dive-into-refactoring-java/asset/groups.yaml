- md: "\n## Replace Conditional with Polymorphism\n\n### Problem\n\nYou have a conditional\
    \ that performs various actions depending on object type or properties.\n\n```java\n\
    class Bird {\n  // ...\n  double getSpeed() {\n    switch (type) {\n      case\
    \ EUROPEAN:\n        return getBaseSpeed();\n      case AFRICAN:\n        return\
    \ getBaseSpeed() - getLoadFactor() * numberOfCoconuts;\n      case NORWEGIAN_BLUE:\n\
    \        return (isNailed) ? 0 : getBaseSpeed(voltage);\n    }\n    throw new\
    \ RuntimeException(\"Should be unreachable\");\n  }\n}\n```\n\n### Solution\n\n\
    Create subclasses matching the branches of the conditional. In them, create a\
    \ shared method and move code from the corresponding branch of the conditional\
    \ to it. Then replace the conditional with the relevant method call. The result\
    \ is that the proper implementation will be attained via polymorphism depending\
    \ on the object class.\n\n```java\nabstract class Bird {\n  // ...\n  abstract\
    \ double getSpeed();\n}\n\nclass European extends Bird {\n  double getSpeed()\
    \ {\n    return getBaseSpeed();\n  }\n}\n\nclass African extends Bird {\n  double\
    \ getSpeed() {\n    return getBaseSpeed() - getLoadFactor() * numberOfCoconuts;\n\
    \  }\n}\n\nclass NorwegianBlue extends Bird {\n  double getSpeed() {\n    return\
    \ (isNailed) ? 0 : getBaseSpeed(voltage);\n  }\n}\n\n// Somewhere in client code\n\
    ```\n\n### Why Refactor\n\nThis refactoring technique can help if your code contains\
    \ operators performing various tasks that vary based on:\n\n- Class of the object\
    \ or interface that it implements\n- Value of an object's field\n- Result of calling\
    \ one of an object's methods\n\nIf a new object property or type appears, you\
    \ will need to search for and add code in all similar conditionals. Thus the benefit\
    \ of this technique is multiplied if there are multiple conditionals scattered\
    \ throughout all of an object's methods.\n\n### Benefits\n\n- This technique adheres\
    \ to the Tell-Don't-Ask principle: instead of asking an object about its state\
    \ and then performing actions based on this, it's much easier to simply tell the\
    \ object what it needs to do and let it decide for itself how to that.\n- Removes\
    \ duplicate code. You get rid of many almost identical conditionals.\n\nIf you\
    \ need to add a new execution variant, all you need to do is add a new subclass\
    \ without touching the existing code (Open/Closed Principle).\n\n### How to Refactor\n\
    \n#### Preparing to Refactor\n\nFor this refactoring technique, you should have\
    \ a ready hierarchy of classes that will contain alternative behaviors. If you\
    \ don't have a hierarchy like this, create one. Other techniques will help to\
    \ make this happen:\n\n- Replace Type Code with Subclasses. Subclasses will be\
    \ created for all values of a particular object property. This approach is simple\
    \ but less flexible since you can't create subclasses for the other properties\
    \ of the object.\n- Replace Type Code with State/Strategy. A class will be dedicated\
    \ for a particular object property and subclasses will be created from it for\
    \ each value of the property. The current class will contain references to the\
    \ objects of this type and delegate execution to them.\n\nThe following steps\
    \ assume that you have already created the hierarchy.\n\n### Refactoring Steps\n\
    \n- 1. If the conditional is in a method that performs other actions as well,\
    \ perform Extract Method.\n- 2. For each hierarchy subclass, redefine the method\
    \ that contains the conditional and copy the code of the corresponding conditional\
    \ branch to that location.\n- 3. Delete this branch from the conditional.\n- 4.\
    \ Repeat replacement until the conditional is empty. Then delete the conditional\
    \ and declare the method abstract.\n\n### Eliminates smell\n\n- Switch Statements\n\
    \n## Introduce Null Object\n\n### Problem\n\nSince some methods return `null`\
    \ instead of real objects, you have many checks for `null` in your code.\n\n```java\n\
    if (customer == null) {\n    plan = BillingPlan.basic();\n} else {\n    plan =\
    \ customer.getPlan();\n}\n```\n\n### Solution\n\nInstead of `null`, return a null\
    \ object that exhibits the default behavior.\n\n```java\nclass NullCustomer extends\
    \ Customer {\n    boolean isNull() {\n        return true;\n    }\n}\n```\n\n\
    ```java\nPlan getPlan() {\n    return new NullPlan();\n}\n// Some other NULL functionality.\n\
    }\n// Replace null values with Null-object.\ncustomer = (order.customer != null)\
    \ ?\norder.customer : new NullCustomer();\n// Use Null-object as if it's normal\
    \ subclass.\nplan = customer.getPlan();\n```\n\n### Why Refactor\n\nDozens of\
    \ checks for `null` make your code longer and uglier.\n\n### Drawbacks\n\nThe\
    \ price of getting rid of conditionals is creating yet another new class.\n\n\
    ### How to Refactor\n\n- 1. From the class in question, create a subclass that\
    \ will perform the role of null object.\n- 2. In both classes, create the method\
    \ `isNull()`, which will return `true` for a null object and `false` for a real\
    \ class.\n- 3. Find all places where the code may return `null` instead of a real\
    \ object. Change the code so that it returns a null object.\n- 4. Find all places\
    \ where the variables of the real class are compared with `null`. Replace these\
    \ checks with a call for `isNull()`.\n- 5. If methods of the original class are\
    \ run in these conditions when a value doesn't, add an assertion for this condition\
    \ in order to make sure. If you can't extract the `else` the behavior will be\
    \ implemented via polymorphism.\n\n### Similar refactorings\n\n- Replace Conditional\
    \ with Polymorphism\n\n### Implements design pattern\n\n- Null-object\n\n### Eliminates\
    \ smell\n\n- Switch Statements\n- Temporary Field\n\n## Introduce Assertion\n\n\
    ### Problem\n\nFor a portion of code to work correctly, certain conditions or\
    \ values must be true.\n\n```java\ndouble getExpenseLimit() {\n    // Should have\
    \ either expense limit or\n    // a project.\n    return (expenseLimit != NULL_EXPENSE)\
    \ ?\n    expenseLimit :\n    primaryProject.getExpenseLimit();\n}\n```\n\n###\
    \ Solution\n\nReplace these assumptions with specific assertion checks.\n\n```java\n\
    double getExpenseLimit() {\n    Assert.isTrue(expenseLimit != NULL_EXPENSE ||\
    \ primaryProject != null);\n    return (expenseLimit != NULL_EXPENSE) ?\n    expenseLimit\
    \ :\n    primaryProject.getExpenseLimit();\n}\n```\n\n### Why Refactor\n\nSay\
    \ that a portion of code assumes something about, example, the current condition\
    \ of an object or value of a parameter or local variable. Usually this assumption\
    \ will always hold true except in the event of an error.\n\nMake these assumptions\
    \ obvious by adding corresponding assertions. As with type hinting in method parameters,\
    \ these assertions can act as live documentation for your code.\n\nAs a guideline\
    \ to see where your code needs assertions, check for comments that describe the\
    \ conditions under which a particular method will work.\n\n### Benefits\n\nIf\
    \ an assumption isn’t true and the code therefore gives the wrong result, it's\
    \ better to stop execution before this causes fatal consequences and data corruption.\
    \ This also means you neglected to write a necessary test when devising ways to\
    \ perform testing of the program.\n\n### Drawbacks\n\n- Sometimes an exception\
    \ is more appropriate than a simple assertion. You can select the necessary class\
    \ of the exception and let the remaining code handle it correctly.\n- When is\
    \ an exception better than a simple assertion? If the exception can be caused\
    \ by actions of the user or system and you can handle the exception. On the other\
    \ hand, ordinary unnamed and unhandled exceptions are basically equivalent to\
    \ simple assertions – you don’t handle them and they’re caused exclusively as\
    \ the result of a program bug that never should have occurred.\n\n### How to Refactor\n\
    \nWhen you see that a condition is assumed, add an assertion for this condition\
    \ in order to make sure.\n\nAdding the assertion shouldn’t change the program’s\
    \ behavior.\n\nDon’t overdo it with use of assertions for everything in your code.\
    \ Check for only the conditions that are necessary for correct functioning of\
    \ the code. If your code is working normally even when a particular assertion\
    \ is false, you can safely remove the assertion.\n\n### Eliminates smell\n\n-\
    \ Comments\n"
  mdcn: "\n\n## 用多态替换条件分支\n\n### 问题描述\n\n你有一个根据对象类型或属性执行各种操作的条件判断。\n\n```java\nclass\
    \ Bird {\n  // ...\n  double getSpeed() {\n    switch (type) {\n      case EUROPEAN:\n\
    \        return getBaseSpeed();\n      case AFRICAN:\n        return getBaseSpeed()\
    \ - getLoadFactor() * numberOfCoconuts;\n      case NORWEGIAN_BLUE:\n        return\
    \ (isNailed) ? 0 : getBaseSpeed(voltage);\n    }\n    throw new RuntimeException(\"\
    Should be unreachable\");\n  }\n}\n```\n\n### 解决方案\n\n创建与条件分支匹配的子类。在这些子类中，创建一个共享方法，并将对应条件分支的代码移动到该方法中。然后用相关的方法调用替换条件分支。结果是：根据对象的类通过多态实现正确的实现。\n\
    \n```java\nabstract class Bird {\n  // ...\n  abstract double getSpeed();\n}\n\
    \nclass European extends Bird {\n  double getSpeed() {\n    return getBaseSpeed();\n\
    \  }\n}\n\nclass African extends Bird {\n  double getSpeed() {\n    return getBaseSpeed()\
    \ - getLoadFactor() * numberOfCoconuts;\n  }\n}\n\nclass NorwegianBlue extends\
    \ Bird {\n  double getSpeed() {\n    return (isNailed) ? 0 : getBaseSpeed(voltage);\n\
    \  }\n}\n\n// 客户端代码某处\n```\n\n### 为什么要重构\n\n如果你的代码包含根据以下因素执行不同任务的运算符，那么这种重构技术将非常有帮助：\n\
    \n- 对象的类或其实现的接口\n- 对象字段的值\n- 调用对象某个方法产生的结果\n\n如果出现了新的对象属性或类型，你需要在所有类似的条件分支中搜索并添加代码。因此，如果对象的所有方法中散布着多个条件分支，这种技术的好处将会成倍增加。\n\
    \n### 益处\n\n- 该技术遵循“不要询问，要通知”（Tell-Don't-Ask）原则：与其询问对象的状态并据此执行操作，不如直接告诉对象需要做什么，让它自己决定如何执行要简单得多。\n\
    - 消除重复代码。你去掉了许多几乎完全相同的条件分支。\n\n如果你需要添加新的执行变体，只需要添加一个新的子类，而无需触动现有代码（开/闭原则）。\n\n\
    ### 如何重构\n\n#### 准备重构\n\n对于这种重构技术，你应该已经有一个包含备选行为的类层次结构。如果没有这样的层次结构，请创建一个。其他技术可以帮助实现这一点：\n\
    \n- 用子类替换类型代码。为特定对象属性的所有值创建子类。这种方法简单但灵活性较差，因为你无法为对象的其他属性创建子类。\n- 用状态/策略替换类型代码。为特定的对象属性创建一个类，并根据该属性的每个值从该类创建子类。当前类将包含该类型对象的引用，并将执行任务委托给它们。\n\
    \n以下步骤假设你已经创建了该层次结构。\n\n### 重构步骤\n\n- 1. 如果条件分支位于一个执行其他操作的方法中，请执行“提取方法”（Extract\
    \ Method）。\n- 2. 对于每个层次结构子类，重新定义包含条件分支的方法，并将对应分支的代码复制到该位置。\n- 3. 从条件分支中删除该分支。\n\
    - 4. 重复替换直到条件分支为空。然后删除该条件分支并将方法声明为抽象方法。\n\n### 消除异味\n\n- Switch 语句\n\n## 引入空对象\n\
    \n### 问题描述\n\n由于某些方法返回 `null` 而不是真实的对象，你的代码中有很多针对 `null` 的检查。\n\n```java\nif (customer\
    \ == null) {\n    plan = BillingPlan.basic();\n} else {\n    plan = customer.getPlan();\n\
    }\n```\n\n### 解决方案\n\n不要返回 `null`，而是返回一个表现出默认行为的空对象。\n\n```java\nclass NullCustomer\
    \ extends Customer {\n    boolean isNull() {\n        return true;\n    }\n}\n\
    ```\n\n```java\nPlan getPlan() {\n    return new NullPlan();\n}\n// 其他 NULL 功能。\n\
    }\n// 将 null 值替换为空对象。\ncustomer = (order.customer != null) ?\norder.customer :\
    \ new NullCustomer();\n// 像使用普通类一样使用空对象。\nplan = customer.getPlan();\n```\n\n\
    ### 为什么要重构\n\n几十个 `null` 让你的代码变得更长更难看。\n\n### 缺点\n\n消除条件分支的代价是又创建了一个新类。\n\n###\
    \ 如何重构\n\n- 1. 从涉及的类中，创建一个承担空对象角色的子类。\n- 2. 在两个类中都创建 `isNull()` 方法，它对空对象返回 `true`，对真实类返回\
    \ `false`。\n- 3. 找到所有代码可能返回 `null` 而不是真实对象的地方。修改代码使其返回空对象。\n- 4. 找到所有将真实类变量与 `null`\
    \ 进行比较的地方。将这些检查替换为对 `isNull()` 的调用。\n- 5. 如果在值不符合条件但在这些条件下运行了原始类的方法，请为该条件添加断言（assertion）以确保万。如果你无法提取\
    \ `else` 分支，则该行为将通过多态实现。\n\n### 类似的重构\n\n- 用多态替换条件分支\n\n### 实现的设计模式\n\n- 空对象模式（Null-object）\n\
    \n### 消除异味\n\n- Switch 语句\n- 临时字段\n\n## 引入断言\n\n### 问题描述\n\n为了使部分代码正确工作，某些条件或值必须为真。\n\
    \n```java\ndouble getExpenseLimit() {\n    // 应该有费用限制或\n    // 项目。\n    return\
    \ (expenseLimit != NULL_EXPENSE) ?\n    expenseLimit :\n    primaryProject.getExpenseLimit();\n\
    }\n```\n\n### 解决方案\n\n将这些假设替换为特定的断言检查。\n\n```java\ndouble getExpenseLimit() {\n\
    \    Assert.isTrue(expenseLimit != NULL_EXPENSE || primaryProject != null);\n\
    \    return (expenseLimit != NULL_EXPENSE) ?\n    expenseLimit :\n    primaryProject.getExpenseLimit();\n\
    }\n```\n\n### 为什么要重构\n\n代码某些部分假设了关于对象的当前状态或参数或局部变量的值。通常除非发生错误，否则假设总是成立的。\n\n通过添加相应的断言使这些假设显性化。就像方法参数的类型提示一样，这些断言可以作为代码的活文档。\n\
    \n对于描述方法工作条件的注释可以作为确定代码哪里需要断言的指南。\n\n### 益处\n\n如果假设不成立导致代码给出了错误结果，那么在造成严重后果和数据损坏之前停止执行要好。这意味着你在设计测试方案时忽略了编写必要的测试。\n\
    \n### 缺点\n\n- 有时异常比简单的断言更合适。你可以选择必要的异常类并让剩余代码正确处理它。\n- 什么时候异常比简单的断言更好？如果异常可以由用户或系统的操作引起且你可以处理该异常。另一方面，普通的未命名且未处理的异常基本上等同于简单的断言——你不处理它们，而且它们完全是由本不应该发生的程序\
    \ Bug 引起的。\n\n### 如何重构\n\n当你发现假设某个条件时，为该条件添加断言以确保万。\n\n添加断言不应改变程序的行为。\n\n不要过度对代码中的一切内容使用断言。只检查对于代码正确运行所必要的条件。如果当某个断言为假时代码仍正常运行，就可以安全地删除该断言。\n\
    \n### 消除异味\n\n- 注释\n\n"
