  mdcn: "\n\n+ 2. 如果字段名称不同，请赋予它们相同的名称，并替换现有代码中对这些字段的所有引用。\n\n+ 3. 在父类中创建一个同名的字段。注意，如果字段是私有的（private），则父类字段应该是保护的（protected）。\n\
    \n+ 4. 从子类中删除这些字段。\n\n+ 5. 你可能想要考虑对新字段使用“自封装字段”（Self Encapsulate Field），以便通过访问方法将其隐藏起来。\n\
    \n## 反重构\n\n### 下推字段 (Push Down Field)\n\n## 相似的重构\n\n### 上提方法 (Pull Up Method)\n\
    \n## 消除异味\n\n### 重复代码 (Duplicate Code)\n\n## 上提方法 (Pull Up Method)\n\n### 问题\n\
    \n你的子类拥有执行相似工作的方法。\n\n![](img/a9f2bde5dbae80f6f98fa49ccbde8add_294_0.png)\n\n\
    ### 解决方案\n\n使方法完全相同，然后将它们移动到相关的父类中。\n\n![](img/a9f2bde5dbae80f6f98fa49ccbde8add_295_0.png)\n\
    \n## 为什么要重构\n\n子类独立地增长和发展，导致了相同（或几乎相同）的字段和方法。\n\n## 收益\n\n- 消除了重复代码。如果你需要对方法进行更改，在一个地方进行修改比在子类中搜索该方法的所有重复项要好。\n\
    \n- 如果由于某种原因，子类重新定义了父类方法但执行的是本质上相同的工作，也可以使用这种重构技术。\n\n## 如何重构\n\n+ 1. 调查父类中相似的方法。如果它们不相同，请将它们格式化以相互匹配。\n\
    \n+ 2. 如果方法使用了不同的参数集，请将参数以你希望在父类中看到的形式放置。\n\n+ 3. 将方法复制到子类中。在这里你可能会发现方法代码使用了仅存在于子类的字段和方法，因此在父类中不可用。要解决这个问题，你可以：\n\
    \n    * 对于字段：使用“上提字段”（Pull Up Field）或“自封装字段”（Self-Encapsulate Field）在子类中创建 getter\
    \ 和 setter；然后在父类中抽象地声明这些 getter。\n\n    * 对于方法：使用“上提方法”（Pull Up Method）或在父类中为它们声明抽象方法（注意，如果你的类之前不是抽象类，现在它将变为抽象类）。\n\
    \n+ 4. 从子类中删除这些方法。\n\n+ 5. 检查调用方法的地方。在某些地方，你可能可以将子类替换为父类。\n\n## 反重构\n\n+ ### 下推方法\
    \ (Push Down Method)\n\n## 相似的重构\n\n+ ### 上提字段 (Pull Up Field)\n\n## 帮助其他重构\n\n\
    + ### 模板方法 (Form Template Method)\n\n## 消除异味\n\n+ ### 重复代码 (Duplicate Code)\n\n\
    ## 上提构造函数体 (Pull Up Constructor Body)\n\n### 问题\n\n你的子类拥有代码大部分相同的构造函数。\n\n```java\n\
    class Manager extends Employee {\n    public Manager(String name, String id, int\
    \ grade) {\n    this.name = name;\n    this.id = id;\n    this.grade = grade;\n\
    \    }\n    // ...\n}\n```\n\n### 解决方案\n\n创建一个父类构造函数，并将子类中相同的代码移动到那里。在子类构造函数中调用父类构造函数。\n\
    \n```java\nclass Manager extends Employee {\npublic Manager(String name, String\
    \ id, int grade) {\n    super(name, id);\n    this.grade = grade;\n} // ...\n\
    ```\n\n## 为什么要重构\n\n这种重构技术与“上提方法”有什么不同？\n\n+ 1. 在 Java 中，子类不能继承构造函数，因此你不能简单地将“上提方法”应用于子类构造函数并在移除所有构造函数代码到父类后删除它。除了在父类中创建构造函数外，子类中也有具有简单委托给父类构造函数的构造函数。\n\
    \n+ 2. 在 C++ 和 Java 中（如果你没有显式调用父类构造函数），父类构造函数会在子类构造函数之前自动调用，这使得有必要只从子类构造函数的开始移动公共代码（因为你无法在子类构造函数的任意位置调用父类构造函数）。\n\
    \n+ 3. 在大多数编程语言中，子类构造函数可以拥有不同于父类参数的参数列表。因此，你应该只根据它真正需要的参数创建父类构造函数。\n\n## 如何重构\n\
    \n+ 1. 在父类中创建一个构造函数。\n\n+ 2. 从每个子类构造函数的开头提取公共代码到父类构造函数中。在这样做之前，尝试尽可能将多的公共代码移动到构造函数的开头。\n\
    \n+ 3. 将父类构造函数的调用放在子类构造函数的第一行。\n\n## 相似的重构\n\n上提方法 (Pull Up Method)\n\n消除异味\n\n\
    重复代码 (Duplicate Code)\n\n## 下推方法 (Push Down Method)\n\n### 问题\n\n父类中实现的行为是否只被一个（或少数几个）子类使用？\n\
    \n| 单元 |\n| --- |\n| getFuel() |\n\n![](img/a9f2bde5dbae80f6f98fa49ccbde8add_301_0.png)\n\
    \n### 解决方案\n\n将此行为移动到子类中。\n\n![](img/a9f2bde5dbae80f6f98fa49ccbde8add_302_0.png)\n\
    \n## 为什么要重构\n\n虽然计划在所有类中通用，但实际上它只在一个子类中使用。这种情况可能发生在计划的功能未能实现时。\n\n这也可能由于类层次结构的提取（移除）而发生。\n\
    \n如果你发现某个方法被多个子类使用但并非所有子类，那么创建一个子类并移动到那里是有用的。\n\n## 收益\n\n- 提高了类的内聚性。方法位于实际使用的地方。\n\
    \n## 如何重构\n\n+ 1. 创建一个子类并从父类复制代码。\n\n+ 2. 从父类中删除该方法。\n\n+ 3. 找到调用方法的地方并验证它从子类调用。\n\
    \n## 反重构\n\n+ ### 方法 (Pull Method)\n\n## 相似的重构\n\n+ ### 下推字段 (Push Down Field)\n\
    \n## 帮助其他重构\n\n+ ### 提取子类 (Extract Subclass)\n\n## 消除异味\n\n+ ### 拒绝继承 (Refused\
    \ Bequest)\n\n## 下推字段 (Push Down Field)\n\n### 问题\n\n一个字段是否只被少数子类使用？\n\n![](img/a9f2bde5dbae80f6f98fa49ccbde8add_305_0.png)\n\
    \n### 解决方案\n\n将字段移动到这些子类中。\n\n![](img/a9f2bde5dbae80f6f98fa49ccbde8add_306_0.png)\n\
    \n## 为什么要重构\n\n虽然计划在所有类中使用字段，但实际上它只在某些子类中使用。这种情况可能发生在计划的功能未能实现时。\n\n这也可能由于类层次结构的提取（移除）而发生。\n\
    \n## 收益\n\n- 改进了类的内聚性。字段位于实际使用的地方。\n\n## 如何重构\n\n当同时移动到多个子类时，你可以独立地开发这些字段。这确实产生了代码重复，所以只有当你确实打算以不同的方式使用字段时才下推字段。\n\
    \n+ 1. 在所有必要的子类中声明字段。\n\n+ 2. 从父类中删除该字段。\n\n## 提取子类 (Extract Subclass)\n\n###\
    \ 问题\n\n一个类拥有仅在某些情况下使用的特征。\n\n| 工作项目 |\n| --- |\n| getTotal() |\n| getUnitPrice()\
    \ |\n| getEmployee() |\n\n### 解决方案\n\n创建一个子类并在这些情况下使用它。\n\n![](img/a9f2bde5dbae80f6f98fa49ccbde8add_309_0.png)\n\
    \n## 为什么要重构\n\n你的主类拥有实现类某些罕见用例的方法和字段。虽然该用例很罕见，但该类负责它，将所有相关的字段和方法移动到独立的类中是错误的。但它们可以移动到子类中，这正是我们要通过这种重构技术所做的。\n\
    \n## 收益\n\n- 快速轻松地创建子类。\n\n"
