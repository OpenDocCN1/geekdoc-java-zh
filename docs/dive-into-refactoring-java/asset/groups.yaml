  - '[PAGE 102]


    # Good to Know


    # Performance


    This refactoring may prompt the question of whether this approach is liable to
    cause a performance hit. The honest answer is: yes, it''s, since the resulting
    code may be burdened by querying a new method. But with today''s fast CPUs and
    excellent compilers, the burden will almost always be minimal. By contrast, readable
    code and the ability to reuse this method in other places in program code – thanks
    to this refactoring approach – are very noticeable benefits.


    Nonetheless, if your temp variable is used to cache the result of a truly time-consuming
    expression, you may want to stop this refactoring after extracting the expression
    to a new method.


    # How to Refactor


    +   1. Make sure that a value is assigned to the variable once and only once within
    the method. If not, use Split Temporary Variable to ensure that the variable will
    be used only to store the result of your expression.


    +   2. Use Extract Method to place the expression of interest in a new method.
    Make sure that this method only returns a value and doesn''t change the state
    of the object. If the method'
  - '[PAGE 103]


