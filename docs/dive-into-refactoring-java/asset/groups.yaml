    # Preface


    I tried to cram all of the available information throughout the full course into
    this book. For the most part, I succeeded. But some things, such as live examples,
    are just impossible to present in the form of a static electronic book. Therefore,
    consider this book as auxiliary material, but not a replacement for the full refactoring
    course.


    The book is divided into two large sections: **Code Smells** and **Refactoring
    Techniques**. The first part describes various signs and symptoms of dirty code.
    The second part shows different methods to treat dirty code and make it clean.


    The book can be read both from cover to cover, as well as in random order. Despite
    the fact that all the topics are closely intertwined, you can easily jump around
    the chapters, using the great number of links scattered through the text.


    The code examples in this version of the book are in **Java**. There are other
    versions which are available for download inside your account.'
  - '[PAGE 5]


    # Code Smells


    Code smells are key signs that refactoring is necessary. In the process of refactoring,
    we get rid of smells, enabling further development of the application with equal
    or greater speed.


    ![](img/a9f2bde5dbae80f6f98fa49ccbde8add_5_0.png)


    The lack of regular refactoring, can lead to a complete paralysis of a project
    over time, wasting a few years of development and requiring you to spend several
    more years to rewrite it from scratch.


    Therefore, it is necessary to get rid of code smells while they are still small.'
  - '[PAGE 6]


    # Bloaters


    Bloaters are code, methods and classes that have increased to such gargantuan
    proportions that they''re hard to work with. Usually these smells don''t crop
    up right away, rather accumulate over time as the program evolves (and especially
    when nobody makes an effort to eradicate them).


    # Long Method


    A method contains too many lines of code. Generally, any method longer than ten
    lines should make you start asking questions.


    # Large Class


    A class contains many fields/methods/lines of code.


    # Primitive Obsession


    +   - Use of primitives instead of small objects for simple tasks (such as currency,
    ranges, special strings for phone numbers, etc.)

    - Use of constants for coding information (such as a constant USER_ADMIN_ROLE
    = 1 for referring to users with administrator rights.)

    - Use of string constants as field names for use in data arrays.


    # Long Parameter List


    More than three or four parameters for a method.'
  - '[PAGE 7]


    # Data Clumps


    Sometimes different parts of the code contain identical groups of variables (such
    as parameters for connecting to a database). These clumps should be turned into
    their own classes.'
  - '[PAGE 8]


    # Long Method


    # Signs and Symptoms


    A method contains too many lines of code. Generally, any method longer than ten
    lines should make you start asking questions.


    ![](img/a9f2bde5dbae80f6f98fa49ccbde8add_8_0.png)


    # Reasons for the Problem


    Like the Hotel California, something is always being added to a method but nothing
    is ever taken out. Since it''s easier to write code than to read it, this “smell”
    remains unnoticed until the method turns into an ugly, oversized beast.'
  - '[PAGE 9]


    Mentally, it’s often harder to create a new method than to add to an existing
    one: “But it’s just two lines, there’s no use in creating a whole method just
    for that...” Which means that another line is added and then yet another, giving
    birth to a tangle of spaghetti code.


    # Treatment


    As a rule of thumb, if you feel the need to comment on something inside a method,
    you should take this code and put it in a new method. Even a single line can and
    should be split into a separate method, if it requires explanations. And if the
    method has a descriptive name, nobody will need to look at the code to see what
    it does.


    ![](img/a9f2bde5dbae80f6f98fa49ccbde8add_9_0.png)


    +   - To reduce the length of a method body, use Extract Method.'
  - '[PAGE 10]


    +   If local variables and parameters interfere with extracting a method, use
    Replace Temp with Query, Introduce Parameter Object or Preserve Whole Object.


    +   If none of the previous recipes help, try moving the entire method to a separate
    object via Replace Method with Method Object.


    +   Conditional operators and loops are a good clue that code can be moved to
    a separate method. For conditionals, use Decompose Conditional. If loops are in
    the way, try Extract Method.


    # Payoff


    Among all types of object-oriented code, classes with methods live longest. The
    longer a method or function is, the harder it becomes to understand and maintain
    it.


    In addition, long methods offer the perfect hiding place for unwanted duplicate
    code.'
  - '[PAGE 11]


    ![](img/a9f2bde5dbae80f6f98fa49ccbde8add_11_0.png)


    # Performance


    Does an increase in the number of methods hurt performance, as many people claim?
    In almost all cases the impact is so negligible that it''s not even worth worrying
    about.


    Plus, now that you have clear and understandable code, you''re more likely to
    find truly effective methods for restructuring code and getting real performance
    gains if the need ever arises.'
