    | |

    | |


    ### 解决方案


    在经常使用该方法的类创建一个新方法，然后将代码从旧方法移动到那里。将原始方法的代码转换为另一个类中对新方法的引用，否则将其完全删除。


    ## 为什么要重构


    通常，一个字段在另一个类中使用的频率比在所属类中更高。当字段仅仅位于错误位置时，这条规则非常有帮助。这减少了类之间的（文本截断）。


