    \ absence would make the code cleaner, more efficient and easier to understand.\n\
    \n# Comments\n\nA method is filled with explanatory comments.\n\n# Duplicate Code\n\
    \nTwo code fragments look almost identical.\n\n# Lazy Class\n\nUnderstanding and\
    \ maintaining classes always costs time and money. So if a class doesn’t do enough\
    \ to earn your attention, it should be deleted.\n\n# Data Class\n\nA data class\
    \ refers to a class that contains only fields and crude methods for accessing\
    \ them (getters and setters). These are simply containers for data used by other\
    \ classes. These classes don’t contain any additional functionality and can’t\
    \ independently operate on the data that they own.\n\n# Dead Code\n\nA variable,\
    \ parameter, field, method or class is no longer used (usually because it’s obsolete).\n\
    \n# Speculative Generality\n\nThere's an unused class, method, field or parameter.\n\
    \n# Comments\n\n### Signs and Symptoms\n\nA method is filled with explanatory\
    \ comments.\n\n![](img/a9f2bde5dbae80f6f98fa49ccbde8add_50_0.png)\n\n### Reasons\
    \ for the Problem\n\nComments are usually created with the best of intentions,\
    \ when the author realizes that his or her code isn't intuitive or obvious. In\
    \ such cases, comments are like a deodorant masking the smell of fishy code that\
    \ could be improved.\n\n> The best comment is a good name for a method or class.\n\
    \nIf you feel that a code fragment can't be understood with comments, try to change\
    \ the code structure in a way that makes comments unnecessary.\n\n# Treatment\n\
    \n- If a comment is intended to explain a complex expression, the expression should\
    \ be split into understandable subexpressions using Extract Variable.\n\n- If\
    \ a comment explains a section of code, this section can be turned into a separate\
    \ method via Extract Method. The name of the new method can be taken from the\
    \ comment text itself, most likely.\n\n- If a method has already been extracted,\
    \ but comments are necessary to explain what the method does, give the method\
    \ a self-explanatory name. Use Rename Method for this.\n\n- If you need to assert\
    \ rules about a state that's necessary for the system to work, use Introduce Assertion.\n\
    \n# Payoff\n\nCode becomes more intuitive and obvious.\n\n![](img/a9f2bde5dbae80f6f98fa49ccbde8add_52_0.png)\n\
    \n# When to Ignore\n\nComments can sometimes be useful:\n\n- When explaining **why**\
    \ something is being implemented in a particular way.\n- When explaining complex\
    \ algorithms (when all other methods for simplifying the algorithm have been tried\
    \ and come up short).\n\n# Duplicate Code\n\n### Signs and Symptoms\n\nTwo code\
    \ fragments look almost identical.\n\n![](img/a9f2bde5dbae80f6f98fa49ccbde8add_53_0.png)\n\
    \n### Reasons for the Problem\n\nDuplication usually occurs when multiple programmers\
    \ are working on different parts of the same program at the same time. Since they're\
    \ working on different tasks, they may be unaware their colleague has already\
    \ written similar code that could be repurposed for their own needs.\n\nThere's\
    \ also more subtle duplication, when specific parts of code look different but\
    \ actually perform the same job. This kind of duplication can be hard to find\
    \ and fix.\n\nSometimes duplication is purposeful. When rushing to meet deadlines\
    \ and the existing code is “almost right” for the job, novice programmers may\
    \ not be able to resist the temptation of copying and pasting the relevant code.\
    \ And in some cases, the programmer is simply too lazy to de-clutter.\n\n# Treatment\n\
    \n- If the same code is found in two or more methods in the same class: use Extract\
    \ Method and place calls for the new method in both places.\n\n![](img/a9f2bde5dbae80f6f98fa49ccbde8add_54_0.png)\n\
    \n- If the same code is found in two subclasses of the same level:\n  - Use Extract\
    \ Method for both classes, followed by Pull Field for the fields used in the method\
    \ that you're pulling up.\n\n- If the duplicate code is inside a constructor,\
    \ use Pull Up Constructor Body.\n\n- If the duplicate code is similar but not\
    \ completely identical, use Form Template Method.\n\n- If two methods do the same\
    \ thing but use different algorithms, select the best algorithm and apply Substitute\
    \ Algorithm.\n\n- If duplicate code is found in two different classes:\n  - If\
    \ the classes aren't part of a hierarchy, use Extract Superclass in order to create\
    \ a single superclass for these classes that maintains all the previous functionality.\n\
    \  - If it's difficult or impossible to create a superclass, use Extract Class\
    \ in one class and use the new component in the other.\n\n- If a large number\
    \ of conditional expressions are present and perform the same code (differing\
    \ only in their conditions), merge these operators into a single condition using\
    \ Consolidate Conditional Expression and use Extract Method to place the condition\
    \ in a separate method with an easy-to-understand-name.\n\n- If the same code\
    \ is performed in all branches of a conditional expression: place the identical\
    \ code outside of the condition tree by using Consolidate Duplicate Conditional\
    \ Fragments.\n\n# Payoff\n\n- Merging duplicate code simplifies the structure\
    \ of your code and makes it shorter.\n- Simplification + shortness = code's easier\
    \ to simplify and cheaper to support.\n\n![](img/a9f2bde5dbae80f6f98fa49ccbde8add_56_0.png)\n\
    \n# When to Ignore\n\nIn very rare cases, merging two identical fragments of code\
    \ can make the code less intuitive and obvious.\n\n# Lazy Class\n\n### Signs and\
    \ Symptoms\n\nUnderstanding and maintaining classes always costs time and money.\
    \ So if a class doesn't do enough to earn your attention, it should be deleted.\n\
    \n![](img/a9f2bde5dbae80f6f98fa49ccbde8add_58_0.png)\n\n### Reasons for the Problem\n\
    \nPerhaps a class was designed to be fully functional but after some of the refactoring\
    \ it has become ridiculously small.\n\nOr perhaps it was designed to support future\
    \ development work that never got done.\n\n# Treatment\n\n- Components that are\
    \ near-useless should be given the Inline Class treatment.\n- For subclasses with\
    \ few functions, try Collapse Hierarchy.\n\n![](img/a9f2bde5dbae80f6f98fa49ccbde8add_59_0.png)\n\
    \n# Payoff\n\n- Reduced code size.\n- Easier maintenance.\n\n# When to Ignore\n\
    \nSometimes a Lazy Class is created in order to delineate intentions for future\
    \ development, In this case, try to maintain a balance between clarity and simplicity\
    \ in your code.\n\n# Data Class\n\n### Signs and Symptoms\n\nA class refers to\
    \ a class that contains only fields and crude methods for accessing them (getters\
    \ and setters). These are simply containers for data used by other classes. These\
    \ classes don’t contain any additional functionality and can’t independently operate\
    \ on the data that they own.\n\n![](img/a9f2bde5dbae80f6f98fa49ccbde8add_60_0.png)\n\
    \n### Reasons for the Problem\n\nIt's a normal thing when a newly created class\
    \ contains only a few public fields (and maybe even a handful of getters/setters).\
    \ But the true power of objects is that they can contain behavior types or operations\
    \ on their data.\n\n# Treatment\n\n- If a class contains public fields, use Encapsulate\
    \ Field to hide them from direct access and require that access be performed via\
    \ getters and setters only.\n- Use Encapsulate Collection for data stored in collections\
    \ (such as arrays).\n- Review the client code that uses the class. In it, you\
    \ may find functionality that would be better located in the data class itself.\
    \ If this is the case, use Move Method and Extract Method to migrate this functionality\
    \ to the data class.\n- After the class has been filled with well thought out\
    \ methods, you may want to get rid of old methods for data access that give overly\
    \ broad access to the class data. For this, Remove Setting Method and Hide Method\
    \ may be helpful.\n\n![](img/a9f2bde5dbae80f6f98fa49ccbde8add_61_0.png)\n\n# Payoff\n\
    \n- Improves understanding and organization of code. Operations on particular\
    \ data are now gathered in a single place, instead of haphazardly throughout the\
    \ code.\n- Helps you to spot duplication of client code.\n"
  mdcn: "\n\n# 易弃物\n\n易弃物是指毫无意义且不需要的东西，它的缺失会让代码变得更简洁、更高效且更容易理解。\n\n# 注释\n\n一个方法中充斥着解释性的注释。\n\
    \n# 重复代码\n\n两个代码片段看起来几乎相同。\n\n# 懒类\n\n理解和维护类总是需要花费金钱。因此，如果一个类的功能不足以引起你的关注，就应该将其删除。\n\
    \n# 数据类\n\n数据类是指仅包含字段以及访问这些字段的原始方法（getter 和 setter）的类。它们仅仅是其他类使用的数据容器。这些类不包含任何额外功能，并且无法独立地对拥有的数据进行操作。\n\
    \n# 死代码\n\n变量、参数、字段、方法或类不再被使用（通常是因为它们已经过时）。\n\n# 推测性泛化\n\n存在未使用的类、方法、字段或参数。\n\n\
    # 注释\n\n### 征象与症状\n\n一个方法中充斥着解释性的注释。\n\n![](img/a9f2bde5dbae80f6f98fa49ccbde8add_50_0.png)\n\
    \n### 问题产生的原因\n\n注释通常是出于良好的意图创建的，当作者意识到代码并不直观或显而易见时。在这种情况下，注释就像去味剂，掩盖了可以改进的“鱼臭代码”的味道。\n\
    \n> 最好的注释是为方法或类起一个好名字。\n\n如果你觉得一个代码片段无法通过注释来理解，尝试更改代码结构，使注释变得不再必要。\n\n# 治疗\n\n\
    - 如果注释是为了解释一个复杂的表达式，则应该使用“提取变量”（Extract Variable）将该表达式拆分为易于理解的子表达式。\n\n- 如果注释解释了某部分代码，可以通过“提取方法”（Extract\
    \ Method）将该部分转换为独立的方法。新方法的名称很可能可以直接取自注释文本本身。\n\n 如果 如果方法已经经过了提取，但仍需要注释来解释该方法的作用，请给该方法起一个自解释的名称。使用“重命名方法”（Rename\
    \ Method）来实现。\n\n- 如果你需要对系统运行所必需的状态规则进行断言，请使用“引入断言”（Introduce Assertion）。\n\n\
    # 收益\n\n代码变得更加直观且显而易见。\n\n![](img/a9f2bde5dbae80f6f98fa49ccbde8add_52_0.png)\n\
    \n# 何时忽略\n\n注释有时是有用的：\n\n- 在解释**为什么**要以特定方式实现某些功能时。\n- 在解释复杂算法时（当尝试了所有简化算法的其他方法都无果时）。\n\
    \n# 重复代码\n\n### 征象与症状\n\n两个代码片段看起来几乎相同。\n\n![](img/a9f2bde5dbae80f6f98fa49ccbde8add_53_0.png)\n\
    \n### 问题产生的原因\n\n代码重复通常发生在多个程序员同时处理同一个程序的不同部分时。由于他们正在处理不同的任务，他们可能没有意识到同事已经写了类似代码，而这些代码可以被复用于他们自己的需求。\n\
    \n还存在更微妙的重复，即特定的代码部分看起来不同，但实际上执行的是相同的工作。这种重复很难发现和修复。\n\n有时重复是有刻意的。在赶于期限截止日期且现有代码对于任务来说“几乎正确”时，初级程序员可能无法抵御复制和粘贴相关代码的诱惑。在某些情况下，程序员只是太懒于去清理。\n\
    \n# 治疗\n\n- 如果在同一类的两个或多个方法中发现了相同的代码：使用“提取方法”（Extract Method），并在两个地方都调用新方法。\n\n\
    ![](img/a9f2bde5dbae80f6f98fa49ccbde8add_54_0.png)\n\n- 如果在同级的两个子类中发现了相同的代码：\n\
    \  - 对两个类都使用“提取方法”，然后对于方法中所使用的字段使用“上字段”（Pull Field）。\n\n- 如果重复代码在构造函数内部，使用“提取构造函数体”（Pull\
    \ Up Constructor Body）。\n\n- 如果重复代码相似但并非完全相同，使用“形成模板方法”（Form Template Method）。\n\
    \n- 如果两个方法执行相同的操作但使用不同的算法，选择最好的算法并应用“替换算法”（Substitute Algorithm）。\n\n- 如果在两个不同的类中发现重复代码：\n\
    \  - 如果这些类不属于同一个层次结构，使用“提取超类”（Extract Superclass）为这些类创建一个单一的超类，以维护之前所有的功能。\n \
    \ - 如果很难或无法创建超类，则在一个类中使用“提取类”（Extract Class），并在另一个类中使用这个新组件。\n\n- 如果存在大量的条件表达式并执行相同的代码（仅在条件上不同），使用“合并条件表达式”（Consolidate\
    \ Conditional Expression）将这些运算符合并为单个条件，并使用“提取方法”（Extract Method）将该条件放在一个易理解名称的独立方法中。\n\
    \n- 如果在条件表达式的所有分支中执行了相同的代码：通过“合并重复条件片段”（Consolidate Duplicate Conditional Fragments）将相同的代码放置在条件树之外。\n\
    \n# 收益\n\n- 合并重复代码简化了你的代码结构并使其更短。\n- 简化 + 缩短 = 代码更容易简化且维护成本更低廉。\n\n![](img/a9f2bde5dbae80f6f98fa49ccbde8add_56_0.png)\n\
    \n# 何时忽略\n\n在极少数情况下，合并两个相同的代码片段可能会让代码不再直观和显而易见。\n\n# 懒类\n\n### 征象与症状\n\n理解和维护类总是需要花费金钱。因此，如果一个类的功能不足以引起你的关注，就应该将其删除。\n\
    \n![](img/a9f2bde5dbae80f6f98fa49ccbde8add_58_0.png)\n\n### 问题产生的原因\n\n也许一个类设计时是完全功能的，但经过某些重构后它变得非常小。\n\
    \n或者，它的设计是为了支持那些从未完成的未来开发工作。\n\n# 治疗\n\n- 几乎无用的组件应该进行“内联类”（Inline Class）处理。\n\
    - 对于功能少的子类，尝试“折叠层次结构”（Collapse Hierarchy）。\n\n![](img/a9f2bde5dbae80f6f98fa49ccbde8add_59_0.png)\n\
    \n# 收益\n\n- 减少了代码体积。\n- 更容易维护。\n\n# 何时忽略\n\n有时创建懒类是为了规划未来的开发，在这种情况下，尝试在代码的清晰性和简单之间保持平衡。\n\
    \n# 数据类\n\n### 征象与症状\n\n数据类是指仅包含字段以及访问这些字段的原始方法（getter 和 setter）的类。它们仅仅是其他类使用的数据容器。这些类不包含任何额外功能，并且无法独立地对拥有的数据进行操作。\n\
    \n![](img/a9f2bde5dbae80f6f98fa49ccbde8add_60_0.png)\n\n### 问题产生的原因\n\n新创建的类只包含几个公共字段（可能还有一些\
    \ getter/setter）是很正常的。但对象的真正威力在于它们可以包含行为类型操作。\n\n# 治疗\n\n- 如果类包含公共字段，使用“封装字段”（Encapsulate\
    \ Field）来隐藏这些直接访问，并要求仅通过 getter 和 setter 进行访问。\n\n- 对于存储在集合中的数据（如数组），使用“封装集合”（Encapsulate\
    \ Collection）。\n\n- 检查使用该类的客户端代码。其中，你可能会发现更适合放在数据类本身中的功能。如果是这样，使用“移动方法”（Move Method）和“提取方法”（Extract\
    \ Method）将此功能迁移到数据类中。\n- 在类被填充了经过深熟虑的方法后，你可能想要删除那些提供过度宽泛数据访问的旧访问方法。对于此，“移除设置方法”（Remove\
    \ Setting Method）和“隐藏方法”（Hide Method）可能会很有帮助。\n\n![](img/a9f2bde5dbae80f6f98fa49ccbde8add_61_0.png)\n\
    \n# 收益\n\n- 改进了代码的理解和组织。对特定数据的操作现在集中在一个地方，而不是杂乱分布在代码中。\n- 帮助你发现客户端代码的重复。\n\n"
