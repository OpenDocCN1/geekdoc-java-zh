    obtained for the method'
  - '[PAGE 265]


    are changed, you will need to carefully find a dozen places in the program and
    implement these changes in each of them.


    After you apply this refactoring technique, the code for getting all necessary
    data will be stored in one place – the method itself.


    # Benefits


    +   - Instead of a hodgepodge of parameters, you see a single object with a comprehensible
    name.


    +   - If the method needs more data from an object, you won''t need to rewrite
    all the places where the method is used – merely inside the method itself.


    # Drawbacks


    Sometimes this transformation causes a method to become less flexible: previously
    the method could get data from many different sources but now, because of refactoring,
    we''re limiting its use to only objects with a particular interface.


    # How to Refactor


    +   1. Create a parameter in the method for the object from which you can get
    the necessary values.'
