  - '[PAGE 128]


    # Why Refactor


    Classes always start out clear and easy to understand. They do their job and mind
    their own business as it were, with-out butting into the work of other classes.
    But as the program expands, a method is added and then a field... and eventually,
    some classes are performing more responsibilities than ever envisioned.


    # Benefits


    +   - This refactoring method will help maintain adherence to the Single Responsibility
    Principle. The code of your classes will be more obvious and understandable.


    +   - Single-responsibility classes are more reliable and tolerant of changes.
    For example, say that you have a class responsible for ten different things. When
    you change this class to make it better for one thing, you risk breaking it for
    the nine others.


    # Drawbacks


    If you "overdo it" with this refactoring technique, you will have to resort to
    **Inline Class**.


    # How to Refactor


    Before starting, decide on how exactly you want to split up the responsibilities
    of the class.'
  - '[PAGE 129]


    +   1. Create a new class to contain the relevant functionality.


    +   2. Create a relationship between the old class and the new one.

    Optimally, this relationship is unidirectional; this allows reusing the second
    class without any issues. Nonetheless, if you think that a two-way relationship
    is necessary, this can always be set up.


    +   3. Use Move Field and Move Method for each field and method that you have
    decided to move to the new class. For methods, start with private ones in order
    to reduce the risk of making a large number of errors. To relocate just a little
    bit at a time and test the results after each move, in order to avoid a pileup
    of error-fixing at the very end.


    After you''re done moving, take one more look at the resulting classes. An old
    class with changed responsibilities may be renamed for increased clarity. Check
    again to whether you can get rid of two-way class relationships, if any are present.


    +   4. Also give thought to accessibility to the new class from the outside. You
    can hide the class from the client entirely by making it private, managing it
    via the fields from the old class. Alternatively, you can make it a public by
    allowing the client to change values directly. Your decision here depends on how
    safe it''s for the behavior of the old class when unexpected changes are made
    to the values in the new class.'
- md: "\n## Anti-refactoring\n\n- Inline Class\n\n## Similar refactorings\n\n- Extract\
    \ Subclass\n- Replace Data Value with Object\n\n## Eliminates smell\n\n- Duplicate\
    \ Code\n- Large Class\n- Divergent Change\n- Data Clumps\n- Primitive Obsession\n\
    - Temporary Field\n- Inappropriate Intimacy\n\n## Inline Class\n\n## Problem\n\
    \nA class does almost nothing and isn’t responsible for anything, and no additional\
    \ responsibilities are planned for it.\n\n| Person | TelephoneNumber |\n| ---\
    \ | --- |\n| name | officeAreaCode officeNumber |\n| getTelephoneNumber() | getTelephoneNumber()\
    \ |\n\n## Solution\n\nMove all features from the class to another one.\n\n| Person\
    \ |\n| --- |\n| name officeAreaCode officeNumber |\n| getTelephoneNumber() |\n\
    \n## Why Refactor\n\nOften this technique is needed after the features of one\
    \ class are “transplanted” to other classes, leaving that class with little to\
    \ do.\n\n## Benefits\n\nEliminating needless classes frees up operating memory\
    \ on the computer – and bandwidth in your head.\n\n## How to Refactor\n\n1. In\
    \ the recipient class, create the public fields and methods present in the donor\
    \ class. Methods should refer to the equivalent methods of the donor class.\n\n\
    2. Replace all references to the donor class with references to the fields and\
    \ methods of the recipient class.\n\n3. Now test the program and make sure that\
    \ no errors have been added. If tests show that everything is working A-OK, start\
    \ using Move Method Move Field to completely transplant all functionality to the\
    \ recipient class from the original one. Continue doing so until the original\
    \ class is completely empty.\n\n4. Delete the original class.\n\n## Anti-refactoring\n\
    \n- Extract Class\n\n## Eliminates smell\n\n- Shotgun Surgery\n- Lazy Class\n\
    - Speculative Generality\n\n## Hide Delegate\n\n## Problem\n\nThe client gets\
    \ object B from a field or method of object A. Then the client calls a method\
    \ of object B.\n\n![](img/a9f2bde5dbae80f6f98fa49ccbde8add_134_0.png)\n\n## Solution\n\
    \nCreate a new method in class A that delegates the call to object B. Now the\
    \ client doesn't know about, or depend on, class B.\n\n![](img/a9f2bde5dbae80f6f98fa49ccbde8add_135_0.png)\n\
    \n## Why Refactor\n\nTo start with, let's look at terminology:\n\n- *Server is\
    \ the object to which the client has direct access.*\n- *Delegate is the end object\
    \ that contains the functionality needed by the client.*\n\nA call chain appears\
    \ when a client requests an object from another object, then the second object\
    \ requests another one, and so on. These sequences of calls involve the client\
    \ in navigation along the class structure. Any changes in these relationships\
    \ will require changes on the client side.\n\n## Benefits\n\nHides delegation\
    \ from the client. The less that the client code needs to know about the details\
    \ of relationships between objects, the easier it's to make changes to your program.\n\
    \n## Drawbacks\n\nIf you need to create an excessive number of delegating methods,\
    \ `server-class` risks becoming an unneeded go-between, leading to an excess of\
    \ **Middle Man**.\n\n## How to Refactor\n\n- For each method of the `delegate-class`\
    \ called by the client, create a method in the `server-class` that delegates the\
    \ call to the `delegate-class`.\n\n- Change the client code so that it calls the\
    \ methods of the `server-class`.\n\n- If your changes free the client from needing\
    \ the `delegate-class`, you can remove the access method to the `delegate-class`\
    \ from the `server-class` (the method that was originally used to get the `delegate-class`).\n\
    \n## Anti-refactoring\n\n- Remove Middle Man\n\n## Eliminates smell\n\n- Message\
    \ Chains\n- Inappropriate Intimacy\n\n## Remove Middle Man\n\n## Problem\n\nA\
    \ class has too many methods that simply delegate to other objects.\n\n![](img/a9f2bde5dbae80f6f98fa49ccbde8add_138_0.png)\n\
    \n## Solution\n\nDelete these methods and force the client to call the end methods\
    \ directly.\n\n![](img/a9f2bde5dbae80f6f98fa49ccbde8add_139_0.png)\n\n## Why Refactor\n\
    \nTo describe this technique, we'll use the terms from **Delegate**, which are:\n\
    \n- *Server* is the object to which the client has direct access.\n- *Delegate*\
    \ is the end object that contains the functionality needed by the client.\n\n\
    There are two types of problems:\n\n1. The *server-class* doesn't do anything\
    \ itself and simply creates needless complexity. In this case, give thought to\
    \ whether this class is needed at all.\n\nEvery time a new feature is added to\
    \ the *delegate*, you need to create a delegating method for it in the *server-class*.\
    \ If a lot of changes are made, this will be rather tiresome.\n\n## How to Refactor\n\
    \n- Create a getter for accessing the *delegate-class* object from the *server-class*\
    \ object.\n\n- Replace calls to delegating methods in the *server-class* with\
    \ direct calls for methods in the *delegate-class*.\n\n## Anti-refactoring\n\n\
    ## Hide Delegate\n\n## Eliminates smell\n\n## Middle Man\n\n## Introduce Foreign\
    \ Method\n\n## Problem\n\nA utility class doesn’t contain the method that you\
    \ need and you can’t add the method to the class.\n\n```\nclass Report {\n  //\
    \ ...\n  void sendReport() {\n    Date nextDay = new Date(previousEnd.getYear(),\n\
    \      previousEnd.getMonth(), previousEnd.getDate() + 1);\n    // ...\n  }\n\
    }\n```\n\n```\n## Solution\n\n```\nclass Report {\n  // ...\n```\n\n```\nvoid\
    \ sendReport() {\n    Date nextStart = nextDay(previousEnd);\n    // ...\n}\n\
    private static Date nextDay(Date arg) {\n    return new Date(arg.getYear(), arg.getMonth(),\
    \ arg.getDate() + 1)\n}\n```\n\n## Why Refactor\n\nYou have code that uses the\
    \ data and methods of a certain class. You realize that the code will look and\
    \ work much better inside a new method in the class. But you can't add the method\
    \ to the class because, for example, the class is located in a third-party library.\n\
    \nThis refactoring has a big payoff when the code that you want to move to the\
    \ method is repeated several times in different places in your program.\n\nSince\
    \ you're passing an object of the utility class to the parameters of the new method,\
    \ you have access to all of its fields. Inside the method, you can do practically\
    \ everything that you want, as if the method were part of the utility class.\n\
    \n## Benefits\n\nRemoves code duplication. If your code is repeated in several\
    \ places, you can replace these code fragments with a method call. This is better\
    \ than duplication even considering that the foreign method is located in a suboptimal\
    \ place.\n\n## Drawbacks\n\nThe reasons for having the method of a utility class\
    \ in a client class won't always be clear to the person maintaining the code after\
    \ you. If the method can be used in other classes, you could benefit by creating\
    \ a wrapper for the utility class and placing the method there. This is also beneficial\
    \ when there are several utility methods. Introduce Local Extension can help with\
    \ this.\n\n## How to Refactor\n\n1. Create a new method in the client class.\n\
    \n2. In this method, create a parameter to which the object of the utility class\
    \ will be passed. If this object can be obtained from the client class, you don't\
    \ have to create such a parameter.\n\n3. Extract the relevant code fragments to\
    \ this method and replace them with method calls.\n\n4. Be sure to leave the Foreign\
    \ method tag in the comments for the method along with the advice to place this\
    \ method in a utility class if such becomes later. This will make it easier to\
    \ understand why this method is located in this particular class for those who'll\
    \ be maintaining the software in the future.\n\n## Similar refactorings\n\n- Introduce\
    \ Local Extension\n\nMove all extension methods to a separate class, which is\
    \ wrapper or a subclass of some service class.\n\n## Eliminates smell\n\n- Incomplete\
    \ Library Class\n\n## Introduce Local Extension\n\n## Problem\n\nA utility class\
    \ doesn’t contain some methods that you need. But you can’t add these methods\
    \ to the class.\n\n| ClientClass |\n| nextDay(:Date) : Date |\n\n## Solution\n\
    \nCreate a new class containing the methods and make it either the child or wrapper\
    \ of the utility class.\n"
  mdcn: "\n\n## 反重构\n\n- 内联类 (Inline Class)\n\n## 相似的重构\n\n- 提取子类\n- 用对象替换数据值\n\n\
    ## 消除气味\n\n- 重复代码\n- 大类\n- 散乱变化\n- 数据聚类\n- 基本类型痴迷\n- 临时字段\n- 不适当的亲密关系\n\n## 内联类\n\
    \n## 问题\n\n一个类几乎什么都不做，也不对任何事情负责，而且没有为它计划额外的职责。\n\n| Person | TelephoneNumber |\n\
    | --- | --- |\n| name | officeAreaCode officeNumber |\n| getTelephoneNumber()\
    \ | getTelephoneNumber() |\n\n## 解决方案\n\n将该类中的所有功能移动到另一个类。\n\n| Person |\n| ---\
    \ |\n| name officeAreaCode officeNumber |\n| getTelephoneNumber() |\n\n## 为什么要重构\n\
    \n通常在某个类的功能被“移植”到其他类后，需要这种技术，导致该类变得无事可做。\n\n## 益处\n\n消除必要的类可以释放计算机的运行内存——以及你大脑中的带宽。\n\
    \n## 如何重构\n\n1. 在接收者类中，创建捐赠类中存在的公共字段和方法。方法应该引用捐赠类的等效方法。\n\n2. 将所有对捐赠类的引用替换为对接收者类字段和方法的引用。\n\
    \n3. 现在测试程序并确保没有引入任何错误。如果测试显示一切运行正常，开始使用“移动方法 (Move Method)”和“移动字段 (Move Field)”将所有功能从原始类完全移植到接收者类。继续这样做，直到原始类完全为空。\n\
    \n4. 删除原始类。\n\n## 反重构\n\n- 提取类\n\n## 消除气味\n\n- 散弹枪手术\n- 懒惰类\n- 推测性泛化\n\n## 隐藏委托\
    \ (Hide Delegate)\n\n## 问题\n\n客户端从对象 A 的字段或方法获取对象 B。然后客户端调用对象 B 的方法。\n\n![](img/a9f2bde5dbae80f6f98fa49ccbde8add_134_0.png)\n\
    \n## 解决方案\n\n在类 A 中创建一个新方法，将调用委托给对象 B。现在客户端不知道类 B，也不依赖类 B。\n\n![](img/a9f2bde5dbae80f6f98fa49ccbde8add_135_0.png)\n\
    \n## 为什么要重构\n\n首先，让我们来看术语：\n\n- *服务端 (Server) 是客户端直接访问的对象。*\n- *委托对象 (Delegate)\
    \ 是包含客户端所需功能的终端对象。*\n\n当客户端从另一个对象请求对象时，第二个对象再请求另一个，依此类推，就会出现调用链。这些调用序列让客户端参与到类结构的导航中。这些关系中的任何变化都需要客户端侧进行更改。\n\
    \n## 益处\n\n向客户端隐藏委托。客户端代码需要了解的对象之间关系的细节越少，修改你的程序就越容易。\n\n## 缺点\n\n如果你需要创建大量的委托方法，`server-class`\
    \ 可能会变成一个不必要的中间人，导致过多的**中间人 (Middle Man)**。\n\n## 如何重构\n\n- 针对客户端调用的 `delegate-class`\
    \ 的每个方法，在 `server-class` 中创建一个该方法，将该调用委托给 `delegate-class`。\n\n- 修改客户端代码，使其调用\
    \ `server-class` 的方法。\n\n- 如果你的更改让客户端不再需要 `delegate-class`，你可以从 `server-class`\
    \ 中移除对 `delegate-class` 的访问方法（即最初用于获取 `delegate-class` 的方法）。\n\n## 反重构\n\n- 移除中间人\n\
    \n## 消除气味\n\n- 消息链\n- 不适当的亲密关系\n\n## 移除中间人\n\n## 问题\n\n一个类有太多的方法简单地委托给其他对象。\n\n\
    ![](img/a9f2bde5dbae80f6f98fa49ccbde8add_138_0.png)\n\n## 解决方案\n\n删除这些方法并强制客户端直接调用终端方法。\n\
    \n![](img/a9f2bde5dbae80f6f98fa49ccbde8add_139_0.png)\n\n## 为什么要重构\n\n为了描述这种技术，我们将使用来自**委托\
    \ (Delegate)** 的术语：\n\n- *服务端 (Server)* 是客户端直接访问的对象。\n- *委托对象 (Delegate)* 是包含客户端所需功能的终端对象。\n\
    \n存在存在两种类型的问题：\n\n1. *服务端类 (server-class)* 本身什么都不做，只是创建了不必要的复杂性。在这种情况下，考虑这个类是否真的需要。\n\
    \n每当向 *委托对象* 添加新功能时，你都需要在 *服务端类* 中为它创建一个委托方法。如果发生了大量更改，这将是非常乏味。\n\n## 如何重构\n\n\
    - 创建一个 getter，用于从 *服务端类* 对象访问 *委托类 (delegate-class)* 对象。\n\n- 将 *服务端类* 中对委托方法的调用替换为对\
    \ *委托类*方法的直接调用。\n\n## 反重构\n\n## 隐藏委托\n\n## 消除气味\n\n## 中间人\n\n## 引入外部方法 (Introduce\
    \ Foreign Method)\n\n## 问题\n\n一个工具类没有包含你需要的方法，而你无法将该方法添加到该类中。\n\n```\nclass Report\
    \ {\n  // ...\n  void sendReport() {\n    Date nextDay = new Date(previousEnd.getYear(),\n\
    \      previousEnd.getMonth(), previousEnd.getDate() + 1);\n    // ...\n  }\n\
    }\n```\n\n## 解决方案\n\n```\nclass Report {\n  // ...\n```\n\n```\nvoid sendReport()\
    \ {\n    Date nextStart = nextDay(previousEnd);\n    // ...\n}\n\nprivate static\
    \ Date nextDay(Date arg) {\n    return new Date(arg.getYear(), arg.getMonth(),\
    \ arg.getDate() + 1)\n}\n```\n\n## 为什么要重构\n\n你有代码使用了某个类的数据和方法。你发现这些代码在一个新方法中运行会好得多。但你无法将方法添加到该类中，例如该类位于第三方库。\n\
    \n当你想要移动方法的代码在程序中多次重复时，这种重构具有巨大的回报。\n\n由于你将工具类的对象作为方法的参数传递，你可以访问它的所有字段。在方法内部，你可以几乎执行任何你想的操作。\n\
    \n## 益处\n\n消除了代码重复。如果你的代码在多处重复，你可以将这些代码片段替换为方法调用。考虑到外部方法的位置并不理想，这比重复要好。\n\n##\
    \ 缺点\n\n对于维护代码的人来说，在客户端类中使用外部方法的原因并不总是清晰。如果方法可以在其他类中使用，你可以通过为工具类创建一个包装器并将方法放在那里来受益。这在有多个工具方法时也有利。\n\
    \n## 如何重构\n\n1. 在客户端类中创建一个新方法。\n\n2. 在此方法中，创建一个参数，将工具类对象传递进去。如果该对象可以从客户端类获取，则不需要创建这样的参数。\n\
    \n3. 将相关的代码片段提取到此方法中，并将其替换为方法调用。\n\n4. 确保在方法的注释中留下外部方法（Foreign method）标签，并建议以后以后可以将该方法放在工具类中。这将有助于未来的维护者理解为什么该方法位于特定的类中。\n\
    \n## 相似的重构\n\n- 引入本地扩展\n\n将所有扩展方法移动到一个独立的类中，该类是某些服务类的包装器或子类。\n\n## 消除气味\n\n- 不完整的库类\n\
    \n## 引入本地扩展\n\n## 问题\n\n一个工具类没有包含你需要的一些方法。但你无法将这些方法添加到类中。\n\n| ClientClass |\n\
    | nextDay(:Date) : Date |\n\n## 解决方案\n\n创建一个包含这些方法的新类，并使其成为工具类的子类或包装器。\n\n"
