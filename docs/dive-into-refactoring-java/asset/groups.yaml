    \ a wrapper, create a field in it for storing the utility class object to which\
    \ delegation will be made. When using this option, you will need to also create\
    \ methods that repeat the public methods of the utility class and contain simple\
    \ delegation to the methods of the utility object.\n\n+   2. Create a constructor\
    \ that uses the parameters of the constructor of the utility class.\n\n+   3.\
    \ Also create an alternative “converting” constructor that takes only the object\
    \ of the original class in its parameters. This will help to substitute the extension\
    \ for the objects of the original class."
