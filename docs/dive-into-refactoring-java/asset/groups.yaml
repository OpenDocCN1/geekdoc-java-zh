    # Why Refactor


    The most obvious reason for using this refactoring technique is related to Replace
    Type Code with Subclasses.


    You have code in which an object was previously created and the value of the coded
    type was passed to it. After use of the refactoring method, several subclasses
    have appeared and from them you need to create objects depending on the value
    of the coded type. Changing the original constructor to make it return subclass
    objects is impossible, so instead we create a static factory method that will
    return objects of the necessary classes, after which it replaces all calls to
    the original constructor.


    Factory methods can be used in other situations as well, when constructors aren''t
    up to the task. They can be important when attempting to Change Value to Reference.
    They can also be used to set various creation modes that go beyond the number
