    # 简化方法调用


    这些技术让方法调用变得简单且易于理解。这反过来简化了类与类之间交互的接口。


    # 重命名方法


    **问题：** 方法名没有解释该方法的作用。


    **解决方案：** 重命名该方法。


    # 添加参数


    **问题：** 方法没有足够的数据来执行某些操作。


    **解决方案：** 创建一个新参数来传递必须的数据。


    # 移除参数


    **问题：** 参数在方法体内没有被使用。


    **解决方案：** 移除未使用的参数。


    # 分离查询与修改


    **问题：** 你是否有一个方法既返回结果，又修改了对象内部的内容？


    **解决方案：** 将该方法拆分为两个独立的方法。正如你预期的，其中一个应该返回结果，另一个则修改对象。


    # 方法参数


    **问题：** 多个方法执行相似的操作，仅在内部值、数字或操作上不同。


    **解决方案：** 通过一个传递必要的特殊值的参数来合并这些方法。


    # 将参数替换为显式方法


    **问题：** 方法被拆分为若干部分，每个部分根据参数的值决定运行。


    **解决方案：** 将方法的各个部分提取到它们自己的方法中，并调用它们代替原始方法。


    # 保留完整对象


    **问题：** 你从对象中获取几个值，然后将它们作为参数传递给方法。


    **解决方案：** 尝试传递整个对象。


    # 将参数替换为方法调用


    **问题：** 调用一个查询方法并将其结果作为另一个方法的参数传递，而该方法可以直接调用该查询。


    **解决方案：** 不要通过参数传递值，而是尝试在方法体内放置查询调用。


    # 引入参数对象


    **问题：** 你的方法包含一组重复的参数。


    **解决方案：** 用一个对象替换这些参数。


    # 移除设置方法


    **问题：** 字段的值应该仅在创建时设置，之后任何时候都不再更改。


    **解决方案：** 移除设置字段值的方法。


    # 隐藏方法


    **问题：** 方法没有被其他类使用，或仅在其自身的类层次内部使用。


    **解决方案：** 将方法设为私有（private）或保护（protected）。


    # 将构造函数替换为工厂方法


    **问题：** 你有一个复杂的构造函数，其执行的操作不仅仅是在对象字段中设置参数值。


    **解决方案：** 创建一个工厂方法并使用它来替换构造函数调用。


    # 将错误代码替换为异常


    **问题：** 一个方法返回一个指示错误的的特殊值？


    **解决方案：** 改为抛出异常。


    # 将异常替换为测试


    **问题：** 你在一个简单的测试就能完成工作的地方抛出了异常？


    **解决方案：** 用条件测试替换异常。


    # 重命名方法


    ## 问题


    方法名没有解释该方法的作用。


    | Customer |

    | getsnm() |


    ## 解决方案


    重命名该方法。


    | Customer |

    | getSecondName() |


    ## 为什么要重构


    也许一个方法从一开始就命名得很糟糕——例如，有人在匆忙中创建了该方法，没有顾及给它良好的命名。


    或者该方法最初命名得很好，但随着功能的增长，方法名不再是一个良好的描述符。


    ## 益处


    提高代码可读性。尝试给新方法起一个反映其作用的名字。类似于 `createOrder()`、`renderCustomerInfo()` 等名称。


    ## 如何重构


    - 1. 查看该方法是否定义在父类或子类中。如果是，你必须在这些类中重复所有步骤。

    - 2. 下一个方法对于在重构过程中维护程序的功能非常重要。创建一个具有新名称的方法。将旧方法的代码复制到其中。删除旧方法中的所有代码，取而代之插入对新方法的调用。

    - 3. 找到所有对旧方法的引用，并将它们替换为对新方法的引用。

    - 4. 删除旧方法。如果旧方法是公共接口的一部分，不要执行此步骤。相反，将旧方法标记为已弃（deprecated）。


    # 相似的重构


    - 添加参数

    - 移除参数


    # 消除异味


    - 具有不同的替代类

    - 注释


    # 添加参数


    ## 问题


    方法没有足够的数据来执行某些操作。


    | Customer |

    | --- |

    | getContact() |


    ## 解决方案


    创建一个新参数来传递必须的数据。


    | Customer |

    | --- |

    | getContact(Date) |


    ## 为什么要重构


    你需要对方法进行更改，而这些更改需要添加方法之前无法获得的信息或数据。


    ## 益处


    这里的选择是在添加新参数和添加一个包含方法所需数据的新私有字段之间进行。当你需要偶尔或频繁更改的数据，且没有必要一直让对象中持有它时，字段是更好的选择。在这种情况下，新参数比私有字段更合适，重构将产生回报。否则，添加一个私有字段并在调用方法之前用必要的数据填充它。


    ## 缺点


    - 添加新参数总是比移除它容易，这就是为什么参数列表经常膨胀到可怕的程度。这种异味被称为“长参数列表”。

    - 如果你需要添加一个新参数，有时这意味着你的类不包含必要的数据，或者现有参数不包含必要的相关数据。在这两种情况下，最佳解决方案是考虑将数据移动到主类或其他已经从方法内部就可以访问的其它类对象中。


    ## 如何重构


    - 1. 查看该方法是否定义在父类或子类中。如果方法存在于其中，你需要在这些类中重复这些步骤。

    - 2. 下一个步骤对于在重构过程中保持程序的功能至关重要。通过复制旧方法创建一个新方法，并为其添加必要的参数。用对新方法的调用替换旧方法的代码。你可以为新参数传入任何值（例如对象的
    `null` 或数字的 `0`）。

    - 3. 找到所有对旧方法的引用，并将它们替换为对新方法的引用。

    - 4. 删除旧方法。如果旧方法是公共接口的一部分，则无法删除。如果是那样，将旧方法标记为已弃。


    # 反重构


    - 移除参数


    # 相似的重构


    - 重命名方法


    # 帮助其他重构


    - 引入参数对象


    # 移除参数


    ## 问题


    参数在方法体内没有被使用。


    | Customer |

    | getContact(Date) |


    ## 解决方案


    移除未使用的参数。


    | Customer |

    | getContact() |


    ## 为什么要重构


    方法调用中的每个参数都会迫使阅读它的程序员去弄这个参数包含了什么信息。


    如果一个参数在方法体内完全没有被使用，那么这种“挠头”就是白费。


    无论任何情况下，额外的参数都是必须运行的额外代码。


    有时为了未来添加参数，预期方法可能会需要该参数。尽管如此，经验表明，只有真正需要时才添加参数更好。毕竟，预期的变化往往仅仅是预期而已。


    ## 益处


    方法仅包含它真正需要的参数。


    ## 何时不不使用


    如果方法在子类或父类中有不同的实现实现，并且你的参数在这些实现中使用了，请保持参数不变。


    ## 如何重构


    - 查看该方法是否定义在父类或子类中。如果是，参数在在那里使用了吗？如果参数在这些实现之一中使用了，请推迟这种重构技术。


