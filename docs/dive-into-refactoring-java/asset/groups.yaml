    ## 提取类 (Extract Class)


    问题：当一个类承担了两个类的工作时，就会产生尴尬。


    解决方案：相反，创建一个新类，并将负责相关功能的字段和方法放入其中。


    ## 内联类 (Inline Class)


    问题：一个类几乎什么都没做，也不对任何事情负责，而且没有为它计划额外的职责。


    解决方案：将该类中的所有功能移动到另一个类中。


    ## 隐藏代理 (Hide Delegate)


    问题：客户端从对象 A 的字段或方法获取对象 B。然后客户端调用对象 B 的方法。


    解决方案：在类 A 中创建一个新方法，将该调用委托给对象 B。现在，客户端不知道类 B，也不依赖于类 B。


    ## 移除中间人 (Remove Middle Man)


    问题：一个类有太多的方法仅仅是将调用委托给其他对象。


    解决方案：删除这些方法，强制客户端直接调用目标方法。


    ## 引入外部方法 (Introduce Foreign Method)


    问题：工具类不包含你需要的方法，且你无法向该类中添加该方法。


    解决方案：在客户端类中添加该方法，并将工具类的对象作为参数传递给它。


    ## 引入本地扩展 (Introduce Local Extension)


    **问题：** 工具类不包含你的一些方法。但你无法向该类中添加这些方法。


    **解决方案：** 创建一个包含这些方法的新类，使其成为工具类的子类或包装器。


    ## 移动方法 (Move Method)


    ### 问题


    一个方法在另一个类中使用的频率比在所属类中更高。


    | Class1 |

    | --- |

    | aMethod() |


    | Class2 |

    | --- |

    | |

    | | |


    ### 解决方案


    在经常使用该方法的类创建一个新方法，然后将代码从旧方法移动到那里。将原始方法的代码转换为另一个类中对新方法的引用，否则将其完全删除。


    ## 为什么要重构


    - 1. 你想将方法移动到一个包含该方法所需大部分数据的类中。这使得类内部更具凝聚性。

    - 2. 你想移动方法是为了减少或消除调用该方法的类对方法所在类的依赖。如果调用类已经依赖于你计划移动方法的类，这将非常有用。这减少了类与类之间的依赖。


    ## 如何重构


    - 1. 验证旧方法在类中使用的所有功能。将它们也移动过去可能是个好主意。按照规则，如果某个功能仅被所考虑的方法使用，你应该将该功能移动到它那里。如果该功能也被其他方法使用，你也应该移动这些方法。有时，移动大量方法比在不同类之间建立它们之间的关系要容易得多。


    确保该方法没有在子类和子类的子类中声明。如果是这种情况，你将不得不忍制移动，或者在接收类中实现某种多态，以确保分布在捐赠类中的方法具有变异的功能。


    - 2. 在接收类中声明新方法。你可能想为该方法起一个新名字，使其在新类中更合适。

    - 3. 决定你将如何引用接收类。你可能已经有一个返回适当对象的字段或方法，但如果没有，你将需要编写新方法或字段来存储接收类的对象。


    现在，你有了一个引用接收对象的方法，以及该类中的一个新方法。在掌握了这些之后，你可以将旧方法转换为指向新方法的引用。

    - 4. 检查一下：你可以完全删除旧方法吗？如果是，在所有使用旧方法的地方放置指向新方法的引用。


    ## 相似重构


    - 提取方法 (Extract Method)

    - 移动字段 (Move Field)


    ## 帮助其他重构


    - 提取类 (Extract Class)

    - 内联类 (Inline Class)

    - 引入参数对象 (Introduce Parameter Object)


    ## 消除味道


    - 散弹手术 (Shotgun Surgery)

    - 特性异类 (Feature Envy)

    - Switch语句 (Switch Statements)

    - 并行继承体系 (Parallel Inheritance Hierarchies)

    - 消息链 (Message Chains)

    - 不恰的亲密 (Inappropriate Intimacy)

    - 数据类 (Data Class)


    ## 移动字段 (Move Field)


    ### 问题


