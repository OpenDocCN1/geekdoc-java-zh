  - '[PAGE 125]


    # Why Refactor


    Often fields are moved as part of the Extract Class technique. Deciding which
    class to leave the field in can be tough. Here is our rule of thumb: put a field
    in the same place as the methods that use it (or or else where most of these methods
    are).


    This rule will help in other cases when a field is simply located in the wrong
    place.


    # How to Refactor


    +   1. If the field is public, refactoring will be much easier if you make the
    field private and provide public access methods (for this, you can use Encapsulate
    Field).


    ![](img/a9f2bde5dbae80f6f98fa49ccbde8add_125_0.png)


    ![](img/a9f2bde5dbae80f6f98fa49ccbde8add_125_1.png)'
