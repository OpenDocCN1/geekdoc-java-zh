    ## Replace Type Code with State/Strategy


    **What''s type code?** Type code occurs when, instead of a separate data type,
    you have a set of numbers or strings that form a list of allowable values for
    some entity. Often these specific numbers and strings are given understandable
    names via constants, which is the reason for why such type code is encountered
    so much.


    ## Problem


    You have a coded type that affects behavior but you can''t use subclasses to get
    rid of it.


    | Employee |

    | :--- |

    | ENGINEER: int |

    | SALESMAN: int |

    | type: int |


    ## Solution


    Replace type code with a state object. If it’s necessary to replace a field value
    with type code, another state object is “plugged in”.


    ![](img/a9f2bde5dbae80f6f98fa49ccbde8add_205_0.png)


    ## Why Refactor


    You have type code and it affects the behavior of a class, therefore we can’t
    use Replace Type Code with Class.


    Type code affects the behavior of a class but we can’t create subclasses for the
    coded type due to the existing class hierarchy or other reasons. Thus means that
    we can’t apply Replace Type Code with Subclasses.


    ## Benefits


    - This refactoring technique is a way out of situations when a field with a coded
    type changes its value during the object’s lifetime. In this case, replacement
    of the value is made via replacement of the state object to which the original
    class refers.

    - If you need to add a new value of a coded type, all you need to do is to add
    a new state subclass without altering the existing code (cf. the Open/Closed Principle).


    ## Drawbacks


    If you have a simple case of type code but you use this refactoring technique
    anyway, you will have many extra (and unneeded) classes.


    ## Good to Know


    Implementation of this refactoring technique can make use of one of two design
    patterns: State or Strategy. Implementation is the same no matter which pattern
    you choose. So which pattern should you pick in a particular situation?


    If you''re trying to split a conditional that controls the selection of algorithms,
    use Strategy.


    But if each value of the coded type is responsible not for selecting an algorithm
    but for the whole condition of the class, class state, field values, and many
    other actions, State is better for the job.


    ## How to Refactor


    - 1. Use Self Encapsulate Field to create a getter for the field that contains
    type code.

    - 2. Create a new class and give it an understandable name that fits the purpose
    of the type code. This class will be playing the role of state (or strategy).
    In it, create an abstract coded field getter.

    - 3. Create subclasses of the state class for each value of the coded type. In
    each subclass, redefine the getter of the coded field so that it returns the corresponding
    value of the coded type.

    - 4. In the abstract state class, create a static factory method that accepts
    the value of the coded type as a parameter. Depending on this parameter, the factory
    method will create objects of various states. For this, in its code create a large
    conditional; it’ll be the only one when refactoring is complete.

    - 5. In the original class, change the type of the coded field to the state class.
    In the field''s setter, call the factory state method for getting new state objects.

    - 6. Now you can start to move the fields and methods from the superclass to the
    corresponding state subclasses (using Push Down Field and Push Down Method).

    - 7. When everything moveable has been moved, use Replace Conditional with Polymorphism
    in order to get rid of conditionals that use type code once and for all.


    ## Similar refactorings


    - Replace Type Code with Class

    - Replace Type Code with Subclasses


    ## Implements design pattern


    - State

    - Strategy


    ## Eliminates smell


    - Primitive Obsession


    ## Replace Subclass with Fields


    ## Problem


    You have subclasses differing only in their (constant-returning) methods.


    ![](img/a9f2bde5dbae80f6f98fa49ccbde8add_209_0.png)


    ## Solution


    Replace the methods with fields in the parent class and delete the subclasses.


    | Person |

    | :--- |

    | code |

    | getCode() |


    ## Why Refactor


    Sometimes refactoring is just the ticket for avoiding type code.


    In one such case, a hierarchy of subclasses may be different only in the values
    returned by particular methods. These methods aren''t even the result of computation,
    but are strictly set out in the methods themselves or in the fields returned by
    the methods. To simplify the class architecture, this hierarchy can be compressed
    into a single class containing one or several fields with the necessary values,
    based on the situation.


    These changes may become necessary after moving a large amount of functionality
    from a class hierarchy to another place. The current hierarchy is no longer so
    valuable and its subclasses are now just dead weight.


    ## Benefits


    Simplifies system architecture. Creating subclasses is overkill if all you want
    to do is to return different values in different methods.


    ## How to Refactor


    - 1. Apply Replace Constructor with Factory Method to the subclasses.

    - 2. Replace subclass constructor calls with superclass factory method calls.

    - 3. In the superclass, declare fields for storing the values of each of the subclass
    methods that return constant values.

    - 4. Create a protected superclass constructor for initializing the new fields.

    - 5. Create or modify the existing subclass constructors so that they call the
    new constructor of the parent class and pass the relevant values to it.

    - 6. Implement each constant method in the parent class so that it returns the
    value of the corresponding field. Then remove the method from the subclass.

    - 7. If the subclass constructor has additional functionality, use Inline Method
    to incorporate the constructor into the super-class factory method.

    - 8. Delete the subclass.


    ## Anti-refactoring


    - Replace Type Code with Subclasses


    ## Simplifying Conditional Expressions


    Conditionals tend to get more and more complicated in their logic over time, and
    there are yet more techniques to combat this as well.


    ## Decompose Conditional


    **Problem:** You have a complex conditional (if-then / else switch).


    **Solution:** Decompose the complicated parts of the conditional into separate
    methods: the condition, then and else.


    ## Consolidate Conditional Expression


    **Problem:** You have multiple conditionals that lead to the same result or action.


    **Solution:** Consolidate all these conditionals in a single expression.


    ## Consolidate Duplicate Conditional Fragments


    **Problem:** Identical code can be found in all branches of a conditional.


    **Solution:** Move the code outside of the conditional.


    ## Remove Control Flag


    **Problem:** You have a boolean variable that acts as a control flag for multiple
    boolean expressions.


    **Solution:** Instead of the variable, use `break`, `continue` and `return`.


    ## Replace Nested Conditional with Guard Clauses


    **Problem:** You have a group of nested conditionals and it’s hard to determine
    the normal flow of code execution.


    **Solution:** Isolate all special checks and edge cases into separate clauses
    and place them before the main checks. Ideally, you should have a “flat” list
    of conditionals, one after the other.


    ## Replace Conditional with Polymorphism


    **Problem:** You have a conditional that performs various actions depending on
    object type or properties.


    **Solution:** Create subclasses matching the branches of the conditional. In them,
    create a shared method and move code from the corresponding branch of the conditional
    to it. Then replace the conditional with the relevant method call. The result
    is that the proper implementation will be attained via polymorphism depending
    on the object class.


    ## Introduce Null Object


    **Problem:** Since some methods return `null` instead of real objects, you have
    many checks for `null` in your code.


    **Solution:** Instead of null, return a null object that exhibits the default
    behavior.


    ## Introduce Assertion


    **Problem:** For a portion of code to work correctly, certain conditions or values
    must be true.


    **Solution:** Replace these assumptions with specific assertion checks.

