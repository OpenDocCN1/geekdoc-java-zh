    double fees = this.getFees();\ndouble finalPrice = discountedPrice(basePrice,\
    \ seasonDiscount, fees);\n```\n\n## 解决方案\n\n不要通过参数传递值，而是尝试在方法体内部放置查询调用。\n\n```\n\
    int basePrice = quantity * itemPrice;\ndouble finalPrice = discountedPrice(basePrice);\n\
    ```\n\n# 为什么要重构\n\n长参数列表很难理解。此外，对此类方法的调用通常看起来是一系列级联，带有错综且令人兴奋的数值计算，难以导航，但又必须传递给方法。因此，如果参数值可以通过方法的帮助计算出来，请在方法内部完成此操作，并去掉该参数。\n\
    \n# 益处\n\n我们去掉了不需要的参数并简化了方法调用。此类参数的创建通常不是为了现在的项目，而是为了可能永远不会来的需求。\n\n# 缺点\n\n你明天可能因为其他需要而该参数……导致你必须重写该方法。\n\
    \n# 如何重构\n\n1. 确保获取值的代码没有使用当前方法的参数，因为它们在另一个方法内部是不可用的。如果是，则无法移动代码。\n\n2. 如果相关代码比单个方法或函数调用更复杂，使用“提取方法”（Extract\
    \ Method）将此代码隔离在一个新方法中，使调用变得简单。\n\n3. 在主方法的代码中，将所有对被替换参数的引用替换为获取值的调用。\n\n4. 使用“移除参数”（Remove\
    \ Parameter）消除现在不再使用的参数。\n\n# 引入参数对象\n\n## 问题\n\n你的方法包含了一组重复的参数。\n\n| Customer\
    \ |\n| :--- |\n| amountInvoicedIn (start : Date, end : Date)<br>amountReceivedIn\
    \ (start : Date, end : Date)<br>amountOverdueIn (start : Date, end : Date) |\n\
    \n## 解决方案\n\n将这些参数替换为一个对象。\n\n| Customer |\n| :--- |\n| amountInvoicedIn (date\
    \ : DateRange)<br>amountReceivedIn (date : DateRange)<br>amountOverdueIn (date\
    \ : DateRange) |\n\n# 为什么要重构\n\n在多个方法中经常遇到相同的参数组。这导致了参数本身以及相关操作的代码重复。通过在单个类中合并参数，你还可以将处理这些数据的方法也移动到那里，从其他方法中释放出这些代码。\n\
    \n# 益处\n\n- 代码更具可读性。看到的不再是杂乱的参数，而是一个具有理解名称的单一对象。\n\n- 散落在各处的相同参数组创建了它们自己的代码重复：虽然没有调用相同的代码，但会不断遇到相同的参数组和参数。\n\
    \n# 缺点\n\n如果你只将数据移动到新类，而不计划在那里移动任何行为或相关操作，这开始散发出“数据类”（Data Class）的异味。\n\n# 如何重构\n\
    \n- 创建一个新类来表示你的参数组。使该类变为不可变。\n\n2. 在你想要重构的方法中，使用“添加参数”（Add Parameter），这是你的参数对象将传递的地方。在所有方法调用中，将从旧方法参数创建的对象传递给此参数。\n\
    \n3. 现在开始一个接一个从方法中删除旧参数，在代码中将它们替换为参数对象的字段。在每次参数替换后测试程序。\n\n4. 完成后，查看将方法的某部分（有时甚至是整个方法）移动到参数对象类中是否有意义。如果是，使用“移动方法”（Move\
    \ Method）或“提取方法”（Extract Method）。\n\n# 相似的重构\n\n- 保留整个对象\n\n# 消除异味\n\n- 长参数列表\n\
    - 数据丛\n- 原始类型痴迷\n- 长方法\n\n# 移除设置方法\n\n## 问题\n\n字段的值应该只在创建时设置，在此后的任何时候都不再改变。\n\n\
    | Customer |\n| :--- |\n| setImmutableValue() |\n\n## 解决方案\n\n删除设置字段值的方法。\n\n\
    | Customer |\n| :--- |\n| | |\n\n# 为什么要重构\n\n你想防止对字段值的任何更改。\n\n# 如何重构\n\n1. 字段的值应只能在构造函数中更改。如果构造函数不包含设置值的参数，请添加一个。\n\
    \n2. 找到所有 setter 调用。\n    - 如果 setter 调用紧跟在当前类的构造函数调用之后，将其参数移动到构造函数调用并移除 setter。\n\
    \    - 将构造函数中的 setter 调用替换为对字段的直接访问。\n\n3. 删除 setter。\n\n# 帮助其他重构\n\n# § 引用的值\n\
    \n# 隐藏方法\n\n## 问题\n\n一个方法没有被其他类使用，或仅在其自己的类层次内部使用。\n\n| Employee |\n| + aMethod()\
    \ |\n\n## 解决方案\n\n将方法设为私有或保护。\n\n| Employee |\n| - aMethod() |\n\n# 为什么要重构\n\n\
    经常，隐藏获取和设置值的方法是为了提供更丰富的接口，特别是当你最初的类增加了数据封装时。\n\n随着行为构建到类中，你可能会发现 getter 方法不再需要，并且可以隐藏。如果你将\
    \ getter 或 setter 方法设为私有并应用直接访问，你就可以删除该方法。\n\n# 益处\n\n- 隐藏方法使得代码更容易演进。当你更改私有方法时，你只需要担心不要破坏当前类，因为你知道它不会在其他地方使用。\n\
    \n- 通过将方法设为私有，你强调了类的接口以及公共方法的重要性。\n\n# 如何重构\n\n1. 定期尝试寻找可以设为私有的方法。静态代码分析和良好的测试覆盖可以提供帮助。\n\
    \n2. 将每个方法尽可能私有化。\n\n# 消除异味\n\n数据类\n\n# 将构造函数替换为工厂方法\n\n## 问题\n\n你有一个复杂的构造函数，其功能不仅仅设置对象字段中的参数值。\n\
    \n```\nclass Employee {\n    Employee(int type) {\n    this.type = type;\n   \
    \ }\n    // ...\n}\n```\n\n## 解决方案\n\n创建一个工厂方法并使用它替换构造函数调用。\n\n```\nclass Employee\
    \ {\n    static Employee create(int type) {\n        employee = new Employee(type);\n\
    \        // 执行一些重负载工作。\n        return employee;\n    }\n}\n```\n\n```\n}\n//\
    \ ...\n}\n\n# #重构\n\n构构重构技术最明显的原因与“将类型代码替换为子类”相关。\n\n在代码中，之前创建了一个对象并将类型代码的值传递给它。在使用重构方法后，出现了多个子类，你需要根据类型代码的值从它们创建对象。更改原始构造函数使其返回子类对象是不可能的，因此我们相反创建一个静态工厂方法来返回所需类的对象，然后由它替换所有对原始构造函数的调用。\n\
    \n工厂方法也可以用于其他情况，当构造函数无法胜任任务时。在尝试“将值更改为引用”时，它们可能非常重要。它们还可以用于设置超出参数数量和类型的各种创建模式。\n\
    \n"
