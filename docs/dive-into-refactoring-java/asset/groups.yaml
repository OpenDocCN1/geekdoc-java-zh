- md: '

    ## Temporary Field


    ### Signs and Symptoms


    Temporary fields get their values (and thus are needed by objects) only under
    certain circumstances. Outside of these circumstances, they''re empty.


    ![](img/a9f2bde5dbae80f6f98fa49ccbde8add_29_0.png)


    ## Reasons for the Problem


    Oftimes, temporary fields are created for use in an algorithm that requires a
    large amount of inputs. So instead of creating a large number of parameters in
    the method, the programmer decides to create fields for this data in the class.
    These fields are used only in the algorithm and go unused the rest of the time.


    This kind of code is tough to understand. You expect to see data in object fields
    but for some reason they''re almost always empty.


    ![](img/a9f2bde5dbae80f6f98fa49ccbde8add_30_0.png)


    ## Treatment


    - Temporary fields and all code operating on them can be put in a separate class
    via Extract Class. In other words, you''re creating a method object, achieving
    the same result as if you would Replace Method with Method Object.

    - Introduce Null Object and integrate it in place of the conditional code which
    was used to check the temporary field values for existence.


    ![](img/a9f2bde5dbae80f6f98fa49ccbde8add_31_0.png)


    ## Payoff


    Better code clarity and organization.


    ## Refused Bequest


    ### Signs and Symptoms


    If a subclass uses only some of the methods and properties inherited from its
    parents, the hierarchy is off-kilter. The unneeded methods may simply go unused
    or be redefined and give off exceptions.


    ![](img/a9f2bde5dbae80f6f98fa49ccbde8add_32_0.png)


    ## Reasons for the Problem


    Someone was motivated to create inheritance between classes only by the desire
    to reuse the code in a superclass. But the superclass and subclass are completely
    different.


    ![](img/a9f2bde5dbae80f6f98fa49ccbde8add_33_0.png)


    ## Treatment


    - If inheritance makes no sense and the subclass really does have nothing in common
    with the superclass, eliminate inheritance in favor of Replace Inheritance with
    Delegation.

    - If inheritance is appropriate, get rid of unneeded fields and methods in the
    subclass. Extract all fields and methods needed by the subclass from the parent
    class, put them in a new subclass, and set both classes to inherit from it (Extract
    Superclass).


    ![](img/a9f2bde5dbae80f6f98fa49ccbde8add_34_0.png)


    ## Payoff


    Improves code clarity and organization. You will no longer have to wonder why
    the Dog class is inherited from the Chair class (even though they both have 4
    legs).


    ## Alternative Classes with Different Interfaces


    ### Signs and Symptoms


    Two classes perform identical functions but have different method names.


    ![](img/a9f2bde5dbae80f6f98fa49ccbde8add_35_0.png)


    ## Reasons for the Problem


    The programmer who created one of the classes probably didn’t know that a functionally
    equivalent class already existed.


    ## Treatment


    Try to put the interface of classes in terms of a common denominator:


    - Rename Methods to make them identical in all alternative classes.

    - Move Method, Add Parameter and Parameterize Method to make the signature and
    implementation of methods the same.

    - If only part of the functionality of the classes is duplicated, try using Extract
    Superclass. In this case, the existing classes will become subclasses.

    - After you have determined which treatment method to use and implemented it,
    you may be able to delete one of the classes.


    ## Payoff


    - You get rid of unnecessary duplicated code, making the resulting code less bulky.


    Code becomes more readable and understandable (you no longer have to guess the
    reason for creation of a second class performing the exact same functions as the
    first one).


    ![](img/a9f2bde5dbae80f6f98fa49ccbde8add_37_0.png)


    ## When to Ignore


    Sometimes merging classes is impossible or so difficult to be pointless. One example
    is when the alternative classes are in different libraries that each have their
    own version of the class.


    ## Change Preventers


    These smells mean that if you need to change something in one place in your code,
    you have to make many changes in other places too. Program development becomes
    much more complicated and expensive as a result.


    ## Divergent Change


    You find yourself having to change many unrelated methods when you make changes
    to a class. For example, when adding a new product type you have to change the
    methods for finding, displaying, and ordering products.


    ## Shotgun Surgery


    Making any modifications requires that you make small changes to many different
    classes.


    ## Parallel Inheritance Hierarchies


    Whenever you create a subclass for a class, you find yourself needing to create
    a subclass for another class.


    ## Divergent Change


    Divergent Change resembles Shotgun Surgery but is actually the opposite smell.
    Divergent Change is when many changes are made to a single class. Shotgun Surgery
    refers to when a single change is made to multiple classes.


    ## Signs and Symptoms


    You find yourself having to change many unrelated methods when you make changes
    to a class. For example, when adding a new product type you have to change the
    methods for finding, displaying, and ordering products.


    ![](img/a9f2bde5dbae80f6f98fa49ccbde8add_39_0.png)


    ## Reasons for the Problem


    Oftentimes, temporary fields are created for use in an algorithm that requires
    a large amount of inputs. So instead of creating a large number of parameters
    in the method, the programmer decides to create fields for this data in the class.
    These fields are used only in the algorithm and go unused the rest of the time.


    This kind of code is tough to understand. You expect to see data in object fields
    but for some reason they''re almost always empty.


    ## Treatment


    - Split up behavior of the class via Extract Class.

    - If different classes have the same behavior, you may want to combine them through
    inheritance (Extract Superclass).


    ![](img/9f2bde5dbae80f6f98fa49ccbde8add_40_0.png)


    ## Payoff


    - Improves organization.

    - Reduces duplication.

    - Simplifies support.


    ## Shotgun Surgery


    Shotgun Surgery resembles Divergent Change but is actually the opposite smell.
    Divergent Change is when many changes are made to a single class. Shotgun Surgery
    refers to when a single change is made to multiple classes.


    ## Signs and Symptoms


    Making any modifications requires that you make small changes to many different
    classes.


    ![](img/a9f2bde5dbae80f6f98fa49ccbde8add_42_0.png)


    ## Reasons for the Problem


    A single responsibility has been split up among a large number of classes. This
    can happen after overzealous application of Divergent Change.


    ![](img/a9f2bde5dbae80f6f98fa49ccbde8add_43_0.png)


    ## Treatment


    - Use Move Method and Move Field to move existing behaviors into a single class.
    If there''s no class appropriate for this, create a new one.

    - If moving code to the same class leaves the original classes almost empty, try
    to get rid of these now-redundant classes via Inline Class.


    ## Payoff


    - Better organization.

    - Less code duplication.

    - Easier maintenance.


    ![](img/a9f2bde5dbae80f6f98fa49ccbde8add_44_0.png)


    ## Parallel Inheritance Hierarchies


    ### Signs and Symptoms


    Whenever you create a subclass for a class, you find yourself needing to create
    a subclass for another class.


    ![](img/a9f2bde5dbae80f6f98fa49ccbde8add_45_0.png)


    ## Reasons for the Problem


    All was well as long as the hierarchy stayed small. But with new classes being
    added, making changes has become harder and harder.


    ## Treatment


    You may de-duplicate parallel class hierarchies in two steps. First, make instances
    of one hierarchy refer to instances of another hierarchy. Then, remove the hierarchy
    in the referred class, by using Move Method and Move Field.


    ## Payoff


    - Reduces code duplication.

    - Can improve organization of code.


    ![](img/a9f2bde5dbae80f6f98fa49ccbde8add_46_0.png)


    ## When to Ignore


    Sometimes having parallel class hierarchies is just a way to avoid even bigger
    mess with program architecture. If you find that your attempts to de-duplicate
    hierarchies produce even uglier code, just step out, revert all of your changes
    and get used to that code.

