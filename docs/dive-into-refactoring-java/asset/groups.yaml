    - Move Field


    ## Helps other refactorings


    - Extract Class

    - Inline Class

    - Introduce Parameter Object


    ## Eliminates smell


    - Shotgun Surgery

    - Feature Envy

    - Switch Statements

    - Parallel Inheritance Hierarchies

    - Message Chains

    - Inappropriate Intimacy

    - Data Class


