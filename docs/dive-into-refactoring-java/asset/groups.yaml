    +   4. Create new extended methods in the class. Move foreign methods from other
    classes to this class or else delete the foreign methods if their functionality
    is already present in the extension.


    +   5. Replace use of the utility class with the new extension class in places
    where its functionality is needed.


    # Similar refactorings


    +   Introduce Foreign Method


    If you only want one special method, which doesn''t exist in service class, and
    you can''t extend it, move it to the client class and pass the object of a service
    class as a parameter.


