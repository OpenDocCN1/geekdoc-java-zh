  - '[PAGE 253]


    And if a parameter is entirely unused in the method body, this “noggin scratching”
    is for naught.


    And in any case, additional parameters are extra code that has to be run.


    Sometimes we add parameters with an eye to the future, anticipating changes to
    the method for which the parameter might be needed. All the same, experience shows
    that it''s better to add a parameter only when it''s genuinely needed. After all,
    anticipated changes often remain just that – anticipated.


    # Benefits


    A method contains only the parameters that it truly requires.


    # When Not to Use


    If the method is implemented in different ways in subclasses or in a superclass,
    and your parameter is used in those implementations, leave the parameter as-is.


    # How to Refactor


    +   - See whether the method is defined in a superclass or subclass. If so, is
    the parameter used there? If the parameter is used in one of these implementations,
    hold off on this refactoring technique.'
