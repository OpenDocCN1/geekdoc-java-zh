    # Primitive Obsession


    # Signs and Symptoms


    +   - Use of primitives instead of small objects for simple tasks (such as currency,
    ranges, special strings for phone numbers, etc.)


    +   - Use of constants for coding information (such as a constant USER_ADMIN_ROLE
    = 1 for referring to users with administrator rights.)


    +   - Use of string constants as field names for use in data arrays.


    ![](img/a9f2bde5dbae80f6f98fa49ccbde8add_15_0.png)'
- md: '

    ## Reasons for the Problem


    Like most other smells, primitive obsessions are born in moments of weakness.
    “Just a field for storing some data!” the programmer said. Creating a primitive
    field is so much easier than making a whole new class, right? And so it was done.
    Then another field was needed and added in the same way. Lo behold, the class
    became huge and unwieldy.


    Primitives are often used to “simulate” types. So instead of a separate data type,
    you have a set of numbers or strings that form the list of allowable values for
    some entity. Easy-to-understand names are then given to these specific numbers
    and strings via constants, which is why they’re spread wide and far.


    Another example of poor primitive use is field simulation. The class contains
    a large array of diverse data and string constants (which are specified in the
    class) are used as array indices for getting this data.


    ## Treatment


    - If you have a large variety of primitive fields, it may be possible to logically
    group some of them into their own class. Even better, move the behavior associated
    with this data into the class too. For this task, try Replace Data Value with
    Object.


    - If the values of primitive fields are used in method parameters, go with Introduce
    Parameter Object or Preserve Whole Object.


    - When complicated data is coded in variables, use Replace Type Code with Class,
    Replace Type Code with Subclasses or Replace Type Code with State/Strategy.


    - If there are arrays among the variables, use Replace Array with Object.


    ## Payoff


    - Code becomes more flexible thanks to use of objects instead of primitives.


    - Better understandability and organization of code. Operations on particular
    data are in the same place, instead of being scattered. No more guessing about
    the reason for all these strange constants and why they’re in an array.


    - Easier finding of duplicate code.


    ## Long Parameter List


    ### Signs and Symptoms


    More than three or four parameters for a method.


    ### Reasons for the Problem


    A long list of parameters might happen after several types of algorithms are merged
    in a single method. A long list may have been created to control which algorithm
    will be run and how.


    Long parameter lists may also be the byproduct of efforts to make classes more
    independent of each other. For example, the code for creating specific objects
    needed in a method was moved from the method to the code for calling the method,
    but the created objects are passed to the method as parameters. Thus the original
    class no longer knows about the relationships between objects, and dependency
    has decreased. But if several of these objects are created, each of them will
    require its own parameter, which means a longer parameter list.


    It''s hard to understand such lists, which become contradictory and hard to use
    as they grow longer. Instead of a long list of parameters, a method can use the
    data of its own object. If the current object doesn''t contain all necessary data,
    another object (which will get the necessary data) can be passed as a method parameter.


    ### Treatment


    - Check what values are passed to parameters. If some of the arguments are just
    results of method calls of another object, use Replace Parameter with Method Call.
    This object can be placed in the field of its own class or passed as a method
    parameter.


    - Instead of passing a group of data received from another object as parameters,
    pass the object itself to the method, using Preserve Whole Object.


    If there are several unrelated data elements, sometimes you can merge them into
    a single parameter object via Introduce Parameter Object.


    ## Payoff


    - More readable, shorter code.


    - Refactoring may reveal previously unnoticed duplicate code.


    ## When to Ignore


    Don''t get rid of parameters if doing so would cause unwanted dependency between
    classes.


    ## Data Clumps


    ### Signs and Symptoms


    Sometimes different parts of the code contain identical groups of variables (such
    as parameters for connecting to a database). These clumps should be turned into
    their own classes.


    ### Reasons for the Problem


    Often these data groups are due to poor program structure or "copypasta programming".


    If you want to make sure whether or not some data is a data clump, just delete
    one of the data values and see whether the other values still make sense. If this
    isn''t the case, this is a good sign that this group of variables should be combined
    into an object.


    ### Treatment


    - If repeating data comprises the fields of a class, use Extract Class to move
    the fields to their own class.


    - If the same data clumps are passed in the parameters of methods, use Introduce
    Parameter Object to set them off as a class.


    - If some of the data is passed to other methods, think about passing the entire
    data object to the method instead of just individual fields. Preserve Whole Object
    will help with this.


    - Look at the code used by these fields. It may be a good idea to move this code
    to a data class.


    ## Payoff


    - Improves understanding and organization of code. Operations on particular data
    are now gathered in a single place, instead of haphazardly throughout the code.


    - Reduces code size.


    ## When to Ignore


    Passing an entire object in the parameters of a method, instead of passing just
    its values (primitive types), may create an undesirable dependency between the
    two classes.


    ## Object-Orientation Abusers


    All these smells are incomplete or incorrect application of object-oriented programming
    principles.


    ### Switch Statements


    You have a complex `switch` operator or sequence of if statements.


    ### Temporary Field


    Temporary fields get their values (and thus are needed by objects) only under
    certain circumstances. Outside of these circumstances, they''re empty.


    ### Refused Bequest


    If a subclass uses only some of the methods and properties inherited from its
    parents, the hierarchy is off-kilter. The unneeded methods may simply go unused
    or be redefined and give off exceptions.


    ### Alternative Classes with Different Interfaces


    Two classes perform identical functions but have different method names.


    ## Switch Statements


    ### Signs and Symptoms


    You have a complex switch operator or sequence of if statements.


    ### Reasons for the Problem


    Relatively rare use of switch and case operators is one of the hallmarks of object-oriented
    code. Often code for a single switch can be scattered in different places in the
    program. When a new condition is added, you have to find all the switch code and
    modify it.


    As a rule of thumb, when you see switch you should think of polymorphism.


    ### Treatment


    - To isolate switch and put it in the right class, you may need Extract Method
    and then Move Method.


    - If a switch is based on type code, as when the program’s runtime mode is switched,
    use Replace Type Code with Sub-classes or Replace Type Code with State/Strategy.


    - After specifying the inheritance structure, use Replace Conditional with Polymorphism.


    - If there aren’t too many conditions in the operator and they all call same method
    with different parameters, polymorphism will be superfluous. If this case, you
    can break that method into multiple smaller methods with Replace Parameter with
    Explicit Methods and change the switch accordingly.


    - If one of the conditional options is null, use Introduce Null Object.


    ## Payoff


    Improved code organization.


    ## When to Ignore


    - When a `switch` operator performs simple actions, there''s no reason to make
    code changes.


    - Often `switch` operators are used by factory design patterns (**Factory Method**
    or **Abstract Factory**) to select a created class.

    '
  mdcn: "\n\n## 问题原因\n\n与大多数其他气味一样，原始类型痴迷（primitive obsessions）诞生于软弱时刻。程序员会说：“只是一个用于存储数据的字段而已！”创建一个原始字段比创建一个整个新类要容易得多，不是吗？于是就这么做了。接着又需要另一个字段，并以同样的方式添加了。结果是，这个类变得庞大且难以处理。\n\
    \n原始类型通常被用来“模拟”类型。因此，你没有独立的数据类型，而是有一组数字或字符串，它们形成了某个实体的允许值列表。然后通过常量给这些特定的数字和字符串赋予易于理解的名称，这就是为什么它们散布得到处都是。\n\
    \n糟糕使用原始类型的另一个例子是字段模拟。该类包含一个大型数组，各种数据和字符串常量（在类中指定）被用作数组索引来获取这些数据。\n\n## 解决方案\n\
    \n- 如果你有大量不同的原始类型字段，可能可以将其中一些在逻辑上分组到它们自己的类中。更好的方法是，将与这些数据相关的行为也移动到类中。对于这项任务，尝试“将数据值替换为对象”（Replace\
    \ Data Value with Object）。\n\n- 如果原始类型字段的值被用在方法参数中，请“引入参数对象”（Introduce Parameter\
    \ Object）或“保留整个对象”（Preserve Whole Object）。\n\n- 当复杂数据被编码在变量中时，使用“将类型代码替换为类”（Replace\
    \ Type Code with Class）、将类型代码替换为子类”（Replace Type Code with Subclasses）或“将类型代码替换为状态/策略”（Replace\
    \ Type Code with State/Strategy）。\n\n- 如果变量中存在数组，使用“将数组替换为对象”（Replace Array with\
    \ Object）。\n\n## 收益\n\n- 得益于使用对象而非原始类型，代码变得更加灵活。\n\n- 代码的可读性和组织性更好。针对特定数据的操作在同一个地方，而不是散落在各处。不再需要猜测这些奇怪常数的原因以及它们为什么在数组中。\n\
    \n- 更容易发现重复代码。\n\n## 长参数列表\n\n### 征象与症状\n\n方法的参数超过三个或四个。\n\n## 问题原因\n\n在将几种类型的算法合并到单个方法后，可能会出现长参数列表。创建长列表可能是为了控制运行哪种算法以及如何运行。\n\
    \n长参数列表也可能是为了使类之间更加独立的努力产物。例如，方法中所需的特定对象的创建代码从方法移动到了调用方法的代码中，但创建的对象被作为参数传递给方法。因此，原始类不再感知对象之间的关系，依赖性降低了。但如果创建了这些对象中的几个，每一个对象都需要自己的参数，这意味着参数列表会变长。\n\
    \n理解此类列表很困难，随着其长度的变长，它们会变得矛盾且难以使用。与其使用长参数列表，方法可以使用自身对象的数据。如果当前对象不包含所有必要数据，则可以将另一个对象（该对象将获取必要数据）作为方法参数传递。\n\
    \n## 解决方案\n\n- 检查传递给参数的值。如果某些参数只是另一个对象方法调用的结果，使用“将参数替换为方法调用”（Replace Parameter\
    \ with Method Call）。该对象可以放在其所属类的字段中，也可以作为方法参数传递。\n\n- 与将从另一个对象接收的一组数据作为参数传递，不如使用“保留整个对象”（Preserve\
    \ Whole Object）将对象本身传递给方法。\n\n如果有多个不相关的数据元素，有时可以通过“引入参数对象”（Introduce Parameter\
    \ Object）将它们合并为一个单一参数对象。\n\n## 收益\n\n- 代码更具可读性、更短短。\n\n- 重构可能会揭示以前未注意到的重复代码。\n\
    \n## 何时忽略\n\n如果这样做会导致类之间产生意外的依赖，请不要删除参数。\n\n## 数据簇\n\n### 征象与症状\n\n有时代码的不同部分包含相同的一组变量（例如连接数据库的参数）。这些簇应该被转换为它们自己的类。\n\
    \n## 问题原因\n\n这些数据组通常是由于程序结构不佳或“复制粘贴式编程”（copypasta programming）。\n\n如果你想确定某些数据是否为数据簇，只需删除其中一个数据值，看看其他值是否仍然合理。如果不是这种情况，说明这组变量应该合并为一个对象。\n\
    \n## 解决方案\n\n- 如果某些数据构成了类的字段，使用“提取类”（Extract Class）将字段移动到它们自己的类。\n\n- 如果数据簇作为方法的参数传递，使用“引入参数对象”（Introduce\
    \ Parameter Object）将它们设置为类。\n\n- 如果将多个对象传递给方法，考虑使用“保留整个对象”（Preserve Whole Object）而不是只传递字段。\n\
    \n- 查看使用这些字段的代码。将此代码移动到数据类可能是好主意。\n\n## 收益\n\n- 改进了代码的组织。针对特定数据的操作现在聚集在一个地方，而不是杂乱无章。\n\
    \n- 减小了代码规模。\n\n## 何时忽略\n\n在方法参数中传递整个对象而不是只传递其值，可能会在类之间产生不必要的依赖。\n\n## 面向对象滥用\n\
    \n所有这些气味都是面向对象原则的应用不完整或错误。\n\n### Switch 语句\n\n你有一个复杂的 `switch` 运算符或 `if` 语句。\n\
    \n### 临时字段\n\n临时字段在某些情况下获得值（因此被对象需要）。在这些情况之外，它们是空的。\n\n### 拒绝继承\n\n如果子类仅使用从父类继承的方法和属性，则层级结构出现了问题。不需要的方法可能直接未使用或被重定义并抛出异常。\n\
    \n### 具有不同的替代类\n\n两个类执行相同的功能，但方法名不同。\n\n## Switch 语句\n\n### 征象与症状\n\n你有一个复杂的 switch\
    \ 运算符或 `if` 语句。\n\n### 问题原因\n\n较少使用 `switch` 和 `case` 运算符是面向对象代码的特征之一。通常，同一个 `switch`\
    \ 代码散落在程序的各个地方。当添加新条件时，你必须找到所有的 `switch` 代码并进行修改。\n\n根据经验，当你看到 `switch` 时，应该考虑多态。\n\
    \n### 解决方案 \n\n- 为了隔离 `switch` 并将其放在正确的类中，你可能需要“提取方法”（Extract Method）然后“移动方法”（Move\
    \ Method）。\n\n- 如果 `switch` 基于类型代码（例如当程序运行时模式切换时），使用“将类型代码替换为子类”（Replace Type\
    \ Code with Sub-classes）或“将类型代码替换为状态/策略”（Replace Type Code with State/Strategy）。\n\
    \n- 在指定继承结构后，使用“将条件替换为多态”（Replace Conditional with Polymorphism）。\n\n- 如果运算符中的条件不多，且它们都调用带不同参数的方法，则多态是多余的。在这种情况下，你可以通过“将参数替换为显式方法”（Replace\
    \ Parameter with Explicit Methods）将该方法拆分为多个较小的方法，并相应调整 switch。\n\n- 如果条件选项之一为空，使用“引入空对象”（Introduce\
    \ Null Object）。\n\n## 收益\n\n改进了代码组织。\n\n## 何时忽略\n\n- 当 `switch` 运算符执行简单操作时，没有理由修改代码。\n\
    \n- 通常 `switch` 运算符被工厂设计模式（**工厂方法**或**抽象工厂**）用于选择所创建的类。\n\n"
