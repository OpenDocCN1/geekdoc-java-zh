    \ 用异常替换错误码\n\n## 问题\n\n一个方法是否返回一个表示错误的特殊值？\n\n```cpp\nint withdraw(int amount)\
    \ {\n  if (amount > _balance) {\n    return -1;\n  }\n  else {\n    balance -=\
    \ amount;\n    return 0;\n  }\n}\n```\n\n## 解决方案\n\n改为抛出异常。\n\n```cpp\nvoid withdraw(int\
    \ amount) throws BalanceException {\n  if (amount > _balance) {\n    throw new\
    \ BalanceException();\n  }\n}\n```\n\n```cpp\nbalance -= amount;\n}\n```\n\n#\
    \ 为什么要重构\n\n返回错误码是过程化编程过时的遗留。在现代编程中，错误处理由特殊的类完成，即异常。如果发生问题，你“抛出”一个错误，然后它由一个异常处理器之一“捕获”。在正常情况下被忽略的特殊错误处理代码会被激活做出响应。\n\
    \n## 收益\n\n-   使代码从检查各种错误码的大量条件中释放出来。异常处理器是区分正常执行路径与异常路径的更简洁的方法。\n\n-   异常类可以实现自己的方法，从而包含部分错误处理功能（例如发送错误消息）。\n\
    \n-   与异常不同，错误码不能在构造函数中使用，因为构造函数必须只返回新对象。\n\n# 缺点\n\n异常处理器可能会变成类似 `goto` 的拐杖。避免这种情况！不要使用异常来管理代码执行。异常应该只在通知错误或关键情况时才抛出。\n\
    \n# 如何重构\n\n尝试一次只对一个错误码执行这些重构步骤。这将有助于将所有重要信息保留在脑海中并避免错误。\n\n-   1. 找到所有返回错误码的方法调用，与其检查错误码，不如封装在\
    \ `try / catch` 块中。\n\n-   2. 在方法内部，与其返回错误码，不如抛出一个异常。\n\n-   3. 更改方法签名，使其包含关于抛出异常的信息（`@throws`\
    \ 部分）。\n\n# 用测试替换异常\n\n## 问题\n\n你是否在一个只需要简单测试就能完成工作的地方抛出了异常？\n\n```cpp\ndouble\
    \ getValueForPeriod(int periodNumber) {\n  try {\n    return values[periodNumber];\n\
    \  } catch (ArrayIndexOutOfBoundsException e) {\n    return 0;\n  }\n}\n```\n\n\
    ## 解决方案\n\n用条件测试替换异常。\n\n```cpp\ndouble getValueForPeriod(int periodNumber) {\n\
    \  if (periodNumber >= values.length) {\n    return 0;\n  }\nreturn values[periodNumber];\n\
    }\n```\n\n# 为什么要重构\n\n异常应该用于处理与意外错误相关的不规则行为。它们不应该作为测试的替代品。如果可以通过在运行前简单验证条件来避免异常，就应该这样做。异常应该留给真正的错误。\n\
    \n例如，你进入了一个雷区并触发了那里的地雷，导致了一个异常；该异常被完全处理，你被带到空中并送往雷区外的安全地带。但你起初只需要阅读雷区前的警告标志就可以避免这一切。\n\
    \n## 收益 \n\n一个简单的条件有时比异常处理代码更直观。\n\n# 如何重构\n\n-   1. 为边缘情况创建一个条件，并将其移动到 `try/catch`\
    \ 块之前。\n-   2. 将代码从 `catch` 部分移动到此条件判断内部。\n\n-   3. 在 `catch` ，放置抛出普通未命名异常的代码，并运行所有测试。\n\
    \n-   4. 如果在测试期间没有抛出任何异常，则去掉 `try / catch` 操作符。\n\n# 相似重构\n\n-   § 用错误码替换异常 (Replace\
    \ Error Code with Exception)\n\n# 处理泛化\n\n抽象有自己的一组重构技术，主要与沿类继承层次移动功能、创建新的类和接口，以及将继承替换为委托反反之相关。\n\
    \n# 上移字段 (Pull Up Field)\n\n**问题：** 两个类具有相同的字段。\n\n**解决方案：** 从子类移除该字段并移动到父类。\n\
    \n# 上移方法 (Pull Up Method)\n\n**问题：** 你的子类拥有执行相似工作的方法。\n\n**解决方案：** 使这些方法相同，然后将它们移动到相关的父类。\n\
    \n# 上移构造函数体 (Pull Up Constructor Body)\n\n**问题：** 你的子类拥有代码大部分相同的构造函数。\n\n**解决方案：**\
    \ 创建父类并将相同的代码移动到那里。在子类中调用父类构造函数。\n\n# 下推方法 (Push Down Method)\n\n**问题：** 父类实现的行为是否被一个（或几个）子类使用？\n\
    \n**解决方案：** 将此行为移动到子类中。\n\n# 下推字段 (Push Down Field)\n\n**问题：** 字段是否仅在少数子类中使用？\n\
    \n**解决方案：** 将字段移动到子类。\n\n# 提取子类 (Extract Subclass)\n\n**问题：** 类具有仅在某些情况下使用的特征。\n\
    \n**解决方案：** 创建子类并在这些情况下使用它。\n\n# 提取父类 (Extract Superclass)\n\n**问题：** 你有两个具有共同字段和方法的类。\n\
    \n**解决方案：** 为它们创建一个共享父类，并将它们移动到那里。\n\n# 提取接口 (Extract Interface)\n\n**问题：** 多个客户端使用类的同一个部分。另一种情况：两个类的接口部分相同。\n\
    \n**解决方案：** 将此相同部分移动到自己的接口。\n\n# 折叠层次结构 (Collapse Hierarchy)\n\n**问题：** 你拥有的类层次中子类与其父类几乎相同。\n\
    \n**解决方案：** 合并子类和父类。\n\n# 形成模板方法 (Form Template Method)\n\n**问题：** 你的子类实现了顺序相同的算法。\n\
    \n**解决方案：** 将算法结构和相同的步骤移动到父类，并将不同步骤留在子类中。\n\n# 用委托替换继承 (Replace Inheritance with\
    \ Delegation)\n\n**问题：** 你有一个子类只使用父类方法的一部分（或者无法继承父类数据）。\n\n**解决方案：** 创建一个字段并将父类对象放入，将方法委托给父类，并移除继承。\n\
    \n# 用继承替换委托 (Replace Delegation with Inheritance)\n\n**问题：** 一个类包含许多委托给另一个类的所有方法的简单方法。\n\
    \n**解决方案：** 使该类成为继承者，从而使委托方法变得不再需要。\n\n"
