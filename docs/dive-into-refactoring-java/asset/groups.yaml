  mdcn: "\n## 为什么要重构\n\n你正在使用的类没有你所需的方法。更糟糕的是，你无法添加这些方法（例如，这些类位于第三方库中）。有两种解决办法：\n\n\
    - 从相关类创建一个**子类**（subclass），包含所需的方法并从父类继承其他所有内容。这种方法比较简单，但有时会被工具类本身阻止（由于使用了 `final`\
    \ 关键字）。\n\n- 创建一个**包装器**（wrapper）类，它包含所有新方法，并在其他地方将方法委托给工具类中的相关对象。这种方法的工作量更大，因为你不仅需要代码来维护包装类与工具对象之间的关系，还需要编写大量简单的委托方法，以模拟工具类的公共接口。\n\
    \n## 益处\n\n通过将额外方法移动到独立的扩展类（包装类或子类），你避免了用不匹配的代码污染客户端类。程序组件更具内聚性，也更具可用性。\n\n##\
    \ 如何重构\n\n+ 1. 创建一个新的扩展类：\n    - 方案 A：使其成为工具类的子类。\n    - 方案 B：如果你决定使用包装器，在其中创建一个字段来存储将进行委托的工具类对象。使用此方案时，你还需要创建重复工具类公共方法的方法，并包含对工具对象方法的简单委托。\n\
    \n+ 2. 创建一个使用工具类构造函数参数的构造函数。\n\n+ 3. 还要创建一个替代的“转换”构造函数，其参数仅接收原始类的对象。这将有助于用扩展类替换原始类的对象。\n\
    \n+ 4. 在类中创建新的扩展方法。将其他类中的外部方法移动到此类，或者如果这些外部方法的功能已在扩展类中存在，则删除这些外部方法。\n\n+ 5. 在需要其功能的地方，将工具类的使用替换为新的扩展类。\n\
    \n## 相似的重构\n\n+ 引入外部方法 (Introduce Foreign Method)\n\n如果你只需要一个服务类中不存在的特殊方法，且你无法对其进行扩展，请将其移动到客户端类，并将服务类对象作为参数传递。\n\
    \n## 消除气味\n\n+ 不完整的库类 (Incomplete Library Class)\n\n## 数据组织\n\n这些重构技术有助于处理数据，用丰富的类功能替换基本数据类型。\n\
    \n另一个重要的结果是解耦了类之间的关联，这使得类更具移植性和可用性。\n\n## § 字段自封装 (Self Encapsulate Field)\n\n\
    **问题：** 你在类内部直接访问私有字段。\n\n**解决方案：** 为字段创建 getter 和 setter，并仅使用它们来访问该字段。\n\n##\
    \ § 用对象替换数据值 (Replace Data Value with Object)\n\n**问题：** 一个类（或一组类）包含一个数据字段。\n"
