- md: '

    - You can create several separate subclasses if your main class is currently implementing
    more than one such special case.


    ## Drawbacks


    Despite its seeming simplicity, *Inheritance* can lead to a dead end if you have
    to separate several different class hierarchies. If, for example, you had the
    class `Dogs` with different behavior depending on the size and fur of dogs, you
    could tease out two hierarchies:


    - by size: `Large`, `Medium` and `Small`

    - by fur: `Smooth` and `Shaggy`


    And everything would seem well, except as soon as you need to create a dog that''s
    both `Large` and `Smooth`, since you can create an object from one class only.
    That said, you can avoid this problem by using *Compose* instead of *Inherit*
    (see the Strategy pattern). In other words, the `Dog` class will have two component
    fields, size and fur. You will plug in component objects from the necessary classes
    into these fields. So you can create a `Dog` that has `LargeSize` and `ShaggyFur`.


    ## How to Refactor


    1. Create a new subclass from the class of interest.

    2. If you need additional data to create objects from a subclass, create a constructor
    and add the necessary parameters to it. Don''t forget to call the constructor''s
    parent implementation.

    3. Find all calls to the constructor of the parent class. When the functionality
    of a subclass is necessary, replace the parent constructor with the subclass constructor.

    4. Move the necessary methods and fields from the parent class to the subclass.
    Do this via **Push Down Method** and **Push Down Field**. It''s simpler to start
    by moving the methods first. This way, the fields remain accessible throughout
    the whole process: from the parent class prior to the move, and from the subclass
    itself after the move is complete.

    5. After the subclass is ready, find all the old fields that controlled the choice
    of functionality. Delete these fields by using polymorphism to replace all the
    operators in which the fields had been used. A simple example: in the Car class,
    you had the field `isElectricCar`, and depending on it, in the `refuel()` method
    the car is either fueled with gas or charged with electricity. Post-refactoring,
    the `isElectricCar` field is removed and the `Car` and `ElectricCar` classes will
    have their own implementations of the `refuel()` method.


    ## Similar refactorings


    - Extract Class (Elimates smell)

    - Large Class


    ## Extract Superclass


    Problem


    You have two classes with common fields and methods.


    | Department |

    | --- |

    | getTotalAnnualCost() |

    | getName() |

    | getHeadCount() |


    | Employee |

    | --- |

    | getAnnualCost() |

    | getName() |

    | getId() |


    Solution


    Create a shared superclass for them and move all identical fields and methods
    to it.


    ## Why Refactor


    One type of code duplication occurs when two classes perform similar tasks in
    the same way, or perform similar tasks in different ways. Objects offer a built-in
    mechanism for simplifying such situations via inheritance. But oftentimes this
    similarity remains unnoticed until classes are created, necessitating an inheritance
    structure created later.


    ## Benefits


    - Code deduplication. Common fields and methods now “live” in one place.


    ## When Not to Use


    You can not apply this technique to classes that already have a superclass.


    ## How to Refactor


    1. Create an abstract superclass.

    2. Use Pull Up Field, Pull Up Method, and Pull Up Constructor to move the common
    functionality to the superclass. Start with the fields, since in addition to common
    fields you will need to move the methods that are common.

    3. Look for places in the client code where use of subclasses can be replaced
    with your new class (such as in type declarations).


    ## Similar refactorings


    - Extract Interface (Elimates smell)

    - Duplicate Code


    ## Extract Interface


    Problem


    Multiple clients are using the same part of a class. Another case: part of the
    interface in two classes is the same.


    | Employee |

    | --- |

    | getRate() |

    | hasSpecialSkill() |

    | getName() |

    | getDepartment() |


    Solution


    Move this identical portion to its own interface.


    ## Why Refactor


    1. Interfaces are useful when classes play special roles in different situations.
    Use Extract Interface to explicitly indicate the role.

    2. Another convenient case arises when you need to describe the operations that
    a class performs. If it is planned to eventually allow use of multiple types,
    all subclasses must implement the interface.


    ## Good to Know


    There''s a certain resemblance between Extract Superclass and Extract Interface.
    Extracting an interface allows isolating only common interfaces, not common code.
    In other words, if classes contain Duplicate Code, extracting the interface won''t
    help you to deduplicate. Likewise, this problem can be mitigated by applying Extract
    Class to move the behavior to a separate component and delegating all the work
    to it. If the common behavior is large in size, you can always use Extract Superclass.
    This is even easier, of course, but remember that if you take this path you will
    get only one parent class.


    ## How to Refactor


    1. Create an empty interface.

    2. Declare common operations in the interface.

    3. Declare the necessary classes as the interface.

    4. Change type declarations in the client code to use the new interface.


    ## Similar refactorings


    - Extract Superclass


    ## Collapse Hierarchy


    Problem


    You have a class hierarchy in which a subclass is practically the same as its
    superclass.


    Solution


    Merge the subclass and superclass.


    ## Why Refactor


    Your program has grown over time and a subclass and superclass have become practically
    the same. A feature removed from a subclass was moved to the superclass... and
    now you have two look-alike classes.


    ## Benefits


    - Program complexity is reduced. Fewer classes mean fewer things to keep straight
    in your head and fewer breakable moving parts to worry about during code changes.

    - Navigating through your code is easier when methods are defined in one class
    early. You don''t need to comb through the entire hierarchy to find a particular
    method.


    ## When Not to Use


    - Does the class hierarchy that you''re refactoring have more than one subclass?
    If so, after refactoring is complete, the remaining subclasses should become the
    inheritors of the class in which the hierarchy was collapsed.

    - But keep in mind that this can lead to violations of the Liskov substitution
    principle. For example, if your program emulates city transport networks and you
    accidentally collapse the Transport superclass into the Car subclass, then the
    Plane class may become the inheritor of car. Oops!


    ## How to Refactor


    1. Select which class is easier to remove: the superclass or its subclass.

    2. Use Pull Up Field and Pull Up Method if you decide to get rid of the subclass.
    If you choose to eliminate the superclass, go for Push Down Field and Push Down
    Method.

    3. Replace all uses of the class that you''re deleting to which the fields and
    methods are to be migrated. Often this will be code for creating classes, variable
    and parameter typing, and documentation in code comments.

    4. Delete the empty class.


    ## Similar refactorings


    Inline Class


    Collapse Hierarchy is a variation of Inline Class, where the code moves to superclass
    or subclass.


    ## Eliminates smell


    Lazy Class


    Speculative Generality


    ## Form Template Method


    Problem


    Your subclasses implement algorithms that contain similar steps in the same order.


    Solution


    Move the algorithm structure and identical steps to a superclass, and leave implementation
    of the different steps in the subclasses.

    '
  mdcn: '


    -   如果你的主类目前实现了多个此类特例情况，你可以创建几个独立的子类。


    ## 缺点


    尽管*继承*（Inheritance）看起来简单，但如果你必须分离几个不同的类层次结构，它可能会导致一个死胡同。例如，如果你有一个 `Dogs` 类，其行为根据狗的大小和毛发而异，你可以剥离出两个层次结构：


    -   按尺寸：`Large`、`Medium` 和 `Small`

    -   按毛发：`Smooth` 和 `Shaggy`


    这一切看起来都很良好，但一旦当你需要创建一个既是 `Large` 又是 `Smooth` 的狗时，问题就出现了，因为你只能从一个类中创建对象。尽管如此，你仍然通过使用*组合*（Compose）而不是*继承*（Inherit）来避免这个问题（参见策略模式）。换句话说，`Dog`
    类将有两个组件字段：尺寸和毛发。你将从必要的类中将组件对象插入到这些字段中。这样你就可以创建一个拥有 `LargeSize` 和 `ShaggyFur` 的
    `Dog`。


    ## 如何重构


    1.  从感兴趣的类创建一个新的子类。

    2.  如果你需要额外的数据来创建子类的对象，请创建一个构造函数并向其添加必要的参数。忘记调用构造函数的父类实现。

    3.  找到所有对父类构造函数的调用。当需要子类的功能时，将父类构造函数替换为子类构造函数。

    4.  将必要的方法和字段从父类移动到子类中。通过**下推方法**（Push Down Method）和**下推字段**（Push Down Field）来实现。先移动方法会更简单。这样一来，字段在整个过程中始终保持可访问状态：从移动之前的父类，以及从移动完成后的子类本身。

    5.  在子类准备好后，找到所有控制功能选择的旧字段。使用多态来替换所有使用这些字段的算符，从而删除这些字段。一个简单的例子是：在 `Car` 类中，你有一个字段
    `isElectricCar`，根据它，在 `refuel()` 方法中，汽车要么加油，要么充电。重构后，`isElectricCar` 字段被删除了，且
    `Car` 和 `ElectricCar` 类将拥有各自的 `refuel()` 方法实现。


    ## 相似重构


    -   提取类（消除异味）

    -   大类（Large Class）


    ## 提取超类


    问题


    你有两个具有共同字段和方法的类。


    | Department |

    | --- |

    | getTotalAnnualCost() |

    | getName() |

    | getHeadCount() |


    | Employee |

    | --- |

    | getAnnualCost() |

    | getName() |

    | getId() |


    解决方案


    为它们创建一个共享的超类，并将所有相同的字段和方法移动到该超类中。


    ## 为什么要重构


    一种代码重复发生于两个类以相同的方式执行相似的任务，或者以不同的方式执行相似的任务时。对象通过继承提供了一种内置机制来简化此类情况。但通常，在创建类之前，这种相似性并未被注意到，导致在之后才创建继承结构。


    ## 益处


    -   代码去重。公共字段和方法现在“存在”于一个地方。


    ## 何时不使用


    你不能将此技术应用于已经有父类的类。


    ## 如何重构


    1.  创建一个抽象超类。

    2.  使用上提字段（Pull Up Field）、上提方法（Pull Up Method）和上提构造函数（Pull Up Constructor）将公共功能移动到超类。从字段开始，因为除了公共字段外，你还需要移动公共方法。

    3.  在客户端代码中寻找可以使用新类替换子类的地方（例如在类型声明中）。


    ## 相似重构


    -   提取接口（消除异味）

    -   重复代码


    ## 提取接口


    问题


    多个客户端正在使用类的同一个部分。另一种情况：两个类中的接口部分是相同的。


    | Employee |

    | --- |

    | getRate() |

    | hasSpecialSkill() |

    | getName() |

    | getDepartment() |


    解决方案


    将这相同部分移动到自己的接口中。


    ## 为什么要重构


    1.  当类在不同情况下扮演特殊角色时，接口非常有用。使用提取接口来显式指示该角色。

    2.  当你需要描述类执行的操作时，会出现另一种方便的情况。如果计划最终允许多种类型，则所有子类必须实现该接口。


    ## 提示


    提取超类和提取接口之间存在某种相似之处。提取接口允许仅隔离公共接口，而不是公共代码。换句话说，如果类包含重复代码，提取接口将无法帮助你去重。同样，可以通过提取类将行为移动到单独的组件并将所有工作委托给它来缓解此问题。如果公共行为体积极，你始终可以使用提取超类。当然，这更简单，但请记住，如果你走这条路，你只会得到一个父类。


    ## 如何重构


    1.  创建一个空接口。

    2.  在接口中声明公共操作。

    3.  将必要的类声明为接口。

    4.  更改客户端代码中的类型声明以使用新接口。


    ## 相似重构


    -   提取超类


    ## 合并层次


    问题


    你有一个类层次结构，其中子类与其超类实际上相同。


    解决方案


    合并子类和超类。


    ## 为什么要重构


    随着时间的推移，子类和超类变得实际上相同。一个从子类移除的功能被移动到了超类……现在你有了两个相同的类。


    ## 益处


    -   降低了程序复杂度。类越少，脑中记住的东西越少，更改代码时需要担心的部分也越少。

    -   当方法定义在类中时，导航代码会更容易。你不需要遍历整个层次结构来寻找特定方法。


    ## 何时不使用


    -   你正在重构的类层次结构是否有多个子类？如果是的话，在重构完成后，剩余的子类将成为合并类类的继承类。

    -   但请记住，这可能会违反里氏夫替换原则。例如，如果你的程序模拟城市交通网络，而你不小心将 Transport 超类合并到 Car 子类中，那么 Plane
    类可能就会变成 car 的继承类。哎呀！


    ## 如何重构


    1.  选择哪个类更容易删除：超类还是它的子类。

    2.  如果你决定删除子类，使用上提字段和上提方法。如果你选择消除超类，请使用下推字段和下推方法。

    3.  替换所有对要删除类的引用，这些字段和方法将被迁移。这通常是创建类的代码、变量和参数类型以及代码注释中的文档。

    4.  删除空类。


    ## 相似重构


    内联类


    合并层次是内联类的变体，代码移动到超类或子类。


    ## 消除异味


    懒惰类（Lazy Class）


    臆测性泛化（Speculative Generality）


    ## 形成模板方法


    问题


    你的子类实现的算法包含相同顺序的步骤。


    解决方案


    将算法结构和相同的步骤移动到超类，并将不同步骤的实现留在子类中。


    '
