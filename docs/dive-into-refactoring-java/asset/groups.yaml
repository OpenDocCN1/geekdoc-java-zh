- md: "\n# Extract Variable\n\n## Problem\n\nYou have an expression that's hard to\
    \ understand.\n\n```\nvoid renderBanner() {\n  if ((platform.toUpperCase().indexOf(\"\
    MAC\") > -1 &&\n      browser.toUpperCase().indexOf(\"IE\") > -1 &&\n      wasInitialized())\
    \ && resize > 0) {\n    // do something\n  }\n}\n```\n\n## Solution\n\nPlace the\
    \ result of the expression or its parts in separate variables that are self-explanatory.\n\
    \n```\nvoid renderBanner() {\n  final boolean isMacOS = platform.toUpperCase().indexOf(\"\
    MAC\") > -1;\n  final boolean isIE = browser.toUpperCase().indexOf(\"IE\") > -1;\n\
    \  final boolean wasResized = resize > 0;\n\n  if (isMacOS && isIE && wasInitialized()\
    \ && wasResized) {\n    // do something\n  }\n}\n```\n\n## Why Refactor\n\nThe\
    \ main reason for extracting variables is to make a complex expression more understandable,\
    \ by dividing it into its intermediate parts. These could be:\n\n- Condition of\
    \ the `if()` operator or a part of the `?:` operator in C-based languages\n- A\
    \ long arithmetic expression without intermediate results\n- Long multipart lines\n\
    \nExtracting a variable may be the first step towards performing **Extract Method**\
    \ if you see that the extracted expression is used in other places in your code.\n\
    \n## Benefits\n\nMore readable code! Try to give the extracted variables good\
    \ names that announce the variable's purpose loud and clear. More readability,\
    \ fewer long-winding comments. Go for names like `customerValue`, `cityUnemploymentRate`,\
    \ `clientSalutationString`, etc.\n\n## Drawbacks\n\n- More variables are present\
    \ in your code. But this is counterbalanced by the ease of reading your code.\n\
    - When refactoring conditional expressions, remember that the compiler will most\
    \ likely optimize it to minimize the amount of calculations needed to establish\
    \ the resulting value. Say you have the following expression `if (a() || b())`\
    \ . . The program won't call the method `b` if the method `a` returns `true` because\
    \ the resulting value will still be `true`, no matter what value returns `b`.\n\
    \nHowever, if you extract parts of this expression into variables, both methods\
    \ will always be called, which might hurt performance of the program, especially\
    \ if these methods do some heavyweight work.\n\n## How to Refactor\n\n- 1. Insert\
    \ a new line before the relevant expression and declare a new variable there.\
    \ Assign part of the complex expression to this variable.\n- 2. Replace that part\
    \ of the expression with the new variable.\n- 3. Repeat the process for all complex\
    \ parts of the expression.\n\n## Anti-refactoring\n\nInline Temp\n\n## Similar\
    \ refactorings\n\nExtract Method\n\n## Eliminates smell\n\nComments\n\n# Inline\
    \ Temp\n\n## Problem\n\nYou have a temporary variable that's assigned the result\
    \ of a simple expression and nothing more.\n\n```\nboolean hasDiscount(Order order)\
    \ {\n  double basePrice = order.basePrice();\n  return basePrice > 1000;\n}\n\
    ```\n\n## Solution\n\nReplace the references to the variable with the expression\
    \ itself.\n\n```\nboolean hasDiscount(Order order) {\n  return order.basePrice()\
    \ > 1000;\n}\n```\n\n## Why Refactor\n\nInline local variables are almost always\
    \ used as part of Replace Temp with Query or to pave the way for Extract Method.\n\
    \n## Benefits\n\nThis refactoring technique offers almost no benefit in itself\
    \ itself. However, if the variable is assigned the result of a method, you can\
    \ marginally improve the readability of the program by getting rid of the unnecessary\
    \ variable.\n\n## Drawbacks\n\nSometimes seemingly useless temps are used to cache\
    \ the result of an expensive operation that's reused several times. So before\
    \ using this refactoring technique, make sure that simplicity won't come at the\
    \ cost of performance.\n\n## How to Refactor\n\n- Find all places that use the\
    \ variable. Instead of the variable, use the expression that had been assigned\
    \ to it.\n- Delete the declaration of the variable and its assignment line.\n\n\
    ## Helps other refactorings\n\nReplace Temp with Query\n\nExtract Method\n\n#\
    \ Replace Temp with Query\n\n## Problem\n\nYou place the result of an expression\
    \ in a local variable for later use in your code.\n\n```\ndouble calculateTotal()\
    \ {\n  double basePrice = quantity * itemPrice;\n  if (basePrice > 1000) {\n \
    \   return basePrice * 0.95;\n  } else {\n    return basePrice * 0.98;\n  }\n\
    }\n```\n\n## Solution\n\nMove the entire expression to a separate method and return\
    \ the result from it. Query the method instead of using a variable. Incorporate\
    \ the new method in other methods, if necessary.\n\n```\ndouble calculateTotal()\
    \ {\n  if (basePrice() > 1000) {\n    return basePrice() * 0.95;\n  }\n  else\
    \ {\n    return basePrice() * 0.98;\n  }\n}\ndouble basePrice() {\n  return quantity\
    \ * itemPrice;\n}\n```\n\n## Why Refactor\n\nThis refactoring can lay the groundwork\
    \ for applying Extract Method for a portion of a very long method.\n\nThe same\
    \ expression may sometimes be found in other methods as well, which is one reason\
    \ to consider creating a common method.\n\n## Benefits\n\n- Code readability.\
    \ It's much easier to understand the purpose of the method getTax than the line\
    \ `orderPrice() * 0.2`.\n- Slimmer code via deduplication, if the line being replaced\
    \ is used in multiple methods.\n\n## Good to Know\n\n## Performance\n\nThis refactoring\
    \ may prompt the question of whether this approach is liable to cause a performance\
    \ hit. The honest answer is: yes, it's, since the resulting code may be burdened\
    \ by querying a new method. But with today's fast CPUs and excellent compilers,\
    \ the burden will almost always be minimal. By contrast, readable code and the\
    \ ability to reuse this method in other places in program code – thanks to this\
    \ refactoring approach – are very noticeable benefits.\n\nNonetheless, if your\
    \ temp variable is used to cache the result of a truly time-consuming expression,\
    \ you may want to stop this refactoring after extracting the expression to a new\
    \ method.\n\n## How to Refactor\n\n- 1. Make sure that a value is assigned to\
    \ the variable once and only once within the method. If not, use Split Temporary\
    \ Variable to ensure that the variable will be used only to store the result of\
    \ your expression.\n- 2. Use Extract Method to place the expression of interest\
    \ in a new method. Make sure that this method only returns a value and doesn't\
    \ change the state of the object. If the method affects the visible state of the\
    \ object, use Separate Query from Modifier.\n- 3. Replace the variable with a\
    \ query to your new method.\n\n## Similar refactorings\n\nExtract Method\n\n##\
    \ Eliminates smell\n\nLong Method\n\nDuplicate Code\n\n# Split Temporary Variable\n\
    \n## Problem\n\nYou have a local variable that's used to store various values\
    \ inside a method (except for cycle variables).\n\n```\ndouble temp = 2 * (height\
    \ + width);\nSystem.println(temp);\ntemp = height * width;\nSystem.println(temp);\n\
    ```\n\n## Solution\n\nUse different variables for different values. Each variable\
    \ should be responsible for only one thing.\n\n```\nfinal double perimeter = 2\
    \ * (height + width);\nSystem.println(perimeter);\nfinal double area = height\
    \ * width;\nSystem.println(area);\n```\n\n## Why Refactor\n\nIf you're skimming\
    \ on the number of variables inside a function and reusing them for unrelated\
    \ purposes, you're sure to encounter problems as soon as you need to make changes\
    \ to the code containing the variables. You will have to recheck each case of\
    \ variable use to make sure that the correct values are used.\n\n## Benefits\n\
    \n- Each component of the program code should be responsible for one and one thing\
    \ only. This makes it much easier to maintain the code, since you can easily replace\
    \ any particular thing without fear of unintended effects.\n- Code becomes more\
    \ readable. If a variable was created long ago in a rush, it probably has a name\
    \ that doesn't explain anything: `k`, `a2`, `value`, etc. But you can fix this\
    \ situation by naming the new variables in an understandable, self-explanatory\
    \ way. Such names might resemble `customerValue`, `cityUnemploymentRate`, `clientSalutationString`\
    \ and the like.\n- This refactoring technique is useful if you anticipate using\
    \ `Extract Method` later.\n"
  mdcn: "\n\n# 提取变量 (Extract Variable)\n\n## 问题\n\n你有一个难以理解的表达式。\n\n```\nvoid renderBanner()\
    \ {\n  if ((platform.toUpperCase().indexOf(\"MAC\") > -1 &&\n      browser.toUpperCase().indexOf(\"\
    IE\") > -1 &&\n      wasInitialized()) && resize > 0) {\n    // do something\n\
    \  }\n}\n```\n\n## 解决方案\n\n将表达式或其部分的结果放在自解释含义的独立变量中。\n\n```\nvoid renderBanner()\
    \ {\n  final boolean isMacOS = platform.toUpperCase().indexOf(\"MAC\") > -1;\n\
    \  final boolean isIE = browser.toUpperCase().indexOf(\"IE\") > -1;\n  final boolean\
    \ wasResized = resize > 0;\n\n  if (isMacOS && isIE && wasInitialized() && wasResized)\
    \ {\n    // do something\n  }\n}\n```\n\n## 为什么要重构\n\n提取变量的主要原因是通过将其拆分为中间部分，使复杂的表达式更易于理解。这些部分可能是：\n\
    \n- C 类的语言中 `if()` 运算符的条件或 `?:` 运算符的一部分\n- 没有中间结果的长算术表达式\n- 长的多部分行\n\n如果你发现提取的表达式在代码的其他地方被使用，那么提取变量可能是执行**提取方法\
    \ (Extract Method)** 第一步。\n\n## 收益\n\n更具可读性的代码！尝试为提取的变量取好名字，清晰地宣告变量的用途。更高的可读性意味着更少的冗注释。可以使用像\
    \ `customerValue`、`cityUnemploymentRate`、`clientSalutationString` 等名称。\n\n## 缺点\n\
    \n- 代码中出现了更多的变量。但这被代码读取的便利性所抵消。\n- 在重构条件表达式时，记住编译器很可能会对其进行优化，以减少建立结果值所需的计算量。假设你有如下表达式\
    \ `if (a() || b())` . . . 如果方法 `a` 返回 `true`，程序就不会调用方法 `b`，因为无论 `b` 返回什么值，结果都将是\
    \ `true`。\n\n然而，如果你将此表达式的部分提取到变量中，两种方法都将被调用，这可能会损害程序的性能，特别是当这些方法执行一些重型工作时。\n\n\
    ## 如何重构\n\n- 1. 在相关表达式之前插入新行并在那里声明一个新变量。将复杂表达式的一部分赋值给该变量。\n- 2. 用新变量替换表达式的该部分。\n\
    - 3. 对表达式中的所有复杂部分重复此过程。\n\n## 反重构\n\n内联临时变量 (Inline Temp)\n\n## 相似的重构\n\n提取方法\
    \ (Extract Method)\n\n## 消除气味\n\n注释 (Comments)\n\n# 内联临时变量 (Inline Temp)\n\n##\
    \ 问题\n\n你有一个临时变量，它被赋值了一个简单表达式的结果，并且没有别的。\n\n```\nboolean hasDiscount(Order order)\
    \ {\n  double basePrice = order.basePrice();\n  return basePrice > 1000;\n}\n\
    ```\n\n## 解决方案\n\n用表达式本身替换对变量的引用。\n\n```\nboolean hasDiscount(Order order) {\n\
    \  return order.basePrice() > 1000;\n}\n```\n\n## 为什么要重构\n\n内联局部变量几乎总是作为“替换临时变量为查询\
    \ (Replace Temp with Query)”的一部分，或者或者为“提取方法”铺路。\n\n## 收益\n\n这种重构技术本身几乎没有任何益处。但是，如果变量被赋值为方法的结果，通过消除不必要的变量，你可以稍微提高程序的可读性。\n\
    \n## 缺点\n\n有时看似无用的临时变量被用于缓存被多次使用的昂贵操作的结果。因此，在使用这种重构技术之前，请确保简单性不会以性能为代价。\n\n##\
    \ 如何重构\n\n- 找到所有使用该变量的地方。使用赋值给该变量的表达式代替变量。\n- 删除变量的声明和它的赋值行。\n\n## 帮助其他重构\n\n\
    替换临时变量为查询 (Replace Temp with Query)\n\n提取方法 (Extract Method)\n\n# 替换临时变量为查询 (Replace\
    \ Temp with Query)\n\n## 问题\n\n你将表达式的结果放在局部变量中，以便稍后在代码中使用。\n\n```\ndouble calculateTotal()\
    \ {\n  double basePrice = quantity * itemPrice;\n  if (basePrice > 1000) {\n \
    \   return basePrice * 0.95;\n  } else {\n    return basePrice * 0.98;\n  }\n\
    }\n```\n\n## 解决方案\n\n将整个表达式移动到一个独立的方法中并从中返回结果。查询该方法而不是使用变量。如有必要，将新方法整合到其他方法中。\n\
    \n```\ndouble calculateTotal() {\n  if (basePrice() > 1000) {\n    return basePrice()\
    \ * 0.95;\n  }\n  else {\n    return basePrice() * 0.98;\n  }\n}\ndouble basePrice()\
    \ {\n  return quantity * itemPrice;\n}\n```\n\n## 为什么要重构\n\n这种重构可以为非常长方法的一部分应用提取方法奠定基础。\n\
    \n相同的表达式有时可能出现在其他地方，这也是考虑创建方法的原因之一。\n\n## 收益\n\n- 代码可读性。相比于 `orderPrice() * 0.2`，查询方法更容易理解含义。\n\
    - 通过去重精简代码，如果该表达式在多个方法中存在。\n\n## 注意事项\n\n## 性能\n\n这种重构可能会引发关于这种方法会导致性能损失的问题。诚实地说答案是肯定的，由于今天的\
    \ CPU 和优秀的编译器，这种负担总是微乎其微的。然而，如果你的临时变量用于缓存耗时操作的结果，你可能在提取到新方法后停止这种重构。\n\n## 如何重构\n\
    \n- 1. 确保值在方法中赋值且仅赋值一次。如果不是，使用拆分临时变量 (Split Temporary Variable)。\n- 2. 使用提取方法将感兴趣的表达式放入新方法中。确保该方法只返回值而不改变对象状态。如果方法影响对象状态，请使用查询修改分离\
    \ (Separate Query from Modifier)。\n- 3. 用对新方法的查询替换变量。\n\n## 相似的重构\n\n提取方法 (Extract\
    \ Method)\n\n## 消除气味\n\n长方法 (Long Method)\n\n重复代码 (Duplicate Code)\n\n"
