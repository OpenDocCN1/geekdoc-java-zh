    \    // ...\n}\nprivate static Date nextDay(Date arg) {\n    return new Date(arg.getYear(),\
    \ arg.getMonth(), arg.getDate() + 1)\n}\n```\n\n# Why Refactor\n\nYou have code\
    \ that uses the data and methods of a certain class. You realize that the code\
    \ will look and work much better inside a new method in the class. But you can't\
    \ add the method to the class because, for example, the class is located in a\
    \ third-party library.\n\nThis refactoring has a big payoff when the code that\
    \ you want to move to the method is repeated several times in different places\
    \ in your program.\n\nSince you're passing an object of the utility class to the\
    \ parameters of the new method, you have access to all of its fields. Inside the\
    \ method, you can do practically everything that you want, as if the method were\
    \ part of the utility class."
  - '[PAGE 143]


    # Benefits


    Removes code duplication. If your code is repeated in several places, you can
    replace these code fragments with a method call. This is better than duplication
    even considering that the foreign method is located in a suboptimal place.


    # Drawbacks


    The reasons for having the method of a utility class in a client class won''t
    always be clear to the person maintaining the code after you. If the method can
    be used in other classes, you could benefit by creating a wrapper for the utility
    class and placing the method there. This is also beneficial when there are several
    such utility methods. Introduce Local Extension can help with this.


    # How to Refactor


    +   1. Create a new method in the client class.


    +   2. In this method, create a parameter to which the object of the utility class
    will be passed. If this object can be obtained from the client class, you don''t
    have to create such a parameter.


    +   3. Extract the relevant code fragments to this method and replace them with
    method calls.'
  - '[PAGE 144]


    4. Be sure to leave the Foreign method tag in the comments for the method along
    with the advice to place this method in a utility class if such becomes possible
    later. This will make it easier to understand why this method is located in this
    particular class for those who''ll be maintaining the software in the future.


    # Similar refactorings


    +   § Introduce Local Extension


    Move all extension methods to a separate class, which is wrapper or a subclass
    of some service class.


    # Eliminates smell


    +   § Incomplete Library Class'
