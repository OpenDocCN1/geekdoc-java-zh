    ## Solution\n\nThen it's a good idea to separate the data into separate classes,\
    \ ensuring connection and synchronization between the domain class and the GUI.\n\
    \n## Refactoring Techniques / Duplicate Observed Data\n\n![](img/a9f2bde5dbae80f6f98fa49ccbde8add_171_0.png)\n\
    \n## Why Refactor\n\nYou want to have multiple interface views for the same data\
    \ (for example, you have both a desktop app and a mobile app). If you fail to\
    \ separate the GUI from the domain, you will have a very hard time avoiding code\
    \ duplication and a large number of mistakes.\n\n## Benefits\n\n- You split responsibility\
    \ between business logic classes and presentation classes (cf. the Single Responsibility\
    \ Principle), which makes your program more readable and understandable.\n- If\
    \ you need to add a new interface view, create new presentation classes; you don't\
    \ need to touch the code of the business logic (cf. the Open/Closed Principle).\n\
    - Now different people can work on the business logic and the user interfaces.\n\
    \n## When Not to Use\n\n- This refactoring technique, which in its classic form\
    \ is performed using the Observer template, isn't applicable for web apps, where\
    \ all classes are recreated between queries to the web server.\n- All the same,\
    \ the general principle of extracting business logic into separate classes can\
    \ be justified for web apps as well. But this will be implemented using different\
    \ refactoring techniques depending on how your system is designed.\n\n## How to\
    \ Refactor\n\n- 1. Hide direct access to domain data in the GUI class. For this,\
    \ it's best to use Self Encapsulate Field. So you create the getters and setters\
    \ for this data.\n- 2. In handlers for GUI class events, use setters to set new\
    \ field values. This will let you pass these values to the associated domain object.\n\
    - 3. Create a domain class and copy necessary fields from the GUI class to it.\
    \ Create getters and setters for all these fields.\n- 4. Create an Observer pattern\
    \ for these two classes:\n  - In the domain class, create an array for storing\
    \ observer objects (GUI objects), as well as methods for registering, deleting\
    \ and notifying them.\n  - In the GUI class, create a field for storing references\
    \ to the domain class as well as the update() method, which will be reacting to\
    \ changes in the object and update the values of fields in the GUI class. Note\
    \ that value updates should be established directly in the method, in order to\
    \ avoid recursion.\n  - In the GUI class constructor, create an instance of domain\
    \ class and save it in the field you have created. Register the GUI object as\
    \ an observer in the domain object.\n- In the setters for domain class fields,\
    \ call the method for notifying the observer (in other words, method for updating\
    \ in the GUI class), in order to pass the new values to the GUI.\n- Change the\
    \ setters of the GUI class fields so that they set new values in the domain object\
    \ directly. Watch out to make sure that values aren't set through a domain class\
    \ setter – otherwise infinite recursion will result.\n\n## Implements design pattern\n\
    \nObserver\n\n## Eliminates smell\n\nLarge Class\n\n## Change Unidirectional Association\
    \ to Bidirectional\n\n## Problem\n\nYou have two classes that each need to use\
    \ the features of the other, but the association between them is only unidirectional.\n\
    \n![](img/a9f2bde5dbae80f6f98fa49ccbde8add_175_0.png)\n\n## Solution\n\nAdd the\
    \ missing association to the class that needs it.\n\n![](img/a9f2bde5dbae80f6f98fa49ccbde8add_175_1.png)\n\
    \n## Why Refactor\n\nOriginally the classes had a unidirectional association.\
    \ With time, client code needed access to both sides of the association.\n\n##\
    \ Benefits\n\nIf a class needs a reverse association, you can simply calculate\
    \ it. But if these calculations are complex, it's better to keep the reverse association.\n\
    \n## Drawbacks\n\n- Bidirectional associations are much harder to implement and\
    \ maintain than unidirectional ones.\n- Bidirectional associations make classes\
    \ interdependent. With a unidirectional association, one of them can be used independently\
    \ of the other.\n\n## How to Refactor\n\n- 1. Add a field for holding the reverse\
    \ association.\n- 2. Decide which class will be “dominant”. This class will contain\
    \ the methods that create or update the association as elements are added or changed,\
    \ establishing the association in its class and calling the utility methods for\
    \ establishing the association in other object.\n- 3. Create a method for establishing\
    \ the association in the \"non-dominant\" class if it is used for other purposes.\n\
    - 4. If old methods for controlling the association were in the \"dominant\" class,\
    \ complement them with calls to the associated object.\n- 5. If old methods for\
    \ controlling the association were in the \"non-dominant\" class, create them\
    \ in the \"dominant\" class, delegate to the associated object.\n\n## Anti-refactoring\n\
    \n### Change Bidirectional Association to Unidirectional\n\n## Change Bidirectional\
    \ Association to Unidirectional\n\n## Problem\n\nYou have a bidirectional association\
    \ between classes, but one of the classes doesn’t use the features.\n\n![](img/a9f2bde5dbae80f6f98fa49ccbde8add_178_0.png)\n\
    \n## Solution\n\nRemove the unused association.\n\n![](img/a9f2bde5dbae80f6f98fa49ccbde8add_178_1.png)\n\
    \n## Why Refactor\n\nA bidirectional association is generally harder to maintain\
    \ a unidirectional one, requiring additional code for creating and deleting the\
    \ relevant objects. This makes the program more complicated.\n\nIn addition, an\
    \ improperly implemented bidirectional association can cause problems for garbage\
    \ collection (in turn leading to memory bloat by unused objects).\n\nExample:\
    \ the garbage collector removes objects from memory that are no longer referenced\
    \ by other objects. Let's say that an object pair `User - Order` was created,\
    \ used, and then abandoned. But these objects won't be cleared from memory since\
    \ they still refer to each other. That said, this problem is becoming less important\
    \ thanks to advances in programming languages, which now automatically identify\
    \ unused object references and remove them from memory.\n\nThere is also the problem\
    \ of interdependency between classes. In a bidirectional association, the two\
    \ classes must know about each other, meaning that they can't be used separately.\
    \ If many of these associations are present, different parts of the program become\
    \ too dependent on each other and any changes in one component may affect the\
    \ other components.\n\n## Benefits\n\n- Simplifies the class that doesn’t need\
    \ the relationship. Less code equals less code maintenance.\n- Reduces dependency\
    \ between classes. Independent classes are easier to maintain since any changes\
    \ to a class affect only that class.\n\n## How to Refactor\n\n- 1. Make sure that\
    \ one of the following is true for your classes:\n  - No association is used.\n\
    \  - There’s another way to get the associated object, such through a database\
    \ query.\n  - The associated object can be passed as an argument to the methods\
    \ that use it.\n- 2. Depending on your situation, use of a field that contains\
    \ association with another object should be replaced by a parameter or method\
    \ call for getting the object in a different way.\n- 3. Delete the code that assigns\
    \ the associated object to the field.\n- 4. Delete the now-unused field.\n"
