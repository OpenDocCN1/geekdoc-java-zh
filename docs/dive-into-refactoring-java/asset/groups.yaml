- md: "\n## Dive Into Refactoring\n\nOffline Edition\n\n![](img/a9f2bde5dbae80f6f98fa49ccbde8add_0_0.png)\n\
    \nREFACTORING\n· GURU ·\n\nby Alexander Shvets\n\n## Dive Into Refactoring\n\n\
    Offline Edition (Java)\nv2019-1.3\n\nPurchased by Lukas Haigner\nlukas.haigner@gmail.com\
    \ (#15232)\n\n# Boring Copyright Page\n\nHi! My name is Alexander Shvets, I'm\
    \ the author of the online course Dive Into Refactoring, which includes this book.\n\
    \n![](img/a9f2bde5dbae80f6f98fa49ccbde8add_2_0.png)\n\nThis book is licensed for\
    \ your personal use. Please, don't share it with other people, except your family\
    \ members. If you would like to share the book with your friend or colleague,\
    \ please purchase a copy of the course and gift it to him or her.\n\nIf you're\
    \ reading this book and did not purchase it, or it was not purchased for you,\
    \ then please be a decent person and purchase your own copy of the course.\n\n\
    Thank you for respecting years of hard work I've put into creating the course,\
    \ as well as this book!\n\n© Alexander Shvets, Refactoring.Guru, 2019\n\nsupport@refactoring.guru\n\
    \n![](img/a9f2bde5dbae80f6f98fa49ccbde8add_3_0.png)\n\n# Preface\n\nI tried to\
    \ cram all of the available information throughout the full course into this book.\
    \ For the most part, I succeeded. But some things, such as live examples, are\
    \ just impossible to present in the form of a static electronic book. Therefore,\
    \ consider this book as auxiliary material, but not a replacement for the full\
    \ refactoring course.\n\nThe book is divided into two large sections: **Code Smells**\
    \ and **Refactoring Techniques**. The first part describes various signs and symptoms\
    \ of dirty code. The second part shows different methods to treat dirty code and\
    \ make it clean.\n\nThe book can be read both from cover to cover, as well as\
    \ in random order. Despite the fact that all the topics are closely intertwined,\
    \ you can easily jump around the chapters, using the great number of links scattered\
    \ through the text.\n\nThe code examples in this version of the book are in **Java**.\
    \ There are other versions which are available for download inside your account.\n\
    \n## Code Smells\n\nCode smells are key signs that refactoring is necessary. In\
    \ the process of refactoring, we get rid of smells, enabling further development\
    \ of the application with equal or greater speed.\n\n![](img/a9f2bde5dbae80f6f98fa49ccbde8add_5_0.png)\n\
    \nThe lack of regular refactoring can lead to a complete paralysis of a project\
    \ over time, wasting a few years of development and requiring you to spend several\
    \ more years to rewrite it from scratch.\n\nTherefore, it is necessary to get\
    \ rid of code smells while they are still small.\n\n## Bloaters\n\nBloaters are\
    \ code, methods and classes that have increased to such gargantuan proportions\
    \ that they're hard to work with. Usually these smells don't crop up right away,\
    \ rather accumulate over time as the program evolves (and especially when nobody\
    \ makes an effort to eradicate them).\n\n### Long Method\n\nA method contains\
    \ too many lines of code. Generally, any method longer than ten lines should make\
    \ you start asking questions.\n\n### Large Class\n\nA class contains many fields/methods/lines\
    \ of code.\n\n### Primitive Obsession\n\n- Use of primitives instead of small\
    \ objects for simple tasks (such as currency, ranges, special strings for phone\
    \ numbers, etc.)\n- Use of constants for coding information (such as a constant\
    \ USER_ADMIN_ROLE = 1 for referring to users with administrator rights.)\n- Use\
    \ of string constants as field names for use in data arrays.\n\n### Long Parameter\
    \ List\n\nMore than three or four parameters for a method.\n\n### Data Clumps\n\
    \nSometimes different parts of the code contain identical groups of variables\
    \ (such as parameters for connecting to a database). These clumps should be turned\
    \ into their own classes.\n\n### Long Method\n\n### Signs and Symptoms\n\nA method\
    \ contains too many lines of code. Generally, any method longer than ten lines\
    \ should make you start asking questions.\n\n![](img/a9f2bde5dbae80f6f98fa49ccbde8add_8_0.png)\n\
    \n### Reasons for the Problem\n\nLike the Hotel California, something is always\
    \ being added to a method but nothing is ever taken out. Since it's easier to\
    \ write code than to read it, this “smell” remains unnoticed until the method\
    \ turns into an ugly, oversized beast.\n\nMentally, it’s often harder to create\
    \ a new method than to add to an existing one: “But it’s just two lines, there’s\
    \ no use in creating a whole method just for that...” Which means that another\
    \ line is added and then yet another, giving birth to a tangle of spaghetti code.\n\
    \n### Treatment\n\nAs a rule of thumb, if you feel the need to comment on something,\
    \ you should extract a method. \n\n![](img/a9f2bde5dbae80f6f98fa49ccbde8add_9_0.png)\n\
    \n- **Extract Method**: To reduce the length of a method.\n- **Replace Temp with\
    \ Object**: If local variables interfere with extraction.\n- **Replace Whole Object**:\
    \ If loops are the way.\n- **Decompose Conditional**: If conditionals are the\
    \ way.\n\n### Payoff\n\nAmong all types of object-oriented code, classes live\
    \ longest. The longer a method is, the harder it becomes to understand.\n\nIn\
    \ addition, long methods offer the perfect place for unwanted code.\n\n![](img/a9f2bde5dbae80f6f98fa49ccbde8add_11_0.png)\n\
    \n### Performance\n\nDoes an increase in the number of methods hurt performance,\
    \ as many people claim? In almost all cases the impact is so negligible that it's\
    \ not worth worrying about.\n\nPlus, now that you have clear and understandable\
    \ code, you're more likely to find effective methods if the need arises.\n\n##\
    \ Large Class\n\n### Signs and Symptoms\n\nA class contains many fields/methods/lines\
    \ of code.\n\n![](img/a9f2bde5dbae80f6f98fa49ccbde8add_12_0.png)\n\n### Reasons\
    \ for the Problem\n\nClasses usually start small. But over time, they get bloated\
    \ as the program grows.\n\nAs is the case with long methods as well, programmers\
    \ usually find it mentally less taxing to place a feature in an existing class\
    \ than to create a new class for the feature.\n\n![](img/a9f2bde5dbae80f6f98fa49ccbde8add_13_0.png)\n\
    \n### Treatment\n\nWhen a class is wearing too many (functional) hats, think about\
    \ splitting it up:\n\n- **Extract Class**: if part of the behavior of the large\
    \ class can be spun off into a separate component.\n- **Extract Subclass**: if\
    \ part of the behavior of the large class can be implemented in different ways\
    \ or used in rare cases.\n- **Extract Interface**: if it's necessary to have a\
    \ list of the operations and behaviors that the client can use.\n- If a large\
    \ class is responsible for the graphical interface, you may try to move some of\
    \ its data and behavior to a separate domain object. In doing so, it may be necessary\
    \ to store copies of some data in two places and keep the data consistent. Duplicate\
    \ Data offers a way to do this.\n\n![](img/a9f2bde5dbae80f6f98fa49ccbde8add_14_0.png)\n\
    \n### Payoff\n\n- Refactoring of these classes spares developers from needing\
    \ to remember a large number of attributes for a class.\n- In many cases, splitting\
    \ large classes into parts avoids duplication of code and functionality.\n\n##\
    \ Primitive Obsession\n\n### Signs and Symptoms\n\n- Use of primitives instead\
    \ of small objects for simple tasks (such as currency, ranges, special strings\
    \ for phone numbers, etc.)\n- Use of constants for coding information (such as\
    \ a constant USER_ADMIN_ROLE = 1 for referring to users with administrator rights.)\n\
    - Use of string constants as field names for use in data arrays.\n\n![](img/a9f2bde5dbae80f6f98fa49ccbde8add_15_0.png)\n"
  mdcn: "\n\n## 深入理解重构\n\n离线版\n\n![](img/a9f2bde5dbae80f6f98fa49ccbde8add_0_0.png)\n\
    \n重构\n· 大师 ·\n\n作者：Alexander Shvets\n\n## 深入理解重构\n\n离线版 (Java)\nv2019-1.3\n\n\
    由 Lukas Haigner 购买\nlukas.haigner@gmail.com (#15232)\n\n# 枯燥的版权页\n\n你好！我是 Alexander\
    \ Shvets，在线课程“深入理解重构”（Dive Into Refactoring）的作者，这本书包含了课程的内容。\n\n![](img/a9f2bde5dbae80f6f98fa49ccbde8add_2_0.png)\n\
    \n本书的许可供你个人使用。请不要与他人分享，你的家人除外。如果你想与朋友或同事分享这本书，请购买一份课程并将其送给他们。\n\n如果你正在阅读这本书但没有购买它，或者它不是为你购买的，那么请做一个体面的人，购买你自己的课程。\n\
    \n感谢你尊重我投入在创建课程及这本书中的多年心血！\n\n© Alexander Shvets, Refactoring.Guru, 2019\n\nsupport@refactoring.guru\n\
    \n![](img/a9f2bde5dbae80f6f98fa49ccbde8add_3_0.png)\n\n# 前言\n\n我尝试将整个课程中所有的可用信息都挤进这本书书中。在大多数情况下，我成功了。但某些内容（例如现场示例）无法以静态电子书的形式呈现。因此，请将本书视为辅助材料，而不是完整重构课程的替代品。\n\
    \n本书分为大部分：**代码异味**（Code Smells）和**重构技术**（Refactoring Techniques）。第一部分描述脏代码的各种迹和症状。第二部分展示了处理脏代码并使其整洁的不同方法。\n\
    \n本书可以从头到尾阅读，也可以随机阅读。尽管所有主题都紧密交织，但你可以利用文中散布的大量链接轻松地在章节间跳转。\n\n本版本的代码示例使用的是 **Java**。在你的账户内还有其他版本可供下载。\n\
    \n## 代码异味\n\n代码异味是重构必要的关键信号。在重构过程中，我们消除这些异味，使应用程序能够以相同或更快的速度开发。\n\n![](img/a9f2bde5dbae80f6f98fa49ccbde8add_5_0.png)\n\
    \n缺乏定期重构会导致项目随着时间的推移完全瘫痪，浪费几年的开发时间，并要求你花费数年从头重写。\n\n因此，必须在代码异味仍然很小时将其消除。\n\n##\
    \ 膨胀物 (Bloaters)\n\n膨胀物是指规模增加到巨大程度、导致难以处理的代码、方法和类。通常这些异味不会立即出现，而是随着程序的演进随时间积累的（特别是当没有人努力消除它们时）。\n\
    \n### 长方法 (Long Method)\n\n方法包含过多的代码行。通常，任何超过十行的方法都应该让你开始产生疑问。\n\n### 大类 (Large\
    \ Class)\n\n一个类包含许多字段/方法/代码行。\n\n### 原始痴迷 (Primitive Obsession)\n\n- 使用原始类型而非小对象来处理简单任务（例如货币、范围、电话号码的特殊字符串等）。\n\
    \ 使用 使用常量进行编码信息（例如使用常量 `USER_ADMIN_ROLE = 1` 来引用具有管理员权限的用户）。\n- 使用字符串常量作为数据数组中的字段名。\n\
    \n### 长参数列表 (Long Parameter List)\n\n方法有超过三个或四个参数。\n\n### 数据团聚 (Data Clumps)\n\
    \n有时代码的不同部分包含相同的变量组（例如连接数据库的参数）。这些团聚应该被转换为它们自己的类。\n\n### 长方法\n\n### 迹象与症状\n\n\
    方法包含过多的代码行。通常，任何超过十行的方法都应该让你开始产生疑问。\n\n![](img/a9f2bde5dbae80f6f98fa49ccbde8add_8_0.png)\n\
    \n### 问题产生的原因\n\n就像《加州州馆》一样，方法中总是在被添加东西，但从未被拿走东西。由于写代码比读代码更容易，这种“异味”在方法变成一个丑陋、庞大的巨兽之前不会被察觉。\n\
    \n在心理上，创建一个新方法往往比向现有方法中添加内容更困难：“但这只是两行代码，没必要为了此专门创建一个整个方法……”这意味着又增加了一行，然后又是一行，催生了一团意大利面条代码。\n\
    \n### 处理方法\n\n根据经验，如果你觉得有必要对某些内容编写注释，那么你应该提取一个方法。\n\n![](img/a9f2bde5dbae80f6f9fafa49ccbde8add_9_0.png)\n\
    \n- **提取方法** (Extract Method)：减少方法的长度。\n- **用对象替换临时变量** (Replace Temp with Object)：如果局部变量干扰提取。\n\
    - **替换整个对象** (Replace Whole Object)：如果循环是解决办法。\n- **分解条件** (Decompose Conditional)：如果条件是解决办法。\n\
    \n### 收益\n\n在所有类型的面向对象代码中，类的生命周期最长。方法越长，越难以理解。\n\n此外，长方法为不需要的代码提供了容身之地。\n\n![](img/a9f2bde5dbae80f6f98fa49ccbde8add_11_0.png)\n\
    \n### 性能\n\n正如许多人所说的，方法数量的增加会损害性能吗？在几乎所有情况下，这种影响微乎其微，完全不需要担心。\n\n此外，既然你现在有了清晰且易懂的代码，当需要时，你更有可能发现有效的方法。\n\
    \n## 大类\n\n### 迹象与症状\n\n一个类包含许多字段/方法/代码行。\n\n![](img/a9f2bde5dbae80f6f98fa49ccbde8add_12_0.png)\n\
    \n### 问题产生的原因\n\n类通常开始很小。但随着程序的增长，它们随着时间变得臃肿。\n\n和长方法一样，程序员通常认为将功能放在现有类中比为该功能创建一个新类要少费精力。\n\
    \n![](img/a9f2bde5dbae80f6f98fa49ccbde8add_13_0.png)\n\n### 处理方法\n\n当一个类戴了太多（功能）时，考虑将其拆分：\n\
    \n- **提取类** (Extract Class)：如果大类的部分行为可以分离到一个组件。\n- **提取子类** (Extract Subclass)：如果大类的部分行为可以用不同的方式实现或在少数情况下使用。\n\
    - **提取接口** (Extract Interface)：如果需要列出客户端可以使用的操作和行为。\n- 如果一个大类负责图形界面，你可能尝试将其部分数据和行为移动到领域对象中。这样做时，可能需要在两个地方存储某些数据的副本并保持数据一致。重复数据（Duplicate\
    \ Data）提供了实现这一点的方法。\n\n![](img/a9f2bde5dbae80f6f98fa49ccbde8add_14_0.png)\n\n\
    ### 收益\n\n- 重构这些类让开发者无需记住类的大量属性。\n- 在许多情况下，将大类拆分为部分可以避免代码和功能的重复。\n\n## 原始痴迷\n\n\
    ### 迹象与症状\n\n- 使用原始类型而非小对象来处理简单任务（例如货币、范围、电话号码的特殊字符串等）。\n- 使用常量进行编码信息（例如使用常量 `USER_ADMIN_ROLE\
    \ = 1` 来引用具有管理员权限的用户）。\n- 使用字符串常量作为数据数组中的字段名。\n\n![](img/a9f2bde5dbae80f6f98fa49ccbde8add_15_0.png)\n\
    \n"
