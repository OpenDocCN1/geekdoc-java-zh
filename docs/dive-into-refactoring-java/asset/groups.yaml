  mdcn: "\n## 处理\n\n- 如果要向库类引入几个方法，请使用“引入外部方法”（Introduce Foreign Method）。\n- 对于类库的重大更改，使用“引入本地扩展”（Introduce\
    \ Local Extension）。\n\n## 收益\n\n减少代码重复（不再需要从头创建自己的库，你仍然可以利用现有的库）。\n\n![](img/a9f2bde5dbae80f6f98fa49ccbde8add_82_0.png)\n\
    \n## 何时忽略\n\n如果对库的更改涉及代码的修改，那么扩展库可能会产生额外的工作。\n\n## 重构技术\n\n重构是一个在不创建新功能的情况下改进代码的可控过程。它将混乱的代码转换为整洁的代码和简单的设计。\n\
    \n![](img/a9f2bde5dbae80f6f98fa49ccbde8add_83_0.png)\n\n整洁代码是指易读、编写和维护的代码。整洁的代码使软件开发具有预测性，并提高产品的质量。\n\
    \n重构技术描述了具体的重构步骤。大多数重构技术都有其优缺点。因此，每项重构都应该有充分的动机并谨慎应用。\n\n在之前的章节中，你已经看到特定的重构如何帮助解决代码问题。现在是时候详细查看这些重构技术了！\n\
    \n## 组合方法\n\n重构的大部分工作致力于正确地组合长方法。在大多数情况下，过长的方法是万恶之根源。这些方法内部代码的变幻隐藏了执行逻辑，使得方法变得极其难以理解——更难以修改。\n\
    \n这一组的重构技术可以简化方法、消除代码重复，并为未来的改进铺平道路。\n\n### 提取方法 (Extract Method)\n\n**问题：** 你有一段可以分组的代码片段。\n\
    \n**解决方案：** 将此代码移动到单独的新方法（或函数）中，并用对方法的调用替换旧代码。\n\n### 内联方法 (Inline Method)\n\n\
    **问题：** 当方法体比方法本身更明显时，请使用此技术。\n\n**解决方案：** 用方法的内容替换对方法的调用，并删除该方法本身。\n\n### 提取变量\
    \ (Extract Variable)\n\n**问题：** 你有一个难以理解的表达式。\n\n**解决方案：** 将表达式的结果或其部分放在具有自解释意义的独立变量中。\n\
    \n### 内联临时变量 (Inline Temp)\n\n**问题：** 你有一个临时变量，它被赋值简单表达式的结果且仅如此。\n\n**解决方案：**\
    \ 将对变量的引用为表达式本身。\n\n### 用查询替换临时变量 (Replace Temp with Query)\n\n**问题：** 你将表达式的结果存放在局部变量中，以便稍后使用。\n\
    \n**解决方案：** 将整个表达式移动到单独的方法中并从中返回结果。使用查询方法而不是变量。如有必要，将新方法整合到其他方法中。\n\n### 分解临时变量\
    \ (Split Temporary Variable)\n\n**问题：** 你有一个局部变量，用于存储方法内部各种中间值（循环变量除外）。\n\n**解决方案：**\
    \ 为不同的值使用不同的变量。每个变量应该只负责特定的事情。\n\n### 移除对参数的赋值 (Remove Assignments to Parameters)\n\
    \n**问题：** 方法体内部给参数赋赋值。\n\n**解决方案：** 使用局部变量代替参数。\n\n### 将方法替换为方法对象 (Replace Method\
    \ with Method Object)\n\n**问题：** 你有一个长方法，其中的局部变量交织在一起，以至于无法应用“提取方法”。\n\n**解决方案：**\
    \ 将方法转换为单独的类，使局部变量变成类的字段。然后你可以在同一个类中将方法拆分为几个方法。\n\n### 替换算法 (Substitute Algorithm)\n\
    \n**问题：** 你想用新算法替换现有算法吗？\n\n**解决方案：** 用新算法替换实现该算法的方法体。\n\n## 提取方法 (Extract Method)\n\
    \n### 问题\n\n你有一段可以分组的代码片段。\n\n```\nvoid printOwning() {\n    printBanner();\n\
    \    // 打印详细信息。\n    System.out.println(\"name: \" + name);\n    System.out.println(\"\
    amount: \" + getOutstanding());\n}\n```\n\n### 解决方案\n\n将此代码移动到单独的新方法（或函数）中，并用对方法的调用替换旧代码。\n\
    \n```\nvoid printOwning() {\n    printBanner();\n    printDetails(getOutstanding());\n\
    }\nvoid printDetails(double outstanding) {\n    System.out.println(\"name: \"\
    \ + name);\n    System.out.println(\"amount: \" + outstanding);\n}\n```\n\n##\
    \ 为什么重构\n\n方法中的行越多，越难弄清楚该方法的作用。这是此重构的主要原因。\n\n除了消除代码中的粗糙边缘，提取方法也是许多其他重构方法的步骤之一。\n\
    \n## 收益\n\n- 更具可读性的代码！确保给新方法一个描述其用途的名字：例如：`createOrder()`、`renderCustomerInfo()`\
    \ 等。\n- 更少的代码重复。通常方法中找到的代码可以在程序的其他地方复用。因此，你可以用对新方法的调用替换重复部分。\n- 隔离代码的独立部分，这意味着错误发生的概率降低（例如修改了错误的变量）。\n\
    \n## 如何重构\n\n1. 创建一个新方法并命名，使其目的一目了然。\n2. 将相关的代码片段复制到你的新方法中。从旧位置删除该片段并在并在放置对该方法的调用。找到此片段中使用的所有变量。如果它们在片段内部声明且在外部未使用，则只需保留它们——它们将成为新方法的局部变量。\n\
    3. 如果变量在要提取的代码之前声明，你将需要将这些变量传递给新方法的参数以便使用。如果你在提取的代码中看到局部变量发生变化，这可能意味着该值稍后主方法中仍然需要。有时通过“用查询替换临时变量”来消除这些变量更容易。\n\
    4. 双重检查！如果确实如此，则删除该方法。\n\n## 反重构\n\n- 内联方法 (Inline Method)\n\n## 相似重构\n\n- 移动方法\
    \ (Move Method)\n\n## 有帮助的重构\n\n- 引入参数对象 (Introduce Parameter Object)\n- 形成模板方法\
    \ (Form Template Method)\n- 参数化 (Parameterize Method)\n\n## 消除异味\n\n- 重复代码 (Duplicate\
    \ Code)\n- 长方法 (Long Method)\n- 特性类 (Feature Envy)\n- Switch 语句 (Switch Statements)\n\
    - 消息链 (Message Chains)\n- 注释 (Comments)\n- 数据类 (Data Class)\n\n## 内联方法 (Inline\
    \ Method)\n\n### 问题\n\n当方法体比方法本身更明显时，使用此技术。\n\n```\nclass PizzaDelivery {\n  //\
    \ ...\n  int getRating() {\n    return moreThanFiveDeliveries() ? 2 : 1;\n  }\n\
    \  boolean moreThanFiveDeliveries() {\n    return numberOfLateDeliveries > 5;\n\
    \  }\n}\n```\n\n### 解决方案\n\n用方法的内容替换对方法的调用，并删除该方法本身。\n\n```\nclass PizzaDelivery\
    \ {\n  // ...\n  int getRating() {\n    return numberOfLateDeliveries > 5 ? 2\
    \ : 1;\n  }\n}\n```\n\n## 反重构\n\n- 提取方法 (Extract Method)\n\n消除异味\n\n- 猜测性泛化 (Speculative\
    \ Generality)\n"
