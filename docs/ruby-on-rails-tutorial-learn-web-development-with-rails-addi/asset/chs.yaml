  \n**图 5.10：** `/about` 处的关于页面。\n\n### 5.3.4 布局链接测试\n\n现在我们已经填充了几个布局链接，测试它们以确保其运行正常是一个很好的主意。我们可以通过浏览器手动进行操作，首先访问根路径，然后手动检查链接，但这会很快变得繁琐。相反，我们将使用*集成测试*来模拟相同的步骤，这允许我们对应用程序的行为编写端到端测试。我们可以从生成一个模板测试开始，将其命名为\
  \ `site_layout`：\n\n点击此处查看代码图片\n\n```bash\n$ rails generate integration_test site_layout\n\
  invoke test_unit\ncreate test/integration/site_layout_test.rb\n```\n\n注意，Rails 生成器会自动在测试文件名后添加\
  \ `_test`。\n\n我们测试布局链接的计划涉及检查网站的 HTML 结构：\n\n1. 获取根路径（首页）。\n2. 验证渲染了正确的页面模板。\n3.\
  \ 检查指向首页、帮助、关于和联系页的正确链接。\n\n列表 5.32 显示了我们如何使用 Rails 集成测试将这些步骤转换为代码，从 `assert_template`\
  \ 方法开始以验证首页是否使用正确的视图渲染。\n\n16 一些开发者坚持单个测试不应该包含多个断言。我认为这种做法没有必要那么复杂，而且如果每个测试之前需要通用的设置任务，还会产生额外的开销。此外，编写良好的测试讲述了一个连贯的故事，将其拆分成独立的部分会破坏叙事。因此，我强烈倾向于在一个测试中包含多个断言，依靠\
  \ Ruby（通过 minitest）来告诉我任何失败断言的具体行数。\n\n**列表 5.32：** 布局链接的测试。**绿色**\n\n`test/integration/site_layout_test.rb`\n\
  \n点击此处查看代码图片\n\n```ruby\nrequire 'test_helper'\n\nclass SiteLayoutTest < ActionDispatch::IntegrationTest\n\
  \  test \"layout links\" do\n    get root_path\n    assert_template 'static_pages/home'\n\
  \    assert_select 'a', root_path, count: 2\n    assert_select 'a', help_path\n\
  \    assert_select 'a', about_path\n    assert_select 'a', contact_path\n  end\n\
  end\n```\n\n\n\n\n\n```ruby\nclass ActiveSupport::TestCase\n  fixtures :all\n  include\
  \ ApplicationHelper\n  .\n  .\n  .\nend\n```\n\n**Listing 5.36:** 在测试中使用 `full_title`\
  \ 助手。**GREEN**\n\n`test/integration/site_layout_test.rb`\n\n点击此处查看代码图片\n\n***\n\n\
