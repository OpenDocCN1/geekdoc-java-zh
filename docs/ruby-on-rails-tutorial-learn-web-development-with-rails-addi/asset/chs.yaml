  \ 和 `email` 字段都存在。在第 7.3.3 节中，我们将看到如何将这一要求向上传递到创建新用户的注册表单。\n\n我们将通过基于 Listing 6.5\
  \ 中的测试，开始对 `name` 属性的存在性进行测试。如 Listing 6.7 所示，我们只需要将 `@user` 变量的 `name` 属性设置为空字符串（在本例中，是一个由空格组成的字符串），然后检查（使用\
  \ `assert_not` 方法）生成的 `User` 对象不是有效的。\n\n**Listing 6.7:** 对 `name` 属性验证的测试。**RED**\n\
  \n```\ntest/models/user_test.rb\n```\n\n点击此处查看代码图片\n\n* * *\n\n```\nrequire 'test_helper'\n\
  \nclass UserTest < ActiveSupport::TestCase\n  def setup\n    @user = User.new(name:\
