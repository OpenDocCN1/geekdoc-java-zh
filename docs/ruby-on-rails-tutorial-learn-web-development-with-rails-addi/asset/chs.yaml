  \ media: 'all'\n```\n\n是该函数的调用。但这里有几个谜团。首先，括号在哪里？在 Ruby 中，括号是可选的，因此两者是等价的：点击此处查看代码图片\n\
  \n```ruby\nstylesheet_link_tag('application', media: 'all')\nstylesheet_link_tag\
  \ 'application', media: 'all'\n```\n\n其次，`media` 参数看起来像是一个哈希，但大括号在哪里？当哈希是函数的最后一个参数时，大括号是可选的，因此两者是等价的：点击此处查看代码图片\n\
  \n```ruby\nstylesheet_link_tag 'application', { media: 'all' }\nstylesheet_link_tag\
