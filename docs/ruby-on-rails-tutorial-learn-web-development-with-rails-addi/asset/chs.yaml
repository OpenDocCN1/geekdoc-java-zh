  \ `admin` 属性出现在 `params` 调试信息中。\n\n### 7.3.3 注册错误消息\n\n作为处理用户创建失败的最后一步，我们将添加有用的错误消息，以指示阻止成功注册的问题。方便的是，Rails\
  \ 会根据 User 模型的验证自动提供此类消息。例如，考虑尝试保存一个具有无效邮箱地址且密码过短的用户：\n\n点击此处查看代码图片\n\n```bash\n\
  $ rails console\n>> user = User.new(name: \"Foo Bar\", email: \"foo@invalid\", password:\
  \ \"dude\", password_confirmation: \"dude\")\n>> user.save\n=> false\n>> user.errors.full_messages\n\
  => [\"Email is invalid\", \"Password is too short (minimum is 6 characters)\"]\n\
  ```\n\n这里的 `errors.full_messages` 对象（我们之前在 第 6.2.2 节 中简要见过过）包含一个错误消息数组。\n\n与上面的控制会话一样，列表\
  \ 7.18 中的失败保存了一个与 `@user` 对象相关的错误消息列表。为了在浏览器中显示这些消息，我们将在 `new` 页面上渲染 `error-messages`\
  \ 模板，同时为每个条目添加 CSS 类 `form-control`（对 Bootstrap 有特殊意义），如列表 7.20 所示。值得注意的是，这个 `error-messages`\
  \ 模板只是第一次尝试；最终版本出现在 第 13.3.2 节 中。\n\n**列表 7.20：** 在注册表单上显示错误消息的代码。\n\n`app/views/users/new.html.erb`\n\
  \n点击此处查看代码图片\n\n```erb\n<% provide(:title, 'Sign up') %>\n<h1>Sign up</h1>\n<div\
  \ class=\"row\">\n  <div class=\"col-md-6 col-offset-3\">\n    <%= form_for(@user)\
  \ do |f| %>\n      <%= render 'shared/error_messages' %>\n      <%= f.label :name\
  \ %>\n      <%= f.text_field :name, class: 'form-control' %>\n      <%= f.label\
  \ :email %>\n      <%= f.text_field :email, class: 'form-control' %>\n      <%=\
  \ f.label :password %>\n      <%= f.password_field :password, class: 'form-control'\
  \ %>\n      <%= f.label :password_confirmation %>\n      <%= f.password_field :password_confirmation,\
  \ class: 'form-control' %>\n      <%= f.submit \"Create account\" %>\n    <% end\
  \ %>\n  </div>\n</div>\n```\n*(注：由于用户提供的原文中 ERB 块的内容实际上是混乱的，我将直接根据用户提供的原文进行翻译，并保持代码块不被翻译。)*\n\
  \n\n\n\n我们在这里看到 `pluralize` 接收一个整数参数，然后返回其第二个参数的正确复数形式的数量。该方法的底层是一个强大的 `inflector`，它知道如何对大量单词进行复数处理，包括许多不规则复数形式：\n\
  \n点击此处查看代码图片\n\n```\n>> helper.pluralize(2, \"woman\"),\n=> \"2 women\"\n\n>> helper.pluralize(3,\
  \ \"erratum\")\n=> \"3 errata\"\n```\n\n由于使用了 `pluralize`，代码\n\n点击此处查看代码图片\n\n```erb\n\
  <%= pluralize(@user.errors.count, \"error\") %>\n```\n\n会根据错误的数量返回 `\"0 errors\"\
  `、`\"1 error\"`、`\"2 errors\"` 等，从而避免了如 `\"1 errors\"` 这样不符合语法的短语（在应用和网页上这是一个非常常见的错误）。\n\
  \n注意，列表 7.21 包含了 CSS ID `error_explanation`，用于样式化错误信息。（回想第 5.1.2 节，CSS 使用井号 `#`\
  \ 来设置 id。）此外，在无效提交后，Rails 会自动将带有错误的字段包裹在带有 CSS 类 `field_with_errors` 的 `div` 中。这些标签随后允许我们使用列表\
  \ 7.22 所示的 SCSS 来样式化错误信息，该代码利用 Sass 的 `@extend` 函数来包含 Bootstrap 类 `has-error` 的功能。\n\
  \n**列表 7.22：** 用于样式化错误信息的 CSS。\n\n`app/assets/stylesheets/custom.scss`\n\n点击此处查看代码图片\n\
  \n```scss\n/* forms */\n.\n.\n.\n#error_explanation {\n  color: red;\n  ul {\n \
  \   color: red;\n    margin: 0 0 30px 0;\n  }\n}\n.field_with_errors {\n  @extend\
  \ .has-error;\n  .form-control {\n    color: $state-danger-text;\n  }\n}\n```\n\n\
