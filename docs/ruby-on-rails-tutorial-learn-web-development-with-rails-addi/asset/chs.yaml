  \ -OL cdn.learnenough.com/kitten.jpg\n```\n\n* * *\n\n### 5.1.2 Bootstrap 和自定义 CSS\n\
  \n在节 5.1.1 节中，我们将许多 HTML 元素与 CSS 类关联起来，这使得我们在基于 CSS 构建布局时具有相当的灵活性。如节 5.1.1 节 所述，这些类中的许多是\
  \ Bootstrap 特有的，Bootstrap 是来自 Twitter 的框架，可以轻松地向 HTML5 应用中添加精美的网页设计和用户界面元素。在本节中，我们将\
  \ Bootstrap 与一些自定义 CSS 规则结合，开始为示例应用程序添加一些样式。值得，使用 Bootstrap 会自动让我们的应用程序设计具有响应式，确保它在各种设备上看起来都很合理。\n\
  \n![image](img/image01074)\n**图 5.3：** 一张必不可少的幼猫图片。\n\n![image](img/image01076)\n\
  **图 5.4：** 在主页添加幼猫图片的结果。\n\n我们的第一步是添加 Bootstrap，在 Rails 应用中可以通过 `bootstrap-sass`\
  \ gem 完成，如列表 5.5 所示。Bootstrap 框架原生使用 Less 语言制作动态样式表，但 Rails 资源管道默认支持（非常相似的）Sass\
  \ 语言（节 5.2），因此 `bootstrap-sass` 将 Less 转换为 Sass 并为当前应用程序提供所有必要的 Bootstrap 文件。[part0014.xhtml_ch5en]。一如既往，你应该使用\
  \ railstutorial.org 列出的版本号，而不是这里列出的版本。也可以在资源管道中使用 Less；详情请见 `less-rails` gem。\n\n\
  **列表 5.5：** 在 `Gemfile` 中添加 `bootstrap-sass` gem。\n\n点击此处查看代码图片\n\n* * *\n\n```\n\
  source 'https://rubygems.org'\ngem 'rails', '5.0.0'\ngem 'bootstrap-sass', '3.3.6'\n\
  ```\n\n* * *\n\n要安装 Bootstrap，我们像往常运行 `bundle install`：\n\n```\nbundle install\n\
  ```\n\n尽管 `rails generate` 会自动为每个控制器创建一个单独的 CSS 文件，但很难正确且按顺序包含它们，因此为了简单起见，我们将本教程所需的所有\
  \ CSS 放在一个文件中。让自定义 CSS 起作用的第一步是创建一个自定义 CSS 文件：点击此处查看代码图片\n\n```\ntouch app/assets/stylesheets/custom.scss\n\
  ```\n\n（这使用了节 3.3.3 节 中的 `touch` 技巧，但你可以以任何喜欢的方式创建文件。）在这里，目录名和文件扩展名都很重要。`app/assets/stylesheets/`\
  \ 目录是资源管道的一部分（节 5.2），此目录中的任何样式表都将自动作为站点布局中包含的 `application.css` 文件的一部分。此外，文件名 `custom.scss`\
  \ 包含 `.scss` 扩展，表示这是一个“Sassy CSS”文件，并指示资源管道使用 Sass 处理它（在节 5.2.2 之前我们不会使用 Sass，但为了让\
  \ `bootstrap-sass` gem 发挥魔力，它是必要的。）在自定义文件内部，我们可以使用 `@import` 函数包含 Bootstrap，如列表\
  \ 5.6 所示。\n\n**列表 5.6：** 添加 Bootstrap CSS。\n\napp/assets/stylesheets/custom.scss\n\
  \n点击此处查看代码图片\n\n* * *\n\n```\n@import \"bootstrap-sprockets\";\n@import \"bootstrap\"\
  ;\n```\n\n* * *\n\n为了将更改整合到开发应用程序中，我们需要重启 Web 服务器（通过按 Ctrl-C 然后像节 1.3.2 节那样运行 `rails\
  \ server`），结果如图 5.5。文本的位置不太好，Logo 没有样式，但颜色和注册按钮看起来不错。\n\n接下来，我们将添加一些 CSS，如列表 5.7\
  \ 所示，用于全范围内对布局和每个页面进行样式设计。结果如图 5.6（列表 5.7 中有很多规则；为了了解某个 CSS 规则的作用，通常有助于使用 CSS 注释将其注释掉（即将其放入\
  \ `/* ... */` 中），并观察变化。）\n\n\n\n\n\n```css\nresize: vertical;\n}\n\n.center {\n\
  \  text-align: center;\n}\n\n.center h1 {\n  margin-bottom: 10px;\n}\n```\n\n注意\
  \ Listing 5.7 中的 CSS 具有一致的形式。通常情况下，CSS 规则引用一个类（class）、id（id）、HTML 标签或它们的组合，后面紧跟了一系列样式命令。例如，\n\
  \n```css\nbody {\n  padding-top: 60px;\n}\n```\n\n在页面顶部设置了 60 像素的内边距。由于 `header`\
  \ 标签中使用了 `navbarfixed-top` 类，Bootstrap 将导航栏固定在页面顶部，因此内边距的作用是将正文与导航栏隔离开。（由于 Bootstrap\
  \ 2.0 之后默认的导航栏颜色发生了变化，我们需要 `navbar-inverse` 类来将其变为深色而不是浅色。）同时，规则中的 CSS\n\n```css\n\
  .center {\n  text-align: center;\n}\n```\n\n将 `center` 类与 `text-align: center` 属性相关。换句话说，`.center`\
  \ 中的点 `.` 表示该规则样式化一个类。（正如我们在 Listing 5.9 中看到的，井号 `#` 标识一个样式化 CSS *id* 的规则。）这意味着任何标签（例如\
  \ `div`）内部具有类 `center` 的元素都将在页面的上居中显示。（我们之前在 Listing 5.2 中看到过该类的示例。）\n\n虽然 Bootstrap\
  \ 附带了用于精美排版的的 CSS 规则，但我们还将为网站上文本的显示添加一些自定义规则，如 Listing 5.8 所示。（并不是所有这些规则适用于首页，但这里的每条规则都会在示例应用的某个地方被使用。）Listing\
  \ 5.8 的结果如图 Figure 5.7 所示。\n\n![image](img/image0108.jpeg)\n\n**图 5.7：** 添加一些排版样式。\n\
  \n**列表 5.8：** 为精美排版添加 CSS。\n\n`app/assets/stylesheets/custom.scss`\n\n点击此处查看代码图像\n\
  \n```css\n@import \"bootstrap-sprockets\";\n@import \"bootstrap\";\n\n/* typography\
  \ */\nh1, h2, h3, h4, h5, h6 {\n  line-height: 1;\n}\n\nh1 {\n  font-size: 3em;\n\
  \  letter-spacing: -2px;\n  margin-bottom: 30px;\n  text-align: center;\n}\n\nh2\
  \ {\n  font-size: 1.2em;\n  letter-spacing: -1px;\n  margin-bottom: 30px;\n  text-align:\
  \ center;\n  font-weight: normal;\n  color: #777;\n}\n\np {\n  font-size: 1.1em;\n\
  \  line-height: 1.7em;\n}\n```\n\n最后，我们将添加一些规则来样式化网站的 logo，它仅由文本“sample app”组成。Listing\
  \ 5.9 中的 CSS 将文本转换为大写并修改了其大小、颜色和位置。（我们使用了 CSS id，因为我们预计网站 logo 只会在页面上出现一次，但你也可以使用类。）\n\
  \n**列表 5.9：** 为网站 logo 添加 CSS。\n\n`app/assets/stylesheets/custom.scss`\n\n点击此处查看代码图像\n\
  \n```css\n@import \"bootstrap-sprockets\";\n@import \"bootstrap\";\n\n/* header\
  \ */\n#logo {\n  float: left;\n  margin-right: 10px;\n  font-size: 1.7em;\n  color:\
  \ #fff;\n  text-transform: uppercase;\n  letter-spacing: -1px;\n  padding-top: 9px;\n\
  \  font-weight: bold;\n}\n\n#logo:hover {\n  color: #fff;\n  text-decoration: none;\n\
  }\n```\n\n这里 `color: #fff` 将 logo 的颜色更改为白色。HTML 颜色可以用三对十六进制（hexadecimal）数字编码，每对分别代表红、绿、蓝原色（按此顺序）。代码\
  \ `#ffffff` 是三种颜色的最大值，即纯白色，而 `#fff` 是完整 `#ffffff` 的缩写。CSS 标准还为常用颜色定义了许多同义词，包括用于\
  \ `#fff` 的 `white`。Listing 5.9 中 CSS 的结果如图 Figure 5.8 所示。\n\n### 练习\n\n任何 Rails\
