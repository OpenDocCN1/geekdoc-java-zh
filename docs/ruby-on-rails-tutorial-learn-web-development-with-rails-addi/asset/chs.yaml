  \n## 10.2 授权\n\n在 Web 应用程序的范围内，*身份验证*（authentication）允许我们识别网站的用户，而*授权*（authorization）让我们控制他们能做什么。在第\
  \ 8 章中构建身份验证机制的一个好处处是，我们现在也可以实现授权了。\n\n\n\n\n\n在第 10.2.1 节中，我们将处理未登录用户尝试访问其通常可以访问的受保护页面的情况。由于这种情况在应用程序的使用过程中很容易发生，此类用户将被重定向到登录页面，并带有一个实用的提示信息，如图\
  \ 10.6 所示。另一方面，尝试访问永远不会获得授权页面的用户（例如已登录的用户尝试访问另一个用户的编辑页面）将被重定向到根 URL（第 10.2.2 节）。\n\
  \n#### 10.2.1 要求用户已登录\n\n为了实现图 10.6 所示的重定向行为，我们将在 `Users` 控制器中使用*前置过滤器*（before filter）。置过滤器使用\
  \ `before_action` 命令在执行指定的操作之前调用特定的方法。⁴ 为了要求用户登录，我们定义了一个 `logged_in_user` 方法并使用\
  \ `before_action :logged_in_user` 调用它，如代码列表 10.15 所示。\n\n[4.] 前置过滤器的命令曾被称为 `before_filter`，但\
  \ Rails 核心团队决定重命名它，以强调过滤器是在特定的控制器操作之前发生的。\n\n![image](img/image02107.jpeg)\n\n**图\
  \ 10.6:** 访问受保护页面的结果原型\n\n**代码列表 10.15:** 添加 `logged_in_user` 前置过滤器。**红色**\n\n```ruby\n\
  app/controllers/users_controller.rb\n```\n\n点击此处查看代码图片\n\n```ruby\nclass UsersController\
  \ < ApplicationController\n  before_action :logged_in_user, only: [:edit, :update]\n\
  \  .\n  .\n\n  private\n    def user_params\n      params.require(:user).permit(:name,\
  \ :email, :password, :password_confirmation)\n    end\n\n    # Before filters\n\
  \    # 确认用户是否已登录。\n    def logged_in_user\n      unless logged_in?\n        flash[:danger]\
  \ = \"Please log in.\"\n        redirect_to login_url\n      end\n    end\nend\n\
  ```\n\n默认情况下，前置过滤器适用于控制器中的每个操作，因此在这里我们通过传递 `only:` 将过滤器限制为仅作用 `:edit` 和 `:update`\
  \ 操作。\n\n我们可以通过退出登录并尝试访问用户页面 `/users/1/edit` 来在代码列表 10.15 中查看前置过滤器的结果，如图 10.7 所示。\n\
  \n如代码列表 10.15 标题所示，我们的测试套件目前是**红色**：\n\n**代码列表 10.16: 红色**\n\n```bash\n$ rails test\n\
  ```\n\n原因是 edit 和 update 操作现在需要用户登录，但在测试中没有用户登录。我们将通过在第 9.3 节开发的 `log_in_as` 辅助方法（0018.xhtml_list9_24)）在执行\
  \ edit 或 update 操作之前登录用户来修复测试套件，如[代码列表 10.17 所示。\n\n**代码列表 10.17:** 在测试中登录。**绿色**\n\
  \n```ruby\ntest/integration/users_edit.rb\n```\n\n点击此处查看代码图片\n\n```ruby\nrequire\
  \ 'test_helper'\nclass UsersEditTest < ActionDispatch::IntegrationTest\n  def setup\n\
  \    @user = users(:michael)\n  end\n  test \"unsuccessful edit\" do\n    log_in_as(@user)\n\
  \    get edit_user_path(@user)\n    .\n  end\n  test \"successful edit\" do\n  \
  \  log_in_as(@user)\n    get edit_user_path(@user)\n    .\n  end\nend\n```\n\n![image](img/image0214.jpeg)\n\
  \n**图 10.7:** 尝试访问受保护页面后的登录表单。（我们可以通过在代码列表 10.17 的 `setup` 方法中放置登录来消除某些重复，但在第 10.2.3\
  \ 节中，我们将更改一个测试在登录之前访问编辑页面，这如果登录步骤发生在测试设置期间是不可能的。）\n\n此时，我们的测试套件应该是**绿色**：\n\n**代码列表\
  \ 10.18: 绿色**\n\n```bash\n$ rails test\n```\n\n尽管我们的测试套件现在通过了，但我们还没有完成前置过滤器，因为即使移除安全模型，套件仍然是**绿色**（可以通过注释掉它代码列表\
  \ 10.19 来验证）。这是一个问题——在我们希望测试套件捕获的所有回归中，一个巨大的安全漏洞可能是第 1 个，因此代码列表 10.19 中的代码绝对应该是**红色**。让我们编写测试来实现这一点。\n\
  \n**代码列表 10.19:** 注释掉前置过滤器以测试安全模型。**绿色**\n\n```ruby\napp/controllers/users_controller.rb\n\
  ```\n\n点击此处查看代码图片\n\n```ruby\nclass UsersController < ApplicationController\n  #\
