  >>   s.?.?\nend\n>> string_shuffle(\"foobar\")\n=> \"oobfra\"\n```\n\n### 4.3.3\
  \ 哈希（Hashes）与符号（Symbols）\n\n哈希本质上是不局限于整数索引的数组。（事实上，由于这个原因，某些语言（特别是 Perl）有时会将哈希称为*关联数组*。）相反，哈希索引（或称为*键*，keys）可以是几乎任何对象。例如，我们可以使用字符串作为键：\n\
  \n点击此处查看代码图像\n\n```ruby\n>> user = {}                          # {} 是一个空哈希。\n=>\
  \ {}\n\n>> user[\"first_name\"] = \"Michael\"      # 键 \"first_name\", 值 \"Michael\"\
  \n=> \"Michael\"\n\n>> user[\"last_name\"] = \"Hartl\"        # 键 \"last_name\"\
  , 值 \"Hartl\"\n=> \"Hartl\"\n\n>> user[\"first_name\"]                  # 元素访问类似于数组。\n\
  => \"Michael\"\n\n>> user                               # 哈希的字面量表示\n=> {\"last_name\"\
  =>\"Hartl\", \"first_name\"=>\"Michael\"}\n```\n\n哈希用包含键值对的大括号表示；一对没有键值对的大括号——即\
  \ `{}`——表示一个空哈希。需要注意的是，用于哈希的大括号与用于块（blocks）的大括号之间没有任何关系（是的，这可能会让人困惑。）。虽然哈希看起来像数组，但它们一个重要的区别是，哈希通常不保证保持其元素的特定顺序。如果顺序对你很重要，请使用数组。\n\
  \n### 4.3.3 哈希的排序\n\nRuby 1.9 及更高版本实际上保证哈希会按照输入的顺序保持其元素，但依赖于特定的排序是不明智的。\n\n与其使用方括号逐个定义哈希，不如使用键和值并由\
  \ `=>` 分隔的字面量表示，这被称为“哈箭”（hashrocket）：点击此处查看代码图像 \n\n```ruby\n>> user = { \"first_name\"\
  \ => \"Michael\", \"last_name\" => \"Hartl\" }\n=> {\"first_name\"=>\"Michael\"\
  , \"last_name\"=>\"Hartl\"}\n```\n\n哈希用包含键值对的大括号表示；一对没有键值对的大括号——即 `{}`——表示一个空哈希。需要注意的是，用于哈希的大括号与用于块的大括号之间没有任何关系（是的，这可能会让人困惑）。虽然哈希看起来像数组，但它们一个重要的区别是，哈希通常不保证保持其元素的特定顺序。如果顺序对你很重要，请使用数组。\n\
  \n（注：此处根据翻译逻辑，原文中似乎存在部分重复或乱码的文本，已根据上下文进行平滑处理）\n\n### 4.3.3 哈希排序\n\nRuby 1.9 及更高版本实际上保证哈希会按照输入的顺序保持其元素，但依赖于特定的排序是不明智的。\n\
  \n与其使用方括号逐个定义哈希，不如使用键和值并由 `=>` 分隔的字面量表示，这被称为“哈箭”（hashrocket）：\n\n点击此处查看代码图像 \n\n\
  ```ruby\n>> user = { \"first_name\" => \"Michael\", \"last_name\" => \"Hartl\" }\n\
