  <%= f.label :email %>\n<%= f.email_field :email %>\n```\n\n产生了 HTML\n\n点击此处查看代码图片\n\
  \n```html\n<label for=\"user_email\">Email</label>\n<input id=\"user_email\" name=\"\
  user[email]\" type=\"email\" />\n```\n\n以及\n\n点击此处查看代码图片\n\n```ruby\n<%= f.label\
  \ :password %>\n<%= f.password_field :password %>\n```\n\n产生了 HTML\n\n点击此处查看代码图片\n\
  \n```html\n<label for=\"user_password\">Password</label>\n<input id=\"user_password\"\
  \ name=\"user[password]\" type=\"password\" />\n```\n\n如 Figure 7.12 所示，文本和电子邮件字段（`type=\"\
  text\"` 和 `type=\"email\"`）会显示其内容，而密码字段（`type=\"password\"`）出于安全考虑会隐藏内容。\n\n\n\n\
  \n\n回想第 7.1.2 节，在 `routes.rb` 文件中添加 `resources :users`（列表 7.3）会自动确保我们的 Rails 应用响应来自表\
  \ 7.1\n\n```html\n<form action=\"/users\" class=\"new_user\" id=\"new_user\" method=\"\
  post\">\n```\n\n如第 7.2.2 节所述，此 HTML 向 `/users` 路径发送了一个 POST 请求。\n\n实现可工作注册表单的第一步是添加列表\
  \ 7.18 中的代码。该列表包含了第二次对 `render` 方法的使用，我们首次在部分视图（partials）的背景下看到它（第 5.1.3 节）；如你所示，`render`\
  \ 在控制器动作中同样有效。注意我们利用此机会引入了 `if`-`else` 分支结构，这允许我们根据 `@user.save` 的值分别处理失败和成功的情况（正如我们在第\
  \ 6.1.3 节中所看到的，它取决于保存是否成功返回 `true` 或 `false`）。\n\n![image](img/image01322.jpeg)\n\
  \n**图 7.14：** 注册失败页面的原型。\n\n**列表 7.18：** 一个可以处理注册失败的 `create` 。\n\napp/controllers/users_controller.rb\n\
  \n点击此处查看代码图片\n\n```ruby\nclass UsersController < ApplicationController\n  def show\n\
  \    @user = User.find(params[:id])\n  end\n\n  def new\n    @user = User.new\n\
  \  end\n\n  def create\n    @user = User.new(params[:user])     # 这不是最终实现！\n   \
  \ if @user.save\n      # 处理成功的保存。\n    else\n      render 'new'\n    end\n  end\n\
  end\n```\n\n注意该注释：这不是最终的实现。但它足够让我们开始了，我们将在第 7.3.2 节中完成实现。\n\n理解列表 7.18 中代码工作原理的方法是*提交*带有某些无效注册数据的表单。结果显示在图\
  \ 7.15 中，完整的调试信息显示在图 7.16 中。\n\n![image](img/image01324.jpeg)\n\n**图 7.15：** 注册失败。\n\
  \n![image](img/image01325.jpeg)\n\n**图 7.16：** 注册失败调试信息。\n\n为了更更好地了解 Rails 如何处理提交，让我们仔细查看调试信息（图\
  \ 7.16）中参数哈希的 `user` 部分：\n\n点击此处查看代码图片\n\n```json\n\"user\" => { \"name\" => \"\
  Foo Bar\",\n           \"email\" => \"foo@invalid\",\n           \"password\" =>\
  \ \"[FILTERED]\",\n           \"password_confirmation\" => \"[FILTERED]\"\n}\n```\n\
  \n此哈希作为 `params` 的一部分传递给 Users 控制器。（后续文本遵循类似的逻辑……）\n\n\n\n\n\n此代码返回一个 `params` 哈希表的版本，其中仅包含允许的属性（如果缺少\
  \ `:user` 属性则会抛出错误）。\n\n为了方便使用这些参数，惯例是引入一个名为 `user_params` 的辅助方法（它返回一个适当的初始化哈），并用它代替\
  \ `params[:user]`：\n\n```ruby\n@user = User.new(user_params)\n```\n\n由于 `user_params`\
  \ 将仅在 `Users` 控制器内部使用，而不需要通过 Web 暴露给外部用户，我们将使用 Ruby 的 `private` 关键字将其设置为私有方法，如 列表\
  \ 7.19 所示。（我们将在 第 9.1 节 中详细讨论 `private`。）\n\n**列表 7.19：** 在 `create` 动作中使用强参数。\n\
  \n`app/controllers/users_controller.rb`\n\n点击此处查看代码图片\n\n```ruby\nclass UsersController\
  \ < ApplicationController\n  .\n  .\n  def create\n    @user = User.new(user_params)\n\
  \    if @user.save\n      # 处理保存成功。\n    else\n      render 'new'\n    end\n  end\n\
  \n  private\n    def user_params\n      params.require(:user).permit(:name, :email,\
