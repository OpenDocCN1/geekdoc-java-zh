  \ 表征状态转移 (REST)**\n\n如果你读过很多 Ruby on Rails 开发，你会看到很多关于“REST”的引用，它是表征状态转移（representational\
  \ State Transfer）的缩写。REST 是用于开发分布式网络系统和软件应用程序（如万维网）的架构风格。尽管理论上相当抽象，但在 Rails 的背景下，REST\
  \ 意味着大多数应用程序组件（如用户和微博）被建模为可以创建、读取、更新和删除的*资源*（resources）——这些操作对应于关系数据库的 CRUD 操作以及四个基础\
  \ HTTP 方法：`POST`、`GET`、`PATCH` 和 `DELETE`。（我们将在第 3.3 节中学习更多 HTTP 请求。）\n\n作为 Rails\
  \ 应用程序开发者，REST 开发风格有助于你选择编写哪些控制器和动作：你只需使用可以创建、读取、更新和删除的资源来构建应用程序。对于用户和微博来说，这个过程是直观的，因为它们本身就是资源。在第\
