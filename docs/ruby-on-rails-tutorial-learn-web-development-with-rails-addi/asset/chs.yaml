  \ `users` 表的 DB Browser for SQLite。\n\n#### 6.1.2 模型文件\n\n我们已经看到代码列表 6.1 中的 User\
  \ 模型生成如何生成迁移文件（代码列表 6.2），并且我们在图 6.6 中看到了运行此迁移的结果：它通过创建一个包含 `id`、`name`、`email`、`created_at`\
  \ 和 `updated_at` 列的 `users` 表更新了名为 `development.sqlite3` 的文件。代码列表 6.1 还创建了模型本身。本节的其余部分用于理解它。\n\
  \n我们首先查看 User 模型的代码，它位于 `app/models/` 目录下的 `user.rb` 文件中。委婉地说，它非常紧凑（代码列表 6.3）。\n\
