  \ 节中提到的，用户登录是因为 session 中有一个当前用户，即非 `nil`。这使用了 `!` 运算符。结果 `logged_in?` 方法出现在列表 8.18\
  \ 中。\n\n![image](img/0153.jpeg)\n\n**图 8.7：** 登录后的用户原型。\n\n**列表 8.18：** `logged_in?`\
