  3. 用户编辑页的视图文件名是什么？\n\n#### 2.2.3 此 Users 资源的缺点\n\n尽管有助于对 Rails 有概览，但脚手架 Users 资源存在许多严重的缺点。\n\
  \n- **没有数据验证。** 我们的 `User` 模型接受空白名称和无效电子邮件地址等数据，且不发表任何意见。\n- **没有身份验证。** 我们没有登录或退出的概念，也没有办法防止任何用户执行任何操作。\n\
  - **没有测试。** 这从技术上说不完全正确——脚手架包含了原始的测试——但生成的测试没有测试数据验证、身份验证或任何其他自定义需求。\n- **没有样式或布局。**\
