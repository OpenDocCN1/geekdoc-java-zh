  \n### 练习题\n\n购买任何《Rails Tutorial》后，可以在 railstutorial.org/solutions 免费获取练习题答案。查看他人的答案并记录自己的答案，请加入\
  \ learnenough.com/society 的 Learn Enough Society。\n\n1. 创建一个名称和电子邮箱都过长的新用户，并确认它不是有效的。\n\
  2. 长度验证生成的错误信息是什么？\n\n#### 6.2.4 格式验证\n\n我们对 `name` 属性的验证仅实施了最小的限制——任何小于 51 个字符的非空名称即可——但无疑，`email`\
  \ 属性必须满足更严格的要求，即成为有效的邮箱地址。到目前为止，我们只拒绝了空的邮箱地址；在本节中，我们将要求邮箱地址符合熟悉的 `user@example.com`\
  \ 模式。\n\n测试和验证都不会是详尽的，只需足够接受大多数有效的邮箱地址并拒绝大多数无效的邮箱地址即可。我们将从几个涉及有效和无效地址集合的测试开始。为了创建这些集合，了解用于创建字符串数组的有用\
  \ `%w[]` 技术是很有价值的，正如在以下控制台中所示：点击此处查看代码图片\n\n```text\n>> %w[user@example.com user@example.com\
  \ user@example.com]\n=> [\"user@example.com\", \"user@example.com\", \"user@example.com\"\
  ]\n```\n\n我们可以通过控制台查看这种工作：\n\n```text\n>> \"a\" * 244 + \"@example.com\"\n=> \"\
  aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa\naaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa\n\
  aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa\n\
  aaaaaaaaaaa@example.com\"\n```\n\nemail 长度验证生成了一个多出一个一个字符的有效邮箱地址：\n\n点击此处查看代码图片\n\
  \n```text\n>> \"a\" * 244 + \"@example.com\"\n=> \"aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa\n\
  aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa\n\
  aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa\n\
  aaaaaaaaaaa@example.com\"\n```\n\n此时，列表 6.14 中的测试应该是**红色（RED）**：\n\n列表 6.15：**红色**\n\
  \n```\n$ rails test\n```\n\n\n\n\n\n实际上存在一个根据官方电子邮件标准匹配电子邮件地址的完整正则表达式，但它非常巨大、晦涩，而且很可能适得其反。在本教程中，我们将采用一种在实践中证明了健壮性的更务实的正则表达式。它的样子如下：\n\
  \n11.\n例如，你知道根据标准，`\"Michael Hartl\"@example.com` 这种中间带有引号和空格的地址是一个有效的电子邮件地址吗？令人难以置信，它确实是有效的——但这太荒谬了。\n\
  \n[点击此处查看代码图片]\n\n```\nVALID_EMAIL_REGEX = /\\A[\\w+\\-.]+@[a-z\\d\\-.]+\\.[a-z]+\\\
  z/i\n```\n\n为了帮助理解这些内容的来源，表 6.1 将其拆解为易于理解的部分。\n\n12.\n注意，在表 6.1 中，“letter”（字母）实际上指的是“小写字母”，但正则表达式末尾的\
  \ `i` 强制执行不区分大小的匹配。\n\n**表 6.1：** 拆解有效的电子邮件正则表达式。\n\n![image](img/image01097.jpeg)\n\
  \n虽然你可以通过学习表 6.1 学到很多，但为了真正理解正则表达式，我认为使用像 Rubular 这样的交互式正则表达式匹配器是关重要的（图 6.7）。Rubular\
  \ 网站有一个非常漂亮的交互式界面用于创建正则表达式，并有一个实用的正则表达式快速参考表。我鼓励你在打开 Rubular 浏览器窗口的同时学习表 6.1——对正则表达式的任何阅读都无法取代交互式的玩耍。（*注*：如果你在\
  \ Rubular 中使用表 6.1 中的正则表达式，我建议去掉 `\\A` 和 `\\z` 字符，这样你就可以在给定的测试字符串中一次匹配多个电子邮件地址。另外注意，正则表达式是由斜杠\
  \ `/.../` 内部的字符组成的，因此在使用 Rubular 时应省略这些斜杠。）\n\n13.\n如果你觉得它和我一样有用，我鼓励你向 Rubular 捐赠，以奖励开发者\
  \ Michael Lovitt 的优秀工作。\n\n将表 6.1 中的正则表达式应用于 `email` 格式验证，将得到列表 6.21 中的代码。\n\n**代码列表\
  \ 6.21：** 使用正则表达式验证电子邮件格式。`GREEN`\n\n```\napp/models/user.rb\n```\n\n[点击此处查看代码图片]\n\
  \n* *\n\n```ruby\nclass User < ApplicationRecord\n  validates :name, presence: true,\
  \ length: { maximum: 50 }\n  VALID_EMAIL_REGEX = /\\A[\\w+\\-.]+@[a-z\\d\\-.]+\\\
  .[a-z]+\\z/i\n  validates :email, presence: true, length: { maximum: 255 },\n  \
  \             format: { with: VALID_EMAIL_REGEX }\nend\n```\n\n* *\n\n在这里，正则表达式\
  \ `VALID_EMAIL_REGEX` 是一个常量，在 Ruby 中通过以大写字母开头的名称表示。代码\n\n[点击此处查看代码图片]\n\n```\nVALID_EMAIL_REGEX\
  \ = /\\A[\\w+\\-.]+@[a-z\\d\\-.]+\\.[a-z]+\\z/i\nvalidates :email, presence: true,\
  \ length: { maximum: 255 },\n                format: { with: VALID_EMAIL_REGEX }\n\
  ```\n\n确保了只有匹配模式的电子邮件地址才会被视为有效的。（上面的表达式有一个微小的弱点：它允许包含连续点的无效地址，例如 `foo@bar..com`。更新列表\
  \ 6.21 中的正则表达式以修复这一缺陷被留作练习。）\n\n![image](img/image01099.jpeg)\n\n**图 6.7：** 强大的\
  \ Rubular 正则表达式编辑器。\n\n此时，测试应该是 `GREEN` 的：\n\n**代码列表 6.22：** `GREEN`\n\n* *\n\n\
  ```bash\n$ rails test:models\n```\n\n* *\n\n这意味着只剩下一个约束了：强制电子邮件的唯一性。\n\n### 练习\n\
  \n练习题答案在购买任何 Rails Tutorial 后都可以在 railstutorial.org/solutions 免费获取。要查看他人的答案并记录你自己的答案，请加入\
  \ learnenough.com/society 的 Learn Enough Society。\n\n1. 将列表 6.18 中的有效地址和列表 6.19\
  \ 中的无效地址粘贴到 Rubular 的测试字符串区域，确认列表 6.21 中的正则表达式匹配了所有有效地址，且没有匹配到任何无效地址。\n2. 如上所述，列表\
  \ 6.21 中的电子邮件正则表达式允许域名中包含连续点的无效电子邮件地址，即形式如 `foo@bar..com` 的地址。将此地址添加到列表 6.19 列表中以获得失败测试，然后使用列表\
  \ 6.23 显示的更复杂的正则表达式来通过。\n3. 在 Rubular 列表中添加 `foo@bar..com`，并确认列表 6.21 中的正则表达式匹配了所有有效地址。\n\
  \n**代码列表 6.23：** 不允许电子邮件出现双点。`GREEN`\n\n```\napp/models/user.rb\n```\n\n[点击此处查看代码图片]\n\
  \n* *\n\n```ruby\nclass User < ApplicationRecord\n  validates :name, presence: true,\
  \ length: { maximum: 50 }\n  VALID_EMAIL_REGEX = /\\A[\\w+\\-.]+@[a-z\\d\\-.]+\\\
  .[a-z]+\\z/i\n  validates :email, presence: true, length: { maximum: 255 }, format:\
  \ { with: VALID_EMAIL_REGEX }\nend\n```\n\n* *\n\n#### 6.2.5 唯一性验证\n\n为了强制电子邮件的唯一性，我们将使用\
  \ `validates` 方法。但请注意：不要只扫读这一节。在我们之前的测试中，我们主要使用 `User.new`，这只是在内存中创建一个对象，但对于唯一性测试，我们实际上需要专门的数据库。\n\
  \n**代码列表 6.24：** 重复电子邮件的测试。`RED`\n\n```ruby\ntest/models/user_test.rb\n```\n\n*\
  \ *\n\n```ruby\nrequire 'test_helper'\nclass UserTest < ActiveSupport::TestCase\n\
  \  def setup\n    @user = User.new(name: \"Example\", email: \"user@example.com\"\
  )\n  end\n\n  test \"email addresses should be unique\" do\n    duplicate_user =\
  \ @user.dup\n    @user.save\n    assert_not duplicate_user.valid?\n  end\nend\n\
  ```\n\n* *\n\n这里的方法是使用 `dup` 创建一个与 `@user` 相同的用户。由于我们保存了 `@user`，重复用户的电子邮件已经在数据库中了，因此不应该是有效的。\n\
  \n通过在 `email` 验证中添加 `uniqueness: true`，我们可以让列表 6.24 中的新测试通过，如列表 6.25 所示。\n\n**代码列表\
  \ 6.25：** 验证电子邮件的唯一性。`GREEN`\n\n```ruby\napp/models/user.rb\n```\n\n* *\n\n```ruby\n\
  class User < ApplicationRecord\n  validates :name, presence: true, length: { maximum:\
  \ 50 }\n  VALID_EMAIL_REGEX = /\\A[\\w+\\-.]+@[a-z\\d\\-.]+\\.[a-z]+\\z/i\n  validates\
  \ :email, presence: true, length: { maximum: 255 },\n               format: { with:\
  \ VALID_EMAIL_REGEX },\n               uniqueness: true\nend\n```\n\n\n\n\n\n# 邮箱唯一性与大小写不敏感\n\
  \n不过，我们还没有完全完成。电子邮件地址在处理时通常被视为不区分大小写的——也就是说`foo@bar.com` 与 `FOO@BAR.COM` 或 `FoO@BAr.coM`\
  \ 被视为相同——因此我们的验证也应该包含这一点。所以，测试大小写不敏感是非常重要的，我们在 `Listing 6.26` 的代码实现了这一点。\n\n从技术上讲，只有电子邮件地址的域名部分是不区分大小写的：`foo@bar.com`\
  \ 实际上与 `Foo@bar.com` 不同。但在实践中，依赖这一事实并非主意；正如 about.com 所述：“由于电子邮件地址的大小写敏感会导致大量的困惑、互操作性问题和广泛的头疼，要求输入正确的大小写电子邮件地址是愚蠢的。”\n\
  \n## Listing 6.26: 测试大小写不敏感的邮箱唯一性。RED\n\n`test/models/user_test.rb`\n\n```ruby\n\
  require 'test_helper'\n\nclass UserTest < ActiveSupport::TestCase\n  def setup\n\
  \    @user = User.new(name: \"Example User\", email: \"user@example.com\")\n  end\n\
  \n  test \"email addresses should be unique\" do\n    duplicate_user = @user.dup\n\
  \    duplicate_user.email = @user.email.upcase\n    @user.save\n    assert_not duplicate_user.valid?\n\
  \  end\nend\n```\n\n在这里我们在字符串上使用了 `upcase` 方法。这个测试与最初的重复邮箱测试执行了相同的操作，但使用的是大写的邮箱地址。如果你觉得这个测试有点抽象，可以启动控制台试试：\n\
  \n```\n$ rails console --sandbox\n>> user = User.create(name: \"Example User\",\
  \ email: \"user@example.com\")\n>> user.email.upcase\n=> \"USER@EXAMPLE.COM\"\n\
  >> duplicate_user = user.dup\n>> duplicate_user.email = user.email.upcase\n>> duplicate_user.valid?\n\
  => true\n```\n\n当然，`duplicate_user.valid?` 目前为 `true`，是因为唯一性验证是区分大小写敏感的，但我们希望它是\
  \ `false`。幸运的是，`:uniqueness` 接受一个 `:case_sensitive` 选项专门为此目的。\n\n## Listing 6.27:\
  \ 忽略大小写验证电子邮件地址的唯一性。GREEN\n\n`app/models/user.rb`\n\n```ruby\nclass User < ApplicationRecord\n\
  \  validates :name, presence: true, length: { maximum: 50 }\n  VALID_EMAIL_REGEX\
  \ = /\\A[\\w+\\-.]+@[a-z\\d\\-.]+\\.[a-z]+\\z/i\n  validates :email, presence: true,\
  \ length: { maximum: 255 },\n      format: { with: VALID_EMAIL_REGEX },\n      uniqueness:\
  \ case_sensitive: false\nend\n```\n\n注意，我们只是在 `Listing 6.27` 中将 `Listing 6.25` 中的\
  \ `true` 替换为了 `case_sensitive: false`（Rails 会推导出 `uniqueness` 也应该为 `true`）。\n\n\
  此时，我们的应用程序——尽管有一个重要的限制——已经执行了邮箱唯一性检查，我们的测试套件应该通过：\n\n## Listing 6.28: GREEN\n\n\n\
