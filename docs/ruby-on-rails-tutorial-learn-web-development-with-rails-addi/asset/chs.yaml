  \n现在我们已经在开发环境中实现了账户激活，在本节中，我们将配置应用程序使其能够在生产环境中发送邮件。我们将首先设置一个免费的邮件服务，然后配置并部署应用程序。\n\
  \n为了在生产环境中发送邮件，我们将使用 SendGrid，它可以作为扩展程序提供给 Heroku 的验证账户。（这需要在 Heroku 账户中添加信用卡信息，但验证账户时不会收费。）对于我们的用途，“starter”层级（截至目前每天限制发送\
  \ 400 封邮件但完全免费）是最合适的。我们可以按照以下方式添加到应用程序：\n\n```\n$ heroku addons:create sendgrid:starter\n\
  ```\n\n（这在旧版本的 Heroku 命令行界面系统上可能会失败。在这种情况下，请升级到最新的 Heroku 工具包，或尝试旧语法 `heroku addons:add\
  \ sendgrid:starter`。）\n\n为了配置我们的应用程序使用 SendGrid，我们需要填充生产环境的 SMTP 设置。如 Listing 11.41\
  \ 所示，你还需要定义一个带有生产网站地址的 `host` 变量。\n\n\n\n\n\n`config/environments/production.rb`\n\
  \n点击此处查看代码图片\n\n***\n\n```ruby\nRails.application.configure do\n  .\n  .\n  .\n\
  \  config.action_mailer.raise_delivery_errors = true\n  config.action_mailer.delivery_method\
  \ = :smtp\n  host = '<your heroku app>.herokuapp.com'\n  config.action_mailer.default_url_options\
  \ = { host: host }\n  ActionMailer::Base.smtp_settings = {\n    address        \
  \      => 'smtp.sendgrid.net',\n    port                 => '587',\n    authentication\
  \       => :plain,\n    user_name            => ENV['SENDGRID_USERNAME'],\n    password\
  \             => ENV['SENDGRID_PASSWORD'],\n    domain               => 'heroku.com',\n\
  \    enable_starttls_auto => true\n  }\n  .\n  .\n  .\nend\n```\n\n***\n\n列表 11.41\
  \ 中的邮件配置包含了 SendGrid 账户的 `user_name` 和 `password`，但请注意它们是通过 `ENV` 环境变量访问的，而不是硬编码。这是生产环境应用程序的最佳实践，出于安全考虑，生产应用绝不能在源代码中暴露明文密码等敏感信息。在当前情况下，这些变量是通过\
  \ SendGrid 插件自动配置的，但我们将在 第 13.4.4 节 中看到一个示例，在时我们需要手动定义它们。如果你好奇，可以如下所示查看 列表 11.41\
  \ 中使用的环境变量：\n\n点击此处查看代码图片\n\n```\n$ heroku config:get SENDGRID_USERNAME\n$ heroku\
  \ config:get SENDGRID_PASSWORD\n```\n\n此时，你应该将主题分支合并到 master 分支：\n\n点击此处查看代码图片\n\
  \n```\n$ rails test\n$ git add -A\n$ git commit -m \"Add account activation\"\n\
  $ git checkout master\n$ git merge account-activation\n```\n\n然后推送到远程仓库并部署到 Heroku：\n\
  \n点击此处查看代码图片\n\n```\n$ rails test\n$ git push\n$ git push heroku\n$ heroku run rails\
  \ db:migrate\n```\n\n一旦 Heroku 部署完成，尝试使用你控制的电子邮件地址在生产环境中注册示例应用程序。你应该收到一封如 第 11.2\
  \ 节 所示并在 图 11.7 中所示的激活邮件。点击链接应如承诺般激活账户，如 图 11.8 所示。\n\n#### 练习题\n\n购买任何 Rails Tutorial\
