  \  validates :content, presence: true, length: { maximum: 140 }\nend\n```\n\n**Listing\
  \ 13.11:** 一个用户 `has_many` 多个 microposts。**GREEN**\n\n`app/models/user.rb`\n\n点击此处查看代码图像\n\
  \n```ruby\nclass User < ApplicationRecord\n  has_many :microposts\n  .\n  .\n  .\n\
  end\n```\n\n建立关联后，我们就可以更新 Listing 13.4 中的 `setup` 方法，使用符合惯例的方法来构建新的 micropost，如\
