  \ 操作微博客（Microposts）\n\n在完成微博客的数据建模和显示模板后，我们现在转向通过网页创建微博客的界面。在本节中，我们还将看到*状态流*（status\
  \ feed）的首次暗示——这一概念在第 14 章中得到了充分实现。最后，就像用户一样，我们将通过网页删除微博客。\n\n有一个值得注意的背离惯例之处：微博客资源的界面将主要通过个人资料（Profile）和首页运行，因此我们不需要在\
  \ Microposts 控制器中使用 `new` 或 `edit` 等操作；我们只需要 `create` 和 `destroy`。这导致了如列表 13.30\
  \ 所示的微博客资源路由。列表 13.30 中的代码反过来指向了表 13.2 所示的 RESTful 路由，该表是表 2.3 中完整路由集的一个子集。当然，这种简单性是*更*高级的标志，而不是更低——自从我们在第\
  \ 2 章中依赖脚手架（scaffolding）以来，我们走了很远，不再需要它的大部分复杂性。\n\n**列表 13.30：** 微博客资源的路由。\n\n```ruby\n\
  config/routes.rb\n\nRails.application.routes.draw do\n  root    'static_pages#home'\n\
  \  get      '/help',    to: 'static_pages#help'\n  get      '/about',   to: 'static_pages#about'\n\
  \  get      '/contact', to: 'static_pages#contact'\n  get      '/signup', to: 'users#new'\n\
  \  get      '/login',   to: 'sessions#new'\n  post     '/login',   to: 'sessions#create'\n\
  \  delete '/logout', to: 'sessions#destroy'\n  resources :users\n  resources :account_activations,\
  \ only: [:edit]\n  resources :password_resets,      only: [:new, :create, :edit,\
  \ :update]\n  resources :microposts,           only: [:create, :destroy]\nend\n\
  ```\n\n**表 13.2：** 列表 13.30 中微博客资源提供的 RESTful 路由。\n\n![image](img/image02326.jpeg)\n\
  \n#### 13.3.1 微博客访问控制\n\n我们从在 Microposts 控制器中进行访问控制开始开发微博客资源。特别是，由于我们通过关联的用户访问微博客，因此\
  \ `create` 和 `destroy` 操作都必须要求用户登录。\n\n强制登录状态的测试与 Users 控制器的测试相似（列表 10.20 和列表 10.61）。我们只需向每个操作发送正确的请求，并确认微博客数量保持不变，且结果重定向到登录\
  \ URL，如列表 13.31 所示。\n\n**列表 13.31：** Microposts 控制器的授权测试。\n\n```ruby\ntest/controllers/microposts_controller_test.rb\n\
  \nrequire 'test_helper'\nclass MicropostsController < ActionDispatch::IntegrationTest\n\
  \  def setup\n    @micropost = microposts(:orange)\n  end\n\n  test \"should redirect\
  \ create when not logged in\" do\n    assert_no_difference 'Micropost.count' do\n\
  \      post microposts_path, params: { micropost: { content: \"Lorem ipsum\" }\n\
  \    end\n    assert_redirected_to login_url\n  end\n\n  test \"should redirect\
  \ destroy when not logged in\" do\n    assert_no_difference 'Micropost.count' do\n\
  \      delete micropost_path(@micropost)\n    end\n    assert_redirected_to login_url\n\
  \  end\nend\n```\n\n编写应用程序代码以使列表 13.31 中的测试通过需要一些重构。回想第 10.2.1 节，我们使用调用 `logged_in_user`\
  \ 方法的 de 过滤器来强制登录（列表 10.15）。当时，我们只需要 Users 控制器，但现在我们发现 Microposts 控制器也需要，因此将其移动到\
  \ Application 控制器，它是所有控制器的基类（第 4.4.4 节）。结果出现在列表 13.32 中。\n\n**列表 13.32：** 将 `logged_in_user`\
  \ 方法移动到 Application 控制器。\n\n```ruby\napp/controllers/application_controller.rb\n\
  \nclass ApplicationController < ActionController::Base\n  protect_from_forgery with:\
  \ :exception\n  include SessionsHelper\n\n  private\n\n  # 确认已登录用户。\n  def logged_in_user\n\
  \    unless logged_in?\n      store_location\n      flash[:danger] = \"Please log\
  \ in.\"\n      redirect_to login_url\n    end\n  end\nend\n```\n\n为了避免代码重复，此时也应该从\
  \ Users 控制器中移除 `logged_in_user`（列表 13.33）。\n\n**列表 13.33：** 移除了登录过滤器的 用户控制器。\n\n\
  ```ruby\napp/controllers/users_controller.rb\n\nclass UsersController < ApplicationController\n\
  \  # before_action :logged_in_user, only: [:index, :edit, :update, :destroy]\n\n\
  \  private\n\n  def user_params\n    params.require(:user).permit(:name, :email,\
  \ :password, :password_confirmation)\n  end\n\n  # 前置过滤器\n  # 确认正确的用户。\n  def correct_user\n\
  \    @user = User.find(params[:id])\n  end\n\n  # 确认管理员用户。\n  def admin_user\n \
  \   redirect_to root_url unless current_user.admin?\n  end\nend\n```\n\n\n\n\n#\
  \ 1. 为什么在 Users 控制器中留下 `logged_in_user` 的副本是一个坏主意？\n\n## 13.3.2 创建微博客（Microposts）\n\
  \n在第 7 章中，我们通过创建一个 HTML 表单向 Users 控制器的 `create` 动作发送 HTTP POST 请求来实现用户注册。创建微博客的实现方式类似；主要的区别在于，我们没有使用\
  \ `/microposts/new` 独立页面，而是将表单放在首页本身（即根路径 `/`），正如图 13.10 中的原型图所示。\n\n当我们上次离开首页时，它看起来像图\
  \ 5.8 所示——也就是说，它中间有一个“立即注册！”按钮。由于微博客创建表单只有在特定登录用户的语文中才有意义，因此本节的目标之一是根据访问者的登录状态提供不同版本的首页。我们将在下面的代码列表\
  \ 13.37 中实现这一点。\n\n![image](img/image02327.jpeg)\n\n**图 13.10：**带有创建微博客表单的首页原型图。\n\
  \n我们将从微博客的 `create` 动作开始，它与用户的动作类似（代码列表 7.28）；主要区别在于使用用户/微博客的关联来 `build` 新的微博客，如代码列表\
  \ 13.36 所示。注意通过 `micropost_params` 使用强强参数，这允许通过网页修改微博客的 `content` 属性。\n\n**代码列表\
  \ 13.36：** Microposts 控制器的 `create` 动作。\n\n```\napp/controllers/microposts_controller.rb\n\
  \nclass MicropostsController < ApplicationController\n  before_action :logged_in_user,\
  \ only: [:create, :destroy]\n  def create\n    @micropost = current_user.microposts.build(micropost_params)\n\
  \    if @micropost.save\n      flash[:success] = \"Micropost created!\"\n      redirect_to\
  \ root_url\n    else\n      render 'static_pages/home'\n    end\n  end\n  def destroy\n\
  \  end\nprivate\n  def micropost_params\n    params.require(:micropost).permit(:content)\n\
  \  end\nend\n```\n\n为了构建创建微博客的表单，我们使用代码列表 13.37 中的代码，它根据网站访问者是否登录来提供不同的 HTML。\n\n\
  **代码列表 13.37：**在首页 (/) 中添加微博客创建。\n\n```\napp/views/static_pages/home.erb\n\n<% if\
  \ logged_in? %>\n  <div class=\"row\">\n    <aside class=\"col-md-4\">\n      <section\
  \ class=\"user_info\">\n        <%= render 'shared/user_info %>\n      </section>\n\
  \      <section class=\"micropost_form\">\n        <%= render 'shared/micropost_form'\
  \ %>\n      </section>\n    </aside>\n  </div>\n<% else %>\n  <div class=\"center\
  \ jumbotron\">\n    <h1>Welcome to the Sample App</h1>\n    <h2>This is the home\
  \ page for the <a href=\"http://www.railstutorial.org/\">Ruby on Rails Tutorial</a>a\
  \ application.</h2>\n    <%= link_to \"Sign up now!\", signup_path, class: \"btn-lg\
  \ btn-primary\" %>\n  </div>\n  <%= link_to image_tag(\"rails.png\", alt: \"Rails\
  \ logo\"), 'http://rubyonrails.org/' %>\n<% end %>\n```\n\n（在 if-else 分支中包含这么多代码有点混乱，使用部分模板（partial）来清理它留到了第\
  \ 13.3.2 节](#part0022.xhtml_ch13_2)。）\n\n为了让代码列表 13.37 定义的页面运行，我们需要创建并填充几个部分模板。第一个是首页侧边栏，如代码列表\
  \ 13.38 所示。\n\n**代码列表 13.38：**用户信息的侧边栏部分模板。\n\n```\napp/views/shared/_user_info.erb\n\
