  \ 消息消失。\n\n## 8.2 登录\n\n现在我们的登录表单可以处理无效提交，下一步是通过实际登录用户来处理有效提交。在本节中，我们将添加关闭浏览器后过期的\
  \ session。\n\n实现 session 将涉及在多个控制器和视图中定义大量函数。你可能从第 4.2.5 节中记得，Ruby 提供了模块（module）功能来封装此类函数。方便的是，在生成\
  \ Sessions 控制器时自动生成了 Sessions helper。此外，此类 helper 会自动包含在视图中；通过将模块引入所有控制器的基类（Application\
  \ controller），我们使其在控制器中也可用（[列表 8.13]）。\n\n[3]\n\n我喜欢这种技术，因为它连接到了纯 Ruby 的包含方式，但 Rails\
  \ 4 引入了一种称为 concern（关注点）的技术，也可以用于此目的。\n\n#### 8.2.1 log_in 方法\n\n借助 Rails 定义的 `session`\
  \ 方法，登录用户非常简单。（该方法与在第 8.1.1 节中生成的 Sessions 控制是分开且不同的。）我们可以像对待哈希一样对它赋值：\n\n**session[:user_id]\
  \ = user.id**\n\n\n\n\n\n这会在用户的浏览器上放置一个临时 cookie，其中包含用户 id 的加密版本，这允许我们在随后的页面中通过\
  \ `session[:user_id]` 获取 id。与 `cookies` 方法创建的持久性 cookie（第 9.1 节）不同，`session` 方法创建的临时\
  \ cookie 在浏览器关闭时立即失效。\n\n由于我们要在几个不同的地方使用相同的登录技术，我们将在 Sessions 助手中定义一个名为 `log_in`\
  \ 的方法，如列表 8.14 所示。\n\n**列表 8.14：** `log_in` 函数。\n\n```ruby\napp/helpers/sessions_helper.rb\n\
  ```\n\n点击此处查看代码图像\n\n* * *\n\n```ruby\nmodule SessionsHelper\n  # 登录指定的用户。\n  def\
  \ log_in(user)\n    session[:user_id] = user.id\n  end\nend\n```\n\n* * *\n\n由于使用\
  \ `session` 方法创建的临时 cookie 会自动加密，因此列表 8.14 中的代码是安全的，攻击者无法利用会话信息登录用户。不过，这仅适用于通过 `session`\
  \ 方法启动的临时会话，对于使用 `cookies` 方法创建的持久会话则不然。持久 cookie 容易受到*会话劫持*攻击，因此在第 9 章中，我们必须对放在用户浏览器上的信息更加小心。\n\
  \n有了列表 8.14 中定义的 `log_in` 方法，我们现在可以通过登录用户并重定向到用户的个人页来完成会话的 `create` 操作。结果显示在列表 8.15\
  \ 中。⁴\n\n4. 因为在列表 8.13 中包含了该模块，`log_in` 方法在 Sessions 控制器中可用。\n\n**列表 8.15：** 登录用户。\n\
  \n```ruby\napp/controllers/sessions_controller.rb\n```\n\n点击此处查看代码图像\n\n* * *\n\n\
  ```ruby\nclass SessionsController < ApplicationController\n  def new\n  end\n\n\
  \  def create\n    user = User.find_by(email: params[:session][:email].downcase)\n\
  \    if user && user.authenticate(params[:session][:password])\n      log_in user\n\
  \      redirect_to user\n    else\n      flash.now[:danger] = 'Invalid email/password\
  \ combination'\n      render 'new'\n    end\n  end\n\n  def destroy\n  end\nend\n\
  ```\n\n* * *\n\n注意这个紧凑的重定向 `redirect_to user`，我们之前第 7.4.1 节中见过它。Rails 会自动将其转换为用户个人页的路由：`user_url(user)`。\n\
  \n随着在列表 8.15 中定义了 `create` 操作，列表 8.4 中定义的登录表单现在应该可以工作了。尽管它对应用程序的显示没有任何影响，因此除非直接检查浏览器会话，否则无法知道已经登录。作为启用更多可见更改的第一步，在第\
