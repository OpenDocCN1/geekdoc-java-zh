  \n为了配置我们的应用程序在生产环境中使用云存储，我们将使用 `fog` gem，如列表 13.69 所示。\n\n**列表 13.69：** 为生产环境配置图片上传器。\n\
  \n```ruby\napp/uploaders/picture_uploader.rb\n```\n\n点击此处查看代码图片\n\n```ruby\nclass\
  \ PictureUploader < CarrierWave::Uploader::Base\n  include CarrierWave::MiniMagick\n\
