  \n## 14.4 结论\n\n随着状态动态的添加，我们已经完成了 *Ruby on Rails*^™ 教程的示例应用程序。该应用程序包含了 Rails 所有主要功能的示例，包括模型、视图、控制器、模板、部分模板、过滤器、验证、回调、`has_many`/`belongs_to`\
  \ 以及 `has_many :through` 关联、安全、测试和部署。\n\n尽管有这份令人印象深刻的列表，但 Web 开发仍有许多需要学习的内容。作为这一过程的第一步，本节包含了一些进一步学习的建议。\n\
