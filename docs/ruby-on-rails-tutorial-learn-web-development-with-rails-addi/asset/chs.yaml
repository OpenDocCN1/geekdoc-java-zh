  \n#### 8.2.4 测试布局更改\n\n在手动验证应用程序在登录后运行正常之后，在继续之前，我们将编写一个集成测试来捕获该行为并防止回归。我们将在列表 8.9\
  \ 中的测试基础上，编写一系列步骤来验证以下序列：\n\n1. 访问登录路径。\n2. 向 sessions 路径提交有效信息。\n3. 验证登录链接消失。\n\
  4. 验证注销链接出现。\n5. 验证个人资料链接出现。\n\n为了看到这些更改，我们的测试需要以预先注册的用户身份登录，这意味着该用户必须存在于数据库中。Rails\
  \ 的默认方法是使用 `fixtures`（固件），这是一种组织并加载到测试数据库的数据的方法。我们在第 6.2 节中发现我们需要删除默认固件，以便我们的电子邮件唯一性测试能够通过（列表\
  \ 6.3）。现在我们准备好用自己的自定义固件开始填充该空文件。\n\n在当前情况下，我们只需要一个用户，其信息应包含有效的姓名和电子邮件地址。由于我们需要登录用户，还必须包含一个有效密码，以便与\
  \ Sessions 控制器的 `create` 操作提交的密码进行比较。参考图 6.8 中的数据模型，我们看到这意味着为用户固件创建一个 `password_digest`\
  \ 属性，我们将通过定义自己的 `digest` 方法来实现。\n\n正如在第 6.3.1 节中讨论的，密码哈摘要是通过 bcrypt 创建的（通过 `has_secure_password`），因此我们需要使用相同的方法创建固件密码。通过检查安全源码，我们发现该方法是：\n\
  \n```ruby\nBCrypt::Password.create(string, cost: cost)\n```\n\n其中 `string` 是要哈希的字符串，`cost`\
  \ 是决定计算哈希成本的参数。使用高成本将无法通过哈希值反推出原始密码，这在生产环境中是一个重要的安全措施，但在测试中，我们希望 `digest` 方法越快越好。安全源码中也有相应的代码：\n\
  \n```ruby\ncost = ActiveModel::SecurePassword.min_cost ? BCrypt::Engine::MIN_COST\
  \ : BCrypt::Engine.cost\n```\n\n这段晦涩的代码你不需要详细理解，它安排了上述描述的行为：在测试中使用最小成本参数，在生产环境中使用正常（高）成本参数。（我们将在第\
  \ 9.2 节中将在 User 模型中复用 `digest`。这建议将方法放在 `user.rb` 中。由于我们在计算哈希时可能无法访问用户对象（如固件文件中的情况），我们将\
  \ `digest` 方法附加到 User 类本身，这（正如我们在第 4.4.1 节中简要过的过的）使其成为类方法。结果出现在列表 8.21 中。\n\n\n\n\
  \n\n```ruby\nclass User < ApplicationRecord\n  before_save { self.email = email.downcase\
  \ }\n  validates :name, presence: true, length: { maximum: 50 }\n  VALID_EMAIL_REGEX\
  \ = /\\A[\\w+\\-.]+@[a-z\\d\\-.]+\\.[a-z]+\\z/i\n  validates :email, presence: true,\
  \ length: { maximum: 255 },\n                    format: { with: VALID_EMAIL_REGEX\
  \ },\n                    uniqueness: { case_sensitive: false }\n  has_secure_password\n\
  \  validates :password, presence: true, length: { minimum: 6 }\n\n  # Returns the\
  \ hash digest of the given string.\n  def self.digest(string)\n    cost = ActiveModel::SecurePassword.min_cost\
  \ ? BCrypt::Engine::MIN_COST :\n             BCrypt::Engine.cost\n    BCrypt::Password.create(string,\
  \ cost: cost)\n  end\nend\n```\n\n有了 Listing 8.21 中的 `digest` 方法，我们现在准备好为有效用户创建一个用户固件（fixture）了，如\
  \ Listing 8.22 所示。¹¹\n\n[11.] 值得注意的是，固件文件中的缩进必须使用空格而不是制表符，因此在拷贝像 Listing 8.22 所示的代码时要加小心。\n\
  \n**Listing 8.22:** 用于测试用户登录的固件。\n\n`test/fixtures/users.yml`\n\n```yaml\nmichael:\n\
  \  name: Michael Example\n  email: michael@example.com\n  password_digest: <%= User.digest('password')\
  \ %>\n```\n\n特别需要注意的是，固件支持嵌入 Ruby，这允许我们使用\n\n```ruby\n<%= User.digest('password')\
  \ %>\n```\n\n来为测试用户创建有效的密码哈希值。\n\n虽然我们已经定义了 `has_secure_password` 需要的 `password_digest`\
  \ 属性，但有时引用明文（虚拟）密码也很方便。遗憾的是，这在固件中无法实现，而且在 Listing 8.22 中添加 `password` 属性会导致 Rails\
