  \ `palindrome?` 方法直接添加到 `String` 类本身本身可能更自然，这样（除其他因素外）我们就可以在字符串字面量上调用 `palindrome?`，而我们目前还做不到：\n\
  \n点击此处查看代码图片\n\n```ruby\n>> \"level\".palindrome?\nNoMethodError: undefined method\
  \ `palindrome?' for \"level\":String\n```\n\n令人惊讶的是，Ruby 允许你恰这样做；Ruby 类可以被*打开*并修改，允许像我们这样的普通凡人向它们添加添加方法：\n\
  \n点击此处查看代码图片\n\n```ruby\n>> class String\n>>   # 如果字符串是自身的反转，则返回 true。\n>>   def\
  \ palindrome?\n>>     self == self.reverse\n>>   end\n>> end\n=> nil\n\n>> \"deified\"\
  .palindrome?\n=> true\n```\n\n（我不知道哪个更酷：是 Ruby 允许你向内置类添加方法，还是 `\"deified\"` 本身是一个回文。）\n\
  \n修改内置类是一种强大的技术，但能力越大，责任越大，在没有*真正*充分理由的情况下向内置类添加方法被认为是不妥当的。Rails 确实有一些很好的理由；例如，在\
  \ Web 应用中，我们经常希望防止变量变*为空*——例如，用户的用户名不应该是空格或其他空白字符——所以 Rails 为 Ruby 增加了一个 `blank?`\
  \ 方法。由于 Rails 控制台会自动包含 Rails 扩展，我们在这里可以看到一个示例（这在纯的 `irb` 中不起作用）：\n\n点击此处查看代码图片\n\
  \n```ruby\n>> \"\".blank?\n=> true\n\n>> \"      \".empty?\n=> false\n\n>> \"  \
  \    \".blank?\n=> true\n\n>> nil.blank?\n=> true\n```\n\n我们看到全空格字符串不是*空*（empty），但它是*空白*（blank）。注意\
  \ `nil` 也是空白的；由于 `nil` 不是字符串，这暗示 Rails 实际上将 `blank?` 添加到了 `String` 的基类中，正如我们在本节开头看到的，该基类就是\
  \ `Object` 本身。我们将在 Section 9.1 中看到其他其他示例。\n\n##### 练习题\n\n购买任何 Rails Tutorial 后，均可在\
