  \ 4.。\n2. 因为在列表 8.13 中包含了该模块，`log_in` 方法在 Sessions 控制器中可用。\n\n#### 8.2.2 当前用户\n\n\
  将用户的 id 安全地存放在 session 中，我们现在可以在随后的页面中检索它，我们将通过定义一个 `current_user` 方法来实现。为了使用 session\
  \ 中的 id 从数据库中检索当前用户，我们将使用来自第 7.4.1 节的 `find_by` 方法。\n\n然而，`find_by` 在找不到用户时会抛出异常。为了处理这种情况，我们可以使用在第\
  \ 4.2.3 节中见过的 `if/else` 结构：\n\n```ruby\ndef current_user\n  user = User.find_by(email:\
  \ params[:session][:email].downcase)\n  if user && user.authenticate(params[:session][:password])\n\
  \    log_in user\n    redirect_to user\n  else\n    flash.now[:danger] = 'Invalid\
  \ email/password combination'\n    render 'new'\n  end\nend\n```\n\n等等，上面的代码是用于\
  \ `create` 操作的。对于 `current_user` 方法，它应该是：\n\n```ruby\ndef current_user\n  user =\
  \ User.find_by(email: params[:session][:email].downcase)\n  if user\n    @user =\
  \ user\n  else\n    @user = nil\n  end\nend\n```\n\n为了避免每次调用 `current_user` 时都访问数据库，我们可以使用实例变量：\n\
  \n```ruby\ndef current_user\n  @user ||= User.find_by(email: params[:session][:email].downcase)\n\
  end\n```\n\n这使用了 `||=`（“或赋值”）运算符（框 8.1）。\n\n在[第 8.2.3 节]中，我们将更改应用程序布局中的链接，包括指向当前用户个人页的\
  \ URL。\n\n\n\n\n另一种常见的 Ruby 模式是如果变量为 `nil` 则给其赋值，否则保持不变。回想第 4.2.3 节中看到的 `or` 运算符\
  \ `||`，我们可以这样写：\n\n```ruby\n>> @foo\n=> nil\n\n>> @foo = @foo || \"bar\"\n=> \"\
  bar\"\n\n>> @foo = @foo || \"baz\"\n=> \"bar\"\n```\n\n由于 `nil` 在布尔上下文中为 `false`，对\
  \ `@foo` 的第一次赋值是 `nil || \"bar\"`，其结果为 `\"bar\"`。同样，第二次赋值是 `@foo || \"baz\"`，即 `\"\
  bar\" || \"baz\"`，其结果也为 `\"bar\"`。这是因为在布尔上下文中，除了 `nil` 或 `false` 之外的任何内容都是 `true`，并且一系列的\
  \ `||` 表达式在求值第一个真表达式后就会终止。（这种从左到右计算 `||` 表达式并在遇到第一个真值时停止的习惯被称为*短路求值*。相同的原理适用于 `&&`\
  \ 语句，只不过在这种情况下，求值在遇到第一个*假*值时停止。）\n\n比较各种运算符的控制台会，我们看到 `@foo = @foo || \"bar\"` 遵循\
  \ `x = x O y` 模式，其中 `||` 取替了 `O`：\n\n```text\nx    =   x   +   1     ->    x   \
  \   +=    1\nx    =   x   *   3     ->    x      *=    3\nx    =   x   -   8   \
  \  ->    x      -=    8\nx    =   x   /   2     ->    x      /=    2\n@foo = @foo\
  \ || \"bar\"   ->    @foo ||= \"bar\"\n```\n\n因此我们看到 `@foo = @foo || \"bar\"` 和\
  \ `@foo ||= \"bar\"` 是等价的。在当前用户的上下文中，这暗示了如下的构造：\n\n```ruby\n@current_user ||= User.find_by(id:\
  \ session[:user_id])\n```\n\n漂亮！\n\n（从技术上讲，Ruby 求值表达式 `@foo || @foo = \"bar\"`，这避免了当\
  \ `@foo` 为 `nil` 或 `false` 时的不必要赋值。但这个表达式并不能很好解释 `||=` 符号，因此上面的讨论使用了几乎等价的 `@foo\
  \ = @foo || \"bar\"`。）\n\n***\n\n应用上述讨论的结果就得到了在列表 8.16 中所示的简洁 `current_user` 方法。\n\
  \n**列表 8.16：** 在 session 中查找当前用户。\n\n`app/helpers/sessions_helper.rb`\n\n点击此处查看代码图片\n\
  \n***\n\n```ruby\nmodule SessionsHelper\n  # 登录指定的用户。\n  def log_in(user)\n    session[:user_id]\
  \ = user.id\n  end\n\n  # 返回当前登录的用户（如果有）。\n  def current_user\n    @current_user\
  \ ||= User.find_by(id: session[:user_id])\n  end\nend\n```\n\n***\n\n有了列表 8.16 中可以工作的\
  \ `current_user` 方法，我们现在可以根据用户登录状态对我们的应用程序进行更改。\n\n### 练习\n\n购买任何 Rails Tutorial\
