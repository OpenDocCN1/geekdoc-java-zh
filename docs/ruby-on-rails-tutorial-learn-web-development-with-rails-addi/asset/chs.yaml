  \ Tutorial 的此处获取帮助：\n      <a href=\"http://www.railstutorial.org/help\">Rails Tutorial\
  \ 帮助部分</a>。\n      如需获取有关此示例应用程序的帮助，请参阅\n      <a href=\"http://www.railstutorial.org/book\"\
  ><em>Ruby on Rails Tutorial</em> 书籍</a>。\n    </p>\n</body>\n</html>\n```\n\n***\n\
  \n**列表 3.34：** 带有嵌入 Ruby 标题的关于页视图。**GREEN**\n\n`app/views/static_pages/about.html.erb`\n\
