  \n### 分页概览\n\n`will_paginate` 方法有一点“魔力”；在 `users` 视图中，它会自动寻找 `@users` 对象，然后显示分页链接以访问其他页面。不过，列表\
  \ 10.45 中的视图尚无法工作，因为目前 `@users` 包含 `User.all` 的结果（列表 10.36），而 `will_paginate` 要求我们显式地使用\
  \ `paginate` 方法对结果进行分页：\n\n点击此处查看代码图片\n\n```bash\n$ rails console\n>> User.paginate(page:\
  \ 1)\nUser Load (1.5ms) SELECT \"users\".* FROM \"users\" LIMIT 30 OFFSET 0\n(1.7ms)\
  \ SELECT COUNT(*) FROM \"users\"\n=> #<ActiveRecord::Relation #<User id: 1,...\n\
  ```\n\n注意，`paginate` 接受一个键为 `:page` 且值为所请求页面的哈希参数。`User.paginate` 根据 `:page` 参数一次从数据库中提取出一块用户（默认为\
  \ 30 个）。因此，例如第 1 页是第 1–30 个用户，第 2 页是第 31–60 个用户，以此此类推。如果 `page` 为 `nil`，`paginate`\
  \ 将直接返回第一页。\n\n使用 `paginate` 方法，我们可以在 `index` 动作中使用 `paginate` 代替 `all` 来对示例应用程序中的用户进行分页（[列表\
  \ 10.46）。这里的 `page` 参数来自 `params[:page]`，它是由 `will_paginate` 自动生成的。\n\n**列表 10.46：**\
  \ 在 `index` 动作中对用户进行分页。\n\n`app/controllers/users_controller.rb`\n\n点击此处查看代码图片\n\
  \n```ruby\nclass UsersController < ApplicationController\n  before_action :logged_in_user,\
  \ only: [:index, :edit, :update]\n\n  def index\n    @users = User.paginate(page:\
  \ params[:page])\n  end\nend\n```\n\n用户索引页现在应该可以工作了，显示如 图 10.11 所示。（在某些系统上，你可能需要在此处重启\
