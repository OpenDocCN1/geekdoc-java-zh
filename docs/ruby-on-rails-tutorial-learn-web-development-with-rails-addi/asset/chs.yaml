  \n通过 Listing 11.33 中的测试，我们已经准备好进行一些重构，将部分用户操作逻辑从控制器移动到模型中。具体来说，我们将创建一个 `activate`\
  \ 方法来更新用户的激活属性，并创建一个 `send_activation_email` 方法来发送激活邮件。额外的方法出现在 Listing 11.35 中，重构后的应用代码出现在\
  \ Listing 11.36 和 Listing 11.37 中。\n\n**Listing 11.35:** 为 User 模型添加用户激活方法。\n\n\
  `app/models/user.rb`\n\n点击此处查看代码图片\n\n```ruby\nclass User < ApplicationRecord\n\
