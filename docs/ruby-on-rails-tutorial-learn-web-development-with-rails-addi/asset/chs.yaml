  \ 14.44 中，移除查找用户自己的帖子的查询部分。列表 14.42 中的哪项测试失败了？\n2. 在列表 14.44 中，移除查找被关注用户帖子的查询部分。列表\
  \ 14.42 中的哪项测试失败了？\n3. 你如何更改列表 14.44 中的查询，使动态流错误地返回未关注用户的微推，从而破坏列表 14.42 中的第三个测试？*提示*：返回所有微推即可达到目的。\n\
  \n#### 14.3.3 子查询 (Subselects)\n\n正如上一节所提示的，当章节 14.3.2 中动态流中的微推数量很大时，动态流实现的扩展性并不良好，例如如果用户关注了\
  \ 5000 个其他用户。在本节中，我们将重新实现状态流，使其能够随着关注用户数量的基础上更好地扩展。\n\n章节 14.3.2 中代码的问题在于，`following_ids`\
  \ 将*所有*被关注用户的 id 提取到内存并创建一个包含所有关注用户的数组。由于列表 14.44 中的条件只是检查是否在集合中，因此一定有更有效的方法来这样做，事实上\
  \ SQL 专门为集操作进行了优化。解决方案是使用*子查询*将查找被关注用户 id 的操作推送到数据库。\n\n我们将首先通过列表 14.46 中稍作修改的代码重构动态流。\n\
  \n**列表 14.46：** 在动态流的 `where` 方法中使用键值对。**绿色**\n\napp/models/user.rb\n\n点击此处查看代码图像\n\
  \n```ruby\nclass User < ApplicationRecord\n  .\n  \n  \n  # 返回用户的状态动态流。\n  def feed\n\
  \    Micropost.where(\"user_id IN (:following_ids) OR user_id = :user_id\", following_ids:\
  \ following_ids, user_id: id)\n  end\n  .\n  \nend\n```\n\n为了给下一步做准备，我们已经将\n点击此处查看代码图像\n\
  `Micropost.where(\"user_id IN (?) OR user_id = ?\", following_ids, id)`\n替换为等等的\n\
  点击此处查看代码图像\n`Micropost.where(\"user_id IN (:following_ids) OR user_id = :user_id\"\
  , following_ids: following_ids, user_id: id)`\n\n问号语法是没问题的，但当我们想将*同一个*变量插入到多个地方时，第二种语法更方便。\n\
  \n上面的讨论意味着我们将在 SQL 查询中添加第二个 `user_id`。特别是，我们可以将 Ruby 代码 `following_ids` 替换为 SQL\
  \ 段点击此处查看代码图像\n`following_ids = \"SELECT followed_id FROM relationships WHERE follower_id\
  \ = :user_id\"`\n\n这段代码包含一个 SQL 子查询，在内部，用户 1 的整个选择看起来大致如下：\n点击此处查看代码图像\n\n```sql\n\
  SELECT * FROM microposts\nWHERE user_id IN (SELECT followed_id FROM relationships\
  \ WHERE follower_id = 1)\nOR user_id = 1\n```\n\n这种子查询将所有的集合逻辑推送到数据库，这样效率更高。\n\n\
  有了这个基础，我们准备好了一个更高效的动态流实现，如列表 14.47 所示。注意，由于现在是原始 SQL，`following_ids` 字符串是*插值的*而不是转义的。\n\
  \n**列表 14.47：** 动态流的最终实现。**绿色**\n\napp/models/user.rb\n\n点击此处查看代码图像\n\n```ruby\n\
  class User < ApplicationRecord\n  .\n  .\n  \n  # 返回用户的状态动态流。\n  def feed\n    following_ids\
  \ = \"SELECT followed_id FROM relationships WHERE follower_id = :user_id\"\n   \
  \ Micropost.where(\"user_id IN (#{following_ids}) OR user_id = :user_id\", user_id:\
  \ id)\n  end\n  .\n  \nend\n```\n\n这段代码拥有 Rails、Ruby 和 SQL 的强大组合，但它完成了任务且完成得很好：\n\
