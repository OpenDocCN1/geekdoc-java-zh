  \n1. 使用控制台确认 `User.first.followers.count` 与 列表 14.14 中预期的值一致。\n2. 确认 `User.first.following.count`\
  \ 也是正确的。\n\n#### 14.2.2 统计和关注表单\n\n现在我们的示例用户既有关注也有粉丝，我们需要更新个人页和首页以反映这一点。我们将首先创建一个局部，用于在个人页和首页上显示关注和粉丝统计数据。接下来我们将添加关注/取消关注表单，然后为“关注”（following）和“粉丝”（followers）创建专用页面。\n\
  \n如 章节 14.1.1 注，我们将采用 Twitter 的习惯，使用“关注”作为关注用户的标签，这种用法出现在 图 14.1 的序列中，并在 图 14.10\
  \ 中详细显示。\n\n图 14.10 中的统计由当前用户关注的用户数和粉丝数组成，每个应该是指向相应专用页面的链接。在 第 5 章 中，我们用占位符 `'#'`\
  \ 了这些链接，但那时我们对路由还没有经验。这次，虽然我们将实际页面推迟到 章节 14.2.3，但我们现在创建路由，如 列表 14.15 所示。这段代码在 `resources`\
  \ 块中使用 `member` 方法，我们之前还没有见过，但可以猜猜它是做什么的。\n\n**列表 14.15:** 为 Users 控制添加 `following`\
  \ 和 `followers` 动作。\n\n`config/routes.rb`\n\n点击此处查看代码图片\n\n```ruby\nRails.application.routes.draw\
  \ do\n  root  'static_pages#home'\n  get  '/help', to: 'static_pages#help'\n  get\
