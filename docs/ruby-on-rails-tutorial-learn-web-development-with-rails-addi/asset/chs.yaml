  **图 10.1:** 用户编辑页面的原型。\n\n**代码列表 10.1:** 用户 `edit` 动作。\n\n`app/controllers/users_controller.rb`\n\
  \n[点击此处查看代码图片]\n\n```ruby\nclass UsersController < ApplicationController\n  def\
  \ show\n    @user = User.find(params[:id])\n  end\n\n  def new\n    @user = User.new\n\
  \  end\n\n  def create\n    @user = User.new(user_params)\n    if @user.save\n \
  \     log_in @user\n      flash[:success] = \"Welcome to the Sample App!\"\n   \
  \   redirect_to @user\n    else\n      render 'new'\n    end\n  end\n\n  def edit\n\
  \    @user = User.find(params[:id])\n  end\n\n  private\n\n  def user_params\n \
  \   params.require(:user).permit(:name, :email, :password, :password_confirmation)\n\
  \  end\nend\n```\n\n对应的用户编辑视图（你必须手动创建）如代码列表 10.2 所示。注意看这与代码列表 7.15 中的新用户视图是多么相似；这种高度重叠表明可以将重复代码提取为部分模板（partial），这被留作了一项练习（第\
  \ 10.1.1 节）。\n\n**代码列表 10.2:** 用户编辑视图。\n\n`app/views/users/edit.html.erb`\n\n[点击此处查看代码图片]\n\
  \n```erb\n<% provide(:title, \"Edit user\") %>\n<h1>Update your profile</h1>\n<div\
  \ class=\"row\">\n  <div class=\"col-md-6 col-md-offset-3\">\n    <%= form_for(@user)\
  \ do |f| %>\n      <%= render 'shared/error_messages' %>\n      <%= f.label :name\
  \ %>\n      <%= f.text_field :name, class: 'form-control' %>\n      <%= f.label\
  \ :email %>\n      <%= f.email_field :email, class: 'form-control' %>\n      <%=\
  \ f.label :password %>\n      <%= f.password_field :password, class: 'form-control'\
  \ %>\n      <%= f.label :password_confirmation, \"Confirmation\" %>\n      <%= f.password_field\
  \ :password_confirmation, class: 'form-control' %>\n      <%= f.submit \"Save changes\"\
  , class: \"btn btn-primary\" %>\n    <% end %>\n    <div class=\"gravatar_edit\"\
  >\n      <%= gravatar_for @user %>\n      <a href=\"http://gravatar.com/emails\"\
  \ target=\"_blank\">change</a>\n    </div>\n  </div>\n</div>\n```\n\n在这里，我们复用了第\
  \ 7.3.3 节中引入的共享 `error_messages` 部分模板。顺便提一下，在 Gravatar 链接中使用 `target=\"_blank\"\
  ` 是一个让浏览器在新窗口或标签页中打开页面的小技巧，这在链接到第三方网站时有时非常方便。（`target=\"_blank\"` 有一个细小的安全问题；处理这个问题被留作了一项练习。）\n\
  \n使用代码列表 10.1 中的实例变量 `@user`，编辑页面应该可以正常渲染，如图 10.2 所示。图 10.2 中的“Name”和“Email”字段也展示了\
  \ Rails 如何使用现有 `@user` 的属性自动预填充 Name 和 Email。\n\n![image](img/image0198.jpeg)\n\n\
  **图 10.2:** 预填充了姓名和电子邮箱的初始用户编辑页。\n\n查看图 10.2 的 HTML 源代码，我们如所预期地在代码列表 10.3 中看到了一个\
  \ `form` 标签（细节可能有所不同）。\n\n**代码列表 10.3:** 代码列表 10.2 定义并在图 10.2 中显示的编辑表单的 HTML。\n\n\
  [点击此处查看代码图片]\n\n```html\n<form accept-charset=\"UTF-8\" action=\"/users/1\" class=\"\
  edit_user\" id=\"edit_user_1\" method=\"post\">\n  <input name=\"_method\" type=\"\
  hidden\" value=\"patch\" />\n</form>\n```\n\n注意此处的隐藏输入：\n\n[点击此处查看代码图片]\n\n```html\n\
  <input name=\"_method\" type=\"hidden\" value=\"patch\" />\n```\n\n由于 Web 浏览器无法原生发送\
  \ PATCH 请求（如表 7.1 的 REST 规范所要求的），Rails 通过 POST 请求和一个隐藏的 `input` 字段来模拟它。\n\n**2.**\
  \ 不要担心这是如何运作的；这些细节对 Rails 框架本身的开发者感兴趣，从设计上来说，对 Rails 应用程序开发者来说并不重要。\n\n这里还有另一个细微之处需要处理：代码列表\
  \ 10.2 中的代码 `form_for(@user)` 与代码列表 7.15 中的代码*完全相同*——那么 Rails 知道对新用户使用 POST 请求、对编辑用户使用\
  \ PATCH 请求 吗？答案是，可以通过 Active Record 的布尔方法 `new_record?` 来判断用户是新记录还是已经存在于数据库中：\n\n\
  [点击此处查看代码图片]\n\n```\n$ rails console\n>> User.new.new_record?\n=> true\n>> User.first.new_record?\n\
  => false\n```\n\n当使用 `form_for(@user)` 构建表单时，如果 `@user.new_record?` 为 `true`，Rails\
  \ 使用 POST；如果为 `false`，则使用 PATCH。\n\n作为最后的润色，我们将填充站点导航中的设置链接。这可以通过表 7.1 中的命名路由 `edit_user_path`\
  \ 以及代码列表 9.9 中定义的 `current_user` 辅助方法来实现：\n\n[点击此处查看代码图片]\n\n```erb\n<%= link_to\
  \ \"Settings\", edit_user_path(current_user) %>\n```\n\n**代码列表 10.4:** 在站点布局中为“Settings”链接\
  \ URL。\n\n`app/views/layouts/_header.html.erb`\n\n[点击此处查看代码图片]\n\n```erb\n<header\
