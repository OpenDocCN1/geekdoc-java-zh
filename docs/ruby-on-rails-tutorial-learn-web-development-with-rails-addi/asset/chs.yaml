  \n##### 练习\n\n练习题可以通过 railstutorial.org/solutions 免费获取任何 Rails Tutorial。要查看他人的答案并记录自己的答案，请加入\
  \ learnenough.com/society 的 Learn Enough Society。\n\n\n\n\n\n1. 正如上面所述，默认情况下，过滤器会在应用到控制器的每个操作（action）之前，这在我们的案例中是一个错误（例如，要求用户必须登录才能访问注册页面，这显然是荒谬的）。通过注释掉列表\
  \ 10.15 中的 `only:` 哈希表，确认测试套件是否捕获了这个错误。\n\n#### 10.2.2 要求正确的用户\n\n当然，仅仅要求用户登录是不够的；用户应该只允许编辑他们*自己的*信息。正如我们在第\
  \ 10.2.1 节中看到的，很容易编写出一个遗漏了基本安全漏洞的测试套件，因此我们将继续使用测试驱动开发（TDD）来确保我们的代码正确实现了安全模型。为了做到这一点，我们将在\
  \ `Users` 控制器测试中添加测试用，以补充列表 10.20 中所示的内容。\n\n为了确保用户无法编辑其他用户的信息，我们需要能够以第二个用户的身份登录。这意味着要在我们的\
  \ users 固件文件（fixture）中添加第二个用户，如列表 10.23 所示。\n\n**列表 10.23：** 在固件文件中添加第二个用户。\n\n\
  ```yaml\ntest/fixtures/users.yml\n```\n\n点击此处查看代码图片\n\n* * *\n\n```yaml\nmichael:\n\
  \  name: Michael Example\n  email: michael@example.com\n  password_digest: <%= User.digest('password')\
  \ %>\n\narcher:\n  name: Sterling Archer\n  email: duchess@example.gov\n  password_digest:\
