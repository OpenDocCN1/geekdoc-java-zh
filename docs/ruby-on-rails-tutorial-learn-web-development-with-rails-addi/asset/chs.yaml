  \ 方法是否有效。`remember_token` 和 `remember_digest` 比较的结果结果如何？\n\n2. 在 Listing 9.3 中，我们通过显式前缀\
  \ `User` 定义了新的 token 和 digest 类方法。这种方法运行良好，而且由于它们实际上是通过 `User.new_token` 和 `User.digest`\
  \ 被*调用*的，这可能是定义它们最清晰的方法。但定义类方法还有两种可能符合习惯的方法，其中一种稍微令人困惑，另一种则极其困惑。通过运行测试套件，验证 Listing\
  \ 9.4（稍显困惑）和 Listing 9.5（极其困惑）中的实现是正确的。（注意，在 Listing 9.4 和 Listing 9.5 的上下文中，`self`\
  \ 指的是 `User` 类，而 User 模型中其他对 `self` 使用指的是用户对象*实例*。这是导致它们令人困惑的原因之一。）\n\n**Listing\
  \ 9.4：** 使用 `self` 定义新的 token 和 digest 方法。`GREEN`\n\napp/models/user.rb\n\n点击此处查看代码图片\n\
  \n***\n\n```ruby\nclass User < ApplicationRecord\n\n  .\n  .\n  .\n\n  # 返回给定字符串的哈希摘要。\n\
  \  def self.digest(string)\n    cost = ActiveModel::SecurePassword.min_cost ? BCrypt::Engine::MIN_COST\
  \ :\n      BCrypt::Engine.cost\n    BCrypt::Password.create(string, cost: cost)\n\
  \  end\n\n  # 返回一个随机 token。\n  def self.new_token\n    SecureRandom.urlsafe_base64\n\
  \  end\n\n  .\n  .\n  .\nend\n```\n\n***\n\n**Listing 9.5：** 使用 `class << self`\
  \ 定义新的 token 和 digest 方法。`GREEN`\n\napp/models/user.rb\n\n点击此处查看代码图片\n\n***\n\n\
  ```ruby\nclass User < ApplicationRecord\n\n  .\n  .\n  .\n\n  class << self\n  \
  \  # 返回给定字符串的哈希摘要。\n    def digest(string)\n      cost = ActiveModel::SecurePassword.min_cost\
  \ ? BCrypt::Engine::MIN_COST :\n        BCrypt::Engine.cost\n      BCrypt::Password.create(string,\
  \ cost: cost)\n    end\n\n    # 返回一个随机 token。\n    def new_token\n      SecureRandom.urlsafe_base64\n\
  \    end\n  end\n\n  .\n  .\n  .\nend\n```\n\n#### 9.1.2 带有记住功能的登录\n\n在创建了可工作的 `user.remember`\
  \ 方法后，我们现在可以通过将用户的（加密）id 和 remember token 存储为永久 cookie 来创建一个持久会话。实现这一点的方法是使用 `cookies`\
  \ 方法，我们可以像处理 `session` 一样将其视为一个哈希。cookie 由两部分信息组成：`value` 和可选的 `expires` 日期。例如，我们可以通过创建一个值等于\
  \ remember token 且在 20 年后过期的 cookie 来创建一个持久会话：\n\n点击此处查看代码图片\n\n```ruby\ncookies[:remember_token]\
  \ = { value: remember_token, expires: 20.years.from_now.utc }\n```\n\n（这使用了 Rails\
  \ 的方便助手之一，正如 Box 9.1 中讨论的那样。）这种设置 20 年后过期 cookie 的模式非常常见，以至于 Rails 有一个专门的 `permanent`\
  \ 方法来实现它，因此我们只需要写：\n\n点击此处查看代码图片\n\n```ruby\ncookies.permanent[:remember_token]\
  \ = remember_token\n```\n\n\n\n\n其中 `cookies.signed[:user_id]` 会自动解密用户 id cookie。我们随后可以使用\
  \ `bcrypt` 来验证 `cookies[:remember_token]` 是否与 Listing 9.3 中生成的 `remember_digest`。（如果你好奇为什么我们不直接使用签名的\
  \ user id 而不使用 remember token，这将允许拥有加密 id 的攻击者永久地作为该用户登录。在目前的设计中，同时拥有这两个 cookie\
  \ 的攻击者只能登录到该用户注销为止。）\n\n拼图的最后一块是验证给定的 remember token 是否与用户的 remember digest 匹配，在这种语境下，有几种等效的方法可以使用\
  \ `bcrypt` 来验证匹配。如果你查看安全密码的源代码，你会发现类似如下的比较：⁹\n\n[9.] 如第 6.3.1 节所述，“未加密密码”是一个误称，因为安全密码是经过*哈希（hashed）*的，而不是加密的。\n\
  \n点击此处查看代码图像\n\n```\nBCrypt::Password.new(password_digest) == unencrypted_password\n\
  ```\n\n在我们的情况下，类似的代码看起来如下：\n\n点击此处查看代码图像\n\n```\nBCrypt::Password.new(remember_digest)\
  \ == remember_token\n```\n\n如果你仔细考虑，这段代码其实非常奇怪：它似乎在直接将 bcrypt 密码摘要与一个 token 进行比较，这意味着为了使用\
  \ `==` 进行比较需要*解密*摘要。但使用 `bcrypt` 的意义在于让哈希变得不可逆转，所以这不可能是。事实上，深入研究 `bcrypt` gem 的源代码可以证实，比较运算符\
  \ `==` 被*重定义*了，并且在底层，上面的比较等同于以下代码：\n\n点击此处查看代码图像\n\n```\nBCrypt::Password.new(remember_digest).is_password?(remember_token)\n\
  ```\n\n这里没有使用 `==`，而是使用布尔方法 `is_password?` 来执行比较。因为它的含义稍微清晰一点，我们倾向于在应用代码中使用第二种比较形式。\n\
  \n上面的讨论建议将摘要-token 的比较放入 `User` 模型的 `authenticated?` 方法中，该方法的作用与 `has_secure_password`\
  \ 提供的用于验证用户的 `authenticate` 方法类似（Listing 8.15）。其实实现在 Listing 9.6 中。（尽管 Listing 9.6\
  \ 中的 `authenticated?` 方法专门绑定到 remember digest，但事实证明它在其他语境下也有用，我们将在第 11 章](#part0020.xhtml_ch11)中对其进行泛化。）\n\
  \n**Listing 9.6:** 在 `User` 模型中添加 `authenticated?` 方法。\n\n`app/models/user.rb`\n\
  \n点击此处查看代码图像\n\n```\nclass User < ApplicationRecord\n  attr_accessor :remember_token\n\
