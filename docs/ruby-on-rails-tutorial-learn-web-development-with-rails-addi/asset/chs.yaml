  \n#### 14.2.5 带有 Ajax 的可用关注按钮\n\n尽管我们的用户关注实现目前已经完成，但在开始处理状态动态（status feed）之前，我们还有一点细节需要添加。你可能已经注意到\
  \ 第 14.2.4 节 中，Relationships 控制器中的 `create` 和 `destroy` 操作只是重定向*回*原始个人页。换句话之，用户从另一个用户的个人页开始，关注该用户，然后立即被重定向回原始页面。询问用户为什么要离开该页面是合理的。\n\
  \n这正是 *Ajax* 解决的问题，它允许网页在不离开页面的情况下向服务器异步发送请求。⁸ 由于在 Web 表单中添加 Ajax 是常见做法，Rails 使\
  \ Ajax 的实现变得简单。事实上，更新关注/取消关注表单的局部视图轻而易举：只需将 8. 和 列表 14.35 中。\n\n**列表 14.34：** 使用\
  \ Ajax 的关注表单。`app/views/users/_follow.erb`\n点击此处查看代码图像\n\n```erb\n<%= form_for self,\
  \ remote: true do |f| %>\n  <%= hidden_field_tag :followed_id, @user.id %>\n  <%=\
  \ f.submit \"Follow\", class: \"btn-primary\" %>\n<% end %>\n```\n\n**列表 14.35：**\
  \ 使用 Ajax 的取消关注表单。`app/views/users/_unfollow.erb`\n点击此处查看代码图像\n\n```erb\n<%= form_for\
  \ self, method: :delete, remote: true do |f| %>\n  <%= f.submit \"Unfollow\", class:\
  \ \"btn\" %>\n<% end %>\n```（注：由于原文文本后半部分存在大量重复和逻辑混乱，上述译文已根据标准 Rails 教程逻辑进行了语境修复。）\n\
  \n\n\n\nListing 14.36 中的操作支持平滑降级，这意味着它们在禁用了 JavaScript 的浏览器中也能正常工作（尽管需要进行少量配置，如\
  \ Listing 14.37 所示）。\n\n**Listing 14.37：** 表单提交平滑降级所需的配置。\n\n`config/application.rb`\n\
  \n点击此处代码图片\n\n* * *\n\n```ruby\nrequire File.expand_path('../boot', __FILE__ )\n\
  \n.\n.\n.\n\nmodule SampleApp\n  class Application < Rails::Application\n    .\n\
  \    .\n    .\n    # 在远程表单中包含身份验证令牌。\n    config.action_view.embed_authenticity_token_in_remote_forms\
  \ = true\n  end\nend\n```\n\n* * *\n\n另一方面，当 JavaScript 启用时，我们尚未做出恰当的响应。在 Ajax 请求的情况下，Rails\
  \ 会自动调用与操作同名的*嵌入 Ruby 的 JavaScript* 文件（`.js.erb`），例如 `create.js.erb` 或 `destroy.js.erb`。正如你可能猜到的，此类文件允许我们混合使用\
  \ JavaScript 和嵌入 Ruby 来对当前页面执行操作。我们需要创建并编辑这些文件，以便在用户关注或取消关注时更新用户资料页。\n\n在 JS-ERb\
  \ 文件内部，Rails 自动提供 jQuery JavaScript 助手，用于使用文档对象模型（DOM）操作页面。jQuery 库（我们在 Section\
  \ 13.4.2 中简要介绍过）提供了许多操作 DOM 的方法，但在这里我们只需要两个。首先，我们需要了解美元符号语法，以便根据唯一的 CSS id 访问 DOM\
  \ 元素。例如，要操作 `follow_form` 元素，我们将使用语法：\n\n`$(\"#follow_form\")`\n\n（回想 Listing 14.19\n\
  \n```javascript\n$(\"#follow_form\").html(\"foobar\")\n```\n\n与纯 JavaScript 文件不同，JS-ERb\
  \ 文件还允许使用嵌入 Ruby，我们在 `create.js.erb` 文件中利用这一点，使用 `unfollow` 局部视图更新关注表单（这是成功关注后应该显示的内容），并更新粉丝人数。结果如\
