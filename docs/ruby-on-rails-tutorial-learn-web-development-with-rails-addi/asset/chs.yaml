  \ 表达式，验证列表 9.31 中的第二个测试是否会失败，从而确认它确实测试了正确的内容。\n\n## 9.4 结论\n\n在过去 de 的三个章节中，我们涵盖了大量内容，将我们那个很有前景但尚未成型的应用程序转换为了一个具备全套注册和登录行为的网站。完成身份验证功能只需要根据登录状态和用户身份限制对页面的访问。我们将在赋予用户编辑信息的能力的过程中完成这一任务，这正是第\
  \ 10 章的主要目标。\n\n### 9.4.1 本章所学\n\n- Rails 可以使用 `cookies` 在一个页面到页面之间维持状态。\n- 我们使用\
  \ `cookies` 方法为每个用户关联一个记忆令牌。\n- 登录状态由当前用户是否存在决定。\n- 应用程序通过删除临时会话退出。\n- 三元运算符是编写简单\
  \ if-then 语句的紧凑方式。\n\n# 第 10 章 更新、显示和删除用户\n\n在本章中，我们将通过添加 `edit`、`update`、`index`\
  \ 和 `destroy` 来完成用户（表 7.1）的 REST 操作。我们将首先赋予用户更新其个人资料的能力，这将为强制授权提供一个自然的机会（这由第 8 章实现）。然后我们将列出所有用户，这将引入示例数据和分页的动机。最后，我们将添加删除用户的能力。由于我们不能允许任何用户拥有此类权限，我们将小心创建一个被授权删除的特权管理用户类。\n\
  \n## 10.1 更新用户\n\n编辑用户信息的模式与创建新用户的模式非常相似（第 7 章）。我们不是有一个渲染新用户视图的 `new` 操作，而是有一个渲染用于编辑用户视图的\
  \ `edit` 操作；不是有一个响应 POST 请求的 `create` 操作，而是有一个响应 PATCH 请求的 `update` 操作（框 3.2）。最大的区别在于，虽然任何人都可以注册，但只有当前用户应该能够更新自己的信息。来自第\
  \ 8 章的身份验证机制允许我们使用*前置过滤器*（before filter）来确保情况如此。\n\n从开始，让我们在一个 `updating-users`\
  \ 主题分支上开始工作：\n\n点击此处查看代码\n\n`$ git checkout -b updating-users`\n\n#### 10.1.1 编辑表单\n\
  \n我们从编辑表单开始，其原型出现在图 10.1 中。¹ 为了将图 10.1 中的原型转换为可运行的页面，我们需要填充 Users 控制器的 `edit` 操作和用户编辑视图。我们从\
  \ `edit` 操作开始，这需要从数据库中提取相应的用户。从表 7.1 中注意，用户编辑页的正确 URL 是 /users/1/edit（假设用户 id 为\
  \ 1）。回想用户的 ID 在 `params [:id]` 变量可用，这意味着我们可以通过列表 10.1 中的代码找到该用户。\n\n\n\n\n\n图片检索自\
  \ [http://www.flickr.com/photos/sashawolff/4598355045/]，于 2014-08-25。版权所有 © 2010\
