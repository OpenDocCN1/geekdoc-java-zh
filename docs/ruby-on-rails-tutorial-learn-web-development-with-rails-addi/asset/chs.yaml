  \ 来解决这个问题：\n\n3. `shim` 和 `shiv` 这两个词在上下文中交替使用；前者是正式术语，基于英语单词，其含义是“用于对齐部件、使其贴合或减少磨损的垫圈或薄条”，而后者（意思是“作为武器的刀或剃刀”）显然是对\
