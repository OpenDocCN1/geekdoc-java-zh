  \ 控制台还会显示与 `user.save` 对应的 SQL 命令（即 `INSERT INTO \"users\"`……）。在本书书中我们几乎不需要原始 SQL，⁶我从现在起将省略对\
  \ SQL 命令的讨论，但通过阅读与 Active Record 命令对应的 SQL，你可以学到很多东西。\n\n6. 唯一的例外是第 14.3.3 节\n\n\
  你可能已经注意到，新用户对象的 `id` 属性以及魔法列 `created_at` 和 `updated_at` 属性均为 `nil` 值。让我们看看我们的 `save`\
  \ 是否改变了什么：\n\n点击此处查看代码图片\n\n```ruby\n>> user\n=> #<User id: 1, name: \"Michael Hartl\"\
  , email: \"mhartl@example.com\", created_at: \"2016-05-23 19:05:58\", updated_at:\
  \ \"2016-05-23 19:05:58\">\n```\n\n我们看到 `id` 被赋予了值 `1`，而魔法列被赋予了当前的日期时间。⁷目前，创建和更新的时间戳是完全相同的；我们将在第\
  \ 6.1.5 节中看到它们不同。\n\n7. 时间戳以协调世界时（UTC）记录，对于大多数实际用途而言，它与格林尼治标准时间相同。来自 NIST 时间和频率常见问题：**问：**\
  \ 为什么使用 UTC 作为协调世界时的缩写，而不是 CUT？**答：** 1970 年，协调世界时系统是由国际电信联盟（ITU）内部的一个技术专家组成的国际顾问小组设计的。ITU\
  \ 认为指定一个单一缩写供所有语言使用是最好的，以尽可能地减少混乱。由于无法对使用英语语序 CUT 或法语语序 TUC 达成共识，选择了 UTC 缩写作为折中方案。\n\
  \n与第 4.4.5 节中的 User 类一样，User 模型的实例允许使用点符号法访问其属性：\n\n点击此处查看代码图片\n\n```ruby\n>> user.name\n\
  => \"Michael Hartl\"\n\n>> user.email\n=> \"mhartl@example.com\"\n\n>> user.updated_at\n\
  => Mon, 23 May 2016 19:05:58 UTC +00:00\n```\n\n正如我们在第 7 章中看到的，像像上面那样分两步创建并保存模型通常是很方便的，但\
  \ Active Record 也允许你通过 `User.create` 将它们合并为一步：\n\n点击此处查看代码图片\n\n```ruby\n>> User.create\
  \ (name: \"A Nother\", email: \"another@example.org\")\n#<User id: 2, name: \"A\
  \ Nother\", email: \"another@example.org\", created_at: \"2016-05-23 19:18:46\"\
  , updated_at: \"2016-05-23 19:18:46\">\n\n>> foo = User.create(name: \"Foo\", email:\
  \ \"foo@bar.com\")\n#<User id: 3, name: \"Foo\", email: \"foo@bar.com\", created_at:\
  \ \"2016-05-23 19:19:06\", updated_at: \"2016-05-23 19:19:06\">\n```\n\n注意，`User.create`\
  \ 返回的不是 `true` 或 `false`，而是 User 对象本身，我们可以选择地将其赋值给变量（例如上面第二个命令中的 `foo`）。\n\n`create`\
  \ 的反向操作是 `destroy`：\n\n点击此处查看代码图片\n\n```ruby\n>> foo.destroy\n(0.1ms) SAVEPOINT\
  \ active_record_1\nSQL (0.2ms) DELETE FROM \"users\" WHERE \"users\".\"id\" = ?\
  \ [\"3\"]\n(0.1ms) RELEASE SAVEPOINT active_record_1\n=> #<User id: 3, name: \"\
  Foo\", email: \"foo@bar.com\", created_at: \"2016-05-23 19:19:06\", updated_at:\
  \ \"2016-05-23 19:19:06\">\n```\n\n与 `create` 一样，`destroy` 也返回目标对象，尽管我不记得是否用过 `destroy`\
  \ 的返回值。此外，被删除的对象仍然存在于内存中：\n\n点击此处查看代码图片\n\n```ruby\n>> foo\n=> #<User id: 3, name:\
  \ \"Foo\", email: \"foo@bar.com\", created_at: \"2016-05-23 19:19:06\", updated_at:\
  \ \"2016-05-23 19:19:06\">\n```\n\n那么我们如何知道是否真的删除了一个对象？对于已保存和未删除的对象，我们如何检索它们？为了回答这些问题，我们需要学习如何使用\
  \ Active Record 查找对象。\n\n### 练习\n\n可以在 railutorial.org 免费查看练习答案。要记录自己的答案，加入 learnenough.com。\n\
  \n1. 确认 `user.name` 和 `user.email` 是 `String` 类型。\n2. `created_at` 和 `updated_at`\
  \ 是什么类型？\n\n#### 6.1.4 查找对象\n\nActive Record 提供了几种查找对象的方法。让我们使用它们来查找我们创建的第一个用户，同时验证第三个用户\
  \ (`foo`) 已删除。我们从现有用户开始：\n\n点击此处查看代码图片\n\n```ruby\n>> User.find(1)\n=> #<User id:\
  \ 1, name: \"Michael Hartl\", email: \"mhartl@example.com\", created_at: \"2016-05-23\
  \ 19:05:58\", updated_at: \"2016-05-23 19:05:58\">\n```\n\n在这里我们将用户的 `id` 传递给 `User.find`；Active\
  \ Record 返回该 id 用户。看看 `id` 为 `3` 的用户是否还存在于数据库中：\n\n点击此处查看代码图片\n\n```ruby\n>> User.find(3)\n\
  ActiveRecord::RecordNotFound: Couldn't find User with ID=3\n```\n\n我们在第 6.1.3 节中删除了第三个用户，因此\
  \ Active Record 无法在数据库中找到它。相反，`find` 会抛出一个异常，这是指示程序执行期间异常事件的一种——在本例中，不存在 Active\
  \ Record id 导致 `find` 抛出 `ActiveRecord::RecordNotFound` 异常⁸⁸part0015.xhtml_ch6en8\n\
  \n8. 异常和异常处理是某些高级的 Ruby 主题，我们在书中并不需要它们。不过它们是重要的，我建议使用第 14.4.1 节推荐的 Ruby 书来学习它们。\n\
  \n除了通用的 `find` 之外，Active Record 还允许我们通过特定属性查找用户：\n\n点击此处查看代码图片\n\n```ruby\n>> User.find_by(email:\
  \ \"mhartl@example.com\")\n=> #<User id: 1, name: \"Michael Hartl\", email: \"mhartl@example.com\"\
  , created_at: \"2016-05-23 19:05:58\", updated_at: \"2016-05-23 19:05:58\">\n```\n\
  \n由于我们将使用邮箱地址作为用户名，这种 `find` 在我们学习如何让用户登录网站时（第 7 章）将有用。如果你担心当用户很多时 `find_by` 效率低下，那么你领先了一步；我们将在第\
  \ 6.2.5 节中介绍这个问题以及通过数据库索引的解决方案。\n\n我们将用另外两种更通用的查找用户方法结束。首先，是 `first`：\n\n点击此处查看代码图片\n\
  \n```ruby\n>> User.first\n=> #<User id: 1, name: \"Michael Hartl\", email: \"mhartl@example.com\"\
  , created_at: \"2016-05-23 19:05:58\", updated_at: \"2016-05-23 19:05:58\">\n```\n\
  \n自然，`first` 只是返回数据库中的第一个用户。还有 `all`：\n\n点击此处查看代码图片\n\n```ruby\n>> User.all\n=>\
  \ #<ActiveRecord::Relation [#<User id: 1, name: \"Michael Hartl\", email: \"mhartl@example.com\"\
  , created_at: \"2016-05-23 19:05:58\", updated_at: \"2016-05-23 19:05:58\">, #<User\
  \ id: 2, name: \"A Nother\",\n```\n\n\n\n\n\n`email: \"another@example.org\", created_at:\
  \ \"2016-05-23 19:18:46\",`\n`updated_at: \"2016-05-23 19:18:46\">]>\n\n正如你从控制台输出所示，`User.all`\
  \ 将数据库中的所有用户返回为 `ActiveRecord::Relation` 类的对象，这实际上是一个数组（第 4.3.1 节）。\n\n### 练习\n\n\
