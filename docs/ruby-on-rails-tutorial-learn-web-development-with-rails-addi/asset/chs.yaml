  \ 核心部分的规范译文：**\n\n[content]\n### 4.3.3 哈希（Hashes）与符号（Symbols）\n\n哈希本质上是不局限于整数索引的数组。（事实上，由于这个原因，某些语言（特别是\
  \ Perl）有时会将哈希称为*关联数组*。）相反，哈希索引（或称为*键*，keys）可以是几乎任何对象。例如，我们可以使用字符串作为键：\n\n点击此处查看代码图像\n\
  \n```ruby\n>> user = {}                          # {} 是一个空哈希。\n=> {}\n\n>> user[\"\
  first_name\"] = \"Michael\"      # 键 \"first_name\", 值 \"Michael\"\n=> \"Michael\"\
  \n\n>> user[\"last_name\"] = \"Hartl\"        # 键 \"last_name\", 值 \"Hartl\"\n=>\
  \ \"Hartl\"\n\n>> user[\"first_name\"]                  # 元素访问类似于数组。\n=> \"Michael\"\
  \n\n>> user                               # 哈希的字面量表示\n=> {\"last_name\"=>\"Hartl\"\
  , \"first_name\"=>\"Michael\"}\n```\n\n哈希用包含键值对的大括号表示；一对没有键值对的大括号——即 `{}`——表示一个空哈希。需要注意的是，用于哈希的大括号与用于块（blocks）的大括号之间没有任何关系（是的，这可能会让人困惑）。虽然哈希看起来像数组，但它们一个重要的区别是，哈希通常不保证保持其元素的特定顺序。如果顺序对你很重要，请使用数组。\n\
  \n### 4.3.3 哈希排序\n\nRuby 1.9 及更高版本实际上保证哈希会按照输入的顺序保持其元素，但依赖于特定的排序是不明智的。\n\n\n\n\n\
  这种构造方式更贴近其他语言（如 JavaScript）中的哈希表示法，并在 Rails 社区中变得越来越流行。由于两种哈希语法仍然在使用中，因此能够识别这两种语法是至关重要的。遗憾的是，这可能会引起困惑，尤其是因为\
  \ `:name` 本身是有效的（作为一个独立的符号），但 `name:` 本身并没有意义。结论是，`:name =>` 和 `name:` 仅在*字面量哈希内部*实际上是等价的，因此：\n\
  \n```\n{ :name => \"Michael Hartl\" }\n```\n\n和\n\n```\n{ name: \"Michael Hartl\"\
  \ }\n```\n\n是等价的，但在其他情况下，你需要使用 `:name`（冒号在前）来表示一个符号。\n\n哈希值可以是几乎任何内容，甚至是其他哈希，如列表\
  \ 4.13 所示。\n\n**列表 4.13：** 嵌套哈希。\n\n点击此处查看代码图片\n\n***\n\n```ruby\n>> params = {}\
  \      # 定义一个名为 'params' 的哈希（parameters 的缩写）。\n=> {}\n>> params[:user] = { name:\
  \ \"Michael Hartl\", email: \"mhartl@example.com\" }\n=> {:name=>\"Michael Hartl\"\
  , :email=>\"mhartl@example.com\"}\n>> params\n=> {:user=>{:name=>\"Michael Hartl\"\
  , :email=>\"mhartl@example.com\"}}\n>>  params[:user][:email]\n=> \"mhartl@example.com\"\
  \n```\n\n***\n\n这种嵌套的哈希，或*嵌套哈希*被 Rails 广泛使用，我们将从第 7.3 节 开始看到。\n\n与数组和范围一样，哈希也响应于\
  \ `each` 方法。例如，考虑一个名为 `flash` 的哈希，它包含两个条件的键：`:success` 和 `:danger`：\n\n点击此处查看代码图片\n\
  \n```ruby\n>> flash = { success: \"It worked!\", danger: \"It failed.\" }\n=> {:success=>\"\
  It worked!\", :danger=>\"It failed.\"}\n>> flash.each do |key, value|\n?>    puts\
  \ \"Key #{key.inspect} has value #{value.inspect}\"\n>> end\nKey :success has value\
  \ \"It worked!\"\nKey :danger has value \"It failed.\"\n```\n\n注意，虽然数组的 `each` 方法接收只带有一个变量的块，但哈希的\
  \ `each` 接收两个：一个*键*（key）和一个*值*（value）。因此，哈希的 `each` 方法每次遍历哈希的一个键值对*。\n\n上一个示例使用了非常有用的\
  \ `inspect` 方法，它返回一个带有被调用对象字面量表示的字符串：\n\n***\n\n点击此处查看代码图片\n\n```ruby\n>> puts (1..5).to_a\
  \              # 将数组作为字符串输出。\n1\n2\n3\n4\n5\n>> puts (1..5).to_a.inspect     # 输出一个字面量数组。\n\
  [1, 2, 3, 4, 5]\n>> puts :name, :name.inspect\nname\n:name\n>> puts \"It worked!\"\
  , \"It worked!\".inspect\nIt worked!\n\"It worked!\"\n```\n\n***\n\n顺便说，使用 `inspect`\
  \ 打印对象非常常见，因此有一个快捷方式，即 `p` 函数：12)\n\n[12.] 实际上存在一个细微的区别，即 `p` 返回正在打印的对象，而 `puts`\
  \ 始终返回 `nil`。（感谢读者 Katarzyna Siwek 指出这一点。）\n\n点击此处查看代码图片\n\n```ruby\n>> p :name\
  \      # 输出与 'puts :name.inspect' 相同\n:name\n```\n\n### 练习题\n\n购买任何 Rails Tutorial\
