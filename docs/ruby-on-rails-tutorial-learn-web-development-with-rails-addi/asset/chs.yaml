  \ /users/1 而不是\n\n##### 练习\n\n练习题可以通过 railstutorial.org 免费获取（需购买任何 Rails Tutorial）。要查看他人的答案并记录自己的答案，请加入\
  \ learnenough.com/society 的 Learn Enough Society。\n\n1. 为什么保护 `edit` 和 `update`\
  \ 操作很重要？\n\n2. 哪个操作可以更方便地在浏览器中测试？\n\n\n\n\n\n`/users/1/edit` 。与其相反，将他们重定向到预期的目标地要友好得多。\n\
  \n应用程序代码将会变得相对复杂，但我们只需要反转 Listing 10.17 中记录日志和访问编辑页的顺序，就可以为友好的重定向编写一个极其简单的测试。如 Listing\
  \ 10.29 所示，生成的测试会尝试访问编辑页面，然后登录，最后检查用户是否被重定向到 `edit` 页面而不是默认的个人页。（Listing 10.29 同时也删除了渲染编辑模板的测试，因为那不再是预期的行为。）\n\
  \n**Listing 10.29:** 友好的重定向的测试。**红色**\n\n`test/integration/users_edit_test.rb`\n\
  \n点击此处查看代码图片\n\n```ruby\nrequire 'test_helper'\n\nclass UsersEditTest < ActionDispatch::IntegrationTest\n\
  \  def setup\n    @user = users(:michael)\n  end\n\n  test \"successful edit with\
  \ friendly forwarding\" do\n    get edit_user_path(@user)\n    log_in_as(@user)\n\
  \    assert_redirected_to edit_user_path(@user)\n    name  = \"Foo Bar\"\n    email\
  \ = \"foo@bar.com\"\n    patch user_path(@user), params: { user: { name: name,\n\
  \                                            email: email,\n                   \
  \                         password:           \"\",\n                          \
  \                  password_confirmation: \"\" } }\n    assert_not flash.empty?\n\
  \    assert_redirected_to @user\n    @user.reload\n    assert_equal name,  @user.name\n\
  \    assert_equal email, @user.email\n  end\nend\n```\n\n现在我们已经有了一个失败的测试，可以准备好实现友好的重定向了。⁵为了将用户重定向到他们的预期目标，我们需要在某处存储请求页面的位置，然后重定向到该位置而不是默认位置。我们通过一对方法\
  \ `store_location` 和 `redirect_back_or` 实现这一点，它们都定义在 Sessions 帮助中 (Listing 10.30)。\n\
  \n5. 本节的代码改编自来自 thoughtbot 的 Clearance gem。\n\n**Listing 10.30:** 实现友好的重定向的代码。**红色**\n\
  \n`app/helpers/sessions_helper.rb`\n\n点击此处查看代码图片\n\n```ruby\nmodule SessionsHelper\n\
  \  # 重定向到存储的地址（或默认地址）。\n  def redirect_back_or(default)\n    redirect_to(session[:forwarding_url]\
  \ || default)\n    session.delete(:forwarding_url)\n  end\n\n  # 存储尝试访问的 URL。\n\
  \  def store_location\n    session[:forwarding_url] = request.original_url if request.get?\n\
  \  end\nend\n```\n\n这里，重定向 URL 的存储机制与我们在 Section 8.2.1 中用于登录用户的 `session` 机制相同。Listing\
  \ 10.30 还使用了 `request` 对象（通过 `request.original_url`）来获取请求页面的 URL。\n\nListing 10.30\
  \ 中的 `store_location` 方法将请求的 URL 放在 `session` 变量的 `:forwarding_url` 键下，但仅针对 `GET`\
  \ 请求。这防止了当用户在未登录时提交表单时（这是一个边缘情况，但可能会发生，例如用户在提交表单前手动删除了会话）存储重定向 URL。在这样的情况下，结果重定向将向一个预期\
  \ `POST`、`PATCH` 或 `DELETE` 的 URL 发送 `GET` 请求，从而导致错误。包含 `if request.get?` 可以防止这种情况发生。⁶\
  \ 6. 感谢读者 Yoel Adler 指出这个问题并发现解决方案。\n\n为了使用 `store_location`，我们需要将其添加到到 `logged_in_user`\
  \ 过滤器中，如 Listing 10.31 所示。\n\n**Listing 10.31:** 在登录用户过滤器中添加 `store_location`。**红色**\n\
  \n`app/controllers/users_controller.rb`\n\n点击此处查看代码图片\n\n```ruby\nclass UsersController\
  \ < ApplicationController\n  before_action :logged_in_user, only: [:edit, :update]\n\
  \  before_action :correct_user, only: [:edit, :update]\n\n  def edit\n  end\n\n\
  \  private\n  def user_params\n    params.require(:user).permit(:name, :email, :password,\
  \ :password_confirmation)\n  end\n\n  # 过滤器\n  # 确认已登录用户。\n  def logged_in_user\n\
  \    unless logged_in?\n      store_location\n      flash[:danger] = \"Please log\
  \ in.\"\n      redirect_to login_url\n    end\n  end\n\n  # 确认正确的用户。\n  def correct_user\n\
  \    @user = User.find(params[:id])\n    redirect_to(root_url) unless current_user?(@user)\n\
  \  end\nend\n```\n\n为了实现重定向本身，我们使用 `redirect_back_or` 方法在存在 URL 时重定向到它，否则重定向到某个默认值，我们将此添加到\
  \ Sessions controller `create` 方法中成功登录后 ([Listing 10.32])。redirect_back_or` 方法使用了\
  \ `or` 运算符通过\n\n```\nsession[:forwarding_url] || default\n```\n\n值为 `session[:forwarding_url]`，除非它为\
  \ `nil`，此时值为给定的默认。注意 Listing 10.30 仔细删除了重定向 URL（通过 `session.delete(:forwarding_url)`），否则随后的登录尝试将重定向到受保护页面，直到用户关闭浏览器。（测试这一点留给练习\
  \ [Section 10.2.3])。还要注意即使重定向行出现在前面，会话删除也会发生；因为重定向之后的任何代码仍会被执行。\n\n**Listing 10.32:**\
  \ 友好的重定向的 Sessions `create` 方法。**绿色**\n\n`app/controllers/sessions_controller.rb`\n\
  \n点击此处查看代码图片\n\n```ruby\nclass SessionsController < ApplicationController\n  def\
  \ create\n    user = User.find_by(email: params[:session][:email].downcase)\n  \
  \  if user && user.authenticate(params[:session][:password])\n      log_in user\n\
  \      params[:session][:remember_me] == '1' ? remember(user) : forget(user)\n \
  \     redirect_back_or user\n    else\n      flash.now[:danger] = 'Invalid email/password\
  \ combination'\n      render 'new'\n    end\n  end\nend\n```\n\n这样，Listing 10.29\
  \ 中的友好重定向集成测试应该通过，且基础的用户认证和页面保护实现也已完成。如既常，在继续之前验证测试套件为 `GREEN` 是好习惯：\n\n**Listing\
