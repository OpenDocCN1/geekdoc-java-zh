  \  end\nend\n```\n\n#### 9.3.2 测试记住分支\n\n在第 9.3.1 节中，我们通过手动验证了列表 9.29 中的持久会话是有效的，但\
  \ `current_user` 方法中的相关分支完全没有被测试。处理这种情况情况的常用方法是在未测试的代码中抛出异常：如果代码未被覆盖，测试将会通过；如果它被覆盖了，生成的错误将出现在列表\
