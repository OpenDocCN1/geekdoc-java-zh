  \n为了制作用户个人资料页，我们需要数据库中有一个用户，这引入了一个“鸡生蛋蛋”的问题：在有工作的注册页面之前，网站如何拥有用户？幸运的是，这个问题已经得到了解决：在第\
  \ 6.3.4 节](#part0015.xhtml_ch06lev2sec14)中，我们通过 Rails 控制台手动创建了一个 User 记录，因此数据库中应该有一个用户：\n\
  \n点击此处查看代码图像\n\n```bash\n$ rails console\n>> User.count\n```\n\n\n\n# => 1\n\n##\
  \ `User.first`\n\n```ruby\n<User id: 1, name: \"Michael Hartl\", email: \"mhartl@example.com\"\
  ,\ncreated_at: \"2016-05-23 20:36:46\", updated_at: \"2016-05-23 20:36:46\",\npassword_digest:\
  \ \"$2a$10$xxucoRlMp06RLJSfWpZ8hO8Dt9AZXlGRi3usP3njQg3\">\n```\n\n（如果你目前数据库中还没有用户，应该现在访问第\
  \ 6.3.4 节并在继续之前完成它。）从上面的控制台输出中我们可以看到用户的 id 为 `1`，我们现在的目标是创建一个显示该用户信息的页面。我们将遵循 Rails\
  \ 中推崇的 REST 架构规范（Box 2.2），这意味着将数据表示为可以创建、显示、更新或删除的*资源*——这四个动作对应于 HTTP 标准定义的四个基本操作\
  \ `POST`、`GET`、`PATCH` 和 `DELETE`（Box 3.2）。\n\n遵循 REST 原则时，通常使用资源名称和唯一标识符进行引用。在用户的语境下——我们现在将其视为一个\
  \ Users *资源*——这意味着我们应该通过向 URL `/users/1` 发送 `GET` 请求来查看 id 为 `1` 的用户。在这里，`show`\
  \ 动作在请求类型是*隐式的*——当 Rails 的 REST 功能激活时，`GET` 请求会自动由 `show` 动作处理。\n\n我们在第 2.2.1 节\
  \ 中看到 id 为 `1` 的用户的页面 URL 为 `/users/1`。遗憾的是，现在访问该 URL 只得到错误，如服务器日志所示（Figure 7.4）。\n\
  \n我们可以通过在路由文件（`config/routes.rb`）中添加此单行来让 `/users/1` 的路由工作：\n\n```ruby\nresources\
  \ :users\n```\n\n![image](img/image01107.jpeg)\n\n**图 7.4：** `/users/1` 的服务器日志错误。\n\
  \n结果出现在 Listing 7.3 中。\n\n**代码 7.3：** 在路由文件中添加 Users 。\n\n```ruby\nconfig/routes.rb\n\
  ```\n\n点击此处查看代码\n\n* *\n\n```ruby\nRails.application.routes.draw do\n  root 'static_pages#home'\n\
  \  get '/help',    to: 'static_pages#help'\n  get '/about', to: 'static_pages#about'\n\
  \  get '/contact', to: 'static_pages#contact'\n  get '/signup', to: 'users#new'\n\
  \  resources :users\nend\n```\n\n* *\n\n尽管我们直接的动机是创建一个显示用户的页面，但单行 `resources :users`\
  \ 并不只是添加了一个可以工作的 `/users/1` URL；它赋予了我们的示例应用程序 RESTful Users 资源所需的*所有*动作，6，以及大量用于生成用户\
  \ URL 的命名路由（第 5.3.3 节）。生成的 URL、动作和命名路由之间的对应关系如 Table 7.1 所示。（对比 Table 2.2）。在接下来的三个章节中，随着我们填充使\
  \ Users 成为完全 RESTful 资源的所有动作，我们将涵盖 Table 7.1 中的所有其他条目。\n\n6. 这意味着*路由*是工作的，但相应的页面此时并不一定有效。例如，`/users/1/edit`\
  \ 被正确地路由到 Users 控制器的 `edit` 动作，但由于 `edit` 动作尚不存在，实际访问该 URL 将返回错误。\n\n有了 Listing\
  \ 7.3 中的代码，路由是工作的，但那里还没有页面（Figure 7.5）。为了修复这个问题，我们将从一个极简版本的个人页面开始，我们将在第 7.1.4 节\
  \ 中对其完善。\n\n![image](img/image01304.jpeg)\n\n**表 7.1：** Listing 7.3 中 Users 资源提供的\
  \ RESTful 路由。\n\n![image](img/image01306.jpeg)\n\n**图 7.5：** 有路由但没有页面的 URL `/users/1`。\n\
  \n我们将使用显示用户的标准 Rails 位置，即 `app/views/users/show.html.erb`。与我们在 Listing 5.38 中通过生成器创建的\
  \ `new.html.erb` 视图不同，`show.html.erb` 文件目前不存在，因此你必须手动创建它 7，并用 Listing 7.4 所示的内容填充它。\n\
