  \ 初始的可运行动态流。**绿色**\n\napp/models/user.rb\n\n点击此处查看代码图像\n\n```ruby\nclass User <\
  \ ApplicationRecord\n  .\n  \n  # 如果密码重置过期，则返回 true。\n  def password_reset_expired?\n\
  \    reset_sent_at < 2.hours.ago\n  end\n\n  # 返回用户的状态动态流。\n  def feed\n    Micropost.where(\"\
  user_id IN (?) OR user_id = ?\", following_ids, id)\n  end\n\n  # 关注一个用户。\n  def\
