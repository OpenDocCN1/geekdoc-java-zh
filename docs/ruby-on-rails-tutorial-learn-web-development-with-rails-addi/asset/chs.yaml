  \ 和 `GREEN` 之间切换。（你需要在每次切换之间保存文件。）\n\n### 8.3 注销登录\n\n正如 [Section 8.1] 所述，我们的认证模型是让用户保持登录状态，直到他们显式注销。在本节中，我们将添加这一必要的注销功能。由于“Log\
  \ out”链接已经定义（[Listing 8.19]），我们只需要编写一个有效的控制器动作来销毁会话即可。\n\n到目前为止，Sessions 控制器遵循了\
  \ RESTful 惯例，使用 `new` 登录页面，使用 `create` 完成登录。我们将继续这一主题，使用 `destroy` 动作来删除会话，即注销。与我们在\
  \ [Listing 8.15] 和 [Listing 8.25] 中使用的登录功能不同，我们只在一个地方进行注销，因此我们将相关代码放在 `destroy`\
  \ 动作中。正如我们在 [Section 9.3] 中看到的，这种设计（经过少量重构）也将使认证机制更易测试。\n\n注销登录涉及撤销 [Listing 8.14]\
  \ 中 `log_in` 方法的影响，这涉及到从会话中删除 id。要做到这一点，我们如下所示使用 `delete` 方法：\n\n```ruby\nsession.delete(:user_id)\n\
  ```\n\n某些浏览器提供“从上次离开处继续”的功能，可以自动恢复会话，因此在尝试注销之前，务必禁用此类功能。我们还将当前用户设置为 `nil`，尽管在当前情况下由于会立即重定向到根\
  \ URL，这并不会重要。与 `log_in` 相关方法一样，我们将生成的 `log_out` 方法放在 Sessions helper 中，如 [Listing\
  \ 8.29] 所示。只有当 `@current_user` 在 `destroy` 动作之前被创建（实际上并没有被创建）且我们没有立即重定向（但我们执行了）时，将\
  \ `@current_user` 设置为 `nil` 才有意义。这是一种不太可能的事件组合，对于目前构建的应用程序来说没有必要，但因为涉及安全，为了完整性我包含了它。\n\
  \n**Listing 8.29：** `log_out` 方法。\n\n```ruby\napp/helpers/sessions_helper.rb\n```\n\
  \n[点击此处查看代码图片]\n\n* *\n\n```ruby\nmodule SessionsHelper\n  # 登录给用户。\n  def log_in(user)\n\
  \    session[:user_id] = user.id\n  end\n\n  # 注销当前用户。\n  def log_out\n    session.delete(:user_id)\n\
  \    @current_user = nil\n  end\nend\n```\n\n* *\n\n我们可以如 [Listing 8.30] 所示，将 `log_out`\
  \ 方法用于 Sessions 控制器的 `destroy` 动作中。\n\n**Listing 8.30: 销毁会话（用户注销）。**\n\n```ruby\n\
  app/controllers/sessions_controller.rb\n```\n\n[点击此处查看代码图片]\n\n* *\n\n```ruby\n\
  class SessionsController < ApplicationController\n  def new\n  end\n\n  def create\n\
  \    user = User.find_by(email: params[:session][:email].downcase)\n    if user\
  \ && user.authenticate(params[:session][:password])\n      log_in user\n      redirect_to\
  \ user\n    else\n      flash.now[:danger] = 'Invalid email/password combination'\n\
  \      render 'new'\n    end\n  end\n\n  def destroy\n    log_out\n    redirect_to\
  \ root_url\n  end\nend\n```\n\n* *\n\n为了测试注销机制，我们可以为 [Listing 8.23] 中的登录测试添加一些步骤。登录后，我们使用\
