  \ 1.1）。\n\n### 练习题\n\n购买任何 Rails Tutorial 后都可以在 railstutorial.org/aw-solutions 免费获取练习答案。要查看他人的答案并记录自己的答案，请加入\
  \ learnenough.com/society 的 Learn Enough Society。\n\n**1.** 更改列表 1.8 中 `hello` 动作的内容，使其读取为“hola,\
  \ mundo!”而不是“hello, world!”。\n\n**2.** 通过包含倒置感叹号（如“¡Hola, mundo!”）证明 Rails 支持非 ASCII\
  \ 字符（图 1.12）。\n\n**3.** 通过修改列表 1.8 中的 `hello` 动作内容，编辑列表 1.10 中的路由文件，使根路由指向 `goodbye`而不是\
  \ `hello`。\n\n\n\n\n\n此命令会将当前目录下的所有文件添加，但匹配名为 `.gitignore` 的特殊文件中模式的文件除。`rails new`\
  \ 命令会自动生成一个适用于 Rails 项目的 `.gitignore` 文件，但你也可以添加额外的模式。\n\n虽然在主教程中我们不需要编辑它，但在 3.6.2\
  \ 节中有一个向 `.gitignore` 文件添加规则的示例，该节是 3.6 节中可选的高级测试设置的一部分。\n\n添加的文件最初被放置在*暂存区*（staging\
  \ area），其中包含了我们项目中待提交的更改。我们可以使用 `status` 命令查看暂存区中有哪些文件：\n\n```\n$ git status\n\n\
  On branch master\n\nInitial commit\n\nChanges to be committed:\n  (use \"git rm\
  \ --cached <file>...\" to unstage)\n  new file:    .gitignore\n  new file:    Gemfile\n\
  \  new file:    Gemfile.lock\n  new file:    README.md\n  new file:    Rakefile\n\
  \  .\n  .\n  .\n```\n\n为了告诉 Git 我们想保留这些更改，我们使用 `commit` 命令：\n\n```\n$ git commit\
  \ -m \"Initialize repository\"\n\n[master (root-commit) df0a62f] Initialize repository\n\
  .\n.\n.\n```\n\n`-m` 标志允许我们为提交添加一条消息；如果我们省略了 `-m`，Git 将打开系统的默认编辑器让我们在那里输入消息。（书中的所有示例都将使用\
  \ `-m` 标志。）\n\n需要注意的是，Git 提交是*本地的*，仅记录在执行提交的机器上。我们将在 1.4.4 节中查看如何将更改推送到远程仓库（使用 `git\
  \ push`）。\n\n顺便提一下，我们可以使用 `log` 命令查看提交消息列表：\n\n```\ncommit af72946fbebc15903b2770f92fae9081243dd1a1\n\
  \nAuthor: Michael Hartl <michael@michaelhartl.com>\nDate:    Thu May 12 19:25:07\
  \ 2016 +0000\n\n    Initialize repository\n```\n\n根据存储库日志历史的长度，你可能需要输入 `q` 来退出。（正如*Learn\
  \ Enough Git to Be Dangerous*中所解释的，`git log` 使用了*Learn Enough Command Line to Be\
  \ Dangerous*中涵盖的 `less` 界面）。\n\n### 1.4.2 Git 能为你做什么？\n\n如果你从未用过版本控制，现在可能并不完全清楚它能给你带来什么好处，所以让我举一个例子。假设你做了一些意外的更改，例如（哎呀！）删除了关键的\
  \ `app/controllers/` 目录。\n\n```bash\n$ ls app/controllers/\napplication_controller.rb\
  \ concerns/\n\n$ rm -rf app/controllers/\n\n$ ls app/controllers/\nls: app/controllers/:\
  \ No such file or directory\n```\n\n在这里，我们使用 Unix 的 `ls` 命令列出 `app/controllers/`\
  \ 目录的内容，并使用 `rm` 命令将其删除（[表 1.1]）。正如*Learn Enough Command Line to Be Dangerous*所示，`-rf`\
  \ 标志意味着“递归强制”，它会递归删除所有文件、目录、子目录等，而不会要求对每次删除进行显式确认。\n\n让我们检查状态查看发生了什么：\n\n```bash\n\
  $ git status\n\nOn branch master\n\nChanged but not updated:\n  (use \"git add/rm\
  \ <file>...\" to update what will be committed)\n  (use \"git checkout -- <file>...\"\
  \ to discard changes in working directory)\n      deleted:     app/controllers/application_controller.rb\n\
  \nno changes added to commit (use \"git add\" and/or \"git commit -a\")\n```\n\n\
  我们在这里看到一个文件被删除了，但更改仅在“工作树”（working tree）上；它们还没有提交。这意味着仍然可以使用带有 `-f` 标志的 `checkout`\
  \ 命令强制覆盖当前更改来撤销这些更改：\n\n```bash\n$ git checkout -f\n\n$ git status\n# On branch\
  \ master\nnothing to commit (working directory clean)\n\n$ ls app/controllers/\n\
  application_controller.rb concerns/\n```\n\n丢失的文件和目录回来了。真松了一口气！\n\n#### 1.4.3 Bitbucket\n\
  \n现在我们已经将项目置于版本控制之下，是时候将代码推送到 Bitbucket 了。*Learn Enough Git to Be Dangerous* 使用\
  \ GitHub，但对安全日益增长的担忧使我建议*所有*仓库默认都应该是私有的。\n\n到目前为止，最流行的两个 Git 托管网站是 GitHub 和 Bitbucket。这两个服务有许多相似之处：它们都允许\
  \ Git 托管以及方便的搜索。重要的区别（从本教程的角度来看）是 GitHub 提供无限的免费仓库，但对超过一定人数的协作者收费，而 Bitbucket 允许无限免费仓库。\n\
  \n当然，可以安排安全地处理这些信息（例如通过让 Git 忽略它），但这很容易出错并且需要大量的专业知识。事实上，本教程中创建的示例应用程序是可以安全公开的，但通常依赖这一事实是危险的。\n\
  \n> 出现了第三家主要的托管公司，名为 GitLab。GitLab 最初主要设计为一种你自托管的开源 Git 工具，现在 GitLab 也提供了托管版本，实际上允许无限的公共和私有仓库。这使得\
  \ GitLab 成为未来项目 GitHub 或 Bitbucket 的极替代方案。\n\n开始使用 Bitbucket 非常简单，尽管可能需要一些技术技巧（[框\
  \ 1.1]）才能让一切运行良好：\n\n1. 如果你还没有 Bitbucket 账户，请注册一个。\n2. 将你的*公钥*复制到剪贴板。如列表 1.11 所示，云\
  \ IDE 用户可以使用 `cat` 命令查看其公钥，然后进行选择和复制。如果你在使用自己的系统并在运行列表 1.11 中的命令时没有看到输出，请按照说明向你的\
  \ Bitbucket 账户安装公钥。\n3. 点击右上角的头像图像并选择“Manage account”，然后选择“SSH keys”，将你的公钥添加到 Bitbucket（[图\
  \ 1.14]）。\n\n**列表 1.11:** 使用 cat 打印公钥。\n\n```bash\n$ cat ~/.ssh/id_rsa.pub\n```\n\
  \n\n\n\n一旦你添加了公钥，点击“Create”（创建）创建一个新仓库，如图 1.15 所示。在填写项目信息时，请确保“This is a private\
  \ repository”（这是一个私有仓库）旁边的框已勾选。点击“Create repository”（创建仓库）后，按照“Command line > I\
  \ have an existing project”（命令行 > 我有一个现有项目）下的指令操作，它看起来类似于列表 1.12。（如果看起来不像列表 1.12，可能是因为公钥没有添加正确，在这种情况下我建议重新尝试该步骤。）在推送仓库时，如果看到问题“Are\
  \ you sure you want to continue connecting (yes/no)?”（你确定要继续连接吗（yes/no）？），回答 yes。\n\
  \n![image](img/image01666.jpeg)\n\n**图 1.14:** 添加 SSH 公钥。\n\n![image](img/image02205.jpeg)\n\
  \n**图 1.15:** 在 Bitbucket 上创建第一个应用仓库。\n\n**列表 1.12:** 添加 Bitbucket 并推送仓库。\n\n点击此处查看代码图像\n\
  \n* * *\n\n```\n$ git remote add origin git@bitbucket.org:<username>/hello_app.git\n\
  \n$ git push -u origin --all\n```\n\n* * *\n\n列表 1.12 中的命令首先告诉 Git 你想将 Bitbucket\
  \ 添加为仓库的 `origin`（源），然后将你的仓库推送到远程源。（不用担心 `-u` 标志的作用；如果你好奇，可以在网络上搜索“git set upstream”。）当然，你应该将\
  \ `<username>` 替换为你的实际用户名。例如，我运行的命令是：\n\n点击此处查看代码图像\n\n```\n$ git remote add origin\
  \ git@bitbucket.org:railstutorial/hello_app.git\n```\n\n结果是 Bitbucket 上 hello_app\
  \ 仓库的页面，带有文件浏览、完整的提交历史以及许多其他功能（图 1.16）。19\n\n19。由于我在 Cloud9 上设置公钥的方式，我创建了名为 railstutorial\
  \ 的仓库，并将我的主账户 mhartl 添加为合作者。结果是我可以在任何一个账户下进行提交。\n\n#### 1.4.4 分支、编辑、提交、合并\n\n如果你遵循了节\
  \ 1.4.3 中的步骤，可能会注意到 Bitbucket 自动渲染了仓库的 README 文件，如图 1.16 所示。这个名为 `README.md` 的文件是由列表\
  \ 1.3 中的命令自动生成的。正如文件名扩展名 `.md` 所示，它是用 `Markdown` 编写的，20，这是一种易读的标记语言，旨在易于转换为 HTML——而这正是\
  \ Bitbucket 所做的。\n\n20。关于 Markdown 的更多信息，请参阅 *Learn Enough Text Editor to Be Dangerous*\
  \ 和 *Learn Enough Git to Be Dangerous*。\n\n![image](img/image01669.jpeg)\n\n**图\
  \ 1.16:** Bitbucket 仓库页面。\n\n![image](img/image02225.jpeg)\n\n**图 1.17:** Bitbucket\
  \ 对默认 Rails README 的渲染。\n\n这种对 README 的自动渲染非常方便，但当然，如果我们能针对当前项目定制文件内容，效果会更好。在本节中，我们将通过添加一些\
  \ Rails Tutorial 特有的内容来定制 README。在此过程中，我们将看到我推荐在 Git 中使用的“分支、编辑、提交、合并”工作流的第一个示例。21\n\
  \n21。为了方便地可视化 Git 仓库，请查看 Atlassian 的 SourceTree 应用。\n\n##### 分支\n\nGit 非常擅长创建 `branches`（分支），分支实质上是仓库的副本，我们可以在其中进行（可能是实验性的）更改而无需修改父文件。在大多数情况下，父仓库是\
  \ `master` 分支，我们可以通过带有 `-b` 标志的 `checkout` 创建新的主题分支：\n\n点击此处查看代码图像\n\n```\n$ git\
  \ checkout -b modify-README\n\nSwitched to a new branch 'modify-README'\n\n$ git\
  \ branch\n\n  master\n* modify-README\n```\n\n在这里，第二个命令 `git branch` 只是列出所有本地分支，星号\
  \ `*` 标识我们当前处于哪个分支。注意 `git checkout -b modify-README` 既创建了新分支又切换到了该分支，如 `modify-README`\
  \ 分支前的星号所示。列表 1.12 中的命令首先告诉 Git 你想将 Bitbucket 添加为仓库的 `origin`，然后将你的仓库推送到远程源。（不用担心\
  \ `-u` 标志的作用；如果你好奇，可以在网络上搜索“git set upstream”。）当然，你应该将 `<username>` 替换为你的实际用户名。例如，我运行的命令是：\n\
  \n点击此处查看代码图像\n\n```\n$ git remote add origin git@bitbucket.org:railstutorial/hello_app.git\n\
  ```\n\n结果是 Bitbucket 上 hello_app 仓库的页面，带有文件浏览、完整的提交历史以及许多其他功能（图 1.16）。19。由于我在 Cloud9\
  \ 上设置公钥的方式，我创建了名为 railstutorial 的仓库，并将我的主账户 mhartl 添加为合作者。结果是我可以在任何一个账户下进行提交。\n\n\
  \n\n\n点击此处查看代码图像\n\n```bash\n$ git branch -d modify-README\n```\n\n已删除分支 `modify-README`（之前的\
  \ `9dc4f64`）。\n\n这一步是可选的，事实上，保持主题分支（topic branch）完好是非常常见的。这样你可以在主题分支和 master 分支之间来回，每次在你达到自然的停止点时合并更改。\n\
  \n如上所述，你也可以放弃主题分支的更改，这时可以使用 `git branch -D`：\n\n点击此处查看代码图像\n\n# 仅用于插图说明；除非你搞乱了分支，否则不要这样做\n\
  \n```bash\n$ git checkout -b topic-branch\n$ <真的搞搞乱了分支>\n$ git add -A\n$ git commit\
  \ -a -m \"Make major mistake\"\n$ git checkout master\n$ git branch -D topic-branch\n\
  ```\n\n与 `-d` 标志不同，`-D` 标志即使在我们没有合并更改的情况下也会删除分支。\n\n## 推送 (Push)\n\n现在我们已经更新了 README，可以将更改推送到\
  \ Bitbucket 以查看结果。由于我们已经进行过一次推送 (章节 1.4.3)），在大多数系统中我们可以省略 `origin master`，直接运行 `git\
  \ push`：\n\n```bash\n$ git push\n```\n\n与默认 README 一样，Bitbucket 会很好地将更新后 README\
  \ 中的 Markdown 转换为 HTML (图 1.18）。\n\n![image](img/image01672.jpeg)\n\n**图 1.18：**\
  \ Bitbucket 上改进后的 README 文件。\n\n## 1.5 部署 (Deploying)\n\n尽管这只是第一章，我们已经准备将（几乎是空的）Rails\
  \ 应用部署到生产环境。这一步是可选的，但早期且频繁的部署允许我们在开发周期的早期发现任何部署问题。另一种替代方案——仅在开发环境中付出了大量努力并密封后才部署——通常会在发布时导致糟糕的集成头疼。²³\n\
  \n23。虽然对于 *Rails Tutorial* 中的示例应用来说这可能并不重要，但如果你担心不小心让应用过早公开，有几种选择；请参见 章节 1.5.4。\n\
  \n部署 Rails 应用曾是一件苦事，但 Rails 部署生态系统在过去几年里迅速成熟，现在有几个很棒的选择。这些包括运行 Phusion Passenger（一个用于\
  \ Apache 和 Nginx²⁴ 服务器的模块）的共享主机或虚拟服务器、Engine Yard 和 Rails Machine 等全服务部署公司，以及 Engine\
  \ Yard Cloud 和 Heroku 等云部署服务。\n\n24。读作“Engine X”。\n\n我最喜欢的 Rails 部署选项是 Heroku，这是一个专门为部署\
  \ Rails 和其他 Web 应用构建的托管平台。Heroku 让部署 Rails 应用变得极其简单——只要你的源代码受 Git 版本控制即可。（如果你还没有这样做，这是遵循\
  \ 章节 1.4 中 Git 设置步骤的另一个理由。）此外，对于许多用途（包括本教程），Heroku 的免费层绰绰有余。\n\n本节的其余部分将致力于我们的第一个应用部署到\
  \ Heroku。某些想法相当高级，所以不要担心理解所有细节；重要的是，在过程结束时，我们将把应用部署到实时网络上。\n\n#### 1.5.1 Heroku\
  \ 设置\n\nHeroku 使用 PostgreSQL 数据库（读作“post-gres-cue-ell”，通常简称为“Postgres”），这意味着我们需要在生产环境中添加\
  \ `pg` gem，以便 Rails 能够与 Postgres 通信：²⁵\n\n25。通常来说，让开发环境和生产环境尽可能匹配是一个好主意，包括使用相同的数据库，但为了本教程的目的，我们将在本地使用\
  \ SQLite，而在生产环境中使用 PostgreSQL。更多信息请参见第 3.1 节。\n\n点击此处查看代码图像\n\n```ruby\ngroup :production\
  \ do\n  gem 'pg', '0.18.4'\nend\n```\n\n还要确保包含 列表 1.5 中所做的更改，防止 `sqlite3` gem 被包含在生产环境中，因为\
  \ Heroku 不支持 SQLite：\n\n点击此处查看代码图像\n\n```ruby\ngroup :development, :test do\n  gem\
  \ 'sqlite3', '1.3.11'\n  gem 'byebug', '9.0.0', platform: :mri\nend\n```\n\n生成的\
  \ Gemfile 如 列表 1.14 所示。\n\n**列表 1.14：** 添加了内容的 Gemfile。\n\n\n\n\n\n没有第二步了！我们已经完成了。要查看您新部署的应用程序，请访问您运行\
  \ `heroku create` 时看到的地址（即 列表 1.15）。（如果你是在本地机器而非云端 IDE 上工作，也可以使用 `heroku open`。）结果显示在图\
  \ 1.19 中。该页面与图 1.11 相同，但现在它运行在实时网络上的生产环境中。\n\n![image](img/image01673.jpeg)\n\n\
  图 1.19：在 Heroku 上运行的第一个 Rails Tutorial 应用程序。\n\n## 练习\n\n购买任何 Rails Tutorial 后，均可在\
  \ railstutorial.org/aw-solutions 免费获取练习答案。查看他人的答案并记录自己的答案，请加入 learnenough.com/society\
  \ 的 Learn Enough Society。\n\n**1.** 通过与节 1.3.4 相同的更改，安排您的生产环境应用显示“hola, mundo!”。\n\
  \n**2.** 如如节 1.3.4 所示，安排根路由（root route）显示 goodbye 动作（action）的结果。在部署时，确认您可以在 `Git\
  \ push` 中省略 `master`，如 `git push heroku` 所示。\n\n#### 1.5.4 Heroku 命令\n\n有很多 Heroku\
  \ 命令，我们在本书中将仅仅触皮一角。让我们花一点时间通过如下重命名应用程序来展示其中一个命令：\n\n点击查看代码图片\n\n```\n$ heroku rename\
  \ rails-tutorial-hello\n```\n\n不要自己使用这个名字；它已经被我占用了！事实上，你现在可能不需要费心这一步；使用 Heroku 提供的默认地址即可。但如果你确实想重命名您的应用程序，可以使用随机或模糊的子域名来保持相当的安全性，例如：\n\
  \n`hwpcbmze.herokuapp.com`\n\n`seyjhflo.herokuapp.com`\n\n`jhyicevg.herokuapp.com`\n\
  \n使用这样的随机子域名，只有在你给他们地址时，他们才能访问您的网站。（顺便提一下，作为 Ruby 紧凑之美的预览，这里是我用于生成随机子域名的代码：\n\n\
  点击查看代码图片\n\n```\n('a'..'z').to_a.shuffle[0..7].join\n```\n\n非常酷。\n\n除了支持子域名外，Heroku\
  \ 还支持自定义域名。（事实上，Ruby on Rails Tutorial 网站就运行在 Heroku 上；如果你在线阅读这本书，你现在正在看的就是 Heroku\
  \ 托管的站点！）查看 Heroku 文档获取更多关于自定义域名和其他 Heroku 主题的信息。\n\n## 练习\n\n购买任何 Rails Tutorial\
