  \ 编辑失败\n\n在本节中，我们将处理编辑失败的情况，思路与注册失败类似（章节 7.3）。我们首先创建一个 `update` 动作，它使用 `update_attributes`\
  \ (章节 6.1.5) 根据提交的 `params` 哈希表来更新用户，如列表 10.8 所示。如果信息无效，更新尝试将返回 `false`，因此 `else`\
  \ 分支将渲染编辑页面。我们之前见过这种模式；其结构与 `create` 动作的第一版本非常相似（列表 7.18）。\n\n**列表 10.8:** 初始的用户\
  \ `update` 动作。\n\n```ruby\napp/controllers/users_controller.rb\n```\n点击此处查看代码图像\n\
  \n* * *\n\n```ruby\nclass UsersController < ApplicationController\n  def show\n\
  \    @user = User.find(params[:id])\n  end\n\n  def new\n    @user = User.new\n\
  \  end\n\n  def create\n    @user = User.new(user_params)\n    if @user.save\n \
  \     log_in @user\n      flash[:success] = \"Welcome to the Sample App!\"\n   \
  \   redirect_to @user\n    else\n      render 'new'\n    end\n  end\n\n  def edit\n\
  \    @user = User.find(params[:id])\n  end\n\n  def update\n    @user = User.find(params[:id])\n\
  \    if @user.update_attributes(user_params)\n    else\n      render 'edit'\n  \
  \  end\n  end\n\n  private\n\n  def user_params\n    params.require(:user).permit(:name,\
  \ :email, :password, :password_confirmation)\n  end\nend\n```\n\n* * *\n\n注意对 `user_params`\
