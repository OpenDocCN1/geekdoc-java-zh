  \n### 6.1.5 更新用户对象\n\n一旦创建了对象，通常想要更新它们。有两种基本方法。首先，我们可以单独分配属性，正如我们在 第 4.4.5 节 中做的那样：\n\
  \n点击查看代码图像\n\n```\n>> user             # 提醒一下用户的属性\n=> #<User id: 1, name: \"Michael\
  \ Hartl\", email: \"mhartl@example.com\", created_at: \"2016-05-23 19:05:58\", updated_at:\
  \ \"2016-05-23 19:05:58\">\n>> user.email = \"mhartl@example.net\"\n=> \"mhartl@example.net\"\
  \n>> user.save\n=> true\n```\n\n注意，最后一步对于将更改写入数据库是必要的。我们可以通过使用 `reload` 查看在不保存 时发生的情况，它根据数据库信息重新加载对象：\n\
  \n点击查看代码图像\n\n```\n>> user.email\n=> \"mhartl@example.net\"\n>> user.email = \"\
  foo@bar.com\"\n=> \"foo@bar.com\"\n>> user.reload.email\n=> \"mhartl@example.net\"\
  \n```\n\n现在我们已经通过运行 `user.save` 更新了用户，魔术列有所不同，正如 第 6.1.3 节 所承诺的：\n\n点击查看代码图像\n\n\
  ```\n>> user.created_at\n=> \"2016-05-23 19:05:58\"\n>> user.updated_at\n=> \"2016-05-23\
  \ 19:08:23\"\n```\n\n更新多个属性的第二种主要方法是使用 `update_attributes`：⁹\n\n`update_attributes`\
  \ 方法是短方法 `update` 的别名，但我更喜欢较长的版本，因为它与单数形式的方法 `update_attribute` 相似。\n\n点击查看代码图像\n\
  \n```\n>> user.update_attributes(name: \"The Dude\", email: \"dude@abides.org\"\
  )\n=> true\n>> user.name\n=> \"The Dude\"\n>> user.email\n=> \"dude@abides.org\"\
  \n```\n\n`update_attributes` 方法接受属性哈希，并在成功时一步到位地完成更新和保存（返回 `true` 表示保存已通过）。注意，如果任何验证失败，例如在保存记录时需要密码（如\
  \ 第 6.3 节 中实现），则对 `update_attributes` 的调用将失败。如果只需要更新单个属性，使用单数形式 `update_attribute`\
  \ 可以跳过此限制：\n\n点击查看代码图像\n\n```\n>> user.update_attribute(:name, \"El Dingo\")\n=>\
  \ true\n>> user.name\n=> \"El Dingo\"\n```\n\n### 9. [#part0015.xhtml_ich6en9]\n\
