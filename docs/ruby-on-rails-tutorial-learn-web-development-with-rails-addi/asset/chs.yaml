  \n#### 9.1.3 忘记用户\n\n为了允许用户注销，我们将定义忘记用户的方法，类比记住用户的方法。生成的 `user.forget` 方法只需通过将 remember\
  \ 摘要（digest）更新为 `nil` 来撤销 `user.remember`，如 [Listing 9.11] 所示。\n\n**Listing 9.11:**\
  \ 为 User 模型添加 `forget` 方法。**RED**\n\n`app/models/user.rb`\n\n点击此处查看代码图片\n\n***\n\
  \n```ruby\nclass User < ApplicationRecord\n  attr_accessor :remember_token\n  before_save\
  \ { self.email = email.downcase }\n  VALID_EMAIL_REGEX = /\\A[\\w+\\.]+@[a-z\\d\\\
  -.]+\\.[a-z]+\\z/i\n  validates :email, presence: true, { maximum: 255 },\n    format:\
  \ { with: VALID_EMAIL_REGEX },\n    uniqueness: { case_sensitive: false }\n  has_secure_password\n\
  \  validates :password, presence: true, { minimum: 6 }\n\n  # 返回给定字符串的哈摘要。\n  def\
  \ self.digest(string)\n    cost = ActiveModel::SecurePassword.min_cost ? BCrypt::Engine::MIN_COST\
  \ : BCrypt::Engine.cost\n    BCrypt::Password.create(string, cost: cost)\n  end\n\
  \n  # 返回随机令牌。\n  def self.new_token\n    SecureRandom.urlsafe_base64\n  end\n\n\
  \  # 在数据库中记住用户以供持久会话使用。\n  def remember\n    self.remember_token = User.new_token\n\
  \    update_attribute(:remember_digest, User.digest(remember_token))\n  end\n\n\
  \  # 如果给定令牌与摘要匹配返回 true。\n  def authenticated?(remember_token)\n    BCrypt::Password.new(remember_digest).is_password?(remember_token)\n\
  \  end\n\n  # 忘记用户。\n  def forget\n    update_attribute(:remember_digest, nil)\n\
  \  end\nend\n```\n\n有了 [Listing 9.11] 中的代码，我们现在准备好通过添加 `forget` 辅助方法并在 `log_out`\
  \ 辅助方法调用它来忘记持久会话（[Listing 9.12]）。如 [Listing 9.12] 所示，`forget` 辅助方法调用 `user.forget`\
  \ 然后删除 `user_id` 和 `remember_token` cookie。\n\n**Listing 9.12:** 从持久会话注销。**RED**\n\
  \n`app/helpers/sessions_helper.rb`\n\n点击此处查看代码图片\n\n***\n\n```ruby\nmodule SessionsHelper\n\
  \  # 登录给用户。\n  def log_in(user)\n    session[:user_id] = user.id\n  end\n\n  .\n\
  \n  .\n\n  # 忘记持久会话。\n  def forget(user)\n    user.forget\n    cookies.delete(:user_id)\n\
  \    cookies.delete(:remember_token)\n  end\n\n  # 注销当前用户。\n  def log_out\n    forget(current_user)\n\
  \    session.delete(:user_id)\n    @current_user = nil\n  end\nend\n```\n\n***\n\
