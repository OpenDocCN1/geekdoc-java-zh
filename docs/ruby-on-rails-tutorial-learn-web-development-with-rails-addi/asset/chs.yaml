  \n**列表 3.16：** `RED`\n\n点击此处查看代码图像\n\n```bash\n$ rails test\n3 tests, 2 assertions,\
  \ 0 failures, 1 errors, 0 skips\n```\n\n### 3.3.3 绿色\n\n现在我们已经有了一个失败的测试（`RED`），我们将利用失败测试的错误信息来引导我们获得通过的测试（`GREEN`），从而实现一个工作的\
