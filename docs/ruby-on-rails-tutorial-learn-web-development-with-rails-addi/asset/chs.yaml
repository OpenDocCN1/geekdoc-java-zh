  \ 方法，验证用户对应的记忆令牌和激活令牌。\n\n#### 11.3.2 激活 `edit` \n\n有了列表 11.26 中的 `authenticated?`\
  \ 方法，我们现在准备好编写一个 `params` 中电子邮件地址的 `edit` 方法。我们的测试将如下所示：\n\n点击此处查看代码图片\n\n```ruby\n\
