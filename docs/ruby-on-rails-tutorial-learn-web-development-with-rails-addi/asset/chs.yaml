  \n#### 4.2.4 方法定义\n\n控制台允许我们以类似于 3.8 或 4.2 的方式定义方法。（在控制台中定义方法有点麻烦，通常你会使用文件，但为了演示很方便）。例如，让我们定义一个函数\
  \ `string_message`，它接收一个参数，并根据参数是否为空返回一条消息：\n\n点击此处查看代码图片\n\n```\n>> def string_message(str\
  \ = '')\n>> if str.empty?\n>> \"It's an empty string!\"\n>> else\n>> \"The string\
  \ is nonempty.\"\n>> end\n>> end\n=> :string_message\n\n>> puts string_message(\"\
  foobar\")\nThe string is nonempty.\n\n>> puts string_message(\"\")\nIt's an empty\
  \ string!\n\n>> puts string_message\nIt's an empty string!\n```\n\n正如最后一个例子所示，我们可以省略参数（这时也可以省略括号）。这是因为代码\n\
  \n```ruby\ndef string_message(str = '')\n```\n\n包含一个*默认*参数，在这个例中是空字符串。这使得 `str`\
  \ 参数是可选的，如果我们省略它，它会自动获取给定的默认值。\n\n注意 Ruby 函数有*隐式返回*，这意味着它们返回最后被求值的语句——在本例中，是两个消息字符串之一，取决于方法的参数\
  \ `str` 是否为空。Ruby 也有显式返回选项，以下函数与上面的等价：\n\n```ruby\ndef string_message(str = '')\n\
  \  return \"It's an empty string!\" if str.empty?\n```\n\n\n\n\n\n```ruby\nreturn\
  \ \"The string is nonempty.\"\nend\n```\n\n（细心的读者此时可能会注意到，这里的第二个 `return` 实际上是没必要的——作为函数的最后一个表达式，无论是否使用\
  \ `return` 关键字，字符串 `\"The string is nonempty.\"` 都会被返回，但在两个地方都使用 `return` 具有一种令人愉目的对称美。）\n\
  \n同样重要的一点是，对于调用者来说，函数参数的名称并不重要。换句话说，上面的第一个示例可以将 `str` 替换为任何有效的变量名，例如 `the_function_argument`，它的工作效果也是完全一样的：\n\
  \n点击此处查看代码图片\n\n```ruby\ndef string_message(the_function_argument = '')\n  if the_function_argument.empty?\n\
