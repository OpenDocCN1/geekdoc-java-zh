  ![图 12.1](img/image023.png)\n**图 12.1：** 密码重置。\n\n#### 12.3.2 更新重置\n\n与将“非激活”切换为“激活”的账户激活不同，密码重置的\
  \ `edit` 方法是一个表单，因此我们必须考虑四种情况：\n\n1. 重置过期\n2. 因密码无效导致更新失败\n3. 因密码为空导致更新失败\n4. 更新成功\n\
  \n情况 (1)、(2) 和 (4) 比较简单直接，但 (3) 并不显而易见。情况 (1) 适用于 `edit` 和 `update` 动作：\n\n点击此处查看代码图片\n\
  \n```ruby\nbefore_action :check_expiration, only: [:edit, :update]\n```\n\n在 `check_expiration`\
  \ 方法中，我们将检查推迟到了 `password_expired?` 方法，该方法有点复杂，我们将在稍后定义。情况 (2) 由 `valid_user` 过滤器处理：\n\
  \n点击此处查看代码图片\n\n```ruby\n# 确认用户有效。\ndef valid_user\n  unless ( @user && @user.activated?\
  \ &&\n          @user.authenticated?( :reset, params[:id]))\n    redirect_to root_url\n\
  \  end\nend\n```\n\n情况 (2) 未由 列表 10.13 中的 `User` 模型处理，因此需要显式地捕获并处理。我们的方法是使用 `errors.add`\
  \ 直接向 `@user` 对象添加错误信息：\n\n点击此处查看代码图片\n\n```ruby\n@user.errors.add(:password, \"\
  can't be empty\")\n```\n\n我们只需要处理密码为空的情况，如果确认为空，确认验证（密码为空时跳过）将捕捉问题并提供相关的错误。\n\n\
  将情况 (1)-((4) 组合的结果就是 列表 12.16 所示的 `update` 动作。\n\n```ruby\n# 检查令牌过期。\ndef check_expiration\n\
  \  if @user.password_expired?\n    flash[:danger] = \"Password reset expired.\"\n\
  \    redirect_to root_url\n  end\nend\n```\n\n### 12.16 更新动作\n\n**列表 12.16：** 用于重置密码的\
  \ `update` 动作。\n\n```ruby\nclass PasswordResetsController < ApplicationController\n\
  \  before_action :get_user, only: [:edit, :update]\n  before_action :valid_user,\
  \ only: [:edit, :update]\n  before_action :check_expiration, only: [:edit, :update]\n\
  \n  def new\n  end\n\n  def create\n    @user = User.find_by(email: params[:password_reset][:email].downcase)\n\
  \    if @user\n      @user.create_reset_digest\n      @user.send_password_reset_email\n\
  \    end\n  end\nend\n```\n\n\n\n\n\n```ruby\nflash[:info] = \"Email sent with password\
  \ reset instructions\"\nredirect_to root_url\nelse\n  flash.now[:danger] = \"Email\
  \ address not found\"\n  render 'new'\nend\nend\n\ndef edit\nend\n\ndef update\n\
  \  if params[:user][:password].empty? # 情况 (3)\n    @user.errors.add(:password,\
  \ \"can't be empty\")\n    render 'edit'\n  elsif @user.update_attributes(user_params)\
  \ # 情况 (4)\n    log_in @user\n    flash[:success] = \"Password has been reset.\"\
  \n    redirect_to @user\n  else\n    render 'edit' # 情况 (2)\n  end\nend\n\nprivate\n\
  \ndef user_params\n  params.require(:user).permit(:password, :password_confirmation)\n\
  end\n\n# 前置过滤器\ndef get_user\n  @user = User.find_by(email: params[:email])\nend\n\
  \n# 确认用户有效。\ndef valid_user\n  unless (@user && @user.activated? && @user.authenticated?(:reset,\
  \ params[:id]))\n    redirect_to root_url\n  end\nend\n\n# 检查重置令牌是否过期。\ndef check_expiration\n\
  \  if @user.password_reset_expired?\n    flash[:danger] = \"Password reset has expired.\"\
  \n    redirect_to new_password_reset_url\n  end\nend\nend\n```\n\n注意，我们添加了一个 `user_params`\
  \ 方法，允许允许密码和密码确认属性（Section 7.3.2）。\n\n如上所述，Listing 12.16 中的实现通过以下代码将密码重置是否过期的布尔测试委托给\
  \ `User` 模型：\n\n```ruby\n@user.password_reset_expired?\n```\n\n为了让这段代码工作，我们需要定义\
  \ `password_reset_expired?` 方法。正如 Section 12.2.1 中的邮件模板所示，如果密码重置是在两小时前发送的，我们认为密码重置已过期，这在\
  \ Ruby 中可以表示为：\n\n```ruby\nreset_sent_at < 2.hours.ago\n```\n\n如果你将 `<` 理解为“小于”，这可能会令人困惑，因为听起来像是“密码重置少于两小时”，这与我们要求的相反。在这种语境下，将\
  \ `<` 理解为“早于”更好，它的意思类似于“密码重置时间早于两小时前”。这*恰是*我们想要的，并且它导致了 Listing 12.17 中 `password_reset_expired?`\
  \ 方法的产生。（需对该比较是正确的正式证明，请参阅 Section 12.6 中的证明。）\n\n### Listing 12.17: 为 User 模型添加密码重置方法\n\
  app/models/user.rb\n```ruby\nclass User < ApplicationRecord\n  # 如果密码重置已过期，返回 true。\n\
  \  def password_reset_expired?\n    reset_sent_at < 2.hours.ago\n  end\n\n  private\n\
  end\n```\n\n有了 Listing 12.17 中的代码，Listing 12.16 中的 `update` 动作应该可以正常工作。无效提交和有效提交的结果分别显示在\
  \ Figure 12.12 和 Figure 12.13 中。（由于没有耐心等待两个小时，我们将在测试中涵盖第三种分支，该分支被留作练习：Section 12.3.2））\n\
