  \ 12 章的材料共同构建了一个完整的 Rails 登录和认证系统。如你所知，Rails 有各种预构建的认证解决方案；框 6.1 解释了为什么至少在最初，自己实现可能是一个更好的主意。\n\
  \n**框 6.1：构建自己的认证系统**\n\n几乎所有的 Web 都需要某种形式的登录和认证系统。因此，大多数框架都有很多选择，Rails 也不例外。认证系统的示例包括\
  \ Clearance、Devise 和 CanCan（以及 OpenID 或 OAuth）。质疑我们为什么要重造轮子是合理的。一方面，经验表明，修改第三方产品往往比自己写更有工作；此外，现成系统可能是“黑盒”，内部未知；当你自己编写时，更容易理解它。\n\
  \n## 6.1 用户模型\n\n虽然接下来三章的最终目标是制作注册页面（如图 6.1 所示），但现在接受信息意义不大：我们还没有地方存放它们。因此，注册用户的第一步是创建一个捕捉并存储信息的数据结构。\n\
  \n在 Rails 中，模型的默认数据结构自然地被称为*模型*（来自第 1.3.3 节中的 MVC）。Rails 对持久问题的默认解决方案是使用*数据库*进行长期存储，而与数据库交互的默认库是\
  \ `Active Record`。¹(#part0015.xhtml_6en1) Active Record 提供了许多创建、保存和查找数据的方法，而无需使用关系型数据库的结构化查询语言（`SQL`）²(#part0015.xhtml_6en2)。此外，Rails\
  \ 有一个名为 `migrations`（迁移）的功能，允许用纯 Ruby 数据定义，而无需学习数据定义语言（DDL）。效果是 Rails 几乎完全隔离了数据库细节。在本书中，通过在开发中使用\
  \ SQLite 并在部署时通过 Heroku 使用 PostgreSQL（第 1.5 节），我们进一步深化了这一主题，以至于几乎不需要考虑 Rails 如何存储数据。\n\
  \n¹ 该名称源于 Martin Fowler 在《企业应用架构模式》中识别并命名的“活动记录模式”。\n\n² 读音为“ess-cue-ell”，尽管另一种读音“sequel”也很常见。你可以通过不定冠词的选择来区分作者的偏好：写“a\
  \ SQL database”的人倾向“sequel”，而写“an SQL database”的人倾向“ess-cue-ell”。正如你很快会看到的，我倾向于后者。\n\
  \n\n\n\n\n#### 6.1.1 数据库迁移\n\n你可能记得在第 4.4.5 节中，我们已经通过自定义的 `User` 类遇到过具有 `name` 和\
  \ `email` 属性的用户对象。该类是一个很有用的示例，但它缺乏关键的*持久化*属性：当我们在 Rails 控制台中创建一个 `User` 对象时，一旦退出，它就消失了。我们在这一节的目标是创建一个不会那么容易消失的用户模型。\n\
  \n与第 4.4.5 节中的 `User` 类一样，我们将从开始对一个具有两个属性的用户进行建模：一个 `name` 和一个 `email` 地址，后者我们将用作唯一的用户名。[³]3.（我们将在第\
  \ 6.3 节中添加密码属性）。在列表 4.17 中，我们使用 Ruby 的 `attr_accessor` 方法实现了这一点：\n\n3.通过使用电子邮件地址作为用户名，我们为未来与用户通信提供了可能（第\
  \ 11 节和第 12 节）。\n\n点击此处查看代码\n\n```ruby\nclass User\n  attr_accessor :name, :email\n\
  \  .\n  .\n  .\nend\n```\n\n相反，当使用 Rails 为用户建模时，我们不需要显式地标识属性。如上面简单提到的，为了存储数据，Rails\
  \ 默认使用关系型数据库，它由由数据*行*组成的*表*组成，每行都有对应数据属性的*列*。例如，为了存储具有名称和电子邮件地址的用户，我们将创建一个带有 `name`\
  \ 和 `email` 列的 `users` 表（每行对应一个用户）。此类表的示例出现在图 6.2 中，对应于图 6.3 所示的数据模型。（图 6.3 只是一个草图；完整的数据模型出现在图\
  \ 6.4 中。）通过将列命名为 `name` 和 `email`，我们将让 Active Record 为我们推出 User 对象的属性。\n\n你可能记得在列表\
  \ 5.38 中，我们使用命令创建一个 Users 控制器（以及一个 `new` action）：\n\n点击此处查看代码\n\n```bash\n$ rails\
  \ generate controller Users new\n```\n\n![image](img/image01091.jpeg)\n\n**图 6.2：**\
  \ `users` 表中的示例数据图。\n\n![image](img/image01092.jpeg)\n\n**图 6.3：** User 数据模型的草图。\n\
  \n用于创建模型的对应命令是 `generate model`，我们可以用它生成一个具有 `name` 和 `email` 属性的 User 模型，如列表 6.1\
  \ 所示。\n\n**列表 6.1：** 生成 User 模型。\n\n点击此处查看代码\n\n```bash\n$ rails generate model\
  \ User name:string email:string\n```\n\n（注意与控制器的复数命名约定不同，模型的名称是单数的：*Users* 控制器，但\
  \ *User* 模型。）通过传递可选参数 `name:string` 和 `email:string`，我们告诉 Rails 我们想要的属性以及这些属性的类型（在本例中为\
  \ `string`）。将其与列表 3.6 中包含 action 名称进行对比。\n\n列表 6.1 中 `generate` 命令的结果是一个称为*迁移*（migration）的文件。迁移提供了更改数据库的方法。在列表\
  \ 6.2 的情况下，`change` 决定了对数据库进行的更改。\n\n**列表 6.：** 用于的迁移..00000000000000______..\n\n\
  点击此处查看代码\n\n```ruby\nclass CreateUsers < ActiveRecord::Migration[5.0]\n  def change\n\
  \    create_table :users do |t|\n      t.string :name\n      t.string :email\n \
  \     t.timestamps\n    end\n  end\nend\n```\n\n\n\n\n（你可能还记得我们在第 2.2 节类似的语境下运行过该命令。）第一次运行\
  \ `db:migrate` 时，它会创建一个名为 `db/development.sqlite3` 的文件，这是一个 SQLite⁵ 数据库。我们可以通过 DB\
  \ Browser for SQLite 打开 `development.sqlite3` 来查看数据库结构。（如果你正在使用云 IDE，应该先将数据库文件下载到本地磁盘，如图\
  \ 6.5](#part0015.xhtml_fig6_5)所示。）结果将出现在图 6.6 中；将此与图 6.4 中的图表进行对比。你可能会注意到图 6.6 中有一列在迁移文件中没有体现：`id`\
  \ 列。正如第 2.2 节中简要提到的，该列是自动创建的，并被 Rails 用于唯一标识每一行。\n\n5. 官方读音为“ess-cue-ell-ite”，尽管（错误的）读音“sequel-ite”也很常见。\n\
  \n### 练习题\n\n购买任何 Rails Tutorial 均可在 railstutorial.org/solutions 免费获取练习题解答。要查看他人的答案并记录自己的答案，请加入\
  \ learnenough.com/society 上的 Learn Enough Society。\n\n1. Rails 使用 `db/` 目录下一个名为\
  \ `schema.db` 的文件来跟踪数据库结构（称为 *schema*，因此文件名也如此）。请检查你本地的 `db/schema.rb` 副本，并将其内容与代码列表\
  \ 6.2 中的迁移代码进行对比。\n\n2. 大多数迁移（包括本教程中的所有迁移）都是*可逆的*，这意味着我们可以通过名为 `db:rollback` 的单一命令进行“向下迁移”并撤销它们：\n\
  \n```bash\n$ rails db:rollback\n```\n\n运行此命令后，检查 `db/schema.rb` 以确认回滚成功。（请参见方框 3.1\
  \ 了解另一种用于撤销迁移的技巧。）在底层，此命令执行 `drop_table` 命令从数据库中删除 users 表。这之所以有效，是因为 `change` 方法知道\
  \ `drop_table` 是 `create_table` 的逆操作，这意味着可以推断出回滚迁移。对于不可逆的迁移（例如删除数据库列的迁移），需要定义单独\
  \ `up` 和 `down` 方法，而不是单一的 `change` 方法。阅读 Rails Guides 中关于迁移的内容获取更多信息。\n\n3. 再次执行\
  \ `rails db:migrate` 重新迁移。确认 `db/schema.rb` 的内容已恢复。\n\n![image](img/image01095.jpeg)\n\
