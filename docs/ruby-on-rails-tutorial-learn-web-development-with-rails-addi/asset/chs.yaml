  而不是那样写，效果是一样的，但是（正如在第 5.3.4 节中简要提到的），`assert_equal` 参数的常规顺序是 `expected`、`actual`：\n\
  \n点击此处查看代码\n\n```ruby\nassert_equal <expected>, <actual>\n```\n\n在列表 9.31 的情况下，这给得到的是：\n\
  \n点击此处查看代码\n\n```ruby\nassert_equal @user, current_user\n```\n\n使用列表 9.31 中的代码，测试如要求所示显示为\
