  \ 键，仅使用：\n\n点击此处查看代码图片\n\n```ruby\nhas_many :followers, through: :passive_relationships\n\
  ```\n\n这是因为在 `:followers` 属性的情况下，Rails 会将“followers”变为单数，并在这种情况下自动查找外键 `follower_id`。Listing\
  \ 14.12 保留了 `:source` 键是为了强调与 `has_many :following` 关联的并行结构。\n\n\n\n\n\n我们可以使用 `followers.include?`\
  \ 方法方便地测试上述数据模型，如 列表 14.13 所示。（列表 14.13 可能使用过 `followed_by?` 方法来补充 `following?`\
  \ 方法，但事实证明我们在应用中并不需要它。）\n\n**列表 14.13:** 对 `followers` 的测试。**绿色**。\n\n`test/models/user_test.rb`\n\
  \n点击此处查看代码图片\n\n```ruby\nrequire 'test_helper'\n\nclass UserTest < ActiveSupport::TestCase\n\
