  • Code School：多种交互式课程\n\n#### 14.4.2 本章学了什么\n\n• Rails `has_many :through` 允许建模复杂的数据关系。\n\
  • `has_many` 方法接受多个可选参数，包括对象类名和外键。\n• 通过正确选择类名和外键，使用 `has_many` 和 `has_many :through`\
  \ 可以建模主动（关注）和被动（被关注）的关系。\n• Rails 支持嵌套路由。\n• `where` 方法是创建查询的一种灵活方式。\n•整合我们在书中学到的所有知识，我们成功实现了用户关注。\n\
