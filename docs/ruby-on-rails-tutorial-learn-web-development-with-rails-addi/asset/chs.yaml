  \ 的特殊测试方法是可以行的。在测试内部，你可以通过 `assigns` 配合相应的符号来访问控制器中定义的*实例*变量。例如，如果 `create` 动作定义了一个\
  \ `@user` 变量，我们可以在测试中使用 `assigns (:user)` 来访问它。目前，Sessions 控制器的 `create` 动作定义了一个名为\
