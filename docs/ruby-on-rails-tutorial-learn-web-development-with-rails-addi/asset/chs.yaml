  \n## 2.3.3 User has_many microposts\n\nRails 最强大的功能之一是建立关联的能力。对于 `User` 模型，我们可以使用\
  \ `has_many` 关联来表示一个用户有多个微帖。我们可以在 Listing 2.14 和 Listing 2.15 中表达这种关系。\n\n**Listing\
  \ 2.14：** User has_many microposts。\n\n```ruby\napp/models/user.rb\nclass User <\
  \ ApplicationRecord\n  has_many :microposts\nend\n```\n\n**Listing 2.15：** Micropost\
  \ belongs_to user。\n\n```ruby\napp/models/micropost.rb\nclass Micropost < ApplicationRecord\n\
  \  belongs_to :user\nend\n```\n\n我们通过代码 `first_user.microposts` 访问用户的微帖。通过这段代码，Active\
  \ Record 会返回所有 `user_id` 等于 `first_user` id（在此例中为 `1`）的微帖。我们将在第 13 章和第 14 章中学习更多关于\
  \ Active Record 关联功能的内容。\n\n\n\n\n\n## 8. 与“Ctrl-C”一样，大写的“D”指的是键盘上的按键，而不是大写字母，因此你不需要在按下\
