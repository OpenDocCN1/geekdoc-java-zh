  \ 8.2 节\n\n2. 我们也可以使用用户的 id，因为它已经暴露在应用程序的 URL 中，但使用邮箱地址更具前瞻性，以防我们出于某种原因想要混淆用户 id（例如，防止竞争对手知道我们的应用程序有多少用户）。\n\
