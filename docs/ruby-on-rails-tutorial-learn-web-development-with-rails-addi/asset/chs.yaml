  **图 3.4:** 一个自定义的帮助页。\n\n### 3.3 开始测试\n\n在我们为示例应用程序创建并填充了首页和帮助页之后（章节 3.2.2），现在我们还要添加一个“关于”页面。在进行此类更改时，编写一个*自动化测试*来验证功能是否正确实现是一个良好实践。在构建应用程序的过程中，生成的*测试套件*既充当了安全网，又作为应用程序源代码的可执行文档。如果操作得当，编写测试虽然需要额外的代码，但允许我们开发得*更快*，因为我们最终花在追踪\
  \ bug 方面的时间会更少。不过，这只有在我们精通编写测试后才成立，这也是为什么尽早开始练习至关重要原因之一。\n\n尽管几乎所有的 Rails 开发者都同意测试是一个好主意，但在细节上存在着不同的意见。对于测试驱动开发（TDD）7）。\n\
  \n7. 例如，参见 Rails 创建者 David Heinemeier Hansson 写的“TDD 已经死去，测试万岁”。\n\n***\n\n####\
  \ Box 3.3: 何时测试\n\n在决定何时以及如何测试时，理解*为什么要*测试是有帮助的。在我看来，编写自动化测试有三个主要优点：\n\n1. 测试可以防止*回归*，即某个运行正常的功能由于某些原因停止工作。\n\
  2. 测试允许我们更有信心地对代码进行*重构*（即在不改变功能的情况下改变其形式）。\n3. 测试充当应用程序代码的*客户端*，从而帮助确定其设计以及与系统其他部分的接口。\n\
  \n虽然上述任何优点都*并不要求必须先编写测试*，但在许多情况下，测试驱动开发（TDD）都是你工具箱中一个非常有价值的工具。决定何时以及如何测试在一定取决于你对编写测试的熟悉程度；许多开发者发现，随着编写测试水平的提高，他们更倾向于先写测试。它还取决于测试相对于应用程序代码的难度、所需功能的精确程度，以及该功能在未来损坏的概率。\n\
  \n在这种背景下，拥有一套关于何时应该先测试（或进行测试）的指南将很有帮助。以下是基于我个人经验的一些建议：\n\n* 当测试与它测试的应用代码相比特别短或简单时，倾向于先写测试。\n\
  * 当预期的行为还不清晰时，倾向于先编写应用程序代码；然后编写测试来规范结果。\n* 因为安全性是首要任务，请倾向于先编写安全模型的测试。\n* 每当发现 bug\
  \ 时，编写一个测试来重现它并防止回归，然后编写应用程序代码修复它。\n* 避免对未来可能变化的代码（如详细的 HTML 结构）编写测试。\n* 在重构代码之前编写测试，重点测试容易出错且特别可能崩溃的代码。\n\
  \n在实践中，上述指南意味着我们通常会先写控制器和模型测试，然后是集成测试（模型测试（从第 6 章开始），集成测试（从第 7 章开始）。集成测试特别强大，因为它允许我们模拟用户使用网络浏览器与应用程序交互的动作。集成测试将成为我们主要的测试技术，但控制器测试为我们提供了一个更容易的起点。\n\
  \n***\n\n#### 3.3.1 我们的第一个测试\n\n现在是为我们的应用程序添加一个“关于”页面了。正如我们将看到的，测试既短又简单，因此我们将遵循\
  \ Box 3.3 中的指南先编写测试。然后我们将使用失败的测试来驱动应用程序代码的编写。\n\n开始测试可能是具有挑战性的，需要对 Rails 和 Ruby\
  \ 有广泛知识。在早期阶段，编写测试可能看起来令人望而生畏。幸运的是，Rails 已经为我们完成了最困难的部分，因为 `rails generate controller`\
  \ 自动生成了一个测试文件让我们开始：\n\n```bash\n$ ls test/controllers/static_pages_test.rb\n```\n\
  \n让我们来看它（Listing 3.13）。\n\n**Listing 3.13:** Static Pages 的默认测试。**绿色**\n\n```ruby\n\
  require 'test_helper'\n\nclass StaticPagesControllerTest < ActionDispatch::IntegrationTest\n\
  \  test \"should get home\" do\n    get static_pages_home_url\n    assert_response\
  \ :success\n  end\n\n  test \"should get help\" do\n    get static_pages_help_url\n\
  \    assert_response :success\n  end\nend\n```\n\n此时，详细地理解 Listing 3.13 中的语法并不重要，但我们可以看到有两个测试，对应于\
  \ Listing 3.6 中命令行包含的每个控制器动作。每个测试只需获取一个 URL 并（通过断言*）验证结果是否成功。这里 `get` 的使用表明我们期望首页和帮助页是使用\
  \ GET 请求访问的普通网页（Box 3.2）。响应 `:success` 是底层 HTTP 状态码的抽象表示（在此情况下为 200 OK）。换句话说，像这样的测试：\n\
  \n```ruby\ntest \"should get home\" do\n  get static_pages_home_url\n  assert_response\
  \ :success\nend\n```\n\n是在说：“让我们通过向 Static Pages 的 home URL 发送一个 GET 请求来测试首页，然后确保我们收到了‘成功’状态码。”\n\
  \n为了开始我们的测试循环，我们需要运行测试套件以验证测试当前通过。我们可以按照如下方式使用 `rails` 命令：\n\n**Listing 3.14:**\
  \ **绿色**\n\n```bash\n$ rails test\n2 tests, 2 assertions, 0 failures, 0 errors,\
  \ 0 skips\n```\n\n\n\n\n按照要求，我们的测试套件最初是可以通过的（`GREEN`）。（除非你添加了可选第 3.6.1 节中的 minittest\
  \ reporters，否则你实际上看不到绿色，但即使不涉及字面颜色，这些术语也是通用的。）在某些系统上，测试启动可能需要较长时间，这是由于两个因素造成的：(1)\
  \ 启动 `Spring server` 以预加载 Rails 环境的部分内容，这只会在第一次运行时发生；以及 (2) Ruby 启动时间相关的开销。（当按照第\
  \ 3.6.2 节建议使用 `Guard` 时，第二个因素会得到缓解。）\n\n### 3.3.2 红色\n\n如框 3.3 所示，测试驱动开发涉及首先编写一个失败的测试，然后编写使该测试通过所需的应用程序代码，必要时对代码进行重构。因为许多测试工具用红色表示失败的测试，用绿色表示通过的测试，所以这一序列有时被称为“红、绿、重构”循环。在本节中，我们将完成此循环的第一步，通过编写一个失败的测试进入\
  \ `RED` 状态。然后我们将在第 3.3.3 节中进入 `GREEN`，并在第 3.4.3 节中重构。⁸\n\n8. 默认情况下，`rails test`\
  \ 在测试失败时显示红色，但在测试通过时不显示绿色。要实现真正的红-绿循环，请参见第 3.6.1 节。\n\n我们的第一步是 About 页面编写一个失败的测试。遵循列表\
  \ 3.13 中的模型，你可能已经猜出了正确的测试，它在列表 3.15 所示。\n\n**列表 3.15：** About 页面的测试。`RED`\n\n`test/controllers/static_pages_controller_test.rb`\n\
  \n点击此处查看代码图像\n\n```ruby\nrequire 'test_helper'\n\nclass StaticPagesControllerTest\
  \ < ActionDispatch::IntegrationTest\n  test \"should get home\" do\n    get static_pages_home_url\n\
  \    assert_response :success\n  end\n\n  test \"should get help\" do\n    get static_pages_help_url\n\
  \    assert_response :success\n  end\n\n  test \"should get about\" do\n    get\
