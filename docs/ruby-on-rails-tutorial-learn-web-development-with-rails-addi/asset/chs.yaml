  1. 注册 Amazon Web Services 账户。\n2. 通过 AWS 身份和访问管理 `(IAM)` 创建用户并记录访问密钥（access key）和密钥（secret\
  \ key）。\n3. 使用 AWS 控制台创建一个 S3 存储桶（名称可自定），然后为上一步创建的用户授予读写权限。\n\n你可能会发现设置 S3 是一项在技术上具有挑战性的练习（框\
  \ 1.1）；对于上述步骤的更多细节，请参阅 S3 文档²⁴（如有必要，咨询 Google 或 Stack Overflow）。\n\n24. aws.amazon.com/documentation/s3\n\
  \n一旦你创建并配置了 S3 账户，你应该按照列表 13.70 所示创建并填充 `CarrierWave` 配置。*注意*：如果你的设置不起作用，可能是区域（region）的问题。某些用户可能需要在\
  \ fog 凭据中添加 `:region => ENV['S3_REGION']`，然后在命令行执行 `heroku config:set S3_REGION=<bucket\
  \ region>`，其中存储桶区域应该是类似于 `'eu-central-1'` 的内容，取决于你的位置。要确定正确的区域，请参考 Amazon 的区域和端点列表。\n\
