  \ 7.23）在成功注册后显示了一条友好的 flash 消息，包括为 `success` 类提供的漂亮绿色样式，该样式来自 Section 5.1.2 中的 Bootstrap\
  \ CSS 框架。然后，在刷新用户显示页面后，flash 消息如承诺般消失了（Figure 7.24)）。\n\n![image](img/image1554.jpeg)\n\
