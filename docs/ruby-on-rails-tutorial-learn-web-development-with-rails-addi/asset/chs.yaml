  >\n    <li><a href=\"#\">Home</a></li>\n    <li><a href=\"#\">Help</a></li>\n  \
  \  <li><a href=\"#\">Log in</a></li>\n  </ul>\n</nav>\n```\n\n这些将是返回给浏览器的文本。布局的最后一部分是用于主内容的\
  \ `div`：\n\n[点击此处查看图片]\n\n```html\n<div class=\"container\">\n  <%= yield %>\n</div>\n\
  ```\n\n与之前一样，`container` 类对 Bootstrap 有特殊含义。正如我们在[第 3.4.3 节]中学到的，`yield` 方法将每个页的内容插入站点中。除了我们将在[第\
  \ 5.1.3 节]中添加的页脚外，我们的布局现在已经完成，我们可以访问首页来查看结果。为了利用即将推出的样式，我们将在 `home.html.erb` 视图中添加一些额外的元素（代码列表\
  \ 5.2]）。\n\n**代码列表 5.2：** 带有注册页面链接的首页。\n`app/views/static_pages/home.html.erb`\n\
  \n[点击此处查看图片]\n\n```html\n<div class=\"center jumbotron\">\n  <h1>Welcome to the\
  \ Sample App</h1>\n  <h2>This is the home page for the <a href=\"http://www.railstutorial.org/\"\
  >Ruby on Rails</a> application.</h2>\n  <%= link_to \"Sign up now!\", '#', class:\
  \ \"btn btn-lg-primary\" %>\n</div>\n<%= link_to image_tag(\"rails.png\", alt: \"\
  Rails logo\"), 'http://rubyonrails.org/' %>\n```\n\n为了在[第 7 章]中为我们的站点添加用户，第一个 `link_to`\
  \ 创建了一个格式如下的存根链接：\n\n[点击此处查看图片]\n\n```html\n<a href=\"#\" class=\"btn btn-lg-primary\"\
  >Sign up now!</a>\n```\n\n在 `div` 标签中，`jumbotron` CSS 类对 Bootstrap 有特殊含义，注册按钮中的\
  \ `btn`、`btn-lg` 和 `btn-primary` 类也是如此。第二个 `link_to` 展示了 `image_tag` 辅助方法，它接收图像路径和一个可选的选项哈希作为参数，在本例中使用符号设置图像标签的\
  \ `alt` 属性。为了使此起作用，需要一个名为 `rails.png` 的图像，你应该从 Rails Tutorial 网站 http://railstutorial.org/rails.png\
  \ 下载并将其放在 `app/assets/images/` 目录中。[6.] 如果你使用的是云 IDE 或其他类 Unix 系统，可以使用 `curl` 工具完成此操作，如[代码列表\
  \ 5.3]所示。（有关 `curl` 的更多信息，请参阅《学会足够的命令行变得危险》。）\n\n[6.] 该图像实际上是旧的 Rails 标志，但新的是一个缩缩矢量图形（SVG）图像，不太适用于我们目前的目的。\n\
  \n**代码列表 5.3：** 下载图像。\n\n```bash\n$ curl -o app/assets/images/rails.png -OL railstutorial.org/rails.png\n\
  ```\n\n\n\n\n\n点击此处查看代码图片\n\n<img alt=\"Rails logo\" src=\"/assets/rails-9308b8f92fea4c19a3a0d8385b494526.png\"\
  \ />\n\n在这里，字符串 `9308b8f92fea4c19a3a0d8385b494526`（在你的系统中会有所不同）由 Rails 添加，以确保文件名唯一，这使得浏览器在图片更新后能够正确加载（而不是从浏览器缓存中检索）。注意，`src`\
  \ 属性并不包含 `images`，而是使用对所有资源（图像、JavaScript、CSS 等）通用的 `assets` 目录。在服务器上，Rails 将 `assets`\
  \ 目录中的图像与正确的 `app/assets/images` 目录关联，但对于浏览器而言，所有资源看起来都位于同一个目录中，这使得它们提供得更快。同时，`alt`\
  \ 属性是在页面由无法显示图片的程序访问（例如用于视障人士的屏幕阅读器）时显示的内容。\n\n至于图 5.2 所示的结果，它看起来可能有点平淡。不过，幸运的是，我们为\
  \ HTML 元素提供了合理的类（classes），这为我们使用 CSS 为网站添加样式奠定了良好的基础。\n\n### 练习题\n\n购买任何 Rails Tutorial\
