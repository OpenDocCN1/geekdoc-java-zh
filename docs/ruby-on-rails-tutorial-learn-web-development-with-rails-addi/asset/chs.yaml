  \ 和 `@email` *实例变量*，这些变量在第 2.2.2 节和第 3.4.2 节中简要提到过。在 Rails 中，实例变量的主要性是它们在视图中自动可用，但通常它们用于在整个\
  \ Ruby 类中需要的变量。（稍后我们将对此进行更多说明。）实例变量始终以 `@` 符号开头，并在未定义时为 `nil`。\n\n第一个方法 `initialize`\
  \ 在 Ruby 中是特殊的：它是当我们执行 `User.new` 时调用的方法。这个特定的 `initialize` 取一个参数 `attributes`：\n\
  \n点击此处查看代码图片\n\n```ruby\ndef initialize(attributes = {})\n  @name  = attributes[:name]\n\
  \  @email = attributes[:email]\nend\n```\n\n在这里，`attributes` 变量有一个等于空哈希的*默认值*，这样我们就可以定义一个没有名称或电子邮件地址的用户。（回想第\
  \ 4.3.3 节，哈希对于不存在的键会返回 `nil`，因此如果没有 `:name` 键，`attributes[:name]` 将为 `nil`，`attributes[:email]`\
