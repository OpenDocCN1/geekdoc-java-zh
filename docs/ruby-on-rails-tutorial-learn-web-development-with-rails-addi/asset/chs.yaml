  \n#### 14.1.4 被关注的用户\n\n现在来到关联的核心：`following` 和 `followers`。在这里我们将第一次使用 `has_many\
  \ :through`：如图 14.7 所示，一个用户通过关系拥有许多关注关系。默认情况下，在 `has_many :through` 关联中，Rails 寻找与关联单数形式对应的外键。换句话说，对于如下代码：\n\
  \n```\nhas_many :followeds, through: :active_relationships\n```\n\nRails 会看到 \"\
  followeds\" 并使用单数的 \"followed\"，利用 `relationships` 表中的 `followed_id` 组集合。但正如第 14.1.1\
  \ 节所述，`user.followeds` 相当生硬，因此我们将改为 `user.following`。自然地，Rails 允许我们覆盖默认值，在此情况下使用\
  \ `source` 参数（如列表 14.8 所示），它显式地告诉 Rails `following` 数组的来源是 `followed` id 集合。\n\n\
  **列表 14.8:** 为 User 模型添加 `following` 关联。\n\napp/models/user.rb\n\n```\nclass User\
  \ < ApplicationRecord\n  has_many :microposts, dependent: :destroy\n  has_many :active_relationships,\
  \ class_name: \"Relationship\",\n                           foreign_key: \"follower_id\"\
  ,\n                           dependent: :destroy\n  has_many :following, through:\
  \ :active_relationships, source: :followed\n  has_many :followers, through: :active_relationships,\
  \ source: :follower\nend\n```\n\n\n\n\n\n点击此处查看代码图片\n\n```ruby\nclass User < ApplicationRecord\n\
  \  has_many :microposts, dependent: :destroy\n  has_many :active_relationships,\
  \ class_name: \"Relationship\",\n                              foreign_key: \"follower_id\"\
  ,\n                              dependent: :destroy\n  has_many :following, through:\
  \ :active_relationships, source: :followed\nend\n```\n\n列表 14.8 中定义的关联导致了 Active\
  \ Record 与类数组行为的强大结合。例如，我们可以使用 `include?` 方法检查被关注的用户集合是否包含另一个用户（详参 Section 第 4.3.1\
  \ 节），或者通过关联查找对象：\n\n点击此处查看代码图片\n\n```ruby\nuser.following.include?(other_user)\n\
  user.following.find(other_user)\n```\n\n虽然在许多语境下我们可以有效地将 `following` 视为数组，但 Rails\
  \ 在底层处理这些方面非常智能。例如，如下代码：\n\n点击此处查看代码图片\n\n```ruby\nfollowing.include?(other_user)\n\
  ```\n\n看起来似乎需要从数据库中提取所有被关注的用户才能应用 `include?` 方法，但实际上为了提高效率，Rails 会安排直接在数据库中进行比较。（对比\
  \ Section 第 13.2.1 节 中的代码，我们在那里看到）\n\n```ruby\nuser.microposts.count\n```\n\n为了操作关注关系，我们将引入\
  \ `follow` 和 `unfollow` 工具方法，这样我们就可以编写例如 `user.follow(other_user)` 之类的代码。我们还将添加一个关联的\
  \ `following?` 布尔方法，以测试一个用户是否正在关注另一个用户。⁶\n\n6. 中。\n\n**列表 14.9：** 某些“关注”工具方法的测试。**红色**\n\
  \ntest/models/user_test.rb\n\n点击此处查看代码图片\n\n```ruby\nrequire 'test_helper'\nclass\
  \ UserTest < ActiveSupport::TestCase\n  test \"should follow and unfollow a user\"\
  \ do\n    michael = users(:michael)\n    archer = users(:archer)\n    assert_not\
  \ michael.following?(archer)\n    michael.follow(archer)\n    assert michael.following?(archer)\n\
  \    michael.unfollow(archer)\n    assert_not michael.following?(archer)\n  end\n\
  end\n```\n\n通过参考 Table 14.1 中的方法，我们可以使用与 `following` 的关联编写 `follow`、`unfollow` 和\
  \ `following?` 方法，如 Listing 14.10 所示。（注意我们有一个用户 `self` 变量。）\n\n**列表 14.10：** 用于关注的工具方法。**绿色**\n\
  app/models/user.rb\n\n点击此处查看代码图片\n\n```ruby\nclass User < ApplicationRecord\n  def\
  \ feed\n  end\n\n  # 关注一个用户。\n  def follow(other_user)\n    active_relationships.create(followed_id:\
  \ other_user.id)\n  end\n\n  # 取消关注一个用户。\n  def unfollow(other_user)\n    active_relationships.find_by(followed_id:\
  \ other_user.id).destroy\n  end\n\n  # 如果当前用户正在关注另一个，则返回 true。\n  def following?(other_user)\n\
  \    following.include?(other_user)\n  end\n\n  private\nend\n```\n\n有了 Listing\
  \ 14.10 中的代码，测试应该是**绿色**的：\n\n**列表 14.1：** `绿色`\n\n```bash\n$ rails test\n```\n\n\
