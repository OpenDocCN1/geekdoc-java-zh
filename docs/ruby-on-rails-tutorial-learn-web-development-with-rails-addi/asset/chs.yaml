  \n因为列表 9.24 中定义的 `log_in_as` 辅助方法会自动设置 `session[:user_id]`，所以在集成测试中测试 `current_user`\
  \ 方法的“记住”分支很难。幸运的是，我们可以通过在 Sessions 测试中直接测试 `current_user` 方法来绕过这个限制，我们需要先创建该文件：\n\
  \n点击此处查看代码图片\n\n```bash\n$ touch test/helpers/sessions_helper_test.rb\n```\n\n测试步骤非常简单：\n\
  \n1. 使用固件定义 `user` 变量。\n2. 调用 `remember` 方法记住该用户。\n3. 验证 `current_user` 是否等于给定的用户。\n\
  \n因为 `remember` 方法没有设置 `session[:user_id]`，此过程将测试我们需要的“记住”分支。测试结果出现在列表 9.31 中。\n\
  \n**列表 9.31：** 持久会话的测试。\n\n```ruby\ntest/helpers/sessions_helper_test.rb\n```\n\
  点击此处查看代码图片\n\n```ruby\nrequire 'test_helper'\n\nclass SessionsHelperTest < ActionView::TestCase\n\
  \  def setup\n    @user = users(:michael)\n    remember(@user)\n  end\n\n  test\
  \ \"current_user 在 session 为空时返回正确用户\" do\n    assert_equal @user, current_user\n\
  \    assert is_logged_in?\n  end\nend\n```\n\n\n\n\n```ruby\ntest \"current_user\
  \ returns nil when remember digest is wrong\" do\n  @user.update_attribute(:remember_digest,\
