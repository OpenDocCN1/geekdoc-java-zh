  \n我们现在来到示例应用程序的高潮：微博客的状态动态。恰恰，本节包含了整个教程中一些最高级的内容。完整的状态动态基于第 13.3.3 节 中的原始动态流（proto-feed），它通过汇集当前用户关注的所有用户的微博客数组，以及当前用户自身的微博客来构建的。在本节中，我们将通过一系列复杂程度递增的动态实现来实现。为了实现这一点，我们需要一些相当高级的\
  \ Rails、Ruby 甚至 SQL 编程技术。\n\n由于后续有繁重的工作，回顾我们要去的地方将尤为重要。图 14.5 中所示最终状态动态的摘要再次出现在图\
  \ 14.21 中。\n\n![image](img/image01386.jpeg)\n\n**图 14.21：** 带有状态动态的用户首页原型图。\n\n\
