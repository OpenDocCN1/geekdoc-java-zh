  \n增加了密码重置功能后，我们示例应用程序的注册、登录和注销机制已经完整且达到了专业级。剩下的 *Ruby on Rails*^™ *Tutorial* 将在此基础上构建一个具有类似\
  \ Twitter 的微博文功能的站点（第 13 章）以及来自关注用户的状态动态流（第 14 章）。在此过程中，我们将学习 Rails 一最强大的功能，包括图片上传、自定义数据库查询以及使用\
  \ `has_many` 和 `has_many :through` 的高级数据建模。\n\n#### 12.5.1 本章我们学到了什么\n\n- 就像 Session\
  \ 和账户激活一样，尽管密码重置不是 ActiveRecord，也可以被建模为一个资源。\n- 密码重置使用了 Action。\n- 密码重置使用了实例变量。\n\
  - 密码重置使用了生成的令牌。\n- 密码重置使用了唯一令牌。\n- 密码重置使用了哈希令牌。\n- 密码重置使用了 SendGrid。\n- 密码重置使用了环境变量。\n\
  \n### 12.6 过期证明\n\n我们在第 12.3 节 中看到，判断密码过期的比较是 `reset_sent_at < 2.hours.ago`，如列表\
  \ 12.17 所示。这看起来可能读像是“小于两小时”，这与我们的目标相反。在本节中，我们将证明上述是正确的。\n\n我们首先定义两个时间间隔。令 `\\Delta\
  \ t[r]` 为自发送重置以来，`\\Delta t[te]` 为过期限制（例如两小时）。如果自发送重置以来超过了过期限制，则密码重置过期：\n\n`\\Delta\
  \ t[r] > \\Delta t[te]`\n\n如果我们将现在的时间写为 `t[N]`，重置发送时间写为 `t[r]`，过期时间写为 `te`（例如两小时前），则有：\n\
  \n`\\Delta t[r] = t[N] - t[r]`\n\n`\\Delta t[te] = t[N] - te`\n\n将 (12.2) 和 (12.3)\
  \ 代入 (12.1) 得到：\n\n`\\Delta t[r] > \\Delta t[te]`\n\n`t[N] - t[r] > t[N] - te`\n\
  \n`-t[r] > -te`\n\n在同边乘以 -1 后产生：\n\n`t[r] < te`\n\n\n\n\n\n在开发核心示例应用程序的过程中，我们现在遇到了四种资源——用户、会话、账户激活和密码重置——但只有第一种资源由数据库中表的\
  \ Active Record 模型提供支持。现在是时候添加第二种这样的资源了：用户*微贴*（microposts），它们是与特定用户关联的短消息。¹ 我们首次在第\
  \ 2 章中看到幼体阶段的微贴，在本章中我们将通过以下方式将第 2.3 节中的草图完善为完整版本：通过构建 `Micropost` 数据模型，使用 `has_many`\
  \ 和 `belongs_to` 方法将其与 `User` 模型关联，然后创建操作和显示结果所需的表单和部分视图（包括在第 13.4 节中的上传图片）。在第 14\
  \ 章中，我们将通过引入*关注*用户的概念来完成微型 Twitter 克隆项目，以便接收他们微贴的*动态*（feed）。\n\n1. 这个名字的灵感源于对 Twitter\
  \ 作为*微博客*的描述；既然博客有帖子，微博客就应该有微贴。\n\n### 13.1 微贴模型\n\n我们通过创建一个 `Micropost` 模型来开始微贴资源，该模型捕捉了微贴的核心特征。接下来的内容基于第\
  \ 2.3 节中的工作；与该节中的模型一样，我们新的 `Micropost` 模型将包含数据校验以及与 `User` 模型的关联。与该模型不同，现在的 `Micropost`\
  \ 模型将经过完全测试，并且当父级用户被删除时，将具有默认的*排序*和自动*删除*机制。\n\n如果你正在使用 Git 进行版本控制，我建议在此时创建一个主题分支：\n\
  \n点击此处查看代码图片\n\n```\n$ git checkout -b user-microposts\n```\n\n#### 13.1.1 基础模型\n\
  \n`Micropost` 模型只需要两个属性：用于存储微贴内容的 `content` 属性，以及用于将微贴与特定用户关联的 `user_id` 属性。结果是一个结构如图\
  \ 13.1 所示的 `Micropost` 模型。\n\n值得注意的是，图 13.1](#part0022.xhtml_fig13_1)中的模型使用了 `text`\
  \ 数据类型处理微贴内容（而不是 `string`），它能够存储任意数量的文本。尽管内容将被限制在 140 个字符以内（第 13.1.2 节），因此本可以放入\
  \ 255 字符的 `string` 类型中，但使用 `text` 能更好地表达微贴的本质，因为微贴更自然地被视为文本块。事实上，在第 13.3.2 节中，我们将使用文本*区域*（area）而不是文本字段来提交微贴。此外，使用\
  \ `text` 让我们在未来想要增加长度限制时（例如作为国际化的一部分具有更大的灵活性。最后，使用 `text` 类型在生产环境中不会产生性能差异，²](#part0022.xhtml_ch13en2)，因此我们在这里使用它没有任何成本。\n\
  \n2. [www.postgresql.org/docs/9.1/static/datatype-character.html](http://www.postgresql.org/docs/9.1/static/datatype-character.html)\n\
  \n![image](img/image02311.jpeg)\n\n**图 13.1:** 微贴数据模型。\n\n与 `User` 模型的情况类似（列表 6.1），我们使用\
  \ `generate model`（列表 13.1）生成 `Micropost` 模型。\n\n**列表 13.1:** 生成 Micropost 模型。\n\
  \n点击此处查看代码图片\n\n```\n$ rails generate model Micropost content:text user:references\n\
  ```\n\n此迁移导致了如列表 13.2 所示的 `Micropost` 创建。除了像常一样继承自 `ApplicationRecord`（节 6.1.2 ）外，生成的模型还包含一行指示，表明微贴*属于*（belongs_to）一个用户，这是列表\
  \ 13.1](#part0022.xhtml_list13_1)中使用 `user:references` 参数的结果。我们将探讨这一行的影响。\n\n**列表\
  \ 13.2:** 生成的 Micropost 模型。\n`app/models/micropost.rb`\n\n```ruby\nclass Micropost\
  \ < ApplicationRecord\n  belongs_to :user\nend\n```\n\n`generate model` 命令（列表 13.1）产生了如列表\
  \ 13.2](#part0022.xhtml_list13_2)所示的 `Micropost` 模型，并产生了一个创建 `microposts` 表的迁移。与节\
  \ 6.1 相比，最大的区别是使用了 `references`，它会自动添加 `user_id` 列。与 `User` 模型一样，`Micropost` 模型包含了\
  \ `created_at` 和 `updated_at`，如图 13.1 所示。3. 外键是一种数据库级约束，表明 `microposts` 表中的 `user_id`\
  \ 指向 `users` 表中的 `id` 列。这一细节在教程中并不重要，并不是所有数据库都支持外键。（我们在生产环境使用的是 PostgreSQL。）我们将在第\
  \ 14 章中学习更多关于外键的知识。\n\n**列表 13.3:** 带索引的 Micropost 迁移。\n`db/migrate/[timestamp]_create_microposts.rb`\n\
  \n```ruby\nclass CreateMicroposts < ActiveRecord::Migration[5.0]\n  def change\n\
  \    create_table :microposts do |t|\n      t.text :content\n      t.references\
  \ :user, foreign_key: true\n      t.timestamps\n    end\n    add_index :microposts,\
  \ [:user_id, :created_at]\n  end\nend\n```\n\n通过将 `user_id` 和 `created_at` 列作为数组包含，我们让\
  \ Rails 创建一个*复合索引*，这意味着 Active Record 同时使用*两个*键。通过列表 13.3](#part0022.xhtml_list13_3)中的迁移，我们可以像往一样更新数据库：\n\
  \n```\n$ rails db:migrate\n```\n\n##### 练习\n\n练习答案可以在购买任何 Rails Tutorial 后在 railutorial.org/solutions\
  \ 免费获取。要查看别人的答案并记录自己的答案，请加入 learnenough.com 的 Learn Enough Society。\n\n1. 在控制台中使用\
  \ `Micropost.new` 实例化一个名为 `micropost` 的新微贴对象，内容为“Lorem ipsum”，user id 等于数据库中第一个用户的\
  \ id。魔力列 `created_at` 和 `updated_at` 的值是什么？\n\n2. 对于上一个练习中的微贴，`micropost.user` 是什么？`micropost.user.name`\
  \ 又什么？\n\n3. 将微贴保存到数据库。现在魔力列的值是多少？\n\n\n\n\n现在我们已经创建了基础模型，并将添加一些验证来强制执行所需的设计约束。Micropost\
  \ 模型的一个必要方面是必须存在 `user_id`，以指示哪个用户发布了该微贴。实现此点的符合习惯的方法是使用 Active Record *关联*（associations），我们将在第\
  \ 13.1.3 节中实现，但目前我们将直接操作 `Micropost` 模型。\n\n初始的 micropost 测试与 User 模型的测试并行（如列表 6.7](#part0015.xhtml_list6_7)所示）。在\
  \ `setup` 步骤中，我们创建一个新的 micropost，同时将其与来自固件（fixtures）的有效用户关联，然后检查该结果是否有效。由于每个 micropost\
  \ 都应该有一个 `user_id`，我们将为 `user_id` 的存在性验证添加一个测试。将这些元素组合在一起，就得到了列表 13.4 中的测试代码。\n\n\
  **列表 13.4：** 新 micropost 的有效性测试。**绿色**\n\n```\ntest/models/micropost_test.rb\n\n\
  点击此处查看代码图片\n\n***\n\nrequire 'test_helper'\n\nclass MicropostTest < ActiveSupport::TestCase\n\
  \  def setup\n    @user = users(:michael)\n    # # 这段代码不符合习惯。\n    @micropost =\
  \ Micropost.new(content: \"Lorem ipsum\", user_id: @user.id)\n  end\n\n  test \"\
  should be valid\" do\n    assert @micropost.valid?\n  end\n\n  test \"user id should\
  \ be present\" do\n    @micropost.user_id = nil\n    assert_not @micropost.valid?\n\
  \  end\nend\n```\n\n正如 `setup` 方法中的注释所示，创建 micropost 的代码并不符合习惯，我们将在第 13.1.3 节中修复它。\n\
  \n与原始的 User 模型测试（列表 6.5](#part0015.xhtml_list6_5）一样，列表 13.4 中的第一个测试仅仅是健全检查，但第二个测试是对\
