  \ Web 界面\n\n章节 14.1 对我们的数据建模能力提出了相当高的要求，如果花费一些时间来消化也是正常的。事实上，理解关联关系的最好方法之一就是在 Web\
  \ 界面中使用它们。\n\n在本章的引言中，我们预览了用户关注的页面流程。在本节中，我们将实现这些原型图中所示的基础界面以及关注/取消关注功能。我们还将创建单独的页面来显示用户关注的（following）数组和粉丝（followers）数组。在\
  \ 章节 14.3 中，我们将通过添加用户状态动态来完成我们的示例应用程序。\n\n#### 14.2.1 示例关注数据\n\n与之前的章节一样，我们发现使用\
  \ `rails db:seed` 在数据库中填充示例关系是方便的。这允许我们先设计网页的样式和感受，将后端功能推迟到本节稍后的部分。\n\n填充关注关系的代码出现在\
  \ 列表 14.14 中。在这里，我们相当任意地安排第一个用户关注 3 到 51 号用户，然后让 4 到 41 号用户反关该用户。生成的关系足够开发应用程序界面。\n\
  \n**列表 14.14:** 向示例数据中添加关注/粉丝关系。\n\n`db/seeds.rb`\n\n点击此处查看代码图片\n\n```ruby\n# Users\n\
  User.create!(name:  \"Example User\",\n             email: \"example@railstutorial.org\"\
