  \ 3.4.3 布局（Layouts）与嵌入 Ruby\n\n在这一节之前，我们已经通过控制器和动作完成了大量工作，但它们是静态 HTML，因此无法展示 Rails\
  \ 的威力：\n\n- 页面标题几乎（但并不完全）相同。\n- “Ruby on Rails Tutorial Sample App”在每个页面上重复。\n-\
  \ 整个 HTML 骨架都在重复。\n\n这违反了“不要重复”（DRY）原则；在本节中，我们将通过消除重复来重构代码。最后，我们将通过重新运行 Section\
  \ 3.4 中的测试来验证标题是正确的。\n\n与其矛盾的是，我们将通过首先添加一些内容迈出消除重复的第一步：这种技术涉及到在视图中使用嵌入 Ruby。由于 Home、Help\
  \ 和 About 页面的标题非常相似，我们将使用一个名为 `provide` 的特殊 Rails 函数为每个页面设置不同的标题。我们可以通过替换 `home.html.erb`\
  \ 中的字面量“Home”来了解这种方法，使其*完全*匹配。\n\n**Listing 3.31：** 带有嵌入 Ruby 标题的 Home 页面视图。**绿色**\n\
  \n`app/views/static_pages/home.html.erb`\n\n点击此处查看代码图像\n\n```html\n<% provide(:title,\
  \ \"Home\") %>\n<!DOCTYPE html>\n<html>\n<head>\n    <title><%= yield(:title) %>\
  \ | Ruby on Rails Tutorial Sample App</title>\n</head>\n<body>\n    <h1>Sample App</h1>\n\
  \    <p>\n      This is the home page for the\n      <a href=\"http://www.railstutorial.org/\"\
  >Ruby on Rails Tutorial</a>\n      sample application.\n    </p>\n</body>\n</html>\n\
  ```\n\nListing 3.31 是我们的嵌入 Ruby 示例，也称为 ERb。（现在你知道为什么 HTML 视图扩展名是 `.erb` 了）。ERb 是在网页中包含动态内容的主要模板系统。13\n\
  \n`<% provide(:title, \"Home\") %>`\n\n使用 `<% %>` 表示 Rails 应该调用 `provide` 函数并将字符串\
  \ `\"Home\"` 与标签 `:title` 关联。然后，标题中，我们使用密切相关的符号 <%= ... %>` 通过 Ruby 的 `yield` 函数将标题插入模板中：^(14\n\
  \n14 经验丰富的 Rails 开发者可能期望在此处使用 `content_for`，但它与资源管道配合得并不良好。`provide` 函数是它的替代品。 15\
  \ 如果你以前学过 Ruby，你可能会怀疑 Rails 正在向块*产生*（yielding）内容，你的直觉是正确的。但使用 Rails 开发应用程序并不需要这一点。\n\
  \n\n\n\n两种嵌入式 Ruby 类型的区别在于 `<% ... %>` 执行其内部的代码，而 `<%= ... %>` 则执行代码并将结果插入到模板中。生成的页面与之前完全相同，现在标题的变量部分是由\
  \ ERb 动态生成的。\n\n我们可以通过运行来自 第 3.4.2 节 中的测试来验证这一切运行正常工作，并看到它们仍然是 `GREEN`：\n\n**列表\
  \ 3.32：`GREEN`**\n\n点击此处查看代码图像\n\n***\n\n```\n$ rails test\n3 tests, 6 assertions,\
  \ 0 failures, 0 errors, 0 skips\n```\n\n***\n\n然后我们可以对帮助（Help）和关于（About）页面进行相应的替换（列表\
  \ 3.33 和 列表 3.34）。\n\n**列表 3.33：** 带有嵌入 Ruby 标题的帮助页视图。**GREEN**\n\n`app/views/static_pages/help.html.erb`\n\
  \n点击此处查看代码图像\n\n***\n\n```html\n<% provide(:title, \"Help\") %>\n<!DOCTYPE html>\n\
