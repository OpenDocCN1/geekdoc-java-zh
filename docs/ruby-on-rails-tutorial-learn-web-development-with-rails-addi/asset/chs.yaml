  \ 的 Learn Enough Society。\n\n**1.** 运行 `heroku help` 查看 Heroku 命令列表。显示应用日志的命令是什么？\n\
  \n**2.** 使用在上一个练习中识别的命令检查您的应用程序上的活动。最近的事件是什么？（此命令在调试生产应用时通常有用。）\n\n## 1.6 总结\n\n\
  我们在本章中取得了长远的进展：安装、开发环境搭建、版本控制和部署。在下一章中，我们将基于第 1 章 的基础，构建一个由数据库支持的*玩具应用**toy app*），这将让我们第一次真正体验到\
  \ Rails 能做什么。\n\n如果你想在此阶段分享你的进度，可以发送此类推文或 Facebook 状态更新：\n\n我在通过 @railstutorial\
  \ 学习 Ruby on Rails！\n\n[`www.railstutorial.org/`](http://www.railstutorial.org/)\n\
  \n我还建议你订阅 Rails Tutorial 邮件列表，27，这将确保你收到关于 *Ruby on Rails*™ *Tutorial* 的优先更新（以及独家优惠码）。\n\
  \n27. railstutorial.org/email\n\n### 1.6.1 我们在本章学到了什么\n\n- Ruby on Rails 是一个用 Ruby\
  \ 编程语言编写的 Web 开发框架。\n- 使用预配置的云环境，安装 Rails、生成应用程序以及编辑生成的文件非常简单。\n- Rails 自带一个名为 `rails`\
  \ 的命令行命令，可以生成新应用程序（`rails new`）并运行本地服务器（`rails server`）。\n- 我们添加了一个控制器动作（controller\
  \ action）并修改了根路由，创建一个“你好世界”应用程序。\n- 通过将应用程序源代码放在 Git 版本控制下，并将生成的代码推送到 Bitbucket\
  \ 的私有仓库，我们在启用协作的同时防止了数据丢失。\n- 我们使用 Heroku 将应用程序部署到生产环境中。\n\n## 第 2 章 一个玩具应用\n\n\
  在本章中，我们将开发一个玩具演示应用程序来展示 Rails 的某些威力。目的是展示 Rails 的某些功能。\n\n## 2.1 规划应用程序\n\n在本节中，我们将为玩具应用制定计划。如节\
  \ 1.3 所示，我们将使用特定版本的 `rails new` 生成应用程序：\n\n点击查看代码图片\n\n```\n$ cd ~/workspace\n$\
  \ rails 5.0.0 new toy_app\n$ cd toy_app\n```\n\n如果你使用的是如节 1.2 推荐的云 IDE，请注意第二个应用可以在同一个工作空间创建。没有必要创建新的工作空间。为了让文件显示，你可能需要点击文件导航器中的图标并选择“刷新树”。\n\
  \n接下来，我们将使用文本编辑器更新 Bundler 需要的 `Gemfile`，内容见列表 2.1。**重要提示：对于书中的所有 Gemfile，你应该使用\
  \ gemfiles-4th-ed.railstutorial.org 上的版本号，而不是下面列出的版本（如果你在线阅读，它们应该是相同的）。**\n\n列表\
  \ 2.1：玩具应用的 Gemfile。\n\n点击查看代码图片\n\n```ruby\n*\nsource 'https://rubygems.org'\n\n\
  gem 'rails', '5.0.0'\ngem 'puma', '3.4.0'\ngem 'sass-rails', '5.0.5'\ngem 'uglifier',\
  \ '3.0.0'\ngem 'coffee-rails', '4.2.1'\ngem 'jquery-rails', '4.1.1'\ngem 'turbolinks',\
  \ '5.0.0'\ngem 'jbuilder', '2.4.1'\n\ngroup :development, :test do\n  gem 'sqlite3',\
  \ '1.3.11'\n  gem 'byebug', '9.0.0', platform: :mri\nend\n\ngroup :development do\n\
  ```\n\n\n\n\n\n```ruby\ngem 'web-console', '3.1.1'\ngem 'listen', '3.0.8'\ngem 'spring',\
  \ '1.7.2'\ngem 'spring-watcher-listen', '2.0.0'\n\ngroup :production do\n  gem 'pg',\
  \ '0.18.4'\nend\n```\n\n# Windows 不包含 zoneinfo 文件，因此请包含 tzinfo-data gem\n\n```ruby\n\
  gem 'tzinfo-data', platforms: [:mingw, :mswin, :x64_mingw, :jruby]\n```\n\n请注意，列表\
  \ 2.1 与列表 1.14 相同。\n\n正如第 1.5.1 节 所示，我们将使用 `--without production` 选项安装本地 gems 的同时抑制生产环境\
  \ gems 的安装：\n\n点击此处查看代码图片\n\n```\n$ bundle install --without production\n```\n\n\
  如第 1.3.1 节 所述，你可能也需要运行 `bundle update`（框 1.1）。\n\n最后，我们将用 Git 对简易应用进行版本控制：\n\n点击此处查看代码图片\n\
  \n```bash\n$ git init\n$ git add -A\n$ git commit -m \"Initialize repository\"\n\
  ```\n\n你还应该点击 Bitbucket 上的“Create”按钮创建一个新仓库（图 2.1），然后推送到远程仓库：\n\n点击此处查看代码图片\n\n\
  ```bash\n$ git remote add origin git@bitbucket.org:<username>/toy_app.git\n$ git\
  \ push -u origin --all\n```\n\n最后，部署越越早越好，我建议按照第 1.3.4 节中所示的“hello, world!”步骤进行操作，如列表\
  \ 2.2 和列表 2.3 所示所示。\n\n**列表 2.2：** 为 Application controller 添加一个 `hello` action。\n\
  \napp/controllers/application_controller.rb\n\n点击此处查看代码图片\n\n```ruby\nclass ApplicationController\
  \ < ActionController::Base\n  protect_from_forgery with: :exception\n  def hello\n\
  \    render html: \"hello, world!\"\n  end\nend\n```\n\n![image](img/image01674.jpeg)\n\
  \n**图 2.1：** 在 Bitbucket 上创建简易应用仓库。\n\n**列表 2.3：** 设置根路由。\n\nconfig/routes.rb\n\n\
  点击此处查看代码图片\n\n```ruby\nRails.application.routes.draw do\n  root 'application#hello'\n\
  end\n```\n\n然后提交更改并推送到 Heroku：\n\n点击此处查看代码图片\n\n```bash\n$ git commit -am \"Add\
  \ hello\"\n$ heroku create\n$ git push heroku master\n```\n\n（如第 1.5 节 所示，你可能会看到一些警告信息，你现在应该忽略它们。我们将在第\
  \ 7.5 节中处理它们。）除了 Heroku 应用的 URL 外，结果应该与图 1.19 相同。）\n\n现在我们准备好编写应用本身了。制作 Web 应用的典型第一步是创建数据模型，它是应用程序所需结构的表示。在我们的情况下，这个简易应用将是一个\
  \ Twitter 风格的微博客，仅包含用户和短消息（微博文）。因此，我们将从应用的用户模型开始（第 2.1.1 节），然后添加一个微博文模型（第 2.1.2\
  \ 节）。\n\n#### 2.1.1 用户的简易模型\n\n由于网页上有不同的注册表单，用户数据模型有很多选择；为了简单起见，我们将采用极简方法。我们简易应用的用户将有一个名为\
  \ `id` 的唯一标识符（类型为 `integer`）、一个公开可见的 `name`（类型为 `string`）以及一个兼作用户名的 `email` 地址（类型同样为\
  \ `string`）。用户数据模型的摘要见图 2.2。\n\n正如我们将在第 6.1.1 节中看到的，图 2.2 中的标签 `users` 对应数据库中的一张表，而\
  \ `id`、`name` 和 `email` 属性是该表中的列。\n\n#### 2.1.2 微博文简易模型\n\n微博文数据模型的核心比用户模型还要简单：微博文仅有一个\
  \ `id` 和一个用于微博文文本的 `content` 字段（类型为 `text`）。不过还有一个复杂之处：我们希望将每个微博文与特定用户关联。我们将通过记录所有者的\
  \ `user_id` 来实现这一点。结果如图 2.3。\n\n![image](img/image01675.jpeg)\n\n**图 2.2：** 用户的数据模型。\n\
  \n![image](img/image01677.jpeg)\n\n**图 2.3：** 微博文的数据模型。\n\n我们将在第 2.3.3 节中（在第 13\
  \ 章中更详细地）看到此 `user_id` 属性如何让我们简洁地表达一个用户可能有许多条微博文的概念。\n\n### 2.2 Users 资源\n\n在本节中，我们将实现第\
  \ 2.1.1 节中的用户数据模型，并提供该模型的 Web 界面。这种组合将构成一个 Users 资源，让我们能够通过 HTTP 协议通过 Web 创建、读取、更新和删除用户。正如引言中所承诺，我们的\
  \ Users 资源将由 scaffold 生成器创建。我劝你不要仔细查看生成的代码；在现阶段只会困惑你。\n\nRails scaffolding 是通过向\
  \ `rails generate` 脚本传递 `scaffold` 命令生成的。`scaffold` 命令的参数是资源名的单数形式（在本例中为 `User`），以及数据模型属性的可选参数。scaffold\
  \ 的命名遵循模型的单数，而不是资源和控制器的复数。因此，我们得到的是 `User` 而不是 `Users`。\n\n点击此处查看代码图片\n\n```\n$\
  \ rails generate scaffold User name:string email:string\n```\n\n\n\n\n\n# 创建 app/assets/stylesheets/scaffolds.scss\n\
  \n通过包含 `name:string` 和 `email:string`，我们已经让 User 模型生成了图 2.2 所示的表单。（注意，不需要为 `id`\
  \ 包含参数；Rails 会自动创建它并作为数据库中的*主键*。）\n\n为了继续进行这个玩具级应用程序，我们首先需要使用 `rails db:migrate`\
  \ 来迁移（migrate）数据库，如列表 2.4 所示。\n\n## 列表 2.4：迁移数据库。\n\n点击此此处查看代码图片\n\n***\n\n```\n\
  $ rails db:migrate\n\n==  CreateUsers: migrating ====================================================\n\
  \n-- create_table(:users)\n    -> 0.0017s\n\n==  CreateUsers: migrated (0.0018s)\
  \ ===========================================\n```\n\n列表 2.4 的效果是使用我们的新 `users`\
  \ 数据模型更新数据库。（我们将在第 6.1.1 节开始学习更多关于数据库迁移的知识。）\n\n顺带一下，重要的是，在 Rails 5 之前的每个版本中，`db:migrate`\
  \ 命令都使用 `rake` 代替 `rails`，因此为了旧版应用，了解如何使用 Rake（框 2.1）是非常重要的。\n\n***\n\n## 框 2.1：Rake\n\
  \n在 Unix 传统中，*Make* 工具在从源代码构建可执行程序方面发挥着重要作用。*Rake* 是 *Ruby make*，一种用 Ruby 编写的、类似于\
  \ Make 的编译语言。\n\n在 Rails 5 之前，Ruby on Rails 广泛使用 Rake，因此为了旧版 Rails 应用，了解如何使用它非常重要。在\
  \ Rails 语境下，最常见的两个 Rake 命令可能是 `rake db:migrate`（用数据模型更新数据库）和 `rake test`（运行自动化测试套件）。在这些以及其他\
  \ `rake` 的用法中，确保命令使用的是与 Rails 应用的 `Gemfile` 对应的 Rake 版本非常重要，这是通过 Bundler 命令 `bundler\
  \ exec` 实现的。因此，迁移命令\n\n```\n$ rails db:migrate\n```\n\n将写为为\n\n```\n$ bundle exec\
  \ rake db:migrate\n```\n\n在运行列表 2.4 所示的迁移后，我们可以在单独的标签页中（图 1.7）如下运行本地 Web 服务器：\n\n\
  点击此处查看代码图片\n\n```\n$ rails server -b $IP -p $PORT    *# 如果本地运行，请使用 'rails server'.*\n\
  ```\n\n现在，玩具级应用程序应该如第 1.3.2 节所述在本地服务器上可用了。（如果你在使用云 IDE，请务必在新的*浏览器*标签页中打开生成的开发服务器，而不是在\
  \ IDE 内部。）\n\n#### 2.2.1 用户导览\n\n如果我们访问根 URL `/`（如第 1.3.4 节所示读作“斜杠”），我们将得到与图 1.11\
