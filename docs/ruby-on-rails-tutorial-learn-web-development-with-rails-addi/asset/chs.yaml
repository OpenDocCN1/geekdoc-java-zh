  \n### 激活令牌回调\n\n由于每个新注册的用户都需要激活，我们应该在创建每个用户对象之前，为它分配一个激活令牌和摘要。我们在第 6.2.5 节中见过类似的思路，在那个节中，我们需要在将用户保存到数据库之前将电子邮件地址转换为小写。在那种情况下，我们使用了\
  \ `before_save` 回调结合 `downcase` 方法（列表 6.32）。`before_save` 回调会在对象保存之前自动调用，这包含了对象的创建和更新，但在激活摘要的情况下，我们只希望在用户创建时触发回调。这需要一个\
  \ `before_create` 回调，我们将如下定义它：\n\n![image](img/image01251.jpeg)\n\n**图 11.1：** 添加了账户激活属性的\
  \ User 模型。\n\n点击此处查看代码图像\n\n```ruby\nbefore_create :create_activation_digest\n```\n\
  \n这段代码被称为*方法引用*（method reference），它安排 Rails 寻找一个名为 `create_activation_digest` 的方法并在创建用户之前运行它。（在列表\
  \ 6.32 中，我们为 `before_save` 传递了一个显式的块，但通常更倾向于使用方法引用技术。）因为 `create_activation_digest`\
  \ 方法本身仅供 `User` 模型内部使用，因此没有将其暴露给外部用户；正如我们在第 7.3.2 节中所见，Ruby 实现此点的方法是使用 `private`\
  \ 关键字：\n\n点击此处查看代码图像\n\n```ruby\nprivate\n  def create_activation_digest\n    #\
  \ 创建令牌和摘要。\n  end\n```\n\n在类中 `private` 之后定义的所有方法都会自动隐藏，如下控制台所示：\n\n```bash\n$ rails\
  \ console\n>> User.first.create_activation_digest\nNoMethodError: private method\
  \ 'create_activation_digest' called for<User>\n```\n\n`before_create` 回调的目的是分配令牌和摘要，我们可以如下实现：\n\
  \n```ruby\nself.activation_token = User.new_token\nself.activation_digest = User.digest(activation_token)\n\
  ```\n\n这段代码重用了用于 `remember` 方法，正如我们在列表 9.3 中所见：\n\n```ruby\n# 为了持久会话记住用户。\ndef remember\n\
  \  self.remember_token = User.new_token\n  update_attribute(:remember_digest, User.digest(remember_token))\n\
  end\n```\n\n主要区别在于后者使用了 `update_attribute`。这种区别是因为 `before_create` 回调发生在用户创建之前，当使用\
  \ `User.new`（如列表 7.1）时，会自动获得 `activation_token` 和 `activation_digest` 属性；由于后者与数据库相关（图\
  \ 11.1），会被写入数据库。\n\n汇总上述讨论得到了列表 11.3 所示所示 模型。由于激活令牌是虚拟的，我们在模型中添加了第二个 `attr_accessor`。注意我们借此机会将列表\
  \ 6.32 中的电子邮件转小写回调替换为方法引用。\n\n**列表 11.3：** 为 User 模型添加账户激活代码。**绿色**\n\n```ruby\n\
  app/models/user.rb\nclass User < ApplicationRecord\n  attr_accessor :remember_token,\
  \ :activation_token\n  before_save :downcase_email\n  before_create :create_activation_digest\n\
  \  validates :name, presence: true, length: { maximum: 50 }\n\n  private\n    #\
  \ 将电子邮件转换为小写。\n    def downcase_email\n      self.email = email\n    end\n    #\
  \ 创建并分配激活令牌和摘要。\n    def create_activation_digest\n      self.activation_token =\
  \ User.new_token\n      self.activation_digest = User.digest(activation_token)\n\
  \    end\nend\n```\n\n### 种子和 Fixture\n\n在继续之前，我们还应该更新种子数据和 fixture，以便我们的示例和测试用户初始处于激活状态，如列表\
  \ 11.4 和列表 11.5 所示。（`Time.zone.now` 方法是 Rails 内置的助手方法，它返回考虑服务器时区的当前戳。）\n\n**列表 11.4：**\
  \ 默认激活种子用户。\n\n```ruby\ndb/seeds.rb\nUser.create!(name: \"Example User\",\n  email:\
  \ \"example@railstutorial.org\",\n  password:          \"foobar\",\n  password_confirmation:\
  \ \"foobar\",\n  admin: true,\n  activated: true,\n  activated_at: Time.zone.now)\n\
  ```\n\n```ruby\n99.times do |n|\n```\n\n\n\n\n\n```ruby\nname = Faker::Name.name\n\
  email = \"example-#{n+1}@railstutorial.org\"\npassword = \"password\"\nUser.create!(name:\
  \ name,\n            email: email,\n            password: password,\n          \
  \  password_confirmation: password,\n            activated: true,\n            activated_at:\
  \ Time.zone.now)\n```\n\n### 列表 11.5: 激活 fixtures\n\n`test/fixtures/users.yml`\n\
  \n```yaml\nmichael:\n  name: Example\n  email: michael@example.com\n  password_digest:\
  \ <%= User.digest('password') %>\n  admin: true\n  activated: true\n  activated_at:\
  \ <%= Time.zone.now %>\narcher:\n  name: Sterling Archer\n  email: duchess@example.gov\n\
  \  password_digest: <%= User.digest('password') %>\n  activated: true\n  activated_at:\
  \ <%= Time.zone.now %>\nlana:\n  name: Lana Kane\n  email: hands@example.gov\n \
  \ password_digest: <%= User.digest('password') %>\n  activated: true\n  activated_at:\
  \ <%= Time.zone.now %>\nmalory:\n  name: Malory Archer\n  email: boss@example.gov\n\
  \  password_digest: <%= User.digest('password') %>\n  activated: true\n  activated_at:\
  \ <%= Time.zone.now %>\n<% 30.times do |n| %>\nuser_<%= n %>:\n  name: \"User#{n}\"\
  \n  email: \"user-#{n}@example.com\"\n  password_digest: <%= User.digest('password')\
  \ %>\n  activated: true\n  activated_at: <%= Time.zone.now %>\n<% end %>\n```\n\n\
  要应用列表 11.4 中的更改，请重置数据库并像往一样重新填充数据：\n\n```bash\nrails db:migrate:reset\nrails db:seed\n\
  ```\n\n#### 练习题\n\n购买任何 Rails Tutorial 均可在 railstutorial.org 免费获取练习题答案。若要查看他人的答案并记录自己的答案，请加入\
  \ learnenough.com 的 Learn Enough Society。\n\n1. 验证在在本节进行更改后，测试套件是否仍为 `GREEN`（绿色）。\n\
  2. 通过在控制台中实例化一个 `User` 对象，确认调用 `create_activation_digest` 方法会因为它是私有方法而抛出 `NoMethodError`。用户的激活散列值（activation\
  \ digest）的值是多少？\n3. 在列表 6.34 中，我们看到将电子邮件转换为小写可以写成更简单的 `email.downcase!`（无需任何赋值）。对列表\
  \ 11.3 中的 `downcase_email` 方法进行此更改，并通过运行测试套件来验证其是否正常工作。\n\n## 11.2 账户激活邮件\n\n在数据建模完成后，我们现在准备好添加发送账户激活邮件所需的代码了。方法是使用\
  \ Action Mailer 库添加一个 User mailer，我们将在 Users 控制器的 `create` 动作中使用它来发送带有激活链接的邮件。Mailers\
  \ 的结构类似于控制器动作，并将邮件模板定义为视图。这些模板将包含带有激活令牌的链接以及与要激活的账户关联的电子邮件地址。\n\n#### 11.2.1 Mailer\
  \ 模板\n\n与模型和控制器一样，我们可以使用 `rails generate` 生成 mailer，如列表 11.6 所示。\n\n**列表 11.6: 生成\
  \ User mailer。**\n\n```bash\nrails generate mailer UserMailer account_activation\
  \ password_reset\n```\n\n除了必要的 `account_activation` 方法外，列表 11.6 还生成了我们在第 12 章需要的\
  \ `password_reset` 方法。\n\n列表 11.6 中的命令还为每个 mailer 生成了两个视图模板，一个纯文本邮件，一个 HTML 邮件。对于账户激活\
  \ mailer 方法，它们显示如列表 11.7 和列表 11.8 所示。（我们将在第 12 章处理相应的密码重置模板。）\n\n#### 列表 11.7: 生成的账户激活视图。\n\
  \n`app/views/user_mailer/account_activation.text.erb`\n\n```erb\nUserMailer#account_activation\n\
  <%= @greeting %>\n```\n\n#### 列表 11.8: 生成的账户激活视图。\n\n`app/views/user_mailer/account_activation.html.erb`\n\
  \n```html\n<h1>UserMailer#account_activation</h1>\n<p>\n<%= @greeting %>\n</p>\n\
  ```\n\n让我们看看生成的 mailers 以了解它们的工作原理（列表 11.9 和 11.10）。我们在列表 11.9 中看到，应用程序中所有 mailer\
  \ 都有一个默认的 `from` 地址，并且列表 11.10 中的每个方法都有收件人地址。列表 11.9 还使用了与邮件格式对应的 mailer 布局；虽然这在本教程中并不重要，但生成的\
  \ HTML 和纯文本 mailer 布局可以在 `app/views/layouts` 中找到。生成的代码还包含一个实例变量 `@greeting`，它以与控制器实例变量相同的方式在\
  \ mailer 视图可用。\n\n#### 列表 11.9: 生成的 application mailer。\n\n`app/mailers/application_mailer.rb`\n\
  \n```ruby\nclass ApplicationMailer < ActionMailer::Base\n  default from: \"from@example.com\"\
  \n  layout 'mailer'\nend\n```\n\n#### 列表 11.10: 生成的 User mailer。\n\n`app/mailers/user_mailer.rb`\n\
  \n```ruby\nclass UserMailer < ApplicationMailer\n  # Subject 可以在 I18n 文件 config/locales/en.yml\
  \ 中设置\n  # 对应如下查找：\n  # en.user_mailer.account_activation.subject\n  def account_activation\n\
  \    @greeting = \"Hi\"\n    mail to \"to@example.org\"\n  end\n\n  # Subject 可以在\
  \ I18n 文件 config/locales/en.yml 中设置\n  # 对应如下查找：\n  # en.user_mailer.password_reset.subject\n\
  \  def password_reset\n    @greeting = \"Hi\"\n    mail to \"to@example.org\"\n\
  \  end\nend\n```\n\n为了制作有效的激活邮件，我们将首先按照列表 11.11 所示自定义模板。接下来，我们将创建一个用户的实例变量（用于视图），然后并将结果发送到\
  \ `user.email`（列表 11.12）。如列表 11.12 所示，`mail` 方法还可以接收 `subject` 键，其值将作为邮件主题。\n\n\
  #### 列表 11.11: 具有新默认 `from` 地址的 application mailer。\n\n`app/mailers/application_mailer.rb`\n\
  \n```ruby\nclass ApplicationMailer < ActionMailer::Base\n  default from: \"noreply@example.com\"\
  \n  layout 'mailer'\nend\n```\n\n#### 列表 11.12: 发送账户激活链接。\n\n`app/mailers/user_mailer.rb`\n\
  \n```ruby\nclass UserMailer < ApplicationMailer\n  def account_activation(user)\n\
  \    @user = user\n    mail to: user.email, subject: \"Account activation\"\n  end\n\
  \n  def password_reset\n    @greeting = \"Hi\"\n    mail to \"to@example.org\"\n\
  \  end\nend\n```\n\n\n\n\n\n与普通视图一样，我们可以使用嵌入式 Ruby 来自定义模板视图——在这种情况下，通过名称问候用户，并包含一个指向自定义激活链接的链接。我们的计划是根据电子邮件地址查找用户，然后验证激活令牌，因此链接需要同时包含电子邮件地址和令牌。由于我们使用\
  \ `Account Activations`（账户激活）资源对激活进行建模，令牌本身可以作为列表 11.1 中定义的命名路由的参数：\n\n点击此处查看代码图片\n\
  \n```edit_account_activation_url(@user.activation_token, ...)\n```\n\n回想起\n\n`edit_user_url(user)`\n\
  \n会产生如下形式的 URL：\n\n点击此处查看代码图片\n\n[`www.example.com/users/1/edit`](http://www.example.com/users/1/edit)\n\
  \n相应的账户激活链接的基 URL 将如下所示：\n\n点击此处查看代码图片\n\n[`www.example.com/account_activations/q5lt38hQDc_959PVoo6b7A/edit`](http://www.example.com/account_activations/q5lt38hQDc_959PVoo6b7A/edit)\n\
  \n这里的 `q5lt38hQDc_959PVoo6b7A` 是由 `new_token` 方法（列表 9.2）生成的 URL 安全 base64 字符串，它的作用与\
  \ `/users/1/edit` 中的用户 id 相同。特别，在 Activations 控制器的 `edit` 操作中，令牌将作为 `params[:id]`\
  \ 出现在 `params` 哈文中。\n\n为了同时包含电子邮件，我们需要使用查询参数，它在 URL 中显示为位于问号后面的键值对：⁵\n\n5. URL 可以包含多个查询参数，由多个由\
  \ `&` 字符分隔的键值对组成，例如 `/edit?name=Foo%20Bar&email=foo%40example.com`。\n\n点击此处查看代码图片\n\
  \n```account_activations/q5lt38hQDc_959PVoo6b7A/edit?email=foo%40example.com```\n\
  \n注意电子邮件地址中的 `@` 表现为 `%40`，即它被“转义”了，以确保 URL 的有效性。在 Rails 中设置查询参数的方法是在命名路由中包含一个哈希：\n\
  \n点击此处查看代码图片\n\n```edit_account_activation_url(@user.activation_token, email: @user.email)\n\
  ```\n\n当以此方式使用命名路由来定义查询参数时，Rails 会自动转义任何特殊字符。生成的电子邮件地址在控制器中也会自动取消转义，并通过 `params[:email]`\
  \ 访问。\n\n使用列表 11.12 中定义的实例变量 `@user`，我们可以使用命名的 edit 路由和嵌入 Ruby 创建必要的链接，如列表 11.13\
  \ 和列表 11.14 所示。注意，列表 11.14 中的 HTML 模板使用了 `link_to` 方法来构建有效的链接。\n\n**列表 11.13：**\
  \ 账户激活文本视图。\n\n```app/views/user_mailer/account_activation.text.erb\n```\n\n点击此处查看代码图片\n\
  \n***\nHi <%= @user.name %>,\n\n欢迎来到 Sample App！点击下方的链接激活您的账户：\n\n<%= edit_account_activation_url(@user.activation_token,\
  \ email: @user.email) %>\n***\n\n**列表 11.14：** 账户激活 HTML 视图。\n\n```app/views/user_mailer/account_activation.html.erb\n\
  ```\n\n点击此处查看代码图片\n\n***\n```html\n<h1>Sample App</h1>\n<p>Hi <%= @user.name %>,</p>\n\
  <p>\nWelcome to the Sample App! Click on the link below to activate your account:\n\
  </p>\n<%= link_to \"Activate\", edit_account_activation_url(@user.activation_token,\
  \ email: @user.email) %>\n```\n***\n\n### 练习\n\n购买任何 Rails Tutorial 可以在 railstutorial.org/solutions\
