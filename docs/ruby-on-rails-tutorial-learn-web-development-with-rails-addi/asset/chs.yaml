  **表 11.1：** 登录、记住、账户激活和密码重置之间的类比。\n\n![image](img/image01289.jpeg)\n\n由于与密码和记住令牌（remember\
  \ tokens）的相似性，我们将账户激活（以及密码重置）重用许多相同的思路，包括 `User.digest` 和 `User.new_token` 方法以及\
  \ `user.authenticated?` 方法的修改版本。表 11.1 说明了这种类比（包括来自第 12 章的密码重置）。\n\n在第 11.1 节中，我们将为账户激活创建一个资源和数据模型（第\
  \ 11.1 节），并在第 11.2 节中，我们将添加一个用于发送账户激活邮件的*邮件器*（第 11.2 节）。我们将在第 11.3 节中实现实际的账户激活，包括表\
  \ 11.1 中 `authenticated?` 方法的通用版本。\n\n## 11.1 账户激活资源\n\n与会话（第 8.1 节）一样，我们将账户激活建模为一个资源，尽管它们不会与\
  \ Active Record 模型关联。相反，我们将相关数据（包括激活令牌和激活状态）包含在 User 模型本身中。\n\n由于我们将账户激活视为资源，因此我们将通过标准的\
  \ REST URL 与其交互。激活链接将修改用户的激活状态，对于此类修改，标准的 REST 做法是向 `update` action 发起 PATCH 请求（表\
  \ 7.1）。然而，激活链接需要通过电子邮件发送，因此它将涉及普通的浏览器点击，这发出的是 GET 请求而不是 PATCH。这一设计限制意味着我们不能使用 `update`\
  \ action，但我们将采取次优方案，即使用 `edit` action，它可以响应 GET 请求。\n\n像往常一样，我们将为新功能创建一个主题分支：\n\n\
  点击此处查看代码图\n\n```bash\ngit checkout -b account-activation\n```\n\n#### 11.1.1 Activations\
  \ Controller\n\n与 Users 和 Sessions 一样，Activations 资源的动作（或者说，在这种情况下是唯一的动作）将位于 Activations\
  \ 控制器中，我们可以按照如下方式生成它：³\n\n```bash\nrails generate controller Activations\n```\n\n\
  正如我们在第 11.2 节中所看到的，激活邮件将涉及一个如下形式的 URL：\n\n点击此处查看代码图\n\n```ruby\nedit_activation_url(token)\n\
  ```\n\n这意味着我们需要为 `edit` action 创建一个命名路由。我们可以通过列表 11.1 所示的 `resources` 行来安排。\n\n\
  ```ruby\nRails.application.routes.draw do\n  root 'static_pages#home'\n  get '/help',\
  \ to: 'static_pages#help'\n  get '/about', to: 'static_pages#about'\n  get '/contact',\
  \ to: 'static_pages#contact'\n  get '/signup', to: 'users#new'\n  get '/login',\
  \ to: 'sessions#new'\n  post '/login', to: 'sessions#create'\n  delete '/logout',\
  \ to: 'sessions#destroy'\n  resources :users\n  resources :account_ations, only:\
  \ [:edit]\nend\n```\n\n这为我们提供了 `edit` action 的 RESTful 路由，如列表 11.1 所示（此处文中说是表 11.1，但指的是列表）。`_url`\
  \ 形式在表 11.2 中。\n\n**表 11.2：** 由 `resources` 行提供的路由。\n\n![image](img/image1205.jpeg)\n\
  \n**列表 11.1：** 为 `edit` 添加路由。\n\n`config/routes.rb`\n\n点击此处查看代码图\n\n```ruby\nRails.application.routes.draw\
  \ do\n  root 'static_pages#home'\n  get '/help', to: 'static_pages#help'\n  get\
  \ '/about', to: 'static_pages#about'\n  get '/contact', to: 'static_pages#contact'\n\
  \  get '/signup', to: 'users#new'\n  get '/login', to: 'sessions#new'\n  post '/login',\
  \ to: 'sessions#create'\n  delete '/logout', to: 'sessions#destroy'\n  resources\
