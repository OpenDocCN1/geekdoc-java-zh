  \n\n## 关于本电子书\n\nEPUB 是一种开放的行业标准电子书格式。然而，不同阅读设备和应用程序对 EPUB 及其功能的支持程度不同。请使用您的设备或应用设置来根据喜好自定义显示。您可以自定义的设置通常包括字体、字号、单栏或双栏、横屏或竖屏模式，以及可以点击或触摸以放大的插图。有关您的阅读设备或应用上设置和功能的更多信息，请访问设备制造商的网站。\n\
  \n许多书目包含编程代码或配置示例。为了优化这些元素的显示效果，请在单栏横屏模式下查看电子书，并将字体大小调整为最小设置。除了以重流文本格式呈现代码和配置外，我们还包含了代码的图像，模仿印刷版书籍中的显示效果；因此，当重流格式可能会损害代码列表的显示效果时，您将看到“点击此处查看代码图像”的链接。点击链接可查看高保真代码图像。要返回之前查看的页面，请点击设备或应用上的“返回”按钮。\n\
