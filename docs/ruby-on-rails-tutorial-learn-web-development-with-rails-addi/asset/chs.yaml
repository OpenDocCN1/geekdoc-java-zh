  ## 10.4 删除用户\n\n现在用户索引已经完成，只剩下一个规范的 REST 动作了：`destroy`。在本节中，我们将添加删除用户的链接，如图 10.13\
  \ 所示的原型所示，并定义完成删除所需的 `destroy` 动作。但在之前，我们将创建一个授权执行此操作的管理员用户类，或称为*管理员（admins）*。\n\
  \n#### 10.4.1 管理员用户\n\n我们将通过 User 模型中的一个布尔值 `admin` 属性来识别具有特权的管理员用户，这将自动生成一个 `admin?`\
  \ 布尔方法来测试管理员状态。生成的数据模型出现在图 10.14 中。\n\n按照惯例，我们通过迁移（migration）添加 `admin` 属性，并在命令行中指定类型为\
  \ `boolean`：\n\n点击此处查看代码图片\n\n```\n$ rails generate migration add_admin_to_users\
  \ admin:boolean\n```\n\n![image](img/image01255.jpeg)\n\n**图 10.13：** 带有删除链接的用户索引原型图。\n\
  \n![image](img/image01934.jpeg)\n\n**图 10.14：** 添加了 `admin` 布尔属性的 User 模型。\n\n该迁移向\
  \ `users` 表添加了 `admin` 列，如列表 10.54 所示。注意我们在列表 10.54 中为 `add_column` 添加了参数 `default:\
  \ false`，这意味着用户默认*不是*管理员。（如果不使用 `default: false` 参数，`admin` 默认将为 `nil`，这仍然是 `false`，所以这一步并非严格必要。不过，这样做更加显式，并且能更清晰地向\
  \ Rails 和代码读者传达我们的意图。）\n\n**列表 10.54：** 为用户添加布尔 `admin` 属性的迁移。\n\n```\ndb/migrate/[timestamp]_add_admin_to_users.rb\n\
  ```\n\n点击此处查看代码图片\n\n```ruby\nclass AddAdminToUsers < ActiveRecord::Migration[5.0]\n\
  \  def change\n    add_column :users, :admin, :boolean, default: false\n  end\n\
  end\n```\n\n接下来，按照惯例执行迁移：\n\n```\n$ rails db:migrate\n```\n\n正如预期的，Rails 识别出了 `admin`\
  \ 属性的布尔性质，并自动添加了带问号的方法 `admin?`：\n\n点击此处查看代码图片\n\n```\n$ rails console --sandbox\n\
  >> user = User.first\n>> user.admin?\n=> false\n>> user.toggle!(:admin)\n=> true\n\
  >> user.admin?\n=> true\n```\n\n在这里我们使用了 `toggle!` 方法将属性从 `false` 切换为 `true`。\n\n\
  作为最后一步，让我们更新种子数据，让第一个用户默认成为管理员（列表 10.55）。\n\n**列表 10.55：** 具有管理员用户的种子数据。\n\n```\n\
  db/seeds.rb\n```\n\n点击此处查看代码图片\n\n```ruby\nUser.create!(\n  name: \"Example User\"\
  ,\n  email: \"example@railstutorial.org\",\n  password: \"foobar\",\n  password_confirmation:\
  \ \"foobar\",\n  admin: true\n)\n99.times do |n|\n  name = Faker::Name.name\n  email\
  \ = \"example-#{n+1}@railstutorial.org\"\n  password = \"password\"\n  User.create!(\n\
  \    name: name,\n    email: email,\n    password: password,\n    password_confirmation:\
  \ password\n  )\nend\n```\n\n然后重置数据库：\n\n点击此处查看代码图片\n\n```\n$ rails db:migrate:reset\n\
  $ rails db:seed\n```\n\n### 重温强参数\n\n你可能注意到列表 10.55 通过在初始化哈中包含 `admin: true` 使用户成为管理员。这凸显了将对象暴露在开放互联网上的危险：如果我们直接从任意\
  \ Web 请求传递初始化哈，恶意用户可以发送如下 PATCH 请求：13。\n\n使用 curl 等命令行工具可以发出这种格式的 PATCH 请求。\n\n\
  ```\npatch /users/17?admin=1\n```\n\n该请求将用户 17 变成管理员，这可能是严重的安全漏洞。\n\n由于这种危险，只更新可以通过\
  \ Web 安全编辑的属性至关重要。正如第 7.3.2 节 所述，通过对 `params` 哈希调用 `require` 和 `permit` 来使用*强参数（strong\
  \ parameters）*来实现：\n\n点击此处查看代码图片\n\n```ruby\ndef user_params\n  params.require(:user).permit(:name,\
  \ :email, :password, :password_confirmation)\nend\n```\n\n特别注意 `admin` *不在*允许属性列表中。这防止了任意用户为自己授予管理员访问权限。由于其重要性，为任何不可编辑的属性编写测试都是好主意，而为\
  \ `admin` 属性编写此类测试留作练习（第 10.4.1 节）。\n\n\n\n\n\n**列表 10.56：** 测试 `admin` 属性被禁止。\n\
  \n`test/controllers/users_controller_test.rb`\n\n点击此处查看代码图片\n\n* * *\n\n```ruby\n\
  require 'test_helper'\n\nclass UsersControllerTest < ActionDispatch::IntegrationTest\n\
  \  def setup\n    @user       = users(:michael)\n    @other_user = users(:archer)\n\
  \  end\n\n  test \"should redirect update when not logged in\" do\n    patch user_path(@user),\
  \ params: { user: { name: @user.name, email: @user.email } }\n    assert_not flash.empty?\n\
  \    assert_redirected_to login_url\n  end\n\n  test \"should not allow the admin\
  \ attribute to be edited via the web\" do\n    log_in_as(@other_user)\n    assert_not\
  \ @other_user.admin?\n    patch user_path(@other_user), params: {\n      user: {\
  \ password: FILL_IN, password_confirmation: FILL_IN, admin: FILL_IN }\n    }\n \
  \   assert_not @other_user.admin?\n  end\nend\n```\n\n### 10.4.2 The destroy Action\n\
  \n完成 Users 资源所需的最后一步是添加删除链接和 `destroy` 操作。我们将首先在 users 页面上为每个用户添加一个删除链接，并限制仅管理员用户可以访问。生成的\
  \ `\"delete\"` 链接仅在当前用户为管理员时才会显示（列表 10.57）。\n\n**列表 10.57：** 用户删除链接（仅限管理员可见）。\n\n\
  `app/views/users/_user.html.erb`\n\n点击此处查看代码图片\n\n* * *\n\n```erb\n<li>\n  <%= gravatar_for\
  \ user, size: 50 %>\n  <%= link_to user.name, user %>\n  <% if current_user.admin?\
  \ && !current_user?(user) %>\n    | <%= link_to \"delete\", user, method: :delete,\
  \ data: { confirm: \"You sure?\" } %>\n  <% end %>\n</li>\n```\n\n注意 `method: :delete`\
  \ 参数，它安排了链接发出必要的 DELETE 请求。我们还将每个链接封装在 `if` 语句中，以便只有管理员才能看到。我们的管理员用户的结果显示在图 10.15\
  \ 中。\n\n![image](img/image01104.jpeg)\n\n**图 10.15：** 带有删除链接的用户索引。\n\nWeb 浏览器无法原生发送\
  \ DELETE 请求，因此 Rails 使用 JavaScript 模拟它们。这意味着如果用户禁用了 JavaScript，删除链接将无法工作。如果你必须支持不支持\
  \ JavaScript 的浏览器，可以使用表单和 POST 请求来模拟 DELETE 请求，这在没有 JavaScript 的情况下也能运行。14\n\n14.\
  \ 详情请参见 RailsCast 上的“Destroy Without JavaScript”视频。\n\n为了让删除链接生效，我们需要添加一个 `destroy`\
  \ 操作（表 7.1），该操作查找对应的用户并使用 Active Record 的 `destroy` 方法将其销毁，最后重定向到用户索引，如列表 10.58\
  \ 所示。由于用户必须登录才能删除用户，因此列表 10.58 在 `logged_in_user` 过滤器之前添加了 `:destroy`。\n\n**列表 10.58：**\
  \ 添加一个可用的 `destroy` 操作。\n\n`app/controllers/users_controller.rb`\n\n点击此处查看代码图片\n\
  \n* * *\n\n```ruby\nclass UsersController < ApplicationController\n  before_action\
  \ :logged_in_user, only: [:index, :edit, :update, :destroy]\n  before_action :correct_user,\
  \ only: [:edit, :update]\n\n  def destroy\n    User.find(params[:id]).destroy\n\
  \    flash[:success] = \"User deleted\"\n    redirect_to users_url\n  end\n\n  private\n\
  end\n```\n\n注意 `destroy` 操作使用方法链来将 `find` 和 `destroy` 合并为一行：\n\n`User.find(params[:id]).destroy`\n\
  \n按照目前的构建，只有管理员可以通过 Web 端删除用户，因为他们可以看到删除链接，但仍然存在一个严重的漏洞：任何老练的攻击者都可以直接从命令行发出 DELETE\
  \ 请求来删除任何用户。为了确保网站安全，我们还需要对 `destroy` 操作进行访问控制，使得*只有*管理员可以删除用户。正如第 10.2.1 节和第 10.2.2\
  \ 节所示，我们将使用过滤器（before filter）来强制访问控制，这次是限制仅管理员访问 `destroy` 操作。生成的 `admin_user` 前置过滤器显示在列表\
  \ 10.59 中。\n\n**列表 10.59：** 限制管理员访问 `destroy` 操作的过滤器。\n\n`app/controllers/users_controller.rb`\n\
  \n点击此处查看代码图片\n\n* * *\n\n```ruby\nclass UsersController < ApplicationController\n\
  \  before_action :logged_in_user, only: [:index, :edit, :update, :destroy]\n  before_action\
  \ :correct_user, only: [:edit, :update]\n  before_action :admin_user, only: :destroy\n\
  \n  private\n\n  # 确认用户为管理员\n  def admin_user\n    redirect_to(root_url) unless\
  \ current_user.admin?\n  end\nend\n```\n\n### Exercises\n\n练习题在购买任何 Rails Tutorial\
