  \ 11.3.2 节中完成 Activations 数据模型和邮件器后定义 `edit` action 本体。\n\n#### 11.1.2 账户激活数据模型\n\
  \n正如介绍所示，我们需要一个唯一的激活令牌。一种可能是使用同时存储在数据库并包含在激活 URL 中的字符串，但如果我们的数据库被破解，这将引发安全问题。例如，访问数据库的攻击者可以立即激活新创建的账户（从而登录），然后更改密码以获取控制权。⁴\
  \ 正由于此原因，我们不会使用 Rails 5 添加的（可能命名不当的）`has_secure_token` 功能，因为它以明文形式将相应的令牌存储在数据库中。\n\
