  \n# 第 9 章 高级登录\n\n在第 8 章中开发的基础登录系统已经功能完备，但大多数现代网站都包含在用户在此期间关闭浏览器的情况下，他们再次访问网站时也能“记住”用户的功能。在本章中，我们将使用持久化\
  \ cookie 实现这种行为。我们将从在用户登录时自动记住他们开始（第 9.1 节），这是 Bitbucket 和 GitHub 等网站使用的常用模型。然后，我们将添加使用“记住我”复选框来*可选地*记住用户的功能，这是\
  \ Twitter 和 Facebook 等网站使用的模型。\n\n由于第 8 章的登录系统本身是完整的，示例应用程序的核心即使没有它也能正常运行，如果需要，你可以直接跳到第\
  \ 10 章（并从那里到第 13 章）。另一方面，学习如何实现“记住我”功能本身就很有启发性，并为账户激活（第 11 章）和密码重置（第 12 章）奠定了基础。此外，其结果是计算机魔法的绝佳示例：你在网上见过无数个这样的“记住我”登录表单，现在是你学习如何制作它的机会了。\n\
  \n### 9.1 记住我\n\n在本节中，我们将添加在用户关闭并重新打开浏览器后记住其登录状态的能力。这种“记住我”行为将自动发生，用户在明确注销之前将自动保持登录状态。正如我们将看到的，生成的机制将使得添加可选的“记住我”复选框变得容易（第\
  \ 9.2 节）。\n\n像往常一样，我建议在继续之前切换到一个主题分支：\n\n点击此处查看代码图像\n\n```\n$ git checkout -b advanced-login\n\
  ```\n\n#### 9.1.1 记忆令牌和摘要\n\n在第 8.2 节中，我们使用 Rails 的 `session` 方法存储用户的 id，但这些信息在用户关闭浏览器时就会消失。在本节中，我们将迈向持久化会话的第一步：使用\
  \ `cookies` 方法生成一个适用于创建持久化 cookie 的*记忆令牌*（remember token），同时生成一个用于验证这些令牌的安全的*记忆摘要*（remember\
  \ digest）。\n\n正如第 8.2.1 节所示，使用 `session` 存储的信息自动是安全的，但 `cookies` 并非如此。特别是持久化 cookie\
  \ 容易受到会话劫持攻击，攻击者使用窃取的令牌登录特定用户。窃取 cookie 的四种主要方式：(1) 使用嗅探器在不安全的网络上检测 cookie。[2] 破坏包含记忆令牌的数据库；3)\
  \ 使用跨站脚本 (XSS)；(4) 获取已登录计算机的物理访问。我们在第 7.5 节中通过全站使用套接层（SSL）解决了第一种问题，保护网络数据免受嗅探器攻击。我们将像在第\
  \ 6.3 节中存储密码摘要一样防止第二种问题。Rails 通过转义插入视图模板的内容自动防止第三种问题。最后，虽然没有绝对的方法可以阻止物理访问计算机的攻击者，但我们将通过每次注销时更改令牌以及对浏览器上的任何敏感信息进行*加密签名*来减少第四种问题。\n\
  \n考虑到这些设计和安全性，我们创建持久会话的计划如下：\n\n1. 创建一个随机字符串作为记忆令牌。\n2. 将令牌放在浏览器 cookie 中，并设置久远的过期日期。\n\
  3. 将令牌的摘要保存到数据库。\n4. 将用户 id 的加密版本放在浏览器 cookie 中。\n5. 当提供包含持久化用户 id 的 cookie 时，使用该\
  \ id 在数据库中查找用户，并验证记忆令牌是否与数据库中的摘要匹配。\n\n注意最后一步与登录用户有多相似：我们通过电子邮件地址检索用户，然后（使用 `authenticate`\
  \ 方法）验证提交的密码是否匹配密码摘要（列表 8.7）。因此，我们的实现将与 `has_secure_password` 相关。\n\n我们将首先为 User\
  \ 模型添加所需的 `remember_digest` 属性，如图 9.1 所示。\n\n为了向我们的应用程序添加图 9.1 中的数据模型，我们将生成一个迁移：\n\
  \n点击此处查看代码图像\n\n---\n[1] 会话劫持曾被 Firesep 应用广泛报道，该应用显示在连接公共 Wi-Fi 时许多知名网站的记忆令牌是可见的。\n\
  [2] Rails 5 引入了 `has_secure_token` 方法，它可以自动生成令牌，但它将未哈希的值存储在数据库中，因此不符合我们目前的目的。\n\n\
  \n\n\n```bash\n$ rails generate migration add_remember_digest_to_users remember_digest:string\n\
  ```\n\n（与 第 6.3.1 节 中的密码摘要迁移相比。）与此前的迁移一样，我们使用了以 `_to_users` 结尾的迁移名称，告诉 Rails 该迁移设计用于更改数据库中的\
  \ `users` 表。由于我们还包含了 `remember_digest` 属性和 `string` 类型，Rails 为我们生成了默认迁移，如 列表 9.1\
  \ 所示。\n\n![image](img/image01358.jpeg)\n\n**图 9.1：** 添加 `remember_digest` 属性的 User\
  \ 模型。\n\n**列表 9.1：** 为记住摘要生成的迁移。\n\n`db/migrate/[timestamp]_add_remember_digest_to_users.rb`\n\
  \n点击此处查看代码图片\n\n* * *\n\n```ruby\nclass AddRememberDigestToUsers < ActiveRecord::Migration[5.0]\n\
  \  def change\n    add_column :users, :remember_digest, :string\n  end\nend\n```\n\
  \n* * *\n\n由于我们不预期通过 remember_digest 来检索用户，因此不需要在 `remember_digest` 列上创建索引，我们可以使用上方生成的默认迁移：\n\
  \n```bash\n$ rails db:migrate\n```\n\n现在我们必须决定使用什么作为记住令牌（remember token）。有很多基本等效的可能——本质上，任何长随机字符串都可以。Ruby\
  \ 标准库中 `SecureRandom` 模块的 `urlsafe_base64` 方法符合要求：³ 它返回一个长度为 22 的随机字符串，由 A–Z、a–z、0–9、“-”和“_”字符组成（总共\
  \ 64 种可能，因此称为“base64”）。典型的 base64 字符串如下：\n\n3. 这一选择基于关于“记住我”的 RailsCast 文章。\n\n\
  点击此处查看代码图片\n\n```bash\n$ rails console\n>> SecureRandom.urlsafe_base64\n=> \"q5lt38hQDc_959PVoo6b7A\"\
  \n```\n\n正如两个用户拥有相同的密码完全没有问题一样⁴ 记住令牌不需要是唯一的，但如果它们是唯一的，会更安全。⁵ 在上述 base64 字符串的情况下，22\
  \ 个字符中的每一个都有 64 种可能，因此两个记住令牌冲突的概率是微乎其微的 1/64²² = 2^(−132) ≈ 10^(−40).⁶ 此外，通过使用专门设计为\
  \ URL 安全的 base64 字符串（如名称 `urlsafe_base64` 所示），我们将可以使用同一个令牌生成器在 第 12 章 中创建账户激活和密码重置链接。\n\
  \n4. 在任何情况下，由于 bcrypt 的加盐哈希，我们无法判断两个用户的密码是否匹配。\n\n5. 使用唯一的记住令牌，攻击者始终需要*同时拥有*用户 id\
  \ 和记住令牌 cookie 才能劫持会。\n\n6. 这并没有阻止一些开发者添加检查来验证没有发生冲突，但这种努力是源于没有理解 10^(−40) 有有多小。例如，如果我们在整个宇宙寿命范围内每秒生成十亿个令牌，预期的冲突数量仍处于\
  \ 10^(−23)数量级。\n\n记住用户涉及创建一个记住令牌并将令牌的摘要保存到数据库。我们已经为测试固定件定义了 `digest` 方法（列表 8.21），我们可以利用上述讨论的结果创建一个\
  \ `new_token` 方法来生成新令牌。与 `digest` 一样，新令牌方法不需要用户对象，因此我们将它作为一个类方法。⁷ 结果是 列表 9.2 所示的\
  \ User 模型。\n\n7. 一般性来说，如果一个方法不需要对象的实例，它就应该是类方法。事实上，这个决定在 第 11.2 节 中被证明是明智的。\n\n\
  **列表 9.2：** 添加生成令牌的方法。\n\n`app/models/user.rb`\n\n点击此处查看代码图片\n\n* * *\n\n```ruby\n\
  class User < ApplicationRecord\n  # ... (省略部分代码)\nend\n```\n\n\n\n` 标签内包含的是一段 Ruby\
