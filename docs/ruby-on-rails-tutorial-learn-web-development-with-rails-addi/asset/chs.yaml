  \  end\n  .\n  \nend\n```\n\n测试套件应该是**绿色**的：\n\n**列表 14.45：`绿色`**\n\n```bash\n$\
  \ rails test\n```\n\n在某些应用程序中，这种初始实现对于大多数实际目的可能足够了，但列表 14.44 并不是最终的实现；在移动到下一节之前，尝试猜测一下为什么不是。（*提示*：如果一个用户关注了\
  \ 5000 个其他用户呢？）\n\n#### 练习\n\n练习题的答案可以在购买 Rails Tutorial 后在 railstutorial.org/solutions\
