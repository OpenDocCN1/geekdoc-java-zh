  \    <%= yield %>\n    <%= render 'layouts/footer' %>\n  </div>\n</body>\n</html>\n\
  ```\n\n### 5.2 Sass 和资源流水线\n\nRails 最实用的功能之一是*资源流水线，它极大简化了 CSS、JavaScript 和图像等静态资源的生产管理。本节首先对资源流水线进行高级概述，然后展示如何使用\
  \ *Sass*——一种编写 CSS 的强大工具。\n\n#### 5.2.1 资源流水线\n\n对于典型的开发人员来说，资源流水线有三个需要理解的功能：资源目录、清单文件和预处理器引擎。让我们逐一考虑。\n\
  \n##### 资源目录\n\nRails 资源流水线使用三个标准目录处理静态资源，每个目录都有其目的：\n\n• **`app/assets`**：当前应用程序特定的资源\n\
  • **`lib/assets`**：开发团队编写的库的资源\n• **`vendor/assets`**：来自第三方供应商的资源\n\n这些目录中的每一个都有对应资源类的子目录：图像、JavaScript\
  \ 和级联样式表：\n\n点击此处查看代码图片\n\n```bash\n$ ls app/assets/\nimages/���javascripts/���stylesheets/\n\
  ```\n\n\n\n\n一旦你将资产放置在逻辑位置，就可以使用清单文件（manifest files）告诉 Rails（通过 Sprockets 宝石）如何将它们合并成单个文件。（这适用于\
  \ CSS 和 JavaScript，但不适用于图像。）作为一个示例，让我们来看应用样式表的默认清单文件（列表 5.19）。\n\n**列表 5.19：** 特定应用\
  \ CSS 的清单文件。\n\n```css\napp/assets/stylesheets/application.css\n```\n\n点击此处查看代码图像\n\
  \n这是一个将被编译为 `application.css` 的清单文件，它将包含下面列出的所有文件。\n\n此目录 `lib/assets/stylesheets`、`vendor/assets/stylesheets`\
  \ 或插件的 `vendor/assets/stylesheets` 目录下的任何 CSS 和 SCSS 文件，都可以使用相对路径在此引用。\n\n你可以自由地向此文件添加全局范围的样式，它们将出现在编译文件的底部，因此你在此处添加的样式将优于此目录内其他\
  \ CSS/SCSS 文件中定义的样式。通常情况下，为每个样式范围创建一个新文件会更好。\n\n```css\n= require_tree .\n= require_self\n\
  ```\n\n这里的关键行实际上是 CSS 注释，但它们被 Sprockets 用于包含适当的文件：\n\n点击此处查看代码图像\n\n```css\n= require_tree\
  \ .\n= require_self\n```\n\n在这里，`= require_tree .` 确保了 `app/assets/stylesheets`\
  \ 目录中的所有 CSS 文件（包括子目录）都包含在应用 CSS 中。`= require_self` 行指定了 `application.css` 本身中的\
  \ CSS 在加载序列中包含的位置。\n\nRails 自带了合理的默认清单文件，在《Rails 教程》中我们不需要进行任何更改，但如果你需要，Rails Guides\
  \ 上关于资源流水线（asset pipeline）的条目有更多细节。\n\n### 预处理器引擎\n\n在组装资产之后，Rails 会通过运行多个预处理器引擎来为站点模板准备资产，并使用清单文件将它们合并交付给浏览器。我们通过文件名扩展名告诉\
  \ Rails 使用哪个处理器；三个最常见的情况是用于 Sass 的 `.scss`、用于 CoffeeScript 的 `.coffee` 以及用于嵌入 Ruby\
  \ (ERb) 的 `.erb`。我们在第 3.4.3 节 中介绍了 ERb，并在第 5.2.2 节 中介绍了 Sass。本教程不需要 CoffeeScript，但它是一种转换为\
  \ JavaScript 以在浏览器中执行的优雅语言。\n\n预处理器引擎可以链用，这样 `foobar.js.coffee` 会通过 CoffeeScript，而\
  \ `foobar.js.erb` 会同时通过 CoffeeScript 和 ERb（代码从右到左运行，即先运行 CoffeeScript）。\n\n### 生产环境效率\n\
  \n资源流水线的优点之一是它可以让资产在生产环境中保持高效。组织 CSS 和 JavaScript 的传统方法涉及将其拆分成单独的文件并使用良好的格式（带有大量缩进）。这对于程序员来说很方便，但在生产环境中效率很低。特别是包含多个完整尺寸的文件会显著减慢页面加载速度，这是影响用户体验质量的最因素之一。通过资源流水线，我们不必在速度和便利之间做权衡：我们可以在开发中使用多个格式化良好的文件，然后使用资源流水线在生产环境中生成高效的文件。资源流水线将所有应用样式表合并为一个\
  \ CSS 文件（`application.css`），将所有应用 JavaScript 合并为一个文件（`application.js`），然后对其进行压缩以移除不必要的空格和缩进。\n\
  \n### 语法强大的样式表\n\nSass 是一种在许多方面改进了 CSS 的语言。在本节中，我们涵盖了 Sass 的两个最重要的改进：嵌套和混入（mixins）。Sass\
  \ 支持一种名为嵌套的语法，这为 CSS 增加了功能。它允许你在选择器内部嵌套其他规则，使得结构更加清晰。\n\n#### 嵌套\n\n样式表的一种常见模式是编写适用于嵌套元素的规则。例如，在列表\
  \ 5.7 中我们有针对 `.center` 和 `.center h1` 的规则：\n\n```css\n.center {\n  text-align: center;\n\
  }\n.center h1 {\n  margin-bottom: 10px;\n}\n```\n\n我们可以用 Sass 将其替换为：\n\n```css\n\
  .center {\n  text-align: center;\n  h1 {\n    margin-bottom: 10px;\n  }\n}\n```\n\
  \n在这里，嵌套的 `h1` 规则自动继承了 `.center` 的上下文。\n\n另一个嵌套候选需要稍微不同的语法。在列表 5.9 中，我们有代码：\n\n\
  ```css\n#logo {\n  float: left;\n  margin-right: 10px;\n  font-size: 1.7em;\n  color:\
  \ #fff;\n  text-transform: uppercase;\n  letter-spacing: -1px;\n  padding-top: 9px;\n\
  \  font-weight: bold;\n}\n#logo:hover {\n  color: #fff;\n  text-decoration: none;\n\
  }\n```\n\n在这里，id `#logo` 出现了两次，一次单独出现，一次带有 `hover` 属性（控制鼠标指针悬停在元素上时的外观）。为了嵌套第二个规则，我们需要引用父元素\
  \ `#logo`；在 SCSS 中，通过连接号符号 `&` 实现这一点：\n\n```css\n#logo {\n  float: left;\n  margin-right:\
  \ 10px;\n  font-size: 1.7em;\n  color: #fff;\n  text-transform: uppercase;\n  letter-spacing:\
  \ -1px;\n  padding-top: 9px;\n  font-weight: bold;\n  &:hover {\n    color: #fff;\n\
  \    text-decoration: none;\n  }\n}\n```\n\nSass 在从 SCSS 转换为 CSS 的过程中会将 `&:hover`\
  \ 更改为 `#logo:hover`。两种嵌套技术都适用于列表 5.17 中的页脚 CSS，将其可以转换为以下内容：\n\n```css\nfooter {\n\
  \  margin-top: 45px;\n  padding-top: 5px;\n  border-top: 1px solid #eaeaea;\n  color:\
  \ #777;\n  a {\n    color: #555;\n    &:hover {\n      color: #222;\n    }\n  }\n\
  }\n```\n\n\n\n\n\n```css\nsmall {\n  float: left;\n}\nul {\n  float: right;\n  list-style:\
  \ none;\n  li {\n    float: left;\n    margin-left: 15px;\n  }\n}\n```\n\n手动转换 Listing\
  \ 5.17 是一个很好的练习（Section 5.2.2），并且你应该验证转换后 CSS 是否仍然能正常工作。\n\n## 变量\n\nSass 允许我们定义变量来消除重复并编写更具表现力的代码。例如，查看\
  \ Listing 5.8 和 Listing 5.17，我们看到对同一种颜色的重复引用：\n\n点击此处查看代码图片\n\n```css\nh2 {\n  .\n\
  \  .\n  .\n  color: #777;\n}\n.\n.\n.\nfooter {\n  .\n  .\n  .\n  color: #777;\n\
  }\n```\n\n在这种情况下，`#777` 是浅灰色，我们可以通过如下方式定义变量来给它命名：\n\n`$light-gray: #777;`\n\n这允许我们像这样重写我们的\
  \ SCSS：\n\n点击此处查看代码图片\n\n```css\n$light-gray: #777;\n.\n.\n.\nh2 {\n  .\n  .\n \
  \ .\n  color: $light-gray;\n}\n.\n.\n.\nfooter {\n  .\n  .\n  .\n  color: $light-gray;\n\
  }\n```\n\n由于像 `$light-gray` 这样的变量名比 `#777` 更具描述性，即使对于没有重复的值，定义变量通常也是很有用的。事实上，Bootstrap\
  \ 框架定义了大量的颜色变量，可以在 Bootstrap 的 Less 变量页面上在线找到。该页面使用 Less 而不是 Sass 定义变量，但 `bootstrap-sass`\
  \ gem 提供了相应的 Sass 等版本。猜测对应关系并不困难；Less 使用“at”符号 `@`，而 Sass 使用美元符号 `$`。查看 Bootstrap\
  \ 变量页面，我们看到有一个浅灰色的变量：\n\n`@gray-light: #777;`\n\n这意味着通过 `bootstrap-sass` gem，应该有一个对应的\
  \ SCSS 变量 `$gray-light`。我们可以用它来替换我们自定义的变量 `$light-gray`，结果如下：\n\n点击此处查看代码图片\n\n\
  ```css\nh2 {\n  .\n  .\n  .\n  color: $gray-light;\n}\n.\n.\n.\nfooter {\n  .\n\
  \  .\n  .\n  color: $gray-light;\n}\n```\n\n将 Sass 嵌套和变量定义功能应用于整个 SCSS 文件，可以得到 Listing\
  \ 5.20 中的文件。这同时使用了 Sass 变量（从 Bootstrap Less 变量页面推断出）和内置的命名颜色（例如，用于 `#fff` 的 `white`）。特别注意\
  \ `footer` 标签规则的巨大改进。\n\n**Listing 5.20：** 转换为使用嵌套和变量的初始 SCSS 文件。\n\n`app/assets/stylesheets/custom.scss`\n\
  \n点击此处查看代码图片\n\n```scss\n@import \"bootstrap-sprockets\";\n@import \"bootstrap\"\
  ;\n/** mixins, variables, etc. */\n$gray-medium-light: #eaeaea;\n/* universal */\n\
  body {\n  padding-top: 60px;\n}\nsection {\n  overflow: auto;\n}\ntextarea {\n \
  \ resize: vertical;\n}\n.center {\n  text-align: center;\n  h1 {\n    margin-bottom:\
  \ 10px;\n  }\n}\n/* typography */\nh1, h2, h3, h4, h5, h6 {\n  line-height: 1;\n\
  }\nh1 {\n  font-size: 3em;\n  letter-spacing: -2px;\n  margin-bottom: 30px;\n  text-align:\
  \ center;\n}\nh2 {\n  font-size: 1.2em;\n  letter-spacing: -1px;\n  margin-bottom:\
  \ 30px;\n  text-align: center;\n  font-weight: normal;\n  color: $gray-light;\n\
  }\np {\n  font-size: 1.1em;\n  line-height: 1.7em;\n}\n/* header */\n#logo {\n \
  \ float: left;\n  margin-right: 10px;\n  font-size: 1.7em;\n  color: white;\n  text-transform:\
  \ uppercase;\n  letter-spacing: -1px;\n  padding-top: 9px;\n  font-weight: bold;\n\
  \  &:hover {\n    color: white;\n    text-decoration: none;\n  }\n}\n/* footer */\n\
  footer {\n  margin-top: 45px;\n  padding-top: 45px;\n  border-top: 1px solid $gray-medium-light;\n\
  \  color: $gray-light;\n  a {\n    color: $gray-light;\n    &:hover {\n      color:\
  \ white;\n    }\n  }\n}\nsmall {\n  float: left;\n}\nul {\n  float: right;\n  list-style:\
  \ none;\n  li {\n    float: left;\n    margin-left: 15px;\n  }\n}\n```\n\n\n\n\n\
  `$ rails test`\n\n应用程序代码的逻辑与第 3.3 节 中添加“关于”页面的操作相似：首先，我们更新路由（列表 5.23），然后我们在 `StaticPages`\
  \ 控制器中添加一个 `contact` action（列表 5.24），最后我们创建一个 Contact 视图（列表 5.25）。\n\n**列表 5.23：为\
  \ Contact 页面添加路由。**红色**\n\n```ruby\nconfig/routes.rb\n```\n\n点击此处查看代码图像\n\n```ruby\n\
