  2. 在 User 的 `new` 方法中放置 `debugger` 并访问 `/users/new`。`@user` 的值是多少？\n\n### 7.1.4\
  \ Gravatar 图片和侧边栏\n\n在上一节中定义了基础用户页面后，我们现在通过为每个用户添加头像图像以及用户侧边栏的初稿来稍微充实它。我们将首先向用户资料中添加一个“全球通用的头像”，或称\
  \ Gravatar。⁸ Gravatar 是一项免费服务，允许用户上传图像并将其与其控制的电子邮件地址关联。因此，Gravatars 是包含用户资料图像的方便方式，无需经过管理图像上传、裁剪和存储的麻烦；我们只需要使用用户的电子邮件地址构建正确的\
  \ Gravatar 图像 URL，相应的 Gravatar 图像就会自动出现。（我们将在 第 13.4 节 中学习如何处理自定义图像上传。）\n\n8. 在印度教中，avatar\
  \ 是神灵以人类或动物形式的化身。广义地说，*avatar* 一词通常用于指某种个人代表，特别是在虚拟环境中。（在 Twitter 和其他社交媒体的语文中，*avi*\
  \ 一词已流行起来，这可能是 *avatar* 的变体。）\n\n我们的计划是定义一个 `gravatar_for` 辅助函数，为给定的用户返回 Gravatar\
  \ 图片，如 列表 7.8 所示。\n\n**列表 7.8：** 带有名称和 Gravatar 的用户视图。\n\n`app/views/users/show.html.erb`\n\
  \n点击此处查看代码图片\n\n* * *\n\n```erb\n<% provide(:title, @user.name) %>\n<h1>\n  <%=\
  \ gravatar_for @user %>\n  <%= @user.name %>\n</h1>\n```\n\n* * *\n\n默认情况下，辅助文件中定义的方法在任何视图中都是可用的，但为了方便起见，我们将\
  \ `gravatar_for` 方法放在与 Users 控制器关联的文件中。正如 Gravatar 文档，Gravatar URL 基于用户电子邮件地址的 MD5\
  \ 哈希。在 Ruby 中，MD5 算法是通过使用 `hexdigest` 方法实现的，它是 `Digest` 库的一部分：\n\n点击此处查看代码图片\n\n\
  `email = \"MHART@example.COM\"`\n`Digest::MD5.hexdigest(email.downcase)`\n`=> \"\
  1fda4469becbad54186\"`\n\n由于电子邮件地址不区分大小写（第 6.2.4 节），但 MD5 哈希不是，我们使用了 `downcase`\
  \ 方法来确保 `hexdigest` 的参数全小写。（因为在列表 6.32](#part0015.xhtml_list32) 中进行了小写处理，在本教程中不会产生差异，但如果\
  \ `gravatar_for` 用于来自其他来源的电子邮件地址，这是一个良好的做法。）生成的 `gravatar_for` 辅助函数出现在 列表 7.9 中。\n\
  \n**列表 7.9：** 定义 `gravatar_for` 辅助函数。\n\n`app/helpers/users_helper.rb`\n\n点击此处查看代码图片\n\
  \n* * *\n\n```ruby\nmodule UsersHelper\n  # 返回给给定用户的 Gravatar。\n  def gravatar_for(user)\n\
  \    gravatar_id = Digest::MD5.hexdigest(user.email.downcase)\n    gravatar_url\
  \ = \"https://secure.gravatar.com/avatar/#{gravatar_id}\"\n    image_tag(gravatar_url,\
  \ alt: user.name, class: \"gravatar\")\n  end\nend\n```\n\n* * *\n\n列表 7.9 中的代码返回一个\
  \ Gravatar 图像标签，带有 `gravatar` CSS 类和等于用户名的 alt 文本（对于使用屏幕阅读器的视障用户特别方便）。\n\n资料页面显示如图\
  \ 7.7 所示，显示了默认 Gravatar 图片，因为 `user@example.com` 不是一个真实的电子邮件地址。（事实上，通过访问它可以看到，example.com\
