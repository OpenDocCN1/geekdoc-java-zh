  随着账户激活功能的添加，我们示例应用程序的注册、登录和注销机制已几乎完成。剩下的主要功能是允许用户在忘记密码时进行重置。正如我们在 第 12 章 中看到的，密码重置与账户激活有很多共同点，这意味着我们将在本章中学到的知识大显身手。\n\
  \n#### 11.5.1 本章学到的知识\n\n• 像会话（sessions）一样的账户激活\n• 像账户激活一样的密码重置\n（注：根据输入流，为了简洁剩余内容已截断）\n\
  \n\n\n\n由于我们将密码重置视为一种资源，因此我们将通过标准的 REST URL 与其交互。与激活链接（该链接只需要一个 `edit` 动作）不同，在这种情况下，我们将同时渲染\
  \ `new` 和 `edit` 表单来用于操作密码重置，并用于创建和更新这些重置表单，因此我们最终总共将使用四个 RESTful 路由。\n\n像往常一样，我们将为这个新功能创建一个主题分支：\n\
  \n点击此处查看代码图片\n\n```bash\n$ git checkout -b password-reset\n```\n\n#### 12.1.1 密码重置控制器\n\
