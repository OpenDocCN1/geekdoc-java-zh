  ### 6.3 添加安全密码\n\n现在我们已经为 name 和 email 字段定义了验证，准备好添加最后一个 User 基本属性：安全密码。方法是要求每个用户都有一个密码（带有密码确认），然后在数据库中存储密码的哈希版本。（这里可能存在一些混淆。在当前语境下，`hash`\
  \ 指的不是 第 4.3.3 节 中的 Ruby 数据结构，而是对输入数据应用不可逆哈希函数的结果。）我们还将添加一种根据给定密码来验证用户的方法，我们将在 第\
  \ 8 章 中使用该方法来允许用户登录网站。\n\n\n\n\n用户身份验证的方法是获取提交的密码，对其进行哈希处理，并将结果与数据库中存储的哈希值进行比较。如果两者匹配，则说明提交的密码是正确的，用户通过身份验证。通过比较哈希值而不是原始密码，我们可以在不存储密码本身的情况下验证用户。这意味着即使我们的数据库被攻破，用户的密码仍然是安全的。\n\
  \n### 6.3.1 哈希处理过的密码\n\n大部分安全密码的机制将通过一个名为 `has_secure_password` 的单一 Rails 方法实现，我们将如下所示将其包含在\
  \ `User` 模型中：\n\n点击此处查看代码图像\n\n```ruby\nclass User < ApplicationRecord\n  .\n  .\n\
  \  .\n  has_secure_password\nend\n```\n\n像上所示包含在模型中时，这一个方法添加了以下功能：\n\n- 向数据库中保存安全哈希处理过的\
  \ `password_digest` 属性的能力\n- 一对虚拟属性（`password` 和 `password_confirmation`），包括在创建对象时进行存在性校验，以及一个要求它们匹配的校验\n\
  \  - 在此上下文中，*虚拟*意味着这些属性存在于模型对象上，但并不对应数据库中的列\n- 一个 `authenticate` 方法，当密码正确时返回用户（否则返回\
  \ `false`）\n\n`has_secure_password` 发挥魔力作用的唯一要求是相应的模型必须有一个名为 `password_digest` 的属性。（*digest*\
  \ 一词源于密码学哈希函数的术语。在此语境下，*hashed password* 和 *password digest* 是同义词。）在 `User` 模型的情况下，这导致了如图\
  \ 6.8 所示的数据模型。\n\n哈希处理过的密码摘要经常被错误地称为*加密密码*（encrypted passwords*）。例如，`has_secure_password`\
  \ 的源代码就犯了这个错误，本教程的前两个版本也是如此。这种术语是错误的，因为从设计上来说，加密是*可逆的*（reversible*——加密的能力也意味着解密的能力。相比之下，计算密码哈希摘要的意义在于它是*不可逆的*（irreversible*），以便从摘要中推导出原始密码在计算上是不可行的。（感谢读者\
  \ Andy Philips 指出此问题并鼓励我修复这个错误的术语。）\n\n为了实现图 6.8 中的数据模型，我们首先为 `password_digest`\
  \ 列生成一个适当的迁移（migration）。我们可以选择任何想要的迁移名称，但以 `to_users` 结尾该名称是方便的，因为在这种情况下，Rails 会自动构建一个向\
  \ `users` 表添加列的迁移。结果如下，迁移名为 `add_password_digest_to_users`：\n\n点击此处查看代码图像\n\n```bash\n\
  $ rails generate migration add_password_digest_to_users password_digest:string\n\
  ```\n\n在这里，我们还提供了带有名称和 string 的参数 `password_digest:string`，即我们想要创建的属性名称和类型。（对比一下在列表\
  \ 6.1 中最初生成 `users` 表的操作，它包含了 `name:string` 和 `email:string` 参数。）通过包含 `password_digest:string`，我们已经给了\
  \ Rails 足够的信息来为我们构建整个迁移，如列表 6.35 所示。\n\n![image](img/image01100.jpeg)\n\n**图 6.8:**\
  \ 添加了 `password_digest` 属性的 User 数据模型。\n\n**列表 6.35:** 添加 `password_digest` 列的迁移。\n\
  \n`db/migrate/[timestamp]_add_password_digest_to_users.rb`\n\n点击此处查看代码图像\n\n```ruby\n\
  class AddPasswordDigestToUsers < ActiveRecord::Migration[5.0]\n  def change\n  \
  \  add_column :users, :password_digest, :string\n  end\nend\n```\n\n列表 6.35 使用 `add_column`\
  \ 方法向 `users` 表添加一个 `password_digest` 列。要应用它，我们只需要迁移数据库：\n\n```bash\n$ rails db:migrate\n\
  ```\n\n为了制作密码摘要，`has_secure_password` 使用了一种名为 `bcrypt` 的先进哈希函数。通过使用 bcrypt 对密码进行哈希处理，我们确保攻击者即使获取了数据库副本，也无法登录网站。要在示例应用程序中使用\
  \ bcrypt，我们需要将 `bcrypt` gem 添加到我们的 `Gemfile` 中（列表 6.36）。一如既往，您应该使用 railsutorial.org\
  \ 列出的版本号，而不是这里列出的版本。**列表 6.36:** 在 `Gemfile` 中添加 `bcrypt`。\n\n点击此处查看代码图像\n\n```ruby\n\
  source 'https://rubygems.org'\ngem 'rails', '5.0.0'\ngem 'bcrypt', '3.1.1'\n```\n\
  \n然后像常一样运行 `bundle install`：\n\n```bash\n$ bundle install\n```\n\n#### 6.3.2 用户密码\n\
