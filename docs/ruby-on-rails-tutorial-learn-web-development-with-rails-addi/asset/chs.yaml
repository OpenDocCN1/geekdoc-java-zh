  \ Internet Explorer (IE) 版本小于 9 (`if lt IE 9`) 时才会包含包含的内容。这种奇怪的 `[if lt IE 9]` 语法*不是*\
  \ Rails 的一部分；它实际上是 Internet Explorer 浏览器为了这种情况支持的条件注释。这也是好事，因为这意味着我们可以`only` 为低于\
  \ 9 版本的 IE 浏览器包含 HTML5 shim，而让 Firefox、Chrome 和 Safari 等其他浏览器不受影响。\n\n下一节包含一个用于站点（纯文本）Logo\
