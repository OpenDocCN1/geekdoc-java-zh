  -   测试驱动开发使用“红、绿、重构”循环。\n-   Rails 布局（layouts）允许应用程序中的页面使用通用模板，从而消除重复代码。\n\n## 3.6\
  \ 进阶测试设置\n\n此可选章节描述了 Ruby on Rails 教程视频系列中使用的测试设置。它包含两个主要元素：一个增强的通过/失败报告器（[第 3.6.1\
  \ 节]），以及一个检测文件变化并自动运行相应测试的自动化测试运行器（[第 3.6.2 节]）。本节代码较为高级，仅为了方便演示而展示；你不需要在此时理解它们。\n\
  \n本节中的更改应该在 master 分支上进行：\n\n```bash\ngit checkout master\n```\n\n#### 3.6.1 Minitest\
  \ 报告器\n\n为了让默认的 Rails 测试在适当的时间显示**红色（RED）**和**绿色（GREEN）**，我建议将[Listing 3.44] 中的代码添加到测试辅助文件（test\
  \ helper file）中，从而利用[Listing 3.2] 中包含的 `minitest-reporters` 库。\n\n[Listing 3.44]\
  \ 中的代码混合了单引号和双引号字符串。这是因为 `rails new` 生成单引号字符串，而 minitest 报告器的文档使用双引号字符串。这种字符串类型的混合在\
  \ Ruby 中很常见；更多信息请参阅[第 4.2.2 节]。\n\n![image](img/image01065.jpeg)\n\n**图 3.8:** 在云\
  \ IDE 中从**红色**变为**绿色**。\n\n**Listing 3.44:** 配置测试以显示**红色**和**绿色**。\n\n`test/test_helper.rb`\n\
  \n```ruby\nENV['RAILS_ENV'] ||= 'test'\nrequire File.expand_path('../../config/environment',\
  \ __FILE__ )\nrequire 'rails/test_help'\nrequire \"minitest/reporters\"\nMinitest::Reporters.use!\
  \ \n\nclass ActiveSupport::TestCase\n  # 按字母顺序为所有测试设置 test/fixtures/*.yml 中的所有固定备件。\n\
  \  fixtures :all\n  # 在此处添加供所有测试使用的更多辅助方法...\nend\n```\n\n云 IDE 中最终从**红色**到**绿色**的转换如[图\
  \ 3.8]所示。[19.]\n\n[19.] 截图是使用 Rails 4.2 拍摄的，如[Box 2.1] 所述，它使用 `rake test` 代替 `rails\
  \ test`。解决此类细微差异是提高技术熟练度的良好练习（[Box 1.1]）。\n\n#### 3.6.2 使用 Guard 进行自动化测试\n\n使用 `rails\
  \ test` 命令的一个困扰是必须切换到命令行并手动运行测试。为了避免这种不便，我们可以使用 `Guard` 来自动化运行测试。`Guard` 监控文件系统的变化，例如，当我们更改\
  \ `static_pages_controller_test.rb` 文件时，只会运行那些测试。更好的是，我们可以配置 `Guard`，使得当 `home.html.erb`\
  \ 文件被修改时，自动运行 `static_pages_controller_test.rb`。\n\n[Listing 3.2] 中的 `Gemfile` 已经在我们的应用程序中包含了\
  \ `guard` 库，因此我们只需要初始化它即可开始：\n\n```bash\nbundle exec guard init\n```\nWriting Guardfile\
  \ to /home/ubuntu/workspace/sample_app/Guardfile\n00:51:32 INFO minitest guard added\
  \ to Guardfile, feel free to edit it\n\n然后我们编辑生成的 `Guardfile`，以便在更新集成测试和视图时，`Guard`\
  \ 会运行正确的测试（[Listing 3.45]）。（由于其长度和高级性，我建议直接复制粘贴[Listing 3.45] 的内容。）\n\n注意：在写本文时，`Guard`\
  \ 和 `Spring` 之间存在一个交互漏洞，导致每次都会运行所有测试。我正在关注此问题并将更新本节。\n\n**Listing 3.45:** 一个自定义的\
  \ `Guardfile`。\n\n```ruby\n# 为 Guard 定义匹配规则。\nguard :minitest, spring: \"bin/rails\
  \ test\", all_on_start: false do\n  watch(%r{test/(.*)/?(.*)_test.rb})\n  watch('test/test_helper.rb')\
  \ { 'test' }\n  watch('config/routes.rb') { integration_tests }\n  watch(%r{app/models/(.*?)\\\
  .rb$}) do |matches|\n    \"test/models/#{matches[1]}_test.rb\"\n  end\n  watch(%r{app/controllers/(.*?)_controller\\\
  .rb$}) do |matches|\n    resource_tests(matches[1])\n  end\n  watch(%r{app/views/([^/]*)/.*\\\
  .html\\.erb$}) do |matches|\n    \"test/controllers/#{matches[1]}_controller_test.rb\"\
  \ +\n    integration_tests(matches[1])\n  end\n  watch(%r{app/helpers/(.*?)_helper\\\
  .rb$}) do |matches|\n    integration_tests(matches[1])\n  end\n  watch('app/views/layouts/application.html.erb')\
  \ do\n    'test/integration/site_layout_test.rb'\n  end\n  watch('app/helpers/sessions_helper.rb')\
  \ do\n    integration_tests << 'test/helpers/sessions_helper_test.rb'\n  end\n \
  \ watch('app/controllers/sessions_controller.rb') do\n    ['test/controllers/sessions_controller_test.rb',\
  \ 'test/integration/users_login_test.rb']\n  end\n  watch('app/controllers/account_activations_controller.rb')\
  \ do\n    'test/integration/users_signup_test.rb'\n  end\n  watch(%r{app/views/users/*})\
  \ do\n    resource_tests('users') +\n    'test/integration/microposts_interface_test.rb'\n\
  \  end\nend\n\n  # 返回对应给定资源的集成测试。\n  def integration_tests(resource = :all)\n  \
  \  if resource == :all\n      Dir[\"test/integration/*\"]\n    else\n      Dir[\"\
  test/integration/#{resource}_*.rb\"]\n    end\n  end\n\n  # 返回对应给定资源的控制器测试。\n  def\
  \ controller_test(resource)\n    \"test/controllers/#{resource}_controller_test.rb\"\
  \n  end\n\n  # 返回给定资源的所有测试。\n  def resource_tests(resource)\n    integration_tests(resource)\
  \ << controller_test(resource)\n  end\n```\n\n这里的 `guard :minitest, spring: \"bin/rails\
  \ test\", all_on_start: false` 一行使得 `Guard` 使用 Rails 提供的 `Spring` 服务器来加速加载时间，同时防止\
  \ `Guard` 在启动时运行整个测试套件。\n\n为了在使用 `Guard` 时防止 `Spring` 和 `Git` 之间的冲突，你应该将 `spring/`\
  \ 目录添加到 `Git` 用于确定忽略文件或目录的 `.gitignore` 文件中。使用云 IDE 执行此操作的方法如下：\n\n1. 点击文件面板右上角的齿轮图标（[图\
  \ 3.9]）。\n2. 选择“显示隐藏文件”，显示应用程序根目录下的 `.gitignore` 文件（[图 3.10]）。\n3. 双击 `.gitignore`\
  \ 文件（[图 3.11]）打开它，然后将其填充[Listing 3.46] 中的内容。\n\n![image](img/image01066.jpeg)\n\n\
  **图 3.9:** 文件导航器中相当不显眼的齿轮图标。\n\n**Listing 3.46:** 向 `.gitignore` 文件添加 Spring。\n\n\
  ```text\nspring/\n```\n\n# 更多关于忽略文件的信息请参阅 https://help.github.com/articles/ignoring-files。\n\
  \n# 如果你发现需要忽略文本编辑器生成的临时文件\n\n\n\n\n\n# 或者对于操作系统，你可能想添加一个全局忽略：\n\n```bash\ngit config\
  \ --global core.excludesfile '˜/.gitignore_global'\n```\n\n# 忽略 bundler 配置。\n\n\
  `/.bundle`\n\n# 忽略默认 SQLite 数据库。\n\n`**/db/*.sqlite3`\n\n`**/db/*.sqlite3-journal`\n\
  \n# 忽略所有日志文件和临时文件。\n\n`**/log/***`\n\n`**/tmp/***`\n\n`!/log/.keep`\n\n`!/tmp/.keep`\n\
  \n# 忽略 Byebug 命令历史文件。\n\n`.byebug_history`\n\n# 忽略 Spring 文件。\n\n`**/spring/*.pid`\n\
  \n* *\n\n![image](img/image01067.jpeg)\n\n**图 3.10：** 在文件导航器中显示隐藏文件。\n\n在编写本书时，Spring\
  \ 服务器仍然有一点奇怪，有时 Spring 进程会累积并减慢你测试的性能。如果你的测试运行变得异常缓慢，那么检查系统进程并在必要时杀死它们是一个好主意（Box\
  \ 3.4）。\n\n![image](img/image01068.jpeg)\n\n**图 3.11：** 使通常隐藏的 `.gitignore` 文件可见。\n\
  \n* *\n\n## Box 3.4: Unix 进程\n\n在如 Linux 和 OS X 等类 Unix 系统上，用户任务和系统任务分别发生在一个定义良好的容器中，该容器被称为*进程*（process）。查看系统上的所有进程，你可以使用带有\
  \ `aux` 选项 `ps` 命令：\n\n```bash\nps aux\n```\n\n要按类型过滤进程，你可以通过 Unix 管道 `|` 将 `ps`\
  \ 的结果传递给 `grep` 模式匹配器：\n\n```bash\nps aux | grep spring\n```\n\nubuntu 12241 0.3\
  \ 0.5 589960 178416 ? Ssl Sep20 1:46\nspring app | sample_app | started 7 hours\
  \ ago\n\n显示的结果提供了关于进程的一些详细信息，但最重要的的是第一个数字，它是*进程 ID*（process id），或 *pid*。要消除不需要的进程，请使用\
  \ `kill` 命令向 `pid` 发送 Unix 终止信号（恰好是 15）：\n\n```bash\nkill -15 12241\n```\n\n这是我推荐的杀死单个进程的技术，例如运行错误的\
  \ Rails 服务器（通过 `ps aux | grep server` 找到 `pid`），但有时杀死匹配特定进程名称的所有进程也很方便，例如当你想要杀死占用系统中所有的\
  \ `spring` 进程时。在这种情况下，你应该首先尝试使用 `spring` 命令本身停止进程：\n\n```bash\nspring stop\n```\n\
  \n尽管有时这样做不起作用，你可以使用 `pkill` 命令如下所示杀死所有名为 `spring` 的进程：\n\n```bash\npkill -15 -f\
  \ spring\n```\n\n每当某些运行不符合预期或进程看起来被冻结时，运行 `ps aux` 查看发生了什么通常是一个好主意，然后运行 `kill -15\
  \ <pid>` 或 `pkill -15 -f <name>` 来清理现场。\n\n一旦配置了 Guard，你应该打开一个新的终端，并（与 Section 1.3.2\
  \ 中的 Rails 服务器一样）在命令行中如下运行它：\n\n```bash\nbundle exec guard\n```\n\nListing 3.45\
  \ 中的规则针对本教程进行了优化，当更改控制器时会自动运行（例如）集成测试。要运行*所有*测试，在 `guard>` 提示符处按回车。（这有时可能会产生指示无法连接\
  \ Spring 服务器的错误。要解决此问题，再次按回车即可。）\n\n退出 Guard，按 Ctrl-D。要向 Guard 添加额外的匹配器，请参考 Listing\
  \ 3.45 中的示例、Guard README 以及 Guard wiki。\n\n在继续之前，你应该添加你的更改并提交：\n\n点击此处查看代码图像\n\n\
  ```bash\ngit add -A\ngit commit -m \"Complete advanced setup\"\n```\n\n# 第 4 章 Rails\
  \ 风格的 Ruby\n\n基于 第 3 章 中的示例，本章探索了对 Rails 重要的 Ruby 编程语言元素。Ruby 是一门大语言，但幸运的是，作为 Rails\
  \ 开发人员高效工作所需的子集相对较小。它与通常 Ruby 介绍中涵盖的材料也有所不同。本章旨在为你提供 Rails 风格 Ruby 的坚实基础，无论你之前是否具有该语言的经验。它涵盖了大量内容，第一次看没有完全理解也没关系。我将在未来的章节中频繁引用它。\n\
  \n## 4.1 动机\n\n正如我们在上一章中看到的，在几乎不了解底层 Ruby 语言的情况下，也可以开发 Rails 应用的骨架甚至开始对其测试。我们通过依赖教程提供的测试代码，并处理每个错误消息，直到测试套件通过。然而，这种情况不能持续下去，我们将通过网站上的一个补充来开启本章，它让我们直面自己的\
  \ Ruby 局限性。\n\n正如 Section 3.2 所示，我们将使用单独分支来保持更改：\n\n```bash\ngit checkout -b ruby\n\
  ```\n\n我们将在 Section 4.5 中合并更改。\n\n#### 4.1.1 内置辅助方法\n\n当我们看到新应用时，我们刚刚更新了页面以消除视图中的重复内容，如\
  \ Listing 4.1 所示（与 Listing 3.35 相同）。\n\n**图 4.1：** 布局。\n\n`app/layouts/application.erb`\n\
  \n* *\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n  <title><%= yield(:title) %>\
  \ | Ruby on Rails Sample App</title>\n  <%= csrf_meta_tags %>\n  <%= stylesheet_link_tag\
  \ 'application', media: 'all' %>\n  <%= javascript_include_tag 'application' %>\n\
  </head>\n<body>\n  <%= yield %>\n</body>\n</html>\n```\n\n让我们关注 Listing 4.1 中的某一行：\n\
  \n```erb\n<%= stylesheet_link_tag 'application', media: 'all' %>\n```\n\n这使用了内置\
  \ Rails 函数 `stylesheet_link_tag`（可以在 Rails API 了解更多信息）为所有媒体类型（包括屏幕和打印机）引入 `application.css`。对于有经验的\
  \ Rails 开发人员来说，这一行看起来很简单，但至少有四个可能令人困惑的 Ruby 概念：内置方法、省略括号的方法调用、符号和哈希。我们将在本章中涵盖这些概念。\n\
  \n#### 4.1.2 自定义辅助方法\n\n除了配备了大量用于视图的内置函数外，Rails 还允许创建新函数。这些函数被称为*辅助方法*（helpers）；为了学习制作自定义辅助方法，让我们先检查\
  \ Listing 4.1 中的标题行：\n\n```erb\n<%= yield(:title) %> | Ruby on Rails Sample App\n\
  ```\n\n这依赖于每个视图中定义的页面标题（使用 `provide`），如下：\n\n```erb\n<% provide(:title, \"Home\"\
  ) %>\n```\n\n```html\n<h1>Sample App</h1>\n<p>\n  这是\n  <a href=\"http://www.railstutorial.org/\"\
  >Ruby on Rails Tutorial</a></a>\n  示例应用程序的首页。\n</p>\n```\n\n\n\n\n但如果我们不提供标题会怎样？一个良好的习惯是设置我们在每个页面都使用的*基础标题*（base\
  \ title），并在需要更具体表述时提供一个可选的页面标题。通过目前的布局，我们*几乎*实现了这一点，但仍有一个小插曲：如你所见，如果你删除了其中一个视图中的\
  \ `provide` 调用，在缺少页面特定标题的情况下，完整标题将显示如下：\n\n点击此处查看代码图片\n\n| Ruby on Rails Tutorial\
  \ Sample App |\n\n换句话说，有一个合适的基础标题，但开头多了一个竖线字符 `|`。\n\n为了解决页面标题缺失的问题，我们将定义一个名为 `full_title`\
  \ 的自定义辅助方法。如果没有定义页面标题，`full_title` 辅助方法将返回基础标题“Ruby on Rails Tutorial Sample App”；如果定义了页面标题，则会在页面标题前添加一个带有竖线的标题符（见列表\
  \ 4.2）。¹\n\n1. 如果一个辅助方法专门针对某个控制器，你应该将其放在对应的辅助方法文件中；例如，Static Pages 控制器的辅助方法通常放在\
  \ `app/helpers/static_pages_helper.rb` 中。在我们情况下，我们期望 `full_title` 辅助方法被用于网站的所有页面，而\
  \ Rails 为这种情况提供有一个特殊的辅助方法文件：`app/helpers/application_helper.rb`。\n\n**列表 4.2：**\
  \ 定义 `full_title` 辅助方法。\n\napp/helpers/application_helper.rb\n\n点击此处查看代码图片\n\n```ruby\n\
  module ApplicationHelper\n  # 根据每个页面返回完整标题。\n  def full_title(page_title = '')\n\
  \    base_title = \"Ruby on Rails Tutorial Sample App\"\n    if page_title.empty?\n\
  \      base_title\n    else\n      page_title + \" | \" + base_title\n    end\n\
  \  end\nend\n```\n\n现在我们已经有了辅助方法，可以用它来简化布局，将\n\n点击此处查看代码图片\n\n`<title><%= yield(:title)\
  \ *%> | Ruby on Rails Tutorial Sample App</title>`\n\n替换为\n\n点击此处查看代码图片\n\n`<title><%=\
  \ full_title(yield(:title)) *%></title>`\n\n如列表 4.3 所示。\n\n**列表 4.3：** 使用 `full_title`\
  \ 辅助方法的站点布局。**绿色**\n\napp/views/layouts/application.html.erb\n\n点击此处查看代码图片\n\n```html\n\
  <!DOCTYPE html>\n<html>\n<head>\n  <title><%= full_title(yield(:title)) %></title>\n\
  \  <%= csrf_meta_tags %>\n  <%= stylesheet_link_tag 'application', media: 'all',\
  \ 'data-turbolinks-track': 'reload' %>\n  <%= javascript_include_tag 'application',\
  \ 'data-turbolinks-track': 'reload' %>\n</head>\n<body>\n  <%= yield %>\n</body>\n\
  </html>\n```\n\n为了让我们的辅助方法生效，我们可以从主页中删除不必要的“Home”一词，使其恢复为基础标题。我们这样做的方法是首先通过列表 4.4\
  \ 中的代码更新测试，该代码更新了之前的标题，并增加了一个测试，以检查标题中是否存在 `\"Home\"` 字符串。\n\n**列表 4.4：** 主页标题的更新测试。**红色**\n\
  \ntest/controllers/static_pages_controller_test.rb\n\n点击此处查看代码图片\n\n```ruby\nrequire\
  \ 'test_helper'\nclass StaticPagesControllerTest < ActionDispatch::IntegrationTest\n\
  \  test \"should get home\" do\n    get static_pages_home_url\n    assert_response\
  \ :success\n    assert_select \"title\", \"Ruby on Rails Tutorial Sample App\"\n\
  \  end\n\n  test \"should get help\" do\n    get static_pages_help_url\n    assert_response\
  \ :success\n    assert_select \"title\", \"Help | Ruby on Rails Tutorial Sample\
  \ App\"\n  end\n\n  test \"should get about\" do\n    get static_pages_about_url\n\
  \    assert_response :success\n    assert_select \"title\", \"About | Ruby on Rails\
  \ Tutorial Sample App\"\n  end\nend\n```\n\n让我们运行测试套件来验证其中一个失败了：\n\n**列表 4.5：**\
  \ **红色**\n\n点击此处查看代码图片\n\n```\n$rails test\n3 tests, 6 assertions, 1 failures, 0\
  \ skips\n```\n\n为了让测试套件通过，我们将从主页视图中删除 `provide` 行，如列表 4.6 所示。\n\n**列表 4.6：** 无页面标题的主页。**绿色**\n\
  \napp/views/static_pages/home.html.erb\n\n点击此处查看代码图片\n\n```html\n<h1>Sample App</h1>\n\
  <p>\n  This is the home page for the <a href=\"http://www.railstutorial.org/\">Ruby\
  \ on Rails Tutorial</a>a> sample application.\n</p>\n```\n\n此时，测试应该通过了：\n\n**列表\
  \ 4.7：** **绿色**\n\n```\n$rails test\n```\n\n（之前的示例包含了运行 `rails test` 的部分输出，包括通过和失败的测试数量，但为了简洁起见，这些通常在这里会被省略。）\n\
  \n与第 4.1.1 节中包含应用程序样式表的代码行一样，列表 4.2 中的代码对于经验丰富的 Rails 开发者来说可能看起来很简单，但它*充满了*重要的 Ruby\
  \ 概念：模块、方法定义、可选方法参数、注释、局部变量赋值、布尔值、控制流、字符串拼接和返回值。本章将涵盖所有这些。\n\n### 4.2 字符串与方法\n\n\
  我们学习 Ruby 的主要工具是 *Rails 控制台*（console），它是第 2.3.3 节中介绍的与 Rails 应用交互的命令行程序。控制台本身构建在交互式\
  \ Ruby (`irb`) 之上，因此可以使用 Ruby 语言的所有功能。（正如我们在第 4.4.4 节中所看到的，控制台还可以访问 Rails 环境。）\n\
  \n如果你使用的是云 IDE，我有建议包含的 irb 配置参数。使用简单的 `nano` 文本编辑器，在主目录下打开 `.irbrc` 文件：2.\n\n2.\
  \ `nano` 编辑器对初学者更容易，但对于这种编辑，我几乎总是使用 Vim 编辑器。要学习基础 Vim，请参**Learn Text Editor to Be\
  \ Dangerous*。\n\n```\n$nano ~/.irbrc\n```\n\n然后将其填充为列表 4.8 的内容，以简化 irb 提示并抑制某些烦人的自动进行为。最后，通过\
  \ Ctrl-X 退出 `nano` 并输入 `y` 确认保存 `~/.irbrc`。\n\n现在我们可以按照如下方式启动控制台：\n\n点击此处查看代码图片\n\
  \n```\n$rails console\nLoading development environment\n>>\n```\n\n\n\n控制台是一个极佳的学习工具，你可以尽管探索。别担心——你（可能）不会弄坏任何东西。在使用控制台时，如果卡住了，请输入\
  \ `Ctrl-C`，或者输入 `Ctrl-D` 完全退出控制台。与普通的终端 shell 一样，你也可以使用上方向键来获取之前的命令，这可以节省大量时间。\n\
  \n在本章的剩余部分中，你可能会发现查阅 Ruby API 很有帮助。它包含了大量的信息（也许信息甚至*太多了*）；例如，如果想了解更多关于 Ruby 字符串的内容，可以查看\
  \ Ruby API 中 `String` 类的条目。\n\n#### 4.2.1 注释\n\nRuby 的*注释*以井号 `#`（也称为“hash mark”或更诗意地称为“octothorpe”）开头，并延伸到行尾。Ruby\
  \ 会忽略注释，但它们对人类读者来说很有用（通常也包括作者本人！）。在下面的代码中：\n\n点击此处查看代码图片\n\n```ruby\n# Returns the\
  \ full title on a per-page basis.\ndef full_title(page_title = '')\n  .\n  .\n \
  \ .\nend\n```\n\n第一行是注释，说明了后续函数定义的用途。\n\n通常你不会控制台会话中包含注释，但为了教学目的，我会在后续内容包含一些注释，如下：\n\
  \n点击此处查看代码图片\n\n```ruby\n$ rails console\n>> 17 + 42   # Integer addition\n=> 59\n\
  ```\n\n如果你在本节中通过输入或复制-粘贴命令到你自己的控制台中来跟练习，你当然可以根据自己的意愿省略注释；无论如何，控制台都会忽略它们。\n\n####\
  \ 4.2.2 字符串\n\n*字符串*可能是 Web 应用程序中最重要的数据结构，因为网页最终由从服务器发送到浏览器的字符字符串组成。让我们从控制台开始探索字符串吧：\n\
  \n点击此处查看代码图片\n\n```ruby\n$ rails console\n>> \"\"         # An empty string\n=>\
  \ \"\"\n>> \"foo\"      # A nonempty string\n=> \"foo\"\n```\n\n这些是*字符串字面量*（也称为*字面量*），使用双引号字符\
  \ `\"` 创建。控制台会打印每行的求值结果，对于字符串字面量来说，结果就是字符串本身。\n\n我们还可以使用 `+` 运算符拼接字符串：\n\n点击此处查看代码图片\n\
  \n```ruby\n>> \"foo\" + \"bar\"   # String concatenation\n=> \"foobar\"\n```\n\n\
  在这里，评估 `\"foo\"` 加 `\"bar\"` 的结果是字符串 `\"foobar\"`。关于“foo”和“bar”起源的更多信息——特别是“foobar”与“FUBAR”之间可能存在的*非*关系——请参阅术语表（Jargon\
  \ File）中关于“foo”的条目。\n\n另一种构建字符串的方法是通过使用特殊语法 `#{}` 进行*插值*（interpolation*）：熟悉 Perl\
  \ 或 PHP 的程序员可以将此与诸如 `\"foo $bar\"` 表达式中美元符号变量的自动插值进行比较。\n\n点击此处查看代码图片\n\n```ruby\n\
  >> first_name = \"Michael\"   # Variable assignment\n=> \"Michael\"\n>> \"#{first_name}\
  \ Hartl\"     # String interpolation\n=> \"Michael Hartl\"\n```\n\n在这里，我们将值 `\"\
  Michael\"`*赋值*给变量 `first_name`，然后将其插值到字符串 `\"#{first_name} Hartl\"` 中。我们也可以为两个字符串分配分配变量名：\n\
  \n点击此处查看代码图片\n\n```ruby\n>> first_name = \"Michael\"\n=> \"Michael\"\n>> last_name\
  \ = \"Hartl\"\n=> \"Hartl\"\n>> first_name + \" \" + last_name   # Concatenation,\
  \ with a space in between\n=> \"Michael Hartl\"\n>> \"#{first_name} #{last_name}\"\
  \   # The equivalent interpolation\n=> \"Michael Hartl\"\n```\n\n注意，最后两个表达式是等价的，但我更倾向于插值版本；必须添加单个空格\
  \ `\" \"` 似乎有点笨拙。\n\n#### 打印\n\n要在屏幕上*打印*字符串，最常用的 Ruby 函数是 `puts`（读音为“put ess”）：\n\
  \n点击此处查看代码图片\n\n```ruby\nputs \"foo\"\n```\n\n如示例所示，`puts` 会自动包含换行。\n\n#### 单引号字符串\n\
  \n到目前为止所有的示例都使用了双引号字符串，但 Ruby 也支持单引号字符串。对于许多用途，这两种字符串实际上是等价的：\n\n点击此处查看代码图片\n\n\
  ```ruby\n>> 'foo' + 'bar'\n=> \"foobar\"\n```\n\n\n\n\n1. 将变量 `city` 和 `state` 赋值为你当前居住的城市和州。（如果居住在美国境外，请替换为相应的数值。）\n\
  \n2. 使用插值法（interpolation），打印（使用 `puts`）一个由城市和州组成的字符串，两者之间用逗号和空格隔开，例如“Los Angeles,\
  \ CA”。\n\n3. 重复上一个练习，但城市和州之间用制表符（tab）隔开。\n\n4. 如果在上一个练习中将双引号替换为单引号，结果会怎样？\n\n####\
  \ 4.2.3 对象与消息传递\n\nRuby 中的一切内容，包括字符串甚至 `nil`，都是一个*对象*（object）。我们将在第 4.4.2 节 中看到它的技术含义，但我认为没有人能通过阅读书上的定义来理解对象；你必须通过观察大量的示例来建立对对象的直觉。\n\
  \n描述对象*做什么*要容易得多，即它们响应消息（messages）。例如，像字符串这样的对象可以响应 `length` 消息，该消息返回字符串中的字符数：\n\
  \n点击此处查看代码图片\n\n```\n>> \"foobar\".length         # 向字符串传递 \"length\" 消息\n=> 6\n\
  ```\n\n通常，传递给对象的消息是*方法*（methods），它们是定义在这些对象上的函数。⁵ 字符串也会响应 `empty?` 方法：\n\n5. 提前抱歉，在本章中我可能会在*函数*（function）和*方法*（method）之间来回切换；在\
  \ Ruby 中，它们是同一个东西：所有的方法都是函数，所有的函数都是方法，因为一切皆为对象。\n\n点击此处查看代码图片\n\n```\n>> \"foobar\"\
  .empty?\n=> false\n\n>> \"\".empty?\n=> true\n```\n\n注意 `empty?` 方法结尾的问号。这是 Ruby\
  \ 的一种约定，表示返回值为*布尔值*（boolean）：`true` 或 `false`。布尔值对于*控制流*来说特别有用：\n\n点击此处查看代码图片\n\n\
  ```\n>> s = \"foobar\"\n>> if s.empty?\n>> \"The string is empty\"\n>> else\n>>\
  \ \"The string is nonempty\"\n>> end\n=> \"The string is nonempty\"\n```\n\n为了包含多个子句，我们可以使用\
  \ `elsif`（`else` + `if`）：\n\n点击此处查看代码图片\n\n```\n>> if s.nil?\n>> \"The variable\
  \ is nil\"\n>> elsif s.empty?\n>> \"The string is empty\"\n>> elsif s.include?(\"\
  foo\")\n>> \"The string includes 'foo'\"\n>> end\n=> \"The string includes 'foo'\"\
  \n```\n\n布尔值还可以使用 `&&`（与）、`||`（或）和 `!`（非）操作符进行组合：\n\n点击此处查看代码图片\n\n```\n>> x = \"\
  foo\"\n=> \"foo\"\n\n>> y = \"\"\n=> \"\"\n\n>> puts \"Both strings are empty\"\
  \ if x.empty? && y.empty?\n=> nil\n\n>> puts \"One of the strings is empty\" if\
  \ x.empty? || y.empty?\n\"One of the strings is empty\"\n=> nil\n\n>> puts \"x is\
  \ not empty\" if !x.empty?\n\"x is not empty\"\n=> nil\n```\n\n由于 Ruby 中的一切都是对象，因此\
  \ `nil` 也是一个对象，所以它也可以响应方法。一个例子是 `to_s` 方法，它可以将几乎任何对象转换为字符串：\n\n点击此处查看代码图片\n\n```\n\
  >> nil.to_s\n=> \"\"\n```\n\n这看起来确实是一个空字符串，我们可以通过向 `nil` 传递*链式（chaining）消息来验证：\n\
  \n点击此处查看代码图片\n\n```\n>> nil.empty?\nNoMethodError: undefined method `empty?' for\
