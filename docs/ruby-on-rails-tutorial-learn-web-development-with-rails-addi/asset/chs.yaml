  \ = \"https://secure.gravatar.com/avatar/#{gravatar_id}?s=#{size}\"\n    image_tag(gravatar_url,\
  \ alt: user, class: \"gravatar\")\n  end\nend\n```\n\n## 7.2 注册表单\n\n现在我们有了一个可以运行（尽管不完整）的用户页面，准备好为我们的网站创建一个注册表单了。我们在图\
  \ 5.11 中（再次在图 7.10 中显示）看到注册页面目前是空白的：对于注册用户来说毫无用处。本节的目标是通过制作图 7.11 中模拟的注册表单来开始改变这种现状。\n\
  \n![image](img/image01317.jpeg)\n\n**图 7.10：**注册页面 /signup 的当前状态。\n\n![image](img/image01318.jpeg)\n\
  \n**图 7.11：**注册页面的原型图。\n\n#### 7.2.1 使用 form_for\n\n注册页的核心是一个用于提交相关信息（姓名、电子邮件、确认信息）的*表单*。我们可以在\
  \ Rails 中通过 `form_for` 方法实现这一点，该方法接收一个 Active Record 对象并使用该对象的属性构建表单。\n\n回想起注册页面\
  \ /signup 路由到 Users 控制器中的 `new` 动作（列表 5.43），我们的第一步是为 `form_for` 创建一个 User 对象，如列表\
  \ 14 所示。生成的 `@user` 变量出现在列表 14 中。\n\n**列表 14：**为 `new` 动作添加 `@user` 变量。\n\n`app/controllers/users_controller.rb`\n\
  \n点击此处查看代码图片\n\n```ruby\nclass UsersController < ApplicationController\n  def show\n\
  \    @user = User.find(params[:id])\n  end\n  def new\n    @user = User.new\n  end\n\
  end\n```\n\n表单本身如列表 15 所示。我们将在第 7.2 节中详细讨论它，但首先使用列表 16 中的 SCSS 对其进行简单的样式处理。（注意重用了列表\
  \ 2 中的 `box_sizing` 混入。）一旦应用了这些 CSS 规则，注册页面将如图 7.12 所示。\n\n**列表 15：**注册用户的表单。\n\n\
  `app/views/users/new.html.erb`\n\n点击此处查看代码图片\n\n```erb\n<% provide(:title, 'Sign\
  \ up') %>\n<h1>Sign up</h1>\n<div class=\"row\">\n  <div class=\"col-md-6 col-md-offset-3\"\
  >\n    <%= form_for(@user) do |f| %>\n      <%= f.label :name %>\n      <%= f.text_field\
  \ :name %>\n      <%= f.label :email %>\n      <%= f.email_field :email %>\n   \
  \   <%= f.label :password %>\n      <%= f.password_field :password %>\n      <%=\
  \ f.label :password_confirmation, \"Confirmation\" %>\n      <%= f.password_field\
  \ :password_confirmation %>\n      <%= f.submit \"Create my account\", class: \"\
  btn-primary\" %>\n    <% end %>\n  </div>\n</div>\n```\n\n**列表 16：**用于注册表单的 CSS。\n\
  \n`app/assets/stylesheets/custom.scss`\n\n点击此处查看代码图片\n\n```scss\n/* forms */\ninput,\
  \ textarea, select, .uneditable-input {\n  border: 1px solid #bbb;\n  width: 100%;\n\
  \  margin-bottom: 15px;\n  @include box_sizing;\n}\ninput {\n  height: auto !important;\n\
  }\n```\n\n\n\n\n为了理解 Listing 7.15 中定义的表，将其拆分为较小的部分会有帮助。我们首先来看外部结构，它由调用 `form_for`\
  \ 对象的嵌入式 Ruby 开启和以 `end` 结尾组成：\n\n点击此处查看代码图片\n\n```ruby\n<%= form_for(@user) do\
  \ |f| %>\n  .\n  .\n  .\n<% end %>\n```\n\n`do` 关键字的存在表示 `form_for` 接收一个带变量的块，我们将其命名为\
  \ `f`（代表“form”）。\n\n与 Rails 辅助方法的通常情况一样，我们不需要了解其实现的任何细节，但我们*确实*需要知道的是 `f` 对象的作用：当调用与\
  \ HTML 表单元素相对应的方法时（例如文本字段、单选按钮或密码字段），`f` 会返回专门为设置 `@user` 对象的属性设计的元素代码。也就是说，\n\n\
  ```ruby\n<%= f.label :name %>\n<%= f.text_field :name %>\n```\n\n创建了所需的 HTML，生成带有标签的文本字段元素，适用于设置\
  \ User 模型的 `name` 属性。\n\n如果你通过 Ctrl+ 点击并使用浏览器的“检查元素”功能查看生成表单的 HTML，页面源代码应该看起来类似于\
  \ Listing 7.17。让我们花点时间讨论一下它的结构。\n\n**Listing 7.17：** Figure 7.12 中表单的 HTML。\n\n\
  点击此处查看代码图片\n\n* * *\n\n```html\n<form accept-charset=\"UTF-8\" action=\"/users\"\
  \ class=\"new_user\" id=\"new_user\" method=\"post\">\n  <input name=\"utf8\" type=\"\
  hidden\" value=\"&#x2713;\" />\n  <input name=\"authenticity_token\" type=\"hidden\"\
  \ value=\"NNb6+J/j46LcrgYUC60wQ2titMuJQ5lLqyAbnbAUkdo=\" />\n  <label for=\"user_name\"\
  >Name</label>\n  <input id=\"user_name\" name=\"user[name]\" type=\"text\" />\n\
  \  <label for=\"user_email\">Email</label>\n  <input id=\"user_email\" name=\"user[email]\"\
  \ type=\"email\" />\n  <label for=\"user_password\">Password</label>\n  <input id=\"\
  user_password\" name=\"user[password]\" type=\"password\" />\n  <label for=\"user_password_confirmation\"\
  >Confirmation</label>\n  <input id=\"user_password_confirmation\" name=\"user[password_confirmation]\"\
  \ type=\"password\" />\n  <input class=\"btn btn-primary\" name=\"commit\" type=\"\
  submit\" value=\"Create my account\" />\n</form>\n```\n\n* * *\n\n我们将从文档的内部结构开始。对比\
