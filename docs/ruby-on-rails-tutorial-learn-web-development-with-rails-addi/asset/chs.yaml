  \ 时，可能会收到一条消息，说你需要先运行 `bundle update`。在这种情况下，你应该先运行 `bundle update`。（学习在事情没有完全按照计划进行时不恐慌，是技术老练的关键部分，你会惊讶地发现“错误”信息往往包含了你解决当前问题所需的确切指令。）\n\
  \n#### 1.3.2 rails server\n\n得益于在 Section 1.3 中运行 `rails new` 以及在 Section 1.3.1\
  \ 中运行 `bundle install`，我们已经有一个可以运行的应用程序了——如何运行呢？幸运的是，Rails 带有一个命令行程序（或称为*脚本*），它可以运行一个*本地*网络服务器来帮助我们开发应用程序。具体的命令取决于你使用的环境：在本地系统上，你只需要运行\
  \ `rails server`（Listing 1.6），而在 Cloud9 上，你需要提供额外的*IP 绑定地址*和*端口号*，以告诉 Rails 服务器可以使用哪个地址来使应用程序对外部可见（Listing\
  \ 1.7）。13（Cloud9 使用特殊的*环境变量* `$IP` 和 `$PORT` 来动态分配 IP 地址和端口号。如果你想查看这些变量的值，请在命令行中输入\
  \ `echo $IP` 或 `echo $PORT`。）\n\n13。通常，网站运行在 80 端口，但这通常需要特殊权限，因此惯例是在开发服务器上使用限制较小的、编号较高的端口。\n\
  \n如果你的系统抱怨缺少 JavaScript 运行时，请访问 GitHub 上的 `execjs` 页面查看可能的解决方案。我特别推荐安装 Node.js。\n\
  \n**Listing 1.6:** 在本地机器上运行 Rails 服务器。\n\n点击此处查看代码图像\n\n***\n\n```bash\n$ cd ~//workspace/hello_app/\n\
  $ rails server\n=> Booting Puma\n=> Rails application starting on http://localhost:3000\n\
  => Run 'rails server -h' for more startup options\n=> Ctrl-C to shutdown server\n\
  ```\n\n***\n\n**Listing 1.7:** 在云端 IDE 上运行 Rails 服务器。\n\n点击此处查看代码图像\n\n***\n\n```bash\n\
  $ cd ~//workspace/hello_app/\n$ rails server -b $IP -p $PORT\n=> Booting Puma\n\
  => Rails application starting on http://0.0.0.0:8080\n=> Run 'rails server -h' for\
  \ more startup options\n=> Ctrl-C to shutdown server\n```\n\n***\n\n无论你选择哪种方案，我都建议在第二个终端标签页中运行\
  \ `rails server` 命令，这样你仍然可以在第一个标签页中发布命令。\n\n#### 1.3.3 模型-视图-控制器 (MVC)\n\n即使在早期阶段，对\
  \ Rails 应用程序的工作原理有一个整体概述也是非常有帮助的，如图 1.10 所示。你可能注意到标准的 Rails 应用程序结构（图 1.4）包含一个 `app`\
  \ 目录，其中三个子目录：`models`、`views` 和 `controllers`。Rails 遵循模型-视图-控制器（MVC）体系模式，该模式强制要求数据（如用户信息）与用于显示数据的代码进行分离。\n\
  \n当与 Rails 应用程序交互时，浏览器发送一个*请求*，请求由网络服务器接收并传递给 Rails*控制器*，由控制器负责下一步做什么。在某些情况下，控制器会立即渲染一个*视图*，视图是一个模板，会被转换为\
  \ HTML 并返回给浏览器。对于动态网站更常见的情况是控制器与*模型*交互，模型是代表网站元素（如用户）的 Ruby 对象，负责与数据库通信。在调用模型后，控制器随后渲染视图并将完整的网页返回给浏览器。\n\
  \n### 练习\n\n练习答案可以在 learnenough.com 找到。\n\n**1.** 根据默认页面，Ruby 的版本是多少？\n**2.** Rails\
  \ 的版本是多少？\n\n\n\n\n\n正如其名称所示，控制器动作（controller actions）是定义在控制器（controllers）内部的。我们将动作命名为\
  \ `hello` 并将其放置在 `Application` 控制器中。事实上，此时 `Application` 控制器是我们拥有的唯一控制器，你可以通过运行查看当前控制器来验证这一点。（我们将在第\
  \ 2 章中开始创建自己的控制器）。列表 1.8 显示了 `hello` 的最终定义，它使用 `render` 函数返回 HTML 文本“hello, world!”。（现在不用担心\
  \ Ruby 的语法；我们将在第 4 章中更深入地介绍。）\n\n点击此处查看代码图片\n\n```bash\n$ ls app/controllers/*_controller.rb\n\
  ```\n\n**列表 1.8：** 向 `Application` 控制器中添加 `hello` 动作。\n\n```ruby\napp/controllers/application_controller.rb\n\
  ```\n\n点击此处查看代码图片\n\n***\n\n```ruby\nclass ApplicationController < ActionController::Base\n\
  \  protect_from_forgery with: :exception\n  def hello\n    render html: \"hello,\
  \ world!\"\n  end\nend\n```\n\n***\n\n在定义了返回所需字符串的动作后，我们需要告诉 Rails 使用该动作而不是图 1.9\
  \ 中的默认页面。为了做到这一点，我们将编辑 Rails 的 `router`（路由器），它位于图 1.10 中控制器的前面，并决定将来自浏览器的请求发送到哪里。（为了简单起见，我在图\
  \ 1.10 中省略了路由器，但我们将从 2.2.2 节开始详细讨论它。）特别是，我们想要更改默认页面，即*根路由（*root route*），它决定了在*根\
  \ URL（*root URL*）上提供的页面。因为它是像 [`www.example.com/`](http://www.example.com/) 这样的地址的\
  \ URL（最后一个斜杠后没有任何任何内容），所以根 URL 通常简称为 `/`（“斜杠”）。\n\n如列表 1.9 所示，Rails 路由文件 `config/routes.rb`\
  \ 包含引导我们查看 Rails 路由指南的注释，其中包含了如何定义根路由的说明。语法看起来如下：\n\n点击此处查看代码图片\n\n```ruby\nroot\
  \ 'controller_name#action_name'\n```\n\n在当前情况下，控制器名称是 `application`，动作名称是 `hello`，结果就是如列表\
  \ 1.10 所示的代码。\n\n**列表 1.9：** 默认路由文件（已为了适应宽度调整格式）。\n\n```ruby\nconfig/routes.rb\n\
  ```\n\n点击此处查看代码图片\n\n***\n\n```ruby\nRails.application.routes.draw do\n  # 有关此文件中可用的\
  \ DSL 的详细信息，\n  # 请参见 http://guides.rubyonrails.org/routing.html\nend\n```\n\n***\n\
  \n**列表 1.10：** 设置根路由。\n\n```ruby\nconfig/routes.rb\n```\n\n点击此处查看代码图片\n\n***\n\n\
  ```ruby\nRails.application.routes.draw do\n  root 'application#hello'\nend\n```\n\
  \n***\n\n通过列表 1.8 和列表 1.10 中的代码，根路由按照要求返回“hello, world!”（图 1.11）。15 Hello, world!\n\
