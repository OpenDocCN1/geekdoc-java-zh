  \ 列表 13.64 所示。注意使用 `validate`（而不是 `validates`）来调用自定义验证。\n\n**列表 13.64：** 图片格式验证。\n\
  \n```ruby\napp/uploaders/picture_uploader.rb\n```\n\n点击此处查看代码图片\n\n***\n\n```ruby\n\
  class PictureUploader < CarrierWave::Uploader::Base\n  storage :file\n  # 覆盖存储。\n\
  \  def store_dir\n    \"uploads/#{model.class.underscore}/#{model}\"\n  end\n  #\
  \ 添加允许的扩展名白名单。\n  def extension_white_list\n    %w(jpg png)\n  end\nend\n```\n\n\
  ***\n\n第二个验证（控制大小）出现在 Micropost 模型中。与之前的模型验证不同，文件大小验证没有对应的 Rails 验证器，因此图片需要定义自定义验证，如\
  \ 列表 13.65 所示。\n\n**列表 13.65：** 为图片添加验证。\n\n```ruby\napp/models/micropost.rb\n```\n\
  \n点击此处查看代码图片\n\n***\n\n```ruby\nclass Micropost < ApplicationRecord\n  belongs_to\
  \ :user\n  default_scope -> { order(created_at: :desc) }\n  mount_uploader :picture,\
  \ PictureUploader\n  validates :user_id, presence: true\n  validates :content, presence:\
  \ true, length: { maximum: 140 }\n  validate :picture_size\n  private\n    # 验证图片的大小。\n\
  \    def picture_size\n      if picture.size > 5.megabytes\n        errors.add(:picture,\
  \ \"should be less than 5MB\")\n      end\n    end\nend\n```\n\n\n\n\n有效格式由 Listing\
  \ 13.64 中验证接受的 MIME 类型组成。\n\n接下来，我们将包含一小段 JavaScript（更具体地说是 jQuery），在用户尝试上传过大的图片时发出警报（这可以防止意外的耗时上传，并减轻服务器的负载）：\n\
  \n点击此处查看代码图片\n\n```javascript\n$('#micropost_picture').bind('change', function()\
  \ {\n  var size_in_megabytes = this.files[0].size/1024/1024;\n  if (size_in_megabytes\
  \ > 5) {\n    alert('Maximum file size is 5MB. Please choose a smaller file.');\n\
  \  }\n});\n```\n\n虽然 jQuery 不是本书的重点，但你可能发现上述代码监控了包含 CSS id `micropost_picture` 的页面元素（如井号\
  \ `#` 所示），它是 Listing 13.60 中微博客表单的 id。（找出此点的方法是 Ctrl-点击并使用浏览器的 Web 检查。）当带有该 CSS\
  \ id 的元素发生变化时，jQuery 函数就会触发，如果文件太大，就会调用 `alert` 方法。¹⁷\n\n17. 要学习如何进行此类操作，你可以像我一样所做：在\
  \ Google 上搜索“javascript maximum file size”之类的关键词，直到在 Stack Overflow 上找到相关内容。\n\n\
  添加这些额外检查的结果显示在 Listing 13.66 中。¹⁸\n\n18. 更高级的 jQuery 用户可能会将大小检查放在单独的 JavaScript\
  \ 函数中，但由于这不是本 JavaScript 教程，Listing 13.66 中的代码对于我们的目的来说足够了。\n\n**Listing 13.66:**\
  \ 使用 jQuery 检查文件大小。\n\n`app/views/shared/_micropost_form.html.erb`\n\n点击此处查看代码图片\n\
  \n* * *\n\n```erb\n<%= form_for(@micropost, html: { multipart: true }) do |f| %>\n\
  \  <%= render 'shared/error_messages', object: f.object %>\n  <div class=\"field\"\
  >\n    <%= f.text_area :content, placeholder: \"Compose new micropost...\" %>\n\
  \  </div>\n  <%= f.submit \"Post\", class: \"btn btn-primary\" %>\n  <span class=\"\
  picture\">\n    <%= f.file_field :picture, accept: 'image/jpeg,image/gif,image/png'\
  \ %>\n  </span>\n<% end %>\n```\n\n```html\n<script type=\"text/javascript\">\n\
  \  $('#micropost_picture').bind('change', function() {\n    var size_in_megabytes\
  \ = this.files[0].size/1024/1024;\n    if (size_in_megabytes > 5) {\n      alert('Maximum\
  \ file size is 5MB. Please choose a smaller file.');\n    }\n  });\n</script>\n\
  ```\n\n* * *\n\n正如你通过尝试上传过大的文件所看到的，Listing 13.66 中的代码并没有实际上清空文件输入字段，因此用户只需关闭警报框并继续尝试上传文件。如果这是一本关于\
  \ jQuery 的书，我们可能会通过清空字段来完善这个小瑕疵，但重要的是，像 Listing 13.66 中所示的前端代码无法阻止用户尝试上传过大的文件。即使我们的代码清空了文件输入字段，也没有办法防止用户使用\
  \ Web 检查编辑 JavaScript，或使用 `curl` 等发送直接 POST 请求。因此，为了防止用户上传任意大小的文件，包含像 Listing 13.65\
  \ 那样的服务器端验证是关重要的。\n\n##### 练习题\n\n购买任何 Rails Tutorial 后，可以在 railstutorial.org/solutions\
