  \n\n\n\n当提交本章开发的注册表单时，姓名、电子邮件地址和密码将通过网络发送，因此极易被恶意用户拦截。这是我们应用程序中一个潜在的严重安全漏洞，修复它的方法是在所有相关信息离开本地浏览器之前使用安全套接层\
  \ (SSL) 对进行加密。虽然我们可以仅在注册页面使用 SSL，但实际上在整个站点实现它更容易，这还有额外好处，如保护用户登录（第 8 章），并使我们的应用程序免受\
  \ 第 9.1 节 中讨论的严重*会话劫持*漏洞的影响。\n\n12. 从技术上讲，SSL 现在已是 TLS（即传输层安全），但我认识的每个人仍然称其为“SSL”。\n\
  \n启用 SSL 就像在生产环境应用的配置文件 `production.rb` 中取消行的注释一样简单。如列表 7.36 所示，我们只需要设置 `config`\
  \ 变量即可强制在生产环境 SSL。\n\n**列表 7.36：** 配置应用程序在生产环境中使用 SSL。\n\n```ruby\nconfig/environments/production.rb\n\
  ```\n\n点击此处查看代码图像\n\n```ruby\nRails.application.configure do\n  .\n  .\n  .\n  #\
  \ 强制通过 SSL 访问应用，使用 Strict-Transport-Security，\n  # 并使用安全 cookie。\n  config.force_ssl\
  \ = true\n  .\n  .\n  .\nend\n```\n\n在此阶段，我们需要在远程服务器上设置 SSL。设置生产站点使用 SSL 涉及为您的域名购买并配置*SSL\
  \ 证书*。不过，这是一项大量工作，幸运的是我们在这里不需要它：对于运行在 Heroku 域名上的应用程序（例如示例应用程序），我们可以共用 Heroku 的\
  \ SSL 证书。因此，当我们在第 7.5.2 节 部署应用程序时，SSL 将自动启用。（如果你想在自定义域名（如 [www.example.com](http://www.example.com)）上运行\
  \ SSL，请参考 Heroku 关于 SSL 的文档。）\n\n#### 7.5.2 生产 Web 服务器\n\n添加 SSL 后，我们需要配置应用程序使用适用于生产应用的\
  \ Web 服务器。默认情况下，Heroku 使用一个名为 WEBrick 的纯 Ruby Web 服务器，它易于设置和运行，但不擅长处理大量流量。因此，WEBrick\
  \ 不适用于生产环境，我们将 WEBrick 替换为 Puma，这是一种能够处理大量并发请求的 HTTP 服务器。\n\n要添加新的 Web 服务器，我们只需遵循\
  \ Heroku Puma 文档。第一步是在我们的 `Gemfile` 中包含 puma gem，但从 Rails 5 开始，Puma 是默认包含的（列表 3.2）。这意味着我们可以直接跳到第二步，将\
  \ `config/puma.rb` 文件的默认内容替换为列表 7.37 所示的配置。列表 7.37 中的代码直接来自 Heroku 文档，13) 并不理解它（框\
  \ 1.1）。\n\n13. 列表 7.37 稍微调整了格式，以便代码符合标准的 80 列宽。\n\n**列表 7.37：** 生产 Web 服务器的配置文件。\n\
  \n```ruby\nconfig/puma.rb\n```\n\n点击此处查看代码图像\n\n```ruby\nworkers Integer(ENV['WEB_CONCURRENCY']\
  \ || 2)\n\nthreads_count = Integer(ENV['RAILS_MAX_THREADS'] || 5)\n\nthreads threads_count,\
  \ threads_count\n\npreload_app!\n\nrackup      DefaultRackup\n\nport         ENV['PORT']\
  \      || 3000\n\nenvironment ENV['RACK_ENV'] || 'development'\n\non_worker_boot\
  \ do\n  # Rails 4.1+ 的 worker 特有设置\n  # 见：https://devcenter.heroku.com/articles/\n\
  \  # deploying-rails-applications-with-the-puma-web-server#on-worker-boot\n  ActiveRecord::Base.establish_connection\n\
  end\n```\n\n\n\n\n能够注册用户是我们应用程序的一个大里程碑。虽然示例应用尚未实现任何实用的功能，但我们为所有未来的开发奠定了关键的基础。在第\
  \ 8 章和第 9 章中，我们将通过允许用户登录和退出应用程序（带有可选的“记住我”功能）来完成身份验证机制。在第 10 章中，我们将允许所有用户更新其账户信息，并允许网站管理员删除用户，从而完成表\
  \ 7.1 中完整的用户资源 REST 动作。\n\n#### 7.6.1 我们在本章中学了什么\n\n- Rails 通过 `debug` 方法显示实用的调试信息。\n\
  - Sass mixins 允许一组 CSS 规则被封装并在多个地方复用。\n- Rails 带有三个个标准环境：`development`、`test` 和\
  \ `production`。\n- 我们可以通过一组标准的 REST URL 与作为*资源*的用户进行交互。\n- Gravatars 提供了一种显示图像来代表用户的方便方法。\n\
  - `form_for` 辅助方法用于生成与 Active Record 对象交互的表单。\n- 注册失败会渲染新用户页面并自动显示由 Active Record\
  \ 确定的错误消息。\n- Rails 提供 `flash` 作为显示临时消息的标准方式。\n- 注册成功会在数据库中创建一个用户并重定向到用户详情页，同时显示欢迎消息。\n\
  - 我们可以使用集成测试来验证表单提交行为并捕获回归问题。\n- 我们可以配置生产环境应用使用 SSL 进行安全通信，并使用 Puma 实现高性能。\n\n##\
  \ 第 8 章 基础登录\n\n现在新用户已经可以为我们的网站注册（第 7 章），是时候给他们提供登录和退出的能力了。在本章中，我们将实现一个基础但功能完全的登录系统：应用程序将保持登录状态，直到用户关闭浏览器。生成的身份验证系统将允许我们对网站进行自定义定制，并根据当前用户的登录状态和身份实现授权模型。例如，我们将能够通过登录/注销链接和个人资料链接来更新网站页眉。\n\
  \n在第 10 章中，我们将实施一种安全模型，只有登录用户可以访问用户索引页面，只有正确的用户可以访问编辑其信息的页面，只有管理员可以从数据库中删除其他用户。最后，在第\
  \ 13 章中，我们将利用登录用户的身份创建与该用户关联的微博客（microposts），并在第 14 章中允许当前用户关注应用程序的其他用户（从而接收他们的微博客动态源）。\n\
  \n本章的身份验证系统将为第 9 章中开发的更高级登录系统提供基础。不再在浏览器关闭时“忘记”用户，第 9 章将从*自动*记住用户，然后根据“记住我”复选框的值*可选*地记住用户。因此，第\
  \ 8 章和第 9 章共同开发了网络上最常见的三种登录系统。\n\n## 8.1 会话 (Sessions)\n\nHTTP 是一个*无状态协议*，将每个请求视为一个独立的事务，无法使用任何之前请求的信息。这意味着在超文本传输协议内部没有方法可以记住用户。我们可以通过一组标准的\
  \ REST URL 与作为*资源*的用户进行交互。\n\ncookie 是存储在浏览器上的小数据，用于在页面之间持久化信息（例如用户 id）。在 Rails\
  \ 中实现会话的常见方法是使用 cookie，使用 cookie 来持久会话。在本节和第 8.2 节](#part0017.xhtml_ch08)中，我们将使用\
  \ cookie 创建在浏览器关闭时自动过期的临时会话。在第 9 章中，我们将学习使用 cookie 创建更持久的会话。\n\n将会话模型化为 RESTful\
  \ 资源是方便的：访问登录页面将渲染*新的*会话，登录将*创建*会话，注销将*销毁*它。与使用数据库持久化的用户资源不同，会话资源将使用 cookie。\n\n\
  #### 8.1.1 会话控制器 (Sessions Controller)\n\n登录和退出元素对应特定的动作：登录表单由 `new` 动作处理，登录通过 POST\
  \ 请求处理 `create` 动作，注销通过 DELETE 请求处理 `destroy` 动作。回顾表 7.1 中 HTTP 词与动作的关联。\n\n为了开始，我们将创建一个带有\
  \ `new` 动作的 Sessions 控制器（列表 8.1）。\n\n```\nrails generate Sessions new\n```\n\n包含\
  \ `new` 也会生成*视图*，这就是为什么我们不包含对应视图的 `create` 或 `destroy` 动作。遵循第 7.2 节](#part0016.xhtml_ch07)注册页的模型，我们的计划是创建一个创建新会话的登录表单，如图\
  \ 8.1 所示。\n\n![image](img/image0342.jpeg)\n\n**图 8.1:** 登录表单的预览。\n\n与使用特殊的 `resources`\
  \ 方法获取全套 REST 路由的用户资源（列表 7.3）不同，Sessions 资源将仅使用命名路由，通过 `login` 路由处理 GET 和 POST 请求，通过\
  \ `logout` 路由处理 DELETE 请求。结果出现在列表 8.2 中（同时也删除了 `rails generate controller` 生成的不需要的路由）。\n\
  \n**列表 8.2:** 添加资源以获取会话的标准动作。\n\n```ruby\nconfig/routes.rb\nRails.application.routes.draw\
  \ do\n  root 'static_pages#home'\n  get '/help', to: 'static_pages#help'\n  get\
  \ '/about', to: 'static_pages#about'\n  get '/contact', to: 'static_pages#contact'\n\
  \  get '/signup', to: 'users#new'\n  get '/login', to: 'sessions#new'\nend\n```\n\
  \n\n\n\n\n```ruby\npost '/login', to: 'sessions#create'\ndelete '/logout', to: 'sessions#destroy'\n\
  resources :users\nend\n```\n\n根据列表 8.2 中的路由，我们还需要更新列表 8.1 中生成的测试，以包含新的登录路由，如列表 8.3\
  \ 所示。\n\n**列表 8.3:** 更新 Sessions 控制器测试以使用登录路由。`GREEN`\n\n```ruby\ntest/controllers/sessions_controller_test.rb\n\
  ```\n\n点击此处查看代码图片\n\n* * *\n\n```ruby\nrequire 'test_helper'\n\nclass SessionsControllerTest\
  \ < ActionDispatch::IntegrationTest\n  test \"should get new\" do\n    get login_path\n\
  \    assert_response :success\n  end\nend\n```\n\n* * *\n\n列表 8.2 中定义的路由对应的 URL\
