  \   # 将 FILL_IN 替换为正确的代码。\nend\n```\n\n### 2.3.4 继承层级\n\n我们通过对 Rails 控制器和模型类的简单描述来结束对玩具应用的讨论。只有当你具备面向对象编程（OOP）类时，讨论才有意义。如果现在感到困惑，不要担心；我们将在\
  \ 第 4.4 节中详细讨论这些概念。\n\n我们从模型的继承结构开始。对比 列表 2.18 和 列表 2.19，我们看到 User 模型和 Micropost\
  \ 模型都通过（左括号 `<`）继承自 `ApplicationRecord`，而 `ApplicationRecord` 又继承自 `ActiveRecord::Base`，后者是\
  \ Active Record 提供的模型基类；总结这种关系的图出现在 图 2.18 中。正是通过继承 `ActiveRecord::Base`，我们的模型对象才获得了与数据库通信、将数据库列视为属性等能力。\n\
  \n**列表 2.18:** `User` 类，高亮继承。\n\n`app/models/user.rb`\n\n点击此处查看代码图片\n\n```ruby\n\
  class User < ApplicationRecord\nend\n```\n\n**列表 2.19:** `Micropost` 类，高亮继承。\n\n\
  `app/models/micropost.rb`\n\n点击此处查看代码图片\n\n```ruby\nclass Micropost < ApplicationRecord\n\
  end\n```\n\n控制器的继承结构本质上与模型相同。对比 列表 2.20 和 列表 2.21，我们看到 Users 控制器和 Microposts 控制器都继承自\
  \ Application 控制。检查 列表 2.22，我们看到 `ApplicationController` 本身继承自 `ActionController::Base`，这是\
  \ Rails Action Pack 提供的控制器基类。这些类之间的关系在 图 2.19 中所示。\n\n![image](img/image0151.jpeg)\n\
  \n**图 2.18:** User 和 Micropost 模型的继承层级。\n\n**列表 2.20:** `UsersController` 类，高亮继承。\n\
  \n`app/controllers/users_controller.rb`\n\n点击此处查看代码图片\n\n```ruby\nclass UsersController\
  \ < ApplicationController\nend\n```\n\n**列表 2.21:** `MicropostsController` 类，高亮继承。\n\
  \n`app/controllers/microposts_controller.rb`\n\n点击此处查看代码图片\n\n```ruby\nclass MicropostsController\
  \ < ApplicationController\nend\n```\n\n**列表 2.22:** `ApplicationController` 类，高亮继承。\n\
  \n`app/controllers/application_controller.rb`\n\n点击此处查看代码图片\n\n```ruby\nclass ApplicationController\
  \ < ActionController::Base\nend\n```\n\n![image](img/image152.jpeg)\n\n**图 2.19:**\
  \ 控制器的继承关系。\n\n与模型继承一样，控制器通过继承基类（在本例中为 `ActionController::Base`）获得了大量功能，包括操作模型对象、过滤\
  \ HTTP 请求和渲染视图。由于所有 Rails 控制器都继承自 `ApplicationController`，在 Application 控制中定义的规则适用于应用程序的所有操作。例如，在\
  \ 第 9.1 节中我们将学习如何包含登录和退出助手。\n\n### 练习\n\n购买任何 Rails Tutorial 均可在 railstutorial.org/solutions\
