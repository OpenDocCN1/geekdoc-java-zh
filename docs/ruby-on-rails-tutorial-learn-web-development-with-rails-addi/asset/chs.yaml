  \n#### 11.2.3 邮件测试\n\n最后一步，我们将编写几个测试来双重检查邮件预览中显示的结果。这并不听起来那么难，因为 Rails 为我们生成了有用的示例测试（列表\
  \ 11.19）。\n\n**列表 11.19:** Rails 生成的用户 mailer 测试。\n\n```ruby\ntest/mailers/user_mailer_test.rb\n\
  ```\n\n点击此处查看代码图片\n\n* * *\n\n```ruby\nrequire 'test_helper'\nclass UserMailerTest\
  \ < ActionMailer::TestCase\n  test \"account_activation\" do\n    mail = UserMailer.account_activation\n\
  \    assert_equal \"Account activation\", mail.subject\n    assert_equal [\"to@example.org\"\
  ], mail.to\n    assert_equal [\"from@example.com\"], mail.from\n    assert_match\
  \ \"Hi\", mail.body.encoded\n  end\n\n  test \"password_reset\" do\n    mail = UserMailer.password_reset\n\
  \    assert_equal \"Password reset\", mail.subject\n    assert_equal [\"to@example.org\"\
  ], mail.to\n    assert_equal [\"from@example.com\"], mail.from\n    assert_match\
  \ \"Hi\", mail.body.encoded\n  end\nend\n```\n\n* * *\n\n列表 11.19 中的测试使用了强大的 `assert_match`\
  \ 方法，该方法既可以配合字符串配合正则表达式：\n\n点击此处查看代码图片\n\n```ruby\nassert_match 'foo', 'foobar'\
  \      # true\nassert_match 'baz', 'foobar'      # false\nassert_match /\\w+/, 'foobar'\
  \      # true\nassert_match /\\w+/, '$#!*+@'      # false\n```\n\n列表 11.20 中的测试使用\
  \ `assert_match` 来检查名称、激活令牌和转义后的电子邮件是否出现在邮件正文中。对于最后一项，注意使用 `CGI.escape(user.email)`\
