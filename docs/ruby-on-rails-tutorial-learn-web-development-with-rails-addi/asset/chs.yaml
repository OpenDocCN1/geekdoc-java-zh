  \ 本章学习了什么\n\n\n## 第一版序言\n\n我的前公司（CD Baby）是第一批大举转型到 Ruby on Rails 的公司之一，随后又更大声地转回了\
  \ PHP。（搜搜我了解这段趣事。）Michael Hartl 写的这这本书备受推崇，以至于我必须尝试一下，而 `Ruby on Rails`^™ `Tutorial`\
  \ 正是我用来重新回到 Rails 的工具。\n\n虽然我读过很多关于 Rails 的书，但这一本终于让我“搞懂”了它。所有的操作都非常符合“Rails 方式”——这种方式以前让我觉得非常不自然，但在读完这本书后，现在终于觉得很自然了。这也是唯一一本全过程采用测试驱动开发的\
  \ Rails 书，这种方法被专家极力推荐，但以前从未这样清晰地演示过。最后，通过在演示示例中包含 Git、GitHub 和 Heroku，作者真的让你感受到了进行真实世界项目是什么感觉。教程中的代码示例并不是孤立存在的。\n\
  \n这种线性的叙述方式是一种非常棒的格式。对我个人而言，我用三个漫长的白天完成了整个 `Ruby on Rails`^™ `Tutorial`，完成了每一章末尾所有的示例和挑战。从头到尾坚持下去，不要跳跃，你将获得最大的益处。\n\
  \n阅读愉快！\n\n—Derek Sivers (sivers.org)\nCD Baby 创始人\n\n这可不典型！读完整本书通常比三天要长得多。\n\n\
  ## 第三版序言\n\nRails 现在已经十岁了，其采用率没有放缓的迹象。随着持续的增长，我们看到了一场悖论性的悲剧正在发生。根据许多人的说法，Rails 现在是初学者最难掌握的技术栈之一。刚开始时面临的选择复杂性非常高，而且面上有十年的博客文章和书籍，其中大多数在某种程度上已经过时或损坏了。\n\
  \n`Ruby on Rails`^™ `Tutorial` 正是我用来重新回到 Rails 的工具。虽然读过很多关于 Rails 的书，但这一本终于让我“搞懂”了它。所有的操作都非常符合“Rails\
  \ 方式”——这种方式以前让我觉得非常不自然，但在读完这本书后，现在终于觉得很自然了。这也是唯一全过程采用测试驱动开发的 Rails 书，这种方法被专家极力推荐，但以前从未这样清晰地演示过。最后，通过在演示示例中包含\
  \ Git、GitHub 和 Heroku，作者真的让你感受到了进行真实世界项目是什么感觉。教程中的代码示例并不是孤立存在的。\n\n这种线性的叙述方式是一种非常棒的格式。对我个人而言，我用三个漫长的白天完成了整个\
  \ `Ruby on Rails`^™ `Tutorial`，完成了每一章末尾所有的示例和挑战。从头到尾坚持下去，不要跳跃，你将获得最大的益处。\n\n阅读愉快！\n\
  \n（注：原文中存在大量重复内容，此处已按要求保留核心翻译内容）\n\n\n\n\n我要感谢技术审阅员 Andrew Thal 对手稿的仔细审阅以及提供的宝贵建议。我还要感谢我在\
  \ Learn Enough to Be Dangerous 的共同创人 Nick Merwin 和 Lee Donahoe，感谢他们在准备本教程过程中提供的所有帮助。\n\
  \n最后，非常多的读者——多到无法逐一列举——在本书编写期间贡献了大量的错误报告和建议，我衷心感谢他们的帮助，使这本书变得尽可能完美。\n\n## 关于作者\n\
  \n`Michael Hartl` 是 `Ruby on Rails`^™ `Tutorial` 的作者，该教程是领先的 Web 开发入门教程之一，他也是教育网站\
  \ Learn Enough to Be Dangerous (`learnenough.com`) 的创始人。他此前的经历包括编写和开发 `RailsSpace`（一本已经完全过时的\
  \ Rails 教程书）以及开发 `Insoshi`（一个曾经流行但现在已过时的 Ruby on Rails 社交平台）。2011 年，Michael 因其对\
  \ Ruby 社区的贡献荣获了 Ruby Hero 奖。他毕业于哈佛学院，拥有加州理工学院物理学博士学位，并且是 Y Combinator 创业计划的校友。\n\
  \n## 第 1 章：从零到部署\n\n欢迎阅读 `Ruby on Rails`^™ `Tutorial: Learn Web Development with\
  \ Rails`。本书的目的是教你如何开发自定义 Web 应用程序，我们选择的工具是流行的 Ruby on Rails Web 框架。除了关注 Web 开发的通用原则（而非专门针对\
  \ Rails），`Ruby on Rails`^™ `Tutorial` 还教授了更广泛的技能——`技术深度`（technical sophistication）(Box\
  \ 1.1)，这是 Learn Enough to Be Dangerous 教程发展的主题之一。¹特别是，Learn Enough 的入门系列由一系列教程组成，适合作为\
  \ `Ruby on Rails`^™ `Tutorial` 的先课程，从 `Learn Enough Command Line to Be Dangerous`²\
  \ 开始，该教程（与本教程不同）面向完全的初学者。\n\n1. `learnenough.com/story`\n\n2. `learnenough.com/command-line`\n\
  \n***\n\n### Box 1.1：技术深度\n\n`Ruby on Rails`^™ `Tutorial` 是 Learn Enough to Be Dangerous\
  \ 教程系列的一部分，该系列发展了`技术深度`这一主题：硬技能和软技能的结合，这让你看起来像变魔法一样可以解决任何技术问题。Web 开发以及通用的计算机编程是技术深度的核心组成部分，但不仅于此——你还需要知道如何通过点击菜单项来学习特定应用程序的功能，如何通过\
  \ Google 搜索来澄清困惑的错误信息，或者何时该放弃并直接重启那个该死的机器。\n\n由于 Web 应用程序有许多活动部分，它们为你提高技术深度提供了充足的机会。在\
  \ Rails Web 开发的背景下，技术深度的某些具体示例包括：确保你使用了正确的 Ruby gem 版本、运行 `bundle install` 或 `bundle\
  \ update`，以及在某些不起作用时重启本地 Web 服务器。（如果这些听起来像胡言乱语，请担心；我们将在完成本教程的过程中涵盖这里提到的所有内容。）\n\n\
  当你继续学习本教程时，很可能会偶尔会被某些没有按预期运行的事情所困扰。尽管某些特别棘手的步骤在正文中被明确标出，但无法预料所有可能发生的错误。我建议你将这些不可避免的障碍视为提高技术深度的机会。或者，正如我们极客所说的话：*这不是\
  \ Bug，这是一个特性！*\n\n***\n\n`Ruby on Rails`^™ `Tutorial` 旨在让你对 Web 应用程序开发有一个全面的介绍，包括对\
  \ Ruby、Rails、HTML & CSS、数据库、版本控制、测试和部署的基础知识——这足以让你开启 Web 开发者或技术创业者的职业生涯。如果你已经了解\
  \ Web 开发，这本书将快速教你 Rails 框架的精要内容，包括 MVC 和 REST、生成器（generators）、迁移（migrations）、路由（routing）和嵌入式\
  \ Ruby（embedded Ruby）。无论如何，当你完成 `Ruby on Rails`^™ `Tutorial` 后，你将能够从蓬勃发展的编程教育生态系统中许多更高级书籍、博客和视频录制课程中获益。³\
  \ 其中一种资源是 `Ruby on Rails Tutorial LiveLessons` 视频屏课程，可以在 `informit.com/rubyrailsvid`\
  \ 获取。\n\n3. `Ruby on Rails`^™ `Tutorial` 的最新版本可以在书籍的网站 [`www.railstutorial.org/`](http://www.railstutorial.org/)\
  \ 上找到。如果你是在离线阅读这本书，请确保在 [http://www.railstutorial.org/book] 查看在线版的 Rails Tutorial\
  \ 书籍以获取最新更新。\n\n`Ruby on Rails`^™ `Tutorial` 采用集成方法进行 Web 开发，通过构建三个复杂度不断增加的示例应用程序，从一个极简的\
  \ `hello` 应用 (Section 1.3)、一个功能稍强的 `toy` 应用 (第 2 章) 以及一个真实的 `sample` 应用 (从第 3 章\
  \ 到 第 14 章)）。正如名称所示，`Ruby on Rails`^™ `Tutorial` 中开发的应用程序并不适用于任何类型的网站。最后的示例应用程序与\
  \ Twitter 有相似之处（巧合的是，它最初是用 Rails 编写的），但整个教程强调的是通用原则，因此无论你想构建什么样的 Web 应用程序都将拥有坚实的基础。\n\
  \n在第一章中，我们将通过安装所有必要的软件和设置开发环境来开始 Ruby on Rails (Section 1.2)。我们将创建一个第一个 Rails 应用，命名为\
  \ `hello_app`。本教程强调良好的软件开发实践，因此在创建新项目后，我们立即使用 `Git` 对其进行版本控制 (Section 1.4)。而且，你可能相信，在本章中我们通过*部署*到生产环境将第一个应用发布到互联网\
  \ (Section 1.5)。\n\n在第 2 章 中，我们将制作第二个项目，目的是演示 Rails 应用程序的基本原理。为了快速上手，我们将使用 `scaffolding`（脚架）(Box\
  \ 1.2) 生成代码，来构建这个 `toy app`（命名为 `toy_app`）；因为这些代码既丑又复杂，第 2 章 将侧重于通过 浏览器使用其 `URIs`（通常称为\
  \ `URLs`）⁴ 与玩具应用进行交互。\n\n4. `URI` 代表统一资源标识符，而稍微不那么泛的 `URL` 代表统一资源定位符。在实践中，URL 通常等同于“你在浏览器地址栏中看到的内容”。\n\
  \n\n\n\n\n教程的剩余部分将重点于开发一个单一的大型示例应用程序（称为 `sample_app`），从零开始编写所有代码。我们将结合`mockups`（原型设计）、`测试驱动开发`（TDD）和`集成测试`来开发这个示例应用。我们将在第\
  \ 3 章中开始，首先创建静态页面，然后添加一些动态内容。我们将在第 4 章中稍作停顿，学习一下 Rails 底层的 Ruby 语言。接着，在第 5 章中，我们将通过制作站点布局、用户数据模型以及一套完整的注册和身份验证系统（包括账户激活和密码重置）来完成示例应用的基础工作。最后，在第\
  \ 13 章和第 14 章中，我们将添加微博客和社交功能，创建一个可以运行的示例站点。\n\n***\n\n## 框 1.2：脚手架：更快、更简单、更具诱惑\n\
  \n从一开始开始，Rails 就受益于一种明显的兴奋感，这始于 Rails 创造者 David Heinemeier Hansson 那段著名的 15 分钟网络博客视频。这段视频及其后续视频是体验\
  \ Rails 强大极佳方式，我建议观看它们。但请注意：它们是使用一个名为 `scaffolding`（脚手架）的功能完成了令人惊叹的十五分钟成就，而该功能高度依赖于由\
  \ `rails generate scaffold` 命令魔法生成的`generated code`。\n\n在编写 Ruby on Rails 教程时，依赖脚手架方法是非常吸引人的——它更快、更简单、更具诱惑。但脚手架中的复杂性和海量代码对于初学\
  \ Rails 开发者来说可能完全无从从心；你可能可以使用它，但可能无法理解它。遵循脚手架方法可能会导致你变成一个精通脚本的生成器，而对 Rails 几乎没有（且是脆弱的）实际知识。\n\
  \n在*Ruby on Rails*^™ *Tutorial*中，我们将采取（几乎）完全相反的方法：尽管第 2 章将使用脚手架开发一个小玩具应用，但*Rails\
  \ Tutorial*的核心是这个示例应用，我们从第 3 章开始编写它。在开发示例应用的每个阶段，我们都会编写`small, bite-sized`（小巧易读）的代码——简单到易理解，又新颖到具有挑战性。累积效应将更深入、更灵活的\
  \ Rails 知识，为你编写几乎任何类型的 Web 应用提供良好的背景。\n\n***\n\n## 1.1 引言\n\nRuby on Rails（或简称为“Rails”）是一种用\
  \ Ruby 编程语言编写的 Web 开发框架。自 2004 年发布以来，Ruby on Rails 迅速成为构建动态 Web 应用最强大、最流行的工具之一。Airbnb、Basecamp、Disney、GitHub、Hulu、Kickstarter、Shopify、Twitter\
  \ 和 Yellow Pages 等公司都在使用 Rails。还有许多从事 Rails 的 Web 开发公司，如 ENTP、thoughtbot、Pivotal\
  \ Labs、Hashrocket 和 HappyFunCorp，以及无数的独立顾问、培训师和承包商。\n\n什么是 Rails 如此强大的原因？首先，Ruby\
  \ on Rails 是 100% 开源的，根据慷的 MIT 许可证可用，因此下载或使用无需费用。Rails 的成功很大程度上归功于它优雅且紧凑的设计；通过利用底层\
  \ Ruby 语言的弹性，Rails 有效地创建了一个用于编写 Web 应用的领域特定语言。因此，许多常见的 Web 编程任务——如生成 HTML、创建数据模型和路由\
  \ URL——使用 Rails 变得轻而易举，生成的应用程序代码简洁易读。\n\nRails 还能快速适应 Web 技术和框架设计的新进展。例如，Rails 是首批充分消化并实现用于构建\
  \ Web 应用的 REST 架构风格框架框架（我们将在整个教程中学习它）。当其他框架开发出成功的新技术时，Rails 创造者 David Heinemeier\
  \ Hansson 和 Rails 核心团队并不犹豫吸纳他们的想法。也许最戏剧性的例子是 Rails 与竞争对手 Ruby Web 框架 Merb 的合并，使得\
  \ Rails 现在受益于 Merb 的模块化设计、稳定的 API 和改进的性能。\n\n最后，Rails 受益于一个异常热烈且支持的社区。其成果包括数千名开源贡献者、有趣且信息丰富的会议、大量的`gems`（解决特定问题如分页和图像上传的自包含解决方案）、丰富多样的资讯博客以及大量的讨论论坛和\
  \ IRC 频道。大量的 Rails 程序员也让处理不可避免的应用程序错误变得更加容易：“搜索错误信息”算法几乎总是能产生相关的博客文章或讨论论坛帖子。\n\n\
  ### 1.1.1 前提条件\n\n本书没有正式的先决条件，且*Ruby on Rails*^™ *Tutorial* 包含了不仅针对 Rails，还针对其底层的\
  \ Ruby 语言、默认的 Rails 测试框架（`minitest`）、Unix 命令行、HTML、CSS、少量的 JavaScript 甚至一点 SQL 的集成教程。不过，有很多材料需要吸收，我通常建议在开始本教程之前具备一些\
  \ HTML 和编程背景。如果你是软件开发的新手，我建议从 Learn Enough to Be Dangerous 的教程开始：5。在编写此书时，命令行、文本编辑器、Git\
  \ 和 HTML 教程已经完成，其他教程正在开发中。\n\n**1. 开发者基础**\n- `Learn Enough Command Line to Be Dangerous`\n\
  - `Learn Enough Text Editor to Be Dangerous`\n- `Learn Enough Git to Be Dangerous`\n\
  \n**2. Web 基础**\n- `Learn Enough HTML to Be Dangerous`\n- `Learn Enough CSS & Layout\
  \ to Be Dangerous`\n- `Learn Enough JavaScript to Be Dangerous`\n\n**3. 入门 Ruby\
  \ 开发**\n- `Learn Enough Ruby to Be Dangerous`\n- `Learn Enough Sinatra to Be Dangerous`\n\
  - `Learn Enough Ruby on Rails to Be Dangerous`\n\n**4. 专业 Ruby Web 开发**\n- *Ruby\
  \ on Rails*^™ *Tutorial*\n\n学习 Rails 时一个常见问题是先学 Ruby。答案取决于你的个人学习风格和已有的编程经验。如果你喜欢系统地从零学习一切，或者你以前从未编程过，那么先学\
  \ Ruby 可能适合你，情况下建议遵循上述完整的 Learn Enough 序列。另一方面，许多初 Rails 开发者对制作*Web* 应用感到兴奋，不想在编写第一个\
  \ Web 页面之前读完整个 Ruby 书。在这种情况下，我建议尝试本教程，如果证明挑战太大，再切换到 Learn Enough 序列。\n\n在教程结束，无论你从哪里开始，你都应该准备好面对更多中高级的\
  \ Rails 资源。以下是我特别推荐的：\n\n- Learn Enough Society：高级订阅服务，包括 *Ruby on Rails*^™ *Tutorial*\
  \ 书的特别增强版本以及 15 多小时的流媒体视频课程，里面充满了从书籍无法获得的技巧、诀和现场演示。还包括其他 Learn Enough 教程的文本和视频。提供学金折扣。\n\
  - Code School：良好的互动在线编程课程\n- The Turing School of Software & Design：位于科罗拉多州丹佛的为期\
  \ 27 周的全职培训计划。\n\n\n\n\n\n-   **Bloc**: 一个在线训练营，具有结构化的课程设置、个性化的导师指导，并侧重于通过具体项目进行学习。使用优惠码\
  \ `BLOCLOVESHARTL` 可享报名费减免 500 元。\n-   **Launch School**: 一个非常优秀的在线 Rails 开发训练营（包含进阶材料）。\n\
  -   **Firehose Project**: 一个由导师驱动的在线编码训练营，侧重于实世界的编程技能，如测试驱动开发、算法以及作为敏捷团队的一员构建高级\
  \ Web 应用。提供为期两周的免费介绍课程。\n-   **Thinkful**: 一门在线课程，在你完成基于项目的课程学习时，它会为你配备一名专业工程师进行指导。\n\
  -   **Pragmatic Studio**: 由 Mike 和 Nicole Clark 提供的在线 Ruby 和 Rails 课程。与 *Programming\
  \ Ruby* 的作者 Dave Thomas 一起，Mike 曾在 2006 年教过我上的第一门 Rails 课程。\n-   **RailsApps**:\
  \ 包含各种详细的特定主题 Rails 项目和教程。\n-   **Rails Guides**: 主题化且最新的 Rails 参考文档。\n\n## 练习\n\
  \n`Ruby on Rails`^™ `Tutorial` 包含了大量的练习。强烈建议你在学习教程的过程中完成这些练习。购买了书籍的用户可以在 `http://railstutorial.org/solutions`\
  \ 获取练习解答。\n\n为了保持主讨论内容与练习独立，解答通常不会整合到随后的代码示例中。（在极少数情况下，如果后续使用了某个练习解答，会在正文中明确给出解答。）这意味着随着时间的推移，你的代码可能会因为练习中引入差异而与教程所示代码有所不同。学习如何解决此类差异是提升技术成熟度的一项非常有价值的练习（Box\
  \ 1.1）。\n\n为了记录你的答案并查看解答，你可以加入 Learn Enough Society，这是 Learn Enough To Be Dangerous\
  \ 的一项订阅服务，包含 `Ruby on Rails`^™ `Tutorial` 的特殊增强版本。\n\n许多练习都具有挑战性，但我们先从一些简单的练习开始来热身：\n\
  \n**1.** 哪个网站托管了 Ruby on Rails 使用的 `Ruby gem`？*提示*：如果不确定，就 Google 搜索一下。\n\n**2.**\
  \ Rails 的当前版本号是多少？\n\n**3.** 截至为止，Ruby on Rails 总共被下载了多少次？\n\n### 1.1.2 本书中使用的约定\n\
  \n本书中使用的约定大部分是不言自明的。在本节中，我们将介绍一些可能不那么直观的约定。\n\n书中的许多示例使用了命令行命令。为了简单起见，所有命令行示例都使用\
  \ Unix 风格的命令行提示符（美元符号 `$`），如下：\n\n点击此处查看代码图片\n\n```\n$ echo \"hello, world\"\n\n\
  hello, world\n```\n\nRails 带有许多可以在命令行运行的命令。例如，在第 1.3.2 节 中，我们将使用 `rails server`\
  \ 命令运行一个本地开发 Web 服务器：\n\n```\n$ rails server\n```\n\n与命令行提示符一样，`Rails Tutorial`\
  \ 使用 Unix 约定的目录分隔符（即正斜杠 `/`）。例如，示例应用程序 `production.rb` 配置文件所示：\n\n点击此处查看代码图片\n\n\
  ```\nconfig/environments/production.rb\n```\n\n此文件路径应理解为相对于应用程序根目录的，这会随系统而异；在云 IDE（第\
  \ 1.2.1 节）中，它看起来如下：\n\n点击此处查看代码图片\n\n```\n/home/ubuntu/workspace/sample_app/\n```\n\
  \n因此，`production.rb` 的完整路径为\n\n点击此处查看代码图片\n\n```\n/home/ubuntu/workspace/sample_app/config/environments/production.rb\n\
  ```\n\n我通常会省略应用程序路径，简写为 `config/environments/production.rb`。\n\n`Rails Tutorial`\
  \ 经常显示各种程序的输出。由于不同计算机系统之间存在无数细微差异，你看到的输出可能并不与文中显示的完全一致，但这并不担心。此外，某些命令可能会根据你的系统产生错误；与其尝试在教程中记录所有此类错误（这是一项西西弗式的任务），我将这项任务交给“Google\
  \ 错误信息”算法，这在现实软件开发中也是一种良好的实践（Box 1.1）。如果你在遵循教程时遇到任何问题，我建议参考 Rails Tutorial 帮助页列出的资源。⁶\n\
  \n6. railstutorial.org/help`\n\n由于 `Rails Tutorial` 涵盖了 Rails 应用的测试，因此了解特定代码会导致测试套件失败（红色表示）还是通过（由绿色表示）通常很有帮助。为了方便电子版阅读，导致测试失败的代码标记为**红色**，而导致测试通过的代码标记为**绿色**。\n\
  \n最后，为了方便起见，`Ruby on Rails`^™ `Tutorial` 采用了两种约定，旨在使许多代码示例更容易理解。首先，某些代码列表包含一个或多个高亮行，如下：\n\
  \n点击此处查看代码图片\n\n```\nclass User < ApplicationRecord\n\n  validates :name, presence:\
  \ true\n  validates :email, presence: true\nend\n```\n\n此类高亮行通常指示示例中最重要的代码，并且（并非总是）代表当前代码与之前代码之间的差异。其次，为了简洁，书中的许多代码列表包含了省略号，如下：\n\
  \n点击此处查看代码图片\n\n```\nclass User < ApplicationRecord\n\n  .\n  .\n  .\n  has_secure_password\n\
  end\n```\n\n这些点表示省略的代码，不应直接复制。\n\n### 1.2 开始\n\n即使对于经验丰富的 Rails 开发者来说，安装 Ruby、Rails\
  \ 以及所有相关的支持软件也可能是令人沮丧的。增加困难的是环境的多样：不同的操作系统、版本号、编辑器和集成开发环境（IDE）的偏好等。`Ruby on Rails`^™\
  \ `Tutorial` 为此问题提供了两种建议。一种方案是遵循 1.1.1 节中提到的 Learn Enough 入门序列，这将引导出一个适用于本教程的系统。\n\
  \n另一种方案（针对新用户推荐）是使用*云端集成开发环境*（即云 IDE）来跳过此类安装和配置问题。本教程使用的云 IDE 运行在普通的浏览器中，因此在不同平台上表现一致，这对于传统上\
  \ Rails 开发困难的操作系统（如 Windows）特别有用。它还能维护你的工作状态，因此你可以暂停教程并在回来时回到离开时的状态。\n\n#### 1.2.1\
  \ 开发环境\n\n考虑到各种个性化定制，开发环境的数量可能和 Rails 程序员的数量一样多。为了避免这种复杂性，`Ruby on Rails`^™ `Tutorial`\
  \ 标准使用了优秀的云开发环境 Cloud9。特别地，我很高兴能与 Cloud9 合作，提供一个为本教程需求定制的免费开发环境。生成的 Rails Tutorial\
  \ Cloud9 工作区已预配置了专业级 Rails 开发所需的大软件，包括 Ruby、RubyGems 和 Git。（事实上，我们唯一单独安装的大型软件是 Rails\
  \ 本，这是刻意为之的第 1.2.2 节]。）\n\n\n\n\n\n云 IDE 还包含了开发 Web 应用程序所需的三个核心组件：文本编辑器、文件系统导航器和命令行终端（图\
  \ 1.1）。其他功能外，云 IDE 编辑器支持“在文件中查找”全局搜索，我认为这对于浏览任何大型 Ruby 或 Rails 项目都是至关重要的。⁷ 最后，即使你决定在现实生活中不专门使用云\
  \ IDE（我确实建议也学习其他工具），它也为文本编辑器和其他开发工具的通用功能提供了一个极佳的入门。\n\n7。例如，要查找名为 `foo` 的函数定义，你可以对“def\
