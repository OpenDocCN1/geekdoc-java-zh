  \ 的书籍和视频的评价\n\n“我的前公司（CD Baby）是首批大声转向 Ruby on Rails 的公司之一，随后又更大声地转回 PHP。（搜索我的名字了解这段戏剧）。Michael\
  \ Hartl 的这本书被极力推崇，我不得不尝试一下，而 `Ruby on Rails^™ 教程` 正是我再次切换回 Rails 时使用的工具。”\n——来自\
  \ Derek Sivers 前言 (sivers.org)\n曾任：CD Baby 创始人\n现任：Thoughts Ltd. 创始人\n\n“Michael\
  \ Hartl 的 Rails 教程是学习 Rails 相关书籍的首选（在我看来也是唯一的）起点。……这是一件不可思议的作品，而且与不同的是，它带你从头到尾通过测试构建了一个\
  \ Rails 应用程序。如果你只想读一本书并在读完后感觉自己像个 Rails 大师，请选择 `Ruby on Rails^™ 教程`。”\n——Peter Cooper，《Ruby\
  \ Inside》编辑\n\n“对于对‘学中学做’方法反响良好并准备好努力的自律读者，强烈推荐这本书。”\n——Ian Elliot，m Programmer\
  \ 评论员\n\n“`Ruby on Rails^™ 教程` 的工作量很大，但如果你细心且耐心，你会学到很多。”\n——Jason Shen，科技创业者\n\n\
  “Michael Hartl 的 `Ruby on Rails^™ 教程` 无缝缝地教会了我不仅是 Ruby on Rails，还有底层语言、HTML、CSS、一点点\
  \ JavaScript，最重要的是，它向我展示了如何在短时间内构建 Web 应用程序（Twitter）。”\n——Mattan Griffel，One Month\
  \ 联合创始人\n\n“虽然我的职业是一名 Python/Django 开发者，但我无法强调这本书对我帮助有多大了。作为一名完全脱离行业的本科生，这本书向我展示了如何使用版本控制，如何编写测试，最重要的是——尽管设置和运行的学习曲线非常陡峭——但坚持的最终结果是非常令人欣悦的。它让我重新爱上了技术。这是我向所有想要开始学习编程/构建东西的朋友推荐的书。感谢你，Michael！”\n\
  ——Prakhar Srivastav，软件工程师，Xcite.com, 库威特\n\n“你认为自己未来将开发什么，或者当今流行的框架是什么这并不重要；如果你想学习如何构建东西，没有比这本教程更好的起点了。对于所有那些想要看到自己的想法实现的‘非技术人员’，那些正在考虑雇佣承包商、为课程付费，或在寻找技术合伙人时进行‘创始人相亲’的人来说：停下。退后一步。暂时忘记你的想法，沉浸在这本教程中，学习构建一个东西需要什么。你和你的软件相关项目将受益匪浅。”\n\
  ——Vincent C.,创业者和开发者\n\n“这是我见过的此类书籍中写得最好的，我怎么推荐都不为。”\n——Daniel Hollands，Birmingham.IO\
  \ 管理\n\n“对于想学习 Ruby on Rails 的人，Hartl 的 `Ruby on Rails^™ 教程`（在我看来）是最好的方法。”\n——David\
  \ Young，软件开发者，deepinthecode.com 作者\n\n“这是一个非常棒的教程，原因有很多，因为除了教授 Rails 之外，Hartl 还在教授良好的开发实践。”\n\
  ——Michael Denomy，全栈 Web 开发者\n\n\n\n\n\n“毫无疑问，我学习 Ruby on Rails 的最佳方法就是构建一个实际运行的应用程序。我使用了\
  \ Michael Hartl 的 *Ruby on Rails*^™ *Tutorial*，它教了我如何从零开始构建并运行一个非常基础的类 Twitter 应用。我怎么推荐这个教程都不够；快速让东西运行起来是关键；这比死记硬背要高效万倍。”\n\
  —James Fend，连续创业者，JamesFend.com\n\n“这本书为你提供了理论和实践，而视频则侧重于向你亲自演示如何操作。非常推荐这种组合方式。”\n\
