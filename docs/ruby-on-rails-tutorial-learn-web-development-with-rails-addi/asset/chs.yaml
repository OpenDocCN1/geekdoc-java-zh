  \ 7.24:** 浏览器刷新后没有 flash 消息的个人页面。\n\n\n\n\n购买任何 Rails Tutorial 均可在 `railstutorial.org/solutions`\
  \ 免费获取练习题解答。要查看他人的答案并记录你自己的答案，请加入 `learnenough.com/society` 的 Learn Enough Society。\n\
  \n1.  使用 `rails console`，通过电子邮件地址查找，以双重检查新用户是否已实际创建。结果应该像 列表 7.32 所示。\n\n2.  使用你的主邮箱地址创建一个新用户。验证\
  \ Gravatar 是否正确显示。\n\n**列表 7.32：** 在数据库中查找新创建的用户。\n\n点击此处查看代码图像\n\n* * *\n\n```\n\
  $ rails console\n>> User.find_by(email: \"example@railstutorial.org\")\n=> #<User\
  \ id: 1, name: \"Rails Tutorial\", email: \"example@railstutorial.org\", created_at:\
  \ \"2016-05-31 17:17:33\", updated_at: \"2016-05-31 17:17:33\", password_digest:\
  \ \"$2a$10$8MaeHdnOhZvMk3GmFdmpPOeG6a7u/k2Z9TMjOanC9G...\">\n```\n\n* * *\n\n###\
  \ 7.4.4 有效提交的测试\n\n在继续之前，我们将为有效提交编写一个测试，用以验证应用程序的行为并捕获回归问题。与 章节 7.3.4 中对无效提交的测试一样，我们的主要目标是验证数据库的内容。在这种情况下，我们希望提交有效信息，然后确认用户*确实*被创建了。与\
  \ 列表 7.23 类似，该列表使用了\n\n点击此处查看代码图像\n\n```ruby\nassert_no_difference 'User.count'\
  \ do\n  post users_path, ...\nend\n```\n\n在这里我们将使用相应的 `assert_difference` 方法：\n\n\
  点击此处查看代码图像\n\n```ruby\nassert_difference 'User.count', 1 do\n  post users_path,\
  \ ...\nend\n```\n\n与 `assert_no_difference` 一样，第一个参数是字符串 `'User.count'`，它安排了 `assert_difference`\
  \ 块执行前后 `User.count` 之间的比较。第二个（可选）参数指定了差异的大小（在本例中为 1）。\n\n将 `assert_difference`\
  \ 整合到来自 列表 7.23 的文件中，会得到如 列表 7.33 所示的测试。注意，我们在向 users 路径提交后后使用了 `follow_redirect!`\
  \ 方法。这仅仅是安排在提交后跟随重定向，导致渲染 `'users/show'` 模板。（为 flash 也写一个测试可能也是个好主意，这被留作了一个练习：[章节\
  \ 7.4.4]。）\n\n**列表 7.33：** 有效注册的测试。`Green`\n\ntest/integration/users_signup_test.rb\n\
  \n点击此处查看代码图像\n\n* * *\n\n```ruby\nrequire 'test_helper'\nclass UsersSignupTest <\
  \ ActionDispatch::IntegrationTest\n  test \"valid signup information\" do\n    get\
  \ signup_path\n    assert_difference 'User.count', 1 do\n      post users_path,\
  \ params: { user: { name:  \"Example User\",\n                                 \
  \       email: \"user@example.com\",\n                                        password:\
  \          \"password\",\n                                        password_confirmation:\
  \ \"password\" } }\n    end\n    follow_redirect!\n    assert_template 'users/show'\n\
  \  end\nend\n```\n\n* * *\n\n注意，列表 7.33 还验证了用户注册后渲染了用户显示页面。为了让此测试工作，所需的 `Users`\
  \ 路由 (#part0016.xhtml_list7_3)、`show`  (#part0016.xhtml_list7_5) 以及 `show.html.erb`\
  \ 视图 (#part0016.xhtml_list7_8) 必须正常工作。因此，`assert_template 'users/show'` 这一行是对用户资料页相关所有内容的敏感测试。这种对重要功能的端到端覆盖说明了为什么集成测试如此有用。\n\
