  \ digest）与记忆令牌不正确匹配，则当前用户应为 `nil`，从而测试了嵌套 `if` 语句中的 `authenticated?` 表达式：\n\n点击此处查看代码\n\
  \n```ruby\nif user && user.authenticated?(cookies[:remember_token])\n```\n\n顺带一提，在列表\
