  \ 的：\n\n**列表 5.26：绿色**\n\n`$ rails test`\n\n#### 5.3.2 Rails 路由\n\n为了给示例应用的静态页面添加命名路由，我们将编辑路由文件\
  \ `config/routes.rb`，Rails 使用该文件来定义 URL 映射。我们将首先回顾主页的路由（定义在第 3.4.4 节中），这是一个特殊情况，然后为剩余的静态页面定义一组路由。\n\
  \n到为止，我们已经看到了三个定义根路由的示例，首先是 hello 应用中的代码：\n\n`root 'application#hello'`\n\n（列表 1.10），其次是\
