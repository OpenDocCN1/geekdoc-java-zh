  #{attribute}_digest\")\n  return false if digest.nil?\n  BCrypt::Password.new(digest).is_password?(token)\n\
  end\n```\n\n我们现在可以通过这样调用它来重现 `authenticated?` 之前的行为：\n\n点击此处查看代码图片\n\n```ruby\n\
  user.authenticated?(:remember, remember_token)\n```\n\n将此讨论应用于 User 模型，可以得到如 列表\
