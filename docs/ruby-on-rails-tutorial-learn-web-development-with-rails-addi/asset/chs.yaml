  3. 通过尝试创建一个内容超过 140 个字符的微推，确认列表 2.13 中的验证在生产环境应用中有效。\n\n### 2.4 结论\n\n我们现在已经完成了\
  \ Rails 应用的高级概述。在本章开发的玩具应用有几个优点，也有许多缺点。\n\n### 优点\n\n* Rails 高级概述\n* MVC 介绍\n* REST\
  \ 架构的初体验\n* 数据建模开始\n* 一个在生产环境中运行的、基于数据库的 Web 应用\n\n### 缺点\n\n* 没有自定义布局或样式\n* 没有静态页面（如“首页”或“关于我们”）\n\
  * 没有用户密码\n* 没有用户头像\n* 没有登录功能\n* 没有安全性\n* 没有自动的用户/微推关联\n* 没有“关注”或“被关注”的概念\n* 没有微推流\n\
  * 没有意义的测试\n* 没有真正的理解\n\n教程的其余部分专注于基于优点并消除缺点。\n\n#### 2.4.1 我们在本章中学了什么\n\n* Scaffolding（脚手架）自动创建用于数据建模以及通过\
  \ Web 交互的代码。\n* Scaffolding 有于快速上手，但不利于理解。\n* Rails 使用模型-视图-控制器（MVC）模式来构建 Web 应用程序。\n\
  * 根据 Rails 的解释，REST 架构包含了一组标准的 URL 和控制器操作，用于与数据模型交互。\n* Rails 支持数据验证，可以对数据模型属性的值设置约束。\n\
  * Rails 内置了函数，用于定义不同数据模型之间的关联。\n* 我们可以使用 Rails console 在命令行与 Rails 应用进行交互。\n\n#\
  \ 第 3 章 大多数静态页面\n\n在本章中，我们将开始开发专业级的示例应用，它将作为本教程其余部分的示例。虽然示例应用最终将拥有用户、微推以及完整的登录和身份验证框架，但我们将从一个看似有限的话题开始：创建静态页面。尽管表面简单，但制作静态页面是一项非常有教育意义的练习，内涵深远——是我们新生应用的完美开始。\n\
  \n虽然 Rails 设计用于用于创建基于数据库的动态网站，但它也擅长创建使用原始 HTML 文件可能创建的静态页面。事实上，即使使用 Rails 制作静态页面也有明显的优势：我们可以轻松添加少量的动态内容。在本章中我们将学习如何做到。在此过程中，我们将首次尝试自动化测试，这将帮助我们更有信心代码是正确的。此外，良好的测试套件将允许我们放心地重构代码，在不改变功能的情况下改变其形式。\n\
  \n## 3.1 示例应用设置\n\n与第 2 章 ，在开始之前，我们需要创建一个新的 Rails 项目，这次命名为 `sample_app`，如列表 3.1\
