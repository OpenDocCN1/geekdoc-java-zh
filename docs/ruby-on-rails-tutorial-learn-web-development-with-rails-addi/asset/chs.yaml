  ### 框 7.1: Rails 环境\n\nRails 提供了三个环境：test、development 和 production。Rails 控制台的默认环境是\
  \ development：\n\n点击此处查看代码图像\n\n```bash\n$ rails console\nLoading development environment\n\
  >> Rails.env\n=> \"development\"\n>> Rails.env.development?\n=> true\n>> Rails.env.test?\n\
  => false\n```\n\n如你所见，Rails 提供了一个具有 `env` 属性和相关环境布尔值方法的 `Rails` 对象，以便例如，`Rails.env.test?`\
  \ 在测试环境中返回 `true`，在其他情况下返回 `false`。\n\n如果你需要在不同的环境中运行控制台（例如，为了调试测试），可以将环境作为参数传递给控制台脚本：\n\
  \n```bash\n$ rails console test\nLoading test environment\n>> Rails.env\n=> \"test\"\
  \n>> Rails.env.test?\n=> true\n```\n\n与控制台一样，development 是 Rails 服务器的默认环境，但你也可以在不同的环境中运行它：\n\
  \n点击此处查看代码图像\n\n```bash\n$ rails server --environment production\n```\n\n如果你查看在生产环境中运行的应用程序，没有生产数据库将无法工作，我们可以通过在生产环境中运行\
  \ `rails db:migrate` 来创建它：\n\n点击此处查看代码图像\n\n```bash\n$ rails db:migrate RAILS_ENV=production\n\
