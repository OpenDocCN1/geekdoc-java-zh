  \n### 9.1.4 两个细微的缺陷\n\n还有两个紧密相关的细微之处需要处理。第一个细微之处是，尽管“注销（Log out）”链接只在登录后才显示，但用户可能同时打开了多个该网站的浏览器窗口。如果用户在其中一个窗口中注销，从而将\
  \ `current_user` 设置为 `nil`，那么在第二个窗口中点击“注销”链接会导致错误，因为在 `log_out` 方法中执行了 `forget (current_user)`\
  \ (列表 9.12)。我们可以通过只在用户已登录时执行注销来避免这个问题。\n\n[12.] 感谢读者 Paulo Célio Júnior 指出这一点。\n\
  \n第二个细微之处是，用户可能在多个浏览器（如 Chrome 和 Firefox）中登录（并被记住），如果用户在第一个浏览器中注销但在第二个浏览器中没有，然后关闭并重新打开第二个浏览器，就会产生问题。例如，假设用户在\
  \ Firefox 中注销，从而将记忆口令（remember digest）设为 `nil`（通过 列表 9.11 中的 `user.forget`）。该应用程序在\
  \ Firefox 中仍然可以工作；因为 列表 9.12 中的 `log_out` 方法删除了用户的 id，导致两个高亮的条件判断均为 `false`：\n\n\
  [13.] 感谢读者 Niels de Ron 指出这一点。\n\n点击此处查看代码图片\n\n***\n\n# 返回对应 remember token cookie\
  \ 的用户。\n\n```ruby\ndef current_user\n  if (user_id = session[:user_id])\n    @current_user\
  \ ||= User.find_by(id: user_id)\n  elsif (user_id = cookies.signed[:user_id])\n\
  \    user = User.find_by(id: user_id)\n    if user && user.authenticated?(cookies[:remember_token])\n\
  \      log_in user\n      @current_user = user\n    end\n  end\nend\n```\n\n结果，评估执行到\
  \ `current_user` 方法的末尾，从而按照要求返回 `nil`。\n\n相比之下，如果我们关闭 Chrome，会将 `session[:user_id]`\
  \ 设置为 `nil`（因为所有 `session` 变量都会在浏览器关闭时自动过期），但 `user_id` cookie 仍然存在。这意味着当 Chrome\
  \ 重新启动时，相应的用户仍会被从数据库中提取：\n\n点击此处查看代码图片\n\n```ruby\ndef current_user\n  if (user_id\
  \ = session[:user_id])\n    @current_user ||= User.find_by(id: user_id)\n  elsif\
  \ (user_id = cookies.signed[:user_id])\n    user = User.find_by(id: user_id)\n \
  \   if user && user.authenticated?(cookies[:remember_token])\n      log_in user\n\
  \      @current_user = user\n    end\n  end\nend\n```\n\n因此，内部的 `if` 条件将进行评估：\n\n\
  点击此处查看代码图片\n\n```ruby\nuser && user.authenticated?(cookies[:remember_token])\n```\n\
  \n特别地，由于 `user` 不是 `nil`，第二个表达式将被评估，从而引发错误。这是因为用户的记忆口令在 Firefox 中已作为注销的一部分被删除了 (列表\
  \ 9.11)，所以当我们在 Chrome 中访问应用程序时，最终调用了\n\n点击此处查看代码图片\n\n```ruby\nBCrypt::Password.new(remember_digest).is_password?(remember_token)\n\
  ```\n\n使用一个 `nil` 的记忆口令调用，从而在库内部抛出异常。为了修复这个问题，我们希望 `authenticated?` 返回 `false`。\n\
  \n这些都是从测试驱动开发中获益的细微之处，因此我们将编写测试来捕获这两个错误。我们首先让 列表 8.31 中的集成测试变为 RED，如 列表 9.14 所示。\n\
