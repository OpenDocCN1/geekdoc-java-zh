  \n### 6.4 结论\n\n从零开始，我们在本章中创建了一个具有名称、邮箱和密码属性的可用 User 模型，并带有对这些值执行若干个重要约束的验证。此外，我们还了使用给定密码安全地验证用户的能力。对于仅仅十二行代码来说，这是一个令人惊叹的功能。\n\
  \n在下一章第 7 章中，我们将创建一个可用的注册表单来创建新用户，并带有显示每个用户信息的页面。在第 8 章中，我们将使用来自第 6.3 节的验证机制让用户登录网站。\n\
  \n如果你正在使用 Git，如果你有一段时间没有提交，现在是提交的好时机：\n\n点击此处查看图片\n\n```\n$ rails test\n$ git add\
  \ -A\n$ git commit -m \"Make a basic User model (including secure passwords)\"\n\
  ```\n\n然后合并回 master 分支并推送到远程仓库：\n\n点击此处查看图片\n\n```\n$ git checkout master\n$ git\
  \ merge modeling-users\n$ git push\n```\n\n为了让 User 模型在生产环境中运行，我们需要在 Heroku 上运行迁移，我们可以通过\
  \ `heroku run` 实现：\n\n点击此处查看图片\n\n```\n$ rails test\n$ git push heroku\n$ heroku\
  \ run rails db:migrate\n```\n\n我们可以通过在生产环境中运行控制台来验证此操作是否成功：\n\n点击此处查看图片\n\n```\n\
  $ heroku run console --sandbox\n>> User.create(name: \"Michael Hartl\", email: \"\
  michael@example.com\",\n          password: \"foobar\", password_confirmation: \"\
  foobar\")\n=> #<User id: 1, name: \"Michael Hartl\", email: \"michael@example.com\"\
  ,\ncreated_at: \"2016-05-23 20:54:41\", updated_at: \"2016-05-23 20:54:41\",\npassword_digest:\
  \ \"$2a$10$74xFguZRoTZBXTUqs1FjpOf3OoLhrvgxC2wlohtTEcH...\">\n```\n\n### 6.4.1 我们在本章中学到了什么\n\
  \n* 迁移（Migrations）允许我们修改应用程序的数据模型。\n* Active Record 提供了大量操作数据模型的方法。\n* Active Record\
