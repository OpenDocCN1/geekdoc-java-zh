  \ 3.5）。\n\n#### 3.3.4 重构\n\n现在我们已经达到了 `GREEN`（绿色）状态，可以放心地重构代码了。在开发应用程序时，代码往往会产生“异味”，意味着它变得丑陋、臃肿或充满重复。当然，计算机并不在意代码看起来什么样，但人类是在乎，因此通过频繁重构来保持代码库整洁非常重要。虽然我们的示例应用目前小到不需要重构的程度，但代码异味会渗透到每一个缝隙，我们将在第\
  \ 3.4.3 节开始重构。\n\n![image](img/image01059.jpeg)\n\n**图 3.5:** 新的“关于”页面（`/static_pages/about`）。\n\
  \n### 3.4 稍微动态的页面\n\n既然已经为一些静态页面创建了操作和视图，我们将通过添加一些随页面变化的内容来让它们*稍微*动态化：我们将让每个页面的标题发生变化以反映其内容。变化的标题是否代表*真正*的动态内容尚有争议，但无论如何，它都为第\
  \ 7 章中明确的动态内容奠定了必要的基础。\n\n我们的计划是编辑首页、帮助页和关于页面，制作在每个页面上变化的页面标题。这将涉及在页面视图中使用 `<title>`\
  \ 标签。大多数浏览器会在浏览器窗口顶部显示标题标签的内容，这对于搜索引擎优化也很重要。我们将使用完整的“红-绿-重构”循环：首先为页面标题添加简单的测试（RED），然后为我们的三个页面分别添加标题（GREEN），最后使用*布局*文件来消除重复。\n\
  \n**表 3.2:** 示例应用的（大部分）静态页面。\n\n![image](img/image01060.jpeg)\n\n（重构）。到本节结束时，我们的三个静态页面都将具有“<页面名称>\
  \ | Ruby on Rails Tutorial Sample App”格式的标题，其中标题部分将根据页面而异（表 3.2）。\n\n`rails new`\
  \ 命令（列表 3.1）默认会创建一个布局文件，但最初忽略它是很有教育意义的，我们可以通过更改它的名称来实现：\n\n点击此处查看代码图片\n\n```bash\n\
  $ mv app/views/layouts/application.html.erb layout_file # 临时更改\n```\n\n在实际应用中你通常不会这样做，但如果从从禁用它开始，会更容易理解布局文件的目的。\n\
