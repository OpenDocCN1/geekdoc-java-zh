  \n通常情况下，对密码强制执行某些最小标准是一项良好的做法，使其更难被破解。在 Rails 中有许多方法可以强制执行密码强度，但为了简单起见，我们只强制执行最小长度以及密码不能为空的要求。选择\
  \ 6 个长度作为合理的最小长度，导致了如 列表 6.41 所示的验证测试。\n\n**列表 6.41：** 最小密码长度测试。**红色**\n\n`test/models/user_test.rb`\n\
  \n点击此处查看代码图片\n\n```\nrequire 'test_helper'\n\nclass UserTest < ActiveSupport::TestCase\n\
  \  def setup\n    @user = User.new(name: \"Example User\", email: \"user@example.com\"\
  ,\n                     password: \"foobar\", password_confirmation: \"foobar\"\
  )\n  end\n\n  test \"password should be present (nonblank)\" do\n    @user.password\
  \ = @user.password_confirmation = \" \" * 6\n    assert_not @user.valid?\n  end\n\
  \n  test \"password should have a minimum length\" do\n    @user.password = @user.password_confirmation\
  \ = \"a\" * 5\n    assert_not @user.valid?\n  end\nend\n```\n\n注意紧凑多重赋值的使用：\n\n\
  点击此处查看代码图片\n\n列表 6.41. 中的 `@user.password = @user.password_confirmation = \"a\"\
  \ * 5`。这安排了同时为密码及其确认密码分配特定值（在本例情况下，是如 列表 6.14 中通过字符串乘法构造的长度为 5 的字符串）。\n\n通过参考用户名称的相应\
  \ `maximum` 验证（列表 6.16），你可能猜出强制执行 `minimum` 长度限制的代码：\n\n点击此处查看代码图片\n\n```\nvalidates\
