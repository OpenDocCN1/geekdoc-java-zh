  \n并获得了 Figure 11.5 所示的结果。\n\n当然，目前用户激活并没有实际上*执行*任何操作，因为我们还没有更改用户登录的方式。为了让账户激活具有意义，我们需要允许用户仅在已激活的情况下才能登录。如\
  \ Listing 11.32 所示，此的方法是：如果 `user.activated?` 为真，则像常一样登录用户；否则，我们将带有 `warning` 消息重定向到根\
  \ URL（Figure 11.6）。\n\n![image](img/image01946.jpeg)\n\n**图 11.5:** 成功激活后的资料页面。\n\
  \n![image](img/image01356.jpeg)\n\n**图 11.6:** 针对尚未激活用户的警告消息。\n\n**Listing 11.32:**\
  \ 防止未激活的用户登录。\n\n`app/controllers/sessions_controller.rb`\n\n点击此处查看代码图像\n\n```ruby\n\
  class SessionsController < ApplicationController\n  def new\n  end\n\n  def create\n\
  \    user = User.find_by(email: params[:session][:email].downcase)\n    if user\
  \ && user.authenticate(params[:session][:password])\n      if user.activated?\n\
  \        log_in user\n        params[:session][:remember_me] == '1' ? remember(user)\
  \ : forget(user)\n        redirect_back_or_user\n      else\n        message = \"\
  Account not activated. \"\n        message += \"Check your email for the activation\
  \ link.\"\n        flash[:warning] = message\n        redirect_to root_url\n   \
  \   end\n    else\n      flash.now[:danger] = 'Invalid email/password combination'\n\
  \      render 'new'\n    end\n  end\n\n  def destroy\n    log_out if logged_in?\n\
  \    redirect_to root_url\n  end\nend\n```\n\n至此，除了了一项改进外，用户激活的基础功能已经完成。（该改进是防止未激活的用户被显示，这被留作了一项练习\
  \ [Section 11.3.3]。））在 Section 11.3.3 中，我们将通过添加一些测试和进行一些重构来完成这一过程。\n\n### 练习\n\n\
