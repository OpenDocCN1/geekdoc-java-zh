  ><em>Ruby on Rails Tutorial</em></a> 是一本\n      <a href=\"http://www.railstutorial.org/book\"\
  >书籍</a>和\n      <a href=\"http://screencasts.railstutorial.org/\">视频教程系列</a>\n \
  \     用于教授使用 <a href=\"http://rubyonrails.org/\">Ruby on Rails</a> 进行 Web 开发。\n\
  \      本项目是该教程的示例应用程序。\n    </p>\n</body>\n</html>\n```\n\n***\n\n现在我们已经用 ERb 替换了页面标题的变量部分，我们的每个页面看起来都像这样：\n\
  \n点击此处查看代码图像\n\n```html\n<% provide(:title, \"The Title\") %>\n<!DOCTYPE html>\n\
  <html>\n<head>\n    <title><%= yield(:title) %> | Ruby on Rails Tutorial Sample\
  \ App</title>\n</head>\n<body>\n    Contents\n</body>\n</html>\n```\n\n换句话说，所有页面的结构都是相同的，包括\
  \ `title` 标签的内容，唯一的例外是 `body` 标签内部的材料。\n\n为了提取这种结构，Rails 自带了一个名为 `application.html.erb`\
  \ 的特殊布局（layout），我们在本节的开始时重命名了它（第 3.4 节），现在我们将恢复它：\n\n点击此处查看代码图像\n\n```bash\n$ mv\
  \ layout_file app/views/layouts/application.html.erb\n```\n\n为了让布局生效，我们必须用上述嵌入式\
  \ Ruby 替换默认标题：\n\n点击此处查看代码图像\n\n```html\n<title><%= yield(:title) %> | Ruby on Rails\
  \ Tutorial Sample App</title>\n```\n\n生成的布局出现在 列表 3.35 中。\n\n**列表 3.35：** 示例应用程序布局。`GREEN`\n\
  \n`app/views/layouts/application.html.erb`\n\n点击此处查看代码图像\n\n***\n\n```html\n<!DOCTYPE\
  \ html>\n<html>\n<head>\n    <title><%= yield(:title) %> | Ruby on Rails Tutorial\
  \ Sample App</title>\n    <%= csrf_meta_tags %>\n    <%= stylesheet_link_tag 'application',\
  \ media: 'all' %>\n    <%= javascript_include_tag 'application', 'data-rails': 'reload'\
  \ %>\n</head>\n<body>\n    <%= yield %>\n</body>\n</html>\n```\n\n***\n\n注意这里的特殊行行\
  \ `<%= yield %>`。它负责将页面的内容插入布局中。并不是重要的是它如何工作，重要的是布局确保了 `home.html.erb` 包含了额外的几行：\n\
  \n点击此处查看代码图像\n\n```html\n<%= csrf_meta_tags %>\n<%= stylesheet_link_tag 'application',\
  \ media: 'all' %>\n<%= javascript_include_tag 'application', 'data-rails': 'reload'\
  \ %>\n```\n\n这段代码安排了布局中的样式表和 JavaScript，以防止跨站请求伪造（CSRF）。\n\n当然，列表 3.31、列表 3.33 和\
