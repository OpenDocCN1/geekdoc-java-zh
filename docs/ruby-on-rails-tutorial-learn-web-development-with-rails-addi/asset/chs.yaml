  在页面顶部设置了 60 像素的内边距。由于 `header` 标签中使用了 `navbarfixed-top` 类，Bootstrap 将导航栏固定在页面顶部，因此内边距的作用是将正文与导航栏隔离开。（由于\
  \ Bootstrap 2.0 之后默认的导航栏颜色发生了变化，我们需要 `navbar-inverse` 类来将其变为深色而不是浅色。）同时，规则中的 CSS\n\
  \n```css\n.center {\n  text-align: center;\n}\n```\n\n将 `center` 类与 `text-align:\
  \ center` 属性相关。换句话说，`.center` 中的点 `.` 表示该规则样式化一个类。（正如我们在 Listing 5.9 中看到的，井号 `#`\
  \ 标识一个样式化 CSS *id* 的规则。）这意味着任何标签（例如 `div`）内部具有类 `center` 的元素都将在页面的上居中显示。（我们之前在 Listing\
  \ 5.2 中看到过该类的示例。）\n\n虽然 Bootstrap 附带了用于精美排版的 CSS 规则，但我们还将为网站上文本的显示添加一些自定义规则，如 Listing\
