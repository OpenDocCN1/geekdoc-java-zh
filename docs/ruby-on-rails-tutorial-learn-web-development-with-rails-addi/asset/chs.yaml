  \ 7.19 所示）。如果失败，我们回退到第 7.3 节。\n\n![Images/01331.jpeg)\n**图 7.19：** 注册模拟。\n\n####\
  \ 7.4.1 完成的注册表单\n\n为了完成一个工作的注册表单，我们需要填充列表 7.19 中的注释部分。目前，在有效提交时会冻结，如图 7.20 中提交按钮颜色的变化所示。这是因为\
  \ Rails 的默认行为是渲染相应的视图，而我们对应 `create` 操作的模板（图 7.21）。\n\n![Images/01332.jpeg)\n**图\
  \ 7.20：** 有效提交时的冻结页面。\n\n![Images/01333.jpeg)\n**图 7.21：** 服务器日志中的 `create` 模板错误。\n\
  \n虽然可以为 `create` 操作渲染模板，但通常的做法是在成功时重定向到另一个页面。特别是，我们将遵循重定向到新创建的用户资料的惯例，尽管根路径也可以。引入\
  \ `redirect_to` 方法的应用程序代码出现在列表 7.28 中。\n\n\n\n这是因为 Rails 会自动从 `redirect_to @user`\
  \ 推断出我们想要重定向到 `user_url(@user)`。\n\n### 练习\n购买任何 Rails Tutorial 后，均可在 railstutorial.org/solutions\
