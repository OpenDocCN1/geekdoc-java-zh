  \ Active Record 模型支持的资源。\n- Rails 支持多键索引。\n- 可以在 User 模型和 Micropost 模型中分别使用 `has_many`\
  \ 和 `belongs_to` 方法来建模一个拥有许多微贴的用户。\n- `has_many/belongs_to` 的组合产生了可以通过关联工作的方法。\n\
  - 代码 `user.microposts.build(...)` 返回一个与给定用户自动关联的新 Micropost 对象。\n- Rails 通过 `default_scope`\
  \ 支持默认排序。\n- 作用域（Scopes）接受匿名函数作为参数。\n- `dependent: :destroy` 会导致对象与其关联对象同时被销毁。\n\
  - 分页和对象计数都可以通过关联完成，从而产生高效的代码。\n- 固定的（Fixtures）支持创建关联。\n- 可以向 Rails 局部模板（partials）传递变量。\n\
  - `where` 方法可用于执行 Active Record 查询。\n- 我们可以始终通过关联创建和销毁依赖对象来强制安全操作。\n- 我们可以使用 CarrierWave\
  \ 上传并调整图像大小。\n\n## 第 14 章：关注用户\n\n在本章中，我们将通过添加一个社交层来完成 Rails 教程应用程序，该层允许用户关注（和取消关注）其他用户，从而使每个用户的主页显示其关注的微贴的状态动态。我们将首先在第\
  \ 14.1 节学习如何建模用户之间的关系，并在第 14.2 节构建相应的 Web 界面（包括 Ajax 介绍）。最后我们将在第 14.3 节开发一个功能完全的状态动态。\n\
  \n最后一章包含了教程中一些最具挑战性的内容，包括为了制作状态动态使用的一些 Ruby/SQL 技巧。通过这些示例，你将看到 Rails 如何处理即使是复杂的数据模型，这对于你以后开发具有特定需求的应用程序将非常有帮助。为了帮助从教程到独立开发的过渡，第\
  \ 14.4 节提供了一些更高级资源的提示。\n\n由于本章内容特别具有挑战性，在编写任何代码之前，我们将停顿一下并浏览界面。与之前的章节一样，在早期阶段我们将使用原型模型来表示页面。1\
  \ 完整的页面流程如下：用户（John Calvin）从他的个人资料页（图 14.1）开始，导航到用户页面（图 14.2）选择要关注的用户。Calvin 导航到第二个用户\
  \ Thomas Hobbes 的个人资料页（图 14.3，第 682 页），点击“关注”按钮关注该用户。这将把“关注”按钮变为“取消关注”，并将 Hobbes\
  \ 的“关注者”计数加一（图 14.4，第 683 页）。回到他的主页，Calvin 现在看到了增加的“正在关注”计数，并在状态动态中发现了 Hobbes 的微贴（图\
  \ 14.5，第 684 页）。本章其余部分将致力于让此流程真正运行。\n\n## 14.1 关系模型\n\n我们实现关注功能的第一步是构建数据模型，这并不像看起来那么简单。直觉上，`has_many`\
  \ 关系就可以解决：用户 `has_many` 关注的用户和 `has_many` 关注者。正如我们将看到的，这种方法存在一个问题，我们将学习如何使用 `has_many\
  \ :through` 来修复它。\n\n![image](img/02350.jpeg)\n\n**图 14.2：** 寻找要关注的用户。\n\n\n\n\n\
  \n此讨论建议按照图 14.6 所示对关注用户进行建模，使用一个 `following` 表和一个 `has_many` 关联。由于 `user.following`\
  \ 应该是一个用户集合，因此 `following` 表的每行都需要代表一个由 `followed_id` 标识的用户，并结合 `follower_id` 来建立关联。²\
  \ 此外，由于每行都是一个用户，我们需要包含该用户的其他属性，包括姓名、电子邮件、密码等。\n\n2. 为了简单起见，图 14.6 省略了 `following`\
  \ 表的 `id` 列。\n\n![image](img/image02353.jpeg)\n\n**图 14.4：** 带有取消关注按钮和递增粉丝数的个人资料页。\n\
  \n图 14.6 中数据模型的问题在于它是极其冗余的：每行不仅包含每个被关注用户的 id，还包含了他们的所有其他信息——而这些信息*已经*存在于 `users`\
  \ 表中了。更糟糕的是，为了对用户*关注者*进行建模，我们需要一个独立的、同样冗余的 `followers` 表。最后，这种数据模型是一个可维护性的噩梦：每当用户更改（比如）姓名时，我们不仅需要更新\
  \ `users` 表中的用户记录，还需要更新 `following` 和 `followers` 表中*每一个包含该用户的行*。\n\n这里的问题在于我们缺少一个底层的抽象。找到合适模型的方法之一是考虑如何在\
  \ Web 应用程序中实现*关注*行为。回想第 7.1.2 节，REST 架构涉及被创建和销毁的*资源*。这引导我们思考两个问题：当一个用户关注另一个用户时，创建了什么？当一个用户*取消*关注另一个用户时，销毁了什么？通过思考，我们发现在这这些情况下，应用程序应该创建或销毁两个用户之间的*关系*。然后，一个用户拥有许多关系，并通过这些关系拥有许多\
  \ `following`（或 `followers`）。\n\n![image](img/image02354.jpeg)\n\n**图 14.5：** 带有状态馈送和递增关注数的首页。\n\
  \n![image](img/image02355.jpeg)\n\n**图 14.6：** 用户关注的朴素实现。\n\n关于我们应用程序的数据模型，我们还需要处理一个细节——等等——关于我们应用程序的数据模型，我们还需要处理一个细节：与对称的\
  \ Facebook 式友谊（至少在数据模型层面始终是互惠）不同，Twitter 式的关注关系可能是*非对称的*——卡尔文可以关注霍布斯而霍布斯不关注卡尔文。为了区分这两种情况，我们将采用*主动*关系和*被动*关系的术语：如果卡尔文正在关注霍布斯但反之，则卡尔文与霍布斯有一个主动关系，而霍布斯与卡尔文有一个被动关系。³\n\
  \n3. 感谢读者 Paul Fioravanti 建议这种术语。\n\n我们现在将关注于使用主动关系来生成被关注用户列表，并在第 14.1.5 节中考虑被动情况。图\
  \ 14.6 提了了如何实现它：由于每个被关注的用户通过 `followed_id` 唯一标识，我们可以将 `following` 转换为 `active_relationships`\
  \ 表，省略用户详情，并使用 `followed_id` 从 `users` 表中检索被关注的用户。数据模型图出现在图 14.7 中。\n\n由于我们最终将使用同一个数据库表来处理主动和被动关系，我们将使用通用术语\
  \ *relationship* 作为表名，并对应相应的 Relationship 模型。结果就是图 14.8 所示的 Relationship 数据模型。我们将从第\
  \ 14.1.4 节开始学习如何使用 Relationship 模型来模拟主动关系和被动关系模型。\n\n![image](img/image01364.jpeg)\n\
  \n**图 14.7：** 通过主动关系的被关注用户模型。\n\n![image](img/image01366.jpeg)\n\n**图 14.8：** Relationship\
  \ 数据模型。\n\n要开始实现，我们首先生成一个对应于图 14.8 的迁移：\n\n点击此处查看代码\n\n```\n$ rails generate model\
  \ Relationship follower_id:integer followed_id:integer\n```\n\n由于我们将通过 `follower_id`\
  \ 和 `followed_id` 查找关系，我们应该在每个字段上都添加索引，如列表 14.1 所示。\n\n**列表 14.1：** 为 `relationships`\
  \ 表添加索引。\n\n点击此处查看代码\n\n```\nclass CreateRelationships < ActiveRecord::Migration[5.0]\n\
  \  def change\n    create_table :relationships do |t|\n      t.integer :follower_id\n\
  \      t.integer :followed_id\n      t.timestamps\n    end\n\n    add_index :relationships,\
  \ :follower_id\n    add_index :relationships, :followed_id\n    add_index :relationships,\
  \ [:follower_id, :followed_id], unique: true\n  end\nend\n```\n\n为了创建 `relationships`\
  \ 表，我们像常一样迁移数据库：\n\n```\n$ rails db:migrate\n```\n\n\n\n\n\n这之所以有效，是因为按照惯例，Rails\
  \ 会寻找一个与 `:microposts` 符号对应的 `Micropost` 模型。但在当前情况下，我们想要写入。从技术上讲，Rails 使用 `classify`\
  \ 方法将 `has_many` 的参数转换为类名，该方法会将 `\"foo_bars\"` 转换为 `\"FooBar\"`。\n\n```\nhas_many\
  \ :active_relationships\n```\n\n尽管底层模型被称为 `Relationship`。因此，我们必须告诉 Rails 应该查找哪个模型类。其次，我们在\
  \ Micropost 模型中编写了以下代码：\n\n```\nclass Micropost < ApplicationRecord\n  belongs_to\
  \ :user\nend\n```\n\n这之所以有效，是因为 `microposts` 表有一个 `user_id` 属性来标识用户（第 13.1.1 节）。用这种方式连接两个数据库表的\
  \ id 被称为*外键*（foreign key），当 User 模型对象的外键为 `user_id` 时，Rails 会自动推断该关联：默认情况下，Rails\
  \ 期望外键的形式为 `<class>_id`，其中 `<class>` 是类名的小写版本。在当前情况下，尽管我们仍在处理用户，但关注另一个用户的用户现在通过外键\
  \ `follower_id` 来标识，因此我们必须告诉 Rails 这一点。从技术上讲，Rails 使用 `underscore` 方法将类名转换为 id。例如，`\"\
  FooBar\".underscore` 是 `\"foo_bar\"`，因此 `FooBar` 对象的外键将是 `foo_bar_id`。上述讨论的结果就是列表\
  \ 14.2 和列表 14.3 所示的用户/关系关联。\n\n**列表 14.2:** 实现激活关系（active relationships）`has_many`\
  \ 关联。\n\napp/models/user.rb\n\n```\nclass User < ApplicationRecord\n  has_many :microposts,\
  \ dependent: :destroy\n  has_many :active_relationships, class_name: \"Relationship\"\
  ,\n                           foreign_key: \"follower_id\",\n                  \
  \         dependent: :destroy\nend\n```\n\n由于删除一个用户也应该删除该用户的关系，因此我们在关联中添加了 `dependent:\
  \ :destroy`。\n\n**列表 14.3:** 在 Relationship 模型中添加关注者的 `belongs_to` 关联。\n\napp/models/relationship.rb\n\
  \n```\nclass Relationship < ApplicationRecord\n  belongs_to :follower, class_name:\
  \ \"User\"\n  belongs_to :followed, class_name: \"User\"\nend\n```\n\n`followed`\
  \ 关联实际上直到第 14.1.4 节才需要，但如果同时实现它们，并行/被关注（parallel/followed）结构会更清晰。列表 14.2 和列表 14.3\
  \ 中的关系产生了与我们在表 13.1 中看到的那些类似的方法，如表 14.1 所示。\n\n**表 14.1:** 用户/激活关系方法摘要。\n\n![image](img/image1367.jpeg)\n\
  \n#### 14.1.3 关系验证\n\n在继续之前，为了完整起见，我们将添加几个 Relationship 验证。测试代码（列表 14.4）和应用程序代码（列表\
  \ 14.5）是直观的。与列表 6.30 中生成的用户固件（fixture）一样，生成的关系固件也违反了相应迁移文件（列表 14.1）施加的唯一性约束。解决方案——如列表\
  \ 6.31 所示移除固件内容——也是相同的，如列表 14.6 所示。\n\n**列表 14.4:** 测试 Relationship 模型验证。\n\ntest/models/relationship_test.rb\n\
