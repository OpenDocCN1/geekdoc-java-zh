  如图 8.2 所示，当登录信息无效时，我们希望重新渲染登录页面并显示错误。在节 7.3.3 中，我们使用 `error_messages` 模板来显示错误消息，但在该节我们看到这些消息是由\
  \ Active Record 自动提供的。这对于会话创建不起作用，因为会话不是 Active Record 对象，所以我们将错误渲染为 flash 消息。\n\
  \n![image](img/image0145.jpeg)\n\n**图 8.2:** 登录失败的模拟。\n\n回想列表 7.15，注册表单使用了 `form_for`\
