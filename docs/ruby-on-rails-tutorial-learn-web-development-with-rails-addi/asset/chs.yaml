  \n1. 使用 `rails console` 验证在提交有效信息时，是否确实创建了一个用户。\n2. 通过更新 Listing 7.28 并提交一个有效的用户，确认\
  \ `redirect_to user_url(@user)` 的效果与 `redirect_to @user` 相同。\n\n#### 7.4.2 The Flash（闪存消息）\n\
  有了 Listing 7.28 中的代码，我们的注册表单实际上已经可以工作了，但在浏览器中提交有效的注册之前，我们将添加一些 Web 应用中常见的润色处理：一条显示在后续页面上的消息（在本例中是欢迎我们的新用户加入应用程序），然后在访问第二个页面或刷新页面时该消息消失。\n\
  \nRails 显示临时消息的方法是使用一个名为 `flash` 的特殊方法，我们可以像对待哈希（一样处理它。Rails 采用 `:success` 键作为指示成功结果的消息键\
  \ (Listing 7.29)）。\n\n**Listing 7.29:** 为用户注册添加 flash 消息。\n\n`app/controllers/users_controller.rb`\n\
  \n```ruby\nclass UsersController < ApplicationController\n  def create\n    @user\
  \ = User.new(user_params)\n    if @user.save\n      flash[:success] = \"Welcome\
  \ to the Sample App!\"\n      redirect_to @user\n    else\n      render 'new'\n\
  \    end\n  end\n\n  private\n    def user_params\n      params.require(:user).permit(:name,\
  \ :email, :password, :password_confirmation)\n    end\nend\n```\n\n通过给 `flash` 赋值消息，我们现在可以在重定向后的第一个页面上显示该消息。我们的方法是遍历\
  \ `flash` 并将所有相关消息插入网站布局中。你可能还记得 Section 4.3.3 中的控制台示例，在其中我们看到如何使用经过策略命名的变量 `flash`\
  \ 来遍历哈希 (Listing 7.30)。\n\n**Listing 7.30:** 在控制台中遍历 `flash` 哈希。\n\n```bash\n$ rails\
  \ console\n>> flash = { success: \"It worked!\", danger: \"It failed.\" }\n=> {:success=>\"\
  It worked!\", danger: \"It failed.\"}\n>> flash.each do |key, value|\n?> puts \"\
  #{key}\"\n?> puts \"#{value}\"\n>> end\nsuccess\nIt worked!\ndanger\nIt failed.\n\
  ```\n\n通过遵循这种模式，我们可以安排如下代码在全范围内显示 flash 的内容：\n\n```erb\n<% flash.each do |message_type,\
  \ message| %>\n  <div class=\"alert-<%= message_type %>\"><%= message %></div>\n\
  <% end %>\n```\n（这段代码是 HTML 和 ERB 的组合，非常丑陋且难以阅读；让它更美观的工作留作练习即可 Section 7.4.4。）在这里，嵌入的\
  \ Ruby `alert-<%= message_type %>` 创建了一个与消息类型对应的 CSS 类，因此对于 `:success` 消息，类名为 `alert-success`（键\
  \ `:success` 是一个符号，但在将其插入模板之前，嵌入 Ruby 会将其转换为字符串 `\"success\"`）。为每个键使用不同的类允许我们能够对不同类型的消息应用不同的样式。例如，在\
  \ Section 8.1.4 中，我们将使用 `flash[:danger]` 来表示登录失败（事实上，我们已经用过一次 `alert-danger`，用于为\
  \ Listing 7.21 中的错误消息 div 设置样式）。Bootstrap CSS 支持为四种紧急程度不断递增的 flash 类提供样式（`success`、`info`、`warning`\
  \ 和 `danger`），我们在开发应用程序的过程中将有机会使用所有它们（Section 1.2 中的 `info`、Section 1.3 中的 `warning`，以及在\
  \ Section 8.1.4 中首次使用 `danger`）。实际上，我们还会使用密切相关的 `flash.now`，但我们将推迟到需要它时再用。因为消息也被插入了模板中，所以\
  \ `flash[:success] = \"Welcome to the Sample App!\"` 的完整 HTML 结果如下：\n\n```html\n\
  <div class=\"alert-success\">Welcome to the Sample App!</div>\n```\n\n**Listing\
  \ 7.31:** 将 `flash` 变量的内容添加到网站布局。\n\n`app/views/layouts/application.html.erb`\n\n\
  ```erb\n<!DOCTYPE html>\n<html>\n<body>\n  <%= render 'layouts/header' %>\n  <div\
  \ class=\"container\">\n    <% flash.each do |message_type, message| %>\n      <div\
  \ class=\"alert-<%= message_type %>\"><%= message %></div>\n    <% end %>\n    <%=\
  \ yield %>\n    <%= render 'layouts/footer' %>\n    <%= debug(params) if Rails.env.development?\
  \ %>\n  </div>\n</body>\n</html>\n```\n\n#### 7.4.3 First Signup（第一次注册）\n我们可以通过为应用程序注册第一个用户来看到所有工作的结果。尽管之前的提交没有正常工作（如\
