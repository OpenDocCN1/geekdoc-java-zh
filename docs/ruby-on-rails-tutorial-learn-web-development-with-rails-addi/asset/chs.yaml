  \ 方法。结果出现在代码列表 10.20。\n\n**代码列表 10.20:** 测试 `edit` 和 `update` 是受保护的。**红色**\n\n```ruby\n\
  test/controllers/users_controller.rb\n```\n\n点击此处查看代码图片\n\n```ruby\nrequire 'test_helper'\n\
  class UsersControllerTest < ActionDispatch::IntegrationTest\n  def setup\n    @user\
