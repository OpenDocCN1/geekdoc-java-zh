  \ 而不是 `micropost.id` 会发生什么？\n\n3. `user == micropost.user` 的值是多少？`user.micro posts.first\
  \ == micropost` 的值呢？\n\n#### 13.1.4 Micropost 完善\n\n在本节中，我们将对 user/micropost 关联添加一些细化。特别地，我们将安排用户的\
  \ microposts 按特定顺序检索，并且让 microposts 依赖于用户，这样当用户被删除时，它们也会被自动删除。\n\n##### 默认作用域 (Default\
  \ Scope)\n\n默认情况下，`user.microposts` 方法对帖子的顺序没有任何保证，但（遵循博客和 Twitter 的习惯），我们希望 microposts\
  \ 按创建时间的反序排列，以便最新的帖子排在最前面。part0022.xhtml_ch13en4。我们将使用 `default scope` 来实现这一点。part0022.xhtml_ich13en4\
  \ 我们之前在 第 10.5 节 用户索引上下文中简要遇到过类似的问题。\n\n这种功能非常很容易导致虚假的测试通过（即：即使应用程序代码错误，测试也会通过），因此我们将继续使用测试驱动开发，以确保我们正在测试正确的内容。特别地，让我们写一个测试来验证数据库中的第一个\
  \ micropost 与我们称为 `most_recent` 的固件（fixture）相同，如 Listing 13.14 所示。\n\n**Listing\
  \ 13.14:** 测试 micropost 的顺序。**RED**\n\n`test/models/micropost_test.rb`\n\n```ruby\n\
  require 'test_helper'\nclass MicropostTest < ActiveSupport::TestCase\n  .\n  .\n\
  \  .\n  test \"order should be most first\" do\n    assert_equal microposts(:most_recent),\
  \ Micropost.first\n  end\nend\n```\n\nListing 13.14 依赖于一些 micropost 固件，我们如 Listing\
  \ 13.15 所示定义了它们。\n\n**Listing 13.15:** Micropost 固件。\n\n`test/fixtures/micosts.yml`\n\
  \n```yaml\norange:\n  content: \"I just ate an orange!\"\n  created_at: <%= 10.minutes.ago\
  \ %>\nmanifesto:\n  content: \"Check out the\"\n  created_at: <%= 3.years.ago %>\n\
  cat_video:\n  content: \"Sad cats are sad:\"\n  created_at: <%= 2.hours.ago %>\n\
  most_recent:\n  content: \"Writing a short test\"\n  created_at: <%= Time.now %>\n\
  ```\n\n注意我们使用嵌入式 Ruby 设置了 `created_at`。由于它是由 Rails 更新的“魔法”列，通常手动设置是不可能的，但在固件中是可以的。在许多系统中，固件是顺序创建的。在这种情况下，文件的最后一个固件是最后创建的（因此是最新的），但依赖这种行为是愚蠢的，因为它依赖于系统。\n\
  \n有了 Listing 13.14 和 Listing 13.15 中的代码，测试套件应该是 **RED** 的：\n\n**Listing 13.16: RED**\n\
  \n点击此处查看代码图像\n\n```\n$ rails test test/models/micropost_test.rb \\\n  --name test_should_be_most_first\n\
  ```\n\n我们将使用名为 `default_scope` 的 Rails 方法让测试通过，该方法除其他外还可以用于设置从数据库检索元素的默认顺序。为了强制特定的顺序，我们将在\
  \ `default_scope` 中包含 `order` 参数，允许我们对 `created_at` 列进行排序：\n\n`order(:created_at)`\n\
  \n不幸的是，这将按升序排列结果，这意味着旧的 micropost 会先出来。为了按反序提取它们，我们可以进一步深一层并包含一个带有原始 SQL 的字符串：\n\
  \n`order('created_at DESC')`\n\n这里 `DESC` 是 SQL 中的“降序”，即从新到旧的倒序。part0022.xhtml_ch13en5。在旧版本的\
  \ Rails 中，使用这种原始 SQL 曾是所需行为的唯一选择，但从 Rails 4.0 开始，我们可以使用更自然的纯 Ruby 语法：part0022.xhtml_ich13en5\
  \ SQL 不区分大小写，但习惯上将 SQL 关键字（如 `DESC`）全大写。\n\n`order(created_at: :desc)`\n\n在 Micropost\
  \ 模型的 `default_scope` 中添加此项得到了 Listing 13.17。\n\n**Listing 13.17:** 使用 `default_scope`\
  \ 排序 microposts。**GREEN**\n\n`app/models/micropost.rb`\n\n\n\n\n\n点击此处查看代码图片\n\n\
  ```ruby\nclass Micropost < ApplicationRecord\n  belongs_to :user\n  default_scope\
  \ -> { order(created_at: :desc) }\n  validates :user_id, presence: true\n  validates\
  \ :content, presence: true, length: { maximum: 140 }\nend\n```\n\nListing 13.17\
  \ 引入了用于 `Proc`（过程）或 `lambda` 对象的“刺状 lambda”（stabby lambda）语法，它是一个*匿名函数*（没有名称创建的函数）。刺状\
  \ lambda `->` 接收一个块（Section 4.3.2）并返回一个 Proc，然后可以使用 `call` 方法对其求值。我们可以在控制台中看到它是如何工作的：\n\
  \n点击此处查看代码图片\n\n```bash\n>> -> { puts \"foo\" }\n=> #<Proc:0x007fab938d0108@(irb):1\
  \ (lambda)>\n>> -> { puts \"foo\" }.call\nfoo\n=> nil\n```\n\n（这是一个相当高级的 Ruby 主题，所以如果立即无法理解，不要担心。）\n\
  \n有了 Listing 13.17 中的代码，测试结果应该是 `GREEN`：\n\n**Listing 13.18:** `GREEN`\n\n```bash\n\
  $ rails test\n```\n\n## 依赖：删除 (Dependent: Destroy)\n\n除了正确的排序外，我们还想为 microposts\
  \ 添加第二种改进。回想 Section 10.4，网站管理员有权*销毁*用户。理所当然，如果一个用户被销毁，那么该用户的 microposts 也应该被销毁。\n\
  \n我们可以通过向 `has_many` 关联方法传递一个选项来实现这种行为，如 Listing 13.19 所示。\n\n**Listing 13.19:**\
  \ 确保用户的 microposts 随用户一起销毁。\n\n`app/models/user.rb`\n\n点击此处查看代码图片\n\n```ruby\nclass\
  \ User < ApplicationRecord\n  has_many :microposts, dependent: :destroy\n  # .\n\
  \  # .\n  # .\nend\n```\n\n在这里，`dependent: :destroy` 选项安排在用户本身被销毁时，相关的 microposts\
  \ 也被销毁。这防止了当管理员选择从系统中删除用户时，没有用户的 microposts 遗留在数据库中。\n\n我们可以通过对 User 模型进行测试来验证 Listing\
  \ 13.19 是否有效。我们只需要保存用户（使其获得 id）并创建一个关联的 micropost。然后我们检查销毁用户是否会让 micropost 数量减少\
  \ 1。结果显示在 Listing 13.20 中。（对比 Listing 10.62 中“delete”的集成测试。）\n\n**Listing 13.20:**\
  \ `dependent: :destroy` 的测试。**GREEN**\n\n`test/models/user_test.rb`\n\n点击此处查看代码图片\n\
  \n```ruby\nrequire 'test_helper'\nclass User < ActiveSupport::TestCase\n  def setup\n\
  \    @user = User.new(name: \"Example User\", email: \"user@example.com\", password:\
  \ \"foobar\", password_confirmation: \"foobar\")\n  end\n  # .\n  # .\n  test \"\
  associated microposts should be destroyed\" do\n    @user.save\n    @user.microposts.create!(content:\
  \ \"Lorem ipsum\")\n    assert_difference 'Micropost.count', -1 do\n      @user.destroy\n\
  \    end\n  end\nend\n```\n\n如果 Listing 13.19 中的代码工作正常，测试套件仍然应该是 `GREEN`：\n\n**Listing\
  \ 13.21:** `GREEN`\n\n```bash\n$ rails test\n```\n\n### 练习\n\n练习解答可以在购买任何 Rails\
  \ Tutorial 后在 railstutorial.org 免费获取。要查看他人的答案并记录自己的答案，请加入 learnenough.com 的 Learn\
  \ Society。\n\n1. `Micropost.first.created_at` 的值与 `Micropost.last.created_at` 相比如何？\n\
  2. `Micropost.first` 和 `Micropost.last` 的 SQL 查询是什么？*提示*：它们由控制台打印出来。\n3. 让 `user`\
  \ 为数据库中的第一个用户。它的第一个 micropost 的 id 是什么？使用 `destroy` 方法删除数据库中的第一个用户，然后使用 `Micropost.find`\
  \ 确认该用户的第一个 micropost 也被销毁了。\n\n## 13.2 显示 Microposts\n\n虽然我们现在还没有通过网页创建 microposts\
  \ 的方法（那将在 Section 13.32 中介绍），但这不会阻止我们显示它们（并测试这种显示）。遵循 Twitter 的做法，我们计划不在单独的 microposts\
  \ `index` 页面上显示，而是直接在用户的 `show` 页面上显示，如 Figure 13.4 所示。我们将从非常简单的 ERb 模板开始，在用户配置中添加\
  \ micropost 显示，然后我们从 Section 10.3.2 的种子数据中添加 microposts，这样我们就有内容可以显示。\n\n#### 13.2.1\
  \ 渲染 Microposts\n\n我们的计划是在每个用户的个人资料页（`show.html.erb`）上显示他们的 microposts，并带上他们发布的\
  \ micropost 运行计数。正如我们将看到的，许多想法与我们在 Section 10.3 中的工作相似。正如我们在 Section 10.3 显示所有用户时所看到的：\n\
  \n![image](img/image023)\n\n**图 13.4:** 带有 microposts 的个人页面原型。\n\n如果你已经添加了一些 microposts，在这种情况下重置并重新种子数据库是个好主意：\n\
  \n```bash\n$ db:reset\n$ db:seed\n```\n\n虽然我们在 Section 13.3 之前不需要 Microposts 控制器，但我们稍后需要\
  \ views 目录，所以现在生成控制器：\n\n```bash\n$ rails generate controller Microposts\n```\n\n\
  本节的主要目的是渲染每个用户的 microposts。我们在 Section 10.3.5 中看到：\n\n```html\n<ul class=\"users\"\
  >\n  <%= render @users %>\n</ul>\n```\n\n会自动使用 `_user.html.erb` 部分渲染 `@users` 中的每个用户。我们将定义一个类似的\
  \ `_micropost.html.erb` 部分，以便将相同的技术应用于 micropost 集合，如下：\n\n```html\n<ol class=\"\
  microposts\n```\n\n注意我们使用了有序列表标签 `ol`（而不是无序列表 `ul`），因为 microposts 是按顺序排列的（倒序时间）。对应的部分出现在\
  \ Listing 13.22 中。\n\n**Listing 13.22:** 显示单个 micropost 的部分。\n\n`app/views/microposts/_micropost.html.erb`\n\
  \n点击此处查看代码图片\n\n```erb\n<li id=\"micropost-<%= micropost.id %>\">\n  <%= link_to\
  \ gravatar_for(micropost.user, size: 50), micropost.user %>\n  <span class=\"user\"\
  ><%= link_to micropost.user.name, micropost.user %></span>\n  <span class=\"content\"\
  ><%= micropost.content %></span>\n  <span class=\"timestamp\">\n    Posted <%= time_ago_in_words(micropost.created_at)\
  \ %> ago.\n  </span>\n</li>\n```\n\n使用了强大的 `time_ago_in_words` 辅助方法，其含义显而易见，我们将在\
  \ Section 13.2.2 中看到它的效果。Listing 13.22 还为每个 micropost 添加了 CSS id，使用：\n\n```erb\n\
  <li id=\"micropost-<%= micropost.id %>\">\n```\n\n这通常是一个好习惯，因为它为未来操纵单个 micropost\
  \ 开启了可能性（例如使用 JavaScript）。\n\n\n\n\n下一步是处理显示可能存在大量微贴的困难。我们将采用之前在第 10.3.3 节中解决用户的方法来解决这个问题，即使用分页。和之前一样，我们将继续使用\
  \ `will_paginate` 方法：\n\n点击此处查看代码图像\n\n```ruby\n<%= will_paginate @microposts %>\n\
  ```\n\n如果你将此代码与用户索引页面上的对应行——列表 10.45 进行比较，你会发现我们之前只有：\n\n```ruby\n<%= will_paginate\
  \ %>\n```\n\n这行代码之所以能运行，是因为在 `Users` 控制器的上下文中，`will_paginate` *假设*存在一个名为 `@users`\
  \ 的实例变量（正如我们在第 10.3.3 节中所看到的，它的类型应该是 `ActiveRecord::Relation`）。在当前情况下，由于我们仍处于 `Users`\
  \ 控制器中，但想要对*微贴*进行分页，我们将向 `will_paginate` 传递一个显式的 `@microposts` 变量。当然，这意味着我们将在用户的\
  \ `show` 动作中定义这样一个变量（列表 13.23）。\n\n**列表 13.23：** 在用户的 `show` 动作中添加 `@microposts`\
  \ 实例变量。\n\n`app/controllers/users_controller.rb`\n\n点击此处查看代码图像\n\n```ruby\nclass\
  \ UsersController < ApplicationController\n\n  .\n  .\n  .\n  def show\n    @user\
  \ = User.find(params[:id])\n    @microposts = @user.microposts.paginate(page: params[:page])\n\
  \  end\n\n  .\n  .\n  .\nend\n```\n\n这里 `paginate` 非常聪明——它甚至可以*通过*微贴关联工作，进入微贴表并提取出所需的微贴页。\n\
  \n我们的最后一个任务是显示每个用户的微贴数量，我们可以通过 `count` 方法来实现：\n\n```ruby\nuser.microposts.count\n\
  ```\n\n与 `paginate` 一样，我们可以通过关联使用 `count` 方法。特别地，`count` *并不会*从数据库中提取所有微贴，然后对生成的数组调用\
  \ `length`，因为随着微贴数量的增加，这样做将变得非常低效。相反，它直接在数据库中执行计算，请求数据库统计具有给定 `user_id` 的微贴（所有数据库对此操作都经过高度优化）。（在极少数情况下，如果计数仍然是你应用程序的瓶颈，你可以使用*计数缓存\
  \ (counter cache)*来使其运行更快。）\n\n将上述所有元素整合在一起，我们现在可以将微贴添加到个人资料页了，如列表 13.24 所示。注意使用\
  \ `if @user. microposts.any?`（这是我们之前在列表 7.21 中见过的结构），它确保了当用户没有微贴时，不会显示空列表。\n\n**列表\
  \ 13.24：** 为用户的 `show` 页面添加微贴。\n\n`app/views/users/show.html.erb`\n\n点击此处查看代码图像\n\
  \n```erb\n<% provide(:title, @user.name) %>\n<div class=\"row\">\n  <aside class=\"\
  col-md-4\">\n    <section class=\"user_info\">\n      <h1>\n        <%= gravatar_for\
  \ @user %>\n        <%= @user.name %>\n      </h1>\n    </section>\n  </aside>\n\
  \  <div class=\"col-md-8\">\n    <% if @user.microposts.any? %>\n      <h3>微贴 (Microposts)\
  \ (< @user.microposts.count %></h3>\n      <ol class=\"microposts\">\n        <%=\
  \ render @microposts %>\n      </ol>\n      <%= will_paginate @microposts %>\n \
  \   <% end %>\n  </div>\n</div>\n```\n\n![image](img/image02317.jpeg)\n**图 13.5：**\
