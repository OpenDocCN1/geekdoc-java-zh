  ***\n\n## 框 9.2：10 类人\n\n有一个老的笑话说，世界上有 10 类人：懂二进制的人和不懂二进制的人（当然，`10` 在二进制中是 `2`）。本着这种精神，我们可以说世界上有\
  \ 10 类人：喜欢三元运算符的人、不喜欢三元运算符的人，以及还不知道三元运算符的人。（*如果你恰好属于第三类，很快你就不再属于这一类了*。）\n\n当你进行大量的编程工作时，你会很快发现最常见的控制流之一类似于下面的代码：\n\
  \n```ruby\nif boolean?\n  do_one_thing\nelse\n  do_something_else\nend\n```\n\n\
  Ruby 与许多其他语言（包括 C/C++、Perl、PHP 和 Java）一样，允许你使用三元运算符（因其包含三个部分而得名）将其替换为更紧凑的表达式：\n\n\
  `boolean? ? do_one_thing : do_something_else`\n\n你也可以使用三元运算符来替换赋值操作，使得\n\n```ruby\n\
  if boolean?\n  var = foo\nelse\n  var = bar\nend\n```\n\n变为：\n\n```ruby\nvar = boolean?\
  \ ? foo : bar\n```\n\n最后，在函数的返回值中使用三元运算符通常非常方便：\n\n```ruby\ndef foo\n  do_stuff\n\
  \  boolean? ? \"bar\" : \"baz\"\nend\n```\n\n由于 Ruby 会隐式地返回函数中最后一个表达式的值，这里 `foo`\
  \ 方法根据 `boolean?` 是否为真或假来返回 \"bar\" 或 \"baz\"。\n\n### 练习\n\n购买任何 Rails Tutorial\
  \ 后，均可以在 railstutorial.org/solutions 免费获取练习题。要查看他人的答案并记录你自己的答案，请加入 learnenough.com/society\
  \ 的 Learn Enough Society。\n\n1. 通过直接检查浏览器的 cookies，验证“记住我”复选框是否产生了预期效果。\n2. 在控制台中，编写示例展示三元运算符的两种可能行为（Box\
  \ 9.2）。\n\n### 9.3 记住测试\n\n尽管我们的“记住我”功能现在已经工作了，但编写一些测试来验证其行为仍然很重要。原因之一是为了捕获实现错误（正如后文将讨论的）。更重要的是，核心用户持久化代码实际上完全没有经过测试。修复这些问题需要一些技巧，但结果将是一个强大得多的测试套件。\n\
  \n#### 9.3.1 测试“记住我”复选框\n\n当我最初在 Listing 9.23 中实现复选框处理时，并没有使用正确的\n\n点击此处查看代码图像\n\
  \n```ruby\nparams[:session][:remember_me] == '1' ? remember(user) : forget(user)\n\
  ```\n\n而是实际上使用了：\n\n点击此处查看代码图像\n\n```ruby\nparams[:session][:remember_me] ? remember(user)\
  \ : forget(user)\n```\n\n在这种上下文中，`params[:session][:remember_me]` 要不是 `'0'` 就是是\
  \ `'1'`，两者在布尔上下文中都为 `true`，因此结果表达式始终为真，应用程序的行为就像复选框始终被勾选了一样。这正是测试可以捕获的错误。\n\n由于记住用户需要他们处于登录状态，因此我们的第一步是定义一个辅助方法，在测试内部登录用户。在\
  \ Listing 8.23 中，我们使用 `post` 方法和有效的 `session` 哈希表登录了用户，但每次都这样做很繁琐。为了避免不必要的重复，我们将编写一个名为\
  \ `log_in_as` 的辅助方法来为我们登录。\n\n我们登录用户的方法取决于测试的类型。在控制器测试中，我们可以直接操作 `session` 方法，将\
  \ `user.id` 赋值给 `:user_id` 键（如在 Listing 8.14 中首次所示）：\n\n点击此处查看代码图像\n\n```ruby\n\
  def log_in_as(user)\n  session[:user_id] = user.id\nend\n```\n\n我们调用该方法 `log_in_as`\
  \ 以避免与 Listing 8.14 中定义的应用程序代码 `log_in` 方法混淆。它位于 `test_helper` 文件中的 `ActiveSupport::TestCase`\
  \ 类中，与 Listing 8.26 中的 `is_logged_in?` 辅助方法位于相同：\n\n点击此处查看代码图像\n\n```ruby\nclass\
  \ ActiveSupport::TestCase\n  fixtures :all\n  # 如果测试用户已登录，则返回 true。\n  def is_logged_in?\n\
  \    !session[:user_id].nil?\n  end\n\n  # 登录特定用户。\n  def log_in_as(user)\n    session[:user_id]\
  \ = user.id\n  end\nend\n```\n\n在本章中我们实际上不需要这个版本的方法，但将在第 10 章中使用它。\n\n在集成测试中，我们无法直接操作\
  \ `session`，但我们可以像 Listing 8.23 那样向 sessions 路径 `post` 请求，这将引导此处 `log_in_as` 方法：\n\
  \n点击此处查看代码图像\n\n```ruby\nclass ActionDispatch::IntegrationTest\n  # 登录特定用户。\n  def\
  \ log_in_as(user, password: 'password', remember_me: '1')\n    post login_path,\
  \ params: { session: { email: user.email, password: password, remember_me: remember_me\
  \ } }\n  end\nend\n```\n（注：此处原文代码块似乎在该处有截断或重复，翻译已根据上下文逻辑对齐）\n\n将这些方法结合，得到了 Listing\
  \ 9.24 所示的 `log_in_as` 辅助方法。\n\n**Listing 9.24:** 添加 `log_in_as` 辅助方法。\ntest_helper.rb\n\
  \n点击此处查看代码图像\n\n***\n\n```ruby\nENV['RAILS_ENV'] ||= 'test'\n\nclass ActiveSupport::TestCase\n\
  \  fixtures :all\n  # 如果测试用户已登录，则返回 true。\n  def is_logged_in?\n    !session[:user_id].nil?\n\
  \  end\n\n  # 登录特定用户。\n  def log_in_as(user)\n    session[:user_id] = user.id\n\
  \  end\nend\n\nclass ActionDispatch::IntegrationTest\n  # 登录特定用户。\n  def log_in_as(user,\
  \ password: 'password', remember_me: '1')\n    post login_path, params: { session:\
  \ { email: user.email, password: password, remember_me: remember_me } }\n  end\n\
  end\n```\n\n***\n\n注意，为了最大的灵活性，Listing 9.24 中的第二个 `log_in_as` 方法接受关键字参数（如 Listing\
  \ 7.13 所示），并对密码和“记住我”复选框设置了默认值 `'password'` 和 `'1'`。\n\n为了验证“记住我”复选框的行为，我们将编写两个测试，分别对应勾选和未勾选的情况。使用在\
  \ Listing 9.24 中定义的登录辅助方法，这非常简单，两种情况分别如下：\n\n点击此处查看代码图像\n\n```ruby\nlog_in_as(@user,\
  \ remember_me: '1')\n```\n\n和\n\n点击此处查看代码图像\n\n```ruby\nlog_in_as(@user, remember_me:\
  \ '0')\n```\n\n（由于 `'1'` 是 `remember_me` 的默认值，我们可以在第一个情况中省略相应的选项，但我将其包含是为了使并列结构更加清晰。）\n\
  \n\n\n\n\n登录后，我们可以通过在 `cookies` 中查找 `remember_token` 键来检查用户是否被记住。理想情况下，我们应该检查该 cookie\
  \ 的值是否等于用户的记住令牌（remember token），但按照目前的设计，测试程序没有办法访问它：控制器中的 `user` 变量有一个 `remember_token`\
  \ 属性，但（由于 `remember_token` 是虚拟属性）测试中的 `@user` 变量并没有。修复这个小瑕疵被留作了一项练习（参见第 9.3.1 节），但目前我们只需要测试相关的\
  \ cookie 是否为 `nil` 即可。\n\n还有一点微妙之处，即由于某种原因，在测试内部，`cookies` 方法不支持使用符号作为键，因此 `cookies[:remember_token]`\
  \ 始终为 `nil`。幸运的是，`cookies` *可以*使用字符串键，因此 `cookies['remember_token']` 拥有我们需要的值。生成的测试结果出现在列表\
  \ 9.25 中。（回想列表 8.23 中的 `users (:michael)` 引用了列表 8.22 中的固件用户。）\n\n**列表 9.25：** 对“记住我”复选框的测试。`GREEN`\n\
  \n```ruby\ntest/integration/users_login_test.rb\n```\n点击此处查看代码图片\n\n```ruby\nrequire\
  \ 'test_helper'\n\nclass UsersLoginTest < ActionDispatch::IntegrationTest\n  def\
  \ setup\n    @user = users(:michael)\n  end\n\n  test \"带记住功能的登录\" do\n    log_in_as(@user,\
  \ remember_me: '1')\n    assert_not_nil cookies['remember_token']\n  end\n\n  test\
  \ \"不带记住功能的登录\" do\n    log_in_as(@user, remember_me: '0')\n    assert_nil cookies['remember_token']\n\
  \  end\nend\n```\n\n假设你没有像我一样犯同样的实现错误，测试结果应该是 `GREEN`：\n\n**列表 9.26：`GREEN`**\n\n\
  ```bash\n$ rails test\n```\n\n### 练习\n\n购买任何 Rails Tutorial 后，可以在 railstutorial.org/solutions\
