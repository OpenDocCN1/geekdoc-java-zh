  \ *\n\n**Box 3.2：GET 等。**\n\n超文本传输协议 (HTTP) 定义了基本操作 `GET`、`POST`、`PATCH` 和 `DELETE`。这些指的是\
  \ `client` 计算机（通常运行 Chrome、Firefox 或 Safari 等网络浏览器）与 `server`（通常运行 Apache 或 Nginx\
  \ 等 Web 服务器）之间的操作。（理解这一点：在本地计算机上开发 Rails 应用时，客户端和服务器是同一台物理机器，但通常它们是不同的。）强调 HTTP\
  \ 动词是受 `REST 架构`影响的 Web 框架（包括 Rails）的典型特征，我们在第 2 章中简要介绍过它，将在第 7 章中开始学习。`GET` 是最常见的\
  \ HTTP 操作，用于*读取*网络上的数据；它仅仅意味着“获取页面”，每当你访问像 [`http://www.google.com/`](http://www.google.com/)\
  \ 或 [`http://www.wikipedia.org/`](http://www.wikipedia.org/) 网站时，你的浏览器都会提交一个 `GET`\
  \ 请求。`POST` 是次常见的操作；它是你的浏览器在提交表单时发送的请求。在 Rails 应用中，`POST` 请求通常用于*创建*内容（尽管 HTTP 也允许\
  \ `POST` 执行更新）。例如，提交注册表单时发送的 `POST` 请求会在远程站点上创建一个新用户。另外两个动词 `PATCH` 和 `DELETE` 用于在远程服务器上*更新*和*销毁*内容。这些请求没有\
  \ `GET` 和 `POST` 常见，因为浏览器无法原生发送它们，但某些 Web 框架（包括 Ruby on Rails）有巧妙的方法使其*看起来*浏览器正在发出此类请求。因此，Rails\
  \ 支持所有四种请求类型：`GET`、`POST`、`PATCH` 和 `DELETE`。\n\n* * *\n\n![image](img/image01056.jpeg)\n\
