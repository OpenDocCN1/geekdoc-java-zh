  \n注意 `!user.activated?` 的存在，这是上面提到的额外布尔。这防止我们的代码激活已经激活的用户，这很重要，因为我们将在确认后登录用户，我们不想让获取激活链接的攻击者登录。\n\
  \n如果用户根据上述布尔通过了验证，我们需要激活用户并更新 `activated_at` 时间戳：part0020.xhtml_ch11en7\n\n在这里我们调用两次\
  \ `update_attribute` 而不是调用一次 `updated_attributes`，因为（根据[第 6.1.5 节\n\n```ruby\nuser.update_attribute(:activated,\
  \ true)\nuser.update_attribute(:activated_at, Time.zone.now)\n```\n\n这导致了列表 11.31\
  \ 所示的 `edit` 方法。同样注意[列表 11.31]处理了无效激活令牌的情况；这种情况很少发生，但很容易在这种情况下将其重定向到根 URL。\n\n**列表\
  \ 11.31：** 用于激活账户的 `edit` 方法。\n\napp/controllers/account_activations_controller.rb\n\
  \n点击此处查看代码图片\n\n```ruby\nclass AccountActivationsController < ApplicationController\n\
  \  def edit\n    user = User.find_by(email: params[:email])\n```\n\n\n\n```ruby\n\
  if user && !user.activated? && user.authenticated?(:activation, params[:id])\n \
  \ user.update_attribute(:activated, true)\n  user.update_attribute(:activated_at,\
  \ Time.zone.now)\n  log_in user\n  flash[:success] = \"Account activated!\"\n  redirect_to\
  \ user\nelse\n  flash[:danger] = \"Invalid activation link\"\n  redirect_to root_url\n\
  end\nend\n```\n\n有了 Listing 11.31 中的代码，你现在应该可以将 Listing 11.25 中的 URL 粘贴进来激活相关用户。例如，在我的系统中，我访问了\
