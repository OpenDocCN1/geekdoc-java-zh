  \ id 的 session）……”。\n\n我通常习惯将此类赋值放在括号中，这是一种视觉提示，提醒它不是比较。\n\n按照上述讨论定义 `current_user`\
  \ 辅助方法将会导致如 Listing 9.9 所示的实现。\n\n**Listing 9.9:** 为持久会话更新 `current_user`。**RED**\n\
