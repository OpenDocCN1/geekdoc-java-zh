    # A Soft-Shell Formation in a Festival Economy


    # Peterson''s Conception of Industry-Driven Popularization


    Richard Peterson was one of the pioneers of the culture of production perspective
    that emerged in sociology in the 1970s. Central to this direction in sociology
    was the idea that culture and social structure do not simply mirror each other,
    but that culture is shaped by the system within which it is created, distributed,
    and evaluated (Peterson and Anand 2004, 311–12). Peterson''s landmark 1997 study
    of the country music industry develops an argument about industry-driven popularization.
    The book is a model analysis of the commercial urbanization of a music genre in
    the mid-twentieth century. It shows how the corporate music industry started to
    take interest in country music when the established production system was in crisis
    and reports on country music''s mass-market potentials surfaced in Billboard magazine
    (Peterson 1997, 187–89). One strategy employed by major recording companies was
    to develop performers into national stars by having them adopt middle-class aesthetics
    and eliminate rural and working-class signifiers (Peterson 1997, chapter 9; Holt
    2007, chapter 3). The so-called Nashville Sound was smoother and lusher. Peterson''s
    research showed that many of the performers of this softer form of country music
    were not positioning themselves'
