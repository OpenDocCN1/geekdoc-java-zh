    # Comparisons with Sziget and Nashashtiev


    Sziget


    Sziget emerged from a series of festive events in Hungary after the fall of the
    Iron Curtain. As the momentum of collectivist possibility faded with the acceleration
    of the country’s market economy, a commercial institution such as the broad popular
    music festival was likely to survive and grow (Szemere and Nagy 2017). More specifically,
    it was likely to grow as an institution of Anglophone global culture. Sziget adopted
    a focus on Angophone stars after a few years, while still making gestures toward
    civic freedom and social movements in its romantic self-image as “Woodstock on
    the Danube.” The festival’s image changed, however, with ongoing commercial development,
    which included corporate sponsorship, more superstars, and the sale in 2017 of
    a majority stake to a global asset management firm. This acquisition involved
    a plan to export Sziget internationally as a global brand (Rhian 2017). What began
    as a festive exploration of the socialist moment and the worldview of an idealized
    New Europe eventually merged the Sziget expanded the territory of large seasonal
    events for this culture eastward.


