    # Conclusion: Toward a Policy of Musical Performance Culture


    The analysis provides nuance to the argument presented at the beginning of this
    chapter. While public policy played a key role in establishing the nonprofit model
    as the dominant model in the organizational field of rock clubs, government support
    for clubs and in turn nonprofit popular music production declined during the live
    music industry boom. The allure of live music, embodied in consumer culture festivals
    and arena superstars, has put a spell on public institutions in society—city governments,
    the media, and corporate philanthropy. Furthermore, the funding mechanisms for
    national musical arts policy have been hobbled by austerity. The upshot is that
    clubs have increasingly been left to the market, with the rare exception of AB
    in Brussels, which was promoted at the national level and demonstrates some of
    the potential of a public institution of popular music performance. Melweg, Vega,
    and many other nonprofit clubs face the challenges associated with serving more
    as a rental space for booking agencies,'
