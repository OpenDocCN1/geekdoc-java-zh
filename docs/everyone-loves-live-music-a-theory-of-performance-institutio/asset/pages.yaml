    tastes in evolving media cultures of rock and EDM. Music programming in the older
    tradition of commercial rock festivals displays a continuity of neo-bohemian rock
    ideology, while EDM pop fully embraced mass culture in terms of musical aesthetics
    and tabloid celebrity.


    In conclusion, I hope to have demonstrated why critical approaches to music festivals
    need not rely on commonsensical ideas of commercial-ization and mainstreaming,
    but that they can benefit from analysis of the relationship of festivals to the
    market and the institutions of capitalism. This chapter’s analysis of industry-driven
    popularization has illuminated changes in the outlook of music festivals and in
    their functions in musi-cal culture and society. The systemic perspective on how
    festivals act in the market and in changing discourses has helped explain how
