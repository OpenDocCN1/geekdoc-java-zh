    # Socialist Festivity and International Humanism in the Twentieth Century


    What kinds of cultural worldviews guided music festivals in the twentieth century?
    The final section of this chapter explores the evolution of international humanist
    worldviews in the mid-twentieth century in the context of totalitarianism, war,
    and colonialism. This history will provide a counterpoint to the worldviews explored
    in subsequent chapters.


    The music festival literature excludes cultural festivity in totalitarianism and
    in times of war. These exclusions leave us with a limited understanding of music
    festivals in modernity. The history of musical festival illustrates the extremes
    of human history, which are not just marked by communism or consumption, but range
    from freedom to oppression, colonial conquest, and genocide. Musical festivity
    has a history in military marching bands, in revolutions, concentration camps,
    social movements, churches, and schools. Broadening conceptions of musical festivity
    and its role in human history beyond contemporary popular music festival discourse
    is vital to the social study of music.


