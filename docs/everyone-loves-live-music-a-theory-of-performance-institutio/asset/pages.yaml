    Bottom Line, Wetlands, Cake Shop, or Monster Island in New York anymore, and many
    of today''s largest events began as countercultural and independent festivals,
    have become virtually extinct. In the festival field, many of today''s Industry
    exploitation did not lead to the disappearance of these festivals but rather to
    their transformation into new models in corporate organizational fields. Up until
