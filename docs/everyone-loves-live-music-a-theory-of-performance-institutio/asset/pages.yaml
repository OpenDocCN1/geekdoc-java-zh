    # International Niche Festivals


    International niche festivals constitute an alternative to the broad festivals
    by concentrating on a smaller area of popular music and attempting to become the
    primary international destination for that area or genre. This claim to uniqueness
    has a geographic dimension: It builds on the mythology to place in popular culture
    and in the genre more specifically. The niche festival presents music that has
    an audience in many countries and can be heard at others, but not with the same
    focus and scale. The Sonar festival in Spain, for instance, was created in 1994
    by a few young people who were aware that the local audience for their favorite
    electronic dance music was small at the time, but who were nevertheless struck
    by the potential in the music''s international circulation: "One million people
    all over the world could come together in this event" (Ventura Barba, public presentation,
    September 21, 2011). The festival was conceived for an international niche audience
    from the outset. Another example is the Iceland'
