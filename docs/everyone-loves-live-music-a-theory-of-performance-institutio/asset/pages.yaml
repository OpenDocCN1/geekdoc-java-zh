    # The Performance in a Cultural Event


    In popular culture, musical performance is frequently part of cultural events,
    such as festivals, street parades, and song contests. The performance creates
    a marked moment of musical experience within the event, while the event creates
    a context to which performers and audiences adapt. The event is defined by an
    overall theme and symbolic sphere, which involves constructions of space, genre,
    and identity. In large outdoor events, performers often adapt to audiences who
    may be distracted and not familiar with their music by playing their most popular
    repertoire in their most monumental style of expression. Such events provide a
    further case for extending Hall’s theory of proxemics to musical performance culture.
    Moreover, the symbolic power and scale of large cultural events create the potential
    for a performance to become a powerful symbolic moment in society. This section
    addresses general aspects of cultural events, while the festival chapters explore
    a particular type of event in more detail. The section draws on the literature
    on events in tourism studies and in media studies.


