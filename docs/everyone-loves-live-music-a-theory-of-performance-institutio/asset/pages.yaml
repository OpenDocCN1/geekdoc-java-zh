  md: '# CHAPTER TEN


    funded by the ERC in the period 2007–2024. Many have adopted computational methods
    and physical-biological conceptions of music.’ These projects have the potential
    to make valuable contributions to music studies, but this policy-driven development
    transforms the ecology of humanist music studies by subjecting the field to the
    conditions of perpetual competition for funding in “academic capitalism.” The
    system stimulates a culture of “critical optimism” (Berlant 2011) in which scholars
    “play along” to receive benefits such as employment security, research time, bonuses,
    and institutional power (Keskkinen and Silus 2006, 78). Such incentives are likely
    to influence decisions about research among professors in an increasingly unprotected
    environment.


    Second, there is an emphasis on current societal challenges and industry partnerships.
    The EU dedicated funding program for the humanities since 2009, HERA, has promoted
    a soft adoption of the Mode 2 agenda. HERA projects have generally operated with
    a model of transdisciplinarity derived from Mode 2 discourse. The discourse of
    transdisciplinarity has gained traction after The New Production of Knowledge
    was published can be distinguished from conventional notions of interdisciplinary
    by its producing knowledge and for industries (Nowotny et al. 2021, 89). Applications
    for HERA require industry partners, although the language around this has become
    softer. The most recent call for applications stipulated that projects develop
    “links with stakeholders outside [the] academy” to “maximise the social benefit
    of research” (“HERA JRP”). The emphasis on societal challenges, moreover, results
    in a growing reliance on social science discourse in the humanities in order for
    applicants to convincingly demonstrate societal relevance. This means that humanists
    are rewarded for cultivating more generalist discourses.


    About fifty ERC projects intended to support the development of an individual
    scholar’s career have been awarded to music scholars. This small number of projects
    represents a circumscribed capacity to strengthen the institutional basis of the
    field as a whole. What is more troubling is that ERC-funded music projects have
    little impact on music studies. Future intellectual histories of music in the
    early twenty-first century will not draw a distinction between a “before” and
    an “after” ERC funding. ERC projects have in fact tended to explore topics after
    the theoretical groundwork on those topics has been laid by individual scholars.
    Scholarship on musical performance culture is a case in point. The first HERA
    project related to musical performance culture was a 2019 project on music festivals.


    The intellectual value of ERC funding in music studies is limited by the short
    production cycle and the growing bureaucratization, which rewards'
