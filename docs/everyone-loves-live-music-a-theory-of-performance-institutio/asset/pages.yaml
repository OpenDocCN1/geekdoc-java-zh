    # Anglophone Global Culture


    The Anglophone Turn in Continental Western Europe after World War II


    The evolution of Anglophone popular culture in Continental Europe after World
    War II has been shaped by the region''s overall political geography. Deep divisions
    have existed between the political systems in East and West and between the two
    superpowers, the Soviet Union and the United States. The division between East
    and West, originating in the split between the Catholic Church and the Orthodox
    Church in the eleventh century, was transformed by the new global order and by
    the Soviet Union''s control of Eastern European nation-states. Some of the dynamics
    of Anglophone popular culture in Continental Europe are illustrated in the example
    of the divided Germany. Jazz and rock ''n'' roll were initially met with skepticism
    in both countries of the divided Germany, a narrative emerged in West Germany
    that positioned these genres as symbols of freedom and economic progress (Poiger
    2000). Western European narratives of democracy have long projected positive images
    of capitalism and cultural industries and consumer culture. These narratives were
    central to the evolution of neoliberalism in Western Europe and in socialist Central
    European countries (Szemere 2001).


    The aftermath of World War II shaped nationalism and internationalism in West
    Germany. Uta Poiger argues that the challenged state of nationalism in the 1950s
    created anxieties about gender and family. From this perspective, the rise oflager
    music can be interpreted as a form of postwar recovery, as a positive national
    culture with idealized images of love, family and a stable, patriarchal order.
    For youth, on the other hand, American popular culture provided an alternative
    to conformism with its African aesthetics and more relaxed social and sexual norms.


    Other kinds of affective bonds with the United States were created through cosmopolitan
    and neo-bohemian forms of popular music. Jazz had a history of functioning as
    a music of multiculturalism in Europe since'
