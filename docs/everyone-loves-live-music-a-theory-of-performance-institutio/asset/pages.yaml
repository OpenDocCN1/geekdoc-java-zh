    # The German Bourgeois Tradition: The Case of the Lower Rhine Festival


    The civic music festival traditions that began in England in the 1760s and in
    Germany in the 1810s were fundamentally different from the festive events of the
    French Revolution. Above all, they were focused on concerts, organized within
    the sphere of musical institutions. They were not staged to coincide with political
    speeches and parades.


    The origins of the music festival can be identified more specifically in the cathedral
    festivals in London during the 1690s. These festivals were choir festivals, expanding
    on annual celebrations. They combined cathedral and royal choirs into one to amplify
    the scale. Choir had been massed, but this now evolved into a regular phenomenon
    of its with a social base in the charitable institutions that began to proliferate
    throughout Europe in the eighteenth century (Butt 2002, 215). The phenomenon spread
    to cathedral cities in the British Isles. It was a widespread trend by the 1750s.
    The Birmingham Music Festival represented the development of cathedral festivals
    into civic music festivals, which included secular music and celebrated composers.
    The Handel Commemorations in London in 1784 stimulated the further growth of music
    festivals around the country, and the festival movement peaked in popularity in
    the mid nineteenth century, the same time as its German counterpoint (Drummond
    [2011] 2016). The Birmingham festival almost exclusively programmed music by Handel
    from 1768 to 1829 (Weibel 2006, 61).


    The small literature on British civic music festivals in the late eighteenth century
    distinguishes them from earlier celebrations in the church and among the aristocracy.
    Weiss states that this tradition marked a departure from feudal society, in which
    cultural festival was organized and for the aristocracy. Goethe wrote in 1788
    that the Roman carnival was an event that “the People [gave] to itself” (Goethe
    [1988] 893, 897), but the music festival that emerged a few decades later in Germany
    represented a new situation. In the music festival, the bourgeois class constructed
    its own symbolic order in the geopolitical realms of city and nation. Music festivals
    were organized by city-based civic associations, inspired by ideals of democracy,
    cultural education, humanism, and solidarity (Weibel 2006, 62). There was more
    space for these civic ideals in the early era of the 1810s and 1820s when the
    choirs and orchestras were largely made up of amateurs. As the festivals became
    commercially institutionalized, their values changed.'
