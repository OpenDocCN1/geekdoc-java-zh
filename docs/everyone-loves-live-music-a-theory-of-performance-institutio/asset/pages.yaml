  md: '# Conclusion 281


    guarantee the autonomy of professors (Rüegg 2016, 16 and 28). The declining protection
    of trust in professors transform their subjectivities into authoritarian servants.
    The cocky Adorno and Foucault are being replaced by more docile craftsmen in designated
    areas, conducting research at the same time as they collect quantitative merits,
    write grant applications, and serve as industry partners. One may or not appreciate
    the cocky humanist, but with the destruction of the ivory tower, society has also
    lost most of its advantages. A profession of servitude is not conducive to producing
    wisdom. Intellectual idealists consider migrating, but where to? They have no
    protected places, no institutions of autonomy.


    The short production cycles of the research project detract scholars from longitudinal,
    large-scale historical and systematic explorations of their field. This form of
    hyperity intensifies fashion dynamics, and longer-term intellectual and cultural
    histories become unfashionable. In short, universities produce more utilitarian
    knowledge at faster speeds, but with a reduced depth and scope. To further situate
    this book in consider how they are articulated by the research funding schemes
    of the European Union.


    # European Research Policy


    European Union member begin channeling resources into common schemes of research
    in the 2000s. The dominant vision focused on Europe’s competitiveness in a global
    knowledge economy. Europe’s future was imagined to depend on technological innovation
    in a race toward higher productivity (Felt 2014, 387). The humanities were lumped
    together with the social sciences and integrated into the Horizon 2020 framework
    to serve as an assistant tool for the technical sciences. This development reflected
    the hegemony of Mode 2 discourse and its limited understanding of the humanities
    (Barry, Born, and Wezkalyns 2008, Osborne 2015, 12–15). The announcement of Horizon
    2020 during Holga Nowoty’s presidency of the European Research Council (ERC) was
    met with resistance. This included an international petition demanding a broader
    concept of innovation and a body of research that critiqued the ERC’s conceptions
    of the social sciences and humanities (Felt 2014; Leidov and Neubbauer 2014).
    These responses indicate that the humanities are redefined in the process of their
    European centralization.


    First, we can discern the political influence on research topics and disciplinarity.
    The primacy of technoscientific research can be identified in the orientation
    toward the natural sciences in about half of the music projects'
