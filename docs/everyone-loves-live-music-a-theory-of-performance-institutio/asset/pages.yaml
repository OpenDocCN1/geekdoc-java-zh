    The German tradition started in cities of the Lower Rhine region, which had been
    occupied by Napoleon during the French Revolution. The Revolution intensified
    nationalism in the subsequent era (Blanning 1899, 127), and music festivals became
    a site for performing and bourgeois emancipation. Of particular significance to
    the bourgeois worldview was the regular programming of large-scale works by German-speaking
    composers, especially Beethoven and Handel. The evening concert on the first day
    of the festival was a Handel oratorio featuring a choir with an average of 547
    singers (in the 1850s and 1860s). The second day usually concluded with a Beethoven
    symphony (Porter 1980, 217). The specific location of the worldview could be identified
    in the organization: The festivals were organized by local associations and subsidized
    by the local city government. Their bourgeois symbolic order notwithstanding,
    festivals had the broadest social representation in concert life, incorporating
    women in mixed choirs and amateur singers from the surrounding region.


    The German tradition is the first example in Continental Europe of a major growth
    spiral and commercial institutionalization. The growth spiral is a self-amplifying
    process in which the excitement the growing scale of the event among audiences
    and organizers leads to desires for further expansion. For organizers, expanding
    the festival was variously a strategy of survival and exploitation in the growing
    market competition. Organizers expanded their festival''s audience capacity, programmed
    bigger, and produced more spectacular stage shows. This spiral eventually posed
    a structural challenge to the institution because operating costs increased for
    all festivals in this organizational field. The recent growth spiral in popular
    music festivals illustrates how this process can be amplified by electronic media
    and international cultural industries (chapters 8–9).


    The commercial institutionalization changed the cultural worldview of the bourgeois
    festival. Weibel''s account shows that more priority was given to popular tastes
    and star performers, while the humanist aspirations of the Enlightenment weakened.
    In 1833, the Rhine Festival added a third day with a virtuoso concert, and by
    the 1850s only a third of the soloists were amateurs and audiences came to expect
    star soloists (Porter 1980, 219; Weibel 2006, 68). Moreover, the festival was
    defined by a perfect and formal concert presentation for larger audiences. Concert
    halls were renovated and expanded requiring considerable investments.


