    larger audiences. Generally speaking, the typical size of the day crowd at the
    largest festivals in Europe has increased from about 30,000 in the 1980s to 50,000
    in the 1990s and 70,000 in the 2000s (see pp. 23–24 and 50–51). This expansion
    would not have happened if the programming had not been broadened from "hard-core"
    forms of rock music to "soft-shell" forms of rock and chart-topping pop stars
    (chapter 8). The broad pop festival has opted genres such as metal, rap, house,
    and techno along the way. The peers of this festival type in Continental Europe
    were influenced by Woodstock and compare themselves to Glastonbury and, since
    the 2010s, to Coachella, festivals in relative proximity to London and Los Angeles,
    respectively. The analysis below focuses on Roskilde in Denmark and compares it
    to Siget in Hungary and more recent festivals in Poland, Serbia, and Russia. Future
    research on variations of this type might also consider festivals such as Lowlands
    and Pinkpop in Holland, Pukpop and Rock Werchter in Belgium, and Festival Internacional
    de Benicàssim in Spain.


    # Developments in Programming and Audience Size


    Roskilde evolved from the city’s small festival that had been held annually since
    the 1950s and with the support of the city’s elite. This small-town festival was
    influenced by the hippie movement, following local festivals in Thy, Nyborg, and
    Fernet, and the square village of Christiania in Copenhagen. In 1972, the local
    organization committee transferred ownership of the festival to a local philanthropic
    organization called the Roskilde Foundation and the actual production was organized
    by two students at a local high school.


    A music programming team was created in 1973. Leif Skov was a member of this team
    and became manager of the festival in 1977. He remembers that the first “real”
    festival was in 1975, as Procol Harum played. He began networking with managers
    of other festivals in the late 1970s, but it was still a small organization, and
    even he was not employed full-time until the late 1980s (Leif Skov, conversation
    with the author, October 17, 2019).


    In its early years, Roskilde presented a mix of local countercultural rock bands
    with artists who performed at hippie festivals in the United States, such as Ravi
    Shankar and Santana. Interest in world music extended to bookings of Weather Report
    and Bob Marley. None of these artists figured on the recording list of the top
    best-selling artists in the world, and they generally did not tour regularly in
    Continental Europe. There were few popular music festivals in Scandinavia in the
    1970s and therefore far less market competition today. Another striking difference
    was the representation of local artists: A large proportion of the headlining
