    # The Postwar Humanist Moment


    Festive events moved to the forefront of a new civic moment across East and West
    in the immediate aftermath of World War II. The scale of destruction and ethical
    violations together contributed to interests in transnational public order following
    such extraordinary devastation. A growing interest in transnational alliances
    for peace led to the formation of the United Nations and the organization that
    would eventually become the European Union. New viewpoints were proposed by intellectuals
    such as Theodor Adorno, Erich Auerbach, Albert Einstein, and Hannah Arendt. Adorno
    and Max Horkheimer''s *Dialectic of Enlightenment* proposed a rethinking of fundamental
    beliefs about modern society and particularly the mythology of Enlightenment.
    They argued that cultural progress had been turned into its opposite and that
    knowledge had not liberated humans from fear. “[T]he enlightened earth is radiant
    with triumphant calm,” they claimed (Horkheimer and Adorno 1947/2002, 1). Auerbach
    wrote one of the most ambitious and influential pieces of literary criticism (Auerbach
    1953), that contended Western literature from the position of an exiled European
    selfhood (Said 1983, 7–8). Einstein wrote several essays about peace, poetry,
    civilization, and the role of government and science (Einstein [1950/1978] 2011).
    His call for a new form of global government was echoed in Hannah Arendt’s *Origins
    of Totalitarianism*, completed in 1950. She wrote it “against the back of both
    reckless optimism and despair” and challenged narratives of progress and doom
    as forms of superstition. Arendt felt that the brutality of recent world history
    called of a fundamental change: “[H]uman dignity needs a new guarantee which can
    be found in only a new political principle, in a new law on earth” (Arendt 1951/1966,
    vii and ix).


