  md: '# CHAPTER FOUR


    market—the music, poems, and films were generally considered too esoteric and
    obscene to achieve wider commercial circulation. The rock scene that evolved in
    the 1970s had this local dimension, but it also developed a mass-market dimension
    following the success of the Velvet Underground and others. It was rock music
    in particular that popularized the bohemian scene, especially certain aspects,
    such as bodily immediacy, sex and drugs, that had wide appeal and could reach
    large media audiences as part of a song with a steady beat.


    There were few dedicated rock clubs in Lower Manhattan when CBGB opened in December
    1973 (Kozak 1988, 8–9). Manager Hilly Krystal previously managed the prominent
    jazz club Vanguard and a restaurant and bar called Hilly’s on Ninth Street, but
    in Greenwich Village (Kozak 1968, 35). Krystal was interested to the Bowery because
    he came down and say “all this stuff happening with the artists and moving lofts
    there” (Kozak 1968, 35). He expressed interest in “a growing artists'' colony”
    in the Bowery in 1965 and the influx of bands that had played Mercer Arts Center
    (Kozak 1968, 3 and 9). David Byrne lived a block from CBGB and remembered that
    little else was happening in the area (Kozak 1968, 40). Krystal hoped the Bowery
    would become the center of a new community (Kozak 1968, 3). He initially programmed
    country music and poetry readings, but this was not in demand, and within a month
    of opening, CBGB focused on rock music, filling a gap left by the temporary closing
    in 1973 of Max’s Kansas City in Gramercy Park (1965–1981) and the shuttering of
    the Mercer Arts Center in Greenwich Village (1971–1973). CBGB entered the growing
    ecosystem of an emerging punk and neo-bohemian arts scene, but created musical
    performance events. It also created an alternative to Max’s, which had a cabaret
    presentation and an arts crowd. In the opinion of Max’s new book Peter Crawley,
    Max’s had more art rock and “hipster,” while CBGB became more punk and “hippies”
    (“Peter Crawley: Max Man Behind the Music”).


    CBGB became an institution of a new East punk and new wave rock scene, creating
    a space for many local musicians and audiences. The club created opportunities
    for musicians participating in this scene to gain performance experience and improve
    their ability to be discovered by the recording industry, which was the major
    commercial realm in the rock music economy at the time. Many relatively unknown
    artists had an opportunity to play several shows in a short time period, sometimes
    up to six shows in just one weekend (Kozak 1988, 7 and 16). For this reason, many
    musicians developed a close relationship with the club as an institution of artistic
    pioneers, of socialization, employment, and career opportunities.'
