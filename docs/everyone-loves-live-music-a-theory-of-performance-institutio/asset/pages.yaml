    # Intellectual Histories of Performance in Music Studies


    Contemporary discourses on performance in music studies can be interpreted in
    the context of the broader evolution of thinking about performance culture in
    the humanities. Ideas about performance culture—in the specific forms of theater
    performance and traditional festive events—emerged in the late 1960s in response
    to developments in cultural life at the time. Richard Schechner, a pioneer of
    performance studies, was influenced by various cultural movements in the 1960s.
    He was particularly influenced by experimental theater and its abandonment of
    traditional dramatic conventions, which resonated with broader antiauthoritarian
    sentiments at the time (Schechner 1977/1988; Callaghan 2013). Large public gatherings
    were central to the Civil Rights movement, student revolt, and other social movements.
    At the same time, research literatures on popular culture began to emerge, and
    some of them drew inspiration from the anthropology of ceremony, performance,
    and ritual (Mukjer and Shadson 1986, 48–49). This trend in popular culture studies
    had impact on popular music studies, but mostly in the field of semiology, not
    performance theory (e.g., Hegel 1979; Lange 1985/2011; Wals 1993). Emile Durkheim,
    Erving Goffman, and John Austin, for instance, received little attention in music
    studies until the 1990s, and a broader discussion of the potential of social scientific
    performance theory for music studies is yet to appear. In general, narratives
    of performance have evolved within literatures on individual music genres and
    within other, more dominant ontologies of music. Nonetheless, there are developments
    in music studies that merit more detailed examination.


