    # Festival Cultures and Styles of Mediation


    Music festival video is a cinematic mediation of the festival experience and belongs
    to a history of festival cinematography. Before the advent of social media video
    in the late 2000s, festival cinematography had been limited to the occasional
    festival film, which integrated elements of a concert film with footage of the
    festival area. Festival films or documentaries had the length of a full-length
    feature film were shown in cinemas or on broadcast television. From the 1980s
    onward, they also circulated on videotapes and later DVD.


    An influential example was Jazz on a Summer’s Day (Stern 1960/2001), which featured
    the Newport Jazz Festival in 1958, by an established cultural event. The movie
    was produced by the jazz producer for Columbia Records, George Avakian, who worked
    with the biggest headliner then, Louis Armstrong, and also produced a companion
    album to the movie. The movie was essentially a film of concerts with interpersed
    footage of the festival grounds and surrounding areas. Their behaviors made a
    strong impression on media audiences and was perceived as a distracting factor
