    # Media Distribution and Self-Image


    In the 2010s, Roskilde''s ticketing and broadcasting shifted hands from local
    to international corporations. For decades, ticketing had been handled by a Scandinavian
    company, and broadcasting rights were assigned to the stateowned Danish Broadcasting
    Corporation (DBC). Interests in growing the business and attracting more international
    audiences motivated the decision to form a partnership with Ticketmaster in 2014
    and with Red Bull TV in 2016 (Østbjerg 2013). The growing market penetration by
    international ticketing corporations CTS Event and Ticketmaster, which was purchased
    by Live Nation in 2010, means concert and festival promoters are motivated to
    contract their services because they are already used by more people and thus
    increase the sales potential (Klemm 2019).


    In broadcasting, Roskilde for years tried to get a dedicated live channel on YouTube
    to attract more international customers and strengthen its general market position
    during the boom (Dansen, conversation with the author, March 15, 2013). YouTube
    provided a live channel to a dozen of the most internationally renowned music
    festivals in the Global North, including Coachella, the New Orleans Jazz and Heritage
    Festival, and Tomorrowland (see p. 253). Roskilde''s relative inferiority in the
    symbolic economy might also explain why its partnership with Red Bull lasted only
    two years. Red Bull TV concentrates on festivals with a stronger international
    appeal and that are located near larger cities in larger countries. The partnership
    with Red Bull is nonetheless illustrative of the power of Angelophone global culture
    and its impact on festivals and their local audiences themselves.


    What characterized Roskilde''s media image during the four decades of partnership
    with DBC? Until the 2000s, DBC primarily covered Roskilde in the form of radio
    broadcasts of concerts and involved little television coverage. The festival denied
    access for some small television stations because were more anxious about incidents
    of voyeuristic, insensitive photography and because audiences were more anxious
    about photography before the era of smartphones. Many bands, moreover, declined
