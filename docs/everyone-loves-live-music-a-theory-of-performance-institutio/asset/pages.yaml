    psychology (e.g., Clarke 1988). The book is a specialized study of the aesthetics
    and psychology of performing music—an approach that can also be found innomusicology
    (Clayton, Dueck, and Leante 2013). Cook''s perspective is wide, as he contemplates
    the implications of his approach for the history and theory of Western art musicology.
    The book''s introduction offers a revisionist argument that performance has a
    more fundamental role in music culture than previously recognized. However, the
    book generally'
