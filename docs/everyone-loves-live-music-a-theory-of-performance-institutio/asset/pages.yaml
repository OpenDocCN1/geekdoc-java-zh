- img_proc: true
  md: 'tism in Late Modernity. Regev''s objective is to explain the symbolic economy
    of global pop culture sociologically. He emphasizes the role of generic models
    as communication models. Regev argues that the same models or schemata in cultural
    production—including music genres and styles of sound production, and we might
    add models of musical performance institutions to the list—are used in many societies
    as a result of intensified media proximity. With the compression of time and space,
    shared international models become a more powerful form of social capital. The
    quest for status, participation, and parity lies at the core of aesthetic cosmopolitanism
    (Regev 2013, 10). American or Western models can index not only Anglophone culture
    but also internationalism and universality.


    How might this apply to music festivals? In the following section we shall see
    that a growing media proximity and proliferation of Anglophone models can be registered
    in the design, music programming, and productions of festivals. Large popular
    music festivals in Continental Europe imagine alongside Anglophone festivals.
    Festival lineups in the 1970s featured many local artists who performed national
    folkloric styles, but those styles have largely disappeared. Many local artists
    now aspire to a mastery of Anglophone internationalism, and festival lineups feature
    many more artists from North America and the United Kingdom.


    The further analysis of this transformation of festival worldviews into one of
    Anglophone internationalism can easily distinguish between two types of festivals.
    One is the broad festival that presents a range of stars in the most popular Anglophone
    media spheres. The other is the niche festival is an international destination
    for a particular kind of music and defined by tourist images of its location.
    The two types thus illustrate logic and dynamics. This analysis of the worldview
    transformation focuses on core elements in the symbolic order: music programming,
    on the one hand, and media distribution and self-image, on the other.


    # The Broad Pop Festival


    This type of festival evolved from the hippie music festival, from hippie culture
    and its imagination of the festival as a place for restating and experiencing
    the worldview of contemporary popular music and culture in a greenfield setting.
    For the festival industry, the broad programming serves to attract local mass
    audiences. By presenting stars from a range of genres, the festival appeals to
    audiences in a number of markets. This explains why why this festival model is
    the most common among the largest festivals, and why niche festivals tend to develop
    a broader program over time to attract'
