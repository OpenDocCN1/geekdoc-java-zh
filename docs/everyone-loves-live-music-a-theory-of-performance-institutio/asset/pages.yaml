    # The East Village Scene in the 1970s and a Century of Poverty


    The Brooklyn scene generally did not articulate a cultural history beyond its
    own. In this respect, it was a popular culture immersed in the here and the transformation
    of the club institution in gentrification can only be fully understood by looking
    beyond this scene. The social history of the Lower East Side is important in explaining
    the genealogy of the contemporary field of rock clubs. The field emerged in the
    neighborhood''s northern section, the East Village, and bifurcated in the accelerating
    gentrification of the 1990s. The commercial club was a product of the neighborhood''s
    gentrification, while the warehouse scene in Williamsburg was an exodus and revival.
    They became somewhat separate and contrasting worlds, and they did not articulate
    their origins in the same neighborhood and the same genre.


    # A Century of Exploiting the Poor


    The performance culture of the Brooklyn scene took inspiration from diverse urban
    cultures and music media cultures, from the local punk tradition of the 1970s
    to national indie and metal scenes of the 1990s, displaying a dynamism between
    urban performance cultures on the one side and national and international mass-media
    cultures on the other. A social study of the rock club in gentrification, however,
    would be insufficient without taking into account the history of white neo-bohemianism
    on the Lower East Side. From the young white people moving into the East Village
    in the 1960s, their cultural expressions involved an exoticization of urban decay
    and ultimately of poverty, and this continued when the influx of white people
    accelerated in the 1980s. The East Village had been poor long before the low point
    of the 1960s and 1970s. Most buildings had been con-'
