    # The Media Events Literature


    The literature on media events emerged in response to the rise of live broad-casting
    of major societal events on satellite television in the 1970s. Communication scholars
    registered the role these transmissions played in the public''s interpretation
    of such events and how the events disrupted every-day media routines. A central
    argument made by Daniel Dayan and Elihu Katz, was precisely that live transmissions
    of such events illustrated general aspects of the relation-ship between media
    and society. The events showed how television had the power to define society,
    how it ascribed meanings and emotional values to its objects of mediation, and
    how it created an imagined center in society.


    It was the live broadcast of Anwar El-Sadat''s trip to Jerusalem in 1977, during
    which Sadat prayed at the Al Aqsa mosque, first caught the attention of Dayan
    and Katz (1992, 26). The two began by comparing Sadat with the astronauts on the
    televised moon landings and discovered similar dynamics. Their 1992 book, which
    laid the foundations for media event theory, also considered events such the Watergate
    hearings and the 1989 revolution in Prague (Dayan and Katz 1992, 157–59). Their
    theory integrated mass communication with perspectives from the anthropology of
    ceremony. This disciplinary framework has potential for explaining fundamental
    aspects of the relationship between events and media beyond the culture of broadcast
    television. Above all, it can account for how media adapt to the ritual dynamics
    of powerful cultural and social events and coconstruct these events as imagined
    centers of power (chapter 9).


    Much of the book''s value lies in its deep understanding of the dynamics between
    media and events through detailed descriptions and examples. The book''s specific
    typology of events and its specific theoretical framework, on the other hand,
    have been subject to critiques (Couldry and Hepp 2010, 5). Such criticism concerns
    the limitations of the typology of contests, conquests, and coronations that Dayan
    and Katz at one point describe as primordial events (Dayan and Katz 1992, 43).
    Couldry and Hepp (2010) briefly touch on "popular media events" in "consumer and
    celebrity culture" but do not explore this further. The media events literature
    has not yet theorized events in the music field.'
