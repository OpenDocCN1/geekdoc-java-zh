    with a supersensory reality embodied in the score. This conception evolved with
    the advent of music notation in the Middle Ages and the idea of writing more generally
    as an instrument of advanced civilization (Cook 2013, 11-15). In nineteenth-century
    German idealism, the score became the central concept of music. The task of the
    performer was to reproduce the substance of the music, encapsulated in the score,
    as neutrally as possible. The hegemony of writing was reflected in the objectives
    of early musicology, which aimed to retrieve, edit, and analyze cultural canons
    (Cook 2013, 16). Beyond the Score critiques this textualism, arguing that the
    score is a script and musicians must employ their experience and creativity in
    performance. This involves aspects such as emotional expression, phrasing, tempo
    and timing, dynamics, and timbre. Cook draws on Lydia Goehr’s argument that the
    musical work is a regulatory device opposed to a fixed essence. This argument
    is further substantiated by his discussion of the historically informed performance
    movement, which challenged normative ideals of neutrality and the performer’s
    reductive function.


    Cook’s approach, as rigorous and insightful as it is, has few limitations from
    which we can learn. First, the book focuses on the artistic activity of musicians
