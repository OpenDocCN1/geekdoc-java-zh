  md: development in interdisciplinary music studies provides an immense knowledge
    resource. It has played a key role in the construction of the study object, the
    critique of decontextualized live music discourse, and is essential to future
    transmission of knowledge of music. What is more, this book has not attempted
    a singular synthesis that erases disciplinary difference, but rather retains the
    distinctness of music studies and sociology in the investigation for analyzing
    different dimensions of the object. Their logics taking leading roles at various
    stages in the investigation both complement and challenge each other. The sociological
    narrative of institutions transforms music studies expands and transforms the
    sociological conception of leisure institutions in modernity. Future work in the
    social study of music can further explore how these different disciplinary logics
    might productively use competition and friction between them to fully exploit
    the potential of their combination. This requires specialist knowledge and experience
    in both deisciplines, and that is both a great potential and a challenge of interdisciplinarity
    scholarship.
