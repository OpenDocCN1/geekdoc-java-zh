    # Conceptualizing Musical Performance Culture


    While scholars in specialized subfields of music studies have made major contributions
    to the study of musical performance, the social study of music still lacks an
    analytical synthesis of these contributions and a systematic conceptualization
    of musical performance culture. This chapter provides this synthesis and conceptualization.
    It expands on the revisionist critiques of textualism in musicology during the
    2010s by developing a broader concept of performance culture, drawing from the
    sociology of the body, ethnomusicology, performance studies, and event studies.


    The chapter proposes an integration of three ontologies of musical performance
    culture and is organized into an exploration of each ontology. It begins with
    an overview of intellectual histories of performance in music studies to take
    stock of the current situation and motivate further development. The three ontologies
    are mapped in table 2.1 and explored in the following sections. The first of these
    sections explores the ontology of forming bodies through the literature on performativity
    and affect theory in music studies and the sociology of the body. The second explores
    the ontology of the musical performance event, focusing on the relationship between
    architectural space and ritual. The third explores the ontology of musical performance
    within a broader cultural event, such as a festival or a TV show, highlighting
    some of the different functions that musical performance can have in cultural
    events.


    Following the book''s overall objective, the chapter focuses on performance culture
    in commercial institutions in which performers and audiences are copresent in
    the same physical environment. The discussion in the final section of performance
    in media spaces serves a comparative function. Finally, the chapter points to
    the impacts of commercial institutionalization'
