    # Conclusion: Human Life in Accelerated Capitalism


    This chapter brought together contemporary ethnography, history, and urban social
    theory to analyze the commercial institutionalization of the rock club in New
    York City as part of the broader process of gentrification. The analysis highlighted
    the transformation of the club institution from the informal bar and club within
    a neo-bohemian scene into the indie club concert theater within a corporate production
    system and a national urban middle-class media culture. This transformation followed
    the commercial institutionalization of indie rock itself, in which elements of
    urban sophistication were developed into music with a more popular appeal and
    an emphasis on professional authority, not just in sound recordings and stage
    performances, but in production and consumption as a whole. The performance culture
    developed further into media culture as the music and the performance event increasingly
    constituted through media and less through regular scene participation.¹ With
    the growing emphasis on headliners, regular scene participation in performances
    by local artists died out, while the less frequent, more planned, and formal concert
    event became a supplement to media consumption. While the professional and commercial
    aspirations that could be found in leading clubs of the 1970s such as CBGB further
    evolved into accelerated gentrification, the specifically local neo-bohemian scene
    and its experimental culture, which had created a socio-artistic ecosystem for
    professional clubs, died out in the 1990s. The scene culture migrated elsewhere
    but eventually died in the 2010s.


    Gentrification and commercialization are bound up with questions of value. Fundamental
    divisions exist between neighborhood scene culture and corporate consumer culture.
    These value systems have shaped production and human relations in musical life,
    and they are essential to the history and sociology of the club institution. These
    value systems, over, can be interpreted and contextualized by the more general
    distinction between public and private value systems in capitalism.


    Dominant agents of gentrification and commercialization tend to normalize their
    value system, portraying change as inevitable without directly acknowledging the
    underlying ideologies. As corporations and affluent populations dominate more
    and more in the condition of generalizedrification, the value system of private
    enterprise and corporate consumer culture becomes hegemonic. The products of the
    corporate concert industry appeal to the dominant population. In its value system,
    there is less desire for more regulation of gentrification, and the decline'
