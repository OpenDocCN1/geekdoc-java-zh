  md: 'professional craft, not originality. This points to a future in which more
    innovative knowledge and critiques of powerful institutions will be produced outside
    the university. This institutional development encourages the evolution of university
    professors to become more professionalized but also more generic and conformist
    craftspeople.


    # A Product of Its Time?


    This book is in ways a product of its time. First, it follows the hegemonic ideal
    of professional craft. It adopts the language of an investigation with analytical
    progression, literature review, empirical evidence, and field expertise. Second,
    this book examines an area of interest to economic and political institutions
    and involves collaboration with them. It does not question the value of their
    existence, although the analyses suggest that the race for economic growth has
    had negative effects on the conditions of music and urban life. After more than
    a decade, life scholarship is yet to develop critical analysis, and this should
    raise concerns about the impact of current research policies on the quality of
    research. Is the system that rewards scholars for playing also promoting uncritical
    research?


    Third, the book''s somewhat generalist sociological discourse is shaped by institutional
    interests. Dominant agendas in society have altered interpretations of the balance
    between generalist and specialist knowledge in the humanities. Professors in the
    new transdisciplinary or vocational departments develop more generic skills and
    knowledge of cultural industries, but they also have less opportunity to generate
    circumscribed conceptions of art and humanity. As a young music historian and
    ethnomusicologist, I was fortunate in the late-2000s to land a tenured job in
    my home country in a transdisciplinary and vocational program, but I did not give
    music studies or the humanities and continue experience tension between Mode 1
    and 2 regimes.


    This leads to the final point, namely that this book draws on Mode 2 experience
    but is deeply invested in Mode 1, specifically the ideal of noninstitutional science
    and unfettered academic freedom under the condition of (inter)disciplinary authority:
    The political agenda for transdisciplinary in Mode 2 needs to be confronted with
    critical discussions of knowledge production to secure a system of checks and
    balances for research quality, knowledge transmission, and interest in the public
    good. This requires a deep understanding of the history and functions of disciplines.
    The discipline of musicology that emerged in the late nineteenth century and its'
