    # Conclusion: A Productivist Argument?


    This chapter expanded on Peterson’s argument about industry-driven polarization.
    His conception of the relationship between a genre-core and its shell was adopted
    into an analysis of contemporary popular music culture and festivals. I argued
    that festivals still contain hard-core and softshell music in their programming,
    but that they have shifted emphasis to the latter. Petter'' argument also served
    to conceptualize the evolution of EDM pop from clubs to festivals and to situate
    it in the long history of the corporate industry’s exploitation of musical formations
    beyond their own distinct genre spheres. Another key aspect of this chapter’s
    argument is that the softshell evolution in rock and EDM pop festivals involved
    the rise of the media economy of headliners and the broadening of the institutional
    base from music and festival ideals into mainstream business and society. The
    latter included alliances with city governments and the integration into general
    commodity markets, such as fashion and advertising.


    How might the social study of popular music festivals add to the old productivist
    vision of industrial organization as the engine of history? Is the consumer culture
    music festival merely an effect of the capitalist mode of production? Sociologists
    have turned away from this vision, which proliferated in the formative era of
    the discipline (2007). While the argument presented here highlights the agency
    of the industry, it goes beyond productivism by combining the analysis of industry
    and market logics with the analysis of culture and media. The headliner economy
    and the marketing video, for instance, were analyzed as market-driven developments,
    but also as an exploitation of consumer desires and the media culture of music.
    The soft-shell evolution in festival profiles was similarly inter-'
