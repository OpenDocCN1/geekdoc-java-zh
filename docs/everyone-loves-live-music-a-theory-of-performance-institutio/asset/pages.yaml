  md: '# CHAPTER ONE


    The main chapter case study is the Tomorrowland festival in Belgium in 2013, which
    was a culminating moment for music festival video and for the EDM pop festival.


    The concluding chapter summarizes the main insights of the inquiry and reflects
    on the logic of this form of interpretive humanist scholarship, with a perspective
    on the broader theory and history of musical performance institutions in modernity.
    The chapter begins by summarizing the interpretive steps in the theoretical framework
    and how the investigations of individual institutions led to insights into the
    seasonal domains. After the discussion of the book’s main objectives, I evaluate
    the structural conditions of popular music performance in contemporary societies.
    Have the central popular music performance institutions become better places for
    this culture and for human experience? I argue that alternatives to narratives
    of commercial growth and consumer satisfaction are needed and turn to ideas of
    human growth and conceptions of the good life in moral philosophy. The final section
    reflects on the changing conditions of humanistic scholarship, interpreting this
    book as a product and critique of hegemonic conditions in European universities.


    # A Few Things This Book Is Not


    This book develops theory of relevance to many musical cultures and to other forms
    of culture, but the core framework is focused on two central institutions of Anglophone
    popular music and demonstrates only some of the potential applications of this
    framework.


    The analytical objectives require engagement with a range of disciplines and area
    studies formations, to reach meaningful depth and focus to structure the conversation,
    I limit myself to intellectual traditions that are central to the social study
    of music, primarily music studies and sociology. As an interdisciplinary work,
    this book cannot privilege either of the two; it explores their distinct logics
    both in combination and separately. It adopts a sociological narrative of institutions
    and brings this narrative into continuous dialogue with specialized literatures
    in music studies: the narrative does not float above those literatures.


    Moreover, this book concentrates on processes of institutionalization and uses
    institutions as focal points, not musicians and audiences. This is a matter of
    focus, since these processes are analyzed broadly, but with an emphasis on the
    changing outlook, functions, and values of performance institutions. A performance
    institution is not just a venue or venue organization; it also involves the norms,
    practices, and networks through which'
  merge: -1
  pgno: 18
- img_proc: true
  md: '# Introduction: The Social Study of Musical Performance Institutions


    musical performance events are constructed and regulated. Club and festival promoters
    and the events they produce are central units for institutional analysis of musical
    performance. This book highlights general implications of commercial institutionalization,
    such as changes in types of music, experiences, audiences, and architectures,
    but not much from the perspectives of musicians. Part of the reason is the difficulty
    in getting access to the star performers who are central to the process, but a
    study of their perspectives based on more interviews and biographies, for instance,
    refine rather than refute the framework and thesis of this book, showing how a
    small number of celebrities exploit the lucrative festival market as touring headliners
    and develop identities as top-tier professionals and stars of glamorous shows.
    Meanwhile, while lesser-known artists are playing smaller festival stages and
    clubs under precarious labor conditions, adopting identities as young talents
    or generic craftsmen. More experimental artists tend to perform in independent
    or DIY spaces, and many women and people of color are experiencing alienation
    and exclusion from clubs and festivals. The concluding chapter turns to Beyoncé’s
    performance at Coachella in 2018, a performance of great cultural significance,
    to reflect the agency of the pop celebrity in the rare instances where they challenge
    the norms of pop festivals.


    Moreover, the lacuna of research on performance culture and modernity motivates
    this book’s focus on the institutional and symbolic over the material and sensory
    dimensions of culture. The material and sensory dimensions are important, but
    analysis of common forms of performance in modern societies can do more to recognize
    how these dimensions are structured by cities, media, markets, and bureaucracy.
    In my ethnographic experience, I witnessed how forces of modernity weaken the
    sovereignty of forming bodies and other core elements in performance culture,
    such as community, ritual, trance, and orality. The limited attention to institutions
    in the performances and on “live music experiences” has resulted in neglect of
    the political economy of the field.


    Finally, this book is a humanist inquiry without utilitarian or commercial interests.
    My analysis of the scholarly live music literature will question the impact of
    such interests and show that scholarship on performance culture and modernity
    is still in its emerging stages. This book is written on the premise that more
    critical social analysis of Anglophone popular music culture and its organizational
    fields is essential to guiding future debate and public policy in this area. High
    levels of humanist expertise in the area are needed to educate the public about
