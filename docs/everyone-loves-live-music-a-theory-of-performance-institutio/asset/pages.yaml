    # A Better Place for Music and Humanity?


    The investigations thus illustrate a theoretical framework, but they also provide
    insight into a restructuring of places for popular music and social life in the
    city. The investigations provided several examples of situations structured by
    a broad change in value systems with implications at the levels of practice, ownership,
    and institutional functions. The central institutions of popular music performance
    have become better places for larger numbers of consumers, for mass-market popular
    music, and for corporate business. They have not become better places for musical
    culture and society as a whole. They are less dedicated to distinct culture worlds
    of music and more regulated by corporate interests, and they do not empower audiences
    with cultural aspirations and social movements. They have become less culturally
    diverse and thus promote worldviews with narrower conceptions of humanity.


    The new models have not simply been added to the existing order, but largely replaced
    the older models that evolved in scenes. The challenges to scenes stimulated a
