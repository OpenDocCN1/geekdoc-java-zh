    These developments have not led to a near-symmetrical situation in which popular
    culture from Continental Europe circulates at a similar scale and intensity in
    the United States and United Kingdom. Overall, the flows in popular culture are
    generally rather unidirectional. The analysis of rock clubs in in chapter 5 suggested
    that the field had become more Anglophone and less multicultural, and the history
    of popular music festivals presented here will provide further nuance to this
    argument. This situation challenges the discourse of hybridity, which has dominated
    since the early 1990s. This discourse imagines cultural globalization as a process
    of dynamic interactions between cultures, with a continuous transformation and
    renewal of cultural forms (Kraidy 2005, 16). The situation in Continental Western
    Europe over the past two decades, by contrast, is characterized by the growing
    centrality of Anglophone popular culture and by a fading reflexivity about the
    accompanying power dynamics. For decades, skepticism about the dominance of Anglophone
    models often referenced the discourse of cultural imperialism has occasionally
    voiced in popular music studies (e.g., Fornas and Ihlehmann 1999) and is a defining
    aspect of the Routledge Global Popular Music Series. I shall argue that the current
    situation calls for critical thinking about how Anglophone global culture impacts
    just national selves, but also immigrant populations in Continental Western Europe.


    Another useful theory for explaining the rise of Anglophone global culture can
    be found in Motti Regev’s 2013 Pop-Rock Music: Aesthetic Cosmopolit-'
  merge: -1
