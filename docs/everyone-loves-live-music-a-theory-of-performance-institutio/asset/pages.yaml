    # Could DIY Performance Be Institutionalized?


    By the mid-2010s the DIY spaces in Williamsburg had gone, and the mood had changed
    in the Patrick circle. Panero had tragically died, Wilber had left the city, and
    Patrick’s activities had slowed down. Their imperative “create your own showcase!”
    of the 2000s had disappeared. The changes were already palpable in 2010. Patrick
    became a father and decided to convert one of his performance spaces into an authorized
    one. After fifteen years as a champion of unregulated performance culture—in to
    paraphrase Marcel Duchamp—“found spaces,” he decided to develop the warehouse
    scene’s DIY performance culture into a more institutionalized form.


    Patrick introduced his new vision at a public meeting in the performance space
    he transformed, a deteriorating building in Bushwick called Market Hotel. Patrick
    had sent an invitation to a meeting to be held in the showcase on April 27, 2010.
    Carlos Molina, a passionate scene participant, emailed me the day to tell me about
    the meeting in what he described Patrick’s “emblematic venue,” which had just
    shut down by the police. Molina forwarded the invitation in which Patrick introduced
    a positive narrative of institutionalization:


    Market Hotel has existed for over two years and in time that has hosted countless
    legendary events and drawn huge international notice . . all of this the constraints
    of operating completely underground and with no budget. Now the time has come
    to channel momentum and create a fully realized space that serves the whole community,
    which will help define the NYC / Brooklyn scene into the future.


