    personal response of singers to city environments” (Gillett 1970/1983, 67 and
    99). Gillett''s few and brief claims about the music''s urban dimension serve
    a motivational purpose. He does not detail or examine them in the book.


    The notion of a genre city has a built-in mythical dimension since it excludes
    many other forms of music that exist in a city. Images of small cities have been
