  md: 'the thousands of vocational schools that have been upgraded to university status
    are included (Rüegg 2010, 3). In contrast with Enlightenment ideas of the university
    as a privileged site of academic freedom, the humanities now operate within a
    larger, more corporate, and sped-up knowledge factory that serves more utilitarian
    purposes defined by political institutions. In this final section, I analyze some
    of the elements of this systemic change so as to situate this book in the recent
    history of the humanities and reflect on the book’s possible contribution to thinking
    about their future. Because of the university’s near-monopoly as a knowledge institution,
    it is important that its history not be excluded from thinking about the future
    of humanist scholarship.


    Two influential books—*The New Production of Knowledge* (Gibbons et al. 1994)
    and the follow-up *Re-Thinking Science* (Nowotry, Scott, and Gibbons 2001)—explain
    how systemic changes in research result from the broader transformation of their
    relationship with society. The “Mode 2 knowledge production,” shortened to “Mode
    2 science,” developed to describe a form of knowledge production that is framed
    by utilitarian agendas of the nation-state and by collaboration with a wider range
    of societal actors, especially industry. Mode 2 is the ideal of knowledge production
    produced and for applied industrial contexts, and it thus represents the expansion
    of the university in its transformation into a vehicle of capitalism. It is in
    respect distinctly different from the ideal of the humanities represented by the
    so-called “new universities” of the 1960s and 1970s, the ambitions of which included
    knowledge interests in lower-income populations and collaboration with workers
    rather than corporations. The limited attention to class and capitalism in Mode
    2 discourse contributes to the elimination of political reflexivity in knowledge
    production. The university is no longer in a position to define its functions
    in society. The feeling of “a deep crisis of purpose” that could already be observed
    at many universities in the 1990s (Nowotry et al. 2001, 80) has been replaced
    by a culture of technocratic professionalism in areas such as the digital humanities
    and creative industries, while a critical counternarrative is being produced by
    tenured professors who are leaving academia out of frustration with the decline
    of their ideal of the humanities (e.g., Warner 2015; Lee 2015), with the redistribution
    of power to administrators, and with systems of quantitative evaluation (Sorensen,
    Bloom, and Young 2016; Watermeyer and Chubb 2018). The stereotypes of the “ivory
    tower” ignore the original meaning of metaphor, namely the idea of a protected
    environment. A free and protected environment was essential to university learning
    and research for von Humboldt, who argued that the role of the nation-state is
