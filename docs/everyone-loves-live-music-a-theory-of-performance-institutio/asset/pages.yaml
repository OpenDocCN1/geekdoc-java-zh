    # Ethnomusicology and the Promise of Postcolonial Humanism


    Another development in the mid-twentieth century—with implications for cultural
    worldviews—was the collapse of European empires. This development stimulated a
    wave of postcolonial reflexivity that is relevant to an analysis of the Anglophone
    popular music festival and its politics of internationalism. Postcolonial reflexivity
    became part of the intellectual foundations of North American ethnomusicology,
    which emerged after World War II. At a fundamental level, ethnomusicology challenges
    the idea of music history as a history of self (Bohlman 2013). The discipline
    therefore expands the social imagination of festival worldviews.


    Ethnomusicologists began festivals in the 1980s from the perspectives of tourism
    and cultural preservation. American ethnomusicologists, along with many Western
    tourists, attended folklore festivals in Eastern Europe, such as Bulgaria''s Koprivštitsa
    Festival and Zagreb''s International Folklore Festival (MacMillan 2015; Ceribaši
    1998). Ethnomusicologists argued that these festivals provided in-person experiences
    of local musical cultures but also created stereotypes and notions of folk culture.
    Judith Cohen''s longitudinal study of Festa da Istoria of Ribavia, Spain, adopted
    a more critical approach and introduced a diasporic perspective (Cohen 1999).
