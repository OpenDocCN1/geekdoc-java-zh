    # Institutions in Everyday Urban Life and in the Summer Season


    The commercial institutions of musical performance that have evolved since the
    eighteenth century in Europe and North America can be interpreted as a specific
    subset of leisure institutions. Concert halls, cabarets, dance halls, and festivals
    are places where people have spent money to enjoy music, socialize, drink, and
    dance outside regular working hours. Sociological literature on institutions and
    leisure specifically provide valuable insights that can be developed further in
    the area of music.


    The concept of institutions is central to sociology’s interest in the structure
    of social life and the evolution of distinct domains in society. It builds on
    the insight that collective behavior is not simply an aggregate consequence of
    individual choice or individual-level properties (DiMaggio and Powell 1991, 2).
    Theories of institutions share an interest in overcoming atomistic accounts that
    describe individual situations with little attention to general social dynamics
    and societal context. A core analytical entity in institutional theory is organizations.
    Karl Marx pioneered the idea that social forces act on and through organizations,
    and Max Weber analyzed organizational bureaucracy as emerged from market competition,
    state governments, and bourgeois demands that replaced earlier forms of domination
    that were “rational” in that they were not governed by the same precise rules
    of coercion, forms of administrative office regulation, and logics of means-ends
    calculus and matter-of-factness (Weber 1922/1978, 956 and 1002). Much institutional
    theory has been concerned with the large engines of society, with government and
    industry. This explains the emphasis on bureaucratic processes and formal regulation.
    These aspects have been less central to leisure institutions, which have historically
    been small and local and constituted by their difference from the functional spheres
    of society. Herbert Spencer’s conception of this structural differentiation of
    modern society is echoed in contemporary notions of institutions as sectors or
    organizational fields (Scott 1995/2014, 10–11).'
