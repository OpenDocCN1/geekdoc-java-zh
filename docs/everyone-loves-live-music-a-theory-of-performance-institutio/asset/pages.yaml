    Amsterdam, Brussels, and Copenhagen are peripheral to Berlin, Paris, and London
    and had somewhat small and insular national popular music industries until the
    2000s. Public policy played a greater role in the history of the rock club in
    these three countries than it has in many other countries. City governments helped
    establish the rock club as a central institution in popular music culture. From
    the late 1960s and up to the 2000, the central performance institution in popular
    music was the club, mostly the rock club but also the jazz and the world music
    club, to a smaller degree. In dedicated policy of popular music, the club is still
    the performance institution that receives the majority of subsidies, and the dominant
    model is now by far the club that commonly identifies itself as a rock and pop
    club. By only subsidizing nonprofit clubs, public policy helped make the nonprofit
    club the dominant model in the organizational field. However, city governments
    began prioritizing club''s transformation into a form that is somewhat distinct
