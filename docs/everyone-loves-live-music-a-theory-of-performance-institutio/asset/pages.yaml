    # Conclusion: A Better Place for Music Festivals?


    This chapter’s analysis showed how popular music festivals emerged from a variety
    of inspirations in large cities such as London and San Francisco and evolved into
    the dominant model of the rock-based festival, which proliferated across the Global
    North. This model has adapted to a dominant form of internationalism in popular
    culture, and this motivates critical reflection about other forms of internationalism
    in popular culture and in society at large.


    The chapter focused on Europe’s strong tradition of independent large post-hippie
    festivals, a tradition represented by Roskilde and Siget. The countercultural
    legacy of these festivals is echoed in gestures toward social inclusivity and
    humanitarianism. However, they essentially represent an institution of urban white
    class classes seeking to position themselves in the center of an evolving international
    modernity of Anglophone global-culture. This is illustrated by the world music
    programming and by the growing-emphasis on Anglophone culture and on the local
    mastery of this culture. The hippie music festival was not directly engaged in
    politics, but it was part of a social movement and represented the exploratory
    spirit of hippie-scenes, including their imagination of a new world, peace and
    love, and the Orient as a spiritual resource. The commercially institutionalized
    rock festival, by contrast, presents a more standardized and conformist form that
    is developed for regular consumption among large audiences in many countries.


    Like other moments of social change in festival history, the hippie moment was
    followed by the commercial internalization of professional entertainment, reducing
    the potential of music and festivals to serve as a resource for social movements.
    In Continental Europe, the evolving festival industry has gradually adapted to
    the intensification of media flows of Anglophone global culture, culminating with
    the growing presence of global pop stars in the 2010s. This transition into Anglophone
    global-culture is particularly striking in the context of the longer history of
    the music festivals in Continental European modernity. Also striking is the fact
    that'
