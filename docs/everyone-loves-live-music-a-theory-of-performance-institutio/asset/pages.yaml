    club in different kinds of cities and societies, focusing on one American metropolis
    and a few capital cities in small European countries. The objective is to understand
    how models of the rock club have evolved as part of broader changes in cities
    and their fields of rock music. These models result from changes in the urban
    economics and value systems of this institution. The general argument of the two
    chapters investigating different cities in the Global North is that the transformation
    of the rock club can be interpreted as an ongoing adaptation to gentrification
    and the music industry''s exploitation of more popular and conform forms of indie
    rock. The rock club illustrates both general and particular implications of changing
    urban economics at the level of cultural production and human experience in performance.
    In the process, the chapters show how a sociology of performance institutions
    can complement linking by collectivity, aesthetics, and ideology in urban musical
    and cultural studies.


    Chapter 4 provides a comprehensive analysis of the club''s emergence and transformation
    in the gentrification of a city, taking New York City as its example. The chapter
    analyzes how clubs of institutional significance to the rock field evolved in
    neighborhood transformations of this field. Based on ethnographic fieldwork in
    clubs and neighborhoods in the early 2010s and follow-up digital research in the
    late 2010s, the chapter registers the cultural and historical complexity of rock
    music in New York City, while using the institutional perspective to conceptualize
    different models of the rock club in broader structural change. The informal club
    of neo-bohemian neighborhoods declined in the 1990s and a new model has come to
    dominate the indie rock concert theater—which is more focused on concert consumption
    and governed by other values and networks. This model is more bureaucratic and
    efficient for business and consumption on a larger scale, and it provides better
    aesthetic and technological conditions of concert consumption, but it also limits
    the existential social and psychological potentials of performance. The chapter
    concludes with a historically informed vision for performance instances and human
    life in contemporary times.


    Chapter 5 provides a comparative perspective, showing that a similar commercial
    institutionalization of the rock club has occurred in small European cities at
    the periphery of the genre''s metropolitan centers, but public policy in countries
    with the highest level of subsidizing of rock music in the world has sustained
    other values. A historical investigation into the rock club, based on interviews
    with club management and policy documents, reveals that the club was initially
    conceived within social policy of youth culture before finding a place in arts
