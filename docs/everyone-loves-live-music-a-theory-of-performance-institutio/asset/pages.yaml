- img_proc: true
  md: '# The Commercial Institutionalization of the Rock Club in New York 89


    structured in the late nineteenth century by a real estate industry that systematically
    exploited low-income populations. The industry developed the model of tenement
    housing in overcrowded buildings of poor quality. In 1890, the Lower East Side
    was the most densely populated neighborhood in the world, according to Jacob Rees,
    who described the concentration of epidemic diseases, insurance fraud fires, and
    class exploitation: “Proprietors frequently urged the filthy habits of the tenants
    as a condition for their property” (Riis 1890,9). About one hundred years later,
    Christopher Mele (2000) argued that elites continued to exploit and reinforce
    social stigmatization.


    The peak crisis on the Lower East Side during the 1960s and 1970s followed decades
    of disinvestment, failed attempts at middle-class renewal, and the construction
    of low-rent housing in the 1940s. The population declined from about 550,000 inhabitants
    in 1910 to a low point of 155,000 in 1980. In the 1970s, the population dropped
    27% in the East Village as a whole and 40% in the Loisaida area, now commonly
    known as Alphabet City. The Lower East Side was the second-poorest neighborhood
    in Manhattan, only better than Harlem (Mele 2000,15). Real estate developers stopped
    maintaining buildings, invested in property elsewhere, and in many cases persisted
    profoundly by destroying buildings for insurance payouts. This negative spiral
    added to an atmosphere of despair in a desolate and dirty streetscape of deteriorating
    houses and high levels of crime, violence, and drug addiction (Smith 1996, 8).
    The conditions initially limited the development of white bohemian scenes. The
    hippie scene in the late 1960s declined with a shift to harder drugs (Mele 2000,
    177). Merchants catering to hippies on St. Marks closed, as did the rock clubs
    Electric Circus and Fillmore in 1971.


    # CBGB and the Exoticized Frontier


    The neo-bohemian East Village of the mid-1960s was a scene of experimental art
    and culture. Small performance events featuring poetry, theater, film screenings,
    and happenings were important, as was social life in bars, but it was not until
    1967 that a few clubs began presenting rock shows. The following year, Fillmore
    East (1968–1971) began bringing rock stars to the neighborhood. A prominent band
    of the scene called the Fugs first performed in a small East Village bookstore
    owned by one of the band members. This was typical of the scene’s DIY production,
    with underground film productions featuring friends and neighbors and neighborhood
    locations such as streets and lofts. This scene was also not targeting a larger'
