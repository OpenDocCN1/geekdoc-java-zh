    # The Indie Rock and Pop Concert Theater: A New Performance Culture?


    What did the club concert theaters that Swier created in the late 2000s have in
    common? Did they transform a performance culture or create a new culture?


    One aspect was the systemic shift from a landscape of small rock bars and clubs
    to a landscape of midsize concert theaters. Small concert theaters existed for
    decades but were growing in size and number and thus becoming the norm in rock
    performance culture. One major difference was the emphasis on higher media power,
    which shaped audiences'' listening practices and relationship with the concert
    ritual. Audiences in the new indie concert theater would come for the main act
    of the evening, pay a higher ticket price than smaller clubs charged, be more
    focused on the performance on stage, and be influenced in their decision and behavior
    by the performer''s celebrity status, even if it was rarely a star celebrity.
    In smaller clubs, audiences would more often explore an up-coming band in a genre
    context. A person would likely say, “I''m going to Mercury Lounge tomorrow to
    hear this new singer-songwriter or indie band. Would you like to join? It only
    ten dollars. And we ask ask if she wants to join us, and we all go for a drink
    afterward?” Conversely, it would be common to say, “I glad I secured two tickets
    for me and my girlfriend for Dirty Projectors in the Bowery Ballroom next month
    because we are big fans and it''s our favorite venue. Its well worth the forty
    dollars, and better do it now before they become more famous and play in bigger
