  md: '# : 1 :

    Introduction:

    The Social Study of Musical Performance Institutions


    Scholarly interest in musical performance has grown in music studies in the early
    twenty-first century. A new understanding is emerging of how performance culture
    has been shaped by dominant technologies and ideologies in modernity. Scholars
    are questioning media-centric understandings of performance and musical culture,
    drawing on evolving literatures in anthropology, ethnomusicology, and music psychology
    dating back to the 1970s (e.g., Cook 2013; Frith 2007; Wald 2009). In popular
    music, this book''s main area of inquiry, electronic media have been particularly
    powerful, culturally and economically. The recording sector of the music industry
    had hegemonic status in the late twentieth century. Digitalization weakened its
    hegemony, and this stimulated the exploitation of commodity forms other than the
    sound recording, especially the music festival. The recession in the recording
    sector stimulated a general emphasis on the performance sector and accelerated
    its international corporatization and branding as a live music industry. Euphoric
    narratives about live music caught the attention of popular, policy makers, and
    scholars. Notable popular music scholar Simon Frith (2007) began exploring the
    transformation, but a sociology of musical performance has not matured. Instead,
    industry course of live music has been adopted rather critically into popular
    music studies at a substantial intellectual disadvantage.


    This book evolves from this current moment of thinking about musical performance
    in music studies and aims to contribute a long-overdue critical and historically
    grounded analysis of the commercial institutionalization of Anglophone popular
    music performance culture in the United States and Western Europe. This project
    involves the development of new foundational analytical narratives of the field
    and its history. Discarding “live music” as'
  merge: -1
  pgno: 9
- img_proc: true
  md: 'master concept, this book instead develops a discourse of musical performance
    culture in modernity. The argument forth here pays particular attention to market-based
    institutions of musical performance since these institutions provide a focal point
    from which the commercial internalization of the culture can be analyzed. The
    intellectual project is to develop an analytical narrative of commercial performance
    institutions and demonstrate its potentials for the social study of musical performance
    and of music more broadly.


    The first task is to understand popular music''s live music moment not only as
    a symptom of change in in the economy of music and as a marketing invention, but
    as a reproduction of the media logics that have governed musical performance culture
    for about a century. The dualism between live and recorded music is an important
    dynamic in musical culture, but it has also become a discursive framing of musical
    performance culture, and as it is implicit it reproduces media hegemony. By contrast,
    this book conceives live as a particular formation within musical performance
    culture that has its institutions and cultural histories in musical culture and
    not just in a contemporary industry or in consumer culture. Musical performance
    cannot be adequately understood only in terms of its difference from media production
    and consumption of music. Global musical cultures have existed long before the
    advent of electronic media and can be identified as performance cultures through
    their distinct institutions, ontologies, and histories.


    In modernity, commercial performance institutions such as the concert hall, music
    festival, dance hall, cabaret, and popular music club have been central to the
    production and experience of musical performance and shaped musical performance
    cultures. These institutions have also been important institutions of musical
    and cultural life, supporting musical traditions, genres, and urban cultures.
    Festivals have created powerful moments of cultural fest in music and social life.
    As commercial institutions, however, have not only been governed by an interest
    in protecting and celebrating music and culture. Rather, they have functioned
    as institutions of leisure and operated under market conditions. The institutionalization
    of musical performance as a commodity is an outcome of capitalism. Organizations
    need to sell performance events with a certain frequency to in the market. Moreover,
    the institutionalization of standardized commodities with a high level of consistency
    is a capitalist impulse to create stability in constantly changing markets. A
    potential conflict therefore exists in modernity between cultural and commercial
    perspectives on what constitutes a better place for music. This book shows that
    international corporations have'
  merge: -1
  pgno: 10
- img_proc: true
  md: '# Introduction: The Social Study of Musical Performance Institutions


    gained unprecedented dominance in fields of Anglophone professional popular music
    and contributed to the institutionalization of popular music as consumer culture.
    As a humaninist inquiry, however, this book does not limit its discussion to this
    development, but situates it historically and introduces comparative cultural
    perspectives.


    This leads us to our main research question: How can the commercial institutionalization
    of Anglophone popular music performance in the 1990s be situated in the broader
    history of musical performance institutions in modernity? This book uses two institutions,
    the club and the festival, as focal points for examining the process in the two
    major domains of popular music performance: everyday urban life and the summer
    season. It will conceptualize these two domains and analyze how the outlook and
    function of musical performance institutions have changed within them. The book
    responds to the accelerated commercial institutionalization, specifically international
    corporatization, on two levels:it constructs a historically and systematically
    grounded alternative to the predominant live music discourse. Empirically, it
    maps and analyzes the commercial institutionalization of clubs in media flows
    of Anglophone popular music and culture. The empirical investigations reconstruct
    the history of the club and the festival institution within musical and cultural
    histories and highlight their evolution into the same system of international
    corporate ownership in the twenty-first century has transformed them into institutions
    of broader consumer demographics.


    This agenda requires more than a cultural critique. Above all, it requires a systematic
    analysis of the history of the field and its institutions. Such an analysis does
    not yet exist. There is little precedent for studying national and international
    fields of professional musical performance and how they transform. Fields of musical
    performance have been examined indirectly through literature on individual musical
    traditions and genres. But there is no tradition, for instance, for more general
    and comparative analysis of the relationship between musical performance institutions
    such as the concert hall, club, and the festival across different musical traditions
    and how their outlook and functions have changed as part of broader changes in
    society. Existing scholarly literature focuses on individual musical traditions,
    clubs, and festivals, and on their peculiarity within individual musical traditions.
    The performative turn in music studies has led to arguments about the fundamentally
    performative nature of music (e.g., Cook 2013), but these arguments are yet to
    explore social theory of performance and event cultures in modern societies. The
    field of performance studies'
  merge: -1
  pgno: 11
- img_proc: true
  md: '# 4 CHAPTER ONE


    has similarly ignored the commercial history of performance and all but continues
    to neglect music (Auslander 2004, 1–4). This book engages literatures in its conception
    of the social study of music and performance institutions. The empirical argument
    for this is that musical performance is part of musical culture and requires a
    form of expertise that is not acknowledged in the universalizing, postdisciplinary
    narrative of performance studies (Kirschenblatt-Gimmlet 2002/2004, 43). Performance
    studies and the most recent field of event studies will be valuable resources,
    but not the main disciplinary and theoretical ground.


    The commercial institutionalization of the field calls for greater attention to
    social theory and particularly sociological theory for conceptualizing musical
    performance institutions in modernity. This book constructs a new and more general
    discourse on these institutions by adopting and developing sociological discourse
    on leisure institutions and cultural production into music studies and then analyzing
    the transformation of these institutions in music history. Sociology will provide
    key concepts and a narrative of performance institutions in evolving culture markets.
    However, these institutions are not simply general institutions. Rather, they
    belong to broader histories of music and therefore require expertise in music
    studies. A more detailed discussion of methodology is reserved for the concluding
    chapter.


    Following the above objectives, the inquiry progresses through a number of steps,
    from the construction of discourse and theory of the study object in the opening
    chapters (1–2) to more specific theory and analysis of individual types of institutions
    (chapters 3–9). The investigations are organized into two major sections, each
    focusing on one of the two domains (everyday urban life in chapters 3–5 and the
    summer season in chapters 6–9) and on two core institutions in these domains,
    the club and the festival. The overall structure does not unfold as a linear history
    or a single ethnography, but is rather structured by the systematic distinction
    between domains on the premise that the domains shape fundamentally different
    types and dynamics of performance institutions and that they can therefore be
    meaningfully theorized and analyzed as separate interconnected entities. This
    organization creates a focus on the distinctness of the two domains, but analysis
    also reveal connections. In particular, the urban domain has historically constituted
    a ground from seasonal festivity has evolved, and the festival boom reflects and
    impacts on the challenged situation of the everyday urban domain. The overall
    structuring of the inquiry has the further advantage that the simpler institution
    of the club is examined moving to'
  merge: -1
  pgno: 12
- img_proc: true
  md: '# Introduction: The Social Study of Musical Performance Institutions


    the larger and more complex institution of the festival, which involves several
    performances, more intense media dynamics, and has a longer history.


    The inquiry, moreover, expands historically and geographically. The theory is
    developed by expanding the analysis of institutions from recent popular music
    history into the longer history of music in modernity, with the wider aim of situating
    the contemporary world against the history from which it has evolved. Geographically,
    the inquiry examines developments in the professional field of Anglophone popular
    music performance, expanding from postwar centers of this culture, such as London,
    New York, and San Francisco—all of which had a defining impact on the club and
    the festival institution—into Continental Europe and the North Atlantic, influencing
    the dynamics of media flows into Scandinavia, Hungary, Iceland, Spain, and Russia,
    for instance.


    The music’s media circulation is a constitutive factor in the field’s international
    expansion. It explains evolutions in international touring, systems of ownership,
    music programming, and spatial across Continental Europe. But how are the cultural
    boundaries of circulation regulated? Why do some forms of music have dedicated
    buildings of high professional standards in central parts of many cities, while
    others don’t? The forms of music that have a more prestigious or sporadic presence
    and exist less prestigious conditions tend to be minimized and lower-class populations.
    Hegemonic ideologies in the cultural industries and in society shape the conditions
    and norms of performance institutions, which to some extent are articulations
    of societal structures. Even genres as blues, salsa, Latin pop, hip hop, and grime
    that are popular in the Global North do not enjoy the same level of institutionalization
    as Anglophone rock and pop, the privileged domain of white patriarchy. Festivals
    of Iphone have featured a small number of world stars, beginning with Ravi Shankar
    and Bob Marley and continuing with the waves of exotic interest in African, Balkan,
    and Icelandic music stars and most recently Rosalía and K-Pop Coldplay. But these
    festivals present artists who are novices and do not provide regular platforms
    for the musical cultures they represent. The representation of black popular music,
    and especially hip hop, grew in the 2000s, but does the pop festival represent
    black popular music, and how does it serve black audiences? Social groups excluded
    from powerful cultural institutions have historically tended to mobilize in less
    institutionalized networks or in institutions that are not dedicated to individual
    art forms. In a Senate hearing in 1966, at the height of the Civil Rights movement,
    Ralph Ellison noted that the strongest institution for black'
  merge: -1
  pgno: 13
- img_proc: true
  md: 'people is the black church, well aware that its function had been defined by
    a history of racial segregation. In music, this history had segregated unions,
    performance venues, and traveling conditions (Monson 2007). Ellison pointed out
    that the government, by contrast, is an institution for all population groups
    and thus has an obligation to end segregation laws (“Statement of Ralph Ellison”).
    His statements are a reminder dedicated arts institutions still tend to be a privilege
    reserved for some populations and that their values are defined within broader
    structures in society.


    # Overview of Chapters


    The remainder of this introductory chapter (1) details the critique of live music
    discourse; (2) contemplates the disciplinary challenge in bringing sociology of
    performance institutions into music studies, specifically into the social study
    of music that includes ethnomusicology and (3) introduces a narrative of commercial
    institutionalization and a conceptual framework of performance institutions.


    Chapter 2 conceptualizes musical performance culture as part of the reconstruction
    of the study object that looks live music. The chapter builds a systematic understanding
    of ontologies of musical performance culture that are often discussed separately,
    and their relationship is crucial. The ontologies have far-reaching implications
    for theory and disciplinary. An understanding of the complex ontologies of the
    study object is not only important to musicology and sociology. It is also important
    for thinking critically about how musicologists and sociologists engage with understandings
    of performance culture in event studies, festival studies, urban studies, and
    media studies.


    The first part (chapters 3–5) begins by taking stock of the intellectual history
    of music in cities to develop the conceptual foundations for studying performance
    institutions in the urban domain and to situate them in the cultural history of
    music in cities across the Global North. Chapter 3 argues that a long history
    of specialization into urban musical cultures has produced valuable insights but
    that a greater field-sensitivity can be developed by thinking more shared knowledge
    interests and comparing the role of performance institutions in different urban
    cultures. In the process, the review illustrates potentials of the interdisciplinary
    social study of music. It concludes with the literature on popular music culture
    in contemporary cities, which is the focus area of the subsequent two chapters.


    Chapters 3–4 examine the commercial institutionalization of the'
  merge: -1
