    munities and were not embraced by those communities. To some extent, traditional
    communities felt that the Nashville Sound was not even country music. To explain
    these dynamics sociologically, Peterson proposed a dialectic metaphor of a hard
    core and a soft shell in the genre. His research revealed the corporate industry
    was primarily interested in exploiting the latter. Peterson defines the distinction
    and its political economy as follows:


    The basic justification for hard country is that it represents the authentic tradition
    of the music called country and that it is by and for those steeped in the tradition.
    The corresponding justification for soft country is that it melds country with
    pop music to make it enjoyable to the much larger numbers of those not born into
    or knowledgeable about country music. The leading hardcore artists have received
    the most attention from contemporary commentators and scholars as well. At the
    same time, the leading soft-shell artists of an era were tended to be more popular
    with audiences and to make more money than their hard-core counterparts. (Peterson
    1997, 150)


    This argument can be extended to other music genres and their performance cultures.
    A key point here is that the development of a soft-shell style of music is shaped
    by interests the genre itself, and this means that any analysis of this development
    cannot interpret it solely within the genre. The same principle applies to music
    festivals: They, too, are increasingly shaped by the adoption of popular culture
    fashions and by the interests of powerful economic institutions in society. These
    forces have in fact challenged the autonomy of the popular music festival institution
    and its historical trajectory. The corporatization of popular music festivals
    has resulted in a general turn to popular versions of music genres in festival
    programming and a general adaptation to music culture tastes. Moreover, the festival
    economy has expanded from music and further into general commodity markets, such
    as advertising, food, and fashion.


