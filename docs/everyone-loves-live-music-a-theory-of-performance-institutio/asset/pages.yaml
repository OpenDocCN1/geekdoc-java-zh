    of television in contemporary culture, that the music video had gained primacy
    status. Pop concerts were reproducing sound recordings and music videos, and their
    main function was to allow audiences to experience the celebrity in person. Auslander''s
    book explains important dynamics in pop culture, but also has considerable limitations.
    The most critical of this is that the book''s methodology reproduces the media-centric
    culture it investigates. It does not distinguish between within and outside media
    spaces. It is therefore unclear why the book primarily discusses TV shows and
    arenas based on secondary sources and why it does not research performance from
    in-person perspectives in spaces such as the private home, the street, the bar,
