    The chapter analysis, moreover, suggests that the commercial rock club illustrates
    a change in the conditions of urban life. The indie rock club appeals to desires
    for leisure, aesthetic pleasure, sophistication, and intimacy, but it also indicates
    how the working life ideology of professional authority permeates leisure and
    imposes constraints on the concert ritual. In the focusing of the performance
    ritual on the purpose of concert consumption, little space is left for the suspension
    of everyday order. The potential of the ritual to have deep social and existential
    values is weakened. The Bowery Ballroom can create immersive musical experiences,
    but it cannot accommodate visceral sensations as part of an community experience
    with elements of scene scale and social experimentation. Corporate structures
    have thus constrained the space of individual and collective agency at the microlevel.


    In many performances I attended, there was a low level of ritual intensity, little
    suspension of self-control, and little departure from the norms and roles that
    regulate everyday social life. There was laughter or expressive bodily interaction
    between strangers. There were few and rather constrained experiences of sexuality
    and political sentiments. Emotional utopias could be found in song lyrics, in
    love songs, for instance, but the performance as a whole did not explore these
    utopias. The desires expressed in songs and sound recordings were not fully realized
    in the collective experience of bodies. The commercial institutionalization of
    performance and the mediatization of music do not eliminate the body, but the
    bodily experience is constrained at deep psych and social levels. The indie club
    concert theater is nonetheless a continuation of a now-traditional institution
    that musical performance culture have moved closer to the values and aesthetics
    of the bourgeois concert hall and its institutionalism, even if major differences
    remain, especially with respect to musical form, sound, and mythology.


