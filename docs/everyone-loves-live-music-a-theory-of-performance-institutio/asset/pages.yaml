    Totalitarianism dominated large parts of Europe in the twentieth century, not
    just in fascist Germany (1933–1945), Italy (1922–1943), and semascasc Spain (1933–1975),
    but also in the Soviet Eastern Bloc between 1945 and 1989. Culture was often employed
    in simple forms of propaganda, but there is also a history of more complex artistic
    expression and humanist festivity in the socialist East.


    German historian Malte Rolf has shown that the regimes in the Soviet Union, Nazi
    Germany, and fascist Italy allowed mass audience events in public urban spaces
    with marches and parades that displayed power and control (Rolf 2006/2013). They
    all used synchronized and choreographed movements for this purpose, as well as
    massive displays of symbols of power. One basic intent behind these events was
