  mdcn: "\n## Java 3：面向对象编程\n\n## 继承\n\n```java\npublic class MixLoan extends Loan\n\
    {\n    private int free;\n    private Loan loan;\n}\n```\n\n```java\npublic MixLoan(double\
    \ principal, double interestRate, int periods, int free)\n{\n    super(principal,\
    \ interestRate);\n    this.free = free;\n    loan = new Annuity(principal, periods);\n\
    }\n```\n\n```java\npublic int getFree()\n{\n    return free;\n}\n```\n\n```java\n\
    public double payment(int n)\n{\n    return n <= free ? principal * interestRate\
    \ : loan.payment(n);\n}\n```\n\n![](img/776e8c536372a20cad0e1e1692e9f3e5_107_0.png)\n\
    \n访问 www.helpassignment.co.uk 获取更多信息\n\n在 book.com 下载电子书\n\n## Java 3：面向对象编程 继承\n\
    \n```java\npublic double interest(int n)\n{\n    return n <= free ? principal\
    \ * interestRate : loan.interest(n);\n}\n```\n\n```java\npublic double repayment(int\
    \ n)\n{\n    return n <= free ? 0 : loan.repayment(n);\n}\n```\n\n```java\npublic\
    \ double outstanding(int n)\n{\n    return n <= free ? principal : loan.outstanding(n);\n\
    }\n```\n\n你应该注意派生类可以添加新的变量（在这种情况下有两个）和新的方法（`getFree` 方法返回还款次数）。四个抽象方法的实现非常简单，不再赘述。你可以在\
    \ `main()` 方法中测试该类：\n\n```java\npublic static void main(String[] args)\n{\n  \
    \  new Amortization(new MixLoan(10000, 0.015, 10, 3)).print();\n}\n```\n\n作为贷款的另一个示例，可以考虑序列贷款，这是一种还款金额相同的贷款。这意味着付款在开始时最大并随着贷款期的进行而减少。就像\
    \ Annuity 项目有一个类一样，Serial派生类继承了 Loan，因此是一个具体类。我在这里不显示代码。\n\n抽象类 `Loan` 可以由接口定义：\n\
    \n```java\npackage loanprogram;\n\npublic interface ILoan\n{\n    public double\
    \ getPrincipal();\n    public double getInterestRate();\n    public int getPeriods();\n\
    \    public double repayment(int n);\n    public double interest(int n);\n   \
    \ public double payment(int n);\n    public double outstanding(int n);\n}\n```\n\
    \n## Java 3：面向对象编程 继承\n\n接口原则上只由抽象方法组成，但不需要写 `abstract` 关键字，这是允许的。`abstract` 是默认的。\n\
    \nLoan 类必须实现 ILoan 接口。这意味着你可以删除四个抽象方法，因为它们在接口中已经定义了，但该类仍然是抽象的，因为它没有实现所有的接口方法：\n\
    \n```java\npackage loanprogram;\n\npublic abstract class Loan implements ILoan\n\
    {\n    protected double principal; // 包含费用的贷款金额\n    protected double interestRate;\
    \ // 0 到 1 之间的利率\n    protected int periods;\n\n    public Loan(double principal,\
    \ double interestRate, int periods) {\n        this.principal = principal;\n \
    \       this.interestRate = interestRate;\n        this.periods = periods;\n \
    \   }\n\n    public double getPrincipal() {\n        return principal;\n    }\n\
    \n    public double getInterestRate() {\n        return interestRate;\n    }\n\
    \n    public int getPeriods() {\n        return periods;\n    }\n}\n```\n\n此时可以（你也应该这样做）修改\
    \ Amortization 类，将变量 `loan` 的类型更改为 `ILo`，构造函数中的参数也是如此。\n\n## Java 3：面向对象编程\n\n\
    ## 继承\n\n## 练习 7\n\n在 Java 2 书的练习 1 中，你写了一个贷款计算程序，用于计算年金付款金额并显示还款表。在这个练习中，你必须对该程序进行扩展，使其能够同样对混合贷款和序列贷款进行贷款计算。\n\
