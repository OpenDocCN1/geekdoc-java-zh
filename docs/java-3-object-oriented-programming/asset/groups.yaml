    \ in a different way. We see that the class overrides the the four methods from\
    \ the base class. The class inherits it means beyond what it defines itself can\
    \ also use public variables and methods from the base class. Because a derived\
    \ class can only refer to what in the base class is defined as public, it can\
    \ therefore not reference the base class's variables, but it must use the get-methods.\n\
    \nWhen creating an annuity object, the instance variables must be initialized,\
