- md: "\n## TYPECAST OF OBJECTS\n\nI have previously in Java mentioned typecast of\
    \ simple types. As an example you can not explicitly copy a long to an int because\
    \ an int may not have enough space. It may be necessary to write something like\
    \ the following to tell the compiler that t should be copied to a:\n\n```java\n\
    long t = 123;\nint a;\na = (int)t;\n```\n\nAlso objects can be typecasted, but\
    \ it is necessary that they belong to the same class hierarchy. Otherwise, you\
    \ get an exception if not the compiler before giving an error. Consider as an\
    \ example of the following method:\n\n```java\nprivate static void test05() {\n\
    \    try {\n        Subject subject1 = new Subject(\"MAT7\", \"Mathematics\");\n\
    \        ISubject subject2 = subject1;\n        Subject subject3 = (Subject)subject2;\n\
    \        System.out.println(subject1.equals(subject2));\n        System.out.println(subject1.equals(subject3));\n\
    \        System.out.println(subject3.equals(subject2));\n        // Course course\
    \ = (Course)subject1;\n    } catch (Exception ex) {\n        System.out.println(ex.getMessage());\n\
    \    }\n}\n```\n\nHere refers subject1, subject2 and subject3 all to the same\
