    \ respectively the width and height. Also, write a class Square when a square\
    \ is just a rectangle where the sides are of equal length.\n\nYou've write some\
    \ classes that represents geometric objects, and you must now define a composite\
    \ shape, which consists of other shapes. The following interface inherits IShape\
    \ and defines a composite shape called IDrawing:\n\n```java\npackage geometry;\n\
    \npublic interface IDrawing extends IShape\n{\n    public void add(IShape ...\
    \ shape) throws Exception;\n}\n```\n\nWrite a class Drawing that implements this\
    \ interface when the circumference of a drawing is defined as the sum of the perimeters\
    \ of all the drawing’s shapes and the same for the area.\n\nA drawing is therefore\
    \ an IShape, and thus a drawing contains other drawings. Below is a test program\
    \ that creates a drawing that consists of\n\n- 1. a drawing that contains a circle,\
    \ an equilateral and a rectangle\n- 2. a right angled triangle\n- 3. a drawing\
    \ that contains a square and two circles\n\n```java\npackage geometry;\n\npublic\
    \ class Geometry\n{\n    public static void main(String[] args)\n    {\n     \
    \   print(create(create(new Circle(2), new Equilateral(3), new Rectangle(3, 4)),\n\
    \              newRightAngled(3, 4), create(new Square(5), new Circle(1), new\
    \ Circle(3))));\n    }\n\n    private static void print(IShape shape)\n    {\n\
    \        System.out.println(shape);\n        System.out.println(\"Perimeter: \"\
    \ + shape.perimeter());\n        System.out.println(\"Area: \" + shape.area());\n\
    \    }\n\n    private static IShape create(IShape ... shapes)\n    {\n       \
    \ IDrawing d = new Drawing();\n        try {\n            d.add(shapes);\n   \
    \     } catch (Exception ex) {\n            System.out.println(ex.getMessage());\n\
    \        }\n        return d;\n    }\n}\n```\n\nTest the program. The result should\
    \ be something like the following:\n\n```\nStart drawing\nStart drawing\nCircle,\
