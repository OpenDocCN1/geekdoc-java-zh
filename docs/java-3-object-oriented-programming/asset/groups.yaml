    \n## JAVA 3: 面向对象继承\n\n有时候，可以直接在派生类中将基类中的变量作为方法引用，而无需将它们设为公共。如果变量被定义为 `protected`，那么这是可能的。\n\
    \n```java\npublic class Loan {\n    protected double principal; // 借款金额，包括费用\n\
    \    protected double interestRate; // 0 到 1 之间的数字表示利率\n    protected int periods;\
    \ // 期数\n}\n```\n\n`protected` 变量不能在类包之外被引用（它具有包级可见性，但可以从派生类中引用——即使它们属于不同的包）。作为一个例子，`Annuity`\
    \ 现在可以写成如下形式：\n\n```java\npackage loanprogram;\n\npublic class Annuity extends\
