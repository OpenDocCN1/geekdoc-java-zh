    FOREWORD


    # FOREWORD


    This book is the third in a series of books on software development. The programming
    language is Java, and the language and its syntax and semantics fills obviously
    much, but the books have largely focused on the process and how to develop and
    good applications. The first book I have generally mentioned classes and interfaces,
    and although the book Java 2 also intens used classes and interfaces I have deferred
    the details to this book and also the next, that are dealing with object-oriented
    programming. It deals with how running program consists of cooperating objects
    and how objects are defined and created on the basis of the program''s classes.
    Object-oriented programming is the knowledge of how to find and write good classes
    to a program, which helps to ensure that the result is a robust program that is
    easy to maintain. This book is object-oriented programming and here primarily
    about classes and how classes are used as the basic blocks for developing a program.
    The book assumes a basic knowledge of Java corresponding to the book Java 1 of
    this series, but some of the examples and exercises are relating to programs with
    a graphical user interface it is also assumed knowledge of the book Java 2 and
    how to write GUI programs.


    As the title says this series of books deals with software development, and the
    goal is to teach the reader how to develop applications in Java. It can be learned
    by reading about the subject and by studying sample programs, but most importantly
    by yourself to do it and write your programs from scratch. Therefore an important
    part of the books is exercises and problems, where the reader has to write programs
    that correspond to the substance being treated in the books. All books in the
    series are built around the same skeleton and will consist of test examples and
    exercises and problems that are placed in the text where they naturally belong.
    The difference between exercises and problems is that the exercises largely deals
    with repetitions of the substance that is presented in the text, and furthermore
    it is accurately described what to do. Problems are in turn loosely described,
    and are typical little bigger and there is really any clear best solution. These
    books are to be read from start to finish, but the many code examples, including
    exercises and problems play a central role, and it is important that the reader
    in detailing the code to the many examples and also solves the exercises and problems
    or possibly just studying the recommended solutions.


    All books ends with one or two larger sample programs, which focus is on process
    and an explanation of how the program is written. On the other hand appears the
