    \n    public String toString() {\n        return \"\" + eyes;\n    }\n}\n```\n\
    \n## JAVA 3：面向对象编程引言\n\nCube 的值或状态由一个 `int` 表示，而它的属性和行为由三个方法表示。在程序，你可以你可以创建类型为\
