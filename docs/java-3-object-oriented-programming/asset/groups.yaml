  mdcn: "\n\n## JAVA 3：面向对象编程\n## 关于类的最后结记\n\n继承最重要的意义不在于对现有代码的扩展（尽管这无疑也重要），而在于父类与子类之间的关系。如果你有一个特化：\n\
    \n![](img/776e8c536372a20cad0e1e1692e9f3e5_132_0.png)\n\n（在这里，A 是一个类还是接口并不重要），重要的是一个\
    \ B 必须也是一个 A，并且任何地方 B 都可以被像 A 一样被对待。这意味着你可以写一个方法，并由此写出处理 A 对象的代码：\n\n```\ntype\
    \ metode(A a)\n{\n```\n\n无论参数是 A 对象、B 对象还是直接或间接继承 A 的其他类型，该方法都能正常工作。该方法不需要知道具体的类型，也不必对此感知。这在面向对象编程中被称为**多态**，它允许你编写出非常灵活且通用的程序代码。\n\
    \n继承是面向对象编程的基本原理之一，不仅如此，面向对象编程语言支持继承是一项要求。然而，它并不是解决所有问题的方案，继承也存在一些批评。考虑到上述 B 继承\
    \ A 的设计，它反映了强烈的连接，特别是当 A 定义了保护成员时。A 的变化极可能会对派生类产生影响。此外，由于 A 和 B 之间的连接是非常静态的，并且在编译时就已经确定了。有时人们会考虑如下的设计：\n\
    \n![](img/776e8c536372a20cad0e1e1692e9f3e5_132_1.png)\n\n其中对象 B 通过一个引用知道一个 A。在这里，引用可以在运行时被替换，为\
    \ B 提供了引用另一个 A 对象的机会，结果是代码更加灵活。人们说 B 将任务委托给了 A 对象。这两种设计原则并不是直接的替代关系，但在过去的几年中，在以前使用继承的情况下，可能已经通过**委托**（delegation）进行了简化。\n\
    \n## 问题 3\n\n在这项任务中，你必须编写一些组织成层次结构的类。这些类非常简单，代表几何对象、三角形和正方形，在需要数学公式的地方，使用的是小学阶段已知的简单公式。目标是展示书中处理的许多类概念。\n\
    \n从创建一个 NetBeans 项目开始，你可以命名为 Geometry。示例处理了上述的几何形状，但你只需要关注形状的周长和面积。相应地，一个形状可以定义如下：\n\
    \n```java\npackage geometry;\n\n/**\n * 定义一个几何形状。\n */\npublic interface IShape\
    \ {\n    /**\n     * @return 形状的周长\n     */\n    public double perimeter();\n\n\
    \    /**\n     * @return 形状的面积\n     */\n    public double area();\n}\n```\n\n\
    你需要为项目添加这个接口。然后你需要添加一个名为 Point 的辅助类，代表平面坐标系中的一个点：\n\n```java\npackage geometry;\n\
    \npublic class Point {\n    public static final double ZERO = 1.0e-20; // 代表零\n\
    \n    private double x;\n    private double y;\n    public Point(double x, double\
    \ y) {\n        this.x = x;\n        this.y = y;\n    }\n}\n```\n\n## JAVA 3：面向对象编程\n\
    ## 关于类的最后结记\n\n```java\npublic double getX()\n{\n    return x;\n}\n\npublic double\
    \ getY()\n{\n    return y;\n}\n\npublic double length(Point p)\n{\n    return\
    \ Math.sqrt(sqr(x - p.x) + sqr(y - p.y));\n}\n\npublic String toString()\n{\n\
    \    return String.format(\"%.4f, %.4f\", x, y);\n}\n```\n\n我加入 MITAS是因为我想要真正的责任\n\
    \n![](img/776e8c536372a20cad0e1e1692e9f3e5_134_0.png)\n\n第 16 个月\n我在北海担任施工主管，指导并帮助工头解决问题\n\
    \n真实的工作\n国际机会\n三次工作实习\n\n针对工程师和地球地科学家的\n管生计划\nwww.discovermitas.com\n\n![](img/776e8c536372a20cad0e1e1692e9f3e5_134_1.png)\n\
    \n## JAVA 3：面向对象编程\n## 关于类的最后结记\n\n```java\npublic boolean equals(Object obj)\n\
    {\n  if (obj == null) return false;\n  if (getClass() == obj.getClass()) {\n \
    \   Point p = (Point)obj;\n    return Math.abs(x - p.x) <= ZERO && Math.abs(y\
    \ - p.y) <= ZERO;\n  }\n  return false;\n}\n```\n\n```java\npublic static double\
    \ sqr(double x)\n{\n  return x * x;\n}\n```\n\n关于 `length()` 方法，请注意给定两个点 (x1,\
    \ y1) 和 (x2, y2)，你确定的点之间的距离为：\n\n$\\sqrt{(x_1 - x_2)^2 + (y_1 - y_2)^2}$\n\n同样请注意，该类有一个静态方法\
    \ `sqr()`，它返回一个数的平方。原则上，这种方法与点无关，它只是实现 `length()` 的辅助方法，但因为它在其他上下文中可能有用，所以它被定义为静态公共方法。\n\
    \n编写一个抽象类 `Shape` 来实现 `IShape` 接口。该类应该只重写 `equals()` 方法：当两个对象具有相同的类，且两个形状具有相同的周长和面积时，这两个形状是相同的。\n\
    \n下一个类将代表一个具体的几何形状。该类应命名为 `Ellipse` 并必须代表一个椭圆，椭圆完全由作为参数传递给构造函数的两个半径定义：\n\n![](img/776e8c536372a20cad0e1e1692e9f3e5_135_0.png)\n\
    \n## JAVA 3：面向对象编程\n## 关于类的最后结记\n\n你可以根据以下公式计算椭圆的周长和面积：\n\n$area = r_1r_2\\pi$\n\
    perimeter = $2\\pi\\sqrt{r_1^2 + r_2^2}$\n\n在椭圆的基础上，你编写一个 `Circle` 类，圆仅仅是两个半径相等的椭圆。`Circle`\
    \ 类可以写为继承 `Ellipse` 的类。\n\n作为下一步，你应该编写处理三角形的类。从一个 `Polygon` 类开始，它可以代表任意多边形。它可以通过代表多边顶点\
    \ Point 对象来表示。该类应该验证顶点并测试它们是否会导致不规则的多边形（例如边相交的多边形）。多边形可以写为如下类：\n\n```java\npackage\
    \ geometry;\n\npublic abstract class Polygon extends Figure\n{\n    protected\
    \ Point[] p; // 多边形的顶点\n\npublic Polygon(Point[] p)\n{\n    this.p = p;\n}\n\n\
    public double omkred()\n{\n    double sum = p[p.length - 1].length(p[0]);\n  \
    \  for (int i = 1; i < p.length; ++i) sum += p[i - 1].length(p[i]);\n    return\
    \ sum;\n}\n\npublic String toString()\n{\n}\n```\n\n知道了顶点后，你可以立即实现 `perimeter()`\
    \ 方法，因为周长可以通过边长度的和来确定。然而，你无法立即实现 `area()` 方法，因此该类被定义为抽象。\n\n## JAVA 3：面向对象编程\n\
    ## 关于类的最后结记\n\n接下来，编写一个 `Triangle` 类，它必须是继承 `Polygon` 的类。该类必须有一个带有三个点作为参数的构造函数，除了构造函数外，该类单独需要重写\
    \ `toString()` 并实现 `area()` 方法。关于最后，你可以通过如下公式确定边为 a、b 和 c 的三角形的面积：\n\n```\n$areal=\\\
    frac{1}{2}ab\\sqrt{1-\\frac{a^2+b^2-c^2}{2ab}}$\n```\n\n其他类的面积计算通过使用以三角形顶点参数的公共静态方法来完成。\n\
    \n`Triangle` 类代表由三个点定义的任意三角形。你也可以为三角形拥有更具体的类，例如代表等边三角形的 `Equilateral` 三角，它应该是继承\
    \ `Triangle` 类的。该类的构造函数必须有一个关于边长的参数（以便于定义形成特定边长三角形的顶点——从点 (0,0) 开始）。出于性能考虑，该类应该重写\
    \ `perimeter()` 方法，因为如果知道边长，实现起来会更高效。编写 `Equilateral` 类。\n\n![](img/776e8c536372a20cad0e1e1692e9f3e5_137_0.png)\n\
    \n"
