- md: "\n# JAVA 3: OBJECT-ORIENTED PROGRAMMING\n\n# INHERITANCE\n\n```java\n/**\n\
    * @return The current value\n */\npublic BigInteger getValue();\n```\n\n```java\n\
    /**\n* Returns the number in the sequence having the index n.\n* this number is\
    \ the actual value.\n* @param n The index sequence must be set to\n* @return Sequence's\
    \ value for the index n\n* @throws Exception If the index is less than 0\n */\n\
    public BigInteger getValue(int n) throws Exception;\n```\n\n```java\n/**\n* Steps\
    \ the sequence one step forward\n */\npublic void next();\n```\n\n```java\n/**\n\
    * Step the sequence one step back\n* @throws Exception If the index is 0\n */\n\
    public void prev() throws Exception;\n```\n\n```java\n/**\n* Sets the sequence\
    \ of the first value that is greater than or equal to number.\n* This value is\
    \ then the sequence's current value.\n* @param number The number sequence to be\
    \ set by\n */\npublic void next(BigInteger number);\n```\n\n```java\n/**\n* Sets\
    \ the sequence of the first value that is less than or equal to number.\n* This\
