    A LAST NOTE ABOUT CLASSES


    The most important of inheritance is not so much the expansion of existing code
    (although it is of course also important), but it is the relationship between
    super class and subclass. If you have a specialization


    ![](img/776e8c536372a20cad0e1e1692e9f3e5_132_0.png)


    (and here it is not so important, if A is a class or an interface), it is important
    that a B is also an A and a B anywhere can be treated in the same way as an A.
    It means that you can write a method and thus code which treats an A object:


    ```

    type metode(A a)

    {

    ```


    and the method will work regardless of whether the parameter is an A object or
    B object or another type that directly or indirectly inherits A. The method does
    not know the specific type, and it does not have to do it. It is called polymorphism
    in object-oriented programming and allows you to write program code that is very
    flexible and general.


    Inheritance is one of the basic principles behind object-oriented programming
    and more than that, for it is a requirement that an object-oriented programming
    language supports inheritance. However, it is not the solution to everything,
    and there is also criticism of inheritance. Taking the above design where B inherits
    A, it reflects a strong connection and it especially if A defines protected members.
    There is a high probability that changes in A will have impact on derived classes.
    Moreover, one can mention that the connection between A and B is very static and
    determined at compile-time. Sometimes one thinks, therefore, on a design as


    ![](img/776e8c536372a20cad0e1e1692e9f3e5_132_1.png)


    wherein an object B knows an A through a reference. Here reference can be replaced
    at runtime, providing the opportunity to the B that it can refer to another A
    object, and the result is a code that is more flexible. One speaks that B delegates
    tasks to A object. the two design principles are not directly each other alternatives,
    but in the last years has probably been briefed using delegation in situations
    where you previously use of inheritance.


