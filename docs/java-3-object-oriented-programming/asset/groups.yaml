    The object is created on the heap, which is a memory area in which the runtime
    system can continuously create new objects. When creating an object, the heap
    manager allocates space for object''s variables, the constructor is executed.
    The object then lives as long there is a reference to it, but when it is no longer
    the case, either because the variable that references it is removed, or manually
    is set to null, the object is removed by the garbage collector, and the memory
    that the object applied, is released and can be used for new objects. The garbage
    collector is a program that runs in the background and removes the objects that
    no longer have references.


    # 2.4 VISIBILITY


    Visibility tells whether a class or its members may be used. As for classes, it''s
    simple, a class is defined either public or you specify no visibility. A public
    class can be used anywhere, and any other class can refer to a public class. However,
    if you do not specify any visibility, the class can only be used by classes in
    the same package.


