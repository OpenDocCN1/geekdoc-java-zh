    \ 的行。\n\n# 主控制台 (MAINCONSOLE)\n\n关于程序本身，它实际上是两个程序。第一个是一个控制台应用程序，工作原理如下：\n\n程序开始打印当前货币的概览。随后，有一个循环，每次迭代都必须：\n\
