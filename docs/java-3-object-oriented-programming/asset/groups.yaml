    \n## 2.6 货币转换程序\n\n我将用一个可以将一种货币的金额转换为另一种货币金额的程序来结束关于类的这一章。该程序由几个类组成，基本上在类方面没有特别的，但该程序引入了设计模式的概念，并涉及两种简单的模式。设计模式是解决具有通用性并出现在许多不同情况中的问题的特定方法。寻求一种标准来如何使用证明的方法来解决此类问题是自然而然，这就是设计模式的意义。在我展示的示例中，模式包括：\n\
    \n- 1. 单例模式 (singleton)\n- 2. 迭代器模式 (iterator pattern)\n\n程序有一个简单的模型类，称为 `Currency`，它代表具有三个属性的货币：\n\
    \n- 货币代码（即 3 个字符的代码）\n- 货币名称（不能为空）\n- 货币汇率（应为非负数）\n\n下面是该类的代码，包含了最重要的注释，且不需要进一步解释：\n\
    \n```java\npackage currencyprogram;\n\n/**\n * 当汇率相对于丹麦克朗计算时，该类代表一种货币。\n */\n\
    public class Currency {\n    private String code;\n    private String name;\n\
    \    private double rate;\n```\n\n## JAVA 3：面向对象编程类\n\n```java\npackage currencyprogram;\n\
    \n/**\n * 当汇率相对于丹麦克朗计算时，该类代表一种货币。\n */\npublic class Currency {\n    private String\
    \ code;\n    private String name;\n    private double rate;\n```\n\n```java\n\
    public Currency(String code, String name, double rate) throws Exception {\n  \
    \  if (code == null || code.length() != 3 || rate < 0) {\n        throw new Exception(\"\
    Invalid currency\");\n    }\n    this.code = code;\n    this.name = name;\n  \
    \  this.rate = rate;\n}\n```\n\n```java\npublic String getCode() {\n    return\
    \ code;\n}\n```\n\n```java\npublic String getName() {\n    return name;\n}\n```\n\
    \n```java\npublic double getRate() {\n    return rate;\n}\n```\n\n```java\npublic\
    \ String toString() {\n    return code + \": \" + name;\n}\n```\n\n/**\n * 验证货币的值，代码必须是三个字符，\n\
    \ * 名称不能为空，货币汇率必须是非负。\n * @param code 货币代码\n * @param name 货币名称\n * @param rate\
    \ 货币汇率\n * @return 如果三个值是有效的货币，则为 true，否则为 false。\n */\n```java\npublic static\
    \ boolean valuta(String code, String name, double rate) {\n    return code !=\
    \ null && code.length() == 3 && name != null && name.length() > 0 && rate >= 0;\n\
    }\n```\n\n你应该注意，上述类是描述程序中一个对象的典型模型类。\n\n## JAVA 3：面向对象编程\n\n## 单例模式 (SINGLETON\
    \ PATTERN)\n\n下一个类是 `CurrencyTable`，它是一个定义程序已知并需要处理的货币对象的类。程序必须有一个 `CurrencyTable`\
    \ 类型的对象，原则上该对象在程序的任何地方都应该存在并可用。经常会出现这样的情况：程序必须使用某个特定类型的对象，而你希望确保\n\n- 对象始终存在，无需显式创建\n\
    - 对象对程序中的所有对象都可用\n- 该类型确实只有一个对象\n\n对于如何编写此类类已经定义了一种特定的设计模式。这种设计模式被称为单例模式。该类可以写如下：\n\
    \n```java\npackage currencyprogram;\n\nimport java.util.*;\n\n/**\n* 类代表货币表。该类以单例模式实现。\n\
    * 货币数据位于代码的末尾。\n */\npublic class CurrencyTable implements Iterable<Currency>\n\
    {\n    private static CurrencyTable instance = null; // 类实例\n\n    private ArrayList<Currency>\
    \ table = new ArrayList(); // 货币列表\n\n    // 私有构造函数，确保该类不能从其他类实例化。\n    private\
    \ CurrencyTable()\n    {\n        init();\n    }\n\n    public static CurrencyTable\
    \ getInstance()\n    {\n        if (instance == null)\n        {\n           \
    \ synchronized (CurrencyTable.class)\n            {\n                if (instance\
    \ == null) instance = new CurrencyTable();\n            }\n        }\n    }\n\n\
    \    private void init()\n    {\n        table.add(new Currency(\"DKK\", \"Danish\
    \ Krone\", 1.0));\n        table.add(new Currency(\"EUR\", \"Euro\", 7.45));\n\
    \        table.add(new Currency(\"USD\", \"US Dollar\", 6.90));\n    }\n\n   \
    \ @Override\n    public Iterator<Currency> iterator()\n    {\n        return table.iterator();\n\
    \    }\n}\n```\n\n"
