    \n## JAVA 3: 面向对象编程\n## 类\n\n你应该注意参数通过 `subjectOk()` 方法进行了测试。该方法被定义为 `static`（静态），这意味着可以在创建类对象之前使用。其他类可以在创建对象可以使用该方法测试值。这种控制方法可能是合理的，如果你以后发现控制逻辑不同，只需修改该方法即可。\n\
    \n在这种情况下，类的其他方法很简单。对象的 `id` 必须是可读的，但不能更改。因此，该类只有一个方法\n\n```java\npublic String\
    \ getId()\n{\n    return id;\n}\n```\n\n来返回值。以这种方式返回实例变量值的方法，通常都使用这种语法（变量名首字母大写并以\
    \ `get` 为前缀），你调用它们作为 getter 方法。同样，变量名也有一个方法，但这里也可以更改名称。该类类有一个针对 `name` 的 setter\
    \ 方法\n\n```java\npublic void setName(String name)\n```\n\n以及以这种方式更改实例变量值的方法。在这种情况下，如果名称具有不合法的值，方法可能会抛出异常，但对于\
    \ setter 方法来说这不是强制要求的。\n\n该类及其所有方法都用 Java 注释进行了装饰。通过一个特殊的工具，你可以从这些注释为程序中的类生成完整的\
    \ HTML 文档。稍后我会解释，以及各种描述元素的含义，但在目前，这很容易推断出来。如果你将光标放在方法前并输入\n\n```java\n/**\n```\n\
    \n加上回车键，NetBeans 会创建一个注释骨架，其优点之一是，通过这种方式你不会忘记为方法的参数、返回值以及任何异常编写注释。\n\n"
