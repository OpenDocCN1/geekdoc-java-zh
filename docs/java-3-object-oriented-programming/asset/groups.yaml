    ## JAVA 3: OBJECT-ORIENTED PROGRAMMING CLASSES


    Methods have a type or they are void. The fact that the method is void means that
    it does not have a value, and it is therefore not required to have a return statement.
    As an example you have the method add() in the class Student. A void method may
    well have an empty return statement, which then has the effect that the method
    is terminated. If a method has a type, it must have a return statement that returns
    a value of the same type as the method''s type. It is important to note that the
    method can only return one value, but the type of value in turn can be anything,
    a class type or an Array. As an example, the method getCourses() in the class
    Student returns an ArrayList<Course>, and precisely, it is a reference to such
    an object.


    As be seen from the above, a method''s parameters are created when the method
    is called and initialized by the calling code. The parameters are removed again
    when the method terminates, and they live only while the method executes and they
    can only be used or referenced from the method itself. We say that the parameters''
    scope is the method''s statements.


    The same applies to the variables as a method might create. They are called local
    variables. They are created when the method is called, and removed again when
    it terminates. Their scope is also limited to the method''s statements. A local
    variable can be created anywhere in the method, but they are all created, however
    when the method is called, but if a variable is referenced by a statement before
    it is defined, the compiler fails. In conclusion, a method can refer to:


    - instance variables in the method''s class

    - parameters

    - local variables


    wherein, the last two have their scope limited to the method itself. By contrast,
    the scope of an instance variable is limited to the object, so that the variable
    lives as long as the object does.


    ## 2.3 OBJECTS


    Seen from the programmer an application consists of a family of classes, but from
    the running program it consists of a family of objects that are created on basis
    of the program''s classes. A class is a definition of an object in the form of
    instance variables that define data the object must consist of, as well as methods
    define what one can be done with an object. If you have a class such as Subject,
    you can define a variable of type Subject:


