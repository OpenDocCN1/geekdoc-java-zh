    # JAVA 3: OBJECT-ORIENTED PROGRAMMING A LAST NOTE ABOUT CLASSES


    To program to an interface is a good design principle, but everything can be overstated.

    A program can easily consist of several hundred classes, and if each (or most)
    of these classes defines an interface, the number of types will be huge and many
    to code that is difficult to grasp. One should therefore consider, when a class
    must define an interface and concerning primary classes, which represent key concepts
    in which there is a chance there will be changes. A program will always consist
    of many classes that are using other classes that are local in nature, and these
    classes should not be defined with an interface.

    The programming to an interface is an important principle and one of the best
    ways to secure loose couplings between parts of the program, but also that, while
    developing whether an interface makes sense.


