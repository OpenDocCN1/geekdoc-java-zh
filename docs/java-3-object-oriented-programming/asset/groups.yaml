  mdcn: "\n\n## JAVA 3：面向对象编程引言\n\n当程序创建一个新变量时，它发生在栈的顶部——即箭头所指的地方；如果一个变量被移除，移除的就是栈顶部的那个。简单数据类型的变量具有这样一个属性：它们总是占用相同的空间。作为一个例子，一个\
