    JAVA 3: OBJECT-ORIENTED PROGRAMMING


    INTRODUCTION


    # # INTRODUCTION


    Programs would deal with data, and data must be represented and stored, which
    happens in variables. A language like Java has a number of built-in types to variables
    (as explained in the book Java 1), but often you need to define your own data
    types that better reflects the task the program must solve. This is where the
    concept of a class comes in. A class is something that defines a concept or thing
    within the problem area, and that can be said about what a classes is, and what
    is not, but technically a class is a type. It''s a bit more than just a type,
    as a class defines how data should be represented, but also what we can do with
    the data of that type. A class defines how the type will be represented, and what
    operations you can perform on variables of that type. Classes are also generally
    described in the book Java 1, but in this book I will start or continue with a
    more detailed discussion of Java''s class concept.


    When we create variables whose type is a class, we talk about objects, so that
    a variable of a class type is called an object, but really there is no great difference
    between a variable and an object, and there is well along the road no reason to
    distinguish between the two. But dig a little further down, there is a reason
    that has to do with how variables and objects are allocated in the memory''s memory.


    Variables whose type is int, double, boolean, char, etc., are called simple variables
    or primitive types. To a running program is allocated a so-called stack that is
    a memory area used by the application among other to store variables. The stack
    is highly efficient, so it is very fast for the program to continuously create
    and remove variables as needed. This is called a stack, because one can think
    of the stack as a data structure illustrated as follows:


