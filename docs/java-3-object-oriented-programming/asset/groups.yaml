    Perimeter: 92.699111843077520\nArea: 90.879411467287007\n```\n\nThe types of this\
    \ task is organized in a class hierarchy and can be illustrated as below. It's\
    \ simple to expand the class hierarchy with new classes, including classes for\
    \ new shapes, and as long as these classes complies with the contract IShape,\
    \ the class Drawing can use these classes as it knows nothing about the concrete\
    \ classes.\n\nJAVA 3: OBJECT-ORIENTED PROGRAMMING\nA LAST NOTE ABOUT CLASSES\n\
    \n![](img/776e8c536372a20cad0e1e1692e9f3e5_140_0.png)\n\n> “I studied English\
    \ for 16 years but...…I finally learned to speak it in just six lessons\"\nJane,\
    \ Chinese architect\n\nENGLISH OUT THERE\n\nClick to hear me talking before and\
    \ after my unique course download.\n\nJAVA 3: OBJECT-ORIENTED PROGRAMMING\nA LAST\
    \ NOTE ABOUT CLASSES\n\n# JAVA 3: OBJECT-ORIENTED PROGRAMMING\n# LAST NOTE ABOUT\
    \ CLASSES\n\n# 7.2 COMPOSITE PATTERN\n\nThe composite pattern is a structural\
    \ design pattern that allows you to compose objects into tree structures. This\
    \ pattern lets you treat individual objects and compositions of objects uniformly.\n\
    \nIn the composite pattern, there is a component interface that declares the operations\
    \ for both simple and complex objects. Leaf objects represent the end nodes that\
    \ have no children. Composite objects contain children and implement the operations\
    \ by delegating the work to their children.\n\nThe composite pattern is useful\
    \ when you need to represent part-whole hierarchies. For example, a file system\
    \ is a classic example where files are leaves and directories are composites that\
    \ can contain both files and other directories.\n\nThe composite pattern is implemented\
    \ using several classes:\n- Component: The interface or abstract class common\
    \ to all objects.\n- Leaf: Represents the simple elements that have no children.\n\
    - Composite: Represents complex objects that can have children.\n\nThe composite\
    \ pattern can be used to simplify code by allowing the client to interact with\
    \ all objects uniformly. Instead of checking whether an object is a leaf or a\
    \ composite, the client can simply call a method on the component interface.\n\
    \nThe composite pattern is also useful for building recursive tree structures.\
    \ For example, a GUI framework might be built using the composite pattern where\
    \ buttons, sliders, and panels are components, and panels are composites.\n\n\
    The composite pattern is powerful but can also be complex. It is important to\
    \ consider whether the pattern is the right choice for your project. If you don't\
    \ need a part-whole hierarchy, the composite pattern might be overkill.\n\nThe\
    \ composite pattern is a widely used pattern in software development. By using\
    \ this pattern, you can create more flexible and maintainable code. It is important\
    \ for any developer to understand how the composite pattern works and how it can\
    \ be used in many different scenarios.\n"
