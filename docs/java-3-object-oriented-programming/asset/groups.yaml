    \ 类有一个构造函数，即一个默认构造函数。\n\n如前所述，对象没有分配在栈上，而是创建在堆上。`c1` 和 `c2` 是栈上的普通变量，但它们不包含对象本身，而是包含指向堆上两个对象的引用。你作为程序员很少需要考虑这一点，但在某些情况下，知道分配在栈上和分配在堆上的对象之间的区别是重要的。下图展示了在机器内存中它的样子，即栈上的两个变量指向堆上的对象：\n\
    \n![](img/776e8c536372a20cad0e1e1692e9f3e5_10_0.png)\n\n如果（例如）你将在程序中写道：\n\n```java\n\
