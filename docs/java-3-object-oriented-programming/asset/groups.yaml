    # JAVA 3: OBJECT-ORIENTED PROGRAMMING


    # INTRODUCTION


    ![](img/776e8c536372a20cad0e1e1692e9f3e5_12_0.png)


    A class is referred to as a type, but it is also a concept of design. The class
    defines objects state as instance variables, how objects are created, and which
    memory is allocated for the objects. Objects have at a given moment a value as
    the content of the instance variables, and an object''s value is referred to as
    its state. The class also defines in terms of its methods, what can be done with
    the object, and how to read and modify the object''s state. The methods define
    the object''s behavior.


    Every Java program consists of a family of classes that together defines the program
    would operate and a running program will at a given time consist of a number of
    objects instantiated from the program''s classes, objects work together to accomplish
    what the program now must do. The work to write a program is to write the classes
    that the program should consist of. Which classes are, in turn, not clearly, and
    the same program may be written in many ways up of classes, which are quite different.
    The work to determine which classes a program should consist of and how these
    classes should look like in terms of variables and methods is called design. In
    principle, one can say that if a program does the job properly, it may be irrelevant,
    which classes it is composed of, but unsuitable classes means


    +   - it becomes difficult to understand the future and thus difficult to maintain
    and fix errors

    - that it in the future will be difficult to modify the program

    - that it becomes difficult to reuse the program''s classes in other contexts


    Therefore, the design and choice of classes, is a very key issue in programming,
    and in that context we are speaking of program quality (or lack thereof). A class
    is more than just a type, but it is a definition or description of a concept from
    the program''s problem area. When you have to define which classes a program must
    consist of, you must therefore focus on classes as a tool to define important
    concepts more than the classes as a type in a programming language.'
  - '[PAGE 13]


    An object is characterized by four things:


    +   - a unique identifier that identifies a particular object from all other

    - a state that is the object''s current value

    - a behavior that tells what you can do with the object

    - a life cycle from when the object is created and to it again is deleted


    An object is created from a class, and that time assigned a reference that identifies
    the object. The class''s instance variables determine which variables to be created
    for the object, and the value of these variables is the state of the object. The
    class''s methods define what you can do with the object and thus the object''s
    behavior. The last point of concerning is the objects life cycle, which is explained
    later.


    To program in that way in which you see a program as composed of a number of cooperating
    objects, is called object-oriented programming. For many years we have used object-oriented
    programming, and although it is primarily a question of design, it also requires
    that the current programming language supports the object-oriented thinking, and
    this is what makes Java an object oriented programming language. This book focuses
    on object-oriented programming, including both object-oriented design, and how
    it is supported in Java. There are many concepts that include


    +   1. objects life cycle

    2. inheritance and polymorphism

    3. generic types

    4. collection classes


    all subjects that are discussed below, and in the next book. To explain these
    concepts I will consider classes as concerning students at an educational institution,
    as well as books in a library.'
