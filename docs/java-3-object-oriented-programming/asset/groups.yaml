    \ | | | |\n| X17 | | | |\n| X18 | | | |\n| X19 | | | |\n| | | 清空 | |\n\n原型仅仅意味着它是一个没有执行任何操作的程序。按钮没有功能，但它可以作为开发程序的良好起点，以明确该程序的全部内容。首先，开发这样一个程序相对较快，而且由于是原型可以展示给未来的用户，它可以作为一个实用的工具来确认任务是否被正确理解。\n\
    \n在这种情况下，决定程序应该能够处理 20 个变量，并且程序必须有一个用于输入表达式的输入字段以及一个用于显示结果的列表框。\n\n## 表达式\n\n\
    表达式可以通过以下语法图精确描述：\n\n![](img/776e8c536372a20cad0e1e1692e9f3e5_145_0.png)\n\n##\
    \ JAVA 3：面向对象编程\n\n## 最终示例\n\n参数可以是一个或多个符号字符（加号或减号开头。然后有四种选项：\n\n- const，它必须是非负数\
    \ —— 一个可以转换为 double 的字符串\n- var，是一个变量，然后格式为 Xn 的字符串，其中 n 是索引\n- function，是一个数学函数\n\
    - 括号中的表达式\n\n剩下的就是定义什么是函数，这从上述内容中可以得出。\n\n表达式的值必须是一个 double。\n\n![](img/776e8c536372a20cad0e1e1692e9f3e5_146_0.png)\n\
    \n## 8.2 设计\n\n表达式必须由一个名为 Expression 的类表示。原则上，这是一个非常简单的类，除了构造函数外，它只包含一个方法，根据参数返回表达式的值：\n\
    \n| Expression |\n| --- |\n| + Expression(text: String) |\n| + getVal(arg): double\
    \ |\n\n这里的构造函数比较复杂，因为它接收字符串形式的表达式，因此构造函数的任务是将表达式拆分为多个标记（tokens），并验证这些标记是否代表合法的表达式。标记是可以包含在表达式中的项，标记是如\
    \ cos、+ 和数字之类的字符串。根据上述语法图和相关注释，有如下：\n\n| 加法或符号 | 减法或符号 | *乘法* |\n| --- | --- |\
    \ --- |\n| / 除 | ( 左括号 | ) 右括号 |\n| , 参数分隔符 | sin 正弦 | asin 反正弦 |\n| cos 余弦 |\
    \ acos 反余弦 | tan 正切 |\n| atan 弧正切 | cot 余切 | acot 弧余切 |\n| ln 自然对数 | exp 指数函数\
    \ | log 以10为底的对数 |\n| alog 反 | sqr 平方函数 | sqrt 平方根 |\n| pow 次方 | root 根 | abs\
    \ 绝对值 |\n| frac 分数 | floor 整数部分 | pi 常数 pi |\n| e 常数 e | | |\n| xn 以 x 开头并后跟 n\
    \ 非负整数的变量 | | |\n| num 带有带有小数点的非负小数 | | |\n\n这可能会产生不同的标记 —— 实际上加号或减号特别可以是一个符号。不同的标记必须被处理，但可以根据共同的属性进行分组，因此我将定义如下的层次结构，每个标记都由一个类定义：\n\
    \n![](img/776e8c536372a20cad0e1e1692e9f3e5_148_0.png)\n\n这些是非常简单的类，例如代表正弦函数的 Token\
    \ 类。该类派生自 FuncToken，且该类只有两个属性，第一个返回参数数量，第二个决定函数的值：\n\n| Token |\n| --- |\n| +\
    \ getCount(): int |\n| + getValue(arg): double |\n\nExpression 类中的构造函数必须执行以下操作：\n\
    \n- 扫描表达式，这意味着字符串应该被拆分为表达式所包含的标记。\n- 解析表达式，这意味着根据语法图检查表达式的语法是否正确。\n- 将表达式转换为后置形式（后缀），这意味着表达式元素必须重新组织成后置形式的标记序列。\n\
    \n![](_149_0.png)\n\n## 栈 (STACK)\n\n在 Java 中，我们将 ArrayList 描述为一种集合，并且我多次使用了它。在第一章中，我提到了栈作为数据结构，用于运行时参数和局部变量。Java\
    \ 还实现了一个集合类作为栈，我需要该类，由于栈具有两个重要的操作：\n\n1. push 将对象放入栈中（将值存储在栈顶）\n2. pop 返回并移除栈顶的对象\n\
    \n它本质上是一个后进先出（LIFO）数据结构，从栈中移除的对象是最后放入栈的那个。在 Java 中，栈还有其他操作，例如示例 peek，它返回栈顶的对象但不移除它。这意味着\
    \ peek 仅查看栈顶。栈包含的对象数量没有限制。在 Java 中，该类型被称为 Stack，我在程序中使用该类型，但也会在下文中引用栈。\n\n## 后置形式\
    \ (TO POSTFIX)\n\n通常我们以中缀形式编写表达式，这意味着将运算符写两个操作数之间，例如：\n\n```\n2 + 3\n```\n\n这意味着\
    \ 2 和 3 之和。如果表达式中有多个运算符，我们需要规则规定如何评估表达式。例如\n\n## 2 * 3 + 4\n\n这意味着你先计算 2 和 3 的乘积，然后将结果加\
    \ 4 —— 结果为 10。相反，意味着\n\n## 2 + 3 * 4\n\n这意味着你先计算 3 和 4 的乘积，因为乘法的优先级高于加法 ——因此结果为\
    \ 14。如果你想抑制这一规则，必须使用括号：\n\n## (2+3) * 4\n\n此时表达式的值为 20。\n\n如果表达式中有多个相同优先级的运算符，规则是从左到右评估运算符。下面首先计算\
    \ 2 和 3 的和，然后减去 4，因为加法和减法的优先级相同：\n\n## 2+3-4\n\n表达式可能更复杂，例如\n\n## (1+2 * (3+4))((/(5+6)\
    \ *)\n\n其中括号内嵌套括号。表达式的值为 0.19480。\n\n"
