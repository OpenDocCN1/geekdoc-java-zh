    well initialized the variable directly, but in other contexts it might be important
    to initialize static variables otherwise than by simple assignment, for example
    by reading the data in a file. You should also note that the syntax is simple,
    and that a class can have all the static initialize blocks, as you wish. If there
    are more the runtime system guarantees, that they are performed in the order in
    which they appear in the code.'
