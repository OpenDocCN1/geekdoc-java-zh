    {}

    ```


    In general a static method written as other methods, and can have both parameters
    and have a return value, and the same rules regarding visibility, but a static
    method cannot have reference instances - it is not associated with a specific
    object. You must specifically note that within the class where the method is defined,
    it can be referenced in the same way as any other of the class''s methods.


    A class may also have a static initialize block that can be used to initialize
    static variables, for example has the class Student the following block:


