    ## JAVA 3: OBJECT-ORIENTED PROGRAMMING CLASSES


    Regarding the classes members that can be variables, constructors and methods,
    there are four possibilities:


    - private

    - public

    - protected

    - no visibility


    The meaning of the first two has already been explained and protected is between
    thing where a protected member can be referenced from other classes in the same
    package and derived classes. I have previously explained inheritance, including
    derived classes, but the topic is described in more detail in a later chapter,
    where I will also demonstrate the use of protected. Finally, there is the possibility
    of not indicating any visibility which means a member can be referenced only within
    the same package.


    It is the programmer of a class that defines visibility for the class'' members.
    In principle, one could make everything public, but it would also increase the
    risk that a variable or method was used in unintended way. Therefore, you should
    open as little as for the class''s members.


    ## 2.5 STATIC MEMBERS


    Both variables and methods can be static. A static variable is a variable that
    is shared between all objects of a class. When creating an object of the class
    on the heap, there is not allocated place for static variables, but they are created
    somewhere in memory where everyone has access to them, and if they have public
    visibility, it is not objects of the class, which have access to them.


