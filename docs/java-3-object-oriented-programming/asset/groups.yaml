    \n## JAVA 3：面向对象编程\n\n出于上述原因，很显然，值类型的变量比引用类型的对象更有效。这绝不意味着引用类型的对象是无效的，在大多数情况下，这不是你需要关注的差异；但相反，在某些情况下差异非常重要。因此，知道系统处理值类型和引用类型的方式存在巨大差异是很，在某些语境下，它们对程序的行为具有重要意义，但会有很多例子来澄清这种区别。到目前为止，只需知道数据根据其数据类型可以分为两类即可：值类型的数据分配在栈上并通常被称为变量，而引用类型的数据分配在堆上并被称为对象，尽管这两个名称之间没有完全的一致性。\n\
    \n在《Java 1》一书中，我定义了以下类，它代表一个普通的立方体：\n\n```java\npublic class Cube {\n    private\
