  - "[PAGE 97]\n\n# INHERITANCE\n\nIf you have a class and you want another class,\
    \ similar to the first, expanded with new variables or methods, or you may want\
    \ one or more methods to work in a different way, the new class can inherit the\
    \ first. As explained in Java 1, the class that inherits is for called a derived\
    \ class, while the class it is inherited from is the base class. Other words for\
    \ the same are respectively subclasses andsuperclass. I in this section illustrate\
    \ inheritance through classes, which represent loans in a bank. To make it simple,\
    \ I will assume that a loan is characterized by the formation expenses and an\
    \ amount that I will collect throughout the loan's principal, an interest rate\
    \ which I would assume is constant throughout the loan period, and a number of\
    \ periods, which is the number of payments to repay the loan. It thus corresponds\
