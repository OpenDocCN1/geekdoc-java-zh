    # DEBUG THE CODE


    Now it may not be entirely correct to call debug the code for part of the test,
    NetBeans has a good debugger, and since I have not previously referred to it,
    it must have a few words at this location.


    When you want to test a program, it will often fail, and perhaps you get a wrong
    result, or the program crashes. The task then is to find the error and correct
    it, and here the debugger can help. You can set a breakpoint, which means the
    execution of the program stops when the program reaches that point in code, and
    you can then see the value of variables and check they have the right value. You
    can also step forward in the code statement and constantly monitor what happens
    with variables. The debugger is a highly efficient tool to find when a program
    failed, but in general the debugger is used to analyze the code.


