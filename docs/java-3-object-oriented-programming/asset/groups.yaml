    # JAVA 3: OBJECT-ORIENTED PROGRAMMING


    which means the sum of 2 and 3. If there are several operators, we need rules
    for how the expression must be evaluated. For example means


    # 2 * 3 + 4


    that you first calculate the product of 2 and 3 and then adds this result to 4
    – the result is 10. In contrast, means


    # 2 + 3 * 4


    that you first calculates the product of 3 and 4, since multiplication has higher
    precedence than addition – the result is therefore 14. If you wish to suppress
    this rule, you have to use parentheses:


    # (2+3) * 4


    and the expression has the value of 20.


    If in an expression there are several operators of equal priority, the rule is
    that the operators are evaluated from left. Below is first computed the sum of
    2 and 3 and then subtract 4 because addition and subtraction have the same priority:


    # 2+3-4


    An expression may be more complex, for example


    # (1+2 * (3+4))((/(5+6) *)


    where there are parentheses within the parentheses. The value of the expression
    is 0.19480. When an expression contains parentheses, the parentheses are evaluated
    first, starting with the innermost parentheses. It is certainly possible to write
    a method that does it, but if the expression becomes more complex with mathematical
    functions and many parentheses, it is not simple, and one will typically convert
    the expression to postfix form. This means that an operator is written after the
    operands. Thus, the above expression is written as


    ```

    2 3 +

    2 3 * 4 +

    2 3 4 * +

    2 3 4 *

    2 3 4 -

    1 2 3 4 * + 5 6 7 * /

    ```


