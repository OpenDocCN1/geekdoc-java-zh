    \ 类型也是一种类类型，因此这两个变量是引用类型。它们并不一定指向任何内容，此类变量的值为 `null`（空引用），这简单意味着你拥有引用变量，但它没有指向任何对象。\n\
    \n## JAVA 3: 面向对象编程\n## 类\n\n类可以有一个或多个构造函数，构造函数是在创建类对象时执行的特殊方法。构造函数的编写方式与其他方法相同，但名称与类相同，且它们没有返回类型。构造函数在原则上可以执行任何操作，但通常用于初始化类中的实例变量。在这种情况下，构造函数带有用于对象值的参数。这些参数与实例变量的名称相同（这不是强制要求的，参数可以命名为任何名称），在构造函数的代码中存在两个相同的名称（分别指向实例变量和参数）。这通过\
