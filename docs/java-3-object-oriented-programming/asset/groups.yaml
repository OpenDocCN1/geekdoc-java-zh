    \ INTERFACES\n\nTechnically, an interface is a type, and it is a reference type.\
    \ You can therefore do basically the same with an interface as with a class, except\
    \ that an interface cannot be instantiated. You cannot create an object whose\
    \ type is an interface, but otherwise an interface may be used as a type for parameters,\
    \ return values and variables.\n\nConceptually, an interface is a contract, and\
    \ an interface can tell that an object has a specific property. The interface\
    \ specifies what you can do with the object, but not how that behavior is implemented,\
    \ and that's exactly what you want to achieve. Who has to use the object, only\
