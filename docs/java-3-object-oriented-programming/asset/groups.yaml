- md: "\n# JAVA 3: OBJECT-ORIENTED PROGRAMMING\nA LAST NOTE ABOUT CLASSES\n\nWrite\
    \ similar to a class RightAngled that represents a right angled triangle.\n\n\
    As the shapes you should write some classes to squares. Start with a class GeneralSquare,\
    \ which inherits the class Polygon. The class must have a constructor, which parameters\
    \ are four Point objects. Furthermore the class must implements the method area(),\
    \ which is abstract in the base class. There is no general formula to determine\
    \ the area of a general square, but if you draw a diagonal, that divides the square\
    \ into two triangles (because I ignore the problem that a square may be concave).\
    \ You can therefore implement the method area() by determining the area of the\
    \ two triangles.\n\nYou must then write a class Rectangle, which inherits the\
