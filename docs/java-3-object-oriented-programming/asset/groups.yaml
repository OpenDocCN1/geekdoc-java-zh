    \n```java\nc1.roll();\nc2.roll();\n```\n\n这意味着同一个立方体被掷了两次，因为两个引用都指向同一个对象。当一个对象不再被任何引用时，也意味着该对象被堆管理器自动从堆中移除，该对象使用的内存将被释放。\n\
