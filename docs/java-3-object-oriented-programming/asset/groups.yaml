    \n从概念上，接口是一个合同，它可以告知对象具有特定的属性。接口规定了你可以对对象做什么，但没有说明该行为是如何实现的，而这正是你想要实现的。使用该对象的人只通过定义的接口（即合同）感知，而不知道类是如何遵守合同的——只要不改变接口——类就可以修改而不影响使用该对象的代码。\n\
