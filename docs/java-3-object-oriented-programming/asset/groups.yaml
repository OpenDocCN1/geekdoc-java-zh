    ## JAVA 3：面向对象编程类


    对象创建在堆（heap）上，堆是一个运行时系统可以持续创建新对象的内存区域。在创建对象时，堆管理器为对象的变量分配空间，并执行构造函数。只要存在对它的引用，对象就会一直存在，但当不再有引用时（无论是因为引用它的变量被移除，还是被手动设置为
    `null`），对象就会被垃圾回收器移除，对象占用的内存会被释放并可用于新对象。垃圾回收器是一个在后台运行的程序，用于移除不再引用的对象。


    ## 2.4 可见性


    可见性决定了类或其成员是否可以被使用。对于类来说，这很简单：类被定义为 `public`（公有），要么你不指定可见性。`public` 类可以在任何地方使用，任何其他类都可以引用
    `public` 类。然而，如果你不指定任何可见性，该类只能由同一个包中的类使用。


    ![](img/776e8c536372a20cad0e1e1692e9f3e5_47_0.png)


    Empowering People. Improving Business. BI Norwegian Business School 是欧洲最大的商学院之一，招收了
    20,000 多学生。我们的程序……（此处继续）


    ## JAVA 3：面向对象编程类


    关于类的成员（变量、构造函数和方法），有种可能性：


    - `private`（私有）

    - `public`（公有）

    - `protected`（保护性）

    - 无可见性（默认）


    前两种的含义已经解释过，`protected` 是一种中间状态，成员可以被同一个包中的类以及派生类引用。我之前解释过继承（包括派生类），但该主题将在后面的章节中详细描述，届时我将演示
    `protected` 的用法。最后是不指定任何可见性的可能性，这意味着该成员只能在同一个包内被引用。


    类的程序员定义了类成员的可见性。原则上，人们可以将所有内容都设为 `public`，但也会增加变量或方法被无意使用的风险。因此，你应该尽可能少地开放类的成员权限。


    ## 2.5 静态成员


    变量和方法都可以是静态的（static）。静态变量是类中所有对象共享的变量。在堆上创建该类的对象时，不会为静态变量分配空间，但它们被创建在大家都可以访问的内存位置中，如果它们具有
    `public` 可见性，那么访问它们的不是类的对象，而是类本身。


    使用静态变量的一个例子是，`Student` 类有一个 `id`，这是一个标识学生的唯一数字。在创建对象时，通常需要这些对象可以通过唯一键来标识，为了确保唯一性，每创建一个学生时，这个数字就会自动加
    1。这是因为该类有一个静态变量，包含了最后创建的学生的数字。你必须注意，这个变量必须是静态的，否则它在每次创建 `Student` 对象时都会被创建。这种使用自动生成的数字来标识对象的方法在数据库中有时会被用到。在上下文中，由于数字没有保存在任何地方，这个解决方案有点简陋，学生在下次程序运行时可能会获得新的数字，且其意图仅用于展示静态变量的示例。


    '
