    \ 方法，它用于计算参数的幂。有了这个方法，编写四个计算方法的代码就变得非常简单。\n\n如果你有一个 `Annuity` 类型的对象：\n\n```java\n\
    Annuity loan = new Annuity(10000, 0.015, 10);\n```\n\n那么你就可以编写如下所示的语句：\n\n```java\n\
    System.out.println(loan.repayment(5));\n```\n\n此时 `Annuity` 类中的 `repayment()`\
