  md: '# JAVA 3: OBJECT-ORIENTED PROGRAMMING


    # APPENDIX A


    +   - All public methods are documented with Java comments, so they are included
    in a part of the final class documentation. All return values and exceptions are
    documented, but in general there should also be a description of the method''s
    purpose and including pre conditions of parameters and possible side effects.
    For simple get methods, it is typically sufficient to comment the return value.


    +   - All private and protected methods are in principle documented in the same
    way, but here I do not use Java comments. The documentation of these methods should
    not be included in the final class documentation.


    +   - Finally, there are algorithms in which it may be necessary to comment on
    the details of the code. Generally I leave those to be part of the comment in
    the front of the method, and to endeavor to avoid comments inside the body of
    the method, but if it is necessary to explain the algorithm work, of course not
    refrain from such comments.


    As mentioned, the process is important because it is a part of the job thinking
    why you now have written the code that you would. would not say that in this way,
    all errors are found, but you will find an incredible number of inconveniences
    and places where the solution is ineffective.


    It is an extensive work documenting code, but the work is well spent!


    It is not all code, I document with comments and it is typically the controller
    and model classes. However, it is rare to document classes in the user interface
    and at least to a limited extent. I feel simply not that it makes any special
    dividends, whether as future documentation or detection of exceptions. The reason
    is probably that the development of the user interface is largely reuse of code
    from other programs.


    ''The project CurrencyProgram is documented according to those recommendations.


    # JAVA DOC


    As mentioned above, you should widely use Java comments, and I also discussed
    how to get NetBeans to insert a skeleton in front of a method. As shown many times
    there is a special syntax for inserting comments from the parameters, return values,
    etc., and there are actually some, where the most important are:


    +   - @author, the author of the class

    - @code Display text in code font without interpreting the test as HTML

    - @exception A Throws Adds a heading to the generated documentation, with the
    classname and a description.'
