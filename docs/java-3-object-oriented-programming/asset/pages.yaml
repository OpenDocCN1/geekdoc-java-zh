  md: '# 3 INTERFACES


    This chapter describes interfaces and in the next chapter I describes inheritance
    that is two other object-oriented concepts already briefly mentioned in Java 1,
    and in fact I has in Java 2 used both concepts without explicitly draw attention
    to it. An interface defines the properties that a class must have, while inheritance
    is a question of how to extends a class with new properties in terms of new instance
    variables or methods. Immediately the two thing do not seems much to do with each
    other, but they have largely, and therefore I treated both concepts subsequent.


    To illustere both concepts I need some examples, and I want to use the same examples
    as in the previous chapter, namely classes concerning students, and classes concerning
    books in a library, and much of what follows will also address how these classes
    can be modified.


