    stack to the result as long as the priority of the top of the

    stack is less than or equal to the priority of the element, push

    the element on the stack


    pop the stack and add the top of stack to the

    result until the stack is empty


    As you can see, it is crucial in the algorithm that there determine when to move
    from the stack to

    the individual tokens. It is the priorities the result, which is just a list.
