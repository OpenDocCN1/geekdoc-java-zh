  md: "# 3.1 INTERFACES\n\nTechnically, an interface is a type, and it is a reference\
    \ type. You can therefore do basically the same with an interface as with a class,\
    \ except that an interface cannot be instantiated. You cannot create an object\
    \ whose type is an interface, but otherwise an interface may be used as a type\
    \ for parameters, return values and variables.\n\nConceptually, an interface is\
    \ a contract, and an interface can tell that an object has a specific property.\
    \ The interface specifies what you can do with the object, but not how that behavior\
    \ is implemented, and that's exactly what you want to achieve. Who has to use\
    \ the object, only know through the defining interface (that is the contract),\
    \ but do not know anything about how the class complies with the contract – and\
    \ does not change the interface – the class can be changed without affecting the\
    \ code that uses the object.\n\nTypically, an interface has only signatures of\
    \ methods (but there are other options, explained below). An interface is defined\
    \ by almost the same syntax as a class, but with the difference that the word\
    \ class is replaced by the word interface. I will, as mentioned, often use the\
    \ convention that let the name of an interface start with a big I. In the previous\
    \ chapter I defined a class Subject, representing a teaching subject and thus\
    \ a concept that can be included in a program concerning education. The concept\
    \ can be defined as follows (see the project Students(3)):\n\n```\npackage students;\n\
    /**\n * Defines a subject for an education.\n */\npublic interface ISSubject {\n\
    \    public String getId();\n}\n\n/**\n * @return The subjects name\n */\npublic\
    \ String getName();\n\n/**\n * Changes the subject's name. The subject must have\
    \ a name, and if the parameter\n * does not specify a name the method raises a\
    \ exception.\n * @param name The subjects name\n * @throws Exception If the name\
    \ is null or blank\n */\npublic void setName(String name) throws Exception;\n\
    }\n```"
