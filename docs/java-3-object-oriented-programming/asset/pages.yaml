  md: '# JAVA 3: OBJECT-ORIENTED PROGRAMMING INTERFACES


    The interface is called ISubject, and the only thing you can read is a concept
    that is a ISubject, has three methods where the comments explains these methods
    do.


    Once you have the interface, a class can implement this interface:


    ```

    public class Subject implements ISubject

    {}

    ```


    and it is the only change in the thee class Subject, because the class has (implements)
    the three methods defined by the interface. So the question is what you have achieved
    with that so far nothing, I will make some changes in the Course class. It has
    a variable of the type Subject, and I will change the definition of this variable,
    so that it has instead the type ISubject:


    ```

    private ISubject subject;

    ```


    When a class implements an interface, the class''s type is the special of this
    interface, and therefore it makes sense to say that a Subject object is an ISubject.
    I also changed all the parameters of constructors and methods whose type is Subject,
    as their type are now ISubject. You should note that the program can still be
    translated and run. The result is that the class no longer knows the class Subject,
    but it knows only subject objects through the defining interface ISubject. A Course
    know what it can with a subject (it knows the contract), but not how a subject
    is implemented. The two classes are now loosely coupled than they were before,
    and that means you get a program that is easier to maintain, as you can change
    the class Subject without it matters for classes that use Subject objects.


    The fact in this way defines the means of an interface, and other classes only
    know a class through its interface is a principle or pattern, commonly referred
    to as programming to an interface.


    An interface in addition to signatures methods can also contain static variables
    and static methods – they are not attached to an object. The class Subject has
    a method subjectOk(), which tests the values in a subject are legal. It is a static
