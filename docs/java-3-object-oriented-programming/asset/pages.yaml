    initialize instance variables in the class. In this case, the constructor has
    parameters for an object''s value. These parameters have the same names as the
    instance variables (it is not a requirement, and the parameters must be named
    anything), and in the constructor''s code there are two things with same name
    (both refer to the instance variable and a parameter). It is solved by the word
    this where, for example this.name refer to the instance variable, while name specific
    the parameter. I will insist that a specific subject must have both an id and
    a name. Therefore, the constructor tests the parameters, and if they not have
    a value the constructor raises an exception. Exceptions are discussed later, but
    if a method as here can raise an exception, the method must be marked with throws:


    throws Exception


