  md: 'JAVA 3: OBJECT-ORIENTED PROGRAMMING


    At a first glance, recursive methods can be hard to figure out, but once you have
    been familiar with the principle, it is not particularly difficult. Above is the
    principle that if $n$ is 0 or 1, you can directly determine the result. If $n$
    is greater than 1, one can determine the factorial of $n$ times the factorial
    of $n-1$. You can think of it in this way, to determine the factorial of $n$ it
    is reduced to determine the factorial of $n-1$, which is a smaller problem than
    I started with: To determine the factorial of $n$. If I repeat above a sufficient
    number of times, I finally get to the simple case in which $n$ is 0 or 1 and I
    can directly determine the result.


    The principle of a recursive method is that a problem may be divided into two
    problems: A simple problem which can readily be solved, and a simpler (smaller)
    problem of the same kind as the original.


    Formally, the factorial of $n$ is defined as follows:


    ```

    $n! = \begin{cases} 1 & \text{for } n = 0 \text{ or } n = 1 \ n \cdot (n-1)! &
    \text{for } n > 1 \end{cases}$

    ```


    and then by a recursive definition, and in such situations, recursion is often
    a good solution. In this case, the method $factorial()$ simply a rewrite of the
    mathematical formula to a method in Java.


    It is clear that in this method could be written iteratively by means of a simple
    loop, and this solution would be even preferable, but in other situations, recursion
    is a good solution to provide simple solutions and even a code that is easier
    to read and understand than an equivalent iterative solution. There is reason
