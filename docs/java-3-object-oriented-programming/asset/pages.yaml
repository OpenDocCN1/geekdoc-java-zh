    The same applies to the variables as a method might create. They are called local
    variables. They are created when the method is called, and removed again when
    it terminates. Their scope is also limited to the method''s statements. A local
    variable can be created anywhere in the method, but they are all created, however
    when the method is called, but if a variable is referenced by a statement before
    it is defined, the compiler fails. In conclusion, a method can refer to


