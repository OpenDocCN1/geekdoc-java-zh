  md: "# JAVA 3: OBJECT-ORIENTED PROGRAMMING INHERITANCE\n\nIn this context, there\
    \ are no big differences, but in other situations it may be necessary to open\
    \ up the protection, derived classes can reference variables in the base class.\n\
    \nNote that the methods also can be *protected.*\n\nAn amortization is a table\
    \ showing a summary of the payments of a loan and for each payment shows the payment,\
    \ repayment, interest and outstanding debt. The following class represents an\
    \ amortization:\n\n```\npackage loanprogram;\n\npublic class Amortization {\n\
    \    private Loan loan;\n    public Amortization(Loan loan) {\n        this.loan\
    \ = loan;\n    }\n\n    public void print() {\n        System.out.println(\"----------------------------------------------------------------------\"\
    );\n        System.out.printf(\"Principal: %12.2f\\n\\n\", loan.getPrincipal());\n\
    \        System.out.printf(\"Interest rate: %12.2f%%\\n\", loan.getInterestRate()\
    \ * 100);\n        System.out.printf(\"Number of periods: %12d\\n\\n\", loan.getPeriods());\n\
    \        System.out.println(\"Periods         Repayment       Interest       \
    \ Outstanding;\");\n        System.out.println(\"----------------------------------------------------------------------\"\
    );\n        for (int n = 1; n <= loan.getPeriods(); n++) {\n            System.out.printf(\"\
    %7d%12.2f%17.2f%15.2f%15.2f%n\", n, loan.payment(n), loan.repayment(n), loan.interest(n),\
    \ loan.outstanding(n));\n        }\n        System.out.println(\"----------------------------------------------------------------------\"\
    );\n    }\n```\n\nThere is not much to explain, but note that the parameter to\
    \ the constructor has the type *Loan* and the class *Amortization* thus is not\
    \ aware of the specific loan types such as *Annuity*.\n\nI will return to that\
    \ shortly."
