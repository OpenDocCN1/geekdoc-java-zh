    A final note regarding classes I mention the word *final*. If one defines a variable
    *final* like *NAME* in the class *Institution*


    ```

    public final String NAME = "The Linux University";

    ```


    this means that the variable is a constant, and its value cannot be changed. Also
    methods can be defined *final*, and a *final* method can not be overridden in
    a derived class. If a method is overridden in a derived class, you have the possibility
    to write the method with a whole different name, and if you do not want it to
    be possible, you can define the method *final*. Also *final classes* can be defined,
    and a *final class* is a class which cannot be inherited. As an example the String
    class final.


    # 7.1 CONSIDERATIONS ABOUT INHERITANCE


    I will conclude all what is said about interfaces and inheritance with a few remarks.
    Seen from the programmer a program of classes that defines the objects used by
    the application to perform its work. For the sake of maintenance of the program
    you are interested that these classes are loosely coupled as possible, and that
    the classes should know so little each others as possible. In that way you can
    change the classes without affecting the rest of the program. You should therefore
    strive to write the classes, so a change only affects the class itself and thus
    has local significance.


    Now you can write programs without there are couplings between the classes, the
    meaning of a class is precisely that it must make services available for others
    to use, that''s why I sometimes have talked about data encapsulation where instance
    variables are kept private, and thus it the programmer through the class''s public
    methods decides which couplings to be possible. This principle can be further
    supported through an interface if all the classes are defined by an interface.
    An interface defines through abstract methods (methods in an interface are by
    default public abstract), which couplings should be possible, and adhere to it
    and always references to objects using a defining interface, you get a looser
    coupling of the program''s components as an object interface is known as an interface
    and the class that implements the interface is not known and may be changed without
    affecting the rest of the program. Therefore, it is a design principle that you
    should be program to an interface.'
