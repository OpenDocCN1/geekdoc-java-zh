  md: '# JAVA 3: OBJECT-ORIENTED PROGRAMMING


    # A LAST NOTE ABOUT CLASSES


    # 7.2 THE COMPOSITE PATTERN


    In fact it is quite often that, in practice, you meet a situation similar to above
    and think for example on a part list where you have a product that is composed
    of subcomponents, or think of a menu where a menu consisting of menu items or
    other menus. Another example is a filesystem consisting of directories and files.
    Therefore, it is natural to express the situation in a design pattern called a
    *composite pattern*.


    The problem is thus to manipulate a hierarchy of objects, where the bottom of
    the hierarchy have some concrete objects that we call the leaf objects, and there
    are some other objects that we call composite objects consisting of leaf objects
    and other composite objects. Both leaf objects and composite objects have a common
    base class (and possibly it is an interface or an abstract class), and the idea
    is that composite objects treat their child objects alike, whether in the case
    of leaf or composite objects. The solution is illustrated with a figure shown
    below and the solution is referred as a *composite pattern*.


    In practice, there may be different flavors, and often there may be several kinds
    of leaf objects that all are part of a hierarchy. This is the case in the example
    with geometric shapes. Here, the *Component* class corresponds to the interface
    *IShape*, and the class *IDrawing* to *Shape*. In the figure below corresponds
    the class *Composite* to *IDrawing*. In principle, it is a very simple pattern,
    but in practice there are some considerations on how to implement the pattern.
    The goal is as mentioned that the *Leaf* and the *Composite* objects must have
    the same behavior, and therefore the methods `addComponent()` and `removeComponent()`
    are defined in *Component*. It provides, however, a problem since they do not
    make sense for Leaf objects. Where necessary, they must in *Leaf* classes be implemented
    as methods that do not perform anything and raise an exception. If you instead
    use a design then is necessary to test whether specific objects are *Leaf* or
    *Composite* objects.


