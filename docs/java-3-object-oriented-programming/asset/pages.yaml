    an object is not null. Note also that this time you should not create an instance
    of the CurrencyTable, as the class is written as a singleton. Finally, note the
    last test method, and that a test method can include all the Java statements that
    may be needed.


    Back there is a method in the class ControllerTest, but I will not write the code,
    but note that it is simple to write a file with test data and test if the method
    is working properly.


    The strength of a unit test depends as mentioned by the number of test cases.
    It can be a lot of work to write test classes for unit testing, but classes must
    be tested, and the real value of the unit test is if first written individual
    test methods you can repeat the test all the times that may be required, and it
    is, in principle, every time the class is modified.


    As a final note regarding unit test NetBeans has a menu Run | Test Project, and
    if you choose that, all test classes are performed.


