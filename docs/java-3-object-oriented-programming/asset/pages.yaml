  md: "# THE ITERATOR PATTERN\n\nIn terms of the other methods in the class, there\
    \ is nothing to explain except the method iterator(). The class is an example\
    \ of a collection and, in this case a collection of Currency objects. That kind\
    \ of collections with objects of a certain kind very often in practice. One of\
    \ the operations that always was needed is being to iterate over the collection\
    \ with a loop. This requires access to the objects and it often resolved by means\
    \ of a pattern which we call the iterator pattern. The class CurrencyTable implements\
    \ this pattern as follows:\n\nThe class implements an interface, here which is\
    \ called Iterable<Currency>. This means the class must implement a method with\
    \ the following signature:\n\n```\npublic Iterator<Currency> iterator();\n```\n\
    \nwhere Iterator<Currency> is an interface that defines methods, so you can iterate\
    \ over the collection of Currency objects. In this case it is particularly simple,\
    \ since an ArrayList has such iterator, and this method can be written as follows:\n\
    \n```\npublic Iterator<Currency> iterator()\n{\n  return table.iterator();\n}\n\
    ```\n\nHow to even write an Iterator will return later, but the result of the\
    \ iterator pattern that you can use the extended for construction:\n\n```\nfor\
    \ (Currency c : CurrencyTable.getInstance()) { ... }\n```\n\nIn reality it is\
    \ nothing but a short way of writing\n\n```\nfor (Iterator<Currency> itr = CurrencyTable.getInstance().iterator();\n\
    itr.hasNext(); ) {\n  Currency c = itr.next();\n...}\n```\n\nThe two classes Currency\
    \ and CurrencyTable are the program’s model."
