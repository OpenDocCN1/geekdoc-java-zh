    Both variables and methods can be static. A static variable is a variable that
    is shared between all objects of a class. When creating an object of the class
    on the heap, there is not allocated place for static variables, but they are created
    somewhere in memory where everyone has access to them, and if they have public
    visibility, it is not objects of the class, which have access to them.


    As an example of using a static variable, the class Student has an id, which is
