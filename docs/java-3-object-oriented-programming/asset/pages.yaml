  md: "public double payment(int n)\n\n```\n{\n    return getPrincipal() *\n    getInterestRate()\
    \ / (1 - Math.pow(1 + getInterestRate(), -getPeriods()));\n}\n```\n\npublic double\
    \ outstanding(int n)\n\n```\n{\n    return getPrincipal() * Math.pow(1 + getInterestRate(),\
    \ n) -\n    payment (0) * (Math.pow(1 + getInterestRate(), n) - 1) / getInterestRate();\n\
    }\n```\n\npublic double interest(int n)\n\n```\n{\n    return outstanding(n -\
    \ 1) * getInterestRate();\n}\n```\n\npublic double repayment(int n)\n\n```\n{\n\
    \    return payment(n) - interest(n);\n}\n```\n\nYou should note that the class\
    \ inherits Loan, and how to specify that with extends. The class consists only\
    \ of a constructor and the four methods which should work in a different way.\
    \ We see that the class overrides the the four methods from the base class. The\
    \ class inherits it means beyond what it defines itself can also use public variables\
    \ and methods from the base class. Because a derived class can only refer to what\
    \ in the base class is defined as public, it can therefore not reference the base\
    \ class's variables, but it must use the get-methods.\n\nWhen creating an annuity\
    \ object, the instance variables must be initialized, but they are in the base\
    \ class, and are initialized using the base class's constructor. It is therefore\
    \ necessary in one way or another to get this constructor performed. It must be\
    \ called from the constructor of the class Annuity, but since you cannot directly\
    \ call a constructor, it is necessary with a special syntax:\n\n```\nsuper(principal,\
    \ interestRate, periods);\n```\n\nthat calls the base class's constructor. The\
    \ statement super must, be the first statement in the derived class's constructor."
