  md: '# TYPECAST OF OBJECTS


    I have previously in Java mentioned typecast of simple types. As an example you
    can not

    explicit copy a long to an int because an int may not have enough space. It may
    be necessary

    to write something like the following to tell the compiler that t should be copied
    to a:


    ```

    long t = 123;

    int a;

    a = (int)t;

    ```


    Also objects can be typecasted, but it is necessary that they belong to the same
    class hierarchy.

    Otherwise, you get an exception if not the compiler before giving an error. Consider
    as

    an example of the following method:


    ```

    private static void test05() {

    try {

    Subject subject1 = new Subject("MAT7", "Mathematics");

    ISubject subject2 = subject1;

    Subject subject3 = (Subject)subject2;

    System.out.println(subject1.equals(subject2));

    System.out.println(subject1.equals(subject3));

    System.out.println(subject3.equals(subject2));

    // Course course = (Course)subject1;

    } catch (Exception ex) {

    System.out.println(ex.getMessage());

    }

    ```


    Here refers subject1, subject2 and subject3 all to the same object. Note that
    you can write


    ```

    subject2 = subject1

    ```


    for subject1 is a Subject object and thus specifically an Subject object. In contrast,
    the statement


    ```

    subject3 = (Subject)subject2

    ```'
