  md: "# JAVA 3: OBJECT-ORIENTED PROGRAMMING\n\nThe first three methods should be\
    \ self-explanatory, and the last four returns\n\n+   1. repaid by the payment\
    \ of the nth payment\n2. interest by the payment of the nth payment\n3. the nth\
    \ payment\n4. the remaining debt immediately after the payment of the nth payment\n\
    \nIf you look at the last four methods, they are all trivial and returns 0. A\
    \ loan can be repaid in several ways, and to write the code for the last four\
    \ methods, it requires you know what it is for a kind loan in question. That know\
    \ class Loan not, and therefore it is not able to implement these methods in a\
    \ meaningful way. It may on the other hand be possible in a derived class.\n\n\
    The most common loan is an annuity that is characterized by the fact that for\
    \ each payment pays the same every time. When you all the time to pay interest\
    \ on what is outstanding, it means that the relationship between the repayment\
    \ and the interest are changed throughout the repaid period. If $b$ is the size\
    \ of the loan (the loan principal), $r$ is the interest rate and $n$ is the number\
    \ of periods, the payment can be determined using the following formula:\n\n![](img/776e8c536372a20cad0e1e1692e9f3e5_99_0.png)\n\
    \nThe outstanding debt after you have paid the kth payment can be calculated using\
    \ the formula\n\n![](img/776e8c536372a20cad0e1e1692e9f3e5_99_1.png)\n\nSo it is\
    \ the kind of loan that I looked at in Java 2.\n\nI will now write a class that\
    \ represents an annuity when the class will inherit the class Loan:\n\n```\npackage\
    \ loanprogram;\npublic class Annuity extends Loan {\n    public Annuity(double\
    \ principal, double interestRate, int periods) {\n        super(principal, interestRate,\
    \ periods);\n    }\n}\n```"
