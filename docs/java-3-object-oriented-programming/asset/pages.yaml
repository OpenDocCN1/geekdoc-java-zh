  md: "JAVA 3: OBJECT-ORIENTED PROGRAMMING\n\n# # THE SINGLETON PATTERN\n\nThe next\
    \ class is called CurrencyTable, and is a class that defines the Currency objects\
    \ that the program knows and has to work with. The program must have an object\
    \ of the type CurrencyTable, and it is an object, which in principle should always\
    \ be there and be available no matter where in the program you are. it is very\
    \ often that a situation arises that a program must use an object of a particular\
    \ type, and you want to ensure\n\n+   1. the object is always there, without explicitly\
    \ created\n2. the object is available to all other objects in the program\n3.\
    \ there certainly exists only one object of that type\n\nthere has been defined\
    \ a particular design pattern for how the class to such an object be written.\
    \ This design pattern is called a singleton. The class can be written as follows:\n\
    \n```\npackage currencyprogram;\n\nimport java.util.*;\n\n/**\n* Class represents\
    \ a currency table. The class is implemented as a\n* singleton.\n* Data for the\
    \ currencies is laid out in a table at the end of the code.\n */\npublic class\
    \ CurrencyTable implements Iterable<Currency>\n{\n    private static CurrencyTable\
    \ instance = null; // an instance of the class\n\n    private ArrayList<Currency>\
    \ table = new ArrayList(); // ArrayList of currencies\n\n    // Private constructor\
    \ to ensure that the class cannot be instantiated\n    // from other classes.\n\
    \    private CurrencyTable()\n    {\n        init();\n    }\n\n    public static\
    \ CurrencyTable getInstance()\n    {\n        if (instance == null)\n        {\n\
    \            synchronized (CurrencyTable.class)\n            {\n             \
    \   if (instance == null) instance = new CurrencyTable();\n            }\n   \
    \     }\n    }\n```"
