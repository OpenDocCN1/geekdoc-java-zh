  md: '# JAVA 3: OBJECT-ORIENTED PROGRAMMING A LAST NOTE ABOUT CLASSES


    To program to an interface is a good design principle, but everything can be overstated.

    A program can easily consist of several hundred classes, and if each (or most)
    of these classes defines an interface, the number of types will be huge and many
    to code that is difficult to grasp. One should therefore consider, when a class
    must define an interface and concerning primary classes, which represent key concepts
    in which there is a chance there will be changes. A program will always consist
    of many classes that are using other classes that are local in nature, and these
    classes should not be defined with an interface.

    The programming to an interface is an important principle and one of the best
    ways to secure loose couplings between parts of the program, but also that, while
    developing whether an interface makes sense.


    Another use of interfaces is using interfaces at design time you can define different
    contracts that the program''s objects must comply. As a class can implement multiple
    interfaces (all of them you need), you can create objects that meet multiple contracts,
    and as some of the most important thing you can test whether an object meets one
    or the other contract. With reference to the previous chapters, an object defined
    Cloneable abide by the contract, that it can create a copy of itself. Another
    interface is called Comparable, and classes that implements this interface, instances
    objects that can be arranged in order and hence, for example be sorted. Java defines
    a number of such interfaces, which defines one or another property that object
    may have. You will later in the book Java 4 about collection classes face classes
    that implements many interfaces. An interface is a concept that defines contracts
    which objects must comply.


    If you look at the interfaces defined in this book, they reflect very closely
    the classes that implements these interfaces. It does absolutely not necessarily
    the case, and many interfaces define a contract in form of a few and perhaps only
    a single method.'
