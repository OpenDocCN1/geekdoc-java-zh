    # INTRODUCTION


    The value of the Cube or it''s state is represented by an int, while its properties
    behavior is represented by three methods. In a program, you can then create objects
    of type Cube as follows:


    ```

    Cube c1 = new Cube();

    Cube c2 = new Cube();

    ```


    When you create an object of a class, the class''s instance variables are created,
    and then class''s constructor is executed. If a class has no constructor, there
    automatically will be created a default constructor - a constructor with no parameters.
    A constructor is characterized in that it is a method which has the same name
    as the class and do not have any type. A constructor is a method, but it cannot
    be called explicitly and is performed only when an object is instantiated. The
    class Cube has a constructor, that is a default constructor.


    The objects are as mentioned not allocated on the stack, but is created on the
    heap. c1 and c2 are usual variables on the stack, but does not include the objects
    but include instead references to the two objects on the heap. It rare you as
    a programmer need to think about it, but in some situations it is important to
    know the difference between an object allocated on the stack and on the heap.
    The figure below illustrate how it looks in the machine''s memory with the two
    variables on the stack that refer to objects on the heap:


    ![](img/776e8c536372a20cad0e1e1692e9f3e5_10_0.png)


    If, for example you in the program writes


    ```

    c1 = c2;

    ```'
