    # THE DESIGN


    The goal of the two versions of the program is to demonstrate why it is important
    to separate an application in well-defined models or layers. In this case, the
    program''s data arre are defined by two model classes that is Currency and CurrencyTable,
    while the data processing is carried out in the class Controller. The difference
    between the two programs is alone the view layer in the one that is a console
    window, while in the second case is a GUI window.


    The relationship between the program''s classes can be illustrated as follows,
    where the arrows shows which classes know who


    ![](img/776e8c536372a20cad0e1e1692e9f3e5_64_1.png)


    That is the model layer''s classes do not know neither the controller layer or
    view layer and the controller layer knows nothing about the view layer. The result
    is that you can replace the view layer without it affects the rest of the program.'
