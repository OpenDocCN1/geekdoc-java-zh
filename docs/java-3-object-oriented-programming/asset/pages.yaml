  md: "# JAVA 3: OBJECT-ORIENTED PROGRAMMING INHERITANCE\n\nSometimes it can be conveniently\
    \ directly to refer to the variables in the base class as a method in a derived\
    \ class, but without making them public. This is possible if the variables are\
    \ defined protected.\n\n```\npublic class Loan {\n    protected double principal;\
    \ // the amount borrowed inc. costs\n    protected double interestRate; // interest\
    \ rate as a number between 0 and 1\n    protected int periods; // the number of\
    \ periods\n}\n```\n\nA protected variable can not be referenced outside the class's\
    \ package (it has package visibility, but it can be referenced from derived classes\
    \ – even if they belong to a different package). As an example the Annuity now\
    \ can be written as follows:\n\n```\npackage loanprogram;\n\npublic class Annuity\
    \ extends Loan {\n    public Annuity(double principal, double interestRate, int\
    \ periods) {\n        super(principal, interestRate, periods);\n    }\n\n    public\
    \ double payment(int n) {\n        return principal * interestRate / (1 + Math.pow(1\
    \ + interestRate, -periods));\n    }\n\n    public double outstanding(int n) {\n\
    \        return principal * Math.pow(1 + interestRate, n) - payment(0) * (Math.pow(1\
    \ + interestRate, n) - 1) / interestRate;\n    }\n\n    public double repayment(int\
    \ n) {\n        return payment(n) - interest(n);\n    }\n}\n```"
