  md: '# JAVA 3: OBJECT-ORIENTED PROGRAMMING

    A LAST NOTE ABOUT CLASSES


    With regard of inheritance one can say that there are two uses. In one situation
    you have some classes which are similar, such that they somewhat are comprised
    of the same variables and methods. In such a situation you can what the classes
    have in common, and move it into a common base class, that the others inherits.
    That way, you avoid the same code be found in several places and thus have a program
    that takes up less space, but the important thing is that if you have to change
    the code, you should only change it at one place, and you are sure that you do
    not forget to change somewhere. The second situation is that you have defined
    a concept in the form of a class, and then you need a different concept, similar
    to the first but might need an extra variable or method, or a method that should
    work on another way. In this case, the new concept can be defined as a class that
    inherits the first class. The two situations are really two sides of the same
    coin, but in the first case we speak of generalization, while in the second case,
    we talk about specialization. Whatever''s inheritance reflects the fact that a
    program consists of classes that have something in common and to model concepts
    of the same kind, and may be useful to define a hierarchy of classes that inherit
    each other.


    At the design level the implementation of an interface also is a form of inheritance
    as an interface says that an object satisfies a particular contract. Because Java
    only supports linear inheritance, interfaces help during the design to work with
    multiple inheritance.


