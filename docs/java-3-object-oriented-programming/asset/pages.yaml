  md: '# JAVA 3: OBJECT-ORIENTED PROGRAMMING INTRODUCTION


    When the program creates a new variable, it happens at the top of the stack –
    where the arrow is pointing, and if a variable is removed, it is the one that
    at the top of the stack. Variables of simple data types have the property that
    they always take up the same. As an example fills an int (4 bytes), no matter
    what value it has. Therefore for the kind of variables stored directly on the
    stack the compiler knows how much space they use. Thus, if one as an example in
    a method writes


    ```

    int a = 23;

    ```


    then will be created a variable on the stack of type int and the space as an int
    requires (4 bytes), and the value is stored there. Variables that this way are
    stored directly on the stack, they are also called value types, and the simple
    primitive types – except String – are all value types.


    Things are different with the references of variables such as, which has a class
    type. They have to be created explicitly with new. If, for example you have a
    class named Cube, and you want to create such an object, you must write


    ```

    Cube c = new Cube();

    ```


    It looks like, how to create a simple variable. The variable is called c. When
    new is executed, what happens is that on a so-called heap is created an object
    of the type Cube. One can think of the heap as a memory pool from which allocate
    memory needed. On the stack is created an usual variable of type Cube, but stored
    on the stack is not the value of a Cube object, but rather a reference to the
    object on the heap. All references take up the same regardless of the type, and
    they can be stored on the stack. That is why it is called a reference type. Where
    exactly an object is created on the heap is determined by a so-called heap manager
    that is a program that is constantly running and manages the heap. It is also
    the heap manager, which automatically removes an object when it is no longer needed.'
