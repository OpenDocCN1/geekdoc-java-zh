  md: '# 4.1 MORE ABOUT INHERITANCE


    Above I have dealt with the most important concerning inheritance, but there are
    some details back. The kind of inheritance, as discussed above, is called for
    linear inheritance, which means that a class can only inherit one class – a class
    can have one base class. On the other hand, a class can have all the derived classes,
    as may be needed, and you can inherit in all the levels as you wish. Inheritance
    leads to a hierarchy of classes. As an example the classes concerning loans have
    the following hierarchy:


    ![](img/776e8c536372a20cad0e1e1692e9f3e5_117_0.png)


    ILo is an interface, but it is included in the type hierarchy in the same manner
    as classes. As another example, consider class hierarchy from problem 2:


    ![](img/776e8c536372a20cad0e1e1692e9f3e5_117_1.png)


    If a class can inherit several classes, we talk about multiple inheritance, but
    Java supports only linear inheritance. Java does indirectly support multiple inheritance
    when a class can implement all the interfaces that are needed. It is not inheritance,
    but it means at design time where you decide which classes a program must consist
    of, can work with multiple inheritance. You can design classes that implements
    multiple interfaces.'
