    is referred to as the actual parameters. Above I have shown how to specify that
    a method has a variable number of parameters, which is just a question that the
    compiler creates an array as the actual parameter. Methods parameters can generally
    be of any type, but you should be aware that primitive types and reference types
    are treated differently. For primitive types the transmitted values are directly
    copied to these copies. This means that if a method is changing the value of a
    parameter that has a primitive type, then it is the value on the stack that is
    changed, and after the method is terminated, the values of the calling code are
    unchanged. We therefore also call a parameter of a primitive type for a value
    parameter. If you for example consider the following method:


    ```

    public ArrayList<Course> getCourses(int year)

    ```


    so is its parameter a primitive type, and if the method changes the value of year,
    it would only have effect in the method, but the change would not have effect
    in the code where the method was called.


    Reference parameters are in principle transferred the same way, where on the stack
    is created a copy of the parameter and the current value is copied to this. However,
    you should be aware of what is created and copied. In the case of a reference
    parameter what is created on the stack is a reference, and what is copied is the
    reference to the current object. As an example the following method has a reference
    parameter:


