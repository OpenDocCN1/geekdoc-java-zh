    The meaning of the first two has already been explained and protected is a between
    thing where a protected member can be referenced from other classes in the same
    package and derived classes. I have previously explained inheritance, including
    derived classes, but the topic is described in more detail in a later chapter
    in this book, where I will also demonstrate the use of protected. Finally, there
    is the possibility of not indicating any visibility which means a member can be
    referenced only within the same package.


    It is the programmer of a class that defines visibility for the class''s members.
    In principle, one could make everything public, but it would also increase the
    risk that a variable or method was used in unintended way. Therefore, you should
    open as little as little for the class''s members. As mentioned earlier, you usually
    define all variables private, and equips a class with the necessary public methods,
    and for the sake of derived classes you can also be considered to define methods
    and exceptionally variables as protected.


