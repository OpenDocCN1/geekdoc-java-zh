  md: 'An object is characterized by four things:


    +   - a unique identifier that identifies a particular object from all other

    - a state that is the object''s current value

    - a behavior that tells what you can do with the object

    - a life cycle from when the object is created and to it again is deleted


    An object is created from a class, and that time assigned a reference that identifies
    the object. The class''s instance variables determine which variables to be created
    for the object, and the value of these variables is the state of the object. The
    class''s methods define what you can do with the object and thus the object''s
    behavior. The last point of concerning is the objects life cycle, which is explained
    later.


    To program in that way in which you see a program as composed of a number of cooperating
    objects, is called object-oriented programming. For many years we have used object-oriented
    programming, and although it is primarily a question of design, it also requires
    that the current programming language supports the object-oriented thinking, and
    this is what makes Java an object oriented programming language. This book focuses
    on object-oriented programming, including both object-oriented design, and how
    it is supported in Java. There are many concepts that include


    +   1. objects life cycle

    2. inheritance and polymorphism

    3. generic types

    4. collection classes


    all subjects that are discussed below, and in the next book. To explain these
    concepts I will consider classes as concerning students at an educational institution,
    as well as books in a library.'
