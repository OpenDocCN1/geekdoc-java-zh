  md: "# INHERITANCE\n\nIf you have a class and you want another class, similar to\
    \ the first, expanded with new variables or methods, or you may want one or more\
    \ methods to work in a different way, the new class can inherit the first. As\
    \ explained in Java 1, the class that inherits is for called a derived class,\
    \ while the class it is inherited from is the base class. Other words for the\
    \ same are respectively subclasses andsuperclass. I in this section illustrate\
    \ inheritance through classes, which represent loans in a bank. To make it simple,\
    \ I will assume that a loan is characterized by the formation expenses and an\
    \ amount that I will collect throughout the loan's principal, an interest rate\
    \ which I would assume is constant throughout the loan period, and a number of\
    \ periods, which is the number of payments to repay the loan. It thus corresponds\
    \ to the same requirements as I assumed in the loan calculation program in the\
    \ book Java 2. Under these conditions a loan is defined as the following class:\n\
    \n```\npackage loanprogram;\npublic class Loan\n{\n    private double principal;\
    \ // the amount borrowed inc. costs\n    private double interestRate; // interest\
    \ rate as a number between 0 and 1\n    private int periods; // the number of\
    \ periods or number of payments\n\n    public Loan(double principal, double interestRate,\
    \ int periods)\n{\n        this.principal = principal;\n        this.interestRate\
    \ = interestRate;\n        this.periods = periods;\n    }\n\n    public double\
    \ getPrincipal()\n{\n        return principal;\n    }\n\n    public double getInterestRate()\n\
    {\n        return interestRate;\n    }\n\n    public int getPeriods()\n{\n   \
    \     return periods;\n    }\n\n```"
