  md: "# JAVA 3: OBJECT-ORIENTED PROGRAMMING                               THE CLASS\
    \ OBJECT\n\nsubject is an object, and when System.out.println() prints an object,\
    \ it is the result of the object's toString() method that is printed. If no object's\
    \ class does not have a toString() method - such as the class Subject - it is\
    \ toString() from the base class that is performed, and in this case it is toString()\
    \ from the class Object. The class Object has a default toString() method that\
    \ prints the class name followed by. The reference to the object on the heap specified\
    \ as a hexadecimal number. Of course it makes no particular sense, but it means\
    \ that all objects can be printed with System.out.println(), or more precisely\
    \ that one has a representation of any object as a text. It is up to the programmer\
    \ of the object's class to override the toString() so that it returns a reasonable\
    \ result. I will immediately remove the comments for toString() method in the\
    \ class Subject again:\n\nMathematics\nMathematics 7\n\nIf you in the above method\
    \ wrote the statement\n\n```\nString s = \"The subject: \" + subject;\n```\n\n\
    the result will be that the variable s has value\n\n```\nSubject: Mathematics\
    \ 7\n```\n\nThe reason is that the plus operator is interpreted as string concatenation,\
    \ and since subject is an object, it is the value of this object's toString(),\
    \ that is concatenated. Incidentally, the result would be the same if you wrote:\n\
    \n```\nString s = \"The subject: \" + subject.toString();\n```\n\nAnother method\
    \ in the class Object is called getClass(), and it returns an object of a type\
    \ Class which contains information about an object's class – and there are many.\
    \ Consider as example the following method:\n\n```\nprivate static void test02()\
    \ {\n  try {\n    ISubject subject = Factory.createSubject(\"MAT7\", \"Mathematics\"\
    );\n    print(subject);\n  } catch (Exception ex) {\n  }\n}\n```\n\nDownload free\
    \ eBooks at bookboom.com"
