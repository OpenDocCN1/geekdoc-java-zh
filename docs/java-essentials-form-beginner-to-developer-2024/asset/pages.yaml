  md: 'especially for applications that require managing numerous connections simultaneously,
    such as web servers.


    # 10.2.2 Buffers: The Core of NIO


    Buffers are a core concept in NIO, representing a contiguous block of memory where
    data is temporarily stored during I/O operations. Unlike streams in the traditional
    I/O model, which process data in a linear, sequential manner, buffers allow data
    to be read and written randomly. Buffers in Java NIO are typed; i.e., there are
    separate buffer classes for different data types as ByteBuffer, CharBuffer, IntBuffer,
    etc. These buffers operate under a flip mechanism where the buffer switches from
    writing mode to reading mode, ensuring efficient data access and manipulation.


    # 10.2.3 Channels: A New Way to Handle IO


    Channels can be thought of as conduits through which data is transferred between
    buffers and the external entity (e.g., a file or a network socket). They provide
    a unified API for managing various types of I/O operations like reading from and
    writing to files, as well as network communications. The primary channel types
    include FileChannel for I/O, SocketChannel for TCP network I/O, and DatagramChannel
    for UDP network I/O. In contrast to streams, channels support both reading and
    writing on the same instance, facilitating more versatile and powerful data handling
    capabilities.'
