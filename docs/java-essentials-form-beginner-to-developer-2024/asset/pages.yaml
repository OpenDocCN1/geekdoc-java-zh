    are a security mechanism that allows the inner class to access the members of
    its outer class while keeping its own members hidden from the world outside. Inner
    classes are divided into several types based on their purpose and the way they
    are declared and used: member inner classes, local inner classes, anonymous inner
    classes, and static nested classes. Each type serves different roles, offering
    a powerful mechanism for encapsulation and organization of code.


