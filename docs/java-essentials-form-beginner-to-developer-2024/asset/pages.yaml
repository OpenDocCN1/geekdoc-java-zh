    # Setting Up Your Java Environment


    # 2.1 Configuring System Environment Variables


    # 2.1.1 Introduction to Environment Variables for Java


    Environment variables in computing are dynamic values that affect the behavior
    of running processes on a computer. They can specify data like the location of
    system files, or settings for software applications. For Java development, setting
    environment variables is crucial because they direct where the Java compiler (javac)
    and Java runtime (java) can be found. This allows developers to run Java commands
    from the command line from any directory without having to specify the full path
    to the Java executables.


    # 2.1.2 Setting JAVA_HOME and Updating the PATH


    Setting JAVA_HOME: The JAVA_HOME environment variable points to the installation
    directory of the JDK. This variable is used by applications to find the Java libraries.'
  merge: -1
  img_proc: true
- pgno: 18
  md: '+   1. Right-click on ''My Computer'' and select ''Properties''.


    +   2. Navigate to ''Advanced system settings'' > ''Environment Variables''.


    +   3. Click ''New'' to create a new environment variable. Name it JAVA_HOME and
    set its value to the JDK installation path (e.g., C:\Program Files\Java\jdk-17).
    ● macOS/Linux:


    +   1. Open the Terminal.


    +   2. Edit your shell profile file (.bash_profile, .bashrc, .zshrc etc.). For
    example, you can open it with nano ~/.bashrc.


    +   3. Add this line: export JAVA_HOME=$(/usr/libexec/java_home).


    +   4. Save the changes and close the editor.


    Updating the PATH: To easily run Java executables from the command line, add the
    JDK''s bin directory to the system PATH.


    +   ● Windows: Follow the steps to get to the ''Environment Variables'' as above,
    then find the PATHvariable and select ''Edit''. Append the path to the JDK''s
    bin directory (e.g., C:\Program Files\Java\jdk-17).


    +   ● macOS/Linux: Open the shell profile file as before and add the line: export
    PATH=$PATH:$JAVA_HOME/bin.


    # 2.1.3 Verifying the Configuration in Windows, macOS, and Linux


    After setting JAVA_HOME and updating the PATH, verify the configuration:'
  merge: -1
  img_proc: true
