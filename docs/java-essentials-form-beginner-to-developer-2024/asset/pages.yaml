    The core concepts of OOP include:


    +   - Classes: Templates for creating objects, defining their structure and behavior.
    - Objects: Instances of classes, representing specific entities.

    - Inheritance: A mechanism for creating new classes from existing ones, enhancing
    code reusability.


    +   - Polymorphism: The ability to call the same method on different objects and
    have each of them respond in their own way.

    - Encapsulation: The bundling of data and methods that operate on the data within
    one unit, restricting access to some of the object''s components.


    # 6.1.2 Benefits of Object-Oriented Programming


    +   - Modularity: The source code for an object can be written and maintained
    independently of the source code for other objects. This makes it easier to manage
    large applications.


    +   - Reuse of Code: Through inheritance, a new class can be derived from an existing
    class, inheriting its properties and methods, leading to significant code reuse.'
