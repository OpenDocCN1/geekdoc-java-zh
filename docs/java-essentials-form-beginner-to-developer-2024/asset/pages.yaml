    # 12.1.1 Introduction to Abstraction


    Abstraction is a fundamental concept in Object-Oriented Programming (OOP) that
    aims to hide complex implementation details and show only the necessary features
    of an object. It helps in managing complexity by allowing programmers to think
    at a higher level of logic. Abstraction can be achieved with either abstract classes
    or interfaces in Java. An abstract class can have both abstract (methods without
    bodies) and non-abstract methods, making it a powerful tool for sharing a common
