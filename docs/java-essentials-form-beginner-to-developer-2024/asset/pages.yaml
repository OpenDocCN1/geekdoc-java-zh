  md: '# # 10.4 Understanding Byte Streams and Character Streams


    # ## 10.4.1 Difference Between Byte Streams and Character Streams


    Java I/O streams are categorized into two main types: byte streams and character
    streams. Byte streams (InputStream and OutputStream subclasses) are primarily
    used for handling raw binary data, such as image files, audio files, and serialized
    objects. They read and write data byte by byte. Character streams (Reader and
    writer subclasses), on the other hand, are designed for handling character data,
    like text files. They read and write data character by character, automatically
    handling character encoding and decoding, thus abstracting the complexity of converting
    between characters and bytes.


    # ## 10.4.2 When to Use Byte Streams Over Character Streams


    Byte streams should be used when dealing with raw data or binary files where data
    does not necessarily represent characters. Examples include:


    +   - Reading or writing binary files (e.g., images, videos).

    - Working with serialized objects.

    - Interacting with data streams that come from sources or go to destinations that
    do'
