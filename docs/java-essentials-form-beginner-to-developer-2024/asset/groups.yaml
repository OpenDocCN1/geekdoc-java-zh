    \ case：\n\n```\nswitch(expression) {\n  case value1:\n    // 当表达式匹配 value1 时执行代码块\n\
    \    break;\n  case value2:\n    // 当表达式匹配 value2 时执行代码块\n    break;\n  default:\n\
    \    // 如果没有匹配项，执行默认代码\n}\n```\n\nswitch 语句可以处理 `byte`、`short`、`char` 和 `int`\
    \ 原始类型。\n\nJava 新的 switch 表达式：Java 引入了增强的 switch 表达式，简化了 switch 语句的使用，消除了对 `break`\
    \ 语句的需求，并允许直接从 switch 表达式返回结果。\n\n### 3.3.3 实践中的条件逻辑\n\n组合条件：逻辑运算符 `&&`、`||`、`!`\
