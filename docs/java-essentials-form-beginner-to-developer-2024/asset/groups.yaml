    \ 关键字对该类进行扩展。例如，如果 `Animal` 是一个父类，创建一个继承自 `Animal` 的子类 `Dog` 可以如下所示：通过扩展 `Animal`，`Dog`\
    \ 继承了 `eat` 方法，并且也可以定义定义自己的方法，例如 `bark`。\n\n## 7.1.3 利用保护 访问修饰符\n\n`protected`\
    \ 访问修饰符在继承中起着至关重要的作用。父类中声明为 `protected` 的成员可以被子类访问（包括包外的子类），但无法被包外的类访问。\n\n该修饰符有助于封装父类的成员，允许对它们进行受控的访问，而不是\
    \ `public` 访问（可能会暴露过多的父类内部细节）或 `private` 访问（这将阻止子类访问重要的成员）。\n\n## 7.1.4 探索继承层次结构和多重继承问题\n\
    \n当一个类继承自一个子类时，就会形成继承层次结构，创建一个具有多个级的类“族谱”。这允许在每个子类层级实现更具体的分类和行为。\n\nJava 不支持通过类进行多重继承，以避免“菱问题”，即一个类继承自两个具有相同方法签名方法的类。这可能会让编译器产生困惑，不知道该调用哪种方法。然而，Java\
    \ 通过允许类实现多个接口来解决多重继承的需求。\n\n继承层次结构的示例：\n\n```java\nclass Animal {\n    void eat()\
    \ {\n        System.out.println(\"This animal eats.\");\n    }\n}\n\nclass Mammal\
    \ extends Animal {\n    void breathe() {\n        System.out.println(\"This mammal\
    \ breathes.\");\n    }\n}\n\nclass Bat extends Mammal {\n    void fly() {\n  \
    \      System.out.println(\"This bat can fly.\");\n    }\n}\n```\n\n在这里，`Bat`\
    \ 继承自 `Mammal`，`Mammal` 又继承自 `Animal`，形成了一个层次结构。通过理解并适当实现继承，开发者可以创建灵活且易于维护的代码。\n\
    \n## 7.2 使用 'super' 和方法重写\n\n`super` 关键字的使用和方法重写的概念在 Java 继承实现中起着重要作用，增强了功能性和多态。\n\
    \n### 7.2.1 'super' 关键字访问父类成员的作用\n\nJava 中的 `super` 关键字是一个引用变量，用于引用直接父类对象。它可以用于访问在子类中重写或隐藏的父类方法和构造函数。\n\
    \n- 访问父类方法：`super` 可以调用在子类中被重写的父类方法。当你希望从子类中同时访问父类和子类版本的方法时，这特别有用。\n- 调用父类构造函数：`super()`\
    \ 可以调用父类构造函数。`super()` 的调用必须是子类每个构造函数的第一个语句。如果子类构造函数没有显式调用父类构造函数，Java 编译器会自动插入对父类无参数构造函数的调用。\n\
    \n```java\nclass Animal {\n    void move() {\n        System.out.println(\"Animals\
    \ can move\");\n    }\n}\n\nclass Dog extends Animal {\n    void move() {\n  \
    \      super.move(); // 调用 Animal 类中的方法\n        System.out.println(\"Dogs can\
    \ walk and run\");\n    }\n}\n```\n\n### 7.2.2 在子类中重写方法\n\n方法重写发生在类重新定义父类方法时。重写允许子类提供父类方法的具体实现。\n\
    \n重写规则：方法必须完全匹配父类方法。\n\n重写的示例：\n\n```java\nclass Vehicle {\n  void run() {\n \
    \   System.out.println(\"Vehicle is running\");\n  }\n}\n\nclass Car extends Vehicle\
    \ {\n  @Override\n  void run() {\n    System.out.println(\"Car is running\");\n\
    \  }\n}\n```\n\n### 7.2.3 重写的规则与最佳实践\n\n- 1. 签名匹配：方法名和参数必须与父类。\n- 2. 访问级别：访问级别不能比父类方法更严格。\n\
    - 3. 返回类型：必须与父类相同或为子类型。\n- 4. 对父类的调用：有时需要在子类中调用父类的版本。\n\n### 7.2.4 @Override 注解的重要性\n\
    \n`@Override` 注解表示该方法意图重写父类中的方法。如果方法没有实际重写父类方法，编译器会报错。此注解增强了代码的安全性，并确保子类正确重写了预期的方法。\n\
    \n## 7.3 接口与抽象类\n\n接口和抽象类是 Java 中实现抽象和多重继承（通过接口）的两个概念。它们为类设定蓝图，指导它们实现哪些方法。\n\n\
    ### 7.3.1 定义和实现接口\n\nJava 接口是一种引用类型，类似于类，但只包含常量、方法签名、默认方法、静态方法和嵌套类型。接口不包含实例字段。接口中的方法默认是抽象的。\n\
    \n要定义接口，使用 `interface` 关键字。类实现接口并必须为接口中的抽象方法提供具体实现。\n\n```java\ninterface Animal\
    \ {\n    void eat();\n    void travel();\n}\nclass Mammal implements Animal {\n\
    \  public void eat() {\n    System.out.println(\"Mammal eats\");\n  }\n\n  public\
    \ void travel() {\n    System.out.println(\"Mammal travels\");\n  }\n}\n```\n\n\
    ### 7.3.2 接口与抽象类的比较\n\n接口和抽象类都可以拥有抽象方法，但存在关键区别：\n\n- 抽象类：可以包含带有实现的方法的方法。子类只能继承一个抽象类。\n\
    - 接口：在 Java 8 之前，接口只能包含没有实现的抽象方法。从 Java 8 开始，它们可以包含带有主体的默认和静态方法。类可以实现多个接口。\n\n\
    当子类共享带有实现的方法时使用抽象类。接口通常用于定义一组通用功能，任何类都可以提供这些功能。\n\n### 7.3.3 在接口中使用默认和静态方法\n\n\
    Java 8 引入了通过默认和静态方法在接口中定义具体方法的能力。这允许向接口中添加新功能，而不影响实现这些接口的类。\n\n"
