    Choosing the right collection type depends on several factors:


    - *Ordering: If you need to maintain the insertion order, consider ArrayList or
    LinkedHashSet.

    - *Duplicates: If your collection cannot contain duplicates, use set implementations
    like HashSet.

    - *Key-Value Pairs: To store data in key-value pairs for efficient retrieval,
    use Map implementations like HashMap.

    - *Access: If you need fast access to elements by index, use List implementations
    such as ArrayList.

    - *Concurrency: Consider thread-safe or concurrent collections from the java.util.concurrent
    package when working in a multithreaded environment.


    Selecting the appropriate collection type optimizes both the performance and the
    readability of your code, making the Collections Framework a cornerstone of effective
    Java development.


    ## 9.2 Lists, Sets, and Queues


    The Java Collections Framework divides its data structures into several core interfaces,
    each serving different data management purposes. Among these, the List, Set, and
    Queue interfaces are foundational, each catering to specific requirements.


    ### 9.2.1 Understanding List Interface


    The List interface in Java allows for ordered collections of elements, including
    duplicates. Lists excel in scenarios where the insertion order of elements matters
    or direct positional access to elements is needed.


    ### ArrayList


    Description: An implementation of the List interface backed by a resizable array.
    This provides fast access to elements via indices.


    - Use Cases: Ideal for scenarios with minimal insertion and deletion operations
    but numerous access operations.

    - Key Features: Automatic resizing, fast random access.


    ### LinkedList


    - Description: A doubly-linked list implementation of the List and Deque interfaces.
    It allows for constant-time insertions and deletions from the list''s beginning
    or end.

    - Use Cases: Suitable for applications that require frequent insertions and deletions.

    - Key Features: Each element (node) contains references to both the next and previous
