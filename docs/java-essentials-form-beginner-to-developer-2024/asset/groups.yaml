    Description: Implements the Map interface, using a hash table. It permits null
    values and one null key, providing constant-time performance for the basic operations
    (get and put), assuming the hash function disperses properly across the buckets.


    Use Cases: Best used when the order of insertion is not significant, and fast
    access to elements is needed.


    Key Features: Iteration over HashMap views (keys, values, entries) depends on
    the capacity of the hash table and the number of key-value pairs.


    ## LinkedHashMap


    Description: A HashMap with a linked list running through it, thus it maintains
    the insertion order (or optionally, access order). Except for ordering behavior,
    it has the same characteristics as HashMap.


    Use Cases: Useful in scenarios where the order of insertion/access is to be preserved.


    Key Features: Slightly lower performance than HashMap in terms of iteration due
    to the enhanced structure to maintain order.


    ## TreeMap


    Description: Implements the NavigableMap interface and arranges keys according
    to their natural ordering or a specified Comparator. It''s based on a Red-Black
    tree structure.


    - Use Cases: Ideal for when you need to extract ranges of keys or require the
    keys to be sorted.

    - Key Features: Provides guaranteed log(n) time cost for the containsKey, get,
    put, and remove operations.


    ## 9.3.2 Comparing Map Implementations


    | Feature/Map Type | HashMap | LinkedHashMap | TreeMap |

    | :--- | :--- | :--- | :--- |

    | Ordering | No order | Insertion/Access order | Sorted order |

    | Get/Put Time | O(1) average | O(1) average | O(log n) |

    | Iteration Order | Random | Insertion/Access order | Ascending key order |

    | Key Nullability | One null key allowed | One null key allowed | No null keys
    (if natural ordering used) |

    | Use Case | Most common scenarios where mapping is needed | When insertion/access
    order matters | When sorted order or range searches are necessary |


    ## 9.3.3 Special Map Implementations


    ### WeakHashMap


    - Description: A HashMap variant that stores keys as weak references. An entry
    in a WeakHashMap will automatically be removed when its key is no longer in ordinary
    use.


    - Use Cases: Suitable for caches and metadata storage where the longevity of stored
    data depends on external references to the key.

    - Key Features: The garbage collector automatically deletes the entries when the
    key is no longer referenced.


    ### EnumMap


    - Description: A specialized Map implementation for use with enum type keys. All
    of the keys in an EnumMap must come from a single enum type that is specified,
    explicitly or implicitly, when the map is created.


    - Use Cases: Extremely efficient and compact for key-based data access when using
    enums.

    - Key Features: Iteration order of the map follows the natural order of the enum
    keys.


    ### Hashtable (Legacy)


    - Description: An early implementation of a map data structure which is synchronized,
    meaning it''s thread-safe but provides lower performance in single-threaded scenarios
    compared to HashMap.


    - Use Cases: Now considered legacy, it''s rarely recommended with the existence
    of ConcurrentHashMap for thread-safe maps.


    - Key Features: Does not allow null keys or values, unlike HashMap.


    Choosing the correct Map implementation can greatly impact the performance and
    resource usage of your Java applications, especially when dealing with large datasets
    or performance-critical applications.


    ## 9.4 Collection Class Utilities


    The Java Collections Framework not only provides a variety of data structures
    but also includes a powerful set of utilities through the Collections class. These
    utilities offer methods for sorting, searching, modifying, and converting collections,
    enhancing the capability to efficiently manage and manipulate data.


    ## 9.4.1 Sorting Collections


    Sorting is a fundamental operation for collections that allow their elements to
    be arranged in a specific order.


    ### Using Comparable


    - Description: The Comparable interface provides a single compareTo method, which
    defines the natural order of objects. Classes that implement this interface can
    be easily sorted.


    - How It Works: An object is compared with another object for order, returning
    a negative integer, zero, or a positive integer as this object is less than, equal
    to, or greater than the specified object.


    ### Using Comparator


    - Description: The Comparator interface defines a compare method, allowing the
    order of objects to be controlled outside the objects themselves. It''s especially
    useful when a class cannot be modified to implement Comparable, or when multiple
    sorting orders are needed.


    - How It Works: It compares its two arguments for order, returning a negative
    integer, zero, or a positive integer as this object is less than, equal to, or
    greater than the specified object.


    ## 9.4.2 Searching in Collections


    - The `binarySearch()` method is used to find a specific element within a collection.
    It requires the collection to be sorted beforehand to work correctly.


    ## 9.4.3 Converting Collections to Arrays


    - The `asList()` method creates a fixed-size list backed by an array.

    - The `toArray()` method converts a collection into an array.


    ## 9.4.4 Collections Class Utilities Overview


    - `sort()`: Sorts the elements in the list based on their natural order or a specified
    Comparator.

    - `reverse()`: Reverses the order of elements in the list.

    - `shuffle()`: Randomizes the order of elements in the list.


    ## 9.4.5 Using Thread Safety


    - `synchronizedList()`, `synchronizedSet()`, and `synchronizedMap()`: These methods
    return thread-safe wrappers around the provided collections, ensuring safety when
    accessed by multiple threads.


    ## 9.4.6 Unmodifiable Wrappers


    - `unmodifiableList()`, `unmodifiableSet()`, and `unmodifiableMap()`: These provide
    read-only access to collections. Any attempt to modify them will throw an UnsupportedOperationException.


    - `singletonList()`, `singletonSet()`, and `singletonMap()`: These create immutable
    collections containing a single element.

    - `emptyList()`, `emptySet()`, and `emptyMap()`: These return immutable empty
    collections, useful for saving memory.

