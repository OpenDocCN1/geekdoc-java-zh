    Modulus Operator The modulus operator, represented by %, is particularly useful
    for finding remainders, determining if a number is even or odd (by modulus 2),
    and cycling through values with wraparound at a specific threshold.


    # 3.2.2 Relational and Logical Operators


    Comparing Values Relational operators compare two values and determine the relationship
    between them. The primary relational operators are:


    +   * == (equals)

    * != (not equals to)

    * > (greater than)

    * < (less than)

    * >= (greater than or equal to) • <= (less than or equal to)


    These operators return a boolean result (true or false). Combining Conditions:
    AND, OR, NOT Logical operators are used to form more complex conditional expressions:


    +   * && (Logical AND): Returns true only if both operands are true.

    * || (Logical OR): Returns true if at least one of the operands is true. • ! (Logical
    NOT): Inverts the value of a boolean, turning true to false and vice versa.'
  - '[PAGE 33]


    # ### 3.2.3 Assignment Operators


    Simple Assignment The simple assignment operator = is used to assign the value
    on its right to the operand on its left.


    Compound Assignment Operators Compound assignment operators perform an operation
    and assignment in one step. Examples include +=, -=, *=, /= and %=. For example,
    x += y is equivalent to x = x + y.


    # ### 3.2.4 Unary Operators, Ternary Operator, and Operator Precedence


    Increment and Decrement The increment (++) and decrement (--) increase or decrease
    a variable''s value by one, respectively. They can be used both as prefix and
    postfix forms, which can affect the timing of the operation within an expression.


    Using the Ternary Operator for Conditional Assignment The ternary operator ? :
    offers a shortcut for an if-else statement and is used for conditional assignments.
    The syntax is condition ? valueTrue : valueFalse.


    Understanding Operator Precedence and Associativity Operator precedence determines
    the grouping of terms in an expression. This affects how an expression is evaluated.
    Certain operators take precedence over others; for example, multiplication takes
    precedence over addition and subtraction. Associativity defines the direction
    of execution, either left-to-right or right-to-left, which is crucial when multiple
    operations occur in an expression with operators of the same precedence level.'
