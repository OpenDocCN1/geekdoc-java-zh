    Method Overriding (Dynamic Polymorphism): It enables a subclass to provide a specific
    implementation for a method that is already provided by its superclass. The method
    in the subclass must have the same name, return type, and parameters as the method
    in the parent class.


    # 7.4.3 Dynamic Method Dispatch


    Dynamic method dispatch is a mechanism by which a call to an overridden method
    is resolved at runtime rather than compile-time. This is how Java implements runtime
    polymorphism.

    In this scenario, the reference type Animal does not determine which version of
    sound() is called. The method to be called is determined at runtime by the type
    of the instance.


    # 7.4.4 Real-world Examples of Polymorphism


    +   Graphical User Interface (GUI) Elements: Different objects (such as buttons,
    textboxes, and checkboxes) might inherit from a common superclass (e.g., Component).
    Each object might override a draw() method to render it. When iterating through
    a collection of components and calling draw(), polymorphism ensures that the correct
    method is called for each element.


    +   Payment Processing Systems: In a payment system, different payment methods
    (credit card, PayPal, bank transfer) might derive from a Payment superclass. Each
    method would have its own implementation of a processPayment() method. Polymorphism
    allows the system to process different payment types in a uniform manner, enhancing
    code reusability and flexibility.'
