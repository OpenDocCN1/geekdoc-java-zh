    \n## 3.2 深入研究运算符与表达式\n\n### 3.2.1 算术运算符\n\n基本操作：加法、减法等。Java 提供了几种算术运算符来执行常见的数学运算：\n\
    \n- +（加法）：合并两个值。\n- -（减法）：从另一个值中减去一个值。\n- *（乘法）：两个值相乘。\n- /（除法）：一个除除另一个。如果两个操作数都是整数，结果也将是整数，舍弃任何余数。\n\
    - %（模运算符）：返回除法运算的余数。\n\n模运算符：由 `%` 表示的模运算符对于寻找余数、判断数字是偶数还是奇数（通过模 2）以及在特定阈值处循环值特别有用。\n\
    \n### 3.2.2 关系运算符与逻辑运算符\n\n比较值：关系运算符比较两个值并确定它们之间的关系。主要的关系运算符有：\n\n- ==（等等于）\n\
