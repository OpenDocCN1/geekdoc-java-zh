    \ access to fields and methods from within the same package. It's more accessible\
    \ than private but still provides a constrained access level.\n- Protected: Similar\
    \ to default access, with the addition that subclasses (even in different packages)\
    \ can access protected members.\n"
  mdcn: "\n可用的。当你定义一个方法时，你将其参数列表作为其声明的一部分。当你调用该方法时，你提供与这些参数对应的参数。Java 方法通过“按值传递”来接收参数，这意味着方法接收的是原始数据的拷贝。\n\
    \n```java\npublic static void greet(String name) {\n    System.out.println(\"\
    Hello, \" + name);\n}\n\npublic static void main(String[] args) {\n    greet(\"\
    Alice\"); // 将 \"Alice\" 作为参数传递给 greet 方法\n}\n```\n\n## 5.2.2 基本类型 vs. 引用参数\n\n\
    在 Java 中，方法参数是按值传递的。这个概念在基本类型和引用类型中的表现不同。\n\n- - 基本类型参数：对于基本数据类型（例如 int, double,\
    \ char），方法接收的是该值的拷贝。修改此值不会影响原始变量。\n\n```java\npublic static void increment(int\
    \ number) {\n    number++;\n    System.out.println(\"Number inside method: \"\
    \ + number);\n}\n\npublic static void main(String[] args) {\n    int value = 5;\n\
    \    increment(value); // value 在方法外部保持为 5\n    System.out.println(\"Number after\
    \ method call: \" + value);\n}\n```\n\n- - 引用参数：对于引用数据类型（例如数组、对象），方法接收的是引用的拷贝，指向内存中的同一个对象。通过此引用修改对象将影响原始对象。\n\
    \n```java\npublic static void updateArray(int[] arr) {\n    arr[0] = 100;\n}\n\
    \npublic static void main(String[] args) {\n    int[] values = {1, 2, 3};\n  \
    \  updateArray(values);\n    System.out.println(\"First element: \" + values[0]);\
    \ // 输出 100，显示了\n}\n```\n\n## 5.2.3 返回类型详解\n\n方法的返回类型决定它可以返回给调用者的值的类型。返回类型在声明中紧跟方法方法之前。方法可以返回任何类型的数据，包括基本类型、对象，甚至没有数据（void）。如果方法声明了返回类型（void\
    \ 除外），则它必须使用 return 语句来返回该类型的值。\n\n```java\npublic static double getAverage(int\
    \ sum, int count) {\n    return (double) sum / count;\n}\n```\n\n## 5.2.4 从方法返回多个值\n\
    \nJava 方法只能返回一个值。然而，你可以通过数组或对象来封装多个值，从而绕过这一限制。\n\n- - 使用数组：适用于返回相同类型的多个值。\n\n\
    ```java\npublic static int[] minMax(int[] numbers) {\n  int[] result = {numbers[0],\
    \ numbers[0]}; // 假设数组不空\n  for (int num : numbers) {\n    if (num < result[0])\
    \ result[0] = num; // 更新 num\n    if (num > result[1]) result[1] = num; // 更新最大值\n\
    \  }\n  return result; // 包含最小值和最大值的数组\n}\n```\n\n- - 使用对象：适用于返回不同类型的值或当你需要返回结构化数据时。\n\
    \n```java\nclass MinMax {\n  int min;\n  int max;\n\n  MinMax(int min, int max)\
    \ {\n    this.min = min;\n    this.max = max;\n  }\n\n  public static MinMax findMinMax(int[]\
    \ numbers) {\n    return new MinMax(/* 最小值的计算 */, /* 最大值的计算 */);\n  }\n}\n```\n\
    \n理解参数及其类型，掌握返回机制，是开发高效灵活的 Java 应用程序的必备技能。\n\n## 5.3 方法重载\n\n### 5.3.1 方法重载的概念\n\
    \n方法重载是 Java 的一种特性，允许在同一个类中存在多个相同名称的方法，只要它们在参数上有所不同（参数的数量、参数类型或两者均不同）。这不涉及方法的返回类型；它完全是由参数驱动的。重载实现了多态，使得方法在处理不同的输入场景时更加灵活，而无需为每种变体创建唯一的方法名。\n\
    \n## 5.3.2 使用不同参数类型重载方法\n\nJava 允许根据不同的参数类型对方法进行重载。这意味着你可以拥有接受不同类型参数的多个版本。它允许方法在同一个方法名下通过相同的逻辑操作处理不同类型的输入。\n\
    \n```java\npublic class Calculator {\n    public int add(int a, int b) {\n   \
    \     return a + b;\n    }\n\n    public double add(double a, double b) {\n  \
    \      return a + b;\n    }\n}\n```\n\n在上面的示例中，add 方法被重载以同时处理整数和双精度加法，使得 Calculator\
    \ 在处理输入类型时更加灵活。\n\n## 5.3.3 使用不同参数数量重载方法\n\n方法重载也可以基于参数的数量。这种变体对于输入数量不同的方法非常有用，你可以拥有相同名称但参数数量不同的方法。\n\
    \n```java\npublic class Calculator {\n    public int multiply(int a, int b) {\n\
    \        return a * b;\n    }\n\n    public int multiply(int a, int b, int c)\
    \ {\n        return a * b * c;\n    }\n}\n```\n\n### 4 方法重载的最佳实践\n\n虽然重载增加了灵活性，但请考虑以下几：\n\
    \n- 1. 谨慎使用重载：在合理的情况下重载。\n- 2. 保持逻辑一致性：确保重载的方法执行相似的任务。\n- 3. 使用清晰且具描述性的参数：这有助于明确。\n\
    - 4. 对于相同类型的多个参数考虑可变参数（varargs）：当需要处理数量数量参数时，考虑使用可变参数。\n\n## 5.4 理解作用域与可见性\n\n\
    ### 5.4.1 方法变量的作用域\n\n变量的作用域决定了在代码的什么位置可以被访问。方法变量（称为局部变量）定义在方法内部，仅在该方法内可用。它们在方法执行完成后就会消失。这种有限的作用域有助于减少命名冲突和内存占用，因为这些变量是临时的。\n\
    \n```java\npublic void myMethod() {\n    int local = 5; // 局部变量，在此可用\n}\n```\n\
    \n### 5.4.2 全局变量与局部变量\n\n- 局部变量：这些定义在方法内部，只能在该方法内访问。它们在每次调用方法时初始化，并且在方法外部不可见。\n\
    \n```java\npublic void someMethod() {\n    int localVar = 10; // 局部变量。在此可用\n}\n\
    ```\n\n- 全局变量：在 Java 语文中，全局变量通常被称为字段或类变量。这些变量可以从类的任何方法访问（取决于访问修符）。它们定义在方法之外，通常在类的顶部。\n\
    \n```java\npublic class MyClass {\n    int globalVar = 20; // 字段，类内任何方法均可访问\n\n\
    \    public void anotherMethod() {\n        System.out.println(globalVar); //\
    \ 访问全局变量\n    }\n}\n```\n\n### 5.4.3 访问修符及其影响\n\nJava 中的访问修符控制类字段（变量）和方法对其他类及程序部分的可见性。理解它们对于控制访问级别和保护对象至关重要。\n\
    \n- 私有（private）：私有修符将可见性限制在声明类内部。这是封装的核心原则，防止数据被意外访问和修改。\n- 默认（无修饰符）：允许在包内访问字段和方法。它比私有的更开放，但仍然提供了受限的访问级别。\n\
    - 保护（protected）：与默认访问类似，但子类（即使在不同的包中）也可以访问受保护的成员。\n"
