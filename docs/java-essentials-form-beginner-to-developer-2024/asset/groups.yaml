    # Exception Handling


    # 8.1 Understanding Exceptions


    Exceptions are events that occur during the execution of programs that disrupt
    the normal flow of instructions. In Java, an exception is an object thrown at
    runtime to indicate that an abnormal situation has occurred. Handling exceptions
    appropriately allows your program to continue operating or terminate gracefully
    instead of crashing due to unforeseen issues.


    # 8.1.1 What Are Exceptions?


    An exception can be any error condition or unexpected behavior encountered by
    an executing program. When such a condition arises, an object representing that
    exception is created and thrown in the method that caused the error. The method
    may choose to handle the exception itself or pass it on. If the method does not
    handle the exception, the runtime system attempts to find another method in the
    call stack that will, eventually leading to program termination if uncaught.'
  - '[PAGE 109]


    # ## 8.1.2 Types of Exceptions


    Exceptions in Java are categorized mainly into two types: checked exceptions and
    unchecked exceptions.


    **Checked Exceptions**


    Checked exceptions are exceptions that are checked at compile-time, meaning the
    compiler requires the code to either handle these exceptions or declare them using
    the throws keyword in the method signature. The presence of checked exceptions
    signals expectable yet unpreventable problems that a reasonable application should
    anticipate and recover from. An example of a checked exception is FileNotFoundException.


    **Unchecked Exceptions**


    checked exceptions represent defects in the program (bugs) - often logical errors.
    These are not checked at compile time; instead, they are checked at runtime. Since
    they reflect programming errors, handling them is usually not anticipated. Examples
    include NullPointerException and ArrayIndexOutOfBoundsException.


    # ## 8.1.3 The Exception Hierarchy


    All exception classes are descendants of the Throwable class. The Throwable class
    is divided into two main subclasses: Error (used for error conditions that a normal
    application should not try to catch) and Exception, which is divided further into
    checked exceptions and runtime exceptions (unchecked exceptions).'
  - '[PAGE 110]


    # ### 8.1.4 Common Exception Scenarios and Handling Strategies


    +   * Input/Output Operations: These operations are prone to failure due to many
    reasons like the file not existing or hardware failure. Strategies include using
    trycatch to handle these exceptions or declaring them with throws.


    +   * Null Pointer Access: Accessing or modifying the slots of null as if it were
    an array. A preventive check for null values before accessing methods or fields
    can mitigate this.


    +   * Array Index Out of Bound: Trying to access the elements of an array beyond
    its size. Ensuring index bounds checks before array access can prevent these.


    +   * Class Cast Exceptions: Trying to cast an object to a subclass of which it
    is not an instance. This can be prevented by using instanceof checks before casting.


    The key to exception handling is not only to prevent program crashes but also
    to ensure that resources (like file handles or network connections) are properly
    cleaned up and to provide meaningful error messages to the users and logs for
    debugging purposes. Careful planning and use of exceptions can significantly improve
    the reliability and maintainability of software.


    # ### 8.2 try, catch, and finally Blocks


    The try, catch, and finally blocks form the core of Java''s exception handling
    mechanism. They work together'
