    # ## 7.1.1 Understanding the Basics of Inheritance


    Inheritance enables a new class, known as the subclass or derived class, to absorb
    the members (fields, methods, and constructors) of another class, referred to
    as the super or base class. The primary advantage is the ability to define a common
    base class that can share code across multiple derived classes.


    Key concepts include:


    +   * Superclass and Subclass: The superclass is the class from which others inherit,
    whereas the subclass is the class that inherits from the superclass.

    * extends Keyword: In Java, the extends keyword is used by a class to declare
    that it inherits from another class.


    # ## 7.1.2 Creating and Extending Superclasses


    Creating a superclass involves defining a regular class that other classes will
    inherit from. Extending this class is done using the extends keyword. For example,
    if Animal is a superclass, creating a subclass Dog that inherits from Animal can
    be done as follows: By extending Animal, Dog inherits the eat method and can also
    define its own methods, such as bark.'
