    Polymorphism is a core concept in object-oriented programming that allows actions
    to operate differently based on the actual object that the action is being performed
    on. It enhances flexibility and the ability to extend code without modifying it.
    Polymorphism comes in two types in Java: static (compile-time) and dynamic (runtime).


    # ### 7.4.1 Demonstrating Static and Dynamic Polymorphism


    +   * Static Polymorphism is achieved through method overloading. It occurs at
    compiletime. In static polymorphism, the response to a function is determined
    by the parameter list at the time of compilation.'
