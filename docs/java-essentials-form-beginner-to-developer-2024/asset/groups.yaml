    \ // atomically increments by 1\n```\n\nThese are particularly useful for counters,\
    \ flags, or references that can be updated safely without the need for synchronization.\n\
    \n### 11.3.4 The SynchronousQueue and Phaser\n\nSynchronousQueue: A BlockingQueue\
    \ in which each insert operation must wait for a corresponding remove operation\
    \ by another thread, and vice versa. A synchronous queue does not have any internal\
    \ capacity, not even a capacity of one. It’s useful in scenarios where you want\
    \ to hand off data from one thread to another.\n\n```java\nBlockingQueue<String>\
    \ syncQueue = new SynchronousQueue<>();\nThread producer = new Thread(() -> syncQueue.put(\"\
    hello\"));\nThread consumer = new Thread(() -> String received = syncQueue.take());\n\
    producer.start();\nconsumer.start();\n```\n\nPhaser: A reusable resynchronization\
    \ barrier, similar in functionality to CyclicBarrier and CountDownLatch but with\
    \ more flexibility. A Phaser can handle a dynamic number of parties (threads)\
    \ registered to it and supports advancing from one phase to another. Each phase\
    \ number represents a r\n\n```java\nPhaser phaser = new Phaser(1); // '1' to register\
    \ the current thread\nint currentPhase;\n\ncurrentPhase = phaser.arriveAndWaitAdvance();\n\
    // Perform action here after all threads arrived\nphaser.arriveAndDeregister();\n\
    ```\n\nPhaser is particularly useful for scenarios where a set of threads need\
    \ to periodically synchronize with each other, exchanging data or combining results\
    \ from different computation stages.\n\n## 11.4 Working with Executors and Thread\
    \ Pools\n\n### 11.4.1 Executor Framework Basics\n\nThe Executor framework is a\
    \ high-level replacement for explicitly managing threads in applications. It provides\
    \ a layer of abstraction over explicit thread management by allowing you to execute\
    \ tasks asynchronously. The primary components include:\n\n- Executor: An interface\
    \ that represents an object that executes provided tasks.\n- Executors: A utility\
    \ class that provides factory methods for creating common kinds of executor services.\n\
    - Executor: An executor that provides methods to manage termination and methods\
    \ that can produce a Future for tracking progress of one or more asynchronous\
    \ tasks.\n\n# simple usage:\n\n```java\nExecutorService executor = Executors.newSingleThreadExecutor();\n\
    executor.submit(() -> {\n    // Task to be executed\n    System.out.println(\"\
    Asynchronous task\");\n});\nexecutor.shutdown();\n```\n\n### 11.4.2 Creating Fixed\
    \ and Cached Thread Pools\n\nFixed Thread Pool: A thread pool with a fixed number\
    \ of threads. If a thread is not available for the task, the task is put in a\
    \ queue waiting for other tasks to finish.\n\n```java\nExecutorService fixedThreadPool\
    \ = Executors.newFixedThreadPool(4);\nfixedThreadPool.execute(() -> System.out.println(\"\
    Task in fixed thread pool\"));\n```\n\nCached Thread Pool: A thread pool that\
    \ creates new threads as needed but reuse previously constructed\n\n```java\n\
    ExecutorService cachedThreadPool = Executors.newCachedThreadPool();\ncachedThreadPool.execute(()\
    \ -> System.out.println(\"Task in cached thread pool\"));\n```\n\n### 11.4.3 Scheduled\
    \ Executors for Task Execution\n\nScheduledExecutorService allows you to schedule\
    \ commands to run after a given delay or to execute periodically. This is useful\
    \ for implementing timeouts, heartbeats, or other timed behaviors.\n\n```java\n\
    ScheduledExecutorService scheduler = Executors.newScheduledThreadPool(1);\n\n\
    Runnable task = () -> System.out.println(\"Task executed after delay\");\nScheduledFuture<?>\
    \ scheduledFuture = scheduler.schedule(task, 5, TimeUnit.SECONDS);\n```\n\n###\
    \ 11.4.4 Customizing Thread Pool via ThreadPoolExecutor\n\nIf the executor services\
    \ provided by the Executors class don't meet your needs, you can create a ThreadPoolExecutor\
    \ directly and customize it. When creating a ThreadPoolExecutor, you can specify\
    \ core and maximum pool sizes, keep-alive time for idle threads, a blocking queue\
    \ for tasks waiting to be executed, and a thread factory to create new threads.\n\
    \n```java\nint corePoolSize = 2;\nint maxPoolSize = 4;\nlong keepAliveTime = 10;\n\
    \nThreadPoolExecutor executor = new ThreadPoolExecutor(\n  corePoolSize,\n  maxPoolSize,\n\
    \  keepAliveTime,\n  TimeUnit.SECONDS,\n  new LinkedBlockingQueue<Runnable>(),\n\
    \  Executors.defaultThreadFactory()\n);\n\nexecutor.execute(() -> System.out.println(\"\
    Task in custom thread pool\"));\n```\n\nThis allows for fine-tuned control over\
    \ thread behavior, resource allocation, and task scheduling, enabling optimized\
    \ performance for specific application requirements.\n\n## Advanced OOP Concepts\n\
    \n### 12.1 Abstract Classes and Methods\n\n 12.1.1 Introduction to Abstraction\n\
    \nAbstraction is a fundamental concept in Object-Oriented Programming (OOP) that\
    \ aims to hide complex implementation details and show only the necessary features\
    \ of an object. It helps in managing complexity by allowing programmers to think\
    \ at a higher level of logic. Abstraction can be achieved with either abstract\
    \ classes or interfaces in Java. An abstract class can have both abstract (methods\
    \ without bodies) and non-abstract methods, making it a powerful tool for sharing\
    \ a common design among related classes while allowing each to have its own unique\
    \ implementations of certain details.\n\n### 12.1.2 Defining Abstract Classes\n\
    \nAn abstract class in Java is declared using the abstract keyword. It cannot\
    \ be instantiated, meaning you cannot create objects directly from an abstract\
    \ class. However, you can create objects of concrete subclasses that inherit from\
    \ the abstract class. Abstract classes are used to provide a base template or\
    \ architectural plan for other classes to build upon.\n"
