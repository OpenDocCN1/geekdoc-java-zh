    # 5.4 Understanding Scope and Accessibility


    # 5.4.1 Scope of Variables in Methods


    The scope of a variable determines where within your code a variable can be accessed.
    Method variables (also known as local variables) are defined within a method and
    are only accessible within that method. They cease to exist once the method execution
    is completed. This limited scope helps reduce naming conflicts and memory usage
    since these variables are temporary.'
