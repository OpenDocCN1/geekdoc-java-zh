    \n## 7.4 多态的实应用\n\n多态是面向对象编程中的核心概念，允许根据执行操作的实际对象以不同的方式运行。它增强了灵活性并在不修改代码的情况下扩展代码的能力。Java\
    \ 中的多态有两种类型：静态（编译时）和动态（运行时）。\n\n### 7.4.1 演示静态和动态多态\n\n- *静态多态*通过方法重载实现。它发生在编译时。在静态多态中，响应是在编译时确定的。\n\
