    \n实现封装：在字段上使用 `private` 修饰符，并提供公共的 `public` getter 和 setter 方法来访问和更新值。\n\n```java\n\
    public class Encapsulated {\n    private int id;\n\n    // Getter\n    public\
    \ int getId() {\n        return id;\n    }\n\n    // Setter\n    public void setId(int\
    \ id) {\n        this.id = id;\n    }\n}\n```\n\n受保护的访问：`protected` 访问通常在继承的范围内使用。它允许子类访问父类的字段和方法，同时与\
    \ `public` 访问相比仍保持受限的级别。\n\n```java\npublic class Base {\n    protected int baseNumber;\n\
    }\n\npublic class Derived extends Base {\n    public void show() {\n        baseNumber\
    \ = 10; // 由于 protected 可以访问\n        System.out.println(\"Base number: \" + baseNumber);\n\
    \    }\n}\n```\n\n理解作用域和访问性的细微差别可以显著影响 Java 应用的设计和健壮性。\n\n## 6.1 面向对象编程基础\n\n\
    ### ### 面向对象编程简介\n\n面向对象编程（OOP）是一种基于“对象”概念的编程范式，对象以字段（通常称为属性）的形式包含数据，以方法的形式包含代码。OOP的核心概念包括：\n\
    \n- 类：创建对象的模板，定义了它们的结构和行为。\n- 对象：类的实例，代表特定的实体。\n- 继承：一种从现有类创建新类的机制，增强了代码的重用性。\n\
    - 多态：在不同的对象上调用同一个方法并让每个对象以其自己的方式做出响应的能力。\n- 封装：将数据和操作数据的方法封装在一个单元内，限制对某些组件的访问。\n\
    \n### 6.1.2 面向对象编程的优势\n\n- 模块化：对象的源代码可以独立与其他对象的源代码进行编写和维护。这使得管理大型应用程序变得更容易。\n\
    - 代码重用：通过继承，可以从现有类派生出新类，导致大量的代码重用。\n- 可扩展性：OOP 允许开发者通过增量添加对象来构建程序，使得处理更大的项目变得可行。\n\
    - 维护：通过封装，对象可以隐藏其内部状态并在不影响其他代码部分的情况下进行更改，从而有助于维护。\n- 设计：OOP 方法论鼓励规划和思维过程，从而实现更灵活、模块化和抽象的设计。\n\
    \n### 6.1.3 OOP 与 过程化编程\n\n虽然 OOP 对象和数据组织代码，但过程化编程以过程或例程为中心。主要区别包括：\n\n- 状态和行为：在\
    \ OOP 中，数据（状态）和操作（行为）被封装在一起，而在过程化编程中，过程对传递它们的数据进行操作。\n- 模块化和维护：OOP 为程序提供了更清晰的模块化结构，使得跟踪程序元素、增强它们和修复错误变得更容易。\n\
    - 可重用性和可扩展性：得益于继承和多态，面向对象的程序鼓励软件组件的重用，而这在过程化方法中是不太自然的。\n\n### 6.1.4 OOP 中的关键术语：类、对象、方法和属性\n\
    \n- 类：创建对象的蓝图。类定义了对象的初始状态以及对象可以采取的一系列动作（方法）。\n- 对象：类的实例。每个对象都有自己的实例。\n- 方法：与类相关的程序，定义对象可以执行的操作。\n\
    - 属性：对象的特征，描述对象的某些特性。\n\n这些基本概念和优势使得 OOP 成为设计软件的热门选择。\n\n## 6.2 类与对象的操作\n\n###\
    \ ### 6.2.1 在 Java 中定义类\n\n在 Java 中，类是创建对象的模板，包含属性和方法。类使用 `class` 关键字定义并在大括号内。\n\
    \n```java\npublic class Car {\n    // 类的属性\n    String model;\n    int year;\n\
    \n    // 类的方法\n    void displayInformation() {\n        System.out.println(\"\
    Model: \" + model + \", Year: \" + year);\n    }\n}\n```\n\nCar 类有两个属性（model 和\
    \ year）和一个方法（displayInformation）。\n\n### 6.2.2 创建和使用对象\n\n对象是使用 `new` 关键字创建的类的实例。一旦创建了对象就可以访问它的属性并调用它的方法。\n\
    \n```java\npublic class TestCar {\n    public static void main(String[] args)\
    \ {\n        // 创建 Car 对象\n        Car myCar = new Car();\n        myCar.model\
    \ = \"Toyota\";\n        myCar.year = 2020;\n\n        // 使用类的方法\n        myCar.displayInformation();\n\
    \    }\n}\n```\n\n### 6.2.3 实例变量和方法\n\n实例变量和方法属于类的实例。对于从类创建的每个对象都有自己的变量副本和使用方法的能力。要调用实例方法，我们需要使用\
    \ `new` 关键字创建一个对象。\n\n```java\npublic class Student {\n    String name; // 实例变量\n\
    \n    void introduce() { // 实例方法\n        System.out.println(\"Hi, my name is\
    \ \" + name);\n    }\n}\n```\n\n### 6.2.4 静态变量和方法\n\n静态变量和方法属于类而不是任何实例。这意味着可以在不创建类对象的情况下访问它们。\n\
    \n- 静态变量：也称为类变量，它们在类的实例之间共享。静态变量的任何更改都会反映在所有实例中。\n- 静态方法：无需创建对象即可调用的方法。它们可以访问静态变量并更改值。\n\
    \n```java\npublic class Counter {\n    static int count = 0; // 静态变量\n\n    static\
    \ void increment() { // 静态方法\n        count++;\n    }\n}\n```\n\n## 6.3 理解构造函数\n\
    \n### 6.3.1 Java 中构造函数的作用\n\n在 Java 中，构造函数是在实例化对象时调用的特殊方法。构造函数的名称与类名相同，且没有返回值（即使是\
    \ void）。构造函数的主要用途是在新创建的对象使用之前对其进行初始化，通常是为其字段分配初始值。\n\n"
