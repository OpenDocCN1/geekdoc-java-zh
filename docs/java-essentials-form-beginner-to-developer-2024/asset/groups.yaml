  - '[PAGE 15]


    # 1.4 Evolution of Java: Versions and Editions


    # 1.4.1 The Historical Journey of Java


    Java has come a long way since its inception. Initially conceived as a project
    named "Oak" by James Gosling at Sun Microsystems in 1991, it was designed for
    use in digital devices like set-top boxes and televisions. However, it was the
    rise of the internet that provided the perfect environment for Java to flourish.
    Officially released by Sun Microsystems as Java 1.0 in 1995, its promise of "Write
    Once, Run Anywhere" captured the imagination of developers worldwide. Over the
    years, Java has undergone significant evolutions, consistently adding new features
    and improvements with each version release.


    # 1.4.2 Java SE vs Java EE vs Java ME: Understanding the Differences


    Java technology is divided into several editions, each targeting different application
    environments and needs:


    +   * Java SE (Standard Edition): The foundation for Java programming, providing
    the core functionality of the Java programming language. It includes basic APIs
    for networking, UI, database access, security, and more.


    +   * Java EE (Enterprise Edition): Builds on Java SE and adds APIs for enterprise
    features such as distributed computing and web services. Java EE is designed for
    developing large-scale, multi-tiered, scalable, reliable, and secure network applications.'
  - '[PAGE 16]


    Java ME (Micro Edition): Optimized for mobile and embedded devices with limited
    resources, Java ME provides a robust, flexible environment for applications running
    on these devices.


    # 1.4.3 Highlights and Features from Java 1 to the Latest Version


    Java''s evolution is marked by significant additions and improvements with each
    version. Here are some highlights:


    +   - Java 1.0 (1996): The beginning, introducing the Java language with features
    like garbage collection and the JVM for portability.

    - Java 5 (2004): Introduced major enhancements, including generics, metadata annotations,
    the enhanced loop, autoboxing/unboxing, and the concurrency utilities.

    - Java 8 (2014): A landmark release that introduced lambda expressions, the stream
    API for bulk data operations on collections, and new date/time API.

    - Java 11 (2018): The first long-term support (LTS) version after Java 8, bringing
    new features like local-variable syntax for lambda parameters, HTTP Client API,
    and more.

    - Java 17 (2021): The latest LTS version as of my last update, introducing sealed
    classes, pattern matching for instanceof, and deprecating the Applet API.


    # 1.4.4 How to Keep Up-to-Date with Java Developments


    Stay informed about Java developments through:


    +   - Official Java Blog and Mailing Lists: Subscribe to receive the latest news
    and updates.'
  - '[PAGE 17]


    +   - Java Community Process (JCP): Participate or follow the JCP to see future
    directions and proposals for Java.

    - Developer Conferences: Attend Java conferences, such as Oracle One or local
    Java user group meetings.

    - Follow Experts and Influencers: Social media platforms and personal blogs of
    Java thought leaders can be a great source of insights.


    # Setting Up Your Java Environment


    # 2.1 Configuring System Environment Variables


    # 2.1.1 Introduction to Environment Variables for Java


    Environment variables in computing are dynamic values that affect the behavior
    of running processes on a computer. They can specify data like the location of
    system files, or settings for software applications. For Java development, setting
    environment variables is crucial because they direct where the Java compiler (javac)
    and Java runtime (java) can be found. This allows developers to run Java commands
    from the command line from any directory without having to specify the full path
    to the Java executables.


    # 2.1.2 Setting JAVA_HOME and Updating the PATH


    Setting JAVA_HOME: The JAVA_HOME environment variable points to the installation
    directory of the JDK. This variable is used by applications to find the Java libraries.'
  - '[PAGE 18]


    +   1. Right-click on ''My Computer'' and select ''Properties''.


    +   2. Navigate to ''Advanced system settings'' > ''Environment Variables''.


    +   3. Click ''New'' to create a new environment variable. Name it JAVA_HOME and
    set its value to the JDK installation path (e.g., C:\Program Files\Java\jdk-17).
    ● macOS/Linux:


    +   1. Open the Terminal.


    +   2. Edit your shell profile file (.bash_profile, .bashrc, .zshrc etc.). For
    example, you can open it with nano ~/.bashrc.


    +   3. Add this line: export JAVA_HOME=$(/usr/libexec/java_home).


    +   4. Save the changes and close the editor.


    Updating the PATH: To easily run Java executables from the command line, add the
    JDK''s bin directory to the system PATH.


    +   ● Windows: Follow the steps to get to the ''Environment Variables'' as above,
    then find the PATHvariable and select ''Edit''. Append the path to the JDK''s
    bin directory (e.g., C:\Program Files\Java\jdk-17).


    +   ● macOS/Linux: Open the shell profile file as before and add the line: export
    PATH=$PATH:$JAVA_HOME/bin.


    # 2.1.3 Verifying the Configuration in Windows, macOS, and Linux


    After setting JAVA_HOME and updating the PATH, verify the configuration:'
  - '[PAGE 19]


    +   - Open a new terminal or command prompt (changes might not apply to already
    opened terminals).

    - Type `java -version` and `javac -version`. If the installations were successful,
    you should see the installed Java versions for each command.


    Windows:


    +   - If the configuration was incorrect, java or javac commands might be unrecognized.
    Double-check the environment variables in the system settings.


    macOS/Linux:


    +   - Ensure you''ve saved the changes to your profile file and sourced the file
    with `source ~/.bashrc` or reopened the terminal. If the commands are not recognized,
    review the paths set in the environment variables.


    Correctly configuring these environment variables simplifies Java development,
    making it easy to compile and run Java applications from any directory via the
    command line.


    # 2.2 Integrating Build Tools with Your IDE


    # 2.2.1 Overview of Build Tools: Maven and Gradle


    Maven and Gradle are two of the most popular build automation tools used in Java
    development. They help in project creation, dependency management, and build lifecycle
    management.


    +   - Maven is known for its use of XML-based pom.xml (Project Object Model) files
    to'
  - '[PAGE 20]


    define project structures and dependencies. It follows a convention-overconfiguration
    approach, which simplifies project setup but can be less flexible for complex
    configurations.


    +   - Gradle, on the other hand, uses a Groovy-based DSL (Domain Specific Language)
    for its configuration scripts (build.gradle files), offering more programmability
    and flexibility. Gradle''s performance is often cited as a benefit, particularly
    its incremental builds feature that makes it faster than Maven in many cases.


    Both tools integrate with popular IDEs like Eclipse and IntelliJ IDEA, providing
    developers with powerful and efficient development environments.


    # 2.2.2 Setting Up Maven in Eclipse and IntelliJ IDEA


    Maven in Eclipse:


    +   1. Eclipse comes with Maven integration in most recent editions. To create
    a new Maven project, go to File > New > Other... > Maven > Maven Project.

    2. Follow the wizard to specify the group ID, artifact ID, and archetype for your
    project.


    Maven in IntelliJ IDEA:


    +   1. Open IntelliJ IDEA, navigate to File > New > Project.

    2. Choose Maven from the options on the left. IntelliJ IDEA will prompt you to
    specify the project''s SDK (Software-Development Kit) and other Maven-specific
    parameters, like GroupId and ArtifactId.'
  - '[PAGE 21]


    Both IDEs automatically handle the dependency resolution based on the pom.xml
    file without needing manual downloads and library configurations.


    # 2.2.3 Configuring Gradle in Your Java Project


    Setting Up Gradle does not substantially differ across IDEs since both Eclipse
    and IntelliJ IDEA offer good support for Gradle.


    In Eclipse:


    +   1. You''ll need to install the Buildship Gradle Integration plugin if it isn''t
    already included in your Eclipse edition. This can be done via the Eclipse Marketplace.

    2. To create a new Gradle project, go to File > New > Other... > Gradle > Gradle
    Project and follow the wizard.


    In IntelliJ IDEA:


    +   1. IntelliJ IDEA comes with out-of-the-box support for Gradle. To start a
    new Gradle project, simply navigate to File > New > Project, then select Gradle
    from the left sidebar.

    2. IntelliJ IDEA will ask you to define the GroupID, ArtifactId, and other options
    similar to setting up a Maven project.'
  md: "\n## 1.4 Evolution of Java: Versions and Editions\n\n### 1.4.1 The Historical\
    \ Journey of Java\n\nJava has come a long way since its inception. Initially conceived\
    \ as a project named \"Oak\" by James Gosling at Sun Microsystems in 1991, it\
    \ was designed for use in digital devices like set-top boxes and televisions.\
    \ However, it was the rise of the internet that provided the perfect environment\
    \ for Java to flourish. Officially released by Sun Microsystems as Java 1.0 in\
    \ 1995, its promise of \"Write Once, Run Anywhere\" captured the imagination of\
    \ developers worldwide. Over the years, Java has undergone significant evolutions,\
    \ consistently adding new features and improvements with each version release.\n\
    \n### 1.4.2 Java SE vs Java EE vs Java ME: Understanding the Differences\n\nJava\
    \ technology is divided into several editions, each targeting different application\
    \ environments and needs:\n\n- Java SE (Standard Edition): The foundation for\
    \ Java programming, providing the core functionality of the Java programming language.\
    \ It includes basic APIs for networking, UI, database access, security, and more.\n\
    - Java EE (Enterprise Edition): Builds on Java SE and adds APIs for enterprise\
    \ features such as distributed computing and web services. Java EE is designed\
    \ for developing large-scale, multi-tiered, scalable, reliable, and secure network\
    \ applications.\n- Java ME (Micro Edition): Optimized for mobile and embedded\
    \ devices with limited resources, Java ME provides a robust, flexible environment\
    \ for applications running on these devices.\n\n### 1.4.3 Highlights and Features\
    \ from Java 1 to the Latest Version\n\nJava's evolution is marked by significant\
    \ additions and improvements with each version. Here are some highlights:\n\n\
    - Java 1.0 (1996): The beginning, introducing the Java language with features\
    \ like garbage collection and the JVM for portability.\n- Java 5 (2004): Introduced\
    \ major enhancements, including generics, metadata annotations, the enhanced loop,\
    \ autoboxing/unboxing, and the concurrency utilities.\n- Java 8 (2014): A landmark\
    \ release that introduced lambda expressions, the stream API for bulk data operations\
    \ on collections, and new date/time API.\n- Java 11 (2018): The first long-term\
    \ support (LTS) version after Java 8, bringing new features like local-variable\
    \ syntax for lambda parameters, HTTP Client API, and more.\n- Java 17 (2021):\
    \ The latest LTS version as of my last update, introducing sealed classes, pattern\
    \ matching for instanceof, and deprecating the Applet API.\n\n### 1.4.4 How to\
    \ Keep Up-to-Date with Java Developments\n\nStay informed about Java developments\
    \ through:\n\n- Official Java Blog and Mailing Lists: Subscribe to receive the\
    \ latest news and updates.\n- Java Community Process (JCP): Participate or follow\
    \ the JCP to see future directions and proposals for Java.\n- Developer Conferences:\
    \ Attend Java conferences, such as Oracle One or local Java user group meetings.\n\
    - Follow Experts and Influencers: Social media platforms and personal blogs of\
    \ Java thought leaders can be a great source of insights.\n\n## Setting Up Your\
    \ Java Environment\n\n## 2.1 Configuring System Environment Variables\n\n### 2.1.1\
    \ Introduction to Environment Variables for Java\n\nEnvironment variables in computing\
    \ are dynamic values that affect the behavior of running processes on a computer.\
    \ They can specify data like the location of system files, or settings for software\
    \ applications. For Java development, setting environment variables is crucial\
    \ because they direct where the Java compiler (javac) and Java runtime (java)\
    \ can be found. This allows developers to run Java commands from the command line\
    \ from any directory without having to specify the full path to the Java executables.\n\
    \n### 2.1.2 Setting JAVA_HOME and Updating the PATH\n\nSetting JAVA_HOME: The\
    \ JAVA_HOME environment variable points to the installation directory of the JDK.\
    \ This variable is used by applications to find the Java libraries.\n\n- Windows:\n\
    \  1. Right-click on 'My Computer' and select 'Properties'.\n  2. Navigate to\
    \ 'Advanced system settings' > 'Environment Variables'.\n  3. Click 'New' to create\
    \ a new environment variable. Name it JAVA_HOME and set its value to the JDK installation\
    \ path (e.g., C:\\Program Files\\Java\\jdk-17).\n- macOS/Linux:\n  1. Open the\
    \ Terminal.\n  2. Edit your shell profile file (.bash_profile, .bashrc, .zshrc\
    \ etc.). For example, you can open it with nano ~/.bashrc.\n  3. Add this line:\
    \ export JAVA_HOME=$(/usr/libexec/java_home).\n  4. Save the changes and close\
    \ the editor.\n\nUpdating the PATH: To easily run Java executables from the command\
    \ line, add the JDK's bin directory to the system PATH.\n\n- Windows: Follow the\
    \ steps to get to the 'Environment Variables' as above, then find the PATH variable\
    \ and select 'Edit'. Append the path to the JDK's bin directory (e.g., C:\\Program\
    \ Files\\Java\\jdk-17).\n- macOS/Linux: Open the shell profile file as before\
    \ and add the line: export PATH=$PATH:$JAVA_HOME/bin.\n\n### 2.1.3 Verifying the\
    \ Configuration in Windows, macOS, and Linux\n\nAfter setting JAVA_HOME and updating\
    \ the PATH, verify the configuration:\n\n- Open a new terminal or command prompt\
    \ (changes might not apply to already opened terminals).\n- Type `java -version`\
    \ and `javac -version`. If the installations were successful, you should see the\
    \ installed Java versions for each command.\n\nWindows:\n- If the configuration\
    \ was incorrect, java or javac commands might be unrecognized. Double-check the\
    \ environment variables in the system settings.\n\nmacOS/Linux:\n- Ensure you've\
    \ saved the changes to your profile file and sourced the file with `source ~/.bashrc`\
    \ or reopened the terminal. If the commands are not recognized, review the paths\
    \ set in the environment variables.\n\nCorrectly configuring these environment\
    \ variables simplifies Java development, making it easy to compile and run Java\
    \ applications from any directory via the command line.\n\n## 2.2 Integrating\
    \ Build Tools with Your IDE\n\n### 2.2.1 Overview of Build Tools: Maven and Gradle\n\
    \nMaven and Gradle are two of the most popular build automation tools used in\
    \ Java development. They help in project creation, dependency management, and\
    \ build lifecycle management.\n\n- Maven is known for its use of XML-based pom.xml\
    \ (Project Object Model) files to define project structures and dependencies.\
    \ It follows a convention-over-configuration approach, which simplifies project\
    \ setup but can be less flexible for complex configurations.\n- Gradle, on the\
    \ other hand, uses a Groovy-based DSL (Domain Specific Language) for its configuration\
    \ scripts (build.gradle files), offering more programmability and flexibility.\
    \ Gradle's performance is often cited as a benefit, particularly its incremental\
    \ builds feature that makes it faster than Maven in many cases. Both tools integrate\
    \ with popular IDEs like Eclipse and IntelliJ IDEA, providing developers with\
    \ powerful and efficient development environments.\n\n### 2.2.2 Setting Up Maven\
    \ in Eclipse and IntelliJ IDEA\n\nMaven in Eclipse:\n1. Eclipse comes with Maven\
    \ integration in most recent editions. To create a new Maven project, go to File\
    \ > New > Other... > Maven > Maven Project.\n2. Follow the wizard to specify the\
    \ group ID, artifact ID, and archetype for your project.\n\nMaven in IntelliJ\
    \ IDEA:\n1. Open IntelliJ IDEA, navigate to File > New > Project.\n2. Choose Maven\
    \ from the options on the left. IntelliJ IDEA will prompt you to specify the project's\
    \ SDK (Software-Development Kit) and other Maven-specific parameters, like GroupId\
    \ and ArtifactId.\n\nBoth IDEs automatically handle the dependency resolution\
    \ based on the pom.xml file without needing manual downloads and library configurations.\n\
    \n### 2.2.3 Configuring Gradle in Your Java Project\n\nSetting Gradle does not\
    \ substantially differ across IDEs since both Eclipse and IntelliJ IDEA offer\
    \ good support for Gradle.\n\nIn Eclipse:\n1. You'll need to install the Buildship\
    \ Gradle Integration plugin if it isn't already included in your Eclipse edition.\
    \ This can be done via the Eclipse Marketplace.\n2. To create a new Gradle project,\
    \ go to File > New > Other... > Gradle > Gradle Project and follow the wizard.\n\
    \nIn IntelliJ IDEA:\n1. IntelliJ IDEA comes with out-of-the-box support for Gradle.\
    \ To start a new Gradle project, simply navigate to File > New > Project, then\
    \ select Gradle from the left sidebar.\n2. IntelliJ IDEA will ask you to define\
    \ the GroupID, ArtifactId, and other options.\n"
  mdcn: "\n\n## 1.4 Java 的演变：版本与发行\n\n### 1.4.1 Java 的历史历程\n\nJava 自诞生以来已经走了很长的道路。它最初由\
    \ James Gosling 在 1991 年于 Sun Microsystems 公司构思为一个名为“Oak”的项目，设计初衷是用于机顶盒和电视机等数字设备。然而，互联网的兴起为\
    \ Java 的繁荣提供了完美的环境。Sun Microsystems 于 1995 年正式发布了 Java 1.0，其“编写一次，处运行”（Write Once,\
    \ Run Anywhere）的承诺吸引了全球开发者的想象。多年来，Java 经历了重大的演变，每个版本都不断添加新功能并改进。\n\n### 1.4.2\
    \ Java SE vs Java EE Java ME 的区别\n\nJava 技术分为几个版本，针对不同的应用环境和需求：\n\n- **Java SE\
    \ (标准版)**：Java 编程的基础，提供了核心功能，包括用于 UI、数据库访问、安全等基础 API。\n- **Java EE (企业版)**：基于\
    \ Java SE 之上，增加了用于开发大规模、多层、可扩展且安全网络应用程序的企业级 API。\n- **Java ME (微型版)**：针对移动和嵌入式设备进行了优化，提供了健壮且灵活的\
    \ Java 环境。\n\n### 1.4.3 从 Java 到最新版本的亮点与特性\n\nJava 的演变以每个版本的重大新增和改进为标志。以下是一些亮点：\n\
    \n- **Java 1.0 (1996)**：起点，引入了带有垃圾回收等特性的 Java 语言。\n- **Java 5 (2004)**：引入了重大增强，包括泛型（generics）、注解、自动装箱/拆箱（autoboxing/unboxing）以及并发工具。\n\
    - **Java 8 (2014)**：里程碑式的发布，引入了 Lambda 表达式、Stream API 以及日期/时间 API。\n- **Java 11\
    \ (2018)**：第一个长期支持（LTS）版本，带来了新特性如本地变量语法、HTTP Client API 以及更多。\n- **Java 17 (2021)**：最新的\
    \ LTS 版本，引入了密封类（sealed classes）、模式匹配（pattern matching）以及废弃了 Applet API。\n\n###\
    \ 1.4.4 如何关注 Java 动态\n\n通过以下渠道获取 Java 动态信息：\n\n- **Java 官方博客和邮件列表**：订阅以接收新闻和更新。\n\
    - **Java 社区进程 (JCP)**：参与 JCP 以查看未来的方向和提案。\n- **开发者大会**：参加 Oracle One 或本地 Java\
    \ 用户组会议。\n- **关注专家和影响者**：社交媒体平台和 Java 意见领袖是见解的好来源。\n\n## 设置你的 Java 环境\n\n## 2.1\
    \ 配置环境变量\n\n### 2.1.1 Java 环境变量简介\n\n计算中的环境变量是影响计算机运行进程行为的动态值。它们可以指定系统文件的位置或软件设置。对于\
    \ Java 开发，设置环境变量至关重要，因为它们指导哪里寻找 Java 编译器（javac）和 Java 运行时（java）。这允许开发者从任何目录运行\
    \ Java 命令，而无需指定 Java 可执行文件的完整路径。\n\n### 2.1.2 设置 JAVA_HOME 和更新 PATH\n\n**设置 JAVA_HOME**：JAVA_HOME\
    \ 环境变量指向 JDK 的安装目录。应用程序使用此变量来查找 Java 库。\n\n- **Windows**：\n  1. 右键点击“此电脑”并选择“属性”。\n\
    \  2. 导航到“高级系统设置” > “环境变量”。\n  3. 点击“新建”创建一个新的环境变量。命名为 `JAVA_HOME` 并将其值设置为 JDK\
    \ 安装路径（例如：`C:\\Program Files\\Java\\jdk-17`）。\n- **macOS/Linux**：\n  1. 打开终端。\n\
    \  2. 编辑你的 shell 配置文件（`.bash_profile`, `.bashrc`, `.zshrc` 等）。例如，你可以用 `nano ~/.bashrc`\
    \ 打开它。\n  3. 添加此行：`export JAVA_HOME=$(/usr/libexec/java_home)`。\n  4. 保存更改并关闭编辑器。\n\
    \n**更新 PATH**：为了从命令行方便运行 Java 可执行文件，将 JDK 的 `bin` 目录添加到系统的 PATH 中。\n\n- **Windows**：按照上述步骤进入“环境变量”，找到\
    \ `PATH` 变量并选择“编辑”。追加 JDK 的 `bin` 目录路径（例如：`C:\\Program Files\\Java\\jdk-17`）。\n\
    - **macOS/Linux**：像之前一样打开 shell 配置文件，并添加行：`export PATH=$PATH:$JAVA_HOME/bin`。\n\
    \n### 2.1.3 在 Windows、macOS 和 Linux 中验证配置\n\n设置 JAVA_HOME 并更新 PATH 后，验证配置情况：\n\
    \n- 打开一个新的终端或命令提示符（更改可能不会应用于已打开的终端）。\n- 输入 `java -version` 和 `javac -version`。如果安装成功，你应该能看到每个命令对应的已安装\
    \ Java 版本。\n\n**Windows**：\n- 如果配置错误，`java` 或 `javac` 命令可能无法识别。请双检查系统设置中的环境变量。\n\
    \n**macOS/Linux**：\n- 确保你已将更改保存到配置文件，并通过 `source ~/.bashrc` 刷新文件或重新打开终端。如果命令无法识别，请检查环境变量中设置的路径。\n\
    \n正确配置这些环境变量可以简化 Java 开发，使其能够通过命令行从任何目录编译和运行 Java 应用程序。\n\n## 2.2 将构建工具集成到你的 IDE\n\
    \n### 2.2.1 构建工具概览：Maven 和 Gradle\n\nMaven 和 Gradle 是 Java 开发中最常用的两种构建自动化工具。它们帮助进行项目创建、依赖管理和构建生命周期管理。\n\
    \n- **Maven**：以使用基于 XML 的 `pom.xml`（项目对象模型）文件闻名。它遵循“约定优于配置”的方法，简化了项目设置，但在复杂配置上灵活性较低。\n\
    - **Gradle**：另一方面，它使用基于 Groovy 的配置脚本（`build.gradle` 文件），提供了更高的可性和灵活性。Gradle 的性能常被视为其优势，在许多情况下比\
    \ Maven 更快。两种工具都与 Eclipse 和 IntelliJ IDEA 等主流 IDE 集成。\n\n### 2.2.2 在 Eclipse 和\
    \ IntelliJ 中设置 Maven\n\n**在 Eclipse 中**：\n1. Eclipse 的最新版本都集成了 Maven。要创建一个新的 Maven\
    \ 项目，前往 `File > New > Other... > Maven > Maven Project`。\n2. 按照向导指定 Group ID、Artifact\
    \ ID 和架构。\n\n**在 IntelliJ IDEA 中**：\n1. 打开 IntelliJ IDEA，导航到 `File > New > Project`。\n\
    2. 在左侧选择 Maven。IntelliJ IDEA 会提示你指定项目的 SDK（软件开发工具包）以及其他 Maven 参数。\n\n两个 IDE 会根据\
    \ `pom.xml` 文件自动处理依赖解析，无需手动下载和配置库。\n\n### 2.2.3 在你的 Java 项目中配置 Gradle\n\n不同 IDE\
    \ 配置 Gradle 的差异不大，因为 Eclipse 和 IntelliJ IDEA 对 Gradle 都提供了良好的支持。\n\n**在 Eclipse\
    \ 中**：\n1. 如果你的 Eclipse 版本未包含，你需要安装 Buildship Gradle Integration 插件。可以通过 Eclipse\
    \ Marketplace 进行。\n2. 要创建一个新的 Gradle 项目，前往 `File > New > Other... > Gradle > Gradle\
    \ Project` 并按照向导操作。\n\n**在 IntelliJ IDEA 中**：\n1. IntelliJ IDEA 内置了 Gradle 支持。要启动一个新的\
    \ Gradle 项目，只需导航到 `File > New > Project`，然后从左侧栏选择 Gradle。\n\n"
