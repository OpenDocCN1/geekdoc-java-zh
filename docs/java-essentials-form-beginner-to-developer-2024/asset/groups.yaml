    Explicit Casting (Narrowing Conversion): This is needed when you''re assigning
    a larger sized type to a smaller sized type, like a double to an int. It requires
    the use of a cast operator.


    Converting Between Data Types Conversion between data types may be necessary to
    perform operations involving values of different types. When converting, be mindful
    of the potential for data loss (with narrowing conversions) and ensure that conversions
    are necessary and intentional to maintain the accuracy and integrity of your data.


    # 3.2 Delving into Operators and Expressions


    # 3.2.1 Arithmetic Operators


    Basic Operations: Addition, Subtraction, etc. Java provides several arithmetic
    operators to perform common mathematical operations:


    +   + (Addition): Combines two values.

    - (Subtraction): Subtracts one value from another.

    * (Multiplication): Multiplies two values.

    * / (Division): Divides one value by another. If both operands are integers, the
    result will also be an integer, discarding any remainder.

    * % (Modulus Operator): Returns the remainder of a division operation.'
