    \ such as web servers.\n\n### 10.2.2 Buffers: The Core of NIO\n\nBuffers are a\
    \ core concept in NIO, representing a contiguous block of memory where data is\
    \ temporarily stored during I/O operations. Unlike streams in the traditional\
    \ I/O model, which process data in a linear, sequential manner, buffers allow\
    \ data to be read and written randomly. Buffers in Java NIO are typed; i.e., there\
    \ are separate buffer classes for different data types as ByteBuffer, CharBuffer,\
    \ IntBuffer, etc. These buffers operate under a flip mechanism where the buffer\
    \ switches from writing mode to reading mode, ensuring efficient data access and\
    \ manipulation.\n\n### 10.2.3 Channels: A New Way to Handle IO\n\nChannels can\
    \ be thought of as conduits through which data is transferred between buffers\
    \ and the external entity (e.g., a file or a network socket). They provide a unified\
    \ API for managing various types of I/O operations like reading from and writing\
    \ to files, as well as network communications. The primary channel types include\
    \ FileChannel for I/O, SocketChannel for TCP network I/O, and DatagramChannel\
    \ for UDP network I/O. In contrast to streams, channels support both reading and\
    \ writing on the same instance, facilitating more versatile and powerful data\
    \ handling capabilities.\n\n### 10.2.4 Selector: Multiplexing with NIO\n\nThe\
    \ Selector component is a mechanism allowing a single thread to monitor multiple\
    \ channels for events, such as data arrival, connection openings, or readiness\
    \ for reading/writing. This capability enables the development of highly scalable\
    \ network applications that do not require a thread per connection, significantly\
    \ reducing resource consumption and increasing performance. By registering multiple\
    \ channels with a selector, an application can efficiently manage thousands of\
    \ open connections in a non-blocking manner, checking for I/O events and handling\
    \ them as they occur. This is particularly useful for implementing servers that\
    \ handle many concurrent connections, such as web or application servers.\n\n\
    Java NIO's introduction of buffers, channels, and selectors marked a significant\
    \ enhancement in Java's I/O capabilities, providing developers with the tools\
    \ to build highly scalable and efficient networking and file I/O applications.\
    \ The shift from a stream-based to a buffer-oriented model allows more control\
    \ and flexibility in how data is processed, making Java NIO an essential component\
    \ in modern Java application development.\n\n## 10.3 Reading and Writing Files\
    \ in Java\n\n### 10.3.1 Using FileInputStream and FileOutputStream\n\nInputStream\
    \ and FileInputStream are classes from the java.io package designed for reading\
    \ from and writing files as streams of bytes, making them highly effective for\
    \ handling binary data such as images and executable files.\n\n- FileInputStream:\
    \ It's used for reading data from files. Data is read in byte format, meaning\
    \ it reads data by byte byte, making it suitable for reading binary files.\n\n\
    ```java\nFileInputStream fis = new FileInputStream(\"example.txt\");\nint i;\n\
    while ((i = fis.read()) != -1) {\n    System.out.print((char) i);\n}\nfis.close();\n\
    ```\n\n- OutputStream: This class is utilized for writing data to files. Like\
    \ FileInputStream, it operates on data byte by byte. It's especially useful for\
    \ writing binary data to a file.\n\n```java\nFileOutputStream fos = new FileOutputStream(\"\
    output.txt\");\nString data = \"Hello World!\";\nfos.write(data.getBytes());\n\
    fos.close();\n```\n\n### 10.3.2 Reader and Writer Classes\n\nFor character-oriented\
    \ data (like text files), Java provides Reader and Writer abstract classes within\
    \ the java.io package.\n\n- FileReader and FileWriter are subclasses for reading\
    \ and writing character files. Unlike byte streams (FileInputStream/FileOutputStream),\
    \ these are designed to handle characters, which makes them perfect for dealing\
    \ with text file.\n\n### 10.3.3 Using NIO Files Class for Efficient IO\n\nThe\
    \ Files class in the java.nio.file package offers a set of static methods to operate\
    \ on files and directories. These methods are designed to use Path objects, making\
    \ file operations more efficient and simpler to perform.\n\n- Reading a file:\n\
    \n```java\nPath path = Paths.get(\"example.txt\");\nbyte[] fileArray = Files.readAllBytes(path);\n\
    ```\n\n- Writing to a file:\n\n```java\nPath newPath = Paths.get(\"newfile.txt\"\
    );\nbyte[] data = \"Sample text\".getBytes();\nFiles.write(newPath, data, StandardOpenOption.CREATE);\n\
    ```\n\n### 10.3.4 Path and Paths: NIO 2 Enhancements\n\nIntroduced in Java 7,\
    \ the NIO.2 file API added the Path interface and Paths utility class to provide\
    \ a more comprehensive approach for handling file systems.\n\n- Path: Represents\
    \ a system-dependent file path. It is an object that may be used to locate a file\
    \ in a file system. It offers methods to inspect, locate, and manipulate file\
    \ system objects.\n\n- Paths: A utility class that contains static methods to\
    \ return a Path by converting a path string or URI.\n\nAdopting the NIO Files\
    \ class and the Path/Paths interfaces can lead to more readable and maintainable\
    \ code for file I/O operations, offering advanced functionalities like symbolic\
    \ links handling, file attribute access, and directory walking, which are not\
    \ directly available through the traditional I/O streams.\n\n## 10.4 Understanding\
    \ Byte Streams and Character Streams\n\n### 10.4.1 Difference Between Byte Streams\
    \ and Character Streams\n\nJava I/O streams are categorized into two main types:\
    \ byte streams and character streams. Byte streams (InputStream and OutputStream\
    \ subclasses) are primarily used for handling raw binary data, such as image files,\
    \ audio files, and serialized objects. They read and write data byte by byte.\
    \ Character streams (Reader and writer subclasses), on the other hand, are designed\
    \ for handling character data, like text files. They read and write data character\
    \ by character, automatically handling character encoding and decoding, thus abstracting\
    \ the complexity of converting between characters and bytes.\n\n### 10.4.2 When\
    \ to Use Byte Streams Over Character Streams\n\nByte streams should be used when\
    \ dealing with raw data or binary files where data does not necessarily represent\
    \ characters. Examples include:\n\n- Reading or writing binary files (e.g., images,\
    \ videos).\n- Working with serialized objects.\n- Interacting with data streams\
    \ that come from sources or go to destinations that do\n"
  mdcn: "\n写入：向文件写入同样灵活。`FileOutputStream` 和 `FileWriter` 分别适用于二进制数据和字符数据。对于追加数据，这些类的构造函数接受一个布尔参数，用以指示内容是否应该追加到文件末尾。\n\
    \n追加：当你想向文件的现有内容添加内容而不覆盖它时，可以使用支持追加模式的构造函数或方法。在 NIO 中，`Files.write(Path, byte[],\
    \ StandardOpenOption.APPEND)` 方法方便了这种操作。\n\n## 10.1.4 Try-with-Resources 和 AutoCloseable\
    \ 接口\n\n文件处理和流操作中的一个重要关注的问题是确保资源在使用后被正确关闭，以防止资源泄漏。Java 7 引入的 `try-with-resources`\
    \ 语句简化了这项任务。它在语句执行结束时自动管理资源的关闭。为了与该语句兼容，资源必须实现 `AutoCloseable` 接口，该接口包含了几乎所有的流和相关资源。以下其用法的一个简洁示例：\n\
    \n在这个示例中，`FileReader` 是一个实现了 `AutoCloseable` 的资源。一旦退出 `try` 块（无论是正常退出还是由于异常），它都会被自动关闭，显著减少了样板代码并最小化了资源泄漏的风险。\n\
    \n## 10.2 NIO 包\n\n### 10.2.1 Java NIO 简介\n\nJava NIO（新输入/输出）在 Java 1.4 中引入，作为标准\
    \ Java I/O API 的替代和补充。它提供了非阻塞 IO 操作、面向缓冲区的数据处理方法，以及通过单个线程管理多个网络连接的能力。NIO 的核心组件包括通道（Channels）、缓冲区（Buffers）、选择器（Selectors）和字符集，能够实现更快速、更具扩展性的\
    \ I/O 操作，特别是对于需要同时管理大量连接的应用程序（例如 Web 服务器）。\n\n### 10.2.2 缓冲区：NIO 的核心\n\n缓冲区（Buffers）是\
    \ NIO 中的核心概念，代表一段连续的内存块，数据在 I/O 操作期间临时存储。与传统 I/O 模型中以线性、顺序方式处理数据的流不同，缓冲区允许对数据进行随机读写。Java\
    \ NIO 中的缓冲区是类型类型的；也就是说，不同的数据类型有对应的缓冲区类，如 `ByteBuffer`、`CharBuffer`、`IntBuffer`\
    \ 等。这些缓冲区在 `flip` 机制下工作，即缓冲区从写模式切换到读模式，确保了高效的数据访问和处理。\n\n### 10.2.3 通道：处理 IO 的新方式\n\
    \n通道（Channels）可以被认为是管道，数据在缓冲区和外部实体（例如文件或网络套接字）之间传输。它们提供了一个统一的 API 来管理各种类型的 I/O\
    \ 操作，如从文件读写数据以及网络通信。主要的通道类型包括用于 I/O 的 `FileChannel`、用于 TCP 网络 I/O 的 `SocketChannel`\
    \ 以及用于 UDP 网络 I/O 的 `DatagramChannel`。与流相比，通道支持在同一个实例上同时进行读取和写入，从而提供了更灵活、更强大的数据处理能力。\n\
    \n### 10.2.4 选择器：使用 NIO 进行多路复用\n\n选择器（Selector）组件是一种机制允许单个线程监控多个通道的事件，例如数据到达、连接打开或读/写就绪。这种能力使得开发高可扩展性的网络应用程序成为可能，而无需为每个连接分配一个线程，显著减少了资源消耗并提高了性能。通过向选择器注册多个通道，应用程序可以以非阻塞的方式高效地管理数个打开连接，检查\
    \ I/O 事件并在事件发生时进行处理。这对于处理许多并发连接的服务器（如 Web 服务器或应用服务器）特别有用。\n\nJava NIO 引入缓冲区、通道和选择器标志着\
    \ Java I/O 能力的重大增强，为开发者提供了构建高可扩展且高效的网络和文件 I/O 应用程序的工具。从基于流的模型转向面向缓冲区的模型，使得数据处理方式具有更多的控制和灵活性，使\
    \ Java NIO 成为现代 Java 应用开发中不可或缺的组件。\n\n## 10.3 在 Java 中读写文件\n\n### 读写文件\n\n###\
    \ 10.3.1 使用 FileInputStream 和 FileOutputStream\n\n`FileInputStream` 和 `FileOutputStream`\
    \ 是用于读取和写入文件的类。\n\n- `FileInputStream`：它是用于读取文件的。它按字节读取，非常适合处理二进制数据。\n\n```java\n\
    FileInputStream fis = new FileInputStream(\"example.txt\");\nint i;\nwhile ((i\
    \ = fis.read()) != -1) {\n    System.out.print((char) i);\n}\nfis.close();\n```\n\
    \n- `FileOutputStream`：它是用于写入文件的。类似于 `FileInputStream`，它按字节操作，特别适合处理二进制数据。\n\n\
    ```java\nFileOutputStream fos = new FileOutputStream(\"output.txt\");\nString\
    \ data = \"Hello World!\";\nfos.write(data.getBytes());\nfos.close();\n```\n\n\
    ### 10.3.2 Reader 和 Writer 类\n\n对于字符数据（如文本文件），Java 提供了 `Reader` 和 `Writer` 类。\n\
    \n- `FileReader` 和 `FileWriter`：这些是用于读取和写入字符文件的类。与字节流不同，它们设计用于处理字符。\n\n### 10.3.3\
    \ 使用 Files 类\n\n`java.nio` 包中的 `Files` 类提供了一组操作文件和目录的静态方法，这些方法使用 Path 对象。\n\n\
    - 读取文件：\n\n```java\nPath path = Paths.get(\"example.txt\");\nbyte[] fileArray\
    \ = Files.readAllBytes(path);\n```\n\n- 写入文件：\n\n```java\nPath newPath = Paths.get(\"\
    newfile.txt\");\nbyte[] data = \"Sample text\".getBytes();\nFiles.write(newPath,\
    \ data, StandardOpenOption.CREATE);\n```\n\n### 10.3.4 Path 和 Paths：NIO 增强\n\n\
    在 Java 7 中引入的 NIO.2 文件 API 增加了 `Path` 接口和 `Paths` 工具类，提供了更全面的文件系统处理方法。\n\n- `Path`：代表依赖系统的文件路径。它是用于定位文件系统中文件的对象，提供了检查、定位和操作文件系统对象的方法。\n\
    \n- `Paths`：一个工具类，包含静态方法可以通过路径字符串或 URI 返回 `Path`。\n\n采用 `Files` 类以及 `Path`/`Paths`\
    \ 接口可以使文件 I/O 操作的代码更具可读性和维护性，提供了符号链接处理、文件属性访问和目录遍历等高级功能，这些在传统的流中无法直接实现的。\n\n##\
    \ 10.4 理解字节流和字符流\n\n### 10.4.1 字节流与字符流的区别\n\nJava I/O 流分为两大类：字节流和字符流。字节流（`InputStream`\
    \ 和 `OutputStream` 子类）主要用于处理原始二进制数据，例如图像文件、音频文件和序列化对象。它们按字节读写数据。字符流（`Reader` 和\
    \ `Writer` 子类）则设计用于处理字符数据，如文本文件。它们按字符读写数据，自动处理字符编码和解码，从而抽象了字符与字节转换的复杂性。\n\n###\
    \ 10.4.2 何时使用字节流而非字符流\n\n当处理原始数据或不一定代表字符的二进制文件时，应使用字节流。示例包括：\n\n- 读取写入二进制文件（如图像、视频）。\n\
    - 处理序列化对象。\n- 与来自源或发送到目的地的非字符数据流交互。\n"
