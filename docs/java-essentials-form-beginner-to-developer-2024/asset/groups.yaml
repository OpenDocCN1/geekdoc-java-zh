    # 3.1.3 Reference Data Types


    Understanding Reference Variables Reference variables are used to refer to objects.
    Unlike primitive data types that store the actual values, reference variables
    store the memory address or reference to the actual data.


    Strings and Arrays


    +   - Strings: The string class is not a primitive data type but a reference type
