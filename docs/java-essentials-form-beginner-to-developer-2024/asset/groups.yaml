    ## 4.3.2 Arrays Class: Sorting and Searching


    The java.util.Arrays class provides static methods to perform sorting and searching
    on arrays. These utilities ease the manipulation of arrays significantly.


    - Sorting


    To sort an array, you can use the Arrays.sort() method. It modifies the array
    in place, arranging the elements in ascending order.


    ```java

    import java.util.Arrays;

    int[] numbers = {5, 3, 9, 1};

    Arrays.sort(numbers); // The numbers array is now sorted

    ```


    - Searching


    After sorting an array, you can perform a binary search using the Arrays.binarySearch()
    method. It returns the index of the searched value if it is found; otherwise,
    it returns a negative number.


    ```java

    int[] numbers = {1, 3, 5, 5, 9}; // Must be sorted for binary search

    int index = Arrays.binarySearch(numbers, 5); // Returns 2

    ```


    ## 4.3.3 Array Conversions: From Arrays to Collections and Back


    Java provides mechanisms to convert between arrays and collections, such as List,
    Set, and Map, allowing you to leverage the utilities offered by the Collections
    Framework.


    - Array to Collection


    You can convert an array to a list using Arrays.asList() method. Collection to
    Array Collections can be converted back to arrays using toArray()


    ```java

    String[] color = new String[colorList.size()];

    colorList.toArray(color); // Convert List back to array

    ```


    ## 4.3.4 Practical Use Cases and Examples


    Dynamic arrays, along with array manipulation utilities provided by the Arrays
    class, find applications across various domains:


    - Data Aggregation: Collecting and summarizing data for reports or analysis often
    involves dynamic resizing of collections, sorting, and searching operations.


    - System Administration: Parsing and processing log files, configuration files,
    or user inputs can involve conversions between arrays and collection types for
    easier manipulation.


    - Game Development: Managing entities in a game, like characters, obstacles, and
    power-ups, often requires dynamic arrays for flexible addition and removal of
    elements.


    Example: Finding Maximum and Minimum


    ```java

    int[] numbers = {4, 1, 13, 0, 6};

    Arrays.sort(numbers); // Sort the array

    int min = numbers[0]; // First element is the smallest

    int max = numbers[numbers.length - 1]; // Last element is the largest

    System.out.println("Minimum: " + min + ", Maximum: " + max);

    ```


    Example: Removing Duplicates from a List


    Advanced array concepts, including dynamic arrays and utilities provided by the
    Arrays class, are fundamental in developing efficient and robust Java applications.


    ## 4.4 String Class Functions and Operations


    ### 4.4.1 Converting Data Types to Strings


    Converting various data types to strings is a common requirement. In Java, this
    can be achieved using several methods:


    String.valueOf(): This static method can convert various data types (int, long,
    float, double, char, char array, etc.) to strings.


    ```java

    int num = 100;

    String str = String.valueOf(num); // "100"

    ```


    - Using toString() method: Every class in Java inherits a toString() method from
    the Object class, which can be overridden to represent an object in string form.

    ```java

    Integer numInteger = 100;

    String str = numInteger.toString(); // "100"

    ```


    - Concatenation with an empty string: A quick way to convert a value to a string.

    ```java

    int num = 100;

    String str = num + ""; // "100"

    ```


    ### 4.4.2 String Manipulation: Substring, Replace, and Case Conversion


    - Substring: Extracts a part of a string.


    ```java

    String str = "Hello World";

    String substr = str.substring(0, 5); // "Hello",

    ```


    - Replace: Replaces parts of the string.


    ```java

    String str = "Java is fun";

    String replacedStr = str.replace("fun", "awesome"); // "Java is awesome"

    ```


    - Case Conversion: Converts the case of the string.


    ```java

    String str = "Java Programming";

    String lowerStr = str.toLowerCase(); // "java programming"

    String upperStr = str.toUpperCase(); // "JAVA PROGRAMMING"

    ```


    ### 4.4.3 String Methods: Length, Character Extraction, and Pattern Matching


    - Length: Returns the number of characters in the string.

    ```java

    String str = "Hello";

    int length = str.length();

    ```


    - Character Extraction: Obtain a character at a specified index.

    ```java

    String str = "Hello";

    char ch = str.charAt(0); // ''H''

    ```


    - Pattern Matching: Checks if the string contains a specific sequence.

    ```java

    String str = "Java Programming";

    boolean contains = str.contains("Java"); // true

    ```

