    public class Example {\n    // Java 将在这里创建一个默认构造函数。\n}\n```\n\n参数化构造函数：包含参数的构造函数用于用于创建时使用特定状态初始化对象。使用参数化构造函数，你可以在创建对象时为其提供不同的值。\n\
    \n```java\npublic class Book {\n    String title;\n    int pageCount;\n\n    //\
    \ 参数化构造函数\n    Book(String title, int pageCount) {\n        this.title = title;\n\
    \        this.pageCount = pageCount;\n    }\n}\n```\n\n## 6.3.3 构造函数重载\n\n构造函数重载是\
    \ Java 中的一项特性，一个类可以有多个构造函数，它们接受的参数有所不同。这允许你根据创建对象时可用的信息以不同的方式创建对象。\n\n```java\n\
    public class Rectangle {\n    int length;\n    int width;\n\n    // 默认构造函数\n \
    \   Rectangle() {\n        this.length = this.width = 0;\n    }\n\n    // 参数化构造函数\
    \ 1\n    Rectangle(int side) {\n        this.length = this.width = side;\n   \
    \ }\n\n    // 参数化构造函数 2\n    Rectangle(int length, int width) {\n        this.length\
    \ = length;\n        this.width = width;\n    }\n}\n```\n\n## 6.3.4 构造函数链\n\n\
    构造函数链指的是相对于当前对象从一个构造函数调用另一个构造函数的过程。可以通过 `this()` 和 `super()` 调用来实现。使用 `this()`\
    \ 允许从同类的另一个重载构造函数调用构造函数，而 `super()` 则调用父类的构造函数。\n\n```java\npublic class Student\
    \ {\n  String name;\n  int age;\n\n  // 1个参数的构造函数\n  Student(String name) {\n\
    \    this(name, 18); // 调用带 2 个参数的构造函数\n  }\n\n  // 2个参数的构造函数\n  Student(String\
    \ name, int age) {\n    this.name = name;\n    this.age = age;\n  }\n}\n```\n\n\
    - 使用 super():\n\n```java\nclass Person {\n  String name;\n\n  Person(String name)\
    \ {\n    this.name = name;\n  }\n}\n\nclass Teacher extends Person {\n  int salary;\n\
    \n  Teacher(String name, int salary) {\n    super(name); // 调用父类的构造函数\n    this.salary\
    \ = salary;\n  }\n}\n```\n\n构造函数链通过允许构造函数利用另一个构造函数的初始化过程来简化代码并消除冗余。\n\n## 6.4\
    \ OOP 的支柱：封装、继承与多态\n\n### 6.4.1 封装：使用访问修饰符保护数据\n\n封装是面向对象编程中的一个基本概念，它将数据（属性）和对数据操作的代码（方法）封装成一个单元。此外，它限制了对对象某些组件的直接访问，这是防止意外修改数据的一种手段。对限制组件的访问通常通过\
    \ getter 和 setter 方法实现。\n\nJava 使用访问修饰符来保护变量和方法。常见的访问修饰符有：\n\n- Private（私有）：成员仅在所属类内部可访问。\n\
    - Protected（受保护）：成员在所属包内以及子类中可访问。\n- Public（公有）：成员可以从任何其他类访问。\n\n```java\npublic\
    \ class Account {\n    private double balance;\n\n    // Getter 方法\n    public\
    \ double getBalance() {\n        return balance;\n    }\n\n    // Setter 方法\n\
    \    public void deposit(double amount) {\n        if (amount > 0) {\n       \
    \     balance += amount;\n        }\n    }\n}\n```\n\n### 6.4.2 继承：扩展类与代码复用\n\n\
    继承允许一个类继承另一个类的方法和字段。在 Java 中，继承用于促进代码复用并建立类与类的关系。\n\n#### 创建子类\n\n要继承一个类，你需要使用\
    \ `extends` 关键字。被继承的类被称为父类，继承的类被称为子类。\n\n示例：\n\n```java\nclass Vehicle {\n   \
    \ protected String brand = \"Ford\";\n    public void honk() {\n        System.out.println(\"\
    Tuut, tuut!\");\n    }\n}\n\nclass Car extends Vehicle {\n    private String modelName\
    \ = \"Mustang\";\n    public static void main(String[] args) {\n        Car myFastCar\
    \ = new Car();\n        myFastCar.honk();\n        System.out.println(myFastCar.brand\
    \ + \" \" + myFastCar.modelName);\n    }\n}\n```\n\n#### 方法重写与 super 关键字\n\n方法重写发生在子类为父类已经提供的方法提供了特定实现时。`super`\
    \ 关键字用于访问被重写的方法。\n\n示例：\n\n```java\nclass Animal {\n  void sound() {\n    System.out.println(\"\
    Animal makes a sound\");\n  }\n}\n\nclass Pig extends Animal {\n  @Override\n\
    \  void sound() {\n    super.sound(); // 调用父类方法\n    System.out.println(\"The\
    \ pig says: wee wee\");\n  }\n}\n```\n\n### 6.4.3 多态：静态与动态\n\nJava 中的多态有两种类型：编译时（静态）和运行时（动态）。\n\
    \n#### 方法重载\n\n方法重载（静态多态）发生在同一个类中，当两个或多个方法具有相同名称但参数不同时。\n\n示例：\n\n```java\nclass\
    \ Display {\n    void show(int x) {\n        System.out.println(\"Show int: \"\
    \ + x);\n    }\n\n    void show(String s) {\n        System.out.println(\"Show\
    \ String: \" + s);\n    }\n}\n```\n\n#### 方法重写与动态方法分派\n\n方法重写（动态多态）允许子类重写其父类中的方法。动态方法分派是一种机制，通过对重写方法的调用在运行时而非编译时进行解析。\n\
    \n```java\nclass Figure {\n    double dim1;\n    double dim2;\n\n    Figure(double\
    \ a, double b) {\n        dim1 = a;\n        dim2 = b;\n    }\n\n    double area()\
    \ {\n        System.out.println(\"Area for Figure is undefined.\");\n        return\
    \ 0;\n    }\n}\n\nclass Rectangle extends Figure {\n    Rectangle(double a, double\
    \ b) {\n        super(a, b);\n    }\n\n    // 重写 rectangle 的 area\n    double\
    \ area() {\n        System.out.println(\"Inside Area for Rectangle.\");\n    \
    \    return dim1 * dim2;\n    }\n}\n```\n\n### 6.4.4 抽象类与接口：强制规范\n\n抽象类：抽象类不能被实例化，可以包含抽象方法，即没有方法体的方法。当你想在多个相关类之间共享代码时，可以使用它们。\n\
    \n```java\nabstract class Animal {\n    public abstract void sound();\n}\n\nclass\
    \ Dog extends Animal {\n    public void sound() {\n        System.out.println(\"\
    Woof\");\n    }\n}\n```\n\n接口：接口是一个用于一组带有空方法的方法的“完全抽象类”。类可以实现多个接口，克服了单继承的限制。\n\
    \n示例：\n\n```java\ninterface Animal {\n    void sound(); // 接口方法（没有方法体）\n}\n\n\
    class Pig implements Animal {\n    public void sound() { // 在此处提供 sound() 的主体\n\
    \        System.out.println(\"The pig says: wee wee\");\n    }\n}\n```\n\n"
