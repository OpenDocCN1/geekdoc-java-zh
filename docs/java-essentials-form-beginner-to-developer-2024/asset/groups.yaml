    \n## 异常处理\n\n异常是程序执行过程中发生的中断正常流程的事件。恰当处理异常允许程序继续运行或优雅地终止。\n\n### 8.1.1 什么是异常？\n\
    \n异常可以是执行过程中遇到的任何错误状况或意外行为。当出现此类情况时，会创建一个代表该错误的对象并将其抛出。如果该方法没有处理该异常，它将沿调用栈传递。\n\
    \n### 8.1.2 异常的类型\n\nJava 中的异常主要分为两类：检异常（checked exceptions）和未检异常（unchecked exceptions）。\n\
    \n**检异常**\n检异常是在编译时被检查的异常，这意味着编译器要求代码要么处理这些异常，要么使用 `throws` 声明它们。检异常的存在标志着预期中但不可避免的问题，合理的应用程序应该预见到并从中恢复。检异常的示例是\
    \ `FileNotFoundException`。\n\n**未检异常**\n未检异常表示程序中的缺陷（bug）。这些异常在编译时不进行检查，而是在运行时检查。由于它们反映了编程错误，通常不会预见到处理它们。示例包括\
    \ `NullPointerException` 和 `ArrayIndexOutOfBoundsException`。\n\n### 8.1.3 异常层次结构\n\
    \n所有异常类都是 `Throwable` 类的后代。`Throwable` 类分为两个主类：`Error`（用于普通应用程序不应尝试捕获的错误状况）和 `Exception`，后者进一步细分为检异常和运行时异常（未检异常）。\n\
    \n### 8.2 try, catch 和 finally 块\n\ntry、catch 和 finally 块构成了 Java 异常处理机制的核心。它们共同工作\n\
    \n"
