    \ ensuring a level of abstraction and requiring subclasses to implement specific\
    \ functionalities tailored to their needs.\n\n## 12.2 Exploring Interfaces\n\n\
    ### 12.2.1 Basics of Interfaces\n\nIn Java, an interface is a reference type,\
    \ similar to a class, that can contain only constants, method signatures, default\
    \ methods, static methods, and nested types. Interfaces cannot contain instance\
    \ fields or constructors. The methods in interfaces are abstract by default, which\
    \ means they do not have a body and must be implemented by classes that choose\
    \ to implement the interface.\n\n```java\npublic interface Animal {\n    void\
    \ eat();\n    void sleep();\n}\n```\n\nAn interface is implemented by using the\
    \ implements keyword in a class. A class that implements an interface must provide\
    \ concrete implementations for all of the abstract methods declared in the interface.\n\
    \n## 12.2.2 Implementing Multiple Interfaces\n\nJava supports multiple inheritance\
    \ of type through the use of interfaces. This means a class can implement more\
    \ than one interface, thereby inheriting abstract methods from multiple sources.\n\
    \n```java\npublic interface Herbivore {\n    void graze();\n}\n\npublic interface\
    \ Carnivore {\n    void hunt();\n}\n\npublic class Bear implements Herbivore,\
    \ Carnivore {\n    public void graze() {\n        System.out.println(\"Bear is\
    \ grazing\");\n    }\n\n    public void hunt() {\n        System.out.println(\"\
    Bear is hunting\");\n    }\n}\n```\n\nThis approach allows for a flexible design\
    \ without the complexities and issues associated with the multiple inheritances\
    \ of implementation.\n\n## 12.2.3 Default Methods in Interfaces\n\nIntroduced\
    \ in Java 8, default methods allow you to add new methods to an interface that\
    \ already has implementers without breaking their code. Default methods have a\
    \ body and are not abstract, unlike other methods defined in interfaces.\n\n```java\n\
    public interface Animal {\n    void eat();\n\n    default void breathe() {\n \
    \       System.out.println(\"Breathing\");\n    }\n}\n```\n\nDefault methods were\
    \ introduced primarily to enhance the Collections API in Java 8, allowing new\
    \ methods to be added without affecting existing code.\n\n## 12.2.4 Functional\
    \ Interfaces and Lambda Expressions\n\nA functional interface in Java is an interface\
    \ that contains exactly one abstract method. It can have more than one method,\
    \ but all other methods must have default implementations or be static. These\
    \ interfaces are intended to be used primarily with lambda expressions, which\
    \ provide a clear and concise way to represent one method interfaces (or functional\
    \ interfaces).\n\n```java\n@FunctionalInterface\npublic interface Greeting {\n\
    \    void sayHello(String message);\n}\n\npublic class Demo {\n    public static\
    \ void main(String[] args) {\n        Greeting greeting = message -> System.out.println(\"\
    Hello, \" + message);\n        greeting.sayHello(\"World\");\n    }\n}\n```\n\n\
    Lambda expressions enable you to treat functionality as a method argument, or\
    \ code as data. Functional interfaces provide target types for lambda expressions\
    \ and method references.\n\n## 12.3 Inner Classes in Depth\n\n### 12.3.1 Overview\
    \ of Inner Classes\n\nIn Java, an inner class is defined within the scope of another\
    \ class. Inner classes are a security mechanism that allows the inner class to\
    \ access the members of its outer class while keeping its own members hidden from\
    \ the world outside. Inner classes are divided into several types based on their\
    \ purpose and the way they are declared and used: member inner classes, local\
    \ inner classes, anonymous inner classes, and static nested classes. Each type\
    \ serves different roles, offering a powerful mechanism for encapsulation and\
    \ organization of code.\n\n### 12.3.2 Member Inner Classes\n\nA member inner class\
    \ is a non-static class that is defined at the same level as the instance variables\
    \ of a class. It can access all members of the outer class, including private\
    \ members. However, an object of a member inner class can only be instantiated\
    \ in the context of an object of the outer class.\n\n```java\nclass OuterClass\
    \ {\n    private String message = \"Hello World\";\n\n    class InnerClass {\n\
    \        void display() {\n            System.out.println(message); // Access\
    \ to OuterClass member\n        }\n    }\n}\n```\n\n### 12.3.3 Local Inner Classes\n\
    \nLocal inner classes are defined within a block, usually a method, and are visible\
    \ only within that block. Like local variables, the scope of local inner class\
    \ is restricted to the block it is defined in.\n\n### 12.3.4 Anonymous Inner Classes\n\
    \nAnonymous inner classes are unnamed and are typically used for instantiating\
    \ objects with certain extensions or implementations of interfaces or abstract\
    \ classes on the fly, without the need to formally declare a subclass.\n\n```java\n\
    Runnable runnable = new Runnable() {\n    @Override\n    public void run() {\n\
    \        System.out.println(\"Anonymous inner class.\");\n     방법\n};\n```\n\n\
    ### 12.3.5 Static Nested Classes\n\nUnlike the other types of inner classes, static\
    \ nested classes do not require an instance of the outer class to be created.\
    \ They cannot access instance members. They are typically used to associate a\
    \ class with another class where the inner class needs to be accessed in a static\
    \ context. Each type of inner class serves a unique purpose and offers different\
    \ capabilities and restrictions.\n\n## 12.4 Understanding Static and Final\n\n\
    ### 12.4.1 Static Keyword: Variables and Methods\n\nThe static keyword in Java\
    \ is used to indicate that a particular member (variable or method) belongs to\
    \ the class, rather than instances of the class. This means that a single copy\
    \ of the static member is created and shared across all instances of the class.\n\
    \n- Static Variables: Also known as class variables, these are declared with the\
    \ static keyword within a class, but outside any method. They are initialized\
    \ when the class is loaded.\n\n- Static Methods: These methods can be called without\
    \ creating an instance of the class. Static methods cannot access instance variables\
    \ or methods directly; they must use an object reference.\n\n```java\nfinal int\
    \ finalVariable = 10; // Cannot be reassigned a new value\n```\n\n### 12.4.2 Final\
    \ Keyword: Immutable States\n\nThe final keyword in Java is used to declare constants,\
    \ prevent inheritance, and prevent methods from being overridden. When applied\
    \ to variables, it makes them unchangeable after they are initialized. When applied\
    \ to classes and methods, it restricts inheritance and overriding, respectively.\n\
    \n- Final Variables: These variables must be initialized when declared or within\
    \ the constructor. Once assigned, their value cannot be changed.\n\n- Final Parameters:\
    \ Parameters of a method declared as final cannot be modified within the method.\n"
  mdcn: "\n\n```java\nabstract class Animal {\n    abstract void makeSound();\n\n\
    \    void eat() {\n        System.out.println(\"This animal eats food.\");\n \
    \   }\n}\n```\n\n## 12.1.3 抽象方法及其影响\n\n抽象方法是抽象类中没有方法体的方法。相反，它们仅仅提供了一个方法签名。提供这些方法的具体实现是子类的责任。如果一个类即使包含一个抽象方法，该类也必须声明为抽象类。\n\
    \n类中抽象方法的出现表明，该类旨在作为其他类的蓝图或基类。它强制与子类之间建立一种契约，确保了某些核心方法的被实现，从而促进了继承类的统一使用和行为。\n\
    \n```java\nclass Dog extends Animal {\n    @Override\n    void makeSound() {\n\
    \        System.out.println(\"Bark\");\n    }\n}\n```\n\n## 12.1.4 抽象类的实际用途\n\n\
    抽象类在需要为一组子类定义通用框架的场景中特别有用，它在确保功能一致性的同时，允许在实现上具有灵活性。一些实际用途包括：\n\n- 模板方法：抽象类可以定义一个带有执行任务的一系列步骤的“模板方法”。子类随后可以定义这些步骤的实际实现。\n\
    \n- 代码复用：通过声明并可能为常用方法提供默认实现，它们允许重大的代码复用，子类可以直接使用这些方法，或者在需要时重写它们。\n\n- 设计与文档记录：作为未来开发的蓝图，抽象类有助于记录和强制类层次结构，促进良好的设计实践。\n\
    \n总而言之，抽象类和抽象方法提供了一种结构化的方式来封装相关类之间的共同特征，同时确保了抽象级别，并要求子类实现根据其需求定制的特定功能。\n\n## 12.2\
    \ 探索接口\n\n### 12.2.1 接口基础\n\n在 Java 中，接口是一种引用类型，类似于类，但只能包含常量、方法签名、默认方法、静态方法和嵌套类型。接口不能包含实例字段或构造函数。接口中的方法默认是抽象的，这意味着它们没有方法体，必须由选择实现该接口的类来实现。\n\
    \n```java\npublic interface Animal {\n    void eat();\n    void sleep();\n}\n\
    ```\n\n接口通过在类中使用 `implements` 关键字来实现。实现接口的类必须为接口中声明的所有抽象方法提供具体的实现。\n\n## 12.2.2\
    \ 实现多个接口\n\nJava 通过使用接口支持类型的多重继承。这意味着一个类可以实现多个接口，从而从多个源头继承抽象方法。\n\n```java\npublic\
    \ interface Herbivore {\n    void graze();\n}\n\npublic interface Carnivore {\n\
    \    void hunt();\n}\n\npublic class Bear implements Herbivore, Carnivore {\n\
    \    public void graze() {\n        System.out.println(\"Bear is grazing\");\n\
    \    }\n\n    public void hunt() {\n        System.out.println(\"Bear is hunting\"\
    );\n    }\n}\n```\n\n这种方法允许灵活的设计，而避免了与实现多重继承相关的复杂性和问题。\n\n## 12.2.3 接口中的默认方法\n\
    \n在 Java 8 中引入的默认方法允许你向已经有实现者的接口中添加新方法，而不会破坏它们的代码。与接口中定义的其他方法不同，默认方法有体且不是抽象的。\n\
    \n```java\npublic interface Animal {\n    void eat();\n\n    default void breathe()\
    \ {\n        System.out.println(\"Breathing\");\n    }\n}\n```\n\n默认方法的引入主要是为了增强\
    \ Java 8 中的 Collections API，允许在不影响现有代码的情况下添加新方法。\n\n## 12.2.4 函数式接口与 Lambda 表达式\n\
    \nJava 中的函数式接口是指恰好包含一个抽象方法的接口。它可以有多个方法，但所有其他方法必须有默认实现或是静态的。这些接口主要用于配合 Lambda 表达式使用，Lambda\
    \ 表达式提供了一种清晰的方式。\n\n```java\n@FunctionalInterface\npublic interface Greeting {\n\
    \    void sayHello(String message);\n}\n\npublic class Demo {\n    public static\
    \ void main(String[] args) {\n        Greeting greeting = message -> System.out.println(\"\
    Hello, \" + message);\n        greeting.sayHello(\"World\");\n    }\n}\n```\n\n\
    ## 12.3 深入理解内部类\n\n### 12.3.1 内部类概览\n\n在 Java 中，内部类是定义在另一个类内部的类。根据用途和声明方式分为不同的类型：成员内部类、局部内部类、匿名内部类和静态嵌套类。内部类允许你根据需要来组织代码。\n\
    \n### 12.3.2 成员内部类\n\n成员内部类是非静态类，定义在类的相同层级。它可以访问外部类的所有成员，包括私有成员。\n\n```java\n\
    class OuterClass {\n    private String message = \"Hello\";\n\n    class InnerClass\
    \ {\n        void display() {\n            System.out.println(message);\n    \
    \    }\n    }\n}\n```\n\n### 12.3.3 局部内部类\n\n局部内部类定义在块（通常是方法）内部，可见性仅限于该块。就像局部变量一样，其作用域是限制的。\n\
    \n### 12.3.4 匿名内部类\n\n匿名内部类没有名称，通常用于现场实例化接口的扩展或抽象类的实现，而无需正式声明子类。\n\n```java\n\
    Runnable runnable = new Runnable() {\n    @Override\n    public void run() {\n\
    \        System.out.println(\"Anonymous internal class.\");\n    }\n};\n```\n\n\
    ### 12.3.5 静态嵌套类\n\n与其他内部类不同，静态嵌套类不需要创建外部类的实例。它们无法访问实例成员。它们通常用于将类与另一个类关联，且内部类需要在静态上下文中被访问。\n\
    \n## 12.4 理解 static 和 final\n\n### 12.4.1 static 关键字：变量与方法\n\n`static` 关键字在 Java\
    \ 中用于指示特定成员（变量或方法）属于类而不是类的实例。这意味着静态成员只有一个副本，并被所有实例共享。\n\n- 静态变量：也称为类变量，在类中方法之外用\
    \ `static` 关键字声明。它们在类加载时初始化。\n- 静态方法：这些方法可以在不创建类实例的情况下调用。静态方法无法直接访问实例变量或方法；必须使用对象引用。\n\
    \n```java\nfinal int finalVariable = 10; // 不能重新赋值\n```\n\n### 12.4.2 final 关键字：不可状态\n\
    \n`final` 关键字在 Java 中用于声明常量、防止继承以及防止方法被重写。当应用于变量时，它使变量在初始化后不可更改。\n\n- final 变量：这些变量必须在声明时或在构造函数中初始化。一旦赋值，其值就无法改变。\n\
    \n"
