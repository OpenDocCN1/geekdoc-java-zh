    \ `if` 或 `switch` 语句内部放入一个：\n\n```\nif (condition1) {\n    // 如果 condition1 为真\n\
    \    if (condition2) {\n        // 如果 condition1 和 condition2 都为真\n    }\n}\n\
    ```\n\n合理使用条件语句使开发者能够编写灵活且扩展的 Java 程序，根据各种条件做出决策。\n\n## 3.4 循环机制：for、while 和 do-while\
    \ 循环\n\n### 3.4.1 for 循环\n\nJava 中的 `for` 循环用于固定次数地执行代码块。基础 `for` 循环的语法如下：\n\n\
    ```\nfor(初始化; 条件; 更新) {\n    // 执行的代码块\n}\n```\n\n- 初始化：通常用于初始化计数变量。\n- 条件：只要该条件为真，循环就会继续。\n\
    - 更新：在每次迭代后执行；通常用于更新计数变量。\n\n用于数组和集合的增强 for-each 循环：Java 5 引入了增强 `for` 循环，使得遍历数组和集合中的元素变得简单：\n\
    \n```\nfor(dataType item : arrayOrCollection) {\n    // 对每个 item 执行的代码\n}\n```\n\
    \n这种形式消除了维护索引或直接使用迭代器的需要。\n\n### 3.4.2 while 循环\n\n当循环开始前不知道迭代次数时，应使用 `while`\
