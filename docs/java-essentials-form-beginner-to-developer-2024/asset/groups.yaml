    +   - Arrays: Arrays are reference types that store multiple items of the same
    type. Both primitives and objects can be stored in arrays.


    # 3.1.4 Type Conversion and Casting


    Implicit vs Explicit Casting


    +   - Implicit Casting (Widening Conversion): This happens when the source type
    has smaller size than the destination type. For instance, assigning an int to
    a long is done implicitly by Java.'
