    ## LinkedHashMap


    描述：一种带有贯穿其中的链表列表的 HashMap，因此它维护了插入顺序（或可选的访问顺序）。除了排序行为外，它的特性与 HashMap 相同。


    使用场景：适用于需要保留插入/访问顺序的场景。


    关键特性：由于为了维护顺序而增强了结构，其在迭代方面的性能略低于 HashMap。


    ## TreeMap


    描述：实现了 NavigableMap 接口，并根据键的自然顺序或指定的 Comparator 对键进行排。。它基于红黑树结构。


