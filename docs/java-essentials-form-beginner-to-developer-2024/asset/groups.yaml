    # 11.1.3 Thread Priorities and Daemon Threads


    +   - Thread Priorities: Java provides a provision for assigning priority (min:
    1, max: 10) to threads using the setPriority(int priority) method. Threads with
    higher priorities are executed in preference to threads with lower priorities,
    although this is not a strict guarantee due to the JVM and OS dependencies.


    +   - Daemon Threads: A daemon thread in Java is a service provider thread that
    provides services to the user thread. Its life depends on the mercy of user threads,
    i.e., when all non-daemon (user) threads finish, the VM terminates any running
    daemon threads. Daemon threads are generally used as service providers for user
    threads and set via the setDaemon(true) method before the thread starts.


    # 11.1.4 Handling InterruptedExceptions


    InterruptedException is thrown when a thread is waiting, sleeping, or otherwise
    occupied, and the thread is interrupted. Handling this exception properly is crucial
