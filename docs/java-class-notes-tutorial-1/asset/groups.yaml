    \ reference variable.\n3) Use the interface reference variable in order to access\
    \ the\nmethods of the implementation classes\n\n```\nEx: Factory_Taxi.java\npackage\
    \ factorydesign;\n\npublic interface Taxi\n{\n    void startTrip();\n    void\
    \ endTrip();\n}\n\nola.java\npublic class ola implements Taxi\n{\n    @Override\n\
    \    public void startTrip() {\n        System.out.println(\"started a Trip using\
    \ ola App\");\n    }\n\n    public void endTrip() {\n        System.out.println(\"\
    started a Trip using ola cancelled\");\n    }\n}\n```"
