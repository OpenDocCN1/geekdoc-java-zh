    - 我们使用了 super 调用语句。\n- 为了在另一个类中实现构造函数链。\n- 构造函数链分为两种两种方式：\n\n- 隐式构造函数链\n- 显式构造函数链\n\
    \n### 隐式构造函数链\n\n- 当我们创建一个类的对象时，如果该类有一个父类，且该父类有一个无参数构造函数，该构造函数会被隐式执行。\n\n父类 java\n\
    \n```java\npublic class Father {\n    Father() {\n        System.out.println(1);\n\
    \    }\n}\n```\n\n# Son.java\n\n```java\npublic class Son extends Father {\n \
    \   Son() {\n        // 隐式 super();\n        System.out.println(\"java\");\n \
    \   }\n}\npublic class Test {\n    public static void main(String[] args) {\n\
    \        System.out.println(\"start\");\n        Son s = new Son();\n        System.out.println(\"\
    end\");\n        int output;\n        int start = 1;\n        int end = 2;\n \
    \   }\n}\n```\n\n# papergrid\n日期: / /\n\n# 显式构造函数链\n\n当我们创建一个类的对象时，如果该类有一个父类，且该父类有一个参数化构造函数，则子类构造函数必须显式调用父类构造函数，否则将得到编译时错误。\n\
    \n# Father.java\n\n```java\npublic class Father {\n    Father(int x) {\n     \
    \   System.out.println(1);\n    }\n}\n```\n\n# Son.java\n\n```java\npublic class\
    \ Son extends Father {\n    Son() {\n        super(100);\n        System.out.println(2);\n\
    \    }\n}\n```\n\n# Test.java\n\n```java\npublic class Test {\n    public static\
