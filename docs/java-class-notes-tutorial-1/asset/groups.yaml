    # Inheritance :


    Inheritance is a process wherein one class acquiring properties from another class


    A class which shares the property is called a superclass /parent class /base class


    A class which acquires the properties is referred as subclass/child class /derived
    class


    Inheritance in java is achieved using extends keyword Inheritance is also referred
    to as Is-A Relationship


    In java only variables & methods are not Inherited Where as blocks & constructors
    are not Inherited


    +   Different ways of Inheritance are as follows

    1) Single Inheritance

    2) Multilevel Inheritance

    3) Hierarchical Inheritance

    4) Multiple Inheritance

    5) Hybrid Inheritance


    Single level Inheritance

    A combination of 1 super class & 1 subclass class IS called as Singlelevel Inheritance


    ![](img/c7c1d07c55f63dc1b96f816c41bc4141_98_0.png)


    Multilevel Inheritance

    A combination of Multiple super classes & multiple- subclasses in a sequential
    order

    B is a superclass & subclass of A'
