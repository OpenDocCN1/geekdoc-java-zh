    \ person();\n        p.setAge(25);\n        int age = p.getAge();\n        System.out.println(age);\n\
    \    }\n}\n```\n\n- i) 创建一个名为 employee 的公共非抽象类\n- ii) 声明私有变量 id, name\n- iii)\
    \ 分别拥有公共 getter 和 setter 方法\n- iv) 创建另一个名为 solution 的类并在 main 方法来调用这些相应的方法\n\n\
    ```java\npublic class employee {\n    private int id;\n    private String name;\n\
