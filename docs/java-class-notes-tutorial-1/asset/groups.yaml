    \ 200\norg-333\n3 Nivi 300\n\n# Inheritance\n\nInheritance is a process wherein\
    \ one class acquiring properties from another class.\n\nA class which shares the\
    \ property is called a superclass / parent class / base class.\n\nA class which\
    \ acquires the properties is referred as subclass/child class / derived class.\n\
    \nInheritance in java is achieved using extends keyword. Inheritance is also referred\
    \ to as Is-A Relationship.\n\nIn java only variables & methods are not Inherited\
    \ Where as blocks & constructors are not Inherited.\n\n- Different ways of Inheritance\
    \ are as follows:\n1) Single Inheritance\n2) Multilevel Inheritance\n3) Hierarchical\
    \ Inheritance\n4) Multiple Inheritance\n5) Hybrid Inheritance\n\n## Single level\
    \ Inheritance\nA combination of 1 super class & 1 subclass class IS called as\
    \ Singlelevel Inheritance.\n\n![](img/c7c1d07c55f63dc1b96f816c41bc4141_98_0.png)\n\
    \n## Multilevel Inheritance\nA combination of Multiple super classes & multiple-\
    \ subclasses in a sequential order. B is a superclass & subclass of A.\n\n## Hierarchical\
    \ Inheritance\nA combo of 1 superclass & multiple subclasses called Hierarchical\
    \ Inheritance.\n\n![](img/c7c1d07c55f63dc1b96f816c41bc4141_99_0.png)\n\n## Multiple\
    \ Inheritance\nA combo of 1 subclass & Multiple superclasses is called Multiple\
    \ Inheritance.\n\n![](img/c7c1d07c55f63dc1b96f816c41bc4141_99_1.png)\n\n## Hybrid\
    \ Inheritance\nIt is a combination of 2 or more types of inheritance.\n\nIn java\
    \ hybrid inheritance is supported upto some extent not completely.\n\n**Note:\
    \ Java Does Not Support Multiple Inheritance**\n\n![](img/c7c1d07c55f63dc1b96f816c41bc4141_99_2.png)\n\
