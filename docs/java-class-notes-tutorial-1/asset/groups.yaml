- md: "\n# Java\n\n- Java is a high level programming language\n- Programming Language\
    \ is a medium to interact with s/m\n- High-level language is a language in a non-normal\
    \ English, Human Understandable\n- James Gosling was a person who introduced Java\n\
    - The company which started java is Sun Microsystems(system)\n- Currently Java\
    \ is owned by oracle\n\n## Working of a Java Program / How java platform independent\
    \ / WORA\n\n![](img/c7c1d07c55f63dc1b96f816c41bc4141_0_0.png)\n\nJVM : Java virtual\
    \ Machine (Platform-dependent)\nWORA : Write Once Run Anywhere\n\nBytecode is\
    \ an intermediate Which is neither low-level nor high-level language, so it uses\
    \ jvm -> (1) convert to machine-level (2) Execute line by line\n\n- Firstly we\
    \ build the java program using editors and save it with the extension -java\n\
    - once we are done developing the program we need to Compile it\n\n- compilation\
    \ is a process in order to check if there are any errors in my java program or\
    \ not\n\n- If compilation is unsuccessful we get error report based on error report\
    \ we need to debug the program\n\n- If compilation is Successful we generate bytecode\
    \ which is intermediate code / platform independent code\n\n- Extension of all\
    \ bytecode can be executed on all platform i.c all operating system\n\n- This\
    \ bytecode can be executed on all platform i.c all operating system\n\n## Variables\n\
    \n- Variables are contained in order to store some data/information Initialization\
    \ / Assign of values happen from RHS to LHS\n\n- Variables are categorized into\
    \ 2\n\n| Global variables | Local variables |\n| --- | --- |\n| (Member) | |\n\
    | Static Nonstatic Variable | Variable |\n\n![](img/c7c1d07c55f63dc1b96f816c41bc4141_1_0.png)\n\
    \nExample : Age = 25\n| LHS | RHS |\n| --- | --- |\n| Age | 25 |\n\nHeight = 5.5\n\
    | LHS | RHS |\n| --- | --- |\n| Height | 5.5 |\n\n## Datatypes\n\n- Datatypes\
    \ are used to indicate the type of data stored into a variables\n\n- Datatypes\
    \ categorized into 2\n1) primitive Datatype\n2) Nonprimitive Datatype\n\n- In\
    \ order to store non-decimal numeric values we have the following datatypes\n\n\
    - The difference between those datatypes is MemorySize\n\n| data types | MemorySize\
    \ (Bytes) | MemorySize (Bits) |\n| --- | --- | --- |\n| byte | 1 | 8 |\n| short\
    \ | 2 | 16 |\n| Int | 4 | 32 |\n| long | 8 | 64 |\n\n- In order to store decimal\
    \ numeric values we have the following datatypes\n\n| Data-T | MemorySize (Bytes)\
    \ | MemorySize (Bits) |\n| --- | --- | --- |\n| float | 4 | 32 |\n| double | 8\
    \ | 64 |\n\nwidely used and default datatype for decimal.\n\n- In order to store\
    \ true/false we have following datatypes\n\n| Data-T | MemorySize (Bytes) | MemorySize\
    \ (Bits) |\n| --- | --- | --- |\n| Boolean | 1 | 8 |\n\n- In order to store a\
    \ single character we make use of char,\n\n- char data should be enclosed within\
    \ 'single quote' (' )\n\n- The memory size of char is 2 bytes : 16bits\n\nNote\
    \ All the above mentioned 8 data types are together called as primitive data types\n\
    \nString It is a datatype to store a sequence of characters\n- String data has\
    \ to be enclosed within \"double quotes\"\n\nNote Java is CaseSensitive When in\
    \ lowercase letters are not equivalent to uppercase letters values (a≠A)\n\n##\
    \ 32/01/2020 Variable Declaration\n\nSyntax:\ndatatype VariableName;\nint age;\n\
    double salary;\n\nSyntax ; Variable Initialisation\nVariableName = value;\n\n\
    | age = 20; | 20 Age |\n| --- | --- |\n| salary = 5000-69 | 5000-69 Salary |\n\
    \nVariable Declaration & Initialization\nSyntax : Initialization\n\n```\ndatatype\
    \ VariableName = Value;\nDeclaration\nboolean x = true;\nfalse;\n```\n\n```java\n\
    String Subject = \"Java\",\nString count = \"jsp2020\",\nchar gender = 'M';\n\
    ```\n\n## Structure of a java program\n\n1) Class\n2) Main method\n3) Print Statement\n\
    \n```java\nclass className {\n    Scope of class {\n        public static void\
    \ main(String[] args) {\n            System.out.println(\"-----\");\n        }\n\
    \    }\n}\n```\n\nThe filename should be same as className during file Saving\
    \ className.java\n\n```java\nEx:1 Class Firstprogram\n{\n    public static void\
    \ main(String[] args) {\n        System.out.println(\"Hello world\");\n    }\n\
    }\n```\n\n```text\nOutput: Open cmd\ncd desktop\ncd java programs\njavac Firstprogram.java\
    \ (compiling)\njava Firstprogram (printing)\nHello world!!!\n// cd: change directory\
    \ to center save tiles\n```\n\n## Ex:2) Class Demo\n\n```java\nclass Demo {\n\
    \    public static void main(String[] args) {\n      System.out.println(10);\n\
    \      System.out.println(45.67);\n      System.out.println(true);\n      System.out.println('2');\n\
    \      System.out.println(\"jsp@2020\");\n    }\n}\n```\n\nOutput : javac Demo.java\n\
    java Demo\n\n| 10 |\n| 45.67 |\n| true |\n| 2 |\n| jsp@2020 |\n\n## Ex 3) Write\
    \ a java program to follow the below scenarios\n\ni) Create class called student\n\
    ii) Define main method\niii) Under main method initialize variables as respective\
    \ values\n\n```java\nClass student {\n  public static void main(String[] args)\
    \ {\n  String name=\"Bhagi\";\n  int age = 23;\n  System.out.println(name);\n\
    \  System.out.println(age);\n  }\n}\n```\n\n| Bhagi |\n| 23 |\n\nNote: In java\
    \ order to perform concatenation use of '+' operator\n\n```java\nclass Employee\
    \ {\n    public static void main(String[] args) {\n        int id = 10;\n    \
    \    String name = \"Bhagi\";\n        double salary = 23;\n        System.out.println(\"\
    Employee Id: \" + id);\n        System.out.println(\"Employee name is: \" + name);\n\
    \        System.out.println(\"Employee Salary: \" + salary);\n        System.out.println(id\
    \ + \" \" + name + \" \" + salary);\n    }\n}\n```\n\nOutput\njavac Employee\n\
    java Employee\nEmployee Id: 10\nEmployee name is: Bhagi\nEmployee Salary: 23\n\
    \n## Operators\n\n1) Arithmetic Operators\n+ Addition\n- Subtraction\n* Multiplication\n\
    / Division\n% Modulus\n\n2) Assignment Operators\n=\n+=\n-=\n*=\n/=\n\n```java\n\
    Ex Class Assignment Operators\n{\n    public static void main(String[] args) {\n\
    \        int x=10;\n        System.out.println(\"value of x is: \" + x);\n   \
    \     x+=20;\n        System.out.println(\"value of x is: \" + x);\n        System.out.println(\"\
    a = \" + a);\n        int a=6;\n        System.out.println(\"value of a is: \"\
    \ + a);\n        a*=5;\n        System.out.println(\"value of a is: \" + a);\n\
    \    }\n}\n```\n\n| Value of x is 10 |\n| value of x is 30 |\n| Value of a is\
    \ 6 |\n| value of a is 30 |\n\n## Relational/conditional/comparison Operators\n\
    \n< : less than\n> : Greater than\n<= : less equal to\n>= : Greater equal to\n\
    == : Equals to\n!= : not equal to\n\nNote: Comparison Operators will always return\
    \ boolean values (true/false)\n\n```java\nClass Comparison Operator\n{\n    public\
    \ static void main(String[] args) {\n        int x=10;\n        int y=20;\n  \
    \      boolean result1 = x<y;\n        boolean result2 = y>x;\n        System.out.println(result1\
    \ + \"\\t\" + result2);\n        System.out.println(\"x == y: \" + (x == y));\n\
    \        System.out.println(\"x<=10: \" + (x<=10));\n        System.out.println(\"\
    3>=4: \" + (3>=4));\n        System.out.println(\"-- == --: \" + (\"-- == --\"\
    ));\n        System.out.println(\"x==10: \" + (x==10));\n        System.out.println(\"\
    y==30: \" + (y==30));\n        System.out.println(\"-- != --: \" + (\"-- != --\"\
    ));\n        System.out.println(\"x!=10: \" + (x!=10));\n        System.out.println(\"\
    y!=30: \" + (y!=30));\n    }\n}\n```\n\n4) logical operators\nAND => &&      true\
    \ = 1\nOR => ||       return => boolean false = 0\nNOT => !\n\n| AND | OR | NOT\
    \ |\n| --- | --- | --- |\n| T T T | T T | T F |\n| T F F | F T T | F F |\n| F\
    \ F F | F F | F F |\n\n```java\nEx: Class logical operators\n{\n    public static\
    \ void main(String[] args) {\n    int x = 10;\n    int y = 20;\n    boolean result1\
    \ = x<y && y>x;\n    boolean result2 = x<y && x==y;\n\n    System.out.println(result1);\n\
    \    System.out.println(result2);\n    System.out.println(\"-\\-\");\n    System.out.println(1<2||12>10);\n\
    \    System.out.println(2<1||2==3);\n    System.out.println(\"-\\-\");\n    System.out.println(!true);\n\
    \    System.out.println(!false);\n    System.out.println(\"-\\-\");\n    System.out.println(!(1<2));\n\
    \    }\n}\n```\n"
  mdcn: "\n\n# Java\n\n- Java 是一种高级编程语言\n- 编程语言是人与硬件/软件交互的媒介\n- 高级语言是一种非标准英语的语言，人类可以理解\n\
    - James Gosling（詹姆斯·高斯）是引入 Java 的人\n- 创立 Java 的公司是太阳系统系统（Sun Microsystems）\n-\
    \ 目前 Java 属于 Oracle 公司\n\n## Java 程序的工作原理 / 如何实现平台无关 / WORA\n\n![](img/c7c1d07c55f63dc1b96f816c41bc4141_0_0.png)\n\
    \nJVM : Java 虚拟机（依赖平台）\nWORA : 写一次，处处运行（Write Once Run Anywhere）\n\n字节码是一种中间形式，既不是低级语言也不是高级语言，因此它使用\
    \ jvm -> (1) 转换为机器级 (2) 逐行执行\n\n- 首先，我们使用编辑器构建 Java 程序并以 `.java` 扩展名保存\n- 一旦我们完成程序开发，我们需要对其进行编译（Compile）\n\
    \n- 编译是一个检查我的 Java 程序中是否存在任何错误的过程\n\n- 如果编译失败，我们会得到错误报告，根据错误报告我们需要对程序进行调试（debug）\n\
    \n- 如果编译成功，我们会生成字节码，它是中间代码 / 平台无关的代码\n\n- 所有字节码的扩展名都可以在所有平台上执行，即所有操作系统\n\n- 此字节码可以在所有平台上执行，即所有操作系统\n\
    \n## 变量\n\n- 变量被包含是为了存储某些数据/信息。初始化/赋值发生从右侧（RHS）到左侧（LHS）\n\n- 变量分为两类\n\n| 全局变量\
    \ | 局部变量 |\n| --- | --- |\n| (成员) | |\n| 静态非静态变量 | 变量 |\n\n![](img/c7c1d07c55f63dc1b96f816c41bc4141_1_0.png)\n\
    \n示例：Age = 25\n| 左侧 | 右侧 |\n| --- | --- |\n| Age | 25 |\n\nHeight = 5.5\n| 左侧\
    \ | 右侧 |\n| --- | --- |\n| Height | 5.5 |\n\n## 数据类型\n\n- 数据类型用于指示存储在变量中的数据类型\n\
    \n- 数据类型分为两类\n1) 原始数据类型（primitive）\n2) 非原始数据类型（Nonprimitive）\n\n- 为了存储非小数数值，我们有以下数据类型\n\
    \n- 这些数据类型之间的区别在于内存大小（MemorySize）\n\n| 数据类型 | 内存大小（字节 Bytes） | 内存大小（比特 Bits） |\n\
    | --- | --- | --- |\n| byte | 1 | 8 |\n| short | 2 | 16 |\n| Int | 4 | 32 |\n\
    | long | 8 | 64 |\n\n- 为了存储小数数值，我们有以下数据类型\n\n| 数据类型 | 内存大小（字节 Bytes） | 内存大小（比特\
    \ Bits） |\n| --- | --- | --- |\n| float | 4 | 32 |\n| double | 8 | 64 |\n\n小数广泛使用的默认数据类型。\n\
    \n- 为了存储真/假，我们有以下数据类型\n\n| 数据类型 | 内存大小（字节 Bytes） | 内存大小（比特 Bits） |\n| --- | ---\
    \ | --- |\n| Boolean | 1 | 8 |\n\n- 为了存储单个字符，我们使用 char，\n\n- char 数据应该被括在'单引号'（'\
    \ '）中\n\n- char 的内存大小为 2 字节：16 比特\n\n注意：上述所有 8 种数据类型合称为原始数据类型\n\nString 是一种存储字符序列的数据类型\n\
    - String 数据必须括在“双引号”（\" \"）中\n\n注意：Java 是大小敏感的，小写字母的值不等于于大写字母（a≠A）\n\n## 32/01/2020\
    \ 变量声明\n\n语法：\n数据类型 变量名;\nint age;\ndouble salary;\n\n语法； 变量初始化\n变量名 = 值;\n\n\
    | age = 20; | 20 Age |\n| --- | --- |\n| salary = 5000-69 | 5000-69 Salary |\n\
    \n变量声明与初始化\n语法：初始化\n\n```\n数据类型 变量名 = 值;\n声明\nboolean x = true;\nfalse;\n```\n\
    \n```java\nString Subject = \"Java\",\nString count = \"jsp2020\",\nchar gender\
    \ = 'M';\n```\n\n## Java 程序的结构\n\n1) 类（Class）\n2) 主方法（Main method）\n3) 打印语句（Print\
    \ Statement）\n\n```java\nclass className {\n    类的范围 {\n        public static\
    \ void main(String[] args) {\n            System.out.println(\"-----\");\n   \
    \     }\n    }\n}\n```\n\n保存文件时文件名应与 className 相同\n\n```java\n例:1 类 Firstprogram\n\
    {\n    public static void main(String[] args) {\n        System.out.println(\"\
    Hello world\");\n    }\n}\n```\n\n```text\n输出: 打开 cmd\ncd desktop\ncd java programs\n\
    javac Firstprogram.java (编译)\njava Firstprogram (打印)\nHello world!!!\n// cd: 切换到中心保存文件\n\
    ```\n\n## 例：2) 类 Demo\n\n```java\nclass Demo {\n    public static void main(String[]\
    \ args) {\n      System.out.println(10);\n      System.out.println(45.67);\n \
    \     System.out.println(true);\n      System.out.println('2');\n      System.out.println(\"\
    jsp@2020\");\n    }\n}\n```\n\n输出：javac Demo.java\njava Demo\n\n| 10 |\n| 45.67\
    \ |\n| true |\n| 2 |\n| jsp@2020 |\n\n## 例 3) 编写一个 Java 程序以遵循以下场景\n\ni) 创建一个名为\
    \ student 的类\nii) 定义 main 方法\niii) 在 main 方法下初始化为相应的值\n\n```java\nClass student\
    \ {\n  public static void main(String[] args) {\n  String name=\"Bhagi\";\n  int\
    \ age = 23;\n  System.out.println(name);\n  System.out.println(age);\n  }\n}\n\
    ```\n\n| Bhagi |\n| 23 |\n\n注意：在 Java 中为了执行字符串拼接使用 '+' 运算符\n\n```java\nclass Employee\
    \ {\n    public static void main(String[] args) {\n        int id = 10;\n    \
    \    String name = \"Bhagi\";\n        double salary = 23;\n        System.out.println(\"\
    Employee Id: \" + id);\n        System.out.println(\"Employee name is: \" + name);\n\
    \        System.out.println(\"Employee Salary: \" + salary);\n    }\n}\n```\n\n\
    输出\njava Employee\nEmployee Id: 10\nEmployee name is: Bhagi\nEmployee Salary:\
    \ 23\n\n## 运算符\n\n1) 算术运算符\n+ 加\n- 减\n* 乘\n/ 除\n% 取模\n\n2) 赋值运算符\n=\n+=\n-=\n\
    *=\n\n```java\n例 赋值运算符\n{\n    public static void main(String[] args) {\n    \
    \    int x=10;\n        System.out.println(\"value of x: \" + x);\n        x+=20;\n\
    \        System.out.println(\"value of x: \" + x);\n        int a=6;\n       \
    \ System.out.println(\"value of a: \" + a);\n        a*=5;\n        System.out.println(\"\
    value of a: \" + a);\n    }\n}\n```\n\n| Value of x is 10 |\n| value of x is 30\
    \ |\n| Value of a is 6 |\n| value of a is 30 |\n\n3) 关系/条件运算符\n\n< 小于\n> 大于\n\
    <= 小于等于\n>= 大于等于\n== 等\n!= 不等于\n\n注意：比较运算符总是返回布尔值（true/false）\n\n```java\nClass\
    \ Comparison\n{\n    public static void main(String[] args) {\n        int x=10;\n\
    \        int y=20;\n        boolean result1 = x<y;\n        boolean result2 =\
    \ y>x;\n        System.out.println(result1 + \"\\t\" + result2);\n        System.out.println(\"\
    x == y: \" + (x == y));\n        System.out.println(\"x<=10: \" + (x<=10));\n\
    \        System.out.println(\"3>=4: \" + (3>=4));\n        System.out.println(\"\
    -- == --: \" + (\"-- == --\"));\n        System.out.println(\"x==10: \" + (x==10));\n\
    \        System.out.println(\"y==30: \" + (y==30));\n        System.out.println(\"\
    -- != --: \" + (\"-- != --\"));\n        System.out.println(\"x!=10: \" + (x!=10));\n\
    \        System.out.println(\"y!=30: \" + (y!=30));\n    }\n}\n```\n\n4) 逻辑运算符\n\
    AND => &&      true = 1\nOR => ||       返回 => 布尔 false = 0\nNOT => !\n\n| AND\
    \ | OR | NOT |\n| --- | --- | --- |\n| T T T | T T | T F |\n| T F F | F T T |\
    \ F F |\n| F F F | F F | F F |\n\n```java\n例: 逻辑运算符\n{\n    public static void\
    \ main(String[] args) {\n    int x = 10;\n    int y = 20;\n    boolean result1\
    \ = x<y && y>x;\n    boolean result2 = x<y && x==y;\n\n    System.out.println(result1);\n\
    \    System.out.println(result2);\n    System.out.println(\"-\\-\");\n    System.out.println(1<2||12>10);\n\
    \    System.out.println(2<1||2==3);\n    System.out.println(\"-\\-\");\n    System.out.println(!true);\n\
    \    System.out.println(!false);\n    System.out.println(\"-\\-\");\n    System.out.println(!(1<2));\n\
    \    }\n}\n```\n\n"
