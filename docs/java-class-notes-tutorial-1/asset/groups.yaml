    # Type Casting


    * Type casting is a process of converting 1 type of data into another

    type of data


    * Type casting / Type conversion is divided into 2 types


    +   i Widening

    ii Narrowmowing


    * Widening is a process of converting smaller type of data into a

    biggen type of data


    * We also called Widening as implicit / automatic casting


    ```

    byte -> short -> int -> float -> long -> double

    1 2 4 4 8

    ```


    | Short a=5; | a | 5 |

    float b=a; | b | 5.0 |


    | Int x=10; | x | 10 |

    double y=x^10; | y | 100 |


    * Narrowing

    * Narrowing is a process of converting biggen type of data into

    smaller type of data


    * Narrowing is also called as Explicit Typecasting


    | int i=10; | i | 10 |

    byte j=(byte)*10; | j | 10 |


    | double a=5.75; | a | 5.75 |

    int b=int(a); | b | 5 |'
