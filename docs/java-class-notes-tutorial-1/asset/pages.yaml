  md: '# JVM Architecture


    The memory locations are categorized into follows:


    +   1) Heap Area: All the objects are stored inside heap area i.e non static properties


    +   2) Class Area/static pool: All the static properties are loaded inside class
    area


    +   3) Method Area: The method def / implementation is always stored inside method
    area


    +   4) stack: The execution of a java program always happens inside the stack


    | JRE | Development Tools |

    |---|---|

    | 1) JIT | Interpreter, compiler |

    | 2) class loader | Debugger |

    | 3) Interpreter | |

