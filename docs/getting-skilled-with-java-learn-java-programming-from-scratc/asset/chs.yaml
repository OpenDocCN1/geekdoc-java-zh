  \ 线程 (Thread)\n\n线程是进程的最小执行单元，进程可以有很多同时执行的线程。线程在进程内有自己的执行路径，并与其他线程共享进程内存。\n\n###\
  \ 进程与线程 (Process and thread)\n\n在本章中，我们将讨论线程和进程。线程是程序执行的最小单元，我们利用 CPU 的空闲状态给其他线程执行的机会，这被称为多线程。多线程是一种概念编程模型，将一个程序划分为可以并发执行的子程序。我们将在本章详细讨论多线程的概念。还将详细讨论线程和进程，以及\
  \ `Thread` 类中可用于处理多线程的所有方法。此外，我们还会解释线程优先级、如何设置和获取线程优先级以及线程的不同状态。\n\n有许多方法可以帮助处理多线程应用程序，如\
  \ `join`、`wait`、`sleep`、`notify` 等，用于拆分执行过程并与进程内的线程进行通信。我们将在本章学习线程和多线程的所有概念。\n\n\
  ### 进程 (Process)\n\n在本章中，我们将讨论线程和进程。线程是程序执行的最小单元，我们利用 CPU 的空闲状态...\n\n成功完成本章后，你能够理解并解释线程、多任务和多线程的概念。在\
  \ Java 编程中，我们通过扩展 `Thread` 类或实现 `Runnable` 接口来实现多线程概念。我们将在本章通过示例程序展示这两种方法。\n\n\n\
  \n\n\n多线程是并发执行多个线程的概念。线程是进程内部轻量级的顺序流控制单元。单线程进程在执行期间遵循单一的控制序列。多线程进程拥有许多控制序列；因此，多线程进程能够同时执行多个独立动作。这核心在于允许其他线程从同一个进程中执行。多线程应用程序通过利用\
  \ CPU 加快了进程处理和执行，提高了对象的效率，并在更短时间内完成任务，这在单线程应用程序中是无法可能的。\n\n通过这种方式，我们提高了应用程序的响应能力，并确保在其他线程正在等待任何外部资源或用户输入时，程序仍在运行。\n\
  \n下图展示了 Java 程序如何被分为可以相互并行运行的子程序：\n\n![](img/Figure-14.4.jpg)\n\n**图 14.4：** 在 Java\
  \ 中将单个应用程序拆分为多线程应用程序\n\n在这里，Java 程序的主线程 `main()` 方法是一个 `NORM_PRIORITY`（普通优先级）线程，也是程序的入口点。随后在\
  \ `main` 方法中，我们创建了三个线程 `t1`、`t2` 和 `t3`，它们彼此并行运行并在多个流中执行程序。\n\n在 Java 编程中，实现多线程和开发多线程应用程序有两种方法：通过实现\
  \ `java.lang.Runnable` 接口或继承 `java.lang.Thread` 类。我们将在本章中通过示例详细讨论这两种方法。\n\n## 创建线程\n\
  \n在 Java 编程中，创建线程类有两种方法：第一是继承 `Thread` 类，第二是实现 `Runnable` 线程。\n\n### 使用 Thread 类\n\
  \n创建线程的第一种方法是通过让我们的类继承 `Thread` 类。`Java.lang.Thread` 是 `Thread` 类，它可以被子类继承以声明和使用线程。类通过\
  \ `extends` 关键字继承 `Thread` 类。以下是 Thread 类的声明：\n\n```java\npublic class MyThreadClass\
  \ extends Thread {\n    public void run() {\n        // 在处做某些操作\n    }\n}\n```\n\
  \n扩展了线程类的类必须重写线程类的 `run()` 方法，该方法是线程执行的入口点。\n\n**示例 14.1：** 使用 `Thread` 类创建线程的示例程序：\n\
  \n```java\nclass MyThreadClass extends Thread {\n    public void run() {\n     \
  \   System.out.println(\"Hello\");\n    }\n}\n\npublic class MainClass {\n    public\
  \ static void main(String s[]) {\n        MyThreadClass t1=new MyThreadClass ();\n\
  \        MyThreadClass t2=new MyThreadClass ();\n        t1.start();\n        t2.start();\n\
  \    }\n}\n```\n\n当我们执行 `t1.start()`（此处是在调用线程）时，它会请求调用线程的 `run()` 方法。每次输出将取决于 CPU\
  \ 调度。但如果仅实现 `t1.run()`（此处是在调用一个方法），那么我们仅仅调用了该方法。在这里，`t1` 和 `t2` 是同一个线程类 `MyThreadClass`\
  \ 的两个线程对象。\n\n线程不能启动两次。如果尝试这样做，将抛出 `IllegalThreadStateException`。以下代码段将抛出 `IllegalThreadStateException`：\n\
  \n```java\nMyThread t1 = new MyThread();\nt1.start();\nt1.start();\n```\n\n在同一线程上执行第二次\
  \ `start()` 方法将抛出异常。\n\n### 使用 Runnable 接口\n\n创建线程的另一种方法是使用 `Runnable` 接口。类应该实现\
  \ `Runnable` 接口并重写其 `run()` 方法。`run` 方法是线程的入口点，当在该线程上执行 `start()` 方法时，执行从此处开始。以下是使用\
  \ `Runnable` 接口创建线程的语法：\n\n```java\npublic class MyThreadClass implements Runnable\
  \ {\n    public void run () {\n        // 在处编写你的语句\n    }\n}\n```\n\n让我们通过示例理解使用\
  \ `Runnable` 接口创建线程。\n\n**示例 14.2：** 使用 `Runnable` 接口创建线程的示例程序：\n\n```java\npublic\
  \ class MainClass {\n    public static void main(String[] args) {\n        MyThreadClass\
  \ myThreadClass = new MyThreadClass();\n        Thread t1 = new Thread(myThreadClass);\n\
  \        t1.start();\n    }\n}\n\nclass MyThreadClass implements Runnable{\n   \
  \ @Override\n    public void run() {\n        System.out.println(\"Hello\");\n \
  \   }\n}\n```\n\n**输出：**\n\n![](img/Figure-14.5.jpg)\n\n**图 14.5：** 前述线程程序的输出窗口（示例\
  \ 14.2）\n\n当我们实现 `Runnable` 接口时，必须创建 `Thread` 类对象，并将我们的线程类对象作为 `Thread` 类的参数。如前面的程序所示，`MyThreadClass`\
  \ 就是我们的 `MyThreadClass`。\n\n## 线程的生命周期\n\n在执行期间，线程会自动或显式地通过调用方法改变其状态。从线程创建到线程结束，线程有五种状态。下图展示了所有阶段：\n\
  \n![](img/Figure-14.6.jpg)\n\n**图 14.6：** 线程的不同阶段\n\n*   **NEW（新建）**：线程一旦被声明就会处于新状态，并在我们调用\
  \ `start` 方法之前一直保持该状态。新创建的线程不会自动启动，它会一直等待 `start` 方法来改变状态。\n*   **RUNNABLE（可运行）**：线程在调用\
  \ `start()` 方法后移动到可运行状态。这是线程准备好执行并等待处理器可用的状态。\n*   **WAITING（等待）**：线程处于等待状态以满足依赖关系或其他先决条件。线程在执行\
  \ `wait` 或 `join` 方法后进入此状态，当在该线程上调用 `notify()`、`notifyAll()` 或 `interrupted()` 方法时，线程恢复执行。\n\
  *   **RUNNING（运行中）**：当调用线程的 `run` 方法时，线程移动到运行状态并在进程中执行。\n*   **TERMINATED（已终止）**：当线程完成执行或显式通过\
  \ `stop` 方法停止时，线程处于终止状态。\n\n上述五种线程状态是高层次的阶段。除了这些，线程还通过不同的线程方法进入状态的子状态。让我们深入研究线程方法并查看线程如何从一个阶段移动到另一个：\n\
  \n![](img/Figure-14.7.jpg)\n\n**图 14.7：** 线程在整个生命周期中不同状态间的移动\n\nThread 类的 `getState()`\
  \ 方法用于识别并获取线程当前的状态。`getState()` 方法将在六种线程状态中返回线程状态；它们是 `new`、`runnable`、`blocked`、`waiting`、`timed_waiting`\
  \ 和 `terminated`。在这里，`blocked` 和 `timed_waiting` 是等待状态的两个子状态。\n\n*   **BLOCKED（阻塞）**：线程处于阻塞状态，是因为需要执行的进程或代码语句被其他线程锁定。\n\
  *   **TIMED_WAITING（超时等待）**：线程处于带有指定时间的这种中。当在该线程上调用 `wait(millisecond)` 或 `sleep(millisecond)`\
  \ 方法时，线程将进入此状态。\n\n\n\n\n\n上述状态被称为线程的生命周期，即线程在终止之前必须经过的阶段。线程方法负责将线程从一个状态移动或传输到另一个状态。以下是我们在线程中使用的方法。\n\
  \n## 线程方法\n\n线程方法是 `java.lang.Thread` 类的方法，它们帮助我们管理和处理线程。以下是开发者在 Java 编程中使用的几个方法：\n\
  \n*   `start()`：新创建的线程不会自动启动。你需要调用 `start` 函数。调用 `start()` 方法会将线程中的虚拟 CPU 激活并变为可运行状态。\n\
  *   `yield()`：此方法赋予其他可运行线程执行的机会。`yield` 将调用线程放入可运行线程组，并允许另一个可运行线程运行。如果没有其他可运行线程，`yield`\
  \ 则什么都不做。\n*   `run()`：`start()` 方法用于创建新线程；一旦线程被创建，就会请求调用 `run()` 函数进行执行。\n*   `wait()`：此方法用于将线程推入对象监器，并停止线程执行，直到被\
  \ `notify`、`notifyAll` 或中断方法唤醒。\n*   `wait(time)`：此方法用于将线程推入对象监器，并停止线程执行指定的时间。参数接受\
  \ `long` 类型的值，表示毫秒时间。\n*   `sleep(time)`：此方法将暂停线程执行指定的时间。参数接受 `long` 类型的值，表示毫秒时间。\n\
  *   `join()`：此方法用于将线程加入执行队列。一旦在线程上调用该方法，当前线程将等待直到被调用线程完成其执行。\n*   `join(time)`：此方法用于将线程加入执行队列。在调用此\
  \ `join`（毫秒）方法后，当前线程将等待指定的时间，而不会等待其他线程死亡或完成执行。\n*   `notify()`：此方法用于唤醒等待在该对象监视器上的单个线程。线程通过调用\
  \ `wait()` 方法在对象监器上等待。\n*   `notifyAll()`：此方法用于唤醒所有等待在该对象监视器上的线程。\n*   `stop()`：此方法用于停止或终止线程。\n\
  *   `suspend()`：此方法用于挂起线程使其停止执行。\n*   `resume()`：此方法将恢复被 `suspend()` 方法挂起的线程的执行。\n\
  \n还有其他方法用于获取线程详细信息。\n\n## 线程优先级\n\n在 Java 编程中，每个线程都有一个优先级；该线程优先级帮助 JRE 优先执行线程。高优先级的线程总是先执行。新线程的初始优先级设置为等于创建线程的优先级，且当且仅当创建线程是守护线程时，新线程也是守护线程。\n\
  \n线程优先级有 10 个逻辑范围；逻辑值是 1 到 10 整数，可以使用 `setPriority(int)` 方法设置到任何线程对象。`Thread` 类中定义了三个用于优先级的静态变量。Java\
  \ 线程的默认优先级是 `NORM_PRIORITY`：\n\n*   `MAX_PRIORITY`：线程可以拥的最大优先级。逻辑线程值为 10。\n*   `MIN_PRIORITY`：线程可以拥有的最小优先级。逻辑线程值在\
  \ 1 到 4 之间。\n*   `NORM_PRIORITY`：分配给线程的默认优先级。逻辑线程值在 5 到 9 之间。\n\n要识别并获取执行中线程的优先级，我们可以借助\
  \ Thread 的 `getPriority()` 方法进行检查。\n\n**注意：如果两个线程被设置为相同的优先级，那么我们无法决定也无法哪个线程将先执行。这取决于线程调度器的算法（例如：轮询算法、先来来算法）。**\n\
  \n## 线程同步\n\n同步是 Java 编程语言中的一个关键字，它方便程序员控制共享数据的线程。这是 Java 技术中提供谨慎处理数据机制的最佳方法。`synchronized`\
  \ 关键字用于声明方法或创建方法或语句块使其成为线程安全的，这意味着同一时间只有一个线程可以访问该代码块，其他线程将处于等待状态，直到第一个线程完成执行。这在我们想要在评估后获取更新的数据，或者在修改对象时会这样做，以确保其他线程在对象被成功修改后仅获取更新后的值。如果我们不锁定代码块，其他线程可能会在同一个对象上执行操作，从而导致歧义并损坏实际数据。\n\
  \n让我们通过程序来说明线程同步的概念。\n\n**示例 14.3**：一个展示使用 `synchronized` 关键字实现线程安全的示例程序：\n\n```java\n\
  package coreJava;\n\nclass SynchronizedEx {\n    synchronized void show(String p){\n\
  \        try {\n            System.out.println(\"*****\");\n            System.out.print(p);\n\
  \            Thread.sleep(1000);\n            System.out.println(\"#####\");\n \
  \       }\n        catch(InterruptedException e){\n            e.printStackTrace();\n\
  \        }\n    }\n}\n\nclass MyThread implements Runnable {\n    Thread c;\n  \
  \  String m;\n    SynchronizedEx r;\n    MyThread(SynchronizedEx w, String k) {\n\
  \        r=w;\n        m=k;\n        c=new Thread(this);\n    }\n    public void\
  \ run(){\n        r.show(m);\n    }\n}\n\npublic class test {\n    public static\
  \ void main(String s[]) throws InterruptedException {\n        SynchronizedEx d=new\
  \ SynchronizedEx();\n        MyThread t1=new MyThread(d,\"Hello\");\n        MyThread\
  \ t2=new MyThread(d,\"JAVA\");\n        t1.c.start();\n        t2.c.start();\n \
  \       t1.c.join();\n        t2.c.join();\n    }\n}\n```\n\n**输出：**\n\n![](img/Figure-14.8.jpg)\n\
  \n**图 14.8**：上述同步类的输出窗口\n\n在前面的程序中，我们创建了两个线程 `t1` 和 `t2`。这里使用了 `synchronized` 关键字；如果\
  \ `t1` 先捕获了 `show` 方法，则 `t2` 无法同时共享该资源，但可以执行其他工作。即使在执行 join 方法后，由于 `t1` 正在执行，`t2`\
  \ 也无法运行 `show()` 方法\n\n线程是任何 Java 程序中执行的最小单元。Java 程序的 `main` 方法也是一个线程，也是执行的入口。通过多线程，我们将应用程序的单个执行流拆分为多个执行流；因此，多个线程可以在\
  \ CPU 中并发执行。通过这种方式，我们也可以停止、启动、设置依赖并释放线程的执行。\n\n\n\n\n\n*   多线程是指在应用程序中同时执行同一程序的多个线程。一个线程被划分为若干块并变成更小的线程，同时在\
  \ CPU 中与其他线程一起开始执行。\n\n*   `Synchronized` 是使代码块或方法变更为线程安全的关键字。\n\n*   线程不能被启动两次。如果我们尝试这样做，将抛出\
  \ `IllegalThreadException`。\n\n## 多选题\n\n1. **创建线程的正确语句是哪一个？**\n    1. `Thread t1\
  \ = new Thread();`\n    2. `Runnable run = new Thread();`\n    3. `Thread t2 = new\
  \ Runnable();`\n    4. `Thread thread;`\n\n2. **创建线程类的两种方法是哪些？**\n    1. 实现 `Thread`\
