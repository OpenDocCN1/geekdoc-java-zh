  ## 核心术语\n\n- **标识符 (Identifier)**: 用于唯一标识变量、类和方法的名字。\n- **修饰符 (Modifier)**: 访问修饰符或访问限定符，用于设置标识符的可见性。\n\
  - **派生类 (Derived class)**: 继承其他属性的类。\n\n## 练习\n\n**练习 1**: 创建一个带有静态成员的类，并通过类名访问这些成员以打印值。\n\
