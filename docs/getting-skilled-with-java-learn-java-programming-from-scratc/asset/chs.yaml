  \ Java 的软件开发工具包，我们需要它来编写和运行用 Java 语言编写的程序和应用程序。在上一章中，我们已经讨论了 JDK 的不同部分及其作用，如 `JRE`、`JVM`\
  \ 和 `JIT`。你可以参考这些内容进行复习。\n\n我们还需要设置环境变量或系统变量，以便我们的机器拥有 `JDK` 的引用，并识别 Java 命令，使其在\
