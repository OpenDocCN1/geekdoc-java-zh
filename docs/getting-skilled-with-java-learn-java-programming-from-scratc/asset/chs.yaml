  \n# 第 4 章\n\n## 构造函数\n\n构造函数是一种特殊的方法，其名称与类名相同。构造函数用于以各种方式声明默认变量并加载或提供程序的先决条件，以便我们的程序能够顺利执行。在本章中，我们将学习构造函数及其在编程中的作用。\n\
  \n## 结构\n\n在本章中，我们将讨论以下主题：\n\n- 构造函数\n- 参数化构造函数\n- 默认构造函数\n- super\n- this\n\n##\
  \ 目标\n\n在成功完成本章后，你将能够：\n\n- 解释构造函数及其不同类型\n- 理解 `super` 和 `this` 的用法\n\n## 构造函数\n\
  \n构造函数是编程中的一种特殊方法，我们用它来初始化成员变量和成员对象。构造函数的名称与类名应始终相同，构造函数带有括号 `()`。构造函数没有返回值。当我们在构造函数中写返回值时，它将不再是构造函数，编译器会将其视为一个带有警告消息的方法。\n\
  \n```java\npublic class ConstructorExample {\n    ConstructorExample() {\n    }\n\
  }\n```\n\n### 默认构造函数\n\n没有参数的构造函数被默认构造函数。每当我们使用 `new` 关键字创建一个类的对象时，都会初始化默认构造函数。之后，系统会隐式地调用该构造函数。\n\
  \n```java\npublic class DefaultConstructor {\n    DefaultConstructor() {\n     \
  \   //在此处编写语句\n    }\n    public static void main(String[] args) {\n        DefaultConstructor\
  \ = new DefaultConstructor();\n    }\n}\n```\n\n### 参数化构造函数\n\n带有参数的构造函数被称为参数化构造函数。这被称为构造函数重载。可以声明不相同但在参数数量、参数类型和参数顺序上有所不同的构造函数。我们根据不同的目的重载构造函数，并根据接收到的参数或输入来初始化内容。\n\
  \n```java\npublic class Car {\n    Car() {\n        System.out.println(\"默认构造函数\"\
  );\n    }\n    Car(int types) {\n        System.out.println(\"带有整数参数的构造函数\");\n\
  \    }\n}\n```\n\n\n\n\n\n```java\nCar(String model) {//带字符串参数的构造函数\n  System.out.println(\"\
  constructor with a string parameter\");\n}\n\nCar(float milage {//带浮型参数的构造函数\n \
  \ System.out.println(\"constructor with a float parameter\");\n}\n\nCar(String model,\
  \ tyres tyres {//带字符串和整数参数的构造函数\n  System.out.println(\"constructor with two parameters\
  \ sting and integer\");\n}\n\nCar(int types, String model) {//带整数和字符串参数的构造函数\n \
  \ System.out.println(\"constructor with two parameters integer and string\");\n\
  }\n\npublic static void main(String[] args) {\n  Car car = new Car();\n  new Car(2);\n\
  \  new Car(\"Porsche\");\n  new Car(3.4f);\n  new Car(\"Maruti\", 4);\n  new Car(6,\
  \ \"Honda\");\n}\n}\n```\n\n这里的每个构造函数都是唯一的，因为它们的方法签名不同。当方法的的方法签名（参数类型、参数数量和参数顺序）相同且顺序一致时，构造函数或方法可以被视为相同的。\n\
  \n## 关于构造函数的更多信息\n\n构造函数是从基类到派生类调用的。这意味着父类的构造函数先被调用，然后是子类的构造函数。我们将在接下来的章节中详细讨论父类和子类的概念。让我们通过以下示例程序来理解：\n\
  \n**示例 3.2**: 构造函数继承：\n\n```java\npublic class GrandchildClass extends ChildClass\
  \ {\n  GrandchildClass() {\n    System.out.println(\"Constructor from grandchild\
  \ class.\");\n  }\n  public static void main(String[] args) {\n    GrandchildClass\
  \ cp = new GrandchildClass();\n  }\n}\n\nclass ChildClass extends ParentClass {\n\
  \  ChildClass() {\n    System.out.println(\"Constructor from child class.\");\n\
  \  }\n}\n\nclass ParentClass {\n  ParentClass() {\n    System.out.println(\"Constructor\
  \ from parent class.\");\n  }\n}\n```\n\n**此程序的输出：**\n\n```\nConstructor from parent\
  \ class.\nConstructor from child class.\nConstructor from grandchild class.\n```\n\
  \n**解释**：程序始终从 `main` 方法开始执行。当执行到达程序的 `main` 方法内部时，该方法的第一步是创建一个 `GrandchildClass`\
  \ 的对象。此语句触发了对默认构造函数的调用，并在 `GrandchildClass` 类中找到了默认构造函数。此外，`GrandchildClass` 类继承自另一个类\
  \ `ChildClass`。然后，程序将移动到 `ChildClass` 并查找 `ChildClass` 下是否定义了构造函数。它发现有一个构造函数，并且该类继承自一个名为\
  \ `ParentClass` 的类。程序的光标移动到 `ParentClass` 并找到了一个构造函数。由于 `ParentClass` 没有继承自其他类，因此\
  \ `ParentClass` 的构造函数将被执行并打印第一行输出“Constructor from parent class.”。随后，它将执行 `ChildClass`\
  \ 构造函数并打印“Constructor from child class.”。之后，它到达执行开始的实际类，并执行 `GrandchildClass` 构造函数，打印“Constructor\
  \ from grandchild class.”。\n\n对于为什么会发生这种情况是否感到很熟悉，即为什么一个构造函数会一直调用其父类的构造函数？这都是由于\
  \ `super()` 关键字的。\n\n让我们详细讨论一下 `super` 方法。\n\n### super\n\n`super` 关键字用于调用父类中的构造函数。当我们声明任何构造函数时，该构造函数的第一条语句都是\
  \ `super()`。无论我们是否写它，构造函数的设计都是这样的。编译器会自动考虑构造函数的第一条语句 `super()`。我们也可以显式地添加。此 `super()`\
  \ 将调用父类的默认构造函数（不带参数的构造函数）。\n\n`super()` 关键字应该始终是构造函数的第一个语句。如果你尝试将 `super()` 写在第二位并在构造函数内部后续添加语句，编译器将抛出错误“Constructor\
  \ call must be the first statement in a constructor.”。\n\n你不能使用 `super` 关键字调用私有构造函数。使用\
  \ `super`，你只能调用定义的 protected 和 public 构造函数。如果你在声明构造函数时不写访问修饰符，默认情况下该构造函数的可见性将是 public。\n\
  \n**示例: 3.3** `super` 关键字的使用\n\n```java\npublic class SuperMethodEx extends SuperClass\
  \ {\n  public SuperMethodEx() {\n    super(\"Jorvee\");\n  }\n  public static void\
  \ main(String[] args) {\n    SuperMethodEx superMethodEx = new SuperMethodEx();\n\
  \  }\n}\n\nclass SuperClass {\n  SuperClass(String name) {\n    System.out.println(\"\
  This constructor received name argument \" + name);\n  }\n}\n```\n\n**输出：**\n\n\
  ```\nThis constructor received name argument Jorvee\n```\n\n如果父类中没有默认构造函数但有一个参数构造函数会发生什么？在这种情况下，我们如何调用父类的参数构造函数？\n\
  \n如果父类/父类中没有默认构造函数，则什么都不会执行，且不会报错。编译器将只检查并跳到下一步。但在参数构造函数的情况下，程序员必须使用相同的 `super`\
  \ 方法并具有完全相同的参数数量和顺序，显式地调用该父类的参数构造函数。如果我们不显式调用，编译器将产生编译时错误“Implicit super constructor\
  \ SuperClass() is undefined. Must explicitly invoke another constructor”。\n\n让我们通过一个例子来理解。\n\
  \n在这个程序中，我们有两个类——一个是 `SuperMethodEx`，另一个是 `SuperClass`。`SuperClass` 是 `SuperMethodEx`\
  \ 的父类。\n\n两个类都有构造函数。`SuperClass` 有一个参数构造函数，期望调用一个字符串。另一方面，`SuperMethodEx` 有一个默认构造函数。\n\
  \n**问题**：仔细观察程序并预测输出或错误，什么导致了问题？\n\n```java\nLine 1: public class SuperMethodEx\
  \ extends SuperClass{\nLine 2:   public SuperMethodEx() {\nLine 3:\nLine 4:   }\n\
  Line 5:\nLine 6:   public static void main(String[] args) {\nLine 7:     SuperMethodEx\
  \ superMethodEx = new SuperMethodEx();\nLine 8:\nLine 9:   }\nLine 10:}\nLine 11:\n\
  Line 12: class SuperClass {\nLine 13:\nLine 14:   SuperClass(String name) {\nLine\
  \ 15:     System.out.println(\"You have called ParentClass constructor with parameter\
  \ \" + name);\nLine 16:   }\nLine 17:}\n```\n\n**说明**：上述程序将抛出编译异常，因为父类中没有默认构造函数，而是参数构造函数，我们需要显式调用。\n\
  \n程序的第 2 行会导致编译错误。\n\n要修复此编译错误，请在第 3 行调用父类的参数构造函数，例如 `super(\"You Name\");`。\n\n\
  ### this\n\n`this` 关键字代表同类中的成员（例如，变量或方法）。`this` 的工作原理与 super 关键字 相似。在构造函数中，我们使用\
  \ `this()` 关键字来调用或引用定义在同类中的构造函数。应该是构造函数的第一条语句。如果你将 `this()` 写在第二条或之后，系统将产生编译错误。\n\
  \n一个类可以有任意数量的构造函数，通过 `this()` 关键字的帮助，构造函数可以与类中的其他构造函数进行通信。`this` 关键字充当兄弟之间的通信器，当我们想要相互交流时必须使用它。\n\
  \n\n\n\n\n### 示例 3.4: this 关键字的使用:\n\n```java\npublic class ConstructorThis\n{\n\
  \    ConstructorThis()\n    {\n        this(2);\n        System.out.println(\"Default\
  \ Constructor.\");\n    }\n    ConstructorThis(int i)\n    {\n        this(2,3);\n\
  \        System.out.println(\"Constructor with one argument.\");\n    }\n    ConstructorThis(int\
  \ i, int j)\n    {\n        this(2,3,4);\n        System.out.println(\"Constructor\
  \ with two arguments.\");\n    }\n    ConstructorThis(int i, int j, int k)\n   \
  \ {\n        System.out.println(\"Constructor with three arguments.\");\n    }\n\
  \    public static void main(String[] args) {\n        ConstructorThis constructorThis\
  \ = new ConstructorThis();\n    }\n}\n```\n\n**输出**:\n```\nConstructor with three\
  \ arguments.\nConstructor with two arguments.\nConstructor with one argument.\n\
  Default Constructor.\n```\n\n以下是一些有效和无效的构造函数定义示例：\n\n### 有效构造函数：\n\n- **有效语法**:\n\
  \    ```java\n    RecursiveConstructor() {\n    }\n    ```\n- **构造函数的第一条语句**: `Super`\
  \ 和 `this` 关键字总是第一条语句：\n    ```java\n    RecursiveConstructor() {\n        this(2);\n\
  \        System.out.println(\"Print your message\");\n    }\n    RecursiveConstructor(int\
  \ a) {\n        super();\n        System.out.println(\"Print your message\");\n\
  \    }\n    ```\n\n### 无效构造函数：\n\n- **同时使用 Super 和 this**: 你不能在构造函数的第二条语句中编写 super\
  \ 和 this：\n    ```java\n    ConstructorThis()\n    {\n        System.out.println(\"\
  Constructor.\");\n        this(2); // 这行代码将抛出编译错误。\n    }\n    ```\n    或者\n   \
  \ ```java\n    ConstructorThis()\n    {\n        System.out.println(\"Default Constructor.\"\
  );\n        super(2); // 这行代码将抛出编译错误。\n    }\n    ```\n- **Super 关键字**: 你不能在构造函数中编写多个\
  \ super：\n    ```java\n    public SuperMethodEx() {\n        super();\n        super(\"\
  Jorvee\");\n    }\n    ```\n- **私有构造函数**: 你不能调用父类中定义的私有构造函数：\n    ```java\n    public\
  \ class SuperMethodEx extends SuperClass {\n        public SuperMethodEx() {\n \
  \           super(\"Jorvee\");\n        }\n        public static void main(String[]\
  \ args) {\n            SuperMethodEx superMethodEx = new SuperMethodEx();\n    \
  \    }\n    }\n    class SuperClass {\n        private SuperClass(String name) {\n\
  \            System.out.println(\"This constructor received name argument \" + name);\n\
  \        }\n    }\n    ```\n- **带有返回类型的构造函数**: 你不能在构造函数中写返回类型：\n    ```java\n  \
  \  public String Car() {// 这将变成普通的 Java 方法。\n        System.out.println(\"default\
  \ constructor\");\n    }\n    public String Car() {\n        System.out.println(\"\
  default constructor\");\n        return \"String\";\n    }\n    ```\n- **相同的构造函数**:\
  \ 你不能声明并定义两个或多个具有相同方法签名的构造函数。这会让处理器在运行时对于调用哪个构造函数感到困惑：\n    ```java\n    ConstructorThis(int\
  \ i, int j) {}\n    ConstructorThis(int i, int j) {}\n    ```\n- **递归构造函数**: 递归调用是不可能的。它将抛出“Recursive\
  \ constructor invocation”的编译错误，如下：\n    ```java\n    Public class RecursiveConstructor\
  \ {\n        RecursiveConstructor() {\n            this(2);\n        }\n       \
  \ RecursiveConstructor(int a) {\n            this();\n        }\n    }\n    ```\n\
  \    或者\n    ```java\n    RecursiveConstructor() {\n        this();\n    }\n   \
  \ ```\n\n## 结论\n\n构造函数用于注入类的依赖或前提条件，并初始化类的成员变量。每个类都有一个默认构造函数。我们只需要提供该默认构造函数的定义。\n\
  \n在下一章中，我们将讨论 `static` 关键字以及在 `class`、`method` 和 `variable` 中使用 `static` 关键字的不同方法。`static`\
  \ 是一个非常强大的关键字，在我们程序的执行中起着至关重要的作用。\n\n## 记忆的要点\n\n- 单类中不允许存在两个或多个相同的构造函数。\n- 参数（Parameter）也称为参数（Argument）。例如，参数的数量可以指的是参数的数量。\n\
  - 构造函数只能调用一个父类构造函数。默认情况下，它会调用默认构造函数。当你显式作为构造函数的第一语句调用 `super()` 时，它将再次调用默认构造函数。如果你显式调用带参数的\
  \ `super`，则它将调用匹配参数的参数化构造函数，而不会执行父类的默认构造函数。\n- 构造函数的第一条语句始终是 `super()` 或 `this()`。\n\
  - Java 中不存在递归构造函数调用；它将抛出编译错误。\n\n## 多选题\n\n1. 使用哪个关键字从构造函数中调用构造函数？\n2. 使用哪个关键字在类中调用构造函数？\n\
  3. 一个类可以有多个一个构造函数。\n4. 构造函数允许哪些访问修饰符？\n\n## 答案\n\n1. **b**\n2. **a**\n3. **b**\n\
  4. **d**\n\n## 问题\n\n1. 什么是构造函数？\n2. 什么是构造函数重载？\n3. 什么是 super 关键字？我们为什么需要它？\n4.\
  \ 为什么我们不在构造函数中放置任何返回类型？\n5. 预测以下程序的输出：\n```java\npublic class SuperMethodEx extends\
  \ SuperClass {\n    public SuperMethodEx() {\n        super();\n        super(\"\
  Jorvee\");\n    }\n    public static void main(String[] args) {\n        SuperMethodEx\
  \ superMethodEx = new SuperMethodEx();\n    }\n}\nclass SuperClass {\n    SuperClass(){\n\
  \        System.out.println(\"rashid\");\n    }\n    SuperClass(String name) {\n\
  \        System.out.println(\"This constructor received name argument \" + name);\n\
  \    }\n}\n```\n6. `super()` 和 `this()` 的区别是什么？\n\n## 练习\n\n**练习 1**: 创建一个有两个构造函数的类并使用\
  \ this 调用构造函数。\n1. 创建一个带有 main 方法的 Human 类。\n2. 创建两个参数化构造函数；保持一个构造默认，另一个带字符串参数。\n\
  3. 在 Human 类中创建 main 方法，并在 main 方法下创建 Human 对象。\n4. 通过 this 关键字从默认构造函数调用参数化构造函数。\n\
  \n**练习 2**: 创建 Human 和 Heart 类。两个类都应该有默认构造函数。使用 `super()` 关键字调用父类的构造函数。\n1. 创建 Human\
  \ 和 Heart 类。声明 Human 类为 public，Heart 类为 protected。让 Human 类继承 Heart 类。\n2. 在两个类中创建构造函数。\n\
  3. 在 Human 类中创建 main 方法，并在 main 方法下创建 Human 对象。\n4. 使用 super 关键字调用 Heart 类的构造函数。\n\
  5. 执行程序。\n\n\n\n\n`static` 是 Java 以及其他编程语言中的关键字。它是一个强大的关键字，我们可以将其作为变量、类、方法和块的修饰符。在本章中，我们将通过示例讨论\
  \ Java 程序中不同形式的 `static` 用法。\n\n## 结构\n\n在本章中，我们将讨论以下主题：\n\n* static 关键字\n* 静态变量\n\
  * 静态方法\n* 静态代码块\n* 静态类\n* main 方法\n\n## 目标\n\n在成功完成本章后，你将能够：\n\n* 理解 `static` 关键字、`static`\
  \ 方法和 `static` 变量\n* 理解 `static` 在类和代码块中的作用\n* 解释为什么将类的 `main` 方法声明为 `static`\n\n\
  ## static 关键字\n\n我们在程序中使用 `static` 声明的任何内容都直接与类关联，并在类加载器将类加载到内存中时被加载。此外，所有声明为 `static`\
  \ 的项（即类的静态成员）会首先执行。由于这个结果，我们将 `main` 方法声明为 `static`。使用 `static` 声明的类、变量、方法和初始化块被称为类的静态成员。类的静态成员可以在创建该类的对象或实例的情况下访问。我们可以直接通过类名访问静态成员。\n\
  \n在 Java 6 之前，我们也可以使用 `static` 块来执行程序。但 Java 6 之后，Java 改变了程序的的设计和执行方式，始终从 `main`\
  \ 方法开始，尽管这是一个 `static` 方法，尽管 `static` 声明的项在类加载时就会加载到内存中。\n\n类加载器从上到下读取并加载类。因此，块、方法和变量等静态成员也按照它们在程序中从上到下的顺序被加载和执行。类类中的两个静态成员将按顺序执行。第\
  \ 1 行的成员先执行，然后执行第 2 行的成员。\n\n静态成员用于使我们的程序和应用程序内存高效。我们使用静态成员来引用公共属性，这些属性对于类的所有实例都保持不变。\n\
  \n让我们详细讨论静态成员。\n\n### 静态变量\n\n静态变量也被称为类变量。静态变量在类加载到 JVM 时加载到内存中。静态变量只会创建一个副本，该类的所有实例共享该变量的同一个副本。如果我们更新了静态变量的值，它将更新该类的所有实例。静态变量可以被覆盖任意次数。我们可以在不创建类对象的情况下通过类名访问静态变量。让我们通过示例来理解静态变量。\n\
  \n**示例 5.1**: 静态变量示例\n\n```java\npublic class StaticMember extends StaticBase{\n\
  \    static int score = 4 ;\n    public static void main(String arg[]) {\n     \
  \   StaticMember staticMember = new StaticMember();\n        System.out.println(\"\
  没有类和对象引用的静态变量: \" +score);\n        System.out.println(\"通过类对象访问静态变量: \" +staticMember.score);\n\
  \        score = 6; // 将 score 变量的值更新为 6。\n        StaticMember staticMemberTwo\
  \ = new StaticMember();\n        System.out.println(\"没有类和对象引用的静态变量: \" +score);\n\
  \        System.out.println(\"通过类对象访问静态变量: \" +staticMemberTwo.score);\n    }\n\
  }\nclass StaticBase {\n    StaticBase() {\n        System.out.println(\"基类中静态变量\
  \ score 的值: \" +StaticMember.score);\n    }\n}\n```\n\n**输出**:\n\n```\n基类中静态变量 score\
  \ 的值: 4\n没有类和对象引用的静态变量: 4\n通过类对象访问静态变量: 4\n基类中静态变量 score 的值: 6\n没有类和对象引用的静态变量: 6\n\
  通过类对象访问静态变量: 6\n```\n\n### 静态方法\n\n静态方法用于处理类的公共功能。静态方法不能被重写。这意味着静态方法中给出的定义永远不会改变，任何类和对象都无法更改静态方法的定义。它也可以被创建用于在类的实例之间共享公共功能，或者用于类在创建对象/实例之前需要执行的任何操作。声明静态方法的语法如下：\n\
  \n`<修饰符> static <返回值><方法名> () {}`\n\n静态方法只能访问静态变量。静态方法内部不允许使用非静态变量。我们不能在 `static`\
  \ 方法内部声明静态变量，但我们可以在静态方法内部声明普通变量和 final 变量：\n\n**示例 5.2**: 静态方法示例：\n\n```java\npublic\
  \ class StaticMem {\n    static int countryCode;\n    static void staticMethod()\
  \ {\n        countryCode = 23;\n        final String name = \"India\";\n       \
  \ String lastName = \"AA\";\n        System.out.println(lastName);\n    }\n    public\
  \ static void main(String[] args) {\n        staticMethod();\n    }\n}\n```\n\n\
  **输出**:\n\n```\nAA\n```\n\n### 静态代码块\n\n静态方法用于处理类的公共功能（*注：此处原文内容重复了静态方法的描述，翻译保持其原文结构逻辑*）。静态方法不能被重写。这意味着静态方法中给出的定义永远不会改变，任何类和对象都无法更改静态方法的定义。它也可以被创建用于在类的实例之间共享公共功能，或者用于类在创建对象/实例之前需要执行的任何操作。声明静态方法的语法如下：\n\
  \n`<修饰符> static <返回值><方法名> () {}`\n\n静态方法只能访问静态变量。静态方法内部不允许使用非静态变量。我们不能在 `static`\
  \ 方法内部声明静态变量，但我们可以在静态方法内部声明普通变量和 final 变量：\n\n（*注：此处原文再次重复了静态方法的描述，翻译保持其原文结构逻辑*）\n\
  \n静态块没有任何名称。我们只需使用 `static` 关键字和块 `{}`。静态块的声明如下：\n\n```java\nstatic {\n    //编写一些内容\n\
  }\n```\n\n让我们通过一个场景来理解静态块。我们在程序中写了一些函数，这在 Java 中已经可用。许多内置库和类都是这样实现的。\n\n这里有一个使用静态块打印消息的示例：\n\
  \n**示例 5.3**: 使用静态块打印消息：\n\n```java\npublic class StaticMember {\n    static {\n\
  \        System.out.println(\"静态块\");\n    }\n    public static void main(String\
  \ arg[]) {\n    }\n}\n```\n\n**输出**:\n\n```\n静态块\n```\n\n我们不能在静态块内部声明静态变量和方法。但我们可以使用静态块来初始化静态变量。让我们做一个练习并理解程序中的静态块。\n\
  \n**示例 5.4**: 静态块中的静态成员：\n\n```java\npublic class StaticMember {\n    static int\
  \ rem ;\n    static {\n        rem = 3;\n    }\n    public static void main(String\
  \ arg[]) {\n        System.out.println(StaticMember.rem);\n    }\n}\n```\n\n**输出**:\n\
  \n```\n3\n```\n\n此外，我们不能在静态块内部访问非静态变量。静态块不能嵌套，这意味着我们不能在一个静态块内部创建另一个静态块。让我们练习另一个示例，在静态块中使用非静态变量。\n\
  \n**示例 5.5**: 静态块中的非静态变量：\n\n```java\nint countryCode;\nstatic {\n    countryCode\
  \ = 91; //无法对非静态字段 countryCode 进行静态引用\n    static {//这是非法的，我们不能创建嵌套静态\n    System.out.println(\"\
  静态块中的静态块\");\n    }\n}\n```\n\n在前面的示例中，程序将无法执行并抛出编译错误。变量 `countryCode`是非静态的，而我们正尝试在静态块内部访问非静态变量。此外，我们在这里创建了嵌套静态块，这是非法的。\n\
  \n### 静态类\n\n\n\n\n静态类是一种可以在不创建该类对象/实例的情况下被另一个类访问的类。我们不能创建静态外部类，或者可以说，在 Java 中没有“静态类”这个术语。但我们有静态嵌套类，并且可以将内部类设为静态的。静态嵌套类不能调用类实例的非静态成员。可以在不创建外部类实例的情况下访问静态嵌套类：下面是一个静态类的示例，请在机器上运行此类并体验静态类与非静态类之间的区别。\n\
  \n**示例 5.6**：静态内部类和实例创建：\n\n```java\npublic class StaticClassEx {\n    static class\
  \ InnerClass {\n    }\n    class InnerNoStatic {\n    }\n    public static void\
  \ main(String[] args) {\n        InnerNoStatic noStatic = new InnerNoStatic(); //\
  \ 访问类型为 StaticClassEx 的外部实例。\n        必须使用类型为 StaticClassEx 的外部实例进行分配（例如 x.new A()，其中\
  \ x 是 StaticClassEx 的实例）。\n        InnerClass innerClass = new InnerClass();\n \
  \   }\n}\n```\n\n**解释：** 在上一个示例中，我们看到可以在没有外部类帮助/引用的情况下创建静态内部类 `InnerClass` 的实例。但同样，如果我们尝试创建非静态内部类\
  \ `InnerNoStatic` 的实例，编译器会生成错误。要修复此编译错误，我们必须更新逻辑，例如为非静态成员创建实例。首先，我们创建了外部类 `StaticClassEx`\
  \ 的实例。然后，通过该外部类的引用创建内部类的实例：\n\n```java\nStaticClassEx staticClassEx = new StaticClassEx();\n\
  InnerNoStatic noStatic = staticClassEx.new InnerNoStatic();\n```\n\n### main 方法\n\
  \n程序的执行始终从 main 方法开始。每个 Java 程序都必须包含一个 main 方法，以识别执行点并启动程序或应用程序进程的执行。main 方法是 Java\
  \ 程序执行的入口，随后将根据应用程序/程序的需求调用其他语句、方法和类。main 方法的语法由此签名固定：\n\n`public static void main(String[]\
  \ args)`\n\nmain 方法的访问修饰符将始终是 public，并带有 static 关键字。你可以更改这两个关键字的顺序，可以写成 static public\
  \ 或 public static；两种顺序都是有效的。\n\nmain 方法从不返回任何数据，因此它被声明为 void（void 代表空和无）。\n\n然后，我们有关键字\
  \ `main`，在括号内是一个数组类型的参数。你可以给该参数起任何名称。\n\n为了这一目的并满足要求，我们将 main 方法声明为静态，这样类加载器会将方法加载到内存中，JVM\
  \ 在不创建该类实例的情况下执行它。\n\n我们可以重载 main 方法，但 JVM 将执行具有单个字符串数组参数的 main 方法。类中的其他 main 方法必须像调用静态方法一样显式地调用：\n\
  \n**示例 5.7**：main 方法在 Java 中的工作原理以及重写 main 方法：\n\n```java\npublic class MultipleMainMethods\
  \ {\n    public static void main(int[] args) {\n        System.out.println(\"Main\
  \ with Integer argument.\");\n    }\n    public static void main(String[] args)\
  \ {\n        System.out.println(\"Main with String argument.\");\n        int[]\
  \ arr = {1,2,4};\n        main(arr);\n    }\n}\n```\n\n**输出：**\n\n```\nMain with\
  \ String argument.\nMain with Integer argument.\n```\n\n## 结论\n\nstatic 关键字在设计你的应用程序和软件时起着至关重要的作用。使用\
  \ static，你可以为整个应用程序或类创建通用内容，整个应用程序中的类所有实例都可以访问同一个静态实例以完成执行。它对于内存管理也非常有帮助。\n\n在类中，我们可以创建静态变量、字段、方法、嵌套类、内部类或静态块，所有这些成员都可以在没有类实例的情况下被访问。在下一章中，我们将讨论字符串（string）。string\
  \ 是一种数据类型，也是一个类。String 是强大的，并帮助我们在 Java 编程中处理数据。\n\n## 记忆点\n\n*   我们不能在内部类中声明静态方法。\n\
  *   我们不能在静态块内部声明静态变量。\n*   只有 final 变量在静态块内部是合法的。\n*   你可以仅通过使用类名来访问和调用静态成员。我们不需要创建类的对象即可访问静态成员。\n\
  *   除非类是另一个类的成员，否则类不能是静态的。\n\n## 单选择题\n\n1.  **我们可以重写类的 main 方法。**\n    1. 正确\n\
  \    2. 错误\n2.  **静态块可以访问类的非静态成员。**\n    1. 正确\n    2. 错误\n3.  **此程序的输出将是什么？**\n\
  \    ```java\n    public class StaticVariables {\n        public int score;\n  \
  \      static void assignValue() {\n            score = 320;\n            System.out.println(\"\
  Current score is: \" + score);\n        }\n        public static void main(String[]\
  \ args) {\n            assignValue();\n        }\n    }\n    ```\n    1. 编译错误\n\
  \    2. Current score is: 320\n    3. 运行时错误\n    4. 320\n\n## 答案\n\n1.  **a**\n\
  2.  **b**\n3.  **a**\n\n## 问题\n\n1.  什么是静态成员？\n2.  创建一个带有静态变量的类，并在静态方法中分配并打印该变量。\n\
  3.  创建静态块和静态嵌套类的目的是什么？\n\n## 术语\n\n*   **内部类 (Inner class)**：另一个类内部类，或者是另一个类的成员\n\
  *   **嵌套类 (Nested class)**：单个 Java 程序中的多个类\n\n## 词汇表\n\n1.  [`docs.oracle.com/javase/tutorial/java/javaOO/nested.html`](https://docs.oracle.com/javase/tutorial/java/javaOO/nested.html)\n\
  \n\n\n\n`String` 是一种非常强大的数据类型，可以存储任何类型的数据，包括转义字符。`String` 解决了存储多个字符值的问题，因为 `char`\
  \ 仅支持单个字符，而我们无法在 `char` 类型变量中存储一个以上的字符。在 `String` 变量中，我们可以放置一行字符。这里有一个创建一个 `String`\
  \ 变量的示例：\n\n例如：\n\n```\nString text = “This is a string variable declared using\
  \ the String data type”;\n```\n\n我们也可以声明 `String` 对象来存储文本数据。使用 `new` 关键字，我们创建了一个\
  \ `String` 类的对象。例如：\n\n```\nString text = new String(“This is a string variable\
  \ declared using the String data type”);\n```\n\n## String 字面量 (String literal)\n\
  \nString 字面量是在不创建 `String` 类对象的情况下创建变量的概念。我们可以简单地使用 `String` 关键字作为数据类型，并像声明基本数据类型那样声明变量。每当编译器在代码中发现任何\
  \ `String` 字面量时，编译器都会自动创建一个带有字符串字面量值的 `String` 对象。\n\n在这里，我们将看到一些 `String` 字面量的示例：\n\
  \n```\nString firstName = “Samantha”;\n```\n\n在这里，编译器将自动创建一个值为 `Samantha` 的 String\
  \ 对象 `firstName`。\n\n所有变量和方法直接存储在堆内存下。在堆内部，**Java 虚拟机** (`JVM`) 创建了一个名为字符串池（String\
  \ pool）的单独内存区域来管理 `String` 字面量。`JVM` 还确保内存中不会有两个或多个对象的内容相同。当编译器遇到 `String` 字面量时，它会检查字符串池，查找是否存在完全相同的\
  \ String 内容/值。如果找到匹配，则新字面量的引用将指向现有的 String，内存中不会创建新的 `String` 字面量对象。因此，从内存角度来看，一旦字面量的内存分配分配我们就无法更改它的值。这种行为使得\
  \ String 是不可变的。字符串池始终为内容分配内存，正因如此，String 内容获得了内存分配而不是变量名，而变量名仅持有堆内存中字面量值的引用（地址）。当我们尝试更改字面量的值时，它实际上在堆中为该值分配新内存，并将变量的引用更新为新值。让我们通过示例来理解。\n\
  \n下面的[图 6.1] 是这些变量内存分配的图形表示：\n\n![](img/figure-6.1.jpg)\n\n**图 6.1:** 字符串池内存管理\n\
  \n我们创建了两个 `String` 字面量 `name` 和 `name2`，并为这两个字面量分配了相同的值 `rashid`。在程序的第一个语句中，编译器将执行\
  \ String `name`，String 值 `rashid` 的内存被分配在字符串池中，因为此时字符串池中还不存在内容 `rashid`。然后，编译器执行下一个\
  \ String `name2`，并在字符串池中查找是否已经存在完全相同的 String 值。编译器发现 `rashid` String 已经在字符串池中了。它没有为\
  \ `name2` String 值分配新内存，而是将相同 String 值 `rashid` 的地址设置给变量 `name2`。在这种情况下，`name` 和\
  \ `name2` 都指向值 `rashid` 的同一个内存地址。\n\n我们在这里通过 `new` 关键字借助 `String` 类创建了另一个对象。每当我们使用\
  \ `new` 关键字创建对象时，该对象在内存中都会获得单独的分配，尽管它持有相同的值。在这里，`name3` 是我们创建的对象，并分配了与与 `name` 和\
  \ `name2` 相同的值。然而，为 `name3` 分配了单独的内存。\n\n让我们用 Java 程序来创建并理解上述场景。\n\n**示例 6.1**:\
  \ 字符串池内存分配：\n\n```\npublic class StringPool {\n  public static void main(String[]\
  \ args) {\n    String name = \"rashid\";\n    String name2 = \"rashid\";\n    String\
  \ name3 = new String(\"rashid\");\n    System.out.print(\"Address for both name\
  \ and name2 are same? \");\n    System.out.print(name==name2);\n    System.out.print(\"\
  , and value for both variables is? \"+name.equals(name2));\n    System.out.println();\n\
  \    System.out.print(\"Address for both name2 and name3 are same? \");\n    System.out.print(name2==name3);\n\
  \    System.out.print(\", and value for both variables is? \"+name2.equals(name3));\n\
  \    System.out.println();\n    System.out.print(\"Address for both name3 and name\
  \ are same? \");\n    System.out.print(name3==name);\n    System.out.print(\", and\
  \ value for both variables is? \"+name3.equals(name));\n    System.out.println();\n\
  \  }\n}\n```\n\n**输出：**\n\n```\nAddress for both name and name2 is the same? true,\
  \ and value for both variables are? true\nAddress for both name2 and name3 are same?\
  \ false, and value for both variables are? true\nAddress for both name3 and name\
  \ are same? false, and value for both variables are? true\n```\n\n在述述示例中，你可以看到程序的输出。当我们使用\
  \ `==` 运算符比较变量 `name` 和 `name2` 时，它返回 `true`，因为 `==` 比较的是内存地址而不是值。而当我们使用 `==` 比较\
  \ `name2` 和 `name3` 时，它返回 `false`，因为它们指向两个不同的对象。但如果我们使用 `equals()` 方法来比较它们的值，它会返回\
  \ `true`，因为两个变量的值相同。\n\n\n\n\n\n`endsWith(String)` 方法返回 `Boolean`，并接收一个类型为 `char`\
  \ 的参数。它将给定 `String` 最后一个索引处的字符与传入参数的 `char` 进行匹配；如果在 `String` 的最后一个索引处找到了该字符，则返回\
  \ `true`；否则返回 `false`。\n\n```\nString word=\"running\";\nSystem.out.println(word.endsWith(\"\
  g\"));\n```\n\n在这里，`print` 语句将打印 true，因为声明的 `word` 变量以字符 `g` 结尾：\n\n```\nSystem.out.println(word.endsWith(\"\
  n\"));\n```\n\n上一个打印语句将打印 `false`，因为声明的 `word` 变量以字符 `g` 结尾，而不是 `n`。\n\n注意：您可以使用\
  \ `startWith()` 方法来检查字符串是否以某个字符开头。例如 `word.startWith(“r”)`；\n\n### substring(begin)\
  \ or substring(begin, end)\n\n`substring(begin)` 或 `substring(begin, end)` 方法返回\
  \ `String`。该 `String` 将是给定 `String` 的子字符串。要从 `String` 中创建子字符串，我们需要指定起始点或起始和结束索引。我们在\
  \ `String` 类中有两个子字符串方法。其中一个是带单个参数的，它只接收字符串的起始索引并返回该起始索引之后的剩余字符串值。另一个子字符串方法接收两个参数\
  \ `start` 和 `end` 索引；作为返回，它将给出给定索引之间的字符串值。让我们通过示例来理解这一点：\n\n```\nString word=\"\
  Rahul was running that day\";\nSystem.out.println(word.substring(18));\n```\n\n\
  上一个 `substring` 方法将打印子字符串 `“that day”`。由于我们在 `substring` 方法中传递了索引数字 18，因此第 18 个索引将是起始点，之后将打印单词的剩余文本。\n\
  \n```\nSystem.out.println(word.substring(10, 17));\n```\n\n上一个 `substring` 方法将从句子“Rahul\
  \ was running that day”中仅打印文本 `“running”`。如果你查看 `substring` 方法中的参数，会发现这次我们传递了两个参数——第一个是起始索引，第二个是结束索引。因此，子字符串将打印从索引\
  \ 10 到 17 的字符。\n\n### split(regex)\n\n`split(regex)` 方法返回 `Strings` 并接收 `regex`\
  \ 作为参数。该方法常用于根据字符拆分句子和单词：\n\n```\nString sentence =\"this_isth&new message\";\n\
  String[] newwords = sentence.split(\"[&|+|]\");\nfor(inti=0;i<newwords.length;i++)\
  \ {\n    System.out.println(newwords[i]);\n}\n```\n\n上一个代码段可以在任何 Java 程序中执行。在这里，我们将\
  \ `String` 句子拆分为单词并使用系统控制台打印。我们根据 `String` 中存在的不同特殊字符（如 `&`、`+` 和 `()` 空）来拆分句子。\n\
  \n在正则中，`re` 传递了 `[&|+|]`，字符 `|` 是或（OR）操作的分符。\n\n### matches(regex)\n\n`matches(regex)`\
  \ 方法返回 `Boolean` 并接收 `regex` 作为参数。如果给定字符串匹配给定的 `regex` 模式，则返回 `true`；否则返回 `false`。\n\
  \n```\nString regex = \"\\\\w.*\";\nString word=\"this_isth&new message\";\nSystem.out.println(word.matches(regex));\n\
  ```\n\n上一个代码片段可以可以直接粘贴到 main 方法并执行。在上一个代码中，我们通过 `regex` 检查 `String word` 是否包含任何单词。在结果中，这将给你输出\
  \ `true`。\n\n正则解释：最前面的 `\\` 用于转义字符，`\\w` 匹配任何单词字符（等同于 `[a-zA-Z0-9_]`），`.*` 匹配任何字符（行终止符除外）。\n\
  \n## StringBuffer\n\n`StringBuffer` 类似于 `String` 类，我们用它创建 `String` 对象来操作字符串数据。我们必须显式创建一个\
  \ `StringBuffer` 对象，然后才能在其中存储值。`String` 和 `StringBuffer` 的唯一区别是 `String` 是不可变的，而\
  \ `StringBuffer` 是可变的，这意味着我们可以更新存储在 `StringBuffer` 对象的值。此外，我们可以直接使用 `String` 字面量在不创建对象的情况下声明\
  \ `String`，但我们不能那样声明 `StringBuffer`。`StringBuffer` 拥有 `reverse()` 和 `delete()` 方法，而\
  \ `String` 并不具备。\n\n`StringBuffer` 也像 `String` 一样是线程安全的，它的方法是同步的。`StringBuffer`\
  \ 不允许多个线程同时使用和操作对象；它只允许一个线程使用对象，其他想要使用的线程将进入等待队列，并逐个使用 `StringBuffer` 对象。\n\n声明\
  \ `StringBuffer` 的语法：\n\n```\nStringBuffer <objectName> = new StringBuffer();\n\
  ```\n\n`StringBuffer` 的默认初始容量为 16，它会根据你的数据不断增加。我们可以在创建 `StringBuffer` 对象时指定初始容量：\n\
  \n```\nStringBuffer sb = new StringBuffer(10);\n```\n\n在这里，`StringBuffer` 对象 `sb`\
  \ 的声明将具有 16 的默认容量。你可以使用 `capacity()` 方法来检查 `StringBuffer` 的容量：\n\n当我们声明对象时传递 `int`\
  \ 参数，它将设置对象的容量。这里，`StringBuffer` 创建了一个初始存储大小为 10 的对象。由于较大的值导致溢出时，`StringBuffer`\
  \ 会自动增大大小以存储字符。\n\n### append(“string”)\n\n`append(\"string\")` 方法用于在 `StringBuffer`\
  \ 末尾添加值。`StringBuffer.append()` 方法接收一个 `String` 类型的参数。\n\n### insert(start, “String”)\n\
  \n`insert(start, \"String\")` 方法用于在指定索引处插入任何值或数据而不替换现有数据。它会在指定的索引处插入数据，并将之后的数据移动。该方法接收两个参数——第一个参数是指定起始索引的整数，第二个参数是要存储在对象中的\
  \ `String` 值。\n\n### reverse()\n\n`reverse()` 方法用于反转存储在对象中的 `String`。例如，如果我们想从另一个方向读取单词，可以使用\
  \ `reverse` 方法。\n\n```\nString name = “JAVA”;\nString reverseName = StringBuffer.reverse(name);\n\
  ```\n\n上行代码将在控制台打印 `AVAJ`。\n\n### delete(start, end)\n\n`delete(start, end)` 方法接收两个整数参数（`start`\
  \ 和结束索引）。该方法用于从指定的起始和结束索引删除 `String` 数据。\n\n**示例 6.2**: StringBuffer 示例：\n\n```\n\
  public class StringBufferEx {\n    public static void main(String[] args) {\n  \
  \      StringBuffer sb = new StringBuffer();\n        System.out.println(sb.capacity());\n\
  \        sb.append(\"This is an \");\n        sb.append(\"object of \");\n     \
  \   sb.append(\"StringBuffer\");\n        System.out.println(sb);\n        sb.delete(0,\
  \ 4);\n        sb.insert(0, \"That\");\n        System.out.println(sb);\n      \
  \  sb.reverse();\n        System.out.println(sb);\n        System.out.println(sb.capacity());\n\
  \    }\n}\n```\n\n**输出：**\n\n`16`\n\n`This is an object of StringBuffer`\n\n`That\
  \ is an object of StringBuffer`\n\n`reffuBgnirtSfotcejbonasitahT`\n\n`34`\n\n\n\n\
  \n在之前的 `StringBuffer` 示例中，第 4 行我们声明了一个 `StringBuffer` 类的对象 `sb`。在第 5 行声明之后，我们在控制台上打印了该对象的容量，输出结果为\
  \ 16。\n\n然后，从第 6 行到第 8 行，我们向 `sb` 对象中存了一些数据。在第 9 行，我们编写了打印对象 `sb` 的语句，输出结果为 `“This\
  \ is an object of StringBuffer”`。\n\n在第 10 行，我们使用 `delete()` 方法删除了从索引 0 到 4 的字符。\n\
  \n在代码的第 11 行，我们在 String 对象的开头插入了字符串 `“That”`。因此，我们在 `insert` 方法中传递了索引 0 和字符串 `“That”`。\n\
  \n同样在第 12 行，我们在控制台上打印了对象 sb，输出结果为第 3 行所示 `“That is an object of StringBuffer”`。在这里，你可以看到新插入的值已经替换了被删除的值。\n\
  \n在代码的第 13 行，我们反转了存储在 `sb` 对象中的 String 数据，在紧接的一行中，我们编写了打印对象 sb 当前值的语句。结果显示，控制台上打印了\
  \ `“reffuBgnirtSfotcejbonasitahT”`。\n\n在代码的第 15 行，我们再次检查并打印了对象 sb 的当前容量。这将返回对象的当前容量或该对象中存储的字符数，作为结果，它打印了\
  \ 34（这是对象中 `char` 的数量）。\n\n## StringBuilder\n\nStringBuilder 与 `StringBuffer` 几乎相同，不同之处\
  \ `StringBuilder` 不是线程安全的，且方法没有同步机制。所有方法、特性和声明方式都与我们见过的 `StringBuffer` 相同。\n\n###\
  \ 声明 StringBuilder 的语法：\n\n```\nStringBuilder <objectName> = new StringBuilder();\n\
  ```\n\n**注意：Java 编程语言还支持一些用于 `char` 和字符串字面量的特殊转义序列：`\\b`（退格）、`\\t`（制表符）、`\\n`（换行）、`\\\
  f`（分页）、`\\r`（回车）、`\\\"`（双引号）、`\\'`（单引号）以及 `\\\\`（反斜杠）。**\n\n## 结论\n\n为了管理和存储字符串数据，Java\
  \ 三个三个 类——`String`、`StringBuffer` 和 `StringBuilder`。字符串字面量在 JVM 中有一个唯一的标识，它会在内部创建\
  \ `String` 类的对象。我们无法创建这些 String 类的子类，因为它们都是 final 类。我们可以在 String 中存储任何类型的数据或值，包括特殊字符或转义字符。String\
  \ 是不可变的，但 `StringBuffer` 和 `StringBuilder` 是可变的。\n\n这些类都是为了不同的目的设计的。根据我们的需求，我们可以选择正确的类来操作字符串数据。\n\
  \n在下一章中，我们将讨论数组和枚举数据类型。数组是一个在单个变量中存储相同数据类型的多个值的集合，而枚举用于声明常量变量。\n\n## 注意事项\n\n* \
  \  `String` 对象在 String 常量池中创建。我们可以在不使用 `new` 关键字的情况下创建 `String` 类对象。\n*   `String`\
  \ 和 `StringBuffer` 是线程安全的，它们的方法是同步的。\n*   `StringBuffer` 和 `StringBuilder` 是可变的。\n\
  *   `String` 是不可变的。\n*   `Strings` 拥有 `equals()` 和 `hashcode()` 方法来操作字符串。\n*   `StringBuffer`\
  \ 和 `StringBuilder` 拥有 `reverse()` 和 `delete()` 方法。\n*   我们无法创建 `String`、`StringBuffer`\
  \ 和 `StringBuilder` 类的子类。\n\n## 多选题\n\n1.  **使用哪个 String 方法来比较两个字符串的文本？**\n    1.\
  \ `substring()`\n    2. `equal()`\n    3. `compareTo()`\n    4. `equals()`\n\n2.\
  \  **`split()` 方法用于：**\n    1. 根据指定的正则表达式分割给 `String`\n    2. 比较两个或多个 String 地址\n\
  \    3. 将 `String` 拆分为子字符串\n    4. 从给定的字符串中删除字符串的一部分\n\n3.  **以下哪项不是声明 StringBuffer\
  \ 的有效方式？（多选）**\n    1. `StringBuffer stringB = new StringBuffer();`\n    2. `String\
  \ stringB = new StringBuffer();`\n    3. `StringBuffer stringB = new StringBuffer(35);`\n\
  \    4. `StringBuffer stringB = “value”;`\n\n## 答案\n\n1.  **d**\n2.  **a**\n3. \
  \ **b and d**\n\n## 题目\n\n1.  写出 `StringBuilder` 和 `StringBuffer` 的区别？\n2.  预测以下程序的输出：\n\
  ```\nPublic static void main(String args[]) {\n    StringBuffer sb2 = new StringBuffer();\n\
  \    sb2.append(\"My name is \");\n    sb2.insert(11, \"Gerard\");\n    System.out.println(sb2);\n\
  }\n```\n3.  `append()` 是做什么的？\n4.  如何将字符串转换为大写和小小写？\n\n\n\n\n数组根据索引号存储值，索引从 0 开始。例如，如果我们在数组中存储\
  \ 5 个值，那么这些值的索引将是 0, 1, 2, 3 和 4。数组的大小可以通过 `n-1` 计算，其中 `n` 是数组中元素的数量。\n\n声明数组的语法：\n\
  \n`<data type>[] <name of array>`\n\n或\n\n`<data type><name of array>[]`\n\n`空数组`\n\
  \n`String cars[] = null;`\n\n`给数组赋值。`\n\n`cars[0] = “Audi”;`\n\n`cars[1] = “BMW”;`\n\
  \n## 数组的创建与初始化\n\n`int[] arrayName = {1, 2, 3, 4, 5};`\n\n创建固定大小或长度的数组\n\n`int[]\
  \ arrayName = new int[5]`\n\n我们用大括号 `{}` 包数组变量，并用逗号 (`,`) 隔开数组的值或元素。\n\n我们不能在声明后分配带有连续值的数组。因此，当我们想要给数组分配一组连续的值时，必须在声明时完成。\n\
  \n## 访问数组\n\n存储在数组类型变量中的值通过其索引号进行访问。此外，要在数组中添加或删除值，我们将全部使用它们的索引号。让我们通过一个示例来理解数组的索引。\n\
  \n**示例**：\n\n`String cityName[] = {“Delhi”, “Mumbai”, “Kolkata”}; //line 1`\n\n\
  `cityName[3] = “Chennai” //line 2`\n\n`System.out.println(cityName[1]); //line 3`\n\
  \n让我们理解前面的语句。在第 1 行中，我们创建了一个字符串类型的数组 `cityName`，并用三个初始城市名作为元素初始化 `cityName`。`Delhi`、`Mumbai`\
  \ 和 `Kolkata` 是 `cityName` 数组的元素。Delhi 位于索引零，Mumbai 存储在索引一，Kolkata 存储在索引二。这将形成一个长度为\
  \ 3 的数组。\n\n![](img/c07table1.jpg)\n\n在第 2 行，我们在 `cityName` 数组的第四位置（索引号三）添加了一个元素。现在，由于我们在\
  \ `cityName` 数组中增加了一个城市名称，元素数量增加到了 4。现在，问题是如果我们写 `cityName[2] = “Chennai”` 会发生什么？它将替换之前的那个元素。在我们的案例中，它将用\
  \ Chennai 替换 Kolkata。新的数组元素将是 `{“Delhi”, “Mumbai”, ”Chennai”}`。\n\n# 数组类中的方法\n\n\
  `Array` 类中有很多方法，可以帮助我们让评估更快、更简单。在本章中，我们将看到一些方法的示例。\n\n## 复制数组\n\n我们可以将元素从一个数组复制到另一个数组，也可以只将数组的少数元素复制到另一个。这在\
  \ Java 编程中被称为复制数组。\n\n执行此任务有两种简单的方法：\n\n1. 你可以简单地将一个数组赋值给另一个数组，这将该数组中的所有值复制到新数组中。\n\
  \n    `int[] a = {1,3,4,5};`\n\n    `int b[] = a;`\n\n另一种方法是使用 copy Array 方法：\n\n\
  \    `int[] c = new int[b.length];`\n\n让我们通过一个示例来理解数组的复制：\n\n    **示例 7.1**：复制数组示例：\n\
  \n    ```java\n    public class CopyTwoArrays {\n        public static void main(String[]\
  \ args) {\n            int[] a = {9,2,13,6};\n            int[] b = {3,5};\n   \
  \         int c[] = a;\n            System.out.println(\"Values of array b.\");\n\
  \            for(int i=0; i<b.length; i++) {\n                System.out.println(c[i]);\n\
  \            }\n            int[] d = new int[c.length];\n            System.out.println(\"\
  Values of array c.\");\n            for(int i=0; i<d.length; i++) {\n          \
  \      System.out.println(c[i]);\n            }\n        }\n    }\n    ```\n\n \
  \   **输出：**\n\n    ```\n    Values of array b.\n    9\n    2\n    Values of array\
  \ c.\n    9\n    2\n    13\n    6\n    ```\n\n## 枚举 (Enum)\n\n枚举是一种特殊数据类型，用于声明一组具有相似含义的变量常量列表。例如，我们创建枚举来管理月份列表、星期名称以及其他类似值的列表。\n\
  \n我们通过 `enum` 关键字声明枚举，由于它持有的是常量值，因此限制是使用大字母写值。\n\n在常见的现实场景中，我们可以将枚举理解为具有含义的代码简写。在编程中，当我们想要向最终用户隐藏实际数据时，我们倾向于使用枚举。例如，在我们的程序中，我们希望用户输入一个数字，\
  \ 0 代表周日，7 代表周六。但当我们为这些数字设置枚举时，我们将使用天的名称而不是序列 0 或 1，这将是周日、周一等，随后我们进一步在程序中使用它进行评估。通过这种方式，我们还可以误导黑客识别程序中使用了什么值，他们无法轻易破解使用枚举编写的程序。让我们通过示例来理解这一点：\n\
  \n    **示例 7.2**：枚举常量示例：\n\n    ```java\n    public enum Day {\n        MONDAY,\
  \ TUESDAY, WEDNESDAY, THURSDAY, FRIDAY, SATURDAY, SUNDAY\n    }\n    ```\n\n   \
  \ 这里，我们声明了一个枚举 `Day`，它持有周日的名称。\n\n    现在，在程序中访问此常量变量：\n\n    `<name of enum>.<constant\
  \ name>`\n\n    例如，`Day.MONDAY`\n\n    ```java\n    public class EnumImpl {\n  \
  \      public enum Day {\n            MONDAY, TUESDAY, WEDNESDAY, THURSDAY, FRIDAY,\
  \ SATURDAY, SUNDAY\n        }\n    }\n    ```\n\n## 结论\n\n数组是处理相同类型值集合的特殊数据类型，简单来说，数组存储多个相同数据类型的值。存储在数组中的每个值都有一个地址，即索引，通过该索引我们可以设置和获取值。\n\
  \n\n\n\n`Enum` 是一种用于创建常量列表的特殊数据类型，且枚举也可以作为类类型使用。\n\n## 要点\n\n- `Enum` 类型仅用于常量。\n\
  - 我们可以在一个数组变量中存储多个具有相同数据类型的值。\n- 数组元素的地址被称为 `index`（索引）。通过 `index`，我们可以操作 `array`（数组）中的值。\n\
  \n## 选题\n\n1. **下列哪种是声明和赋值数组变量的正确方法？**\n    1. `String flowers[] = {“Rose”,”Lily”,”Sunflower”,”Tulip”};`\n\
  \    2. `String[] flowers = “Rose”,”Lily”,”Sunflower”,”Tulip”;`\n    3. `String[]\
  \ flowers[] = {“Rose”,”Lily”,”Sunflower”,”Tulip”};`\n    4. `int flowers[] = {“Rose”,”Lily”,”Sunflower”,”Tulip”};`\n\
  \    5. `String flowers[] = [“Rose”,”Lily”,”Sunflower”,”Tulip”];`\n\n2. **下列哪种是声明枚举的正确方法？**\n\
  \    1. `public enum Day {MONDAY, TUESDAY, WEDNESDAY, THURSDAY, FRIDAY, SATURDAY,\
  \ SUNDAY}`\n    2. `String[] enumflowers = “Rose”,”Lily”,”Sunflower”,”Tulip”;`\n\
  \    3. `Enum = {JAN, FEB,MAR};`\n    4. `Enum en1=new Enum({CIRCLE, TRIANGLE, SQUARE});`\n\
  \n3. **可以用枚举类型声明类。**\n    1. 正确\n    2. 错误\n\n## 答案\n\n1. **a**\n2. **a**\n3. **a**\n\
  \n## 练习\n\n1. 使用 `Array` 创建一个城市列表并将前五个城市复制到一个新的 `array` 中。\n2. 创建一个月份的 `enum`（枚举），并使用\
  \ `switch` case 对每个月份执行某些操作。\n\n## 核心术语\n\n- **Constant (常量)**：保持不变或永不改变的值。\n- **Array\
  \ (数组)**：在单个列表中存储多个相同类型的数据被称为 `Array`。\n- **Initialize (初始化)**：将值放入或赋值给对象或 `variable`（变量）。\n\
  \n# 第 8 章\n\n# If/else, Case 和 循环\n\n在本章中，我们将学习条件，以及我们为什么需要以及如何在程序中使用这些条件。此外，我们还将看到应用条件和决策过程的方法。这些也被称为程序的控制流。\n\
  \n控制流是代码中按照它们在程序中出现的顺序顺序执行的部分，但在执行之前会进行检查。它会检查条件，只有当给定条件为真时，该段代码才会被执行。\n\n在这里，我们将学习并练习\
  \ Java 编程中不同的控制流，如 `if`、`if-then`、`if-then-else` 和 `switch`。通过这些语句，我们管理程序的执行流，并在运行时对程序下一步将执行哪种流做出决策。\n\
  \n我们还将学习循环；循环是某些语句，允许根据条件或表达式多次重复一段代码块。只要表达式返回真，循环就会不断重复执行在循环体中的相同代码块。我们将看到 Java\
  \ 编程中提供的循环类型以及如何在程序中实现它们。\n\n## 结构\n\n在本章中，我们将讨论以下主题：\n- If-then-else\n- `switch`\
  \ case\n- 循环\n    - `while`\n    - `do-while`\n    - `for`\n\n## 目标\n\n成功完成本章后，你将能够理解编程中不同的控制流。你还将学习如何以及何时控制程序的执行。你将能够解释不同类型的循环。你将理解\
  \ `while`、`do-while`、`for`、增强型循环和嵌套循环。\n\n### If\n\n`if` 语句是一种强大的语句，我们用它在程序中做，并在给定条件为真时执行代码块。这也被称为\
  \ if-then 语句。\n\n例如：\n\n```\nif(color==\"blue\") {\nsystem.out.println(\"Color is\
  \ blue.\");\n}\n```\n\n下图是 `if` 语句程序执行的图形化表示或流程图：\n\n![](img/figure-8.1.jpg)\n\n\
  **图 8.1:** If 语句流程图\n\n### IF/ELSE\n\n如果 `IF` 语句中给定的条件不成立，那么 `if` 块内部的代码块将不会执行，为了处理假条件，我们编写一个\
  \ `else` 语句代码块，它将代替 `if` 语句执行。这也被称为 if-then-else 语句。\n\n例如：\n\n```\nif(color==\"\
  red\") {\n  System.out.println(\"Color is red.\");\n} else {\n  System.out.println(\"\
  Color is not red.\");\n}\n```\n\n下面的流程图显示了 `if-else` 语句的执行流：\n\n![](img/figure-8.2.jpg)\n\
  **图 8.2:** 流程图\n\n### 嵌套 IF/ELSE\n\n如果 `IF` 语句中给定的条件不成立，那么写在 `if` 块内部的代码块将不会执行，为了处理假条件，我们编写\
  \ `else` 语句代码块，它将代替 `if` 语句执行。这也称为 if-then-else 语句。\n\n例如：\n\n```\nif(color==\"\
  red\") {\n  System.out.println(\"Color is red.\");\n} else {\n  System.out.println(\"\
  Color is not red.\");\n}\n```\n\n### Switch case\n\n`switch` case 是另一种做出决策和执行块的方法。类似于嵌套的\
  \ if-else。我们使用 `switch` 关键字创建 `switch` 语句并将 `variable` 作为参数：\n\n```\nswitch(variable)\
  \ {\n```\n\n在 `switch` 的体中，我们声明用于检查可能值的 case，以及一个处理无匹配的 `default` case。`switch`\
  \ 的体被称为 switch 块。以下是 switch case 的示例：\n\n```\nString color = red;\nswitch(color)\
  \ {\n  case \"red\":\n    System.out.println(\"Color is red.\");\n    break;\n \
  \ case \"yellow\":\n    System.out.println(\"Color is yellow.\");\n    break;\n\
  \  default:\n    System.out.println(\"Not matched!\");\n}\n```\n\n在每个 case 标签之后，必须编写\
  \ `break` 语句，它将终止 `switch` 语句并停止执行。如果不写 `break` 语句，它将执行 switch 中所有的 case。\n\n##\
  \ 循环\n\n循环是允许在满足给定范围和条件下重复代码块的语句。有四种创建循环并遍历值范围的方法。\n\n### while\n\n`while` 语句用于迭代/重复代码块，直到给定条件保持真。`while`\
  \ 语句在表达式后返回返回尔值 `true` 或 `false`。当它返回真时，光标将进入 `while` 块体并执行语句。当它返回 `false` 时，它将不执行\
  \ `while` 块的代码。\n\n**语法：**\n\n```\nwhile(expression/condition) {\n  statements…\n\
  }\n```\n\n\n\n\n\n## 示例 8.1: while 循环示例\n\n```java\npublic class WhileLoop {\n \
  \   public static void main(String[] args) {\n        int a = 2;\n        while(a<=4)\
  \ {\n            System.out.println(\"Current value of a is \"+a);\n           \
  \ a++;\n        }\n    }\n}\n```\n\n**输出：**\n```\nCurrent value of a is 2\nCurrent\
  \ value of a is 3\nCurrent value of a is 4\n```\n\n### do while\n\n`do while` 类似于\
  \ `while` 循环，用于相同的目的。`while` 和 `do while` 的唯一区别在于，在 `do while` 中，我们在稍后检查条件，而在 `while`\
  \ 中，我们在开始处检查条件。光标移动到 `do while` 块内部并执行 `do` 块下编写的语句，随后检查条件。因此，无论条件变为真还是假，`do while`\
  \ 块都会至少执行一次 `do` 部分。然后，它执行 `while` 来检查条件；如果条件返回真，则程序将重复执行 `do` 语句，直到条件不再为真；否则，程序将退出。\n\
  \n### 语法：\n\n```\ndo {\n    statements...\n}while();\n```\n\n### 示例 8.2: do while\
  \ 循环示例：\n\n```java\npublic class DoWhileLoop {\n    public static void main(String[]\
  \ args) {\n        int a = 2;\n        do {\n            System.out.println(\"Current\
  \ executing index :\"+a);\n            a++;\n        } while(a<=4);\n    }\n}\n\
  ```\n\n**输出：**\n```\nCurrent executing index :2\nCurrent executing index :3\nCurrent\
  \ executing index :4\n```\n\n在前面的程序中，即使我们更新 `while` 中的条件使其永远不会变为真，我们的程序仍会成功运行并执行一次\
  \ `do` 语句。这里有一个示例：\n\n### 示例 8.3: do while 示例：\n\n```java\npublic class DoWhileLoop\
  \ {\n    public static void main(String[] args) {\n        int a = 2;\n        do\
  \ {\n            System.out.println(\"Current executing index :\"+a);\n        \
  \    a++;\n        } while(a<=1);\n    }\n}\n```\n\n**输出：**\n```\nCurrent executing\
  \ index :2\n```\n\n前面的程序将执行并运行 `do` 语句以及写在 `do` 语句下的代码块。在最后，它将检查条件。由于变量 `a` 的初始值为\
  \ `2`，而在 `do` 块中我们将 `a` 的值增加了 `1`，现在 `a` 的值为 `3`。因此，条件将变为 `false`，此程序将不再执行 `do`\
  \ 语句。\n\n### for\n\n`for` 循环是一种创建循环非常清晰且简单的方法。在 `for` 循环中，我们在同一个语句中编写循环的所有三个参数。`for`\
  \ 语句必须包含三个必需参数选项，每个参数之间用分号（`;`）分隔。它们如下：\n\n*   `Initialization`（初始化）：值范围的起始点。它在循环开始时执行一次。\n\
  *   `Termination`（终止）：值范围终点的表达式，即光标退出循环的点。如果我们没有在循环中指定终止点，循环将进入无限状态，并一直执行到我们手动停止程序或系统关闭为止。\n\
  *   `Increment`（递增）：该表达式在循环的每次迭代后被调用，负责增加或减少我们在终止表达式中检查的值。\n\n### for 循环的语法：\n\n\
  ```\nfor (initialization; termination; increment) {\n    statements...\n}\n```\n\
  \n### 示例 8.4: for 循环示例：\n\n```java\nfor(int i=1; i<=5; i++) {\n    System.out.println(\"\
  Value of i \"+i);\n}\n```\n\n**输出：**\n```\nValue of i 1\nValue of i 2\nValue of\
  \ i 3\nValue of i 4\nValue of i 5\n```\n\n在前面的代码段中，我们声明了一个 `for` 循环，它被执行了五次。我们声明并初始化了一个整数变量\
  \ `i`。\n\n在第一个参数中，我们将变量 `i` 初始化为 `1`，这意味着该循环将从初始值 `1` 开始。\n\n在第二个参数中，我们定义了终止点 `i<=5`，这意味着该循环将一直执行，直到\
  \ `i` 的值小于或等于 `5`。\n\n在最后一个参数中，我们定义了 `i++`。该表达式在每次迭代后通过 `i = i + 1` 增加 `i` 的值。每次执行此循环时，`i`\
  \ 的值都会增加 `1`。\n\n### 嵌套循环\n\n我们也可以在另一个 `for` 语句的体内编写一个 `for` 循环，这意味着循环下的循环。这被称为嵌套循环。这是一个嵌套\
  \ `for` 循环的示例。\n\n### 示例 8.5: 嵌套 for 循环示例：\n\n```java\nfor(int i=1; i<=5; i++) {\n\
  \    System.out.println(\"Value of i \"+i);\n    for(int j=1; j<=i; j++) {\n   \
  \     System.out.println(\"value of j is \" +j);\n    }\n}\n```\n\n**输出：**\n```\n\
  Value of i 1\nvalue of j is 1\nValue of i 2\nvalue of j is 1\nvalue of j is 2\n\
  Value of i 3\nvalue of j is 1\nvalue of j is 2\nvalue of j is 3\nValue of i 4\n\
  value of j is 1\nvalue of j is 2\nvalue of j is 3\nvalue of j is 4\nValue of i 5\n\
  value of j is 1\nvalue of j is 2\nvalue of j is 3\nvalue of j is 4\nvalue of j is\
  \ 5\n```\n\n前面的代码在另一个 `for` 语句的体内有一个 `for` 循环。在这里，我们将理解嵌套循环的执行过程。嵌套 for 循环从父到子执行；这意味着每次迭代首先从父到子执行。\n\
  \n### forEach\n\n`foreach` 是 `for` 语句的增强版本，可用于遍历集合或数组类型的数据。当我们不知道数据的实际计数以指定循环的初始和终止点时，但希望根据给定对象或变量中存在的数据运行相应的次数。\n\
  \n### 示例 8.6: 增强循环程序示例：\n\n```java\nint numberOfTimes[] = {1,2,3,4,5};\nfor(int\
  \ temp : numberOfTimes) {\n    System.out.println(temp);\n}\n```\n\n**输出：**\n```\n\
  1\n2\n3\n4\n5\n```\n\n\n\n\n\n**示例 8.3**: forEach 示例：\n\n```java\nInteger arrayValue[]\
  \ = {1,2,3,4,5};\nList<Integer> list = new ArrayList<>(Arrays.asList(arrayValue));\n\
  list.forEach(listItem-> {\n    System.out.println(listItem);\n});\n```\n\n**输出：**\n\
  \n```\n1\n2\n3\n4\n5\n```\n\n循环和 `forEach` 用于执行重复任务，或者在条件变为假之前持续执行一组语句。当我们知道元素的索引以及确切的何时停止（即执行次数）时，我们使用循环，这样就可以固定执行过程。但在许多场景下，我们并不知道索引。在这种情况下，我们使用\
  \ `forEach`，`forEach` 将对给定对象的每个值执行循环操作。\n\n## 结论\n\nJava 提供了 `if-else`、`if-then-else`\
  \ 和 `switch` 来处理程序的执行流。这些控制流在做出决策以及当条件为真时执行程序部分代码起着至关重要的作用。为了处理假结果，它还允许我们编写通用的控制流（`else`\
  \ 或 `default`）。\n\n我们还拥有循环来重复语句的评估，或者对集合或数组类型的数据进行迭代。每个循环都有自己的优势，可以根据需求使用。`while`\
  \ 循环用于在满足条件时重复步骤。`do-while` 用于当我们希望即使在条件不满足时也至少执行一次程序时。`for` 循环用于对一组索引范围进行迭代。\n\n\
  在下一章中，我们将讨论包装类和泛型。包装类是帮助我们创建基本数据类型值之对象的类。泛型是自定义类，我们在其中对类及其成员给出了自己的定义。泛型帮助我们在运行时将数据映射到自定义对象类型中。\n\
  \n## 需要记忆的点\n\n- `if-then` 和 `if-then-else` 是处理程序执行流的程序控制流。\n- 每个循环都应该包含三个要素 - 初始化、终止和递增/递减。\n\
  - 如果我们不在循环中指定终止点，循环将进入死循环。\n\n## 多选择题\n\n1. **下列哪项不是循环的类型？**\n    1. `for`\n   \
  \ 2. `foreach`\n    3. `while`\n    4. `switch`\n\n2. **下列哪项是声明 for 循环的错误方式？**\n\
  \    1. `for(a=1; a<4; a++) {…}`\n    2. `for(int b=4; b>=2; b--) {…}`\n    3. `forLoop(inti=1;i<=3;i++)\
  \ {…}`\n    4. `for(;i<=3;i++) {…}`\n\n3. **预测以下程序的输出：**\n```java\npublic class\
  \ DoWhileLoop {\n    public static void main(String[] args) {\n        int a = 2;\n\
  \        do {\n            System.out.println(\"Current executing index :\"+a);\n\
  \            a++;\n        } while(a<3);\n    }\n}\n```\n    1. Current executing\
  \ index: 2\n    2. Current executing index: 2\n       Current executing index: 3\n\
  \    3. Current executing index: 3\n    4. Current executing index: 1\n       Current\
  \ executing index: 2\n\n## 答案\n\n1. **d**\n2. **c**\n3. **a**\n\n## 问题\n\n1. 写一个程序，使用\
  \ `switch` 语句根据月份序列计数获取月份名称。例如，1 代表一月，2 代表二月，依此类推。\n2. `while` 循环和 `do-while` 循环的区别是什么？\n\
  3. 创建 `for` 循环需要的三个参数是什么？\n\n## 术语\n\n- **Lambda 表达式**：Lambda 表达式只是编写方法实现以供以后执行的简短方式。\n\
  - **迭代器 (Iterator)**：迭代器是逐个读取对象集合的过程。\n\n# 第 9 章\n\n# 包装类与泛型\n\n在本章中，我们将学习包装类、包装类的需求以及用处。包装类是基本数据类型的替代方案，我们主要在集合中使用它们。此外，我们将讨论从基本数据类型到包装类以及反之的转换。我们还将在章中涵盖类型转换和泛型，在其中我们将讨论各种类型的转换、何时进行转换，以及类型转换的优缺点。\n\
  \n在 Java 编程中，泛型用于使我们的代码免于运行时发生的类 `CastException`。为了防止运行时数据转换错误，我们使用泛型，以便编译器在运行时强制检查代码，确保不会发生与数据转换相关的运行时错误。我们将看到设计泛型的方法，包括泛型类、泛型接口和泛型方法。\n\
  \n## 结构\n\n在本章中，我们将讨论：\n- 包装类\n- 类型转换\n    - 窄转换\n    - 宽转换\n- 泛型\n    - 参数类型\n\
  \    - 泛型类\n    - 泛型接口\n    - 泛型方法\n\n## 目标\n\n本章介绍了类型和包装类。此外，在本章中，我们将通过示例演示转换。我们将涵盖泛型及其相应的类型。\n\
  \n## 包装类\n\n包装类是帮助我们创建基本数据类型值之对象的类。这意味着当我们使用基本数据类型（`int`、`char`、`float`）声明变量时，使用的是它们的包装类。\n\
  \n下表列出了八种基本类型及其包装类：\n\n| 基本类型 | 包装类 |\n| :--- | :--- |\n| byte | Byte |\n| short\
  \ | Short |\n| int | Integer |\n| long | Long |\n| float | Float |\n| double | Double\
  \ |\n| char | Character |\n| boolean | Boolean |\n\n**表 9.1:** 基本类型与包装类\n\n在处理集合\
  \ API 和数据结构时，我们需要这些包装类和它们的对象。由于基本类型不属于任何类，为了在集合中管理数据，我们需要将基本类型转换为对象。\n\n例如：\n\n\
  ```java\nList<Integer> listNumber = new ArrayList<Integer>();\n```\n\n我们不能用基本类型代替包装类来编写上述代码。这会导致编译错误：\n\
  \n```java\nList<int> listNumber = new ArrayList<int>(); // List 声明无效\n```\n\n\n\n\
  \n前面的代码是自动装箱（autoboxing）的示例。在这个示例中，我们可以无地将 `int` 类型的数据添加到 `Integer` 类类型中。代码的第 3\
  \ 行声明了一个 `int` 变量 `roll`，它持有值 `1234`（基本数据类型）。在接下来的第 4 行，我们声明了一个 `Integer` 类型的列表（包装类）并据此创建了一个对象\
  \ `list`。该列表是 Java 编程中集合 API 的成员。在代码的第 5 行，我们将 `int` 值添加到 `list` 对象中。我们写了一句简单的 `list.add(roll)`\
  \ 语句，但在底层，编译器将执行类似下面的操作：\n\n```\nlist.add(Integer.valueOf(roll));\n```\n因此，这被称为**自动装箱**。\n\
  \n# 拆箱 (Outboxing)\n\n当我们显式地转换包装类对象并将其赋值给基本类型时，它被称为**拆箱**（outboxing）。\n\n例如：\n\n\
  ```\nlong longValue = 1234567891233232324l;\nint intValue = longValue; // 这行代码会产生编译错误。\n\
  ```\n\n在上述语句中，我们有两个变量；一个是 `long` 类型，另一个是 `int` 类型。与 `int` 相比，`long` 类型是一种较大的数据类型。因此，当我们尝试将\
  \ `long` 值赋值给 `int` 变量时，编译器将生成编译错误“类型不：无法从 long 转换为 int”。但我们可以使用强制转换将该 `long` 值显式转换为\
  \ `int`。在下面的代码行中，我们在强制转换 (int) 的帮助下将 `long` 值转换为了 `int` 变量：\n\n```\nint intValue\
  \ = (int) longValue;\n```\n\n### 类型转换 (Type casting)\n\n类型转换是将一种类型的值赋值给另一种类型的概念。类型转换有助于我们进行内存管理，当我们把较大数据类型的值赋值给较小的数据类型时，我们需要显式进行类型转换。在\
  \ Java 编程中，当我们尝试将较大的字节数据类型赋值给较小的数据类型时，编译器将抛出编译错误 `“Type mismatch: cannot convert”`。\n\
  \n每个数据类型都有内存大小限制来存储值。我们只对基本数据类型的值执行类型转换：\n\n| 数据类型 | 符号位 |\n| :--- | :--- |\n| boolean\
  \ | 1 bit |\n| byte | 8 bit |\n| short | 16 bit |\n| int | 32 bit |\n| long | 64\
  \ bit |\n| float | 32 bit |\n| double | 64 bit |\n| char | 16 bit |\n\n**表 9.2：**\
  \ 数据类型及其内存大小\n\n*[表 9.1]* 显示了所有基本数据类型及其在位中的内存大小，这是根据系统为数据类型管理或存储值而分配的位大小。我们已经讨论过这些类型及其内存，[第\
  \ 3 章：类、对象和变量]。现在，回到类型转换，我们将看到执行类型转换的方法以及在 Java 编程中如何操作。类型转换有两种类型——收窄转换和宽转换。让我们详细查看这些类型。\n\
  \n# 收窄转换 (Narrowing)\n\n当我们把高尺寸数据类型赋值给较小尺寸时，我们需要在程序中显式地进行收窄。以下是基本数据类型按大小从大到小的排列顺序：\n\
  \n`double > float > long > int > char > short > byte`\n\n例如，当我们尝试如下将 `long` 类型变量赋值给\
  \ `int` 类型变量时，JDK 将生成编译错误 `“Type mismatch: cannot convert from long to int”`：\n\n\
  ```\nlong longValue = 123456789l;\nint intValue = longValue;\n```\n\n同样，当我们将 `long`\
  \ 值赋值给 `int` 时，通过将 `long` 值转换为 `int` 也可以实现这一点。这是一个示例：\n\n```\nlong longValue = 123456789l;\n\
  int intValue = (int) longValue;\n```\n\n你可以参考本章最后示例程序部分的程序 1。\n\n### 宽转换 (Widening)\n\
  \n当我们把小尺寸数据类型赋值给高尺寸数据类型时，被称为宽转换。宽转换由编译器自动处理，我们在赋值时不需要编写任何显式参数，就像收窄转换的情况那样。在宽转换的情况下，编译器会自动转换该值且不会抛出任何错误：\n\
  \n```\nint intValue = 1234;\nlong longValue = intValue;\n```\n\n在前面的变量赋值情况下，编译器不会抛出任何错误，并将整数值赋值给\
  \ `long` 变量将无问题地工作。以下是基本数据类型按大小从小到大的排列顺序：\n\n`byte > short > char > int > long >\
  \ float > double`\n\n**注意：只有当我们确定高尺寸数据类型中的可用数据能够放入小尺寸类型时，我们才应该进行类型转换；否则，编译器将压缩你的数据以适应较小尺寸的数据类型，我们可能会丢失实际值。请研究本章最后解决方案程序部分的程序\
  \ 2，以理解当我们尝试压缩无法放入小尺寸数据类型的大值时会发生什么。**\n\n## 泛型 (Generics)\n\n泛型用于使我们的代码类型安全，并避免程序出现运行时错误或类转换异常。运行时错误和异常通常发生在我们接收到的无法转换为另一种类型的数据时，这在处理集合时很常见。泛型帮助我们使代码更安全，以便我们可以根据需要正确地类型转换数据，编译器在编译时检查泛型。使用泛型的一个很好的原因是，如果在运行时发生错误，很难识别并修复。因此，最好在编译时使用泛型并修复这些类型转换问题。Java\
  \ 编程中有三种方式定义泛型。泛型确保类型集合只存储指定类型的数据。如果程序尝试向整数类型的集合插入字符串数据，则会抛出错误。\n\n例如：\n\n```\n\
  List<Integer> marks = new ArrayList<Integer>();\nmarks.add(20);\nmarks.add(\"rashid\"\
  ); // 这行代码将产生错误。\n```\n代码的第 3 行将产生编译错误 `The method add(Integer) in the type List<Integer>\
  \ is not applicable for the arguments (String)`，因为我们试图将字符串类型的值赋值给整数类型。\n\n### 参数类型\n\
  \n参数类型可以是任何 POJO 类和接口。创建泛类对象时，我们需要显式指定数据类型或 POJO 作为类型参数，以便编译器运行检查以确保获取正确类型的值。常用的类型参数名称有：\n\
  \n- `E` - Element（元素）\n- `K` - Key（键）\n- `N` - Number（数字）\n- `T` - Type（类型）\n- `V`\
  \ - Value（值）\n- `S, U, V` 等 —— 第二、第三、第四类型\n\n你将在整个 Java SE API 中看到这些参数名。这些类型的参数也可以是数组类型。\n\
  \n# 边界类型参数 (Bounded type parameters)\n\n泛型使参数不受任何数据限制，但有时我们需要限制某些类型并仅允许特定数据，特别是在进行任何数据操作时，我们的类或方法有对特定类型数据执行的操作。在这种情况下，我们使用边界类型参数，并通过\
  \ `extends` 关键字将泛型参数数据类型绑定。让我们来看边界类型参数泛类的示例：\n\n例如：\n\n```java\npublic class BoundedTypeParameter<T\
  \ extends Number> {\n    private T params;\n\n    public T getParams() {\n     \
  \   return params;\n    }\n\n    public void setParams(T params) {\n        this.params\
  \ = params;\n    }\n\n    public static void main(String[] args) {\n        BoundedTypeParameter<Integer>\
  \ gen2 = new BoundedTypeParameter<>();\n        gen2.setParams(123);\n    }\n}\n\
  ```\n\n\n\n在前面的程序中，我们声明了一个边界类型参数。要使一个类成为边界类型，我们需要在声明类、接口或方法时，将数据类型扩展为参数类型。在我们的案例中，`T`\
  \ 扩展了 `Number`，这意味着这些参数类型仅允许数值值 `BoundedTypeParameter<T extends Number>`。\n\n当我们尝试在该程序的\
  \ `main` 方法下添加以下行代码时，编译器将生成编译时异常 `“Bound mismatch: The type String is not a valid\
  \ substitute for the bounded parameter <T extends Number> of the type BoundedTypeParameter<T>”`。因为我们把\
  \ `BoundedTypeParameter` 类声明为参数化类，但使用了一个包装为 `Number` 的边界类型包装类，而在这些语句中，我们正尝试将一个 `String`\
  \ 值赋值给 `Number` 数据类型，这是不可能的：\n\n```java\nBoundedTypeParameter<String> gen1 = new\
  \ BoundedTypeParameter<>();\ngen1.setParams(\"GenericOne\");\n```\n\n### 泛型类\n\n\
  泛型类（Generic class）是一个与类相关参数类型的类。该类型可以是 Java 的参数、数据类型、类或接口，并且可以在尖括号内拥有一个或多个参数作为类型。\n\
  \n例如：\n\n```java\npublic class GenericsWithTypeParam<T> {\n    private T type;\n\
  \    public T getType() {\n        return type;\n    }\n    public void setType(T\
  \ type) {\n        this.type = type;\n    }\n    public static void main(String[]\
  \ args) {\n        GenericsWithTypeParam<String> typeString = new GenericsWithTypeParam<String>();\n\
  \        typeString.setType(\"I am String generic type.\");\n        System.out.println(typeString.getType());\n\
  \    }\n}\n```\n\n前面的类被声明为带有类型参数 `T` 的泛型类。泛型类型 `T` 指向一个类型，该类型可以是任何形式的数据。在这个类中，我们创建了一个类型为\
  \ `T` 的私有变量，并创建了 getter 和 setter 方法来从类型变量中设置或获取值。\n\n在创建此泛型类的对象时，我们需要显式地指定数据类型，以便编译器运行检查，以确保将正确类型的值赋值给变量。在我们的案例中，我们创建了\
  \ `String` 数据类型的对象，因此只有 `String` 值可以设置到类型中。\n\n**注意：请参考本章末尾解决方案部分的程序 3 和程序 4，以理解泛型的其他方法，例如无类型对象和泛型中的多类型参数。我们也可以在泛型中将参数类型声明为数组。**\n\
  \n### 泛型接口\n\n泛型接口（Generic interface）的声明方式与泛型类相同。唯一的区别是声明关键字 `interface`，我们将其用于接口声明，其他步骤与处理泛型类时相同。\n\
  \n例如：\n\n```java\npublic interface GenericClass<K, V> {\n    //在此处编写你的代码\n}\n```\n\
  \n### 泛型方法\n\n泛型方法（Generic method）是一种引入其自己的类型参数的方法，类似于泛型类。当我们不想让整个类都参数化时，就会声明泛型方法。因此，为了使类的某个部分参数化，我们使方法或构造函数变为泛型。这里是一个泛型方法的示例：\n\
  \n```java\npackage generics;\npublic class GenericMethodEx<T> {\n    public static\
  \ <T> String genericMethod(GenericMethodEx<T> a, GenericMethodEx<T> b){\n      \
  \  return \"First generic is \" +a.getParams() +\", and second generic is \"+b.getParams();\n\
  \    }\n    private String params;\n    public String getParams() {\n        return\
  \ params;\n    }\n    public void setParams(String params) {\n        this.params\
  \ = params;\n    }\n    public static void main(String[] args) {\n        GenericMethodEx<String>\
  \ gen1 = new GenericMethodEx<>();\n        gen1.setParams(\"GenericOne\");\n   \
  \     GenericMethodEx<String> gen2 = new GenericMethodEx<String>();\n        gen2.setParams(\"\
  GenericTwo\");\n        System.out.println(genericMethod(gen1, gen2));\n    }\n\
  }\n```\n\n**输出：**\n\n`First generic is GenericOne, and second generic is GenericTwo`\n\
  \n在前面的类 `GenericMethodEx` 中，有一个泛型方法 `genericMethod()`。该方法有两个类型为 `T` 的参数并返回 `String`。方法的参数也必须与\
  \ `T` 类型相同才能成功编译。\n\n在程序的 `main` 方法中，我们创建了 `GenericMethodEx` 类的两个对象 `gen1` 和 `gen2`，它们也是参数类型\
  \ `T` 和泛型类。通过将这些对象作为参数传递给 `genericMethod`，我们正在执行该泛型方法。\n\n# 泛型类的最佳实践\n\n*   不允许在类或接口中声明静态泛型参数化成员。当我们尝试这样做时，编译器将生成编译错误；`Cannot\
  \ make a static reference to the non-static`。\n\n    例如：\n\n    ```java\n    public\
  \ class GenericInterface<T> {\n        static T rollNumber; // 这是无效的\n        private\
  \ T rollNumber; // 这是有效的\n    }\n    ```\n\n*   在创建此泛型类的对象时，我们需要显式地指定数据类型，以便编译器运行检查，以确保将正确类型的值赋值给变量。在我们的案例中，我们创建了\
  \ `String` 数据类型的对象，因此只有 `String` 值可以设置到类型中。\n\n    例如：\n    ```java\n    GenericInterface<int>\
  \ generic = new GenericInterface<int>(); // 无效\n    GenericInterface<Integer> generic\
  \ = new GenericInterface<Integer>(); // 有效\n    ```\n\n*   我们不能将泛型类声明为异常类（Exception\
  \ class）。当我们尝试将异常类用于泛型类时，会产生类型错误。\n\n    例如：\n\n    ```java\n    public class GenericInterface<T>\
  \ extends Exception {} // 无效\n    ```\n\n## 总结\n\nJava 包装类是原始数据类型的类，我们在集合中使用。在使用集合框架时，始终使用包装类而不是原始数据类型。类型转换是将类型从小到大以及从大到小的过程。这个过程有助于我们管理内存。泛型是一种允许对象根据其类型自由管理数据的机制。\n\
  \n在下一章中，我们将讨论**面向对象的编程语言**（**OOPS**）的概念及其特性，包括封装、抽象、继承、重载和重写。\n\n## 重点\n\n*   类型转换是将一种类型赋值给另一种类型的概念。\n\
  *   我们不能将泛型参数类型声明为静态成员。\n*   边界参数类型是将泛型类型参数限制在特定的数据类型。\n*   包装类是原始数据类型的类，我们在集合中使用。通过包装类，我们可以创建原始类型无法创建的对象类型。\n\
  *   泛型用于确保我们的代码类型安全，并避免程序出现运行时错误或类转换异常。我们通过泛型类、接口、方法和构造函数来实现泛型。\n*   类型转换有两种类型：收缩和拓宽。\n\
  \n## 单选题\n\n1.  **以下哪项不是包装类？**\n\n    1.  Integer\n    2.  Boolean\n    3.  Double\n\
  \    4.  Long\n\n2.  **收缩和拓宽是泛型的类型。**\n\n    1.  正确\n    2.  错误\n\n\n\n\n### 3.\
  \ **泛型用于防止运行时异常。**\n1. 正确\n2. 错误\n\n### 4. **在泛型中编写参数化方法的正确方式是？**\n1. `public static\
  \ <T> genericMethod(G<T> a, G<T> b){}`\n2. `public String genericMethod(G<T> a,\
  \ G<T> b){}`\n3. `public <T> String genericMethod(G<T> a, G<T> b){}`\n4. `public\
  \ static String genericMethod(G<T> a, G<T> b){}`\n\n### 5. **带有参数边界类型的泛型类的正确声明方式是？**\n\
  \n1. `public class BoundedTypeParameter<T extends Number> {}`\n2. `public class\
  \ BoundedTypeParameter<T> {}`\n3. `public class BoundedTypeParameter<T extends int>\
  \ {}`\n4. `public class BoundedTypeParameter<T extends ?> {}`\n\n## 答案\n1. **b**\n\
  2. **b**\n3. **a**\n4. **c**\n5. **a**\n\n## 问题\n1. 写出所有基本数据类型及其对应的包装类。\n2. 设计一个类型为\
  \ `K` 和 `V` 的泛型类，存储学生的成绩。计算平均分和百分比并在输出中打印。\n3. 解释类型转换中的窄化（narrowing）概念。\n4. 什么是类型参数？边界类型参数与普通类型参数有什么区别？\n\
  \n## 核心术语\n* **泛型 (Generics)**：泛型是一种帮助我们编写无错误的功能。\n* **边界 (Bounded)**：限制泛型类型参数。\n\
  * **宽化 (Widening)**：将较小的数据类型赋值给大的数据类型。\n* **窄化 (Narrowing)**：将大的数据赋值给小的数据类型。\n*\
  \ **装箱 (Outboxing)**：将包装类型赋值给基本数据类型。\n\n## 示例程序\n\n**程序 1:** 使用类型转换将 long 类型变量赋值给\
  \ int 类型变量。\n\n```java\npublic class LongToInt {\n    public static void main(String[]\
  \ args) {\n        long longValue = 123456789l;\n        int intValue = (int) longValue;\n\
  \        System.out.println(intValue);\n    }\n}\n```\n\n**输出:**\n`123456789`\n\n\
  **程序 2:** 相同值和变量的反向类型转换。\n\n```java\npublic class LongToInt {\n    public static\
  \ void main(String[] args) {\n        int intValue = 1234;\n        double doubleValue\
  \ = intValue;\n        System.out.println(\"Value of int after it gets converted\
  \ to double:\" +doubleValue);\n        long longValue = 1234567891233232324l;\n\
  \        intValue = (int) longValue;\n        System.out.println(\"Long value after\
  \ converted into int type:\" +intValue);\n        longValue = intValue;\n      \
  \  System.out.println(\"Reverse value from int to long:\" +longValue);\n    }\n\
  }\n```\n\n**输出:**\n`Value of int after it gets converted to double:1234.0`\n`Long\
  \ value after converted into int type:-1072736828`\n`Reverse value from int to long:-1072736828`\n\
  \n**程序 3:** 带有键值对数据的泛型简单示例。\n\n```java\npackage generics;\npublic class TypeParameters<K,\
  \ V> {\n    private K key;\n    private V value;\n    public static void main(String[]\
  \ args) {\n        TypeParameters<String, String> typeP = new TypeParameters<String,\
  \ String>();\n        typeP.setKey(\"rankOne\");\n        typeP.setValue(\"rashid\"\
  );\n        System.out.println(typeP.getValue() + \" got the \"+typeP.getKey());\n\
  \    }\n    public K getKey() {\n        return key;\n    }\n    public void setKey(K\
  \ key) {\n        this.key = key;\n    }\n\n    public V getValue() {\n        return\
  \ value;\n    }\n\n    public void setValue(V value) {\n        this.value = value;\n\
  \    }\n}\n```\n\n**输出:**\n`rashid got the rankOne`\n\n**程序 4:** 使用同一个泛型类创建不同类型的对象。\n\
  \n```java\npackage generics;\npublic class TypeParameters<K, V> {\n    private K\
  \ key;\n    private V value;\n    public static void main(String[] args) {\n   \
  \     TypeParameters<String, String> typeP = new TypeParameters<String, String>();\n\
  \        TypeParameters<String, Integer> typeB = new TypeParameters<String, Integer>();\n\
  \        typeP.setKey(\"rankOne\");\n        typeP.setValue(\"rashid\");\n     \
  \   System.out.println(typeP.getValue() + \" got the \"+typeP.getKey());\n     \
  \   typeB.setKey(\"roll number\");\n        typeB.setValue(\"rashid\");\n    }\n\
  }\n```\n\n\n\n\n\n```java\npublic void setName(String name) {\n    this.name = name;\n\
  }\n\npublic float getPercentage() {\n    return percentage;\n}\n\npublic void setPercentage(float\
  \ percentage) {\n    this.percentage = percentage;\n}\n```\n\n在前面的 `EncapsulationEx`\
  \ 类中，我们声明了三个变量并为这些变量编写了 getter 和 setter 方法以便其他类访问这些变量：\n\n```java\npublic class\
  \ EncapsulationExImpl {\n    public static void main(String[] args) {\n        EncapsulationEx\
  \ ee = new EncapsulationEx();\n        ee.setName(\"ABC\");\n        ee.setPercentage(68.3f);\n\
  \        ee.setScore(24);\n        System.out.println(ee.getName());\n        System.out.println(ee.getPercentage());\n\
  \        System.out.println(ee.getScore());\n    }\n}\n```\n\n**输出：**\n\n![](img/Figure-10.1.jpg)\n\
  \n**图 10.1：** `EncapsulationExImpl` 类的输出\n\n在前面的实现程序中，我们创建了 POJO 类对象，并使用 setter\
  \ 方法为 POJO 类的变量赋值，然后使用 getter 方法获取这些变量的值。`setName()` 方法为 `EncapsulationEx` 类的变量\
  \ `name` 赋值，其他变量也同样如此。我们将在接下来的章节中详细讨论 getter 和 setter。\n\n### 抽象 (Abstraction)\n\
  \n抽象是面向对象编程中的一个概念，它隐藏具体的实现，仅向外部世界或继承该抽象类的类暴露的功能。当我们使用 `abstract` 关键字声明类时，该类就可以是抽象类。抽象类可以包含抽象方法是非抽象方法，非抽象方法可以同时包含声明和定义。抽象类不能初始化，这意味着我们不能创建抽象类的对象，但继承抽象类的类可以初始化它。要继承抽象类，我们需要使用\
  \ `extends` 关键字扩展该类，并为其所有的抽象方法提供定义。以下是抽象方法声明的示例：\n\n```java\npublic abstract class\
  \ AbstractClass {\n    abstract int additionaOfTwoNumber();\n    void displayName()\
  \ {\n        System.out.println(\"This is a non-abstract method in abstract class.\"\
  );\n    }\n}\n```\n\n在前面的示例中，我们声明了一个名为 `AbstractClass` 的 `abstract` 类，包含两个方法：一个是抽象的，另一个是非抽象的。抽象方法只能有声明，不能有定义；抽象方法的定义将由继承抽象类的类提供。\n\
  \n### 继承 (Inheritance)\n\n继承是继承和遵循其他类、父类（超类）或接口属性的机制。继承是面向对象编程中的一个强大概念，一个类通过建立关系与其他类共享属性。\n\
  \nJava 编程不支持多重继承，这是为了避免逻辑混淆。让我们通过这种方式理解它：假设我们有一个类 `A`，它有三个方法 `animal()`、`food()`\
  \ 和 `speed()`。另一个类 `B` 拥有两个方法 `animal()` 和 `life()`。当第三个类 `C` 尝试扩展类 `A` 和 `B` 并尝试重新定义方法\
  \ `animal()` 时，编译器将会感到困惑，无法判断应该调用来自类 `A` 还是类 `B` 的 `animal` 方法。\n\nJava 因为歧义不支持多重继承，但在接口的帮助下，我们可以在\
  \ Java 中实现多重继承，这意味着我们不能扩展两个类，但可以在一个类中实现两个或多个接口。\n\n### 多态 (Polymorphism)\n\n多态是以多种方式使用方法或类，或根据需要以不同的行为重用这些类和方法的机制。我们在\
  \ Java 编程中通过继承来实现多态，其中子类继承父类的属性，并用自己的定义覆盖这些方法。用简单的英语来说，多态意味着一个对象以多种形式使用。实现多态有两种：方法重载和方法重写。\n\
  \n### 方法重载 (Method overloading)\n\n方法重载是 Java 编程中的一个强大概念，可以使代码具有扩展性和可重用性。方法重载是多态的概念。具有相同名称但返回类型和方法签名（参数的类型和顺序）不同的\
  \ Java 方法被称为`方法重载`。在这种情况下，我们通过不同的返回类型或参数编写相同的方法，且参数的类型和顺序可能不同。以下是一个方法重载程序的示例：\n\n\
  ```java\npublic class MethodOverloading {\n    public static void main(String[]\
  \ args) {\n        MethodOverloading mo = new MethodOverloading();\n        System.out.println(mo.addTwoNumber(4.3F,\
  \ 88.12F));\n        System.out.println(mo.addTwoNumber(2, 3));\n    }\n    private\
  \ int addTwoNumber(int a, int b) {\n        return a*b;\n    }\n    private String\
  \ addTwoNumber(float a, float b) {\n        return \"Addition of two float numbers\
  \ is : \" +a*b;\n    }\n}\n```\n\n**输出：**\n\n![](img/Figure-10.2.jpg)\n\n**图 10.2：**\
  \ `MethodOverloading` 类的输出\n\n在前面的程序中，定义了两个名称相同但参数类型不同的方法。在类内部创建同名但不同参数类型的方法就是`方法重载`。\n\
  \n### 方法重写 (Method overriding)\n\n方法重写是在子类中使用相同名称和相同类型相同方法的概念。例如，如果你在父类中声明了一个方法，并在子类中实现该方法时，为该方法提供相同的参数和方法名。`@Override`\
  \ 注解告诉编译器该方法旨在重写父类的方法。该注解帮助编译器检查父类中是否存在该方法。以下是一个方法的程序示例：\n\n```java\npackage oops;\n\
  public class Flower {\n    public void flowerRose() {\n        System.out.println(\"\
  I'm Rose. My color is Red.\");\n    }\n    public void flowerName(String name) {\n\
  \        System.out.println(\"I'm a flower. My name is \"+name+\".\");\n    }\n\
  }\n```\n\n子类继承 `Flower` 类，重写 `Flower` 类的方法并改变其定义。让我们通过一个示例程序练习这个概念。\n\n```java\n\
  package oops;\npublic class Flora extends Flower{\n    public static void main(String[]\
  \ args) {\n        Flora flora = new Flora();\n        flora.flowerName(\"Marigold\"\
  );\n        flora.flowerRose();\n    }\n    @Override\n    public void flowerName(String\
  \ name) {\n        System.out.println(\"I'm a flower. My name is \"+name+\".\");\n\
  \    }\n    @Override\n    public void flowerRose() {\n        System.out.println(\"\
  I'm Rose. My color is White.\");\n    }\n}\n```\n\n### 接口 (Interface)\n\n接口是一种完全抽象，帮助我们暴露可以被实现接口的外部世界调用的方法。例如，考虑接口中的汽车，汽车的功能或特征如启动、停止、移动、播放音乐和转弯是接口声明的方法。当子类实现汽车接口时，子类可以访问并调用父类，并为该方法提供自己的定义以调用父类的功能。接口可以包含默认方法、静态方法和常量。抽象方法在接口中没有体（定义），但接口内部的默认方法和静态方法可以包含声明和定义。\n\
  \n\n\n\n\n接口中声明的每个方法无论我们是否显式声明为 `abstract`，默认都是抽象的且公共的。实现接口的类必须在编译之前提供接口所有方法的定义。如果我们不这样做，将抛出编译时错误（compilation\
  \ error）。接口不能被初始化，只能由其他类实现或由其他接口扩展。\n\n我们在 Java 编程中创建接口是为了向外部世界、第三方应用程序和软件暴露对象的特性，主要用于开发服务或应用程序接口（`APIs`）。这里是一个接口的示例：\n\
  \n让我们来看一个 `Car` 接口类：\n\n```java\npackage oops;\n\npublic interface Car {\n    void\
  \ start();\n    int speed();\n    default String model() {\n        return \"This\
  \ is a luxury car\";\n    }\n}\n```\n\n在前面的示例中，`Car` 是一个拥有三个方法的接口；`start` 和 `speed`\
  \ 是抽象方法，而 `model` 是默认方法。默认方法也有定义，但 `start` 和 `speed` 方法只有以分号结尾的声明。现在，实现此接口的类必须给出所有抽象方法的定义。如果我们不这样做，将抛出错误：`The\
  \ type InterfaceExample must implement the inherited abstract method Car.<method\
  \ name>`。`InterfaceExample` 是实现接口 `Car` 的类：\n\n```java\npackage oops;\n\npublic\
  \ class InterfaceExample implements Car{\n    public static void main(String[] args)\
  \ {\n        InterfaceExample interfaceExample = new InterfaceExample();\n     \
  \   interfaceExample.start();\n        System.out.println(\"Your car is running\
  \ with speed: \"+interfaceExample.speed());\n    }\n\n    @Override\n    public\
  \ void start() {\n        System.out.println(\"Engine has been started.\");\n  \
  \  }\n\n    @Override\n    public int speed() {\n        return 50;\n    }\n}\n\
  ```\n\n在前面的示例中，`InterfaceExample` 类是一个继承了接口 `Car` 并为其所有抽象方法提供定义的 Java 类。如果需要，你也可以重写默认方法，但这不是强制性的，你可以跳过并忽略非抽象方法。如果程序员不想在子类中实现所有抽象方法，那么他们需要创建的是抽象类，而不是创建接口。\n\
  \n## 结论\n\n在本章中，我们讨论了面向对象编程的各种原则，以及我们如何在软件和应用开发中使用面向对象编程机制。封装是为了隐藏数据，抽象是为了隐藏实现，而继承是为了从一个类共享或继承属性和方法。我们还学习了方法以及如何通过方法重载和重写来重用和重新设计方法。\n\
  \n在下一章中，我们将详细讨论程序中的异常和错误处理，以及异常和错误的类型。我们还将讨论如何编写自定义异常以及显式抛出错误和异常。我们也会讨论故障安全（fail\
  \ safe）和快速失败（fail fast）类型的程序。\n\n## 记忆点\n\n*   封装是 OOPS 的一个概念，用于隐藏类的数据或字段，并限制子类和其他\
  \ Java 程序对该信息的直接访问。\n*   抽象是一个向其他类隐藏方法的实现并暴露功能的概念。\n*   多态是以不同形式使用方法的概念。实现多态有两种方法——方法重载和方法重写。\n\
  *   子类继承父类的功能，并对父类中已有的具有相同名称、类型和参数数量的方法进行重新定义，这被称为方法重写。\n*   声明相同名称但不同返回类型、不同参数类型和参数数量的方法称为方法重载。这是在同一个类内部创建的。\n\
  \n## 单选题\n\n1.  **以下哪项不是面向对象编程的原则？**\n    1.  抽象\n    2.  多态\n    3.  异常处理\n   \
  \ 4.  封装\n2.  **哪种 OOPS 原则用于将方法和属性组合成类？**\n    1.  多态\n    2.  封装\n    3.  继承\n\
  \    4.  抽象\n3.  **哪个关键字用于从接口继承方法？**\n    1.  Extend\n    2.  Extends\n    3.  Implement\n\
  \    4.  Implements\n\n## 答案\n\n1.  **c**\n2.  **b**\n3.  **d**\n\n## 问题\n\n1. \
  \ 什么是面向对象编程？\n2.  面向对象编程的原则有哪些？\n3.  *has-A*（包含关系）和 *is-A*（继承关系）之间有什么区别？\n4.  为什么\
  \ Java 不支持多继承？\n5.  什么是方法签名？\n\n## 核心术语\n\n*   **超类 (Super-class)**：超类是与子类共享属性的父类，或继承父类的类。\n\
  *   **子类 (Sub-class)**：子类是继承另一个类的特征和功能的类。\n*   **封装 (Encapsulation)**：隐藏数据。\n* \
  \  **多态 (Polymorphism)**：重用或重新定义方法。\n*   **抽象 (Abstraction)**：隐藏类的实际实现。\n*   **继承\
  \ (Inheritance)**：共享类的属性。\n\n\n\n\n异常（Exception）是一种描述异常状况的事件，它发生在运行中的程序和软件代码上，并中断程序的正常执行。这种非预期的中断可能发生在程序接收到错误且无效的数据及数据类型时。当程序发生错误时，程序会创建一个对象，其中包含了程序的错误和异常细节，例如错误何时发生、错误的原因是什么以及错误的状态等。程序会将所有这些答案交给运行时系统。\n\
  \n为了管理异常并处理可能的错误场景，我们通常使用三个代码块来编写程序：`try`、`catch` 和 `finally`。\n\n## Try-catch\n\
  \n`try` 块是一个我们在其中编写执行过程中可能产生错误的代码块。`try` 关键字用于声明 `try` 块。你想要监控异常的语句放在 `try` 块中。`try`\
  \ 块后面必须紧跟 `catch` 块或 `finally` 块。\n\n然后，为了处理来自 `try` 块的错误，我们编写 `catch` 块。在 `catch`\
  \ 块中，我们写一个带有异常类型参数的 `catch` 方法，然后在 `catch` 块下编写语句，以便在程序发生该类型异常时执行相应的操作。没有 `try`\
  \ 块无法使用 `catch` 块。`try` 块之后可以有多个 `catch` 块，每个块处理不同的异常类型。我们可以编写多个 `catch` 块，尽可能处理多个异常类，或在单个\
  \ `catch` 块中处理同一组的多个异常类。在下面的语法部分，我们可以参考 `catch` 块的示例。当方法或程序中发生异常时，运行时系统会寻找相应的异常处理器方法来处理错误；该处理器被称为\
  \ `catch` 块。\n\n**try-catch 语法**：\n\n```\ntry {\n  //statements\n}\ncatch (ExceptionType\
  \ objectName) {\n  //statements\n}\n/*\n* 处理多个异常类的 Catch 块。\n*/\ncatch (ExceptionType\
  \ objectName | ExceptionType objectName) {\n  //statements\n}\n```\n\n运行时系统从发生错误的方法开始寻找异常处理器（`catch`\
  \ 块），并按照方法或程序执行的反向顺序在调用堆栈（call stack）中继续搜索。当找到合适的处理器时，运行时系统将异常传递给该处理器以处理错误；如果系统无法找到合适的处理器，运行时系统将终止。\n\
  \n异常处理是一种处理可能的错误场景的高级机制，可以避免应用程序和软件的终止。这有助于我们打印错误信息、恢复错误、在发生异常时采取替代措施，并向用户提示错误以采取所需的操作。\n\
  \n## Finally block\n\n`finally` 块是一个与 `try-catch` 块一起使用的块，用于执行我们希望在所有情况下都执行的代码语句。无论程序是否发生错误，`finally`\
  \ 代码块都应该执行。当我们的程序执行时，`finally` 块始终执行；我们使用此块编写始终希望执行的语句，例如关闭数据库连接、关闭 IO 对象等。这有助于释放内存并为终端用户生成任何消息。\n\
  \n**finally 块语法**：\n\n```\nfinally {\n  //write your statement here\n}\n```\n\n\
  下面的图表示了 `Exception` 类及其层次结构，以及与编程中其他类的关系。异常有两种类型——检查异常（checked exceptions）和未检查异常（unchecked\
  \ exceptions）：\n\n![](img/Figure-11.1.jpg)\n\n**图 11.1**：错误和异常类的层次结构\n\n### 检查异常\
  \ (Checked exception)\n\n检查异常是编译器在编译时生成的异常。程序员在编写程序时必须处理这些检查异常。这些异常应该使用 `try-catch`\
  \ 块进行处理，或者在异常类中使用 `throws` 关键字在方法声明中进行声明。\n\n以下是一些检查异常类：\n\n* `SQLException`\n*\
  \ `IOException`\n* `ClassNotFoundException`\n* `InvocationTargetException`\n\n###\
  \ 未检查异常 (Unchecked exception)\n\n未检查异常是在 Java 虚拟机运行期间，由于用户或其他应用程序提供的无效或错误数据而发生或抛出的异常。\n\
  \n以下是常用的未检查异常类，它们是 `RuntimeException` 类的子类：\n\n* `NullPointerException`\n* `ArrayIndexOutOfBoundsException`\n\
  * `ArithmeticException`\n* `IllegalArgumentException`\n* `NumberFormatException`\n\
  \n### 自定义异常 (Custom exception)\n\n自定义异常也称为用户定义异常。它是开发者创建的用于定义和处理任何新类型的异常，预定义的异常类中不存在这种异常。在\
  \ Java 编程中，我们可以通过 `extends` 关键字继承 `Exception` 类来创建自定义异常，并相应创建方法。\n\n让我们通过示例来理解自定义异常：\n\
  \n```\npackage exceptions;\npublic class MainClass {\n  public static void main(String[]\
  \ args) {\n    try {\n      String error = \"Exception occurred due to custom exception.\"\
  ;\n      throw new CustomException(error);\n    } catch(CustomException e) {\n \
  \     System.out.println(e);\n    } finally {\n      System.out.println(\"Execution\
  \ of the completed.\");\n    }\n  }\n}\n\n/**\n* 此类用于定义自定义异常。\n*/\nclass CustomException\
  \ extends Exception {\n  String errmsg;\n  public CustomException(String errorMessage)\
  \ {\n    errmsg = errorMessage;\n  }\n  public String toString() {\n    return \"\
  Custom Exception: \" + errmsg;\n  }\n}\n```\n\n**输出**：\n\n![](img/Figure-11.2.jpg)\n\
  \n**图 11.2**：CustomException 的输出\n\n### 错误 (Error)\n\n错误由于 Java 虚拟机中的硬链接失败和动态链接失败引起，这些错误无法使用\
  \ catch 块处理。这类错误无法通过使用异常类或显式抛出异常来处理。\n\n## Try 带资源的 try (Try with resources)\n\n\
  Try with resources 是编写 `try` 块的一种高级方式。使用 try with resources，我们可以声明一个或多个实现了 `AutoClosable`\
  \ 接口并继承 `Closable` 接口的类或资源，这样在程序成功或失败执行后，这些资源将在执行 `catch` 和 `finally` 块之前由虚拟机自动关闭，我们无需程序中显式地关闭这些对象。\n\
  \n**语法**：\n\n```\ntry (FileReader fr = new FileReader()) {\n  //statements\n}\n\
  ```\n\nTry with resources 特性是在 Java 7 中引入的；在此之前的 Java 版本中，我们使用 `finally` 块来显式关闭我们在\
  \ `try` 块或方法内部创建的资源。\n\n让我们通过示例来理解这一点：\n\n```\npackage exception;\nimport java.io.File;\n\
  import java.io.PrintWriter;\npublic class TryWithResources {\n  public static void\
  \ main(String[] args) {\n    try (PrintWriter writer = new PrintWriter(new File(\"\
  data.txt\"))) {\n      writer.print(\"this is a file written using try with resources.\"\
  );\n    } catch(Exception e) {\n      System.out.println(e);\n    }\n  }\n}\n```\n\
  \n\n\n\n```\nSystem.out.println(\"File writing completed.\");\n}\n}\n}\n```\n\n\
  **输出:**\n\n![](img/Figure-11.3.jpg)\n\n**图 11.3:** 上述 TryWithResources 类的输出\n\n\
  之前的示例程序是 try with resources 的一个示例，在编写 try 块时，在打开 try 块之前，我们已经声明了 Java IO 的 `PrintWriter`\
  \ 资源。此 `PrintWriter` 资源将进一步使用 try 块，并在执行后，资源将自动关闭。我们不需要显式地关闭 `PrintWriter` 类对象。这是\
  \ try with resources 的优势，对于内存管理和垃圾回收非常有用。\n\n## 显式抛出异常\n\n在 Java 编程中，我们还可以使用 `throw`\
  \ 关键字显式地抛出异常。这意味着我们可以在代码的任何语句中显式地抛出异常，而不会产生任何自动生成的错误或异常。这将帮助我们在某些检查时触发异常，并执行所需的的操作。\n\
  \n## 结论\n\n异常处理是计算机编程中一个强大且重要的概念，用于防止和处理软件和应用程序的意外行为，包括坏数据、错误请求以及所需数据或系统缺失或不可用。我们使用\
  \ `try-catch-finally` 块处理异常，这在所有其他高级编程语言（如 C#）中都是常见的。\n\n我们可以创建自己的异常类，并使用该类通过处理器根据需求进一步处理异常，这被称为自定义异常。处理器是方法，在方法中尝试解决异常或将指针传回上一步执行步骤。\n\
  \n在下一章中，我们将讨论 Java 集合框架以及 Java 编程语言中可用的集合类型，用于管理数据或内容。\n\n## 注意事项\n\n*   我们创建一个\
  \ `catch` 块来处理异常。\n*   使用 `throw` 关键字，我们可以在程序的任何语句处显式地抛出异常。\n*   `catch` 块是处理 `try`\
  \ 块中发生异常的块。程序可以有多个 `catch` 块。\n*   `finally` 块是我们创建的执行此类异常的块，无论是否发生异常，我们总是希望它在程序中执行。\n\
  \n## 单选题\n\n1. **哪种是正确的 catch 语句？**\n\n    1. `catch {// statements}`\n    2. `catch\
  \ (ExceptionType Ex) {//Statements}`\n    3. `catch (Exception) //statements}`\n\
  \    4. `Try-catch() {//statements}`\n\n2. **在 try-catch 异常处理中强制要求至少有一个 catch 块吗？**\n\
  \n    1. 正确\n    2. 错误\n\n## 答案\n\n1. **b**\n2. **b**\n\n# question\n\n1. 写一个程序并使用\
  \ try with resources 处理空指针异常。\n2. 为什么 `finally` 块很重要？\n\n## 术语表\n\n1. [`javadoc.scijava.org/Java6/java/lang/RuntimeException.html`](https://javadoc.scijava.org/Java6/java/lang/RuntimeException.html)\n\
  \n# 第 12 章：集合 (Collections)\n\n在本章中，我们将讨论 Java 编程的高级特性，我们使用各种 Java 集合类和接口来处理一组数据并操作这些数据。通常来说，集合是一组可以一起管理和存储的对象。`Collection`\
  \ 是根接口。`List`、`Queue` 和 `Set` 是 `Collection` 接口的子类。\n\n集合是 `java.util` 包的一部分，该包实现了\
  \ `Collection` 接口和不同的数据结构以解决数据存储的各种目的。\n\n## 结构\n\n在本章中，我们将涵盖 Java 编程的高级特性：集合框架：\n\
  \n*   `List`\n    *   `ArrayList`\n    *   `Vector`\n*   `Queue`\n    *   `PriorityQueue`\n\
  \    *   `LinkedList`\n*   `Set`\n    *   `HashSet`\n    *   `LinkedHashSet`\n \
  \   *   `TreeSet`\n*   `Map`\n    *   `HashMap`\n    *   `LinkedHashMap`\n    *\
  \   `TreeMap`\n\n## 目标\n\n成功完成本章后，你将理解并解释集合框架，这有助于我们处理不同的对象组。你还将学习 `collection`\
  \ 接口，它提供了对对象执行各种操作的方法。在本章中，我们还将查看集合的类型，并结合它们的实现和示例程序详细讨论每种集合。我们实际上并不直接使用集合接口进行实现，但实现是通过它们的子类完成的，这将在本中涵盖。让我们从这里开始集合的之旅。\n\
  \n## 集合 (Collection)\n\n`Collection` 是 Java 提供的一个用于管理一组对象的预定义类和接口框架。`Collection`\
  \ 是 `Array` 的扩展，并拥有 `List`、`Queue` 和 `Set` 等接口。通过集合的帮助，我们可以将许多元素分组为一个元素。在通用语言中，我们可以将集合视为一个容器，可以在其中将多个元素放在一起。这里是属于集合框架的接口和类的层次结构：\n\
  \n![](img/Figure-12.1.jpg)\n\n**图 12.1:** 集合框架中接口和类的层次结构\n\n集合框架主要有三个接口 - `List`、`Queue`\
  \ 和 `Set` 以及一个额外的接口 `Map`，它继承自 `collection` 接口。这些接口不是用于直接实现的，而是为了实现，我们需要使用前所示的子类。\n\
  \n作为集合框架实际实现的集合类使用 `collection` 接口的方法。因此，所有集合类如 `HashMap`、`HashSet`、`LinkedList`、`TreeSet`、`PriorityQueue`\
  \ 都使用 `add()`、`contains()`、`equals()`、`iterator()`、`clear()`、`remove()`、`size()`\
  \ 等许多方法。\n\n## 列表 (List)\n\n`List` 是一种有序集合，按照元素添加到列表对象中的顺序来存储一组对象。我们可以通过索引号从列表的任何索引访问元素。`List`\
  \ 是核心 `Array` 类的扩展，其索引分配方式与数组的操作方式相同。列表的第一个元素将位于索引 零(0) 处，列表的最后一个元素索引为 *n*-1，其中\
  \ *n* 是元素的数量。我们可以使用索引号在列表的任何索引上插入、删除和获取数据。列表对象可以包含任意数量的 `null` 元素和重复值。\n\n`List`\
  \ 可以实现 `ArrayList`、`LinkedList` 和 `Vector`。所有列表类都有某些优缺点，根据它们的特性，推荐或优先使用它们来处理适用于解决方案的不同情况。让我们讨论\
  \ `ArrayList`、`LinkedList` 和 `Vector` 的优点、缺点和特性。\n\n### ArrayList\n\n当我们想要对数据列表进行快速访问和排序时，首选使用\
  \ `ArrayList`。`ArrayList` 内部使用数组来存储数据。`ArrayList` 是动态的，由于这种行为，当我们尝试在声明的大小之外插入元素时，它会自动扩大数组的大小。当我们从\
  \ `ArrayList` 中删除元素时，`ArrayList` 也会缩小大小。`ArrayList` 自动增加或减少当前数组列表大小的一半；例如，如果我们声明了一个初始大小为\
  \ 10 的 `ArrayList`，并尝试向其中添加第 11 个元素，那么 `ArrayList` 的大小会自动增加到 15。\n\n\n\n\n\n在增加的情况下；当我们尝试向超出定义索引的数组推一个元素时，数组的大小会自动增加：\n\
  \n`Size of ArrayList = n + n/2;`\n\n在减少的情况下；在数组一半的索引变为空之前，数组不会移除索引：\n\n`Size of\
  \ ArrayList = n - n/2;`\n\n这里 `n` = 数组的当前大小。\n\n一个使用 `ArrayList` 的 `List` 接口示例程序：\n\
  \n```java\nimport java.util.ArrayList;\n\npublic class arrayList {\n    public static\
  \ void main(String[] args)\n    {\n        ArrayList<String> list = new ArrayList<String>();\n\
  \        list.add(\"FIRST\");\n        list.add(\"SECOND\");\n        list.add(\"\
  THIRD\");\n        list.add(\"FOURTH\");\n        list.add(\"FIFTH\");\n       \
  \ for (int i = 0; i < list.size(); i++) {\n            System.out.println(list.get(i));\n\
  \        }\n        System.out.println(\"Size of array \" + list.size());\n    }\n\
  }\n```\n\n**输出：**\n\n```\nFIRST\nSECOND\nTHIRD\nFOURTH\nFIFTH\nSize of array 5\n\
  ```\n\n![](img/Figure-12.2.jpg)\n\n**图 12.2：** 前述 ArrayList 程序的输出\n\n### LinkedList\n\
  \n当我们想要对列表数据进行频繁操作时，优先使用 `LinkedList`。使用 `LinkedList` 搜索速度慢，会降低应用程序的性能。`LinkedList`\
  \ 拥有与 `ArrayList` 相似的所有方法，声明方式也与 `ArrayList` 相似。`LinkedList` 中的每个元素都被称为 `Node`，每个\
  \ `Node` 持有两个项：第一个元素的值或内容，以及下一个 `Node` 的地址或指针。让我们用图形的形式来理解链表。这里是一个单链 `LinkedList`\
  \ 对象的示例：\n\n![](img/Figure-12.3.jpg)\n\n**图 12.3：** 单链 LinkedList 对象的示例\n\n**注意：Head\
  \ 始终是 `LinkedList` 的第一个元素，它不持有任何值，而是 `LinkedList` 第一个 `Node` 的地址。**\n\n`LinkedList`\
  \ 的最后一个 `Node` 没有下一个 `Node` 的引用或地址，因为那是列表的末端；所以地址部分包含 null。\n\n### Vector\n\n`Vector`\
  \ 是一个动态数组，根据需要增加或减少数组的大小。我们可以像访问数组元素或使用元素的唯一索引号一样访问 vector。当我们声明一个初始大小为 5 的 vector\
  \ 并想要向其插入第 6 个元素时，`Vector` 将自动将其对象的大小翻倍。因此，在这种情况下，插入第 6 个元素后，vector 的大小增长到 10。`Vector`\
  \ 也是线程安全的且同步的，这意味着一次只有一个线程可以访问 vector，而另一个想要访问相同 vector 对象的线程必须等待。我们将在 `第 14 章：线程`\
  \ 中详细学习 `Thread`。\n\n### Queue\n\n`Queue` 是一个集合接口或一种数据结构，它支持从队列的两端进行插入和删除。`Queue`\
  \ 传统维护 `FIFO`（**先入先出**）顺序，这意味着先插入队列的元素将先被处理，但并不是所有情况下都如此，因为我们可以从队列的任何一侧（前端和尾部）执行操作。因此，元素可以从任何侧被插入、修改和移除。`Queue`\
  \ 不允许 null 元素，但某些队列实现如 `LinkedList` 允许 null 元素。我们可以在队列中添加重复元素。\n\n类似于 `List` 接口的对象，我们无法从中间或除第一个最后一个之外的任何其他索引访问元素。队列只能从前端进行迭代并从尾部进行插入。下面的图可以帮助我们理解队列：\n\
  \n![](img/Figure-12.4.jpg)\n\n**图 12.4：** 存储在 Queue 中的元素\n\n前端（即头部侧）仅用于获取和移除元素。在队列中插入/添加新元素始终从尾部（称为尾）发生。\n\
  \n`Queue` 没有直接的实现类；我们使用 `Queue` 的子类在程序中实现 `Queue`。Java 编程可以使用两种类型的队列。\n\n### PriorityQueue\n\
  \n`PriorityQueue`：这是队列的一种实现，其中元素根据指定的比较器存储在队列中。我们在声明 `PriorityQueue` 时指定比较器。`PriorityQueue`\
  \ 是队列基本原则的一个例外，该原则规定队列支持 FIFO（先入先出），且队列中的元素只能从队列的开头或结尾添加和移除。但 `PriorityQueue` 中的元素可以根据提供的比较器、元素的自然顺序或根据要求的\
  \ LIFO（后入先出）进行放置。如果我们不传递比较器来指示存储项，那么 `PriorityQueue` 将按照其自然顺序存储元素。例如，`PriorityQueue`\
  \ 将分别维护数字的 0-9 和字符的 A-Z 顺序。\n\n无论我们为 `PriorityQueue` 提供的存储元素顺序是什么，在队列中添加和移除元素的操作只能从尾部和头部。尾部用于添加新元素，头部用于从队列移除元素。\n\
  \n### LinkedList\n\n`LinkedList` 是队列的一种实现，元素根据指定的比较器存储在队列中。我们在声明 `PriorityQueue`\
  \ 时指定比较器。`PriorityQueue` 是队列基本原则的一个例外，该原则规定队列支持 FIFO（先入先出），且队列中的元素只能从队列的开头或结尾添加和移除。但\
  \ `PriorityQueue` 中的元素可以根据提供的比较器、元素的自然顺序或根据要求的 LIFO 进行放置。如果我们不传递比较器来指示存储项，那么 `PriorityQueue`\
  \ 将按照其自然顺序存储元素。例如，`PriorityQueue` 将分别维护数字的 0-9 和字符的 A-Z 顺序。\n\n### Operation on\
  \ Queue\n\n无论我们为 `PriorityQueue` 提供的存储元素顺序是什么，在队列中添加和移除元素的操作只能从尾部和头部。尾部用于添加新元素，头部用于从队列移除元素。\n\
  \n### Set\n\nWait\n\n`LinkedList` 是队列的一种实现，元素根据指定的比较器存储在队列中。我们在声明 `PriorityQueue`\
  \ 时指定比较器。\n\n### HashSet\n\n\n\n\n\n`HashSet` 类维护数据的唯一性且不存储重复的元素，但 `HashSet` 允许存储\
  \ `null` 元素。`HashSet` 内部使用并存储 `HashTable` 中的元素，而 `HashTable` 是 `HashMap` 的一部分。`HashTable`\
  \ 以键值对（key and value）的形式存储元素。当我们创建一个 `HashSet` 对象时，`HashMap` 对象会随 `HashSet` 一起自动创建，用于存储数据元素。我们将在本章稍后详细讨论\
  \ `HashTable` 和 `HashMap`。\n\n当我们在 `HashSet` 中添加元素时，该元素将作为 `HashTable` 中的键被添加，并在值的位置放入一个占位值（dummy\
  \ value）。占位值由集合自动创建一个 `Object` 类型的最终常量对象 `PRESENT`，并存储为每个键的值。`PRESENT` 对象的自动声明如下：\n\
  \n```java\nprivate static final Object PRESENT = new Object();\n```\n\n`PRESENT`\
  \ 常量对象是 `HashSet` 中存储的所有键的值。这不会在面向程序员的界面端任何地方出现；这完全是关于内存中存储和数据的管理。\n\n一个使用 `HashSet`\
  \ 创建城市列表的示例：\n\n下图显示了键和值对：\n\n![](img/Figure-12.5.jpg)\n\n**图 12.5：** `HashSet`\
  \ 中键及其对应值的映射\n\n现在我们查看存储城市列表的 `HashSet` 程序。让我们通过一个示例 Java 程序来理解它：\n\n```java\npackage\
  \ collectionSet;\n\nimport java.util.HashSet;\nimport java.util.Iterator;\n\npublic\
  \ class HashSetCollection\n{\n    public static void main(String[] args)\n    {\n\
  \        HashSet<String> cities = new HashSet<String>();\n        // 下面代码将从 HashSet\
  \ 中移除元素\n        cities.add(\"New Delhi\");\n        cities.add(\"Mumbai\");\n \
  \       cities.add(\"Chennai\");\n        cities.add(\"Kolkata\");\n        // 下面代码将从\
  \ HashSet 中移除元素\n        cities.remove(\"New Delhi\");\n        Iterator iterator\
  \ = cities.iterator();\n        while(iterator.hasNext()) {\n            String\
  \ nameOfCity=(String) iterator.next();\n            System.out.println(nameOfCity);\n\
  \        }\n    }\n}\n```\n\n**输出：**\n```\nChennai\nKolkata\nMumbai\n```\n\n前面的程序有一个类型为\
  \ `HashSet` 的对象 `cities`。在 `cities` 中，我们使用 `add()` 方法添加了四个城市的名称：`New Delhi`、`Mumbai`、`Chennai`\
  \ 和 `Kolkata`。之后，我们使用集合接口的 `remove()` 方法移除了一个元素 `“New Delhi”。随后，我们创建了 `Iterator`\
  \ 类的对象，它将帮助我们从 `HashSet` 中读取和检索元素，然后使用 `while` 循环遍历了 `HashSet` 的每个元素并在控制台上打印了该值。\n\
  \n### LinkedHashSet\n\n`LinkedHashSet` 类继承自集合接口，它维护了 `HashSet` 的插入顺序，并在内部使用双链表来存储数据并管理数据结构。`HashSet`\
  \ 和 `LinkedHashSet` 区别如下：\n\n`LinkedHashSet` 按照元素推入对象的顺序进行排序，而 `HashSet` 不会。因此，使用\
  \ `LinkedHashSet` 我们可以知道并获取第五次添加的第五个元素以及第三次添加的第三个元素。但使用 `HashSet` 我们不知道顺序，当我们从 `HashSet`\
  \ 读取元素时，它们可以是任何位置的任何元素。\n\n`LinkedHashSet` 不是同步的，多个线程可以并发添加和删除对象，因此存在数据歧义和数据不匹配的可能性。我们可以使用\
  \ `Collections` 框架的 `synchronized()` 方法使对象变为线程安全。以下是使 `LinkedHashSet` 安全的语法：\n\n\
  ```java\nCollections.synchronizedSet(new LinkedHashSet(<NameOfTheLinkedHashSet>));\n\
  ```\n\n### TreeSet\n\n`TreeSet` 是 `Set` 接口的另一种实现，它按升序维护数据的排序。为此，我们必须在声明 `TreeSet`\
  \ 时指定并提供比较器（comparator）。如果我们不提供任何比较器，`TreeSet` 将根据自然升序（如 0-9 或 A-Z）对元素进行排序。`TreeSet`\
  \ 内部与其他 `Set` 类一样使用 `TreeMap`。使用 `TreeSet` 实现的基本操作（如 `add`、`remove` 和 `contains`）的提供了保证的\
  \ `log(n)` 时间复杂度。\n\n`TreeSet` 不是同步的，这意味着任意数量的线程可以同时访问 `TreeSet` 对象并在对象上执行基本操作。为了使其线程安全，我们必须显式地同步对象，以便一次只有一个线程可以访问，而其他线程保持等待状态，直到一个线程的操作完成。\n\
  \n`TreeSet` 是快速失败的（fail-fast），这意味着我们在创建迭代器后尝试向 `TreeSet` 添加元素时，会产生 `ConcurrentModificationException`\
  \ 异常，但当我们使用自己的方法（如 `remove()`）进行操作时不会抛出异常。\n\n声明 `TreeSet` 的语法如下：\n\n```java\nTreeSet<DataType>\
  \ treeSetObject = new TreeSet<>();\n```\n\n一个 `TreeSet` 实现的示例程序：\n\n```java\nimport\
  \ java.util.TreeSet;\n\npublic class TreeSetCollection\n{\n    public static void\
  \ main(String[] args)\n    {\n        TreeSet<String> treeSet = new TreeSet<String>();\n\
  \        // 向 treeSet 添加元素\n        treeSet.add(\"A\");\n        treeSet.add(\"\
  Z\");\n        treeSet.add(\"N\");\n        treeSet.add(\"K\");\n        treeSet.add(\"\
  B\");\n        treeSet.add(\"D\");\n        treeSet.add(\"Y\");\n        System.out.println(treeSet);\n\
  \    }\n}\n```\n\n**输出：**\n```\n[A, B, D, K, N, Y, Z]\n```\n\n前面的程序是 `TreeSet` 的实现，声明用于存储字符串类型。通过\
  \ `add()` 方法，我们添加了 Z、N、K、B、D 和 Y。当我们读取 `TreeSet` 时，发现它是按照字母升序存储对象的，即 A, B, D, K,\
  \ N, Y, Z。\n\n### Map\n\n`Map` 是一个接口，通过以键值对的形式存储元素并将键映射到值。`Map` 对象可以包含一个 `null`\
  \ 键。\n\n### HashMap\n\n`HashMap` 类似于 `Set`，并以键值对存储元素。每个键都映射到一个值。`HashMap` 可以有一个\
  \ `null` 键，但可以有多个 `null` 值。`HashMap` 支持并接受重复元素也仅作为值，`HashMap` 的桶中不允许有重复键。\n\nHashMap`\
  \ 内部使用 `hashCode()` 和 `equals()` 方法来生成键的哈希值并放置在 Map 中，这有助于实现并维护 `HashMap` 键的唯一性。我们将在本章稍后详细讨论这些方法。\n\
  \n### LinkedHashMap\n\n\n\n\n\n`LinkedHashMap` 类继承自 `HashMap` 并实现了 `Map` 接口，以为 `HashMap`\
  \ 类添加更多功能。该实现放置并维护了对象的插入顺序。因此，我们可以根据插入顺序预测可以在哪个位置找到特定的对象。即使删除了任何条目或向列表中重新插入条目，插入顺序也不会受到影响。它还像\
  \ `HashMap` 一样将条目存储在键值值对的形式中。由于我们已经熟悉 `LinkedList` 数据结构，同样的原理在这里也适用，`LinkedHashMap`\
  \ 使用双向链表来管理和存储数据。\n\n`LinkedHashMap` 不是同步的，也不是线程安全的，但我们可以使用 `collections` 接口的 `synchronized`\
  \ 方法使对象变为线程安全。如果我们想限制程序，只允许一个线程对对象执行操作，并在一个线程执行操作时为其他线程锁定代码块，那么我们可以使 `LinkedHashMap`\
  \ 对象变为线程安全，以克服数据不一致的情况。以下是使用 `Collections` 接口的 `synchronizedMap()` 方法使 `LinkedHashMap`\
  \ 对象变为线程安全的语法：\n\n```\nCollections.synchronizedMap(new LinkedHashMap(<NameOfTheLinkedHashMap>));\n\
  ```\n\n`LinkedHashMap` 使用与 `HashMap` 完全相同的初始容量和负载因子，即初始容量为 16，负载因子为 0.75。`LinkedHashMap`\
  \ 是快速失败的（fail-fast），这意味着由迭代器方法返回的迭代器只能会被自身的 `remove()` 方法修改；如果我们尝试 `put` 一个对象，迭代器将抛出\
  \ `ConcurrentModificationException`。\n\n# TreeMap #toc.xhtml_s237a\n\n`TreeMap`\
  \ 实现了 `Map` 接口并将对象存储在键值对中。`TreeMap` 类继承自 `AbstractMap` 类并实现了 `NavigableMap` 接口，以实现\
  \ `Map` 和红黑树数据结构的功能。`TreeMap` 是排序的，它根据声明时提供的比较器对对象进行排序；或者如果没有指定比较器，它将根据键的自然顺序对对象进行排序。\n\
  \n`TreeMap` 不是同步的，也不是线程安全的，我们需要显式地使 `TreeMap` 变为线程安全，以便一次只有一个线程可以执行读写操作。我们可以通过 `Collections`\
  \ 接口的 `synchronized()` 方法使 `TreeMap` 变为线程安全。\n\n```\nCollections.synchronizedSortedMap(new\
  \ TreeMap(<NameOfTreeMap>));\n```\n\n`TreeMap` 实现为 `get`、`put` 和 `remove` 等操作提供了保证的\
  \ `log(n)*` 时间开销。`TreeMap` 是快速失败的，这意味着由迭代器方法返回的迭代器会被其 `remove()` 方法以外的其他操作修改，并产生\
  \ `ConcurrentModificationException`。因此，我们不能在创建迭代器后 `put` 任何对象，但可以 `remove` 对象。\n\
  \n# 结论 #toc.xhtml_s238a\n\n`Collection` 是一个强大的框架，它让开发者能够更轻松地管理长元素（long）或对象的列表。它是\
  \ `java.util` 包的一部分，所有的 `Collection` 接口和类都是 `util` 包的一部分。\n\n`Collection` 类使用 `collection`\
  \ 接口的方法来执行如 `add`、`remove`、`modify`、`retrieve`、`contains` 等操作。\n\n在下一章中，我们将讨论 Java\
  \ 中的文件系统以及 Java 编程中存在的不同类型的类，用于读取、写入和管理各种类型的文件，如文本文件、图像文件、PDF、Word 文档等。\n\n# 需要记忆的点\
  \ #toc.xhtml_s239a\n\n*   `List`、`Queue`、`Set` 和 `Map` 是 `Collections` 框架的四个主要实现。\n\
  \n*   `ArrayList` 和 `Vector` 是动态数组。它们会动态增加大小，并随着元素的添加或删除自动增加或减少列表的大小。`ArrayList`\
  \ 按当前数组大小的一半增加大小，而 `vector` 将大小增加到当前 vector 大小的两倍。\n\n*   `HashSet` 内部使用 `HashMap`\
  \ 来存储对象。`HashSet` 对象被存储为键，其值则映射为一个常量对象 `PRESENT`。\n\n*   `Queue` 是一种管理数据并对元素实现 FIFO（先进先出）策略的数据结构。但某些队列并不受\
  \ FIFO 顺序的限制，例如 `LinkedList`，它可以根据提供的比较器进行排序。\n\n# 多选题 #toc.xhtml_s240a\n\n1. **vector\
