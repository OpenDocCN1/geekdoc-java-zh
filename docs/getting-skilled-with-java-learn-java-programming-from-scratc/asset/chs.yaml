- "# Java 精进之路：从现实应用和问题解决程序开始学习 Java 编程（英文版）\n\n\n\n![](img/cover.jpg)\n![image](img/cover.jpg)\n\
  \n\n![](img/line.jpg)\n\n\n![](img/line.jpg)\n\n\n![](img/logo.jpg)\n\n[www.bpbonline.com](http://www.bpbonline.com)\n\
  \n**2022 年第一版**\n\n\n\n\n\n\n\n![](img/logo1.jpg)\n\n\n# 献给\n\n*我亲爱的父母*\n\n***M\
  \ Sarmad***\n\n***Mazda Tabassum***\n\n&*\n\n*我的家人和朋友*\n\n# 关于作者\n\n**Mohammad Rashid\
  \ Raza** 是一位软件开发者，对微服务、信息论、基础编程、系统与架构以及分布式系统等领域有着广泛兴趣。他曾作为全栈开发人员参与过 CGP、CMS、教育、支付与金融、航空和旅游等多个领域的\
  \ Web 应用程序和软件开发众多项目。他从新德里的的德里大学获得政治学学士学位，并在新德里的的因德拉·甘迪国立开放大学获得计算机应用硕士学位。他获得了 Adobe\
  \ 的 Adobe Experience Manager 开发者和架构师认证，以及微软的 Microsoft .Net 框架开发者认证。他是一位定期的博客作者（地址为\
  \ `rashidjorvee@blogspot.com`），并是计算机编程教育的热爱好者。\n\n# 关于评审员\n\n**Rati Mehra** 是一位\
  \ Java 架构师，在 Java 技术以及 Web 世界解决方案和架构设计方面拥有 12 年的丰富经验。Rati 在诺伊达的 Amity 大学获得了技术学士学位，在浦那那的\
  \ Symbiosis 大学获得硕士学位。\n\n**Amritpal Singh** 在 IT 行业拥有 9 年经验，是全栈开发的爱好者。他目前在 Larsen\
  \ & Toubro Infotech 担任项目主管。他在 Web 应用程序、后端应用程序、中间件应用程序、云等领域的技能使他成长为一名 Java 全栈开发专家。Amritpal\
  \ Singh 此前曾工作于 HCL Technologies、Tech Mahindra、Cognizant Technologies 等顶级 IT 公司，并为美国航空、美国银行、沃尔玛、诺基亚和花银行等顶级客户项目做过贡献。他通过著作《Affinity》探索了写作身份。他目前担任导师并担任新人才招聘的面试官。Amrit\
  \ 还是 Stack Overflow 的贡献者。他现在专注于将自己的知识投入开源项目，并通过指导他人、创建 POC、举办工作讨会、撰写博客来与社区分享，帮助世界变得更美好、更发达。\n\
  \n**Neha Sehdev** 拥有 Guru Nanak Dev 大学的计算机应用学士学位和旁遮普技术大学的计算机应用硕士学位。Neha 拥有 8 年计算机科学和编程教学经验，对与年轻学习者一起充满热情。Neha\
  \ 喜欢利用她的技能帮助孩子在所有发展领域取得进步。教学之外，Neha 还对写文章和博客充满热情，并为许多小学书籍做过贡献。Neha 喜欢阅读、烹饪、听音乐、与家人朋友度时光，以及看恐怖故事。\n\
  \n# 致谢\n\n有几个人我想感谢他们在我写这本书期间对我提供的持续和不断的支持。首先，我要感谢我的父母所有的付出和支持，以及鼓励我写这本书的朋友们。\n\n\
  我很感谢我的导师，他们也帮助我学习并引导我在 Java 编程和其他计算机及互联网技术方面提高技能。感谢 Oracle 和 Java 博客作者提供的优秀在线发布说明和\
  \ Java 文档，让我深入理解产品和新功能。\n\n感谢 BPB Publications 团队，他们提供了足够的支持，给了我充足的时间编写草稿，并在整个出版过程中提供指导。BPB\
  \ 的整个团队，包括技术评审员（Amrit、Neha 和 Rati），对于将这本书完善到我个人无法做到的水平起到了关键性作用。\n\n# 前言\n\n本书涵盖了高级计算机编程语言\
  \ Java，从计算机编程基础开始到使用核心 Java 程序的高级编程概念。核心重点是引导初学者或开发者从零学习 Java 编程，并实现不同的类、对象和库。本书聚焦于一些常用的面向对象设计模式及其实现。书中描述了\
  \ Java 的每个模块的理论概念（即编写程序所需的知识），以及帮助将需求转换为 Java 程序的分析部分。书中还演示了 Java 开发环境的机器设置，以及是\
  \ Java 开发工具包（即 `JDK`）的安装指南。每一章都有示例和样例程序，帮助理解实际概念，随后还有一些具有挑战性的问题、练习和任务，为读者提供测试其所学技能的机会。\n\
  \n\n\n\n\n在 `第 6 章]` 中，我们将学习如何处理 `String` 对象和 `String` 数据类型，并使用不同类型的 `String` 类及其方法来操作或控制\
  \ `String` 数据。\n\n在 `第 7 章]` 中，我们将讨论如何使用单个变量来管理数据列表或相同数据类型的多个值。此外，我们还将学习创建常数数据的固定列表。在这里，我们将讨论\
  \ `Array` 和 `Enum` 类型的对象。\n\n在 `第 8 章]` 中，我们将学习决策技能，或者说执行任何语句之前如何设置条件，然后根据这些条件在\
  \ Java 编程中执行一组语句。此外，我们将学习迭代或循环，以便根据条件从列表中读写数据或写入列表，或者根据条件多次执行或运行块代码或语句。\n\n在 `第\
  \ 9 章]` 中，我们将学习类型转换以及使用包装类将变量封装到类中，并学习如何使用泛型使代码类型安全，以避免程序出现运行时错误。\n\n在 `第 10 章]`\
  \ 中，我们将学习编程的核心特征——面向对象编程，它能帮助开发者在设计解决方案时选择正确的编程方法。在这里，我们将学习使用封装、抽象、继承和多态的所有 OOP\
  \ 编程方法。\n\n在 `第 11 章]` 中，我们将学习如何处理程序和应用程序中的运行时错误。这是开发者应该遵循的一项非常重要的特性，以确保在接收到错误或糟糕的数据/信息后仍保持应用程序的活跃。处理异常和错误有助于我们处理无效和糟糕数据或对象的情况，并帮助执行一些额外活动以使程序流流向不同的方向。\n\
  \n在 `第 12 章]` 中，我们将学习如何使用 Java Collection 管理一组数据。这是 Java 编程中的一项高级级功能，我们用它来处理一组数据并使用各种\
  \ Java 集合类和接口操作数据。此外，我们还将讨论帮助编写程序的 `collections` 类及其方法。\n\n在 `第 13 章]` 中，我们将学习关于序列化和反序列化的知识，即将数据存储到文件中以及从文件中读取数据。在这里，我们将学习用于读写和处理不同类型文件（例如\
  \ `JSON`、`XML`、`TXT`、`XLS`、`CSV`）的不同类和方法。\n\n在 `第 14 章]` 中，我们将学习如何利用 CPU 同时执行多个程序，或者通过\
  \ `Thread` 将程序部分分成最小执行单元来分块执行同一个程序。我们还将练习 `Thread` 的创建，以及如何分块并运行我们的程序。\n\n在 `第 15\
  \ 章]` 中，我们将看到如何在 Java 程序或应用程序与数据库（`SQL` 或 `NoSQL`）之间建立桥梁。我们将学习如何与任何数据库管理系统建立连接，并在\
  \ Java 中获取和设置数据。我们将讨论在 Java 中执行所有这些操作的各种库和类。\n\n在 `第 16 章]` 中，我们将深入探讨 Java 内存管理，查看\
  \ Java 如何管理我们机器的内存。Java 有一个名为 `garbage collection` 的内置功能，负责 Java 对象的内存分配和释放，并确保我们的程序或应用程序在不发生任何内存泄漏的情况下保持活跃。\n\
