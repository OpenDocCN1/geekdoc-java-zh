  \n**图 15.2:** 前述 JDBC 程序的输出截图\n\n# ResultSet\n\n`ResultSet` 是一个提供检索和操作结果的方法的接口，它在数据库上执行\
  \ SQL 查询时生成。默认情况下，结果集是单向且不可更新的。我们可以从第一行到最后一行按顺序读取数据，而无法修改结果集中的数据。结果集有三种类型：\n\n*\
  \   `TYPE_FORWARD_ONLY`：结果集不能滚动；其游标只能向前移动，从第一行之前移动到最后行之后。结果集中包含的行取决于底层数据库生成结果的方式。也就是说，它包含了在查询执行时或检索行时满足查询条件的行。这是默认的结果集类型。\n\
  *   `TYPE_SCROLL_INSENSITIVE`：结果可以滚动；其游标相对于当前位置可以向前或后移动，也可以移动到绝对位置。在结果集打开期间，它对底层数据源所做的更改不敏感。它包含了在查询执行时或检索行时满足查询条件的行。\n\
  *   `TYPE_SCROLL_SENSITIVE`：结果可以滚动；其游标相对于当前位置可以向前向后移动，也可以移动到绝对位置。结果集在保持打开状态时会反映底层数据源的更改。\n\
  \n并不是所有数据库都支持所有类型的结果集。要检查数据库支持哪些结果集，我们可以调用 `DatabaseMetaData.supportsResultSetType(<ResultsetType>);`\
  \ 方法；如果该方法对指定的 `ResultSet` 类型返回 `true`，则表示支持；否则返回 `false`。我们也可以借助 `DatabaseMetaData.supportsResultSetConcurrency(<specifyConcurrency>)`\
  \ 来检查并发级别。\n\n# RowSet\n\nRowSet 对象派自 `ResultSet` 接口，所有的 RowSet 都具有结果集的功能。RowSet\
  \ 具有一些额外的特性属性、JavaBean 通知以及滚动能力或可更新性；这些功能在 `ResultSet` 中是不存在的：\n\n*   第一，属性是表格的字段，并有相应的\
  \ setter 和 getter 方法。\n*   第二，RowSet 对象使用 JavaBeans 事件模型，当发生特定事件时，注册的组件会收到通知。游标移动、插入或更新或删除行以及\
  \ RowSet 内容的变化是产生通知的三类事件。\n*   第三，RowSet 默认是可滚动和可更新的，每个 RowSet 对象都具有从结果中读取行的滚动功能。\n\
  \nRowSet 接口扩展了标准的 `java.sql.ResultSet` 接口。RowSet 接口提供了一组属性，允许 RowSet 实例被配置为连接到 JDBC\
  \ 数据源并从数据源读取某些数据。RowSet 有两种类型：\n\n*   连接型 RowSet (Connected Rowset)：连接型 RowSet 与数据源建立连接并在整个生命周期内保持连接。\n\
  *   断开型 RowSet (Disconnected Rowset)：断开型 RowSet 不始终与数据源保持连接。它打开连接获取数据，之后断开连接。\n\n\
  RowSet 易于使用，在从数据源读取数据非常有用。\n\n**注意：** ResultSet 取决于驱动的支持。\n\n\n\n\n在本章中，我们将讨论 Java\
  \ 内存管理，以及 Java 虚拟机 (`JVM`) 如何为执行 Java 应用程序和程序自动内存。堆（Heap）是在 RAM 中创建的用于随机访问的内存，用于创建类、对象和成员。垃圾回收（Garbage\
  \ collection）是 JVM 处理内存以及从堆中分配和回收内存的核心机制。\n\n堆和栈（stack）是随机内存类型，其中堆是 Java 编程使用的主要内存。堆内存进一步细分为三个逻辑部分，称为代（generations）——新生代（new）、年代（old）和永久代（permanent）是堆内存的三个代。所有三代内存都由\
  \ Minor（小）、Major（大）和 Full（全）垃圾回收进行管理和处理，通过删除堆中未引用的对象来帮助系统回收未使用的内存。\n\n## 结构\n\n\
  在本章中，我们将涵盖并详细讨论内存管理以及 JVM 如何管理 程序程序的内存。作为本章的一部分，让我们讨论内存管理的主题：\n\n* 垃圾回收及其类型\n* Finalize\n\
  * 堆大小\n* 堆内存的处理\n\n## 目标\n\n成功完成本章后，你将能够理解并解释垃圾回收、垃圾回收器及其在管理 Java 应用程序内存中的作用。\n\n\
  此外，你能够理解增加和减少堆内存大小的过程，以及如何通过指令 JVM 参数 `-XX` 为任何代和应用程序设置内存。\n\n# 垃圾回收\n\n`Garbage\
  \ collection` (`GC`) 是一种内存管理过程，它会找到并移除或清理分配给对象的未使用堆内存，并保持内存可重用且供新资源使用。垃圾回收自动执行，并移除那些不再持有任何引用且不再使用的对象和成员的分配内存，通俗地说，我们可以说回收了未使用的堆内存。当我们在机器上执行\
  \ Java 程序时，它需要内存。\n\n堆是 Java 对象在运行时用于进程和操作的内存，这是唯一由垃圾回收管理的内存，它还确保并为 Java 程序的执行提供所需的空闲内存。`Java\
  \ virtual memory` (`JVM`) 提供了多种垃圾回收器，帮助系统或操作系统提高内存的性能和效率。\n\n有两种方法 `Runtime.gc()`\
  \ 和 `System.gc()` 它们可以向 JVM 生成并发送垃圾回收请求。我们无法强制垃圾回收器回收未使用的内存，JVM 会自动管理所有这些以运行应用程序或程序，开发者不需要担心\
  \ Java 中的内存管理。可以通过以下任何一种方法强制执行 GC：\n\n```\nSystem.gc();\n```\n\n```\nRuntime.getRuntime().gc();\n\
  ```\n\n```\nSystem.runFinalization();\n```\n\n```\nRuntime.getRuntime().runFinalization();\n\
  ```\n\n**注意：调用上述方法并不保证 GC 会立即开始执行并回收内存。当所有堆内存满时，将抛出 `java.lang.OutOfMemoryError`\
  \ 错误。****\n\n当 GC 无法为新对象分配内存且无法回收内存时，JVM 将生成并抛出 `java.lang.OutOfMemoryError`。这意味着堆已满，无法为新对象进一步扩展内存。此错误可能有多种原因，我们需要进行诊断和确定。但大多数情况下，这是由于堆内存不足导致的，为了防止此错误，我们需要使用堆大小参数增加\
  \ JVM 的堆内存大小。我们将在本章后面讨论并调查如何设置不同的 GC 内存大小。\n\n# 代\n\nJava 堆内存（Hotspot 堆结构）被称为 `generations`（代）。代是根据对象的寿命或期限逻辑划分的堆空间，用于存储资源和对象。堆内存中有三代：新生代（young\
  \ generation，也称为 new generation）、年代代（old generation）和永久代（permanent generation）。这里是堆内存的图：\n\
  \n![](img/Figure-16.1.jpg)\n\n**图 16.1:** 堆内存的逻辑划分\n\n上图显示了堆内存的划分以及对象如何根据使用情况在内存中生存。这里的新生代、年代代和永久代是对象根据年龄生存的三个栈。\n\
  \n首先，我们有新生代，它分为三个部分：一个 `Eden` 和两个幸存空间 `S0` 和 `S1`，它们通过执行 Minor 垃圾回收将对象从一个部分移动到另一个部分。\n\
  \n其次，我们有年代代（称为 tenured generation），它存储未被新生代 Minor GC 清理的对象，如果程序或应用程序仍在使用该对象，则该对象将被移动到堆内存的年代代。新生代对象的年龄定义了一个阈值。一旦达到该阈值年龄，对象会自动从新生代移动到年代代。Major\
  \ 垃圾回收在年代代上运行以清理对象并回收内存。\n\n第三个是永久代，它持有在运行程序或应用程序内存中执行和加载的类、对象和成员的元数据。它还持有 Java\
  \ 库类和方法。Full 垃圾回收在永久代上运行，当这些类和方法不再需要时，从内存中清除类。\n\n# 垃圾回收的类型\n\n有三个在堆内存各个代执行的垃圾回收器。让我们通过示例讨论并理解所有三个垃圾回收器（Minor、Major\
  \ 和 Full）：\n\n* Minor GC：它在新生代运行，负责清理死亡对象并回收内存，并保持新生/新代的内存可用。Minor GC 还将对象从 Eden\
  \ 移动到新生代内的幸存空间，随后移动到年代代。\n\n* Major GC：它在堆内存的年代代运行，负责清理旧/长期堆空间。当年代代满时，JVM 执行大垃圾回收以回收死亡对象的内存。它还会清理在后台运行的守护线程以保持\
  \ JVM 正常运行。与小垃圾回收相比，大垃圾回收速度较慢，且运行频率较低。\n\n* Full GC：它清理整个堆内存，包括新生代和年代空间。\n\n这三个在堆内存各个代上运行的垃圾回收器确保我们的应用程序活跃运行，且不会出现内存泄漏或内存溢出问题。\n\
  \n# Finalize\n\nFinalize 是垃圾回收的一种方法，由垃圾回收器在对象上调用，以便在回收内存之前识别并检查该对象的引用。`finalize()`\
  \ 方法识别没有引用的对象并将它们推入垃圾回收队列以回收内存。`finalize()` 方法不会将任何存活或活跃的对象发送到垃圾回收。\n\n\n\n当我们知道程序将不再使用某个对象并希望将其从内存中移除时，可以显式地调用对象上的\
  \ `finalize()` 方法。但再次，这完全取决于垃圾回收（GC），内存是否会被回收。我们无法保证在调用 `finalize` 方法后，该对象的内存会被释放并回收。显式调用\
  \ `finalize()` 方法可能会因为 CPU 占用率高而影响应用程序的性能。以下是重写垃圾回收 `finalize()` 方法的示例：\n\n```java\n\
  @Override\nprotected void finalize() throws Throwable {\n    super.finalize();\n\
  }\n```\n\n通常优于使用父类调用 `finalize`，以消除在子类或继承中可能发生的歧义。因此，当该父类的所有子类都执行完毕后，`finalize`\
  \ 将会被执行。要理解 `super` 关键字的作用，请参阅本书第 10 章 `第 10 章：面向对象编程]` 中的继承章节。\n\n# 堆大小 (#toc.xhtml_s311a)\n\
  \n任何机器的堆大小取决于每个进程的最大地址空间。下表显示了各种平台每个进程的最大地址值：\n\n| 操作系统 | 每个进程的最大地址空间 |\n| :---\
  \ | :--- |\n| Redhat Linux 32 位 | 2 GB |\n| Redhat Linux 64 位 | 3 GB |\n| Windows\
  \ 98/2000/NT/Me/XP | 2 GB |\n| Solaris x86 (32 位) | 4 GB |\n| Solaris 32 位 | 4 GB\
  \ |\n| Solaris 64 位 | Terabytes |\n\n**表 16.1：** 操作系统及其每个进程最大地址空间的列表。\n\n# 堆调优 (#toc.xhtml_s312a)\n\
  \n我们可以在启动程序时控制任何应用程序或程序的堆内存大小。以下是运行用于设置堆大小并指示 JVM 将指定的堆内存分配给应用程序的参数：\n\n*   `-Xms<value>`:\
  \ `Xms` 定义内存的最小堆大小\n*   `-Xmx<value>`: `Xmx` 定义内存的最大堆大小\n*   `-XX:MinHeapFreeRatio=<minimumValue>`:\
  \ JVM 在每次 GC 时都会增大或缩小堆，以尝试在每次收集时将空闲与存活对象的比例保持在特定范围内。最小范围通过参数 `-XX:MinHeapFreeRatio=<MinValue>`\
  \ 设置，在 `-Xms` 和 `–Xmx` 参数限制的总大小内以百分比表示。\n*   `-XX:MaxHeapFreeRatio=<maximumValue>`:\
  \ JVM 在每次 GC 时都会增大或缩小堆，以尝试在每次收集时将空闲与存活对象的比例保持在特定范围内。最大范围通过参数 `-XX:MaxHeapFreeRatio=<MaxValue>`\
  \ 设置，在 `-Xms` 和 `–Xmx` 参数限制的总大小内以百分比表示。\n*   `-XX:NewRatio=<ratio>`: 当堆的大小增大或缩小时，JVM\
  \ 会自动重新计算年轻代和老年代的大小。然而，我们可以通过使用 `-XX:NewRatio` 参数指定 `NewRatio` 来显式维护年轻代和老年代的大小。让我们更好地理解这一点：设置\
  \ `-XX:NewRatio=3` 意味着年轻代和老年代之间的比例为 3:1，Eden 以及两个幸存区的总大小将是整个堆的四分之一。\n*   `-XX:NewSize=<size>`:\
  \ 此参数用于设置年轻代的最小大小。\n*   `-XX:MaxNewSize=<size>`: 此参数用于设置年轻代的最大大小。\n*   `-XX:+AggressiveHeap`:\
  \ 此参数检查机器资源（如内存大小和处理器数量），并尝试设置各种最适合长时间运行应用程序和任务的 JVM 参数。\n\n我们可以在运行 `jar` 文件或应用程序时设置这些参数中的任何一个或所需的数量。以下是在打开\
  \ `jar` 时添加堆内存调优参数的示例：\n\n```\njava –jar javaCoreProject.jar -Xmx1024m -Xms3m -Xmn1m\
  \ -XX:PermSize=20m -XX:+UseSerialGC -XX:MaxPermSize=256M\n```\n\n`java –jar` 是打开构建并封装成\
  \ `jar` 的应用程序的命令。在这里，我们使用 JVM 堆内存参数打开了 `javaCoreProject.jar` 文件。在这里，使用参数 `–Xmx1024m`\
  \ 将最大内存设置为 1024mb，最小设置为 `2mb`，接下来是 `-Xms`，依此类推。\n\n# 结论 (#toc.xhtml_s313a)\n\n内存管理是任何程序或应用程序在任何系统上运行的最关键点。JVM\
  \ 借助垃圾回收提供了强大的开箱可用内存管理功能。由于 JVM 的这一功能，开发者在开发 Java 应用程序时不需要担心内存管理，因为所有这些事情都由 JVM\
  \ 自己处理。\n\n我们可以使用调优参数显式指定并设置应用程序的内存大小，并指示和强制 JVM 触发 GC。Minor GC、Major GC 和 Full\
  \ GC 是帮助 Java 应用程序从未使用或死对象中回收内存并为新对象提供内存的三个 GC。如果没有 GC，将非常有挑战性且困难。\n\n# 注意事项 (#toc.xhtml_s314)\n\
  \n*   `finalize` 方法在每个对象上被调用。\n*   堆被分为年轻代、老年代和永久代。\n*   Minor、Major 和 Full GC 是帮助\
  \ Java 应用程序从未使用或死对象中回收内存并供新对象使用的三种 GC。\n\n# 多选题 (#toc.xhtml_s315)\n\n1.  哪种垃圾回收在老年代上运行？\n\
  \    a. Full\n    b. Major\n    c. Minor\n2.  幸存区是哪种代的部分？\n    a. Permanent\n  \
  \  b. Old\n    c. Young\n3.  新创建对象的分配发生在哪个堆内存？\n    a. Survivor space\n    b. New\
  \ generation\n    c. Old generation\n\n# 答案 (#toc.xhtml_s316)\n\n1.  b\n2.  c\n\
  3.  d\n\n# 问题 (#toc.xhtml_s317)\n\n1.  `Final`、`Finally` 和 `finalize` 之间的区别是什么？\n\
  2.  写出垃圾回收的类型。\n3.  为什么 JVM 不保证显式执行？简述。\n\n# 关键词 (#toc.xhtml_s318)\n\n*   `Heap`:\
  \ 堆是存储对象的动态分配内存，位于计算机的 RAM 中。\n*   `Generation`: 代是堆的逻辑划分部分。\n*   `GC`: 垃圾回收（Garbage\
  \ Collection）。\n*   `JVM`: 虚拟机是 Java 程序的平台。\n\n# 术语表 (#toc.xhtml_s319)\n\n1.  [`docs.oracle.com/cd/E19159-01/819-368/abeik/index.html`](https://docs.oracle.com/cd/E19159-01/819-368/abeik/index.html)\n\
