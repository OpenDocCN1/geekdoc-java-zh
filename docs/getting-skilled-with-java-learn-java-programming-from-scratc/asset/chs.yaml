  在本章中，我们将讨论以下主题：\n\n* Java 编程\n* 计算机编程历史\n* 为什么开发者偏于使用 Java \n* 软件开发包 (SDK)\n* Java\
  \ 开发工具包 (JDK)\n* Java 虚拟机 (JVM)\n\n## 目标\n\n成功完成本章后，你将能够：\n\n* 讨论并解释计算机编程的历史及其必要性\n\
  * 讨论各种计算机编程语言\n* 理解 Java 编程语言\n* 理解为什么 Java 编程被程序员广泛使用\n* 解释各种类型的编程语言及其用途\n* 解释软件开发包\
  \ (SDK) 和 Java 开发工具包 (JDK)\n* 讨论编译器、解释器和程序执行的机制\n* 解释 Java 架构\n\n# Java 简介\n\nJava\
  \ 是一种高级、面向对象、函数的编程语言，用于开发和设计基于计算机或移动设备的应用程序和软件。Java 编程模式基于 `C++`，`C++` 也是一种面向对象的编程语言。Java\
  \ 由计算机科学家 James Gosling 及其团队于 1991 年在 Sun Microsystems 实验室开发。\n\n## 编程语言类型\n\n我们用于在计算机和机器上执行某些操作的编程语言有两种类型。\n\
  \n### 低级语言\n\n低级语言可以直接被计算机处理器所理解。我们只能使用二进制数字 `0` 和 `1` 与硬件交互，因为机器和处理器只理解二进制数字，并且需要所有输入都为二进制格式以执行操作。我们有两种低级语言：\n\
  \n### 机器语言\n机器语言由二进制数字组成，其中每条命令都以二进制格式编写。这种语言速度非常快，因为不需要解释器将命令传递给处理器。处理器可以轻松地理解用二进制编写的步骤。机器语言被称为`第一代语言`\
  \ (`1GL`)。\n\n以下是一个相两个数字变量的机器语言程序示例。该程序仅向你展示机器码的样式。不要纠结于此：\n\n| 地址十六进制 | 指令代码二进制\
  \ | 指令代码十六进制 | 指令 | 注释 |\n| :--- | :--- | :--- | :--- | :--- |\n| 100 | 0010 0001\
  \ 0000 0100 | 2104 | LDA 104 | 将第一个操作数加载到 AC |\n| 101 | 0001 0001 0000 0101 | 1105\
  \ | ADD 105 | 将第二个操作数加到 AC |\n| 102 | 0011 0001 0000 0110 | 3106 | STA 106 | 将和存储在位置\
  \ 106 |\n| 103 | 0111 0000 0000 0001 | 7001 | HLT | 停止计算机 |\n| 104 | 0000 0000 0101\
  \ 0011 | 0053 | operand | 十进制 83 |\n| 105 | 1111 1111 1111 1110 | FFFE | operand\
  \ | 十进制 -2 |\n| 106 | 0000 0000 0000 0000 | 0000 | operand | 将和存储在此处\n\n**示例 1.1:**\
  \ 相两个数字变量的机器语言程序示例\n\n### 汇编语言\n汇编语言也是一种低级语言，但它为人类编写程序以及理解他们将命令处理器执行的指令提供了便利。我们不再使用二进制数字（即\
  \ `0` 或 `1`），而是使用符号操作码来编写语句，例如 `add`、`sub`、`mov`。\n\n在汇编器的帮助下，汇编语言程序被编译并转换为 `0`\
  \ 和 `1` 组成的字符串，供处理器执行。汇编语言被称为`第二代语言` (`2GL`)。\n\n以下是一个相两个数字的汇编语言程序示例。该程序仅向你展示汇编程序的样式。不要纠结于此：\n\
  \n```\ndata segment\na db 09h\nb db 02h\nc dw ?\ndata ends\ncode segment\nassume\
  \ cs:code,ds:data\nstart:\nmov ax,data\nmov ds,ax\nmov al,a\nmov bl,b\nadd al,bl\n\
  mov c,ax\nint 3\ncode ends\nend start\n```\n\n**示例 1.2:** 相两个数字的汇编语言程序示例\n\n上述程序仅供你参考，以便你直观地看到汇编程序的样式。\n\
  \n### 高级语言\n\n高级语言也被称为`第三代语言` (`3GL`)。高级语言由语句和语法组成。这些语法是有意义的，人们可以很容易学习和理解程序。\n\n\
  Java 是高级语言的一个示例。`C`、`C++`、`COBOL` 和 `FORTAN` 都是`高级语言` (`HLL`) 的示例。\n\n```java\n\
  public class AddNumbers {\n    public static void main(String[] args) {\n      \
  \  int a = 5, b = 6, result;\n        result = a + b;\n        System.out.println(\"\
  Addition of two numbers is: \" + result);\n    }\n}\n```\n\n**示例 1.3:** 相两个数字的高级程序示例\n\
  \n上述程序仅供你参考，以便你直观地看到高级程序的样式。\n\n# 计算机编程历史\n\n第一种编程语言是由 Ada Lovelace 在计算机时代为 Charles\
  \ Babbage 开发的。之后有一系列由计算机科学家开发的编程语言列表：\n\n* **分析机算法**: 1883 年，数学家 Ada Lovelace 写出了一个计算伯努利数的算法。\n\
  * **汇编语言**: 1949 年，Kathleen Booth 创建了一种用于与计算机交互的新语言。这是一种低级语言...\n* **自动码 (Autocode)**:\
  \ 第一种自动码及其编译器是由英国计算机科学家 Alick Edwards Glennie 为曼彻斯特大学的 Mark1 计算机开发的。自动码是第一种使用编译器来编译用自动码编写程序的编程语言。\n\
  * **公式翻译语言 (Fortran)**: 1957 年，John Backus 开发了一种语言来简化科学、数值、统计和数学计算，我们将其命名为 Fortran。\n\
  * **COBOL**: COBOL 代表`通用面向业务的语言`。1959 年，美国计算机科学家 Grace Brewster Murray Hopper 开发了这种语言用于业务。\n\
  * **BASIC**: 1964 年，数学家 John Kemeny 和 Thomas Kurtz 开发了一种非结构化通用的计算机编程语言，以便非技术专业的学生也能使用计算机。\n\
  \n\n\n\n\n- **C**: 1972 年，贝尔实验室的美国计算机科学家 Dennis Ritchie 开发了 C 编程语言。它是基于 `BCPL`（基础组合编程语言）的。这被认为是第一种高级程序语言，并广泛用于与硬件交互。自\
  \ 1989 年以来，C 语言已由 `ANSI` 和 `ISO` 标准化。它被用于操作系统应用、超级计算机和嵌入式系统。\n- **C++**: Bjarne\
  \ Stroustrup 在 1985 年将 C 升级为 `C++`。这是一种基于类、面向对象的通用编程语言，用于高性能的软件和应用程序。\n- **Python**:\
  \ 1991 年，Python 由 Guido Van Rossum 开发。Python 是一种用于数据科学程序的面向对象、容易（此处应为易用）、易用且高效的编程语言。使用\
  \ Python，我们只需要编写极少数代码，通过直击重点且逻辑的代码即可获得预期结果。\n- **Visual Basic**: 1991 年，该语言由微软公司开发。这是计算机历史上第一种开发者可以复用现有代码模块作为组件的编程语言。为此，Visual\
  \ Basic 提供了丰富的图形用户界面（`GUI`），只需简单地拖放复用组件，即可将该代码的功能添加到新的应用程序和软件中。\n- **Java**: 1995\
  \ 年，James Gosling 在太阳微系统公司开发了 Java。Java 是一种基于类、面向对象、函数型、多用途编程语言。Java 以其最大的特性而闻名：一旦编译，Java\
  \ 代码可以在任何操作系统上运行，这使得 Java 具有平台无关性。编译代码可以在任何安装了 `JVM` 的机器上运行。2019 年 9 月，Oracle 发布了\
  \ Java 13。\n- **C# (C sharp)**: 2001 年，微软发布了 C#。C# 也是一种面向对象的编程语言，其开发模式与 Java 和 `C++`\
  \ 相同。这种语言用于几乎所有的微软产品。\n- **GO**: 2009 年，Google 针对当前编程世界的需求开发了这种编程语言。用 Go 编写的程序是一种快速、静态类型、编译型语言，但感觉像动态类型、解释型语言。Go\
  \ 使用的语法类似于 C。\n\n在这里，我们尝试列出软件开发者最常用的几种编程语言。编程语言列表非常长且在不断更新。在这个计算机时代，我们每天都有需求，为了满足需求并填补空白，计算机科学家不断开发框架和语言。\n\
  \n## Java 的特性\n\nJava 具有许多其他编程语言不具备的独特特性。我们将讨论 Java 的几个突出特性，这些特性鼓励开发者使用 Java 编程编写应用程序和软件。使用\
  \ Java，我们可以开发完整的应用程序和软件。以下是 Java 编程语言的特性：\n\n- **平台无关**: Java 是平台独立的；这意味着我们可以一次构建代码，然后在任何机器或服务器上部署和运行。\n\
  - **可扩展性**: Java 是一种面向对象的编程语言，这使得代码是模块化、可扩展且易于使用和编写的。\n- **库**: Java 在市面上有一个非常巨大的开源库可用。由于它是开源且免费的程序，任何人都可以为创建\
  \ Java 库做出贡献。这些库以后可以被开发者用于编写代码。\n- **面向所有设备开发**: 它支持所有平台的各种开发。我们可以使用 Java 开发桌面端、Web\
  \ 和移动端应用程序。\n- **开源 JDK**: Java 是开源的。用户可以从官方网站下载 `JDK` 并使用。Java 的学生或开发者无需支付任何费用即可使用\
  \ Java。个人开发者或开发者小组也可以向 `JDK` 贡献以构建新的类和方法。\n- **易用**: Java 易于学习和使用。有很多书籍和在线材料可用于学习\
  \ Java 语言。\n- **开发工具**: 为 Java 开发者提供了一些优秀的 IDE，如 `Eclipse`、`NetBeans` 和 `IntelliJ`。这些工具具有\
  \ `IntelliSense`，可以不断为开发者提供提示以完成代码的语法和语句。\n\nJava 的这些特性使其在开发者中流行，并鼓励他们使用 Java 编写程序。\n\
  \n## 运行 Java 所需的软件\n\n每个软件都带有一个软件开发工具包。该软件开发工具包包含了所有所需的库和包，我们需要编写它们并构建开发者编写的代码。要开始使用\
  \ Java，我们需要在机器上安装 Java 开发工具包（`JDK`）。`JDK` 是免费提供的，可以从 Java 官方网站下载。市上有三种 Java 模块可用：\n\
  \n- **J2EE**: Java 企业版进阶模块，我们可以在其中使用 `EJB`、`servlet`、`JNDI` 和 `JMS`。它还包含了 `J2SE`。因此，我们可以在高级\
  \ Java 编程中使用 Java 的 API 和库。\n- **J2SE**: Java 标准版是用于核心 Java 库和 API 的 SDK，我们主要用它开发应用程序和程序。这包含了\
  \ `util` 和 `lang` 等 API。\n- **J2ME**: Java 微型版是 Java `SDK` 的轻量级。它主要用于为手机、平板电脑等便携和小型设备开发应用程序和软件。\n\
  \n这三个模块用于不同的目的。你可以从标准版开始，对于 Java 开发者来说，标准版几乎提供了所有所需内容。\n\n### Java 开发工具包\n\n`JDK`\
  \ 是一种软件开发工具包，提供了编写和执行 Java 程序所需的完整开发环境。每种编程语言都有自己的软件开发工具包。它在你的机器上创建开发环境，并为你提供所需的库。你可以参考\
  \ JDK 官方文档来了解所有内置的 API 规范。\n\n`JDK` 由 `JRE` 和 `JVM` 组成。\n\n### JDK 的作用\n\n- `JDK`\
  \ 将 Java 源代码（`.java`）编译成字节码（`.class`）。这种字节码以后可以在 `JRE` 上执行，以运行软件和应用程序。编译后，`JDK`\
  \ 为每个 Java 文件创建一个同名的 .class 文件。例如，`example.class` 是 `example.java` 的编译版本。\n- `JDK`\
  \ 也帮助我们调试代码。我们可以使用现代 IDE 轻松启动调试选项并逐语句执行程序。\n\n### Java 运行环境\n\n每个 Java 程序都需要一些库和组件来运行\
  \ Java 应用程序或程序。`JRE` 为你的 Java 程序提供这些库和组件，以便你的程序解析所需的依赖项。使用 `JRE`，你只能运行好的 Java 应用程序和程序。你不能使用\
  \ `JRE` 编写并编译新的 Java 程序。要这样做，你需要 `JDK`。\n\n### Java 虚拟机\n\nJava 虚拟机为 Java 程序提供执行平台，Java\
  \ 编写的程序在此执行。这使得你的计算机能够兼容用 Java 编译的软件和应用程序。它解释编译代码（`.class` 文件）使其能够运行。\n\n当你机器上安装\
  \ `JDK` 或 `JRE` 时，Java 会在操作系统（`OS`）中创建自己的虚拟机 `JVM` 来运行用 Java 编写的程序。\n\n\n\n\n\n\
  ### 即时编译编译器 (JIT)\n\n即时编译编译器是 Java 虚拟机的一部分，出现在任何有 `JVM` 的地方。它帮助 `JVM` 将接收来自 `JRE`\
  \ 的字节码（`java .class` 文件）编译成机器码指令。由于机器及其硬件只能理解机器语言，`JIT` 帮助 `JVM` 将这些代码/程序转换为机器语言，以便机器进行执行和操作。\n\
  \n下面的 `图 1.1` 解释了 Java 开发包的完整架构及其作为 `JDK` 一的成员。我们已经讨论了 `JDK` 的各个部分，如 `JRE`、`JVM`\
  \ 和 `JIT` 以及它们在 Java 中的作用：\n\n![](img/figure-1.1.jpg)\n\n**图 1.1:** Java 代码的编译与执行过程\n\
  \n`图 1.1` 显示了用 Java/Java 源编写的代码如何在机器中执行，以及它必须经过哪些步骤才能完成成功执行并生成结果。\n\n在第一步中，`example.java`\
  \ 文件由 `JDK` 编译，将 Java 代码转换为字节码并将其保存为新文件 `example.class`。此外，所有的语法错误和编译错误只能在此时修复。如果你的代码有任何语法错误，编译器将无法编译你的源文件。\n\
  \n在第二步中，`JRE` 开始出现，作为输入，它接收由 `JDK` 创建的带有 `.class` 扩展名的字节码文件。在我们情况下，它是 `example.class`。现在，`JRE`\
  \ 将所需的类和对象解析字节码，并将其传递给 `JVM` 执行。\n\n在第三步中，`JVM` 接收 `example.class` 文件。由于 `JVM` 不理解字节码，它将其发送给其成员之一的\
  \ JIT，JIT 将字节码转换为机器码，以便 `JVM` 理解并执行该代码。\n\n## 结论\n\nJava 是一种高级计算机编程语言，用于为任何设备设计应用程序和软件。它是平台无关的。Java\
  \ 编译后的代码可以在任何机器上运行。`JDK` 是 Java 的软件开发工具包，由 `JRE` 和 `JVM` 组成。Java 于 1995 年进入市场，最新的\
  \ Java 版本是 13，它于 2019 年 9 月发布。\n\n机器只能理解用机器语言编写的程序。在机器语言中编写用于长时间计算的程序是非常的。因此，我们使用高级编程语言来编写程序。这些程序随后由编译器编译和解释转换为字节码和机器语言。\n\
  \n计算机语言分为三类：机器语言、汇编语言和高级语言。这也被称为计算机编程语言的代。\n\n在本章中，你学习了 Java 编程的基础架构、计算机编程的历史及其类型。希望大家对这些内容心中都有了清晰的认识。在下一章中，我们将学习如何为\
  \ Java 配置我们的机器或计算机。\n\n## 记忆要点\n\n*   编写 Java 程序需要 Java 开发工具包 (`JDK`)。\n*   Java\
  \ 是平台无关的，可以在任何操作系统上运行。\n*   当你在机器上安装 `JRE` 和 `JDK` 时，Java 会机器内部创建一个自己的虚拟机来运行 Java\
  \ 程序。\n*   `JRE`、`JVM` 和 `JIT` 是 `JDK` 的组成部分。\n\n## 单选题\n\n1.  **哪个负责将字节码解释为机器码？**\n\
  \    1.  Java 虚拟机\n    2.  Java 运行环境\n    3.  Java 编译器\n    4.  即时编译器\n2.  **Java\
  \ 是哪一年开发的？**\n    1.  1987\n    2.  1990\n    3.  1995\n    4.  1991\n3.  **Java\
  \ 运行环境 (JRE) 包含：**\n    1.  `JDK` 和 `JVM`\n    2.  `JDK` 和 `JIT`\n    3.  `JDK`、`JRE`\
  \ 和 `JVM`\n    4.  `JVM`\n\n## 答案\n\n1.  **d**\n2.  **c**\n3.  **d**\n\n# question\n\
  \n1. 什么是 `JDK`、`JRE` 和 `JVM`？\n2. 为什么 Java 是平台无关的？\n3. 谁发明了 Java 编程？什么时候时候？\n\n\
  ## 核心术语\n\n*   **IntelliSence**: 一项代码补全功能，用户可以获得完成代码语句下一个可能的方法和参数的提示。这也被称为自动补全或代码辅助。\n\
  *   **Functional programming**: 函数式编程是一个术语，我们将程序的每条语句都拖到一个数学函数中。我们使用运算符、操作数、函数并专注于解决问题。\n\
  *   **Object oriented programming**: 这是一种基于对象的编程模式。它将由基于真实世界系统的类和对象组成。\n*   **Compiler**:\
  \ 它将用高级语言编写的程序转换或解释为机器语言（二进制）。\n\n## 术语表\n\n*   **ANSI**: 美国国家标准协会\n*   **CLI**:\
  \ 命令行界面\n*   **GL**: 代语言\n*   **GUI**: 图形用户界面\n*   **HLL**: 高级语言\n*   **ISO**: 国际标准化组织\n\
  *   **JDK**: Java 开发工具包\n*   **JIT**: 即时\n*   **JRE**: Java 运行环境\n*   **JVM**: Java\
  \ 虚拟机\n*   **OS**: 操作系统\n*   **SDK**: 软件开发工具包\n*   **IDE**: 集成开发环境\n\n## 参考文献\n\n\
