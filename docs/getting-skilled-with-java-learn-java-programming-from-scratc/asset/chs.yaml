  \   5. 实现 `run()` 方法\n    6. 实现 `Runnable` 接口\n\n3. **Java 线程的默认优先级是什么？**\n    1.\
  \ `MIN_PRIORITY`\n    2. `MAX_PRIROTY`\n    3. `HIGH_PRIORITY`\n    4. `NORM_PRIORITY`\n\
  \n4. **线程类必须实现哪个方法？**\n    1. `start()`\n    2. `join()`\n    3. `create()`\n  \
  \  4. `run()`\n\n5. **哪一个不是线程的有效状态？**\n    1. `Active`\n    2. `New`\n    3. `Runnable`\n\
  \    4. `Waiting`\n\n## 答案\n\n1. **a**\n2. **d and f**\n3. **d**\n4. **d**\n5. **a**\n\
