  \n本章旨在让学生熟悉 Java 编程中的文件和输入输出术语。在学习本章后，学生可以解释 `File` 类、输入和输出对象，并在编程实践中使用这些概念。在成功完成本章后，你将能够解释文件或输入输出流中使用的各种术语。你还将能够使用文件编写和理解\
  \ Java 程序及应用程序，并对文件系统中的文件进行操作。我们还将讨论序列化和反序列化，以及这些技术如何帮助不同应用程序和软件之间的数据传输和通信（主要是在\
  \ API 和网络服务方面）。\n\n此外，我们将通过示例程序查看一些读取（reader）和写入（writer）类及其用例。\n\n输入和输出是处理不同类型文件的重要编程概念，用于对文件系统中的文件执行读、写和删除操作。`java.io`\
  \ 是自 Java 1.0 以来用于处理文件的类包。在 Java 7 中，我们又得到了一个 `java.nio.file` 包，它拥有在 IO 之上设计的更高级的方法，克服了\
  \ `java.io.File` 的各种局限性。\n\n让我们了解 `File` 的不同类。\n\n## File\n\n`File` 类是为 Java 虚拟机提供访问文件系统的类。通过它，我们可以在计算机内存中创建和定位文件。`File`\
  \ 类的对象是不可变的，这意味着一旦对象被创建，它永远不会改变。\n\n声明 `File` 类对象的语法如下：\n\n`File newFile = new File(<包含文件名的路径>);`\n\
  \n路径名可以是相对路径也可以是绝对路径。相对路径必须根据从其他路径名或应用程序当前路径获取的信息来解释，该路径通常是 JVM 运行应用程序和程序的路径。绝对路径是完整的，包含了驱动器和目录，不需要其他信息即可定位文件。默认情况下，`java.io`\
  \ 包中的类始终根据当前用户目录解析相对路径名。\n\n**示例： 13.1** 使用 Java 中的 File 类创建文件的示例程序\n\n```java\n\
  import java.io.File;\nimport java.io.IOException;\n\npublic class FileExample {\n\
  \    public static void main(String[] args) throws IOException {\n        File newFile\
  \ = new File(\"ListOfCities.txt\");\n        if (newFile.createNewFile()) {\n  \
  \          System.out.println(\"File created.\");\n        } else {\n          \
  \  System.out.println(\"File exists.\");\n        }\n    }\n}\n```\n\n**输出**:\n\n\
  ![](img/Image-13.1.jpg)\n\n**图 13.1：** File 示例程序的输出\n\n上一个程序将在当前项目目录下创建 `ListOfCities.txt`\
  \ 文件，因为我们只将文件名作为 `File` 类的参数，这会被 JVM 视为相对路径。下一行代码使用 `createNewFile()` 方法检查系统中是否存在同名文件，该方法返回\
  \ true 或 false。根据 `createdNewFile` 的返回值，我们在控制台上打印一条文本消息；因此在我们的案例中，该方法返回 false。因此，光标移动到\
  \ `else` 部分并打印消息 `“File Exists”`。\n\n我们也可以将绝对路径作为 File 对象的参数，以便在该路径下创建文件。\n\n例如，`File\
  \ newFile = new File(“D:\\sample book\\io\\ListOfCities.txt”);`\n\n## Stream\n\n\
  流（Stream）是从源流向目的地的数据序列。在这里，源称为输入，目的地称为输出。输入和输出流支持许多数据类型，如字符、字符串和对象。\n\n流有两种类型 -\
  \ 输入流和输出流，并且两者都实现了字节和字符类型的流来读取和写入数据：\n\n*   **字节流 (Byte Streams)**：字节流用于执行 8 位字节的输入输出。`FileInputStream`\
  \ 和 `FileOutputStream` 等类支持字节流。\n*   **字符流 (Character Streams)**：字符流用于执行 16 位 Unicode\
  \ 字符的输入输出。`FileReader` 和 `FileWriter` 等类支持字符流。\n\n### Input stream\n\n输入是从任何源（如文件、设备、套接字和控制台）读取数据的过程。人类第三方应用程序与系统交互时，系统将期望某些输入以处理后续步骤。输入流帮助我们读取来自外部源的字节。`InputStream`\
  \ 是所有输入类的抽象类和超类。让我们详细学习一些输入类和读取类。\n\n### FileReader\n\n`FileReader` 是一个使用默认缓冲区大小从文件中读取字符或文本的类。它只从文件中读取字符流并与文件建立连接。\n\
  \n声明 `FileReader` 类对象的语法：\n\n`FileReader fileReaderObj = new FileReader(“<文件名>\"\
  );`\n\n如果我们必须读取字节流，请考虑并使用 `FileInputStream`，因为 `FileReader` 仅用于读取文件中的文本和字符。\n\n\
  ### FileInputStream\n\n`FileInputStream` 是一个帮助我们从文件获取输入字节并在存储系统中的文件与应用程序之间建立连接的类。\n\
  \n`FileInputStream` 构造函数用于打开文件的连接，参数对象或名称是存储在文件系统中的文件：\n\n`FileInputStream(File\
  \ fileObject) or FileInputStream(String fileName)`\n\n该类具有以下被认为很重要的方法，其中一些方法是使用\
  \ `FileInputStream` 的类必须实现的：\n\n*   `read()`：此方法返回一个整数值并从输入流中读取一个字节数据。Read 方法可能或不带有字节长度的参数。\n\
  *   `close()`：此方法类型为 void，不返回任何值。它用于关闭输入流并释放与流相关的系统资源。\n*   `finalize()`：此方法类型为\
  \ void，不返回任何内容。Finalize 方法确保在读取所有输入后在输入流上执行 `close()` 方法，并释放所有引用以便清理内存。\n*   `available()`：此方法返回一个整数值，提供可以从输入读取的剩余字节估计。\n\
  *   `skip()`：此方法返回一个 long 值，并接受一个 long 值作为参数，跳过并丢弃输入流中指定数量的字节数据。\n\n在上述方法列表中，`read`\
  \ 和 `close` 必须由所有类实现。除此之外的方法是可选的，其实现取决于场景和开发人员。\n\n### Output stream\n\n输出流将数据作为输出写入数组、文件或任何输出设备。这是一个抽象类，其子类通过实现来生成输出。输出流部分的类包括\
  \ `BufferedOutputStream`、`ByteArrayOutputStream`、`FileOutputStream` 和 `ObjectOutputStream`。让我们详细讨论一些输出流。\n\
  \n### FileOutputStream\n\n`FileOutputStream` 用于在文件系统中创建文件并将数据写入该文件。如果你尝试使用 `FileOutputStream`\
  \ 向现有文件写入数据而该命名文件在文件系统中不存在，则 `FileOutputStream` 将创建一个同名文件并将数据添加到其中。\n\n让我们查看 `FileOutputStream`\
  \ 的语法：\n\n`OutputStream f = new FileOutputStream(“path of the file.` `Or object\
  \ of the File class”)`\n\n\n\n\n\n要使用 `FileOutputStream` 创建文件，我们需要传递一个参数来调用构造函数并创建文件。该参数可以是文件的绝对路径或相对路径，也可以如前面的语法所示的\
  \ `File` 类的对象。\n\n**示例 13.2**：使用 `BufferedReader` 配合 `FileReader` 从文件中读取文本的程序：\n\
  \n```java\nimport java.io.FileOutputStream;\nimport java.io.IOException;\nimport\
  \ java.io.OutputStream;\n\npublic class OutputStreamExample {\n    public static\
  \ void main(String args[]) {\n        try {\n            OutputStream oStream =\
  \ new FileOutputStream(\"Output.txt\");\n            oStream.write(70);\n      \
  \      oStream.write(65);\n            oStream.write(78);\n            oStream.close();\n\
  \            System.out.println(\"Successfully created and written the file.\");\n\
  \        } catch (IOException e) {\n            System.out.print(\"Exception\");\n\
  \        }\n    }\n}\n```\n\n**输出：**\n\n![](img/Image-13.2.jpg)\n\n**图 13.2：**述文件程序\
  \ OutputStreamExample 的输出\n\n上述程序将在当前目录中成功创建一个文件 `Output.txt`，并写入数字 70、65 和 78 的\
  \ Unicode 字符（FAN）。下图显示了 `Output.txt` 文件的内容：\n\n![](img/Image-13.3.jpg)\n\n**图 13.3：**\
  \ Output.txt 文件内容\n\n要将字符串写入文件，我们必须将 String 的字节转换为字节数组，然后使用 `write` 方法将字节数组写入文件。例如：\n\
  \n```java\nString s=\"FileOutputStream Java IO example.\";\nbyte b[] = s.getBytes();\
  \ // 这一行将字符串 s 转换为字节数组 b。\noStream.write(b); // 将字节数组 b 写入文件。\n```\n\n**注意：`FileOutputStream`\
  \ 主要用于写入原始字节流，例如图像或视频文件的数据。对于向文件写入字符流，我们应该考虑使用 `FileWriter` 类。**\n\n# Writer（写出器）\n\
  \n`Writer` 类是一个抽象类，帮助写入字符流。`Writer` 类没有直接的实现，但我们使用它的子类来在文件上执行写操作。`write()`、`close()`\
  \ 和 `flush()` 方法必须由 `Writer` 类的子类实现：\n\n![](img/Image-13.4.jpg)\n\n**图 13.4：** Writer\
  \ 类内部的类和子类\n\n`Writer` 类的一些著名子类包括 `BufferedWriter`、`CharArrayWriter`、`FilterWriter`、`OutputStreamWriter`、`PipedWriter`、`PrintWriter`\
  \ 和 `StringWriter`。我们将在本章通过示例详细讨论几个类。\n\n### FileWriter\n\n`FileWriter` 类用于使用默认缓冲区将文本写入字符文件。`FileWriter`\
  \ 写入字符流并使用字符集（charset）将字符编码为字节。该类继承自 `OutputStreamWriter` 类。`OutputStreamWriter`\
  \ 类的所有特征和方法也可以用于 `FileWriter`。\n\n以下是声明 `FileWriter` 类对象的语法：\n\n```java\nFileWriter\
  \ fileWriterObj = new FileWriter (File file);\n```\n\n上述代码语句将创建一个 `FileWriter` 对象并打开指定的文件，用默认字符集写入字符。如果我们也想指定\
  \ `charset`，则可以在此默认构造函数中再添加一个参数：\n\n```java\nFileWriter fileWriterObj = new FileWriter\
  \ (File file, Charset charset);\n```\n\n`FileWriter` 不用于存储原始字节流。如果我们需要将字节流存储到文件中，应该使用\
  \ `FileOutputStream`。\n\n所有 File 和 IO 类都实现了 `AutoCloseable` 和 `Flushable` 接口。`AutoCloseable`\
  \ 帮助我们自动触发 `close()` 方法。\n\n\n\n\n\n文件 `ListOfCities.txt` 包含了控制台输出所示四个城市的名称。以下是\
  \ `ListOfCities` 文件内容的截图：\n\n![](img/Image-13.7.jpg)\n\n**图 13.7：** 示例 13.2 中使用的文本文件\
  \ ListOfCities 的快照\n\n### BufferedReader\n\n`BufferedReader` 类是 `Reader` 类的子类，它用于读取文本或缓冲字符或字符输入流，并提供对字符、行或数组的高效读取。如果我们需要处理巨大的输入流，可以指定缓冲区的大小，或者直接使用默认缓冲区大小。它可以与\
  \ `FileReader` 或 `InputStreamReader` 或其他读取类配合使用，从文件或流中读取字节输入并返回序列化和反序列化的数据。\n\n\
  以下是通过指定大小来声明 `BufferedReader` 的语法：\n\n`BufferedReader bReader = new BufferedReader(readerObject)`\n\
  \n通过指定大小声明 `BufferedReader` 的语法：\n\n`BufferedReader bReader = new BufferedReader(readerObject,\
  \ int size)`\n\n**示例 13.3**：使用 `BufferedReader` 配合 `FileReader` 从文件读取文本的程序：\n\n\
  ```\nimport java.io.BufferedReader;\nimport java.io.FileReader;\nimport java.io.IOException;\n\
  \npublic class FileAndBufferedReader\n{\n    public static void main(String[] args)\
  \ throws IOException\n    {\n        FileReader fReader = new FileReader(\"SampleFile.txt\"\
  );\n        BufferedReader bReader = new BufferedReader(fReader);\n        int records;\n\
  \        while((records = bReader.read()) != -1) {\n            System.out.print((char)records);\n\
  \        }\n        bReader.close();\n        fReader.close();\n    }\n}\n```\n\n\
  **输出：**\n\n![](img/Image-13.8.jpg)\n\n**图 13.8：** 示例 13.3 的输出\n\n上述 Java 程序展示了如何实现\
  \ `FileReader` 类以打开与文件系统中的文件 `SampleFile.txt` 的连接。在这里，`BufferedReader` 类帮助从指定的文件对象读取字符。\n\
  \n在完成读取操作后，我们在程序结束时通过 `close()` 方法关闭对象并移除引用。\n\n**注意：建议在操作完成后对所有的 Reader 和 File\
  \ 类执行 close 方法。如果我们不关闭连接，可能会导致内存问题或达到打开连接数的阈值。**\n\n## 序列化与反序列化\n\n序列化是将 Java 对象转换为字节流的过程。当我们序列化一个对象时，意味着我们实际上是在将其状态转换为字节流，以便该字节流以后可以转换为\
  \ Java 对象的副本。我们可以通过实现 `java.io.Serializable` 接口或其子接口 `java.io.Externalizable` 来使\
  \ Java 对象变为可序列化。可以通过实现序列化来持久化任何对象的状态，并在网络上传输或传递该对象，以便其他系统或应用程序消耗或使用该字节流。这也有帮助我们把对象的状态存储到文件或数据库中作为永久存储。字节流是与平台无关，这意味着我们可以在任何机器或平台上进行序列化和反序列化，并且可以被任何系统读取和理解。当我们有某些数据或文件需要传输到其他系统/应用程序或与外部应用程序通信时，主要使用序列化方法。\n\
  \n`Serializable` 是一个标记接口（marker interface），标记接口不包含任何方法或成员。它标记了一个 Java 类，使得该类的对象具有某些额外的功能，并且\
  \ JVM 会以不同的方式处理这些对象。\n\n`Serializable` 只保存或持久化对象的非静态成员；对象的静态成员不会被序列化。如果我们不想序列化类的任何非静态成员，则可以将该成员声明为\
  \ `transient`。如果我们尝试序列化一个不支持序列化的对象，系统将为此抛出 `NotSerializableException`。\n\n反序列化是序列化的反向操作，即将字节流转换为\
  \ Java 对象。\n\n`ObjectOutputStream` 和 `ObjectInputStream` 是具有 `writeObject` 和 `readObject`\
  \ 方法的 IO 类，这些方法帮助我们写入和读取类对象的状态。`writeObject()` 方法负责写入该类的对象状态，而 `readObject()` 方法负责从流中读取并恢复类的字段。\n\
  \n序列版本 UID（Serial version UID）：\n\n实现序列化的类将获得一个唯一的 long 类型 UID。此 UID 由编译器自动生成，或者我们可以显式地它分配一个唯一的\
  \ long 值。序列版本 UID 在映射和识别正确的类方面非常有用，它可以帮助 JVM 检查序列化对象的发送方和接收方是否加载了同一个类。如果 UID 不匹配，编译器将抛出\
  \ `InvalidClassException`。\n\n例如：\n\n`private static final long serialversionUID\
  \ = 123456789001L;`\n\n上述语句是为可序列化类生成的 `serialversionUID` 示例。\n\n## 结论\n\n文件输入和输出是使用\
  \ Java 编程执行文件操作的方法。输入流用于从文件读取字节或字符，输出流用于将字节和字符写入文件系统的文件中。我们分别使用 `FileReader` 和 `FileWriter`\
  \ 类来读写字符流，并使用 `FileInputStream` 和 `FileOutputStream` 类来读写原始字节流。\n\n我们可以使用 `try-with-resources`\
  \ 来避免显式地为对象编写 `close()` 方法。\n\n\n\n\n\n1. 使用 `FileReader` 编写一个程序，从本地系统的存储文件中读取文本。文件名应为“Fruits.txt”，并包含至少\
  \ 10 种水果名称。\n\n2. 字节流（Byte stream）和字符流（Character Stream）之间的区别是什么？\n\n3. 什么是 `charset`？包含哪些类型的\
  \ `sets`？请写说明。\n\n4. 什么是反序列化（deserialization）？\n\n## 核心术语\n\n- **流 (Stream)**：流是从源到目的流动的数据序列。\n\
  - **字节 (Byte)**：字节是计算机上信息或数据大小的测量单位。\n- **字符集 (Charset)**：它是十六位 Unicode (UTF-16)\
  \ 字符序列与字节之间的命名映射。\n- **文件系统 (File system)**：文件系统管理数据在存储磁盘（通常是硬盘驱动器 HDD）上的存储方式和位置。\n\
  - **文件 (File)**：文件是存储某些内容的永久存储器。例如：文本文件、PDF、Word 文件、图像文件等。\n- **序列化 (Serialization)**：序列化是将\
  \ Java 对象转换为字节流或字符流的过程。\n- **反序列化 (Deserialization)**：反序列化是将字节流或字符流转换为 Java 对象的过程。\n\
