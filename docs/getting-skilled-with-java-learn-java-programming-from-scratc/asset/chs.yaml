  \ `Vector` 不是。\n    2. `ArrayList` 自动按当前数组大小的一半增加其大小。\n    3. `Vector` 自动按当前 vector\
  \ 大小的一半增加其大小。\n    4. `Lists` 不接受空元素。\n\n3. **以下中哪一个不是集合接口？**\n    1. `List`\n \
  \   2. `Array`\n    3. `Set`\n    4. `Queue`\n\n4. **使用哪个方法可以从队列中删除元素而不抛出异常？**\n\
  \    1. `delete()`\n    2. `remove()`\n    3. `poll()`\n    4. `truncate()`\n\n\
  5. **使用哪个方法向 Map 添加对象？**\n    1. `add()`\n    2. `put()`\n    3. `offer()`\n   \
  \ 4. `push()`\n\n6. **HashMap` 可能会存储重复的键。这个陈述是对是错？**\n    1. 对\n    2. 错\n\n# 答案\
