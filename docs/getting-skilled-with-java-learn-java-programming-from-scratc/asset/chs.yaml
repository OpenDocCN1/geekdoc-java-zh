  \n# 第 3 章：类、对象和变量\n\n在本章中，我们将讨论 Java 编程语言的基础和基本知识。这些对于学习、编写和理解 Java 源代码非常重要。如果不具备这些术语和语法的知识，你将无法编程的概念和设计。\n\
  \n## 结构\n\n在本章中，我们将讨论以下主题：\n\n- 类 (Classes)\n- 对象 (Objects)\n    - 类加载器 (Class loader)\n\
  \        - 启动类 (Bootstrap)\n        - 扩展类 (Extension)\n        - 系统类 (System)\n\
  - 包 (Packages)\n- 访问修饰符/限定 (Access modifiers/specifiers)\n    - 私有 (Private)\n \
  \   - 公有 (Public)\n    - 保护 (Protected)\n    - 默认 (Default)\n- 变量 (Variables)\n\
  \    - 变量类型 (Types of variables)\n        - 类变量 (Class variable)\n        - 实例变量\
  \ (Instance variable)\n        - 局部变量 (Local variable)\n        - 常量变量 (Constant\
  \ variable)\n- 数据类型 (Data types)\n- 方法 (Methods)\n- 带参数的方法 (Methods with arguments)\n\
  - Java 语句 (Statements in Java)\n- 注释 (Comments)\n\n## 目标\n\n完成本章后，你将能够：\n\n- 解释类、类的设计以及类的类\n\
  - 解释对象及其创建\n- 理解将多个源代码文件打包成包的过程\n- 解释类加载器、什么样的类会被加载到内存中、何时加载以及这些类加载器的意义\n- 讨论数据类型及其用于存储不同值的各种类型，以及这些数据类型的默认值\n\
  - 理解访问修饰符或限定符，它们为类、方法和变量提供了范围和可见性\n- 解释变量、Java 编程中不同类型的变量及其需求\n- 理解 Java 在源代码中添加注释的可用方法\n\
  - 解释语句以及如何开始和结束一条语句\n\n面向对象编程的一个卓越特性是拥有类。类在保持代码模块化和扩展性方面起着至关重要的作用。我们将在后续章节中讨论模块化和可扩展的代码。在本章中，我们将学习如何创建一个类、我们可以写的类类型，以及如何使用或重用类。此外，我们将讨论对象并使用\
  \ `new` 关键字创建类的对象。\n\n在编程中，我们需要变量来存储数据。例如，如果我们想执行某些操作，我们仅通过变量存储结果并为操作数提供值。在这里，我们还将讨论如何创建变量以及可以使用哪些数据类型来创建变量。数据类型是特殊含义，告诉变量该变量只能存储特定类型。\n\
  \n## 类\n\n类是对象的结构，是变量、方法、函数和算术操作的结合。在类中，我们使用不同的运算符编写所有操作，成功执行后将得到预期的结果。\n\n类可以有不同的可见性，这为类设置了限制并创建了边界。根据命名规范，类必须大大字母开头。让我们看看如何在\
  \ Java 中创建一个类。\n\n声明类的语法：\n`<access specifier/visibility> class <NameOfClass>{}`\n\
  \n例如：\n\n```java\npublic class JavaProgram {\n    // 在这里编写你的语句和操作。\n}\n```\n\n类还可以使用\
  \ `abstract`、`interface` 和 `final` 等关键字声明。我们使用这些关键字来实现不同的目的并在其中包含一些独特的特性。这些关键字本身就是一个主题。因此，我们将在后续章节中讨论。在这里，我们将看到如何使用这些关键字来创建类。\n\
  \n类可以是空的，也可以有主体。类体定义在大括号和小括号之间。所有的语句、构造函数、方法和变量只能在体内部声明。在体外部，我们无法声明任何内容。\n\n```java\n\
  public class ClassA {\n    // 这是类的体，我们所有的内容都写在这里内部\n}\n```\n\n一个 Java 源文件可以包含多个类。但只有一个类会用\
  \ `public` 修饰符声明。其他类可以是私有的、抽象的或最后的。\n\n**示例 3.1**：所有代码都是单个 `ExampleTest.java` 文件的一部分：\n\
  \n```java\npackage rashid.example.abc;\n\npublic class ExampleTest extends Base\
  \ {\n    public static void main(String[] args) {\n        ExampleTest exampleTest\
  \ = new ExampleTest();\n        Base b = new Base();\n    }\n}\n\nclass Base {\n\
  \    private void MethodEx() {\n        System.out.println(\"Base class method\"\
  );\n    }\n}\n\nabstract class NewMan {\n}\n```\n\n\n\n类成员和方法在类中使用 `static` 关键字进行声明。这些成员和方法被该类的所有实例所共享。我们可以使用类名来访问类成员和方法。访问类成员不需要创建类的对象。我们将在本章稍后的类变量部分进一步讨论这一点。\n\
  \n## 对象 (Object)\n\n对象是类的真实副本，我们在程序中创建它是为了处理或操作在类中定义的变量、方法、构造函数和操作。每当我们创建一个对象时，它都会创建一个该类的独立副本并加载到内存中。两个对象的特征可能完全相同，但它们的内存管理是完全不同的，且两者都不会互相干扰。对象共享两个特性——状态和行为。每个对象都有某些状态，并且状态不断变化。此外，对象具有行为，且对象对指令的操作也不同。例如，汽车就是一个对象。以下可能是汽车对象的状态和行为：\n\
  \n**状态**：停止，移动\n\n**行为**：换挡，启动，刹车，鸣笛\n\n我们需要对象来访问和处理实例方法以及类的成员。如果不创建类的对象，无法访问类的实例成员。实例成员在类加载时不会加载到内存中，但一旦我们创建了该类的对象/实例，实例成员的内存就会被分配。\n\
  \n我们使用 `new` 关键字创建类的对象。例如，我们有一个类 `NewYear`，现在我们想创建两个 `NewYear` 类的对象：\n\n```\nNewYearobjectOne\
  \ = new NewYear();\nNewYearobjectTwo = new NewYear();\n```\n\n这就是我们创建类对象的方式。每当我们需要使用新的对象名编写此语句时，就会创建一个该类的类对象。\n\
  \n### 类加载器 (Class loader)\n\n类加载器是 JRE 的一部分，负责将每个 Java 类文件加载到内存中，并使字节码可供 JVM 按需执行。`ClassLoader`\
  \ 类是一个抽象类。它提供了类的二进制名称。在 Java 中，库以归档文件格式的形式存在，被称为 **Java 归档** (`JAR`)。类加载器还负责从内部和外部库文件中加载类。每个\
  \ Java 类都必须由类加载器加载后才能执行。\n\n类加载是 Java 编程中最迷人的特征之一。它侧重于类的加载、链接和初始化，并使该类可以被 JVM 运行。\n\
  \n*   **加载 (Loading)**：加载有助于定位类的二进制表示并将其引入 JVM。\n*   **链接 (Linking)**：链接是一个将加载过程加载的类并将该类型整合到运行时状态/模式中，以便由\
  \ JVM 执行的过程。\n*   **初始化 (Initialization)**：初始化是执行该类对象的过程。\n\n当 Java 虚拟机启动时使用了三种类加载器。这些被称为内置类加载器。\n\
  \n### 启动类加载器 (Bootstrap class loader)\n\n启动类加载器负责将核心 Java 库类加载到 Java 虚拟机。这里，库是用原生\
  \ Java 编写的，并存在于 JRE 的 `/jre/lib` 目录下。例如 `java.*`、`javax.*` 等。启动类加载器没有父类，通常表示为 `null`。\n\
  \n### 扩展类加载器 (Extension class loader)\n\n*   扩展类加载器负责从库中加载类，这些类存在于 JRE 的 `/jre/lib/ext`\
  \ 扩展目录或系统属性 `java.ext.dirs`指定的任何目录下。`/jre/lib/ext` 目录中的任何 JAR 文件都被 **Java 运行环境**\
  \ (`JRE`) 视为扩展。\n*   `java.ext.dirs` 是一种通用的类加载机制，告知 JRE 在何处加载扩展类。\n*   从 Java 6\
  \ 开始，扩展 JAR 文件也可以存于独立于任何 JRE 的位置，这样扩展就可以被系统上安装的所有 JRE 共享。在 Java 6 之前，`java.ext.dirs`\
  \ 的值是指单个目录，但现在，Java 6 是一个目录列表（例如 `CLASSPATH`），指定了搜索扩展程序的位置。路径的第一个元素始终是 JRE 的 `lib/ext`\
  \ 目录。第二个元素是 JRE 之外的目录。此位置允许扩展 JAR 文件安装一次并供该系统上安装的多个 JRE 使用。\n\n### 系统类加载器 (System\
  \ class loader)\n\n系统类加载器负责从系统环境变量 `CLASSPATH` 列出的系统类路径中加载类。你可以参考上一章中的设置类路径变量以获取更多细节。这也被称为应用程序类加载器。\n\
  \n## 包 (Package)\n\n包是一种捆包或容器或库，我们在其中放置一个或多个 Java 类、接口以及相关的其他实体/信息。这意味着将多个相关的程序文件放在一个地方。包是任何\
  \ Java 程序的第一条语句。\n\n要创建包，我们只需要创建一个简单的文件夹，并在编译时使用 `-d` 选项：\n\n```\njavac -d C://example/program/SampleClass.java\n\
  ```\n\n创建包的目的是将相关的实体组织在一个地方。我们还可以设置可见性，这意味着使用默认访问修饰符声明的变量、方法和类对于包内的所有内容都是可见的。其他修饰符关键字（如\
  \ `private`、`public`、`protected`）按照它们设计方式工作。\n\n包还可以用于分离两个同名的类，以便它们都被视为不同的。我们还提供了该包的唯一名称，称为命名空间。通过使用此命名空间，可以使用该包中定义的类和接口的功能。\n\
  \n将类放在包下的语法：\n\n```\npackage <包的名称>\n```\n\n例如，`package org.bpb.program.sample;`。包名应该始终使用小写，并用点\
  \ (`.`) 分隔单词。\n\n在 Java 编程中，import 关键字帮助我们把包注入到程序中，这样我们就可以使用那些类。\n\n例如：\n\n```\n\
  import java.lang;\nimport java.util.List; // 仅从 util 包导入 List 类\nimport java.util.*;\
  \ // 这将从 util 包导入所有类。* 代表所有。\n```\n\nJava 库位于包之下。例如，`java.util` 和 `java.lang` 是提供不同类和接口的包，我们利用它们开发程序。下表针对\
  \ `java.lang` 包，它包含了 `String`、`Math`、`List`、`Object`、`System` 等更多类。\n\n## 访问修饰符\
  \ (Access specifier)\n\n访问修饰符是我们用于设置可见性或范围或定义变量、方法和类边界的关键字。这也被称为修饰符（modifier）。Java\
  \ 编程中有四种访问修饰符。\n\n\n\n\n\n### 私有 (Private)\n\n声明为私有的变量、方法和类只能在代码块 `{}` 内部被访问。例如，如果一个私有变量声明在方法内部，那么它只能在方法体内被访问。\n\
  \n**示例 3.2**：私有变量的作用：\n\n```java\npublic class ExampleTest {\n    public void MethodEx()\
  \ {\n        private String firstName = \"Priyank\";\n    }\n    public static void\
  \ main(String[] args) {\n        ExampleTestexampleTest = new ExampleTest();\n \
  \       exampleTest.firstName = \"Raju\"; // 我们无法在 main 方法中访问这个私有变量。\n    }\n}\n\
  ```\n\n上述程序将产生编译错误，因为我们正尝试在 main 方法中访问方法 `MethodEx` 的私有成员 `firstName`。\n\n让我们来看另一个示例，在类外部声明和访问私有方法：\n\
  \n**示例 3.3**：私有方法的作用：\n\n```java\npackage rashid.example.abc;\npublic class ExampleTest\
  \ extends Base{\n    public static void main(String[] args) {\n        ExampleTestexampleTest\
  \ = new ExampleTest();\n        Base base = new Base();\n        base.MethodEx();\n\
  \    }\n}\nclass Base {\n    private void MethodEx() {\n        System.out.println(\"\
  Base class method\");\n    }\n}\n```\n\n上述程序将在 `base.MethodEx();` 所在的行产生编译错误。“类型\
  \ `Base` 中的方法 `MethodEx()` 不可见”，这是因为我们正尝试访问基类的私有成员，该成员只能在 `Base` 类内部访问，不能由任何其他类访问，包括继承该基类的类。\n\
  \n### 公有 (Public)\n\npublic 修饰符使所有内容变为公有。使用 public 修饰符声明的变量、方法和类可以被任何类和方法访问。public\
  \ 没有定义任何限制或边界。\n\n### 保护 (Protected)\n\n访问修饰符 `Protected` 介于私有和公共之间。它允许同一包内的所有类以及其他类的子类进行访问。在这里，派生类或子类意味着\
  \ `protected` 将允许从基类或父类继承属性。\n\n让我们设计两个类 `ParentClass` 和 `ChildClass`。`ChildClass`\
  \ 继承自 `ParentClass`。因此，除了私有的之外的所有属性都可以被 `ChildClass` 访问。以下是该程序：\n\n```java\nClass\
  \ ParentClass\npackage rashid.example.abc;\npublic class ParentClass {\n    protected\
  \ String cityName = \"New Delhi\";\n    protected String surname = \"Raza\";\n}\n\
  Class ChildClass\npackage rashid.example.abc;\npublic class ChildClass extends ParentClass\
  \ {\n    public static void main(String[] args) {\n        ChildClasschildClass\
  \ = new ChildClass();\n        System.out.println(childClass.cityName);\n      \
  \  System.out.println(childClass.surname);\n    }\n}\n```\n\n在前面的示例中，`ParentClass`\
  \ 有两个保护变量 `cityName` 和 `surname`。普通类可能无法访问其他类的保护成员。然而，通过继承，当我们使用 `extends` 关键字继承一个类时，被继承的类会将其所有的变量和方法暴露给派生类。这在两个类之间建立了一种关系，就像现实世界中我们与父亲的关系一样。我们确实有权访问父亲的资产。我们将在继承章节中更多关于基类和派生类的内容。\n\
  \n### 默认 (Default)\n\n当我们在类声明中不写任何修饰符时，默认就是访问修饰符。默认修饰符使类在同一个包内可被访问。\n\n## 变量 (Variable)\n\
  \n变量是一个表示并持有某个值的唯一名称。变量可以是任何有效名称（基于特定的命名规范），也可以是你的名字。Java 关键字不能作为变量；例如，`public`、`abstract`、`interface`；我们无法使用这些名称创建变量。有关\
  \ Java 关键字的完整列表，请参考本章节末尾 Java 关键字部分。\n\n人的名字就像一个代表人类的变量。当有人叫一个名字时，我们的脑海中会立即创建一个值的图像，代表\
  \ X 先生。\n\nJava 对有效变量有特定的命名规范。这些命名规范有助于其他开发者理解开发者编写的代码。Java 变量应该始终以英字母（A 到 Z 或 a-z）、数字（0\
  \ 到 9）、美元符号（`$`）或下划线（`_`）开头。我们不能使用这三种字符以外的字符作为开头。\n\n声明变量的语法如下：\n\n`<访问修饰符><数据类型><变量名>`\n\
  \n例如：\n\n```java\nprivate String firstName = \"Rajan\";\nprivate int marks = 350;\n\
  ```\n\n2018 年 3 月，Java 发布了新版本 Java 10。从 Java 10 开始，我们多了一种更简单的方法使用 `var` 关键字来声明变量。`var`\
  \ 关键字的优点是声明变量时不需要指定数据类型。根据赋值的值，系统会自动分配所需的数据类型来存储该值。例如：\n\n```java\nvar firstName\
  \ = \"Mohit\";\n```\n\n此变量的值是字符串类型；因此，变量 `firstName` 自动为其分配了 `String` 类型。\n\n```java\n\
  var age = 8; // 此变量 age 将被视为整数类型\n```\n\n`var` 声明的一个缺点是不允许复合声明。我们不能在单个语句中用逗号（`,`）分隔来声明多个变量。\n\
  \n**无效声明**：\n\n```java\nvar firstName = \"Mohammad\", lastName = \"Raza\";\n```\n\
  \n要声明多个变量，我们需要每个变量写一个新语句。\n\n例如：\n\n```java\nvar firstName = \"Mohammad\";\nvar\
  \ lastName = \"Raza\";\n```\n\n一个使用 `var` 声明进行除法运算的示例程序：\n\n```java\npublic class\
  \ VarExample {\n    public static void main(String args[]) {\n        var a = 5;\n\
  \        var b = 6;\n        var c = b/a;\n        System.out.println(c);\n    }\n\
  }\n```\n\n## 变量类型\n\n存在不同类型的变量，用于不同的用途。让我们详细了解变量的类型。\n\n### 类变量\n\n类变量是那些在类级别声明的变量，该类的所有实例都将共享具有相同值的同一个变量。如果任何实例更新了类变量的值，该类的所有实例都将更新。通过任何程序更新类变量的值并不是良好做法。具有固定值的变量应该声明为类变量。我们使用\
  \ `static` 关键字来声明类变量。`static` 关键字确保只创建一个变量的实例。类变量也被称为静态变量。下面是变量声明和赋值的示例。\n\n```java\n\
  static int age = 5;\n```\n\n如果你没有在静态变量中分配任何值，并在程序中使用该变量执行某些操作，那么它将根据数据类型指定的默认值给你该变量的默认值。\n\
  \n**示例 3.4**：JVM 默认值赋值\n\n例如：\n\n```java\npublic class StaticVariable {\n    static\
  \ int age;\n    public static void main(String[] args) {\n        System.out.println(age);\n\
  \    }\n}\n```\n\n上述程序将成功运行并打印 0，这是 Java 中 `int` 的默认值。\n\n**注意：任何使用 `static` 关键字声明的内容都会在类加载时加载到内存中。静态不依赖于对象的初始化。因此，类变量始终声明为静态。**\n\
  \n### 常量变量\n\n\n\n\n\n### 常量变量\n\n常量变量是那些固定的变量，一旦对其赋值了值，你就无法更改它。它将始终保持不变。如果你尝试重新赋值或更新\
  \ `final` 变量的值，编译器将为你生成一条错误信息“The final field FinalVariable.XYZ cannot be assigned”。使变量成为常量的关键字是\
  \ `final`。建议使用大写字母编写常量名，并仅使用下划线分隔两个单词。\n\n例如：\n\n`<access specifier> final <data\
  \ type><VARIABLE_NAME>`\n\n`public final String USER_NAME = “Value”;`\n\n**示例 3.5**:\
  \ 一个创建常量变量的示例程序：\n\n```java\npublic class FinalVariable {\n    final int AGE = 5;\n\
  \    public void AccessVariable() {\n        System.out.println(AGE);\n    }\n \
  \   public static void main(String[] args) {\n        FinalVariablefinalVariable\
  \ = new FinalVariable();\n        finalVariable.AccessVariable();\n    }\n}\n```\n\
  \n**注意：如果将基本类型或字符串定义为常量，程序将在编译时将代码中所有该该常量替换为所赋值的值。我们也可以将常量称为编译时常量。**\n\n### 实例变量\n\
  \n实例变量声明在方法、构造函数和任何代码块之外。每个实例都有独立的内存分配，每个实例都处理其自己的实例变量副本。实例变量只能通过创建类的对象来访问。这也被称为非静态变量。\n\
  \n实例变量的声明位置与类变量的位置相同，但这里我们不使用 `static` 关键字来声明变量：\n\n```java\npublic class InstanceVariable\
  \ {\n    int zip=110019;\n    public static void main(String[] args) {\n       \
  \ System.out.println(zip);\n    }\n}\n```\n\n我们无法在不创建类对象的情况下在静态字段上使用实例变量。要访问非静态变量和字段，我们必须通过创建实例来更新程序，并使用对象如下所示调用变量：\n\
  \n**示例 3.6**: 实例变量：\n\n```java\npublic class InstanceVariable {\n    int zip;\n\
  \    public static void main(String[] args) {\n        InstanceVariable instanceVariable\
  \ = new InstanceVariable();\n        System.out.println(instanceVariable.zip);\n\
  \    }\n}\n```\n\n现在，让我们创建 `InstanceVariable` 类的两个对象，更新变量 `zip` 的值，并使用类对象获取值：\n\n\
  ```java\npublic class InstanceVariable {\n    int zip;\n    public static void main(String[]\
  \ args) {\n        InstanceVariable instanceVariable = new InstanceVariable();\n\
  \        instanceVariable.zip=11002;\n        InstanceVariable instanceVariableTwo\
  \ = new InstanceVariable();\n        instanceVariableTwo.zip=44001;\n        //现在使用不同的实例访问变量\
  \ zip。\n        System.out.println(instanceVariable.zip);\n        System.out.println(instanceVariableTwo.zip);\n\
  \    }\n}\n```\n\n**输出：**\n\n`11002`\n`44001`\n\n![](img/figure-3.2.jpg)\n\n**图\
  \ 3.2:** 静态和非静态变量的内存分配\n\n### 局部变量\n\n局部变量是私有变量或用私有可见性声明的变量，或者是作为方法的参数接收的变量。这些变量的作用范围非常有限，在执行该方法或块后会从内存中移除。必须为局部变量赋值。如果你使用了未赋值任何值的变量，你将得到编译时错误“The\
  \ local variable xyz may not have been initialized”。局部变量不会像类和实例变量那样获得数据类型的默认值。\n\
  \n**示例 3.7**: 局部变量：\n\n```java\npublic class LocalVariable {\n    public static\
  \ void main(String[] args) {\n        String lastName;\n        System.out.println(lastName);\n\
  \    }\n}\n```\n\n当你尝试编译上述程序时，它将无法编译并生成编译错误。\n\n要修复编译错误，请使用 `lastName`。\n\n### Set\n\
  \n可以使用 `final` 配合 `public`、`private` 和 `protected` 设置变量。\n\n### 参数\n\n`float` 是一个\
  \ 32 位 IEEE 754 浮点数。\n\n**示例 3.8**: 参数：\n\n```java\npublic class FinalVariable {\n\
  \    void MethodOne(String) {\n        System.out.println(userName);\n    }\n  \
  \  public static void main(String[] args) {\n        pv = new FinalVariable();\n\
  \    }\n}\n```\n\n### 数据类型\n\n数据类型是特殊的表示方式。我们使用数据类型来存储值。\n\n### 基本数据类型\n\n基本类型是预定义的类型。支持八\
  \ 种基本类型。它们如下：\n\n1.  `byte`: `byte` 是 8 位符号补码的整数。`byte` 可以存储最小 -128 和最大 127。\n \
  \   `short`: `short` 数据类型是 16 位符号补码表示的整数。它的最小值为 -32,768，最大值为 32,767。\n2.  `int`:\
  \ `int` 数据类型是 32 位符号补码的整数。它的最小值为 –2147483648，最大值为 2147483647。在 Java 8 及更高版本中，你可以使用该数据类型表示无符号\
  \ 32 位整数。使用 `Integer` 类可以将 `int` 作为无符号整数使用。\n3.  `long`: `long` 数据类型是 64 位符号补码的整数。当我们需要存储\
  \ `int` 无法实现的更大的值时，使用 `long` 数据类型。有符号 `long` 的最小值为 -2⁶³，最大值为 2⁶³-1。在 Java 8 及更高版本中，你可以使用该数据类型表示无符号\
  \ 64 位长。在编写 long 值时，建议在值末尾写 `l`（小写 L）或 `L`；例如，*long telephone = 009191919191L;*\n\
  4.  `float`: `float` 数据类型是单精度 32 位 IEEE 754 浮点数。我们用它来替代 `byte` 和 `short` 以处理精确值。`float`\
  \ 可以表示具有高达 6 到 7 位精度的小数值。此数据类型绝不应用于精确值（例如货币）。对于这种情况，你需要改使用 `java.math.BigDecimal`\
  \ 类。在编写 float 值时，建议在值末尾写 `f` 或 `F`；例如，`floatpercentage = 23.674f;`\n\n\n\n\n\n###\
  \ 5. `double`: `double` 数据类型是双精度 64 位 IEEE 754 浮点数。它是存储小数的首选。我们应该使用 `double` 代替\
  \ `int` 和 `long` 来处理小数。`double` 可以表示高达 16 位精度的小数值。在编写 double 值时，建议在值的末尾写 `d` 或 `D`；例如，`double\
  \ pec=52731632.32462438891d;`\n\n### 6. `char`: `char` 数据类型是单个 16 位的 Unicode 字符。它的最小值为\
  \ `'\\u0000'`（或 0），最大值为 `'\\uffff'`（或 65,535，包含）。我们在单引号 ‘’ 之间编写 char 值。例如，`char\
  \ firstAlpha = ‘A’;`\n\n### 7. `boolean`: `boolean` 数据类型是 1 位数据类型，只有两个可能的值：`true`\
  \ 和 `false`。我们使用这种数据类型来设置标志并检查条件。例如，`boolean flag = true;`\n\n### 8. `String`: 除了这八种基本数据类型外，Java\
  \ 还提供了另一种数据类型 `String` 来支持字符字符串。通过导入 `java.lang.String` 类，可以在 Java 程序中使用这种 String\
  \ 数据类型。字符串是常量；它们的值在创建后不能被更改。我们在双引号 \"\" 内编写 String 值。将您的字符字符串包含在双引号内将自动一个新的 String\
  \ 对象；例如，`String s = \"You are learning Java.\";` 和 `String s = new String(“You are\
  \ learning Java”);`\n\n## 原始数据类型的默认值\n\n| 数据类型 | 默认值（用于字段） | 位 符号 | 最小值和最大值 |\n\
  | :--- | :--- | :--- | :--- |\n| `boolean` | False | 1 bit | true or false |\n|\
  \ `byte` | 0 | 8 bit | -128 to 127 |\n| `short` | 0 | 16 bit | -32,768 to 32,767\
  \ |\n| `int` | 0 | 32 bit | -2³¹ to 2³¹-1 |\n| `long` | 0L | 64 bit | -2⁶³ to 2⁶³-1\
  \ |\n| `float` | 0.0f | 32 bit | 1.4E-45 to 3.4028235E38 |\n| `double` | 0.0d |\
  \ 64 bit | 4.9E-324 to 1.7976931348623157E308 |\n| `char` | '\\u0000' | 16 bit |\
  \ ‘\\u0000’ to ‘\\uffff’ |\n| `String` | Null | | |\n\n表 3.2: 数据类型及其详细信息。引用数据类型持有对象的引用，可以与类、接口、数组和枚举一起。引用类型不持有任何实际值；它始终引用并依赖其他对象来获取和设置值。\n\
  \n## 引用数据类型\n\n引用数据类型持有对象的引用，可以与类、接口、数组和枚举一起。引用类型不持有任何实际值；它始终引用并依赖其他对象来获取和设置值。\n\
  \n## 字面量\n\n字面量用于声明常量变量；你可能会注意到，我们不需要使用 `new` 关键字创建对象来为基本类型变量赋值。例如，`String name\
  \ = “Mohan Das”;` 是一个字符串字符串类型字面量。\n\n字面量是固定值的源码表示；字面量直接表示在您的代码中，不需要计算。\n\n*   **布尔字面量：**\
  \ 布尔字面量只有两个可能的值：`true` 和 `false`。例如：\n\n```\nboolean status = true;\n```\n\n*  \
  \ **整数字面量：** 我们可以以不同的格式在字面量放置整数值。整数字面量允许 `int` 和 `long` 类型的数据类型。例如：\n\n```\nint\
  \ score = 320;\nlong population = 12321322L;\n```\n\n*   **浮点数字面量：** 浮点数字面量是持有小数和指数值的常量变量，我们可以使用\
  \ `float` 和 `double` 数据类型进行声明。例如：\n\n```\nfloat number = 12.321F;\ndouble number\
  \ = 21313.234223D;\n```\n\n*   **数字字面量中的下划线：** 我们使用下划线字符来分隔长数字（就像我们在数字组之间放置逗号 (,)\
  \ 或空格 () 一样），以便于理解和可读性。数值之间的下划线会被编译器忽略。\n\n```\nlong mobileNumber = 99999_99999L;\n\
  float salary = 12_523.98f;\n```\n\n*   **字符字面量：** 字符字面量是在单引号内定义单个字符值。\n\n```\nchar\
  \ attendance = ‘P’;\n```\n\n*   **字符串字面量：** 除了基本数据类型外，还有一种 String 类型的字面量。\n\n```\n\
  String name = “Rashid”;\n```\n\n*   **null：** 还有 `null`。\n\n## 方法\n\n方法是一个代码块，只有在被调用时才会运行。你可以定义一次方法并多次使用。\n\
  \n### 方法定义的语法\n\n```\n<访问修饰符> 返回类型 方法名(参数) {\n  // 方法体\n}\n```\n\n例如：\n\n```java\n\
  static void myMethod() {\n  System.out.println(\"Hello My World!\");\n}\n```\n\n\
  ### 调用方法\n\n要调用方法，使用其名称后跟括号：\n\n```\nmyMethod();\n```\n\n### 方法参数\n\n方法可以向它传递信息，这些被称为参数。\n\
  \n```java\nstatic void myMethod(int x, int y) {\n  System.out.println(x + y);\n\
  }\n\n// 带参数的调用\nmyMethod(10, 20);\n```\n\n### 返回值\n\n方法还可以返回数据。我们使用 `return` 关键字从方法返回值。\n\
  \n```java\nstatic int addNumbers(int n1, int n2) {\n  return n1 + n2;\n}\n\n// 调用并赋值\n\
  int result = addNumbers(5, 3);\n```\n\n### 方法重载\n\nJava 允许方法在参数不同的情况下具有相同的名称。这被称为方法重载。\n\
  \n```java\nstatic void show(int a) {\n  System.out.println(\"Integer: \" + a);\n\
  }\n\nstatic void show(double b) {\n  System.out.println(\"Double: \" + b);\n}\n\n\
  static void show(String s) {\n  System.out.println(\"String: \" + s);\n}\n```\n\n\
  \n\n\n\n```java\npublic static void main(String[] args) {\n    MethodExample example\
  \ = new MethodExample();\n    String UserName = example.withReturnType();\n    System.out.println(UserName);\n\
  \    example.withoutReturnType();\n}\n}\n```\n\n**输出**:\n```\nMethod with return\
  \ type.\nRashid\nMethod without return type.\n```\n\n## 带参数的方法\n\n方法也可以带有参数；我们可以在方法中传递任意数量的参数或变量。这里是一个带参数方法的示例。在接下来的方法重载和重写章节，我们将更深入地讨论这一点。\n\
  \n**示例 3.10**: 带参数的方法：\n\n```java\npublic class MethodExample {\n    private String\
  \ withReturnType(String name) {\n        System.out.println(\"Method with return\
  \ type name = \" +name);\n        return name;\n    }\n    private void withoutReturnType(int\
  \ number) {\n        System.out.println(\"Method without return type value: \" +number);\n\
  \    }\n    public static void main(String[] args) {\n        MethodExample example\
  \ = new MethodExample();\n        String UserName = example.withReturnType(“Alice”);\n\
  \        System.out.println(UserName);\n        example.withoutReturnType(5);\n\
  \    }\n}\n```\n\n**输出**:\n```\nMethod with return type name = Alice\nAlice\nMethod\
  \ without return type value 5\n```\n\n## 语句\n\n在编程中，需要一次性执行的一行或多行代码被称为语句（statement）。语句以分号（`;`）结束并终止。我们可以在单行中写多个语句，也可以在多行中写一个语句。\n\
  \n```java\nint score = 5; String firstName= “John”; Class obj = new Class(); obj.Execute();\n\
  ```\n\n在上面的上一行代码中，我们写了四条语句：第一条是声明值为 `5` 的 `int` 类型字面量变量 `score`；第二个是值为 `John` 的字符串字面量；第三是创建\
  \ `Class` 的对象或实例；第四是调用实例方法 `Execute()`。由于这四条是不同的语句，它们将一个接一个地执行。\n\n```java\nClass\
  \ Mainclassmain =\nnew ClassMain(System.in);\n```\n\n前面的两行代码仅仅是一个语句，会被一次性执行。JVM\
  \ 将寻找语句的终止点，将分号（;)）之前的所有内容加起来视为一个语句，并一次性执行。\n\n## 注释\n\n注释是一项非常有用的特性，它们不会被编译和执行。解释器或编译器会忽略注释部分下的内容。在\
  \ Java 源代码中，我们使用注释具有许多有意义的目的。它使得后续维护我们编写代码的其他开发者能够更易地阅读和理解代码。对于可扩展的系统设计，添加注释非常重要。注释可以用于：\n\
  \n*   在方法和类定义处添加注释，让程序员知道这个类和方法将要做什么，它将返回什么，以及调用此方法需要哪些参数\n*   在你的源代码中添加作者姓名\n*\
  \   解释常量变量\n*   我们不希望执行的代码行或代码块\n\n在 Java 源代码中放置注释有三种方法：一种是单行注释，另一种是多行注释，第三是 Javadoc\
  \ 注释：\n\n*   **单行注释：** 单行注释用于编写简短的注释。单行注释可以写在双斜杠后面：\n    `// 注释`\n*   **多行注释：**\
  \ 多行注释用于编写代码的简短笔记或解释。多行注释可以以斜杠和星号符号开头，以斜杠后跟星号结束。在 Java 源代码中编写多行注释有两种方法；语法如下：\n \
  \   ```\n    /*\n    注释\n    */\n    ```\n    *或者*\n    ```java\n    /*\n    *注释\n\
  \    *注释\n    */\n    ```\n*   **Javadoc 注释：** Javadoc 注释是使用 Javadoc 工具为类、接口和方法生成的特殊注释。它包含了接口和方法中使用一些常用元素的定义和解释。这通常在我们创建任何\
  \ API 或面向的类和方法时完成。JDK Javadoc 工具在准备自动生成的文档时使用 doc 注。\n\n    Javadoc 在注释中包含的元素有：\n\
  \n    *   `@return`: 这表示此类和方法将返回你什么。\n    *   `@param`: 这表示程序为使用此方法或类必须传递多少参数，以及这些参数的类型是什么。\n\
  \    *   `@throw`: throw 表示此类和方法将抛出什么错误和异常，以便你可以在本地进行处理。\n    *   `@since`: since\
  \ 仅适用于核心 API 类和方法，表示此类和方法从 Java 版本 xx 开始可用。\n\n    ```java\n    /**\n    *\n   \
  \ *\n    */\n    ```\n    例如：\n    ```java\n    /**\n     * @param name\n     *\
  \ @return String\n     */\n    private String withReturnType(String name) {\n  \
  \      return name;\n    }\n    ```\n\n## Java 关键字\n\nJava 关键字是语言中具有意义的预定义内置关键字。每个关键字都有其特定的特性和使用术。我们不能直接将这些关键字作为标识符来命名变量、方法和类。以下是\
  \ Java 关键字：\n\n*   `abstract`\n*   `break`\n*   `case`\n*   `catch`\n*   `class`\n\
  *   `continue`\n*   `do`\n*   `double`\n*   `else`\n*   `enum`\n*   `exception`\n\
  *   `extends`\n*   `final`\n*   `float`\n*   `for`\n*   `implements`\n*   `instanceof`\n\
  *   `int`\n*   `interface`\n*   `long`\n*   `main`\n*   `new`\n*   `out`\n*   `private`\n\
  *   `protected`\n*   `public`\n*   `return`\n*   `static`\n*   `String`\n*   `super`\n\
  *   `switch`\n*   `system`\n*   `this`\n*   `throws`\n*   `try`\n*   `var`\n*  \
  \ `void`\n*   `while`\n\n## 结论\n\n类是一个蓝图或模板，用于以结构化的方式将变量方法放在一起。类也可以用于分离代码文件并分成较小文件。我们需要对象来访问类的实例/非静态变量或方法。数据类型是一种特殊的引用，帮助编译器识别该标识符（也称为变量）可能的值和操作。Java\
  \ 包是将根据功能和关系的多个文件组合在一起，并给出一个唯一的包名，以便我们引用它。\n\n类加载器是 JRE 的一部分，负责将每个类文件加载到内存中，并使字节码按需供\
  \ JVM 执行。类加载器有三种：启动（bootstrap）、扩展（extension）和系统（system）。\n\n## 多选题\n\n1. **哪个是有效的变量名？**\n\
