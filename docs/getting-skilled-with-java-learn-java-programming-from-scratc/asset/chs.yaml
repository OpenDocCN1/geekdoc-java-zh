  \n# 术语 #toc.xhtml_s243a\n\n*   **Synchronized (同步)**：程序同时执行多个线程。\n*   **Concurrent\
  \ (并发)**：并行操作多个任务。\n*   **Iterate (迭代)**：从列表中逐个读取元素。\n*   **Mapping (映射)**：将键与值配。\n\
