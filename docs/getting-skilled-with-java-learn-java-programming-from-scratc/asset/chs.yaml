  \ 14 章\n\n## 线程 (Thread)\n\n在本章中，我们将讨论线程和进程。线程是程序执行的最小单元，我们利用 CPU 的空闲状态给其他线程执行的机会，这被称为多线程。多线程是一种概念编程模型，将一个程序划分为可以并发执行的子程序。我们将在本章详细讨论多线程的概念。还将详细讨论线程和进程，以及\
