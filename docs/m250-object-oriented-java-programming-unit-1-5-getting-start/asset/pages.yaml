  md: '# 5.4 A summary of Frog class features


    Before proceeding to another scenario, we will summarise the key features of a
    class in terms of the Frog class.


    A class describes a group of objects that the programmer considers to be similar.
    Instances of the same class understand the same set of messages (their protocol),
    have the same attributes and behave in the same way in response to each message.


    All instances of the class Frog are created with the same attributes colour and
    position, but each Frog object is an ''individual'' in the values of its attributes
    belong to itself. So frog may positOn as 1 and colour as OColour.BROWN whereas
    the attributes of frog2 may have the values 2 and OColour.BLUE.


    The protocol for the Frog objects is defined in the class Frog, so all instances
    understand the messages left(), right(), home(), jump(), brown(), green(), croak(),
    getColour(), setColor() and sameColours(), and behave in the same way in response
    to each message.


    The initialisation of each instance is also defined in the class Frog so that
    each Frog object is initialised with the value of position as l and the value
    of colour as OColour.GREEN.'
  merge: -1
