  md: '# # Appendix I Literals


    This appendix contains additional information about types in Java – this material
    is included mainly for interest.


    # ## Integer types


    A long can be represented using a literal ending in the letter `l` or `L`. For
    example, `17L` represents a long precision integer value 17. (`L` is preferred
    as it is more readable.)


    There are no special literals for representing the smaller types of integer; to
    store an integer as a `byte` or a `short` you need to assign the integer to a
    variable of the appropriate type.


    # ## Floating-point types


    A `float` can be represented using a literal ending in the letter `f` or `F`,
    e.g. `17.0f` represents a float literal. Such a number will be converted to a
    `double` if assigned to a double type variable.


    A `double` can be used to store a maximum value greater than 17 followed by 307
    zeros, i.e. $1.7 \times 10^{307}$, compared with the much smaller $3$ followed
    by 38 zeros, i.e. $3.3 \times 10^{38}$, for float.


    There is another way of representing floating-point numbers that is useful for
    very large or very small numbers. This is known as exponential notation. For example,
    `3.17E15` represents the number 3,170,000,000,000,000 (stored as a `double`),
    which could also be written $3.17 \times 10^{15}$. The `E15` means that the decimal
    point should be moved 15 places to the left.


    Similarly, `3.17E-15` represents the number 0.000,000,000,000,013 17 or $3.17
    \times 10^{-15}$, as the `E-15` means the point has been moved 15 places to the
    left.


    # ## Character types


    There are two ways of representing literal values of the data type `char`. One
    is to enclose the character in single quotes; for example, `''c''` or `''#''`.
    The other method is to use the actual Unicode code for the character. This is
    done by writing the `escape sequence` `\u` followed by the character hexadecimal
    code, all within single quotes. For example, `''\\u0063''` represents the character
    `''c''` and `''\\u0061''` represents the character `''a''`. This second approach
    is particularly useful for representing characters that don''t appear on your
    keyboard, as characters from other languages.'
