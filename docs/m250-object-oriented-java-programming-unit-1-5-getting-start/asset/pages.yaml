  md: 'A message may cause the receiver to send a message to another object

    help it carry out the behaviour required. For example, the message-send

    frog1.sameColourAs(frog2)


    results in frog1 sending frog2 a getColor() message in order to

    determine the colour of frog2. This behaviour is termed collaboration.


    A message may cause the receiver to send a message to itself; for

    example, the message-send

    frog1.sameColourAs(frog2)


    indirectly results in frog1 sending itself the setColor() message.


