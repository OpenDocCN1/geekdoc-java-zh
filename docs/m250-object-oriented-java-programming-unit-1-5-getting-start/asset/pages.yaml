    Instances of a class have attributes. It is usual for a newly created object to
    have its attributes initial to some initial values. For example, the instances
    of the class Frog have the attributes colour and position. The instances of the
    class Frog are initial so that the value of colour GREEN and the value of position
    is 1.'
