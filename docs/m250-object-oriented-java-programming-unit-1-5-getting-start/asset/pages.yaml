  md: '# Expressions


    An expression is a piece of code that can be evaluated to produce a single value.
    (Evaluating expression simply means determining its value.) We have already used
    expressions on the right-hand side of an assignment statement, but they can be
    used in other places as well. In fact, although we have previously talked about
    assigning a value to a variable with an assignment statement, an assignment statement
    can be represented more generally as follows:


    ```

    aVariable = anExpression;

    ```


    The right-hand side must evaluate to a primitive value (such as an int, or a float)
    or a reference value (such as a reference to a Frog).


    The simplest examples of expressions in Java are literals such as 17 or ''c''.
    The literal 17 evaluates to the int value 17; the character ''c'' evaluates to
    the character c (a value of type char). An example of an expression that evaluates
    to an object reference is new Frog().


    A variable that has been assigned a value is also an example of a simple expression.
    Thus, if myNumber has been assigned the value 34, when the expression myNumber
    is evaluated, it has the value 34. Similarly as a Frog object has been assigned
    to the reference variable kermit, then, when kermit is evaluated, its value is
    the stored Frog object reference.


    # 3.1 Expressions involving primitive data types


    You can build more complex expressions involving values of primitive data types
    by combining literals and variables using operators. In this section we will discuss
    some of the different kinds of operator present in Java.


    # Arithmetic operators


    The operators most people are familiar with the arithmetic operators used with
    numbers. For example,


    ```

    17 + 12

    ```


    is expression built from the two literals 17 and 12 using the operator + (addition).
    The value it returns when evaluated is 29. In this expression we call 17 and 12
    the operands and + the operator. In fact + is considered a binary operator because
    it has two operands.


    In the above expression both operands are integers (in fact they are of type int);
    however, you can also use addition with values of type float and double and, indeed,
    with a mixture of different types of number. The type of the value returned by
    the evaluation of such expressions will depend on the type of the operands.'
  merge: -1
  pgno: 117
- img_proc: true
  md: '# For example,


    +   1.7 + 3.4 evaluates to a value of type double.


    +   5 + 1.7 also evaluates to a value of type double as the 5 gets converted by
    the Java interpreter from an int to a double before the addition is carried out,


    +   5 + 17 evaluates to a value of type int as both the operands are of int.


    The other arithmetic operators are similar. These are - (subtraction), * (multiplication)
    and / (division). Examples of expressions using them are:


    +   17 - 5 evaluates to the int value 12,


    +   7.1 - 5 evaluates to the double value 2.1,


    +   3 * 2 evaluates to the int value 6,


    +   1.5 * 2 evaluates to the double value 3.0,


    +   6 / 2 evaluates to the int value 3,


    +   7 / 2 evaluates to the int value 3.5,


    +   7.0 / 2 evaluates to the double value 3.5.


    The only surprising aspect of the above examples is the result when 7 / 2 is evaluated.
    The expression evaluates to 3 rather than 3.5 because an int is divided by an
    int the answer provided and any decimal places are dropped off the end - this
    is termed integer division. In the last example, one of the arguments is a double,
    the result is a double and not an int. Java assumes in this case that the more
    accurate answer is required.


    # The minus operator


    The minus operator is just a minus sign (as used for subtraction), but it is put
    in front of a single number (instead of being between two numbers), it produces
    the negative of that number when the expression is evaluated. This is an example
    of a unary operator, which means it has only one operand. For example, -(7) evaluates
    to the int value 7.


    The minus operator can be used with more complex numerical expressions; for example,
    if x is of type int and holds the value -10 then -x will evaluate to 10.


    # The remainder operator


    One arithmetic operator that is sometimes useful is the remainder operator, which
    gives the value of the remainder when one number is divided by another (this operator
    is also called the modulus operator, but technically modulus is not the same as
    remainder).'
