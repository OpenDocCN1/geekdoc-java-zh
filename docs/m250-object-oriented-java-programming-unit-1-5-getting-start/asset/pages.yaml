- img_proc: true
  md: '# Data types and variables


    All computer programs deal with data. Data comes in all shapes and sizes. For
    example, it could be simple numbers such as temperature readings, or strings of
    characters such as the names of account holders, or information related to complex
    objects such as bank accounts or frogs. If a program running on a computer is
    going to be made use of this data, the data needs to be stored in the computer''s
    memory, and in order to access the stored data, the program needs some way of
    keeping track of where the data is stored – this is where variables come in.


    You can think of a variable as a named ''chunk'' or block of the computer''s memory
    where data is stored (although you do not have to worry about what data is stored
    in the computer''s hardware). By using the name of a variable in program code
    you are able to access the stored data in the corresponding block of memory and
    also to change what is stored. It is because the value that is stored in a memory
    location can change the term ''variable'' is used for these many memory locations.
    As you will see in the next unit, the position of a Frog object is stored in a
    variable value that is stored in position changes every time the frog moves to
    the right or the left. In other words the value of position varies; position is
    a variable.


    In this section we will explain how Java distinguishes between two sorts of data:
    primitive data types and instances of classes (objects). Numbers such as 5 and
    56.35 are examples of primitive data types. The frogs, hoverfrogs and toads you
    interacted with in the microworlds of Unit 2 are objects – instances of the Frog,
    HoverFrog and Toad classes.


    In this unit you will see that a primitive type variable is used to store a value
    of a primitive type, such as the values 5 and 56.2. A different kind of variable,
    called a reference type variable, is used to store an object reference, which
    allows us to send messages to an object. The variables you used in the Variables
    pane in the Amphibian Worlds and Accounts World, such as frog and myAccount, were
    examples of reference type variables.


    # 2.1 Primitive data types


    A primitive data type is defined as a set of values together with operations that
    can be performed on them. Such types are called primitive because they are built-in
    constructs within the language. (Classes also define types, and they are defined
    using built-in constructs, but they are not part of the language itself.)'
  merge: -1
  pgno: 95
- img_proc: true
  md: '# Data types and variables


    There are four categories of primitive data type in Java:


    +   - integer types that represent integers within various ranges


    +   - floating-point types that represent non-integer numbers (ones that have
    a decimal point)


    +   - a character type, which is used for representing individual characters


    +   - a Boolean type, which is used for dealing with logical values.


    Here we will concentrate on the aspects of primitive data types encountered most
    commonly during M250; more detailed information is contained in Appendix 1, which
    you may wish to consult at a later stage.


    # Integer types


    There are four integer types: byte, short, int and long. The values of each of
    these types are positive and negative numbers and zero. The differences between
    these types are in the range of values they can represent and the amount of memory
    each requires. The smallest is the byte type, which requires 8 bits of memory,
    but can only store an integer in the range -128 to 127. The size and range of
    the integer data types are summarised in Table 1.


    | Type | Size | Range |

    |---|---|---|n| byte | 8 bits | -128 to 127 |

    | short | 16 bits | -32768 to 32767 |

    | int | 32 bits | -2147483648 to 2147483647 |

    | long | 64 bits | -9223372036854775808 to 9223372036854775807 |


    In Java all numeric types (including floating-point types – see below) are implicitly
    signed. What means is that each of them can have a positive or negative value,
    or the value zero (Java uses the leftmost bit of the number expressed to hold
    the ''sign''; 0 indicates a positive number, 1 indicates a negative.)


    When choosing a numeric data type for a variable in a program, the programmer
    must pick a type that allows for any of their values variable might need to store.
    As there may be several types that are suitable it is usual to pick the one with
    the smallest size. However, for convenience, in this module we will mainly use
    the int data type for integers.


    # Floating-point types


    In order to store numbers that use a decimal point, such as 17.34, floating-point
    types are used. There are two of these types in Java – float and double. A value
    of the float type takes up 32 bits of memory while one of the double type requires
    64 bits. The double type not only covers a wider range of numbers, but more importantly,
    has greater accuracy (more significant figures of the number are stored).'
  merge: -1
  pgno: 96
- img_proc: true
  md: 'Floating-point variables cannot store all floating-point values exactly.

    Sometimes you just get the best approximation available.


    # Operations and numeric literal values


    We said above that a primitive data type is a set of values together with operations
    that can be performed on them. The operations on numbers include the familiar
    ones of addition, subtraction, multiplication and division: we will look at these
    and the other operations available on primitive types in more detail in Section
    3.


    In order to represent particular values of any primitive type in a program literals
    are. A *literal* is just a textual representation of some type - the symbol defines
    itself. For example, 17 is the literal that represents the int value 17 and 1.7
    represents the double-point number 1.7. There are other ways of representing literals
    for primitive types such as *float* that you can read about in Appendix 1.


    In M250, for numeric types we will generally restrict ourselves to double and
    int, since their literal representations are simple.


    # Character type


    For characters Java has just one primitive data type, char, and it requires 16
    bits. The literal values of the type char can be represented by characters in
    single quotation marks, including both printable (e.g. ''a'', ''B'', ''x'' and
    ''\'') and non-printable characters, such as tabs or line breaks (sometimes controlled
    characters).


    You have already encountered values of type char as the individual letters in
    strings; for example, the string "Java" is made up of the characters ''J'', ''a'',
    ''v'' and ''a''.


    # Boolean type


    Finally, Java has the primitive type boolean for Boolean data. Booleans are named
    after English mathematician George Boole, hence the capitalisation.) There are
    only two values of this type, represented by literals true and false. The amount
    of space occupied by variables of the boolean type depends on the Java virtual
    machine you are using, but it can be as little as one bit.


    # 2.2 Primitive type variables


    Now that we have introduced the primitive data types to consider how Java uses
    variables to hold values of these types in a program, Recall that a variable is
    linked to a block of memory. In a Java program you need to declare it; this will
    ensure that the variable is allocated a chunk of memory of suitable size to store
    the required type of value. After declaration we usually assign a value to a variable
    to ensure that it has some useful information in it.'
  merge: -1
  pgno: 97
- img_proc: true
  md: '# Primitive variable declaration


    To declare a variable in Java you simply give the type of the variable and its
    name in a **statement** as shown in Figure 1. Note that a semicolon (;) must be
    used to terminate the statement.


    ![](img/3b2a7e20c7b75206410143a99df1dd1c_98_0.png)


    Figure 1 A variable declaration


    Figure 1 shows a variable **declaration** statement, that is, a statement that
    reserves memory for a variable of some type.


    The declaration is:


    ```

    int myNumber;

    ```


    The type is written first, and should be chosen to be suitable for the kind of
    data we want to store. After the type comes the variable identifier (i.e. variable
    name), in this case `myNumber`. Note that the name used *must* conform to the
    language rules for valid identifier names.


    In Java, variables declared to hold values of a primitive data type are called
    **primitive type variables** (they may also be referred to simply as *primitive
    variables*, and in some languages a primitive variable is referred to as a *value
    type variable*).


    When a declaration statement is executed it reserves memory for the type of variable
    that has been declared, in this case enough to store an `int` value (32 bits),
    and records the identifier as a way of accessing that block of memory.


    This is illustrated in Figure 2, where an empty rectangle represents a ''blank''
    block of memory and the adjacent text, `myNumber`, indicates that, in this case,
    `myNumber` is the name for the block of memory. This is, of course, just a visual
    representation of what has happened as a result of the declaration of the variable
    `myNumber`; however, it is significant that we left the blank, because the variable
    does not yet have a value. In this situation it is said that we have not yet assigned
    a value to the variable, or that we have not initialised it.


    ![](img/3b2a7e20c7b75206410143a99df1dd1c_98_1.png)


    Figure 2 The result of variable declaration'
  merge: -1
  pgno: 98
- img_proc: true
  md: 'Note that, in general, it is sensible to assume when a variable is first declared
    its value is undefined. However, you will learn later that there are some contexts
    in which variables are automatically provided with a default value of their type.


    # Assigning a value to a primitive variable


    To assign a value to a variable you use the assignment operator =. The values
    that can be assigned to primitive variables are collectively referred to as primitive
    values.


    For example, after the variable myFunction has been declared as above you can
    assign the literal value 17 to it by executing the statement:


    ```

    myNumber = 17;

    ```


    This type of statement is called an assignment statement, and this example will
    cause the value 17 to be stored in the variable myArray. We can illustrate this
    as in Figure 3.


    ![](img/3b2a7e20c7b75206410143a99df1dd1c_99_0.png)


    Figure 3 The result of an assignment statement


    Note that, in practice, the assigned number is stored in the actual named block
    of memory.


    When a variable is first assigned a value in this the process is called initialisation.


    You can only assign a value of a compatible type to a variable. For example, you
    could not have assigned the literal 1.2 to myFunction because 1.2 is a floating-point
    number, and floating-point literals have the type double - the type of the variable
    myFunction is int, hence it cannot store a value of type double. The Java language
    enforces rules about how you can use different types with each other, for example,
    when assigning values. This programming language feature called strong typing
    rules make it impossible to accidentally use incompatible types, which, if allowed,
    might lead later to errors in your programs. As such the Java language is said
    to be strongly typed.


    In the text above we have used one statement to declare the variable and another
    to assign a value to it; however, you can also declare and initialise a variable
    in a single statement. For example, myFunction could have been declared and generalised
    as follows:


    ```

    int myNumber = 17;

    ```


    In cases there are good reasons to split up the declaration and initialisation,
    as you will see in Unit 4 when we discuss object initialisation in more detail.'
