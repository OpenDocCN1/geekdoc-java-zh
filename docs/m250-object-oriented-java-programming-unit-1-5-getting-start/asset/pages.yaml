  md: '# Methods with arguments


    In Activity 8 you discovered setter methods can be used to change the values of
    instance variables. A typical setter method does this by being provided with a
    new value for the instance variable using an argument.


    In this section we investigate how to write methods that require arguments. A
    method that requires an identifier of some type to receive the argument will an
    argument provided by a corresponding message. Some messages have more than one
    argument, and therefore their corresponding methods have more than one such declaration.
    You will see the syntax for this shortly. First we will give you a reminder of
    how arguments are used.


    The activities in this section use the project Unit4_Project_4.


    # 5.1 Formal arguments and actual arguments


    You will now seen many examples of messages that require a value to be supplied
    to them in the form of an argument. An argument, or more properly, an actual argument,
    supplies some information that a method needs in order to complete its job, and
    a formal argument (see below) receives that information and makes it available
    to the code in the method''s body. (Note that the term ''argument'' is used as
    an abbreviation for actual argument.)


    A method can be written to receive any type of argument. For example, when using
    the message sameColourAs() you must specify which Frog, HoverFrog or Toad the
    receiver should copy its colour from. So you might have written (and executed)
    the statement


    ```

    kermit.sameColourAs(gribbit);

    ```


    in order to get the object referenced by kermit to change its state so that it
    is the same colour as the object referenced by gribbit.


    The value of gribbit (a reference to a Frog object) is the actual argument of
    the message.


    Likewise, if you want kermit to change its colour to that of, say, bonny, then
    you send a similar message with bonny as the argument:


    ```

    kermit.sameColourAs(bonny);

    ```


    Again, if the value is of bonny, the reference that the variable holds, that the
    method receives as an actual argument, but you may find it simpler to think of
    the method as receiving the object referenced by bonny, or just read it as receiving
    bonny. We will use this less formal language often, to keep things simple.'
  merge: -1
