  md: '# 2.4 Reference type variables and objects


    We noted in Subsection 2.2 that variables declared to hold values of simple primitive
    data type are termed primitive type variables. In this section we will introduce
    you to the other broad category of variable type in Java, the reference type variable
    (often abbreviated to the simpler reference variable) which is used with objects.


    Reference variables, like primitive variables, are named memory locations in which
    you can store some information. They typically occupy 32 or 64 bits of memory,
    depending on the underlying computer hardware.


    A reference variable holds a reference value, but we will normally say ''a reference
    variable holds a reference''. A reference is a software mechanism for representing
    the address of an object in memory and you can think of the reference value as
    a (reference) variable referencing an object and sometimes we will talk about
    the reference as if it is the object. You actually need to know where exactly
    in memory the object you are referring to, but long as you have a reference to
