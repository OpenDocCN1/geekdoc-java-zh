  md: '# Glossary


    # escape sequence


    A sequence of characters beginning with a special escape character, such as a
    backtrack, that allows subsequent characters to take on a different meaning for
    the compiler.


    # evaluate


    To find the value of something. We say that expressions have a value or evaluate
    to some value.


    # expression


    Code that evaluates to a single value. Expressions can be formed from literals,
    variables, operators and messages.


    # floating-point type


    A type capable of representing a decimal number (to a restricted level of accuracy).


    # for statement


    A statement allowing a statement to be repeatedly executed according to the value
    of a loop control variable (typically of int) and a Boolean condition whose value
    is dependent on the loop control variable. for loops are typically used when a
    fixed number of iterations is required. See also while loop.


    # formal argument


    A typed identifier used in a method signature between parentheses to stand for
    a value (an actual argument) that is passed into the method body by a message.


    # garbage collection


    The process of destroying objects that have become unreachable because they are
    no longer referenced by variables, in order to reclaim their space in memory.
    In certain programming languages, including Java, this process is automatic.


    # getter message


    A message that returns as its message answer the value of one of the receiver''s
    attributes. See also setter message.


    # getter method


    A method whose purpose is to return the value of one of an object''s attributes
    as its message answer. For example, the method getPosition() is a getter method
    that returns the value of the instance variable position held by instances of
    the Frog class.


    # graphical representation


    A visible representation of a software object that, by definition, is invisible.


    # helper method


    A method whose purpose is to do some internal work of an object and therefore
    should have private access so that it cannot be used by objects of other classes.


    331'
