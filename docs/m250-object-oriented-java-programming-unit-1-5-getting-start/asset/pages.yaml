  md: '# The & and | operators


    There are two other operators you may encounter written & and |. When these operators
    are used with Boolean operands they evaluate to the same results as would be achieved
    using && and ||. The difference is that operators always evaluate both of their
    operands, whereas && and || operators may not. Technically, && and | are called
    conditional operators because they do not always evaluate both of their operands.


    The & and | operators have a further use to perform bitwise operations when their
    operands are of types that can be converted to integers. This usage is beyond
    the scope of this module in this module we use the conditional operators.


    # 4.1 More practice with Boolean operators


