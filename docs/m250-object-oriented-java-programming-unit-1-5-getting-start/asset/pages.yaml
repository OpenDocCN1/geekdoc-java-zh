    If the programmer of the Toad makes the adjustments necessary within the setter
    and getter methods then they can ensure that the setPosition() and getPosition()
    headers remain identical, so that the getter returns an int, and the setter takes
    an int argument. In this way, any number conversions that are required for objects
    expecting an integer value would be taken care of. Methods depending on the getters
    and setters would go on working precisely as before.


    So, any programmers that had used direct access instead of getter and setter methods
    would have to track down every place where this had happened, check the code was
    used and rewrite their code if necessary. This obviously entails a lot of additional
    work, and is an error-prone process. Programmers who had reused the appropriate
    setters and getters could relax, secure in the knowledge they had employed a superior
    strategy.


    # Attributes versus instance variables


    Continuing our discussion of why reason is important, that a getter method might
    not return the value of an instance variable, but may compute some value on an
    instance variable. For example, it might have decided that the getPosition() method
    should return a string, "left" or "right", depending on the numerical value of
    position relative to that frog''s home position. So it is more correct to say
    that a getter returns an attribute of an object - that is, it returns a value
    describing some feature of an object and not necessarily the value of an instance
    variable.


    Similarly, a method setDefaultBirth(String) might allow you to send the message
    setDefaultBirth("1 Oct 2012") or setOfBirth("1.10.2012") or setOfBirth("1/10/2012")
    and the object receiving the message might use a different format internally to
    store the date, such as the Java Date class. Thus an argument received by a setter
    is not necessarily directly used to set an instance variable, although we can
    think of it as being set.


    The distinction between attribute and instance variables is a further reason to
    limit direct access of instance variables to getters and setters and to reuse
    setters and getters as appropriate.


    # Reuse in subclasses


    The advantages of code reuse apply equally to subclasses. Furthermore, in general,
    need to know a programmer implementing a subclass should not, how attributes are
    implemented by a parent class. Subclasses (and their instances) cannot directly
    access instance variables declared in a superclass in any case. Instead subclasses
    will use any of provided public methods from their superclass to do their work.'
