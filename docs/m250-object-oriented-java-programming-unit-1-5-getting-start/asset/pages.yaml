  md: '# constructor


    A programming construct, similar to a method, used to initialise a newly created
    object.


    # convention


    A commonly followed rule for implementing some feature of a software system that
    is not enforced by the language used, compiler, or platform on which the software
    is used.


    # data hiding


    Where an object is treated as a black box, with access to the encapsulated data
    (instance variables) being possible only through a limited set of methods.


    # declaration


    A statement in which memory is reserved for a variable of some type that is formed
    by writing the type of the variable followed by some name (its identifier).


    # delimiter


    A character used to mark where some part of a program starts or ends. For example,
    in Java, the character ; marks the end of a statement and the character { marks
    the beginning of a statement block.


    # dialogue box


    A type of window with buttons through which users can be given information by
    a program or provide information to a program on request. M250, dialogue boxes
    are provided by class methods of the ODIALOG class.


    # direct access (of an instance variable)


    Accessing an instance variable using its name, rather than using a getter method.


    # domain


    See problem domain.


    # dynamic compilation


    A compilation technique (used by the Java environment) generating real machine
    code from bytecode (intermediate code). A chunk of bytecode is compiled into machine
    code prior to being executed. (This is different from, and faster than, the piecemeal
    operation of an interpreter.) The real machine code is retained so that subsequent
    execution of that chunk of bytecode does not require the translation to be repeated.


    # encapsulation


    Encapsulation is the parcelling up of information and behaviour into a reusable
    component. Objects allow you to encapsulate data by incorporating into a single
    entity (the object) both the data (instance variables) and the behaviour (methods)
    defined for that data.


    # end-of-line comment


    See comment.


    # escape character


    A character used to mark the start of an escape sequence in a string. In Java
    this is the \ (backslash) character.'
