  md: '# 5 Selection and iteration


    What all this boils down to is that the object referenced by myVar gets the message
    doSomething() and the code in the method doSomething() executes. Any references
    to this in the method refer to the receiver.


    In (b) however, code such as SomeClass.doSomething() is not a message, even though
    it may look like one. SomeClass is not a variable that references an object; it
    is the name of a class (because we followed naming conventions, its name begins
    with a capital letter). Only objects can be sent messages and classes are not
    objects.


    Class methods are like non-object-oriented functions or procedures. Code such
    as SomeClass.doSomething() is taken by the compiler and translated into much simpler
    bytecode that instructs the JVM at run-time to go directly to the bytecode for
    the class SomeClass and execute the code inside the body of the method doSomething()
    without reference to a receiver (because it does not involve a message being)


    To distinguish what happens in the case of execution of a class method from execution
    of an instance method we describe code such as SomeClass.doSomething() as a method
    invocation and we say "the message doSomething() is invoked on class SomeClass",
    whereas we describe code such as myVar.doSomething() in terms such as "the message
    doSomething() is sent to the object referenced by myVar". Likewise, any value
    returned by a class method is not a message-reply.


    So, if we use the term "method" on its own in M250 we are normally referring to
    an instance method. When we wish to refer to a class method we will normally be
    specific.


    You will learn more about class methods in Unit 7. For now all you need to remember
    is to invoke a class method you simply write the name of the class that defines
    the method followed by the name of the class method, using the, now familiar,
    dot notation.


    Class methods are common in object-oriented languages, such as Java. One of the
    things they are often used for providing general utilities, such as mathematical
    functions. For example, Java has a class Math (about which you do not need to
    know any details) that provides class methods such as sin(), abs(), max() and
    log().


    In the following sections we will introduce some class methods of the class Dialog.
    These methods are used to show information to, and obtain information from, a
    user, using a dialogue box.


    244'
