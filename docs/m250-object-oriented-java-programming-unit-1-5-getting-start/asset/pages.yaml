  md: '# Glossary


    A class is like a blueprint for the creation of objects and ensures that all its
    instances have the same instance variables and behave in response to messages
    in an identical manner.


    # class header


    The line of code in a class definition that provides information about a class
    such as its name and access modifier. A class header must include the keyword
    class. Example usage: `public class Marionette.``


    # class method


    Classes, as well as defining instance methods, can also define class methods.
    These are methods that can be executed irrespective of whether any instances of
    the class have been created. A class method is executed as the result of an invocation
    (not by sending a message to an instance of a class). Class methods in Java are
    specified by including the `static` keyword in the method header.


    # comment


    A comment is a piece of text in program code to assist human readers in understanding
    the code, and which the compiler ignores. Java multi-line comments are delimited
    by `/*` and `*/`. End-of-line comments begin with forward slashes (`//`) and continue
    to the end of the line on which they begin. Javadoc comments are placed between
    the symbols `/**` and `*/` and must appear immediately before a method, constructor
    or class header.


    A set of operators used for comparing values of expressions, including `==`, and
    `<`.


    # compiler


    A program that first checks source code written in a high-level language is syntactically
    correct. If the check is successful the compiler translates the source code into
    bytecode or machine code. The Java compiler translates source code into bytecode.


    # component


    See software component.


    # compound expression


    # concatenation


    The joining of two strings. In Java the string concatenation operator is `+` (the
    plus sign). For example


    # condition


    See Boolean condition.


    # conditional selection


    The use of `if` statements to select and execute alternative statement blocks
    based on the value of a Boolean condition.'
