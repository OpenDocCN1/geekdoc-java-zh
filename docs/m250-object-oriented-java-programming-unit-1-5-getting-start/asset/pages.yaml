    it is false. |

    | | || | or | a || b evaluates to true if either a or b, or both of them, are
    true. Otherwise it is false. |


    # Short-circuit evaluation


    We know that a && b is true only if both a and b are true. The way this works
    in practice is that when a && b is evaluated, the value of a is determined first.
    If a evaluates to false, the JVM deduces immediately that a && b is false and
    skips the evaluation of b. This is efficient in the sense that no more work is
    done by this operator than necessary. When only a is true b also be evaluated.


    Similarly, a || b is true if either or both of a and b are true. When a || b is
    evaluated, the value of a is determined first. If a evaluates to true, the'
