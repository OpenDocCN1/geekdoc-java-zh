  md: '# 4 The information displayed in the Inspector window shows that toadl has
    the same attributes as the Frog objects - position and colour. Note that, although
    both kinds of objects have a colour and a position, there is no attribute that
    records what icon should be used to represent either. Any icon shown in the graphics
    pane is part of the graphics pane and not part of the object it is representing.
    However, the overall colour and position of an icon is derived from the state
    of the object it is representing.


    When the microworld Two Frogs and Toad opened, it created one Toad and two Frog
    objects, each with an initial state; that each some initial attribute values.
    You saw in the graphics pane that the Toad object was a different colour and in
    a different initial position from the Frog object icons – and each icon reflected
    the state of the corresponding software object. We say that the Toad and Frog
    objects are initially devised, that is their states are different when they are
    newly created.


    You also saw that, although Frog and Toad objects have the same attributes, they
    have different yet overlapping protocols, and behave in a different way in response
    to some of the same messages. These observable differences, by themselves, are
    not conclusive evidence that these objects belong to classes, as we said, the
    object referenced by toad1 belongs to the Toad class, whereas the objects referenced
    by frog3 and frog4 belong to the Frog class and in fact the differences you see
    in their behaviour due to their different classes.


    This is a general feature of classes in object-oriented programming: instances
    of different classes may understand different sets of messages, and respond to
    the same messages in different ways.


    Classes of objects are quite flexible in their attributes and behaviour, but thus
    far, we have said very little about the idea of a class of objects is important.
    We will now rectify that situation by further clarifying the advantages of using
    classes in software.


    # 2.2 Classes and writing software


    One of the goals of software development is to avoid having the chunk of code
    replicated in different parts of a program. This is because making a simple change
    can mean having to change in lots of different places in a program. This is inherently
    error prone. Adapting the idea of classes can avoid such code duplication and
    save the programmer work. This is because code is written just once, in a class
    that then acts as a blueprint or template from which individual objects can be
    created time and again.


    When building object-oriented software, the programmer may have to specify the
