    # Garbage collection


    Something interesting happened in step 4 of Activity 2. The Frog object referenced
    by kermit in step 3 wound up with variables referencing it at the end of step
    4. Such objects are no use to anyone, because there is no way of communicating
    with them. If they were allowed to remain in memory indefinitely and more of them
    would accumulate until the system actually ran out of memory! Running out of memory
    is sometimes called a memory leak.


    In many languages, it is the programmer''s responsibility to keep track of all
    their objects and to ensure that any memory they occupy is reclaimed when the
    objects are no longer needed. This is a tricky and risky business, because if
    the programmer gets wrong, they may accidentally remove an object that is still
    needed. In Java there is much safer (possibly less efficient) system, which is
    from time to time the Java Virtual Machine will hunt to see if there are any objects
    without references and, so, it will remove them altogether so that the memory
    they occupied can be reused. This process is called garbage collection.


    So, after step 4 of Activity 2, the object that kermit referenced in steps 2 and
    3 is available for garbage collection because no variable is holding its reference.


