  md: "# Methods that return values\n\nWe have already seen that getter methods are\
    \ example of methods that return instance variable values. In this section we\
    \ examine how to write methods that return a value in more detail.\n\nThe programmer\
    \ will need to declare the type of value that the method will return, called its\
    \ return type, and also to provide a statement within the method that returns\
    \ a value of an appropriate type.\n\n# 4.1 Message answers and method return values\n\
    \nThe effect of sending a message return() to an instance of Frog is to cause\
    \ the object to execute the method return(), which will change the state of the\
    \ object so that its position instance variable is incremented by 1. This change\
    \ in state is reflected in Amphibians (if you have it open): the Frog icon moves\
    \ one stone to the right. The return() message does not return a message answer,\
    \ but you will recall that there are other messages in the protocol for the Frog\
    \ class do have message answers. An example of such a message is getColor(), which,\
    \ sent to a Frog object, answers with the colour of the receiver, such as UColour.GREEN.\n\
    \nSo how you write methods that return values (that is return either of some primitive\
    \ type or a reference to an object)? How do you control what they return? To answer\
    \ this, look at how getColor() is written.\n\n```\n/**\n Returns the colour of\
    \ the receiver.\n */\npublic UColour getColor()\\{\n    return this.colour;\n\
    }\n```\n\nEvery method must have a defined return type and in this case it is\
    \ UColour. This information comes before the name of the method. If the method\
    \ returns no value then its return type must be given as void.\n\nIn the statement\n\
    \nreturn this.colour;\n\nThe keyword return instructs the Java system that the\
    \ value of the expression that follows is to be returned by the method. This value\
    \ must be compatible with the declared return type of the method, in this case\
    \ UColour. In this case, the value of the colour instance variable of the receiver\
    \ is returned.\n\nAs you learnt in Section 3, instance variables can hold references\
    \ to objects or they can hold the value of a primitive data type. Here, the instance\
    \ variable colour will hold a reference to some instance of UColour; for example,\
    \ UColour.GREEN.\n\n![](img/3b2a7e20c7b75206410143a99df1dd1c_199_0.png)"
