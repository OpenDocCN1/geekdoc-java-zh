  md: '# Appendix 3 Casting with primitive types


    Whilst you cannot always automatically assign a value of some primitive type to
    a variable of another primitive type, it is possible to force a value of some
    numeric data type to be converted to another numeric data type (typically to a
    type occupying fewer bits, so risking of precision) by using what is known as
    casting. A cast comprises a name enclosed in parentheses. Thus you can use the
    cast (int) to ''convert'' a non-integer value into a value of type int. For example:


    ```

    double aDouble;

    int anInt;

    double a = 17.6;

    anInt = (int) aDouble;

    ```


    In the last line above, what happens in this:


    +   - aDouble is evaluated, and returns the value 17.6 as a double;

    - the cast (int) converts the value 17.6 into an int by simply throwing away everything
    after the decimal point;

    - the int value 17 gets assigned to the variable anInt.


    After this anInt is still of type int, and contains an int value. Likewise aDouble
    is still of type double, and still contains a double value 17.6. The types of
    the variables never change.


    Finally, it is worth mentioning that you can use a cast in cases where automatic
    type conversion would take place anyway and in cases where a cast is not required
    at all, although it would be poor style to do so. In these cases the cast doesn''t
    have any effect.'
  merge: -1
