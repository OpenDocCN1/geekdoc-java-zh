  md: '# Exercise 4


    Just two messages are required. Note that the first message, debit (400), must
    be sent to yourself in your role as the object myAccount.


    ```

    myAccount.debit(400)

    herAccount.credit(400)

    ```


    These two messages can be analysed in tabular form as follows.


    | Receiver | Message | Message answer |

    | --- | --- | --- |

    | myAccount | debit(400) | true |

    | herAccount | credit (400) | none |


    The following sequence diagram further illustrates how the receiver of a transfer()
    message carries out its responsibility. In Figure 1 the three vertical lines represent
    the user and the two objects myAccount and herAccount. Message answers are not
    shown as they do not play a major role in this case.


    Reading from left to right, the user first sends the message transfer(herAccount,
    400) to myAccount. To satisfy this responsibility, myAccount first sends the message
    debit (400) to myAccount. Next, myAccount sends the message credit (400) to herAccount.
    This is all that myAccount has to do to discharge the responsibility it took on
    by accepting the message transfer(herAccount, 400).


    ![](img/3b2a7e20c7b75206410143a99df1dd1c_319_0.png)


    Figure 1 A sequence diagram for the message-send myAccount.transfer(herAccount,
    400)'
  merge: -1
