  md: '# Classes and protocols


    In particular, it will be necessary to specify somehow the attributes that each
    object will have and the messages each object will understand.


    It would be perfectly possible to build every object afresh from the ground up,
    by providing all the code necessary to specify its attributes and behaviour; however,
    when a program can involve thousands of objects, this would be unbearably tedious.


    representing entities, and in a drawing program there might be many objects that
    represent rectangles. When writing a program, whenever you identify a set of objects
    belonging to a common classification, with the same attributes and behaviour,
    you can define a class for this kind of object. The attributes and behaviour will
    need to be specified just once, in the class definition, and then you can use
    the class, as a template, to generate an object of that particular kind whenever
    you like.


    How many instances of a class are created, each will automatically have the same
    attributes and protocol, with no additional work on the part of the programmer.


    Moreover, once you have tested your code and it is correct just on all the objects
    belonging to that class working as intended; you do not need to test them individually.


    Of course, different instances of the same class may acquire different states
    (for example, frog1 may have its colour attribute set to GREEN, while frog2 has
    the value of this attribute as BROWN).


    If the attributes or any part of the protocol of an object needs to be changed,
    the change need be made only once – to the class. The change will automatically
    apply to all instances of the class.


    The concept of classes is a key part of object-oriented software development.
    Identifying classes of objects at the planning stage enables programs to be written
    in a concise and economical way.


