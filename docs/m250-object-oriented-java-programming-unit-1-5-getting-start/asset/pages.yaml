  md: '# Introduction


    In Unit 2 you did a lot of practical work in self-contained microworlds, sending
    messages to different objects in order to investigate their behaviour and to see
    that they have state, a protocol (the messages that they understand) and that
    they are organised into classes.


    In this unit we begin to lift the lid on how the behaviour and state of objects
    might be implemented. You will learn that there are two categories of data types
    in Java – *primitive data types* and *reference data types*.


    Values of primitive types include numbers (1234 or 564.33), Boolean values like
    `true` and `false`, and characters like ''?'', ''G'' and ''b''. The primitive
    types are built into the language and are available to a programmer for use in
    constructing more complex data types. In particular, primitive types are used
    when creating classes of objects and in their underlying (machine level) representation.


    Reference data types are defined by classes and are used in relation to objects.


    This unit will also introduce you to the concept of *expressions*, chunks of program
    code that evaluate to a single value, and how to values can be assigned to variables
    so that a program can remember them for future use.


    You will also be introduced to BlueJ, which is an example of an IDE – an **integrated
    development environment**. Later on the module you will use this IDE to modify
    classes of objects and create entirely new classes. In this unit, however, you
    will be using BlueJ to access the OUWorkspace, a programming tool that the M250
    module team have integrated into BlueJ. This tool is designed to enable you to
    get to the syntax of Java and to write and test snippets of Java code in a quick
    and convenient way.'
  merge: -1
