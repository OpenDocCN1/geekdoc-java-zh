  md: '# 6.4 Recap of terminology


    At this point it is useful to review some of the message related terminology you
    have encountered.


    +   - The receiver is the object to which a message will be sent.

    - A message must be in the protocol of the receiver, otherwise a statement attempting
    to send such a message cannot be executed.

    - The arguments are the pieces of information required by the message: some messages
    require no further information, and some require one or more pieces of information.

    - A message answer is some information returned by a message-send.


    So, for example, in the case of the message-send


    ```

    myAccount.debit(7)

    ```


    myAccount is the receiver, debit() is the message name, 7 is the argument and
    the message answer will be either true or false.


