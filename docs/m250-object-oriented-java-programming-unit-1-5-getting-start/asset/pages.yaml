  md: 'Note the operators consisting of two symbols, such as >=, must not have a space
    between the symbols. However, although not strictly necessary, it is a good practice
    to have space on each side of a binary operator for readability.


    As with the arithmetic operators, an int value is converted to a double value
    when using the comparison operators if the one of the operands is a double.


    The equality operators (== and !=) can be used with other types of operands as
    well. When using reference types, == will evaluate to true if both evaluate to
    the same object reference. In other words, == will return true if both sides reference
    the same object.


    The relational operators (<, <= and >=) can also be used with operands of type
    char. Thus an expression < evaluates to true if the character on the left is less
    than the character on the right. For our purposes it is sufficient to know that
    character values are arranged in the following order


    ```

    ''0'' ''1'' ''2'' ... ''9'' ... (other characters)

    ''A'' ''B'' ... ''Z'' ... (other characters)

    ''a'' ''b'' ... ''z'' ...

    ```


    For example, ''A'' < ''z'' evaluates to true.


    # Logical operators


    There are three important operators that can be used with Booleans. These are
    && (logical and), || (logical or), and ! (not).


    The behaviour of these logical operators is shown in Table 5 (note that ! is another
    example of a unary operator).


    Table 5 Expressions using logical operators


    | Expression | Value |

    |---|---|

    | true && true | true |

