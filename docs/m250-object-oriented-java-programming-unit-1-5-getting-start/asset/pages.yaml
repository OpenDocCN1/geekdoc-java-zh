  md: "# Summary\n\nAfter studying this unit you should understand the following ideas.\n\
    \n+   * Ultimately software executes on hardware; software delivers instructions\
    \ to hardware.\n* An operating system (OS) is the software responsible for the\
    \ control and management of hardware and the basic computer operations.\n* Source\
    \ code must be translated by a compiler into a low-level language, called machine\
    \ code, in order to run on your computer's hardware.\n* The translation of source\
    \ code to machine code can be a two-stage process. In a two-stage process source\
    \ code is first compiled to bytecode, which is the machine code of a virtual machine.\
    \ This virtual machine will, in a second stage, interpret the bytecode into machine\
    \ code when the code is run.\n* The advantage of a compilation model is that it\
    \ ensures that the bytecode, no matter on what machine it was compiled, can be\
    \ translated for execution on many different computers, so each computer system\
    \ has the correct virtual machine installed.\n* In-object software all the processing\
    \ that is carried out by a program is done by 'objects'.\n* An object can be thought\
    \ of as a self-contained unit of software that holds data and knows how to process\
    \ that data.\n The only way to get an object do anything is to send it a message.\n\
    * All messages ask an object to perform some action – these actions constitute\
    \ what is the behaviour of the object.\n* The set of messages an object understands\
    \ is called its protocol.\n* An object has attributes; the values of these attributes\
    \ at any one time constitute the state of the object.\n* A message may change\
    \ the state of an object.\n* A message may make an object do something without\
    \ altering its state.\n* Objects are instances of classes and create simple software\
    \ components. A class defines the attributes and behaviour of its instances. Therefore,\
    \ objects belonging to the same class (instances of the class) have the same set\
    \ of attributes and understand the same set of messages, responding to each message\
    \ in an identical manner.\n* Object technology has advanced the concept of software\
    \ components, which are produced with the aim of reuse. The same reliable, reusable\
    \ software components can be incorporated into many completely new systems, saving\
    \ considerable time and effort in producing new software. Objects of different\
    \ classes can work together to create more powerful components."
