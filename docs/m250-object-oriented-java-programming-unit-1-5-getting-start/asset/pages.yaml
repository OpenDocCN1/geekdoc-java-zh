    object-oriented approach – because an object is responsible for updating its own
    data, which changes the structure of that data affect only that type of object.
    Since it is usual for software to be changed and adapted after it has been built,
    this is an important benefit. There are further benefits, such as reusability,
    that will emerge during the module.


