    # Setters and getters


    Let us consider setter and getter methods as an example. Suppose that a Frog

    has a boolean variable called happy declared as follows:


    ```

    private boolean happy;

    ```


    A constructor might initialise this variable to true when we create a Frog

    object. At some point in a frog''s life it might not be so happy, and it might

    (using a method) set this variable to false. For example, the Frog may have

    a public poke() method and when it receives that message it, amongst

    other things, set happy to false. It may also have a public stroke()

    method, and when it receives the stroke() method it may say happy to

    true.


    But, should we provide a public setHappy(boolean) method? Probably

    Objects of other classes should, probably, not be able to dictate

    when a frog is happy, which they could do if we provided the ability to say

    this message. Other objects may use the public protocol of frogs, including

    messages such as poke() and stroke(), and the Frog itself

    can ''decide'' (using its methods) when it is happy and when it is not.


    Should the getter isHappy() be public? This is probably reasonable,

    however it might be that we don''t want to allow objects of other classes to

    know whether a frog is happy or not. A frog might use its happy variable

    internally to make decisions, such as how high to jump when it receives the

    jump() message.


    So, it is not necessary that every instance variable is settable and getter

    public methods. It is really up to you, as program designers, to decide

    which attributes we want to expose to other objects.


    Likewise, if you have other methods that just do internal work for an object,

    y might not want other objects be able to use them. Suppose frogs have

    a tidyHouse() method, you might not want objects of other classes to be

    send the corresponding message. A frog might use this method when

    certain messages in its public protocol are sent (such as, perhaps,

    offerToHouse()). Methods that are for internal use, including

    use large tasks down into smaller pieces, are often called helper

    methods, and they should usually be declared as private.


    So, to reiterate, if you are writing say, the Bananaquit class, you should

