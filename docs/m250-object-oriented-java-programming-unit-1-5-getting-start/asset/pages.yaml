  md: '# 5.2 Method signatures and overloading


    The name of a method including the parentheses and the type of any arguments is
    called the method signature. For example, the signature of setPosition() is setPosition(int).
    The signature shows clearly the type of the expected argument.


    Note that the Frog class defines two methods with the name sameColourAs(). They
    have the headers:


    ```

    public void sameColourAs(Frog aFrog)

    public void sameColourAs(Toad atof)

    ```


    One has the formal aFrog of class Frog and the other has the formal atof of class
    Toad. In cases such as this, methods that have the same name but different signatures
    are present, we say that the method name is overloaded (Informally, programmers
    generally say a method is overloaded e.g. sameColourAs() is an overloaded method,
    even though, it is the name sameColourAs() that is overloaded).


    If there were a single sameColourAs() whose formal argument was declared as being
    class Frog, then we would only be able to send a sameColourAs() message to a Frog
    object with an actual argument that was an instance of Frog (or a subclass of
    subclasses of Frog are compatible). We would not be able to send a message sameColourAs()
    to a Frog object with an actual argument that was an instance of Toad. However,
    in this case the programmer wanted to be able to set frogs using todos as well,
    a second method was required.


    As long as the methods have different signatures, the compiler can decide which
    one should be based on the types of any actual arguments; that is, any sameColourAs()
    message-send is unambiguous.


    ```

    public void doSomething(int marks)

    private int doSomething(int commission)

    ```


    have the same signature, namely doSomething(int). (The access modifier and return
    type is not part of the signature, nor are the names of any formal arguments.)
    The Java compiler would report an error if you attempted to compile a class that
    defined two such methods.


    Some utility methods in Java are heavily overloaded. For example, the method println(),
    which allows you to display some text, has ten different signatures in Java 7.
    This means you can use println() with many actual argument types without having
    to convert any of them to another type. Constructors can also be overloaded.'
