  md: '# 3.4 Handling the output of the Cancel button


    The Dialog class methods with the signatures request(String) and request(String,
    String) produce the dialogue boxes containing two buttons – an OK button and a
    Cancel button. You may recall that clicking the Cancel button results in null
    being returned. The dialogue also returns null if the user closes the window without
    a button. Before going on we will briefly explain how to handle the null value.


    Consider the following scenario: a user of a word-processing program has requested
    a file save, and request(String, String) is used to prompt for the file name.
    The existing file name is given as the initial answer (argument). The user has
    various courses of action to choose from. They can click OK and save the file
    under its name or they can replace the default name by a new one and click OK.


    On the other hand, they may decide not to save the file after all, and click Cancel.
    This will return null, as you have seen.


    What happens if Cancel is clicked? There are various possibilities, but one is
    to not save the file and to notify the user that the file was not saved. To do
    this you need some code that will detect if a user pressed Cancel (or closed the
    window) and that will take the appropriate action in that case.


    Here is some Java code that achieves this.


    ```

    String filename;

    filename = Dialog.request("Please specify file name", "currentName");

    if (filename == null){

    Dialog.alert("File not saved.");

    el{// code to save the file would go here

    }

    ```


    You are not in a position to write the last part of the code yet, since you have
    not learnt about files, so for now we have just written a comment showing that
    something still needs to be done.


    The important thing to note here is that you can compare any reference to the
    value using the == operator and provide a branch in your program code to handle
    a null value. A null value often indicates an exceptional condition that requires
    some separate code to handle it and so is quite a common thing to see.'
  merge: -1
