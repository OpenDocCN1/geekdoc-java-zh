    What is the value of myNumber after the following statements have been executed?


    ```

    int myNumber = 17;

    myNumber = myNumber - 11;

    myNumber++;

    ```


    # Answer


    myNumber holds the value 7.


    The expression myNumber++ is not the same as the expression (myNumber + 1) because
    myNumber++ evaluates to the value myNumber before it has the 1 added to it; whereas
    the expression (myNumber + 1)'
  merge: -1
