  md: '# Reuse of code


    Now the method using the statement

    this.setPosition(this.getPosition()) - 4);


    would be needed and would not to be altered. If the designers had a further

    change of mind, another modification would be needed and so on.


    However, the earlier version of doubleLeft(), which uses left()

    tice, would continue to work perfectly without any changes. It will always

    produce the same effect as two ''left'' behaviours. The designers of Toad could

    change their minds about what left means as many times as they like, and

    this version of the method would always produce the correct

    result, without requiring any modification.


    This is very important, because there could be many methods whose

    result depends on the definition of the ''left'' behaviour. If the methods are

    written so that they modify the frog''s position every time, there

    is a change to the method left() you would need to identify all those

    methods and update their code. Quite apart from the effort involved, you

    m overlook some and it would be easy to make mistakes.


    However, methods reuse left() will not require any changes at all, and

    all these problems are entirely avoided! Reuse is a far superior strategy, and

    experienced object-oriented programmers employ it wherever they can.

    Although you are not yet an expert, you should look carefully for possible

    reuse and try to take advantage of it in the code you write.


    # 6.1 Using libraries


    The ability to reuse code goes beyond the simple example described above.

    One of the features of object-oriented languages that make them so powerful

    is that they usually include include class libraries. Such libraries may contain

    hundreds, or even thousands, of classes that have proven useful to

    programmers in the past to write a wide range of applications. These classes

    have been tested, and well documented, so that programmers can

    understand the purpose of each class and what each method in a class does,

    without having to know how the methods are implemented. Indeed, class

    libraries usually not include source code, just the compiled code, so the

    programmer''s only source of information is often the documentation.


    Java comes with many class libraries, which it calls packages. In

    addition, programmers can develop their own class libraries (packages)

    containing classes that are relevant to their own application area. Once tested

    documented, these can be reused to form the basis of many applications.


    You are already making use of a library of classes developed for M250. It is

    this reuse of code that enables you to have frogs moving in a graphical

    display at this early stage in the module. In the next activity, we look at the

    documentation for the simplest of these classes. As this is an exploratory

    activity, there is no discussion.'
