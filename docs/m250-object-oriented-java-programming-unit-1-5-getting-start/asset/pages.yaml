  md: "![](img/3b2a7e20c7b75206410143a99df1dd1c_268_0.png)\n\nFigure 12 A flow chart\
    \ for an statement that counts users aged forty and over\n\nNow we can implement\
    \ each part of this diagram in code. You have already seen how to get a result\
    \ from a user and store it. In this case we want to get the user's age. We will\
    \ also require a variable that we can add 1 to each time we find a user of the\
    \ right age. Finally we require an if statement that will increment our counter\
    \ only when the user is of an appropriate age.\n\nThe following code does the\
    \ job:\n\n```\n//initial count of users 40 and over\nint fortyAndOver = 0;\nString\
    \ ageString;\nint age;\n\n//get a user's age\nageString = OUDialog.request(\"\
    What is your age?\");\n\n//convert string to int\nage = Integer.parseInt(ageString);\n\
    \n//increment counter selectively\nif (age >= 40) //true or false?\n{\n    fortyAndOver\
    \ = fortyAndOver + 1;\n}\n\n```"
