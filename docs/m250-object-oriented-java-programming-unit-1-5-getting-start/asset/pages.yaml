    # Comparison operators


    Because we often want to compare values and find out relationships between them,
    there is another group of operators called comparison operators that have numerical
    operands, which return a value of type boolean when the expression is evaluated
    (see Table 3).


    Table 3 Java comparison operators


    | Operator | Meaning |

    | = | equal to |

    | != | not equal to |

    | < | less than |

    | <= | less than or equal to |

    | > | greater than |

    | >= | greater than or equal to |


    Some examples of how these operators are used in Table 4.


    Table 4 Example expressions with comparison operators


    | Expression | Value |

    | 3 == 3 | true |

    | 7.1 == 2.5 | false |

    | 7 == 7.0 | true |

    | 3 != 3 | false |

    | 7.1 != 2.5 | true |

    | 2 < 3 | true |

    | 2 <= 3 | true |

    | 3 <= 3 | true |

    | 4 < 3 | false |

    | 4 > 3 | true |'
