  md: '# Message arguments


    This section introduces the idea of message arguments, which allow the message
    sender to include information in messages.


    # 4.1 Messages and arguments


    Messages become a much more powerful mechanism when you allow them to include
    extra information. For example, previously there were separate messages for turning
    an object green or brown. A message that sets the colour of an object and allows
    you to state the colour required allows a much more general approach.


    When a message requires extra information for it to make sense, each required
    piece of information is called an argument of the message. (Note that some books
    call it a parameter).


    In our worlds we have made it possible for you to send messages with arguments
    through the use of menus. In this context, when more information is required from
    the user after a button is pressed, you must choose an item from the menu before
