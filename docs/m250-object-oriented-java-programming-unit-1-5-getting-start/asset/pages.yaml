  md: '# Fundamental hardware and software concepts


    Before embarking upon the main focus of the module – object-oriented programming
    – we will review some fundamental hardware and software concepts and then go on
    to look in more detail at how computers are capable of functioning so flexibly.


    # 2.1 Hardware and software


    Hardware consists of the tangible parts of the computer system – the parts that
    can be touched. Examples of hardware include the electronic circuits inside the
    casing of your computer such as the central processing unit (CPU) and main memory,
    and as peripheral devices such as a keyboard, a monitor or touch screen, and storage
    devices such as hard disks and drives. Peripherals, such as hard disks, are usually
    mounted in the same case as the processor, while others, such as printers, are
    physically outside the computer and communicate with it via a wired or wireless
    connection.


    Software, on the other hand, is more abstract – it is a general term for all the
    applications, programs and systems that run on your computer; that is, it covers
    everything you cannot touch! Software is written using a programming language,
    and pieces of text in such a language are often source code or just code. This
    code is compiled (see Subsection 2.3) into a sequence of zeros and ones, that
    is, binary digits or bits, which make up the instructions that tell a computer
    (or rather the hardware) how to perform a particular task. However, it is not
    generally useful for a programmer to consider software in such low-level terms
    (that is, they rarely need to explicitly think of binary digits being interpreted
    by hardware as instructions to the CPU).


    There are many synonyms for software (application and program are but two). The
    term application is usually reserved for larger software packages such as word
    processors, browsers and email clients. The term program is usually used when
    describing software written by users for their own use – you will be writing programs.
    However, the difference is typically one of scale and complexity rather than precise
    definition.


    Although software and hardware are very different in nature, they are also intrinsically
    related. Any instruction performed by software can also be built directly into
    hardware, and instructions executed by hardware can often be simulated in software.
    So there is a trade-off between flexibility and speed. One could build a computer
    without any software; it would do just one task – but very quickly. However, we
    expect computers to help us perform a multitude of tasks such as calculate our
    taxes, write a letter, play chess and maybe surf the web. Hence it is usual to
    get the computer hardware to do a lot of very simple tasks (such as adding or
    subtracting two binary digits),'
  merge: -1
  pgno: 11
- img_proc: true
  md: '# 2.2 The operating system


    A computer''s operating system greatly affects what you experience when you are
    using the computer. It is the first software that you are aware of when you turn
    on the computer, and the last software you notice when the computer is shut down.
    Yet many computer users cannot say with any precisely what it is the operating
    system does, so it is worth spending some time getting this clear.


    An operating system (OS) is the software responsible for the control and management
    of hardware and basic system operations (such as data input and output), as well
    as running application software such as word-processing programs and web browsers.
    Common operating systems include Linux, Mac OS X (for the Apple), iOS (on Apple''s
    mobile devices), Android (used on many other mobile devices) and the various versions
    of Windows, e.g. Windows XP, Windows Vista and Windows 7.


    ![](img/3b2a7e20c7b75206410143a99df1dd1c_12_0.png)


    Figure 1 The operating system acts as an intermediary between the user (or an
    application program) and the computer hardware, as shown in Figure 1. It enables
    the user to carry out a variety of complex tasks on the computer, without the
    need to know anything about what goes on ‘inside the box''.'
  merge: -1
  pgno: 12
- img_proc: true
  md: 'Not all computers have operating systems. For example, a dedicated computer
    that controls the fuel-injection system in a car does not need one, since it has
    just one task to perform and the hardware it controls does not change. The computer
    is simply constantly running a single program, which can be encoded in read-only
    memory (ROM).


    The next seven subsections will expand upon the work of the operating system and
    will explain how it is loaded when your computer is first switched on.


    # Management of memory


    During the execution of a program (or application), data and instructions are
    stored in the computer''s main memory. It is the job of the operating system to
    allocate an appropriately sized area of memory to each program (or application),
    and to ensure that program instructions do not interfere with each other, or with
    the data and instructions of other pieces of software.


    # Coordination and control of peripheral devices


    In order to carry out its tasks a computer may need to communicate with one or
    more peripheral devices. For example, it may wish to receive input data from a
    keyboard, mouse, or touch screen, read a file from a storage device, send output
    to a display device, and maintain a connection to a network. The operating system
    coordinates all these operations, ensuring that data is moved safely and efficiently
    between the different components of the system.


    # Scheduling of access to the processor


    The operating system manages access to the processor, by prioritizing jobs to
    be run and ensuring that the processor is used efficiently. For example, if the
    currently running program finishes, or is interrupted in order to wait for data
    from a hard disk, the operating system will ensure, if possible, that another
    program is given access to the processor.


    # Provision of basic utilities


    Operating systems also provide basic utilities such as disk formatting facilities,
    file management systems and software installation wizards.


    # Provision of an interface between applications/programs and hardware


    Another important role of the operating system is to provide a stable, consistent
    way for software to communicate with the computer''s hardware without having to
    access that hardware directly, or know about the details of the hardware, or the
    minutiae of the processor''s specifications. The operating system provides this
    through an application programming interface (API), which is a set of high-level
    instructions (a protocol) through which an application can ''talk'' to the operating
    system to request services such as printing a file or saving to a disk. So, for
    example, instead of an application program asking a printer to print a file, it
    asks the'
  merge: -1
  pgno: 13
- img_proc: true
  md: 'system (through the API) to print the file. The operating system communicates
    with the printer to carry out the request. This abstraction allows a developer
    to write an application on one computer and have a high level of confidence that
    it will run on another computer with the same operating system even if the amount
    of memory, and the makes and types of peripheral are different from the two machines.


    # Provision of a user interface


    The user interface is the software that enables you to communicate with your computer.
    It provides a means of inputting data and instructions, and presents output in
    an understandable way.


    The user interfaces of early operating systems as CP/M and DOS were text based
    (termed command-line interfaces), requiring the user to learn a set of commands,
    which needed to be typed in following precise rules. Output to the screen also
    consisted entirely of text. Today almost all operating systems provide graphical
    user interfaces (GUIs), although most also provide (often hidden away the novice
    user) a text-based interface.


    GUI-based operating systems (of which the various versions of Microsoft Windows
    are the most common examples) make use of GUI components as icons, windows, buttons,
    sliders and other graphical widgets with which the user interacts, usually via
    a pointing device such as a mouse. Most people find these interfaces more intuitive,
    quicker to learn and easier to use than sequences of commands.


    A further advantage of GUI components is their availability for use by programs
    other than the software provided by the operating system. For example, programmers
    of word processors or spreadsheet packages can use of these components to avoid
    ''reinventing the wheel'' and writing a brand new GUI. In addition, these graphical
    libraries provide a consistent way for application programs to communicate with
    the computer''s hardware. This ensures that all applications using these GUI components
    have a consistent ''look and feel'', which in turn makes it easier for users to
    learn how to use applications based on them.


    # Booting your computer


    When you switch on a computer, the first thing it needs to do is to load an operating
    system (which is usually stored on the hard disk).


    To enable it to do there is a boot program, which is stored in the computer''s
    read-only memory (ROM) during manufacture and is often called firmware. Firmware
    consists of programs that provide core functionality to a device that does not
    disappear when power is lost (ROM is termed volatile memory). Low-level firmware
    is permanent and cannot be overwritten, higher-level firmware is sometimes stored
    on reprogramable flash memory, and so can be updated later in the life of the
    computer.


    The boot program is executed automatically when the computer is first switched
    on and it typically runs a test of the computer''s main memory and see what peripherals
    are connected to the system before loading'
  merge: -1
  pgno: 14
- img_proc: true
  md: 'operating system. The process of using a short program to load a larger program
    is called bootstrapping, which comes from the metaphor of someone pulling themselves
    up by their own bootstraps. The use of the boot program for starting a computer
    has given rise to the expressions ''booting up'' and

    ''rebooting'' a computer.


    # 2.3 How programs execute on a computer


    When writing software it is necessary to express a solution to a problem in a
    programming language resembling a natural language that can be understood – interpreted
    – by human beings. That solution (as written in a programming language) is called
    the source code. It must then be translated into a primitive language called machine
    code – the instructions that can be understood and executed by the hardware of
    a computer. Note that the term ''code'' is commonly used without the qualifier
    ''source'' or ''machine'', with the context in which the term code is conveying
    the appropriate meaning. Except for this discussion, we will not be interested
    in machine code in this module, so most we use ''code'' to mean ''source code''.


    Since the programming language abstracts away from the detail of the machine code
    language, we call the former a high-level language and the latter a low-level
    language.


    There are a number of models for this translation process. One such model is depicted
    in Figure 2.


    ![](img/3b2a7e20c7b75206410143a99df1dd1c_15_0.png)


    Figure 2 Relationship between source code and machine code


    Translation of the high-level language source code to a low-level machine code
    program is usually carried out by a piece of software called a compiler. Translation
    can also be done by an interpreter, which will translate a line of source code
    into machine code (as opposed to a whole program) and when it is required.


    During compilation a compiler must first check that the source code conforms to
    the syntax rules of the language; that is, whether it is correctly formed. Only
    if this check does not show problems the compiler proceed to produce the machine
    code that will be executed.'
  merge: -1
  pgno: 15
- img_proc: true
  md: 'The major problem with this simple model of compilation is that the compiled
    code is not portable to other machine architectures, as different machine types
    employ different machine code languages (see Figure 3).


    For example, if Platform A is a PC using x86-processor, and Platform B is an ARM-based
    processor (the precise processor details are not important for this module, it
    is enough to appreciate that these processors use different machine code instruction
    sets) then you would have to recompile the high-level language source code with
    a specific compiler to produce code for each architecture.


    ![](img/3b2a7e20c7b75206410143a99df1dd1c_16_0.png)


    Figure 3 Compiling code for different computer systems


    This is one reason why software developers typically provide separate downloads
    of the same software package for different platforms (although the need to interface
    with hardware as sound cards or screens also plays as a part, as is requiring
    operating system services, which are also architecture specific). The important
    point here is that the machine code cannot simply be copied from one platform
    to another.


    Another, more portable, model of compilation makes use of a special layer of software
    called a virtual machine (VM) that resides on top of a real operating system.
    A virtual machine mimics the behaviour of a piece of hardware and has its own
    instruction set, just like a real piece of hardware. Furthermore, because it still
    relies on the operating system layer, a different version of the virtual machine
    is required for each platform.


    In this model of compilation, the high-level language source code is not compiled
    to a hardware-dependent machine code. Instead, it is compiled to an intermediate
    code, that is, the machine code of the virtual machine. In Java environments,
    each instruction is a byte in size. Using this intermediate code approach allows
    low-level, essentially executable, code to be moved unchanged between different
    computer systems (see Figure 4). It should be'
  merge: -1
  pgno: 16
- img_proc: true
  md: 'noted that although this module is focused on Java languages there are other
    languages that compile to bytecode.


    ![](img/3b2a7e20c7b75206410143a99df1dd1c_17_0.png)


    Figure 4 Compiling for a virtual machine


    Once the intermediate code has been produced, there are three options for its
    execution on a real computer.


    +   1. The first option is to include an interpreter within the virtual machine
    software. Every time an application is run, the interpreter takes the intermediate
    code and translates each VM instruction, one at a time, into the real instructions
    for the real hardware to execute. This is a relatively slow process because so
    much software is involved in interpreting, whereas the machine code from a simple
    compilation can be executed directly by the hardware.


    +   2. The second option is for the virtual machine to include another phase of
    code generation in which all the intermediate code is translated into real machine
    code in one go, so that it is ready for the real machine hardware to execute.
    This is the traditional approach where intermediate code is used; originates from
    a time when programs were prepared and tested as a whole rather than in component
    parts, and has the disadvantage that the programmer must wait for all of the intermediate
    code to be translated into machine code before the program can be executed and
    tested (although in programming environments where this option is used, the programmer
    may never be aware that a second complete translation has taken place).


    +   3. The third option is a combination of the first two and is called dynamic
    compilation (or just-in-time compilation). This option is particularly'
  merge: -1
  pgno: 17
- img_proc: true
  md: 'attractive when software is developed in relatively small chunks – modules
    that can be separately compiled. This is the option used by the Java Virtual Machine
    (JVM) in the module software. When a request is made to compile a chunk of code,
    the programming environment''s (in this module''s built-in compiler produces intermediate
    code (in our case, bytecode) for that of code. This is then compiled into machine
    code by the virtual machine software when the code is first executed, and this
    subsequent execution of code has all the speed that results from simple compilation.
    (Of course, any code that is never executed will never be translated into machine
    code.)


    In summary, the advantage of a compilation model that uses of virtual machines
    is that it ensures that the intermediate code, no matter on what machine it was
    compiled, can be translated for execution on many different computers, so long
    as each computer has the correct virtual machine.


    # 2.4 The computer as a layered device


    In this section we have defined and described the terms hardware and software,
    the operating system and the Java Virtual Machine (JVM). To bring all these things
    together it is useful to consider a computer system as a layered device. So, for
    example, a Java program runs on top of the JVM, which runs on top of the operating
    system, which itself runs on top of the hardware (Figure 5).


    | software systems, applications and programs | Java programs Java Virtual Machine
    |

    |---|---|n| operating system | |

    | hardware | |


    Figure 5 The computer as a layered device


    Without the layers of software in modern computers, computer systems would not
    be as useful and popular as they are today. While the complexity of these underlying
    layers has increased greatly in recent years, the net effect has been to make
    computers easier for people to use.'
  merge: -1
  pgno: 18
- img_proc: true
  md: '# SAQ 1


    Why is Java software relatively portable between different platforms?


    Answer


    Java software is portable because it runs on a virtual machine, and the Java Virtual
    Machine (JVM) masks inherent differences between the underlying architectures
    and operating systems on different computer platforms. As long as you have a suitable
    JVM for a platform, you should be able to run Java software on that platform.'
  merge: -1
  pgno: 19
