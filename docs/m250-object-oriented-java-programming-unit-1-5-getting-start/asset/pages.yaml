  md: '# SAQ 3


    What are the main reasons for Java’s popularity as a programming language?


    Answer


    Some of the main reasons for Java’s popularity are:


    +   - familiarity of style to existing programmers

    - platform independence (portability) – Java runs on a wide range of hardware
    platforms

    - robustness – Java avoids many error-prone features of some other languages

    - security – by design, Java allows the coding of relatively secure applications

    - object-orientation – Java was designed with object-oriented programming in mind,
    and so provides all the benefits of this programming approach.'
