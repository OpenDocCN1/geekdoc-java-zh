  md: '# Introduction


    In earlier units you interacted with objects by sending them messages. In this
    unit you are going to be looking ‘behind the scenes’ at the code that allows an
    object to perform some action in response to a message. This code is termed a
    method – it is a method that is executed when the corresponding object is sent
    to an instance of that class. Creating new object behaviours is about writing
    new methods or changing ones.


    We will investigate how object attributes are implemented using instance variables,
    and see how methods can be used to interact with those variables. It will become
    clear that methods allow us to reuse code, reducing the amount of work we need
    to do when developing classes.


    This unit will introduce you to two important concepts in object-oriented programming:
    encapsulation and data hiding. You will see that access modifiers such as public
    and private are important in implementing these features.


    Sections 2 to 5 may look short on paper, but the computer activities will take
    time to complete as you will be developing your ability to use the BlueJ editor
    and the techniques necessary for writing code.


    Sections 6 and 7 are mainly discursive, but the concepts they introduce are fundamental
    to your understanding of the principles of object-oriented programming and so
    need careful study.


    Section 8 is a consolidation section. It consists of a few activities and aims
    to draw together, in one extended example, techniques and ideas that you have
    learnt in this unit. it is important to complete this section as it will give
    you practice in the types of activity that may arise in practical questions.


