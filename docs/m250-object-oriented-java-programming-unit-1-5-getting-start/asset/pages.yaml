    # 3.3 Object-oriented technology in context


    The idea of viewing software (and, indeed, of designing and writing software)
    in terms of objects is not a new one. The idea started in the mid-1960s with the
    language Simula, a language designed for performing simulations (for example,
    using computer graphics). However, the value of the object-oriented approach only
    really became evident in the next two decades with the development of languages
    such as Smalltalk, Eiffel, Object C and C++.


    By the 1990s C++ had emerged the market leader in object-oriented languages. Its
    popularity was due in part to the familiarity of its syntax to the large existing
    of C programmers. C is used extensively on computers that run the Unix operating
    system and its derivatives, such as Linux, and is still freely used today.


    In the next section you will learn about the development of Java, a programming
    language that was built from the ground up with object-orientation in mind. While
    its syntax superbly resembles C, it is a fully-fledged object-oriented language
    owing more to the spirit of Smalltalk than C. Java has done much to increase the
    spread of object-oriented programming and today object-oriented programming (delivered
    via languages such as Java, Ruby and C#) is the dominant form of software development,
    especially for software with graphical user interfaces.'
