    # 5.4 while loops


    A second form of loop provided in Java and many other languages is called the
    while loop.

    As we saw at the start of Section 5, when the number of iterations required for
    a loop body is not known in advance, but depends on achieving some condition,
    a while loop is the appropriate structure.

    A while loop is actually simpler than a for loop, as Figure 15 illustrates.


    ![](img/3b2a7e20c7b75206410143a99df1dd1c_305_0.png)


    Figure 15 A diagram of a while loop'
  merge: -1
  pgno: 305
- img_proc: true
  md: "A Java while loop has the following structure:\n\n```\nwhile (condition)\n\
    {\n    //statements\n}\n//any further statements\n```\n\nA while loop begins as\
    \ many times as the keyword while which is followed by a condition in parentheses.\
    \ As usual, the condition is some Boolean expression; something that can be evaluated\
    \ to true or false.\n\nLike a for loop, a while loop has a statement block enclosing\
    \ any statements that may be repeated a number of times. If the condition is false\
    \ the first time it is tested then the statement block is never executed and program\
    \ flow goes on to any code that follows the loop.\n\nWhen the loop is executed\
    \ the following steps take place.\n\nStep 1 The condition is evaluated;\nStep\
    \ 2\n\n+   - If the condition evaluates to false, the program flow moves on to\
    \ the code after the loop body.\n- If the condition evaluates to true, the statement\
    \ block is executed and the flow returns to 1.\n\nSo the statement block is executed\
    \ as many times as the condition evaluates to true. As it stands, this does not\
    \ explain how the loop can ever terminate. Something has to happen to make condition\
    \ go from true to false. Very commonly the value of the condition will depend\
    \ on something declared and initiallyised to the loop, which gets changed each\
    \ time the body of the loop is executed, so that eventually the condition becomes\
    \ false. Another possibility is that the value of the condition may depend on\
    \ input from a user, or from some other source such as a file. You saw an example\
    \ of this in Subsection 5.1, where a loop was terminated as soon as the user entered\
    \ a number that was 100 or more.\n\nHere is another example of a while loop: it\
    \ displays odd numbers in the sequence 1, 3, 5, ... while the current odd number\
    \ is less than 30:\n\n```\nint number = 1; //a starting odd number\nwhile (number\
    \ < 30)\n{\n    System.out.println(number);\n    number = number + 2; //next odd\
    \ number\n}\n```\n\nOnce each number has been displayed the code adds 2 to it\
    \ to generate the number that will be used next time round the loop."
