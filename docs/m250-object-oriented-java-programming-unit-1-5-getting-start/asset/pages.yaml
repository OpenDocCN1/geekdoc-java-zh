  md: '# Converting primitive values to strings


    The first problem we will solve is how numerical data can be displayed in the
    dialogue box. You saw in Unit 3, and in Activity 4 above, that the concatenation
    operator + for String has the convenient property that if only one of its operands
    is a String, then the other operand will be automatically converted into its String
    representation, whatever its type.


    For example:


    ```

    int num;

    num = 10;

    UDialog.alert(num + " green bottles");

    ```


    puts up the expected dialogue box shown in Figure 10.


    ![](img/3b2a7e20c7b75206410143a99df1dd1c_263_0.png)


    Figure 10 An int is converted to its String equivalent


    This works equally well with other numerical types, for example:

    UDialog.alert("Pi is approximately " + 3.141592653589793\);


    But what if there is no explanatory text to concatenate and we want to display
    a number on its own? Well, we might concatenate it to an empty string:

    UDialog.alert("" + 42);


    This does what is wanted, but is not exactly elegant! A better solution is to
    use the class method valueOf() provided by the class String.

    Since valueOf() is a class method, it is invoked on the String class itself with
    the primitive value to be converted as the argument. The value returned will be
    the String representation of that value. The string can then be used as the argument
    in an UDialog message. For example, we can do this with int:


    ```

    int num = 42;

    UDialog.alert(String.valueOf(num));

    ```


    In fact valueOf() works with any primitive data type because the method is overloaded,
    each version accepting a different type of argument, such as float, double or
    boolean, and returning an appropriate String representation of the argument.'
