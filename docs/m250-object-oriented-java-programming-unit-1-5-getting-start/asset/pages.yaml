  md: '# Message answers and collaborating objects


    We start this section with two activities that look at answers generated in response
    to some messages. We then distinguish between a message that modifies the state
    of an object and a message that interrogates an object''s state. We conclude this
    section by discussing collaborating objects and sequence diagrams.


    # 5.1 Message answers


