  md: '# Exploring objects in a microworld


    We will begin some practical explorations of object behaviour by sending messages
    to objects and look in more depth at the state of an object as given by the values
    of its attributes. We will see that an object is an instance of a class of objects
    that share the ability to understand a common set of messages, called a protocol.


    We will also introduce to you an application, developed specifically for the module,
    called Amphian Worlds. This application contains a series of microworlds – computer-based
    simulations that allow you to practice sending messages to objects and to observe
    the messages'' effects. Amphian Worlds contains (unsurprisingly) amphibian objects,
    which will help you to explore object-oriented devices. In this section you will
    be investigating the microworld ‘Two Frogs’ – study of other microworlds forms
    part of Unit 2.


    The activities start with the investigation of sending messages to objects. From
    this exploration you will discover what attributes an object may have and how
    to use the software to inspect the state of an object at any given time.


    You will also write your first piece of Java code that you can manipulate objects
    via code, rather than via a button in a user interface. You will then begin your
    journey into object technology by considering classes.


    To access the microworld used in this section, launch the Amphian Worlds application
    by double-clicking the shortcut that has been installed on your desktop and then,
    from the Microworld menu, select Two Frogs.


