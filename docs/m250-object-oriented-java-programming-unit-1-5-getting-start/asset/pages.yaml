  md: 'We now introduce a more complete object diagram, a standard way of summarising
    information about objects. The object is represented by a rectangle, with three
    sections:


    +   * the top section shows the class of the object;

    * the middle section shows any attributes of the object and their values;

    * the bottom section shows the protocol of the object – the list of messages it
    understands.


    | Class of object: Frog |

    |---||

    | colour | GREEN |

    | position | 3 |

    | Protocol: left(), right(), home(), jump(), green(), brown(), croak() |


    Figure 14 Diagrammatic representation of a variable referencing a Frog object


    Figure 14 shows a variable named frog referencing an object of class Frog. Notice
    that the variable frog is next to a circle and the reference to the Frog object
    is shown by an arrow going from the variable frogl to the object diagram rectangle.


    The top part of the object diagram states that the object is of class Frog. The
    middle part lists the attributes of Frog objects, colour and position, and tells
    us that in this case the attribute values are GREEN and 3. The bottom portion
    of the object diagram shows the protocol for Frog (consisting of the seven messages
    in the protocol of Frog).


    The only way that the state of a Frog object can be changed is by sending it a
    message. The value of the attribute colour can be set to GREEN or BROWN. The value
    of the attribute position can only be a number. (This number is reflected in the
    graphs pane of the microworld Two Frogs on the stone which the Frog object icon
    sits, with 1 being the leftmost black stone and 11 the rightmost black stone.)


    # SAQ 7


    What is the state of the Frog object depicted in Figure 14?


    Answer


    The state of the Frog object is position set to 3 and colour set to GREEN. More
    colloquially you might say something ‘It’s in position 3 and its colour is green’.'
