  md: 'The condition must be enclosed between parentheses, ( ) – if these are left
    out then the compiler will report an error.


    The braces { } and any code that between them are a statement block or just a
    block. A statement block can enclose several statements. Bundling statements together
    in a block makes them a unit that will be selected, not selected, as a whole,
    the if-then statement can control whether a section of code is executed or not.
    This block can also be referred to as an if statement''s body (although, as we
    will see later, an if statement''s body doesn''t necessarily have to be a block).


    Notice also that the if statement does not end in a semicolon; because it has
    its closing curly braces shows the end of the if statement (we return to this
    topic shortly).


