  md: 'confirm() dialogue. This has happened because, in the absence of braces, only
    the statement immediately following if (OUDialog.confirm("Are you 40 or over?"))
    is controlled by the system. The next statement after that OUDialog.alert("Life
    begins at forty"); is executed irrespective of whether the condition is satisfied
    or not because it is outside the statement.


    Once the two statements are written within a statement block, the code will perform
    as intended, as shown below:


    ```

    if (OUDialog.confirm("Are you 40 or over?"))

    {

    fortyAndOver = fortyOver + 1;

    OUDialog.alert("Life begins at forty");

    }

    ```


    Now the string "Life begins at forty" is displayed only when the confirm() dialogue
    returns the value true.


    For this reason, we suggest that you always use a statement block - it is easy
    to add or remove statements from a statement block, and it is clear which statements
    belong to the statement''s body when you use one. In fact, is probably a good
    idea when writing an if statement to add the braces in first, and then fill in
    the statements between them afterwards – that way you don''t forget to use braces.


    # Misplacing a semicolon


    Earlier in the module we suggested that every Java statement ends in a semicolon.
    This was a simplification because, as you have seen we have been writing if statements
    including a block of code, and have not terminated that block of code with a semicolon.


    It''s an easy mistake to make to use a semicolon at the end of the if condition:


    ```

    //what''s that at the end of the line

    if (OUDialog.confirm("Are you 40 or over?"))

    {

    fortyAndOver = fortyOver + 1;

    }

    ```


    This time fortyAndOver gets incremented whatever the age of the user! The reason
    is that Java reads the semicolon as the end of an if statement that has an empty
    body like this:


    ```

    if (OUDialog.confirm("Are you 40 or over?"))

    // do nothing (empty statement)

    {

    fortyAndOver = fortyOver + 1;

    }

    ```


    Now it does not matter whether the condition is true or not. All the condition
    holds sway over is whether or not the empty statement represented by the semicolon
    is ''executed''. Either way, after the if statement program'
