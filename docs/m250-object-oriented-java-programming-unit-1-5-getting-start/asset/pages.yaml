    | static void alert(String prompt) | Display some information until a user clicks
    the OK button. |

    | static boolean confirm(String prompt) | Display some information until a user
    clicks a Yes or No button. |

    | static String request(String prompt) | Requests some information from the user,
    which is returned as a string when the user presses OK. |

    | static String request(String prompt, String initialAnswer) | Requests some information
    from the user, which is returned as a string when the user presses OK. A default
    response (given by initialAnswer) is returned if no response is supplied by the
    user. |


    The Java keyword static in the header of each of these methods, indicates that
    a method is a class method. Class methods are also called static methods.


    Bear in mind when you are reading the examples using these class methods that
    they do not involve sending messages to objects.


