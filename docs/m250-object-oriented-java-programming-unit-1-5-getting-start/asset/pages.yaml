  md: '# 5.2 Setter and getter messages


    The message getColour() has a different purpose from the previous messages you
    have seen. In sending the message getColour(), you are not interested in changing
    the state of the receiver object. Instead you are interested in obtaining its
    state.


    When the message getColour() is sent to a Frog object, the object replies with
    information about its colour. The requested information is returned as the message
    answer (sometimes called a message reply). In sending this message, you ask the
    Frog for the value of its colour attribute. It is usual to say that the message
    getColour() returns the colour of the receiver.


    In sending the message setColour(OUColour.RED) to a Frog object, you request the
    receiver to set its attribute colour to OUColour.RED. Note that you are not requesting
    an answer, and no answer is given.


    It is common for the protocol of an object to include such pairs of messages:
    each pair consisting of a message that gets the value of an attribute of the receiver
    object and one that allows that attribute to be set. A message that gets an attribute
    value is also called a getter or an accessor message, because it allows you to
    access information about the object. The corresponding setter message is also
    called a mutator message, because it is intended to change the state of an object.
    In our example we have getColour() and setColour(), where getColour() is the getter
    name and setColour() is the setter message name.


    # SAQ 8


    What, if anything, is returned as the message answer when you send the following
    messages to a Frog object that is brown and is on the leftmost stone?


    +   (a) getColour()

    (b) setColour(OUColour.RED)


    # Answer


    +   (a) OUColour.BROWN

    (b) No answer is returned.


    # 5.3 Collaborating objects


    The message right() when sent to a Frog object does not involve any other objects.
    Often, however, before an object can act on a message it has to collect some information
    from another object or objects; it does this by sending messages as back to the
    messages sent, enabling the object to deal fully with the initial message. In
    such cases, several objects are collaborating by sending messages to each other.
    (This is not the only form of collaboration; some objects might collaborate by
    taking responsibility for particular bits of required behaviour.)'
  merge: -1
  pgno: 70
