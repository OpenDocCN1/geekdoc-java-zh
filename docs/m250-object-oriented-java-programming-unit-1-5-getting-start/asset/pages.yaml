  md: '# Summary


    After studying this unit you should understand the following ideas.


    +   - Classes can define class (static) methods in addition to instance methods.


    +   - The execution of a class method does not involve a message-send to an object.


    +   - Dialogue boxes are a means of obtaining input from, and displaying output
    to, a user. In this module dialogue boxes are created using class methods of the
    ODialog class.


    +   - The class methods Integer.parseInt() and String.valueOf() can be used to
    convert a string to a number and vice versa.


    +   - A sequence of statements can be made into a statement block by enclosing
    it in braces.


    +   - An if-then statement is used to determine whether or not execute a statement
    block depending on a Boolean condition that evaluates to true or false.


    +   - An if-then-else statement is used to select between two alternative statement
    blocks depending on a Condition. If the condition evaluates to true the statement
    block is executed, otherwise the else statement is executed.


    +   - The operators == != <= >= are used for comparing values from primitive data
    types.


    +   - The operator == can also be applied to reference type variables, in which
    case it tests whether variables reference the same object. Similarly != tests
    its operands reference different objects. These operators can also be used to
    compare to the value null, to see whether a reference variable is referencing
    an object.


    +   - The message equals() can be used to test if two strings contain the same
    characters in the same order.


    +   - The operators && and || use short-circuit evaluation.


    +   - Java statement blocks can be executed repeatedly using for and while loops
    as control structures. The number of iterations is controlled by a condition.'
  merge: -1
  pgno: 315
