    # 5.2 Grouping objects into classes


    You have discovered that the variables frog1 and frog2 refer to very similar objects.
    In fact, these objects understand exactly the set of messages, have the same attributes,
    and behave in exactly the same way in response to the same message.


    These similarities occur because the objects referenced by frog1 and frog2 belong
    to the same class. You can see this in the microworld when using an inspector
    to ‘look inside’ a frog object, as both Inspector windows have the title Inspector:
    Frog.


    The two frog objects in the microworld have been created as instances of the Frog
    class. A class is a blueprint or template for the creation of objects and ensures
    that all its instances have the same attributes, and are able to respond to the
    same set of messages in an identical manner. So two objects objects belong to
    the same class and are referenced by the variables frog1 and frog2:


    +   - understand the same messages

    - respond in the same way to each message (depending on their current state)'
