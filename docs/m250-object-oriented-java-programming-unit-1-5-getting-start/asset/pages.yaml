  md: '# Dialogue boxes


    So far in the module, although you have been able to display output, you have
    not been able to write Java code that allows true two-way interaction with the
    user.


    The class ODIALOG (note the American spelling) provides facilities both for giving
    information to the user (output) and for obtaining information from the user (input)
    using dialogue boxes. In fact, Java provides a much more general form of dialogue
    box, but the set of dialogue boxes provided by the class ODIALOG is designed to
    be easier for you use and to cover the most frequently required cases.


    Dialogue boxes are not the only way of obtaining input from users – or of displaying
    output, of course – but they are popular with users and, as you will see, quite
    friendly for the programmer to work with. Dialogue boxes come in many forms: just
    ask the user to click on a button, but others may require the user to enter some
    text from the keyboard or make a choice, such as ''yes'' or ''no''.


    You may have seen Java dialogue boxes already. They are used to report some kinds
    of error that occur when you use the BlueJ environment. Figure 1 shows what we
    got when we pressed the New Class... button in a BlueJ project window and then
    deliberately left the class name blank.


    ![](img/3b2a7e20c7b75206410143a99df1dd1c_247_0.png)


    Figure 1 A dialogue box produced in BlueJ


    The ODIALOG class we will be using provides three different flavours of dialogue
    boxes:


    +   - alert – displays a message and an OK button;

    - confirm – displays a question and asks the user to click Yes or NO;

    - request – asks the user to type something into the dialogue box and offers an
    OK or Cancel button.


    Each of these types of dialogue box is said to be modal. A modal dialogue is one
    that will not allow you to interact with another part of the program or system
    until you have responded to it by clicking one of the buttons'
  merge: -1
