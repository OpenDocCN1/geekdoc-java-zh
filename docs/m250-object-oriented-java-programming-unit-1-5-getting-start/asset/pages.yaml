- img_proc: true
  md: 'We should emphasise that we are not saying that the transfer() message is always
    equivalent to a pair of messages using debit() and credit(). It will not be equivalent
    in cases where the receiver of the transfer() message has insufficient funds for
    the transfer. In more detail, what happens when myAccount.transfer(herAccount,
    400) is executed is that myAccount sends itself a debit(400) and only if the message
    is true then it will send herAccount the message credit(400).


    Contrast this with frog1.sameColourAs(frog2), where the receiver (frog1) always
    sends itself a message using setColor() after getting the colour of frog2 by sending
    a getColor() message. You will be able to see how this done at the level of code
    once you move on to later units, where methods (Unit 4) and conditions (Unit 5)
    are introduced.


    # Exercise 5


    This is an open-ended question. Some possible answers are noted below. Your answers
    may be different, but nevertheless correct.


    # Similarities


    +   - Both involve collaboration between two objects.

    - Both involve an object sending a message to itself.

    - Both original responsibilities are discharged by the receiver by using exactly
    two messages.


    # Differences


    +   - In the frog example, a message answer becomes a message argument.

    - In the in-account example, the message arguments in both of the messages used
    to discharge the responsibility are taken directly from the message requesting
    the transfer.


    # Exercise 6


    | Receiver | herAccount |

    | Message | transfer(myAccount, 200) |

    | Message name | transfer() |

    | Argument(s) | myAccount, 200 |

    | Message-send | herAccount.transfer(myAccount, 200) |


    # Exercise 7


    +   - (a) False. Some messages have no arguments, some have more than one argument.

    - (b) True.

    - (c) False. Messages are not objects, and so they are not instances of a class.'
