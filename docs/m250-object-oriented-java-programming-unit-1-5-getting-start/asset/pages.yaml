  md: '# Unit 2 Object concepts


    Message answers can also provide information that is to be used with a later message.
    Sometimes the information is the value of a particular attribute of an object.
    For example, if a Frog object needs to know the colour of another Frog object,
    it would have to send the other Frog object a message and the information would
    be returned as the message answer. There is no reason why message answers should
    not be used as message arguments in subsequent messages.


    Two Frog objects collaborate with frog1.sameColourAs(frog2) executed, as described
    below.


    The message named sameColourAs() when sent to a Frog object requests it to change
    its colour to be the same as another Frog object. The argument for sameColourAs()
    specifies the Frog object from which the receiver takes its new colour. There
    is nothing new about asking a Frog object to change its colour, but in all previous
    cases the message explicitly explicitly what the new colour should be as in the
    message setColour(COLOUR, RED). However, in using the message named sameColourAs(),
    an argument specifies another Frog object that has the required information (as
    the value of its attribute colour).


    A technique that is often used to follow a sequence of messages between collaborating
    objects is to put yourself in the place of the receiver of the message. To follow
    the sequence of messages sameColourAs(frog2) is sent to frog1, this technique
    requires you to put yourself in the place of frog1. You are asked to use this
    important technique in Exercise 1.


