  md: '# Variable terminology


    At this point it is useful to clarify some terminology associated with variables.
    We may use informal shorthand phrases such as ''send a message to the object frogl'',
    or ''as before, frogl behaved as expected''. However, since a variable is a label
    on a block of memory, to be technically precise the phrases should be ''send a
    message to the object referenced by the variable frogl'' and ''as before, the
    object referenced by the variable frogl behaved as expected''. Most programmers
    would be happy using the shorthand style in casual speech, but you should always
    be prepared to use the precise terminology when required and bear in mind that
    the variable that references an object is not the object itself.


