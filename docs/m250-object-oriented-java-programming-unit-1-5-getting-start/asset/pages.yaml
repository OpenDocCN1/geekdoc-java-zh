    # 2.3 Documenting methods with Javadoc


    When writing a large program it is important that there is some form of document
    recording how the program works; however, if the program changes the documentation
    must change as well. For large programs that are constantly being changed and
    improved, it would be a tedious and error-prone task to separately maintain documentation
    and keep it consistent with the source code. There are many tools available to
    help ease this task, and a standard tool for Java is Javadoc, a program documentation
    tool that comes with Java and can be run directly from BlueJ.


    Each time we have asked you to write a method, we have given a description of
    what the method is intended to do in the form of a Javadoc comment. Javadoc comments
    can also be used to describe classes and constructors.


    When you run the Javadoc tool it picks up information from these specially formatted
    comments and they are used to create an HTML file, which documents the classes
    in a widely accepted, industry standard way. This documentation is aimed at human
    readers (including possibly the writer of the code, as they may well forget what
    the methods do). Since Javadoc documentation is aimed mainly at people who want
    to make use of the code, by default it only includes items that can be accessed
    from outside the class itself.


    # Activity 7


    Open Unit4_Project_2. As previously indicated, this project incorporates all the
    changes made to the classes Frog and Toad in Activities 3–5 (although the whoAreYou()
    method has been removed).


    +   From the Tools select Project Documentation (or press Ctrl+J on your keyboard).


    +   A dialogue may appear; if it does, click on Regenerate. This causes the Javadoc
    tool to run.'
