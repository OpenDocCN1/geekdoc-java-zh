  md: '# Unit 2 Object concepts


    Could the Frog class be a subclass of the Toad class? The answer to that is no
    - the Frog class cannot be a subclass of the Toad class, because instances of
    Toad do not understand the jump() message, and if Toad were a subclass we would
    expect Toad objects to be able to jump.


    Conversely, could the Toad class be a subclass of the Frog class? Possibly, but
    this would be undesirable – we would not say in some conversation that a frog
    is a toad. The programmer recognised this and so did not use the subclass and
    superclass relationship between these classes. Our use of subclasses reflect our
    usual views of how objects relate to one another.


    # The importance of relationships


    The subclass/subclass relationship is important because Frog objects and HoverFrog
    objects have aspects of their protocol and attributes in common. As you will see
    in the next subsection, you need to define these common attributes just once –
    for the superclass (Frog). Then, the fact that HoverFrog is a subclass of Frog
    automatically ensures that HoverFrog objects also have these attributes and behaviours.


    In later units you will see that it is possible to program a subclass so that
    its attributes are initialized differently from the ones in the superclass. In
    this particular case HoverFrog objects have an additional attribute that has to
    be given an initial value, but the attributes they have in common with Frog objects
    happen to have the same initial values.


    You will also see that instances of a subclass may respond to a message differently
    from the way instances of the superclass would respond to that


    You will learn more about how to design classes using these object-oriented relationships
    in Unit 6. Because the superclass/subclass relationship is actually very common
    in real life, it is one of the central features of object-oriented programming.
    This relationship helps us model the world in a natural way, reflecting the ways
    in which classes of things are related to one another.


    # 3.3 Programming and subclasses


    Beyond helping us to model the real world in software in a natural way, using
    subclasses when building programs enables programming effort to be saved. When
    building object-oriented software, the programmer has to specify what the objects
    of each class will be able to do. But sometimes turns out that the objects of
    some prospective class (the HoverFrog objects in our example) may be able to do
    everything that some existing class can already do (the Frog objects). In addition,
    objects of the prospective class may need to be able to understand some extra
    messages (up() and down()), and may have extra attributes (height). In such a
    case there is a simple way to save work: the programmer can declare the new class
    to be a subclass of the existing class.'
