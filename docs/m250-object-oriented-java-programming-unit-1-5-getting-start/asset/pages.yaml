  md: '# Solutions to Exercises


    # Unit 2


    # Exercise 1


    As frog1, you have been asked to change your colour to the same colour as frog2.
    Now, as a human, you can, of course, see the colour of frog2 by looking at the
    graphical interface provided. But, as frog1, you have no way of ''seeing'' such
    information. The only way is to send the message getColor() to frog2. The colour
    to is will be provided to you, as frog1, as a message answer. Now you are nearly,
    but not quite, finished.


    You, as frog1, still need to change your own colour to the colour given by the
    message answer. So how do you do this? As you know, the only way you can get an
    object to do anything is to send it a message. This is often the best way to achieve
    something even when the object in question is you. Hence the answer is to send
    yourself the message setColor() using as the argument the colour you got from
    frog2 as a message answer.


    # Exercise 2


    Double-clicking a variable name creates an inspector, which is itself an object.
    It was the inspector object that sent a message to myAccount to find out its state,
    and then displayed the result. Hence it still holds true that the only way to
    find out the state of an object is to send it messages.


    # Exercise 3


    For the message-send myAccount.setNumber("1234")


    +   - myAccount is the receiver,

    - setSnackbar() is the message name,

    - "1234" is the argument,

    - setSnackbar("1234") is the message.


    For the message-send myAccount.credit(100)


    +   - myAccount is the receiver,

    - credit() is the message name,

    - 100 is the argument,

    - credit(100) is the message answer.'
