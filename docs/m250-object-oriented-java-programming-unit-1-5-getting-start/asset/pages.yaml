  md: "# Example while loop\n\nNext we show an example while loop in which a user\
    \ is repeatedly invited to enter a number. While the number they enter is less\
    \ than 100, an alert dialog box is displayed informing them of the fact. As soon\
    \ as the number entered is 100 or parse the condition becomes false and the loop\
    \ terminates.\n\n```\nwhile (Integer.parseInt(UDialog.request(\"Number\")) < 100)\n\
    {\n    UDialog.alert(\"Your number was less than 100.\");\n}\n```\n\nNotice that\
    \ there is no way of predicting in advance what numbers the user will actually\
    \ enter. You cannot know how many numbers there will be, nor can these numbers\
    \ be expected to run neatly in some particular sequence. The execution just has\
    \ to keep looping around as long as the number inputs is less than 100 and will\
    \ not stop looping until the first value of 100 or more accurately materialises.\n\
    \nA for loop is suitable when you want to repeat an action known number of times\
    \ or when you want to run through a known range of values performing some action\
    \ for each value in the range. After the specified number of iterations has been\
    \ completed, the iteration stops.\n\nA while loop is suitable when you cannot\
    \ tell in advance when the iteration should end. The iteration will continue while\
    \ some particular condition is true. As long as the condition becomes false the\
    \ iteration stops.\n\nIn fact turns out that anything can be done with a while\
    \ loop can also be achieved with a for loop and vice versa. however, in most applications\
    \ you are likely to find one form of loop is better than the other, in that it\
    \ is more convenient and natural. In the following scenarios we look in detail\
    \ at the structure of for and while loops, and put them to use.\n\n# SAQ 13\n\n\
    For each of the following scenarios, would you be likely to use a for loop or\
    \ a while loop?\n\n+   (a) Querying a user for a filename repeatedly until a valid\
    \ name has been supplied.\n(b) Printing out each item on some kind of list.\n\
    (c) Repeatedly adding costs of individual purchases to find a total bill.\n\n\
    # Answer\n\n+   (a) You will not know how many times you need to ask the user\
    \ for a filename before a valid filename is provided, so you will need a while\
    \ loop.\n(b) In this case a list of items already exists, and the number of items\
    \ in the list can probably be easily determined, a for loop is the most likely\
    \ solution.\n(c) This could be done either a for or a while loop, depending on\
    \ whether the list of purchases is already available or is being"
