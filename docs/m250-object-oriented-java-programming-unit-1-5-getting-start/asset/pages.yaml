  md: 'This means that a subclass can be insulated from any changes that might be
    made to its superclasses in terms of how its attributes are implemented.


    To recap, there are two major advantages to reuse of methods in general and to
    setters and getters in particular (if they are provided).


    +   1 Methods aid code reuse by implementing behaviours that objects need to perform
    in a reusable way. In the case of a setter, you can write the code to change an
    object''s state just once, and then reuse that method to do the same job in future.
    Likewise a getter method may employ some complex code to determine an attribute
    based on the state of an object, and rewriting this code everywhere where the
    attribute is needed would be wasteful and error prone.


    +   2 Methods in general (and getters and setters in particular) aid reuse at
    the class level. That is, they facilitate the process of changing a class or creating
    a subclass for use in a different situation. This is because changes to a class
    T be confined within methods provided by the class T, whose signatures do not
    need to change. Other classes can just continue to use these methods.


    In M250, as a rule of thumb, we suggest that wherever getter and setter methods
    are available you should use them in your code. This will mean the only place
    - other than in a constructor - where an instance variable is assigned directly
    is in its setter method, and the only place it is accessed directly is in its
    getter method. These two methods - the getter and setter - have to operate directly
    with the instance variable because there is no other way for them to work. They
    cannot use getters and setters, because they are the getters and setters!


    The exception is that, for reasons that cannot be elaborated upon at this point,
    it is safer, where possible, to initialise instance variables directly in a constructor
    rather than by using setter messages.


    In the following section we will consider when it is appropriate for a class to
    provide public setters and getters.'
