    and the type of value it can hold. In this, the instance variable colour is defined
    to hold a reference to an instance of the class OUColour.


    The access modifier private tells the Java compiler that the instance variable
    can be accessed directly within the class itself. (Once objects of the class have
    been created, their private instance variables will be accessible only to objects
    of the same class.)


    +   2 this.colour = OUColour.GREEN;


    This statement is in the constructor for the class Frog. It accesses the instance
    variable colour and assigns to it a reference to the object OUColour.GREEN.


    +   3 return this.colour;


    This statement is in the method getColor(). It accesses the colour instance variable
    of the receiver and returns its value. We discuss methods that return values in
    Section 4.


    +   4 this.colour = aColour;


    This statement is in the method setColor(). It copies the reference held in aColour
    into colour. We discuss methods like setColor() in more detail in Section 3.2
    and Section 5.


    An expression as this.colour (or colour) is called a direct access of the colour
    instance variable of the object referenced by this. By direct access, we mean
    that we have not used a method to access the variable. When we speak of accessing
    a variable, we normally mean accessing it.


