  md: '# SAQ 8


    Frog objects have the attributes colour and position. If the Frog object referenced
    by frog is shown in the graphics pane to be on stone 1 and is sent the message
    brown(), what is its state after responding to the message?


    # Answer


    The state of the Frog object referenced by frog comprises the values of its attributes.
    If it has responded to the message brown(), the value of its attribute position
    is 1 and the value of its attribute colour is BROWN.


    # 5.5 Messages that do not alter an object''s state


    Most of the messages you have experimented with so far alter some aspect of an
    object''s state – either its colour or position. However, it is quite common to
    come across messages that do not cause any state change. As an example, we have
    included the message jump() in the protocol of Frog objects. Sending the message
    jump() to a Frog object makes it send another message to the microworld to tell
    it to display graphically jumping, but leaves its state unaltered. You can tell
    that the state is still the same, because the only attributes Frog objects have
    colour and position, and neither is affected by the message jump().


    Later, in Unit 2, we discuss messages that query an object''s state and reply
    with the value of a particular attribute. Such messages do not usually change
    the state of the receiver.'
