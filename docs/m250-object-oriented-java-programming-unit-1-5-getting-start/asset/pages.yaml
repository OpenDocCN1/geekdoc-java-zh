  md: 'subclass of the Frog class does not mean that a HoverFrog object is ''less''
    than a Frog object. The term ''subclass'' indicates that the subclass is derived
    from the superclass. A HoverFrog object has at least the attributes and protocol
    of a Frog object.


    The relationship between the Frog and HoverFrog classes can be summarised as follows.


    +   (a) The protocol of HoverFrog objects includes that of Frog objects.


    +   (b) HoverFrog and Frog objects respond in the same way to the messages common
    to their protocols.


    +   (c) Instances of the HoverFrog class have the attributes of instances of the
    Frog class.


    +   (d) HoverFrog objects have an additional attribute.


    +   (e) There are messages in the protocol of HoverFrog objects that are not in
    the protocol of Frog objects.


    +   (f) The common attributes of the instances of both classes are initialised
    in the same way.


    When the programmer was developing the code for the Frog and HoverFrog classes,
    they had these relationships in mind and recognised that this was a typical case
    for using the subclass andsuperclass relationship. Using this relationship, the
    subclass can make use of attributes and behaviour developed for the superclass
    and add other attributes and behaviour to them. relationship is illustrated in
    Figure 1.


    ![](img/3b2a7e20c7b75206410143a99df1dd1c_60_0.png)


    Figure 1 Relationship between the Frog, HoverFrog and Toad classes


    The subclass/superclass relationship is often expressed using the words is a,
    as in the phrase ''a hoverfrog is kind of frog''. This expresses that hoverfrogs
    are kinds of frogs, and share some attributes and with frogs (but may have others).
    You can think of many such relationships in real life, for we might say ''a toad
    is a kind of dog'', or ''a hatchback is a kind of car''.


    Figure 1 also includes the Toad class we have already encountered; in Activity
    2 we saw that there were some similarities and several differences in the protocol
    and behaviour of Frog objects compared to Toad objects. For example, Frog objects
    understand the message jump(), but Toad objects do not, and frogs and toads do
    not behave in the same way in response to some of the messages they understand.'
