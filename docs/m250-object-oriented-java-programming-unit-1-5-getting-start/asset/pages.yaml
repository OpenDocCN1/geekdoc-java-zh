    As Activity 7 shows, documentation will be picked up by Javadoc only if it is
    in a particular form and position. So far you have learnt that:


    +   - you must enclose a Javadoc method comment between /** and */,

    - you must place a method comment directly before the method header.


    Method comments serve several purposes.


    +   - They focus your mind on the purpose of the method, that is, on the behaviour
    corresponding message will cause.

    - Months later, when a student you are revising, or as a programmer you are reviewing
    this method among dozens of other methods you have written previously, comments
    can be enormously helpful in giving you a quick reminder of what the code is about.

    - They support reuse of code as they help anyone looking at your code to understand
    how to use the method and what the method should do.


    Notice that a method comment should not focus on how the code works; it should
    focus on the code''s purpose or effect.


    Although you should always include a method comment, you do not use comments within
    a method body. As a general rule, comments other than the initial one are about
    how a method is implemented. You should use these when you think something is
    tricky to understand, so that the person reading the code will know what was intended.


    # 2.4 Editing, compiling and executing methods


    This section explains the relationship between what you write in a class, compilation
    and code execution, and reviews some material from Unit 1.


    Java is a high-level programming language: it is designed so that human can read
    it easily. A Java program is written, modified or executed using an editor. This
    could be a simple text editor such as Notepad, but in this module you use the
    editor provided by the Blue Environment. The code you write is called source code.
    For example, earlier in your unit you used the editor to modify the source code
    for the Frog class by adding a method catchFly(). Source file names have the extension
    .java.


    For the code to be executed on a computer, the Java compiler must compile it into
    an intermediate form called bytecode. In BlueJ, the Compile button is pressed.
    Bytecode file names have the extension .class. In the case of the Frog class,
    the compiler will create the file Frog.class from the source code Frog.java. The
    bytecode for a class must be recreated when its source code is modified and may
    also need recompiling when related classes are changed.


    The bytecode is portable, because each computer that run Java programs has a JVM
    – which is itself a program – understands bytecode'
