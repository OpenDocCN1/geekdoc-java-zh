  md: '# Textual representations of objects and primitive values


    Throughout this unit you have seen how the value obtained from evaluating an expression
    is displayed in the Display Pane of the OUWorkspace. When these values have literal
    value equivalents


    # 5.1 The message toString()


    In Java every object is to understand a message called toString(). On receiving
    such a message an object will return the message answer a textual representation
    of itself.


    The nature of the textual representation varies with the class of the object and
    by default indicates:


    +   - the class of the object (in the first part of the representation);

    - its address in memory (in the second part of the representation) – this will
    vary from one to another.


    This is the case for Account objects: the message expression myAccount.toString()
    might return the string "Account@bb0f79", where Account is the class name and
    the string bb0f79 represents the memory address at which the object is stored.


    This default representation is used if the programmer has not provided a more
    descriptive text in the class. Inside, it is possible to provide information on
    the state of the object, for example. This is the case with the Frog class so
    that the message expression kermit.toString() returns a textual representation
    dependent on the state of the Frog object referenced by kermit, such as:


    > "An instance of class Frog: position 1, colour Colour.GREEN"


    As a result of this choice of representation, unlike Account objects, Frog objects
    cannot be distinguished by their textual representations since all frogs have
    the same state will have the same textual representation. It is up to the programmer
    to decide what text to provide.


    In the next activity, message answers are revisited and you will examine the way
    in which the message toString() is used to obtain the textual representation of
    an object.'
