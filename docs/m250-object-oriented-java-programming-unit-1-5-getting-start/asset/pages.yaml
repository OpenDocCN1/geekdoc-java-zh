  md: '# Summary


    After studying this unit you should understand the following ideas.


    +   - A `public` method defines a message for all instances of a class and for
    all instances of any subclasses.


    +   - A `private` method is used to define a message that only instances of that
    class can send (to themselves or to other instances of the same class), but which
    other classes of objects cannot send.


    +   - Although a method has to be defined only once to work for a whole class
    of objects, when a message causes a method to be executed, the method behaves
    as though it is exactly one object - namely the object that received the message
    that caused the execution of the method.


    +   - Attributes are implemented in Java using instance variables. An instance
    variable holds either a primitive data value or a value that is a reference to
    an object. The declared type of the variable specifies what kind of value it can
    hold.


    +   - Access modifiers are used to specify the visibility of instance variables
    and methods to other classes.


    +   - You can think of two kinds of things existing inside an object: its instance
    variables and its own methods. All other objects (and their methods) can be considered
    as outside a given object. This incorporation of data and behaviour in a single
    entity is termed encapsulation.


    +   - If you have followed good practice and made all the instance variables `private`,
    there is no direct access to the state of an object from objects of other classes.
    The consequence of this is that the only way that an object (or a user) can change
    the state of another object or make it do something is by sending it a message).


    +   - Object references or values of some primitive data type are returned as
    values from a method by writing a `return` statement in the method code. Methods
    that do not return a value return a type of `void`.


    +   - A method name is overloaded if there is more than one method with that name
    in the protocol of a class, with each method of that name having a distinct signature.


    +   - Arguments are used in a message to pass information into methods. The formal
    argument names in the header of a method are placeholders for the actual arguments.
    The value of each actual argument is copied into a corresponding formal argument
    when the method is executed.'
  merge: -1
  pgno: 239
