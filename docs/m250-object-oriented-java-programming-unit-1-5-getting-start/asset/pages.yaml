  md: "These three kinds of dialogue box are found in other programming languages,\n\
    just Java.\n\nUsing an OUDialog involves using a kind of method we call a class\
    \ method,\nso we will discuss this kind of method in the next section.\n\n# 2.1\
    \ Class methods\n\nThe methods you were introduced to in Unit 4 are always encapsulated\
    \ by objects\nalong with instance variables. Such methods are always invoked as\
    \ a result of\nsending a message to an object and that is why they can use the\
    \ expression\nthis, which you will remember the current object when a message\n\
    is received. These methods (all the ones you have seen so far) are more\nisely\
    \ called instance methods because of their relationship with instances\nof a class\
    \ (that is, objects).\n\nHowever, there is another form of method that is invoked\
    \ without reference to\np particular object, which is called a class method. Class\
    \ methods are\nmethods that can be executed irrespective of whether any instances\
    \ of the\nclass have been created and so they cannot use the expression this.\
    \ Classes\n define class methods as well as instance methods.\n\nA statement that\
    \ results in a class method being executed looks like a\nstatement that results\
    \ in an instance method being executed. For example, if\nsomeClass is a class,\
    \ we are used to seeing messages being sent as in (a)\nbelow:\n\n```\nClass myVar\
    \ = new SomeClass();\nmyVar.doSomething();\n```\n\nFrom looking at this code we\
    \ expect that it ultimately results in the instance\nmethod doSomething() being\
    \ executed; that is, it results in the object of\ntype SomeClass referenced by\
    \ myVar being sent a message.\n\nHowever, if doSomething is a class method it\
    \ can perform its work without\nsending messages to objects and, in this case,\
    \ the following fragment can be\nused.\n\n```\nClass.doSomething();\n```\n\nThis\
    \ code fragment results in the class method doSomething() being\nexecuted.\n\n\
    Here is how the execution of instance and class methods differs.\n\nIn (a), when\
    \ the message-send is compiled, the compiler produces bytecode\nat that run-passes\
    \ the receiver and the message to the JVM. It instructs\nthe JVM to find out the\
    \ class of the receiver and to search for a method that\nmatches the message's\
    \ signature (starting from the receiver's own class and\nsearching up the inheritance\
    \ hierarchy until the method is found). When\nthe method is found, the JVM then\
    \ invokes method, with the receiver."
