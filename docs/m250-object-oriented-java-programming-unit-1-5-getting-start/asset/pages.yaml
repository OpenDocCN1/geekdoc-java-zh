  md: '# 4.3 Versions and editions of Java


    Java has undergone some significant changes since its first release, so it is
    important to have some appreciation of the different flavours of Java in use.


    Java''s initial success was as a programming language for the web, but in 1999
    it was recognised that the concept that one standard Java language package could
    apply to all sorts of computing platform was not really feasible. So the concept
    of Java editions was introduced, to cater for the different needs of, say, large
    international business systems running on extensive networks with many servers
    as opposed to software running on mobile phones with very limited hardware resources.


    The three main editions are:


    +   - Java™ Platform, Standard Edition (Java SE) – the original edition, targeting
    desktop environments;

    - Java™ Platform, Micro Edition (Java ME) – targeting environments with limited
    resources as mobile phones;

    - Java™ Platform, Enterprise Edition (Java EE) – targeting large distributed enterprise
    or internet environments.


    The core language in these editions is the same; the editions differ in what libraries
    (APIs) are provided and what the JVM can do on the targeted hardware.


    Java editions are available in a variety of Java versions. Differences between
    versions tend to be more, but later versions are not generally compatible with
    earlier ones. For example, the first publicly available version of the Standard
    Edition language was Java 1.0. This was followed by Java 1.1, Java 1.2, Java 1.3
    and Java 1.4.


    Java 1.2 was also called Java 2 and saw the adoption of a framework for graphical
    interfaces called Swing, as well ''collection classes'' that you will meet later
    in this module.


    Further significant changes occurred in Java 5 in 2004 and the naming convention
    for the versions of language changed from dot notation (1.2, 1.3 and so on) to
    version numbers (5, 6, 7 and so on), although you will still see the earlier dot
    notation in some contexts.


    Each version has introduced improvements and expanded the API set, and within
    each major release there have also been many minor releases that have fixed bugs.


    In this module we will be using Java Platform, Standard Edition (Java SE), in
    particular Java SE 7.'
