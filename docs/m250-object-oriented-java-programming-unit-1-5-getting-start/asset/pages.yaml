  md: 'float.) When such type conversions take place it is called automatic type conversion
    as the conversion is automatically carried out by the JVM.


    For example, if we


    ```

    int anInt = 17;

    double aDouble = anInt;

    ```


    then, in the second line,


    +   * anInt 17 is converted to the double value 17.0,

    * and the value 17.0 is stored in aDouble.


    After this, the value held by aDouble is still of type double, and the value held
    by anInt is still the same int value that it was before. The variables ever store
    a value of their declared type.


    Although the rules are more complex than we have explained here, it is worth remembering
    that it is never possible to automatically assign a value of a larger type to
    a variable of a smaller type (even if the actual value seems to allow it), although
    17.0 (a double) would seem to have the same value as 17 (an int) you cannot store
    17.0 in a variable of type int because a double occupies 64 bits while an int
    occupies 32 bits. There isn''t room in the variable to store the larger value.


    Conversion from one primitive to another is, however, often possible, using a
    mechanism called a cast. This topic is discussed in Appendix C.


    # The char type as an integer


    With the advent of the internet to support all the different characters that are
    used in all of the world''s languages led to a rethink of every computer character
    representations (which were generally limited to a mere 128 characters) and, as
    a result, a new character representation, Unicode, has been gaining ground since
    1987. Unicode characters were originally stored in 16 bits (allowing for 65,536
    different values) and, because the Java language designers wished to support international
    use, this is what Java chose for the primitive type char.


    Unicode values can be represented as unsigned integers (an integer type with only
    non-negative values), and so a Java char value can be in safely used anywhere
    an int, long, float or double value is required.


    For example, the code


    ```

    char myChar = ''a'';

    int myInt;

    myInt = myChar;

    ```


    will assign the value 97 to myInt, because the integer value for ''a'' in Unicode
    is 97.


    This integer-like characteristic means that you can do things as adding 1 to a
    character in a character set. It also helps to explain how you can perform comparisons
    such as ''a'' < ''b'', which is useful for'
