  md: '# 3.2 Object-oriented programming


    In the object-oriented approach all the processing carried out by software is
    considered as being done by objects. You are already familiar with the concept
    of objects in the physical world, being surrounded by them every day – cars, people,
    toaster, DVD players, managers, etc. In object-oriented programming, we use objects
    to model real life. The software objects simulate the part of the real world (often
    called the application domain or process domain) with which we are concerned.
    For example, if we need a system to help manage patients in a hospital (the domain),
    our software will, in some sense, have to construct representations of part of
    the world of hospital administration. The objects we might need are those that
    deal with modelling real-world patients, doctors, nurses, wards and so on. Since
    the system would be a computerised one we would also need objects for the user
    interface, as windows, menus and buttons.


    In the real world, people, organisations and even machines interact with one another
    by exchanging requests and passing one another information. In the same way, object-oriented
    programs consist of code for creating objects that communicate by sending messages
    to each other and they may reply back, called message answers, from others.


    Two important aspects of an object are its attributes and its behaviour. An attribute
    is some external property or characteristic of an object, so a patient object
    might have attributes such as condition, date admitted, medication and so on.
    The attribute value of ''condition'' might be ''malaria'' and the attribute value
    of ''date admitted'' might be ''3/1/2012''. Similarly, a car object may store
    information about its model name and price.


    Each object has a set of messages it understands. The action object performs in
    response to a particular message is an example of behaviour. We also use the term
    behaviour to model the collection of actions an object might carry out in response
    to all the messages it understands. An object modelling a patient might need to
    know how to behave in response to messages such as ''take medicine''. The message
    ''take medicine'' might well be sent by a nurse object.


    Although users of a software system cannot interact directly with software objects,
    we can communicate with them via a user interface. Actions such as clicking the
    mouse, or pressing a key on the keyboard, will cause messages to be sent to the
    appropriate objects.


    Sometimes to achieve some end, objects need to collaborate with each other, sometimes
    they need to delegate to others – a bit like teamwork. Using the hospital example
    again, a doctor may send a message to a nurse object requesting it to give medicine
    to a number of patient objects. The nurse object would then in turn send ''take
    medicine'' messages to those patient objects.


    Figure 8 represents a simple view of what is happening inside an oriented program
    when it is running. The ''microscopic view'' in Figure 8 depicts a collection
    of objects sending or receiving messages. Each object is represented by a square.
    To get an object to do something, it must be sent a'
  merge: -1
  pgno: 22
- img_proc: true
  md: '# Introducing objects


    message; messages are depicted as arrows between the objects. When an object sends
    a message to another object, all it needs to know is what behaviour will result
