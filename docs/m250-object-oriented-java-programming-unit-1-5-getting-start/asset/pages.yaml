  md: "# SAQ 10\n\nWrite down the receivers and the arguments of the following message-s.\n\
    \n+   (a) frog1.sameColourAs(frog3);\n(b) frog4.setPosition(3);\n\n# Answer\n\n\
    (a) frog1 is the receiver and frog3 is the argument.\n(b) frog4 is the receiver\
    \ and 3 is the argument.\n\n# Formal argument declaration\n\nSo how does a method\
    \ receive the information it needs? Let us look at the method setPosition() as\
    \ an example.\n\n```\n/**\n * Sets the position of the receiver to the value of\n\
    \ * the argument aPosition;\n */\npublic void setPosition(int aPosition)\n{\n\
    \    this.position = aPosition;\n    this.update(\"position\");\n}\n```\n\nThe\
    \ method header here is\n\n```\npublic void setPosition(int aPosition)\n```\n\n\
    The name of the method is setPosition() and the declaration int aPosition inside\
    \ the parentheses indicates that this method expects an argument.\n\nThe aPosition\
    \ given in the method header is the formal argument (also known as a formal parameter).\
    \ It is always to declare both a name for each formal argument and its type. In\
    \ this case, the formal argument has the identifier aPosition and it is declared\
    \ as being of the primitive type int. The type of a formal argument can also be\
    \ a class, such as String.\n\nWhen setting methods in M250, we typically use the\
    \ convention for formal arguments using the name of the variable they preceded\
    \ by 'a' or 'an'. Hence aPosition is the name of the formal argument for the setPosition()\
    \ method, to be used to assign a value to position. In other kinds of method we\
    \ may name a formal argument for the type of thing it represents (a name, an icon,\
    \ a frog's leg and so on) by the text 'a' or 'an', giving names such as aName,\
    \ aIcon, or aFrogLeg. However, as long as the choice of formal argument name is\
    \ legal and does not conflict with any other names, it will compile. As with any\
    \ other variable name, you should choose a name that is meaningful, readable and\
    \ helpful."
