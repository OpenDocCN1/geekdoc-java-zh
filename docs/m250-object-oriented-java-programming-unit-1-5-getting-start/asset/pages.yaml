    # 2.4 The class method OUDialog.confirm()


    The method confirm() takes a string as an argument, usually a question such as
    ''Do you really want to delete this file?''


    Like alert(), the string argument of confirm() is displayed in a modal dialogue
    box, but instead of OK, there are two buttons, labelled Yes and No.


    For example, execution of


    ```

    OUDialog.confirm("Are you over 16?");

    ```


    results in the dialogue box shown in Figure 6.


    ![](img/3b2a7e20c7b75206410143a99df1dd1c_257_0.png)


    To dismiss the dialogue box, you would click either the Yes button or the No button.
    A confirm dialogue box returns a boolean value. Clicking on Yes returns the value
    true and clicking on No returns the value false. Depending on what value is returned,
    the program can choose between courses of action.


    As with any other boolean value, the result returned by a confirm dialogue can
    be assigned to a boolean variable, as in the following example:


    ```

    boolean answer = OUDialog.confirm("Say yes or no");

    ```


    Note that closing the window without clicking on either button also results in
    an answer of false.'
