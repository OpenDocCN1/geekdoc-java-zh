  md: '# Introduction


    This unit builds upon the object concepts introduced in Unit 1.

    Here we will look at messages in more detail and discuss:


    +   - how every object has an initial state when it is created

    - how an object''s behaviour when it receives a message may depend on its state

    - how some messages need extra information in the form of arguments

    - how some messages change the state of the receiver, while others simply return
    a message answer – often the value of one of the receiver''s attributes

    - object collaboration – how, once an object is sent a message, that object may
    then need to send messages to one or more objects to help it carry out the behaviour
    with that message.


    We also introduce the subclass and subclass relationships between classes, whereby
    an object of a subclass inherits the protocol and attributes of its superclass
    but then the subclass define additional attributes and behaviour for its instances.
    This relationship is central to object-oriented programming and results in robust
    and economical code.


    Much of your work in this unit will involve practical activities and you will
    be using a variety of microworlds from Amphibian Worlds introduced in Unit 1.
    However, in addition to Frog objects, these microworlds are also inhabited by
    FrogFrog and Toad objects.


    In Section 6 you will also use a simple programming tool, called Accounts World,
    which has been developed specifically for this unit and allows you to experiment
    with objects within a different context.


    All the concepts introduced in this unit will be revisited and explored from different
    points of view in subsequent units.


    # SAQ 1


    Based on Unit 1, how would you describe an object?


    Answer


    Unit 1 describes an object as a self-contained unit of software that holds data
    and understands a set of messages that may cause it to perform behaviours such
    as changing state. Each object is able to communicate with other objects via messages.'
  merge: -1
