  md: '# Exercise 11


    A well-known puzzle goes like this: a snail starts at the bottom of a well 10
    metres deep. (Presumably it fell down!) Each night the snail climbs up 3 metres
    to the mouth of the well, but each day it slips back by 2 metres, if it hasn''t
    escaped. How many days will it take the snail to escape from the well?


    Write a loop to simulate this problem. You will need two variables, one to keep
    track of the snail''s height and the other to record the number of days in the
    well. You will also need to check the body of the well loop to see if the snail
    is out of the well yet. If so, it will not slip back 2 metres during the next
    day, because it has escaped.


    # 5.5 Pitfalls with loops


    Just as with statements, looping structures have a statement block that may be
    executed according to the value of some Boolean condition. Some of the comments
    we made about if statements apply to loops as well.


    Leaving out the braces


    If there is only a single statement within the body of a for or while loop, then
    code that leaves the statement block is legal; that is, you can have a single
    statement in the body of a loop without braces around. We advise against this
    because if you later decide to add extra statements to the loop body it is very
    easy to forget to insert the necessary braces.


    # Misplaced semicolons


    If you put a semicolon at the end of the looping structure, the body you executed,
    nothing happens in the loop body! For example, if you write


    ```

    while (condition); //semicolon on end!

    //anything here is not in the loop!

    ```


    ```

    for (initialise; condition; update);

    //semicolon on end!

    //anything here is not in the loop!

    ```


    These examples are equivalent to having a loop whose body is a single, empty statement
    that does nothing.


    # Endless loops


    With loops there is a further danger, which is writing incorrect conditions, or
    failing to update any loop control variables correctly. This may result in loops
    operating for an incorrect number of times or executing endlessly!'
