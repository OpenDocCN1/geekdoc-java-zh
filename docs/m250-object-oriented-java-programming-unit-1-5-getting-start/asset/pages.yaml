  md: '# Appendix 2 Precedence rules


    Table 6 summarises the order of precedence for the operators you have met so far.
    However, it is always better to use parentheses in a complex expression to make
    the order of evaluation clear. This helps the readability of the code that you
    write as well as making it less likely that you will make mistakes with the precedence
    rules.


    In the table the operators in any row all have higher precedence than those in
    the rows below. Apart from the assignment operator, if binary operators of equal
    precedence appear (without parentheses) in succession in an expression they are
    evaluated from left to right.


    Table 6 The precedence of the main operators in Java


    | Purpose of operator | Operator |

    |--- |--- |

    | multiplicative | * / |

    | additive | + - |

    | relational | < > >= |

    | equality | == != |= |

    | logical AND | && |

    | logical OR | || |

    | assignment | = |'
