  md: '# loop


    In programming, a loop is a sequence of statements that is continually repeated
    until some Boolean condition is reached.


    # loop control variable


    A variable used to regulate the number of times a loop such as a for statement
    or while statement is executed; such a variable is typically declared inside a
    for loop''s header or before a while loop.


    # low-level language


    A language written for direct programming of a computer''s hardware. Each type
    of computer hardware needs its own low-level language.


    # member


    Instance variables, instance methods, class variables and class methods can all
    be described as members of a particular class. Class methods and variables are
    explained in Unit 7.


    # message


    A message is a request for an object to do something. The only way to make an
    object doing something is to send it a message. For example, the position of a
    Frog object changes when it is sent the message left() or right(); to obtain information
    on the value of a Frog object''s colour attribute, you send it message getColor().


    # message answer


    When a message is sent to an object, then, depending on what the message is, a
    message answer may be returned. A message answer is a value or an object; it is
    not a message. Sometimes a message answer is used, sometimes it is ignored. A
    message answer may be used subsequently as the receiver or argument of another
    message. Get messages return the value of an attribute, as with the message getColor(),
    which returns a value such as OUCOLOR.GREEN.


    # message expression


    A message-send evaluates to some value, i.e. the message returns a message answer.
    We also say that it returns a value.


    # message name


    The name of a message, including the following parentheses, any arguments. For
    example, the name of the message left() is left(), and the name of the message
    upBy(6) is upBy().


    # message-send


    The code that sends a message to an object – for example, frogl.right(), which
    consists of the receiver by a full stop and then the message.


    # method


    The code that is invoked by the Java Virtual Machine at run-time when an object
    receives a message.


    # method body


    That part of a method enclosed by braces that follows the method header. The body
    of a method is an example of a statement block.'
