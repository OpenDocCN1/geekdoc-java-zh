- img_proc: true
  md: 'On the other hand, in the expression


    17 - (5 - 2)


    it is the 5 - 2 that gets evaluated first giving the value 3 for the second operand
    of the left-hand subtraction, which becomes 17 - 3 giving the value 14.


    If you write such an expression without parentheses, as such 17 - 5 - 2, then
    it might not be clear to a human reader which of the evaluations is meant. In
    fact, there are rules, precedence rules, that determine the order in which things
    are worked out when there are no parentheses to help determine the order. According
    to these rules 17 - 5 - 2 would be worked out as if it were (17 - 5) - 2. You
    can read more about these rules in Appendix 2.


    When an expression is built up using other expressions as its operands we say
    that the operand expressions are sub-expressions of a compound expression. For
    example, in the compound expression


    (3 + 2) * 6


    the left-hand operand to the * operator (3 + 2) is an example of a sub-expression.
    Such sub-expressions can themselves be made up of further sub-expressions, a little
    like Russian dolls; for example, in the compound expression


    4 * (5 + (6 / 2))


    we say that (6 / 2) is nested within the sub-expression (5 + (6 / 2)).


    Such nested expressions should be read from the inside out. So, in this example,
    6 is first divided by 2. Then 5 is added to that result, which is finally multiplied
    by 4.


    More generally, as each nested expression is evaluated, the resulting value is
    used at the next level, so that by the time the outer level is reached the entire
    compound expression will evaluate to a single value.


    There is no limit to the level of nesting; however, it is sensible to limit the
    amount of nesting since if too much nesting is used it can become very difficult
    for a human to interpret the expression. As code becomes less readable it is easier
    to make mistakes.'
