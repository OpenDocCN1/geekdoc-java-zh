  md: 'converts it into the machine code required for that particular computer. So
    any computer with a suitable JVM will be able to execute the bytecode for our
    compiled class Frog.


    When an object receives a message (while a program is running, that is at run-time),
    the JVM selects the appropriate method to be executed (determined by the class
    of the object). We call this invoking the method or method invocation. The first
    time a method is used at run-time, the JVM converts the corresponding bytecode
    into the machine code appropriate for that particular computer.


    Once the bytecode for a method has been translated into machine code, the JVM
    retains the machine code for the next time the method is required, so it does
    not have to do the translation over and over again. If a method is never used
    at run-time, it is never compiled to machine code.


    # A bit of bytecode


    Java programmers almost never have to be concerned with bytecode – the compiler
    and the JVM deal with that side of things. However, purely for interest, here
    is a snippet of bytecode. Can you guess what it is?


    ```

    0: aload_0

    1: aload_0

    2: invokeevirtual #28; //Method getPosition():I

    5: iconst_1

    6: isub

    7: invokeevirtual #27; //Method setPosition:(I)V

    10: return

    ```'
