  md: '# 5 Exploring objects in microworld


    +   - have the same attributes.


    On creation, the objects referenced by the variables frog1 and frog2 each have
    their own set of attributes and their states are the same, i.e. they both have
    the attribute position with value 1, and the attribute colour with GREEN. Each
    object has its own independent copy of these attributes, so that it can remember
    its own individual state, although all new Frog objects are created with identical
    state, the state of any particular frog will get altered during its lifetime when
    it is sent messages as right() or brown(). For example, at a later time, frog1
    may still have a value of 1 for its attribute position, frog2 may have this attribute
    set to 3.


    Note that when talking about objects and classes, as well as saying that the ''object
    referenced by x belongs to class A'', it is also acceptable to use the synonymous
    phrase ''x'' refers to an instance of class A''.


    # SAQ 5


    ''Instances of a given class have the same attributes.'' Explain this statement.


    # Answer


    A class defines what attributes instance of the class will have. For example,
    frog1 and frog2 are instances of class Frog and have the attributes colour and
    position. However, each instance has its own set of attribute values: if the message
    green() is sent to frog1 and the message brown() is sent to frog2, the value of
    the attribute colour is different for each object.


    # 5.3 Grouping messages into a protocol


    The list of messages any instance of the class Frog can understand is called its
    protocol. The protocol of a Frog object, as we know so far, is left(), right(),
    home(), jump(), green(), brown() and crawl().


    # SAQ 6


    Use the terms ''class'' and ''protocol'' to explain why a Frog object does not
    understand the messages up() and down().


    # Answer


    The class defines the set of messages (the protocol) an instance of the class
    understands. Frog objects are instances of class Frog and the protocol for this
    class does not include the messages up() and down().


    # 5.4 Attributes of Frog


    The only attributes a Frog object has in the microworld you have been exploring
    are colour and position. In our example, the values to which these attributes
    are set are shown in Figure 14 and these values constitute the state of a Frog
    object.


