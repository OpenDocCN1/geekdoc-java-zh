  md: "Adding a message to the protocol of an object involves writing a piece of program\
    \ code called a method. Every message must have a corresponding method. For the\
    \ class Frog, whose methods include right(), left() and green(), there are corresponding\
    \ messages right(), left() and green(). Notice that the message and the corresponding\
    \ method have the same name.\n\n# The structure of a method\n\nLet us use the\
    \ message right() as an example. You have already used this part of the protocol\
    \ for Frog with message-sends as kermit.right().\n\nThe method right() - the program\
    \ code that is executed whenever a Frog object is sent the message right() - is\
    \ shown below.\n\n```\npublic void right() {\n    this.setPosition(this.getPosition()\
    \ + 1);\n}\n```\n\nA method consists of a method header and the method body.\n\
    \nThe method header is:\n\n```\npublic void right()\n```\n\nand the method body\
    \ is:\n\n```\n{\n    this.setPosition(this.getPosition() + 1);\n}\n```\n\nNote\
    \ that the braces are part of the method body.\n\nThe method header gives important\
    \ information to the compiler about the method, including its name. We will describe\
    \ the meanings of the different parts of the header shortly.\n\nThe method body\
    \ contains the code that describes what to do when the method is executed.\n\n\
    A method should usually also be preceded by a comment. For the method right()\
    \ the comment is:\n\n```\n/**\n * Increments the position of the receiver by 1.\n\
    \ */\n```\n\nThe compiler will ignore the comment, which is intended for human\
    \ readers; it will compile only the header and body of the method."
  merge: -1
