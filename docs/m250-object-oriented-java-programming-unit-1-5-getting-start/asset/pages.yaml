  md: "# Selection and iteration\n\nanother case. In both branches there is some work\
    \ to be done before the paths are joined again. For this scenario we require a\
    \ second form of if statement, which uses the additional keyword else.\n\nHere\
    \ is some code that will perform the new counting task:\n\n```\n//initial count\
    \ of users 40 and over\nint fortyAndOver = 0;\n```\n\n```\n//initial count of\
    \ users aged under 40\nint underForty = 0;\nString ageString;\nint age;\n```\n\
    \n```\n//get a user's age\nageString = OUDialog.request(\"What is your age?\"\
    );\n```\n\n```\n//convert string to int\nage = Integer.parseInt(ageString);\n\
    ```\n\n```\n//increment the appropriate counter selectively\nif (age >= 40) //true\
    \ or false {\n\nfortyAndOver = fortyAndOver + 1;\n} else //age >= 40 was false\
    \ {\n\nunderForty = underForty + 1;\n}\n```\n\nOnce again, there could have been\
    \ several statements in each block, but in this case we wanted to increment a\
    \ counter in each case. We have again ignored the case where a user cancels the\
    \ dialogue box so that we can concentrate on the simple use of the if statement.\n\
    \nThis second example illustrates the second form of if, which we call the if-then-else\
    \ statement. Again the word 'then' is implied and is never used in Java, but it\
    \ may help you to read the statement using the word 'then'.\n\nThe if-then-else\
    \ statement has the form:\n\n```\nif (condition)\n{\n  //then statements\n}\n\
    else {\n  //else statements\n}\n//any further statements\n```\n\nIf the condition\
    \ evaluates to true, then the first statement block is executed else the condition\
    \ evaluates to false and the second statement block is executed."
