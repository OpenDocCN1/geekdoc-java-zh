  md: '# Iteration


    A very common requirement when you are solving a programming problem is a way
    of causing an action, or group of actions, to be executed repeatedly. The term
    for this is iteration. For example, you may want to:


    +   * query a user for a filename repeatedly until a valid name has been supplied

    * print each item on some kind of list

    * repeatedly adds costs of individual purchases to find a total bill.


    Most programming languages include mechanisms to repeat actions in this way, and
    in this section we will be discussing the two main approaches in Java, for loops
    and while loops, which use the keywords for and while.


    # 5.1 Increment and decrement operators


    A common requirement in situations where loops are used to increment or decrement
    a variable. For example, you might want to write (assuming an integer x).


    ```

    x = x + 1;

    ```


    However, because this is such a common requirement, Java provides a special operator
    to write this in a shorthand way:


    ```

    x--;

    ```


    Similarly, the statement x = x - 1; can be written as:


    ```

    x--;

    ```


    Notice that ++ and -- are being used as postfix operators, as in each case the
    operator appears after the operand x.


