  md: '# Hexadecimal Numbers


    Hexadecimal is the base-16 number system, in which there are 16 unique symbols:
    the digits 0 to 9 and the letters A to F. For example, the number 15 is represented
    as F in the hexadecimal numbering system. One use of the hexadecimal system is
    that it can represent every byte (8 bits) as two consecutive hexadecimal digits.'
