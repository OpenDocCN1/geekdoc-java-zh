  md: 'Note that the declaration of a formal argument is similar to the declaration
    of a variable, and in fact, the JVM will create this variable every time the method
    is executed. The formal argument can be used within the method body and you can
    assume that when it is used it will have initialised using an actual argument,
    as explained below.


    When the message setPosition() is sent to a Frog object the actual argument must
    be compatible with the type of the formal argument in the method header. For example,
    in the message


    ```

    kermit.setPosition(3);

    ```


    the integer 3 is the actual argument for the message and is of type int, the same
    as the formal argument type.


    On receiving the message setPosition(3), the Frog referenced (in this case the
    object referenced by kermit causes the method setPosition() to be executed with
    its formal argument aPosition set to the value of the message''s actual argument,
    in this case 3.


    This is always the case with methods that use arguments in Java: when a message
    is sent, the values of any actual arguments are copied into any formal argument
    variables so that they can be used within the method body. This approach to handling
    of arguments is technically called ''passing by value''. In Java all arguments
    are passed by value.


    After this the update() message is sent to the receiver using the argument "position".
    There is no need to consider how the update() method works, just remember that
    it lets the graphical display know that the frog needs to be redrawn. In this
    case, the String argument "position" informs the display that the frog''s position
    has changed.


