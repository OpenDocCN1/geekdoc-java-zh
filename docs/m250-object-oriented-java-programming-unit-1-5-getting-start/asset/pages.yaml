  md: '# The Millennium Bug


    In the run up to the year 2000 there was much talk of the ''millennium'' or ''Y2K''
    bug. This bug arose because some operating systems and some programming languages
    record time and dates as a number. (Compare this with Java, which has a Date class
    provided in the java.util package.) As time progresses the number gets bigger
    – so a future date is larger than a past date. The Y2K bug arose because programmers
    writing commercial systems in the 1970s and 1980s omitted the century digits from
    dates – such programmers did not think the century digits would be needed! For
    example, COBOL programs represented the date 26 February 1990 as the number 900226,
    and the date 1 January 1991 as 910101, allowing the programs to compare the two
    numbers and correctly assume that the smaller number represented the earlier date.
    However, without century digits, those comparisons would fall apart on 1 January
    2000. The last day of the millennium was 991231, and after the stroke of midnight
    computers would be 1 January 2000 as 000101 – a smaller number than the day before.
    Time would appear to be reversed!


    To avoid this disaster a lot of money was spent paying people to read programs
    line by line, checking how the programs implemented dates, and if need, modifying
    the programs to include century digits. The cost of all this work is estimated
    to have exceeded 400 billion pounds worldwide! If all software had been written
    in an object-oriented language (or at least a language providing encapsulation
    and data hiding) the cost would have been considerably less, as it would have
    been necessary to check only objects implemented dates.


    Encapsulation is a powerful idea whose history is older than object-oriented programming.
    For example, languages as Modula-2 and Pascal implemented similar ideas.


    Finally, note that while objects and classes are a highly developed form of reusable,
    encapsulated component, themselves will generally form parts of larger reusable
    and encapsulated systems.


