  md: "# Reuse of code\n\nSo far in this unit we have introduced techniques that enable\
    \ Java programmers to write code in an object-oriented manner. In this section\
    \ we discuss a major concept in object-oriented programming – reuse of code.\n\
    \nYou have seen that the code for the Frog class includes several methods. Each\
    \ method can be tested to ensure that it conforms to the specification given in\
    \ the method comment. When you add a new method to a class you can reduce some\
    \ of the complexity of the new method, and also make the new method easier to\
    \ maintain, by reusing methods that have already been developed and tested for\
    \ that class.\n\nConsider the method doubleLeft() for the Toad class, which you\
    \ met in Activity 6:\n\n```\n/**\n * Performs the left behaviour twice.\n */\n\
    public void doubleLeft() {\n    this.left();\n    this.left();\n}\n```\n\nAs the\
    \ method name suggests, and as the method comment documents, the intention is\
    \ that the left behaviour is performed twice (as opposed to a move to the left\
    \ a certain number of stones).\n\nAt present, the Toad class defines left() to\
    \ mean changing position by -2, and so doubleLeft() changes the position by -4.\
    \ Because of this, we could instead have written the following code for doubleLeft()\
    \ to achieve the same effect:\n\n```\n/**\n * Moves the receiver left four places.\n\
    \ */\npublic void doubleLeft() {\n    this.setPosition(this.getPosition() - 4);\n\
    }\n```\n\nYou might think this is better, or as good. However, suppose the designers\
    \ of the Toad class changed their minds, as they easily might, and decreed that\
    \ the left() behaviour for toads means changing position by -3. ‘Perform the left\
    \ behaviour twice’ would now mean changing position by -6."
