    expression uses the new keyword together with the Frog constructor; this expression
    evaluates to a reference to a newly created and initialized Frog object.


    We have been careful up to now to point out that a reference variable stores a
    reference to an object, and not the object itself. However, as mentioned earlier,
    programmers will informally blur the distinction between a reference and the object
    it references for the sake of brevity.


