  md: '# Encapsulation


    So far in this unit you have seen how an object contains state (the values of
    its instance variables) and behaviour (defined by its message protocol). This
    is an example of what is termed encapsulation; that is, a parcelling up of related
    data and behaviour into a single entity. Put another way, objects encapsulate
    state and behaviour. The concept of encapsulation is very powerful because it
    allows an efficient division of labour in large software projects. Each team member
    can work on the class(es) he/she is responsible for. All that team members need
    to know about other classes are the names and specifications of their public methods.


    Related to encapsulation is the concept of data hiding, whereby an object''s instance
    variables are hidden so that other objects must use messages to interact with
    that object''s state.


    In this section we explore these ideas further and see how the access modifiers
    private and public are involved in implementing data hiding.


    # 7.1 Access modifiers – public or private


    Instance variables and methods are examples of what are called class members.
    Each instance variable and method is a class member. It is useful to introduce
    this term so that we can talk access modifiers as they apply to both instance
    variables and methods. We can summarise the meaning of the access modifiers private
    and public as follows:


    +   - if a member is declared as private, only code within the class itself can
    directly access it;


    +   - if a member is declared as public, code within any class (and in M250 code
    within the OUWorkspace) can directly access it.


    # Private instance variables and public methods


    It is usual to declare instance variables as private to provide data hiding. The
    internal details of an object''s state are a matter for the programmer of the
    object''s class and should not be unnecessarily exposed to programmers who want
    to use the class, or to objects of other classes that are sending messages to
    instances of the class.


    Methods are declared as public when a programmer wishes to allow the methods to
    have general use for communicating with an object and its internal state. Such
    interactions include discovering values of attributes (using getters), changing
    attributes (using setters) and other methods such as right() in the Frog class
    and getting an object to do useful work (using other kinds of method).


    If we follow these principles for the use of access modifiers, then our Java objects
    exhibit data hiding. Figure 6 illustrates the concepts of encapsulation and data
    hiding.'
