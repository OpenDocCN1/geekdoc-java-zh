  md: '# Discussion


    You should have identified setPosition() as the only other method that sets an
    instance variable directly, using assignment.(Note that although the constructor
    also assigns values to the instance variables, constructors are not methods.)


    # Setter methods


    Methods that directly access and set values of instance variables, such as setPosition()
    and setColor(), are called setter methods or setters (also sometimes known as
    mutator methods).


    You will notice that setColor assigned a value to the instance variable called
    colour, and setPosition() assigned a value to the instance variable called position.
    This method naming is typical: a setter''s name is usually formed from the word
    set by the name of the instance variable (with its initial letter capitalised)
    to which it assigns a value. This method naming is purely a convention, but it
    is one that is strictly adhered to by Java programmers (setter and getter methods
    in a certain type of class called a JavaBean, which lies outside the scope of
    M250, must follow the conventions outlined here).


    As they need to set an instance variable to some value, setter methods also typically
    receive a single argument. The ability to receive a value in this way is indicated
    in the setter method''s header; for example, by the text aPosition in the case
    of setPosition().(Arguments are discussed in more detail in Section 5.)


    Note that while other methods in a class can also be written that directly set
    instance variables, we do not recommend this, and in M250 we will normally allow
    only setter methods and constructors to create instance variables.


    # Getter methods


    We often require methods, called getter methods or getters (also sometimes called
    accessor methods), to facilitate the discovery of the values of instance variables
    – these methods will also directly access instance variables.


    In the case of the Frog class, we have a getter getColor(), whose purpose is to
    return the colour of the Frog that receives the message.


    Getter methods also follow a simple naming convention: they normally begin with
    the word get, and that followed by the name of the instance variable whose value
    they return. If the variable in question is a Boolean, the getter conventionally
    begins with the word is. For example, isHappy() could be used as a getter for
    a Boolean variable called happy. This is merely to provide more readable code:
    kermit.isHappy() is more readable and informative than kermit.getHappy().'
