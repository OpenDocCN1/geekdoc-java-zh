  md: '# automatic type conversion


    Where the Java compiler converts a value of some type to another type without
    the need for any explicit conversion of type on the part of the programmer. Automatic
    type conversion occurs in certain contexts, such as in an assignment statement
    when a compatible type on the right-hand side of the assignment is converted to
    the type of the variable on the left-hand side of the assignment.


    # behaviour


    A term used to describe the way in which an object behaves in response to the
    messages in its protocol.


    # binary digit


    Either of the two digits 0 and 1 in the binary number system. Binary digits are
    used for the internal representation of numbers, characters and instructions.
    The binary digit is the smallest unit of storage.


    # binary operator


    An operator that has two operands.


    # bit


    An abbreviation of binary digit.


    # block


    See statement block.


    # body


    Another word for a statement block; for example, the body of a while loop is a
    statement block.


    # Boolean condition


    A Boolean expression used to control the conditional execution of a statement
    block.


    # Boolean expression


    An expression that evaluates to either true or false.


    # Boolean operator


    An operator used to combine simple Boolean expressions to form more complex Boolean
    expressions, which in turn can be combined with other Boolean expressions. They
    are also known as logical operators.


    # bytecode


    Bytecode is the intermediate code produced by the Java compiler. compilation is
    done when the button is pressed. This will create a bytecode file, for example,
    Frog.class, from the source file Frog.java. The bytecode file is portable because
    each computer that can run Java programs has a Java Virtual Machine that understands
    bytecode and converts it into the machine code required for that particular computer.
    Bytecode is so-called because its instructions are a byte in size.


    # casting


    The prefixing of a value by name of a type in parentheses in order to convert
    a copy of that value into a different type. For example, (int) 99.0 casts the
    value 99.0 into an int value.'
