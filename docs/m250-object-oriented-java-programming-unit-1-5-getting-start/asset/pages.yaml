  md: "# Selection and iteration\n\nThe statement consists of all the code from the\
    \ word if up to the closing curly brace. This statement ensures that\n\n```\n\
    fortyAndOver = fortyAndOver + 1;\n```\n\nwill be executed only if the value of\
    \ age is 40 or greater, in other words, if the expression age >= 40 evaluates\
    \ to true. There could have more than one statement executed as a result of testing\
    \ the condition age >= 40, but in this case there was just one thing we wanted\
    \ to.\n\nIf the expression age >= 40 evaluates to false then the code underneath\
    \ if the curly braces will not be performed. This gives us the branching behaviour\
    \ we are looking for.\n\nAn statement always works this way: the expression in,\
    \ the parentheses after the word must evaluate to true or false and so there are\
    \ just two paths the code may follow:\n\n+   into the code in curly braces after\
    \ the word if and then to any code that follows that, or\n\n+   straight to any\
    \ code after the closing curly brace of the if.\n\nAfter if the statement program\
    \ continues as normal - it just goes to whatever comes next, which we called ‘further\
    \ statements’ in the flow chart. At this point the two possible paths of execution\
    \ have been reunited.\n\nWe ignored the possibility that the user might have pressed\
    \ Cancel in response to the request() dialogue, to keep things simple. You will\
    \ see a way of handling that case later in unit. We also have not dealt with we\
    \ might use this code to query the ages of more than one user: in practice we\
    \ would need to execute the code after the comment //get a user's age repeatedly\
    \ for a number of users, but we would not reset the counter fortyAndOver to 0\
    \ each time.\n\n# If-then statements\n\nThere is more than one kind of statement.\
    \ The form of statement illustrated above is called an if-then or just an if-statement.\
    \ Its general form is:\n\n```\nif (condition)\n{\n  //then statements\n  //any\
    \ further statements\n```\n\nAlthough the word then is not used in Java, you might\
    \ find it helpful to read the statement in your head using the word ‘then’; for\
    \ example, you might read the above code as if the condition is true then executes\
    \ the statements in the block of code’.\n\nThe condition must be a Boolean expression\
    \ so that it evaluates to true or false. A Boolean expression used in this way\
    \ is termed a Boolean condition, or simply a condition."
