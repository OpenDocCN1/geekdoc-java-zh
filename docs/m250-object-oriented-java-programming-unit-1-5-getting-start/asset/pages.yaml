  md: '# Classes as software components


    Now that you have had a chance to discover some of the characteristics of objects,
    it is a good time to consider why object technology has become so important to
    the software industry.


    When forming a new product in traditional industries, such as car manufacturing,
    the designer no longer designs a unique, handcrafted artefact-down to individual
    nuts and bolts. The designer can take advantage of ready-made sub-assemblies (components):
    for example, a gearbox from Honda, an engine from Mazda, a fuel injection system
    from Bosch, suspension from Lotus and a body shell from Pininfarina. All these
    companies will have ensured that the fixing brackets for their products are of
    a standard size and that they have pre-drilled to accept standard size nuts and
    bolts.


    Until the early 1990s, although the software industry introduced libraries containing
    standard software routines (such as numerical algorithms libraries), such libraries
    had limited, specialised uses and many parts of an application or system were
    developed from scratch. More recently, software components have been produced
    in a similar fashion to car components, with the aim of reuse. The same reliable,
    reusable software components have been incorporated into many completely new systems,
    saving the considerable time and effort it can take to generate new software.
    These possibilities have been brought about by object technology.


    A growing part of the software industry is now focused on the production of generally
    useful software components (and at the other end of the scale, highly specialised
    software components) that can then be bought by other developers to speed the
    development of their own applications (by avoiding reinventing the wheel!). For
    example, if a company were to write a system for an online shop, it is very unlikely
    that they would write all the code from scratch. It is more likely they would
    buy a database component from one vendor andand sale component for secure payment
    transactions from another vendor.


    The reason why this is possible is that objects are relatively self-contained
    units of software that can be tested and proved to be robust and reliable. In
    the context of object-oriented programming, a software component is a class, or
    more likely, a closely related group of classes. (Note that the class is not the
    object; what you ''buy'' as a component is the code for constructing and using
    instances of a class, not the instances themselves).


    The concept of software components has led to the possibility of replaceable parts
    for systems - not just for replacing faulty components with correct versions,
    but for replacing limited components with more flexible ones. For example, imagine
    a photo image processing package. If the relevant component were to accept only
    JPEG format, but you wanted to process TIFF format files, it would be helpful
    to replace the original limited component with one that accepted that format (and
    maybe others). This is entirely possible so long as the classes in the new component
    objects'
