  md: '# Method comments


    Our method comments begin with an opening forward slash followed by asterisks
    (**) and end with a closing asterisk and forward slash (*). This form of comment
    (really a special form of multi-line comment - see below) is called a Javadoc
    comment, and it allows web page documentation for the method to be created automatically
    (as you will see in Section 2.3).


    There are two other forms of comment a programmer can write, which will not appear
    in the web page documentation.


    +   - Within the method body, end-of-line comments are sometimes used to explain
    what is intended by a section of code. They start with a double forward slash
    (/) and continue until the end of the line on which they may begin after some
    code on the same line, or by a line by themselves.

    - You can also write a multi-line comment in the symbols /* and */. The syntactic
    difference between an ordinary multi-line comment and a Javadoc comment is that
    the latter has two asterisks at its start.


    # The method header


    The method header has three parts:


    +   1. The first is the access modifier; it tells the Java compiler what all groups
    of objects can send the corresponding message. For now, all the methods we use
    will be declared public, which means that objects of any class may send the corresponding
    message to objects of the class defining the method (including you, from the OU!).n2.
    The second word in the method header tells the Java compiler the type of the value
    returned, if any, when the method is used. The methods we consider in this section
    return no value, which is indicated by the keyword void termed pseudo-type: it
    is used in some circumstances where type information is required, there are no
    values of this type.

    3. The final word is the name of the method, in this case right, followed by parentheses.
    In some methods there will be extra information between the parentheses, but for
    now all you need to remember is that you must put the parentheses after the name
    of the method.


    # The method body


    A method body is a block of code enclosed between braces, containing one or more
    Java statements, each ending with a semicolon. These statements comprise the code
    that is executed whenever the corresponding message is sent to an object of the
    class. We say that when a message is sent to an object, the corresponding method
    of the same name is executed (or ''invoked''). Notice that there is no semicolon
    after the method body.


    The keyword this is used when there is a need to refer to the object that is executing
    the method and is an expression; it evaluates an object reference. You may find
    it helpful to think of this as meaning ''me'' or ''myself''.'
