    type, and how values are assigned to them using assignmentment statements (which
    themselves might involve either simple or complex expressions).


    We now need to look at the restrictions that declaring a variable as a given data
    type places on the values that can be assigned to that variable and what happens
    if we attempt to break these restrictions.


    # 4.1 Compatibility of primitive types


    You might think that if a variable has been declared to be of a certain type,
    then only values of that type can be assigned to it. However, as you have seen,
    for operators like + it is not necessary for both operands to be of the same type;
    for example, you can use + to add two numbers of different types (an int and double),
    and you can also use + to concatenate a String object with a value of any type.
    Similarly with assignment, you will find that it is sometimes possible to assign
    a value to a variable that is of a different type to the variable''s declared
    type. In the next few activities you will investigate what is possible.


    We will restrict ourselves to the types int and double, but there are similar
    rules that apply to the other primitive types we discussed in Subsection 2.1.


