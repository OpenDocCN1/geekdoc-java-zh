  md: '# Conditions and selection


    As we have seen, dialogue boxes allow input to be acquired from a user. This is
    one example of how a program may obtain input, and for any such input we may need
    to perform one action or another, depending on the precise value the program received.
    For example, we may want to ask one of questions to users of our program who voted
    for the Labour party, and another set of questions to those who voted for the
    Green party. Alternatively, we may wish to show a video only to users who are
    18 or older. In both cases we need to make a decision about what the program code
    does based on some value the program ''knows''.


    This ''branching'' of program behaviour into alternate routes, termed selection
    (or conditional selection), is a very common requirement. Almost all programming
    languages provide special keywords to deal with this case, and Java is no exception.


    # 3.1 if statements with simple conditions


    In Java (and many other languages) the keyword used to implement selection is
    if; thus if statements are statements that allow a program to perform either one
    or another action depending on some condition.


    Imagine we are conducting a survey and we are asked to keep a count of how many
    people were of age 40 and older. To do this we will need to query each user about
    their age, and then count how many users said they were aged 40 or more. This
    is a branching situation – in one case we count, and in another we don''t, depending
    on whether each user said they were over 40 or not. Figure 12 represents this
    branching in the form of a flow chart.


    The branch is shown in a flow chart using a diamond symbol – but don''t worry
    about that; the diagram is just a visual aid and you don''t have to worry how
    to draw it. What you need to remember is that you implement the branch using an
    if statement.


    If the age is high enough, we increment a counter; if not, we just carry on. Notice
