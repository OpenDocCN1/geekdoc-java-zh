  md: "# Exercise 2\n\nTaking the above example as a guide, write code that uses UDialog.confirm()\
    \ to produce a dialogue box containing the text 'Click a button' and returns to\
    \ the user which button they selected. (You may find it useful to introduce local\
    \ variables to store intermediate results as shown above.)\n\n# 3.2 Pitfalls with\
    \ if statements\n\nIt is easy to make minor errors in if statements that lead\
    \ to confusing results, but if you are aware of these pitfalls, you can avoid\
    \ them.\n\n# Not using a statement block\n\nIn the examples so far we have always\
    \ used a statement block to write an statement's body. In fact, it is permissible\
    \ to leave the braces out in cases where there is just one statement to select\
    \ for execution. However, failing to use a block can lead to bugs that are hard\
    \ to detect.\n\nFor example, assuming the following local variable declaration\
    \ and initialisation:\n\n```\nint fortyAndOver = 0;\n```\n\nsuppose that the following\
    \ if-then statement was written, without a statement block:\n\n```\nif (UDialog.confirm(\"\
    Are you 40 or over?\"))\n    fortyAndOver = fortyAndOver + 1;\n```\n\nSince no\
    \ statement block was used, the body of the if statement is simply the line of\
    \ code\n\n```\nfortyAndOver = fortyAndOver + 1;\n```\n\nThis all compiles correctly\
    \ and achieves the same effect as the following code:\n\n```\nif (UDialog.confirm(\"\
    Are you 40 or over?\"))\n    fortyAndOver = fortyAndOver + 1;\n\n```\n\nNow imagine\
    \ that, having used the original code fragment that does not use a statement block,\
    \ at some time later the programmer decides it would be a nice gesture to display\
    \ the string \"Life begins at forty\" whenever the person is forty or over. So\
    \ an extra line of code is added:\n\n```\nif (UDialog.confirm(\"Are you 40 or\
    \ over?\"))\n    fortyAndOver = fortyAndOver + 1;\nUDialog.alert(\"Life begins\
    \ at forty\");\n```\n\nTo the programmer's surprise, when the code is run, the\
    \ message 'Life begins at forty' is displayed for everyone, regardless of which\
    \ button is pushed in the"
