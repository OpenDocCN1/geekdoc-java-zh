  md: '# Introduction


    In everyday life you often come across statements such as:


    If it is raining then we go to work by car; otherwise we walk.


    This is called conditional selection. It says that if something is true then we
    will do one thing else we will do another thing. The condition used here is whether
    or not it is raining.


    The need to make similar decisions decisions occurs frequently in computer programs.
    For instance, you might be prompted for confirmation that you wish to proceed
    with an action, such as deleting a file. Your response – whether you click the
    OK button or not will determine what the program does. Or, as another example,
    you might wish to withdraw money from a cash machine. The banking system must
    decide whether to meet your request or not, based on whether you have enough funds
    in the account.


    You can tell that these kinds of choice will occur in all but the simplest programs
    and so selection is a fundamental structure in all programming.


    In software, choices between one action or like those described above are decided
    using conditions that evaluate to Boolean values, either true or false. that is,
    what code is executed – will depend on this value.


    A second fundamental programming structure is one that results in repetition,
    also called iteration or looping. Like conditional selection, repetition is also
    common in everyday life. For example, we might want to print out 50 copies of
    a document, or we might want to keep serving customers while there are still people
    waiting in a queue.


    Note that when to stop repeating an action such as printing out a document or
    serving customers depends on a condition. In the first case, the condition is
    whether the number of copies has reached 50. In the second case it is whether
    or not there are any customers in the queue.


    The main focus of this unit is to describe how to perform selection and iteration
    in Java. We will also introduce a new kind of method called a class method and
    a useful graphical component called a dialogue box. Dialogue boxes are a common,
    and familiar, way for a program to interact with a user. Since we will use them
    throughout Unit 5 we will begin looking at dialogue boxes.'
  merge: -1
