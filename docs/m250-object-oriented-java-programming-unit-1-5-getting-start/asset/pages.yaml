    # SAQ 2


    What is the difference between the attributes of an object and the state of an
    object?


    # Answer


    Attributes describe the kind of information that can be determined about an object.
    The state of an object is the particular data held by all the attributes at a
    given time; that is, the attribute values. For example, a bicycle object may have
    the attributes manufacturer and size; its state is described by the values of
    these attributes – perhaps Raleigh and 21.'
