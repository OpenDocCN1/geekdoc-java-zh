  md: "Particularly with while loops you can easily write code that repeats endlessly\
    \ if you forget to change the variable that loop condition is testing, or change\
    \ it in the wrong way. The condition may always be true and, if so, the loop will\
    \ carry on repeating forever. Here is an example:\n\n```\nwhile (kermit.getPosition()\
    \ != 6)\n  kermit.right();\n  kermit.right();\n```\n\nBut what will happen if\
    \ kermit sets off from stone 1? Since it is moved two steps at a time, after the\
    \ loop body is executed it will be on stone 3, then stone 5, and so on, kermit\
    \ will not be on stone 6! The expression (kermit.getPosition() != 6) will therefore\
    \ always be true, and the frog will continue moving two steps right forever. This\
    \ is not what was intended.\n\nIf you encounter this situation in the OU/Workspace,\
    \ you can choose Reset OUWorkspace from the Action menu to terminate the loop.\n\
    \nOn the other hand there can be situations where we actually require a program\
    \ to run forever. In Java a common way of coding this is:\n\n```\nwhile (true)\n\
    ```\n\nWhen the test expression true is evaluated the result is invariably true,\
    \ so the loop will run endlessly. For instance, an airline reservation system\
    \ might be intended to run for 24 hours a day without stopping and use a true\
    \ condition.\n\nNote that the OUWorkspace will not allow you to use the condition\
