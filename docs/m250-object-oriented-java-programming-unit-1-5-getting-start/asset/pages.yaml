  md: "When either the then or the else statement block has been executed, the flow\
    \ of program control will pass on to any code that follows the if-then-else statement.\
    \ At that point the two possible paths are reunited.\n\n# Another if-then-else\
    \ example\n\nThis example uses an if-then-else statement in combination with both\
    \ input from the user and output to the user. We give two versions: the only difference\
    \ is that the first version makes use of local variables to store intermediate\
    \ results, whereas the second version does not.\n\nIn this example we ask a user\
    \ 'two' and make four ' using a confirm() dialogue. The confirm() returns a boolean\
    \ value, which, in the case of the first version, is stored in the variable yesClicked.\
    \ If the user clicks yes then yesClicked will be set to true, and if the user\
    \ clicks no then yesClicked will be set to false.\n\nWe then use the value of\
    \ yesClicked to perform one action or give some feedback to the user using an\
    \ alert() dialogue that tells them whether they are right or wrong. The variable\
    \ yesClicked is already of an type for use in an if statement as it is a (simple)\
    \ Boolean expression.\n\n# First version (local variables store intermediate values)\n\
    \nboolean yesClicked;\nString output;\n\n```\nyesClicked = OUDialog.confirm(\"\
    Does two and make four?\");\nif (yesClicked) {\n    output = \"right.\";\n} else\
    \ {\n    output = \"wrong.\";\n}\n```\n\nIn the second version of the code the\
    \ condition is supplied directly by the value returned by the confirm() dialogue.\n\
    \n# Second version (no local variables used)\n\n```\nif (UDialog.confirm(\"Does\
    \ two and make four?\")) {\n    UDialog.alert(\"You are right.\");\n} else {\n\
    \    UDialog.alert(\"You are wrong.\");\n}\n```"
