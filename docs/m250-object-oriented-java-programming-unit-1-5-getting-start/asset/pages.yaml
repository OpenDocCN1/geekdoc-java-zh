  md: '# Summary


    # Variables and types


    +   - Data is stored in named memory locations. These named memory locations are
    called variables because they can contain different values, at different times,
    during the execution of a program. Variable names must follow the rules for Java
    identifiers.


    +   - A type is a set of values and the set of operations that are permitted on
    those values. Java has two very different kinds of type – primitive data types
    and reference types (classes).


    +   - Primitive variables hold values of primitive data types. Reference type
    variables hold references to instances of classes (objects) – we say they reference
    objects.


    +   - Variables are declared to be of a particular type and can only be assigned
    values of a compatible type.


    +   - Assignment is a process whereby the value of an expression on the right-hand
    side of the assignment is copied to the left-hand side. This does not change the
    types of the variables or objects involved.


    +   - A reference variable can only reference a single object at any time, but
    many variables can reference the same object. Variable reference diagrams can
    be useful for visualising a series of assignments.


    +   - An object does not know what variables it is referenced by. Objects whose
    references are not held by any reference variables are garbage collected (destroyed)
    by the Java Virtual Machine.


    +   - A reference variable can reference an object of the reference variable''s
    type, or a subclass of that type.


    +   - Any changes to the state of an object referenced by more than one reference
    variable can be seen using any of those reference variables.


    +   - Primitive data types can be considered as general-purpose data types from
    which objects are built.


    +   - In Java, any sequence of characters enclosed in double quotes is an instance
    of the class `String`. The individual characters in a string are values of the
    primitive type `char`.


    # Expressions


    +   - Expressions are a way of performing work in a Java program. Among other
    things, expressions are used to compute values and to help control the execution
    flow of a program. The job of an expression is twofold: to perform the computation
    indicated by the elements of the expression and to return some value that is the
    result of the computation.'
  merge: -1
  pgno: 156
