  md: '# # Glossary


    The definitions in this glossary are written assuming that you have completed
    Units 1–5.


    access modifier


    A keyword that controls the visibility of class members to objects of other classes.
    The modifiers `private` and `public` are the most frequently used access modifiers.


    accessor message


    Another name for a `getter` method.


    accessor method


    Another name for a `getter` method.


    actual argument


    An actual argument is a value used in a message that is copied to a formal argument
    for use inside the corresponding method. Actual arguments must be of a compatible
    type with their corresponding formal arguments.


    application domain


    See problem domain.


    argument


    See actual argument and formal argument.


    assign


    See assignment.


    assignment


    Assignment is the process that results in the variable on the left-hand side of
    the `assignment operator` receiving a copy of the value on the right-hand side
    of the assignment operator. The value may be a primitive value or a reference
    to an object. The right-hand side of the assignment operator is an expression,
    it is evaluated first.


    assignment operator


    An operator (`=`) used to assign a value to a variable in an assignment statement.


    assignment statement


    A statement that assigns a particular value to a variable (see `assignment`).


    attribute


    Some property or characteristic of an object that can be accessed using a getter
    method. Attributes are generally implemented by instance variables. Examples of
    such attributes are `position` and `colour` for `Frog` objects, and `balance`
    and `holder` for `Account` objects.


    attribute value


    The current value of an attribute, often the same as an instance variable value,
    but possibly computed using instance variables.'
  merge: -1
