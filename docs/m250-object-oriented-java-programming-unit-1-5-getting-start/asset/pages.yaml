  md: '# Activity 14


    In the Accounts World, make sure you have two Account objects referenced by the
    variables myAccount and herAccount; if you do not have them, create them. Ensure
    that myAccount has a balance of at least 400. Then execute the following two statements
    one at a time in the Code Pane, and inspect the objects to look at the resulting
    state of affairs.


    ```

    myAccount.debit(400);

    herAccount.credit(400);

    ```


    # Discussion


    The effect on the final state of the objects is exactly the same as sending a
    single message transfer(herAccount, 400) to the object referenced by myAccount,
    requesting it to take responsibility for the whole transfer. We studied this in
    Exercise 4.


    Whilst Exercise 4 may seem little like a game, it is in fact an accurate description
    of how an Account discharges its responsibility of responding to a transfer()
    message when there are sufficient funds for the transfer.


    The receipt of the transfer() message results in the Account object, which is
    the receiver, sending two messages (without any human intervention).


    +   1. The receiver sends a debit() to itself. The argument to debit() is the
    amount specified as the second argument of the transfer() message.


    +   2. The sends a credit() message to the Account object that is specified in
    the first argument of the transfer() message. The argument to credit() is the
    same amount that was specified in the second argument in the original transfer()
    message and used in the debit() of step 1.


    This is an example of an object discharging its responsibility by collaborating
    with other objects by sending them messages.


