  md: '# A review of Boolean operators


    So far all our conditions have either taken a Boolean value returned by a dialogue
    box and used it directly, or involved a limited range of comparisons, such as
    whether two things were equal, or whether one was greater than another.


    To write more complex conditions you also need to be able to combine two or more
    Boolean expressions into a single condition that can be evaluated to true or false.
    For example, you might want to provide a user with a login and password on a website
    only if they have provided all the required personal data and ticked a box that
    they agree to some terms and conditions.


    In this section we will be reviewing the equality, relational and logical operators
    you met in Unit 3 and will also explain a bit more about how operators work.


    You will recall that Java has a number of comparison operators that can be applied
    to primitive data types (see Table 2).


    # Table 2 Comparison operators


    | Equality operators | == | equal to |

    | | != | not equal to |

    | Relational operators | < | less than |

    | | <= | less than or equal to |

    | | > | greater than |

    | | >= | greater than or equal to |


    Remember that the operators == and != can also be applied to reference variables,
    in which case they test whether two variables reference the same object or not.
    We have seen that you can also use the literal null with these operators to see
    whether a reference is actually referencing an object.


    We have also mentioned the use of equals() messages with String objects. This
    gives a way of testing if two strings are ‘the same’ in the sense of representing
    an identical sequence of characters in the same order, even though the String
    objects concerned may be stored in different locations in memory and so be different
    objects.'
