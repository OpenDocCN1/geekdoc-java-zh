  md: '# Summary


    After studying this unit you should understand the following ideas.


    +   - The values of an object''s attributes constitute its state.

    - An object''s behaviour is determined by how it responds to the messages it understands
    (its protocol).

    - The behaviour of an object in response to a message may be dependent on its
    state. An example of such state-dependent behaviour is the behaviour exhibited
    by HoverFrog objects when sent the upBy() message.

    - Objects are organised into classes. Objects belonging to the same class (instances
    of the class) have the same set of attributes and understand the same set of messages,
    responding to each message in an identical (but often state-dependent) manner.
    Classes can be thought of as templates (blueprints) for creating objects.

    - When an object is created it has an initial state (its attributes have initial
    values).

    - A class may have subclasses. An instance of a subclass has the attributes and
    protocol of the parent class (the superclass), but the subclass may add to them.

    - A subclass may modify the response to a particular inherited message so that
    instance of the subclass will respond to that message in a different way to an
    instance of the superclass.

    - It is common for instances of unrelated classes to have the same message in
    their protocol and instances of those classes may or not respond differently to
    that message.

    - Messages may return a message answer, and/or change the state of a receiver,
    or neither. For example, the message getColor() merely returns the colour of the
    receiver whereas setColor() changes the value of the colour attribute. In the
    protocol of Frog objects jump() neither changes the object''s state nor returns
    a message.

    - Some messages require arguments – extra information that is required for the
    message to make sense. For example, the setPosition() message requires an integer
    argument specifying what position the receiver should move to, as in the following
    message-send: frog.setPosition(5).

    - It is common for the protocol of an object to include pairs of messages to access
    each of its attributes. For example, in the protocol of Frog objects the message
    getColor() returns the value of the receiver’s colour attribute, and setColor()
    sets (changes) the receiver’s colour attribute.'
  merge: -1
  pgno: 87
