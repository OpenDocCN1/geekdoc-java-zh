    # SAQ 9


    Why are the components of a domestic electrical system (such as plugs and light
    bulbs) a suitable analogy for the ideal software industry?


    # Answer


    It is a suitable analogy because the domestic electrical system depends on standard
    parts; you can exchange different makes of each component, such as a plug or a
    bulb (at least within one country), and the system will still work. As long as
    each component works as intended, its make is irrelevant.'
