  md: "# Selection iteration\n\n+   * The initialise section typically declares and\
    \ initialises a variable, which we call the loop control variable.\n* The condition\
    \ section contains a Boolean expression; that is, something that can be evaluated\
    \ to true or false. It is also called the termination condition, when it evaluates\
    \ to false, the loop terminates.\n* The update section normally updates the variable\
    \ declared in the initialisation section; typically it increments or decrements\
    \ the loop control variable.\n\nThe sequence initialise; condition; update must\
    \ be enclosed in parentheses, otherwise the compiler will report an error in the\
    \ loop control section. Notice also that there must be semicolons separating the\
    \ three parts of the loop. The for statement block – often called the body of\
    \ the loop – contains any statements that may be executed by the loop.\n\nWhen\
    \ the loop is executed the following steps occur, in the following order:\n\n\
    +   * Step 1 The initialise section is executed.\n* Step 2 The expression in the\
    \ condition section is evaluated.\n* Step 3\n    * If the condition evaluates\
    \ to false, the program flow moves on to the code after the loop body (any further\
    \ statements)\n    * If the condition evaluates to true, the statement block is\
    \ executed, and then\n    * Step 4 The update section is executed, and the flow\
    \ returns to step 2.\n\nThe statement block will be executed as many times as\
    \ the condition evaluates to true. It is possible that in some cases the condition\
    \ will be false when step 2 is reached for the first time; if so, the loop will\
    \ stop immediately and the statement block will never be executed. When the iteration\
    \ terminates, the flow of program execution will pass on to whatever code follows\
    \ the statement block.\n\n# Tracing for a loop\n\nLet us see how the steps work\
    \ out for the following example, in which we want to send the messages right()\
    \ and croak() to the Frog object referenced by bart three times.\n\n```\nfor (int\
