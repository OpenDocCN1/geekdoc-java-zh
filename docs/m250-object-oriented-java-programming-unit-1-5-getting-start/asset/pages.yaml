    # mutator method


    Another name for a setter method.


    # new


    A keyword used to create an object – used in conjunction with constructor.


    # object


    An instance of a class. An object has both state, represented by its attributes
    and behaviour, and its responses to the set of messages it understands (its protocol).
    An object models a part of a solution to a software problem.


    # object diagram


    An object diagram represents an object. It shows the class of the object, its
    state in terms of attribute values, and its protocol.


    # object initialisation


    The state of an object when it is first created depends on its initialisation,
    a process whereby its instance variables are set to known values. This initialisation
    is usually carried out by the constructor in the object''s class.'
