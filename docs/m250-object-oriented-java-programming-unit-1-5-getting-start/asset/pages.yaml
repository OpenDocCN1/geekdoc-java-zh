    # 4.2 Compatibility of class types


    The previous subsection involved only values of primitive data types being assigned
    to primitive type variables. In this subsection you will use the Frog and HoverFrog
    classes to investigate assignment using reference type variables and objects.


    Just as with other assignment, assignment involving reference type variables involves
    a value being copied from the right-hand side of the assignment to the left-hand
    side. However, in this case the value copied is a reference. As a result, it is
    quite possible that many reference variables can contain a reference referring
    to the same object, even though each has its own copy of that reference.


    There are also rules for compatibility of reference types. You cannot arbitrarily
    assign a reference to an object of some type to a reference variable of another
    type: sometimes the operation is legal, sometimes not.


