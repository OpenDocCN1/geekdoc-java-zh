  md: '+   * Expressions are built using operands and operators.

    * Sub-expressions can be combined using parentheses to create compound expressions
    that evaluate to a single value.

    * A message that returns a message answer is called a message expression.


    # Objects


    +   * Objects are created by using the keyword `new` and a constructor.

    * Every object has an associated textual (string) description. The default description
    gives the class and memory address of the object. A programmer may choose to provide
    a fuller description for instances of some classes.

    * All objects understand the message `toString()`, which returns the textual representation
    of the receiver.

    * A compilation error will result if you compile a message-send where the message
    is not in the protocol of the object reference type.


    # BlueJ and the OUWorkspace


    +   * BlueJ encompasses a programming language, a library of classes and a development
    environment. All commercial development systems systems contain these three parts.

    * The OUWorkspace is a tool (integrated into BlueJ) that enables the writing and
    testing of code in a quick and convenient way.

    * The `Display Pane` is used to display output from executing your code, including
    the value of the last expression evaluated (when `Show Results` is checked). If
    your code does not compile, the `Display Pane` displays a compiler error message.
    You may also see an error message (exception) resulting from executing your code.'
