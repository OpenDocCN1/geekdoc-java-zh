    # Parentheses and precedence


    When you use one expression as an operand in another expression, it is sensible
    to enclose the expression being used as an operand in parentheses (round brackets)
    unless it is a simple literal or variable. This will avoid misunderstanding about
    which part of the expression should be evaluated first. For example, to evaluate
    the expression


    ```

    (17 - 5) - 2

    ```


    we first evaluate 17 - 5 to obtain 12; this is then the value of the first operand
    for the right-hand subtraction, which becomes 12 - 2, giving the value 10.'
