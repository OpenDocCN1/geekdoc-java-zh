  md: '# Object technology


    Commercial programs are large: very, very large. They typically consist of hundreds
    of thousands of lines of code, millions of lines. All complex systems, whether
    or not they involve computers, need to be organised in such a way that human can
    comprehend and deal with them. Comprehension is greatly aided if it is possible
    to view a complex system as being made up of simpler parts interact within an
    overall structure. Throughout the history of software development there has been
    an active search for useful structuring techniques and for programming languages
    that support such techniques.


    This section describes one structured approach to programming that uses collections
    of communicating objects to build a more complex whole – object-oriented programming.
    After briefly looking at the shortcomings of procedural programming, we provide
    an overview of object-oriented programming and introduce some of the terminology
    used in the area.


    # 3.1 Procedural programming


    To put object-oriented technology in context it is useful for us to look at what
    went before. Before object-orientation the predominant method for structuring
    programs was procedural programming. Procedural programming is so called because
    the program code gives a step-by-step procedure (a set of instructions that accomplish
    a task i.e. an algorithm) for solving ‘the problem''.


    When designing a procedural program the programmer will usually break down the
    problem in a top-down manner (Figure 6). An overall algorithm will be specified
    which will be successively refined into smaller steps. This design methodology
    typically yields the structure of a main program, involving a number of calls
    to smaller procedures or function calls, which can in turn call further functions
    or procedures (a function is a procedure that returns a value).'
  merge: -1
  pgno: 20
- img_proc: true
  md: '# Unit I Introducing objects


    ![](img/3b2a7e20c7b75206410143a99df1dd1c_21_0.png)


    Figure 6 The structure of a procedural program


    In such a design, data is placed into separate structures (called data structures).
    Often this data may be visible to, and able to be accessed by, every function
    or procedure in the whole program. In such a situation, where the data is said
    to be ''global'', each function/procedure is able to change the data (Figure 7).


    ![](img/3b2a7e20c7b75206410143a99df1dd1c_21_1.png)


    Figure 7 Procedures accessing global data


    The ramification of data being global is that if a change is made to its data
    structure, all the functions and procedures that operate on that data will also
    have to be modified. Thus one small change could have a knock on effect throughout
    the program, involving changes to numerous, widely-scattered routines.


    16'
  merge: -1
