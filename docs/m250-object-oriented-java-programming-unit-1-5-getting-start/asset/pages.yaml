  md: '# Introduction


    Welcome to the first unit of M250 Object-oriented Java programming suggests, the
    emphasis is on object-oriented programming – writing software from an object-oriented
    perspective. Object-oriented programming is concerned with constructing computer
    systems out of interacting units of software, called objects. Objects know nothing
    of how other objects work, but they can interact (when a program is executing)
    by sending messages to each other. As you will see later, one of the most powerful
    aspects of object-oriented programming is that the code that produces interacting
    objects can be reused and interchanged between programs, increasing programming
    productivity.


    Programming in an object-oriented language requires more than just learning the
    syntax rules; it requires thinking in terms of the objects that will carry out
    the required tasks rather than in terms of data structures and algorithms, which
    might be the case in a non-object-oriented context.


    The programming language you will use in M250 is Java. However, the purpose of
    the module is not to teach you the minutiae of the Java language, but rather to
    teach you fundamental object-oriented programming concepts and skills that will
    be transferable to any object-oriented language. Hence, while you will certainly
    learn a lot of Java, and write lots of program code, we will be concentrating
    on those aspects of the Java language that best demonstrate object-oriented principles
    and good practice.


    The best way to learn any language is to practise it. Learning a new way of programming
    is no different, so you will find that this module has many practical programming
    activities for you to carry out! In working your way through the module and engaging
    in all the activities you will gain a good understanding of object-oriented principles,
    and a solid grounding in the use of the Java programming language.


    After a brief review of fundamental hardware and software concepts (Section 2),
    this unit introduces the basic elements of object-oriented software (Section 3)
    and presents a short history of the Java programming language (Section 4). In
    Section 5 you will begin to explore objects by engaging in computer-based activities.


    Since M250 is an OU level 2 module, we have assumed that you already have some
    programming experience, such as that gained from previous study or work, and are
    familiar with common programming constructs such as loops, if statements, assignment
    statements and variables.'
  merge: -1
  pgno: 10
