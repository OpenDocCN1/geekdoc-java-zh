  md: '# 2.6 Variable identifiers


    You have now seen how to declare and initialise variables, and we said that you
    could choose a name for each variable. These names, technically called identifiers,
    should be chosen so that they tell a reader what their purpose is. However, there
    is not a totally free choice because Java imposes rules on valid names.


    Valid identifiers:


    +   - begin with an upper- or lower-case letter (that is, A...Z, a...z), or the
    underscore or dollar characters (_, $);

    - subsequent characters may be an upper- or lower-case letter or a digit (0, 1,
    2...9) or the underscore or dollar characters.


    In M250 we follow the common convention of not using the underscore or dollar
    characters, because they are less readable, and we ask that you avoid them – for
    more about coding style see the M250 Code Conventions document.


    Identifiers must not:


    +   - contain spaces;

    - be keywords (keywords have special meanings in Java – a full list of them is
    shown in Table 2; however, you are not required to memorise them);

    - be the words true, false or null because they are reserved words that literals
    used to indicate values.


    | abstract | continue | for | new | switch |

    |---|---|---|---|--|

    | assert | default | | package | synchronized |

    | boolean | do | if | private | this |

    | break | double | implements | protected | throw |

    | byte | else | import | public | throws |

    | case | enum | | return | transient |

    | catch | extends | int | short | try |

    | char | final | interface | static | void |

    | class | finally | | long | strictfp | volatile |

    | const | float | native | super | while |


    In M250 we would also encourage you to respect the following guidelines when choosing
    identifiers for your variables. Keeping these guidelines should make your programs
    easier to read and maintain.


    +   - Although there is no upper limit on the number of characters that can be
    used in an identifier, in general you should avoid very short identifiers, such
    as a, b, x, or ch because such names are not very informative.'
  merge: -1
  pgno: 114
- img_proc: true
  md: 'Identifiers composed entirely of letters are usually the most meaningful to
    human readers, although it might sometimes use digits in identifiers for number
    of similar values; for example, frog1, frog2, frog3. Always choose meaningful
    names, that is, identifiers give some indication to the role played by the variable.


    Identifiers should start with lower-case letters. This helps to distinguish them
    from classes, whose names start with an upper-case letter. Where an identifier
    is composed of two or more English words or abbreviations, we suggest the use
    of a single upper-case letter to mark the start of each word after the first.
    We used this style of identifier (known as a camel-backed identifier) for myNumber
    and yourNumber here are a few examples: totalCost, dateToday and myFunctionName.


    Note that M250 assessment materials may include marks for adhering to the given
    style.


    # SAQ 2


    Which of the following are valid variable identifiers in Java? Give a reason in
    each of the cases you consider that the text is not an identifier.


    +   (a) kermit

    (b) hover frog

    (c) hoverFrogl

    (d) my+Frog

    (e) myAcc

    (f) 3.2

    (g) "iAmVariable"

    (h) MyNumber

    (i) $Money


    # Answer


    +   (a) kermit is a valid variable identifier.

    (b) hover frog is not valid; it contains a space character.

    (c) hoverFrogl is a valid identifier.

    (d) my+Frog is not a valid identifier since it contains the illegal character+.

    (e) myAcc is a valid identifier.

    (f) 3.2 is not valid; it does not start with a letter; in fact it is a number
    literal.

    (g) "iAmVariable" is not valid; it does not start with a letter; in fact it is
    a string literal.

    (h) MyNumber is valid. However, it breaks an universal programming convention
    that variable names should start with a lowercase letter.

    (i) $Money is a valid identifier, although it does not conform to M250 style rules.


    Although the Java compiler will accept the identifier names shown in both (h)
    and (i) you should avoid these kinds of name.'
