  md: '![](img/3b2a7e20c7b75206410143a99df1dd1c_225_0.png)


    Figure 6 Encapsulation


    Figure 6 shows that an object becomes a ''black box'' – whatever is inside it
    is is hidden, but public methods allow other objects to interact with the object''s
    internal state.


    The set of methods defined as public provide what we call the public protocol
    of an object (normally when we just say ''protocol'' we are referring to the public
    protocol), whereas those that are defined as private provide the private protocol
    of an object. The public protocol of a class X refers to that set of messages
    that the user of an arbitrary class can send to an instance of class X (because
    the corresponding methods have been declared as public in class X). The private
    protocol refers to that set of messages whose corresponding methods have been
    declared as private and which normally an instance of a class would send only
    to itself inside one of its other methods (via this).


    In programming terms this means access by objects of other classes to the data
    object encapsulates (the instance variables) is possible only through a limited
    set of public methods.'
