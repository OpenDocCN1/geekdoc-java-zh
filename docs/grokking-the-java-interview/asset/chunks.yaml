    `Composite`（组合模式）也是一种核心 Java 设计模式，它允许你以相同的方式处理整体和部分对象。处理 `Composite` 或单个对象的客户端代码不需要区分它们，这之所以能够实现，是因为
    `Composite` 类也实现了与各个独立部分相同的接口。


    JDK 中组合模式的一个极佳范例是 `JPanel` 类，它既是 `Component` 也是 `Container`。当在 `JPanel` 上调用 `paint()`
    方法时，它会在内部调用各个独立组件的 `paint()` 方法并让它们自己进行绘图。


    在这一设计模式面试题的第二部分，请务必诚实回答；如果你用过，就说用过；否则就说你熟悉该概念并曾自己实现过它。


    ## 6. 什么是 Java 中的单例模式（Singleton pattern）？


    Java 中的单例模式是一种允许整个应用程序中只有一个 `Singleton` 类实例可用的模式。`java.lang.Runtime` 是 Java 中单例模式的一个很好的例子。关于单例模式有很多后续问题，请参阅
    10 个 Java 单例面试题答案以获取后续内容。


    ## 7. 你能在 Java 中编写线程安全的单例吗？


    在 Java 中有多种编写线程安全单例的方法，例如通过双重检查锁定（double-checked locking）编写 `singleton`，或者使用在类加载期间初始化的静态
    `Singleton` 实例。顺便说一下，使用 Java `enum` 来创建线程安全的单例是最简单的方法。


    ## 8. 在 Java 中何时使用模板方法模式（Template method design pattern）？


    模板模式是另一个流行的核心 Java 设计模式面试题。我在现实项目本身中多次看到它的出现。模板模式以模板方法的形式概述算法，并让子类实现各个具体的步骤。


    在回答这个问题时，需要提到的关键点是：模板方法应该是 `final` 的，以确保子类无法重写并更改算法的步骤。同时，具体的步骤应该是 `abstract`（抽象的），以便子类可以实现它们。


    ## 9. 什么是 Java 中的工厂模式（Factory pattern）？使用静态工厂方法创建对象的优势是什么？


    Java 中的工厂模式是一种**创建型**的 Java 设计模式，也是许多 Java 面试的宠儿。工厂模式通过提供静态工厂方法来创建对象。提供工厂方法有许多优势，例如缓存不可变对象、易于引入新对象等。更多细节请参阅什么是
    Java 中的工厂模式及其优势。


    ## 10. Java 中装饰器模式（Decorator）和代理模式（Proxy）的区别是什么？


    这是另一个棘手的 Java 设计模式面试题，这里的陷阱在于：`Decorator` 和 `Proxy` 都实现了它们所装饰或封装的那个 `Object` 接口。正如我所说，许多
    Java 设计模式可能具有相似或完全相同的结构，但它们的意图不同。


    `Decorator` 装饰器模式用于在已经创建的对象上实现功能，而 `Proxy` 代理模式用于控制对对象的访问。


    装饰器和代理设计模式的另一个区别是：`Decorator` 不创建对象；相反，它在构造函数中获取 `Object`，而 `Proxy` 实际上会创建对象。你也可以阅读《Head
    First 设计模式》来理解它们之间的区别。


    ## 11. 在依赖注入模式（Dependency Injection pattern）中，何时使用 Setter 注入和构造函数注入？


    使用 `Setter` 注入提供对象的可选依赖，而使用 `Constructor`（构造函数）注入提供对象的强制依赖（没有这些依赖它无法工作）。这个问题与依赖注入设计模式有关，通常在
    Spring 框架背景下被问，而 Spring 现在已成为开发 Java 应用的标准。


    由于 Spring 提供了 `IOC` 容器，它也提供了一种通过使用 setter 方法或构造函数来指定依赖的方法。你也可以查看我之前关于相同主题的章节。


    ## 12. Java 中工厂（Factory）和抽象工厂（Abstract Factory）的区别是什么


    我已经在相同标题的章节中详细回答过这个问题。主要的区别在于：`Abstract Factory` 抽象工厂创建的是工厂，而 `Factory` 工厂创建的是对象。因此两者都抽象了创建逻辑，但一个抽象的是工厂，另一个的是产品。


    ## 13. 在 Java 中何时使用适配器模式（Adapter pattern）？你以前在项目中使用过吗？


    当你需要让两个具有不兼容接口的类工作时，请使用 `Adapter` 模式。适配器模式也可以封装第三方代码，使得应用程序仅依赖于 `Adapter`，当第三方代码更改或你移动到不同的第三方库时，`Adapter`
    可以自行适配。


    顺便说一下，这个 Java 设计模式问题也可以通过提供实际场景来提出。你可以进一步阅读《Head First 设计模式》来学习更多关于 `Adapter`
    模式及其真实用法。该书也针对 Java 8 更新过，因此你将学习使用新的 Java 8 方法来实现这些旧的设计模式。


    ## 14. 你能写代码实现生产者-消费者设计模式（producer-consumer design pattern）吗？


    生产者-消费者设计模式是 Java 中的并发设计模式，可以通过多种方式实现。如果你在 Java 5 中工作，最好使用并发工具类来实现生产者消费者模式，而不是使用
    Java 中旧的 `wait` 和 `notify`。这里有一个使用 Java 中的 `BlockingQueue` 实现生产者消费者问题的优秀示例。


    ## 15. Java 中的构建器模式（Builder design pattern）是什么？你何时使用构建器模式？


    Java 构建器模式是 Java 中的另一种创建型设计模式，经常在 Java 面试中被问，是因为当你需要构建一个具有多个属性（某些可选，某些强制性）的对象时，它有特定的用途。


    ## 16. Java 中的开闭原则（Open closed design principle）是什么？


    开闭设计原则是由 Robert C. Martin 定义的 SOLID 原则之一（他在最著名的书籍《整洁代码》中广为人知的 Uncle Bob）。该原则建议代码应该对扩展开放，对修改关闭。


    起初，这看起来可能是相互矛盾的，但一旦你探索了多态的力量，你就会发现能够为该原则提供稳定性和灵活性的模式。


    该原则的一个关键示例是状态和策略模式，其中 `Context` 类对修改关闭，而通过实现新的策略状态来提供新功能。查看此章节了解更多关于开闭原则的内容。


    ## 17. 你能举出 Java 中 SOLID 设计原则的例子吗？


    有很多 SOLID 设计模式，其缩写 SOLID 如下：


    1. 单责任原则 `SRP`

    2. 开闭设计原则 `OCD`

    3. 里氏替换原则

    4. 接口隔离原则

    5. 依赖倒置原则。


    ## 18. Java 中抽象（Abstraction）和封装（Encapsulation）的区别是什么？


    尽管抽象和封装看起来相似，因为它们都隐藏了复杂性并使外部接口更简单，但它们之间存在细微的区别。抽象隐藏逻辑复杂性，而封装隐藏物理复杂性。


    ![](img/Difference_between_Abstraction_and_Encapsulation.jpg)


