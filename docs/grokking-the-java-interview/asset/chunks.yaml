- fmt: "\nIn general, read write lock is the result of lock stripping technique to\
    \ improve the performance of concurrent applications. In Java, `ReadWriteLock`\
    \ is an interface which was added in Java 5 release. A `ReadWriteLock` maintains\
    \ a pair of associated locks, one for read-only operations and one for writing.\
    \ The read lock may be held simultaneously by multiple reader threads, so long\
    \ as there are no writers. The write lock is exclusive. If you want you can implement\
    \ this interface with your own set of rules, otherwise you can use `ReentrantReadWriteLock`,\
    \ which comes along with JDK and supports a maximum of 65535 recursive write locks\
    \ and 65535 read locks.\n\n### 45) What is busy spin in multi-threading?\n\nBusy\
    \ spin is a technique which concurrent programmers employ to make a thread wait\
    \ on certain condition. Unlike traditional methods e.g. `wait()`, `sleep()` or\
    \ `yield()` which all involves relinquishing CPU control, this method does not\
    \ relinquish CPU, instead it the just runs empty loop. Why would someone do that?\
    \ to preserve CPU caches. In a multi-core system, it’s possible for a paused thread\
    \ to resume on a different core, which means rebuilding cache again. To avoid\
    \ cost of rebuilding cache, programmer prefer to wait for much smaller time doing\
    \ busy spin.\n\n### 46) What is the difference between the volatile and atomic\
    \ variable in Java?\n\nThis is an interesting question for Java programmer, at\
    \ first, `volatile` and atomic variable look very similar, but they are different.\
    \ `volatile` variable provides you happens-before guarantee that a write will\
    \ happen before any subsequent write, it doesn’t guarantee atomicity. For example\
    \ `count++` operation will not become atomic just by declaring `count` variable\
    \ as `volatile`. On the other hand `AtomicInteger` class provides atomic method\
    \ to perform such compound operation atomically e.g. `getAndIncrement()` is atomic\
    \ replacement of increment operator. It can be used to atomically increment current\
    \ value by one. Similarly you have atomic version for other data type and reference\
    \ variable as well. \n\n### 47) What happens if a thread throws an Exception inside\
    \ synchronized block?\n\nThis is one more tricky question for average Java programmer,\
    \ if he can bring the fact about whether lock is released or not is a key indicator\
    \ of his understanding. To answer this question, no matter how you exist `synchronized`\
    \ block, either normally by finishing execution or abruptly by throwing exception,\
    \ thread releases the lock it acquired while entering that `synchronized` block.\
    \ This is actually one of the reasons I like `synchronized` block over `lock`\
    \ interface, which requires explicit attention to release lock, generally this\
    \ is achieved by releasing the lock in a `finally` block.\n\n### 48) What is double\
    \ checked locking of Singleton?\n\nThis is one of the very popular question on\
    \ Java interviews, and despite its popularity, chances of candidate answering\
    \ this question satisfactory is only 50%. Half of the time, they failed to write\
    \ code for double checked locking and half of the time they failed how it was\
    \ broken and fixed on Java 1.5. This is actually an old way of creating thread-safe\
    \ singleton, which tries to optimize performance by only locking when `Singleton`\
    \ instance is created first time, but because of complexity and the fact it was\
    \ broken for JDK 1.4, I personally don’t like it. Anyway, even if you not prefer\
    \ this approach its good to know from interview point of view.\n\n### 49) How\
    \ to create thread-safe Singleton in Java?\n\nThis question is actually follow-up\
    \ of the previous question. If you say you don’t like double checked locking then\
    \ Interviewer is bound to ask about alternative ways of creating thread-safe `Singleton`\
    \ class. There are actually man, you can take advantage of class loading and static\
    \ variable initialization feature of JVM to create instance of `Singleton`, or\
    \ you can leverage powerful enumeration type in Java to create `Singleton`.\n\n\
    ### 50) List down 3 multi-threading best practice you follow?\n\nThis is my favorite\
    \ question because I believe that you must follow certain best practices while\
    \ writing concurrent code which helps in performance, debugging and maintenance.\
    \ Following are three best practices, I think an average Java programmer should\
    \ follow:\n\n#### Always give meaningful name to your thread\nThis goes a long\
    \ way to find a bug or trace an execution in concurrent code. `OrderProcessor`,\
    \ `QuoteProcessor` or `TradeProcessor` is much better than `Thread-1`, `Thread-2`\
    \ and `Thread-3`. The name should say about task done by that thread. All major\
    \ framework and even JDK follow this best practice.\n\n#### Avoid locking or Reduce\
    \ scope of Synchronization\nLocking is costly and context switching is even costlier.\
    \ Try to avoid synchronization and locking as much as possible and at a bare minimum,\
    \ you should reduce critical section. That’s why I prefer `synchronized` block\
    \ over `synchronized` method because it gives you absolute control on the scope\
    \ of locking.\n\n#### Prefer Synchronizers over wait and notify\nSynchronizers\
    \ like `CountDownLatch`, `Semaphore`, `CyclicBarrier` or `Exchanger` simplifies\
    \ coding. It’s very difficult to implement complex control flow right using `wait`\
    \ and `notify`. Secondly, these classes are written and maintained by best in\
    \ business and there is good chance that they are optimized or replaced by better\
    \ performance code in subsequent JDK releases. By using higher level synchronization\
    \ utilities, you automatically get all these benefits.\n\n#### Prefer Concurrent\
    \ Collection over Synchronized Collection\nThis is another simple best practice\
    \ which is easy to follow but reap good benefits. Concurrent collection are more\
    \ scalable than their synchronized counterpart, that’s why its better to use them\
    \ while writing concurrent code. So next time if you need map, think about `ConcurrentHashMap`\
    \ before thinking `Hashtable`.\n\n### 51) How do you force to start a Thread in\
    \ Java?\n\nThis question is like how you force garbage collection in Java, there\
    \ is no way though you can make a request using `System.gc()` but it’s not guaranteed.\
    \ On Java multi-threading there is absolutely no way to force start a thread,\
    \ this is controlled by thread scheduler and Java exposes no API to control thread\
    \ schedule. This is still a random bit in Java.\n\n### 52) What is the fork-join\
    \ framework in Java?\n\nThe fork-join framework, introduced in JDK 7 is a powerful\
    \ tool available to Java developer to take advantage of multiple processors of\
    \ modern day servers. It is designed for work that can be broken into smaller\
    \ pieces recursively. The goal is to use all the available processing power to\
    \ enhance the performance of your application. One significant advantage of The\
    \ fork/join framework is that it uses a work-stealing algorithm. Worker threads\
    \ that run out of things to do can steal tasks from other threads that are still\
    \ busy.\n\n### 53) What is the difference between calling wait() and sleep() method\
    \ in Java multi-threading?\n\nThough both wait and sleep introduce some form of\
    \ pause in Java application, they are the tool for different needs. `wait` method\
    \ is used for inter-thread communication, it relinquishes lock if waiting for\
    \ a condition is true and wait for notification when due to an action of another\
    \ thread waiting condition becomes false. On the other hand `sleep()` method is\
    \ just to relinquish CPU or stop execution of current thread for specified time\
    \ duration. Calling sleep method doesn’t release the lock held by the current\
    \ thread.\n\nYou can use this list to not only to prepare for your core Java and\
    \ programming interviews but also to check your knowledge about basics of threads,\
    \ multi-threading, concurrency, design patterns and threading issues like race\
    \ conditions, deadlock and thread safety problems.\n"
