    # GROKKING THE JAVA INTERVIEW


    ## Serialization Interview Questions


    There is no doubt that Java is vast and there are some Java topics which many
    Java developers rarely explore. Serialization is one of them which is rarely used
    in practice but quite popular during Java interviews. It’s also one of the difficult
    topics to master and that’s why I am going to share some frequently asked Java
    Serialization interview questions in this section. I don’t know why people ask
    so many questions from Selrization if not everyone uses it but I have always seen
    some questions from Java realization. These are also the toughest and confusing
    questions to answer and more likely cannot be answered by an average Java developer.


    I still remember when I was asked about the `readObject()` and `writeObject()`
    method on one of the Java interviews on a big investment bank during the early
    days of my career. That was the first time I heard about those methods. I am sure,
    I wasn’t alone there were many Java developers who haven’t heard about those two
    methods during the early stage of their career.


    I have come a long way since then and learned a lot about Serialization in Java
    and seen them in the real world. To be honest with you, it is a very complex feature
    of Java and if you have to touch a code that uses Serialization, you will more
    likely break it than fix it.


    I was given a task to add a new field in one of our domain class `Order.java`
    which implemented `Serializable`. I added the field only to see `NotSerializableException`
    in our log file then I realized that any field you are going to add must implement
    either `Serializable` or `Externalizable` interface if it’s not `transient` or
    `static`.


    There are many such fine details which you can only know by hard reading or real
    practical experience. Though, one book which helped me a lot was *Effective Java*.
    It has some of the best material converting this topic and I strongly suggest
    every Java developer read this book and all the items pertaining to Serialization
    in Java.


    Without wasting any more of your time, here are some Java questions from the Serialization
    topic, you need more questions to prepare well though.


    ### 1. What is a Serializable interface? What is the purpose of it?


    `Serializable` is a marker interface and it indicates that the object of any class
    which implements a `Serializable` interface can be stored on the disc using `JVM`’s
    default serialization mechanisms or transferred via the network.


    ### 2. What is the difference between the Serializable and Externalizable interface?


    Both interfaces allow your object to be sterilized or converted to aq binary format
    which can be saved into disc or transfers over the network but key difference
    between them is that `Serializable` uses default serialization mechanism of `JVM`
    and `Externalizable` provide hooks and callbacks to do things before and after
    realization.


    ### 3. What is a transient variable? What is the purpose of it?


    `transient` variables are not saved during the Serialization process. As the name
    suggests they are transient and not really part of the object’s state. You can
    use a `transient` variable to exclude certain fields from being serialized like
    a field that is not serializable should be either marked `transient` or `static`.


    ### 4. What is SerialVersionUID in Java? Why it’s important?


    `SerialVersionUID` is an identifier generated during the Serialization process
    if not defined in the class. The danger of not specifying explicitly is that the
    default logic goes generate this id depends upon class metadata like a number
    of fields, which means if you add new fields or remove olds fields the it will
    be different.


    This means, you may not be able to restore the old serialized instances with the
    new version of your code. When you define `SerialVersionUID` as `public static
    final long` constant then the default serialization mechanism doesn’t generate
    it, hence it becomes independent of class metadata.


    As I have said, a good knowledge of this topic is very important for Java programmers
    and if you want to learn more, I strongly suggest you join a good Java course
    like `Java In-Depth: Become a Complete Java Engineer!` on Udemy.


    ![](image/What_is_SerialVersionUID_in_Java_and_Why_you_need_that.png)


    ### 5. How many methods we have in the Serializable interface?


    None, `java.io.Serializable` is a marker interface, it doesn’t have any method.


    ### 6. What is a marker interface in Java?


    An interface without any method. Such an interface is just an indication to the
    compiler, `JVM`, or some tools for some special processing. They are similar to
    annotation and hence obsolete once annotation was introduced in Java 5.


    ### 7. Can you add a field in a Serializable class which doesn’t implement Serializable
    interface?


    No, that will throw `NotSerializableException`, if you absolutely want to add
    it then mark it `static` or `transient`, but the state of that object will not
    be saved when the object be serialized.


    # GROKKING THE JAVA INTERVIEW


    ## 8. How do you serialize an object in Java?


    In order to serialize object make sure it implements `Serializable` and then use
    `ObjectOutputStream.writeObject()` to save the object into a disk.


    ### 9. How Serialization of an object works in Java?


    When you serialize an object first its superclass is serialized and then the subclass.
    If any field doesn’t implement the `Serializable` interface (only reference type)
    then it will throw `NotSerializableException`. Though, if you want to learn more
    about Serialization in Java then I also suggest you go through a comprehensive
    Java course like ` Complete Java Masterclass` on Udemy.


    ![](image/Serialization_in_Java.jpg)


    ## 10. What about static variables? Are they Serialized?


    No, static variables are not serialized. Since `static` is a class level variable
    i.e. it has the same value for each instance. This can create an issue if your
    serialized object id dependent upon the value of a static variable because when
    you deserialize the object, it will get the value for static variable what other
    instances will have, this may not be the same. So, don’t make your serialized
    object depends upon the static variable.


    ### 11. What is the difference between the transient and volatile variables in
    Java?


    They are completely different, `volatile` is used in multi-threading to instruct
    the compiler that variable will be accessed by multiple threads and provide ordering
    and visibility guarantee, while the `transient` variable is used to exclude fields
    from being persisted as part of serialization.


    ### 12. Can you make a subclass NotSerializable if the Superclass is Serializable?
    Is it mandatory for a subclass to implement the Serializable interface?


    Yes, you can make the subclass NotSerializable. It’s not mandatory for a subclass
    to be a Serializable class even if the superclass is serializable.

