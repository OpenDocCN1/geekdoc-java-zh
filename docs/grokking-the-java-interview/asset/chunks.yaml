    \ `hashcode`，这就是基于哈希表的集合（例如 `HashMap`）发生冲突的原因。当你重写 `equals()` 时，必须记住重写 `hashCode()`\
    \ 方法以保持合约有效。\n\n## 31) 为什么 `wait` 和 `notify` 方法被声明在 `Object` 类中？\n\n这个问题更多是为了找出你到底有多少经验，以及你对\
    \ Java API 及其设计决策有何思考。类似的问题是：为什么 `String` 在 Java 中是不可变的？嗯，真正的答案只有 Java 设计师能给出，但你可以进行推理。例如，`wait`\
    \ 和 `notify` 方法与锁相关，而锁属于对象而不是线程，这就是为什么将这些方法保留在 `java.lang.Object` 类中是合理的。\n\n\
    ## 32) `HashSet` 在 Java 中是如何工作的？\n\n`HashSet` 在 Java 内部是使用 `HashMap` 实现的，这正是面试官想听到的答案。然后他可以用一些基于常识的问题来考问你，例如：既然\
    \ `HashMap` 需要两个对象（键 `key` 和值 `value`），你该如何使用它？在 `HashSet` 中，“值”是什么？嗯，在 `HashSet`\
    \ 中，使用一个虚拟对象作为值，而键对象是从 Set 的角度来看的元素。由于 `HashMap` 不允许重复键，它也遵循 Set 数据结构不允许重复的合约。\n\
    \n## 33) Java 中 `synchronized` 和并发集合（concurrent Collection）有什么区别？\n\n在 Java 1.5\
    \ 之前，如果你在多线程 Java 程序中需要集合，只有 `synchronized` 集合。这些类深受许多问题的困扰，最重要的性能问题，因为每当线程读取或写入时它们都会锁定整个集合或映射。为了解决这些问题，Java\
    \ 发布了一些并发集合类，例如 `ConcurrentHashMap`、`CopyOnWriteArrayList` 和 `BlockingQueue`，以提供更好的可扩展性和性能。\n\
    \n## 34) Java 中 `Iterator` 和 `Enumeration` 有什么区别？\n\n主要区别是 `Iterator` 被引入用来取代\
    \ `Enumeration` 的。它允许你在遍历时从集合中删除元素，这在 `Enumeration` 中是不可能的。`Iterator` 的方法（例如 `hasNext()`\
    \ 和 `next()`）也比 `Enumeration` 相应的方法（例如 `hasMoreElements()`）更简洁。你应该在 Java 代码中始终使用\
    \ `Iterator`，因为 `Enumeration` 可能在未来的 Java 版本中被弃用并删除。\n\n## 35) Java 中重载（Overloading）和重写（Overriding）有什么区别？\n\
    \nJava 面试电话环节的另一个高频问题。虽然重载和重写都与同名方法有关，但它们具有不同的特征，例如：重载的方法与原始方法具有不同的签名，而重写的方法必须具有相同的签名。此外，重载方法在编译时解析，而重写方法在运行时解析。\n\
    \n## 36) Java 中静态绑定（static binding）和动态绑定（dynamic binding）的区别是什么？\n\n这通常作为上一个问题的后续问题：静态绑定与重载方法有关，动态绑定与重写方法有关。像\
    \ `private`、`final` 和 `static` 等方法在编译时通过静态绑定解析，但可以被重写的虚拟方法在运行时通过动态绑定解析。\n\n##\
    \ 37) Java 中 `Comparator` 和 `Comparable` 的区别？\n\n这是另一个基础概念，我期望每个 Java 候选人都能掌握。你会在每个\
    \ Java 项目中遇到它们。Java 中的几个核心类（如 `String`、`Integer`）实现了 `Comparable` 来定义它们的自然排序；如果你定义了一个值或领域对象，你应该实现\
    \ `Comparable` 并定义对象的自然排序。两者之间的主要区别在于，你可以创建多个 `Comparator` 来定义多种排序规则。此外，为了实现 `Comparable`\
    \ 你必须拥有该类的源码，但使用 `Comparator` 不需要类的源码，只需要该对象的 JAR 文件即可。这就是为什么 `Comparator` 对于实现自定义排序非常强大，而且从\
    \ Java 8 开始你可以更优雅地实现，如下所示。\n\n## 38) 如何降序排序 `ArrayList`？\n\n你可以使用 `Collections.sort()`\
    \ 方法配合反向 `Comparator`，这可以按元素的反自然顺序进行排序，例如：\n\n```\nList<String> listOfString =\
    \ Arrays.asList(“London”, “Tokyo”, “NewYork”); \nCollections.sort(listOfString,\
    \ Collections.reverseOrder()); \nSystem.out.println(listOfString); //Tokyo, NewYork,\
    \ London\n```\n\n## 39) Java 中 `PATH` 和 `CLASPATH` 的区别是什么？\n\n`PATH` 是指向 Java\
    \ 二进制文件的环境变量，用于运行 Java 程序。`CLASPATH` 是另一个环境变量，指向 Java 类文件或 JAR 文件。如果在此 `CLASPATH`\
    \ 中未找到某个类，Java 将抛出 `ClassNotFoundException`。\n\n## 40) Java 中受检异常（Checked Exception）和未检异常（Unchecked\
    \ Exception）有什么区别？\n\n受检异常确保提供了异常处理程序，并由编译器进行验证；而抛出未检异常则不需要特殊准备（例如 `throws` 子句）。方法可以在不写\
    \ `throws` 子句的情况下抛出未检异常。\n\n"
