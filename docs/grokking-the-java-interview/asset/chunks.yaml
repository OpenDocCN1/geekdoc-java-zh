    this question hits me in a telephonic round of Java interview. There is a method
    called holdsLock() on java.lang.Thread, it returns true if and only if the current
    thread holds the monitor lock on the specified object.


    30) How do you take thread dump in Java?


    There are multiple ways to take thread dump of Java process depending upon operating
    system. When you take thread dump, JVM dumps state of all threads in log files
    or standard error console. In windows you can use Ctrl + Break key combination
    to take thread dump, on Linux you can use kill -3 command for same. You can also
    use a tool called jstack for taking thread dump, it operate on process id, which
    can be found using another tool called jps.


    31) Which JVM parameter is used to control stack size of a thread?


    This is the simple one, -Xss parameter is used to control stack size of Thread
    in Java. You can see this list of JVM options to learn more about this parameter.


