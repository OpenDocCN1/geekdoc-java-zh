- fmt: "\ninterfaces? Once you know the answer, it might be a little easier for you\
    \ to remember the concept.\n\nWell, they are called functional interfaces because\
    \ they wrap a function as an interface. The function is represented by the single\
    \ abstract method on the interface.\n\n### 11. What is the difference between\
    \ the `findFirst()` and `findAny()` method?\n\nThe `findFirst()` method will return\
    \ the first element meeting the criterion i.e. `Predicate`, while the `findAny()`\
    \ method will return any element meeting the criterion, very useful while working\
    \ with a parallel stream. You can further see this article for a working example\
    \ of the `findFirst()` method in Java 8.\n\n### 12. What is a `Predicate` interface?\n\
    \nA `Predicate` is a functional interface that represents a function, which takes\
    \ an `Object` and returns a `boolean`. It is used in several Stream methods like\
    \ `filter()`, which uses `Predicate` to filter unwanted elements.\n\nhere is how\
    \ a `Predicate` function looks like:\n\n```java\npublic boolean test(T object){\n\
    \    return boolean;\n}\n```\n\nYou can see it just has one `test()` method which\
    \ takes an object and returns a `boolean`. The method is used to test a condition\
    \ if it passes; it returns `true` otherwise false.\n\n### 13. What are `Supplier`\
    \ and `Consumer` Functional interface?\n\nThe `Supplier` is a functional interface\
    \ that returns an object. It’s similar to the factory method or `new()`, which\
    \ returns an object.\n\nThe `Supplier` has `get()` functional method, which doesn’t\
    \ take any argument and return an object of type `T`. This means you can use it\
    \ anytime you need an object. Since it is a functional interface, you can also\
    \ use it as the assignment target for a lambda expression or method reference.\n\
    \nA `Consumer` is also a functional interface in JDK 8, which represents an operation\
    \ that accepts a single input argument and returns no result.\n\nUnlike other\
    \ functional interfaces, `Consumer` is expected to operate via side-effects. The\
    \ functional method of `Consumer` is `accept(T t)`, and because it’s a functional\
    \ interface, you can use it as the assignment target for a lambda expression or\
    \ method interface in Java 8.\n\n### 14. Can you convert an array to Stream? How?\n\
    \nYes, you can convert an array to `Stream` in Java. The `Stream` class provides\
    \ a factory method to create a `Stream` from an array, like `Stream.of(T ...)`\
    \ which accepts a variable argument, that means you can also pass an array to\
    \ it as shown in the following example:\n\n```java\nString[] languages = {\"Java\"\
    , \"Python\", \"JavaScript\"};\nStream numbers = Stream.of(languages);\nnumbers.forEach(System.out::println);\n\
    ```\n\nOutput:\n```\nJava\nPython\nJavaScript\n```\n\n### 15. What is the parallel\
    \ Stream? How can you get a parallel stream from a `List`?\n\nA parallel stream\
    \ can parallel execute stream processing tasks. For example, if you have a parallel\
    \ stream of 1 million orders and you are looking for orders worth more than 1\
    \ million, then you can use a `filter` to do that.\n\nUnlike sequential `Stream`,\
    \ the parallel Stream can launch multiple threads to search for those orders on\
    \ the different part of `Stream` and then combine the result.\n\nIn short, the\
    \ parallel Stream can paralyze execution, but, as Cay S. Horstman mentioned in\
    \ `Core Java S.E. 9 for the Impatient`, there is significant overhead or parallelism,\
    \ which only pays off if you are doing bulk data operation.\n\nThat’s all about\
    \ some of the common Java 8 Stream and Functional programming concepts based interview\
    \ questions. Since Java 8 is now the modern way of writing Java code, more and\
    \ more companies are looking for Java developers with good Java 8 skills.\n\n\
    ## Appendix\n\n### My favorite tip to Crack Java Interview\n\nHello guys, I want\
    \ to share one tip with you which have helped me a lot on my Java interviews.\
    \ I have given 10s of Java interviews and also taken many Java interviews and\
    \ I have often seen used this tactic to make lasting impression on Interviews.\n\
    \nThe trick here is drive the interview to your strength. Java is vast and in\
    \ a limited time like 1-hour interview, its not possible for anyone to cover everything.\
    \ Interviewer often have a list of questions to screen candidates during telephonic\
    \ round but in face-to-face round they mostly like to check the depth of candidate’s\
    \ knowledge and that’s where you can use this tip.\n\nFor example, if interviewer\
    \ asked you about `HashMap`, you can not only answer his question about `HashMap`\
    \ but also mention related details like hashing, how `equals()` and `hashcode()`\
    \ are used, and how objects are stored in the `HashMap` (linked list vs binary\
    \ tree), provided you know these topics well. When you mention these keywords,\
    \ the interviewer are more likely to ask question on those topics and then you\
    \ can showcase your knowledge and drive the interview.\n\nThe trick here is to\
    \ high light the topic you know well and don’t mention anything addition which\
    \ you don’t know well. This tip is really simple and once you start giving interview,\
    \ you will realize that you are doing that, but if you don’t do it now, I suggest\
    \ setup mock interviews with your friends or online and see if you are using tip\
    \ for your benefit.\n\nAll the best for your Java interview.\n\n## Index\n(Index\
    \ content omitted for brevity)\n"
