    # 深度解析 Java 面试


    ## 22) 什么是 BlockingQueue？它与其他集合类有什么区别？


    `BlockingQueue` 是 `java.util.concurrent` 包中可用的一种 `Queue` 实现。它是 Java 1.5 之后添加的并发集合类之一。`BlockingQueue`
    与其他集合类的主要区别在于，除了存储外，它还提供了流量控制。它可以用于线程间通信，并通过 `happens-before` 保证提供内置的线程安全。你可以使用
    `BlockingQueue` 来解决生产者-消费者问题，这在大多数并发应用中都是需要的。


    这里有几个额外的练习题，请尝试自己自己寻找这些问题的答案：


    ### 23) LinkedList 在 Java 中是如何实现的？它是单链表还是双链表？

