    # GROKKING THE JAVA INTERVIEW


    ## 22) What is BlockingQueue, how it is different than other collection classes?


    `BlockingQueue` is a `Queue` implementation available in `java.util.concurrent`
    package. It’s one of the concurrent Collection class added on Java 1.5, main difference
    between `BlockingQueue` and other collection classes is that apart from storage,
    it also provides flow control. It can be used in inter-thread communication and
    also provides built-in thread-safety by using happens-before guarantee. You can
    use `BlockingQueue` to solve Producer Consumer problem, which is what is needed
    in most of concurrent applications.


