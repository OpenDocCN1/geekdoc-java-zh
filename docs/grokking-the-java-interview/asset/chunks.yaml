  trans: '


    以上就是关于电话面试的约 40 个核心 Java 面试题。不要轻视电话面试，这是你给潜在雇主留下印象的第一个机会。由于你看不见面试官，仅通过声音进行交流，这与面对面的面试略有不同。


    因此，务必保持冷静、放松，回答问题要切中准确，说话要缓慢，并确保你不在声音会有回声的地方（如狭窄的楼梯间）。良好的手机、耳机以及良好的信号区域也非常重要。我见过很多次候选人因为无法法听清声音或在回答之前无法理解问题而在面试中失败。我知道有些人会在那些秘密的地方进行电话面试，但如果你真的这样做，请确保你的手机连接信号足够。


    ## 多线程与并发面试题


    无论你参加任何 Java 面试，无论是初级还是高级级、有经验的还是新人，都不可避免会遇到几个关于线程、并发和多线程的问题。事实上，这种内置的并发支持是 Java
    编程语言最强优势点之一，使其在企业界和程序员中同样大受欢迎。大多数高薪的 Java 开发者职位都要求具备卓越的核心 Java 多线程技能，以及开发、调试和调优高性能低延迟并发
    Java 应用的经验。这就是为什么它是 Java 面试中最受青的技能之一。多线程和并发的概念也难以掌握，只有具有丰富经验的优秀开发者才能有效处理并发问题。


    在典型的 Java 面试中，面试官会从 `Thread` 的基本概念开始缓慢提问，例如：为什么需要线程、如何创建线程、哪种创建线程的方式更好（例如通过扩展
    `Thread` 类或实现 `Runnable` 接口），然后逐渐进入并发问题、开发并发 Java 应用期间面临的挑战、Java 内存模型、`JDK 1.5`
    引入的高阶并发工具、并发 Java 应用的原理和设计模式、经典的多线程问题（例如生产者-消费者、哲学家就、读写者或简单的边界缓冲区问题）。


    由于仅仅了解线程的基础知识是不够的，你必须知道如何处理死锁、竞态条件、内存不一致以及各种与线程相关的问题。这些技能会通过展示各种多线程和并发问题来得到彻底测试。


    许多 Java 开发者习惯在面试前只看和读面试题，这并不坏，但不应该脱离实际太远。此外，收集问题并反复练习同一个题目太时耗力，这就是为什么我创建了这份从各种面试中收集的前
    50 个 Java 多线程和并发相关问题列表。我会在发现新的和最近的面试题时不断添加。


    虽然专注于高级多线程和并发技能的 Java 面试需要具备良好的知识和扎实的经验，但我强烈建议 Java 程序员在参加面试前阅读两遍《Effective Java》（Effective
    Java）和《Java 并发编程》（Java Concurrency in Practice）。它们不仅能帮助你更好地回答问题，还能帮助你清晰地表达你的想法。


    而且，如果你认真想要精通 Java 多线程和并发，我建议你查看 Udemy 上由 Michael Pogrebinsy 提供的 Java Multithreading,
    Concurrency, and Performance Optimization 课程。这是一门成为 Java 多线程、并发和并行编程专家的高级课程，强调高性能。


    顺便说一下，我在这里没有提供某些问题的答案。为什么？因为我预计大多数 Java 开发者应该知道这些问题的答案，如果不知道，通过 Google 也能轻松找到答案。


    以下是我们的 Java 线程、并发和多线程热门问题列表。你可以使用这个列表为你的 Java 面试做好充分准备。


    ### 1) 什么是 Java 线程？


    线程是执行的独立路径。它是利用机器中可用多个 CPU 的方式。通过使用多个线程，你可以加速 CPU 密集型任务。例如，如果一个线程需要 100 毫秒完成一项工作，你可以使用
    10 个线程将该任务缩短到 10 毫秒。Java 在语言层面为多线程提供了卓越的支持，这也是它的核心卖点之一。


    ### 2) Java 中线程和进程的区别是什么？


    线程是 `Process` 的子集，换句话说，一个进程可以包含多个线程。两个进程运行在不同的内存空间中，但所有线程共享同一个内存空间。不要将其与栈内存混淆，不同线程的栈是不同的，用于存储该线程的本地数据。


    ### 3) 如何在 Java 中实现线程？


    在语言层面，实现 `Thread` 有两种。`java.lang.Thread` 的实例代表一个线程，但它需要一个任务来执行，该任务是 `java.lang.Runnable`
    接口的实例。由于 `Thread` 类本身实现了 `Runnable`，你可以通过扩展 `Thread` 类或直接实现 `Runnable` 接口来重写 `run()`
    方法。


    ### 4) 在 Java 中何时使用 Runnable 还是 Thread？


    这是上一个多线程面试题的后续问题。既然我们知道可以通过扩展 `Thread` 类或实现 `Runnable` 接口来实现线程，问题也就随之产生：哪种更好？什么时候用哪一个？如果你知道
    Java 编程语言不支持类的多继承，但允许实现多个接口，那么这个问题就很容易回答。如果你还想扩展另一个类（例如 `Canvas` 或 `CommandListener`），那么实现
    `Runnable` 比扩展 `Thread` 更好。


    ### 6) Thread 类 `start()` 方法和 `run()` 方法的区别是什么？


    这是早期的经典陷阱 Java 面试题之一，但仍然足以区分对 Java 线程模型的浅层理解。`start()` 方法用于启动新创建的线程，而 `start()`
    在内部会调用 `run()` 方法，这与直接调用 `run()` 方法是有区别的。当你像普通方法一样调用 `run()` 时，它是在同一个线程中调用的，不会启动新线程，而调用
    `start()` 方法时情况不同。


    ### 7) Java 中 Runnable 和 Callable 的区别是什么？


    `Runnable` 和 `Callable` 都代表旨在在独立线程中执行的任务。`Runnable` 从 `JDK 1.0` 就存在，而 `Callable`
    是在 `JDK 1.5` 添加的。这两者的主要区别是 `Callable` 的 `call()` 方法可以返回值并抛出异常，而 `Runnable` 的 `run()`
    方法无法做到这一点。`Callable` 返回 `Future` 对象，可以持有计算结果。


    ### 8) Java 中 CyclicBarrier 和 CountDownLatch 的区别是什么？


    虽然 `CyclicBarrier` 和 `CountDownLatch` 都在等待一个或多个事件的线程数，但它们的主要区别在于，一旦 `CountDownLatch`
    计数归零就无法重使用，但在屏障损坏后你可以重用同一个 `CyclicBarrier`。


    ### 9) 什么是 Java 内存模型？


