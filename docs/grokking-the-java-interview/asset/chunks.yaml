    Garbage collection interview questions are very popular in both core Java and
    advanced Java Interviews. Apart from Java Collection and Thread many tricky Java
    questions stem Garbage collections which are tough to answer. In this Java Interview
    section, I will share some questions from `GC` which is asked in various core
    Java interviews. These questions are based upon the concept of How Garbage collection
    works, Different kinds of Garbage collectors, and JVM parameters used for garbage
    collection monitoring and tuning. As I said `GC` is an important part of any Java
    interview so make sure you have good command in `GC`. One more thing which is
    getting very important is the ability to comprehend and understand Garbage collection
    Output, more and more interviewer are checking whether the candidate can understand
    `GC` output or not.


    During Java interview, they may provide a snippet of `GC` output and ask various
    questions based on that like Which Garbage collector is used, whether the output
    is from the major collection or minor collection, How much memory is free from
    `GC`, What is the size of new generation and old generation after `GC`, etc.


    I have included a few Garbage collection interview questions and answers from
    `GC` output to help with that. It’s recommended to prepare questions from Java
    collection, multithreading, and programming along with Garbage collection to do
    well in Java interviews at any stage.


    And, if you are serious about improving your advanced JVM skill and learn things
    like taking and analyzing heap dumps then highly recommend you to join Java Application
    Performance and Memory Management course on Udemy. It’s one of the advanced courses
    for Java programmers to learn more about Performance and Memory management including
    troubleshooting memory leaks in Java.


    Here are some Garbage collection Interview questions from my personal collection,
    which I have created from my experience and with the help of various friends and
    colleagues who have shared `GC` interview questions with me.


    Actually, there are a lot many questions than What I am sharing here but to keep
    this section small I thought to only share some questions, I can think of a second
    part of the `GC` interview question if you guys find this useful.


    ## Question 1 - What is the structure of Java Heap? What is Perm Gen space in
    Heap?


    **Answer**: In order to better perform in Garbage collection questions in any
    Java interview, It’s important to have a basic understanding of Java Heap space.


    By the way, Heap is divided into different generation e.g. new generation, old
    generation, and `PermGen` space. `PermGen` space is used to store class’s metadata
    and filling of `PermGen` space can cause `java.lang.OutOfMemory: PermGen space`.
    It’s also worth noting to remember the JVM option to configure `PermGen` space
    in Java.


    ## Question 2 - How do you identify minor and major garbage collection in Java?


    **Answer**: Minor collection prints “`GC`” if garbage collection logging is enabled
    using `-verbose:gc` or `-XX:PrintGCDetails`, while Major collection prints “Full
    GC”. This Garbage collection interview question is based on an understanding of
    the Garbage collection output. As more and more Interviewer is asking a question
    to check the candidate’s ability to understand `GC` output, this topic becomes
    even more important.


    ## Question 3 - What is the difference between ParNew and DefNew Young Generation
    Garbage collector?


    **Answer**: This Garbage Collection interview question is recently asked one of
    my friends. It requires more than average knowledge on `GC` to answer this question.


    By the way, `ParNew` and `DefNew` are two young generation garbage collector.
    `ParNew` is a multi-threaded `GC` used along with concurrent Mark Sweep while
    `DefNew` is single-threaded `GC` used along with Serial Garbage Collector.


    And, if you are serious about improving your advanced JVM skill and learn things
    like taking and analyzing heap dumps then highly recommend you to join Java Application
    Performance and Memory Management course on Udemy.


    ## Question 4 - How do you find GC resulted due to calling System.gc()?


    **Answer**: Another `GC` interview question which is based on `GC` output. Similar
    to the major and minor collection, there will be the word “`System`” included
    in the Garbage collection output.


    ## Question 5 - What is the difference between Serial and Throughput Garbage collectors?


    **Answer**: Serial Garbage collector is a stop the world `GC` which stops application
    thread from running during both minor and major collection. Serial Garbage collector
    can be enabled using JVM option `-XX:UseSerialGC` and it’s designed for Java application
    which doesn’t have pause time requirement and has client configuration.


    The Serial Garbage collector also defaulted `GC` in JDK 1.4 before ergonomics
    was introduced in JDK 1.5. `Serial GC` is most suited for small applications with
    fewer threads while throughput `GG` is more suited for large applications. On
    the other hand Throughput garbage collector is a parallel collector where minor
    and major collection happens in parallel taking full advantage of all the system
    resources available like multiple processor.


    Though both major and minor collection runs on stop-the-world fashion and introduced
    pause in the application. Throughput Garbage collector can be enable using `-XX:UseParallelGC`
    or `-XX:UseOldParallelGC`.


    It increases the overall throughput of application my minimizing time spent in
    Garbage collection but still has long pauses during full `GC`. This is a kind
    of Garbage collection interview question that gives you an opportunity to show
    your knowledge in detail while answering. I always suggest answering these kinds
    of questions in detail.


    ## Question 6 – When does an Object becomes eligible for Garbage collection in
    Java?


    **Answer**: An object becomes eligible for garbage collection when there is no
    live reference for that object or it can not be reached by any live thread. Cyclic
    reference doesn’t count as live reference and if two objects are pointing to each
    other and there is no live reference for any of them, than both are eligible for
    `GC`. Also Garbage collection thread is a daemon thread which will run by `JVM`
    based upon `GC` algorithm and when runs it collects all objects which are eligible
    for `GC`.


    ## Question 7 - What is finalize method in Java ? When does Garbage collector
    calls finalize method in Java?


    **Answer**: Finalize method in Java also called finalizer is a method defined
    in `java.lang.Object` and called by Garbage collector before collecting any object
    which is eligible for `GC`. `finalize()` method provides last chance to object
    to do cleanup and free any remaining resource.


    ## Question 8 - If Object A has reference to Object B and Object B refer to Object
    A, apart from that there is no live reference to either object A or B, Does they
    are eligible to Garbage collection?


    This Garbage collection interview questions is related question 5 “When object
    become eligible for Garbage collection”. An object becomes eligible for Garbage
    collection if there is no live reference for it. It can not be accessible from
    any Thread and cyclic dependency doesn’t prevent Object from being Garbage collected.
