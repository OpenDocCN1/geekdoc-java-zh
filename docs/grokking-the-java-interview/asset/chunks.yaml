    GROKKING THE JAVA INTERVIEW


    37) What happens if you submit a task when the queue of the thread pool is already
    filled?


    This is another tricky question on my list. Many programmers will think that it
    will block until a task is cleared but its true. ThreadPoolExecutor’s submit()
    method throws RejectedExecutionException if the task cannot be scheduled for execution.


    38) What is the difference between the submit() and execute() method thread pool
    in Java?


    Both methods are ways to submit a task to thread pools but there is a slight difference
    between them. execute(Runnable command) is defined in Executor interface and executes
    given task in future, but more importantly, it does not return anything. Its return
    type is void. On other hand submit() is an overloaded method, it can take either
    Runnable or Callable task and can return Future object which can hold the pending
    result of computation. This method is defined on ExecutorService interface, which
    extends Executor interface, and every other thread pool class e.g. ThreadPoolExecutor
    or ScheduledThreadPoolExecutor gets these methods.


    39) What is blocking method in Java?


    A blocking method is a method which blocks until the task is done, for example,
    accept() method of ServerSocket blocks until a client is connected. here blocking
    means control will not return to the caller


