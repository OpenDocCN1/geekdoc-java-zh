    # 回答：这是一个棘手的垃圾回收面试题，因为许多程序员并不确定 PermGen（永久代）是否是 Java 堆空间，由于它维护了类元数据和字符串池，它是否符合垃圾回收的条件。顺便说一下，垃圾回收确实会在
    PermGen 空间发生，如果 PermGen 空间满了或超过阈值，就会触发 Full GC（全垃圾回收）。如果你查看 GC 输出，你会发现 PermGen
    空间也会被垃圾回收。这就是为什么正确设置 PermGen 空间的大小对于避免频繁 Full GC 非常重要。你可以通过 JVM 参数 `-XX:PermGenSize`
    和 `-XX:MaxPermGenSize` 来控制 PermGen 空间的大小。


    ![](img/Garbage_Collection_and_JVM_parameters.jpg)


    ## 问题 11：如何监控垃圾回收活动？


    **答案**：我最喜欢的垃圾回收面试题之一，用来检查候选人是否曾经监控过 GC 活动。你可以离线或实时监控垃圾回收活动。你可以使用 `JConsole` 和带有
    `Visual GC` 插件的 `VisualVM` 虚拟机来监控 `JVM` 的实时垃圾回收活动和内存状态，或者使用 `-XlogGC=<PATH>` JVM
    参数将垃圾回收输出重定向到日志文件中进行离线分析。无论如何，你应该始终开启 GC 选项如 `-XX:PrintGCDetails`、`-X:verboseGC`
    和 `-XX:PrintGCTimeStamps`，因为它们对应用程序性能的影响不大，但为性能监控提供了有用状态。


    ## 问题 12：查看下方的垃圾回收输出并回答以下问题：


    ```

    [GC

    [ParNew: 1512K->64K(1512K), 0.0635032 secs]

    [15604K->13569K(600345K), 0.0636056 secs]

    [Times: user=0.03 sys=0.00, real=0.06 secs]

    ```


    1. 此输出是 Major Collection（主回收）还是 Minor Collection（ Minor 回收）？

    2. 使用了哪种年轻代（Young Generation）垃圾回收器？

    3. 年生代、老年代（Old Generation）和总堆内存的大小是多少？

    4. 垃圾回收释放了多少内存？

    5. 垃圾回收花费了多少时间？

    6. 年轻代的当前占用率是多少？


    这些垃圾回收面试题完全基于 GC 输出。以下是上述 GC 问题的答案，不仅能帮助你回答这些问题，还能帮助你理解和解释 GC 输出。


    **答案 1**：因为有“GC”字样，它是 Minor collection。在 Major collection 的情况下，你会看到“Full GC”。


    **答案 2**：此输出是多线程年轻代垃圾回收器 `ParNew` 的输出，它与 `CMS` 并发垃圾回收器一起使用。


    **答案 3**：括号中的 `[1512K]` 是年轻代的总大小，包括 Eden 区和两个幸活区（surviv space）。箭头左侧的 `1512K` 是
    GC 前年轻代的占用情况，`64K` 是 GC 后的占用。下一行括号中的值是总堆大小，即 `(600345K)`。如果我们从总堆大小中减去年轻代的大小，就可以计算出老年代的大小。这一行也显示了回收前后的堆占用情况。


    **答案 4**：如之前的垃圾回收面试题所示，第二行显示了回收前后的堆占用。如果我们将右侧的值 `13569K` 减去左侧的值 `15604K`，就可以得到
    GC 释放的总内存。


    **答案 5**：第二行的 `0.0636056 secs` 表示在垃圾回收期间收集死亡对象花费的总时间。它也包括回收年轻代花费的时间，如第一行所示的 `(0635032
    secs)`。


    **答案 6**：`64K`


    这里有几个更多有趣的垃圾回收面试题供你练习。


    * **问题**：`-XX:ParallelGC` 和 `-XX:ParallelOldGC` 之间有什么区别？

    * **问题**：你什么时候使用 `ConcurrentMarkSweep` 垃圾回收器和 `Throughput GC`？

    * **问题**：`ConcurrentMarkSweep` 和 `G1` 垃圾回收器之间有什么区别？

    * **问题**：你做过任何垃圾回收调优吗？你的方法是什么？


    # 泛型（Generics）面试题


    Java 面试中的泛型面试题已经变得越来越常见，自从 Java 5 出现以来已经很长时间了，许多应用程序都迁移到了 Java 5，且几乎所有的新 Java
    开发都在 Tiger（Java 5 的代号）上进行。泛型的重要性以及 Java 5 特性如 `Enum`、`Autoboxing`（自动装箱）、varargs
    以及像 `CountDownLatch`、`CyclicBarrier` 和 `BlockingQueue` 等集合工具在 Java 面试中变得越来越流行。如果你熟悉有界和无界泛型通配符、泛型的内部工作原理、类型擦除（type
    erasure）以及熟悉在 Java 中编写参数化泛型类和方法，泛型面试题可能会变得非常棘手。


    准备泛型面试最好的方法是尝试根据泛型的各种特性编写简单的程序。无论如何，在 Java 面试部分，我们将看到一些流行的 Java 泛型面试题及其答案。


    顺便说，Javarevisited 提供了大量的材料来更好地准备 Java 和 J2EE 面试，你可以通过“15 道多线程面试题”和“前 10 道 Java
    集合面试题”以及关于 Spring、Struts、JSP 和 Servlet 的其他几个问答章节来准备多线程和集合。


    如果你是 GUI 开发人员且在 Java Swing 中工作，你也可以查看投资银行中经常问的 Java Swing 面试题。


    不再浪费你的时间，这里是 Java 面试中经常问的泛型概念面试题：


    ### 1. 什么是 Java 泛型？使用泛型的优点是什么？


    这是泛型面试中最基础的问题之一，通常针对初级和中级水平。那些从 Java 5 之前过来的人知道在集合中存储对象在使用之前将其转换回正确类型有多么不。泛型解决了这些问题。它提供了编译时的类型安全，并确保向集合插入正确的类型，从而避免运行时的
    `ClassCastException`。


    ### 2. 泛型是如何工作的？什么是类型擦除？


    这是一个泛型中很好的面试题。泛型通过类型擦除实现，编译器在编译时擦除所有类型相关信息，运行时无法获取类型相关信息。例如 `List<String>` 在运行时被表示为
    `List`。这样做是为了确保与 Java 5 之前开发的库具有二进制兼容性。你在运行时无法访问类型参数，泛型类型会被编译器翻译为原始类型（Raw type）。根据你的回答，可能会得到许多基于此泛型面试题的后续问题，例如：为什么泛型通过类型擦除实现或演示某些会导致编译错误的无效泛型代码。


    ### 3. 什么是泛型中的有界和无界通配符？


    这是另一个非常流行的 Java 泛型面试题。有界通配符是对类型施加边界的通配符。有两种种类：`<? extends T>` 施加了上界，确保类型必须是 `T`
    的子类；`<? super T>` 施加了下界，确保类型必须是 `T` 的父类。这种泛型类型必须用边界内的类型实例化，否则会导致编译错误。


    相反，`<?>` 代表无界类型，因为 `<?>` 可以被任何类型替换。


