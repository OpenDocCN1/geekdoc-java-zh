  trans: '

    Java 内存模型（Java Memory model）是一组规则和指南，允许 Java 程序在不同的内存架构、CPU 和操作系统上以确定性的行为运行。它在多线程情况下尤为重要。Java
    内存模型为一个线程所做的更改对其他线程可见提供了某些保证，其中之一就是“发生之前”（happens-before）关系。这种关系定义了几条规则，允许程序员预测和推理并发
    Java 程序的行为。例如，“发生之前”关系保证了：


    - 线程中的每个动作都发生在该线程中在程序顺序上之后的每个动作之前，这被称为程序顺序规则（program order rule）。

    - 对监视器锁（monitor lock）的解锁发生在对同一个监视器锁的后续任何锁定之前，也称为监视器锁规则（Monitor lock rule）。

    - 对 `volatile` 字段的写入发生在该字段的后续任何读取之前，被称为 volatile 变量规则（Volatile variable rule）。

    - 对线程调用 `Thread.start()` 发生在任何其他线程检测到该线程已终止之前（无论是成功从 `Thread.join()` 返回，还是通过 `Thread.isAlive()`
    返回 false），也称为线程启动规则（Thread start rule）。

    - 一个线程对另一个线程调用 `interrupt()` 发生在被中断线程检测到中断之前（无论是通过抛出 `InterruptedException`，还是调用
    `isInterrupted` 或 `interrupted`），俗称为线程中断规则（Thread Interruption rule）。

    - 对象构造函数的结束发生在该对象终结器（finalizer）开始之前，被称为终结器规则（Finalizer rule）。

    - 如果 A 发生在 B 之前，且 B 发生在 C 之前，那么 A 发生在 C 之前，这意味着“发生之前”保证具有传递性（Transitivity）。


    我强烈建议阅读《并发编程》（Java Concurrency in Practice）的第 16 章，以更详细了解 Java 内存模型。


    ## 10) Java 中的 `volatile` 变量是什么？


    `Volatile` 是一种特殊的修符，只能用于实例变量。在并发 Java 程序中，在没有 `synchronized` 关键字或锁等同步器的情况下，多个线程对实例变量所做的更改对其他线程是不可见的。`volatile`
    变量保证写入发生在任何后续读取之前：如上一个问题所述：“volatile 变量规则”。


    ## 11) 什么是线程安全？`Vector` 是线程安全的类吗？


    线程安全是对象或代码的属性，保证如果以任何方式被多个线程（例如读与写）执行或使用，其行为将符合预期。例如，一个线程安全的计数器对象，如果该计数器的同一个实例在多个线程之间共享，它不会遗漏任何计数。显然，你也可以将集合类分为两类：线程安全和非线程安全。`Vector`
    确实是一个线程安全的类，它通过同步修改 `Vector` 状态的方法来实现线程安全；另一方面，它的对应类 `ArrayList` 不是线程安全的。


    ## 12) Java 中的竞态条件（race condition）是什么？请举例。


    竞态条件是 Java 程序处于并发执行环境时导致某些细微编程错误的原因。正如其名所示，竞态条件由于多个线程之间的竞争产生，如果本应该先执行的线程输掉了竞争并变为后执行，代码的行为就会改变，表现为非确定性的
    bug。由于线程之间竞争的随机性，这是最难发现和重现的 bug 之一。


    ## 13) 如何在 Java 中停止线程？


    我总是说 Java 为一切都提供了丰富的 API，但讽刺的是 Java 并没有提供可靠的停止线程的方法。JDK 1.0 中曾有一些控制方法，例如 `stop()`、`suspend()`
    和 `resume()`，由于潜在的死锁威胁，它们在后续版本中被弃用了，从那时起 Java API 设计师并没有努力提供一种一致、线程安全且优雅的停止线程的方法。程序员主要依赖线程在完成
    `run()` 或 `call()` 方法执行后会自动停止这一事实。要进行手动停止，程序员要么利用 `volatile` 布尔变量并在每次迭代中检查 `run`
    方法是否有循环，要么通过中断线程来强制取消任务。


    ## 14) 当线程中发生 `Exception` 会发生什么？


    这是我在面试中见过非常不错且带有陷阱的 Java 问题。简单来说，如果不捕获，线程将死亡；如果注册了未捕获异常处理器，则它会收到回调。`Thread.UncaughtExceptionHandler`
    是一个接口，定义为嵌套接口，用于当 `Thread` 因未捕获的异常意外终止时调用的处理器。当线程因未捕获的异常即将终止时，Java 虚拟机将使用 `Thread.getUncaughtExceptionHandler()`
    查询线程的 `UncaughtExceptionHandler`，并调用处理器的 `uncaughtException()` 方法，将线程和异常作为参数传递。


    ## 15) 如何在 Java 两个线程之间共享数据？


    你可以通过使用共享对象或 `BlockingQueue` 等并发数据结构在线程之间共享数据。请看此教程学习 Java 中的线程间通信。它使用 `wait`
    和 `notify` 方法实现了生产者-消费者模式，这涉及在两个线程之间共享对象。


    ![](img/Inter_thread_Communication_in_Java.jpg)


    ## 16) Java 中 `notify` 和 `notifyAll` 有什么区别？


    这是核心 Java 面试中的另一个陷阱问题，因为多个线程可能在同一个监视器锁上等待，Java API 设计师提供了方法在等待条件变化时仅通知其中一个或所有线程，但他们只提供了一部分实现。`notify()`
    方法没有提供选择特定线程的方法，因此它只在你知道只有一个线程在等待时才有用。另一方面，`notifyAll()` 向所有线程发送通知并允许它们竞争锁，这确保了至少会有一个线程能够继续向下执行。


    ## 17) 为什么 `wait`、`notify` 和 `notifyAll` 不在`thread` 类中？


    这是一个与设计相关的问题，检查候选人对现有系统的看法，或者他是否考虑过某些非常常见但起初看起来不恰当的东西。为了回答这个问题，你必须给出说明为什么这三个方法放在
    `Object` 类中是有意义的而不是放在 `Thread` 类中。一个明显的原因是，Java 提供了对象级别的锁，而不是线程级别的锁。每个对象都有锁，并由线程获取。现在，如果线程需要等待某个锁，那么在该对象上调用
    `wait()` 比在线程上调用更合理。如果 `wait()` 方法声明在 `Thread` 类上，那么将不清楚线程正在等待的是哪把锁。简而言之，由于 `wait`、`notify`
    和 `notifyAll` 在锁级别操作，因此在对象类（object class）中定义它们是合理的，因为锁属于对象。


    ## 18) Java 中的 `ThreadLocal` 变量是什么？


    `ThreadLocal` 变量是 Java 程序员可用的一种特殊变量。就像实例变量是每个实例一个一样，`ThreadLocal` 变量是每个线程一个。它是实现创建成本对象线程安全的良好方法，例如，你可以使用
    `ThreadLocal` 使得 `SimpleDateFormat` 线程安全。由于该类创建开销大，在局部作用域内使用它并不好，因为每次调用都需要独立的实例。通过为每个线程提供自己的副本，你可以一箭双雕：首先，通过重用固定数量的实例减少了实例数量；其次，在不支付同步或不可变性代价的情况下实现了线程安全。线程本地变量另一个很好的例子是
    `ThreadLocalRandom` 类，它减少了多线程环境中创建开销较大的 `Random` 对象的实例。


    ## 19) 什么是 `FutureTask`？


    '
- fmt: '

    `FutureTask` represents a cancellable asynchronous computation in concurrent Java
    application. This class provides a base implementation of `Future`, with methods
    to start and cancel a computation, query to see if the computation is complete,
    and retrieve the result of the computation. The result can only be retrieved when
    the computation has completed; the `get` methods will block if the computation
    has not yet completed. A `FutureTask` object can be used to wrap a `Callable`
    or `Runnable` object. Since `FutureTask` also implements `Runnable`, it can be
    submitted to an `Executor` for execution.


    ## 20) What is the difference between the `interrupted()` and `isInterrupted()`
    method in Java?


    Main difference between `interrupted()` and `isInterrupted()` is that former clears
    the interrupt status while later does not. The interrupt mechanism in Java multi-threading
    is implemented using an internal flag known as the interrupt status. Interrupting
    a thread by calling `Thread.interrupt()` sets this flag. When interrupted thread
    checks for an interrupt by invoking the static method `Thread.interrupted()`,
    interrupt status is cleared. The non-static `isInterrupted()` method, which is
    used by one thread to query the interrupt status of another, does not change the
    interrupt status flag. By convention, any method that exits by throwing an `InterruptedException`
    clears interrupt status when it does so. However, it’s always possible that interrupt
    status will immediately be set again, by another thread invoking `interrupt`.


    ## 21) Why `wait` and `notify` method are called from `synchronized` block?


    Main reason for calling `wait` and `notify` method from either `synchronized`
    block or method is that it made mandatory by Java API. If you don’t call them
    from synchronized context, your code will throw `IllegalMonitorStateException`.
    A more subtle reason is to avoid the race condition between `wait` and `notify`
    calls.


    ## 22) Why should you check condition for waiting in a loop?


    Its possible for a waiting thread to receive false alerts and spurious wake up
    calls, if it doesn’t check the waiting condition in loop, it will simply exit
    even if condition is not met. As such, when a waiting thread wakes up, it cannot
    assume that the state it was waiting for is still valid.  It may have been valid
    in the past, but the state may have been changed after the `notify()` method was
    called and before the waiting thread woke up. That’s why it always better to call
    `wait()` method from loop, you can even create template for calling `wait` and
    `notify` in Eclipse. To learn more about this question, I would recommend you
    to read `Effective Java` items on thread and synchronization.


    ## 23) What is the difference between `synchronized` and concurrent collection
    in Java?


    Though both `synchronized` and concurrent collection provides thread-safe collection
    suitable for multi-threaded and concurrent access, later is more scalable than
    former. Before Java 1.5, Java programmers only had synchronized collection which
    becomes source of contention if multiple thread access them concurrently, which
    hampers scalability of system. Java 5 introduced concurrent collections like `ConcurrentHashMap`,
    which not only provides thread-safety but also improves scalability by using modern
    techniques like lock stripping and partitioning internal table.


    ## 24) What is the difference between `Stack` and `Heap` in Java?


    Why does someone this question as part of multi-threading and concurrency? because
    `Stack` is a memory area which is closely associated with threads. To answer this
    question, both `stack` and `heap` are specific memories in Java application. Each
    thread has their own `stack`, which is used to store local variables, method parameters
    and call stack. Variable stored in one `Thread`’s `stack` is not visible to other.
    On another hand, the `heap` is a common memory area which is shared by all threads.
    Objects whether local or at any level is created inside `heap`. To improve performance
    thread tends to cache values from `heap` into their `stack`, which can create
    problems if that variable is modified by more than one thread, this is where `volatile`
    variables come into the picture. `volatile` suggest threads read the value of
    variable always from main memory.


    ![](image/Heap_vs_Stack_in_Java.jpg)


    ## 25) What is thread pool? Why should you thread pool in Java?


    Creating thread is expensive in terms of time and resource. If you create thread
    at time of request processing it will slow down your response time, also there
    is only a limited number of threads a process can create. To avoid both of these
    issues, a pool of thread is created when application starts up and threads are
    reused for request processing. This pool of thread is known as “thread pool” and
    threads are known as worker thread. From JDK 1.5 release, Java API provides `Executor`
    framework, which allows you to create different types of thread pools e.g. single
    thread pool, which process one task at a time, fixed thread pool (a pool of fixed
    number of threads) or cached thread pool (an expandable thread pool suitable for
    applications with many short lived tasks).


    ## 26) Write code to solve Producer Consumer problem in Java?


    Most of the threading problem you solved in the real world are of the category
    of Producer consumer pattern, where one thread is producing task and another thread
    is consuming that. You must know how to do inter thread communication to solve
    this problem. At the lowest level, you can use `wait` and `notify` to solve this
    problem, and at a high level, you can leverage `Semaphore` or `BlockingQueue`
    to implement Producer consumer pattern.


    ## 27) How do you avoid deadlock in Java? Write Code?


    ![](image/deadlock_in_Java.jpg)


    Deadlock is a condition in which two threads wait for each other to take action
    which allows them to move further. It’s a serious issue because when it happen
    your program hangs and doesn’t do the task it is intended for. In order for deadlock
    to happen, following four conditions must be true:


    - **Mutual Exclusion**: At least one resource must be held in a non-shareable
    mode. Only one process can use the resource at any given instant of time.

    - **Hold and Wait**: A process is currently holding, at least, one resource and
    requesting additional resources which are held by other processes.

    - **No Pre-emption**: The operating system must not de-allocate resources once
    they have been allocated; they must be released by the holding process voluntarily.

    - **Circular Wait**: A process must be waiting for a resource which is being held
    by another process, which in turn is waiting for the first process to release
    the resource.


    The easiest way to avoid deadlock is to prevent Circular wait, and this can be
    done by acquiring locks in a particular order and releasing them in reverse order
    so that a thread can only proceed to acquire a lock if it held the other one.


    ## 28) What is the difference between livelock and deadlock in Java?


    This question is extension of previous interview question. A livelock is similar
    to a deadlock, except that the states of the threads or processes involved in
    the livelock constantly change with regard to one another, without any one progressing
    further. Livelock is a special case of resource starvation. A real-world example
    of livelock occurs when two people meet in a narrow corridor, and each tries to
    be polite by moving aside to let the other pass, but they end up swaying from
    side to side without making any progress because they repeatedly move the same
    way at the same time. In short, the main difference between livelock and deadlock
    is that in former state of process change but no progress is made.


