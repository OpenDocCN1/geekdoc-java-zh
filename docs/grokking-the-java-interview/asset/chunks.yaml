    \ `List` 声明都是边界通配符的示例：`List<? extends T>` 会接受任何类型自 `T` 的 `List`，而 `List<? super\
    \ T>` 会接受任何类型为 `T` 的父类的 `List`。例如 `List<? extends Number>` 可以接受 `List<Integer>`\
    \ 或 `List<Float>`。更多信息请参见上方链接。\n\n## 5. 如何编写一个接受泛型参数并返回泛型类型的方法？\n\n编写泛型方法并不困难，与其使用原始类型（raw\
    \ type），你只需要使用泛型类型如 `T`、`E` 或 `K,V`，这些是类型、元素、键和值的常用占位符。可以参考 Java 集合框架中泛型方法的示例。在最简单的形式下，泛型方法看起来如下：\n\
    \n```java\npublic V put(K key, V value) {\n    return cache.put(key, value);\n\
    }\n```\n\n## 6. 如何在 Java 中使用泛型编写参数化类？\n\n这是之前 Java 泛型面试题的扩展。面试官可能不会要求编写泛型方法，而是要求使用泛型编写一个类型安全的类。同样，关键在于不要使用原始类型，而要使用泛型类型，并始终使用\
    \ JDK 中的标准占位符。\n\n## 7. 写一个程序使用泛型实现 LRU 缓存？\n\n这是任何喜欢用 Java 编程的人的练习。一个提示是 `LinkedHashMap`\
    \ 可以实现固定大小的 LRU 缓存，当缓存满时需要移除最旧条目。`LinkedHashMap` 提供了一个名为 `removeEldestEntry()`\
    \ 的方法，该方法会被 `put()` 和 `putAll()` 调用，并用于指示移除最旧条目。只要你编写了带有 JUnit 测试的可运行版本，你可以自由提出自己的实现方案。\n\
    \n## 8. 你可以将 `List<String>` 传递给接受 `List<Object>` 的方法吗？\n\n这个 Java 泛型面试题对于不熟悉泛型的人来说可能看起来很困惑，因为第一眼看去\
    \ `String` 是一个对象，所以 `List<String>` 可以用于需要 `List<Object>` 的地方，但事实并非如此。这会导致编译错误。如果你进一步思考，这是有意义，因为\
    \ `List<Object>` 可以存储任何内容，包括 `String`、`Integer` 等，但 `List<String>` 只能存储 `String`。\n\
    \n```java\nList<Object> objectList;\nList<String> stringList;\n\nobjectList =\
    \ stringList; //编译错误：类型不兼容\n```\n\n## 9. 可以在数组上使用泛型吗？\n\n这可能是 Java 中最简单的泛型面试题了，如果你知道数组不支持泛型，这就是\
    \ Joshua Bloch 在《Effective Java》中建议优先使用 `List` 而非 `Array` 的原因，因为 `List` 可以提供比编译时的类型安全性。\n\
    \n## 10. 如何在 Java 中抑制未检查警告（unchecked warning）？\n\nJava 5 的 `javac` 编译器在混合使用原始类型和泛型类型时会生成未检查警告，例如：\n\
    \n```java\nList<String> rawList = new ArrayList()\n```\n\n注意：`Hello.java` 使用了未检查或不安全的操作；可以使用\
    \ `@SuppressWarnings(\"unchecked\")` 注解来抑制它。\n\n我还有几个关于 Java 泛型的面试题要与大家分享，这些问题关注于泛型类型与原始类型之间的区别，以及是否可以使用\
    \ Object 代替边界通配符等：\n\n### Java 中 `List<Object>` 和原始类型 `List` 的区别？\n\n原始类型与参数化类型\
    \ `List<Object>` 之间的主要区别是，编译器在编译时不会检查原始类型的类型安全性，但会对参数化类型进行检查。通过使用 `Object` 作为类型，它告诉编译器它可以持有任何类型的对象，例如\
    \ `String` 或 `Integer`。\n\n这个 Java 泛型面试题基于对泛型中原始类型的正确理解。无论如何，它们的第二个区别是你可以将任何参数化类型传递给原始类型\
    \ `List`，但你不能将 `List<String>` 传递给任何接受 `List<Object>` 的方法，会导致编译错误。\n\n### Java\
    \ 中 `List<?>` 和 `List<Object>` 的区别？\n\n这个泛型面试题可能与之前的题目有关，但完全不同。`List<?>` 是未知类型的\
    \ `List`，而 `List<Object>` 本质上是任何类型的 `List`。你可以将 `List<String>`、`List<Integer>`\
    \ 赋值给 `List<?>`，但不能将 `List<String>` 赋值给 `List<Object>`。\n\n```java\nList<?> listOfAnyType;\n\
    List<Object> listOfObject = new ArrayList<Object>();\nList<String> listOfString\
    \ = new ArrayList<String>();\nList<Integer> listOfInteger = new ArrayList<Integer>();\n\
    \nlistOfAnyType = listOfString; //合法\nlistOfAnyType = listOfInteger; //合法\nlistOfObjectType\
    \ = (List<Object>) listOfString; //编译错误 - 类型不可转换\n```\n\n要了解更多信息请参见 Java 泛型通配符示例\n\
    \n### `List<String>` 和原始类型 `List` 的区别。\n\n这个泛型面试题类似于原始类型与参数化类型之间的区别。参数化类型是类型安全的，编译器会保证类型安全性，但\
    \ `List` 原始类型不是类型安全的。你不能在 `String` 的 `List` 中存储任何其他对象，但在原始 `List` 中可以存储任何对象。泛型参数化类型不需要强制转换，但原始类型则需要显式强制转换。\n\
    \n```java\nList listOfRawTypes = new ArrayList();\nlistOfRawTypes.add(\"abc\"\
    );\nlistOfRawTypes.add(123); //编译器会允许 - 运行时异常\n\nString item = (String) listOfRawTypes.get(0);\
    \ //需要显式强制转换\nitem = (String) listOfRawTypes.get(1); // 因为 Integer 转换为 String\
    \ 会产生 ClassCastException\n\nList<String> listOfString = new ArrayList();\nlistOfString.add(\"\
    abcd\");\nlistOfString.add(1234); //编译错误\nitem = listOfString.get(0); //不需要显式强制转换```\n\
    \n这些是 Java 中经常问到的泛型问题和答案。这些泛型面试题并不难，实际上，它们是基于泛型的基础知识的。任何对泛型有一定了解的 Java 程序员都应该熟悉这些问题。\n"
- fmt: "\n# Answer: One of the first JDBC interview questions in most of the interviews.\
    \ JDBC is java database connectivity as name implies it’s a java `API` for communicating\
    \ to relational database, API has java classes and interfaces using that developer\
    \ can easily interact with with database. For this we need database specific `JDBC`\
    \ drivers. Some time this also result in followup questions like Difference between\
    \ type 2 and type 4 `JDBC` drivers. See the link for answer.\n\n# Question 2:\
    \ What are the main steps in java to make JDBC connectivity?\n\n# Answer : Another\
    \ beginner level JDBC Interview question, mostly asked on telephonic interviews.\
    \ Here are main steps to connect to database.\n\n1. **Load the Driver**: First\
    \ step is to load the database specific driver which communicates with database.\n\
    2. **Make Connection**: Next step is get connection from the database using `connection`\
    \ object, which is used to send SQL statement also and get result back from the\
    \ database.\n3. **Get Statement Object**: From `connection` object we can get\
    \ `statement` object which is used to query the database.\n4. **Execute the Query**:\
    \ Using `statement` object we execute the SQL or database query and get result\
    \ set from the query.\n5. **Close the connection**: After getting resultset and\
    \ all required operation performed the last step should be closing the database\
    \ connection.\n\n# Question 3: What is the mean of “dirty read“ in database?\n\
    \n# Answer : This kind of JDBC interview question is asked on 2 to 4 years experience\
    \ Java programmer, they are expected to familiar with database transaction and\
    \ isolation level etc. As the name it self convey the meaning of dirty read “read\
    \ the value which may or may not be correct”. in database when one transaction\
    \ is executing and changing some field value same time some another transaction\
    \ comes and read the change field value before first transaction commit or rollback\
    \ the value ,which cause invalid value for that field, this scenario is known\
    \ as dirty read.\n\n# Question 4: What is the 2 phase commit?\n\n# Answer : This\
    \ is one of the most popular JDBC Interview question and asked at advanced level,\
    \ mostly to senior Java developers on J2EE interviews. Two phase commit is used\
    \ in distributed environment where multiple process take part in distributed transaction\
    \ process. In simple word we can understand like if any transaction is executing\
    \ and it will effect multiple database then two phase commit will be used to make\
    \ all database synchronized with each other.\n\nIn two phase commit, commit or\
    \ rollback is done by two phases:\n\n1. **Commit request phase**: in this phase\
    \ main process or coordinator process take vote of all other process that they\
    \ are complete their process successfully and ready to commit if all the votes\
    \ are “yes” then they go ahead for next phase. And if “No “ then rollback is performed.\n\
    2. **Commit phase**: according to vote if all the votes are yes then commit is\
    \ done.\n\nSimilarly when any transaction changes multiple database after execution\
    \ of transaction it will issue pre commit command on each database and all database\
    \ send acknowledgement and according to acknowledgement if all are positive transaction\
    \ will issue the commit command otherwise rollback is done.\n\n# Question 5: What\
    \ are different types of Statement?\n\n# Answer : This is another classical JDBC\
    \ interview question. Variants are Difference between `Statement`, `PreparedStatemetn`\
    \ and `CallableStatement` in Java. `Statement` object is used to send SQL query\
    \ to database and get result from database, and we get statement object from connection\
    \ object. \n\nThere are three types of statement:\n\n1. **Statement**: it’s a\
    \ commonly used for getting data from database useful when we are using static\
    \ SQL statement at runtime. it will not accept any parameter.\n```java\nStatement\
    \ stmt = conn.createStatement( );\nResultSet rs = stmt.executeQuery();\n```\n\
    2. **PreparedStatement**: when we are using same SQL statement multiple time its\
    \ is useful and it will accept parameter at runtime.\n```java\nString SQL = “Update\
    \ stock SET limit = ? WHERE stockType = ?”;\nPreparedStatement pstmt = conn.prepareStatement(SQL);\n\
    ResultSet rs = pstmt.executeQuery();\n```\n3. **Callable Statement**: when we\
    \ want to access stored procedures then callable statement are useful and they\
    \ also accept runtime parameter. It is called like this\n```java\nCallableStatement\
    \ cs = con.prepareCall(“{call SHOW_SUPPLIERS}”);\nResultSet rs = cs.executeQuery();\n\
    ```\n\n# Question 6: How cursor works in scrollable result set?\n\n# Answer :\
    \ Another tough JDBC Interview question, not many Java programmer knows about\
    \ using Cursor in Java.\n\nIn `JDBC` 2.0 `API` new feature is added to move cursor\
    \ in resultset backward forward and also in a particular row . There are three\
    \ constant define in result set by which we can move cursor.\n\n- `TYPE_FORWARD_ONLY`:\
    \ creates a nonscrollable result set, that is, one in which the cursor moves only\
    \ forward\n- `TYPE_SCROLL_INSENSITIVE`: a scrollable result set does not reflects\
    \ changes that are made to it while it is open\n- `TYPE_SCROLL_SENSITIVE`: a scrollable\
    \ result set reflects changes that are made to it while it is open\n\n# Question\
    \ 7: What is connection pooling?\n\n# Answer : This is also one of the most popular\
    \ question asked during JDBC Interviews. Connection pooling is the mechanism by\
    \ which we reuse the recourse like connection objects which are needed to make\
    \ connection with database .In this mechanism client are not required every time\
    \ make new connection and then interact with database instead of that connection\
    \ objects are stored in `connection pool` and client will get it from there. so\
    \ it’s a best way to share a server resources among the client and enhance the\
    \ application performance. If you use `Spring` framework, then you can also refer\
    \ How to setup JDBC Connection Pool using Spring in Java\n\n# Question 8: What\
    \ do you mean by cold backup, hot backup?\n\n# Answer: This question is not directly\
    \ related to `JDBC` but some time asked during JDBC interviews. The cold back\
    \ is the backup technique in which backup of files are taken before database restarted.\
    \ In hot backup of files and table is taken at the same time when database is\
    \ running. A warm is a recovery technique where all the tables are locked and\
    \ users cannot access at the time of backing up data.\n\n# Question 9: What are\
    \ the locking system in JDBC?\n\n# Answer : One more tough JDBC question to understand\
    \ and prepare. There are 2 types of locking in `JDBC` by which we can handle multiple\
    \ user issue using the record. if two user are reading the same record then there\
    \ is no issue but what if users are updating the record , in this case changes\
    \ done by first user is gone by second user if he also update the same record\
    \ .so we need some type of locking so no lost update.\n\n- **Optimistic Locking**:\
    \ optimistic locking lock the record only when update take place. Optimistic locking\
    \ does not use exclusive locks when reading\n- **Pessimistic locking**: in this\
    \ record are locked as it selects the row to update\n\n# Question 10: Does the\
    \ JDBC-ODBC Bridge support multiple concurrent open statements per connection?\n\
    \n# Answer: No, we can open only one `Statement` object when using the `JDBC-ODBC\
    \ Bridge`.\n\nThat’s all on this list of 10 JDBC Interview questions with answers.\
    \ As I said `JDBC` `API` and their concepts are integral parts of any Java interview\
    \ and there is always at least one question from `JDBC`. Since most application\
    \ uses a database in the backend, `JDBC` becomes critical for any Java developer.\n"
