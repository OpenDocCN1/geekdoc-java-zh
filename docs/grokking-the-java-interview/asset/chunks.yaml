    `JDK 8` 的发布改变了我们编写 Java 的方式。凭借新的函数式编程范式和强大的 `Stream API`，大多数新的 Java 代码都是以函数式风格编写的。这意味着在
    Java 面试中，关于 `Stream` 和函数式编程的问题正在不断增加。如果你不熟悉 `Java 8` 的变化，那么现在很难通过 Java 面试。虽然文中没有明说，但大多数公司，特别是像
    `Barclays`、`Citi` 和 `Goldman Sachs` 这样的投资银行，现在要求 Java 开发者至少了解 `Java 8`，这也是件好事，对吧？`Java
    11` 已经发布，我们还在期待几个月后的 `Java 12`，所以了解 `Java 8` 的变化是有意义的。


    所有问题都是针对 Java 开发者的，并与 `JDK 8` 中为 Java 开发者提供的函数式编程概念和工具有关。


    老实说，尽管这些是常问的 `Java 8` 面试题，但它们一点都不难，关注的是核心的 `Java 8` 概念，而不是复杂的实现。它们也不是深度侧重函数式编程，但如果你对像
    `Scala` 和 `Haskel` 那种真正的函数式编程感兴趣，我建议你查看带有 `Scala` 的入门函数式编程课程。我几天前刚花 11 美元买了它，真的非常棒。


    话不多说，这里有一份针对 Java 程序员的一些常见且流行的函数式编程和 `Stream` 面试题列表。如果你有任何其他 Java 函数式编程问题或任何与
    `JDK 8 Stream API` 相关的问题，请随时与我们分享，我会尝试为你寻找答案。


    ## 1. Collection 和 Stream 之间有什么区别？


    `Collection` 和 `Stream` 之间的主要区别是 `Collection` 包含元素，而 `Stream` 不包含。`Stream` 在一个视图上工作，元素实际上由
    `Collection` 或 `array` 存储，但与其他视图不同，对 `Stream` 上所的任何更改都不会反映在原始的 `Collection` 上。


    ## 2. `map()` 函数是做什么的？你为什么要用它？


    `map()` 函数在 Java 中执行映射（map）函数操作。这意味着它可以通过应用函数将一种类型的对象转换为其他类型。


    例如，如果你有一个 `String` 类型的 `List`，并且你想将其转换为 `Integer` 类型的 `List`，你可以使用 `map()` 来。


    只需向 `map()` 提供一个将 `String` 转换为 `Integer` 的函数（例如 `parseInt()`），它将应用到 `List` 的所有元素上，并返回一个
    `Integer` 类型的 `List`。换句话说，`map` 可以将一个对象转换为另一个。


    如果你想学习更多关于 `Java S.E. 8` 引入这些新方法，建议你查看 Udemy 上的 The Complete Java Masterclass
    课程。这是最全面的课程之一，涵盖了 Java 开发者需要的所有知识。


    ![](img/Java_8_Comparator_example.png)


    ## 3. `filter()` 方法是做什么的？你什么时候用它？


    `filter` 方法用于过滤满足由 `Predicate` 函数指定的特定条件的元素。


    `predicate` 函数无非一个接收 `Object` 并返回 `boolean` 值的函数。例如，如果你有一个 `Integer` 类型的 `List`，并且想要一个偶数列表。


    在这种情况下，你可以使用 `filter` 来实现该目标。你提供一个检查数字是偶数还是奇数的函数，就像这个函数一样，`filter` 将此应用于流元素，并过滤掉符合和不符合条件的元素。


    ## 4. `flatMap()` 函数是做什么的？你为什么需要它？


    `flatMap` 函数是 `map` 函数的扩展。除了将一个对象转换为另一个之外，它还可以将其扁平化（flatten）。


    例如，如果你有一个列表的列表，但你想将所有列表的元素合并成一个列表。在这种情况下，你可以使用 `flatMap()` 进行扁平化。同时，你也可以像使用 `map()`
    函数一样转换对象。


    ## 5. `flatMap()` 和 `map()` 函数之间有什么区别？


    尽管 `map()` 和 `flatMap()` 都可以用于通过在每个元素上应用方法来将一个对象转换为另一个。


    主要区别是 `flatMap()` 还可以扁平化 `Stream`。例如，如果你有一个列表的列表，你可以使用 `flatMap()` 函数将其转换为大列表。


    顺便说一下，如果你发现理解 `map`、`flatMap`、`filter` 等函数式编程方法有困难，我建议你学习 Pluralsight 上的 `From
    Collections to Streams in Java 8` 课程。这是一门高级课程，但非常好。


    ![](img/From_Collections_to_Streams_in_Java_8_Pluralsight_course.jpg)


    顺便说，你需要 Pluralsight 会员才能访问此课程，费用大约每月 29 美元或每年 299 美元（打 8 折）。我有一个账号，我也建议所有开发者都拥有该计划，因为
    Pluralsight 就像软件开发人员的 Netflix。它拥有所有最新主题的 5000 多门高质量课程。由于我们程序员每天都要学习新事物，投资 299
    美元并不糟。顺便提一下，它还提供 10 天的无义务免费试用，允许你观看 200 小时的内容。你可以通过注册免费观看这门课程。


    ## 6. Stream 的中间操作和终端操作之间有什么区别？


    中间 `Stream` 操作返回另一个 `Stream`，这意味着你可以继续调用 `Stream` 的方法来组合管道。例如，在调用 `map()` 或 `flatMap()`
    后，你仍然可以调用 `filter()`。


    另一方面，终端操作产生 `Stream` 以外的结果，如值或 `Collection`。一旦调用了如 `forEach()` 或 `collect()` 之类的终端方法，你就无法再调用
    `Stream` 的其他方法。


    ![](img/Java_8_Stream_Examples.png)


    ## 7. `peek()` 方法是做什么的？什么时候应该用它？


    `Stream` 类的 `peek()` 方法允许你查看管道。你可以查看每个步骤并打印有意义的消息。它通常用于调试与 表达式和 Stream 处理相关的问题。


    ## 8. 说 Stream 是“懒的”是什么意思？


    当我们说 `Stream` 是懒的时，意思是 `java.stream.Stream` 类中定义的大部分方法都是懒的，即它们在包含在管道中时不会工作。只有当你调用终端方法时，它们才会工作，并在找到查找的数据时结束，而不是扫描整个数据集。


    ## 9. 什么是 Java 8 中的函数式接口？


    正如它的，函数式接口是一个函数的接口。从技术上讲，只有一个抽象方法的接口被称为函数式接口。你也可以使用 `@FunctionalInterface` 来注解函数式接口。在这种情况下，编译器会验证该接口是否只包含一个抽象方法。这就像
    `@Override` 注解，可以防止意外错误。


    另一个需要知道的点是，如果一个方法接受函数式接口，那么就可以向它传递 lambda 表达式。函数式接口示例包括旧 API 中的 `Runnable`、`Callable`、`Comparator`
    和 `Comparable`，新函数 API 中的 `Supplier`、`Consumer` 和 `Predicate` 等。你可以在 Pluralsight
    的 ` What’s New in Java 8` 中进一步了解这些接口。


    ## 10. Java 中普通接口和函数式接口有什么区别？


    Java 中的普通接口可以包含任意数量的抽象方法，而函数式接口只能包含一个抽象方法。你可能在想为什么它们被称为函数式


