    ### 9) Write a Java program to check if a number is Prime or not?


    A number is said prime if it is not divisible by any other number except itself.
    `1` is not considered prime, so your check must start with `2\.`. Simplest solution
    of this to check every number until the number itself to see if its divisible
    or not. When Interviewer will ask you to improve, you can say that checking until
    square root of the number. If you can further improve the algorithm, you will
    more impress your interviewer.


    ### 10) How to Swap two numbers without using temp variable?


    This question is ages old. I have first seen this question way back in 2005 but
    I am sure its even older than that. Good thing about this problem is that except
    `XOR` trick all solution has some flaws, which is used to test whether candidate
    really knows his stuff or not.


    ### 11) How to check if linked list contains loop in Java?


    This is another problem solving question which is very popular in telephonic and
    screening round. This is a great question to test problem solving skill of candidate,
    especially if he has not seen this question before. It also has a nice little
    followup to find the starting of the loop.


    ### 12) Write Java program to reverse String without using API?


    One more question to test problem solving skill of candidate. You wouldn’t expect
    these kind of question in telephonic round of Java interview but these questions
    have now become norms. All interviewer is looking it for logic, you don’t need
    to write the code but you should be able to think of solution.


    ### 13) Difference between Serializable and Externalizable in Java?


    `Serializable` is a marker interface with no methods defined it but `Externalizable`
    interface has two methods defined on it e.g. `readExternal()` and `writeExternal()`
    which allows you to control the serialization process. `Serializable` uses default
    serialization process which can be very slow for some application.


    ### 14) Difference between transient and volatile in Java?


    `Transient` keyword is used in Serialization while `volatile` is used in multi-threading.
    If you want to exclude a variable from serialization process then mark that variable
    `transient`. Similar to `static` variable, `transient` variables are not serialized.
    On the other hand, `volatile` variables are signal to compiler that multiple threads
    are interested on this variable and it shouldn’t reorder its access. `volatile`
    variable also follows happens-before relationship, which means any write happens
    before any read in `volatile` variable. You can also make non atomic access of
    `double` and `long` variable atomic using `volatile`.


    ### 15) Difference between abstract class and interface?


    From Java `8` onwards difference between abstract class and interface in Java
    has minimized, now even interface can have implementation in terms of `default`
    and `static` method. BTW, in Java you can still extend just one class but can
    extend multiple inheritance. `Abstract class` is used to provide default implementation
    with just something left to customize, while `interface` is used heavily in API
    to define contract of a class.


    ### 16) Difference between Association, Composition and Aggregation?


    Between association, composition and aggregation, composition is strongest. If
    part can exists without whole than relationship between two class is known as
    aggregation but if part cannot exists without whole than relationship between
    two class is known as composition. Between `Inheritance` and composition, later
    provides more flexible design.


    ### 17) What is difference between FileInputStream and FileReader?


    Difference between `FileInputStream` and `FileReader` is that former is used to
    read binary data while later is used text data.


    ### 18) How do you convert bytes to text in Java?


    You can use `String` constructor to convert bytes to text. The trick is to specify
    the charset to avoid platform issues.


    ### 19) Can we have return statement in finally clause? What will happen?


    Yes, you can use `return` statement in `finally`, but it will prevent finally
    block from being executed (actually it will override previous returns). This is
    generally considered bad practice.


    ### 20) Can you override static method in Java?


    No, you cannot override `static` method in Java because they are resolved at compile
    time rather than runtime. Though you can declare and define `static` method of
    same name in child class, this will hide parent class, that’s why it is known
    as method hiding.


    ### 21) Difference between private, public and protected in Java?


    All four are access modifier but only `private`, `public` and `protected` are
    keyword. There is no keyword for package access, its default will be accessible
    inside same package. `private` variables are only accessible in class they are
    declared, `protected` are accessible inside all classes in same package but only
    subclass outside package and `public` variables are accessible anywhere. This
    is highest level and lowest form of encapsulation.


    ### 22) 5 Coding practices you learned in Java?


    If you are developing on programming language for couple of years, you sure knows
    lots of practices, by asking couple of them, Interviewer just checking that you
    know your trade well. Here are my 5 practices:


    - Always name your thread, this will help immensely in debugging.

    - Use `StringBuilder` for string concatenation.

    - Always specify size of `Collection`, this will save lot of time spent on resizing

    - Always declare variable `private` and `final` unless you have good reason.

    - Always code on interfaces instead of implementation.

    - Provide dependency to method instead they get it by themselves, this will make
    your code unit testable.


    ### 23) Write a Program to find maximum and minimum number in array?


    This is another coding question test problem solving ability of candidate. Be
    ready for couple of follow up as well depending upon how you answer this question.
    Simplest way which comes in mind is to sort the array and then pick the top and
    bottom element.


    ### 24) Write a program to reverse Array in place?


    Another problem solving question for Java programmers. Key point here is that
    you need to reverse the array in place, which means you cannot use additional
    buffer, one or two variable will be fine. Note you cannot use any library code,
    you need to create your own logic.


    ### 25) Write a program to reverse a number in Java?


    This is an interesting program for a very junior programmer, right from the college
    but can sometime puzzle developer with couple of years of experience as well.
    Most of these developer does very little coding so they found these kind of questions
    challenging. Here the trick is to get the last digit of the number by using modulus
    operator (`%`) and reducing number in each go by using division operator (`/).

