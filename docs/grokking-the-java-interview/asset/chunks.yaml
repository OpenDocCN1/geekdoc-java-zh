    I didn’t even know that you can check if a `Thread` already holds lock before
    this question hits me in a telephonic round of Java interview. There is a method
    called `holdsLock()` on `java.lang.Thread`, it returns true if and only if the
    current thread holds the monitor lock on the specified object.


    ### 30) How do you take thread dump in Java?


    There are multiple ways to take thread dump of Java process depending upon operating
    system. When you take thread dump, `JVM` dumps state of all threads in log files
    or standard error console. In windows you can use `Ctrl + Break` key combination
    to take thread dump, on Linux you can use `kill -3` command for same. You can
    also use a tool called `jstack` for taking thread dump, it operate on process
    id, which can be found using another tool called `jps`.


    ### 31) Which JVM parameter is used to control stack size of a thread?


    This is the simple one, `-Xss` parameter is used to control stack size of `Thread`
    in Java. You can see this list of JVM options to learn more about this parameter.


    ### 32) What is the difference between synchronized and ReentrantLock in Java?


    There were days when the only way to provide mutual exclusion in Java was via
    `synchronized` keyword, but it has several shortcomings e.g. you can not extend
    lock beyond a method or block boundary, you can not give up trying for a lock
    etc. Java 5 solves this problem by providing more sophisticated control via `Lock`
    interface. `ReentrantLock` is a common implementation of `Lock` interface and
    provides re-entrant mutual exclusion Lock with the same basic behavior and semantics
    as the implicit monitor lock accessed using `synchronized` methods and statements,
    but with extended capabilities.


    ### 33) There are three threads T1, T2, and T3? How do you ensure sequence T1,
    T2, T3 in Java?


    Sequencing in multi-threading can be achieved by different means but you can simply
    use the `join()` method of thread class to start a thread when another one has
    finished its execution. To ensure three threads execute you need to start the
    last one first e.g. `T3` and then call `join` methods in reverse order e.g. `T3`
    calls `T2`. `join` and `T2` calls `T1.join`, these ways T1 will finish first and
    T3 will finish last.


    ### 34) What does yield method of Thread class do?


    `Yield` method is one way to request current thread to relinquish CPU so that
    other thread can get a chance to execute. `Yield` is a static method and only
    guarantees that current thread will relinquish the CPU but doesn’t say anything
    about which other thread will get CPU. Its possible for the same thread to get
    CPU back and start its execution again.


    ### 35) What is the concurrency level of ConcurrentHashMap in Java?


    `ConcurrentHashMap` achieves it’s scalability and thread-safety by partitioning
    actual map into a number of sections. This partitioning is achieved using concurrency
    level. Its optional parameter of `ConcurrentHashMap` constructor and it’s default
    value is `16`. The table is internally partitioned to try to permit the indicated
    number of concurrent updates without contention.


    ### 36) What is Semaphore in Java?


    `Semaphore` in Java is a new kind of synchronizer. It’s a counting semaphore.
    Conceptually, a semaphore maintains a set of permits. Each `acquire()` blocks
    if necessary until a permit is available, and then takes it. Each `release()`
    adds a permit, potentially releasing a blocking acquirer. However, no actual permit
    objects are used; the `Semaphore` just keeps a count of the number available and
    acts accordingly. `Semaphore` is used to protect an expensive resource which is
    available in fixed number e.g. database connection in the pool.


    ### 37) What happens if you submit a task when the queue of the thread pool is
    already filled?


    This is another tricky question on my list. Many programmers will think that it
    will block until a task is cleared but its true. `ThreadPoolExecutor’s submit()`
    method throws `RejectedExecutionException` if the task cannot be scheduled for
    execution.


    ### 38) What is the difference between the submit() and execute() method thread
    pool in Java?


    Both methods are ways to submit a task to thread pools but there is a slight difference
    between them. `execute(Runnable command)` is defined in `Executor` interface and
    executes given task in future, but more importantly, it does not return anything.
    Its return type is `void`. On other hand `submit()` is an overloaded method, it
    can take either `Runnable` or `Callable` task and can return `Future` object which
    can hold the pending result of computation. This method is defined on `ExecutorService`
    interface, which extends `Executor` interface, and every other thread pool class
    e.g. `ThreadPoolExecutor` or `ScheduledThreadPoolExecutor` gets these methods.


    ### 39) What is blocking method in Java?


    A blocking method is a method which blocks until the task is done, for example
    `accept()` method of `ServerSocket` blocks until a client is connected. here blocking
    means control will not return to the caller until the task is finished. On the
    other hand, there is an asynchronous or non-blocking method which returns even
    before the task is finished.


    ### 40) Is Swing thread-safe? What do you mean by Swing thread-safe?


    You can simply this question as No, `Swing` is not thread-safe, but you have to
    explain what you mean by that even if the interviewer doesn’t ask about it. When
    we say swing is not thread-safe we usually refer its component, which can not
    be modified in multiple threads. All update to GUI components has to be done on
    `AWT` thread, and `Swing` provides synchronous and asynchronous callback methods
    to schedule such updates.


    ### 41) What is the difference between invokeAndWait and invokeLater in Java?


    These are two methods `Swing` API provides Java developers for updating GUI components
    from threads other than Event dispatcher thread. `InvokeAndWait()` synchronously
    update GUI component, for example, a progress bar, once progress is made, the
    bar should also be updated to reflect that change. If progress is tracked in a
    different thread, it has to call `invokeAndWait()` to schedule an update of that
    component by Event dispatcher thread. On other hand, `invokeLater()` is an asynchronous
    call to update components.


    ### 42) Which method of Swing API are thread-safe in Java?


    This question is again related to swing and thread-safety though components are
    not thread-safe there is a certain method which can be safely called from multiple
    threads. I know about `repaint()`, and `revalidate()` being thread-safe but there
    are other methods on different swing components e.g `setText()` method of `JTextComponent`,
    `insert()` and `append()` method of `JTextArea` class.


    ### 43) How to create an Immutable object in Java?


    This question might not look related to multi-threading and concurrency, but it
    is. Immutability helps to simplify already complex concurrent code in Java. Since
    immutable object can be shared without any synchronization its very dear to Java
    developers. Core value object, which is meant to be shared among thread should
    be immutable for performance and simplicity. Unfortunately there is no `@Immutable`
    annotation in Java, which can make your object immutable, hard work must be done
    by Java developers. You need to keep basics like initializing state in constructor,
    no setter methods, no leaking of reference, keeping separate copy of mutable object
    to create Immutable object.

