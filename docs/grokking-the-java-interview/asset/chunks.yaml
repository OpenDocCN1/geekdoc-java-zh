    # 深入理解 Java 面试


    ## 13. 你知道 Java 应用中序列化（Serialization）的替代方案吗？


    是的，Java 中有几种 `Serialization` 的替代方案。例如，你可以开发自己的编码器和解码器，将 Java 对象转换为二进制格式（如 `byte
    array`），并用位置来标记特定的字段。


    这在高速消息传递和高频交易应用中非常流行，许多交易所协议如东京证券交易所的 `Arrowhead` 协议和香港期货交易所的 `Omnet` 协议都使用了这种机制。


    Java 中 `Serialization` 的另一个流行替代方案是 Google 的 `protocol buffer`，它允许你安全地将对象转换为名为
    `protobuf` 的预定义二进制格式。你还可以使用 `gRPC` 来开发服务端应用程序。如果你想了解更多关于 Google Protocol Buffer，我强烈建议你学习
    Udemy 上由 Stephane Maarek 授的 `Complete Guide to Protocol Buffers 3 in Java`。


    ![](img/serialization_with_google_protocol_buffer.png)


    以上就是关于 Java 程序员序列化面试题的全部内容。你可以利用这些问题来学习更多关于序列化的知识，并填补你学习中的空白。如果你还没有读过，我强烈建议阅读《Effective
    Java》一书，特别是关于 `Serialization` 的所有条目，其中包含了 Joshua Bloch 关于在 Java 中有效且安全地使用 `Serialization`
    的许多智慧、最佳实践和建议。


    ## Java 设计模式面试题


    大家好，如果你正在准备 Java 面试，并正在寻找经常被问的设计模式面试题，那么你来对地方了。在过去，我分享过 Java 面试的优质课程，今天，我将分享 Java
    面试中流行的设计模式问题。你可以利用这些问题来练习，并检验你对 `OOP` 设计模式的掌握情况。`OOP` 和 `GOF` 设计模式面试题都是任何优秀的核心
    Java 面试题列表中不可或缺的一部分。Java 是一门流行的面向对象编程语言，由于许多开发者和开源框架，它拥有许多设计模式和设计原则。


    作为一名 Java 程序员，你应当掌握 `OOPS` 概念，如 `Abstraction`（抽象）、`Encapsulation`（封装）和 `Polymorphism`（多态）；什么是
    Java 中的设计模式；一些流行的 Java 设计模式；以及最重要的，在 Java 应用中何时使用这些设计模式。


    ### 提问设计模式面试题的目的


    Java 设计模式面试题的目的是检查 Java 程序员是否熟悉这些核心设计模式。


    Java 面试中的设计模式与多线程、集合和编程问题一样重要，不应忽视它。良好的软件设计模式知识对于成为更出色的 Java 开发者大有帮助，这也是每家公司都在寻找的。


    这些软件设计模式提供了设计和解决现实世界软件问题及任务的模板和技巧。如果你知道如何应用和使用这些经过考验的设计模式，你就可以编写更好的代码，我的意思是更具扩展性、维护性和灵活性的代码。


    如果你是一名高级或经验丰富的 Java 程序员，你可以预期在 Java 面试中遇到更复杂、更困难的设计模式，如 `Memento`（备忘模式）、`Chain
    of Responsibility`（责任链模式）和 `Builder` 设计模式，以及解决实时设计设计。


    顺便说一下，始终记住提供项目中的示例会留下更好的印象。如果你想学习 Java 设计模式的现代实现，我建议你参加 Udemy 上 Dmitri Nesteruk
    授的 `Design Patterns in Java` 课程。在这门课程中，你不仅将学习如何识别和应用设计模式，还将学习如何重构现有设计以使用设计模式。


    以下是我列出的 Java 前 10 个设计模式面试题。我还以链接的形式提供了这些 Java 设计模式题的答案。无论你参加的是什么级别的 Java 面试（程序员、软件工程师或
    Java Java 软件工程师），你都可以预期几个关于 Java 设计模式的问题。


    ### 1. 什么是 Java 中的装饰器模式（Decorator pattern）？你能给出装饰器模式的示例吗？


    装饰器模式是另一个流行的 Java 设计模式题，因为它在 `java.io` 包中大量使用而非常常见。`BufferedReader` 和 `BufferedWriter`
    是 Java 中装饰器模式的绝佳示例。


    如果你想更多了解装饰器模式如何帮助你编写更好的代码，我也建议查看 Educative 上的 `Software Design Patterns: Best
    Practices for Software Developers` 课程。这门课程提供了许多 Java 编程语言的真实示例，便于理解和应用这些设计模式并编写更好的代码。


    ![](img/Design_Patterns_and_their_relationship_for_programmers_educative.png)


    ### 2. 在 Java 中何时使用策略模式（Strategy Design Pattern）？


    针对高级和经验丰富的程序员，Java 设计模式面试题中的 `Strategy` 模式对于实现一组相关的算法（如压缩算法、过滤策略等）非常有用。策略模式允许你创建
    `Context` 类，这些类使用 `Strategy` 实现类来应用业务规则。


    JDK 本身的一个很好的策略模式示例是 `Collections.sort()` 方法和 `Comparator` 接口，后者是一个策略接口，定义了比较对象的策略。因为有了这种模式，我们不需要修改
    `sort()` 方法（对修改关闭）来比较任何对象；同时，我们可以实现 `Comparator` 接口来定义新的比较策略（对扩展开放）。


    这种模式实际上基于开闭原则（open-closed design principle），如果你理解了该原则，那么理解策略模式也相当容易。实际上，了解 `SOLID`
    原则更好，因为许多设计模式都是基于它的。


    如果你正在寻找一门关于对象设计原则的完整课程，我推荐查看 Pluralsight 上 Steve Smith 授的 `SOLID Principles of
    Object-Oriented Design`。这门课程对于任何想要加强软件架构知识的人来说都是非常有用的。


    ### 3. Java 中什么是观察者模式（Observer design pattern）？在 Java 中何时使用观察者模式？


    这是常见的 Java 设计模式面试题之一。观察者模式基于通知机制，有两种对象：`Subject`（主体）和 `Observer`（观察者）。当主体状态发生变化时，观察者会收到通知。


    ### 4. Java 中策略模式和状态模式（State design Pattern）的区别是什么？


    这是一个有趣的 Java 设计模式面试题，因为策略模式和状态模式具有相同的结构。如果你看这两个模式的 UML 类图，它们看起来完全一样，但它们的意图完全不同。


    状态模式用于定义和管理对象的状态，而策略模式用于定义一组可交换的算法，并让客户端选择其中一个。因此，策略模式是客户端驱动的模式，而对象可以管理它们自己的状态。


    ### 5. 在 Java 中何时使用组合模式（Composite design pattern）？你之前在项目中使用过它吗？


    这个设计模式问题在 Java 面试中，不仅是为了检查候选人是否熟悉组合模式，还为了检查其是否具有实战经验。


    '
- fmt: '

    The `Composite` pattern is also a core-Java design pattern, which allows you to
    treat both whole and part object to treat similarly. Client code, which deals
    with a `Composite` or individual object, doesn’t differentiate between them, it
    is possible because the `Composite` class also implements the same interface as
    their individual part.


    One of the good examples of the Composite pattern from JDK is the `JPanel` class,
    which is both `Component` and `Container`. When the `paint()` method is called
    on `JPanel`, it internally called the `paint()` method of individual components
    and let them draw themselves.


    In the second part of this design pattern interview question, be truthful; if
    you have used, then say yes, otherwise say that you are familiar with the concept
    and used it on your own.


    ## 6. What is the Singleton pattern in Java?


    Singleton pattern in Java is a pattern that allows only one instance of `Singleton`
    class available in the whole application. `java.lang.Runtime` is a good example
    of a Singleton pattern in Java. There are lots of follow up questions on the Singleton
    pattern see 10 Java singleton interview question answers for those follow-ups.


    ## 7. Can you write thread-safe Singleton in Java?


    There are multiple ways to write thread-safe Singleton in Java, like by writing
    `singleton` using double-checked locking, by using static `Singleton` instance
    initialized during class loading. By the way, using Java `enum` to create thread-safe
    singleton is the most simple way.


    ## 8. When to use the Template method design pattern in Java?


    The Template pattern is another popular core Java design pattern interview question.
    I have seen it appear many times in real life project itself. The template pattern
    outlines an algorithm in the form of a template method and lets the subclass implement
    individual steps.


    The critical point to mention, while answering this question, is that the template
    method should be `final` so that the subclass can not override and change the
    steps of the algorithm. Still, the same time individual steps should be `abstract`,
    so that child classes can implement them.


    ## 9. What is the Factory pattern in Java? What is the advantage of using a static
    factory method to create an object?


    The Factory pattern in Java is a creation Java design pattern and a favorite on
    many Java interviews. Factory pattern used to create an object by providing static
    factory methods. There are many advantages of providing factory methods like caching
    immutable objects, easy to introduce new objects, etc. See What is Factory pattern
    in Java and benefits for more details.


    ## 10. What is the difference between Decorator and Proxy pattern in Java?


    Another tricky Java design pattern question and trick here is that both `Decorator`
    and `Proxy` implements the interface of the `Object` they decorate or encapsulate.
    As I said, many Java design patterns can have similar or exactly the same structure,
    but they differ in their intent.


    The `Decorator` pattern is used to implement functionality on an already created
    object, while a `Proxy` pattern is used for controlling access to an object.


    One more difference between the Decorator and the Proxy design pattern is that
    the `Decorator` doesn’t create an object; instead, it gets the `Object` in its
    constructor, while `Proxy` actually creates objects. You can also read the Head
    First Analysis and Design to understand the difference between them.


    ## 11. When to use Setter and Constructor Injection in the Dependency Injection
    pattern?


    Use `Setter` injection to provide optional dependencies of an object while use
    `Constructor` injection to provide a mandatory dependency of an object, without
    which it can not work. This question is related to the Dependency Injection design
    pattern and mostly asked in the context of the Spring framework, which is now
    become a standard for developing Java application.


    Since Spring provides an `IOC` container, it also gives you a way to specify dependencies
    either by using setter methods or constructors. You can also take a look at my
    previous section on the same topic.


    ## 12. What is the difference between Factory and Abstract Factory in Java


    I have already answered this question in detail with my section with the same
    title. The main difference is that the `Abstract Factory` creates a factory while
    the `Factory` pattern creates objects. So both abstract the creation logic, but
    one abstract is for factory and the other for items.


    ## 13. When to use the Adapter pattern in Java? Have you used it before in your
    project?


    Use the `Adapter` pattern when you need to make two class works with incompatible
    interfaces. Adapter pattern can also be used to encapsulate third party code so
    that your application only depends upon `Adapter`, which can adapt itself when
    third party code changes or you moved to a different third party library.


    By the way, this Java design pattern question can also be asked by providing an
    actual scenario. You can further read Head First Design Pattern to learn more
    about the `Adapter` pattern and its real-world usage. The book is updated for
    Java 8 as well, so you will learn new Java 8 ways to implement these old design
    patterns.


    ## 14. Can you write code to implement a producer-consumer design pattern in Java?


    The Producer-consumer design pattern is a concurrency design pattern in Java,
    which can be implemented using multiple ways. If you are working in Java 5, then
    it’s better to use Concurrency util to implement producer-consumer pattern instead
    of plain old wait and notify in Java. Here is an excellent example of implementing
    the producer-consumer problem using `BlockingQueue` in Java.


    ## 15. What is the Builder design pattern in Java? When do you use the Builder
    pattern?


    Builder pattern in Java is another cre design pattern in Java and often asked
    in Java interviews because of its specific use when you need to build an object
    which requires multiple properties, some optional and some mandatory.


    ## 16. What is the Open closed design principle in Java?


    The Open closed design principle is one of the SOLID principles defined by Robert
    C. Martin, popularly known as Uncle Bob in his most popular book, Clean Code.
    This principle advises that code should be open for extension but closed for modification.


    At first, this may look conflicting, but once you explore the power of polymorphism,
    you will start finding patterns that can provide stability and flexibility of
    this principle.


    One of the critical examples of this is the State and Strategy design pattern,
    where `Context` class is closed for modification, and new functionality is provided
    by writing new code by implementing a new state of strategy. See this section
    to know more about Open closed principle.


    ## 17. Can you give an example of SOLID design principles in Java?


    There are lots of SOLID design pattern which forms acronym SOLID like:


    1. Single Responsibility Principle or `SRP`

    2. Open Closed Design Principle or `OCD`

    3. Liskov Substitution Principle

    4. Interface Segregation Principle

    5. Dependency Inversion Principle.


    ## 18. What is the difference between Abstraction and Encapsulation in Java?


    Even though both Abstraction and Encapsulation look similar because both hide
    complexity and make the external interface simpler, there is a subtle difference
    between them. Abstraction hides logical complexity while Encapsulation hides Physical
    Complexity.


    ![](image/Difference_between_Abstraction_and_Encapsulation.jpg)

