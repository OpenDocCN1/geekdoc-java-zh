    32) What is the difference between synchronized and ReentrantLock in Java?


    There were days when the only way to provide mutual exclusion in Java was via
    synchronized keyword, but it has several shortcomings e.g. you can not extend
    lock beyond a method or block boundary, you can not give up trying for a lock
    etc. Java 5 solves this problem by providing more sophisticated control via Lock
    interface. ReentrantLock is a common implementation of Lock interface and provides
    re-entrant mutual exclusion Lock with the same basic behavior and semantics as
    the implicit monitor lock accessed using synchronized methods and statements,
    but with extended capabilities.


    33) There are three threads T1, T2, and T3? How do you ensure sequence T1, T2,
    T3 in Java?


    Sequencing in multi-threading can be achieved by different means but you can simply
    use the join() method of thread class to start a thread when another one has finished
    its execution. To ensure three threads execute you need to start the last one
    first e.g. T3 and then call join methods in reverse order e.g. T3 calls T2. join
    and T2 calls T1.join, these ways T1 will finish first and T3 will finish last.


    34) What does yield method of Thread class do?


    Yield method is one way to request current thread to relinquish CPU so that other
    thread can get a


    56


    GROKKING THE JAVA INTERVIEW


    chance to execute. Yield is a static method and only guarantees that current thread
    will relinquish the CPU but doesn’t say anything about which other thread will
    get CPU. Its possible for the same thread to get CPU back and start its execution
    again.


    35) What is the concurrency level of ConcurrentHashMap in Java?


    ConcurrentHashMap achieves it’s scalability and thread-safety by partitioning
    actual map into a number of sections. This partitioning is achieved using concurrency
    level. Its optional parameter of ConcurrentHashMap constructor and it’s default
    value is 16\. The table is internally partitioned to try to permit the indicated
    number of concurrent updates without contention.


    36) What is Semaphore in Java?


    Semaphore in Java is a new kind of synchronizer. It’s a counting semaphore. Conceptually,
    a semaphore maintains a set of permits. Each acquire() blocks if necessary until
    a permit is available, and then takes it. Each release() adds a permit, potentially
    releasing a blocking acquirer. However, no actual permit objects are used; the
    Semaphore just keeps a count of the number available and acts accordingly. Semaphore
    is used to protect an expensive resource which is available in fixed number e.g.
    database connection in the pool. See this section to learn more about counting
    Semaphore in Java.


