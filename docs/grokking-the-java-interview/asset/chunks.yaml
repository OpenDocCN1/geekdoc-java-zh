  trans: "\n\n这份清单对于所有经验水平的 Java 开发者来说同样有用。即使你是拥有 2 到 3 年工作经验的初级开发者，或 5 到 6 年经验的高级开发者，也可以阅读此列表。它对于职场新人和学者扩展知识非常有帮助。\n\
    \n# 集合框架（Collection Framework）面试题\n\n来自 `Collection` 包或框架的面试题是任何核心 Java 面试中最常见的，但也是一个具有挑战性的部分。`Collection`\
    \ 和多线程结合使得任何 Java 面试都变得难以应对，而对 `Collection` 和线程的良好理解将帮助你在 Java 面试中脱颖而出。当我第一次写\
    \ 10 道多线程面试题时，我曾考虑过编写 Java 集合框架以及重要类（如 `ArrayList`、`HashMap`、`Hashtable` 以及新添加的并发集合，例如\
    \ `ConcurrentHashMap`）的面试题，但由于某些原因这部分推迟了。尽管期间我也单独分享过几个问题。\n\n我认为这种延迟的主要原因可能是我花了大量时间研究和准备过去\
    \ 5 年的 Java 核心问题超级列表。在这一部分，我们将看到一些初级和高级 Java 集合面试题及其答案，这些问题在各种核心 Java 面试中出现过。\n\
    \n这些 Java 集合框架面试题是从不同的朋友和同事那里收集的，这些面试题的答案也可以通过 Google 找到。顺便说，如果你正在准备 Java 面试，也可以参考《Java\
    \ Programming Interview Exposed》，这是一本在 Java 面试中取得优异的优秀资源。\n\n## Java 集合面试题答案\n\
    \n现在让我们开始关于集合的面试题。由于集合是由各种数据结构（例如 `Map`、`Set` 和 `List`）组成的，并且有多种实现方式，面试官主要检查面试者是否熟悉这些集合的基础知识，以及是否知道何时使用\
    \ `Map`、`Set` 或 `List`。根据面试的职位，问题从初级水平到更高级水平不等。通常 2 到 3 年经验被视为初级，而 5 年以上属于高级类别，我们将看到来自这两个类别的问题。\n\
    \n### 1. `HashMap` 在 Java 中是如何工作的？\n\n这是一个经典的 Java 集合面试题，我在之前的章节中也讨论过 `HashMap`\
    \ 在 Java 中是如何工作的。这道集合面试题通常在投资银行的 AVP 职位面试中被问到，并且根据面试者的回答会有许多后续问题，例如：\n\n为什么 `HashMap`\
    \ 的键需要是不可变的？`HashMap` 上的竞态条件是什么？`HashMap` 在 Java 中是如何调整大小的？\n\n### 2. `Queue`\
    \ 接口的 `poll()` 方法和 `remove()` 方法有什么区别？\n\n虽然 `Queue` 的 `poll()` 和 `remove()` 方法都用于删除对象并返回队列头，但它们之间存在细微的区别。如果\
    \ `Queue` 是空的（`empty()`），调用 `remove()` 方法将抛出异常，而调用 `poll()` 方法返回 `null`。顺便说一下，从队列中删除的具体元素取决于队列的排序策略，并在不同的实现之间有所不同，例如，`PriorityQueue`\
    \ 根据 `Comparator` 或 `Comparable` 将最小元素放在头部。\n\n### 3. 快速失败（fail-fast）和失败安全（fail-safe）迭代器有什么区别？\n\
    \n这是一个相对新的集合面试题，如果你第一次听到 fail-fast 和 fail-safe 术语，它可能会变成一个陷阱。当一个线程（`Thread`）在迭代集合对象时，另一个线程通过在底层集合上添加、删除或修改对象来结构性地修改\
    \ `Collection`，fail-fast `Iterator` 会抛出 `ConcurrentModificationException`。它们被称为快速失败是因为它们在遇到失败时尝试立即抛出异常。相反，fail-safe\
    \ `Iterator` 作用于集合副本而不是原始集合。\n\n### 4. 如何从 `Collection` 中删除条目？随后 `Collection`\
    \ 的 `remove()` 方法和 `Iterator` 的 `remove()` 方法有什么区别？在迭代期间删除元素时你会使用哪一个？\n\n`Collection`\
    \ 接口定义了 `remove(Object obj)` 方法来从 `Collection` 中删除对象。`List` 接口增加了另一个方法 `remove(int\
    \ index)`，用于删除指定索引的对象。在非迭代时，可以使用这些方法中的任何一个从 `Collection` 中删除条目。但在迭代时情况发生了变化。假设你正在遍历一个\
    \ `List` 并根据逻辑仅删除某些元素，你需要使用 `Iterator` 的 `remove()` 方法。该方法从 `Iterator` 的视角删除当前元素。如果你在迭代期间使用\
    \ `Collection` 或 `List` 的 `remove()` 方法，你的代码将抛出 `ConcurrentModificationException`。因此，建议使用\
    \ `Iterator` 的 `remove()` 方法从 `Collection` 中删除对象。\n\n### 5. 同步集合（Synchronized\
    \ Collection）和并发集合（Concurrent Collection）有什么区别？\n\nJava 5 添加了多个新的并发集合类，例如 `ConcurrentHashMap`、`CopyOnWriteArrayList`、`BlockingQueue`\
    \ 等，这使得 Java 集合面试题变得更加棘手。Java 还提供了通过使用 `Collections.synchronizedMap()` 工具函数获取\
    \ `ArrayList`、`HashMap` 等集合同步副本的方法。一个显著的区别是并发集合的性能优于同步集合，因为它们只锁定 Map 的一部分来实现并发和同步。\n\
    \n### 6. `Iterator` 和 `Enumeration` 有什么区别？\n\n这是一个初级集合面试题，通常在针对 2 到 3 年经验的初级 Java\
    \ 开发者面试中问到。`Iterator` 具有 `Enumeration` 重复的功能，额外增加了 `remove()` 方法，并且两者都在 `Collection`\
    \ 对象上提供导航功能。另一个区别是 `Iterator` 比 `Enumeration` 更安全，它不允许另一个线程在迭代期间（`remove()` 方法外）修改集合对象，否则会抛出\
    \ `ConcurrentModificationException`。更多差异请参阅 Java 中的 `Iterator` vs `Enumeration`。\n\
    \n### 7. `HashSet` 在 Java 中是如何实现的？它是如何使用哈希（Hashing）的？\n\n这是一个 Java 中的棘手问题，因为哈希既需要键也需要值，而在桶中没有键，那么\
    \ `HashSet` 内部到底是如何存储元素的呢？嗯，`HashSet` 是构建在 `HashMap` 之上的。如果你查看 `java.util.HashSet`\
    \ 类的源码，你会发现它使用了一个所有键的值都相同的 `HashMap`，如下所示：\n\n```java\nprivate transient HashMap\
    \ map;\n// 用于与底层 Map 中的对象关联的虚拟值\nprivate static final Object PRESENT = new Object();\n\
    ```\n\n当你调用 `HashSet` 的 `add()` 方法时，它会在 `HashMap` 中放入一个条目：\n\n```java\npublic\
    \ boolean add(E e) {\n    return map.put(e, PRESENT)==null;\n}\n```\n\n由于 `HashMap`\
    \ 中的键是唯一的，它提供了 `Set` 接口的唯一性保证。\n\n### 8. 要将自定义对象作为 Map 或 Set 等集合类中的键，需要做什么？\n\n\
    答案是：如果你在 `Map` 中将任何自定义对象用作键，你需要重写 `equals()` 和 `hashCode()` 方法，并确保它们遵循约定。另一方面，如果你在排序集合（例如\
    \ `SortedSet` 或 `SortedMap`）中存储自定义对象，你还需要确保你的 `equals()` 方法与 `compareTo()` 方法一致，否则该集合将无法遵循其约定，例如\
    \ `Set` 可能会允许元素。\n\n### 9. `HashMap` 和 `Hashtable` 有什么区别？\n\n"
