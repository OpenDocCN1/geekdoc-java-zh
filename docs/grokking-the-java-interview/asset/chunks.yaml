    # 深度理解 Java 面试


    ## 前言


    攻克 Java 面试并非易，主要原因之一是 Java 非常庞大。要成为一名合格的 Java 开发者，需要掌握大量的概念和 API。许多擅长数据结构与算法、系统设计、SQL
    和数据库等通用主题的人在 Java 面试中失败了，因为他们没有花时间学习 Java 核心概念以及基础 API 和包，例如 Java 集合框架、多线程、JVM
    内部、JDBC、设计模式和面向对象编程。


    本书旨在填补这一空白，并向你介绍这些主题中的经典 Java 面试题。通过学习这些问题和主题，你不仅能够扩展自己的知识，还能为下一次 Java 面试做好准备。如果你正在准备
    Java 面试，我强烈建议你在电话面试或面面试之前过一遍这些问题，你不仅会获得回答问题的信心和知识，还能学习如何引导 Java 面试向你有利的方向发展。这是我作为
    Java 开发者能给你的最重要的建议。始终记住，你的回答决定了面试的走向，而这些问题将教你如何引导面试官进入你的擅长领域。祝你 Java 面试顺利，如果你有任何问题或反馈，可以随时通过
    [twitter javinpaul](http://twitter.com/javinpaul) 联系我，或者在我的博客 [Javarevisited](http://javarevisited.blogspot.com)
    和 [Java67](http://java67.com) 上留言。


    # 面向对象编程面试题


    Java 是一种面向对象的编程语言，在 Java 面试中你会看到很多关于面向对象概念的问题。经典问题如接口和抽象类之间的区别一直存在，但过去几年，面试官还会问基于高级设计原则和模式的复杂问题，以检查考者的
    OOP 知识。不过，面向对象编程问题在 1 到 3 年经验的程序员的 Java 面试中更常见。这很有，因为这些程序员必须掌握 OOP 基础知识，如抽象、继承、组合、类、对象、接口、封装等。


    如果你在寻找针对 2 到 4 年经验开发者的 Java 面试题，你会发现许多基于继承和封装等 OOP 基础的问题，但随着经验的增加，你将看到基于面向对象分析与设计的问题，例如编写一个自动售卖机设计或在
    Java 中实现一个咖啡机。


    这些问题更困难，不仅要求真正理解 OOP 基础，还需要理解 SOLID 设计原则和模式。


    在这一节中，我将与你分享一些基于 OOP 概念的 Java 面试题，这些是我从朋友和同事那里收集的，他们在不同公司的 Java 面试中遇到过。通常在前几轮，如筛选轮或电话面试。


    如果你是高级 Java 开发者，你已经知道这些问题的答案，我建议你多练习面向对象分析与设计技能，即如何根据规范编写代码。如果你是应届生或有 2 到 3 年经验的初级
    Java 开发者，你必须复习这些问题，如果不会就要学会，会在 Java 工作面试中表现良好。


    ### OOP 或 Java 中的方法重载（method overloading）是什么？


    这是最老的 OOP 概念问题之一，我在 10 年前见过，现在依然可见。当我们有多个同名但功能不同的方法时，就称为方法重载。例如，`System.out.println()`
    就重载了，因为我们有 6 或 7 个 `println()` 方法，每个方法接受不同类型的参数。


    ### OOP 或 Java 中的方法重写（method overriding）是什么？


    这是面向对象编程的魔力之一，方法在运行时根据对象选择。为了实现方法重写，我们需要继承和多态，因为我们需要在父类和子类中具有相同签名的方法。对该方法的调用将在运行时解析，取决于实际对象而不是变量的类型。


    ### Java 中的方法隐藏（method of hiding）是什么？


    当你在父类和子类中声明两个同名且签名相同的静态方法时，它们会相互隐藏。即：在子类中对方法的调用将调用该类声明的静态方法，而对父类中相同方法的调用将解析为父类中声明的静态方法。


    ### Java 是纯的面向对象语言吗？如果不是，为什么？


    Java 不是纯的面向对象编程语言，例如，有很多你可以在不需要对象的情况下完成，例如静态方法。此外，基本类型变量在 Java 中不是对象。


    ### Java 中方法重载和重写的规则是什么？


    Java 中方法重载最重要的规则之一是方法签名必须不同，即参数的数量或类型必须不同。仅仅更改两个方法的返回类型不会导致重载，相反，编译器将抛出错误。另一方面，方法重写的规则更多，例如：名称和返回类型必须相同，方法签名也应该相同，重载的方法不能抛出更高级的异常等。


    ### 方法重载和重写的区别？


    有几点区别，但最重要的一点是方法重载在编译时解析，而方法重写在运行时解析。编译器只使用类信息用于方法重载，但它需要知道对象来解析被重写的方法调用。这张图很好地解释了这种区别：


    ![](img/Difference_between_method_overloading_and_overriding_in_Java.gif)


    ### 在 Java 中可以重载静态方法吗？


    可以，你可以在 Java 中重载静态方法。你可以根据意愿声明任意数量同名的静态方法，只要它们都具有不同的方法签名。


    ### 在 Java 中可以重写静态方法吗？


    不可以，你不能重写静态方法，因为它不绑定到对象。相反，静态方法属于类，并在编译时使用引用变量的类型解析。但是，是的，你可以在子类中声明相同的静态方法，这将导致方法隐藏。即：如果你使用子类的引用变量，将调用新方法；但如果你使用父类的引用变量，则将调用旧方法。


    ### 在不使用 final 修饰符的情况下可以防止重写方法吗？


    可以，你可以在不使用 final 修饰符的情况下防止 Java 方法重写。事实上，有几种实现方法，例如你可以将方法标记为 private 或 static，这些不能被重写。


    ### 在 Java 中可以重写私有方法吗？


    不可以。由于私有方法只在声明它们的类内部可访问和可见，因此在子类中无法重写它们。不过，你可以在内部类中重写它们，因为它们在内部是可以访问的。


    ### Java 中的协变方法重写（covariant method overriding）是什么？


