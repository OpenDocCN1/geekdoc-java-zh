    垃圾回收面试题在核心 Java 和高级 Java 面试中非常流行。除了 Java 集合（Collection）和线程之外，许多棘手的 Java 问题都源于垃圾回收，这些问题很难回答。在这个
    Java 面试章节中，我将分享一些在各种核心 Java 面试中都会出的 `GC` 问题。这些问题基于垃圾回收的工作原理、不同类型的垃圾回收器，以及用于垃圾回收监控和调优的
    JVM 参数。正如我所说，`GC` 是任何 Java 面试的重要组成部分，因此请确保你对 `GC` 有良好的掌握。另外一个变得非常重要的点是理解和分析垃圾回收输出的能力，越来越多的面试官正在检查候选人是否能理解
    `GC` 输出。


    在 Java 面试期间，他们可能会提供一段 `GC` 输出片段并基于此提出各种问题，例如：使用了哪种垃圾回收器？输出是来自大收集（major collection）还是新生收集（minor
    collection）？`GC` 释放了多少内存？`GC` 之后新生代（new generation）和老年代（old generation）的大小是多少等。


    我包含了一些来自 `GC` 输出的垃圾回收面试题和答案以帮助大家。建议在准备垃圾回收的同时，也准备 Java 集合、多线程和编程的问题，以便在任何阶段的 Java
    面试中表现良好。


    而且，如果你认真提高高级 JVM 技能并学习获取和分析堆转储（heap dumps）等知识，强烈推荐参加 Udemy 上的 Java Application
    Performance and Memory Management 课程。这是 Java 程序员学习更多性能和内存管理（包括排查 Java 内存泄漏）的高级课程之一。


    这里是我个人收集的一些垃圾回收面试题，这些是我根据自己的经验并在许多向我分享 `GC` 面试题的朋友和同事帮助创建的。


    实际上，问题比我在这里分享的要得多，但为了保持这个章节的简洁，我想只分享一些问题。如果你们觉得这些有用，我可以考虑第二部分的 `GC` 面试题。


    ## Question 1 - Java 堆的结构是什么？堆中的永久代（Perm Gen space）是什么？


    **答案**：为了在任何 Java 面试的垃圾回收问题中表现更好，对 Java 堆空间的基本理解是非常重要的。


    顺便提一下，堆被分为不同的代，例如新生代、老年代和 `PermGen` 空间。`PermGen` 空间用于存储类的元数据，填充 `PermGen` 空间会导致
    `java.lang.OutOfMemory: PermGen space`。此外记住 Java 中配置 `PermGen` 空间的 JVM 选项也是值得的。


    ## Question 2 - 如何在 Java 中识别新生收集（minor collection）和大收集（major collection）？


    **答案**：如果使用 `-verbose:gc` 或 `-XX:PrintGCDetails` 启用垃圾回收日志，新生收集会打印“`GC`”，而大收集会打印“Full
    GC”。这个垃圾回收面试题基于对垃圾回收输出的理解。随着越来越多的面试官通过这个问题来检查候选人理解 `GC` 输出的能力，这个主题变得更加重要。


    ## Question 3 - ParNew 和 DefNew 新生代垃圾回收器有什么区别？


    **答案**：这个垃圾回收面试题最近我一个朋友问过。回答这个问题需要比平均水平更高的 `GC` 知识。


    顺便提一下，`ParNew` 和 `DefNew` 是两个新生代垃圾回收器。`ParNew` 是多线程 `GC`，与并发标记清除算法（Mark Sweep）一起使用；而
    `DefNew` 是单线程 `GC`，与序列垃圾回收器（Serial Garbage Collector）一起使用。


    而且，如果你认真提高高级 JVM 技能并学习获取和分析堆转储等知识，强烈推荐参加 Udemy 上的 Java Application Performance
    and Memory Management 课程。


    ## Question 4 - 如何找到调用 System.gc() 导致的 GC 结果？


    **答案**：另一个基于 `GC` 输出的垃圾回收面试题。与大新生收集类似，垃圾回收输出中会包含“`System`”字样。


    ## Question 5 - 序列（Serial）和吞吐量（Throughput）垃圾回收器有什么区别？


    **答案**：序列垃圾回收器是一种“停顿世界”（stop the world）的 `GC`，它在新生收集和大收集期间都会停止应用程序线程运行。可以使用 JVM
    选项 `-XX:UseSerialGC` 启用序列垃圾回收器，它专为没有暂停时间要求且具有客户端配置的 Java 应用设计。


    序列垃圾回收器在 JDK 1.5 引入适应性策略（ergonomics）之前，也是 JDK 1.4 的默认 `GC`。`Serial GC` 最适合线程较少的小应用程序，而吞吐量
    `GG` 更适合大型应用程序。另一方面，吞吐量垃圾回收器是一种并行收集器，新生收集和大收集并行发生，充分利用所有可用的系统资源（如多处理器）。


    尽管大收集和新生收集都以“停顿世界”的方式运行并给应用程序引入了停顿，但可以使用 `-XX:UseParallelGC` 或 `-XX:UseOldParallelGC`
    启用吞吐量垃圾回收器。


    它通过最小化在垃圾回收上花费的时间来提高应用程序的整体吞吐量，但在全 `GC` 期间仍会有长时间停顿。这是一种垃圾回收面试题，让你在回答时有机会详细地展示你的知识。我总是建议详细地回答这类问题。


    ## Question 6 – 对象在 Java 中什么时候变成可垃圾回收的对象？


    **答案**：当一个对象没有活引用（live reference）或它无法被任何存活线程到达时，该对象就符合垃圾回收条件。循环引用不被视为活引用，如果两个对象互相指向且其中任何一个对象都没有活引用，那么它们两个都符合
    `GC` 条件。此外，垃圾回收线程是一个守护线程（daemon thread），它由 `JVM` 根据 `GC` 算法运行，并在运行时收集所有符合 `GC`
    条件的对象。


    ## Question 7 - Java 中的 finalize 方法是什么？垃圾回收器在什么时候调用 finalize 方法？


    **答案**：Java 中的 finalize 方法（也称为 finalizer）是定义在 `java.lang.Object` 中的方法，垃圾回收器在收集任何符合
    `GC` 条件的对象之前调用。`finalize()` 方法为对象提供了清理和释放剩余资源的最后机会。


    ## Question 8 - 如果对象 A 引用对象 B，对象 B 又引用对象 A，除此之外除此之外没有指向对象 A 或 B 的活引用，它们符合垃圾回收条件吗？


    这个垃圾回收面试题与问题 5 “对象什么时候变成可垃圾回收的对象”相关。如果一个对象没有活引用，它就符合垃圾回收条件。它无法从任何线程访问，循环依赖不会阻止对象被垃圾回收。这意味着在这种情况下，对象
    A 和对象 B 都符合垃圾回收条件。


