    \ value class or a domain object then you should implement `Comparable` and define\
    \ natural ordering of your object. Main difference between these two is that,\
    \ you could create multiple `Comparator` to define multiple sorting order. Also,\
    \ In order to implement `Comparable` you must have access of the class or code,\
    \ but you can use `Comparator` without having source code of class, all you need\
    \ is the JAR file of particular object. That’s why `Comparator` is very powerful\
    \ to implement custom sorting order and from Java 8 you can do it more elegantly,\
    \ as seen here.\n\n## 38) How do you sort `ArrayList` in descending order?\n\n\
    You can use `Collections.sort()` method with `reverse Comparator`, which can sort\
    \ elements in the reverse order of their natural order e.g.\n\n```\nList<String>\
    \ listOfString = Arrays.asList(“London”, “Tokyo”, “NewYork”); \nCollections.sort(listOfString,\
    \ Collections.reverseOrder()); \nSystem.out.println(listOfString); //Tokyo, NewYork,\
    \ London]\n```\n\n## 39) What is the difference between `PATH` and `CLASPATH`\
    \ in Java?\n\n`PATH` is an environment variable which points to Java binary which\
    \ is used to run Java programs. `CLASPATH` is another environment variable which\
    \ points to Java class files or JAR files. If a class is not found in `CLASPATH`\
    \ then Java throws `ClassNotFoundException`.\n\n## 40) What is the difference\
    \ between Checked and Unchecked Exception in Java?\n\nChecked exception ensures\
    \ that handling of the exception is provided and its verified by compiler also,\
    \ while for throwing unchecked exception no special provision is needed e.g. `throws`\
    \ clause. A method can throw unchecked exceptions without any `throws` clause.\n"
