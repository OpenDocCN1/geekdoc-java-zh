  trans: '


    在 Java 面试的电话轮次遇到这个问题之前，我甚至不知道可以检查一个 `Thread` 是否已经持有锁。`java.lang.Thread` 上有一个名为
    `holdsLock()` 方法，当且仅当当前线程持有指定对象的监视锁（monitor lock）时，它返回 `true`。


    ### 30) 如何在 Java 中获取线程储（thread dump）？


    根据操作系统的不同，有多种方法获取 Java 进程的线程储。当你获取线程储时，`JVM` 会将所有线程的状态导出到日志文件或标准错误控制台中。在 Windows
    中，你可以使用 `Ctrl + Break` 键组合获取线程储；在 Linux 上，可以使用 `kill -3` 命令实现相同的功能。你也可以使用名为 `jstack`
    的工具来获取线程储，它作用于进程 ID，该 ID 可以另一个名为 `jps` 的工具找到。


    ### 31) 使用哪个 JVM 参数来控制线程的栈大小？


    这是一个简单的问题，`-Xss` 参数用于控制 Java 中 `Thread` 的栈大小。你可以查看此 JVM 选项列表以了解更多关于该参数的信息。


    ### 32) Java 中 synchronized 和 ReentrantLock 有什么区别？


    曾几何一段时间，在 Java 中提供互斥的唯一方法是通过 `synchronized` 关键字，但它有几几个缺点，例如：你无法将锁扩展到方法或块边界之外，你无法放弃获取锁的尝试等。Java
    5 通过 `Lock` 接口提供更精细的控制解决了这个问题。`ReentrantLock` 是 `Lock` 接口的一种常见实现，它提供了重入互斥锁，其与使用
    `synchronized` 方法和语句访问的隐式监视锁具有相同的基本行为和语义，但具有更扩展的能力。


    ### 33) 有三个线程 T1、T2 和 T3？在 Java 中如何确保 T1, T2, T3 的执行顺序？


    多线程中的排序可以通过不同的手段实现，但你可以简单地使用线程类的 `join()` 方法，在另一个线程执行完毕后启动线程。为了确保三个线程按顺序执行，你需要先启动最后一个线程，例如
    `T3`，然后按反序调用 `join` 方法，例如 `T3` 调用 `T2`，`T2` 调用 `T1.join`。通过这些方式，T1 将先完成，T3 将最后完成。


    ### 34) Thread 类中的 yield 方法是做什么的？


    `Yield` 方法是请求当前线程放弃 CPU 以便其他线程有机会执行的一种方式。`Yield` 是一个静态方法，它只保证当前线程将放弃 CPU，但没有说明哪个其他线程将获得
    CPU。同一个线程重新获得 CPU 并再次开始执行也是可能的。


    ### 35) Java 中 ConcurrentHashMap 的并发级别（concurrency level）是多少？


    `ConcurrentHashMap` 通过将实际的映射划分为若干区域（sections）来实现其可扩展性和线程安全。这种分区是通过并发级别实现的。它是 `ConcurrentHashMap`
    构造函数的可选参数，其默认值为 `16`。该表在内部被分区，以尝试在不发生争用的用的情况下允许指定数量的并发更新。


    ### 36) Java 中的 Semaphore（信号量）是什么？


    Java 中的 `Semaphore` 是一种新类型的同步器。它是一个计数信号量（counting semaphore）。从概念上讲，信号量维护了一组许可（permits）。每个
    `acquire()` 在必要时会阻塞，直到有一个许可可用，然后获取它。每个 `release()` 会增加一个许可，可能释放一个被阻塞的获取者。然而，并没有使用实际的许可对象；`Semaphore`
    只是保持可用数量的计数并据此采取。`Semaphore` 用于保护固定数量的高昂资源，例如池中的数据库连接。


    ### 37) 当线程池的队列已满时提交任务会发生什么？


    这是我列表中的另一个棘手问题。许多程序员会认为它会一直阻塞直到任务被清除，但事实并非如此。如果任务无法调度执行，`ThreadPoolExecutor` 的
    `submit()` 方法会抛出 `RejectedExecutionException`。


    ### 38) Java 线程池中 submit() 方法和 execute() 方法有什么区别？


    这两个方法都是向线程池提交任务的方法，但它们之间存在细微区别。`execute(Runnable command)` 定义在 `Executor` 接口中，并在未来执行给定任务，但更重要的是它不返回任何内容，它的返回类型是
    `void`。另一方面，`submit()` 是一个重载方法，它可以接受 `Runnable` 或 `Callable` 任务，并可以返回 `Future`
    对象，该对象可以持有待处理的计算结果。该方法定义在 `ExecutorService` 接口上，该接口扩展了 `Executor` 接口，其他所有线程池类（例如
    `ThreadPoolExecutor` 或 `ScheduledThreadPoolExecutor`）都拥有这些方法。


    ### 39) 什么是 Java 中的阻塞方法？


    阻塞方法是指一种会一直阻塞直到任务完成的方法，例如 `ServerSocket` 的 `accept()` 方法会阻塞直到客户端连接。在这里阻塞意味着在任务完成之前，控制权不会返回给调用者。另一方面，还存在异步或非阻塞方法，它们在任务完成之前就会返回。


    ### 40) Swing 是线程安全的吗？你说的 Swing 线程安全是什么意思？


    你可以简单地回答这个问题：“不是，`Swing` 不是线程安全的”，但即使面试官没有问，你也必须解释它的含义。当我们说 swing 不是线程安全的时，我们通常指的是它的组件，这些组件不能在多个线程中被修改。所有对
    GUI 组件的更新都必须在 `AWT` 线程上完成，`Swing` 同步和异步回调方法来调度此类更新。


    ### 41) Java 中 invokeAndWait 和 invokeLater 有什么区别？


    这些是 `Swing` API 为 Java 开发者提供的从事件分发线程之外的线程更新 GUI 组件的方法。`invokeAndWait()` 同步更新 GUI
    组件，例如一个进度条，一旦有了进度，条也应该更新以反映该变化。如果进度在不同的线程中跟踪，它必须调用 `invokeAndWait()` 来调度事件分发线程的更新。另一方面，`invokeLater()`
    是异步调用更新。


    ### 42) Java 中 Swing API 的哪些方法是线程安全的？


    这个问题再次涉及 swing 和线程安全，尽管组件不是线程安全的，但某些方法可以从多个线程安全地调用。我知道 `repaint()` 和 `revalidate()`
    是线程安全的，但在不同的组件上还有其他方法，例如 `JTextComponent` 的 `setText()` 方法，`JTextArea` 类的 `insert()`
    和 `append()` 方法。


    ### 43) 如何在 Java 中创建不可变对象？


    这个问题看起来与多线程和并发无关，但它确实相关。不可变性有助于简化 Java 中复杂的并发代码。由于不可变对象不需要任何同步即可共享，因此非常受 Java
    开发者推崇。核心值对象要在线程间共享应该是不可变的，以保证性能和简单。遗憾的是 Java 中没有 `@Immutable` 注解可以使你的对象变为不可变，这些工作必须由
    Java 开发者手动完成。你需要保持在构造函数中初始化状态、没有 setter 方法、不泄露引用、保留可变对象的独立副本来创建不可变对象。


