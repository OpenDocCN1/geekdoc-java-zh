    The `JDK 8` release has changed the way we write Java. With new functional programming
    idioms and a powerful `Stream API`, most of the new Java code is written in a
    functional style. This also means that `Stream` and Functional programming related
    questions are increasing on Java interviews. If you are not familiar with `Java
    8` changes, then it’s difficult to crack a Java interview nowadays. Though it’s
    not stated anywhere, most of the companies, particularly Investment banks like
    `Barclays`, `Citi`, and `Goldman Sachs`, now expect Java developers to know at
    least `Java 8`, which is also good, right? `Java 11` is already out, and we are
    looking forward to `Java 12` in a couple of months, it makes sense to know at
    least `Java 8` changes.


    All the questions are meant for Java developers and related to whatever functional
    programming concepts and tools available to Java developers in `JDK 8`.


    To be honest, even though these are frequently asked `Java 8` Interview questions,
    they are not at all very difficult and just focus on essential `Java 8` concepts,
    rather than it’s complex implementation. They are also not functional heavy, but,
    if you are interested in true functional programming something like the `Scala`
    and `Haskel` has implemented, I suggest you check the Functional Programming for
    Beginners course with `Scala`. I bought it for just $11 a couple of days ago,
    and it’s really awesome.


    Without any further ado, here is a list of some of the common yet popular functional
    programming and `Stream` interview questions for Java programmers. If you have
    any other Java functional programming question or anything related to `JDK 8 Stream
    API`, feel free to share with us, and I’ll try to find an answer for you.


    ## 1. What is the difference between Collection and Stream?


    The main difference between a `Collection` and `Stream` is that `Collection` contains
    their elements, but `Stream` doesn’t. `Stream` work on a view where elements are
    actually stored by `Collection` or `array`, but unlike other views, any change
    made on `Stream` doesn’t reflect on the original `Collection`.


    ## 2. What does the `map()` function do? why you use it?


    The `map()` function perform map functional operation in Java. This means it can
    transform one type of object to others by applying a function.


    For example, if you have a `List` of `String` and you want to convert that to
    a `List` of `Integer`, you can use `map()` to do so.


    Just supply a function to convert `String` to `Integer` e.g. `parseInt()` to `map()`
    and it will apply that to all elements of `List` and give you a `List` of `Integer`.
    In other words, the `map` can convert one object to another.


    If you want to learn more about these new methods introduced in `Java S.E. 8`,
    I suggest you take a look at The Complete Java Masterclass course on Udemy. One
    of the most comprehensive courses which cover everything Java developers need
    to know.


    ![](image/Java_8_Comparator_example.png)


    ## 3. What does the `filter()` method do? when you use it?


    The `filter` method is used to filter elements that satisfy a certain condition
    that is specified using a `Predicate` function.


    A `predicate` function is nothing but a function that takes an `Object` and returns
    a `boolean`. For example, if you have a `List` of `Integer` and you want a list
    of even integers.


    In this case, you can use the `filter` to achieve that. You supply a function
    to check if a number is even or odd, just like this function and `filter` will
    apply this to stream elements and filter the elements which satisfy the condition
    and which doesn’t.


    ## 4. What does the `flatMap()` function do? why you need it?


    The `flatMap` function is an extension of the `map` function. Apart from transforming
    one object into another, it can also flatten it.


    For example, if you have a list of the list but you want to combine all elements
    of lists into just one list. In this case, you can use `flatMap()` for flattening.
    At the same time, you can also transform an object like you do use `map()` function.


    ## 5. What is difference between `flatMap()` and `map()` functions?


    Even though both `map()` and `flatMap()` can be used to transform one object to
    another by applying a method on each element.


    The main difference is that `flatMap()` can also flatten the `Stream`. For example,
    if you have a list of the list, then you can convert it to a big list by using
    `flatMap()` function.


    Btw, if you find trouble understanding these functional programming methods like
    `map`, `flatMap`, `filter`, etc., I suggest you go through `From Collections to
    Streams in Java 8` course on Pluralsight. It’s an advanced course but very good.


    ![](image/From_Collections_to_Streams_in_Java_8_Pluralsight_course.jpg)


    By the way, you would need a Pluralsight membership to access this course, which
    costs around $29 monthly or $299 annually (14% discount). I have one, and I also
    suggest all developers have that plan because Pluralsight is like NetFlix for
    Software developers. It has more than 5000+ good quality courses on all the latest
    topics. Since we programmers have to learn new things every day, an investment
    of $299 USD is not bad. Btw, it also offers a 10-day free trial without any obligation,
    which allows you to watch 200 hours of content. You can watch this course for
    free by signing for that trial.


    ## 6. What is the difference between intermediate and terminal operations on Stream?


    The intermediate `Stream` operation returns another `Stream`, which means you
    can further call other methods of `Stream` to compose a pipeline. For example
    after calling `map()` or `flatMap()` you can still call `filter()` method on `Stream`.


    On the other hand, the terminal operation produces a result other than Streams
    like a value or a `Collection`. Once a terminal method like `forEach()` or `collect()`
    is called, you cannot call any other method of `Stream`.


    ![](image/Java_8_Stream_Examples.png)


    ## 7. What does the `peek()` method do? When should you use it?


    The `peek()` method of `Stream` class allows you to see through a Stream pipeline.
    You can peek through each step and print meaningful messages on the console. It’s
    generally used for debugging issues related to lambda expression and Stream processing.


    ## 8. What do you mean by saying Stream is lazy?


    When we say `Stream` is lazy, we mean that most of the methods defined on `java.stream.Stream`
    class is lazy i.e. they will not work by just including them on Stream pipeline.
    They only work when you call a terminal method on the Stream and finish as soon
    as they find the data they are looking for rather than scanning through the whole
    set of data.


    ## 9. What is a functional interface in Java 8?


    As the name suggests, a functional interface is an interface that represents a
    function. Technically, an interface with just one abstract method is called a
    functional interface. You can also use `@FunctionalInterface` to annotated a functional
    interface. In that case, the compiler will verify if the interface actually contains
    just one abstract method or not. It’s like the `@Override` annotation, which prevents
    you from accidental errors.


    Another useful thing to know is that If a method accepts a functional interface,
    then you can pass a lambda expression to it. Some examples of the functional interface
    are `Runnable`, `Callable`, `Comparator`, and `Comparable` from old API and `Supplier`,
    `Consumer`, and `Predicate`, etc. from new function API. You can learn more about
    those interfaces in ` What’s New in Java 8` on Pluralsight.


    ## 10. What is the difference between a normal and functional interface in Java?


    The normal interface in Java can contain any number of abstract methods, while
    the functional interface can only contain just one abstract method. You might
    be thinking why they are called functional

