    # 深度解析 Java 面试


    ## 序列化面试题


    毫无疑问，Java 是非常庞大的，有些 Java 话题很多开发者很少探索的。序列化就是其中之一，在实践中很少使用，但在 Java 面试中非常流行。它也是难以掌握的主题之一，这就是为什么我要在这一部分分享一些经常遇到的
    Java 序列化面试题。我不知道为什么并不是每个人都使用它，人们却问这么多关于序列化的问题，但我一直看到关于 Java 序列化的问题。这些也是最难回答且最困惑的问题，普通的
    Java 开发者可能无法回答。


    我仍然记得在职业生涯早期，在一家大型投资银行的 Java 面试中被问到关于 `readObject()` 和 `writeObject()` 方法。那是我第一次听到这些方法。我确定，我并不孤单，有很多
    Java 开发者在职业生涯早期阶段没有听过这两个方法。


    从那时起，我走了很长的路，学习了许多关于 Java 序列化的知识并在现实世界中见过它们。诚实地说，这是 Java 的一个非常复杂的功能，如果你必须处理使用序列化的代码，你破坏它的概率可能大于修复它。


    我曾接手一个任务，在我们其中一个实现了 `Serializable` 的领域类 `Order.java` 中添加一个新字段。我添加了字段，结果在日志文件中看到了
    `NotSerializableException`，然后我意识到你将添加的任何字段必须实现 `Serializable` 或 `Externalizable`
    接口，除非它是 `transient` 或 `static` 的。


    有很多这样的细节，你只有通过刻苦阅读或实际实践经验才能了解。尽管如此，有一本书对我帮助很大那就是 *Effective Java*。它包含了关于这个主题最好的素材，我强烈建议每位
    Java 开发者阅读这本书以及所有与 Java 序列化相关的内容。


    不再浪费你的更多时间，这里有一些关于序列化主题的 Java 问题，不过你还需要更多的问题来做好准备。


    ### 1. 什么是 Serializable 接口？它的目的是什么？


    `Serializable` 是一个标记接口（marker interface），它表示任何实现 `Serializable` 接口的类对象可以使用 `JVM`
    的默认序列化机制存储在磁盘上，或通过网络进行传输。


    ### 2. Serializable 和 Externalizable 接口之间的区别是什么？


    这两个接口都允许你的对象被序列化或转换为二进制格式，该格式可以保存到磁盘或通过网络传输，但它们之间的关键区别是：`Serializable` 使用 `JVM`
    的默认序列化机制，而 `Externalizable` 提供了在序列化前后执行某些操作的钩子和回调。


    ### 3. 什么是 transient 变量？它的目的是什么？


    `transient` 变量在序列化过程中不会被保存。正如名称所示，它们是瞬态的，并不是对象状态的一部分。你可以使用 `transient` 变量将某些字段排除在序列化之外，例如一个不可序列化的字段应该被标记为
    `transient` 或 `static`。


    ### 4. Java 中的 SerialVersionUID 是什么？它为什么重要？


    `SerialVersionUID` 是一个在序列化过程中生成的标识符（如果在类中没有定义的话）。不显式指定的危险之处在于，默认逻辑生成的这个 ID 取决于类元数据（如字段数量），这意味着如果你添加了新字段或删除了旧字段，它就会变得。


    这意味着，你可能无法用新版本的代码恢复旧的序列化实例。当你将 `SerialVersionUID` 定义为 `public static final long`
    常量时，默认序列化机制就不会再生成它，因此它变得独立于类元数据。


    正如我所说的，对这个主题的良好知识对于 Java 程序员非常重要，如果你想学习更多，我强烈建议你参加 Udemy 上优秀的 Java 课程，如 `Java
    In-Depth: Become a Complete Java Engineer!`。


    ![](img/What_is_SerialVersionUID_in_Java_and_Why_you_need_that.png)


    ### 5. Serializable 接口中有多少方法？


    没有，`java.io.Serializable` 是一个标记接口，它没有任何方法。


    ### 6. Java 中的什么是标记接口（marker interface）？


    一个没有任何方法的接口。这种接口只是给编译器、`JVM` 或某些工具用于特殊处理的指示。它们类似于注解（annotation），因此在 Java 5 引入注解后，它们就过时了。


    ### 7. 你可以在 Serializable 类中添加一个没有实现该接口的字段吗？


    不可以，那会抛出 `NotSerializableException`。如果你绝对想添加，可以将其标记为 `static` 或 `transient`，但该对象的状态在序列化时不会被保存。


    # 深度解析 Java 面试


    ## 8. 在 Java 中如何序列化对象？


    为了序列化对象，确保它实现了 `Serializable`，然后使用 `ObjectOutputStream.writeObject()` 将对象保存到磁盘。


    ### 9. Java 中的序列化是如何工作的？


    当你序列化一个对象时，首先序列化父类，然后是子类。如果任何字段没有实现 `Serializable` 接口（引用类型），则会抛出 `NotSerializableException`。尽管如此，如果你想学习更多关于
    Java 序列化的知识，我也建议你学习 Udemy 上全面的 Java 课程 `Java Masterclass`。


    ![](img/Serialization_in_Java.jpg)


    ## 10. 静态变量如何？它们会被序列化吗？


    静态变量不会序列化。因为 `static` 是类级变量，也就是说每个实例具有相同的值。如果你的序列化对象依赖于静态变量的值，就会产生问题，因为当你反序列化对象时，它将获得其他实例拥有的静态变量值，这可能不同。所以，不要让你的序列化对象依赖静态变量。


    ### 11. Java 中 transient 和 volatile 变量有什么区别？


    它们完全不同，`volatile` 用于多线程，指示编译器该变量会被多个线程访问并提供顺序和可见性保证；而 `transient` 变量用于将字段排除在持久化序列化之外。


    ### 12. 如果父类是 Serializable，你可以在子类中不可序列化吗？子类必须实现 Serializable 接口吗？


    是的，你可以让子类变为不可序列化。即使父类是可序列化的，子类也不强制是可序列化类。


