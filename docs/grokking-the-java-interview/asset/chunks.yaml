    \ instead of recalculating them, this will impress your interviewer a bit.\n\n\
    ## 27) What is difference between calling `start()` and `run()` method of Thread?\n\
    \nYou might have heard this question before, if calling `start()` method calls\
    \ the `run()` method eventually then why just call the `run()` method? Well the\
    \ difference is, `start` method also starts a new thread. If you call the `run`\
    \ method directly then it will run on same thread not on different thread, which\
    \ is what original intention would be.\n\n## 28) Write a Program to solve Producer\
    \ Consumer problem in Java?\n\nA very good question to check if candidate can\
    \ write inter thread communication code or not. If a guy can write producer consumer\
    \ solution by hand and point out critical section and how to protect, how to communicate\
    \ with thread then he is good enough to write and maintain your concurrent Java\
    \ program. This is the very minimum requirement for a Java developer and that’s\
    \ why I love this question, it also has several solution e.g. by using concurrent\
    \ collections like `blocking queue`, by using `wait` and `notify` and by using\
    \ other synchronizers of Java 5 e.g. `semaphores`.\n\n## 29) How to find middle\
    \ element of linked list in one pass?\n\nAnother simple problem solving question\
    \ for warm up. In a singly linked list you can only traverse in one direction\
    \ and if you don’t know the size then you cannot write a loop to exactly find\
    \ out middle element, that is the crux of the problem. One solution is by using\
    \ two pointers, fast and slow. Slower pointer moves 1 step when faster pointer\
    \ move to 2 steps, causing slow to point to middle when fast is pointing to end\
    \ of the list i.e. `null`.\n\n## 30) What is `equals()` and `hashCode()` contract\
    \ in Java? Where does it used?\n\nOne of the must ask question in Java telephonic\
    \ interview. If a guy doesn’t know about `equals()` and `hashCode()` then he is\
    \ probably not worth pursuing further because its the core of the Java fundamentals.\
    \ The key point of contract is that if two objects are equal by `equals()` method\
    \ then they must have same `hashcode`, but unequal object can also have same `hashcode`,\
    \ which is the cause of collision on hash table based collection e.g. `HashMap`.\
    \ When you override `equals()` you must remember to override `hashCode()` method\
    \ to keep the contract valid.\n\n## 31) Why `wait` and `notify` methods are declared\
    \ in Object class?\n\nThis question is more to find out how much experience you\
    \ really have and what is your thinking towards Java API and its design decision.\
    \ Similar question is why `String` is immutable in Java? Well, true answer can\
    \ only be given by Java designers but you can reason something. For example, `wait`\
    \ and `notify` methods are associated with locks which is owned by object not\
    \ thread, and that’s why it make sense to keep those method on `java.lang.Object`\
    \ class.\n\n## 32) How does `HashSet` works in Java?\n\n`HashSet` is internally\
    \ implemented using `HashMap` in Java and this is what your interviewer wants\
    \ to hear. He could then quiz you with some common sense based question e.g. how\
    \ can you use `HashMap` because its needs two object key and value? what is the\
    \ value in case of `HashSet`? Well, in case of `HashSet` a dummy object is used\
    \ as value and key objects are the actual element on Set point of view. Since\
    \ `HashMap` doesn’t allow duplicate key it also follows contract of set data structure\
    \ to not allow duplicates.\n\n## 33) What is difference between `synchronized`\
    \ and concurrent Collection in Java?\n\nThere was time, before Java 1.5 when you\
    \ only have `synchronized` collection if you need them in a multi-threaded Java\
    \ program. Those classes were plagued with several issue most importantly performance\
    \ because they lock the whole collection or map whenever a thread reads or writes.\
    \ To address those issue, Java released couple of Concurrent collection classes\
    \ e.g. `ConcurrentHashMap`, `CopyOnWriteArrayList` and `BlockingQueue` to provide\
    \ more scalability and performance.\n\n## 34) What is difference between `Iterator`\
    \ and `Enumeration` in Java?\n\nMain difference is that `Iterator` was introduced\
    \ in place of `Enumeration`. It also allows you to remove elements from collection\
    \ while traversing which was not possible with `Enumeration`. The methods of `Iterator`\
    \ e.g. `hasNext()` and `next()` are also more concise then corresponding methods\
    \ in `Enumeration` e.g. `hasMoreElements()`. You should always use `Iterator`\
    \ in your Java code as `Enumeration` may get deprecated and removed in future\
    \ Java release.\n\n## 35) What is difference between Overloading and Overriding\
    \ in Java?\n\nAnother frequently asked question from telephonic round of Java\
    \ interviews. Though both overloading and overriding are related with methods\
    \ of same names but they have different characteristics e.g.overloaded methods\
    \ must have different method signature than original method but overridden method\
    \ must have same signature. Also, overloaded methods are resolved at compiled\
    \ time while overridden methods are resolved at runtime.\n\n## 36) Difference\
    \ between static and dynamic binding in Java?\n\nThis is usually asked as follow-up\
    \ of previous question, static binding is related to overloaded method and dynamic\
    \ binding is related to overridden method. Method like `private`, `final` and\
