    在协变方法重写（covariant method overriding）中，重写的方法可以返回原始或被重写方法的对象的子类。这个概念是在 `Java` 1.5
    (Tiger) 版本中引入的，当原始方法返回如 `Object` 类等通用类型时，它非常有帮助，因为通过使用协变方法重写，你可以返回更合适的对象并防止客户端侧进行类型转换。该概念的实际应用之一是在你在
    `Java` 中重写 `clone()` 方法时。


    ### 在重写时，我们可以将方法的返回类型更改为子类吗？


    是的，可以，但仅从 `Java` 5 开始支持。这一特性被称为协变方法重写，是在 `JDK` 5 发布中引入的。如果原始方法返回父类（例如 `clone()`
    方法返回 `java.lang.Object`），那么这非常有帮助。通过这种方法，你可以直接返回实际类型，防止对结果进行客户端侧进行类型转换。


    ### 我们可以更改重写方法的参数列表吗？


    不，不可以。参数列表是方法签名的一部分，重写方法和被重写方法必须具有相同的签名。


    ### 我们可以重写抛出运行时异常但不带 `throws` 句的方法吗？


    是的，在重写时对未检查异常（unchecked exceptions）没有限制。另一方面，在检查异常的情况下，重写异常不能抛出在类型层次中更高的检查异常，例如：如果原始方法抛出
    `IOException`，那么重写方法不能抛出 `java.lang.Exception` 或 `java.lang.Throwable`。


    ### 在子类中调用重写方法的父类版本？


    你可以使用 `super` 关键字在子类中调用重写方法的父类版本。例如，调用 `java.lang.Object` 类的 `toString()` 方法，你可以调用
    `super.toString()`。


    ### 在 Java 中可以将非静态方法重写为静态方法吗？


    是的，你可以在 `Java` 中重写非静态方法，这没有问题，但它不应该是 `private` 或 `final` 的 :)


    ### 可以在 Java 中重写 final 方法吗？


    不，你不能在 `Java` 中重写 `final` 方法，方法上的 `final` 关键字是为了防止方法被重写。当你出于安全考虑，不希望子类通过重写来改变你方法的逻辑时，就会使用
    `final`。这就是为什么 `Java` 中的 `String` 类是 `final` 的。这个概念也用于模板设计模式，其中模板方法被设为 `final`
    以防止重写。


    ### 接口内部可以是非抽象方法吗？


    从 `Java` 8 开始，你可以在 `interface` 中拥有非抽象方法，在此之前是不允许的，因为所有方法隐式地为 public abstract。从
    `JDK` 8 开始，你可以在 `interface` 内部添加 `static` 和 `default` 方法。


    ### Java 8 的默认方法是什么？


    默认方法（default method），也称为扩展方法，是你现在可以在接口上添加的新类型方法。这些方法具有实现，并旨在默认使用。通过这种方法，`JDK`
    8 成功地提供了与 lambda 表达式和流 API 相关的常用功能，而不会破坏所有实现接口的客户端。如果你查看 `Java` 8 API 文档，你会发现在
    `Iterator`、`Map` 等关键 Java 接口上有许多实用的默认方法。


    ### Java 中的抽象类是什么？


    抽象类是不完全的类。在 `Java` 中，你不能创建抽象类的实例。它们的提供是为了定义默认行为，并确保该类的客户端必须遵守抽象类内部定义的契约。为了使用它，你必须扩展并实现它们的抽象方法。顺带说，在
    `Java` 中，类可以在不指定任何抽象方法的情况下是抽象。


    ### Java 中的接口是什么？接口的真实用途是什么？


    像抽象类，`interface` 也是为了指定 API 的契约。它支持 OOP 抽象概念，因为它只定义了抽象行为。它会告诉你的程序将产生输出，但如何实现取决于实现者。接口的真实用途是定义类型以利用多态。


    ### 抽象类和接口之间的区别？


    在 `Java` 中，关键区别在于抽象类可以包含非抽象方法，但接口不能，不过从 `Java` 8 开始，接口也可以包含非抽象的 `static` 和 `default`
    方法。


    ![](img/abstract_class_vs_interface_in_Java.png)


    ### 我们可以在没有抽象方法的情况下让类变成抽象的吗？


    是的，只需在类定义上添加 `abstract` 关键字，你的类就会变成抽象类。


    ### 我们可以让一个类既是 final 的又是抽象的吗？


    不，你不能在类上同时应用 `final` 和 `abstract` 关键字，因为它们是完全相反的。`Java` 中的 `final` 类不能被扩展，而你无法在不扩展并转换为具体类的情况下使用抽象类。根据
    Java 规范，如果你尝试让一个类同时是抽象和 final，编译器将抛出错误。


    ### 可以在 Java 中重载或重写 main 方法吗？


    不，由于 `main()` 是一个 `static` 方法，你只能对其进行重载，不能重写它，因为 `static` 方法在编译时解析，不需要对象信息，因此我们不能在
    `Java` 中重写 `main` 方法。


    ### 多态（Polymorphism）、重载（Overloading）和重写（Overriding）的区别是什么？


    这是一个微妙的 OOP 概念问题，因为多态是重载和重写背后的真实概念。重载是编译时多态，而重写是运行时多态。


    ### Java 中的接口可以扩展多个接口吗？


    是的，接口在 `Java` 中可以扩展多个接口，这是完全有效的。


    ### Java 中的类可以扩展多个类吗？


    不，类只能扩展另一个类，因为 `Java` 不支持多继承，但是的，它可以实现多个接口。


    ### Java 中抽象和多态的区别是什么？


    抽象泛化概念，而多态允许你在不更改代码的情况下使用不同的实现。这张图很好地解释了抽象：


    ![](img/OOP_Abstraction.jpg)


    ## 面对象设计原则与模式面试


    现在让我们来看基于 SOLID 设计原则和 GOF 设计模式的一些 OOP 概念问题，这些利用了这里讨论的 OOP 概念。


    ### Java 中的策略模式解决了什么问题？


    策略模式允许在不更改使用算法代码的情况下引入新算法或新策略。例如，对对象列表排序的 `Collections.sort()` 方法使用策略模式来比较对象。由于每个对象使用不同的比较策略，可以在更改排序方法的情况下比较各种对象。


    ### 装饰模式基于哪个 OOP 概念？


    装饰模式利用组合（Composition）在不修改原始类的情况下提供新功能。这是一个非常好的直接面试题。这从策略模式的 UML 图中看得很清楚，因为你可以看到
    Component 与 Decorator 关联。


    ![](img/Decorator_Design_Pattern_in_Java_UML.png)


    ### 在 Java 中何时使用单例设计模式？


    当你只需要类的一个实例并希望它是全局可用的时，可以使用单例模式。它并不是免费的，因为它会增加类之间的耦合性并使它们难以测试。这是 Java 面试中最老的设计模式问题之一。


