    50) List down 3 multi-threading best practice you follow?


    This is my favorite question because I believe that you must follow certain best
    practices while writing concurrent code which helps in performance, debugging
    and maintenance. Following are three best practices, I think an average Java programmer
    should follow:


    Always give meaningful name to your thread


    This goes a long way to find a bug or trace an execution in concurrent code. OrderProcessor,
    QuoteProcessor or TradeProcessor is much better than Thread-1. Thread-2 and Thread-3.
    The name should say about task done by that thread. All major framework and even
    JDK follow this best practice.


    Avoid locking or Reduce scope of Synchronization


    Locking is costly and context switching is even costlier. Try to avoid synchronization
    and locking as much as possible and at a bare minimum, you should reduce critical
    section. That’s why I prefer synchronized block over synchronized method because
    it gives you absolute control on the scope of locking.


    Prefer Synchronizers over wait and notify


    Synchronizers like CountDownLatch, Semaphore,


    64


    GROKKING THE JAVA INTERVIEW


    CyclicBarrier or Exchanger simplifies coding. It’s very difficult to implement
    complex control flow right using wait and notify. Secondly, these classes are
    written and maintained by best in business and there is good chance that they
    are optimized or replaced by better performance code in subsequent JDK releases.
    By using higher level synchronization utilities, you automatically get all these
    benefits.


    Prefer Concurrent Collection over Synchronized Collection


    This is another simple best practice which is easy to follow but reap good benefits.
    Concurrent collection are more scalable than their synchronized counterpart, that’s
    why its better to use them while writing concurrent code. So next time if you
    need map, think about ConcurrentHashMap before thinking Hashtable.


    51) How do you force to start a Thread in Java?


    This question is like how do you force garbage collection in Java, there is no
    way though you can make a request using System.gc() but it’s not guaranteed. On
    Java multi-threading there is absolutely no way to force start a thread, this
    is controlled by thread scheduler and Java exposes no API to control thread schedule.
    This is still a random bit in Java.


    65


    GROKKING THE JAVA INTERVIEW


    52) What is the fork-join framework in Java?


    The fork-join framework, introduced in JDK 7 is a powerful tool available to Java
    developer to take advantage of multiple processors of modern day servers. It is
    designed for work that can be broken into smaller pieces recursively. The goal
    is to use all the available processing power to enhance the performance of your
    application. One significant advantage of The fork/join framework is that it uses
    a work-stealing algorithm. Worker threads that run out of things to do can steal
    tasks from other threads that are still busy.


    53) What is the difference between calling wait() and sleep() method in Java multi-threading?


    Though both wait and sleep introduce some form of pause in Java application, they
    are the tool for different needs. Wait method is used for inter-thread communication,
    it relinquishes lock if waiting for a condition is true and wait for notification
    when due to an action of another thread waiting condition becomes false. On the
    other hand sleep() method is just to relinquish CPU or stop execution of current
    thread for specified time duration. Calling sleep method doesn’t release the lock
    held by the current thread.


    You can use this list to not only to prepare for your core Java and programming
    interviews but also to check your knowledge about basics of threads, multi-threading,
    concurrency, design patterns and threading


    66


    GROKKING THE JAVA INTERVIEW


    issues like race conditions, deadlock and thread safety problems.'
