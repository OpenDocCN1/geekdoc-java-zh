    # GROKKING THE JAVA INTERVIEW


    ## PREFACE


    Cracking a Java Interview is not easy and one of the main reason for that is Java
    is very vast. There are lot of concepts and APIs to master to become a decent
    Java developer. Many people who are good at general topics like Data Structure
    and Algorithms, System Design, SQL and Database fail to crack the Java interview
    because the don’t spend time to learn the Core Java concepts and essential APIs
    and packages like Java Collection Framework, Multithreading, JVM Internals, JDBC,
    Design Patterns and Object Oriented Programming.


    This book aims to fill that gap and introduce you will classical Java interview
    questions from these topics. By going through these questions and topic you will
    not only expand your knowledge but also get ready for your Next Java interview.
    If you are preparing for Java interviews then I highly recommend you go through
    these questions before your telephonic or face-to-face interviews, you will not
    only gain confidence and knowledge to answer the question but also learn how to
    drive Java interview in your favor. This is the single most important tip I can
    give you as a Java developer. Always, remember, your answers drive interviews,
    and these questions will show you how to drive Interviewer to your strong areas.
    All the best for Java interview and if you have any questions or feedback you
    can always contact me on [twitter javinpaul](http://twitter.com/javinpaul) or
    comment on my blogs [Javarevisited](http://javarevisited.blogspot.com) and [Java67](http://java67.com).


    # Object Oriented Programming Interview Questions


    Java is an object-oriented programming language and you will see a lot of object-oriented
    programming concept questions on Java interviews. The classic questions like the
    difference between an interface and abstract class are always there but from the
    last couple of years more sophisticated questions based upon advanced design principles
    and patterns are also asked to check OOP knowledge of the candidate. Though, Object-oriented
    programming questions are more popular on Java interviews for 1 to 3 years experienced
    programmers. It makes sense as well, as these are the programmers who must know
    the OOP basics like Abstraction, Inheritance, Composition, Class, Object, Interface,
    Encapsulation, etc.


    If you look for Java interview questions for 2 to 4 years experienced programmer,
    you will find lots of questions based upon OOP fundamentals like Inheritance and
    Encapsulation but as you gain more experience, you will see questions based on
    object-oriented analysis and design e.g. code a vending design machine or implement
    a coffeemaker in Java.


    These questions are more difficult and require not only a true understanding of
    OOP fundamentals but also about SOLID design principles and patterns.


    In this section, I am going to share with you some OOPS concept based Java interview
    questions that I have collected from friends and colleagues and they have seen
    in various Java interviews on different companies. They are mostly asked at first
    a few rounds like on screening round or on the telephonic round.


    If you are a senior Java developer then you already know answers to this question
    and I suggest you practice more on object-oriented analysis and design skill i.e.
    how to do code against a specification. If you are fresher and junior Java developer
    with 2 to 3 years experience then you must revise these questions, learn if you
    don’t know to do well on your Java Job interviews.


    ### What is method overloading in OOP or Java?


    It’s one of the oldest OOPS concept questions, I have seen it 10 years ago and
    still sees it now. When we have multiple methods with the same name but different
    functionality then it’s called method overloading. For example. `System.out.println()`
    is overloaded as we have a 6 or 7 `println()` method each accepting a different
    type of parameter.


    ### What is the method overriding in OOP or Java?


    It’s one of the magic of object-oriented programming where the method is chose
    based upon an object at runtime. In order for method overriding, we need Inheritance
    and Polymorphism, as we need a method with the same signature in both superclass
    and subclass. A call to such a method is resolved at runtime depending upon the
    actual object and not the type o variable.


    ### What is the method of hiding in Java?


    When you declare two static methods with same name and signature in both superclass
    and subclass then they hide each other i.e. a call to the method in the subclass
    will call the static method declared in that class and a call to the same method
    is superclass is resolved to the static method declared in the super-class.


    ### Is Java a pure object-oriented language? if not why?


    Java is not a pure object-oriented programming language e.g. there are many things
    you can do without objects e.g. static methods. Also, primitive variables are
    not objects in Java.


    ### What are the rules of method overloading and overriding in Java?


    One of the most important rules of method overloading in Java is that the method
    signature should be different i.e. either the number of arguments or the type
    of arguments. Simply changing the return type of two methods will not result in
    overloading, instead, the compiler will throw an error. On the other hand, method
    overriding has more rules e.g. name and return type must be the same, method signature
    should also be the same, the overloaded method cannot throw a higher exception,
    etc.


    ### The difference between method overloading and overriding?


    Several differences but the most important one is that method overloading is resolved
    at compile-time and method overriding is resolved at runtime. The compiler only
    used the class information for method overloading, but it needs to know the object
    to resolved overridden method calls. This diagram explains the difference quite
    well, though:


    ![](image/Difference_between_method_overloading_and_overriding_in_Java.gif)


    ### Can we overload a static method in Java?


    Yes, you can overload a static method in Java. You can declare as many static
    methods of the same name as you wish all all of them have different method signatures.


    ### Can we override the static method in Java?


    No, you cannot override a static method because it’s not bounded to an object.
    Instead, static methods belong to a class and resolved at compile time using the
    type of reference variable. But, Yes, you can declare the same static method in
    a subclass, that will result in method hiding i.e. if you use the reference variable
    of type subclass then new method will be called, but if you use the reference
    variable of superclass than old method will be called.


    ### Can we prevent overriding a method without using the final modifier?


    Yes, you can prevent the method overriding in Java without using the final modifier.
    In fact, there are several ways to accomplish it e.g. you can mark the method
    private or static, those cannot be overridden.


    ### Can we override a private method in Java?


    No, you cannot. Since the private method is only accessible and visible inside
    the class they are declared, it’s not possible to override them in subclasses.
    Though, you can override them inside the inner class as they are accessible there.


    ### What is the covariant method overriding in Java?

