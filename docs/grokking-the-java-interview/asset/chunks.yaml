  raw: 'In the covariant method overriding, the overriding method can return the subclass
    of the object returned by the original or overridden method. This concept was
    introduced in Java 1.5 (Tiger) version and it’s very helpful in case the original
    method is returning general type like Object class, because, then by using the
    covariant method overriding you can return a more suitable object and prevent
    client-side typecasting. One of the practical use of this concept is when you
    override the clone() method in Java.


    Can we change the return type of method to subclass while overriding?


    Yes, you can, but only from Java 5 onward. This feature is known as covariant
    method overriding and it was introduced in JDK 5 release. This is immensely helpful
    if the original method return super-class like clone() method return java.lang.Object.
    By using this, you can directly return the actual type, preventing client-side
    type-casting of the result.


    Can we change the argument list of an overriding method?


    No, you cannot. The argument list is part of the method signature and both overriding
    and overridden


    8


    GROKKING THE JAVA INTERVIEW


    methods must have the same signature.


    Can we override a method that throws runtime exception without throws clause?


    Yes, there is no restriction on unchecked exceptions while overriding. On the
    other hand, in the case of checked exception, an overriding exception cannot throw
    a checked exception which comes higher in type hierarchy e.g. if the original
    method is throwing IOException than the overriding method cannot throw java.lang.Exception
    or java.lang.Throwable.


    How do you call a superclass version of an overriding method in a subclass?


    You can call a superclass version of an overriding method in the subclass by using
    super keyword. For example to call the toString() method from java.lang.Object
    class, you can call super.toString().


    Can we override a non-static method as static in Java?


    Yes, you can override the non-static method in Java, no problem on them but it
    should not be private or final :)


    Can we override the final method in Java?


    No, you cannot override a final method in Java, the final keyword with the method
    is to prevent method


    9


    GROKKING THE JAVA INTERVIEW


    overriding. You use the final when you don’t want subclass changing the logic
    of your method by overriding it due to security reasons. This is why the String
    class is final in Java. This concept is also used in the template design patterns
    where the template method is made final to prevent overriding.


    Can we have a non-abstract method inside an interface?


    From Java 8 onward you can have a non-abstract method inside interface, prior
    to that it was not allowed as all method was implicitly public abstract. From
    JDK 8, you can add static and default methods inside an interface.


    What is the default method of Java 8?


    The default method, also known as the extension method is new types of the method
    which you can add on the interface now. These method has implementation and intended
    to be used by default. By using this method, JDK 8 managed to provide common functionality
    related to lambda expression and stream API without breaking all the clients which
    implement their interfaces. If you look at Java 8 API documentation you will find
    several useful default methods on key Java interface like Iterator, Map, etc.


    10


    GROKKING THE JAVA INTERVIEW


    What is an abstract class in Java?


    An abstract class is a class that is incomplete. You cannot create an instance
    of an abstract class in Java. They are provided to define default behavior and
    ensured that client of that class should adore to those contract which is defined
    inside the abstract class. In order to use it, you must extend and implement their
    abstract methods. BTW, in Java, a class can be abstract without specifying any
    abstract method.


    What is an interface in Java? What is the real user of an interface?


    Like an abstract class, the interface is also there to specify the contract of
    an API. It supports the OOP abstraction concept as it defines only abstract behavior.
    It will tell that your program will give output but how is left to implementors.
    The real use of the interface to define types to leverage Polymorphism.


    The difference between Abstract class and interface?


    In Java, the key difference is that abstract class can contain a non-abstract
    method but the interface cannot, but from Java 8 onward interface can also contain
    static and default methods that are non-abstract.


    11


    GROKKING THE JAVA INTERVIEW


    ![](image/abstract_class_vs_interface_in_Java.png)


    Can we make a class abstract without an abstract method?


    Yes, just add abstract keyword on the class definition and your class will become
