  trans: "\n接口？一旦你知道了答案，可能让你更容易记住这个概念。\n\n其实，它们被称为函数式接口，因为它们将函数封装在接口中。该函数由接口上的单个抽象方法表示。\n\
    \n### 11. `findFirst()` 方法和 `findAny()` 方法之间有什么区别？\n\n`findFirst()` 方法将返回第一个符合标准（即\
    \ `Predicate`）的元素，而 `findAny()` 方法将返回任意符合标准的元素，这在处理并行流（parallel stream）时非常有用。你可以进一步阅读此文章获取\
    \ Java 8 中 `findFirst()` 方法的运行示例。\n\n### 12. 什么是 `Predicate` 接口？\n\n`Predicate`\
    \ 是一个表示函数的函数式接口，它接收一个 `Object` 并返回一个 `boolean` 结果。它被用于多个 Stream 方法，例如 `filter()`，该方法使用\
    \ `Predicate` 来过滤掉不需要的元素。\n\n以下是 `Predicate` 函数的常见样式：\n\n```java\npublic boolean\
    \ test(T object){\n    return boolean;\n}\n```\n\n你可以看到它只有一个 `test()` 方法，该方法接收一个对象并返回一个\
    \ `boolean`。该方法用于测试条件，如果通过则返回 `true`，否则返回 `false`。\n\n### 13. 什么是 `Supplier` 和\
    \ `Consumer` 函数式接口？\n\n`Supplier` 是返回对象的函数式接口。它类似于工厂方法或 `new()`，后者都会返回一个对象。\n\n\
    `Supplier` 拥有 `get()`get 方法，它不接受任何参数并返回类型为 `T` 的对象。这意味着你可以在任何需要对象的地方它。由于它是函数式接口，你也可以将其作为\
    \ lambda 表达式或方法引用的赋值目标。\n\n`Consumer` 也是 JDK 8 中的函数式接口，它表示一个接受单个输入参数且不返回结果的操作。\n\
    \n与其他函数式接口不同，`Consumer` 预期通过副作用（side-effects）进行操作。`Consumer` 的函数方法是 `accept(T\
    \ t)`，因为它是函数式接口，你可以将其作为 Java 8 中 lambda 表达式或方法接口的赋值目标。\n\n### 14. 你可以将数组转换为 Stream\
    \ 吗？如何做？\n\n是的，你可以在 Java 中将数组转换为 `Stream`。`Stream` 类提供了一个工厂方法从数组创建 `Stream`，例如\
    \ `Stream.of(T ...)`，它接受可变参数，这意味着你可以像下面的示例所示将数组传递给它：\n\n```java\nString[] languages\
    \ = {\"Java\", \"Python\", \"JavaScript\"};\nStream numbers = Stream.of(languages);\n\
    numbers.forEach(System.out::println);\n```\n\n输出：\n```\nJava\nPython\nJavaScript\n\
    ```\n\n### 15. 什么是并行流（parallel Stream）？如何从 `List` 获取并行流？\n\n并行流可以并行执行流处理任务。例如，如果你有一个包含\
    \ 100 万个订单的并行流，并且你正在寻找价值超过 100 万的订单，你可以使用 `filter` 来完成。\n\n与顺序流 `Stream` 不同，并行流可以启动多个线程在\
    \ `Stream` 的不同部分搜索这些订单，然后合并结果。\n\n简而言之，并行流可以实现并行执行，但正如 Cay S. Horstman 在《Core\
    \ Java S.E. 9 for the Impatient》中提到的，并行化存在显著的开销，只有在进行批量数据操作时，这种开销才是值得的。\n\n以上就是关于基于\
    \ Java 8 Stream 和函数式编程概念的常见面试题。由于 Java 8 现在是编写 Java 代码的现代方式，越来越多的公司正在寻找具备良好 Java\
    \ 8 技能的 Java 开发者。\n\n## 附录\n\n### 我破解 Java 面试的最爱技巧\n\n大家好，我想和大家分享一个技巧，它在我的 Java\
    \ 面试中对我帮助很大。我参加过几十次 Java 面试，也面试过很多 Java ，我经常看到人们使用这种策略来给面试官留下深刻印象。\n\n这里的诀窍是将面试引导到你擅长的领域。Java\
    \ 是非常庞大的，在 1 小时面试等有限时间内，没有人可能涵盖所有内容。面试官在电话阶段通常有一列问题来筛选候选人，但在面试中，他们更喜欢检查候选人知识的深度，这就是你可以使用这个技巧的地方。\n\
    \n例如，如果面试官问你关于 `HashMap`，你不仅可以回答关于 `HashMap` 的问题，还可以提到相关的细节，如哈希、`equals()` 和 `hashCode()`\
    \ 如何使用，以及对象是如何存储在 `HashMap` 中的（链表 vs 二叉树），前提是你熟悉这些主题。当你提到这些关键词时，面试官更有可能针对这些主题提问，然后你就可以展示你的知识并引导面试。\n\
    \n这里的诀窍是强调你精通的主题，不要提到任何你不太熟悉的额外内容。这个技巧非常简单，一旦你开始面试，你就会意识到自己正在这样做；但如果你现在还没有这样做，我建议和朋友或在网上进行模拟面试，看看你是否正在利用这个技巧为自己服务。\n\
    \n祝你 Java 面试顺利。\n\n## 索引\n（为了简洁，省略索引内容）\n\n"
