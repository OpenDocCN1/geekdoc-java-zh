    That’s all about 40 Core Java Interview Questions from the telephonic round. Don’t
    take a phone interview lightly, its your first chance to impress your prospective
    employer. Given that you are not seeing your interviewer and just communicating
    with your voice, it’s a little bit different than a face-to-face interview.


    So always be calm, relaxed and answer questions to the point and precisely, speak
    slowly and make sure you are not in a place where your sound echoes like on a
    close staircase. Having a good phone, head set and being on good reception area
    is also very important. I have seen it many times where candidate lost on interview
    because not able to hear it properly or not able to understand question before
    answering them. I know some people take telephonic interviews on those secret
    places but if you do make sure your phone connectivity is enough.


    ## MultiThreading and Concurrency Interview Questions


    You go to any Java interview, senior or junior, experience or freshers, you are
    bound to see a couple of questions from the thread, concurrency, and multi-threading.
    In fact, this built-in concurrency support is one of the strongest points of Java
    programming language and helped it to gain popularity among the enterprise world
    and programmers equally. Most of the lucrative Java developer position demands
    excellent core Java multi-threading skills and experience in developing, debugging,
    and tuning high-performance low latency concurrent Java applications. This is
    the reason, it is one of the most sought after skills in Java interviews. The
    multithreading and concurrency are also hard to master the concept and only good
    developers with solid experience can effectively deal with concurrency issues.


    In a typical Java interview, the Interviewer slowly starts from basic concepts
    of `Thread` by asking questions like, why you need threads, how to create threads,
    which one is a better way to create threads e.g. by extending `thread` class or
    implementing `Runnable` and then slowly goes into Concurrency issues, challenges
    faced during the development of concurrent Java applications, Java memory model,
    higher-order concurrency utilities introduced in `JDK 1.5`, principles and design
    patterns of concurrent Java applications, classical multi-threading problems e.g.
    producer-consumer, dining philosopher, reader-writer or simply bounded buffer
    problems.


    Since its also not enough just to know the basics of threading, you must know
    how to deal with concurrency problems like deadlock, race conditions, memory inconsistency,
    and various thread safety-related issues. These skills are thoroughly get tested
    by presenting various multi-threading and concurrency problems.


    Many Java developers are used to only look and read interview questions before
    going for the interview, which is not bad but you should not be too far away.
    Also collecting questions and going through the same exercise is too much time
    consuming, that’s why I have created this list of the top 50 Java multi-threading
    and concurrency related questions, collected from various interviews. I am only
    going to add new and recent interview questions as and when I am going to discover
    them.


    Though you need good knowledge and solid experience to do well on Java interviews
    focused on advanced multithreading and concurrency skill, I strongly recommend
    Java programmers to read `Effective Java` and `Java Concurrency in Practice` twice
    before going to an interview. They do not only help you to answer questions better
    but also help you to present your idea clearly.


    And, if you are serious about mastering Java multi-threading and concurrency then
    I also suggest you take a look at the Java Multithreading, Concurrency, and Performance
    Optimization course by Michael Pogrebinsy on Udemy. It’s an advanced course to
    become an expert in Multithreading, concurrency, and Parallel programming in Java
    with a strong emphasis on high performance.


    By the way, I have not provided answers to some questions here, Why? because I
    expect most of Java developers to know the answers to this question and if not,
    also answers are widely available by using Google.


    Here is our list of top questions from Java thread, concurrency, and multi-threading.
    You can use this list to prepare well for your Java interview.


    ### 1) What is Thread in Java?


    The thread is an independent path of execution. It’s a way to take advantage of
    multiple CPU available in a machine. By employing multiple threads you can speed
    up CPU bound tasks. For example, if one thread takes 100 milliseconds to do a
    job, you can use 10 threads to reduce that task into 10 milliseconds. Java provides
    excellent support for multithreading at the language level, and it’s also one
    of the strong selling points.


    ### 2) What is the difference between Thread and Process in Java?


    The thread is a subset of `Process`, in other words, one process can contain multiple
    threads. Two processes runs on different memory spaces, but all threads share
    the same memory space. Don’t confuse this with stack memory, which is different
    for the different threads and used to store local data to that thread.


    ### 3) How do you implement Thread in Java?


    At the language level, there are two ways to implement `Thread` in Java. An instance
    of `java.lang.Thread` represents a thread but it needs a task to execute, which
    is an instance of interface `java.lang.Runnable`. Since `Thread` class itself
    implement `Runnable`, you can override `run()` method either by extending `Thread`
    class or just implementing `Runnable` interface.


    ### 4) When to use Runnable vs Thread in Java?


    This is a follow-up of previous multi-threading interview question. As we know
    we can implement thread either by extending `Thread` class or implementing `Runnable`
    interface, the question arise, which one is better and when to use one? This question
    will be easy to answer if you know that Java programming language doesn’t support
    multiple inheritances of class, but it allows you to implement multiple interfaces.
    Which means, it’s better to implement `Runnable` then extends `Thread` if you
    also want to extend another class e.g. `Canvas` or `CommandListener`.


    ### 6) What is the difference between `start()` and `run()` method of Thread class?


    One of trick Java question from early days, but still good enough to differentiate
    between shallow understanding of Java threading model `start()` method is used
    to start newly created thread, while `start()` internally calls `run()` method,
    there is difference calling `run()` method directly. When you invoke `run()` as
    normal method, its called in the same thread, no new thread is started, which
    is the case when you call `start()` method.


    ### 7) What is the difference between Runnable and Callable in Java?


    Both `Runnable` and `Callable` represent task which is intended to be executed
    in a separate thread. `Runnable` is there from `JDK 1.0` while `Callable` was
    added on `JDK 1.5`. Main difference between these two is that `Callable`’s `call()`
    method can return value and throw Exception, which was not possible with `Runnable`’s
    `run()` method. `Callable` return `Future` object, which can hold the result of
    computation.


    ### 8) What is the difference between CyclicBarrier and CountDownLatch in Java?


    Though both `CyclicBarrier` and `CountDownLatch` wait for number of threads on
    one or more events, the main difference between them is that you can not re-use
    `CountDownLatch` once count reaches to zero, but you can reuse same `CyclicBarrier`
    after barrier is broken.


    ### 9) What is Java Memory model?

