    varargs and Collection utilities like CountDownLatch, CyclicBarrier and BlockingQueue
    are getting more and more popular on Java interviews. Generic interview question
    can get real tricky if you are not familiar with bounded and unbounded generic
    wildcards, How generics works internally, type erasure and familiarity with writing
    parametrized generics classes and methods in Java.


    Best way to prepare for Generics interview is to try simple program best on various
    features of generics. Anyway In this Java interview section we will see some popular
    Java Generics interview questions and there answer.


    115


    GROKKING THE JAVA INTERVIEW


    By the way there are lot of material available in Javarevisited to better preparing
    for Java and J2EE interviews, you can prepare multi-threading and Collections
    using 15 thread interview question and Top 10 Java collection interview question
    along with several other questions answers sections on Spring, Struts, JSP and
    Servlet.


    If you are GUI developers and working in Java Swing technology than you can also
    check interview questions on Java Swing mostly asked in Investment banks


    Without wasting anymore of your time, here is a list of frequently asked Generices
    concept interview questions from Java interviews


    1\. What is Generics in Java ? What are advantages of using Generics?


    This is one of the first interview questions asked on generics in any Java interview,
    mostly at beginners and intermediate level. Those who are coming from prior to
    Java 5 background knows that how inconvenient it was to store object in Collection
    and then cast it back to correct Type before using it. Generics prevents from
    those. it provides compile time type-safety and ensures that you only insert correct
    Type in collection and avoids ClassCastException in runtime.


    116


    GROKKING THE JAVA INTERVIEW


    2. How Generics works in Java ? What is type erasure ?


    This is one of better interview question in Generics. Generics is implemented
    using Type erasure, compiler erases all type related information during compile
    time and no type related information is available during runtime. for example
    List<String> is represented by only List at runtime.


    This was done to ensure binary compatibility with the libraries which were developed
    prior to Java 5\. you don’t have access to Type argument at runtime and Generic
    type is translated to Raw type by compiler during runtime. you can get lot of
    follow up question based on this Generic interview question based upon your response
    e.g. Why Generics is implemented using Type erasure or presenting some invalid
    generic code which results in compiler error.


    3\. What is Bounded and Unbounded wildcards in Generics ?


    This is another very popular Java interview questions on Generics. Bounded Wildcards
    are those which impose bound on Type. there are two kinds of Bounded wildcards
    <? extends T> which impose an upper bound by ensuring that type must be sub class
    of T and <? super T> where its imposing lower bound by ensuring Type must be super
    class of T. This Generic Type must be instantiated with Type within bound otherwise
    it will result in compilation error.


    117


    GROKKING THE JAVA INTERVIEW


    On the other hand <?> represent and unbounded type because <?> can be replace
    with any Type.


    4\. What is difference between List<? extends T> and List <? super T> ?'
