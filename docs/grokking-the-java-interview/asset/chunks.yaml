    # What is the difference between State and Strategy Patterns?


    Though the structure or class diagram of State and Strategy pattern is the same,
    their intent is completely different. The state pattern is used to do something
    specific depending upon state while Strategy allows you to switch between algorithms
    without changing the code which uses it.


    # What is the difference between Association, Aggregation, and Composition in
    OOP?


    When an object is related to another object is called association. It has two
    forms, aggregation, and composition. the former is the loose form of association
    where the related object can survive individually while later is a stronger form
    of association where a related object cannot survive individually. For example,
    the city is an aggregation of people but is the composition of body parts.


    # What is the difference between Decorator, Proxy and Adapter pattern in Java?


    Again they look similar because their structure or class diagram is very similar
    but their intent is quite different. The Decorator adds additional functionality
    without touching the class, Proxy provides access control and Adapter is used
    to make two incompatible interfaces work together.


    # What is the 5 objects oriented design principle from SOLID?


    SOLID is the term given by Uncle Bob in his classic book, the Clean Code, one
    of the must-read books for programmers. In SOLID each character stands for one
    design principle:


    - S for Single Responsibility Principle

    - O for Open closed design principle

    - L for Liskov substitution principle

    - I for Interface segregation principle

    - D for Dependency inversion principle


    ![](image/OOP_-_Interface_Segregation_Principle.jpg)


    # What is the difference between Composition and Inheritance in OOP?


    This is another great OOPS concept question because it tests what matters, both
    of them are very important from a class design perspective. Though both Composition
    and Inheritance allows you to reuse code, formerly is more flexible than later.
    Composition allows the class to get an additional feature at runtime, but Inheritance
    is static. You can not change the feature at runtime by substitution of a new
    implementation.


    That’s all about in this list of object-oriented programming or OOPS concept interview
    questions. We have seen questions from various OOPS concepts like Abstraction,
    Encapsulation, Inheritance, Composition, Aggregation, Association, Class, Object,
    and Interface, etc.


    We have also seen questions from Object-oriented design principles also known
    as SOLID principles and GOF design patterns like Strategy, State, and Factory,
    which are based upon both the object-oriented programming concept and OOP design
    principle.


    But, as I said, if you are a senior Java developer then you focus more on object-oriented
    analysis and design and learn how to code against a requirement using all your
    OOP knowledge. You can also read Cracking the Coding Interview, 6th Edition to
    for more Object Oriented Programming questions.


    # Interview Questions from Telephonic Round


    Here is another section about preparing for Java Interviews, this time we will
    take a look at 40 core Java questions from telephonic round of Java Programming
    interviews. Phone interviews are usually the first step to screen candidate after
    selecting his resume. Since it’s easy to call a candidate than to schedule a face-to-face
    interview, book rooms and arrange for a meeting, telephonic round of interviews
    are quite popular now days. There were days only one telephonic round of interview
    was enough but nowadays, it’s almost two and three round of phone interview with
    different team members. Key to success in telephonic interview is to the point
    and concise answer. Since Interviewer wants to cover lot of things on telephonic
    round, they appreciate to the point answer instead of blah blah and dragging answer
    for sake of time. Always remember, its your time to make impression also so make
    sure you have good phone, fully charged and use voice modulation technique to
    be as clear as possible. Even if you don’t know the answer, think a loud, interviewer
    appreciate ability to think and some time that proves to be decisive as well.


    Here is my list of 40 core Java-based questions which frequently appear on telephonic
    round of Interview. These questions touch-based of important core java concepts
    e.g. String, Thread basics, multi-threading, inter thread communication, Java
    Collection framework, Serialization, Object-oriented programming concepts and
    Exception handling. If you have faced couple of Java interviews, you will sure
    have seen some of these questions already.


    ### 1) Difference between String, StringBuffer and StringBuilder in Java?


    `String` is immutable while both `StringBuffer` and `StringBuilder` is mutable,
    which means any change e.g. converting `String` to upper case or trimming white
    space will produce another instance rather than changing the same instance. On
    later two, `StringBuffer` is synchronized while `StringBuilder` is not, in fact
    its a ditto replacement of `StringBuffer` added in Java 1.5.


    ### 2) Difference between extends Thread vs implements Runnable in Java?


    Difference comes from the fact that you can only extend one class in Java, which
    means if you extend `Thread` class you lose your opportunity to extend another
    class, on the other hand if you implement `Runnable`, you can still extend another
    class.


    ### 3) Difference between Runnable and Callable interface in Java?


    `Runnable` was the only way to implement a task in Java which can be executed
    in parallel before JDK 1.5 adds `Callable`. Just like `Runnable`, `Callable` also
    defines a single `call()` method but unlike `run()` it can return values and throw
    exceptions.


    ### 4) Difference between ArrayList and LinkedList in Java?


    In short, `ArrayList` is backed by array in Java, while `LinkedList` is just collection
    of nodes, similar to linked list data structure. `ArrayList` provides random search
    if you know the index, while `LinkedList` only allows sequential search. On other
    hand, adding and removing element from middle is efficient in `LinkedList` as
    compared to `ArrayList` because it only require to modify links and no other element
    is rearranged.


    ### 5) What is difference between wait and notify in Java?


    Both `wait` and `notify` methods are used for inter thread communication, where
    `wait` is used to pause the thread on a condition and `notify` is used to send
    notification to waiting threads. Both must be called from synchronized context
    e.g. synchronized method or block.


    ### 6) Difference between HashMap and Hashtable in Java?


    Though both `HashMap` and `Hashtable` are based upon hash table data structure,
    there are subtle difference between them. `HashMap` is non synchronized while
    `Hashtable` is synchronized and because of that `HashMap` is faster than `Hashtable`,
    as there is no cost of synchronization associated with it. One more minor difference
    is that `HashMap` allows a null key but `Hashtable` doesn’t.


    ### 7) Difference between TreeSet and TreeMap in Java?


    Though both are sorted collection, `TreeSet` is essentially a `Set` data structure
    which doesn’t allow duplicate and `TreeMap` is an implementation of `Map` interface.
    In reality, `TreeSet` is implemented via a `TreeMap`, much like how `HashSet`
    is implemented using `HashMap`.


    ### 8) Write a Java program to print Fibonacci series?


    Core Java Interview Questions answers from telephonic Interview Fibonacci series
    is a series of number on which a number is equal to sum of previous two numbers
    i.e. f(n) = f(n-1) + f(n-2). This program is used to teach recursion to students
    but you can also solve it without recursion. Check out the solution for both iterative
    and recursive solution of this problem.

