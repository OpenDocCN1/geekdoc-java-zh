    `FutureTask` 代表并发 Java 应用中一个可取消的异步计算。该类提供了 `Future` 的基础实现，并带有启动和取消计算、查询计算是否完成以及检索计算结果的方法。只有在计算完成后才能检索结果；如果计算尚未完成，`get`
    方法将发生阻塞。`FutureTask` 对象可以用于封装 `Callable` 或 `Runnable` 对象。由于 `FutureTask` 也实现了
    `Runnable`，因此它可以被提交给 `Executor` 执行。


    ## 20) Java 中置的 `interrupted()` 方法和 `isInterrupted()` 方法有什么区别？


    `interrupted()` 和 `isInterrupted()` 之间的主要区别在于：前者会清除中断状态，而后者不会。Java 多线程中的中断机制是使用一个名为“中断状态”的内部标志来实现的。通过调用
    `Thread.interrupt()` 中断线程会设置此标志。当被中断的线程通过调用静态方法 `Thread.interrupted()` 检查中断时，中断状态会被清除。非静态的
    `isInterrupted()` 方法用于一个线程查询另一个线程的中断状态，它不会改变中断状态标志位。根据惯例，任何通过抛出 `InterruptedException`
    导出的方法在执行时都会清除中断状态。然而，另一个线程通过调用 `interrupt` 可能会立即再次设置中断状态。


    ## 21) 为什么 `wait` 和 `notify` 方法要在 `synchronized` 块中调用？


    在 `synchronized` 块或方法中调用 `wait` 和 `notify` 方法的主要原因是这是 Java API 的强制要求。如果你没有在同步上下文中调用它们，你的代码将抛出
    `IllegalMonitorStateException`。另一个更微妙的原因是为了避免 `wait` 和 `notify` 调用之间的竞态条件。


    ## 22) 为什么你应该在循环中检查等待条件？


    如果等待线程没有在循环中检查等待条件，它可能会接收到虚假报警和虚假唤醒（spurious wake up calls），即使条件不满足，它也会直接退出。因此，当等待线程唤醒时，它不能假设它所等待的状态仍然有效。该状态在过去可能是有效的，但在调用
    `notify()` 方法之后、等待线程唤醒之前，状态可能已经发生了变化。这就是为什么在循环中调用 `wait()` 方法总是更好，你甚至可以在 Eclipse
    中创建调用 `wait` 和 `notify` 的模板。要进一步了解这个问题，我建议你阅读《Effective Java》中关于线程和同步的条目。


    ## 23) Java 中 `synchronized` 和并发集合（concurrent collection）有什么区别？


    虽然 `synchronized` 和并发集合都提供了适用于多线程和并发访问的线程安全集合，但后者比前者更具可扩展性。在 Java 1.5 之前，Java
    程序员只有同步集合可用，当多个线程并发访问它们时，它们会成为竞争点，这阻碍了系统的可扩展性。Java 5 引入了如 `ConcurrentHashMap`
    等并发集合，它不仅提供了线程安全性，还通过使用锁分段（lock stripping）和内部表分区等现代技术提高了了可扩展性。


    ## 24) Java 中 `Stack`（栈）和 `Heap`（堆）有什么区别？


    为什么有人会将这个问题作为多线程和并发的一部分提出？因为 `Stack` 是一个与线程密切相关的内存区域。为了回答这个问题，`stack` 和 `heap`
    都是 Java 应用中特定的内存。每个线程都有自己的 `stack`，用于存储局部变量、方法参数和调用栈。存储在一个 `Thread` 的 `stack`
    中的变量对其他线程不可见。另一方面，`heap` 是所有线程共享的公共内存区域。无论是局部对象还是任何级别的对象都创建在 `heap` 内部。为了提高性能，线程倾向于将来自
    `heap` 的值缓存到自己的 `stack` 中，如果该变量被多个线程修改，就会产生问题，这就是 `volatile` 变量大显用场的地方。`volatile`
    表示线程始终从主内存读取变量的值。


    ![](img/Heap_vs_Stack_in_Java.jpg)


    ## 25) 什么是线程池？为什么在 Java 中应该使用线程池？


    创建线程在时间和资源方面都是昂贵的。如果你在处理请求时创建线程，将减慢你的响应时间，而且一个进程可以创建的线程数量是有限的。为了避免这两个问题，在应用程序启动时创建一个线程池，并重用线程来处理请求。这个线程池被称为“线程池”，线程被称为工作线程。从
    JDK 1.5 发布开始，Java API 提供了 `Executor` 框架，允许你创建不同类型的线程池，例如：单线程池（一次处理一个任务）、固定线程池（固定数量线程的池）或缓存线程池（适用于许多短生命周期任务的可扩展线程池）。


    ## 26) 编写代码解决 Java 中的生产者消费者问题？


    你在现实世界中解决的大多数线程问题都属于生产者消费者模式，其中一个线程生产任务，另一个线程消费该任务。你必须知道如何进行线程间通信来解决这个问题。在底层，你可以使用
    `wait` 和 `notify` 来解决这个问题；在高层，你可以利用 `Semaphore` 或 `BlockingQueue` 来实现生产者消费者模式。


    ## 27) 如何在 Java 中避免死锁？编写代码？


    ![](img/deadlock_in_Java.jpg)


    死锁两个线程互相等待对方采取行动以便自己继续移动的状态。这是一个严重的问题，因为当它发生时，你的程序会挂起不再运行。要发生死锁，必须满足以下四个条件：


    - **互斥（Mutual Exclusion）**：至少有一个资源以非共享模式持有。在任何时刻只有一个进程可以使用该资源。

    - **持有并等待（Hold and Wait）**：进程当前持有至少一个资源，并请求其他进程持有的额外资源。

    - **不可剥夺（No Pre-emption）**：操作系统在资源分配后不能撤销资源；资源必须由持有进程自愿释放。

    - **循环等待（Circular Wait）**：进程必须等待被另一个进程持有的资源，而该进程又在等待第一个进程释放资源。


    避免死锁最简单的方法是防止循环等待，这可以通过按顺序获取锁并按反顺序释放锁来实现，以便线程只有在持有另一个锁时才能继续获取该锁。


    ## 28) Java 中活锁（livelock）和死锁（deadlock）有什么区别？


    这个问题是上一个面试问题的扩展。活锁与死锁相似，不同在于参与活锁的线程或进程的状态相互之间不断变化，但没有任何一个能进一步进展。活锁是资源饥饿的一种特殊情况。活锁的一个现实世界例子是两个人在狭窄走廊相遇，每个人都试图礼貌地侧身让对方通过，但他们反复在同一时间向同一侧移动，导致没有任何进展。简而言之，活锁和死锁的主要区别在于，在情况下状态在变化，但没有进展。


