    这是另一道初级 Java 集合经典面试题，大多数 Java 开发者对这类面试题都有预设的答案，例如 `HashMap` 不是同步的，而 `Hashtable`
    是的，或者 `hashmap` 比 `hash table` 快等。可能出现在于，如果面试官接着了一个后续问题，比如 `HashMap` 在 Java 中是如何工作的，或者你是否可以用
    `ConcurrentHashMap` 替换 `Hashtable` 等。


    ## 10. 在 Java 中你何时使用 `ConcurrentHashMap`？


    这是另一道高级级 Java 集合面试题，通常用于检查面试官是否熟悉对 `ConcurrentHashMap` 的优化。当你有多个读取者和一个写入者或更少的写入者时，`ConcurrentHashMap`
    更合适，因为 `Map` 仅在写操作期间会被锁定。如果你的读取和写入数量相等，`ConcurrentHashMap` 的性能将与 `Hashtable` 或
    `synchronized` `HashMap` 相当。


    ## 11. Java 中 `Set` 和 `List` 有什么区别？


    另一道在电话面试轮或第一轮面试中常见的经典 Java 集合面试题。大多数 Java 程序员知道 `Set` 不允许重复元素，而 `List` 允许，且 `List`
    维护插入顺序而 `Set` 不。这里的关键在于向面试官展示你可以根据需求决定哪种集合更合适。


    ## 12. 如何对集合中的对象进行排序？


    这道集合面试题有两个目的：它不仅测试了重要的编程概念——“排序”，还测试了像 `Collections` 这样的工具类，该类提供了多种创建同步集合和排序的方法。在
    Java 中，排序是通过 `Comparable` 和 `Comparator` 实现的，当你调用 `Collections.sort()` 时，它将根据
    `compareTo()` 方法中指定的自然顺序进行排序，而 `Collections.sort(Comparator)` 则将根据 `Comparator`
    的 `compare()` 方法对对象进行排序。


    ## 13. `Vector` 和 `ArrayList` 有什么区别？


    另一道初级集合面试题，这仍然非常流行，通常在电话面试中被问。Java 中的 `ArrayList` 是最常用的集合类之一，大多数面试官都会问关于 `ArrayList`
    的问题。请查看 `Vector` 和 `ArrayList` 之间的区别以获取此面试题的答案。


    ## 14. `HashMap` 和 `HashSet` 有什么区别？


    这道集合面试题通常与 `HashMap` vs `Hashtable` 一起被问。`HashSet` 实现了 `java.util.Set` 接口，因此只包含唯一元素，而
    `HashMap` 允许重复值。事实上，`HashSet` 实际上是在 `java.util.HashMap` 之上实现的。如果你查看 `java.util.HashSet`
    的内部实现，你会发现它将元素作为 key 添加到内部 map 中并具有相同的 value。


    ## 15) Java 中的 `NavigableMap` 是什么？它相比 `Map` 有什么优势？


    `NavigableMap` Map 是在 Java 1.6 中引入的，它为 `Map` 数据结构增加了导航功能。它提供了许多方法，如 `lowerKey()`
    获取小于指定键的键，`floorKey()` 返回小于或等于指定键的键，`ceilingKey()` 获取大于或等于指定键的键，以及 `higherKey()`
    从 `Map` 中返回大于指定键的键。它还提供了类似的方法来获取条目，例如 `lowerEntry()`、`floorEntry()`、`ceilingEntry()`
    和 `higherEntry()`。除了导航方法外，它还提供了创建子 Map 的工具，例如从现有 `Map` 的条目创建 `Map`，如 `tailMap`、`headMap`
    和 `subMap`。`headMap()` 方法返回一个键小于指定的 `NavigableMap`，`tailMap()` 返回一个键大于指定的 `NavigableMap`，而
    `subMap()` 则给出一个在由 `toKey` 到 `fromKey` 指定的范围内的 `NavigableMap`。


    ## 16) 存储对象时你倾向于使用 `Array` 还是 `ArrayList`？为什么？


    虽然 `ArrayList` 也是由数组支持，但它在 Java 中比数组具有一些可用性上的优势。`Array` 是固定长度的数据结构，一旦创建就无法更改其长度。相反，`ArrayList`
    是动态的，它在调整大小时会自动分配新数组并复制旧数组的内容。使用 `ArrayList` 而不是 `Array` 的另一个原因是支持泛型（Generics）。`Array`
    不支持泛型，如果你在 `String` 数组上存储一个 `Integer` 对象，你只会在运行时抛出 `ArrayStoreException` 时才会发现。相反，如果你使用
    `ArrayList`，编译器和 IDE 会立即捕捉这些错误。所以，如果你预先知道大小并且不需要调整，请使用数组，否则使用 `ArrayList`。


    ## 17) 我们可以用 `ConcurrentHashMap` 替换 `Hashtable` 吗？


    答案 3：是的，我们可以用 `ConcurrentHashMap` 替换 `Hashtable`，这也是 `ConcurrentHashMap` Java
    文档建议的。但你需要小心依赖 `Hashtable` 锁定行为的代码。由于 `Hashtable` 锁定整个 Map 而不是 Map 的一部分，复合操作如
    `if(Hashtable.get(key) == null) put(key, value)` 在 `Hashtable` 中有效，但在 `ConcurrentHashMap`
    中无效。相反，请使用 `ConcurrentHashMap` 的 `putIfAbsent()` 方法。


    ## 19) `CopyOnWriteArrayList` 是什么？它与 `ArrayList` 和 `Vector` 有什么区别？


    答案：`CopyOnWriteArrayList` 是 Java 引入的新类型 `List` 实现，它提供了比 `ArrayList` 更好的并发访问，通过在写入时复制
    `ArrayList` 来替代锁定。它在 Java 1.5 中引入，与 `ArrayList` 不同是因为它是线程安全的，而 `ArrayList` 不是。它与
    `Vector` 不同是因为它不会抛出 `ConcurrentModificationException`。这里有一个对比这三种流行的 `List` 实现性能的漂亮表格：


    ![](img/ArrayList_LinkedList_and_CopyWriteArrayList.jpg)


    ## 20) 为什么 `ListIterator` 有 `add()` 方法而 `Iterator` 没有？


    `ListIterator` 拥有 `add()` 方法是因为它可以在集合的两个方向进行遍历或迭代。它维护了两个指针并可以在当前位置添加新元素。


    ## 21) 迭代时何时会发生 `ConcurrentModificationException`？


    当使用 `Collection` 或 `List` 的 `remove` 方法（例如 `remove(Object element)` 或 `remove(int
    index)`）而不是 `Iterator` 的 `remove()` 方法时，就会发生 `ConcurrentModificationException`。根据
    `Iterator` 的约定，如果它检测到 `Collection` 结构发生了变化（例如添加或删除元素），一旦迭代开始，它就会抛出该异常。这里是一些在 Java
    中避免 `ConcurrentModification` 的建议。


    ![](img/ConcurrentModificationException_while_Iterating_over_ArrayList.png)


