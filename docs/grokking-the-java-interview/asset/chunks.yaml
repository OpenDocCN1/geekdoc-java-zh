    This is another Classical Java Collection interview asked on beginner’s level
    and most of Java developer has a predefined answer for this interview questions
    e.g. `HashMap` is not synchronized while `Hashtable` is not or `hashmap` is faster
    than hash table etc. What could go wrong is that if he placed another follow-up
    question like how `HashMap` works in Java or can you replace `Hashtable` with
    `ConcurrentHashMap` etc.


    ## 10. When do you use `ConcurrentHashMap` in Java?


    This is another advanced level collection interview questions in Java which normally
    asked to check whether the interviewer is familiar with optimization done on `ConcurrentHashMap`
    or not. `ConcurrentHashMap` is better suited for situation where you have multiple
    readers and one Writer or fewer writers since `Map` gets locked only during the
    write operation. If you have an equal number of reader and writer than `ConcurrentHashMap`
    will perform in the line of `Hashtable` or `synchronized `HashMap`.


    ## 11. What is the difference between `Set` and `List` in Java?


    Another classical Java Collection interviews popular on telephonic round or the
    first round of interview. Most of Java programmer knows that `Set` doesn’t allowed
    duplicate while `List` does and `List` maintains insertion order while `Set` doesn’t.
    What is key here is to show the interviewer that you can decide which collection
    is more suited based on requirements.


    ## 12. How do you Sort objects on the collection?


    This Collection interview question serves two purpose it not only test an important
    programming concept Sorting but also utility class like `Collections` which provide
    several methods for creating synchronized collection and sorting. Sorting is implemented
    using `Comparable` and `Comparator` in Java and when you call `Collections.sort()`
    it gets sorted based on the natural order specified in `compareTo()` method while
    `Collections.sort(Comparator)` will sort objects based on `compare()` method of
    `Comparator`.


    ## 13. What is the difference between `Vector` and `ArrayList`?


    One more beginner level collection interview questions, this is still very popular
    and mostly asked in the telephonic round. `ArrayList` in Java is one of the most
    used Collection class and the most interviewers asked questions on `ArrayList`.
    See Difference between `Vector` and `ArrayList` for the answer to this interview
    question.


    ## 14. What is the difference between `HashMap` and `HashSet`?


    This collection interview questions is asked in conjunction with `HashMap` vs
    `Hashtable`. `HashSet` implements `java.util.Set` interface and that’s why only
    contains unique elements, while `HashMap` allows duplicate values. In fact, `HashSet`
    is actually implemented on top of `java.util.HashMap`. If you look internal implementation
    of `java.util.HashSet`, you will find that it adds element as key on internal
    map with same values.


    ## 15) What is `NavigableMap` in Java? What is a benefit over `Map`?


    `NavigableMap` Map was added in Java 1.6, it adds navigation capability to `Map`
    data structure. It provides methods like `lowerKey()` to get keys which is less
    than specified key, `floorKey()` to return keys which is less than or equal to
    specified key, `ceilingKey()` to get keys which is greater than or equal to specified
    key and `higherKey()` to return keys which is greater specified key from a `Map`.
    It also provide similar methods to get entries e.g. `lowerEntry()`, `floorEntry()`,
    `ceilingEntry()` and `higherEntry()`. Apart from navigation methods, it also provides
    utilities to create sub-Map e.g. creating a `Map` from entries of an exsiting
    `Map` like `tailMap`, `headMap` and `subMap`. `headMap()` method returns a `NavigableMap`
    whose keys are less than specified, `tailMap()` returns a `NavigableMap` whose
    keys are greater than the specified and `subMap()` gives a `NavigableMap` between
    a range, specified by `toKey` to `fromKey`.


    ## 16) Which one you will prefer between `Array` and `ArrayList` for Storing object
    and why?


    Though `ArrayList` is also backed up by array, it offers some usability advantage
    over array in Java. `Array` is fixed length data structure, once created you can
    not change it’s length. On the other hand, `ArrayList` is dynamic, it automatically
    allocate a new array and copies content of old array, when it resize. Another
    reason of using `ArrayList` over `Array` is support of `Generics`. `Array` doesn’t
    support `Generics`, and if you store an `Integer` object on a `String` array,
    you will only going to know about it at runtime, when it throws `ArrayStoreException`.
    On the other hand, if you use `ArrayList`, compiler and IDE will catch those error
    on the spot. So if you know size in advance and you don’t need re-sizing than
    use array, otherwise use `ArrayList`.


    ## 17) Can we replace `Hashtable` with `ConcurrentHashMap`?


    Answer 3: Yes we can replace `Hashtable` with `ConcurrentHashMap` and that’s what
    suggested in Java documentation of `ConcurrentHashMap`. but you need to be careful
    with code which relies on locking behavior of `Hashtable`. Since `Hashtable` locks
    whole Map instead of a portion of Map, compound operations like `if(Hashtable.get(key)
    == null) put(key, value)` works in `Hashtable` but not in `concurrentHashMap`.
    instead of this use `putIfAbsent()` method of `ConcurrentHashMap`.


    ## 19) What is `CopyOnWriteArrayList`, how it is different than `ArrayList` and
    `Vector`?


    Answer: `CopyOnWriteArrayList` is new `List` implementation introduced in Java
    1.5 which provides better concurrent access than `Synchronized List`. better concurrency
    is achieved by Copying `ArrayList` over each write and replace with original instead
    of locking. Also `CopyOnWriteArrayList` doesn’t throw any `ConcurrentModification
    Exception`. Its different than `ArrayList` because its thread-safe and `ArrayList`
    is not thread-safe and it’s different than `Vector` in terms of Concurrency. `CopyOnWriteArrayList`
    provides better Concurrency by reducing contention among readers and writers.
    Here is a nice table which compares performance of three of popular `List` implementation
    `ArrayList`, `LinkedList` and `CopyOnWriteArrayList` in Java:


    ![](image/ArrayList_LinkedList_and_CopyOnWriteArrayList.jpg)


    ## 20) Why `ListIterator` has `added()` method but `Iterator` doesn’t or Why to
    `add()` method is declared in `ListIterator` and not on `Iterator`.


    `ListIterator` has `added()` method because of its ability to traverse or iterate
    in both direction of the collection. it maintains two pointers in terms of previous
    and next call and in a position to add a new element without affecting current
    iteration.


    ## 21) When does `ConcurrentModificationException` occur on iteration?


    When you remove object using `Collection`’s or `List`’s `remove` method e.g. `remove(Object
    element)` or `remove(int index)`, instead of `Iterator`’s `remove()` method than
    `ConcurrentModificationException` occurs. As per `Iterator`’s contract, if it
    detect any structural change in `Collection` e.g. adding or removing of the element,
    once Iterator begins, it can throw `ConcurrentModificationException`. Here are
    some tips to avoid `ConcurrentModification` in Java.


    ![](image/ConcurrentModificationException_while_Iterating_over_ArrayList.png)


    ## 22) Difference between `Set`, `List` and `Map` Collection classes?


    `java.util.Set`, `java.util.List` and `java.util.Map` defines three of most popular
    data structure support in Java. `Set` provides uniqueness guarantee i.e.g you
    can not store duplicate elements on it, but it’s not ordered. On the other hand
    `List` is an ordered Collection and also allowes duplicates. `Map` is based on
    hashing and stores key and value in an Object called `entry`. It provides O(1)
    performance to get object, if you know keys, if there is no collision. Popular
    impelmentation of `Set` is `HashSet`, of `List` is `ArrayList` and `LinkedList`,
    and of `Map` are `HashMap`, `Hashtable` and `ConcurrentHashMap`. Another key difference
    between `Set`, `List` and `Map` are that `Map` doesn’t implement `Collection`
    interface, while other two does. For a more detailed answer, see Set vs List vs
    Map in Java

    '
