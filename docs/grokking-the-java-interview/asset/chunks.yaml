    \ during AVP Role interviews on Investment-Banks and has a lot of follow-up questions\
    \ based on the response of interviewee e.g.\n\nWhy `HashMap` keys need to be immutable,\
    \ what is race conditions on `HashMap` and how `HashMap` resize in Java.\n\n###\
    \ 2. What is the difference between `poll()` and `remove()` method of `Queue`\
    \ interface?\n\nThough both `poll()` and `remove()` method from `Queue` is used\
    \ to remove the object and returns the head of the queue, there is a subtle difference\
    \ between them. If `Queue` is `empty()` then a call to `remove()` method will\
    \ throw Exception, while a call to `poll()` method returns null. By the way, exactly\
    \ which element is removed from the queue depends upon queue’s ordering policy\
    \ and varies between different implementation, for example, `PriorityQueue` keeps\
    \ the lowest element as per `Comparator` or `Comparable` at head position.\n\n\
    ### 3. What is the difference between fail-fast and fail-safe Iterators?\n\nThis\
    \ is relatively new collection interview questions and can become trick if you\
    \ hear the term fail-fast and fail-safe first time. Fail-fast `Iterators` throws\
    \ `ConcurrentModificationException` when one `Thread` is iterating over collection\
    \ object and other thread structurally modify `Collection` either by adding, removing\
    \ or modifying objects on underlying collection. They are called fail-fast because\
    \ they try to immediately throw Exception when they encounter failure. On the\
    \ other hand fail-safe `Iterators` works on copy of collection instead of original\
    \ collection.\n\n### 4. How do you remove an entry from a `Collection`? and subsequently\
    \ what is the difference between the `remove()` method of `Collection` and `remove()`\
    \ method of `Iterator`, which one you will use while removing elements during\
    \ iteration?\n\n`Collection` interface defines `remove(Object obj)` method to\
    \ remove objects from `Collection`. `List` interface adds another method `remove(int\
    \ index)`, which is used to remove object at specific index. You can use any of\
    \ these method to remove an entry from `Collection`, while not iterating. Things\
    \ change, when you iterate. Suppose you are traversing a `List` and removing only\
    \ certain elements based on logic, then you need to use `Iterator`’s `remove()`\
    \ method. This method removes current element from `Iterator`’s perspective. If\
    \ you use `Collection`’s or `List`’s `remove()` method during iteration then your\
    \ code will throw `ConcurrentModificationException`. That’s why it’s advised to\
    \ use `Iterator` `remove()` method to remove objects from `Collection`.\n\n###\
    \ 5. What is the difference between Synchronized Collection and Concurrent Collection?\n\
    \nJava 5 has added several new Concurrent Collection classes e.g. `ConcurrentHashMap`,\
    \ `CopyOnWriteArrayList`, `BlockingQueue` etc, which has made Interview questions\
    \ on Java Collection even trickier. Java Also provided a way to get Synchronized\
    \ copy of collection e.g. `ArrayList`, `HashMap` by using `Collections.synchronizedMap()`\
    \ Utility function.One Significant difference is that Concurrent Collections has\
    \ better performance than synchronized Collection because they lock only a portion\
    \ of Map to achieve concurrency and Synchronization.\n\n### 6. What is the difference\
    \ between Iterator and Enumeration?\n\nThis is a beginner level collection interview\
    \ questions and mostly asked during interviews of Junior Java developer up to\
    \ experience of 2 to 3 years `Iterator` duplicate functionality of `Enumeration`\
    \ with one addition of `remove()` method and both provide navigation functionally\
    \ on objects of `Collection`.Another difference is that `Iterator` is more safe\
    \ than `Enumeration` and doesn’t allow another thread to modify collection object\
    \ during iteration except `remove()` method and throws `ConcurrentModificaitonException`.\
    \ See `Iterator` vs `Enumeration` in Java for more differences.\n\n### 7. How\
    \ does `HashSet` is implemented in Java, How does it use Hashing?\n\nThis is a\
    \ tricky question in Java because for hashing you need both key and value and\
    \ there is no key for the store in a bucket, then how exactly HashSet store element\
    \ internally. Well, `HashSet` is built on top of `HashMap`. If you look at source\
    \ code of `java.util.HashSet` class, you will find that it uses a `HashMap` with\
    \ same values for all keys, as shown below:\n\n```java\nprivate transient HashMap\
    \ map;\n// Dummy value to associate with an Object in the backing Map\nprivate\
    \ static final Object PRESENT = new Object();\n```\n\nWhen you call `add()` method\
    \ of `HashSet`, it put entry in `HashMap` :\n\n```java\npublic boolean add(E e)\
    \ {\n    return map.put(e, PRESENT)==null;\n}\n```\n\nSince keys are unique in\
    \ a `HashMap`, it provides uniqueness guarantee of `Set` interface.\n\n### 8.\
    \ What do you need to do to use a custom object as a key in Collection classes\
    \ like Map or Set?\n\nThe answer is: If you are using any custom object in `Map`\
    \ as key, you need to override `equals()` and `hashCode()` method, and make sure\
    \ they follow their contract. On the other hand if you are storing a custom object\
    \ in Sorted Collection e.g. `SortedSet` or `SortedMap`, you also need to make\
    \ sure that your `equals()` method is consistent to `compareTo()` method, otherwise\
    \ that collection will not follow there contacts e.g. Set may allow duplicates.\n\
    \n### 9. The difference between `HashMap` and `Hashtable`?\n"
