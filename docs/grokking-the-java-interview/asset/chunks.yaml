    # Answer: This is a tricky Garbage collection interview question as many programmers
    are not sure whether PermGen space is part of Java heap space or not and since
    it maintains class Meta data and String pool, whether its eligible for garbage
    collection or not. By the way Garbage Collection does occur in PermGen space and
    if PermGen space is full or cross a threshold, it can trigger Full GC. If you
    look at output of GC you will find that PermGen space is also garbage collected.
    This is why correct sizing of PermGen space is important to avoid frequent full
    GC. You can control size of PermGen space by JVM options `-XX:PermGenSize` and
    `-XX:MaxPermGenSize`.


    ![](image/Garbage_Collection_and_JVM_parameters.jpg)


    ## Question 11: How to you monitor garbage collection activities?


    **Answer**: One of my favorite interview questions on Garbage collection, just
    to check whether candidate has ever monitored GC activities or not. You can monitor
    garbage collection activities either offline or real-time. You can use tools like
    `JConsole` and `VisualVM` VM with its `Visual GC` plug-in to monitor real time
    garbage collection activities and memory status of `JVM` or you can redirect Garbage
    collection output to a log file for offline analysis by using `-XlogGC=<PATH>`
    JVM parameter. Anyway you should always enable GC options like `-XX:PrintGCDetails`,
    `-X:verboseGC` and `-XX:PrintGCTimeStamps` as it doesn’t impact application performance
    much but provide useful states for performance monitoring.


    ## Question 12: Look at below Garbage collection output and answer following question
    :


    ```

    [GC

    [ParNew: 1512K->64K(1512K), 0.0635032 secs]

    [15604K->13569K(600345K), 0.0636056 secs]

    [Times: user=0.03 sys=0.00, real=0.06 secs]

    ```


    1. Is this output of Major Collection or Minor Collection?

    2. Which young Generation Garbage collector is used?

    3. What is size of Young Generation, Old Generation and total Heap Size?

    4. How much memory is freed from Garbage collection?

    5. How much time is taken for garbage collection?

    6. What is current Occupancy of Young Generation?


    This Garbage collection Interview questions is completely based on GC output.
    Following are answers of above GC questions which will not only help you to answer
    these question but also help you to understand and interpret GC output.


    **Answer 1**: It’s Minor collection because of “GC” word, In case of Major collection,
    you would see “Full GC”.


    **Answer 2**: This output is of multi-threaded Young Generation Garbage collector
    `ParNew`, which is used along with `CMS` concurrent Garbage collector.


    **Answer 3**: `[1512K]` which is written in bracket is total size of Young Generation,
    which include Eden and two survivor space. `1512K` on left of arrow is occupancy
    of Yong Generation before GC and `64K` is occupancy after GC. On the next line
    value if bracket is total heap size which is `(600345K)`. If we subtract size
    of young generation to total heap size we can calculate size of Old Generation.
    This line also shows occupancy of heap before and after Garbage collection.


    **Answer 4**: As answered in previous garbage collection interview question, second
    line shows heap occupancy before and after Garbage collection. If we subtract
    value of right side `13569K`, to value on left side `15604K`, we can get total
    memory freed by GC.


    **Answer 5**: `0.0636056 secs` on second line denotes total time it took to collect
    dead objects during Garbage collection. It also include time taken to GC young
    generation which is shown in first line `(0635032 secs)`.


    **Answer 6**: `64K`


    Here is few more interesting Garbage collection Interview question for your practice.


    * **Question**: What is the difference between `-XX:ParallelGC` and `-XX:ParallelOldGC`?

    * **Question**: When do you `ConcurrentMarkSweep` Garbage collector and `Throughput
    GC`?

    * **Question**: What is difference between `ConcurrentMarkSweep` and `G1` garbage
    collector?

    * **Question**: Have you done any garbage collection tuning? What was your approach?


    # Generics Interviews Questions


    Generic interview questions in Java interviews are getting more and more common
    with Java 5 around there for a considerable time and many applications either
    moving to Java 5 and almost all new Java development happening on Tiger(code name
    of Java 5). Importance of Generics and Java 5 features like `Enum`, `Autoboxing`,
    `varargs` and Collection utilities like `CountDownLatch`, `CyclicBarrier` and
    `BlockingQueue` are getting more and more popular on Java interviews. Generic
    interview question can get real tricky if you are not familiar with bounded and
    unbounded generic wildcards, How generics works internally, type erasure and familiarity
    with writing parametrized generics classes and methods in Java.


    Best way to prepare for Generics interview is to try simple program best on various
    features of generics. Anyway In this Java interview section we will see some popular
    Java Generics interview questions and there answer.


    By the way there are lot of material available in Javarevisited to better preparing
    for Java and J2EE interviews, you can prepare multi-threading and Collections
    using 15 thread interview question and Top 10 Java collection interview question
    along with several other questions answers sections on Spring, Struts, JSP and
    Servlet.


    If you are GUI developers and working in Java Swing than you can also check interview
    questions on Java Swing mostly asked in Investment banks


    Without wasting anymore of your time, here is a list of frequently asked Generics
    concept interview questions from Java interviews


    ### 1. What is Generics in Java? What are advantages of using Generics?


    This is one of the first interview questions asked on generics in any interview,
    mostly at beginners and intermediate level. Those who are coming from prior to
    Java 5 knows that how inconvenient it was to store object in Collection and then
    cast it back to correct Type before using it. Generics prevents from those. it
    provides compile time type-safety and ensures that you insert correct Type in
    collection and avoids `ClassCastException` in runtime.


    ### 2. How Generics works in Java? What is type erasure?


    This is one of better interview question in Generics. Generics is implemented
    using Type erasure, compiler erases all type related information during compile
    time and no type related information is available during runtime. for example
    `List<String>` is represented by only `List` at runtime. This was done to ensure
    binary compatibility with the libraries which were developed prior to Java 5.
    you don’t have access to Type argument at runtime and Generic type is translated
    to Raw type by compiler during runtime. you can get lot of follow up question
    based on this Generic interview question upon your response e.g. Why Generics
    is implemented using Type erasure or presenting some invalid generic code which
    results in compiler error.


    ### 3. What is Bounded and Unbounded wildcards in Generics?


    This is another very popular Java interview questions on Generics. Bounded Wildcards
    are those which impose bound on Type. there are two kinds of Bounded wildcards
    `<? extends T>` which impose an upper bound by ensuring that type must be sub
    class of `T` and `<? super T>` where its imposing lower bound by ensuring Type
    must be super class of `T`. This Generic Type must be instantiated with Type within
    bound otherwise it will result in compilation error.


    On the other hand `<?>` represent and unbounded type because `<?>` can be replace
    with any Type.


    ### 4. What is difference between `List<? extends T>` and `List<? super T>`?

