    Here is another section about preparing for Java Interviews, this time we will
    take a look at 40 core Java questions from telephonic round of Java Programming
    interviews. Phone interviews are usually the first step to screen candidate after
    selecting his resume. Since it’s easy to call a candidate than to schedule a face-to-face
    interview, book rooms and arrange for a meeting, telephonic round of interviews
    are quite popular now days. There were days only one telephonic round of interview
    was enough but nowadays, it’s almost two and three round of phone interview with
    different team members. Key to success in telephonic interview is to the point
    and concise answer. Since Interviewer wants to cover lot of things on telephonic
    round, they appreciate to the point answer instead of blah blah and dragging answer
    for sake of time. Always remember, its your time to make impression also so make
    sure you have good phone, fully charged and use voice modulation technique to
    be as clear as possible. Even if you don’t know the answer, think a loud, interviewer
    appreciate ability to think and some time that proves to be decisive as well.


    19


    GROKKING THE JAVA INTERVIEW


    Here is my list of 40 core Java-based questions which frequently appear on telephonic
    round of Interview. These questions touch-based of important core java concepts
    e.g. String, Thread basics, multi-threading, inter thread communication, Java
    Collection framework, Serialization, Object-oriented programming concepts and
    Exception handling. If you have faced couple of Java interviews, you will sure
    have seen some of these questions already.


    1) Difference between String, StringBuffer and StringBuilder in Java?


    String is immutable while both StringBuffer and StringBuilder is mutable, which
    means any change e.g. converting String to upper case or trimming white space
    will produce another instance rather than changing the same instance. On later
    two, StringBuffer is synchronized while StringBuilder is not, in fact its a ditto
    replacement of StringBuffer added in Java 1.5.


    2) Difference between extends Thread vs implements Runnable in Java?


    Difference comes from the fact that you can only extend one class in Java, which
    means if you extend Thread class you lose your opportunity to extend another class,
    on the other hand if you implement Runnable, you can still extend another class.


    20


    GROKKING THE JAVA INTERVIEW


    3) Difference between Runnable and Callable interface in Java?


    Runnable was the only way to implement a task in Java which can be executed in
    parallel before JDK 1.5 adds Callable. Just like Runnable, Callable also defines
    a single call() method but unlike run() it can return values and throw exceptions.


    4) Difference between ArrayList and LinkedList in Java?


    In short, ArrayList is backed by array in Java, while LinkedList is just collection
    of nodes, similar to linked list data structure. ArrayList also provides random
    search if you know the index, while LinkedList only allows sequential search.
    On other hand, adding and removing element from middle is efficient in LinkedList
    as compared to ArrayList because it only require to modify links and no other
    element is rearranged.


    5) What is difference between wait and notify in Java?


    Both wait and notify methods are used for inter thread communication, where wait
    is used to pause the thread on a condition and notify is used to send notification
    to waiting threads. Both must be called from synchronized context e.g. synchronized
    method or block.


    21


    GROKKING THE JAVA INTERVIEW


    6) Difference between HashMap and Hashtable in Java?


    Though both HashMap and Hashtable are based upon hash table data structure, there
    are subtle difference between them. HashMap is non synchronized while Hashtable
    is synchronized and because of that HashMap is faster than Hashtable, as there
    is no cost of synchronization associated with it. One more minor difference is
    that HashMap allows a null key but Hashtable doesn’t.


    7) Difference between TreeSet and TreeMap in Java?


    Though both are sorted collection, TreeSet is essentially a Set data structure
    which doesn’t allow duplicate and TreeMap is an implementation of Map interface.
    In reality, TreeSet is implemented via a TreeMap, much like how HashSet is implemented
    using HashMap.


    8) Write a Java program to print Fibonacci series?


    Core Java Interview Questions answers from telephonic Interview Fibonacci series
    is a series of number on which a number is equal to sum of previous two numbers
    i.e. f(n) = f(n-1) + f(n-2). This program is used to teach recursion to students
    but you can also solve it without recursion. Check out the solution for both iterative
    and recursive solution of this problem.


