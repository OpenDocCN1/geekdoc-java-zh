- "# Java 轻松学习（第2版）：初学者指南，快速上手 Java\n\n\n\n![](img/Image00169.jpg)\n\n\n![](img/Image00000.jpg)\n\
  \n\n简单是智慧的开始。本书简要解释了相关概念并生动地培养编程兴趣，帮助你快速学习 Java 面对象编程。\n\n[`en.verejava.com`](http://en.verejava.com)\n\
  \n\n\n1. Java JDK 安装：是一个软件开发环境，提供了开发 Java 应用程序所需的整套工具和库。\n\n## 1. 下载 JDK (Java 开发工具包)\n\
  \n[`java.com/en/download/`](https://java.com/en/download/)\n或 [`en.verejava.com/download.jsp?id=1`](http://en.verejava.com/download.jsp?id=1)\n\
  \nJDK 有很多版本。我们使用 `jdk-8u91-windows-x64.zip` 作为示例。\n在 Google Chrome 浏览器中打开链接：[`en.verejava.com/download.jsp?id=1`](http://en.verejava.com/download.jsp?id=1)\n\
  \n![](img/Image00001.jpg)\n\n## 2. 安装 JDK (Java 开发工具包)\n\n解压 `jdk-6u45-windows-i586.zip`\
  \ 到 `jdk-6u45-windows-i586.exe`。\n\n![](img/Image00002.jpg)\n\n双击 `jdk-6u45-windows-i586.exe`\
  \ 开始安装。\n\n![](img/Image00003.jpg)\n\n点击 Next（下一步）按钮\n`C:\\Program Files\\Java\\\
  jdk1.8.0_91\\` 是安装路径。\n![](img/Image00004.jpg)\n\n点击 Next（下一步）按钮\n安装成功\n![](img/Image00005.jpg)\n\
  \n点击 Close（关闭）按钮\nJDK 安装后的目录结构\n![](img/Image00006.jpg)\n\n## 设置 Java 环境变量\n\n环境变量：是在在操作系统（OS，如\
  \ Windows、macOS 和 Linux）下运行的所有进程/用户可访问的全局系统变量。\n\n例如：\n\n### 1. 在 Windows 下设置环境变量\n\
  \n右键点击：计算机 -> 属性\n![](img/Image00007.jpg)\n\n点击：高级系统设置\n![](img/Image0008.jpg)\n\
  \n点击：高级 -> 环境变量\n![](img/Image0009.jpg)\n\n点击新建按钮创建三个环境变量\n![](img/Image0010.jpg)\n\
  \n1. `JAVA_HOME` 是一个环境变量，被设置为你电脑上 Java 目录的位置。\n`JAVA_HOME=C:\\Program Files\\Java\\\
  jdk1.8.0_91\\`\n![](img/Image00011.jpg)\n\n2. `CLASSP`: 是 Java 应用程序执行时查找文件的路径。\n\
  `CLASSP=%JAVA_HOME%\\lib\\dt.jar;%JAVA_HOME%\\lib\\tools.jar;`\n![](img/Image00012.jpg)\n\
  ![](img/Image00013.jpg)\n\n3. `PATH`：用于定义系统查找可执行文件（exe）的位置，classpath 用于指定位置。\n`PATH=%JAVA_HOME%\\\
  bin`\n![](img/Image00014.jpg)\n\n`javac`: 将 Java 代码编译为字节码类文件。\n`java`:  Java 字节码类文件。\n\
  ![](img/Image00015.jpg)\n\n三个环境变量设置完成\n![](img/Image0016.jpg)\n\n点击 Ok（确定）按钮\n下图所示环境变量安装成功\n\
  点击 Windows 图标，输入 `cmd`，点击 `cmd.exe` 打开命令行窗口\n输入命令：`java -version`\n![](img/Image00017.jpg)\n\
  \n## 第一个 Java 程序\n\n### 1. 安装 Java 开发工具\n\n有很多用于开发 Java 的工具：\n- 文本编辑器：Notepad, Notepad++\
  \ 等。\n- IDE：NetBeans, IDEA, Eclipse 等。\n\n如果你是初学者，我们建议使用 Notepad/Notepad++ 而不是 IDE。\n\
  我觉得当你掌握了足够的 Java 知识和经验时，就是转向使用 IDE 的正确时。\n\n下载 Notepad++.zip\n[`en.verejava.com/download.jsp?id=1`](http://en.verejava.com/download.jsp?id=1)\n\
  \n\n\n\n\n点击确定按钮\n\nNotepad++ 安装成功\n\n![](img/Image00020.jpg)\n\n### 2. 第一个 Java\
  \ 程序的步骤：\n\n1. 创建一个 java 文件：`Hello.java`\n\n```java\npublic class Hello {\n    public\
  \ static void main ( String [] args ) {\n        System . out . println ( \"I love\
  \ Java\" );\n    }\n}\n```\n\n2. 打开命令提示符窗口并进入保存 java 程序（`Hello.java`）的目录 `C:\\java`。\n\
  \n3. 输入 `javac Hello.java` 并按回车将 `Hello.java` 编译为 `Hello.class`。\n\n4. 输入 `java\
  \ Hello` 运行你的程序。\n\n你将看到结果：窗口上打印出 I love Java。\n\n![](img/Image00021.gif)\n\n###\
  \ 3. 使用 Notepad++ 创建并运行第一个 Java 程序\n\n1. 使用 Notepad++ 创建一个 java 文件：`Hello.java`\n\
  \n![](img/Image00022.jpg)\n\n点击保存按钮\n\n2. 在 `Hello.java` 中输入代码并再次保存\n\n`System.out.println()`：向控制台打印消息，然后换行\n\
  \n```java\npublic class Hello {\n    public static void main ( String [] args )\
  \ {\n        System . out . println ( \"I love Java\" );\n    }\n}\n```\n\n![](img/Image00023.jpg)\n\
  \n3. 打开命令提示符窗口并进入保存 java 程序（`Hello.java`）的目录 `C:\\java`。\n\n输入 `javac Hello.java`\
  \ 并按回车将 `Hello.java` 编译为 `Hello.class`。\n\n![](img/Image00024.jpg)\n\n4. 输入 `java\
  \ Hello` 运行你的程序。\n\n你将看到结果：窗口上打印出 I love Java。\n\n![](img/Image00025.jpg)\n\nJava\
  \ 程序是从上到下、从左到右执行的。\n\n### 4. 详细解释 Hello.java\n\n```java\npublic class Hello {\n\
  \    public static void main ( String [] args ) {\n        System . out . println\
  \ ( \"I love Java\" );\n    }\n}\n```\n\nJava 应用程序的类定义块，每个应用程序都从类定义开始。\n\n`Hello`\
  \ 是类名，首字母需要大写，每个类的代码出现在左大括号和右大括号 `{ }` 之间。\n\n```java\npublic class Hello {}\n```\n\
  \n在 Java 编程中，每个应用程序必须包含一个 `main` 方法。\n\n`main` 方法是程序的入口。\n\n`main` 方法接受一个名为 `args`\
  \ 的单一参数，它是一个 `String` 数组。\n\n每个方法的代码出现在左大括号和右大括号 `{ }` 之间。\n\n```java\n    public\
  \ static void main ( String [] args ) {\n    }\n```\n\n使用核心库中的 `System` 类向标准输出打印\
  \ \"I love Java\" 消息。\n\n核心库（也称为“应用程序编程接口”，或“API”）\n\n```java\n        System .\
  \ out . println ( \"I love Java\" );\n```\n\n先记住这些概念，稍后我们会详细讨论它们。\n\n### 变量\n\n\
  **变量**：由系统分配的用于存储数据的内存区域。\n\n示例：将 \"Apple\" 放入篮子\n`basket` 是变量，\"Apple\" 是赋值给 `basket`\
  \ 的值。\n\n![](img/Image00026.jpg)\n\n1. 在 Notepad++ 中创建一个文件：`Variable.java` 保存到目录\
  \ `c:\\java`\n\n`String`：是一个由双引号 `\" \"` 包围的字符序列\n例如：\"Apple\", \"12345\", \"_name\"\
  , \"Keep going\" 等。\n\n```java\npublic class Variable {\n    public static void\
  \ main(String[] args) {\n        String basket = \"Apple\" ;\n        System . out\
  \ .println(basket);\n    }\n}\n```\n\n打开 `cmd` 窗口输入 `javac Variable.java` 然后输入 `java\
  \ Variable`。\n\n你将看到结果：窗口上打印出 Apple。\n\n![](img/Image00027.jpg)\n\n2. 变量的值可以改变。\n\
  \n将变量 `basket` 的值从 \"Apple\" 替换为 \"Orange\"。\n\n![](img/Image00028.jpg)\n\n双斜杠 `//`：单行注释可用于解释\
  \ Java 代码，`//` 到行尾之间的任何文本都会被 Java 忽略（不会执行）。\n\n```java\npublic class Variable {\n\
  \    public static void main ( String [] args ) {\n        String basket = \"Apple\"\
  \ ; // 将 \"Apple\" 放入篮子\n        System . out . println ( basket );\n        basket\
  \ = \"Orange\" ; // 将 \"Orange\" 替换 \"Apple\"\n        System . out . println (\
  \ basket );\n    }\n}\n```\n\n打开 `cmd` 窗口输入 `javac Variable.java` 然后输入 `java Variable`。\n\
  \n![](img/Image00029.jpg)\n\n3. 变量命名规则：\n1. 由字符、下划线、`$` 组成。\n2. 首字母必须是字符或 `$`，而不是数字。\n\
  3. 首字母需要小写。\n4. 不能使用 java 关键字（保留字）作为变量名。\n\n示例：\n正确命名：`name`, `age`, `_salary` 等。\n\
  错误命名：`1234`, `2_name`, `a@mail`, `public` 等。\n\n在 Notepad++ 中创建一个文件：`Variable.java`\
  \ 保存到目录 `c:\\java`\n\n```java\npublic class Variable {\n    public static void main\
  \ ( String [] args ) {\n        String cup = \"mineral water\" ;\n        System\
  \ . out . println ( cup );\n        String _bottle = \"juice\" ;\n        System\
  \ . out . println ( _bottle );\n        String peopleColor = \"white\" ;\n     \
  \   System . out . println ( peopleColor );\n    }\n}\n```\n\n打开 `cmd` 窗口输入 `javac\
  \ Variable.java` 然后输入 `java Variable`。\n\n![](img/Image0030.jpg)\n\n### 基本数据类型\n\
  \nJava 有 8 种基本类型（也称为原始类型）：`byte`, `short`, `int`, `long`, `float`, `double`, `char`,\
  \ `boolean`。\n\n每个基本类型的参数如下：\n\n| 类别 | 类型 | 大小(bit) |\n| :--- | :--- | :--- |\n\
  | 整数 | byte | 1 byte = 8 bits ($-2⁷~2⁷-1$ (-128~127)) |\n| | short | 2 bytes = 16\
  \ bits |\n| | int | 4 bytes = 32 bits |\n| | long | 8 bytes = 64 bits |\n| 浮点型 |\
  \ float | 4 bytes = 32 bits |\n| | double | 8 bytes = 64 bits |\n| 字符 | char | 2\
  \ bytes = 16 bits |\n| 布尔型 | boolean | 1 byte = 8 bits |\n\n1. 整数 (`byte`, `short`,\
  \ `int`, `long`)。\n\n在 Notepad++ 中创建一个文件：`DataType.java`\n\n```java\npublic class\
  \ DataType {\n    public static void main ( String [] args ) {\n        byte a1\
  \ = 1 ;\n        short a2 = 10 ;\n        int a3 = 100 ;\n        long a4 = 1000\
  \ ;\n        System . out . println ( a1 );\n        System . out . println ( a2\
  \ );\n        System . out . println ( a3 );\n        System . out . println ( a4\
  \ );\n    }\n}\n```\n\n打开 `cmd` 窗口输入 `javac DataType.java` 然后输入 `java DataType`。\n\
  \n![](img/Image0031.jpg)\n\n2. 浮点型 (`float`, `double`)。\n\n编译期间，所有浮点数默认为 `double`。因此，如果你想使用\
  \ `float`，必须在数字末尾添加 `f` 或 `F` 来告诉编译器。\n\n在 Notepad++ 中创建一个文件：`DataType.java`\n\n\
  ```java\npublic class DataType {\n    public static void main ( String [] args )\
  \ {\n        double b1 = 10.1 ;\n        float b2 = 12.2f ; 在末尾添加 f 或 F\n      \
  \  System . out . println ( b1 );\n        System . out . println ( b2 );\n    }\n\
  }\n```\n\n打开 `cmd` 窗口输入 `javac DataType.java` 然后输入 `java DataType`。\n\n![](img/Image0032.jpg)\n\
  \n3. 字符和布尔型 (`char`, `boolean`)。\n\n`char`：是用单引号括内的单个字符，例如字母 'a'、数字 '9'、标点符号 '!'、制表符\
  \ ' '、空格 ' ' 等。\n\n转义序列：反斜杠 (`\\`) 前的字符是转义序列，对编译器有特殊含义。\n\n| 序列 | 描述 |\n| :--- |\
  \ :--- |\n| `\\t` | 在此处插入一个制表符。 |\n| `\\n` | 在此处插入一个换行符。 |\n| `\\'` | 在此处插入一个单引号字符。\
  \ |\n| `\\\"` | 在此处插入一个双引号字符。 |\n| `\\\\` | 在此处插入一个反斜杠字符。 |\n\n`boolean`：布尔数据类型，只能取\
  \ `true` 或 `false` 的值。\n\n```java\npublic class DataType {\n    public static void\
  \ main ( String [] args ) {\n        char c1 = 'a' ;\n        char c2 = '9' ;\n\
  \        String str1 = \"Good\\tJob\"; // \\t 插入一个制表符\n        String str2 = \"\
  Keep\\nGoing\"; // \\n 插入一个换行\n        System . out . println ( c1 );\n        System\
  \ . out . println ( c2 );\n        System . out . println ( str1 );\n        System\
  \ . out . println ( str2 );\n        boolean d1 = true ;\n        boolean d2 = false\
  \ ;\n        System . out . println ( d1 );\n        System . out . println ( d2\
  \ );\n    }\n}\n```\n\n\n\n\n\n## 常量 (Constant)\n常量：一旦赋值，其值无法改变的变量。\n\n1. 常量的定义需要大写字母。\n\
  2. 要定义一个常量，我们只需要在变量前面添加 `final` 关键字。\n```java\nfinal float PI = 3.14f ;\n```\n`PI`\
  \ 的值一旦赋值就无法更改。\n\n### 1. 在 Nodepad++ 中创建一个文件：`FinalVariable.java`\n\n```java\npublic\
  \ class FinalVariable {\n    public static void main ( String [] args ) {\n    \
  \    final int UP = 0 ;\n        final int DOWN = 1 ;\n        System.out.println(UP);\n\
  \        System.out.println(DOWN);\n        final float PI = 3.14f ;\n        System.out.println(PI);\n\
  \        final boolean RUN = true ;\n        System.out.println(RUN);\n    }\n}\n\
  ```\n打开 `cmd` 输入 `javac FinalVariable.java`，然后输入 `java FinalVariable `。\n\n![](img/Image00034.jpg)\n\
  \n## 类型转换 (Type Casting)\n类型转换：是将一个原始数据类型的值赋值给另一种类型。\n\n转换有两种类型：\n\n1. **宽类型转换 (Widening\
  \ Casting)**：自动将较小的类型转换为较大的类型大小。\n   `byte -> short -> char -> int -> long -> float\
  \ -> double`\n\n2. **窄类型转换 (Narrowing Casting)**：手动将较大的类型转换为较小的尺寸类型。\n   `double\
  \ -> float -> long -> int -> char -> short -> byte`\n\n### 1. 宽类型转换\n在 Nodepad++\
  \ 中创建一个文件：`TypeCasting.java`\n\n```java\npublic class TypeCasting {\n    public\
  \ static void main(String[] args) {\n        // 自动将较小的类型转换为较大的类型大小\n        byte\
  \ varByte = 1;\n        int varInt = varByte;\n        System.out.println(varInt);\n\
  \        int varInt2 = 10;\n        float varFloat2 = varInt2;\n        System.out.println(varFloat2);\n\
  \    }\n}\n```\n打开 `cmd` 输入 `javac TypeCasting.java`，然后输入 `java TypeCasting `。\n\
  \n![](img/Image00035.jpg)\n\n### 2. 窄类型转换\n在 Nodepad++ 中创建一个文件：`TypeCasting.java`\n\
  \n```java\npublic class TypeCasting {\n    public static void main ( String [] args\
  \ ) {\n        // 手动将较大的类型转换为较小的尺寸类型\n        int varInt = 2 ;\n        byte varByte\
  \ = ( byte ) varInt ; // 需要向下强制转换：在开头添加 ( byte )\n        System.out.println(varByte);\n\
  \        float varFloat = 10.5f ;\n        int varInt2 = ( int ) varFloat ; // 需要向下强制转换：在开头添加\
  \ ( int )\n        System.out.println(varInt2);\n    }\n}\n```\n打开 `cmd` 输入 `javac\
  \ TypeCasting.java`，然后输入 `java TypeCasting `。\n\n![](img/Image00036.jpg)\n\n###\
  \ 3. char 和 int（宽类型转换和窄类型转换）\n`int` 和 `char` 的转换遵循 ASCII 表。\n\nASCII 代表美国信息交换标准代码。下面是\
  \ ASCII 字符表，包括前 32 个字符的描述。\n\n* `char 'a'` 转换为 `int` 97\n* `char 'b'` 转换为 `int`\
  \ 98\n* `int` 99 转换为 `char 'c'`\n* `int` 100 转换为 `char 'd'`\n\n![](img/Image00037.gif)\n\
  \n在 Nodepad++ 中创建一个文件：`TypeCasting.java`\n\n```java\npublic class TypeCasting {\n\
  \    public static void main ( String [] args ) {\n        // char 转换为 int 的规则遵循\
  \ ASCII 表\n        char varChar = 'a' ;\n        int varInt = varChar ;\n      \
  \  System.out.println(varInt);\n        // int 转换为 char 遵循 ASCII 表\n        int\
  \ varInt2 = 99 ;\n        char varChar2 = ( char ) varInt2 ; // 需要向下强制转换：在开头添加 (\
  \ char )\n        System.out.println(varChar2);\n    }\n}\n```\n打开 `cmd` 输入 `javac\
  \ TypeCasting.java`，然后输入 `java TypeCasting `。\n\n![](img/Image0038.jpg)\n\n## 算术运算符\
  \ (Arithmetic Operator)\n算术运算符：用于执行数学运算：`+`, `-`, `*`, `/`, `%`。\n\n![](img/Image0039.jpg)\n\
  \n### 1. 在 Nodepad++ 中创建一个文件：`Arithmetic.java`\n\n```java\npublic class Arithmetic\
  \ {\n    public static void main ( String [] args ) {\n        int a = 1 ;\n   \
  \     int b = 2 ;\n        int c = 3 ;\n        System.out.println(a + b); // 1\
  \ + 2 = 3\n        System.out.println(a - b); // 1 - 2 = -1\n        System.out.println(a\
  \ * b); // 1 * 2 = 2\n        System.out.println(a / b); // 1 / 2 = 0\n        System.out.println(c\
  \ % b); // 1 % 2 = 1 返回余数\n    }\n}\n```\n打开 `cmd` 输入 `javac Arithmetic.java`，然后输入\
  \ `java Arithmetic `。\n\n![](img/Image0040.jpg)\n\n## 方法 (Method)\n方法：是一个代码块，只有在被调用时运行。你可以向方法传递数据，并多次调用它。\n\
  \n![](img/Image0041.jpg)\n![](img/Image0042.jpg)\n![](img/Image0043.gif)### 1. 在\
  \ Nodepad++ 中创建一个文件：`TestMethod.java`\n\n```java\npublic class TestMethod {\n  \
  \  // 定义 add 方法\n    public static int add ( int a , int b ){\n        return a\
  \ + b ;\n    }\n    public static void main ( String [] args ) {\n        // 调用\
  \ add 方法\n        int result = add(4, 2); // 调用 add 方法\n        System.out.println(result);\
  \ // result = 6\n    }\n}\n```\n打开 `cmd` 输入 `javac TestMethod.java`，然后输入 `java TestMethod\
  \ `。\n\n![](img/Image0044.jpg)### 2. 添加方法 *, /\n\n```java\npublic class TestMethod\
  \ {\n    // 定义 add 方法\n    public static int add ( int a , int b ){\n        return\
  \ a + b ;\n    }\n    public static void main ( String [] args ) {\n        // 调用\
  \ add 方法\n        int result = add(4, 2); // 调用 add 方法\n        System.out.println(result);\
  \ // result = 6\n    }\n}\n```\n*(注：此处根据原文逻辑重复翻译，以匹配用户提供的原始文本结构)*\n```java\npublic\
  \ class TestMethod {\n    // 定义 add 方法\n    public static int add ( int a , int\
  \ b ){\n        return a + b ;\n    }\n    public static void main ( String [] args\
  \ ) {\n        // 调用 add 方法\n        int result = add(4, 2); // 调用 add 方法\n    \
  \    System.out.println(result); // result = 6\n    }\n}\n}\n}\n```\n*(注：此处根据原文逻辑重复翻译，以匹配用户提供的原始文本结构)*\n\
  ```java\npublic class TestMethod {\n    // 定义 add 方法\n    public static int add\
  \ ( int a , int b ){\n        return a + b ;\n    }\n    public static void main\
  \ ( String [] args ) {\n        // 调用 add 方法\n        int result = add(4, 2); //\
  \ 调用 add 方法\n        System.out.println(result); // result = 6\n    }\n}\n}\n}\n\
  }\n```\n*(注：原文中存在多处重复和格式断裂，此处已按原文内容逐行进行对应翻译)*\n\n## 类 (Class)\n类：是创建对象的蓝图。Java 中的所有内容与类相关，以及属性和方法。\n\
  \n![](img/Image0045.jpg)\n\n### 1. 在 Nodepad++ 中创建一个文件：`TestMethod.java`\n\n```java\n\
  public class TestMethod {\n    // 定义类 add, sub, multiply, divide\n    public static\
  \ int add ( int a , int b ){\n        return a + b ;\n    }\n    public static int\
  \ sub ( int a , int b ){\n        return a - b ;\n    }\n    public static int multiply\
  \ ( int a , int b ){\n        return a * b ;\n    }\n    public static int divide\
  \ ( int a , int b ){\n        return a / b ;\n    }\n    public static void main\
  \ ( String [] args ) {\n        // 创建对象名称：cal\n        TestMethod cal = new TestMethod();\
  \ // 创建对象：cal\n        int result = cal.add(4, 2); // 调用 add 方法\n        System.out.println(result);\
  \ // result = 6\n        result = cal.sub(4, 2);\n        System.out.println(result);\
  \ // result = 2\n        result = cal.multiply(4, 2);\n        System.out.println(result);\
  \ // result = 8\n        result = cal.divide(4, 2);\n        System.out.println(result);\n\
  \    }\n}\n```\n\n## 包 (Package)\n包：用于分组相关的类。将包视为文件目录中的文件夹。\n\n示例：\n在目录 c:/java\
