  \n## switch\n\n`switch`: switch 语句用于选择多个代码块中的一个执行。\n\nswitch 表达式求值一次。\n\n表达式的值与每个\
  \ `case` 的值进行比较。如果匹配，则执行相应的代码块。\n\n`break` 关键字会跳出 switch 块。\n\n`default` 关键字指定在没有匹配项时运行某些代码。\n\
  \n```java\nswitch (expression) {\n    case a:\n        // 代码块\n        break;\n\
  \    case b:\n        // 代码块\n        break;\n    default:\n        // 代码块\n}\n\
  ```\n\n得分示例：使用 switch 语句替换 if 语句：\n- `if score == 5`: 优秀\n- `else score == 4`: 好\n\
  - `else`: 需要提高\n\n```java\nswitch (score) {\n    case 5:\n        System.out.println(\"\
  Excellent\");\n        break;\n    case 4:\n        System.out.println(\"Good\"\
  );\n        break;\n    default:\n        System.out.println(\"Need to catch up\"\
  );\n}\n```\n\n\n\n\n\n## switch 语句\n\n```java\nimport java.util.Scanner;\npublic\
  \ class SwitchStatement {\n    public static void main(String[] args) {\n      \
  \  Scanner in = new Scanner(System.in); // 创建一个 Scanner 对象\n        System.out.println(\"\
  Please input your score:\");\n        int score = in.nextInt(); // 从用户读取一个 int 值\n\
  \        switch (score) {\n            case 5:\n                System.out.println(\"\
  Excellent\");\n                break;\n            case 4:\n                System.out.println(\"\
  Good\");\n                break;\n            default:\n                System.out.println(\"\
  Need to catch up\");\n        }\n    }\n}\n```\n\n打开 `cmd` 输入 `javac SwitchStatement.java`\
  \ 然后输入 `java SwitchStatement`。\n\n![](img/Image00051.jpg)\n\n## while 循环\n\n`while`\
  \ 循环：只要指定的条件为真，就会循环执行代码块。\n\n```java\nwhile (condition) {\n  // 要执行的代码块\n}\n```\n\
  \n1. 创建一个文件：`WhileLoop.java`\n\n只要变量 `i` 小于 3，循环中的代码就会反复执行：\n\n```java\npublic class\
  \ WhileLoop {\n    public static void main(String[] args) {\n        int i = 0;\n\
  \        while (i < 3) {\n            System.out.println(i);\n            i = i\
  \ + 1;\n        }\n    }\n}\n```\n\n![](img/Image00052.gif)\n\n## do while 循环\n\n\
  `do while` 循环：先执行一次代码块，检查条件是否为真，如果条件为真，则重复循环。\n\n```java\ndo {\n  // 要执行的代码块\n}\
  \ while (condition);\n```\n\n1. 创建一个文件：`DoWhile.java`\n\n只要变量 `i` 小于 3，循环中的代码就会反复执行：\n\
  \n```java\npublic class DoWhile {\n    public static void main(String[] args) {\n\
  \        int i = 0;\n        do {\n            System.out.println(i);\n        \
