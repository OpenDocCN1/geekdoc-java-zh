  * * * * * * * *\n* * * * * * * *\n* * * * * * * *\n* * * * * * * *\n* * * * * *\
  \ * *\n```\n\n## continue 和 break\n\n`break`：可以用于跳出循环。\n`continue`：中断当前迭代并继续循环的下一次迭代。\n\
  \n1. 创建 `BreakLoop.java`，当 `i==1` 时跳出循环：\n\n```java\npublic class BreakLoop {\n\
  \    public static void main(String[] args) {\n        for (int i = 0; i < 5; i++)\
  \ {\n            if (i == 1){\n                break; // 跳出循环\n            }\n \
  \           System.out.println(i);\n        }\n    }\n}\n```\n结果：0\n\n2. 创建 `ContinueLoop.java`，当\
  \ `i==1` 时跳过当前迭代：\n\n```java\npublic class ContinueLoop {\n    public static void\
  \ main(String[] args) {\n        for (int i = 0; i < 3; i++) {\n            if (i\
  \ == 1){\n                continue; // 跳过当前迭代\n            }\n            System.out.println(i);\n\
  \        }\n    }\n}\n```\n结果：0, 2\n\n## 一维数组\n\n数组用于在单个变量中存储多个值。声明数组使用方括号：`int[]\
