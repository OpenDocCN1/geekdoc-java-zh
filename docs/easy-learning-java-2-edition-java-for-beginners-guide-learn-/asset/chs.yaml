  \n`FileOutputStream`: 是一个输出流，用于向文件写入数据。\n(Image00122.gif)\n\n### 1. 创建文件：`c:/java/test.txt`，内容如下\n\
  \n```java\nimport java.io.*;\npublic class TestOutputStream {\n    public static\
  \ void main(String[] args) {\n        OutputStream os = null;\n        try {\n \
  \           os = new FileOutputStream(new File(\"c:/java/test.txt\")); // 必须存在\n\
  \            String content = \"morning\";\n            byte[] data = content.getBytes();\
  \ // 将 String 转换为 byte[]\n            os.write(data); // 写入文件\n        } catch (Exception\
  \ e) {\n            e.printStackTrace();\n        } finally {\n            try {\n\
  \                os.close(); // 关闭流\n            } catch (IOException e) {\n   \
  \             e.printStackTrace();\n            }\n        }\n    }\n}\n```\n\n\
  `Thread`: 是程序中执行的顺序流，CPU 为其分配执行时间。\n(Image00123.jpg)\n\n### 1. 创建文件：`TestThread.java`\n\
  `Thread`: 启动线程后，`run()` 方法将被自动调用。\n\n```java\nclass CarThread extends Thread {\n\
  \    @Override\n    public void run() {\n        for (int i = 0; i < 5; i++) {\n\
  \            System.out.println(\"Car Thread \" + i);\n            try {\n     \
  \           Thread.sleep(200);\n            } catch (InterruptedException e) {\n\
  \                e.printStackTrace();\n            }\n        }\n    }\n}\n\nclass\
  \ TrainThread extends Thread {\n    @Override\n    public void run() {\n       \
  \ for (int i = 0; i < 5; i++) {\n            System.out.println(\"Train Thread \"\
  \ + i);\n            try {\n                Thread.sleep(200);\n            } catch\
  \ (InterruptedException e) {\n                e.printStackTrace();\n           \
  \ }\n        }\n    }\n}\n\npublic class TestThread {\n    public static void main(String[]\
  \ args) {\n        CarThread carThread = new CarThread();\n        carThread.start();\n\
  \        TrainThread trainThread = new TrainThread();\n        trainThread.start();\n\
  \    }\n}\n```\n输出结果：\n```\nCar Thread 0\nTrain Thread 0\nCar Thread 1\nTrain Thread\
  \ 1\nCar Thread 2\nTrain Thread 2\nCar Thread 3\nTrain Thread 3\nCar Thread 4\n\
  Train Thread 4\n```\n从结果可以看出，两个线程交替执行。\n\n### 2. Java 有另一种实现线程的方式：\n- `CarThread`\
  \ 实现 `Runnable`，\n- `TrainThread` 实现 `Runnable`\n\n\n\n\n\n```java\nclass CarThread\
  \ implements Runnable {\n    @Override\n    public void run() {\n        for (int\
  \ i = 0; i < 5; i++) {\n            System.out.println(\"Car Thread Run \" + i);\n\
  \            try {\n                Thread.sleep(200);\n            } catch (InterruptedException\
  \ e) {\n                e.printStackTrace();\n            }\n        }\n    }\n\
  }\n\nclass TrainThread implements Runnable {\n    @Override\n    public void run()\
  \ {\n        for (int i = 0; i < 5; i++) {\n            System.out.println(\"Train\
  \ Thread Run \" + i);\n            try {\n                Thread.sleep(200);\n \
  \           } catch (InterruptedException e) {\n                e.printStackTrace();\n\
  \            }\n        }\n    }\n}\n\npublic class TestThread {\n    public static\
  \ void main(String[] args) {\n        CarThread carThread = new CarThread();\n \
  \       new Thread(carThread).start();\n        TrainThread trainThread = new TrainThread();\n\
  \        new Thread(trainThread).start();\n    }\n}\n```\n\n**输出结果：**\n\n```\nCar\
  \ Thread Run 0\nTrain Thread Run 0\nCar Thread Run 1\nTrain Thread Run 1\nCar Thread\
  \ Run 2\nTrain Thread Run 2\nCar Thread Run 3\nTrain Thread Run 3\nCar Thread Run\
  \ 4\nTrain Thread Run 4\n```\n\n从结果可以看出，两个线程正在交替执行。\n\n## 创建 GUI 窗口应用程序\n\nJava\
  \ 提供了 `Swing` 用于开发 GUI（图形用户界面）。`Swing` 是常用的。它是 GUI 工具包的标准 Java 接口。使用 Java 和 Swing\
  \ 创建 GUI 应用程序是最快、最简单的方法。\n\n### 1. 在 Eclipse 中创建一个文件：`AirplaneGame.java`\n\n- `JFrame`：类是一种容器类型，可以创建窗口。\n\
  - `JFrame.setSize(int width, int height)`：设置框架的大小。\n- `JFrame.setVisible(true)`：设置框架的可见性以打开窗口。\n\
  - `import javax.swing.*`：提供了 java swing GUI API 的类。\n\n```java\nimport javax.swing.*;\n\
  public class AirplaneGame {\n    public static void main(String[] args) {\n    \
  \    JFrame frame = new JFrame(\"Java GUI Application\");\n        frame.setSize(300,\
  \ 300);\n        frame.setVisible(true);\n    }\n}\n```\n\n**Run as -> Java Application**\
  \ 打开一个窗口：\n\n![](img/Image00124.jpg)\n\n## 创建 Canvas\n\n`Canvas`：用于在屏幕上绘制图形和图像。Java\
  \ 库包含一个用于绘制 2D 图形的简单包，称为 `java.awt`。\n\n在 Java 中创建图形有多种方法；我们可以创建一个继承自 `JPanel` 的\
  \ `Canvas`，`Canvas` 是屏幕上的空白矩形区域，应用程序可以在上面绘制。\n\n![](img/Image00125.jpg)\n\n### 1.\
  \ 创建继承自 `JPanel` 的 `Canvas`，并将画布添加到 `JFrame` 的中心。\n\n![](img/Image00126.jpg)\n\n\
  ### 2. 在 Eclipse 中创建一个文件：`AirplaneGame.java`\n\n- `this.setLayout(null)`：必须设置布局为\
  \ null\n- `this.setBackground(Color c)`：设置 `JPanel` 的背景颜色\n\n```java\nimport javax.swing.*;\n\
  import java.awt.*;\nclass Canvas extends JPanel {\n    public Canvas() {\n     \
  \   this.setLayout(null);\n        this.setBackground(Color.WHITE); // 设置背景颜色：白色\n\
  \    }\n}\n\npublic class AirplaneGame {\n    public static void main(String[] args)\
  \ {\n        JFrame frame = new JFrame(\"GUI Canvas Application\");\n        Canvas\
  \ canvas = new Canvas();\n        frame.add(canvas);\n        frame.setSize(300,\
  \ 300);\n        frame.setVisible(true);\n    }\n}\n```\n\n**Run as -> Java Application**\
  \ 打开一个窗口：\n\n![](img/Image00127.jpg)\n\n## 在 Canvas 上绘制图形\n\n`Graphics` 类提供了基本的绘制方法，如\
  \ `drawLine`、`drawRect`、`drawString` 和 `drawImage`。当我们想在屏幕上绘制自己的图形时，应该将图形代码放在 `JPanel`\
  \ 的 `paintComponent()` 方法中。系统会直接调用它。因此我们的 `Canvas` 需要重写 `paintComponent()` 方法来执行我们的图形代码。\n\
  \n![](img/Image00128.jpg)\n\n```java\nclass Canvas extends JPanel {\n    public\
  \ Canvas() {\n        this.setLayout(null);\n        this.setBackground(Color.WHITE);\n\
  \    }\n    protected void paintComponent(Graphics g) {\n        super.paintComponent(g);\n\
  \        // 将我们的图形放在这里\n    }\n}\n```\n\n### 1. 在 Canvas 上画线\n\nJava 使用坐标系，原点位于左上角。图形坐标以像素为单位；每个像素对应于屏幕上的一个点。\n\
  \n![](img/Image00129.jpg)\n\n`g.drawLine(x1, y1, x2, y2)`：接受四个整数，表示线条的起点 `(x1, y1)`\
  \ 和终点 `(x2, y2)` 坐标。\n\n```java\nimport javax.swing.*;\nimport java.awt.*;\nclass\
  \ Canvas extends JPanel {\n    public Canvas() {\n        this.setLayout(null);\n\
  \        this.setBackground(Color.WHITE); // 设置背景颜色：白色\n    }\n    protected void\
  \ paintComponent(Graphics g) {\n        super.paintComponent(g);\n        g.drawLine(50,\
  \ 50, 200, 50); // 从 (50,50) 画一条线到 (200,50)\n    }\n}\n\npublic class AirplaneGame\
  \ {\n    public static void main(String[] args) {\n        JFrame frame = new JFrame(\"\
  GUI Canvas Application\");\n        Canvas canvas = new Canvas();\n        frame.add(canvas);\
  \ // 将画布添加到 JFrame 的中心\n        frame.setSize(300, 200);\n        frame.setVisible(true);\n\
  \    }\n}\n```\n\n### 2. 在 Canvas 上画一个矩形\n\n![](img/Image00130.jpg)\n\n`g.drawRect(int\
  \ x, int y, int width, int height)`：在画布上画一个矩形。\n\n```java\nimport java.awt.*;\n\
  import javax.swing.*;\nclass Canvas extends JPanel {\n    public Canvas() {\n  \
  \      this.setLayout(null);\n        this.setBackground(Color.WHITE);\n    }\n\
  \    protected void paintComponent(Graphics g) {\n        super.paintComponent(g);\n\
  \        g.drawRect(50, 50, 100, 50); // 在 (50,50) 处画一个 100x50 的矩形\n    }\n}\n```\n\
  \n### 3. 在 Canvas 填充矩形\n\n![](img/Image00131.jpg)\n\n`g.fillRect(int x, int y, int\
  \ width, int height)`：在画布上填充矩形。\n`g.setColor(Color c)`：设置颜色（红色：`Color.RED`，绿色：`Color.GREEN`，蓝色：`Color.BLUE`）。\n\
  \n```java\nimport java.awt.*;\nimport javax.swing.*;\nclass Canvas extends JPanel\
  \ {\n    public Canvas() {\n        this.setLayout(null);\n        this.setBackground(Color.WHITE);\n\
  \    }\n    protected void paintComponent(Graphics g) {\n        super.paintComponent(g);\n\
  \        // 绘制红色矩形\n        g.setColor(Color.RED);\n        g.fillRect(50, 50, 100,\
  \ 50);\n        // 绘制绿色矩形\n        g.setColor(Color.GREEN);\n        g.fillRect(160,\
  \ 50, 100, 50);\n        // 绘制蓝色矩形\n        g.setColor(Color.BLUE);\n        g.fillRect(270,\
  \ 50, 100, 50);\n    }\n}\n}\n```\n\n### 4. 在 Canvas 上绘制图像\n\n`KidsJavascriptImages.zip`\
  \ 中的所有图片请在此链接下载：\n[`en.verejava.com/download.jsp?id=1`](http://en.verejava.com/download.jsp?id=1)\n\
  \n将图片放入 `Project test /images`\n\n![](img/Image00132.jpg)\n\nProject test/images\n\
  \n![](img/Image00133.jpg)\n\n在画布上绘制 `images/blue_plane.png`。\n\n### 1. 创建一个方法从 `test/images/images/blue_plane.png`\
  \ 加载图像到 `BufferedImage`\n\n- `new File(imagePath)`：通过图像路径创建文件对象\n- `ImageIO.read(file)`：读取图像文件保存为\
  \ `BufferedImage`\n- `g.drawImage(image, x, y, null)`：在画布上绘制图像\n\n### 2. 在画布上绘制\
  \ `BufferedImage`\n\n![](img/Image00134.jpg)\n\n\n\n\n\n```java\nimport java.awt.*;\n\
  import java.awt.image.BufferedImage;\nimport java.io.*;\nimport javax.imageio.ImageIO;\n\
  import javax.swing.*;\n\nclass Canvas extends JPanel {\n    public Canvas() {\n\
  \        this.setLayout(null);\n        this.setBackground(Color.WHITE); // 设置背景颜色：白色\n\
  \    }\n\n    protected void paintComponent(Graphics g) {\n        super.paintComponent(g);\n\
  \        BufferedImage blueImage = loadImage(\"images/blue_plane.png\");\n     \
  \   g.drawImage(blueImage, 50, 200, null);\n    }\n\n    public BufferedImage loadImage(String\
  \ imagePath) {\n        File file = new File(imagePath);\n        BufferedImage\
  \ bufferedImage = null;\n        try {\n            bufferedImage = ImageIO.read(file);\n\
  \        } catch (IOException e) {\n            e.printStackTrace();\n        }\n\
  \        return bufferedImage;\n    }\n}\n\npublic class AirplaneGame {\n    public\
  \ static void main(String[] args) {\n        JFrame frame = new JFrame(\"GUI Canvas\
  \ Application\");\n        Canvas canvas = new Canvas();\n        frame.add(canvas);\
  \ // 将画布添加到 JFrame 的中心\n        frame.setSize(300, 300);\n        frame.setVisible(true);\n\
  \    }\n}\n```\n\n## 动画\n\n1. 敌机加载图片并绘制在 `Canvas` 顶部，然后自动向下移动。\n\n![](img/Image00135.jpg)\n\
  \n## 分析\n\n1. **类**：`EnemyPlane`, `Canvas`\n2. **关系**：\n    - 2.1 敌机绘制在 `Canvas`\
  \ 顶部：这意味着 `EnemyPlane` 属于 `Canvas`。\n\n![](img/Image00136.jpg)\n3. **属性**：\n   \
  \ - 3.1 敌机加载图片：这意味着 `EnemyPlane` 拥有 `image` 属性，以及该图片的 `width` 和 `height` 属性。\n \
  \   - 3.2 敌机绘制在 Canvas 上：这意味着 `Sprite` 拥有 `x`、`y` 坐标。\n![](img/Image00137.jpg)\n\
  4. **方法**：\n    - 4.1 敌机需要加载图片：我们可以创建一个类 `ImageUtil` 和一个方法 `BufferedImage loadImage(String\
  \ imagePath)` 来加载图片；我们可以创建一个构造方法 `EnemyPlane(int x, int y, String imagePath)` 传递\
  \ `imagePath`，然后调用 `loadImage(String imagePath)` 来加载图片。\n\n```java\npublic EnemyPlane(int\
  \ x, int y, String imagePath) {\n    this.x = x;\n    this.y = y;\n    this.image\
  \ = ImageUtil.loadImage(imagePath); // 加载图片到 BufferedImage\n    this.width = this.image.getWidth();\n\
  \    this.height = this.image.getHeight();\n}\n```\n\n    - 4.2 敌机在 Canvas 顶部绘制：我们可以创建一个方法\
  \ `draw(Graphics g)`。\n\n```java\npublic void draw(Graphics g) {\n    g.drawImage(image,\
  \ this.x, this.y, null); // 在 Canvas 上绘制图片\n}\n```\n\n    - 4.3 敌机向下移动：我们可以创建一个方法\
  \ `move(int distanceX, int distanceY)`，`distanceX` 和 `distanceY` 表示在 X 轴和 Y 轴上移动的距离。\n\
  \n```java\npublic void move(int distanceX, int distanceY) {\n    this.x = this.x\
  \ + distanceX;\n    this.y = this.y + distanceY;\n}\n```\n\n    - 4.4 属性 `x`, `y`,\
  \ `width`, `height` 拥有它们自己的 getter 和 setter 方法。\n![](img/Image00138.jpg)\n\n   \
  \ - 4.5 敌机想要在 Canvas 顶部绘制：我们需要一个构造方法 `Canvas()` 来初始化敌机，然后在 `paintComponent(Graphics\
  \ g)` 方法中在 Canvas 上绘制。\n\n```java\npublic Canvas() {\n    enemyPlane = new EnemyPlane(100,\
  \ 0, \"images/enemy.png\");\n}\n\nprotected void paintComponent(Graphics g) {\n\
  \    super.paintComponent(g);\n    enemyPlane.draw(g);\n    enemyPlane.move(0, 3);\
  \ // 敌机向下移动 3 像素\n}\n```\n\n    - 4.6 敌机向下移动：我们需要一个继承自 `Canvas` 的内部类 `CanvasThread`，它有一个\
  \ `run()` 方法。我们可以定义 `while(true)`，在其中反复调用 `draw(Graphics g)` 和 `move(int distanceX,\
  \ distanceY)` 来改变敌机的位置，然后调用 `repaint()`，这会强制再次调用 `paintComponent(Graphics g)`。\n\
