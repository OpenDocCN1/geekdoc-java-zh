  \ WhileLoopGames`。\n\n![](img/Image00056.jpg)\n\n## for 循环\n\n`for` 循环：精确控制循环执行代码块的次数。\n\
  `Statement 1` 在代码块执行前执行一次。\n`Statement 2` 定义执行代码块的条件。\n`Statement 3` 在每次代码块执行完后执行一次。\n\
