  \    System.out.println(\"\");\n        }\n    }\n}\n```\n\n结果:\n```\n10 20 30\n\
  40 50 60\n70 80 90\n```\n\n## 类 (Class)\n\n`class` 是用户定义的蓝图或原型，根据它可以创建对象。\n\nJava\
  \ 中的所有内容都与类和对象相关，并拥有它们的属性和方法。对象是根据类创建的。\n\n我们可以创建一个名为 `Person` 的类，在 `Person` 中有两个属性：`name`、`age`，然后在\
  \ `Person` 中创建一个方法：`say()`，现在我们就可以用它来创建新对象了。\n\n![](img/Image00062.jpg)\n\n### 1.\
  \ 创建文件：`TestPerson.java`\n\n```java\n// 定义一个 Person 类，有两个属性：name, age 和一个方法：say()\n\
  class Person {\n    String name;\n    int age;\n    public void say() {\n      \
  \  System.out.println(\"我的名字是: \" + name + \", 今年今年 \" + age + \" 岁了\");\n    }\n\
  }\npublic class TestPerson {\n    public static void main(String[] args) {\n   \
  \     // 使用 new 关键字创建一个对象 p\n        Person p = new Person();\n        // 使用 p 调用属性和方法\n\
  \        p.name = \"Joseph\";\n        p.age = 22;\n        p.say();\n    }\n}\n\
  ```\n\n打开命令行并输入 `javac TestPerson.java`，然后输入 `java TestPerson`。\n\n结果:\n```\n我的名字是:\
  \ Joseph, 今年今年 22 岁了\n```\n\n## 封装 (Encapsulation)\n\n封装：是将数据包装成一个单一单元的机制。类的变量将对其他类隐藏，并且只能通过当前类的方法进行访问。\n\
  \n### 实现封装：\n- 将类的变量声明为 `private`（私有）。\n- 提供公共（public）setter 和 getter 方法来设置和获取变量的值。\n\
  \n### 示例：\n- 在 `Person` 类中将 `name` 和 `age` 声明为 `private`。\n- 提供公共的 `setName(String\
  \ name)` 和 `getName()` 来设置和获取 `name` 的值。\n- 提供公共的 `setAge(String age)` 和 `getAge()`\
  \ 来设置和获取 `age` 的值。\n\n![](img/Image00063.jpg)\n\n字体 注意：\n1. 类中定义的变量被称为成员变量。\n2.\
  \ 在方法中定义的变量被称为局部变量。\n\n为了区分成员变量和局部变量，在成员变量前添加：\n`this`：指代方法中的当前对象。\n\n![](img/Image00064.gif)\n\
  \n### 1. 创建文件：`TestEncapsulation.java`\n\n```java\nclass Person {\n    // 将 name\
  \ 和 age 声明为 private\n    private String name;\n    private int age;\n    // 提供公共\
  \ setter 方法来设置 name 的值\n    public void setName(String name) {\n        this.name\
  \ = name;\n    }\n    // 提供公共 getter 方法来获取 name 的值\n    public String getName()\
  \ {\n        return this.name;\n    }\n    public void setAge(int age) {\n     \
  \   this.age = age;\n    }\n    public int getAge() {\n        return this.age;\n\
  \    }\n}\npublic class TestEncapsulation {\n    public static void main(String[]\
  \ args) {\n        Person p = new Person();\n        p.setName(\"Joseph\");\n  \
  \      p.setAge(22);\n        System.out.println(p.getName() + \" \" + p.getAge());\n\
  \    }\n}\n```\n\n打开命令行并输入 `javac TestEncapsulation.java`，然后输入 `java TestEncapsulation`。\n\
  \n结果:\n```\nJoseph 22\n```\n\n## 构造方法 (Constructor Method)\n\n构造方法：用于初始化对象。当创建对象时，构造方法会被自动调用。它可以用于为属性设置初始值。构造方法的名称必须与类名匹配，且没有返回类型。所有类默认都有构造方法：如果你没有创建类，Java\
  \ 会自动为你创建一个。\n\n### 示例：\n- 定义一个 `Person` 类\n- 创建一个不带参数的构造方法：`Person()`\n- 创建一个带有两个参数的构造方法：`Person(String\
  \ name, int age)`\n\n![](img/Image00065.jpg)\n![](img/Image00066.gif)\n\n### 1.\
  \ 创建文件：`TestConstructor.java`\n\n```java\nclass Person {\n    private String name;\n\
  \    private int age;\n    public Person() {\n        System.out.println(\"调用了不带参数的构造方法\"\
  );\n    }\n    public Person(String name, int age) {\n        System.out.println(\"\
  调用了带参数的构造方法\");\n    }\n    public void say() {\n        System.out.println(\"我的名字是:\
  \ \" + name + \", 今年今年 \" + age + \" 岁了\");\n    }\n}\npublic class TestConstructor\
  \ {\n    public static void main(String[] args) {\n        // 使用不带参数的构造方法\n    \
  \    Person p1 = new Person();\n        p1.say();\n\n        // 使用带参数的构造方法\n   \
  \     Person p2 = new Person(\"Joseph\", 22);\n        p2.say();\n    }\n}\n```\n\
  \n结果:\n```\n调用了不带参数的构造方法\n我的名字是: null, 今年今年 0 岁了\n调用了带参数的构造方法\n我的名字是: Joseph, 今年今年\
  \ 22 岁了\n```\n\n## 方法重载 (Method Overload)\n\n方法重载：是指在同一个类中，`add(int a, int b)` 和\
  \ `add(double a, double b)` 具有相同的方法名但不同的参数列表。\n\n示例：\n```java\nclass Calculator\
  \ {\n    public int add(int a, int b) {\n        return a + b;\n    }\n    public\
  \ double add(double a, double b) {\n        return a + b;\n    }\n}\npublic class\
  \ Test {\n    public static void main(String[] args) {\n        Calculator calc\
  \ = new Calculator();\n        System.out.println(calc.add(10, 20));\n        System.out.println(calc.add(10.5,\
  \ 20.5));\n    }\n}\n```\n\n结果:\n```\n30\n31.0\n```\n\n\n\n\n\n```java\nclass User\
  \ {\n    public static int count;\n    public static int getCount() {\n        return\
  \ count;\n    }\n}\n\npublic class TestStatic {\n    public static void main(String[]\
  \ args) {\n        // can be called directly by the class name User\n        User.count++;\n\
  \        User.count++;\n        // can be called directly by the class name User\n\
  \        System.out.println(\"User Count : \" + User.count);\n        System.out.println(\"\
  User Count : \" + User.getCount());\n    }\n}\n```\n\nResult:\n```\nUser Count :\
  \ 2\nUser Count : 2\n```\n\n## 继承\n\n`继承`: 是一种机制，一个对象可以获取父对象的所有属性和方法。\n\n### 示例：`Student`\
  \ 继承 `Person`\n\n### 步骤：\n1. 类：`Student`, `Person`\n2. 关系：`Student` 扩展 `Person`\n\
  3. 属性：`Person` 的属性 (`name`, `age`）\n4. 方法：`Person` 的动作 (`say`)\n\n`Person` 被称为父类或超类\n\
  `Student` 被称为 `Person` 的子类或 `Person` 的子类\n\n![](img/Image00071.gif)\n\n### 注意：\n\
  1. 子类无法访问父类的私有（private）属性和方法\n2. 子类可以访问父类的保护（protected）和公共（public）属性、方法\n\n### 1.\
  \ 创建一个文件：`TestInheritence.java`\n\n```java\n// Person 被称为父类或超类\nclass Person {\n\
  \    protected String name;\n    protected int age;\n    public void say() {\n \
  \       System.out.println(\"Person can speaking\");\n    }\n}\n\n// Student 被称为\
  \ Person 的子类或 Person 的子类\nclass Student extends Person {}\n\npublic class TestInheritence\
  \ {\n    public static void main(String[] args) {\n        Student s = new Student();\
  \ // 创建子类 Student 对象\n        s.name = \"Sumi\";\n        s.age = 22;\n        s.say();\n\
  \    }\n}\n```\n\nResult:\n```\nPerson can speaking\n```\n\n### 2. 继承关系中构造方法的调用顺序\n\
  \n如果父类有无参数的构造方法：\n- 首先调用父类的无参数构造方法\n\n如果子类有无参数的构造方法：\n- 紧接着调用子类的无参数构造方法\n\n**创建一个文件：`TestInheritence.java`**\n\
  \n```java\nclass Person {\n    public Person() {\n        System.out.println(\"\
  Parent class Person is created\");\n    }\n    public void say() {\n        System.out.println(\"\
  Person can speaking\");\n    }\n}\n\nclass Student extends Person {\n    public\
  \ Student() {\n        System.out.println(\"Child class Student is created\");\n\
  \    }\n}\n\npublic class TestInheritence {\n    public static void main(String[]\
  \ args) {\n        Student s = new Student();\n        s.say();\n    }\n}\n```\n\
  \nResult:\n```\nParent class Person is created\nChild class Student is created\n\
  Person can speaking\n```\n\n## 方法重写\n\n`重写`: 子类重写了父类的方法，子类的实例将调用子类的方法，而不是调用父类的方法。\n\
  \n### 示例：\n1. 创建一个父类：`Person`，其中有一个方法：`say()`\n2. 创建一个子类：`ChineseStudent`，有一个相同的方法：`say()`\n\
  3. 创建一个子类：`AmericaStudent`，有一个相同的方法：`say()`\n`ChineseStudent` 和 `AmericaStudent`\
  \ 的 `say()` 将重写 `Person` 的 `say()`\n\n![](img/Image00072.jpg)\n\n### 1. 创建一个文件：`TestOverride.java`\n\
  \n```java\nclass Person {\n    public void say() {\n        System.out.println(\"\
  Person speaking\");\n    }\n}\n\nclass ChineseStudent extends Person {\n    public\
  \ void say() {\n        System.out.println(\"Speak Chinese\");\n    }\n}\n\nclass\
  \ AmericaStudent extends Person {\n    public void say() {\n        System.out.println(\"\
  Speak English\");\n    }\n}\n\npublic class TestOverride {\n    public static void\
  \ main(String[] args) {\n        ChineseStudent s = new ChineseStudent();\n    \
  \    s.say();\n        AmericaStudent as = new AmericaStudent();\n        as.say();\n\
  \    }\n}\n```\n\nResult:\n```\nSpeak Chinese\nSpeak English\n```\n\n## super 关键字\n\
  \n`super`: 可以用于引用父类变量。\n\n### 示例：\n1. 创建一个父类：`Person`，其中有一个方法：`say()`\n2. 创建一个子类：`Student`，有一个相同的方法：`say()`\n\
  `Student` 的 `say()` 将重写 `Person` 的 `say()`，子类的实例将调用子类的 `say()` 方法，而不是调用父类的 `say()`\
  \ 方法。如果你想调用父类的 `say()` 方法，需要像这样调用 `super.say()`。\n\n**创建一个文件：`TestSuper.java`**\n\
  \n```java\nclass Person {\n    public void say() {\n        System.out.println(\"\
  Person speaking\");\n    }\n}\n\nclass AmericaStudent extends Person {\n    public\
  \ void say() {\n        super.say();\n        System.out.println(\"Speak English\"\
  );\n    }\n}\n\npublic class TestSuper {\n    public static void main(String[] args)\
  \ {\n        AmericaStudent as = new AmericaStudent();\n        as.say();\n    }\n\
  }\n```\n\nResult:\n```\nPerson speaking\nSpeak English\n```\n\n## 多态\n\n`多态`: 继承中的对象可以向上转型为父类，向下转型为子类。\n\
  \n### 示例：\n1. 创建父类：`Person`，有一个方法：`say()`\n2. 创建子类：`Student`，有一个相同的方法：`say()`\n\
  向上转型为父类，子类的实例将调用子类的 `say()` 方法，而不是调用父类的 `say()` 方法。`Student` 的 `say()` 将重写 `Person`\
  \ 的 `say()`\n\n![](img/Image0073.gif)\n\n### 1. 创建一个文件：`TestPolymorphism.java`\n\
  \n向上转型为父类，向下转型为子类\n子类的实例将调用子类的 `say()` 方法，而不是调用父类的 `say()` 方法\n\n![](img/Image0074.gif)\n\
  \n**创建一个文件：`TestPolymorphism.java`**\n\n```java\nclass Person {\n    public void\
  \ say() {\n        System.out.println(\"Person speaking\");\n    }\n}\n\nclass Student\
  \ extends Person {\n    public void say() {\n        System.out.println(\"Student\
  \ speaking\");\n    }\n\n    public void study() {\n        System.out.println(\"\
  Student studying\");\n    }\n}\n\npublic class TestPolymorphism {\n    public static\
  \ void main(String[] args) {\n        // 向上转型为父类\n        Person p = new Student();\n\
  \        p.say();\n\n        // 向下转型为子类\n        Student s = (Student) p;\n    \
  \    s.say();\n        s.study();\n    }\n}\n```\n\nResult:\n```\nStudent speaking\n\
  Student speaking\nStudent studying\n```\n\n## 对象一对一关系\n\n### 1. 示例：`Baby` 可以吃一个水果\n\
  \n### 分析：\n1. 类：`Baby`, `Fruit`\n2. 关系：`Fruit` 一对一属于 `Baby`\n3. 属性：`Baby` 的属性 (`fruit`)\n\
  4. 方法：`Baby` 的方法 (`eat`)\n\n![](img/Image00075.gif)\n\n**创建一个文件：`TestObjectRelation.java`**\n\
  \n```java\nclass Fruit {\n    private String name;\n    public Fruit(String name)\
  \ {\n        this.name = name;\n    }\n    public String getName() {\n        return\
  \ this.name;\n    }\n}\n\nclass Baby {\n    private Fruit fruit; // Fruit 一对一属于\
  \ Baby\n    public Fruit getFruit() {\n        return this.fruit;\n    }\n    public\
  \ void eat(Fruit fruit) {\n        this.fruit = fruit;\n    }\n}\n\npublic class\
  \ TestObjectRelation {\n    public static void main(String[] args) {\n        Baby\
  \ baby = new Baby();\n        Fruit apple = new Fruit(\"Red Apple\");\n        Fruit\
  \ grape = new Fruit(\"Black Grape\");\n        baby.eat(apple);\n        System.out.println(\"\
  Baby eat \" + baby.getFruit().getName());\n        baby.eat(grape);\n        System.out.println(\"\
  Baby eat \" + baby.getFruit().getName());\n    }\n}\n```\n\nResult:\n```\nBaby eat\
  \ Red Apple\nBaby eat Black Grape\n```\n\n## 抽象类\n\n`抽象类`: 是一个声明为抽象的类。抽象类不能实例化，但它的子类可以实例化。\n\
  \n### 示例：`Father` 告诉他的儿子买一些水果\n\n### 分析：\n1. 抽象类：`Father`\n2. 实现类：`Son`\n3. 关系：`Son`\
  \ 继承 `Dad`\n4. 方法：`buy()` 父亲告诉儿子买水果，但父亲没有买\n\n![](img/Image00076.gif)\n\n一个抽象方法在声明时没有实现\n\
  \n父亲告诉儿子买水果，但父亲没有买，\n\n这意味着方法：`buy()` 没有实现\n\n\n\n\n\n## 抽象类\n\n```java\nabstract\
  \ class Father {\n    public abstract void buy(String fruit);\n}\n```\n\n儿子完成了父亲买水果的任务，这意味着方法\
  \ `buy()` 有了具体的实现。\n\n```java\nclass Son extends Father {\n    public void buy(String\
  \ fruit) {\n        System.out.println(\"Dad, I bought some : \" + fruit);\n   \
  \ }\n}\n```\n\n### 1. 创建文件：`TestAbstract.java`\n\n```java\nabstract class Father\
  \ {\n    //父亲让儿子去买水果，但父亲自己不买\n    public abstract void buy(String fruit);\n}\n\n\
  class Son extends Father {\n    // 儿子履行了父亲买水果的要求\n    public void buy(String fruit)\
  \ {\n        System.out.println(\"Dad, I bought some : \" + fruit);\n    }\n}\n\n\
  public class TestAbstract {\n    public static void main(String[] args) {\n    \
  \    Father f = new Son();\n        f.buy(\"Apples\");\n    }\n}\n```\n\n**结果：**\n\
  ```\nDad, I bought some : Apples\n```\n\n### 2. 抽象类也可以有自己的方法实现\n\n**示例：**\n`Father`\
  \ 现在正在工作，所以让儿子去买一些水果。\n\n**分析：**\n1. 方法：`Father` 有两个方法：`work()` 和 `abstract buy()`\n\
  \n**创建文件：`TestAbstract.java`**\n\n```java\nabstract class Father {\n    public void\
  \ work() {\n        System.out.println(\"Father is working now.\");\n    }\n   \
  \ public abstract void buy(String fruit);\n}\n\nclass Son extends Father {\n   \
  \ public void buy(String fruit) {\n        System.out.println(\"Dad, I bought some\
  \ : \" + fruit);\n    }\n}\n\npublic class TestAbstract {\n    public static void\
  \ main(String[] args) {\n        Father f = new Son();\n        f.work();\n    \
  \    f.buy(\"Apples\");\n    }\n}\n```\n\n**结果：**\n```\nFather is working now.\n\
  Dad, I bought some : Apples\n```\n\n---\n\n## 接口\n\n`interface`：是实现抽象的另一种方式，用于将具有空方法体的方法方法在一起，子类必须实现该接口及其空方法。\n\
  \n**示例：**\n老板雇佣员工工作。\n\n**分析：**\n1. `interface`：`Boss`\n2. 实现类：`Employee`\n3. 关系：`Employee`\
  \ 实现 `Boss`\n4. 方法：`work()` 老板雇佣员工工作，老板自己不执行这项工作。\n\n![](img/Image00077.jpg)\n\n\
  接口方法在声明时没有实现。\n老板雇佣员工工作，老板自己不执行这项工作。\n这意味着方法：`work()` 没有实现。\n\n```java\ninterface\
  \ Boss {\n    public void work();\n}\n```\n\n员工去工作，这意味着方法：`work()` 有了实现。\n\n```java\n\
  class Employee implements Boss {\n    public void work() {\n        System.out.println(\"\
  Employee start to work\");\n    }\n}\n```\n\n### 1. 创建文件：`TestInterface.java`\n\n\
  ```java\ninterface Boss {\n    //老板雇佣员工工作，老板自己不执行这项工作。\n    public void work();\n\
  }\n\nclass Employee implements Boss {\n    // 员工去工作\n    public void work() {\n\
  \        System.out.println(\"Employee start to work\");\n    }\n}\n\npublic class\
  \ TestInterface {\n    public static void main(String[] args) {\n        Boss b\
  \ = new Employee();\n        b.work();\n    }\n}\n```\n\n**结果：**\n```\nEmployee\
  \ start to work\n```\n\n**注意：**\n1. 接口中的方法允许没有实现。\n2. 接口方法默认是 public 的。\n3. 接口属性是\
  \ public 的。\n4. 子类必须实现接口中所有声明的方法。\n\n###2. 子类只能继承一个类，但可以实现多个接口。\n\n**示例：**\n老板雇佣员工工作，让员工学习。\n\
  \n**分析：**\n1. `interface`：`Boss`, `Manager`\n2. 实现类：`Employee`\n3. 关系：`Employee`\
  \ 实现 `Boss`, `Manager`\n4. 方法：`work()` 老板雇佣员工工作，老板不执行这项工作；`learn()` 让员工学习，老板不执行这项工作。\n\
  \n![](img/Image0078.jpg)\n\n**创建文件：`TestInterface.java`**\n\n```java\ninterface\
  \ Boss {\n    //老板雇佣员工工作，老板不执行这项工作。\n    public void work();\n}\n\ninterface Manager\
  \ {\n    //让员工学习，老板不执行这项工作。\n    public void learn();\n}\n\nclass Employee implements\
  \ Boss, Manager {\n    // 员工去工作\n    public void work() {\n        System.out.println(\"\
  Employee start to work\");\n    }\n    // 员工学习\n    public void learn() {\n    \
  \    System.out.println(\"Employee start to learn\");\n    }\n}\n\npublic class\
  \ TestInterface {\n    public static void main(String[] args) {\n        Boss b\
  \ = new Employee();\n        b.work();\n        Manager m = new Employee();\n  \
  \      m.learn();\n    }\n}\n```\n\n**结果：**\n```\nEmployee start to work\nEmployee\
  \ start to learn\n```\n\n---\n\n##举\n\n`enum`：是一种特殊的数据类型，允许变量是一个常量集合。变量必须等于预定义值之一。\n\
  \n**示例：**\n绘制不同的颜色。\n\n![](img/Image0079.gif)\n\n**分析：**\n1. `enum`：`Color (RED,\
  \ BLUE)`\n2. `class`：`Circle`\n3. 方法：`draw()` 不同的颜色。\n\n定义 `enum` 类型：\n```java\n\
  enum Color {\n    RED, GREEN, BLUE\n}\n```\n![](img/Image0080.gif)\n\n### 1. 创建文件：`TestEnum.java`\n\
  \n```java\n//定义枚举类型\nenum Color {\n    RED, GREEN, BLUE\n}\n\nclass Circle {\n \
  \   // 绘制不同的颜色\n    public void draw(Color color) {\n        String colorName =\
  \ \"\";\n        if (color == Color.RED) {\n            colorName = \"Red\";\n \
  \       } else if (color == Color.GREEN) {\n            colorName = \"Green\";\n\
  \        } else if (color == Color.BLUE) {\n            colorName = \"Blue\";\n\
  \        }\n        System.out.println(\"draw \" + colorName + \" circle\");\n \
  \   }\n}\n\npublic class TestEnum {\n    public static void main(String[] args)\
  \ {\n        Circle circle = new Circle();\n        circle.draw(Color.RED);\n  \
  \      circle.draw(Color.GREEN);\n        circle.draw(Color.BLUE);\n    }\n}\n```\n\
  \n**结果：**\n```\ndraw Red circle\ndraw Green circle\ndraw Blue circle\n```\n\n---\n\
  \n## 内部类\n\n`Inner class`：是一种安全机制。如果我们把类作为另一个类的成员，那么内部类就可以设为私有。\n\n**示例：**\n母亲怀孕，婴儿从母亲那里获得食物。\n\
  \n**分析：**\n1. `class`：`Mother`, `Baby`\n2. 关系：`Baby` 在 `Mother` 内部\n3. 方法：`Mother\
  \ eat(food)`, `Baby eat()` 来自 `Mother`。\n\n![](img/Image0081.gif)\n\n先定义 `Mother`\
  \ 类，然后在 `Mother` 类内部定义 `Baby` 类。\n\n```java\nclass Mother {\n    public void eat(String\
  \ food) {\n        Baby baby = new Baby();\n        baby.eat();\n    }\n    class\
  \ Baby {\n        public void eat() {\n        }\n    }\n}\n```\n\n### 1. 创建文件：`TestInnerClass.java`\n\
  \n```java\nclass Mother {\n    private String food;\n    public void eat(String\
  \ food) {\n        this.food = food;\n        System.out.println(\"Mother eat \"\
  \ + food);\n        // 婴儿从食物中吸收营养\n        Baby baby = new Baby();\n        baby.eat();\n\
  \    }\n    // 婴儿是母亲的内部类\n    private class Baby {\n        public void eat() {\n\
  \            System.out.println(\"Baby absorb nutrients from the mother's \" + food);\n\
  \        }\n    }\n}\n\npublic class TestInnerClass {\n    public static void main(String[]\
  \ args) {\n        Mother mother = new Mother();\n        mother.eat(\"Apple\");\n\
  \    }\n}\n```\n\n**结果：**\n```\nMother eat Apple\nBaby absorb nutrients from the\
  \ mother's Apple\n```\n\n---\n\n## IDE Eclipse 安装\n\n现在是使用 IDE(`Eclipse`) 的时候了，因为你已经学习了\
