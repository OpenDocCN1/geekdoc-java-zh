  \n飞机游戏\n\n在本章中，我将演示如何通过编写一个基础的飞机游戏在 Java 中制作一个基础的 2D 游戏。\n\n![](img/Image00148.jpg)\n\
  \n步骤：\n\n\n\n\n\n1. 创建一个蓝色战斗机，然后在屏幕底部的中心绘制它。\n2. 按下上、下、左、右键来移动蓝色战斗机。\n3. 按下回车键从蓝色战斗机的顶部正中央发射子弹并向上移动。\n\
  4. 如果子弹飞出屏幕顶部并消失，按回车键可以重新发射。\n5. 敌机从屏幕顶部随机出现并向下移动。\n6. 如果敌机飞出屏幕底部，敌机将消失，并随机从屏幕顶部重新出现。\n\
  7. 如果子弹击中敌机，敌机将爆炸并消失。\n\n## 分析\n\n### 1. 类 \n`BluePlane`, `EnemyPlane`, `Bullet`,\
  \ `Canvas`\n\n### 2. 关系\n在游戏游戏中，`BluePlane`、`EnemyPlane` 和 `Bullet` 统称为 `Sprite`（精灵）。由于它们具有相同的属性和方法，我们可以将\
  \ `Sprite` 定义为一个抽象类，`BluePlane`、`EnemyPlane` 和 `Bullet` 继承 `Sprite` 的属性和方法。所有的 `Sprite`\
  \ 都会在 `Canvas` 上进行绘制和移动。\n\n![](img/Image0014.jpg)\n\n### 3. 属性\n3.1 所有的 `Sprite`\
  \ 都会在 `Canvas` 上绘制。因此 `Sprite` 拥有 `x`、`y` 坐标、`image` 以及图片的宽度和高度。\n3.2 `Sprite` 会随机出现并可能消失，因此它有\
  \ `visible` 属性。`BluePlane`、`EnemyPlane` 和 `Bullet` 继承这些属性。\n3.3 `Canvas` 也有宽度高度，我们可以定义：`canvasWidth`\
  \ 和 `canvasHeight`。\n\n![](img/Image00150.jpg)\n\n### 4. 方法\n4.1 `Sprite` 需要加载图片：我们可以创建一个类\
  \ `ImageUtil` 和方法 `BufferedImage loadImage(String imagePath)` 来加载图片，我们可以创建一个构造方法\
  \ `Sprite(int x, int y, String imagePath)` 传递 `imagePath`，然后调用 `loadImage(String\
  \ imagePath)` 来加载图片。\n4.2 `Sprite` 在 `Canvas` 上绘制：我们可以创建一个方法 `draw(Graphics g)`。\n\
  4.3 `Sprite` 移动：我们可以创建一个方法 `move(int distanceX, int distanceY)`，`distanceX` 和 `int\
  \ distanceY` 表示在 X 轴和 Y 轴上移动的距离。\n4.4 子弹击中敌机：我们可以创建一个方法 `collideWith(Sprite sprite)`。\n\
  4.5 属性 `x`、`y`、`width`、`height`、`visible` 有自己的公共 getter 和 setter 方法。\n\n![](img/Image00151.jpg)\n\
  \n## 子弹碰撞敌机\n两个图片中心坐标差的绝对值小于它们宽度和高度一半之和，我们认为它们有交集并发生了碰撞。\n\n| `Math.abs()`：返回给定参数的绝对值。示例：`Math.abs(\
  \ 10 ) = 10`，`Math.abs( -10 ) = 10` |\n\n![](img/Image00152.jpg)\n\n4.6 `Sprite`\
  \ 在 `Canvas` 上绘制：我们需要创建一个构造方法 `Canvas()` 来初始化 `BluePlane`、`EnemyPlane` 和 `Bullet`，然后在\
  \ `paintComponent(Graphics g)` 方法中在 `Canvas` 上进行绘制。\n\n```java\n  public Canvas()\
  \ {\n      this .setLayout( null );\n      this .setBackground(Color. WHITE );\n\
  \      this .requestFocus();\n      bluePlane = new BluePlane(100, 200, \"images/blue_plane.png\"\
  \ );\n      bullet = new Bullet(-100, -100, \"images/blue_bullet.png\" );\n    \
  \  bullet .setVisible( false );\n      enemyPlane = new EnemyPlane(-100, -100, \"\
  images/enemy_plane.png\" );\n  }\n\n  protected void paintComponent(Graphics g)\
  \ {\n      super.paintComponent(g);\n      bluePlane.draw(g);\n      bullet.draw(g);\n\
  \      enemyPlane.draw(g);\n  }\n```\n\n4.7 按下上、下、左、右键来移动蓝色战斗机：我们需要为 `Canvas` 添加按键监听器：`this.addKeyListener`。当按下任意键时，`keyPressed(e)`\
  \ 方法会被调用。\n\n```java\n  this.addKeyListener( new KeyAdapter() {\n      public void\
  \ keyPressed(KeyEvent e) {\n          int keyCode = e.getKeyCode();\n          if\
  \ (keyCode == KeyEvent.UP ) {\n              bluePlane.move(0, -10);\n         \
  \ } else if (keyCode == KeyEvent.DOWN ) {\n              bluePlane.move(0, 10);\n\
  \          } else if (keyCode == KeyEvent.LEFT ) {\n              bluePlane.move(-10,\
  \ 0);\n          } else if (keyCode == KeyEvent.RIGHT ) {\n              bluePlane.move(10,\
  \ 0);\n          }\n      }\n  });\n```\n\n4.8 按回车键从蓝色战斗机的顶部正中央发射子弹并向上移动：\n\n```java\n\
  \          if (keyCode == KeyEvent.ENTER ) {\n              bullet = new Bullet(bluePlane.x,\
  \ bluePlane.y, \"images/blue_bullet.png\" );\n              bullet.setVisible( true\
  \ );\n          }\n```\n\n4.9 如果子弹 `visible=true` 在 `Canvas` 上向上移动：\n\n```java\n\
  \    public void bulletMove(){\n      if ( bullet .isVisible()){\n          bullet.move(0,\
  \ -10);\n      }\n  }\n```\n\n4.10 如果子弹飞出屏幕顶部并消失，设置 `visible=false`。\n\n4.11 敌机从屏幕顶部随机出现并向下移动：\n\
  \n4.12 当 `enemyplane` 移出画布时，敌机需要被销毁设置 `visible = false`：\n\n4.13 如果子弹击中敌机，子弹和敌机爆炸并消失：\n\
  \n\n\n\n\n```java\nimport java.awt.Graphics;\nimport java.awt.image.BufferedImage;\n\
  \npublic abstract class Sprite {\n    protected int x;\n    protected int y;\n \
  \   protected int width;\n    protected int height;\n    protected BufferedImage\
  \ image;\n    protected boolean visible;\n\n    public Sprite(int x, int y, String\
  \ imagePath) {\n        this.x = x;\n        this.y = y;\n        this.image = ImageUtil.loadImage(imagePath);\n\
  \        this.width = this.image.getWidth();\n        this.height = this.image.getHeight();\n\
  \    }\n\n    public void draw(Graphics g) {\n        g.drawImage(image, this.x,\
  \ this.y, null);\n    }\n\n    public void move(int distanceX, int distanceY) {\n\
  \        this.x = this.x + distanceX;\n        this.y = this.y + distanceY;\n  \
  \  }\n\n    public boolean collideWith(Sprite sprite) {\n        int centerX = this.x\
  \ + this.getWidth() / 2;\n        int centerY = this.y + this.getHeight() / 2;\n\
  \        int spriteCenterX = sprite.getX() + sprite.getWidth() / 2;\n        int\
  \ spriteCenterY = sprite.getY() + sprite.getHeight() / 2;\n        if (Math.abs(centerX\
  \ - spriteCenterX) < (this.width / 2 + sprite.getWidth() / 2)\n                &&\
  \ Math.abs(centerY - spriteCenterY) < (this.height / 2 + sprite.getHeight() / 2))\n\
  \            return true;\n        else\n            return false;\n    }\n\n  \
  \  public int getX() {\n        return x;\n    }\n\n    public void setX(int x)\
  \ {\n        this.x = x;\n    }\n\n    public int getY() {\n        return y;\n\
  \    }\n\n    public void setY(int y) {\n        this.y = y;\n    }\n\n    public\
  \ boolean isVisible() {\n        return visible;\n    }\n\n    public void setVisible(boolean\
  \ visible) {\n        this.visible = visible;\n    }\n\n    public int getWidth()\
  \ {\n        return width;\n    }\n\n    public int getHeight() {\n        return\
  \ height;\n    }\n}\n```\n\n创建 3 个子类：`BluePlane.java`、`EnemyPlane.java`、`Bullet.java`\n\
