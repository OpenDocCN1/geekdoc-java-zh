  \     super(x, y, imagePath);\n    }\n}\n```\n\n### EnemyPlane.java\n```java\npublic\
  \ class EnemyPlane extends Sprite {\n    public EnemyPlane(int x, int y, String\
  \ imagePath) {\n        super(x, y, imagePath);\n    }\n}\n```\n\n### Bullet.java\n\
  ```java\npublic class Bullet extends Sprite {\n    public Bullet(int x, int y, String\
  \ imagePath) {\n        super(x, y, imagePath);\n    }\n\n    public void move(int\
