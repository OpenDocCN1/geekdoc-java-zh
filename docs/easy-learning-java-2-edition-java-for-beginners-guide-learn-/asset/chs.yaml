  \n![](img/Image00094.jpg)\n\n12. Eclipse 将自动将 `Hello.java` 编译为 `Hello.class`，然后运行\
  \ `Hello`，结果将在 `Console` 面板中打印。\n\n![](img/Image00095.jpg)\n\n## String\n`String`:\
  \ 是 Java 的默认类，表示字符字符串。`Strings` 是常量；它们值在创建后不能被更改。\n\n### 1. String 比较\n`equals()`\
  \ 方法和 `==` 运算符用于比较两个 `String`。\n\n```java\nString str1 = \"hello\";\nString str2\
  \ = \"hello\";\nSystem.out.println(str1.equals(str2)); // =true\nSystem.out.println(str1\
  \ == str2); // = true\n```\n`str1` 和 `str2` 指向字符串池中同一个 \"hello\" 对象，所以 `equals()`\
  \ 和 `==` 为 true ![](img/Image00096.gif)\n\n```java\nString str1 = \"hello\";\nString\
  \ str2 = new String(\"hello\");\nSystem.out.println(str1.equals(str2)); // =true\n\
  System.out.println(str1 == str2); // =false\n```\n为什么 `str1.equals(str2)` 为 true\
  \ 但 `str1 == str2` 为 false？\n因为 `str1` \"hello\" 在 `String Pool`（字符串池）中创建的，而 `str2`\
  \ `new String(\"hello\")` 在 `Heap`（堆）中创建的。`==` 运算符比较引用，而 `equals()` 比较 `String`\
  \ 的值。`str1` 和 `str2` 的值相同，但引用不同 ![](img/Image00097.gif)\n\n### 2. String replace\
  \ (char oldChar, char newChar)\n返回一个将字符串中所有出现的 `oldChar` 替换为 `newChar` 后的新字符串。\n\
  将所有 `||` 替换为 `,`\n\n```java\nString person = \"David||30||Male||Married\";\nperson\
  \ = person.replace(\"||\", \",\");\nSystem.out.println(person);\n```\n结果：`David,30,Male,Married`\n\
  \n### 3. boolean startsWith(String prefix)\n测试此字符串是否以指定的 `prefix` 开始。\n测试文件路径是否以\
  \ `c:` 开始\n\n```java\nString path = \"c:/video/forever.mp4\";\nSystem.out.println(path.startsWith(\"\
  c:\"));\n```\n结果：`true`\n\n### 4. boolean endsWith(String suffix)\n测试此字符串是否以指定的\
  \ `suffix` 结尾。\n测试文件路径是否以 `.mp4` 结尾\n\n```java\nString path = \"c:/video/forever.mp4\"\
  ;\nSystem.out.println(path.endsWith(\".mp4\"));\n```\n结果：`true`\n\n### 5. int indexOf(char\
  \ ch)\n从左到右在字符串中查找 `ch` 的第一个索引。字符串的索引从 `0` 开始 ![](img/Image00098.gif)\n\n```java\n\
  String path = \"c:/video/forever.mp4\";\nint index = path.indexOf(\"/\");\nSystem.out.println(index);\n\
  ```\n结果：`2`\n\n### 6. int lastIndexOf(char ch)\n从右到左在字符串中查找 `ch` 的第一个索引。从右到左在路径中查找第一个\
  \ `/`索引。\n\n```java\nString path = \"c:/video/forever.mp4\";\nint lastIndex = path.lastIndexOf(\"\
  /\");\nSystem.out.println(lastIndex);\n```\n结果：`8`\n\n### 7. String trim()\n移除字符串两边的空白字符。\n\
  \n```java\nString str = \" aa bb  \";\nstr = str.trim();\nSystem.out.println(str);\n\
  ```\n结果：`aa bb`\n\n### 8. String substring(int beginIndex)\n移除字符串两边的空白字符（注：此处原文描述与方法名不符，按意译处理）。\n\
  从 `beginIndex` 开始截取字符串，直到末尾。\n\n```java\nString str = \" aa bb  \";\nstr = str.trim();\n\
  System.out.println(str);\n```\n结果：`aa bb`\n\n### 9. String substring(int beginIndex,\
  \ int endIndex)\n从 `beginIndex` 开始截取字符串。\n\n```java\nString str = \" aa bb  \";\n\
  str = str.trim();\nSystem.out.println(str);\n```\n结果：`aa bb`\n\n### 10. String split(String\
  \ regex)\n根据正则表达式将字符串拆分为数组。\n\n\n\n\n\n```java\nString ageStr = \"20\" ;\nint age\
  \ = Integer.parseInt(ageStr);\nString moneyStr = \"1000.5\" ;\ndouble money = Double.parseDouble(moneyStr);\n\
  System.out.println(age);\nSystem.out.println(money);\n```\n\n**Result:**\n```\n\
  20\n1000.5\n```\n\n## Object\n\n`Object` 是类层次结构的根。每个类都以 `Object` 作为父类。因此，所有对象都是\
  \ `Object` 的子类。\n\n`Object` 类包含一个 `toString()` 方法。我们可以使用 `toString()` 方法来获取对象的字符串表示。每当我们尝试打印\
  \ `Object` 引用时，就会调用 `toString()` 方法。如果我们没有定义 `toString()` 方法，则会调用 `Object` 类的 `toString()`\
  \ 方法，否则将调用我们重写的（Overridden）`toString()` 方法。\n\n### 1. 创建一个类：`Cat`\n\n我们没有定义 `toString()`\
  \ 方法，将调用 `Object` 类的 `toString()` 方法。\n\n![](img/Image00101.jpg)\n\n创建测试文件：`TestObject.java`\n\
  \n```java\nclass Cat {\n    private String name;\n    public Cat(String name) {\n\
  \        this.name = name;\n    }\n}\npublic class TestObject {\n    public static\
  \ void main(String[] args) {\n        Object obj = new Cat(\"Teddy\");\n       \
  \ System.out.println(obj.toString());\n    }\n}\n```\n\n**Result:**\n```\ntest.Cat@1f1fba0\n\
  ```\n\n## 2. 创建一个类：`Cat`\n\n我们在 `Cat` 中定义了 `toString()` 方法，将调用我们重写的 `toString()`\
  \ 方法。\n\n![](img/Image00102.jpg)\n\n创建测试文件：`TestObject.java`\n\n```java\nclass Cat\
  \ {\n    private String name;\n    public Cat(String name) {\n        this.name\
  \ = name;\n    }\n    public String toString() {\n        return name;\n    }\n\
  }\npublic class TestObject {\n    public static void main(String[] args) {\n   \
  \     Object obj = new Cat(\"Teddy\");\n        System.out.println(obj.toString());\n\
  \    }\n}\n```\n\n**Result:**\n```\nTeddy\n```\n\n## ArrayList\n\n`ArrayList` 是集合框架的一部分，存在于\
  \ `java.util` 包中。它为我们提供了动态数组。它实现了 `List` 接口。`List` 继承自 `Collection` 接口。\n\n1. `ArrayList`\
  \ 遵循先进先出的顺序。\n2. `ArrayList` 可以添加重复元素。\n3. `ArrayList` 还可以添加 `null` 值。\n4. `ArrayList`\
  \ 是一个对象数组。\n\n![](img/Image00103.gif)\n\n### 1. `add(Object o)`\n在列表的末尾添加元素。\n\n\
  ### `get(int index)`\n从列表指定的位置获取元素。\n\n```java\npublic static void main(String[]\
  \ args) {\n    List list = new ArrayList();\n    list.add(100);\n    list.add(\"\
  David\");\n    System.out.println(list.get(0));\n    System.out.println(list.get(1));\n\
  }\n```\n\n**Result:**\n```\n100\nDavid\n```\n\n### 2. `int size()`\n返回列表中元素的数量。\n\
  \n```java\npublic static void main(String[] args) {\n    List list = new ArrayList();\n\
  \    list.add(100);\n    list.add(\"David\");\n    list.add(25.5);\n    // 打印所有元素\n\
  \    for (int i = 0; i < list.size(); i++) {\n        Object obj = list.get(i);\n\
  \        System.out.print(obj + \",\");\n    }\n}\n```\n\n**Result:**\n```\n100,David,25.5,\n\
  ```\n\n### 3. `set(int index, Object element)`\n替换列表中指定位置的元素。\n\n```java\nList list\
  \ = new ArrayList();\nlist.add(100);\nlist.add(\"David\");\nlist.set(1, \"Grace\"\
  ); // 将 \"David\" 更新为 \"Grace\"\n```\n\n**Result:**\n```\n100,Grace\n```\n\n###\
  \ 4. `remove(int index)` 和 `remove(Object o)`\n移除指定位置的元素，或移除指定元素的第一次出现项。\n\n```java\n\
  List list = new ArrayList();\nlist.add(100);\nlist.add(\"David\");\nlist.add(10.5);\n\
  list.remove(0); // 删除索引为 0 的元素\nlist.remove(\"David\"); // 删除元素 \"David\"\n```\n\
  \n**Result:**\n```\n10.5\n```\n\n### 5. `isEmpty()`, `clear()`, 和 `contains(Object\
  \ o)`\n`isEmpty()` 如果列表为空则返回 true，否则返回 false。`clear()` 移除列表中的所有元素。`contains(Object\
  \ o)` 如果列表包含指定元素返回 true。\n\n```java\npublic static void main(String[] args) {\n\
  \    List list = new ArrayList();\n    list.add(100);\n    list.add(\"David\");\n\
  \    list.add(10.5);\n    System.out.println(list.isEmpty()); // false\n    System.out.println(list.contains(\"\
  David\")); // true\n    list.clear();\n    System.out.println(list.isEmpty()); //\
  \ true\n}\n```\n\n### 6. List 添加自定义对象：`Person`\n\n```java\nimport java.util.*;\n\
  class Person {\n    private String name;\n    private int age;\n    public Person(String\
  \ name, int age) {\n        this.name = name;\n        this.age = age;\n    }\n\
  \    public String toString() {\n        return \"name = \" + name + \", age = \"\
  \ + age;\n    }\n}\npublic class TestList {\n    public static void main(String[]\
  \ args) {\n        List list = new ArrayList();\n        list.add(new Person(\"\
  David\", 20));\n        list.add(new Person(\"Joseph\", 30));\n        list.add(new\
  \ Person(\"Grace\", 40));\n        // 打印所有的 Person\n        for (int i = 0; i <\
  \ list.size(); i++) {\n            Object obj = list.get(i);\n            System.out.println(obj);\
  \ // 将调用 toString()\n        }\n    }\n}\n```\n\n**Result:**\n```\nname = David,\
  \ age = 20\nname = Joseph, age = 30\nname = Grace, age = 40\n```\n\n## LinkedList\n\
  \n`LinkedList` 是一个许多许多对象的集合，它实现了 `List` 接口。`LinkedList` 是一个双向链表，它可以包含许多元素。如果你频繁地访问随机元素，最好使用\
  \ `ArrayList`。如果你频繁地添加和删除元素，最好使用 `LinkedList`。\n\n### 1. `addFirst(E e)` 和 `addLast(E\
  \ e)`\n在列表头部或末尾添加元素。\n\n```java\npublic static void main(String[] args) {\n    LinkedList\
  \ list = new LinkedList();\n    list.add(\"David\");\n    list.add(\"Joseph\");\n\
  \    list.addFirst(\"Grace\");\n    list.addLast(\"Renia\");\n    for (int i = 0;\
  \ i < list.size(); i++) {\n        System.out.println(list.get(i));\n    }\n}\n\
  ```\n\n**Result:**\n```\nGrace\nDavid\nJoseph\nRenia\n```\n\n### 2. `getFirst()`\
  \ 和 `getLast()`\n获取头部或末尾的元素。\n\n```java\npublic static void main(String[] args)\
  \ {\n    LinkedList list = new LinkedList();\n    list.add(\"David\");\n    list.add(\"\
  Joseph\");\n    System.out.println(\"First: \" + list.getFirst());\n    System.out.println(\"\
  Last: \" + list.getLast());\n}\n```\n\n**Result:**\n```\nFirst: David\nLast: Joseph\n\
  ```\n\n### 3. `removeFirst()` 和 `removeLast()`\n移除头部或末尾的元素。\n\n```java\npublic static\
  \ void main(String[] args) {\n    LinkedList list = new LinkedList();\n    list.add(\"\
  David\");\n    list.add(\"Joseph\");\n    list.removeFirst();\n    list.removeLast();\n\
  \    for (int i = 0; i < list.size(); i++) {\n        System.out.println(list.get(i));\n\
  \    }\n}\n```\n\n**Result:**\n```\nDavid\n```\n\n## Iterator\n\n`Iterator` 是属于集合框架的接口。它允许我们遍历集合并访问数据元素。\n\
  \n![](img/Image0107.gif)\n\n### 1. `hasNext()`\n如果迭代器还有元素可以迭代，则返回 true。\n\n### 2.\
  \ `next()`\n返回集合中的下一个元素，直到 `hasNext()` 返回 false。\n\n```java\npublic static void\
  \ main(String[] args) {\n    List stationList = new ArrayList();\n    stationList.add(\"\
  Berkeley University\");\n    stationList.add(\"Market Street\");\n    stationList.add(\"\
  Polo Alto\");\n    stationList.add(\"Cuptino\");\n    Iterator iter = stationList.iterator();\n\
  \    while (iter.hasNext()) {\n        String station = iter.next().toString();\n\
  \        System.out.print(station + \" -> \");\n    }\n}\n```\n\n\n\n\n\nResult:\n\
  伯克利大学 -> Market Street -> Polo Alto -> Cuptino ->\n\n## HashSet\n\n`HashSet`: 用于创建一个使用哈希表进行存储的集合。它实现了\
  \ `Set` 接口。`HashSet` 类具有与 `ArrayList` 相同的方法。\n\n1. `HashSet` 仅包含唯一元素。\n2. `HashSet`\
  \ 允许 `null` 值。\n3. `HashSet` 返回值的顺序是不固定的。\n\n![](img/Image00108.jpg)\n\n```java\n\
  public static void main(String[] args) {\n    Set set = new HashSet();\n    set.add(\"\
  Abraham\");\n    set.add(\"Washington\");\n    set.add(\"James\");\n    set.add(\"\
  James\");\n    set.add(\"James\");\n    Iterator iter = set.iterator();\n    while\
  \ (iter.hasNext()) {\n        String name = iter.next().toString();\n        System.out.print(name+\
  \ \" , \");\n    }\n}\n```\nResult:\nWashington , James , Abraham ,\n\n## HashMap\n\
  \n`HashMap`: 基于 `Map` 的集合类，用于存储 `Key = value` 键值对，它不会以相同的顺序返回键和值。\n\n![](img/Image00109.jpg)\n\
  ![](img/Image00110.gif)\n\n1. `put(Object key, Object value)`:\n将键值映射插入到 map 中。\n\
  \n`Object get(Object key)`:\n返回指定键对应的值。\n\n`boolean containsKey(Object key)`:\n\
  根据 map 中是否找到指定的键来返回 `true` 或 `false`。\n\n```java\npublic static void main(String[]\
  \ args) {\n    Map map = new HashMap();\n    map.put(\"name\", \"David\");\n   \
  \ map.put(\"age\", 20);\n    System.out.println(map.get(\"name\")); // David\n \
  \   System.out.println(map.get(\"age\")); // 20\n    System.out.println(map.containsKey(\"\
  age\")); // true\n}\n```\n\n2. `Set keySet()`:\n返回从 map 中获取的键的 `Set`。\n\n```java\n\
  public static void main(String[] args) {\n    Map map = new HashMap();\n    map.put(\"\
  name\", \"David\");\n    map.put(\"age\", 20);\n    map.put(\"salary\", 12000);\n\
  \    map.put(\"married\", false);\n    Set set = map.keySet();\n    Iterator iter\
  \ = set.iterator();\n    while (iter.hasNext()) {\n        Object key = iter.next();\n\
  \        Object value = map.get(key);\n        System.out.println(key + \"=\" +\
  \ value);\n    }\n}\n```\nResult:\nmarried=false\nage=20\nname=David\nsalary=12000\n\
  \n## Generic\n\n`Generic`: 方法和泛型类允许程序员人员通过单个方法声明或单个类声明来指定类型。泛型还提供了编译时安全，允许您在编译时捕获无效类型。所有的泛型声明都有由尖括号\
  \ `< >` 分隔的类型参数。\n\n### 1. 创建泛型类：`Person<T>`\n```java\nclass Person<T> { //<T> 传递各种类型\n\
  \    private T age;\n    public Person(T age) {\n        this.age = age;\n    }\n\
  \    public T getAge() {\n        return age;\n    }\n    public void setAge(T age)\
  \ {\n        this.age = age;\n    }\n}\n\nclass TestGeneric {\n    public static\
  \ void main(String[] args) {\n        Person<String> p1 = new Person<String>(\"\
  30\"); // 传递 String 类型\n        System.out.println(p1.getAge());\n        Person<Integer>\
  \ p2 = new Person<Integer>(80); // 传递 Integer 类型\n        System.out.println(p2.getAge());\n\
  \    }\n}\n```\nResult:\n30\n80\n\n### 2. 为 List 使用泛型：`ArrayList<String>`\n```java\n\
  public static void main(String[] args) {\n    List<String> list = new ArrayList<String>();\n\
  \    list.add(\"Faith\");\n    list.add(\"Danie\");\n    list.add(\"Mathew\");\n\
  \    for (int i = 0; i < list.size(); i++) {\n        String element = list.get(i);\n\
  \        System.out.println(element);\n    }\n}\n```\nResult:\nFaith\nDanie\nMathew\n\
  \n### 3. 为 Map 使用泛型：`HashMap<String, Integer>`\n```java\npublic static void main(String[]\
  \ args) {\n    Map<String, Integer> map = new HashMap<String, Integer>();\n    map.put(\"\
  English\", 100);\n    map.put(\"Math\", 95);\n    map.put(\"Science\", 98);\n  \
  \  Set<String> set = map.keySet();\n    Iterator<String> iter = set.iterator();\n\
  \    while (iter.hasNext()) {\n        String key = iter.next();\n        Integer\
  \ value = map.get(key);\n        System.out.println(key + \"=\" + value);\n    }\n\
  }\n```\nResult:\nMath=95\nScience=98\nEnglish=100\n\n### 4. 创建一个类：`Customer`\n为\
  \ List 使用泛型：`ArrayList<Customer>`\n```java\nimport java.util.*;\nclass Customer\
  \ {\n    private String name;\n    private int age;\n    public Customer(String\
  \ name, int age) {\n        this.name = name;\n        this.age = age;\n    }\n\
  \    public String getName() {\n        return name;\n    }\n    public int getAge()\
  \ {\n        return age;\n    }\n}\n\nclass TestGeneric {\n    public static void\
  \ main(String[] args) {\n        List<Customer> customerList = new ArrayList<Customer>();\n\
  \        customerList.add(new Customer(\"Grace\", 25));\n        customerList.add(new\
  \ Customer(\"Renia\", 30));\n        customerList.add(new Customer(\"Rebeka\", 28));\n\
  \        for (int i = 0; i < customerList.size(); i++) {\n            Customer customer\
  \ = customerList.get(i);\n            System.out.println(customer.getName() + \"\
  \ \" + customer.getAge());\n        }\n    }\n}\n```\nResult:\nGrace, 25\nRenia,\
  \ 30\nRebeka, 28\n\n## Random\n\n`Random`: 用于生成随机数。`Random` 类位于 `java.util` 包中。\n\
  \n### 1. 打印随机数 0-9\n`nextInt(n)`: 返回 `0` 到 `n-1` 之间的随机数。\n```java\nimport java.util.*;\n\
  class RandomNumber {\n    public static void main(String[] args) {\n        Random\
  \ rn = new Random();\n        for (int i = 0; i < 10; i++) {\n            int num\
  \ = rn.nextInt(10);\n            System.out.println(num + \", \");\n        }\n\
  \    }\n}\n```\nResult:\n9, 3, 4, 0, 5,\n\n### 2. 生成 6 个不同的随机数\n`HashSet` 包含唯一元素，我们可以持续生成随机数直到\
  \ HashSet 填充了 6 个不同的数字。\n```java\nimport java.util.*;\nclass VerificationCode {\n\
  \    public static void main(String[] args) {\n        Random rn = new Random();\n\
  \        Set<Integer> set = new HashSet<>();\n        // 持续生成随机数到 HashSet\n    \
  \    while (set.size() < 6) {\n            int num = rn.nextInt(10);\n         \
  \   set.add(num);\n        }\n        // 打印 HashSet 中的所有随机数\n        Iterator<Integer>\
  \ iter = set.iterator();\n        while (iter.hasNext()) {\n            System.out.print(iter.next()\
  \ + \" , \");\n        }\n    }\n}\n```\nResult:\n0, 3, 4, 5, 7, 8 ,\n\n## Exception\n\
  \n`Exception`: 是程序执行过程中发生的意外或意外事件，`Exception` 可能会尝试捕获。\n`Error`: 表示应用程序不应捕获的严重问题。\n\
  \n![](img/Image00111.jpg)\n\ntry catch 块\n```java\ntry {\n    // 可能引起异常的语句\n} catch\
  \ (Exception e) {\n    // 处理异常\n}\n```\n\n### 1. 如果 `a/b` 且 `b = 0`，将抛出异常：`ArithmeticException`。\n\
  ```java\npublic static void main(String[] args) {\n    int result = 0;\n    int\
  \ a = 10;\n    int b = 0;\n    try {\n        result = a / b;\n        System.out.println(result);\n\
  \    } catch (ArithmeticException e) {\n        System.out.println(\"除数不能为 0\");\n\
  \    }\n}\n```\nResult:\n除数不能为 0\n如果发生异常，`try` 块将终止并直接跳转到 `catch` 块。\n\n![](img/Image00112.gif)\n\
  \n## 2. `finally` 块：包含无论是否发生异常都执行的关键语句。无论 `try` 块中是否发生异常，此块中的语句都都会执行。\n\n如果 `a/b`\
  \ 且 `b != 0`\n![](img/Image00113.gif)\nResult:\n2\nfinally\n\n如果 `a/b` 且 `b = 0`\n\
  ![](img/Image00114.gif)\nResult:\n除数不能为 0\nFinally\n\n\n\n\n\n`finally` 块无论 `try`\
  \ 块中是否发生异常都会始终执行。\n\n## File\n\n`File` 是 Java 中文件或目录路径名的表示。`File` 类包含若干个方法，用于处理路径名、删除和重命名文件、创建新目录、列出目录内容等。`File`\
  \ 类位于 `java.io` 包中。\n\n### 1. 创建目录：`c:/java`\n\n`mkdirs()`:\n创建由 `pathname` 指定命名的目录。\n\
  \n```java\nimport java.io.*;\npublic class TestFile {\n    public static void main(String[]\
