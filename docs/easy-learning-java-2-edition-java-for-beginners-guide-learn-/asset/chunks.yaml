    \ 6.1 [If]\n    - 6.2 [Switch]\n    - 6.3 [While Loop]\n    - 6.4 [Do While Loop]\n\
    \    - 6.5 [While Loop Games]\n    - 6.6 [For Loop]\n    - 6.7 [Continue and Break]\n\
    7. [Java Array]\n    - 7.1 [One-Dimensional Array]\n    - 7.2 [Two-Dimensional\
    \ Array]\n8. [Java Object-Oriented]\n    - 8.1 [Class]\n    - 8.2 [Encapsulation]\n\
    \    - 8.3 [Constructor Method]\n    - 8.4 [Method Overload]\n    - 8.5 [Static\
    \ Keyword]\n    - 8.6 [Inheritance]\n    - 8.7 [Method Override]\n    - 8.8 [Super\
    \ Keyword]\n    - 8.9 [Polymorphism]\n    - 8.10 [Object Relationship One-to-One]\n\
    \    - 8.11 [Abstract Class]\n    - 8.12 [Interface]\n    - 8.13 [Enum]\n    -\
    \ 8.14 [Internal Class]\n9. [IDE Eclipse]\n10. [String]\n11. [Primitive Types\
    \ and Wrapper Classes]\n12. [Object]\n13. [Collection]\n    - 13.1 [ArrayList]\n\
    \    - 13.2 [LinkedList]\n    - 13.3 [Iterator]\n    - 13.4 [HashSet]\n    - 13.5\
    \ [HashMap]\n    - 13.6 [Generic]\n    - 13.7 [Random]\n14. [Exception]\n15. [File\
    \ IO]\n    - 15.1 [File]\n    - 15.2 [FileInputStream]\n    - 15.3 [FileOutputStream]\n\
    16. [Java Thread]\n17. [Canvas]\n    - 17.1 [Create GUI Application]\n    - 17.2\
    \ [Create Canvas]\n    - 17.3 [Graphics Draw on Canvas]\n18. [Animation]\n19.\
    \ [Airplane Game]\n\n## Java JDK Installation\n\n`Java` is an object-oriented\
    \ programming language that produces software for multiple platforms. When a programmer\
    \ writes a Java application, the compiled code (known as `bytecode`) runs on most\
    \ operating systems (OS), including Windows, Linux and Mac OS.\n\n`JDK`(Java Development\
    \ Kit): is a software development environment that offers a collection of tools\
    \ and libraries necessary for developing Java applications.\n\n### 1. Download\
    \ the JDK (Java development kit)\n\n[https://java.com/en/download/](https://java.com/en/download/)\n\
    or [http://en.verejava.com/download.jsp?id=1](http://en.verejava.com/download.jsp?id=1)\n\
    \nThere are many JDK versions. We use `jdk-8u91-windows-x64.zip` as an example.\n\
    Open the link in Google Chrome Browser: [http://en.verejava.com/download.jsp?id=1](http://en.verejava.com/download.jsp?id=1)\n\
    \n![](Image00001.jpg)\n\n### 2. Install JDK (Java development kit)\n\nUnzip `jdk-6u45-windows-i586.zip`\
    \ to `jdk-6u45-windows-i586.exe`.\n\n![](Image00002.jpg)\n\nDouble click `jdk-6u45-windows-i586.exe`\
    \ start to install.\n\n![](Image00003.jpg)\n\nClick Next Button\n`C:\\Program\
    \ Files\\Java\\jdk1.8.0_91\\` is the path of installation.\n![](Image00004.jpg)\n\
    \nClick Next Button\nSuccessfully Installed\n![](Image00005.jpg)\n\nClick Close\
    \ Button\nThe structure of directory after JDK installation\n![](Image00006.jpg)\n\
    \n## Set Java Environment Variables\n\nEnvironment variables: are global system\
    \ variables accessible by all the processes/users running under the Operating\
    \ System (OS), such as Windows, macOS and Linux.\n\nfor examples:\n\n### 1. Set\
    \ Environment variables under Windows(OS)\n\nRight click: Computer -> Properties\n\
    ![](Image00007.jpg)\n\nClick: Advanced System Settings\n![](Image0008.jpg)\n\n\
    Click: Advanced -> Environment Variables\n![](Image0009.jpg)\n\nClick the New\
    \ Button to create 3 Environment Variables\n![](Image0010.jpg)\n\n1. `JAVA_HOME`\
    \ is an Environment Variable set to the location of the Java directory on your\
    \ computer.\n`JAVA_HOME=C:\\Program Files\\Java\\jdk1.8.0_91\\`\n![](Image00011.jpg)\n\
    \n2. `CLASSPATH`: is the path where to find the java when java application executes.\n\
    `CLASSPATH=%JAVA_HOME%\\lib\\dt.jar;%JAVA_HOME%\\lib\\tools.jar;`\n![](Image00012.jpg)\n\
    ![](Image00013.jpg)\n\n3. `PATH` : is used define where the system can find the\
    \ executables(`.exe`) files and classpath is used to specify the location.\n`PATH=%JAVA_HOME%\\\
    bin`\n![](Image00014.jpg)\n\n`javac`: compiles java code into bytecode class files.\n\
    `java`: run java bytecode class files.\n![](Image00015.jpg)\n\nThe 3 Environment\
    \ Variable is completed\n![](Image0016.jpg)\n\nClick Ok Button\nThe following\
    \ figure indicates that the environment variables are successfully installed\n\
    Click Window Icon and then input `cmd` click `cmd.exe` to open command window\n\
    Input command: `java -version`\n![](Image00017.jpg)\n\n## The First Java Program\n\
    \n### 1. Install Java Development tool\n\nThere are many tools to develop java\
    \ like:\n- Text Editor: Notepad, Notepad++ etc.\n- IDE: NetBeans, IDEA, Eclipse\
    \ etc.\n\nIf you are a beginner We would suggest using a Notepad/Notepad++ rather\
    \ than an IDE.\nthe right time I feel to move on to using the IDEs is when you\
    \ have learned sufficient knowledge and experience in Java.\n\nDownload Nodepad++.zip\n\
    [http://en.verejava.com/download.jsp?id=1](http://en.verejava.com/download.jsp?id=1)\n"
