    Java JDK Installation


    Java: is an object-oriented programming language that produces software for multiple
    platforms. When a programmer writes a Java application, the compiled code (known
    as bytecode) runs on most operating systems (OS), including Windows, Linux and
    Mac OS.


    JDK(Java Development Kit ): is a software development environment that offers
    a collection of tools and libraries necessary for developing Java applications.


    1\. Download the JDK ( Java development kit )


        [https://java.com/en/download/](https://java.com/en/download/)


        or


        [http://en.verejava.com/download.jsp?id=1](http://en.verejava.com/download.jsp?id=1)


    There are many JDK versions. We use jdk-8u91-windows-x64.zip as an example.


    Open the link in Google Chrome Browser: [http://en.verejava.com/download.jsp?id=1](http://en.verejava.com/download.jsp?id=1)


    ![](Image00001.jpg)


    2\. Install JDK ( Java development kit )


    Unzip jdk-6u45-windows-i586.zip to jdk-6u45-windows-i586.exe


    ![](Image00002.jpg)


    Double click jdk-6u45-windows-i586.exe start to install


    ![](Image00003.jpg)


    Click Next Button


    C:\Program Files\Java\jdk1.8.0_91\: is the path of installation


    ![](Image00004.jpg)


    Click Next Button


    Successfully Installed


    ![](Image00005.jpg)


    Click Close Button


    The structure of directory after JDK installation


    ![](Image00006.jpg)


    Set Java Environment Variables


    Environment variables: are global system variables accessible by all the processes/users
    running under the Operating System (OS), such as Windows, macOS and Linux.


    for examples:


    1\. Set Environment variables under Windows(OS)


        Right click: Computer -> Properties


        ![](Image00007.jpg)


    Click: Advanced System Settings


      ![](Image00008.jpg)


    Click: Advanced -> Environment Variables


    ![](Image00009.jpg)


    Click the New Button to create 3 Environment Variables


    ![](Image00010.jpg)


    1\. JAVA_HOME is an Environment Variable set to the location of the Java directory
    on your computer.


    JAVA_HOME= C:\Program Files\Java\jdk1.8.0_91\


    ![](Image00011.jpg)


    2\. CLASSPATH: is the path where to find the java class when java application
    executes.


    CLASSPATH= %JAVA_HOME%\lib\dt.jar;%JAVA_HOME%\lib\tools.jar;.


    ![](Image00012.jpg)


    ![](Image00013.jpg)


    3\. PATH : is used define where the system can find the executables(.exe) files
    and classpath is used to specify the location.


    PATH= %JAVA_HOME%\bin


    ![](Image00014.jpg)


