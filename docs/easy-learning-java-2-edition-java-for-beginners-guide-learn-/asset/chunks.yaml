    \ i++) {\n            Object obj = list.get(i);\n            System.out.println(obj);\
    \ // toString() will be invoked\n        }\n    }\n}\n```\n\n**Result:**\n```\n\
    name = David , age = 20\nname = Joseph , age = 30\nname = Grace , age = 40\n```\n\
    \n# LinkedList\n\n`LinkedList` is a collection which can contain many objects\
    \ of the same type, just like the `ArrayList`. The `LinkedList` class has all\
    \ of the same methods as the `ArrayList` class because they both implement the\
    \ `List` interface.\n\n![](Image00104.gif)\n\nThe difference is `ArrayList` class\
    \ has a regular array inside it. The `LinkedList` has a link to the first container\
    \ and each container has a link to the next and has a link to the `prev` in the\
    \ list.\n\n`ArrayList` has an array inside for storage.\n![](Image00105.gif)\n\
    \n`LinkedList` has a linked list for storage.\n![](Image00106.gif)\n\nIf you want\
    \ to access random items frequently, it is best to use `ArrayList`. If you frequently\
    \ need to add and remove items, it is best to use `LinkedList`.\n\n### 1. `addFirst(Object\
    \ o)` and `addLast(Object o)`\nAdd an item to the beginning or the end of the\
    \ list.\n\n```java\npublic static void main(String[] args) {\n    LinkedList list\
    \ = new LinkedList();\n    list.add(\"David\");\n    list.add(\"Joseph\");\n \
    \   list.addFirst(\"Grace\");\n    list.addLast(\"Renia\");\n    for (int i =\
    \ 0; i < list.size(); i++) {\n        System.out.println(list.get(i));\n    }\n\
    }\n```\n\n**Result:**\n```\nGrace\nDavid\nJoseph\nRenia\n```\n\n### 2. `getFirst()`\
    \ and `getLast()`\nGet the item at the beginning or end of the list.\n\n```java\n\
    public static void main(String[] args) {\n    LinkedList list = new LinkedList();\n\
    \    list.add(\"Grace\");\n    list.add(\"Joseph\");\n    System.out.println(\"\
    First: \" + list.getFirst());\n    System.out.println(\"Last: \" + list.getLast());\n\
    }\n```\n\n**Result:**\n```\nFirst: Grace\nLast: Joseph\n```\n\n### 3. `removeFirst()`\
    \ and `removeLast()`\nRemove an item from the beginning or the end of the list.\n\
    \n```java\npublic static void main(String[] args) {\n    LinkedList list = new\
    \ LinkedList();\n    list.add(\"Grace\");\n    list.add(\"David\");\n    list.add(\"\
    Joseph\");\n    list.removeFirst();\n    list.removeLast();\n    for (int i =\
    \ 0; i < list.size(); i++) {\n        System.out.println(list.get(i));\n    }\n\
    }\n```\n\n**Result:**\n```\nDavid\n```\n\n# Iterator\n\n`Iterator` is an interface\
    \ which belongs to the collection framework. It allows us to traverse the collection\
    \ and access the data elements.\n\n![](Image00107.gif)\n\n### 1. `hasNext()`\n\
    Returns true if Iterator has more elements to iterate.\n\n### 2. `next()`\nReturns\
    \ the next element in the collection until `hasNext()` returns true.\n\n```java\n\
    public static void main(String[] args) {\n    List stationList = new ArrayList();\n\
    \    stationList.add(\"Berkeley University\");\n    stationList.add(\"Market Street\"\
    );\n    stationList.add(\"Polo Alto\");\n    stationList.add(\"Cuptino\");\n \
    \   Iterator iter = stationList.iterator();\n    while (iter.hasNext()) {\n  \
    \      String station = iter.next().toString();\n        System.out.print(station\
    \ + \" -> \");\n    }\n}\n```\n"
