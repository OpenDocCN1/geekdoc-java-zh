    ![](img/Image00169.jpg)


    # Java 易学精通（第 2 版）


    ![](img/Image00000.jpg)


    **杨洋**


    简单是智慧的开始。本书简要解释了相关概念并生动地培养编程兴趣，帮助你快速学习 Java 面对象编程。


    [`en.verejava.com`](http://en.verejava.com)


    版权 © 2020 杨洋

    保留所有权利

    ISBN : 9798634831589


    ## 目录


    1. Java JDK 安装：是一个软件开发环境，提供了开发 Java 应用程序所需的整套工具和库。


    ### 1. 下载 JDK (Java 开发工具包)


    [`java.com/en/download/`](https://java.com/en/download/)

    或 [`en.verejava.com/download.jsp?id=1`](http://en.verejava.com/download.jsp?id=1)


    JDK 有很多版本。我们使用 `jdk-8u91-windows-x64.zip` 作为示例。

    在 Google Chrome 浏览器中打开链接：[`en.verejava.com/download.jsp?id=1`](http://en.verejava.com/download.jsp?id=1)


    ![](img/Image00001.jpg)


    ### 2. 安装 JDK (Java 开发工具包)


    解压 `jdk-6u45-windows-i586.zip` 到 `jdk-6u45-windows-i586.exe`。


    ![](img/Image00002.jpg)


    双击 `jdk-6u45-windows-i586.exe` 开始安装。


    ![](img/Image00003.jpg)


    点击 Next（下一步）按钮

    `C:\Program Files\Java\jdk1.8.0_91\` 是安装路径。

    ![](img/Image00004.jpg)


    点击 Next（下一步）按钮

    安装成功

    ![](img/Image00005.jpg)


    点击 Close（关闭）按钮

    JDK 安装后的目录结构

    ![](img/Image00006.jpg)


    ## 设置 Java 环境变量


    环境变量：是在在操作系统（OS，如 Windows、macOS 和 Linux）下运行的所有进程/用户可访问的全局系统变量。


    例如：


    ### 1. 在 Windows 下设置环境变量


    右键点击：计算机 -> 属性

    ![](img/Image00007.jpg)


    点击：高级系统设置

    ![](img/Image0008.jpg)


    点击：高级 -> 环境变量

    ![](img/Image0009.jpg)


    点击新建按钮创建三个环境变量

    ![](img/Image0010.jpg)


    1. `JAVA_HOME` 是一个环境变量，被设置为你电脑上 Java 目录的位置。

    `JAVA_HOME=C:\Program Files\Java\jdk1.8.0_91\`

    ![](img/Image00011.jpg)


    2. `CLASSP`: 是 Java 应用程序执行时查找文件的路径。

    `CLASSP=%JAVA_HOME%\lib\dt.jar;%JAVA_HOME%\lib\tools.jar;`

    ![](img/Image00012.jpg)

    ![](img/Image00013.jpg)


    3. `PATH`：用于定义系统查找可执行文件（exe）的位置，classpath 用于指定位置。

    `PATH=%JAVA_HOME%\bin`

    ![](img/Image00014.jpg)


    `javac`: 将 Java 代码编译为字节码类文件。

    `java`:  Java 字节码类文件。

    ![](img/Image00015.jpg)


    三个环境变量设置完成

    ![](img/Image0016.jpg)


    点击 Ok（确定）按钮

    下图所示环境变量安装成功

    点击 Windows 图标，输入 `cmd`，点击 `cmd.exe` 打开命令行窗口

    输入命令：`java -version`

    ![](img/Image00017.jpg)


    ## 第一个 Java 程序


    ### 1. 安装 Java 开发工具


    有很多用于开发 Java 的工具：

    - 文本编辑器：Notepad, Notepad++ 等。

    - IDE：NetBeans, IDEA, Eclipse 等。


    如果你是初学者，我们建议使用 Notepad/Notepad++ 而不是 IDE。

    我觉得当你掌握了足够的 Java 知识和经验时，就是转向使用 IDE 的正确时。


    下载 Notepad++.zip

    [`en.verejava.com/download.jsp?id=1`](http://en.verejava.com/download.jsp?id=1)


    '
- fmt: "\nClick Ok Button\n\nNotepad++ installation successful\n\n![](Image00020.jpg)\n\
    \n## 2. The first java program steps:\n\n1. Create a java file: `Hello.java`\n\
    \n```java\npublic class Hello {\n    public static void main ( String [] args\
    \ ) {\n        System . out . println ( \"I love Java\" );\n    }\n}\n```\n\n\
    2. Open a command prompt window and go to the directory `C:\\java` where you saved\
    \ the java program (`Hello.java`).\n\n3. Type `javac Hello.java` and press enter\
    \ to compile `Hello.java` to `Hello.class`.\n\n4. Type `java Hello` to run your\
    \ program.\n\nYou will be able to see the result: I love Java printed on the window.\n\
    \n![](Image00021.gif)\n\n## 3. Create and run the first java program by Nodepad++\n\
    \n1. Create a java file: `Hello.java` by Nodepad++\n\n![](Image00022.jpg)\n\n\
    Click Save Button\n\n2. Enter the code in `Hello.java` and then save again\n\n\
    `System.out.println()`: Print message to the console and then wrap a new line\n\
    \n```java\npublic class Hello {\n    public static void main ( String [] args\
    \ ) {\n        System . out . println ( \"I love Java\" );\n    }\n}\n```\n\n\
    ![](Image00023.jpg)\n\n3. Open a command prompt window and go to the directory\
    \ `C:\\java` where you saved the java program (`Hello.java`).\n\nType `javac Hello.java`\
    \ and press enter to compile `Hello.java` to `Hello.class`.\n\n![](Image00024.jpg)\n\
    \n4. Type `java Hello` to run your program.\n\nYou will be able to see the result:\
    \ I love Java printed on the window.\n\n![](Image00025.jpg)\n\nThe java program\
    \ is executed from top to bottom and from left to right.\n\n## 4. Explain in detail\
    \ Hello.java\n\n```java\npublic class Hello {\n    public static void main ( String\
    \ [] args ) {\n        System . out . println ( \"I love Java\" );\n    }\n}\n\
    ```\n\nThe class definition block for the java application, every application\
    \ begins with a class definition.\n\n`Hello` is class name that the first letter\
    \ need be capitalized, and the code for each class appears between the opening\
    \ and closing curly braces `{ }`.\n\n```java\npublic class Hello {}\n```\n\nIn\
    \ the Java programming, every application must contain a `main` method.\n\nThe\
    \ `main` method is the entry point for your application.\n\nThe `main` method\
    \ accepts a single argument named: `args` that an array of `String`.\n\nThe code\
    \ for each method appears between the opening and closing curly braces `{ }`.\n\
    \n```java\n    public static void main ( String [] args ) {\n    }\n```\n\nUses\
    \ the `System` class from the core library to print the \"I love Java\" message\
    \ to standard output.\n\nCore library (also known as the \"Application Programming\
    \ Interface\", or \"API\")\n\n```java\n        System . out . println ( \"I love\
    \ Java\" );\n```\n\nJust remember these concepts first and will discuss them in\
    \ detail later.\n\n### Variable\n\n**Variable**: a memory area allocated by the\
    \ system to store data.\n\nExample: Put \"Apple\" to basket\n`basket` is variable,\
    \ \"Apple\" is a value assigned to `basket`.\n\n![](Image00026.jpg)\n\n1. Create\
    \ a file in Nodepad++ : `Variable.java` save to directory `c:\\java`\n\n`String`:\
    \ is a sequence of characters are surrounded by double quotes `\" \"`\nlike: \"\
    Apple\", \"12345\", \"_name\", \"Keep going\" etc.\n\n```java\npublic class Variable\
    \ {\n    public static void main(String[] args) {\n        String basket = \"\
    Apple\" ;\n        System . out .println(basket);\n    }\n}\n```\n\nOpen `cmd`\
    \ Window type `javac Variable.java` and then type `java Variable`.\n\nYou will\
    \ be able to see the result: Apple printed on the window.\n\n![](Image00027.jpg)\n\
    \n2. The value of the variable can be changed.\n\nReplace the value of variable\
    \ `basket` from \"Apple\" to \"Orange\".\n\n![](Image00028.jpg)\n\nTwo forward\
    \ slashes `//`: Single-line comments can be used to explain Java code, Any text\
    \ between `//` and the end of the line is ignored by Java (will not be executed).\n\
    \n```java\npublic class Variable {\n    public static void main ( String [] args\
    \ ) {\n        String basket = \"Apple\" ; // Put \"Apple\" to basket\n      \
    \  System . out . println ( basket );\n        basket = \"Orange\" ; // Put \"\
    Orange\" to replace \"Apple\"\n        System . out . println ( basket );\n  \
    \  }\n}\n```\n\nOpen `cmd` Window type `javac Variable.java` and then type `java\
    \ Variable`.\n\n![](Image00029.jpg)\n\n3. Variable naming rules:\n1. consisting\
    \ of characters, underscores, `$`.\n2. The first letter must be a character, `$`,\
    \ not a number.\n3. The first letter needs to be lowercase.\n4. Cannot use java\
    \ keyword (reserved word) as a variable name.\n\nExample:\nCorrect naming: `name`,\
    \ `age`, `_salary`, etc.\nIncorrect naming: `1234`, `2_name`, `a@mail`, `public`,\
    \ etc.\n\nCreate a file in Notepad++ : `Variable.java` save to directory `c:\\\
    java`\n\n```java\npublic class Variable {\n    public static void main ( String\
    \ [] args ) {\n        String cup = \"mineral water\" ;\n        System . out\
    \ . println ( cup );\n        String _bottle = \"juice\" ;\n        System . out\
    \ . println ( _bottle );\n        String peopleColor = \"white\" ;\n        System\
    \ . out . println ( peopleColor );\n    }\n}\n```\n\nOpen `cmd` Window type `javac\
    \ Variable.java` and then type `java Variable`.\n\n![](Image0030.jpg)\n\n### Basic\
    \ Data Types\n\nJava has 8 basic types (Also called primitive types): `byte`,\
    \ `short`, `int`, `long`, `float`, `double`, `char`, `boolean`.\n\nThe parameters\
    \ of each primitive types are as follows:\n\n| Category | Types | Sizes(bit) |\n\
    | :--- | :--- | :--- |\n| Integer | byte | 1 byte = 8 bits ($-2^7~2^7-1$ $(-128~127$))\
    \ |\n| | short | 2 bytes = 16 bits |\n| | int | 4 bytes = 32 bits |\n| | long\
    \ | 8 bytes = 64 bits |\n| Floating-Point | float | 4 bytes = 32 bits |\n| | double\
    \ | 8 bytes = 64 bits |\n| Character | char | 2 bytes = 16 bits |\n| Boolean |\
    \ boolean | 1 byte = 8 bits |\n\n1. Integer (`byte`, `short`, `int`, `long`).\n\
    \nCreate a file in Notepad++: `DataType.java`\n\n```java\npublic class DataType\
    \ {\n    public static void main ( String [] args ) {\n        byte a1 = 1 ;\n\
    \        short a2 = 10 ;\n        int a3 = 100 ;\n        long a4 = 1000 ;\n \
    \       System . out . println ( a1 );\n        System . out . println ( a2 );\n\
    \        System . out . println ( a3 );\n        System . out . println ( a4 );\n\
    \    }\n}\n```\n\nOpen `cmd` type `javac DataType.java` and then type `java DataType`.\n\
    \n![](Image0031.jpg)\n\n2. Floating-Point (`float`, `double`).\n\nDuring compilation,\
