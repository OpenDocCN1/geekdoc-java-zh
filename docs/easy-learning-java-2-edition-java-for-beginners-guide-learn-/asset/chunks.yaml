    \ `say()` 方法，而不是调用父类的 `say()` 方法。如果你想调用父类的 `say()` 方法，需要像这样调用 `super.say()`。\n\
    \n**创建一个文件：`TestSuper.java`**\n\n```java\nclass Person {\n    public void say()\
    \ {\n        System.out.println(\"Person speaking\");\n    }\n}\n\nclass AmericaStudent\
    \ extends Person {\n    public void say() {\n        super.say();\n        System.out.println(\"\
    Speak English\");\n    }\n}\n\npublic class TestSuper {\n    public static void\
    \ main(String[] args) {\n        AmericaStudent as = new AmericaStudent();\n \
    \       as.say();\n    }\n}\n```\n\nResult:\n```\nPerson speaking\nSpeak English\n\
    ```\n\n# 多态\n\n`多态`: 继承中的对象可以向上转型为父类，向下转型为子类。\n\n### 示例：\n1. 创建父类：`Person`，有一个方法：`say()`\n\
    2. 创建子类：`Student`，有一个相同的方法：`say()`\n向上转型为父类，子类的实例将调用子类的 `say()` 方法，而不是调用父类的 `say()`\
    \ 方法。`Student` 的 `say()` 将重写 `Person` 的 `say()`\n\n![](img/Image0073.gif)\n\n\
    #### 1. 创建一个文件：`TestPolymorphism.java`\n\n向上转型为父类，向下转型为子类\n子类的实例将调用子类的 `say()`\
    \ 方法，而不是调用父类的 `say()` 方法\n\n![](img/Image0074.gif)\n\n**创建一个文件：`TestPolymorphism.java`**\n\
    \n```java\nclass Person {\n    public void say() {\n        System.out.println(\"\
    Person speaking\");\n    }\n}\n\nclass Student extends Person {\n    public void\
    \ say() {\n        System.out.println(\"Student speaking\");\n    }\n\n    public\
    \ void study() {\n        System.out.println(\"Student studying\");\n    }\n}\n\
    \npublic class TestPolymorphism {\n    public static void main(String[] args)\
    \ {\n        // 向上转型为父类\n        Person p = new Student();\n        p.say();\n\
    \n        // 向下转型为子类\n        Student s = (Student) p;\n        s.say();\n   \
    \     s.study();\n    }\n}\n```\n\nResult:\n```\nStudent speaking\nStudent speaking\n\
    Student studying\n```\n\n# 对象一对一关系\n\n### 1. 示例：`Baby` 可以吃一个水果\n\n#### 分析：\n1.\
    \ 类：`Baby`, `Fruit`\n2. 关系：`Fruit` 一对一属于 `Baby`\n3. 属性：`Baby` 的属性 (`fruit`)\n\
    4. 方法：`Baby` 的方法 (`eat`)\n\n![](img/Image00075.gif)\n\n**创建一个文件：`TestObjectRelation.java`**\n\
    \n```java\nclass Fruit {\n    private String name;\n    public Fruit(String name)\
    \ {\n        this.name = name;\n    }\n    public String getName() {\n       \
    \ return this.name;\n    }\n}\n\nclass Baby {\n    private Fruit fruit; // Fruit\
    \ 一对一属于 Baby\n    public Fruit getFruit() {\n        return this.fruit;\n    }\n\
    \    public void eat(Fruit fruit) {\n        this.fruit = fruit;\n    }\n}\n\n\
    public class TestObjectRelation {\n    public static void main(String[] args)\
    \ {\n        Baby baby = new Baby();\n        Fruit apple = new Fruit(\"Red Apple\"\
    );\n        Fruit grape = new Fruit(\"Black Grape\");\n        baby.eat(apple);\n\
    \        System.out.println(\"Baby eat \" + baby.getFruit().getName());\n    \
    \    baby.eat(grape);\n        System.out.println(\"Baby eat \" + baby.getFruit().getName());\n\
    \    }\n}\n```\n\nResult:\n```\nBaby eat Red Apple\nBaby eat Black Grape\n```\n\
    \n# 抽象类\n\n`抽象类`: 是一个声明为抽象的类。抽象类不能实例化，但它的子类可以实例化。\n\n### 示例：`Father` 告诉他的儿子买一些水果\n\
    \n#### 分析：\n1. 抽象类：`Father`\n2. 实现类：`Son`\n3. 关系：`Son` 继承 `Dad`\n4. 方法：`buy()`\
    \ 父亲告诉儿子买水果，但父亲没有买\n\n![](img/Image00076.gif)\n\n一个抽象方法在声明时没有实现\n\n父亲告诉儿子买水果，但父亲没有买，\n\
    \n这意味着方法：`buy()` 没有实现\n\n"
- fmt: "\n## Abstract Classes\n\n```java\nabstract class Father {\n    public abstract\
    \ void buy(String fruit);\n}\n```\n\nThe son fulfills his father to buy fruit,\
    \ this means method `buy()` have an implementation.\n\n```java\nclass Son extends\
    \ Father {\n    public void buy(String fruit) {\n        System.out.println(\"\
    Dad, I bought some : \" + fruit);\n    }\n}\n```\n\n### 1. Create a file: `TestAbstract.java`\n\
    \n```java\nabstract class Father {\n    //father called his son to buy fruit,\
    \ but father not buy\n    public abstract void buy(String fruit);\n}\n\nclass\
    \ Son extends Father {\n    //The son fulfills the requirement of his father to\
    \ buy fruit\n    public void buy(String fruit) {\n        System.out.println(\"\
    Dad, I bought some : \" + fruit);\n    }\n}\n\npublic class TestAbstract {\n \
    \   public static void main(String[] args) {\n        Father f = new Son();\n\
    \        f.buy(\"Apples\");\n    }\n}\n```\n\n**Result:**\n```\nDad, I bought\
    \ some : Apples\n```\n\n### 2. Abstract classes can also have their own methods\
    \ of implementation\n\n**Example:**\n`Father` is working now, so told his son\
    \ to buy some fruit.\n\n**Analysis:**\n1. Method: `Father` have two method: `work()`\
    \ and `abstract buy()`\n\n**Create a file: `TestAbstract.java`**\n\n```java\n\
    abstract class Father {\n    public void work() {\n        System.out.println(\"\
    Father is working now.\");\n    }\n    public abstract void buy(String fruit);\n\
    }\n\nclass Son extends Father {\n    public void buy(String fruit) {\n       \
    \ System.out.println(\"Dad, I bought some : \" + fruit);\n    }\n}\n\npublic class\
    \ TestAbstract {\n    public static void main(String[] args) {\n        Father\
    \ f = new Son();\n        f.work();\n        f.buy(\"Apples\");\n    }\n}\n```\n\
    \n**Result:**\n```\nFather is working now.\nDad, I bought some : Apples\n```\n\
    \n---\n\n## Interface\n\n`interface`: is a different way to achieve abstraction\
    \ that is used to group related methods with empty body, the child class must\
    \ be implemented the interface and its empty method.\n\n**Example:**\nThe boss\
    \ hires employees to work.\n\n**Analysis:**\n1. `interface`: `Boss`\n2. Implementation\
    \ class: `Employee`\n3. Relationship: `Employee` implements `Boss`\n4. Method:\
    \ `work()` the boss hires employees to work, boss not to do this work.\n\n![](Image00077.jpg)\n\
    \nAn interface method is declared without an implementation.\nboss hires employees\
    \ to work, boss not to do this work.\nthis means method: `work()` without an implementation.\n\
    \n```java\ninterface Boss {\n    public void work();\n}\n```\n\nThe employees\
    \ to do work, this means method: `work()` have an implementation.\n\n```java\n\
    class Employee implements Boss {\n    public void work() {\n        System.out.println(\"\
    Employee start to work\");\n    }\n}\n```\n\n### 1. Create a file: `TestInterface.java`\n\
    \n```java\ninterface Boss {\n    //boss hires employees to work, boss not to do\
    \ this work.\n    public void work();\n}\n\nclass Employee implements Boss {\n\
    \    //The employees to do work\n    public void work() {\n        System.out.println(\"\
    Employee start to work\");\n    }\n}\n\npublic class TestInterface {\n    public\
    \ static void main(String[] args) {\n        Boss b = new Employee();\n      \
    \  b.work();\n    }\n}\n```\n\n**Result:**\n```\nEmployee start to work\n```\n\
    \n**Notes:**\n1. The implementation of the method is not allowed in the interface.\n\
    2. The methods are all public by default in the interface.\n3. The attributes\
    \ are public static in the interface.\n4. The child class must implement all the\
    \ declaration methods in the interface.\n\n### 2. Child class can only inherit\
    \ one class, but can implement multiple interfaces.\n\n**Example:**\nThe boss\
    \ hires employees to work, and then managers let employees learn business.\n\n\
    **Analysis:**\n1. `interface`: `Boss`, `Manager`\n2. Implementation class: `Employee`\n\
    3. Relationship: `Employee` implements `Boss`, `Manager`\n4. Method: `work()`\
    \ the boss hires employees to work, boss not to do this work. `learn()` the manager\
    \ let employees to learn, manager not to learn.\n\n![](Image00078.jpg)\n\n**Create\
    \ a file: `TestInterface.java`**\n\n```java\ninterface Boss {\n    //boss hires\
    \ employees to work, boss not to do this work.\n    public void work();\n}\n\n\
    interface Manager {\n    //the manager let employees to learn, manager not to\
    \ learn.\n    public void learn();\n}\n\nclass Employee implements Boss, Manager\
    \ {\n    //The employees to do work\n    public void work() {\n        System.out.println(\"\
    Employee start to work\");\n    }\n    //The employees to learn\n    public void\
    \ learn() {\n        System.out.println(\"Employee start to business\");\n   \
    \ }\n}\n\npublic class TestInterface {\n    public static void main(String[] args)\
    \ {\n        Boss b = new Employee();\n        b.work();\n        Manager m =\
    \ new Employee();\n        m.learn();\n    }\n}\n```\n\n**Result:**\n```\nEmployee\
    \ start to work\nEmployee start to business\n```\n\n---\n\n## Enum\n\n`enum`:\
    \ is a special data type that enables a variable to be a set of constants. The\
    \ variable must be equal to one of the values that have been predefined.\n\n**Example:**\n\
    Draw circles of different color.\n\n![](Image00079.gif)\n\n**Analysis:**\n1. `enum`:\
    \ `Color (RED, BLUE)`\n2. `class`: `Circle`\n3. Method: `draw()` circles of different\
    \ color.\n\nDefine `enum` type:\n```java\nenum Color {\n    RED, GREEN, BLUE\n\
    }\n```\n![](Image00080.gif)\n\n### 1. Create a file: `TestEnum.java`\n\n```java\n\
    \n//Define enum types\nenum Color {\n    RED, GREEN, BLUE\n}\n\nclass Circle {\n\
    \    //draw circles of different color\n    public void draw(Color color) {\n\
    \        String colorName = \"\";\n        if (color == Color.RED) {\n       \
    \     colorName = \"Red\";\n        } else if (color == Color.GREEN) {\n     \
    \       colorName = \"Green\";\n        } else if (color == Color.BLUE) {\n  \
    \          colorName = \"Blue\";\n        }\n        System.out.println(\"draw\
    \ \" + colorName + \" circle\");\n    }\n}\n\npublic class TestEnum {\n    public\
    \ static void main(String[] args) {\n        Circle circle = new Circle();\n \
    \       circle.draw(Color.RED);\n        circle.draw(Color.GREEN);\n        circle.draw(Color.BLUE);\n\
    \    }\n}\n```\n\n**Result:**\n```\ndraw Red circle\ndraw Green circle\ndraw Blue\
    \ circle\n```\n\n---\n\n## Internal Class\n\n`Inner class`: are a security mechanism.\
    \ if we have the class as a member of other class, then the inner class can be\
    \ made private.\n\n**Example:**\nMother pregnant, Baby eat food from the mother.\n\
    \n**Analysis:**\n1. `class`: `Mother`, `Baby`\n2. Relationship: `Baby` in `Mother`\n\
    3. Method: `Mother eat(food)`, `Baby eat()` from `Mother`.\n\n![](Image00081.gif)\n\
    \nFirst define the `Mother` class, then define the `Baby` class inside the `Mother`\
    \ class.\n\n```java\nclass Mother {\n    public void eat(String food) {\n    \
    \    Baby baby = new Baby();\n        baby.eat();\n    }\n    class Baby {\n \
    \       public void eat() {\n        }\n    }\n}\n```\n\n### 1. Create a file:\
    \ `TestInnerClass.java`\n\n```java\nclass Mother {\n    private String food;\n\
    \    public void eat(String food) {\n        this.food = food;\n        System.out.println(\"\
    Mother eat \" + food);\n        //Baby take nutrition from food\n        Baby\
    \ baby = new Baby();\n        baby.eat();\n    }\n    //The Baby is the inner\
    \ class of the mother\n    private class Baby {\n        public void eat() {\n\
    \            System.out.println(\"Baby absorb nutrients from the mother's \" +\
    \ food);\n        }\n    }\n}\n\npublic class TestInnerClass {\n    public static\
    \ void main(String[] args) {\n        Mother mother = new Mother();\n        mother.eat(\"\
    Apple\");\n    }\n}\n```\n\n**Result:**\n```\nMother eat Apple\nBaby absorb nutrients\
    \ from the mother's Apple\n```\n\n---\n\n## IDE Eclipse Installation\n\nNow it’s\
    \ the right time to move on to using the IDE(`Eclipse`), because you have learned\
    \ basic knowledge and experience in Java.\n\n`Eclipse`: is famous for Java Integrated\
    \ Development Environment (IDE) that is popular for Java application development\
    \ and Android apps. Eclipse is cross-platform and runs under Windows, Linux and\
    \ Mac OS.\n\n1. Download the Eclipse development tools: `eclipse-jee-mars-2-win32-x86_64.zip`.\n\
    \n[https://www.eclipse.org/downloads/](https://www.eclipse.org/downloads/)\n\n\
    ![](Image00082.jpg)\n\n2. Double click `eclipse.exe` to Open.\n\n![](Image00083.jpg)\n\
    \n3. Double click `eclipse.exe` to Open.\n\n![](Image00084.jpg)\n"
