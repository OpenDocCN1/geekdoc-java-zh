    \n- `JFrame`: class is a type of container can create a window.\n- `JFrame.setSize(int\
    \ width, int height)`: set the size of the frame.\n- `JFrame.setVisible(true)`:\
    \ set visible of the frame to open a window.\n- `import javax.swing.*`: provides\
    \ classes for java swing GUI API.\n\n```java\nimport javax.swing.*;\npublic class\
    \ AirplaneGame {\n    public static void main(String[] args) {\n        JFrame\
