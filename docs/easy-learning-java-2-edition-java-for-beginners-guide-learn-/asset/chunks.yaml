  trans: "\n\n```java\nimport java.awt.Graphics;\nimport java.awt.image.BufferedImage;\n\
    \npublic abstract class Sprite {\n    protected int x;\n    protected int y;\n\
    \    protected int width;\n    protected int height;\n    protected BufferedImage\
    \ image;\n    protected boolean visible;\n\n    public Sprite(int x, int y, String\
    \ imagePath) {\n        this.x = x;\n        this.y = y;\n        this.image =\
    \ ImageUtil.loadImage(imagePath);\n        this.width = this.image.getWidth();\n\
    \        this.height = this.image.getHeight();\n    }\n\n    public void draw(Graphics\
    \ g) {\n        g.drawImage(image, this.x, this.y, null);\n    }\n\n    public\
    \ void move(int distanceX, int distanceY) {\n        this.x = this.x + distanceX;\n\
    \        this.y = this.y + distanceY;\n    }\n\n    public boolean collideWith(Sprite\
    \ sprite) {\n        int centerX = this.x + this.getWidth() / 2;\n        int\
    \ centerY = this.y + this.getHeight() / 2;\n        int spriteCenterX = sprite.getX()\
    \ + sprite.getWidth() / 2;\n        int spriteCenterY = sprite.getY() + sprite.getHeight()\
    \ / 2;\n        if (Math.abs(centerX - spriteCenterX) < (this.width / 2 + sprite.getWidth()\
    \ / 2)\n                && Math.abs(centerY - spriteCenterY) < (this.height /\
    \ 2 + sprite.getHeight() / 2))\n            return true;\n        else\n     \
    \       return false;\n    }\n\n    public int getX() {\n        return x;\n \
    \   }\n\n    public void setX(int x) {\n        this.x = x;\n    }\n\n    public\
    \ int getY() {\n        return y;\n    }\n\n    public void setY(int y) {\n  \
    \      this.y = y;\n    }\n\n    public boolean isVisible() {\n        return\
    \ visible;\n    }\n\n    public void setVisible(boolean visible) {\n        this.visible\
    \ = visible;\n    }\n\n    public int getWidth() {\n        return width;\n  \
    \  }\n\n    public int getHeight() {\n        return height;\n    }\n}\n```\n\n\
    创建 3 个子类：`BluePlane.java`、`EnemyPlane.java`、`Bullet.java`\n\n![](img/Image0016.jpg)\n\
    \n### BluePlane.java\n```java\npublic class BluePlane extends Sprite {\n    public\
    \ BluePlane(int x, int y, String imagePath) {\n        super(x, y, imagePath);\n\
    \    }\n}\n```\n\n### EnemyPlane.java\n```java\npublic class EnemyPlane extends\
    \ Sprite {\n    public EnemyPlane(int x, int y, String imagePath) {\n        super(x,\
    \ y, imagePath);\n    }\n}\n```\n\n### Bullet.java\n```java\npublic class Bullet\
    \ extends Sprite {\n    public Bullet(int x, int y, String imagePath) {\n    \
    \    super(x, y, imagePath);\n    }\n\n    public void move(int distanceX, int\
    \ distanceY) {\n        this.x = this.x + distanceX;\n        this.y = this.y\
    \ + distanceY;\n        if (this.y + this.height <= 0) {\n            this.setVisible(false);\n\
    \        }\n    }\n}\n```\n\n创建一个类：`Canvas.java`\n\n![](img/Image0164.jpg)\n\n\
    ```java\nimport java.awt.*;\nimport java.awt.event.*;\nimport java.awt.image.BufferedImage;\n\
    import java.io.*;\nimport java.util.*;\nimport javax.imageio.ImageIO;\nimport\
    \ javax.swing.*;\n\npublic class Canvas extends JPanel {\n    private boolean\
    \ isRun = true;\n    private BluePlane bluePlane;\n    private Bullet bullet;\n\
    \    private EnemyPlane enemyPlane;\n    private CanvasThread canvasThread;\n\
    \    private int canvasWidth = 300;\n    private int canvasHeight = 300;\n   \
    \ private Random rn = new Random();\n\n    public Canvas() {\n        this.setLayout(null);\n\
    \        this.setBackground(Color.WHITE);\n        this.requestFocus();\n    \
    \    bluePlane = new BluePlane(100, 200, \"images/blue_plane.png\");\n       \
    \ bullet = new Bullet(100, -100, \"images/blue_bullet.png\");\n        bullet.setVisible(false);\n\
    \        enemyPlane = new EnemyPlane(100, -100, \"images/enemy.png\");\n     \
    \   enemyPlane.setVisible(false);\n        canvasThread = new CanvasThread();\n\
    \        canvasThread.start();\n        this.addKeyListener(new KeyAdapter() {\n\
    \            public void keyPressed(KeyEvent e) {\n                int keyCode\
    \ = e.getKeyCode();\n                if (keyCode == KeyEvent.UP) {\n         \
    \           bluePlane.move(0, -10);\n                } else if (keyCode == KeyEvent.DOWN)\
    \ {\n                    bluePlane.move(0, 10);\n                } else if (keyCode\
    \ == KeyEvent.RIGHT) {\n                    bluePlane.move(10, 0);\n         \
    \       } else if (keyCode == KeyEvent.LEFT) {\n                    bluePlane.move(-10,\
    \ 0);\n                } else if (keyCode == KeyEvent.ENTER) {\n             \
    \       if (!bullet.isVisible()) {\n                        int x = bluePlane.getX()\
    \ + bluePlane.getWidth() / 2 - bullet.getWidth() / 2;\n                      \
    \  int y = bluePlane.getY() - bullet.getWidth() / 2;\n                       \
    \ bullet.setX(x);\n                        bullet.setY(y);\n                 \
    \       bullet.setVisible(true);\n                    }\n                }\n \
    \           }\n        });\n    }\n\n    protected void paintComponent(Graphics\
    \ g) {\n        super.paintComponent(g);\n        bluePlane.draw(g);\n       \
    \ bullet.draw(g);\n        enemyPlane.draw(g);\n    }\n\n    public void bulletMove()\
    \ {\n        if (bullet.isVisible()) {\n            bullet.move(0, -10);\n   \
    \     }\n    }\n\n    public void enemyPlaneMove() {\n        if (enemyPlane.getY()\
    \ >= canvasHeight) {\n            enemyPlane.setVisible(false);\n        }\n \
    \       if (!enemyPlane.isVisible()) {\n            int x = rn.nextInt(canvasWidth\
    \ - enemyPlane.getWidth());\n            int y = 0;\n            enemyPlane.setX(x);\n\
    \            enemyPlane.setY(y);\n            enemyPlane.setVisible(true);\n \
    \       }\n    }\n\n    public void collide() {\n        if (bullet.isVisible()\
    \ && bullet.collideWith(enemyPlane)) {\n            bullet.setVisible(false);\n\
    \            enemyPlane.setVisible(false);\n        }\n    }\n\n    class CanvasThread\
    \ extends Thread {\n        @Override\n        public void run() {\n         \
    \   while (isRun) {\n                try {\n                    Thread.sleep(200);\
    \ // 睡眠 200 毫秒重绘\n                    Canvas.this.repaint();\n               \
    \     bulletMove();\n                    enemyPlaneMove();\n                 \
    \   collide();\n                } catch (InterruptedException e) {\n         \
    \           e.printStackTrace();\n                }\n            }\n        }\n\
    \    }\n}\n```\n\n![](img/Image0165.jpg)\n\n```java\nimport java.awt.*;\nimport\
    \ javax.swing.*;\n\npublic class AirplaneGame {\n    private static Canvas canvas;\n\
    \n    public static void main(String[] args) {\n        JFrame frame = new JFrame(\"\
    GUI 应用\");\n        canvas = new Canvas();\n        frame.add(canvas, BorderLayout.CENTER);\
    \ // 将 canvas 添加到 JFrame 中心\n        frame.setSize(300, 300);\n        frame.setVisible(true);\n\
    \        canvas.requestFocus();\n    }\n}\n```\n\n![](img/Image0166.jpg)\n\n右击\
