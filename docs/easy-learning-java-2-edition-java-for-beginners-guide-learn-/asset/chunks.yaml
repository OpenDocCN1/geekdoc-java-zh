    \ 来设置和获取 `age` 的值。\n\n![](img/Image00063.jpg)\n\n字体 注意：\n1. 类中定义的变量被称为成员变量。\n\
    2. 在方法中定义的变量被称为局部变量。\n\n为了区分成员变量和局部变量，在成员变量前添加：\n`this`：指代方法中的当前对象。\n\n![](img/Image00064.gif)\n\
    \n## 1. 创建文件：`TestEncapsulation.java`\n\n```java\nclass Person {\n    // 将 name\
