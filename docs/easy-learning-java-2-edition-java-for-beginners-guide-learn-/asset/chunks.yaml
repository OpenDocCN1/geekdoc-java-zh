    \ g) {\n        super.paintComponent(g);\n        // put our graphics here\n \
    \   }\n}\n```\n\n### 1. Draw a line on Canvas\n\nJava uses a coordinate system\
    \ where the origin is in the upper-left corner. Graphical coordinates are measured\
    \ in pixels; each pixel corresponds to a dot on the screen.\n\n![](Image00129.jpg)\n\
    \n`g.drawLine(x1, y1, x2, y2)`: takes four integers that represent the start `(x1,\
    \ y1)` and end `(x2, y2)` coordinate of the line.\n\n```java\nimport javax.swing.*;\n\
    import java.awt.*;\nclass Canvas extends JPanel {\n    public Canvas() {\n   \
    \     this.setLayout(null);\n        this.setBackground(Color.WHITE); // set the\
    \ background color: white\n    }\n    protected void paintComponent(Graphics g)\
    \ {\n        super.paintComponent(g);\n        g.drawLine(50, 50, 200, 50); //\
