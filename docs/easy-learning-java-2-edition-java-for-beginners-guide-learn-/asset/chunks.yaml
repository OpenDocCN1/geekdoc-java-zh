    public class DataType {\n    public static void main ( String [] args ) {\n  \
    \      double b1 = 10.1 ;\n        float b2 = 12.2f ; // add a f or F at the end\n\
    \        System . out . println ( b1 );\n        System . out . println ( b2 );\n\
    \    }\n}\n```\n\nOpen `cmd` type `javac DataType.java` and then type `java DataType`.\n\
    \n![](Image0032.jpg)\n\n3. Character and Boolean (`char`, `boolean`).\n\n`char`:\
    \ is a single character that enclosed in single quote marks, that is a letter\
    \ 'a', a digit '9', a punctuation mark '!', a tab ' ', a space ' ' etc.\n\nEscape\
