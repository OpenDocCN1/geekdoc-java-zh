    Teddy\");\n        System.out.println(obj.toString());\n    }\n}\n```\n\n**Result:**\n\
    ```\nTeddy\n```\n\n# ArrayList\n\n`ArrayList` is a part of the collection framework\
    \ and is present in the `java.util` package. It provides us with dynamic arrays.\
    \ It implements the `List` interface. `List` inherits the `Collection` interface.\n\
    \n1. `ArrayList` is in order of first-in, first-out.\n2. `ArrayList` can add repeating\
    \ elements.\n3. `ArrayList` can also add `null` value.\n4. `ArrayList` is an array\
    \ of objects.\n\n![](Image00103.gif)\n\n### 1. `add(Object o)`\nAdd an element\
    \ at the end of the list.\n\n### `get(int index)`\nGet the element from the position\
    \ of the list.\n\n```java\npublic static void main(String[] args) {\n    List\
    \ list = new ArrayList();\n    list.add(100);\n    list.add(\"David\");\n    System.out.println(list.get(0));\n\
    \    System.out.println(list.get(1));\n}\n```\n\n**Result:**\n```\n100\nDavid\n\
    ```\n\n### 2. `int size()`\nReturn the number of elements in the list.\n\n```java\n\
    public static void main(String[] args) {\n    List list = new ArrayList();\n \
    \   list.add(100);\n    list.add(\"David\");\n    list.add(25.5);\n    // Print\
    \ all elements\n    for (int i = 0; i < list.size(); i++) {\n        Object obj\
    \ = list.get(i);\n        System.out.print(obj + \",\");\n    }\n}\n```\n\n**Result:**\n\
    ```\n100,David,25.5,\n```\n\n### 3. `set(int index, Object element)`\nReplace\
    \ the specified element in the list at the specified position.\n\n```java\nList\
    \ list = new ArrayList();\nlist.add(100);\nlist.add(\"David\");\nlist.set(1, \"\
    Grace\"); // update \"David\" to \"Grace\"\n```\n\n**Result:**\n```\n100,Grace\n\
    ```\n\n### 4. `remove(int index)` and `remove(Object o)`\nRemove the element at\
    \ the specified position or remove the first occurrence of the specified element.\n\
    \n```java\nList list = new ArrayList();\nlist.add(100);\nlist.add(\"David\");\n\
    list.add(10.5);\nlist.remove(0); // delete element at index 0\nlist.remove(\"\
    David\"); // delete element \"David\"\n```\n\n**Result:**\n```\n10.5\n```\n\n\
    ### 5. `isEmpty()`, `clear()`, and `contains(Object o)`\n`isEmpty()` returns true\
    \ if the list is empty, otherwise false. `clear()` removes all elements from the\
    \ list. `contains(Object o)` returns true if the list contains the specified element.\n\
    \n```java\npublic static void main(String[] args) {\n    List list = new ArrayList();\n\
    \    list.add(100);\n    list.add(\"David\");\n    list.add(10.5);\n    System.out.println(list.isEmpty());\
    \ // false\n    System.out.println(list.contains(\"David\")); // true\n    list.clear();\n\
    \    System.out.println(list.isEmpty()); // true\n}\n```\n\n### 6. List add custom\
    \ objects: `Person`\n\n```java\nimport java.util.*;\nclass Person {\n    private\
