    - `ImageIO.read(file)`：读取图像文件保存为 `BufferedImage`\n- `g.drawImage(image, x, y,\
    \ null)`：在画布上绘制图像\n\n### 2. 在画布上绘制 `BufferedImage`\n\n![](img/Image00134.jpg)\n\
    \n"
