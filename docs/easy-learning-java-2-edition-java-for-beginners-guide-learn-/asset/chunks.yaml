    \ `i==1` 时跳出循环：\n\n```java\npublic class BreakLoop {\n    public static void main(String[]\
    \ args) {\n        for (int i = 0; i < 5; i++) {\n            if (i == 1){\n \
    \               break; // 跳出循环\n            }\n            System.out.println(i);\n\
    \        }\n    }\n}\n```\n结果：0\n\n2. 创建 `ContinueLoop.java`，当 `i==1` 时跳过当前迭代：\n\
    \n```java\npublic class ContinueLoop {\n    public static void main(String[] args)\
    \ {\n        for (int i = 0; i < 3; i++) {\n            if (i == 1){\n       \
    \         continue; // 跳过当前迭代\n            }\n            System.out.println(i);\n\
    \        }\n    }\n}\n```\n结果：0, 2\n\n# 一维数组\n\n数组用于在单个变量中存储多个值。声明数组使用方括号：`int[]\
    \ scores`。通过索引访问数组元素：`[0]` 是第一个，`[1]` 是第二个，以此此类推。\n\n![](img/00059.jpg)\n\n1.\
    \ 创建 `Array.java`\n\n```java\npublic class Array {\n    public static void main(String[]\
    \ args) {\n        int[] scores = {90, 70, 50, 80, 60}; // 定义一维数组\n        System.out.println(scores[0]);\
    \ // 90\n        System.out.println(scores[2]); // 50\n        System.out.println(scores[4]);\
    \ // 60\n    }\n}\n```\n\n2. 数组长度\n\n`length`：数组有多少个元素，使用 `length` 属性。\n创建 `Array2.java`：\n\
    \n```java\npublic class Array2 {\n    public static void main(String[] args) {\n\
    \        int[] scores = {90, 70, 50, 80, 60};\n        for (int i = 0; i < scores.length;\
    \ i++) {\n            System.out.print(scores[i] + \", \"); // 输出 scores 的所有数据\n\
    \        }\n    }\n}\n```\n结果：90,70,50,80,60,\n\n# 二维数组\n\n二维数组：包含多个数组的数组。创建二维数组，将每个数组放在自己的大括号内：`int[][]\
    \ arrs`。\n\n![](img/00060.jpg)\n\n1. 创建 `BinaryArray.java`\n\n```java\npublic\
    \ class BinaryArray {\n    public static void main(String[] args) {\n        int[][]\
    \ arrs = {\n            {10, 20, 30},\n            {40, 50, 60},\n           \
    \ {70, 80, 90}\n        }; // 二维数组的定义和初始化\n        System.out.println(arrs[0][0]);\
    \ // 10\n        System.out.println(arrs[0][2]); // 30\n        System.out.println(arrs[1][1]);\
    \ // 50\n        System.out.println(arrs[2][2]); // 90\n    }\n}\n```\n\n2. 创建\
    \ `TwoArray2.java` 打印二维数组的所有元素\n\n我们也可以在循环内部嵌套另一个循环来获取二维数组的元素（我们仍然需要指向两个索引）：\n\
    \n![](img/00061.gif)\n\n```java\npublic class TwoArray2 {\n    public static void\
    \ main(String[] args) {\n        int[][] arrs = {\n            {10, 20, 30},\n\
    \            {40, 50, 60},\n            {70, 80, 90}\n        };\n        for\
    \ (int i = 0; i < arrs.length; i++) {\n            for (int j = 0; j < arrs[i].length;\
    \ j++) {\n                System.out.print(arrs[i][j] + \" \");\n            }\n\
    \            System.out.println();\n        }\n    }\n}\n```\n\n"
