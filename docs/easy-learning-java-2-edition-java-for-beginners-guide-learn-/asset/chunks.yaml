- fmt: "\n![](Image00169.jpg)\n\n# Easy Learning Java (2 Edition)\n\n![](Image00000.jpg)\n\
    \n**YANG HU**\n\nSimple is the beginning of wisdom. This book briefly explain\
    \ the concept and vividly cultivate programming interest, this book fast learn\
    \ Java object-oriented programming.\n\n[http://en.verejava.com](http://en.verejava.com)\n\
    \nCopyright © 2020 Yang Hu\nAll rights reserved.\nISBN : 9798634831589\n\n## CONTENTS\n\
    \n1. [Java JDK Installation](#\n2. [Set Java Environment Variables](#\n3. [The\
    \ First Java Program](#\n4. [Basic Concepts of Java]\n    - 4.1 [Variable]\n \
    \   - 4.2 [Basic Data Types]\n    - 4.3 [Constant]\n    - 4.4 [Type Casting]\n\
    5. [Operator]\n    - 5.1 [Arithmetic Operator]\n    - 5.2 [Method]\n    - 5.3\
    \ [Class]\n    - 5.4 [Package]\n    - 5.5 [Increment and Decrement]\n    - 5.6\
