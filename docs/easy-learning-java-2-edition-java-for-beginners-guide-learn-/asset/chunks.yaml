  trans: "\n\n# 常量 (Constant)\n常量：一旦赋值，其值无法改变的变量。\n\n1. 常量的定义需要大写字母。\n2. 要定义一个常量，我们只需要在变量前面添加\
    \ `final` 关键字。\n```java\nfinal float PI = 3.14f ;\n```\n`PI` 的值一旦赋值就无法更改。\n\n\
    ### 1. 在 Nodepad++ 中创建一个文件：`FinalVariable.java`\n\n```java\npublic class FinalVariable\
    \ {\n    public static void main ( String [] args ) {\n        final int UP =\
    \ 0 ;\n        final int DOWN = 1 ;\n        System.out.println(UP);\n       \
    \ System.out.println(DOWN);\n        final float PI = 3.14f ;\n        System.out.println(PI);\n\
    \        final boolean RUN = true ;\n        System.out.println(RUN);\n    }\n\
    }\n```\n打开 `cmd` 输入 `javac FinalVariable.java`，然后输入 `java FinalVariable `。\n\n\
    ![](img/Image00034.jpg)\n\n# 类型转换 (Type Casting)\n类型转换：是将一个原始数据类型的值赋值给另一种类型。\n\
    \n转换有两种类型：\n\n1. **宽类型转换 (Widening Casting)**：自动将较小的类型转换为较大的类型大小。\n   `byte ->\
    \ short -> char -> int -> long -> float -> double`\n\n2. **窄类型转换 (Narrowing Casting)**：手动将较大的类型转换为较小的尺寸类型。\n\
    \   `double -> float -> long -> int -> char -> short -> byte`\n\n### 1. 宽类型转换\n\
    在 Nodepad++ 中创建一个文件：`TypeCasting.java`\n\n```java\npublic class TypeCasting {\n\
    \    public static void main(String[] args) {\n        // 自动将较小的类型转换为较大的类型大小\n\
    \        byte varByte = 1;\n        int varInt = varByte;\n        System.out.println(varInt);\n\
    \        int varInt2 = 10;\n        float varFloat2 = varInt2;\n        System.out.println(varFloat2);\n\
    \    }\n}\n```\n打开 `cmd` 输入 `javac TypeCasting.java`，然后输入 `java TypeCasting `。\n\
    \n![](img/Image00035.jpg)\n\n### 2. 窄类型转换\n在 Nodepad++ 中创建一个文件：`TypeCasting.java`\n\
    \n```java\npublic class TypeCasting {\n    public static void main ( String []\
    \ args ) {\n        // 手动将较大的类型转换为较小的尺寸类型\n        int varInt = 2 ;\n        byte\
    \ varByte = ( byte ) varInt ; // 需要向下强制转换：在开头添加 ( byte )\n        System.out.println(varByte);\n\
    \        float varFloat = 10.5f ;\n        int varInt2 = ( int ) varFloat ; //\
    \ 需要向下强制转换：在开头添加 ( int )\n        System.out.println(varInt2);\n    }\n}\n```\n\
    打开 `cmd` 输入 `javac TypeCasting.java`，然后输入 `java TypeCasting `。\n\n![](img/Image00036.jpg)\n\
    \n### 3. char 和 int（宽类型转换和窄类型转换）\n`int` 和 `char` 的转换遵循 ASCII 表。\n\nASCII 代表美国信息交换标准代码。下面是\
    \ ASCII 字符表，包括前 32 个字符的描述。\n\n* `char 'a'` 转换为 `int` 97\n* `char 'b'` 转换为 `int`\
    \ 98\n* `int` 99 转换为 `char 'c'`\n* `int` 100 转换为 `char 'd'`\n\n![](img/Image00037.gif)\n\
    \n在 Nodepad++ 中创建一个文件：`TypeCasting.java`\n\n```java\npublic class TypeCasting\
    \ {\n    public static void main ( String [] args ) {\n        // char 转换为 int\
    \ 的规则遵循 ASCII 表\n        char varChar = 'a' ;\n        int varInt = varChar ;\n\
    \        System.out.println(varInt);\n        // int 转换为 char 遵循 ASCII 表\n   \
    \     int varInt2 = 99 ;\n        char varChar2 = ( char ) varInt2 ; // 需要向下强制转换：在开头添加\
    \ ( char )\n        System.out.println(varChar2);\n    }\n}\n```\n打开 `cmd` 输入\
    \ `javac TypeCasting.java`，然后输入 `java TypeCasting `。\n\n![](img/Image0038.jpg)\n\
    \n# 算术运算符 (Arithmetic Operator)\n算术运算符：用于执行数学运算：`+`, `-`, `*`, `/`, `%`。\n\n![](img/Image0039.jpg)\n\
    \n### 1. 在 Nodepad++ 中创建一个文件：`Arithmetic.java`\n\n```java\npublic class Arithmetic\
    \ {\n    public static void main ( String [] args ) {\n        int a = 1 ;\n \
    \       int b = 2 ;\n        int c = 3 ;\n        System.out.println(a + b); //\
    \ 1 + 2 = 3\n        System.out.println(a - b); // 1 - 2 = -1\n        System.out.println(a\
    \ * b); // 1 * 2 = 2\n        System.out.println(a / b); // 1 / 2 = 0\n      \
    \  System.out.println(c % b); // 1 % 2 = 1 返回余数\n    }\n}\n```\n打开 `cmd` 输入 `javac\
    \ Arithmetic.java`，然后输入 `java Arithmetic `。\n\n![](img/Image0040.jpg)\n\n# 方法\
    \ (Method)\n方法：是一个代码块，只有在被调用时运行。你可以向方法传递数据，并多次调用它。\n\n![](img/Image0041.jpg)\n\
    ![](img/Image0042.jpg)\n![](img/Image0043.gif)### 1. 在 Nodepad++ 中创建一个文件：`TestMethod.java`\n\
    \n```java\npublic class TestMethod {\n    // 定义 add 方法\n    public static int\
    \ add ( int a , int b ){\n        return a + b ;\n    }\n    public static void\
    \ main ( String [] args ) {\n        // 调用 add 方法\n        int result = add(4,\
    \ 2); // 调用 add 方法\n        System.out.println(result); // result = 6\n    }\n\
    }\n```\n打开 `cmd` 输入 `javac TestMethod.java`，然后输入 `java TestMethod `。\n\n![](img/Image0044.jpg)###\
    \ 2. 添加方法 *, /\n\n```java\npublic class TestMethod {\n    // 定义 add 方法\n    public\
    \ static int add ( int a , int b ){\n        return a + b ;\n    }\n    public\
    \ static void main ( String [] args ) {\n        // 调用 add 方法\n        int result\
    \ = add(4, 2); // 调用 add 方法\n        System.out.println(result); // result = 6\n\
    \    }\n}\n```\n*(注：此处根据原文逻辑重复翻译，以匹配用户提供的原始文本结构)*\n```java\npublic class TestMethod\
    \ {\n    // 定义 add 方法\n    public static int add ( int a , int b ){\n        return\
    \ a + b ;\n    }\n    public static void main ( String [] args ) {\n        //\
    \ 调用 add 方法\n        int result = add(4, 2); // 调用 add 方法\n        System.out.println(result);\
    \ // result = 6\n    }\n}\n}\n}\n```\n*(注：此处根据原文逻辑重复翻译，以匹配用户提供的原始文本结构)*\n```java\n\
    public class TestMethod {\n    // 定义 add 方法\n    public static int add ( int a\
    \ , int b ){\n        return a + b ;\n    }\n    public static void main ( String\
    \ [] args ) {\n        // 调用 add 方法\n        int result = add(4, 2); // 调用 add\
    \ 方法\n        System.out.println(result); // result = 6\n    }\n}\n}\n}\n}\n```\n\
    *(注：原文中存在多处重复和格式断裂，此处已按原文内容逐行进行对应翻译)*\n\n# 类 (Class)\n类：是创建对象的蓝图。Java 中的所有内容与类相关，以及属性和方法。\n\
    \n![](img/Image0045.jpg)\n\n### 1. 在 Nodepad++ 中创建一个文件：`TestMethod.java`\n\n```java\n\
    public class TestMethod {\n    // 定义类 add, sub, multiply, divide\n    public static\
    \ int add ( int a , int b ){\n        return a + b ;\n    }\n    public static\
    \ int sub ( int a , int b ){\n        return a - b ;\n    }\n    public static\
    \ int multiply ( int a , int b ){\n        return a * b ;\n    }\n    public static\
    \ int divide ( int a , int b ){\n        return a / b ;\n    }\n    public static\
    \ void main ( String [] args ) {\n        // 创建对象名称：cal\n        TestMethod cal\
    \ = new TestMethod(); // 创建对象：cal\n        int result = cal.add(4, 2); // 调用 add\
    \ 方法\n        System.out.println(result); // result = 6\n        result = cal.sub(4,\
    \ 2);\n        System.out.println(result); // result = 2\n        result = cal.multiply(4,\
    \ 2);\n        System.out.println(result); // result = 8\n        result = cal.divide(4,\
