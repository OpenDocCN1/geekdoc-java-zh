  trans: "\n\n![](img/Image00047.jpg)\n\n## 2. TestClass.java\n\n如果我们想使用 `com.tool`\
    \ 包中的 `Caculator` 类。\n\n我们需要导入包中的 `Caculator`：`import com.tool.Caculator;`\n\n\
    或者\n\n导入整个包：`import com.tool.*;;`\n\n```java\nimport com.tool.Caculator; // 导入包中的\
    \ Caculator\npublic class TestClass {\n    public static void main (String []\
    \ args) {\n        Caculator cal = new Caculator();\n        int result = cal.add(4,\
    \ 2);\n        System.out.println(result); //6\n        result = cal.sub(4, 2);\n\
    \        System.out.println(result); //2\n    }\n}\n```\n\n打开 `cmd` 输入 `javac\
    \ TestClass.java` 然后输入 `java TestClass`。\n\n![](img/Image00048.jpg)\n\n## 递增与递减\n\
    \n递增 `++`：一元运算符，将变量的值加 1。\n\n递减 `--`：一元运算符，将变量的值减 1。\n\n1.  在 Notepad++ 中创建一个文件：`Unary.java`\n\
    \n```java\npublic class Unary {\n    public static void main (String [] args)\
    \ {\n        int d = 4;\n        System.out.println(d++); // = 4 打印 d 后加 1\n \
    \       d = 4;\n        System.out.println(+d); // = 5 先加 1 后打印 d\n        d =\
    \ 4;\n        System.out.println(d--); // = 4 打印 d 后减 1\n        d = 4;\n    \
    \    System.out.println(--d); // = 3 先减 1 后打印 d\n        int result = 10;\n  \
    \      result = result + 1;\n        System.out.println(result); // = 11\n   \
    \     result = 10;\n        result++;\n        System.out.println(result); //\
    \ = 11\n        result = 10;\n        result += 1;\n        System.out.println(result);\
    \ // = 11\n    }\n}\n```\n\n打开 `cmd` 输入 `javac Unary.java` 然后输入 `java Unary`。\n\
    \n你将能够在窗口上看到打印的结果。\n\n## 关系运算符\n\n关系运算符：用于比较两个变量是否相等、不相等、大于、小于等，始终返回一个布尔值：`true`\
    \ 或 `false`。\n\n1.  创建一个文件：`Relational.java`\n\n```java\npublic class Relational\
    \ {\n    public static void main (String [] args) {\n        System.out.println(100\
    \ > 200);\n        System.out.println(100 >= 100);\n        System.out.println(100\
    \ < 200);\n        System.out.println(100 <= 200);\n        System.out.println(100\
    \ == 100);\n        System.out.println(100 != 200);\n    }\n}\n```\n\n打开 `cmd`\
    \ 输入 `javac Relational.java` 然后输入 `java Relational`。\n\n![](img/Image00049.jpg)\n\
    \n## 逻辑运算符\n\n逻辑运算符：`&&`、`||`、`!`\n\n1.  `&&` 如果操作的两侧都为真，则返回 true，否则返回 false\n\
    2.  `||` 如果操作的两侧都为假，则返回 false，否则返回 true\n3.  `!` 如果结果为假，则返回真，否则为真\n\n1.  创建一个文件：`Logical.java`\n\
    \n```java\npublic class Logical {\n    public static void main (String [] args)\
    \ {\n        // && 两边都为真时返回 true，否则 false\n        System.out.println(true &&\
    \ false); // false\n        System.out.println(false && true); // false\n    \
    \    System.out.println(false && false); // false\n        System.out.println(true\
    \ && true); // true\n\n        // || 两边都为假时返回 false，否则为 true\n        System.out.println(true\
    \ || false); // true\n        System.out.println(false || true); // true\n   \
    \     System.out.println(true || true); // true\n        System.out.println(false\
    \ || false); // false\n\n        // ! 结果为假时返回 true，否则为真\n        System.out.println(!true);\
    \ // false\n        System.out.println(!false); // true\n    }\n}\n```\n\n打开 `cmd`\
    \ 输入 `javac Logical.java` 然后输入 `java Logical`。\n\n你将能够在窗口上看到打印的结果。\n\n2.  创建一个文件：`Logical2.java`\n\
    \n```java\npublic class Logical2 {\n    public static void main (String [] args)\
    \ {\n        boolean b = true;\n        System.out.println(b); // true\n     \
    \   System.out.println(1 > 2 && b); // false\n        System.out.println(2 > 1\
    \ && b); // true\n\n        boolean b1 = true;\n        System.out.println(b1);\
    \ // true\n        System.out.println(2 > 1 || b1); // true\n        System.out.println(1\
    \ > 2 || b1); // true\n    }\n}\n```\n\n打开 `cmd` 输入 `javac Logical2.java` 然后输入\
    \ `java Logical2`。\n\n你将能够在窗口上看到打印的结果。\n\n## if 语句\n\n### if \n\n```java\nif (condition1)\
    \ {\n    // 如果 condition1 为真，执行代码块\n} else if (condition2) {\n    // 如果 condition1\
    \ 为假且 condition2 为真，执行代码块\n} else {\n    // 如果上述条件都为假，执行代码块\n}\n```\n\n得分示例：\n\
    - `if score == 5`: 优秀\n- `else score == 4`: 好\n- `else`: 需要提高\n\n1.  创建一个 `IfStatement.java`\n\
    \n```java\npublic class IfStatement {\n    public static void main (String []\
    \ args) {\n        int score = 5;\n        if (score == 5) {\n            System.out.println(\"\
    Excellent\");\n        } else if (score == 4) {\n            System.out.println(\"\
    Good\");\n        } else {\n            System.out.println(\"Need to catch up\"\
    );\n        }\n    }\n}\n```\n\n打开 `cmd` 输入 `javac IfStatement.java` 然后输入 `java\
    \ IfStatement`。\n\n结果：优秀\n\n2. 从键盘获取用户输入\n\n`Scanner`: 类用于获取用户输入，它位于 `java.util`\
    \ 包中。要使用 `Scanner` 类，需要创建该类的对象。在示例中，我们将使用 `nextInt()` 方法从用户输入读取 `int` 值。\n\n```java\n\
    import java.util.Scanner; // 导入 Scanner 类\npublic class IfStatement {\n    public\
    \ static void main (String [] args) {\n        Scanner in = new Scanner(System.in);\
    \ // 创建 Scanner 对象\n        System.out.println(\"Please input your score:\");\n\
    \        int score = in.nextInt(); // 读取 int 值\n        if (score == 5) {\n  \
    \          System.out.println(\"Excellent\");\n        } else if (score == 4)\
    \ {\n            System.out.println(\"Good\");\n        } else {\n           \
    \ System.out.println(\"Need to catch up\");\n        }\n    }\n}\n```\n\n打开 `cmd`\
    \ 输入 `javac IfStatement.java` 然后输入 `java IfStatement`。\n\n## switch\n\n`switch`:\
    \ switch 语句用于选择多个代码块中的一个执行。\n\nswitch 表达式求值一次。\n\n表达式的值与每个 `case` 的值进行比较。如果匹配，则执行相应的代码块。\n\
    \n`break` 关键字会跳出 switch 块。\n\n`default` 关键字指定在没有匹配项时运行某些代码。\n\n```java\nswitch\
