    \            System.out.println(\"Train Thread Run \" + i);\n            try {\n\
    \                Thread.sleep(200);\n            } catch (InterruptedException\
    \ e) {\n                e.printStackTrace();\n            }\n        }\n    }\n\
    }\n\npublic class TestThread {\n    public static void main(String[] args) {\n\
    \        CarThread carThread = new CarThread();\n        new Thread(carThread).start();\n\
    \        TrainThread trainThread = new TrainThread();\n        new Thread(trainThread).start();\n\
    \    }\n}\n```\n\n**输出结果：**\n\n```\nCar Thread Run 0\nTrain Thread Run 0\nCar\
    \ Thread Run 1\nTrain Thread Run 1\nCar Thread Run 2\nTrain Thread Run 2\nCar\
    \ Thread Run 3\nTrain Thread Run 3\nCar Thread Run 4\nTrain Thread Run 4\n```\n\
    \n从结果可以看出，两个线程正在交替执行。\n\n# 创建 GUI 窗口应用程序\n\nJava 提供了 `Swing` 用于开发 GUI（图形用户界面）。`Swing`\
    \ 是常用的。它是 GUI 工具包的标准 Java 接口。使用 Java 和 Swing 创建 GUI 应用程序是最快、最简单的方法。\n\n### 1.\
    \ 在 Eclipse 中创建一个文件：`AirplaneGame.java`\n\n- `JFrame`：类是一种容器类型，可以创建窗口。\n- `JFrame.setSize(int\
    \ width, int height)`：设置框架的大小。\n- `JFrame.setVisible(true)`：设置框架的可见性以打开窗口。\n-\
    \ `import javax.swing.*`：提供了 java swing GUI API 的类。\n\n```java\nimport javax.swing.*;\n\
    public class AirplaneGame {\n    public static void main(String[] args) {\n  \
    \      JFrame frame = new JFrame(\"Java GUI Application\");\n        frame.setSize(300,\
    \ 300);\n        frame.setVisible(true);\n    }\n}\n```\n\n**Run as -> Java Application**\
    \ 打开一个窗口：\n\n![](img/Image00124.jpg)\n\n# 创建 Canvas\n\n`Canvas`：用于在屏幕上绘制图形和图像。Java\
    \ 库包含一个用于绘制 2D 图形的简单包，称为 `java.awt`。\n\n在 Java 中创建图形有多种方法；我们可以创建一个继承自 `JPanel`\
    \ 的 `Canvas`，`Canvas` 是屏幕上的空白矩形区域，应用程序可以在上面绘制。\n\n![](img/Image00125.jpg)\n\n\
    ### 1. 创建继承自 `JPanel` 的 `Canvas`，并将画布添加到 `JFrame` 的中心。\n\n![](img/Image00126.jpg)\n\
    \n### 2. 在 Eclipse 中创建一个文件：`AirplaneGame.java`\n\n- `this.setLayout(null)`：必须设置布局为\
    \ null\n- `this.setBackground(Color c)`：设置 `JPanel` 的背景颜色\n\n```java\nimport javax.swing.*;\n\
    import java.awt.*;\nclass Canvas extends JPanel {\n    public Canvas() {\n   \
    \     this.setLayout(null);\n        this.setBackground(Color.WHITE); // 设置背景颜色：白色\n\
    \    }\n}\n\npublic class AirplaneGame {\n    public static void main(String[]\
    \ args) {\n        JFrame frame = new JFrame(\"GUI Canvas Application\");\n  \
    \      Canvas canvas = new Canvas();\n        frame.add(canvas);\n        frame.setSize(300,\
    \ 300);\n        frame.setVisible(true);\n    }\n}\n```\n\n**Run as -> Java Application**\
    \ 打开一个窗口：\n\n![](img/Image00127.jpg)\n\n# 在 Canvas 上绘制图形\n\n`Graphics` 类提供了基本的绘制方法，如\
    \ `drawLine`、`drawRect`、`drawString` 和 `drawImage`。当我们想在屏幕上绘制自己的图形时，应该将图形代码放在\
    \ `JPanel` 的 `paintComponent()` 方法中。系统会直接调用它。因此我们的 `Canvas` 需要重写 `paintComponent()`\
    \ 方法来执行我们的图形代码。\n\n![](img/Image00128.jpg)\n\n```java\nclass Canvas extends JPanel\
    \ {\n    public Canvas() {\n        this.setLayout(null);\n        this.setBackground(Color.WHITE);\n\
    \    }\n    protected void paintComponent(Graphics g) {\n        super.paintComponent(g);\n\
    \        // 将我们的图形放在这里\n    }\n}\n```\n\n### 1. 在 Canvas 上画线\n\nJava 使用坐标系，原点位于左上角。图形坐标以像素为单位；每个像素对应于屏幕上的一个点。\n\
    \n![](img/Image00129.jpg)\n\n`g.drawLine(x1, y1, x2, y2)`：接受四个整数，表示线条的起点 `(x1,\
    \ y1)` 和终点 `(x2, y2)` 坐标。\n\n```java\nimport javax.swing.*;\nimport java.awt.*;\n\
    class Canvas extends JPanel {\n    public Canvas() {\n        this.setLayout(null);\n\
    \        this.setBackground(Color.WHITE); // 设置背景颜色：白色\n    }\n    protected void\
    \ paintComponent(Graphics g) {\n        super.paintComponent(g);\n        g.drawLine(50,\
    \ 50, 200, 50); // 从 (50,50) 画一条线到 (200,50)\n    }\n}\n\npublic class AirplaneGame\
    \ {\n    public static void main(String[] args) {\n        JFrame frame = new\
    \ JFrame(\"GUI Canvas Application\");\n        Canvas canvas = new Canvas();\n\
    \        frame.add(canvas); // 将画布添加到 JFrame 的中心\n        frame.setSize(300, 200);\n\
    \        frame.setVisible(true);\n    }\n}\n```\n\n### 2. 在 Canvas 上画一个矩形\n\n\
    ![](img/Image00130.jpg)\n\n`g.drawRect(int x, int y, int width, int height)`：在画布上画一个矩形。\n\
    \n```java\nimport java.awt.*;\nimport javax.swing.*;\nclass Canvas extends JPanel\
    \ {\n    public Canvas() {\n        this.setLayout(null);\n        this.setBackground(Color.WHITE);\n\
    \    }\n    protected void paintComponent(Graphics g) {\n        super.paintComponent(g);\n\
    \        g.drawRect(50, 50, 100, 50); // 在 (50,50) 处画一个 100x50 的矩形\n    }\n}\n\
    ```\n\n### 3. 在 Canvas 填充矩形\n\n![](img/Image00131.jpg)\n\n`g.fillRect(int x, int\
    \ y, int width, int height)`：在画布上填充矩形。\n`g.setColor(Color c)`：设置颜色（红色：`Color.RED`，绿色：`Color.GREEN`，蓝色：`Color.BLUE`）。\n\
    \n```java\nimport java.awt.*;\nimport javax.swing.*;\nclass Canvas extends JPanel\
    \ {\n    public Canvas() {\n        this.setLayout(null);\n        this.setBackground(Color.WHITE);\n\
    \    }\n    protected void paintComponent(Graphics g) {\n        super.paintComponent(g);\n\
    \        // 绘制红色矩形\n        g.setColor(Color.RED);\n        g.fillRect(50, 50,\
    \ 100, 50);\n        // 绘制绿色矩形\n        g.setColor(Color.GREEN);\n        g.fillRect(160,\
    \ 50, 100, 50);\n        // 绘制蓝色矩形\n        g.setColor(Color.BLUE);\n        g.fillRect(270,\
    \ 50, 100, 50);\n    }\n}\n}\n```\n\n# 4. 在 Canvas 上绘制图像\n\n`KidsJavascriptImages.zip`\
