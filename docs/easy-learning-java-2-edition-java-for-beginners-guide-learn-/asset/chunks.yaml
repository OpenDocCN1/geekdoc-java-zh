  trans: "\n\nResult:\n伯克利大学 -> Market Street -> Polo Alto -> Cuptino ->\n\n# HashSet\n\
    \n`HashSet`: 用于创建一个使用哈希表进行存储的集合。它实现了 `Set` 接口。`HashSet` 类具有与 `ArrayList` 相同的方法。\n\
    \n1. `HashSet` 仅包含唯一元素。\n2. `HashSet` 允许 `null` 值。\n3. `HashSet` 返回值的顺序是不固定的。\n\
    \n![](img/Image00108.jpg)\n\n```java\npublic static void main(String[] args) {\n\
    \    Set set = new HashSet();\n    set.add(\"Abraham\");\n    set.add(\"Washington\"\
    );\n    set.add(\"James\");\n    set.add(\"James\");\n    set.add(\"James\");\n\
    \    Iterator iter = set.iterator();\n    while (iter.hasNext()) {\n        String\
    \ name = iter.next().toString();\n        System.out.print(name+ \" , \");\n \
    \   }\n}\n```\nResult:\nWashington , James , Abraham ,\n\n# HashMap\n\n`HashMap`:\
    \ 基于 `Map` 的集合类，用于存储 `Key = value` 键值对，它不会以相同的顺序返回键和值。\n\n![](img/Image00109.jpg)\n\
    ![](img/Image00110.gif)\n\n1. `put(Object key, Object value)`:\n将键值映射插入到 map 中。\n\
    \n`Object get(Object key)`:\n返回指定键对应的值。\n\n`boolean containsKey(Object key)`:\n\
    根据 map 中是否找到指定的键来返回 `true` 或 `false`。\n\n```java\npublic static void main(String[]\
    \ args) {\n    Map map = new HashMap();\n    map.put(\"name\", \"David\");\n \
    \   map.put(\"age\", 20);\n    System.out.println(map.get(\"name\")); // David\n\
    \    System.out.println(map.get(\"age\")); // 20\n    System.out.println(map.containsKey(\"\
    age\")); // true\n}\n```\n\n2. `Set keySet()`:\n返回从 map 中获取的键的 `Set`。\n\n```java\n\
    public static void main(String[] args) {\n    Map map = new HashMap();\n    map.put(\"\
    name\", \"David\");\n    map.put(\"age\", 20);\n    map.put(\"salary\", 12000);\n\
    \    map.put(\"married\", false);\n    Set set = map.keySet();\n    Iterator iter\
    \ = set.iterator();\n    while (iter.hasNext()) {\n        Object key = iter.next();\n\
    \        Object value = map.get(key);\n        System.out.println(key + \"=\"\
    \ + value);\n    }\n}\n```\nResult:\nmarried=false\nage=20\nname=David\nsalary=12000\n\
    \n# Generic\n\n`Generic`: 方法和泛型类允许程序员人员通过单个方法声明或单个类声明来指定类型。泛型还提供了编译时安全，允许您在编译时捕获无效类型。所有的泛型声明都有由尖括号\
    \ `< >` 分隔的类型参数。\n\n## 1. 创建泛型类：`Person<T>`\n```java\nclass Person<T> { //<T>\
    \ 传递各种类型\n    private T age;\n    public Person(T age) {\n        this.age = age;\n\
    \    }\n    public T getAge() {\n        return age;\n    }\n    public void setAge(T\
    \ age) {\n        this.age = age;\n    }\n}\n\nclass TestGeneric {\n    public\
    \ static void main(String[] args) {\n        Person<String> p1 = new Person<String>(\"\
    30\"); // 传递 String 类型\n        System.out.println(p1.getAge());\n        Person<Integer>\
    \ p2 = new Person<Integer>(80); // 传递 Integer 类型\n        System.out.println(p2.getAge());\n\
    \    }\n}\n```\nResult:\n30\n80\n\n## 2. 为 List 使用泛型：`ArrayList<String>`\n```java\n\
    public static void main(String[] args) {\n    List<String> list = new ArrayList<String>();\n\
    \    list.add(\"Faith\");\n    list.add(\"Danie\");\n    list.add(\"Mathew\");\n\
    \    for (int i = 0; i < list.size(); i++) {\n        String element = list.get(i);\n\
    \        System.out.println(element);\n    }\n}\n```\nResult:\nFaith\nDanie\n\
    Mathew\n\n## 3. 为 Map 使用泛型：`HashMap<String, Integer>`\n```java\npublic static\
    \ void main(String[] args) {\n    Map<String, Integer> map = new HashMap<String,\
    \ Integer>();\n    map.put(\"English\", 100);\n    map.put(\"Math\", 95);\n  \
    \  map.put(\"Science\", 98);\n    Set<String> set = map.keySet();\n    Iterator<String>\
    \ iter = set.iterator();\n    while (iter.hasNext()) {\n        String key = iter.next();\n\
    \        Integer value = map.get(key);\n        System.out.println(key + \"=\"\
    \ + value);\n    }\n}\n```\nResult:\nMath=95\nScience=98\nEnglish=100\n\n## 4.\
    \ 创建一个类：`Customer`\n为 List 使用泛型：`ArrayList<Customer>`\n```java\nimport java.util.*;\n\
    class Customer {\n    private String name;\n    private int age;\n    public Customer(String\
    \ name, int age) {\n        this.name = name;\n        this.age = age;\n    }\n\
    \    public String getName() {\n        return name;\n    }\n    public int getAge()\
    \ {\n        return age;\n    }\n}\n\nclass TestGeneric {\n    public static void\
    \ main(String[] args) {\n        List<Customer> customerList = new ArrayList<Customer>();\n\
    \        customerList.add(new Customer(\"Grace\", 25));\n        customerList.add(new\
    \ Customer(\"Renia\", 30));\n        customerList.add(new Customer(\"Rebeka\"\
    , 28));\n        for (int i = 0; i < customerList.size(); i++) {\n           \
    \ Customer customer = customerList.get(i);\n            System.out.println(customer.getName()\
    \ + \" \" + customer.getAge());\n        }\n    }\n}\n```\nResult:\nGrace, 25\n\
    Renia, 30\nRebeka, 28\n\n# Random\n\n`Random`: 用于生成随机数。`Random` 类位于 `java.util`\
    \ 包中。\n\n## 1. 打印随机数 0-9\n`nextInt(n)`: 返回 `0` 到 `n-1` 之间的随机数。\n```java\nimport\
    \ java.util.*;\nclass RandomNumber {\n    public static void main(String[] args)\
    \ {\n        Random rn = new Random();\n        for (int i = 0; i < 10; i++) {\n\
    \            int num = rn.nextInt(10);\n            System.out.println(num + \"\
    , \");\n        }\n    }\n}\n```\nResult:\n9, 3, 4, 0, 5,\n\n## 2. 生成 6 个不同的随机数\n\
    `HashSet` 包含唯一元素，我们可以持续生成随机数直到 HashSet 填充了 6 个不同的数字。\n```java\nimport java.util.*;\n\
    class VerificationCode {\n    public static void main(String[] args) {\n     \
    \   Random rn = new Random();\n        Set<Integer> set = new HashSet<>();\n \
    \       // 持续生成随机数到 HashSet\n        while (set.size() < 6) {\n            int\
    \ num = rn.nextInt(10);\n            set.add(num);\n        }\n        // 打印 HashSet\
    \ 中的所有随机数\n        Iterator<Integer> iter = set.iterator();\n        while (iter.hasNext())\
    \ {\n            System.out.print(iter.next() + \" , \");\n        }\n    }\n\
    }\n```\nResult:\n0, 3, 4, 5, 7, 8 ,\n\n# Exception\n\n`Exception`: 是程序执行过程中发生的意外或意外事件，`Exception`\
    \ 可能会尝试捕获。\n`Error`: 表示应用程序不应捕获的严重问题。\n\n![](img/Image00111.jpg)\n\ntry catch\
    \ 块\n```java\ntry {\n    // 可能引起异常的语句\n} catch (Exception e) {\n    // 处理异常\n\
    }\n```\n\n## 1. 如果 `a/b` 且 `b = 0`，将抛出异常：`ArithmeticException`。\n```java\npublic\
    \ static void main(String[] args) {\n    int result = 0;\n    int a = 10;\n  \
    \  int b = 0;\n    try {\n        result = a / b;\n        System.out.println(result);\n\
    \    } catch (ArithmeticException e) {\n        System.out.println(\"除数不能为 0\"\
    );\n    }\n}\n```\nResult:\n除数不能为 0\n如果发生异常，`try` 块将终止并直接跳转到 `catch` 块。\n\n![](img/Image00112.gif)\n\
    \n## 2. `finally` 块：包含无论是否发生异常都执行的关键语句。无论 `try` 块中是否发生异常，此块中的语句都都会执行。\n\n如果 `a/b`\
    \ 且 `b != 0`\n![](img/Image00113.gif)\nResult:\n2\nfinally\n\n如果 `a/b` 且 `b =\
    \ 0`\n![](img/Image00114.gif)\nResult:\n除数不能为 0\nFinally\n\n"
- fmt: "\n`finally` block will always execute regardless of whether exception occurs\
    \ in `try` block or not.\n\n## File\n\n`File` is Java’s representation of a file\
    \ or directory path name. The `File` class contains several methods for working\
    \ with the path name, deleting and renaming files, creating new directories, listing\
    \ the contents of a directory etc. The `File` class is in the `java.io` package.\n\
    \n### 1. Create a directory: `c:/java`\n\n`mkdirs()`:\nCreates the directory named\
    \ by `pathname`.\n\n```java\nimport java.io.*;\npublic class TestFile {\n    public\
    \ static void main(String[] args) {\n        File f = new File(\"c:/java\");\n\
    \        f.mkdirs();\n    }\n}\n```\nResult: (Image00115.jpg)\n\n### 2. `String\
    \ getAbsolutePath()`:\nReturns the absolute form of this `pathname`.\n\n```java\n\
    File f = new File(\"c:/java\");\nSystem.out.println(f.getAbsolutePath());\n```\n\
    Result: `c:/java`\n\n### 3. `String getName()`:\nReturns the name of the file\
    \ or directory.\n\n```java\nFile f = new File(\"c:/java\");\nSystem.out.println(f.getName());\n\
    ```\nResult: `java`\n\n### 4. `boolean exists()`:\nTests whether the file or directory\
    \ exists.\n\n```java\nFile f = new File(\"c:/java\");\nSystem.out.println(f.exists());\n\
    ```\nResult: `true`\n\n### 5. `boolean isDirectory()`:\nTests whether it is a\
    \ directory.\n\n```java\nFile f = new File(\"c:/java\");\nSystem.out.println(f.isDirectory());\n\
    ```\nResult: `true`\n\n### 6. `boolean renameTo(File dest)`:\nRenames the directory.\n\
    \n```java\nFile f = new File(\"c:/java\");\nf.renameTo(new File(\"c:/java_new\"\
    ));\n```\nResult: (Image00116.jpg)\n\n### 7. `boolean createNewFile()`:\nCreates\
    \ a new, empty file only if a file with this name does not yet exist.\n\n```java\n\
    public static void main(String[] args) {\n    File f = new File(\"c:/java_new/test.txt\"\
    );\n    try {\n        f.createNewFile();\n    } catch (IOException e) {\n   \
    \     e.printStackTrace();\n    }\n}\n```\nResult: (Image00117.gif)\n\n### 8.\
    \ `String getAbsolutePath()`:\nReturns the absolute form of this `pathname`.\n\
    \n```java\nFile f = new File(\"c:/java_new/test.txt\");\nSystem.out.println(f.getAbsolutePath());\n\
    ```\nResult: `c:\\java_new\\test.txt`\n\n### 9. `String getName()`:\nReturns the\
    \ name of the file.\n\n```java\nFile f = new File(\"c:/java_new/test.txt\");\n\
    System.out.println(f.getName());\n```\nResult: `test.txt`\n\n### 10. `boolean\
    \ exists()`:\nTests whether the file or directory exists.\n\n```java\nFile f =\
    \ new File(\"c:/java_new/test.txt\");\nSystem.out.println(f.exists());\n```\n\
    Result: `true`\n\n### 11. `boolean isFile()`:\nTests whether it is a file.\n\n\
    ```java\nFile f = new File(\"c:/java_new/test.txt\");\nSystem.out.println(f.isFile());\n\
    ```\nResult: `true`\n\n### 12. `boolean delete()`:\nDeletes the file or directory.\n\
    \n```java\nFile f = new File(\"c:/java_new/test.txt\");\nSystem.out.println(f.delete());\n\
    ```\nResult: `true`\n\n---\n\n## FileInputStream\n\n`FileInputStream`: obtains\
    \ input bytes from a file. It is used for reading byte-oriented data such as image\
    \ data, audio, video etc.\n\n(Image00118.gif)\n\n### 1. Manually create a text\
    \ file: `C:/java/english.txt` with the content below\n\n```text\nevery day is\
    \ good day\n```\n(Image00119.jpg)\n\n### `FileInputStream` read 5 byte data from\
    \ `C:/java/english.txt`\nEach character in the file occupies 1 byte.\n(Image00120.gif)\n\
    \n#### `int read(byte[] b)`:\nIt is used to read up to `b.length` bytes of data\
    \ from the input stream. Return `data.length` that read, if no data return -1.\n\
    \n```java\nimport java.io.*;\npublic class TestInputStream {\n    public static\
    \ void main(String[] args) {\n        InputStream is = null;\n        try {\n\
    \            is = new FileInputStream(new File(\"C:/java/english.txt\")); // open\
    \ file\n            byte[] data = new byte[5];\n            int len = is.read(data);\
    \ //Read 5 byte from the file\n            String content = new String(data, 0,\
    \ len); //convert byte[] from 0 to len\n            System.out.println(content);\n\
    \        } catch (Exception e) {\n            e.printStackTrace();\n        }\
    \ finally {\n            try {\n                is.close(); //Close file\n   \
    \         } catch (IOException e) {\n                e.printStackTrace();\n  \
    \          }\n        }\n    }\n}\n```\nResult: `every`\n\n### 2. If you want\
    \ to read all data from `C:/java/english.txt`:\nNeed to repeatedly read 5 bytes\
    \ of data and append to `StringBuilder` until the end of the file returns -1.\n\
    (Image00121.gif)\n\n```java\npublic static void main(String[] args) {\n    InputStream\
    \ is = null;\n    StringBuilder sb = new StringBuilder();\n    try {\n       \
    \ is = new FileInputStream(new File(\"C:/java/english.txt\")); // open file\n\
    \        byte[] data = new byte[5];\n        int len = -1;\n        while ((len\
    \ = is.read(data)) != -1){ //Read 5 byte until end of file return -1\n       \
    \     String content = new String(data, 0, len); //convert byte[] from 0 to len\n\
    \            sb.append(content);\n        }\n    } catch (Exception e) {\n   \
    \     e.printStackTrace();\n    } finally {\n        try {\n            is.close();\
    \ //Close file\n        } catch (IOException e) {\n            e.printStackTrace();\n\
    \        }\n    }\n    System.out.println(sb.toString());\n}\n```\nResult: `every\
    \ day is good day`\n\n---\n\n## FileOutputStream\n\n`FileOutputStream`: is an\
    \ output stream used for writing data to a file.\n(Image00122.gif)\n\n### 1. Create\
    \ a file: `TestOutputStream.java`\n\n```java\nimport java.io.*;\npublic class\
    \ TestOutputStream {\n    public static void main(String[] args) {\n        OutputStream\
    \ os = null;\n        try {\n            os = new FileOutputStream(new File(\"\
    c:/java/test.txt\")); //directory must exist\n            String content = \"\
    good morning\";\n            byte[] data = content.getBytes(); //convert String\
    \ to byte[]\n            os.write(data); // write to file\n        } catch (Exception\
    \ e) {\n            e.printStackTrace();\n        } finally {\n            try\
    \ {\n                os.close(); //Close stream\n            } catch (IOException\
    \ e) {\n                e.printStackTrace();\n            }\n        }\n    }\n\
    }\n```\n\n`Thread`: is a sequential flow of control within a program that the\
    \ CPU allocates a period of time to execute.\n(Image00123.jpg)\n\n### 1. Create\
    \ file: `TestThread.java`\n`Thread`: starts a thread, then `run()` will be called\
    \ automatically.\n\n```java\nclass CarThread extends Thread {\n    @Override\n\
    \    public void run() {\n        for (int i = 0; i < 5; i++) {\n            System.out.println(\"\
    Car Thread \" + i);\n            try {\n                Thread.sleep(200);\n \
    \           } catch (InterruptedException e) {\n                e.printStackTrace();\n\
    \            }\n        }\n    }\n}\n\nclass TrainThread extends Thread {\n  \
    \  @Override\n    public void run() {\n        for (int i = 0; i < 5; i++) {\n\
    \            System.out.println(\"Train Thread \" + i);\n            try {\n \
    \               Thread.sleep(200);\n            } catch (InterruptedException\
    \ e) {\n                e.printStackTrace();\n            }\n        }\n    }\n\
    }\n\npublic class TestThread {\n    public static void main(String[] args) {\n\
    \        CarThread carThread = new CarThread();\n        carThread.start();\n\
    \        TrainThread trainThread = new TrainThread();\n        trainThread.start();\n\
    \    }\n}\n```\nOutput Result:\n```\nCar Thread 0\nTrain Thread 0\nCar Thread\
    \ 1\nTrain Thread 1\nCar Thread 2\nTrain Thread 2\nCar Thread 3\nTrain Thread\
    \ 3\nCar Thread 4\nTrain Thread 4\n```\nFrom the results, two threads are alternately\
    \ executed.\n\n### 2. Java has another way to implement thread:\n- `CarThread`\
    \ implements `Runnable`,\n- `TrainThread` implements `Runnable`\n"
