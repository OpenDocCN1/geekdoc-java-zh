    \ to draw graphics and image on screen. The Java library includes a simple package\
    \ for drawing 2D graphics, called `java.awt`.\n\nThere are several ways to create\
    \ graphics in Java; we can create `Canvas` inherit from `JPanel`, A `Canvas` is\
    \ a blank rectangular area of the screen onto which the application can draw.\n\
    \n![](Image00125.jpg)\n\n### 1. Create a `Canvas` inherit from `JPanel` and then\
    \ add this canvas to the center of `JFrame`.\n\n![](Image00126.jpg)\n\n### 2.\
    \ Create a file : `AirplaneGame.java` in Eclipse\n\n- `this.setLayout(null)`:\
    \ must set layout null\n- `this.setBackground(Color c)`: set the background color\
    \ in a `JPanel`\n\n```java\nimport javax.swing.*;\nimport java.awt.*;\nclass Canvas\
    \ extends JPanel {\n    public Canvas() {\n        this.setLayout(null);\n   \
    \     this.setBackground(Color.WHITE); // set the background color: white\n  \
    \  }\n}\n\npublic class AirplaneGame {\n    public static void main(String[] args)\
    \ {\n        JFrame frame = new JFrame(\"GUI Canvas Application\");\n        Canvas\
    \ canvas = new Canvas();\n        frame.add(canvas);\n        frame.setSize(300,\
    \ 300);\n        frame.setVisible(true);\n    }\n}\n```\n\n**Run as -> Java Application**\
    \ Open a window:\n\n![](Image00127.jpg)\n\n# Graphics on Canvas\n\n`Graphics`\
    \ class provides basic drawing methods such as `drawLine`, `drawRect`, `drawString`\
    \ and `drawImage`. When we want to draw our own graphics on the screen we should\
    \ put our graphics code inside `paintComponent()` method in `JPanel`. The system\
