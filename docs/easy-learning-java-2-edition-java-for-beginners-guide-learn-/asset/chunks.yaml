    \ TestPerson.java`，然后输入 `java TestPerson`。\n\n结果:\n```\n我的名字是: Joseph, 今年今年 22\
    \ 岁了\n```\n\n# 封装 (Encapsulation)\n\n封装：是将数据包装成一个单一单元的机制。类的变量将对其他类隐藏，并且只能通过当前类的方法进行访问。\n\
    \n### 实现封装：\n- 将类的变量声明为 `private`（私有）。\n- 提供公共（public）setter 和 getter 方法来设置和获取变量的值。\n\
    \n### 示例：\n- 在 `Person` 类中将 `name` 和 `age` 声明为 `private`。\n- 提供公共的 `setName(String\
