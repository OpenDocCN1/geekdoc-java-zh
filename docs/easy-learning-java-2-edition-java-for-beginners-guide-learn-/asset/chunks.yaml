  trans: "\n\n点击确定按钮\n\nNotepad++ 安装成功\n\n![](img/Image00020.jpg)\n\n## 2. 第一个 Java\
    \ 程序的步骤：\n\n1. 创建一个 java 文件：`Hello.java`\n\n```java\npublic class Hello {\n  \
    \  public static void main ( String [] args ) {\n        System . out . println\
    \ ( \"I love Java\" );\n    }\n}\n```\n\n2. 打开命令提示符窗口并进入保存 java 程序（`Hello.java`）的目录\
    \ `C:\\java`。\n\n3. 输入 `javac Hello.java` 并按回车将 `Hello.java` 编译为 `Hello.class`。\n\
    \n4. 输入 `java Hello` 运行你的程序。\n\n你将看到结果：窗口上打印出 I love Java。\n\n![](img/Image00021.gif)\n\
    \n## 3. 使用 Notepad++ 创建并运行第一个 Java 程序\n\n1. 使用 Notepad++ 创建一个 java 文件：`Hello.java`\n\
    \n![](img/Image00022.jpg)\n\n点击保存按钮\n\n2. 在 `Hello.java` 中输入代码并再次保存\n\n`System.out.println()`：向控制台打印消息，然后换行\n\
    \n```java\npublic class Hello {\n    public static void main ( String [] args\
    \ ) {\n        System . out . println ( \"I love Java\" );\n    }\n}\n```\n\n\
    ![](img/Image00023.jpg)\n\n3. 打开命令提示符窗口并进入保存 java 程序（`Hello.java`）的目录 `C:\\java`。\n\
    \n输入 `javac Hello.java` 并按回车将 `Hello.java` 编译为 `Hello.class`。\n\n![](img/Image00024.jpg)\n\
    \n4. 输入 `java Hello` 运行你的程序。\n\n你将看到结果：窗口上打印出 I love Java。\n\n![](img/Image00025.jpg)\n\
    \nJava 程序是从上到下、从左到右执行的。\n\n## 4. 详细解释 Hello.java\n\n```java\npublic class Hello\
    \ {\n    public static void main ( String [] args ) {\n        System . out .\
    \ println ( \"I love Java\" );\n    }\n}\n```\n\nJava 应用程序的类定义块，每个应用程序都从类定义开始。\n\
    \n`Hello` 是类名，首字母需要大写，每个类的代码出现在左大括号和右大括号 `{ }` 之间。\n\n```java\npublic class Hello\
    \ {}\n```\n\n在 Java 编程中，每个应用程序必须包含一个 `main` 方法。\n\n`main` 方法是程序的入口。\n\n`main`\
    \ 方法接受一个名为 `args` 的单一参数，它是一个 `String` 数组。\n\n每个方法的代码出现在左大括号和右大括号 `{ }` 之间。\n\n\
    ```java\n    public static void main ( String [] args ) {\n    }\n```\n\n使用核心库中的\
    \ `System` 类向标准输出打印 \"I love Java\" 消息。\n\n核心库（也称为“应用程序编程接口”，或“API”）\n\n```java\n\
    \        System . out . println ( \"I love Java\" );\n```\n\n先记住这些概念，稍后我们会详细讨论它们。\n\
    \n### 变量\n\n**变量**：由系统分配的用于存储数据的内存区域。\n\n示例：将 \"Apple\" 放入篮子\n`basket` 是变量，\"\
    Apple\" 是赋值给 `basket` 的值。\n\n![](img/Image00026.jpg)\n\n1. 在 Notepad++ 中创建一个文件：`Variable.java`\
    \ 保存到目录 `c:\\java`\n\n`String`：是一个由双引号 `\" \"` 包围的字符序列\n例如：\"Apple\", \"12345\"\
    , \"_name\", \"Keep going\" 等。\n\n```java\npublic class Variable {\n    public\
    \ static void main(String[] args) {\n        String basket = \"Apple\" ;\n   \
    \     System . out .println(basket);\n    }\n}\n```\n\n打开 `cmd` 窗口输入 `javac Variable.java`\
    \ 然后输入 `java Variable`。\n\n你将看到结果：窗口上打印出 Apple。\n\n![](img/Image00027.jpg)\n\n\
    2. 变量的值可以改变。\n\n将变量 `basket` 的值从 \"Apple\" 替换为 \"Orange\"。\n\n![](img/Image00028.jpg)\n\
    \n双斜杠 `//`：单行注释可用于解释 Java 代码，`//` 到行尾之间的任何文本都会被 Java 忽略（不会执行）。\n\n```java\npublic\
    \ class Variable {\n    public static void main ( String [] args ) {\n       \
    \ String basket = \"Apple\" ; // 将 \"Apple\" 放入篮子\n        System . out . println\
    \ ( basket );\n        basket = \"Orange\" ; // 将 \"Orange\" 替换 \"Apple\"\n  \
    \      System . out . println ( basket );\n    }\n}\n```\n\n打开 `cmd` 窗口输入 `javac\
    \ Variable.java` 然后输入 `java Variable`。\n\n![](img/Image00029.jpg)\n\n3. 变量命名规则：\n\
    1. 由字符、下划线、`$` 组成。\n2. 首字母必须是字符或 `$`，而不是数字。\n3. 首字母需要小写。\n4. 不能使用 java 关键字（保留字）作为变量名。\n\
    \n示例：\n正确命名：`name`, `age`, `_salary` 等。\n错误命名：`1234`, `2_name`, `a@mail`, `public`\
    \ 等。\n\n在 Notepad++ 中创建一个文件：`Variable.java` 保存到目录 `c:\\java`\n\n```java\npublic\
    \ class Variable {\n    public static void main ( String [] args ) {\n       \
    \ String cup = \"mineral water\" ;\n        System . out . println ( cup );\n\
    \        String _bottle = \"juice\" ;\n        System . out . println ( _bottle\
    \ );\n        String peopleColor = \"white\" ;\n        System . out . println\
    \ ( peopleColor );\n    }\n}\n```\n\n打开 `cmd` 窗口输入 `javac Variable.java` 然后输入\
    \ `java Variable`。\n\n![](img/Image0030.jpg)\n\n### 基本数据类型\n\nJava 有 8 种基本类型（也称为原始类型）：`byte`,\
    \ `short`, `int`, `long`, `float`, `double`, `char`, `boolean`。\n\n每个基本类型的参数如下：\n\
    \n| 类别 | 类型 | 大小(bit) |\n| :--- | :--- | :--- |\n| 整数 | byte | 1 byte = 8 bits\
    \ ($-2⁷~2⁷-1$ (-128~127)) |\n| | short | 2 bytes = 16 bits |\n| | int | 4 bytes\
    \ = 32 bits |\n| | long | 8 bytes = 64 bits |\n| 浮点型 | float | 4 bytes = 32 bits\
    \ |\n| | double | 8 bytes = 64 bits |\n| 字符 | char | 2 bytes = 16 bits |\n| 布尔型\
    \ | boolean | 1 byte = 8 bits |\n\n1. 整数 (`byte`, `short`, `int`, `long`)。\n\n\
    在 Notepad++ 中创建一个文件：`DataType.java`\n\n```java\npublic class DataType {\n    public\
    \ static void main ( String [] args ) {\n        byte a1 = 1 ;\n        short\
    \ a2 = 10 ;\n        int a3 = 100 ;\n        long a4 = 1000 ;\n        System\
    \ . out . println ( a1 );\n        System . out . println ( a2 );\n        System\
    \ . out . println ( a3 );\n        System . out . println ( a4 );\n    }\n}\n\
    ```\n\n打开 `cmd` 窗口输入 `javac DataType.java` 然后输入 `java DataType`。\n\n![](img/Image0031.jpg)\n\
    \n2. 浮点型 (`float`, `double`)。\n\n编译期间，所有浮点数默认为 `double`。因此，如果你想使用 `float`，必须在数字末尾添加\
    \ `f` 或 `F` 来告诉编译器。\n\n在 Notepad++ 中创建一个文件：`DataType.java`\n\n```java\npublic\
    \ class DataType {\n    public static void main ( String [] args ) {\n       \
    \ double b1 = 10.1 ;\n        float b2 = 12.2f ; 在末尾添加 f 或 F\n        System .\
    \ out . println ( b1 );\n        System . out . println ( b2 );\n    }\n}\n```\n\
    \n打开 `cmd` 窗口输入 `javac DataType.java` 然后输入 `java DataType`。\n\n![](img/Image0032.jpg)\n\
    \n3. 字符和布尔型 (`char`, `boolean`)。\n\n`char`：是用单引号括内的单个字符，例如字母 'a'、数字 '9'、标点符号 '!'、制表符\
    \ ' '、空格 ' ' 等。\n\n转义序列：反斜杠 (`\\`) 前的字符是转义序列，对编译器有特殊含义。\n\n| 序列 | 描述 |\n| :---\
    \ | :--- |\n| `\\t` | 在此处插入一个制表符。 |\n| `\\n` | 在此处插入一个换行符。 |\n| `\\'` | 在此处插入一个单引号字符。\
    \ |\n| `\\\"` | 在此处插入一个双引号字符。 |\n| `\\\\` | 在此处插入一个反斜杠字符。 |\n\n`boolean`：布尔数据类型，只能取\
    \ `true` 或 `false` 的值。\n\n```java\npublic class DataType {\n    public static\
    \ void main ( String [] args ) {\n        char c1 = 'a' ;\n        char c2 = '9'\
    \ ;\n        String str1 = \"Good\\tJob\"; // \\t 插入一个制表符\n        String str2\
    \ = \"Keep\\nGoing\"; // \\n 插入一个换行\n        System . out . println ( c1 );\n\
    \        System . out . println ( c2 );\n        System . out . println ( str1\
    \ );\n        System . out . println ( str2 );\n        boolean d1 = true ;\n\
    \        boolean d2 = false ;\n        System . out . println ( d1 );\n      \
    \  System . out . println ( d2 );\n    }\n}\n```\n\n"
- fmt: "\n# Constant\nConstant: A constant whose value cannot change once it has been\
    \ assigned.\n\n1. the definition of a constant need be capitalized.\n2. To define\
    \ a constant, we just need to add the keyword `final` in front of the variable.\n\
    ```java\nfinal float PI = 3.14f ;\n```\nthe value of `PI` cannot change once it\
    \ has been assigned\n\n### 1. Create a file in Nodepad++: `FinalVariable.java`\n\
    \n```java\npublic class FinalVariable {\n    public static void main ( String\
    \ [] args ) {\n        final int UP = 0 ;\n        final int DOWN = 1 ;\n    \
    \    System.out.println(UP);\n        System.out.println(DOWN);\n        final\
    \ float PI = 3.14f ;\n        System.out.println(PI);\n        final boolean RUN\
    \ = true ;\n        System.out.println(RUN);\n    }\n}\n```\nOpen `cmd` type `javac\
    \ FinalVariable.java` and then type `java FinalVariable `.\n\n![](Image00034.jpg)\n\
    \n# Type Casting\nType Casting: is when you assign a value of one primitive data\
    \ type to another type.\n\nthere are two types of casting:\n\n1. **Widening Casting**:\
    \ converting a smaller type to a larger type size automatically\n   `byte -> short\
    \ -> char -> int -> long -> float -> double`\n\n2. **Narrowing Casting**: converting\
    \ a larger type to a smaller size type manually\n   `double -> float -> long ->\
    \ int -> char -> short -> byte`\n\n### 1. Widening Casting\nCreate a file in Nodepad++:\
    \ `TypeCasting.java`\n\n```java\npublic class TypeCasting {\n    public static\
    \ void main(String[] args) {\n        // converting a smaller type to a larger\
    \ type size automatically\n        byte varByte = 1;\n        int varInt = varByte;\n\
