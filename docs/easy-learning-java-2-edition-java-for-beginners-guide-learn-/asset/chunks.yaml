    2. Press up, down, left, and right keys to move the blue plane.\n3. Press enter\
    \ key to fire a bullet from the top center of the blue plane and move up.\n4.\
    \ If the bullet flies out of the top of the screen and the bullet disappears,\
    \ press enter key can relaunch.\n5. Enemy plane appear randomly from the top of\
    \ the screen and move down.\n6. If the enemy’s plane flies out of the bottom of\
    \ the screen, the enemy’s plane disappears and reappears randomly from the top\
    \ of the screen.\n7. If the bullet hits the enemy’s plane, the enemy plane explode\
    \ and disappear.\n\n## Analysis\n\n### 1. Class\n`BluePlane`, `EnemyPlane`, `Bullet`,\
    \ `Canvas`\n\n### 2. Relationship\nIn the game `BluePlane`, `EnemyPlane`, and\
    \ `Bullet` are called `Sprite`. Because they have the same attributes and methods,\
    \ We can define `Sprite` as an abstract class , `BluePlane`, `EnemyPlane`, and\
    \ `Bullet` inherit the attribute and methods from `Sprite`. All the `Sprite` will\
    \ draw and move on `Canvas`.\n\n![](Image00149.jpg)\n\n### 3. Attributes\n3.1\
    \ All the `Sprite` will draw on `Canvas`. So `Sprite` has `x`, `y` coordinates,\
    \ `image` and the width and height of image.\n3.2 `Sprite` will appear randomly\
    \ and may disappear, so it has `visible` attribute. `BluePlane`, `EnemyPlane`,\
    \ and `Bullet` inherit these attributes.\n3.3 `Canvas` also have the width and\
    \ height, we can define: `canvasWidth` and `canvasHeight`.\n\n![](Image00150.jpg)\n\
    \n### 4. Methods\n4.1 `Sprite` need load image : we can create a class `ImageUtil`\
    \ and a method `BufferedImage loadImage(String imagePath)` to load image, we can\
    \ create a constructor method `Sprite(int x, int y, String imagePath)` pass the\
    \ `imagePath` and then call the `loadImage(String imagePath)` to load image.\n\
    4.2 `Sprite` draw on `Canvas`: we can create a method `draw(Graphics g)`.\n4.3\
    \ `Sprite` moves: we can create a method `move(int distanceX, int distanceY)`\
    \ `distanceX`, `int distanceY` indicates the distance moved in the X and Y axis.\n\
    4.4 the bullet hits the enemy’s plane: we can create a method `collideWith(Sprite\
    \ sprite)`.\n4.5 The attribute `x`, `y`, `width`, `height`, `visible` has its\
    \ own public getter and setter methods.\n\n![](Image00151.jpg)\n\n#### bullet\
    \ collided with the enemy plane\nThe absolute value of the difference between\
    \ the center coordinates of the two pictures is less than the sum of half of their\
    \ width and height, we think they have an intersection and they are collided.\n\
    \n| `Math.abs()`: returns the absolute value of a given argument.Example: `Math.abs(\
    \ 10 ) = 10`, `Math.abs( -10 ) = 10` |\n\n![](Image00152.jpg)\n\n4.6 `Sprite`\
    \ draw on the `Canvas`: we need create a constructor method `Canvas()` to initialize\
    \ `BluePlane`, `EnemyPlane`, and `Bullet` and then draw on the `Canvas` in method\
    \ `paintComponent(Graphics g)`.\n\n```java\n  public Canvas() {\n      this .setLayout(\
    \ null );\n      this .setBackground(Color. WHITE );\n      this .requestFocus();\n\
    \      bluePlane = new BluePlane(100, 200, \"images/blue_plane.png\" );\n    \
    \  bullet = new Bullet(-100, -100, \"images/blue_bullet.png\" );\n      bullet\
    \ .setVisible( false );\n      enemyPlane = new EnemyPlane(-100, -100, \"images/enemy.png\"\
    \ );\n      enemyPlane .setVisible( false );\n      canvasThread = new CanvasThread();\n\
    \      canvasThread .start();\n  }\n```\n\n```java\n  protected void paintComponent(Graphics\
    \ g) {\n      this . canvasWidth = this .getWidth();\n      this . canvasHeight\
    \ = this .getHeight();\n      super .paintComponent(g);\n      bluePlane .draw(g);\n\
    \      bullet .draw(g);\n      enemyPlane .draw(g);\n  }\n```\n\n4.7 Press up,\
    \ down, left, and right keys to move the blue plane: We want to add mouse and\
    \ key listeners to a `Canvas`: `this.addKeyListener(new KeyAdapter())`. When we\
    \ press any keys the method `keyPressed(KeyEvent e)` will called.\n\n![](Image00153.jpg)\n\
    \n```java\n  this .addKeyListener( new KeyAdapter() {\n      public void keyPressed(KeyEvent\
    \ e) {\n          int keyCode = e.getKeyCode();\n          if (keyCode == KeyEvent.UP\
    \ ) {\n              bluePlane .move(0, -10);\n          } else if (keyCode ==\
    \ KeyEvent.DOWN ) {\n              bluePlane .move(0, 10);\n          } else if\
    \ (keyCode == KeyEvent.RIGHT ) {\n              bluePlane .move(10, 0);\n    \
    \      } else if (keyCode == KeyEvent.LEFT ) {\n              bluePlane .move(-10,\
    \ 0);\n          }\n      }\n  });\n```\n\n4.8 Press enter key to fire a bullet\
    \ from the top center of the blue plane and move up:\n\n![](Image00154.jpg)\n\n\
    4.9 If the bullet `visible=true` move up on `Canvas`:\n\n```java\n    public void\
    \ bulletMove(){\n      if ( bullet .isVisible()){\n          bullet .move(0, -10);\n\
    \      }\n  }\n```\n\n4.10 If the bullet flies out of the top of the screen and\
    \ the bullet disappears set `visible=false`.\n\n![](Image00155.jpg)\n\n4.11 Enemy’s\
    \ plane appear randomly from the top of the screen and move down:\n\n![](Image00156.jpg)\n\
    \n4.12 When the `enemyplane` move out of the canvas, the enemy plane need be destroyed\
