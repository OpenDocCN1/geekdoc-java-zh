    \ buy(String fruit);\n}\n```\n\n儿子完成了父亲买水果的任务，这意味着方法 `buy()` 有了具体的实现。\n\n```java\n\
    class Son extends Father {\n    public void buy(String fruit) {\n        System.out.println(\"\
    Dad, I bought some : \" + fruit);\n    }\n}\n```\n\n### 1. 创建文件：`TestAbstract.java`\n\
    \n```java\nabstract class Father {\n    //父亲让儿子去买水果，但父亲自己不买\n    public abstract\
    \ void buy(String fruit);\n}\n\nclass Son extends Father {\n    // 儿子履行了父亲买水果的要求\n\
    \    public void buy(String fruit) {\n        System.out.println(\"Dad, I bought\
    \ some : \" + fruit);\n    }\n}\n\npublic class TestAbstract {\n    public static\
    \ void main(String[] args) {\n        Father f = new Son();\n        f.buy(\"\
    Apples\");\n    }\n}\n```\n\n**结果：**\n```\nDad, I bought some : Apples\n```\n\n\
    ### 2. 抽象类也可以有自己的方法实现\n\n**示例：**\n`Father` 现在正在工作，所以让儿子去买一些水果。\n\n**分析：**\n1.\
    \ 方法：`Father` 有两个方法：`work()` 和 `abstract buy()`\n\n**创建文件：`TestAbstract.java`**\n\
    \n```java\nabstract class Father {\n    public void work() {\n        System.out.println(\"\
    Father is working now.\");\n    }\n    public abstract void buy(String fruit);\n\
    }\n\nclass Son extends Father {\n    public void buy(String fruit) {\n       \
    \ System.out.println(\"Dad, I bought some : \" + fruit);\n    }\n}\n\npublic class\
    \ TestAbstract {\n    public static void main(String[] args) {\n        Father\
    \ f = new Son();\n        f.work();\n        f.buy(\"Apples\");\n    }\n}\n```\n\
    \n**结果：**\n```\nFather is working now.\nDad, I bought some : Apples\n```\n\n---\n\
    \n## 接口\n\n`interface`：是实现抽象的另一种方式，用于将具有空方法体的方法方法在一起，子类必须实现该接口及其空方法。\n\n**示例：**\n\
    老板雇佣员工工作。\n\n**分析：**\n1. `interface`：`Boss`\n2. 实现类：`Employee`\n3. 关系：`Employee`\
    \ 实现 `Boss`\n4. 方法：`work()` 老板雇佣员工工作，老板自己不执行这项工作。\n\n![](img/Image00077.jpg)\n\
    \n接口方法在声明时没有实现。\n老板雇佣员工工作，老板自己不执行这项工作。\n这意味着方法：`work()` 没有实现。\n\n```java\ninterface\
    \ Boss {\n    public void work();\n}\n```\n\n员工去工作，这意味着方法：`work()` 有了实现。\n\n```java\n\
    class Employee implements Boss {\n    public void work() {\n        System.out.println(\"\
    Employee start to work\");\n    }\n}\n```\n\n### 1. 创建文件：`TestInterface.java`\n\
    \n```java\ninterface Boss {\n    //老板雇佣员工工作，老板自己不执行这项工作。\n    public void work();\n\
    }\n\nclass Employee implements Boss {\n    // 员工去工作\n    public void work() {\n\
    \        System.out.println(\"Employee start to work\");\n    }\n}\n\npublic class\
    \ TestInterface {\n    public static void main(String[] args) {\n        Boss\
    \ b = new Employee();\n        b.work();\n    }\n}\n```\n\n**结果：**\n```\nEmployee\
    \ start to work\n```\n\n**注意：**\n1. 接口中的方法允许没有实现。\n2. 接口方法默认是 public 的。\n3. 接口属性是\
    \ public 的。\n4. 子类必须实现接口中所有声明的方法。\n\n###2. 子类只能继承一个类，但可以实现多个接口。\n\n**示例：**\n老板雇佣员工工作，让员工学习。\n\
    \n**分析：**\n1. `interface`：`Boss`, `Manager`\n2. 实现类：`Employee`\n3. 关系：`Employee`\
    \ 实现 `Boss`, `Manager`\n4. 方法：`work()` 老板雇佣员工工作，老板不执行这项工作；`learn()` 让员工学习，老板不执行这项工作。\n\
    \n![](img/Image0078.jpg)\n\n**创建文件：`TestInterface.java`**\n\n```java\ninterface\
    \ Boss {\n    //老板雇佣员工工作，老板不执行这项工作。\n    public void work();\n}\n\ninterface Manager\
    \ {\n    //让员工学习，老板不执行这项工作。\n    public void learn();\n}\n\nclass Employee implements\
    \ Boss, Manager {\n    // 员工去工作\n    public void work() {\n        System.out.println(\"\
    Employee start to work\");\n    }\n    // 员工学习\n    public void learn() {\n  \
    \      System.out.println(\"Employee start to learn\");\n    }\n}\n\npublic class\
    \ TestInterface {\n    public static void main(String[] args) {\n        Boss\
    \ b = new Employee();\n        b.work();\n        Manager m = new Employee();\n\
    \        m.learn();\n    }\n}\n```\n\n**结果：**\n```\nEmployee start to work\nEmployee\
    \ start to learn\n```\n\n---\n\n##举\n\n`enum`：是一种特殊的数据类型，允许变量是一个常量集合。变量必须等于预定义值之一。\n\
    \n**示例：**\n绘制不同的颜色。\n\n![](img/Image0079.gif)\n\n**分析：**\n1. `enum`：`Color (RED,\
    \ BLUE)`\n2. `class`：`Circle`\n3. 方法：`draw()` 不同的颜色。\n\n定义 `enum` 类型：\n```java\n\
    enum Color {\n    RED, GREEN, BLUE\n}\n```\n![](img/Image0080.gif)\n\n### 1. 创建文件：`TestEnum.java`\n\
    \n```java\n//定义枚举类型\nenum Color {\n    RED, GREEN, BLUE\n}\n\nclass Circle {\n\
    \    // 绘制不同的颜色\n    public void draw(Color color) {\n        String colorName\
    \ = \"\";\n        if (color == Color.RED) {\n            colorName = \"Red\"\
    ;\n        } else if (color == Color.GREEN) {\n            colorName = \"Green\"\
    ;\n        } else if (color == Color.BLUE) {\n            colorName = \"Blue\"\
    ;\n        }\n        System.out.println(\"draw \" + colorName + \" circle\");\n\
    \    }\n}\n\npublic class TestEnum {\n    public static void main(String[] args)\
    \ {\n        Circle circle = new Circle();\n        circle.draw(Color.RED);\n\
    \        circle.draw(Color.GREEN);\n        circle.draw(Color.BLUE);\n    }\n\
    }\n```\n\n**结果：**\n```\ndraw Red circle\ndraw Green circle\ndraw Blue circle\n\
    ```\n\n---\n\n## 内部类\n\n`Inner class`：是一种安全机制。如果我们把类作为另一个类的成员，那么内部类就可以设为私有。\n\n\
    **示例：**\n母亲怀孕，婴儿从母亲那里获得食物。\n\n**分析：**\n1. `class`：`Mother`, `Baby`\n2. 关系：`Baby`\
    \ 在 `Mother` 内部\n3. 方法：`Mother eat(food)`, `Baby eat()` 来自 `Mother`。\n\n![](img/Image0081.gif)\n\
    \n先定义 `Mother` 类，然后在 `Mother` 类内部定义 `Baby` 类。\n\n```java\nclass Mother {\n   \
    \ public void eat(String food) {\n        Baby baby = new Baby();\n        baby.eat();\n\
    \    }\n    class Baby {\n        public void eat() {\n        }\n    }\n}\n```\n\
    \n### 1. 创建文件：`TestInnerClass.java`\n\n```java\nclass Mother {\n    private String\
    \ food;\n    public void eat(String food) {\n        this.food = food;\n     \
    \   System.out.println(\"Mother eat \" + food);\n        // 婴儿从食物中吸收营养\n     \
    \   Baby baby = new Baby();\n        baby.eat();\n    }\n    // 婴儿是母亲的内部类\n  \
    \  private class Baby {\n        public void eat() {\n            System.out.println(\"\
    Baby absorb nutrients from the mother's \" + food);\n        }\n    }\n}\n\npublic\
    \ class TestInnerClass {\n    public static void main(String[] args) {\n     \
    \   Mother mother = new Mother();\n        mother.eat(\"Apple\");\n    }\n}\n\
    ```\n\n**结果：**\n```\nMother eat Apple\nBaby absorb nutrients from the mother's\
    \ Apple\n```\n\n---\n\n## IDE Eclipse 安装\n\n现在是使用 IDE(`Eclipse`) 的时候了，因为你已经学习了\
    \ Java 基础知识和经验。\n\n`Eclipse`：是著名的 Java 集成开发环境（IDE），常安卓开发。Eclipse 是跨平台的，可以在 Windows、Linux\
    \ 和 Mac OS 上运行。\n\n1. 下载 Eclipse 开发工具：`eclipse-jee-mars-2-win32-x86_64.zip`。\n\
    \n[`www.eclipse.org/downloads/`](https://www.eclipse.org/downloads/)\n\n![](img/Image0082.jpg)\n\
    \n2. 双击 `eclipse.exe` 打开。\n\n![](img/Image0083.jpg)\n\n3. 双击 `eclipse.exe` 打开。\n\
    \n![](img/Image0084.jpg)\n\n"
- fmt: "\n# Workspace\nWorkspace contains resources such as: `Projects`, `Files`,\
    \ `Folders` etc. The workspace has a hierarchical structure. `Projects` are at\
    \ the top level of the hierarchy and inside them you can have files and folders.\n\
    \n![](Image00085.jpg)\n\nClick OK Button\n\n![](Image00086.jpg)\n\n# Create a\
    \ new Java Project\n4. Click `File` -> `New` -> `Project`\n\n![](Image00087.jpg)\n\
    \n5. Select `Java Project` and then click `Next` button\n\n![](Image00088.jpg)\n\
    \n6. Enter the Project name: `test` and then click `Finish` button\n\n![](Image00089.jpg)\n\
    \n# Project: test\n7. `Project: test` has a hierarchical structure.\n\n- `src`:\
    \ it's a foder the source code files are stored.\n- `JRE System Library`: is added\
    \ by Eclipse automatically on creating Java Projects. `JRE System Library` implements\
    \ the Java API in Eclipse. So all the predefined methods of Java, can be accessed\
    \ by the Java Programs written in Eclipse.\n\n![](Image00090.jpg)\n\n# Create\
    \ a class\n8. Create a class: `Hello`, Right click `src` and then `New` -> `Class`\n\
    \n![](Image00091.jpg)\n\n9. Input class Name: `Hello`, and then click `Finish`\
    \ button\n\n![](Image00092.jpg)\n\n10. Double click `Hello.java` in project: `test`\n\
    \n![](Image00093.jpg)\n\n11. Input code in `main` method:\n\n```java\nSystem.out.println(\"\
    Hello World!\");\n```\n\nRight click `Hello.java` and then `Run As` -> `Java Application`\n\
    \n![](Image00094.jpg)\n\n12. Eclipse will automatically compile `Hello.java` into\
    \ `Hello.class`, and then run `Hello`, the result will be printed in the `Console`\
    \ panel.\n\n![](Image00095.jpg)\n\n# String\n`String`: is a java default class\
    \ represents character strings. `Strings` are constant; their values cannot be\
    \ changed after they are created.\n\n## 1. String Comparison\n`equals()` method\
    \ and the `==` operator is used to compare two `String`.\n\n```java\nString str1\
    \ = \"hello\";\nString str2 = \"hello\";\nSystem.out.println(str1.equals(str2));\
    \ // =true\nSystem.out.println(str1 == str2); // = true\n```\n`str1` and `str2`\
    \ point to the same \"hello\" object in the string pool, so `equals()` and `==`\
    \ is true ![](Image00096.gif)\n\n```java\nString str1 = \"hello\";\nString str2\
    \ = new String(\"hello\");\nSystem.out.println(str1.equals(str2)); // =true\n\
    System.out.println(str1 == str2); // =false\n```\nWhy `str1.equals(str2)` is true\
    \ but `str1 == str2` is false?\nBecause `str1` \"hello\" created in `String Pool`,\
    \ the `str2` `new String(\"hello\")` created in `Heap`. The `==` operator compares\
    \ reference, but `equals()` compares the value of `String`. `str1` and `str2`\
    \ have the same value, but different reference. ![](Image00097.gif)\n\n## 2. String\
    \ replace (char oldChar, char newChar)\nReturns a new string resulting from replacing\
    \ all occurrences of `oldChar` in this string with `newChar`.\nReplace all `||`\
    \ to `,`\n\n```java\nString person = \"David||30||Male||Married\";\nperson = person.replace(\"\
    ||\", \",\");\nSystem.out.println(person);\n```\nResult: `David,30,Male,Married`\n\
    \n## 3. boolean startsWith(String prefix)\nTests if this string starts with the\
    \ specified `prefix`.\nTest if the file path starts with `c:`\n\n```java\nString\
    \ path = \"c:/video/forever.mp4\";\nSystem.out.println(path.startsWith(\"c:\"\
    ));\n```\nResult: `true`\n\n## 4. boolean endsWith(String suffix)\nTests if this\
    \ string ends with the specified `suffix`.\nTest if the file path ends with `.mp4`\n\
    \n```java\nString path = \"c:/video/forever.mp4\";\nSystem.out.println(path.endsWith(\"\
    .mp4\"));\n```\nResult: `true`\n\n## 5. int indexOf(char ch)\nfind the first index\
    \ of the `ch` in string from left to right. The index of the string starts at\
    \ `0` ![](Image00098.gif)\n\n```java\nString path = \"c:/video/forever.mp4\";\n\
    int index = path.indexOf(\"/\");\nSystem.out.println(index);\n```\nResult: `2`\n\
    \n## 6. int lastIndexOf(char ch)\nfind the first index of the `ch` in string from\
    \ right to left. find the first index of `/` in path from right to left.\n\n```java\n\
    String path = \"c:/video/forever.mp4\";\nint lastIndex = path.lastIndexOf(\"/\"\
    );\nSystem.out.println(lastIndex);\n```\nResult: `8`\n\n## 7. String trim()\n\
    Remove whitespace from both sides of a string.\n\n```java\nString str = \" aa\
    \ bb  \";\nstr = str.trim();\nSystem.out.println(str);\n```\nResult: `aa bb`\n\
    \n## 8. String substring(int beginIndex)\ncut string from the `beginIndex` to\
    \ the end. Get the name of file extension ![](Image0099.gif)\n\n```java\nString\
    \ path = \"c:/video/forever.mp4\";\nString str = path.substring(path.lastIndexOf(\"\
    .\"));\nSystem.out.println(str);\n```\nResult: `.mp4`\n\n## 9. String substring(int\
    \ beginIndex, int endIndex)\ncut string from the `beginIndex` to the `endIndex`\
    \ ![](Image0100.gif)\n\n```java\nString path = \"c:/video/forever.mp4\";\nString\
    \ str = path.substring(path.indexOf(\"/\") + 1, path.lastIndexOf(\"/\"));\nSystem.out.println(str);\n\
    ```\nResult: `video`\n\n## 10. String split(String regex)\nSplit a string into\
    \ an array with `regex`. Grace's language, math and physics scores are separated\
    \ by semicolons; please each subject score by `;`\n\n```java\nString scores =\
    \ \"100;98;95\";\nString[] scoreArray = scores.split(\";\");\nSystem.out.println(\"\
    Language=\" + scoreArray[0]);\nSystem.out.println(\"Math =\" + scoreArray[1]);\n\
    System.out.println(\"Physics=\" + scoreArray[2]);\n```\nResult:\n`Language=100`\n\
    `Math =98`\n`Physics=95`\n\n## 11. toLowerCase()\nConverts all of the characters\
    \ to lower case\n\n```java\nString sentense = \"FAITH HOPE AND LOVE\";\nsentense\
    \ = sentense.toLowerCase();\nSystem.out.println(sentense);\n```\nResult: `faith\
    \ hope and love`\n\n## 12. toUpperCase()\nConverts all of the characters to upper\
    \ case\n\n```java\nString sentense = \"faith hope and love\";\nsentense = sentense.toUpperCase();\n\
    System.out.println(sentense);\n```\nResult: `FAITH HOPE AND LOVE`\n\n## 13. StringBuilder\n\
    `StringBuilder` are like `String` except that they can be modified. Internally,\
    \ these objects are treated like variable-length arrays that contain a sequence\
    \ of characters.\n\n### Use String concatenate a large number of strings\n```java\n\
    public static void main(String[] args) {\n    String str = \"\";\n    for (int\
    \ i=0; i<5; i++){\n        str += \" day \";\n    }\n    System.out.println(str);\n\
    }\n```\nResult: `day day day day day`\n\n### Use StringBuilder concatenate a large\
    \ number of strings\n```java\npublic static void main(String[] args) {\n    StringBuilder\
    \ sb = new StringBuilder();\n    for (int i=0; i<5; i++){\n        sb.append(\"\
    \ day \");\n    }\n    System.out.println(sb.toString());\n}\n```\nResult: `day\
    \ day day day day`\n\n**Notes:** `StringBuilder` offer an advantage and better\
    \ performance. if you need to concatenate a large number of strings, appending\
    \ to `StringBuilder` is more efficient.\n\n# Primitive Types and Wrapper Classes\n\
    Wrapper class: is a class whose object wraps or contains primitive data types.\
    \ When we create an object to a wrapper class, we can store primitive data types.\
    \ we can wrap a primitive value into a wrapper class.\n\n## Java Primitive Type\
    \ and Corresponding Wrapper Classes\n| Primitive Type | Wrapper Class |\n| :---\
    \ | :--- |\n| byte | Byte |\n| short | Short |\n| int | Integer |\n| long | Long\
    \ |\n| float | Float |\n| double | Double |\n| char | Character |\n| boolean |\
    \ Boolean |\n\n## 1: Primitive type convert to Wrapper Class\n```java\nint age\
    \ = 20;\nInteger ageObj = new Integer(age);\nSystem.out.println(ageObj);\n```\n\
    Result: `20`\n\n## 2: Wrapper Class convert to Primitive type\n```java\nInteger\
    \ ageObj = new Integer(20);\nint age = ageObj.intValue();\nSystem.out.println(age);\n\
    ```\nResult: `20`\n\n## 3: Primitive type convert to String\n`String.valueOf()`:\
    \ converts different types of values into string.\n\n```java\nint age = 20;\n\
    String ageStr = String.valueOf(age);\ndouble money = 1000.5;\nString moneyStr\
    \ = String.valueOf(money);\nSystem.out.println(ageStr);\nSystem.out.println(moneyStr);\n\
    ```\nResult:\n`20`\n`1000.5`\n\n## 4: String convert to Primitive type\n`Integer.parseInt(String\
    \ str)`: convert String to `Integer`.\n`Float.parseFloat(String str)`: convert\
    \ String to `Float`.\n`Double.parseDouble(String str)`: convert String to `Double`.\n"
