    \ | :--- |\n| `\\t` | Insert a tab in the text at this point. |\n| `\\n` | Insert\
    \ a newline in the text at this point. |\n| `\\'` | Insert a single quote character\
    \ in the text at this point. |\n| `\\\"` | Insert a double quote character in\
    \ the text at this point. |\n| `\\\\` | Insert a backslash character in the text\
    \ at this point. |\n\n`boolean`: boolean data type which can only take the values\
    \ `true` or `false`.\n\n```java\npublic class DataType {\n    public static void\
    \ main ( String [] args ) {\n        char c1 = 'a' ;\n        char c2 = '9' ;\n\
    \        String str1 = \"Good\\tJob\"; // \\t Insert a tab\n        String str2\
    \ = \"Keep\\nGoing\"; // \\n Insert a newline\n        System . out . println\
    \ ( c1 );\n        System . out . println ( c2 );\n        System . out . println\
    \ ( str1 );\n        System . out . println ( str2 );\n        boolean d1 = true\
    \ ;\n        boolean d2 = false ;\n        System . out . println ( d1 );\n  \
    \      System . out . println ( d2 );\n    }\n}\n```\n"
