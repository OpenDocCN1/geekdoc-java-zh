    太阳公司恢复了过来，但并未完全恢复。在 20 世纪 90 年代后期，太阳公司的格言是“我们是.com 中的点”，这并非完全是虚张：许多严肃且成功的公司都使用太阳的产品进行计算。泡沫破灭的冲击波击中了太阳公司，使其跌出了顶尖位置。在
    2007 年至 2009 年的大经济衰退期间，它又遭受了打击。很快，市场上出现了关于 IBM 收购太阳**的传闻，尽管这笔交易从未实现。在计算机行业顶端屹立了
    27 年后，太阳股份的股东以 56 亿美元的价格将公司卖给了甲骨文公司（Oracle）。甲骨文开始了大规模的裁员，顶尖工程师相继辞职，而创始人们——Bechtolsheim、McNealy、Khoslaall
    和 Joy——随后作为投资者、发明家和后期初创公司的经理继续了成功的职业生涯。如今，他们仍然活跃在计算机行业中。


    一台个人电脑固然强大，但一个由数百万乃至数十亿台电脑组成的网络将拥有字面上的无限潜力。太阳微系统并没有将个人电脑置于计算世界的核心，而是鼓励其员工和客户首先考虑网络。真正的力量不在于个人电脑，而在于数十亿台电脑可以相互连接这一事实。这对太阳公司的经营模式产生了巨大影响。公司开始将互联互通作为终极目标。McNealy
    想象的“力量”部分源于信息的无限共享。如果一个人发明了某种东西并将其据为己有，那么这项技术将停留在目前的发展水平，直到发明者找到改进它的理由方法。但如果每一项新发明都能立即共享，所有的部分和过程都与世界上所有的创新者共享，那么你完全可以赌，其中某些人会立即找到改进该发明的方法。正因为
    Scott McNealy 以及其他认同他信念的人的态度，如今的互联网很大程度上就是这样运作的。我们称之为开源模型。开源意味着某项内容的原始代码（或“源代码”）是免费供人们学习和修改的。当有人发明一种新工具或语言时，他们通常会通过网络向全世界分享这些信息，赋予他人改进他们所创造的机会。这加快了技术发展的速度；你甚至可以说它加快了人类历史的进程。


    牢记“网络就是计算机”的格言，由 Gosling 领导的 FirstPerson 研究人员开始开发类似于 Mosaic 的浏览器，该浏览器将使用他们为现在已废弃的`7
    device`创建的语言。他们研究了快速发展的科技行业的不同领域，访问欧洲和亚洲的消费电子制造商。他们认为这些消费电子产品——如 CD 播放器、传真机、手机、相机、收音机甚至玩具直升机——正处于与互联网的“碰撞轨道”。换句话说，他们看到了我们现在已知的未来。他们知道自己正在创造某种强大的东西，也许强大到足以改变世界。但也知道，如此重要的东西需要一个比
    Oak 更好的名字。


    ## 名字的含义


    “Oak”行不通。在太阳开发者之间将其作为代号使用没问题，但另一家名为 Oak Technologies 的公司已经注册了该名称的商标，因此太阳员工在公开他们的新想法之前，必须想出别的名字。


    Oak 产品经理 Kim Polese 将整个开发新技术的团队聚聚在一间房间里，前面有一块白板。那是 1995 年 1 月，太阳公司几乎已准备好推出他们的新技术。这将是一场老式的头脑风暴会议。Polese
    想要一个能够捕捉该语言和平台“本质”的名字——某种“动态、革命、活泼、有趣”的东西。团队成员开始喊出名字，Polese 将它们写在白板上。那天现场的人记得建议的几个名字：Ruby、Silk、Neon、WRL（代表
    WebRunner Language）、DNA、Lyric、Pepper。Gosling 回忆那场会议是“疯狂”，至少有十几个人喊出单词，然后对这些建议争论激烈。他们成功地将名单缩小到大约十几个决赛者，并将这些名单发给了律师。法律团队建议，只有`Java`、`DNA`和`Silk`是安全的选择。


    一位程序员 Arthur Van Hoff 将另一位同事 Chris Warth 归为第一个喊出“Java”的人。Warth 不记得自己是否提过“Java”这个名字，但他确实承认在会议期间手里拿着的一杯`Peet’s
    Java`——那是当时太阳公司的首选咖啡。


    Java 有时用作咖啡的同义词，但实际上它是组成印度尼西亚群岛岛屿之一的名字。17 世纪末，荷兰商人从他们的印度殖民地将原产于埃塞俄比亚的咖啡植物带到了印度尼西亚。在十年内，荷兰东印度公司就开始向欧洲运送第一批待售的“Java
    豆”。今天，印度尼西亚是世界第四大咖啡生产国。


    ## James Gosling


    ![Gosling](img/main-11.jpg)


    留着齐肩的灰发、整齐的胡须，并戴着他在 20 世纪 70 年代戴过的同一副眼镜，今天的 Gosling 看起来就像旧金山地区的圣诞老人。Gosling 博士于
    1955 年出生于加拿大阿尔伯塔省，是一位因在 Java 方面的工作而最闻名的计算机科学家。他在卡尔加里大学获得学士学位，在卡内基·梅隆大学获得硕士和博士学位，并于
    1983 年完成了博士论文。一年内，他受雇于太阳微系统公司担任软件开发人员，那是一家年轻且快速增长的公司。1984 年至 2010 年间，Gosling 在太阳公司工作，在那里领导了创建
    Java 的团队。虽然许多研究人员和程序员都参与了 Java 的发明，但大多数人将 Gosling 视为该语言和平台的“之父”。Gosling 在 90 年代初发明了
    Java 的前身语言 Oak，他是帮助太阳开发者以及整个世界的注意力转向互联网的关键人物。


    另一家科技公司甲骨文在 2009 年收购了太阳，正如合并和收购中常见的情况，公司文化发生了变化。根据 Gosling 的说法，他面临了降薪和降职，并失去了在太阳公司工作
    26 年来所享有的许多自由。一年后，他离开了这家他帮助改变世界的公司。


    在休息了一段时间后，Gosling 加入了谷歌，担任软件工程师。Gosling 并非首位加入谷歌的前太阳员工。许多在他之前就去那里了，而且谷歌利用 Java
    创建了广受欢迎的安卓手机，安卓已经超过了 iPhone 成为市场上最受欢迎的移动设备。然而，甲骨文坚信谷歌使用大量的 Java 代码违反了法律。作为所有者，他们决心起诉谷歌并获得巨额赔偿。Gosling
    在谷歌的短暂任期内处于尴尬的境地，对这起诉讼并没有多说。

    '
- fmt: '

    After just six months there, he moved to Liquid Robotics, where he is currently
    Chief Software Architect. Now he makes intelligent robots that collect data from
    the ocean. Some of his recent projects include improving car safety and working
    toward safer self-driving cars. He has been a longtime board member of `DIRTT`,
    an environmentally conscious interior design and construction company, and he
    has shared his interest in reforming the American health care system using some
    of the principles that helped create `Java`. He still speaks regularly to audiences
    of `Java` developers and enthusiasts, and journalists often ask him to speculate
    about future uses for the language.


    ![](images/main-13.jpg)


    No programming language influenced smartphones more than `Java`—a good name for
    our on-the-go culture.


    Facing pressure from the engineers eager to get their work out into the world,
    Kim Polese, in charge of marketing, would have made the final decision, after
    testing the name on friends, colleagues, and family members. No one can know for
    sure if the language and platform now known as “Java” would have been so successful
    under a different name, but it is clear that the name “Java” didn’t hurt. The
    name seems to suggest everything its makers hoped it would: “Java” still sounds
    energetic, hopeful, exotic, swift, jazzy, and hip. Gosling, Warth, and the others
    probably weren’t thinking about the island, about Dutch and Southeast Asian colonial
    history, or even about the economics of the global coffee trade, but they unwittingly
    named their soon-to-be breakout, revolutionary brand after another product, the
    drinkable `Java`, that had changed the world centuries before. The name fit. Today,
    `Java` remains the most popular programming language used, and developers continue
    to think up new uses for it every day.


    ## The Debut: When the World First Imagined What Java Could Do


    The news that `Java` was going to be demonstrated to the public came as a surprise
    to James Gosling. His coworker John Gage came into Gosling’s office one day in
    early 1995 and asked to borrow some cables and desktop systems. He said, casually,
    that he was going to a conference of Hollywood and Silicon Valley big shots, to
    demonstrate the `WebRunner` browser the `Java` team had been working on—secretly.
    Afraid that their work-in-progress might crash in front of this influential audience,
    Gosling came along for the ride, as a troubleshooter.


    The demonstration started without difficulty, but Gosling noticed that the audience
    wasn’t paying much attention. People weren’t very excited about the fact that
    a new language they didn’t understand powered a version of a web browser that
    looked a lot like a web browser that already existed. Seeing this, Gosling made
    a series of motions that you, too, have made countless times. He dragged his cursor
    across the screen to a little 3D graphic of a molecule. Remember, the graphic
    alone wasn’t exciting—developers had already placed images and videos within web
    pages. But Gosling did something on the screen that no one in the audience had
    ever seen before. He clicked his mouse, and dragged it downward. The molecule
    moved.


    ![](images/main-14.jpg)


    `Java` powers your smartphone, but it also helps to run massive supercomputers.
    This property is called scaling.


    It doesn’t seem like much, but that small movement was revolutionary. For the
    first time ever, users could interact with web pages. Gosling and Gage demonstrated
    other uses for their language, including an `applet`—or a program that performs
    a small task—that sorted lines of different lengths. Again, this doesn’t seem
    impressive now, but it demonstrated what would soon become possible with `Java`.


    The old “Green Team” released `Java` to friends a month later, and then to the
    entire internet after that, and watched as the downloads climbed into the hundreds,
    then past ten thousand, then past one million. They took turns dealing with thousands
    of emails each day. Even bigger news came when the executives of the company `Netscape`
    announced that they would start using `Java` in `Navigator`, their popular web
    browser. It was becoming clear then that `Java` would help to shape the future
    of the internet.


    After that, `Java` became the most popular computer programming language. Many
    new languages have debuted since `Java`s release, and a few other, very different
    languages compete with it for loyalty from programmers, but `Java` has been an
    enormous influence on most languages that have come to follow. `Java` was hugely
    influential in the development of smartphones and other technologies, because
    `Java` can work across different operating systems, and it can scale easily, which
    means that it can work in small consumer electronics and smartphone apps (like
    `Pokemon Go`) as well as big things, like supercomputers. More important than
    any one technical accomplishment, though, is that `Java` changed the way we think
    about computers, about our relationship with computers, and about what we can
    accomplish with them. To understand that, though, you need to know a little bit
    more about how `Java` works.


    ![Image](page31_image2.jpg)


    Opposite: Every programming language has different features. Choosing a language
    for a project depends on your goals.


    ![](images/image_003_.jpg)


    ## How It Works


    So far we’ve mostly referred to `Java` as a language, but to understand how it
    works—and why it was revolutionary—we have to understand `Java` as both a language
    and a platform. In this chapter, you’ll learn the `Java` basics: what it looks
    like, what it does, and what makes it unique. We’ll explain how something no speaks
    can be a language and discuss the features that helped computer industry.


    ### What Is Language?


    You can’t use `Java` to ask questions—but you can use it to command. You can’t
    use `Java` to write poems—but it powers parts of websites like `YouTube` and `SoundCloud`,
    where creative people share their art. Even though it doesn’t look like the English
    you’re reading right now, `Java` is a language.


    Your first language was something you learned without realizing it. It was part
    of your environment. You probably can’t remember learning your first language,
    because it happens so early. Most of us become fluent in our first language without
    really trying and only later learn the rules. Your parents made noises at you,
    and your incredibly powerful baby-brain first memorized a few and commanded your
    little lungs, throat, tongue, and lips to move and make those same noises. At
    the same time, you started noticing patterns. If you learn a new language, whether
    in school or moving to a new community, the process might be difficult and take
    a long time, but you’re still learning a set of rules that evolved over thousands
    of years. In spoken languages like English and Spanish and Afrikaans, new words
    pop up seemingly out of nowhere each year, people regularly break the rules of
    grammar, and people speaking the same language but in different places on Earth
    will refer to the same thing with different words. British and American people
    both speak English, but the British call the back of a car the “boot,” while Americans
    call it the “trunk.” The British wear trainers, Canadians wear runners, and Americans
    wear sneakers: three words that all might be used to refer to the exact same pair
    of Nikes.

