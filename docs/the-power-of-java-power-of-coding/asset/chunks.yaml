- fmt: '

    Spoken languages are constantly changing, because real, living people control
    them by a sort of messy rule. That means any user has the potential to change.
    This happens all the time in English. Someone alive was the first to say `Google`
    (as a verb), `selfie`, `bromance`, `hater`, and `noob`. Today, if you use these
    words, most English speakers will know what you mean—but when we break too many
    rules or make up too many words, the results can be funny, or they can cause communication
    to come to grinding halt. So-called dead languages, like Latin or Pictish, don’t
    work this way. Because ordinary people (not academics) don’t speak these languages,
    their vocabularies never grow and their grammatical rules stay the same, as long
    as anyone remembers them.


    ### Ada Lovelace: The Programmer


    Born in 1815 and raised by her mother, an English aristocrat named Annabella Lovelace
    would live only thirty-six years. In her short life, however, she struggled past
    the limited opportunities available to women, earned the love and respect of friends
    and admirers across the world, and eventually became known as the first computer
    programmer. Ada was the daughter of Lord Byron, one of the most famous poets.
    Byron left Annabella just two months after Ada was born to pursue adventures in
    the Greek War of Independence. He died there in 1824 when Ada was still a child.
    Byron was a great traveler and a man of odd habits. Some people found him romantic
    and inspiring, others found him scandalous and offensive. Upset with Byron, Annabella
    tried to influence her daughter away from poetry—and what she thought was madness—and
    encouraged the young girl to study math and science instead. Though Ada never
    knew her father, she developed a lifelong interest in his work. The result of
    this education was an unusual (and powerful) intelligence: Ada''s mind was equally
    suited to mathematical as well as artistic thought.


    **Ada Lovelace helped spread the earliest computer research**


    When Ada was a teenager, she met Charles Babbage, an inventor and mathematician.
    As the Industrial Revolution picked up steam in the early 1800s, scientists and
    businesspeople needed to produce (and copy) lots of calculations without any errors.
    Babbage imagined a machine that could do these calculations automatically. He
    called this the `Difference Engine`. Theory raced ahead of technology. Babbage
    had imagined a machine with parts too difficult for metalworkers to make at a
    reasonable cost. Still, conversations with the intelligent and curious Ada spurred
    him on to further theories and inventions. Babbage was so inspired by Ada''s mind
    that he called her the Enchantress of Numbers. For her part, Ada was a key figure
    in popularizing and refining these developments in mathematics and the field that
    would eventually become computer programming. She translated work by foreign mathematicians
    into English, and she published extensive and beautifully written notes on the
    latest thinking in mathematics. Building off Babbage''s work, she described how
    the computer might be automated to do certain calculations—really programs, like
    what we can do today with `Java` and other languages. In these notes and other
    writings, her mathematical and poet powers came together. She described complex
    math and computing in vivid terms anyone could understand. Perhaps because her
    approach to the field was, as she called it, "poetical science," she was able
    to imagine the potential for the computer beyond what anyone else at the time
    could see.


    Computer programming languages are somewhere between these two. Programming languages,
    like `Java`, `C`, and `HTML`, are “living,” because real people use them and could
    even end up changing them. Unlike spoken languages, however, computer programming
    languages have “owners”: the rules of `Java` only change when Oracle’s programmers
    decide to change them. If you don’t like the rules, you can hope this happens—or,
    as many programmers have done, you can make up your own, new language.


    ### Understanding Java Syntax


    At the most basic level, all languages work the same way. Every language has “packets”
    of information. For most languages, we call the smallest packets “letters” and
    bigger packets “words.” For example, the letter `D` contains information: if you
    know the letter, you know what it’s supposed to sound like when it’s spoken as
    a part of a word. You can probably list a hundred words right now that begin with
    the letter `D`. When you put these packets together, they can mean something much
    more than just a sound. For example, if you put the letters `D-O-G` together,
    you’ve made the word dog, and that packet carries a lot of information. Just seeing
    the word `dog` in print probably puts an image in your mind. You might think of
    dachshunds or retrievers, bulldogs, or poodles. You feel love or affection thinking
    of your own pet or a friend or neighbor’s pet. You might remember fear, thinking
    of the time you saw an angry dog, or you might feel sadness, thinking of a dog
    that died. All this is possible because you know a syntax, or set of rules about
    how packets of information can be put together.

