    口语语言在不断变化，因为真实的、活生的人通过某种混乱的规则在控制它们。这意味着任何用户都有改变它的潜力。这种情况在英语中时有发生。是某个活着的人第一个使用了
    `Google`（作为动词）、`selfie`（自拍）、`bromance`（哥们好）、`hater`（仇恨者）和 `noob`（菜鸟）。今天，如果你使用这些词，大多数英语母者都能明白你的意思——但当我们打破过多的规则或创造过多的词汇时，结果可能会滑稽，也可能导致交流陷入停滞。所谓的“死语言”，如拉丁语或皮克特语，并不是这样运作的。因为普通人（而非学术界）不再使用这些语言，只要有人记得它们，它们的词汇量永远不会增长，语法规则也保持不变。


    ### 阿达·洛芙莱斯：程序员


    阿达·洛芙莱斯出生于 1815 年，由她的母亲一位名叫安娜贝贝拉·洛芙莱斯的英国贵族女性抚养，她只活了三十六岁。然而，在短短的生命中，她克服了女性所面临的有限机会，赢得了全世界朋友和仰慕者的爱与尊重，并最终作为第一位计算机程序员而闻名。阿达是最著名诗人之一拜伦的女儿。拜伦在阿达出生两个月后就离开了安娜贝贝拉，去参加参加希腊独立战争并寻求冒险。他在
    1824 年去世于那里，当时阿达还是个孩子。拜伦是一个伟大的旅行者，一个习惯有怪癖的人。有些人认为他浪漫且鼓舞人心，另一些人则认为他丑闻且冒犯。安娜贝贝拉对拜伦感到很愤怒，试图影响女儿让她远离诗歌——以及她认为的疯狂的事——转而鼓励这个女孩学习数学和科学。尽管阿达从未见过她的父亲，但她对父亲的工作产生了终身兴趣。这种教育的结果产生了一种非寻常（且强大）的智力：阿达的大脑既适合数学思维，也适合艺术思维。


    **阿达·洛芙莱斯帮助传播了早期的计算机研究**


    当阿达还是青少年时，她遇到了查尔斯·巴贝奇，那是一位发明家和数学家。随着工业革命在 19 世纪初蓬勃发展，科学家和商界需要在不产生任何错误的情况下产生（并复制）大量的计算。巴贝奇设想了一台可以自动进行这些计算的机器。他将其称为
    `差分机`。理论跑在了技术前面。巴贝奇设想的机器零件对于当时的金属工人来说太难以以合理的成本制造。尽管如此，与聪明且好奇的阿达的对话促使他提出了进一步的理论和发明。巴贝奇被阿达的大脑深深启发，以至于称她为“数字魔术师”。而阿达本人，她是普及和完善这些数学领域以及最终演变为计算机编程的领域中这些发展的关键人物。她将外国数学家的著作翻译成英语，并就数学的最新思想发表了详尽且文笔优美的笔记。基于巴贝奇的工作，她描述了计算机如何通过自动化执行某些计算——即真正的程序，就像我们今天用
    `Java` 和其他语言所做的那样。在这些笔记和其他著作中，她的数学天赋和诗意力量结合在了一起。她用任何人都能理解的生动词汇描述了复杂的数学和计算。也许是因为她对该领域的方法正如她所称的“诗意科学”，她能够想象出计算机的潜力，超越了当时任何人的想象。


    计算机编程语言介于这两者之间。编程语言，如 `Java`、`C` 和 `HTML`，是“活的的”，因为有真实的人在使用它们，甚至最终可能会改变它们。然而，与口语语言不同，计算机编程语言有“所有者”：`Java`
    的规则只有在甲骨文公司（Oracle）的程序员们决定改变它们时才会改变。如果你不喜欢这些规则，你可以希望这种情况发生——或者像许多程序员所做的那样，创造你自己的、新语言。


    ### 理解 Java 语法


    在最基础的层面上，所有语言的工作方式都是相同的。每种语言都有信息的“数据包”。对于大多数语言，我们把最小的数据包称为“字母”，将较大的包称为“单词”。例如，字母
    `D` 包含了信息：如果你认识这个字母，你就知道它作为单词的一部分读出来时听起来是什么声音。你现在可能可以列出一百以字母 `D` 开头的单词。当你把这些包组合在一起时，它们的意义比比一个声音要大得多。例如，如果你把字母
    `D-O-G` 放在一起，你就组成了单词 dog（狗），这个包携带了大量信息。仅仅在印刷品看到 `dog` 这个词可能就会在你的脑海中浮现出一个图像。你可能会想到腊犬或寻回犬、斗牛或贵宾犬。想到自己的宠物或朋友或邻居的宠物时，你会感到爱或喜爱。你可能会想起恐惧，想起你看到愤怒的狗的时候；或者在想起一只去世的狗时感到悲伤。这一切都是可能的，因为你了解了一种语法，或者说关于信息包如何组合在一起的规则。

