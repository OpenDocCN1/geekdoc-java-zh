    ![Image](img/image_005_.jpg)


    # 入门


    在 Pokemon Go 的案例中，数百万玩家和数万亿数字宝可梦在几个月内为任天堂带来了 10 亿美元。所有的战斗以及玩家使用的手机大部分运行在 `Java`
    上。现在你知道它是如何运作的，以及 `Java` 是如何让 Pokemon Go 这样的现象成为可能的。


    但在游戏发布的夏天，还发生了一场更大的“战斗”，这与收集类卡通怪兽的关系并不大。它确实涉及那款热门游戏，但也（可能）还涉及好莱坞电影的动画、你最喜爱的商店的收银电脑，甚至还有
    NASA 火星探测器的车载计算机。涉及的金额超过了 90 亿美元，还关乎智能手机行业的未来以及整个计算机编程的文化。这个问题对你以及对任何考虑从事计算机职业的人来说都可能非常重要。整个编程世界都在关注并好奇：`Java`
    语言真的将一直对任何人免费开放吗？


    ## Java 争战与智能手机大战


    要理解“智能手机大战”以及它们与通用计算机编程的关系，我们必须更仔细地观察 Oracle 对 `Sun Microsystems, Inc.` 的收购。


    ![](img/main-42.jpg)


    Oracle 首席执行官 Larry Ellison 在 2009 年监督了对 `Sun Microsystems` 以及 `Java` 权利的收购。


    凭借强劲的硬件销售和 `Java` 的巨大成功，`Sun` 越发致力于帮助塑造其初期的开源技术原则。1999 年，`Sun` 购买了与 `Microsoft’s
    Office Suite`（`Word`、`Excel`、`PowerPoint` 等）竞争的软件权利，并将其免费发布。不久后，互联网泡沫破灭。由于 `Sun`
    是其中的主要参与者，泡沫破灭对他们的打击沉重，但未到将其击垮的程度。公司恢复了健康，但它永远无法回到以前的主导地位了；`Microsoft`、`Apple`
    和 `Google` 成了新的主要参与者。


    但 `Sun` 坚持了下来，这很大程度上归功于 `Java` 持久的人气及其在移动手机技术中日益增长的角色。2005 年，`Sun` 向公众发布了 1600
    多项专利，2006 年，该公司宣布 `Java` 开源。这使得 `Java` 的控制权保留在 `Sun 手中`，但任何人都可以查看源代码、使用并对其调整。该公司继续享受着强劲的销售和增长。


    一切在 2007 年 12 月大衰退的开始而发生了变化\。随着全球经济增长放缓，股价再次下跌。这一次，泡沫不再局限于科技行业。消费者开始减少支出，许多像 `Sun`
    这样的公司遭受了痛苦。商业杂志和网站上流传着 `Sun` 合并和收购的传言。随后在 2009 年 4 月，另一家名为 `Oracle` 的技术公司介入，以约
    74 亿美元收购了 `Sun Microsystems, Inc.`。


    意料的是，以创始人兼时任 CEO Larry Ellison 为领导的 `Oracle` 高管对如何开展业务有一些不同的想法。根据 `James Gosling`
    的说法，`Oracle` 高管在早期就非常兴奋，期待在一场针对全球最知名品牌之一——`Google` 的诉讼中，获得比他们购买 `Sun` 所花费更多的利润。


    2008 年 9 月，`Google` 发布了 `Android`，这是一个主要用于智能手机和平板电脑等触摸设备的操作系统。由 Andy Rubin 领导的小型开发团队在
    2003 年创立了 `Android, Inc.`，`Google` 在两年后以 5000 万美元购买了该公司，当时系统尚未准备好面向公众，并将创始人作为员工带入公司以完成工作。虽然
    `Android` 的核心是用 `C` 编写的，但其用户界面（用户与系统交互的方式）全部是 `Java`。这正是导致 `Sun` 高管让 `Java` 开源的类型应用：来自小型初创公司开发者的强大创新。但
    `Google` 并不是一家小初创公司，它很快就能从很大程度上从 `Sun` 那里拿来（且未付费）的代码中获得巨额利润。


    ### 韩国的 iPhone


    当 `Android` 在市场上还很新时，两家更大的智能手机制造商正准备进行全球范围内的法律战。2010 年，韩国公司 `Samsung` 发布了 `Galaxy
    S`，这款手机看起来和功能上非常像 `Apple iPhone`，后者当时是许多用户的首选智能手机。在早期谈判失败后，`Apple` 起诉 `Samsung`
    侵犯版权。经过两年的多起诉讼、反诉以及数百万美元的法律费用后，两个美国陪审团认定 `Samsung` 的高管和开发者故意盗用了 `iPhone` 的部分技术和设计，并要求
    `Samsung` 向 `Apple` 支付 4 亿美元损害赔偿。其他国家的法院裁定两家公司都违反了对方的专利，而另一些法院则判定双方都没有违反任何专利。


    ![Image](img/page78_image1.jpg)


    你对智能手机的偏好可能基于手机的外观和响应。无论什么手机，这些特性都取决于 `Java`。


    战斗在 2012 年并没有停止。2016 年 12 月，美国最高法院一致推翻了早前的判决（以及 4 亿欧元的赔偿），并将案件发回下级法院进行进一步的法律纠纷。在此期间，智能手机字面意义上接管了全球文化。随着该行业涉及的资金增加，`Samsung-Apple`
    之战吸引了几乎所有其他主要的智能手机制造商，包括 `Microsoft`、`LG`、`Nokia` 和 `Sony`，他们都陷入了复杂的专利版权诉讼中。根据英国《卫报》一位评论员的说法，风险增加了，因为有太多的人拥有智能手机。在手机技术的早期，大多数销售来自以前没有这种设备的人。现在，大多数销售来自已经拥有智能手机的人。这意味着任何制造商都必须从竞争对手那里抢客户。与此同时，手机技术的发展速度放缓了。


    ## 冷咖啡约：Oracle 与 Google 为 Java 争战


    当然，现在处于智能手机大战中心的公司之一是 `Google`。`Google` 将（基于 Java 的）`Android OS` 变成了成功——也是目标——部分是因为它是开源的，不像
    Apple 铁腕统治的 iPhone OS，还因为制造商（包括三星！）能够更廉价地生产智能手机。


    根据 `James Gosling` 的说法，Sun 高管曾考虑就 Google 在 Android 系统中使用 Java 的问题提起诉讼。Scott McNealy
    和其他人认为 Google 违反了专利，但公司并不想起诉。Gosling 认为，Google 对 Java 代码的使用对 Java 用户和程序员社区产生了非常积极的影响。起诉
    Google 会花费精力和金钱，而且可能对公司的形象不利，因为 Google 在全球范围内受欢迎。


    Oracle 在 2009 年 4 月购买了 Sun；到 2010 年 8 月，该公司加入了了“智能手机大战”，起诉 Google 侵犯专利和版权，索要了高达
    90 亿美元的损失收入。Google 声称他们对 Java 的采用属于“合理使用”——基本上，这允许个人和公司在某些情况下无需许可即可使用受版权保护。Google
    声称他们可以使用 Java，因为 Java 一直是开源的——代码从一开始就对公众开放。2016 年 5 月底，一个陪审团判定 Google 胜诉，但 Oracle
    的律师已经表示他们将对该判决提出上诉。


