    另一个类似于 TIOBE、PyPL 的指数衡量了人们对 Google 编程语言教程的兴趣。`Java` 在此处也处于领先地位，占据了搜索流量的 24%。这意味着初级程序员（比如你）搜索
    `Java` 的次数超过了任何其他语言。加入他们的行列可能不是个坏主意；但如果你担心在职场市场中脱颖而出，你应该考虑学习一种目前较不流行、但你预计可以在其中大放异彩的语言。


    如果你正在寻找其他对你的职业生涯有价值的、相对容易学习的语言，你有多种选择。`Ruby` 设计于 20 世纪 90 年代，是最容易学习的语言之一。它经常被誉为趣味十足，但不仅仅是为了好玩：`Ruby`
    驱动着像 Hulu 和 Airbnb 这样主要的业务和娱乐网站。


    `JavaScript` 和 `PHP` 也都很容易学习，如果你想为 Web 编写代码，它们非常有价值。`JavaScript` 可用于设计网站上的交互式元素（即用户看到的部分），而
    `PHP` 则用于用户看不见的服务器端函数。


    最后，`Python` 是一种简单但实用的语言；它的代码比 `Java` 或 `C++` 用更少的行数表达概念和指令，而且它可以构建任何东西。`Python`
    在研究和科学计算领域受欢迎，但开发者也用它构建了 Pinterest 和 Instagram 的部分功能。


    学习其中任何一种语言都会扩展你构建计算机程序的潜力。它们会让你成为一个更有多才、更有价值的职位候选人，而且你可以将其中许多语言与 `Java` 配合使用。


    你还应该考虑其他“年轻”语言。尝试想一下未来几年可能会被广泛使用的语言，并考虑现在就开始学习它们。这样的两种语言是 Google 的 `Go` 和 Apple
    的 `Swift`，它们在 TIOBE 指数上都在上升，并在 Stack Overflow 对开发者对新语言兴趣的调查中表现良好。


    ![](img/main-45.jpg)


    `Go` 的吉祥物是 `Go` gopher（地鼠）。


    Google 的 `Go` 是新的，但它根深蒂固，而且它的发明者并非初出之辈。Ken Thompson 和 Rob Pike 凭借在贝尔实验室的工作已经是传奇；他们共同创建了
    `Unix` 操作系统，并各自创建了多种语言。他们加入 Google，并与 Google 开发者 Robert Greisemer 一起创建了 `Go`，于
    2007 年发布。这三个人设计 `Go` 部分是为了解决对 `C++` 的不满。尽管在发布十年后它仍然处于实验性阶段，但由于其“简洁”的可读性，它成为了一种日益受欢迎的语言。你可能在不知情的情况下遇到过
    `Go`：它驱动了 Google、Dropbox、Netflix、SoundCloud 和 Uber 的部分功能。


    与开源且跨平台的 `Go` 不同，语言 `Swift` 作为 Apple 的发明，只在 Apple 关联的操作系统上运行。它于 2014 年发布，并在 2017
    年进入了 TIOBE 指数的前十。它构建在 `Objective-C` 之上，可以在一个程序中与 `Objective-C`、`C` 和 `C++` 并运行。Apple
    希望它能取代 `Objective-C`（如果你现在考虑学习那种语言，这应该让你犹豫一下）。首席开发者 Chris Lattner 设计它是为了处理或避免其他语言中的常见问题或
    Bug。


    尽管如此，在学习 `Java` 之后学习 `Swift` 可能会困难，因为像 `Java` 一样，它代表了范式的转变。这种转变完全偏离了面向对象编程；`Swift`
    将其替换为“面向协议的编程”。协议在面向对象编程中已经存在：它们规定了不相关的对象如何通信。面向协议的编程不再将可重用的对象及其类放在编程范式的中心，而是将协议（即“已完成的事”）放在中心。在不太偏离我们本书的主题（记得是
    `Java` 吗？）的情况下，`Swift` 可能会在未来几年改变编程世界。但可以说，面向协议的编程不会完全取代面向对象编程。我们在 `Swift` 中拥有的是一种满足新需求的新思维，但这并不意味着它比更旧的语言更好地满足“旧”需求。市场研究显示，古老的
    `C` 是新职位招聘中最常提到的语言，但几个不同领域对 `Java` 程序员保持着稳定的需求。`Java` 将继续满足其他需求，就像 `C`、`C++` 甚至更老的语言也继续有其重要用途一样。


    ## Java 开发者的职业前景


    如果你正在寻找一份 `Java` 开发者的职业，你可能会从硅谷开始（加利福尼亚州旧金山西南的一个地区，科技巨头和初创公司聚集于此）。尽管许多 Sun 开发者在收购后离开了
    `Oracle`，但 `Oracle` 短时间内不会放弃 `Java`：它可能仍然是公司最大的资产，他们对该语言承诺的证明之一就是继续对 `Google`
    提起诉讼。仅在 2013 年，`Oracle` 就发布了超过 2,300 个职位。其中许多是针对基于 `Java` 的软件和应用开发人员。其他主要科技公司如
    `Microsoft`、`Google`、`Dell`、`Cisco`、`Yahoo` 和 `Sony` 也招聘 `Java` 开发者。如果你为这些主要的计算机公司之一工作，你可以开发数百万计算机用户使用的主要软件应用程序。如果你为
    `Google` 工作，你可以为 `Android` 贡献；如果你为 `Oracle` 工作，你可以为……贡献。在世界上年轻的行业之一，一切皆有可能。


    ### 光、摄、魔法


    视觉特效和计算机图形公司 Industrial Light & Magic 多年来一直是好莱坞的先驱。他们的故事始于很久，取决于你问谁，是在加利福尼亚州洛杉矶的
    Van Nuys 社区，还是在遥远的星系。


    George Lucas 的《星球大战》于 1977 年问，利用了美国对太空的痴迷，这种痴迷始于 1961 年 5 月 25 日，当时总统约翰·肯尼迪宣布国家将在登月竞赛中击败苏联。斯坦利·库布里克的《2001：太空漫游》在
    1968 年发布时成为定义性的太空电影，这在肯尼迪承诺实现的一年多之前。Lucas 可能没有通过《2001》超越库布里克的艺术成就，但《星球大战》实现了库布里克无法实现的事情：它将古希腊、罗马和中世纪文化的伟大悲剧和浪漫引入了太空。


    Lucas 的野心从一开始就很很高。受库布里克视觉震撼作品的启发，Lucas 想拍出一部以前从未见过的电影——无论是在屏幕内还是屏幕外。第一部《星球大战》电影（后更名为《星球大战》第四部：新希望）没有使用多少我们现在称为计算机生成图像（CGI）的内容。当时，“特效”主要涉及模型、投影、剪辑或叠加物理胶片，以及使用过滤器和其他扭曲摄像机镜头的方法。（进入第一部电影的少数计算机生成的视觉效果是
    IL&M 外部程序员的作品。）然而，`IL&M` 与一组新雇佣的人员（称为 Lucasfilm，即 Lucas 制作公司的计算机部门）在续集《第五部：帝国反击》中合作。在这部电影以及其他几部同期作品之后，好莱坞与计算机行业不可避免的结合变得显而易见。计算机部门分拆成为
    Pixar，并在 1995 年创作了第一部全 CGI 电影《玩具总动员》。`IL&M` 也转向了拥抱 CGI，并迅速成为该领域的领导者。


