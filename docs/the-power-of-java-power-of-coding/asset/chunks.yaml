    # 当今编程市场中的 Java


    根据 `TIOBE Index`（该指数二十年来追踪了开发者对不同编程语言的兴趣和使用情况），Gosling 是正确的。至少从 2001 年以来，`Java`
    一直遥遥领先。在巅峰时期，`Java` 曾占所有编程语言的 26% 以上。从那以后，开发者发明了许多新语言。现在 `Java` 占所有编程语言的 16.4%
    以上；`C` 随其后，占比 7.7%，`C++` 为 5.1%。


    ![](img/main-43.jpg)


    `TIOBE Index` 显示了用户对不同计算机语言随时间的兴趣。


    在甲骨文收购后，`Java` 的人气开始下降，甚至跌至 `C` 之下。这部分是因为出现了新的竞争语言，但根据 `TIOBE` 经理 Paul Jansen
    的说法，也是因为开发者对甲骨文管理下 `Java` 的看法。这家公司似乎花费了更多时间在对诉 `Google` 的诉讼等事情上，而在维护、推广和推动 `Java`
    语言方面花费的时间较少。根据《连线》杂志的一项分析，原始的 `Java` 开发者（如 Gosling）离开了并开始推广其他语言，而甲骨文的开发者并没有做什么来保持
    `Java` 的活力，也没有回应日常程序员的顾虑。


    ![](img/main-44.jpg)


    你可以通过免费的集成开发环境（IDE）如 `Greenfoot` 来学习如何使用 `Java`。


    `Java` 的下跌是短暂的，`C` 的重回巅峰也是如此。`C` 并不适合移动 Web 和应用开发，因此大幅下降；而作为这类工作优秀语言的 `Java` 已回归顶部。`Android`
    的持续成功、移动 Web 和应用技术的不断进步（包括 `Pokemon Go` 等现象）以及庞大独立用户社区的广泛支持，都是 `Java` 将长期存在下去的指标之一。


    虽然它不是严肃程序员需要掌握唯一语言，但它是最有影响力的语言之一，而且并不难。如果你想成为一名计算机程序员，从 `Java` 开始是明智的。


    ## 所以，你想成为 Java 程序员吗？


    如果你想开始编写 `Java` 代码，你需要下载 `Java Development Kit (JDK)`，它满足了编写 `Java` 的所有基本需求。它将为你提供
    `JVM` 以及加载、运行、归档和调试代码的工具——以及更多。你可以从甲骨文官方网站免费获取 `JDK`。


    然后，你需要一个进行实验的地方。这被称为集成开发环境（IDE）。`IDE` 就像是编写代码的“沙盒”——如果沙盒配备了起重机、推土机和其他重型建筑设备的话。`IDE`
    将包含一个源码编辑器、一个自动化代码构建的工具和一个调试器。


    你可以从 `Greenfoot` 开始。`Greenfoot` 是一个免费的 IDE，可以在 Mac、Windows、Linux 或 Solaris 计算机上运行。你甚至可以将
    `Greenfoot` 下载到 USB 驱动器中，无论你走到哪里都能在不同的电脑上运行它。`Greenfoot` 是年轻程序员学习 `Java` 的绝佳方式，因为它是可视化的：你可以看到自己构建的内容，而且学习过程围绕着制作有趣的游戏展开。由于有了可视化环境，你可以迅速看到自己努力的成果。你甚至可以将你的作品发布到网上。那里有实用的教程，其他使用
    `Greenfoot` 的人也会在 IDE 的在线社区中不断分享他们的成功和挣扎。


    一旦你在 `Greenfoot` 中学会了足够的知识，就可以转向更高级的 IDE。`Greenfoot` 是构建在 IDE `BlueJ` 之上的，`BlueJ`
    也是一个非常适合初者的简单环境，尽管它的可视化程度较低。这是一个强大的 IDE，并赢得了 Gosling 的认可。最后，你可以转向专业级的 IDE。其中许多仍然是免费的：最广为人知的有
    `Eclipse` 和 `NetBeans`。其他如 `IntelliJ` 这样的工具需要付费，但它提供了对专业、高工作量开发者至重要的额外功能。当你准备好尝试这些专业级应用时，你已经精通
    `Java` 了，并且会清楚地知道你想从 `IDE` 中获得什么。


    ## 为编程职业进行自我教育


    随着你对 `Java` 变得越来越精通，你可能会参加一些教程或其他免费的在线学习计划，并从现实生活中和网络上遇到的程序员那里获取技巧。在高中期间，你可能会上你的第一门编程课程或加入一个俱乐部。


    最终，你必须对大学做出的决定。你现在应该知道，不需要计算机科学学位也可以在计算机编程领域找到工作。当 `StackOverflow`（互联网最大的程序员网络社区）在
    2015 年对社区成员进行年度调查并询问有多少人拥有计算机科学学位时，数字接近一半。极少有人拥有博士学位，极少有人超过四十岁。（这是统计学中的一个重要教训：调查是一个不完美的快照，因为它没有考虑到不使用该网站的程序员——而这些人大多年龄较大，且更有可能有大学学位。）


    在 `StackOverflow` 程序员中，约 50% 的回答者没有计算机科学学位，他们发现了进入行业的非常规且可能困难的路径。如果你想成为程序员但不想获得计算机科学学位，你可能会被某些公司拒之门外。例如，`Google`
    目前不面试没有工程学位的候选人。无论经验如何，没有学位晋升到高级职位也会很困难。


    然而，你可能会在初创公司（试图颠覆行业的早期公司）获得职位——科技领域总有很多初创公司，且需要程序员。你也可以通过侧门进入行业。如果你有计算机科学经验但获得的是经济学学位（例如），你可以在银行、投资公司或研究机构工作，在那里积累编程经验，一旦有了足够的经验，就可以跳槽到真正的科技工作。而且，科技领域越来越多的人正在质疑学位的价值。在线支付公司
    `PayPal` 的创始人 Peter Thiel 有一个基金，每年向 20 个人提供 10 万美元，前提是他们退出或推迟大学来专注于自己的技术项目。


    所以，没有计算机科学学位也可以获得编程工作，只要你能够自学、与其他开发者交流并建立良好关系、在教室外获得编程经验，并自信地应对不寻之路。当你准备好对大学做出决定时，行业可能已经发生了更大的变化。但目前，请记住，对于大多数编程梦想者来说，四年的计算机科学学位是获得工作的最佳途径。


    ## 超越 Java：多语言并行


    极少数程序员只写一种语言。即使是那些头衔为“高级 Java 开发者”的人，可能经常与其他语言一起工作。如果你对 `Java` 感兴趣，早晚会学习额外的语言，原因有两个：第一，为自己学习
    `Java` 提供帮助；第二，让自己在不断变化的领域中更具适应性。


    如果你想通过学习另一种语言来熟悉 `Java`，你应该坚持学习其他面向对象的语言。在这个阶段，任何其他语言只会让你感到困惑。如果你有丰富的 `C++` 经验，你可以轻松学会
    `Java`，并可能在一周内就能编写出真正的程序。


