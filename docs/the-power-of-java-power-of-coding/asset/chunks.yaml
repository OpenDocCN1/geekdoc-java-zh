    #### Java in Your World: Smartphones and Pokemon Go


    The summer of 2016 was hot. According to American climate scientists, 2016 was
    the hottest year ever, and July and August were the hottest months of that year.
    Usually temperatures that high keep people indoors, in the comfort of air conditioning,
    or at least close to fans and cold drinks. But that summer, many people chose
    to spend more time outdoors. Through July and August, almost everywhere you went
    outside, you’d see people walking back and forth sidewalks and lawns, in no apparent
    pattern, heads bent down to smartphone screens. There was something hotter than
    the temperatures: a new, simple app called Pokemon Go. On July 6, video game company
    Nintendo, along with game development company Niantic, released a game that would
    reboot a twenty-year-old brand called Pokemon and at the same change the way both
    kids and adults interacted with their phones and with each other. It wasn’t just
    a fad—it was a phenomenon. The game became the fastest-growing app—or application,
    a name for any computer program, from massive games to tiny tools like calculators—in
    the history of smartphones. Today, it stands as the most popular smartphone game
    ever. Only six months after it launched, the app had earned its makers $1 billion.


    The potential dangers of playing Pokemon Go became clear soon after it was released.
    This sign was posted in New York City the summer of 2016.


    Players could train their Pokemon to fight. The winners of these battles were
    rewarded with control of virtual “gyms” scattered around the real world—over places
    like libraries, schools, parks, and coffee shops. It didn’t matter what brand
    of smartphone or tablet you had: anyone could play. The game was popular, and
    sometimes dangerous; some players were so distracted that they broke bones, crashed
    cars, or were robbed. One newspaper reported that players caused over 110,000
    road accidents in just ten days.


    Digital characters hovered over real tables and chairs, seemed to hide behind
    trees and bushes, and lurked in lakes and graveyards, ready to be captured.

