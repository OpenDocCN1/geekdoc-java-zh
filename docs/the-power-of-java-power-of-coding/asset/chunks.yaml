    This built on an earlier coding language, `Pascal`, dating back to the 1970s.
    Researchers at the University of California at San Diego found that they and their
    students needed a common coding language that would work on the different microcomputers
    across campus, so they invented the `Pascal` language and the `P-system` on which
    it ran. Though the company IBM supported `Pascal`, the `P-system` was expensive
    and reviewers didn’t love the results. However, it was one of the first attempts
    to use a virtual machine. James Gosling worked with `Pascal` while a graduate
    student at Carnegie Mellon, and this experience influenced the direction he would
    take with `Java` years later.


    “Write once, run anywhere,” turned out to be a good catchphrase. The Sun marketing
    team soon started using the shorthand WORA. The catch, of course, is that to run
    a `Java` program, an operating system needs to be equipped with the `Java Virtual
    Machine`. `Java` became so popular so quickly, though, that installation of `JVM`
    or a `Java` interpreter became an industry standard for most systems.


    ## Grace Under Pressure: Scaling with Java


    `Java` can run anything from programmable toasters to supercomputers to “smartcards”
    (like contactless credit and debit cards). Especially since the rise of smartphones,
    developers have used `Java` to create apps that become overnight sensations. No
    matter the language a developer used to write them, useful or innovative apps
    are often overwhelmed with downloads and usage, crashing servers, revealing bugs,
    and slowing performance. That leaves a poor impression on users who might be on
    the fence about downloading the app or switching to a competitor. Though performance
    depends on the programmer’s skill, `Java` is a particularly useful language for
    designing apps and software to scale, or “grow,” gracefully.


    Scalability is one way of measuring the performance of a computer, server, or
    software program under intense pressure from many users trying to perform many
    tasks at the same time—so scalability doesn’t matter much for that programmable
    toaster, but it’s very important for apps and video games. As far as `Java` is
    concerned, a program is highly scalable if it can continue to perform quickly
    and without crashing as usage continues to increase. The higher the threshold—the
    point at which a program has too many users and starts to slow down, freeze, or
    crash—the greater the scalability.


    ## NASA''s World Wind: an Interoperability Study


    o o o


    NASA''s World Wind is a virtual globe, sort of like Google Earth, but customizable,
    and loaded up with an extraordinary amount of data from NASA''s satellites and
    other equipment on Earth and in space.


    With World Wind, users can explore the Earth—and even Mars, Venus, Jupiter, and
    several moons—in real-time, watching as the sun''s light recedes and cities brighten
    in the night. Mountains and other topographical features display in 3D, and with
    plug-ins you can even overlay pinpoints that link to Wikipedia articles, on things
    like the Great Wall of China or the Marianas Trench.


    These plug-ins call on a host of programming languages, like `C#`, `J#`, and `VB`.
    In the beginning, World Wind was only available on Microsoft operating systems,
    but NASA scientists wanted to bring it to everyone through the web, which meant
    it would have to run through a browser''s `HTML` and work on any operating system.
    Bringing such a powerful program to absolutely any user—even users of smartphones
    and tablets—would be a huge challenge for interoperability, so NASA programmers
    used `Java` to make it happen.


    World Wind `Java`, released in 2017, made the entire World Wind program a `Java
    applet` capable of running (through `HTML`) on a web page on any operating system,
    still including all the plugins in other languages, and still calling on data
    from hundreds of NASA projects collected with software built with countless other
    programming languages.


    There are two ways to scale. A program can scale up, by easily adding more memory
    to a single computer, or a program can scale out, by easily connecting with other
    computers and networks. Because of `Java`’s built-in garbage collection, it can
    manage memory effectively. That means that `Java` programs can scale up significantly
    without having to add more memory, where a program in a less-efficient language
    might require more memory, and sooner. At the same time, branching methods allow
    programs to access more memory as needed. And because of its portability, `Java`
    can cross platforms, scaling out easily, too. Because of `Java`’s superior scalability,
    Twitter developers have steadily been shifting their code from the language `Ruby`
    to `Java`.


    ## Possibilities of the Cross-Platform Paradigm


    Much of `Java`’s success isn’t just because of its technical features and abilities,
    but because of the mentality, and culture, that created and sustain them. You
    might call this the “Java paradigm.” A paradigm is a way of looking at the world.
    It includes basic assumptions about the ways things work, including everything
    from the laws of gravity and motion, to expectations about the way people behave.
    A paradigm also contains less concrete things, like attitudes. There are personal
    paradigms and paradigms that direct the behavior of business or identity groups.
    Sometimes, a new technology or world event is so significant that it changes these
    fundamental assumptions and attitudes. We call this a paradigm shift.


    Historians disagree about whether these paradigm shifts really happen in response
    to single events, or if those events themselves are part of a broader and richer
    tapestry of gradual changes, in which an individual’s choices are less important
    than the cultural and economic forces that direct those choices. For example,
    you could say that the internet caused a global paradigm shift: it changed the
    way humans interact with each other. You could say the same about smartphones.
    Or, you could say that both are developments in a much longer and more gradual
    paradigm shift, describing the merging of human life and machines.


    The invention of `Java` also caused a paradigm shift— not just in the world of
    computer programmers, but for all humans. `Java` culture has its own paradigm.
    It’s fair to say that it’s built on James Gosling’s way of looking at the world.
    Or, if you’re more inclined to look at historical trends, you could say that the
    possibilities of the internet shaped Gosling’s personal paradigm long before he
    created `Java`. Either way, from a very young age, Gosling was concerned about
    translation and communication across the barriers of the early internet. Even
    as a teenager in the 1960s and 1970s, he worked on computer projects that tried
    to bridge gaps between platforms, systems, and languages. His greatest achievement
    in this was inventing `Java`, which took that paradigm—a belief in acting and
    communicating across great human and machine divides—and brought it to a bigger
    audience: first hundreds of developers, and then thousands, and then millions,
    and then to the billions of people who use `Java` without thinking about it.

