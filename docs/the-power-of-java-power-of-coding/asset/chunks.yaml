- fmt: '

    # Java in the Programming Marketplace Today


    According to the `TIOBE Index`, which for two decades has tracked developers’
    interest in and use of different programming languages, Gosling is right. `Java`
    has led the pack—by a wide margin—at least since 2001. At its peak, `Java` accounted
    for over 26 percent of all programming. In the time since then, developers have
    invented many new languages. Now `Java` accounts for a little over 16.4 percent
    of all programming; `C` follows at 7.7 percent, and `C++` at 5.1 percent.


    ![](images/main-43.jpg)


    The `TIOBE Index` charts users'' interests in different computer languages over
    time .


    `Java`’s popularity began to decline and even fell below `C` following the Oracle
    takeover, in part because of new, competing languages, but also, according to
    `TIOBE` managing director Paul Jansen, because of the way developers perceived
    `Java` under Oracle. The company seemed to be spending more time on things like
    its lawsuit against `Google`, and less on maintaining, promoting, and pushing
    the `Java` language. Original `Java` developers (like `Gosling`) left and started
    promoting other languages, while `Oracle` developers didn’t do much to keep `Java`
    fresh, or respond to everyday programmers’ concerns, according to one Wired magazine
    analysis.


    ![](images/main-44.jpg)


    You can learn how to use `Java` with a free integrated development environment
    (IDE) like `Greenfoot` .


    `Java`’s dip was short-lived, as was `C`’s return to prominence. `C`, not very
    well-suited to mobile web and app development, has plummeted, while `Java`, an
    excellent language for that kind of work, has returned to the top spot. The continued
    success of `Android`, constant advancements in mobile web and app technology (including
    phenomena like `Pokemon Go`), and broad support from a huge community of independent
    users, are many of the indicators that `Java` will be around for a long time to
    come.


    While it’s not the only language a serious programmer needs to know, it’s one
    of the most influential, and it’s not hard to pick up. If you want to be a computer
    programmer, you’d do well to start with `Java`.


    ## So, You Want to Be a Java Programmer?


    If you want to start writing `Java` code, you’ll need to download the `Java Development
    Kit (JDK)`, which meets all the basic needs for writing `Java`. It will give you
    the `JVM` and tools for loading, running, archiving, and debugging your code—plus
    many more. You can get the `JDK` free from `Oracle`’s website.


    Then you’ll need a place to experiment. This is called an integrated development
    environment (IDE). An `IDE` is like a “sandbox” for writing code—if sandboxes
    were equipped with cranes, backhoes, and other heavy construction equipment. An
    `IDE` will include a source code editor, a tool to automate code building, and
    a debugger.


    You might start with `Greenfoot`. `Greenfoot` is a free IDE and runs on Mac, Windows,
    Linux, or Solaris computers. You can even download `Greenfoot` to a USB drive
    and run it on different computers wherever you go. `Greenfoot` is an excellent
    way for young programmers to start learning `Java` because it’s visual: you get
    to see what you’re building, and the learning process is structured around making
    fun games. Because of the visual environment, you’ll see the results of your hard
    work quickly. You can even publish your work online. There are helpful tutorials,
    and other people using `Greenfoot` constantly post about their successes and their
    struggles in the `IDE`’s online community.


    Once you’ve learned enough in `Greenfoot`, you can move on to more advanced IDEs.
    `Greenfoot` was built on top of the IDE `BlueJ`, which is also a simple environment
    well-suited to beginners, though it is less visual. This is a strong IDE and has
    won `Gosling`’s approval. Finally, you can move on to a professional-level IDE.
    Many of these are still free: some of the best-known are `Eclipse` and `NetBeans`.
    Others, like `IntelliJ`, cost money but come with additional features important
    for professional, high-volume developers. By the time you’re ready to try one
    of these pro-level applications, you’ll be Java-savvy, and you’ll know better
    what you want to get out of an `IDE`.


    ## Educating Yourself for a Programming Career


    As you continue to get better and better with `Java`, you will probably take a
    few tutorials or other free online learning programs, and pick up tips from programmers
    you meet in real life and online. In high school, you might take your first programming
    course or join a club.


    Eventually, you’ll have to make a decision about college. You should know now
    that you don’t need a computer science degree to get a job in computer programming.
    When `StackOverflow`, the internet’s biggest web community of programmers, took
    their annual poll of community members in 2015 and asked how many had a computer
    science degree, the number was close to half. Very few had a PhD, and very few
    were over the age of forty. (This is an important lesson in statistics: the survey
    is an imperfect snapshot, because it doesn’t account for all the programmers who
    don’t use the website—and these are mostly older, and likelier to have college
    degrees.)


    The roughly 50 percent of `StackOverflow` programmers who responded that they
    didn’t have a computer science degree found unconventional and probably difficult
    paths into the industry. If you want to be a programmer and don’t want to get
    a computer science degree, you may be shut out of certain companies altogether.
    `Google`, for example, does not currently interview candidates without computer
    science degrees for any engineering position. It will also be difficult to advance
    to an upper-level position without a degree, no matter your experience.


    You might, however, get a position at a startup (a recently formed company trying
    to disrupt an industry)—and there are always plenty of startups in tech, with
    plenty of need for programmers. You can also find your way into the industry through
    a side door. If you have experience in computer science but get a college degree
    in economics, say, you could end up working for a bank, an investment firm, or
    a research institute, start to pick up programming work while there, and then
    jump to a proper tech job once you have enough experience. And there is a growing
    number of people in technology industries who are questioning the value of college
    degrees. Peter Thiel, the founder of internet payment transaction company `PayPal`,
    has a foundation that pays $100,000 each to twenty people each year, so long as
    they drop out of (or delay) college to work on their technology projects.


    So, it’s possible to get a job in programming without a computer science degree,
    so long as you teach yourself, engage with other developers and make good connections,
    earn programming experience outside of the classroom, and confidently navigate
    an unusual path. By the time you’re ready to make a decision about college, the
    industry might have changed even further. For now, though, keep in mind that for
    most programmer-hopefuls, a four-year computer science degree is the best way
    to a job.


    ## Beyond Java: Going Multilingual


    Very few programmers write in only one language. Even those whose job titles say
    something like “Senior Java Developer” probably work with other languages regularly.
    If you’re interested in `Java`, you’ll want to learn additional languages, either
    sooner or later, for two reasons: first, to give yourself a leg up in learning
    `Java`, and second, to make yourself more adaptable in a constantly changing field.


    If you want to learn another language to ease yourself into `Java`, you should
    stick with other object-oriented languages. Anything else would only confuse you
    at this stage. If you have significant experience in `C++`, you can pick up `Java`
    easily and will probably be able to build serious programs within a week.

