    ![Image](image_005_.jpg)


    # Getting Started


    In the case of Pokemon Go, millions of players and trillions of digital Pokemon
    had generated Nintendo $1 billion within a few months. All the battles, and most
    of the phones that players were using, ran on `Java`. Now you know how that works,
    and how `Java` made a phenomenon like Pokemon Go possible.


    But there was an even bigger “battle” going on the summer the game was released,
    and it had relatively little to do with collectible cartoon monsters. It did involve
    that popular game, but it also (potentially) involved animations for Hollywood
    movies, the checkout computers at some of your favorite stores, and even the onboard
    computers of the NASA Mars exploration rovers. More than $9 billion was at stake,
    along with the future of the smartphone industry and the very culture of computer
    programming. The issue is one that could matter very much to you, and to anyone
    considering a career in computers. The whole programming world watched and wondered:
    Will the `Java` language always be free for anyone to use?


    ## Battle Over Java, and the Smartphone Wars


    To understand the the“smartphone wars” and what these have to do with computer
    programming in general, we have to look a little more closely at the Oracle purchase
    of `Sun Microsystems, Inc.`


    ![](images/main-42.jpg)


    Oracle CEO Larry Ellison oversaw the purchase of `Sun Microsystems`—and the rights
    to `Java`—in 2009 .


    Riding on strong hardware sales and the runaway success of `Java`, `Sun` became
    more and more devoted to the principles of open-source technology that had helped
    to shape its beginnings. In 1999, `Sun` bought the rights to software that competed
    with `Microsoft’s Office Suite` (`Word`, `Excel`, `PowerPoint`, and so on), and
    released this for free. Then, the dotcom bubble burst shortly after. As `Sun`
    was a major player, the bubble bursting hit them hard, but not hard enough to
    crush them. The company returned to health, but it would never return to its old
    position of dominance; `Microsoft`, `Apple`, and `Google` were the new major players.


    But `Sun` hung on, in large part due to `Java`, its enduring popularity, and its
    growing role in mobile phone technology. In 2005, `Sun` released over 1,600 patents
    to the public, and in 2006, the company made `Java` open source. This left control
    over `Java` in `Sun’s hands`, but anyone could see the source code, use it, and
    adapt it. The company continued to enjoy strong sales and growth.


    Everything changed with the start of the Great Recession in December 2007\. As
    the global economy slowed, stock prices dropped—again. This time, the bubble wasn’t
    confined to the tech industry. Consumers started spending less, and many companies
    like `Sun` suffered. Rumors of `Sun` mergers and buyouts circulated in business
    magazines and websites. Then, in April of2009, another technology company called
    `Oracle` stepped in and bought `Sun Microsystems, Inc.` for around $7.4 billion.


    Not surprisingly, the `Oracle` executives, led by founder and then-CEO Larry Ellison,
    had some different ideas about how to do business. According to `James Gosling`,
    `Oracle` executives were excited early on about the prospect of making even more
    than they’d spent to buy `Sun`, in a lawsuit against one of the most popular brands
    in the world: `Google`.


    In September of 2008, `Google` had released `Android`, an operating system primarily
    for touchscreen devices like smartphones and tablets. A small team of developers,
    led by Andy Rubin, started `Android, Inc.` in 2003, and `Google` had bought the
    company for $50 million two years later, before the system was ready to show the
    public, bringing the founders along as employees to finish the job. While the
    core of `Android` was written in `C`, its user interface (the way users interact
    with the system) was all `Java`. This was exactly the kind of use that had led
    the `Sun` executives to make `Java` open source: a powerful innovation from smalltime,
    startup developers. But `Google` was no small-time startup, and it would soon
    be making massive profits off code largely lifted—without payment—from `Sun`.


    ### The iPhone in Korea


    While `Android` was still new on the market, two bigger smartphone producers were
    gearing up for legal battle on a global scale. In 2010, the Korean company `Samsung`
    released the `Galaxy S`, a phone that looked and worked a lot like the `Apple
    iPhone`, then the smartphone of choice for many users. After early talks failed,
    `Apple` sued `Samsung` for copyright infringement. After two years, several suits
    and countersuits, and millions in legal fees, two US juries found that `Samsung`
    executives and developers had intentionally stolen parts of the `iPhone’s` technology
    and design, and demanded that `Samsung` pay `Apple` $400 million in damages. Other
    courts in other countries ruled that both companies had violated each other’s
    patents, and still other courts ruled that neither violated any patents.


    ![Image](page78_image1.jpg)


    Your preference in smartphones might be based on the way a phone looks and responds
    . No matter the phone, these characteristics depend on `Java`.


    The fighting didn’t stop in 2012\. In December 2016, the US Supreme Court unanimously
    reversed the earlier decision (and the $400 million award) and sent the case back
    to a lower court for further legal wrangling. In the meantime, smartphones quite
    literally took over global culture. As the amount of money involved in the industry
    grew, the `Samsung-Apple` battle sucked in nearly every other major smartphone
    manufacturer and developer, including `Microsoft`, `LG`, `Nokia`, and `Sony`,
    all involved in a complicated crosshatch of patent copyright lawsuits. The stakes
    rose, according to one commentator in the British newspaper the `Guardian`, because
    of just how many people have a smartphone. In the early days of the technology,
    most smartphone sales went to people who’d never had one of the devices before.
    Now, most sales are to people who already have a smartphone. That means for any
    manufacturer to grow, it has to take a customer away from a competitor. At the
    same time, the rate of advancement in smartphone technology has slowed.


    ## A Cold Coffee Date: Oracle and Google Fight Over Java


    And, of course, one of the companies now at the center of the smartphone wars
    is `Google`. `Google` turned the (Java-based) `Android OS` into a success—and
    a target—in part because it’s open source, unlike the iPhone OS in Apple’s iron
    grip, but also because manufacturers (including Samsung!) have been able to produce
    Android phones more cheaply.


    According to `James Gosling`, Sun executives had considered suing Google over
    its use of Java in the Android system. Scott McNealy and others reasoned that
    Google had violated patents, but the company didn’t want to sue. Google’s use
    of Java code, Gosling said, had a mostly positive impact on the community ofJava
    users and programmers. Suing Google would cost time and money—and it could also
    be bad for the company’s image, because of Google’s worldwide popularity.


    Oracle bought Sun in April 2009; by August 2010, the company joined the “smartphone
    wars,” suing Google for patent and copyright infringement, seeking a staggering
    $9 billion for lost revenues. Google claimed that their adoption of Java code
    fell under fair use—basically, this allows individuals and companies to use copyrighted
    material in certain circumstances without seeking permission. Google claimed that
    it could use Java because Java had always been open source—the code had been available
    to the public from the beginning. A jury voted in Google’s favor in late May 2016,
    but Oracle’s lawyers have signaled that they will appeal the ruling.


    The future of the Android system, and the freedom of developers to use already-existing
    code to create new programs, might change, but according to Gosling, at least,
    Java is “safe,” and will always be free for the public to use and to modify. Java
    is “bigger,” he says, than any one developer, application, or even industry.

