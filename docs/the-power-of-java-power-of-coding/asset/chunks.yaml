  raw: 'Programmers say that objects have states, or characteristics, and behaviors,
    or things the object can do or that can happen to the object. To understand this,
    it might help to think of real-world objects. You could say that a fish is an
    object. Every fish has “states” (characteristics): it has a name, a shape, and
    a color. The fish also has behaviors: it can swim with its fins; it can use its
    gills to take oxygen from the water; it can eat and be eaten. There are infinite
    objects in the universe, with infinite states and behaviors. This is also true
    of Java.


    And just as we love to classify things in the real world—organizing fish by species,
    family, and native environments—we also put Java objects into a class, or a general
    blueprint for creating individual objects. Classes say which states and behaviors
    objects within the class can have. When you finish writing a new program, you
    save it as a new class.


    Finally, a programmer can express an object’s behaviors through a method, a part
    of the code that says what will happen to an object, or how objects will interact
    with each other. The primary method in a class is called a main.


    #### Code Structure and Syntax


    As you might have guessed already, objects make programming complex tasks much
    easier. Objects let programmers focus on individual pieces of their code one at
    a time, before putting the objects together.


    As stated in the previous section, classes are like blueprints for creating objects,
    which means before you make an object, you need a class. Let’s say your dog ripped
    out the title page of this book. Because you want to fix the book and test out
    your programming skills at the same time, you decide to write a program that will
    print out a new title page for the book. (Don’t worry about how the program connects
    to your printer. Check the back of this book for more resources that will teach
    you about that.) You’d start by writing something like this:


    public class TitlePagePrinterApp {


    “Public” means anyone can see your app. “Class” signals that the name of your
    app will follow: we named this app “TitlePagePrinterApp.” Finally, the curly bracket,
    { , signals the opening of the class. Basically, all the code that does stuff
    comes after the curly bracket. So, once you add a method (to make your program
    do something) it could look like this:


    public class TitlePagePrinterApp {


    public static void main (String[] args) { System.out.print ("The Power of Java");


    }


    }


    Don’t worry about knowing what every single word or character here does. Beneath
    the opening line of your TitlePagePrinterApp you’ve added the main method, which
    contains a statement about what your app will do. The statement is on the third
    line:


    System.out.print ("The Power of Java");


    In this case, you’ve told your app to print the characters “The Power ofJava.”
    This is called a string. In Java, a string is just a packet of information, or
    data. The data is what you want to print: the title of this book. Every statement
    ends with a semicolon (;). The first curly bracket closes the main method, and
    the second curly bracket closes the class, TitlePagePrinterApp.


    By this point you’ve learned a lot about Java, and you also feel like playing
    a bit of a prank on your librarian, or the next person to pick up this book. So, you
    make your code a little more advanced: public class TitlePagePrinterApp {


    public static void main (String[] args) {


    System.out.println ("The Power of Java"); System.out.println ("by Stella Lopez");


    }


    }


    Now, your program prints a title page with two lines: “The Power of Java” above
    your name (which probably isn’t Stella Lopez—you could make your program write
    anything here). You’ve added “ln” to “print” in each statement to put the statements
    on separate lines. If you wanted to, you could reproduce the entire book this
    way, typing whole chapters into different statements.


    #### Object-Oriented: Coding Beyond the "Main"


    The code you just wrote, though, doesn’t take advantage of Java’s power to work
    with objects. To really understand the power of Java, you’d have to write code
    with multiple classes creating multiple objects that can interact with each other.


    If you’ve ever played Tetris, thinking about this game could help you understand
    objects in Java. In this game, squares clumped together form different shapes:
    one is a bigger square, one is a straight line, one looks like an L, one looks
    like an uppercase T, one looks like a plus sign, and one makes a zigzag. These
    fall from the top of the screen to the bottom of the screen, and players can rotate
    them as they fall, trying to stack the pieces to make straight, horizontal lines.
    Horizontal lines crossing the entire screen will disappear, but if there are gaps,
    the pieces in a line stay put. The pieces keep falling and stacking, and if the
    pile reaches the top of the screen, the player loses.


    Java would be an excellent tool for making a game like Tetris. In fact, many people
    already have made imitations of Tetris using Java. With a little work, you could,
    too. You might start by making a class called “blocks.” Remember that a class
    is like a blueprint for making different objects. From your class, blocks, you
    could make all the objects you need to play the game: the square piece, the straight
    piece, the T piece, the L piece, the plus sign piece, and the zigzag piece. Like
    all objects in Java, each would have states and behaviors. The states could be
    their sizes and colors. The behaviors could be the different speeds at which they
    fall, and the ways players could rotate them in the “air.” You’d also have to
    write a method (a specific behavior) about how the pieces could interact. In this
    case, you’d write a method making the pieces disappear whenever the player creates
    an unbroken horizontal line of blocks along the bottom of the screen. This program
    would be a lot longer than your program to print a new title page for this book.
    However, writing it in Java would be much easier than in another language, especially
    a language that isn’t object-oriented.


    ![](images/main-26.jpg)


    Java works by making easily replicable objects, which makes it perfect for games
    like Tetris .


    Your Tetris program demonstrates the last thing you need to know (for now!) about
    objects in Java. Your program actually uses all three types of methods possible
    in Java:


    • Statements: Your program does something. Statements only happen once, and happen
    automatically. For example, a statement could do something as simple as start
    the game as a player opens the program. If you wanted to get fancier, you could
    add a statement to present a title screen. This code would look pretty similar
    to your “TitlePagePrinterApp” code.


    •    Loops: Loops are methods that repeat themselves ... over and over and over, until
    the program stops running. In your Tetris game, you’d use a “loop” method for
    the falling blocks. You want these blocks to keep falling, to challenge the player.


    •    Branching: This method is “triggered.” It happens if: if something else happens,
    or under a certain set of conditions. This is the type of method you would use
    to make the blocks disappear. This doesn’t happen automatically, and it doesn’t loop
    without stopping. Pieces only disappear under a certain condition: if the player
    lines up a row of squares. (You could also write a branching method to make a
    big “YOU LOSE” sign pop up, triggered by the blocks reaching the top of the screen.)


    #### Beyond Language: Compiler, Platform, and Machine'
