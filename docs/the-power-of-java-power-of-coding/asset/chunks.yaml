  raw: 'Remember that the other great promise of Java, besides the “object-oriented”
    approach, is portability. That means you can write it on any platform, and it
    can run on any other platform. Imagine if a spoken language worked this way. Imagine
    that you were standing in front of the entire United Nations with a speech to deliver.
    You wrote the speech in English, but as soon as the words left your lips, hundreds
    of other people could understand your speech in their own languages— Spanish,
    Hindi, Arabic, Afrikaans, Mandarin, and so on—without the aid of a real-time translator.
    Imagine speaking in English and not having any doubt that all other people in
    the world could understand you, no matter what language they chose to speak. This would
    be an amazing power (and a lot of translators would need to find new jobs).


    Java works this way because of something called the compiler. The Java compiler
    is a program that takes Java source code and transforms it into another programming
    language. In this case, we’re talking about assembly language, which is specific
    to different machines. So, a Windows computer, an Apple computer, a Linux computer,
    and an Android phone will each have its own assembly language; so will a digital
    watch, a radio/alarm clock, and a TV. The Java compiler can take the plain text
    of your program (like the “TitlePagePrinterApp” we made earlier) and “compile”
    it into a .class file written in bytecode. All you really need to know about bytecode
    is that you couldn’t “read” it, and that it’s not native to any machine or platform.


    ![](images/main-27.jpg)


    The Java Virtual Machine is the technology behind the Java''s promise to "Write
    Once, Run Anywhere . "


    Instead, this bytecode goes to the Java Virtual Machine (JVM), which is like a
    virtual computer. This JVM can work on any platform or machine, using the Java
    Application Programming Interface (API). Because an API is a set of instructions that
    allow a platform to run a program, with the help of the Java API, the JVM can
    run your code on any platform. As you can imagine, the possibilities of such a
    “portable” language are limitless.


    ### The Wave Glider


    o o o


    Owned by the company Boeing, which is best known for its airplanes, Liquid Robotics
    makes and sells something called the Wave Glider, a robot that gathers data from
    the ocean . Without a pilot, the Wave Glider can float and function on its own
    for over a year, powered by the energy of the sun, the waves, and—you guessed
    it—Java .


    James Gosling, the "father of Java," joined Liquid Robotics as Chief Software
    Engineer in 2011\. Their Wave Glider software uses the Java programming language
    . It''s not surprising that he ended up here: Gosling always had an interest in
    "cool toys . " During the late 1990s and early 2000s at Sun, Gosling became known
    for giving fun conference presentations on robots and other devices that did exciting
    things with Java . This was a small part of his job at Sun (later Oracle), but
    his interest in "toys" might have led him to his current job programming ocean
    robots .


    The Wave Glider has two parts . There is a platform that floats on the surface
    of the water, gathering energy through solar panels . Suspended below, a "submarine"
    uses movable wings to take the energy of the waves and propel itself forward .


    Gathering data from the ocean has always been difficult . There''s just so much
    of it—so much ocean and so much data . Research has been expensive and full of
    dangers . The Wave Glider, however, can collect all sorts of information and upload
    it immediately to cloud storage, so researchers can get to it without ever checking
    in on the robot in person . It can help environmentalists gather data on weather
    and wave patterns and even sonic information about animal migration . Militaries
    and other government operations can use it to patrol borders, detect threats,
    and combat piracy and smuggling . It can even help energy companies explore natural
    resources and reduce risk to human employees . The robot can "swim" on its own for
    a year or more, avoiding obstacles like ships on its own (probably using a series
    of "branching" methods in its Java code) . Some Wave Gliders have survived hurricanes
    and shark attacks . Best of all, the Wave Glider requires no refueling and no
    manpower, and it doesn''t pollute the atmosphere in any way. It''s so efficient
    that most of the energy it takes from the sun goes toward its powerful computers
    . This technology should have applications beyond Earth, too: if we ever discover
    another planet covered in liquid, scientists would probably use a version of the
    Wave Glider to explore it .


    According to Gosling, one of Java''s most powerful applications is in **artificial
    intelligence (AI)** . This means any computer that can make some decisions on
    its own and can "teach," or improve, itself. The Wave Glider is one example .
    While writing the software, Gosling included an instruction for the gliders: basically,
    "don''t be afraid of ships . " Now captains are afraid of crashing into gliders,
    until they see the "smart" robots change course and avoid the collision on their
    own . This is very easy to do in Java, Gosling says, and would be much harder
    in other languages . On top of that, the glider is based on one of the core beliefs
    and goals of the old Green Team: it can communicate the information it gathers
    across any platform .


    ![](images/main-29.jpg)


    Opposite: The best way to understand the strengths and weaknesses of a computer
    language is to jump in and start coding .


    ![Image](image_004_.jpg)


    Strengths and Weaknesses


    It’s clear that Java is a pretty powerful tool. You can use it to make websites
    appealing, fun, and interactive. You can use it to design cool video games. And
    because of the compiler and Java Virtual Machine, you can easily port your Java
    program between different devices.


    ![](images/main-33.jpg)


    The campus of Bell Laboratories, where Dennis Ritchie got his start .


    Remember, though, that Java isn’t the only programming language, and it isn’t
    the “best.” There can’t be a “best” programming language, just like there couldn’t
    be a “best” spoken, human language. Each one is beautiful and fascinating in its
    own way. Each allows for different types of expressions or applications. In fact,
    computer-programming languages are most like spoken human languages in this way.
    They often accomplish the most when people use different languages together. In
    this chapter, you’ll learn more about how Java compares to other languages: what
    its strengths and weaknesses are, and how you might use it along with other languages
    to do things none could accomplish on their own.


    #### Growing Java from an Oak Tree, and an Oak Tree from a "C"


    Recall that James Gosling worked on an earlier version of the Java language, before
    the rest of his team picked a name. He called this language Oak. Even Oak didn’t
    appear out of nowhere, though. It grew from the seed of C.


    Or, rather, it grew from the frustration Gosling and others felt using the much-older
    programming languages C and C++. C had been around since the early 1970s. C++
    appeared in 1983\. You might remember that computers “speak” to themselves in machine
    language, the binary code of ones and zeroes. Because it isn’t easy to make a
    computer do anything writing in machine language, developers built other languages
    on top and called these assembly languages. Assembly languages were still a little
    clumsy, though, so an engineer named Dennis Ritchie working at Bell Labs (a hundred-year-old
    communications monopoly that became AT&T) designed C as an easier-to-use language
    that bypassed the assembly languages and mapped right onto machine language.


    ![](images/main-34.jpg)


    Java would not have been possible without Dennis Ritchie''s language called C
