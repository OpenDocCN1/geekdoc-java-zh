    them by a sort of messy majority rule. That means any user has the potential to
    change the language. This happens all the time in English. Someone alive today
    was the first to say Google (as a verb), selfie, bling, bromance, “hater,” “LOL,”
    and “noob.” Today, if you use these words, most English speakers will know what
    you mean—but when we break too many rules or make up too many words, the results
    can be funny, or they can cause communication to come to a grinding halt.


    So-called dead languages, like Latin or Pictish or Ubykh, don’t work this way.
    Because ordinary people (not academics) don’t speak these languages, their vocabularies
    never grow and their grammatical rules will stay the same, as long as anyone remembers
    them.


    ### Ada Lovelace: the Poet-Programmer


    o o o


    Born in 1815 and raised by her mother, an English aristocrat named Annabella Milbanke,
    Ada Byron, the Countess of Lovelace, would live only thirty-six years and die
    alone following a painful battle with cancer. In her short life, however, she
    struggled past the limited educational opportunities then available to women,
    earned the love and respect of friends and admirers across the world, and eventually
    became known as "the first computer programmer. " Ada was the daughter of Lord Byron,
    one of the most famous of all British poets . Byron left Annabella just two months
    after Ada was born, to pursue adventures in the Greek War of Independence against the
    Ottoman Empire . He died there in 1824, when Ada was still a child . Byron was
    a great traveler and a man of odd habits . Some people found him romantic and
    inspiring, and others found him scandalous and offensive . Upset with Byron, Annabella
    tried to influence her daughter Ada away from his poetry—and what she thought
    was his "madness"—and encouraged the young girl to study math and science instead
    . Though Ada never knew her father, she developed a lifelong interest in his work
    . The result of this divided education was an unusual (and powerful) intelligence:
    Ada''s mind was equally suited to mathematical as well as artistic thought .


    ![](images/main-24.jpg)


    Ada Lovelace helped spread the earliest computer research .


    When Ada was a teenager, she met Charles Babbage, an inventor and mathematician
    . As the Industrial Revolution picked up steam in the early 1800s, scientists
    and businesspeople needed workers to produce (and copy) lots of complicated calculations
    without any errors . Babbage imagined a machine that could do these calculations automatically.
    He called this the "Difference Engine . "


    Theory raced ahead of technology. Babbage had imagined a machine with parts too
    difficult for metalworkers to make at a reasonable cost . Still, conversations
    with the intelligent and curious Ada spurred him on to further theories and inventions
    . Babbage was so inspired by Ada''s mind that he called her "the Enchantress of
    Numbers . " For her part, Ada was a key figure in popularizing and refining these
    developments in mathematics and the field that would eventually become computer
    programming . She translated work by foreign mathematicians into English, and
    she published extensive and beautifully written notes on the latest thinking in
    mathematics . Building off Babbage''s work, she described how the computer might be
    automated to do certain complex calculations—really programs, like what we can
    do today with Java and other languages . In these notes and other writings, her
    mathematical and poetical powers came together. She described complex math and
    computing in vivid terms anyone could understand . Perhaps because her approach
    to the field was, as she called it, "poetical science," she was able to imagine
    the potential for the computer beyond what anyone else at the time could see .


    Computer programming languages are somewhere in between these two. Programming
    languages, like Java, C, and HTML, are “living,” because real people use them
    and could even end up changing them. Unlike spoken languages, however, computerprogramming
    languages have “owners”: the rules of Java only change when Oracle’s programmers
    decide to change them. If you don’t like the rules, you can hope this happens—or,
    as many programmers have done, you can make up your own, new language.


    #### Understanding Java Syntax


    At the most basic level, all languages work the same way. Every language has “packets”
    of information. For most languages, we call the smallest packets “letters” and
    bigger packets “words.” For example, the letter “D” contains information: if you
    know the letter, you know what it’s supposed to sound like when it’s spoken as
    a part of a word. You can probably list a hundred words right now that begin with
    the letter “D.” When you put these packets together, they can mean something much
    more than just a sound. For example, if you put the letters D-O-G together, you’ve
    made the word dog, and that packet carries a lot of information. Just seeing the
    word dog in print probably puts an image in your mind. You might think of dachshunds
    or retrievers, bulldogs, or poodles. You feel love or affection thinking of your
    own pet or a friend or neighbor’s pet. You might remember fear, thinking of the
    time you saw an angry dog, or you might feel sadness, thinking of a dog that died.
    All this—all these feelings and images—are only possible because you know what
    the shapes D, O, and G mean when they’re placed together.


    All languages also have a syntax, or a set of rules about how those packets of
    information can be put together, and how their arrangement can carry much more
    meaning than any of the packets could on their own. You can say the word “dog”
    to another English speaker and trust that he or she understands what you mean.
    But if you want to say something about a dog, you need more words, and that could
    quickly get confusing if you didn’t share a set of rules about how to use those
    words. Grammar lets us express our deepest feelings, give more complicated instructions, and
    turn our dreams of how the world might be into reality by sharing those dreams
    with other people.


    Math is a language, too. It has packets of information—numbers, as well as symbols
    like plus and minus signs, decimals, and parentheses—and the syntax of math is
    the set of rules that allows us to interpret these signs, or packets of information,
    when they’re arranged in complex patterns.


    Like any other language—like English, German, or mathematics—Java also has packets
    of information and a syntax allowing us to arrange and interpret them. In fact,
    it’s one of the easier programming languages to learn, once you understand some
    of its basic features.


    #### Understanding Objects


    The way Java handled information and commands was revolutionary. Unlike other
    languages built around commands, instructions to a computer to “do this” or “do
    that,” Java is an object-oriented language. Instead of actions, objects are at
    the center of everything in Java.


    So, what are objects? “Object” is a single word that can mean many things. In
    fact, we can often use it interchangeably with “thing.” In English, we use the word
    “object” to refer to anything that has physical properties—in other words, anything
    we can sense. If you can touch, taste, smell, hear, and see something, it might
    be an object. Often, we use the word when we don’t have a better, more specific
    word ready. For example, you might call something strange shooting across the night
    sky a “UFO” (Unidentified Flying Object).


    In computer programming, an object is a package of data and operations, or actions
    that happen to that data. Packaging data in this way allows programmers to work
    on different parts of their program separately—a great help when working with
    large, complicated projects. The first object-oriented language was called Simula,
    invented in 1967, but Java was the first object-oriented language widely used.'
