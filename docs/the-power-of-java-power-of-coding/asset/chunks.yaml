- fmt: '

    Sun did recover, but not completely. In the late 1990s, Sun''s motto was, "We''re
    the dot in dot com," and this wasn''t all bluff: serious, successful companies
    used Sun products for computing . Shockwaves from the bubble bursting hit Sun
    and knocked the company from its top spot . It suffered another blow in the Great
    Recession of 2007 to 2009 . Soon there was talk of IBM buying Sun, though this
    deal never came to pass . After twenty-seven years at the top of the computer
    industry, Sun shareholders sold the company to Oracle for $5.6 billion . Oracle
    started deep layoffs, while top engineers soon resigned, and the founders—Bechtolsheim,
    McNealy, Khoslaall, and Joy—went on to successful careers as investors, inventors,
    and managers of later startups . All are still active in the computer industry
    today.


    One PC was powerful, but a network of millions and later billions of PCs would
    have literally infinite potential. Instead of putting the PC at the heart of the
    computing world, Sun Microsystems encouraged its employees and customers to think
    of the network first. The real power wasn’t in the personal computer, but in the
    fact that billions of PCs could be connected. This had a huge impact on the way
    Sun did business. The company started to focus more on interconnectivity as an
    ultimate goal. Part of the “power” McNealy imagined came from the unlimited sharing
    of information. If one person invents something and keeps it to herself, that
    technology will stay at its current level of development until the inventor finds
    a reason and a way to improve it. But if every new invention was shared instantly,
    all of its parts and processes shared with all of the innovators in the world,
    then you can bet that some of those people would find way to improve the invention
    right away. Because of Scott McNealy’s attitude and the attitude of others who
    shared his beliefs, that’s how much of the internet works today. We call this
    an open-source model. Open-source means that the original, or “source,” code for
    something is freely available for people to study and change. When someone invents
    a new tool or language, they very often share that information with the whole
    world, through the web, giving others the opportunity to improve on what they’ve
    made. This speeds up the rate of technological development; you might even say
    it speeds up the rate of human history.


    Keeping their motto, “The network is the computer,” in mind, the FirstPerson researchers,
    still led by Gosling, started work on a browser like Mosaic that would use the
    language they had created for their now-abandoned `7 device`. They studied different
    areas of the fast-developing tech industry, traveling to consumer electronics
    manufacturers in Europe and Asia. They saw these consumer electronics, like CD
    players, pagers, cell phones, cameras, radios, and even toy helicopters, as being
    on a “collision course” with the internet. They saw, in other words, the future
    we now know as the present. They knew that they were creating something powerful,
    maybe so powerful that it could change the world. But they also knew that something
    so important needed a better name than Oak.


    ## What''s in a Name


    “Oak” wouldn’t work. It was fine to use as a code word among Sun developers, but
    another company, Oak Technologies, had trademarked the name, so the Sun employees
    had to come up with something else before they went public with their new ideas.


    Kim Polese, the Oak product manager, gathered the entire team working on the new
    technology into one room, with a whiteboard in the front. It was January of 1995,
    and Sun was almost ready to debut their new technology. It would be a good old-fashioned
    brainstorming session. Polese wanted a name that captured the “essence” of the
    language and platform— something “dynamic, revolutionary, lively, fun.” The team
    members started shouting out names, and Polese wrote them on the whiteboard. People
    in the room that day remember a few of the names suggested: Ruby, Silk, Neon,
    WRL (for WebRunner Language), DNA, Lyric, Pepper. Gosling recalls the session
    as “craziness,” with at least a dozen people shouting out words and then arguing
    over the suggestions. They managed to narrow their list down to about a dozen
    finalists, and sent these to their lawyers. The legal team advised that only `Java`,
    `DNA`, and `Silk` were safe choices.


    One programmer, Arthur Van Hoff, credits another colleague, Chris Warth, as the
    one who shouted out “Java” first. Warth doesn’t remember if he offered the name
    “Java” or not, but he does admit to having a cup of `Peet’s Java`—the coffee of
    choice at Sun in those days—in hand at the meeting.


    Sometimes used as a synonym for coffee, Java is actually the name of one of the
    islands that make up Indonesia. Dutch traders brought the coffee plant, native
    to Ethiopia, from their Indian colonies to Indonesia at the end of the seventeenth
    century. Within a decade, the Dutch East India Company was shipping the first
    “Java beans” for sale in Europe. Today, Indonesia is the fourth largest producer
    of coffee.


    ## James Gosling


    ![Gosling](images/main-11.jpg)


    Sporting shoulder-length gray hair, a matching beard, and the same pair of spectacles
    he wore in the 1970s, today Gosling looks like the Santa Claus of the San Francisco
    Area. Born in 1955 in Alberta, Canada, Dr. Gosling is a computer scientist best
    known for his work on Java . He earned his BSc at the University of Calgary and
    earned his MS and PhD at Carnegie Mellon University, completing his doctoral dissertation
    in 1983 . Within a year, he was employed as a software developer at Sun Microsystems,
    Inc., a young and quickly growing company. Between 1984 and 2010, Gosling worked
    for Sun, where he eventually led the team that created Java . While many researchers
    and programmers were involved with inventing Java, most credit Gosling as the
    "father" of the language and platform . Gosling invented Oak, the language that
    preceded Java, in the early 1990s, and he was a key player who helped shift the
    attention of Sun developers—and the world at large—toward the internet .


    Another technology company, Oracle, bought Sun in 2009, and as usually happens
    with mergers and buyouts, the culture of the company changed . According to Gosling,
    he took a pay cut and a demotion and lost many of the freedoms he had enjoyed
    for twenty-six years at Sun . Within a year, he''d quit the company that he''d
    helped to change the world .


    After taking some time off, Gosling moved to Google, where he was a software engineer.
    Gosling was far from the first exSun employee to move to Google . Many had come
    before him, and Google had used Java to create its popular Android phones, which
    had overtaken the iPhone as the most popular cellular device on the market . However,
    Oracle was convinced that Google had broken the law in using so much Java code
    . As owners, they were determined to take Google to court and win a large settlement
    . Gosling was caught in a difficult position and didn''t speak much about the
    lawsuit during his short time at Google .

