    \ 你世界中的 Java：智能手机与 Pokemon Go\n\n2016 年的夏天非常炎热。根据美国气候科学家的说法，2016 年是史以来最热的一年，7\
    \ 月和 8 月是该年最热的月份。通常，这种温度会让人们待在室内，享受空调的舒适，或者至少靠近风扇和冷饮。但那个夏天，许多人选择在户外度过更多时间。在 7\
    \ 月和 8 月，无论你走到哪里，都能看到人们在行道和草坪上来回走，没有明显的规律，低头盯着智能手机屏幕。比温度更热的是：一个全新的简单应用，名为 Pokemon\
    \ Go。7 月 6 日，视频游戏公司天堂联合游戏开发公司 Niantic 推出了一款游戏，这款游戏重启了一个拥有二十年历史的品牌“宝可梦”，同时也改变了孩子和成人与手机以及彼此之间互动的方式。这不仅仅是一阵时尚——它是一种现象。这款游戏成为智能手机历史上增长最快的应用（或应用程序，指任何计算机程序，从大型游戏到像计算器这样的微型工具）。如今，它是历史上最受欢迎的智能手机游戏。在发布后仅六个月，该应用就为其者赚取了\
    \ 10 亿美元。\n\n玩 Pokemon Go 的潜在危险在发布后不久变得显而易见。这张告示牌是 2016 年夏天于纽约市张出的。\n\n"
