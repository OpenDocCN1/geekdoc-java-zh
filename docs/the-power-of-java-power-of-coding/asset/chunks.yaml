    记住，Java 除了“面向对象”的方法之外的另一个大承诺是可移植性。这意味着你可以在任何平台上编写它，并且它可以在任何其他平台上运行。想象一下如果一种口语是这样工作的。想象你正站在整个联合国面前准备发表说。你用英语写了演讲稿，但话一离开你的嘴唇，成百上千的其他人就能用他们自己的语言——西班牙语、印地语、阿拉伯语、阿非利语、普通话等——听懂你的演讲，无需实时翻译员的帮助。想象一下用英语说话，而不用担心世界上其他人是否听懂你，无论他们选择说哪种语言。这将是一种巨大的力量（而且很多翻译员需要寻找新工作了）。


    Java 之所以能这样工作是因为一种被称为“编译器”的东西。Java 编译器是一个程序，它获取 Java 源代码并转换为另一种编程语言。在这种情况下，我们说的是汇编语言，它是特定于不同机器的。因此，Windows
    计算机、苹果计算机、Linux 计算机和安卓手机各各自自己的汇编语言；数字手表、收音机/闹钟和电视也是如此。Java 编译器可以将你程序的纯文本（例如我们之前制作的“TitlePagePrinterApp”）“编译”成用字节码编写的
    `.class` 文件。关于字节码，你真正需要知道的是你无法“读取”它，而且它不是任何机器或平台的原生语言。


    ![](img/main-27.jpg)


    Java 虚拟机是 Java “一次编写，随处运行”承诺背后的技术。


    相反，这些字节码会进入 Java 虚拟机（JVM），它像一台虚拟计算机。这台 JVM 可以使用 Java 应用程序编程接口（API）在任何平台或机器上运行。因为
    API 是一允许平台运行程序的指令集，在 Java API 的帮助下，JVM 可以在任何平台上运行你的代码。正如你可以想象的，这种“可移植的”语言的可能性是无限的。


    ### 波浪滑行者 (Wave Glider)


    o o o


    Liquid Robotics 公司由以飞机闻名的波音公司拥有，他们制造并销售一种名为 Wave Glider 的设备，这是一种从海洋中收集数据的机器人。在没有飞行员的情况下，Wave
    Glider 可以在水面上漂浮并运行一年多，动力来自太阳、波浪以及——你猜对了——Java。


    “Java 之父”詹姆斯·高斯林（James Gosling）于 2011 年加入 Liquid Robotics 担任首席软件工程师。他们的 Wave Glider
    软件使用了 Java 编程语言。他最终来到这里并不令人意外：高斯林一直对“酷炫的玩具”感兴趣。在 20 世纪 90 年代后期和 21 世纪初在 Sun 公司期间，高斯林因对机器人和其他使用
    Java 执行令人兴奋的设备进行有趣的会议演讲而闻名。这是他在 Sun 公司（后来的 Oracle 甲骨文）工作的一小部分，但他对“玩具”的兴趣可能导致了他现在编写海洋机器人的工作。


    Wave Glider 有两个部分。有一个漂浮在水面上的平台，通过太阳能板收集能量。悬挂在下方的“水艇”使用移动的机翼获取波浪能量并推动自己前进。


    从海洋中收集数据一直以来都很困难。那里有太多的海洋和数据。研究非常昂贵且充满危险。然而，Wave Glider 可以收集各种信息并立即上传到云存储，因此研究人员无需亲身检查机器人就能获取数据。它可以帮助环保主义者收集天气和波浪模式的数据，甚至关于动物迁徙的声学信息。军队和其他政府部门可以使用它巡逻边境、探测威胁并打击海盗和走私。它可以帮助能源公司探索自然资源并降低人类员工的风险。该机器人可以自己“游泳”一年或更久，自动避开船只等障碍（可能使用了其
    Java 代码中的一系列“分支”方法）。一些 Wave Glider 曾经历过飓风和鲨鱼攻击。最棒的是，Wave Glider 不需要加燃料，也不需要人力，而且它不会以任何方式污染大气。它是如此高效，以至于它从太阳获取的大部分能量都流向了它功能强大的计算机。这种技术在地球之外也应该有应用：如果我们某天发现了另一个被液体覆盖的行星，科学家们可能会使用
    Wave Glider 的某个版本来探索它。


    根据高斯林的说法，Java 最强大的应用之一是人工智能（AI）。这意味着任何可以独立做出某些决策并能够“教”或改进自身的计算机都是如此。Wave Glider
    就是其中一个例子。在编写软件时，高斯林为滑行器加入了一条指令：基本上是“不要害怕船只”。现在，船长们担心撞上滑行器，直到他们看到“智能”机器人自己改变方向并避开碰撞。高斯林说，这在
    Java 中非常容易做到，而在其他语言中会困难得多。


    ### 优势与劣势


    显然，Java 是一个非常强大的工具。你可以用它让网站变得吸引人、有趣且具有互动性。由于编译器和 Java 虚拟机，你可以轻松地在不同设备之间迁移 Java。


    ![](img/main-33.jpg)


    贝尔实验室园区，Dennis 在这里开始了他的职业


    但请记住，Java 并不是唯一的编程语言，它也不是“最好的”。不存在“最好的”编程语言，就像不存在“最好的”人类口语一样。每种语言都有其独特的美和魅力。每种语言都允许不同类型的表达或应用。事实上，计算机编程语言在这方面最像口语。当人们使用不同的语言时往往能取得最大的效果。在本章中，你将学习更多关于
    Java 如何与其他语言比较的内容：它的优势和劣势是什么，以及你如何与其他语言配合使用完成单一种语言无法完成的任务。


    #### 从橡树长出 Java，再从 C 语言长出橡树


    回想起詹姆斯·高斯林在他团队挑选名字之前，曾编写过早期版本的 Java 语言。他把这种语言称为 Oak（橡树）。不过，Oak 也并非空空。它是从 C 语言的种子长出来的。


    或者说，它是从高斯林等人在使用更老老的 C 和 C++ 编程语言时感到的挫败中成长出来的。C 自 20 世纪 70 年代初以来一直存在。C++ 出于 1983
    年。你可能记得计算机用机器语言（0 和 1 的二进制代码）与自己“对话”。因为用机器语言编写任何让计算机做的事情都不容易，开发者在此基础上构建了其他语言，并称之为汇编语言。尽管汇编语言仍然有些笨拙，一位在贝尔实验室（一家拥有百年历史的通信垄断，后变为
    AT&T）工作的工程师丹尼斯·里奇（Dennis Ritchie）设计了 C 这种更易使用的语言，它跳过了汇编语言直接映射到机器语言。


    ![](img/main-34.jpg)


    没有丹尼斯·里奇的 C 语言，Java 将是不可能的。


