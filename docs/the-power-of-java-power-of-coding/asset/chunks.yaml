  trans: "\n程序员说对象具有状态（states）或特征，以及行为（behaviors），即对象可以做或发生在对象身上的事情。为了理解这一点，思考现实世界中的对象可能会有所帮助。你可以说鱼是一个对象。每条鱼都有“状态”（特征）：它有名字、形状和颜色。鱼还有行为：它可以用鱼鳍游泳；它可以用鳃从水里吸收氧气；它会吃东西也会被其他东西吃掉。宇宙中存在着无限的对象，它们拥有无限的状态和行为。对于\
    \ Java 来说也是如此的。\n\n正就像我们喜欢对现实世界中的事物进行分类——根据物种、科和原生环境对鱼进行分类——我们也将 Java 对象放入一个 `class`（类）中，或者说它是创建单个对象的通用蓝图。`Classes`（类）规定了类中的对象可以拥有哪些状态和行为。当你写完一个新程序时，你会将其保存为一个新的\
    \ `class`。\n\n最后，程序员可以通过 `method`（方法）来表达对象的行为，方法是代码的一部分，说明了对象上将发生什么，或者对象之间将如何相互作用。类中的主要方法被称为\
    \ `main`。\n\n## 代码结构与语法\n\n正如你可能猜到的那样，对象让复杂的编程任务变得简单得多。对象让程序员在将对象组合在一起之前，一次只关注代码的某一部分。\n\
    \n正如上一节所述，`classes`（类）就像是创建对象的蓝图，这意味着在创建对象之前，你需要一个 `class`。假设你的狗咬破了这本书的标题页。因为你想在修复书的同时测试你的编程技能，所以你决定写一个程序来为书打印一个新的标题页。（不用担心该程序如何连接到你的打印机。请查看本书的末尾获取更多资源，它们将教你如何操作。）你会从编写类似下面的代码开始：\n\
    \n```java\npublic class TitlePagePrinterApp {\n```\n\n“Public”（公共）意味着任何人都可以看到你的程序。“Class”（类）信号你的程序名称将紧：我们将这个程序命名为“TitlePagePrinterApp”。最后，大括号\
    \ `{` 标志着类的开始。基本上，所有执行操作的代码都位于大括号之后。所以，一旦你添加了一个 `method`（让你的程序执行某些操作），它看起来可能像这样：\n\
    \n```java\npublic class TitlePagePrinterApp {\n    public static void main (String[]\
    \ args) {\n        System.out.print (\"The Power of Java\");\n    }\n}\n```\n\n\
    不用担心是否知道这里每一个单词或字符的作用。在你的 `TitlePagePrinterApp` 起始行下方，你添加了 `main` 方法，它包含了一条关于你的程序将要做什么的语句。该语句位于第三行：\n\
    \n`System.out.print (\"The Power of Java\");`\n\n在这种情况下，你告诉你的程序打印出“The Power of\
    \ Java”这几个字符。这被称为一个 `string`（字符串）。在 Java 中，`string` 仅仅是一个信息包或数据。这些数据就是你想打印的内容：这本书的标题。每条语句都以分号（`;`）结束。第一个大括号关闭\
    \ `main` 方法，第二个大括号关闭类，`TitlePagePrinterApp`。\n\n到目前，你已经学习了许多关于 Java 的知识，而且你还想对你的图书管理员或者下一个拿起此书的人开个小玩笑。所以，你让你的代码变得稍微高级一点：\n\
    \n```java\npublic class TitlePagePrinterApp {\n    public static void main (String[]\
    \ args) {\n        System.out.println (\"The Power of Java\");\n        System.out.println\
    \ (\"by Stella Lopez\");\n    }\n}\n```\n\n现在，你的程序打印了一个带有两行的标题页：“The Power of\
    \ Java”在你的名字上方（你的名字可能不是 Stella Lopez——你可以让你的程序在这里写任何内容）。你在每条语句中都在 `print` 上添加了\
    \ `ln`，以便将语句放在不同的行上。如果你愿意，你可以通过这种方法复制整本书，将整个章节输入到不同的语句中。\n\n## 面向对象：超越“Main”的编码\n\
    \n然而，你刚刚写的代码并没有利用 Java 处理对象的强大能力。要真正理解 Java 的力量，你必须编写带有多个 `classes`（类）的代码，创建多个可以相互作用的多个对象。\n\
    \n如果你玩过俄罗斯方块，思考这个游戏可能会帮助你理解 Java 中的对象。在这个游戏中，聚集在一起的方块形成了不同的形状：一个较大的正方形，一个是一条直线，一个像\
    \ L 型，一个像大写 T 型，一个像加号，还有一个是锯字形。这些方块从屏幕顶部掉落到屏幕底部，玩家可以在它们掉落时旋转它们，试图通过堆叠碎片来形成整齐的水平线。横跨整个屏幕的水平线将会消失，如果有间隙，行中的碎片就会留在原地。碎片不断掉落和堆叠，如果碎片堆到达屏幕顶部，玩家就输了。\n\
    \nJava 是制作俄罗斯方块这类游戏的极佳工具。事实上，已经很多人使用 Java 制作了俄罗斯方块的模仿品。只要稍努力，你也可以。你可能会从创建一个名为“blocks”（块）的\
    \ `class` 开始。记住，`class` 就像创建对象的蓝图。从你的 `class` 中，你可以创建玩游戏所需的所有对象：正方形碎片、直线碎片、T 型碎片、L\
    \ 型碎片、加号碎片、锯字形碎片。像 Java 中所有的对象一样，每个对象都有状态和行为。状态可以是碎片的大小和颜色。行为可以是它们掉落的速度以及玩家在“空气”中旋转它们的方式。你还需要编写关于碎片如何相互作用的\
    \ `method`（特定行为）。在这种情况下，你会写一个让碎片消失的 `method`。这不会自动发生，也不会在不停止的情况下循环。碎片在特定条件下消失：如果玩家对齐了一行方块。（你还可以写一个分支\
    \ `method` 来弹出一个巨大的“你输了”标志，其触发条件是碎片到达顶部。）这个程序会比你为这本书打印标题页的程序长得多。然而，在 Java 中编写它比其他语言要容易得多，尤其是非面向对象的语言。\n\
    \n![main-26.jpg]()\n\nJava 通过创建易复制的对象来工作，这使其非常适合俄罗斯方块这样的游戏。你的俄罗斯方块程序展示了关于 Java\
    \ 对象你需要了解的（目前而言）最后的知识。你的程序实际上使用了 Java 中可能的所有类型方法：\n\n- **语句 (Statements)**：你的程序执行操作。语句只发生一次，并且自动发生。例如，一条语句可以执行简单的在玩家打开程序时开始游戏。如果你想更花哨一点，可以添加一条语句来显示标题界面。这段代码看起来会和你的\
    \ `TitlePagePrinterApp` 代码相似。\n- **循环 (Loops)**：循环是在程序停止运行之前反复自身的方法。在你的俄罗斯方块游戏中，你会使用一个“循环”方法来处理掉落的块。你希望这些块不断掉落，以挑战玩家。\n\
    - **分支 (Branching)**：这种方法是被“触发”的。它的发生是因为：如果发生了其他事情，或者在特定的条件下。这就是你用来让碎片消失的方法类型。这不会自动发生，也不会在不停止的情况下循环。\n\
    \n## 超越语言：编译器、平台与机器\n"
