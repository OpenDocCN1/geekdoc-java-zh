- fmt: '

    One example of this “cross-platform paradigm” in action was the invention of Virtual
    Network Computing, or `VNC`. In the late 1980s, most computing was done on desktops.
    However, the possibilities, especially graphical possibilities, of computing,
    created a demand for scientists and businesspeople to use computers to deliver
    visual presentations in different locations. Today we have cloud storage services
    like `OneDrive`, `Dropbox`, and `Google Drive`, but back then, computer users
    were far more limited, and data sharing was not a quick or easy affair. Presenters
    would have limited options for traveling with computer files. They could transfer
    files to a floppy disk and hope that it would run on another computer, but if
    they needed to continue working on a project as they traveled, they couldn’t store
    their entire computing environment (everything you’d find on a desktop hard drive)
    on a floppy disk, and laptops were bulky, heavy, expensive, and fragile.


    Researchers at Cambridge came up with a solution. It was one of the first great
    new applications of `Java`, and it very much fit the `Java` paradigm. `Virtual
    Network Computing` allows a user on one computer to access the display of another
    computer—from anywhere in the world. That means that a traveler could use a hotel
    computer (these were more common in the late 1980s and 1990s) and sign in to a
    `VNC` using any `Java`-capable web browser. The hotel computer screen would display
    the screen of the computer back at her home or office. She could continue working
    on the presentation there. The next day, she could use another computer to access
    that same home or office computer and deliver the presentation to an audience.
    `VNC` isn’t limited to simple tasks like presenting slides or papers, either:
    with `VNC`, you can remotely perform almost any task that you’d do sitting in
    front of your own computer. That made it useful for remote technical support and
    administration. If something goes wrong with your computer and you have `VNC`
    set up, a more experienced user can fix your problems from his or her own computer.
    Because the Cambridge team wrote `VNC` with `Java`, it works across platforms:
    a `Mac` user could remotely access a `Windows` desktop, and so on. And `VNC` isn’t
    limited to display-based platforms. From any `VNC`-capable computer, you could
    also access consumer electronics like programmable microwaves, lights, entertainment
    systems, and home security.


    Developments like this, growing out of the `Java` commitment to access and portability,
    drove further advances in software, apps, and other technologies that ease communication
    and collaboration.


    ## Write Once, Debug Everywhere: Cross-Platform Promises and Problems


    The `Java` vision of true, seamless, cross-platform development undeniably helped
    to expand access to the internet and to computing in the 1990s, but it didn’t
    always live up to the `WORA` promise. Although the `Java` compiler does allow
    a developer to write one program that will work on any platform with a `JVM`,
    there are still small differences in the way platforms run programs. Even the
    compiler and the `JVM` cannot account for all of these variations. The slight
    differences between the way a program runs on a `Mac` versus a `PC` don’t usually
    matter much. Sometimes, though, they lead to problems, which programmers call
    `bugs`. In computer programming, a `bug` is an error that causes the program to
    fail or work in some way other than what the developer intended. `Bugs` can be
    harmless, they can be irritating, or they can be disastrous—causing whole systems
    to crash, or destroying data, for example.


    ## Java and Objective-C: Developing Apps for Android and iOS


    o o o


    In 1998, the telecommunications company `Motorola` signed a licensing agreement
    to use `Java` in its cellular devices. This was the beginning of `Java`s domination
    of the smartphone industry. When developers for `Android`—the preferred operating
    system for around 80 percent of the smartphone market—wrote their operating system
    in `Java`, `Java`s dominance was complete.


    ![](images/main-37.jpg)


    Smartphone manufacturers `Apple` and `Android` have been locked in an expensive
    legal battle. At its heart is the `Java` programming language.


    The biggest competitor of `Android` devices, currently, is the `iPhone`. `Apple`
    developers created the `iPhone OS`, and all `iPhone` apps use `Objective-C`, a
    language built on top of and compatible with the older `C`, but including elements
    from the object-oriented language `Smalltalk`.


    `Objective-C` and `Java` are quite different, but most `Android` or `iPhone` users
    don''t know or care. No matter which brand they prefer, all smartphone users want
    the same tools and apps—and with a few exceptions, they get them. `Apple` developers
    have to replicate accomplishments from `Android`—and vice versa—while third-party
    developers have to build their apps in both languages.


    If you take almost any app available on both `Android` and `Apple` devices—like
    `Scanvine`, which collects trending news stories, or `Shazam`, which uses the
    built-in microphone to identify music playing near the user—differences on the
    user-end are negligible. In most cases, both will do the job equally well. The
    difference is on the back end.


    In a 2015 study, an app development company named `Infinum` studied its own apps
    and found that coding for `Android` (in `Java`) required 38 percent more lines
    of code, took 28 percent more time to complete, and was therefore significantly
    more expensive than writing code for `iPhone` (in `Objective-C`). While time and
    expense are a downside, longer code can actually make for better performance,
    though it takes longer to debug and maintain.


    Because of these subtle differences in the way `Java` programs behave on different
    platforms, `Java` developers found themselves writing programs once ... and then
    debugging them several times across different platforms. This led to a tongue-in-cheek
    take on the `Java` promise: in practice, many `Java` programmers felt they had
    to “Write Once, Debug Everywhere.”


    ## Other Limitations of the Java Language and JVM


    As recently as 2013, one `Forbes` magazine writer estimated that “Just about every
    electronic device conceivable uses some amount of `Java` programming.” This is
    a good thing. A big community of users keeps a computer programming language healthy
    and always improving. But it also means that structural flaws can cause wide-reaching
    damage.


    ![](images/main-39.jpg)


    `Java`s potential for remote computing is a boon for business people traveling
    for work. However, there have been `JVM` security concerns.


    In that same year, the US Department of Homeland Security uncovered a serious
    security flaw in all versions of `Java` that then existed. It seemed that hackers
    might be able to manipulate a computer remotely using `Java` apps—doing things
    like activating a laptop’s camera. `Oracle`, which then controlled `Java`, was
    quick to release an update fixing the security problem, but the stir over the
    issue was an important reminder about the limitations of any language, and of
    `Java` in particular.


    As discussed above, even though `Java` is so widely used, and dominates the smartphone
    development community today, many of the major players in software—like `Microsoft`,
    `Apple`, and `Adobe`—use mostly `C++` to build their powerful program suites,
    while e-merchants like `Amazon` use it for their large-scale business operations.
    The entire video game industry also relies on `C++`, because it has a massive
    library, allows for complete control, and compiles directly to assembly language
    (unlike `Java`, which uses the `JVM` as a go-between). Meanwhile, embedded systems—computer
    systems that serve specific purposes inside larger mechanical or electronic systems,
    like hybrid cars or traffic lights—often use `C`, because its graceful syntax
    makes its lines relatively short, and because it doesn’t use too much memory.


    ![](images/main-40.jpg)


    Opposite: Java lets us share our great ideas, through texts and emails .. But
    some great ideas might be better expressed in `Java` itself.

