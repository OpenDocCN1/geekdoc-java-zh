    《侏罗纪公园》、《盗宝奇险记》、《终结者》、《外星人入侵》以及《加勒比海盗》只是三百多部依赖 IL&M 进行特效的电影中的几部，该公司因此获得了十七项奥斯卡奖并获得二十三次提名。虽然
    IL&M 的程序员使用许多语言和工具，但 `Java` 是他们成功的重要组成部分。今天，他们招聘的许多初级职位都将掌握 `Java` 或另一种主流语言（如
    `C` 或 `C++`）作为任职要求。


    展望未来四十年的创新，IL&M 还建立了一个用于沉浸式和交互式娱乐体验的实验室。如果你想成为好莱坞 CGI 或下一代娱乐行业的一员，你必须掌握远超编写良好的
    `Java` 代码的技能——但 `Java` 可能是你明智的起点。


    `Java` 程序员最常见的去处实际上位于计算机行业之外，即所谓的“大企业”。今天，绝大多数富盛 500 强公司——美国最大的公司，也是全球最大的公司之一——使用
    `Java` 来满足其内部编程需求。所有这些公司都为 `Java` 开发者提供高薪工作。在这里，`Java` 开发者的角色是创建企业级应用程序。这些软件工具与你在手机应用中看到的或安装在家里电脑上的程序不同。企业级应用是巨大且复杂的系统，对于大型公司的运行至关重要。它们可以处理账单和工资、安全、内容管理、公司内部安全通信、人力资源、数据存储和访问，以及从制造到客户服务的各项自动化。`Java`
    是这类重体力活的理想选择，因为它自带了深层且丰富的库，这些库包含了大多数标准需求的解决方案。与初创公司不同，富盛 500 强公司通常改变结构模式的速度缓慢，因此它们在短期内不会切换到
    `Swift`；这些 `Java` 工作将一直存在很长时间。


    如果你热爱科学，可以将此与你对 `Java` 的热情相结合，为像 NASA（美国国家航空航天局）这样的机构工作。我们已经讨论过 World Wind，但 NASA
    几乎在其所有的软件中使用了 `Java` 语言，包括卫星的载载软件、最新的火星探测器车软件，以及科学家在地球上使用的分析程序。（不过，如果你打算走这条路，可能应该也学习
    `Python` 和 `C`。）


    目前，`Java` 最蓬勃的领域是移动应用开发，随着 `Android` 设备的持续成功，这种需求在短期内不会停止。你可以为大型应用开发公司工作——比如制作《精灵宝梦
    Go》的 Niantic；制作热门游戏《糖果大破译》的 King；或者开发热门通话和即时消息应用 Viber 的开发者 Rakuten（乐天）。但在应用开发领域，你不必非要瞄准巨头公司。许多流行且成功的应用源自初创公司，甚至是一些想在智能手机市场测试自己编程技能的小朋友。如果你用你的
    `Java` 技能设计并发布了一个成功的 `Android` 应用，这可能会带给你进入上述许多大公司的机会。


    ![](img/main-47.jpg)


    跨平台通信曾意味着计算机到计算机。今天，光你家里就有几十台设备连接在起。


    ## Java 的未来


    `Java` 的未来看起来一片光明。`Java` 成了 Google `Android` 的基础，它是世界上最流行的操作系统之一。这意味着将会有数十万 `Java`
    应用开发者，以满足 20 亿智能手机用户对新工具、设计和功能的渴望。同样，每年流经全球最大公司的万亿美元资金也部分取决于对 `Java` 及其企业级应用的强大支持。`Java`
    仍然易于学习，初接触这种语言的人可以在由数百万名渴望分享想法和经验的 `Java` 程序员组成的在线用户社区中获得支持，参加专门针对 `Java` 的年度会议，并使用他人已经编写的大量有用
    `Java` 代码“库”。


    正如 Gosling 指出的，`Java` 的长期成功建立在它共享访问和跨平台通信的基础原则之上。今天，`Java` 的持续流行归功于一个跨越平台、公司、行业、国家和其他（人类）语言的庞大用户群。


    正如你之前学到的，不同的编程语言有其优缺点，大多数语言最终执行不同的任务。`C` 语言驱动着让你停车的红绿灯。当你坐在后座时，`Java` 驱动着 Android
    手机上的应用，而你旁边的朋友或兄弟正在使用 `Objective-C` 在 iPhone 上发短信。你在到达之前决定在家附近的披萨店订餐，于是你打开了 Google
    搜索（它使用了 `C++` 和 `Python`），并找到了披萨店的网站（它使用了 `HTML` 和 `CSS`）。你点击了一个用 `JavaScript`
    构建的通话按钮，电话开始响起来了。


    ![](img/main-48.jpg)


    学习如何在任何编程语言中说“你好”——你可以从 `Java` 开始。


    很快，新语言将织入你的日常生活，随着越来越多的设备和技术——如汽车、手表、机器人吸尘器——连接到以及彼此。尽管编程语言变得如此专业，但有一个功能是每一个编程语言都做过且做了很多次的。它被称为“Hello,
    world!”。如果你对任何程序员说这两个词，她就会明白你的意思。为了演示新语言长什么样，或者向新学习者教授基础语法，程序员通常会写一个“Hello, world!”应用。如果你打算学习
    `Java` 编程，“Hello, world!”应用将是你构建的第一个之一，在你学习更令人印象、更复杂的事情之前。


    所以，`Java` 程序员：现在你已经了解了这种对地球最重要的语言之一，轮到你来说“Hello, world!”了。用 `Java` 来说，用一种新的方式来说，一种只有你才能说出的方式。通过这两个词，你可能会改变你正在问候的世界。


    ![](img/image_006_.jpg)


    **API** 允许不同软件程序交互的指令集；“API”代表“应用程序编程接口” .


    **applet** 执行简单任务的程序 .


    **application** 执行任何任务程序，通常比 applet 大、更复杂 .


    **assembly language** 汇编语言比机器语言高一级。它不是使用 1 和 0，汇编语言使用类似“add”和“pay”等助记代码给出命令 .


    **behavior** 在面向对象的计算机编程 (OOP) 中，对象上发生的事情或对象可以做的事情 .


    **binary code** 一种使用 1 和 0 的组合向计算机表示任何数字、字母或其他符号的编码语言 .


    **bytecode** 在 Java 中，一种允许 Java 虚拟机将任何程序员编写的 Java 代码翻译为可在任何操作系统运行的指令 .


    **class** Java 中创建对象的蓝图或模板。类识别了状态和行为 .


    **compiler** 一种将另一个程序的源代码转换为另一种编程语言的计算机程序 .

