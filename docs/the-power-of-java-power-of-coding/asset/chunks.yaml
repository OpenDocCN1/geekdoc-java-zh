    Their first idea was that computers would eventually play a bigger role in digital
    entertainment. The Green Team imagined people using handheld devices with animated
    touchscreens to control their TVs. They built a device called the `Star Seven`
    (`*7`) that did exactly this. They were right, but they were about twenty years
    ahead of their time. Today, you can program your TV to record shows from your
    phone, video game systems have taken over home entertainment, and streaming services
    like `Hulu` and `Netflix` give consumers more choice in how they use their televisions
    and their time. You don’t just flick through channels when you turn on a TV—you
    search for exactly what you want, you can look at trailers and previews, and you
    can even use your voice to deliver commands. Back in the early 1990s, cable companies
    weren’t too keen on giving up so much control to their consumers, and video-on-demand
    was just in its infancy. The `*7` didn’t take off, but the technology that made
    it possible did.


    The `*7` device used a new programming language. The lead Green Team developer,
    James Gosling, invented the language and named it `Oak`, after a tree outside
    his office window. But cable companies weren’t interested in their product. The
    team members needed to find another use for this new technology, and the language
    that powered it. To come up with an answer, they met at a ski resort, the `Inn
    at Squaw Creek`, near Lake Tahoe in California.


    By this point, developers were using the internet to store and share text, graphics,
    and even video. To do this, they used a language called `HTML`, hypertext markup
    language. This is the language behind most of the web pages that you use. `HTML`
    lets programmers create pages displaying different kinds of text and graphics
    and also lets them place links to other web pages. `HTML` can transfer information
    between different devices—so you can display and navigate web pages written in
    `HTML` whether you’re using a `Mac`, a `PC`, your phone, or another device. However,
    a user can’t do much to interact with a web page written only using `HTML`.


    ### "The Network Is the Computer"


    The Green Team, which switched its name to `FirstPerson`, got back to work, shifting
    focus from television to the internet. By 1993, the introduction of a web browser
    called `Mosaic` had started to bring more and more casual users to the web. The
    name `Mosaic` came from the art form of using many tiny pieces of glass, marble,
    or other colored materials to make a bigger picture. This captured the spirit—and
    one of the challenges—of the early web. Sharing information and commands among
    machines was difficult because the machines themselves were different: each type
    of machine “spoke” its own language, and there was not yet a language that would
    make it easy and efficient for different types of machines, or operating systems,
    to communicate. Anything that could bring all these different machines—and users—together,
    whether a web browser or a programming language, would work like a mosaic, using
    thousands and eventually billions of individuals to make up one massive, colorful
    whole: a network.


    The developers at `Sun Microsystems` started thinking about the internet in a
    new way. They realized that the internet was becoming a lot like what they’d hoped
    the cable companies would make, an interactive multimedia network. `Scott McNealy`,
    the co-founder, chair, and CEO of `Sun`, came up with a new slogan for the company:
    “The network is the computer.” It sounds a bit like a riddle, but it makes a lot
    of sense if you think about it. People tended to think of the first personal computers,
    or `PCs`, as labor-saving devices, the way you might think of your toaster, blender,
    or lawn mower. But “connecting” all the toasters in the world wouldn’t make them
    any more powerful. Perhaps you could arrange a million toasters to make toast
    at the same time. That would be cool, but not very practical. Computers, `McNealy`
    and others started to realize, were different.


    ### Sun Microsystems, Inc .


    In the late 1970s and early 1980s, more and more buzz was generating around advances
    in computer technology, and support from the federal government for computing
    research was at a high point. This was probably because the United States was
    in an arms-and-technology race with the Soviet Union—and winning. Military applications
    drove many advancements in computers at this time, but a dedicated group of computer
    enthusiasts—including researchers at major universities as well as garage-hobbyists,
    like Apple founders `Steve Wozniak` and `Steve Jobs`—started to imagine broader
    markets for computer hardware and software in commercial industries and for personal
    use. A few of these far-sighted inventors and investors banded together in 1982
    to form `Sun Microsystems, Inc .`, which would quickly rise to become one of the
    biggest computer companies in the world.


    German-born `Andy Bechtolsheim` was a graduate student at `Stanford University`
    working on a computer "workstation" for the `Stanford University Network`. He
    met earlier Stanford Business School graduates `Scott McNealy` and `Vinod Khosla`,
    who worked for `Daisy Systems` and `Onyx Systems`, respectively; both companies
    were driving advancements in microchip technology. These three soon to form a
    computer hardware and software company, taking the initials of their alma mater''s
    `Stanford University`. `Bill Joy`, a Berkeley graduate working on an operating
    system called `Unix` for `Bell Labs` (later `AT&T`), the dominant telephone company
    in North America for more than a century, joined them.


    In its first decade, `Sun` cashed in on Joy''s experience working on `Unix` by
    selling workstations (computers for scientific and technical needs) that used
    the `Unix` operating system. They later expanded into servers (hardware for storing
    data). `Sun''s` longest-lasting achievement, however, is probably the invention
    of the programming language and development platform `Java`, which brought `Sun`
    into new markets for smartphones and other electronics, and has greater name recognition
    than `Sun` itself.


    `Java` lives on, but `Sun''s` success couldn''t last. Early investment in `Sun`
    was based on the company''s quality and reasonably priced products, as well as
    on its developers'' record of remarkable innovation. That was fueled, however,
    by the "dot-com bubble." In the stock market, a "bubble" occurs when people begin
    trading stocks or goods in a price range far beyond their real value. "Bubbles"
    don''t deflate, or return to a stable state gradually; they burst when investor
    interest drops off suddenly, and companies built on inflated prices collapse.


    The dot-com bubble occurred between 1995 and 2001. Interest in the booming internet
    was so high, and so unreasonable, that companies could increase the value of their
    stock simply by adding "e" to the front of their name, or ". com" to the end.
    The bubble burst in January 2000. Companies merged or declared bankruptcy and
    disappeared; internet-based companies and technology manufacturers lost over $5
    trillion in market value, a free fall that the terrorist attacks of September
    11, 2001, only accelerated. Some of the companies that survived, like `Amazon`,
    `Google`, and `eBay`, were left to dominate fields suddenly cleared of competition.


