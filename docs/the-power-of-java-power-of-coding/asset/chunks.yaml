    这种“跨平台范式”在实际应用中的一个例子是虚拟网络计算，即 `VNC` 的发明。在 20 世纪 80 年代后期，大多数计算都是桌面端完成的。然而，计算的可能性（尤其是图形化的可能性）引发了科学家和商务人士对使用计算机在不同地点进行视觉演示的需求。今天，我们已经有了如
    `OneDrive`、`Dropbox` 和 `Google Drive` 等云存储服务，但在那时，计算机用户的限制大得多，数据共享并不是一件快速或方便的事。演示者在携带计算机文件旅行时的选择非常有限。他们可以将文件传输到磁盘盘，并希望它能在另一台计算机上运行，但如果他们需要在旅行途中继续进行某个项目，他们无法将整个计算环境（你在桌面硬盘上能找到的所有内容）存储在磁盘盘上，而且笔记本电脑又笨重、沉、昂贵且易碎。


    剑桥的研究人员想出了解决方案。这是 `Java` 第一批优秀的新应用之一，非常符合 `Java` 的范式。`Virtual Network Computing`
    允许一台计算机上的用户访问另一台计算机的显示器——遍布任何地方。这意味着旅行者可以使用酒店电脑（这些在 20 世纪 80 年后期和 90 年代更为常见），并使用任何支持
    `Java` 的网络浏览器登录 `VNC`。酒店电脑的屏幕将显示她家里或办公室电脑的屏幕。她可以在那里继续处理演示文稿。第二天，她可以使用另一台电脑访问同一台家里或办公室电脑，并向观众进行演示。`VNC`
    并不限于演示幻灯片或论文等简单任务：通过 `VNC`，你可以远程执行几乎任何你坐在自己电脑前会执行的任务。这使得它对于远程技术支持和管理非常有用。如果你的计算机出了问题，并且你设置了
    `VNC`，经验更丰富的用户可以从他自己的电脑修复你的问题。因为剑桥团队用 `Java` 编写了 `VNC`，所以它可以跨平台运行：`Mac` 用户可以远程访问
    `Windows` 桌面，以此此类推。而且 `VNC` 并不限于基于显示器的平台。从任何支持 `VNC` 的计算机上，你还可以访问消费电子产品，如可编程微波炉、灯光、娱乐系统和家庭安防设备。


    这种源于 `Java` 对访问和可移植性的承诺的发展，推动了软件、应用以及其他促进通信与协作技术的进一步进步。


    ## 一次编写，随处调试：跨平台的承诺与问题


    `Java` 对于真正的、无缝的跨平台开发的愿景无疑帮助了 20 世纪 90 年代互联网和计算的普及，但它并不总是能实现 `WORA` 的承诺。尽管 `Java`
    编译器确实允许开发者编写一个可以在任何带有 `JVM` 的平台上运行的程序，但不同平台运行程序的方式仍然存在细微差异。即使是编译器和 `JVM` 也无法考虑到所有的这些变化。程序在
    `Mac` 与 `PC` 上运行方式的细微差异通常并不要紧。然而，有时这些差异会导致问题，程序员称之为 `bugs`（错误）。在计算机编程中，`bug` 是指导致程序失败或以背离开发者意图的其他方式运行的错误。`Bugs`
    可能是无害的，可能是令人恼恼的，也可能是灾难性的——例如导致整个系统崩溃或破坏数据。


    ## Java 与 Objective-C：为 Android 和 iOS 开发应用


    o o o


    1998 年，电信公司 `Motorola`（摩托罗）签署了一项许可协议，在其手机设备中使用 `Java`。这是 `Java` 主宰智能手机行业的开端。当
    `Android`（占据约 80% 智能手机市场的首选操作系统）的开发者用 `Java` 编写其操作系统时，`Java` 的统治地位完全形成了。


    ![](img/main-37.jpg)


    智能手机制造商 `Apple` 和 `Android` 陷入了一场昂贵的法律战。其核心是 `Java` 编程语言。


    目前 `Android` 设备最大的竞争对手是 `iPhone`。`Apple` 的开发者创建了 `iPhone OS`，所有的 `iPhone` 应用都使用
    `Objective-C`，这是一种在旧 `C` 语言之上并与之兼容，但包含了面向对象语言 `Smalltalk` 元素的语言。


    `Objective-C` 和 `Java` 非常不同，但大多数 `Android` 或 `iPhone` 用户不知道也不在意。无论他们喜欢哪种品牌，所有智能手机用户都想要相同的工具和应用——除少数例外外，他们都能得到。`Apple`
    开发者必须复制 `Android` 的成就——反之亦然——而第三方开发者必须用两种语言构建他们的应用。


    如果你选取几乎任何在 `Android` 和 `Apple` 设备上都存在的应用——比如收集趋势新闻的 `Scanvine`，或使用内置麦克风识别用户附近音乐的
    `Shazam`——用户端的差异是可以忽略不计的。在大多数情况下，两者的效果都同样好。差异在于后端。


    在 2015 年的一项研究中，一家名为 `Infinum` 的应用开发公司研究了自己的应用，发现为 `Android`（使用 `Java`）编写代码需要多出
    38% 的代码行，耗时多出 28% 完成，因此比为 `iPhone`（使用 `Objective-C`）编写代码要贵得多。虽然时间和开销是一个缺点，但更长的代码实际上可以带来更好的性能，尽管调试和维护需要更长时间。


    由于 `Java` 程序在不同平台上的行为方式存在这些细微差异，`Java` 开发者发现自己只写了一次程序……然后在不同的平台上对它们进行了多次调试。这导致了人们对
    `Java` 承诺的一种调侃说法：在实践中，许多 `Java` 程序员觉得他们必须“一次编写，随处调试”。


    ## Java 语言和 JVM 的其他局限性


    直到 2013 年，一位《财富》杂志的作家还估计，“几乎每一个能想象到的电子设备都使用了某种程度的 `Java` 编程。”这是一好事。巨大的用户社区保持了一种计算机编程语言的健康并不断改进。但也意味着结构性缺陷可能会造成广泛的损害。


    ![](img/main-39.jpg)


    `Java` 的远程计算潜力对于旅行商务人士来说是一个福音。然而，一直存在 `JVM` 安全担忧。


    在同一年，美国国土安全部发现了当时所有版本的 `Java` 存在一个严重的安全漏洞。黑客似乎可以使用 `Java` 应用远程操控计算机——执行激活笔记本电脑摄像头等操作。当时控制
    `Java` 的 `Oracle` 迅速发布了修复安全问题的更新，但该问题引发的动荡对于任何语言（特别是 `Java`）的局限性是一个重要的提醒。


    如上所述，尽管 `Java` 被如此广泛使用，并且目前主导着智能手机开发社区，但软件领域的许多巨头——如 `Microsoft`、`Apple` 和 `Adobe`——主要使用
    `C++` 来构建他们强大的程序套件，而像 `Amazon` 这样的电子商务企业则用它进行大规模业务运营。整个视频游戏行业也依赖 `C++`，因为它拥有巨大的库，允许完全控制，并直接编译为汇编语言（不像
    `Java` 使用 `JVM` 作为中间件）。同时，嵌入式系统——在大型机械或电子系统内部为特定目的服务的计算机系统，如混合动力汽车或交通信号灯——通常使用
    `C`，因为它优雅的语法使其代码行相对较短，而且不会占用过多内存。


    ![](img/main-40.jpg)


    相反：Java 让我们通过文本和电子邮件分享我们伟大的点子……但某些伟大的点子用 `Java` 本身表达可能更好。


