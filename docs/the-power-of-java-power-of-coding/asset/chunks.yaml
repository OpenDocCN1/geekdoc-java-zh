    它构建在一种追溯到 20 世纪 70 年代的早期编程语言 `Pascal`之上。加州大学圣地亚分校的研究人员发现，他们和学生需要一种通用的编程语言，用于校园内不同的微型计算机，因此他们发明了
    `Pascal` 语言以及运行其上的 `P-system`。尽管 IBM 公司支持 `Pascal`，但 `P-system` 价格昂贵，评审人员对结果并不感满意。然而，它是使用虚拟机的早期尝试之一。詹姆斯·戈斯林（James
    Gosling）在卡内基梅隆大学读研究生期间接触过 `Pascal`，这段经历影响了他多年后开发 `Java` 的方向。


    “编写一次，处运行”证明是一个很棒的口号。太阳公司的营销团队很快开始使用缩写 WORA。当然，问题在于要运行 `Java` 程序，操作系统需要配备 `Java
    Virtual Machine`。尽管 `Java` 的普及如此迅速，以至于安装 `JVM` 或 `Java` 解释器已成为大多数系统的行业标准。


    ## 压力下的优雅：使用 Java 进行扩展


    `Java` 可以运行从可编程吐司器到超级计算机，再到“智能卡”（如非接触式信用卡和借记卡）的任何设备。特别是随着手机的兴，开发者使用 `Java` 创建了一夜火的应用。无论开发者使用何种语言编写这些应用，实用或创新的应用往往会因下载和使用量的激增而导致崩溃，导致服务器崩溃、暴露漏洞并减慢性能。这给可能犹豫是否下载该应用或切换到竞争对手的用户留下了不良印象。尽管性能取决于程序员的水平，但
    `Java` 是一门对于设计能够优雅扩展（或“增长”）的应用程序和软件而言、特别有用的语言。


    可扩展性是衡量计算机、服务器或软件程序在许多用户同时执行多项任务的巨大压力下性能的一种方式——因此，可扩展性对于那个可编程吐司器并不重要，但对于应用程序和视频游戏非常重要。对于
    `Java` 而言，如果一个程序在使用量不断增加的情况下能够继续快速运行且不崩溃，那么它就是高度可扩展的。阈值越高（即程序用户过多并开始变慢、冻结或崩溃的点），可扩展性就越大。


    ## NASA 的 World Wind：互操作性研究


    o o o


    NASA 的 World Wind 是一个虚拟地球，类似于 Google 地图，但它是可定制的，并加载了来自 NASA 卫星以及地球和太空其他设备的海量数据。


    通过 World Wind，用户可以实时探索地球——甚至是火星、金星、木星和几颗卫星，看着阳光退去，城市在夜晚变亮。山脉和其他地形特征以 3D 形式显示，通过插件，你甚至可以叠加链接到维基百科文章的标记，指向中国长城或马里亚纳海沟等内容。


    这些插件使用了多种编程语言，如 `C#`、`J#` 和 `VB`。起初，World Wind 仅适用于微软操作系统，但 NASA 科学家们希望通过网络将其带给每个人，这意味着它必须通过浏览器的
    `HTML` 运行并在任何操作系统上工作。将这样一个强大的程序带给绝对任何用户——即使是智能手机和平板电脑用户——对于互操作性来说都是巨大的挑战，因此 NASA
    程序员使用了 `Java` 来实现这一目标。


    2017 年发布的 World Wind `Java` 使整个 World Wind 程序变成一个 `Java applet`，能够通过 `HTML` 运行在任何操作系统的网页上，同时仍然包含了其他语言编写的所有插件，并且仍然调用从使用无数其他编程语言构建的软件收集的数百个
    NASA 项目的数据。


    扩展有两种方式。程序可以“扩展”（scale up），通过轻松向单台计算机添加更多内存；程序也可以“向外扩展”（scale out），通过轻松地与其他计算机和网络连接。由于
    `Java` 内置的垃圾回收机制，它可以有效地管理内存。这意味着 `Java` 程序可以在不需要增加更多内存的情况下显著向上扩展，而使用低效率语言编写的程序可能需要更多内存，且需求得早。同时，分支方法允许程序根据需要访问更多内存。由于
    `Java` 的可移植性，它也可以跨平台、轻松地进行向外扩展。由于 `Java` 卓越的可扩展性，Twitter 的开发者一直在将他们的代码从 `Ruby`
    语言迁移到 `Java`。


    ## 跨平台范式的可能性


    `Java` 的成功很大不仅是因为它的技术特性和能力，还是因为创造和维持这些特性的心态和文化。你可能称之为“Java 范式”。范式是一种看待世界的方式。它包含了对运作方式的基本假设，包括从重力和运动定律到对人类行为方式的预期的一切。范式还包含不具体的内容，如态度。存在个人范式，以及引导业务或身份群体行为的范式。有时，新技术或世界事件如此重大，以至于改变了这些基本假设和态度。我们称之为范式转移。


    历史学家对于这些范式转移是否真的是响应单一事件而发生，还是这些事件本身就是更广泛、更丰富的渐变变化织锦的一部分存在争议，在这种情况下，个人的选择没有引导这些选择的文化和经济力量重要。例如，你可以说互联网导致了全球范式转移：它改变了人类相互互动的方式。你也可以对手机说同样的话。或者，你可以说两者都是一个更长、更渐进的范式转移过程中的发展，描述了人类生活与机器的融合。


    `Java` 的发明也引发了范式转移——不仅是在计算机程序员的世界，而且对所有人类都是如此。`Java` 文化有它自己的范式。可以说，它是建立在詹姆斯·戈斯林看待世界的方式之上。或者，如果你更倾向于观察历史趋势，你可以说在
    във创建 `Java` 之前，互联网的可能性就已经塑造了戈斯林的个人范式。无论如何，从很小开始，戈斯林就开始关注早期互联网障碍之间的翻译和通信。即使在 20
    世纪 60 年代和 70 年代的青少年时期，他也参与过一些试图弥合平台、系统和语言之间差距的计算机项目。

