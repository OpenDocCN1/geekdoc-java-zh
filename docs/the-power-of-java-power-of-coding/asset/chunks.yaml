- fmt: '

    C was a great leap forward, and it remains one of the most popular languages developers
    use today. But it has many downsides, and this frustrated the developers pushing
    at the frontiers of what computers could do. C’s shortcomings included the following:


    - **Function Orientation**: Instead of working around objects that a developer
    could isolate and produce easily from the “blueprint” of a class, C was built
    around functions, or individual commands that lack blueprints and are harder to
    work on in isolation.

    - **Poor Portability**: Though Ritchie designed C to work across different platforms,
    this was easier imagined than done. A skilled programmer would have to take on
    the time-consuming job of recompiling (and sometimes rewriting) code for each
    new platform.

    - **Inefficient Use of Memory**: C had no built-in way of making a program automatically
    manage memory. This meant complicated programs could slow down.


    In short, then, C was an advancement, but as programmers found they had more complicated
    projects and bigger dreams, C seemed too slow, too inefficient, too time-consuming
    to write, and not adaptive enough. This doesn’t mean that C is useless—engineers
    still prefer C for embedded systems, computers inside things like stop lights
    and thermostats—but new uses for computers called for new languages.


    Bjarne Stoustrup, an engineer, fixed the “object” problem in 1983 by introducing
    C++. This offered a sleeker, more efficient, and easier-to-use version of C, by
    making the language object-oriented.


    ### The Object-Oriented Approach


    As you’ve already learned, object-oriented programming began as a way to tackle
    more complex projects more easily. It does this in two ways. First, it “packages”
    data and the operations on data (things that a program “does” to data) into objects.
    It then arranges these objects into classes based on what’s in them and what they
    do. Finally, it hides most of these details from public users.


    Imagine that you’re building a house. You have the plot of land picked and the
    four corners marked with stakes. But all the stuff that you’ll need to build the
    house—bricks, boards, nails, shingles, pipes, wires, cement blocks, and window
    panes—is just sitting in a pile next to your building site. And mixed in with
    these basics, you also have rolls of wallpaper, bits of wood and stuffing for
    furniture, kitchen appliances, clothes, picture frames, lightbulbs, cookie jars,
    and paintings.


    If you tried to dive right in and start building the house, you’d be frustrated
    pretty quickly. This is how computer programmers were feeling. Earlier programmers
    had been doing simpler things—the way building a chair is simpler than building
    a house. If you’re just building a chair, you can look at your pile of materials,
    ignore the cookie jar and everything else you don’t need and build the chair without
    too much work. But if you’re building a house, you might have the bright idea
    to organize your materials first. You could put all your bricks in one pile and
    all your shingles in another. You could place all the materials you would need
    to make the frame of the house near each other, and you could put all your plumbing
    materials somewhere else. This is the same impulse that led to object-oriented
    programming: organization.


    ### C++ and Java: an Object-Oriented Comparison


    The first object-oriented language was Simula, released in 1967. Stoustrup used
    the object-oriented approach to improve C with C++ in 1983, but even C++ had its
    shortcomings. Linus Torvalds, the developer of the Linux operating system, calls
    C++ a “horrible” language (maybe a little unfairly). Today, most Windows and Adobe
    programs (like Word and Photoshop) are written in C++, as are most video games
    for systems like Xbox and PlayStation. However, while C++ may be easy to learn,
    its complexity makes it difficult to master. It’s a “wordy,” or dense language.
    Code in C++ tends to be longer than comparable code in Java, and even the error
    messages can be long and confusing. It also compiles slowly, and it doesn’t use
    memory efficiently.


    James Gosling and his team designed Java to fix a lot of these problems. Java
    code is shorter and sleeker; it compiles quickly; and it introduced something
    called garbage collection, a memory-management tool that reclaims memory from
    objects or functions that the program isn’t using anymore. It’s hard to deny that
    Java is the most widely used and one of the most successful object-oriented languages.


    ### Language Barriers and Interoperability


    Imagine that you, an English speaker, were to meet someone who spoke only Russian.
    Even though English and Russian share some basic structures, you probably wouldn’t
    get very far with one speaking in English and the other responding in Russian.
    Programming languages work the same way. Java, C++, Python, and other languages
    can’t “speak” directly to each other. At least, they can’t speak to each other
    without some kind of bridge. However, the demands of computing today mean languages
    have to work together all the time. This is called interoperability: the ability
    of programming languages to interact and operate on the same data.


    Some languages, like Groovy, Clojure, and Scala, were built to run on the Java
    Virtual Machine and can interact with anything in a Java library (a collection
    of objects or other data structures). Whole new languages sometimes result from
    attempts to map existing languages onto each other—as is the case with Jython,
    an attempt to port the language Python for the Java Virtual Machine. Any web page
    you visit will involve even more languages, usually some combination of HTML (the
    first language Tim Berners-Lee created to write web pages) and JavaScript (a language
    for making web pages interactive, not possible with HTML alone). More complicated
    web pages might use plug-ins, or applets that make sites do more “stuff.” Pop-up
    advertisements, embedded videos, comment boxes, and search functions are all plug-ins.
    Pop-ins allow developers to write applications in languages like Java or PHP and
    run them on web pages written in HTML and JavaScript.


    ![](images/main-35.jpg)


    Tim Berners-Lee invented the internet so that average citizens could share information
    and ideas


    All these examples of interoperability work because the languages we use to program
    can all compile to simpler codes, which can then translate to machine language.
    Imagine that your new Russian friend has come to help you build your house. You
    have neatly arranged your materials into piles, but you call a hammer a hammer,
    and your Russian friend calls it a molot. When you want something, you say, “Hand
    me...” and your Russian friend says, “Day mne...” You might think of what needs
    to be done in English, but you’d have to translate these commands into something
    simpler, like hand gestures. Your Russian friend would interpret the gestures
    into her own language—Russian—before carrying the action (through the “machine
    language” of messages between the brain and the body parts). Programming languages
    interact like this—though much more efficiently!


    ### Write Once, Run Anywhere


    In chapter 2 you learned more about the Java compiler and the promise of portability.
    Java developers were supposed to be able to write programs once, on one platform,
    and run them anywhere. A developer could write a source code for a program, then
    compile it into Java bytecode. Any operating system equipped with the Java Virtual
    Machine could then open and run that file in a language that the platform (whether
    a Windows or an Apple computer, an iPad, or a Google Pixel smartphone) could “understand.”

    '
