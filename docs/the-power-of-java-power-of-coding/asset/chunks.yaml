    **application** Anything that performs a task, generally larger or more complex
    than an applet .


    **assembly language** An assembly language is one step above machine language
    . Instead of 1s and 0s, assembly languages give commands using mnemonic codes
    like "add" and "pay " .


    **behavior** In object-oriented computer programming (OOP), things that can happen
