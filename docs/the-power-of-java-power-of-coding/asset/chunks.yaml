    他们的第一个想法是，计算机最终将在数字娱乐中发挥更大的作用。“绿队”（The Green Team）想象人们使用带有动画触摸屏的手持设备来控制电视。他们制造了一了一种名为
    `Star Seven`（`*7`）的设备，恰好就能做到这一点。他们是对的，但比时代领先了二十年。今天，你可以通过手机为电视录制节目，视频游戏系统接管了家庭娱乐，而
    `Hulu` 和 `Netflix` 等流媒体服务为消费者使用电视和时间的方式提供了更多选择。当你打开电视时，不再只是简单地切换频道——你可以搜索确切想要的内容，可以查看预告片和预览，甚至可以使用语音下命令。回到
    20 世纪 90 年代初，电缆公司并不愿意向消费者交出控制权，而且视频点播还处于婴儿芽阶段。`*7` 并没有成功，但实现它的技术却成功了。


    `*7` 设备使用了一种新的编程语言。绿队的首席开发者詹姆斯·高林（James Gosling）发明了这种语言并将其命名为 `Oak`，取自他办公室窗外的一棵树。但电缆公司对他们的产品并不感兴趣。团队成员需要为这项新技术以及驱动它的语言寻找另一个用途。为了找到答案，他们在加利福尼亚州太浩湖附近的
    `Inn at Squaw Creek` 滑雪度假村会面。


    到此时，开发者们已经在使用互联网来存储和共享文本、图形甚至视频。为了实现这一点，他们使用了一种名为 `HTML` 的语言，即超文本标记语言。这是你使用的大多数网页背后的语言。`HTML`
    让程序员能够创建显示各种类型文本和图形的页面，并让他们放置指向其他网页的链接。`HTML` 可以在不同设备之间传输信息——因此无论你使用的是 `Mac`、`PC`、手机或其他设备，都可以显示和浏览用
    `HTML` 编写的网页。然而，用户无法对仅使用 `HTML` 编写的网页进行太多交互操作。


    ### “网络就是计算机”


    绿队将名称更名为 `FirstPerson`，并回到工作中，将重心从电视转向互联网。到 1993 年，一种名为 `Mosaic` 的网络浏览器的推出开始带来越来越多的普通用户进入网络。`Mosaic`
    这个名字源于一种艺术形式，即使用许多微小的玻璃、大理石或其他彩色材料组成一幅更大的画。这捕捉了早期互联网的精神——也是它的挑战之一。在机器之间共享信息和命令是困难的，因为机器本身是不同的：每种类型的机器都“说”自己的语言，还没有一种语言能让不同类型的机器或操作系统进行方便且高效的通信。任何可以将所有这些不同的机器（以及用户）聚集在一起的东西，无论是网络浏览器还是编程语言，都会像马赛克一样，利用成千上万最终是数十亿个个体组成一个巨大的、色彩斑的整体：网络。


    `Sun Microsystems` 的开发者开始以全新的方式思考互联网。他们意识到，互联网正越来越像他们希望电缆公司制造的那样——一个交互式多媒体网络。`Sun`
    的创始人、董事长兼首席执行官斯科特·麦克尼利（Scott McNealy）为公司想了一个新口号：“网络就是计算机。”这听起来有点像谜语，但如果你仔细考虑，它很有道理。人们倾向于将第一代个人电脑（`PCs`）视为省力设备，就像你考虑你的烤面包机、搅拌机或割草机一样。但“连接”世界上所有的烤面包机并不会让它们变得更强大。也许你可以安排数百万台烤面包机同时烤面包。那很酷，但并不实用。`麦克尼利`和其他人开始意识到，计算机是不一样的。


    ### Sun Microsystems, Inc .


    20 世纪 70 年代后期和 80 年代初，围绕计算机技术进步的讨论声日益高涨，联邦政府对计算研究的支持处于高点。这可能可能是因为美国当时正在与苏联进行一场军备和技术竞赛——而且正处于领先地位。军事应用驱动了当时计算机的许多进步，但一个由计算机爱好者组成的群体——包括主要大学的研究人员以及车库级爱好者，如苹果公司的创始人史蒂夫·沃兹尼克（Steve
    Wozniak）和史蒂夫·乔布斯（Steve Jobs）——开始想象计算机硬件和软件在商业行业和个人用途中更广阔的市场。这些远见发明人和投资者中的几位在 1982
    年联合在一起成立 `Sun Microsystems, Inc .`，它迅速成为世界上最大的计算机公司之一。


    出生于德国的安迪·贝特尔斯海（Andy Bechtolsheim）是斯坦福大学的一名研究生，当时正在为“斯坦福大学网络”开发计算机“工作站”。他遇到了早先的斯坦福商学院毕业生斯科特·麦克尼利和维诺德·科斯拉（Vinod
    Khosla），他们两人分别在 `Daisy Systems` 和 `Onyx Systems` 工作；这两家公司都在推动芯片技术的进步。这三个人很快成立了一家计算机硬件和软件公司，并以他们母校斯坦福大学（Stanford
    University）的缩字母命名。伯克利毕业生比尔·乔（Bill Joy）加入了他们，他当时正在贝尔实验室（Bell Labs，后来的 `AT&T`，一个多世纪以来北美占据主导地位的电信公司）开发一种名为
    `Unix` 的操作系统。


    在成立的第一个十年里，`Sun` 利用比尔在开发 `Unix` 方面的经验，通过销售使用 `Unix` 操作系统的的工作站（满足科学和技术需求的计算机）获了利。后来，他们扩展到了服务器（存储数据的硬件）。然而，`Sun`
    最长远的成就可能是发明编程语言和开发平台 `Java`，它让 `Sun` 进入了智能手机和其他电子产品市场，并且其知名度超过了 `Sun` 本身。


    `Java` 延续了下来，但 `Sun` 的成功无法持续。对 `Sun` 的早期投资是基于公司的质量和价格合理的产品，以及开发者卓越的创新记录。然而，这在当时是由“互联网泡沫”驱动的。在股市中，“泡沫”是指人们开始以远超其实价值的价格范围交易股票或商品时。“泡沫”不会逐渐萎缩或恢复稳定状态；它们会在投资者兴趣突然下降时破裂，建立在通胀价格之上的公司会随之崩溃。


    互联网泡沫发生在 1995 年到 2001 年之间。人们对蓬勃发展的互联网如此痴迷且如此不理性，以至于公司只需在名称前面加上“e”或在末尾加上“. com”就能增加股票价值。泡沫在
    2000 年 1 月破裂。公司合并或宣布破产并消失；互联网公司和技术制造商损失了超过 5 万亿美元的市值，这种自由落体在 2001 年 9 月 11 日恐怖袭击后进一步加速。幸存的一些公司，如
    `Amazon`、`Google` 和 `eBay`，被留下来统治突然清空的竞争领域。


