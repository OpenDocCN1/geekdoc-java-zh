    C 语言是一个巨大的飞跃，它至今仍然是开发者使用的最受欢迎的语言之一。但它也有许多缺点，这让那些在计算机能力前沿探索的开发者感到沮丧。C 语言的缺陷包括：


    - **函数导向**：C 并不是围绕开发者可以隔离并从类“蓝图”中轻松生成的对象来构建，而是围绕函数（或单个命令）构建的，这些命令缺乏蓝图，且更难进行独立处理。

    - **可移植性差**：尽管 Ritchie 设计 C 语言可以在不同平台上运行，但这比想象起来容易，实现起来困难。熟练的程序员必须为每个新平台承担重新编译（有时甚至是重写）代码的耗时工作。

    - **内存使用效率低下**：C 没有内置的方法来让程序自动管理内存。这意味着复杂的程序可能会运行缓慢。


    简而言之，C 是一项进步，但随着程序员们发现自己有更复杂的项目和更大的梦想，C 语言似乎变得太慢、效率太低、编写太耗时，而且适应性不足。这并不意味着 C 毫无用处——工程师仍然倾向于使用
    C 用于嵌入式系统，如红绿灯和恒温器内部的计算机——但计算机的新用途需要新的语言。


    工程师 Bjarne Stoustrup 在 1983 年通过引入 C++ 解决了“对象”问题。通过让这种语言面向对象，C++ 提供了一个更精简、更高效且更易使用的
    C 语言版本。


    ### 面向对象的方法


    正如你已经学到的，面向对象的编程最初是作为一种更容易处理更复杂项目的方法。它通过两种方式实现这一点：首先，它将数据和对数据的操作（程序对数据“执行”的操作）“封装”成对象。然后，它根据它们的内容和功能将这些对象组织成类。最后，它向公共用户隐藏了这些大部分细节。


    想象你正在盖一栋房子。你已经选好了地，并在四个角插上了桩子。但你盖房子所需的所有材料——砖块、木板、钉子、瓦片、管道、电线、水泥块和窗玻璃——就堆在建筑工地的旁边。在这些基础物品中，还混杂着卷卷壁纸、碎木头、家具填充物、厨房电器、衣服、相框、灯泡、饼干罐和画作。


    如果你尝试直接上手开始盖房子，你很快就会感到沮丧。计算机程序员们的感觉当时是这样。早期的程序员做的是更简单的事情——就像造一把椅子比盖房子简单得多。如果你只是在造椅子，你可以看一眼你的材料堆，忽略饼干罐和所有你不需要的东西，而不需要费太大精力就能造好椅子。但如果你在盖房子，你可能会产生一个绝妙的主意，先组织你的材料。你可以把所有的砖块放在一堆，把所有的瓦片放在另一堆。你可以把制作房屋框架所需的所有材料放在一起，而把所有水路材料放在另一个地方。这就是导致面向对象编程的相同冲动：组织。


    ### C++ 和 Java：面向对象的比较


    第一种面向对象的语言是 Simula，发布于 1967 年。Stoustrup 在 1983 年使用面向对象的方法通过 C++ 改进了 C 语言，但即使是
    C++ 也有其缺点。Linux 操作系统的开发者 Linus Torvalds 称 C++ 为是一门“极其糟糕”的语言（可能有点不公平）。今天，大多数 Windows
    和 Adobe 程序（如 Word 和 Photoshop）是用 C++ 编写的，Xbox 和 PlayStation 等系统的大多数视频游戏也是如此。然而，虽然
    C++ 可能很容易学习，但它的复杂性使其难以精通。它是一门“冗长”的或密集的语言。C++ 代码通常比 Java 的同类代码长，甚至错误信息也可能很长且令人困惑。它的编译速度慢，而且内存使用并不高效。


    James Gosling 和他的团队设计 Java 是为了解决许多此类问题。Java 代码更短、更精简；编译速度快；而且它引入了被称为垃圾回收的机制，这是一种内存管理工具，可以从程序不再使用的对象或函数中回收内存。很难否认，Java
    是使用最广泛且最成功的面向对象语言之一。


    ### 语言障碍与互操作性


    想象你，一个英语母语者，会到了一个只会说俄语的人。尽管英语和俄语共享一些基本结构，但如果一个人说英语，另一个人用俄语回答，你们可能无法不多久。编程语言也是一样。Java、C++、Python
    和其他语言无法直接互相“对话”。至少，它们在没有某种桥梁的情况下无法进行交谈。然而，当今计算的需求意味着语言必须一直协同工作。这被称为互操作性：编程语言相互作用并处理同一份数据的能力。


    某些语言（如 Groovy、Clojure 和 Scala）是为了在 Java 虚拟机上运行而构建的，可以与 Java 库中的任何内容（对象或其他数据结构的集合）交互。全新的语言有时是由于尝试将现有语言映射到彼此而产生的——例如
    Jython，它就是一种将 Python 语言移植到 Java 虚拟机的尝试。你访问的任何网页都可能涉及更多语言，通常是 HTML（Tim Berners-Lee
    为编写网页创建的第一种语言）和 JavaScript（一种用于让网页具有交互性的语言，仅靠 HTML 是无法实现的）。更复杂的网页可能会使用插件或小程序（applets），让网站实现更多“功能”。弹出式广告、嵌入视频、评论框和搜索功能都是插件。插件允许开发者使用
    Java 或 PHP 等语言编写应用程序，并在使用 HTML 和 JavaScript 编写的网页上运行。


    ![](img/main-35.jpg)


    Tim Berners-Lee 发明了互联网，以便普通公民共享信息和想法


    ### 写一次，到处运行


    在第 2 章中，你学习了更多关于 Java 编译器和可移植性承诺的内容。Java 开发者本应能够在在一个平台上编写一次程序，然后在任何地方运行。开发者可以为程序编写源代码，然后将其编译成
    Java 字节码。任何配备 Java 虚拟机的操作系统都可以用平台（无论是 Windows 还是 Apple 、iPad 还是 Google Pixel 智能手机）可以“理解”的语言打开并运行该文件。

