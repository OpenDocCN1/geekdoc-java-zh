    Pokemon Go 曾是一种现象，但它并不是一场革命。一些玩家离开了并转向了新游戏。虽然它在今天仍然具有一定人气，但不再占据新闻头条。事实上，Pokemon
    Go 引起的所有轰动——十亿美元的收入、数亿次的下载以及数十万次的事故——都是将跨多个计算机平台的许多不同技术整合在一起的结果。


    为了实现这一点，游戏设计者采用了旧技术并以新的方式使用它们。一个重要的工具是 GPS。GPS，即“全球定位系统”，利用卫星来追踪地球上设备的移动。这并不是一项新技术——大多数手机已经设计成可以通过这种方式进行追踪。游戏还依赖手机的内置摄像头。这也是老技术了：在人们开始使用
    Snapchat 和 Instagram 等应用十多年前，制造商就为翻手机引入了摄像头。（冷知识：“selfie”一词最早于 2002 年出现在澳大利亚的一个在线论坛，但花了整整十年才在各地流行。牛津英语词典在
    2013 年将“selfie”评为年度单词，韦尔-韦斯特字典在次年将该词加入了词典。）但 Pokemon Go 的制作者将这些较旧的技术——GPS、内置摄像头以及其他技术——整合在了一起。正因如此，他们能够将
    Pokemon 系列中可收集的角色放入“现实世界”中。为了将所有系统整合在一起，开发者必须使用一种可以与所有其他技术通信的“语言”：GPS、摄像头、触摸屏、手机操作系统以及游戏服务器。不仅是
    `Java` 语言让这一切成为可能，而且这种迥然不同的计算系统可以并且应该无缝协作的信念，也源于一场思维革命，而 `Java` 在这场革命中起着关键性作用。


    ## 现代计算：网页与互联网的简史


    这个故事可以追溯到 1991 年。那是充满平静转折点的一年。冷战结束，苏联分裂为十五个独立的国家。美国通过“沙漠风暴行动”开始在中东持续的军事干预。热门视频游戏角色索尼登场，超级任天堂娱乐系统（即
    `SNES`）也问，两个德国游客发现了一具有三千年历史的木乃并将其命名为 Otzi。随后，在 8 月 6 日，英国科学家蒂姆·伯纳斯-李向公众发布了网页万维网，我们所知的生活发生了根本性的变化。


    ![](img/main-8.jpg)


    今天的电脑比几十年前的要纤薄得多，比如这台 20 世纪 90 年代的 IBM 笔记本电脑。


    虽然我们有时交替使用这两个词，但互联网和网页是两个不同的东西。互联网指的是一个连接全球的计算机系统——自动执行算术或逻辑任务的机器。这个系统始于 20 世纪
    60 年代美国政府的研究。科学家们和军事人员几个世纪以来一直在使用现代计算机的前身，但这些机器变得越来越复杂。据加利福尼亚州的研究人员希望有一种方法可以访问威斯康星州（或其他任何地方）的数据。美国国防部制定了规则，允许不同的计算机使用无线电、电缆和光纤电进行通信，交换数据和命令。到
    20 世纪 80 年代，军事和学术界已广泛使用这种有限的互联网。


    1991 年 1 月，在瑞士欧洲核子研究中心（CERN）工作的英国科学家蒂姆·伯纳斯-李引入了网页万维网，这是一个利用互联网来识别、组织和链接文本文档，最终链接图像、音频和视频的信息空间。起初，这仅供研究机构的科学家可以使用，但到那年的
    8 月，普通公众也可以了。今天，当你使用 `Safari`、`Internet Explorer`、`Firefox` 或 `Google Chrome`
    等浏览器时，你正在使用一个为了让你访问同一个网页而发明的工具。旨在帮助科学家共享数据的空间现在可以在 Facebook 上发布照片、购买演唱会门、浏览 Pinterest
    和 Amazon、在 SoundCloud 上传音乐以及制作表情包（memes）。


    ## 新边疆的新语言


    每一次新的进步和创新都推动程序员们为这些强大的新技术构想出越来越大胆的用途。然而，要让计算机“做”任何事情，你需要一种命令它们的方法——而要下命令，你需要一种语言来传递该命令。我们称之为计算机编程。


    无论你只知道一种语言、两种还是几种语言，你可能都知道在不同情况下使用不同“语言”的感觉。你对老师用一种方式说话，在篮球场或棒球场上用一种方式，对父母用一种方式，对朋友或兄弟姐妹用另一种方式。计算机的工作方式也是一样：它们通过不同的语言“对话”来完成不同的任务。单台计算机运行在所谓的“机器语言”之上，它由二进制代码字符串组成。“二进制”仅指具有两个部分的东西；在计算机的情况下，二进制代码是由长串的
    1 和 0 组成的。正如你想象的，人类要使用二进制代码给计算机提供任何复杂的指令将非常困难（而且耗时！）。此外，不同的计算机读取二进制代码的方式不同。为了让编程更容易，并帮助计算机相互通信，计算机先驱创建了汇编语言，它引入了字母和可识别的单词。这允许程序员通过名称引用数据块，并传递简短、易于表达的命令，而不是连接一长串的二进制数字。


    程序员仍然在某些任务中使用汇编语言，但随着人类开始使用计算机绘制日益庞大的数据集，并执行更复杂的功能，研究人员意识到他们需要更复杂的语言。今天，有超过两千种计算机语言。你可能认出其中一些名字：一些比较流行的有
    `C`、`C++`、`PHP` 和 `JavaScript`。`Java` 是这些语言中最流行、最强大且影响力最大的语言之一。


    ## 绿色团队


    1991 年，在网页万维网向公众开放的同一年，名为 Sun Microsystems, Inc. 的公司的程序员开始着手最终成为 `Java` 的工作。太阳公司的高管们知道计算机文化即将发生变化，他们想领先于一步。他们挑选了一些最优秀的程序员并给了他们一个巨大的挑战：预测计算机的下一个大趋势，并构建东西来利用这些趋势。这
    13 名员工被称为“绿色团队”，他们在加利福尼亚州的梅尔洛公园设立办公室，远离太阳公司的主办公室。他们甚至中断了 18 个月与公司其他部分的常规通信，日夜以继地尝试预测未来。

