- fmt: '

    Another index similar to TIOBE, PyPL, measures interest in Google programming
    language tutorials. `Java` also leads here, taking 24 percent of search traffic.
    That means that beginner programmers (like you) are searching for `Java` more
    than any other language. It’s probably not a bad idea to join them; but if you’re
    concerned about standing out in the job market, you should consider learning a
    currently less popular language in which you expect to blossom.


    If you’re looking to pick up other relatively easy languages that could be valuable
    to your career, you have several options. `Ruby`, designed in the 1990s, is one
    of the easiest languages to learn. Often touted as fun, it’s not just for fun
    and games: `Ruby` powers major business and entertainment websites like Hulu and
    Airbnb.


    `JavaScript` and `PHP` are also both easy to learn, and valuable if you want to
    code for the web. `JavaScript` is useful for designing interactive elements on
    websites, the stuff users see, while `PHP` is useful for server-side functions
    that users don’t see.


    Finally, `Python` is a simple but useful language; its code can express concepts
    and instructions in fewer lines than `Java` or `C++`, and it can build just about
    anything. `Python` is most popular for research and scientific computing, but
    developers also used it to build parts of Pinterest and Instagram.


    Learning any of these languages would expand your potential to build computer
    programs. They would make you a more versatile and valuable job candidate, and
    you could use many of them hand-in-hand with `Java`.


    You should consider other “young” languages as well. Try to think about the languages
    that might be widely used in the coming years and consider picking these up now.
    Two languages like this are Google’s `Go` and Apple’s `Swift`, both rising on
    the TIOBE Index and polling well in StackOverflow’s measure of developer interest
    in new languages.


    ![](images/main-45.jpg)


    `Go`''s mascot is the `Go` gopher.


    Google’s `Go` is new, but it has deep roots, and its inventors are no newcomers.
    Ken Thompson and Rob Pike were already legends for their work at Bell Labs; together,
    they created the `Unix` operating system and each created several languages. They
    joined Google and a Google developer Robert Greisemer to create `Go`, released
    in 2007. These three designed `Go` in part to address dissatisfactions with `C++`.
    While it remains experimental even ten years after its launch, it’s an increasingly
    popular language for its “clean” readability. You’ve probably encountered `Go`
    without knowing it: it powers parts of Google, Dropbox, Netflix, SoundCloud, and
    Uber.


    Unlike the open-source and cross-platform `Go`, the language `Swift`, as an Apple
    invention, only works on Apple-affiliated operating systems. Released in 2014,
    it rose to the top ten on the TIOBE index by 2017. It is built on top of `Objective-C`
    and can run alongside `Objective-C`, `C`, and `C++` in one program. Apple hopes
    it will replace `Objective-C` (which should make you hesitate if you’re thinking
    about learning that language now). Lead developer Chris Lattner designed it to
    deal with or avoid common problems or bugs in other languages.


    `Swift` may be difficult to learn after learning `Java`, though, because, like
    `Java`, it represents a paradigm shift. This shift is away from object-oriented
    programming entirely; `Swift` replaces this with “protocol-oriented programming.”
    Protocols already exist in object-oriented programming: they state how unrelated
    objects will communicate. Instead of putting reproducible objects and their classes
    at the center of the programming paradigm, protocol-oriented programming puts
    protocols—what’s “done”—at the center. Without getting too far from our subject
    in this book (`Java`, remember?) it seems that `Swift` could change the programming
    world in the coming years. It’s safe to say, though, that protocol-oriented programming
    won’t replace object-oriented programming entirely. What we have in `Swift` is
    a new kind of thinking that meets new needs, but that doesn’t mean it meets “old”
    needs better than older languages. Market studies show that ancient `C` is the
    most commonly mentioned language in new job postings, but several different fields
    keep up a steady demand for `Java` programmers. `Java` will continue to meet other
    needs just as `C`, `C++`, and even older languages continue to have their important
    uses, too.


    ## Career Prospects for Java Developers


    If you’re looking for a career as a `Java` developer, you’ll probably start in
    Silicon Valley (a region of California south of San Francisco where tech giants
    and startups are clustered). Though many Sun developers left `Oracle` after the
    buyout, `Oracle` isn’t getting rid of `Java` any time soon: it’s still probably
    the company’s biggest asset, and one proof of their commitment to the language
    is in the continuation of their lawsuit against `Google`. In 2013 alone, `Oracle`
    posted more than 2,300 jobs. Many of those were for `Java`-based software and
    application developers. The other major tech companies like `Microsoft`, `Google`,
    `Dell`, `Cisco`, `Yahoo`, and `Sony` also hire `Java` developers. If you work
    for one of these major computer companies, you could be developing major software
    applications that millions of computer users operate. If you work for `Google`,
    you could contribute to `Android`, and if you work for `Oracle`, you could contribute
    to... In one of the world’s youngest industries, anything is possible.


    ### Lights, Camera, Magic


    The visual effects and computer graphics company Industrial Light & Magic has
    been a pioneer in Hollywood for more than forty years . Their story started long
    ago, and depending on whom you ask, either in the Van Nuys neighborhood of Los
    Angeles, California, or in a galaxy far, far away


    George Lucas''s `Star Wars` came out in 1977, cashing in on the American space
    obsession that had started May 25, 1961, when President John F. Kennedy announced
    that the nation would beat the Soviets in the race to put a human on the moon
    . Stanley Kubrick''s `2001: A Space Odyssey` became the definitive space film
    when Kubrick released it in 1968, just over one year before Kennedy''s promise
    true . Lucas may not have surpassed Kubrick''s artistic achievement with 2001,
    but `Star Wars` did achieve something that Kubrick couldn''t: it launched the
    great tragedies and romances of ancient Greek and Roman and medieval culture into
    space and has inspired each successive generation, becoming a triple trilogy and
    one of the world''s most-recognized franchises and most-beloved stories .


    Lucas''s ambitions were set high from the beginning . Inspired by Kubrick''s visually
    stunning work, Lucas wanted to make a film that looked like nothing anyone had
    seen before—on a screen or off. The first `Star Wars` film (later retitled `Star
    Wars` Episode IV: A New Hope`) didn''t use much that we could call computer-generated
    imagery (CGI) . Back then, "special effects" concerned mostly models, projection,
    cutting or overlaying the physical film, and work with filters and other methods
    of distorting camera lenses . (The few computer-generated visuals that did go
    into the first film were the work of programmers outside IL&M .) However, `IL&M`
    teamed up with a new group of hires (called the Computer Division of Lucasfilm,
    Lucas''s production company) on the sequel, `Episode V: The Empire Strikes Back`.
    After this film and a few other contemporaries, the inevitable coming together
    of Hollywood and the computer industry was clear. The Computer Division broke
    off to become Pixar, creating the first fully CGI film, `Toy Story`, in 1995.
    `IL&M` also shifted to embrace CGI and quickly became the world''s leader in that
    field .

