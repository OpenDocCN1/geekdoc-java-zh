    on IL&M for special effects, earning the company seventeen Oscar wins and twenty-three
    nominations . While the IL&M programmers use many languages and tools, `Java`
    was an important part of their successes . Today, many of the entry-level jobs
    they advertise state knowledge of `Java` or another major language (like `C` or
    `C++`) as a requirement .


    Looking ahead to the next forty years of innovation, IL&M has also set up a lab
    for immersive and interactive entertainment experiences . If you want to become
    a part of the Hollywood CGI or next-generation entertainment industries, you''ll
    have to pick up skills well beyond writing good `Java` code—but `Java` might be
    the smart place for you to start .


    One of the most common spots for `Java` programmers is actually outside the computer
    industry, in so-called big business. Today, the vast majority of Fortune 500 companies—the
    biggest companies in America, and some of the biggest in the world—use `Java`
    for their internal programming needs. All of those companies offer well-paid jobs
    to `Java` developers. The role of the `Java` developer here is in creating enterprise
    applications. These are software tools unlike those you find in mobile apps or
    installed on your home computer. Enterprise applications are massive, complicated
    systems critical to the functioning of large companies. These could handle billing
    and payroll, security, content management, secure communication within the corporation,
    human resources, data storage and access, and the automation of everything from
    manufacturing to customer service. `Java` is ideal for this kind of lifting, because
    it comes with deep, rich libraries that contain solutions for most of these standard
    needs. Fortune 500 corporations, unlike startups, are also generally slow to change
    their structural models, so they won’t be switching over to `Swift` anytime soon;
    these `Java` jobs will be around for a long time.


    If you have a love of science, you could combine this with your passion for `Java`
    and work for an organization like NASA. We’ve already discussed World Wind, but
    NASA has used the `Java` language for almost all of their software, including
    onboard software for satellites and the latest Mars exploration rovers, and analytical
    programs that scientists use back on Earth. (If you’re going to take this path,
    though, you should probably learn `Python` and `C` as well.)


    Currently, the most booming field for `Java` is in mobile app development, and
    with the continued success of `Android` devices, that need doesn’t look to be
    stopping any time soon. You could work for a major app development company—like
    Niantic, which made Pokemon Go; King, which made the popular game Candy Crush;
    or Rakuten, the developer behind the popular call and messaging app Viber. But
    with app development, you don’t have to aim for a job with the giants. Plenty
    of popular and successful apps come from startups, or even small groups of friends
    who want to test their programming skills in the smartphone marketplace. If you
    design and release a successful `Android` app with your `Java` skills, this could
    lead to opportunities at many of the bigger companies named above.


    ![](images/main-47.jpg)


    Cross-platform communication once meant computer-to-computer. Today, dozens of
    devices in your house alone are connected .


    ## The Future of Java


    The future of `Java` looks bright. `Java` makes up the foundation of Google’s
    `Android`, one of the most popular operating systems in the world. That means
    that there will be a demand for hundreds of thousands of `Java` app developers
    to satisfy the cravings of more than two billion smartphone users for new tools,
    designs, and powers. Likewise, the trillions of dollars per year that flow through
    the world’s biggest companies also depend, in part, on strong support for `Java`
    and its enterprise applications. `Java` is still easy to learn, and people new
    to the language still find support in an online user community of millions of
    `Java` programmers eager to share ideas and experiences, annual conferences devoted
    just to `Java`, and massive “libraries” of useful `Java` code others have already
    written.


    As Gosling noted, `Java`’s long-term success was built into its foundational principle
    of shared access and cross-platform communication. Today, `Java` owes its continued
    popularity to a massive user-base that crosses platforms, companies, industries,
    nations, and other (human) languages.


    As you learned earlier, different programming languages have their strengths and
    weaknesses, and most end up doing different tasks. The language `C` powers the
    traffic lights that make you bring your car to a stop. `Java` powers the apps
    in the `Android` smartphone that you use when you’re sitting in the back seat,
    while beside you, a friend or sibling texts on an iPhone, using `Objective-C`.
    You decide to place an order at a pizzeria near your house before you arrive there,
    so you pull up Google search, which uses `C++` and `Python`, and find the pizzeria’s
    website, which uses `HTML` and `CSS`. You click a call button built with `JavaScript`,
    and the phone begins to ring.


    ![](images/main-48.jpg)


    Learn how to say "hello" in any programming language—you can start with `Java`
    .


    Soon, new languages will weave themselves into your daily life, as more and technologies—like
    cars, watches, robot vacuums—connect to the internet, each other. As specialized
    as programming languages have become, there’s one function that every single programming
    language has done, and done many, times. It’s called “Hello, world!” If you say
    those two words to any programmer, she’ll know what you mean. To demonstrate what
    a new language looks like, or to teach basic syntax to a new learner, programmers
    will usually write a “Hello, world!” app. If you’re going to learn `Java` programming,
    the “Hello, world!” app will be one of the first that you build, before you learn
    to do much more impressive and complicated things.


    So, `Java` programmer: now that you know about one of the most important languages
    to Earth, a language millions of people can write and billions of computers can
    read—though neither can speak it—it’s your turn to say “Hello, world!” Say it
    with `Java`, and say it in a new way, a way that only you could say it. With those
    two words, you just might change the world you’re greeting.


    ![](images/image_006_.jpg)


