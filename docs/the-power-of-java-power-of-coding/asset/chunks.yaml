    仅在那里待六个月后，他就就了 Liquid Robotics，目前在那里担任首席软件架构师。现在，他正在制造从海洋收集数据的智能机器人。他最近的一些项目包括提高汽车安全性以及致力于更安全的自动驾驶汽车。他一直是
    `DIRTT` 的长期董事成员，这是一家具有环保意识的室内设计和建设公司，他利用帮助创建 `Java` 的某些原则分享了他对改革美国医疗保健系统的兴趣。他仍然经常向
    `Java` 开发者和爱好者的观众演讲，记者也经常请他对该语言未来的用途进行推测。


    ![](img/main-13.jpg)


    没有任何编程语言对智能手机的影响比 `Java` 更大了——对于我们这种随时随走的文化来说，这是一个很好的名字。


    在急于将作品推向世界的工程师们的压力下，负责营销的 Kim Polese 在对朋友、同事和家人测试了该名字后，做出了最终决定。没有人能确定，现在被称为“Java”的语言和平台如果换一个名字是否仍会如此成功，但显而易见，“Java”这个名字并没有坏处。这个名字似乎包含了创造者们希望它具备的一切：“Java”听起来依然充满活力、希望、异域风情、快速、爵士且时尚。Gosling、Warth
    以及其他人可能并没有考虑到那个岛，没有考虑到荷兰和东南亚的殖民历史，甚至没有考虑到全球咖啡贸易的经济学，但他们无意中将他们即将突破的、革命性的品牌命名为另一种产品——在几个世纪前就改变了世界的饮用饮料
    `Java`（咖啡）。这个名字很贴切。今天，`Java` 仍然是最流行的编程语言，开发者们每天都在为它构思新的用途。


    ## 初登：当世界首次想象 Java 能做什么时


    `Java` 将向公众展示这一消息让 James Gosling 感到非常出乎意料。他的同事 John Gage 在 1995 年初的一天来到 Gosling
    的办公室，请求借用一些电缆和台式机。他随口说，他将去参加一个由好莱坞和硅谷大人物参加的会议，演示 `Java` 团队一直在秘密开发的 `WebRunner`
    浏览器。由于担心他们进行中的工作可能会在这些有影响力的观众面前崩溃，Gosling 作为故障排除者随了过去。


    演示进行得很顺利，但 Gosling 注意到观众并没有太关注。人们对于“一种他们并不懂的新语言驱动了一个看起来与已有的网络浏览器非常相似的浏览器”这一事实并不非常兴奋。看到这一幕，Gosling
    做了一系列你也做过无数次的动作。他拖动光标，越过屏幕，到了一个小小的分子 3D 图形。请记住，光是图形本身并不令人兴奋——开发者已经在网页中放置了图像和视频。但
    Gosling 在屏幕上做了一件观众中没有人见过的动作。他点击鼠标并向下拖动。分子移动了。


    ![](img/main-14.jpg)


    `Java` 驱动着你的智能手机，但也有助于运行巨大的超级计算机。这种特性被称为扩展性（scaling）。


    这看起来似乎不多，但那个微小的动作是革命性的。这是历史上第一次，用户可以与网页进行交互。Gosling 和 Gage 展示了他们语言的其他用途，包括一个 `applet`——或者说执行小任务的程序——它可以对不同长度的行进行排序。同样，这现在看起来并不令人印象深刻，但它证明了
    `Java` 很快就能实现的功能。


    老“绿色小组”在一个月后向朋友发布了 `Java`，随后向整个互联网发布，并看着下载量攀升到数百，然后超过一万，接着超过了一百万。他们每天轮流处理数千封电子邮件。更大的消息来自
    `Netscape` 公司的高管，他们宣布将在流行的浏览器 `Navigator` 中开始使用 `Java`。那时清楚，`Java` 将帮助塑造网络的未来。


    之后，`Java` 成为最流行的计算机编程语言。自 `Java` 发布以来，有许多新语言问世，还有少数完全不同的语言在与它竞争开发者的忠诚度，但 `Java`
    对后来的绝大多数语言都产生了巨大的影响。`Java` 在智能手机和其他技术的发展中具有巨大的影响力，因为 `Java` 可以在不同的操作系统上运行，并且可以很容易扩展，这意味着它可以在小型消费电子和智能手机应用（如
    `Pokemon Go`）中运行，也可以用于超级计算机等大型设备。然而，比任何技术成就更重要的是，`Java` 改变了我们思考计算机的方式、我们与计算机的关系以及我们通过计算机可以实现什么。但要理解这一点，你需要更多地了解
    `Java` 是如何工作的。


    ![Image](img/page31_image2.jpg)


    相反：每个编程语言都有不同的特性。为项目选择语言取决于你的目标。


    ![](img/image_003_.jpg)


    ## 工作原理


    到目前为止我们主要将 `Java` 称为一种语言，但为了理解它是如何工作的——以及它为什么是革命性的——我们必须将 `Java` 既视为语言也视为平台。在本章中，你将学习
    `Java` 的基础知识：它看起来是什么样，它做什么，以及是什么使其与独特。我们将解释不会说话的东西如何成为语言，并讨论有助于计算机工业的特性。


    ### 什么是语言？


    你不能用 `Java` 来提问——但你可以用它下命令。你不能用 `Java` 写诗——但它驱动了像 `YouTube` 和 `SoundCloud` 等网站的部分，创意人士在那里分享艺术。尽管它看起来不像你现在阅读的英语，但
    `Java` 是一种语言。


    你的第一门语言是你在不知情的情况下学会的。它是环境的一部分。你可能不记得学习第一语言的过程，因为那发生得太早了。我们大多数人在没有刻意努力的情况下就精通了母语，后来才学习规则。你的父母对你发出声音，你极其强大的婴儿大脑首先记住了几个，并命令你的小肺、喉咙、舌头和嘴唇移动发出同样的声音。与此同时，你开始注意到模式。如果你学习一种新语言，无论是在学校还是搬到新社区，这个过程可能是困难并需要很长时间，但你仍然在学习一套演变了千年的规则。在英语、西班牙语和南非语等口语语言中，新词每年似乎凭空出现，人们经常违反语法规则，而地球上不同地区说同一种语言的人会用不同的词指代同一事物。


