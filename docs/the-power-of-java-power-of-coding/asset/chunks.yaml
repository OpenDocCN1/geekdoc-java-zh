- fmt: "\nProgrammers say that objects have states, or characteristics, and behaviors,\
    \ or things the object can do or that can happen to the object. To understand\
    \ this, it might help to think of real-world objects. You could say that a fish\
    \ is an object. Every fish has “states” (characteristics): it has a name, a shape,\
    \ and a color. The fish also has behaviors: it can swim with its fins; it can\
    \ use its gills to take oxygen from the water; it can eat and be eaten. There\
    \ are infinite objects in the universe, with infinite states and behaviors. This\
    \ is also true of Java.\n\nAnd just as we love to classify things in the real\
    \ world—organizing fish by species, family, and native environments—we also put\
    \ Java objects into a `class`, or a general blueprint for creating individual\
    \ objects. `Classes` say which states and behaviors objects within the class can\
    \ have. When you finish writing a new program, you save it as a new `class`.\n\
    \nFinally, a programmer can express an object’s behaviors through a `method`,\
    \ a part of the code that says what will happen to an object, or how objects will\
    \ interact with each other. The primary method in a class is called a `main`.\n\
    \n## Code Structure and Syntax\n\nAs you might have guessed already, objects make\
    \ programming complex tasks much easier. Objects let programmers focus on individual\
    \ pieces of their code one at a time, before putting the objects together.\n\n\
    As stated in the previous section, `classes` are like blueprints for creating\
    \ objects, which means before you make an object, you need a `class`. Let’s say\
    \ your dog ripped out the title page of this book. Because you want to fix the\
    \ book and test out your programming skills at the same time, you decide to write\
    \ a program that will print out a new title page for the book. (Don’t worry about\
    \ how the program connects to your printer. Check the back of this book for more\
    \ resources that will teach you about that.) You’d start by writing something\
    \ like this:\n\n```java\npublic class TitlePagePrinterApp {\n```\n\n“Public” means\
    \ anyone can see your app. “Class” signals that the name of your app will follow:\
    \ we named this app “TitlePagePrinterApp.” Finally, the curly bracket, `{`, ,\
    \ signals the opening of the class. Basically, all the code that does stuff comes\
    \ after the curly bracket. So, once you add a `method` (to make your program do\
    \ something) it could look like this:\n\n```java\npublic class TitlePagePrinterApp\
    \ {\n    public static void main (String[] args) {\n        System.out.print (\"\
    The Power of Java\");\n    }\n}\n```\n\nDon’t worry about knowing what every single\
    \ word or character here does. Beneath the opening line of your `TitlePagePrinterApp`\
    \ you’ve added the `main` method, which contains a statement about what your app\
    \ will do. The statement is on the third line:\n\n`System.out.print (\"The Power\
    \ of Java\");`\n\nIn this case, you’ve told your app to print the characters “The\
    \ Power of Java.” This is called a `string`. In Java, a `string` is just a packet\
    \ of information, or data. The data is what you want to print: the title of this\
    \ book. Every statement ends with a semicolon (`;`). The first curly bracket closes\
    \ the `main` method, and the second curly bracket closes the `class`, `TitlePagePrinterApp`.\n\
    \nBy this point you’ve learned a lot about Java, and you also feel like playing\
    \ a bit of a prank on your librarian, or the next person to pick up this book.\
    \ So, you make your code a little more advanced:\n\n```java\npublic class TitlePagePrinterApp\
    \ {\n    public static void main (String[] args) {\n        System.out.println\
