  md: 'cooling is not a simple thermal process. On its way to the surface, before
    the ultimate radiation and dissipation into the Universe, the free energy assumes
    all kinds of conditions. In the first place, the temperature gradients initiate
    exothermic chemical reactions with a disperse, atomic and ionic flow of matter,
    bringing about geochemical adjustments in the composition of the earth''s shells.
    Physico-chemical processes cause changes in density, and as they are unevenly
    distributed, result in a disturbance of the hydrodynamic equilibrium. Therefore,
    the equilibrio-turbal effect of the chemical process goes periodically to restorative
    reactions which have the character of concentrated mass displacements. These equilibrio-petal
    movements in depth are accompanied by wavelike deformations or ''undations'' of
    the earth''s surface. Van Bammelen, Geology of Indonesia, 1A:723.


