    Hamilton''s new vision of the planetary story went as follows. The earth''s crust
    was fragmented into seven large lithospheric plates with numerous shards and smaller
    fragments moving in relation to each other.$87$ Indonesia was at the intersection
    of three megaplates, the relatively stable northwestern Eurasian plate, the westward-moving
    Indo-Australian plate to the south, and the Pacific plate to the east, moving
    inward. Mainland Southeast Asia was rotating clockwise, causing the Indonesian
    archipelago to be wedged and crushed—a shattered and fragmented front of the Eurasian
    plate. The contact zones between plates were defined by subduction zones such
    as the Indo-Australian plate that was driving beneath the Eurasian plate. To the
    east, where the line of Vining Meinez''s negative anomalies curled lent, the Indo-Australian
    plate converged with the Pacific plate and bore down in a complex “strike-slip
    system” in which plates snapped each other in sudden bursts or slowly ground one
    on the top of other.$88$


    Hamilton did not disagree with Verbeek: Java had once been under the ocean. Hamilton''s
    history was revisionist. During the Cretaceous there was no continental material
    that Java currently sat. Verbeek understood that bridge connected Borneo to Southeast
    Asia, animals migrating between them. But for Hamilton, there was no island yet.
    The continental material was drifting, and by the Oligocene the material that
    would become Java was still underwater; the belt of magma and volcanism was much
