  md: 'The Weichert was prone to mechanical failure, though. Van Bemmelen wrote that
    it was unable to "hear"; it was not sensitive enough to register small distant
    shakes and shudders from landslides or slumping, could not it registering rocks
    that could collide with villages on the slopes. The Weichert was better at registering
    larger tremors such as volcanic and tectonic earthquakes. The lack of sensitivity
    of the machine, in effect, kept observers blind and at a distance from the crater.
    Van Bemmelen reasoned that the amplifiers and transmitters created by the Einhoven
    might enhance the Weichert''s sensitivity. As he saw it, the string galvanometer
    became a better "ear," and in this way, the omen of an approaching catastrophe
    could be recorded.\³⁰ Increasing sensitivity meant, again, overcoming distance,
    and overcoming distance meant collapsing the delay between the present and the
    future, the crater and the slopes. If the instrument could be tuned in just the
    right way, observers in the dark tunnel could see and hear and continue to choreograph
    the population with events in the distant crater.


    Einhoven Jr. worked under the authority of the occupying Japanese military and
    received permission from Mr. Maseh, the newly installed director of mines, to
    collaborate with Van Bemmelen.¹¹ They set to work on combining the electromagnet
    developed for the string galvanometer with a suspended moving coil that amplified
    minor movements in the ground and then triggered a bell and red light. Telephone
    calls could then be made to Muntilan and sirens along the slopes sounded.³³² Van
    Bemmelen wrote that the "rumbling of escaping gasses, the clinking of rocksides,
    the roar of avalanches, the resonance tones of the lava dome, varying with its
    mass," all could be witnessed for the first time on seismograph paper; a new resolution
    appeared from what was once invisible in the distance.³³³ Observation no longer
    required seeing or hearing the volcano in situ. Scientists were brought to the
    caldera from the darkness of the bunker through the scratching on the seismograph
    paper, as Java had been brought to Leiden through pulses in the air. The seismograph
    was an extended stretching through space and into the future. Via the relay of
    warning signals, it would also bring the events in the caldera to the slopes five
    kilometers away and before the event materialized. Einhoven Jr.''s short-wave
    seismograph tuned them in.


