    # EPISODE 1: EINTHVEN''S HEARTBEATS · Willem Einhoven Sr. was born in 1860 in
    Semarang, a port city on the north coast of Java, where his father was a physician.
    Like many Europeans in the colony, Willem returned to the Netherlands to study,
    and he completed high school and medical studies in Utrecht. In 1886, when he
    was only twenty-five, he appointed chair of Physiology at the University of Leiden.


    Nineteen years later, working in this cavernous, instrument-strewn laboratory,
    he was trying to solve a problem with his technicians. They had successfully designed
    and built an electrocardiograph that amplified and recorded with unparalleled
    precision the electrical pulses emitted by a patient''s heart. For the first time,
    the heartbeats of healthy and ill patients could be accurately compared. Wholly
    new diagnostic opportunities emerged; arrhythmia, the condition of irregular heartbeats,
    could be exactly identified and precisely linked to physiological causes. But
    the problem required five people to operate it; it filled two rooms and was powered
    by a giant electromagnet. If the patient was sick, often immobilized, how could
    they be expected to travel to his machine? He needed to reverse the arrangement
    and bring the machine to them. Einhoven wondered: “Since electric currents bring
    us information by telegram from all parts of the world, why should not the currents
    originating in the heart be conducted from the hospital to the laboratory?” He
    wanted to hold heartbeats into the telegraph system.


    The first telephones had been recently installed in Leiden, and in 1906, Einhoven
    connected his electrocardiograph to the university hospital mile away through
    a buried cable. After troubleshooting for interference—because voices in the phone
    network could interrupt the heart signal—a chair was set up for a patient from
    which they could rest their hands and feet in buckets of salt water (figure 6.4).
    Electrical pulses that caused the heart to contract (systole) passed through the
    cable to the lab and to Einhoven''s other impressive invention, the string'
