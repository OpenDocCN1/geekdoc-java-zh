    A JAVANESE ANTHROPOCENE The recent proposal to name the current geological epoch
    the Anthropocene signaled that geologists were recognizing the border between
    geology and society had become porous. For many geologists, this was unprecedented.
    In the history of Javanese volcanology, however, it came as no surprise. As I
    mentioned above, blurring the boundary between geology and society has been crucial
    for Javanese volcanologists for more than a century. As volcanologist Reinout
    van Bemmelen put it in 1954, after more than two decades studying volcanoes, "Mountain
    building provides the very basis of our existence on earth."^26 He developed a
    form of volcanological determinism that placed volcanic processes at the center
    of cultural processes. Civilizations, he argued, could not be understood without
    also understanding the dynamism of the earth. Van Bemmelen''s friend and colleague,
    Umbgrove, came to develop his complementary theory that sought to bring together
    civilizations, species differentiation, and consciousness with volcanic processes
    in *The Pulse of the Earth* (1942). Umbgrove drew on the term Psychochoic, as
    used by Joseph Le Conte, a geologist and physician, who in 1877 stated that he
    based the term on "the fact that Man, the specialist of spiritual and intellectual
    differentiation, appeared on the stage and began to extend his supremacy over
    the world."^27 Le Conte continued, "The geological importance of the appearance
    of man is not only or chiefly to his transcendent dignity, but to his importance
    as an agent who has already very great, and who must still more profoundly, modify
    the whole fauna and flora of the earth."^28 Umbgrove''s use of the Psychochoic
    not only anticipated Anthropocene debates, was also one example of how volcanologists
    in Java sought to account for the multiple directions of influence between geology
    and society. As both Umbgrove and van Bemmelen knew well, the Holocene was so
    named in the first place because it reflected the emergence of human agriculture.^29
