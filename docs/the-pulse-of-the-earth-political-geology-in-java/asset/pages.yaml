  md: '# ACKNOWLEDGMENTS


    THIS PROJECT HAS MOVED AROUND A LOT · I have carried it, and it, in turn, has
    carried me. Parts of it were written in notebooks in Singapore, in a room in Jakarta,
    at a temporary desk with piles of old photobooks in the volcano observatory in
    Jogja, with final read-throughs in Central Sulawesi. There was the pleasant library
    with the quiet transistor radio at the Geological Survey in Bandung, and there
    were the rainy days on the deck by the cashew grove in Lombok. Many hours were
    spent in a gubuk on the edge of Mount Merapi getting away from the project, listening
    to the forest, and hanging out with Giyono. Cambridge, Sydney, Jogja, Malang,
    Jakarta, Kuala Lumpur, Hong Kong, London, Amsterdam, Tasmania, Glasgow, and the
    South Downs were some other places where bits and pieces or entire chapters were
    written, jettisoned, and rewritten. And on volcanoes, most Merapi, but also Tangkunban
    Perahu, Idjen, Kelud, Merbabu, Rinjani, Vesuvius. These topographies nourished
    this book and deserve thanks.


    The conversations, friendships, and support (material and spiritual) that made
    this book possible are no less dispersed and long range. I will proceed chronologically.
    In Cambridge, where the project was conceived, it was nourished, challenged, and
    inspired by Ash Amin, Clive Oppenheimer, Michael Bravo, Simon Schaffer, and Andrew
    Barry. In Jogja, thank you to the Kunci community for the front-porch and dinner-table
    conversations. Elizabeth Inandiak offered me the little room on columns. Thank
    you, Sophia Hornbacher-Schönleber, for conversations and motorbike rides. Thank
    you, Mes 56. Thank you, Farid Rakun'
  merge: -1
  pgno: 18
- img_proc: true
