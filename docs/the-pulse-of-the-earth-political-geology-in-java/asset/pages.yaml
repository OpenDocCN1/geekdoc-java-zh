  md: '# CHAPTER TWO


    # THE ORIGINS OFnJAVA IN FOUR MAPS


    From an Island of Ruins to Youthful Throes


    GEOLOGICAL MAPS AND ORIGIN STORIES · This chapter traces how geological narratives
    of Java have changed since the late nineteenth century by examining four maps.
    I have chosen these four maps because they are synoptic and complete, unlike many
    other geological maps that came before or after. Another reason is because they
    are consequential: these maps transformed the understanding not only of Java but
    of the earth itself; they established new narratives of Java''s geological and
    even social history, and they created the theory of plate tectonics that re-narrated
    Java''s history and story in the 1960s. When began, for the map makers, as an
    attempt to understand Javanese volcanism developed into a reimagining of the origins
    and destinies of continents, the mechanisms by which they moved across the lithosphere,
    and how they tore apart and reemerged remade on the surface. Volcanoes came to
    be seen as expressions of an earth in a state of creative self-destruction. Javanese
    volcanoes are at the heart of the current orthodox conception of the earth; and
    the origin stories taught in most schools about continents and how land separated
    from water had their first drafts in these maps.'
