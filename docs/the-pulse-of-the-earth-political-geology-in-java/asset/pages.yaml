    scattered deep inland by the powerful tsunami. The sun went down in Europe, and
    the sound waves from the explosion were so powerful that they blew down walls
    in Semarang and Surabaya in Central Java. Tsunami waves crashed on beaches in
    South Africa and Sri Lanka, and shipping between the East Indies and the rest
    of the world ground to halt. Suddenly the economy of the Netherlands was in hiatus.
