  md: 'modes seeing, and volcanology became an integral form of territorial knowledge
    and control. “ By the closing years of the Dutch colony in the late 1930s, volcanologists
    had constructed a visual culture of volcanoes, established modes of practicing
    fieldwork, and pursued ambitious theoretical frameworks that were uniquely integrated
    with the plantation economy but extended to the entire history of earth.


    As materially grounded as colonial volcanology was, it also mythical, theological,
    and cosmic. Answering why a volcano erupted led to questions that expanded beyond
    the visible to bigger questions about the region, and often enough, about the
    cosmos. Indeed, the theoretically ambitious volcanologists, who became the most
    influential, coupled observation with attempts to situate Indonesian volcanism
    in the history of the evolution of earth. Brouwer, van Bemmelen, and Umbgrove
    engaged with prevailing geological theories that suggested volcanoes were created
    by a cooling, shrinking earth that buckled at the surface and created explosions.
    Many questioned this orthodox narrative and wondered whether volcanism was the
    result of the surface of the earth sliding horizontally. Perhaps, they asked,
    drift caused mountains to build and magma to emerge from below. Engaging these
    debates put Dutch colonial volcanologists at the heart of European geological
    controversies, and Vening Mainz, van Bemmelen, and Umbgrove (as we will see in
    chapters 2, 4, and 5) developed complementary yet unorthodox positions. Van Bemmelen
    developed a theory of *undation*, which pushed huge waves traveling through the
    earth’s surface, that he vigorously defended until his death in 1983, even though
    there was very little uptake of the idea by his contemporaries. Meanwhile, Umbgrove
    posited cosmic rhythms of mountain building, climate change, and species diversification
    that occurred in 250-million-year cycles, corresponding to the time it takes earth’s
    galaxy to rotate. Umbgrove and van Bemmelen wondered whether geological and biological
    time was cyclical, occurring in rhythmic “pulses,” and if so, whether pulses could
    be predicted like seasons or in deep time. For both, that made cosmic order and
    disorder, crisis, and catastrophe legible in the landscape. At the same time,
    at the foreground of their cosmic geology was the question of the place of humans
    and geological determinism. They wondered to what extent humans of geological
    processes, and whether the coming into being and passing away of civilizations
    were rooted in planetary-wide processes of mountain building. Were cultures also
    tectonic?'
