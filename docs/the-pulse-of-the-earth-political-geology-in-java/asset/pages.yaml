    Much of the geology in this book is on the move and in the making. Unlike many
    other extractivist contexts where the sciences stabilize and fix geology in place—turning
    it into a resource through quantification, spatialization, and mapping—volcanoes
    are completely different. They explode and rumble. They cannot be approached or
    hacked like a gold or nickel deposit. Therefore, volcanic political geology is
    a different kind of politics and a different kind of knowledge. The core relationship
    to volcanoes in colonial Indonesia, as we see, was not a fault of extraction through
    stabilization—it was about mining underground or scraping the surface—instead,
    it was about the management of volatile, unpredictable matter in space and time,
    of negating flows and rhythms and pulses to protect an extractive plantation economy.
    The thrust of geological knowledge about volcanism was not how to identify profitable
    ores, minerals, and fuels but, instead, how to anticipate a disaster, identify
    cycles and patterns of eruptions, and predict the future to protect plantation
    labor and better organize plantation land. Geologists thought about geology not
    as stable and fixed objects, nor to the long and slowly transforming processes
    of geological evolution, but as a matter that flows. Their goal was not to take
    geological material and transform it into a commodity but to negotiate its ability
    to suddenly move and destroy an already profitable plantation economy; it was
    a political geology of choreography. They sought to bring together with a mobile
    nature.


