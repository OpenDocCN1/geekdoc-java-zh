    These three episodes, then, reveal that volcano observatories on Mer were implicated
    in far more than the standard narratives of scientific modernization or rational
    volcano monitoring taking the place of local folk science. Observatories were,
    in fact, the result of negotiating fundamental problems of what it means to be
    close to or far from other people and the earth; they were bound up with questions
    of what constitutes a medium, and where to draw the line that differentiates a
    human body from the pulsing earth. Not only did observatories extend the state
    into its hinterlands; at the same time they created sites at which modern global
    geopolitical tensions played out, and they brought these scales together—the political,
    planetary, and bodily.'
