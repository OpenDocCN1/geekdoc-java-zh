    “the summit of Merapi was pulverized—and covered the center of Java in a thicker
    layer of ash.” In 1979, Barry Newman, a journalist for the Wall Street Journal,
    was in Krindjing, on the flank of Merapi, writing a story when he reported that
    1006 Central Java had been destroyed.


