    Hess''s geologic story went thus: In a mythical mode he recounted that the earth
    first formed from solar particles 4.5 billion years ago. Once those particles
    transformed into a solid earth and its shape roughly resembled the modern earth,
    there occurred the great catastrophe (Hess''s emphasis), which very closely resembled
    Vening Meinezs''s origin story of the originally "convective overturn." For Hess,
    this catastrophe was the moment when convection currents began to loop between
    the earth''s center and the crust, which amplified the differentiation between
    surface and center and formed the nickel-iron core with a "primordial single continent"
    above the current (again resembling Vening Meinezs.) He speculated that 50 percent
    of continental material was created by the great catastrophe. The ocean basins
    and continents have since rested on top of a viscous underbelly. The great catastrophe
    allowed him to postulate the origin of a dual convection cell system in which
    heat rose, spread through, and under, the surface of the earth, then descended
    back towards the center. This rising and falling was the mechanism of ocean basin
    evolution. He focused on the mid-ocean ridges in the Atlantic and Pacific, where
    there was recent evidence that the volcanoes there had moved away from the ridges
    over time; and he proposed that the legacy of the great catastrophe could be seen
    in the expansion of the ocean floor away from the center, traveling between 3,000
