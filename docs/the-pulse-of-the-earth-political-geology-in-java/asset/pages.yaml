  md: 'Each of the four maps took nearly a decade to create. Their makers traversed
    a landscape equivalent in distance to that between Paris and Vienna. They crossed
    mountains, forests, cities, rice paddies, plantations, shorelines, and volcanoes.
    One was the result of submarine voyages from the Netherlands to the East Indies
    and grueling months at sea wrestling with faulty instruments and extreme heat.
    The maps were drawn through hot and cold wars, local and global conflicts that
    constrained or enabled geologists in their fieldwork. Some of the technologies
    that were used—planes, ships, bunkers—were adopted after their deployment in battle.
    Volcanic disasters in 1883, 1899, and 1930 compelled the drawing of new maps,
    while other disasters—floods and mudslides—interrupted work in the field. The
    Indonesian revolution in 1945 put an end to the colonial geological offices; their
    mapping departments closed, and no maps of significance were produced in Java
    until 1979. The four maps here, then, represent the transition between two states:
    the even Netherlands East Indies and the Republic of Indonesia. They carry us
    through to the third era of Indonesian postcolonial history, the New Order, which
    fell in 1998, two decades after the theory of plate tectonics was first applied
    to the region. Changing ideas about where the state stops and the earth can be
    read across the lines and colors of these maps. Rogier Verbeek and Reinhard Fennema''s
    first map, completed in 1896, for instance, was the result of, or even proved
    the evidence for, a firm belief that the continents were permanently fixed in
    place and the earth shrinking. Later maps of the 1920s and 1930s were instead
    imbued with enthusiasm for continental drift, when few other geologists around
    the world were convinced of it. Colonial geologists thought that the vigorous
    shaking of the land and exploding mountains perhaps suggested that oceans crashing
    into rigid continental structures. In 1970s New Order Indonesia, when the theory
    of plate tectonics was convincingly applied to the archipelago, the oceans became
    invested with dreams of vision and unprecedented mineral wealth for the young
    country. These maps are inscribed with these epistemic reorientations; through
    them we can read the evolution of narratives not only about how Java came to be
    but about how it came to stand for the earth as a whole. As for the geologists
    who made the maps, we can see how they, too, came to understand that Java was
    not a periphery but instead exemplified fundamental planetary processes everywhere.


    Volcanoes were crucial actors in this new cartographic narratives. Devastating
    volcanic eruptions across Java sent geologists in search of'
