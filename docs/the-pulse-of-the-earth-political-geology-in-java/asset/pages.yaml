  md: 'See, for instance, the following, in which Brouwer considered the horizontal
    folding and stresses in the evolution of the Indies as departing from the tradition
    of focusing on the vertical stresses. He concluded: "It may be that the southeastern
    Indian Archipelago in the future arrive at the same stage as was long before reached
    in the Alps. As the horizontal movements proceed, the sea basins will narrow,
    and eventually the masses of the deeper parts of the present rows of islands will
    be pushed over the present Australian continent and the Sahul shelf which extends
    its borders. For a judgment, whether the force tending to produce movement is
    to the south-east or to the northwest, follows from the conceptions of Hobbs and
    Wegener, no sufficient data are available." Brouwer, "Horizontal Movement of Geantcline,"
    577. Likewise, Molengra asked geologists develop a sufficiently robust complex
    of large-scale folding to comprehend the shape of the Indies and, thus, invited
    theoretical crossovers with drift theories: "It is reasonable to suspect that
    a genetic connection must exist between the subsidence of the rough-taped deep-sea
    basins and the elevation of the adjoining aligned islands; the common origin of
    these antagonistic movements, according to my opinion, has to be sought in one
    and the same crust movement, viz. in a process of folding at a certain depth.
    If the question were raised as to what might be seen at the Earth''s surface by
    crust movement at a certain depth, I should include in reply that its appearance
    would be similar to what obtains at present in the eastern portion of the Indian
    archipelago." Molengraaff, "Modern Deep-Sea Research in the Indian Archipelago,"
    107.


