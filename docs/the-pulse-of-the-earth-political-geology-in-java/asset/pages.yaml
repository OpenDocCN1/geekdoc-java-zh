    sometimes shared this fantasy: overcoming the matter of the world, the relent-
    lessing distance it creates in all things; the dream was to become better than
    matter, collapse the interior of the body with the interior of earth, the one
    contained in the other, the microcosm folded into the micro, the thresholds between
    them crossed by planetary pulses and waves emanating through a vibrantly communicating,
    raucous earth, an earth that was never silent, always on the side of the too much
