    in 1910 and soon after joined the gravimetric survey of the Netherlands. For his
    PhD research, he sought to overcome the problem of measuring gravity with pendulums.
    Pendulums had been used to determine the distributions of gravity and, hence,
    the mass of the earth''s surface. The technique had been applied to mountains,
    rivers, and sedimentary basins, too, and it was becoming useful in measuring the
    mass of continents. Gravity measurements were compelling to scientists trying
    to understand if continents sat in equilibrium with the oceans, a theory called
