    CONCLUSION · Umbgrove''s work has largely been forgotten, and his role in developing
    geopolophysics as a geological method has been sidelined by recent postcolonial
    and literary theoretical developments of geopolitics. For some, geopolitics has
    come to mean little than a style of writing lyrically around geology. For others,
    it is a countermovement to the geological tradition, opening discourses of geology
    to ways of thinking by people who are often excluded by science. Geopolitics has,
    for some, become a way to redeem or re-earth the ancient sciences. As Kathryn
    Yusoff invokes it, it offers a way to think geometrically that undermines the
    division between bio and geos, life and matter, which, following Elizabeth Povinelli,
    is a foundational division that structures late liberal capitalist societies.⁴⁸
