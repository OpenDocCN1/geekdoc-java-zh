    medieval Java was important to think about as the Netherlands East Indies were
    waning and, indeed, European colonialism was on increasingly shaky foundations
    around the world. Thinking about cultural decline by way of volcanic cataclysm
    was simultaneously a way to consider the fragility of the colonial project, progress,
    and the achievements of civilization. It was also a way for colonial scientists
    and ethnologists to participate in cultural revivalism. Volcanoes became figures
    of the untamable, a nature beyond control, in the late colonial imaginary, and
    thinking about their volatile unpredictability went in hand with reflection on
    the political systems that caused or intersected with them. Javanese nationalism
