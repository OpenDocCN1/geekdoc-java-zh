    As Theory for colonial industrialists and plantation owners in Java, Subuh promoted
    a new spirit of capitalism, a spiritual practice for engineers, factory owners,
    financiers, and others disillusioned with Christianity or Islam but were unsatisfied
    with secularism. It promised alienated labor and a re-enchantment with work, progress,
    and world development. When Subuh died in 1987, the organization no longer had
    a charismatic leader, and it fizzled and largely disappeared, forgotten by all
    except few scattered practitioners.


    1006 TODAY · The appeal of the date 1006 as a marker of Javanese cultural cataclysm
    continued to simmer away in archaeologists’ circles and in the popular press.
    The Indonesian archaeologist Boechari in 1976 visited van Bemmeler’s evidence
    of the ancient eruption pushed the date later, claiming that the pralaya was in
    1016, and argued that Kern had misunderstood the date on the Calcutta Stone.


    The French filmmaker and volcanologist duo Katia and Maurice Krafft (whom we will
