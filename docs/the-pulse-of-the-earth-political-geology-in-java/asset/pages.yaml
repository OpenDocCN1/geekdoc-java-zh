  md: '# CONCLUSION


    The Anthropocene is the Indonesian moment of the earth sciences. Scientists are
    understanding once again that geology is social. Modern political history is now
    visible in the rock record. We can make sense of this record with the help of
    the nearly one-century-long story we have just surveyed in this book. We have
    seen volcanism, the history of the earth, its structure, the capacity of continents
    to move and crack and remake themselves were through and through a social process.
    The earth sciences we have just considered a celebratory geology of radical uncertainty,
    a sensual geology, a geology that resisted one thing or another; it was a geology
    that saw the sea on land, of chthonic underworlds to which we owed debts and obligations
    because our world emerged from it, a political geology of petrified heroes that
    remind us of the nearly mystical power we have to say no to unbearable conditions,
    a power of refusal so impressive it leaves a shape in the landscape to remind
    us the next time that we need inspiration; a geology that contained justice—geological
    justice—a justice so human and mortal and fragile and lithic; a social geology;
    a geology that was a mosque for deities to pray in, because deities also need
    to fall to their knees; a geology that recognized how the processes of our earth
    conspire to form themselves in such a way as a mosque for those deities; a geology
    that was cosmic and dangerously theological and mythical; a geology that know
    the line between human bodies and stones were insecure; a geology that understood
    at its core that science told big stories about people and the earth; an unapologetically
    dandy geology, aesthetic, and always too much.


    That is the geology that Anthropocene scientists are currently wondering if they
    can acknowledge. It is terrifying for some—some of my geologist friends still
    believe in the neat and naive separation of myth'
