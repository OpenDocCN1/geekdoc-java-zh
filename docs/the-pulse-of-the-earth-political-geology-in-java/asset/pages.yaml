  md: 'rival states that caused the collapse of early modern Javanese civilization.
    Others argued that disease had decimated the population, or perhaps the laborers
    who built Borobudur and Prambanan were tired of endless work and enslavement to
    depts that they gave up on their rulers in an act of exodus.


    In the early 1980s, volcano scientists from the United States Geological Survey
    began collaborating with Indonesian scientists to settle the controversy. They
    undertook sediment analysis to recalibrate Bem''s hypothesis and argued that there
    was no evidence of a single massive eruption but rather over time, many small
    eruptions intersected with social and political forces to compel the Javanese
    to move eastward. "Explosive eruptions occurred before, during and after construction
    of the major temples of Central Java," they wrote. "We cannot prove that eruptions
    caused the decentralization of civilization in Central Java, but we can say that
    these early eruptions would have been very disruptive."They imagined food shortages,
    perhaps famines, and the undoing of irrigation networks and agricultural systems
    that could have exacerbated existing social and political fault lines. The collapse
    of classical Java was not a single event but a more gradual multidimensional weakening
    of social and natural systems. They ended their reflections in a way not dissimilar
    to Bemmler''s, speculating that because Merapi in the past erupted with greater
    force and devastation in recent history, it might therefore do so again in the
    future. They de-emphasized the power of the AD 1006, even if they thought that
    preparations should have been made for a future massive eruption. The shift in
    attitude was decisive, though, historians and archaeologists were no longer tantalized
    by the idea of a single date and single event, nor was the enterprise synced up
    with a colonial attempt to push against Islam and reveal to the true nature as
    Hindus and Buddhists.


