  md: 'feeling meant collapsing distance, bringing the volcano near while protecting
    the fragile all-to-human flesh and organs of the person watching; it was science
    as meditation and mystical transference, lithic communion. And the science spread.
    The architecture of the observatories there issued tools and techniques—seeing
    machines, hearing machines, drawing machines, measuring machines, communicating
    machines, networking machines. The machines conjured volcanic interiors, tremors,
    smells as bells, waves, and pulses. A chaotic earth, speaking, drawing, sometimes
    screaming. Observatories spread across the hills, and their machines flowed through
    the villages where they were picked up and remade into new visions of what it
    meant to live alongside volcanoes, to a human body on a volcano. We inherit these
    visions in all their twists and turns.


    In Indonesia of the 1930s, volcano observatories were first built on volcanoes
    to protect the plantations and wealthy colonial villas on the upper slopes.¹ Scientists
    carefully considered where to build observatories so that they were near enough
    to the crater to observe it also far enough to remain safe, creating a more difficult
    problem than it seemed first. How close was too close? When is safe during an
    eruption? One solution devised on Merapi was to build in remote terrain at the
    tops of hills with clear views of the crater. The structures were bamboo huts
    with thatched roofs and were connected via telegraph wires to other huts and offices
    in the lowlands. One of the observatories situated on a hill at Maraton proved
    to be a good idea in the term of the view, when the volcano erupted in 1930, so
    much sand, ash, and rock was shot out of the volcano that burst their banks and
    the it was washed away; the seismograph inside was destroyed. The devastation
    caused by the 1930 eruption resulted in a sequence of scientific experiments with
    the tension between distance and observation; the experiments also surprisingly,
    with questions about what a human body and the earth were made of.


    Ideas about distance, the meaning of matter, and the material makeup of the human
    body and earth then spread from volcano observatories across the communities for
    the simple reason that the areas where observatories were built were busy. Observatories
    were near villages, farm fields, miners, and plantation workers. Being there meant
    that scientists lived among these communities and entered into exchanges with
    them. Locals helped build the observatories; some locals even worked their instruments;
    others became monitors. Observatories'
