  md: Indonesian volcanoes taught colonial scientists to see the earth in new ways.
    And so did Indonesians; Javanese political geology enabled European scientists
    to think differently about the relationship between culture and the lithosphere.
    The purpose of political geology as a method, therefore, is to stay close to these
    acts of translation, movement, and transformation in earth knowledges and to map
    the ripples of their political effects. Not only does political geology place
    Indonesian knowledge at the center of modern earth knowledges; it also enables
    us to destabilize conventional narratives about the geological sciences.
