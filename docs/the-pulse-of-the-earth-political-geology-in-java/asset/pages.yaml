    # POLITICAL GEOLOGY AS METHOD


    POLITICAL GEOLOGY · Political geology was created to bring together geology and
    politics in new ways. It developed largely within a milieu of geographers and
    was, in part, inspired by discussions surrounding the Anthropocene.¹ But political
    geology also resonated with conversations across the humanities with shared interests
    in the social life of geology and the geology of social life. Political geology
    attempted to extend those interests by foregrounding the *geos* in the geopolitical
    at the very moment when many contemporary geopolitical analyses had forgotten
    that the *geos* of politics was actual material: grounded geological processes.²
    Turning to a concerted analysis of the ways that the earth and geological matter
    politicized dowetailed with emerging critical analyses of extractivism and modern
    state politics, which showed that the transformation of nature into a resource
    was a process that coupled epistemology and technology.³ Political geology could
    then foreground the ways in which the geological sciences were perhaps most of
    shaping the modern world because they provided the knowledge that drove extractivism.
    There would be no carbon capitalism, in other words, if not for the geological
    sciences. It would therefore be a mistake to try to give an account of the history
