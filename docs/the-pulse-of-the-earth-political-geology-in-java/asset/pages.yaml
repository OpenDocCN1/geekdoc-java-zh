    and its history. Comprehending volcanism was almost immediately metaphysical;
    it meant horizontal the invisible, the subterranean, that could not be measured
    or touched in the field; it meant creating narratives of an inaccessible underworld,
    its history, and its protagonists. Geologists asked whether volcanoes connected
    underground in vast plutomes or whether they were individual, acting independently
    of one another? Asking such questions led them to scrutinize assumptions about
    Java as an island with fixed boundaries and instead open their minds to the active
    role of the ocean floor. Perhaps Java was the ocean reconfigured? Volcanoes became
    windows, then, into the deep structures of the earth. Mapping the edge of a volcanic
    crater was to glimpse into the whole earth. These maps represent four visions
    of what geologists saw from those edges and how they assembled them into the modern
    theory of the earth.


    VERBEEK AND FENNEMA: THE GEOLOGY OF JAVA AND MADURA · Rogier Verbeek, a geologist
    and mining engineer, was the first to complete a geological map of Sumatra in
    the 1870s. There was an emerging colonial excitement about the prospects for exploiting
    coal, oil, and tin, and the colonial government had engaged Verbeek to complete
    the survey. Based on his success, he was immediately engaged by a government eager
