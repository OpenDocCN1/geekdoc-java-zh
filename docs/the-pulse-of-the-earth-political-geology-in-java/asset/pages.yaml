    # COMPLEMENTARITY, GERMAN IDEALISM, AND THE UPANISHADS ·


    The Symphony of the Earth introduced a new term to describe Umbgrove''s system,
    *complementarity*. He wrote, "Remarkably enough, however, [complementarity] remind[s]48
    one of certain aspects of the Brahmanical Upanishads. In *Life and Matter*, a
    collection of essays from 1943 that formed the basis for Symphony of the Earth,
    and, thus, his attempt to the Upanishads prefigured his ideas of complementarity
    and, thus, his attempt to bring together deep geological time and cyclical time.49
    "An analogous conclusion can already be found in the old Upanishads where the
    problem of life of man was called ‘Atman’, and the inexplicable in the whole of
    nature, ‘Brahman.’ The utmost wisdom to which ancient high culture has come be
    formulated as Brahman equals Atmos."50


