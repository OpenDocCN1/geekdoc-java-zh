  md: '# PREFACE


    THE MODERN EARTH WAS MADE IN JAVA · We—as in the we who believe that the earth
    is broken into tectonic plates that glide across the surface of the earth and
    grind into each other, and that the ocean floors are bisected by massive trenches
    that ooze the stuff that makes continents—we inherited these stories from Java.
    Our orthodoxy, the taken-for-granted scientific picture of the history and structure
    of the earth, was forged on the slopes of Javanese volcanoes as scientists watched
    them shudder, explode, crumble, turn to dust and ash, and wash into the oceans.
    Scientists photographed the remains of houses cracked by earthquakes, then they
    circled smoking calderas in airplanes, hid in bunkers, peered from prison lookout
    towers, trekked through forests of giant ferns and pine trees growing from volcanic
    soils. It was in these volatile, rambunctious landscapes—a story that stressed
    the earth was formed under duress, a system of creative destruction, a surface
    remaining itself in deep time—buckling, crushing, and reemerging from its own
    split seams.


    Java has, for more than a century, an intellectual center for earth narratives.
    These narratives were built not only by Western scientists working in Indonesia
    but through uneasy and complicated collaborations with mystics, colonial Christians
    and Muslims, Sanskritists, ethnologists, antiquarians, occultists, postcolonial
    revolutionaries, and ethationalist animists. Earth stories were cosmic stories,
    with told one for on a caldera and the other on the ruins of a Hindu temple. Volcanologists
    carried binoculars and tilt meters, guns and ablations;'
  merge: -1
  pgno: 8
- img_proc: true
  md: 'they prayed to ocean goddesses and mythical jihadist serpents in craters. We
    inherit this past, it made the earth we now know.


    When we imagine that the Anthropocene is an unprecedented moment, shocking because
    humans are now acknowledged to be participating in processes as ancient and soundly
    inhuman as geology, we actually should be surprised by how little we have understood
    of geology and how late many of us are to the game. The Anthropocene is revolutionary
    only for a small few, often scientists and humanists in Western circuits. But
    the core problem has been central to modern geology for more than a century, and
    it was crucial from the beginning in Java. How humans are or not implicated, and
    to what degree of proficiency (when ontologically deep), in geological processes
    are the prevailing metaphysical riddle for geologists. The question was asked
    with a special intensity ever before colonial geologists began mapping the island
    for the first time in the late nineteenth century. Societies in Java were traditionally
    ordered on the principle that geology was social, that social history was geological
    history, and that canoes were societies. Modern European geophysics was built
    this expansive conception of the sociality of geology, and European colonists
    were fascinated by it; they learned how to understand the relationship between
    geology and society from it. Standard Western geological science was not simply
    imposed on a prior geology; instead, Native and colonial geological knowled produced
    each other, even if the process was uneven, indent, and sometimes violent. And
    the Anthropocene was theorized with profound intellectual and political intensity
    in Java long before it became of interest to contemporary Western scholars.


    Acknowledging that society was considered geological in the Javanese geological
    sciences goes some to pluralizing the intellectual traditions that have shaped
    contemporary theories of the Anthropocene. Much Anthropocene remains unfortunately
    bound up with histories that continue to center Western science at the expense
    of its much more plural and cosmopolitan origins. While geological theory is seeking
    to identify the material markers of the Anthropocene, there is also an opportunity
    for us to expand our appreciation of geological thought beyond the conventional
    focus on the West and toward traditions that have often been suppressed in conventional
    narratives.


    Javanese geology helps us understand how thoroughly contemporary discussions of
    the Anthropocene is a spiritual project. It is often assumed'
  merge: -1
  pgno: 9
- img_proc: true
  md: 'that the earth sciences could not be further from theology, that geological
    narratives are the result of a secularizing society shirking the grasp of Christian
    narratives. Java shows us otherwise. It was not only Christianity that was state
    in geological narratives, it was also Islam, Hinduism, Buddhism, and animism.
    Deep time was contrived in a space crowded with temporalities—catastrophic, circular,
    rhythmic, spiraling, linear. And it adapted to them, incorporated them, and sometimes
    sought to repress them. Geological time—and, in particular, Anthropocene time—
    remains religious time, the inheritance of struggles with religious traditions.
    It is strange to think that geology was ever secular, or that secularism succeeded,
    or that the Anthropocene is a secular science. Instead, Japanese geologists learned
    from and leaned on Hindu narratives, ancient Greek myths, and Islamic saints and
    ancestors to build their modern science that shaped the very standard modern earth
    stories that we have inherited, every theory of plate tectonics. This book is
    about these pedagogies, these messy intercalations from paranoid mapmakers to
    scientist mystics to seismographs; it is about how they created “our” modern earth
    on the slopes of Javanese volcanoes.


    LIVING WITH VOLATILE GEOLOGY I first learned about Javanese geology after turning
    a corner. I was in a taxi on the way to the airport in Jakarta, a medium-sized
    city in Central Java. As the taxi driver took a left turn, the road suddenly pointed
    in the direction of a cone emerging from the land, the summit was jagged, stone
    gray, obscured by clouds. “What is it?” I asked the taxi driver. “That? Oh, that
    is Merapi.” I soon learned that Merapi was a volcano that was active and inhabited.
    Some people were saying that nearly one million people lived there. I also learned
    that a few years later, in 2010, it erupted and killed a so-called gatekeeper
    who lived in a village close the caldera. I read in the Guardian that there was
    a conflict between scientists and the gatekeeper because he had refused to leave
    the volcano during the eruption. The article referred to him as the volcano’s
    “spiritual guardian.”


    My intuition told me that the people who lived on Merapi had things to teach of
    us who did not live there. My hunch was that the extreme and unpredictable environment
    on Merapi was the future of us all headed for the climate crisis produces ever
    more uncertainty in natural systems. Merapi, too, is all about unpredictability,
    and people have been'
  merge: -1
  pgno: 10
- img_proc: true
  md: 'living with it for centuries. It seemed to me that this was what people could
    share wisdom about.


    On my first trip to the flanks of the village of Deles, I met a man named Sukiman.
    He had an anarchist ethos and celebrated the volcano, with its caldera smoking
    only a few kilometers away. He embraced an ethical of mutual aid between people,
    nonhumans, and the volcano. We discussed how he was caring for monkey communities
    that lived on the flanks of the volcano and provided early warning signals for
    eruptions they fled before humans sensed danger. He also advocated pesticide-free
    farming and planting native crops. Sukiman was well known in the region as an
    outspoken critic of government and an advocate for disaster management reform.
    He even presented his case to the United Nations.


    I came to understand that villagers in Deles, with Sukiman''s encouragement, were
    self-managing their own disaster reduction and preparedness. They took advantage
    of their proximity to the caldera to take videos and photos of eruptions and later
    sell them to international media outlets, keeping the proceeds in a collective
    community dedicated for disaster relief. Communal savings were also created from
    voluntary contributions from villagers'' harvests. Evacuations, told me, were
    pitched as holidays, periods of reprieve from the boredom of everyday labor. The
    villagers were trying to build a communitarian ethics of mutual aid to manage
    the uncertainty of the volcano. Rather than fear the volcano, they shared an ecology,
    a cosmology, of mutualism. This seemed promising—inspiring actually. Perhaps we,
    too, could learn how to thrive with the radical uncertainty of nature, even in
    its most extreme circumstances. Perhaps we could transform uncertainty into a
    vehicle for creating deeper forms of interdependence between society and nature.
    Maybe that is what residents on Merapi teach us.


    On that trip, I visited the village of Kinaredjo, where Mardijan,"spiritual guardian"
    from the Guardian article, had died in the eruption of 2010. The destroyed parts
    of the village had been rebuilt, including a new mosque in the traditional wooden
    Javanese style. I met Maridjan''s son, Asih, who had taken over the job from his
    father and explained to me that he was continuing his father''s work of undertaking
    annual pilgrages to the volcano. In the village, a disaster tourism business had
    sprung up, taking curious passengers on Jeep rides to the hard, dusty, dry lava
    flows nearby. Kiosks were selling Kinaredjo tea, souvenirs, and T-shirts with
    Maridjan''s face emblazoned'
  merge: -1
  pgno: 11
- img_proc: true
  md: 'on them. I was told that the Jeep business was so lucrative that some of the
    drivers had made enough money to open their own restaurants. The eruption had
    been devastating, but it also provided new economic opportunities and chances
    for regrowth.


    It was on this visit that I learned the richness of the stories about the volcano,
    the expansive pantheon of gods and goddesses that live inside and on its flanks.
    Keeping these stories alive and meaningful was crucial to Maridjan''s and Asih''s
    work as well as devoted followers in the village and across Indonesia. Many Javanese
    men saw that Maridjan, before he died, upheld a tradition of so-called local wisdom,
    a quintessentially Javanese form of mysticism in which volcanic activity was inseparable
    from social and political orders and volcanic tremors and explosions not just
    nature but also a society in duress.


    Later, I began to spend time on leafy Cendana Street in north Yogyakarta the volcano
    observatory. The observatory had its origins and mandate in the early twentieth
    century, when Indonesia was a Dutch colony, to monitor the volcano and warn the
    population of eruptions. Today, it is a high-tech, well-respected scientific observatory.
    As scientists monitor the volcano from Cendana Street, there are six out on the
    slopes and dozens of smaller, unmanned, transmitting stations. In the main observatory,
    there are nearly one hundred staffers. Some of them are on two-hour rotations,
    reading seismographs and overseeing television monitors. Tilt meters measure the
    deformations of the ground, and an assortment of other instruments survey and
    record the volcano''s every move and breath. During the eruption in 2010, observations
    went all the way from the slope of Merapi to Yogyakarta, Bandung, the presidential
    palace in Bogor, and the United States Geological Survey (USGS).


    There were not only farmers constructing multispecies mutual-aid communities but
    also Javanese mystics, enterprising disaster victims, and scientists, each trying
    to make sense of the unpredictability of Merapi. Each of these groups had very
    different stories to tell about the volcano. Scientists understood that it was
    part of the global tectonic system. South of Java, they reasoned, about five hundred
    kilometers away in the Indian Ocean, was a continental subduction zone, where
    the Australian plate was driving below Java and resurfacing on land through volcanic
    outbursts. They not only thought Merapi was the result of planetary evolution;
    they were also representatives of the state and public health officials dedicated
    to protecting the population. Yet, in Kinaredjo,'
  merge: -1
  pgno: 12
- img_proc: true
  md: 'where Maridjan died, many villagers celebrated narratives that had been transmitted
    from before the colonial era and the establishment of any scientific observatory.
    For many residents on the upper slopes, volcanic activity was made sense through
    references to stories connected to the founding of the sultanate in Yogyakarta
    in the eighteenth century; these stories suggested that the first sultan to rise
    to power and established a kingdom in the sixteenth century had done so through
    arrangements (marriage and treaties) with deities in the volcano and the Indian
    Ocean. with the volcano demanded offerings and rituals because volcanic activity
    was connected to human moral and ethical behavior. What animated nature, according
    to stories in the observatory and in the villages, were different, seemingly exclusive,
    and contradictory forces. Sometimes incompatible visions were held together in
    a fragile assemblage, sometimes by one person. I met Indonesian students who prayed
    to Allah in the observatory between meetings about the most recent seismograph
    readings. I met a white French seismologist who spoke excellent Javanese and fluent
    Indonesian, and who joined Javanese rituals with his Javanese mystic. I met scientists
    who held that the plate of tectonics confirmed the origin stories of the Central
    Javanese sultanes. I drank tea with Javanese mystics trained as seismologists
    and with seismologists who meditated on the meaning of nothingness. One afternoon,
    I had a conversation with an observatory technician who had ghosts wandering around
    the observatory the night before. It is no surprise that people hold seemingly
    contradictory and inconsistent views, nor is it world-shattering to encounter
    it in Indonesia. It has long a prevailing interpretation by Western and Indonesian
    intellectuals that Indonesian culture emerges from a long history of stitching
    together diverse cosmologies from centuries of cosmopolitan contact.


    I began to split my time between the observatory and the village of Kening on
    the western slope, a village high up the slope, similar to Deling. Kening is subject
    to intense, widespread, and mainly illegal sand mining, where local and Indonesian
    migrant laborers at the residue of past eruptions, deposits of sand, ash, and
    stones. The mining was causing profound ecological destruction to the river valleys,
    agricultural land, and the water supply. It also gave rise to social conflicts
    and sometimes violence between environmentalists, farmers, and miners. Village
    activists responded with litigation and pushed hard and ambitiously on what they
    saw as a stressed and dysfunctional legal system. On top of that, were'
  merge: -1
  pgno: 13
- img_proc: true
  md: 'also practicing spiritual activism, performing rituals, mysticism, magic, and
    spirit possession to fight corruption and drive the miners away.


    Volcano scientists had a difficult time gaining respect in these circumstances.
    Many people in Keningar were suspicious of government officials, including scientists,
    suspect that they represented, or were directly implicated in, government corruption—the
    same government that failed to protect their rivers and landscapes from mining.
    Some scientists saw the "traditional practices" of ritual, magic, and spirit possession
    in Keningar as forms of folk culture, which they dismissed as voodoo and peasant
    superstition. At the worst of times, scientists, mystics, and activists were locked
    in holding patterns of mutual misrecognition.


    I met a farmer in Keningar, Sukidi, in his eighties, who mediated local spirits.
    The spirits, he told me, were enraged by the mining, and if continued there was
    to be an eruption, or at least a landslide. The volcano was talking back to the
    miners; it was in solidarity with activists and farmers. Sukidi told me that his
    friends often encountered volcano spirits in their dreams; when people died, their
    spirits went into the volcano. The mountain was social history materialized. Eruptions
    and landslides, the shuddering of volcanic earthquakes, were the gestures of rage-filled
    intercessions. Merapi had much to say; it was a matter of learning to hear it.


    This what interested me in Keningar—Sukidi and his friends could help us live
    in the Anthropocene, an age of volatile and unpredictable nature of human agency,
    a period in which geology is woven with human culture, not only imprinted and
    inscribed by human efforts—cities, roads, and mines—but also haunted to its core
    in the very categories that describe geology and the sciences that they study.
    Anthropocene geology is also on the move, destabilizing the conventional boundaries
    between culture and lithos in an unce geological undermining. The animate geology
    of Keningar seemed to offer a new way into thinking the present more by relentlessly
    denying the conventional distinctions between tween stones and persons, human
    sociology, politics and geology, and replacing them with a form of geological
    thought that is always social thought, in other words, a political geology.


    Making sense of the uncertainty of the volcano was inseparable from navigating
    ways of knowing, which in turn navigating multiple, sometimes competing, practices
    of mediation. Merapi was multiple indeed. Yet its fragments were bound together.
    What was certain the'
  merge: -1
  pgno: 14
- img_proc: true
  md: 'common magic conjuring the hidden interior of the volcano and earth. As Bernard
    Siegert has argued, the often-assumed distinction between high-tech and folk-tech
    is condescending; both, in their different ways, share the magic of conjuring
    invisible worlds. The technologies of modern Japanese volcanology and mysticism
    conjure from felt tremors the constant churning of a plate tectonic renewing itself
    and the voices of restless spirits. What the magic of volcano science makes clear
    is just how flawed our contemporary narratives are the disillusionment and disenchantment
    of the modern sciences. The earth sciences, in fact, have their ontological feet,
    as it were, in the magical act of conjuring hidden worlds where processes are
    buried deep inside volcanic mountains or theirurgling chambers. And a volcano
    observatory is an utterly enchanted space, replete with idols (photos of volcanoes),
    daily rituals (reading seismographs or tilt meters), and an acknowledgment among
    volcanologists that they are witnesses to the utter mysteriousness of the earth''s
    processes. Such acknowledgment runs counter to traditions of critical social theory
    that berate the sciences for vanishing mystery from the world through rationalization,
    alienation, and instrumentalization. Contemporary attempts to revive the mysteries
    of geology through poetically inflicted reflections on nature or poetic experiments
    with social theory often reproduce this misunderstanding: volcanology; and specifically
    volcanology in Java, has never been disenchanted; it has always been in magic-collision
    with mystical Islam, geological animism, societal geology, possession play, ancestral
    obsessions, and other techniques of living with through invisible worlds. This
    book is about unseen, shifting boundaries, piggybacking, and unexpected collaborations.
    When we try to imagine how to live in a new geological epoch in which lithic and
    human processes seem uniquely conjoined, we are actually inheriting a much older
    conception of the earth. The rest of this book shows how that conception can be
    and what it can tell us living with the earth.


    PLAN OF THE BOOK Chapter 1 outlines the core ambition of political geology, which
    is to explore the intersections of politics, the geological sciences, cosmology,
    and culture. Political geology was inspired in part by discussions surrounding
    the Anthropocene and a turn across the humanities to grappling with geological
    agency. Yet, as the chapter shows, political geology, with its attention on the
    history of geological and earth'
  merge: -1
  pgno: 15
- img_proc: true
  md: 'knowges, reveals how the Anthropocene debate in the geosciences was prefigured
    by Javanese spiritual geographies and volcanology for at least a century. The
    Anthropocene debate, in fact, belongs to the much older ambition in the geological
    sciences to question the boundaries between society and the earth, between bio
    and geos. The Anthropocene debate also signals a moment in which modern scientists
    are implicitly engaging much older ideas that have long been central to Javanese
    political philosophy, including the notion that politics is fundamentally geological.
    The chapter explores three significant volcanic eruptions and colonial-political
    milieu that brought about the formation of volcanology as a modern science of
    governance in Indonesia.


    Chapter 2 examines geological maps of Java and the contexts of their production
    to explore how geological narratives of Java have changed since the late nineteenth
    century. The chapter traces how these maps represented Javanese volcanism and
    were tied to shifting scientific narratives of the earth''s history. The chapter
    shows that geologists transformed their vision of Java as an island of natural
    and cultural antiquities in which volcanoes were the ruins of great mountains,
    of Java as a young island in the violent throes of youthful earth-building. Adopting
    and adapting ideas of continental drift before many other geologists around the
    world with terrestrial geology were key to this transformation. Combining oceanography
    was crucial to this new view, which later set the stage for the development of
    the theory of plate tectonics in the 1970s.


    Chapter 3 shows how the theory of plate tectonics landed on Mount Merapi. The
    chapter explores how the contemporary theory of the relationship between ocean
    and land was prefigured and enabled by Javanese spiritual geographies. The Central
    Javanese sultanes emerged through an acknowledgment that deities in the ocean
    and volcanoes were related to the sultans. Political power was made possible through
    these associations with chondic deities. The theory of plate tectonics mirrored
    this belief structure. It was based on a radical shift in geological thought to
    understanding the exchanges between oceans and volcanoes. This chapter explores
    how these two visions fit together and the politics of their clashing and melding.
    It follows both the mystics and sultans as they gave offerings to volcano and
    ocean deities and the geologists as, in turn, considered the mystical foundations
    of plate tectonics. The chapter describes these intersections in terms of intercalation.'
  merge: -1
  pgno: 16
- img_proc: true
  md: 'Chapter 4 turns to the beginning of volcanology in the Netherlands East Indies
    and the anxieties of late colonialism. It traces the fate of the idea that the
    medieval Javanese Hindu-Buddhist civilization was destroyed by a cataclysmic eruption
    of Merapi in AD 1006. This became a way to naturalize the end of a culture and
    to explain the rise of Islam. Colonial scientists in the twilight of their own
    empire explored imaginaries of radical environmental change and cultural impermanence.
    Theosophers, Javanese nationalists, aristocrats, Sanskritists, philologists, and
    volcano scientists trudged up and down the slopes of Merapi looking for mystical
    communion with the earth.


    Chapter 5 traces the origins of geopolitics in the work of the largely forgotten
    geologist Johannes Umbgrove in Java in the 1920s. The chapter shows Umbgrove developed
    an aesthetic connection of geologicizing that became an expansive notion of cosmic
    and terrestrial evolution. In his book *The Pulse of the Earth*, published in
    1942, Umbgrove developed *geopolitics* as a name to describe his scientific method
    that connected the psyche to the galaxy. The earth, mind, and cosmos were understood
    as structured by polyphonic rhythms and cycles; geopolitics had nothing to do
    with poetry rocks. This chapter explores how Umbgrove developed geopolitics not
    only on Java volcanoes but also in conversation with orientalists such as Paul
    Deussen, a friend of Nietzsche''s and translator of the *Upanishads*. Umbgrove
    went on to shape the early formulations of the theory of sea-floor spreading and
    plate tectonics in the 1960s. When Umbgrove''s geopolitics became plate tectonics,
    it sought to create a vision of the earth as a system of creative destruction.


    Chapter 6 considers the significance of volcano observatories as contact zones
    between volcanology, geopolitics, and the Javanese ethnonationalist mystical movement
    Kejawan (Javism). The chapter explores the development and evolution of one observatory
    on Merapi that acted the human body, the earth, and communication. The chapter
    also examines how observatories were places through which the Indonesian, French,
    and other states could operate at rural frontiers to manage political crises.
    Kejawan had its roots in the local spiritual geographies of Central Java, theosynthesis,
    and mystical Islam; and observatories became sites where Kejawan practitioners
    struggled with imaginaries of the Republic, infrastructure, and volcanism. As
    much as observatories were architectures of the state, they were also places where
    scientists'' and mystics'' ideas about spatial and temporal proximity transformed
    each other.'
  merge: -1
