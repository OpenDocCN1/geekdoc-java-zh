  md: 'was known by science to connect diverse strands of knowledge. Crucially, geopolitics
    was also scalar; it meant connecting across scales; it did the work of showing
    how the smallest dimensional entities connected with the largest, and the nearest
    with the most distant. In this sense, it was ecological; it insisted on hinting
    relationality as ontologically primary, as the basis of being. Umbgrove also called
    *complementarity*, a science of connectivity and cosmic cohabitation.


    What also remarkable about Umbgrove''s geopolitics was that it was created in
    Java and influenced by his encounters with Javanese volcanoes, Islam, and Hinduism.
    Geopolitics was another product of the Javanese spiritual tradition that went
    to shape the modern science of earth systems. Rather than geopolitics being counter
    to the tradition of the modern sciences, it was central to their very development:
    scientists saw themselves practicing *geography* in their reconstruction of the
    history of the earth; and geopolitics allowed for the development of new earth
    narratives in an early and mid-twentieth-century context that often shunned big,
    speculative ideas. Umbgrove''s conception of geopolitics also established geologists
    to think through the relationship between catastrophic events in the history of
    the earth and the increasingly long durations of time that were coming to be.
    But above all, the reallyappreciated significance of geopolitics was that it was
    a dandy science, unashamedly excessive, speculative, and fascinated by beauty;
    it was science that saw the cosmos, earth, and humankind be profoundly, gorgeously,
    unexpectedly connected. We are lithic, planetary, and cosmic in all our excessive
    differentiation, The geopol-dandy-scientist''s work was to trace the powers of
    difference-making that pulsed through the earth and cosmos; it was a celebration.
    A history of geopolitics is a history of the underground and overlooked story
    of dandy geology, a history forged on the slopes of Javanese volcanoes and in
    conversation with the spiritual traditions of that island that enabled Western
    geologists to rethink everything.


