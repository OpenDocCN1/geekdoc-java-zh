    # CONCLUSION · Metaxian''s practice of picking was conventional and rigorous physics.
    His understanding that the earth was a medium for waves had been standard at least
    the early twentieth century. Yet, what Metaxian brought to the fore was the social
    problem of what it meant to separate signals from noise. If picking reduced the
    problem to amplitude, it made manageable. But Metaxian''s narratives revealed
    something: what differentiated signals from noise was troubling. It was, after
    all, the geopolitics of the Cold War made possible the very registering of seismic
    waves. Did geopol constitute noise that was “not interesting?” Or, was it the
    signal? Ought it be considered as intimately wrapped up in the making of the itself?
    When Santos and Suiano claimed to tune in each other, they were adopting the very
    language of waves that Metaxian would have recognized. They foregrounded their
    own bodies, which many physicists would consider unreliable, even though scientists
