- "# Java 面向对象编程实战：在家听课\n\n\n\n![](img/00047.jpeg)\n\n\n\n\n\n## 作者致辞\n亲爱的读者：\n\n\
  欢迎来到这段旅程。我很荣幸随信附上《Java 面向对象编程：在家听授课程》。在进入主题之前，我想强调一下关于该主题及其内容的几点：\n\n1. 本书的目的是帮助你熟悉\
  \ Java 课堂环境。我从 2005 年开始从事教学工作。我在工程类和非工程类学院都上过课。幸运的是，我的大部分教学工作都是基于 `Java` 及其高级主题的。这就是介绍这样一本书真正的动力。\n\
  \n2. 本书不会讨论如何编写 `if-else` 语句或简单的 `while` 循环等。你的老师期望你在上课之前已经完成了基础家庭作业。在这里，你们的老师将侧重于我们可以在\
  \ `Java` 中实现的基础面向对象概念。\n\n3. 通过这本书，你会有感觉像是在教室环境中学习 `Java`——你的老师会讨论一些问题/话题，向你提问并布置作业。你会被鼓励在进入新话题之前完成这些简单的作业。如果你致力于这门学科并完成这些作业，你将对这种语言建立信心。\n\
  \n4. 在一个学期中，有固定数量的讲座来完成基础主题。我们都知道学习是一个持续的过程。所以，这本书不是为那些想要在 24 小时或 7 天内学会 `Java`\
  \ 的人准备的。这取决于你自己。我只能说：这本书的设计初衷是让你读完书后，对该主题建立充分的知识，你将学习这种强大语言的核心特性，你将学习我们如何在 `Java`\
  \ 中编写程序，最重要的是，如何进阶。\n\n5. 最后，程序已通过 `eclipse` 进行测试。尽管你没有强制要求学习 `eclipse`。你也可以直接在你偏好的\
  \ IDE 中运行这些程序。作者选择 `eclipse` 是因为它被广泛用于开发 `Java` 应用。\n\n作者\n\n\n# 基础术语\n\n## JVM\n\
  全称为 Java Virtual Machine（Java 虚拟机）。当我们编译 `java` 时，得到 `.class` 文件。换句话说，它是一个编译代码的虚拟机。此时\
  \ `JVM` 就出现了。\n\n## JRE\n全称为 Java Runtime Environment（Java 运行时）。它包含了 `JVM` 和库文件。要运行\
  \ Java 程序，必须安装 `JRE`。所以，我们可以简单地说是 `JRE` + 某些包。\n\n## JDK\n全称为 Java Development Kit（Java\
  \ 开发工具包）。它提供了我们开发 `java` 需要的工具。这些工具包含了 `javac.exe`, `java.exe`。当我们启动应用程序时，它会打开 `JRE`\
  \ 然后执行 `main` 方法。所以，我们可以得出结论 `JDK`=`JRE` + 开发工具。\n\n## 字节码\n字节码是 `JVM` 的机器语言。它们为\
  \ `JVM` 提供了指令集。这是经过编译的 Java 代码。`JVM` 的出现是因为它介于这些字节码和我们的物理机器之间。\n\n## 平台\n我们使用“平台”一词是指程序运行的地方。它可以是你的机器，也可以是你完全开发的操作系统。当我们说一种语言是平台无关的，我们的意思是程序员的代码在不同平台之间不会变化。因此，一旦\
  \ Java 程序被编译，我们就会得到字节码。这种字节码格式对于每个平台（Windows/Linux/Solaris 等）都是相同的。因此，我们需要一个解释器来解释这些字节码并产生特定于机器的代码。现在\
  \ `JVM` 出现了。在 Java 中，这些字节码由适用于所有操作系统的 `JVM` 解释。所以，要将 Java 程序移植到新平台，我们需要移植 Java 解释器。\n\
  \n因此，`JVM` 和 `字节码` 的组合使得 `Java` 具有可移植性。\n\n注意：底线是，`JVM`、`JRE` 和 `JDK` 这三者是依赖平台的（因为依赖于操作系统），但\
  \ `Java` 是平台无关的。\n\n## IDE\n全称为 Integrated Development Environment（集成开发环境）。它们为软件开发提供了设施。通常，它们非常智能——为我们提供智能代码补全技术。它们还可以高亮/建议我们代码中各种可能的修复。一个\
  \ IDE 应该包含源代码编辑器、调试器和构建应用程序的自动化工具。IDE 通常包含编译器或解释器（或两者都有）。我们这里使用了 `eclipse`，它包含了这两者。\n\
  \n# 安装\n我们需要两个主要东西。\n\n1. `JDK`\n\n2. `IDE`\n\n访问页面：\n\n[`www.oracle.com/technetwork/java/javase/downloads/index.html`](http://www.oracle.com/technetwork/java/javase/downloads/index.html)\n\
  \n或者\n\n下载 JDK，直接访问这里：\n\n\n\n\n\n[`www.oracle.com/technetwork/java/javase/downloads/jdk8-downloads-2133151.html`](http://www.oracle.com/technetwork/java/javase/downloads/jdk8-downloads-2133151.html)\n\
  \n你将看到一个类似这样的屏幕：\n\n![](img/00001.jpeg)\n\n请尝试根据你的系统配置（例如 32 位/64 位，Windows/Linux\
  \ 等）下载最新版本。\n\n下载 eclipse IDE：\n\n前往此处。\n\n[`eclipse.org/downloads/`](https://eclipse.org/downloads/)\n\
  \n如上所述，请尝试根据你的系统配置下载最新版本。\n\n# 命名规范\n\n- **类 (Class)**- 应该以大写字母开头，并且是一个名词，例如 `MyClass`、`String`\
  \ 等。\n- **接口 (Interface/s)**- 应该以大写字母开头并是一个形容词，例如 `Runnable`、`Remote`。\n- **方法 (Method/s)**-\
  \ 它们应该以小写字母开头并是一个动词，例如 `main()`、`showMyMethod()` 等。\n- **变量 (Variable/s)**- 应该以小写字母开头，例如\
  \ `myIntegerValue`、`myDoubleValue`、`myName` 等。\n- **包 (Package/s)**- 应该全部小写字母，例如\
  \ `mypackage`、`package1` 等。\n- **常量 (Constants)**- 它们应该是全大写字母，例如 `MY_CONSTANT` 等。\n\
  \n除了少数特殊情况外，我们尝试在书中维持这些规范。\n\n# 简介\n\n## 历史\n1991 年 6 月，James Gosling、Mike Sheridan\
  \ 和 Patrick Naughton 启动了 Java 语言项目。Gosling 的办公室外有一棵橡树（Oak）。人们说这就是为什么该语言最初命名为 Oak。后来他们将项目重命名为\
  \ Green（他们的团队名称也是 Green team）。最后他们将其重命名为 Java。Green 项目由 Sun Microsystem 授权。\n\n\
  团队成员希望有一个在本质上非常独特的名称，同时又能反映出未来技术的本质。因此，他们选择了如“Dynamic”、“Revolutionary”、“Silk”、“Jolt”、“DNA”等名称。\n\
  \nJames Gosling 后来提到，Java 是与 `Silk` 并列的首选之一。但最终他们选择了 Java，因为大多数团队成员都喜欢这个名字。\n\n\
  Java 于 2006 年 11 月 13 日开源。Sun 在 2007 年 5 月 8 日通过将所有 Java 核心代码按免费软件/开源分发条款提供（他们未持有版权的一小部分代码除）完成了这一过程。\n\
  \n后来，Oracle 公司收购了 Sun Microsystem，收购过程于 2010 年 1 月 27 日完成。\n\n## 首要目标\n这些特性是 Java\
  \ 的主要关注领域：\n1. 简单、面向对象且熟悉。\n2. 健壮性和安全性。\n3. 架构中立且可移植。\n4. 高性能能力。\n5. 解释型、多线程和动态性。\n\
  \n## 我们的第一个程序\n现在让我们来看第一个程序。我们在这里打印 Hello World。\n\n```java\npackage javaclassnotes.programs;\n\
  \npublic class HelloWorld {\n    public static void main(String args[]) {\n    \
  \    System.out.println(\"Hello World.\");\n    }\n}\n```\n\n输出：\n![](img/00002.jpeg)\n\
  \n## 分析\n1. 首先，在整个书中，我们将程序组织在包（package/s）中。但对于这个程序，这不是强制性的。一旦我们学习了关于包的章节，这一点对我们将很清楚。\n\
  2. 这是 `main` 方法的基本结构。每个关键字的含义和意义你将逐渐明白。因此，目前你必须遵循这个结构。\n3. 我们的源代码文件名为 `HelloWorld.java`。我们需要为\
  \ Java 文件使用 `.java` 扩展。这是编译器的要求。\n4. Java 是区分大小大小的。\n5. `main`- 程序将从这里开始。\n   -\
  \ `public`- 访问修饰符。访问修饰符用于控制成员的可见性。\n   - `static`- 它允许我们在不实例化类的特定实例的情况下调用 `main()`。我们稍后会分析\
  \ `static`。\n   - `void`- 返回类型。\n   - `String args[]`- `args` 是 `String` 类实例的数组。String\
  \ 对象用于存储字符字符串。\n   - `println`- 它用于显示信息。\n   - `System.out`- 在此阶段很难解释。我们只需要知道 `System`\
  \ 是一个类，而 `out` 是与控制台关联的输出流。\n\n## 测验\n输出是什么？\n```java\nclass Hello {\n    static\
  \ void main(String args[]) {\n        System.out.println(\"Hello World.\");\n  \
  \  }\n}\n```\n输出：\n![](img/00002.jpeg)\n\n\n\n\n\n# 类演示-2\n\n我们在这里提供了我们自己的构造函数。我们可以看到，现在我们可以使用不同的值来初始化对象。`obA`\
  \ 将整数 `i` 初始化为 `20`，而 `obB` 将整数 `i` 初始化为 `30`。\n\n```java\nclass ClassA\n{\n   \
  \ int i;\n    ClassA(int i) {\n        this.i=i;\n    }\n}\n\nclass ClassEx3\n{\n\
  \    public static void main(String args[]) {\n        System.out.println(\"***\
  \ A Simple class with 2 objects-obA And obB ***\");\n        System.out.println(\"\
  *** obA.i And obB.i are different here ***\");\n        ClassA obA=new ClassA(20);\n\
  \        ClassA obB=new ClassA(30);\n        System.out.println(\"obA.i =\"+ obA.i);\n\
  \        System.out.println(\"obB.i =\"+ obB.i);\n    }\n}\n```\n\n输出：\n![](img/00007.jpeg)\n\
  \n## 学生问：老师，这里的 `this` 有什么用？\n\n问得好。`this` 用于引用当前对象。如果我们像这样写代码，就可以省略 `this` 的使用：\n\
  \n```java\nclass ClassA\n{\n    int i;//实例变量\n    ClassA(int myInt)//myInt-局部变量\n\
  \    {\n        i=myInt;\n    }\n}\n```\n\n我们熟悉这样的代码：`a=5;` 在这里我们将 `5` 赋值给 `a`。但我们能写\
  \ `5=a;` 吗？不能。编译器会抛出现。\n\n在这里，`myInt` 是我们的局部变量（在方法、块或构造函数内部可见），`i` 是我们的实例变量（声明在类内部，但在方法、块或构造函数之外）。\n\
  \n因此，如果我们不使用 `myInt` 而使用 `i`，我们需要告诉编译器我们的意图。它不应该混淆哪个值被赋值到了哪里。在这里，我们将局部变量的值赋值给实例变量，编译器应该清楚地理解我们的意图。通过\
  \ `this.i=i;`，编译器将非常清楚地理解局部变量 `i` 的值被赋值给了实例变量 `i`。\n\n# 类演示-3\n\n在这里我们使用了两个构造函数。过一遍程序。注意，我们这里可以使用默认值初始化对象。如果在创建对象的过程中使用了默认构造函数，则实例变量\
  \ `i` 将初始化为 `7`。我们也可以通过非默认构造函数提供不同的值。\n\n```java\nclass ClassA\n{\n    int i;\n\
  \    ClassA() {\n        this.i=7;\n    }\n    ClassA(int i) {\n        this.i=i;\n\
  \    }\n}\n\nclass ClassEx3\n{\n    public static void main(String args[]) {\n \
  \       System.out.println(\"*** Simple class with 2 objects-obA And obB ***\");\n\
  \        System.out.println(\"*** Different type of constructors used here ***\"\
  );\n        ClassA obA=new ClassA();\n        ClassA obB=new ClassA(25);\n     \
  \   System.out.println(\"obA.i =\"+ obA.i);\n        System.out.println(\"obB.i\
  \ =\"+ obB.i);\n    }\n}\n```\n\n输出：\n![](img/00008.jpeg)\n\n作业：创建一个类 `Vehicle`。该类应该包含字段\
  \ `no_of_seats` 和 `no_of_wheels`。为该类创建两个对象-`Motorcycle` 和 `Car`。你的输出应该显示 `Car` 的描述。\n\
  \n# 继承\n\n继承的主要目标是提高代码的可重用性并消除代码冗余。在这里，子类获取了其父类的特征。我们所说的父类是指相对于另一个类（称为子类）处于更高层级的类。\n\
  \n## 类型\n\n通常，我们处理 4 种继承。\n\n## 单继承继承\n一个子类派生自一个基类。\n![](img/0009.jpeg) 图：单继承\n\
  代码格式如下：\n```java\nclass Parent {\n    // 你的代码...\n}\nclass Child extends Parent\
  \ {\n    // 你的代码...\n}\n```\n\n## 层级继承\n多个子类可以派生自一个基类。\n![](img/00010.jpeg) 图：层级继承\n\
  代码格式如下：\n```java\nclass Parent {\n    // 你的代码...\n}\nclass Child1 extends Parent\
  \ {\n    // 你的代码...\n}\nclass Child2 extends Parent {\n    // 你的代码...\n}\n```\n\n\
  ## 多级继承\n在这里，父类有孙类。\n![](img/00011.jpeg) 图：多级继承\n老师问：现在尝试用 Java 代码实现这个概念。\n解答：代码格式如下：\n\
  ```java\nclass Parent {\n    // 你的代码...\n}\nclass Child extends Parent {\n    //\
  \ 你的代码...\n}\nclass GrandChild extends Child {\n    // 你的代码...\n}\n```\n\n## 多继承\n\
  在这里，一个类可以派生自多个父类。\n![](img/00012.jpeg) 图：多继承\n注意，Java 不支持这种继承（通过类）。即在 Java 中，子类不能派生自多个一个父类。为了处理这种情况，我们需要理解接口。\n\
  \n注意：还有一种类型的继承被称为混合继承。它是上述一种或多种类型继承的结合。\n\n## 继承的简单程序\n\n```java\nclass ParentClass\n\
  {\n    public void show() {\n        System.out.println(\"I am Parent Class\");\n\
  \    }\n}\n\nclass ChildClass extends ParentClass\n{\n}\n\nclass Example1\n{\n \
  \   public static void main(String args[]) {\n        ChildClass child1=new ChildClass();\n\
  \        //通过 ChildClass 调用 show()\n        child1.show();\n    }\n}\n```\n\n输出：\n\
  ![](img/0013.jpeg)\n\n## 学生问：为什么 Java 不支持类的多继承？\n\n主要原因是为了避免歧义。它们在某些典型场景下会引起混乱：\n\
  假设我们的父类中有一个名为 `show()` 的方法。父类有多个孩子——假设 `child1` 和 `child2`，它们为了自己的目的重写了该方法。代码可能如下：\n\
  \n```java\nclass Parent {\n    void show() {\n        System.out.println(\"I am\
  \ Parent\");\n    }\n}\nclass Child1 extends Parent {\n    void show() {\n     \
  \   System.out.println(\"I am Child-1\");\n    }\n}\nclass Child2 extends Parent\
  \ {\n    void show() {\n        System.out.println(\"I am Child-2\");\n    }\n}\n\
  class GrandChild extends Child1, Child2 {\n    // 这在 Java 中是不可能的\n}\n```\n现在假设我们的\
  \ `GrandChild` 继承/调用 `show()`——`Child1` 或 `Child2`。(images/0014.jpeg)这个问题以一个著名的名称——菱形问题（Diamond\
  \ problem）。\n\n\n\n\n\n```java\nSystem.out.println(\"I am in Parent constructor\"\
  );\nthis.a=a;\nthis.b=b;\n}\nvoid parentMethod() {\n    System.out.println(\"I am\
  \ a Parent method\");\n}\n}\n}\nclass B2 extends A2 {\n    int c;\n    B2(int a,\
  \ int b,int c) {\n        super(a,b);\n        System.out.println(\"I am in Child\
  \ constructor\");\n        this.c=c;\n    }\n    void childMethod() {\n        System.out.println(\"\
  I am Child method\");\n        System.out.println(\"Now I am going to call Parent\
  \ method\");\n        super.parentMethod();\n    }\n}\nclass Test2 {\n    public\
  \ static void main(String args[]) {\n        System.out.println(\"*** use of super\
  \ keyword***\");\n        B2 obB2=new B2(1,2,3);\n        System.out.println(\"\
  a in B2=\"+ obB2.a);\n        System.out.println(\"b in B2=\"+ obB2.b);\n      \
  \  System.out.println(\"c in B2=\"+ obB2.c);\n        obB2.childMethod();\n    }\n\
  }\n```\n\n输出：![](img/00015.jpeg)\n\n我们将通过以下示例检查 `super` 的另一种用法。在这里我们将看到，即使父类的变量被子类的变量隐藏了，`super`\
  \ 仍然允许我们访问父类的变量。\n\n```java\npackage javaclassnotes.testprograms;\n\nclass A3 {\n\
  \    int a;\n    A3() {\n        a=25;\n    }\n}\nclass B3 extends A3 {\n    int\
  \ a; // 隐藏 A3 中的 a\n    B3() {\n        super.a=12; //父类\n        a=50; // 用于子类\n\
  \    }\n    void display() {\n        System.out.println(\"a in parent class=\"\
  + super.a);\n        System.out.println(\"a in child class=\"+ a);\n    }\n}\nclass\
  \ Test3 {\n    public static void main(String args[]) {\n        System.out.println(\"\
  ***super Demo-2***\");\n        B3 obB3=new B3();\n        obB3.display();\n   \
  \ }\n}\n```\n\n输出：![](img/00016.jpeg)\n\n注意：学生问：我们可以使用 `super` 关键字来调用被子类隐藏的方法吗？可以。\n\
  \n# 重载 (Overloading)\n\n老师问：考虑以下片段。你发现任何模式吗？\n\n```java\nint sum(int x,int y) {\n\
  \    return x+y;\n}\ndouble sum(double x,double y) {\n    return x+y;\n}\nString\
  \ sum(String s1,String s2) {\n    return s1.concat(s2);\n}\n```\n\n学生回答：是的，老师。我们看到所有方法的名称都是\
  \ `sum`，但从方法体来看，每个方法都在做不同的事情。\n\n老师说：是的。当你这样做时，我们将其称为方法重载。但你应该注意到，这里的方法签名是不同的。\n\
  \n学生问：什么是方法签名？\n\n方法签名由方法名和参数列表组成。Java 编译器可以区分同名但参数列表不同的方法。因此，对于 Java 编译器来说，`double\
  \ sum(double x, double y)` 与 `int sum(int x, int y)` 是不同的。\n\n考虑下面的程序。在这里通过以下示例表示方法重载：\n\
  \n```java\npackage javaclassnotes.programs;\n\nclass Addition {\n    int sum(int\
  \ x,int y) {\n        return x+y;\n    }\n    double sum(double x,double y) {\n\
  \        return x+y;\n    }\n    String sum(String s1,String s2) {\n        return\
  \ s1.concat(s2);\n    }\n}\n\npublic class Overloading {\n    public static void\
  \ main(String args[]) {\n        System.out.println(\"***Method Overloading Demo***\"\
  );\n        Addition additionOb=new Addition();\n        int sumIntegers=additionOb.sum(10,20);\n\
  \        System.out.println(\"Sum of 10 and 20=\"+sumIntegers);\n        double\
  \ sumDoubles=additionOb.sum(10.5,20.7);\n        System.out.println(\"Sum of 10.5\
  \ and 20.7=\"+sumDoubles);\n        String sumStrings=additionOb.sum(\"Amit\",\"\
  Kumar\");\n        System.out.println(\"Concatenation of Amit and Kumar=\"+sumStrings);\n\
  \    }\n}\n```\n\n输出：![](img/00017.jpeg)\n\n老师问：这是方法重载的示例吗？\n\n```java\nint sum(int\
  \ x,int y) {\n    return x+y;\n}\nint sum(int x,int y,int z) {\n    return x+y+z;\n\
  }\n```\n\n回答：是的。\n\n老师问：这是方法重载的示例吗？\n\n```java\nint sum(int x,int y) {\n    return\
  \ x+y;\n}\ndouble sum(int x,int y) {\n    return x+y;\n}\n```\n\n回答：不是。编译器不会考虑“返回值”来区分这些方法。返回值不被方法签名的一部分。\n\
  \n学生问：老师，我们可以有构造函数重载吗？\n\n老师：完全可以。你可以写一个类似的构造函数重载程序。\n\n```java\npackage javaclassnotes.testprograms;\n\
