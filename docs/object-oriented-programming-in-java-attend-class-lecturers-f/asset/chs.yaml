  # 重写 (Overriding)\n\n有时我们想要重新定义或修改父类的行为。在这种情况下就出现了方法重写。考虑下面的程序。注意，这里 `showMe()`\
  \ 方法在父类和子类中具有相同的签名。\n\n```java\npackage javaclassnotes.programs;\n\nclass ParentClass\
  \ {\n    public void showMe() {\n        System.out.println(\"I am in Parent class\"\
  );\n    }\n}\nclass ChildClass extends ParentClass {\n    public void showMe() {\n\
  \        System.out.println(\"I am in Child class\");\n    }\n}\nclass OverridingEx\
  \ {\n    public static void main(String args[]) {\n        System.out.println(\"\
  ***Method Overriding Demo***\");\n        ChildClass childOb=new ChildClass();\n\
  \        childOb.showMe();\n    }\n}\n```\n\n输出：![](img/00020.jpeg)\n\n\n\n\n\n\
  # 动态方法分派\n\n这是 Java 中一个极其重要的概念。Java 可以通过这种技术实现运行时多态。这种技术被认为实现了运行时多态，是因为对重写方法的调用是在运行时动态解析的。Java\
  \ 将根据我们所引用的对象调用相应的方法。\n\n```java\npackage javaclassnotes.programs;\n\nclass MyParentClass\n\
  {\n    public void showMe() {\n        System.out.println(\"I am in Parent class\"\
  );\n    }\n}\n\nclass MyChildClass extends MyParentClass\n{\n    public void showMe()\
  \ {\n        System.out.println(\"I am in Child class\");\n    }\n}\n\nclass DynamicMethodDispatchEx\n\
  {\n    public static void main(String args[]) {\n        System.out.println(\"***Dynamic\
  \ Method Dispatch Demo***\");\n        MyParentClass parent=new MyParentClass();\n\
  \        parent.showMe();\n        MyChildClass childOb=new MyChildClass();\n  \
  \      /*父类引用指向子对象*/\n        parent=childOb;\n        childOb.showMe();\n    }\n\
  }\n```\n\n输出:\n![](img/00021.jpeg)\n\n## 记忆点\n- 通过父类引用，我们可以引用子类对象，但反之则不可行。\n- 因此，`MyParentClass\
  \ parent=new MyChildClass();` 是可以，但 `MyChildClass child=new MyParentClass();` 将抛出错误。\n\
  \n## 老师提问\n现在可能在某些情况下我们希望进行限制：父类中的方法不应被其子类重写。我们如何实现这一点？\n\n在很多面试中，你可能会遇到这个问题。我们必须记住，可以通过\
  \ `static`、`private` 或 `final` 关键字来防止重写。但在这里我们只讨论 `final` 的使用。这非常有帮助，因为编译器本身将阻止重写过程。\n\
  \n```java\nclass ParentClass\n{\n    // 使用 final 防止重写\n    final public void showMe()\
  \ {\n        System.out.println(\"I am in Parent class\");\n    }        \n}\n\n\
  class ChildClass extends ParentClass\n{\n    // 现在不能重写了：这是被允许的\n    public void\
  \ showMe() {\n        System.out.println(\"I am in Child class\");\n    }\n}\n```\n\
  所以，使用上述代码，编译器将抛出错误。\n\n# 抽象类\n\n这些是不完整的类，我们无法从这种类实例化对象。\n\n通常，如果一个类包含至少一个不完整/抽象的方法，那么该类本身就是一个抽象类。通过“抽象方法”这个术语——我们的意思是方法有声明（或签名）但没有实现。\n\
  \n当超类可以定义一种通用形式（将由其子类共享）并将填充细节的责任交给其子类时，这种技术就非常有用。\n\n一个简单的抽象类演示：\n\n## 实现-1\n```java\n\
  package javaclassnotes.programs;\n\nabstract class MyAbstractClass\n{\n    public\
  \ abstract void showMe();\n}\n\nclass MyConcreteClass extends MyAbstractClass\n\
  {\n    @Override\n    public void showMe() {\n        System.out.println(\"I am\
  \ from concrete class:\");\n        System.out.println(\"I am supplying the method\
  \ for showMe()\");\n    }\n}\n\nclass AbstractClassEx\n{\n    static void main(String\
  \ Args[]) {\n        System.out.println(\"***Abstract class Demo***\");\n      \
  \  // 非法：无法实例化\n        MyAbstractClass abstractOb=new MyAbstractClass();\n    \
  \    ConcreteClass concreteOb=new MyConcreteClass();\n        concreteOb.showMe();\n\
  \    }\n}\n```\n输出:\n![](img/00022.jpeg)\n\n抽象类可以包含具体的方法。子类可能会也可能重写这些方法。\n\n## 实现-2\n\
  ```java\npackage javaclassnotes.programs;\n\nabstract class AbstractClass\n{\n \
  \   public abstract void showMe();\n    public void completeMethod1() {\n      \
  \  System.out.println(\" Originally,I am from completeMethod1 in AbstractClass.But,I\
  \ am complete.\");\n    }\n    public void completeMethod2() {\n        System.out.println(\"\
  \ Originally,I am from completeMethod2 in AbstractClass.But,I am also complete.\"\
  );\n    }\n}\n\nclass ConcreteClass extends AbstractClass\n{\n    @Override\n  \
  \  public void showMe() {\n        System.out.println(\"I am from concrete class:\"\
  );\n        System.out.println(\"I am supplying the method body for showMe()\");\n\
  \    }\n    // 它想要重写 AbstractClass 中的 completeMethod1()\n    public void completeMethod1()\
  \ {\n        System.out.println(\"I am overriding completeMethod1 of AbstractClass.\"\
  );\n    }\n}\n\nclass AbstractClassEx2\n{\n    static void main(String Args[]) {\n\
  \        System.out.println(\"***Abstract class Demo2***\");\n        ConcreteClass\
  \ concreteOb=new ConcreteClass();\n        concreteOb.showMe(); // 它将显示 completeMethod1\
  \ 在 ConcreteClass 中被重定义\n        concreteOb.completeMethod1(); // 它将显示 AbstractClass\
  \ 中定义的方法细节\n        concreteOb.completeMethod2(); // 后续声明将是好的\n        AbstractClass\
  \ abstractRef=new ConcreteClass();\n        abstractRef.completeMethod1();\n   \
  \ }\n}\n```\n输出:\n![](img/00023.jpeg)\n\n我们在这里可以实现动态分派的概念吗？可以。以下声明将完全没问题并调用 `ConcreteClass`\
  \ 的 `CompleteMethod1`。`AbstractClass abstractRef=new ConcreteClass(); abstractRef.completeMethod1();`\n\
  \n## 学生提问\n- 抽象类可以包含字段吗？可以。接下来的示例将演示我们如何在这里使用动态分派的概念。此外，程序将显示抽象类包含字段。\n\n## 实现-3\n\
  ```java\npackage javaclassnotes.programs;\n\nabstract class AbstractClass3\n{\n\
  \    int myInt=5;\n    abstract void showMe();\n    public void completeMethod1()\
  \ {\n        System.out.println(\"I am originally from completeMethod1 in AbstractClass.But,I\
  \ am complete.\");\n    }\n}\n\nclass ConcreteClass3 extends AbstractClass3\n{\n\
  \    @Override\n    public void showMe() {\n        System.out.println(\"I am from\
  \ concrete class:\");\n        System.out.println(\"I am supplying the method body\
  \ for showMe()\");\n    }\n}\n\nclass AbstractClassEx3\n{\n    static void main(String\
  \ Args[]) {\n        System.out.println(\"***Abstract class Demo3***\");\n     \
  \   AbstractClass3 abstractRef=new ConcreteClass3();\n        abstractRef.completeMethod1();\n\
  \        System.out.println(\"myInt in AbstractClass3=\"+abstractRef.myInt);\n \
  \   }\n}\n```\n输出:\n![](img/00024.jpeg)\n\n- 假设一个类中有多个方法，其中只有一个是抽象方法。我们仍然需要将该类标记为抽象类吗？\n\
  是的。如果一个类包含至少一个抽象方法，该类本身就是抽象类。你可以从通的角度来看——`abstract` 关键字被用来表示不完整性。因此，如果你的类包含一个不完整的方法，你的类本身就是不完整的，因此需要用\
  \ `abstract` 关键字标记。\n所以，简单的公式是：只要你的类至少有一个抽象方法，你的类本身就是一个抽象类。\n\n## 老师提问\n现在考虑一种相反的情况。假设你将你的类标记为抽象类，但它其中没有抽象方法，如下所示：\n\
