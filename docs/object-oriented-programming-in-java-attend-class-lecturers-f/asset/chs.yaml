  );\n    }\n}\n```\n\n**学生提问：**\n\n具体类是指不是抽象的类——我的理解正确吗？\n\n是的。\n\n**学生提问：**\n\n\
  我们可以对一个方法同时标记为 `abstract` 和 `final` 吗？\n\n不可以。想想一下，通过声明 `abstract`，你想要重写；而通过声明 `final`，你想要防止重写。\n\
  \n**学生提问：**\n\n在 Java 中有构造函数重写吗？\n\n没有。\n\n# 接口\n\n通过接口，我们声明了将实现的内容，但没有指定如何实现它。这些类似于类，但没有实例变量，并且所有的方法在声明时都没有方法体（即方法实际上是抽象的）。\n\
  \n借助接口，我们可以在运行时支持动态方法解析。一旦定义，一个类可以实现任意数量的接口。\n\n## 实现-1：\n\n```java\npackage javaclassnotes.programs;\n\
  \ninterface MyInterface {\n    void show();\n}\n\nclass MyClass implements MyInterface\
  \ {\n    @Override\n    public void show() {\n        System.out.println(\"MyClass\
  \ is implementing the Interface method.\");\n    }\n}\n\npublic class InterfaceEx1\
  \ {\n    public static void main(String args[]) {\n        System.out.println(\"\
  ***Interface Example.Demo-1***\");\n        MyClass myClassOb=new MyClass();\n \
  \       myClassOb.show();\n    }\n}\n```\n\n输出：\n![](img/00025.jpeg)\n\n## 实现-2：\n\
  \n接口有两个方法。但一个类只实现了其中一个。那么类本身就变成了抽象类。\n\n```java\npackage javaclassnotes.programs;\n\
  \ninterface MyInterface2 {\n    void show1();\n    void show2();\n}\n\nabstract\
  \ class MyClass2 implements MyInterface2 {\n    @Override\n    public void show1()\
  \ {\n        System.out.println(\"MyClass2 is implementing the show1() method.\"\
  );\n    }\n}\n```\n注意：所以公式是：类需要实现接口中定义的所有方法。否则，它将是一个抽象类。\n\n## 实现-3：\n\n一个实现多个接口的类。\n\
  \n```java\npackage javaclassnotes.programs;\n\ninterface MyInterfaceA {\n    void\
  \ show3A();\n}\n\ninterface MyInterfaceB {\n    void show3B();\n}\n\nclass MyClass3\
  \ implements MyInterfaceA, MyInterfaceB {\n    @Override\n    public void show3A()\
  \ {\n        System.out.println(\"MyClass3 is implementing the show3A() method of\
  \ Interface3A\");\n    }\n    @Override\n    public void show3B() {\n        System.out.println(\"\
  MyClass3 is implementing the show3B() method of Interface3B\");\n    }\n}\n\npublic\
  \ class InterfaceEx3 {\n    public static void main(String args[]) {\n        System.out.println(\"\
  ***Interface Example.Demo-3***\");\n        MyClass3 myClassOb=new MyClass3();\n\
  \        myClassOb.show3A();\n        myClassOb.show3B();\n    }\n}\n```\n\n输出：\n\
  ![](img/00026.jpeg)\n\n**学生提问：**\n\n在上面的程序中，接口方法名是不同的。但如果两个接口都包含相同的方法名，我们可以实现它们吗？\n\
  \n请看以下实现。\n\n## 实现-4：\n\n```java\npackage javaclassnotes.programs;\n//两个接口都具有相同的方法名\
  \ \"show()\".\ninterface MyInterface4A {\n    void show();\n}\n\ninterface MyInterface4B\
  \ {\n    void show();\n}\n\nclass MyClass4 implements MyInterface4A, MyInterface4B\
  \ {\n    @Override\n    public void show() {\n        System.out.println(\"MyClass4\
  \ is implementing the show() method \");\n    }\n}\n\npublic class InterfaceEx4\
  \ {\n    public static void main(String args[]) {\n        System.out.println(\"\
  ***Interface Example.Demo-4***\");\n        // 所有的三次调用都是合法的。\n        MyClass4 myClassOb=new\
  \ MyClass4();\n        myClassOb.show();\n        MyInterface4A inter4A=myClassOb;\n\
  \        inter4A.show();\n        MyInterface4B inter4B=myClassOb;\n        inter4B.show();\n\
  \    }\n}\n```\n输出：\n![](img/0027.jpeg)\n\n**学生提问：**\n\n接口可以继承另一个接口吗？它可以继承，但不能实现（根据定义）。\n\
  \n```java\npackage javaclassnotes.programs;\n\ninterface Interface1 {\n    void\
  \ show1Method();\n}\n\ninterface Interface2 {\n    void show2Method();\n}\n\n//接口继承接口\n\
  interface Interface3 extends Interface1, Interface2 {\n    void show3Method();\n\
  }\n\nclass MyClass5 implements Interface3 {\n    //现在 MyClass5 需要实现 Interface1、2\
  \ 和 Interface3 方法\n    @Override\n    public void show1Method() {\n        System.out.println(\"\
  MyClass5 is implementing the show1Method() \");\n    }\n    @Override\n    public\
  \ void show2Method() {\n        System.out.println(\"MyClass5 is implementing the\
  \ show2Method() \");\n    }\n    @Override\n    public void show3Method() {\n  \
  \      System.out.println(\"MyClass5 is implementing the show3Method() \");\n  \
  \  }\n}\n\npublic class InterfaceEx5 {\n    public static void main(String args[])\
  \ {\n        System.out.println(\"***Interface Example.Demo-5***\");\n        System.out.println\
  \ \"***接口可以继承接口***\");\n        MyClass5 myClassOb=new MyClass5();\n        myClassOb.show1Method();\n\
  \        myClassOb.show2Method();\n        myClassOb.show3Method();\n    }\n}\n\
  ```\n\n输出：\n![](img/0028.jpeg)\n\n## 标记/标记接口：\n\n一个空的接口被称为标记接口（tag interface）。\n\
  \n```java\n//标记接口\ninterface ITaggingInterface {\n}\n```\n\n**老师提问：**\n\n你能告诉我吗：为什么我们需要标记接口？\n\
  \n1. 我们可以创建一个公共父类。\n2. 类可以声明是某个集合的成员，例如，如果我们的类实现了 `Serializable` 接口，它就变成了可序列化的。因此，我们的类通过多态实际上变成了接口类型。即使是实现标记接口的类，不需要定义任何新方法，因为接口本身没有任何此类方法。\n\
  \n**老师提问：**\n\n你能告诉我吗：抽象类和接口之间的区别是什么？\n\n\n\n\n\n# 抽象类 vs 接口\n\n1. `abstract class`（抽象类）可以包含具体方法，但\
  \ `interface`（接口）不可以。[稍后我们会提到这一点。在 Java 8 中，我们有一个名为 `default` 的关键字。我们可以在 `interface`\
  \ 中使用这个关键字来提供某些默认实现，参见下文的 `implementation-6`。\n\n2. `abstract class` 只能有一个父类（可以继承另一个抽象类或具体类），而\
  \ `interface` 可以有多个父接口。`interface` 只能继承其他一个或多个接口。\n\n3. `interface` 的成员默认是 `public`。`abstract\
  \ class` 可以有其他修饰符，例如 `private`、`protected` 等。\n\n4. `interface` 中的变量默认是 `static\
  \ final`。`abstract class` 可以拥有非 `final` 变量。\n\n## 讨论\n\n学生提问：\n“老师，那么我们该如何决定应该使用抽象类还是接口呢？”\n\
  \n问得好。我相信，如果我们希望拥有一些集中的或默认的行为，`abstract class` 是更好的选择。因为在这里我们可以提供一些默认实现（对于抽象类而言）。另一方面，`interface`\
  \ 的实现是从零开始的。它们指示了某种规则——要做什么（例如，你必须实现该方法），但它们不会强制你如何去做。此外，当我们尝试实现多继承的概念时，接口是首选的。\n\
  \n但同时我们也要记住，如果我们在 `interface` 中添加一个新方法，就需要追踪该接口的所有实现，并且需要在所有地方为该方法放置具体实现。`abstract\
  \ class` 在这方面更有优势——我们可以在 `abstract class` 中添加一个带有默认实现的新方法，而现有的代码可以顺利运行。\n\n所以，现在\
  \ Java 对此付了特别关注，Java 8 引入了 `default` 关键字的使用。在 Java 8 中，我们可以在目标方法签名之前加上 `default`\
  \ 单词，并提供默认实现。接口方法默认是 `public` 的，所以我们不需要用 `public` 关键字来标记它。\n\n## Implementation-6\n\
  \n考虑以下实现：\n\n```java\npackage javaclassnotes.programs;\n\ninterface MyDefaultInterface\n\
  {\n    void show();\n\n    default void defaultMethod()\n    {\n        System.out.println(\"\
  It is a default implementation in the interface\");\n    }\n}\n\nclass MyClass6\
  \ implements MyDefaultInterface\n{\n    @Override\n    public void show()\n    {\n\
  \        System.out.println(\"MyClass is implementing the Interface method.\");\n\
  \    }\n}\n\npublic class UseOfDefaultEx\n{\n    public static void main(String\
  \ args[])\n    {\n        System.out.println(\"***Interface Example.Demo-6***\"\
  );\n        System.out.println(\"***Use of default***\");\n        MyDefaultInterface\
  \ interfaceOb=new MyClass6();\n        interfaceOb.show();\n        interfaceOb.defaultMethod();\n\
  \    }\n}\n```\n\n输出：\n![](img/00029.jpeg)\n\n## 作业\n\n你有两个类——`A` 和 `B`。类 `A` 包含一个抽象方法\
  \ `showA()`。你还有一个名为 `Inter` 的接口。在 `Inter` 中，你有一个方法 `showInter()`。现在写一个简单的程序，让 `B`\
  \ 实现在 `A` 和 `Inter` 中定义的方法。\n\n# 包 (Package)\n\n考虑一个简单的场景。你可以在一个 Java 文件中使用两次相同的类名吗？不可以。编译器会抛错误并指向这个命名冲突。因此，每当我们定义类时，都需要选择唯一的命名规范。但我们必须记住，在现实世界的编程中，类名应该足够意义，因此同一个项目的不同程序员可能会为他们的类选择相同的名称。那么我们如何处理这些情况呢？`Package`（包）会在这些场景拯救我们。\n\
  \n我们可以将类/接口等封装在自己的包内部。包帮助我们避免命名冲突和/或控制可见性。我们可以这样控制包内部的可见性，使得我们的特定类可能可能暴露给外部（包括包内部和外部）。包以目录的形式体现。在\
  \ eclipse 中创建包非常简单。我们甚至不需要考虑 Java 运行时是如何找到内部适当的包或类的。否则，我们需要特别注意 `CLAS` 环境变量。\n\n\
  我们必须记住以下几点：\n1. `package` 语句应该位于源文件的顶部。如果我们不显式定义它，那么所有类/接口等将位于当前的默认包中。\n2. 当一个类引用同一个包内的另一个类时，需要包含\
  \ `package` 语句。否则，我们需要使用全限定名 `<packagename>.<classname>` 或使用 `import` 语句。\n3. 可以导入整个包：`import\
  \ <packagename>.*;`。或者如果我们只想从包导入某个特定的类，使用：`import <packagename>.<classname>`\n4.\
  \ 包的名称必须遵循目录结构。\n\n## 在 Eclipse 中创建包\n1. 点击 `File` -> `New` -> `Package` (images/0030.jpeg)\n\
  2. 提供所需信息并点击 finish (images/0031.jpeg)\n3. 现在你会在包资源管理器视图中看到该包，例如所示（images/0032.jpeg）[注意：在这里包中，有一些我们之前创建的包和类]。\n\
  4. 现在右键点击包名->`New`->`Class/Package` 等，将类/子包放入创建的包中。它可能有以下结构（images/0033.jpeg）[注意：在这里包中，有一些我们之前创建的类]。\n\
  \n## 实现\n现在让我们来看一个例子。考虑两家旅行公司——`a` 和 `b`。公司 `a` 经营果阿和喀拉拉的旅游。公司 `b` 经营果阿和安达曼旅游。任何游客都可以向他们咨询任何旅游套餐的信息。在这里涵盖了以下两种场景：\n\
  1. 挑战性较低：只有公司 `a` 经营喀拉拉旅游，只有公司 `b` 经营安达曼旅游。\n2. 更具挑战性：注意，两家公司都提供果阿的旅游。我们需要通过 `GoaPackage`\
  \ 类获取信息。[注意两个包都使用了相同的类名]\n\nEclipse Package View (images/0034.gif)\n\n```java\n\
