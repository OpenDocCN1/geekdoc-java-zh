  \ `abstract` 关键字标记，如下例所示。\n\n```java\nabstract class AbstractClass {\n    public\
  \ abstract void inCompleteMethod1();\n    public abstract void inCompleteMethod2();\n\
  }\n\nabstract class child1 extends AbstractClass {\n    @Override\n    public void\
