  2. 你必须记住下表所示的可见性控制机制：\n\n| | public | protected | private | Default/No modifier\
  \ |\n| :--- | :--- | :--- | :--- | :--- |\n| 同一类 | Yes | Yes | Yes | Yes |\n| 同包中的子类\
  \ | Yes | Yes | No | Yes |\n| 同包中的非子类 | Yes | Yes | No | Yes |\n| 不同包中的子类 | Yes\
  \ | Yes | No | No |\n| 不同包中的非子类 | Yes | No | No | No |\n\n# 复习 OOP 概念\n\n面向对象编程的核心特征如下：\n\
  1. 类和对象 (Class and Object)\n2. 多态 (Polymorphism)\n3. 抽象 (Abstraction)\n4. 封装 (Encapsulation)\n\
  5. 继承 (Inheritance)\n6. 消息传递 (Message passing)\n7. 动态绑定 (Dynamic binding)\n\n老师问：\n\
  你能告诉我们在 Java 中是如何实现这些内容的吗？\n1. 类和对象——几乎在每个例子中，我们使用了类和对象。\n2. 多态——方法重载和方法重写。\n3.\
  \ 抽象——抽象类和接口。\n4. 封装——每个类都可以是一个更有效的例子，例如一个具有私有成员以及 getter-setter 方法的类。\n5. 继承——继承的示例。\n\
  6. 消息传递——主要在多线程环境中观察到。但动态分发也可以被归为此类。\n7. 动态绑定——通过动态分发中的示例（方法重写）来实现。\n\n学生问：\n多态有哪些不同类型？\n\
  1. 编译时多态——调用哪个方法是由编译器解析的。因此，它也被称为早期绑定 (early binding)。由于调用在早期就解析了，通常速度更快。\n2. 运行时多态（或动态多态）——调用哪个方法将在运行时决定。这就是为什么它也被称为晚期绑定\
  \ (late binding)，与早期绑定相比，它较慢。\n\n学生问：\nJava 支持像 C/C++ 那样的指针吗？\n不支持。主要原因之一是我们可能会访问意图之外的数据，这是非常危险的。此外，如果我们支持指针，内存管理将变得繁琐，因为在很多情况下它们很容易出错。我们相信，只要我们处于\
  \ Java 执行环境中，就不会感觉到使用指针的需求。\n\n## static 关键字的使用\n\n有时我们需要一种在不创建该类的任何对象的情况下就可以使用的变量。为了实现这个目的，我们用\
  \ `static` 标记成员。当成员被标有 `static` 关键字时，在 true 类的任何对象创建之前就可以访问该成员，即在此语文中我们不需要引用任何对象。\n\
  \n考虑下面的示例：\n实现-1:\n```java\npackage javaclassnotes.programs;\nclass StaticDemo1\
  \ {\n    //static 成员\n    int myStaticInt=5;\n    static String myStaticString=\"\
  I am a string\";\n    //非静态成员\n    int myStaticInt=25;\n}\n\npublic class StaticEx1\
  \ {\n    public void main(String args[]) {\n        System.out.println(\"***Use\
  \ of static variables***\");\n        //我们可以通过类本身调用静态成员\n        //不需要创建对象\n   \
  \     System.out.println(\"myStaticInt is \"+myStaticInt);\n        System.out.println(\"\
  myStaticString is \"+myStaticString);\n        //错误：不能通过类名调用实例变量\n        //System.out.println(\"\
  myStaticInt is \"+myStaticInt);\n    }\n}\n```\n输出:\n![](img/00036.jpeg)\n分析：我们可以\
  \ `<classname>` 访问静态成员，即我们不需要创建对象。\n\n实现-2:\n让我们来看另一个例子。在这里我们将通过静态方法和静态块测试静态变量。\n\
  ```java\npackage javaclassnotes.programs;\nclass StaticEx2 {\n    //静态 成员\n    static\
  \ int myStaticInt=1;\n    static String myStaticString=\"No string\";\n    //实例变量\n\
  \    int nonStaticInt=25;\n    //静态方法\n    static void setValuesToStaticMembers()\
  \ {\n        System.out.println(\"I am inside the static method.\");\n        System.out.println(\"\
  myStaticInt=\"+ myStaticInt);\n        System.out.println(\"myStaticString=\"+ myStaticString);\n\
  \        //错误：在此处只能访问静态字段\n        //System.out.println(\"nonStaticInt=\"+ nonStaticInt);\n\
  \    }\n    //静态块\n    static {\n        System.out.println(\"I am a block\");\n\
  \        System.out.println(\"Before change :\");\n        System.out.println(\"\
  myStaticInt=\"+ myStaticInt);\n        System.out.println(\"myStaticString=\"+ myStaticString);\n\
  \        System.out.println(\"I am changing the values now...\");\n        myStaticInt=5;\n\
  \        myStaticString=\"I am a string\";\n    }\n}\n\npublic class StaticEx {\n\
  \    public static void main(String args[]) {\n        System.out.println(\"***Use\
  \ of static methods and static blocks***\");\n        StaticEx2.setValuesToStaticMembers();\n\
  \    }\n}\n```\n输出:\n![](img/00037.jpeg)\n分析：仔细观察输出。观察输出的顺序。你可以看到静态块中的语句在输出的最顶部。即使在执行静态块之前，静态变量已经初始化。随后静态块改变了值（当我们调用静态方法时，清楚地反映了这一点）。\n\
  \n这是因为一旦静态类被加载，所有的静态语句都会执行。\n\n\n\n\n\n你应该注意到另一个重要的特征：静态方法只能访问静态成员。\n\n同时请注意，我们的静态方法在这里是嵌套的。\n\
  \n## 经验法则\n\n1. 静态方法只能调用其他静态方法。\n2. 静态方法只能访问静态字段。\n3. 静态方法不能引用 `this` 或 `super`。\n\
  \n## 学生提问\n\n**我们可以创建静态类吗？**\n\n可以。但有一个限制条件。静态类必须在另一个类的内部，即它必须是嵌套的。Java 不允许我们创建顶层静态类。\n\
  \n包含静态类的类被称为 `outer class`（外部类）。\n\n考虑下面的示例。在这里我们展示了如何创建和使用嵌套静态类以及嵌套非静态类（`Inner\
  \ class` 内部类）。\n\n## Implementation-3:\n\n```java\npackage javaclassnotes.programs;\n\
  \n//Java 不允许我们创建顶层静态类，它必须是嵌套的\nclass OuterClass {\n    //静态类\n    static class MyStaticClass\
  \ {\n        public static void showStaticMethod() {\n            System.out.println(\"\
  I am a static method\");\n        }\n    }\n    //非静态类\n    class MyNonStaticClass\
  \ {\n        public void showStaticMethod() {\n            System.out.println(\"\
  I am NonStatic method\");\n        }\n    }\n}\n\nclass StaticClassEx {\n    public\
  \ static void main(String args[]) {\n        System.out.println(\"***Static and\
  \ Inner Class Demo***\");\n        //调用静态方法\n        OuterClass.MyStaticClass.showStaticMethod();\n\
  \        //调用非静态方法\n        OuterClass.MyNonStaticClass obNonStatic = new OuterClass().new\
  \ MyNonStaticClass();\n        obNonStatic.showStaticMethod();\n    }\n}\n```\n\n\
  输出:\n![](img/0038.jpeg)\n\n**什么是内部类？**\n\n如上所述，非静态嵌套类被称为 Inner class（内部类）。它可以访问外部类所有的变量和方法。\n\
  \n**从静态类，我们可以访问外部类的变量吗？**\n\n答案是肯定的，且仅当这些变量是静态的。考虑下面的示例。以下代码段是正确的：\n\n```java\n\
  class OuterClass {\n    static int outer_int=25;\n    //静态类\n    class MyStaticClass\
  \ {\n        public static void showStaticMethod() {\n            System.out.println(\"\
  I am a static method\");\n            System.out.println(\"Outer_int =\" + outer_int);\n\
  \        }\n    }\n}\n```\n但如果 `outer_int` 是非静态的，编译器将会报错。\n\n## 作业\n\n1. 假设你组建了一个板球球队。现在你的球队将与对手队进行比赛。你必须意识到一个事实：哪队先击球（或投球）将通过硬币决定决定，你需要派遣队长去参加。因此，首先，你必须选出一个队长。同时，你必须意识到你只能选择一个队长。所以，如果你还没有这样的队长，就选一个并派去掷硬币。否则，直接派已命名的队长去掷硬币。你能设计这个程序吗？\n\
  2. 创建一个 `Vehicle`（车辆）。该类应该拥有 `no_of_seats`（座位）和 `no_of_wheels`（轮子）字段。\n3. 为该类创建两个对象\
  \ `Motorcycle`（摩托车）和 `Car`（汽车）。你的输出应该显示 `Car` 和 `Motorcycle` 的描述。\n\nUml 类图:\n![](img/0039.jpeg)\n\
  \n实现:\n不需要包含包声明。一旦你理解了包的概念，我们就会发现为我们的程序建立有组织的结构是非常方便的。\n\n```java\npackage javaclassnotes.assignments;\n\
  \nclass MyVehicle {\n    int no_of_wheels;\n    int no_of_seats;\n\n    MyVehicle(int\
  \ wheels, int seats) {\n        no_of_wheels = wheels;\n        no_of_seats = seats;\n\
  \    }\n\n    void showVehicle() {\n        System.out.println(\"It has \" + no_of_wheels\
  \ + \" wheels and \" + no_of_seats + \" seats\");\n    }\n}\n\nclass Assignment_1\
  \ {\n    public static void main(String args[]) {\n        System.out.println(\"\
  Car Description:\");\n        MyVehicle car = new MyVehicle(4, 5);\n        car.showVehicle();\n\
  \        System.out.println(\"Motorcycle Description:\");\n        MyVehicle motorCycle\
  \ = new MyVehicle(2, 2);\n        motorCycle.showVehicle();\n    }\n}\n```\n\n\n\
  \n\n注意输出。每当我们想要初始化子类对象时，父类的构造函数会先被调用。这就是为什么子类构造函数会先调用父类构造函数。同样，我们的 `GrandChild`\
  \ 类构造函数会先调用它的父类（即 `Child` 类构造函数），而它又会先调用它的父类（即 `Parent` 类构造函数）。\n\n## static 关键字的使用\n\
  \n1. 假设你组建了一支板球队。现在你的球队要与对手球队比赛。你必须意识到一个事实：哪队先击球（或投球）将通过硬币决定，你需要派队长去掷硬币。所以，首先，你必须选出一个队长。同时，你必须意识到你只能选择一个队长。所以，如果你还没有这样的队长，你将选择一个并派他去硬币；否则，你只需派已经提名的队长去硬币即可。你能设计这个吗？\n\
  \n## Uml 类图：\n\n![](img/00045.jpeg)\n\n## 实现：\n\n```java\npackage javaclassnotes.assignments;\n\
  \nclass NominateACaptain\n{\n    private static NominateACaptain _captain;\n\n \
  \   // 我们将构造函数设为私有以防止使用 \"new\"\n    private NominateACaptain() { }\n\n    // public\
  \ static synchronized MakeACaptain getCaptain()\n    public static NominateACaptain\
  \ getCaptain()\n    {\n        // 懒加载初始化\n        if (_captain == null)\n      \
  \  {\n            _captain = new NominateACaptain();\n            System.out.println(\"\
  我们已经为球队选好了队长\");\n        }\n        else\n        {\n            System.out.print(\"\
  \ 我们已经有一个队长了。\");\n            System.out.println(\" 我们去掷硬币。\");\n        }\n  \
  \      return _captain;\n    }\n}\n\nclass StaticAssignmentDemo\n{\n    public static\
  \ void main(String[] args)\n    {\n        System.out.println(\"***Static Assignment\
  \ Demo***\\n\");\n        System.out.println(\"尝试为我们的球队选一个队长\");\n        NominateACaptain\
  \ c1 = NominateACaptain.getCaptain();\n        System.out.println(\"尝试为我们的球队选另一个队长\"\
  );\n        NominateACaptain c2 = NominateACaptain.getCaptain();\n        if (c1\
  \ == c2)\n        {\n            System.out.println(\"队长们是同一个.\");\n        }\n\
  \    }\n}\n```\n\n## 输出：\n\n```\n***Static Assignment Demo***\n\nTrying to make\
  \ a captain for our team\nWe have selected the captain for our team\nTrying to make\
  \ another captain for our team\nWe already have a Captain. We'll send for the toss.\n\
  The captains are the same.\n```\n\n## FAQ\n\n1. 什么是类（class）？\n2. 什么是对象（object）？\n\
