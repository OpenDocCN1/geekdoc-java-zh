    \ System.out.println(\"***The use of super Demo-2***\");\n\nB3 obB3=new B3();\n\
    \n obB3.display();\n\n              }\n\n}\n\nOutput:\n\n![](images/00016.jpeg)\n\
    \nNote:\n\nStudents ask:\n\nCan we use super keyword to call methods that are\
    \ hidden by a subclass?\n\nYes.\n\n# Overloading\n\nTeacher asks:\n\nConsider\
    \ the below program segments. Do you notice any specific pattern?\n\nint sum(int\
    \  x,int  y)\n\n              {\n\n return  x+y;\n\n              }\n\n double\
    \ sum(double  x,double  y)\n\n              {\n\n return  x+y;\n\n             \
    \ }\n\nString sum(String s1,String s2)\n\n              {\n\n return  s1.concat(s2);\n\
    \n              }\n\nStudents respond:\n\nYes sir. We are seeing all of the methods\
    \ have the same name “sum” but from their method bodies it appears that each method\
    \ is doing different things.\n\nTeacher says: yes. You are correct. When we do\
    \ this kind of coding, we term it as method overloading. But you should notice\
    \ that though method names are same but method signatures are different here.\n\
    \nStudents ask:\n\nWhat is method signature?\n\nIdeally method name with number\
    \ and types of the parameters consist the method signature. Java compiler can\
    \ distinguish among methods with same name but different parameter list. So, for\
    \ Java compiler, double sum(double  x, double  y) is different from int sum(int\
    \  x, int  y).\n\nConsider the below program. Here we represent method overloading\
    \ with the following example:\n\npackage javaclassnotes.programs;\n\nclass Addition\n\
    \n{\n\n int sum(int  x,int  y)\n\n              {\n\n return  x+y;\n\n             \
    \ }\n\n double sum(double  x,double  y)\n\n              {\n\n return  x+y;\n\n\
                  }\n\nString sum(String s1,String s2)\n\n              {\n\n return\
    \  s1.concat(s2);\n\n              }\n\n}\n\npublic  class OverloadingEx\n\n{\n\
    \n public  static  void main(String args[])\n\n              {\n\n             \
    \               System.out.println(\"***Method Overloading Demo***\");\n\nAddition\
    \ additionOb=new Addition();\n\n int  sumOfIntergers=additionOb.sum(10,20);\n\n\
                                System.out.println(\"Sum of 10 and 20 is :\"+sumOfIntergers);\n\
    \n double  sumOfDoubles=additionOb.sum(10.5,20.7);\n\n                           \
    \ System.out.println(\"Sum of 10.5 and 20.7 is :\"+sumOfDoubles);\n\nString sumOfStrings=additionOb.sum(\"\
    Amit\",\"Kumar\");\n\n                            System.out.println(\"Concatenation\
    \ of Amit and Kumar is :\"+sumOfStrings);\n\n              }\n\n}\n\nOutput:\n\
    \n![](images/00017.jpeg)\n\nTeacher asks:\n\nIs it an example of method overloading?\n\
    \nint sum(int  x,int  y)\n\n              {\n\n return  x+y;\n\n             \
    \ }\n\nint sum(int  x,int  y,int z)\n\n              {\n\n return  x+y+z;\n\n\
                  }\n\nAnswer: Yes.\n\nTeacher asks:\n\nIs it an example of method\
    \ overloading?\n\nint sum(int  x,int  y)\n\n              {\n\n return  x+y;\n\
    \n              }\n\ndouble sum(int  x,int  y)\n\n              {\n\n return \
    \ x+y;\n\n              }\n\nAnswer: No. Compiler will not consider “return type”\
    \ to differentiate these methods. Return type is not considered as a part of method\
    \ signature.\n\nStudents ask:\n\nSir, can we have constructor overloading?\n\n\
    Definitely. You can write a similar program for constructor overloading.\n\npackage\
    \ javaclassnotes.testprograms;\n\nclass A1\n\n{\n\n              A1()\n\n             \
    \ {\n\n                            System.out.println(\"Constructor with no argument\"\
    );\n\n              }\n\n              A1(int  a)\n\n              {\n\n             \
    \               System.out.println(\"Constructor with one integer argument\");\n\
    \n              }\n\n              A1(int  a,double  b)\n\n              {\n\n\
                                System.out.println(\"Constructor with one integer\
    \ argument and one double argument\");\n\n              }\n\n}\n\nclass Test1\n\
    \n{\n\n public  static  void main(String args[])\n\n              {\n\n             \
    \               System.out.println(\"***Constructor Overloading Demo***\");\n\n\
    A1 ob1=new A1();\n\nA1 ob2=new A1(2);\n\nA1 ob3=new A1(2,3.7);\n\n             \
    \ }\n\n}\n\nOutput:\n\n![](images/00018.jpeg)\n\nStudents ask:\n\nSir, it appears\
    \ to me that it is also method overloading. What is the difference between a constructor\
    \ and a method?\n\nNotice carefully. A constructor has the same name as class\
    \ and also it has no return type. So, you can consider a constructor as a special\
    \ kind of method which has the same name as class and no return type. But there\
    \ are many other difference: the main focus of a constructor is to initialize\
    \ objects. They cannot be called directly.\n\nStudents ask:\n\nSo Sir, can we\
    \ write code like this?\n\nclass A1\n\n{\n\n              //It is a constructor.\
    \ It has no return type.\n\n           A1()\n\n              {\n\n             \
    \               System.out.println(\"Constructor with no argument\");\n\n             \
    \ }\n\n            //It is a method. It has return types.\n\n void  A1()\n\n             \
    \ {\n\n                            System.out.println(\"I am a method\");\n\n\
                  }\n\n}\n\nSure. Now, the following lines inside main function\n\n\
    \ A1 ob1=new A1();\n\n ob1.A1(5);             \n\ncan create output like this:\n\
    \n![](images/00019.jpeg)\n\n# Overriding\n\nSometimes we want to redefine or modify\
    \ the behavior of our parent class. Method overriding comes into picture in such\
    \ a scenario. Consider the below program. Note that, here showMe() method has\
    \ the same signature in both the parent class and its child class.\n\npackage\
    \ javaclassnotes.programs;\n\nclass ParentClass\n\n{\n\n public  void showMe()\n\
    \n              {\n\n                            System.out.println(\"I am in\
    \ Parent class\");\n\n              }\n\n}\n\nclass ChildClass extends ParentClass\n\
    \n{\n\n public  void showMe()\n\n              {\n\n                           \
    \ System.out.println(\"I am in Child class\");\n\n              }\n\n}\n\nclass\
    \ OverridingEx\n\n{\n\n public  static  void main(String args[])\n\n             \
    \ {\n\n                            System.out.println(\"***Method Overriding Demo***\"\
    );\n\nChildClass childOb=new ChildClass();\n\n childOb.showMe();\n\n             \
    \ }\n\n}\n\nOutput:\n\n![](images/00020.jpeg)"
