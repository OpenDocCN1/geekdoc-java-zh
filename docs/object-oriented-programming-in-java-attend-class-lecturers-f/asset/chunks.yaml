    Constructor with no argument\");\n    }\n    // It is a method. It has return\
    \ types.\n    void A1() {\n        System.out.println(\"I am a method\");\n  \
    \  }\n}\n```\n\nTeacher: Sure. Now, the following lines inside main function `A1\
    \ ob1=new A1(); ob1.A1(5);` can create output like this: ![](images/0019.jpeg)\n\
    \n# Overriding\n\nSometimes we want to redefine or modify the behavior of our\
    \ parent class. Method overriding comes into picture in such a scenario. Consider\
