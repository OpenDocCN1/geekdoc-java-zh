    \nStudents ask: Sir, it appears to me that it is method overloading. What is the\
    \ difference between a constructor and a method?\n\nTeacher: Notice carefully.\
    \ A constructor has the same name as class and also has no return type. So, you\
    \ can consider a constructor as special kind of method which has same name as\
    \ class and no return type. But there are many other difference: main focus of\
    \ constructor is to initialize objects. They cannot be called directly.\n\nStudents\
