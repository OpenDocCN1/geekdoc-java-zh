    \n}\n\nStudents ask:\n\nA concrete class is a class which is not abstract-is the\
    \ understanding correct?\n\nYes.\n\nStudents ask:\n\nCan we tag a method with\
    \ both abstract and final?\n\nNo. Just think, by declaring abstract, you want\
    \ overriding and by declaring final, you want to prevent overriding.\n\nStudents\
    \ ask:\n\nCan we have constructor overriding in Java?\n\nNo.\n\n# Interface\n\n\
    With the interface, we declare what we are going to implement but we are not specifying\
    \ how we are going to that. These are similar to classes but with no instance\
    \ variables and all of their methods are declared without a body (i.e. methods\
    \ are actually abstract).\n\nWe can support dynamic method resolution during run\
    \ time with the help of interfaces. Once defined, a class can implement any number\
    \ of interfaces.\n\nImplementation-1:\n\npackage javaclassnotes.programs;\n\n\
    interface MyInterface\n\n{\n\n void show();\n\n}\n\nclass MyClass implements MyInterface\n\
    \n{\n\n @Override\n\n public  void show()\n\n              {\n\n             \
    \               System.out.println(\"MyClass is implementing the Interface method.\"\
    );                           \n\n              }\n\n}\n\npublic  class InterfaceEx1\n\
    \n{\n\n public  static  void main(String args[])\n\n              {\n\n             \
    \               System.out.println(\"***Interface Example.Demo-1***\");\n\nMyClass\
    \ myClassOb=new MyClass();\n\n myClassOb.show();\n\n              }\n\n}\n\nOutput:\n\
    \n![](images/00025.jpeg)\n\nImplementation-2:\n\nInterface has two methods. But\
    \ a class is implementing only one. Then the class itself becomes abstract.\n\n\
    package javaclassnotes.programs;\n\ninterface MyInterface2\n\n{\n\n void show1();\n\
    \n void show2();\n\n}\n\nabstract  class MyClass2 implements MyInterface2\n\n\
    {\n\n @Override\n\n public  void show1()\n\n              {\n\n                           \
    \ System.out.println(\"MyClass2 is implementing the show1() method.\");             \
    \              \n\n              }\n\n}\n\nNote: So the formula is: A class needs\
    \ to implement all the methods defined in the interface. Otherwise, it will be\
    \ an abstract class.\n\nImplementation-3:\n\nA class is implementing multiple\
    \ interfaces.\n\npackage javaclassnotes.programs;\n\ninterface MyInterface3A\n\
    \n{\n\n void show3A();\n\n}\n\ninterface MyInterface3B\n\n{\n\n void show3B();\n\
    \n}\n\nclass MyClass3 implements MyInterface3A,MyInterface3B\n\n{\n\n @Override\n\
    \n public  void show3A()\n\n              {\n\n                            System.out.println(\"\
    MyClass3 is implementing the show3A() method of Interface3A\");                           \n\
    \n              }\n\n @Override\n\n public  void show3B() {\n\n                           \
    \ System.out.println(\"MyClass3 is implementing the show3B() method of Interface3B\"\
    );             \n\n              }\n\n}\n\npublic  class InterfaceEx3 {\n\n public\
    \  static  void main(String args[])\n\n              {\n\n                           \
    \ System.out.println(\"***Interface Example.Demo-3***\");\n\nMyClass3 myClassOb=new\
    \ MyClass3();\n\n myClassOb.show3A();\n\n myClassOb.show3B();\n\n             \
    \ }\n\n}\n\nOutput:\n\n![](images/00026.jpeg)\n\nStudents Ask:\n\nIn the above\
    \ program, method names were different in interfaces. But if both of the interfaces\
    \ contain the same method name, can we implement them?\n\nGo through the following\
    \ implementation.\n\nImplementation-4:\n\npackage javaclassnotes.programs;\n\n\
    //Both of the interface have the same method name \"show()\".\n\ninterface MyInterface4A\n\
    \n{\n\n void show();\n\n}\n\ninterface MyInterface4B\n\n{\n\n void show();\n\n\
    }\n\nclass MyClass4 implements MyInterface4A,MyInterface4B\n\n{\n\n @Override\n\
    \n public  void show()\n\n              {\n\n                            System.out.println(\"\
    MyClass4 is implementing the show() method \");                           \n\n\
                  }\n\n}\n\npublic  class InterfaceEx4 {\n\n public  static  void\
    \ main(String args[])\n\n              {\n\n                            System.out.println(\"\
    ***Interface Example.Demo-4***\");\n\n //All the 3 callings are legal.\n\nMyClass4\
    \ myClassOb=new MyClass4();\n\n myClassOb.show();\n\nMyInterface4A inter4A=myClassOb;\n\
    \n inter4A.show();\n\nMyInterface4B inter4B=myClassOb;\n\n inter4B.show();             \n\
    \n              }\n\n}\n\nOutput:\n\n![](images/00027.jpeg)\n\nStudents ask:\n\
    \nCan an interface extend/implement another interface?\n\nIt can extend but not\
    \ implement (by definition).\n\nImplementation-5:\n\npackage javaclassnotes.programs;\n\
    \ninterface Interface1\n\n{\n\n void showInterface1Method();\n\n}\n\ninterface\
    \ Interface2\n\n{\n\n void showInterface2Method();\n\n}\n\n//Interface extending\
    \ another interfaces\n\ninterface Interface3 extends Interface1,Interface2\n\n\
    {\n\n void showInterface3Method();\n\n}\n\nclass MyClass5 implements Interface3\n\
    \n{\n\n //Now MyClass5 needs to implement methods from Interface1,Interface2 and\
    \ Interface3\n\n @Override\n\n public  void showInterface1Method() {\n\n             \
    \               System.out.println(\"MyClass5 is implementing the showInterface1()\
    \ method \");             \n\n              }\n\n @Override\n\n public  void showInterface2Method()\
    \ {\n\n                            System.out.println(\"MyClass5 is implementing\
    \ the showInterface2() method \");                           \n\n             \
    \ }\n\n @Override\n\n public  void showInterface3Method() {\n\n                           \
    \ System.out.println(\"MyClass5 is implementing the showInterface3() method \"\
    );                           \n\n              }             \n\n}\n\npublic \
    \ class InterfaceEx5 {\n\n public  static  void main(String args[])\n\n             \
    \ {\n\n                            System.out.println(\"***Interface Example.Demo-5***\"\
    );\n\n                            System.out.println(\"***Interface  can extend\
    \ interfaces***\");                           \n\nMyClass5 myClassOb=new MyClass5();\n\
    \n myClassOb.showInterface1Method();                           \n\n myClassOb.showInterface2Method();\n\
    \n myClassOb.showInterface3Method();                           \n\n             \
    \ }\n\n}\n\nOutput:\n\n![](images/00028.jpeg)\n\nTag/Tagging interface:\n\nAn\
    \ interface which is empty is termed as a tag/tagging interface.\n\n//tagging\
    \ interface\n\ninterface ITaggingInterface\n\n{\n\n}\n\nTeacher asks:\n\nCan you\
    \ tell me: Why we need a tagging interface?\n\n1\\. We can create a common parent.\n\
    \n2\\. A class can claim membership in the set e.g. if our class implements the\
    \ Serializable interface, it becomes serializable. So, our class actually becomes\
    \ an interface type through polymorphism. Even a class that is implementing a\
    \ tagging interface, need not define any new method because the interface itself\
    \ does not have any such method.\n\nTeacher asks:\n\nCan you tell me: What is\
    \ the difference between an abstract class and an Interface?"
