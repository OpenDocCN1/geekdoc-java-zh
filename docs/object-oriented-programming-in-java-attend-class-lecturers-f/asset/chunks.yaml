    \ javaclassnotes.programs;\n\n//Java doesn't allow us to create top-level static\
    \ classes,it must be  nested.\n\nclass OuterClass\n\n{\n\n //static class\n\n\
    \ static  class MyStaticClass\n\n              {\n\n public  static  void showStaticMethod()\n\
    \n                            {\n\n                                          System.out.println(\"\
    I am a static method\");\n\n                            }                           \n\
    \n              }\n\n //non static inner class\n\n public  class MyNonStaticClass\n\
    \n              {\n\n public  void showNonStaticMethod()\n\n                           \
    \ {\n\n                                          System.out.println(\"I am a NonStatic\
    \ method\");\n\n                            }\n\n              }\n\n}\n\nclass\
    \ StaticClassEx\n\n{\n\n public  static  void main(String args[])\n\n             \
    \ {\n\n                            System.out.println(\"***Static and Inner Class\
    \ Demo***\");\n\n //Call Static method                            OuterClass.MyStaticClass.showStaticMethod();\n\
    \n //CallNonStatic method\n\nOuterClass.MyNonStaticClass obNonStatic=(new OuterClass()).new\
    \ MyNonStaticClass();\n\n obNonStatic.showNonStaticMethod();     \n\n             \
    \ }\n\n}\n\nOutput:\n\n![](images/00038.jpeg)\n\nStudents ask:\n\nWhat is an inner\
    \ class?\n\nAs described above, a non-static nested class is termed as an Inner\
    \ class. It can access all the variables and methods of the outer class.\n\nStudents\
    \ ask:\n\nFrom static class, can we access the variables of Outer class?\n\nAnswer\
    \ is yes if and only if those variables are static. Consider the below example.\
    \ Following code snippet is fine:\n\nclass OuterClass\n\n{\n\n static  int  outer_int=25;\n\
    \n //static class\n\n static  class MyStaticClass\n\n              {\n\n public\
    \  static  void showStaticMethod()\n\n                            {\n\n             \
    \                             System.out.println(\"I am a static method\");\n\n\
                                              System.out.println(\"Outer_int =\" +outer_int);\n\
    \n                            }                           \n\n              }\n\
    \n}\n\nBut if outer_int is non-static, compiler will raise an issue.\n\nAssignment:\n\
    \n1\\. Suppose you have formed a cricket team. Now your team is going to play\
    \ against an opponent team. You must be aware of the fact that which team will\
    \ bat (or bowl) first will be decided through the toss and you need to send your\
    \ captain for that. So, at first, you must elect a captain. At the same time,\
    \ you must be aware that you can select one and only one captain. So, if you do\
    \ not have any such captain, you will select one and send him for toss. Otherwise,\
    \ you simply send the already nominated captain for the toss. Can you design this?\n\
    \n# Solution to the Assignments\n\nClass\n\n1\\. Create a class Vehicle. The class\
    \ should have two fields-no_of_seats and no_of_wheels. Create two objects-Motorcycle\
    \ and Car for this class. Your output should show the descriptions for Car and\
    \ Motorcycle.\n\nUml Class Diagram:\n\n![](images/00039.jpeg)\n\nImplementation:\n\
    \n[No need to include package statements. But once you understand the concept\
    \ of package, we’ll see that it is very much handy to make an organized structure\
    \ for our programs.]\n\npackage javaclassnotes.assignments;\n\nclass MyVehicle\n\
    \n{\n\n int  no_of_wheels;\n\n int  no_of_seats;\n\n              MyVehicle(int\
    \  wheels,int  seats)\n\n              {\n\n no_of_wheels=wheels;\n\n no_of_seats=seats;\n\
    \n              }\n\n public  void showVehicle()\n\n              {\n\n             \
    \               System.out.print(\"Description:\");\n\n                           \
    \ System.out.println(\"\\n*************\");\n\n                            System.out.println(\"\
    It has \"+ no_of_wheels+\" wheels\");\n\n                            System.out.println(\"\
    It has \"+ no_of_seats+\" seats\\n\");\n\n              }             \n\n}\n\n\
    class ClassAssignment_1_Demo\n\n{\n\n public  static  void main(String args[])\n\
    \n              {\n\n                            System.out.print(\"***Assignment\
    \ on Class***\\n\\n \");\n\nMyVehicle car=new MyVehicle(4,4);\n\nMyVehicle motorCycle=new\
    \ MyVehicle(2,0);\n\n                            System.out.print(\"Car \");\n\
    \n car.showVehicle();\n\n                            System.out.print(\"Motorcycle\
    \ \");\n\n motorCycle.showVehicle();\n\n              }\n\n}\n\nOutput:\n\n![](images/00040.jpeg)\n\
    \nInheritance\n\n1\\. Write a Simple Program to implement Hierarchical Inheritance.\n\
    \nUml Class Diagram:\n\n![](images/00041.jpeg)\n\nImplementation:\n\npackage javaclassnotes.assignments;\n\
    \nclass Vehicle\n\n{\n\n public  void showVehicle()\n\n              {\n\n             \
    \               System.out.println(\"I am in Vehicle\");\n\n              }             \n\
    \n}\n\nclass Car extends Vehicle\n\n{\n\n public  void showVehicle()\n\n             \
    \ {\n\n                            System.out.println(\"I am in Car\");\n\n             \
    \ }             \n\n}\n\nclass Motorcycle extends Vehicle\n\n{\n\n public  void\
    \ showVehicle()\n\n              {\n\n                            System.out.println(\"\
    I am in Motorcycle\");\n\n              }             \n\n}\n\nclass HierarchicalInheritanceEx\n\
    \n{\n\n public  static  void main(String args[])\n\n              {\n\n             \
    \               System.out.println(\"***Hierarchical Inheritance Demo***\");             \
    \              \n\nCar c=new Car();\n\n c.showVehicle();\n\nMotorcycle m=new Motorcycle();\n\
    \n m.showVehicle();\n\n              }\n\n}\n\nOutput:\n\n![](images/00042.jpeg)\n\
    \n2\\. Write a Simple Program to implement Multilevel Inheritance.\n\nWe could\
    \ write the program like the above program (See our code structure in the chapter\
    \ on Inheritance).Just for a variety, we are using only constructors here. If\
    \ you want to see the concrete methods implementation, just uncomment the codes\
    \ in the below program.\n\nUml Class Diagram:\n\n![](images/00043.jpeg)\n\nImplementation:\n\
    \npackage javaclassnotes.assignments;\n\nclass Parent\n\n{\n\n public Parent()\n\
    \n              {\n\n                            System.out.println(\"I am in\
    \ Parent constructor\");             \n\n              }\n\n /*public void showMe()\n\
    \n              {\n\n                            System.out.println(\"I am a Parent\"\
    );\n\n              }              */\n\n}\n\nclass Child extends Parent\n\n{\n\
    \n public Child()\n\n              {\n\n                            System.out.println(\"\
    I am in Child constructor\");             \n\n              }\n\n /*public void\
    \ showMe()\n\n              {\n\n                            System.out.println(\"\
    I am a Child\");\n\n              }              */\n\n}\n\nclass GrandChild extends\
    \ Child\n\n{\n\n public GrandChild()\n\n              {\n\n                           \
    \ System.out.println(\"I am in GrandChild constructor\");             \n\n             \
    \ }\n\n /*public void showMe()\n\n              {\n\n                           \
    \ System.out.println(\"I am a GrandChild\");\n\n              }*/             \n\
    \n}\n\nclass MultilevelInheritanceEx\n\n{\n\n public  static  void main(String\
    \ args[])\n\n              {\n\n                            System.out.println(\"\
    ***Multilevel Inheritance Demo***\");\n\n //Parent p=new Parent();\n\n //p.showMe();\n\
    \n                            Child c=new Child();\n\n //c.showMe();\n\nGrandChild\
    \ g=new GrandChild();\n\n //g.showMe();\n\n              }\n\n}\n\nOutput:\n\n\
    ![](images/00044.jpeg)"
