  trans: "\n\n# 动态方法分派\n\n这是 Java 中一个极其重要的概念。Java 可以通过这种技术实现运行时多态。这种技术被认为实现了运行时多态，是因为对重写方法的调用是在运行时动态解析的。Java\
    \ 将根据我们所引用的对象调用相应的方法。\n\n```java\npackage javaclassnotes.programs;\n\nclass MyParentClass\n\
    {\n    public void showMe() {\n        System.out.println(\"I am in Parent class\"\
    );\n    }\n}\n\nclass MyChildClass extends MyParentClass\n{\n    public void showMe()\
    \ {\n        System.out.println(\"I am in Child class\");\n    }\n}\n\nclass DynamicMethodDispatchEx\n\
    {\n    public static void main(String args[]) {\n        System.out.println(\"\
    ***Dynamic Method Dispatch Demo***\");\n        MyParentClass parent=new MyParentClass();\n\
    \        parent.showMe();\n        MyChildClass childOb=new MyChildClass();\n\
    \        /*父类引用指向子对象*/\n        parent=childOb;\n        childOb.showMe();\n \
    \   }\n}\n```\n\n输出:\n![](img/00021.jpeg)\n\n### 记忆点\n- 通过父类引用，我们可以引用子类对象，但反之则不可行。\n\
    - 因此，`MyParentClass parent=new MyChildClass();` 是可以，但 `MyChildClass child=new\
    \ MyParentClass();` 将抛出错误。\n\n### 老师提问\n现在可能在某些情况下我们希望进行限制：父类中的方法不应被其子类重写。我们如何实现这一点？\n\
    \n在很多面试中，你可能会遇到这个问题。我们必须记住，可以通过 `static`、`private` 或 `final` 关键字来防止重写。但在这里我们只讨论\
    \ `final` 的使用。这非常有帮助，因为编译器本身将阻止重写过程。\n\n```java\nclass ParentClass\n{\n    //\
    \ 使用 final 防止重写\n    final public void showMe() {\n        System.out.println(\"\
    I am in Parent class\");\n    }        \n}\n\nclass ChildClass extends ParentClass\n\
    {\n    // 现在不能重写了：这是被允许的\n    public void showMe() {\n        System.out.println(\"\
    I am in Child class\");\n    }\n}\n```\n所以，使用上述代码，编译器将抛出错误。\n\n# 抽象类\n\n这些是不完整的类，我们无法从这种类实例化对象。\n\
    \n通常，如果一个类包含至少一个不完整/抽象的方法，那么该类本身就是一个抽象类。通过“抽象方法”这个术语——我们的意思是方法有声明（或签名）但没有实现。\n\
    \n当超类可以定义一种通用形式（将由其子类共享）并将填充细节的责任交给其子类时，这种技术就非常有用。\n\n一个简单的抽象类演示：\n\n### 实现-1\n\
    ```java\npackage javaclassnotes.programs;\n\nabstract class MyAbstractClass\n\
    {\n    public abstract void showMe();\n}\n\nclass MyConcreteClass extends MyAbstractClass\n\
    {\n    @Override\n    public void showMe() {\n        System.out.println(\"I am\
    \ from concrete class:\");\n        System.out.println(\"I am supplying the method\
    \ for showMe()\");\n    }\n}\n\nclass AbstractClassEx\n{\n    static void main(String\
    \ Args[]) {\n        System.out.println(\"***Abstract class Demo***\");\n    \
    \    // 非法：无法实例化\n        MyAbstractClass abstractOb=new MyAbstractClass();\n\
    \        ConcreteClass concreteOb=new MyConcreteClass();\n        concreteOb.showMe();\n\
    \    }\n}\n```\n输出:\n![](img/00022.jpeg)\n\n抽象类可以包含具体的方法。子类可能会也可能重写这些方法。\n\n###\
    \ 实现-2\n```java\npackage javaclassnotes.programs;\n\nabstract class AbstractClass\n\
    {\n    public abstract void showMe();\n    public void completeMethod1() {\n \
    \       System.out.println(\" Originally,I am from completeMethod1 in AbstractClass.But,I\
    \ am complete.\");\n    }\n    public void completeMethod2() {\n        System.out.println(\"\
    \ Originally,I am from completeMethod2 in AbstractClass.But,I am also complete.\"\
    );\n    }\n}\n\nclass ConcreteClass extends AbstractClass\n{\n    @Override\n\
    \    public void showMe() {\n        System.out.println(\"I am from concrete class:\"\
    );\n        System.out.println(\"I am supplying the method body for showMe()\"\
    );\n    }\n    // 它想要重写 AbstractClass 中的 completeMethod1()\n    public void completeMethod1()\
    \ {\n        System.out.println(\"I am overriding completeMethod1 of AbstractClass.\"\
    );\n    }\n}\n\nclass AbstractClassEx2\n{\n    static void main(String Args[])\
    \ {\n        System.out.println(\"***Abstract class Demo2***\");\n        ConcreteClass\
    \ concreteOb=new ConcreteClass();\n        concreteOb.showMe(); // 它将显示 completeMethod1\
    \ 在 ConcreteClass 中被重定义\n        concreteOb.completeMethod1(); // 它将显示 AbstractClass\
    \ 中定义的方法细节\n        concreteOb.completeMethod2(); // 后续声明将是好的\n        AbstractClass\
    \ abstractRef=new ConcreteClass();\n        abstractRef.completeMethod1();\n \
    \   }\n}\n```\n输出:\n![](img/00023.jpeg)\n\n我们在这里可以实现动态分派的概念吗？可以。以下声明将完全没问题并调用\
    \ `ConcreteClass` 的 `CompleteMethod1`。`AbstractClass abstractRef=new ConcreteClass();\
    \ abstractRef.completeMethod1();`\n\n### 学生提问\n- 抽象类可以包含字段吗？可以。接下来的示例将演示我们如何在这里使用动态分派的概念。此外，程序将显示抽象类包含字段。\n\
    \n### 实现-3\n```java\npackage javaclassnotes.programs;\n\nabstract class AbstractClass3\n\
    {\n    int myInt=5;\n    abstract void showMe();\n    public void completeMethod1()\
    \ {\n        System.out.println(\"I am originally from completeMethod1 in AbstractClass.But,I\
    \ am complete.\");\n    }\n}\n\nclass ConcreteClass3 extends AbstractClass3\n\
    {\n    @Override\n    public void showMe() {\n        System.out.println(\"I am\
    \ from concrete class:\");\n        System.out.println(\"I am supplying the method\
    \ body for showMe()\");\n    }\n}\n\nclass AbstractClassEx3\n{\n    static void\
    \ main(String Args[]) {\n        System.out.println(\"***Abstract class Demo3***\"\
    );\n        AbstractClass3 abstractRef=new ConcreteClass3();\n        abstractRef.completeMethod1();\n\
    \        System.out.println(\"myInt in AbstractClass3=\"+abstractRef.myInt);\n\
    \    }\n}\n```\n输出:\n![](img/00024.jpeg)\n\n- 假设一个类中有多个方法，其中只有一个是抽象方法。我们仍然需要将该类标记为抽象类吗？\n\
    是的。如果一个类包含至少一个抽象方法，该类本身就是抽象类。你可以从通的角度来看——`abstract` 关键字被用来表示不完整性。因此，如果你的类包含一个不完整的方法，你的类本身就是不完整的，因此需要用\
    \ `abstract` 关键字标记。\n所以，简单的公式是：只要你的类至少有一个抽象方法，你的类本身就是一个抽象类。\n\n### 老师提问\n现在考虑一种相反的情况。假设你将你的类标记为抽象类，但它其中没有抽象方法，如下所示：\n\
    \n```java\nabstract class AbstractClass\n{\n    public void completeMethod1()\
    \ {\n        System.out.println(\"A complete method\");\n    }\n}\n```\n\n"
- fmt: "\n```java\n    }\n\n    public void completeMethod2() {\n        System.out.println(\"\
    Another complete method.\");\n    }\n}\n```\n\nCan we compile the program?\n\n\
    Yes. Still it will compile but till this point, you cannot create object for this\
    \ class.\n\n**Students ask:**\n\nSo sir, how you can create object from an abstract\
    \ class?\n\nWe mentioned already that we cannot create objects from an abstract\
    \ class.\n\n**Students ask:**\n\nSir, it appears to me that an abstract class\
    \ has virtually no use if it is not extended. Is the understanding correct?\n\n\
    Yes.\n\n**Students ask:**\n\nIf a class extends an abstract class, it has to implement\
    \ all the abstract methods?\n\nIt may or may not implement all the abstract methods\
    \ in the parent class. The simple formula is that if you want to create objects\
    \ of a class, the class needs to be complete i.e. it should not contain any abstract\
    \ methods. So, if the child class cannot provide implementation (i.e. body) of\
    \ all the abstract methods, it should be marked again with the keyword `abstract`\
    \ like the below example.\n\n```java\nabstract class AbstractClass {\n    public\
    \ abstract void inCompleteMethod1();\n    public abstract void inCompleteMethod2();\n\
    }\n\nabstract class child1 extends AbstractClass {\n    @Override\n    public\
    \ void inCompleteMethod1() {\n        System.out.println(\"Implementing the inCompleteMethod1()\"\
    );\n    }\n}\n```\n\n**Students ask:**\n\nA concrete class is a class which is\
    \ not abstract-is the understanding correct?\n\nYes.\n\n**Students ask:**\n\n\
    Can we tag a method with both `abstract` and `final`?\n\nNo. Just think, by declaring\
    \ `abstract`, you want overriding and by declaring `final`, you want to prevent\
    \ overriding.\n\n**Students ask:**\n\nCan we have constructor overriding in Java?\n\
    \nNo.\n\n# Interface\n\nWith the interface, we declare what we are going to implement\
    \ but we are not specifying how we are going to that. These are similar to classes\
    \ but with no instance variables and all of their methods are declared without\
    \ a body (i.e. methods are actually abstract).\n\nWe can support dynamic method\
    \ resolution during run time with the help of interfaces. Once defined, a class\
    \ can implement any number of interfaces.\n\n### Implementation-1:\n\n```java\n\
    package javaclassnotes.programs;\n\ninterface MyInterface {\n    void show();\n\
    }\n\nclass MyClass implements MyInterface {\n    @Override\n    public void show()\
    \ {\n        System.out.println(\"MyClass is implementing the Interface method.\"\
    );\n    }\n}\n\npublic class InterfaceEx1 {\n    public static void main(String\
    \ args[]) {\n        System.out.println(\"***Interface Example.Demo-1***\");\n\
    \        MyClass myClassOb=new MyClass();\n        myClassOb.show();\n    }\n\
    }\n```\n\nOutput:\n![](images/00025.jpeg)\n\n### Implementation-2:\n\nInterface\
    \ has two methods. But a class is implementing only one. Then the class itself\
    \ becomes abstract.\n\n```java\npackage javaclassnotes.programs;\n\ninterface\
    \ MyInterface2 {\n    void show1();\n    void show2();\n}\n\nabstract class MyClass2\
    \ implements MyInterface2 {\n    @Override\n    public void show1() {\n      \
    \  System.out.println(\"MyClass2 is implementing the show1() method.\");\n   \
    \ }\n}\n```\nNote: So the formula is: class needs to implement all the methods\
    \ defined in the interface. Otherwise, it will be an abstract class.\n\n### Implementation-3:\n\
    \nA class implementing multiple interfaces.\n\n```java\npackage javaclassnotes.programs;\n\
    \ninterface MyInterfaceA {\n    void show3A();\n}\n\ninterface MyInterfaceB {\n\
    \    void show3B();\n}\n\nclass MyClass3 implements MyInterfaceA, MyInterfaceB\
    \ {\n    @Override\n    public void show3A() {\n        System.out.println(\"\
    MyClass3 is implementing the show3A() method of Interface3A\");\n    }\n    @Override\n\
    \    public void show3B() {\n        System.out.println(\"MyClass3 is implementing\
    \ the show3B() method of Interface3B\");\n    }\n}\n\npublic class InterfaceEx3\
    \ {\n    public static void main(String args[]) {\n        System.out.println(\"\
    ***Interface Example.Demo-3***\");\n        MyClass3 myClassOb=new MyClass3();\n\
    \        myClassOb.show3A();\n        myClassOb.show3B();\n    }\n}\n```\n\nOutput:\n\
    ![](images/00026.jpeg)\n\n**Students Ask:**\n\nIn the above program, method names\
    \ were different in interfaces. But if both of the interfaces contain the same\
    \ method name, can we implement them?\n\nGo through the following implementation.\n\
    \n### Implementation-4:\n\n```java\npackage javaclassnotes.programs;\n//Both of\
    \ the interface have the same method name \"show()\".\ninterface MyInterface4A\
    \ {\n    void show();\n}\n\ninterface MyInterface4B {\n    void show();\n}\n\n\
    class MyClass4 implements MyInterface4A, MyInterface4B {\n    @Override\n    public\
    \ void show() {\n        System.out.println(\"MyClass4 is implementing the show()\
    \ method \");\n    }\n}\n\npublic class InterfaceEx4 {\n    public static void\
    \ main(String args[]) {\n        System.out.println(\"***Interface Example.Demo-4***\"\
    );\n        //All the 3 callings are legal.\n        MyClass4 myClassOb=new MyClass4();\n\
    \        myClassOb.show();\n        MyInterface4A inter4A=myClassOb;\n       \
    \ inter4A.show();\n        MyInterface4B inter4B=myClassOb;\n        inter4B.show();\n\
    \    }\n}\n```\nOutput:\n![](images/0027.jpeg)\n\n**Students ask:**\n\nCan an\
    \ interface extend another interface? It can extend but not implement (by definition).\n\
    \n```java\npackage javaclassnotes.programs;\n\ninterface Interface1 {\n    void\
    \ show1Method();\n}\n\ninterface Interface2 {\n    void show2Method();\n}\n\n\
    //Interface extending interfaces\ninterface Interface3 extends Interface1, Interface2\
    \ {\n    void show3Method();\n}\n\nclass MyClass5 implements Interface3 {\n  \
    \  //Now MyClass5 needs to implement methods from Interface1,2 and Interface3\n\
    \    @Override\n    public void show1Method() {\n        System.out.println(\"\
    MyClass5 is implementing the show1Method() \");\n    }\n    @Override\n    public\
    \ void show2Method() {\n        System.out.println(\"MyClass5 is implementing\
    \ the show2Method() \");\n    }\n    @Override\n    public void show3Method()\
    \ {\n        System.out.println(\"MyClass5 is implementing the show3Method() \"\
    );\n    }\n}\n\npublic class InterfaceEx5 {\n    public static void main(String\
    \ args[]) {\n        System.out.println(\"***Interface Example.Demo-5***\");\n\
    \        System.out.println(\"***Interface can extend interfaces***\");\n    \
    \    MyClass5 myClassOb=new MyClass5();\n        myClassOb.show1Method();\n  \
    \      myClassOb.show2Method();\n        myClassOb.show3Method();\n    }\n}\n\
    ```\n\nOutput:\n![](images/0028.jpeg)\n\n### Tag/Tagging interface:\n\nAn interface\
    \ which is empty is termed as a tag/tagging interface.\n\n```java\n//tagging interface\n\
    interface ITaggingInterface {\n}\n```\n\n**Teacher asks:**\n\nCan you tell me:\
    \ Why we need a tagging interface?\n\n1. We can create a common parent.\n2. A\
    \ class can claim membership in the set e.g. if our class implements the `Serializable`\
    \ interface, it becomes serializable. So, our class actually becomes an interface\
    \ type through polymorphism. Even a class that is implementing a tagging interface,\
    \ need not define any new method because the interface itself does not have any\
    \ such method.\n\n**Teacher asks:**\n\nCan you tell me: What is the difference\
    \ between an abstract class and an Interface?\n"
