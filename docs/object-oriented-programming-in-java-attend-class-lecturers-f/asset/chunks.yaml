    \ The class should have two fields-no_of_seats and no_of_wheels. Create two objects-Motorcycle\
    \ and Car for this class. Your output should show the descriptions for Car and\
    \ Motorcycle.\n\n# Inheritance\n\nThe main objective of inheritance is to promote\
