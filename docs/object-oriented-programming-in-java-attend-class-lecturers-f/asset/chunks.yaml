    ## 作者致辞

    亲爱的读者：


    欢迎来到这段旅程。我很荣幸随信附上《Java 面向对象编程：在家听授课程》。在进入主题之前，我想强调一下关于该主题及其内容的几点：


    1. 本书的目的是帮助你熟悉 Java 课堂环境。我从 2005 年开始从事教学工作。我在工程类和非工程类学院都上过课。幸运的是，我的大部分教学工作都是基于
    `Java` 及其高级主题的。这就是介绍这样一本书真正的动力。


