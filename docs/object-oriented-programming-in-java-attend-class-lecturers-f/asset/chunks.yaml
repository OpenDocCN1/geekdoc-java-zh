    \n   class  Parent\n\n    {\n\n public  void show()\n\n        {\n\n           System.out.println\
    \ (\"I am in Parent\");\n\n        }\n\n    }\n\n class  Child1  extends  Parent\n\
    \n    {\n\n public  void show()\n\n        {\n\n           System.out.println\
    \ (\"I am in Child-1\");\n\n        }\n\n    }\n\n class  Child2  extends  Parent\n\
    \n    {\n\n public  void show()\n\n        {\n\n           System.out.println\
    \ (\"I am in Child-2\");\n\n        }\n\n    }\n\nNow say our Grandchild derives\
