    \n[https://eclipse.org/downloads/](https://eclipse.org/downloads/)\n\nAs mentioned\
    \ above try to download the latest version based on your system configuration.\n\
    \n# Naming Conventions\n\nClass- should start with an uppercase letter and should\
    \ be a noun e.g. MyClass, String etc.\n\nInterface/s- should start with an uppercase\
    \ letter and should be an adjective e.g. Runnable, Remote\n\nMethod/s- They should\
    \ start with a lowercase letter and be a verb e.g. main(), showMyMethod() etc.\n\
    \nVariable/s- They should start with lowercase letter e.g. myIntegerValue, myDoubleValue,\
    \ myName etc.\n\nPackage/s- They should be all in lower case latter e.g. mypackage,\
    \ package1 etc.\n\nConstants- They should be in uppercase letters e.g. MY_CONSTANT\
    \ etc.\n\nApart for few special cases, we have tried to maintain these conventions\
    \ across the book.\n\n# Introduction\n\nHistory:\n\nIn June 1991, James Gosling,\
    \ Mike Sheridan and Patrick Naughton initiated the project of Java language. There\
    \ was an Oak tree outside Gosling’s office. And people say that this is why, originally\
    \ the language was named Oak. Later they renamed the project as Green (Their team\
    \ name was also Green team). And finally they renamed it to Java. The Green project\
    \ was chartered by Sun Microsystem.\n\nThe team members wanted such a name that\
    \ will be very much unique in nature and at the same time, it should reflect the\
    \ essence of upcoming technologies .So, they picked names like “Dynamic”, “Revolutionary”,\
    \ “Silk”, “Jolt”, “DNA” etc.\n\nJames Gosling later told that Java was one of\
    \ the top choices along with Silk. But finally they selected Java because most\
    \ of the team mates liked this name.\n\nJava became Open source on November13,\
    \ 2006. Sun finished the process by making all of Java's core code available under free\
    \ software/open-source distribution terms, (aside from a small portion of code\
    \ to which they did not hold the copyright) on May 08, 2007.\n\nLater Oracle Corporation\
    \ purchased Sun Microsystem and the acquisition process was finished on January\
    \ 27, 2010.\n\nPrimary objective:\n\nThese qualities were the primary focus area\
    \ for Java:\n\n1\\. Simple, Object-oriented, and familiar.\n\n2\\. Robustness\
    \ and Security\n\n3\\. Architecture-neutral and Portable.\n\n4\\. High Performance\
    \ capabilities.\n\n5\\. Interpreted, Threaded, and Dynamic.\n\nOur First program:\n\
    \nNow let us go through our first program. We’ll print Hello World here.\n\npackage\
    \ javaclassnotes.programs;\n\npublic  class HelloWorld\n\n{\n\n public  static\
    \  void main(String args[])\n\n              {\n\n                           \
    \ System.out.println(\"Hello World.\");\n\n              }\n\n}\n\nOutput:\n\n\
    ![](images/00002.jpeg)\n\nAnalysis:\n\n1\\. First of all, throughout the book,\
    \ we have organized the programs into package/s. But for this program, it was\
    \ not mandatory. Once we go through the chapters on package, it will be clear\
    \ to us.\n\n2\\. It is the basic structure of the main method. The meaning and\
    \ significance of each keyword will be clear to you gradually. So, for the time\
    \ being, you must follow this structure.\n\n3\\. Our source file name is HelloWorld.java.\
    \ We need to use .java extension for our java files. It is the requirement for\
    \ the compiler.\n\n4\\. Java is case-sensitive.\n\n5.\n\nmain- The program will\
    \ start from here.\n\npublic- The access specifier. Access specifiers are used\
    \ to control the visibility of the members.\n\nstatic- It allows us to call main()\
    \ without instantiate a particular instance of the class. We’ll analysis “static”\
    \ later.\n\nvoid-return type.\n\nString args[]-args is an array of instances of\
    \ String class. String Objects are used to store character strings.\n\nprintln-It\
    \ is used to display information.\n\nSystem.out- Difficult to explain at this\
    \ point. Just we can know that System is a class and out is output stream associated\
    \ with the console.\n\nQuiz:\n\nWhat will be the output?\n\nclass Hello {\n\n\
    \ static  void main(String args[])\n\n              {\n\n                           \
    \ System.out.println(\"Hello World.\");\n\n              }\n\n}\n\nOutput:\n\n\
    ![](images/00003.jpeg)\n\nSo, we cannot omit the keyword public here.\n\nQuiz:\n\
    \nWhat will be the output?\n\nclass Hello\n\n{\n\n public  static  int main(String\
    \ args[])\n\n              {\n\n                            System.out.println(\"\
    Hello World.\");\n\n return 0;\n\n              }\n\n}\n\nOutput:\n\n![](images/00004.jpeg)\n\
    \nSo, remember that the return type of main method should be void.\n\nQuiz:\n\n\
    What will be the output?\n\nclass HelloWorld\n\n{\n\n static  public  void main(String\
    \ args[])\n\n              {\n\n                            System.out.println(\"\
    Hello World.\");\n\n              }\n\n}\n\nOutput:\n\n![](images/00005.jpeg)\n\
    \nSo, we can see that we can change the order. Instead of public static void main(…)\
    \ , we can write: static public void main(…).But we’ll always use the convention.\n\
    \n# Class\n\nClass:\n\nA class is a blueprint or a template. It will describe\
    \ about the behaviors of its objects.\n\nObject:\n\nAn object is an instance of\
    \ a class.\n\nObject Oriented Programming (OOP) is based on these two concepts.\
    \ With a class, we are creating a new datatype and objects are used to hold the\
    \ data (fields) and methods. Object behavior can be exposed through these methods.\n\
    \nSuppose, we say, Sachin is a Cricketer. If we have some idea about cricket,\
    \ we can predict that either Sachin plays as a batsman or as a bowler or as a\
    \ wicketkeeper (or as an all-rounder).Here Cricketer is a class and Sachin can\
    \ be considered as an object  of that class.\n\nNow come back to our Cricketer\
    \ class again. Let us say, Sourav is a cricketer. Like the same manner, we can\
    \ predict Sourav is a batsman or a bowler or a wicketkeeper. Now we can see both\
    \ Sachin and Sourav are objects of Cricketer Class but they have individual identity.\
    \ Obviously Sourav and Sachin shows their skills in the game differently even\
    \ though they are participating in the same game.\n\nConsider a different domain.\
    \ We can consider our pet dog or cat as an object of an Animal class.\n\nNow come\
    \ to the programming. Suppose our class name is A. Then we can create an object\
    \ “obA” of the class A with the following statement:\n\nA obA=new A();\n\nActually,\
    \ the above line can be decomposed of two lines as below:\n\nA obA;\n\nobA=new\
    \ A();\n\nInitially obA is a reference. Till this point, there is no memory allocated.\
    \ But once the new comes into picture, the memory is allocated.\n\nYou must note\
    \ that in the second line, class name is followed by a parentheses. These are\
    \ for constructors. Constructors are used to describe what will happen when an\
    \ object will be created. Constructors can have different attributes. But if our\
    \ class does not specifically define a constructor, Java will supply a default\
    \ one. In the above example, we have used a default constructor.\n\nA simple class\
    \ demonstration:\n\nHere our class name is ClassA. It has only one field-i which\
    \ is of type int. Here the value of i already has the value 5 associated with\
    \ it. So, we can predict that if we create an object for this class, the object\
    \ of that class will have an integer named i and the value of i in it will be\
    \ 5.\n\nFor your ready reference, we have created 2 objects obA and obB for our\
    \ class ClassA here. We have tested the values of i inside the objects. You can\
    \ see that both have the value 5.\n\nclass ClassA\n\n{\n\n int  i=5;\n\n}\n\n\
    class ClassEx1\n\n{\n\n public  static  void main(String args[])\n\n             \
    \ {\n\n                            System.out.println(\"*** A Simple class with\
    \ 2 objects-obA And obB ***\");\n\nClassA obA=new ClassA();\n\nClassA obB=new\
    \ ClassA();\n\n                            System.out.println(\"obA.i =\"+ obA.i);\n\
    \n                            System.out.println(\"obB.i =\"+ obB.i);\n\n             \
    \ }\n\n}\n\nOutput:\n\n![](images/00006.jpeg)"
