  trans: "\n\n[`www.oracle.com/technetwork/java/javase/downloads/jdk8-downloads-2133151.html`](http://www.oracle.com/technetwork/java/javase/downloads/jdk8-downloads-2133151.html)\n\
    \n你将看到一个类似这样的屏幕：\n\n![](img/00001.jpeg)\n\n请尝试根据你的系统配置（例如 32 位/64 位，Windows/Linux\
    \ 等）下载最新版本。\n\n下载 eclipse IDE：\n\n前往此处。\n\n[`eclipse.org/downloads/`](https://eclipse.org/downloads/)\n\
    \n如上所述，请尝试根据你的系统配置下载最新版本。\n\n# 命名规范\n\n- **类 (Class)**- 应该以大写字母开头，并且是一个名词，例如 `MyClass`、`String`\
    \ 等。\n- **接口 (Interface/s)**- 应该以大写字母开头并是一个形容词，例如 `Runnable`、`Remote`。\n- **方法\
    \ (Method/s)**- 它们应该以小写字母开头并是一个动词，例如 `main()`、`showMyMethod()` 等。\n- **变量 (Variable/s)**-\
    \ 应该以小写字母开头，例如 `myIntegerValue`、`myDoubleValue`、`myName` 等。\n- **包 (Package/s)**-\
    \ 应该全部小写字母，例如 `mypackage`、`package1` 等。\n- **常量 (Constants)**- 它们应该是全大写字母，例如 `MY_CONSTANT`\
    \ 等。\n\n除了少数特殊情况外，我们尝试在书中维持这些规范。\n\n# 简介\n\n### 历史\n1991 年 6 月，James Gosling、Mike\
    \ Sheridan 和 Patrick Naughton 启动了 Java 语言项目。Gosling 的办公室外有一棵橡树（Oak）。人们说这就是为什么该语言最初命名为\
    \ Oak。后来他们将项目重命名为 Green（他们的团队名称也是 Green team）。最后他们将其重命名为 Java。Green 项目由 Sun Microsystem\
    \ 授权。\n\n团队成员希望有一个在本质上非常独特的名称，同时又能反映出未来技术的本质。因此，他们选择了如“Dynamic”、“Revolutionary”、“Silk”、“Jolt”、“DNA”等名称。\n\
    \nJames Gosling 后来提到，Java 是与 `Silk` 并列的首选之一。但最终他们选择了 Java，因为大多数团队成员都喜欢这个名字。\n\n\
    Java 于 2006 年 11 月 13 日开源。Sun 在 2007 年 5 月 8 日通过将所有 Java 核心代码按免费软件/开源分发条款提供（他们未持有版权的一小部分代码除）完成了这一过程。\n\
    \n后来，Oracle 公司收购了 Sun Microsystem，收购过程于 2010 年 1 月 27 日完成。\n\n### 首要目标\n这些特性是\
    \ Java 的主要关注领域：\n1. 简单、面向对象且熟悉。\n2. 健壮性和安全性。\n3. 架构中立且可移植。\n4. 高性能能力。\n5. 解释型、多线程和动态性。\n\
    \n### 我们的第一个程序\n现在让我们来看第一个程序。我们在这里打印 Hello World。\n\n```java\npackage javaclassnotes.programs;\n\
    \npublic class HelloWorld {\n    public static void main(String args[]) {\n  \
    \      System.out.println(\"Hello World.\");\n    }\n}\n```\n\n输出：\n![](img/00002.jpeg)\n\
    \n### 分析\n1. 首先，在整个书中，我们将程序组织在包（package/s）中。但对于这个程序，这不是强制性的。一旦我们学习了关于包的章节，这一点对我们将很清楚。\n\
    2. 这是 `main` 方法的基本结构。每个关键字的含义和意义你将逐渐明白。因此，目前你必须遵循这个结构。\n3. 我们的源代码文件名为 `HelloWorld.java`。我们需要为\
    \ Java 文件使用 `.java` 扩展。这是编译器的要求。\n4. Java 是区分大小大小的。\n5. `main`- 程序将从这里开始。\n  \
    \ - `public`- 访问修饰符。访问修饰符用于控制成员的可见性。\n   - `static`- 它允许我们在不实例化类的特定实例的情况下调用 `main()`。我们稍后会分析\
    \ `static`。\n   - `void`- 返回类型。\n   - `String args[]`- `args` 是 `String` 类实例的数组。String\
    \ 对象用于存储字符字符串。\n   - `println`- 它用于显示信息。\n   - `System.out`- 在此阶段很难解释。我们只需要知道\
    \ `System` 是一个类，而 `out` 是与控制台关联的输出流。\n\n### 测验\n输出是什么？\n```java\nclass Hello {\n\
    \    static void main(String args[]) {\n        System.out.println(\"Hello World.\"\
    );\n    }\n}\n```\n输出：\n![](img/00002.jpeg)\n\n"
- fmt: "\n# Class demonstration-2\n\nWe have provide our own constructor here. We\
    \ can see that now we can initialize objects with different values. `obA` has\
    \ initialized integer `i` with the value `20` and `obB` has initialized the integer\
    \ `i` with the value `30`.\n\n```java\nclass ClassA\n{\n    int i;\n    ClassA(int\
    \ i) {\n        this.i=i;\n    }\n}\n\nclass ClassEx3\n{\n    public static void\
    \ main(String args[]) {\n        System.out.println(\"*** A Simple class with\
    \ 2 objects-obA And obB ***\");\n        System.out.println(\"*** obA.i And obB.i\
    \ are different here ***\");\n        ClassA obA=new ClassA(20);\n        ClassA\
    \ obB=new ClassA(30);\n        System.out.println(\"obA.i =\"+ obA.i);\n     \
    \   System.out.println(\"obB.i =\"+ obB.i);\n    }\n}\n```\n\nOutput:\n![](images/00007.jpeg)\n\
    \n### Students ask: Sir, what is use of this here?\n\nGood question. `this` is\
    \ used to refer the current object. We can omit the use of `this` if we write\
    \ the code like this:\n\n```java\nclass ClassA\n{\n    int i;//instance variable\n\
    \    ClassA(int myInt)//myInt-local variable\n    {\n        i=myInt;\n    }\n\
    }\n```\n\nWe are familiar with the code like this: `a=5;` here we are assigning\
    \ `5` into `a`. But can we write `5=a;`? No. Compiler will raise an issue.\n\n\
    Here `myInt` is our local variable (seen inside methods, blocks or constructors),\
    \ `i` is our instance variable (declared inside a class but outside a method,\
    \ block or constructor).\n\nSo, instead of `myint`, if we use `i`, we need to\
    \ tell compiler about our intention. It should not be confused about which value\
    \ is assigned where. Here we are assigning the value of the local variable to\
    \ the instance variable and compiler should clearly understand our intention.\
    \ With `this.i=i;` compiler will clearly understand the value of the local variable\
    \ `i` is assigned to instance variable `i`.\n\n# Class demonstration-3\n\nHere\
    \ we have used two constructors. Go through the program. Notice that we can initialize\
    \ an object with a default value here. If the default constructor is used during\
    \ the creational process of an object, the instance variable `i` will be initialized\
    \ with `7`. We can also supply different values through the non-default constructor.\n\
    \n```java\nclass ClassA\n{\n    int i;\n    ClassA() {\n        this.i=7;\n  \
    \  }\n    ClassA(int i) {\n        this.i=i;\n    }\n}\n\nclass ClassEx3\n{\n\
    \    public static void main(String args[]) {\n        System.out.println(\"***\
    \ Simple class with 2 objects-obA And obB ***\");\n        System.out.println(\"\
    *** Different type of constructors used here ***\");\n        ClassA obA=new ClassA();\n\
    \        ClassA obB=new ClassA(25);\n        System.out.println(\"obA.i =\"+ obA.i);\n\
    \        System.out.println(\"obB.i =\"+ obB.i);\n    }\n}\n```\n\nOutput:\n![](images/00008.jpeg)\n\
    \nAssignment: Create a class `Vehicle`. The class should have fields `no_of_seats`\
    \ and `no_of_wheels`. Create two objects-Motorcycle` and `Car` for this class.\
    \ Your output should show descriptions for `Car`.\n\n# Inheritance\n\nThe main\
    \ objective of inheritance is to promote reusability and eliminate redundancy\
    \ of code. Here a child class obtains features of its parent class. By parent\
    \ class we mean the class which is at the higher level compared to another class\
    \ (which is termed as a child class).\n\n## Types\n\nIn general, we deal with\
    \ 4 types of inheritance.\n\n### Single inheritance\nOne child class is derived\
    \ from one base class.\n![](images/0009.jpeg) Figure: Single inheritance\nThe\
    \ format of code is like this:\n```java\nclass Parent {\n    //your code...\n\
    }\nclass Child extends Parent {\n    //your code...\n}\n```\n\n### Hierarchical\
    \ inheritance\nMultiple child class can be derived from one base class.\n![](images/00010.jpeg)\
    \ Figure: Hierarchical inheritance\nThe format of code is like this:\n```java\n\
    class Parent {\n    //your code...\n}\nclass Child1 extends Parent {\n    //your\
    \ code...\n}\nclass Child2 extends Parent {\n    //your code...\n}\n```\n\n###\
    \ Multilevel inheritance\nHere the parent class has the grandchild.\n![](images/00011.jpeg)\
    \ Figure: Multilevel inheritance\nTeacher asks: Now try to implement the concept\
    \ with Java code.\nSolution: The format of code is like this:\n```java\nclass\
    \ Parent {\n    //your code...\n}\nclass Child extends Parent {\n    //your code...\n\
    }\nclass GrandChild extends Child {\n    //your code...\n}\n```\n\n### Multiple\
    \ inheritance\nHere a child can derive from multiple Parents.\n![](images/00012.jpeg)\
    \ Figure: Multiple inheritance\nNote that, Java does not support this type of\
    \ inheritance (through class). i.e. in Java, a child class cannot derive from\
    \ more than one parent class. To deal with this type of situation we need to understand\
    \ interfaces.\n\nNote: There is another type of inheritance which is termed as\
    \ hybrid inheritance. This is a combination of one or more types of the above\
    \ inheritance/s.\n\n## A simple program on Inheritance\n\n```java\nclass ParentClass\n\
    {\n    public void show() {\n        System.out.println(\"I am in Parent Class\"\
    );\n    }\n}\n\nclass ChildClass extends ParentClass\n{\n}\n\nclass Example1\n\
    {\n    public static void main(String args[]) {\n        ChildClass child1=new\
    \ ChildClass();\n        //Calling show() through ChildClass object\n        child1.show();\n\
    \    }\n}\n```\n\nOutput:\n![](images/00013.jpeg)\n\n### Students ask: Why Java\
    \ does not support multiple inheritance through class?\n\nThe main reason is to\
    \ avoid ambiguity. They can cause some confusion in some typical scenarios like\
    \ this:\nSuppose in our parent class we have a method named `show()`. The parent\
    \ class has multiple children-say `child1` and `child2` who are overriding the\
    \ method for their own purpose. The code may look like this:\n\n```java\nclass\
    \ Parent {\n    void show() {\n        System.out.println(\"I am Parent\");\n\
    \    }\n}\nclass Child1 extends Parent {\n    void show() {\n        System.out.println(\"\
    I am Child-1\");\n    }\n}\nclass Child2 extends Parent {\n    void show() {\n\
    \        System.out.println(\"I am Child-2\");\n    }\n}\nclass GrandChild extends\
    \ Child1, Child2 {\n    // This is not possible in Java\n}\n```\nNow say our `GrandChild`\
    \ inherits/call `show()`- `Child1` or `Child2`. ![](images/0014.jpeg) This problem\
    \ is known with a famous name- the Diamond problem.\n\n## A special keyword: super\n\
    \nIn Java, we have a special keyword-super. It is used to access the members of\
    \ the parent class (super class) in an efficient way. Whenever a child class wants\
    \ to refer its immediate parent, it should use this keyword.\n\nNote:\nRemember\
    \ that in Java, `Object` (in `java.lang` package) is the superclass for all classes.\
    \ Because all other classes directly or indirectly is an inheritor of that class.\n\
    \nAssignments:\n1. Write a Simple Program to implement Hierarchical Inheritance.\n\
    2. Write a Simple Program to implement Multilevel Inheritance.\n"
