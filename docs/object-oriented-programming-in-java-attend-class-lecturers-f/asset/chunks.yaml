  trans: "\n\n```java\nSystem.out.println(\"I am in Parent constructor\");\nthis.a=a;\n\
    this.b=b;\n}\nvoid parentMethod() {\n    System.out.println(\"I am a Parent method\"\
    );\n}\n}\n}\nclass B2 extends A2 {\n    int c;\n    B2(int a, int b,int c) {\n\
    \        super(a,b);\n        System.out.println(\"I am in Child constructor\"\
    );\n        this.c=c;\n    }\n    void childMethod() {\n        System.out.println(\"\
    I am Child method\");\n        System.out.println(\"Now I am going to call Parent\
    \ method\");\n        super.parentMethod();\n    }\n}\nclass Test2 {\n    public\
    \ static void main(String args[]) {\n        System.out.println(\"*** use of super\
    \ keyword***\");\n        B2 obB2=new B2(1,2,3);\n        System.out.println(\"\
    a in B2=\"+ obB2.a);\n        System.out.println(\"b in B2=\"+ obB2.b);\n    \
    \    System.out.println(\"c in B2=\"+ obB2.c);\n        obB2.childMethod();\n\
    \    }\n}\n```\n\n输出：![](img/00015.jpeg)\n\n我们将通过以下示例检查 `super` 的另一种用法。在这里我们将看到，即使父类的变量被子类的变量隐藏了，`super`\
    \ 仍然允许我们访问父类的变量。\n\n```java\npackage javaclassnotes.testprograms;\n\nclass A3\
    \ {\n    int a;\n    A3() {\n        a=25;\n    }\n}\nclass B3 extends A3 {\n\
    \    int a; // 隐藏 A3 中的 a\n    B3() {\n        super.a=12; //父类\n        a=50;\
    \ // 用于子类\n    }\n    void display() {\n        System.out.println(\"a in parent\
    \ class=\"+ super.a);\n        System.out.println(\"a in child class=\"+ a);\n\
    \    }\n}\nclass Test3 {\n    public static void main(String args[]) {\n     \
    \   System.out.println(\"***super Demo-2***\");\n        B3 obB3=new B3();\n \
    \       obB3.display();\n    }\n}\n```\n\n输出：![](img/00016.jpeg)\n\n注意：学生问：我们可以使用\
    \ `super` 关键字来调用被子类隐藏的方法吗？可以。\n\n# 重载 (Overloading)\n\n老师问：考虑以下片段。你发现任何模式吗？\n\n\
    ```java\nint sum(int x,int y) {\n    return x+y;\n}\ndouble sum(double x,double\
    \ y) {\n    return x+y;\n}\nString sum(String s1,String s2) {\n    return s1.concat(s2);\n\
    }\n```\n\n学生回答：是的，老师。我们看到所有方法的名称都是 `sum`，但从方法体来看，每个方法都在做不同的事情。\n\n老师说：是的。当你这样做时，我们将其称为方法重载。但你应该注意到，这里的方法签名是不同的。\n\
    \n学生问：什么是方法签名？\n\n方法签名由方法名和参数列表组成。Java 编译器可以区分同名但参数列表不同的方法。因此，对于 Java 编译器来说，`double\
    \ sum(double x, double y)` 与 `int sum(int x, int y)` 是不同的。\n\n考虑下面的程序。在这里通过以下示例表示方法重载：\n\
    \n```java\npackage javaclassnotes.programs;\n\nclass Addition {\n    int sum(int\
    \ x,int y) {\n        return x+y;\n    }\n    double sum(double x,double y) {\n\
    \        return x+y;\n    }\n    String sum(String s1,String s2) {\n        return\
    \ s1.concat(s2);\n    }\n}\n\npublic class Overloading {\n    public static void\
    \ main(String args[]) {\n        System.out.println(\"***Method Overloading Demo***\"\
    );\n        Addition additionOb=new Addition();\n        int sumIntegers=additionOb.sum(10,20);\n\
    \        System.out.println(\"Sum of 10 and 20=\"+sumIntegers);\n        double\
    \ sumDoubles=additionOb.sum(10.5,20.7);\n        System.out.println(\"Sum of 10.5\
    \ and 20.7=\"+sumDoubles);\n        String sumStrings=additionOb.sum(\"Amit\"\
    ,\"Kumar\");\n        System.out.println(\"Concatenation of Amit and Kumar=\"\
    +sumStrings);\n    }\n}\n```\n\n输出：![](img/00017.jpeg)\n\n老师问：这是方法重载的示例吗？\n\n\
    ```java\nint sum(int x,int y) {\n    return x+y;\n}\nint sum(int x,int y,int z)\
    \ {\n    return x+y+z;\n}\n```\n\n回答：是的。\n\n老师问：这是方法重载的示例吗？\n\n```java\nint sum(int\
    \ x,int y) {\n    return x+y;\n}\ndouble sum(int x,int y) {\n    return x+y;\n\
    }\n```\n\n回答：不是。编译器不会考虑“返回值”来区分这些方法。返回值不被方法签名的一部分。\n\n学生问：老师，我们可以有构造函数重载吗？\n\n\
    老师：完全可以。你可以写一个类似的构造函数重载程序。\n\n```java\npackage javaclassnotes.testprograms;\n\n\
    class A1 {\n    A1() {\n        System.out.println(\"Constructor with no argument\"\
    );\n    }\n    A1(int a) {\n        System.out.println(\"Constructor with one\
    \ integer argument\");\n    }\n    A1(int a,double b) {\n        System.out.println(\"\
    Constructor with one integer and double argument\");\n    }\n}\nclass Test1 {\n\
    \    public static void main(String args[]) {\n        System.out.println(\"***Constructor\
    \ Overloading Demo***\");\n        A1 ob1=new A1();\n        A1 ob2=new A1(2);\n\
    \        A1 ob3=new A1(2,3.7);\n    }\n}\n```\n\n输出：![](img/00018.jpeg)\n\n学生问：老师，在我看来这像是方法重载。构造函数和方法的区别是什么？\n\
    \n老师：仔细注意。构造函数的名称与类名相同，且没有返回值。因此，你可以将构造函数看作一种与类名相同且没有返回值的特殊方法。但还有许多其他区别：构造函数的主要目的是初始化对象。它们不能被直接调用。\n\
    \n学生问：那么我们可以写这样的代码吗？\n\n```java\nclass A1 {\n    // 这是构造函数。它有返回值。\n    A1() {\n\
    \        System.out.println(\"Constructor with no argument\");\n    }\n    //\
    \ 这是方法。它有返回值。\n    void A1() {\n        System.out.println(\"I am a method\");\n\
    \    }\n}\n```\n\n老师：当然。现在，主函数中的以下行 `A1 ob1=new A1(); ob1.A1(5);` 可以如下输出：![](img/00019.jpeg)\n\
    \n# 重写 (Overriding)\n\n有时我们想要重新定义或修改父类的行为。在这种情况下就出现了方法重写。考虑下面的程序。注意，这里 `showMe()`\
    \ 方法在父类和子类中具有相同的签名。\n\n```java\npackage javaclassnotes.programs;\n\nclass ParentClass\
    \ {\n    public void showMe() {\n        System.out.println(\"I am in Parent class\"\
    );\n    }\n}\nclass ChildClass extends ParentClass {\n    public void showMe()\
    \ {\n        System.out.println(\"I am in Child class\");\n    }\n}\nclass OverridingEx\
    \ {\n    public static void main(String args[]) {\n        System.out.println(\"\
    ***Method Overriding Demo***\");\n        ChildClass childOb=new ChildClass();\n\
    \        childOb.showMe();\n    }\n}\n```\n\n输出：![](img/00020.jpeg)\n\n"
- fmt: "\n# Dynamic Method Dispatch\n\nThis is an extremely important concept in Java.\
    \ Java can implement runtime polymorphism through this technique. This technique\
    \ is considered to implement runtime polymorphism because the call to an overridden\
    \ method is resolved dynamically at runtime. Java will call the appropriate method\
    \ based on the object which we are referring.\n\n```java\npackage javaclassnotes.programs;\n\
    \nclass MyParentClass\n{\n    public void showMe() {\n        System.out.println(\"\
    I am in Parent class\");\n    }\n}\n\nclass MyChildClass extends MyParentClass\n\
    {\n    public void showMe() {\n        System.out.println(\"I am in Child class\"\
    );\n    }\n}\n\nclass DynamicMethodDispatchEx\n{\n    public static void main(String\
    \ args[]) {\n        System.out.println(\"***Dynamic Method Dispatch Demo***\"\
    );\n        MyParentClass parent=new MyParentClass();\n        parent.showMe();\n\
    \        MyChildClass childOb=new MyChildClass();\n        /*Parent class reference\
    \ to a child object*/\n        parent=childOb;\n        childOb.showMe();\n  \
    \  }\n}\n```\n\nOutput:\n![](images/00021.jpeg)\n\n### Points to remember\n- Through\
    \ a parent class reference, we can refer a child class object but the reverse\
    \ is not applicable.\n- So, `MyParentClass parent=new MyChildClass();` is ok but\
    \ `MyChildClass child=new MyParentClass();` will raise error.\n\n### Teacher asks\n\
    Now there may be some situation where we want a restriction: A method in the parent\
    \ should not be overridden by its child. How can we achieve that?\n\nIn many interviews,\
    \ you can face this question. We must remember that we can prevent overriding\
    \ by the use of `static`, `private` or `final` keywords. But here we discuss only\
    \ the use of `final`. It is very much helpful because compiler itself will prevent\
    \ the process of overriding.\n\n```java\nclass ParentClass\n{\n    //Use of final\
    \ to prevent overriding\n    final public void showMe() {\n        System.out.println(\"\
    I am in Parent class\");\n    }        \n}\n\nclass ChildClass extends ParentClass\n\
    {\n    //Cannot override now: It is not allowed\n    public void showMe() {\n\
    \        System.out.println(\"I am in Child class\");\n    }\n}\n```\nSo, with\
    \ the above code, compiler will raise the error.\n\n# Abstract Class\n\nThese\
    \ are incomplete classes and we cannot instantiate objects from this type of classes.\n\
    \nIn general, if a class contains at least one incomplete/abstract method, the\
    \ class itself is an abstract class. By the term “abstract method”- we mean that\
    \ the method has the declaration (or signature) but no implementation.\n\nThe\
    \ technique is useful when the super class can define a generalized form (that\
    \ will be shared by its subclasses) and passes the responsibilities to fill the\
    \ details to its subclasses.\n\nA simple abstract class demo:\n\n### Implementation-1\n\
    ```java\npackage javaclassnotes.programs;\n\nabstract class MyAbstractClass\n\
    {\n    public abstract void showMe();\n}\n\nclass MyConcreteClass extends MyAbstractClass\n\
    {\n    @Override\n    public void showMe() {\n        System.out.println(\"I am\
    \ from concrete class:\");\n        System.out.println(\"I am supplying the method\
    \ for showMe()\");\n    }\n}\n\nclass AbstractClassEx\n{\n    static void main(String\
    \ Args[]) {\n        System.out.println(\"***Abstract class Demo***\");\n    \
    \    //Illegal:Cannot instantiate\n        MyAbstractClass abstractOb=new MyAbstractClass();\n\
    \        ConcreteClass concreteOb=new MyConcreteClass();\n        concreteOb.showMe();\n\
    \    }\n}\n```\nOutput:\n![](images/00022.jpeg)\n\nAn abstract class can contain\
    \ concrete methods. The child class may or not override those methods.\n\n###\
    \ Implementation-2\n```java\npackage javaclassnotes.programs;\n\nabstract class\
    \ AbstractClass\n{\n    public abstract void showMe();\n    public void completeMethod1()\
    \ {\n        System.out.println(\" Originally,I am from completeMethod1 in AbstractClass.But,I\
    \ am complete.\");\n    }\n    public void completeMethod2() {\n        System.out.println(\"\
    \ Originally,I am from completeMethod2 in AbstractClass.But,I am also complete.\"\
    );\n    }\n}\n\nclass ConcreteClass extends AbstractClass\n{\n    @Override\n\
    \    public void showMe() {\n        System.out.println(\"I am from concrete class:\"\
    );\n        System.out.println(\"I am supplying the method body for showMe()\"\
    );\n    }\n    //It wants to override completeMethod1() in AbstractClass\n   \
    \ public void completeMethod1() {\n        System.out.println(\"I am overriding\
    \ completeMethod1 of AbstractClass.\");\n    }\n}\n\nclass AbstractClassEx2\n\
    {\n    static void main(String Args[]) {\n        System.out.println(\"***Abstract\
    \ class Demo2***\");\n        ConcreteClass concreteOb=new ConcreteClass();\n\
    \        concreteOb.showMe(); //It will show completeMethod1 is redefined in ConcreteClass\n\
    \        concreteOb.completeMethod1(); //It will show details ofMethodMethod defined\
    \ in AbstractClass\n        concreteOb.completeMethod2(); //Following declaration\
    \ will be fine\n        AbstractClass abstractRef=new ConcreteClass();\n     \
    \   abstractRef.completeMethod1();\n    }\n}\n```\nOutput:\n![](images/00023.jpeg)\n\
    \nCan we implement the concept of dynamic dispatch here? Yes. Following declaration\
    \ will be perfectly fine and will call `CompleteMethod1` of `ConcreteClass`. `AbstractClass\
    \ abstractRef=new ConcreteClass(); abstractRef.completeMethod1();`\n\n### Students\
    \ ask\n- Can an abstract class contain fields? Yes. Following example will demonstrate\
    \ how we can use the concept of dynamic dispatch here. Also, the program will\
    \ show that an abstract class contain fields.\n\n### Implementation-3\n```java\n\
    package javaclassnotes.programs;\n\nabstract class AbstractClass3\n{\n    int\
    \ myInt=5;\n    abstract void showMe();\n    public void completeMethod1() {\n\
    \        System.out.println(\"I am originally from completeMethod1 in AbstractClass.But,I\
    \ am complete.\");\n    }\n}\n\nclass ConcreteClass3 extends AbstractClass3\n\
    {\n    @Override\n    public void showMe() {\n        System.out.println(\"I am\
    \ from concrete class:\");\n        System.out.println(\"I am supplying the method\
    \ body for showMe()\");\n    }\n}\n\nclass AbstractClassEx3\n{\n    static void\
    \ main(String Args[]) {\n        System.out.println(\"***Abstract class Demo3***\"\
    );\n        AbstractClass3 abstractRef=new ConcreteClass3();\n        abstractRef.completeMethod1();\n\
    \        System.out.println(\"myInt in AbstractClass3=\"+abstractRef.myInt);\n\
    \    }\n}\n```\nOutput:\n![](images/00024.jpeg)\n\n- Suppose in a class we have\
    \ 50+ methods and out of that only one is an abstract method. Still we need to\
    \ mark the class as abstract?\nYes. If a class contains at least one abstract\
    \ method, the class itself is abstract. You can think from a general point of\
    \ view-`abstract` keyword is used in a sense to represent the incompleteness.\
    \ So, if your class contains one incomplete method, your class itself is incomplete\
    \ and hence need to mark by the keyword `abstract`.\nSo, the simple formula is:\
    \ whenever your class has at least an abstract method, your class itself is an\
    \ abstract class.\n\n### Teacher asks\nNow consider a reverse scenario. Suppose,\
    \ you have marked your class abstract but there is no abstract method in it like\
    \ this:\n\n```java\nabstract class AbstractClass\n{\n    public void completeMethod1()\
    \ {\n        System.out.println(\"A complete method\");\n    }\n}\n```\n"
