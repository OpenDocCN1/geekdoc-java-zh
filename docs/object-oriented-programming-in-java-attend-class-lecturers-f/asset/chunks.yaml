  trans: "\n\n你应该注意到另一个重要的特征：静态方法只能访问静态成员。\n\n同时请注意，我们的静态方法在这里是嵌套的。\n\n### 经验法则\n\n\
    1. 静态方法只能调用其他静态方法。\n2. 静态方法只能访问静态字段。\n3. 静态方法不能引用 `this` 或 `super`。\n\n### 学生提问\n\
    \n**我们可以创建静态类吗？**\n\n可以。但有一个限制条件。静态类必须在另一个类的内部，即它必须是嵌套的。Java 不允许我们创建顶层静态类。\n\n\
    包含静态类的类被称为 `outer class`（外部类）。\n\n考虑下面的示例。在这里我们展示了如何创建和使用嵌套静态类以及嵌套非静态类（`Inner\
    \ class` 内部类）。\n\n#### Implementation-3:\n\n```java\npackage javaclassnotes.programs;\n\
    \n//Java 不允许我们创建顶层静态类，它必须是嵌套的\nclass OuterClass {\n    //静态类\n    static class\
    \ MyStaticClass {\n        public static void showStaticMethod() {\n         \
    \   System.out.println(\"I am a static method\");\n        }\n    }\n    //非静态类\n\
    \    class MyNonStaticClass {\n        public void showStaticMethod() {\n    \
    \        System.out.println(\"I am NonStatic method\");\n        }\n    }\n}\n\
    \nclass StaticClassEx {\n    public static void main(String args[]) {\n      \
    \  System.out.println(\"***Static and Inner Class Demo***\");\n        //调用静态方法\n\
    \        OuterClass.MyStaticClass.showStaticMethod();\n        //调用非静态方法\n   \
    \     OuterClass.MyNonStaticClass obNonStatic = new OuterClass().new MyNonStaticClass();\n\
    \        obNonStatic.showStaticMethod();\n    }\n}\n```\n\n输出:\n![](img/0038.jpeg)\n\
    \n**什么是内部类？**\n\n如上所述，非静态嵌套类被称为 Inner class（内部类）。它可以访问外部类所有的变量和方法。\n\n**从静态类，我们可以访问外部类的变量吗？**\n\
    \n答案是肯定的，且仅当这些变量是静态的。考虑下面的示例。以下代码段是正确的：\n\n```java\nclass OuterClass {\n    static\
    \ int outer_int=25;\n    //静态类\n    class MyStaticClass {\n        public static\
    \ void showStaticMethod() {\n            System.out.println(\"I am a static method\"\
    );\n            System.out.println(\"Outer_int =\" + outer_int);\n        }\n\
    \    }\n}\n```\n但如果 `outer_int` 是非静态的，编译器将会报错。\n\n#### 作业\n\n1. 假设你组建了一个板球球队。现在你的球队将与对手队进行比赛。你必须意识到一个事实：哪队先击球（或投球）将通过硬币决定决定，你需要派遣队长去参加。因此，首先，你必须选出一个队长。同时，你必须意识到你只能选择一个队长。所以，如果你还没有这样的队长，就选一个并派去掷硬币。否则，直接派已命名的队长去掷硬币。你能设计这个程序吗？\n\
    2. 创建一个 `Vehicle`（车辆）。该类应该拥有 `no_of_seats`（座位）和 `no_of_wheels`（轮子）字段。\n3. 为该类创建两个对象\
    \ `Motorcycle`（摩托车）和 `Car`（汽车）。你的输出应该显示 `Car` 和 `Motorcycle` 的描述。\n\nUml 类图:\n\
    ![](img/0039.jpeg)\n\n实现:\n不需要包含包声明。一旦你理解了包的概念，我们就会发现为我们的程序建立有组织的结构是非常方便的。\n\n\
    ```java\npackage javaclassnotes.assignments;\n\nclass MyVehicle {\n    int no_of_wheels;\n\
    \    int no_of_seats;\n\n    MyVehicle(int wheels, int seats) {\n        no_of_wheels\
    \ = wheels;\n        no_of_seats = seats;\n    }\n\n    void showVehicle() {\n\
    \        System.out.println(\"It has \" + no_of_wheels + \" wheels and \" + no_of_seats\
    \ + \" seats\");\n    }\n}\n\nclass Assignment_1 {\n    public static void main(String\
    \ args[]) {\n        System.out.println(\"Car Description:\");\n        MyVehicle\
    \ car = new MyVehicle(4, 5);\n        car.showVehicle();\n        System.out.println(\"\
    Motorcycle Description:\");\n        MyVehicle motorCycle = new MyVehicle(2, 2);\n\
    \        motorCycle.showVehicle();\n    }\n}\n```\n"
- fmt: "\nNote the output. Whenever we want to initiate a child class object, the\
    \ parent class constructors called automatically first. This is why, Child class\
    \ constructor called Parent class constructor first. Similarly, our `GrandChild`\
    \ class constructor called its parent (i.e. `Child` class constructor) which in\
    \ turn called its parent (i.e. `Parent` class constructor) constructor first.\n\
    \n## Use of static keyword\n\n1. Suppose you have formed a cricket team. Now your\
    \ team is going to play against an opponent team. You must be aware of the fact\
    \ that which team will bat (or bowl) first will be decided through the toss and\
    \ you need to send your captain for that. So, at first, you must elect a captainn.\
    \ At the same time, you must be aware that you can select one and only one captain.\
    \ So, if you do not have any such captain, you will select one and send him for\
    \ toss. Otherwise, you simply send the already nominated captain for the toss.\
    \ Can you design this?\n\n### Uml Class Diagram:\n\n![](images/00045.jpeg)\n\n\
    ### Implementation:\n\n```java\npackage javaclassnotes.assignments;\n\nclass NominateACaptain\n\
    {\n    private static NominateACaptain _captain;\n\n    //We make the constructor\
    \ private to prevent the use of \"new\" \n    private NominateACaptain() { }\n\
    \n    // public static synchronized MakeACaptain getCaptain()\n    public static\
    \ NominateACaptain getCaptain()\n    {\n        // Lazy initialization\n     \
    \   if (_captain == null)\n        {\n            _captain = new NominateACaptain();\n\
    \            System.out.println(\"We have selected the captain for our team\"\
    );\n        }\n        else\n        {\n            System.out.print(\" We already\
    \ have a Captain.\");\n            System.out.println(\" We'll send for the toss.\"\
    );\n        }\n        return _captain;\n    }\n}\n\nclass StaticAssignmentDemo\n\
    {\n    public static void main(String[] args)\n    {\n        System.out.println(\"\
    ***Static Assignment Demo***\\n\");\n        System.out.println(\"Trying to make\
    \ a captain for our team\");\n        NominateACaptain c1 = NominateACaptain.getCaptain();\n\
    \        System.out.println(\"Trying to make another captain for our team\");\n\
    \        NominateACaptain c2 = NominateACaptain.getCaptain();\n        if (c1\
    \ == c2)\n        {\n            System.out.println(\"The captains are the same.\"\
    );\n        }\n    }\n}\n```\n\n## Output:\n\n```\n***Static Assignment Demo***\n\
    \nTrying to make a captain for our team\nWe have selected the captain for our\
    \ team\nTrying to make another captain for our team\nWe already have a Captain.\
    \ We'll send for the toss.\nThe captains are the same.\n```\n\n## FAQ\n\n1. What\
    \ is class?\n2. What is object?\n3. Differentiate between reference.\n4. Can we\
    \ implement multiple inheritance?\n5. Can we implement hybrid inheritance?\n6.\
    \ Differentiate between abstract class and interface.\n7. Differentiate between\
    \ method overloading and method overriding.\n8. How you implement dynamic polymorphism?\n\
    9. What is `JVM`?\n10. Differentiate between `JRE` and `JDK`.\n11. What is inner\
    \ class?\n12. How you create static class?\n13. How you implement abstraction\
    \ and encapsulation?\n14. Differentiate between static binding and dynamic binding.\n\
    15. What is the use of `super`?\n16. What is the use of `this`?\n17. What is the\
    \ use of `default`?\n18. Can you abstract class without an abstract method?\n\
    19. Can you inherit constructors?\n20. What is the use of `final`?\n21. Differentiate\
    \ between instance method and class method (static method)?\n22. Can you create\
    \ static block?\n23. What is the default package?\n24. Does java support pointers?\n\
    \n## Reference\n\n- http://www.javatpoint.com/\n- http://www.tutorialspoint.com/\n\
    - http://beginnersbook.com/\n- https://docs.oracle.com/javase/tutorial\n- http://freefeast.info/difference-between/runtime-polymorphism-and-compile-time-polymorphism/\n\
    - http://www.javabeat.net/what-is-the-difference-between-rejvm-and-jdk/\n- http://www.geeksforgeeks.org/static-class-in-java/\n\
    - http://javarevisited.blogspot.in/2015/04/3-ways-to-prevent-method-overriding/\n\
    - http://mindprod.com/jgloss/interfacevsabstract.\n- http://www.programmerinterview.com/index.php/java-questions/interface-vs-abstract-class/\n\
    - http://www.javaworld.com/article/207721/learn-java/abstract-classes-vs-interfaces.\n\
    \n## Acknowledgements\n\nMy sincere thanks to my family, my friends, my great\
    \ teachers and to all of them who supported this project directly or indirectly.\
    \ Though it is my book I believe that with the help of these extraordinary people\
    \ only, I was able to complete this work. Again thanks to all of them who helped\
    \ me to fulfil this project to motivate others in Java.\n\n# About the Author\n\
    \nVaskaran Sarcar (ME (Software Engineering), MCA, B Sc. (Math)) is a Senior Software\
    \ Engineer at Hewlett India Software Operation Pvt. Ltd. He is working at the\
    \ HP India PPS R&D division since August,2009. He is also the author of the books-\
    \ Design Patterns in C#, Design Patterns in JAVA, Java Design Patterns (A revised\
    \ and enhanced version-coming in December,2015), Operating System: Computer Science\
    \ Interview Series, Easy manifestation and Sweetheart, You Can Also Manifest Your\
    \ Goal. He devoted his early years (2005-2007) in teaching in various engineering\
    \ colleges. Later he got MHRD-GATE Scholarship (India) from 2007-2009. Reading\
    \ and learning new things are passion for him. You can catch him for any comments,\
    \ suggestions or further improvements at: vaskaran@rediffmail.com.\n"
