    # Basic Terms


    JVM


    -It stands for Java Virtual Machine. When we compile the java file, we get a .class
    (not an .exe).This file contains java byte code which is interpreted by JVM. It
    is responsible for loading, verifying and executing the code .We say that JVM
    is platform dependent because it is responsible to convert the bytecodes into
    the machine language for the specific computer/machine.


    JRE


    -It stands for Java Runtime environment. It contains the JVM, the library files
    and the other supporting files. To run a java program, the JRE must be installed
    in the system. So, we can simply say JRE=JVM+ some packages.


    JDK


    -It stands for Java Development Kit. It provides the tool which we need to develop
    java programs and JRE. This tools contains javac.exe, java.exe etc. When we launch
    a java application, it will open the JRE and load the class and then, in turn,
    it will execute the main method. So, we can conclude that JDK=JRE+ Development
    tools.


    Bytecode


    Bytecodes are machine language of the JVM. They provide the instruction set for
    a JVM. In other words, it is a virtual machine language in which java code is
    compiled. JVM comes into the picture because it stands between these bytecodes
    and our physical machine.


    Platform


    -We use the term platform to mean where the program will run. It can be your machine,
    your fully developed OS etc. When we say a language is platform independent, we
    mean that the code of a programmer will not vary across different platforms.


    So once the java program is compiled, we get the bytecodes. These bytecode format
    is same for every platform (Windows/Linux/Solaris etc.).So, we need an interpreter
    who will interpret these bytecode and will produce the machine specific codes.
    Now JVM comes into the picture. Here in Java, these bytecodes are interpreted
    by JVM which is available for all OS. So, to port the java program into a new
    platform, we need to port the java interpreter.


    So the pair -JVM and bytecode make Java portable.


    Note: So the bottom line is that the trio- JVM, JRE and JDK are platform dependent
    (because of the OS dependence) but Java is platform independent.


    We must remember the simple fact: Any machine language is dependent on the OS
    of the machine. So, if we have dependency on the machine specific OS, we are not
    platform independent. Java is platform independent because once the source code
    is compiled into standard bytecodes, those bytecodes are platform independent.
    Because of this facility Sun Microsystem is created the slogan WORA (Write Once
    Run Anywhere) for Java.


    IDE


    It stands for Integrated Development Environment. They provide the facilities
    for software development. In general, they are very smart- they provide us intelligent
    code completion technique. They can also highlight/suggest about different kinds
    of possible fixes in our code. An IDE should have a source editor, a debugger
    and the automation tools to build the application. IDE’s, in general, contain
    a compiler or an interpreter (or both). We have used eclipse here which contains
    both of these.


    # Installation


    We need two major things.


    1\. JDK


    2\. IDE


    Visit the page:


    [http://www.oracle.com/technetwork/java/javase/downloads/index.html](http://www.oracle.com/technetwork/java/javase/downloads/index.html)


    Or


    To download JDK, directly go here:'
