    \ are preferred when we are trying to implement the concept of multiple inheritance.\n\
    \nBut at the same time we also remember that if we need to add a new method in\
    \ an interface, then we need to track down all the implementation/s of that interface\
    \ and we need to put the concrete implementation for that method in all those\
    \ places. An abstract class is ahead here-we can add a new method in an abstract\
    \ class with a default implementation and our existing code can run smoothly.\n\
    \nSo, now Java has taken special care to this point and Java 8 has introduced\
    \ the use of default keyword. In Java 8, we can prefix the word default before\
    \ our intended method signature and can provide a default implementation. Interface\
    \ methods are public by default, so, we do not need to mark it by the keyword\
    \ public.\n\nImplementation-6:\n\nConsider the below implementation:\n\npackage\
    \ javaclassnotes.programs;\n\ninterface MyDefaultInterface\n\n{\n\n void show();\n\
    \n default  void defaultMethod()\n\n              {\n\n                           \
    \ System.out.println(\"It is a default implementation in the interface\");\n\n\
                  }\n\n}\n\nclass MyClass6 implements  MyDefaultInterface\n\n{\n\n\
    \ @Override\n\n public  void show()\n\n              {\n\n                           \
    \ System.out.println(\"MyClass is implementing the Interface method.\");             \
    \              \n\n              }\n\n}\n\npublic  class UseOfDefaultEx\n\n{\n\
    \n public  static  void main(String args[])\n\n              {\n\n             \
    \               System.out.println(\"***Interface Example.Demo-6***\");\n\n             \
    \               System.out.println(\"***Use of default***\");\n\nMyDefaultInterface\
    \ interfaceOb=new MyClass6();\n\n interfaceOb.show();\n\n interfaceOb.defaultMethod();\n\
    \n              }\n\n}\n\nOutput:\n\n![](images/00029.jpeg)\n\nAssignment:\n\n\
    You have two classes- A and B. Class A is containing an abstract method showA().You\
    \ also have an Interface called Inter. In Inter, you have a method showInter().Now\
    \ write a simple program where B will implement the methods defined in A and Inter.\n\
    \n# Package\n\nConsider a simple scenario. Can you use the same class name twice\
    \ in a java file? No. Compiler will raise the issue and it will point towards\
    \ this naming collision. So we need to choose unique naming conventions each time\
    \ whenever we are going to define a class. But we must remember that in real world\
    \ programming, class name should be meaningful enough and so there is a possibility\
    \ that two different programmer in a project are going to choose the same name\
    \ for their class. Then how we can deal with those situations? Package will rescue\
    \ us in those scenarios.\n\nWe can bundle our classes/interfaces etc. inside our\
    \ own packages. Packages help us to avoid naming conflicts and/or to control the\
    \ visibility. We can control the visibility inside a package in such a way that\
    \ our particular class may or may not be exposed to outside world (both inside\
    \ and outside packages).\n\nPackages are reflected as directories. Creating a\
    \ package in eclipse is quite easy. We do not even think about how Java runtime\
    \ is going to find the proper packages or classes inside it. Otherwise, we need\
    \ to put special attention to the CLASSPATH environment variable.\n\nWe must remember\
    \ about the following points:\n\n1\\. Package statement should be on top of our\
    \ source file. If we do not explicitly define this statement, then all the classes/interfaces\
    \ etc. will be in the current default package.\n\n2\\. When one class refers another\
    \ class inside the same package, package statement need not to be included.\n\n\
    Otherwise we need to use fully qualified class name like <packagename>.<classname>\
    \ or we need to use import statement.\n\n3\\. Whole package can be imported like:\n\
    \nimport  <packagename>.*;\n\nOr if we want to import only a particular class\
    \ from a package, use:\n\nimport  <packagename>.<classname>\n\n4\\. The name of\
    \ the package must follow the directory structure.\n\nCreating a Package in Eclipse\
    \ IDE:\n\n1\\. Click File menu -> New ->Package\n\n![](images/00030.jpeg)\n\n\
    2\\. Supply the required information and click finish.\n\n![](images/00031.jpeg)\n\
    \n3\\. Now you’ll see the package in your package explorer view e.g. it may look\
    \ like as below:\n\n![](images/00032.jpeg)\n\n[Note: here in this package, already\
    \ there are some packages and classes-which we made earlier.]\n\n4\\. Now Right\
    \ click the package name->new->Class/Package etc to put classes/sub packages etc.\
    \ inside the created package. It may have the following structure:\n\n![](images/00033.jpeg)\n\
    \n[Note: here in this package, already there are some classes-which we made earlier.]\n\
    \nImplementation:\n\nNow let us go through an example. Consider two travel companies-a\
    \ and b. Company a conducts tours for Goa and Kerala. Company b conducts tours\
