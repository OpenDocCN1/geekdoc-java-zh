    \ Java, all classes in `java.lang` package, are imported by default.\n2. You must\
    \ remember the visibility control mechanism with the following table:\n\n| | public\
    \ | protected | private | Default/No modifier |\n| :--- | :--- | :--- | :--- |\
    \ :--- |\n| Same class | Yes | Yes | Yes | Yes |\n| Subclass in same package |\
    \ Yes | Yes | No | Yes |\n| Non-subclass in same package | Yes | Yes | No | Yes\
    \ |\n| Subclass in different package | Yes | Yes | No | No |\n| Non-subclass in\
    \ different package | Yes | No | No | No |\n\n# OOPs Concepts Revisited\n\nThe\
    \ fundamental features of object oriented programming is as below:\n1. Class and\
    \ Object\n2. Polymorphism\n3. Abstraction\n4. Encapsulation\n5. Inheritance\n\
    6. Message passing\n7. Dynamic binding.\n\nTeacher asks:\nCan you tell me how\
    \ we covered these in Java?\n1. Class and Object-Almost in every example, we used\
    \ classes and objects.\n2. Polymorphism-Method overloading and overriding.\n3.\
    \ Abstraction-Abstract classes and Interfaces.\n4. Encapsulation-Each class can\
    \ be a more effective example can be a class with private member and getter-setter.\n\
    5. Inheritance-Examples in inheritance.\n6. Message passing-Mostly observed in\
    \ multithreaded environment. But also dynamic dispatch can be treated in this\
    \ category.\n7. Dynamic binding –Through the example in dynamic dispatch (method\
    \ overriding).\n\nStudents ask:\nWhat are the different types of polymorphism?\n\
    1. Compile time polymorphism-Which method to call is resolved by the compiler.\
    \ So, it is also known as early binding. Since the call is resolved early, it\
    \ is faster in general.\n2. Run time polymorphism (Or, Dynamic Polymorphism)–Which\
    \ method to call will be decided during runtime. That is why, it is also known\
    \ as late binding it is slower compared to early binding.\n\nStudents ask:\nDoes\
    \ Java support pointers like C/C++?\nNo. One of main reason is we can access beyond\
    \ our intended data which is really dangerous. Apart from this, if we support\
    \ pointers, memory management will become tedious, because in many cases they\
    \ are error-prone. We believe, as long as we are in the Java execution environment,\
    \ we’ll feel the need of using a pointer.\n\n# Use of static keyword\n\nSometimes\
    \ we need variables that can be used without creating any object of that class.\
    \ To serve that purpose, we tag the members with `static`. When a member is preceded\
    \ with the keyword `static`, the member can be accessed before any object of that\
    \ class is created i.e. we do not need to reference any object in this context.\n\
    \nConsider the below example:\nImplementation-1:\n```java\npackage javaclassnotes.programs;\n\
    class StaticDemo1 {\n    //static members\n    int myStaticInt=5;\n    static\
    \ String myStaticString=\"I am a string\";\n    //Non static members\n    int\
    \ myStaticInt=25;\n}\n\npublic class StaticEx1 {\n    public void main(String\
    \ args[]) {\n        System.out.println(\"***Use of static variables***\");\n\
    \        //We can call static members with the class itself\n        //No need\
    \ to create objects\n        System.out.println(\"myStaticInt is : \"+StaticDemo1.myStaticInt);\n\
    \        System.out.println(\"myStaticString is : \"+StaticDemo1.myStaticString);\n\
    \        //Error:We cannot call instance variable with class name.\n        //System.out.println(\"\
    myNonStaticInt is : \"+StaticDemo1.myStaticInt);\n    }\n}\n```\nOutput:\n![](images/00036.jpeg)\n\
    Analysis: We can see that we are accessing the static members with `<classname>.<memberName>`\
    \ i.e. we do not need to create an object to access those variables.\n\nImplementation-2:\n\
    Let us go through another example. Here we’ll test static variables initialization\
    \ with a static method and a static block.\n```java\npackage javaclassnotes.programs;\n\
    class StaticEx2 {\n    //static members\n    static int myStaticInt=1;\n    static\
    \ String myStaticString=\"No string\";\n    //instance variable\n    int nonStaticInt=25;\n\
    \    //static method\n    static void setValuesToStaticMembers() {\n        System.out.println(\"\
    I am inside the static method now.\");\n        System.out.println(\"myStaticInt=\"\
    + myStaticInt);\n        System.out.println(\"myStaticString=\"+ myStaticString);\n\
    \        //error:only access static fields from here\n        //System.out.println(\"\
    nonStaticInt=\"+ nonStaticInt);\n    }\n    //static block\n    static {\n   \
    \     System.out.println(\"I am a block\");\n        System.out.println(\"Before\
    \ change :\");\n        System.out.println(\"myStaticInt=\"+ myStaticInt);\n \
    \       System.out.println(\"myStaticString=\"+ myStaticString);\n        System.out.println(\"\
    I am changing the values now...\");\n        myStaticInt=5;\n        myStaticString=\"\
    I am a string\";\n    }\n}\n\npublic class StaticEx {\n    public static void\
    \ main(String args[]) {\n        System.out.println(\"***Use of static methods\
    \ and static blocks***\");\n        StaticEx2.setValuesToStaticMembers();\n  \
    \  }\n}\n```\nOutput:\n![](images/00037.jpeg)\n\nAnalysis:\nLook at the output\
    \ carefully. Look at the order of the output. You can see the statements in the\
    \ static block printed on the top of output. Even before the execution of the\
    \ static block, the static variables were initialized. Later static block changed\
    \ the values (which are reflected clearly when we call the static method).\n\n\
    It is because as soon as a static class loaded, all static statements run.\n"
