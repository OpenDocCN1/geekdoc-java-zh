    \n/*\n\nimport tour.company.a.KeralaPackage;\n\nimport tour.company.a.GoaPackage;\n\
    \n//or, simply use the following statement*/\n\nimport tour.company.a.*;\n\n//For\
    \ company B packages\n\nimport tour.company.b.*;\n\npublic  class PackageEx {\n\
    \n public  static  void main(String args[])\n\n              {\n\n             \
    \               System.out.println(\"***Package Example Demo***\");\n\n // Only\
    \ CompanyA has KeralaPackage\n\nKeralaPackage keralaPackageInA=new KeralaPackage();\n\
    \n keralaPackageInA.ShowPrice();\n\n //Only CompanyB has AndamanPackage\n\nAndamanPackage\
    \ companyBAndamanPackage=new AndamanPackage();\n\n companyBAndamanPackage.ShowTariff();\n\
    \n //Company A and B both have package for //Goa.\n\ntour.company.a.GoaPackage\
    \ companyAGoaPackage=new tour.company.a.GoaPackage();\n\n //GoaPackage companyAGoaPackage=new\
    \ //GoaPackage();\n\n companyAGoaPackage.ShowPrice();\n\ntour.company.b.GoaPackage\
    \ companyBGoaPackage=new tour.company.b.GoaPackage();\n\n companyBGoaPackage.ShowTariff();\n\
    \n              }\n\n}\n\nOutput:\n\n![](images/00035.jpeg)\n\nNote:\n\n1\\. Remember\
    \ that in Java, all classes in java.lang package, are imported by default.\n\n\
    2\\. You must remember the visibility control mechanism with the following table:\n\
    \n|  | public | protected | private | Default/No modifier |\n\n| Same class |\
    \ Yes | Yes | Yes | Yes |\n\n| Subclass in same package | Yes | Yes | No | Yes\
    \ |\n\n| Non-subclass in same package | Yes | Yes | No | Yes |\n\n| Subclass in\
    \ different package | Yes | Yes | No | No |\n\n| Non-subclass in different package\
    \ | Yes | No | No | No |\n\n# OOPs Concepts Revisited\n\nThe fundamental features\
    \ of object oriented programming is as below:\n\n1\\. Class and Object\n\n2\\\
    . Polymorphism\n\n3\\. Abstraction\n\n4\\. Encapsulation\n\n5\\. Inheritance\n\
    \n6\\. Message passing\n\n7\\. Dynamic binding.\n\nTeacher asks:\n\nCan you tell\
    \ me how we have covered these in Java?\n\n1\\. Class and Object-Almost in every\
    \ example, we have used classes and objects.\n\n2\\. Polymorphism-Method overloading\
    \ and overriding.\n\n3\\. Abstraction-Abstract classes and Interfaces.\n\n4\\\
    . Encapsulation-Each class can be an example. A more effective example can be\
    \ a class with a private member and getter-setter.\n\n5\\. Inheritance-Examples\
    \ in inheritance.\n\n6\\. Message passing- Mostly observed in a multithreaded\
    \ environment. But also the dynamic method dispatch example can be treated in\
    \ this category.\n\n7\\. Dynamic binding –Through the example in the dynamic method\
    \ dispatch (method overriding).\n\nStudents ask:\n\nWhat are the different types\
    \ of polymorphism?\n\n1\\. Compile time polymorphism-Which method needs to call\
    \ is resolved by the compiler. So, it is also known as early binding. Since the\
    \ call is resolved early, it is faster in general.\n\n2\\. Run time polymorphism\
    \ (Or, Dynamic Polymorphism) –Which method needs to call will be decided during\
    \ runtime. That is why, it is also known as late binding and it is slower compared\
    \ to early binding.\n\nStudents ask:\n\nDoes Java support pointers like C/C++?\n\
    \nNo. One of the main reason is we can access beyond our intended data boundary\
    \ which is really dangerous. Apart from this, if we support pointers, memory management\
    \ will become tedious, because, in many cases, they are error-prone. We believe,\
    \ as long as we are in the Java execution environment, we’ll never feel the need\
    \ of using a pointer.\n\n# Use of static keyword\n\nSometimes we need variables\
    \ that can be used without creating any object of that class. To serve that purpose,\
    \ we tag the member/s with the keyword static. When a member is preceded with\
    \ the keyword static, the member can be accessed before any object of that class\
    \ is created i.e. we do not need to reference any object in this context.\n\n\
    Consider the below example:\n\nImplementation-1:\n\npackage javaclassnotes.programs;\n\
    \nclass StaticDemo1\n\n{\n\n //static members\n\n static  int  myStaticInt=5;\n\
    \n static String myStaticString=\"I am a static string\";\n\n //Non static members\n\
    \n int  myNonStaticInt=25;\n\n}\n\npublic  class StaticEx1\n\n{\n\n public  static\
    \  void main(String args[])\n\n              {\n\n                           \
    \ System.out.println(\"***Use of static variables***\");\n\n //We can call static\
    \ members with the class name itself\n\n //No need to create objects\n\n             \
    \               System.out.println(\"myStaticInt value is : \"+StaticDemo1.myStaticInt);\n\
    \n                            System.out.println(\"myStaticString value is : \"\
    +StaticDemo1.myStaticString);\n\n //Error:We cannot call instance variable with\
    \ class name.\n\n //System.out.println(\"myNonStaticInt value is : \"+StaticDemo1.myNonStaticInt);\n\
    \n              }\n\n}\n\nOutput:\n\n![](images/00036.jpeg)\n\nAnalysis: We can\
    \ see that we are accessing the static members with <classname>.<member Name>\
    \ i.e. we do not need to create an object to access those variables.\n\nImplementation-2:\n\
    \nLet us go through another example. Here we’ll test static variables initialization\
    \ with a static method and a static block.\n\npackage javaclassnotes.programs;\n\
    \nclass StaticEx2\n\n{\n\n //static members\n\n static  int  myStaticInt=1;\n\n\
    \ static String myStaticString=\"No string\";\n\n             //instance variable\n\
    \n int  nonStaticInt=25;\n\n //static method\n\n static  void setValuesToStaticMembers()\n\
    \n              {\n\n                            System.out.println(\"I am inside\
    \ the static method now.\");             \n\n                            System.out.println(\"\
    myStaticInt=\"+ myStaticInt);             \n\n                            System.out.println(\"\
    myStaticString=\"+ myStaticString);             \n\n                         \
    \ //error:Can access only static fields from here\n\n //System.out.println(\"\
    myNonStaticInt=\"+ myNonStaticInt);             \n\n              }             \n\
    \n //static block\n\n static\n\n              {\n\n                           \
    \ System.out.println(\"I am a static block\");             \n\n                           \
    \ System.out.println(\"Before my change :\");             \n\n                           \
    \ System.out.println(\"myStaticInt=\"+ myStaticInt);             \n\n             \
    \               System.out.println(\"myStaticString=\"+ myStaticString);             \n\
    \n                            System.out.println(\"I am changing the values now...\"\
    );             \n\n myStaticInt=5;\n\n myStaticString=\"I am a static string\"\
    ;                           \n\n              }\n\n public  static  void main(String\
    \ args[])\n\n              {\n\n                            System.out.println(\"\
    ***Use of static methods and static blocks***\");\n\n                           \
    \ StaticEx2.setValuesToStaticMembers();\n\n              }\n\n}\n\nOutput:\n\n\
    ![](images/00037.jpeg)\n\nAnalysis:\n\nLook at the output carefully. Look at the\
    \ order of the output. You can see the statements in the static block printed\
    \ on the top of output. Even before the execution of the static block, the static\
    \ variables were initialized. Later static block changed the values (which are\
    \ reflected clearly when we call the static method).\n\nIt is because as soon\
    \ as a static class loaded, all static statements run."
