    中编写程序，最重要的是，如何进阶。


    5. 最后，程序已通过 `eclipse` 进行测试。尽管你没有强制要求学习 `eclipse`。你也可以直接在你偏好的 IDE 中运行这些程序。作者选择
    `eclipse` 是因为它被广泛用于开发 `Java` 应用。


