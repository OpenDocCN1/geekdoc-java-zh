    \nWe’ll examine another use of `super` with the following example. Here we’ll\
    \ see that even if the instance variable of the parent class becomes hidden by\
    \ the child class’s instance variable, `super` can allow us to access the instance\
    \ variable in super class.\n\n```java\npackage javaclassnotes.testprograms;\n\n\
    class A3 {\n    int a;\n    A3() {\n        a=25;\n    }\n}\nclass B3 extends\
    \ A3 {\n    int a; // will hide a in A3\n    B3() {\n        super.a=12; // for\
    \ parent class\n        a=50; // for child class\n    }\n    void display() {\n\
    \        System.out.println(\"a in parent class=\"+ super.a);\n        System.out.println(\"\
    a in child class=\"+ a);\n    }\n}\nclass Test3 {\n    public static void main(String\
    \ args[]) {\n        System.out.println(\"***The of super Demo-2***\");\n    \
    \    B3 obB3=new B3();\n        obB3.display();\n    }\n}\n```\n\nOutput: ![](images/00016.jpeg)\n\
    \nNote: Students ask: Can we use `super` keyword to call methods that are hidden\
    \ by a subclass? Yes.\n\n# Overloading\n\nTeacher asks: Consider the below segments.\
    \ Do you notice any pattern?\n\n```java\nint sum(int x,int y) {\n    return x+y;\n\
    }\ndouble sum(double x,double y) {\n    return x+y;\n}\nString sum(String s1,String\
    \ s2) {\n    return s1.concat(s2);\n}\n```\n\nStudents respond: Yes sir. We are\
    \ seeing all of the methods have the same name `sum` but from their method bodies\
    \ it appears that each method is doing different things.\n\nTeacher says: yes.\
    \ You are correct. When we do this kind of coding, we term it as method overloading.\
    \ But you should notice that though method names are same but method signatures\
    \ are different here.\n\nStudents ask: What is method signature?\n\nIdeally method\
    \ name with number of the parameters consist the method signature. Java compiler\
    \ can distinguish among methods with same name but different parameter list. So,\
    \ for Java compiler, `double sum(double x, double y)` is different from `int sum(int\
    \ x, int y)`.\n\nConsider the below program. Here we represent method overloading\
    \ with the following example:\n\n```java\npackage javaclassnotes.programs;\n\n\
    class Addition {\n    int sum(int x,int y) {\n        return x+y;\n    }\n   \
    \ double sum(double x,double y) {\n        return x+y;\n    }\n    String sum(String\
    \ s1,String s2) {\n        return s1.concat(s2);\n    }\n}\n\npublic class Overloading\
    \ {\n    public static void main(String args[]) {\n        System.out.println(\"\
    ***Method Overloading Demo***\n        Addition additionOb=new Addition();\n \
    \       int sumIntegers=additionOb.sum(10,20);\n        System.out.println(\"\
    Sum of 10 and 20=\"+sumIntegers);\n        double sumDoubles=additionOb.sum(10.5,20.7);\n\
    \        System.out.println(\"Sum of 10.5 and 20.7=\"+sumDoubles);\n        String\
    \ sumStrings=additionOb.sum(\"Amit\",\"Kumar\");\n        System.out.println(\"\
    Concatenation of Amit and Kumar=\"+sumStrings);\n    }\n}\n```\n\nOutput: ![](images/00017.jpeg)\n\
    \nTeacher asks: Is it example of method overloading?\n\n```java\nint sum(int x,int\
    \ y) {\n    return x+y;\n}\nint sum(int x,int y,int z) {\n    return x+y+z;\n\
    }\n```\nAnswer: Yes.\n\nTeacher asks: Is it example of method overloading?\n\n\
    ```java\nint sum(int x,int y) {\n    return x+y;\n}\ndouble sum(int x,int y) {\n\
    \    return x+y;\n}\n```\n\nAnswer: No. Compiler will not consider “return type”\
    \ to differentiate these methods. Return type is not considered as a part of method\
    \ signature.\n\nStudents ask: Sir, can we have constructor overloading?\n\nTeacher:\
    \ Definitely. You can write a similar program for constructor overloading.\n\n\
    ```java\npackage javaclassnotes.testprograms;\n\nclass A1 {\n    A1() {\n    \
