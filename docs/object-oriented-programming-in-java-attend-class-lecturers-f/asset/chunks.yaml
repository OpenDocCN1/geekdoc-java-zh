    \n    {\n\n     //your code…\n\n    }\n\nHierarchical inheritance: Multiple child\
    \ class can be derived from one base class.\n\n![](images/00010.jpeg)\n\nFigure:\
    \ Hierarchical inheritance\n\nThe format of code is like this:\n\n  class  Parent\n\
    \n    {\n\n//your code…\n\n    }\n\n class  Child1  extends Parent\n\n    {\n\n\
    //your code…\n\n    }\n\n class  Child2 extends Parent\n\n    {\n\n//your code…\n\
    \n    }\n\nMultilevel inheritance: Here the parent class has the grandchild.\n\
    \n![](images/00011.jpeg)\n\nFigure: Multilevel inheritance\n\nTeacher asks:\n\n\
    Now try to implement the concept with Java code.\n\nSolution:\n\nThe format of\
    \ code is like this:\n\n    class  Parent\n\n    {\n\n//your code…\n\n    }\n\n\
    \ class  Child  extends  Parent\n\n    {\n\n//your code…\n\n    }\n\n class  GrandChild\
    \  extends Child\n\n    {\n\n//your code…\n\n    }\n\nMultiple inheritance: Here\
    \ a child can derive from multiple Parents.\n\n![](images/00012.jpeg)\n\nFigure:\
    \ Multiple inheritance\n\nNote that, Java does not support this type of inheritance\
    \ (through class).i.e.in Java, a child class cannot derive from more than one\
    \ parent class. To deal with this type of situation we need to understand interfaces.\n\
    \nNote: There is another type of inheritance which is termed as hybrid inheritance.\
    \ This is a combination of one or more types of the above inheritance/s.\n\nA\
    \ simple program on Inheritance:\n\nclass ParentClass\n\n{\n\npublic  void show()\n\
    \n  {\n\n    System.out.println(\"I am in Parent Class\");\n\n  }\n\n}\n\nclass\
