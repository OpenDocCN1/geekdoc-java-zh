  trans: "\n\n```java\n    }\n\n    public void completeMethod2() {\n        System.out.println(\"\
    Another complete method.\");\n    }\n}\n```\n\n我们可以编译这个程序吗？\n\n可以。它仍然可以编译，但到目前为止，你无法为该类创建对象。\n\
    \n**学生提问：**\n\n那么老师，你是如何从抽象类中创建对象的呢？\n\n我们已经提到过我们不能从抽象类中创建对象。\n\n**学生提问：**\n\n\
    老师，在我看来，如果抽象类没有被继承，它几乎没有任何用处。我的理解正确吗？\n\n是的。\n\n**学生提问：**\n\n如果一个类继承了抽象类，它必须实现所有的抽象方法吗？\n\
    \n它可能实现也可能未实现父类中所有的抽象方法。简单的公式是：如果你想创建一个类的对象，那么该类必须是完整的，即它不应该包含任何抽象方法。因此，如果子类不能提供所有抽象方法的实现（即方法体），它应该再次用\
    \ `abstract` 关键字标记，如下例所示。\n\n```java\nabstract class AbstractClass {\n    public\
    \ abstract void inCompleteMethod1();\n    public abstract void inCompleteMethod2();\n\
    }\n\nabstract class child1 extends AbstractClass {\n    @Override\n    public\
    \ void inCompleteMethod1() {\n        System.out.println(\"Implementing the inCompleteMethod1()\"\
    );\n    }\n}\n```\n\n**学生提问：**\n\n具体类是指不是抽象的类——我的理解正确吗？\n\n是的。\n\n**学生提问：**\n\n\
    我们可以对一个方法同时标记为 `abstract` 和 `final` 吗？\n\n不可以。想想一下，通过声明 `abstract`，你想要重写；而通过声明\
    \ `final`，你想要防止重写。\n\n**学生提问：**\n\n在 Java 中有构造函数重写吗？\n\n没有。\n\n# 接口\n\n通过接口，我们声明了将实现的内容，但没有指定如何实现它。这些类似于类，但没有实例变量，并且所有的方法在声明时都没有方法体（即方法实际上是抽象的）。\n\
    \n借助接口，我们可以在运行时支持动态方法解析。一旦定义，一个类可以实现任意数量的接口。\n\n### 实现-1：\n\n```java\npackage\
    \ javaclassnotes.programs;\n\ninterface MyInterface {\n    void show();\n}\n\n\
    class MyClass implements MyInterface {\n    @Override\n    public void show()\
    \ {\n        System.out.println(\"MyClass is implementing the Interface method.\"\
    );\n    }\n}\n\npublic class InterfaceEx1 {\n    public static void main(String\
    \ args[]) {\n        System.out.println(\"***Interface Example.Demo-1***\");\n\
    \        MyClass myClassOb=new MyClass();\n        myClassOb.show();\n    }\n\
    }\n```\n\n输出：\n![](img/00025.jpeg)\n\n### 实现-2：\n\n接口有两个方法。但一个类只实现了其中一个。那么类本身就变成了抽象类。\n\
    \n```java\npackage javaclassnotes.programs;\n\ninterface MyInterface2 {\n    void\
    \ show1();\n    void show2();\n}\n\nabstract class MyClass2 implements MyInterface2\
    \ {\n    @Override\n    public void show1() {\n        System.out.println(\"MyClass2\
    \ is implementing the show1() method.\");\n    }\n}\n```\n注意：所以公式是：类需要实现接口中定义的所有方法。否则，它将是一个抽象类。\n\
    \n### 实现-3：\n\n一个实现多个接口的类。\n\n```java\npackage javaclassnotes.programs;\n\ninterface\
    \ MyInterfaceA {\n    void show3A();\n}\n\ninterface MyInterfaceB {\n    void\
    \ show3B();\n}\n\nclass MyClass3 implements MyInterfaceA, MyInterfaceB {\n   \
    \ @Override\n    public void show3A() {\n        System.out.println(\"MyClass3\
    \ is implementing the show3A() method of Interface3A\");\n    }\n    @Override\n\
    \    public void show3B() {\n        System.out.println(\"MyClass3 is implementing\
    \ the show3B() method of Interface3B\");\n    }\n}\n\npublic class InterfaceEx3\
    \ {\n    public static void main(String args[]) {\n        System.out.println(\"\
    ***Interface Example.Demo-3***\");\n        MyClass3 myClassOb=new MyClass3();\n\
    \        myClassOb.show3A();\n        myClassOb.show3B();\n    }\n}\n```\n\n输出：\n\
    ![](img/00026.jpeg)\n\n**学生提问：**\n\n在上面的程序中，接口方法名是不同的。但如果两个接口都包含相同的方法名，我们可以实现它们吗？\n\
    \n请看以下实现。\n\n### 实现-4：\n\n```java\npackage javaclassnotes.programs;\n//两个接口都具有相同的方法名\
    \ \"show()\".\ninterface MyInterface4A {\n    void show();\n}\n\ninterface MyInterface4B\
    \ {\n    void show();\n}\n\nclass MyClass4 implements MyInterface4A, MyInterface4B\
    \ {\n    @Override\n    public void show() {\n        System.out.println(\"MyClass4\
    \ is implementing the show() method \");\n    }\n}\n\npublic class InterfaceEx4\
    \ {\n    public static void main(String args[]) {\n        System.out.println(\"\
    ***Interface Example.Demo-4***\");\n        // 所有的三次调用都是合法的。\n        MyClass4\
    \ myClassOb=new MyClass4();\n        myClassOb.show();\n        MyInterface4A\
    \ inter4A=myClassOb;\n        inter4A.show();\n        MyInterface4B inter4B=myClassOb;\n\
    \        inter4B.show();\n    }\n}\n```\n输出：\n![](img/0027.jpeg)\n\n**学生提问：**\n\
    \n接口可以继承另一个接口吗？它可以继承，但不能实现（根据定义）。\n\n```java\npackage javaclassnotes.programs;\n\
    \ninterface Interface1 {\n    void show1Method();\n}\n\ninterface Interface2 {\n\
    \    void show2Method();\n}\n\n//接口继承接口\ninterface Interface3 extends Interface1,\
    \ Interface2 {\n    void show3Method();\n}\n\nclass MyClass5 implements Interface3\
    \ {\n    //现在 MyClass5 需要实现 Interface1、2 和 Interface3 方法\n    @Override\n    public\
    \ void show1Method() {\n        System.out.println(\"MyClass5 is implementing\
    \ the show1Method() \");\n    }\n    @Override\n    public void show2Method()\
    \ {\n        System.out.println(\"MyClass5 is implementing the show2Method() \"\
    );\n    }\n    @Override\n    public void show3Method() {\n        System.out.println(\"\
    MyClass5 is implementing the show3Method() \");\n    }\n}\n\npublic class InterfaceEx5\
    \ {\n    public static void main(String args[]) {\n        System.out.println(\"\
    ***Interface Example.Demo-5***\");\n        System.out.println \"***接口可以继承接口***\"\
    );\n        MyClass5 myClassOb=new MyClass5();\n        myClassOb.show1Method();\n\
    \        myClassOb.show2Method();\n        myClassOb.show3Method();\n    }\n}\n\
    ```\n\n输出：\n![](img/0028.jpeg)\n\n### 标记/标记接口：\n\n一个空的接口被称为标记接口（tag interface）。\n\
    \n```java\n//标记接口\ninterface ITaggingInterface {\n}\n```\n\n**老师提问：**\n\n你能告诉我吗：为什么我们需要标记接口？\n\
    \n1. 我们可以创建一个公共父类。\n2. 类可以声明是某个集合的成员，例如，如果我们的类实现了 `Serializable` 接口，它就变成了可序列化的。因此，我们的类通过多态实际上变成了接口类型。即使是实现标记接口的类，不需要定义任何新方法，因为接口本身没有任何此类方法。\n\
    \n**老师提问：**\n\n你能告诉我吗：抽象类和接口之间的区别是什么？\n\n"
- fmt: "\n# Abstract Class vs Interface\n\n1. An `abstract class` can have concrete\
    \ methods in it but an `interface` cannot have that. [We’ll come to this point\
    \ later. Now in Java 8, we have a keyword called `default`. We can use this keyword\
    \ in an `interface` to provide some default implementation, see below in our `implementation-6].\n\
    \n2. An `abstract class` can have only one parent class (can extend from another\
    \ abstract class or concrete class), an `interface` can have multiple parent interfaces.\
    \ An `interface` can extend from other interface/s only.\n\n3. Members of an `interface`\
    \ is by default `public`. An `abstract class` can have other flavors e.g. `private`,\
    \ `protected` etc.\n\n4. Variables in an `interface` is by default `static final`.\
    \ An `abstract class` can have non-final variables.\n\n## Discussion\n\nStudents\
    \ ask:\n\"Sir, then how we decide-whether we should use an abstract class or an\
    \ interface?\"\n\nGood question. I believe that if we want to have some centralized\
    \ or default behavior/s, `abstract class` is a better choice .Because here we\
    \ can provide some default implementation( in case of abstract class).On the other\
    \ hand, `interface` implementation starts from a scratch. They indicate some kind\
    \ of rules-what to be done (e.g. you must implement the method) but they will\
    \ not enforce you how to be done. Also interfaces are preferred when we are trying\
    \ to implement the concept of multiple inheritance.\n\nBut at the same time we\
    \ also remember that if we need to add a new method in an `interface`, then we\
    \ need to track down all the implementation/s of that interface and we need to\
    \ put the concrete implementation for that method in all those places. An `abstract\
    \ class` is ahead here-we can add a new method in an `abstract class` with a default\
    \ implementation and our existing code can run smoothly.\n\nSo, now Java has taken\
    \ special care to this point and Java 8 has introduced the use of `default` keyword.\
    \ In Java 8, we can prefix the word `default` before our intended method signature\
    \ and can provide a default implementation. Interface methods are `public` by\
    \ default, so, we do not need to mark it by the keyword `public`.\n\n## Implementation-6\n\
    \nConsider the below implementation:\n\n```java\npackage javaclassnotes.programs;\n\
    \ninterface MyDefaultInterface\n{\n    void show();\n\n    default void defaultMethod()\n\
    \    {\n        System.out.println(\"It is a default implementation in the interface\"\
    );\n    }\n}\n\nclass MyClass6 implements MyDefaultInterface\n{\n    @Override\n\
    \    public void show()\n    {\n        System.out.println(\"MyClass is implementing\
    \ the Interface method.\");\n    }\n}\n\npublic class UseOfDefaultEx\n{\n    public\
    \ static void main(String args[])\n    {\n        System.out.println(\"***Interface\
    \ Example.Demo-6***\");\n        System.out.println(\"***Use of default***\");\n\
    \        MyDefaultInterface interfaceOb=new MyClass6();\n        interfaceOb.show();\n\
    \        interfaceOb.defaultMethod();\n    }\n}\n```\n\nOutput:\n![](images/00029.jpeg)\n\
    \n## Assignment\n\nYou have two classes- `A` and `B`. Class `A` is containing\
    \ an abstract method `showA()`. You also have an Interface called `Inter`. In\
    \ `Inter`, you have a method `showInter()`. Now write a simple program where `B`\
    \ will implement the methods defined in `A` and `Inter`.\n\n# Package\n\nConsider\
    \ a simple scenario. Can you use the same class name twice in a java file? No.\
    \ Compiler will raise the issue and it will point towards this naming collision.\
    \ So we need to choose unique naming conventions each time whenever we are going\
    \ to define a class. But we must remember that in real world programming, class\
    \ name should be meaningful enough and so there is a possibility that two different\
    \ programmer in a project are going to choose the same name for their class. Then\
    \ how we can deal with those situations? `Package` will rescue us in those scenarios.\n\
    \nWe can bundle our classes/interfaces etc. inside our own packages. Packages\
    \ help us to avoid naming conflicts and/or to control the visibility. We can control\
    \ the visibility inside a package in such way that our particular class may or\
    \ not be exposed to outside (both inside and outside packages). Packages are reflected\
    \ as directories. Creating a package in eclipse is quite easy. We do not even\
    \ think how Java runtime is going to find proper packages or classes inside it.\
    \ Otherwise, we need to put special attention to `CLASSP` environment variable.\n\
    \nWe must remember about the following points:\n1. `package` statement should\
    \ be on top of our source file. If we do not explicitly define this, then all\
    \ classes/interfaces etc. will be in current default package.\n2. When one class\
    \ refers another class inside the same package, `package` statement need to be\
    \ included. Otherwise we need to use fully qualified name `<packagename>.<classname>`\
    \ or we need to use `import` statement.\n3. Whole package can be imported: `import\
    \ <packagename>.*;` Or if we want to import only a particular class from a package,\
    \ use: `import <packagename>.<classname>`\n4. The name of the package must follow\
    \ directory structure.\n\n### Creating a Package in Eclipse\n1. Click `File` ->\
    \ `New` -> `Package` (images/0030.jpeg)\n2. Supply the required information and\
    \ click finish (images/0031.jpeg)\n3. Now you’ll see the package in package explorer\
    \ view e.g. it look like as below (images/0032.jpeg) [Note: here in this package,\
    \ there are some packages and classes-which we made earlier.]\n4. Now Right click\
    \ the package name->`New`->`Class/Package` etc to put classes/sub packages inside\
    \ the created package. It may have the following structure (images/0033.jpeg)\
    \ [Note: here in this package, there are some classes-which we made earlier.]\n\
    \n### Implementation\nNow us go through an example. Consider two travel companies-a`\
    \ and `b`. Company `a` conducts tours for Goa and Kerala. Company `b` conducts\
    \ tours for Goa and Andaman. Any tourist can seek information from them for any\
    \ tour package. Here we covered both of the following scenarios:\n1. Less challenging:\
    \ Only Company `a` conducts tour for Kerala and Only company `b` conducts tour\
    \ for Andaman.\n2. More Challenging: Notice that both of the companies are providing\
    \ tour for Goa. And we need to get the information through `GoaPackage` Class.\
    \ [See both the packages are using the same class name]\n\nEclipse Package View\
    \ (images/0034.gif)\n\n```java\n// GoaPackage.java [For Company A, in tour.company.a\
    \ package]\npackage tour.company.a;\n\npublic class GoaPackage\n{\n    int basic_price=10000;\n\
    \n    public void ShowPrice()\n    {\n        System.out.println(\"***Tariff for\
    \ Goa tour in Company A***\");\n        System.out.println(\"For two person, Goa\
    \ tour package is Rs. + basic_price*2);\n        System.out.println(\"For four\
    \ person, Goa tour package is Rs. + basic_price*4);\n        System.out.println(\"\
    **************\");\n    }\n}\n\n// KeralaPackage.java [For Company A, in tour.company.a\
    \ package]\npackage tour.company.a;\n\npublic class KeralaPackage\n{\n    int\
    \ basic_price=7000;\n\n    public void ShowPrice()\n    {\n        System.out.println(\"\
    ***Tariff for Kerala tour in Company A***\");\n        System.out.println(\"For\
    \ two person, Kerala tour package is Rs. + basic_price*2);\n        System.out.println(\"\
    For four person, Kerala tour package is Rs. + basic_price*4);\n        System.out.println(\"\
    **************\");\n    }\n}\n\n// AndamanPackage.java [For Company B, in tour.company.b\
    \ package]\npackage tour.company.b;\n\npublic class AndamanPackage\n{\n    int\
    \ basic_price=12000;\n\n    public void ShowTariff()\n    {\n        System.out.println(\"\
    ***Tariff for Andaman tour in Company B***\");\n    }\n}\n```\n"
