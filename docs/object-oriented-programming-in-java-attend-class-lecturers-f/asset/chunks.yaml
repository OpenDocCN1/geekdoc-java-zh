    /*\nimport tour.company.a.KeralaPackage;\nimport tour.company.a.GoaPackage;\n\
    //or, simply use the following statement*/\nimport tour.company.a.*;\n\n//For\
    \ company B packages\nimport tour.company.b.*;\n\npublic class PackageEx {\n \
    \   public static void main(String args[]) {\n        System.out.println(\"***Package\
    \ Example Demo***\");\n        // Only CompanyA has KeralaPackage\n        KeralaPackage\
    \ keralaPackageInA=new KeralaPackage();\n        keralaPackageInA.ShowPrice();\n\
    \n        //Only CompanyB has AndamanPackage\n        AndamanPackage companyBAndamanPackage=new\
    \ AndamanPackage();\n        companyBAndamanPackage.ShowTariff();\n\n        //Company\
    \ A and B both have package for //Goa.\n        tour.company.a.GoaPackage companyAGoaPackage=new\
    \ tour.company.a.GoaPackage();\n        //GoaPackage companyAGoaPackage=new //GoaPackage();\n\
    \        companyAGoaPackage.ShowPrice();\n\n        tour.company.b.GoaPackage\
    \ companyBGoaPackage=new tour.company.b.GoaPackage();\n        companyBGoaPackage.ShowTariff();\n\
    \    }\n}\n```\n\nOutput:\n![](img/00035.jpeg)\n\nNote:\n1. 记住在 Java 中，`java.lang`\
    \ 包中的所有类都是默认导入的。\n2. 你必须记住下表所示的可见性控制机制：\n\n| | public | protected | private |\
    \ Default/No modifier |\n| :--- | :--- | :--- | :--- | :--- |\n| 同一类 | Yes | Yes\
    \ | Yes | Yes |\n| 同包中的子类 | Yes | Yes | No | Yes |\n| 同包中的非子类 | Yes | Yes | No\
    \ | Yes |\n| 不同包中的子类 | Yes | Yes | No | No |\n| 不同包中的非子类 | Yes | No | No | No\
    \ |\n\n# 复习 OOP 概念\n\n面向对象编程的核心特征如下：\n1. 类和对象 (Class and Object)\n2. 多态 (Polymorphism)\n\
    3. 抽象 (Abstraction)\n4. 封装 (Encapsulation)\n5. 继承 (Inheritance)\n6. 消息传递 (Message\
    \ passing)\n7. 动态绑定 (Dynamic binding)\n\n老师问：\n你能告诉我们在 Java 中是如何实现这些内容的吗？\n1.\
    \ 类和对象——几乎在每个例子中，我们使用了类和对象。\n2. 多态——方法重载和方法重写。\n3. 抽象——抽象类和接口。\n4. 封装——每个类都可以是一个更有效的例子，例如一个具有私有成员以及\
    \ getter-setter 方法的类。\n5. 继承——继承的示例。\n6. 消息传递——主要在多线程环境中观察到。但动态分发也可以被归为此类。\n7.\
    \ 动态绑定——通过动态分发中的示例（方法重写）来实现。\n\n学生问：\n多态有哪些不同类型？\n1. 编译时多态——调用哪个方法是由编译器解析的。因此，它也被称为早期绑定\
    \ (early binding)。由于调用在早期就解析了，通常速度更快。\n2. 运行时多态（或动态多态）——调用哪个方法将在运行时决定。这就是为什么它也被称为晚期绑定\
    \ (late binding)，与早期绑定相比，它较慢。\n\n学生问：\nJava 支持像 C/C++ 那样的指针吗？\n不支持。主要原因之一是我们可能会访问意图之外的数据，这是非常危险的。此外，如果我们支持指针，内存管理将变得繁琐，因为在很多情况下它们很容易出错。我们相信，只要我们处于\
    \ Java 执行环境中，就不会感觉到使用指针的需求。\n\n# static 关键字的使用\n\n有时我们需要一种在不创建该类的任何对象的情况下就可以使用的变量。为了实现这个目的，我们用\
    \ `static` 标记成员。当成员被标有 `static` 关键字时，在 true 类的任何对象创建之前就可以访问该成员，即在此语文中我们不需要引用任何对象。\n\
    \n考虑下面的示例：\n实现-1:\n```java\npackage javaclassnotes.programs;\nclass StaticDemo1\
    \ {\n    //static 成员\n    int myStaticInt=5;\n    static String myStaticString=\"\
    I am a string\";\n    //非静态成员\n    int myStaticInt=25;\n}\n\npublic class StaticEx1\
    \ {\n    public void main(String args[]) {\n        System.out.println(\"***Use\
    \ of static variables***\");\n        //我们可以通过类本身调用静态成员\n        //不需要创建对象\n \
    \       System.out.println(\"myStaticInt is \"+myStaticInt);\n        System.out.println(\"\
    myStaticString is \"+myStaticString);\n        //错误：不能通过类名调用实例变量\n        //System.out.println(\"\
    myStaticInt is \"+myStaticInt);\n    }\n}\n```\n输出:\n![](img/00036.jpeg)\n分析：我们可以\
    \ `<classname>` 访问静态成员，即我们不需要创建对象。\n\n实现-2:\n让我们来看另一个例子。在这里我们将通过静态方法和静态块测试静态变量。\n\
    ```java\npackage javaclassnotes.programs;\nclass StaticEx2 {\n    //静态 成员\n  \
    \  static int myStaticInt=1;\n    static String myStaticString=\"No string\";\n\
    \    //实例变量\n    int nonStaticInt=25;\n    //静态方法\n    static void setValuesToStaticMembers()\
    \ {\n        System.out.println(\"I am inside the static method.\");\n       \
    \ System.out.println(\"myStaticInt=\"+ myStaticInt);\n        System.out.println(\"\
    myStaticString=\"+ myStaticString);\n        //错误：在此处只能访问静态字段\n        //System.out.println(\"\
    nonStaticInt=\"+ nonStaticInt);\n    }\n    //静态块\n    static {\n        System.out.println(\"\
    I am a block\");\n        System.out.println(\"Before change :\");\n        System.out.println(\"\
    myStaticInt=\"+ myStaticInt);\n        System.out.println(\"myStaticString=\"\
    + myStaticString);\n        System.out.println(\"I am changing the values now...\"\
    );\n        myStaticInt=5;\n        myStaticString=\"I am a string\";\n    }\n\
    }\n\npublic class StaticEx {\n    public static void main(String args[]) {\n \
    \       System.out.println(\"***Use of static methods and static blocks***\");\n\
    \        StaticEx2.setValuesToStaticMembers();\n    }\n}\n```\n输出:\n![](img/00037.jpeg)\n\
    分析：仔细观察输出。观察输出的顺序。你可以看到静态块中的语句在输出的最顶部。即使在执行静态块之前，静态变量已经初始化。随后静态块改变了值（当我们调用静态方法时，清楚地反映了这一点）。\n\
    \n这是因为一旦静态类被加载，所有的静态语句都会执行。\n\n"
- fmt: "\nYou should notice another important characteristic also: Static methods\
    \ can access only static members.\n\nAlso note that our static method is nested\
    \ here.\n\n### Rules of Thumb\n\n1. Static methods can only call other static\
    \ methods.\n2. Static methods can access only static fields.\n3. Static methods\
    \ cannot refer to `this` or `super`.\n\n### Students ask\n\n**Can we create static\
    \ class?**\n\nYes. But there is a constraint. The static class should be inside\
    \ of another class i.e. it must be nested. Java does not allow us to create top\
    \ level static class.\n\nThe class which contains the static class is termed as\
    \ an `outer class`.\n\nConsider the below example. Here we have shown how to create\
    \ and use a nested static class and a nested non-static (`Inner class`). \n\n\
    #### Implementation-3:\n\n```java\npackage javaclassnotes.programs;\n\n//Java\
    \ doesn't allow us to create top-level static classes,it must be nested.\nclass\
    \ OuterClass {\n    //static class\n    static class MyStaticClass {\n       \
    \ public static void showStaticMethod() {\n            System.out.println(\"I\
    \ am a static method\");\n        }\n    }\n    //non static class\n    class\
    \ MyNonStaticClass {\n        public void showStaticMethod() {\n            System.out.println(\"\
    I am NonStatic method\");\n        }\n    }\n}\n\nclass StaticClassEx {\n    public\
    \ static void main(String args[]) {\n        System.out.println(\"***Static and\
    \ Inner Class Demo***\");\n        //Call Static method\n        OuterClass.MyStaticClass.showStaticMethod();\n\
    \        //CallNonStatic method\n        OuterClass.MyNonStaticClass obNonStatic\
    \ = new OuterClass().new MyNonStaticClass();\n        obNonStatic.showStaticMethod();\n\
    \    }\n}\n```\n\nOutput:\n![](images/0038.jpeg)\n\n**What is an inner class?**\n\
    \nAs described above, a non-static nested class is termed as an Inner class. It\
    \ can access all the variables and methods of the outer class.\n\n**From static\
    \ class, can we access the variables of Outer class?**\n\nAnswer is yes if and\
    \ only if those variables are static. Consider the below example. Following code\
    \ snippet is fine:\n\n```java\nclass OuterClass {\n    static int outer_int=25;\n\
    \    //static class\n    class MyStaticClass {\n        public static void showStaticMethod()\
    \ {\n            System.out.println(\"I am a static method\");\n            System.out.println(\"\
    Outer_int =\" + outer_int);\n        }\n    }\n}\n```\nBut if `outer_int` is non-static,\
    \ compiler will raise an issue.\n\n#### Assignment\n\n1. Suppose you have formed\
    \ a cricket team. Now your team is going to play against opponent team. You must\
    \ be aware of the fact which team will bat (or bowl) first will be decided through\
    \ the toss and you need to send your captain for that. So, at first, you must\
    \ elect a captain. At the same time, you must be aware that you can select only\
    \ one captain. So, if you not have any such captain, you will select one and send\
    \ him for toss. Otherwise, simply send the already nominated captain for the toss.\
    \ Can you design this?\n2. Create a `Vehicle`. The class should have fields `no_of_seats`\
    \ and `no_of_wheels`.\n3. Create two objects `Motorcycle` and `Car` for this class.\
    \ Your output should show descriptions for `Car` and `Motorcycle`.\n\nUml Class\
    \ Diagram:\n![](images/0039.jpeg)\n\nImplementation:\nNo need to include package\
    \ statements. Once you understand the concept of package, we’ll see that it is\
    \ much handy to make an organized structure for our programs.\n\n```java\npackage\
    \ javaclassnotes.assignments;\n\nclass MyVehicle {\n    int no_of_wheels;\n  \
    \  int no_of_seats;\n\n    MyVehicle(int wheels, int seats) {\n        no_of_wheels\
    \ = wheels;\n        no_of_seats = seats;\n    }\n\n    void showVehicle() {\n\
    \        System.out.print(\"Description:\");\n        System.out.println(\"\\\
    n*************\");\n        System.out.println(\"It has \" + no_of_wheels + \"\
    \ wheels\");\n        System.out.println(\"It has \" + no_of_seats + \" seats\\\
    n\");\n    }\n}\n\nclass ClassAssignment_1_Demo {\n    public static void main(String\
    \ args[]) {\n        System.out.print(\"***Assignment on Class***\\n\");\n   \
    \     MyVehicle car = new MyVehicle(4, 4);\n        MyVehicle motorCycle = new\
    \ MyVehicle(2, 0);\n        System.out.print(\"Car \");\n        car.showVehicle();\n\
    \        System.out.print(\"Motorcycle \");\n        motorCycle.showVehicle();\n\
    \    }\n}\n```\nOutput:\n![](images/0040.jpeg)\n\n### Inheritance\n\n1. Write\
    \ a Simple Program to implement Hierarchical Inheritance.\n\nUml Class Diagram:\n\
    ![](images/0041.jpeg)\n\nImplementation:\n\n```java\npackage javaclassnotes.assignments;\n\
    \nclass Vehicle {\n    public void showVehicle() {\n        System.out.println(\"\
    I am in Vehicle\");\n    }\n}\n\nclass Car extends Vehicle {\n    public void\
    \ showVehicle() {\n        System.out.println(\"I am in Car\");\n    }\n}\n\n\
    class Motorcycle extends Vehicle {\n    public void showVehicle() {\n        System.out.println(\"\
    I am in Motorcycle\");\n    }\n}\n\nclass HierarchicalInheritanceEx {\n    public\
    \ static void main(String args[]) {\n        System.out.println(\"***Hierarchical\
    \ Inheritance Demo***\");\n        Car c = new Car();\n        c.showVehicle();\n\
    \        Motorcycle m = new Motorcycle();\n        m.showVehicle();\n    }\n}\n\
    ```\nOutput:\n![](images/0042.jpeg)\n\n2. Write a Simple Program to implement\
    \ Multilevel Inheritance. We could write the program like the above program (See\
    \ our code structure in the chapter on Inheritance). For a variety, we are using\
    \ only constructors here. If you want to see the concrete methods implementation,\
    \ just uncomment the codes in the below program.\n\nUml Class Diagram:\n![](images/0043.jpeg)\n\
    \nImplementation:\n\n```java\npackage javaclassnotes.assignments;\n\nclass Parent\
    \ {\n    public Parent() {\n        System.out.println(\"I am in Parent constructor\"\
    );\n    }\n    /*\n    public void showMe() {\n        System.out.println(\"I\
    \ am a Parent\");\n    }\n*/\n}\n\nclass Child extends Parent {\n    public Child()\
    \ {\n        System.out.println(\"I am in Child constructor\");\n    }\n    /*\n\
    \    public void showMe() {\n        System.out.println(\"I am a Child\");\n \
    \   }\n*/\n}\n\nclass GrandChild extends Child {\n    public GrandChild() {\n\
    \        System.out.println(\"I am in GrandChild constructor\");\n    }\n    /*\n\
    \    public void showMe() {\n        System.out.println(\"I am a GrandChild\"\
    );\n    }\n    */\n}\n\nclass MultilevelInheritanceEx {\n    public static void\
    \ main(String args[]) {\n        System.out.println(\"***Multilevel Inheritance\
    \ Demo***\");\n        Parent p = new Parent();\n        // p.showMe();\n    \
    \    Child c = new Child();\n        // c.showMe();\n        GrandChild g = new\
    \ GrandChild();\n        // g.showMe();\n    }\n}\n```\nOutput:\n![](images/0044.jpeg)\n"
