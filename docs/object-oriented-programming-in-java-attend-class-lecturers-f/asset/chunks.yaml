    Abstract Class\n\nThese are incomplete classes and we cannot instantiate objects\
    \ from this type of classes.\n\nIn general, if a class contains at least one incomplete/abstract\
    \ method, the class itself is an abstract class. By the term “abstract method”-\
    \ we mean that the method has the declaration (or signature) but no implementation.\n\
    \nThe technique is useful when the super class can define a generalized form (that\
    \ will be shared by its subclasses) and passes the responsibilities to fill the\
    \ details to its subclasses.\n\nA simple abstract class demo:\n\nImplementation-1:\n\
    \npackage javaclassnotes.programs;\n\nabstract  class MyAbstractClass\n\n{\n\n\
    \ public abstract  void showMe();\n\n}\n\nclass MyConcreteClass extends MyAbstractClass\n\
    \n{\n\n @Override\n\n public  void showMe()\n\n              {\n\n             \
    \               System.out.println(\"I am from concrete class:\");\n\n             \
    \               System.out.println(\"I am supplying the method body for showMe()\"\
    );\n\n              }             \n\n}\n\nclass AbstractClassEx\n\n{\n\n public\
    \  static  void main(String Args[])\n\n              {\n\n                           \
    \ System.out.println(\"***Abstract class Demo***\");\n\n //Illegal:Cannot instantiate\n\
    \n //MyAbstractClass abstractOb=new MyAbstractClass();\n\nMyConcreteClass concreteOb=new\
    \ MyConcreteClass();\n\n concreteOb.showMe();\n\n              }\n\n}\n\nOutput:\n\
    \n![](images/00022.jpeg)\n\nAn abstract class can contain concrete methods also.\
    \ The child class may or may not override those methods.\n\nImplementation-2:\n\
    \npackage javaclassnotes.programs;\n\nabstract  class AbstractClass\n\n{\n\n public\
    \ abstract  void showMe();\n\n public  void completeMethod1()\n\n             \
    \ {\n\n                            System.out.println(\" Originally,I am from\
    \ completeMethod1 in MyAbstractClass.But,I am complete.\");             \n\n             \
    \ }\n\n public  void completeMethod2()\n\n              {\n\n                           \
    \ System.out.println(\" Originally,I am from  completeMethod2 in MyAbstractClass.But,I\
    \ am also complete.\");             \n\n              }\n\n}\n\nclass ConcreteClass\
    \ extends AbstractClass\n\n{\n\n @Override\n\n public  void showMe()\n\n             \
    \ {\n\n                            System.out.println(\"I am from concrete class:\"\
    );\n\n                            System.out.println(\"I am supplying the method\
    \ body for showMe()\");\n\n              }\n\n //It wants to override completeMethod1()\
    \ in MyAbstractClass\n\n public  void completeMethod1()\n\n              {\n\n\
                                System.out.println(\"I am overriding completeMethod1\
    \ of MyAbstractClass.\");             \n\n              }\n\n}\n\nclass AbstractClassEx2\n\
    \n{\n\n public  static  void main(String Args[])\n\n              {\n\n             \
    \               System.out.println(\"***Abstract class Demo2***\");\n\nConcreteClass\
    \ concreteOb=new ConcreteClass();\n\n concreteOb.showMe();\n\n //It will show\
    \ that completeMethod1 is redefined in MyConcreteClass.\n\n concreteOb.completeMethod1();\n\
    \n //It will show the details of completeMethod2 defined in MyAbstractClass.\n\
    \n concreteOb.completeMethod2();\n\n //Following declaration will be fine\n\n\
    AbstractClass abstractRef=new ConcreteClass();\n\n abstractRef.completeMethod1();\n\
    \n              }\n\n}\n\nOutput:\n\n![](images/00023.jpeg)\n\nCan we implement\
