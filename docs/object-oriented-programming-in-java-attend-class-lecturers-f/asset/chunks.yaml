    \ overridden by its child. How can we achieve that?\n\nIn many interviews, you\
    \ can face this question. We must remember that we can prevent overriding by the\
    \ use of static, private or final keywords. But here we discuss only the use of\
    \ “final”. It is very much helpful because compiler itself will prevent the process\
    \ of overriding.\n\nclass ParentClass\n\n{\n\n //Use of final to prevent overriding\n\
