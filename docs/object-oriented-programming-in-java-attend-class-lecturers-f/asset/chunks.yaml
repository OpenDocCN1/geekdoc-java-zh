    \ 初始化为 `20`，而 `obB` 将整数 `i` 初始化为 `30`。\n\n```java\nclass ClassA\n{\n    int i;\n\
    \    ClassA(int i) {\n        this.i=i;\n    }\n}\n\nclass ClassEx3\n{\n    public\
    \ static void main(String args[]) {\n        System.out.println(\"*** A Simple\
    \ class with 2 objects-obA And obB ***\");\n        System.out.println(\"*** obA.i\
    \ And obB.i are different here ***\");\n        ClassA obA=new ClassA(20);\n \
    \       ClassA obB=new ClassA(30);\n        System.out.println(\"obA.i =\"+ obA.i);\n\
    \        System.out.println(\"obB.i =\"+ obB.i);\n    }\n}\n```\n\n输出：\n![](img/00007.jpeg)\n\
    \n### 学生问：老师，这里的 `this` 有什么用？\n\n问得好。`this` 用于引用当前对象。如果我们像这样写代码，就可以省略 `this` 的使用：\n\
    \n```java\nclass ClassA\n{\n    int i;//实例变量\n    ClassA(int myInt)//myInt-局部变量\n\
    \    {\n        i=myInt;\n    }\n}\n```\n\n我们熟悉这样的代码：`a=5;` 在这里我们将 `5` 赋值给 `a`。但我们能写\
    \ `5=a;` 吗？不能。编译器会抛出现。\n\n在这里，`myInt` 是我们的局部变量（在方法、块或构造函数内部可见），`i` 是我们的实例变量（声明在类内部，但在方法、块或构造函数之外）。\n\
    \n因此，如果我们不使用 `myInt` 而使用 `i`，我们需要告诉编译器我们的意图。它不应该混淆哪个值被赋值到了哪里。在这里，我们将局部变量的值赋值给实例变量，编译器应该清楚地理解我们的意图。通过\
    \ `this.i=i;`，编译器将非常清楚地理解局部变量 `i` 的值被赋值给了实例变量 `i`。\n\n# 类演示-3\n\n在这里我们使用了两个构造函数。过一遍程序。注意，我们这里可以使用默认值初始化对象。如果在创建对象的过程中使用了默认构造函数，则实例变量\
    \ `i` 将初始化为 `7`。我们也可以通过非默认构造函数提供不同的值。\n\n```java\nclass ClassA\n{\n    int i;\n\
    \    ClassA() {\n        this.i=7;\n    }\n    ClassA(int i) {\n        this.i=i;\n\
    \    }\n}\n\nclass ClassEx3\n{\n    public static void main(String args[]) {\n\
    \        System.out.println(\"*** Simple class with 2 objects-obA And obB ***\"\
    );\n        System.out.println(\"*** Different type of constructors used here\
    \ ***\");\n        ClassA obA=new ClassA();\n        ClassA obB=new ClassA(25);\n\
    \        System.out.println(\"obA.i =\"+ obA.i);\n        System.out.println(\"\
    obB.i =\"+ obB.i);\n    }\n}\n```\n\n输出：\n![](img/00008.jpeg)\n\n作业：创建一个类 `Vehicle`。该类应该包含字段\
    \ `no_of_seats` 和 `no_of_wheels`。为该类创建两个对象-`Motorcycle` 和 `Car`。你的输出应该显示 `Car`\
    \ 的描述。\n\n# 继承\n\n继承的主要目标是提高代码的可重用性并消除代码冗余。在这里，子类获取了其父类的特征。我们所说的父类是指相对于另一个类（称为子类）处于更高层级的类。\n\
    \n## 类型\n\n通常，我们处理 4 种继承。\n\n### 单继承继承\n一个子类派生自一个基类。\n![](img/0009.jpeg) 图：单继承\n\
    代码格式如下：\n```java\nclass Parent {\n    // 你的代码...\n}\nclass Child extends Parent\
    \ {\n    // 你的代码...\n}\n```\n\n### 层级继承\n多个子类可以派生自一个基类。\n![](img/00010.jpeg) 图：层级继承\n\
    代码格式如下：\n```java\nclass Parent {\n    // 你的代码...\n}\nclass Child1 extends Parent\
    \ {\n    // 你的代码...\n}\nclass Child2 extends Parent {\n    // 你的代码...\n}\n```\n\
    \n### 多级继承\n在这里，父类有孙类。\n![](img/00011.jpeg) 图：多级继承\n老师问：现在尝试用 Java 代码实现这个概念。\n\
    解答：代码格式如下：\n```java\nclass Parent {\n    // 你的代码...\n}\nclass Child extends Parent\
    \ {\n    // 你的代码...\n}\nclass GrandChild extends Child {\n    // 你的代码...\n}\n\
    ```\n\n### 多继承\n在这里，一个类可以派生自多个父类。\n![](img/00012.jpeg) 图：多继承\n注意，Java 不支持这种继承（通过类）。即在\
    \ Java 中，子类不能派生自多个一个父类。为了处理这种情况，我们需要理解接口。\n\n注意：还有一种类型的继承被称为混合继承。它是上述一种或多种类型继承的结合。\n\
    \n## 继承的简单程序\n\n```java\nclass ParentClass\n{\n    public void show() {\n    \
    \    System.out.println(\"I am Parent Class\");\n    }\n}\n\nclass ChildClass\
    \ extends ParentClass\n{\n}\n\nclass Example1\n{\n    public static void main(String\
    \ args[]) {\n        ChildClass child1=new ChildClass();\n        //通过 ChildClass\
    \ 调用 show()\n        child1.show();\n    }\n}\n```\n\n输出：\n![](img/0013.jpeg)\n\
    \n### 学生问：为什么 Java 不支持类的多继承？\n\n主要原因是为了避免歧义。它们在某些典型场景下会引起混乱：\n假设我们的父类中有一个名为 `show()`\
    \ 的方法。父类有多个孩子——假设 `child1` 和 `child2`，它们为了自己的目的重写了该方法。代码可能如下：\n\n```java\nclass\
    \ Parent {\n    void show() {\n        System.out.println(\"I am Parent\");\n\
    \    }\n}\nclass Child1 extends Parent {\n    void show() {\n        System.out.println(\"\
    I am Child-1\");\n    }\n}\nclass Child2 extends Parent {\n    void show() {\n\
    \        System.out.println(\"I am Child-2\");\n    }\n}\nclass GrandChild extends\
    \ Child1, Child2 {\n    // 这在 Java 中是不可能的\n}\n```\n现在假设我们的 `GrandChild` 继承/调用\
    \ `show()`——`Child1` 或 `Child2`。(images/0014.jpeg)这个问题以一个著名的名称——菱形问题（Diamond problem）。\n\
    \n"
