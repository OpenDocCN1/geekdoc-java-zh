    . Less challenging situation:\n\nOnly Company a conducts tour for Kerala and Only\
    \ company b conducts tour for Andaman.\n\n2\\. More Challenging situation:\n\n\
    Notice that both of the companies are providing tour for Goa. And we need to get\
