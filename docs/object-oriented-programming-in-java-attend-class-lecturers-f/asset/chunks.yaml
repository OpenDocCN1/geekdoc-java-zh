    \nYou’ll get a screen containing something like this:\n\n![](images/00001.jpeg)\n\
    \nTry to download the latest version based on your system configuration (e.g.\
    \ 32 bit/64 bit, Windows/Linux etc.)\n\nTo download eclipse IDE:\n\nGo here.\n\
    \n[https://eclipse.org/downloads/](https://eclipse.org/downloads/)\n\nAs mentioned\
    \ above try to download the latest version based on your system configuration.\n\
    \n# Naming Conventions\n\n- **Class**- should start with an uppercase letter and\
    \ should be a noun e.g. `MyClass`, `String`, etc.\n- **Interface/s**- should start\
    \ with an uppercase letter and be an adjective e.g. `Runnable`, `Remote`\n- **Method/s**-\
    \ They should start with a lowercase letter and be a verb e.g. `main()`, `showMyMethod()`\
    \ etc.\n- **Variable/s**- They should start with lowercase letter e.g. `myIntegerValue`,\
    \ `myDoubleValue`, `myName` etc.\n- **Package/s**- should be all in lower case\
    \ latter e.g. `mypackage`, `package1` etc.\n- **Constants**- They should be in\
    \ uppercase letters e.g. `MY_CONSTANT` etc.\n\nApart for few special cases, we\
    \ have tried to maintain these conventions across the book.\n\n# Introduction\n\
    \n### History\nIn June 1991, James Gosling, Mike Sheridan and Patrick Naughton\
    \ initiated the project of Java language. There was an Oak tree outside Gosling’s\
    \ office. And people say that this is why, originally the language was named Oak.\
    \ Later they renamed the project as Green (Their team name was also Green team).\
    \ And finally they renamed it to Java. The Green project was chartered by Sun\
    \ Microsystem.\n\nThe team members wanted such a name that will be very much unique\
    \ in nature and at the same time, it should reflect the essence of upcoming technologies.\
    \ So, they picked names like “Dynamic”, “Revolutionary”, “Silk”, “Jolt”, “DNA”\
    \ etc.\n\nJames Gosling later told that Java was one of the top choices along\
    \ with `Silk`. But finally they selected Java because most of the team mates liked\
    \ this name.\n\nJava became Open source on November 13, 2006. Sun finished the\
    \ process by making all of Java's core code available under free software/open-source\
    \ distribution terms, (aside from a small portion of code to which they did not\
    \ hold the copyright) on May 08, 2007.\n\nLater Oracle Corporation purchased Sun\
    \ Microsystem and the acquisition process was finished on January 27, 2010.\n\n\
    ### Primary objective\nThese qualities were the primary focus area for Java:\n\
    1. Simple, Object-oriented, and familiar.\n2. Robustness and Security\n3. Architecture-neutral\
    \ and Portable.\n4. High Performance capabilities.\n5. Interpreted, Threaded,\
    \ and Dynamic.\n\n### Our First program\nNow let us go through our first program.\
    \ We’ll print Hello World here.\n\n```java\npackage javaclassnotes.programs;\n\
    \npublic class HelloWorld {\n    public static void main(String args[]) {\n  \
    \      System.out.println(\"Hello World.\");\n    }\n}\n```\n\nOutput:\n![](images/00002.jpeg)\n\
    \n### Analysis\n1. First of all, throughout the book, we have organized the programs\
    \ into package/s. But for this program, it was not mandatory. Once we go through\
    \ the chapters on package, it will be clear to us.\n2. It is the basic structure\
    \ of the `main` method. The meaning and significance of each keyword will be clear\
    \ to you gradually. So, for the time being, you must follow this structure.\n\
    3. Our source file name is `HelloWorld.java`. We need to use `.java` extension\
    \ for our java files. It is the requirement for the compiler.\n4. Java is case-sensitive.\n\
    5. `main`- The program will start from here.\n   - `public`- The access specifier.\
    \ Access specifiers are used to control the visibility of the members.\n   - `static`-\
    \ It allows us to call `main()` without instantiate a particular instance of the\
    \ class. We’ll analysis `static` later.\n   - `void`-return type.\n   - `String\
    \ args[]`-`args` is an array of instances of `String` class. String Objects are\
    \ used to store character strings.\n   - `println`-It is used to display information.\n\
    \   - `System.out`- Difficult to explain at this point. Just we can know that\
    \ `System` is a class and `out` is output stream associated with the console.\n\
    \n### Quiz\nWhat will be the output?\n```java\nclass Hello {\n    static void\
    \ main(String args[]) {\n        System.out.println(\"Hello World.\");\n    }\n\
    }\n```\nOutput:\n![](images/00002.jpeg) (Note: The input text contained significant\
