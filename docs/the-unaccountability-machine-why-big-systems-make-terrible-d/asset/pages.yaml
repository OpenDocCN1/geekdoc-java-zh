  md: '# Among the economists


    I am an economist myself, of a sort. This doesn’t just mean ‘someone with an economics
    degree’ or ‘someone who earns money from the study of economic phenomena, although
    I do. Being an economist has been called a style of rhetoric and a way of thinking
    as much as an academic discipline. I’ve joked in the past that the ‘ist’ at the
    end of ‘economist’ is the ist’ of ideology and not of science – analogous to ‘Trottskyist’
    rather than ‘meteorologist’. Economists variously describe economics as a subject,
    a science, a discipline and even a profession, but it’s really a commitment to
    certain ways of modelling the world.


    Once upon a time, economics was the study of rocks – like geology but the last
    seventy years has seen the eclipse of what used to be called ‘institutional economics’.
    Back in the 1930s and 1940s, to be an economist was to make detailed studies of
    particular economic institutions, compile statistics about them and then publish
    them, after which they would sit on a shelf for decades, in the hope that someone
    might come along who wanted to know a lot about rayon, or boric acid, or shipping
    in the South Pacific.


    This has been all eclipsed by another kind of economics. One of Friedrich Hayek’s
    contemporaries defined economics as ‘the science which studies human behaviour
    as a relationship between ends and scarce means which have alternative uses’.
    It’s this idea of a generalised study of human behaviour under conditions of scarcity
    that has been responsible for the economists’ intellectual imperialism. If you
    announce that you’re the experts on human beings when they have to choose between
    different priorities under scarce resources, well, when aren’t resources scarce?
    When don’t people have to choose between different things they want?


    # Triumph of the optimisers


    This second kind of economics became dominant after the Second World War. The
