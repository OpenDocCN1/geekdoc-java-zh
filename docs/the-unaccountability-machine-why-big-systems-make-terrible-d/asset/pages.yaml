  md: '# Einstein reads the phone book


    This would only be a problem, of course, if companies allowed themselves to be
    fooled by the compromises made for their financial reporting, rather than keeping
    separate management accounts for themselves and using them for all decision-making
    purposes. Unfortunately, this often happens. You might think nobody would be so
    crazy to make business decisions based on their effect on the financial reporting,
    but they do, all the time.


    Basically, bookkeeping is expensive. It ought to be obvious to anyone who''s had
    a job; the establishment of information and communication channels, and the translation
    mechanisms that support them, costs money. All the higher cerebral functions of
    the organisation involve spending resources on parts of the system that don''t
    directly produce output and aren''t viable on their. This was even more of a problem
    in the early days of the large corporation, before electronic computing became
    cheap.


    Financial reporting is a legal obligation. If you''re going to enjoy the many
    advantages of being a corporation, you have to produce audited accounts. But management
    accounting is an internal affair.* You can do what you like with respect to process
    measurement or cost allocation, but you have to employ people to collect numbers
    which are collated and systematised according to generally accepted accounting
    principles. In the days when this involved writing in ledgers and manipulating
    punch cards, the compromise was not too difficult to agree; the organisation would
    use financial reporting, leaving divisional managers to do their own cost allocation
    and plant managers to collect process data for the outputs for which they were
    responsible.


    In the 1960s, electronic computers became something which a large company might
    reasonably expect to buy and use. At this point, a terrible decision happened
    – a decision nobody made, but with huge consequences. There might have been an
    opportunity to rethink the basis of financial reporting to adapt to such a change
    in information-processing capacity, but there was no incentive to do so; the user
    of accounts was still considered to be someone sitting in a chair and reading
    stacks of printed reports.


    Companies might have considered the possibility of adding layers to their control
    systems, allowing process and cost allocation reports to be'
  merge: -1
  pgno: 139
- img_proc: true
  md: 'extracted from the same raw transaction data as the financial accounts. But
    that would have been a costly investment, and would have likely raised questions
    about organisation and hierarchy, as well as potentially overturning established
    relationships between cost centres and profit centres.


    What actually happened was that most companies commissioned an electronic version
    of the same bookkeeping and reporting processes that they had been following with
    paper and punch cards. When Stafford Beer made his joke about recruiting all the
    greatest geniuses of humanity and setting them to work memorising the phone book,
    this was what he was referring to.


    # Business hallucinations


    Mechanising and computerising the accounting system allowed companies to grow
    and get more complicated, but on the basis of the same system, one based on financial
    reporting. Meaning that the increase in complexity was masked from the people
    who were meant to be managing it. Their reports were largely unchanged. And consequently,
    companies began to hallucinate.


    Consider our imaginary skincare product company. We noted that the financial reporting
    numbers were likely to give the impression that the bulk product was much less
    profitable than the luxury one, whether or not this was true. enterprising management
    consultant might ask why this company should make a product at all, if its value
    lies in marketing and branding. An interesting question to ask, and by no means
    one with an obvious answer. However, the way that the numbers are reported means
    that it''s a question which is highly likely to get a particular answer.


    Suppose that the skincare firm called in some management consultants to look at
    its manufacturing costs. Those consultants might start looking at the cost of
    buying the bulk skin cream from an external supplier, rather than making it from
    scratch out of petrochemicals and vegetable oil. But that comparison is actually
    quite tricky to make. If the external supplier is mainly selling a commodity product
    to a small number of business customers, it''s likely to have minimal marketing
    expense and only to do small amounts of research and development. Consequently,
    its overhead costs will be low. If the company’s own manufacturing operations
    have'
