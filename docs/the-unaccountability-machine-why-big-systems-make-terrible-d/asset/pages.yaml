  md: 'might charitably called ‘an engineering model’ and less charitably physics
    envy’. In the 1940s and 1950s, there was a methodological revolution in economics,
    as a series of new mathematical techniques were invented and put to use.


    Some of these techniques were, indeed, carried over from physics, and some from
    even more abstract areas of maths like topology. But the overarching concept was
    a straight lift from thermodynamics – the concept of ‘equilibrium’. In a thermodynamic
    system, equilibrium is reached when there is no more transfer of energy. When
    a hot object has cooled down to the ambient temperature, for example, it is in
    equilibrium with its surroundings.


    The great insight of the economists of the ‘mathematical revolution’ was that
    thermal equilibrium be seen as analogous to a situation at a market where nobody
    wanted to trade any more. If everyone exchanged their goods at the prevailing
    price, until there was no swap they could make which would leave them with a bundle
    of things that they preferred to what they already owned, in some sense this state
    could be considered ‘optimal’, because nobody would be able to improve on. From
    this initial insight, plus a lot of analytical fireworks, more or less everything
    sprung. It was possible to provide a rigorous formal basis for the classic supply-anddemand
    curves that had been included in economics textbooks for the previous fifty years.
    The equilibrium concept and its identification with the idea of an optimal state
    are the basis of economics today.


    How did they do it? By making one massive assumption. In physics, one electron
    is exactly the same as any other, as a matter of physical fact. The fundamental
    particles of mathematical economics, however, are commodities, preferences and
    people. Treating these as identical and interchangeable is a modelling assumption,
    not a fact; it might be right for some purposes and wrong for others. If you make
    that assumption, you can add them and define a complete and consistent ‘demand
    function’ for all goods, relating quantity to price. At any one time, the combination
    of all the demand functions with the amount of stuff in the world and the list
    of who owned it, in turn, define one single schedule of prices which was ‘consistent’
    in the sense that nobody could do better by further trading. This was the equilibrium
    of the system – the lowest-energy state to which it could be presumed to tend.'
