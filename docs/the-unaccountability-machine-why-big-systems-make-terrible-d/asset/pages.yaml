  md: '# Further Reading


    I should probably start with a warning – cybernetics can be an expensive hobby.
    Lots of the books mentioned below were originally published by academic presses,
    and so they tend to sell at prices which even a university librarian might gulp
    at. I can''t, in all conscience, encourage anybody to go out and start acquiring
    the complete works of Stafford Beer at list price. However, it seems that the
    1980s generation of management consultants are gradually retiring and downsizing
    their libraries, so they often show up in charity shops and second-hand bookstores
    at reasonable prices. That''s how I got most of mine. Consequently, some of the
    references below might be to out-of-print editions, or ones where the original
    publisher doesn''t exist in that form any more.


    Another warning might be that some of the rest are lengthy verbal descriptions
    of mathematical models which aren''t always much less-off own. For the most part,
    you can skip over the equations, but in my view if you''re going to seriously
    study this subject, start with An Introduction to Cybernetics by W. Ross Ashby
    (Chapman & Hall, 1976), which meant to be a basic text for biomedical researchers
    and is much more clearly written than any of the others, with only high-school
    mathematics required.


    If you want to read more about cybernetics, but not so seriously, The Cybernetic
    Brain: Sketches of Another Future (University of Chicago Press, 2011) by Andrew
    Pickering is great fun; you will realise that I only scratched the surface when
    it comes to the eccentricity and genius of the British cyberneticians. It''s one
    of the only books I''d wholeheartedly recommend full academic price for if you
    can''t get it any other way. James Gleick''s The Information: A History, a Theory,
    a Flood (Fourth Estate, 2012) is also an acknowledged classic, and tells the story
    from the other side of the Atlantic – what the telecoms engineers and computer
    programmers did at and after the Macy conferences.'
