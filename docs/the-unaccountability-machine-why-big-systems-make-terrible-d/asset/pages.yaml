  md: '# Matching ‘here and now’ with ‘there and then’


    This brings us to the highest conceptual level of the system. We''ve emphasised
    at every stage that management is about variety engineering: making sure that
    every management function is matched, in terms of its information-handling capability,
    to the kinds of shocks and variety that might affect it. So System 3 has to be
    matched to the variety it manages (the exceptions and escalations coming out of
    System 1), System 4 has to be matched to its own source of variety (the uncertainty
    about the future and things happening outside the environment). But Systems 3
    and 4 also have to be matched to each other. This isn''t particularly obvious
    as an engineering statement, but it''s a condition of stability – if you think
    about how their interaction works, you can see.


    The intelligence and policy function (System 4) is meant to instruct the day-to-day
    management function on how to reorganise itself to cope with change. There are
    two obvious failure modes – changing too much, and changing too little. If the
    orchestra never changes its programme it will stagnate, but if it changes too
    often the musicians will be rehearsed and quality will suffer. The variety transmitted
    from the intelligence function needs to be matched both to the change it anticipates
    in the environment and to the capacity of the operational function to reorganise
    itself. Except by complete chance, these two are not going to be equal – so there
    needs to be a final management function to absorb excess variety.


    System 5 is what Stafford Beer calls philosophy or identity. That might sound
    like an odd name to give the job of variety engineering to balance two competing
    management systems, but he does this because there’s a specific technique that’s
    best suited to this task, and ‘identity’ or ‘self-creation’ is a good name for
    it.


    It matters what kind of an orchestra this is. Having a consistent identity is
    a great way of reducing variety you need to deal with, because it means that there
    are lot of possibilities that can be simply ignored. If this is the backing orchestra
    for Elton John, nobody is going to need to consider whether the repertoire should
    include Wagner’s Ring cycle, or whether the tour itinerary should include a heavy
