    # Solving it in the model


    Let’s take an actual example and do some economics. Consider a hypothetical country
    (let’s call it ‘England’) where it takes 100 hours’ work to produce a bolt of
    cloth, and 120 hours to produce a barrel of wine. Consider another country (call
    it ‘Portugal’) where thanks to advanced technology and a favourable climate it
    takes 90 hours’ work to make the cloth and 80 to make the wine. Both countries
    want cloth and wine. How much cloth and how wine should produce?


    If we presume Portugal is a lot smaller than England, the answer is clear. Even
    though it can produce cloth much cheaply than England can, it should produce only
    wine and get all its cloth by trade. You can see this by calculating the relative
    prices. Without trade, a bolt of cloth in Portugal would cost nine-eighths of
    a barrel of wine (assuming that labour is the only input). By similar reasoning,
    a bolt of cloth in England would be worth five-sixths of a barrel of wine. Cloth
    is more than wine in Portugal, but less than wine in England.


    And that means that it’s possible to take advantage of the different prices. Rather
    than spending 90 hours making a bolt of cloth, if Portugal makes a barrel of wine
    with 80 hours of labour, it can swap it for more than a bolt of cloth. Even though
    Portugal has an absolute advantage in that it is a more efficient producer of
    goods, the gains it can make from trade are determined by its comparative advantage.


    This result is one of the crown jewels of economics – the theory of comparative
    advantage, first set out in David Ricardo’s Principles of Political Economy and
    Taxation in 1817. When the economics Nobel'
