  md: 'So if we’re analysing an army at war, System 1 is the platoon, System 2 is
    the quartermaster and System 3 is the battlefield commander. But above this level,
    it’s better to think of a different analogy. How would we apply the model to a
    different kind of organisation – say, an orchestra?


    # The viable orchestra


    You could make a case for regarding anyone other than the musicians as the operations
    (System 1) of an orchestra, but it would feel contrary. The musicians fit all
    the criteria – they’re capable of independent existence and they’re responsible
    for interacting with the environment to deliver the system’s output.


    The regulatory (System 2) systems can be identified quite readily, too. The orchestra
    has a system for making sure that everyone is playing the notes at the time; depending
    on what kind of band it is, there’s either a score determining every note, or
    a chart with the chords on it. That’s another example of a “resource bargain”
    which can be negotiated in different ways; a chamber orchestra is given the notes
    to play, while the members of a jazz orchestra are required to improvise their
    own contributions within an overall framework.


    Note, however, there’s a lot more than delivering the music than obeying the score
    – the musicians are responsible for playing in tune and in time, and responding
    to what they hear from the people around them. Another part of the resource bargain
    between the musicians deals with the shared supply of volume and audience attention;
    some sections need to play quietly so that others can be heard, are designated
    as accompanists and some soloists.


    At the front is a conductor – and here we see where Stafford Beer often said it
    was difficult to separate the operational systems. The conductor has one definite
    System 2 role: to mark the beat so everyone plays in time. That’s clearly regulatory
    in nature, but the conductor isn’t just a human metronome. They’re responsible
    for the dynamics of the piece, directing instruments to play softer or louder
    at the appropriate points, and to change the tempo according to the needs of the
    piece. The System 3 integration and management role of the conductor is to provide
    the feedback to the musicians about the noise they’re making and how it needs
    to adapt.'
