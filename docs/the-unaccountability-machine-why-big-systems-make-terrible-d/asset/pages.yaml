  md: 'If the System 3 middle management tries to fight the variety generated by the
    System 1 operations single-handed, it’s going to be overwhelmed. System 3 is a
    central coordinating function without the resources to handle that volume of information.
    Everyone who’s worked in a dysfunctional organisation will recognise this as ‘micromanagement’
    and will be familiar with the ways in which it breaks down. The environmental
    variety coming in from the suppliers and customers doesn''t get handled at the
    right level because System 1 employees aren''t allowed to make decisions. Meanwhile,
    the coordination, communication, integration and planning functions are neglected
    because System 3 is spending all its time trying to do someone’s job. Middle management
    becomes bloated and overstaffed as it tries to add variety while the operations
    are miserable because of constant interference from people who don''t really understand
    what they do.


    On the other hand, the central functions can be neglected by taking the opposite
    approach – that of excessive delegation. If everything is left to the operating-level
    management, there is no coordination of the resource bargains and no planning.
    With no adequate System 3 function, the operating units have no means to resolve
    their conflicts other through internal politics, with resources allocated by grabbing
    and hoarding them. Nobody talks to anyone else, and the System 1 level becomes
    bloated with ‘operational’ managers who spend all their time treading on each
    other’s toes and fighting wars.


    It’s important to note at this stage that we’re talking about management functions
    here, and these ‘systems’ shouldn''t be expected to fit nicely on the organisation
    chart of a company. Apart from anything else, there are many different ways of
    dividing the operations into different potentially viable System 1 functions.
    Plenty of organisations have no formally identified central planning department,
    but the integration and optimisation function is performed by an informal network
    of System 1 managers. That’s perfectly possible, as long as they have made the
    mental leap of understanding from time to time they need to adjust their thinking
    to perform a coordination role for the benefit of the organisation. Stafford Beer
    occasionally seemed to suggest that this kind of informal internal networking
    could be the best way to create System 3, which was why big lounge at head office
    with whisky and cigars was important.'
