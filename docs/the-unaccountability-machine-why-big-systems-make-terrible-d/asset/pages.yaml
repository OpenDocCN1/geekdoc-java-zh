    # Purpose and power


    What is the purpose of the economy? Or, to put the question in cybernetic terms,
    what does the economy do? It organises the production and distribution of goods.
    In order to do that, it has to solve an information-processing task: specific
    needs to be produced, using the available resources, and then distributed to specific
    individuals in different quantities. To perform this function, practical decisions
