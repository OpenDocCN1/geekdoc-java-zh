    the nineteen years stewardship of Alan Greenspan at the Federal Reserve.


    Although unemployment is, in one sense, a waste, the alternative possibility is
    for managers and capital-owners to lose control of the wage bargain. For that
    reason, the capitalist class is often prepared to tolerate lower output as the
    price of retaining control of wages and prices. The secret to the Great Moderation
    of the neoliberal era – the sharp decline in the volatility of output and inflation
    – was that economic policy began to use the unemployment rate as a variety attenuator;
    external shocks could be accommodated or passed on, so long as wage pressure and
    price inflation did not build up.


    This was why the corporate management system of Jack Welch required the economic
    management system of the Great Moderation. The global economic system had gradually
    removed vital parts of its own brain; informal and rich communication channels
    within organisations were replaced with formal and contractual links which often
    crossed time zones. Intelligence functions that were meant to consider the future
    were swamped with debt, so that they couldn''t pay attention to anything that
    didn''t generate cash for the next payment. Because it was reducing its capacity,
    the corporate system with its managers and investors was no longer able to absorb
    volatility and shocks; the economy had to be reorganised so the working class
    performed this function. It looked like the final triumph of capital, and it was.


    Until it wasn''t. We discussed in Chapter 5 how the blind spots and weaknesses
    in the overall system of governance were so placed as miss the debt bubble and
    consequent global polycrisis. This bubble was, almost everything that goes wrong
    in a cybernetic system, a solution that turned into a problem.


