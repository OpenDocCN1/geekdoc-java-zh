  md: 'Cyberstride is being used as a piece of variety engineering to help match the
    resources of the Operations Room to the data coming in. There was also a plan
    to develop another piece of software (Checo, the Chilean economic simulator) to
    act as a System 4 and allow potential future and outside shocks to form part of
    the debate in the Operations Room. We''ll talk about System 5 later.


    But, if you look at Cybers in terms of management cybernetics, you''ll immediately
    suspect the whole project was badly of scale to the problems it was meant to solve.
    While the exact measurement of information and variety is almost impossible at
    large scale, the idea that a few hundred telex machines might be matched to an
    industrial economy just doesn''t pass a test. They did extremely well to manage
    the trucking strike, but as a test of the viable system, this was set to fail.


    Furthermore, the very act of creating Cybers provoked a reaction from the system
    it was meant to regulate. In the early stages when Beer was first retained as
    a consultant, people had been warning the Allende government that it was nationalising
    too fast, without regard for the capacity to manage them, and seemingly without
    much in the way of an overall industrial plan. They had introduced a system of
    ''interventors'' who sat in the factories and passed on orders from central government;
    this was unpopular, and contributed to the impression of central technocratic
    control rather than devolved autonomous production. The biggest difficulty Beer
    and the project team faced was getting cooperation from the field.


    And the Cold War itself wasn not wholly ignored. Beer was the subject of de facto
    economic sanctions from the USA (including restrictions on the export of computers
    and telecommunications gear). Hard currency reserves were scarce, and made scarcer
    by the Chilean capitalist'' class of Communism, which led them to move money offshore
    and liquidate industrial investments. The Cybers project didn''t credibly have
    enough bandwidth even to run the economy in a steady state – it certainly wouldn''t
    been able to cope with the kind of rolling crisis that Chile actually faced in
