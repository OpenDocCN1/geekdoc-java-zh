- img_proc: true
  md: 'equity hometown memoir'' genre mentioned in Chapter 8; Gretchen Morgenson and
    Joshua Rosner have covered the economic disaster in These Are the Plunderers (Simon
    & Schuster, 2023). Moe Tkakic''s journalism at the American Economic Liberties
    Project continued to shock me long after I thought I had seen it all from the
    private equity industry. David Gilles, in The Man Who Broke Capitalism (Simon
    & Schuster, 2022), does the same thing with respect to Jack Welch. If you''re
    only familiar with the modern form of capitalism and management, it''s very worth
    reading As I See It (Prentice-Hall, 1976), the autobiography of J. Paul Getty,
    that sees things really used to be very different.


    A Citizen''s Guide to Artificial Intelligence (MIT Press, 2021) by John Zerilli,
    John Danaher, James Maclaurin, Colin Gavaghan, Joy Liddicoat and Merel Noorman
    is exactly what it says it is and covers the current state of technology. John
    Searle''s Minds, Brains and Programs (Cambridge University Press, 1980) has the
    original presentation of the ''Chinese room'' argument, while Consciousness Explained
    (Little, Brown, 1991) by Daniel C. Dennett gives the opposing view. Ben Kuipers''
    paper on corporations as artificial intelligences was presented at the MIT conference
    on Collective Intelligence 2012 and can be downloaded from his website, while
    Charlie Stross coined the ''very old, very slow AI'' phrase in his address to
    the 34th Chao Communication Congress; it''s also on his website.


    I will confess that I didn''t get much out of Practical Ironmaking (United Steel,
    1959) by G. D. Elliot and J. A. Bond.'
