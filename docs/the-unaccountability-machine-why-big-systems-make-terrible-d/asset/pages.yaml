  md: '# Ideology of the managerial class


    This is why the global management consultancy profession can''t provide corporations
    with the identity-creating function that economics provides to policymakers. It
    spends too much of its own capability and information-processing capacity in telling
    people what they want to.


    Economists do this, of course, but they are able to call on a huge reservoir of
    brain power in the universities. Business schools, on the other hand, have much
    more emphasis on teaching than on research. Only one or two professors in every
    generation can come up with a new way of rephrasing the generic problem of management,
    the fact that organisations have continued to get more complicated at a faster
    rate than the managers have. If you''re not lucky enough to be in that small number,
    you either have to become a disciple of one of the big stars, a specialist in
    a small niche, or to turn inwards and write for an audience of academics.


    Consequently, a large proportion of academic management science seems to consist
    of articles and books bemoaning the lack of a coherent intellectual framework
    or a connection between theory and practice. As a discipline, it has a hard time
    deciding whether it''s to be a critical social science about for management. Many
    of its top practitioners have an eye on the lucrative market for books that sell
    well in airports,* which makes them reluctant to participate in research programmes
    that can''t be incorporated into their personal brand. And when a big idea comes
    along, it tends to get overused and applied in inappropriate contexts.


    In many ways, this is a natural state for a social science to be in. There is
    no single coherent intellectual framework before sociology or anthropology either,
    and the cutting edge of academic thought in political science has as little influence
    on politics as management science does on business. Economics is the unusual case,
    in its ability to provide a framework and ideology for an important part of the
    global decision-making system.


    # The failure engine


    To summarise: if we think about the main decision-making systems of the industrialised
    world in cybernetic terms, we can see that there are a number of important blind
    spots and dysfunctional systems. In economics, we had'
