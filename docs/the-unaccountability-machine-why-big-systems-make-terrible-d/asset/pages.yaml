    ‘modelling strategy’ is to do with the kinds of mathematical statement that need
    to be put into a model in order to make it tractable, not because they have any
    relevance to the actual economy. Modelling strategy is all about making sure that
    you will end up with a specific conclusion rather than a cluster of ambiguous
    statements.


    And that’s important in economics, because as we said earlier, it’s a style of
    rhetoric and a way of thinking as well as a social science, and that style of
