    # The third thing in the room


    Maybe this third entity – the corporate owner of YouTube – is the nonhuman intelligence,
    and the algorithm is just one of its component parts. Maybe another, higher-level
    algorithm is made out of policies, employee handbooks and corporate communications.
    And if that’s the case, the hardware that’s running this algorithm is mainly made
