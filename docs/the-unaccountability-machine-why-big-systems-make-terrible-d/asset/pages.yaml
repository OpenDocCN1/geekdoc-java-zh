  md: 'There is a definite family resemblance between the self-organising criminogenicity
    of the 2008 financial crisis and the stuff that went on at Fox News in 2020 –
    the ‘criminogenic organisation’ might really be a special case of the ‘structurally
    bad decision-making organisation’. But, when provided with a lot of spare time
    during the pandemic, I started wondering more about the raw material of the Capitol
    Hills riot. These angry people, whose reactions were so frightening, so difficult
    to control – where did they come from?


    To a certain extent, of course, Fox News made them. Over twenty-five years, it
    had become a media colossus, largely based on two creative insights. First, that
    some people enjoy being angry, and will consume their rage as a product. And second,
    that some presenters have the gift of making people angry, just like a comedian
    can make people laugh.


    But there’s more to it that Fox News couldn’t actually control the rage of its
    audience, as it belated found out. And it’s not intellectually satisfying to create
    a theory of Trump voters that only explains one phenomenon. Because almost everywhere
    you look in the world over the last couple of decades, you will find movements
    and trends that look quite similar. Silvio Berlusconi was the Trump of Italy.
    Jair Bolsonaro was the Trump of Brazil. Angry people, politically incoherent populist
    politicians and media organisations that sell practising rage are everywhere.
    It can’t be a coincidence; we need a theory that covers them all.


    The historian and writer Adam Tooze refers to ‘polycrisis’ of the twenty-first
    century. This is an umbrella term covering a lot of these phenomena, held together
    by a kind of structural resemblance. The defining characteristic of the polycrisis
    is a loss of control it’s often associated with an economic crisis of some sort,
    as in Greece in the early 2010s, but not always. There’s a sudden loss of prestige,
    as the professional and managerial class makes a high-profile mistake. The populists
    and the merchants of rage step into that gap. So the questions that need to be
    answered are: how does this happen? And why?


    # The people who left and came back


    One of the stylised facts that interested me is that the people most involved
    in the ground level of the polycrisis were often the ones who had been'
