  md: '# 6


    # Economics and How It Got That Way


    Economics is a science of thinking in terms of models, joined to the art of choosing
    models which are relevant to the contemporary world.


    > John Maynard Keynes, letter to Roy Harrod, 1938


    To the extent that any of it was designed at all, this world was designed by economists.
    Of all the social sciences, economics was the one that embedded itself in the
    governance and regulation of public life – the higher functions of the system,
    the ones that balance future and present needs.


    And as any other identity-creating function, economics has been a major engine
    of information attenuation for the control system. Adopting the economic mode
    of thinking reduces the demands placed on our ruling classes by telling them that
    there are lots of things they don''t have to bother thinking about. The adoption
    of economic growth and efficiency as a core philosophy and cost-benefit analysis
    as a method of governance means not only that thousands of possible policies can
    be rejected without serious consideration, but also that whole approaches to human
    life never need to be considered.


    Before we really start using the economic toolkit to diagnose the crises of the
    industrial world, it''s worth spending a bit of time thinking about this widely
    misunderstood but highly influential thing called economics. It has blind spots
    and inconsistencies, which often lead to predictable flaws in our institutions.
    When non-human decision-making systems become pathological in society today –
    most characteristically, when decisions are made which have disastrous long-term
    consequences as a result of relatively trivial short-term cash savings – the pathology
    is often directly related to something that seemed like a good idea to an economist.'
