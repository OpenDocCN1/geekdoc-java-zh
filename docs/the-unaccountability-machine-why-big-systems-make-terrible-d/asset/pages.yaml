    # The blind spots


    This is how the cybernetic problems of the post-war industrial state have been
    shaped by economics. There are three major blind spots: the belief in markets
    as computing fabric, the flattening of time and uncertainty and the commitment
    to Ricardianism.


    The belief in markets as computing fabric is such an obvious source of blind spots
    as to hardly require explanation. Faith in the power of free markets to solve
    optimisation problems is so great as to support the reverse inference of economists
    that if something appears to be a market equilibrium, then it must be an optimal
    solution. This might not have been too bad if it had been treated as a first presumption,
    but it became ideological. A great deal of the reasons why policymakers mistakes
    comes from a reluctance to second-guess market outcomes. Think of housing bubbles,
    for example, or financial deregulation.


    ‘Market outcomes’ are a huge accountability sink, but there’s also a philosophical
    blind spot. Policymakers and their advisors have internalised the belief that
    the market is a greater intelligence than anything humanity can offer. The combination
    of political convenience and intellectual rationalisation is a powerful one; when
    a possible market solution presents itself, it has a huge advantage in consideration
    against alternatives, whether or not it deserves one.'
