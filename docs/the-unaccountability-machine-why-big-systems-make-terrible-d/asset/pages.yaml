    The economy is an information-processing system, does that mean that every corporation
    is an artificial intelligence? If people are worried about out-of-control AI taking
    over the world and destroying everything, shouldn’t we have been trying to do
    something about at least seventy years ago – and probably more like two hundred?


    This seems to be where you end up if you start thinking about cybernetics and
    black boxes. Consider the example of a young person going down a YouTube rabbit
    hole. There’s a human intelligence taking in the content. There’s also an algorithmic
    system at work, showing them one video after another. You wouldn’t necessarily
    call the algorithm ‘intelligence’, although it seems to do things with a purpose.
    But then there’s a third entity in the background – the company that owns YouTube,
