  md: 'Cybernetics is a huge subject, and it will take several chapters to discuss
    it in anything like the detail it deserves. But for the time being, it’s important
    to note that Stafford Beer wasn’t unusual in reading Wiener’s book in 1950 – Cybernetics
    had been the standout pop science hit of 1948, and it was still making waves.
    This is strange in a way, because much of the book was dedicated to dense mathematics,
    setting out the research programme which had grown out of Wiener’s war on automation
    and feedback. Even mathematicians found it heavy going. Stafford Beer, with the
    unusual talent that had seen him teach himself university-level mathematics during
    one summer at the age of fourteen, might have been one of the only people in the
    world who really understood it. At least, Wiener certainly seemed to think so.


    The part of Cybernetics that captured the imagination was described by the book’s
    subtitle: Control and Communication in the Animal and Machine. It was one of the
    first to put forward the idea of thinking machines, and that was exciting enough
    for the book-buying population. There were spin-offs and copycats, including a
    self-help book called Psycho-Cybernetics which invited its readers to treat their
    subconscious mind as a controllable ‘Automatic Success Mechanism’. The Psycho-Cybernetics
    system, originally developed by a cosmetic surgeon Maxwell Maltz, formed the base
    of a number of self-help courses based on positive affirmations, with Tony Robbins
    probably the best-known follower active today.


    One of the book’s most lasting cultural influences, though – the prefix ‘cyber’,
    which has been attached to everything from computer crime to sex chat – is actually
    a mistake. If one were to follow the etymology of Wiener’s coinage, it would come
    from ‘cyber-netics’, the word coming from the Ancient Greek for person who steers
    a galley by giving orders to the oarsmen. The way we devised the word up, as if
    we decided that there might be other kinds of ‘tronics’.*


    So, cybernetics was the study of the control of systems – or specifically, the
    study of the control of systems with enough complexity for there to exist an interesting
    problem of how to manage them. The building blocks of cybernetic arguments are
    framed in terms of relationships between elements which have to be viewed as black
    boxes. Norbert Wiener’s book gave a mathematical system which aimed to provide
    a'
