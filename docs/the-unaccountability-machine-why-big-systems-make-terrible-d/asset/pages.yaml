    # Homo economicus was a friend of mine


    Consider, for example, the iconic image of economics – the diagonal crossed lines
    of the supply and demand curve graph, with price on the vertical axis and quantity
    on the horizontal one. The line representing demand slopes downwards, because
    customers want less of the product as the price rises; the line representing supply
    slopes up, because companies want to sell more of it at a higher price. You can
    show undergraduates a few interesting things with this kind of graph – the effects
    of price regulation, changing technology and so on – but let’s think about the
    assumptions that had to be made to get there.


    There are comparatively few industries where the textbook supply and demand graph
    is reasonably defensible as a description of how decisions on price and quantity
