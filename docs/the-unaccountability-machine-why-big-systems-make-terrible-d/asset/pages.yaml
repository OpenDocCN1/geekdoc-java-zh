  md: 'takes a consistent approach – there is nothing to be gained by opening the
    black box. If you are trying to understand a system, all you can do is observe
    its behaviour, and whatever you can learn from doing so is all there to know about
    it.


    Considered as a general principle, this doesn''t seem too disturbing. The disquieting
    effect only emerges when you consider a particular case, where the system under
    analysis is made up of human beings and the forces operating on them are their
    own individual desires. We can all think of cases where organisations systematically
    deliver outcomes that are wildly at odds with their stated objectives. Stafford
    Beer''s cybernetics tells us that in these cases, while people''s opinions are
    important, the facts of the organisational outcomes are what we need to work with.
    In his most pithy formulation of the principle, he expands the black box principle
    to a rather uncomfortable statement.


    The purpose of a system is what it does.


    This version was taken up by management cyberneticians, and often referred to
    by its acronym, POSIWID. Returning to the case studies of the last chapter, the
    purpose of academic publishing is to generate citations for academics and profits
    for publishing houses; the individuals involved might want to expand and communicate
    human knowledge, but the system behaves in ways that support its goals, not theirs.
    The purpose of the pet hotel at Schiphol Airport was to shred squirrels; everyone
    involved cared about animal welfare, but the system had been set up to ensure
    compliance with import regulation at the lowest cost possible, so that''s what
    it did.


    It''s easy to mistake the POSIWID view of the world for a slightly tiresome kind
    of kindness. To say that the purpose of the system is what it does isn''t to make
    any statement about the intentions of the people working for it. The danger of
    confusing the properties of the system with those of its members is one of the
    most important reasons for not opening a black box. Unfortunately, it''s a very
    common confusion; few people are able to take a step back, view their own organisation
    as if from outside, and realise that they are structurally producing results which
    are exactly the opposite of what they had intended.'
