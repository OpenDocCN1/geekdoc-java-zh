  md: 'Think of the different steps you could add to make the wine/cloth model more
    realistic as a description of the real world. You could include more commodities;
    you could stop pretending there was only one input; you could consider brand premiums
    and quality. You could introduce the fact that goods are made by companies. You
    could think about investment in production processes and long-term strategic planning.
    You could ask what happens when the demand for a product in one country affects
    the overall global price.


    If you looked at what actually happens, you’d see that countries often import
    similar kinds of goods to the ones they export, which doesn’t seem consistent
    with this model. So you might decide to model product differentiation, government
    policy, or strategic behaviour. Depending on what you chose, how you set up the
    model and what assumptions you made, you could prove your own result, or the one
    that your boss wanted you to prove. But which of these models would give the objectively
    ‘right’ answer? The model won’t tell you, that’s for sure.


    Proving ‘in the model’ and then acting as they’re true in the world is a terrible
    habit of economists. Not much has changed since Ricardo’s day, except that the
    mathematics got more difficult; as a result, it is significantly more difficult
    to tell whether an assumption is merely a technical one to simplify the calculation,
    or whether it is equivalent to assuming the conclusion. As a rule of thumb, whenever
    you hear an economist say ‘how you look at the numbers’ you should think of it
    as meaning ‘however I look at these’


    Even the assumption that has to be a conclusion at all can be problematic. After
    all, reality doesn’t usually give you straightforward answers, so why should we
