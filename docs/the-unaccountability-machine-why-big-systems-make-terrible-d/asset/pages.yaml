  md: 'In terms of Beer''s own works, the big two are Brain of the Firm (John Wiley,
    1972, but if possible get the second edition from 1981 which has a lot of updated
    material) and The Heart of Enterprise (John Wiley, 1979). Those are the correct
    names, by the way; if you don''t want to look like a newbie, never say ‘The Brain
    of the Firm’ or ‘Heart of Enterprise’. Of the two, Heart is a lot more user-friendly
    while Brain is the essentially rigorous text of the viable system model. Don not
    allow yourself to get stuck on page 47 of Brain; the ‘anamastic reticulum’ diagram
    in Figure 9 has confused everyone I know who has read it and it''s much easier
    to work out the points with a pencil and paper. Beer''s textbook is Diagnosing
    the System for Organizations (John Wiley, 1985) and it''s a very good introduction
    with all the maths replaced by diagrams if you like that sort of thing.


    There''s a lot of good stuff in later Beer, although it''s mainly on wider issues
    than those discussed in this book. Platform for Change (John Wiley, 1975) gives
    his views on social and macroeconomic questions while Designing Freedom (John
    Wiley, 1975) is a shorter version of the same theses, compiled from his CBC Lectures.
    Two collections of shorter pieces and lectures are How Many Grapes Went into the
    Wine, edited by Roger Harden and Allen Leonard (John Wiley, 1994) and Think Before
    You Think, edited by David Whittaker (Waveestone Press, 2009). These are probably
    the best place to start, because you can dip into them rather than needing clear
    time to hold the structure in your head, and you''ll almost always find something
    amusing and insightful when you do. I also greatly enjoyed Decision and Control
    (John Wiley, 1966) and Management Science: The Business of Operations Research
    (Aldus Books, 1968), but these are other should be considered ‘lesser works’.
    Pebbles to Computers: The Thread (co-authored with David Suzuki and with gorgeous
    photos by Hans Blohm, QUP, 1986) is great to lay out over your coffee table.


    In terms of books by other people about Beer, I''d thoroughly recommend Stafford
    Beer: The Father of Management Cybernetics by Vanilla Beer and Allen Leonard (independently
    published, 2019). It''s coauthored by his daughter and long-term partner, and
    has a lovely biography in the form of a graphic novel combined with an incredibly
    useful glossary of cybernetic terms. The latter is particularly essential because
    you often'
