  md: 'battle plan to stop the platoon firing on its own troops, the system that assigned
    soldiers to the platoon in the first place, and so on.


    And on the other end of the resource bargain, we have the battlefield commander,
    with the job of sending different platoons to different tasks in service of the
    overall military objective. Coordinating the activities of a group of different
    System 1 operations is in Stafford Beer''s model, and it''s called System 3 –
    optimisation or integration. The system of directs directs the management of each
    individual operation in order to coordinate their activities towards a particular
    purpose. It is important to be clear that this level of organisation exists because
    there are always several System 1 operations to coordinate in service of a higher-level
    purpose. It''s unusual to find a system that''s only doing one thing, and if you
    think you''ve found one, it''s more likely that you haven''t analysed its operations
    carefully


    # Keepers of the resource bargain


    System 3 is where you start finding management jobs those that are entirely devoted
    to communication and administration within the organisation. It''s also where
    system-level accountability is established; the key activity of the integration
    and optimisation function is to agree the resource bargains with the System 1
    units, and to ensure that they are being kept. And consequently, it''s the first
    place you might start to look if you think that unaccountability is creeping into
    the system. We''ll be looking at this a lot, later.


    It''s easy to get confused between systems 2 and 3. Both of them look like they''re
    doing the same thing, making the operations accountable to one another and to
    the wider organisation. The difference is that System 2 is all about preventing
    clashes and managing conflicts, while System 3 is concerned with achieving a purpose.
    On the ground, a useful way of drawing the distinction is to look at the management
    functions which everyone agrees to be necessary, as opposed to those they complain
    about. In consulting assignments, Beer often found that people who were System
    3 managers would pretend that they were in the harmless and necessary System 2.'
