  md: 'So, I''m not going to draw a single box or arrow; I''m just going to explain,
    in words, the main elements of Stafford Beer''s viable system model. I''m going
    to leave out as much detail as I can; if you''re really interested in the system,
    there''s no substitute for Brain of the Firm and The Heart of Enterprise. I won''t
    lie; it''s still going to be heavier than any other chapter in this book. But
    at the end of it, you''ll have the toolkit, and you''ll be able to understand
    how to apply the model to the big systems of accountability and control that have
    gone wrong over the last few decades.


    The trick to understanding it is to always keep sight of the basic underlying
    structure, which has five components. You have the part of the system that stops
    things getting in each other''s way. You have the part that decides what to do
    today. There is the part of the system that''s responsible for looking at how
    the environment is changing. And then . . to be honest, it''s difficult to explain
    the last part without going into more detail. Let''s dive in.


    # The viable systems


    The first part of the model is System 1, or operations, the bit of the organisation
    that is involved in making change in the real world. Soldier''s a part of the
    system that could, in principle, be turned into an independent organisation. In
    fact, it has its own internal management, which is also important to the structure
    of the model. Hold on to that thought – we''ll come back to it.


    If you set System 1 loose, though, you could expect a bit of chaos – the same
    squirrel being fed a dozen times while another starve; two classes showing up
    at the same lecture hall and the like. Systems that aim to prevent this sort of
