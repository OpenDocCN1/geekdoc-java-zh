    # Crimes without criminals


    I should probably introduce myself at this point. I have a professional interest
    in situations like this – cases where the exact thing nobody wanted to have happened.


    I was once an investment banker, and during the bouncingrubble period of the last
    financial crisis, I wrote a book called Lying for Money, about the history and
    economics of financial fraud. One of the big people were asking at that time was
    why, despite there being a strong popular perception that hanging was too good
    for them, bankers were not going to jail. I ended up reaching a pretty surprising
    conclusion: that although there were a number of bad reasons why prosecutors were
    reluctant to take on the vested interests, the basic problem was that in a democratic
    society, if you want to put someone in prison then you need them to intentionally
    charge a specific act.


    Many years ago, in an earlier financial crisis linked to small savings banks in
    the USA during the 1980s, the fraud investigator Bill Black coined the concept
    of a ‘criminogenic organisation’. It referred to an'
  merge: -1
  pgno: 15
- img_proc: true
  md: 'institution in which incentives management systems were structurally designed
    to ensure that crimes would be committed. This was an integral part of his theory
    of the savings bank crisis, of a ‘control fraud’. This occurred when a bank came
    under the control of a criminal, who was then able to set in place a system of
    incentives which ensured that fraudulent loans were made and profits declared,
    which would naturally flow into the fraudster''s pockets.


    This solved several of the key problems that had bedevilled white-collar criminals
    over the years, the biggest of which was the need for overt acts of embezzlement.
    Stealing money by dishonesty had previously tended to require you to make illegal
    transactions improper payments or false bookkeeping entries – which posed a risk
    of detection. In a control fraud, the dishonesty resided in the overall scheme
    and all the transfers of cash transactions with parties connected to the management.
    Furthermore, there was often a matter of layers between the guilty mind and the
    criminal act – unless there was a paper trail, most of the prosecutable things
    were done by people other than those that the authorities would naturally want
    to prosecute.


    As it happened, the technology was in its infancy in the 1980s and most of the
    crooks pursued by Bill Black were careless about leaving the kind of paper trail
    he needed. But by the beginning of this century had got weirder. After investigating
    some of the biggest scandals of the financial crisis, I concluded that not only
    was there no paper trail between the low-level crooks and the bosses, in most
    cases there was no connection. I ended up coining the term ‘self-organising control
    fraud’. The idea was that the financial system of the developed world, from around
    the fall of Communism in Europe, had a point where the overall system of incentives
    in the economy was so criminogenic that banks had a natural tendency to organise
    themselves into fraudulent behaviour. All the top executives had to do was so
    unrealistic profitability targets and underinvest in legal departments and compliance
    systems. It wasn’t so much that anyone had told their traders what to do; more
    that nobody ever organised things in such a way that they wouldn’t form a criminal
    conspiracy.


