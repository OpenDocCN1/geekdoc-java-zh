    the national economic plan. The plan was itself a bargain, struck between the
    systems responsible for optimisation of current production and those that looked
    out to the future. And, as we''ve seen, balancing those two systems and managing
    the development of the bargain between them was the responsibility of the highest-level
    function in the model, System 5. As Beer told the story:


    I drew the square on the piece of paper . . . [The President] threw himself back
    in his chair: ‘At last’, he said, ‘el pueblo.’ This remark, as I have previously
    attested, had a profound effect on me.


    The people. It''s hard to know what extent was a rhetorical flourish on the part
    of Salvador Allende, but one of the most underestimated techniques of political
    and social analysis is to look at people''s jokes and metaphors, and take them
    literally.


    One of the big problems with cybernetics is that it is difficult to know when
    to stop. The web of causal connections and information flows reaches a tidy end
    with everything tied up; every system turns out to be a subsystem embedded in
    a larger system. When you go down the chain, you can eventually come to a stop
    as the units of analysis reach the size of a single human being. When you go up,
    every management unit is itself part of a bigger unit and so on...


    El pueblo. The system closes itself — or at least, it does in any non-totalitarian
    society — the fact that the highest-level decision-making system operates by consent
    of the decided-upon. Even in a dictatorship, there is a collective veto capable
    of being exercised if the situation becomes intolerable to the individuals who
    make it up. Even the abstract, high-level, unimaginably complex cybernetic entities
    we''ve been thinking about — slowmoving artificial intelligences ‘global capitalism’
    – are embedded in even slower, even more abstract collective decision-making system
