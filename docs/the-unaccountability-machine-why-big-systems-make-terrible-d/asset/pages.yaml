  md: '# 5


    # # Cybernetics Without Diagrams


    We shall not, however, be much interested in any exact measure of largeness on
    some particular definition; rather, we shall refer to a relation between the system
    and some definite, given, observer who is going to study or control it.


    > W. Ross Ashby, An Introduction to Cybernetics, 1996


    One of the most characteristic features of management cybernetics is the diagrams.
    Huge diagrams, with lots of arrows overlapping each other. One of Stafford Beer’s
    books has a copyright-free annex at the back, where he encourages readers to photocopy
    his diagrams and blow them up to A2 poster size, before pinning them to noticeboards
    and writing captions in the boxes. Another book has chapters in which he shows
    how the final diagram is built up from half a dozen simpler ones, followed by
    a chapter in which this is shown to be a simplified excerpt of a more complicated
    diagram. At various points in books like The Heart of Enterprise and Brain of
    the Firm, he bemoans the limitations of a flat sheet of paper when it comes to
    showing multiple levels of connection, though it’s not obvious that three dimensions
    would be enough if he had them.


    This makes for reading, unfortunately. Diagrams present you with the information
    ‘all at once’ and leave you to work out the flow of cause and effect for yourself,
    with a verbal explanation usually presents you with the story of cause and effect
    and leaves you to remember the connections. In the context of systems, where feedback
    is ubiquitous, the relationships are vital and the flow of cause and effect has
    no obvious start or end point, it’s not hard to see why people draw diagrams.
    This emphasis on connections means that diagrams are often ineffective ways of
    explaining something for the first time; they give you a network of relationships,
    but in a context that doesn’t tell you what about the things are which the relationships
    are holding between.'
