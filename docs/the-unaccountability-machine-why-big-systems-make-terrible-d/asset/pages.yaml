    # How Ricardians win arguments


    The Ricardian Vice is a powerful thing. It is easy to fall into, hard to get out
    of, and works well for the people who have it. The way in which Ricardianism reproduces
    itself, and in which Ricardians win arguments, is that they collect the numbers.


    Deciding on the methodology for data collection is a great way to make decisions
    without leaving fingerprints. Every decision about what to measure is implicitly
    a decision about what not to measure, effectively deciding what aspects of environmental
    variety are going to be ignored or attenuated.


    More than that, if the data is going to be turned into information and gain a
    causal role in decision-making, it needs to be translated into the language spoken
    by the system. If you''re in charge of designing and collecting the numbers, then
    not only do you decide what gets measured, you decide how it''s classified and
    presented. So, for example, the death of a human being can be encoded as liver
    failure (medical classification), mercury poisoning (causal classification) or
    murder (criminological classification). Numbers are collected for a purpose, and
    it''s often surprisingly hard to use them for any other purpose.'
