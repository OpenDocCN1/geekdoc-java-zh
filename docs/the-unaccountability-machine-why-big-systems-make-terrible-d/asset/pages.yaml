    And the different levels of systems aren’t necessarily aware of each other. For
    one thing, some of the important systems may be informal networks, with no systematic
    reporting or consistency of personnel. The functions of the viable system don’t
    match up to individual responsibilities on an organisation chart. But more fundamentally,
    the purpose of having levels of organisation is so that you don’t need to communicate
