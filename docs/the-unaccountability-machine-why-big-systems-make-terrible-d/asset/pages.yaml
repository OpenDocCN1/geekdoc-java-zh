  md: 'This, more or less, was what happened to the science of cybernetics. Some people
    were interested in information because they wanted to transmit messages from one
    location to another, or to process strings of bits representing numbers in series
    of sequential operations. Others were interested in systems with multiple inputs
    and outputs and complex connections between them – like brains (and, when Stafford
    Beer came along, organisations).


    Very quickly and the physicists and engineers realised that the concept of information
    was related to things that had already been established in the statistical-mechanical
    interpretation of thermodynamics. In particular, they saw that information was
    a difference between states – a system in perfect thermal equilibrium had, in
    some sense, lost its information. Information was therefore related to the concept
    of entropy, the extent to which energy becomes disordered and unusable as heat
    cools down, cold things warm up and the universe tends towards inevitable stability.


    This leap of understanding allowed a great deal of the existing mathematical toolkit
    of physics to bring bear on the problem. A number of key concepts were soon developed,
    relating to the capacity of a noisy channel to carry a message and methods for
    error correction. ‘Information theory’ had been born. There were actually two
    versions of it. In Wiener’s theorem, information was represented by entropy with
    a negative sign in front of it, and was interpreted as the amount of ‘order’ in
    a sequence. Claude Shannon of Bell Labs derived the same theorem independently,
    but in his version there was no negative sign, and information was taken as representing
    the extent to which a sequence was unpredictable – whether it constituted ‘news’.


    Shannon’s version of information theory was the one that more people remember
    these days; it was more suited to communications and computing, (among other things)
    it measures the extent to which a message can be digitally ‘compressed’ to take
    up less memory space by getting rid of redundancy. Wiener was reasonably generous
    in allowing the credit for discovery, but stuck with his own formulation and regarded
    it as philosophically significant.


    But the rapid progress in information theory was mainly related to operations
    that could be carried out by bit, one at a time. Progress on complex systems –
    the initial goal of the cyberneticicians – was much slower.'
