  md: 'The research staff of education policy institutions care a lot more about ‘grade
    inflation’ than almost anyone else. For most purposes, your highschool grades
    are insignificant a few years after you join the workforce. They allow universities
    to differentiate between applicants in any one year, and employers might use them
    for the same purpose. But it''s quite rare for anyone to have to assess the merits
    of two candidates who did in different years, when they don''t have lots of other
    information about them''s more important than their grade in A level Chemistry.


    Almost without anyone noticing, the algorithm that was designed was a sort of
    ‘perplexity minimiser’. In the technical documentation, it seemed that the main
    design criterion had to be that the overall distribution of grades was as close
    as possible to the curve describing the allocation of previous years. This would
    minimise the degree of grade inflation and in the minds of the designers, it was
    ‘fair on average’. But of course, you can''t be fair to an average; fairness or
    unfairness happens to individuals.


    The Algorithm took the assessments given by schoolteachers as inputs and then
    increased or decreased them, based on an equation that was meant to estimate the
    extent to which the school might have overestimated (or, more rarely, underestimated)
    the grade that pupil would have attained the exams took place. This equation,
    in turn, was based on the proportion of each grade that had been earned at school
    in previous years.


    If anyone had thought about this, they might have realised that a system that
    penalises bright young people for going to school in underprivileged areas was
    always going to raise serious concerns. But they didn''t. This appears to have
    been at least partly because of an offsetting error. There wasn''t enough historical
    information to define the parameters of the equation, the Algorithm ignored it
    and used the teachers'' unadjusted grades. So, in the name of fairness, the DfE
    ended up creating a system that rewarded small classes (more common in private
    schools) and penalised large ones with an undistinguishable track record. It performed
    well in terms of the closeness of fit to past years'' curves; it was fair to the
    average.


    On the day the adjusted grades were announced, all hell broke loose, demonstrating
    my friend the statistician''s assertion that explainability only becomes a problem
    when you''re giving bad news. There was a lot of bad news, particularly for inner-city
    kids with dreams of going to university. When the DfE published the details of
