    By the end of the post-war intellectual upheavals, though, economics changed into
    a very mathematical science, based on a general toolkit of ‘constrained optimisation’.
    Broadly speaking, if you could convert your problem into one with a single numerical
    index of success or failure, economists would regard it as their job to help you.
    ‘Help’, in this context, meant that they would find a way to describe what you
