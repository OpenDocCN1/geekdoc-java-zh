  md: 'their independence was something that was permitted by the democratic government,
    rather than a power exercised by right. This view began to be challenged in the
    1970s, as the economists Edward C.Prescott and Finn E. Kydland proved (in their
    model) that democratic control of the money supply was an unaffordable luxury.


    The broad structure of the argument was what they called ‘time inconsistency’.
    The idea was that governments knew what they should do in the long term, but they
    were subject to destabilising feedback from the election cycle. Without a great
    deal of evidence, economists asserted that in countries where monetary policy
    was controlled by the political authorities, they would always be tempted to create
    an unsustainable mini-boom in an election year, trading short-term inflation for
    short-term growth in wages and employment.


    But since the artificial people in the economists’ models were assumed to be rational
    and far-sighted, there was not really such thing as short-term inflation or a
    trade-off between employment and prices; people would build the political cycle
    into their wage demands and pricing. The outcome was therefore that the overall
    level of inflation would be higher at all times and anti-inflationary policy would
    be less effective.


    In this model, the government is trapped by its short-term needs in a self-destructive
    cycle. Everyone can see that the policy is disastrous over the long term; inflation
    would build up to such a degree that much more drastic action would have to be
    taken. But at any moment before the disaster arrives, it is less painful to go
    through one more cycle of obtaining easy money. The solution, in the model, was
    for the government to hand over control to an independent, unaccountable body,
    the equivalent of Odysseus himself to the mast to avoid being tempted by the sirens.
    (This metaphor was done to death during the period in question.)


    In cyber terms, the central bankers of the period seem to have concluded that
    the problem with the system was the channels of accountability from those affected
    by unemployment and recession were working too well; they were transmitting too
    much information and impairing the ability of the system to manage itself. This
    might seem like a curious conclusion now, but hindsight obscures the concern over
    inflation and volatility. There was a powerful sense in the air that something
    had to be done so that the inflation of the 1970s was not repeated.'
