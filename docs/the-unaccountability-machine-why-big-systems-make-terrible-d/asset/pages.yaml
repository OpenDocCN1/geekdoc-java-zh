  md: 'reached the best outcome they could find. For the cyberneticians, an analogous
    concept was ‘homeostasis’. This literally just means ‘same state’, but in context
    it is applied to systems where feedback is present. If that feedback has the tendency
    to stabilise the system, oscillations will be damped and the system will tend
    to settle down; an example might be the gyroscopic stabilisers of a ship which
    react to deviations from the axis by pushing in the opposite direction. If that
    feedback has the opposite tendency, oscillations and deviations will be amplified,
    and the system will tend to blow up; an example might be Jimi Hendrix’s amplifiers.
    If the feedback is complicated and has both stabilising and destabilising elements,
    things get interesting; it might be stable most of the time but tear itself exposed
    to the wrong kind of shock. Or it might switch from one stable state to another.


    However, unlike economists’ concept of equilibrium, there’s no implication that
    a homeostatic state is optimal, just that forces exist which will try to return
    to the system when it is perturbed. Early cyberneticians were keen on building
    ‘homeostats’ from springs or electric circuits and compass needles, to show how
    complicated the behaviour could be, and how looked stable suddenly reinvent itself
    in response to a seemingly minor change. In the case of organisations, it’s an
    important way of understanding what Stafford Beer was trying to do; a large part
    of management cybernetics is about understanding how the relationships and links
    between subsystems create homeostatic forces.


    # Purpose


    The idea of homeostasis is fundamental to one of Beer’s most lasting and contentious
    aphorisms. Compared to the economists’ concept of equilibrium, the key feature
    of the cybernetician’s equivalent is that there’s no implication that it’s the
    result of anything outside the system. The homeostatic state is what the system
    returns to, though. In that sense, it is what the system ‘wants’. Your assumption
    about how much sarcasm is intended by my punctuation here will be dictated by
    your philosophical views about the whole subject matter. To what extent can a
    system be said to want anything?


    Stafford Beer’s answers to this as philosophical question fill many chapters of
    his books, but in his work on management cybernetics, he'
