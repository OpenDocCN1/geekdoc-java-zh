  md: 'The trouble with complex systems is that combinations of things tend to multiply
    together rather than adding up, so the number of possible states gets out of control
    very quickly. Even a Rubik’s Cube has more than 43 quintillion possible states;
    clearly a brain or an organisation has far more. So one side of the cybernetic
    project was always going to develop far more quickly than the other. Pretty soon,
    everyone who could find a way to convert their problem into one where bits of
    information could be addressed sequentially rather than combination had so. And
    the new science of communication and control was left in the dust, subject to
    the unfair perception that it hadn’t made much progress.


    The philosophers and neurologists were not just hampered by the war. There was
    also an element of ‘decisions nobody made’ to the structure of cybernetic research
    after the war. As we have noted about economics and medicine, some sciences are
    cursed with the need to answer questions as they arise, rather than in a logical
    order. For the early cyberneticians — and therefore, for the majority of computer
    scientists to the present day — crucial, foundational assumptions were built into
    the discipline in the 1940s, largely because of the war. Wiener came to regret
    having decided early on if control systems were to be used for work, they would
    need to have a number of practical properties.


    They couldn’t depend on accurate measurement, because of the conditions they would
    be operating under. Information would need to be represented and calculations
    made digitally (like an abacus) and not in analogue form (like a slide rule).
    They would probably need to be implemented in electronic rather than mechanical
    form; electronic switches could operate more quickly and would not wear out. In
    this turn numbers would need to be represented as binary digits (later known as
    ‘bits’). And since every occasion on which information was input by a human being
    or output for human understanding would slow the process down and introduce opportunities
    for errors, as much of the process as possible had to be put on the machine.


    These decisions meant that research into other kinds of computing would move more
