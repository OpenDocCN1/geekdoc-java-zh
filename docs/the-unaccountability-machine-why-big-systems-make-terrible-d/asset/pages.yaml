    of reasoning. This one was identified by Joseph Schumpeter as ‘the Ricardian Vice’
    in his history of economics – both in tribute to Ricardo and in identification
    of the problematic side of his legacy. Ever since Ricardo, economists had a strong
    tendency to:


    +   a) make a model of some spoke feature of the economy, stripping away nearly
    all the complexity;

    b) make a lot of simplifying assumptions, often questionable in terms of their
    empirical relevance;

    c) show that their conclusion follows from their assumptions, which ought to be
    quite easy if they’ve made the assumptions strong enough;

    d) act if their conclusion has now been proved in the real world.


    Economists do this all the time. A very influential model of racial and gender
