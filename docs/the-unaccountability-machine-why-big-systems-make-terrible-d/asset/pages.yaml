  md: '# Acknowledgements


    This book was a while in the making, and involved changing my mind on key concepts
    several times after talking to other people. Among those who might recognise some
    of the points they made to me over the years are Andrea Filtri, Mark Blyth, Chris
    Bertram, Trevor Ketch, Henry Farrell, Kieran Healey, Dan Hardie, Steve Teles,
    Chris Brooke, Doug Henwood, Ben Kuipers, Charlie Stross, Alex Harrowlow, Indi
    Samarajiva, Jo Michell, Josh Loftius, Jamie Galbraith, Alex Williams, Stan Westlake,
    Sam Freeman, Maria Farrell, Carolyn Nissoko and Daniela Gabor. I dearly wish Sebastian
    Nokes and Kelley Walker were still here to do the same. Every one of them has
    a perpetual licence to say that they came up with all the good bits and express
    confusion as how I got all the rest of it so mixed up.


    Michael Pollak also belongs in the list above, but he made so many useful comments
    on the actual book that I have to start a new paragraph to mention him specifically.
    He challenged a number of the key concepts and forced me to get rid of a number
    of digressions and self-indulgences. He promised to tell me what his real disagreements
    with the thesis are when it''s published, and I look forward to those! Tim Atkins
    also made really useful comments. Thanks to Brian Eno for spending some of his
    presumably extremely rare moments on an email exchange confirming the details
    of what he did and said.


    Ed Lake commissioned the book, and his strength of will in rejecting numerous
    proposed outlines and telling me to get it right has undoubtedly the thing much
    better. Nick Humphrey continued Profile Books'' insistence on quality control
    and standards, and has helped hugely to turn a list of hobby-hories and semi-related
    anecdotes into a coherent argument. My agent, Sophie Hicks, kept the process moving
    with admirable efficiency. I also benefited hugely from working on another book
    at the same time – ‘The Brompton’, co-authored with Will Butler-Adams, who demonstrated
    to me that an intelligent engineer and CEO is likely to independently invent a
    lot of the solutions that the cyberneticians came up with with.'
