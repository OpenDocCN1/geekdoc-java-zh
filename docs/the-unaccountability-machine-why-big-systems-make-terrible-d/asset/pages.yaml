    # Structure, strategy and struggle


    Given all this, it might be considered surprising that large companies don’t end
    up in a worse state. But, of course, most companies, quite fortunately, don’t
    make every decision purely on numbers. They have managers, who provide the necessary
    variety and context to mitigate the inevitable distortions in the accounting system.
    Often, a core skill of middle management is the ability to manipulate the financial
    reports to compensate for a set of numbers that aren’t the right answer. Everyone
    who put together a business plan knows that if you can’t fudge the key assumptions
    to justify your boss wants to make, you don’t know enough about the business.


    Of course, this is not in itself unproblematic. In this slightly parodic picture
    of a big decision-making system, we have a compromised set of communication channels
    between black boxes, which is compensated for adding resources in the shape of
    middle managers, who provide the capacity to translate the skewed signals from
    the financial reporting system to more or less accurate and actionable information.


    There are two obvious ways to fail here. The translation and error-correction
    mechanism might be inadequate, or the managers might intentionally distort the
    signals in order to follow priorities of their own. The tragedy of senior management
    is that it can drift into either of these failure modes without realising; if
    either problem arises, it arises in their information and communication environment,
    so they won’t notice it. The problem identified by Niccolò Machiavelli – a prince
    who is not wise cannot be well advised, and a manager who doesn’t have access
    to excess analytical capacity won’t be able to tell when something has gone wrong
    with their subordinates. But maintaining that spare management capacity is expensive.


    Every new idea in management seems to come as a reaction to the previous generation’s
    attempts to find the right way to solve these two problems without taking on too
    much in the way of overhead costs. For the same reason, the management practices
    of previous decades will always'
  merge: -1
  pgno: 142
- img_proc: true
  md: 'seem hilariously stated. The complexity of the environment is always increasing,
    and technological progress means that there will always be new ways of getting
    information from where it is generated to where decisions are taken. Of course
    management theories change – when the foundations of the problem are constantly
    shifting, the answers are bound to change.


    If you translate this problem into the more abstract language of cybernetics,
    it becomes easier to understand. In the business environment, complexity (environmental
    variety) will naturally increase. In any given organisational structure, the variety
    which management systems can bring to bear also increases, but more slowly. At
    some point, the difference in growth rates becomes critical; the organisation
    needs to change its architecture so that variety matches to variety at each level
    of decisionmaking. John Paul Getty of Getty Oil was able to read status updates
    from all of his rigs every morning in the 1930s, but that''s simply not possible
    for a company like ExxonMobil today.


    If you read great books of management with this in mind, you''ll notice a strong
    common theme; the stars of this literature all try to get managers to understand
    that they must create systems that regulate themselves rather than requiring constant
    supervision. What of most''s worth reading in management science is about stopping
    decision-making systems from becoming overwhelmed.


    Alfred D. Chandler, a historian and management scientist, saw this. In Structure
    and Strategy, his book about the development of American companies including DuPont
    and General Motors, realised that as they became more complex, had to develop
    a multidimensional structure. Almost as soon as his book was published, this story
    was itself reaching the limits of its capacity. And this story repeats itself
    through the history of management science; almost every classic of the literature
    seems to have described a way of adapting systems to a more complicated world,
    and then to become obsolete itself. If you look past the slogans and think about
    what ‘management by objectives’, ‘focus on competences’ and so on actually mean,
    they are all different ways of advising executives to restructure their businesses
    so that they don''t generate complexity faster than it can be managed. Meanwhile,
    the management consultancy industry prospered by selling the myth that it might
    be possible to economise on management capacity by renting it you needed rather
    than paying it a salary.'
