  pgno: 17
- img_proc: true
  md: 'disenfranchised for long periods before began. You could see this in the Brexit
    vote in the UK. The turnout for that referendum was shockingly high, compared
    to the previous decade of general elections. The winning vote came from people
    who had not voted for a long time.


    But why would they bothered voting? Thinking about the period from the fall of
    the Berlin Wall in 1989 to the bankruptcy of Lehman Brothers in 2008. There had
    been hardly any choices to make. If you wanted to vote against globalisation,
    you couldn''t. Wanted to vote for higher rates of income tax or tighter bank regulation?
    Couldn''t. Or the level of interest rates – it wasn''t even possible to have a
    political opinion about it. You might be able to vote against further privatisation,
    but there was no political centrist technocrats, competing more competently, in
    an economic context of growing prosperity. People lost interest because it was
    rational for them to lose interest – nothing needed to change and there was no
    way to change it. If you were against immigration, you had no party to vote either.
    All you had were choices between moderate centrist technocrats


    The 2008 financial crisis happened, followed by a long period of recession and
    austerity, and suddenly turned out that the technocratic consensus wasn''t competent
    or moderate as it had appeared. Ten to twenty per cent of the electorate suddenly
    realised that they might have to take an interest in politics after all. So they
    started paying attention again, and they didn''t have the basic assumptions of
    the mainstream. All they knew was that the people who used to be in charge seemed
    to have screwed things up mighty.


    # The accountability sinks


    Bad things were happening, but they didn''t seem to be anybody''s fault. This
    was infuriating to everyone; political leaders and other figureheads had been
    drawing big salaries and bonuses, and telling all of us they knew best, but it
    turned out that they didn''t even know what was going on in their own organisations.
    There was no mechanism to punish individual human beings, so the hoi pollo defaulted
    to what seemed like the only alternative – to use the democratic powers available
    to them to tear down the whole system.'
  merge: -1
  pgno: 18
- img_proc: true
  md: 'The relationship between experts, decision makers and the general public had
    become completely dysfunctional. This wasn’t really a crisis of managerialism
    or a crisis of political legitimacy – it was a crisis of accountability. And if
    accountability was at the root of the crisis, then the things to look at were
    the mechanisms that cause it to be diminished.


    Consider, for example, the following situation. A characteristically modern form
    of social interaction, familiar from the rail and air travel industries, has become
    ubiquitous with the development of the call centre. Someone – an airline gate
    attendant, for example – tells you some bad news; perhaps you''ve been bumped
    from the flight in favour of someone with more frequent flyer points. You start
    to complain and point out how much you paid for your ticket, but you''re brought
    short by the undeniable fact that the gate attendant can''t do anything about
    it. You ask to speak to someone who can do something about it, but you''re told
    that''s not company policy.


    The unsettling thing about this conversation is that you progressively realise
    the human being you are speaking to is only allowed to follow a set of processes
    and rules that pass on decisions at a higher level of the corporate hierarchy.
    It’s often a frustrating experience; you want to get angry, but you can’t blame
    the person you’re talking to. Somehow, the airline has constructed a state of
    affairs where it can speak to you with the anonymous voice of an amorphous corporation,
    but you have to talk back to it as if it were a person like yourself.


    Bad people react to this by getting angry at the gate attendant; good people walk
    away stewing with thwarted rage, and they may give some lacerating feedback online.
    Meanwhile, the managers who made the decision to prioritise Gold Elite members
    are able to maximise shareholder value without any distractions from the consequences
    of their actions. They have constructed an accountability sink to absorb unwanted
    negative emotion.


    # The fundamental law of accountability


    It is important to be clear, at this stage, exactly what an accountability sink
    is, and how they are constructed.* It’s not just the way in which the hourly paid
    worker has been set up to act as a human shield. In order to make the'
  merge: -1
  pgno: 19
- img_proc: true
  md: 'sink effective, you need a combination of things: that person, plus a policy
    that there’s no way to appeal the decision by communicating with a higher level
    of management. (Even if you somehow managed to get the CEO’s phone number, you
    would come up against the fact that the policy was in place precisely to protect
    them from making that decision personally.)


    So the crucial thing at work here seems to be the delegation of the decision to
    a rule book, removing the human from the process and thereby severing the connection
    that’s needed in order for the concept of accountability to make sense. You could
    even coin a sort of law of management here:


    The fundamental law of accountability: the extent to which you are able to change
    a decision is precisely the extent to which you can be accountable for it, and
    vice versa.


    The construction of accountability sinks damaging implications for the flow of
    information. For an accountability sink to function, it has to break a link; it
    has to prevent the feedback of the person affected by the decision from affecting
    the operation of the system. The decision has to be fully determined by the policy,
    which means that it cannot be altered by any information that wasn’t anticipated.
    If somebody can override the accountability sink and一来 a policy that is in danger
    of generating a ridiculous or disgusting outcome, then person is potentially accountable
    for the outcome.


    When an organisation decides to create an accountability sink, it’s taking a risk.
    Implicitly, every rule is a model of the world – you can see both a model and
    a rule book as a relationship between causes and effects, inputs and outputs.
    But because they can’t be a model of the whole world, both a rule book and a model
    have to leave out a lot of detail. That means, like a model, a rule has to be
    based on assumptions about the kinds of situations that might need to have decisions
    made about them. So a notice on the wall of an office that says ‘STAFF HAVE NO
    ACCESS TO THE SAFE’ implies a set of assumptions about the kind of person who
    might walk into the street and ask staff to open the safe, while a notice that
    says ‘NO REFUNDS – NO EXCEPTIONS carries an implicit assumption that there will
    never be a case where a customer is entitled to a refund.'
