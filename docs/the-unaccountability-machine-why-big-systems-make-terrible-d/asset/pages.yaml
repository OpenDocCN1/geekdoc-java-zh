  md: 'prepared ideology when it was getting ready for the leveraged buyout boom to
    take off.


    Mirowski''s More Heat than Light (Cambridge University Press, 2011) and Machine
    Dreams (Cambridge University Press, 2002), along with E. Roy Weintraub''s How
    Economics Became a Mathematical Science (Duke University Press, 2002), give more
    background on the development of ''mainstream'' economics than it was possible
    to cram into Chapter 6. Among many works detailing the state of management science,
    I''d recommend Management Studies in Crisis: Fraud, Deception and Meaningless
    Research by Dennis Tousish (Cambridge University Press, 2019) and Not Succeeds
    Like Failure: The Sad History of American Business Schools by Steven Cohn (Cornell
    University Press, 2019). It is a bit of an inconvenient things that H. Thomas
    Johnson and Robert S. Kaplan''s Relevance Lost: The Rise and Fall of Management
    Accounting (Harvard Business School, 1987) is still every bit as relevant today
    as it was published.


    There is no shortage, to say, of books deailing the foiles of the management consulting
    industry — The Management Myth by Matthew Stewart (W. W. Norton, 2009) has the
    advantage of having been written by someone who worked in the industry and was
    prepared to tell. The Big Con by Maria Mazzucato and Rosie Sutton (Allen Lane,
    2023) came just after I had finished writing about the decoration of the public
    sector and covers that topic thoroughly and exciting.


    You really would need an academic library to find ''Reasoned Argument and Social
    Change'' (National Communication Association, 2011), but if you happen to be in
    one, it is worth looking up to Frans H. Eemeren, Bart Gassen and Jean H. M. Wagermans''
    masterful analysis of the KLM squirrel apology release. Flying Blind: The 737
    MAX Tragedy and the Fall of Boeing by Peter Robinson (Penguin Business, 2021)
    is also an enthralling history of a massive accountability sink. I learned a huge
    amount from Gill Kermick''s Catastrophe and Systemic Change: Learning From Grenfell
    (London Publishing Partnership, 2021) about another case study in which interlocking
    systems combined to create a tragedy that couldn''t systematically be pinned on
    any single organisation, let alone an individual.


    Brian Alexander''s Glass House: The 1% Economy and the Shattering of the All-American
    Town (St Martin''s Press, 2017) is the best of the ''private'
  merge: -1
