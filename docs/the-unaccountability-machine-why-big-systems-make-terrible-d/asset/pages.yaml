    Often, when you’re trying to diagnose why a system is failing, you need to consider
    both the larger system in which it’s embedded and its operations. A great source
    of management problems, for example, is that organisations fail to identify some
    of their operations as distinct systems, and so they lack their own ‘higher functions’.
    A division of this sort will generally be a ‘problem child’; unable to absorb
    its own environmental variability, it will bounce from crisis to crisis, taking
    up disproportionate time and effort on the part of the middle managers to which
    it has been assigned.


