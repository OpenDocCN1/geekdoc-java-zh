  md: '# INTERMISSION


    # Decerebrate Cats


    Stafford Beer had a few favourite startling metaphors that he''d drop into lectures
    or book chapters to wake you up. In order to make a particular point about the
    importance of systems 4 and 5, he''d occasionally compare an organisation to one
    of the animal victims of early neurological experiments.


    If you cut the connection between a cat''s cerebellum and the rest of its brain,
    it still looks alive. It can walk, right itself when it falls over, and eat and
    drink when food and water are placed in front of it. It might even be to groom
    and clean itself, but it is no longer capable of purposive action. The decerebrate
    cat will survive as long as its environment is compatible with this, but it can''t
    generate its own responses to change – it needs to be sheltered from the everyday
    world, using other resources. Beer made the point that like the cat, you will
    often see a ‘decerebrate organisation’. (His typical example was a university.)


    An organisation in this situation is one that has, for reason or another, stopped
    paying attention to some kinds of information. It''s only aware of its immediate
    surroundings – this quarter''s revenue, the current staffing level, things like
