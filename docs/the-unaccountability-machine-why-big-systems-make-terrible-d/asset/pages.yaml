  md: '# INTERMISSION


    # Meanwhile, in Chile


    The short-lived government of Salvador Allende, and the Pinochet coup which ended
    it, were both parts of a huge event in history. It was a pivotal moment in cybernetics,
    and one of the defining episodes of Stafford Beer’s life, but in the grand scheme
    – the Cold War, Latin America and the trauma inflicted on the people of Chile
    – the cybernetic project was a footnote and so was Beer. I''m not a historian,
    I''m not Chilean, and I''m a fundamentally quite whimsical person. It''s not really
    for me to write the story of Pinochet and Allende.


    All I''ll say is that, from a cybernetic point of view, violence is a horribly
    effective variety amplifier. A single guard on a watchtower can''t do much; give
    them a gun and they can control an entire prison. If you have a system of gulags,
    you don''t need to meet the arguments of your opponents one by one. A state which
    is not supported by a public consensus about its legitimacy, and which is consequently
    overloaded by its political environment, is highly likely to use atrocity as the
    only means available to maintain its stability.


    The story of Stafford Beer in Chile, though, is worth understanding because it
    shaped the world’s understanding of cybernetics and the reception of his theories,
    and it''s generally quite badly understood.* The great misconception about the
    Chilean experiment is that it was an attempt to apply computer technology to the
    task of organising a command economy. This is a handy myth for those who want
    to use it as an example for whatever argument they''re trying to make. Neoliberals
    and apologists for Pinochet and Friedman can pretend that it was a quixotic project
    with no more hope of working than the Soviet system; socialists and other apologists
    can pretend that it nearly worked. Neither is the case, and by now it ought to
    be obvious why – management cybernetics demonstrates quite'
  merge: -1
  pgno: 149
- img_proc: true
  md: 'clearly why a centrally planned economy doesn''t respect the law of requisite
    variety and can''t get the information it needs to function.


    Instead, Beer helped to set up what amounted to a massive system of ‘management
    by exceptions’. The overall project was called Cyyn (cybernetics and synergy),
    and it was meant to help the government manage their newly acquired nationalised
    industries, without depending on their previous owners. It had three main components
    – Cybernet, Cyberstride and the Operations Room.


    The Operations Room was an ergonomically designed command centre; pictures of
    it look very much like the bridge of the USS Enterprise in Star Trek, apart the
    asht and drinks holders. It was meant to be occupied by about a dozen managers,
    who were able to call up data and charts on the big display screens that covered
    the walls.† On the basis of highly focused discussion and debate, they would send
    instructions to the management of the factories.


    But they would not debate every single production for for every business in the
    Cysyn network, of course. Selecting the subjects for the Operations Room to think
    about was the purpose of Cyberstride. This was a piece of computer software, which
    took in data and used statistical analysis to see whether it was in the normal
    range of variability. It could predict whether any departures represented a temporary
    blip, a change in trend or a new level of normality, and escalate them accordingly.
    Effectively, it provided an automated and expanded version of the same function
    as the trellis of hand-drawn charts which first built Beer’s reputation in the
    steelworks – it identified potential areas of concern.


    The input to Cyberstride came via Cybernet, which was a network of hundreds of
    tex machines. These had been fortuitously discovered lying idle in a government
    building, but they were perfect for the task of transmitting production data –
    much more reliable than reading numbers over the phone, and generating an automatic
    record of the past. It turned out that this communication network was the practically
    useful part of the system; during a striking, it allowed the government to monitor
    deliveries and ensure essential supplies.


    If you look at Cybersyn along the lines of the viable system model, you can see
    that the control room is playing the role of System 3 (negotiating and renegotiating
    the bargains with the operations), with Cybernet having some System 2 roles in
    preventing clashes and coordinating resources.'
