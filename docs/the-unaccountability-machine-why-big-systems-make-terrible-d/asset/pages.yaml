  md: 'The damage caused by assumptions about time and uncertainty is more subtle.
    Homo economicus and the profit-maximising firm are the economists'' equivalents
    of the cyberneticians'' black box: the fundamental components of the model and
    the system. They''re constrained to have only specific categories of inputs (price
    and quantity), which relate to the output in a specific way (optimisation). Considered
    as a cybernetic system, an economic model is one that has arbitrarily thrown away
    most of its information.


    When economists design systems, their weakened concept of a black box shows up
    in the lack of concern with the capacity of communication channels to carry the
    required information. Equally importantly, the problem of translating information
    into actionable format hardly exists; when the information set is reduced to price
    and quantity, and decision-making is just optimisation of a single value expressed
    in money terms, there''s no way to talk about ambiguity, perception or incompatible
    values. This is how cost–benefit analysis goes wrong; a statement ''this passenger
    aircraft has a faulty sensor which might cause it to ''crash'' fundamentally isn''t
    a piece of information about expected costs – even if you get people happy with
    the idea of assigning a financial value to human life.


    And finally, there''s Ricardianism. The Ricardian Vice, you''ll recall, refers
    to the practice of solving things in the model before applying the solution to
    the real world. This was the reason central banks missed a generational financial
    crisis. It didn''t exist in their model, and the Ricardian Vice, in Stafford Beer''s
    terms, translates to a weak System 4, which is meant to pick up information that
    could change the operating environment in such a way as to render the current
    model insufficiently realistic.


    Ricardian Vice also tends to dull the response to re-handle signals and screams
    of pain; these don''t exist in the model, so it''s hard to get people who believe
    in to recognise that might exist in real life. Getting an economist to change
    their mind is difficult; the profession has a justified reputation for insularity
