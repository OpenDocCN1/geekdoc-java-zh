    # What are accounts?


    People collect numbers they want to measure something. In the early days of manufacturing,
    numbers were collected by people who understood what they were measuring, and
    wanted to know how well it was being done. Railway operators wanted to calculate
    the cost per ton-mile, mill-owners wanted to know the cost per yard of a particular
    grade of fabric. This was the first purpose of accounts: the control and optimisation
    of a process. If you measure your inputs and your outputs, you''ll know how efficiently
    you are transforming one into another. Over time, you can change things and see
    what effect they have.


    Numbers like this are most useful when the physical efficiency of the process
    for turning inputs into outputs is the most important thing to be measured, rather
    than the return on capital or the margin on sales. If, example, you''re a single-product
    company that sells its output to wholesalers at an easily observable competitive
    market price, and you''re in a condition of constantly growing demand, so any
    investment will be paid back from ever-increasing revenues, then you can usually
    concentrate on physical efficiency and let the cash look after itself. The manufacturing
    and railroad companies of the USA in the late nineteenth and early twentieth centuries
    were in this position.


    As time went on, though, companies got more complicated and investments started
    to make long-term wage contracts, to make multiple products and to take control
