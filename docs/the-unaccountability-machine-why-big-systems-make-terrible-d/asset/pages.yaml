  md: '# Management, and exceptions


    We haven''t talked much about variety engineering, so let''s look at how it takes
    place at this level of the organisation. The System 1 operations have to interact
    with the outside world, which means that they deal with a load of ‘variety’ every
    day; their information-handling capability has to, by the means we discussed in
    the last chapter, matched to the range of possible things they might have to deal
    with. As well as the logistical problems of production, System 1 has to deal with
    customers, who often do things that don''t fit with the priorities of the organisation.
    The various operations also interact, so are sources of variety for each other
    too.


    What happens to this variety? Most of it is matched by the intrinsic capability
    of the people and things in System 1; the variety of the raw materials is matched
    to the variety of the machinists who work with them, the variety of the customer
    behaviour is matched to that of the sales force, and so on. System 2 exists to
    absorb the variety of the interactions between operations, to the extent that
    this variety is predictable, constant and susceptible to the design of self-regulating
    systems (you might think here of a school timetable, which ensures that different
    teachers don''t try to use the same classroom). What''s left is the residual variety,
    the things which aren''t just-today decisions. System 3 has to be big enough to
    deal with this variety.


    It''s a concept that''s recognisable to anyone who has hung around consultants
    or business school academics as ‘management by exception’. That''s the relatively
    commonsensical principle that as much as possible, people ought to be given tasks
    to do and left to achieve them. An ‘exception’, in the jargon, is an ‘exception
    to the rule’ – something the business unit comes across that can''t deal with
    and so ‘escalates’ to the level above. In a company or organisation run on these
    principles, the job of management consists mainly in dealing with these sorts
    of unusual cases, and then occasionally revising the objectives handed down to
    the level below.


    If you believe Stafford Beer, there''s a pretty strong result here in terms of
    battles between competing management philosophies. Management by exception is
    not just common sense; it''s the right thing to do, objectively. The alternatives
    don''t add up and don''t respect Ashby''s law of requisite variety. So they fail
