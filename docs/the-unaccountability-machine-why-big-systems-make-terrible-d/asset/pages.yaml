    # A meeting in Cwarl Isaf


    The year is 1975. Brian Eno is up to his ankles in mud, being enthusiastically
    greeted by two large dogs. He has come to an isolated cottage in Wales to meet
    Stafford Beer for the second time. They talk for hours about algorithms, self-organising
    music and the future of democratic society, until Eno practically collapses from
    hunger. When Beer tells Eno that he wants to pass on the torch of cybernetics,
    the musician replies, ‘I''m very flattered that you think that, but I don''t see
    how I can accept it without giving up the work that I do now – and I''d have to
    think very hard about that.


    It might sound like a scene from a psychedelic movie, but this conversation actually
    happened. And although booze had clearly been consumed, Beer’s offer appears to
    have been made seriously. The first meeting had earlier that year in London, after
    Eno had sent an essay written on ‘Generating and Organising Variety in the Arts’,
    an adaptation of cybernetic principles to musical performance. Beer’s life had
    not settled down after his time in Chile. He was recently divorced and working
    on the expanded second edition of Brain of the Firm, which included his assessment
    of the Allende experience, on the other hand, had been interested in generative
    art and cybernetic themes since art school.'
