- img_proc: true
  md: 'Electricity is a commodity – you can’t sell higher-quality branded electrons
    – so you can be confident that a demand curve will have the right slope. As the
    price rises, people will substitute other energy sources, and reduce their total
    consumption, and the demand for electricity will fall. But what about supply?


    In this industry, economists can be sure that their cost curve is right – their
    concept of the ‘marginal cost curve’ is the same as one that was independently
    invented by electrical engineers. The marginal cost is the cost of producing one
    more unit of output – no overheads, no fixed costs, only the direct cost of producing
    that specific increment. So if you’re running an electric power grid with a number
    of different stations, it’s the cost of producing an additional kilowatt at your
    cheapest generator.


    As you produce more electricity, the efficiency of that station might get worse,
    until it’s cheaper to generate the next kilowatt increment with a different fuel
    source. At any level of output, there will be a known value for the cost of producing
    the next increment; an engineer might call this ‘load balancing table’, but the
    concept is the same as the economic one.


    And in this industry, the marginal cost curve determines the supply curve. If
    the cost of producing another unit is more than the price you can sell it for,
    then you’ll lose money. If the cost of producing another unit is less than the
    price, then so – otherwise you’re leaving money on the table. The amount that
    you supply at any given price is determined by the point on the marginal cost
    curve where the cost of the marginal kilowatt hour is equal to the revenue from
    selling it – and so the supply curve for electricity generation ought to look
    like a slightly bumpy of the one in the textbooks.


    But can you say the same things about markets in general? Can you even say it
