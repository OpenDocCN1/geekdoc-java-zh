  md: 'In fact, understanding that identity, philosophy and purpose are tools of information
    management is the key to understanding the most famous slogan of management cybernetics,
    ‘POSIWID’ – or the purpose of a system is what it does’. The identity-creating
    function is intrinsically linked to the variety-balancing function. In working
    to balance the immediate needs of the system with its response to a changing environment,
    System 5 is making the decisions that determine ‘what it does’ and, consequently,
    its purpose. POSIWID is not just a glib piece of cynicism; it’s a description
    of how a system retains viability and identity. It’s also, we’ll see later, the
    key to understanding the polycrisis of the last two decades – the failures we
    see in the operations and management of our society have their roots in specific
    questions of philosophy and ideology.


    # The true nature of management information


    The ability to translate information into action is the last piece of the puzzle,
    but it might have been the first piece because it’s crucial. So far, we’ve talked
    about the links between a system’s parts in terms of the ability of one to absorb
    the variety of the other, but we need some link between this kind of information-centric
    view of an organisation and what it actually does.


    Stafford Beer takes an approach to this problem that helps mark the distinction
    between information theory and cybernetics. That solution is to say that information
    and action are one and the same; variety coming in from the environment, or being
    transferred from one system to another, only counts as ‘information’ if it has
    a causal role in decision-making. Otherwise it’s just ‘data’ – collections of
    facts that hang around on disk drives, waiting to be erased± or for the form to
    become obsolete.


    Stafford Beer’s decision-centric definition has significant practical consequences;
    his model requires additional axioms beyond the general one that the informational
    balance sheet has to match up. For a piece of data to have the capacity to affect
    decisions, it has to arrive in time and in the right form.


    Every channel of communication between systems not only needs to have enough bandwidth
    to carry the variety that it’s meant to transmit, it also needs to be equipped
    with enough translation capacity at each end to ensure that the signal is understood.
    As we’ve noted, the signals have to be'
