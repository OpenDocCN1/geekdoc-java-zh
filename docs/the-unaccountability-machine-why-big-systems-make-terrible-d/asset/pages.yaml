    One consequence of focusing on quarterly numbers and short-term delivery is that
    costs become more important than revenues. To increase revenue, an industrial
    company like GE would have to find a customer, make the order, make the product
    and get paid – hard to do in twelve months, let alone. An employee can be fired
    more quickly than that; a business can be shut down or sold. The management have
