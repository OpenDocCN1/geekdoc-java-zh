    were quick to discover principles of variety engineering that could indicate whether
    a system was going to fall apart. The first trick is to start giving names to
    different types of black boxes, and to the connections between them. Let''s consider
    a tiny, simplified example first – how would we treat, in black box form, a simple
    system consisting of a cage with a squirrel in it?


    # The squirrel survival facility


    For some purposes, we might want to treat the cage and the squirrel as separate
    black boxes, but we could also say that this is one black box, with a set of outputs
    consisting of measurements relating to the squirrel (its weight, body temperature,
    heart rate) and to the cage (the ambient temperature, light or dark, and so on).
    We can then define a set of ranges for the output variables corresponding to ‘this
    squirrel is capable of surviving’. This might be a simple list of acceptable ranges
    of values for each measurement, or it might be complicated if some of the variables
    interact – for example, if the squirrel needs it to be light of the time and dark
    some of the time. If we leave the system on its own, the measurements will mainly
    depend on random disturbances, one or other of the output variables will soon
    drift from the survival set (meaning that the squirrel will die). Our model of
    the overall system will thus need another black box – the ‘regulator’ – representing
    actions taken to keep the squirrel alive.


    The regulatory system might consist of many components or just one – cybernetically,
    it''s just a black box with the output of the squirrel system among its inputs,
    and the inputs of the cage system among outputs. As long as we are only thinking
