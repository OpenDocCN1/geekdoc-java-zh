    learning'') are not black boxes as Stafford Beer and Ross Ashby understood them.
    Instead, they''re statistical models with a structure that''s comprehensible to
    anyone who understands the maths: complicated but not complex in the relevant
    sense. If you''re looking into the guts of one to find out how it works, you might
    end up drawing a lot of ungainly spaghetti diagrams, but you have a few big advantages.


    First, you know what data it''s taking in – unlike a human or a corporation, it''s
    not going to suddenly develop new interests or draw on new sources of information.
    You can have access to its complete information environment, if you are on sufficiently
