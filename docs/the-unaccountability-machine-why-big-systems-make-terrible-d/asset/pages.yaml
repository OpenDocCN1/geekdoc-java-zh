    The trick was a classic mathematician''s move; if you want to solve a problem,
    first come up with a method for solving an entire class of problems, and then
    apply it to the one in front of you. Wiener saw that the necessary leap of abstraction
    was exactly that of Beer''s black boxes; if you define the elements by their behaviour
    rather than their composition, it doesn''t matter whether you''re talking about
    wheels and levers, electronic circuits or biological cells. You concentrate on
    how they act, how they cause changes in other elements of the system and how they
    are changed themselves.


    One kind of interaction in particular was distinctive to the cybernetics approach.
    Its great influence on modern life is the concept of ‘feedback’ – the cyclic and
    recursive use of the output of one black box as the input of another, then back
    again, was the signature of the systems that Wiener studied. It was a mathematical
    engine which produces the interesting kind of complexity – unpredictable, but
    not random. The word has survived, sadly it lost this connotation of a repeated
    and changing process; as used on consumer websites and by human resources departments,
    it really means ‘communication from the decided-upon back to the deciders, of
    a kind which will probably be ignored’. In a recent issue of the Wall Street Journal,
    someone suggested that it should be renamed ‘feedforward’, so that it didn''t
    sound so negative, which is enough to make you weep if you care about that sort
    of thing.


    After his initial contact with Wiener, Beer’s personal network grew incredibly
    quickly. Within a few years, he was a friend and collaborator with nearly everyone
    who was doing important work in the field. Not only that, but he had carved out
    for himself a position of pre-eminence in the application of the new science to
    industry. This was one case where there was no question that Beer was practising
    without a licence, however; if any person was qualified to describe someone ‘the
    father of management cybernetics’ it was Norbert Wiener, and he talked about Beer
    in those terms. From the mid-1950s, Stafford Beer would have a twin-track career,
    developing his ideas and carrying out theoretical research while applying them
    in business.'
