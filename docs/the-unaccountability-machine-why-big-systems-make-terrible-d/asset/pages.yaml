  md: 'When an unanticipated situation arises – either because something unusual has
    happened, or because the accountability sink was badly designed – there will be
    a mismatch between the input that the system anticipated, and what it transpired.
    And, because the system has been designed to work as an accountability sink, the
    outcome could be gruesome or absurd. Consider, for example, the tale of an airline
    and a few hundred furry mammals.


    # The squirrel shredders of Schipol


    Back in the 1990s, ground squirrels were briefly fashionable pets, but their popularity
    came to an abrupt end after an incident at Schipol Airport on the outskirts of
    Amsterdam. In April 1999, a cargo of 440 of the rodents arrived on a KLM flight
    from Beijing, without the necessary import papers. Because of this, they could
    not be forwarded on to the customer in Athens. But nobody was able to correct
    the error and send them back either. What could be done with them?


    It’s hard to think there wasn’t a better solution than the one that was carried
    out; faced with the paperwork issue, airport staff threw all 440 squirrels into
    an industrial shredder, A few weeks later, it transpired that this shredder was
    a specialised piece of machinery used in the poultry industry to disperse worthless
    male chicks. Before the story hit the headlines, ground staff had over a period
    of months shredded 200 squirrels, several dozen water turtles and a small flock
    of parakeets.


    The release in which KLM apologised for this horrible fiasco was a masterpiece
    of the genre that’re still studied in business schools as an effective measure
    of crisis PR. But it’s less fascinating for its deflection of blame than the underlying
    system it revealed.


    It turned out that the order to destroy the squirrels had come from the Dutch
    government’s Department of Agriculture, Environment Management and Fishing. However,
    KLM’s management, with the benefit of hindsight, said that ‘this order, in this
    form and feasible alternatives,* was unethical’. The employees acted ‘formally
    correctly’ by obeying the order, but KLM acknowledged that they had made an ‘assessment
    mistake’ in doing so. The company’s board expressed ‘sincere regret’ for the way
    things had turned out, and there’s no reason to doubt their sincerity.'
