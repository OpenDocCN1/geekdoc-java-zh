    The underlying idea is somewhat stronger than this: if the black box is a complex
    system, it’s likely to be pointless – or even dangerous – to try to understand
    its inner workings and use that to manipulate a precise outcome. This is a matter
    of respecting the complexity of the problem – a genuinely complex system is one
    in which you cannot hope to get full or perfect information about the internal
    structure, and cannot have any acceptable degree of confidence that the bits of
    information you don''t have safely ignored. Rather than trying to use a mixture
    of partial information, preconceived theory and guesswork, you need to step back,
    accept that the system will keep its secrets, and observe its behaviour.


    And of course, this means that different observers might have different opinions.
    The property of ‘being a black box’ isn’t an objective one – it’s a description
    of a decision by someone working on the system that they don’t have enough understanding
    to treat it in any other way. In some of Beer’s writings, the property of complexity
    itself is also dealt with by rather than counting combinations of connections,
    you define what it is for something to be a complex system by saying that it’s
    one which has to be treated as a black box.*


    In the twenty-first century, with the ideas of chaos theory, big data and opaque
    algorithms widely distributed, this might seem platitudinous, but it’s not. The
    idea that systems can have different properties from the sums of their components,
    with properties that can’t be deduced from those components, is dangerous for
    many institutions. It’s inimical to a particular model of scientific enquiry,
    where understanding is built up from small and simple to big and complicated –
    appropriately, given Beer’s background, it’s more consistent with neurological
    and psychiatric approaches, where medical science still has surprisingly little
    idea of how its effective treatments might function.


    # Homo economicus and his friends


    Beer didn’t immediately realise how new this worldview was, but it turned out
