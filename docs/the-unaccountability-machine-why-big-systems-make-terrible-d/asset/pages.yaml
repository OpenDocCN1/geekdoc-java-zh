  md: 'Once that move has been made, the whole mathematical toolkit of physics is
    available to you; solving economic problems becomes a matter of cleverly defining
    the problem so that it can be described in these terms, and then solving a system
    of equations to find the equilibrium state. The mathematical revolution in economics,
    which was happening alongside the beginning of Beer’s career, was a huge achievement.
    But along the way, a lot of things were lost.


    In particular, the equilibrium defined in this way only describes one side of
    the economy – consumption and exchange of a fixed endowment of goods. It doesn’t
    explain how that particular bunch stuff came into existence, let alone about who
    came to own it. In order to extend the model to talk about production, more assumptions
    needed to be made, and they became less defensible as the research programme progressed;
    they ended up neither particularly realistic as descriptions of the messy real
    of labour, capital and technology.


    And the bad assumptions were committed an inevitable consequence of the methodology;
    economics was committed to atomism because the step that made the physical analogy
    work. And one consequence of that methodological assumption is that the new science
    didn’t have a way to describe big, complicated economic entities in terms of their
    smallest component parts (not even individual people – individual sets of preferences).
    The key move of Stafford Beer’s cybernetics – to take a system, draw a box around
    it and say ‘we don’t know anything about the motivation or internal structure
    of this box, let’s just look at how it reacts to its environment’ wasn’t open
    up to any more.


    Economists ended up solving this problem by denying it (a mechanism that Stafford
    Beer looked at in detail, concluding that ignorance is a kind of information-processing
    system of last resort). Where analysis fails, ideology steps in, and the solution
    the economists decided on was to fantasise an equivalent system for producers
    – a profit-maximising firm with an understanding of its market, a simple production
    process and a manageable set of decisions. It ended up going disastrously wrong,
    but the original intellectual sin may have been the failure to respect the integrity
    of the black box.'
