  md: 'And an orchestra doesn’t just exist when it’s performing. In Rehearsals, the
    conductor plays a role that crosses between operations and management. They’re
    responsible not only for making sure that the musicians know the pieces and are
    capable of playing them, but also for making decisions about interpretation and
    emphasis. That’s the orchestra’s equivalent of the resource bargain; the musicians
    are accountable for delivering the conductor’s vision. If they’re not capable
    of doing that, it’s part of the System 3 function to handle human resources and
    replace them.


    So now we move on to the higher functions. I picked the example of an orchestra
    for this part of the explanation there’s a clear boundary between decisions made
    during its performances (the operations) and other kinds of decision. Conducting
    an orchestra in a piece of music is a particular job, but a lot of other decisions
    needs to be made to provide the context for the performance. As well as the ‘here-and-now’
    functions which ensure that the music is played, the orchestra needs to be able
    to make higher-level choices – picking the repertoire and deciding where and when
    the performances will happen. The conductor might be involved in this, or there
    might be an artistic director or a tour manager – the point is that function needs
    to exist.


    This is System 4 of the model, often described as the intelligence function. Its
    defining characteristic is while System 3 manages things ‘here-and-now’, System
    4 is responsible for ‘there-and-then’. It is meant to be dealing with information
    from those parts of the environment that aren’t in direct contact with System
    1, and which are capable of generating shocks that can’t be handled by the ‘management’
    system. The usual reason why this part of the environment isn’t detected by the
    operations is that it doesn’t exist yet; the key job of System 4 is to make sure
    that the resource bargains System 3 strikes with the operations will remain feasible
    following anticipated future structural changes.


    It’s also important to note again that these systems don’t necessarily match up
    to organisation charts, and that individuals appear in different roles in different
    functions and contexts. For example, when on stage, the piano player is part of
    System 1 operations, and will follow the conductor’s instructions. If, however,
    the orchestra is accompanying Elton John, the piano player will also be involved
    in higher levels of management and decision-making – because the piano player
    is Elton John!'
