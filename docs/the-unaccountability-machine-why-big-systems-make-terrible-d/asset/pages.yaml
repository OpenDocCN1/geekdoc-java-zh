    Friedman''s original 1970 essay, his doctrine in corporate management was part
    of a general political project. It was easy to apply the same concepts of efficiency
    and the removal of dead-wood bureaucracy to state organisations. Governments were
    also subject to the same cognitive pressures of a world that was becoming more
    complicated, so they also needed solutions to attenuate information.


    But the public sector lacks any direct equivalents of the debt relationship and
    the leveraged buyout. Countries can borrow money, and they can default on their
