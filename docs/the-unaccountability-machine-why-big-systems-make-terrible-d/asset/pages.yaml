  md: 'The set of manoeuvres pilots used was an even smaller subset of the theoretically
    possible stunts. Flying an air raid was itself a hugely stressful task, leaving
    only a small amount of mental bandwidth for evading ground fire. So, pilots tended
    to make spur-of-the-moment choices from a small number of techniques; in principle,
    a manoeuvre might be identified from its earliest stages and the rest of the trajectory
    predicted. All that remained the task of fitting a mathematical curve to the trajectory
    and transferring this information to the servomotors of the gun turret.


    This turned into a problem of feedback; the gunsight moved, which meant that its
    input changed, which meant it moved again. Quickly, Wiener found that the system
    had a tendency to develop two kinds of problems. Either the feedback was too weak,
    leaving the gun trailing behind its target, or it was too strong, the gun oscillated
    around the target, overcorrecting its errors in one direction and then the other.


    A friend who was a medical doctor encouraged Wiener to interpret these problems
    as equivalent to two symptoms of injury to the cerebellum – ataxia, and the ‘purpose
    tremor’. This, was the argument at which the projects of control engineering,
    feedback and communication theory became distinctly ‘cybernetics’. The idea had
    been born that a common quantity was preserved between the radar, the computing
    machine, the servomotors and the human genius.


