  md: '# The guys you love to hate


    Management consultancy is not a popular industry. Even in companies that spend
    a lot of money on its services, the typical view is cynical –people say it means
    borrowing the client''s watch to tell them the time, for example. But when you
    think about the services management consultants provide, you quickly realise that
    being the butt of that sort of joke is intrinsic to the nature of the work.


    In the simplest sense, it''s intrinsic because management consultants often act
    as accountability sinks. It''s not uncommon to be in a situation where the management
    of a company need to do something, but know that if they do, they will damage
    their relationship with the employees so badly that they won''t be able to manage
    any more. In that situation, you need a professional scapegoat – you could hire
    an out-of-work actor to read the solution from cue cards, but management consultants
    are better at pitching for the business.


    Even if they''re not acting as scapegoats, though, management consultants will
    often work by telling a company something its employees already know. Stereotypically,
    a consulting assignment goes through stages of signing the contract, talking to
    the employees and middle managers, finding the person who knows how to solve the
    problem, packaging their solution and selling it to top management. In one sense,
    the consultant isn''t contributing anything new. But in that case, why wasn''t
    the solution already being implemented?


    We can see, having considered cybernetics, that there was clearly a feedback loop
    that wasn''t working – either the communication channel wasn''t, or it didn''t
    have the translation capacity, or there wasn''t a working intelligence system
    at the other end. All these things are management problems! So if a consultant
    carries out the assignment as described, they have solved the management problem
    and done what they were paid for. In this sort of situation, criticizing the consultant
    for selling the company''s owns back to them is like complaining to your hairdresser
    that they''ve cut away something that was yours.


    When things go wrong with management consultancy, it''s more likely to be because
    the consultants are tackling a new problem and there isn''t anyone in the company
    who knows the answer. The consultants get commissioned because they advertise
    themselves as brains for hire;'
