    # The variety club of Great Britain


    Let’s recap. The way that you deal with massively complex systems, according to
    the cyberneticians, is to split them into black boxes with a manageable set of
    inputs and outputs. the combinations of these inputs and outputs will be unmanageable,
    but that might not matter; although a Rubik’s Cube has 43 quadrillion possible
    states, you can regard it as having six faces that coloured squares to one another
    in predictable ways when turned, and solve it like that. The important point is
    to get the description right in terms of black boxes, and to try to understand
    the relations between them.


    That’s the art and science of cybernetics. The art is in describing the system
    – that’s where the metaphors and analogies come in, where you have to decide whether
    the national wheat production system is more like a brain or a stopwatch. But
    once you have decided upon a set of black boxes, things become more scientific.
    Everything is driven by Ashby’s law of variety: a given system has the potential
    to achieve stability only if every source of variability from the environment
    is matched by an equal or greater source of variety in the regulatory system.


    This concept of ‘matching’ is key when you move from toy systems to real ones
    – it’s obviously ridiculous to try to calculate how many bits of information an
    individual adult might be taking in any given moment, but we all know what someone
    looks like they’re overloaded. In many contexts, it’s easier to check whether
    the variety of the system is greater or less than that of its inputs to conceptualise
    what the actual number of bits might be.


    This is the first and most important principle of management cybernetics. Stafford
    Beer referred to what he did as ‘variety engineering’. By this, he meant the process
    of checking that the law of requisite variety was being respected at all points
    in the system where one thing was meant to regulate something else. If a manager
    or management team doesn’t have information-handling capacity at least as great
