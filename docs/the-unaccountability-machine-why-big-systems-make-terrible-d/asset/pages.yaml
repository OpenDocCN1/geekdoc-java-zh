  md: 'voltages at random until a set of four compass needles was held in floating
    equilibrium.


    Stafford Beer even devised a machine that would teach children to solve simultaneous
    equations by turning on a green or red light and assisting with their trial and
    error. It was a quest for what Beer called ‘fabric’: something which had the properties
    of a computer, but which didn’t depend on someone writing down an algorithm ahead
    of time.


    The dream of AI research is still of the prospect of ‘getting out more than you
    put in’. In fact, ‘explainability’, for all that it’s seen as an important goal,
    is practically a contradiction in terms applied to a system that you also want
    to see as intelligent.


    A computer might be able to multiply two seven-figure numbers and find the cube
    of their product, but this isn’t really something surprising; you know that it’s
    just iterated very simple arithmetic operations.


    Even when the computer is finding patterns in data that all human analysts have
    previously missed, much of the time it’s doing so by applying a method which could
    in principle have been carried out with pencil and paper if there were unlimited
    time and resources available to do so.


    In other words, there’s no real magic to an ‘artificial intelligence’ if it is
    explainable in this sense. The process of explanation is intrinsically demystifying
    – it’s the means by which you explain how the conjurer the rabbit into the hat
    and then pulled it out.


    The possibility of something like real magic is a huge part of the attraction
    of AI. The dream has always been to create a machine that can come up with original
    thoughts, ideas that its creators couldn’t predict and can’t explain. If you have
    a system that doesn’t look like something with a comprehensible logical structure,
    and it starts producing logical decisions and answers, there’s much more of a
    sense of wonder than you get from a calculating machine that produces calculations.


    That’s clearly the case when you’re talking about a pond that can solve differential
    equations or a dish of ferrous sulphate learning to identify frequencies.


    But even with digital computers, there are algorithms and ways of thinking about
    programming which make it much more difficult to see where the rabbit went into
    the hat than others. They are usually not the most efficient or the quickest ways
    to get problems solved, but because of'
