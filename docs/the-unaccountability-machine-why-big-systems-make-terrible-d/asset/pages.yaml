  md: 'The decision to treat something as a black box is often not politically neutral.


    # The Algorithm and the system


    Because of the need to cancel exams in 2020 as a result of the Covid-19 pandemic,
    education ministries around the world required an alternative way of awarding
    grades to high-school students. The way in which the Department for Education
    in Westminster went about this provided weeks of conversation for the English
    middle class. ''The Algorithm'', as it became known, is a failure of automated
    decision-making that is likely to end up in future computing textbooks. It combined
    serious conceptual mistakes with an underlying model that couldn''t possibly perform
    the task, in the service of an overall goal that didn''t make sense.


    Arguably the fundamental problem with the exercise was the decision to start it
    at all. The English system at the time was dependent on examinations – for most
    subjects, teacher assessment or coursework played a minimal role. If your grading
    system is based on exams but you can''t have them, it might have made sense to
    consider at an earlier stage that grades might not be possible – but they were
    important inputs for another part of the system.


    Exam grades were used to allocate undergraduates to courses, and their tuition
    fees were essential to the universities. So there needed to follow roughly the
    same distribution as in previous years, so universities could be reasonably confident
    that the number of students they were asked to take wouldn''t be too far away
    from their planning assumptions.


    This wasn''t the only reason why the staff of the Department for Education were
    keen to ensure that the overall distribution was unchanged. The Algorithm was
    a classic example of a decision nobody made in a similar way that the 3 per fiscal
    deficit emerged from a meeting in the civil servant Guy Abeille''s office to become
    the economic law of Euroland. The department asked research staff to come up with
    something. But they didn''t make it clear that whatever they came with would directly
    determine the final outcome, rather than being one input into an overall process
    that would trade off different priorities against each


    other.'
