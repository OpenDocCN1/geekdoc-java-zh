    # The wizzes behind the curtain


    The financial crisis of the late 2000s is the sort of event that people who feel
    the need for clean breaks are bound to be attracted; if you want to identify a
    point where the neoliberal era came to an end, that seems like a good place to
    draw the line. Not everyone put it quite as painfully as the Irish economist Colm
    McCarthy, but his reminiscence a few years later captured a general shift in sentiment.
    As he said, ‘Everyone in Ireland had the idea that somewhere . . . there was a
    little wise old man who was in charge of the money . . . They saw him and said,
    “Who the fuck was that? But the fucking guy is in charge of the money?” That’s
    when everyone panicked.’


    That may describe the panic, but it’s also the story of the preceding two decades.
    People were horrified to see that the chief executive of the Irish Financial Regulator
    was a normal little man with a moustache and a desperately unassuming manner in
    television interviews, just as Dorothy was surprised to draw back the curtain
    and discover the Great Oz. But it wouldn''t have been shocking to discover that
    central bankers were normal civil servants if they hadn''t been treated as wizards
