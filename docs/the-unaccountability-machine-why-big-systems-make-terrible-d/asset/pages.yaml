  md: '# Introduction


    What counts as a crisis is the expectation of loss of control; in other words,
    cybernetic breakdown in an institution.

    Stafford Beer, *Brain of the Firm* (2nd edn), 1981


    When we avoid making a decision, what happens to it?

    This is a book about the industrialisation of decision-making – the methods by
    which, over the last century, the developed world has arranged its society and
    economy so that important institutions are run by processes and systems, operating
    on standardised sets of information, rather than by individual human beings reacting
    to individual circumstances. This has led to a fundamental change in the relationship
    between decision makers and those affected by their decisions, the vast population
    of what might be called ‘the decided-upon’. That relationship used to be what
    we called ‘accountability’, and this book is about the ways in which accountability
    has atrophied. In 1954, for example, Sir Thomas Dugdale resigned from the British
    cabinet over something thereafter as ‘the Crichel Down affair’ (a relatively trivial
    piece of malpractice relating to some farmland which had been requisitioned during
    the Second World War). It was unclear whether he had actually been involved in
    the decision, but in the climate of the day his position was untenable – as the
    minister in charge, bore responsibility for what happened. This small but honourable
    act ensured that Dugdale’s name will live on eternally; both he and the small
    area of Dorset which brought about his downfall are mentioned every time a modern
    British politician dodges the blame.

    On the other side of the Atlantic, in 1953, President Harry S Truman had a sign
    on his desk reading ‘The Buck Stops Here’. Sixty-six years later, President Donald
    Trump must that ‘the buck stops with everybody’ when asked who bore responsibility
    for a government shutdown. Anyone who has dealt with a corporation or bureaucracy
    of any size, and who is over the age'
  merge: -1
  pgno: 10
- img_proc: true
  md: 'of forty, is likely to have a vague sense that you used to be able to speak
    to a person and gets things done; the world wasn’t always a maze of options menus.


    Industrial societies have been given a great deal of warning that something like
    this was going to happen. In the 1940s, the ‘managerial revolution’ was regarded
    as the likely outcome of the increasing complexity of the economic system and
    the scale of private and public-sector organisations which had developed to deal
    with. The decline in individual accountability for unpopular decisions is not
    – or not only – a form of moral decline on the part of our rulers. It’s also a
    consequence of the fact that there are fewer decision makers than used to be.
    Nearly all the commands and constraints which affect the modern individual, the
    decisions which used to be made by identifiable rulers and bosses, are now the
    result of systems and processes.


    It is most obvious something that has changed when a decision used to be made
    by a human being by a literal algorithm – a computer program. For example, people
    worry a great deal about, and legislators attempt to regulate, the practice of
    using artificial intelligence to decide whether you are turned down for a loan
    or insurance coverage. A decision-making system is not just a computer. Financial
    and other decisions have been made on the basis of handbooks and lists of criteria
    since the days they were recorded with quill pens. The very parliamentary committees
    that attempt to regulate artificial intelligence are themselves bound by opaque
    and complicated rule books, designed to standardise their proceedings and to avoid
    having decisions attributed to any individual being.


    For a while, in the early days of profound social change, people tried to understand
    what was going on. The study of decision-making systems was a big thing – they
    called it ‘cybernetics’. But for a number of reasons, it never took off.


    The most important reason was that the new science was a victim of its own technological
    success. The key figures in the early days of cybernetics – Norbert Wiener, John
    von Neumann and Claude Shannon – are all much more famous as pioneers of computing.
    In trying to invent a mathematical language to describe their problem, they quickly
    made a lot of discoveries relating to the representation of information and the
    operations that could be performed on it. These discoveries turned out to'
  merge: -1
  pgno: 11
- img_proc: true
  md: 'be extremely useful in the design of electronic circuits. Consequently, there
    was a huge and rapid brain drain away from the abstract study of decision-making
    systems and into the new industry of manufacturing computers. In many ways, when
    presented with such a golden opportunity, you would have had to have been rarer
    odd not to have taken it.


    Related to this fact, many of the people who were involved in the early days of
    cybernetics were a bit odd. In this book, we''ll look at Stafford Beer, a British
    management scientist and consultant. Among other things in his life, he designed
    a method of holding conferences based on an icosahedron, and he tried to use an
    algae-filled pond as a computer. And he was the sensible one – the cybernetic
    who obtained high-powered consultancy jobs in industry and provided huge amounts
    of support to the real oddballs working in the field. The more I have looked into
    the science of ‘management cybernetics’, the more I have realised that there is
    no way to rid it of a fundamental core of eccentricity.


    But something else also happened, because cybernetics didn''t die a natural death.
    The most obvious place for these ideas about the organisation of a modern economy
    would surely have been within the subject of economics, but they didn''t end up.
    Some elements of management cybernetics – even some the ideas of Stafford Beer
    himself – live on in business schools, usually as personal idiosyncies of individual
    researchers. In the economics departments, however, they have their own theories.


    The way in which the economics profession ignored most of the work done in information
    theory is striking. It ignored its traditions relating to uncertainty and decision-making,
    instead ploughing ahead with a frighteningly simplistic view of the world where
    everything could be reduced to a single goal of shareholder value maximisation.


    Why did they do this? Any account of how we got to where we are cover three intellectual
    and organisational revolutions. There was one that happened but we forgot about
    – the managerial revolution, where control was transferred from owners and capitalists
    to professional administrators. There was one that looked like it was going somewhere
    interesting but never arrived – the cybernetic revolution, which might have helped
    us understand what mattered were the systems of professional management rather
    than the individual managers. And then, sometime in'
  merge: -1
  pgno: 12
- img_proc: true
  md: 'the early 1970s, we had the neoliberal revolution, which succeeded in shaping
    our society and its discontents, right up to the present day.

    In a more fortunate counterfactual history, this book might have told the story
    of an academic debate between the neoliberal economists and the management cyberneticians,
    on the nature of a corporation and the organisation of decision-making. But that
    debate didn''t happen. Or rather, it did happen, suddenly, with helicopters and
    guns at the presidential palace of La Moneda, in Chile on 11 September 1973, when
    the government of Salvador Allende was brought down by a coup led by General Augusto
    Pinochet, and Stafford Beer’s consultancy project to bring a new form of economic
    organisation to the country came to an abrupt end.

    Cybernetics was arguably in trouble long before the coup, but that was the moment
    that the world finally chose a different path. In so, we began to get into the
    habit of ignoring the fact that every year, more of the decisions that affect
    our lives are made not by people but by systems. Strange, alien intelligences
    with desires and drives quite different from our own. They’re taking over the
    world – and not only that, for it seems some of them are going mad.

    But we should start this story at the beginning.'
