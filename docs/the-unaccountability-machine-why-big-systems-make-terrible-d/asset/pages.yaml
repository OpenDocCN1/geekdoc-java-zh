    # Tremors and ataxia in automated gunsights


    Norbert Wiener had first thought about control systems in the context of his war
    work. One of his projects at the U.S. government’s Office of Scientific Research
    and Development was to invent an automated gunsight that could predict the movement
    of an enemy aeroplane ‘aim off’ sufficiently to compensate for its likely movement
    while the bullet was in flight. Simply extrapolating along a straight line in
    the direction that the plane was heading not working, as pilots would be taking
    evasive action. But Wiener and his team realised that the planes’ movement couldn’t
    be random. There were limits on the sharpness of turns that could be made, because
    of the need to maintain structural integrity of the airframe and continued consciousness
    of the pilot.'
