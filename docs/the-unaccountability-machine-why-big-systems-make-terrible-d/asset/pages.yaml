  md: 'had been diverted towards the new and useful technological projects of computation
    and telecommunications.


    What happened? Here''s an analogy. Imagine a club of people who are interested
    in turning cubes ‘the right way up’. In the early days of the cube-turning movement,
    they start out debating what it means for a cube to be the right way up and how
    ‘way-upness’ can be manipulated. They are clever people, and breakthroughs come
    so quickly; pretty soon they get the idea of colouring the cubes faces that so
    they can talk about ‘red side up’, ‘blue side down’ and so on. Within a few years,
    they have established fundamental theorems about cube orientation, and the society
    announces a grand symposium, where the leading cube manipulators of the day are
    to discuss the new science of turning cubes.


    Within a year of the symposium, the cube is more or less defunct. It turned out
    that there were two factions within the Cube-turning Society, and they were interested
    in different problems. One group was interested in making long lines of cubes,
    all the same way. The other group wanted to solve Rubik’s Cube puzzles.


    While the question of what constituted the orientation of a cube was live, the
    two groups could work together. Once that question had been resolved, their difference
    became acute, because the two problems are not the same. The group that wanted
    to make long lines of cubes could make rapid progress, because orienting a hundred
    cubes red-side-up is subject to a simple algorithm,\ applied one hundred times.


    The Rubik’s Cube, however, would still be faced with a difficult problem. Colouring
    the faces of their puzzle would have given them a concept of what a solution might
    mean. But it doesn’t solve the problem – in fact, it could be argued that it raises
    a few new questions for them, as they would realise that their original puzzle
    isn’t actually a stack of twenty-seven cubes but only looks like one. They now
    have to grapple with the question of whether their original vision of the puzzle
    as a cube-turning problem was valid. They certainly can''t assume that the strides
    being made by their former clubmates in developing more efficient ways to arrange
    lines of red-side up cubes will be helpful to them.


    # Philosophers and telephones'
