  md: '# 9


    # The Morbid Symptoms


    The crisis consists precisely in the fact that the old is dying and the new cannot
    be born; in this interregnum a great variety of morbid symptoms appear.


    Antonio Gramsci, Prison Notebooks, trans. Quintin Hoare, 1971


    I wanted to write a sort of cybernetic political thriller, but it didn’t quite
    work out that way. It seems that in order to get to the point where the story
    begins, you need to write eight chapters explaining the construction of the murder
    weapon. But here we are. To recapitulate, the basic problem is that systems in
    general need to have mechanisms to reorganise themselves when the complexity of
    their environments gets too much to bear. The high-level governing systems of
    the industrial world – economic policy and business management – had some defects
    and blind spots which prevented this happening. How did that turn into an economic
    crisis, and how did it mature into an ongoing polycrisis? How did we get from
    the Friedman doctrine to Trump, Brexit and populism?


    The first part of the story involves expanding on the conclusion of the last chapter.
    A key part of recent history has been a story of class struggle, but not the usual
    kind. There’s been class war between the capital-owning class and the managerial
    class. It might be easiest to illustrate this by looking at someone who started
    off on one side of this conflict, but quickly turned his cost.


