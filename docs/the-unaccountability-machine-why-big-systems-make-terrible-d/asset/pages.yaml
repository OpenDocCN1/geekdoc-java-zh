  md: '# Author’s Note


    A great deal of intellectual energy is wasted on trying to attribute events to
    the categories of ‘conspiracy or cock-up’, when most of them should probably be
    blamed on something more abstract. History is the study of decisions, not of events,
    and many decisions are best understood as the outcome of larger systems rather
    than individual acts of will.


    Systems don''t have motivations, so they don''t have hidden motivations. If the
    system consistently produces a particular outcome, then that''s its purpose. But
    on the other hand, systems don''t make mistakes. Just as it''s impossible to get
    lost if you don''t know where you''re going, a decision-making system does what
    it does and then either lives with the consequences or dies of them.


    This book talks about a lot of people, and at various points it might look like
    I''m criticising someone, often quite harshly. That''s usually not what I''m trying
    to do. The people are brought into the story because that''s the only way to sensibly
    describe the systems they were part of. If it hadn''t been them, it would have
    been someone else. If this book had a real villain, we might identify it as ‘the
    regrettable tendency of complex systems to have opaque and volatile dynamics’''.'
  merge: -1
