    # Computing Ponds and Rabbit Holes


    Stafford Beer had a ‘computing pond’, which he described in a lecture

    once:


    Many experiments were made . . . Iron filings were included with

    dead leaves in the tank of Daphnia, which ingested sufficient of the

    former to respond to a magnetic field. Attempts were made to feed

    inputs to the colony . . . However, there were many experimental

    problems. The most serious of these was the collapse of any incipient

    organization – apparently to be the steadily increasing suspension of

    tiny permanent magnets in the water.


    It’s not completely clear from the context whether it was a joke, an

    exercise in meditation or just a pet pond, but it seems very likely that his

    experiments were at least semi-serious.


    The idea was to manipulate the pond so that the initial conditions of the

    ageak and insect larvae it contained could be made to respond, in some

    way that was never quite specified, to a computing problem. The hope was

    then the evolutionary process of the pond life could be made, in some

    even less specified way, to develop so to represent the solution.


    Beer also worked with cybernetician Gordon Pask to try to teach

    a petri dish to grow an ear. It was a feedback circuit which sent electric

    currents that could either stabilise or destroy the crystalline structures

    which grew in a ferrous sulphate solution, until the dish was ‘tuned’ and

    abled to distinguish between different frequencies.


    The cyberneticians were always doing things like this. Building

    eronic ‘turtles’ which either drove themselves towards light sources or

    fled away from them. Creating circuits which stepped through different'
