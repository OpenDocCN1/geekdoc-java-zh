    a human being, you can’t assume that its system of priorities is going to be comprehensible
    or justifiable. In particular, consider a system that was simple when it was created,
    but then grew complicated.


    A ‘paperclip maximiser’ is one of those experiments that sounds like a bit of
    a joke. But then notice that people who have made millions of dollars as of knowing
    about artificial intelligence are taking it seriously as a practical possibility.


    The concept was invented by the philosopher Nick Bostrom to illustrate the difficulty
    of controlling something more intelligent than you. Imagine that you wanted to
    make an artificially intelligent paperclip-manufacturing machine. And then presume
    that, in order to make stationary more efficient, you gave yourself the AI in
    your paperclip machine the ability to modify itself and improve its intelligence.
    The ‘paperclip maximiser problem’ suggests that by doing this carelessly, you
    might accidentally destroy all human life in the universe.


