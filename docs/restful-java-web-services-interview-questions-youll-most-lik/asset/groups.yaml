    \n# 172: Jersey Client API 支持哪些 JAVA 类型？\n\n回答：\n\n支持 `byte[]`, `String`, `InputStream`,\
    \ `File`, `DataSource`, JAXB beans。Jersey Client API 还有对 JSON 和 MIME Multipart\
    \ 的支持。\n\n# 173: Jersey Client API 如何利用已有的 Apache HTTP client 或 java.net.HttpURLConnection\
    \ 实现？\n\n回答：\n\nJersey Client API 提供了对封装 `HttpURLConnection` 和 Apache HTTP client\
