    \n# Table of Contents\n\n- 1 RESTful Basics / Annotations 7\n- 2 Deploying a RESTful\
    \ Web Service 19\n- 3 Request Parameters 25\n- 4 Responses 31\n- 5 Sub-Resources\
    \ 33\n- 6 Building URIs 43\n- 7 Exceptions as Responses 47\n- 8 Life Cycle 51\n\
    - 9 Injection 55\n- 10 Params Extraction 59\n- 11 Jersey 65\n- 12 JSON 69\n- 13\
    \ Links 79\n- 14 JAX-RS Client - Jersey Client API 83\n- 15 HR Questions 95\n\
    - INDEX 115\n\n# RESTful JAVA\n\n# Web Services Questions\n\nReview these typical\
    \ interview questions and think about how you would answer them. Read the answers\
    \ listed; you will find best possible answers along with strategies and suggestions.\n\
    \n# RESTful Basics / Annotations\n\n# 1: In which scenarios RESTful Web Services\
    \ are preferred over SOAP ones?\n\nAnswer:\n\nRESTful Web Services are preferred\
    \ when:\n\n- a) The Web Services are completely stateless.\n- b) When data can\
    \ be cached to improve performance.\n- c) Schema of data can be agreed between\
    \ service consumer and service provider.\n- d) Bandwidth is limited.\n\n# 2: How\
    \ do you refer or identify resources in REST design idiom?\n\nAnswer:\n\nResources\
    \ are identified by their unique URLs.\n\n# 3: Is REST stateless or stateful client-server\
    \ architecture?\n\nAnswer:\n\nREST is stateless client-server architecture.\n\n\
    # 4: Name the JAVA API that is used for building and deploying RESTful Web Services.\n\
    \nAnswer:\n\n- a) JAVA API for XML Web Services (JAX-WS) and\n- b) JAVA API for\
    \ XML RESTful Web Services (JAX-RS).\n\n# 5: How Web Service interface for RESTful\
    \ Web Services are described?\n\nAnswer:\n\nRESTful JAVA Web Services Interview\
    \ Questions You'll Most Likely Be Asked\n\nThere is no formal way of describing\
    \ the Web Service interfaces. To overcome this, service producer and service consumer\
    \ agree on schemas that describe the data being exchanged.\n\n# 6: Name few of\
    \ the JAX-RS implementations.\n\nAnswer:\n\nJersey, RESTEasy, Restlet are to name\
    \ a few.\n\n# 7: If I plan to use the Jersey distribution for RESTful Services,\
    \ do I need to download it?\n\nAnswer:\n\nYes. But if you are using NetBeans IDE\
    \ 6.0, downloading is not required.\n\n# 8: How are resources addressed?\n\nAnswer:\n\
    \nEach resource is uniquely addressable using a universal syntax for use in hypermedia\
    \ links.\n\n# 9: In RESTful architecture, what represents the application state\
    \ and functionality?\n\nAnswer.\n\nUniquely Addressable Resources represent the\
    \ application state and functionality.\n\n# 10: What is shared between RESTful\
    \ resource that is used for transfer of state between client and resource?\n\n\
    Answer:\n\nA uniform interface is shared between resources that comprises of a\
    \ set of well-defined operations, content types and optionally supporting code-on-demand.\n\
    \n# 11: How do you annotate a method to respond to HTTP GET requests?\n\nAnswer:\n\
    \njavax.ws.rs.Get annotation specifies that the annotated method will serve HTTP\
    \ Get request.\n\n# 12: Name the most commonly HTTP methods used in designing\
    \ RESTful services.\n\nAnswer:\n\nPUT, GET, POST, DELETE.\n\n# 13: Define one-to-one\
    \ mapping between HTTP methods and CRUD operations.\n\nAnswer:\n\nPUT maps to\
    \ Create, GET maps to Retrieve, POST maps to Update, DELETE maps to Delete.\n\n\
    # 14: What are idempotent methods?\n\nAnswer:\n\nA method is said to be idempotent\
    \ if repeated calls to it does not cause duplicates. e.g GET, DELETE, PUT\n\n\
    # 15: In order to answer HTTP PUT requests, how will you\n\nRESTful JAVA Web Services\
    \ Interview Questions You'll Most Likely Be Asked 11\n\nannotate your resource\
    \ methods?\n\nAnswer:\n\nThe @PUT annotation is used to answer HTTP PUT requests.\n\
    \n# 16: Why PUT methods is idempotent?\n\nAnswer:\n\nPUT is used to create a resource\
    \ and repeating the operation should never create another copy of the resource.\n\
    \n# 17: What is the purpose of javax.ws.rs.HttpMethod?\n\nAnswer:\n\nHttpMethod\
    \ annotation is used to associate the name of a HTTP method with an annotation.\n\
    \n# 18: List resource method designator annotations?\n\nAnswer:\n\n@GET, @PUT,\
    \ @POST, @DELETE\n\n# 19: Define Root class.\n\nAnswer:\n\nRoot class is a POJO\
    \ (Plain Old Objects) that is annotated with @Path and has at least one method.\n\
    \n# 20: Define Resource Method?\n\nAnswer:\n\nMethod of a resource class that\
    \ is annotated with @Path\n\n# 21: How to specify relative path of a resource?\n\
    \nAnswer:\n\nThe @Path annotation is used to specify relative path. e.g.\n@Path(\"\
    /test\")\n\n# 22: How can you embed variables in the URI?\n\nAnswer:\n\nVariables\
    \ can be embedded within the URI syntax (called URI template). The variables are\
    \ substituted at runtime.\n@Path(\"/test/{username}\")\n\n# 23: How embedded variables\
    \ are represented in the URI syntax?\n\nAnswer:\n\nEmbedded variables are denoted\
    \ by curly braces.\n\n# 24: How can you obtain the value of a method parameter?\n\
    \nAnswer:\n\n@PathParam can be used on method parameter of resource method to\
    \ obtain the value for method parameter. e.g. RESTful JAVA Web Services Interview\
    \ Questions You'll Most Likely Be Asked 13\n\n```\npublic String getWelcomeMsg(@PathParam(\"\
    username\") String userName) {\n  ...\n}\n```\n\n# 25: How can you define a regular\
    \ expression for a variable say username?\n\nAnswer:\n\n```\n@Path(\"users/{username:[a-zA-Z][a-zA-Z0-9]*}\"\
    )\n```\n\n# 26: What happens if regular expression of a URI variable is not matched?\n\
    \nAnswer:\n\nA 404 (Not Found) response will occur.\n\n# 27: Will the following\
    \ direct to the same resource?\n\n```\n@Path(\"/test/\")\n\n@Path(\"/test\")\n\
    ```\n\nAnswer:\n\nYes. By default, both should point to the same resource, although\
    \ Jersey has a redirection mechanism that is disabled by default.\n\n# 28: Explain\
    \ how to specify MIME media types of a resource that is sent back to the client?\n\
    \nAnswer:\n\n```\n@Produces annotation is used for this purpose.. e.g.\n@Produces(\"\
    text/plain\")\n```\n\n# 29: Is it true that @Produces can only be applied at method\
    \ level?\n\nAnswer:\nFalse. It can be applied at both the class and method levels.\n\
    \n# 30: Can @Produces annotation be overridden in a RESTful resource? Give example.\n\
    \nAnswer:\nYes. In the following example, the default MIME type is set as text/plain\
    \ but doGetAsHtml method overrides it to text/html.\n\n```\n@Path(\"/testResource\"\
    )\n@Produces(\"text/plain\")\npublic class TestResource {\n  @GET\n  public String\
    \ doGetAsPlainText() {\n    ...\n  }\n\n  @GET\n  @Produces(\"text/html\")\n \
    \ public String doGetAsHtml() {\n    ...\n  }\n}\n```\n\n# 31: How can you declare\
    \ more than one media type in the same @Produces declaration?\n"
