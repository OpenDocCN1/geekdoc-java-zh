    \ Client API?\n\nAnswer:\n\nUse the `.queryParam(name, value)` method on the WebResource\
    \ instance.\n\n# 188: How do you handle path parameters in Jersey Client API?\n\
    \nAnswer:\n\nUse the `.path(path)` method with placeholders and `.build()`.\n\n\
    # 189: How to read the response as a String?\n\nAnswer:\n\nUse the `.type(String.class)`\
    \ method and then call the request method like `.get()` or `.post()`.\n\n# 190:\
    \ What is the difference between Client and WebResource?\n\nAnswer:\n\n`Client`\
    \ is the entry point used to create resources, while `WebResource` represents\
    \ a specific resource at a URI.\n\n# 191: How to use authentication with Jersey\
    \ Client API?\n\nAnswer:\n\nUse the `ClientRequestFilter` to add authentication\
    \ headers to every request.\n\n# 192: How to handle JSON serialization/deserialization?\n\
    \nAnswer:\n\nRegister a `MessageBodyReader` and `MessageBodyWriter` for JSON (like\
