    \ Link header into the response. e.g.\n```java\n@Link(\n    value=@Ref(\"widgets/${resource.nextId}\"\
    ),\n    rel=\"next\"\n)\n```\nProperties of @Ref annotation can be used as shown\
    \ above.\n\n# 166: Can multiple link headers be added by use of the @Links annotation?\n\
