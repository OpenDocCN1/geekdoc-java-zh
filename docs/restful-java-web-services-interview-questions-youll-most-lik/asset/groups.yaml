    \n# 166: 可以使用 @Links 注解添加多个 link 头部吗？\n\n回答：\n\n是的，支持。\n\n# J-RS Client - Jersey\
    \ Client API\n\n# 167: 为什么基于 Java 的 API 不是编写 RESTful 客户端的理想选择？\n\n回答：\n\n基于 Java\
    \ 的 API 关注请求和响应的客户端-服务器约束。它们关注 URI 标识的资源，而 URI 是 RESTful 服务的关键。\n\n# 168: 写出基于\
    \ Java 的客户端 API。\n\n回答：\n\nApache HTTP client API, java.net.HttpURLConnection\
    \ 等。\n\n# 169: 使用 Jersey client API，哪个 JAVA 类封装了 URI？\n\n回答：\n\n使用 Jersey client\
    \ API 时，资源由 `WebResource` 实例表示，它封装了 URI。\n\n# 170: 在使用 Jersey client API 时，将资源表示为\
