    to get a feel for the types of things that motivate you. Keep these professionally-focused,
    and remain passionate about the early points of your career, and how excited you
    were to get started in the field.


    ## 16: How long has it been since your last job and why?


    Answer:

    Be sure to have an explanation prepared for all gaps in employment, and make sure
    it''s a professional reason. Don''t mention difficulties you may have had in finding
    a job, and instead focus on positive things such as pursuing outside interests
    or perhaps returning to school for additional education.


    ## 17: What other types of jobs have you been looking for?


    Answer:

    The answer to this question can show the interviewer that you''re both on the
    market and in deman. Mention jobs you''ve applied for or looked at that are closely
    related to your field, or similar to the position you''re interviewing for. Don''t
    bring up last-ditch efforts that found you applying for a part-time job completely
    unrelated to your field.


    ## 18: Have you ever been disciplined at work?


    Answer:

    Hopefully the answer is here no – but if you have been disciplined for something
    at work though, be absolutely that that you can explain it thoroughly. Detail
    what you learned from the situation, and reflect on how you grew after the process.


    ## 19: What is your availability like?


    Answer:

    Your availability should obviously be as open as possible, and any gaps in availability
    should be explained and accounted for. Avoid asking about vacation or personal
    days (as well as other benefits), and convey to the interviewer how serious you
    are about your work.


    ## 20: May I contact your current employer?


    Answer:

    If possible, it is best to allow an interviewer to contact your current employer
    as a reference. However, if it''s important your employer is not contacted, explain
    your reason tactfully, such as you just started job searching and you haven''t
    had the opportunity yet to inform them that you are looking for other employment.
    Be careful of this reasoning though, as employers may wonder if you start shopping
    for something better while employed with them as well.


    ## 21: Do you have any valuable contacts you could bring to our business?


    Answer:

    It''s great if you can bring knowledge, references, or other contacts that your
    new employer may be able to network with. However, be sure that you aren''t offering
    up any of your previous employer''s clients, or in any way violating contractual
    agreements.


    ## 22: How soon would you be available to start working?


    Answer:

    While you want to be sure that you''re available to start as soon as possible
    if the company is interested in hiring you, if you still have another job, be
    sure to give them at least two weeks'' notice. Though your new employer may be
    anxious for you to start, they will want to hire a worker whom they can respect
    for for giving adequate notice, so that they won''t have to worry if you''ll eventually
    leave them in the lurch.


    ## 23: Why would your last employer say that you left?


    Answer:

    The key to this question is that your employer''s answer must be the same as your
    own answer about why you left. For instance, if you''ve told your employer that
    you left to find a position with greater opportunities for career advancement,
    your employer had better not say that you were let go for missing too many days
    of work. Honesty is key in your job application process.


    ## 24: How long have you been actively looking for a job?


    Answer:

    It''s best if you haven''t been actively looking for a job for very long, as a
    long period of time may make the interviewer wonder why no one else has hired
    you. If it has been awhile, make sure to explain why, and keep it positive. Perhaps
    you haven''t come across many opportunities that provide you with enough of a
    challenge or that are adequately matched to someone of your education and experience.


    ## 25: When you don''t show up to work?


    Answer:

    Clearly, the only time acceptable to miss work is for a real emergency or when
    you''re truly sick – so don''t start bringing up times now that you plan to miss
    work due to vacations or family birthdays. Alternatively, you can tell the interviewer
    how dedicated to your work you are, and how you always strive to be fully present
    and to put in the same amount of work every time you come in, even when you''re
    feeling slightly under the weather.


    ## 26: What is the most common reason you miss work?


    Answer:

    If there is a reason that you will miss work routinely, this is the time to disclose
    it – but doing so during an interview will reflect negatively on you. Ideally,
    you will only miss work during cases of extreme illness or other emergencies.


    ## 27: What is your attendance record like?


    Answer:

    Be sure to answer this question honestly, but ideally you will have already put
    in the work to back up the fact that you rarely miss days or arrive late. However,
    if there are gaps in your attendance, explain them briefly with appropriate reasons,
    make sure to emphasize your dedication to your work, and reliability.


    ## 28: Where did you hear about this position?


    Answer:

    This may seem like a simple question, but the answer can actually speak volumes
    about you. If you were referred by a friend or another employee who works for
    the company, this is a great chance to mention your connection (if the person
    is in good standing!). However, if you heard about it from somewhere like a career
    fair or a work placement agency, you may want to focus on how pleased you were
    to come across such a wonderful opportunity.


    ## 29: Tell me anything else you''d like me to know when making a hiring decision.


    Answer:

    This is a great opportunity for you to give a final sell of yourself to the interviewer
    – use this time to remind the interviewer of why you are qualified for the position,
    and what you can bring to the company that no one else can. Express your excitement
    for the opportunity to work with a company pursuing X mission.


    ## 30: Tell me about a time when you didn''t meet a deadline.


    Answer:

    Ideally, this hasn''t happened – but if it has, make sure you use a minor example
    to illustrate the situation, emphasize how long ago it happened, and be sure that
    you did as much as you could to ensure that the deadline was met. Additionally,
    be sure to include what you learned about managing time better or prioritizing
    tasks in order to meet all future deadlines.


    ## 31: How do you eliminate distractions while working?


    Answer:

    With the increase of technology and the ease of communication, new distractions
    arise every day. Your interviewer will want to see that you are still able to
    focus on work, and that your productivity has not been affected, by an example
    showing a routine you employ in order to stay on task.


    ## 32: Tell me about a time when you worked in a position with a weekly or monthly
    quota to meet. How often were you successful?


    Answer:

    Your numbers will speak for themselves, and you must answer this question honestly.
    If you were regularly met your quotas, be sure to highlight this in a confident
    manner and don''t be shy in pointing out your strengths in this area. If your
    statistics are less than stellar, try to point out trends in which they increased
    toward the end of your employment, and show reflection as to ways you can improve
    in the future.


    ## 33: Tell me about a time when you met a tough deadline, and how you were able
    to complete it.


    Answer:

    Explain how you were able to prioritize tasks, or to delegate portions of an assignments
    to other team members, in order to deal with a tough deadline. It may be beneficial
    to specify why the deadline was tough – make sure it''s clear that it was not
    a result of procrastination on your part. Finally, explain how you were able to
    successfully meet the deadline, and what it took to get there in the end.


    ## 34: How do you stay organized when you have multiple projects on your plate?


    Answer:

    The interviewer will be looking to see that you can manage your time and work
    well – and being able to handle multiple projects at once, and still giving each
    the attention it deserves, is a great mark of a worker''s competence. Go through
    a typical process of goal-setting and prioritizing, and explain the steps of these
    to the interviewer, so he or she can see how well you manage time.


