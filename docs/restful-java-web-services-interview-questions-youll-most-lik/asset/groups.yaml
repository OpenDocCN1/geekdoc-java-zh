    如果这个问题的答案是否定的，这在第一次面试中可能是一个导致交易失败的因素，因为你可能没有很大的还价空间。你可以尝试通过突出你拥有的特定经验以及这如何让你更有胜任力来增加筹码，但要意识到在流程的这一阶段处理这一点非常困难。建议在申请之前了解行业标准，如果可能的话，了解公司标准。


