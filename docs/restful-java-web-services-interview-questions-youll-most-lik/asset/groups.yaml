    \ Which JAVA types are supported by Jersey Client API?\n\nAnswer:\n\nbyte[], String,\
    \ InputStream, File, DataSource, JAXB beans are supported. Jersey Client API also\
    \ has JSON support and MIME Multipart support.\n\n# 173: How does Jersey Client\
