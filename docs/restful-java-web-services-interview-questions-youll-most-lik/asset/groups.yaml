- md: "\n# 100: You wish to map an existing exception to a response instead of throwing\
    \ instances of WebApplicationException from your RESTful resource methods. How\
    \ can this be achieved?\n\nJAX-RS provides javax.ws.ext.ExceptionMapper<E extends\
    \ Throwable> for mapping exceptions to responses.\n\n```\n@Provider\npublic class\
    \ EntityNotFoundMapper implements ExceptionMapper<javax.persistence.EntityNotFoundException>\
    \ {\n    public Response toResponse(javax.persistence.EntityNotFoundException\
    \ ex) {\n        return Response.status(404).entity(ex.getMessage()).type(\"text/plain\"\
    ).build();\n    }\n}\n```\n\n# Life Cycle\n\n# 101: A class is annotated with\
    \ @Provider. What does that tell you?\n\nAnswer:\n\nA class annotated with provider\
    \ means that is of interest to the JAX-RS runtime.\n\n# 102: When is a new instance\
    \ of a root resource class created?\n\nAnswer:\n\nWhen a request URI path matches\
    \ the root resource, a new instance of root resource class is created. Root resource\
    \ class is created per-request.\n\n# 103: Apart from resource classes creation\
    \ on request bases, which other life-cycles are supported by Jersey?\n\nAnswer:\n\
    \nJersey supports the following: root resource instance creation on per-web application\
    \ basis, on per web session basis, on per request basis.\n\n# 104: How will you\
    \ declare a singleton resource class using Jersey?\n\nAnswer:\n\nJersey provides\
    \ @Singleton annotation to support root resource creation per-web application\
    \ basis.\n\n```\n@Singleton\n@Path(\"/exroot\")\npublic class RootResource {\n\
    }\n```\n\nRESTful JAVA Web Services Interview Questions You'll Most Likely Be\
    \ Asked 53\n\n# 105: Which Jersey annotation can be used if we want to create\
    \ one instance of a resource class for one web session?\n\nAnswer:\n\n@Session\
    \ allows an instance of resource class to be stored as a session attribute which\
    \ allows it to be shared in the session.\n\n# 106: How do you obtain SecurityContext\
    \ in a resource method?\n\nAnswer:\n\nSecurityContext is obtained using @Context\
    \ annotation. In the following example, resource method's parameter named 'sc'\
    \ is annotated with @SecurityContext to obtain SecurityContext. e.g. @Path(\"\
    test\")\n\n```\npublic TestResource get(@Context SecurityContext sc) {\n...\n\
    }\n```\n\n# Injection\n\n# 107: Where can you use injection in your RESTful resource\
    \ class?\n\nAnswer:\n\nInjection can be performed on fields, bean setter methods,\
    \ constructor parameters and resource's/sub-resource's method parameters.\n\n\
    # 108: Give an example of injection onto a field?\n\nAnswer:\n\n```\n@Path(\"\
    student\")\npublic class StudentResource {\n\n@DefaultValue(\"20\")\n@PathParam(\"\
    age\")\nprivate int age;\n...\n}\n```\n\n# 109: How can you inject a value into\
    \ a RESTful resource class's constructor parameter?\n\nAnswer:\n\n@PathParam annotation\
    \ is used for this purpose. e.g.\n@Path(\"student\")\n\n```java\npublic class\
    \ StudentResource(@PathParam(\"id\") int id) { ... }\n...\n```\n\nRESTful JAVA\
    \ Web Services Interview Questions You'll Most Likely Be Asked 57\n\n# 110: Give\
    \ an example of injection onto resource method parameter?\n\nAnswer:\n@GET\npublic\
    \ String get(@Context UriInfo ui) { ... }\n\n# 111: Is it possible to use injection\
    \ onto a sub-resource method parameter?\n\nAnswer:\n\nYes. It is done in the same\
    \ way as done for resource method parameter.\ne.g.\n@Path(\"sub\")\n@GET\npublic\
    \ String get(@PathParam(\"sid\") String sid) { ... }\n\n# 112: What are the injection\
    \ restrictions on resource classes with a life-cycle other than per-request?\n\
    \nAnswer:\nFor non-per-request resource classes, it is not possible to inject\
    \ onto fields for the annotations associated with extraction of request parameters.\n\
    \n# 113: For non-per-request resource classes, will injection work for fields\
    \ with @Context annotation?\n\nAnswer:\nYes. For @Context annotation, a thread\
    \ local proxy will be injected.\n\n# 114: Where are @RequestParam annotation used?\n\
    \nAnswer:\n\n@RequestParam annotation can only be used on resource and sub-resource\
    \ methods.\n\n# 115: Assume that you are deploying a JAX-RS application using\
    \ servlet. What will be available using @Context?\n\nAnswer:\n\nServletConfig,\
    \ ServletContext, HttpServletRequest and HttpServletResponse.\n\n# Params Extraction\n\
    \n# 116: What type of parameters can be extracted in a resource class?\n\nAnswer:\n\
    \nA resource class can extract the following parameters: Query, URI path, Form,\
    \ Cookie, Header, Matrix\n\n# 117: Which JAX-RS annotation retrieves the JAVA\
    \ types related to a request or response?\n\nAnswer:\n\njavax.ws.rs.core.Context\
    \ annotation\n\n# 118: How do you get information about the request headers and\
    \ cookies?\n\nAnswer:\n\nThe javax.ws.rs.core HttpHeaders interface is used to\
    \ obtain a map of header and cookie parameters. e.g.\nGET\n\n```\npublic String\
    \ getHeaders(@Context HttpHeaders hh) {\n  MultivaluedMap<String, String> headers\
    \ = hh.getHeaders();\n  MultivaluedMap<String, String> cookies = hh.getCookies();\n\
    \  ...\n}\n```\n\n# 119: You wish to retrieve information about the request. Which\
    \ interface can provide that?\n\nAnswer:\n\nThe javax.ws.rs.core.UriInfo interface\
    \ provides map of query and path parameters. e.g.\nRESTful JAVA Web Services Interview\
    \ Questions You'll Most Likely Be Asked 51\n\n```\npublic String get(@Context\
    \ UriInfo ui) {\n    ...\n}\n```\n\n# 120: Which annotation is used to extract\
    \ form?\n\nAnswer:\n\n@FormParam is used to extract form parameters.\n\n# 121:\
    \ A form is posting 'name' to your resource. What annotation is used to extract\
    \ it?\n\nAnswer:\n\n@FormParam is used to extract form parameters.\n\n# 122: Write\
    \ a resource method that obtains map of form parameters.\n\nAnswer:\n\n```\n@POST\n\
    @Consumes(\"application/x-www-form-urlencoded\")\npublic void post() {\n    ...\n\
    }\n```\n\n# 123: What are URI templates?\n\nAnswer:\n\nURIs with variables embedded\
    \ within the URI syntax is referred as URI templates.\n\n# 124: How do you use\
    \ variable path fragment in your resource method?\n\nAnswer:\n\nThe @PathParam\
    \ annotation allows us to use variable path fragments in resource methods. e.g.\n\
    \n```\n@Path(\"/employees/{firstName}\")\npublic class EmployeeResource {\n  @GET\n\
    \  @Produces(\"text/plain\")\n  public String getEmployee(@PathParam(\"firstName\"\
    ) String firstName) {\n    ...\n  }\n}\n```\n\n# Jersey\n\n# 126: What does Jersey\
    \ use to parse incoming requests?\n\nAnswer:\n\nIt uses javax.ws.rs.ext.MessageBody\
    \ which is a contract (interface) for a provider that supports the conversion\
    \ of a stream to JAVA type.\n\n# 127: What does Jersey use to create outgoing\
    \ responses?\n\nAnswer:\n\nJersey uses javax.ws.rs.ext.MessageBodyWriter to create\
    \ outgoing messages. MessageBodyWriter is a contract (interface) for a provider\
    \ that supports the conversion of a JAVA type to a stream.\n\nQuestions 128 &\
    \ 129 are based on the following:\n\n```\n@Path(\"/hello\")\npublic class Hello\
    \ {\n...\n@Path(\"/student\")\n@GET\n@Produces(MediaType.TEXT_XML)\npublic Student\
    \ getStudent() {\nreturn new Student(22,\"Name\",\"ABC\");\n...\n}\n```\n\n@XmlRootElement(name=\"\
    RS_Student\")\n\n```java\npublic class Student {\n    public int id;\n    public\
    \ String name;\n    public String location;\n\n    public Student(){}\n    public\
    \ Student(int id, String name, String location){\n    this.id = id;\n    this.name\
    \ = name;\n    this.location = location;\n    }\n}\n```\n\n# 128: What will be\
    \ the output if you call the student resource method using URI: /hello/student?\n\
    \nAnswer:\n<RS_Student>\n<id>22</id>\n<name>Name</name>\n<location>ABC</location>\n\
    </RS_Student>\n\n# 129: If @XmlRootElement is removed from Student class, will\
    \ the code still compile? What will be the output if you call the student resource\
    \ method using URI: /hello/student?\n\nAnswer:\nCode will compile fine but we\
    \ will get an error at runtime.\n"
