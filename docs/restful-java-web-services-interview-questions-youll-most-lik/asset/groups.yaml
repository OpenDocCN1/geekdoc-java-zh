    \n# 33: 你将如何指定 RESTful 资源可以使用的表示的 MIME 媒体类型？\n\n# 答案：\n\n使用 `@Consumes` 注解。\n\n\
    # 34: 编写一个在 POST 请求时触发并接受 text/plain 作为输入的方法。\n\n# 答案：\n\n```\n@POST\n@Consumes(\"\
    text/plain\")\npublic void postMessage(String message) {\n...\n}\n```\n\n# 35:\
    \ @Consumes 可以应用于哪些级别？\n\n# 答案：\n\n@Consumes 可以同时应用于类级别和方法方法级别。\n\n# 36: 给出一个声明多个媒体类型的\
    \ @Consumes 声明的例子？\n\n答案：\n\n```\n@POST\n@Consumes(\"application/plain\",\"application/xml\"\
    )\npublic void postMessage(String message) {\n...\n}\n```\n\n# 37: RESTful Web\
    \ 服务支持多种类型的响应（MIME 格式）吗？\n\n答案：\n\nRESTful Web 服务通过遵循 HTTP 确实支持多种类型的响应（MIME）格式，例如：XML、JSON、PLAIN\
    \ 等。\n\n# 38: RESTful Web 服务通常支持哪两种响应格式？\n\n答案：\n\nXML 和 JSON。\n\n# 39: 在设计 RESTful\
    \ Web 服务时，什么构成了系统的资源？\n\n答案：\n\n任何具有表示的系统概念都应该被暴露为资源。\n\n# 40: HATEOAS 是什么意思？\n\
    \n答案：\n\n超媒体作为应用程序状态引擎（HATEOAS）意味着会话中的交换状态既不在客户端也不服务器保留。所有必要的信息都存储在交换的 HTTP 消息中。\n\
    \n# 41: 定义统一接口约束（Uniform Interface Constraint）？\n\n答案：\n\n统一接口约束绑定了 RESTful Web\
    \ 服务的架构；由于这种，客户端可以使用相同的接口与任何服务进行通信。\n\n# 部署 RESTful Web 服务\n\n# 42: 写出用于声明根资源的\
    \ JAX-RS 部署无关抽象类。\n\n答案：\n\nJAX-RS 提供了一个名为 `Application` 的部署无关抽象类来声明根资源。\n\n#\
    \ 43: 如何使用 JAX-RS Application 类声明根资源和提供类？\n\n答案：\n\nWeb 服务需要扩展 `Application` 类来声明根资源和提供类，例如：\n\
    \n```\npublic class MyApplication extends Application {\n    public Set<Class<?>>\
    \ getClasses() {\n        Set<Class<?>> s = new HashSet<Class<?>>();\n       \
    \ s.add(HellResource.class);\n        return s;\n    }\n}\n```\n\n# 44: 给出一个使用\
    \ Servlet 3.0 配合 @ApplicationPath 进行 JAX-RS 应用部署的例子。\n\n答案：\n\n```\n@ApplicationPath(\"\
    resources\")\npublic class MyApplication extends PackagesResourceConfig {\n  \
    \  public MyApplication() {\n        super(\"org.test.rest;org.test1.rest\");\n\
    \    }\n}\n```\n\n# 你最可能遇到的 RESTful Java Web 服务面试题\n\n...\n. 在大多数情况下不需要 .xml。当使用\
    \ maven 构建没有 web.xml 文件的 .war 时，在 pom.xml 中设置 maven-war-plugin 属性 `failOnMissingWebXml`\
    \ 为 `FALSE` 是重要的。\n\n# 45: 如何在 pom.xml 中为 Servlet 3.0 配置 maven-war-plugin？\n\n\
    答案：\n\n```\n<plugin>\n<groupId>org.apache.maven.plugins</groupId>\n<artifactId>maven-war-plugin</artifactId>\n\
    <version>2.1.1</version>\n<configuration>\n<failOnMissingWebXml>false</failOnMissingWebXml>\n\
    </configuration>\n</plugin>\n```\n\n# 46: 是否可以在 web.xml 中声明 JAX-RS 应用细节？\n\n答案：\n\
    \n可以，但这仅在复杂的部署场景下是首选。\n\n# 47: 你将如何在 web.xml 中声明 JAX-RS 应用细节？\n\n答案：\n\n根据 JAX-RS\
    \ 1.1 规范，实现 `Application` 的类的全限定名必须在 JAX-RS 应用的 web.xml 的 `<servlet-name>` 元素中声明。\n\
    \n```\n这在实现 Servlet 3.0 的 Web 容器中受支持。\n<web-app>\n<servlet>\n  <servlet-name>org.test.rest.MyApplication</servlet-name>\n\
    </servlet>\n...\n<servlet-mapping>\n  <servlet-name>org.test.rest.MyApplication</servlet-name>\n\
    \  <url-pattern>/resources</url-pattern>\n</servlet-mapping>\n...\n</web-app>\n\
    ```\n\n在 servlet 声明中不需要 `<servlet-class>` 元素。\n\n# 48: 使用 Servlet 3.0 扩展机制声明 RESTful\
    \ 资源，web.xml 中用哪个元素定义基础资源 URI。\n\n答案：\n使用 `<servlet-mapping>` 来定义基础资源 URI。\n\n\
    # 49: 你正在使用 Servlet 2.0 并在 web.xml 中声明 Jersey 特有的 servlet。你将如何配置它？\n\n答案：\n我们需要声明\
    \ servlet：\n\n```\n<web-app>\n<servlet>\n  <servlet-name>org.test.rest.MyApplication</servlet-name>\n\
    \  <servlet-class>org.test.rest.MyApplication</servlet-class>\n</servlet>\n...\n\
    <servlet-mapping>\n  <servlet-name>org.test.rest.MyApplication</servlet-name>\n\
    \  <url-pattern>/resources</url-pattern>\n</servlet-mapping>\n...\n</web-app>\n\
    ```\n\n# 50: 你正在使用 Servlet 3.0 并想要声明 Jersey 特有的应用。你将如何配置它？\n\n答案：\n\n```\n<plugin>\n\
    <groupId>org.apache.maven.plugins</groupId>\n<artifactId>maven-war-plugin</artifactId>\n\
    <version>2.1.1</version>\n<configuration>\n<failOnMissingWebXml>false</failOnMissingWebXml>\n\
    </configuration>\n</plugin>\n```\n\n# 51: 基于参数注解（parameter-based annotations）的目的是什么？\n\
    \n答案：\n基于的注解用于从请求中提取信息。\n\n# 52: 你将使用哪个注解从 URL 中提取查询参数？\n\n答案：\n`@QueryParams`\n\
    \n# 53: 如何为资源方法参数声明默认值？\n\n答案：\n使用 `@DefaultValue` 来声明资源方法参数的默认值。\n```\n@Path(\"\
    /test\")\n@GET\npublic Response getName(@DefaultValue(\"1\") @QueryParams(\"id\"\
    ) int id){\n  ...\n}\n```\n\n# 54: 如果请求的查询参数无法解析为资源方法参数，会发生什么？\n\n答案：\n返回 HTTP\
    \ 404 (Not Found) 响应。\n\n# 55: 资源方法的查询参数只能使用基本类型？\n\n答案：\n不是。可以使用自定义类型。\n\n# 56:\
    \ 查看以下资源方法。如果请求中不存在查询参数，资源方法参数 'id' 的值是什么？\n\n```\n@Path(\"/test\")\n@GET\npublic\
    \ Response getName(@QueryParams(\"id\") int id){\n...\n}\n```\n\n答案：\n如果不存在，Java\
    \ 基本类型获得 Java 定义的默认值。在给定情况下，id 将为 0。\n\n# 57: 查看以下资源方法。如果请求中不存在查询参数，资源方法参数 'firstName'\
    \ 的值是什么？\n\n```\n@Path(\"/test\")\n@GET\npublic Response getLastName(@QueryParams(\"\
    firstName\") String firstName){\n...\n}\n```\n\n答案：\n如果查询参数不存在，对象类型将获得 `null`。在给定情况下，firstName\
    \ 将为 `null`。\n\n# 58: 如果未指定默认值且请求中不存在参数，List<T> 类型的资源方法参数设置什么默认值？\n\n答案：\n\n空列表。\n\
    \n# 59: 写出从 URL 路径段提取信息的基于参数的注解\n\n答案：\n`@MatrixParam`\n\n# 60: 使用哪些基于参数的注解从 HTTP\
    \ 头部提取信息？\n\n答案：\n`@HeaderParam`\n\n# 61: 写出从 cookie 相关的 HTTP 头部提取信息的基于参数注解\n\n\
    答案：\n`@CookieParam`\n\n# 62: 你想获取 HTML 表单提交的参数作为资源方法的参数。你倾向于使用哪个注解？\n\n答案：\n`@FormParam`\n"
