    # 36: How do you handle deadlines?


    Answer:


    The most important part of handling tough deadlines is to prioritize tasks and
    set goals for completion, as well as to delegate or eliminate unnecessary work.
    Lead the interviewer through a general scenario, and display your competency through
    your ability to organize and set priorities, and most importantly, remain calm.


    # 37: Tell me about your personal problem-solving process.


    Answer:


    Your personal problem-solving process should include outlining the problem, coming
    up with possible ways to fix the problem, and setting a clear action plan that
    leads to resolution. Keep your answer brief and organized, and explain the steps
    in a concise, calm manner that shows you are level-headed even under stress.


    # 38: What sort of things at work can make you stressed?


    Answer:


    As it’s best to stay away from negatives, keep this answer brief and simple. While
    answering that nothing at work makes you'
  - '[PAGE 111]


    stressed will not be very believable to the interviewer, keep your answer to one
    generic principle such as when members of a team don''t keep their commitments,
    and then focus on a solution you generally employ to tackle that stress, such
    as having weekly status meetings or intermittent deadlines along the course of
    a project.


    # 39: What do you look like when you are stressed about something? How do you
    solve it?


    Answer:


    This is a trick question – your interviewer wants to hear that you don''t look
    any different when you''re stressed, and that you don''t allow negative emotions
    to interfere with your productivity. As far as how you solve your stress, it''s
    best if you have a simple solution mastered, such as simply taking deep breaths
    and counting to 10 to bring yourself back to the task at hand.


    # 40: Can you multi-task?


    Answer:


    Some people can, and some people can''t. The most important part of multi-tasking
    is to keep a clear head at all times about what needs to be done, and what priority
    each task falls under. Explain how you evaluate tasks to determine priority, and
    how you manage your time in order to ensure that all are completed efficiently.


    # 41: How many hours per week do you work?'
  - '[PAGE 112]


    # RESTful JAVA Web Services Interview Questions You''ll Most Likely Be Asked


    Answer:


    Many people get tricked by this question, thinking that answering more hours is
    better – however, this may cause an employer to wonder why you have to work so
    many hours in order to get the work done that other people can do in a shorter
    amount of time. Give a fair estimate of hours that it should take you to complete
    a job, and explain that you are also willing to work extra when needed.


    # 42: How many times per day do you check your email?


    Answer:


    While an employer wants to see that you are plugged into modern technology, it
    is also important that the number of times you check your email per day is relatively
    low – perhaps two to three times per day (dependent on the specific field you''re
    in). Checking email is often a great distraction in the workplace, and while it
    is important to remain connected, much correspondence can simply be handled together
    in the morning and afternoon.


    # 43: Tell me about a time when you worked additional hours to finish a project.


    Answer:


    It''s important for your employer to see that you are dedicated to your work,
    and willing to put in extra hours when required or a job calls for it. However,
    be careful when explaining why you were called to work additional hours – for
    instance, did you have to stay late because you set goals poorly earlier in'
  - '[PAGE 113]


    the process? Or on a more positive note, were you working additional hours because
    a client requested for a deadline to be moved up on short notice? Stress your
    competence and willingness to give 110% every time.


    # 44: Tell me about a time when your performance exceeded the duties and requirements
    of your job.


    Answer:


    If you''re a great candidate for the position, this should be an easy question
    to answer – choose a time when you truly went above and beyond the call of duty,
    and put in additional work or voluntarily took on new responsib-ilities. Remain
    humble, and express gratitude for the learning opportunity, as well as confidence
    in your ability to give a repeat performance.


    # 45: What is your driving attitude about work?


    Answer:


    There are many possible good answers to this question, and the interviewer primarily
    wants to see that you have a great passion for the job and that you will remain
    motivated in your career if hired. Some specific driving forces behind your success
    may include hard work, opportunity, growth potential, or success.


    # 46: Do you take work home with you?


    Answer:


    It is important to first clarify that you are always willing to take'
  - '[PAGE 114]


    RESTful JAVA Web Services Interview Questions You''ll Most Likely Be Asked 113


    work home when necessary, but you want to emphasize as well that it has not been
    an issue for you in the past. Highlight skills such as time management, goal-setting,
    and multi-tasking, which can all ensure that work is completed at work.


    # 47: Describe a typical work day to me.


    Answer:


    There are several important components in your typical work day, and an interviewer
    may derive meaning from any or all of them, as well as from your ability to systematically
    lead him or her through the day. Start at the beginning of your day and proceed
    chronologically, making sure to emphasize steady productivity, time for review,
    goal-setting, and prioritizing, as well as some additional time to account for
    unexpected things that may arise.


    # 48: Tell me about a time when you went out of your way at your previous job.


    Answer:


    Here it is best to use a specific example of the situation that required you to
    go out of your way, what your specific position would have required that you did,
    and how you went above that. Use concrete details, and be sure to include the
    results, as well as reflection on what you learned in the process.


    # 49: Are you open to receiving feedback and criticisms on your job performance,
    and adjusting as necessary?'
  - '[PAGE 115]


    # Answer:


    This question has a pretty clear answer – yes – but you''ll need to display a
    knowledge as to why this is important. Receiving feedback and criticism is one
    thing, but the most important part of that process is to implement it into your
    daily work. Keep a good attitude, and express that you always appreciate constructive
    feedback.


    # 50: What inspires you?


    # Answer:


    You may find inspiration in nature, reading success stories, or mastering a difficult
    task, but it''s important that your inspiration is positively-based and that you''re
    able to listen and tune into it when it appears. Keep this answer generally based
    in the professional world, but where applicable, it may stretch a bit into creative
    exercises in your personal life that, in turn, you in achieving career objectives.


    # 51: How do you inspire others?


    # Answer:


    This may be a difficult question, as it is often hard to discern the effects of
    inspiration in others. Instead of offering a specific example of a time when you
    inspired someone, focus on general principles such as leading by example that
    you employ in your professional life. If possible, relate this to a quality of
    someone who inspired you possessed, and discuss the way you have modified or modeled
    it in your own work.


    And Finally Good Luck!'
