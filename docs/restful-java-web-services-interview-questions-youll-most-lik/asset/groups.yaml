    # 102: When is a new instance of a root resource class created?


    Answer:


    When a request URI path matches the root resource, a new instance of root resource
    class is created. Root resource class is created per-request.


    # 103: Apart from resource classes creation on request bases, which other life-cycles
    are supported by Jersey?


    Answer:


    Jersey supports the following: root resource instance creation on per-web application
    basis, on per web session basis, on per request basis.


