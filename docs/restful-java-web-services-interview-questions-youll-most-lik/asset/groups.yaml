    Use `ClientConfig.PROPERTY_TIMEOUT` and `ClientConfig.PROPERTY_CONNECT_TIMEOUT`.\n\
    \n# 195: How to perform a file upload?\n\nAnswer:\n\nUse `MultiPartProvider` and\
