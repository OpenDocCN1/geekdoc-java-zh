    \  <version>${jersey-version}</version>\n</dependency>\n```\n\nThen the filter\
    \ has to be installed in the application.\n\n# 164: How can you install declarative\
    \ hyperlinking filter in your application in web.xml?\n\nAnswer:\n\nIt can be\
    \ done using init params. e.g.\n\n```\n<init-param>\n  <name>com.sun.jersey.spi.container.ContainerResponseFilters</name>\n\
