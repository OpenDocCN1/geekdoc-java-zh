    # RESTful JAVA\n\n# Web 服务问题\n\n回顾这些典型的面试题，并思考你将如何回答它们。阅读列出的答案；你将找到最佳答案以及相关的策略和建议。\n\
    \n# RESTful 基础 / 注解\n\n# 1: 在哪些场景下 RESTful Web 服务优于 SOAP 服务？\n\n答案：\n\n在以下情况下，优选\
    \ RESTful Web 服务：\n\n- a) Web 服务是完全无状态的。\n- b) 数据可以被缓存以提高性能。\n- c) 服务消费者和提供提供者之间可以达成数据模式（Schema）。\n\
    - d) 带宽有限。\n\n# 2: 在 REST 设计范式中，你如何引用或标识资源？\n\n答案：\n\n资源通过其唯一的 URL 进行标识。\n\n#\
    \ 3: REST 是无状态还是有状态的客户端服务器架构？\n\n答案：\n\nREST 是无状态的客户端服务器架构。\n\n# 4: 列出用于构建和部署\
    \ RESTful Web 服务的 JAVA API。\n\n答案：\n\n- a) 用于 XML 服务的 JAVA API (JAX-WS) 以及\n-\
    \ b) 用于 XML RESTful 服务的 JAVA API (JAX-RS)。\n\n# 5: RESTful Web 服务的接口是如何描述的？\n\n\
    答案：\n\nRESTful JAVA Web 服务面试题 你最可能被问到的\n\nRESTful Web 服务接口通过注解（Annotations）来描述。服务消费者和提供者之间可以对数据达成一致。\n\
    \n# 6: 列出 RESTful 的实现方式。\n\n答案：\n\nJersey, REasy, Restlet。\n\n# 7: 在计划使用 RESTful\
    \ 服务时，需要 Jersey 吗？\n\n答案：\n\n是的，使用 Jersey 6.0。\n\n# 8: 资源是如何定位的？\n\n答案：\n\n资源通过唯一的\
    \ URI 进行定位。\n\n# 9: 在 REST 架构中，状态是如何表示的？\n\n答案：\n\n在 REST 架构中，通过 URI 来表示状态。\n\n\
    # 10: RESTful 接口是如何描述的？\n\n答案：\n\n通过 URI 模板（URI templates）描述。\n\n# 11: Jersey\
    \ 是什么？\n\n答案：\n\nJersey 是 JAX-RS 的实现。\n\n# 12: JSON 是什么？\n\n答案：\n\nJSON 是一种数据交换格式。\n\
    \n# 13: 链接的用途是什么？\n\n答案：\n\n用于超媒体（hypermedia links）。\n\n# 14: JAX-RS 客户端 - Jersey\
    \ Client API 是什么？\n\n答案：\n\n（此处根据原文逻辑，跳转至 15 人力资源面试题）\n\n# 15: 什么是幂等方法？\n\n答案：\n\
    \n如果多次调用方法不会产生副作用，则称它是幂等的。\n\n# 16: 为什么 PUT 方法是幂等的？\n\n答案：\n\n重复调用不会产生副本。\n\n\
    # 17: HttpMethod 的作用是什么？\n\n答案：\n\nHttpMethod 注解用于关联 HTTP 方法。\n\n# 18: 列出常见的 HTTP\
    \ 注解。\n\n答案：\n\nGET, POST, DELETE。\n\n# 19: 定义根类（Root class）。\n\n答案：\n\n带有 @Path\
    \ 注解的 POJO（普通 Java 对象）。\n\n# 20: 什么是资源方法？\n\n答案：\n\n带有 @Path 注解的类方法。\n\n# 21:\
    \ 如何指定资源的相对路径？\n\n答案：\n\n使用 @Path 注解来指定相对路径。\n\n# 22: 变量如何在 URI 中嵌入？\n\n答案：\n\n\
    变量在花括号中嵌入，例如 `{username}`。\n\n# 23: 如何获取方法参数的值？\n\n答案：\n\n在方法参数上使用 @PathParam\
    \ 注解来获取。\n\n# 24: 如何为变量 username 定义正则表达式？\n\n答案：\n\n```\n@Path(\"users/{username:[a-zA-Z][a-zA-Z0-9]*}\"\
    )\n```\n\n# 25: 如果正则表达式匹配会发生什么？\n\n答案：\n\n会发生 404（未找到）响应。\n\n# 26: 下列代码指向同一个资源吗？\n\
    \n```\n@Path(\"/test/\")\n\n@Path(\"/test\")\n```\n\n答案：\n\n是的。默认情况下它们指向同一个资源，尽管\
    \ Jersey 有一种重定向机制但它是禁用的。\n\n# 27: 解释如何指定返回给客户端的资源的 MIME 类型。\n\n答案：\n\n```\n@Produces\
    \ 注解用于此目的。例如：\n@Produces(\"text/plain\")\n```\n\n# 28: @Produces 只能应用于方法级别吗？\n\
    \n答案：\n\n错误。它可以既应用于类级别，也可以应用于方法级别。\n\n# 29: RESTful 资源可以覆盖 @Produces 注解吗？给出示例。\n\
    \n答案：\n\n是的。在以下示例中，默认 MIME 类型被设置为 text/plain，但 doGetAsHtml 方法将其覆盖为 text/html。\n\
    \n```\n@Path(\"/testResource\")\n@Produces(\"text/plain\")\npublic class TestResource\
    \ {\n  @GET\n  public String doGetAsPlainText() {\n    ...\n  }\n\n  @GET\n  @Produces(\"\
    text/html\")\n  public String doGetAsHtml() {\n    ...\n  }\n}\n```\n\n# 31: 如何在同一个\
    \ @Produces 声明中声明多个媒体类型？\n\n"
