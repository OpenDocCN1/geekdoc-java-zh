  md: '# 40: What does HATEOAS mean?


    Answer:


    Hypermedia As The Engine Of Application State (HATEOAS) means that state of the
    exchange in a session is neither kept by the client nor server. All the necessary
    information is stored in the exchanged HTTP messages


    # 41: Define Uniform Interface Constraint?


    Answer:


    The Uniform Interface Constraint binds the architecture of RESTful Web Services;
    due to this a client can utilize the same interface to communicate with any service.'
