  md: '# 82: How do you specify which MIME types of representations your resource
    can accept?


    Answer:


    Resource class and resource methods can be annotated with @Consumes to specify
    the accepted MIME types.


    # 83: Assume that you applied @Consumes at the class level and have not specified
    it at method level. What response MIME type will be accepted by the methods?


    Answer:


    Response method accepts the class specified MIME type by default. This means that
    the methods will consume the MIME type defined at class level unless overridden
    at method level.


    # 84: Can you override a MIME type at resource method level?


    Answer:


    Yes. @Consumes can be applied at the method level and will override any @Consumes
    annotations applied at the class level.


    # 85: What response will be sent to the client if its requested MIME type is not
    produced by any resource method?


    Answer:


    In such cases, the JAX-RS runtime sends back an HTTP “406 Not Acceptable” error.'
