  md: 'Yes, conditional GET and PUT HTTP requests are supported by JAX-RS.


    # 78: What is the benefit of conditional GET and PUT HTTP requests?


    Answer:


    Conditional GET and PUT HTTP requests help in saving the bandwidth and thus improving
    the efficiency of client processing.


    # 79: Assume that the static content has not changed since the previous request.
    What response should be sent for a GET request to save bandwidth?


    Answer:


    A Not Modified (304) response.


    # 80: Assume that the representation was modified when the client made a PUT request.
    What response should be sent to it?


    Answer:


    A Precondition Failed (412) response.


    # 81: What is the correct way of solving a Precondition Failed (412) response
    that results in lost update problem?


    Answer:


    The conditional PUT can be used to avoid the lost update problem.'
