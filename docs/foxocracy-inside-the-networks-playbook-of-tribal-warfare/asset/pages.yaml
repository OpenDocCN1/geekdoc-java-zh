- img_proc: true
  md: '2. And your social identities or the groups you feel proud of (i.e., “I’m a
    proud __”).


    Henri Tajfel (“Dodge-Fell”) is a Polish social psychologist who created social
    identity theory in 1979. Tajfel proposed that the most important groups that people
    belong to (social class, family, alumnus, conservative, liberal, etc.) are an
    important source of pride and self-esteem. Tajfel’s experiments proved our in-groups
    gave us a sense of social identity; a sense of belonging to the superior groups
    in the social world.—the feeling of intellectual, spiritual, moral, or physical
    superiority over “others” is the word here is superiority the mother’s milk of
    social identity (and the psychological engine that powers Fox News tribal identity
    opinion segments).


    Social identity in fact fills two core psychological needs. One is to feel the
    positive personal self-esteem that comes from group inclusion and the other is
    a more positive and meaningful sense of who you are and what you stand for.


    Now here is this SIT thing gets interesting and where Fox News’s tribal identity
    porn programming strategy rocks the world of self-identified right-wing tribal
