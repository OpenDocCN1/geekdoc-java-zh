    The answer to that question is Social Identity Theory (SIT). In case you skipped
    social and humanist psychology in college—SIT says individuals in addition to
    a self-identity possess social identities—that part of their concept of who they
    are and how positively they see themselves is also derived from their group memberships.


    Social identity theory is based on the fact that humans are hardwired and driven
    to improve and build their self-image/self-esteem/self-pride through two vehicles:
    self-identity or personal accomplishments and their social identities.


    In other words, humankind has two paths to improving our concept of self and self-pride:


