  md: '# NOTE TO READERS


    I held off publishing this book out of respect for my dear friend Brenda

    Buttner, who was also host of my weekly weekend Fox News opinion

    program Bulls & Bears. Brenda passed away in early 2016 after a long and

    courageous fight against cancer.


    Frankly, with all the firsthand observations, secrets, and stories I

    accumulated as a fourteen-year insider within Fox''s Sixth Avenue New

    York headquarters, I was also more than a little afraid of Roger Ailes, until

    h passing in May of 2017.


    Ultimately, when I discovered how what we were doing affected the

    millions of folks who fell down the Foxhole, I became ashamed of what I

    had helped Fox News accomplish. I am hopeful that more former Fox News

    opinion-program producers and contributors will add their stories to the

    record. Already, brave reporters like my old friend and longtime FNC

    reporter Adam Housley, Col. Ralph Peters, and recently Carl Cameron have

    quit Fox News in protest.


    For the good of our country and its democracy, I hope more come

    forward.'
