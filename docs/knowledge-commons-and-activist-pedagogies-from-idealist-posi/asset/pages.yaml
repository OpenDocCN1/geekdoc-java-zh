    PJ & AK: The civil society is the collective consciousness, which provides leverage
    against national and corporate agendas and serves as a powerful social correct.
    Thus, at the outset of the US invasion in Iraq. Net.culture club MaMa rejected
    a $100 000 USAID grant the invasion was:


    +   a) a precedent on the rationale of pre-emptive war, b) waged in disregard
    of legitimate processes of the international community, and c) by corporate interests
    to control natural resources (Multimedia Institute, 2003 in Razza, 2015: 82).


    Yet, a few weeks later, MaMa accepted a $100 000 grant from the German state —
    this provided a wide public debate (Razza, 2015; Kršić, 2003; Stubbs, 2012).


    Now that the heat of the moment has gone down, what is your view to this debate?
    More generally how do you decide which money to accept and reject? How do you
    decide where to publish, where to exhibit, and whom to work? What is the relationship
    between idealism and pragmatism in your work?


    MM & TM: Our decision seems just insignificant in the face of the aftermath of
    that historical moment. The unilateral decision of US and its allies to invade
    Iraq in March 2003 encapsulated the defeat of global protest movements that contested
    globalisation since the early 1990s and the echape charge that the War on Terror,
    in its never-ending iterations, is still repeating today. Nowadays, the weaponized
    and privatized security regime follows the networks of supply chains that cut
    across the logic of borders and became vital both for the global market and distribution
    (See, 2014). For US, the global politician, the inception of unnamed weaponry
    and all sorts of asymmetric technologies has reduced the human cost of war down
    to zero. By deploying drones and killer robots, it did away with the fundamental
    reality check of human casualties and made endless war politically plausible.


    Our 2003 decision carried hard consequences for the organization. In a capitalist
    society, one can either earn by relying on the market, or on the state, or on
    private funding. The USAID grant was our first large grant after the initial money
    from the Open Society Institute, and meant that we could employ some people from
    our community over the period of next two years. Yet at the same time, the USAID
    had become directly involved in Iraq, aiding the US forces and various private
    contractors such as Halliburton in the dissession and'
