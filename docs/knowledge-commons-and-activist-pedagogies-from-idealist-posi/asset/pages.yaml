    However, European hackers were rarely hanging out with critical digital culture
    crowds. This was not the place to extensively present the historical trajectory
    of different hacker communities, but a gross signification here is a very short
    generation. The earliest European hacker association was the German Computer Club
    founded in 1981. Already in the early 1980s, CCC started to publicly reveal (security)
    weaknesses of corporate and government computer systems. Their focus was on digital
    rights, privacy, cyberpunk/cybersecurity, and security issues over other forms
    of political activism. The CCC proved influential in raising issues, shaping public
    discussions from digital rights advocacy to political parties (such as Greens
    and Pirate Party). However, unlike the Italian and Spanish hackers, CCC did not
    merge with other social/political movements, integral to autonomist/anarchist,
    political and social movements, and they have much kept this tradition until the
    present day.


