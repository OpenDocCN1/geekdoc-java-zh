  md: '# CHAPTER 12


    and the economy was driven by enthusiasts, hobbyists, and amateurs, giving the
    development of (mainframe, micro and personal) computer its final historical blueprint.
    This story is written in canonical computing history books as The Computer Books
    Take Over: Computers, Programmers, and the Politics of Technical Expertise. There,
    Nathan Enssmenger (2010: 14) writes: "the term computer came to refer not simply
    to actual computer specialists but to the whole host of state, ambitious, and
    technologically inclined inclined experts that emerged in the cybernetic postwar
    period."


    Very few canonical computing books cover other histories. But when that happens,
    we learn a lot. Be that Gavin Genovich''s From Speak to Cybernetic (2002), which
    revisits the history of Soviet cybernetics, or Eden Medina''s Revolution, which
    revisits the history of socialist cybernetic project in Chile; or the recent book
    by Benjamin Peters Not to Network a Nation (2016), which covers the history of
    Soviet development of the Internet. Many (other) histories are yet to be heard
    and written down, diverse things come into view: geopolitics, class, gender, race,
    and many more.


    With their witty play and experiments with the media, the early days of the Internet
    were highly exciting but they were not much different from amateur artists and
    visions. A different-(than-usual) proximity of power enabled by the Internet allowed
    many (media-art) interventions (rebirth of) manifesto, (pseudo-institutions...
    In these times of the Internet''s history and geographical landscape, Eastern
    Europe played a very important part. Inspired by Alexei Shulman, Lev Manovich
    wrote "On Totalitarian Internet" (1996) where he famously addressed important
    differences between understanding of the Internet in the West and the East. For
    the West, interactivity, interaction were perfect vehicles for the ideas of democracy
    and equality. For the East, however, interactivity was merely another form of
    (media) manipulation. Years later, it seems that Eastern Europe was well prepared
    for what the Internet would become today.


    PJ & AS The dominant narrative of information and communication technologies is
    predominantly based in the United States. Silicon Valley is not the only game
    in town... What are the differences between approaches to digital technologies
    in the US and in Europe?


    MM & FM In the minutes of a rather different scene, which equally included the
    East Europe, was the centre of critical reflection on the Internet and its spontaneous
    ''Californian ideology'' (Barbour & Cameron, 1996). Critical culture in Europe
    and its ''countries'' in nation had had a very specific institutional landscape.
    In Western Europe, post-academic research in humanities was by far. In Eastern
    Europe, development of the civil society had been funded by various international
    foundations such as the Open Society Institute aka as the Soros Foundation. Critical
    new media and critical art scene played an important role in that landscape. A
    range of initiatives, medialabs, mailing lists, festivals and projects like Next5
    (Amsterdam- Rotterdam), Nettime & Syndicate (mailing lists), Backspace & Irrationalorg'
