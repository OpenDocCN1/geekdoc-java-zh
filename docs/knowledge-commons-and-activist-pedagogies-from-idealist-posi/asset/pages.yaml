    **PJ & AKS:** There has been a lot of work done under the 2000s. In a

    post-war country, Croatia has become an integral part of the European

    Union – with all associated advantages and problems. What are the today''s

    challenges in maintaining the Multimedia Institute and its various projects? What

    are your future plans?


    **MM & TM:** From the early days, Multimedia Institute/MaMa took a twofold

    approach. It has supported people working in and around the organization

    in their heterogeneous interests including but not limited to digital technology
    and

    information freedoms, politics and philosophy, contemporary digital art,

    music and cinema. Simultaneously, it has been strongly focused to social and

    institutional transformation.


    The moment zero of Croatian independence in 1991, which was marked by

    ethnic cleansing and forceful imposition of contrived mono-national identity,
    saw

    the progressive and modern culture embracing the political alternative of anti-

    movement. It is in these conditions, which excluded access to

    public resources, the Croatian civil society had developed throughout the

    1990s. To address this inequality and spatial resources to civil

    society, since 2000 we have been organizing collective actions with a number

    cultural actors across the country to create alternative routes for access to
    resources

    mutual support networks, shared venues, public funding, alternative forms of

    unding. All the while, that organizational work draws on understanding of commons
    from two sources – the social contract of the

    free software community, and the legacy of social ownership under socialism.


