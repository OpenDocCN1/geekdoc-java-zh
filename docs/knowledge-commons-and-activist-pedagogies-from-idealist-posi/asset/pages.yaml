  md: '# CHAPTER 12


    Ana Kuzmanić is an artist in Zagreb and Associate Professor at the Faculty of
    Civil Engineering, Architecture and Geodesy at the University in Split (Croatia),
    lecturing in drawing, design and architectural presentation. She is a member of
    the Croatian Association of Visual Arts. Since 2007 she has held more than a dozen
    individual exhibitions, and took part in numerous collective exhibitions in Croatia,
    the USA, Netherlands, Lithuania and Slovenia. Since 2011 she co-produced the international
    collective Eastern Surf, which has ‘organised, produced and participated in a
    number of projects including exhibitions, performance, video, sculpture, publications
    and web work’ (Eastern Surf 2017). Her artwork deconstructs social readings of
    reality. It tests traditional roles of artists and viewers, giving the observer
    an active part in creation of artwork, thus creating spaces of dialogue and alternative
    learning experiences as platforms for emancipation and social transformation.
    Grounded within a multidisciplinary conceptual framework, her artistic practice
    is produced via research and expression in diverse media located at the boundaries
    between reality and vitality.


    # ABOUT THE CONVERSATION


    I have known Marcell Mars since student days, yet our paths have crossed only
    sporadically. In 2013 I asked Marcell''s input about potential interlocutors for
    this book, and he introduced me to McKenzie Ward. In 2015, when we started working
    on our conversation, Marcell introduced Tomislav Medak. Marcell''s and Tomislav''s
    recent works are closely related to arts, so I requested Ana Kuzmanić''s input
    in these matters. Since the beginning of the conversation, Marcell, Tomislav,
    and I, occasionally discussed its generalities in person. The presented conversation
    took place in a shared online document between November 2015 and December 2016.


    # NET CULTURE AT THE DAWN OF THE CIVIL SOCIETY


    Petar Andrić & Ana Kuzmanić (PJ & AK): In 1999, you established the Multimedia
    Institute - mim (Multimedia Institute, 2016a); in 2000, you established the Net.culture
    club MaMa (both in Zagreb, Croatia). The Net.club MaMa has the following goals:


    To promote innovative cultural practices and broadly social activism. As a cultural
    center, it promotes wide range of new artistic and cultural practices realised
    in the first place to the development of communication technologies, as well as
    trends in arts and theory; from new media, film and music to philosophy and social
    theory, publishing and cultural policy issues.


    As a community center, MaMa is Zagreb’s alternative ‘living room’ and a venue
    free of charge for various initiatives and associations, whether they are promoting
    minority identities (ecological, LGBTQ, ethnic, and feminist'
