    # LOCAL HISTORIES AND GLOBAL REALITIES


    PJ & AK: Your interests and activities are predominantly centred around information
    and communication technologies. Yet, a big part of your social engagement takes
    place in Eastern Europe, which is not exactly on the forefront of technological
    innovation. Can you imagine the dynamics of working from the periphery around
    issues developed in global centres of power (such as the Silicon Valley)?


    MM & TM: Computers in their present form have been developed primarily in the
    Post-World War II United States. Their development started from the military need
    to develop mathematics and physics behind the nuclear weapons and counterdefense,
    but soon it was combined with efforts to account accounting, logistics and administration
    problems in diverse fields such as commercial air traffic, governmental services,
    banks and finances. Finally, this interplay of the military


