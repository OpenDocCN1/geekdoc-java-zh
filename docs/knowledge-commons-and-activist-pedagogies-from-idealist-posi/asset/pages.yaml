    **MM & TM:** We were not keen on continuing the line of work that the Multimedia
    Institute was doing under the Open Society Institute, which included other activities,
    setting up the first non-state owned Internet service provided by ZametNet. The
    lack of Internet access and computer hardware made us get online restless. We
    thought that it would be much more important to find a space where activists could
