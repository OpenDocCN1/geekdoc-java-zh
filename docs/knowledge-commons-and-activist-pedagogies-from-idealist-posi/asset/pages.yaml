    Conversation with Marcell Mars and Tomislav Medak (co-authored with

    Ana Kuzmanić)


    Marcell Mars is an activist, independent scholar, and artist. His work has been

    instrument in development of civil society in Croatia and beyond. Marcell is one

    of the founders of the Multimedia Institute – mi2 (1999) (Multimedia Institute,

    2016a) and Net.culture club MaMa in Zagreb (2000) (Net.culture club MaMa,

    2016a). He is a member of Creative Commons Team (Creative Commons,

    2016). He initiated GNI; GPL publishing label EGBOO Bits (Monoskop,

    2016a), meetings of technical social-sharing learning (Net.culture club MaMa,

    2016b) and various events and gatherings in the field of hackerism, digital

    hacking, free software philosophy, digital cultures, social software, semantic
    web

    et. In 2011-2012 regularly held talks and workshops at Hfing Class Studies at
    Jan Van

    Eyck in Maastricht, and in 2013 he held fellowship at Academy Schloss Stuttgart

    Leuphana Universität Leipzig


    Tomislav Medak is a cultural worker and theorist interested in political

    philosophy, media and aesthetics. He is an advocate of free software and

    free culture, and the Project Lead of the Creative Commons Croatia (Creative

    Commons, 2016). He works as coordinator of theory and publishing activities at

    the Multimedia Institute-MaMa and Net.culture club MaMa (2016).

    Tomislav is an active contributor to the Croatian Right to the Creative movement

    Pravo na grado, 2016). He interpreted to numerous books into Croatian language,

    including Multiple (Hardt & Negro, 2009) and A Hacker Manifesto (Work,

    2006). He is an author and performer and internationally acclaimed Zagreb-

    based performance collective BadCo (BadCo, 2016b). Tomislav writes and talks

    about politics of technology development, digital politics and aesthetics.


    Tomislav and Marcell have been working together for almost two decades.

    Their recent collaborations include a number of activities around the Public Library

    project'
