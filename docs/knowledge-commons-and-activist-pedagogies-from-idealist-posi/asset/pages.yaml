    (including space) for working together and presenting that work was a problem.
    MaMa was one of the three independent cultural spaces in Zagreb - capital city
    of Croatia, with one million inhabitants! The Open Society provided us with a
    former downtown leather-shop in the state of despair and equipped it with latest
    technology ranging from servers to DJ decks. These resources were made available
