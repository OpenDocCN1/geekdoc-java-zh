    together, however, we began to broaden these activities and explore various opportunities
    for political and cultural activism offered by digital networks. The early projects
    were ''Radioactive'' – an initiative bringing together a broad group of activists,
    which was supposed to result in a hybrid Internet/FM radio. The radio never came
    into being, yet the project fostered many follow-up activities around new media
    and activism in the spirit of the media, become media. In early days, our activities
