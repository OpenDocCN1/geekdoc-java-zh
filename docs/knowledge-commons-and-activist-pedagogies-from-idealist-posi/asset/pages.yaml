    others) or critically questioning established social norms. (Net.club club MaMa,
    2016a)


    Please describe the main challenges and opportunities from the Croatian civil
    society. Why did you decide to establish the Multimedia Institute – mi2 and the
    Net culture club MaMa? How did you go about it?


    **Marcell Mars & Tomislav Medak (MI & TM):** The formative context of our work
    had been marked by the process of dissolution of Yugoslavia, ensuring civil wars,
    and the rise of authoritarian nationalisms in the early 1990s. Amidst the turmoil
    and uncertainty factors would define what we consider today as civil society in
    the Croatian context. First, the newly created state of ethnic, social homogeneity
    was remained on the radical exclusion of minorities. Second, the newly created
    diversity existed under socialism. Third, the state pursued its own autonomy within
    the framework of capitalist democracy. Consequently, undesirable minorities and
    dissenting opposition were pushed to the fringes of society, and, in keeping with
    the democratic system, had to be allowed to legally operate existing in its loyalties
    and its nationalist consensus – civil society. Under the circumstances of inter-ethnic
    conflict, which pushed many people in direct or indirect danger, anti-war and
    human rights groups such as the Anti-War Campaign provided an umbrella under which
    political, student and religious all hues and colours could find a common context.
    It is also within this context that the high modernism of cultural production
    from the Yugoslavia period, driven out from public institutions, had its found
    and its consequence.


    Our collective, which would later come together around by two circumstances. The
    first was participation of the Anti-War Campaign, its BBS network ZaMiR (Monoskop,
    2016a) and in particular its journal Arkin, in the early European network culture.
    Second, the Open Society Institute which financed much of the alternative and
    oppositional activities during the 1990s, had started to wind down its operations
    towards the end of millennium. As the Open Society Institute started to spin off
    its diverse activities into organizations, giving rise to the Croatian Law Center
    for Center for Drama Arts, activities related to Internet development ended with
    the Multimedia Institute. The first factor was us-activists and early adopters
    of digital culture, and the second factor provided us with an organizational platform
    to start working together. In 1998 Marcell Mars had invited us to work with the
    Multimedia Institute. He invited Vedran Gulin and Todor Celakoski, who in turn
    invited other people, and the group grew to its present form.


    Prior to our coming together the Multimedia Institute, we have been working on
    various projects such as setting up the cyber-culture Laboratory in the space
    run by the artist initiative Labin Art Express in the former miner tower located
    in the north-western region of Istria. As we started working'
  merge: -1
