    # THE DOUBLE LIFE OF HACKER CULTURE


    **PJ & AK:** The Public Library project (Memory of the World, 2016a) is essentially
    pedagogical. When everyone is a librarian, and all books are free, living in the
    world transforms into the world - so The Public Library project is also essentially
    anti-capitalist. This brings us to the intersections between critical pedagogy
    of Paulo Freire, Peter McLaren, Henry Giroux, and others – the hacker culture
    of Richard Stallman, Linus Torvalds, Steve Levy, and others. In spite of various
    similarities, however, critical pedagogy and hacker culture disagree on some important
    points.


    With its deep roots in Marxism, critical theory insists on class analysis. But
    with the Californian ideology (Barbook and Cameron, 1996), the hacker culture
    is predominantly *individualist*. How do you go about the tension between individualism
    and collectivism in a hacker project? How do you balance these forces in your
    overall work?


    **MM & TMI:** Hacker culture has always lived a double life. Personal computers
    and the Internet have set up a perfect projection screen for a mind-set which
    understands autonomy as a pursuit of personal self-realization, and easily mds
    with entrepreneurial spirit as a front of liberty and unconditional freedom, and
    easily melds with the hegemonic narrative of hacker culture of the Silicon Valley.
    Therefore, it is hardly a surprise that individualism has become the hegemony
    of hacker and libertarian culture. Since the 1990s, the hacker culture has divided
    radically between radical individualism and mutualism. Fred Turner (2006), Richard
    Barbook and Andy Cameron (1996) have famously shown that radical individualism
    was built on freeling counterculture of the American hippie movement while radical
    mutualism was built on collective traditions of anarchism and Marxism. This is
    evident in the Free Software Movement, which has placed ethics and politics before
    economy and technology. In their ethnographic work, Bidia Coleman (2013) has shown
    that projects such as GNU/Linux and Debian have espoused radically collective
    endeavours. In regard, these projects stand close to mutualist, anarchist and
    communist projects where collective autonomy is the foundation of individual freedom.


    Our work stands in that lineage. Here, we invoke two figures – amateur librarian
    and custodian. These figures highlight the labor of communizing knowledge and
    maintaining infrastructures of access, refuse to leave the community to the authority
    of politics, and create openings where technologies and infrastructures are re-collectively
    and redistributed. In this context, we are aware of recent attempts to narrow
    hacker culture down to issues of surveillance, privacy and cryptography. While
    these issues are clearly important, they (again) reframe the hacker community
    through the individualist discourse of freedom and privacy, and more broadly,
    through the hegemonic discourse of the post-historical age of liberalism. In this
    way, the essential building blocks of the hacker culture – relations of production,
    relations of property, and issues of redistribution – are being drowned out,'
