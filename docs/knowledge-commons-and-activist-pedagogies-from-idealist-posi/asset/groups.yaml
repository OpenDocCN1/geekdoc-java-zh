    # THE SOCIAL LIFE OF DIGITAL TECHNOLOGIES


    PJ & AK: This brings about the old debate between technological determinism and
    social determinism, which never seems to go out of fashion. What is your take,
    as active hackers and social activists, on this debate? What is the role of (information)
    technologies in social development?


    # CHAPTER 12


    **MM & TM**: Any discussion of information technologies and social development
    requires the following parenthetical: notions used for discussing technological
    development are shaped by the context of parallel US hegemony over capitalist
    word-systems and the increasing role in the development of other information technologies.
    Today''s critics of the Internet are far from celebration of its liberal, democratizing
    potential. Instead, they feel almost reflexion over its instrumental role in the
    expansion of social control. Yet, the freedom of binary and control (Chan, 2008),
    characteristic of ideological frameworks pertaining to liberal capitalist democracies,
    is not enough to explain what has become evident with the creeping commercialization
    and concentration of market power in digital networks. Information technologies
    are no different from other general-poses which they depend - such as mass manufacture,
    logistics, or systems.


    Information technologies shape capitalism in return, capitalism shapes in technologies.
    Technological innovation is driven by interests of investors to profit from new
    commodity markets, and by their capacity to optimize increase productivity of
    other sectors of economy. The public has some influence over development of information
    technologies. In fact, publicly funded research and development have helped commercialize
    most of the fundamental building blocks of our present digital infrastructures
    ranging from microprocessors, touch-screens to packet switching networks (Mazzucato,
    2013). However, influence on commercially matured information technologies has
    become limited, driven by imperatives of accumulation and regulatory hegemony
    of the US.


    When considering the structures between technological development and larger social
    systems, we cannot accept the position of technological determinism - particularly
    not in the present of Forms of entrepreneurs, innovators and engineers who can
    solve the problems of the world. Technologies are shaped socially, yet the notion
    of social determination is unacceptable. The reproduction of social relations
    depends on contingencies of technological innovation, as the transformation of
    social relations depends on contingencies of actions by individuals, groups and
    institutions. Given the asymmetries that exist between the capitalist core and
    the capitalist periphery, which we hail, strategic uses of technologies as social
    change differ significantly.


    **PJ & Kc**: Based on your activist experience, what is the relationship between
    information technologies and democracy?


    **MM & TM**: This relation is typically discussed within the framework of communicative
    action (Habermas, 1984 [1981], 1987]) which describes how the to speak to the
    public has become radically democratized, how digital communication has coalesced
    into a global public sphere, and how digital communication has catalysed the power
    of collective mobilization. Information technologies have done all that - but
    the framework of communicative action describes only a part of the firstly.


    # KNOWLEDGE COMMONS AND ACTIVIST PEDAGOGIES


    Firstly, as Jodi Dean warns in her critique of communicative particularism (Dean,
    2005; also see Dean, 2009), the self-referential intensity of communication frequently
    ends up as a subtitle for the hard (and rewarding rewarding) work of political
    organization. Secondly, and more importantly, Internet technologies have created
    the "winner take all" markets and benefited highly skilled workforces while creating
    extreme forms of economic inequality (Brynjolfsson & McAfee, 2011). Then, in any
    list of world''s richest people, one can find inbound entrepreneurs from information
    technology sector. This feeds deeply into neoliberal transformation of capitalist
    societies, with growing (working and unemployed) populations left out of social
    welfare which need to be addressed and regulated. This is the structural problem
    behind liberal democracies, "Trumpism" (Byth, 2015). Intrinsic to contemporary
    capitalism, information technologies reinforce its contraptions and pave its unfortunate
    trail of destruction.


