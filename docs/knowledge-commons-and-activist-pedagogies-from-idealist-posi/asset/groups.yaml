    # 知识公社与行动主义教学法


    成功的制作人如 Zvuk broda、Blasko、Plazmatnick、Aeseq、No Name No Fame 和 Ghetto Booties 活跃在聊天群中，该机构定期举办
    DJ、音频编辑、VJ 演出、视频编辑，我们这些艺术家定期在学校举办工作坊，并举办我们的夏令营 Oktokultivar。这启发了我们开始研究版权制度的替代方案，以及我们所认为的自由知识与文化。


    PJ & AK： 公民社会是集体意识，它提供了对对抗国家和企业议程的杠杆，并作为强大的社会纠偏力量。因此，在美国入侵伊拉克之初，Net.culture club
    MaMa 拒绝了一项 10 万美元的 USAID 资助，因为那场入侵是：


    - a) 预先战争逻辑的一个先例，

    - b) 在无视国际社会正当程序的情况下进行的，

    - 以及 c) 是企业利益为了控制自然资源而进行的（Multimedia Institute, 2003，引自 Razza, 2015: 82）。


    然而，几周后，MaMa 接受了德国政府提供的 10 万美元资助——这引发了广泛的公众辩论（Razza, 2015; Kršić, 2003; Stubbs,
    2012）。


    现在局势已经冷静，你们对这场辩论有什么看法？更广泛地说，你们如何决定接受或拒绝哪些资金？你们如何决定在哪里发布、在哪里展览，以及与谁合作？在你们的工作，理想主义与务实主义之间是什么关系？


    MM & TM：面对那个历史时刻的后果，我们的决定似乎是微不足道的。美国及其盟友在 2003 年 3 月单方面入侵伊克的决定，体现了自 20 世纪 90 年代以来反对全球化的全球抗议运动的失败，反映了“反恐战争”在无休止循环中不断重复的逃避责任。如今，武器化和私有化的安全机制遵循着跨越边界逻辑的供应链网络，这对全球市场和分销都至关重要（见
    See, 2014）。对于美国这个全球政治力量来说，未命名武器和各种非对称技术的出现，将战争的人力成本降低到了零。通过部署无人机和杀手机器人，它消除了人员伤亡这一基本的现实检查，使无限战争在政治上变得可行。


    我们 2003 年的决定对组织产生了艰难的后果。在资本主义社会中，人们可以依靠市场、国家或私人资金盈利。USAID 资助是我们在获得开放社会基金会资金后的第一笔大额拨款，这意味着我们可以在未来两年内雇佣社区的一些成员。但与此同时，USAID
    已直接参与伊拉克事务，协助美军及哈利伯顿等各种私人承包商对伊拉克经济进行剥夺和掠夺。因此，继续接受他们的钱是不合良心的。考虑到道德和存在意义上的分量，退还资金的决定必须由我们协会的大会做出。


    那些失去工资的人是我们于 2000 年至 2003 年间建立的社区不可或缺的一部分，主要是通过 Otokutoliv 夏令营和 Summer Source
    营（Tactical Tech Collective, 2016）。我们晚些时候收到的另一笔资助由德国政府联邦基金会分配，而 USAID 的资金也是如此，因此他们为“城市权利”（Pravo
    no grad, 2016）铺平了道路。然而，我们仍然与那些决定无条件退款的人合作，并意识到在特定的经济、财务和历史背景下，做出评判可能会导致非政治性的错误。


    我们拥有一些不愿妥协的原则——我们确实与企业合作，我们在收入上是平等的，我们的活动是为了公共利益的。在政治活动中，理想主义立场只有在有效时才有意义。我们的理想主义是透彻且务实的。正是在这个世界里，我们唤起了图书馆的理想。我们深知现实比我们的理想复杂。然而，由理想激发的集体目标感可以转化为选择性行动。这是我们兴趣的核心。


    **PJ & AKS：** 21 世纪 00 年代做了很多工作。作为一个战后国家，克罗地亚已成为欧盟不可或缺的一部分——带有所有相关的优势和问题。今天维持多媒体学院及其各种项目面临的挑战是什么？你们未来的计划是什么？


    **MM & TM：** 从早期开始，多媒体学院/MaMa 采取了双重方法。它支持在组织及其周围的人的多样化兴趣，包括但不限于数字技术和信息自由、政治与哲学、当代数字艺术、音乐和电影。同时，它高度关注社会和制度转型。


    1991 年克罗地亚独立的零时刻，其以种族清洗和强制强加伪造的单一民族认同为特征，标志着进步和现代文化拥抱了反运动的政治替代方案。正是在这些排斥公共资源的条件下，克罗地亚公民社会在整个
    90 年代得到了发展。为了解决这种不平等并为公民社会提供空间资源，自 2000 年以来，我们一直在与全国的文化参与者组织集体行动，为获取资源创造替代路线、互助网络、共享场地、公共资金以及替代性的去资金化形式。在此过程中，组织工作借鉴于对“公社”的两种理解——自由软件社区，以及社会主义下社会所有制的遗遗产。


    ## 第一章 知识公社与行动主义教学法


    后来，在这一线上，工作已转向围绕空间正义和反对公共服务私有化的交叉性斗争（2007 年至今）（Pravo na grad, 2016）以及 2015 年。2016
    年，随着由主流派和激进派组成的短暂克罗地亚政府的出现，许多在过去十五取得了成就的机构似乎在几个月内就会瓦解。在写作期间，更广泛的社会和制度背景的崩溃再次成为一种迫在眉睫的威胁。从我们的角度来看，现状呼应了
    1990 年的南斯拉夫亚内战。然而，城市右转在结构上与新自由主义的竞底竞争和……战争的后果平行，被剥夺权的工人阶级恐惧移民，并坚持回归民族价值观。如果全球化没有提供任何东西，他们要在国家民族主义制度中寻求解决自身困境的方法？


    ## 历史与全球现实


    PJ & AK：你们的兴趣和活动主要集中在信息通信技术上。然而，你们的社会参与很大发生在东欧，那里并非技术创新的最前沿。你们能想象在边缘地区围绕全球权力中心（如硅谷）开发的问题进行工作的动态吗？


    **MM & TM：** 现代形式的计算机主要是在二战后的美国开发的。它们的发展始于军事对核武器和反防御背后数学和物理学的需求，但很快就与解决商业航空交通、政府服务、银行和金融等不同领域的会计、物流和管理问题的解决努力相结合。最后，这种军事的相互作用


