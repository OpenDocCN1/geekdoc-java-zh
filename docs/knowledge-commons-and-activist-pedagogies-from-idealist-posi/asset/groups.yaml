    ## CHAPTER 12


    the required skill level got too demanding, some original members left the group
    - yet, the community continues to accommodate geeks and freaks. At the other end,
    we maintain a theoretically inflected program of talks, lectures and publications.
    Here we invite a mix of upcoming theorists and thinkers and some of the most prominent
    intellectuals such as Jacques Rancière, Alain Badiou, Saskia Sassen and Robert
    Metta, creates a larger intellectual context, and articulation of certain ideas
    in public and popular mobilization, before also provides space for our collaborators
    in various activities.


    Our political activism, however, takes an altogether different approach. More
    often than, our campaigns are based on inclusive planning and direct decision
    making processes with broad audiences and the public. However such inclusiveness
    is inevitably undermined by a campaigning process that allows articulation. For
    instance, the Right to the City campaign against privatisation of the pedestrian
    zone in Zagreb''s Vlaška street (Pravo na grad, 2016), we tactically used media
    for more than a year discussing issues of urban development and mobilize more
    than 200 activists involved in the direct decision-making process and thousands
    of citizens in the cities. Its prerequisite is day-to-day work by a small group
    of people organized by the important collective Theodor Colakasi.


    **PJ & AK**: Your public pedagogy provides great opportunity for personal development
    - for instance (mostly) the Multimedia Institute have been instrumental in shaping
    our educational trajectories. Yet, we often tackle complex problems and theories,
    which means using complex concepts and language. Consequently, your public pedagogy
    is inevitably restricted to those who already possess considerable educational
    background. How do you balance the popular and the elite aspects of your public
    pedagogy? Do you intend to try and reach wider audiences? If so, how do you go
    about that?


    **MM & TM**: Our cultural work equally consists of more demanding and more popular
    activities, which mostly work in synergy. Our popular Human Rights Film Festival
    (2016) reaches thousands of people; yet, its highly selective nature (excludes)
    others. Our political campaigns are intended at scalability, too demanding and
    popular activities do not contradict each other. However, they require very different
    approaches and depend on different contexts and situations. In our experience,
    a wide public response to a social cause cannot be simple without messages or
    promoting causes in ways that are grounded in a broadly understanding, no matter
    its complexity, that a certain course of action has an actual capacity to transform
    a specific situation. Recognizing that moment, and acting tactfully upon it, is
    fundamental to building a broad political process.


    This can be illustrated by the co-authored with the aforementioned Custodians.online
    (2015) that we recently created with a number of fellow library activists against
    the injunction that allows Elsevier to shut down two most important repositories
    providing access to scholarly writing: Science Hub and Library Genesis. The letter
    is clearly a product of our collective work and dynamic. Yet, it clearly articulates
    various aspects of discontent around this impasse in access to knowledge, so it
    resonates with a huge number of people around the world and gives them a clear
    indication that there are many who disobey the global distribution of knowledge
    imposed by the likes of Elsevier.


    **PJ & AK:** Your work is probably best described by John Holloway''s phrase "in,
    against, and beyond the binary" (2002, 2016). What are the challenges of working
    under such conditions? How do you go about them?


    **MM & TM:** We could situate the Public Library project within the structure
    of tactical agency, where one famously moves into the territory of institutional
    power of others. By contesting this regulatory power of intellectual property
    over access to knowledge, we thus resist the appropriation of universal missions
    of different social institutions – public libraries, UNESCO, museums. They cannot
    operate in an economic system predicated on unequal distribution of means. Thus,
    while public libraries fail to deliver on their universalist promise, and have
    a mission to provide access to knowledge for all members of the society, they
    are severely limited in what they can do to accomplish this in the digital realm.
    By claiming the mission of universal access to knowledge for shadow libraries,
    collectively built infrastructures address the current state of affairs outside
    the territory of institutions. Indeed, these acts of commoning could be regarded
    as positioned beyond the state (Holloway, 2002, 2016).


    Yet, shadow libraries shift the perspective from "beyond" to "in and against!"
    we inhabit social realities that reflect uneven development in and between societies:
    powerful vs. powerless, institutional vs. tactical. Our space of agency is much
    more complex and blurry. These institutions and their employees resist imposed
    limitations, and understand that their spaces of action extend beyond institutional
    limitations. Accordingly, the Public Library project enjoys strong and unequivocal
    complexity of art institutions, schools and libraries for its activities and will.
    We collectively building practices that abolish the present state of affairs and
    reclaim the dream of universal access articulate the vision of a radically equal
    society equipped with institutions that can do justice to that "infinite demand"
    (Critchley, 2013). We are collectively pursuing collective dream – in words of
    our friend and our continuing inspiration Aaron Swartz: “With enough of us, around
    the world, we will not just send a strong message opposing the privatization of
    knowledge – we will make it a thing of the past. Will you join us?” (Swartz, 2008).

