    # 知识公有与行动主义教学法


    首先，正如 Jodi Dean 在对交流特殊主义的批评中所警告（Dean, 2005；另见 Dean, 2009），交流的自我指涉强度往往成为政治组织这项艰苦（且有回报的）工作的脚注。其次，更重要的是，互联网技术创造了“赢家通吃”的市场，并福了高技能劳动力，同时创造了极端的经济不平等（Brynjolfsson
    & McAfee, 2011）。然后，在任何世界富豪名单中，都能找到来自信息领域的企业家。这深度地影响了资本主义社会的新自由主义转型，使（工人阶失业）人口被排除在社会福利之外，这需要被解决和监管。这是自由民主背后的结构性问题，“特朗普主义”（Byth,
