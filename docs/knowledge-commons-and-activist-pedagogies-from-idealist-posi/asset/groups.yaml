    ## 第12章


    由于要求的技能水平变得过于严苛，一些原始成员离开了小组——然而，该社区继续接纳极客和奇才异。在另一端，我们维持着受理论影响的谈话、讲座和出版计划。在这里，我们邀请了新锐理论家、思想家，以及如雅克·朗西埃（Jacques
    Rancière）、阿兰·巴迪欧（Alain Badiou）、斯西娅·萨森（Saskia Sassen）和罗伯特·梅塔（Robert Metta）等最著名的知识分子，创造了更大的知识背景，并在公共和大众动员中阐述某些观点，同时也为我们在各种活动中的合作者提供了空间。


    然而，我们的政治行动采取了完全不同的方法。我们的活动更多地基于包容性规划以及与广泛观众和公众的直接决策过程。然而，这种包容性不可避免地被允许表达的活动过程所削弱。例如，在反对萨格别布Vlaška街步行区私有化的“城市权利”运动（Pravo
    na grad, 2016）中，我们在战术上利用媒体了一年多来讨论城市发展问题，并动员了200多名参与直接决策过程的活动人士以及城市中的数千名公民。其前提是由重要的集体组织Theodor
    Colakasi组织的小组人员进行的日常工作。


    **PJ & AK**: 你们的公共教学为个人发展提供了巨大机会——例如（主要是）多媒体学院在塑造我们的教育轨迹方面发挥了关键作用。然而，我们经常处理复杂的问题和理论，这意味着要使用复杂的概念和语言。因此，你们的公共教学不可避免地局限于那些已经拥有深厚教育背景的人。你们如何平衡你们公共教学中的大众化和精英化方面？你们打算尝试接触更广泛的观众吗？如果是，你们打算怎么做？


    **MM & TM**: 我们的文化工作同样由更具挑战性和更具大众性的活动组成，这些活动大多发挥协同作用。我们的大众人权电影节（2016）触及了数千人；但其高度选择性的性质也（排除了）其他人。我们的政治运动也旨在具有可扩展性，高挑战性的活动和大众化的活动并不矛盾。然而，它们需要非常不同的方法，并取决于不同的背景和情况。根据我们的经验，公众对社会事业的广泛响应，如果没有信息，或者不以一种基于广泛理解的方式来推广事业（无论其复杂性如何，即某项行动具有转化特定状况的实际能力），将是不可能简单的。意识到这一刻并机敏地采取行动，是建立广泛政治过程的基础。


    这可以通过我们最近与上述Custodians.online（2015）共同合著的文章来说说明，我们与几位同事图书馆活动人士一起创建了该文章，以反对允许爱思唯（Elsevier）关闭两个提供学术写作访问最重要的库的禁令：Science
    Hub和Library Genesis。这封信显然是我们集体工作和动态的产物。然而，它清楚地阐述了对这种知识获取僵局的各种不满满，因此它与全球许多人产生了共鸣，并给了他们一个明确的信号，即有很多人不服从爱思唯之类的机构强加的全球知识分配。


    **PJ & AK:** 你们的工作可能用约翰·霍洛威（John Holloway）的话“在……之中、反对……以及超越二元论”（2002, 2016）来描述最为准确。在这种情况下工作的挑战是什么？你们如何应对这些挑战？


    **MM & TM:** 我们可以将公共图书馆项目置于战术机构的结构中，在这种结构中，人们通常会进入他人机构权力的领土。通过反对知识产权对知识获取的这种监管权力，我们抵制对不同社会机构——公共图书馆、联合国教科文组织（UNESCO）、博物馆的普遍使命的侵占。它们无法在一个以资源不平等分配为前提的经济体系中运行。因此，虽然公共图书馆未能实现它们的普遍主义承诺，并肩负为所有社会成员提供知识访问的使命，但它们在数字领域内实现这一目标的方面受到了严重限制。通过声称影子图书馆（shadow
    libraries）普遍访问知识的使命，集体构建的基础设施解决了机构领土之外的现状。事实上，这些共有化（commoning）行为可以被视为置于国家之外（Holloway,
    2002, 2016）。


    然而，影子图书馆将视角从“超越”转向了“在……之中并反对……！”我们居住的社会现实反映了社会内部以及社会之间不平衡的发展：强大对弱势、机构对战术。我们的代理空间要复杂得多且模糊得多。这些机构及其员工抵制强加的限制，并理解他们的行动空间延伸到了机构限制之外。因此，公共图书馆项目因其活动和意志，享有艺术机构、学校和图书馆的强大且明确的复杂性。我们集体构建废除现状并夺回普遍访问梦想的实践，阐述了一个激进平等社会的愿景，配备了能够公正对待那种“无限需求”的机构（Critchley,
    2013）。我们正在共同追求集体梦想——用我们的朋友和持续的灵感艾伦·斯沃茨（Aaron Swartz）的话来说：“只要范围内有足够的人，我们不仅会发出一个反对知识私有化的强力信号——我们将使其成为过去。你加入我们吗？”（Swartz,
    2008）。


