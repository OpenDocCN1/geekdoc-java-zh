    # 第 12 章


    这种经济是由爱好者、爱好者和业余者驱动的，为（大型机、微型和个人）计算机的发展提供了最终的历史蓝图。这个故事在经典的计算机历史书中被记录为《计算机接管世界：计算机、程序员与技术专家的政治》。在那里，内森·恩斯梅格（2010:
    14）写道：“‘计算机’一词不再仅仅是指实际的计算机专家，而是指战后控制论时期出现的一系列具有国家背景、野心勃勃且倾向于科技的专家。”


    极少有经典的计算机书籍涵盖其他历史。但当这种情况发生时，我们学到了很多东西。无论是加文·格诺维奇（Gavin Genovich）的《从言说到控制论》（2002），它回顾了苏联控制论的历史；还是埃登·梅迪纳（Eden
    Medina）的《革命》，它回顾了智利社会主义控制论项目的历史；或者是本杰明·彼得斯（Benjamin Peters）最近的新书《不联网的国家》（2016），涵盖了苏联互联网的发展史。许多（其他）历史仍待被发现和记录，多元化的事物进入了视野：地缘政治、阶级、性别、种族等等。


    凭借他们幽默的玩法和对媒体的实验，互联网早期非常令人兴奋，但它们与业余艺术家和愿景并没有太大区别。互联网实现的这种不同于寻常的权力接近性，使得许多（媒体艺术）干预、（宣言的重生）、、（伪机构……）成为可能。在互联网的历史和地理格局的这些时期，东欧发挥了非常重要的作用。受阿列克谢·舒尔曼（Alexei
    Shulman）的启发，列夫·马诺维奇（Lev Manovich）写了《关于极权主义互联网》（1996），他在书中著名的指出了西方和东方对互联网理解的重大差异。对于西方来说，交互性和互动是民主和平等理念的完美载体。然而，对于东方，交互性仅仅另一种形式的（媒体）操纵。多年后，东欧似乎为互联网变成今天的样子做好了充分准备。


    PJ & AS 信息和通信技术的主导叙事主要基于美国。硅谷并非唯一的竞技场……美国和欧洲在数字技术方法上有何区别？


    MM & FM 在一个相当不同的场景中（其中也包括东欧），那里是对互联网及其自发的“加利福尼亚思想”（Barbour & Cameron, 1996）进行批判性反的中心。欧洲的批判性文化及其在国家内部内部具有非常特定的制度格局。在西欧，人文科学的学术后研究占据主导地位。在东欧，公民社会的发展由各种国际基金会资助，例如开放社会协会（又称索罗斯基金会）。批判性新媒体和批判性艺术场界在这一格局中发挥了重要作用。一系列倡议、媒体实验室、邮件列表、节日和项目，如
    Next5（阿姆斯特丹-鹿特丹）、Nettime & Syndicate（邮件列表）、Backspace & Irrational.org（伦敦）、Ljudmila（卢布尔雅那）、Rixe（里加）、C3（布达佩斯）等，构成了一个研究人员、理论家、艺术家、活动家和其他文化工作者组成的松散网络。


    这个网络远不仅限于欧洲。它与美国的项目和倡议联系紧密，如批判性艺术联盟（Critical Art Ensemble）、Rhizome 和 Net；与萨热窝的项目，以及恰亚帕斯州萨帕蒂人的斗争。该网络的一个重要特征是它与欧洲各种节日和机构的良好关系，例如文献展（卡塞尔）、Multimedia/HK（柏林）或电子艺术节（Ars
    Electronica，林茨）。


    然而，欧洲的黑客很少与批判性数字文化群体混在一起。这里不是广泛介绍不同黑客社区历史轨迹的地方，但这里的一个大致意义是一个非常短的代际。最早的欧洲黑客协会是
    1981 年成立的德国计算机俱乐部（CCC）。早在 20 世纪 80 年代，CCC 就开始公开公司和政府计算机系统的（安全）漏洞。他们的重点是数字权利、隐私、赛博朋克/网络安全以及安全问题，而非其他形式的政治活动。CCC
    在提出问题方面证明了自己的影响力，塑造了从数字权利倡导到政党（如绿党和海盗党）的公共讨论。然而，与意大利和西班牙黑客不同，CCC 没有与其他社会/政治运动融合，没有融入自治主义/无政府主义、政治和社会运动中，他们一直保留着这一传统直到今天。


    P&J AC: 你如何将这一分析扩展到东欧和前南斯拉夫地区，这些地区黑客文化的独特特征是什么？


    （注：提供的 OCR 文本包含跨页的重复章节。我已合并了独特的叙事流以提供一个连贯的文档。）

