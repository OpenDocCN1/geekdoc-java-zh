    formalizing and writing down textbooks and curricula, and finally by asking the
    society to see its benefit in acknowledging the discipline, its practitioners
    and practices as a separate profession – giving it the green light to create its
    departments and eventually joining the productive forces of the world. This demonstrated
    knowledge led to the professionalization of science.


    Another frequent reference is storytelling is the history of the work of computer
    programmers plays an important role (Ensmenger, 2010: 14; Krajewski, 2011). Mark
    Krajewski in his great book Paper Machines (looking back on the card catalog as
    an analysis that for ourselves an epistemic tool), introduced a thought-provoking
    idea of the logical equivalence of the developed index card catalog and the Turing
    machine, thus making the library the vanguard of the computing. Finding that the
    professionalization of computing better explains the challenges of today''s librarianship
    and tensions between the academic and professional librarians.


    The world recognized the importance and potential of computer technology much
    after computer science became an economy in the academia. In 1965 the Association
    for Computing Machinery (ACM) had decided computer science first to struggle and
    go through its own historical phase of boundary-work. In fact, the field gained
    its definition before Donald Knuth and his colleagues established the algorithm
    as the principle unit of analysis in computer science in the first volume of Knuth''s
    canonical The Art of Computer Programming (1968). Once the algorithm was positioned
    as the main unit of study of computer science, it served as the basis for ACM''s
    ‘Curriculum ''68’ (Atkinson et al., 1968), the path was paved for the future departments
    of computer science in the industry.


    PJ & AK: What are the consequences of these for computer science education?


    MM & TM: Not everyone was happy with the algorithm''s central position in computer
    science. Furthermore, since the early days, computer industry has been complaining
    that the university does not provide students with practical knowledge. In 1968,
    for instance, IBM researcher Hackman said:


    new departments of computer science in the universities are too busy teaching
    Simon-pure courses in their struggle for academic recognition to pay serious time
    and attention to the applied work necessary to educate programmers and systems
    analysis for the real world, (in Ensmenger, 2010:133)'
