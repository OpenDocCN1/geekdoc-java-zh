    # 第 12 章


    “与 Library Genesis 和 Sci-Hub（Custodians.online, 2015）并肩，因为非营利性出版商（Elsevier, Springer,
    Wiley-Blackwell, Taylor & Francis）拥有超过一半的现有学术材料数据库，而这些数据库的许可费用高得令人愤慨，以至于全球北方最富有的大学——哈佛大学也抱怨无法无法负担。JSTOR
    前主管罗伯特·达顿（Robert Darton）曾说：我们促进研究、撰写论文、在编辑委员会上进行评审，这一切都是免费的……然后我们却以离谱的价格支付我们劳动的成果。’


    尽管有公共资金支持了这些惠及学术出版的工作，尽管有维护其合法性的同行评审，但期刊文章的价格使得全球大多数人以及所有非学术人士无法获取科学知识，并使其成为一种特权的象征（Custodians.online,
    2015）。


    **PJ & AK：** 请描述反对这些理想形态的斗争策略。我们的主要优势和劣势是什么？


    由全球统一的知识产权制度监管的知识获取、维护和分发领域，带来了巨大的经济、社会、政治和制度危机以及僵局。因此，我们需要重新审并思考我们的政治、策略和战术。也许我们可以从自由软件的世界中寻找灵感，在那里，共同努力、勇气和魅力能够构建工具和基础设施。然而，这种模型可能无法应对知识生产和传播所面临的整个危机范围。“Tivo
    化（tivozations）”、‘围花园’、‘软件服务’等带来了利用基于公社的同行生产的问题。


    此外，建立替代方案以主导权力模式的这种权利感，只能通过挑战来应对。相比之下（资本主义的）边缘依赖于‘偷取’策略，并通过绕过社会经济障碍，拒绝服从设定全球经济交换框架的统一监管。如果我们回首并比较改革主义社区的成功和成就，显而易见，争取知识获取的斗争之所以仍然活跃，很大程度上是因为产权的存在。


    **PJ & AK：** 这使我们面对反对（知识）私有财产的斗争。这场斗争的主要项目有哪些？你们如何看待它们？


    **MM & TM：** 许多应对知识获取危机的项目源于东欧。例如 Library Genesis、Science Hub、Monoskop 和 Memory
    of the World。巴拉兹·博多（Baláz Bodó, 2016）探讨了 Library Genesis 的伦理，以及所有项目中共同的信念：即私有财产的概念不应被视为理所当然。私有财产可以且应该被永久地质疑、挑战和谈判。面对人为稀缺（如由于数字网络背景下知识产权导致的知识获取匮乏）或对稀缺基本人类资源的自私投机（如与住房、水或水滨开发相关的问题）时，尤其如此（Mars,
    Medak, & Sekuli, 2016）。


    # 知识公社与行动主义教学


    挑战产权制度的斗争曾是自由软件运动的前沿。在近期一系列令人瞩目的事件中，对电子通信进行大规模控制和监控的揭露带来了新的英雄（马歇、斯诺登），而黑客再次被还原为英雄式的赛博朋克法外之徒。这种模式熟悉的旧冷战范式：我们（好人）对他们（坏人）。然而，只有极少数才华的人才能精通密码学、遵循严格的安全协议、实施反控制并制造信息泄露。出乎意料的是，这些人通常是白人、英语母语者。这种‘我们’的叙事未必是最能赋权的，我们认为这是一种挑战整个产权制度的互补策略。正如我们写给
    Custodians.online 的信中所说：


    我们发现自己处于一个决定性的时刻。现在是时候承认我们知识公社的存在本身就是一种集体不服行为。现在是时候从隐藏中出来，并在这一抵抗行为之后采取行动。你可能感到孤立，但我们有许多人。在互联网上发出的对失去图书馆基础设施的愤怒、抑郁和恐惧并未白费。现在是时候我们这些守护者——无论是狗、人类还是半机械人，带着我们的名字和笔名——发出我们的声音了。分享你们的写作——将书籍数字化——上传你们的文件。不要让我们的知识被粉碎。关注图书馆——关注元数据——关注备份。（Custodians,
    2015）


    # 从公民不服到公共图书馆


    **PJ & AK：** 起于 2012 年。公共图书馆项目（Memory of the World, 2016）是反对知识商品化斗争的重要部分。这个项目是关于什么的；它是如何产生的？


    **MM & TM：** 公共图书馆项目开发并确认了在数字领域反对当前知识和文化生产及循环监管的大规模不服从情景。2012 年，它在发达世界的边缘学习和学习地区产生了广泛共鸣。这一切随着书籍共享网站
    library 的出现，产生了一种焦虑，即盗版带来的均衡效应将会实现。随着 library 的出现，一个事实——即最新、最相关的知识（终于）不再是全球西方少数国家富有学术机构的特权，和/或学术界的专属保留——就此消失于无形。无疑，来自深层半边缘的各种替代方案迅速填补了空白。然而，尽管每天面临着诉讼，它们仍然持续存在，这几乎是一个奇迹。


