    # 知识公社与行动主义教学法


    数字领域知识的商品化为学术出版商带来了巨额利润。为了应对这些局限性，许多项目应运而生，通过非法手段维护公共利益。


    **PJ & AK:** 你能提供这些项目的简短历史谱系介绍吗？


    **MM & TM:** Ubu 成立于1996年，是最早的在线仓库之一。随后在2009年，Textz.com 合并了批判理论文本的馆藏。在 Textz.com
    于2004年初关闭后，Aaaarg 和 Monikos 又在一年后相继出现。在2000年代后期，Gigapedia 开启了另一条不同的轨迹，提供全面的访问权限。Gigapedia
    是一个规则的改变者，因为它让成千上万的学者以及大型语料库变得可用，而不再局限于那些在全球南方机构中工作或学习的人士。2012年，出版行业关停了 Gigapedia（当时它被称为
    Library.nu）。幸运的是，由此产生的真空并没有持续太久；Library.nu 仓库合并了 Library Genesis 的馆藏，这些馆藏源于苏联学者的遗产，他们发明了影子生产的方式，并通过地下出版（samizdat）形式和后苏联时期的数字分发创造了知识（Balázs,
    2014）。Library Genesis 建立了稳健的基础设施，其使命是提供当时唯一的在线图书馆服务，同时保持低调。它的姐妹项目 Project Hub
    提供了学术期刊的访问权限。这两个项目正面临最大的学术出版商 Reed Elsevier 的关闭。与公共图书馆项目放在一起，它们阐述了一种公民不服从的立场。


    **PJ & AK:** 请详述公民不服从的立场。它是如何运作的？在什么情况下是正当的？


    **MM & TM:** 限制性话语明确声称，影子图书馆属于非商业性免费使用的范畴。这些论点无疑是有效的，但并未为捍卫知识公社建立特别坚固的基础。因此，一旦它们受到攻击，影子图书馆通常会被关闭。因此，在我们对集体不服从的号召中，我们想要扩大这个阶级。如果我们——遍布全球范围内发达国家的学者和非学者——不创造出我们参与生产和学习的知识获取方式，那么作为普遍生存条件的知识获取就不可能存在。通过引入自由，我们正在颠覆所有权的概念。引用《小王子》的话说，拥有某样东西时，知道你拥有它是很有用的（Saint-Exupéry,
    2015）。监护者是反抗性关怀工作的政治主体。


    分享、下载的实践是海量的。既然如此，我们需要防止知识被反复夺走，我们需要公开且集体地支持我们的反抗行为。我们不应该落入关于我们实践的合法或非合法的辩论陷阱。相反，我们应该承认，我们被视为非法的实践在面对全球北方与全球南方之间机会不均、在面对教育商业化时，在政治上是正当的。


    # 第12章


    在全球北方的教育与反抗中……这就是公民不服从的意义——为打破不公正的法律承担责任。


    **PJ & AK:** 我们理解你们对辩论合法性不感兴趣——尽管如此，法律服务对你们的工作非常感兴趣。例如，Marcell 参与了一起与 Aaaaa 相关的版权权诉讼。请描述道德义务与你们（公共）参与之间的关系。在何时、在什么情况下，个人的道德行为可以证明违约的正当性？


    **MM & TM:** Marcell 最近被卷入一起针对 Aaaaa 侵犯版权的诉讼。Marcell 是 Aaaaa 的创始人，该是一个被许多从大学到大陆级规模的机构使用的整合性组织。他声称一家来自魁北克的小型出版商对安德烈·巴赞著作《电影是什么什么？》（1967年）的译文被一名未知用户两次扫描并上传到了
    Aaaaa。该书被移除是因为原告获得了一个下架通知，导致了数百万美元的赔偿，但尽管如此，这些金额仅为 500 加元。如果 Aaaaa 无法根据合理使用的原则捍卫自己的生存，一个宝贵的资源将会消失，而创始人将付出高代价。在这场诉讼中，讽刺的是，几乎没有经济利益。但许多较小的出版商收购了教育领域的碎片，导致学生们几乎没有钱买书，以及学术出版的迅速集中。例如，Taylor
    and Francis 收购了较小的人文类出版商 Ashgate 并在几个月内关闭了它（Ashgate 出版已专利化）。


    学术出版体系是破产的。它将科学和教育的公共资金抽入私人利润，同时拒绝为其生产者提供丰厚的薪水和获取机会。这种商业模式是合法的，许多政府也认同这一结论——然而，由于旧出版模式传承的根深权力及其与学术声望的结合，情况无法轻易改变。因此，这种模式的持续存在就是一种公民不服从。


    **PJ & AK:** 公共图书馆项目（《世界记忆》，2016a）在包含美术馆在内的各种公共领域运营。你们是如何决定在艺术语境下开发“公共图书馆项目”的？你们如何看待艺术与政治的关系？


    **MM & TM:** 我们想要轻松地将政治与美学联系起来。此外，当一件艺术品表达政治特征时，它寻求认可和赞赏。然而，艺术的反思性特征与现实并非完全政治化。反思性的艺术仍然是一种独立的行动形式，它遵循着不同的逻辑运作。它需要集体动员和社会转型。尽管如此，反思性的批判性艺术无法脱离当下，无法存在于政治空间之外。在艺术世界中，现有的感官和现实可以被阐述而不需要过度关注一致性和可行性。由于行动主义通常留给不受限制的空间较少，它需要产生真实的影响。


    在 WHW（2016）的慷慨支持下，“公共图书馆项目”出人意料地受到了艺术界的欢迎，这为我们提供了一个平台，以完善项目的论点并确定其诉求的合法性。该项目曾在格拉雅维纳的一些顶级场所展出，包括马里德的索菲亚王中心、斯图加特的军艺术协会、贝贝鲁特的
    9 Weeks、卢布尔雅纳的当代美术博物馆 Metlak，以及伦敦的 Calvert 22 展馆。拥有一个让艺术家可以探索其他机构认为具有风险的问题的舞台是极好的。然而，例如，格拉雅维纳大学的教学和研究严重取决于其教师和学生从我们认为非法的来源获取书籍和期刊，因此大学需要为他们采取立场。在教育商业化和自由受侵的世界里，期望大学支持我们是非常不可能的，但并非不可能。这最近在苏黎世艺术学院得到了证实，该学院现在为学生和教师提供了类似
