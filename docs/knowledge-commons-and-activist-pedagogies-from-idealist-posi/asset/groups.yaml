    # 知识公有与行动主义教学法


    公有许可（主要在限制商业使用和（改编）的方面）允许新的策展人共享和聚合相关内容，并让《时代》杂志声称“你”（意味着“我们所有人”）是年度人物（*Time Magazine*，2006年）。


    PJ & AK: 请请描述自由软件运动与激进资本主义的硅谷初创文化之间的相互作用，并将其置于软件开发政治经济的大背景下。这对黑客运动产生了什么后果？


    MM & TM: 在2008年经济危机之前，在短短几年内，大多数此类初创公司和服务都被卖给了商人，他们旨在将这些平台、用户和服务变现化（主要通过广告），或将他们挤出（主要通过Facebook的指数级增长以及由于“魔法般的”网络效应而关闭的服务，尤其是那些来自雅虎的服务）。尽管如此，“黄金”初创时期带来了一种巨大的信念浪潮，认为由个人天才或集体（即群众）培养的创业精神可以拯救世界。在那段时期，意料之的是，黑客中心/空间的理念扩张了。


    奇妙的（自我复制的快速原型、3D打印机、2D机器人、DIY，以及物联网开始与（年轻）制造者产生共鸣，并将全世界视为首要任务）。遗憾的是（当时的）GNU GPL
    停止了授权，狂热的自由软件基础设施被视为理所当然，而在巨人的肩膀上跳舞变成了最流行的做法。通过对现有的服务单元进行重新品牌化（finger > twitter，ire
    > slack，talk > im），并设计用户体验的“最后一公里”（通常是像在转角增加圆角一样具有病毒式传播的按钮），会创建一个幻灯片式的推销方案，但从未获得过天使投资者的支持，并希望在效应（s）的游戏中获胜。


    通常情况下，运行这些项目的软件栈会（总是）完全遵循 GNU GPL（服务器 > ），部分在 Gnu 上共享（因为在底层是“真实”的而被允许）的内容将保持封闭状态。通过这种方式，项目将从公有世界转向商业领域。为了尊重开源社区并保持“良好公民”的声誉，软件开发人员可能会将源代码发布在
    GitHub 上——这是这种良好运作的典型范例。这将黑客运动从对产权的真正政治挑战，转变为一种科幻式的幻想，即在共享知识的同时保持黑客的精英治国制度可以解决世界上所有的问题——只要我们这些黑客被留下来玩游戏、优化、创新并创造出那种持久的技术！


    # 数字技术的社会生活


    PJ & AK: 这引发了技术决定论与社会决定论之间的老争论，这种争论似乎从未过时。作为活跃的黑客和社会行动主义者，你们对这场争论何看法？（信息）技术在社会发展中扮演什么角色？


    # 第12章


    **MM & TM**: 任何关于信息技术和社会发展的讨论都需要加上以下括号说明：用于讨论技术发展的概念受到美国对资本主义世界体系平行的霸权背景，以及其他信息技术在发展中日益增长的作用的影响。今天对互联网的批评者远不是在庆祝其自由的、民主化的潜力。相反，他们几乎在对其在扩张社会控制中的工具性作用进行反思。然而，二进制的自由与控制（Chan,
    2008）作为自由资本主义民主国家意识形态框架的特征，不足以解释数字网络中日益渗透的商业化和市场权力集中所变得显而易见的问题。信息技术与其依赖的其他通用目的没有区别——例如大众制造、物流或系统。


    信息技术反过来塑造了资本主义，资本主义也塑造了技术。技术创新是由投资者从新商品市场中获利的利益驱动的，并由他们优化增加经济其他部门生产能力的能力驱动。公众对信息技术的发展具有一定影响。事实上，公共资助的研发帮助了我们目前数字基础设施的大多数基础模块的商业化，范围从微处理器、触摸屏到数据包交换网络（Mazzucato,
    2013）。然而，对商业上成熟的信息技术的影响已变得有限，这受到积累紧迫性和美国监管霸权的驱动。


    在考虑技术发展与更广泛社会系统之间的结构时，我们不能接受技术决定论观点——特别是在存在能够解决世界问题的企业家、创新者和工程师的情况下。技术是被社会化塑造的，但社会决定论的概念是不可接受的。社会关系的再生产取决于技术创新的偶然性，正如社会关系的转型取决于个人、团体和机构行动的偶然性。鉴于我们所称的资本主义核心与资本主义边缘之间存在的不对称性，作为社会变革的技术策略使用存在显著差异。


    **PJ & Kc**: 根据你们的行动主义经验，信息技术与民主之间是什么关系？


