    Our starting point for the Public Library project is simple: public library is
    the institutional form devised by societies in order to make knowledge and culture
    accessible to all its members regardless of their social or economic status. There
    is a political consensus across the board that this principle of access is fundamental
    to the purpose of modern society. Only educated and informed citizens are able
    to claim their rights and fully participate in the common good. As digital networks
