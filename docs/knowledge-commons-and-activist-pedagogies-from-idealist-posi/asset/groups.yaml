    ## 第 12 章

    ## 黑客文化的双重生活


    **PJ & AK:** 公共图书馆项目（《世界记忆》，2016a）本质上是教法性的。当每个人都是图书员，且所有的书籍都是免费的，生活在世界上就转变为改变世界——因此，公共图书馆项目本质上也是反资本主义的。这引导我们走向了保罗·弗雷雷（Paulo
    Freire）、彼特·麦克伦（Peter McLaren）、亨利·吉鲁克斯（Henry Giroux）等人的批判教育学与理查德·斯托曼（Richard Stallman）、林斯·托瓦尔斯（Linus
    Torvalds）、史蒂·列维（Steve Levy）等人的黑客文化的交叉点。然而，尽管存在许多相似之处，批判教育学与黑客文化在某些重要点上并不一致。


    批判性理论深根于马克思主义，强调阶级分析。但受加州意识形态的影响（Barbook and Cameron, 1996），黑客文化主要是*个人主义*的。在黑客项目中，你如何处理个人主义与集体主义之间的紧张关系？在你的整体工作中，你如何平衡这些力量？


    **MM & TMI:** 黑客文化一直过着双重生活。个人电脑和互联网为一种心态提供了完美的投影屏幕，这种心态将自主性理解为对自我实现的追求，并能轻松地与创业精神融合，将其作为自由和无条件自由的前沿；同时也又轻松地与硅谷黑客文化的霸权叙事融合。因此，个人主义成为黑客和自由意志主义文化的霸权并不意外。自
    20 世纪 90 年代以来，黑客文化在激进个人主义和互助主义之间发生了彻底的分化。弗雷·特纳（Fred Turner, 2006）、理查德·巴布克（Richard
    Barbook）和安迪·卡梅隆（Andy Cameron, 1996）指出，激进个人主义建立在美国嬉皮运动的自由反文化之上，而激进互助主义建立在无政府主义和马克思主义的集体传统之上。这在自由软件运动中显而易见，该运动将伦理和政治置于经济和技术之前。在他们的民族志工作中，比迪亚·科尔曼（Bidia
    Coleman, 2013）展示了 GNU/Linux 和 Debian 等项目拥护了激进的集体努力。对此，这些项目非常接近互助主义、无政府主义和共产主义项目，集体自主是个人自由的基础。


    我们的工作正处于这一脉络之中。在这里，我们援引了两个形象：业余图书员和守护者。这些形象凸显了知识公有化和维护访问基础设施的劳动，拒绝将社区交给政治权威，并创造了技术和基础设施被重新集体化收集和重新分配的缺口。在这种背景下，我们注意到最近有人试图将黑客文化缩小为监控、隐私和密码学问题。虽然这些问题显然非常重要，但它们（再次）通过自由和隐私的个人主义话语重新构架了黑客社区，更广泛地说，是通过自由主义后历史时代的霸权话语重新构架了它。通过这种方式，黑客文化的本质组成部分——生产关系、所有关系和再分配问题——正被淹没。


