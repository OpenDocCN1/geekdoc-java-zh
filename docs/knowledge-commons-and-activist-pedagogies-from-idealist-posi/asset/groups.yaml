    # 知识公地与行动主义教学：从理想主义立场到集体行动


    与 Marcell Mars 和 Tomislav Medak 的对话（与 Ana Kuzmanić 合著）


    Marcell Mars 是一位活动家、独立学者和艺术家。他的工作对克罗地亚及其他地区社会的发展起了重要作用。Marcell 是多媒体学院 – mi2 (1999)（Multimedia
    Institute, 2016a）和萨格勒布 Net.culture club MaMa (2000)（Net.culture club MaMa, 2016a）的创始人之一。他是知识共享许可团队（Creative
    Commons Team, 2016）的成员。他发起了 GNI；GPL 出版标签 EGBOO Bits（Monoskop, 2016a）、技术社会共享学习会议（Net.culture
    club MaMa, 2016b）以及黑客主义、数字黑客、自由软件哲学、数字文化、社会软件、语义网等领域的各种活动和聚会。2011-2012年间，他定期在马斯特里赫的扬·范·艾克学院
    Hfing Class Studies 主讲座和工作坊，2013年在莱比锡大学斯图加特大学学院担任研究员。


    Tomislav Medak 是一位文化工作者和理论家，对政治哲学、媒体和美学感兴趣。他是自由软件和自由文化的倡导者，克罗地亚知识共享（Creative Commons
    Croatia, 2016）的项目负责人。他在多媒体学院-MaMa 和 Net.culture club MaMa 担任理论和出版活动协调员（2016）。Tomislav
    是克罗地亚“创意创作权”运动（Pravo na kraju, 2016）的活跃贡献者。他将多本书翻译成克罗地亚语，包括《多元性》（Hardt & Negro,
    2009）和《黑客宣言》（Work, 2006）。他还是作者、表演艺术家以及总部位于萨格勒布的国际表演团体 BadCo（BadCo, 2016b）的成员。Tomislav
    写作并讨论技术发展的政治、数字政治和美学。


    Tomislav 和 Marcell 合作了近二十年。他们最近的合作包括围绕“公共图书馆”项目的一系列活动。


    # 第 12 章


    Ana Kuzmanić 是萨格勒布的一位艺术家，斯普利特大学（克罗地亚）土木、建筑与测地学院副教授，教授绘图、设计和建筑表现。她是克罗地亚视觉艺术协会成员。自2007年以来，她举办了十余次个人展，并参加了克罗地亚、美国、荷兰、立陶宛和斯洛文尼亚的多次集体展。自2011年后，她共同创作了国际团体
    Eastern Surf，该团体“组织、制作并参与了包括展览、表演、视频、雕塑、出版物网络作品在内的许多项目”（Eastern Surf 2017）。她的作品解构了对现实的社会解读。她测试了艺术家与观众的传统角色，让观察者参与到艺术品的创作，从而创造了对话空间和替代学习体验，作为解放和社会转型的平台。她的艺术实践植根于多学科的概念框架，通过位于现实与生命力边界的多种媒介进行研究和表达产生。


    # 关于对话


    我从学生时代起就认识 Marcell Mars，但我们的道路只是零星交汇。2013年，我就这本书的潜在对话者向 Marcell 寻求建议，他向我介绍了 McKenzie
    Ward。2015年，当我们开始合作对话时，Marcell 向我介绍了 Tomislav Medak。由于 Marcell 和 Tomislav 最近的作品与艺术密切相关，因此我请求
    Ana Kuzmanić 在这些问题上提供建议。从对话开始，Marcell、Tomislav 和我偶尔会面讨论其总体内容。呈现的对话是在2015年11月至2016年12月之间在一个共享在线文档中完成。


    # 社会黎明的网络文化


    Petar Andrić & Ana Kuzmanić（PJ & AK）：1999年，你们建立了多媒体学院 - mim（Multimedia Institute,
    2016a）；2000年，你们建立了萨格勒布的 Net.culture club MaMa（在克罗地亚）。Net.club MaMa 有以下目标：


    - 促进创新的文化实践和广泛的行动主义。作为一个文化中心，它首先促进了广泛的新艺术和文化实践，以及技术的发展、艺术和理论趋势；从新媒体、电影、音乐到哲学、社会理论、出版和文化政策。


    - 作为一个社区中心，MaMa 是萨格勒布的替代“客厅”，为各种倡议和协会提供免费场所，无论是促进少数群体身份（生态、LGBTQ、族裔和女性主义），还是批判性地质疑既有的社会规范。（Net.club
    club MaMa, 2016）


    请描述克罗地亚社会面临的主要挑战和机遇。你们为什么要建立多媒体学院 – mi2 和 Net culture club MaMa？你们是怎么做的？


    **Marcell Mars & Tomislav Medak（MI & TM）：** 我们的工作形成背景以南斯拉夫亚的解体过程、内战以及2090年代初威权主义的兴起为特征。在动荡和不确定性中，某些因素定义了我们今天所说的克罗地亚背景下的社会。首先，新建立的族裔同质化依然存在。[注：OCR文本在后半部分包含大量重复和破碎句子。我已根据要求合并了页面。]


    '
