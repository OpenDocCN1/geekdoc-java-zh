    # KNOWLEDGE COMMONS AND ACTIVIST PEDAGOGIES: FROM IDEALIST POSITIONS TO COLLECTIVE
    ACTIONS


    Conversation with Marcell Mars and Tomislav Medak (co-authored with Ana Kuzmanić)


    Marcell Mars is an activist, independent scholar, and artist. His work has been
    instrument in development of civil society in Croatia and beyond. Marcell is one
    of the founders of the Multimedia Institute – mi2 (1999) (Multimedia Institute,
    2016a) and Net.culture club MaMa in Zagreb (2000) (Net.culture club MaMa, 2016a).
    He is a member of Creative Commons Team (Creative Commons, 2016). He initiated
    GNI; GPL publishing label EGBOO Bits (Monoskop, 2016a), meetings of technical
    social-sharing learning (Net.culture club MaMa, 2016b) and various events and
    gatherings in the field of hackerism, digital hacking, free software philosophy,
    digital cultures, social software, semantic web et. In 2011-2012 regularly held
    talks and workshops at Hfing Class Studies at Jan Van Eyck in Maastricht, and
    in 2013 he held fellowship at Academy Schloss Stuttgart Leuphana Universität Leipzig.


    Tomislav Medak is a cultural worker and theorist interested in political philosophy,
    media and aesthetics. He is an advocate of free software and free culture, and
    the Project Lead of the Creative Commons Croatia (Creative Commons, 2016). He
    works as coordinator of theory and publishing activities at the Multimedia Institute-MaMa
    and Net.culture club MaMa (2016). Tomislav is an active contributor to the Croatian
    Right to the Creative movement Pravo na grado, 2016). He interpreted to numerous
    books into Croatian language, including Multiple (Hardt & Negro, 2009) and A Hacker
    Manifesto (Work, 2006). He is an author and performer and internationally acclaimed
    Zagreb-based performance collective BadCo (BadCo, 2016b). Tomislav writes and
    talks about politics of technology development, digital politics and aesthetics.


    Tomislav and Marcell have been working together for almost two decades. Their
    recent collaborations include a number of activities around the Public Library
    project.


    # CHAPTER 12


    Ana Kuzmanić is an artist in Zagreb and Associate Professor at the Faculty of
    Civil Engineering, Architecture and Geodesy at the University in Split (Croatia),
    lecturing in drawing, design and architectural presentation. She is a member of
    the Croatian Association of Visual Arts. Since 2007 she has held more than a dozen
    individual exhibitions, and took part in numerous collective exhibitions in Croatia,
    the USA, Netherlands, Lithuania and Slovenia. Since 2011 she co-produced the international
    collective Eastern Surf, which has ‘organised, produced and participated in a
    number of projects including exhibitions, performance, video, sculpture, publications
    and web work’ (Eastern Surf 2017). Her artwork deconstructs social readings of
    reality. It tests traditional roles of artists and viewers, giving the observer
    an active part in creation of artwork, thus creating spaces of dialogue and alternative
    learning experiences as platforms for emancipation and social transformation.
    Grounded within a multidisciplinary conceptual framework, her artistic practice
    is produced via research and expression in diverse media located at the boundaries
    between reality and vitality.


    # ABOUT THE CONVERSATION


    I have known Marcell Mars since student days, yet our paths have crossed only
    sporadically. In 2013 I asked Marcell''s input about potential interlocutors for
    this book, and he introduced me to McKenzie Ward. In 2015, when we started working
    on our conversation, Marcell introduced Tomislav Medak. Marcell''s and Tomislav''s
    recent works are closely related to arts, so I requested Ana Kuzmanić''s input
    in these matters. Since the beginning of the conversation, Marcell, Tomislav,
    and I, occasionally discussed its generalities in person. The presented conversation
    took place in a shared online document between November 2015 and December 2016.


    # NET CULTURE AT THE DAWN OF THE CIVIL SOCIETY


    Petar Andrić & Ana Kuzmanić (PJ & AK): In 1999, you established the Multimedia
    Institute - mim (Multimedia Institute, 2016a); in 2000, you established the Net.culture
    club MaMa (both in Zagreb, Croatia). The Net.club MaMa has the following goals:


    - To promote innovative cultural practices and broadly social activism. As a cultural
    center, it promotes wide range of new artistic and cultural practices realised
    in the first place to the development of communication technologies, as well as
    trends in arts and theory; from new media, film and music to philosophy and social
    theory, publishing and cultural policy issues.


    - As a community center, MaMa is Zagreb’s alternative ‘living room’ and a venue
    free of charge for various initiatives and associations, whether they are promoting
    minority identities (ecological, LGBTQ, ethnic, and feminist others) or critically
    questioning established social norms. (Net.club club MaMa, 2016a)


    Please describe the main challenges and opportunities from the Croatian civil
    society. Why did you decide to establish the Multimedia Institute – mi2 and the
    Net culture club MaMa? How did you go about it?


    **Marcell Mars & Tomislav Medak (MI & TM):** The formative context of our work
    had been marked by the process of dissolution of Yugoslavia, ensuring civil wars,
    and the rise of authoritarian nationalisms in the early 1990s. Amidst the turmoil
    and uncertainty factors would define what we consider today as civil society in
    the Croatian context. First, the newly created state of ethnic, social homogeneity
