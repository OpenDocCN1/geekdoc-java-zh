    公有化的集体和巨大努力正被那些精通加密的自由骗术者规避政府控制的能力所掩盖。显然，我们强烈反对这些发展中个人主义的、私有化的和 1337（精英的）倾向。


    **PJ & AK:** 公共图书馆项目（《世界记忆》，2016a）非常接近伊万·伊利奇（Ivan Illich, 1971）、埃弗里特·雷默（Everett
    Reimer, 1971）、保罗·古曼（Paul Goodman, 1973）和约翰·霍尔特（John Holt, 1967）等人的去学校化愿景。最近的研究表明，数字技术为去学校化项目提供了一些新机会（Hurt,
