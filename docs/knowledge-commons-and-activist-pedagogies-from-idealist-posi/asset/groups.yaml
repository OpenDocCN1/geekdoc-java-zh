    # KNOWLEDGE COMMONS AND ACTIVIST PEDAGOGIES


    successful: producers such as Zvuk broda, Blasko, Plazmatnick, Aeseq, No Name
    No Fame, and Ghetto Booties were storming the chats, the label regularly grew
    to Dj-ing, sound editing, VJ-ing, video editing and we the artists regular workshops
    at schools and our summer camp Oktokultivar. It inspired us to start working on
    alternatives to the copyright regime and on what we believe is free knowledge
    and culture.


    PJ & AK: The civil society is the collective consciousness, which provides leverage
    against national and corporate agendas and serves as a powerful social correct.
    Thus, at the outset of the US invasion in Iraq. Net.culture club MaMa rejected
    a $100 000 USAID grant the invasion was:


    - a) a precedent on the rationale of pre-emptive war,

    - b) waged in disregard of legitimate processes of the international community,

    - and c) by corporate interests to control natural resources (Multimedia Institute,
    2003 in Razza, 2015: 82).


    Yet, a few weeks later, MaMa accepted a $100 000 grant from the German state —
    this provided a wide public debate (Razza, 2015; Kršić, 2003; Stubbs, 2012).


    Now that the heat of the moment has gone down, what is your view to this debate?
    More generally how do you decide which money to accept and reject? How do you
    decide where to publish, where to exhibit, and whom to work? What is the relationship
    between idealism and pragmatism in your work?


    MM & TM: Our decision seems just insignificant in the face of the aftermath of
    that historical moment. The unilateral decision of US and its allies to invade
    Iraq in March 2003 encapsulated the defeat of global protest movements that contested
    globalisation since the early 1990s and the echape charge that the War on Terror,
    in its never-ending iterations, is still repeating today. Nowadays, the weaponized
    and privatized security regime follows the networks of supply chains that cut
    across the logic of borders and became vital both for the global market and distribution
    (See, 2014). For US, the global politician, the inception of unnamed weaponry
    and all sorts of asymmetric technologies has reduced the human cost of war down
    to zero. By deploying drones and killer robots, it did away with the fundamental
    reality check of human casualties and made endless war politically plausible.


    Our 2003 decision carried hard consequences for the organization. In a capitalist
    society, one can either earn by relying on the market, or on the state, or on
    private funding. The USAID grant was our first large grant after the initial money
    from the Open Society Institute, and meant that we could employ some people from
    our community over the period of next two years. Yet at the same time, the USAID
    had become directly involved in Iraq, aiding the US forces and various private
    contractors such as Halliburton in the dissession and plunder of the Iraqi economy.
    Therefore, it was unconscionable to continue receiving money from them. In light
    of its moral and existential weight, the decision to return the money had to be
    made by the general assembly of our association.


    People who were left without wages were part and parcel of the community that
    we had built between 2000 and 2003, primarily through Otokutoliv Summer Camps
    and Summer Source Camp (Tactical Tech Collective, 2016). The other grant we received
    later that year, was split among the Federal Foundation of the German government,
    while USAID money, so they had eased the way for Right to the City (Pravo no grad,
    2016). However, we still work with the people who decided to return without conditions,
    and passing judgements sense despite specific economic, hor and historical context
    can lead to apolitical mistakes.


    We have certain principles which we would not want to compromise – we do work
    with corporations, we are egalitarian in terms of income, our activities are for
    the public. In political activities, idealistic positions sense only for long
    as they are effective. Our idealism is through and pragmatic. It is in this world
    that we invoke the ideal of the library. We are well aware that reality is more
    complex than our ideals. However, the collective sense of purpose inspired by
    an ideal can carry over into lelective action. This is the core of our interest.


    **PJ & AKS:** There has been a lot of work done under the 2000s. In a post-war
    country, Croatia has become an integral part of the European Union – with all
    associated advantages and problems. What are the today''s challenges in maintaining
    the Multimedia Institute and its various projects? What are your future plans?


    **MM & TM:** From the early days, Multimedia Institute/MaMa took a twofold approach.
    It has supported people working in and around the organization in their heterogeneous
    interests including but not limited to digital technology and information freedoms,
    politics and philosophy, contemporary digital art, music and cinema. Simultaneously,
    it has been strongly focused to social and institutional transformation.


    The moment zero of Croatian independence in 1991, which was marked by ethnic cleansing
    and forceful imposition of contrived mono-national identity, saw the progressive
    and modern culture embracing the political alternative of anti-movement. It is
    in these conditions, which excluded access to public resources, the Croatian civil
    society had developed throughout the 1990s. To address this inequality and spatial
    resources to civil society, since 2000 we have been organizing collective actions
    with a number cultural actors across the country to create alternative routes
    for access to resources mutual support networks, shared venues, public funding,
    alternative forms of deunding. All the while, organizational work draws on understanding
    of commons from two sources – the free software community, and the legacy of social
    ownership under socialism.


    ## CHAPTER 1 KNOWLEDGE COMMONS AND ACTIVIST PEDAGOGIES


    Later, on this line of work has been developed towards intersectional struggles
    around spatial justice and against privatisation of public services (2007 till
    present) (Pravo na grad, 2016) and the 2015. In 2016, with the arrival of the
    short-lived Croatian government formed by a coalition of mainstream and fringe
    radicals, many institutions disenchanted by the achievements of the last fifteen
    years seemed likely to be disenchanted in a matter of months. At the time of writing
    this time, the collapse of broader social and institutional context is (again)
    an imminent threat. In our way, current situation echoes the atmosphere of Yugoslav
    civil wars in 1990. Yet the City turn to the right is structurally parallel to
    the aftermath of the neoliberal race to the bottom and the War on?, the disenfranchised
    working class fears its immigration and insists on the return of nationalist values.
    If globalization offers nothing, why should they seek the solution to their own
    plight in the regime of state nationalism?


    At the Multimedia Institute/MaMa we intend to continue our work against this collapse
    of context continue to cultural programs, publish books, and organize the Human
    Rights Film Festival. In order to articulate, formulate and document years of
    practical experience, we aim to strengthen our focus on research and writing about
