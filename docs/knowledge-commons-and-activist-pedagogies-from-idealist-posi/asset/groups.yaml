    # CHAPTER 12


    Computer world remains a weird hybrid where knowledge is produced in both academic
    and non-academic settings, through academic curricula – but also through fairs,
    informal gatherings, computer clubs, homebrew hacker communities and the like.
    Without the enthusiasm and the experiments with ways how knowledge can be transferred
    and circulated between peers, we would have probably never arrived at the present.
    The Computer Revolution in the beginning of 1980s Without the amount of personal
    computers already in use, we would have probably never experienced the Internet
    revolution in the beginning of 1990s. It is through such historical development
    that computer science became the centre of the larger university whose spread
    its tentacles into almost all other disciplines and practices.


    **PJ & AK:** These stories decribe the process of professionalization. How do
    you go about its mirroring – the process of amateurisation?


    **MM & TM:** Socialisation, vocabulary, tutorials, curricula – all the processes
    necessary for active economy and importance in the world – prime a discipline
    for automation of its various skills and workflows in software tools. That software
    for photography (Photoshop, 1990; Instagram, 2010), architecture (AutoCAD, 1982),
    journalism (Blogger, 1999; WordPress, 2003), graphic design (Adobe Illustrator,
    1987; Photoshop, 1998; FreeBSD, 1988), produced (Steinberg Cubase, 1989), and
    other disciplines (Memory of the World, 2016b).


    Usually, after software tool gets developed and introduced into the discipline,
    begins the period when a number of amateurs start to ‘join’ to profession. An
    wide range of enthusiasts with a specific skill, many self-trained and with understanding
    of a wide range of software tools, this phenomenon often marks a coming of amateurs
    from different professional backgrounds to compete with certified professionals
    in that field. The future development of the same software tools remains under
    control by software engineers, who become experts in established workflows, and
    who promise further optimizations in the field. This crisis of old professionals
    becomes even more pronounced if the old business model of corporate monopolies
    are challenged by the transition to digital economy and possibly face the algorithmic
    replacement of their workforce and assets.


    For professions under these challenging conditions, today it is too late for maintaining
    authority and expertise by labelling enthusiasts as ‘pseudo’, ‘deviant,’ or ‘amateur’,
    contemporary disciplines need to revisit their roots, values, vision and benefits
    for society and then (re-articulate the corpus of knowledge that the disciplines
    should maintain for the future.


    **PJ & AK:** How does this relate to the dichotomy between amateur and professional
    librarians?


    **MM & TM:** Regarding the e-book management software Calibre (2016), written
    by Goyal, as a software tool which has benefited from the knowledge produced,
    passed on and accumulated by librarians for centuries. Calibre has the task of
    creating and maintaining the catalog easy.'
  - '[PAGE 24]


    Our vision is to make sharing, aggregating and accessing catalogs easy and playful.
    We like the idea that every rendered catalog is stored on a local hard disk, that
    an amateur librarian can choose when to share, and that when she decides to share,
    the catalog aggregated into a library together with the collections of other fellow
    librarians (at https://library.memoryoffbworld.org). For the purpose of sharing
    we wrote the Calibre plugin named let''s share books and set up the related server
    infrastructure which are easily replicable and deployable in distributed clusters.


    With Voja Anton, the inventor of the first eight-bit computer in Yugoslavia, we
    also designed and developed a series of book scanners and used them to digitize
    hundreds of books focused on Yugoslav humanities as the Digital Archive of Praxis
    (2013), the Korula Summer School (2016), Catalogue of Liberated Books (2013),
    books born away Croatian public libraries during ideological cleansing of the
    1990s Written-off (2015), and the collection of books selected by the Black Library
    of Wallace as his dream library for political education (Memory of the World,
    2016b).


    In our view, amateur librarians are complementary to professional librarians,
    and there is so much to learn and share from each other. Amateur librarians care
    about books which are not (yet) dearly cared with curiosity, passion and love;
    they dare to disobey in pursuit of the emancipatory vision of the world which
    is not under threat. If we, amateur librarians, ever succeed in our pursuits of
    – should secure the existing jobs of professional librarians and open up many
    new and exciting positions. Knowledge is easily accessed, (re)produced and shared,
    there will be so much to follow up upon.


    # TWARDS AN ACTIVIST PUBLIC PEDAGOGY


    PJ & AK: We organize tasks and workshops, publish books, and maintain a regional
    hub for people interested in digital cultures. In Croatia, your names are almost
    synonymous with success – worldwide, we are recognized as regional leaders in
    the field. Such engagement has a prominent pedagogical component – unruly; the
    majority of our work can be interpreted as public pedagogy. How does the main
    theoretical underpinnings of public pedagogy work in practice?


    MM & 7M: We organize a cluster of heterogeneous communities and fields of interest.
    Therefore, our approaches to public pedagogy hugely vary. In principle, we subscribe
    to the idea that all intelligences are equal and that epistemology is socially
    structured. In practice, this means that our activities are syncretic and inclusive.
    Even without falling under the same umbrella, we bring together people of varying
    levels of skill – who bring in various types of knowledge, and who arrive from
    various social backgrounds. Working with hackers, we favour hands-on approach.
    For a number of years Marcell has organized weekly Skill Sharing program (Net.culture
    club MaMa, 2016(b)) that has started from very basic skills. The bar was incrementally
    raised to today''s level of the highly specialized meritocratic community of 1337
    hackers.'
