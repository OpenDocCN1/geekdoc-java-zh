    # 29. Jaksa 街节


    Jalan Jaksa 是一个深受外国游客欢迎的地方。它实际上是一条长 500 米的街道。这里为你提供价格非常合理的各种住宿选择。许多国际背包客都会访问并留在此地。地理位置非常优越，因为它位于雅加达的心地带。由于其受欢迎，雅加达人发起并在
    Jalan Jaksa 举办了一场活动。其理念与雅加达览会类似，但规模较小。街道旁搭建了许多摊位，展示各种传统美食和物品。


    # 30. 雅加达美食与时尚节


    这是雅加达的另一个盛事，展示了最新的时尚趋势和最美味的美食。届时将会有由知名设计师举办的大型装秀。蜡染（Batik）和织锦是 JFFF 节中最具吸引力的系列之一。通常还会建造一个可以同时供数百人观看的露天电影院，让庆祝活动更加热闹。最终，你可以满足对时尚和食物的需求，这是印度尼西亚拥有的异域且无穷尽的组合。


    “冒险是值得的。” – 伊索


    # 千岛群岛 (Kepulauan Seribu) —— 大都市中的隐藏天堂


    千岛群岛（Kepulauan Seribu）是大都市中的明珠。当人们了解到雅加达的交通拥堵和城市繁忙时，他们必须稍微移动才能到达那些纯净未受破坏的岛屿。千岛以其美丽和神秘而闻名。它们还提供了游泳、潜水和浮潜的绝佳去处。以下是一些岛屿：


    ## 31. Ayer 岛


    Ayer 岛是千岛中最受欢迎的岛。它距离雅加达 Marina 码头只有 15-20 分钟车程。它为游客提供了最完整的设施。这里建造了具有自然概念的小屋。有些房间甚至建在水上，让游客可以随时感受海风。岛上依然自然洁净。这个岛长期以来一直被千岛的前国王作为避暑地。印度尼西亚的首任总统也因为其美丽和宁静将这里作为假期度假胜地。


    ## 32. 西 Pantara 岛和东 Pantara 岛


    这两个岛屿都是保护岛，保留了千岛的许多动植物。这些岛屿的海洋生物种类多样，因此你也可以在这两个地方潜水和浮潜。这里有一家私人度假村，为任何喜欢接触自然的人提供充足的设施。该度假村的一个大特点是带有大玻璃窗的舒适小屋，让我们能够看到海景。


    ## 33. Bira 岛


    Bira 是千岛群岛上的一座无人荒岛。该岛屿只有 500 平方米的实木区域。虽然它相对是一个很小的岛屿，但人们喜欢去那里潜水和浮潜。此外，白沙滩也是感到疲倦时放松的好去处。我还没去过那里，但一些去过的朋友说，在
    Bira 你可以体验到小小的冒险，尤其是当你有足够的耐心等待一场极其美丽的日落时。


    ## 34. Bidadari 岛（仙女岛）


    这个岛屿距离雅加达只有 15 公里（乘船约 20-30 分钟）。它是千岛中距离雅加达最近的岛屿。在这里，你可以进行一些有趣的水上运动和户外活动。你还可以在这里和海豚嬉戏。我最喜欢这里，因为它对儿童非常友好。那里还有一个名为
    Martello 的古荷兰堡垒，那里是受欢迎的摄影点。


    ## 35. Tidung 岛


    Tidung 岛分为两个，分别称为大 Tidung 岛和小 Tidung 岛。这两个岛相隔 1 公里，要到达另一个岛，有一座跨越清澈浅水的木桥，你可以在那里看到美丽的珊瑚和鱼类。人们喜爱这些岛是因为它们的天然海滩和美丽的水下景观。因此，浮潜是该岛上最好的活动。不仅如此，你还可以挑战自己从
    8 米高的桥跳入海。尝试一下吧！小组一起做会有趣得多。


    ## 36. Kayangan 岛 / Cipir 岛


    这个岛因为荷兰殖民时期留下的旧建筑而闻名。那里有堡垒遗迹、医院建筑和一些像大炮这样的旧武器。在岛上，我们还能找到一口古淡水井，据信它在那里已经存在几个世纪。那里还有旧桥的遗迹，曾连接该岛与其他附近的岛屿。你可以对这个岛进行简短游览，然后继续前往其他岛屿的旅行。


    ## 37. Onrust 岛


    这个岛靠近 Kayangan 岛 / Cipir 岛。它与 Kayangan 具有几乎相同的特征。该岛的主要景点是它的遗迹。供你参考，这个岛是荷兰殖民者占领印度尼西亚并攻击巴达维（现在的雅加达）时访问的地方。因此，有很多证据表明这个岛对于殖民者具有多么战略意义。


    ## 38. Rambut 岛


    在 3 月到 9 月间访问这里，因为你会发现超过 50,000 只从澳大利亚迁徙到这个岛的鸟类。Rambat 岛是一个鸟类保护区。游客有严格规定以保护鸟类。此外，该岛还以红树林闻名。红树林吸引了许多鸟在迁徙季节来到这里。当鸟类返回时，这里大约只有
    20,000 只。要进入这里，你必须获得雅加达自然资源保护局的许可。


    ## 39. Putri 岛


    当你带着家人，尤其是孩子时，这里是千岛最值得游的岛屿。你可以给孩子们带来难忘的经历，因为他们将学习许多关于自然的知识，特别是热带水下世界。你可以享受的景点包括水族馆、玻璃底船、日出、晨浮、美丽的度假村和美食。


    ## 40. Sepa 岛


    人们称潜水者的天堂。当你到达这里时，迎接你的是美丽的沙滩和清澈的水。那里有带有有趣生物的珊瑚礁。即使你不是专业人士，也可以在这里浮潜。忘了带上你的水下相机。给你一个小建议，租船去潜点的价格很便宜。你也可以租船前往千岛的其他岛屿。


    “生命要么是大胆的冒险，要么什么都不是。” – 海伦凯勒


    ## 41. Kotok 岛


    在这个岛上，你可以找到雅加达市的标志动物——隼。政府已将这里变为鸟类保护区。该岛的特征与千岛的其他岛屿相似，例如清澈的水和自然环境。


    ## 42. Pelangi 岛


    它是逃离日常生活的好地方。这里提供的所有住宿都面向大海，这样你在入住期间就能欣赏到美景。你可以去潜水、浮潜和钓鱼。该岛还有医疗设施和网球场。一个很棒的体验是浮动餐厅，它提供极佳的食物和景色。


    ## 43. Laki 岛


    对于喜欢在自然中体验真实生活的人，你应该去看看 Laki 岛。这个岛为你提供露营和钓鱼体验。你还可以在氛围安静的海滩上晒日光。如果你不想在露营时对付蚊子，别忘记带驱蚊液。


    ## 44. Pramuka 岛


    '
- fmt: '

    This place is a perfect snorkeling and diving spot in Kepulauan Seribu. You don’t
    need to be able to swim or buy expensive equipment to be able to enjoy the underwater
    world and interact with the sea creatures. In Pramuka Island, you can do snorkeling
    easily with the help of a guide. This island is also a conservation area for sea
    turtles. When you are lucky, you can observe the turtles lay eggs. When you are
    luckier, you can help the locals to release the small turtle to return back to
    the sea.


    ## 45. Semak Daun Island


    The sand is so white and soft and the scenery is just amazing. The name is taken
    because there are only semak daun (bushes) around the island. This island is not
    an inhabitant island, so there is not any hotel or restaurant. Therefore, it is
    a perfect camping site. No fresh water is available here, but we can easily get
    it from Pramuka Island which is near the place. Snorkeling and Diving equipment
    can also be rented in Pramuka Island.


    ## Other Attractions


    ### 46. Nightlife and Clubs

    Jakarta never sleeps. The vibe of the place can be felt 24/7. If in the morning
    there are many people doing their business in Jakarta, the nightlife of Jakarta
    is quite different. You can choose hundreds of nightclubs which offers various
    different themes and music. Among them are Empirica, Immigrant, X2, Colosseum
    (1001), Fable, Dragonfly, Stadium, Exodus, and Golden Crown. For the bars, among
    the best are Lucy in the Sky, SKYE, Café Mondo, Umbra, and Treehouse. Many said
    that the crowd in Jakarta bars and nightclubs are beautiful and friendly, so that
    you can make friends easily.


    ### 47. Traditional Cuisines

    I will choose 5 best culinary for you to try when in Jakarta. The first one is
    Kerak Telor. It is quite hard to find kerak telor in the restaurant. Usually,
    you can easily find this food when there is a festival or in street sellers. It
    is a rice cracker with eggs, shredded beef, and other ingredients. The second
    one is Soto Betawi which is a bowl of rice with coconut milk broth, beef, tomato,
    and potato chips. The next one is Gado-Gado. Foreigners call it Indonesian Salad.
    There are some boiled potatoes, carrots, fresh lettuce, tomato, egg, Indonesian
    crackers, and other ingredients served with peanut sauce. The fourth choice for
    you is Nasi Uduk. Nasi is the Indonesian word of rice. Basically, it is rice that
    is cooked with coconut milk and other ingredients that is served with scrambled
    eggs, friend chicken, fried beef, sauté potato, and peanut sauce. The last one
    is Nasi Ulam. This dish is inspired by Chinese cuisine. The rice is served with
    some beef and egg stew, scrambled eggs, pried mashed potato, fried salty squid,
    chili sauce, peanuts, some basil leaves and crackers.


    ### 48. Shopping Destinations

    Jakarta is also a great shopping destination. There are hundreds of malls and
    shopping precincts available in the city. The best time to shop in Jakarta is
    when there are Jakarta Fair, Jakarta Great Sale, and Jakarta Food and Fashion
    Festival for there are plenty of discounted items throughout the city. Some of
    the famous malls in Jakarta are Mall Kelapa Gading, Grand Indonesia, Kota Kasablanka,
    Gandaria City, and Central Park. On the other hand, if you want to experience
    a more traditional shopping precinct where you can practice your bargaining ability,
    try Blok M, Pasar Baru, Pasar Mayesic, Pasar Grosir Cililitan, and many more.


    ### 49. Best Accommodations in Town

    Talking about accommodation, Jakarta has many options, from 5 stars hotels, international
    franchise hotels, to small inns and motels. But I will discuss particularly about
    Jalan Jaksa. It has been known particularly by foreign backpacker tourists for
    its affordable rooms. There are also many facilities available along this 400
    meters long street, such as restaurant (both locals and western cuisines), bars,
    ticket agency, supermarket, and many more. Tourist, particularly foreigners love
    to stay in this place because they can experience the local environment and blend
    well with the local people of Jakarta. You can easily gain information about some
    interesting spots in Jakarta if you make friends with the locals.


    ### 50. Traffic Arts

    Because Jakarta is so famous for its traffic jam, I suggest you some of this useful
    tricks and tips. First, avoid starting your journey between 7-8 a.m. in the morning
    because the traffic is the heaviest during those hours. 4-6 p.m. traffic is also
    crowded. So, it is better to start your journey early or after 8, and return back
    to your hotel after 6. The next thing to consider is taking bemo (the three-cycle
    motor) instead of taxi. Although it is less comfortable, but this vehicle can
    maneuver better in the heavy traffic than cars. Moreover, the rate is a lot cheaper.
    Next, consider to take the small alleys around the city. You can ask some people
    who rent their motorbike (called an ojek) to take you to your destination place
    through the quickest route.


    > TOURIST

