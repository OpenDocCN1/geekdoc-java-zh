    这里是千岛群岛（Kepulauan Seribu）一个完美的浮潜和潜水点。你不需要会游泳或购买昂贵的设备就能享受水下世界并与海洋生物互动。在普拉马卡岛（Pramuka
    Island），在导游的帮助下，你可以轻松地浮潜。该岛还是海龟的保护区。运气好的话，你可以观察海龟产蛋；运气更好的话，你可以帮助当地人释放小龟回到大海。


    ## 45. Semak Daun 섬


    沙子洁白而柔软，景色美得令人惊叹。名字的由来是因为岛周围到处都是 semak daun（灌木）。这个岛不是有人居住的岛屿，因此没有任何酒店或餐厅。因此，这里是一个完美的露营地。这里没有淡水，但我们可以轻松从邻近的普拉马卡岛获取水。浮潜和潜水设备也可以在普拉马卡岛租赁。


    ## 其他景点


    ### 46. 夜生活与俱乐部

    雅加达从不睡去。这里的氛围 24 小时都能被感受到。如果说早晨雅加达有很多人忙于生意，那么雅加达的夜生活就完全不同。你可以选择数百家提供各种不同主题和音乐的夜店。其中包括
    Empirica、Immigrant、X2、Colosseum (1001)、Fable、Dragonfly、Stadium、Exodus 和 Golden
    Crown。至于酒吧，最棒包括 Lucy in the Sky、SKYE、Café Mondo、Umbra 和 Treehouse。很多人说雅加达酒吧和夜店的人群非常美丽友好，所以你可以很容易交到朋友。


    ### 47. 传统美食

    我将为你挑选 5 种在雅加达时值得尝试的最佳美食。第一个是 Kerak Telor（煎蛋米饼）。在餐厅里很难找到 Kerak Telor。通常，在节日期间或街头小贩处你可以很容易找到这种食物。这是一种由鸡蛋、碎丝牛肉和其他配料制成的米饼。第二个是
    Soto Betawi，这是一碗配有椰奶汤底、牛肉、番茄和土豆片的米饭。下一个是 Gado-Gado，外国人称之为印尼式沙拉。里面有煮土豆、胡萝卜、新鲜生菜、番茄、鸡蛋、印尼炸饼和其他配料，并配有花生酱。第四个选择是
    Nasi Uduk。Nasi 是印尼语中米饭的意思。基本上，它是用椰奶和其他配料煮成的米饭，配有炒蛋、炸鸡、炸牛肉、炒土豆和花生酱。最后一个是 Nasi Ulam。这道菜灵感来自中国菜。米饭配有牛肉蛋烩、炒蛋、炸土泥、炸咸鱿、辣椒酱、花生、一些罗勒叶和炸饼。


    ### 48. 购物目的地

    雅加达也是极佳的购物目的地。城市里有数百个购物场和购物区。在雅加达购物的最佳时间是雅加达展览会、大促销期间，因为市内到处都有大量的折扣商品。雅加达著名的购物场有
    Mall Kelapa Gading、Grand Indonesia、Kota Kasablanka、Gandaria City 和 Central Park。另一方面，如果你想体验一个可以锻炼议价能力的更传统的购物区，可以尝试
    Blok M、Pasar Baru、Pasar Mayesic、Pasar Grosir Cililitan 等地。


    ### 49. 市内最佳住宿

    谈到住宿，雅加达有很多选择，从五星级酒店、国际连锁酒店到小型客栈和汽车旅馆。但我将特别讨论 Jaksa 街（Jalan Jaksa）。它因价格便宜而深受外国背包客的喜爱。这条长
    400 米的街道还有许多设施，如餐厅（包括当地菜和西餐）、酒吧、票务处、超市等。游客（特别是外国人）喜欢住在这里，因为他们可以体验当地环境并与雅加达当地人良好融合。如果你和当地人成为朋友，可以轻松获得关于雅加达一些有趣地点的信息。


    ### 50. 交通技巧

    由于雅加达以堵车而闻名，我向你提供一些实用的技巧和建议。首先，避免在早上 7 到 8 点之间出发，因为这些时间段的交通最拥堵。下午 4 到 6 点交通也很挤。所以，最好早出发或在
    8 点之后出发，并在 6 点后返回酒店。下一个要考虑的是乘坐 bemo（三三轮摩托车）而不是出租车。虽然不舒服，但这种车辆在拥堵交通中的机动性比汽车好。而且，费用便宜得多。此外，考虑走城市周围的小巷。你可以找一些租摩托车的人（称为
    ojek），通过最快的路线带你到达目的地。


