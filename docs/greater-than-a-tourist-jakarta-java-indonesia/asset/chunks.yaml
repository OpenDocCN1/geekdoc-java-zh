    \ tourist. It is actually the name of a 500 meters long street. This place offers\
    \ you wide ranges of accommodation in a very reasonable price. Many international\
    \ backpacker tourists visit and stays in this place. The location is so strategic\
    \ since it is located in the heart of Jakarta. Because of its popularity, the\
    \ Jakartanese take an initiative to make an event in Jalan Jaksa. The concept\
    \ is similar Jakarta Fair, but is held in the smaller scale. Many booths are built\
    \ along the street to display various kinds of traditional foods, and things.\n\
    \n# 30. Jakarta Food and Fashion Festival\n\nIt is another great event in Jakarta,\
    \ in which the latest fashion trend and the most delicious cuisines are presented.\
    \ There will be mega fashion shows by famous designers. Batik and woven are among\
    \ the most attractive lines that always color the JFFF. An outdoor movie theater\
    \ that can be seen by hundreds of people at a time is usually built to make the\
    \ celebration merrier. Ultimately, you can satisfy your taste in fashion and food,\
    \ two exotic endless combination that Indonesia has.\n\n“Adventure is worthwhile.”\
    \ – Aesop\n\n# Kepulauan Seribu (The Thousand Islands)—A Hidden Paradise in the\
    \ Metropolitan\n\nKepulauan Seribu (The Thousand Islands) are jewels in the metropolitan.\
    \ When people know Jakarta for its heavy traffic and busy city, they have to move\
    \ a little bit to reach the pure and unspoiled islands. The thousand islands are\
    \ acknowledged for their beauties and mysteries. They also offer great spots to\
    \ swim, dive, and snorkel. Here are some of the islands:\n\n## 31. Ayer Island\n\
    \nAyer island is the most popular island in Kepulauan Seribu. It is only 15-20\
    \ minutes away from the Marina harbor Jakarta. It has the most complete facilities\
    \ for tourists. Cottages with natural concepts are built in this place. Some rooms\
    \ are even build on the water, so that the guest can experience the ocean breeze\
    \ at anytime. The island is still natural and clean. This island has long been\
    \ used by the former king of Thousand Island as a retreat place. Indonesia’s first\
    \ president also used this place as a holiday getaway for its beauty and peacefulness.\
    \ \n\n## 32. Pantara Barat and Pantara Timur Island\n\nBoth the islands are conservative\
    \ islands in which so many floras and faunas of the Thousand Islands are preserved.\
    \ The sea biota in these islands are varies, so you can also dive and snorkel\
    \ in the two places. There is a private resort that gives ample facilities for\
    \ anyone who likes to get in touch with the nature. One great feature of this\
    \ resort is the cozy cottage with big glass windows that enables us to see the\
    \ sea.\n\n## 33. Bira Island\n\nBira is an unoccupied island in Pulau Seribu.\
    \ The island is only 500 meter square of thick wood. Although it is relatively\
    \ a tiny island, people love to visit this place to dive and snorkel. In addition,\
    \ the white sand is also a great place to relax when you feel tired. I haven’t\
    \ been there, but some friends who has been there said that there will be a little\
    \ adventure you can experience in Bira, especially when you are patience enough\
    \ to wait for an extremely beautiful sunset.\n\n## 34. Bidadari Island\n\nThis\
    \ island is only located 15 kilometers away from Jakarta (approximately 20-30\
    \ minutes by boat). It is the nearest island among those in the Thousand Islands\
    \ from Jakarta. In this place, you can do some interesting water sport and outbound\
    \ activities. You can also play with dolphins here. It is my favorite because\
    \ this place is friendly for children. There is also an ancient Dutch Fortress\
    \ called Martello which becomes a favorite photography spot.\n\n## 35. Tidung\
    \ Islands\n\nTidung islands are divided into two, named the Big Tidung Island\
    \ and the Small Tidung Island. Those two islands are 1 kilometer away, and to\
    \ reach the other island, there is a wooden bridge above the shallow clear water\
    \ where you can see beautiful corals and fish. People love these islands because\
    \ of their natural beach and the beauty of the underwater scenery. Therefore,\
    \ snorkeling is the best activity to do in this island. Not only that, you can\
    \ also challenge yourself to jump from an 8 meter bridge to the sea. Try it! It\
    \ is a lot more fun when is done in group.\n\n## 36. Kayangan Island/Cipir Island\n\
    \nThis island is so famous for the old buildings the Dutch colony left. There\
    \ are ruins of a fortress, a hospital building, and some old weapons like cannons.\
    \ In this island, we can also find an old freshwater well that is believed to\
    \ be present there for centuries. There are also some ruins of old bridges that\
    \ used to connect the island with other nearby island. You can have a short visit\
    \ to this island and then continue your journey to other island.\n\n## 37. Onrust\
    \ Island\n\nThis island is close to Kayangan Island/Cipir Island. It also has\
    \ almost the same characteristic with Kayangan. The main attraction of this island\
    \ is its ruins. For your information, this island was the first place that the\
    \ Dutch colony visited when they occupy Indonesia and attacked Batavia (now Jakarta).\
    \ So there are many evidences show how strategic this island was for the colony.\n\
    \n## 38. Rambut Island\n\nVisit this place on March to September because you will\
    \ find more than 50,000 of birds that migrated from Australia to this island.\
    \ Rambut island is a bird conservation area. There is a strict rule for the visitors\
    \ to also preserve the bird. Moreover, the island is also famous for its mangrove\
    \ trees. The mangrove trees attracts so many birds to visit this place during\
    \ the migration time. When the birds return back, there are only about 20,000\
    \ birds in this place. To access this place, you must have a permit from Jakarta\
    \ Natural Resources Conservation Bureau. \n\n## 39. Putri Island\n\nWhen you bring\
    \ your family, especially kids, this place is the best island to visit in Thousand\
    \ Islands. You can give an unforgettable experience to your kids because they\
    \ will learn a lot about nature, especially tropical underwater world. Some attractions\
    \ that you can enjoy include underwater aquarium, glass bottom boats, beautiful\
    \ sunrise, morning snorkeling, beautiful resorts, and tasty food.\n\n## 40. Sepa\
    \ Island\n\nPeople call is a paradise for divers. When you first arrive to this\
    \ place, you are welcomed by its beautiful sandy beach and clear water. There\
    \ are coral reef formations with interesting underwater creatures. Even when you\
    \ are not a professional, you still can do snorkeling here. Don’t forget to bring\
    \ your underwater camera. One great hint for you is that the price to rent a boat\
    \ to the diving site is inexpensive. You can also rent a boat to have a trip to\
    \ the other islands along Thousands Islands.\n\n“Life is either a daring adventure\
    \ or nothing.” – Helen Keller\n\n## 41. Kotok Island\n\nIn this island, you can\
    \ find the mascot of Jakarta City, a Brahminy Kite. The government has made this\
    \ place a conservation area for the bird. The character of this island is similar\
    \ to other islands in the Thousand Islands, such as clear water and natural environment.\n\
    \n## 42. Pelangi Island\n\nIt is a great place to escape from your daily routine.\
    \ All the accommodation available in this place are headed to the sea, so that\
    \ you can enjoy great scenery during your stay. You can go diving, snorkeling,\
    \ and fishing. This island also has a health facility and tennis court. One great\
    \ experience is the floating restaurant that offers you great meal and scenery.\n\
    \n## 43. Laki Island\n\nFor you who like to experience the real life in the nature,\
    \ you should visit Pulau Laki. This island offers you a camping and fishing experiences.\
    \ You can also sunbath in the beach with quiet atmosphere. If you don’t want to\
    \ deal with mosquito while camping, don’t forget to bring mosquito repellent.\n\
    \n## 44. Pramuka Island\n"
