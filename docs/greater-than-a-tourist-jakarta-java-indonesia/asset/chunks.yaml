    ## WELCOME TO > TOURIST


    ## Popular Landmarks


    As one of the oldest cities in Indonesia, Jakarta has so many landmarks that become
    the icon of this capital city.


    ### 1. Kota Tua (The Old Town)


    Jakarta was known as Batavia in the old time when Indonesia was still colonized
    by the Dutch. Nowadays, some of the great architectures from the past are still
    being preserved well by the local government, including museums and historical
    buildings. There is one area of Jakarta that is called as Kota Tua that has so
    many old buildings. When we visit this place, we will feel like we returned back
    to the 17th century. Don’t get surprised to see people with old-fashioned appearances
    riding old bikes around the Old Town or women wearing old gown and bringing 17th
    century-styled umbrellas. You can find many people rent out those old fashioned
    wardrobes and properties so that the ancient atmosphere can be sustained in this
    area. It is definitely a great place to visit for its historical and photographic
    attractions.


    ### 2. Wayang Museum (Indonesian Traditional Leather Puppets Museum)


    ## Author Bio


    Travelling in my country is a never ending journey. There will be more and more
    places to visit with their own distinctive and rich characteristics. That is the
    reason why I write Traveling to Indonesia series, so that I can give broader and
    better pictures of Indonesia. The more I travel around the country, the more books
    I will write about Indonesia.

