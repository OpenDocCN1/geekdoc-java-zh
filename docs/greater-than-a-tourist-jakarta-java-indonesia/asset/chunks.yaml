    Wayang is Indonesian traditional leather puppets. The animal’s leathers (commonly
    cow) are used to make many kinds of characters. They are beautifully crafted in
    details by the hands of the chosen artisans. The characters usually resemble the
    life of the common people, the authorities, as well as the superpower beings.
    Because the cost of a single wayang puppet is so expensive, not all people can
    afford it. Furthermore, to make a single performance, you also need a big amount
    of money since the performance consist of one puppeteer and a big team of traditional
    singers (sinden) and gamelan players (a set of Javanese traditional music instruments).
    Therefore, the wayang show is usually performed only in the special occasions.
    To give more opportunities to people, especially the young generations and the
    tourists, to enjoy one of this wonderful cultural traditions, Wayang museum was
    built, so that people can see the development the wayang from time to time and
    glimpses of the uproariously hilarious performances.


    ## 3. Monas


    Monas is the abbreviation of Museum Nasional (National Museum). It is an iconic
    landmark of Jakarta. Basically, Monas is a 132 m (433ft) tower that was build
    to commemorate the Independence of Indonesia. There is a deep philosophical meaning
    behind the design of the monuments, which resembles “the balance of life”. The
    monument is made of Italian marbles and on the top of it is covered with 24 carat
    of gold. don’t say that you have been to Jakarta before you visit this iconic
    monument.


    ## 4. Gedung Kesenian Jakarta (Jakarta Performing Art Theater)


    This place is where many of Indonesian artists meet to perform or discuss about
    art. It is the symbol that the richness of Indonesian cultures has drawn people’s
    attention since the colonial era. This place has various kinds of performances
    and events throughout the year. The event calendar is usually available in Enjoy
    Jakarta official website, Gedung Kesenian Jakarta’s official website and social
    media, as well as in printed media.


    ## 5. Pasar Seni Ancol (Ancol Art Market)


    In my opinion, Ancol is one of the best spot to visit in Jakarta because this
    place offers you with diversities of entertainments. One of them is Pasar Seni
    Ancol (Ancol Art Market). If you really enjoy arts or simply an art collector,
    you must visit the place. Not only you can purchase some paintings or handicrafts
    here, but you can also see the artists creating their masterpieces. There are
    some galleries where the arts are displayed. Cafés and shops are among facilities
    you can enjoy besides the shady green environment.


    ## 6. Museum Nasional Republik Indonesia (Indonesia National Museum)


    There are so many museums available in Jakarta. The existence of the museums indicates
    that the government of Jakarta as well of its people highly appreciated the history
    that forms this nation. Many collections of this museum come from so many regions
    and provinces all over Indonesia. I personally call this museum as the mini version
    of Indonesia. Only by visiting this museum, you can witness the richness of Indonesian
    cultures and traditions. The museum also presents the history of this Republic
    so that it is the best place to learn about Indonesia. Not only displaying its
    collections, the museum also has other events throughout the year. You can also
    create your own exhibition in this museum.


    ## 7. Fatahilah Museum


    If Indonesia National Museum present the collections and the history of Indonesia,
    Fatahilah Museum focuses on the history of Jakarta. It is located in the Old Town
    of Jakarta. You can witness how Jakarta had attracted the eyes of the world since
    the past era for its strategic place to do business and trading. Ancient replicas,
    ceramics, artifacts, inscriptions, murals, and important documents are safely
    preserved in this museum.


    ## 8. Rumah Si Pitung (The House of Pitung)


    Si Pitung was a hero for Jakartanese. He was like the Jakarta’s version of Robin
    Hood, someone who opposed the Dutch colony regime and loved to help the poor native
    people by robbing the riches. To respect him, the Jakartanese made this museum,
    which originally the house of a rich people in the past that had been robbed by
    Si Pitung.


    ## 9. Textile Museum


    As a country that has thousands of islands and ethnic groups, textile has become
    an important aspect of Indonesia’s society. Every ethnic group in Indonesia has
    many sub-ethnics; and every sub-ethnic has many different versions of traditional
    textiles. So, you can imagine that the variations of patterns and cloths in Indonesia
    are countless. Indonesian textiles have now drawn international’s attention for
    their unique patterns, materials, and methods of making. Only few that are displayed
    in this museum (because several provinces and cities in Indonesia also has their
    own museum), but it is enough to see the diversity of Indonesian textiles.


    ## 10. Jakarta Planetarium and Observatory


    This planetarium and observatory is a part of Taman Ismail Marzuki, which is also
    an exhibition and performance center in Jakarta. It is the oldest among three
    other planetariums in Indonesia. In this place, there are an observatory hall,
    exhibition halls, classrooms, and telescopes. There are also 9 movies with the
    duration of 60 minutes each for the visitors to learn about astronomy.


    “The world is a book, and those who do not travel read only one page.” – Saint
    Augustine


    ## Amusement Parks and Zoos


    As one of the most populated city in the world, entertainment becomes crucial
    for its residents. In Jakarta, there are so many theme parks that are build especially
    as means of recreations and educations. Some of them are:


    ## 11. Taman Impian Jaya Ancol or Dunia Fantasi (Jaya Ancol Recreational Park
    aka. The Fantasy Land of Ancol)


    You can call it the Indonesian version of Universal Studio or Disneyland. In this
    Fantasy World, you can challenge yourself with so many adventurous games and rides,
    like water games, giant wheels or roller coasters. Some theme parks are also built
    inside it, including Hello Kitty Adventure, Ice Age Arctic Adventure, Happy Feet
    Adventure, Star Wars Adventure, and many more. Accommodation facilities are also
    built along the beach of Ancol with variety of prices. In all, this place is best
    for family recreations.


    ## 12. Taman Mini Indonesia Indah (Beautiful Indonesia Miniature Park)


    If you don’t have time to explore the archipelago of Indonesia, you should visit
    this place. It is a culture-base park, so that in this place, you can witness
    the diversities of all provinces in Indonesia. Traditional houses, costumes, cloths,
    weapons, dances, musical instruments, food, tools, floras, faunas, and more are
    here in one place. You need to have good stamina to explore the whole place for
    it is quite vast. Although vehicles like tour bus, tour car, skylift, joyride
    train, monorail, and bicycles are available, taking a walk to get close to and
    experience the real Indonesia’s culture is highly advisable.


    ## 13. Ocean Ecopark


    Ocean Ecopark is also located in Ancol. In this place, you can do so many outdoor
    activities like having an eco-cruise or eco-bike, doing outbound activities, playing
    paintball games, visiting energy house and bee house, canoeing, experiencing an
    eco market, and participating in farming class. This place is suitable for kids
    for they will learn a lot by visiting it. For the resident of the metropolitan,
    this place is a great picnicking spot.


    ## 14. Sky Rink Jakarta


    Although Indonesia is a tropical country, skating has become a popular sport,
    especially for the resident of big cities like Jakarta. Sky Rink Jakarta is located
    in one of the biggest mall in Indonesia, Taman Anggrek Mall. Sky Rink is also
    the biggest skating venue in the South East Asia. Many people come to this place
    only to experience this winter sport, but some have done it professionally by
    taking classes and joining skating competitions.


    ## 15. Ayodya Park

