    ## 欢迎来到 > 游客


    ## 热门地标


    作为印度尼西亚最老的城市之一，雅加达拥有许多成为这座首都标志的地标。


    ### 1. Kota Tua（老城区）


    在印度尼西亚仍被殖民的古代，雅加达被称为巴达达。现在，过去的一些伟大建筑仍当地政府完好保存，其中包括博物馆和历史建筑。雅加达有一个名为 Kota Tua 的区域，那里有很多老建筑。当我们访问这里时，感觉就像回到了
    17 世纪。当你看到穿着古装的人骑着旧自行车在老城区穿行，或者女性穿着长袍拿着 17 世纪风格的伞，不要感到惊讶。你可以发现很多人租用那些古服和道具，以保持这个地区的古代氛围。对于历史和摄影爱好者来说，这里绝对是一个值得去的地方。


    ### 2. 皮影博物馆（印度尼西亚传统皮影戏博物馆）


    ## 作者简介


    在自己的国家旅行是一场永无止的旅程。会有越来越多具有独特特色和丰富特征的地方等待探索。这就是我编写《旅行印度尼西亚》系列书籍的原因，以便提供更广阔、更出色的画面。我在这个国家旅行得越频繁，关于印度尼西亚的书就越多。


