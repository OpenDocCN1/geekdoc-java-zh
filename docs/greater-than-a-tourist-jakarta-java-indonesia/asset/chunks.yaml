  raw: 'It is a free holiday spot in Jakarta. Usually, people gather in this place
    to escape from the business of the metropolitan. Young people like to meet up
    in this place every weekend and Sunday morning to do some jogging or to chat with
    friends. If you want to converse with real Indonesian people, come to this place
    and start a conversation. You can also practice Indonesian for free if you meet
    just the right person to teach you some.


    16. Ragunan Zoo


    This zoo has many collections of Indonesian faunas. Some of the collections are
    endangered animals, such as Orang Utan, Sumatran Tiger, Grey-headed fish eagle,
    Irian eagle, Cassowary, and many more. In this place, you can also visit a primate
    center, a reflection park, and a kid zoo. Some attractions like elephant riding,
    animal shows, camel riding, and horse riding are available. It is such a nice
    place to visit when you are visiting Jakarta.


    17. Waterbom Jakarta and Water Boom Cikarang


    In the hot tropical weather of Jakarta, water sport is always the best option
    to cool yourself down. In Jakarta, there are many swimming pools and water recreational
    areas to visit. The two most famous ones are Waterbom Jakarta and Water Boom Cikarang.
    Both places offer you with so many water sport attractions like water sliding,
    pools, and giant buckets.


    18. Kidzania


    I can tell you that this is the best education park in the city. In this place,
    kids can learn about professions and experience them. Kids will learn how to perform
    certain jobs in the real working situations. After that they will receive a short
    of payment in which they can decide what to purchase with the money. It is a great
    place to introduce the real society to the children. Not only they will learn
    about professions and management, they will also learn about social life, in which
    they have to build networking and good team works.


    Festivals and Celebrations


    ## 19. Jakarta International Jazz Festival


    This is an annual jazz event in Indonesia that is usually held for three days
    in a row in Jakarta at the end of November or early December. This event was firstly
    made in 1988 and have hypnotized jazz lovers in Indonesia ever since. Besides
    inviting national jazz musicians, this event also presents international jazz
    artists every year. There will be several stages in the venue so that you can
    choose to see who is performing on the stage.


    ## 20. Java Jazz Festival


    Java Jazz Festival is one of the biggest annual international jazz festival sin
    the world and absolutely the biggest one in the South East Asia. Hundreds of local
    and international jazz artists perform every year to entertain not only people
    of Jakarta and Indonesia, but also all over the world. The great things about
    this jazz festival is the coming and performances of so many artists beyond the
    jazz genre, such as Craig David, Jassie J, Jason Mraz,  Brian McKnight, Babyface,
    Santana and many more. Big names in the Jazz music industry, including Incognito,
    James Brown, Jamie Cullum, and even Herbie Hancock have ever performed in this
    mega event. To experience this, you should visit Jakarta in early March.


    “To awaken alone in a strange town is one of the pleasantest sensations in the
    world.” – Freya Stark


    21. Jakarta International Film Festival


    This event is more popular with the nick name of JiFFest. This event is held to
    give appreciation to the national and international movie industry. Hundreds of
    high quality movie collections are shown every year between October to December.
    Discussions and workshops are also held to give rooms for the movie makers and
    anyone interested to the movie making to present their ideas and creativity. Some
    competitions are also held during and prior to the event to find the best talent
    in movie productions.


    22. Java Rockin’ Land


    I may say that Jakarta is the city of music. There are so many music festival
    held in this city every year. Many international concerts were also held successfully
    in this city that never sleeps. One of them is Java Rockin’ Land. This rock festival
    is under the same management with Java Jazz Festival. Therefore, the quality of
    the show is great.


    23. Indonesia’s Independence Day Celebration


    The celebration will be on August 17 every year. Traditionally, there will be
    a “pesta rakyat /folks parties” all over Indonesia. People will start the celebration
    several weeks before the D-day. There are so many sport events, competitions,
    and traditional games held in every neighborhood, in which the people from young
    children to elderly will eagerly participate. One of the most popular one is “panjat
    pinang” in which the participants should climb a high coconut tree that is smeared
    with slippery oil to get some lucrative present at the top of it. If you want
    to experience these folk parties, you should visit Jakarta in August. I bet that
    you can build better connection with local people easily because there will many
    fun activities to enjoy and most people will come to celebrate it. Besides, there
    are also hundreds of concerts available in the Independence day’s celebration.
    People can watch the music shows which features various genres, including the
    local music genres. The shows are packed with famous artist and musicians and
    are mostly free.


    24. Festival Kota Tua (the Old Batavia Festival)


    Another annual event in Jakarta is the Old Batavia Festival. Batavia was the name
    of Jakarta in the past. So in this festival, there will be so many things related
    to the history of Jakarta will be presented. Some of them is culinary festival,
    cultural performances, creative industry exhibition, as well as bazaar. One thing
    I love about this festival is the authentic Betawi dishes such as kerak telor
    (egg and rice crackers) and nasi uduk (Indonesian Rice with coconut sauce and
    side dishes) that can easily be found in affordable prices. This festival is usually
    held to commemorate the anniversary of Jakarta.


    25. Jakarta Great Sale


    If you are shopaholic, you must love to visit Jakarta in June-July. Hundreds of
    malls, shopping centers, and regular shops participate in this event by giving
    crazy discounts (up to 70%) and midnight sales. The great thing is that many online
    stores in Jakarta also participate in this event. June and July is the month where
    people can go crazy in the mall for many branded items are sold in good deals.


    26. Jakarta Fair


    Jakarta fair is held to celebrate the anniversary of Jakarta. Usually the event
    is held from June-July in the form of bazaar, exhibitions, food parade, music
    concerts, night fair and amusement rides, and many more. You can have cultural
    and culinary experiences in this place. If you want to know Jakarta closer, you
    must visit this place.


    27. Festival Pasar Baru


    Pasar Baru is the name of one of the oldest shopping precincts in Jakarta. This
    festival is held to attract more visitors to visit this market because the establishment
    of malls in Jakarta has reduced the visitors of the traditional market like this.
    In the festival that is usually held in June, you can see some cultural performances.
    Although having similar concept, this festival is more humble than the Jakarta
    Fair. However, I can say that the mission of holding this event is so noble. One
    great advantage of visiting the market is you can find many affordable items like
    clothes and shoes that are made more traditionally by local people. Similar to
    the Jakarta Fair, this event is held every June-July.


    28. Festival Kemang


    This festival is basically and art and culture festival of Indonesian people that
    is held annually in Jakarta along the Kemang Street (yes, this festival is held
    on the street). Hundreds of booths are present, showing the artwork and traditional
    creation from people all around Indonesia. You can buy traditional ethnic accessories,
    handicrafts, and various types of Indonesian batik and traditional cloths. It
    is the place where you can see the face of Indonesia in only a-kilometer-away
    exhibition booths.'
