    \n## Exception 类\n\n它派生自 `Throwable` 类。`Exception` 类（及其子类）是可恢复的异常。\n通常，`Exception`\
    \ 充当自定义异常的父类。\n`Exception` 类是编译器检查的，也就是说如果不进行处理，程序员将得到编译错误。`Exception` 类的签名是：\n\
    \n```\npublic class Exception extends Throwable\n```\n\n让我们通过程序更好地理解 `Exception`\
    \ 类。\n\n```\n// Program 4\n// Description: Exception behavior\nclass Program {\n\
    \    public static void main(String[] args) {\n        throw new Exception();\n\
    \    }\n}\n```\n\n该程序会产生编译错误，因为 `Exception` 类是编译器检查的。要克服编译错误，请处理异常或声明它。\n\n##\
    \ RuntimeException 类\n\n它派生自 `Exception` 类。`RuntimeException` 类（及其子类）不是编译器检查的。签名是：\n\
    \n```\npublic class RuntimeException extends Exception\n```\n\n通常 `RuntimeException`\
    \ 是可以通过编程手段防止的异常。例如 `NullPointerException`、`ArithmeticException`、`ArrayIndexOutOfBoundsException`\
    \ 等。\n如果程序员在调用任何方法之前检查空值，`NullPointerException` 就不会发生。同样，如果你检查了索引，`ArrayIndexOutOfBoundsException`\
    \ 也不会发生。\n\n让我们通过示例更好地理解 `RuntimeException`。\n\n```\n// Program 5\n// RuntimeException\
    \ is compiler checked\n// RuntimeException(and child class) exceptions are not\
    \ compiler checked\nclass Program {\n    public static void main(String args[])\
    \ {\n        throw new RuntimeException();\n    }\n}\n```\n\n当该程序编译时不会产生任何错误。执行时它会导致程序崩溃。\n\
    \n## 总结\n\n`Throwable` 类是异常层次结构中所有类的类。`Throwable` 和 `Exception` 类是编译器检查的。`Error`\
    \ 类表示不可恢复的异常，它也是不可恢复的。`RuntimeException` 类不是编译器检查的，是可以恢复的。\n\n## 第 5 章\n## Try\
