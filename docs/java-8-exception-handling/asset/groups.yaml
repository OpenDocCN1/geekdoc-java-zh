    +e);\n            isException= true;\n            return;\n        } catch (Exception\
    \ e) {\n            System.out.println(\"The Exception message is:\"+e);\n   \
    \         isException= true;\n            return;\n        }\n\n        finally\
    \ { // 当程序中止时，finally block不执行。\n            if(isException)\n               \
    \ System.out.println(\"The finally block is executed when there is return from\
    \ method\");\n            else\n                System.out.println(\"The finally\
    \ block is also executed when there return from catch\");\n        }\n    }\n\
    }\n```\n\nOutput: The finally block is not executed.\n\n### 总结\n即使遇到 `return`\
    \ 关键字，finally 块也能保证执行。如果执行了 `System.exit()` 函数，finally 块将不会执行。\n\n# 第 11 章\n受检异常与未检异常\n\
    \n### 话题\n- Throws 关键字\n- 受检异常 (Checked Exception)\n- 未检异常 (Unchecked Exception)\n\
    \n### Throws 关键字\n它用于为方法声明异常。它有助于预先处理给定方法的异常。一个方法可以 `throws` 多个异常。从方法中 `throws`\
    \ 的异常必须被处理，否则编译器会报错。\n\n### 语法：\n```java\nvoid PerformIO() throws IOException\
    \ { .... }\n```\n\n让我们通过一个示例来理解 “throws” 关键字。\n\n```java\n//Program 1\n//Description:\
    \ 理解 throws 关键字的用法\n\nimport java.io.*;\nclass Program {\n    static void AcceptData()\
    \ throws IOException {\n        int i = System.in.read();\n    }\n    public static\
    \ void main(String args[]) throws Throwable {\n        throw new Throwable();\n\
    \    }\n}\n```\n\n在上面的程序中，对于 `AcceptData` 方法必须处理 `IOException`。处理它的一种方法是使用 `throws`\
    \ 声明异常。同样的方法也适用于 `main` 方法。\n\n### 受检异常 (Checked Exception)\n这些是会被编译器识别的异常。所有继承自\
    \ `Throwable` 或 `Exception` 类都是受检异常。如果受检异常没有被处理，编译器会标记。受检异常必须被处理。这是增强异常可靠性的极佳方法。让我们通过示例更好地理解受检异常。\n\
    \n```java\n//Program 2\n// 理解受检异常\n\nimport java.io.*;\nclass Program {\n    static\
    \ void AcceptData() {\n        int i = System.in.read();\n    }\n    public static\
    \ void main(String args[]) {\n        throw new Throwable();\n    }\n}\n```\n\n\
    Output: A checked exception has to be handled.\n\n```\nPrg.java:7: error: unreported\
    \ exception IOException; must be caught or declared to be thrown\nint i = System.in.read();\n\
    \    ^\nPrg.java:10: error: unreported exception Throwable; must be caught or\
    \ declared to be thrown\n    throw new Throwable();\n    ^^\n2 errors\n```\n\n\
    受检异常可以通过两种方式处理：\n\n- a. Try... Catch 块\n- b. Throws 关键字\n\n### 未检异常 (Unchecked\
    \ Exception)\n它们不被编译器识别。它们也被称为运行时异常。所有继承自 `RuntimeException` 类的类都是未检的。未检异常的示例包括\
    \ `NullPointerException`、`ArithmeticException` 和 `ClassCastException`。\n\n```java\n\
    //Program 3\n// Description: 理解未检异常\nimport java.io.*;\nclass Program {\n    public\
    \ static void main(String[] args) {\n        throw new RuntimeException(); //\
    \ 可以通过\n        // 检查来避免。\n    }\n}\n```\n\n在上面的程序中，编译器不会报告任何错误，因此它是未检异常。\n\n\
    ### 总结\n受检异常由编译器捕获。未检异常在运行时识别。\n`throws` 关键字用于将异常作为方法定义的一部分进行声明。\n\n# 第 12 章\n\
    嵌套异常\n\n### 话题\n- 实现嵌套异常\n- 嵌套异常处理的生命周期\n- 总结\n\n### 实现嵌套异常\n当 `try` 块被嵌套时，它被称为异常的嵌套，即：当一个\
    \ `try` 块位于另一个 `try` 块内部时，被称为异常嵌套。Java 支持任意深度的异常嵌套。让我们通过一个示例来理解这一点。\n\n```java\n\
    // Program 1\n// Description : 异常嵌套\n\nclass Program {\n    static void Sum(String\
    \ ar[]) {\n        try {\n            int i = Integer.parseInt(ar[0]);\n     \
    \       int j = Integer.parseInt(ar[1]);\n            int sum = i+j;\n       \
    \     System.out.println(\"The sum is :\"++sum);\n        } catch (NumberFormatException\
    \ e) {\n            System.out.println(\"Numberformatexception message\"+e.getMessage());\n\
    \        }\n    }\n    public static void main(String args[]) {\n        try {\n\
    \            Sum(args);\n        } catch(ArrayOutOfBoundsException e) {\n    \
    \        System.out.println(\"ArrayOutOfBoundsException message is :\"+e);\n \
    \       }\n    }\n}\n```\n\nOutput: 如果用户没有传递任何参数，程序将在 `Sum` 方法的类型转换时失败。生成的 `ArrayOutOfBoundsException`\
    \ 异常不会被内部 catch 捕获，但会被外部 catch 捕获。\n\n![](img/82490df1c0b44475c1a824453ea9473e_43_0.png)\n\
    \n### 嵌套异常处理的生命周期\n嵌套异常的工作可以通过三个步骤识别，即：\n\n1. 当异常在嵌套 `try` 中发生时，内部最内层的 `catch+finally`\
    \ 首先获得机会。\n2. 如果内部 `try` 无法处理异常，外部 `try` 的 `catch/finally` 将获得机会。\n3. 如果外部 try\
    \ 也无法处理，程序崩溃。\n4. 如果异常在内部 catch 中被处理，它就不会冒泡到外部 try。即使在嵌套异常中，异常也只捕获一次。\n\n行为：\n\
    \n- a. 无论是否发生异常，所有 `try` 块的 finally 块都会执行。\n- b. 如果异常在内部 try 中被捕获，它不会冒泡，但如果外部\
    \ try 有 finally 块，则它将被执行。\n\n"
