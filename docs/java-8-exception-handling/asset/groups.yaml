    \ `Throwable` 类的子类。`Error` 类表示所有不可恢复的异常。程序可能会遇到严重问题，如 `OutOfMemoryError`、`StackflowError`、`VirtualMachineError`\
    \ 等。当程序遇到此类情况时，即使进行了异常处理，程序也会崩溃，因为这些是不可恢复的异常。让我们通过程序更好地理解这一点。`Error` 类不是编译器检查的。\n\
    \n```\n// Program 3\n// Program to demonstrate Error class (Stackoverflow)\nclass\
