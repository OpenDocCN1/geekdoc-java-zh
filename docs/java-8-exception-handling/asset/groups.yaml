    - Throwable 类\n- Exception 类\n- RuntimeException 类\n- Error 类\n- 总结\n\n## 什么是异常层次结构？\n\
    \nJava 在 API 中有一个特定的类层次结构来容纳 `Exception` 类。`Throwable` 类是 Java 中所有异常类的父类。下面是表示\
    \ Java 异常层次结构的示意图。\n\n![](img/82490df1c0b44475c1a824453ea9473e_13_0.png)\n\n基本上有四个类非常重要，即\
    \ `Throwable`、`Error`、`Exception` 和 `RuntimeException`。在后面的章节中我将讨论每一个。\n\n## Throwable\
    \ 类\n\n它是所有异常类的父类，也就是说即使程序员必须创建自定义异常，也必须直接或间接继承 `Throwable` 类。没有直接或间接继承自 `Throwable`\
    \ 类的异常是无法被抛出（引起）。\n\n`Throwable` 类的签名如下：\n\n```\npublic class Throwable extends\
