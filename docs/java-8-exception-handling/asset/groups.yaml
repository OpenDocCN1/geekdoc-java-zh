    \ 计划”。\n\n并不是所有的运行时错误都是可以恢复的，某些被称为异步异常的特定异常是无法恢复的，例如：内存溢出错误（Out of memory error）。\n\
    \n## 异常处理的必要性\n\n使用异常处理，程序员可以在调用栈上传播异常，这有助于识别异常产生。Java 支持任意深度的嵌套异常处理。异常处理用于识别和分组运行时错误，从而实现更快的诊断。所有上述努力都有助于\
    \ Java 程序的可靠性和质量，从而减少应用程序的故障间隔时间（MTBF），这是异常处理的首要目标，即提高程序的可靠性。\n\n## 执行异常处理\n\n\
    Java 中的异常处理是借助异常处理关键字完成的。Java 中有五个用于执行异常的关键字。这些关键字列举如下：\n\n- a. Try 块 – 它识别封装脆弱代码的代码区域。\n\
    - b. Catch 块 – 用于识别可能发生的唯一异常。\n- c. Catch 块 – 有助于对发生的异常进行分组并提供诊断。\n- d. Finally\
    \ 块 – 用于执行清理工作。\n- Throw 关键字 – 用于抛出异常。\n- e. Throws 关键字 – 用于为方法声明异常。\n\n现在让我们来看一个使用\
