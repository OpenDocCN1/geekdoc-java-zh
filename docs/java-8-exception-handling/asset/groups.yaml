    # What is Exception Handling?


    Exception handling is the process of responding to runtime error that happen during
    program execution. It is a mechanism to capture and identify runtime error to
    avoid abrupt crash of a program. Exception handling helps in avoiding sudden crash
    of a program, using it programmer can provide a diagnosis of the runtime error.
    Exception handling changes the flow of the program, using it user can recover
    exceptional situation in an application. In simple words it is a plan ‘B’ when
    something goes wrong within the program at runtime.


    Not all runtime errors are recoverable certain exceptions which are called as
    Asynchronous exceptions cannot be recovered e.g. Out of memory error.


    # Need for Exception Handling


    Using Exception handling programmer can propagate exception on the call stack,
    which help in identifying the cause of the exception. Java has support for nested
    exception handling up to any depth. Exception handling is used for identifying
    and grouping the runtime error which yields quicker diagnosis. All the above efforts
    help in improving the reliability and quality of the Java program hence reducing
    the mean time between failure of an application and this is the prime objective
    of exception handling i.e. increasing the reliability of a program.


    # Performing Exception Handling


    Exception handling in Java is done with the help of exception handling keywords.
    There are five keyword that are used for performing exception in java. These keywords
    are listed below.


    +   a. Try block – It identifies the code area which encapsulate the vulnerable
    code.


    +   b. Catch block– It is used for identifying the unique exception which is might
    occur.'
