- md: "\n# Java™ 8 Exception Handling\n\nDevelop Reliable Java Applications\n\n# Mahavir\
    \ DS Rathore\n\n# Black Book Series\n\n# JavaTM 8\nException Handling\n\nMahavir\
    \ DS Rathore\n\n# Copyright\n\nJava™ 8 Exception Handling by Mahavir DS Rathore.\
    \ While every precaution has been taken in the preparation of this book the author\
    \ assumes no responsibility for errors or omissions, or for damages resulting\
    \ from the use of the information contained herein.\n\n# About the author\n\n\
    I have been programming & teaching Java for last 18 years. This book is an effort\
    \ to document my knowledge to share with everyone across the world. I am available\
    \ to do training Java anywhere in the world. My email is gurumahaveer@gmail.com.\n\
    \n# Who should read the book?\n\nThis book is for programmers who already know\
    \ Core Java (Java Standard Edition) and are interested to acquire better understanding\
    \ of exception handling.\n\n# Acknowledgement\n\nJava is owned by Oracle and trademark\
    \ is acknowledged.\n\n# Dedication\n\nTo the inventors of the Java Language.\n\
    \n# Source Code\n\nFor source code of this book please send me a mail at gurumahaveer@gmail.com.\n\
    \n## Table of Content\n\n| Sl.No | Chapter | HyperLink |\n|---|---|---|\n| 1 |\
    \ Java Setup | Go |\n| 2 | What is Exception? | Go |\n| 3 | What is Exception\
    \ Handling? | Go |\n| 4 | Java Exception Hierarchy | Go |\n| 5 | Try and Catch\
    \ Block | Go |\n| 6 | Exception Handling API | Go |\n| 7 | Multiple Catch | Go\
    \ |\n| 8 | Multiple Exceptions | Go |\n| 9 | Finally Block | Go |\n| 10 | Finally\
    \ and return keyword | Go |\n| 11 | Checked and Unchecked Exception | Go |\n\n\
    | Sl.No | Chapter | HyperLink |\n|---|---|---|\n| 12 | Nested Exception | Go |\n\
    | 13 | Throw Keyword | Go |\n| 14 | Exception Chaining | Go |\n| 15 | Try with\
    \ Resource | Go |\n| 16 | Overriding Exception | Go |\n| 17 | User Defined Exception\
    \ | Go |\n\n## Chapter 1: Software Setup\n\n- Introduction\n- Software Required\n\
    - Verifying Installation\n- Summary\n\n### Introduction\nIn this chapter I will\
    \ show how to get and install the required software needed for learning exception\
    \ handling using Java. There are many options available to have the required setup\
    \ based upon operating system.\n\nJava is free to download technology platform\
    \ from oracle, many languages are supported on Java platform. Wikipedia has an\
    \ exhaustive list of all JVM languages which can be seen by visiting https://en.wikipedia.org/wiki/List_of_JVM_languages\
    \ .\n\n### Software Required\nTo develop Java programs you would need at the minimum\n\
    \n- a. Java SE Development Kit (Java 8)\n- b. Code editor\n\nThis is irrespective\
    \ of the operating system. In this book I will be using Java on Windows OS.\n\n\
    Let's look at various software that are needed and from where we can get them.\n\
    \n- a. Java SE Development Kit – http://www.oracle.com/technwork/java/javase/downloads/jdk8-downloads-2133511.html\n\
    \nThis is Java Standard Edition. Ensure you choose the correct JDK i.e. after\
    \ identifying operating system and architecture (32 bit or 64 bit). The latest\
    \ version is 8. It is very important to be cautious when downloading and installing\
    \ Java, many programmers make mistake of just downloading JRE and installing it.\
    \ JRE is the minimum environment required by a Java program to run where JDK is\
    \ the minimum environment to compile and execute Java program, ensure you download\
    \ JDK not JRE.\n\n- b. Code editor – I prefer to use Notepad++. Notepad++ is a\
    \ great code editor, it has support for over 24 languages and it is open source.\
    \ The latest version can be downloaded from: https://notepad-plus-plus.org/download/v6.8.8.html.\
    \ You can also use other code editors or IDE such as eclipse, netbeans etc.\n\n\
    ### Verifying Installation\nOn 32 bit Windows the Java SE is installed in “C:\\\
    Program Files (x86)\\Java\" by default. On 64 bit Windows it is installed in “C:\\\
    Program Files\\Java” by default.\n\nTo check if JDK is installed on your PC go\
    \ to command line and run\na. java -version\nb. javac -version\n\nIf command is\
    \ not recognized, then you need to set environment variable.\n\na. Open System\
    \ Properties\nb. Click on Advanced tab\nc. Click Environment Variables\nd. Select\
    \ Path and click Edit\ne. Click New and add the path to JDK bin folder\nf. Click\
    \ OK on all windows\n\nNow open new command prompt and run\na. java -version\n\
    b. javac -version\n\nIf version is displayed, then Java installation is successful.\n\
    \n## Chapter 2: What is Exception?\n\n- What is Error?\n- What is Exception?\n\
    - Why to do Exception Handling?\n- Summary\n\n### What is Error?\nError is an\
    \ unexpected situation that occurs during runtime which cannot be handled by the\
    \ program.\n\n```java\nclass ErrorExample {\n    public static void main(String[]\
    \ args) {\n        // Recursive call to cause StackOverflowError\n        main(args);\n\
    \    }\n} // above code, the program will crash with StackOverflowError. This\
    \ is because the recursion is infinite and the stack becomes full. Errors are\
    \ usually not caught by programs. Examples include OutMemoryError, StackOverflowError,\
    \ VirtualMachineError.\n\n### What is Exception?\nException is an event that occurs\
    \ during the execution of a program which disrupts the normal flow of its instructions.\n\
    \n```java\nclass ExceptionExample {\n    public static void main(String[] args)\
    \ {\n        int a = 10;\n        int b = 0;\n        int c = a / b; // This will\
    \ throw ArithmeticException\n        System.out.println(c);\n    }\n} // above\
    \ code, the program will crash with ArithmeticException. However, exceptions can\
    \ be caught and handled using try-catch block.\n\n### Why to do Exception Handling?\n\
    Exception handling is a mechanism to handle runtime errors so that normal flow\
    \ of the application can be maintained.\n\n```java\nclass HandlingExample {\n\
    \    public static void main(String[] args) {\n        try {\n            int\
    \ a = 10;\n            int b = 0;\n            int c = a / b;\n        } catch\
    \ (ArithmeticException e) {\n            System.out.println(\"Cannot divide by\
    \ zero!\");\n        }\n        System.out.println(\"Program continues...\");\n\
    \    }\n} // above code, the program will continue execution after handling the\
    \ exception.\n\n### Summary\nError is an unexpected situation that cannot be handled\
    \ by the program. Exception is an event that occurs during execution which disrupts\
    \ the normal flow of instructions. Exceptions can be caught and handled.\n"
  mdcn: "\n\n# Java™ 8 异常处理\n\n开发可靠的 Java 应用\n\n# Mahavir DS Rathore\n\n# 黑书系列\n\n\
    # JavaTM 8\n异常处理\n\nMahavir DS Rathore\n\n# 版版权\n\nJava™ 8 异常处理由 Mahavir DS Rathore\
    \ 编写。在准备本书的过程中已采取一切预防措施，但作者对任何错误或遗漏，或因使用本文包含的信息而导致的损害不承担任何责任。\n\n# 关于作者\n\n在过去的\
    \ 18 年里，我一直从事 Java 编程和教学。这本书是我记录自己的知识并与全球的人分享的努力。我可以在世界任何地方提供 Java 培训。我的邮箱是 gurumahaveer@gmail.com。\n\
    \n# 谁应该读这本书？\n\n这本书面向那些已经熟悉核心 Java（Java 标准版）并对深入理解异常处理感兴趣的程序员。\n\n# 致谢\n\nJava\
    \ 归 Oracle 所有，相关商标已获得认可。\n\n# 献辞\n\n献给 Java 语言的发明者。\n\n# 源代码\n\n如需本书的源代码，请发送邮件至\
    \ gurumahaveer@gmail.com。\n\n## 目录\n\n| 序号 | 章节 | 链接 |\n|---|---|---|\n| 1 | Java\
    \ 环境搭建 | [跳转](#) |\n| 2 | 什么是异常？ | [跳转](#) |\n| 3 | 什么是异常处理？ | [跳转](#) |\n| 4\
    \ | Java 异常层次结构 | [跳转](#) |\n| 5 | Try 和 Catch 块 | [跳转](#) |\n| 6 | 异常处理 API |\
    \ [跳转](#) |\n| 7 | 多重 Catch | [跳转](#) |\n| 8 | 多重异常 | [跳转](#) |\n| 9 | Finally\
    \ 块 | [跳转](#) |\n| 10 | Finally 和 return 关键字 | [跳转](#) |\n| 11 | 检点异常与非检点异常 |\
    \ [跳转](#) |\n\n| 序号 | 章节 | 链接 |\n|---|---|---|\n| 12 | 嵌套异常 | [跳转](#) |\n| 13\
    \ | Throw 关键字 | [跳转](#) |\n| 14 | 异常链 | [跳转](#) |\n| 15 | Try-with-resources |\
    \ [跳转](#) |\n| 16 | 重写异常 | [跳转](#) |\n| 17 | 用户自定义异常 | [跳转](#) |\n\n## 第 1 章：软件安装\n\
    \n- 引言\n- 所需软件\n- 验证安装\n- 总结\n\n### 引言\n在本章中，我将展示如何获取并安装学习 Java 异常处理所需的软件。根据操作系统的不同，有多种方案可以完成所需的设置。\n\
    \nJava 是 Oracle 提供的免费下载技术平台，Java 平台支持许多语言。维基百科列出了所有 JVM 语言的详细列表，可以通过访问 https://en.wikipedia.org/wiki/List_of_JVM_languages\
    \ 查看。\n\n### 所需软件\n要开发 Java 程序，你至少需要：\n\n- a. Java SE 开发工具包 (Java 8)\n- b. 代码编辑器\n\
    \n这与操作系统无关。在本书中，我将在 Windows 系统上使用 Java。\n\n让我们来看看需要的各种软件以及从哪里获取它们。\n\n- a. Java\
    \ SE 开发工具包 – http://www.oracle.com/technwork/java/javase/downloads/jdk8-downloads-2133511.html\n\
    \n这是 Java 标准版。请确保选择正确的 JDK，即在识别操作系统和架构（32 位或 64 位）后选择。最新版本是 8。在下载和安装 Java 时要非常小心，许多程序员犯了只下载\
    \ JRE 并安装的错误。JRE 是 Java 程序运行所需的最小环境，而 JDK 是编译和执行 Java 程序的最小环境，请确保你下载的是 JDK 而不是\
    \ JRE。\n\n- b. 代码编辑器 – 我倾向于使用 Notepad++。Notepad++ 是一款优秀的代码编辑器，支持超过 24 种语言且开源。最新版本可以从这里下载：https://notepad-plus-plus.org/download/v6.8.8.html。你也可以使用其他编辑器或\
    \ IDE，如 eclipse、netbeans 等。\n\n### 验证安装\n在 32 位 Windows 上，Java SE 默认安装在 “C:\\\
    Program Files (x86)\\Java”。在 64 位 Windows 上，默认安装在 “C:\\Program Files\\Java”。\n\
    \n要检查电脑上是否安装了 JDK，请打开命令行并运行\na. java -version\nb. javac -version\n\n如果无法识别命令，则你需要设置环境变量。\n\
    \na. 打开系统属性\nb. 点击“高级”选项卡\nc. 点击“环境变量”\nd. 选择 Path 并点击“编辑”\ne. 点击“新建”并添加 JDK bin\
    \ 文件夹的路径\nf. 点击所有窗口上的确定\n\n现在打开新的命令行并运行\na. java -version\nb. javac -version\n\
    \n如果显示了版本号，说明 Java 安装成功。\n\n## 第 2 章：什么是异常？\n\n- 什么是错误 (Error)？\n- 什么是异常 (Exception)？\n\
    - 为什么要进行异常处理？\n- 总结\n\n### 什么是错误 (Error)?\n错误是在运行时发生的程序无法处理的意外情况。\n\n```java\n\
    class ErrorExample {\n    public static void main(String[] args) {\n        //\
    \ 递归调用导致 StackOverflowError\n        main(args);\n    }\n} // 上述代码，程序将以 StackOverflowError\
    \ 崩溃。这是因为递归是无限的，栈溢满了。错误通常不会被程序捕获。示例包括 OutMemoryError、StackOverflowError、VirtualMachineError。\n\
    \n### 什么是异常 (Exception)?\n异常是程序执行过程中发生的事件，会中断指令的正常流。\n\n```java\nclass ExceptionExample\
    \ {\n    public static void main(String[] args) {\n        int a = 10;\n     \
    \   int b = 0;\n        int c = a / b; // 这将抛出 ArithmeticException\n        System.out.println(c);\n\
    \    }\n} // 上述代码，程序将以 ArithmeticException 崩溃。然而，异常可以使用 try-catch 块进行捕获和处理。\n\n\
    ### 为什么要进行异常处理？\n异常处理处理运行时错误的机制，以便维持应用程序的正常流。\n\n```java\nclass HandlingExample\
    \ {\n    public static void main(String[] args) {\n        try {\n           \
    \ int a = 10;\n            int b = 0;\n            int c = a / b;\n        } catch\
    \ (ArithmeticException e) {\n            System.out.println(\"不能除以零！\");\n   \
    \     }\n        System.out.println(\"程序继续...\");\n    }\n} // 上述代码，程序在处理异常后将继续执行。\n\
    \n### 总结\n错误是程序无法处理的意外情况。异常是执行过程中发生的中断指令正常流的事件。异常可以被捕获和处理。\n\n"
