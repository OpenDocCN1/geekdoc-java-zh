    \ The finally block is executed\n```\nArrayIndexOutOfBoundsException Message :java.lang.ArrayIndexOutOfBoundsException:\
    \ 0\nThe finally block is also executed when there return from catch\n```\n\n\
    // Program 2\n\n```java\n//Description: 当控制流遇到\n// System.exit() 函数时，finally block不执行。\n\
    \nclass Program {\n    public static void main(String args[]) {\n        boolean\
    \ isException = false;\n        try {\n            int i = Integer.parseInt(args[0]);\n\
    \            int j = Integer.parseInt(args[1]);\n            System.exit(0);\n\
    \            int k = i/j;\n        } catch (ArrayOutOfBoundsException e) {\n \
    \           System.out.println(\"ArrayOutOfBoundsException Message is:\"+e);\n\
    \            isException= true;\n            return;\n        } catch (ArithmeticException\
