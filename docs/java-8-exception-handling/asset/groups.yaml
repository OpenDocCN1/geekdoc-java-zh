- md: "\n# Topics\n\n- What is Exception Handling?\n- Need for Exception Handling.\n\
    - Performing Exception Handling\n- Summary\n\n## What is Exception Handling?\n\
    \nException handling is the process of responding to runtime error that happen\
    \ during program execution. It is a mechanism to capture and identify runtime\
    \ error to avoid abrupt crash of a program. Exception handling helps in avoiding\
    \ sudden crash of a program, using it programmer can provide a diagnosis of the\
    \ runtime error. Exception handling changes the flow of the program, using it\
    \ user can recover exceptional situation in an application. In simple words it\
    \ is a plan ‘B’ when something goes wrong within the program at runtime.\n\nNot\
    \ all runtime errors are recoverable certain exceptions which are called as Asynchronous\
    \ exceptions cannot be recovered e.g. Out of memory error.\n\n## Need for Exception\
    \ Handling\n\nUsing Exception handling programmer can propagate exception on the\
    \ call stack, which help in identifying the cause of the exception. Java has support\
    \ for nested exception handling up to any depth. Exception handling is used for\
    \ identifying and grouping the runtime error which yields quicker diagnosis. All\
    \ the above efforts help in improving the reliability and quality of the Java\
    \ program hence reducing the mean time between failure of an application and this\
    \ is the prime objective of exception handling i.e. increasing the reliability\
    \ of a program.\n\n## Performing Exception Handling\n\nException handling in Java\
    \ is done with the help of exception handling keywords. There are five keyword\
    \ that are used for performing exception in java. These keywords are listed below.\n\
    \n- a. Try block – It identifies the code area which encapsulate the vulnerable\
    \ code.\n- b. Catch block– It is used for identifying the unique exception which\
    \ is might occur.\n- c. Catch block help in grouping providing diagnosis for the\
    \ occurred exception.\n- d. Finally block – It used for performing housing keeping\
    \ jobs.\n- Throw keyword – It is used for raising an exception.\n- e. Throws keyword\
    \ – It is used for declaring an exception for a method.\n\nLet's now see a program\
    \ that throw keyword.\n\n```\n// Program 1\n// Description: How to use ‘throw’\
    \ keyword\n\nclass Program {\n    public static void main(String[] args) {\n \
    \       throw new ArithmeticException();\n    }\n}\n```\n\n![](img/82490df1c0b44475c1a824453ea9473e_12_0.png)\n\
    \nIn above program I demo how to raise an exception using throw keyword.\n\n##\
