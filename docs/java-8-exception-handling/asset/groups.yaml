    \ 接口。只有 `Throwable` 类实例（或其子类）的实例才会被 Java 虚拟机抛出，或者可以通过 Java `throw` 语句抛出。`Throwable`\
    \ 类（异常）是编译器检查的。\n\n```\n// Program 1\n// Understanding Throwable class\nclass\
    \ Program {\n    public static void main(String args[]) {\n        throw new Throwable();\n\
    \    }\n}\n```\n\n该程序会产生编译错误。要克服编译错误，请根据 main 方法的定义添加 `\"throws Throwable\"`。\n\
