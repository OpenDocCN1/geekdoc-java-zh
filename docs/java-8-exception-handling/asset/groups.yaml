- md: "\n```java\n// Description: Using UDE with \"throws\" keyword\nclass PositiveNumberException\
    \ extends Exception {\n    int n;\n    PositiveNumberException(String msg, int\
    \ num) {\n        super(msg);\n        n = num;\n    }\n    public String toString()\
    \ {\n        return \" Throws keyword with UDE ->The number \"+n + \" is positive\"\
    ;\n    }\n}\n\nclass Program {\n    static void check(String args[]) throws PositiveNumberException\
    \ {\n        int i = Integer.parseInt(args[0]);\n        if (i < 0) {\n      \
    \      throw new PositiveNumberException(\"The number is not positive\",i);\n\
    \        }\n    }\n    public static void main(String args[]) {\n        try {\n\
    \            check(args);\n        } catch(PositiveNumberException e) {\n    \
    \        System.out.println(e.toString());\n        }\n    }\n}\n```\n\nIn above\
    \ program check method throws PositiveNumberException.\n\nOutput:\n\nThrows keyword\
    \ with UDE -> The number -19 is not positive\n\n# Summary\n\nUDE is a business\
    \ rule violation. UDE is created by inheriting from Exception or Throwable class.\
    \ UDE can be used with “throws” keyword.\n"
