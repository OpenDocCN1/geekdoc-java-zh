    \ ensures each resource is closed at the end of the statement. Programmer need\
    \ not have to explicitly close the resources.\n\nSyntax:\n\n```\ntry(resource-specification)\n\
    {\n    //use the resource\n} catch(e){\n    ...\n}\n```\n\nThis try statement\
    \ contains a parenthesis in which one or more resources are declared.\n\nImplementing\
    \ Try with Resource\n\nAny object that implements java.lang.AutoCloseable or java.io.Closeable,\
    \ can be passed as a parameter to try statement. Autocloseable/Closeable"
- md: "\ninterface has only close method. It is called automatically when the try\
    \ block finishes. Multiple resources can be instantiated inside try i.e they are\
    \ separated by a semi-colon. The resources are closed in the reverse order of\
    \ creation.\n\nLet's see how to use try with resource.\n\n```java\n// Program\
    \ 1\n// Description : Without using Try with resource\nimport java.io.*;\n\nclass\
    \ Shape implements Closeable {\n    public void close() {\n        System.out.println(\"\
    Shape object close is closed\");\n    }\n}\nclass Program {\n    public static\
    \ void main(String args[]){\n        try {\n            Shape obj = new Shape();\n\
    \        } catch(Exception e) {\n            System.out.println(\"Exception happened\"\
    \ + e);\n        }\n    }\n}\n```\n\nIn the above program the object of shape\
    \ does not call close method automatically but it has to be called manually.\n\
    \n```java\n//Program 2\n//Description : Using try with resource\nimport java.io.*;\n\
    \nclass Shape implements Closeable {\n    public void close() {\n        System.out.println(\"\
    Shape object close is closed\");\n    }\n    public void display() {\nSystem.out.println(\"\
    Display of shape\");\n}\n}\nclass Program {\n    public static void main(String[]\
    \ args[]){\n        try{\n            Shape obj = new Shape();\n            obj.display();\n\
    \        }catch(Exception e) {\n            System.out.println(\"Exception happened\"\
    \ + e);\n        }\n    }\n}\n```\n\nIn this program the object of shape is called\
    \ automatically. As it can be seen in the output.\n\nOutput:\nDisplay of shape\n\
    Shape object close is closed\n\n```java\n// Program 3\n// Description : Creating\
    \ multiple objects in try with resource statement\n\nimport java.io.*;\n\nclass\
    \ Shape implements Closeable {\n    public void close() {\n        System.out.println(\"\
    Shape object is closed\");\n    }\n    public void display() {\n        System.out.println(\"\
    Display of shape\");\n    }\n}\nclass Circle extends Shape {\n}\n\nclass Ellipse\
    \ extends Shape {\n    public void close() {\nSystem.out.println(\"Ellipse object\
    \ is closed\");\n}\npublic void show() {\n    System.out.println(\"Show of ellipse\"\
    );\n}\n}\nclass Program {\n    public static void main(String args[]){\n     \
    \   try(Shape obj = new Shape(); Circle obj2 = new Circle(); Ellipse obj3 = new\
    \ Ellipse()) {\n            obj.display();\n            obj2.display();\n    \
    \        obj3.show();\n        }catch(Exception e) {\n            System.out.println(\"\
    Exception happened \" + e);\n        }\n    }\n}\n```\n\nThe above program demonstrate\
    \ that objects are closed in the reverse order of creation. The circle class does\
    \ not implement close() method hence close() method of Shape class is called.\n\
