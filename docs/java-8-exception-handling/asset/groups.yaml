    Method2\");\n    Method3();\n  }\n\n  static void Method1() {\n    System.out.println(\"\
    Method1\");\n    Method2();\n  }\n\n  public static void main(String arg[]) {\n\
    \    Method1();\n  }\n}\n```\n\n# 输出:\n\n![](img/82490df1c0b44475c1a824453ea9473e_24_0.png)\n\
