    \         isException= true;\n            return;\n        }\n\n        finally\
    \ { // finally block is not executed when the program aborts.\n            if(isException)\n\
    \                System.out.println(\"The finally block is executed when there\
    \ is return from method\");\n            else\n                System.out.println(\"\
    The finally block is also executed when there return from catch\");\n        }\n\
    \    }\n}\n```\n\nOutput: The finally block is not executed.\n\n### Summary\n\
    The finally block is guaranteed to be executed even if return keyword is encountered.\
    \ The finally block will not be executed if System.exit() function is executed.\n\
    \n# Chapter 11\nChecked and Unchecked Exception\n\n### Topics\n- Throws Keyword\n\
    - Checked Exception\n- Unchecked Exception\n\n### Throws Keyword\nIt is used for\
    \ declaring an exception for a method. It help in pre-empting an exception for\
    \ a given method. A method can ‘throws’ multiple exception. Exception that is\
    \ ‘throws’ from a method has to be handled else compiler will prompt an error.\n\
    \n### Syntax:\n```java\nvoid PerformIO() throws IOException { .... }\n```\n\n\
    Let's understand “throws” keyword with the help of an example.\n\n```java\n//Program\
    \ 1\n//Description: Understanding throws keyword usage\n\nimport java.io.*;\n\
    class Program {\n    static void AcceptData() throws IOException {\n        int\
    \ i = System.in.read();\n    }\n    public static void main(String args[]) throws\
    \ Throwable {\n        throw new Throwable();\n    }\n}\n```\n\nIn the program\
    \ above it is mandatory to handle IOException for AcceptData method. One way to\
    \ handle it would be to declare the exception using throws. The same would apply\
    \ for main method.\n\n### Checked Exception\nThese are those exceptions that identified\
    \ by the compiler. All classes that inherit from Throwable or Exception class\
    \ are checked exceptions. The compiler will flag if a checked exception is not\
    \ handled. Checked exception have to be handled. It is an excellent way to enhance\
    \ reliability of an exception. Let's understand checked exception better with\
    \ an example.\n\n```java\n//Program 2\n// Understanding checked exception\n\n\
    import java.io.*;\nclass Program {\n    static void AcceptData() {\n        int\
    \ i = System.in.read();\n    }\n    public static void main(String args[]) {\n\
    \        throw new Throwable();\n    }\n}\n```\n\nOutput: A checked exception\
    \ has to be handled.\n\n```\nPrg.java:7: error: unreported exception IOException;\
    \ must be caught or declared to be thrown\nint i = System.in.read();\n    ^\n\
    Prg.java:10: error: unreported exception Throwable; must be caught or declared\
    \ to be thrown\n    throw new Throwable();\n    ^^\n2 errors\n```\n\nA checked\
    \ exception can be handled in two ways:\n\n- a. Try... Catch blocks\n- b. Throws\
    \ keyword\n\n### Unchecked Exception\nIt is not identified by the compiler. They\
    \ are also called as runtime exception. All classes that inherit from RuntimeException\
    \ class are Checked. Some examples of unchecked exception are NullPointerException,\
    \ ArithmeticException and ClassCastException.\n\n```java\n//Program 3\n// Description:\
    \ Understanding unchecked exceptions\nimport java.io.*;\nclass Program {\n   \
    \ public static void main(String[] args) {\n        throw new RuntimeException();\
    \ // Can be avoided by\n        performing a check.\n    }\n}\n```\n\nIn above\
    \ program compiler will not report any error hence it is unchecked exception.\n\
    \n### Summary\nChecked exceptions are captured by compiler. Unchecked exceptions\
    \ are identified at runtime.\n'throws' keyword is used to declare exception as\
    \ part of method definition.\n\n# Chapter 12\nNested Exception\n\n### Topics\n\
    - Implementing Nested Exception\n- Life Cycle of Nested Exception Handling\n-\
    \ Summary\n\n### Implementing Nested Exception\nWhen try blocks are nested it\
    \ is called as nesting of exception i.e. When a try block is within within another\
    \ try block it is called as nesting of exception. Java supports nesting of exception\
    \ up to any depth. Let's understand this with the help of an example.\n\n```java\n\
    // Program 1\n// Description : Nesting of Exception\n\nclass Program {\n    static\
    \ void Sum(String ar[]) {\n        try {\n            int i = Integer.parseInt(ar[0]);\n\
    \            int j = Integer.parseInt(ar[1]);\n            int sum = i+j;\n  \
    \          System.out.println(\"The sum is :\"++sum);\n        } catch (NumberFormatException\
    \ e) {\n            System.out.println(\"Numberformatexception message\"+e.getMessage());\n\
    \        }\n    }\n    public static void main(String args[]) {\n        try {\n\
    \            Sum(args);\n        } catch(ArrayOutOfBoundsException e) {\n    \
    \        System.out.println(\"ArrayOutOfBoundsException message is :\"+e);\n \
    \       }\n    }\n}\n```\n\nOutput: If the user doesn't pass any argument then\
    \ program is going to fail in the Sum method during type conversion. The exception\
    \ ArrayOutOfBoundsException generated will not be caught by the inner catch but\
    \ will be caught by the outer catch.\n\n![](img/82490df1c0b44475c1a824453ea9473e_43_0.png)\n\
    \n### Life Cycle of Nested Exception Handling\nThe working of nested exception\
    \ handling can be identified in three steps i.e.\n\n1.  When an exception occur\
    \ within a nested try the inner most's 'catch+finally' get an opportunity first.\n\
    2.  If the inner try cannot handle the exception the outer try's catch/finally\
    \ gets an opportunity.\n3.  If the outer try cannot handle then program crashes.\n\
    4.  If an exception is handled in inner catch it won't bubble to the outer try.\
    \ An exception is caught only once even in nested exceptions.\n\nBehavior:\n\n\
    - a. Finally block of all try blocks will be executed irrespective of exception\
    \ occurrence.\n- b. If an exception is caught in inner try it won't bubble but\
    \ finally block if it is available in the outer try will be executed.\n"
