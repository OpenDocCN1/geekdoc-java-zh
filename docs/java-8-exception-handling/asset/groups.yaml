    # Why to Handle Exception?


    In a single sentence it can say “software is very pervasive”. Today software directly
    or indirectly impacts many domains such as banking, healthcare, business, military,
    education, government etc. Hence software reliability if of highest importance
    and exception handling help to enhance software reliability.


    There have been many examples of software crashing the business. Some of the recent
    example are


    +   - Tokyo stock exchange crashes

    - Amazon Christmas Glitch

    - Microsoft Azure Crashes

    - UK border immigration system


    # Summary


    Error is of two types i.e. compiler and runtime. Exception occur at runtime. exception
    is not handled it will crash the program. Exception can occur in one the 3 ways.
    Exception handling increases the reliability of an application.


