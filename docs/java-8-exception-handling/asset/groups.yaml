- md: "\n# Chapter 10\nFinally block & Return keyword\n\n### Topics\n- Using Finally\
    \ Block and Return keyword.\n- Summary.\n\n### Using Finally Block and Return\
    \ Keyword\nFinally block will be executed even if return keyword instruction is\
    \ executed from within the try block. Finally block will also be executed if return\
    \ keyword instruction is executed from a catch block. It won't be executed if\
    \ control encounter System.exit() function anywhere.\n\n```java\n// Program 1\n\
    // Description: Finally block is executed even when control encounter\nreturn\
    \ keyword\n\nclass Program {\n    public static void main(String args[]) {\n \
    \       boolean isException = false;\n\n        try {\n            int i = Integer.parseInt(args[0]);\n\
    \            int j = Integer.parseInt(args[1]);\n\n            int k = i/j;\n\
    \            return;\n        } catch (ArrayIndexOutOfBoundsException e) {\n \
    \           System.out.println(\"ArrayIndexOutOfBoundsException Message is :\"\
    +e);\n            isException=true;\n            return;\n        } catch (ArithmeticException\
    \ e) {\n            System.out.println(\"The ArithmeticException message is:\"\
    +e);\n            isException= true;\n            return;\n        } catch(Exception\
    \ e) {\n            System.out.println(\"The Exception message is:\"+e);\n   \
    \         isException=true;\n            return;\n        }\n        finally {\n\
    \            if(!isException) {\n                System.out.println(\"The finally\
    \ block is executed when there is return from method\");\n            } else {\n\
    \                System.out.println(\"The finally block is also executed when\
    \ there return from catch\");\n            }\n        }\n    }\n}\n```\n\nOutput:\
    \ The finally block is executed\n```\nArrayIndexOutOfBoundsException Message :java.lang.ArrayIndexOutOfBoundsException:\
    \ 0\nThe finally block is also executed when there return from catch\n```\n\n\
    // Program 2\n\n```java\n//Description: The finally block is not executed when\
    \ control encounter\nSystem.exit() function.\n\nclass Program {\n    public static\
    \ void main(String args[]) {\n        boolean isException = false;\n        try\
    \ {\n            int i = Integer.parseInt(args[0]);\n            int j = Integer.parseInt(args[1]);\n\
    \            System.exit(0);\n            int k = i/j;\n        } catch (ArrayOutOfBoundsException\
    \ e) {\n            System.out.println(\"ArrayOutOfBoundsException Message is:\"\
    +e);\n            isException= true;\n            return;\n        } catch (ArithmeticException\
