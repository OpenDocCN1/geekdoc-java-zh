  md: '# # Chapter 17

    User Defined Exception


    Topics


    +   - Creating User Defined Exception

    - Summary


    ### Creating User Defined Exception

    User defined exception represent a business rule violation. In a typical software
    application maximum exceptions that are raised and handled are user defined. Some
    of the examples of user defined exception in an ATM application could.


    +   - a. ATMException

    - b. OutOfFundsException

    - c. AuthenticationFailure


    User defined exception is created by inheriting from Throwable or Exception class,
    it is better to inherit from Exception class because it offer enhanced functionality.

    A User defined exception is initialized by using mother class constructor. UDE(user
    defined exception) can override toString() method to provide custom message.'
