    # # What is Exception Hierarchy?


    Java has specific class hierarchy within its API when accommodates the Exception
    classes.

    The Throwable class is the mother class of all exception classes in Java. Below
    is schematic diagram that represents Java exception hierarchy.


    ![](img/82490df1c0b44475c1a824453ea9473e_13_0.png)


    Basically there are four classes that are of vital importance i.e Throwable,Error,Exception
    and RuntimeException. In later sections I will discuss each one of them.


