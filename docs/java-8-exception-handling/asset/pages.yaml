    # Try Block


    It is a code block that identifies an area of code which has a probability of
    failure. Try block can be put inside


    +   * Method

    * Constructor

    * Static block


    # Catch Block


    It follows a try block. Catch block provide a mechanism for diagnosis and remedial
    steps to be taken for the occurred exception.


    Following are the characteristics of catch block.


    +   * It only exists if there is a try block.

    * It immediately follows the try block.

    * It is used to handle the exception.

    * If the appropriate exception is not found the program crashes.


    # Syntax:


    ```

    try {

    ....

    } catch (Exception name) {

    ```'
