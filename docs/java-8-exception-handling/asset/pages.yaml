    \ ultimately it will be handled by JVM which will stop the program. Below I have\
    \ illustrated the above steps in greater detail.\n\nStep 1 -> After an exception\
    \ object is created, it is handed to the runtime system (thrown)\n\nStep 2 ->\
    \ The runtime system attempts to find a handler for the exception.\n\nStep 3 ->\
    \ If a handler is found, the exception is caught.\n\nStep 4 -> If the handler\
    \ is not found (the runtime backtracks all the way to the main() method), the\
    \ exception stack trace is printed and the application aborts execution(Handled\
    \ by JVM).\n\nLet's understand the above process better with the help of an example.\n\
    \n```\n// Program 1\n// Description: Understanding life cycle of an unhandled\
    \ exception\nclass Program {\n    static void Method3() {\n        System.out.println(\"\
    Method3\");\n        int i=0;\n        int j=10/i;\n    }\n    static void Method2()\
