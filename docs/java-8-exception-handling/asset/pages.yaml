    methods. There are certain conditions that have to be satisfied or else compiler
    report an error. Let''s understand the rules that have to be followed.


    **Rule 1:** If mother class method does not ''throws'' any exception then


    +   - The child class overridden method cannot ''throws'' checked exception.

    - The child class overridden method can ''throws'' unchecked exception.


