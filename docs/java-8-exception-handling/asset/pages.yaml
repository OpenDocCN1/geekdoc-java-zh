    \ class of RuntimeException it would be caught 2nd last and RuntimeException class\
    \ is at the bottom of the hierarchy it would appear in the first catch block.\
    \ If the above rule is not followed Java compiler gives an error. Let's understand\
    \ this better with the help of an example\n\n```\n// Program 2\n// Understanding\
    \ order of catch blocks\nclass Program {\n    public static void main(String args[])\
