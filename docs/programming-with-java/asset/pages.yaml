  md: '# Multithreading 195


    +   - Java program always contains at least one thread if we do not create one.
    This thread is called main thread and it is the one immediately starting when
    we start a program.

    - In Java, threads can be created in two ways, by extending the Thread class and
    implementing the Runnable interface. In both approaches, threads are implemented
    in the form of objects which contain a method called run().-extending the Thread
    class and implementing the Runnable interface. In both approaches, threads are
    implemented in the form of objects which contain a method called run(). It is
    the entry point of a new thread and it is the place where the thread is to be
    defined.

    - There are various states that a thread can enter during its life cycle. They
    are newborn, runnable, running, blocked and dead. A thread is in one of these
    five states.

    - The yield(), sleep() and stop() methods are responsible for controlling the
    behavior of a thread and the transition of threads from one state to another.

    - There are two ways to determine whether a thread has ended. The alive() method
    is used to test whether a thread is still alive. The join() method is used to
    halt the execution of current thread (calling thread) until the method terminates.
    It ensures that the thread will wait until the called thread finishes its execution.

    - Priorities are integers which specify the relative priority of one thread to
    another. When a thread is created, it inherits its priority from the thread that
    created. The priority of the thread can be changed by using the setPriority()
    method of the Thread class.

    - When multiple threads need access to a single resource, there is a technique
    called synchronization to ensure that only one thread will use the resource at
    any given point of time. Synchronization uses the concept of monitor.

    - A monitor is an object which is used as a mutually exclusive lock. That is,
    it is used by only one at any given point of time.

    - There are two ways to implement synchronization. One is to synchronize and another
    is to synchronize statements. The keyword synchronized is used in both the cases.

    - Deadlock occurs when two or more threads are in a simultaneous wait state and
    each of them is waiting for the release of a resource held by one of the other
    waiting thread.

    - Inter-thread communication is a process in which multiple threads exchange messages
    with one another. A thread exchanges messages before or after it changes its state.
    Inter-thread communication can be achieved by using three methods wait(), notify()
    and notifyAll().

    - The predefined methods suspend(), stop() have been deprecated in Java 2 as they
    may cause deadlocks and serious system failures in a multithreaded environment.
    In the new version of Java, suspending, resuming and stopping a thread can be
    performed using boolean type flags.


