    where,

    obj is an instance of the control that is to be added or removed

    To remove the controls from a window, removeAll() method can be used.

    Some of the commonly used controls are discussed in this section.


    # Label


    A label is a simple control which is used to display text (non-editable) on the
    window. Since it does not possess any user interactive feature, it is considered
    as a passive control. The Label class defines the following constructors.


    ```

    Label() //first

    Label(String strl) //second

    Label(String strl, int strl_align) //third

    ```


    The first constructor creates a blank label. The second constructor creates a
    label containing the string specified by strl. The third constructor creates a
    label containing the string and strl_align determines the alignment of the text
    contained in the label. Label.LEFT, Label.RIGHT or Label.CENTER. The default alignment
    of text is LEFT.


    # Push Button or Button


    A button is an active control that has a 3-dimensional appearance. It displays
    the text and triggers an event when it is clicked or activated. The Button class
    defines the following constructors.


    ```

    Button() //first

    Button(String strl) //second

    ```


    The first constructor creates a button with blank label. The second constructor
    creates a button having strl as label.


    # Checkbox


    A checkbox is a control that consists of a combination of a small box and a label.
    The label provides the description of the box with which it is associated. It
    is a two-state control having true (checked) and false (unchecked). The state
    of a checkbox can be changed by clicking on it. Checkbox is an object of Checkbox
    class. The Checkbox class defines the following constructors.


    ```

    Checkbox() //first

    Checkbox(String strl) //second

    Checkbox(String strl, boolean state) //third

    Checkbox(String strl, boolean state, CheckboxGroup group) //fourth

    ```


    The first constructor creates a checkbox with an empty label. The second constructor
    creates a checkbox having strl as label. The third constructor creates a checkbox
    having strl as label and is used to set the initial state of the checkbox. If
    it is true, the checkbox is checked it is unchecked. The default state of the
    checkbox is false. In the fourth constructor the group represents the name of
    the group to which the checkbox belongs


    The checkbox group can be divided into two categories: Non-Mutually Exclusive
    group, in which more than one item of the group can be checked and Mutually Exclusive
    group, in which only one item of the group can be selected.'
