    # 12.11 THE StreamTokenizer CLASS


    The StreamTokenizer is used to parse an input stream into "tokens" determined
    by the delimiters, reading them one at a time. Unlike StringTokenizer, the StreamTokenizer
    distinguishes among numbers, identifiers, quoted strings and different comment
    styles. The tokenization process involves reading each byte from the input stream
    and each byte is considered as a character having five distinct attributes, alphabets,
    numbers, string quote, white space and comment character. Each character is identified
    to be either of these attributes.


    The StreamTokenizer class defines type of constructor.


    ```

    StreamTokenizer(Reader input)

    This statement constructs a stream tokenizer and tokenizes the specified input
    stream.

    ```


    Some of the fields defined by the StreamTokenizer class are listed in Table 12.13.


    Table 12.13 StreamTokenizer Class Fields


    | Field | Description |

    | static TT_WORD | indicates that the word has been read |

    | static TT_NUMBER | indicates that the number has been read |

    | static TT_EOL | indicates that the end of the line has been read |

    | static TT_EOF | indicates that the end of the file has been read |

    | int ttype | specifies the type of the token read |

    | double nval | the value of number token |

    | String sval | specifies the value of a word token |


    Some of the methods defined by the StreamTokenizer class are listed in Table 12.14.


    Table 12.14 StreamTokenizer Class Methods


    | Method | Description |

    | int lineno() | returns the current line number |

    | void eolSignificant(boolean flag) | determines whether the end of the line are
    treated as tokens |

    | int nextToken() | returns the next token of the input stream |'
