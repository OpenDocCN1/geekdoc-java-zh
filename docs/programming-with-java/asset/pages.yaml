  md: '# CHAPTER

    8


    # INTERFACE


    # CHAPTER OBJECTIVES


    After reading this chapter, you will be able to:


    +   - Understand what interface is and how it differs from a class

    - Explain how to define an interface and how it can be implemented by a class

    - Describe how an interface can be extended by another interface

    - Explain how an interface can be used to declare a set of constants

    - State the differences between interface and abstract class


    # 8.1 INTRODUCTION


    As discussed in Chapter 7, the concept of multiple inheritance is not directly
    supported by Java. That is, a subclass in Java cannot have more than one superclass.
    However, there are certain applications where a class needs inherit properties
    from multiple classes at the same time. Java provides an approach known as interface
    as a convenient alternative to implement multiple inheritance.


    # 8.2 DEFINING INTERFACE


    An interface is just like a class. The only difference is that it contains only
    final variables and the method declarations. Hence, we can think of an interface
    as a ‘fully abstract class’. There is no limitation to the number of interfaces
    that a class can implement. An interface is defined just like a class but rather
    using the keyword class, the keyword interface is used.


    The syntax to define interface is:


    ```

    interface interface_name

    {

    //variables and methods declaration

    }

    ```


    where,

    interface is the Java keyword

    interface_name is the name of the interface


    If there is no access specifier included in the interface definition, then the
    default access is used and the interface is visible only to the members of the
    same package. However, to make the interface accessible in any other code, it
    can be declared as public. The variables in an interface are by default static
    and final. They cannot be altered by the implementing class. The methods are by
    default abstract. All the methods must be implemented by the class which implements
    the interface. For example, consider the following code segment.'
