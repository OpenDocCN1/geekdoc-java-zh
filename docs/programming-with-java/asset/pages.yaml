    \nHere, variable i and method add() are declared as static. Therefore, outside\
    \ the class they are accessed using the name of the class in which they are defined.\n\
    \nNote: The method declared as static can access only static data and call static\
    \ methods.\n\n# 5.8 METHOD OVERLOADING\n\nIn cases when a similar action is to\
    \ be defined for different types of data, different methods having different names\
    \ make the program very complex as the programmer must keep track of the names\
    \ of all the methods. To prevent such situations, Java allows the methods to be\
    \ overloaded.\n\nMethod overloading allows multiple methods to have the same name\
    \ with different parameters and different definitions. The application of method\
    \ overloading is found those programs where objects in a class are needed to perform\
    \ similar operations using different input parameters. When a method is called,\
    \ Java compiler compiles the method name and then the type and number of arguments\
    \ associated with it to determine which of the method is to be called and executed.\
    \ This process is known as polymorphism.\n\nIn order to create overloaded methods\
    \ in our program, we have to create different methods in the class, all with the\
    \ same name but having different parameters. The different methods are identified\
    \ by the number of parameters, the data type of the parameters or the order of\
    \ the data type of the parameters passed to the method.\n\nTo understand the concept\
    \ of method overloading, consider these method declarations.\n\n```\nvoid sum(int);\n\
    void sum(int,int);\n```\n\nIn these statements, two methods named, sum() are different\
    \ as the number of arguments passed are different. Now, consider these statements.\n\
    \n```\nvoid addition(int);\nvoid addition(char);\n```\n\nIn these statements,\
    \ two methods named addition() are different as the data type of arguments passed\
    \ is different. Now, consider these statements.\n\n```\nvoid area(int,float);\n\
    void area(float,int);\n```\n\nIn these statements, two methods named, area() are\
    \ different as the order of the data type of the arguments passed is different.\n\
    \n**Example 5.8** A program to demonstrate the concept of method overloading\n\
    \n```\nclass Shapes\n{\n  void perimeter(int a) //method with int type parameter\n\
