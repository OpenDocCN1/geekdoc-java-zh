    # An Applet Tag


    The <APPLET> tag specifies the applet code that is be loaded and at simple time
    tells the browser about its space requirement on the web page. The simplest form
    of the <APPLET> tag is


    ```

    <APPLET CODE=AppletCode.class WIDTH=600 HEIGHT=250>

    </APPLET>

    ```


    This code tells the browser or the appviewer to reserve the display area having
    width of 600 pixels and height of 250 pixels for the applet and load the compiled
    Java applet named AppletCode.The three attributes, namely, CODE, WIDTH and HEIGHT
    must be specified while defining an applet tag. Other attributes of the <APPLET>
    tag are NAME, CODEBASE, ALT, ALIGN, VSPACE and HSPACE.


    # Adding an Applet to HTML


    An applet is added to the HTML document by placing <APPLET> tag inside the <BODY>
    tag of the HTML document. Here, we have shown the entire HTML document with an
    embedded <APPLET> tag of AppletCode.java applet.


    ```

    <HTML>

    <HEAD></HEAD>

    <BODY>

    <CENTER>

    <APPLET CODE=AppletCode.class WIDTH=600 HEIGHT=250>

    </APPLET>

    </CENTER>

    </BODY>

    </HTML>

    ```


    Note: The .class file and its corresponding .htmI file must be present in the
    same directory.'
