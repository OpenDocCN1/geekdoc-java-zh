    Window, Dialog and Frame classes.


    +   - The grid layout manager divides the container into a grid/matrix of rows
    and columns. The overall region is divided equally between rows and columns, such
    that each row and each column in the layout is of the same size.

    - The card layout manager is used to manage a large number of components. It organizes
    the components in layers which are arranged like a deck of cards sharing the same
    display area such that only one of them is visible at a time.

    - The grid bag layout manager is the most advanced and yet easy to use layout
    manager. A grid bag layout arranges the component in a grid of rows and columns.
    It allows different sized components to span multiple rows or columns.

    - The JFrame class is used to create a window which does not have any toolbar,
