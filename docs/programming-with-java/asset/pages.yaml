    # 6.2.2 Multi-dimensional Arrays


    Multi-dimensional arrays can be described as ''array of arrays'', that is, each
    element of the array is itself an array. A multi-dimensional array of dimension
    n is a collection of items that are accessed with the help of n subscript values.


    # Two-dimensional Array


    A two-dimensional array is the simplest form of a multi-dimensional array that
    requires two subscript to access an array element. Two-dimensional arrays are
    useful when the data being processed are to be arranged in the form of rows and
    columns (matrix form).


    The syntax for declaring a two-dimensional array is:


    ```

    data_type array_name[][];

    ```


    or


    ```

    data_type[][] array_name;

    ```


    The syntax for creating a two-dimensional array is:

    array_name=new data_type[row_size][column_size];

    The above two steps of declaration and creation can be combined into one using
    a single statement shown below.


    ```

    data_type array_name[][]=new data_type[row_size][column_size];

    ```


    For example, an array a[][] of int having three rows and two columns can be declared
    and created using this statement.


    ```

    int a[][]=new int[3][2];

    Here, 3 is the row size and 2 is the column size.

    ```


    # Initialization of Two-dimensional Array


    Like a single-dimensional array, a two-dimensional array can also be declared
    and initialized at the same time. To understand how to initialize a two-dimensional
    array, consider this statement.'
