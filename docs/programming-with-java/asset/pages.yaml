  md: '# 16.7.3 Label


    A label is a simple control which is used to display text (non-editable) on the
    window. Since it does not possess any user interactive feature, it is considered
    a passive control. A label is an object of JLabel class.


    Some of the constructors defined by JLabel class are as follows.


    ```

    JLabel()

    JLabel(String string)

    JLabel(String string, int align)

    ```


    where,

    string is the text for the label

    align specifies the horizontal alignment of the text contained in the label, and
    can have one of the following values: LEFT, RIGHT, CENTER, LEADING or TRAILING.


    # 16.7.4 Button


    A button, also known as push button, is an active control that has a 3-dimensional
    appearance. It triggers an event when it is clicked or activated. Swing also provides
    the ability to associate an icon, a string, or both with buttons. A push button
    is an object of JButton class.


    Some of the constructors defined by JButton class are as follows.


    ```

    JButton()

    JButton(Icon icon)

    JButton(String string)

    ```


    where,

    string represents the string used for the button

    icon represents the icon used for the button


    Note: All the buttons are derived from AbstractButton class.


    # 16.7.5 ToggleButton


    Swing provides a variant of push button toggle which has two states: pushed and
    released. When toggle is pressed for the first time, it remains pressed and is
    released only when it is pressed for the second time. This button toggles between
    pushed and released state. Toggle button is an object of JToggleButton class.


    Some of the constructors defined by JToggleButton class are as follows.


    ```

    JToggleButton()

    JToggleButton(String string)

    JToggleButton(String string, boolean state)

    ```


    where,

    string specifies the text

    state can have one of the values: true, if the button is initially selected, otherwise
    false (default value)'
