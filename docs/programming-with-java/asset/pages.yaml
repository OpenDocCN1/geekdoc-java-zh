    separated from its neighbor by leaving a small space not only from above and below
    it, but also from left and right. The FlowLayout class defines the following constructors.


    ```

    FlowLayout()                               //first

    FlowLayout(int alignment)                   //second

    FlowLayout(int alignment, int hor, int ver) //third

    ```


    The first constructor creates a default layout. It positions the components in
    the center and leaves a space of five pixels between each component. The second
    constructor creates a flow layout in which alignment specifies the alignment of
    laid out components. It can take one of these constants—FlowLayout.LEFT, FlowLayout.RIGHT,
    FlowLayout.CENTER. The third constructor creates a layout in which hor and ver
    specify the horizontal and vertical space left between each component respectively
    and alignment specifies the alignment of components.


    # BorderLayout


    BorderLayout is the default layout manager for Window, Dialog and Frame classes.
    It positions the components in five regions—east, west, south and center. Region
    when a component is added to a particular region, it is extended to fit that region.
    There is, only one component can be placed within a region at a time. An attempt
    to add more than one component to a region hides the previously added component
    by the recently added component. The BorderLayout class defines the following
    constructors.


    ```

    BorderLayout()                               //first

    BorderLayout(int hor, int ver)             //second

    ```


    The first constructor creates a default layout. In the second constructor hor
    and ver specify the horizontal and vertical space left between each component,
    respectively.


    To add to a specific region, add ( ) method is used. The general form of add ()
    method is:


    ```

    void add(Component obj, Object region)

    ```


    where,

    obj is the component to be added


    region represents the name of region where the component is added. It can take
    one of these constants, BorderLayout.NORTH, BorderLayout.SOUTH, BorderLayout.

    CENTER, BorderLayout.EAST and BorderLayout.WEST


    # GridLayout


    The GridLayout manager divides the specified region into a grid/matrix of rows
    and columns. The overall region is divided equally rows and columns, such that
    each row and column in the layout is of the same size. The component added to
    the cell gets expanded to the size of that cell. The GridLayout class defines
    the following constructors.


    ```

    GridLayout()                             //first

    GridLayout(int rows, int cols)               //second

    GridLayout(int rows, int cols, int hor, int ver) //third

    ```


    The first constructor creates a single-column layout. The second constructor creates
    a grid layout in which rows represents the number of rows and cols represents
    the number of columns'
