    # Socket


    The Socket class is used by the client to connect to the server sockets and exchange
    data using input and output streams. When a Socket object is created, a connection
    is established implicitly between the client and the server. Some of the constructors
    defined in this class are listed in Table 20.8.


    # Table 20.8 Some of the Constructors of the Socket Class


