  md: 'Some of the advantages of Java Beans are as follows.


    +   - A bean has all benefits of Java’s “write-once, run-anywhere” paradigm.

    - The properties, events, and methods of a bean which are exposed to another application
    can be controlled.

    - The configuration settings of a bean can be saved in the persistent storage,
    and restored any time later.


    # 18.2.1 Bean Architecture


    A bean consists of three general purpose interfaces determine these are as follows.
    When values are assigned to the properties, they determine the appearance and
    behavior of the component. The properties are equivalent to data fields of object
    in Java except that they must be declared as `private`. There are two types of
    properties, namely, simple and indexed.


    +   - **Properties**: These are the attributes that determine the bean’s internal
    state. When values are assigned to the properties, they determine the appearance
    and behavior of the component. The properties are equivalent to data fields of
    object in Java except they must be declared as `private`. There are two types
    of properties, namely, simple and indexed.

    - **Events**: Beans can communicate with objects by generating events. The events
    are generated upon happening of some action at some specific point of time. The
    generated events may be sent to other objects.

    - **Methods**: Methods are the operations through which interaction with a bean
    can be done. All beans are similar to Java methods. Some methods are special and
    deal with properties and events.


    # 18.2.2 Introspection


    Introspection is the automatic process of analyzing a bean’s properties, events
    and methods. It is the important feature of Java Beans API as it allows other
    application such as design tool, to obtain information about a component. The
    process of introspection is used at run-time as well as design time.


    There are two approaches by a developer can indicate which of its properties,
    events and methods are exposed. In the first approach, Java Bean’s design patterns
    are used. The second approach is to implement the `BeanInfo` interface which gives
    explicit information about associated bean.


    # Design Patterns for Properties


    The Java Bean’s design patterns specify special methods called `accessor` methods;
    getter and setter methods to get and set a property respectively. According to
    the design patterns, the getter method must start with the `get` prefix and setter
    methods must start with the `set` prefix.


    # Simple Properties


    A simple property has a single value. The design patterns for simple property
    are


    ```

    public TP getNP( )

    public void setNP(TP arg )

    ```


    where,

    NP is the property name

    TP is the property type'
