    CLASSES AND OBJECTS


    # CHAPTER OBJECTIVES


    After reading this chapter, you will be able to:


    +   - Explain classes and objects that form the basis of object-oriented programming

    - Create and use non-parameterized and parameterized methods

    - Understand the significance of dot operator

    - Understand assigning object reference variables

    - Learn how to pass arguments to a method by value or by reference

    - Explain the use of static variables and methods in a class

    - Understand the concept of method overloading

    - Explain the purpose of constructor and its type

    - Explain how to pass objects as parameter

    - Understand the concept of returning objects

    - Understand the concept of recursion

    - Understand the significance of `this` keyword

    - Explain garbage collection and the use of `finalize()` method


    # 5.1 INTRODUCTION


    The key objective of object-oriented programming is to represent the various real-world
    objects as program elements. In Java, this objective is accomplished with the
    help of class that binds data and the methods to manipulate data under a single
    entity.


    All the OOP concepts such as abstraction, encapsulation, inheritance, and polymorphism
    are implemented with the help of classes. A class serves as a template that provides
    a common layout to all of its instances as objects. That is, a class is only a
    logical abstraction that specifies what data and methods its objects will have,
    whereas the objects are the physical entities through which those data and methods
    can be used in a program. Thus, objects are considered the building blocks of
    object-oriented programming. This chapter discusses the concept of classes and
    objects in detail.


    # 5.2 CLASS FUNDAMENTALS


    A class is a user-defined type that can be used to create instances of its type
    called objects. Thus, we can say, a class is a template for an object and an object
    is an instance of a class. Like any other user-defined data type, class also needs
    to be declared and defined in the instance of the program. A class definition
    specifies a new data type that can be treated as a built-in data type.'
