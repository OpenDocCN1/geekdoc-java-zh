    # 18.9 THE JAVA BEANS API


    The classes and interfaces related to the development of beans are contained in
    the package java.beans. The beans use only few classes while running in an application.
    For example, the event classes are used by beans that generate PropertyChangeEvent
    and VetoableChangeEvent Most of the classes in this package are used by a bean
    editor to customize and put beans together to create an application. These classes
    enable the bean editor creating a user interface that can be used by a developer
    to customize the bean.


    Table 18.2 The Interfaces Defined in java.beans package


    | Interface | Description |

