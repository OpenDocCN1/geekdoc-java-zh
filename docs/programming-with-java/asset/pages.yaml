    # 19.8.1 Using Cookies


    One of the ways to keep track of session between the client and the server is
    through the use of cookies. A cookie is a piece of information that a web server
    sends to the browser. The web server assigns a unique ID to each cookie. It sends
    the cookie to the client by embedding it in the response header. With each request,
    the client sends this cookie value to the server. Using this value, the server
    identifies the user. Cookie is usually used to maintain information about the
    client (such as user ID, name, etc.) that is needed every time a client visits
    the website. A cookie is constructed using the following constructor of Cookie
    class.

    public Cookie(String name, String val)'
