  md: '# CHAPTER

    12


    # I/O IN JAVA


    # CHAPTER OBJECTIVES


    After reading this chapter, you will be able to:


    +   - Understand the importance of streams in input and output operations

    - Classify different stream classes

    - Understand the concept of PrintStream class and various predefined streams

    - Distinguish streams from readers/writers and choose appropriately between the
    two

    - Explain the concept of files and classes that support file input and output
    operations

    - Understand the concept of transient and volatile modifiers

    - Explain the use of instanceof operator

    - Understand the concept of native methods and how they are used


    # 12.1 INTRODUCTION


    A program is a set of instructions that facilitates problem solving. Every program
    accepts input, processes it and transforms it into a desired output. An input
    is given to a program through standard input devices, other programs, etc. Similarly,
    the output from a program is sent to standard output devices, other programs,
    etc. Java supports input and output of data through the classes included in the
    java.io package.


    # 12.2 I/O BASICS


    Most-life applications require large amount of input and output data to be handled
    that is difficult to manage using the commonly used console I/O operation is not
    permanent and is lost as soon as the program terminates. Moreover, the output
    obtained using console I/O operation is not permanent and this necessitates the
    requirement of some devices such as disk, magnetic tape or a floppy disk to store
    voluminous data. The data is stored in these devices in the form of files (also
    known as disk files) and is called persistent data. A file can be read or written
    in the form of bytes or characters using byte stream classes and character stream
    classes, respectively, which will be discussed in later sections. The objects
    of classes can also be read from and written to the secondary memory (files) and
    the process of reading and writing objects is called object serialization.


    # 12.3 STREAMS


    Java manages all input and output in the form of streams. A stream refers to a
    channel through which data flows from the source to the destination. This data
    is in the form of sequence of bytes or characters.'
  merge: -1
