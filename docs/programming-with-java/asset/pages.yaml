    ________.


    +   3. The package ________ includes classes that are fundamental to Java as String,
    Math, Exception, etc.


    +   4. While creating the objects of the classes of each package, the ________
    is preceded by their respective package names to avoid ambiguity.


    +   5. All the classes in a package which are declared ________ are automatically
    imported, when a package is imported using asterisk (*).'
