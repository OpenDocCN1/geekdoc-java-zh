    # 3.8 OPERATORS AND OPERATIONS


    As stated earlier, operators are the symbols which perform operations on various
    data items known as operands. For example, in a + b, a and b are operands and
    + is an operator. Note that to perform an operation, operands and operands are
    combined forming an expression. For example, to perform an addition operation
    on operands a and b, the addition (+) operator is combined with the operands a
    and b forming an expression.


    Depending on the function performed, the Java operators can be classified into
    various categories. These include arithmetic operators, increment and decrement
    operators, relational operators, logical operators, conditional operators, assignment
    operators, bitwise operators and special operators.


    # 3.8.1 Arithmetic Operators


    Arithmetic operators perform the basic arithmetic operations on operands. They
    can work on any built-in data type of Java except boolean type.


    Java provides various arithmetic operators that are, +(addition or unary plus),
    -(subtraction or unary minus), *(multiplication), /(division) and %(modulus).
    For example, some of the expressions which involve arithmetic operators are x
    + y, x - y, x * y, x / y and x % y. When the unary minus operator is used with
    a single operand, the operand is multiplied by -1.


    Expressions formed by using arithmetic operators can be of the following types:


    +   * Integer expression: The arithmetic expression where both the operands are
    integers called an integer expression.'
