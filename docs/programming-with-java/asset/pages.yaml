  md: '# 256 Programming with Java


    # Table 14.1 Event Classes


    | Class | Description |

    | --- | --- |

    | ActionEvent | It represents the event that is generated when a user selects
    a menu, presses button or double-clicks a list item. |

    | AdjustmentEvent | It represents an event that is generated when a change has
    occurred in the scrollbar. The AdjustmentEvent class defines an integer constant,
    ADJUSTMENT_VALUE_CHANGED that signals some change has occurred. |

    | ItemEvent | It represents the event which is generated when a item is selected
    or deselected, checkbox item or a list is selected. |

    | KeyEvent | It represents the event that is generated when the user interacts
    with the application through keys. |

    | MouseEvent | It represents the event that is generated when the user interacts
    with the mouse. |

    | TextEvent | It represents the event that is generated when the user enters or
    changes text in text fields or areas. |

    | WindowEvent | It represents the event that is generated when the state of the
    window changes. |

    | PropertyChangeEvent | This class PropertyChangeEvent also represents the event,
    generated on the change of an object but it only notifies of the change of the
    source object. |

    | CaretEvent | It represents the event which is generated by the text components
    when the caret (cursor) changes its position or when text is selected. |


    # 14.4.2 Event Sources


    As stated earlier, event sources are the objects which generate events. Some of
    the examples of event sources are listed in the Table 14.2.


    # Table 14.2 Examples of Some of the Event Sources


    | Event Source | Description |

    | --- | --- |

    | Button | generates action events when the button is pressed. |

    | Window | generates window events when the state of the window changes. |

    | Text components | generates text events when a text is entered in text field
    or text area. |

    | Menu item | generates action events when a menu is selected, generates item
    events when a changeable item is selected or deselected. |

    | Checkbox | generates item events when a checkbox is selected or deselected.
    |

    | List | generates action events when an item is double-clicked, generates action
    events when an item is selected or deselected. |

    | Scrollbar | generates action events when the scroll bar is manipulated. |'
