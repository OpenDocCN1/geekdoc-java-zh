  md: '# Programming Elements of Java 25


    # Numeric Constants


    Numeric constants refer to the numbers consisting of single sequence of digits
    (with or without decimal point) that can be positive or negative. By default,
    numeric constants are positive. Numeric constants can be further classified as
    integer constants and floating-point constants (Table 3.2).


    # Table 3.2 Types of Numeric Constants


    | Type | Example | Description |

    | --- | --- | --- |

    | Integer Constants | 54, -646, 01612, 038A | Integer constants refer to integer-valued
    numbers. Integer constants can be represented by three different number systems
    namely, decimal (base 10), octal (base 8) and hexadecimal numbers (base 16). The
    constants are preceded by a 0 (zero) and hexadecimal constants are preceded by
    a 0x or 0X. |

    | Floating Point Constants | 64.23f, -74.23f, 537E-9f, 15e-3 | Floating-point
    constants refer to the real numbers, that with a decimal point. Floating-point
    notation in which the constant is divided into a mantissa and an exponent. Floating
    point constants default to append an f or F to the constant in order to specify
    a format constant |


    Note: Use of special characters like '','', '';'', and question mark ''?'' are
    not permitted in numeric constants.


    # Character Constants


    Character constants refer to a single character enclosed in single quotes (''*'').
    The examples of character constants are ''f'', ''M'', ''8'', ''&'', etc. All character
    constants are internally stored as integer value.


    Character constants can represent either the printable characters or the non-printable
    characters. The examples of printable character constants are ''a'', ''5'', ''#'',
    ''; etc. However, there are a few character constants that cannot be included
    in a program directly through a keyboard such as backspace, newline line and so
    on. These character constants are known as non-printable constants and are included
    in a program using the escape sequences. An escape sequence refers to a character
    preceded by the backslash character (\). Some of the sequences used in Java are
    listed in Table 3.3.


    # Table 3.3 Escape Sequences


    | Escape Sequences | Character Constants |

    | --- | --- |

    | \b | Backspace |

    | \f | Form feed |

    | \n | Newline (Linefeed) |

    | \r | Carriage return |

    | \t | Tab |

    | \'' | Single quote |

    | \" | Double quote |

    | \ | Backslash |'
