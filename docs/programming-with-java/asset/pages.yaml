  md: "# 74 Programming with Java\n\n![](img/f19fd57d7c8eb6df4d32b7cfe4d13a3a_89_0.png)\n\
    \nFigure 5.1 Calling Recursive Functions\n\nTo understand the concept of recursion,\
    \ consider this example.\n\nExample 5.14 A program to demonstrate the concept\
    \ of recursion\n\n```\nclass Factorial\n{\n    int fact(int n)\n    {\n      \
    \  int result\n        if (n == 1)\n            return 1;\n        result= fact(n-1)\
    \ * n;\n        return result;\n    }\n}\nclass Exemplerecursion\n    public static\
    \ void main(String args[])n    {\n        Factorial f = new factorial();\n   \
    \     System.out.println(\"Factorial of 3 is \" + f.fact(3));\n        System.out.println(\"\
    Factorial of 4 is \" + f.fact(4));\n    }\n```\n\nThe output of the program is\n\
    \nFactorial of 3 is 6\nFactorial of 4 is 24\n\nIn this example, function fact()\
    \ is called with function n. The function fact() calls itself again and again\
    \ with argument n-1 and returns the product of fact(n-1) * n. This process is\
    \ repeated until the value of n equals 1. When the value of n equals 1, the fact()\
    \ function returns 1.\n\nNote that the recursive methods can also be defined iteratively\
    \ using \"for\", \"while\" and \"do...while\" loops. This is because recursion\
    \ makes the program execution slower due to its stack mapping and more memory\
    \ usage. In addition, recursion results in stack overflow as for each method call\
    \ new memory space is allocated to local variables and method parameters on the\
    \ stack. However, in some cases, recursive methods are preferred over their counterparts\
    \ as they make the code simpler and easier to understand. For example, it is easier\
    \ to implement Quicksort algorithm using recursion."
