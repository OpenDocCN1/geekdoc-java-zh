  md: '# 16.13 JOptionPane


    JOptionPane is a subclass of JComponent which includes static methods for creating
    and customizing dialog boxes using a simple code. Previously, you have seen that
    creating a dialog box using JDialog makes the code cumbersome. So JOptionPane
    is used instead of JDialog to minimize the complexity of the code. JOptionPane
    displays the boxes with one of the four icons (question, information, warning,
    and error) or the custom icons used by the user.


    Some of the constructors defined by the JOptionPane class are as follows.


    +   JOptionPane()

    JOptionPane(Object message)

    JOptionPane(Object message, int messageType)

    JOptionPane(Object message, int messageType, int optionType)

    JOptionPane(Object message, int messageType, int optionType, Icon icon)

    JOptionPane(Object message, int messageType, int optionType, Object[] options)

    JOptionPane(Object message, int messageType, int optionType, Icon icon, Object[]
    initialValue)


    message to be displayed in the dialog box

    messageType specifies the type of the message to be displayed. It has various
    values which are represented as: ERROR_MESSAGE, INFORMATION_MESSAGE, WARNING_MESSAGE,
    QUESTION_MESSAGE or PLAIN_MESSAGE

    optionType is used to specify the options. It can have various values which are
    represented as: DEFAULT_OPTION, YES_NO_OPTION, YES_NO_CANCEL_OPTION or OK_CANCEL_OPTION


    +   icon specifies the code to be displayed

    options is an array of options to be displayed in the dialog box with none of
    them selected

    initialValue specifies the default option selected from the list provided in options

    JOptionPane class is used to display four types of dialog boxes namely, Message
    box, Input dialog box, Confirmation dialog box, and Option dialog box.


    # 16.13.1 Message Dialog Box


    A dialog box displays plain messages to the user and is created by using the static
    method showMessageDialog(). The general form of showDialog() method is:


    ```

    public static void showDialog(Component parent, Object message)

    ```


    parent is the parent frame to which dialog box is attached

    message is the message to be displayed


    Consider Example 16.19. Here, two buttons, b1 and b2 are added to the frame. On
    clicking the buttons, corresponding dialog boxes are displayed.'
