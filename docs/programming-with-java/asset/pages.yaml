  md: '# Packages 145


    # SUMMARY


    ![](img/f19fd57d7c8eb6df4d32b7cfe4d13a3a_160_0.png)


    +   - A package is a named collection of classes. Any number of related classes
    can be grouped into a single package. The classes which belong to a package of
    another program can be easily reused. Two classes in different packages can have
    the same name.


    +   - Java packages are categorized into two types, API packages and user-defined
    packages. API (Application Programming Interface) packages are the standard packages
    in Java which contain all of the standard classes. Java also allows us to create
    our own package as user-defined packages.


    +   - There are Java naming conventions using which packages can be used. The
    names of the packages and interfaces should be such that it is easier to distinguish
    between the two. According to the conventions, the name of the packages starts
    with a lowercase letter whereas the name of the classes begins with an uppercase
    letter.


    +   - To create a user-defined package, a first package must be declared using
    the keyword package followed by the name of the package. The package statement
    must be the first statement in the Java source file. Once the package is declared,
    we can define any number of classes which will be the part of this package.


    +   - As packages are stored in the file system directories, the Java run-time
    system needs to know where to look for the package we create. There are two possible
    ways to locate package. First, the Java run-time system, by default, uses the
    current working directory. Second, a directory or paths can be specified by setting
    the CLSPATH environment variable.


    +   - If a package contains multiple classes, only one can be declared as public
    and the source file is saved with the name of public class having .java extension.
    When a source having multiple class definitions is compiled, the compiler creates
    separate .class file for each class.


    +   - Both the API packages and user-defined packages can be accessed using the
    import statement. Once the required package is imported in the program, the classes
    belonging to that package can be used.


    +   - We can hide a class in a package by not declaring public to prevent it from
    being accessed outside the package.


    ![](img/f19fd57d7c8eb6df4d32b7cfe4d13a3a_160_1.png)


