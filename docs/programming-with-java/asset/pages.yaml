  md: "# 12.6 PREDEFINED STREAMS\n\nThe package java.lang is automatically imported\
    \ by all Java programs. This package includes a class System, which holds a large\
    \ number of deprecated static methods and variables. This class contains three\
    \ predefined stream variables—in, out and err. These stream variables are declared\
    \ as static and public and are initialized with the start of JVM. They can be\
    \ used by any part of the program easily without referring to specific System\
    \ object.\n\n+   - System.out is an object of class PrintStream. It refers to\
    \ the standard output stream and is generally used to write text to the console\n\
    - System.in is an object of class InputStream. It refers to the standard input\
    \ stream and is generally used to read keyboard input in console programs.\n-\
    \ System.err is an object of class PrintStream. It refers to the standard error\
    \ stream and works in manner similar to System.out that it displays error messages.\n\
    \n# 12.7 READING AND WRITING TO CONSOLE\n\nJava 1.0 supports console input using\
    \ bytes. The use of bytes for reading/writing console requires using deprecated\
    \ methods, which is not recommended. The most desired approach for reading input\
    \ for Java 2 is to use characters instead of bytes. Java 1.1 and higher versions\
    \ of Java provide InputStreamReader to convert byte-oriented data into character-oriented\
    \ data. In order to read data from the console using character stream, System.in\
    \ is used. System.in refers to an object of type InputStream, it can be used as\
    \ a character-based input stream.\n\nAs discussed, to write the data to the console,\
    \ System.out is used which belongs to the PrintStream class. Both the print()\
    \ and println() methods perform the same task except that the println() method\
    \ writes the output in the new line while print() method writes the output in\
    \ the same line.\n\nThe statement to wrap InputStreamReader inside the BufferedReader\
    \ and create a character-based stream connected to the console System.in is:\n\
