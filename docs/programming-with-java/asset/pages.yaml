  md: '# 14.4.3 Event Listener Interfaces


    Events generated by the event source are sent to listeners which handle them in
    an appropriate manner. Event listeners implement various interfaces. Some of the
    interfaces are discussed here.


    # The ActionListener Interface


    When an action event occurs, the actionPerformed() method defined by the ActionListener
    interface is invoked.


    The general form of the actionPerformed() method is:


    ```

    void actionPerformed(ActionEvent)

    ```


    where,


    e is the reference to an object of ActionClass


    # The AdjustmentListener Interface


    When an adjustment event occurs, the adjustmentValueChanged() method defined by
    the AdjustmentListener interface is invoked.


    The general form of the adjustmentValueChanged() method is:


    ```

    void adjustmentValueChanged(AdjustmentEvent)

    ```


    where,


    e is the reference to an object of AdjustmentEvent class


    # The ItemListener Interface


    The method itemChanged() defined by the ItemListener interface is invoked when
    the state of an item is changed. The object of ItemEvent class is passed as method
    parameter.


    The general form of the method defined in ItemListener is:


    ```

    void itemChanged(ItemEvent item)

    ```


    # The KeyListener Interface


    The methods defined by the KeyListener are invoked when any key is pressed or
    released, or a character is entered. The object of KeyEvent class is passed as
    method parameter.


    The general form of the methods defined in KeyListener is:


    ```

    void keyPressed(KeyEvent)

    ```


    ```

    void keyReleased(KeyEvent)

    ```


    ```

    void keyTyped(KeyEvent)

    ```


    Note: If a key B is pressed and released, three events (key pressed, key typed
    and key released) are generated.


    # The MouseListener Interface and MouseListener Interface


    The methods defined by MouseListener are invoked when the mouse is clicked, pressed,
    released, when the mouse enters or exits the container. Similarly, the methods
    defined by the MouseMotionListener are invoked when the mouse is dragged or moved
    from one position to another. The object of MouseEvent class is passed as method
    parameter.


    The general form of the methods defined in MouseListener interface is:'
