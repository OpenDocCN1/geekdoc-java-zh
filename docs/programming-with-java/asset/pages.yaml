  md: 'The life cycle of an instance of servlet comprises three methods, namely, init()
    method, service() method and destroy() method. These methods are invoked by web
    server to initialize, invoke and destroy an instance of servlet.


    +   3. destroy() method: This method is invoked to remove the servlet permanently
    from the memory. It releases all the resources (like open file handler, connected
    database, etc.) by the servlet. Like init() method, this method is invoked only
    once during the entire life cycle of a servlet. The servlet becomes dead when
    this method is invoked. After the invocation of destroy() method, service method
    cannot be invoked.


