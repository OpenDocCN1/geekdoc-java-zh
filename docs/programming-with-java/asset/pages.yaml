    # SUMMARY


    +   - The network systems comprise a server, client, and communication media.

    - A network can be small (two computers) or as vast as Internet. Communication
    over network requires some reliable delivery services that can carry information
    between two machines.

    - The delivery services work regardless of the hardware and software used on the
    network. The Internet provides delivery services using a suite of protocols as
    TCP/IP

    - The three most used protocols with the TCP/IP suite are IP, TCP and UDP

    - The TCP (Transmission Control Protocol) is a reliable and connection-oriented
    protocol that allows the data originates from source machine to be delivered without
    error to the destination.

    - IP (Internet Protocol) is an unreliable and connectionless protocol that manages
    the address of each packet (the basic unit of IP transmissions) so that the packet
    reaches the right destination.

    - UDP (User Datagram Protocol) is an unreliable and connectionless protocol that
    enables application to send independent, self-contained messages as datagrams
    over the network.

    - Every machine on the Internet is identified by a numerical address as IP. An
    IP address consists of 32-bit number, organized as 8-bit values. It is represented
    in a format known as dotted-decimal notation.

    - A port is a local number assigned to a particular service through which the
    service is requested.

    - The combination of IP address and port number is known as socket. A socket identifies
    an endpoint of a two-way communication link between two programs running on the
    network.

    - Java facilitates creation of network applications through the classes and interfaces
    defined in the javanet package.

    - The domain names can be resolved to their IP addresses and vice versa by using
    the InetAddress class.

    - In Java, there are two types of TCP sockets: one for server and other for clients.
    These two sockets are implemented using two different classes of java.net package,
    namely, ServerSocket and Socket class

    - The Server class is used for listening for connections, that is, for clients
    to connect.

    - The Socket class is used by the client to connect to the server sockets and
