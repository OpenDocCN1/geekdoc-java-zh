    # 3.8.8 Operators Precedence and Associativity


    An expression consisting of more than one operator leads to a confusion as which
    operator is to be evaluated first. For example, consider this expression.


    a + b * c - d


    In this expression, the compiler needs which operator is evaluated first. For
    this, it is important to determine the precedence and associativity of operators.


    +   **Precedence:** The order or priority in which various operators in an expression
    are evaluated is known as precedence. Every operator in Java has a precedence
    associated with it. The operators with higher precedence are evaluated before
    operators with a lower precedence. For example, multiplication is performed before
    addition as the multiplication operator has higher precedence than the addition
    operator.

    **Associativity:** The order or priority in which operators of the same precedence
    are evaluated is known as associativity. For example, the addition and subtraction
    operators have the same precedence. However, addition or subtraction may be performed
    on the expression depending on order of occurrence.


    The associativity of an operator can be either from left to right or from right
    to left. The operators with left to right associativity are evaluated from the
    left hand side while the operators with right to left associativity are evaluated
    from the right hand side.


    The precedence and associativity of Java operators are listed in Table 3.7. Note
    that the precedence of operators decreases from top to bottom, that, the priority
    is highest at the top.


    |Table 3.7 Precedence and Associativity of Java Operators

    | Operators | Description | Associativity |

    |---|---||

    | . | Direct member selector | Left to right |

    | 0 | Function Call | Left to right |

    | [] | Array subscript | Left to right |

    | ++ | Unary minus | Right to left |

    | -- | Increment | Right to left |

    | ! | Decrement | Right to left |

    | ~ | Logical negation | Right to left |

    | (type) | Ones completion | Right to left |

    | | Casting | Right to left |

    | | | Contd..'
