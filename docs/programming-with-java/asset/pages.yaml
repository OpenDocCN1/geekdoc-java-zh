    # PACKAGES


    # CHAPTER OBJECTIVES


    +   After reading this chapter, you will be able to:

    - Understand what is package and what is the advantage of using a package

    - Explain various API packages and how they can be used in our program

    - Explain how to create and access a user-defined package

    - Understand CLASSPATH

    - Discuss adding of class to a package and hiding a class in a package


    # 9.1 INTRODUCTION


    Code reusability is one of the important features of object-oriented programming.
    So far we have seen that a code can be reused through inheritance. However, the
    reusability of code through inheritance was restricted to only single program.
    A situation may arise when the code of one program needs to be reused in some
    other program. This can be achieved in Java with the help of the concept **package.**


    # 9.2 PACKAGES


    +   A package is a named collection of classes. Any number of related classes
    can be grouped into a single package. By grouping the classes into a package,
    we can achieve the following:

    - The classes which belong to a package of another program can be easily reused.

    - Two classes in different packages can have the same name. For example, we can
    create a class named `Student` without being concerned about the collision of
    this name with some other class `Student` which belongs to some other package.

    Every class belongs to a package. The classes that we have created and used so
    far belong to the `default` package. Java packages are categorized into two types,
    namely, `API packages` and `user-defined packages`. API (Application Programming
    Interface) packages are the standard packages available in Java which contain
    all of the standard classes. Java also allows us to create our own packages known
    as `user-defined packages`.


    # 9.3 JAVA API PACKAGES


    There is a huge list of API packages provided by Java. Some of the frequently
    used packages shown in Table 9.1.'
