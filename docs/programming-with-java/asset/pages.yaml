    # 18.8 USING THE BEANINFO INTERFACE


    The introspection mechanism is provided by Java Beans API architecture. The BeanInfo
    interface defined in java beans package a set of methods that give the explicit
    information about the associated beans. The name of the class that implements
    BeanInfo interface must be beanName(BeanInfo) beanName is the name of the bean.
    The methods provided by BeanInfo interface are as follows:


    +   - PropertyDescriptor[] getPropertyDescriptors(): This method is used to determine
    the properties of a bean. The getPropertyDescriptors method returns an array of
    PropertyDescriptor.

    - EventDescriptor[] getEventSetDescriptors(): This method is used to determine
    a bean''s events. The getEventSetDescriptors method returns an array of EventDescriptor.

    - MethodDescriptor[] getMethodDescriptors(): This method is used to determine
    the public methods of a bean. The getMethodDescriptors method returns an array
    of MethodDescriptor.'
