  md: '# JAVA DATABASE

    CONNECTIVITY (JDBC)


    # CHAPTER OBJECTIVES


    +   After reading this chapter, you will be able to:

    * Explain the architecture of JDBC

    * Explain JDBC-ODBC bridge

    * Understand the classes and interfaces of java.sql


    # 17.1 INTRODUCTION


    Accessing a database in Java requires Java Database Connectivity (JDBC). JDBC
    provides a standard API that is used to access databases, through Java, regardless
    of the DBMS. All the direct interactions with specific DBMSs are accomplished
    by DBMS driver. It acts as a wrapper that sends SQL requests to the server.


    # 17.2 OVERVIEW OF JDBC


    The architecture of JDBC has four components—application, driver manager, data
    source specific drivers and corresponding data sources.


    An application establishes and terminates the connection with a data source. The
    main goal of driver manager is to load JDBC drivers and pass JDBC function calls
    from the application to the corresponding driver. The driver establishes the connection
    with data source. The driver performs various basic functions like submitting
    requests and returning results. In addition, the driver translates data, format
    and error codes from a format that is specific to data into the JDBC standard.
    The data source processes commands from the driver and returns the results. JDBC
    Drivers can be classified into four categories as follows.


    +   * JDBC-ODBC-Bridge Driver: This type of driver is used to access data through
    drivers using ODBC standard.

    * Native API partly-Java Driver: This driver is specific to every database and
    converts the JDBC calls to specific calls. For example, Oracle database will have
    its own native API, Sybase will have its own native API.

    * Net protocol all-Java Client Driver: This driver is server based driver that
    uses network protocol and middleware for communicating with the server which translates
    it to the DBMS specific function calls.

    * Native protocol all-Java Driver: This driver is entirely written in Java, which
    directly communicates with the database server without including any translation
    steps.'
