    \ the error-handling code from the rest of the program. This makes the program\
    \ less complex, more readable, and efficient. The normal execution path is not\
    \ interrupted by checking errors. Moreover, the exception handling routine (called\
    \ exception handler) is invoked automatically when an error occurs.\n\nJava exception\
    \ handling is governed by the following five keywords:\n\n+   * try\n* catch\n\
    * finally\n* throw\n* throws\n\nA set of statements that needs to be monitored\
