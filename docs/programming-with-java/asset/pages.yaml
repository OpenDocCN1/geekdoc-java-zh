  md: 'JSP is a text file containing HTML code and JSP elements. Whenever a client
    sends a request for a JSP page of the web server for the first time, it is sent
    to JSP engine. The JSP engine compiles JSP page to a servlet, servlet engine executes
    it and sends the resultant content back to the client.


    # 19.9.1 Elements of JSP


    The code of JSP page includes the following.


    +   * Directives

    "* Declarations

    "* Scriptlets

    "* Expressions"


    # Directives


    These statements provide information about the current JSP page to the JSP engine.
    The three possible directives in JSP are page directive, include directive and
    taglib directive.


    # page Directive


    It is used to provide information that can be used to configure the settings of
    a JSP page. This information can be used while compiling the JSP page. It includes
    several attribute which can be used for specifying the scripting language being
    used by (default, Java), importing Java classes or packages, determining whether
    the output stream is buffered, specifying importing path of the JSP for handling
    errors, etc. The syntax of a page directive is:


    ```

    <@ page attributes="value" %>

    ```


    For example, consider this example.


    ```

    <@ page import="java.util.*" %>

    ```


    This statement includes java.util.* package in the current JSP page.


    # include Directive


    It is used to include text or code from other files like HTML file, JSP file or
    text file. The content of the file is included during the compilation time of
    the current JSP file. The syntax of an include directive is


    ```

    <@ include file="filename" %>

    ```


    where,

    filename is the name of the file whose content has to be included


    # taglib Directive


    It is used to inform the compiler that the current JSP page uses a set of custom
    tags and it also specifies the prefix used with custom tags. The syntax of a taglib
    directive is


    ```

    <@ taglib uri="nameoftagfile" prefix="prefixfortag %>

    ```


    where,

    nameoftagfile is the file name (library) that includes custom tags

    prefixfortag if the prefix used with custom tags.'
