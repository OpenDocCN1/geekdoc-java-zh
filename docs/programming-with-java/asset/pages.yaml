    # 20.2.1 TCP/IP Protocols


    The three most commonly used protocols within the TCP/IP suite are IP, TCP and
    UDP. To develop network application, one must have a clear understanding of these
    protocols.


    # **TCP (Transmission Control Protocol)**


    The TCP (Transmission Control Protocol) is a reliable and connection-oriented
    protocol that allows the data that originates from source machine to be delivered
    without error to the destination. TCP sets up a connection between the source
    machine and the destination machine by transmitting control information before
    initiating the communication. This mechanism is known as handshake. Once the connection
    is established, data transfer between the two machines begins. TCP fragments the
    data into discrete messages (known as TCP segments) and passes them to the internet
    layer. At the destination, the receiving TCP sends an acknowledgement that guarantees
    that the data has been received. It reassembles the segments to form the original
    message. In case the segments are lost or corrupted, TCP is responsible for retransmitting
    the necessary segments. When all the data has been exchanged between these machines,
    it closes the connection.


    # **IP (Internet Protocol)**


    IP (Internet Protocol) is an unreliable and connectionless protocol that manages
    the address part of each packet (the unit of IP transmissions) so that the packet
    reaches the right destination. Being a connectionless protocol, IP does not transmit
    control information before initiating communication between the source and the
    destination. It sends data from the source to the destination expecting that the
    data will be delivered at the receiving end. It is unreliable as it does not retransmit
    lost or corrupted packets, that is, does not guarantee the safe delivery of packets.


    # **UDP (User Datagram Protocol)**


    Unlike TCP-based applications, some network applications do not require a host-to-host
    and reliable channel of communication. They require a mode of communication which
    transmits independent, self-contained messages whose time of arrival, order of
    arrival, etc., are not guaranteed. This mode of network communication is governed
    by the UDP protocol. The UDP (User Datagram Protocol) is an unreliable and connectionless
    protocol which enables application to send independent, self-contained messages
    known as datagrams over the network. It has no mechanism for detecting errors
    or retransmitting lost or corrupted information. It is used in the applications
    that require prompt delivery instead of accurate delivery such as weather forecasting,
    client server, video, games, audio, etc.'
