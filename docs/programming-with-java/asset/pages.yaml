  md: '# Types of URL


    There are two types of URL, namely absolute URL and relative URL.


    +   - Absolute URL: An absolute URL defines the exact location of the web page
    or any other resource on the Internet. For example, http://www.yahoo.com/education/FIIT/home.htm.
    Here, the web page home.htm is stored under the folders/education/FIIT on the
    server web: yahoo.com.

    - Relative URL: In a relative URL, each part of a URL does not need to be specified.
    You can abbreviate a URL by making it “relative” to the current location. For,
    suppose there exists a file picture.gif residing in the image folder under the
    FIIT folder. The relative URL for the file will be /mypicture.gif.


