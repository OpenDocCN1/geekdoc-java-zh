    \ changes made to the length, breadth and height of this passed object in the\
    \ vol() method are reflected in the original values.\n\n# 5.7 STATIC VARIABLES\
    \ METHODS\n\nSo far, we have seen that members of a class can be initialized or\
    \ accessed by its objects only. However, it is possible to define members of a\
    \ class without reference to a specific object. This is done by declaring the\
    \ instance variables and methods of a class as static. Unlike non-static members,\
    \ the static members are associated with the class as a whole, rather than with\
    \ individual objects. Therefore, outside the static members of a class are called\
    \ using class names rather than through objects. Since the static variables and\
    \ static methods contain the properties of a class and not of the individual objects,\
    \ they are also known as class variables and class methods, respectively.\n\n\
    The static variables and static methods of a class are also called class variables\
    \ and class methods, respectively.\n\nThe syntax to declare static variable is:\n\
    \n```\nstatic return_type variable_name;\nThe syntax to access static variable\
    \ is:\n```\n\n```\nclass_name.variable_name\nThe syntax to declare static method\
    \ is:\n```\n\n```\nstatic return_type method_name(parameter_list);\nThe syntax\
    \ to access static method is:\n```\n\n```\nclass_name.method_name\n```\n\nIf a\
    \ class is declared as static, only one copy of data member is created, regardless\
    \ of the number of objects. All the objects of a class share this single copy\
    \ of the static data member.\n\nExample 5.7 A program to demonstrate the use of\
    \ static members of a class\n\n```\nclass StaticMembers\n{\n    static int i=10;\
    \ //static variable\n    static void add(int x, int y) //static method\n    {\n\
    \        System.out.println(\"Sum of two numbers is: \"+(x+y));\n    }\n}\nclass\
