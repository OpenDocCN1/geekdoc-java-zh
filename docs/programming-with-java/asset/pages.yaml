  md: '# 17.4.3 The Statement Interface (Handling database queries statically)


    The statement interface provides methods that are used to execute SQL statements.
    The SQL statements are queries, insertions, updates and deletions, etc.


    Some of the methods of the Statement interface are as follows.


    +   - void close(): This method closes database connections associated with Statement''s
    object and releases JDBC resources.

    - boolean execute(String sql): This method is used to execute an SQL statement
    that might produce multiple result sets or multiple counts. It returns true if
    multiple result sets are produced and false if multiple counts are generated.

    - int execute(String sql): This method is used to execute an SQL statement that
    gives information about affected rows. For example, if we execute the statements
    like INSERT, DELETE, the result will be only a number of rows affected.

    - ResultSet execute(String sql): This method executes a query and returns a ResultSet
    object. A result object is like a table containing the resultant data.

    - ResultSet getResultSet(): This method returns the first result set or multiple
    count generated on the execution of execute(String sql) method. If there is no
    result, it returns null value.

    - int updateCount(): After the execution of the execute(String sql) method updates
    may be generated. This method returns the first update count and clears it. More
    update counts can be retrieved by getSearchResults(). Note that this method returns
    -1 if there is no update count or when only result sets are generated on execution
    of execute(String sql) method.

    - boolean getResults(): This method is used to retrieve the next result set in
    multiple result set or to the next count in multiple update count generated on
    execution of execute(String sql) method. It returns a true if multiple sets are
    available and returns a false if update counts are available.


    # 17.4.4 The ResultSet Interface


    The execution of SQL statement results in a table which consists of rows and columns
    containing the resultant data. The data can be retrieved from the table using
    methods of the ResultSet interface. Some methods of the ResultSet interface are
    as follows.


    +   - boolean next(): This method is used to move the ResultSet cursor to the
    next row of the data. Initially, the ResultSet cursor is positioned before the
    first row. It returns false value if there are no more rows in the ResultSet.

    - String getString(int index): This method returns the string value that is stored
    in the column number, index. For example, if the value of index is 2 then it will
    return the value of second column number.

    - String getString(String column): This method returns the string value that is
    stored in the column by the column name column.


    Example 17.1 A program to establish connection and retrieve data from Student
    database import java.sql.*'
