  md: '# Java and the Internet


    # The Main Statement


    The statement public static void main(String args[]) indicates the main method.
    This method is the point where the execution of Java program begins. Since, it
    is the startup point of any Java program, it is the most essential part of any
    program.


    This statement has keywords, public, static and void. The descriptions of these
    keywords are as follows:


    +   * public: It is an access specifier which specifies that the main method is
    accessible to all other classes.

    "* static: The method is declared static which specifies that this method belongs
    to the entire class. Interpreter uses this method before the creation of objects.

    "* void: The void keyword specifies that the main method does not return a value.
    The pair of parentheses contains the declaration of the parameters of the methods.
    In the above case, the String args[] declares a parameter args, that contains
    an array of objects of the class String.


    # The Output Statement


    The Statements System.out.println("Welcome to Java Programming."); and System.out.println("Its
    easy and simple."); are used to display information on the standard output device,
    that is, the println() is a method of the out object, which is the static member
    of class System. These statements will display the following strings on the monitor.


    Welcome to Java Programming.

    Its and simple.


    The statements will be printed in separate lines as the method println() appends
    a newline character at the end of the string. However, if we use print() instead
    of println() newline character is not appended at the end of the string. Note
    that like C++, every statement in Java must end with a semicolon.


    # RUNNING JAVA APPLICATIONS


    A program can be created using any text editor. Nowadays, there are several text
    editors available for writing programs like Notepad, Jcreator, After creating
    the file, save the file with the name <filename>.Java. The name of the file will
    be the same as the class name containing the main().


    Once the file is created, it can be compiled to generate the bytecode using Java
    compiler javac as given here.


    ```

    Sample.java

    ```


    If the source code is error then the compiler creates a file containing the bytecode
    and the file will be named <filename>.class. In our example, the name of file
    will be Sample.class.


    Even though compilation, the source code is converted into its equivalent bytecode,
    it cannot be executed. To execute this bytecode, it needs to be converted to machine
    code using the interpreter. The command for converting bytecode to machine code
    and run it is as follows:


    ```

    java Sample

    ```


    After giving this command, the interpreter searches for the main() method in the
    source code and starts executing the instructions written in this method and displays
    the corresponding output.'
