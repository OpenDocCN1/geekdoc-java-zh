  md: '# 372 Programming with Java


    # Create a JAR file


    A JAR file can be created using the command as shown here.

    `jar options [manifestFile] jarFile inputFile(s)`


    where,

    options are the various options that can be used with this command.

    `manifestFile` is the name of the manifest file that is to be included in the
    resultant JAR file.

    `jarFile` is the name with which you want to create the JAR file.

    `inputFile(s)` is a space-separated list of one or more files that are to include
    in the JAR file. This argument can contain the `*` symbol. If `inputFile(s)` is
    a directory, the contents of directory is added to the JAR file recursively.


    The various options that can be used with JAR command along with their description
    are listed in Table 18.1.


    # Table 18.1 Options Used with JAR Command


    | Option | Description |

    | --- | --- |

    | c | Indicates a new JAR file is to be created |

    | C | Used to change directories during execution of the command |

    | f | Identifies the file to be created, listed or extracted |

    | i | Indicates the index information should be provided |

    | m | Used to include manifest information from an external manifest file |

    | M | Indicates the default manifest file should not be created |

    | t | Displays the table of contents of a JAR file |

    | u | Updates a JAR file |

    | v | Displays verbose output while the command executes. The verbose output tells
    you the name of each file as it is added to the JAR file |

    | 0 (zero) | Indicates that compression of JAR file is not needed


    Note more than one option can be used with the JAR command. They can appear in
    either order but must not be any space between them.


    A JAR file named `Abc.jar` containing all the `*.class` and `*.jpg` in the current
    directory and having a manifest named `Xyz.mf` can be created as follows:

    `jar cf Xyz.mf Abc.jar *.class *.jpg`


    # View the contents of a JAR file


    The contents of a JAR file can be displayed using the command as shown here

    `jar tf jarFile`


    For example, the contents of the `Abc.jar` file we have created can be listed
    as follows:

    `jar tf Abc.jar`'
