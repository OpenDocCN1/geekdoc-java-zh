  md: "# Java Swing 339\n\n# 16.15 TIMER\n\nA Timer is an object of Timer class which\
    \ is the subclass of Object present in java.lang package. A Timer fires one or\
    \ more action events after regular interval of time (in milliseconds) called delay.\
    \ The amount of delay is specified at the time of creation. A Timer is used in\
    \ a program by creating a timer object and invoking start() method. When the timer\
    \ is started, an event of Action type is fired and the code enclosed in actionPerformed()\
    \ of the corresponding listener class is executed. The corresponding class must\
    \ implement the ActionListener interface. The Timer can also be made to fire an\
    \ event only once by setting its methodRepeats() to false. The methods stop()\
    \ and restart() can be called to stop or restart the timer, respectively.\n\n\
    The Timer can be created using the following constructor.\n\n```\nTimer(int delay,\
