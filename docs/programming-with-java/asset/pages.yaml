  md: "# 5.4 ACCESSING MEMBERS OF A CLASS\n\nEach object of a class has its own set\
    \ of variables. These variables should be assigned values before using them in\
    \ the program. The instance variables and methods added in the program cannot\
    \ be accessed directly outside the class using their names. To access the variables\
    \ and methods outside the class, (.) operator is used as follows.\n\n```\nobject_name.variable_name\n\
    object_name.method_name(parameter_list)\n```\n\nwhere,\nvariable_name is the name\
    \ of the instance variable that is to be accessed\nmethod_name is the name of\
    \ the method which is to be called\nparameter_list is the series of data types\
    \ and their respective identifiers\nFor example, the instance variable length\
    \ of Cuboid class can be accessed as follows.\n\ncobj.length;\nSimilarly, the\
    \ method volume () of Cuboid class can be accessed as follows:\ncobj.volume();\n\
