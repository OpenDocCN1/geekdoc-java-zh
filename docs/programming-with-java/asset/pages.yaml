    # 3.1 INTRODUCTION


    In any programming language, writing even an elementary program requires the knowledge
    and

    clear understanding of various data types, variables, constants and operators
    provided by that

    language. All these constitute the most basic elements of a language which are
    combined to form an

    instruction and a set of these instructions constitute a program. In this chapter,
