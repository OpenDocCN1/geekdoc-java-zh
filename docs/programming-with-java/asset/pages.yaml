    ```\n\nThis program will generate a compile-time error since the class Person\
    \ is a final class and cannot be inherited.\n\n# 7.9 ABSTRACT METHODS AND CLASSES\n\
    \nAs discussed earlier, a method can be prevented from being overridden in the\
    \ subclass by using the superclass final keyword. However, sometimes there might\
    \ be a situation, when the method in the superclass always needs to be redefined\
    \ in the subclass and for this overriding becomes necessary. This kind of situation\
    \ can arise when the superclass is not able to provide meaningful implementation\
    \ for its methods. In such a case, the superclass provides a generalized structure\
    \ of method and leaves the implementation part to its subclass. Java allows us\
    \ to specify that a method must always be overridden in the subclass by using\
    \ the abstract keyword in the method declaration.\n\nThe syntax for declaring\
    \ an abstract method is:\n\n```\nabstract data_type method_name();\n```\n\nIf\
    \ a class has one or more abstract methods, the class must also be declared as\
    \ abstract by using the keyword abstract.\n\nThe syntax for declaring an abstract\
    \ class is:\n\n```\nabstract class class_name\n{\n    abstract data_type method_name();\n\
    }\n```\n\nThe class which inherits the abstract class must provide implementation\
    \ for all the methods of the class should declare itself as abstract.\n\nThese\
    \ are certain points that should be kept in mind while using abstract class.\n\
    \n+   - An abstract class cannot be instantiated.\n- Abstract methods of an abstract\
    \ class must always be implemented in the subclass.\n- Abstract methods must end\
    \ with semicolon (;) because they do not have any functionality.\n- There can\
    \ be both defined and undefined methods in an abstract class.\n- Constructors\
    \ or static methods cannot be declared as abstract.\n\nExample 7.12 A program\
    \ to demonstrate the concept of abstract class\n\n```\nabstract class Person //abstract\
    \ class\n```"
