  md: '# Event Handling 255


    ![](img/f19fd57d7c8eb6df4d32b7cfe4d13a3a_270_0.png)


    Figure 14.2 Java 1.1 Event Handling Mechanism


    Now we discuss Event Source and Event Listener in detail.


    +   * **Event source**: An event source is an object that generates a particular
    kind of event. An event is generated when the internal state of the event source
    is changed. A source may generate more than one type of event. Every source must
    register a list of listeners that are interested to receive the notifications
    regarding the event. Event source provides methods to remove listeners.


    The general form of method to register (add) a listener is:


    ```

    public void addTypeListener(EventListener listener)

    ```


    Similarly, the general form of method to unregister (remove) a listener is:


    ```

    public void removeTypeListener(EventListener eventlistener)

    ```


    where,


    **Type** is the name of the event

    EventListener is a reference to the event listener


    +   * **Event listener**: An event listener is an object which receives notification
    when an event occurs. As already mentioned, only registered listeners can receive
    notifications from sources as specific types of events. The role of event listener
    is to receive these notifications and process them.


    # 14.4 EVENT HANDLING


    Java provides various classes and interfaces to handle the generated events. Some
    of these are discussed in this section.


    # 14.4.1 Event Classes


    Java 1.1 event classes encapsulate all types of events occurring in the system.
    A successful handling of the events requires in-depth understanding of these classes.
    All these classes have been arranged in a hierarchy having EventObject as its
    root element. This class acts as the superclass of all the event classes. Event
    class belongs to java.util package. Some of the event classes along with their
    description are listed in Table 14.1.'
