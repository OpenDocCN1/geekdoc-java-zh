    for execution.


    # Floating Point Type


    A floating point type is used to store real numbers such as 3.28, 64.755765, -8.01-24.53.
    Java supports two floating point data types, namely, float and double.


    +   * float: The float type represents a single-precision number. Single precision
    occupies lesser space than double precision but becomes inaccurate when the values
    are large. It can be used to represent value marks of the students. The default
    value of float data type is 0.0.

    * double: The double type specifies a double-precision number. It is the best
    choice when we need to store large-valued numbers. For example, it can be used
    when we want to use mathematical functions like sin(), cos(), sqrt(). The default
    value of double data type is 0.0d.


    The various floating point data types with their size and range are listed in
    Table 3.5.


    # Table 3.5 Size and Range of Floating Point Types


    | Type | Size(bytes) | Range |

    |---|---|---|n| float | Four | 3.4e-038 to 3.4e+038 |

    | double | Eight | 1.7e-308 to 1.7e+308 |


    # Character Type


    The character data type is used to store single character enclosed in single quotes.
    It is represented by using char keyword. It occupies 16 bits of memory. The range
    of the character data type is 0 to 65,536. The default value of char data type
    is null character.


    # Boolean Type


    The boolean data type can hold only boolean values, that is, true or false. The
    keyword boolean is used to denote the boolean data type. The default value of
