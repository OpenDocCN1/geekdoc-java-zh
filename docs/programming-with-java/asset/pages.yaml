    # Output Stream classes


    Java''s output classes are used to write 8-bit bytes to a stream. The OutputStream
    class is the superclass for all byte-oriented output stream classes. All the methods
    of this class throw an IOException. Being an abstract class, the OutputStream
    class cannot be instantiated, its subclasses are. Some of these are listed in
    Table 12.3.


    # Table 12.3 Output Stream Classes


    | Class | Description |

    | --- | --- |

    | BufferedOutputStream | contains methods to write bytes into the buffer |

    | ByteArrayOutputStream | contains methods to write bytes into a byte array |

    | DataOutputStream | contains methods to write Java primitive data types |

    | FileOutputStream | contains methods to write to a file |

    | FilterOutputStream | contains methods to write to other output streams |

    | ObjectOutputStream | contains methods to write objects |

    | PipedOutputStream | contains methods to write to a piped output stream |

    | PrintStream | contains methods to print Java primitive data types |


    The OutputStream class defines methods to perform writing operations. These methods
    are discussed in Table 12.4.


    # Table 12.4 OutputStream Class Methods


    | Method | Description |

    | --- | --- |

    | write(int i) | writes a single byte to the output stream |

    | write(byte buffer[]) | writes an array of bytes to the output stream |

    | write(bytes buffer[], int loc, int nBytes) | writes ''nBytes'' to the output
    stream from the buffer b starting at buffer[loc] |

    | flush() | flushes the output stream and writes the waiting buffered output |

    | close() | closes the output stream. If an attempt is made to write even after
    closing the stream then it generates IOException |'
