  md: '# Programming with Java


    have some other properties that are not common and differentiate them. Thus, the
    vehicles class is the generalization of automobiles and pulled-vehicles class,
    and automobiles and pulled-vehicles classes are the specialized versions of the
    vehicles class. Note that while inheriting the vehicle class, the automobiles
    and pulled-vehicles do not modify the properties of the vehicle class, however,
    add new properties that are exclusive for them (see Figure 1.6).


    ![](img/f19fd57d7c8eb6df4d32b7cfe4d13a3a_23_0.png)


    Figure1.6 Inheritance


    In the way, OOP allows one class to inherit the properties of another class or
    classes. The class, which is inherited by the other classes, is known as **superclass**
    or **base class** or **parent class** and the class, which inherits the properties
    of the base class, is called **sub class** or **derived class** or **child class**.
    The sub class can further be inherited to form other derived classes. For example
    in Figure 1.6, car and scooter are the derived classes of automobiles and rickshaw
    and bicycle are the derived classes of pulled-vehicles.


    The main advantage of inheritance is reability. The existing classes can be re-used
    in new software instead of writing a new code. Moreover, new features can be added
    without altering or modifying the features of the existing class.


    # 1.5.6 Polymorphism


    Polymorphism (a Greek word meaning having multiple forms) is the ability of an
    entity as a function or a message to be processed in more than one form. It can
    also be defined as the property of an object belonging to a same or different
    class to respond to the same message or function in a different way. For example,
    if a change_gear is passed to all the vehicles then the automobiles will respond
    to the message appropriately however, the pulled vehicles will not respond. The
    concept of polymorphism plays an important role in OOP as it allows an entity
    to be represented in various forms.


    # 1.5.7 Method Overriding


    A base class method can be inherited in the derived class, however, sometimes
    it may need to be redefined according to the requirement in the derived class.
    This redefining of the base class method in the derived class is called **method
    overriding** (another form of polymorphism). Method overriding implies that a
    method in a derived class has the same name as that of the base class method,
    however, it has a different implementation.'
