    Value of instance variable j:20\n\nIn this program, the use of this keyword resolves\
    \ the problem of name space collision as it refers to the current object (object\
    \ that invoked the constructor).\n\n# 5.15 GARBAGE COLLECTION\n\nAs already discussed,\
    \ the new operator in Java is used to allocate memory space to the objects dynamically.\
    \ This memory space needs to be free occupying the object occupying it gets destroyed\
    \ or is no longer needed in the program. Java provides us a mechanism known as\
    \ garbage collection, which handles the deallocation of the object automatically.\
    \ When there are no references to an object available, the memory occupied by\
    \ the object can be reclaimed by the garbage collector without the need to explicitly\
    \ destroy the object. The process of garbage collection occurs periodically to\
    \ collect the memory space occupied by objects that are no longer referenced either\
    \ directly (during program execution) or indirectly by other referenced objects.\n\
    \n# 5.15.1 The finalize() Method\n\nSometimes there might be a situation when\
    \ an object is holding some non-object resources like file descriptor which cannot\
    \ be freed by the garbage collector. Then we need to ensure that these resources\
    \ are free before the object gets destroyed. To deal with such situation, finalize()\
    \ method is used. All the operations which must be performed just before the object\
    \ is destroyed are placed inside the finalize() method. The Java runtime calls\
    \ this method whenever an object is about to be recycled.\n\nThe syntax of finalize()\
    \ method is:\n\n```\nprotected void finalize()\n{\n    //finalization code\n}\n\
    ```\n\nThe keyword protected is an access specifier that prevents access to the\
    \ finalize() method by the code outside the class."
