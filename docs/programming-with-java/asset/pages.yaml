    # 3.8.5 Conditional Operator


    The conditional operator selects a value based on specified condition. Note that
    the conditional operator is a ternary operator, that this involves three operands.


    The syntax of the conditional operator is


    ```

    expression1 ? expression2 : expression3

    ```


    If expression1 is true, then expression2 is evaluated, otherwise expression3 is
    evaluated.


    To understand the working of conditional operator, consider this example.


    Example 3.6 Evaluate the following statement.


    ```

    (x==5) ? 8 : 9;

