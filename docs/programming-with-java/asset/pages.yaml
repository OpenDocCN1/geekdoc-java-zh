    # VECTORS


    The Vector class contained in the java.util package defines methods to store objects
    into a single unit. It can be used to implement dynamic array called vectors which
    can accommodate any number and type of objects. Consider the following statements:


    ```

    Vector v1=new Vector( ); //creating vector without specifying

    //its initial capacity

    Vector v2=new Vector(n); //creating vector having initial //ncapacity ''n''

    ```


    Here, the first statement creates a vector v1 having initial capacity 10. That
    is, when you create a vector without specifying its initial capacity is automatically
    set to 10. Similarly, the second statement creates a v2 by specifying its initial
    capacity but this specification does not put any limitation on the size of the
    vector. Since, the size of the vector can be increased or decreased by adding
    or removing objects to it.


    The Vector class provides a variety of methods which can be used to perform different
    operations on vectors. Some of these are listed in Table 6.3.


    | Methods | Description |

    |---|---|n| vector1.addElement(object) | adds the specified object at the end
    of the vector list vector1 |

    | vector1.size() | returns the number of objects present in the vector vector
    |

    | vector1.capacity() | returns the maximum capacity of the vector vector1 |

    | vector1.removeElement(object) | removes the specified object from the vector
    vector1 |

    | vector1.elementAt(n) | returns the name of the n<sup>th</sup> object of the
    vector vector1 |

    | vector1.removeAt(n) | removes the item at the n<sup>th</sup> position of the
    vector vector1 |

    | vector1.removeAllElements() | removes all elements in the vector vector1 |

    | vector1.firstChild() | returns the first element of the vector vector1 |

    | vector1.lastElement() | returns the last element of the vector vector1 |

    | vector1.trimSize() | sets the capacity of the vector vector1 to the number of
    objects it is currently holding |


