    \ tokens is: 11\nTotal number of lines is: 7\n\n#  12.12 THE transient AND volatile\
    \ MODIFIERS\n\nThe transient and volatile modifiers are the two special modifiers\
    \ provided by Java which are used to handle some specialized situations.\n\n#\
    \ transient\n\nAs already discussed, object serialization is the process of reading\
    \ and writing objects. By default, all objects are serializable, that is, they\
    \ can be read from and written to the secondary memory so that the value they\
    \ hold. To make an object non-serializable, the transient modifier is used. If\
    \ an instance variable is declared as transient the values of it will not persist\
    \ while writing its object to the secondary memory.\n\nTo understand the concept\
    \ of transient, consider the code segment given below.\n\n```\nclass TransientExample\
    \ {\n    transient double first;   // will not persist\n    double second;   \
    \        //will persist\n}\n```\n\nHere, when the object of class TransientExample\
    \ is written to the secondary memory, the values of first will not be saved while\
    \ the value of second will be.\n\n# volatile\n\nThe volatile modifier is used\
    \ to tell the compiler that the variable declared as volatile can be changed at\
    \ any time by the other parts of the program. This modifier is mainly in multithreading\
    \ in which a program (process) is divided into two or more subprograms (subprocesses),\
    \ each of which runs by a separate thread and performs different tasks concurrently.\
    \ In a multithreaded program, various threads share the same instance variable\
    \ and keep their own copy of the variable in their local cache memory and the\
    \ main memory remains. Whenever a thread changes the value of it updates only\
    \ in its local cache memory and not the main memory. This leads to inconsistency\
    \ because the thread using the same variable does not know the change of the value\
    \ by another thread. To avoid this problem, volatile modifier is used. When a\
    \ variable is declared as volatile, it is not stored in the cache memory and its\
    \ value is updated in the main memory, so that the other threads can easily access\
    \ the updated value.\n\n#  12.13 USING instanceof OPERATOR\n\nThe instanceof operator\
    \ is an operator which is used to check whether the object belongs to a particular\
    \ class or not."
