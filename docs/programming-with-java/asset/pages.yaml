  md: '# Objected-Oriented Methodology


    # 1.5.3 Abstraction


    Abstraction is a mechanism to hide irrelevant details and represent only the essential
    features so that one can focus on important things at a time. It allows managing
    complex systems by concentrating on the essential features only. For example,
    while driving a car, a driver knows only the essential features to drive a car
    such as clutch, brake, accelerator, gears, steering, etc., and doesa not about
    the internal details of the car like motor, engine, wiring, etc.


    Abstraction can be of two types, namely, data abstraction and control abstraction.
    Data abstraction (also known as data hiding) means hiding the details about the
    data and control abstraction means hiding the implementation details. In object-oriented
    approach, one can share both data and functions. However, the classes in OOP are
    defined in a way that the data is hidden from the outside world and the functions
    public interface. That is, the functions of the class can be directly accessed
    by other functions outside the class, and the hidden data can be accessed indirectly
    by the help of these functions.


    Since the internal details of the class are hidden from the outside world, the
    data abstraction ensures security of data by preventing it from accidental changes
    or manipulations by other parts of the program.


    Note: Classes in the object-oriented programming are also known as Abstract Data
    Types (ADT).


    # 1.5.4 Encapsulation


    Encapsulation is the technique of binding and keeping the data and functions (that
    operate on them) together in a single unit that they share a class. Encapsulation
    is the way to implement data abstraction. A well-encapsulated object acts as a
    ''black box'' for other parts of the program. That, it provides services to the
    external functions or other objects that interact with it. However, these external
    functions or the objects do not need to know their internal details. For example,
    in Figure 1.5 the data p_code, p_name, p_price and qty_in_hand and the functions
    display_product() and check_qty are encapsulated in a class Product.


    # 1.5.5 Inheritance


    Inheritance can be defined as the process by which an object of a class acquires
    characteristics from the object of another class. As stated earlier, the objects
    of a similar kind are grouped together to form a class. However, sometimes a situation
    arises when different objects cannot be grouped under a single group as they share
    only some common characteristics. In this situation, the classes are defined in
    a way that the common features are combined to form a generalized class and the
    specific features are combined to form a specialized class. The specialized class
    is defined in a way that in addition to the individual characteristics and functions,
    it also inherits all the properties and the functions of its generalized class.


    In the real world, all the vehicles cannot be automobiles—some of them are pulled-vehicles
    also. Thus, both car and scooter are vehicles that come under the category of
    automobiles. Similarly, rickshaw and bicycle and pulled-vehicles are the vehicles
    that inherit the common properties of the vehicle class and also'
