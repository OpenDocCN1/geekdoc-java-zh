    uses both compiler and interpreter for its program execution. First, the compiler
    converts the program code to bytecode in turn is converted to machine code on
    any machine using the interpreter. The machine code so generated can be executed
    irrespective of the system on which it is executed.


    +   - Architecture-neutral (platform-independent): This feature makes Java language
    very special. Java programs can run on any platform, they can run on different
    CPU and on different operating system architectures. The bytecode produced by
    Java compiler can be on any machine which has Java runtime.


    +   - Object-oriented language: Java is an object-oriented language as everything
    in Java is an object. The objects and classes are extensible and can be used anywhere
    in the program in the form of packages.


    +   - Robust: Java is a robust language because of two reasons. First, it is a
    strictly typed language that checks the code at the compile time. Secondly, Java
    does memory management in an effective way. In C++, the programmer has to manually
    deallocate the dynamic memory used by objects. Java automatically deallocates
    free memory that is no longer referenced by the objects (with help of garbage
    collector).


    +   - Distributed: Since Java is platform independent, it is suitable for developing
    applications for the networks. Java can handle TCP/IP protocols and hence applications
    developed in Java can access remote objects on Internet like any object on a local
    system.


    +   - Multithreaded: Java supports multithreaded programming which allows us to
    write a program that can perform more than one task simultaneously. User need
    not to wait for program to finish one task, before starting next. For example,
    user can listen to an audio clip while downloading the applet. This feature helps
    to improve the performance of graphical applications.


    +   - High performance: As stated, the Java program is converted to bytecode which
    is then converted to machine code using interpreter. Since bytecode is highly
    optimized, it enables the JVM to execute programs at much faster rate.


    +   - Dynamic: It is dynamic in nature, in that is, Java programs can link to
    new class libraries, objects, methods, etc., at the run-time. Java also provides
    the facility to include the functions of other languages like C and C++. They
    are referred to as native methods. These methods are also linked dynamically at
    run-time.


    # 2.3 JAVA VERSUS C++


    Both C++ and Java are object-oriented languages but they are very different from
    each other. Some of the features of C++ language were deliberately removed and
    some new features were added to make Java more flexible and reliable language.
    Some of the differences between Java and C++ are as follows.


    +   - Java does not support multiple inheritance of classes directly.


    +   - The concept of multithreading is supported by Java.


    +   - The destructor in Java is replaced by finalize.


    +   - The keyword typedef is not supported by Java.'
