  md: '# CHAPTER

    19


    # JAVA SERVLETS


    # CHAPTER OBJECTIVES


    After reading this chapter, you will be able to:


    +   - Understand servlets

    - Explain the servlet life cycle

    - Understand the classes and interface included in Java Servlet API

    - Discuss the steps involved in creating and executing servlets

    - Understand how `javax.servlet.GenericServlet` and `javax.servlet.http.HttpServlet`
    can be used to create the servlets

    - Discuss session tracking

    - Understand JSP (Java Server Pages)


    # 19.1 INTRODUCTION


    Internet and WWW are often used interchangeably but both are different. Internet
    is the global network of computer networks where Web is one of the services provided
    over Internet. That is, Web is an application running over Internet. While creating
    web applications, the browser side, the main goal is to perform most of the processing
    on the browser side, reducing processing load on the server side. Sometimes it
    is not possible to eliminate all processing at the server side. For example, in
    situations like online registration, retrieving data from underlying data, etc.,
    some processing might be required at the server side. One of the server technologies
    used is servlets. Servlets are small programs written in Java, which are loaded
    and executed by web server as applets and loaded and executed by web browser.
    Since, servlets are written in Java, they are platform independent and possess
    all the advantages of Java.


    # 19.2 INTRODUCTION TO SERVLET


    A servlet can be imagined as an application running on the server side. One of
    the other server technologies available are Common Gateway Interface (CGI), server
    side JavaScript and Active Server Pages (ASP). Advantages of servlets over those
    server side technologies are as follows:


    +   - Persistent: Servlets remain in memory until explicitly destroyed. This helps
    in several incoming requests. Servlets establishes connection only once with the
    database and can handle several requests on the same database. This reduces the
    time and resources required to establish connection again and with the same database.
    Whereas, CGI programs are removed from the memory once the request is processed
    and each time a new process is initiated whenever new request arrives.'
