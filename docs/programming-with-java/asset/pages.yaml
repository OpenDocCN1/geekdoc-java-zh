  md: "# 7.8.1 Final Variables\n\nThe value of a variable can be prevented from being\
    \ modified by declaring a variable as final.\n\nThe syntax for declaring a final\
    \ variable:\n```\nfinal data_type variable_name=constant_value;\n```\n\nAn attempt\
    \ to alter the value of a final variable will generate a compile-time error. Note\
    \ that a final variable does not occupy memory for each instance of the class.\
    \ Hence, final variable is a constant.\n\n**Example 7.9** A program to demonstrate\
    \ the use of a final variable\n\n```\nclass Person\n{\n    final int salary=30000;\
    \ // final variable\n}\nclass FinalVariable\n{\n    public static void main(String\
    \ args[]) {\n        Person obj=new Person();\n        obj.salary=3000+2000; //\
    \ error\n    }\n}\n```\n\nIn this example, a compile-time error will be generated\
    \ as the final variable salary cannot be modified.\n\n# 7.8.2 Final Methods\n\n\
    As stated earlier, whenever a method is defined in the subclass with the same\
    \ name and signature as in the superclass, it is by default overridden. However,\
    \ a method can be prevented from being overridden by the subclass by declaring\
    \ the method as final.\n\nThe syntax for declaring a final method:\n```\nfinal\
    \ data_type method_name()\n```\n\n**Example 7.10** A program to demonstrate the\
    \ use of final method\n\n```\nclass Person\n{\n    String name=\"John\";\n   \
    \ int age=25;\n    final void result() // final method\n    {\n        System.out.println(\"\
    The name and the age of the person is: \"+name+\" and \"+age+\");\n    }\n}\n\
    class Employee extends Person\n```"
