  md: "# CHAPTER\n4\nCONTROL STATEMENTS\n\n# CHAPTER OBJECTIVES\n\nAfter reading this\
    \ chapter, you will be able to:\n\n+   - Understand the different types of control\
    \ statements in Java\n- Explain the various types of conditional statements\n\
    - Discuss the different types of iteration statements\n- Understand the different\
    \ types of jump statements\n- Understand the basic concept of labels\n\n# 4.1\
    \ INTRODUCTION\n\nA statement is an instruction given to the computer to perform\
    \ a specific action. In Java, a statement can either be a single statement or\
    \ a compound statement. A single statement specifies a single action and is always\
    \ terminated by a semicolon ';'. A compound statement, also known as a block,\
    \ is a set of statements that are all enclosed within curly braces { }.\n\nBy\
    \ default, the statements are executed in the same order in which they appear\
    \ in the program and each statement is executed only once. However, the serial\
    \ execution of statements makes a program inflexible and unsuitable for most practical\
    \ applications. To make a program more flexible, control statements are used to\
    \ alter the flow of control of the program. In Java, the control statements are\
    \ broadly classified into three categories, namely, conditional statements, iteration\
    \ statements and jump statements. All these control statements are commonly used\
    \ with the logical tests or conditions to alter the flow of control conditionally\
    \ or unconditionally.\n\n# 4.2 SELECTION STATEMENTS\n\nConditional statements,\
    \ also known as selection statements, are used to make decisions based on a given\
    \ condition. If the condition evaluates to true, a set of statements is executed,\
    \ otherwise another set of statements is executed.\n\n# The if Statement\n\nThe\
    \ if statement selects and executes the statement(s) based on a given condition.\n\
    The syntax of the if statement is\n\n```\n //for a single statement\n  if(condition)\n\
    \    statement1;\n    next statement;\n```"
