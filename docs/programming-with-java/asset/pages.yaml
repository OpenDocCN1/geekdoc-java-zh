    +   - Swing, a part of Java Federation Classes (JFC) is the next generation GUI
    toolkit that allows us to develop large scale enterprise applications in Java.
    It is a set of classes which provides many powerful and flexible components for
    creating graphical user interface.

    - Swing components are lightweight as they are written in Java and do not depend
    on native peers (platform specific code resources).

    - Swing supports pluggable look and feel (PLAF). The pluggable look and feel allow
    us to tailor the look and feel of the application and adapt to the standards looks,
    like Windows and Motif. We can even switch to look and feel at runtime.

    - Like AWT GUI, Swing GUI is also based on the concepts of components and containers.
    A container is a type of component that can hold other components. A component
    must always be placed within a container.

    - Swing component is an independent control, such as button, label, text field,
    etc. They need a container to display them.

    - A layered pane is a swing container that allows you to arrange two components
    using the concept of layers.

    - A split pane is lightweight container to two ( ( two) side by side horizontally
    or vertically in a single pane.

    - A tabbed pane is used to create tabs where each tab contains group of related
    components.

    - A layout manager governs the position, shape and size of components in a container.
    The size, shape, and placement of components will be remarkably different from
    one layout manager to another.

    - The flow layout manager is the simplest of all the layout managers. It positions
    the components in the order they are added to the container. It is the default
    layout manager for Applet and Panel.

    - The border layout manager positions the components into five regions—east, west,
    north, south and center. Each region can contain a single component. When a component
    is added'
