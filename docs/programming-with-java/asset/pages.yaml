    # 19.9 INTRODUCTION TO JSP (JAVA SERVER PAGES)


    Java server pages (JSP) technology allows developers to quickly create and maintain
    information-dynamic HTML page on the server side. Like Java, web applications
    created using JSP are also platform independent. With the help of JSP, developers
    can modify the layout of a page without changing the underlying dynamic content.
    A JSP page can be considered as an HTML document containing additional code snippets
    for generating content. For example, it may contain HTML code along with additional
    code snippet retrieves the data from the database using the JDBC object.


    Java server pages are automatically compiled, whenever need arises. They are not
    required to be recompiled explicitly every time changes are made in the web page.
    Thus, JSP is more flexible way of creating dynamic web pages as compared to Java
    servlets. JSP is an extended technology of Java servlets.'
