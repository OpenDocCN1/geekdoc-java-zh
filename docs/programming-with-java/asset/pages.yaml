    # SUMMARY


    +   * A statement is an instruction given to the computer to perform a specific
    action. A statement can either be a single statement or a compound statement.

    * A single statement specifies a single action and is always terminated by a semicolon
    '';''. A compound statement, also known as a block, is set of statements that
    are enclosed within curly braces ''{}''.

    * Control statements are used to alter the flow of control of the program. In
    Java, the control statements are broadly classified into three categories, namely,
    conditional statements, iteration and jump statements.

    * Conditional statements, also known as selection statements, are used to make
    decisions based on a given condition.

    * The conditional operator ''??'' selects one of the two values or expressions
    based on a condition.

    * The switch statement selects a set of statements from the available sets of
    statements.

    * The statements that cause a set of statements to be executed either for a specific
    number of times or until some condition is satisfied are known as iteration statements.

    * The for loop is one of the most widely used loops in Java. The for loop is a
    deterministic loop, the number of times the loop is executed in advance.

    * The while loop is used to perform looping operations when the number of iterations
    is not known in advance. In a while loop, the condition is evaluated at the beginning
    of the loop and if it evaluates to false, the loop is not executed once.

    * The do-while loop is used if the body of the loop is be executed at least once,
    no matter whether the initial state of the condition is true or false.

    * Nested loops are the loops present the body of another loop.

    * Jump statements are used to alter the flow of control unconditionally. That
    is, jump statements transfer the program control unconditionally. The jump statements
    defined in Java are break, continue and return.

    * Labels are used to jump from one block of statement to another.


