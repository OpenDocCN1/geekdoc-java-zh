    # 12.10 THE StringTokenizer CLASS


    The StringTokenizer class, a part of java.util package, defines methods to parse
    an input string. Parsing requires breaking the string into small parts known as
    tokens. The breaking up of the string into tokens is defined by the delimiters.
    Delimiters are the characters that separate tokens within the string. There are
    two types of delimiters: Single-character delimiters and Multi-character delimiters.
    The single-character delimiters comprises of one character such as comma, white
    space, semicolon, colon, etc. For example, the tokens of the string "What is your
    name? will be "What, is "your", "name?" determined by the delimiter "space". On
    the other hand, a multi-character delimiter consists of a sequence of characters
    and each character in the sequence is considered as a delimiter. For example,
    "*:" is a multi-character delimiter which splits the string into tokens based
    on the occurrence of comma, asterisk and underscore.


    The StringTokenizer class defines following types of constructors.


    ```

    StringTokenizer(String string) //first

    StringTokenizer(String string, String delimiters) //second

    StringTokenizer(String string, String delimiters,

    boolean returnDelimiters) //third

    ```


    The first constructor constructs a tokenizer for the string that is to be tokenized
    (parsed) and splits it into tokens based on the default delimiters. The default
    delimiters defined by Java are blank space, newline, carriage return and tab.'
