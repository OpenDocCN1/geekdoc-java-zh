  md: '# Programming with Java


    The Container class is a subclass of Component class. It is used to contain various
    Component objects well as other Container objects within it. The Container class''
    object groups, manages, and positions components and treats them as a unit. Two
    immediate subclasses of Container class are:


    +   - Panel It is used for grouping components. An Applet is a subclass of Panel.

    - Window It is used for creating and handling windows. Two subclasses of Window
    are Dialog and Frame.


    The MenuComponent class is an abstract class. Its immediate subclasses are MenuBar
    and MenuItem which are used to create menu bars and menu items respectively.


    # Layouts


    Different layout classes are used for arranging, positioning, and determining
    the shape and size of the various components held by the container. All these
    classes implement LayoutManager interface of AWT package. Some of the commonly
    used are listed in Table 15.2.


    Table 15.2 Layout Classes

    | Class | Description |

    | --- | --- |

    | BorderLayout | positions the components into five regions: east, west, north,
    south and center |

    | CardLayout | arranges the components as a deck of cards that only one component
    is visible at time |

    | FlowLayout | arranges the components horizontally |

    | GridLayout | arranges the components into grid |


    # Graphics Tools


    The Graphics class encapsulates various methods for drawing various shapes and
    displaying the output on the screen. Image loading and adding is supported by
    Image class. The classes such as Color and Font are used to display graphical
    components. Point, Polygon, Rectangle contain methods to draw points, polygons
    and rectangles respectively.


    # Event Handlers


    The Event class plays a significant role in handling GUI events. The AWTEvent
    encapsulates all AWT events.


    # 15.3 USING AWT CONTROLS


    The components that allow a user to interact with a GUI-based application are
    called controls. The various controls used by AWT are labels, push buttons, checkboxes,
    choice list, scroll bars, text area, text field, menu bar. The controls can be
    added to or removed from a window using the methods defined in the Container class.
    The general form of a method to remove from a control


    +   - Component add (Component obj)


    The general form of a method to remove a control is:


    ```

    void remove (Component obj)

    ```'
