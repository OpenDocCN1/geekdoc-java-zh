    ## EXCEPTION HANDLING


    # CHAPTER OBJECTIVES


    After reading this chapter, you will be able to:


    +   - Define an exception or run-time error in a program

    - Understand how the exception is handled by Java''s default exception handler

    - Name some common exceptions found in Java

