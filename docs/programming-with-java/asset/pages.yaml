  md: '# Programming with Java


    # 16.6 LAYOUT MANAGER


    A layout manager governs the position, shape and size of components in a container.
    The size, shape, and placement of components will be remarkably different from
    one layout manager to another. The layout manager positions the components according
    to dimensions of the applet or application window. If window dimension is changed,
    the size, shape, and placement of the component can be changed automatically by
    the layout manager. Each container has a default layout manager associated with
    it which can be changed by setLayout() method. Different layout managers are defined
    by different layout classes which must implement LayoutManager of AWT package.


    The general form setLayout() in is:


    ```

    void setLayout(Layout lm)

    ```


    where,

    1m is a reference to the desired layout manager


    If setLayout() method is not invoked, then the default layout manager is invoked
    automatically.

    Some of the commonly used manager classes are listed in Table 16.2.


    # Table 16.2 Layout Manager Classes


    | Class | Description |

    | --- | --- |

    | BorderLayout | positions the components into five regions: east, west, north,
    and center. |

    | CardLayout | arranges the components as a deck of cards that only one component
    is visible at a time. |

    | FlowLayout | arranges the components horizontally. |

    | GridLayout | arranges the components into grid. |

    | GridBagLayout | arranges different sized components in a grid and each element
    can span multiple rows or columns. |


    # 16.7 USER INTERFACE COMPONENTS


    In this section, we will present an overview of some of the components of Swing.


    # 16.7.1 Applet


    Applet is a class that represents a subclass of Applet class and must be extended
    by all the applets that use Swing. It provides all the functionalities of the
    AWT applet as well as support for menus and layering of components. Whenever we
    require to add a component to it, the component is added to the content pane.


    The Applet defines the following constructor:


    ```

    Applet()

    ```


    # 16.7.2 JFrame


    Frame is the most common container used to create top-level window having title,
    border and window-management buttons. It can also be used to create secondary
    windows for an application. A frame is an object of JFrame class.'
