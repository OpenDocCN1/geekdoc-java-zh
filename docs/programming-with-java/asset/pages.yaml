    \ and the process is known as recursion or circular definition. When a recursive\
    \ method is called for the first time, a space is set aside in the memory to execute\
    \ this call and the method body is executed. A second call to a method is made;\
    \ again space is set for this, and so on. In other words, spaces for each method\
    \ call are arranged in a stack. Each time a method is called, its memory area\
    \ is placed on the top of the stack and then is removed when the execution of\
    \ the call is completed (as shown in Figure 5.1).\n\n| 1st call | 1st call | 2nd\
    \ call | 3rd call |\n| --- | --- | --- | --- |\n\n![](img/f19fd57d7c8eb6df4d32b7cfe4d13a3a_88_0.png)\n\
    \n(Memory Allocation)"
