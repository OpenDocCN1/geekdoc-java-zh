  md: '# Java Beans 371


    +   - Security: It facilitates you to digitally sign the contents of a JAR file,
    thereby allowing the user to verify the origin and give it additional privileges.

    - Portability: Most of the browsers or web servers support JAR file as the mechanism
    used to handle JAR file as a standard part of the Java platform''s core API.


    # Manifest Files


    If a JAR file contains the Bean classes, a special called manifest file must be
    included in that JAR file. A manifest file that is used to store information about
    the files packaged in a JAR file. When the BeanBox starts, it first loads the
    JAR file and uses the manifest file of JAR file to identify any bean class in
    it. It displays all the beans in the ToolBox window. An example of the content
    of a manifest file is as follows.


    ```

    Name: image0.jpg

    Name: image1.jpg

    Name: image2.jpg

    Name: sound0.wav

    Name: sound1.wav

    Name: ColorBean.class

    Java-Bean: True

    ```


    Here, manifest file lists the files (image, sound and class files) of a JAR file.
    It shows that there are six files; three are .jpg files, two are .wav files and
    one .class file. The entry Java-Bean: True followed by the entry Name: ColorBean.class
    indicates that the ColorBean.class file is a Bean.


    One important point that must be considered while creating a manifest file is
    that the manifest must end with a new line. Otherwise, the last line will not
    be parsed properly.


    If a manifest file is not included in a JAR file, a manifest file named MANIFEST.INF
    is automatically created and stored in the directory named META-INF. The default
    manifest file contains the content as follows:


    ```

    Manifest-Version: 1.0

    Created-By: 1.6.0 (Sun Microsystems Inc.)

    ```


    Here, the entries are in the form of "header: value" pairs. The name of a header
    is separated from its value by a colon. The first line indicates that the default
    manifest is according to the version 1.0 of the manifest specification. The second
    line indicates that it was created using 1.6.0 version of the JDK.


    # The Jar Tool


    The JAR tool provided as part of the Java Development Kit is a command line tool
    for managing JAR files. It is used to create, list and update the contents of
    JAR file. This tool is invoked by using the jar command. In this section, we will
    discuss how this tool is used to perform basic operations with JAR file.'
