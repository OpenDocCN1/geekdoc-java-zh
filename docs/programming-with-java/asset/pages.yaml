  md: "# Programming with Java\n\nobject and no separate memory space was allocated\
    \ for obj2. Any changes made in the object through obj2 will affect the object\
    \ to which obj1 is referring.\n\nNote that obj1 and obj2 are not linked to each\
    \ other. For example, if we make new assignment to obj1, obj1 will simply be detached\
    \ from the original object without the object and obj2 being affected. That is,\
    \ obj2 will still point to the original object.\n\n# 5.6 ARGUMENT PASSING\n\n\
    The(s) that appear in the method call statement are known as actual arguments\
    \ and those which appear in the method definition are known as formal arguments.\
    \ The number of actual arguments, their order and type in the method call must\
    \ match that of the formal arguments. There are two ways by which an argument\
    \ can be passed to the method—call-by-value and call-by-reference.\n\n# 5.6.1\
    \ Call-by-Value\n\nIn call-by-value method, the values of the actual arguments\
    \ are copied into the formal arguments. In putting simple words, the method creates\
    \ a copy of argument values and then with these copied values. As a result any\
    \ changes to copied values in the method do not affect the values of the actual\
    \ arguments in the calling method. In Java, when arguments of primitive type are\
    \ passed to a method, they are passed by value.\n\n> Example 5.5 A program to\
    \ demonstrate the call-by-value mechanism FirstCall\n\n```\n{\n  void vol(int\
    \ i, int j, int k)\n  {\n    i+=5;\n    j+=5;\n    k+=5;\n  }\n}\nclass CallByValue\n\
    {\n  public static void main(String args[])\n  {\n    FirstCall fc =new FirstCall();\n\
    \    int l=10;\n    int w=20;\n    int h=15;\n    System.out.println(\"Length,\
    \ Width, Height before\\ncall is :\" +l+\" \"+w+\" \"+h);\\n    fc.vol(l, w, h);\
    \ //passing values as arguments\n    System.out.println(\"Length, Breadth, Height\
    \ after\\ncall is :\" +l+\" \"+w+\" \"+h);\\n  }\n}\n```"
