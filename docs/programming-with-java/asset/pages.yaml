    # 20.3 URLs (UNIFORM RESOURCE LOCATORS)


    Each web page has a unique address called URL (Uniform Resource Locator) that
    identifies its location on the Internet. The URL consists of four parts: protocol,
    name of the web server, the directory on that server and the file within that
    directory.


    The syntax of a URL is:


    ```

    protocol://domain name: port number/<directory path>/object name=#spot

    ```


    Example:


    ```

    http://www.yahoo.com/education/FIIT/home.htm#top

    ```


    The various parts of a URL are described in Table 20.1.


    Table 20.1 Parts of a URL


    | Part | Example | Description |

    | --- | --- | --- |

    | Protocol | http:// | represents the name of the protocol like ftp, http, etc.
    |

    | Domain Name | www.yahoo.com | represents the name of the web server where the
    desired page or other resource resides |

    | Directory Path | /education/FIIT | represents the location of the web page in
    the web server''s file system |

    | Object Name | /home.htm | specifies the file for the desired web page or the
    name of the other that is required |

    | #Spot | #top | specifies the particular location of the text or the graphic
    on the web page |'
