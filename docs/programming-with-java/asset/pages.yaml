  md: '# SUMMARY


    +   - The key objective of object-oriented programming is to represent the various
    real-world objects as program elements.

    - A class is a user-defined data type that can be used to create instances of
    its type called objects.

    - Methods are added to the class to access the instance variables of a class and
    manipulate them.

    - Objects are variables of class type inside which they are created.

    - The instance variables and methods added in the program cannot be accessed directly
    outside the class using their names. . operator is used.

    - The argument(s) that appear in the method call are known as actual arguments
    and those in which the method are defined as formal arguments.

    - There are two ways by which an argument can be passed to the method—call-by-value
    and call-by-reference.

    - In call-by-value method, values of the actual arguments are copied into the
    formal arguments.

    - In call-by-reference method, argument''s reference is passed as parameter method.

    - The static members of a class are defined without reference to a specific object.
    the static members are associated with the class as a whole, rather than with
    individual objects.

    - Method overloading allows multiple methods to have same name with different
    parameters and different definitions.

    - A constructor is a special method used to initialize objects at the time of
    their creation.

    - A parameterized constructor is a constructor that accepts one or more parameters
    at the time of creation of objects and initializes the instance variables of the
    objects with these parameters.

    - Like normal methods, constructors can also be overloaded. That is, we can define
    multiple constructors which differ in number/or types of parameter.

    - Objects can be passed as parameter to methods.

    - A method can not return the built-in data types but also the class types that
    the users create.

    - this keyword is used to refer to the current object (the object on which the
    method was invoked).

    - Java provides us mechanism known as garbage collection, which handles the deallocation
    of the memory automatically.

    - All the operations that are to be performed just before the object is destroyed
    are placed inside the finalize() method.


