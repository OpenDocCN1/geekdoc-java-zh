    # 18.5 JAR FILES


    Before proceeding to further discussion on Beans, one should know about the JAR
    file. It is because the Beans are always packaged in JAR files. The JAR (Java
    Archive) file is a single compressed archive file that packages multiple files
    into it. Generally, the JAR file contains the class files and the resources (image
    and sound) associated with the applet and multimedia applications. There are various
    archive formats that supports JAR format have been replacing the others. It has
    been preferred because of the following benefits, it:


    +   - Decreased download time: A complex Java application may consist of a large
    number of class files, each stored in separate class file. If this application
    is packaged in a JAR file, it can be downloaded in a single transaction without
    opening a new connection for each file.


    +   - Compression: It enables to compress the files, thereby not only reduces
    the storage space by downloading time also.'
