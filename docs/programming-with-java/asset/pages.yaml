  md: '# PREFACE


    Software development technology has been changing quite rapidly. The programming
    languages, paradigms and practices that were applied yesterday are out of date
    today. To keep pace with the emerging trends, Java language has been introduced.
    The main motivation behind the development of Java was the need for a platform-independent
    language that could be used to create software that could be embedded in various
    consumer electronic devices. C and C++ cannot be used with such devices because
    they are designed to be compiled for a specific target. Within a few years, Java
    grew from a concept into one of the world''s dominant computer languages. Moreover,
    within a few span of years, Java has gone through two major revisions. The first
    one was Java 1.1 and the second major revision was Java 2.


    The book in your hands, Programming with Java, provides all the necessary knowledge
    required to develop simple as well as network-aware Java programs. The book moves
    from simple material covering the basics of programming and object-oriented software
    to relatively advanced material. The text has been carefully organized to make
    it particularly easy for the students to grasp the concepts of Java.


    # Key Features


    +   - Simple and easy-to-follow text

    - Complete coverage of the subject as per the syllabi of most universities

    - Lucid, well-explained concepts with clear examples

    - Relevant illustrations for better understanding and retention

    - Numerous programming examples for better clarity of concept

    - Chapter objectives at the beginning of the chapter for an overview of the chapter

    - Chapter-end summary and exercises for quick review and to test your knowledge

    - A comprehensive index at the end of the book for quick access to the topics


    # Chapter Organization


    The book is organized into 20 chapters.

    Chapter 1 provides an overview of various programming paradigms, introduces the
    object-oriented (OO) methodology and its fundamental concepts, benefits and applications
    of OO approach.

    Chapter 2 explains how Java is important to the Internet and a simple program
    to demonstrate how Java compiler works.

    Chapter 3 introduces various data types, variables, constants that constitute
    the basic elements of a language.

    Chapter 4 covers the different types of control statements in Java.

    Chapter 5 presents the basic concepts of object-oriented programming, including
    classes and objects.'
