    # 7.4 VISIBILITY CONTROLS (ACCESS CONTROLS)


    In the programs discussed so far, the class members are accessible everywhere
    in the program

    and the subclass can inherit all the variables and methods of a superclass by
    using the keyword

    extends. However, there may be certain situations when we want to restrict the
    accessibility

    of members of a class for various reasons, security being one of the main reasons.
    This Java

    provides three types of visibility controls, public, private and protected. They
    are

    al known as access modifier.


    +   **Public**: When a member of a class is declared as public, it can be accessed
    everywhere innthe program.


    +   **Private**: A member declared as private is accessed only within a class.


    +   **Protected**: A member declared as protected is accessible not only to all
    the classes and

    subclasses in the same package but to subclasses in other packages.


    Note that no visibility control is specified, by default the data member of a
    class is visible

    only within the same package. We may use the friendly in connection with the default
    access,

    however is not a Java keyword.


    Apart from the visibility controls discussed, there is another visibility control,
    namely,

    private protected which was used with the release of Java 1.0. However, it has
    been dropped'
