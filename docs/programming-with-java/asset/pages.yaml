  md: '# 292 Programming with Java


    # 16.7.9RadioButton


    Radio buttons are a group of buttons, in which, only one radio button can be selected
    at one time. That is, when you select one radio button, then the other selected
    radio button will get deselected automatically. A radio button is an object of
    JRadioButton class.


    Some of the constructors defined by JRadioButton class are as follows:


    ```

    JRadioButton()

    RadioButton(String string)

    RadioButton(String string, boolean string)

    ```


    where,


    string the text

    state can be one of the two values: true, if the button is initially selected,
    otherwise false (default value)


    > **Note:** Button groups (javax.swing.ButtonGroup) are used in combination with
    radio buttons to ensure that only one radio button is selected at a time.


    # 16.7.10 Panel


    Panel is a container to hold different Swing components. One can add any number
    of components to a panel and there be multiple panels in the same frame. It also
    supports double buffering which is used in animation to avoid flickering. In double
    buffering, it is first written to an off-screen memory before display and then
    switched over the panel. Flow layout is the default layout for the panel. A panel
    is an object of class JPanel which is present in package javax.swing.


    Some of the constructors defined by JPanel class are as follows:


    ```

    JPanel()

    JPanel(boolean isDoubleBuffered)

    JPanel(LayoutManager layout)

    JPanel(LayoutManager layout, boolean isDoubleBuffered)

    ```


    where,

    isDoubleBuffered defines whether the panel is double buffered or not. It can have
    one of the values: true (double buffered) or false (not double buffered)

    layout defines the layout of the panel


    # 16.7.11 ScrollPane


    A scroll pane is a container that represents a small area to view other component.
    If the component is larger than the visible area, scroll pane provides horizontal
    and/ vertical scroll bars for scrolling the components through the panel. A scroll
    pane is an object of the JScrollPane class which extends JComponent.


    Some of the constructors defined by JScrollPane class are as follows.


    ```

    JScrollPane()

    ScrollPane(Component component)

    ```'
