  md: '# 10.4 TYPES OF EXCEPTIONS


    Java provides several built-in classes which define all types of exceptions. These
    exception classes are arranged in a hierarchy having Throwable class on the top
    (see Figure 10.1). That is, the Throwable class is the superclass and all the
    exception classes inherit methods defined by it. Two immediateAccess subclasses
    of the Throwable class are Exception class and Error class.


    +   - **Exception class:** It defines those exceptions that are thrown by methods
    of standard Java library or methods defined in the user''s program and can be
    trapped within the program. That is, the program can reasonably recover from these
    types of exceptions. This class is also used (inherited) when the users want to
    create their own exceptions in the application.

    - **Error class:** It defines those exceptions that do not occur frequently and
    are difficult to be recovered from. For example, a class file is missing or system
    runs out of memory.


    ![](img/f19fd57d7c8eb6df4d32b7cfe4d13a3a_166_0.png)


    Figure 10.1 Java Exception Hierarchy


    Some of the most commonly used exceptions that will be encountered are listed
    in Table 10.1.


    **Table 10.1** Some Exceptions in Java


    | Exception | Description |

    |---|---|

    | ArithmeticException | thrown when arithmetic error occurs in the program such
    as divide-by-zero |

    | NullPointerException | thrown when the user tries to use an object without initializing
    the object or in other words when an object that has not allocated memory is used
    |

    | IOException | thrown when error occurs during input/output of data |

    | ArrayIndexOutOfBoundsException | thrown when an attempt is made to access an
    array element with invalid index value |

    | ArrayStoreException | thrown when an attempt is made to store the incompatible
    type of data in array |

    | IllegalAccessException | thrown when an illegal attempt is made to access a
    class |

    | NumberFormatException | thrown when an invalid conversion of a string to a numeric
    format takes place |

    | StringIndexOutOfBoundsException | thrown when an attempt is made to access a
    string element that is beyond the index of the string |

    | IllegalArgumentException | thrown when an illegal argument is used to invoke
    a method |

    | NegativeArraySizeException | thrown when an array of negative size is created
    |'
