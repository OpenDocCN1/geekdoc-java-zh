  md: '# Java Servlets 397


    # 19.7 HANDLING HTTP REQUEST AND RESPONSE


    The HttpServlet is the commonly used class for developing servlets which can handle
    HTTP requests. It is the subclass of GenericServlet class. Some of the methods
    defined in this class are listed in Table 19.5.


    Some of the Method of the HttpServlet Class


    | Method | Description |

    | --- | --- |

    | doDelete() | It allows servlet to handle DELETE request. |

    | doGet() | It allows servlet to handle HTTP GET request. |

    | doPost() | It allows servlet to handle HTTP POST request. |

    | doHead() | It allows servlet to handle HTTP HEAD request. |

    | doOptions() | It allows servlet to handle HTTP OPTIONS request. |

    | doPut() | It allows servlet to handle HTTP PUT request. |

    | doTrace() | It allows the servlet to handle TRACE request. |

    | getLastModified() | It returns the time when the HttpServletRequest object was
    last modified. |

    | service() | It receives the HTTP request and sends it to corresponding method
    defined in this class. |


    The servlet created by this class overrides one of these methods. When servlet
    is invoked, the information is passed to the service() method, which in turn determines
    the type of request and sends to the appropriate method. For example, if request
    is of GET type, the doGet() method is invoked by the service() method. Similarly,
    if request is of POST type, doPost() method is invoked by the service() method
    and so on. The doGet() and doPost() methods are the commonly used methods. In
    this section, we discuss the usage of these two methods.


    # 19.7.1 The doGet() Method


    The doGet() method is invoked by server through service() method to handle a HTTP
    GET request. This method also handles HTTP HEAD request automatically as HEAD
    is nothing but a GET request having no body in the code for request and only includes
    request header fields. To understand the working of doGet() method, let us consider
    a sample program to define a servlet for handling the HTTP GET request.


    Example 19.2 A program to define a servlet for handling HTTP GET request


    ```

    import java.io.*;

    import javax.servlet.*;

    import javax.servlet.http.*;

    ```


    ```

    public class HttpServletExample extends HttpServlet {


    ```'
