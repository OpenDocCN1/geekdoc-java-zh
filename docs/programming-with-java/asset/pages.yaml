  md: "# INNER CLASSES\n\nThe classes defined in Java 1.0 version have all been top\
    \ level classes. The top level classes are the classes which are direct members\
    \ of packages and are not nested within any other classes. However, with the start\
    \ of Java 1.1 version, there are four other types of classes, broadly known as\
    \ inner classes that can be defined in Java program. Inner class is the biggest\
    \ enhancement to the Java language. Classes can be defined as members of other\
    \ classes and they can also be defined within a block of code. These four types\
    \ of classes are explained below.\n\n+   * **Static member**: A class which defined\
    \ as a static member of another class is called **static member class**. It is\
    \ just like a top level class with a difference that it can access the static\
    \ members of the class of which it is a static member class.\n* **Member classes**:\
    \ It is also a class which is defined as a member of another class, but it is\
    \ not declared static. The code of a member class can access all the static and\
    \ non-static fields and methods of its enclosing class. Also, an instance of a\
    \ member class is always linked with an instance of the enclosing class.\n* **Local\
    \ classes**: A class which defined within a block of code is called **local class**.\
    \ A local class is visible only within that block. It is analogous to a local\
    \ variable in some ways. Though local classes are not member classes, they are\
    \ still defined within an enclosing class and they can use its fields and methods.\n\
    * **Anonymous classes**: A kind of class which does not have any name is called\
    \ anonymous class. Anonymous class combines the steps of class definition and\
    \ object instantiation in a single Java expression. As the class is instantiated\
    \ in the expression that defines it, it can be instantiated only once. Otherwise\
    \ anonymous classes are quite similar to local classes in terms of behavior and\
    \ use.\n\n# this KEYWORD\n\nAs we know, methods are invoked by the objects of\
    \ the class. There may be a situation when a method needs the reference of the\
    \ object that has invoked. In Java, it is accomplished by using **this keyword**.\
    \ By using **this** keyword in any method, we can refer to the *current* object\
    \ that is the object on which the method was invoked. For example, consider the\
    \ following two code segments.\n\n```\nFirstConstructor(int i, int j) //first\
    \ definition of Constructor\n{\n    this.a=i;\n    this.b=j;\n}\nFirstConstructor(int\
    \ i, int j) //second definition of Constructor\n{\n    a=i;\n    b=j;\n}\n```\n\
    \nThese two constructors will operate in exactly the same way. Here, the use of\
    \ **this** in first code segment is correct but not required. However, it has\
    \ other uses like preventing name collision between the instance variables of\
    \ a class and variables declared inside a method."
