  md: '# 13.2.1 Life Cycle of an Applet


    A Java applet enters into various states during its entire life cycle which include
    born state, running idle and dead state. These states occur when different methods
    of the Applet class are invoked by the Java runtime system. The invocation of
    these methods makes an applet undergo a series of state change right from the
    time it is loaded till it is destroyed and frees all the resources held by it.
    The life cycle of an applet can be depicted as shown in Figure 13.1.


    ![](img/f19fd57d7c8eb6df4d32b7cfe4d13a3a_245_0.png)


    Figure 13.1 Applet Life Cycle


    The order of method invocation when an applet is loaded:


    +   **init():** The life cycle of an applet begins when it is first loaded and
    the init () method is invoked. This method is invoked only once during the entire
    lifetime of an applet. The body of the method includes states related to variable
    initialization, object creation, addition components like buttons, textboxes,
    etc., setting colors of the applet, loading of images or fonts. After the invocation
    of the init () method, the applet enters the born state.


    +   **start():** This method is automatically invoked after the init () method
    Unlike init () method, start () method may be invoked more than once. This method
    is called every time the web page containing the applet is executed and displayed
    on the screen. With the invocation of this method, the applet enters the running
    state.


    +   **paint():** This method is invoked to display the output on the screen in
    the form of text, graphics, etc. Sometimes it may happen that the window in which
    applet is gets covered by another window, or gets minimized or resized. In all
    these cases, paint () is re-invoked for the output to be redrawn on the screen.
    As depicted in the Figure 13.1 the applet remains in the running state while paint
    () method is invoked.


    The order of method invocation at the time of termination of an applet:


    +   **stop():** This method is invoked automatically when the web page containing
    the running applet is closed or left temporarily and applet enters the idle state.
    The user can also stop the running applet by invoking the stop () method explicitly.'
