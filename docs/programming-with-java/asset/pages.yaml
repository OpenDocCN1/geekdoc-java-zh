  md: '# 1.5.8 Message Passing


    Message passing is a process of interacting between different objects in a program.
    As discussed earlier, a program following the object-oriented paradigm comprises
    a set of objects each with a set of data and functions. When the program is executed,
    these objects interact or communicate with each other by sending and receiving
    messages. The messages are exchanged by calling the member functions of the classes.


    Any object of a class that needs to communicate with an object of another class
    requests the object to invoke the required member function of its class. This
    function call is different from the normal function call as in this case the sending
    object is a request for the execution of the function. However, the receiving
    object may or not accept the request depending on whether the function forms the
    public interface or it is hidden from the outside world. Thus, this of communication
    is called message passing and not an ordinary function call.


    For example, consider two classes Product and Order. The object of the Product
    class can communicate with the object of the Order class by sending a request
    for placing order (see Figure 1.7).


    ![](img/f19fd57d7c8eb6df4d32b7cfe4d13a3a_24_0.png)


    Figure 1.7 Message Passing


    # 1.6 BENEFITS OF OOP


    The object-oriented programming paradigm has come in as it overcomes certain limitations
    of structured and unstructured programming paradigms. The new and advanced features
    of OOP such as encapsulation, abstraction, inheritance, and polymorphism help
    in developing high-quality software. The high-quality software can be developed
    due to its certain advantages. Some of the advantages of OOP are listed here.


    +   - In OOP, writing with the help of objects is much similar to working with
    real-world objects. That is, the real-world objects can be conveniently represented
    in a program which reduces the complexity of the program and also makes the program
    structure clear.


    +   - In object-oriented programs, each object is an independent and separate
    entity which makes modifications, locating and fixing problems in a program an
    easy task. In addition, any changes made inside the class do not affect the other
    parts of a program. Thus, object-oriented programs are easy-to-write and easy-to-maintain.'
