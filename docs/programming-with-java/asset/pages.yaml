  md: '# CHAPTER 7

    INHERITANCE AND POLYMORPHISM


    # CHAPTER OBJECTIVES


    After reading this chapter, you will be able to:


    +   - Understand what is inheritance

    - Explain the benefits of inheritance such as code reuse

    - Understand the concept of superclass and subclass

    - Discuss various types of inheritance

    - Explain visibility controls supported by Java

    - Understand what is method overriding and polymorphism

    - Describe how final keyword can be applied to variables, methods and classes

    - Explain abstract methods and abstract classes


    # 7.1 INTRODUCTION


    Inheritance is one of the strengths of object-oriented programming. It is the
    process of deriving a new class from the existing one in such a way that the new
    class inherits all the members (data members and methods) of the existing class.
    In other words, inheritance facilitates a class to acquire the properties and
    functionality of another class. The new class depicts the acquired properties
    and behaviour of the existing class as well as its own unique properties and behaviour.


    Inheritance allows code reuse, that is, it facilitates classes to reuse the existing
    code. The new class acquires members of the old class that are already tested
    and debugged, inheritance saves time as well as increases the reliability. Using
    inheritance, we can create a general class that defines common properties for
    a set of related classes.


    # 7.2 INHERITANCE BASICS


    The class that is inherited by other classes is called a base class or superclass
    or parent class. The class that inherits the properties of the superclass is called
    a subclass or derived class or child class. The subclass inherits all of the instance
    variables and methods defined by the superclass, at the same time it also contains
    its own members. For example, in Figure 7.1, Animal is the superclass which is
    inherited by three subclasses Carnivore, Herbivore and Omnivore. Hence, Carnivore,
    Herbivore and Omnivore inherit all the members of the superclass Animal.'
