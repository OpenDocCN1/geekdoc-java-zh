    # 16.12 USING DIALOGS


    A dialog box is one of the most important GUI components which is commonly used
    by almost all GUI applications. Dialog box is an independent pop-up window that
    displayed over its parent window. It is generally used to display an error message,
    feedback message, confirmation message or a warning message to the user. It is
    always displayed in a top-level window and works like a frame window.


    The default layout for a dialog box is border layout. A dialog box is an object
    of the JDialog class which extends the AWT dialog java.awt.Dialog. JDialog uses
    a JRootPane as its container.


    Some of the constructors defined by JDialog class are as follows:


    ```

    JDialog()

    JDialog(Frame owner, boolean mode)

    JDialog(Frame owner, String title)

    JDialog(Frame owner, String title, boolean mode)

    ```


    owner is the parent frame of the dialog box created

    mode specifies the mode of the dialog box as modal or non-modal

    title is the title of the dialog box


    A dialog box uses a content pane as container to add all the components. The general
    form of adding a component to the content pane is:

    dialogBox.getContentPane().add(component);'
