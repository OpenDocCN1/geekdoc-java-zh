    basic programming elements of Java.


    # 3.2 CHARACTER SET


    A character set is defined as a set of characters that either individually or
    in combination,

    represents information. Unlike other programming languages like C and C++, Java
    uses a standard

    known as unicode to define characters. Unicode is a 16-bit character set which
    defines all

    of the characters available in all human languages like English, Hindi, German,
    French, Chinese,

    Japanese, etc. This makes Java a worldwide programming language. However, the
    characters of

    many languages can be represented using the standard 8-bit character set (ASCII
    characters) which

    include letters, digits and punctuation marks.


    # 3.3 TOKENS


    A token is defined as the smallest unit of a program. When a program is compiled,
    the compiler

    scans the source code and parses it into tokens to find the syntax errors. Java
    tokens are broadly

    classified into keywords, identifiers, constants, operators and punctuators.'
