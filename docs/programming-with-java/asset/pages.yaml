  md: '# CHAPTER

    14


    # # EVENT HANDLING


    # ## CHAPTER OBJECTIVES


    After reading this chapter, you will be able to:


    +   - Understand what is an event

    - Learn about the model on which Java event handling mechanism is based

    - Understand the various types of events supported by Java

    - Learn how to handle various events such as key press on the keyboard, button
    clicks, mouse events, etc.


    # ### 14.1 INTRODUCTION


    Javalets are used to create graphical and user-interactive applications. The applets
    designed are far greater in nature but very little when it comes to demonstrating
    their user-interactive capability. User interaction means a specific action is
    generated and an appropriate result is displayed to the user when he interacts
    with an application by clicking mouse or entering a character using the keyboard.
    In Java, all the activities that occur between the user and the application are
    termed as events. Events play a significant role in applet programming as they
    facilitate include user-interactivity in applets.


    # ### 14.2 EVENTS


    In Java, an event is an object that specifies the change of state in the source.
    It is generated whenever an action takes place like a mouse is clicked or text
    is modified. Java’s AWT (Abstract Window Toolkit) is responsible for communicating
    these actions between the program and the user. Java packages such as `java.util`,
    `java.awt`, `java.awt.event` and `javax.swing` support event handling mechanism.


    When an action takes place, an event is generated. The generated event and all
    the information about it since its occurrence, type of event, etc., are sent to
    the appropriate event handling code provided within the program. This code determines
    how the allocated event will be handled so that an appropriate response can be
    sent to the user.


    # ### 14.3 EVENT HANDLING MODEL


    The working of an event-driven program is governed by its underlying event-handling
    model. Till now two models have been introduced in Java for receiving and processing
    events. The event handling mechanisms of these models differ a lot from each other.
    In the following section, the comparison between the two event models is discussed.'
  merge: -1
  pgno: 268
- img_proc: true
  md: '# 254 Programming with Java


    # 14.3.1 Java 1.0 Event Model


    The Java 1.0 Event Model for event processing was based on the concept of containment.
    In this approach, when a user-initiated event is generated it is first sent to
    the component in which the event has occurred. But in case the event is not handled
    by this component, it is automatically propagated to the container of that component.
    This process is continued until the event is processed or reaches the root of
    that containment hierarchy.


    For example, as shown in the Figure 14.1, Button is contained in the Panel which
    itself is contained within the Frame. When the mouse is clicked on Button, an
    event is generated which is first sent to the Button. If it is not handled by
    it then event is forwarded to the Panel and if it cannot handle the event, it
    is further sent to the Frame. Being the root of the given hierarchy processes
    this event. The event is forwarded up the containment hierarchy until it is handled
    by a component.


    ![](img/f19fd57d7c8eb6df4d32b7cfe4d13a3a_269_0.png)


    Figure 14.1 Java 1.0 Event Handling Mechanism


    The major drawback in this approach is that events could be handled by the component
    that generated it or by the container of that component. Another problem is that
    events are frequently sent to components that cannot process them, wasting a lot
    of CPU cycles.


    # 14.3.2 Delegation Event Model


    The advanced variations of Java ruled out the limitations of Java 1.0 event model.
    This model is referred to as the Delegation Event Model which defines a logical
    approach to handle events. It is based on the concept of source and listener.
    A source generates an event and sends it to one or more listeners. On receiving
    the event, listener processes the event and returns it. The notable feature of
    this model is that the source has a registered list of listeners which will receive
    the events as they occur. Only the listeners that have been registered actually
    receive the notification when a specific event is generated.


    For example, as shown in Figure 14.2, when the mouse is clicked on Button, an
    event is generated. If the Button has a registered listener to handle the event,
    it is sent to Button, processed and the output is returned to the user. However,
    if it has no registered listener the event will not be propagated upwards to Panel
    or Frame.'
