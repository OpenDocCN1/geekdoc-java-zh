  md: '# CHAPTER 15


    # ABSTRACT WINDOW TOOLKIT


    # CHAPTER OBJECTIVES


    After reading this chapter, you will be able to:


    +   - Explain Abstract Window Toolkit

    - Describe various AWT controls and their functions

    - Describe various layout managers and how they organize components within a container


    # 15.1 INTRODUCTION


    Abstract Window Toolkit (AWT) provides several graphics, windowing and user interface
    tools which are used to develop GUI of applets as well as stand-alone applications
    running in GUI environment Abstract Window Toolkit (AWT) provides several graphics,
    windowing and user interface tools which are used to develop GUI of applets as
    well as stand-alone applications running in GUI environment. In order to use the
    classes and interfaces defined in AWT, java.awt.* package needs to be imported.


    # 15.2 AWT: WORKING WITH WINDOWS GRAPHICS AND TEXT


    The AWT classes can be roughly categorized into the following groups.


    # GUI Components


    GUI components include visual elements that facilitate the user''s interaction.
    The Component class and MenuComponent class are the superclasses which represent
    GUI components. The Component class is an abstract class therefore its subclasses
    are used to create components. In AWT terminology, the user interface elements
    such as button, text field, checkbox, etc., are termed as components.


    Table 15.1 Subclasses of Component Class


    | Class | Description |

    |---|---|

    | Button | creates a push button control |

    | Checkbox | creates a checkbox control |

    | Choice | creates a dropdown list of textual entries |

    | Label | creates a label control to display a string |

    | List | creates a scrollable list of textual entries |

    | ScrollBar | creates a scroll bar for items |

    | TComponent | a superclass of TextField and TextArea classes used to create single-line
    or multi-line textfields respectively |'
