  md: '# CHAPTER

    1

    OBJECTED-ORIENTED

    METHODOLOGY


    # CHAPTER OBJECTIVES


    After reading this chapter, you will be able to:


    +   - Understand the evolution of various programming methodologies

    - Differentiate between OOP and structured programming

    - Understand the key concepts of OOP, including objects, classes, encapsulation,
    abstraction, inheritance, method overriding and polymorphism, and message passing

    - Describe the applications of OOP in different areas

    - Get familiar with object-oriented languages that purely or partially follow
    the object-oriented concepts


    # 1.1 INTRODUCTION


    The goal of programmers is to develop software that are correct, reliable and
    maintainable, satisfy all the user requirements. Software needs to be modified
    or redesigned according to the change in user requirements, business rules and
    strategies. In addition, the complexity of the software also increases. To cope
    with the dynamic nature and complexity of the software, different approaches of
    programming were developed since the invention of the computer. These approaches
    are known as programming paradigms.


    This chapter provides an overview of various programming paradigms, introduces
    the object-oriented methodology and its fundamental concepts, benefits and applications
    of OOP approach, etc.


    # 1.2 PARADIGMS OF PROGRAMMING LANGUAGES


    A programming paradigm (also known as programming methodology) describes the structure
    of a program. In other words, it determines how the instructions are placed in
    a program. Each programming language follows one or the other programming paradigm.
    There is no specific rule to decide which programming paradigm is to be followed
    as different paradigms can develop different software. However, whatever paradigm
    is followed, some of the quality issues of software must be kept in mind. This
    includes correctness, usefulness, robustness, maintainability, reusability, reliability
    and interoperability of the software.


    Some of the paradigms are: unstructured programming paradigm, procedural paradigm
    and object-oriented paradigm.'
  merge: -1
  pgno: 16
- img_proc: true
  md: '# 2 Programming with Java


    # 1.3 EVOLUTION OF OBJECTED-ORIENTED METHODOLOGY


    Initially, when computers were invented, binary language was used to write the
    programs. However, as programs grew in size, it became difficult to write programs
    using binary language. Then assembly language was invented to write large programs,
    which were also not user-friendly. With the change in user requirements, the size
    and the complexity of the programs continued to grow, which led to the development
    of high-level languages such as BASIC and FORTRAN.


    However, these languages provided an unstructured way of writing programs. In
    unstructured programming paradigm, all the instructions of a program were written
    one after the other in a single function and, suitable for writing only small
    and simple programs. For large and complex programs, it became difficult to trace
    and debug errors.


    To overcome the limitations of unstructured programming paradigm, other programming
    paradigms, namely, procedural and object-oriented programming paradigms, were
    developed, which helped the programmers to develop the programs in a structured
    way. Of these two, the object-oriented paradigm is the most commonly used approach
    these days.


    # 1.4 COMPARISON OF OBJECT-ORIENTED AND PROCEDURAL-ORIENTED APPROACH


    In the late 1960s, the high-level languages such as C and Pascal were developed,
    which provided a structured way of writing programs. Structured programming (also
    known as procedural programming) was a powerful and easy approach to writing complex
    programs. In procedural programming, programs are divided into different procedures
    (also known as functions, or subroutines) and each procedure contains a set of
    instructions that performs a specific task. This approach follows the top-down
    approach for designing the program. That is, first the entire program is divided
    into a number of subroutines and these subroutines are again divided into small
    subroutines and so on until each subroutine becomes an indivisible unit (see Figure
    1.1).


    ![](img/f19fd57d7c8eb6df4d32b7cfe4d13a3a_17_0.png)


    Figure 1.1 Top-down Approach'
  merge: -1
  pgno: 17
- img_proc: true
  md: "Programs in procedural programming consist of a controlling procedure known\
    \ as the main, which controls the execution of other procedures. When a call to\
    \ a procedure is made, the program control is passed to that procedure and all\
    \ the instructions in that procedure are executed one after another. After executing\
    \ all the instructions, the program control returns to the procedure where the\
    \ call is made.\n\nFor example, to write a program that can add, modify, and delete\
    \ records from a database using structured programming, the entire program can\
    \ be divided into four different procedures, namely add, find, delete and modify\
    \ (see Figure 1.2). In addition to these procedures, the program consists of a\
