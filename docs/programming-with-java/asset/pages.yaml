  md: '# Java and the Internet


    +   - Java does not support pointers, instead it uses implicit object references.

    - The virtual keyword is not supported in Java.

    - Java does not support the concept of global variables.

    - Java supports exception handling in different from C++. It provides finally
    clause for cleanup.

    - The non-primitive data types are allocated memory by using the new operator.

    - Java adds many features that are necessary for object-oriented programming.


    # 2.4 JAVA’S IMPORTANCE TO THE INTERNET


    In recent years, Java has become popular language for the programs that are required
    to run on different systems. Java’s new innovation named “applet” has completely
    changed Internet programming. Applets are tiny programs that are designed in such
    a way that they can be transmitted over the Internet. They can be downloaded on
    demand and executed automatically by Java-compatible web browser. They are used
    to handle user input, data supplied by the server and simple functions that execute
    locally on the client machine.


    Applet is dynamic, self-executing program is intelligent enough to change with
    the user inputs. Dynamic programs when downloaded and executed can cause serious
    harm to the computer as they may contain viruses like Trojan horse and malicious
    programs. These harmful programs may search the contents on local file system
    of the computer and may give private information like credit card numbers, passwords,
    etc. Earlier viruses were scanned before the downloaded program, but Java has
    resolved the issue by confining the programs to Java execute environment only.


    # 2.5 JAVA COMPILER


    In most programming languages, the program is converted to machine code either
    by using compiler or interpreter. The machine code so generated is machine dependent,
    that it may not run on the machine other than the one which it is generated. Unlike
    in case of other programming languages, the Java compiler does not convert source
    code to machine code, it converts source code to a special intermediate code known
    as bytecode. The bytecode is generated in the form of class files that can be
    interpreted. The command used for compilation in Java is javac which converts
    the corresponding Java file into class file. The bytecode is machine dependent,
    that it, can be run on any machine with the help of Java virtual machine (JVM)
    which is discussed in the next section.


    | Source code | Compiler | Bytecode |

    |---|---|---|

    | .java file | | .class file |


    Figure 2.1 Compilation of a Java Program


    # 2.6 JAVA VIRTUAL MACHINE CONCEPTS


    As discussed earlier, Java uses both compiler and interpreter. Source code in
    Java is compiled to generate bytecode and then this bytecode is interpreted to
    make instructions for specific machine. The bytecode generated by the compiler
    is not machine specific. It is generated for the virtual machine that exists only
    inside the computer memory known as Java Virtual Machine'
