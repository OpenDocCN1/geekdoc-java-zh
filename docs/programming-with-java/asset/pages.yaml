  md: '# Programming with Java


    # SUMMARY


    +   - A programming paradigm describes the structure of a program. In other words,
    it determines how the instructions are placed in a program. Each programming language
    follows one or the other programming paradigm.


    +   - In unstructured programming paradigm, all the instructions of a program
    were written one after the other in a single function and hence, suitable for
    writing only simple and complex programs.


    +   - In procedural programming, programs are divided into different procedures
    (also known as functions, routines or subroutines) and each procedure contains
    a set of instructions that performs a specific task.


    +   - Programs in procedural programming consist of a controlling procedure known
    as the main, which controls the execution of other procedures.


    +   - The procedural paradigm has certain limitations, which led to the development
    of object-oriented paradigm.


    +   - Object-oriented programming (OOP) paradigm, the programmers define not only
    the data, but also the operations (functions) that can be performed on it together
    a single unit. This follows bottom-up approach.


    +   - OOP is based on certain concepts that include objects, classes, abstraction,
    encapsulation, inheritance, and polymorphism.


    +   - An object is a unit of structural and behavioural modularity that contains
    a set of properties (or data) as well as the associated functions.


    +   - A class is defined as a user-defined data type which contains the entire
    set of similar data and the functions that the objects possess. The process of
    creating objects from a class is known as instantiation.


    +   - Abstraction is a mechanism to hide irrelevant details and represent only
    the essential features that one can focus on important things at a time. Abstraction
    can be of two types, namely, data abstraction and control abstraction.


    +   - Inheritance is defined as the process whereby an object of a class acquires
    characteristics from the object of the other class. Inheritance can be of two
    types, namely, single inheritance and multiple inheritance.


    +   - Polymorphism (a Greek word meaning multiple forms) is the ability of an
    entity such as a function or message to be processed more than one form.


    +   - Message passing is a process of interacting between different objects in
    a program.


    +   - The high-level language that implements the concepts of object-oriented
    programming is known as an object-oriented (OO) language. For example, Eiffel,
    Smalltalk, Ruby, Java, C#, C++ and Python are OO languages.


    +   - OOP has been used to develop software in many areas including Simulations
    and Modelling, User-interface design, Developing computer games, Scripting, Object
    Databases.


