  md: '# # CHAPTER

    # 16

    # JAVA SWING


    # ## CHAPTER OBJECTIVES


    After reading this chapter, you will be able to:


    +   - Learn about various Swing packages

    - Understand the concept of Swing components and containers

    - Describe various Swing controls and their functions

    - Understand the use of the various pane classes

    - Describe various layout managers and how they organize components within a container

    - Understand different types of dialog boxes and how to work with them

    - Explain the use of JTable, Timer, JProgressBar and JSlider classes


    # ## 16.1 INTRODUCTION


    Swing, a part of Java Federation Classes (JFC) is the next generation GUI toolkit
    that allows us to develop large scale enterprise applications in Java. It is a
    set of classes which provides many powerful and flexible components for creating
    graphical user interface. Earlier, the concept of Swing did not exist in Java
    and the user interfaces were built using the Java''s original GUI system, AWT.
    Because of the limitations of the AWT, Swing was introduced in 1997 by the Microsystems.
    It provides new and improved components that enhance the look and functionality
    of GUIs.


    With Java 1.1, Swing was used as a separate library. However, it was fully integrated
    into Java with the start of Java 1.2. So, working with Java 1.2 can easily work
    with Swing.


    # ## 16.2 FEATURES OF SWING


    Swing provides many new features; two of its popular features are:


    +   - Lightweight components

    - Pluggable look and feel


    # ### 16.2.1 Lightweight Components


    Swing components are lightweight as they are written entirely in Java and do not
    depend on native peers (platform specific code resources). Rather, they use simple
    drawing primitives to render them on the screen. The look and feel of the component
    is not controlled by the underlying operating system by Swing itself. Thus, they
    are not restricted to platform-specific appearance, rectangular or opaque shape.


    Note: Most of the components are lightweight but not all.'
  merge: -1
