    # # JAVA BEANS


    # ## CHAPTER OBJECTIVES


    After reading this chapter, you will be able to:


    +   * Explain Java Beans

    * Understand the features of Java Beans

    * Explain the features of Application Builder Tools

    * Download and install Builder Development Kit (BDK)

    * Start and run BeanBox

    * Create and configure the Beans available in the BeanBox

    * Generate a JAR file using JAR tool

    * Develop a new bean using BeanBox

    * Use Bound property of a Bean

    * Use BeanInfo interface to expose the specific properties of a bean

    * List Java Beans API

    * Explain Enterprise Beans (EJB) and its types

    * Understand session beans

    * Explain entity beans


    # ### 18.1 INTRODUCTION


    Other than the standalone applications and applets, Java is used to develop Beans,
    the reusable software components that are developed using the Java Beans technology.
    A Bean may be a simple GUI component such as button or slider, or a complex visual
    software component such as database viewers or an invisible object stack or queue.
    These components can be assembled into an application using BeanBox, which is
    an application building tool.


    # ### 18.2 JAVA BEANS


    Java Beans is a technology that allows you to build complex systems from reusable
    software component (called bean). It provides an architecture that these components
    can communicate with one another.


    A bean is a software component that is designed to be reused in different environments.
    These components are written in the Java language like other Java programs and
    run in Java Virtual Machine (JVM).'
