  md: '# 284 Programming with Java


    #  16.2 Pluggable Look and Feel


    The pluggable look and feel allows us to tailor the look and feel of the application
    and applets to the standards looks like, Windows and Motif. We can even switch
    to different look and feel at runtime. Swing has the capability to support several
    look and feels, but it provides support for the Windows and Motif. As the look
    and feel of components is controlled by Swing rather than by operating system,
    the feel of components can also be changed. The look and feel of a component can
    be separated from the logic of the component. Thus, it is possible to “plug in”
    a new look and feel for any given component without affecting the rest of the
    code.


    **Note:** Default look and feel, provided by JE 1.6 is called metal, which is
    also called the Java look and feel.


    #  16.3 THE SWING PACKAGES


    As discussed earlier, Swing is a set of large number of classes. The classes in
    Swing are grouped in various packages. Some of the Swing packages are:


    +   * javax.swing: Contains Swing components, interfaces and the classes.

    * javax.swing.border: Contains the definition of border classes.

    * javax.swing.event: Contains listeners for carrying out various events.

    * javax.swing.tree: Provides models and views for tree component.

    * javax.swing.text: Contains definition for various text based classes.

    * javax.swing.table: Provides models and views for tables components.


    The *javax.swing* is the most important and widely used package and must be imported
    into a program that uses Swing.


    #  16.4 SWING COMPONENTS AND CONTAINERS


    Like AWT, Swing GUI is also based on the concept of components and containers.
    A container is a type of component that can hold other components. A component
    must always be placed within a container. A container can also hold other containers,
    thus, then, can be organized in a hierarchy. This hierarchy is similar to that
    of AWT but in Swing, the name of class is preceded by ‘J’.


    #  16.4.1 Swing Components (JComponent Class)


    Swing component is an independent control, such as button, label, text field,
    they need a container to display them. Swing components are derived from JComponent
    class. JComponent provides the functionality for all components. JComponent inherits
    the AWT class Container and Component. Thus, a Swing component and AWT component
    are compatible with each other. Table 16.1 lists the classes required for creating
    Swing components (including those used).


    Table 16.1 List of Classes for Swing Components

    | Swing Classes |

    |---|---|---|---|n| JApplet | JFrame | JProgressBar | JTextField |

    | JButton | InternalFrame | JRadioButton | JField |

    | JCheckBox | JLabel | JRadioButtonMenuItem | JPane |

    | JCheckBoxMenuItem | JLayeredPane | RootPane | JToggleButton |'
