  md: '# Programming with Java


    # Choice


    A control creates a drop-down list of textual entries. When the user clicks on
    it a list of choices appears. The user can select only one of the items contained
    in the list and only the selected item is displayed. Choice is an object of Choice
    class. The Choice class defines the default constructor, that is, Choice() which
    creates an empty list.


    In order to add items to the list, add() method is used which takes the name of
    the item to be added as an argument.


    # List


    List, Choice, displays a list of items. However list allow the user to make multiple
    selections from the given list of items. Using list any number of items can be
    displayed and multiple selections can be made. List is an object of List class.
    The List class defines the following constructors.


    ```

    List()                                //first

    List (int Rows)                         //second

    List (int Rows, boolean multi_select) //third

    ```


    The first constructor creates a list where Rows specifies the only selection of
    items. The second constructor creates a list where Rows specifies the visible
    number of entries in the list. The third constructor the multi_select represents
    the allowable selections in the list. If it is true, multiple selections are allowed
    at a time otherwise only one item can be selected at a time


    To add items to the list, add() method is used.


    # Text Field and Text Area


    Text field and area controls create a single-line and multi-line text area respectively.
    These controls are provided by two classes which inherit TextComponent class.


    The text field allows the user to enter and edit the text in the text field using
    cut, copy and paste keys, arrow and mouse selections. It is an object of TextField
    class. The TextField class defines the following constructors.


    ```

    TextField()                             //first

    TextField(int cols)                      //second

    TextField(String strl)                  //third

    TextField(String strl, int cols)       //fourth

    ```


    The first constructor creates an empty text field. The second constructor creates
    a text field in which cols represents the width of the text field. That is, the
    maximum number of characters the text field can contain. The third constructor
    creates a text field where strl specifies the string contained in the text field.
    The fourth constructor creates a text field containing string strl and having
    its width represented by cols.


    The text area creates a multi-line text area. It is an object of TextArea class.
    The TextArea class defines the following constructors.


    ```

    TextArea()                           //first

    TextArea (String strl)                   //second

    TextArea (int rows, int cols)          //third

    ```'
