    # 3.5 DATA TYPES


    A data type determines the type and the operations that can be performed on the
    data. Java provides various data types and each data type is represented differently
    within the computer''s memory. The type of data selected by a programmer depends
    on the particular application. The various data types provided by Java are categorized
    into primitive data types and non-primitive data types. (See Figure 3.2).


    ![](img/f19fd57d7c8eb6df4d32b7cfe4d13a3a_42_0.png)


    Figure 3.2 Data Types


    # 3.5.1 Primitives Data Types


    Primitive data types, also known as built-in data types, are the fundamental data
    types provided by a programming language. In Java, primitive data types include
    integer, floating point, character and boolean.


    # Integer Type


    The integer type is used to store integers like 4, 42, 5233, -32, -745. Java supports
    four types of integers namely, byte, short, int and long. The default value of
    these integer types is 0. There is no concept of unsigned integer in Java. The
    various integer data types with their size and range are listed in Table 3.4.'
