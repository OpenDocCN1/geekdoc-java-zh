  md: '# 20.2.2 IP Address


    Every machine on the Internet is identified by a numerical address known as IP
    address. An IP address consist of 32-bit number, organized as four 8-bit values.
    It is represented in a format known as dotted-decimal notation. In this representation,
    each group of bit is represented by its decimal equivalent is between 0 and 255.
    For example, 1.160.10.240 could be an IP address. This address type was specified
    by IPv4 (Internet Protocol, version 4).


    Since this representation is not user friendly, IP address is mapped to domain
    name like www.google.com is easier to remember. Special servers on the Internet
    perform this mapping called Domain Name Servers. It allows users to work with
    domain names, however, Internet operates on the IP addresses.


    Note: New addressing scheme (known as IPv6) uses 128-bit value to represent address.


    # 20.2.3 Ports and Port Numbers


    A machine provides a variety of services including electronic mail, Telnet, FTP,
    etc. Using IP address, a client can connect to the machine but cannot connect
    to the desired service. To resolve this, each service, a port number is associated.
    A port is a logical number assigned to a particular service through which the
    service is requested.


    Clearly, to access a server, the client machine does not connect to the server,
    it connects to a port for server. Each packet that is sent over a network contains
    the IP address of the host machine and the port number to identify the particular
    application running on host machine. An IP address can be considered the house
    address where a letter is sent via post port number is the name of the person
    to whom the letter is delivered.


    > Note: The port numbers below 1024 are known as well-known ports and are reserved
    for standard services. For example, the port number used for Telnet is 23.


    # 20.2.4 Sockets


    The combination of IP address and port number is known as socket. A socket identifies
    an endpoint of a two-way communication link between two programs running on the
    network. When a client requests a connection on a particular port, the server
    identifies and keeps track of the socket that it will use to communicate with
    client. A server can communicate on the same port with many clients using sockets
    to determine the destination and source of the communication.


    # Socket-based Communication


    In socket-based communication, the server (program) running on a computer binds
    to a to specific port. The server listens to this socket for any client''s connection
    request as shown in Figure 20.2(a). When a request is made, the server accepts
    the request. Once the request is accepted, the server binds a new socket to a
    different port [see Figure 20.2(b)]. The new socket is required so that the server
    can continue to listen to the original socket for new connection request and at
    the same time keep serving the connected clients.'
