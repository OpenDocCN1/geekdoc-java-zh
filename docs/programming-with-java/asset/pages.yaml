  md: '# CHAPTER

    20

    SOCKET PROGRAMMING


    # CHAPTER OBJECTIVES


    After reading this chapter, you will be able to:


    +   * Understand the client/server communication

    * Explain the important protocols of TCP/IP suite

    * Describe the role of ports in networking

    * Understand the significance of IP addresses

    * Explain the use of sockets

    * List the classes and interfaces defined in java.net package

    * Resolve the domain names to IP addresses and vice versa using InetAddress class

    * Create server and client using TCP/IP socket and UDP socket


    # 20.1 INTRODUCTION


    At the core of the network programming is the concept of a socket. A socket is
    one endpoint of a two-way communication link between two programs running on the
    network. Java supports creation of sockets and exchange information using different
    protocols through the classes defined in java.net package. To use these classes,
    one must know the fundamentals of networking like TCP/IP protocols, Internet Addressing
    and ports. We will review all these topics in this unit before discussing socket
    programming.


    # 20.2 CLIENT AND SERVER CONCEPT


    The network systems comprise a server, client and communication media. A machine
    running a process that sends request for the services is known as client. On the
    other, a machine running a process that responds to the client''s request by offering
    requested services is known as server. A server can handle many clients at the
    same time. To make the clients and the server communicate, connecting medium is
    required. The communication medium may be wired or wireless network.

    A network can be small (having two computers) or as vast as Internet. Communication
    over network requires some reliable delivery services that can carry information
    between two machines. The delivery services use regardless of the hardware and
    software used on the network. The Internet provides delivery services using a
    suite of protocols known as TCP/IP named after its two primary protocols, namely,
    Transport Control Protocol and Internet Protocol. The TCP/IP consists of four
    layers, namely, Application, Transport, Network, and Link layer. All the layers
    along with their corresponding protocols are shown in Figure 20.1.'
