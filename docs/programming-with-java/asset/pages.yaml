- img_proc: true
  md: '# 200 Programming with Java


    Java streams can be broadly categorized into two types, namely, input stream and
    output stream. The streams which help to read data from various sources, namely,
    keyboard, mouse, files, storage devices, etc., in order to supply it to the program
    are called input streams. The streams which receive data from the program and
    write it to physical devices or other programs are called output streams. For
    example, to bring the data from an input device into the program, the program
    opens an input stream to the input device and reads the data in a serial manner.
    Conversely, to write data from the program to an output device, the program opens
    an output stream to the output device and writes to it serially (see Figure 12.1).


    ![](img/f19fd57d7c8eb6df4d32b7cfe4d13a3a_215_0.png)


    # 12.4 STREAM CLASSES


    Java supports input/output streams through a hierarchy of classes defined in the
    java.io package. On the basis of the type of data on which these classes operate,
    they can be categorized into two groups: byte stream classes and character stream
    classes (see Figure 12.2).


    +   * Byte stream classes: These classes support input and output operations on
    bytes (8-bit bytes). For example, while reading from writing data to a binary
    file, byte stream classes are used.


    +   * Character stream classes: These classes perform input and output operations
    on characters (16-bit Unicode). For example, while reading from writing data to
    a text file, character stream classes are used.


    ![](img/f19fd57d7c8eb6df4d32b7cfe4d13a3a_215_1.png)'
