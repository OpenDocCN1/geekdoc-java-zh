    # INTRODUCTION


    Java, initially named “Oak”, was developed by the team headed by James Gosling
    at Sun Microsystems, USA, in 1991. The first and foremost reason behind the development
    of Java was the need for a platform-independent and portable software to be embedded
    in the consumer''s electronic devices like remote controls, microwave ovens, etc.
    Second reason that led to the growth of Java is the Internet and World Wide Web
    as these media needed portable and platform-independent programs. Gosling and
    other team members developed web applets using the new language that could run
    on all types of computers. During 1993, the first web browser, ‘HotJava’, was
    developed to locate and run applet programs. This development made Java popular
    for the Internet. By 1996, Java became the general-purpose, object-oriented programming
    language which was used for Internet programming. So, Java became popular and
    many web browsers like Internet Explorer, Netscape Navigator incorporated the
    ability to run Java applets.


    # BASIC FEATURES OF JAVA PROGRAMMING LANGUAGE


    Java is a third generation programming language which implements most of the concepts
    of OOPs. Java has become a popular language for Internet applications because
    of various features which are as follows.


    The important features of Java are as follows.


    +   - Simple: Java inherits the syntax of C/C++ and many of the OOPs features
    of C++ thus one who has understood the concepts of object-oriented language can
    learn Java with least effort. Moreover Java omits the complex and unreliable code
    of C and C++ like operator overloading, pointers, preprocessor header files. Java
    provides small and convenient ways to accomplish a given task.'
