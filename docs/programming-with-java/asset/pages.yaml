  md: '# 12.4.1 Byte Stream Classes


    Byte stream classes are used to perform reading and writing of 8-bit bytes. Streams
    being unidirectional in nature can transfer bytes in one direction only, that
    is, reading data from the source into a program or writing data from a destination.
    Java further divides byte stream into two classes, namely, InputStream class and
    OutputStream class. The subclasses of InputStream class contain methods to support
    input and the subclasses of OutputStream class contain output related methods.


    # Input Stream Classes


    Java''s input stream classes are used to read 8-bit bytes from the stream. The
    InputStream class is the superclass for all byte-oriented input stream classes.
    All the methods of this class throw IOException. Being an abstract class, the
    InputStream cannot be instantiated, hence its subclasses are. Some of these are
    listed in Table 12.1.


    # Table 12.1 Input Stream Classes


    | Class | Description |

    | BufferedInputStream | contains methods to read bytes from the buffer (memory
    area) |

    | ByteArrayInputStream | contains methods to read bytes from a byte array |

    | DataInputStream | contains methods to read Java data types |

    | FileInputStream | contains methods to read bytes from a file |

    | FilterInputStream | contains methods to read bytes from other input streams
    which it uses as its basic source of data |

    | ObjectInputStream | contains methods to read objects |

    | PipedInputStream | contains methods to read from a piped output stream. A piped
    input stream must be connected to a piped output stream |

    | SequenceInputStream | contains methods to concatenate multiple input streams
    and then read from the combined stream |


    The InputStream class defines various methods to perform reading operations on
    an input stream. Some of these methods along their description are listed in Table
    12.2.


    # Table 12.2 InputStream Class Methods


    | Method | Description |

    | read() | returns the integral representation of the next byte of input. -1 when
    end of input is encountered |

    | int read(byte buffer[]) | attempts to read length bytes into the buffer and
    returns the total number of bytes successfully read. -1 when end of input is encountered
    |

    | int read(byte buffer[], int loc, int nBytes) | attempts to read ''nBytes'' bytes
    into the buffer starting at buffer[loc] and returns the total number of bytes
    successfully read. -1 when end of input is encountered |

    | int available() | returns the number of bytes of the input available for reading
    |

    | void mark(int nBytes) | marks the current position in the input stream until
    ''nBytes'' bytes are read |'
