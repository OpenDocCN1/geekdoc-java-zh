  md: '# 17.3 JDBC-ODBC BRIDGE


    Microsoft''s ODBC is the most commonly used driver to connect to the database
    as it can connect to almost all databases on most of the platforms. However, ODBC
    uses the concept of pointers and other constructs that are not supported by Java.
    Therefore, JDBC-ODBC bridge driver was developed which translates the JDBC API
    to the ODBC API and vice versa. This bridge acts as interface that enables all
    DBMS which support ODBC (Open Data Base Connectivity) to interact with Java Applications.
    JDBC-ODBC bridge is implemented as a class file and a native library. The name
    of the class file is JdbcOdbc_class. On Windows platform, native library called
    JDBCODBC.dll used


    Figure 17.1 shows the JDBC application architecture in which a front-end application
    uses JDBC for interacting with JDBC Driver Manager. Here, JDBC Driver Manager
    is the backbone of JDBC architecture. It acts as interface that connects a Java
    application to the driver specified in the Java program, Next, is the JDBC-ODBC
    bridge which helps the JDBC to access ODBC data sources.


