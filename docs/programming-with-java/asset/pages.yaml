    #  1.5 BASIC CONCEPTS OF OO APPROACH


    To understand the concept of object-oriented programming, it is necessary to know
    the fundamental terms and concepts of this approach. These include objects, classes,
    data abstraction, encapsulation, inheritance, method overriding and polymorphism,
    and message passing


    # 1.5.1 Objects


    Objects are the small, self-contained and modular units with a well-defined boundary.
    An object consists of a state and behaviour. The state of an object is one of
    the possible conditions that an object can exist in and is represented by its
    characteristics or attributes or data. The behaviour of an object determines how
    an object acts or behaves and is represented by the operations that it can perform.
    In OOP, the attributes of an object are represented by the variables and the operations
    are represented by the functions.


    For example, an object Biscuit may consist of data product code P001, product
    name Britannia Biscuits, price 20 and quantity in hand 50. These data values specify
    the attributes or features of the object. Similarly, consider another object Maggi
    with product code P002, product name Maggi Noodles, price 10, and quantity in
    hand 20 (see Figure 1.5). In addition, the data in the object can be used by the
    functions as check_query() and display_product(). These functions specify the
    actions that can be performed on.


    Objects are actually run entities in the computer and thus, they are the basic
    blocks of object-oriented programming. Although, two or more objects can have
    same attributes, they are separate and independent objects with their own identity.
    In other words, all the objects in a system take a separate space in the memory
    independent of each other. Note that the main objective of breaking down complex
    projects into objects is that changes made to one part of a software should not
    adversely affect the other parts.


    # 1.5.2 Classes


    A class is defined as a user-defined data type which contains the entire set of
    similar data and the functions that the objects possess. In other words, a class
    in OOP represents a group of similar'
