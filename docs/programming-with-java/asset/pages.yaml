  md: '# Programming with Java


    # 3.3.1 Keywords


    Keywords are the predefined words that have special significance in any language.
    Every keyword is reserved for a specific purpose and cannot be used as user-defined
    names (identifiers). There are various keywords in Java, which are listed in Table
    3.1.


    Table 3.1 Java Keywords


    | abstract | const | final | interface | short | transient |

    |---|---|---|---|---|---||

    | assert | | | | transient | | |

    | | continue | finally | long | static | try |

    | boolean | default | for | native | strictfp | void |

    | break | do | goto | | super | volatile |

    | byte | double | new | package | switch | while |

    | case | else | instanceof | private | synchronized | |

    | catch | enum | | implements | protected | this | |

    | char | extends | import | public | | |

    | class | | int | | return | throws | |


    Note: The keywords const and go are reserved words that they are not used.


    # 3.3.2 Identifiers


    Identifiers are the names given to uniquely identify various programming elements
    like variables, arrays, methods, classes, objects, packages, interface and on.
    While defining identifiers in Java, programmers must follow the rules listed here.


    +   - An identifier must be unique in a program.

    - Alphabets, digits, underscore and dollar sign characters can be used in an identifier.

    - An identifier must not start with a digit.

    - An identifier must in upper case is different from that in lower case.

    - An identifier must not contain other characters as ''*'', '';'' and white space
    characters (tabs, space and newline).


    Some valid and invalid identifiers in Java are listed here.


    ```

    Pol78_cdm //valid

    hh$6 //valid

    _78hhvt4 //valid

    902gt1 //invalid as it starts with a digit

    Tyy;ui8 //invalid as it contains the '';'' character

    for //invalid as it is a Java keyword

    Fg026 neo //invalid as it contains spaces

    ```


    # 3.3.3 Constants


    Constants, also known as literals, are the values that a program cannot alter
    during its execution. For example, 391, "Byron", 51.072 and ''p'' are all constants.
    Based on the type of value (data), Java constants are broadly classified into
    four categories, namely, numeric constants, character constants, string constants
    and boolean constants.'
