  md: "# 152 Programming with Java\n\n# 10.5 USING try AND catch BLOCKS\n\nThe default\
    \ exception handler provided by Java runtime system does not prevent the abrupt\
    \ termination of the program. To prevent this, Java provides us the facility to\
    \ construct our own exception handler. By constructing our exception handler,\
    \ we can fix the errors ourselves. This can be achieved by enclosing the code\
    \ that may throw an exception within a try block. The try block is enclosed by\
    \ curly braces and preceded by the keyword try. Whenever an exception occurs within\
    \ the try block, this passes the control to the catch block associated with the\
    \ try block.\n\nThe syntax of try-catch block is:\n\n```\ntry //try block begins\n\
    {\n    // code that may cause an exception\n}\ncatch(exception_type ex)\n{\n \
    \   // code to handle the exception\n}\n```\n\nIf the first statement of the try\
    \ block causes an exception, the remaining statements are not executed and the\
    \ control passes to the catch block. The catch statement requires single argument\
    \ which is of the same type as exception that needs to be handled. This exception\
    \ type must be a subclass of Throwable class. It is not necessary every time the\
    \ program is executed, an exception occurs. If an exception is not thrown, the\
    \ catch block is skipped and the control passes to the statement immediately following\
    \ the catch block.\n\nThe try and catch blocks form a logical unit. The scope\
    \ of the catch block is limited to those statements which are enclosed within\
    \ the immediately preceding try block.\n\n> Note: Compile-time error is generated\
