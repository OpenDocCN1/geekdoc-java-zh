  md: '# 88 Programming with Java


    # 6.3 STRINGS


    In Java, a string is an object that is created using String or StringBuffer. Each
    class has its own set of methods for creating and manipulating strings. The difference
    between these two classes is that an object created from the String class is an
    immutable object. An immutable object whose contents cannot be modified after
    it is created. That is, the characters cannot be inserted, replaced or removed
    from the string created using String. However, an object created using StringBuffer
    class is a mutable object which can not only be modified but also be expanded
    or contracted dynamically whenever required.


    # 6.3.1 String Class


    The String class is more commonly used to display messages and when strings need
    to be compared, searched or individual characters in a string required to be extracted
    as substring.


    The syntax to create a string is:


    ```

    String string_name;

    ```


    The syntax for creating a string is:


    ```

    string_name=new String("Sequence_of_characters");

    ```


    These two steps of declaration and creation can be combined into a single statement
    as follows:


    ```

    String_name=new String("Sequence_of_characters");

    ```


    For example, the statement to declare and create a str1 using String class is:


    ```

    str1=new String("Java Programming Language");

    ```


    The String class provides various methods for manipulating strings. Some of the
    commonly used methods of String class along with their description are listed
    in the Table 6.1.


    | Table 6.1 String Class Methods and their Description |

    | Methods | Description |

    | str1.length() | returns the length of the string str1 |

    | str1.equals(str2) | returns ''true'' if str1 is equal to str2 |

    | str1.compareTo(str2) | returns negative if str1<str2, positive if str1>str2,
    otherwise 0 |

    | str1.concat(str2) | concatenates str1 and string str2 |

    | str1=str2.trim() | removes all the white spaces at the beginning and end of
    the string str2 and assigns it to str1 |

    | str1=str2.replace(''a'',''b'') | replaces all appearing in the string str2 with
    b and assigns it to str1 |

    | str1=str2.toLowerCase() | converts uppercase letters in the string str2 to lowercase
    and assigns it to str1 |

    | str1=str2.toUpperCase() | converts lowercase letters in the string str2 to uppercase
    and assigns it to str1 |

    | str1.indexOf(''a'') | gives the position of the first occurrence of character
    ''a'' in the string str1 |

    | str1.indexOf(''a'',n) | gives the position of the first occurrence of character
    ''a'' that occurs nth position in the string str1 |'
