  md: '# Java Database Connectivity (JDBC) 349


    # 17.4 JDBC IMPLEMENTATION


    To work with the database, Java provides java.sql package. It contains various
    classes and interfaces that can be used for establishing connection with database
    and retrieve data from it. This section discusses one of the important class DriverManager
    and some of the important interfaces included in this package.


    # 17.4.1 The DriverManager Class


    The DriverManager class is responsible for loading the driver specific classes.
    The drivers are registered with the DriverManager class either when an instance
    of driver is created using registerDriver(Driver driver) method of the DriverManager
    class or DriverManager class is initialized.


    The static method forName() of the Class can be used by DriverManager class to
    locate and load drivers in system variable jdbc.drivers is as follows. Class.forName("sun.jdbc.odbc.JdbcOdbcDriver");


    Here, the driver specified in the string parameter is loaded dynamically at the
    run time. Some of the methods of the DriverManager are:


    +   - getConnection(String url): This method attempts to establish a connection
    to a given database URL—does not require password.


    +   - getConnection(String url, String user, String password): This method attempts
    to establish a connection to a given database URL.


    +   - void registerDriver(Driver driver): This method is used to register a driver
    specified by driver with the DriverManager.


    +   - void deregisterDriver(Driver driver): This method removes the driver specified
    by driver from the DriverManager''s list.


    # 17.4.2 The Connection Interface


    The Connection interface helps to establish a connection with the required database.
    Other than establishing connection, it provides lot of functionality including
    transaction management, maintaining database sessions and creating SQL statements.


    Some of the commonly used methods of connection interface are follows:


    +   - void close(): This method closes database connection associated with Connection
    object releases JDBC resources.


    +   - Statement createStatement(): This method creates a Statement object which
    is used to send SQL statement to the database. It is usually used when SQL statement
    without parameters is to be executed.


    +   - CallableStatement prepareCall(String sql): This method creates an instance
    of CallableStatement which is used to handle database stored procedures.


    +   - PreparedStatement prepareStatement(String sql): This method creates PreparedStatement
    object which is used to create SQL statement in string sql. It is usually used
    when parameterized SQL statement is to be executed.'
