    # The TextListener Interface


    The method valueChanged() defined by the TextListener interface is invoked when
    the text inside the text area or text fields changes. The object of TextEvent
    class is passed as method parameter.


    > The general form of the method defined in TextListener interface is:

    void textValueChanged(TextEvent te)


    # The WindowListener Interface


    The methods defined by the WindowListener interface are invoked when the state
    of the window changes. The object of WindowEvent class is passed as method parameter.


    > The general form of the methods defined in WindowListener interface is:

    void windowOpened(WindowEvent we)

    void windowClosed(WindowEvent we)

    void windowClosing(WindowEvent we)

    void windowActivated(WindowEvent we)

    void windowDeactivated(WindowEvent we)

    void windowIconified(WindowEvent we)

    void windowDeiconified(WindowEvent we)


    # The PropertyChangeListener Interface


    The method defined by the PropertyChangeListener is invoked when the property
    of the source object changes. The object of PropertyChangeEvent is passed as method
    parameter.


    > The general form of the method defined in PropertyChangeListener interface is:

    void propertyChange(PropertyChangeEvent pce)


    # The ChangeListener interface


    The method defined by the ChangeListener is invoked when the source object changes.
    It is used by the components like scroll bars. The object of ChangeEvent class
    is passed as method parameter.


    > The general form of method defined in ChangeListener interface is:

    void stateChanged(ChangeEvent ce)'
