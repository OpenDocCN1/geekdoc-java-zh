    # 1.8 APPLICATIONS OF OOP


    Since 1960, Simula-67 was developed, object-oriented paradigm has touched many
    major areas of software development. Some of the areas where OOP has been used
    to develop software are listed here:


    +   * Simulation and modelling**: Simulation is the technique of representing
    the real-world entities with the help of a computer program. Simula-67 and Smalltalk
    are object-oriented languages that are designed for making simulations.

    * **User-interface design**: Another popular application of OOP has in the area
    of designing graphical interfaces such as Windows. C++ is mainly used for developing
    user-interfaces.

    * **Developing computer games**: OOP is also used for developing computer games
    such as Diablo, Starcraft, Warcraft III and many more. These games offer virtual
    reality experiences in which a number of objects interact with each other to give
    the desired result.

    * **Scripting**: In recent years, OOP has also been used for developing HTML,
    XHTML and XML documents for the Internet. Python, Ruby and Java are the scripting
    languages based on object-oriented principles which are used for scripting.

    * **Object databases**: These days OOP concepts have been introduced in database
    systems to develop a new DBMS based object databases. These databases store the
    data directly in the form of objects.


    Some other areas of applications include office automation systems, decision support
    systems, Artificial Intelligence (AI) and expert systems, Neural networks and
    parallel programming, and Computer-Aided Design (CAD) systems.'
