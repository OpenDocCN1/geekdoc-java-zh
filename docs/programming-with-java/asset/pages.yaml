  md: '# Multithreading


    # Newborn State


    When a thread is created, it enters a state called newborn state. It is the first
    state in the life cycle of a thread in which the thread is newly born and it is
    not yet ready to run. That is, the thread is considered not active. During this
    stage, we can schedule the thread for running by calling the start() method or
    kill it using stop() method. We cannot use any other method on the newborn state
    otherwise it will throw exception.


    # Runnable State


    The thread enters the runnable state when it is ready to run and waiting for the
    CPU to be allocated to it. Whenever a thread is ready to run, it is placed in
    the queue of threads that are waiting for the availability of the CPU. The thread
    scheduler picks one of the threads in the queue based on their priority. If all
    the threads in the queue have equal priority, the scheduler gives time slots for
    execution in round robin fashion. A thread can voluntarily give up its turn and
    give the control to another thread of equal using a static method yield(). It
    joins the queue at the end and waits for its turn to come.


    # Running State


    A thread is to be in the running state when it gets the processor for execution,
    that is, when the thread scheduler picks it to be the currently executing thread.
    The thread will be executed by the processor and will keep running until it preempted
    by a thread of higher priority or it gives the control in either of the following
    conditions.


    +   - When being suspended suspend() method: If we want to suspend a thread for
    some time but not want to kill it, then we use the suspend() method. The suspended
    thread can be brought back to the execution state by invoking a method resume().

    - When it is made to sleep sleep() method: The sleep() method makes the thread
    sleep for the specified period of time. The thread will automatically return back
    to its execution state once the specified time is elapsed.

    - When it is made to wait wait() method: A thread can be made to wait until some
    events occur by calling wait() method. We can make the thread run again by using
    the notify() method.


    # Blocked State


    A thread is in blocked state when the thread is either suspended, or sleeping
    or waiting. The thread in this state is not considered dead, so it can re-enter
    the runnable state and subsequently run if the CPU is available.


    # Dead State


    A thread is said to be in dead state if its run() method completes or has been
    killed deliberately by invoking the stop() method at any state. Once a thread
    enters the dead state, it cannot re-enter any other state even if the start()
    method is invoked.


    > Note: The predefined methods stop(), suspend() and resume() have been deprecated
    in the later versions of Java. It is discussed in the later section.'
