    This shows that the package java lang contains the package lang which in turn
    contains various classes such as Math, String, etc.


    The classes stored in a package can be accessed in two ways depending on the following
    situations.


    +   * If we need to access the class only once or when we do not need to access
    any other class of the same package.

    In this case, to access the class, the name of the package is followed by dot
    (. ) operator which is followed by the name of the class. For example, the statement
    to access the Math class contained in lang package is as follows:

    `java.lang.Math`

    * If we want to use multiple classes contained in a package or the same class
    in various places of the program. This can be achieved with the help of import
    statement. The syntax to access the same class in various places is:


    ```

    `import package_name.class_name;`nwhere,

    import is a Java keyword

    package_name is the name of the package

    class_name is the name of the class belonging to that package

    ```'
