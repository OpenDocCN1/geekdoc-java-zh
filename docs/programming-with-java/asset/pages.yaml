  md: "# Java Swing 313\n\n# 16.9.1 Flow Layout\n\nThe flow layout manager is the\
    \ simplest of all the layout managers. It positions the components in the order\
    \ they are added to the container. It places the components from left to right,\
    \ that is, horizontally. once a row gets completely filled with components then\
    \ the remaining components are placed in the next row. It is the default layout\
    \ manager for Applet and Panel. Each component is evenly separated from its neighboring\
    \ components by leaving a small space not from above and below it, but also from\
    \ left and right.\n\nThe flow layout manager can be created by using any of the\
    \ following constructors.\n\n```\nFlowLayout()\nFlowLayout (int alignment)\nFlowLayout\
    \ (int alignment, int hor, int ver)\nwhere;\n```\n\nalignment specifies the align\
    \ of laid components. It can take one of the constants–FlowLayout.LEFT, FlowLayout.RIGHT,\
    \ and FlowLayout.CENTER\nor and ver specify the horizontal and vertical space\
    \ between each component, respectively\n\nFor example, the following statement\
    \ creates a left-just FlowLayout with a horizontal gap of 5 pixels and a vertical\
    \ gap of 10 pixels.\n\n```\nmyFlowLayout = new FlowLayout(FlowLayout.LEFT, 5,\
    \ 10);\n```\n\nConsider Example 16.11. Here flow layout is set as the layout for\
    \ the frame and then, three text fields and labels are added to the frame in which\
    \ they get arranged accordingly.\n\n# Example 16.11 A program to demonstrate the\
    \ use of FlowLayout\n\n```\nimport javax.swing.*;\nimport java.awt.*;\n```\n\n\
    ```\nclass MyFlowLayout extends Applet\n{\npublic static void main(String[] args)\n\
    {\n    JFrame frame = new JFrame(\"Demo of Flow layout\");\n    frame.setLayout(new\
    \ FlowLayout());\n    //creating various components\n    JButton b1 = new JButton(\"\
    Button 1\");\n    JButton b2 = new JButton(\"Button 2\");\n    JButton b3 = new\
