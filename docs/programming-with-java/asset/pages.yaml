    # 18.10 ENTERPRISE JAVEBEANS (EJB)


    Enterprise JavaBeans (EJB) is a server modular and reusable software component
    that can be deployed in a distributed environment. It is mainly used to represent
    a business object or a table in a database. It is similar to a Java class that
    it runs inside a special environment called EJB container. The client cannot call
    all the methods of the EJB directly rather it uses the EJB container. The EJB
    container handles all the beans running within it. It interacts with the beans
    by invoking a few methods that the beans must expose. Not that a client of an
    enterprise bean could be an applet, a servlet or another enterprise bean.


    Some of the benefits of EJB are as follows:


