  md: "# 13.4 PASSING PARAMETERS TO APPLETS\n\nJava allows users to pass user-defined\
    \ parameters to an applet with the help of <PARAM> tags. <PARAM> tag has a NAME\
    \ attribute which defines the name of the parameter and a VALUE attribute which\
    \ specifies the value of the parameter. In the applet source code, the applet\
    \ can refer to the parameter by its NAME to find its value. The syntax of the\
    \ <PARAM> tag is:\n\n```\n<APPLET>\n<PARAM NAME=parameter1_name VALUE=parameter1_value>\n\
    <PARAM NAME=parameter2_name VALUE=parameter2_value>\n\n<PARAM NAME=parameter_name\
    \ VALUE=parameter_name>\n</APPLET>\n```\n\nFor example, consider the following\
    \ statements to set the text attribute of applet to This is an example of Parameter!\n\
    \n```\n<APPLET>\n<PARAM NAME=text VALUE=This is an example of Parameter!!!\n</APPLET>\n\
    ```\n\nNote that the <PARAM> tags must be included between the <APPLET> and </APPLET>\
    \ tags. The init() method of the applet retrieves user-defined values of the parameters\
    \ defined in the <PARAM> tags using the getParameter method. This method accepts\
    \ one string argument that holds the name of the parameter and returns a string\
    \ method which contains the value of that parameter. Since it returns String object,\
    \ any data type other than String must be converted into its corresponding data\
