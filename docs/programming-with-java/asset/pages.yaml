    # SUMMARY


    +   * Arrays are defined as a fixed size sequence of same type of data elements.

    * The elements of an array are stored in contiguous memory locations and each
    individual element can be accessed using one or more indices subscripts.

    * Arrays can be either single-dimensional or multi-dimensional depending on the
    number of subscripts used.

    * A single-dimensional array is the simplest form of an array that requires only
    one subscript to access an element.

    * Multi-dimensional arrays can be described as ''array of arrays'', that is, each
    element of the array is itself an array.

    * A two-dimensional array is the simplest form of a multi-dimensional array that
    requires two subscript values to access an array element.

    * A string is an object that is created using the String class or StringBuffer
    class.

    * The strings created using the String class are of fixed length and cannot be
    modified, that is, characters cannot be inserted to or removed from the string.

    * The strings created using the StringBuffer class are of varying length and can
    not only be modified but can also be expanded or contracted dynamically whenever
    required.

    * The Vector class is used to implement dynamic array vectors which can accommodate
    any number and type of objects.

    * The wrapper classes are used to convert the primitive data types into their
    respective class instances.


