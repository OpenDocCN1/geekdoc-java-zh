    # 16.9.2 Border Layout


    The border layout manager is the default layout manager for Window, Dialog and
    Frame classes. It positions the components into five regions—east, west, north,
    south, and center. Each region can contain a single component. When a component
    is added to a particular region, it is extended to fit that region. That is, only
    one component can be placed within a region at a time. An attempt to add more
    than one component to a region hides the previously added component by the recently
    added component.


    The border layout manager can be created by using any of the following constructors.


    ```

    BorderLayout()

    BorderLayout(int hor, int ver);

    ```


    where hor and ver specify the horizontal and vertical space between each component,
    respectively


    To add a component to a specific region, add() method is used.


    The general form of add() method is:


    ```

    void add(Component obj, Object region);

    ```'
