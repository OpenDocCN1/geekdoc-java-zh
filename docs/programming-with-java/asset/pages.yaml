  md: '# Single-dimensional Arrays


    A single-dimensional array is the simplest form of an array that requires only
    one substipt to access an array element. Like an ordinary variable, an array must
    be declared before it is used in the program.


    The syntax for declaring a single-dimensional array is:


    ```

    data_type array_name[];

    ```


    or


    ```

    data_type[]array_name;

    ```


    where,


    data_type is any data array_name is the name of the array


    For example, an array marks[] of type int can be declared using either of the
    two statements:


    ```

    int marks[];

    ```


    or


    ```

    int[] marks;

    ```


    After an array is declared, we need to create it by allocating space to it in
    memory. Arrays created using new operator.


    The syntax for creating an array is:


    ```

    array_name=new data_type[size];

    ```


    where,


    size is the size of the array


    For example, an array marks[] of type int and five can be created using this statement:


    ```

    marks=new int[5];

    ```


    The above two steps of declaration and creation of an array can be combined into
    a single statement shown below.


    ```

    data_type array_name=new data_type[size];

    ```


    Similarly, to declare and create an array marks[] of type int and five is


    ```

    int marks[]=new int[5];

    ```


    Note: All the elements created using new operator in the array will be automatically
    initialized to zero.


    # Initialization of Single-dimensional Array


    Once an array is declared and memory is allocated to it, the next step is to initialize
    each array with a value and appropriate value. An array can be initialized at
    the time of its declaration.


    The syntax for initializing an array at the time of declaration is:


    ```

    data_type array_name[]=[value_1, value_2, ..., value_n];

    ```


    The values are assigned to the array elements in the order in which they are listed.
    That is, value_1, value_2 and value_n are assigned to the first, second and n-th
    element of the array, respectively.


    If an array is declared and initialized simultaneously, specifying its size is
    optional. For example, the statement int marks[]={51, 62, 43, 74, 55} is also
    valid. The size of an array marks can be obtained by using marks.length() method.


    Note: If you try to access values outside the range of array index (with negative
    value or greater than the length of the array), run-time error is generated.'
