  md: '# 16.7.6 CheckBox


    A check box is a control that consists of a combination of a small box and a label.
    The label provides the description of the box with which it is associated. It
    is a two-state control having states true (checked) and false (unchecked). The
    state of a checkbox can be changed by clicking on it. A checkbox is an object
    of JCheckBox class.


    Some of the constructors defined by JCheckBox class are as follows.


    ```

    JCheckBox()

    JCheckBox(String string)

    JCheckBox(String string, boolean isSelected)

    ```


    where,

    string is used as a label for the check box

    isSelected is used to set the initial state of the checkbox. If it is true, the
    checkbox is checked, otherwise it is unchecked. The default state of the checkbox
    is false.


    # 16.7.7 TextField


    TextField control creates a single-line area. The field allows the user to enter
    and edit the text using cut, copy and paste keys, arrow keys and mouse selections.
    It is an object of JTextField class which is a subclass of JTextFieldComponent.


    Some of the constructors defined by JTextField class are as follows.


    ```

    JTextField()

    JTextField(int cols)

    JTextField(String string, int cols)

    JTextField(String string)

    ```


    where,

    string is the initial string contained in the text field

    cols is the width of the text field in terms of columns


    # 16.7.8 TextArea


    The text area creates a multi-line text area. It does not provide scrolling facility;
    however, scroll bars can be added by adding the JTextArea in JScrollPane pane.
    A text area is an object of JTextArea class which is a subclass of JComponent.


    Some of the constructors defined by JTextArea class are as follows:


    ```

    JTextArea()

    JTextArea(String strl)

    JTextArea(int rows, int cols)

    JTextArea(String strl, int rows, int cols)

    ```


    where,

    strl represents the initial string contained in text area

    rows represents the height of the text area or the maximum rows a text area can
    have

    cols represents the width of the text area, that is, the maximum number of characters
    each line of the text area can contain'
