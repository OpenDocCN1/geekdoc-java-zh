  md: '# CHAPTER

    11

    MULTITHREADING


    # CHAPTER OBJECTIVES


    After reading this chapter, you will be able to:


    +   - Understand what is thread and what is the concept of multithreading in Java

    - Explain the difference between a single-threaded program and a multithreaded
    program

    - Discuss different ways of creating a thread

    - Describe the complete life cycle of a thread

    - Explain various methods of Thread class

    - Explain thread priority

    - Discuss what is synchronization and different ways of synchronizing a thread

    - Understand what is deadlock

    - Explain inter-thread communication

    - Illustrate how to suspend, resume and stop a thread in the new version of Java


    # 11.1 INTRODUCTION


    Most of the modern operating systems support multitasking with the ability to
    execute multiple programs simultaneously. Java''s multithreading is a specialized
    form of multitasking. Multithreading is a programming concept in which a program
    (process) is divided into two or more subprograms (subprocesses), each of which
    can perform different tasks concurrently. For example, one subprogram can format
    text in the text editor while another subprogram can print the same.


    # 11.2 CONCEPT OF THREADS


    The programs discussed in the earlier chapters contain only a single sequential
    flow of control that the program simply starts, performs a series of operations
    and eventually ends. There is only one statement under execution at any given
    point of time. A thread is just like a program which has a single flow of control.
    It also has a starting, execution part and an end. The main programs in the preceding
    examples can be called single-threaded programs. Java also allows us to use multiple
    flows of control in a program and such a program is known as multithreaded program.
    In a multithreaded program, each thread is a separate tiny module which runs in
    parallel with other threads. Running in parallel does not mean that they are running
    at the same time. As of the time the threads run on the single processor, in reality,
    only one thread is executed at a given time. However, the switching from one thread
    to another thread occurs so fast that it gives an illusion to the user that all
    the threads are being executed at the same time. Threads are called lightweight'
