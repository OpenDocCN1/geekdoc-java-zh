  md: '# SUMMARY


    +   - In Java, all the activities that occur between the user and the application
    are termed as events.

    - An event is an object that specifies the change of state in the source. It is
    generated, whenever an action takes place a mouse button is clicked or text is
    modified.

    - Java packages such as java.util, java.awt and java.awt.event support event handling
    mechanism.

    - The working of an event-driven program is governed by its underlying event-handling
    model.

    - The Java 1.0 Event model of Java for event processing was based on the concept
    of containment.

    - The Delegation Event defines a logical approach to handle events. It is based
    on the concept of source and listener. A source generates an event and sends it
    to one or more listeners that can handle the event.

    - Java provides various classes and interfaces to handle the generated events.

    - Some of the event classes are ActionEvent, AdjustmentEvent, ItemEvent, KeyEvent,
    WindowEvent, ChangeChangeEvent, etc.

    - Some of the event listener interfaces are ActionListener, AdjustmentListener,
    ItemListener, KeyError, WindowListener, ChangeNotifier, CaretListener.

    - Adapter class implements an event listener interface and defines all its method
    with empty body. The methods in adapter class do not provide any additional functionality.
    Adapter class are used in situation when programmers need to process only the
    events of a particular event listener interface.


