    # 18.10.2 Entity Beans


    Entity beans are the Enterprise beans that represent persistent objects like data
    in the database that exist beyond a specific application''s lifetime. They do
    not contain the business logic. Unlike session beans, their life cycle is not
    limited to the session''s duration; they are long lasting. Further, it provides
    an object-oriented interface to data, thereby enables you to combine the functionality
    of persistent data with the facility of the object encapsulation.


    Every entity bean class must implement the EntityBean interface. The container
    uses the methods of this interface to notify the instances of the Entity Bean
    of the instance''s life events.


    # Table 18.6 Methods Defined in EntityBean Interface


    | Method | Description |

    | void ejActivate() | It is invoked by the container when the instance is taken
    out of the pool of available instances to become associated with a specific EJB
    object. |

    | void ejLoad() | It is invoked by the container to give instruction to the instance
    to synchronize its state by loading it from the underlying database. |

    | void ejPassivate() | It is invoked by the container on an instance before instance
    disassociates with a specific EJB object. |

    | void ejRemove() | It is invoked by the container before the EJB object that
    is currently associated with the instance is removed. |

    | void ejStore() | It is invoked by the container to give instructions to the
    instance to synchronize its state by storing it to the underlying database. |

    | void setEntityContext (EntityContext ctx) | It sets the associated entity context.
    |

    | void unsetEntityContext() | It unsets the associated entity context. |


