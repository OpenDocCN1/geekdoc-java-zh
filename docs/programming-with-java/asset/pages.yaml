  md: '# CHAPTER

    13


    # JAVA APPLETS


    # CHAPTER OBJECTIVES


    After reading this chapter, you will be able to:


    +   - Explain the classes and packages which support the creation of an applet.


    +   - Describe the important methods that govern the life cycle of applets.


    +   - Create and use applets in your application.


    +   - Use <PARAM> tag to pass parameters to the applets.


    +   - Use getDocumentBase() and getCodeBase() methods.


    +   - Use showDocument() method defined in the AppletContext interface.


    +   - Understand the significance of Graphics class in applets


    +   - Learn and use various methods defined in the Graphics class


    # 13.1 INTRODUCTION


    The Java programs that we have discussed so far are console-based application
    programs. These are full-featured, stand-alone Java programs, written, modified
    and run through Java Virtual Machine. Java defines another category of application
    programs known as applets. Applets are small Java programs which are specifically
    designed to be used over the Web. The most significant feature of an applet is
    that it transforms a static web page into a user-interactive web page by adding
    images, sounds, animations, different text styles to it. In other words, applet
    provides a programmer to develop a full-featured multimedia application.


    # 13.2 APPLET FUNDAMENTALS


    An applet is a small program embedded within the web page which is used to create
    a dynamic and interactive application. Applets provide interactive features to
    a web page which cannot be provided by HTML only. For example, applets enable
    capturing user inputs in the form of mouse clicks, text entry, checkbox selection,
    and generating response to the user''s actions.


    Each applet that is created must be a subclass of the Applet class, contained
    within the java.applet package. This class contains methods which govern the life
    and behaviour of the applets. In addition, applets use various methods of the
    Graphics class contained inside the java.awt package. The Graphics class is responsible
    for all the operations related to display (output) of an applet. The Java programs
    can be executed either through an appletviewer (a tool of Java Development Kit)
    or any Java-compatible web browser.'
  merge: -1
  pgno: 244
