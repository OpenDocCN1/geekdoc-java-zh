    components such as windows, dialog boxes, menus, list, buttons, checkboxes, textfields,
    scrollbars, etc. |

    | java.applet | This package includes classes to create applets that can be embedded
    in a webpage. java.util | This package includes language utility classes such
    as time, date, random number, hash tables, vectors, enumeration, etc. |

    | java.sql | This package contains classes for accessing database using standard
    SQL. |


    Each Java API package is organized in a hierarchical form. For example, consider
    a say java.lang. The java.lang package containing various classes is organized
    in hierarchical form as shown in Figure 9.1.


