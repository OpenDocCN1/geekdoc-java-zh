    #  18.10.1 Session Beans


    Session beans are the Enterprise that have direct communication with the clients.
    They are designed to represent the business processes or tasks for a client. An
    example of business process may be making reservation at a hotel, billing a credit
    card, banking transactions, etc. Session beans may use other beans; session beans
    or entity beans to perform a task or access the database directly.


    Note that some of the business processes can be performed in a single method request
    like credit verification. On the other hand, other business processes may require
    multiple methods invocation like online e-commerce Web site. Depending on the
    method of request made by a process, there are two types of session bean, which
    are as follows:


    +   - Stateless: Stateless session beans are the beans that are designed to serve
    the processes that span multiple methods requests. These beans are transient and
    are not required to maintain business state between method invocations.

    - Stateful: Stateful session beans are the beans that serve the processes that
    a single method request. These are required to maintain business state between
    method invocations, held in memory.


    The lifetime of a session bean is relatively short. It is dependent on the client''s
    session; roughly; it is equivalent to the session of the client. The duration
    of the session is as long as a browser or a Java applet is running or a bean is
    using another bean.


    Every session bean class must implement the SessionBean interface. The container
    uses the methods of this interface to notify the instances of enterprise Bean
    of the instance''s life cycle events.


