    it to the specified port number at the specified IP address |

    | Socket(String host, int portnumber) | creates a socket and connects it to the
    specified port number on the named host |


    The Socket class defines various methods; two of which are getInputStream() and
    getOutputStream(). These methods return the InputStream and OutputStream object
    respectively associated with a socket. These streams are used in the same way
    as I/O streams to receive and send data.


    # 20.6.1 Simple Server Program


    The following steps are involved in creating a server program.


    +   1. **Open the socket**: To open a socket, one of the constructors of class
    ServerSocket given in Table 20.7 can be used.

    2. **Wait for the client request**: The server socket waits until a connection
    request is made by some client and returns an actual Socket object representing
    that connection. It is accomplished by the accept() method of the ServerSocket
    class. The accept method is a blocking call that waits until a client tries to
    connect to it. When a connection is made, it returns the Socket object.'
