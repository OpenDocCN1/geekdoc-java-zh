  md: '# 26 Programming with Java


    # String Constants


    **String constants** refer to a sequence of any number of characters enclosed
    in the double quotes """. The characters can be alphabets, digits, special characters
    and blank spaces. The examples of string constants are "hello java", "2009", "...?",
    "6+9", "y", etc.


    # Boolean Constants


    Boolean constants can represent only two values, **true** and **false**. In Java,
    there is no numerical representation for these values, **true** is not equal to
    1 and **false** is not equal to 0.


    # 3.3.4 Operators


    **Operators** are the symbols which perform operations (such as addition, subtraction,
    multiplication etc.) on various data items to produce a result. These data items
    on which operators act are known as **operands**. For example, in **a\*b**, **a**
    and **b** are operands and **\*** is an operator.


    # 3.3.5 Punctuators


    Punctuators, also known as **separators**, are the symbols that define the structure
    of a program by dividing and aggregating a set of codes. The various punctuators
    are defined by braces ''{}'', brackets ''[]'', colon '':'', comma '','', period
    ''.'', semicolon '';'' and parentheses ''()''.


    # 3.4 STRUCTURE OF A JAVA PROGRAM


    The Java program structure is divided into various sections, namely *documentation
    section, package statement, import statements, interface statements, class definitions*
    and *main method class* (see Figure 3.1).


    | Documentation section |

    | Package statement |

    | Import statements |

    | Interface statements |

    | Class definitions |

    | Main method class |


    **Figure 3.1** Java Program Structure


    +   * **Documentation section**: Comments are vital elements of a program that
    are used to increase its readability and describe its functionality. They may
    also include information like program name and the author of the program.


    +   * **Package statement**: It is the first statement in Java program that tells
    the compiler all the classes defined in the file belong to this package. For example,
    consider this statement.

    `package employee;`


    Here, **employee** is the name of the package. It is not necessary that our classes
    are part of package, so this statement is optional.'
