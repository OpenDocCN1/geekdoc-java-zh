  md: '# # CHAPTER 6 ARRAYS, STRINGS AND VECTORS


    # ## CHAPTER OBJECTIVES


    +   After reading this chapter, you will be able to:

    - Declare, initialize and manipulate single-dimensional as well as multi-dimensional
    arrays

    - Explain the use of String and StringBuffer classes for handling strings in Java

    - Understand the significance of vectors

    - Explain the concept of wrapper classes


    # ### 6.1 INTRODUCTION


    Handling real world data requires a mechanism that deals with a collection of
    data items. In Java, different data types like arrays, strings and vectors are
    offered to handle such collections. These data types are capable of grouping related
    data items together into a single unit. Arrays hold together few or thousands
    of data items of similar data types under a single name, strings are used to represent
    a collection of characters, and vectors provide a way to keep items of any data
    types in number together into a single entity.


    The main objective of this chapter is to make you familiar with the basic concepts
    of arrays, strings and vectors. The concept of wrapper classes is also discussed
    in this chapter.


    # ### 6.2 ARRAYS


    As discussed in Chapter 4, Java uses variables of different primitive types to
    store data. However, these variables are incapable of holding more than one value
    at a time. For example, a single variable cannot be used for storing the marks
    of all the students in a class. For such purposes, Java provides a different kind
    of data type known as arrays.


    Arrays are defined as a fixed size sequence of same type of elements. These elements
    can be of any primitive or non-primitive type. The elements of an array are stored
    in contiguous memory locations and each individual element can be accessed using
    one or more indices or subscripts. A subscript or an index is a positive integer
    value, which indicates the position of an element in an array. Arrays are used
    when a programmer wants to store multiple data items of same type into a single
    list and also wants to access and manipulate individual elements of the list.
    Arrays can be either single-dimensional or multi-dimensional depending upon the
    number of subscripts used.'
