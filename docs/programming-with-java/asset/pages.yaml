    #  10.1 INTRODUCTION


    The main concern of programmers while developing any program is to write an error-free
    code. The presence of single error in the program may result in many undesirable
    situations like unintended results, an abrupt termination of program may occur
    or in the extreme case the system may crash. To avoid these unwanted occurrences,
    the errors in the program code must be detected and handled in a proper manner
    so that the program produces the expected output.


    However, when a program is written for the first time, it usually contains errors.
    These errors are classified into two types, namely, compile-time errors and run-time
    errors. The compile errors occur due to syntactical errors, like missing semicolons,
    missing brackets, missspell keywords, use of undeclared variables and so on. Errors
    can be detected and recovered by exhaustive testing and debugging. Unlike compile-time
    errors, run-time errors are difficult to detect and trap. They may occur due to
    problems in arithmetic calculations like dividing by zero, trying to access an
    out-of-bound array element, converting invalid string to a number and so on. These
    runtime errors are usually referred to as exceptions.


    #  10.2 EXCEPTIONS


    The term exception is an abbreviation for the phrase “exceptional event”. It is
    an unpredictable event that occurs while the program is executing and disrupts
    the normal flow of the program or terminates the program abnormally. The errors
    that cause exception can range from simple programming errors such as opening
    or reading an invalid file or accessing an invalid index of array to errors such
    as running out of memory.


    When an error occurs within a method, Java runtime system creates an exception
    object. The exception object contains information about the exception which includes
    its type and the state'
