    # ## 16.9.5 Grid Bag Layout


    The grid bag layout manager is the most advanced and yet easy to use layout manager.
    A GridLayout arranges the component in a grid of rows and columns. It allows differently
    sized components to span multiple rows or columns. Also, each row in the grid
    can have different number of columns. GridBag layout specifies a grid of cells
    with the container, determines the component''s size and positions each component
    in one or more cells accordingly.


    The grid bag layout manager can be created using the following constructor.

    GridBagLayout ()


    Information such as, size and location of each component in a grid bag is determined
    by a set of constraints in an object of type GridBagConstraints. The variables
    in the class GridBagConstraints represent these constraints are are given:


    +   **gridx and gridy**: gridx and gridy specify the x and y coordinates to position
    the component. gridx and gridy represent the number of cells at the left of the
    component and the number of cells at the top of the component, respectively. By
    default, the value of both gridx and gridy is relative. It places the component
    at position next to the one added last in a row or column.


    +   **gridwidth and gridheight**: gridwidth and gridheight specify the number
    of columns and rows, respectively occupied by the component. The default value
    for both gridwidth and gridheight is 1. The value REMAINDER can be assigned to
    gridwidth and gridheight to indicate that the component should be the last one
    in a row or column. If we want the component to be the next to last one in a row
    or column, the value RELATIVE is used.


    +   **fill**: fill specifies how the component should expand within its display
    area if is larger than the component. Any one of the following values can be assigned
    to fill.'
