  md: '# vi Preface


    Chapter 6 familiarises the student with the basic concepts of arrays, strings
    and vectors. It also discusses the concept of wrapper classes.


    Chapter 7 focuses on the use of inheritance to create reusable classes. This chapter
    discusses how polymorphism can be achieved.


    Chapter 8 provides an overview of interface, which is a convenient alternative
    to implement multiple inheritance.


    Chapter 9 explains the concept of package and its advantages. It also discusses
    various API packages and how they can be used in our program.


    Chapter 10 gives an overview of exception that can occur in a program. It describes
    techniques to deal with compile time as well as run time errors.


    Chapter 11 describes the concept of multithreading and how it can be implemented
    in Java.


    Chapter 12 presents Java''s input-output classes, showing how to read and write
    stream and files.


    Chapter 13 explains the creation and use of applets in applications. It also discusses
    the significance of graphics class in applets.


    Chapter 14 describes the role of events in applet programming and how they can
    be handled.


    Chapter 15 presents an overview of AWT component and shows how to place them in
    container and how the events they generate.


    Chapter 16 explains how Swing, a part of Java Federation Classes (JFC), the next
    generation GUI toolkit, can be used to develop large-scale enterprise applications
    in Java.


    Chapter 17 provides an overview of Java Database Connectivity (JDBC) that can
    accessa database in Java.


    Chapter 18 explains how reusable software components can be developed using the
    Java Beans technology.


    Chapter 19 explains how Servlets can be created in Java, which are loaded and
    executed by web server.


    Chapter 20 explains how Java supports creation of sockets and exchange information
    using different protocols.


    # Acknowledgements


    In all efforts towards making this book a reality, my special thanks goes to my
