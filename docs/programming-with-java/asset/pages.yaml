  md: '# 410 Programming with Java


    # # SUMMARY


    +   - Servlets are small programs written in Java, which are loaded and executed
    by web server as applets are loaded and executed by web browser.


    +   - Various advantages of servlets over other server side technologies are persistence,
    portability, server independent, protocol independent, extensible, secure, fast,
    etc.


    +   - The life cycle of an servlet comprises three methods, namely, `init()`,
    `service()` method and `destroy()`.


    +   - The Servlet API is not included in the core Java framework and is Standard
    Java Extension API. It comprises two packages `javax.servlet` and `javax.servlet.http`
    which contains classes and interfaces that are used to create servlets.


    +   - Servlets are created by extending one of the two classes: `javax.servlet.GenericServlet`
    or `javax.servlet.http.HttpServlet`. Both the classes implement Servlet interface.


    +   - The `GenericServlet` class is the commonly used class for developing servlets
    which are protocol Independent.


    +   - The `doGet()` method is invoked by server `service()` method to handle a
    HTTP GET request.


    +   - The `doPost()` method is invoked by server `service()` method to handle
    HTTP POST request.


    +   - The servlet manages the session using `HttpSession` interface. Using this
    interface, a session can be created between an client and an HTTP server


    +   - Java server pages (JSP) technology allows developers to quickly create and
    maintain information-rich dynamic HTML page over the server side.


