    We will discuss some of the important components later in this chapter.


    # 16.4.2 Swing Containers


    There are two types of containers namely, top-level containers and lightweight
    containers.


    # Top-Level Containers


    A top-level container, as the name suggests, lies at the top of the container
    hierarchy. The top-level containers are JFrame, JApplet, and JDialog. These containers
    do not inherit JComponent but inherit the AWT classes'' Component and Container.
    These containers are heavyweight components. The most commonly used are JFrame
    and JApplet.


    Each container defines a set of panes. JRootPane is a special container which
    contains a fixed set of panes, namely, glass pane, content pane, and layered pane.


    +   - **Glass pane**: A glass pane is a top-level pane which covers all other.
    By default, it is a transparent instance of JPanel. It is used to handle the mouse
    events affecting the entire container.

    - **Layered pane**: A layered pane is an instance of JLayeredPane class. It holds
    a container called the content pane and an optional menu bar.

    - **Content pane**: A content pane is a pane which is used to hold the components.
    All the visual components like buttons, labels are added to content pane. By default,
    it is an opaque instance of JPanel class. The content pane is accessed via getContent()
    method of JApplet and JFrame classes.


    > Note: In AWT, the components are directly added to the applet or frame window;
    however, in Swing, they are required to be added to the content pane.


    # Lightweight Containers


    Lightweight containers lie next to the top-level containers in the container hierarchy.
    They inherit JComponent. One of the examples of lightweight container is JPanel.
