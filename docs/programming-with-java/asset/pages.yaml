    #  15.4 AWT LAYOUT MANAGERS


    As discussed, AWT container is an instance of Container class which holds various
    components and other containers. Components are first created, and added to a
    container. Each container object in Java has a default layout manager which determines
    the dimension and axis positioning of these components within a container. For
    example, window is a container that may contain components such as buttons, labels,
    text fields, etc. When the components are added to the window, the layout manager
    in effect will determine the size and placement of these components inside the
    window. The java.awt package provides various predefined layout managers each
    of which implements LayoutManager interface. These layout managers differ in the
    manner they arrange various components within a component. The general format
    to set a specific type of layout manager is:


    ```

    void setLayout(Layout lm)

    ```


    where,

    1m is a reference to the desired layout manager


    If setLayout() method is not invoked, then the default layout manager is invoked
    automatically.

    Java AWT provides different layout managers, each of which implements its own
    layout policy. Some of the commonly used layout managers are discussed here.


    # FlowLayout


    FlowLayout is the simplest of all the layout managers. It positions the components
    from left to right, that is, in horizontal rows. Once a row gets completely filled
    with components the remaining components are placed in the next row. It is the
    default layout manager for Applet and Panel. Each component is evenly'
  merge: -1
