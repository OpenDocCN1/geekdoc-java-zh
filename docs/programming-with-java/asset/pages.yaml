    # 3.8.2 Increment and Decre Operators


    Java provides two unary arithmetic operators, namely the increment operator (represented
    by ++) and the decrement operator (represented by --). The operator ++ increases
    the value of operand by 1 and the operator -- decreases the value of operand by
    1.


    The increment and decrement operators can be used in two forms.


    +   - **Prefix form**: In this form, the increment or the decrement operator precedes
    its operand. The prefix increment operator is represented as ++operand and the
    prefix decrement operator is represented as --operand. The prefix increment or
    the prefix decrement operator increments or decreases the value of an operand
    before its value is used in expression.


    To understand prefix operators, consider this example.


    # Example 3.4 Evaluate these statements


    ```

    x=10;

    y=++x;

    z--;

    ```


    In this example, the statement y=++x first increments the value of x by 1 and
    assigns the incremented value to y. Similarly, the decrement operator is used
    to decrement the value of x by 1 and then assign the decrement value to z. The
    value of y and z are 10 and 11, respectively.


    +   - **Postfix form**: In this form, the increment or the decrement operator
    succeeds its operand. The postfix increment operator is represented as operand++,
    and the postfix decrement operator is represented as operand--. The postfix increment
    or the decrement operator increments or decreases the value of an operand, respectively
    after using it in the expression.


    To understand postfix operators, consider this example.


    # Example 3.5 Evaluate these statements


    ```

    x=10;

    y=++x;

    z--;

    ```


    In this example, the statement y=++x first assigns the value of x to y and increments
    the value of x by 1. Similarly, the statement x=x-- assigns the value of x to
    z and decrements the value of x by 1. Thus, the value of y and z are 10 and 11,
    respectively.


