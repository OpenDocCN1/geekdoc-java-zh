    # CHAPTER 5


    # Migrating the Code


    # Introduction


    Backward compatibility! You have heard of this feature of Java for years. Haven''t
    you? This feature gives you the facility to compile and execute in higher versions
    of Java which were written in earlier versions. Of course, every time you do so,
    you need to provide a flag source to the compiler.


    e.g. if you wish to compile the code in Java5 of Java6, you need to add source
    -1.5 to the compiler.


    This instruction is important because there might be changes in the API in the
    higher version. There might be new features or a few features might not be longer
    in the higher version. So, we need to tell the compiler that we will overlook
    these changes for the current compilation. Code written in older version is termed
    as legacy code. Now, that legacy code compiles fine, sometimes it might run at
    runtime, if it is executed on a higher version by a client. So, many times the
    legacy code is recompiled on a new version which is termed as Migration of Code
    process. This was as simple as using the commands of javac and java for the current
    version.'
