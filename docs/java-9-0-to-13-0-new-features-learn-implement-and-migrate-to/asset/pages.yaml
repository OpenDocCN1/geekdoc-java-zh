    JEP 333: scalable low-latency garbage collector (experimental)


    Today, when we talk about enterprise applications, the application which is supposed
    to serve thousands of users at the same time. While serving these clients, performance
    is said to be one of the major concerns as the memory footprint required for such
    an application is huge. For such applications, the memory management by garbage
    collection may impact the performance because of the cycles it follows. Sometimes
    GCs need to be paused for such cycles, which affect the response. To resolve this
    we need a modified GC which is concurrent in its process without a long GC pause.


    GC is concurrent in working and has the concept of generation. It only limits
    itself to root scanning because of which the GC pause time is considerably reduced.
    GC implementation gives the advantages over traditional GCs:


    Limiting the pause time for GC. (Should not be more than 10ms).


    Can handle heaps of smaller size to very large size


    Use of coloured pointer and load barriers for optimization


    ZGC introduces various interesting concepts as a life cycle. Let''s discuss them
    one by one.


    Pointer colouring


    As the name indicates, the pointer represents of bits in virtual memory. Instead
    of using all the bits, we can use some of the bits to represent the properties
    of the pointer. This concept is termed pointer colouring.


    This information can be used by load barrier to check if any action needs to be
    taken before Java thread to that pointer. Normally, 4 bits are used to store the
    pointer states, also called metadata bits, which as follows:


    Finalize: Used, if the only possibility of reachability is through finalizer by
    the object.


    Remap: This points to current address of object.'
