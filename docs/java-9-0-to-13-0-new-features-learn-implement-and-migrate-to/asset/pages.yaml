    JEP 328: Flight recorder


    When the application is in the running mode, there is a lot of internal processes
    going on. The time and resource required for these processes depends on many other
    utilities. It becomes extremely important to analyse these processes to identify
    the root of performance failure. A lot of tools have been introduced to do such
    analysis. Java Flight Recorder (JFR) is a tool which is used for collecting the
    data related to diagnostic and profiling the performance of application.


    Unlike other tools, this is an integral part of JVM, which does not cause any
    considerable overhead as far as the performance of an application is concerned.
    JFR can be used for profiling, black box analysis, and debugging. JFR primarily
    collects the data which is generated via events. These events can be JVM events
    or application events.


    JFR is disabled by default. This can be enabled with -XX+FlightRecorderAttribute
    with Java command. Please note being that a commercial feature, JFR is only available
    in the commercial version of Java.'
