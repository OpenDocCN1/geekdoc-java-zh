    mapping to store the object. Note that this JEP does not recommend sharing the
    non-volatile regions of multiple JVMs which are running in parallel. Along with
    this option, there are more flags like Xmx,XX which communicate with heap will
    work earlier. As the application data will be stored in file format, the following
    security considerations must be implemented:


    File should have proper permission, as to restrict others access to access it.


    File will be removed when the application is not in use.


