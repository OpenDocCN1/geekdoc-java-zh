  md: '# CHAPTER 4


    Dive in JDK 11


    Introduction


    We observed that JDK10 did not provide major changes as far as development was
    concerned. Of course, Oracle claimed that in every release there will be drastic
    changes in API. But Oracle, assured that they were releasing the new version every
    6 months as per the new policy of time-based release model. With this model, JDK11
    was released on 25th September 2018.


    Similar to JDK10, this version also lacks major changes in the API which will
    help developers write better, scalable applications. But there are a lot of changes
    in JVM which will improve the performance of application. Many unused or deprecated
    features which were present in JDK9 have been removed because of which the size
    of runtime has also been reduced drastically, which improves the performance of
    the application.


    # Structure


    +   - Nest-based access control


    +   - Dynamic class-file constants


    +   - Improve Aarch64 intrinsic


    +   - Epsilon: no-op garbage collector


    +   - Remove the Java EE and CORBA modules


    +   - HTTP client (standard)


    +   - Local-variable syntax for Lambda parameters


    +   - Key agreement with Curve25519 and Curve 448


    +   - Unicode 10


    +   - Flight recorder


    +   - ChaCha20 and Poly1305 cryptographic algorithms


    +   - Launch single-file source-code programs


    +   - Transport Layer Security (TLS) 1.3


    +   - ZGC: a scalable low-latency garbage collector (experimental)


    +   - Deprecate the Nashorn JavaScript Engine


    +   - Deprecate the Pack200 tools and API


    # Objective


    In this chapter we are going to explore the various new features introduced in
    JDK 11. There are many features, at both the API level and the architecture level.
    We are going to discuss all these features which will give additional flexibility
    to the developers with their applications.


