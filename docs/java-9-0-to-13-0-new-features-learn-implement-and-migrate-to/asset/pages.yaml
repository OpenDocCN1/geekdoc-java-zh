  md: "In this class, the information of inner class is added with the attribute NestHost\
    \ . NestHests and NestMembers are nests or nestmates, instead of the being generation,\
    \ and the classes are linked by these attributes.\n\nTo work with these attributes,\
    \ JDK11 added some new methods in java.lang.Class , which are as follows:\n\n\
    ```\npublic class getNestHost()\n```\n\nReturns the nested host or the outer class\
    \ in which the current class is nested.\n\n```\npublic[] getNestMembers()\n```\n\
    \nReturns an array of all the nested classes in the current class.\n\n```\npublic\
    \ Boolean isNestMemberOf(Class c)\n```\n\nChecks if the given class is the nest\
    \ of the other class or not.\n\nChange in the reflexive access\n\nOne of the important\
    \ concepts in all the Java versions is the reflection, which is used to access\
    \ the information of the class. Now, if we want to access the fields by using\
    \ reflection, we need to first find out the class name and then access the data\
    \ members. Unfortunately, the private access used along reflection is implicitly\
    \ denied in pre-Java11 versions. Such efforts throw IllegalAccessError at the\
    \ time of invocation.\n\nAlso, MethodHandle API restricts the direct lookup for\
    \ a private method present in the outer class.\n\nJDK11 now comes up with the\
    \ solution for these scenarios. Let us understand this by one example:\n\n```\n\
    import java.lang.reflect.*;\n\npublic class A {\n    private static int x = 5;\n\
    \n    public static class B {\n        public static void access() throws Exception\
    \ {\n            Field x = A.class.getDeclaredField(\"x\");\n            x.set(null,\
    \ 10);\n        }\n    }\n\n    public static void main(String[] args) throws\
    \ Exception {\n        B.access();\n        System.out.println(A.x);\n    }\n\
    }\n```\n\nIf you compile and execute class A with pre-JDK11 compiler, you would\
    \ end up with the following exception:"
