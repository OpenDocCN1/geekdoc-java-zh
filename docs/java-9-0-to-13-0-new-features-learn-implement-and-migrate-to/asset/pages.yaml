    The data emitted from the source is pushed to the subscriber in reactive programming
    and not pulled from the source as done in imperative programming paradigm. Yes,
    you read it! The data is pushed to the subscriber and not pulled. The subscriber
    will not receive the data from the source after sending the request. In pulled-based
    system, the source of the data waits for the request to push the data to the subscriber
    in contrast to the pushed-based system. Keep this in mind to avoid confusion.


