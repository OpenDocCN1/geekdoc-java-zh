  md: '# JEP 329: ChaCha20 and Poly1305 cryptographic algorithms


    Cryptography is one important requirement of security in any programming language.
    It is essentially a protocol that secures the reading of private message by third
    party. Crypt uses the techniques of encryption and decryption for achieving this
    security. Various algorithms were introduced to create cryptography--termed as
    cipher. For years Java was using RC4 (Rivest Cipher 4) as a stream cipher. After
    continuous research over algorithm, RC4 was found to be insecure or suspicious
    in the following aspects:


    Biased output


    Non-random keystream generation


    Correlation between keystream and key


    Combinatorial problem


    Many browsers have taken effective action to take out support for this algorithm
    like:


    Chrome48 and Chromium have disabled it.


    Deprecated in Firefox 36.


    Removal in Firefox 44.


    No support in Microsoft Edge and Internet Explorer.


    Opera 12 had taken off support completely.


    This created the need for identifying new algorithm for cryptography. Cha20-Poly1305
    implementation was found to be more secure in all these cases. This was also adopted
    across TLS implementations and many more protocols for cryptography. Chacha20
    cipher is a high speed cipher compared to AES. In fact, it is observed that it
    is fast as on platforms which lack AES-specific hardware. It is also secure against
    timing attacks. The Poly1305 algorithm is used as an authenticator. It is a high-speed
    message authentication code. This algorithm takes a key which is a one-time generated
    with message and after processing, converting it into a 16-byte tag. When we want
    to authenticate the message, this tag is used as an authenticator.


    The combination of these two, which is CHACHA20-POLY1305, is termed as authenticated
    encryption, and is recommended to be used in this JEP. In this approach, the Poly1305
    key is used using cha20 algorithm.


