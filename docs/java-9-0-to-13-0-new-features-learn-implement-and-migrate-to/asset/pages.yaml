    ```\n\nFigure 4.5: Reflective access: implicitly enabled in JDK11\n\nAs you can\
    \ observe from the above figure, reflective access is implicitly enabled in JDK\
    \ 11.\n\nJEP 309: Dynamic class-file contents\n\nTo understand what a dynamic\
    \ class-file constant is, let us first understand its earlier concept of constant\
    \ pool. A program obviously consists of a lot of constants and methods. In general,\
    \ what you know when you compile your java program it is converted to .class file,\
    \ and after that the class loader loads all the required features for your generated\
    \ class. Of course, there is no second thought on this. But there is one more\
    \ interesting concept in the entire process which is termed as constant pool.\
    \ As the names indicate, it contains the constants needed to run that code.\n\n\
    The constant data, which is required by the class file, is stored in this pool\
    \ and byte code i.e. class, will have the reference to this pool.\n\nThe following\
    \ type of data is part of this constant pool:\n\nString and numeric literals\n\
    \nReferences of the class\n\nReferences of the fields\n\nReferences of the methods\n\
    \nTo understand this concept, let us consider the following simple Java code:\n\
    \n```\npublic class Sample{\n\npublic static void main(String[] args){\n\nSystem.out.println(\"\
    Constant Pool Demo\");\n\n}\n}\n```\n\nThis is a simple Java code to print Constant\
    \ Pool Demo. Compile this file to generate Sample.class file. And then use javap\
    \ tool to disassemble this class as:\n\n```\njavap -v Sample.class\n```"
