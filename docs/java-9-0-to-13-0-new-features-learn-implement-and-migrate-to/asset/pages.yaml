  md: '# Improved performance


    The concept of modular programming can be effective in improving the performance.
    Modular programming boosts the runtime to access resources which are required
    and permitted. This is also true in the case of deployment.


    # Module types


    JDK 9.0 supports different types of modules, including the API modules, as follows:


    Java SE and JDK modules


    Such types of modules are provided by JDK. These modules are developed by developers
    so that their services for application development can be used. E.g. java.base,
    java.xml, etc. These modules export different packages which are utilized by developers.


    # Named modules


    The modules which are created by developers are called as application modules.
    The configuration of such modules is done in module-info.java file. Through this,
    the modules declare their dependencies and also the resources that are permitted
    to be exported to other modules.


    # Automatic modules


    Sometimes, the application uses the JAR file, which can be added to the module-path.
    The name of such modules are identified from automatic module name MANIFEST.MF
    or the filename of the JAR. Normally, such modules are used to initiate the migration
    to modularity.


    # Unnamed modules


    These are the modules which are identified through all the jars and classes on
    the classpath. They can read all the modules.


    # Listing JDK modules


    JDK 9.0 has not only facilitated to create custom modules, but it also divided
    the entire JDK into modules to support various configurations.


    The modified Java API structure implements the following principles:


    Default/standard modules, which starts with java. Such modules are governed by
    JCP.


    JDKs in-built modules starts with jdk:


    The keyword exports denotes the permissions for using the packages from current
    packages to other module resources.


    The entire structure, and relationships between different modules of JPMS are
    quite lengthy and complicated to understand at this point of time. This can be
    visualized by Java module graph.


    Java module graph


    Java module graph is a graphical representation of different modules and their
    relationships. Figure 2.1 shows the sample module graph. Earlier, Java had a base
    package named java.lang. The structure has now drastically changed with the base
    module called java.base , where all the basic services of Java have been grouped
    together in the form of different packages.


    The base module is basic for providing services to other modules. So obviously,
    there is no dependencies for this module.


    One of the most important point to note is, this a default module, which is available
    to all the modules created by the developer. So, the developer will get all the
    services by default without using requires keyword to configure module dependency.


    Following are the packages which are part of java.base :


    java.lang


    java.lang.invoke


    java.lang.module


    java.lang.reflect'
