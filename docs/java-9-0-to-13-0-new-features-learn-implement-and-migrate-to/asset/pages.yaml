    JEP 336: deprecate the Pack200 tools and API


    Pack200 is a Java API class which is used to compress the jar file. It was introduced
    in JDK5.0, through JSR 200. The main use of creating such package is to decrease
    the space requirement of Java application installer, which will make them efficient
    in transmitting and deploying the application.


    pack200 command is used to convert the JAR file into compressed pack200 file.
    Java uses GZIP compressor for this reason. This utility is available in java.util.jar
    package in earlier versions.


    Following is the syntax for: pack200 [-options1=value1, option2=-value2, ...]
    x.pack[.gz] file jar


    Where:


    x.pack[.gz]: Name of the output file.


    file.jar: Name of the input file.


    e.g.:


    pack200 MyApp.pack.gz MyApp.jar


    From DK9 onwards pack200 is integral part of jdk.pack module. From JDK11 onwards
    flag forRemoval=true is added which suggests that this will be removed in the
    coming versions. The following three types are recommended to forRemoval=true
    flag.


    java.util.jar.Pack200'
