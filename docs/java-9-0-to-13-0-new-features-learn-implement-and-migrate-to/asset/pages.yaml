    Feedback in JShell


    Feedback in JShell is used to customize the information which can be displayed
    in the JShell console. Depending on the details expected for commands and snippet
    execution, user can take a call which feedback model is used. There are in-built
    JShell model or customized feedback models.


    Following are the different modes of feedback which are available with JShell:


    Verbose


    This mode displays the information of the snippet in the format of name==value
    along with the description. This mode is also used for different declarations
    for methods, classes, ensues etc. If this mode is used with commands, it displays
    the status of success if command is successfully executed.


    Normal


    This is a default feedback mode unless specified by the user. This mode displays
    the information in the formation of name==value pair. There is no description
    associated with this mode. Similar to verbose, this can be used for declaration
    and commands as well. The command gives feedback which indicates the success of
    execution.


    Concise


    This mode displays the feedback in the format of name==value , but only if we
    are using it with expressions. This is a typical mode which cannot be used with
    declaration, command etc.


    Silent


    The Silent mode is silent in all the scenarios. It doesn''t give you any feedback
    if used with declarations, expressions, command etc.


    Setting up the feedback:


    The feedback can be set up by using /set feedback command. By default, the feedback
    mode is normal as discussed earlier.


    For example, if want to set up the feedback verbose you can use the command:


    ```

    /set feedback verbose

    ```


    Now, let us observe the different modes of feedback and their working in the below
    snippet:


    Verbose feedback


    Verbose feedback can also be generated by giving -v option while starting the
    JShell editor. The following figure shows the generated feedback because of the
    verbose mode. Verbose gives the feedback with name, value and description.'
