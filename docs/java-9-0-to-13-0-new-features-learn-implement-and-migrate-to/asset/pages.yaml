    socket programming API which was present in earlier versions was much complicated
    to the developer. This JEP recommends making the implementations of java.net.Socket
    and java.net.ServerSocket API. These entire updates are part of Project Loom.
    Loom focuses on incubating the JVM features and the APIs which are built on top
    of them. To create light-weight concurrent and easy-to-use programming models,
    it uses the following constructs:


    +   Fibres


    +   Tail-call elimination


    Let us discuss how this JEP simplifies the overall working of the socket programming.
    The entire networking in Java is based on java.net.Socket and java.net.ServerSocket
    API. Along with this, there is another Service Provider, java.net.SocketImpl to
    which all the socket operations are delegated. The delegation of this interface
    is PlainSocketImpl, which also contains supporting SocketInputStream and SocketOutputStream.
    This is now history. The new implementation is NoSocketImpl which is replacement
    for PlainSocketImpl. This is relatively easy to maintain and debug. It communicates
    with the new IO implementation, because of which there is no need for the native
    code. Apart from that it uses locks instead of synchronized methods so that it
    can communicate with the fibres. The old ServerSocket is moved to NoSocketImpl.
    So, the earlier implementation of sockets is now called.


    Of course, this is not a cake piece as the older implementation is present since
    the last decades. So, the older API is not removed, instead the system property
    is set up to use the old API. You can use the property jdk.net.PlainSocketImpl=true
    JDK uses the old implementation There is no change in implementation of DatagramSocketImpl
