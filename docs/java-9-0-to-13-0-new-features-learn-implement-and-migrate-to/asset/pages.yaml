    CHAPTER 1


    Insight of Versioning


    Introduction


    Building an application is always a challenging task. It involves working with
    application programming interface (API), writing business logic and developing
    user interface (UI). Over the years, developers have been using several programming
    languages and frameworks to build various types of applications. Besides, every
    programming language or framework is constantly working on how it can provide
    better services to the developers so that they can create efficient, scalable
    and asynchronous applications. With traditional programming languages, such as
    C, C++, developers have created a plethora of applications. However, Java clearly
    seems to be a better programming language than its counterparts. This is particularly
    because of its write once, run anywhere (WORA) characteristic and other features
    such as, platform independence, portability, and security. Java is arguably the
    most widely-used programming language to develop robust, distributed and secure
    applications in recent days -


    The journey of Java started with the Project Green commissioned by Sun Microsystems.
    And, since, it is continuously updating itself in terms of new APIs periodically
    for the current market scenario.


    Structure


    Different versions of Java


    New versioning: time-based release versioning


    Objective


    After studying this chapter, you should be able to understand the concept of versioning,
    different versions of Java and time-based release versioning process of the Java
    language.


    Project Green: the beginning


    In the 1990s, Sun Microsystems initiated a project to create a programming tool
    using C and C++. Patrick Norton, the head of the project was led by James Gosling
    and Mike Sheridan. In its initial days, the primary aim of this team was not to
    develop a new programming language but to develop electronic devices other than
    computers. The project was designed for developing embedded systems, where languages
    like C were not responsive enough.


    This made Bill Joy, co-founder of Sun Microsystems to think of a new language
    for this project. Working on this idea Gosling started on enhancing C++ and launched
    a complete programming language. Initially named as Oak the tree that was outside
    this office, it was later renamed as Java.


    Developers found Java revolutionary, but that was not the everything. In fact,
    it was the beginning. What followed next was continuous update in the API. Such
    updates were released as part of different version of Java. Though most of the
    other languages took small step for upgrading, java started to kick off the versions
    with a wider scope vision


    Over the years, Java''s API has undergone many structural changes. The package-oriented
    programming approach is reshaped to modular programming from JDK 1.9. This approach
    changed the way of traditional application development.


    The original name given to Java was Oak, it was C++++, which says new features
    added and unwanted features were removed.


    Versions of Java'
