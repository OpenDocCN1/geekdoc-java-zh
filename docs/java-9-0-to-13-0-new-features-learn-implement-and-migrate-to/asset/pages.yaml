  md: '# SQL query string


    SQL query strings are always complicated. They are lengthy in nature and are multiline.
    Traditionally, we can write the SQL query string as:

    String Info = "SELECT customerID, CustomerName FROM `Customer` + +

    "WHERE CITY = ''Mumbai'';"


    This can be replaced with the text block as shown below:

    String info = "SELECT customerID, CustomerName FROM Customer

    WHERE CITY = ''Mumbai'';";


    Polyglot language example

    Often, we need to inject the other programming snippets in Java code. A very recent
    example is the JavaScript function using the Nashorn

    ScriptEngine in Java. Earlier, we could do this with:


    ```

    ScriptEngine engine = new ScriptEngineManager();

    getEngineByName("nashorn");

    engine.eval("function printHello() {\n" + +

    print(\''Hello, world!'');" + +

    }\n" + +

    """ + +

    printHello();");

    ```


    Same is now replaced with text block as:

    ScriptEngine engine=newScriptEngineManager().getByName("nashorn");

    engine.eval("""function printHello() {

    print("Hello, world");

    }

    printHello();");


    You can observe from the examples how text blocks make your code cleaner and readable.
    Also, it is simple, isn''t it?


    It is interesting to know the background processing of text block. When the compiler
    finds the text block in the code, the following processes are

    generated:


    All the line terminators are translated to \u000A.

    If there are any leading or trailing white spaces, then they are removed.


    Even if any escape sequence is found, it is interpreted as it is.


    Text blocks are constant expressions. They are pushed into constant pool as StringInfo.
    It does not give any specific information

    regarding whether entry is generated by normal string literal or text block. During
    execution, the text block is converted to string instance.

    For the processing of text block, the following methods are provided:


    stripIndent(): Removes the white spaces from text block.

    formatted(Object... args): Simplifies the value substitution in the given text
    block.


    # Conclusion


    During this chapter we studied what are the features introduced in Java 13. There
    are no major changes in the API or concept, Java 13 is

    ill of the important steps in the cycle of Java releases. In this version, the
    major areas of considerations were improving the

    management by returning the unused memory through ZGC, simplifying the coding
    practices by modifying switch and text block.


    ![](img/593293c1d6794763b235cda6f9ab47ba_164_0.png)'
