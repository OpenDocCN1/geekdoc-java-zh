    Removal of Java Launcher''s data model options -d32 -d64


    Java gives you the option to select the launcher type, according to the operating
    system settings. Different options like -d32 , -d64 , -jdk32 , -jdk64 were present.
    All options were deprecated with the enhancements in the operating system on Java
    was launched. In this version, these options have been completely removed.


    # Deprecated features and options


    Apart from the features of java, this version also carries few features and options,
    as discussed below.


    As the API is changing, the application needs are increasing, modification is
    continuously required in the services defined in Java API. Because of this, many
    methods need to be replaced by new ones, deprecating the earlier methods. For
    such deprecated method, warning methods will be generated by JBM.


