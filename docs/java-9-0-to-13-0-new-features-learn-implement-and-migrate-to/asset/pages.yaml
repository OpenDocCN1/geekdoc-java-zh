    \ args)\n    {\n        System.out.println(\"Hello World from Java!\");\n    }\n\
    }\n```\n\nTo compile and execute this class you require only the following classes:\n\
    \n+   - Hello.class\n- System.class\n- String.class\n\nAnd of course as we are\
    \ talking in terms of module, it requires java.base as it is not dependent on\
    \ any of the other services. This might require a few KBs of memory, but with\
    \ the current approach of JRE runtime image, we need to utilize the huge JRE runtime\
    \ which is a waste of memory. This might be a problematic case when we deploy\
    \ our application on micro-memory machines like IoT devices. Java has with a tool\
    \ called jlink, which creates the small JRE only puts the required references\
    \ or in the bin which will reduce the size of the java runtime considerably.\n\
    \nBut the question is how we identify the required modules for our application,\
