    The following are the three reasons for which this removal is proposed:


    Earlier, when Java applications were downloaded, speed of the download was a concern
    because of the type of modern usages. Also, the monolithic structure of Java has
    increased the size of applications considerably. With time, the speed of downloading
    has improved and there is change in the traditional structure of packaging from
    Java 9. Along with the new structure, Java 9 has introduced Jmod to the runtime,
    so Java is not dependent on Pack200 anymore.


    An applet is considered to be one of the most utilizations of Pack200 to compress
    the applications. The browsers would have the plug-in to uncompress such archives.
    But now days, applet applications are not used and most of the browsers have taken
    out the support for such plug-ins. This is one of the important reasons for consideration
    of removal of Pack200, as one of the important components used Pack200 is no more
    in.


    The use of Pack200 is not matching the modularization of Java9. Also, it is very
    complex which follows the class file format, so maintenance could be overhead
    for Java.


