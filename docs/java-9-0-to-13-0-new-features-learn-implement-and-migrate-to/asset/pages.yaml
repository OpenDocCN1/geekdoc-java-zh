    # JEP 321: HTTP client (standard)


    The HTTP client implementation had been modified in JDK9 and JDK10. The recent
    modification was implemented by the recommendations in JEP 110. After the new
    HTTP was introduced, a lot of feedback was received for improvement by developers.
    Considering these suggestions, JEP proposed changes in the current HTTP client
    to handle HTTP and web sockets. From JDK11, this implementation was totally asynchronous,
    which was earlier to be blocking.


    The new API is providing non-blocking request and response handling by CompletableFutures
    . The other concepts, like back-pressure and flow-control, has been provided by
    reactive streams through java.util.concurrent.Flow API.


    The changes were observed in the new API:


    The earlier implementations of interfaces BodyPublisher, BodyHandler and BodySubscriber
    were created by using static factory methods. In this version the factory classes
    are used.


    The factory methods which were updated in the following ways:


    fromXxx: Adapters from standard subclass, e.g. takes a Flow.Subscriber returns
    a BodySubscriber


    ofXxx: Factories that create a pre-defined BodyPublisher[Handler][Subscriber]
    that perform useful tasks, such as handling the response body as a String, or
    streaming the body to a file.


    other: Combinators (takes a BodySubscriber returns a BodySubscriber ) and other
    useful operations.


    BodyHandler and BodySubscriber are generally used to handle the body of request,
    response. In this version, some new methods or members were added, such:


    Discard (object replacement) was used to discard/ignore the response body for
    replacement. This sounded confusing and was removed. This was replaced with other
    handlers, like discarding() and replacing().


    ofLines(), returns a BodyHandler>, this supports the streaming of response body
    with stream of lines.


    fromLineSubscriber, facilitates the response body to adapt Flow.String lines.


    BodySubscriber.mapping , used to map the response body from one to another.


    The current API provides push promise, which has now been modified with the removal
    of the MultiSubscriber and MultiResultMap. In addition of functional purpose,
    PushPromiseHandlers were introduced to achieve the scheme.


    SAME_PROTOCOL and SECURE policies were part of HttpClient.Redirect policy was
    simplified by NORMAL. Existing SECURE policy was renamed to NORMAL, as this was
    suitable for normal cases.


    To check whether the message delivery was successful or not, the erinum WebSocket.MessagePart
    was used. This has now been replaced with Boolean data, as this will give more
    specific logic for checking the message delivery.


