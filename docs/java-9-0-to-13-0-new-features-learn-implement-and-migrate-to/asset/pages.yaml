  md: 'The JEP 322 proposes to change the version number in a way that aligns with
    version it will also update the release cycle information in the version string.
    This will make sure that the developers will be able to guess the version release
    in advance.


    $VNUM is a sequence of elements which are separated by period, this complete string
    is termed as the version number. The elements which are defined by zero or any
    other unsigned integer number. The last element is a non-zero integer.


    The first four elements of this string denote:


    $FEATURE.INTERIM.$UPDATE$PATCH


    Following table details of all these elements:


    E.g., if we consider the version string as 10.0.2.1, then $FEATURE is 10, $INTERIM
    is 0, $UPDATE is 2, and $PATCH is 1.


    Note that the version number can start with a zero, because if it is a zero then
    the next elements are omitted.


    Under the six-month release model, the following are the considerations of the
    version string:


    $FEATURE is a major release which is incremented every six months: JDK10 was released
    in March 2018, JDK11 was released in September 2018 and the cycle continues.


    $INTERIM is not considered officially in the six-month release model, so this
    number is always zero.


    $UPDATE is an indication of continuous updates in the current version. This is
    incremented one month after $FEATURE is incremented, and every three months. E.g.,
    if JDK10 is released in April 2018, in April 2018, the updates will be released
    and the version string will be modified to 10.0.1, and in July it will be modified
    as JDK10.0.2.


    Along with the versioning scheme, for time-based versioning, this JEP also modifies
    the API for versioning and system properties.


