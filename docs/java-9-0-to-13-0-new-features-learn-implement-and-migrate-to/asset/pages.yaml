  md: 'Support for private interface method.


    Starting from JSE8.0, when default implementation for interface was introduced,
    private methods were under discussion. From JSE 9.0 onwards, one could declare
    and define the private methods in interface, which enables the non-abstract methods
    in interface to share the data or communicate with them.


    However, you have to go through the following rules while declaring private interface
    method:


    Method cannot be abstract.


    Written only within interface.


    If the method is private & static it can be used inside other method of the interface
    which can be static or non-static.


    If the method is non-static it cannot be used inside private static method.


    JEP 214: remove GC combinations deprecated in JDK 8


