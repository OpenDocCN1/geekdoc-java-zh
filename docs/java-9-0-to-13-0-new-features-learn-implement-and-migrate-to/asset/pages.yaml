    \ current module is utilizing, includes:\n\nThe packages of other modules, from\
    \ which the current module is utilizing the services.\n\nThe packages of current\
    \ modules, which are exposed to other modules.\n\nThe module-info.java is termed\
    \ as module-descriptor or metadata file. The declaration of this file must begin\
    \ with the keyword module. The unique name of the module must be followed by this,\
    \ which is further followed by module embraced in braces as in the above syntax.\n\
    \nNote that from Java 9 onwards, you should not use (.. ) in module name. You\
    \ can follow the structure of traditional package naming in module i.e. you can\
    \ name your module com.ypb.mymodule\n\nThe module declaration normally contains\
    \ different module directives. These directives help to configure the relations\
    \ between other modules. Following are the important directives used to configure\
    \ these relationships:\n\nrequires"
