    # Preface


    From the day of its first release, Java has been one of the most reliable programming
    languages for developers. Initially, it was launched just another object-oriented
    language, in later stages it became more popular because of its capabilities in
    efficient web programming components. Java became one of the first choices for
    the developers to develop and web applications. The team of Java has always been
    in use to update the API of Java, so that it can serve the developers in creating
    software components for complex business needs. Java has launched 13 major versions,
    JDK1 to JDK13. Each version comes with different considerations to cater to different
    needs. Each update for each version is not a simple task. The objective of this
    book is to make the reader familiar with all the changes Java proposed in the
    different versions. The book covers versions from JDK9 to very recent JDK13. The
    book contains examples to show the working of the concepts introduced in different
    versions. Effort has been taken to make that most of the concepts are explained
    with simple examples that everybody can understand the working of the same.


    Chapter 1 talks about the journey of Java. It describes how Java has evolved,
    from its birth to the current version. It gives an overview of all the features
    in new versions from which were introduced in every version.


    Chapter 2 is dedicated to Java9. It mainly focuses on the programming concepts
    of Java9 and how it is better than the traditional approach of package-centric
    application approach.


