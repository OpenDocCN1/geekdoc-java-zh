  md: "Autoboxing is the automatic process where the Java converts the primitive data\
    \ types to the corresponding wrapper object. e.g converting it to Integer, or\
    \ to Double.\n\nRefer the following code snippet:\n\n```\nInteger x = 10;\n```\n\
    \nHere, the primitive value 10 is assigned to its corresponding wrapper object\
    \ Integer.\n\nAutoboxing is exactly the reverse process. In this, the wrapper\
    \ objects are converted to their counterparts' e.g. Integer to int, Double to\
    \ double, or Float to float.\n\nRefer the following code snippet:\n\n```\nInteger\
    \ x = 10;\nint y = x;\n```\n\nHere, the wrapper Integer object which contains\
    \ value as 10 is passed to primitive with the process of autoboxing.\n\nVarargs:\n\
    Java introduced a feature to reduce the number of overloaded method for different\
    \ number of arguments for similar data type. This feature is called as varargs\
    \ and it stands for variable-length argument.\n\nThis method that takes a variable\
    \ number of arguments as shown below:\n\n```\npublic static int addition(int...\
    \ x) {\n    //business logic\n}\n```\n\nThe above snippet declares the method\
    \ add, which takes variable arguments of int data type. This means that a developer\
    \ can call this method by passing any number of integer arguments as:\n\n```\n\
    int a = addition(10,20);\nint b = addition(10,23,12,43);\nint c = addition(12,43,12,43,12);\n\
    ```\n\nStatic imports:\n\nIn some occasions, Java requires importing the public\
    \ static members, which may contain fields or methods from other classes. JSE\
