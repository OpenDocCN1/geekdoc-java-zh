    \ using the following parameters:\n\nLocal lookup object\n\nName of the constant,\
    \ the component, aa String\n\nClass representing the constant type\n\nAny bootstrap\
    \ argument, if remaining,\n\nJEP 315: Improve AArch64 intrinsic\n\nPerformance\
