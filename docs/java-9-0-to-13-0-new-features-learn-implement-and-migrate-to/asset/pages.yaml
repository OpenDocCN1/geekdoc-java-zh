    \ 12, the feature JEP 326 was introduced. It focused on raw string literals, the\
    \ aim of which is to make the complicated or lengthy string declaration simple\
    \ and readable. Text block introduced in Java 13 is the improvement in this feature.\n\
    \nWorking with string is something very common, right from the initial days of\
    \ Java. In fact, it is said to be mostly used type of data because Java invested\
    \ a lot of resources to create the String API for a developer's ease. On many\
    \ occasions, one has to deal with the multi-line string in Java, which requires\
    \ escape sequence to be added to denote the continuation. Such escape sequence\
    \ makes the code complicated and non-readable. With this, now-days with progress\
    \ in technology, Java code permits the insertion of HTML, SQL, or JSON as part\
    \ of a source code. Adding all such things is as complicated as we need to use\
    \ special sequence. So, text block is solution for this, which is alternative\
    \ to escape sequence. Text block is a concept; it no plans to remove the famous\
    \ String API or the operators that works on string.\n\nTypically, text block is\
    \ a group of characters, which is surrounded by delimeters. Text blocks use three\
    \ double-quote characters as a delimiter for the beginning and end of the String.\
