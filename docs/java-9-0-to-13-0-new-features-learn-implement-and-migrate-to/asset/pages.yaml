    Working with commands in JShell


    We have seen till now how to write and test the different code segments in JShell.
    Apart from this, JShell also supports different commands which will help the developer
    in many ways. All the commands are written with leading slash. Following is the
    list of commands and their functionalities.


    /var


    List of all the declared variables.


    /methods


    List of all the declared methods.


    /list


    List of all the entered code snippets, which includes variable, methods and formulae,
    if any.


    /list-start


    List of all the executed snippets before the actual start of JShell.


    /list-all


    List of all the executed snippets before the actual start of JShell along with
    all the declaration done by the developer which includes variables, methods and
    formulae, if any.


    /drop


    Used to drop the source


    e.g. /drop will drop the declaration done for var1 in JShell.


    /edit


    Opens the editor to modify the source.


    e.g. /var1 will open the editor with the value of var1, which can be modified
    and accepted in the editor.


    /env


    Used to view or change the context of JShell window.


    /history


    Lists all the entries done by the developer for the current instance of JShell.


    /exit


    Used to exit the JShell utility.


    /imports


    Lists the imported resources in JShell


    /open'
