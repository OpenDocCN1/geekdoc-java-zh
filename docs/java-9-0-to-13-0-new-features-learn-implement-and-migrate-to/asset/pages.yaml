  md: '# Collection framework:


    A collection is a group of objects embedded in a single unit. Before JDK 1.2,
    developers were using arrays, vectors, or hash tables. These objects were giving
    the services, there were no common interfaces or methods shared between them,
    because of which developers were required to use different methods for accessing
    collections.


    Over time, Java came up with common interface structure in the format of collection
    framework API. This API provides different interfaces like set, list or map. The
    classes implementing these interfaces provided a common set of methods, because
    of which developers could use the services more effectively.


    strictf keyword:


    Working with floating point data type had always been vulnerable, prior to JDK1.2.
    Floating point data was platform dependent, because of which the precision of
    the floating-point data was not guaranteed. The keyword strictf resolved this
    issue which follows the IEEE 754 standards.


    Following were the library changes/updates that implemented in this version:


    Just in Time (JIT) compiler implementation


    Java plug-in


    Swing graphical API


    Version: JSE1.3


    Release date: 8th May, 2000


    This version mainly focuses on the modifications in deployment and improvements
    of applet performance through Java Hotspot Client. The codename for this version
    was Kestrel. Following were the major updates in this version:


    Jar indexing:


    When an application is spread out in JAR files, at runtime it becomes difficult
    to find the required classes. This problem can be further complicated if the project
    size is of a larger value. Java recommended indexing of a JAR file. The entire
    directory information is stored in index.list file, which makes the searching
    of classes simpler.


    Improved applet caching:


    The applet caching is an important plug-in provided by this version, which makes
    sure that each time an applet is requested it not necessarily be communicated
    to the server. The same cache can be used for different web pages for fetching
    the applet. This increased the speed of loading the web page.


    Optional package installation:


    Java runtime searches the file from jdk/bin where rt.jar file is located. There
    is folder structure lib/ext, and jre/lib/ext where the optional packages are present.
    In runtime, Java searches the file in the environment path. If the class is not
    found in the runtime environment, it is searched for optional package installation
    directory.


    Java Naming and Directory Interface (JNDI):


    The Java Naming and Directory Interface (JNDI) is an API that provides naming
    and directory functionality to applications using the Java programming language.
    It is defined to be independent of any specific directory service implementation.
    This variety of directories - new, emerging, and already-ones - can be accessed
    in a common way.


    Version: JSE1.4


    Release date: 6th February, 2002


    This is the first version launched under the recommendations of JCP JSR59. You
    can find more details about this on: https://jcp.org/en/jsr/detail?id=59. The
    codename for this version is Merlin. Public support and security updates for this
    version ended in October 2008. The following major updates were done in this version:


    Language changes:


    Assert keyword:'
