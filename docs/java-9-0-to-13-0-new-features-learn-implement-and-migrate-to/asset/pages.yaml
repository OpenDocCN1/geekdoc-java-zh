  md: 'SE7 introduced a modified API for IO and file operations through java.nio package.
    It also introduced one important class, Path which gives you accessibility to
    any path in the underlying operating system. Apart from traditional File API,
    this API provides different facilities like checking hidden file, creating symbolic
    links, searching files using wildcards etc.


    Improved exception handling:


    Prior to JSE7, we needed multiple catch blocks to handle multiple exceptions generated
    from the same try block as follows:


    ```

    try

    {

    }

    catch(ArithmeticException ae)

    {

    }

    catch(ArrayIndexOutOfBoundsException abe)

    {

    }

    ```


    In JSE7, a single catch block can handle multiple exceptions as follows:


    ```

    try

    {\}

    catch(ArithmeticException | ArrayIndexOutOfBoundsException e)

    {

    }

