  md: 'An assertion gives you the facility to enable developer/tester to test the
    assumptions done in the program. Assertion typically contains a Boolean expression,
    when made by developer is correct then assertion executes. If not true, the system
    will throw an assertion error.


    Library improvements:


    Regular expressions:


    This facility is given by Java to search, edit, or manipulate the text and data.


    Chained exceptions:


    Sometimes Java code catches one exception and throws another. This normally complicates
    the debugging. To overcome this awkward situation for the developer, chained exception
    handling is introduced.


    Java Web Start:


    This software allows a user to download and run the application which is available
    on the web. This gives easy one-click access, guarantees that you are using an
    upgraded application, and avoided complicated installation process.


    Though these are not integral part of a web page like alike, they run in a separate
    frame.


    Java Web Start (JavaWS/javaves/JAWS) is deprecated since JSE9.0 and removed completely
    in JSE11.0.


    XML processing:


    Java introduced API for XML processing or JAXP to validate and parse XML documents.
    In this version, some basic interfaces are introduced. Document Object Model (DOM),
    Simple API for XML (SAX).


    Logging API:


    Logging is one of important features introduced by Java. It maintains the records
    while a program is executed. These records or messages are reviewed by the programmer
    to analyse the data. Logging is generally created by Logger object which is provided
    by Java.


    Preference API:


    This API provides an effective way to store the preference configurations of the
    program. This may include system preference or user preference. Normally data
    will be stored in key/value pair. It gives the get and put method to store and
    access the preference data. This API is not used to store bulk data such as application
    data.


    Version: JSE5.0


    Release date: 30th September, 2004


    This version was undoubtedly one of the most important versions in the life-cycle
    of Java versions. Many new features are added in this version to convert Java
    into writing manner, effective safer programs. Originally named as JDK 1.5, this
    version was later renamed as JSE5.0. The codename for this was Tiger.


    Public support and security updates for this version in November 3, 2009.


    This version is known for one of the most important updates in Java programming
    as a lot of new features were added in this.


    The following major updates were given by this version:


    Language changes:


    Generics:


    Similar to templates in C++, generics in Java is a facility given to developers
    to write the classes, methods, interfaces with type parameters. This is most important
    when one writes the same business implementation with different data types.


    Usage of generics gives developers benefits:


    Type safety


    Elimination of casting'
