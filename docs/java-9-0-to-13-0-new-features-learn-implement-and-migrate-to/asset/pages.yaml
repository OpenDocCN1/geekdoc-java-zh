  md: 'Marked0 and Marked1: These are used to flag the reachable objects.


    # Multimapping


    This is a process, where multiple ranges of virtual memory are mapped to the physical
    memory. The earlier process pointer colouring makes dereferencing a bit expensive
    as we need mask the useful bits to access the address. This is bypassed by ZGC
    with exactly one of the four metadata bits being set. This is handled by the operating
    system.


    # Marking


    This is a process where garbage collection checks which objects are reachable
    and are not. ZGC splits this process into three steps, as follows:


    +   Find the root references for marking.


    +   Traversing the object group to mark the reachable objects.


    +   Handling the weak reference.


    Throughout this process, the ZGC uses marked0 and marked1 metadata bit for marking.


    # Relocation


    When we create a new object, it always allocates a new memory space in heap. This
    process requires scanning of the memory to find the contiguous memory block to
    store the object. This is found out to be expensive. Finding continuous memory
    will always be difficult as free memory block can be scattered between objects.
    Another way around is to relocate the object from the scattered area free so to
    create a more compact memory. This is achieved by creating blocks of memory.


    The following phases are enabled in ZGC relocation:


    Finding the blocks and transferring them to the relocation set. This is a concurrent
    process.


    Stop the world phase, which relocates all the root references in the relocation
    set, and updates the references.


    Relocating all remaining objects and restoring the mapping between old and new
    addresses. This is also a concurrent process.


    # Enabling the ZGC


    By default, all experimental features are disabled by JVM. So ZGC is also disabled.
    It is not present in the build implicitly, unless we specify it. This can be enabled
    at compile-time using option -Djvm-features=zgc.


    Similarly, this is disabled at runtime which needs to be enabled. For ZGC, we
    need to add the option -XX:+UnlockExperimentalOptions


