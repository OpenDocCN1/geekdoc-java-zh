    (val1,val2) -> val1/val2;

    ```


    As you can see, the local variables are implicitly typed. The question is why
    then the modification in the existing approach in JDK11? Well, one of the important
    reasons of this modification is the use of modifier like @Nonnull. This modifier
    cannot be used if the type is not defined.


    So, now you can use this modifier as follows:


    ```

    (@Nonnull val1, @Nullable val2)->val1/val2;

