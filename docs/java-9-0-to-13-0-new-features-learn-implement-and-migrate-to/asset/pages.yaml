  md: '# Compact profiles


    Though Project Jigsaw was an attempt towards creating modular application or converting
    centric Java to modular JDK, this was not the first or only. J 8.0 had already
    proposed one solution called "compact profiles".


    Logically compact profiles are parts of Java SE API. Technically, compact profiles
    are subsets of Java SE API which give facility to reduce the size of Runtime for
    typical devices which might have limited storage capacity.


    There are three profiles created viz. compact1, compact2, and compact3. Each profile
    contains a set of API classes with superset of earlier profile. So, compact2 contains
    API classes from compact2 in addition to compact1 profile, and compact3 contains
    API classes from compact1 and compact2 in addition to compact3 profile. Depending
    upon the API required, the developer can choose which profile will be referred
    at runtime. This had obviously the run-size smaller than monolithic approach.
    To give an idea the smallest profile compact1, have only around 11 MB size, compact2
    comes in 18 MB, and compact3 comes in 21 MB size.


    The table below shows overview of all the three compact profiles:


    To get the details of all the three compact profiles, let us list the composition
    of all the profiles in the table below.


    Detailed profile composition:


    Of course, this is not a complete solution for problem scenarios that we discussed
    earlier. Although this approach does not solve the problem of monolithic file
    reference, it just reduces to some extent.


    This brings us to launch Project Jigsaw to solve all such problems with Java Platform
    Module System (JPMS)


    # Java Platform Module System


    JPMS is a result of Project Jigsaw where the traditional Java package structure
    was rearranged in modules.


    Explore module


    Module is essentially a collection of packages that are related to each other
    and the resources, if required. To identify the module independently, it must
    be uniquely named. The configuration of such module is given by a module descriptor,
    which is configured as:


    Name of module


    Dependencies of modules


    Services offered by modules


    Services consumed by modules


    The main objectives of modularizing the Java SE platform across JSE 376 are as
    follows:


    Reliable configuration


    JPMS provides facility of configuration, which establishes dependencies between
    the modules. This configuration is available at the time of compilation as well
    as execution.


    Strong encapsulation


    The assessed permissions between the modules are permitted if module explicitly
    exports them. Also, the module cannot use those packages unless it specifies that
    it requires the other components of the modules.


    Scalable Java profile


    JPMS have changed the monolithic approach of grouping APIs. Every Java traditionally
    consists of different packages, subpackages is now converted to module system.
    Overall, there are 95 modules as of now in this approach. This module system is
    also extended to the developers, with which we can create new modules to make
    Java programs scalable.


    Greater profile integrity


    Monolithic approach of JDK has a serious risk to internal API. The developers
    have open access to the internal API because of some classes related to security
    can be under threat. Strong encapsulation will allow components that implement
    the Java SE platform to prevent access to their internal APIs.'
