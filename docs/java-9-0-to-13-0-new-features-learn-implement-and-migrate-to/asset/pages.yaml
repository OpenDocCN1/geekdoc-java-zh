    JEP 318: Epsilon: no-op garbage collector


    As we know, for years the JVM uses the concept of garbage collector. Traditionally
    GC works on the algorithms based on two processes:


    Mark – identifying the memory to be utilized and to be freed up.


    Sweep – Removing the object so as to make the memory free to be utilized by other
    objects.


    Depending upon the observations and need, different algorithms are designed, as
    shown below:


    Serial garbage collector


    Parallel garbage collector


    CMS garbage collector


    G1 garbage collector


    Of course, all implementations have their advantages and disadvantages. There
    are specific scenarios in which to decide algorithm is to be used.


    The aim of this JEP is to design a GC which should handle the memory effectively,
    but should not implement any earlier implementation. The shut down of JVM will
    happen automatically if the heap exhausts.


    One should know if we have different implementations for GC, why we should have
    no-op garbage collection. Following are the cases such GC can be used to:


    Performance testing


    Performance is the key for application success. The performance of application
    is heavily dependent on the performance of the GC. If you have a GC that does
    nothing for your application, then it can be used as a tool which can be used
    for analysis of other GCs. This will help filter out the scheduling of GC worker,
    barrier costing, GC cycles for different GCs.


    Memory pressure testing


    The memory processing in JVM is mostly uneven. Observing the memory pattern, we
    find it to be invariant at the time of allocation and sweeping. This because object
    creation in Java is a continuous work, but these objects are mostly short-lived
    and to the garbage collector. This is the weak memory pressure management. We
    need to test this memory pressure for checking optimized GC process. To do this,
    need to communicate with MBeans or get the data from GC logs. Instead of using
    the traditional GC, the no-op GC is to be more effective because this accepts
    only the allocations of memory which is bounded. This gives an effective way of
    testing as this fails on exhaustion of heap.


    Extremely short-lived bursts


    When the object is created locally, most of the times objects are short-lived,
    and for the effective utilization of memory, it must be required quickly. But
    the GC needs to follow the life cycles like marking and sweeping. For a short-lived
    object, a process flow may be a waste of resources and time because every GC cycle
    takes time to complete. In such cases, the no-op GC is found to be more effective
    than other GCs.'
