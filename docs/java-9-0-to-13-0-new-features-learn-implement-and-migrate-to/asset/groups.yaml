    # Working of publisher-processor-subscriber


    The process processes items pushed by the publisher and then remits them to the
    subscriber as described below. The following figure is the pictorial representation
    of the same.


    ![](img/593293c1d6794763b235cda6f9ab47ba_139_0.png)


    Figure 7.13: Publisher-processor-subscriber flow


    The entire flow can be discussed by following steps:


    The Publisher pushes items to Processor using the onNext() method


    The processor will process the items.


    Once the processing is done, the processor pushes the items to the subscriber.


    It may happen that the number of items requested by the subscriber and the processor
    are different. In such cases, the processor maintains the data buffer to store
    items.


    The publisher and the processor both define an Executor to support multithreading.


    The methods for requesting the items (request()) and pushing the data (onNext())
    work asynchronously.


    We will create a Processor which will calculate the square of items published
    by the Publisher using the following steps:


