    occurs and handles it effectively. A responsive system builds and provides the
    response correctly. Users always show confidence in the most responsive of applications.
    Such responsive systems simplify error handling, ultimately encouraging users.


    ## Elastic


    The enterprise applications face varying load. On a busy day, the number of hits
