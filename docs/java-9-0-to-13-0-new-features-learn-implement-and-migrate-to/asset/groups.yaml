    ## JEP 350: 动态 CDS 存档


    此 JEP 的主要目标是扩展现有应用程序类数据共享（CDS）的优势。通过这种方式，所有需要的类可以在 Java 应用程序执行结束时动态归档。该存档将包含您未添加到默认存档中的每一个类（应用程序和库）。这种实现的优势在于，它消除了用户为每个应用程序创建类列表而需要进行多次尝试的精力。


    早些，CDS 是通过以下步骤完成的：


    - 通过多次尝试创建类列表。

    - 使用创建的类列表转储存档。

    - 使用存档运行。


    虽然这看起来是一个有效的方法，但这里的问题在于，这种方法仅用于内置类。


    动态 CDS 通过 `-Xshare:dump` 选项配合类列表启用。类列表将同时包含内置类和用户定义的类。


    请注意，这里在执行期间加载的类将被考虑纳入存档过程。如果某个类存在于 jar 文件中但未参与执行，则它会被添加到存档中。执行时在堆中生成的对象也不会被添加。在某些，应用程序可能会崩溃或突然终止。在这种情况下，不进行存档。


    动态存档支持以下配置：


    - 静态基础存档，即默认 CDS 存档和动态存档。

    - 仅静态基础存档。


    目前，要使用动态存档，必须支持作为基础存档的默认 CDS。


    如果扩展了应用程序，也可以动态创建共享存档。可以使用以下选项创建：


    `-XX:ArchiveClassesAtExit`


    下面的代码片段显示了如何创建和使用它。我们不会创建任何花哨或复杂的应用程序。因此，与其研究代码，不如让我们理解创建存档的步骤。


    下面的片段显示了如何创建动态存档：


    ```

    D:\java13\>java -version

    OpenJDK version "13-ea" 2019-09-17

    OpenJDK Runtime Environment (build 13-ea+29)

    OpenJDK 64-Bit Server VM (build 13-ea+29, mixed mode)


    D:\java13\>javac DynamicCDSDemo.java


    D:\java13\>java -XX:ArchiveClassesAtExit=sample.js DynamicCDSDemo

    DynamicCDS Demonstration!!


    D:\java13\>java -XX:SharedArchiveFile=sample.js DynamicCDSDemo

    DynamicCDS Demonstration!!


    D:\java13\>

    ```


    图 9.2：创建和使用动态存档


    在创建存档时，应用程序、用户定义的类和库类会被添加到顶层。在这一过程中，为了性能考虑，将忽略已经包含在基础层中的类。类的元数据处理是在应用程序执行结束、虚拟机退出之前完成的。额外的元数据在不同的空间中有所不同：


    rw: 可读/可写数据


    ro: 只读数据


    mc: 蹦床 (Trampoline)


    ## JEP 351: GC: 无需内存


    在之前讨论 Java 11 的特性时，我们谈到了新的 GC。Z 垃圾回收器（Z Garbage Collector）以其对于较大的堆内存，具有极低的停顿时间而闻名，这是当前应用程序基础设施需求所需的。但是，ZGC
    有一个缺点。ZGC 不是并发的，而且它不会将内存返回给操作系统。目前，增加堆内存是为了满足动态内存需求。当我们在其上构建应用程序时，增加的内存被认为是安全的。有时，应用程序并不使用那部分内存资源，这被认为是浪费。理想情况下，未使用的内存应该返回给操作系统。这就是
    ZGC 缺乏的地方。即使内存很长时间没有被使用，这些内存也不会返回给操作系统。


    这是一个大问题：


    - 你正在使用资源

    - 你正在与其他应用程序共享资源，而未使用的资源仍然留在你那里。

    - 你的堆内存随着时间的推移而增加。


    因此 ZGC 需要将内存返回给操作系统。为了理解这将如何发生，我们需要深入了解 ZGC 的工作原理。ZGC 由多个称为 ZPages 的不同区域组成。这些
    ZPages 具有不同数量的提交内存。在压缩过程中，ZPages 会被释放。ZGC 还包含另一个名为 ZPageCache 的逻辑分区。释放的 ZPages
    被推入此缓存中。该 ZPage 缓存区域被重用于新的堆分配。一旦分配完成，它们就会从缓存中移除。缓存中的 ZPages 代表未使用的内存，并可以返回给操作系统。ZPages
    在页面缓存中按照最近使用顺序 (LRU) 和大小进行升序排列，这使得移除 ZPages 变成了一个简单的事件。问题在于，相同的页面被用于由对象提交。那么，我们如何决定这些页面何时从缓存中迁移的策略呢？为此，我们可以定义一个超时时间，用于定义
    ZPages 在被逐出之前在缓存中存在多久。你可以通过以下选项设置延迟：


    ```

    -XX:ZUnCommitDelay=

    ```


    此取消提交（uncommit）功能是默认启用的。注意，ZGC 不应该包含会导致堆内存移动到其最小尺寸以下的内存。因此，如果启动 JVM 时设置了将最小堆大小保持为与最大堆大小相同，则取消提交能力将被禁用。


    ## JEP 353: 实现遗留 socket API


    Socket 编程对你来说并不陌生。事实上，它在 JDK 1.0 就被引入了。早期版本的 socket 编程 API 对开发者来说要复杂得多。此 JEP 建议改进
    java.net.Socket 和 java.net.ServerSocket API 的实现。这些整个更新都是 Project Loom 的一部分。Loom
    专注于孵化 JVM 特性以及构建在它们之上的 API。为了创建轻量并发且易于使用的编程模型，它使用了以下结构：


    - 纤维 (Fibres)

    - 尾调用消除 (Tail-call elimination)


    让我们讨论此 JEP 如何简化 socket 编程。整个 Java 网络功能是基于 java.net.Socket 和 java.net.ServerSocket
    的。此外，还有一个提供者 java.net.Socket，所有的 socket 操作都委托给它。此外，它使用锁来代替同步方法，以便它可以与纤维通信。旧的 ServerSocket
    被移动到了 NoSocketImpl。因此，早期的 socket 实现现在被称为（此处原文似乎不完整）。当然，这并不是什么大问题，因为旧的实现已经存在了几十年了。因此，旧的
    API 并没有被移除，而是通过设置系统属性来使用。你可以设置 `jdk.net.PlainSocketImpl=true` 让 JDK 使用旧实现。DatagramImpl
    的实现没有变化。


    ## JEP 354: Switch 表达式


    Java 12 引入了 switch 表达式的修改版本。通过 switch 表达式，你可以使用语句或表达式。现在 switch 语句可以像传统上那样穿透（fall
    through），或者它可以使用新的标签 (->)。此外，switch 表达式还可以返回它所评估表达式的值。


    我们之前已经在上一个章节中讨论过这些特性，即 JEP 325。我们在该标题下详细讨论了这一特性。最初在 Java 12 中作为特性提出的，本应该是 Java
    13 的永久性更改。但在收到来自专业人士的反馈后，这些更改在该版本中并不是永久的。


    所有特性在该版本中都以实例的形式保留。与其使用 break-with，我们使用 yield 语句。


    语句中的 yield

    如前所述，修改后的 switch 语句现在可以与 switch 标签 (-> ) 关联。如果表达式包含单个值，则会自动返回。但如果表达式是执行块的一部分，那么
    Java 13 使用 yield 语句来返回值，如下代码片段所示：


    ```

    double salary = switch (EMPTYTYPE) {

    ```


    ```

    case "Developer" -> 35000;

    ```


    ```

    default -> {

    ```


    ```

    double totalSalary=baseSalary+hra+da;

    ```


    ```

    yield totalSalary;

    ```

    }

    ```


    '
