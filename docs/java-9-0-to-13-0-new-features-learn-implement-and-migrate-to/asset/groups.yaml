    There are different operations that can be performed on collections using stream
    API which are listed below:


    - map() function is used to perform operations on all the elements of the collections.
    As this intermediate, it returns a modified stream.

    - filter() function is used to filter the elements of a collection as per condition.
    Similar to map() this is intermediate function, it returns a modified stream.

    - collect() function is used to implement the reduction of pre-processed stream
    by map() and filter() functions.


    ## Java date and time API:


    For a long time, Java developers were using the date and time API, which are inadequate
    for ordinary developers. These classes were not thread safe, which leads to the
    problem of concurrency. Developers also need to take help of classes like DateFormat
    or Calendar class as to generate the required date manipulations. The existing
    date object starts from 1 Jan 1900, which is poor API design. Because of all these
    issues the developers are taking help of utilities from J-Time which is a third-party
    API.


    In order to remove all inconsistencies, a new API for date and time has been defined
    by JSE8.


    The two important classes added are LocalDate and LocalDateTime. All the new classes
    are constructed by factory methods.


    ## Collection improvement:


    Prior to JSE8, collections had some performance issue. Particularly HashMap objects
    which were having a lot of collisions in their keys. To improve this, strings
    were removed in JSE8, and hashes were added. In hash, the entries are stored in
    balanced trees, unlike linked list. HashMap, LinkedHashMap and ConcurrentHashMap
    are the modified collections based on which the entries are stored in balanced
    trees, instead of linked list. This changes to HashMap, LinkedHashMap, and ConcurrentHashMap.


    Oracle will continue to provide public updates and auto-updates of JSE8 until
    December 2020 for personal users.


    As discussed, we will be using the versions from JSE9 in the coming chapters.
    To summarize the major versions and important versions/updates with their codename
    and release date, refer to Table 1.1:


    Table 1.1 : Versions of Java


    | Version | Codename | Release Date |

    | :--- | :--- | :--- |

    | 1.x.x | - | 1996 |

    | 1.2 | - | 1998 |

    | 5 | Tiger | 2004 |

    | 6 | June | 2006 |

    | 7 | Snowball | 2011 |

    | 8 |后续 | 2014 |

    | 9 | Modular | 2017 |

    | 10 | Silla | 2018 |

    | 11 | Octfish | 2018 |


    The points to be noted in the above are the different version names given with
    different versions e.g. 1.x.x, or 1.2 where x is considered to be the minor release.
    The new number means there is a change in the API development.


    Oracle has now the concept of major minor versions. JSE9 will be the final version
    which will be called officially as a major version. From JSE10 onwards, there
    will be only version releases which will happen twice a year, and will be called
    as feature release. Such a pattern of the version is called as time-based release
    version.


    ### Time-based release


    From 1996 to 2016, it has been 20 years since Java has been releasing versions.
    JDK has grown in terms of not only size, which includes features, interfaces etc.
    but it has also improved on the front of performance, scalability, and security.
    In achieving these features, Java has surprisingly many irregular and unpredictable
    steps.


    Java kept working on different concepts and released in different versions. While
    achieving this, the release of each version was dedicated to one or more significant
    features as the basis of ''as when needed''. Of course, this didn''t seem to work
    for the developer initially, as Java was able to release the new features with
    high level of quality after review and testing.


    But on the other side, Java used to use help of smaller utilities until they had
    better releases. Comparing with other programming languages at time, this process
    seemed to be a slower approach.


    Considering this, Java proposed time-based release models from Java9 onwards.
    This model releases features every month, updates every quarter, and a long-term
    support release every three years.


    From March 2018, Java had introduced a concept of ''Feature Releases''. When any
    new feature or update in API is proposed, it is considered to be part of such
    a release. The JVM will come under this. As this is a six-month cycle, every March
    and September in a year.


    After this, the ''Update Release'' is published. This release takes care of security
    issues, bugs, and regressions, which might have occurred in feature release. Normally,
    this is launched every quarter i.e. in April, July, and October.


    Such release pattern is more advantageous for the developers, as the changes will
    be smaller in numbers, which will make it easier for upgradation.


    Considering these changes in API release schedule, the naming of versions i.e.
    version strings, which reflect the version, had been modified. From JDK10 onwards,
    the version string is replaced with the format $FEATURE.$INTERIM_$UPDATE.PATCH.


    Following are the details of each of these components:


    - **$FEATURE:**

    Consider as a major release, this is a version number which is incremented every
    six months. All the API updates and features are considered in this version. Starting
    from March 2018, $FEATURE number is considered as 10, and for September 2018 it
    is considered as 11. So, this reflects the major changes in the API.


    - **$INTERIM:**

    This is similar to minor-version concept in the earlier system. Normally, this
    is considered to be zero during the new style of time-based version of six months;
    there is no interim release. The main concern in this release is bugs which can
    be repeated with the current version.


    This is increased in every interim release. Normally, feature removals, or changes
    in standard API are not considered in this component. As we have shifted to six-month
    release cycle, this will always be zero.


    - **$UPDATE:**

    Sometimes developers may observe security issues, bugs or even regression while
    working with $FEATURE release. These observations are rectified in one month after
    launch of $FEATURE release. This observation is repeated in three month and increment.
    E.g. Full version string in April for release JDK.


    - **$PATCH:**

    This is used for critical security and bug fixes.

