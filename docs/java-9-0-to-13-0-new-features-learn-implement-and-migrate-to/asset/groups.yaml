    \ below.\n\n```js\njshell> calculateTotalSalary(15000,4)\nTotal Salary = 17600.0\n\
    \njshell>\n```\n\n## 6.13: Method calling forward reference\n\nWorking with commands\
    \ in JShell\n\nWe have seen till now how to write and test the different code\
    \ segments in JShell. Apart from this, JShell also supports different commands\
    \ which will help the developer in many ways. All the commands are written with\
    \ leading slash. Following is the list of commands and their functionalities.\n\
    \n- /var: List of all the declared variables.\n- /methods: List of all the declared\
    \ methods.\n- /list: List of all the entered code snippets, which includes variable,\
    \ methods and formulae, if any.\n- /list-start: List of all the executed snippets\
    \ before the actual start of JShell.\n- /list-all: List of all the executed snippets\
    \ before the actual start of JShell along with all the declaration done by the\
    \ developer which includes variables, methods and formulae, if any.\n- /drop:\
    \ Used to drop the source (e.g. /drop will drop the declaration done for var1\
    \ in JShell).\n- /edit: Opens the editor to modify the source (e.g. /var1 will\
    \ open the editor with the value of var1, which can be modified and accepted in\
    \ the editor).\n- /env: Used to view or change the context of JShell window.\n\
    - /history: Lists all the entries done by the developer for the current instance\
    \ of JShell.\n- /exit: Used to exit the JShell utility.\n- /imports: Lists the\
    \ imported resources in JShell.\n- /open: Used to open the file as input. This\
    \ file should have extension .jsh.\n- /save: Saves the snippet source to specified\
    \ file.\n- /reset: Used to reset JShell.\n- /n: Returns the last snippet.\n- /set:\
    \ Sets the configuration information of JShell.\n- /types: Lists the declared\
    \ types in JShell.\n\n## Editors\n\nJShell is a tool or utility which is used\
    \ to learn new concepts. While checking with the snippets, many times developer\
    \ needs to edit or modify the snippet. JShell provides both internal and external\
    \ ways to edit the content.\n\n### Internal Shell editing\n\nThe inputs entered\
    \ on the console can be retrieved using a combination of keys and can be modified\
    \ as and when required.\n\nThis internal editing gives the following facilities:\n\
    \n- Input text navigation\n- Navigation of history\n- Input modification\n- Searching\n\
    \nLet us discuss different facilities given by JShell, along with their working\
    \ commands or keys.\n\n### Input text navigation\n\nThis is normally used to edit\
    \ the lines entered as a snippet in JShell session. The following table shows\
    \ different keys and the actions based on key combination in editing.\n\n# Table\
    \ 6.1: Text navigation editing keys\n\n### History navigation\n\nJShell has an\
    \ interesting feature to remember every activity as long as you remain in the\
    \ current instance. This facilitates reusing commands and snippets created earlier.\
    \ To access the history, you can simply press up, down, left and right keys. You\
    \ can use the enter key to select and enter the pre-existing snippets.\n\n###\
    \ Input modification\n\nThe snippet can be modified by using key combinations\
    \ as shown in the table below. This is different from input line navigation as\
    \ this modification block of code can be edited and modified.\n\n# Table 6.2:\
    \ Input modification keys\n\n### Searching\n\nOne of the important features given\
    \ by JShell is the search facility. You can start your search by using the combination\
    \ Ctrl+R. The search goes backward from your current location.\n\nIf you press\
    \ Ctrl+R you will get:\n\n```js\njshell>\n((reverse-i-search') :\n```\n\nThe following\
    \ snippet shows the use of this facility:\n\n```cmd\nCommand Prompt - jhell -v\n\
    D:\\Java9\\java-se-9-ri\\jdk-9\\bin\\jshell -v\n| Welcome to JShell - Version\
    \ 9\n| For an introduction type: /help intro\njshell> int c=10\nc=> 10\n| created\
    \ variable c : int\njshell> class Sample\n... {\n... }\n| created class Sample\n\
    (reverse-i-search) c': class Sample\n```\n\nFigure 6.14: Searching in JShell\n\
    \nTo move to the earlier occurrences, you can go by pressing Ctrl-R repeatedly.\n\
    \n### External editor\n\nApart from the internal editor, JShell also supports\
    \ the external editor. This graphical editor can be opened by using /edit command.\n\
    \nTo edit all the snippets, you can use the /edit command with the snippet identification\
    \ as:\n\n```bash\n/edit x\n```\n\nEdits the current status of x if it is set as\
    \ shown below:\n\n```cmd\nCommand Prompt - jshell -v\nhell> int x=10\nx=> 10\n\
    | created variable x : int\njshell> /edit x\n```\n\nFigure 6.15: Working with\
    \ edit in JShell\n\nThe following snippet shows the actual JShell editor which\
    \ you can work with:\n\n```text\nJShell Edit Pad\nint x=10;\n\nCancel  Accept\
    \  Exit\n```\n\nFigure 6.16: Editor in JShell\n\n## Feedback in JShell\n\nFeedback\
    \ in JShell is used to customize the information which can be displayed in the\
    \ JShell console. Depending on the details expected for commands and snippet execution,\
    \ user can take a call which feedback model is used. There are in-built JShell\
    \ model or customized feedback models.\n\nFollowing are the different modes of\
    \ feedback which are available with JShell:\n\n- **Verbose**: This mode displays\
    \ the information of the snippet in the format of name==value along with the description.\
    \ This mode is also used for different declarations for methods, classes, ensues\
    \ etc. If this mode is used with commands, it displays the status of success.\n\
    - **Normal**: This is default feedback mode unless specified by the user. This\
    \ mode displays the information in the formation of name==value pair. There is\
    \ no description associated with this mode. Similar to verbose, this can be used\
    \ for declaration and commands as well. The command gives feedback which indicates\
    \ the success of execution.\n- **Concise**: This mode displays the feedback in\
    \ the format of name==value, but only if we are using it with expressions. This\
    \ is a typical mode which cannot be used with declaration, command etc.\n- **Silent**:\
    \ The Silent mode is silent in all the scenarios. It doesn't give you any feedback\
    \ if used with declarations, command etc.\n\n### Setting up the feedback:\n\n\
    The feedback can be set up by using /set feedback command. By default, the feedback\
    \ mode is normal as discussed earlier.\n\nFor example, if want to set up the feedback\
    \ verbose you can use the command:\n\n```bash\n/set feedback verbose\n```\n\n\
    Now, let us observe the different modes of feedback and their working in the below\
    \ snippet:\n\n### Verbose feedback\n\nVerbose feedback can also be generated by\
    \ giving -v option while starting the JShell editor. The following figure shows\
    \ the generated feedback because of the verbose mode. Verbose gives the feedback\
    \ with name, value and description.\n"
