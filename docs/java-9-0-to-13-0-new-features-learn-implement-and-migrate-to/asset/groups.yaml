    - 什么是 Shenandoah 垃圾回收器？\n\n# 第 9 章\n\n# Java13 简介\n\n通过第一章《版本控制洞察》，我们开始了旅程，现在将到达终点。在整个旅程中，我们讨论了\
    \ Java 从 9 到 12 的进展。在本书发布时，Java 13 已经在市场上了。这个 13 版本是 Oracle 六个月发布周期的结果。目前，Java\
    \ 13 处于 Rampdown 阶段二。这对我们意味着，现在没有进一步在该版本下提交的 JEP 了。尽管版本更新是为了在通用可用之前修复错误。根据给定的时间表，初始版本预计于\
    \ 2019 年 8 月 8 日发布。计划于 2019 年 9 月 17 日发布通用版本。\n\n# 时间线\n\n- J350: 动态 CDS 存档\n\
