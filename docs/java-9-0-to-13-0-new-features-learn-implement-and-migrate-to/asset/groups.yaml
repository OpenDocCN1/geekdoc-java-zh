    \ 是传输层，紧接 SSL（安全套接层）。或者，它也被称为 TLS 握手。Web 应用需要网络浏览器和服务器之间的安全通信，这由 TLS 提供。连接的主要优势是对称加密。数据通过该层使用的加密机制进行传输。观察到\
    \ TLS 1.3 比之前的 TLS 1.2 版本更安全、更快速。原因是 TLS 1.2 需要两次往返才能完成 TLS 握手，而 TLS 1.3 只需一个往返即可完成会话。此外，它在零往返（zero\
