    ## JEP 350: Dynamic CDS archive


    The main goal of this JEP is to extend the benefit of the existing application
    class-data sharing. Using this all the required classes can be dynamically archived
    at the ending of Java application execution. This archive will include each and
    every class (application and library) that you were not added in the default archive.
    The advantage of this implementation is that it eliminates the efforts of the
    user to do the multiple trials of creating a list of classes for every application.


    Earlier, the CDS was done through the following steps:


    - Creating a class list by doing number of trials.

    - Dumping archive by using the created list of classes.

    - Running with the archive.


    Though seems to be an effective approach, the problem here is that this approach
    is used only with built-in classes.


    The dynamic CDS is enabled by -Xshare:dump option with the class list. The class
    list will include both the built-in as well as the user-defined classes.


    Note that here the classes that were loaded during the execution will be considered
    for archive process. If a class is present in jar file and is not part of execution,
    then it will be added to the archive. The objects generated in heap at the time
    of execution are not added either. In cases, the application may crash or terminate
    abruptly. In such cases, the archiving is not done.


    The dynamic archive supports the following configuration:


    - Static base archive i.e. default CDS archive and dynamic archive together.

    - Only static base archive.


    Currently, to use the dynamic archive you must take the support of default CDS
    which is used as the base archive.


    You can also create the shared archive dynamically if the application is extended.
    This can be created using the option:


    -XX:ArchiveClassesAtExit


    The following snippet shows how to create and use it. We are not going to create
    any fancy or complicated application. So, instead of going through the code let
    us understand the steps for creating an archive.


    The following snippet shows how to create the dynamic archive:


    ```

    D:\java13\>java -version

    OpenJDK version "13-ea" 2019-09-17

    OpenJDK Runtime Environment (build 13-ea+29)

    OpenJDK 64-Bit Server VM (build 13-ea+29, mixed mode)


    D:\java13\>javac DynamicCDSDemo.java


    D:\java13\>java -XX:ArchiveClassesAtExit=sample.js DynamicCDSDemo

    DynamicCDS Demonstration!!


    D:\java13\>java -XX:SharedArchiveFile=sample.js DynamicCDSDemo

    DynamicCDS Demonstration!!


    D:\java13\>

    ```


    Figure 9.2: Creating and using dynamic archive


    While the archive is created, the application.user-defined classes and library
    classes are added to the top layer. During this process, the classes which are
    already included in the base layers are ignored for the performance. The metadata
    of the classes is done at the end of the application execution before the exit
    of the virtual machine. The extra metadata is different in the different spaces:


    rw: Readable/writable data


    ro: Read-only data


    mc: Trampoline


    ## JEP 351: GC: unneeded memory


    While discussing the feature of Java 11 earlier, we have talked about the new
    GC. Z Garbage Collector is famous for its very low pause times for relatively
    high heap sizes which was the need for the current infrastructural needs for the
    applications. By, ZGC has got one disadvantage. ZGC is not concurrent and it does
    not return back memory to the operating system. Currently, the heap memory is
    increased so as cater to dynamic memory requirement. An increased memory is said
    to be safe when we are building applications on it. Sometimes, the application
    does not use amount of that memory resource is considered to be wastage. Ideally,
    unused memory should be returned back to the operating system. This is where ZGC
    lacks. Even if the memory is not used for longer duration this memory is not returned
    to the operating system.


    This is a big concern:


    - You are using resource

    - You are sharing your resource with other applications and the unused resource
    is still with you.

    - You heaps memory is requiring over the period of time.


    So ZGC needs to be returned back memory to the operating system. To understand
    how this is going to happen, we need to go deeper into the working of ZGC. The
    ZGC consists of different regions called ZPages. This ZPages have different amounts
    of committed memory. During the compaction process ZPages are freed up. ZGC also
    contains another logical partition as ZPageCache. The freed up ZPages are pushed
    into this cache. This ZPage cache area is reused for the new heap allocation.
    Once the allocation is done, they are removed from the cache. The ZPages in the
    cache represent the unused memory and can be returned to the operating system.
    The ZPages are arranged in an ascending order in page cache, order of their recent
    use (LRU) and in order of their size this makes of removing ZPages simple event.
    The problem here is, the same pages are used to get committed by object. So, how
    we decide the policy, of when these pages are evacuated from the cache? For this,
    we can define the timeout, which for define how much time ZPages be present in
    the cache before they are evicted. You can set the delay with the following option:


    ```

    -XX:ZUnCommitDelay=

    ```


    This uncommit feature is enabled by default. Note that, ZGC should not include
    the memory, which will result in heap memory moving below its minimum size. So,
    if JVM is started with setting, the minimum heap size is kept to maximum heap
    size, then the uncomment capability is disabled.


    ## JEP 353: Implement legacy socket API


    Socket programming is not new to you. In fact, it was introduced in JDK 1.0. The
    socket programming API which was present in earlier versions was much complicated
    to the developer. This JEP recommends making the implementations of java.net.Socket
    and java.net.ServerSocket API. These entire updates are part of Project Loom.
    Loom focuses on incubating the JVM features and the APIs which are built on top
    of them. To create light-weight concurrent and easy-to-use programming models,
    it uses the following constructs:


    - Fibres

    - Tail-call elimination


    Let us discuss how this JEP simplifies the overall working of the socket programming.
    The entire networking in Java is based on java.net.Socket and java.net.ServerSocket
    API. Along with this, there is another Service Provider, java.net.SocketImpl to
    which all the socket operations are delegated. The delegation of this interface
    is PlainSocketImpl, which also contains supporting SocketInputStream and SocketOutputStream.
    This is now history. The new implementation is NoSocketImpl which is replacement
    for PlainSocketImpl. This is relatively easy to maintain and debug. It communicates
    with the new IO implementation, because of which there is no need for the native
    code. Apart from that it uses locks instead of synchronized methods so that it
    can communicate with the fibres. The old ServerSocket is moved to NoSocketImpl.
    So, the earlier implementation of sockets is now called.


    Of course, this is not a cake piece as the older implementation is present since
    the last decades. So, the older API is not removed, instead the system property
    is set up to use the old API. You can use the property jdk.net.PlainSocketImpl=true
    JDK uses the old implementation There is no change in implementation of DatagramSocketImpl
    in this version.


    ## JEP 354: Switch expressions


    Java 12 introduced the modified version of Switch expression. With switch expression
    you can use either statement or expression. Now the switch statements can work
    as a fall through, which was like traditionally. Or it can use new label (->).
    Along with this, the switch expression can also return the value from the expression
    it is evaluating.


    We have already discussed these features in the last chapter, i.e. JEP 325. We
    have discussed this feature in detail under the heading. What was presented as
    a feature in Java 12 initially, which was supposed to be a permanent change in
    Java 13. But after the feedback received from the professionals, the changes were
    not permanent in this version as.


    All of the features are kept in this version with one instance. Instead of break-with-
    we uses yield statement.


    Yield in statement

    As discussed earlier, the modified switch statement can now have the expression
    associated with the switch label (-> ). If the expression contains a single value
    that is automatically returned. But if the expression is part of the block to
    be executed then Java 13 uses yield statement to return a value as shown in code
    snippet below


    ```

    double salary = switch (EMPTYTYPE) {

    ```


    ```

    case "Developer" -> 35000;

    ```


    ```

    default -> {

    ```


    ```

    double totalSalary=baseSalary+hra+da;

    ```


    ```

    yield totalSalary;

    ```

    }

    ```

