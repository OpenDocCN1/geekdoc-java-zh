    # jdep


    Termed as Java Dependency Analysis Tool, jdep processes the generated bytecode
    which may be .class file or even the JAR file and it identifies the dependencies.
    jdep knows the module system of Java9, which can examine if you are using the
    removed classes or internal API in your project.


    jdep is present in your /bin directory. Here are the different options you can
    use with jdep command.


