    Earlier we discussed that the setting with JShell remains with you as long as
    you are in the current instance of JShell or current session. But behaviour can
    be customized by using --retain option as shown below.


    mymode: /set feedback mymode --retain


    After this command, if you exit your current session and regenerate JShell, you
    will still get your feedback mode as myymode.


