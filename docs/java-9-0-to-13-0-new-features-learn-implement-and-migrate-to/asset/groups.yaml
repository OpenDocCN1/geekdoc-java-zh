    Total Salary = 17600.0\n\njshell>\n```\n\n## 6.13: 方法调用的前引用\n\n在 JShell 中使用命令\n\
    \n到目前为止我们已经看到了如何在 JShell 中编写和测试不同的代码段。除此，JShell 还支持不同的命令，这些可以在许多方面帮助开发者。所有命令都以斜杠\
    \ / 开头。以下是命令列表及其功能。\n\n- /var：列出所有已声明的变量。\n- /methods：列出所有已声明的方法。\n- /list：列出所有输入的代码片段，包括变量、方法和公式（如果有的话）。\n\
