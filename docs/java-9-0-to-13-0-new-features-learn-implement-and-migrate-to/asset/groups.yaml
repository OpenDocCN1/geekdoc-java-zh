    - MD5\n\n安全 API 通过 Java Secure Socket Extension 提供，该扩展提供了 SSL、TLS 和 DTLS 协议的实现。目前，它支持\
    \ SSL 3.0、TLS 1.0、TLS 1.1、TLS 1.2 和 DTLS 1.2。此 JEP 建议创建对 TLS 1.3 实现的支持。\n\n该实现将由以下算法提供：\n\
