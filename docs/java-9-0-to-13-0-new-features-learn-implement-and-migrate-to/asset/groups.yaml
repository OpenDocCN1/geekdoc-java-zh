    # About the Author


    Mandar Jog is a passionate Java trainer. From last 15 years, he has worked for
    different organizations as a trainer. He has global certifications like Sun Certified
    Java Programmer (SCJP) & Sun Certified Web Developer (SCWD). As a trainer, his
    main areas of expertise are Core Java, Web Technologies, Spring Boot, Angular,
    among others. Along with training, Mandar has connected with different institutions
    for designing the curriculum. He also conducts sessions for cutting-edge technologies.
    New concepts are tough in the beginning. He believes in this, and makes sure to
    make concepts simpler for his students. Along with retail trainings, he has also
    been part of many best-selling books on Java as a technical reviewer by publications.


    # Acknowledgment


    To begin with, I would like to thank the BPB Publications for giving me the opportunity
    to write this book. Their support throughout the book was phenomenal. I also like
    to thank my wife, Tejaswani. She has been my source of inspiration while writing
    this book. Her suggestions made a lot of difference. Special thanks to my loving
    son, Ojas, who desperately wanted to get this book so that I could spend more
    time with him. Lastly, I would like to thank my parents and friends who have always
    supported me. - Mandar Jog


    # Preface


    From the day of its first release, Java has been one of the most reliable programming
    languages for developers. Initially it was just another object-oriented language,
    in later stages it became more popular because of its capabilities in web programming.
    The team of Java has always been used to update the API to serve developers in
    creating complex business applications. Java has launched 13 major versions from
    JDK1 to JDK13. Each version comes with different considerations to cater to needs.
    Each update for each version is not a simple task. The objective of this book
    is to make the reader familiar with all the changes proposed in different versions.
    The book covers versions from JDK9 to recent JDK13. The book contains examples
    to show the working of the same. Effort has been taken to make most of the concepts
    are explained with simple examples that everybody can understand.


    Chapter 1 talks about the journey of Java. It describes how Java has evolved,
    from its birth to the current version. It gives an overview of all the features
    introduced in every version.


    Chapter 2 is dedicated to Java 9. It mainly focuses on the programming concepts
    of Java9 and how it is better than the traditional package-centric approach.


    Chapter 3 discusses the updates in JDK10. It discusses variable type inference,
    time-based releasing version, among others. It discusses the modifications in
    garbage collection for this version.


    Chapter 4 discusses the updates in JDK11. It discusses different concepts like
    ZGC, Nashorn JavaScript Engine, along with other concepts like nest-based access
    control, Noop garbage collector, etc.


    Chapter 5 discusses how to migrate Java9 applications to the newer versions. It
    also discusses how to work with jlink, and the concept of multi-release jar files.


    Chapter 6 talks about an important tool--jshell. It discusses the different commands
    and feedback modes which are used in jshell.


    Chapter 7 focuses on the concept of reactive programming in Java, as well as all
    the different concepts like subscribers, publisher and back pressure.


    Chapter 8 discusses the updates in Java12. It talks about the Shenandoah garbage
    collector, microbenchmarking suit and amortized collections for G1.


    Chapter 9 discusses the updates in Java13. It talks about how to free the unused
    memory in ZGC. Along with this, it also talks about the text blocks and modified
    switch expressions.


