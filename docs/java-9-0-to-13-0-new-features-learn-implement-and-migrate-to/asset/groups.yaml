    Java9 reactive stream is all about processing streams of data asynchronously,
    which have the Publisher and subscription model. The stream of data is published
    or pushed by the Publisher to the Consumer of the data where it is consumed or
    used as specified by the diagram below:


    ![](img/593293c1d6794763b235cda6f9ab47ba_127_0.png)


