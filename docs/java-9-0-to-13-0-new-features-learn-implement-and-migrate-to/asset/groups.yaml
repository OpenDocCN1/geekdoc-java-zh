    \ 6.3: JShell options\n\nTo work with all the examples, use -v option of JShell\
    \ which represents verbose option as below:\n\n/bin/JShell -v\n\nWriting the code\
    \ in JShell\n\nA typical Java snippet contains declaration of variables, constants,\
    \ iteration statement or any business logic algorithm. We will start our journey\
    \ with working variables in JShell.\n\nDefining or declaring the variable and\
