    Figure 3.4:JDK forest


    JDK uses a specific naming style to identify the repositories. The syntax for
    the same is as follows:


    /


    Here, the project denotes the short name from OpenJDK project, and component_path
    is a path to a repository where the code base or components reside. The project
    component is normally deified by lead project.


    JDK project from OpenJDK was divided into 8 different repositories as follows:


    +   - root

    - corba

    - hotspot

    - jaxp

    - jaxws

    - jdk

    - langtools

    - nashorn


    Such multiple repos create a better structuring of components and also generates
    a clear understanding of the task that a group or repos is performing. But apart
    from its structural advantages, it is lacking in certain aspects. Many times,
    different repos may be related to each other, and the changesets among them can
    be interdependent. In such cases, the atomic commit in multiple repos is not possible.


    This creates a lot of confusion among the contributor, as the single bug fix,
    which spans across different repositories, needs to be addressed and committed
    separately.


    To overcome this issue, oracle launched a prototype of consolidated forest, which
    is the beginning of converting the multiple repository forest into a single unit.
    This prototype contains eight repositories, as discussed earlier, which will be
    converted into a single unit using the python script.


    The prototype is available at:


    http://openjdk.java.net/jdk/jdk10/consol-proto/


    The following three scripts have a major impact on this prototype:


    This prototype had converted the traditional structure of multiple forests into
    a single consolidated forest. All the Java modules are under a single top-level
    directory src.


    The existing JDK structure contains the module-based directories which looks like:


    ```

    $ROOT/src/java.base

    ```


    ```

    $ROOT/langtools/src/java.compiler

    ```


