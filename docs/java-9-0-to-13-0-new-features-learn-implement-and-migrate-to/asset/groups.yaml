    # Project Jigsaw


    The Project Jigsaw was initially proposed in August 2008 whose work and implementation
    began in January 2014.


    This project was aimed to achieve primary goals:


    To make the process of creating and maintaining the libraries simpler for developers.


    To make the JSE platform more secure and maintainable.


    To improve the application performance.

    To make SE platform perform along with JDK. This facilitates Java to be used for
    small computing devices and dense cloud deployment.

    (Source: https://openjdk.java.net/projects/jigsaw/ )


    The work was completed in July 2017 and delivered to the public under JSE9.0 on
    21st September 2017.'
- md: "\n# Compact profiles\n\nThough Project Jigsaw was an attempt towards creating\
    \ modular application or converting centric Java to modular JDK, this was not\
    \ the first or only. Java 8.0 had already proposed one solution called \"compact\
    \ profiles\".\n\nLogically compact profiles are parts of Java SE API. Technically,\
    \ compact profiles are subsets of Java SE API which give facility to reduce the\
    \ size of Runtime for typical devices which might have limited storage capacity.\n\
    \nThere are three profiles created viz. compact1, compact2, and compact3. Each\
    \ profile contains a set of API classes with superset of earlier profile. So,\
    \ compact2 contains API classes from compact2 in addition to compact1 profile,\
    \ and compact3 contains API classes from compact1 and compact2 in addition to\
    \ compact3 profile. Depending upon the API required, the developer can choose\
    \ which profile will be referred at runtime. This had obviously the run-size smaller\
    \ than monolithic approach. To give an idea the smallest profile compact1, have\
    \ only around 11 MB size, compact2 comes in 18 MB, and compact3 comes in 21 MB\
    \ size.\n\nThe table below shows overview of all the three compact profiles:\n\
    \nTo get the details of all the three compact profiles, let us list the composition\
    \ of all the profiles in the table below.\n\nDetailed profile composition:\n\n\
    Of course, this is not a complete solution for problem scenarios that we discussed\
    \ earlier. Although this approach does not solve the problem of monolithic file\
    \ reference, it just reduces to some extent.\n\nThis brings us to launch Project\
    \ Jigsaw to solve all such problems with Java Platform Module System (JPMS)\n\n\
    # Java Platform Module System\n\nJPMS is a result of Project Jigsaw where the\
    \ traditional Java package structure was rearranged in modules.\n\nExplore module\n\
    \nModule is essentially a collection of packages that are related to each other\
    \ and the resources, if required. To identify the module independently, it must\
    \ be uniquely named. The configuration of such module is given by a module descriptor,\
    \ which is configured as:\n\n- Name of module\n- Dependencies of modules\n- Services\
    \ offered by modules\n- Services consumed by modules\n\nThe main objectives of\
    \ modularizing the Java SE platform across JSE 376 are as follows:\n\nReliable\
    \ configuration\n\nJPMS provides facility of configuration, which establishes\
    \ dependencies between the modules. This configuration is available at the time\
    \ of compilation as well as execution.\n\nStrong encapsulation\n\nThe assessed\
    \ permissions between the modules are permitted if module explicitly exports them.\
    \ Also, the module cannot use those packages unless it specifies that it requires\
    \ the other components of the modules.\n\nScalable Java profile\n\nJPMS have changed\
    \ the monolithic approach of grouping APIs. Every Java traditionally consists\
    \ of different packages, subpackages is now converted to module system. Overall,\
    \ there are 95 modules as of now in this approach. This module system is also\
    \ extended to the developers, with which we can create new modules to make Java\
    \ programs scalable.\n\nGreater profile integrity\n\nMonolithic approach of JDK\
    \ has a serious risk to internal API. The developers have open access to the internal\
    \ API because of some classes related to security can be under threat. Strong\
    \ encapsulation will allow components that implement the Java SE platform to prevent\
    \ access to their internal APIs.\n\n# Improved performance\n\nThe concept of modular\
    \ programming can be effective in improving the performance. Modular programming\
    \ boosts the runtime to access resources which are required and permitted. This\
    \ is also true in the case of deployment.\n\n# Module types\n\nJDK 9.0 supports\
    \ different types of modules, including the API modules, as follows:\n\nJava SE\
    \ and JDK modules\n\nSuch types of modules are provided by JDK. These modules\
    \ are developed by developers so that their services for application development\
    \ can be used. E.g. java.base, java.xml, etc. These modules export different packages\
    \ which are utilized by developers.\n\n# Named modules\n\nThe modules which are\
    \ created by developers are called as application modules. The configuration of\
    \ such modules is done in module-info.java file. Through this, the modules declare\
    \ their dependencies and also the resources that are permitted to be exported\
    \ to other modules.\n\n# Automatic modules\n\nSometimes, the application uses\
    \ the JAR file, which can be added to the module-path. The name of such modules\
    \ are identified from automatic module name MANIFEST.MF or the filename of the\
    \ JAR. Normally, such modules are used to initiate the migration to modularity.\n\
    \n# Unnamed modules\n\nThese are the modules which are identified through all\
    \ the jars and classes on the classpath. They can read all the modules.\n\n# Listing\
    \ JDK modules\n\nJDK 9.0 has not only facilitated to create custom modules, but\
    \ it also divided the entire JDK into modules to support various configurations.\n\
    \nThe modified Java API structure implements the following principles:\n\n- Default/standard\
    \ modules, which starts with java. Such modules are governed by JCP.\n- JDKs in-built\
    \ modules starts with jdk:\n\nThe keyword exports denotes the permissions for\
    \ using the packages from current packages to other module resources.\n\nThe entire\
    \ structure, and relationships between different modules of JPMS are quite lengthy\
    \ and complicated to understand at this point of time. This can be visualized\
    \ by Java module graph.\n\nJava module graph\n\nJava module graph is a graphical\
    \ representation of different modules and their relationships. Figure 2.1 shows\
    \ the sample module graph. Earlier, Java had a base package named java.lang. The\
    \ structure has now drastically changed with the base module called java.base\
    \ , where all the basic services of Java have been grouped together in the form\
    \ of different packages.\n\nThe base module is basic for providing services to\
    \ other modules. So obviously, there is no dependencies for this module.\n\nOne\
    \ of the most important point to note is, this a default module, which is available\
    \ to all the modules created by the developer. So, the developer will get all\
    \ the services by default without using requires keyword to configure module dependency.\n\
    \nFollowing are the packages which are part of java.base :\n\n- java.lang\n- java.lang.invoke\n\
    - java.lang.module\n- java.lang.reflect\n- java.net\n- java.security\n- java.util\n\
    \n![](img/593293c1d6794763b235cda6f9ab47ba_25_0.png)\n\nFigure 2.1: Java module\
    \ graph\n\nThe above graph shows the sample module graph for platform dependencies.\
    \ Such graphs help us in identifying the relationships between the modules. The\
    \ dependencies of module two on module one is denoted by the line draw from the\
    \ first to the second.\n\nIn the above graph, java.xml requires services from\
    \ java.base. Also, there can be hierarchical dependencies. Observe module java.rmi\
    \ which requires java.logging, which in turn requires java.base.\n\nAlternatively,\
    \ all the modules can be also seen by java command,:\n\njava --list-module\n\n\
    The above command gives you the following output:\n\n```\nD:\\Java\\java-se-9-r1\\\
    jdk-9\\bin>java --list-modules\njava.activation@\njava.base@\njava.compiler@\n\
    java.corba@\njava.datatransfer@\njava.desktop@\njava.instrument@\njava.logging@\n\
    java.management@\njava.management.rmi@\njava.math@\njava.rmi@\njava.scripting@\n\
    java.se@\njava.ee@\njava.security.jss@\njava.security.sasl@\njava.smartcardio@\n\
    java.sql@\njava.sql.rowset@\n```\n\nFigure 2.2: Listing of Java modules\n\nWe\
    \ can also list the details of individual module by giving the command:\n\njava\
    \ -d module-name\n\nFor e.g., if we want to understand the different dependencies\
    \ of java.base module we can use the command:\n\njava -d java.base\n\nBy executing\
    \ this, we will get the following output:\n\n```\nD:\\Java\\Java-se-9-r1\\jdk-9\\\
    bin\\java -d java.base\njava.base@\nexports java.io\nexports java.lang\nexports\
    \ java.lang.annotation\nexports java.lang.invoke\nexports java.lang.module\nexports\
    \ java.lang.ref\nexports java.lang.reflect\nexports java.math\nexports java.net\n\
    exports java.net.spi\nexports java.nio\nexports java.nio.channels\nexports java.nio.channels.spi\n\
    exports java.nio.charset\nexports java.nio.charset.spi\nexports java.nio.file\n\
    exports java.nio.file.attribute\nexports java.security\nexports java.security.acl\n\
    exports java.security.cert\n```\n\nFigure 2.3: Module description\n\nLet us now\
    \ discuss, how the user-defined module is created and what are the different keywords\
    \ used while working with module system.\n\nDeclaring the module\n\nThe declaration\
    \ of module is written in module-info.java file. Inside this module declaration,\
    \ the dependencies are also configured.\n\nModules can be declared:\n\nmodule\
    \ modulename\n\n```\n{\n\n  //body of module where dependencies are configured.\n\
    \n}\n```\n\nThe body of every module provides the dependencies or relationships,\
    \ which the current module is utilizing, includes:\n\n- The packages of other\
    \ modules, from which the current module is utilizing the services.\n- The packages\
    \ of current modules, which are exposed to other modules.\n\nThe module-info.java\
    \ is termed as module-descriptor or metadata file. The declaration of this file\
    \ must begin with the keyword module. The unique name of the module must be followed\
    \ by this, which is further followed by module embraced in braces as in the above\
    \ syntax.\n\nNote that from Java 9 onwards, you should not use (.. ) in module\
    \ name. You can follow the structure of traditional package naming in module i.e.\
    \ you can name your module com.ypb.mymodule\n\nThe module declaration normally\
    \ contains different module directives. These directives help to configure the\
    \ relations between other modules. Following are the important directives used\
    \ to configure these relationships:\n\nrequires\n"
  mdcn: "\n\n# 紧凑配置 (Compact profiles)\n\n尽管 Project Jigsaw 尝试创建模块化应用或将传统的 Java 转换为模块化\
    \ JDK，但这并非首次或唯一。Java 8.0 已经提出了一种名为“紧凑配置”（compact profiles）的解决方案。\n\n从逻辑上讲，紧凑配置是\
    \ Java SE API 的。从技术上讲，紧凑配置是 Java SE API 的子集，为存储容量有限的典型设备减少运行时的大小。\n\n目前创建了三种紧凑配置，即：compact1、compact2\
    \ 和 compact3。每个配置都包含一组 API 类，并且是较早配置的超集。因此，compact2 除了包含 compact1 配置外，还包含了 compact2\
    \ 中的 API 类；而 compact3 除了包含 compact3 配置，还包含了 compact1 和 compact2 中的 API 类。根据所需的\
    \ API，开发者可以在运行时选择引用哪种配置。这显然使得运行尺寸比单体方法更小。为了让人有一个直观的概念，最小的配置 compact1 大仅仅约 11 MB，compact2\
    \ 为 18 MB，compact3 为 21 MB。\n\n下表显示了所有三个紧凑配置的概览：\n\n为了获取所有三个紧凑配置的细节，让我们在下表中列出所有配置的组成。\n\
    \n详细配置组成：\n\n当然，这对于我们之前讨论的问题场景并不是完整的解决方案。虽然这种方法没有解决单体文件引用的问题，但它在某种程度上减少了它。\n\n\
    这引导我们启动 Project Jigsaw，通过 Java 平台模块系统 (JPMS) 来解决所有此类问题。\n\n# Java 平台模块系统 (Java\
    \ Platform Module System)\n\nJPMS 是 Project Jigsaw 的成果，传统的 Java 包结构被重组为模块。\n\n\
    探索模块 (Explore module)\n\n模块本质上是相互相关的包以及资源（如果需要）的集合。为了独立识别模块，必须具有唯一的名称。此类模块的配置由模块描述符（module\
    \ descriptor）给出，其配置如下：\n\n- 模块名称\n- 模块的依赖关系\n- 模块提供的服务\n\n跨 JSE 平台模块化 Java 平台的主要目标如下：\n\
    \n可靠的配置 (Reliable configuration)\n\nJPMS 提供了配置功能，建立了模块之间的依赖关系。这种配置在编译和执行时都是可用的。\n\
    \n强封装 (Strong encapsulation)\n\n如果模块显式地导出（exports）那些包，则允许模块使用。\n\n可扩展的 Java 配置\
    \ (Scalable Java profile)\n\nJPMS 改变了 Java 的单体分组方法。Java 传统上由不同的包组成，现在转换为模块系统。总体而言，这种模块系统也允许开发者创建新模块。\n\
    \n更强的配置完整性 (Greater profile integrity)\n\n单体方法的 JDK 内部 API 存在严重风险。强封装允许 Java SE\
    \ 平台访问其内部 API。\n\n改进的性能 (Improved performance)\n\n模块化编程的概念可以提高性能。模块化编程提高了运行时访问资源，这在部署情况下也是真实的。\n\
    \n模块类型 (Module types)\n\nJDK 9.0 支持不同类型的模块，如下：\n\nJava SE 和 JDK 模块 (Java SE and\
    \ JDK modules)\n\n此类模块由 JDK 提供，以便开发者可以使用它们。例如：java.base、java.xml 等。\n\n具名模块 (Named\
    \ modules)\n\n开发者创建的模块称为命名模块。此类模块的配置在 module-info.java 文件中。通过该文件，模块声明了依赖关系以及导出到其他模块的资源。\n\
    \n自动模块 (Automatic modules)\n\n有时，应用程序使用 JAR 文件来启动模块化。通常，此类模块是通过类路径（classpath）识别的。\n\
    \n无名模块 (Unnamed modules)\n\nJDK 9.0 不仅有助于创建自定义模块，还将整个 JDK 划分为模块。\n\n列出 JDK模块 (Listing\
    \ modules)\n\nJDK 9.0 实现了以下原则：\n\n- 标准模块 (standard modules) 由 JCP 制定。\n- 内置模块\
    \ (built modules) 以 jdk 开头。\n\n`exports` 关键字表示对其他模块的权限。\n\n模块图 (Java module graph)\n\
    \nJava 模块图是不同模块及其关系的图形化表示。图 2.1 显示了示例模块图。早期，Java 结构有一个名为 java.lang 的基础包，现在已变为\
    \ java.base 模块。\n\n图 2.1：Java 模块图\n\n上述图显示了平台依赖的示例模块图。此类图帮助我们识别模块之间的关系。模块二对模块一的依赖关系由从第一个到第二个的线表示。在上面的图中，java.xml\
    \ 需要 java.base。此外，存在层级依赖关系。观察模块 java.rmi，它需要 java.logging，后者需要 java.base。\n\n\
    或者，可以通过 java 命令查看所有模块：\n\njava --list-modules\n\n上述命令给出以下输出：\n\n```\nD:\\Java\\\
    java-se-9-r1\\jdk-9\\bin>java --list-modules\njava.activation@\njava.base@\njava.compiler@\n\
    java.corba@\njava.datatransfer@\njava.desktop@\njava.instrument@\njava.logging@\n\
    java.management@\njava.management.rmi@\njava.math@\njava.rmi@\njava.scripting@\n\
    java.se@\njava.ee@\njava.security.jss@\njava.security.sasl@\njava.smartcardio@\n\
    java.sql@\njava.sql.rowset@\n```\n\n图 2.2：Java 模块列表\n\n我们通过提供命令列出单个模块的细节：\n\n\
    java -d module-name\n\n例如，如果我们想理解 java.base 模块的不同依赖关系，可以使用命令：\n\njava -d java.base\n\
    \n执行此操作，我们将得到以下输出：\n\n```\nD:\\Java\\Java-se-9-r1\\jdk-9\\bin\\java -d java.base\n\
    java.base@\nexports java.io\nexports java.lang\nexports java.lang.annotation\n\
    exports java.lang.invoke\nexports java.lang.module\nexports java.lang.ref\nexports\
    \ java.lang.reflect\nexports java.math\nexports java.net\nexports java.net.spi\n\
    exports java.nio\nexports java.nio.channels\nexports java.nio.channels.spi\nexports\
    \ java.nio.charset\nexports java.nio.charset.spi\nexports java.nio.file\nexports\
    \ java.nio.file.attribute\nexports java.security\nexports java.security.acl\n\
    exports java.security.cert\n```\n\n图 2.3：模块描述 (Module description)\n\n现在让我们讨论如何创建自定义模块，以及在处理模块系统时使用了哪些关键字。\n\
    \n声明模块 (Declaring the module)\n\n模块声明写在 module-info.java 文件中。在该声明内部，也配置了依赖关系。\n\
    \n可以声明模块：\n\nmodule modulename\n\n```\n{\n  // 配置依赖关系的模块体\n}\n```\n\n每个模块的体提供了当前模块正在使用的依赖关系或关系，包括：\n\
    \n- 当前模块利用服务的其他模块的包。\n- 当前模块暴露给其他模块的包。\n\nmodule-info.java 被称为模块描述符或元数据文件。该文件的声明必须以\
    \ module 关键字开头。模块的唯一名称紧跟其后，随后是封装在大括号中的模块，如上述语法所示。\n\n以下是 java.base 的包：\n\n- java.lang\n\
    - java.lang.invoke\n- java.lang.module\n- java.lang.reflect\n- java.net\n- java.security\n\
    - java.util\n\n![](img/59329c1d679476b235cda6f9ab47ba_25_0.png)\n\n"
