    ## Java Enhancement Proposals (JEP) in JSE 9.0


    As stated earlier, many proposals were discussed before the release of JSE 9.0.
    The entire list of JEPs for JDK 9.0 can be found on openjdk.java.net/projects/jdk9/.
    Out of which, JEP 200 had already been discussed and implemented in this chapter.
    Following are the important proposals for this version.


    ### JEP 102: API updates


    The motivation for this proposal was to improve the current Process API which
    communicates with the operating system. Traditionally, Java supports the API which
    can communicate with native operating system to start process. From JSE 7.0 it
    is transferred or redirected by the help of files, pipes etc. This API provides
    java.lang.Process and java.lang.ProcessHandle, which help improve the working
    processes.


    The class.lang.ProcessHandle will now give the process id which is specific to
    the operating system along the arguments, actual starting time of process and
    how much CPU time is accumulated.


    ### JEP 110: HTTP/2 Client (Incubator)


    This proposal was introduced to give new HTTP client API which implements HTTP/2
    and web socket. The legacy class HttpUrlConnection was considered to be too abstract
    for multiple protocols which are not functioning now days. Few of the behaviours
    of this class were not documented properly. Also, it was observed that it is used
    as a single thread model.


    All these motivated this proposal. The implementation of this API is not considered
    as part of JSE. Instead, namespace jdk.incub will be used to store this API. This
    API is designed so it can give the notifications for different events like headers
    received, errors, response generated etc.


    ### JEP 158: unified logging


    The JVM supports the logging facility to give the root-cause analysis for the
    application crash or performance related. But this is a bit complex, and difficult
    to understand the root causes of intermittent crash in the production mode.


    The objective of this is to introduce such a logging system which is common to
    all the components of the JVM. The messages in logs can be categorised using different
    tags like compiler, gc, classloaders, etc. Different levels are defined for logging
    as error, warning, info, debug, trace, developer. This gives the facility to select
    which message is logged based on what level.


    ### JEP 213: Mining Project Coin


    Project was already implemented in JSE 7.0. This proposal suggests improvements
    over the existing project:


    - Use @SafeVarargs on private instance methods: This annotation is applied to
    methods which cannot be overridden. This may include static methods and final
    methods as well.

    - Permitting final variables as resource in try-catch: Continuing from the use
    in JSE 7.0, now try-catch-with-resource is modified. In try-catch with resource,
    only final variable could be declared and initialized, which is closed automatically.
    Starting from JSE 9.0, one can use the final variable as a part of resource.

    - Usage of diamond operator with anonymous classes: The diamond operator could
    be earlier used only on separate classes, now can be used with anonymous classes
    as well. This was initially not agreed to by JSE 9.0 requirements.

    - Removal of underscore (_) in legal identifier


