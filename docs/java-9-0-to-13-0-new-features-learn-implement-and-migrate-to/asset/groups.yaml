    - JEP 355: 文本块（预览）\n\n# 目标\n\n在本章中，我们将讨论 Java13 中推荐的各种 JEP。虽然目前该版本的更新并不多，但有一些有趣的特性，如文本块和\
    \ switch 表达式，我们将进行详细讨论。\n\n# 下载 Java13\n\n目前，Java 13 作为 openjdk 的一部分可用。由于此版本仍处于开发过程中，完整的商业版本可以在\
