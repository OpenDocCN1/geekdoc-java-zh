    Multi-release JAR file


    As we move from version to another, there are possibilities that a single application
    may contain classes which are mapped to another version. This may arise because
    of reasons—either we are adding some new features from the new versions or we
    are upgrading the existing code to the new corresponding API. For some scenarios
    we can change or replace the existing API with a new API. But this may not be
    possible for all the scenarios as this will have an adverse effect to the existing
    client since they are using from older classes which would be removed. The generated
    to create a JAR file for application which will support the multiple versions
    of java and client will be able to use services from multiple versions in the
    same application.


    Now let us understand this concept by real time scenario.


    Consider the project SampleApp with the following structure:


    ![](img/593293c1d6794763b235cda6f9ab47ba_105_0.png)


