    现在让我们详细讨论这些特征：


    ### 弹性的 (Resilient)


    我们以最好的方式构建应用程序，但无法否认在实际运行时，应用程序可能会由于某些原因而失败。事实上，在少数情况下，整个应用程序会失败。大多数时候，应用程序的一部分停止工作。尽管只是局部，但从用户的角度来看，这就是应用程序失败。应用程序必须保持高度可用，即使部分故障也不应无响应。弹性为系统提供了在最关键的情况下保持响应的灵活性。


    可以通过以下方式实现弹性的：


    - 创建应用程序的副本并将其部署在不同的服务器上。

    - 将请求或应用程序的一部分委托给另一台服务器。

    - 隔离应用程序的组件，以确保应用程序的部分失败后可以恢复而不影响整个系统。


