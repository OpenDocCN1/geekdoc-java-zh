    \ Java 的早期开始就是如此。事实上，人们说它是最常使用的数据类型，因为 Java 投入了大量资源创建 String API 以方便开发者使用。在许多情况下，人们必须处理\
    \ Java 中的多行字符串，这需要添加转义序列来表示延续。这种转义序列使得代码变得复杂且不可读。如今，随着技术的进步，Java 代码允许将 HTML、SQL\
    \ 或 JSON 作为源代码的一部分进行插入。添加所有此类内容都是非常复杂的，因为我们需要使用特殊序列。因此，文本块是解决这一问题的方案，它是转义序列的替代方案。文本块是一个概念；它没有移除著名的\
    \ String API 或处理字符串的运算符的计划。\n\n通常，文本块是一组由定界符包围的字符。文本块使用三个引号作为字符串开始和结束的定界符。一旦你在\
    \ `\"\"\"` 中声明了字符串，你就可以忽略换行符。\n\n让我们来看一些可以使用文本块的示例：\n\n### 编写 HTML\n\n传统上，HTML\
