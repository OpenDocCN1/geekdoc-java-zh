    - JEP 150: Improved Date and Time API\n\nDefault and static methods in interfaces:\n\
    \nJSE8.0 provides default method implementation to interfaces. A developer can\
    \ specify that method definition in interface with the default keyword at the\
    \ beginning of the method signature. Such a facility is provided to the interface,\
    \ so that the implemented class does not implement the modified/added method.\n\
    \nIn addition to default, a developer can also define static methods in interfaces.\
    \ This facility is given by the interface so that all the implemented class can\
    \ use the services from such methods.\n\nFunctional interface and lambda expressions:\n\
    \nTypically, the functional interface introduced in JSE8.0 contains only one abstract\
    \ method. It gives only one functional to the implemented classes. Note that,\
    \ the functional interface can only have one abstract method, they can have any\
    \ number of default methods. Runnable, ActionListener, Comparable interfaces are\
    \ only some examples of functional interface.\n\nIn continuation with the functional\
    \ interface, the lambda expression implementation of instances of functional interface.\
    \ Lambda expression implements only an abstract function.\n\nConsider the following\
    \ code snippets:\n\n```\n//functional interface\ninterface MyInterface {\n   \
    \ void method(String data);\n}\n\n//application class\nclass Test {\n    public\
    \ static void main(String[] args) {\n        //lambda expression to implement\
    \ MyInterface, by default it implements method()\n        MyInterface m1 = (String\
    \ data) -> System.out.println(\"Hello, \" + data);\n        m1.method(\"John\"\
