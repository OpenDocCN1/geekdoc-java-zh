    JEP 322: time-based release


    JEP 223 will define the major, minor, and security update and apply it to version
    string. This was considered one of the significant improvements over the last
    version using JDK. This scheme worked for releases which were planned longer,
    it is not appropriate for six-month release model, planned by Oracle. That is
    this scheme is dependent on the differences observed between earlier version and
    JEP 322 proposes to change the version number in way that aligns with version
    it also update the release information in version string. This will make sure
    that developers will be able to guess the version release in advance. VNUM is
    a sequence of elements which are separated by period, this complete string is
    termed as version number. The first four elements of this string denote non-zero
    integer. Following details of all elements:


    $FEATURE.$INTERIM.$UPDATE.$PATCH


    E.g., if we consider version string as 10.0.2.1, then $FEATURE is 10, $INTERIM
    is 0, $UPDATE is 2, and $PATCH is 1.


    Note that version number can start with zero, because if it is zero then the next
    elements are omitted. Under six-month release model, the following are considerations
    of version string:


    $FEATURE is major release which is incremented every six months.


    $INTERIM is not considered officially in six-month release model.


    $UPDATE is indication of continuous updates.


    # API


    The following changes are implemented in API documentation for Runtime class implementing
    accessor methods for elements in version with int type. These access methods return
    the int value for feature(), interim(), and patch().


    Re-implementing the existing accessor methods, which represent major(), minor(),
    and security() to return the same values as feature(), interim(), and update(),
    respectively. This will give backward compatibility to developers.


    Deprecating the existing accessor methods, instead of removal. This will guide
    the developer to use the new methods.


    # System properties


    In system properties, the following two properties have been added:


    java.version.date:


    This denotes the date of release when it is made generally available. This is
    displayed in ISO-8601 YYYY-MM-DD format. If we are announcing early-access release
    then this denotes the planned GA date.


    java.version.version:


    This denotes the version string which is defined by the implementer. This can
    be assigned by an individual developer or even by organization, depending on some
    specific requirements.


    # Removed features and options


    Apart from the changes in the structure of programming, GC and compiler structure,
    there are other features which were removed from this version. A developer needs
    to understand these removals because a lack of this information will create issues
    while migrating the application on JDK10.0.


    Removal of support using LookLookAndFeel


    JDK10.0, all the application must stop using LookOnUiThread for UI presentation.
    The applications like Nimbus and Aqua now approached through different way of
    initializing the LookLookAndFeel.


    Removal of Runtime.getLocalizedOutputStream was used to generate OutputStream.
    From JDK1.1, the byte stream has been transferred to character stream. Earlier,
    Runtime.getLocalizedInputStream was used to generate InputStream. In Unicode,
    the classes InputStreamReader and BufferedReader. Similarly getLocalizedOutputStream()
    used to generate OutputStream has been replaced by classes OutputStreamWriter,
    BufferedWriter and PrintWriter. So, these methods were deprecated in the earlier
    version itself. Considering the very limited use of these methods, both methods
    have been removed from this version.


    Removal of RIM Server-Multiplex Protocol Support


    JSE9.0 had disabled the RIM Multiplex protocol, which the two endpoints in RIM
    could open multiple duplex connections to other endpoints. From JSE10.0, this
    support has been completely removed.


    Removal of Common DOM APIs


    From prior JSE1.0, Java used com.sun.java.browser.plugin.DOM and sun.plugin.DOMObject
    to read document structure. But then they were deprecated. Both these components
    have now been replaced by bytescape.javascriptObject to manipulate the DOM.


    Removal of FlatProfile


    FlatProfile was used to calculate the performance of application while executing
    different program segments. This was enabled by -Xprof VM argument. From JSE9.0,
    this was deprecated. From this version, this facility has been removed, making
    -Xprof unrecognizable by JVM.


    Removal of -Xoptions


    Java had provided many command line options. These could be provided to JVM which
    could affect the performance characteristic of Java HotSpot VM. Some of the are
    -Xss(Java stack size), -optimize(using JIT compiler), -Xbounds(bound user level).
    All such options were made obsolete in JSE9.0, and now they have been removed.


    Removal of HostServicesgetServletContext method


    This method was used to communicate with the page which contains JavaFX Applet.
    This was made obsolete in JSE9.0. Though this made obsolete, JDK had not introduced
    any alternative for this functionality. This method has now been completely removed.


