    \n## JEP 325: Switch expression\n\nJEP 325 proposed modifications in switch expressions.\
    \ From JDK12 onwards, you can use switch with either expression or statements.\n\
    \nTraditional switch in Java have some impediments that do not support the natural\
    \ way of thinking about the expressions after the conditions, as switch cases\
    \ only statements. There were also issues where break statements were kept as\
    \ an option for matching cases, as it creates lot of confusion when. This also\
    \ creates a very annoying fall-through situation if the break statements are absent\
    \ in the switch block. To overcome these impediments, the following modifications\
    \ are proposed in this JEP.\n\n### Change in expression label by using -> symbol\n\
    \nThe break statement when switch rules were considered to be a bottleneck in\
    \ testing the switch case is replaced by -> label. This makes the expression on\
    \ the right hand side to execute only if the left hand side case matches. Expression\
    \ label is considered to be the solution of the fall-through issue of traditional\
    \ syntax...case...break. The following snippet will show the usage of this label:\n\
    \n```\nswitch(variable)\n    case value1->expression1/statement;\n    case value2->expression2/statement2;\n\
