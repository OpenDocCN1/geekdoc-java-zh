    \nJDK 12 使用占位符名称：代表新时代。这代表时代已经更改，但尚未更新。一旦时代发生变化，它将在随后的 Java 版本中被修改。\n\n## ZGC\
    \ 并发卸载\n\n在垃圾回收过程中，释放未使用的类内存总是一个耗时的过程。此外，每个未使用的类都可能关联着许多数据结构或内存占用，这可能会影响应用程序的性能。通过\
    \ ZGC 的实现，垃圾回收过程的性能显著提升。但 ZGC 之前在类卸载过程中是没有作用的。在 Java 12 中，ZGC 现在支持类卸载。这种卸载是并发的，因为它不会影响\
    \ GC 时间。要禁用此功能，请在命令行使用 `-XX:ClassLoading` 。\n\n## 在替代内存设备上分配堆的老年代\n\n在讨论 Java\
    \ 11 的特性时，我们已经讨论了将堆移动到替代内存设备的概念。更进一步，Java 12 引入了另一种有趣的方法，你可以在替代内存设备上分配 Java 的老年代。此实验性功能在\
    \ G1 和并行 GC 中可用。\n\n大多数操作系统都可以通过文件系统与 NV-DIMM 内存设备通信。它们可以直接映射虚拟内存。你可以使用以下标志来指定此文件的路径：\n\
    \n```\n-XX:AllocateOldGen=\n```\n\n当启用此标志时，所有年轻代对象被隐式地放在 DRAM 中，而所有老年代对象被分配在\n\
    \n## 命令行标志 --XX+ExtensiveErrorReports\n\nJava12 为命令添加了另一个标志 `--XX+ExtensiveErrorReports`。此标志用于生成并记录更详细的崩溃信息，这些信息记录在\
    \ `hs_err` 日文件中。通常在生产版本中它是默认禁用的。作为开发者，我们可以在需要额外信息时决定开启它。如果你想这样做，请务必注意，因为这些量可能会很大。\n\
    \n## java.security.manager 属性的 disallow allow 选项\n\n`java.security.manager` 属性现在有了\
