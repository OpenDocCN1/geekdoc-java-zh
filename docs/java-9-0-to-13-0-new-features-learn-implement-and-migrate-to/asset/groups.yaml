    Long verificationNumber = 123456783456L;

    ```


    New File System API (NIO) :'
  - '[PAGE 18]


    SE7 introduced a modified API for IO and file operations through java.nio package.
    It also introduced one important class, Path which gives you accessibility to
    any path in the underlying operating system. Apart from traditional File API,
    this API provides different facilities like checking hidden file, creating symbolic
    links, searching files using wildcards etc.


    Improved exception handling:


    Prior to JSE7, we needed multiple catch blocks to handle multiple exceptions generated
    from the same try block as follows:


    ```

    try

    {

    }

    catch(ArithmeticException ae)

    {

    }

    catch(ArrayIndexOutOfBoundsException abe)

    {

    }

    ```


    In JSE7, a single catch block can handle multiple exceptions as follows:


    ```

    try

    {\}

    catch(ArithmeticException | ArrayIndexOutOfBoundsException e)

    {

    }

    ```


    G1 garbage collector:

    G1 stands for Garbage first. The main objective of this approach is to reduce
    the pause time to achieve high throughput. To achieve this, Java heap memory is
    split into multiple regions using 3 regions prior to JSE7.0 i.e. new, old, and
    permgen regions.


    G1 collector is used in application scenarios where:


    +   Application operates concurrently


    +   Application needs more predictable GC duration


    +   Application does not want to scale a lot of throughput performance


    +   Application does not require much larger Java heap.


    Improved concurrency with fork/join:


    JSE70 had introduced approach of handling concurrency, which handles the recursive
    algorithm. Unlike other frameworks, this implementation of Executor/Service works
    on the work-stealing algorithm. This facilitates better utilization of threads.
    Any thread/worker thread ideal, steals the task of other threads that are overloaded
    with work.


    JSE7 provides fork/join framework, which is the implementation of an interface.
    Normally, it is used in a situation where the work can be broken into smaller
    pieces recursively. Fork/join distributes the tasks to worker threads in the thread
    pool. The advantage of this framework is work-stealing algorithm. Worker threads
    that are no longer doing any task can steal the task from other threads that are
    busy.


    Version: JSE8'
  - '[PAGE 19]


    Release date: 18th March 2014


    This version introduced the JDK Enhancement Proposal (JEP), which is an organized
    way to propose and implement the new features to be included in the version. Oracle
    decided not to give any codename for version 8 onwards.


    Following JEPs were proposed in this version:


    +   - JEP 126: Language-level support for lambda expressions.

    - JEP 174: Project Nashorn, a JavaScript runtime to enable user to embed JavaScript
    in application

    - JEP 104: Annotations on Java types

    - JEP 150: Improved Date and Time API


    Following features introduced in this version:


    Default and static methods in interfaces:


    JSE8.0 provides default method implementation to interfaces. A developer can specify
    that method definition in interface with the default keyword at the beginning
    of the method signature. Such a facility is provided to the interface, so that
    the implemented class does not implement the modified/added method in the interface.


    In addition to default, a developer can also define the static methods in interfaces.
    This facility is given by the interface so that all the implemented class can
    use the services from such methods.


    Functional interface and lambda expressions:


    Typically, the functional interface introduced in JSE8.0 contains only one abstract
    method. It gives only one functional to the implemented classes. Note that, the
    functional interface can only have one abstract method, they can have any number
    of default methods. Runnable, ActionListener, Comparable interfaces are only some
    examples of functional interface.


    In continuation with the functional interface, the lambda expression implementation
    of instances of functional interface. Lambda expression implements only an abstract
    function.


    Consider the following code snippets:


    ```

    //functional interface

    interfaceMyInterface[


    voidmymethod(String data);

    }


    //application class

    classTest{

    public static void main(String[] args) {


    //lambda expression to implement MyInterface, by default it implements mymethod(


    MyInterface m1=(String data)->System.out.println("Hello, "+data);


    m1.mymethod("John");

    }


    Output -> Hello, John

    ```


    Java stream API:


    JSE8.0, introduced a new featured stream, which is used to process the collection
    of objects in a declarative way. Streams normally obtain a data from the collections,
    arrays or I/O channels. Streams by themselves don''t contain any object by default.'
