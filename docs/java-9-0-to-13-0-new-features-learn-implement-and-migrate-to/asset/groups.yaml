    # 第 4 章


    ## 深入学习 JDK 11


    ### 引言


    我们观察到从开发角度来看，JDK10 提供重大变化。当然，Oracle 声称每次发布 API 都会发生剧烈变化。但 Oracle 保证，根据基于时间的发布模型的新策略，他们每
    6 个月发布一次新版本。根据该模型，JDK11 于 2018 年 9 月 25 日发布。


    与 JDK10 类似，此版本在 API 上缺乏重大变化，这有助于开发者编写更好的、可扩展的应用程序。但 JVM 中有很多变化将提高应用程序的性能。JDK9
    中存在的许多未使用或弃用的特性已被移除，导致运行时的大小也大幅减小，从而提高了应用程序性能。


    # 结构


    - 基于嵌套的访问控制

    - 动态类文件常量

    - 改进 Aarch64 内置

    - Epsilon：无操作垃圾回收器

    - 移除 Java EE 和 CORBA 模块

    - HTTP 客户端（标准）

    - Lambda 参数的局部变量语法

    - 使用 Curve25519 和 Curve 448 的密钥交换

    - Unicode 10

    - 飞行记录 (Flight recorder)

    - ChaCha20 和 Poly1305 加密算法

    - 启动单文件源码程序

    - 传输层安全 (TLS) 1.3

    - ZGC：可扩展低延迟垃圾回收器（实验性）

    - 弃用 Nashorn JavaScript 引擎

    - 弃用 Pack200 工具和 API


    # 目标


    在本章中，我们将探索 JDK 11 引入的各种新特性。在 API 层面和架构层面有很多特性。我们将讨论所有这些为开发者的应用程序提供额外的灵活性。


    # 下载 JDK 11


