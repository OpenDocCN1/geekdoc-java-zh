    # JEP 327: Unicode 10


    In JDK10.0, Unicode 8.0 and Unicode 9.0 were added. Because of this, 7,500 characters
    and six new scripts were added which could be supported in Java. Unicode is a
    library which continuous relentlessly increase its collection. The next version
    of Unicode, i.e. Unicode 10, adds around 8,518 characters, the total count to
    136,690 characters. Along with this, it also includes 4 new scripts to make a
    total count of 139 script with 60 emojis.


    The following supports were added in this version of Unicode:


    +   Masaram Gondi, used to write Gondi in Central and South India.


    +   Nishu, used by women in China to write poetry and other discourses until the
    twentieth century.


    +   Soyombo and Zanabazar Square, used in Buddhist texts to write Sanskrit, Tibetan,
    and Mongolian.


    +   Syriacs used for writing Suriyani Malayalam, also known as Garshi and Syriac
    Malayalam.


    +   Gujarati signs, for the transliteration of the Arabic script into Gujarati
    by Ismaili Khoja communities.


    +   A set of 285 Hentaiagata characters used in Japan (historic variants of Hiragana
    characters).


    +   CJK Extension F (7,473 Han characters).


    Important symbol additions include:


    +   Bitcoin sign


    +   56 emoji characters


    +   A set of typicon marks and symbols


    As collections in Unicode are increasing, we must make sure that Java gets updated
    with the latest version of Unicode. This JEP is proposed to upgrade the APIs to
    support the new versions of Unicode.


    The following classes are proposed to be updated under this JEP:


    +   Character and String in java.lang package


    +   NumericShaper in Java.awt.font


    +   Bidi , Breakator and Normalizer in java.text package


    Please note, the following Unicode specifications will not be implemented by this
    JEP:


    +   UTS#10, Unicode collation algorithm


    +   UTS#39, Unicode security mechanism


    +   UTS#46, Unicode IDNA compatibility processing


    +   UTS#51, Unicode emoji


    JEP 328: Flight recorder


    When the application is in the running mode, there is a lot of internal processes
    going on. The time and resource required for these processes depends on many other
    utilities. It becomes extremely important to analyse these processes to identify
    the root of performance failure. A lot of tools have been introduced to do such
    analysis. Java Flight Recorder (JFR) is a tool which is used for collecting the
    data related to diagnostic and profiling the performance of application.


    Unlike other tools, this is an integral part of JVM, which does not cause any
    considerable overhead as far as the performance of an application is concerned.
    JFR can be used for profiling, black box analysis, and debugging. JFR primarily
    collects the data which is generated via events. These events can be JVM events
    or application events.


    JFR is disabled by default. This can be enabled with -XX+FlightRecorderAttribute
    with Java command. Please note being that a commercial feature, JFR is only available
    in the commercial version of Java.'
