    ......: }


    created class Sample

    mymode:


    之前我们讨论过，只要你处于当前的 JShell 实例或当前会话，设置就会一直保留。但可以使用 `--retain` 选项来自定义行为，如下所示：


    mymode: /set feedback mymode --retain


    执行此命令后，如果你退出当前会话并重新生成 JShell，你将仍然获得名为 `mymode` 的反馈模式。


