  mdcn: "\n\n## 集合框架 (Collection framework)：\n\n集合是嵌入在单个单元中的对象组。在 JDK 1.2 之前，开发者使用数组、vector\
    \ 或哈希表。这些对象提供了服务，但它们之间没有通用的接口或方法，导致开发者需要使用不同的方法来访问集合。\n\n随着时间的推移，Java 推出了集合框架\
    \ API 形式的通用接口结构。该 API 提供了如 set、list 或 map 等不同接口。实现这些接口的类提供了一套通用方法，使得开发者能够更有效地使用服务。\n\
    \n### strictf 关键字：\n\n在 JDK 1.2 之前，处理浮点数据类型一直是脆弱的。浮点数据依赖于平台，因此浮点数据的精度是无法保证的。`strictf`\
    \ 关键字解决了这个问题，它遵循了 IEEE 754 标准。\n\n以下是此版本中实现的库更改/更新：\n\n- 即时编译 (JIT) 的实现\n- Java\
    \ 插件 (plug-in)\n- Swing 图形 API\n\n## 版本：JSE1.3\n\n发布日期：2000年5月8日\n\n此版本主要关注部署方面的修改，以及通过\
    \ Java Hotspot Client 提高 applet 性能。该版本的代号为 Kestrel。以下是此版本的主要更新：\n\n### Jar 索引\
    \ (Jar indexing)：\n\n当应用程序分布在 JAR 文件中时，在运行时查找所需的类会变得困难。如果项目规模较大，这个问题会更加复杂。Java\
    \ 建议对 JAR 文件进行索引。整个目录信息存储在 `index.list` 文件中，使得类的搜索变得简单。\n\n### 改进的 applet 缓存 (Improved\
    \ applet caching)：\n\napplet 缓存是此版本提供的一个重要插件，它确保每次请求 applet 时，不一定需要与服务器通信。同一个缓存可以用于不同的网页来获取\
    \ applet。这提高了网页的加载速度。\n\n### 可选包安装 (Optional package installation)：\n\nJava 运行时从\
    \ `rt.jar` 文件所在的 `jdk/bin` 搜索文件。lib/ext` 和 `jre/lib/ext` 目录结构包含了可选包。在运行时，Java\
    \ 在环境变量路径中搜索文件。如果在运行时未找到类，则会在可选包安装目录中搜索。\n\n### Java 命名和目录接口 (JNDI)：\n\nJava 命名目录接口\
    \ (JNDI) 是一种为使用 Java 语言编程的应用程序提供命名和目录功能的 API。它被定义为独立于任何特定的目录服务实现。这些各种目录——新的、新兴的以及已有的——可以通过通用方式进行访问。\n\
    \n## 版本：JSE1.4\n\n发布日期：2002年2月6日\n\n这是在 JCP JSR59 建议下发布的第一个版本。你可以在此处找到更多细节：https://jcp.org/en/jsr/detail?id=59。该版本的代号为\
    \ Merlin。该版本的公共支持和安全更新于 2008 年 10 月结束。此版本中完成了以下主要更新：\n\n### 语言变更：\n\n### Assert\
    \ 关键字：\n\n断言 (assertion) 为你提供了一种功能，允许开发者/测试人员测试程序中的假设。断言通常包含一个布尔表达式，当开发者编写的内容正确时则执行断言；如果为假，系统将抛出错误。\n\
    \n### 库改进 (Library improvements)：\n\n### 正则表达式 (Regular expressions)：\n\nJava\
    \ 提供了搜索、编辑或处理文本和数据的机制。\n\n### 链式异常 (Chained exceptions)：\n\n有时 Java 代码会捕获一个异常并抛出另一个。为了克服开发者的尴尬局面，引入了链式异常处理。\n\
    \n### Java Web Start：\n\n该软件允许用户从网页下载并运行应用程序。这提供了点击访问应用程序的便捷方式，并避免了复杂的安装过程。虽然这些是网页的重要组成部分，但\
    \ Java Web Start 自 JSE9.0 起被弃用，并在 JSE11.0 中完全移除。\n\n### XML 处理 (XML processing)：\n\
    \nJava 引入了用于验证和解析 XML 文档的 API。在此版本中引入了一些基础接口：文档对象模型 (DOM) 和简单 XML API (SAX)。\n\
    \n### 日志 API (Logging API)：\n\n日志是 Java 引入的一个重要特性，在程序执行时维护记录。这些记录通常由 `Logger`\
    \ 对象创建。\n\n### 偏好 API (Preference API)：\n\n该 API 提供了存储程序配置的有效方法。数据通常存储在键值对中。它提供了\
    \ get 和 put 方法来访问数据。\n\n## 版本：JSE5.0\n\n发布日期：2004年9月30日\n\n此版本无疑是 Java 开发周期中最重要的更新之一。此版本中添加了许多新功能。最初命名为\
    \ JDK 1.5，后来重命名为 JSE5.0。代号为 Tiger。该版本的公共支持和安全更新于 2009 年 11 月结束。此版本提供了以下主要更新：\n\
    \n### 语言变更：\n\n### 泛型 (Generics)：\n\n类似于 C++ 中的模板，Java 中的泛型为开发者提供了一种使用类型参数编写类、方法和接口的功能。使用泛型为开发者带来了好处：\n\
    \n- 类型安全\n- 消除强制转换\n- 性能提升\n\n为了理解这一概念，请观察创建泛型类的代码片段：\n\n```java\nclass Sample{\n\
    \  T obj;\n\n  Sample(T obj){\n    this.obj=obj;\n  }\n\n  public T getObj(){\n\
    \    return this.obj;\n  }\n}\n```\n\n上述泛型类将 T 定义为占位符，这意味着可以在运行时推送任何数据类型。现在让我们检查此应用程序：\n\
    \n```java\nClass SampleApp{\n  public static void main(String[] args) {\n    Sample\
    \ s=new Sample(10);\n    System.out.println(s.getObj());\n  }\n}\n```\n\n当编译这两个文件并执行\
    \ SampleApp 时，可以看到以下输出：\n\n```\nD:\\chapter1-insight of versioning>java SampleApp\n\
    10\n```\n\n图1.1：泛型实现\n\n### 增强型 循环 (Enhanced for loop)：\n\n引入此循环是为了更高效地遍历数组。\n\
    \n```java\nfor(int x :myArray){\n  System.out.println(x);\n}\n```\n\n上述增强循环遍历了名为\
    \ myArray 的整数类型集合。\n\n### 自动装箱/自动拆箱 (Autoboxing/unboxing)：\n\n自动装箱是一个自动过程，Java\
    \ 将原始数据类型转换为对应的包装对象，例如转换为 Integer。参考以下代码片段：\n\n```java\nInteger x = 10;\n```\n\
    \n在这里，原始值 10 被赋值给其对应的包装对象。\n\n拆箱正好是相反的过程。在这个过程中，包装对象被转换为对应的类型，例如 Integer 转换为 int，Double\
    \ 转换为 double 或 Float 转换为 float。参考以下代码片段：\n\n```java\nInteger x = 10;\nint y =\
    \ x;\n```\n\n### 可变参数 (Varargs)：\n\nJava 引入了一项功能来减少相似数据类型的重载方法数量。此特性被称为 varargs，代表变长参数。\n\
    \n该方法接收任意数量的参数如下所示：\n\n```java\npublic static int addition(int... x) {\n    //业务逻辑\n\
    }\n```\n\n上述代码片段声明了接受 int 类型可变参数的方法。这意味着开发者可以通过传递任意数量的整数参数来调用此方法：\n\n```\nint\
    \ a = addition(10,20);\nint b = addition(10,23,12,43);\nint c = addition(12,43,12,43,12);\n\
    ```\n\n### 静态导入 (Static imports)：\n\n在情况下，Java 需要导入公共静态成员，这些成员可能包含其他类的字段或方法。JSE\
    \ 5.0 为开发者提供了静态导入功能，使用它可以在程序中引用静态成员，而无需编写它们所在的类引用。\n\n以下导入语句描述了如何在程序中导入静态常量。\n\
    \n```java\nimport static java.lang.Math.PI;\nimport static java.lang.Math.pow;\n\
    import static java.lang.System.out;\n```\n\n"
