    \ support for this version ended in April 2015.\n\nThe major changes in this version\
    \ are as follows:\n\nType inference/diamond operator:\n\nJSE7.0 provides new version\
    \ of diamond operator. Type inference is the process of inferring the data type\
    \ at initialization. Developers can now replace the arguments with an empty type\
    \ parameter <, which is known as diamond operator.\n\nPrior to JSE7.0:\n`List<String>\
    \ myList = new ArrayList();`\n\nJSE 7.0 onwards:\n`List<String> myList = new ArrayList<>();`\n\
    \nString in Switch case statement:\n\nJSE7.0 modified the traditional switch case\
    \ format. In the earlier versions, switch case didn't perform the string format\
    \ as its cases. From JSE7.0 developers could also use string literals as the case.\n\
    \nAutomatic resource management:\n\nPrior to JSE7.0, the developer could fully\
    \ block to ensure the resource is closed whether exception occurs or not. So traditional\
    \ exception handling would consist of try, catch and finally blocks.\n\nFrom JSE7.0,\
    \ a developer can create try-with-resources. Here, the resource is autocloseable.\
    \ A developer can initiate any number of resources. These resources are closed\
    \ automatically when the program is finished. Any object that implements java.lang.AutoCloseable\
    \ can be used as a resource.\n\nFollowing snippet shows the try-with resource\
    \ statement in JSE7.0:\n\n```\ntry (Statement stmt = conn.createStatement())\n\
    ```\n\nNumeric literal with underscore:\n\nFrom JSE7.0, a developer can use numerical\
