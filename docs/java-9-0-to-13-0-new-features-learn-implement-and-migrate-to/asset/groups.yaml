- md: "\nexports\n\nprovides..with\n\nuses\n\nrequires\n\nThis directive denotes the\
    \ dependencies of one module on another. Typically, such a relationship is termed\
    \ as module dependency. When you define your own module, you must define the dependencies.\
    \ So, when module1 requires module2, module1 is said to read module2 and module2\
    \ is read by module1.\n\nSo, the definition of module1 will look like:\n\n```\n\
    module1\n{\nrequires module2;\n}\n```\n\nOne need to make sure that module2 can\
    \ not be dependent on module1, which is called as symmetric relationship. Such\
    \ relationship is not permitted in Java module system. All modules in Java must\
    \ be asymmetric else cyclic dependencies will be created, which are not allowed.\
    \ As already stated, every module automatically reads the java.base module, for\
    \ which one need not use java.base identifier.\n\nrequires transitive - implied\
    \ readability\n\nLet us consider one interesting scenario:\n\n![](img/593293c1d6794763b235cda6f9ab47ba_27_0.png)\n\
    \nFigure 2.4: Implied readability\n\nIn the above scenario, module1 depends on\
    \ module2, module2 depends on module3 and module1 also depends on module3.\n\n\
    Traditionally this structure can be written like:\n\n```\nmodule1\n{\nrequires\
    \ module2;\n}\nmodule2\n{\nrequires module3;\n}\n```\n\nThis assumption would\
    \ be if module1 can use the services of module2 and module2 in turn can use services\
    \ of module3, indirectly module1 can use the services from module3.\n\nCaution!!\
    \ Java module systems think of this in different way. module1 cannot read module3\
    \ unless until it explicitly configures the dependencies like:\n\nmodule1\n\n\
    ```\n{\n  requires module2;\n  requires module3;\n}\n```\n\nThough this gives\
    \ you the solutions in this basic scenario, in many complicated scenarios we may\
    \ not know the internal dependencies of the modules when we want to generate such\
    \ dependencies automatically. Frankly, Java 9 had declared the keyword transitive.\
    \ Transitive declarations create relational dependencies. i.e. if module1, requires\
    \ module2, and module2 in turn requires module3, using transitive keyword in module2\
    \ configuration, module3 establishes the relationship with module1 without explicitly\
    \ declaring it.\n\nIn our scenario, we can configure this as follows:\n\n```\n\
    module1\n{\n  requires module2;\n}\nmodule2\n{\n  requires transitive module3;\n\
    }\n```\n\nIn the above configuration, module3 is readable by module2 as well as\
    \ module1.\n\nrequires static\n\nIn few cases, API developers write the code when\
    \ one module creates references to another module. But, user of the API never\
    \ intends to use this relationship at runtime. Such a dependency is termed optional\
    \ dependency and can be created by using compile-time-only dependency. The directive\
    \ used in such a case is requires static, which can be written as follows:\n\n\
    module1\n\n```\n{\n  requires static module2;\n}\n```\n\nexports\n\nEarlier, we\
    \ had seen how the directive establishes the dependencies between one module and\
    \ another. However, only requires doesn't give you the facility to use the components\
    \ from the other module. Apart from this, the module you want to refer to, must\
    \ permit the other modules to use the service or components. The directive exports\
    \ specified which components (to be specific packages) and their public types\
    \ are accessible to other modules.\n\nThe following snippet will show you the\
    \ declaration of module which exports the packages to other modules:\n\n```\n\
    module2\n{\n  exports package1.package2;\n}\n```\n\nApart from using exports,\
    \ modules can also give the permissions to specific modules by using exports...\
    \ to. Such exports are called qualified exports.\n\nThe following snippet shows\
    \ the declaration of which exports packages to specific modules:\n\n```\nmodule\
    \ module3\n{\n  exports com.package1 to module1,module2\n}\n```\n\nuses\n\nApart\
    \ requires which refers to the module, the module can also use the services from\
    \ other classes using keyword. Here, a module is considered to be a service consumer.\
    \ Any class, which implements the interface or extends the abstract class mentioned\
    \ in this directive is called as a service object.\n\nprovides...with\n\nIn continuation\
    \ with the uses, this keyword specifies service implementation provided by the\
    \ current module. Thus, it makes the module a provider.\n\nNow, as we have gone\
    \ through different aspects of modules, their configuration, it's time to implement\
    \ the module. We will be starting with very basic implementation of single module,\
    \ and then we will be following up with inter-modules communications.\n\nTo work\
    \ with JPMS, we need to first download Java 9 on our system.\n\nDownload Java\
    \ 9\n\nYou will get the archive of older version (prior to Java 12) on the following\
    \ url:\n\n```\nhttps://jdk.java.net/archive/\n```\n\n| Windows | 64-bit |\n| :---\
    \ | :--- |\n| Mac | 64-bit |\n| Linux | 64-bit |\n| 9.0.4 | 64-bit |\n| macOS\
    \ | 64-bit |\n| Linux | 64-bit |\n| 9.0.1 | 64-bit |\n| Linux | 64-bit |\n| 9\
    \ GA | 64-bit |\n| Linux | 64-bit |\n\nopenjdk-10_windows_x64_bin.tar.gz (sha256)\
    \ 190 MB\nopenjdk-10_osx_x64_bin.tar.gz (sha256) 192 MB\nopenjdk-10_linux_x64_bin.tar.gz\
    \ (sha256) 195 MB\nopenjdk-9.0.4_windows_x64_bin.tar.gz (sha256) 190 MB\nopenjdk-9.0.4_osx_x64_bin.tar.gz\
