    Support for private interface method.


    Starting from JSE8.0, when default implementation for interface was introduced,
    private methods were under discussion. From JSE 9.0 onwards, one could declare
    and define the private methods in interface, which enables the non-abstract methods
    in interface to share the data or communicate with them.


    However, you have to go through the following rules while declaring private interface
    method:


    Method cannot be abstract.


    Written only within interface.


    If the method is private & static it can be used inside other method of the interface
    which can be static or non-static.


    If the method is non-static it cannot be used inside private static method.


    JEP 214: remove GC combinations deprecated in JDK 8


    From the beginning, a lot of work has been done for garbage collection. Due to
    the need for backward compatibility, all GC implementations are of API which generates
    lot of maintenance cost. Though the earlier GC implementations were marked as
    deprecated, there is a need to remove some GC approaches to improve the performance
    and the maintenance.


    Due to which, all the warning messages will not be over-turned and HotSpot GC
    will reduce the number of bugs.


    E flags and flag summaries will be working under this proposal:


    DefNew + CMS: -XX +UseParNewGC -XX +UseConcMarkSweepGC


    ParNew + SerialOld: -XX +UseParNewGC


    ParNew + CMS: -Xngc


    ParNew + CMS: -XX +CMSIncrementalMode -XX +UseConcMarkSweepGC


    DefNew + CMS: -XX +CMSIncrementalMode -XX +UseConcMarkSweepGC -XX-UseParNewGC


    CMS foreground: -XX +UseCMSCompactAllCollection


    CMS foreground: -XX +UseCMSFullGCsBeforeCollection


    CMS foreground: -XX +UseCMSCollectionPassing


    JEP 220: module-run-time images


    With the implementation of JVMs, the structure of Java programming is shifted
    from packages to modules. JEP 220 proposes to accommodate modules and other resources
    in JRE images. The legacy JAR file format was monolithic, and the entire JDK was
    bundled into single JAR file. Because of creating a JRE runtime image was time
    consuming, and it also required more. This JEP can locate the class and resource
    file on a module basis.


    To understand this, let us discuss how the runtime image differs from the module
    image:


    # Legacy run-time image structure


    There were two types of runtime images in the earlier versions of Java. JRE, which
    implemented JSE and JDK which embedded JRE and development tools. JRE images consist
    of lib and bin folder. Folder bin, consists of essential executable binaries and
    java for launching runtime system. The other lib folder contains library files,
    property files etc. This also includes most rt.jar which contains runtime system''s
    Java classes and resources.


    JDK image consists of JRE in its entry. This also contains bin directory, which
    contains command line tools for development and debugging. The lib directory contains
    various JAR files, one of them is tool.jar, which contains the classes for javac
    compiler.


    # Modular run-time image


    The new structure of modular-run image comprises the bin directory. Inside this,
    the command-launchers are present, which are defined by modules. Another important
    directory is conf, which stores the properties, the policies etc. Earlier information
    was stored in lib directory. The release file is present in the root directory.
    This is generated by the build system. The release file also defines a property
    called MODULES, to'
