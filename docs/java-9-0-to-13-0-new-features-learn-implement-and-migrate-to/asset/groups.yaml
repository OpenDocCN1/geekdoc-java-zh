    Until now we have discussed many things about the publisher and the subscriber,
    however, the discussion would be incomplete without discussing the very important
    concept of backpressure.


    # Backpressure


    The process by which the number of items is restricted according to a subscriber''s
    wilt to accept is called backpressure. The backpressure plays a vital role in
    prohibiting the overhead of the subscriber. As the load on subscriber increases
    the publisher pushes items with higher speed than the rate by which the subscriber
    can consume them. Now, the system will respond very, hampers its performance,
    which may lead to the system failure. Or, items published by the publisher which
    are in a queue waiting for their turn will be dropped. The backpressure will reduce
    the load on the subscriber.


    We have the Producer and the Consumer scenario, which leads to the following two
    possible situations:


    The pipeline will work smoothly, when the consumer consumes the data faster than
    the data emitted by the producer.


    The situation runs into a problem, when the rate of data emitted by the Producer
    is more than the rate at which it is consumed by the consumer. Here, the consumer
    will be flooded with data.


    The backpressure will be pretty clear from the diagram below.


    ![](img/593293c1d6794763b235cda6f9ab47ba_143_0.png)


    Figure 7.15: The backpressure flow


    Under normal situations, we don''t have to worry, however, we may need to be in
    a later stage. If the situation is not handled properly, we will be at risk of
    losing the data. We need to apply one of the following strategies to avoid loss
    of data:


    Use of buffers: We can allocate the buffer to store data. The use of buffer is
    a good option, but it has one drawback. The buffer has a limited capacity, and
    we can run out of memory at some point.


    Dropping the excess data is the most undesirable situation in which we won''t
    consider the excess data loseit directly. In case of a software, it is totally
    undesirable, however, under certain circumstances we may consider this.


    Blocking the data: As the consumer is taking more time to consume the data, the
    flow of the data to the consumer is blocked with previous data. As the flow is
    blocked, it results in slowing down of the entire flow.


    The developers can choose any one of the above discussed ways or even a. Anypreferred
    technique with which the developer deals with the situation is known as backpressure.
    It is a kind of signalling in the opposite direction of the normal flow of data.


