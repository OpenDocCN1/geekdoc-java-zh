    # Last-drop latency improvements


    Some of the applications in Java are latency-driven. The applications like signal
    processor, or control unit of radar rely heavily on timely delivery. Of course,
    this timely delivery is dependent on how the memory is utilized by the application.
    So, the developer needs to understand the memory footprints. Sometimes, we need
    to allow some of garbage-free applications. In such cases, the GC cycle might
    give an issue. One of the solutions is to restart the JVM. But otherwise, we can
    effectively use no-op GC.


    # Last-drop throughput improvements


    Java gives you option to select GC through configuration. In this process we need
    to also choose the barrier that the workload uses. This often happens even for
    no-allocation workload.


    So, such selection can generate at least one reference barrier. If we want to
    avoid this, can bring a throughput improvement.


    Note that Epsilon GC works differently from normal GCs. There is no GC cycle in
    this. Epsilon GC only allocates memory and doesn''t release any allocated memory.
    So in most of the cases, the application is likely to crash after JVM is exhausted.
    So initially, you may feel that this is a dangerous approach, but when it comes
    to testing it turns up as an advantage. As reclamation is not done here, one can
    think of implementing other GC on top of this to reclaim memory.


    One of such GC implementation is LISP-2 size Mark-Compact GC. This GC slides down
    to the start of the heap. Following are the characteristics of this GC:


    The allocation order is maintained. This is helpful to control the memory layout.


    This is linear for object storage. Though this seems to be a good approach, this
    with a cost--this requires the revision of walk through at least 4 times.


    There is no need to reserve the heap memory to remove the live objects. So, even
    if you have 100 % (almost not 100 %) allocated, it still works.


    It facilitates the zero footprint when GC is not active. It always tries to make
    the allocation area more compact, whatever be occupied.


