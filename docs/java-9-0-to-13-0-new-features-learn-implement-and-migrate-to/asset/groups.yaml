    ## JEP 316: Heap allocation on alternate memory devices


    From the beginning, Java had a standard approach towards objects which are stored
    in the memory. Traditionally, anything which is created in the application is
    stored in the heap. The performance of the application normally depends on how
    this heap memory works with the object storage. To improve the performance of
    the application, Java is constantly working for the up-gradation or modification
    in garbage collector, which is used to release the memory occupied by the objects
    in the heap.


    But with increasing size of applications, the heap memory has been falling short
    of even temporarily storing the objects. This JEP proposes to use alternate memory
    devices as heap objects are stored. There are NV-DIMM which can be used for this
    purpose.


    NV-DIMM stands for Non-Volatile In-line Memory Module. Such devices use Random
    Access Memory (RAM) for data storage. The main advantages of these devices are
    that they can restore the data if there is a power failure or system crash. NV-DIMM
    devices use the volatile memory to store data, and in case of power failures they
    push the data to the non-volatile memory.


    Java can utilize devices in the following scenarios:


    - When the application is running on different JVMs with different services, some
    services may have lower priorities, which can be pushed by NV-DIMM so that the
    higher priority services use the secondary storage devices to access them promptly.

    - Applications like big data require higher memory for object storage. Instead
    of using the traditional heap, we can use NV-DIMM devices.

    - Operating systems like Windows Server already have implementation of NV-DIMM
    in file format.


    The following option is used to enable:


    ```

    XX:AllocateHeap=+

    ```


    Note that this JEP does not recommend sharing the object which are running in
    parallel.


