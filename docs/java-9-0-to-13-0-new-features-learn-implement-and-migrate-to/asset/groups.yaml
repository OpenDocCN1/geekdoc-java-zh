    JEP 322: 基于时间的发布


    JEP 223 将定义主版本（major）、次版本（minor）和安全更新（security update），并应用于版本字符串。这被认为是相比上一个 JDK
    版本的重大改进之一。该方案适用于计划周期较长的发布，但不适用于 Oracle 规划的六个月发布模型。也就是说，该方案依赖于早期版本观察到的差异，而 JEP
    322 提议以符合版本逻辑的方式更改版本号，使其与版本保持一致，同时也更新版本字符串中的发布信息。这将确保开发者能够提前预测发布版本。VNUM 是一个由点分隔的元素序列，这整个字符串被称为版本号。该字符串的前四个元素表示非零整数。以下是所有元素的详细信息：


    $FEATURE.$INTERIM.$UPDATE.$PATCH


    例如，如果我们将版本字符串考虑为 10.0.2.1，那么 $FEATURE 是 10，$INTERIM 是 0，$UPDATE 是 2，$PATCH 是 1。


    注意，版本号可以以零开头，因为如果它是零，则后续元素将被省略。在六个月发布模型下，版本字符串的考量因素如下：


    $FEATURE 是主版本，每六个月增加一次。


    $INTERIM 在六个月发布模型中不被正式考量。


    $UPDATE 是持续更新的指示。


    # API


    Runtime 类的 API 文档实现了以下更改，为版本中 `int` 类型的元素实现了访问方法。这些访问方法返回 `feature()`、`interim()`
    和 `patch()` 的 `int` 值。


    重新实现现有的访问器方法，分别代表 `major()`、`minor()` 和 `security()` 返回与 `feature()`、`interim()`
    和 `update()` 相同的值。这将为开发者提供向后兼容。


    对现有的访问器方法弃用而非删除。这将引导开发者使用新方法。


    # System properties


    在系统属性中，增加了以下两个属性：


    java.version.date:


    这表示其广泛可用（generally available）时的发布日期。采用 ISO8601 格式 YYYY-MM-DD。


    java.version:


    这表示由开发者定义的版本字符串。


    # Removed features and options


    除了编译器的结构更改外，还有其他特性从该版本中移除。在 JDK10.0 中，由于缺少这些特性，应用程序可能会出现问题。


    # Removal of support using LookLookAndFeel


    在 JDK10.0 中，停止使用 LookLookAndFeel 来初始化应用程序。


    # Removal of Runtime.getLocalizedOutputStream


    `Runtime.getLocalizedOutputStream` 用于生成输出流。从 JDK1.1 开始，字节流已转换为字符流。同样，`Runtime.getLocalizedInputStream`
    用于生成输入流已被 `InputStreamReader` 和 `BufferedReader` 替换。`getLocalizedOutputStream()`
    生成输出流已被 `BufferedWriter` 和 `PrintWriter` 替换。这些方法在早期版本就被弃用了。考虑到这些方法的使用非常有限，两者都已从版本中移除。


    # Removal of RIM Server- Support Support


    Java 禁用了 RIM 复用协议，两个端点可以打开多个连接。在 JSE10.0 中，该支持已被完全移除。


    # Removal of Common DOM APIs


    在之前的 JSE1.0，Java 与包含 JavaFX Applet 的页面通信使用了 `com.sun.java.browser.plugin.DOM`
    和 `sun.plugin.DOMObject` 来读取文档结构。但随后它们被弃用了。这两个组件现在已被操作 DOM 的 `bytescape.javascriptObject`
    替换。


    # Removal of FlatProfile


    FlatProfile 用于计算执行不同程序段时的性能。通过 `-Xprof` VM 参数启用。在 JSE9.0 中，它被弃用了。从该版本开始，该功能已被移除，导致
    JVM 无法识别 `-Xprof`。


    # Removal of -Xoptions


    Java 提供了许多选项。这些选项提供给 JVM 可以影响 Java HotSpot VM 的性能特性。例如 `-Xss`（Java 栈大小）、`-optimize`（使用
    JIT 编译器）、`-Xbounds`（边界用户级）。此类选项在 JSE9.0 中均已废弃，现在已被移除。


    # Removal of HostServicesgetServletContext method


    该方法用于与包含 JavaFX Applet 的页面通信。它在 JSE9.0 中被废弃。尽管已废弃，但 JDK 尚未引入任何该功能的替代方案。该方法现在已被完全移除。


    # Removal of deprecated Pre-1.2 SecurityManagers and fields


    以下标记为 `forRemoval=true` 的预 1.2 弃用 `java.lang.SecurityManager` 方法和字段已被移除：


