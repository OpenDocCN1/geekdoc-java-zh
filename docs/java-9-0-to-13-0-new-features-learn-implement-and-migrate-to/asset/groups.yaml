    ScriptEngine engine=new ScriptEngineManager().getByName(\"nashorn\");\nengine.eval(\"\
    \"\"function printHello() {\nprint(\"Hello, world\");\n}\nprintHello();\");\n\
    ```\n\n你可以从示例中观察文本块如何让你的代码变得整洁易读。而且，它很简单，不是吗？\n\n了解文本块的后台处理是非常有趣的。当编译器在代码中找到文本块时，会生成以下处理：\n\
