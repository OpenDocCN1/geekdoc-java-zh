    Override module configuration


    The dependencies between the modules are configured in module descriptor file
    i.e. module-info.java. But many times, instead of generating the dependencies
    at the time of compiling, we need to give such dependencies dynamically. This
    concept is termed as overriding the module configuration.


    There are three command line flags to javac and Java commands to override module
    specific configuration:


    +   -add-reads

