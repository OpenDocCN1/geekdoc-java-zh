    ## JEP 316: 在交替内存设备上的堆分配


    从开始，Java 对存储在内存中的对象有一种标准方法。传统上，应用程序中创建任何内容都存储在堆中。应用程序的性能通常取决于堆内存如何与对象存储工作。为了提高应用程序的性能，Java不断对垃圾回收器进行升级或修改，它用于释放堆中对象占用的内存。


    但随着应用程序规模的增大，堆内存甚至无法临时存储对象。此 JEP 提议使用替代内存设备作为堆对象的存储地。NV-DIMM 可用于此目的。


    NV-DIMM 代表非易失性内存模块（Non-Volatile In-line Memory Module）。此类设备使用随机访问内存（RAM）进行数据存储。这些设备的主要优势是如果发生断电或系统崩溃，它可以恢复数据。NV-DIMM
    设备使用易性内存存储数据，在发生断电的情况下，它们会将数据推送到非易失性内存中。


    Java 可以在以下场景利用设备：


    - 当应用程序在具有不同服务的不同 JVM 上运行时，某些服务的优先级较低，可以由 NV-DIMM 推送，以便高优先级的服务使用辅助存储设备快速访问它们。

    - 大数据等应用程序需要更高的内存进行对象存储。与其使用传统的堆，我们可以使用 NV-DIMM 设备。

    - 像 Windows Server 这样的操作系统已经在文件格式中实现了 NV-DIMM。


    使用以下选项来启用：


    ```

    XX:AllocateHeap=+

    ```


    请注意，此 JEP 不建议共享并行运行的对象。


