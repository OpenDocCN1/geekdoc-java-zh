    \n# 使用 JShell\n\n# 引言\n\n许多编程语言都有一些复杂的概念，在使用它们之前需要进行测试。遗憾的是，开发者大多数时候没有选择，编写一个完整的程序来测试这些概念。此外，有时可能会有复杂的算法，需要对其实现的正确性进行测试。与之前的情况类似，为了测试这一点，开发者需要编写完整的代码或应用程序。虽然这很重要，但非常耗时，而且对此类应用程序的修改需要重新编译整个应用程序。那么，为什么不提供一种机制，让开发者不需要编写完整的代码，而是只需编写片段并检查所需的结果呢？\n\
    \n这就是读取-求-打印（REPL）概念的用处。这是一个开发者可以在其中编写代码段而不是编写完整程序的控制台。一些像 Python 和 Node 这样的编程脚本语言具有这种实现。多年来，Java\
    \ 开发者一直在等待这样的功能。虽然以前在 Closure 和 Groovy 等其他支持 JVM 的语言中已经存在，但 Java 并不支持。最后，在 JDK\
    \ 9 引入了 REPL，称为 JShell。\n\n以下是 REPL 的主要用途：\n\n- 检查解释器的简单代码和行为\n- 学习新概念的工具\n- 与临时场景（adhoc\
    \ scenarios）交互的环境\n\n（Adhoc 是用于快速且不可重用代码的临时代码。有时也被称为脏代码）\n\n简单来说，这是一个工具，你可以在其中输入命令，这些命令将在无需编写整个\
    \ Java 代码的情况下执行。\n\n# 结构\n\n# 启动 JShell\n\n在 JShell 中编写代码\n\n与命令交互\n\n# 编辑器\n\n\
    # 反馈模式\n\n# 目标\n\n在本章中，我们将讨论一个名为 JShell 的有趣功能。我们将讨论 JShell 的重要性、JShell 的不同功能以及如何根据你的需求自定义\
    \ JShell 的行为。\n\n# 启动 JShell\n\n如所述，JShell 是 JDK 9.0 中推出的功能。因此，在你发出指令启动 JShell\
