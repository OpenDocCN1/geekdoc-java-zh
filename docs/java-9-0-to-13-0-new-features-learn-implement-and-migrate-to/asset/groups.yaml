    JEP 189: Shenandoah: A low-pause-time garbage collector


    Earlier GC-CMS and G1-were using concurrent approach for garbage collection: Shenandoah
    is a low pause time garbage collector which uses concurrent compaction فترة. The
    usual understanding is that time goes increasing with the size of the heap. With
    Shenandoah, pause times are no longer proportional to the heap size. One needs
    to understand that the testing of this GC is done on larger heap sizes, if you
    are using smaller heap size, then this is not the choice of GC that one should
    go with.


    Working of Shenandoah can be explained in the following phases:


    Init mark


    This is considered as a basic step, which initiates the concurrent mark. It scans
    the root set after preparing heap and application threads. You can consider this
    as the first phase in the cycle of GC.


    Concurrent mark


    In this phase, the reachable objects are traced when the application is running.
    The interval for this is dependent on the intensity of live objects and the object
    graph which is available in the heap.


    Final mark


    This is the second phase of Shenandoah cycle. In this cycle, GC finishes the concurrent
    marking process. Along with this, it also initializes evacuation process for the
    regions. This also helps in finding the runtime required for the next phase.


    Concurrent clean up


    In this phase, GC reclaims the garbage regions which do not have the live object
    that are detected in the concurrent marking process.


    Concurrent evacuation'
  - '[PAGE 148]


    This is a major shift in the traditional GC process. In this process, the objects
    of the collection set are copied to other regions.


    Init update references


    This is the third phase in the cycle, and the shortest one. The only job of this
    process is to make sure that all GC and application threads have finished evacuation
    and that they are prepared for the next phase.


    Concurrent update references


    Another walk over the heap: while doing so, it updates the references of the objects
    which were moved during concurrent evacuation.


    Final update references


    This is the last phase of the cycle. The main task during this process is to update
    the references phase by re-updating the existing root set. It also reclaims regions
    from the collection.


    Concurrent cleanup


    This is the last process, where the entire collection is reclaimed.


    If GC is not the point of concern for you, there is no need to use this GC for
    your application. In that case, you can use the modified G1 for Java 12.


    JEP 230: Microbenchmark suit


    As of us know, microbenchmark is a facility to test the performance of a software
    component at a smaller level or scale. Unlike benchmark, which actually tests
    the entire system, microbenchmark tests a smaller piece of code in your software.
    In fact, one can say that there is a correlation between benchmark and microbenchmark,
    as when you do benchmark for performance using microbenchmark you can go deeper
    into sections of your application for the modifications to test the performance.


    JEP 230 introduced microbenchmark suit, which contains predefined tests to check
    the JVM performance. Using this, one can do the continuous performance test on
    JVM easily as this suit is located in JDK source code within one directory. All
    these tests are built with JMH (Java Microbenchmark Harness).


