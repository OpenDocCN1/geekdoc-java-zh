    \ 和 Java Bean 支持进行了增强。Java 发布了该版本的几次更新，这些更新也被称为 1.1 的小版本。这些版本的代号对于 API 更新有所不同，例如版本\
    \ 1.1.6 (Abigail)、版本 1.1.7 (Brutus)。以下是该版本实现的主要更改：\n- Java 存档 (JAR) 文件格式\n- 内部类\n\
