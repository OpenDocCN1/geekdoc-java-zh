    \ \"9\"\nOpenJDK Runtime Environment (build 9+181)\nOpenJDK 64-Bit Server VM (build\
    \ 9+181, mixed mode)\n```\n\n### 2.8: Java version\n\nWhile compiling your modules,\
    \ you need to give the following instructions to Java compiler:\n\n- Path of your\
    \ modules, i.e. the directory which describes the module.\n- Names and path of\
    \ your Java files which you wish to compile.\n- The location where you want to\
    \ store your generated classes files.\n\nFollowing is the syntax to compile the\
    \ module :\n\n```\njavac -d output\n```\n\nIn our application, we can write the\
    \ following command to compile the module which we have created:\n\n```\nD:\\\
    chapter2-whats new in java9\\code\\first>javac -d output/com.bpb src/com.bpb/module-info.java\n\
    src/com.bpb/pack1/Main.java src/com.bpb/pack2/MyService.java\n```\n\n### 2.9:\
    \ Java version\n\nThe above command specifies that all the module structure can\
    \ be stored in output directory. This directory will be created if not present.\
