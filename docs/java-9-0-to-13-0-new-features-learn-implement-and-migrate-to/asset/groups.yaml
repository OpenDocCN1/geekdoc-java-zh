    # JEP 304: Garbage collector interface


    Garbage collection (GC) is one of the important components of Java. The performance
    of the application is dependent on effectively GC works in the background. Java
    is constantly working on different algorithms of GC to improve its working. The
    different implementations are launched in different version like G1, CMS, etc.


    Currently, these implementations are stored in corresponding directories. The
    standard location for the directory is src/hotspot/share/gc/$NAME. Implementation
    of G1 is stored in src/hotspot/share/g1, and implementation of CMS is stored in
    src/hotspot/share/cms. Through such separate of implementations gives flexibility
    to runtime the corresponding implementation effectively, it has certain loopholes.
    Most of the requirements require certain barriers, which need to be utilized by
    runtime, interpreter, C1 and C2. Unfortunately, all these barriers are not available
    in the source directory of GC implementation. They are implemented in shared interpreter,
    C1 and C2 source code.


    This scattered implementation of different barriers have the following drawbacks:


    Often, when a new GC implementation is proposed, the implementation requires the
    knowledge of all these services and their locations. Also, one needs to understand
    how to extend them and customize them according to the need.


    Those who are not working with GC find it very confusing to get the particular
    code for a given GC.


    Overcome this there was a launch of a GC interface which was easier than the existing
    ones. This made the implementation of new GC easier, while giving the flexibility
    to exclude uncollected objects at build.


    The proposed GC interface should follow the standard API process which will generate
    uniformity for launching new GC implementation. The new GC interface needs to
    be defined by the existing class CollectedHeap . This class is responsible for
    interaction between the GC and the HotSpot.


    The garbage collector implementation must provide:


    The main class which represents heap, this must be a subclass of CollectedHeap.


    Implementation of the barriers at the single place, a subclass of BarrierSet.
    This class should implement different barriers which are required for runtime.


    The class, which implements the CollectorPolicy.


    Implementation of GC barrier for interpreter, by implementing GCInterpreterSupport.


    Implementation of GC barrier for C1 compiler, by implementing GC1Support.


    Implementation of GC barrier for C2 compiler, by implementing GC2Support.


    Defining and initializing the GC specific arguments.


    Setting up the memory pool and member manager components using MemoryService.


    All these implementations can be used effectively by any GC algorithm with different
    implementations.


    # JEP 307: Parallel GC for G1


    As discussed, there are different types of GC available with Java. Each of these
    GCs have different implementations of how the memory is utilized for better performance
    of an application. Java has a setting for default garbage collector in respective
    versions. While JDK7.0 and 8.0 use Parallel GC as their default garbage collection
    implementation, JES9.0 and JES10.0 use G1 as their default garbage collection.


    If you want to check the current GC implementation of your jdk, you can give the
    following command:


    ```

    java -XX:+PrintCommandFlags -version

    ```'
