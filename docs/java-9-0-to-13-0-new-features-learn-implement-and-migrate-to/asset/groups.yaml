    \ \"SELECT customerID, CustomerName FROM Customer \" + \"WHERE CITY = 'Mumbai';\"\
    ;\n```\n\n这可以用所示的文本块替换：\n```java\nString info = \"\"\"SELECT customerID, CustomerName\
    \ FROM Customer\nWHERE CITY = 'Mumbai';\"\"\";\n```\n\n### 多语言示例示例\n\n通常，我们需要在\
