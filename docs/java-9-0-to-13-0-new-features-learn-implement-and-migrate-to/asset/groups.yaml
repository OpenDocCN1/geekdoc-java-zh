    \ (sha256) 195 MB\nopenjdk-9GA_windows_x64_bin.tar.gz (sha256) 190 MB\nopenjdk-9GA_osx_x64_bin.tar.gz\
    \ (sha256) 192 MB\nopenjdk-9GA_linux_x64_bin.tar.gz (sha256) 195 MB\n\n(Note:\
