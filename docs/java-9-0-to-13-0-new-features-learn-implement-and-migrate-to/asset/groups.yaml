    language.


    Project Green: the beginning


    In the 1990s, Sun Microsystems initiated a project to create a programming tool
    using C and C++. Patrick Norton, the head of the project was led by James Gosling
    and Mike Sheridan. In its initial days, the primary aim of this team was not to
    develop a new programming language but to develop electronic devices other than
    computers. The project was designed for developing embedded systems, where languages
    like C were not responsive enough.


    This made Bill Joy, co-founder of Sun Microsystems to think of a new language
    for this project. Working on this idea Gosling started on enhancing C++ and launched
    a complete programming language. Initially named as Oak the tree that was outside
    this office, it was later renamed as Java.


    Developers found Java revolutionary, but that was not the everything. In fact,
    it was the beginning. What followed next was continuous update in the API. Such
    updates were released as part of different version of Java. Though most of the
    other languages took small step for upgrading, java started to kick off the versions
    with a wider scope vision


    Over the years, Java''s API has undergone many structural changes. The package-oriented
    programming approach is reshaped to modular programming from JDK 1.9. This approach
    changed the way of traditional application development.


    The original name given to Java was Oak, it was C++++, which says new features
    added and unwanted features were removed.


    Versions of Java'
  - '[PAGE 11]


    It is very interesting to observe how Java is transforming from one version to
    another; what are the different features in a particular version; and how it is
    helping the developers in creating better applications.


    Let us quickly walk through the different versions of Java, from its early release
    to JDK8.0, in this chapter. We will be extensively describing versions 9.0, 10.0,
    and 11.0 in later chapters.


    Version: JDK1.0


    Release date: 23rd January, 1996


    This is a curtain-raiser. Sun Microsystem, launched its first version of Java
    1.0 with basic facilities. The codename given to this version was Oak. This included
    Java runtime, development tools i.e. compilers. Following were the basic features
    of this release:


    +   java.lang


    +   java.io


    +   java.util


    +   java.net


    Version: JDK1.1


    Release date: 19th February, 1997


    The prime focus of this version was to increase the stability, speed, and security
    of Java applications. This version contains around 700 classes with enhancements
    for performance, JDBC, and Java Bean support. Java released a few updates of this
    version, which is also termed as minor versions of 1.1. The codenames of these
    versions are different for API update like, Version1.1.6 (Abigail), Version1.1.7(Brutus).
    Following are the major changes that were implemented in this version:


    Java archive (JAR) file format


    Inner classes


    Internationalization


    Math package


    Object serialization


    Remote method invocation


    Version: JDK1.2


    Release date: 8thDecember, 1998


    This was launched in an era when the internet was booming. So, the term JSE (Java
    2 Platform, Standard Edition) and JME (Mobile Edition). One of the major updates
    in Java was that the classes reached up to 1520 in 59 packages. The code name
    given to this version was Playground.


    To improve the performance of the allocation, JDK1.2 introduced a few implementations:


    Faster memory allocation and garbage collection:


    Memory allocation in heap was a concern, which was read by using thread-local
    cache. So, every time there was need for locking of the heap allocation. Also,
    constant strings were shared among different classes, reducing the unnecessary
    duplicate object creation.


    Native libraries:


    JVM is not platform dependent, many times the native libraries were not uniform.
    In this version, such libraries which supported core java classes were re-written
    using Native Interface (JNI).


    Solaris native thread support:


    Java had given the ability to kernel that it could schedule native threads over
    parallel processors. This made concurrency cheaper.


    The following major language changes/updates were implemented in this version:'
