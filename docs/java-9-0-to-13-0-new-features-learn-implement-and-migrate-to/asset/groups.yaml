    # Figure 3.1: Download JDK10


    The above shows the downloading options for JDK 10, depending upon your operating
    system you can choose your installer and download the same.


    We are all set to explore the features of JSE10. Let us discuss the different
    proposals that are recommended in this version.


    JEP 286: local variable inference


    Declaring a variable is often considered a process of repetitive code. Every time
    a developer wants to access the static typed data, he has to refer it the data
    type for which it is meant. JEP proposes the use of type inference when we declare
    the variables along initialization.


    The traditional approach of declaring and initializing the local variables is
    often considered to be ceremonial.


    So, instead of declaring the data member like:


    int x = 10;


    We can now declare & initialize the variable as:


    var x = 10;


    The data type of x is inferred and it is considered to be of type int.


    Caution!


    Use var keyword carefully while considering the implicit-casting.


    e.g.


    double x=20;


    Can be replaced by:


    var x=40;


    This will consider the data type as int rather than double. So, it is recommended
    to use literals in such cases, as is shown below.


    var x=40D;


    The above statement now considers the data type of 40 as double.


    Consider the following snippet:


    ```

    ArrayList<String> myList=new ArrayList<>();

    ```


    Here, ArrayList is declaring its data type as String statically. Though one can
    observe that data type of ArrayList can be identified by JVM when it is initialized
    with new ArrayList(). Such a ceremonial code can be replaced in such a way that
    developers need not write the data type with the initializer every time.


    ```

    var myList=new ArrayList<>();

    ```'
