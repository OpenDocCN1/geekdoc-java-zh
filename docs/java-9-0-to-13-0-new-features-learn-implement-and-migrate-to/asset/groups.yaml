    ### Customizing feedback mode


    The predefined feedback modes have the inbuilt setting for the prompts, feedback
    format, continuation style or ever truncation. You can customize this behaviour
    by writing your own feedback.


    While defining the customized feedback, you can give the following options:


    - Prompts: For regular messages and continuation.

    - Truncation: For truncating the lengthy values.

    - Format: Format of the message or feedback.


    You can set your own mode mymode normal --command


    JShell>/set prompt mymode normal :mymode

    created new feedback mode :mymode


    The above command creates a copy of the normal mode, which is mymode . Where --command
    option is used to instruct that you are experiencing command feedback as well.


    Once you have the customized feedback, you can also set the prompt expected in
    the feedback. This can be done as follows:


    JShell>/set prompt mymode "mymode" : "......"


    The line indicates that the continuation will be shown by ...: and the console
    will be denoted by mymode :


