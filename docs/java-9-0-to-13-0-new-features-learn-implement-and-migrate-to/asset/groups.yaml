    # Objective


    In this chapter we will be discussing how the concept of reactive evolved in Java,
    what advantages you get as a developer when you implement reactive programming
    in your application. Moving to reactive programming is not that easy, as you need
    to discuss a lot of connected features as a lot of the implementation follows
    the call-back mechanism, in this chapter you will be able to use the publishers
    and subscribers, which are important features of this concept. You will be able
    to understand how the data flows from the subscriber to the publisher, through
    examples. Along with reactive programming, we are also going to discuss the updates
    in concurrency in the last section of this chapter.


    # The reactive manifesto


    Many developers working in various domains, platforms from different organizations
    keep discovering different patterns for software development. These systems are
    used to build the application systems more reliable, flexible, resilient and matching
    to the demands of today''s world. Simply, the developers are building reactive
    systems. These reactive systems provide flexibility, elasticity. They are loosely
    coupled and obviously scalable. These systems are message driven and have high
    fault tolerance to be up and running in a disastrous situation. These systems
    are designed to be highly responsive with interactive feedback.


    The diagram below clearly defines how the reactive systems are characterized:


    ![](img/593293c1d6794763b235cda6f9ab47ba_124_0.png)


    Figure 7.1: The characteristics of reactive systems


    Now let us discuss these characteristics in detail:


    ### Resilient


    We build applications in the best possible way, but we can''t deny the fact that
    in real run, the application may fail due to some reason. Actually, in rare situations
    the complete application fails. Most of the times, a part of an application stops
    working. Though it is just part of the application, from the user''s perspective
    it is an application failure. The application must be highly available and must
    not be unresponsive, even a part of it. Resilience provides the flexibility to
    the systems to be responsive in the most critical situations as well.


    The resilience can be achieved in the following ways:


    - Creating the replicas of the application and deploying them on separate servers.

    - Delegating the request or a part of the application to another server.

    - Isolating the components of the application to ensure that the part of the application
    may fail recovers without affecting the overall system.

