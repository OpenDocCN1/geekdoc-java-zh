    ## JSE 9.0 中的 Java 增强提议 (JEP)


    如前所述，在 JSE 9.0 发布之前已经讨论了许多提案。JDK 9.0 的完整 JEP 列表可以在 openjdk.java.net/projects/jdk9/
    找到。其中，JEP 200 已经在本章中过讨论并实现。以下是该版本的重要提案。


    ### JEP 102: API 更新


    该提案的动机是改进当前与操作系统通信的进程 API。在传统上，Java 支持可以与原生操作系统通信以启动进程的 API。从 JSE 7.0 开始，它通过文件、管道等帮助进行传输或重定向。此
    API 提供了 `java.lang.Process` 和 `java.lang.ProcessHandle`，有助于改进工作进程。


    `java.lang.ProcessHandle` 现在将提供特定于操作系统的进程 ID，以及参数、进程的实际启动时间以及累计的 CPU 时间。


    ### JEP 110: HTTP/2 客户端 (孵化中)


    引入此提案是为了提供实现 HTTP/2 和 WebSocket 的新 HTTP 客户端 API。旧的类 `HttpUrlConnection` 被认为对于现在不再运行的多种协议来说过于抽象。该类的某些行为没有被妥记录。此外，观察到它被用作单线程模型。


    所有这些因素都促成了该提案。该 API 的实现不被视为 JSE 的一部分。相反，将使用 `jdk.incubator` 命名空间来存储此 API。该 API
    设计用于对不同事件提供通知，例如接收到的标头、错误、生成的响应等。


    ### JEP 158: 统一日志


    JVM 支持日志功能，为应用程序崩溃或性能相关问题提供根因分析。但这有点复杂，并且难以理解生产模式下间歇性崩溃的根源。


    此的目标是引入一种适用于 JVM 所有组件的通用日志系统。日志中的消息可以使用不同的标签（如 `compiler`、`gc`、`classloaders`
    等）进行分类。日志定义了 `error`、`warning`、`info`、`debug`、`trace`、`developer` 等不同级别。这提供了根据级别选择记录哪些消息的功能。


    ### JEP 213: Mining Project


    项目已经在 JSE 7.0 中实现。此提案对现有项目提出了改进：


    - 在私有实例方法上使用 `@SafeVarargs`：此注解应用于无法重写的方法。这可能包括静态方法和 final 方法。

    - 在 try-catch 中允许将 final 变量作为资源：延续 JSE 7.0 的用法，现在对 `try-with-resources` 进行了修改。在
    `try-with-resources` 中，只有可以声明并初始化 final 变量，它会被自动关闭。从 JSE 9.0 开始，可以使用 final 变量作为资源的一部分。

    - 在匿名类中使用菱形操作符：钻石操作符以前只能用于分离的类，现在也可以用于匿名类。这最初并未被 JSE 9.0 要求接受。

    - 在标识符中移除下划线 (_)：`java.lang.ProcessHandle` 现在将提供特定于操作系统的进程 ID，以及参数、进程的实际启动时间和累计的
    CPU 时间。


    ### JEP 110: HTTP/2 客户端 (孵化中)


    引入此提案是为了提供实现 HTTP/2 和 WebSocket 的新 HTTP 客户端 API。旧的类 `HttpUrlConnection` 被认为对于现在不再运行的多种协议来说过于抽象。该类的某些行为没有被妥记录。此外，观察到它被用作单线程模型。


    所有这些因素都促成了该提案。该 API 的实现不被视为 JSE 的一部分。相反，将使用 `jdk.incubator` 命名空间来存储此 API。该 API
    设计用于对不同事件提供通知，例如接收到的标头、错误、生成的响应等。


