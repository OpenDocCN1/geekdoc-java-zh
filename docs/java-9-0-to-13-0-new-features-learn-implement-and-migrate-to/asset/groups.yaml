    360 度。今天，我们依赖互联网，以至于你可能正在线上某处阅读这篇文章。互联网缩短了距离，让世界变得更近、更具互动性和响应性。现在，我们将互联网作为社交媒体。我们轻松地与朋友和爱人交流。现在我们不需要排长队来预订机票、音乐会或电影电影票。我们更倾向于在线预订。什么是服务？它其实只是一方面。只是为了尝试你的应用程序在非常繁忙的一日的表现。在繁忙的日子里，应用程序会变慢，在延迟后做出响应。与此同时，我们在交易完成之前收到了成功的消息。这对开发者来说是一个大问题。随着应用程序流量的增加，程序的性能往往会下降。那么我们做了什么？我们在单台服务器上安装了更多服务器。我们要增加多少台服务器？我们是有限制的。我们需要更好的解决方案。


    今天，世界正在进入在线。应用程序曾经只是为计算机或笔记本电脑设计的，但现在我们可以自由地使用智能手机在线。现在我们都知道并跟踪自己今天的工作。我们分享关于喜欢的网站的细节，坦诚地说那些不喜欢的。用那个网站非常慢，需要一分钟加载，我需要刷新几次页面，需要
    2 分钟才能完成过程，等等。通常有许多类似的经历，但对这些反应却无话可说。作为客户，你是被重视的，而当开发者得到这些反应时，他们感到非常心碎。他们付出了所有努力为了让应用程序在外观和感受上良好，使其能解决客户的基本需求。他们甚至考虑了安全性。他们分分层实现了应用程序，以便流量得到分布。哪里出问题了？


    让我们总结一下以前的日子。几年来，大型应用程序安装在服务器上，用户并不期望在毫秒内得到响应。相反，响应的延迟被认为是理所当然的。应用程序需要维护其进程，且资源有限。但在今天，应用程序不仅部署在物理服务器上，还部署在移动设备、云平台，许多应用程序需要
    24/7 运行。如何实现这种需求？答案是“响应式”（reactive）。


