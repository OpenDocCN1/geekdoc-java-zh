    - 重定位所有对象并恢复新旧地址之间的映射。这也是一个并发过程。\n\n### 启用 ZGC\n\n默认情况下，JVM 的所有实验性功能都是禁用的。因此 ZGC\
    \ 也是禁用的。除非我们指定，否则它在构建中并不出现。\n\n同样，这在运行时是禁用的，需要启用。对于 ZGC，我们需要添加选项 `-XX:+UnlockExperimentalOptions`。\n\
