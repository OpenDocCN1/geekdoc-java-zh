    以松耦合的方式开发应用程序，使得应用程序的某些不需要在应用程序的多个位置进行更改。


    ## 响应式 (Responsive)


    每个用户都期望在最短时间内获得结果或输出。每个系统都有其在最短时间内确保正确的响应时间。尽管开发者尽了所有努力，但由于某些原因，应用程序可能会出现问题。当系统能够在问题发生时立即检测并有效处理时，该系统被称为响应式的。响应式系统能够正确构建并提供响应。用户总是对响应速度最好的应用程序充满信心。这种响应式系统简化了错误处理，最终激励了用户。


    ## 弹性 (Elastic)


    企业应用面临着变化的负载。在繁忙的日子，访问量会更多，而在其他时间则是正常的。响应式系统需要处理这种变化的流量。在当今世界，大多数开发者已经考虑到负载的变化，并通过管理资源来应对变化。在繁忙的日子，会分配更多资源来处理增加的需求。这些资源可能与硬件或软件有关。响应系统通过提供最所需的资源来支持扩展，但这是有成本的。


    ## 消息驱动 (Message driven)


    响应系统的组件是松耦合的，并在各个位置进行复制。这些组件依赖异步、位置透明性和非阻塞消息来建立边界。组件的失败也通过消息发现的帮助进行委托。通过监控消息，系统可以进行繁忙日的负载管理以及背压处理（back
    pressure）。


    位置透明性确保了组件在主机和集群中的语义。非阻塞通信仅针对利用资源的活动接收者，反过来导致了更少的系统开销。


    ## 响应式之之路 (Journey to be reactive)


    为了支持响应式，Java 已经走过了很长一段路。每当我们提到 Java，首先想到的都是面向对象编程 (OOP)。我不会详细阐述 OOP，因为我们所有人都知道它。但我们能通过仅使用
    OOP 来绕过它吗？应用程序无法具备响应式的能力。它需要的不仅于此。让我们从少数开头开始讨论。


    这段旅程始于 Java 的并发（Concurrency）概念。并发是同时执行操作以实现高性能的能力。你们或或少都读过相关线的内容。在 Java 中，我们说并发，我们或想到并发。Java
    并发围绕线程展开。任何应用程序在这里直接或间接地使用并发。由于并发在“同时”这个短语周围非常忙碌，当我们使用响应式时，我们完全依赖于操作系统及其调度器。线程之间的切换是由操作系统完成的，其频率之高以至于无人察觉。如果进程运行很长时间，我们可以同步这种切换吗？这就是
    `ThreadGroup`、`Runnable` 和 `Thread` 类，它们允许开发者创建多线程应用程序，此类应用程序的行为取决于操作系统。在这里我们有更多非常基础的操作，例如创建和启动线程。


    与其被并发和管理让线程感到困扰，不如 Java 1.5 引入了 `ExecutorService`。该框架允许开发者根据执行策略调用、执行、调度并控制异步任务的调度。`ExecutorService`
    使我们能够在不使用 `Thread` 或 `Runnable` 的情况下创建线程或线程池。接口还有调度和关闭的方法。释放还通过提供信号量（semaphores）、屏障（barriers）、互斥锁（mutexes）和锁（latches）等类来实现线程间通信的支持。通过这一切，变量能够实现高性能的原子性：并发算法、生成器和序列。我们见证了线程的创建，然而我们仍然无法充分利用硬件。


    在 Java 1.7 中，`fork and join` 被引入作为 `ExecutorService` 的实现。`ExecutorService` 实现了多线程，但没有利用多个处理器的优势。`fork
    and join` 框架允许利用多个处理器并增加应用程序性能。该框架设计用于将繁重任务分解为小任务，将它们分配给工作线程，然后通过从每个工作线程收集产生结果。它实现了窃取算法（stealing
    algorithm）。当一个线程忙于执行任务时，另一个线程可以“窃取”任务以提供高性能。


