  mdcn: "\n\nexports\n\nprovides..with\n\nuses\n\nrequires\n\n该指令表示一个模块对另一个模块的依赖关系。通常，这种关系被称为模块依赖。当你定义自己的模块时，必须定义这些依赖项。因此，当\
    \ module1 需要 module2 时，可以说 `module1` 读取了 module2，而 `module2` 被 `module1` 读取。\n\
    \n因此，`module1` 的定义看起来如下：\n\n```\nmodule1\n{\nrequires module2;\n}\n```\n\n需要确保\
    \ `module2` 不依赖 `module1`，这被称为对称关系。Java 模块系统是不允许这种关系的。Java 中的所有模块都必须是非对称的，否则会产生循环依赖，这是被不允许的。正如前面提到的，每个模块都会自动读取\
    \ `java.base` 模块，因此无需使用 `java.base` 标识符。\n\nrequires transitive - 隐含可读性\n\n让我们考虑一个有趣的场景：\n\
    \n![](img/593293c1d6794763b235cda6f9ab47ba_27_0.png)\n\n图 2.4：隐含可读性\n\n在上述场景中，`module1`\
    \ 依赖 `module2`，`module2` 依赖 `module3`，且 `module1` 也依赖 `module3`。\n\n传统上，这种结构可以写成：\n\
    \n```\nmodule1\n{\nrequires module2;\n}\nmodule2\n{\nrequires module3;\n}\n```\n\
    \n这种假设是如果 `module1` 可以使用 `module2` 服务，而 `module2` 反过来可以使用 `module3` 的服务，那么间接来说\
    \ `module1` 就可以使用 `module3`。\n\n注意！！Java 模块系统的思考方式不同。除非显式配置如下依赖关系，否则 `module1`\
    \ 无法读取 `module3`：\n\nmodule1\n\n```\n{\n  requires module2;\n  requires module3;\n\
    }\n```\n\n虽然这在这个基础场景提供了解决方案，但在许多复杂的场景中，当我们想要自动生成此类依赖关系时，可能并不知道模块的内部依赖关系。坦率地说，Java\
    \ 9 引入了 `transitive` 关键字。传递声明会创建关系依赖。即：如果 `module1` 需要 `module2`，而 `module2` 反过来需要\
    \ `module3`，在 `module2` 的配置中使用 `transitive` 关键字，`module3` 将在不显式声明的情况下与 `module1`\
    \ 建立关系。\n\n在我们的场景中可以配置如下：\n\n```\nmodule1\n{\n  requires module2;\n}\nmodule2\n\
    {\n  requires transitive module3;\n}\n```\n\n在上述配置中，`module3` 对 `module2` 和 `module1`\
    \ 都可读。\n\nrequires static\n\n在某些情况下，API 开发者在一个模块创建对另一个模块的引用时编写代码。但 API 的用户从未意过在运行时使用这种关系。这种依赖被称为可选依赖，可以通过使用编译时仅依赖来创建。在这种情况下使用的指令是\
    \ `requires static`，可以如下所示编写：\n\nmodule1\n\n```\n{\n  requires static module2;\n\
    }\n```\n\nexports\n\n之前，我们已经看到指令如何建立一个模块与另一个模块之间的依赖关系。然而，仅有 `requires` 并不能让你使用来自另一个模块的组件。此外，你想要引用的模块必须允许其他模块使用其服务或组件。`exports`\
    \ 指令指定了哪些组件（具体为包）及其公共类型是其他模块可以的。\n\n以下代码片段将向你展示导出包到其他模块的模块声明：\n\n```\nmodule2\n\
    {\n  exports package1.package2;\n}\n```\n\n除了使用 `exports`，模块还可以通过使用 `exports...to...`\
    \ 向特定模块授予权限。此类导出被称为限定导出（qualified exports）。\n\n以下代码片段显示了将哪些包导出到特定模块：\n\n```\n\
    module module3\n{\n  exports com.package1 to module1,module2\n}\n```\n\nuses\n\
    \n`requires` 指向模块，但模块还可以使用 `uses` 关键字使用其他类的服务。在这里，模块被视为服务消费者。任何实现接口或扩展抽象类的类都称为服务对象。\n\
    \nprovides..with\n\n通过 `provides` 关键字指定由当前模块提供的服务。因此，它使模块成为提供者。\n\n现在，由于我们已经经历了模块的各个方面，现在是实现单个模块的时候了，我们将从非常基础的实现开始。对于\
    \ JPMS（Java 模块系统），我们首先需要在系统中下载 Java 9。\n\n下载 Java 9\n\n你可以在以下 URL 获取 Java 12 之前的版本存档：\n\
    \n```\nhttps://jdk.java.net/archive/\n```\n\n| Windows | 64-bit |\n| :--- | :---\
    \ |\n| Mac | 64-bit |\n| Linux | 64-bit |\n| 9.0.4 | 64-bit |\n| macOS | 64-bit\
    \ |\n| Linux | 64-bit |\n| 9.0.1 | 64-bit |\n| Linux | 64-bit |\n| 9 GA | 64-bit\
    \ |\n| Linux | 64-bit |\n\n"
