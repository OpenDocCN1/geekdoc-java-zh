    # DEP 222: JShell (Read-Eval-Print Loop)


    Learning new versions of the existing language is a tedious job. Even for a small
    API testing, developers need to build the application to test the working of the
    same. However, even when seen from the point of view of the developer, the immediate
    feedback about the API is very important. Many of the programming languages have
    REPL (Read-Eval-Print Loop) but for many versions Java is not implementing such
    functionality.


    A Read-Eval-Print Loop (REPL) is an interactive programming tool. The developer
    can test the user input, he can evaluate and also process the input to generate
    the output. Scala, Ruby, JavaScript, Haskell, Clojure, and Python–all REPLs and
    all of them allow initial programs. JShell adds REPL functionality to the Java
    platform.


    With JShell in beta, Java 9 becomes simpler for learners as they can now enjoy
    the cycle of edit-compile-execute, and connect it with standard output element
    i.e. System.out.println. Now, without using any structure, public static void
    main(String[]) args we can test the working of API, and then use it in actual
    application.


    # DEP 238: Multi release JAR


    As the development is shifting from one version to another, the complexities are
    also increasing. In many scenarios, there is a possibility that the single JAR
    file is referring to different versions. This problem becomes more important in
    cases where we are using frameworks which are communicating with expect. A lot
    of times, updating the JDK will create problems for the framework as they do not
    have the facility to support different versions in the same file.


    JEP238 gives a facility to create a JAR file to allow multiple-release-specific
    versions of class to exists in the same file.


    # DEP 248: make G1 the garbage collector


    Garbage collection is one of the automatic process in Java. Garbage collection
    is process by which the memory is reclaimed for the objects which are no longer
    in use by application. Traditionally Java has 4 types of garbage collectors:


    Serial garbage collector


    Parallel garbage collector


    CMS garbage collector


    G1 garbage collector


    The GCs have certain advantages and disadvantages. It is up to the programmers
    to define or select which one to choose and pass the instructions accordingly
    to JVM. The performance of the application is primarily decided by the selection
    of GC. The job of a programmer is obviously to understand all of them and use
    them in application wisely.


    JEP 248''s main goal is to make G1 a default garbage collector. The current GC
    is parallel garbage collector, which is a time-consuming garbage collector. G1
    is a low-pause collector which will make the application faster.


