    \ `groupname` 选项，它被认为是唯一的。\n\n## jdeps --print-module-deps 报告依赖\n\n`jdeps` 的不同选项如\
    \ `--print-module-deps`、`--list` 和 `--list-deps` 得到了增强。传递模块依赖分析可以在类路径和模块路径可用的库上执行。对于\
    \ Java12，如果仅考虑 JAR 文件提供的输入，还可以使用此 `--no-recursive` 选项，它提供了非传递依赖分析的请求。\n\n如果缺少任何依赖项，早期的\
    \ `jdeps` 工具会抛出错误。从这个版本开始，你可以使用 `--missing-dependency-options` 来停止这种情况。\n\n##\
