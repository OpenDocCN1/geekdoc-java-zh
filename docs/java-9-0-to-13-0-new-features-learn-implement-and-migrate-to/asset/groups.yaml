    JEP 296: consolidate the JDK forest into a single repository


    As we know, JDK consists of many components in the API, which consist of different
    interfaces, classes etc. These interfaces, classes are grouped together as a part
    of a project, termed as a repository. This repository contains the source files
    for all the classes and the update history in them. JDK uses Mercurial tool to
    create repositories.

    Mercurial is a tool which is used as a distributed version-control tool for software
    developers. This tool is designed mainly for collaborative development of software,
    which may include plain text files as well as binary files. It has got support
    on almost all the operating systems like Windows, Unix, macOS etc Many a times,
    the software requires the updates of the code, or updates in the version of software.
    Mercurial makes these steps easy so that the transition of the system, or sub-versioning
    can become simpler. Using this tool, an entire project can be stored into a single
    repository or, sometimes, the project may choose multiple repositories, which
    are related to each other, that may contain the entire JDK.

    The process of creating repositories and adding, modifying components in it is
    done by a contributor. The contributor creates the repository and clone while
    modifying the same.


    The following figure shows the actual process of working with repository and cloning
    :


    ![](img/593293c1d6794763b235cda6f9ab47ba_51_0.png)'
