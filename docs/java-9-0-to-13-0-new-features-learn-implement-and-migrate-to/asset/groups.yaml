    \ 和 `log`。在这一 JEP 中，推荐了这些方法的优化内生实现。\n\n此外，我们已经实现的一些内生函数并不是最优的。这是由于某些软件具有某些预取指令、内存地址地址对齐问题等导致的。此类方法包括：\n\
