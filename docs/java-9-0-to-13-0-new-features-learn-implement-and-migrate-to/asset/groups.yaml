  - '[PAGE 30]


    Depending upon your OS, you can download the Java 9 binary for your system.


    To work with module, we need to go through the following steps:


    # Define the module name


    To create any modular application, we must give a unique name to the module. Ideally,
    the name should describe the task the module is defined for. Please note that
    the name should be a valid Java identifier. Normally, a module name follows the
    package naming structure like com.pack1 or com.util.


    Create a root folder for module


    Java module is present in its own folder. So, we must make sure that name of module
    root folder should match with the module name. This folder can contain other packages
    for Java components which become part of user defined module.


    Add module code


    Once the module root folder is created, all the required business logic, along
    with packages, can be inserted into this folder, which is termed as module code.


    Implement the configuration i.e. module descriptor


    This is the most important step of module programming. Every module must have
    this file which contains the configuration of the module. It provides the dependencies
    of the module, or which services are exposed out of that module to other modules
    in the application. This file should be always present immediately in the module
    root folder.


    The following figure gives graphical presentation of the simple folder structure
    for module:


    ![](img/593293c1d6794763b235cda6f9ab47ba_30_0.png)


    Figure 2.6: Module directory structure


    We will be discussing all these steps while designing the code in our demonstration.
    Though we can use the IDEs to implement the modules, understand the concepts and
    usage of modules we will initially be discussing this module demonstration on
    the console.


    Create your first Java module


    In this program, we will create a simple module to generate HelloWorld. Let us
    follow the steps stated above in our example:


    # Define the module name


    The module name defined for this module is com.bpb:'
