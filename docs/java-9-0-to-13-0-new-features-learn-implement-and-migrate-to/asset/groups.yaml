- md: "\naccess for private data members to module com.firstModule Because which we\
    \ can access the private members of the class Book which is written in com.main\
    \ package of mainModule.\n\n## Working with jLink\n\nSince the start, we have\
    \ been discussing the module system created in version 9 had changed the overall\
    \ structure of traditional monolithic jlink. Though this has changed the structure,\
    \ it has not changed the size of java conserved. The current JRE takes 285 MB\
    \ of memory. It is not going to a point of worry when we discuss this in terms\
    \ of huge machine machines available in today's era. When we write any modular\
    \ application, and try to execute it on client machine, it must have the standard\
    \ JRE which is given by Java.\n\nLet us talk how this matters to us as a developer.\n\
    \nConsider a class HelloWorld which is present in some module as below:\n\n```java\n\
    package mypack;\n\npublic class HelloWorld\n{\n    public static void main(String[\
    \ ] args)\n    {\n        System.out.println(\"Hello World from Java!\");\n  \
    \  }\n}\n```\n\nTo compile and execute this class you require only the following\
    \ classes:\n- Hello.class\n- System.class\n- String.class\n\nAnd of course as\
    \ we are talking in terms of module, it requires java.base as it is not dependent\
    \ on any of other services. This might require a few KB of memory, but with the\
    \ current approach of JRE runtime, we need to utilize huge JRE which is a waste\
    \ of memory. This might be a problematic case when we deploy our application on\
    \ machines like IoT devices. Java has a tool called jlink, which creates small\
    \ JRE which will reduce the size of java runtime considerably.\n\nBut the question\
    \ is how we identify the required modules for our application which we need to\
    \ put in customized runtime? We can take the help of jdeps which we have already\
    \ discussed in this chapter. Let's use jdeps on our earlier module com.mainModule\
    \ for which we want to convert traditional JRE to customized JRE.\n\n```bash\n\
    D:\\ReflectionDemo\\jdeps --module-path . -s\n```\n\nThe above command will display\
    \ modules on which com.mainModule is dependent as shown below:\n\n```\ncom.mainModule->firstModule\n\
    com.mainModule->java.base\n```\n\nOnce we identify the required modules, we need\
    \ to manually copy these modules to our folder where are dependent on this module.\
    \ So, copy these modules, we can initiate jlink. Following is the syntax:\n\n\
    ```bash\njlink --module-path . --add-modules java.base,com.mainModule --output\
    \ myre\n```\n\nThis will create myre folder with folder in it. If you observe\
    \ the size of this folder, you will observe it is considerably small. In our case\
    \ it is 35 MB. Follow the steps:\n\nMove to myre folder:\n```bash\nD:\\SampleApp\\\
    cd myre\n```\n\nMove to bin folder:\n```bash\nD:\\myre\\cd bin\n```\n\nExecute\
    \ the application:\n```bash\nD:\\myre\\bin>java --add-opens com.mainModule/com.mainModule\
    \ Main\n```\n\nOutput:\npublicationName\n\n## Multi-release JAR file\n\nAs we\
    \ move from version to another, there are possibilities that a single application\
    \ may contain classes mapped to another version. This may arise of reasons—either\
    \ we are adding some new features from versions or we are upgrading the existing\
    \ code to new API. But this may not be possible for all scenarios as this will\
    \ have adverse effect to the existing client since they are using older classes\
    \ which would be removed. To create JAR file for application which will support\
    \ multiple versions and client will be able to use services in the same application.\n\
    \nNow let us understand this concept by real-time scenario. Consider the project\
    \ SampleApp with the following structure:\n\n![](img/59329c1d679476b235cda6f9ab7ba_0.png)\n\
    Figure 5.21: Folder structure SampleApp\n\nThe project SampleApp contains two\
    \ folders: prejava9 and postjava9. Folder prejava9 contains the code which is\
    \ using the API of prejava9. Note that we are not designing real-time business\
    \ logic here as the objective is to understand how to create multi version JAR\
    \ file.\n\nSource code for Main.java:\n\n```java\npackage com.pack;\n\npublic\
    \ class Main\n{\n    public static void main(String[] args)\n    {\n        Utility.showProcess();\n\
    \    }\n}\n```\n\nMain.java calls the method Process() from Utility, the source\
    \ code of which is shown below:\n\nSource code for Utility.java:\n\n```java\n\
    package com.pack;\n\npublic class Utility\n{\n    public static void showProcess()\n\
    \    {\n        System.out.println(\"Process Generated from Java 8\");\n    }\n\
    }\n```\n\nLet us assume that this method is using the API from Java 8. This method\
    \ worked fine for the user for some time. But after that the developer wants to\
    \ add new functionality to this method using the API from Java 9, while wanting\
    \ to replace the existing Utility.java as the existing users might need these\
    \ services. So developers created another class Utility.java which has the same\
    \ package structure in postjava9 folder with different implementation as shown:\n\
    \n```java\npackage com.pack;\n\npublic class Utility\n{\n    public static void\
    \ showProcess()\n    {\n        System.out.println(\"Process Generated from Java\
    \ 9\");\n    }\n}\n```\n\nNow we want to create multiple JAR file in such a way\
    \ that the user can decide which version he chooses to call showProcess(). Now\
    \ we first compile the project components related to Java 8 as shown below:\n\n\
    ```bash\nD:\\SampleApp\\java -version\njava version \"1.8.0_201\"\nJava(TM) SE\
    \ Runtime Environment (build 1.8.0_201-b09)\nJava HotSpot(TM) 64-Bit Server VM\
    \ (build 25.201-b09, mixed mode)\n```\n\nMove to prejava9 folder:\n```bash\nD:\\\
    SampleApp>cd prejava9\n```\n\nCreate directory out in prejava9:\n```bash\nD:\\\
    SampleApp\\prejava9>mkdir out\n```\n\nCompile the classes:\n```bash\nD:\\SampleApp\\\
    prejava9>javac -d out src/com/pack/Utility.java src/com/pack/Main.java\n```\n\n\
    The above command will compile Utility.java and Main.java and store the structure\
    \ in folder.\n\n```text\nD:\\SampleApp\\prejava9>tree /A /F\nFolder PATH listing\
    \ for volume New Volume\nVolume serial number is BA6E-071C\nD:\n|--out\n|   |com\n\
    |   |--pack\n|       Main.class\n|       Utility.class\n|--src\n|   --com\n| \
    \  |--pack\n|       Main.java\n|       Utility.java\n```\nFigure 5.22: Folder\
    \ structure prejava9\n\nNow let us compile the other components which are related\
    \ to Java 9 i.e. files present in postjava9. Check the Java version before compiling:\n\
    \n```bash\nD:\\SampleApp\\postjava9>java -version\nopenjdk version \"9\"\nOpenJDK\
    \ Runtime Environment (build 9+181)\nOpenJDK 64-Bit Server VM (build 9+181, mixed\
    \ mode)\n```\n\nCreate directory out to store the classes:\n```bash\nD:\\SampleApp\\\
    postjava9>mkdir out\n```\n\nCompile the classes:\n```bash\nD:\\SampleApp\\postjava9>javac\
    \ -d out src/com/pack/Utility.java\n```\n\nAfter this command the folder postjava9\
    \ will be modified as below:\n\n```text\nD:\\SampleApp\\postjava>tree /A /F\n\
    Folder PATH listing for volume New Volume\nVolume serial number is BA6E-071C\n\
    D:\n+--out\n|--com\n|--pack\n      Utility.class\n|--src\n|--com\n      |--pack\n\
    \        Utility.java\n```\nFigure 5.23: Folder structure postjava9\n\nLet us\
    \ move to the most important thing i.e. to create multi release JAR file. To do\
    \ this, go to the root folder of the project and give the following command:\n\
    \n```bash\nD:\\SampleApp\\jar --create --file sample-lib.jar -C prejava9/out .\
    \ --release 9 -C postjava9/out\n```\nFigure 5.24: JAR creation\n\nThe above command\
    \ will create sample-lib.jar file in SampleApp folder. The difference here is,\
    \ it specifies additional attribute--release that you are creating multi-release\
    \ JAR file. To display the list of files added into this JAR file, give the following\
    \ command:\n\n```bash\nD:\\SampleApp>jar --list --file sample-lib.jar\n```\n\n\
    This will display following files which are added in sample-lib.jar file:\n\n\
    ```\nMETA-INF/MANIFEST.MF\ncom/\ncom/pack/\ncom/pack/Main.class\ncom/pack/Utility.class\n\
    META-INF/versions/9/\nMETA-INF/versions/9/com/\nMETA-INF/versions/9/com/pack/\n\
    META-INF/versions/9/com/pack/Utility.class\n```\n\nThe next step is to extract\
    \ this JAR file in a folder. Create a directory SampleLib in root folder and extract\
    \ your JAR file as shown below:\n\n```bash\nD:\\SampleApp\\SampleLib>jar --extract\
    \ ../sample-lib.jar\n```\n"
  mdcn: "\n对 com.firstModule 模块的私有数据成员的访问，因为我们可以访问位于 mainModule 中 `com.main` 包的 `Book`\
    \ 类的私有成员。\n\n## 使用 jLink\n\n从一开始，我们一直在讨论第 9 版本创建的模块系统如何改变了传统单体 jlink 的整体结构。尽管结构发生了变化，但它并没有改变\
    \ Java 运行环境的大小。当前的 JRE 占用 285 MB 内存。当我们考虑到当今时代各种巨型机器来讨论这个问题时，这并不算令人担忧。当我们编写任何模块化应用并尝试在客户端机器上执行它时，它必须拥有\
    \ Java 提供的标准 JRE。\n\n让我们来聊聊这对我们开发者意味着什么。\n\n考虑某个模块中存在如下的 `HelloWorld` 类：\n\n```java\n\
    package mypack;\n\npublic class HelloWorld\n{\n    public static void main(String[\
    \ ] args)\n    {\n        System.out.println(\"Hello World from Java!\");\n  \
    \  }\n}\n```\n\n编译并执行此类，你只需要以下类：\n- Hello.class\n- System.class\n- String.class\n\
    \n当然，由于我们是从模块的角度来讨论，因为它不依赖于任何其他服务，它需要 `java.base`。这可能需要几 KB 的内存，但按照目前的 JRE 运行时方法，我们需要利用巨大的\
    \ JRE，这是对内存的浪费。当我们把应用程序部署到 IoT 设备等机器上，这可能会是一个问题。Java 有一个名为 `jlink` 的工具，它可以创建较小的\
    \ JRE，从而显著减少 Java 运行环境的大小。\n\n但问题是，我们如何识别应用程序所需的、需要放入自定义运行时中的模块呢？我们可以借助在本章中已经讨论过的\
    \ `jdeps` 工具。让我们在之前的模块 `com.mainModule` 上使用 `jdeps`，我们想要将传统的 JRE 转换为自定义 JRE。\n\
    \n```bash\nD:\\ReflectionDemo\\jdeps --module-path . -s\n```\n\n上述命令将显示 `com.mainModule`\
    \ 依赖的模块，如下所示：\n\n```\ncom.mainModule->firstModule\ncom.mainModule->java.base\n\
    ```\n\n一旦确定了所需的模块，我们需要手动将这些模块复制到依赖该模块的文件夹中。因此，复制这些模块后，我们可以启动 `jlink`。语法如下：\n\n\
    ```bash\njlink --module-path . --add-modules java.base,com.mainModule --output\
    \ myre\n```\n\n这将创建一个包含文件夹的 `myre` 文件夹。如果你观察此文件夹的大小，你会发现它非常小。在我们案例中，它是 35 MB。按照以下步骤操作：\n\
    \n移动到 `myre` 文件夹：\n```bash\nD:\\SampleApp\\cd myre\n```\n\n移动到 `bin` 文件夹：\n```bash\n\
    D:\\myre\\cd bin\n```\n\n执行应用程序：\n```bash\nD:\\myre\\bin>java --add-opens com.mainModule/com.mainModule\
    \ Main\n```\n\n输出：\npublicationName\n\n## 多版本 JAR 文件\n\n随着版本版本更新到另一个，同一个应用程序可能会包含映射到另一个版本的类。这可能是由于多种原因引起的——要么我们正在从版本添加某些新功能，要么我们正在将现有代码升级到新\
    \ API。但对于所有场景来说是不可能的，因为这会对现有客户端产生不利影响，因为他们正在使用会被移除的旧类。为了创建一个支持多个版本的 JAR 文件，以便客户端可以在同一个应用程序中使用这些服务。\n\
    \n现在让我们通过真实场景来理解这个概念。考虑具有如下结构的项目 `SampleApp`：\n\n![](img/59329c1d679476b235cda6f9ab7ba_0.png)\n\
    图 5.21：SampleApp 文件夹结构\n\n项目 `SampleApp` 两个文件夹：`prejava9` 和 `postjava9`。`prejava9`\
    \ 文件夹包含使用 `prejava9` API 代码。注意，我们在这里并没有设计真实的业务逻辑，目标是理解如何创建多版本 JAR 文件。\n\n`Main.java`\
    \ 的源代码：\n\n```java\npackage com.pack;\n\npublic class Main\n{\n    public static\
    \ void main(String[] args)\n    {\n        Utility.showProcess();\n    }\n}\n\
    ```\n\n`Main.java` 调用了 `Utility` 中的 `Process()` 方法，其源代码所示：\n\n`Utility.java` 的源代码：\n\
    \n```java\npackage com.pack;\n\npublic class Utility\n{\n    public static void\
    \ showProcess()\n    {\n        System.out.println(\"Process Generated from Java\
    \ 8\");\n    }\n}\n```\n\n假设该方法正在使用 Java 8 的 API。该方法在一段时间内对用户运行良好。但之后，开发者想要使用\
    \ Java 9 的 API 为此方法添加新功能，同时想要替换现有的 `Utility.java`，因为现有用户可能需要这些服务。因此，开发者在 `postjava9`\
    \ 文件夹中创建了另一个 `Utility.java` 类，它具有相同的包结构但实现不同，所示：\n\n```java\npackage com.pack;\n\
    \npublic class Utility\n{\n    public static void showProcess()\n    {\n     \
    \   System.out.println(\"Process Generated from Java 9\");\n    }\n}\n```\n\n\
    现在我们想创建多个 JAR 文件，使用户可以决定选择哪个版本来调用 `showProcess()`。现在我们首先编译与 Java 8 相关的项目组件，如下所示：\n\
    \n```bash\nD:\\SampleApp\\java -version\njava version \"1.8.0_201\"\nJava(TM)\
    \ SE Runtime Environment (build 1.8.0_201-b09)\nJava HotSpot(TM) 64-Bit Server\
    \ VM (build 25.201-b09, mixed mode)\n```\n\n移动到 `prejava9` 文件夹：\n```bash\nD:\\\
    SampleApp>cd prejava9\n```\n\n在 `prejava9` 中创建 `out` 目录：\n```bash\nD:\\SampleApp\\\
    prejava9>mkdir out\n```\n\n编译类：\n```bash\nD:\\SampleApp\\prejava9>javac -d out\
    \ src/com/pack/Main.java src/com/pack/Utility.java\n```\n*(注：原文此处路径略有简化，此处根据逻辑补全以保持一致性)*\n\
    \n上述命令将编译 `Utility.java` 和 `Main.java` 并存储在文件夹中。\n\n```text\nD:\\SampleApp\\prejava9>tree\
    \ /A\nFolder listing for volume\nVolume serial number is BA6E1C\nD:\n|--out\n\
    |   com\n|   |pack\n|       Main.class\n|       Utility.class\n|--src\n|   |com\n\
    |   |pack\n|        Main.java\n        Utility.java\n```\n图 5.22：prejava9结构\n\n\
    现在让我们编译与 Java 9 相关的其他组件，即存在于 `postjava9` 中的文件。在编译前检查 Java 版本：\n\n```bash\nD:\\\
    SampleApp\\postjava9>java -version\nopenjdk version \"9\"\nOpenJDK Runtime Environment\
    \ (build 9+181)\nOpenJDK 64-Bit Server VM (build 9+181, mixed mode)\n```\n\n在\
    \ `postjava9` 中创建 `out` 目录以存储类：\n```bash\nD:\\SampleApp\\postjava9>mkdir out\n\
    ```\n\n编译类：\n```bash\nD:\\SampleApp\\postjava9>javac -d out src/com/pack/Utility.java\n\
    ```\n\n执行此命令后，`postjava9` 文件夹将修改如下：\n\n```text\nD:\\SampleApp\\postjava9>tree\
    \ /A\nFolder listing for volume\nVolume serial number is BA6E1C\nD:\n+--out\n\
    |--com\n|--pack\n|       Utility.class\n|--src\n|--com\n|--pack\n        Utility.java\n\
    ```\n图 5.23：postjava9结构\n\n让我们进入最重要的部分，即创建多版本 JAR 文件。要做到这一点，进入项目的根目录并执行以下命令：\n\
    \n```bash\nD:\\SampleApp\\jar --create --file sample-lib.jar -C prejava9/out .\
    \ --release 9 -C postjava9/out\n```\n图 5.24：JAR 创建\n\n上述命令将在 `SampleApp` 文件夹中创建\
    \ `sample-lib.jar` 文件。这里的不同在于指定了额外的属性 `--release`，表示你正在创建一个多版本 JAR 文件。要显示添加到此\
    \ JAR 文件的文件列表，执行以下命令：\n\n```bash\nD:\\SampleApp>jar --list --file sample-lib.jar\n\
    ```\n\n这将显示已添加到 `sample-lib.jar` 中的文件：\n\n```\nMETA-INF/MANIFEST.MF\ncom/\ncom/pack/\n\
