    # Introduction


    It will be very difficult without discussing the way design, deployment and architecture
    has evolved over the past few years. Earlier, we used bulky servers to deploy
    applications. With passing days, they were replaced with smaller-sized servers,
    allowing us to utilize it for some other purpose. The introduction of the well-known
    instead of a hard copy changed the world 360 degrees. Today, we are dependent
    on the internet, to the extent that you might be reading this somewhere online.
    The internet has taken out the distance and made the world closer, interactive,
    and responsive. Now nowadays, we are using internet as a social media. We are
    communicating with our friends, and loved ones easily. Now nowadays, we don''t
    have to stand in a long queue to book flight, music concert or movie tickets.
    We prefer to book them online. What is service? It is really only one side. Just
    to try how your application behaviors on a very busy day. On a very busy day,
    the application gets slow, it responds after a delay. Meanwhile, we get a message
    of success transaction, and before the transaction gets completed. This is a big
    issue for developers. As the traffic on application increases, the application''s
    performance tends to slow down. So, what did we? We installed more servers on
    a single server. How many servers are we going to? We have limitation on it. We
    need a better solution.


    Today, the world is going online. The application was only made for computers
    or laptops, however now we free to get online using smartphones. Now we all know
    and keeping track about what we worked today. We share the details about the sites
    we like and frankly about those we don''t. Use that site it is very slow, it takes
    a minute to load, I need to refresh the page a number of times, it takes 2 minutes
    to complete the process and many more. Of usual similar experiences and there
    is nothing about those reactions. As a customer, you are valued, when a developer
    gets those reactions, they feel heart-broken. They had taken all the effects so
    the application will be good in look and feel, that it will solve the basic purpose
    of the customer. And they even took care of the security. They implemented applications
    in layers that the traffic will be distributed. What went wrong?


    Let''s sum up the days before. For few years, the large applications were installed
    on servers, the application users were not expecting the response in milliseconds.
    Rather, the delay in responses taken for granted. The application needs to maintain
    its process and very limited amount of data. But in today''s days, application
    is not only deployed on physical servers, but are deployed on mobile devices,
    cloud platforms as, where many multi-core processors are running 24/7. The users
    expect the response in milliseconds and more importantly the application needs
    to be up and running all. How to achieve this desired demand, what is the solution?
    The answer is ''reactive''


    # Structure


    # Reactive journey


    - Flow processor

    - Flow publisher

    - Flow subscriber

    - Flow subscription

