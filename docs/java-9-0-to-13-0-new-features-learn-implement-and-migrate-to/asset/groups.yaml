    \ the version JDK9 or above. JShell is present in /bin folder of jdk.\n\nYou can\
    \ start the JShell tool as shown below:\n\n# Command Prompt - jshell\n\n```\n\
    D:\\Java\\java-se-9-ri\\jdk-9\\bin>jshell\n| Welcome to JShell -- Version 9\n\
    | For an introduction type: /help intro\njshell>_\n```\n\nFigure 6.1: Launching\
