    \ API 开发发生了变化。\n\nOracle 现在引入了主版本和次要版本的概念。JSE9 将是最后一个被正式称为“主版本”的版本。从 JSE10 开始，将每年仅发布两次版本，并被称为“特性发布”（feature\
    \ release）。这种版本的发布模式被称为基于时间的发布版本（time-based release version）。\n\n### 基于时间的发布\n\
    \n从 1996 年到 2016 年，Java 发布版本已经持续了 20 年。JDK 的增长不仅体现在规模（包括特性、接口等），而且在性能、可扩展性和安全性方面也得到了改进。在实现这些特性的过程中，Java\
    \ 采取了许多令人不规则且不可预测的步骤。\n\nJava 持续研究不同的概念并在不同的版本中发布。在实现这一点的同时，每个版本的发布都致力于实现一个或多个重大特性，作为“按需发布”的依据。当然，这起初对开发者来说似乎并不奏效，因为\
    \ Java 能够在审查和测试后以高水平的发布新特性。\n\n但另一方面，Java 曾经经常借助较小工具的帮助，直到有了更好的发布版本。与当时的其他编程语言相比，这个过程似乎是一个较慢的方法。\n\
    \n考虑到这些，Java 从 Java9 开始引入了基于时间的发布模型。该模型每月发布一次特性，每季度更新一次，并每三年发布一次长期支持（LTS）版本。\n\
    \n从 2018 年 3 月开始，Java 引入了“特性发布”（Feature Releases）的概念。当 API 中提出任何新特性或更新时，它被视为此类发布的一部分。JVM\
