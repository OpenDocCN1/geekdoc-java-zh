    \ and modify the module-info.java from both modules as shown.\n\nSource code for\
    \ module-info.java for moduleFirst :\n\n```\nmoduleFirst\n{\nrequires moduleSecond;\n\
    }\n```\n\nSource code for module-info.java for moduleSecond :\n\n```\nmoduleSecond\n\
    {}\n```\n\nNote that the export statement from this module-info.java is removed,\
