    \ requires the whole application to be recompiled. So, why not have a facility\
    \ where a developer needs to write the complete code and instead just write the\
    \ snippet and check for the desired result?\n\nThis is the concept of read-eval-print\
    \ (REPL) comes into the picture. This is a console where the developer can write\
    \ the code snippet instead of writing the complete program. Few of the programming\
    \ script languages like Python and Node have this implementation. For years, the\
    \ Java developer was waiting for such a facility. Though it was earlier in other\
    \ JVM supported languages like Closure and Groovy, Java didn't support it. Finally,\
    \ after JDK 9 introduced introduction of REPL which is termed as JShell.\n\nFollowing\
    \ are the main uses of REPL:\n\n- Checking the simple code and behaviour of the\
    \ interpreter\n- Tool to learn new concepts\n- Environment to interact with adhoc\
    \ scenarios.\n\n(Adhoc is temporary code for quick and non-reusable code. Sometimes\
    \ termed as dirty code as well)\n\nIn simple words, it is a tool where you can\
    \ enter commands which will be executed without writing the entire Java code.\n\
    \n# Structure\n\n# Launching JShell\n\nWriting code in JShell\n\nWorking with\
