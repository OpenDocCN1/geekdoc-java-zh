    开发者发现 Java 是革命性的，但那并不是全部。接踵是 API 的持续更新。这些更新作为 Java 不同版本的一部分发布。尽管大多数其他语言只迈了微小的步，Java\
    \ 开始开启更广泛范围的版本发布。多年来，Java 的 API 经历了许多结构性变化。面向包的编程方法从 JDK 9 开始被重塑为模块化编程。Java 的原始名称是\
    \ Oak，它是 C++，添加了新特性并移除了不需要的特性。\n\n## Java 的版本\n观察 Java 如何从一个版本转变为另一个非常有趣；特定版本的不同特性；以及它如何帮助开发者创建更好的应用程序。让我们快速回顾\
    \ Java 从早期发布到 JDK 8.0 的不同版本。我们将在后续章节中详细描述版本 9.0、10.0 和 11.0。\n\n### 版本：JDK1.0\n\
