    # CHAPTER 6


    # Working with JShell


    # Introduction


    Many programming languages have some complicated concepts which require testing
    before they are used. Unfortunately, most the time of a developer has no choice
    but to write a complete program to test the concept. Also, sometimes there could
    be a complex algorithm, which needs to be tested for correctness of its implementation.
    Similar to earlier situation, to test this, a developer needs to write the complete
    code or application. Though this is important, it is time-consuming, and modification
    in such applications requires the whole application to be recompiled. So, why
    not have a facility where a developer needs to write the complete code and instead
    just write the snippet and check for the desired result?


    This is the concept of read-eval-print (REPL) comes into the picture. This is
    a console where the developer can write the code snippet instead of writing the
    complete program. Few of the programming script languages like Python and Node
    have this implementation. For years, the Java developer was waiting for such a
    facility. Though it was earlier in other JVM supported languages like Closure
    and Groovy, Java didn''t support it. Finally, after JDK 9 introduced introduction
    of REPL which is termed as JShell.


    Following are the main uses of REPL:


    +   - Checking the simple code and behaviour of the interpreter


    +   - Tool to learn new concepts


    +   - Environment to interact with adhoc scenarios.


    (Adhoc is temporary code for quick and non-reusable code. Sometimes termed as
    dirty code as well)


    In simple words, it is a tool where you can enter commands which will be executed
    without writing the entire Java code.


    # Structure


    # Launching JShell


    Writing code in JShell


    Working with commands


    # Editors


    # Feedback modes


    # Objective


    In this chapter we will be discussing one of the interesting features called JShell.
    We will discuss what is the importance of JShell, what are the different features
    of JShell and how to customize the behaviour of JShell per your need.


