    - **$FEATURE$：**\n  被视为一个主版本，这是一个每六个月递增一次的版本号。所有的 API 更新和特性都包含在这个版本中。从 2018 年\
    \ 3 月开始，$FEATURE$ 号被视为 10，2018 年 9 月则被视为 11。因此，它反映了 API 的重大变化。\n\n- **$INTERIM$：**\n\
    \  这与早期系统中的次要版本概念类似。在新的六个月基于时间的版本类型中，这通常被视为 0，因为没有次要发布。该发布主要关注在当前版本中可能重复的错误。\n\
    \n  这在每次次要发布中都会增加。通常情况下，特性的移除或标准 API 的更改不包含在此组件中。由于我们已转向六个月的发布周期，此值将始终为 0。\n\n\
    - **$UPDATE$：**\n  有时开发者在处理 $FEATURE$ 发布时可能会观察到安全问题、错误甚至回归。这些观察到的结果会在 $FEATURE$\
    \ 发布一个月后得到修复。这种观察每三个月重复一次并递增。例如，4 月份发布的 JDK 版本的完整版本字符串。\n\n- **$PATCH$：**\n  用于关键的安全修复和错误修复。\n\
    \n"
