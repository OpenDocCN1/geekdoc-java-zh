  md: '# CHAPTER 3


    # Place in Bujangga Manik


    ![](img/554283bc3d9f2f96cd0b936b4413c21f_196_0.png)


    Bujangga Manik is full of long lists of placenames. Most are the names of rivers,
    mountains, and settlements in Java/Sunda encountered by the ascetic on his journey;
    others are ethnonyms or toponym relating to places outside Java. The reader may
    find Bujangga Manik a difficult text to categorise—or even enjoy—due to its reliance
    on these placename lists; they are such that answering the questions of how and
    why BM places is tantamount to answering the question of what kind of text BM
    is.


    In my MA thesis I argued that the listing of Bujangga Manik was a manifestation
    of a common trope in Malayo-Polynesian literatures, both oral and written, appearing
    in a range of different genres across the Indo-Malaysian archipelago and the Pacific
    (A.J. West 2017). The listing of placenames does not constitute a genre in its
    own right—but the trope nonetheless appears to have an ancient history in Malayo-Polynesian
    literatures, with examples of essentially the same form found in oral compositions
    from Hawai''i, the Solomon Islands, and elsewhere in the Indo-Malaysian archipelago.
    A reader of Bujangga Manik may still find the text monotonous, but the possibility
    that its form reflects an ancient indigenous literary form is nonetheless rather
    interesting. I outline this argument in Section I as part of a broader discussion
    of place as it appears in Bujangga Manik.


    In this section, I will also provide an overview of the ascetic''s routes across
    Java (discussed in greater detail in Noordyn''s 1982 article) and examine some
    of the more interesting places featured in the text, both Java and extra-Javan,
    in Section 2. To further contextualise these places I will give a brief sketch
    of the landscape of fifteenth-century Java-Sunda as it is known to us from contemporary
    sources, noting in particular changes that have occurred since that time and describing
    interesting features of the human and natural landscape where relevant.'
