  md: 'It should be clear, then that the ''Old Sundanese'' scripts used to write Old
    Sundanese were not all of one type, and should be distinguished carefully. In
    the case of Ms Jav. b.3. (R) we are dealing with a particular hand of lontar script,
    whose proximate origins I will now attempt to disentangle.¹18


    # 2.6.3 Origins of the Lontar Script


    Comparison of the graphemes in Table 10 suggests that Ms Jav. b.3. (R)''s lontar
    script is a hybrid. Some of BM''s aksaras closely resemble those the Kawali stones
    (specifically <nga ca da ca na ra sa sa> and some of the *sandhan*) while others
    appear to be derived from forms in the *gebang* script (including <ga ta ba ha
    é>). There are differences in grapheme inventory between these scripts, too; the
    *gebang* script has equivalents for all grapmes employed in the lontar script
    (as well as not noted in the table above, occasional retroflex consonants), but
    the *panolong* seems absent from the script used in the Kawali inscriptions. The
    Ms Jav. b.3. (R) script has an angular uniformity not present in the other scripts,
    and many of the zig-zagging elements repeat across different aksaras.


    I suggest that Ms Jav b.3. (R) is a product of fusion from both the Kawali and
    gebang scripts (or similar to these), with the resulting forms ''standardised''
    through the use of the same or similar strokes and components across the script.
    The Kawali-type script appears to be the source for most of the aksaras in the
    lontar script; this was originally used for writing on lontar leaves, as it also
    appears with few differences on the Kebananten copperplates (see Hunter 1996:
    Fig. 11), and it probably developed locally in Sunda over the course of the Middle
    Ages. Presumably by Javanese precedents. Hunter (1996b3) suggests that this early
    Sundanese script ''probably evolved'' ultimately from a Central Javanese Kawi
    of the ninth century. It is notable that long vowels and retroflex and aspirated
    consonants have been lost from the grapheme inventory of Sundanese scripts by
    the time of the first Old Sundanese inscriptions in the fourteenth century.


    Other features of the *lontar* script are not found in the Kawali-type script
    and seem to come from adaptations of the *gebang* script, which appears to have
    a proximate origin in fourteenth-century East Java, as mentioned above.


    > ¹⁸ A work on the origins and development of the Old Sundanese script(s) has
    recently been completed by Eva Noviana (2022). This contains descriptions and
    analyses of the characters found on various media, including stone, bamboo, lontar,
    and gebang. Some features of her descriptions disagree with mine—her attribution
    of a sixteenth-century date to the Batulis inscription, for instance, which is
    also shared by Gunawan and Griffiths (2021)—and my remarks should be taken as
    an alternative account of this development.'
