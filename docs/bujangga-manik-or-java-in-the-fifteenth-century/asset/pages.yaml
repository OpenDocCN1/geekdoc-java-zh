    CHAPTER 1


    # 1.2 The Page


    Several palm species are said to have lent their leaves to the creation of Sundanese
    manuscripts, including—Ekadjati lists them—*palmyra (lontar [Borassus flabellifer]),
    sugar palm *enau* [Arenga pinnata]*, coconut palm *kelapa [Cocos nucifera]*, pandanus
    *pandan* [Pandanus spp.], and thatch palm *nipah [Nypa frutans]*’ (1996:13). The
    latter appears to be a misidentification, however; so called ‘nipah’ manuscripts
    instead of gebang (or Gawang—Olw lái) and in a Sundanese context these were usually
    written with ink and a reed (see the elegant argument in Gunawan 2015). The most
    common manuscript material between Lombok and Sumatra, Aditia Gunawan points out,
    a lontar from Old Javanese binding Javanese leaf with Sanskrit tal *Borassus flabellifer*
    (and having subsequently undergone methesis) (Gunawan 2015:250). Lontar and gebang
    are the two principal surviving varieties of Old Sundanese writing; MS Jav. b.3
    (R) is certainly an example of the form. Of the Old Sundanese palm work Sangyang
    Sasana Mahagura (Jakarta, PNRI, L61, f.14*) explicitly states that *lontar (taal)*
    manuscripts were intended to be handled and used for public readings, and that
    inked gebang manuscripts were the more highly valued ‘suitable for putting in
    an archive’ (*pikabuyutan*). The colour, size, and the style of the manuscript
    as a flat four-lined (rather than inked) text with three holes for cords all confirm
    that *Bujangga Manik* is written on lontar (Rubinson 1996:33). The manuscript
    must have been intended for publication and reading.


    Lontar palms—described by James Fox as ‘massive dioecious palm[s] with solitary
    trunk[s] and thick, broadly based, spiny-edged leafstalk that mount wind, fan-like
    fronds’-grow in the drier parts of South and East Asia, and have a range of uses
    that go beyond writing materials: the rachis can be tapped for sugar, the leaves
    can be woven into mats and clothing, and the sturdy stem is used in construction.
    Lontar palms occasionally appear in Old Javanese *kawakin* as proverbially and
    massive objects, as in the late-fifteenth-century *kawakin Śavartrikalpa* (21.1),
    where Antaka’s club is compared to lontar: ‘he grasped his club, great as a lontar
    palm [tal], and hard as a thunderbolt’ (Teeuw et al. 1969:7). Few lontar grow
    in West Java due to its rainy climate, and the leaves for many manuscripts were
    probably imported from further east (Ekadjati 1996:103). Madura, the low lying
    island immediately of Surabaya in East Java, has a particularly dry climate


    See Fox’s Harvest of the Palm (1977) for the lontar’s important role in subsistence
    arboriculture in Roti and Timor.'
