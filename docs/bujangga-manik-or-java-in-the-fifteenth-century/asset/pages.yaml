    # 1 Background


    Bujangga Manik is an Old Sundanese narrative poem about a Hindu ascetic''s travels
    composed in West Java during the unrest and transition of the late fifteenth century.
    It is a codex unicus, its sole surviving lontar palm-leaf manuscript, ms Jav.
    b.3. (R), has been preserved in the Bodleian Library at the University of Oxford
    since 1627. The unfinished text, consisting of 1630 extant lines, most of them
    eight syllables long, inscribed script continua on both sides of thirty lines,
    opens a rare window onto a world otherwise known through the eyes of foreign observers
    and later copies of potentially unreliable chronicles in local languages.


    Bujangga Manik has been known to the world wider since the late twentieth century,
    when it was first analysed by the Dutch scholar Jacobus Noorduyn. Its encyclopaedic
    character and naturalism, and its terse presentation of daily life and material
    culture, make it a useful corrective to accounts of medieval Malaysia that concentrate
    on political history and legend. The text is dated to the fifteenth century on
    the basis of its references to the politics of Melaka, Demak, and Majapahit, which
    only co-existed in the mid-to-late fifteenth century. The Portuguese, who conquered
    Melaka in 1511, are not mentioned, though a ‘Melaka ship’, created exclusively
    by people from Java, Sumatra, and the Malay Peninsula; it seems unlikely that
    the referent of ‘Melaka ship’ could be a locally created vessel arrived after
    1511, and even more after 1513, when a Portuguese expedition arrived in Java and
    a Muslim Javanese fleet attacked Portugueseheld Melaka. This provides a(n) argument
    terminus ante quem for the poem''s composition. Precisely when the text was composed
    is unknown, although differences between Bujangga Manik and the ethnographic record
    (i. accounts written by outsiders in English, Portuguese, and other languages)
    place it earlier in the fifteenth century, around 1470 or so. The name ‘Bujangga
    Manik’ was bestowed by Noorduyn: it is merely one of the three names by which
    the poem is mentioned in another Sundanese lontar text, the Sanghy-awang Swarcarita
    (Jakarta, PNRI, L26), suggesting that that may have been the poem''s original
    title. There is no title or author attached to the manuscript and no colophon
    explaining its creation due to the absence of the manuscript''s final folio(s).
    As it was collected by an English merchant in the 1620s, almost certainly on the
    coast of Banten or West Java, it is unlikely the locale in which it was written
    be identified.'
