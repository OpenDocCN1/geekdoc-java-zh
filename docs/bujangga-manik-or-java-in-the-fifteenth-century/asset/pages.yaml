  md: 'samapun to say goodbye to the ascetic, he addresses with the title mahapa-ndita
    (BM 90). The precise meaning of the phrase is difficult to ascertain; it seems
    to mean ''for me'', ''hello'', and ''goodbye'' depending on the circumstances.
    It can be said of sumanger, or word Bujanga Manik uses when parting angrily from
    his mother after rejecting Jepong''s attempt at negotiating a marriage. Sumanger
    comes from PMP *sumanen* soul of a being (ACD 885); in MSd it appears to have
    been replaced by its Malay cognate sepanjang (Danadibrata 2006:65; Rigg 1862:245
    qui sub mangat [sic]; see Winstedt 19509). Both forms mean ''spirit'' or ''good''.
    In BM 643 the meaning is evidently a parting air to ''farewell''.


    Another phrase used by the ships'' captains is núpis sa sapilunan, which Noordijn
    and Teeuw (2006:377) translate to ''good luck, farewell!. It appears to be a respectful
    way of saying goodbye. Sapilunan is derived from law ''slowly, gently'' (Rigg
    1862:245; KUBS 257), and a more literal translation of the entire phrase might
    be ''good is he'' who takes care (the meaning of the pic... unclear—see Table
    13 above). The expression is in any case entirely Sundanese, and it is hard to
    imagine a Japanese sailing between Java and Bali being aware of or using it. Of,
    Bujanga Manik''s metrical constraints mean that it is difficult to judge whether
    or not his greetings and expressions—or, more broadly, any of the language—reflect
    Sundanese as actually spoken in the late fifteenth century.


    Bujangga Manik''s Old Sundanese sentences are short and simple. The constraints
    of an octosyllabic metre built around disyllabic roots; the lack of infections
    or other markers of formal syntactic relationships; the dropping of subject pronouns;
    and the relative obscurity of the text''s language and the paucity of resources
    for its study present challenges of interpretation and translation. The text''s
    frequent recourse to formulae aids decipherment, however. The differences between
    Old and modern Sundanese materials can be applied (with caveats) to texts like
    this one, and the presence of Old Javanese loanwords and the close relationship
    between Sundanese and Malay open up other avenues upon which philological research
    on Old Sundanese literature can produce. Many questions remain regarding the vocabulary
    and (to extent) grammar of Old Sundanese, but it is by consulting such materials
    that I have arrived at the translation of Bujanga Manik found in the next part
    of this work.'
