    # CHAPTER 3


    # 2.2 Javan Toponymy


    Bujangga Manik’s toponyms can be divided into Javan and extra-Javan—''Javan''
    (as opposed to Javanese) meaning placenames in Java and Sunda, and ''extra-Javan''
    meaning the names of places off the island. The far outnumber the latter. In this
    section I will take a look at the structure of Java’s toponyms as they appear
    in BM before addressing some of the more placonyms in the political history of
    the island, among Pakuan, Jawa, Majapahit, Demak, and Gresik. In the following
    section (Section 2.3) I will examine the extra-Javan places. The identities of
    the mountains and rivers that feature in BM are summarised in Appendix B and the
    details of the route, as mentioned above, be found in Noordyn (1982) and Noordyn
    and Teeuw (2006).


    I also listed the more common place elements in BM’s Java toponyms in Appendix
    B (Table 18) with their probable etymologies, but I shall summarise their features.
    The Javan toponyms are usually made up of two morphemes containing two or three
    syllables apiece, a pattern found elsewhere in the region (Kuala Lumpur ‘muddy
    estuary’ in Malaysia or Fatu Le’u mediocre rock in West Timor) and common in modern
    toponymy, such names are often written using one orthographic word (e.g. Wonosobo
    ‘forest meeting’). Of these elements most are Javan or Sundanese while BM’s structure
    and approach to place may be based on indigenous concepts, many are Sanskrit (or
    other Indian languages). Monomorphic toponyms can also be found in the text, although
    these are rarer (and noticeably less common than in kakawin). Some placenames
