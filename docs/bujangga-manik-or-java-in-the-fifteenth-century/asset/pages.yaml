  md: '# THE TRANSLITERATION AND TRANSLATION


    It seems important to mark the distinctions between different kinds of nasals
    as they appear in the manuscript, and in the manuscript a nasal appears before
    palatals in consonant clusters. The reading of <ny> would be unclear to many readers
    in such cases, so I have opted for e.g. paanjang (''long'') rather than panjang
    (Msd, N) or panyang.


    Glides are often marked in the manuscript but left out in N. I think it best to
    note their presence. Where N has sia, for instance, I have opted for siya, as
    the vowel (i) and the glide <y> are frequently marked in the manuscript, and where
    they are not, the w is usually lacking the <i> and <y>. Thus also h<i>i</i>yang
    and séyahah rather than hiang.


    The pronoun ''i'', frequently occurs with an epenthetic initial consonant or glide.
    After the verb mungkar, for instance, it often has the form being. After prepositions
    ng ku ngang acquires the form being ''by me''. In the former case N leaves the
    <r> but in the latter N opted for ngang. This seems inconsistent and it may obscure
    an interesting feature of OSD orthography, especially if we assume that aksara
    were intended to be preceded by a glottal stop. I have therefore opted for raing
    and ngang (and similar spellings) where those appear in the manuscript. This affects
    others as well, notably the ngatma in BM 1634 (Sk tma).


    N differences between the two vowels <e> and <u>> are not marked in OSD orthography
    and I follow Aditia Gunawan''s recommendation not to make it in transliteration.
    Where <e> and <u>> occur together they should be read as distinct vowels separated
    by a glottal stop—e.g. deuk [dajuk].


    The nasals require sensitive handling; Nasalisation of vowel is common in Msd,
    even those preceding nasal stops (Müller-Gonda 2001:11), and some common words
    in modern Sudanese and Javanese have variants with without nasal (e.g. usir and
    ngang in Javanese, of Cs husid). Nasal stops are often absent where they would
    be expected in this and other OSD manuscripts.


    The word <m>pang is never spelled with <m> in Ms jav. b.3. (R), but on whether
    it is pronounced with the nasal and not as lep (eg. Ojv lamp [OED 97122], Msd
    leampang). On the other hand, the word sudah is spelled without a nasal in BM;
    Noordyn inserts an <n>, su(n)dah, his decision on other OSD texts, particularly
    The Sons of Rama and Rawana, in which the word is spelled (sudah). I have opted
    to leave the <n> out of the transliteration on the grounds that it may represent
    a difference in dialect. The source of the word is Sanskrit sudd (Gonda 1973:565),
    which notably lacks a nasal stop, as does Malay sudah. An editor could easily
    arrive at a different decision with regard to this and other nasals.


