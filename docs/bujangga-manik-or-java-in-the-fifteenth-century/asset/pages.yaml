    The routes by the ascetic Bujangga Manik through Java have been covered in a detailed
    article by Noorduin (1982), in which he was assisted by Bernd Nothofer, and with
    regard to the identification of places in Java little more can be added. In this
    section I, however, summarise Noorduin''s conclusions and discuss probable changes
    in Java''s landscape since the poem''s composition (Section 2.1). After this I
    will summarise the poem''s geographical information and toponymy, describing the
    major places mentioned therein. In Section 2.2 I focus on the better-known Javan
    toponyms—Java, Demak, Majahit, Balungungan, etc.—before looking at the places
    outside Java in Section 2.3. For details of the route the reader should consult
    Noorduin''s article (which can also be found as an appendix to Noorduin and Teeuw
    2006, albeit without the hand-drawn map [1982:417]). I have summarised some of
