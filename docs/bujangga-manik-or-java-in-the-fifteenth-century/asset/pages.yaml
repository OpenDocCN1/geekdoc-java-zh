    from India to China and back would take three years using the monsoon cycle—departures
    could be timed by the winds and currents. Ships from India to Melaka sailed between
    April and August, for example, while ships from India to China departed between
    June and August (Mikiks 2013:37–38). The monsoon cycle seems to have been discovered
    in the late first millennium BCE (see Hourani 1995:24–26), and exploiting the
    winds was a skill experienced by but many anonymous sailors and navigators (see
    Lewis 1973 for fifteenth-century travel on the Indian Ocean). Many of the commodities
    mentioned in BM came from outside the archipelago—harvested by anonymous peasants
    and forest-dwellers elsewhere in the hemisphere—and they must have been bound
    to Sunda sailors ever expertly traversing seas made dangerous by storms and piracy.
    References to commodities in texts like BM are much more than the dual cataloguing
    of irrelevant minutiae; they instead constitute traces of the lives and labour
    of people otherwise unheard or even excluded from histories and of the hemispheric
    connections facilitated.


