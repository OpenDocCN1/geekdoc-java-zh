    # 3-3 Phonology


    Sundanese phonology is conservative, retaining most proto-Malayo-Polynesian elements
    unchanged (with the important exception of /w/, which underwent an interesting
    sound change in prehistory—see below). The phoneme inventory of Old Sundanese
    appears to be essentially the same as of Malay/Indonesian, and as represented
    in BM the language has six vowels and seventeen consonants including the glottal
    stop (which is not explicitly marked by the script whose presence may inferred).
    No long vowels, aspirated stops, or retroflex consonants are found in the script
    used in MS Jav. b.3. (R), although they can occasionally be encountered in Oj
    and Skt loanwords in other OSd texts. Whether they were pronounced according to
    their original values are not clear. I have decided to omit them from the tables
    and discussion below, as this section is intended as a description of the language
    of Bujangga Manik rather than the OSd corpus as a whole. The phonemes that do
    appear in the poem are represented using IPA approximations; the symbols in angled
    brackets are the letters used to represent the phonemes in the transliteration.


    The precise values of these phonemes at the time are unclear, and there have certainly
    been changes in Sundanese pronunciation since the composition of the text, particularly
    with regard to vowels and nasalisation (see Müller-Gotama 2011). All the vowels
    appear initially, medially, and finally. Sequences of vowels were probably separated
    by a glottal stop, as in MSD, and vowels indicated in the script by aksara swara
    probably had underlying glottal stops (e.g. ruum [ruʔ]). MSD and OSd forms are
    often identical, but the vowels can differ unpredictably (as in consonants, albeit
    least often). One could compare OSd deuk [dəuk] (BM 60) with MSD diuk [sit, be
    seated]; or, inverted, OSd bikas [bikas] (BM 942) with MSD beukas [bikas] ''go
    release; mark; trace''. Some of this unpredictable variability may be due to a
    combination of diachronic change, dialect differences, or Javanese or Malay influence,
    but either way it means some leeway may be given for interpretations of OSd hapax
    legomena. The word cugenang (BM 287), for example,


