    1.2.1 Preparing Lontar


    Balinese lontar processing—a living tradition—has been described by Rubin (1996:136–137)
    and in more complete form by Hedi Hinzler (1993:446–50). While there are no guarantees
    that modern Balinese processing was the same as medieval Sundanese practice, there
    are few other fruitful avenues open to us, and the leaves were probably imported
    Underway as it is unlikely the earlier stages of processing were performed by
    Sundanese people.


    The objective of processing the leaf is to turn it into a usable writing surface
    that will resist insects and humidity (Hinzler 1993:446). The lontar leaves are
    cut and sun-dried whole, changing their colour from green to yellow, before they
    are soaked in water, changed daily, for three to four days. The leaves are dried
    again in the sun and trimmed, the central rib removed to create a flat surface;
    they are then cut into the shape appropriate for the kind of manuscript they are
    destined for (less prestigious texts would receive worse-quality and smaller leaves)
    and boiled ''in a herbal solution for approximately eight hours'' (Rubinstein
    1996:136). They are cleaned and dried again before being moistened and left to
    cool in the evening air. The leaves are then pressed flat in bundles in a device
    designed for the purpose (known in Balinese as a pamlagbagan) over'
