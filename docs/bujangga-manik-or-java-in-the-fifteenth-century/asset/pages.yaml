    # 2.4 The Correction of Errors


    A small number of error corrections appear in MS Jav. b.3. (R), most of which
    have been marked in the transliteration in italics placed within square brackets.
    There are three kinds of correction in MS Jav. b.3. (R), at least two of which
    can be found in other Indo-Malayian palm-leaf manuscripts (see van der Meij 2017:314–340)
    for an overview of the subject. None of these involve scratching the offending
    syllable or striking it, a method reasonably frequently in paper manuscripts.


    The first method is to create a nonsense syllable—a syllable impossible in Old
    Sundanese orthography—in order to cancel the syllable as a whole. This is done
    by providing the syllable with too many *sandangan*, usually a *panyuku* (-u)
    and a *panghulu* (-i) together, a technique known from Javanese manuscripts dating
    back to the sixteenth century (van der Meij 2017:324) and often used in the Balinese
    tradition, where it is known as *suku-suku* marking. Three examples of this from
    MS Jav. b.3. (R) can be seen in Figure 15:'
