    The materials of a Chinese bow were described in The Rites of Zhou (周禮 zhōu lǐ),
    supposedly written in the Zhou dynasty but more likely to date to the early Han
    (as an ‘Old Text’ [古文經]—see discussion in Selby 2000:90–91; Nylan 1994). A bow
    required a wooden core supported on the belly by horn (to resist compression)
    and on the back by animal sinew (to expansion) glued together with Ising. The
    nuts were cut into horn or wooden inserts at either end; in English longer non-moving
    inserts were referred to as ‘siyah’, although these were less common on early
    Ming-era bows (Loads 2016s:5–8). The whole bow was made with silk and coated with
    lacquer to protect it from the elements, including humidity (cited specifically
    as a problem in The Rites of Zhou). Archery with bandits (rather than crossbowes)
    was common on Chinese ships in the nineteenth century: Later woodcuts clearly
    showed bows with elongated siyahs on ocean-going ‘Fujian’ ships, and bows are
    known to have been carved on Song-era ships too (see Lam 2022: Fig. 27; Miksic
    2013:1). Composite bows are significantly more powerful than self-bows, and it
    is easy to see how a Chinese bow trained in the Wāj-like system has also been
    seen as fifteenth-century Indonesian shipping.


    The 1392 Mongol invasion (see Bade 2013) may have brought a similar archery to
    Java, although composite bows were used throughout Afro-Eurasia they could come
    to Java in any number of ways. From other Indonesian islands are typically wooden
    or bamboo self-bows shooting unfletched arrows—e.g., the Tanimbarese weapons (1940:93,
    plates XI and XXXI)—and the Indian-style bows depicted in Central Javanese-reliefs
    (Figure 36) were probably less effective than those used by Mongol and Mamluk
    archers. Composite bows were depicted in the Majapahit period; a relief at Candi
    Panatan depicting Indrajit as a horse archer24 (see Gomans 2018) has received
    particular attention, but similar bows were depicted elsewhere.25 This could have
    been more fashion, but these reliefs suggest that horn-sinew composite bows were
    known in Java in the fifteenth century.


