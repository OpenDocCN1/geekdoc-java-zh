    is narrated in the form of a list of places which he walks. After studying at
    the Javanese sanctuary of Rakyat Labah (identifiable with the Majapahit sanctuary
    known as Candi Panantar, built and enlarged at various points between 1197 and
    1454), Jaya Pakuan feels homesick and returns to Kalapa (modern-day Jakarta, the
    pre-eminent Sundanese port-city) by ship, acquiring a new name, Ameng Layaran
    (''sailing novice''), in the process. After arriving home, his mother and anotherwoman
    Ajung Larang, who has fallen for him owing to his handsomeness, daughter, Jongpong
    Larang, conspire to marry him off Ameng Layaran is presented with marriage proposals,
