    # 2.5 The Second Hand


    The description above concerns the dominant hand in Bodleian MS Jav. b.3. (R),
    but another, seemingly younger, hand occurs in what appears to be a piece of off-hand
    interlinear commentary on the left-hand side of f17 between the second and third
    lines (Figure 18 below). This pair of syllabic lines has yet to be conclusively
    deciphered and does not appear in Noorduyn and Teeuw (2006). I believe this text
    is in a more recent hand than found in the rest of manuscript, although that is
    not certain. It is nonetheless clear that it was added by a different scribe after
    the completion of the main text.


    My interpretation of these lines arrived in collaboration with Danish scholars
    Aditia Gunawan of the PNX1, Ilham Nurwansah of the Dream Project, and Panji Topan
    Bahagia, an independent scholar based in Garut. After making contact with Twitter,
    I alerted Panji to the existence of these initial strokes and just helped me in
    understanding them. Within hours he had produced an interpretation of the line
    as a commentary on Bujanga Manik''s rejection of the female ascetic in 86–868,
    which he posted to Facebook, where the discussion continued. I believe this interpretation
    to be accurate, the details are confusing and it took us a while to arrive at
    a satisfactory transliteration. The dephinges on the first word, *hurung* ‘glow-blazing,
