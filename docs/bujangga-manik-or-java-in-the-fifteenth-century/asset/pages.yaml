  md: 'PLACE IN BUJANGGA MANIK 187


    Thanks to Noordyn the ascetic''s routes are easily summarised. On his first trip,
    Jaya Pakuan—the ascetic''s name—leaves Pakuan, the capital of Sunda and identifiable
    with the northernmost parts of modern-day Bogor, heading east along the Puncak
    pass north of Mount Gedé/Pangango. He crosses the Cipali (Taboo River), near the
    Brebes), causing him to enter Javanese territory (alas Java), most of which, it
    was governed by Majapahit. No concrete information is given about the ascetic''s
    final destination on this journey, although it is implied that he travelled to
    Rahat Palah (Candi Panaran in East Java) and with certainty that he went to Damalung
    (Member Mabaya in Central Java). He appears to have studied at one or both of
    these places. He becomes homesick, however, and walks to Pamalang on the north
    coast of Central Java, from where he takes a ship (parahu) to Kalapa (modern-day
    Jakarta). From Kalapa he walks to Pakaicilan, the royal district of Pakuan and
    the starting of his journey, where a woman, Jompong Larang, falls in love with
    him.


    After rejecting him, the ascetic travels east, hoping to arrive at Balubungan
    (Blambangan) in the far-east corner of Java. He sets out through the territory
    of Saung Agong and the past mountain of Tompas (''basket of gold'', modern-day
    Tampamas) in kab. Sumedad, before heading through Kuningan, still in Sunda, where
    he comes to Arega Jati (''teal mountain''), apparently home to a bathing place
    (jalatunda) and a memorial to the Sundanese Sili Wangi. Still tending east, the
    ascetic passes several mountains, including Gunung Agong ''great mountain'' (i.e.
