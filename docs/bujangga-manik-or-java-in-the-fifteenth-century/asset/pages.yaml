    Manik (bujangga: ''poet'', ''scholar'', or ''serpent''; manik: ''jewel'', ''gem'',
    or ''bead''—Chapter 4), he disowns his mother for tempting his spiritual path
    and leaves for the east again, carrying a book titled Siksaguru (''instructions
