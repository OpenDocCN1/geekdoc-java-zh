  md: '# Travelling by Sea


    ![](img/554283bc3d9f2f96cd0b936b4413c21f_244_0.png)


    Three ships are described in Bujangga Manik as at various points in his life.
    These sections are unusual in offering us indigenous accounts of the construction
    of at least two kinds of seaworthy vessels:*parahu* and jong. The former—smaller
    and less powerful boats—are described in the ethnohistoric texts as similar to
    futas or galleys, reliant on sails and oars to power them. The latter were enormous
    ocean-going ships with rattan sails, comparable in size to the biggest Genoese
    cogs or European carracks of the sixteenth century. The conclusions derived from
    these sections of *BM* are supported by the (principally Portuguese) ethnohistoric
    evidence and to a lesser extent by medieval excavations in Southeast Asian waters.
    I will examine the ships'' design and construction in Section 1.


    In Section 2 I will look in detail at *BM*''s descriptions of the mariners and
    crew. *BM*''s ships are powered by gunners, warriors, and sailors; the crews are
    multi-ethnic; and the vessels seem to have been built locally, although the large
    junk may have come from outside Java. When they leave harbour songs are sung,
    hammers and cannons are fired. It is apparent that the most important cargo on
    the last ship is Bujangga Manik himself, even though he joins the ship for a day.
    These ships were fascinating places; more than just transportation, Javanese junks
    in particular hosted entire communities of people from birth to death, and the
    smaller craft described in *BM* are extraordinary for the peoples, languages,
    and religions that must have mingled on board.


    ![](img/554283bc3d9f2f96cd0b936b4413c21f_244_1.png)


