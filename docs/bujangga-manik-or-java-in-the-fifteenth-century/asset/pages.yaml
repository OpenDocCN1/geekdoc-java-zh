  md: '# A Note on the Text


    This work includes words and quotations in several languages, some of which are
    not written in the Roman alphabet. The transliteration of Old Sundanese is discussed
    at length below. Old Javanese is presented as in Zoetmulder''s Old Javanese-English
    Dictionary (OJED—1982). Indic and Dravidian languages are transliterated according
    to the International Alphabet of Sanskrit Transliteration (IAST). Literary Sinitic
    (''Classical Chinese'') is transliterated using Hanyu Pinyin (except where Sinitic
    languages/topects are used). Middle Chinese spellings are taken from Kroll (2017),
    Phags-pa Chinese/Yuán Mandarin from Coblin (2007) and Pulleymank (1991), and Ming
    Yanhua/Mandarin ones from Coblin (2000). Old East Slavic is presented in Cyrillic
    or where necessary to the Library of Congress standard. The spellings in medieval
    and early modern European texts have not been regularised, except where I have
    been unable to access an original text and have relied on the alreadyregularised
    spelling in an edition. Editions and manuscripts for the primary sources cited
    are explained in the Introduction, and primary source quotations in the original
    may be found in Appendix A; these are marked in the text with superscript ''A''
    with the relevant name as listed in the appendix (e.g. ''AGP''). Translations
    are my own unless otherwise indicated. References to lines in Bujangga Manik are
    given in the form ''BM [number] Dates are in the Common Era unless specified.
    All botanical identifications are taken from The Plant List (http://www.theplantlist.org/)
    and World Flora Online (http://www.worldfloraonline.org/); the latter is intended
    to be more complete in tracking and listing synonyms than the former, as of the
    writing of this work The Plant List appears to have more complete information
    for many Southeast Asian species.'
