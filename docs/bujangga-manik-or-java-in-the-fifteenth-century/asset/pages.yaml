    # 3.1 Overview


    The language used in Bujangga Manik is rather simple. Almost every line consists
    of an independent eight-syllable sentence comprising a verb and a subject, although
    some consist entirely of noun phrases or serialised verbs. Subjects are frequently
    dropped. Many of these lines are formulaeic and repeated throughout. The majority
    of lines are verb-initial, as in Old Javanese; this feature may have been archaic
    when BM was composed, as word order in modern Sundanese is generally SVO (as modern
    Javanese and Malay). BM contains few any complex sentences with multiple dependent
    clauses, and metrical lines are typically related to one another through parataxis.
    There are no compulsory inflections for tense, gender, evidentiality, or number,
    although an infix ⟨ar-⟩ can be applied to verbs and adjectives (and less commonly)
    to denote a plural subject. With most of its closest relatives, however, including
    Malay and Javanese, Sundanese makes use of several derivational affixes that can
    be applied to nouns, verbs, and adjectives, changing their valency, or word class
    (among much else). There are more of Sundanese than in Malay, however.


