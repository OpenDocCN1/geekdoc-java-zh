    # Titles and Kinship Terms


    In many other Austronesian languages, titles in Old Sundanese are not gendered,
    making it difficult to properly render them in English. Both men and women may
    be tahan, for instance, a word best translated as ''Lord'' or Lady—related to
    Malay tuan ''lord'' and tuhan ''god'' and probably originally from PMP ‘qatuan
    ‘deity’ (ACD 4365). This term is applied to Bujangga Manik before he ever enters
    Pakuan (BM 12), and must be a noble title, not a term for an elder (cf. MSd toha,
    a word for elders and uncles). Taan appears to be a short form, originated of
    its own as tuan orang ‘Our Lady’ to Ajung Larang, the mother of Jongpong, the
    woman who falls in love with Bujangga Manik.


    Some titles are from Sanskrit and Oj. In MSd the word prabu is used to denote
    kings and princes—in Prabu Siliwangi, the standard name for the legendary king
    (Ekadjati 1962:122). This comes from Sanskrit prabhu ‘lord, king’ (OJ 13758).
    In Ojd, we find the word prebu instead—a different spelling and likely a different
    meaning, although the origin is the same. Noordyn (1967:470) connects prabu to
    paibou or paybou, Pires'' transcription of what he says was the Sundanese name
    for a local lord, equivalent to the Javanese ''pate'' (i.e. path—a high official
    in the kraton [OJED 2342:31] (f147—Corteão 1994:413; Pires 2018:39)—and thus not
    a prince or king. Prabu seems to be a later borrowing from Javan. I have translated
    p(e)rebu in its sole occurrence, as a title for Pakuan before he heads (BM 13),
    as ''Master''.


    Rakéyan is another noble title, this came derived from Ojv rakyan, ‘before the
    name or the categorical noun (apati, tumengñung etc) [or] in courteous address,
    to a younger person (OJED 1491:7). In BM it appears exclusively before Ameng Layaran,
    of Bujangga Manik''s names, and only after the


