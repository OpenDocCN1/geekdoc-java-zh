  md: '# Things in Bujangga Manik


    Bujangga Manik''s documentation of material culture in fifteenth-century Java
    goes beyond ships and houses. Lists of perfumes, flavourings, dyes, metals, and
    glass items make up significant chunks of both the mundane and heavenly parts
    of the poem, with many of the same commodities found in Sund and in sorga (''heaven''),
    an idea encountered in OSd (e.g. Sri Ajnyana SA 469–674). In this section I will
    examine some of these commodities, noting their places of origin and particularly
    their roles in the medieval world. Many of the Indo-Malaysian commodities referred
    to in BM are discussed at length by Tom Hoogvers (2011) and are well-known in
    the literature on the region. Others—particularly those from outside Indonesia—are
    less well-documented, and about those I have gone into more detail. I will start
    by looking at animals, and botanical products in various contexts (Section 1)
    before moving on to metal, glass, and other manufactured goods (Section 2).


    Indo-Malay historiography is dominated by political history and the (often dubious)
    exploits of elite heroes like Hayam Wuruk, Hang Tuah, and Siliwangsa. Histories
    of ''Hindu-Buddhist'' Java focus on diplomatic missions to China and the acts
    of kings and religious figures recorded in local inscriptions. Ordinary lives
    and interests are often left by the wayside. This is to the detriment of our understanding
    of the region as a whole—if me—rather boring, barely connected to life as it is
    actually lived. In the absence of the exhaustive documentation of daily life for
    medieval microhistories, we must look for ways to slot ordinary people back into
    Southeast Asian history. Commodities offer us such a path. As Joshua Specht (2019)
    has recently argued, commodities and their movements allow us to write global
    histories connecting disparate communities that do not rely on elite linkages.
    Plant products are used by the rich and powerful—as, indeed, by BM—but they are
    grown, harvested, and transported by people who do not otherwise feature in the
    historical record.


    Merchants travelled across the Indian Ocean on relatively predictable routes dependent
    on the regular cycling of the southwest and northeast monsoons (see Wheatley 1966x-xx).
    ''Predictable'' does not mean ''fast''—a round-trip'
