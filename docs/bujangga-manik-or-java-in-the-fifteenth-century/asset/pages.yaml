    the pronunciation probably be unaffected. An alternative method of writing the
    same line would be to use a pamáh after <na>, cancelling the inherent vowel, and
    then writing aing with an initial aksara swara <a>, as passim in MS jav.b.3 (R).
    The panolong is more efficient and just as clear, however.

    The panolong also appears at the ends of some orthographic lines on the far right-hand
    side of the leaf to indicate that the metrical line has not finished and continues
