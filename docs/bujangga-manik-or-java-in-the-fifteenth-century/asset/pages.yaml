  md: '# 2.3-5 Aksara Pasangan


    Aksara pasangan are used to create consonant clusters. The aksara nglegena is
    usually on top, just under the ruled headline, and the aksara pasangan is usually
    placed underneath. In most cases the pasangan form is identical to the nglegena
    one; Table 5 shows only those forms that differ. The combinations-nca- and -nja-
    (in modern Sundanese orthography) always use the aksara nglegena—⟨ña⟩, representing
    a palatal nasal—⟨ñca⟩ and ⟨nja⟩. This originates in Brahmi and, indeed, in Indian
    phonological theory. Aksara ⟨ca⟩ and ⟨na⟩, ⟨ya⟩, and ⟨wa⟩ both lose their top
    strokes when used as aksara pasangan; ⟨ba⟩ acquires a unique form; ⟨ma⟩, and ⟨wa⟩
