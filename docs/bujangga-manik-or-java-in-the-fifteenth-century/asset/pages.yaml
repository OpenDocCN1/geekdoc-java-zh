    INTRODUCTION


    Folk interpretations of the past can be extremely flexible and it is not wise
    to rely on oral tradition when interpreting the evidence of six centuries ago.¹18
    *Carita pantun* cannot be considered to faithfully reflect the politics and way
    of life of the medieval Sundanese, although the tales are invaluable documents
    of later Sundanese thought and culture in themselves, I suggest that we would
    be making an orientalist mistake if we assumed that Sundanese *pantun* were inherently
    more reliable than, say, European oral traditions in the reconstruction of the
    pre-sixteenth-century past.


    # 2.1.5 Sunda and Java


    Sunda may have been a Javanese vassal under the Siñhasari kings in the thirteenth
    century (as stated in the *Deśwana* [42.2]), but it seems to have remained politically
    independent of Java in the fourteenth and fifteenth centuries. Sunda is not listed
    as a vassal of Majapahit, the powerful late-medieval Javanese state (1293–c1350?),
    in either the Classical Malay *Hikayat Raja Pasai* (traditionally dated to c1390,
    but more likely to be somewhere between 1428 and 1448—see Guillot Kalus 2008;
    Jones 2013;xxiii) or the *Deśwana*, fostered by Paparcha in 1365 (Jones 1987).
    Both texts list toonyms in eastern and western Indonesia as Javanese domains,
    including Malay, Maluku, and Banda—but in the late Middle Ages Sunda appears to
    have been claimed by nobody except Sundanese.


    However, according to a small number of Javanese and Sundanese texts, notably
    the sixteenth-century *Carita Parahyangangan* (Atja and Danasarita-1981b), *Kidung
    Sunda* (Berg 1927), and *Pararaton* (a text with a complex history—see Sastravan
    2020), an important conflict took place between Java and Sunda in the year 1357.
    The *Pararaton* refers to this *Sunda Bubat* incident or the Bubble of Bubat.
    The premise of all the accounts is that Hayam Wuruk, the Javanese king, was supposed
    to marry a Sundanese princess, but a disagreement occurred when he arrived at
    Bubat, not in the Majapahit capital (mentioned in in B 801¹). The *Carita Parahyangan*
    says that *pan prang di Majapahit* ‘so [the common people] fought in Majapahit
    because of a refusal to marry (*mulum lakian di Sunda*—Jakarta, PNRI, L406, f.20).
