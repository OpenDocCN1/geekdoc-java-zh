  md: '# Introduction


    In August 1511 the Portuguese *conquistador* Afonso de Albuquerque conquered the
    wealthy Sultanate of Melaka on the Malay Peninsula with a small force of European
    and Indian soldiers. The battle was hard-fought, with many of Albuquerque''s succumbing
    to poisoned blowgun darts and bullet wounds, and the eventual Portuguese victory
    was secured through a combination of brutal street fighting with the city''s many
    ethnic factions. Soon after the conquest an expedition under the command of António
    de Abreu, who had been shot in the mouth during the battle, was sent to Banda
    and Maluku in eastern Indonesia, the islands where nutmeg and clove grew. In 1513
    another expedition was dispatched to Java in hope of establishing alliances with
    non-Islamic powers on the island—powers like the Hindu kingdom of Sunda in what
    is now West Java, Banten, and Jakarta. For the first time of eastern Indonesian
    spices began to make their way to the hulls of European ships, bypassing the well-developed
    network of ports around the Indian Ocean that had relayed to the north and west
    throughout the Middle Ages. Soon—particularly after the first navigation by the
    Magellan-Elcano fleet in 1519–1522—ships were arriving in the archipelago with
    cargo from the Americas; the European newcomers initiated mediated contacts with
    Southeast Asia and the Western Hemisphere, introducing new crops and forever altering
    the environment and demography of the entire region. The European presence exacerbated
    tensions between Muslim and non-Muslim people and peoples paradoxically in the
    dramatic spread of Islam throughout the islands. The succeeding four centuries
    in Southeast Asia were defined by the impact of American crops and European contact
    and colonialism.


    The *conquistadores* had been attracted to the region by the desire to wrest from
    Muslim the trade in luxury goods: Spices, especially, porcelains, talking birds,
    and precious stones. Since the return of the end of the thirteenth century Europeans
    had read of an island *Jaua* or *Java* or *Iana* that was the biggest in the world,
    visited constantly by Chinese and Indian ships and abounding in spices of all
    kinds (Figure 1). Later reports added fantastical details: The Franciscan friar
    Odoric of Pordenone (c-1330) claimed that the Great King of Java had seven crowned
    kings as vassals and lived in a palace made of gold and silver, Niccolò'
  merge: -1
