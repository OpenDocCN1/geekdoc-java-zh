    # 2.3.8 The Uses of the Pamaeh and Panolong


    A brief aside is necessary to explain the uses of the pamaeh and (second half
    of the) panolong (or, as in Noordyn and Teeuw 2006, the avagraha). The pamaeh
    is simple: It cancels the inherent vowel of an aksara. This allows a word to end
    in a consonant, and it can also be used to form consonant clusters using aksara
    pasangan. An example of the use of the pamaeh can be seen in Figure 11:


    ![](img/554283bc3d9f2f96cd0b936b4413c21f_90_0.png)


    FIGURE 11 The use of the pamaeh (examples from f.9). L: The word kilat, where
    the aksara ⟨ is modified by the pamaeh, killing the inherent vowel. R: The word
    ditaña, where the aksara ⟨ is unmodified by pamaeh, meaning that it is pronounced
    with its inherent vowel as [ta]


    The panolong performs at least two functions in MS Jav. b.3. (R), the most common
    of which is the second part of the split digraph for sandangan ⟨. In Javanese
    scripts this function is taken by the namely indicating a long vowel (Jv tarung);
    as no long vowels occur in Old Sundanese (at least in Bujangga Manik) this function
    is not found. The other of the panolong, one not found in the Javanese scripts,
    is to introduce a gap between the consonant of an aksara ngeleng and its vowel
    at word boundaries. This can be thought of as ‘doubling’ the affected aksara while
    cancelling the vowel of the first iteration, but because consonant assimilation
    was not a feature of Old Sundanese phonology in practical terms the panolong simply
    serves to separate the inherent vowel from the consonant of the aksara it modifies.
    This is an unusual feature but its use is fairly straightforward, and it seems
    to have been used principally to save space on the page. I have provided two examples
    below.


    Figure 12 shows an example from BM 863 on f.17a. The line out is be bawing apus
    sata(m)bi ‘I brought a book with me’—but only one aksara ⟨ is present. The text
    actually reads (where an apostrophe represents the panolong):


    > ba wa ing sa ta bi


    The panolong tells us that the features of the aksara ⟨ are spread across the
    words apus and sata(m)bi. This is simpler than writing the aksara twice'
