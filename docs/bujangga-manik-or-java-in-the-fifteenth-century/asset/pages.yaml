  md: '# 4


    # INTRODUCTION


    Black Death had no impact at all. We have no medieval Javanese cookbooks to consult.
    The main reason for this is climatic: Java’s hot, humid climate and abundance
    of leaf-chewing insects are not conducive to the preservation of organic manuscript
    material. Manuscripts rarely lasted more than a century (Cree 200423). If copies
    were not made regularly—considerably more frequently than in temperate climates—then
    texts would disappear.


    Javanese power appears in age to have diminished rapidly from the beginning of
    the fifteenth century to the arrival of the first Portuguese ships in Southeast
    Asia in 1529, as new Muslim power on the Malay Peninsula, and port-cities on Java’s
    north coast—notably what had by c.1473 become the Sultanate2 of Demak—filling
    the vacuum left by Majapahit. The history of this period is one in which of Muslim
    saints and scraps of information gained from foreigners'' accounts have taken
