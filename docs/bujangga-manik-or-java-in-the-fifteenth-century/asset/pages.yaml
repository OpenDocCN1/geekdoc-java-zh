  md: 'A final point on aing/-ing: OSD does not have an arealis, unlike Oj, which
    forms arealis clauses through the application of the suffix -a to nouns, verbs,
    or adjectives indiscriminately (van der Molen 2015:32–34). As far as I know, this
    is not found in OSD. A small number of BM’s sentences, however, have a clitic
    pronoun -eng rather than the usual -ing in contexts where an arealis meaning would
    be appropriate. An example of this may be found in hiding karah wa ''I thought
    would not be'' (BM 971), hideis is an Oj loan (from hidip ''the mind of cognition'')
    [OJED 62j3]—but the form is found with native OSD words as well, as in lamun diturát
    caréng ''if my words be followed'' (BM 551, 58o). It is possible that the -eng
    is the result of elision sandhi (à la OjV) of the OSD bound -ing pronoun and the
    OjV suffix -a. An arealis interpretation is speculative but it is otherwise rather
    hard to explain this phenomenon; aing is not regularly contracted to OSD out of
    such contexts.


    # 3.6 Verbs


    As noted above, verbs can be formed from nouns and adjectives through the use
    of affixes, a reasonably thorough discussion of which can be found in Noordwyn
    and Teeuw (2006:32–40). There are many possible modifications to verb roots; most
    increase or change the meaning of the verb rather than adding information about
    tense, gender, evidentiality, or number (with the exception of the aforementioned
    -ar infix). The most important distinction is between passive and active affixes.24
    Transitive verbs may be made definitively passive by adding the prefixes di- or
    ka- or the circumfixes di-…an or ka-…an to the root; in the MSD all can be found
    in BM. Di- is the most frequently encountered than ka-, which is not similar to
    the OjV passive prefix, but all can be found in Bujanga Manik. As be seen in Table
    17 below, di- also has a variant (labelled di-) which can be applied to intransitives,
    rendering them static verbs, although the most common use of the prefix is in
    forming passive verbs. Agents of passive verbs can be added with the preposition
    ''by (e.g. didalur ku papur kapur ''be accompanied by limestone powder'' [BM 382]);
    this preposition can also be used in the same sense with unmodified transitives
    (e.g. bogoh ku nu mawa ïa ''be attracted/admire those they carried'' [BM 115]),
    implying that intransitives without affixes should be


    24 Although it could be argued that affixes indicate patient-focus and agent-focus
    verb forms respectively, the passive/active terminology is standard in studies
    of Sundanese grammar (see Müller-Gotama 2001:31–33).'
