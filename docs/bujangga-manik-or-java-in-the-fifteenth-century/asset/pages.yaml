    # 2.6 Comparing Old Sundanese Scripts


    Sundanese writing culture has been nothing if not diverse. The language has been
    written in a number of different scripts in addition to the one outlined above,
    including *pégón*, a variant of the Arabic script initially developed for Javanese
    (eighteenth and nineteenth centuries); *cacaran*, a form of the modern Javanese
    asyllabary (eighteenth and nineteenth centuries); the Roman alphabet (nineteenth
    century to the present); and finally codified of Old Sundanese script developed
    in the 1990s by a committee in West Java and used alongside the Roman alphabet
    on road signs and for a limited range of other purposes. The ‘Old Sundanese’ script(s)
    is/are defined in opposition to this.


    The scripts used to write the Old Sundanese language are rather diverse themselves,
    however, and there is more than the simple appellation of ‘Old Sundanese script’
    may suggest. I will argue that *Bujangga Manik* is written in a unique hand of
    the Sundanese charcoal inscribed *lontar* script that was created from a hybrid
    of forms taken from the script representing the Kawali stones and the Sundanese
    inked *geang* script respectively. These forms have all been treated in the past
    as ‘Old Sundanese’ script, and while it may be true in a Ship-of-Theseus sense
    that these are the same’ script, they are sufficiently different in practical
    terms to justify separate treatment and classification.


    # 2.6.1 What Makes a Script?


    Scholars of Indonesian paleography have historically had a propensity to ‘lump’
    rather than classifying writing systems—see, for instance, the eclectic collection
    of scripts and writing systems labelled ‘Kaw’ in J.G. de Casparis’s landmark *Indonesian
    Paleography* (1975). These scripts are the ‘same’ in their formal properties (i.e.
    being asyllabaries, using similar grapheme inventories) are the same, and they
    are very often not ‘mutually ineligible’, in the sense that they are being sight-read
