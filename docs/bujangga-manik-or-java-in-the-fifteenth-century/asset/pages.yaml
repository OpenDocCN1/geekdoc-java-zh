    BM includes a great deal of this—there are more named varieties of betel than
    are named characters, for instance, and we hear more about the gifts Jongpong
    Larang about the ascetic''s mother about Jongpong herself. (These aspects of material
    culture are explored in Chapter 6.) Constant reference to the real world and items
    in it creates verisimilitude, situating the ascetic''s journey to death in a tangible
    place and time. Although BM is fiction—it contains, all, first-person descriptions
    of heaven—it is set in the reasonably real world of late-medieval Java. In the
    poem it can be considered ''supernatural'' until the ascetic''s death, and even
    the heaven to he ascends is treated in the same detail-oriented manner and contains
    essentially the same things as our ''Middle World'' *mad*—BM 1591, 1606.


    There are in any limits to the capacity of Indo/Sanskrit literary comparisons
    to explain the features of medieval Indo-Islamic cultural history, and the literary
    and religious traditions found in Bujangga Manik are at least as ''Austronesian''
    as they are ''Indianised''. Nowhere is this more evident than in the structure
    of the text itself.


