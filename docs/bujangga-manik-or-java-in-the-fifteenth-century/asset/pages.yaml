    # 2.2 Features of Brahmic Scripts


    The script used in MS Jav. b.3. (R) is derived ultimately¹¹ from Brahmi, a South
    Asian script of uncertain origin best known from the Edicts of Aśka (250–232 BCE).
    Brahmi was an abugida or ‘alphasyllary’ (Sproat 2000:45) or a ‘semi-syllabary’
    (Behrend 1996:161)—a script in which, instead of representing phonemes, as in
    an alphabet, the basic graphemes represent syllables. As mentioned briefly above,
    in Indo-Malaysian languages whose scripts derive from Brahmi, the primary syllables
    are known as aksaras (from Skt aksara ‘letter, syllable’). Each aksara represents
    a consonant paired with


    Whether Brahmi had an earlier Near Eastern (Southern Semitic) ancestor is a matter
    of controversy. While it seems plausible that Brahmi letters were themselves derived
    from Proto-Sinaitic and ultimately from Egyptian hieroglyphs, by direct inspiration
    or stimulus diffusion, it is not a firm conclusion. For the purposes of this text
    the Old Sundanese scripts may be considered to derive ‘ultimately’ from Brahmi.
    See Salomon (1998:19–30).'
