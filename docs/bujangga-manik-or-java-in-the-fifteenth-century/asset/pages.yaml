  md: '# CHAPTER 2


    The text below is arranged by folio, so that the OSD text of each leaf (both recto
    and verso) appears on one page with a facing English translation. Metrics are
    separated by interpuncts representing the marks used in the manuscript. Where
    those are not present and may be conjectured, I have encased them in round brackets
    (). Line numbers appear every five metrical lines and are noted in square brackets
    in smaller font—e.g. [85].


    Each side of leaf has four rows of text inscribed across it; a vertical bar |
    in the transliteration indicates the end of each row.


    Elements that properly be in the text but are not indicated by round brackets)—e.g.
    mahapa(n)dita. Elements that are in the text probably should not be indicated
    by square brackets []—e.g. du amhang [ta] ti mea (BM 25), where the ta does not
    fit metrically. BM is a codex unicus, all of these emendations are conjectural.


    The scribe’own corrected errors are noted in italics within square brackets—e.g.
    [niu]. I have kept these in the edited text both to aid in studies of OSD error
    correction and to better represent the text as it actually appears in the MS.


    Ellipsis … indicates a lacuna of any length.


    Proper nouns are capitalised in both transliteration and translation, although
    it should be noted that some toponyms either proper nouns or descriptions—e.g.
    lewang langjang’ dense forest (BM 130).

    BM contains three types of speech: (1) that of an external narrator; (2) that
    of Bujangga Manik, who recounts his journeys in the first person (as, briefly,
    does Jongpong Larang); (3) and that of the people who converse with Bujangga Manik.
    These different speakers are not marked in the manuscript itself and must be inferred.
    In the transliteration I have not these different speakers and have kept the text
    as found in the MS. In the translation, however, (1) I have presented the narrator’s
    voice without punctuation to indicate it; (2) I have what I believe to be Bujangga
    Manik’s diegetic first-person narrator in single quotation marks ‘...’; and (3)
    I have placed all direct speech, including conversations between characters and
    Bujangga Manik’s comments to himself (e.g. BM 63–64), in double quotation marks
    “...”.


    The commentary in Chapters 3–6 would cover plenty of the poem’s content, so I
    have kept to a minimum. Some titles and the names of plants and musical instruments
    are left untranslated. For this reader should consult the relevant sections of
    the commentary.


    The translation is ‘literal’, in that I have attempted to convey my interpretation
    of the meaning as clearly as possible; it is not intended to be a lyrical translation.
    The interpretation of Old Sundanese will improve more texts


    116'
