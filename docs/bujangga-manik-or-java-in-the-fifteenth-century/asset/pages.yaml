  md: '46 CHAPTER 1


    # Codicology


    Oxford, Bodleian Library, MS Jav.b.3. (R) is a manuscript consisting of 39 leaves
    of the lontar (Borossus flabellifer) inside a teak (Tectona grandis) box lacquered
    black on the top and sides. With other Southeast Asian palm-leaf manuscripts,
    the leaves were once attached by cords, but their original order appears to have
    been disrupted at some point and the reading order is not obvious from the current
    physical arrangement. Nor is it immediately clear to non-specialists how the leaves
    should be oriented and turned, and when the manuscript was digitised about half
    the photographs were taken with the leaves upside-down as a result.


    In this section I will discuss the materials of the box and leaves; the foliation
    of the manuscript (that is to say, how the leaves are supposed to be arranged
    in relation to one another); their dimensions; the line markings on them; the
    age of the manuscript; and how each leaf should read. There are significant issues
    with the foliation that will require extended comment. As most palm-leaf manuscripts,
    the folios themselves are not bound into a book or codex shape recognisable to
    European or Chinese codicologists and are separate with three holes punched in
    the centre and at each end by they can be tied together. Pace Dijk der Meij''s
    claim that Sundanese lontar manuscripts bear only one hole in the centre of the
    leaves (2017:153), Bujangga Manik, like other Sundanese manuscripts, in fact has
    three such perforations.


    # 1.1  The Box


    The manuscript is contained within a box or kropak (see der Meij 2017:211–220),
    which is made of two roughly equal-sized components made of lacquered teak joined
    to another by a single tongue-and-groove joint. This kropak wholly encapsulates
    the leaves and affords a greater level of protection from the elements than the
    more-common method of binding palm-leaf manuscripts with simple flat boards. There
    have, however, some damage to the box: the lacquer (presumably of Taxicodendron
    vernicillum) is scuffed on the tops and sides; the tongue of the interior joint
    has been worn down on the inside of the bottom piece; and a long section roughly
    1 centimetre has split off side, exposing the leaves. When complete, however,
    the manuscript would have been contained in a snug box 36.9 centimetres long,
    4.2 centimetres wide, and 2.5 centimetres high. The kropak was probably made for
    the manuscript, as it'
