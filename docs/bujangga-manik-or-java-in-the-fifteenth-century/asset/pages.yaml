    # INTRODUCTION


    This work will examine Bujangga Manik/MS Jav. b.3. (R) from several perspectives
    as a physical object made of wood, cordage, and palm leaves; a handwritten text
    in a particular form of Old Sudanese script; a poem documenting an old form of
    the Sudanese language; as a literary work representing the productive collision
    of indigenous and ''Indianised'' narrative and spiritual traditions; and, perhaps
    most importantly, a window into a hitherto poorly understood late-medieval period
    in the history of the Indonesian archipelago. (I will return to the question of
    the ''Middle Ages'' shortly.) I aim to make the poem—the manuscript of which has
    now been digitised—more accessible to people in Indo-Malaysia and to scholars
    working on the late Middle Ages elsewhere in Afro-Eurasia.


    In this introduction 1 will describe what Bujangga Manik is, provide a necessarily
    brief literature review, give some background on Sunda (where the poem was composed),
