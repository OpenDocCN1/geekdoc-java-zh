    # Codicology, Palaeography, and Language


    ![](img/554283bc3d9f2f96cd0b936b4413c21f_61_0.png)


    Here in Chaper I will show how the manuscript is constituted physically, how it
    ought to be read, and how its writing system works, before analysing the text’s
    phonology, lexis, syntax, and metre. My aim is to make the manuscript legible
    to any interested parties and to render any conclusions reached about the text
    more verifiable and this project necessarily more empirical.


    Chapter I is arranged into three sections:


    +   1. The first deals with the codicology of MS Jav. b.3. (R)—the physical properties
    of the manuscript from its box (kropak) and leaves to its line markings and foliation.


    +   2. The second section concerns the palaeography of MS Jav. b.3. (R). This
    is an attempt to document the features of the ‘Old Sundanese lontar script inscribed
    on the leaves. I aim to describe the writing system so thoroughly that a layperson
    could study the description and be able to transliterate the inscribed text. A
    short section on the script’s probable origins follows the description.


    +   3. The third and final section of Chapter I concerns the use of language in
    the poem. This includes a description of the phonology, vocabulary, and syntax
    of Bujangga Manik. The intent is not to produce a complete reference grammar of
    Old Sundanese but to show how the interpretation of the text in Chapter 2 arrived
    at and how it could be improved in the future.


