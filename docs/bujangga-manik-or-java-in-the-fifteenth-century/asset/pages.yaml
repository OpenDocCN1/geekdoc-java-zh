    de Conti, a Venetian merchant whose adventures were recorded for posterity in
    the middle of the fifteenth century, described two islands two weeks'' sail east
    of Java—Bandan and Sondai—where nutmeg and cloves grew in profusion and white
    parrots the size of seagulls (white or sulphur-crested cockatoos) could be procured.


    The archipelago had been known across Afro-Eurasia for centuries as a source of
    fabulous wealth and exotic luxury, inspiring the Sanskrit name for Southeast Asia—''Land
    of Gold'' (Suvarnabhūmi)—and spurring reports that reached as far as the Roman
    Empire in the first century of islands named Chryse and Argyre where the soil
    comprised gold and silver respectively. The tenth-century Arabic writers al-Masʿūdī
    and Abū Zeyd al-Sirāfi wrote of a mihrāj, or ''great king'' (from Sanskrit mahārāja),
    whose kingdom, *al-Zābāaj*, was the most powerful and densely populated of all
    those between India and China, the fifteenth-century Russian traveller Afanasij
    Nikitin hinted in India of an'
