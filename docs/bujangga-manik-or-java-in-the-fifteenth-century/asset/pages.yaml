    # 1.2.1 Betel


    Betel is a mild narcotic formerly chewed by both men and women and popular in
    Java, where it has largely replaced by tobacco. It is the product of a single
    plant but two (or more); a typical betel quid consists of a sliver of the areca
    palm (*Areca catechu*) wrapped in the leaf of a vine (*Piper betle*) trained to
    grow areca trunks. Powdered lime (calcium oxide) is the most common addition to
    the quid, but other ingredients are sometimes added, including camphor, musk,
    gamble, and Rooney (1993:16).


    Like many Asian plant species, the areca palm was possibly first cultivated in
    New Guinea, where it of seeds appears to long antdate the arrival of Austronesian
    speakers (Kirch 1997:39–40). The palm has relatives in New Guinea, including *A.
    jobiensis* and *A. macrocarca*, and they are also chewed on the island (May 1984:343).
    There is no reliably reconstructed Austronesian or MP proto for ‘areca’ and ‘betel’,
    and the absence of betel among the remains at Lapita archaeological sites in the
    Southwest Pacific suggests that its use outside New Guinea ''may [...] may be
    a phenomenon of the last two thousand years'' (Kirch 1997:217; Rooney 1993:14),
    as also Hoogverst 2011:133–140). In OSd the name for ‘areca’ is *pinang* and ‘betel’
    is *sereh* (MS seureuh); these words have counterparts in Malay (*pinang* and
    *sirih/sirih* respectively), although finding out these terms come from is not
