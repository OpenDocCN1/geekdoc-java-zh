    possible that the manuscript itself dates to the fifteenth century, when surviving
    Sundanese manuscripts are thought to be copied. Whether it was originally transmitted
    orally or not therefore seems moot.


    The text is made up of formulaic lines, though of BM’s poetry is most evident
    when it is read aloud. Many of BM’s formula occur in other Os texts that may or
    not be of similar date and age, and some parallels in MSd carita pantun. These
    are not limited to the aforementioned formula based on verses of motion; including
    seemingly obscure lines de diteh ku aewer mawar *sprinkled with rose-water* (BM
    39, 502), also crop elsewhere. A complete study of Osd formulae and their relationships
    with modern pantun has yet to be conducted, and such an endeavour may have to
    wait for the publication of more manuscript material. It seems likely, however,
    that most BM’s lines can also be found in other Sundanese texts and oral compositions.


    ![](img/554283bc3d9f2f96cd0b936b4413c21f_127_0.png)


    # 3.8 Greetings and Parting Phases


    The conversations that occur in BM are, with one exception, rather brief. Most
    involve the use of basic functional language—greetings and other phatic expressions.
    The most respectful of these greetings occurs when Jonglar visiting Bujang Manik’s
    home, bringing gifts as a first step towards marrying a sister-in-law by sangtabé
    namasiwas (BM 447); sangabé is a Janised form of the Sanskrit *kṣatrya* ‘pranee’
    (OJ 903:8); Monier-Williams 1899:3 sub khantaya, and namasiwas is a Sundisation
    of the Saivist mantra namah Śvāva ‘salutations to Śiva’. It is notable that the
    greeting used by one extremely highly-status Sundanese woman to speak to another
    (of higher status) is Janised Sanskrit. In BM 446 it is said that this expression
    is ‘entirely proper’ (sakanyang).


    A more common gesture is samapun, which occurs six times (BM 318, 960, 1029, 1034,
    1645). Like *sangtabé*, *samapun* means ‘forgiveness’ or ‘beg your pardon’; the
    first element is the Skt *kṣamā* ‘forgiveness’ (OJ 092:6) and the second Sd *pun*,
    meaning ‘forgive(ne)’ or ‘pardon’ (in MSD–KUBS 375). Rigg (1862:36) notes that
    *pun* is ‘often used at the commencement of an invocation’, and it is reportedly
    used for opening and closing ceremonies in Kanékés communities (Hasman and Res
    223:122). It is presumably derived from PMP *ampur ‘pardon, forgiveness’ (ACD
    175–cf. Malay ampun). Jonglarang uses the phrase in speaking to her mother (BM
    318); the *dorakala*, the guardian of heaven, greets Bujang Manik’s holy soul
    by speaking *samapun* (BM 1634); and the ship’s captain Séla Batang says'
