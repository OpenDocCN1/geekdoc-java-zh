    # 3-5 Nouns


    Most of the nouns in Bujangga Manik complex comprise unmodified di- trisyllabic
    roots, although they are subject to a complex set of derivational affixes as Robins
    1983:94–129 for a list and Müller-Gotama 2001:12–26 for analysis of MSd derivational
    morphology). There are affixes that turn verbs into nouns or into different kinds
    of nouns (e.g buyut ‘elder, grandfather’ > ka-buyut-an ‘sanctuary, archive’),
    and nouns can be made into verbs by applying affixes as well, particularly the
    passive (PASS) prefixes di- and ka- and allomorphs of the pre-nasalised agent-focus
    (ACT) affix described below. Active verbs from nouns can themselves be transformed
    into nouns; pani(m)ba ‘bailer, scoop’ in BM 933, for instance, is formed from
    nimba to bail, scoop (ACT’), which comes from timba ‘bucket, pail’. Redplication
    of roots does not usually pluralisation, although initial syllable reduplication
    (jojo(m)pong ‘hairdo’ < jompang ‘mane (of a horse)’ [BM 257]) is common with both
    verbs and nouns in large part from Robins with different meanings (see Robins
    1983:11 for examples). Pluralisation is marked on verbs and adjectives by the
    optional infix -ar-. In MSD, nouns are followed by modifiers, wherein nouns or
    adjectives, and possessive pronouns can be attached to nouns as clitics. Nouns
    can be preceded by an optional definite article na (for see Noorduyn and Teeuw
    2006:53–59).


    The noun affixes are summarised in Table 13 and illustrated with examples from
    BM; several of these can be applied to both nouns and verbs and, as Noorduyn and
