    Why Bujangga Manik written? It is certainly more than a guide to the geography
    of Java, but it does seem probable that it had a didactic function. Its structure
    is seemingly rather ancient, the focus on place and placenames emerging from an
    indigenous literary motif adaptable to many different kinds of text, combining
    an attempt to know the world and what it holds with profound, Its depiction of
    ascetic practice and spiritual aspiration is simple but profound renunciation
    of it, conveying its messages not through explicit preaching but rather through
    the characters'' selective depiction of them.


    As it stands, although it is the second crack at the poem, my translation of Bujangga
    Manik can only be described as tentative and provisional. Many features of the
    text, and of Old Sundanese literature in general, are still mysterious, including
    some of the grammatical structures and vocabulary. Other questions surround the
    interpretation. Why, for instance, animals mentioned so infrequently? Why is sweeping
    the ascetic''s activity par excellence? Were there really jongs forty-six metres
    long? It is hoped that, as research on Old Sundanese—and on the history and archaeology
    of the Indo-Malaysian archipelago as a whole—continues to improve, we will be
    able to answer questions like more fully than I have been able here.'
