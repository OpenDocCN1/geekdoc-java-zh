  md: "elsewhere in Indonesia, as in—among others the Rejang Ka-Ga-Nga texts from\
    \ Sumatra, are remarkably similar to the mark at the beginning of the Kawali inscription\
    \ (Jaspan 1964:37). A blank $f1'$ is also standard in Sundanese manuscripts, both\
    \ *lotar* and *gebang*. It should be clear, then, that $f1'$ is the first page\
    \ of text in ms jb.b. (R).\n\nOne of the reasons the Bodlian version retains is\
    \ due to the numbers found outside the inscribed textual margins. These numbers\
    \ are not on their own a useful guide to the ordering of the pages, as they appear\
    \ to follow convention and begin on the *second* folio rather than the first and\
    \ appear on the *versos* rather than the rectos, but they do have some implications\
    \ for our understanding of the manuscript and, more particularly, of its lacune.\n\
    \n# 1.3.1 Marginal Numbers\n\nNumbers appearing in the leftmost margins of the\
    \ verses of nearly all the folios of ms jb.b. (R). A discussion of the Sundanese\
    \ numerals is found below, but in this section I intend to show what these marginal\
    \ numbers imply about the foliation of the manuscript. Importantly, these numbers\
    \ suggest that *two* are missing after folio 27—not one as previously believed.\
    \ The numerals do not appear in Noorduin and Teeuw (2006).\n\nThe most visible\
    \ of the marginal numbers are the European numbers presumably added to the manuscript\
    \ by a Bodlian curator assessing the foliation. Above or beside, however, are\
    \ in the Old Sundanese script. For the most part the ordering of the two sets\
    \ is in agreement. The exceptions are my $25v$ and $27v$: the pencils identified\
    \ the former as folio 26 and the latter as folio 24, while the Old Sundanese numerals\
