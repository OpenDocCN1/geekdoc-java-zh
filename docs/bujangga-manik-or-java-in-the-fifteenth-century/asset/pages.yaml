    # 2.3 Describing the Writing System in MS Jav. b.3. (R)


    # 2.3.1 General Characteristics


    An overview of the salient features of the script in MS Jav. b.3. (R) is worthwhile
    before examining the forms of the graphemes. Readers intending to grapple with
    the script themselves probably skip ahead to the tables of characters, referring
    back to these points if they encounter problems with the interpretation of text.


    The script is made up of 18 aksara nglegena (⟨ ka ga nga ca ja ta da na pa ba
    ma ya ra sa ha⟩); seven aksara swara (⟨a é i u⟩); seven aksara pasangan (⟨ca na
    ba ma ya⟩); four special forms (⟨re le ka⟩); ten aksara sandangan (⟨-e i u-h ng
    r⟩); and ten numerals ⟨1 2 3 4 5 6 7 8 9 0⟩. There are three punctuation marks
    ⟨-o/ //o⟩.


    The text is written scriptio continua in the sense that words within the metric
    line are not distinguished by spaces or punctuation. However, a short dash or
    dot is used to indicate the beginning and end of most of the metric lines.'
