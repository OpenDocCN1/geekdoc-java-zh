    # 2 Sunda


    The island of Java is home to two major languages with tens of millions of speakers
    (arguably three, if Malay/Indonesian is included), both of them in the Malayo-Polynesian
    malay of the Austronesian language family: Javanese, spoken in Central and East
    Java, and Sundanese, spoken in the west. Javanese has many more speakers and a
    considerably older and larger written record, with inscriptions going back to
    the eighth century; written Sundanese is evidenced only from the fourteenth century
    on. Because Javanese has a much more extensive literature, and because it was
    collected along with other Javanese-language palm leaf manuscripts in the 1620s,
    the *Bujangga Manik* manuscript was initially believed to have been Javanese as
    well (Noorduyn 1985). The ''Jav'' shelfmark reflects this.


    Sundanese is one of the most-spoken languages of the Austronesian language, with
    over 67 million speakers in 2010, according to the Indonesian Pusat Statistik.
    It is closely related to Malay and more distantly to Javanese, but both the modern
    language and the Old Sundanese represented in *Bujangga Manik* contain a host
    of loanwords from different stages of Javanese. The majority of Sundanese speakers
    live in West Java, now the most populous in the Republic of Indonesia, also in
    Banten Province to the west, which has a significant Javanese-speaking minority.
    At the time *Bujangga Manik* was composed Sundanese was also spoken on the coast
    in Jakarta (and to now the capital of Indonesia and then a busy port known as
    Kalapa (and to the Portuguese as *Calapa*). The toponym of western Central Java
