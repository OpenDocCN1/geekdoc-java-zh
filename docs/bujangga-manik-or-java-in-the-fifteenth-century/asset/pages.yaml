    97


    Indonesia and Malaysia have in the past grouped in a proposed Western Malay-Polynesian
    (WMP) family (as Bellwood 1997:96–127), but the only characteristic appearing
    to unite this grouping was the use of a nasal prefix to form agent-focus or active
    verbs (e.g. Sundanese *tanya > nanya*). WMP has been broken up, with some support
    given to a smaller called ''Western Indonesian'' (w1) alongside of other separate
    branches (A.D. Smith 2017a, 2017b). The situation is clearer at a lower level.
    Sundanese is now proposed by most linguists within the Greater Borneo (GNB) family
    proposed by Robert Rust (2010) and expanded upon by Alexander Smith (2017a). Sundanese
    is thus significantly more related to the Malay languages, Cham, and the languages
    of northern Borneo to Japanese, the language with which Sundanese has long shared
    the island of Java. Under an earlier proposal by Alexander Adelar (2005), the
    language had been placed in a branch called ''Malay-Sumbawan'', although Adelar
    has now put his support behind GNB instead (2019). In Smith’s proposal Sundanese
    is a GNB language among Malay, while Javanese occupies its own branch within Western
    Indonesian. (Under Adelar’s Malay-Sumbawan family Sundanese was also grouped with
    Malay and not Javanese.)


    The evidence for the Greater Borneo proposal is principally lexical, for philological
    purposes this is important as it means from Malay, certainly the best-known and
    best-studied of all the GNB languages, is likely to be helpful in reconstructing
    the meanings of hapaxes and problematic terms. Characteristic of GNB languages
    is the replacement of Pan *pitu* to *seven tujuh*, a feature of both Malay and
    Sundanese but not Javanese (as in *Ojv pitu*) and also even in Old Sundanese (e.g.
    BM 97). A result of BM with Malay/Indonesian will recognise many words in the
    text, including *di-*‘in’, at’, *datang*‘come’, and *panjang*‘long’, among others.
    Malay and Sundanese are similar in other ways—forming patient-focus/passive verbs
    with the pre-*di*, for instance, using unmodified adjectives as stative verbs.
    Javanese has, however, a significant influence on the development of Sundanese
    at several points in its history, and a large number of Oj loanwords are evident
    in *Bujangga Manik*.


    The term ‘Old Sundanese (Osd)’ is applied to a stage of the language represented
    by a written literature spanning the period c.1300–c.1700, roughly between the
    inscribing of the Batulis stone and the introduction of new forms of modern-Javanese-influenced
    literatures in *pégon* and Javanese script in the eighteenth century, after which
    Old Sundanese appears to fall out of use. There are some differences between Old
    and modern Sundanese, including the aforementioned acquisition of the vowel /s/
    or (eu), but some formulae in poetry recorded in modern times have almost exact
    parallels'
