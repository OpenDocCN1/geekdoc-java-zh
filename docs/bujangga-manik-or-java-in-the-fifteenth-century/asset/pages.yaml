  md: '# Acknowledgements


    This book is based on my doctoral dissertation, which I completed in September,
    several months into the COVID-19 pandemic. The doctorate formally began in June
    2018, but in truth I had started writing in April of that year and had already
    worked on Bujanjga Manik for my master''s degree in 2017. I worked quickly and
    in relative isolation. My doctorate was not funded, and the university attended
    little to assist me, so I do not feel indebted to any institutions. I taught English
    as a foreign language in order to make ends meet and was really able to attend
    conferences or meet other scholars. Any errors in this book are my own.


    My thanks chiefly to my parents, who have always encouraged me peculiar interests,
    and to my wife, Varvara, without whose support it is unlikely that this book would
    exist. My two supervisors, Bernard Arps and Aone van Engelenhoven, are both lovely
    and excellent scholars, but I am thankful to them, in particular, for letting
    me get with the work on my own terms than for specific interventions in the text
    (although there were a few of them). Wayan Jarrah Sastawan, Aditia Gunawan, Panji
    Topan Bahagia, and Ilham Nurwansah provided useful comments at different stages
    of the project. Jarrah saved me from putting an embarrassingly incorrect statement
    about Majahitahit politics in aspects of the Old Sundanese text and the translation.
    Some other minor scholarly assistance came from comments on my old blogposts and
    replies to tweets, and I also received financial help from acquaintances on Twitter
    (it was then). As I am no longer on Twitter/X, I do not have a list of these contributors,
    but they will probably know who they are.


    I should also thank the committee at the Stichting Praemium Erasmusium Dissertation
    Prize in 2022. I had never made any money from scholarship before. The prize money
    paid for my move to Lisbon in the same year.


    Finally, I am grateful to the staff at Brill for putting up with my intransigence
    and grumpiness. Special thanks to the series editor, Dick van der Meij, who put
    the index together and provided comments in lieu of peer review, Bujangga Manik
    being a subject for a conventional review process, and to Bart Nijen, for his
    patience and professionalism.'
