    # 1.4.1 Opium


    *Candu* ''opium'' probably comes from Tamil *cantu* (கண்டு), originally ‘chaff’
    or ‘empty husk’ and later opium for smoking (Winslow 1862:15). The word could
    alternatively refer to another kind of aromatic preparation (cf. Malay-*câmun*—Burrow
    and Emenue 1984:2248), but ‘opium’ appears to be the primary meaning of the term
    in the archipelago (Ojv, Mjv, Malay *candu*) Noordyn and Teeuw (2006) treat it
    as such.


    The poppy (*Papaver somniferum*) originated in western Eurasia, and across Afro-Eurasia
    it was used for medical (and recreational) purposes in the Middle Ages. The medieval
    trade for opium in the Indian Ocean is known in large part through the accounts
    of the Portuguese, which the drug is known as some variant of afiao, from a Arabic
    *‘afyun* (أفيون)—from Greek στπει. It is likely opium came to Java from further
    west, perhaps from Egypt, where poppies were reported to grow in profusion and
    was exported in huge volumes (Nasallah 2012:74). The thirteenth-century doctor
    ‘Abd-al-Latif al-Baghdadi says that opium is a ‘crop in which Egypt specialises—which
    he goes on to say that the harvesters often alter it, sometimes with human excrement’
    (al-Baghdadi 2021).A76 This is Egyptian opium to which Chaucer referred in *The
    Knight’s Tale* (‘fine Theban opium’)A77 (Emerson 1919:5), and the connection is
    further made explicit by Pires, who also uses the name ‘Theban opium’ (*opio teibaqo*)
    when describing northern Egypt (Cortés 1944:39; Pires 2018:58). This is the only
    commodity in BM most likely origin is African.


    # 1.4.2 Sandal


    At least two kinds of Asian timber are known as ‘sandalwood’, including a variety
    that comes from an Indian tree called *Pterocarpus santalinus*. This was used
    throughout as perfume and food colouring, throughout medieval Afro-Eurasia and
    in Ojv it was known as ‘African sandalwood’ (*candana jēngi*) (OJED 740:4.1; Donkin
    2003:110). The unmodified word *candana*, however, usually referred to white sandalwood
    (*Santalum album*)—a more valuable product. The name is from the Sanskrit *candana*,
    which has the same meaning and form in Ojv and OSd (Malay: *cendana*) and probably
    came from a Dravian'
