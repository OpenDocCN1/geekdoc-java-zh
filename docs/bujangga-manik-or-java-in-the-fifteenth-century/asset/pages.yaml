    # Palaeography


    In this section I will examine the script and writing system of Oxford, Bodleian
    Library, ms Jav. b.3. (R). The script—a Brahmic one, related to the great majority
    of writing systems in pre-colonial Indo-Malaysia—is a particularly old and uninked
    example of what is now conventionally ‘Old Sundanese script’ (Malay/Sd aksara
    Sunda kuno/kuno), the prominent study of which was based on later Darsa (1997).
    As such, the lontar script found in ms Jav. b.3. (R) requires a more detailed
    discussion than its identification as ‘Old Sundanese script’ might suggest.


