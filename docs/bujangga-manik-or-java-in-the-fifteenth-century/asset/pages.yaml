    Java''s urban profile has been transformed as well. Some towns that were major
    centres have shrunk to become villages, like Bujangga Manik''s destin-ation of
    Balungbangan (modern Blambangan, now a small satellite of Bany-uwangi). Domestic
    architecture has also changed: Most houses in medieval Java were thatched—notwithstanding
    the survival of some terracotta tiles from what must have been higher-profile
    residences—and had walls of wood, cloth, and woven palms. Little survives archaeologically
    of such houses, although references in the extant literature suggest stone-walled
    houses were rare if at all (e.g. Desāvarṇa 26.2 and 32.6; Miksis 2013:12). Low-density
    sprawl probably generalised island Southeast Asia''s major cities at this time,
    with houses being separated from one another by gardens and orch-ards instead
    of being densely packed together behind city walls (in which of temperate Afro-Eurasia
    (Crib 2000:6)).


    BM domestic sections suggest that a Sundanese noble''s house (imah bumi) was built
    on piles (or ''stilts''), a structure once could (unggah) a ladder to enter. This
    is common with most traditional dwellings in the archipelago Sumatra to New Guinea
    and into the Pacific, a tradition that probably began in Neolithic southern China
    and has been largely abandon-ed in Java under modern Chinese and European influence
    (Pires 2013:23; Kirch 1997:47; 15–16). Houses built on low piles can still be
    seen at Kampung Naga near Taskikalaya, though and the Kanékés/Baduy build their
    houses on piles as well (Hasman and Reiss 2012:16–19). Reliefs from Borobudur
    suggest pile-houses were also common in the Central Javanese period (Figure 28).


    Tomé Pires suggests the palace of the king of Sunda:


    The city has well-built houses of palm leaf and wood. They say that the king''s
    house has three hundred and thirty wooden piles as thick as a wine cask, and five
    fathoms high, and beautiful timber on top of the pillars. (Cortão 1944:68; Pires
    2018:91)


    Writing three centuries earlier, Zhào Rùkòu (c. 1225) says that the people of
    Xīntú (Sunda) all build their houses using wooden piles, roof-ed with palm bark,
    with flooring of wooden planks and screens made from strips of cane.¹² The ''wooden
    poles'' (木遲) are probably on piles on which the house was built. Piles have a
    number of advantages, to raise the house above water in case of flooding, allowing
    for a free flow of air, and protect the inhabitants from enemies and vermin (see
    Waterson 1997). Other build-ings not intended for human habitation are also built
    on stilts, including the traditional Sundanese leuit (''rice barn'') (Hasman and
    Reiss 2012:15).'
