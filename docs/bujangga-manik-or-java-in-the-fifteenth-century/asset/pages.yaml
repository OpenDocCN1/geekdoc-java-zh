  md: '# Listing Places


    Sunda was an ‘Indianised’¹ kingdom. The religion practised by the elite was some
    variety of Hinduism, and references to the Hindu pantheon can be found in many
    Osd texts (Buddhist texts are notably absent; the Hindu-Buddhist synthesis appears
    not to have been present.) BM implies that a Śāist mantra (OSd name śivāya, from
    Skt nam Shivāya) was used as a greeting, at least on occasions (BM 447); the Old
    Sundanese script(s) is/are derived from an Indian source; stories of Rāma and
    Rāvaṇa appear in Osd and an Ojv translation of Sanskrit text in yoga is one of
    the better-known surviving texts to have been copied in Sunda (Acri 2001). The
    phenomenon of carving the foot- and handprints of kings and gods into rocks, common
    in Sunda (and much so in Java), has its origins in an early Indian practice (Bischop
    2004:20). Even the name ‘Bujangga Manik’ comprises two Sanskrit loans.


    Bujangga Manik is written, however, in Old Sundanese, a language in the Malay-Polynesian
    language family, and not in Sanskrit or other Indic language. Direct contacts
    between India and Sunda were probably limited, after the Tarumanagara period—bearing
    in mind particular Zhao Rūko’s description of Sunda as a place frequently visited
    by foreign merchants—and although demographic data are difficult to come by, most
    of the people who lived in Sunda were probably native Sundanese. It is unlikely
    that many of them were literate in Sanskrit, and the Sanskrit loans in BM and
    other Osd texts appear to have been loaned directly via Ojv [BM 1961–1965], but
    Sanskrit itself is not mentioned.) It would not be right to characterise Sunda
    in this period as an extension of India or to treat its culture and literature
    as having inevitably derived from Indian models, whether classical or ‘medieval’
    (in the sense commonly employed in Indian historiography).


    BM’s focus on and listing of mundane placenames in particular has no clear parallels
    in Indian literary tradition, unlike the narrative structures of other texts written
    or copied in Sunda at the time. Journeys and quests of course


    +   1 Coeds (1948) in fact used the term ‘Hindised’ (hindousés) to refer to the
    Southeast Asian civilizations influenced by India and Sanskrit culture, and this
    is probably a more accurate position to take on Indian influence in the region.
    Also see Trautmann (2015:ch7).'
