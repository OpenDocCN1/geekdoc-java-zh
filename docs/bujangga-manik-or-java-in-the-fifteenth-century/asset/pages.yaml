    perfect for the cultivation of lontar palms, and even after paper had long-sponed
    lontar products—made from twined leaves, for example—were still being exported
    from the island to population centres further west (Fox 1977:223–227). It is possible
    (hopelessly unverifiable) Madura was the source of the leaves used in the Bujangga
    manuscript. Lontar can certainly be seen further west; on a train journey from
    Jakarta to Yogyakarta in 2018 I noticed lontars appearing on the landscape shortly
    after leaving Purwokerto in Central


    Ms Jav. b.3. (R) is in most respects of a Javan lontar manuscript. The leaves
    are roughly 35 centimetres long but rather narrow—around three centimetres wide—meaning
    the letters (aksaras) themselves are between three and fiveimetimet in height.
    The leaves do not taper; each leaf is approximately the same width throughout
    its length, and deviation from the end of the page is reached when the leaf is
    due to damage rather than intent. When the end of the page is turned over from
    top-to-bottom—that is to say, along the y axis rather than the x axis (Figure
    7).


    On all one of the leaves and as normal with this type of lontar manuscript, four
    straight lines have been inscribed longitudinally on both sides of the leaves
    approximately sevenimetres apart. The central holes in the leaves are marked off
    by fine lines drawn sevenimetres to the right and left of the hole (Figure 8),
    and the holes on the far left and right of the leaves are outside the inscribed
    margins. These line markings are on some folios—including the first page of text,
    f.1''—but nonetheless serve to order all of the text except for an aberrant line
    in a different hand than the rest of text on f.17'' (see Chapter 1, Section 2.7).
    In common with other Southeast Asian palm-leaf manuscripts, the aksaras are placed
    below these lines, not on or above them, meaning that when graphemes are stacked
    on top of one another, as occasionally happens, the stacks protrude from the marked
    lines. The script is read from left to right.'
