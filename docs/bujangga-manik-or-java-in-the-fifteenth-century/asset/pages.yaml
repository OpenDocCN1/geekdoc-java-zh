  md: 'Finally, a number of common verbs are invariant in Bujangga Manik form phrases
    with prepositions. These phrases are used in the formulae which make up much of
    the poem. Cubuk ‘arrive’, datang ‘come’, nepi ‘approach’, ngahusir ‘proceed’,
    and ngalarar all the preposition ka (lit. ‘to’); me(n)tas ‘cross’ and deuk ‘sit’
    take di (lit. ‘in, at, on’); and diri ‘leave’ takes ti (lit. ‘from’). These prepositions
    and their complements follow the subject (if present), as in ngalar pada Larangan
    ‘I passed through Larangan (BM 786). The poem’s focus on places and travel between
    them means that many of the formulaeic lines found in BM are of this type.


    # 3-7 Metre and Poetics


    Throughout this work I have referred to Bujangga Manik as a poem. It has no rhyme,
    however, nor a consistent pattern of alliteration. There are few parallelism.
    It is poetry or verse in that it artificially constrained by rules that mark it
    as different from ‘normal’ non-comic language (a definition in M.L. West 2007:26;
    cf. the poetry survives in Fox 2005)—but even that is somewhat questionable. The
    poem’s only metrical requirement is that every line be a largely independent unit
    of language (a sentence or phrase) comprising eight syllables.It is difficult
    to draw an absolute distinction between poetry and prose in Old literature; much
    of the Sangyang Sukandang Karesian, a text commonly described as ‘prose’, in opposition
    to the ‘poetry’ of BM et al., is arranged in octyllabic lines separated by interpuncts,
    and could be considered ‘poetic’ (although ‘violations’ of kidungs de Gonda principle,
    if that is what they are, are considerably more common in SKK and other ‘prose’
    works). It is unlikely that the people of fifteenth-century Sunda would speak
    to one another using strict eight-syllable lines, however, and in that sense the
    poetry of BM is likely to have distinct from ordinary speech. The colloquial is
    that ‘prose’ and ‘poetry’ are somewhat categorical when applied to OSd.


    Was Bujangga Manik composed orally? Certainly it shows every sign of having been
    recited or intoned, and its octyllabic structure, is mentioned in the introduction,
    similar to that of modern carita pantun, which are indeed orally transmitted (cf.
    Lord 1987). BM survives in written form, however, and it draws on a tradition
    of telling stories infused with place and names that must have oral antecedents
    (see Chapter 3), similar things could have been of most written literature. BM
    appears to have been composed the composition and/or set at a point in history
