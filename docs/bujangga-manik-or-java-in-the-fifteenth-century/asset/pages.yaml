    ![](img/554283bc3d9f2f96cd0b936b4413c21f_129_0.png)


    The transliteration of early Indo-Malaysian texts has become a controversial subject
    in the last few years, and some remarks on the subject are required here. The
    reason for the controversy is more to do with disciplinary boundaries than with
    difficulties in the interpretation of the scripts used in the texts or the phonologies
    of the languages themselves. As can be seen above, Old Sundanese had a small phoneme
    inventory, and the functions of its script(s) are reasonably clear and consistent.
    Os phonology also seems to be close to that of MSD, and it would not be inappropriate
    to use modern orthography as a basis for the transliteration of the Old language—although
    in my view Noorduin (2006) took this too far, interpolating a seventh vowel, <eu>,
    unwarranted by the orthography of Os as it appears in the surviving texts. I see
    no particular reason to follow Indological standards and transliterate according
    to the International Alphabet of Sanskrit Transliteration (IAST) or something
    akin to, as Acre and Griffiths (2014) argue. It would only serve to complicate
    matters, and in case Os orthography differs from typical Brahmic scripts in the
    representation of certain features, notably in the spellings of words like *siya*
    and *hyang* in which only one aksara *ngalena* is represented by two syllables
    (as explained in Chapter 1, Section 2). Some aksaras have different pronunciations
    in Osd and Ojv, particularly aksara <ta> which—as described above—was adopted
    in Osd for writing the consonant cluster [tr] (e.g. *sutra* ‘silk’—IAST). These
    features are more obscured than we rigid adherence to Indological expectations.


    An interesting proposal has recently been put forward by Wayan Jajah Sastrawan
    where whereby Sanskrit (and other Indic) loanwords in Ojv and Osd would be transliterated
    using IAST and native words would be given in a system closer to that of the Old
    Javanese standard (as found in OJED)—so, for instance, <v> should be used in *swasti*
