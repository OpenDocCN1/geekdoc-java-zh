    By the fifteenth century Chinese communities had grown to considerable size across
    western Indo-Malaysia and Chinese people often held important posts in the region''s
    port-cities. When Zheng Hé arrived in Palembang (港港‘old port’ in 1407 he found
    that had been the capital city of a Malay kingdom, Shrivijaya, had been turned
    into a pirate republic run by a Chinese man, Chen Zuyi (陳祖義), who had taken over
    the city''s previous ruler, Liang Daoming (梁道明), had left for China. Chen had
    grown to China and executed (Wolters 1970:73–75). The size of the Chinese population
    meant that post-Chen Palembang could not be considered a wholly foreign country
    by the Ming; it instead became a ‘Pacification Superintendency’ pinyin: xuānwèi,
    equivalent to a state on China''s borders (Wade 2016:22). In BM, the only reference
    to Chinese people, as opposed to goods, is in BM 927—juru orang china ‘the master
    archers''


    Chinese archery traditions seem to have been conservative in the Middle Ages.
    There were reportedly fourteen schools of archery in the early sixteenth century


    In Wang''s method (described in Selby 2002) the bowstroke was drawn with the thumb;
    for infantry shooting, as on ship, Wang recommended the ‘Chinese method’ (中國法—as
    opposed to the ‘nomad/barbarian method’ 胡書法), where the middle finger secures
    the thumb with the index finger straight along the string. The thumb was normally
    protected by a thumb-ring, and in the Ming there was fashion for ornamental thumb-rings
    with raised ridges around the middle (see Selby 2000xxvii for images), although
    most Ma Huan (76) says the beak of the crane’s crest bird (葛頂—Buceros bicornis,
