    Ajyana (SA 377–380) suggest that in the earthly realm was was, and that an easily
    traversed landscape was literally heavenly.


    Java’s landscape is characterised by innumerable volcanes both large and small,
    and it is sometimes called the most volcanically active island in the world (Whitten,
    Soeriamadja, and Affiff 19963). The north coast of Jakarta and Semarang is a plain,
    as flat and featureless as Holland, most of its dense-peaked stratovolcanoes,
    can be seen to the south. This plain has expanded over the centuries as the short
    rivers flowing into the Java Sea have silted up, but the northern coastal plain
    (pataran) is mentioned in BM. Heading from this plain leads into the mountains,
    although further there are more fertile plains and valleys (Cribb 20003). The
    fact that foreign visitors tended to approach Java from the north, with densely
    forested mountains in the distance and a large inland population evidenced by
    Java’s wealth and demand for foreign goods, gave rise to a belief among many in
    the medieval world that Java was the largest island in the world (Polo: le greingnor
    isle / ge soit au made—Paris, BnF, Français 116, f.74a), a belief was not popular
    in Europe until the middle of the sixteenth century (Figure 27).


    The soil in West Java is often rust-red and leached of nutrients—a function of
    the high rainfall and year-round heat the region receives (Kriecher 1989:73; Suttle
    1978:15–16 for explanations of the process). Dry rice, grown on unaltered hills,
    is still a popular crop in Sunda just as it must have been in earlier times, in
    part because the region’s oligotrophic laterite/latisols will not support rice
    fields. As one travels from east, the dry season grows longer and the problem
    of leaching is dramatically lessened, resulting in richer soils conducive to irrigated
    wet-rice agriculture and dry-seeking plants like lontar palms—whose leaves were
