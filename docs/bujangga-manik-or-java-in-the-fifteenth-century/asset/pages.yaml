    # 3.2 Origins


    Sundanese is a member of the Austronesian (An) language family, one of the world''s
    primary language families. Austronesian properly originated on the island of Taiwan
    in the mid-Holocene, with a branch of it, now known as Malay-Polynesian (MP),
    expanding into island Southeast Asia and the Pacific C.420 BP (as suggested by
    the archaeological evidence—Bellwood 2013:193–194). Every Austronesian language
    historically spoke out of Taiwan as Malay-Polynesian, including Sundanese, Malay,
    and Javanese as well as Hawaiian, Malagasy, and many others (for overviews of
    the family see Adelaar and Himmelmann 2005; Blust 2013; Kikususa 2015).


