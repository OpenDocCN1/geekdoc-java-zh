  md: '# PLACE IN BUJANGGA MANIK (Guo 2001:77–78); in West Timor (McWilliam


    Malaita, in the Solomon Islands (Guo 2001:77–78); in West Timor (McWilliam 2002);
    in Rejang surat rulu texts (Jaspan 1964:5); and elsewhere in South Sumatra (Sakai
    1997). Fox expanded the concept of the ''topogeny'' to encompass any recitation
    of named places, and it is unclear what the defining features of toponyms are
    aside from an emphasis on place and toponyms.


    My view on ''topogenies'', as described in my MA thesis (2017), is that toponym
    lists in Malay-Polynesian literatures are related to one another, and that their
    similarities do not reduce to mere family resemblance, but that they do not form
    a literary genre—that texts (oral or written) in the Malay-Polynesian world employing
    the device of listed places are not one kind of. Such lists constitute a trope
    rather than a genre: a device to tell stories and recount events, something an
    audience can expect to encounter and help orient themselves in the text and its
    world.The compositions that make use of toponym-listing trope may be incantations,
    as in Sulawesi (Waterson 2012:45); they may be intended to give geographical information,
    as with the lists used to teach native location in the Clifford ( 1997:205–207;
    Riesenberg 1972:22); they may be historical narratives, with a pair of texts from
    Sikka in east-central Flores analysed by E.D. Lewis (1999); they might be modern
    Minang pop songs (Barendreg 2002); or they may be Hindu narrative poems, as with
    BM. Lists of named placenames are also encountered in medieval Javanese texts;
    the Desawangarna contains lists of places in Java linked by travel between them
    (e.g. 19–25) as well as lists of places outside Java that described as Javanese
    vassals (13–15). This is in addition to the Hawaiian, Rejang, and Timor mentioned
    above which fit with Fox''s original vision of the ''topogeny''. These are all
    discussed in more detail in A.J. West (2017).


    The expressions used in using lists and narrating journeys from different Malay-Polynesian
    communities are often strikingly similar. For instance, compare to BM''s verbs-of-motion
    formulae with the oral traditions recorded by Guo Peiyi on Malaita in the Solomon
    Islands, the original language of which is Langandala, a distant relative of Sundanese
    in the South-East Oceanic branch of MP:


    ... they came out from Feralata and came down to a place called Ore. Keldai came
    out from Feralata to Ore. Keldai came to a place called Mauro. After he left Maru
    then he came to a place called Fakaria — (Guo 2001:78).


    Such tropes can be used in narratives of many kinds over long periods of time—see
    e.g. the Indo-European literary motifs in Watkins (2001) and West (2007).'
