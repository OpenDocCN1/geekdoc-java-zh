    the course of a week. After this process is complete, holes are cut into three
    points along the leaves’ spines and are carefully planned along their entire length
    to make them flexible. The line markings are then added. In Bali this is done
    with a *manyipatan*, from two bamboo sticks joined by threads of equal length
    (Rubinstein199637). In nearly all cases lines are marked onto each leaf, as we
    find in MS b.3. (R); these lines also mark the margins of the pages, which normally
    contain page numbers (on the left side of the page—see Rubinstein199639) and the
    two holes on either side. Manuscripts, both finished and unscribed ones, are often
    stored above the hearth, where smoke serves to gently preserve the leaf and repel
    insects. Lontar manuscripts are usually inscribed with a knife. In Sundanese the
    knife is named *pésso pangot*, and simply *pangot* (péso meaning ‘knife’), an
    implement mentioned in SSK as one of the *ganggam sang panda* ‘weapons of the
    sage’.


    Lontar manuscripts may appear humble compared to contemporary European and Islamic
    manuscripts—MS jav b.3. (R) is no *Très Heures*. The making of a *lontar* manuscript
    has notheless recognised for some decades as a precision craft. The line markings,
    by Willem van der Molen (1983:9–93), are consistently drawn and frequently accurate
    within a millimetre, and the use of such consistent measurements across multiple
    manuscripts can be used to identify the output of a single scriptorium. The holes
    in Balinese *lontar* manuscripts are placed slightly off-centre so that the manuscript
    is picked up by its cord it will ‘lean’ to the right; otherwise it has been picked
    upside-down (Rubinstein1996333); this is also the case with MS jav b.3. (R), where
    the ‘central’ hole is siximetres off-centre.


    # 1.3 Foliation


    The foliation of MS jav b.3. (R) is a little messy, and while I have managed to
    arrive at an ordering of the material that seems to be me the ‘original’ order
    of the text, there are nonetheless some peculiar points requiring explanation.


    The published transliteration in Noorduin and Teeuw (2006) is correct with regard
    to the reading order of the material but incorrectly supposes that the first side
    of text is on folio 1 *recto*, as usual with Javan palm-leaf manuscripts, f1 is
    blank. The text begins on f1. This perturbs the foliation such that the text is
    ascribed to the wrong leaf in the 2006 text. Moreover, it seems that more folios
    are missing than are accounted for in the published version. The Bodleian digitisation
    of the material⁵ was also peculiarly ordered,


