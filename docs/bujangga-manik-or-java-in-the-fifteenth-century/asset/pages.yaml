  md: '# 114 CHAPTER 2


    Sanskrit pronunciation must have been present even in late-medieval Java, happens
    to the extent that Skt derivation was pronounced differently by many Ojv native
    speakers, for OSd—and for BM specifically—this approach seems unnecessary. While
    some OSd manuscripts contain special characters—aspirated and retroflex loans
    are not otherwise found in OSd phonology or orthography—this is not true of Buyangga
    Manik, which is written entirely according to OSd standards. There are no retroflexes,
    aspirates, or long vowels. I am loath to duplicating elements into what ought
    to be a simple situation, and it seems superfluous to include variant readings
    of the same characters based on etymology.


    Transliteration should be a pragmatic affair intended to open texts up to their
    readers rather than acruste bed imposed on disparate languages, and I expect there
    are readers who would like to read the original text for pleasure and not simply
    as an academic exercise. The system I use is an attempt to balance readability
    and fidelity to the text. Tables 11 and 12 above provide the equivalences between
    the phonemes and the letters used in the transliteration, and tables and descriptions
    of the letters (aksaras) of the script can be consulted in Chapter 1.2. These
    should give an idea of how the text is to be read and the correspondences between
    my transliteration and the lines inscribed into MS Java. b.3. (R) Below I have
    summarised principles between BM and its English translation:


    +   - Disagreements between my transliteration and that of Noorduin (2006) are
    in the footnotes. I have used N to refer to the 2006 text as a whole (e.g. ''N:
    mahapandita'').¹ Only disagreements that constitute divergent readings are noted;
    other differences from N and from MS orthography that result from the application
    of different principles are not noted (e.g. esi instead of Nusi);

    - Velar nasals are denoted by <ng>. This is used for both the aksara <nga> and
    the paryeck, the distinction between the two marked by their position in the syllable.
    Where occur in the script, they frequently do in intervocalic positions, I have
    used one <ng>; it is extremely unlikely that these were pronounced as geminate
    in spoken OS.

    - Palatal nasals are denoted by <ñ> in all cases. This is not in MS spelling,
    which uses the digraph <ny> before vowels and <n> in consonant clusters.


    ¹ The text was in fact a collaborative effort between Noorduin, Teeuw, Undang
    Darsa, Stuart Robson, Wim van van Zanten, and others, but Noorduin''s readings
    were used as the basis of the published text. I do not want to imply by use of
    his initial that he was the only contributor.'
