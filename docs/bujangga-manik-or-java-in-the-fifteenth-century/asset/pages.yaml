  md: '# INTRODUCTION


    island the east called Šabat (шабат)—etymologically ‘Java’ but more likely to
    have been Sumatra—where elephants were sold by the cubit and ‘everything is cheap’
    (‘все дешево’). As a fifteenth-century English version of the Travels of John
    Mandeville put, in Java grew ‘all manner of spices more plentiful than elsewhere,
    like ginger and all other spices. Everything is there plenty in wine.’¹ These
    reports were garbled attempts at truth: The situation of the archipelago at a
    pivotal point on the seaways between the South China Sea and the Indian Ocean
    meant that it was constantly visited by people and traversed by ships and goods
    from across Africa-Eurasia, the regular cycling of the monsoon winds lending a
    predictability to ocean travel to and from the islands while ineradicable piracy
    undoubtedly unavoidable risk; and the region really possessed an abundance of
    valuable commodities, including benzo, camphor, cloves, coves, nutmeg, and white
    sandalwood, consumed hemispherewide in a bewildering array of recipes and prescriptions.


    In 1292–93 Java was assaulted by a force set by the Yuan (Mongol) Emperor of China,
    Kublai Khan. The invasion was repelled but it led to the founding of a new form
    of the Javanese state and a capital at Majapahit in what is now the Indonesian
    province of East Java. Under its fourteenth-century king, Hayam Wuruk, and his
    prime minister, Gajah Mada, the Hindu-Buddhist kingdom aggressively expanded its
    borders as the preceding Javanese polity, Singhasari, attempted to do decades
    earlier. By 1365, the Javanese writer Mpurapaha kakawin Deaswartarna (‘Depiction
    of the Districts’), as the kakawin Nāgākertāgama, a work that survives in manuscripts
    of considerably later date, and as far north as North Sumatra and the Malay Peninsula,
    its extraordinary produce—although in truth these claims of suzerainty far outside
    Java are hard to verify, as little in the way of documentary evidence has survived
    from Java itself when compared to the more complete historical record of contemporaneous
    societies in temperate climates, and no local texts whatsoever are known from
    Indonesia east of Sumbawa from before 1521.¹ Works daily life and the social texture
    of the archipelago before the arrival of the Portuguese are also rather lacking:
    Local values and concerns are known to us through obtuse medieval inscriptions,
    a handful of fourteenth- and fifteenth-century manuscripts, and (usually Balinese)
    copies of texts dating to the colonial period, most within a fairly restricted
    range of surviving genres. We do not know about the impact of Black Death on Java
    or the rest of the archipelago, or even whether'
