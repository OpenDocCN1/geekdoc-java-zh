  \ | c. |\n| 7. | a. |\n| 8. | b. |\n| 9. | c. |\n| 10. | c. |\n\n# 第 8 章：使用 Jakarta\
  \ EE 的企业级 Java\n\n## 引言\n\n在上一章于不特定 Java 的文中探索了领域驱动设计（DDD）之后，现在是时候看看这些如何在全功能平台中变为现实了。本章介绍了\
  \ `Jakarta EE`，这是一个强大的企业级平台，可以简化并优化 DDD 的实现，使其对开发者来说更加高效。你会发现与 DDD 相关的复杂性（如管理依赖、封装逻辑和处理持久化）在平台内部得到了更直观的解决。\n\
  \n当我们学习使用 Jakarta EE 应用 DDD 时，你会发现该平台的内置功能如何减少模板代码、通过 `Jakarta Data` 提供更好的封装，并支持\
  \ DDD 无缝集成到企业级应用中。在本章结束时，你将对 `Jakarta EE` 如何增强你的 DDD 实践有实用的理解，帮助你构建结构良好、易于维护且符合业务领域核心概念的应用。\n\
  \n## 结构\n\n在本章中，我们将探索以下主题：\n\n- 使用 `Jakarta EE` 应用 DDD\n- 利用 `Jakarta Data` 实现更好的封装\n\
  - 将 DDD 集成到企业级 Java 应用中\n\n## 技术要求\n\n本章将使用 `Helidon` 探索上下文依赖注入（CDI）方法，这也可以同样地应用于\
  \ `Quarkus`。在本章中，我们将使用 Docker 运行 Oracle NoSQL 数据库。因此，运行一个数据库至关重要；在包括 Oracle Cloud\
  \ 在内的多个环境中运行 Oracle NoSQL 数据库都是可能的，但对于本章，假设实例将在本地执行。\n\n- Java 21\n- Git\n- Maven\n\
  - 任何偏好的 IDE\n- Docker 正在运行\n- 使用以下 Docker 命令运行 Oracle NoSQL 数据库：\n\n```bash\ndocker\
  \ run -d --name oracle-instance -p 8080:8080 ghcr.io/oracle/nosql:latest-ce\n```\n\
  \n\n\n本章旨在演示 Jakarta EE 如何通过提供标准化的企业级功能来简化数据访问、依赖管理和领域封装，促进 DDD（领域驱动设计）的实现。通过实际示例，我们将探索\
  \ Jakarta EE 的关键规范，如 `Jakarta Data`、`CDI`、`Bean Validation`、`Jakarta NoSQL` 以及 `Jakarta\
  \ API for RESTful Web Services (JAX-RS)`，展示如何构建清晰且可维护的 DDD 架构。在本章结束时，你将清晰地理解如何应用\
  \ Jakarta EE 构建以领域为中心的应用，减少样板代码并利用强大的企业级 Java 生态系统。\n\n## 使用 Jakarta EE 应用 DDD\n\
  \nJakarta EE 以前被称为 Java EE，它提供了一个广泛应用于 Spring、Quarkus 和 Helidon 等框架的标准化 API。这种标准化允许开发者访问一致的工具，从而降低企业级开发的复杂性。现在\
  \ Jakarta EE 由 Eclipse 基金会管理，并受益于与 MicroProfile 规范的集成，该规范扩展了 Jakarta EE 的能力以支持微服务架构。Jakarta\
  \ EE 与 MicroProfile 之间这种紧密的关系建立在 `CDI`、`JSON` 和 `JAX-RS` 等核心组件之上，使 Jakarta EE 成为\
  \ Java 项目实现 DDD 的稳健基础。\n\n`CDI` 是 Jakarta EE 中 DDD 的核心，它是一个促进对象创建和生命周期管理的规范。`CDI`\
  \ 帮助管理应用程序内部的依赖，使得构建组织良好的领域层变得更容易。`CDI` 取代服务定位（service locators）和工厂等传统方法，允许你构建高测试性、可用且可维护的应用。这种能力在\
  \ DDD 中至关重要，因为领域对象通常跨跨多个请求。例如，`CDI` 的生产者方法（producer methods）实现了实体创建和资源的集中管理，确保了领域的一致性。作用域注解（Scoped\
  \ annotations）为领域对象提供了额外的生命周期管理，而拦截器（interceptors）则允许你处理错误处理等交叉关注点，而不会污染领域逻辑。`CDI`\
  \ 事件通过实现应用程序内的异步通信进一步支持了 DDD，鼓励模块化并减少了组件之间的耦合。\n\n在下表中，你可以看到每个 `CDI` 特性以及你如何利用它们编写\
  \ DDD 代码：\n\n| CDI 特性 | 在 DDD 中的角色 |\n| :--- | :--- |\n| 生产者方法 | 集中创建和管理领域实体及资源，促进一致性并简化测试。\
  \ |\n| 作用域注解 | 管理领域对象的生命周期，有助于构建符合 DDD 边界的模块化分层架构。 |\n| 拦截器 | 处理交叉关注点（如错误处理），保持领域逻辑的独立和聚焦。\
  \ |\n| CDI 事件 | 实现领域对象之间的异步通信，促进松耦合并增强模块化。 |\n\n表 8.1：CDI 特性及其在 DDD 中的使用方法\n\n除了\
  \ `CDI` 之外，`Jakarta Bean Validation` 对于在整个应用程序中强制执行约束以维护领域对象的完整性也关重要。`Bean Validation`\
  \ 允许你定义规则，以保证从传入请求到持久化层的数据一致性。这些规则确保了领域约束在服务、控制器和数据库中得到一致的应用。例如，对电子邮件字段的约束可以确保无效的电子邮件不会通过任何应用层。此外，`Bean\
  \ Validation` 支持跨越多个字段的复杂约束，确保你的领域对象符合业务规则。\n\n下表展示了更多关于如何利用 `Bean Validation` 进行\
  \ DDD 的内容，主要是在你可以使用注解驱动方法探索约束的地方：\n\n| Bean Validation 特性 | 在 DDD 中的角色 |\n| :---\
  \ | :--- |\n| 基于注解的约束 | 确保领域对象中的属性根据业务规则进行验证，例如有效的电子邮件或最小年龄。 |\n| 跨字段约束 | 提供跨越多个字段的高级验证逻辑，确保领域对象的整体完整性。\
  \ |\n| 分组约束 | 定义验证组以应用特定上下文的规则，支持领域中的上下文驱动行为。 |\n\n表 8.2：Bean Validation 特性及其在 DDD\
  \ 中的使用方法\n\n持久化是 DDD 的另一个关键元素。`Jakarta Persistence (JPA)` 和 `Jakarta NoSQL` 促进了领域状态的保存和检索，允许你以最小努力实现\
  \ `Repository`（仓库）模式。虽然这些规范并不直接代表 DDD 模式，但它们提供了必要的工具来封装数据并确保领域对象可以被保存。`JPA` 为关系映射提供了一套全面的功能，而\
  \ `Jakarta NoSQL` 支持更灵活的模型，对于领域对象特别有用。下表展示了如何将这些规范应用于 DDD：\n\n| 持久化特性 | 在 DDD 中的角色\
  \ |\n| :--- | :--- |\n| JPA | 管理关系映射并提供基于实体的 API，支持领域聚合。 |\n| Jakarta NoSQL | 简化与\
  \ NoSQL 存储的交互，适用于聚合根和复杂的领域模型。 |\n\n表 8.3：持久化特性及其在 DDD 中的使用方法\n\n将这些 Jakarta EE 特性与\
  \ DDD 原则相结合，可以构建反映核心业务概念的企业应用，同时减少样板代码并专注于领域的完整性。通过这些规范，Jakarta EE 赋予你创建清晰、可维护且符合业务的应用的能力，增强了你\
  \ DDD 实现的效果。\n\n在下一节中，我们将讨论一种帮助你在 DDD 中与数据库集成的新规范。\n\n## 利用 Jakarta Data 增强封装\n\n\
  `Jakarta Data` 引入了一种高效且直观的方式，直接在 Jakarta EE 平台上实现 `Repository` 模式。`Jakarta Data`\
  \ 受到 DDD 的启发，通过为各种数据库类型（包括关系性和 NoSQL）提供一致的 API 来简化数据访问层。通过 `Jakarta Data`，开发者可以创建实现无缝交互的仓库，无需大量的样板代码，在基于\
  \ Jakarta 的编程模型中桥接领域概念和数据库操作。这种灵活性使得 `Jakarta Data` 在 DDD 应用中特别强大，因为仓库是领域对象的中心访问点。\n\
  \n\n\n如果内置的仓库方法不能满足你的需求，Jakarta Data 的自定义仓库接口提供了更高的灵活性。自定义仓库允许你构建查询以适应你的领域语言，从而清晰地对齐\
  \ DDD 的通用语言（Ubiquitous Language）。通过 `@Insert`、`@Update`、`@Delete` 和 `@Save` 等注解，你可以定义精确反映应用程序需求的领域特定方法。例如，在\
  \ `Garage` 仓库中，我们可以使用 `@Insert` 和 `@Delete` 注解以领域为中心的方式管理 `Car` 实体，如下：\n\n```java\n\
  @Repository\npublic interface Garage {\n\n    @Insert\n    Car park(Car car);\n\n\
  \    @Delete\n    Car unpark(Car car);\n}\n```\n\nJakarta Data 为处理大型数据集的应用引入了分页选项，以提高数据处理效率。它支持两种分页类型：基于偏移（offset-based）和基于游标（cursor-based）。基于偏移的分页使用位置偏移计算页码，而基于游标的分页使用指针（游标）导航数据，减少了跨页时丢失或重复结果的风险。以下是一个在\
  \ `CarRepository` 中展示两种分页方式的示例：\n\n```java\n@Repository\npublic interface CarRepository\
  \ extends BasicRepository<Car, Long> {\n\n    Page<Car> findByTypeOrderByName(CarType\
  \ type, PageRequest pageRequest);\n\n    @Find\n    @OrderBy(_Car.NAME)\n    @OrderBy(_Car.VIN)\n\
  \    CursoredPage<Car> type(CarType type, PageRequest pageRequest);\n}\n```\n\n\
  Jakarta Data 还引入了 Jakarta Data 查询语言 (JDQL)，这是一种为仓库方法定制的轻量级查询语言，用于跨数据存储的复杂查询。作为 Jakarta\
  \ Persistence 查询语言 (JPQL) 的子集，JDQL 支持 SQL 和 NoSQL 后端，在利用 JPQL 熟悉语法的同时提供了一致性。通过 `@Query`\
  \ 注解，开发者可以创建可以在不同存储技术中无缝工作的灵活查询。在此示例中，`BookRepository` 定义了可以在 SQL 或 NoSQL 数据库上运行的\
  \ JDQL 查询，如下：\n\n```java\n@Repository\npublic interface BookRepository extends BasicRepository<Book,\
  \ UUID> {\n\n    // 根据特定模式查找标题的书\n    @Query(\"where title like :titlePattern\"\
  )\n    List<Book> booksMatchingTitle(String titlePattern);\n\n    // 按特定作者选择书籍并按标题排序\n\
  \    @Query(\"where author.name = :author order by title\")\n    List<Book> findByAuthorSortedByTitle(String\
  \ author);\n}\n```\n\n如你所示，开发者可以通过 Jakarta Data 以极小的努力让仓库模式生效，使受 DDD 启发的数据处理变得直观且富有表现力。\n\
  \n在接节，我们将使用 NoSQL 数据库通过实际代码示例应用 Jakarta EE 概念，展示如何利用 Jakarta Data 的能力来实现以领域为中心的数据管理方法。\n\
  \n## 将 DDD 集成到企业级 Java 应用\n\n在本节中，我们将通过实现一个酒店管理微服务，采用结合 Helidon 和 Oracle NoSQL 数据库使用\
  \ Jakarta EE 的实用方法。在之前章节的酒店示例的基础上，我们将其扩展为微服务架构，利用 NoSQL 数据库存储酒店房预订和客人信息。让我们深入了解此示例所需的设置和开发步骤。\n\
  \n首先，使用 Helidon 的 Starter UI 设置项目结构，这使得配置变得简单直观，如下：\n\n1. 访问 Helidon Starter (`https://helidon.io/starter/4.1.4?step=1`)。\n\
  2. 选择 Helidon MP 版本，并选择应用程序类型 Quickstart。\n3. 在 Media Support（媒体支持）下，选择 JSON-B。\n\
  4. 根据项目需求定义 `groupId`、`artifactId`、`version` 和 `package name`。\n5. 配置完成后，下载生成的项目并添加最新版本的\
  \ Oracle JNoSQL 驱动以集成数据库。\n\n在具备初始项目结构后，配置数据库设置以便本地运行应用程序。更新 `src/main/resources/META-INF/microprofile-config.properties`\
  \ 如下属性：\n\n```properties\njnosql.keyvalue.database=hotel\njnosql.document.database=hotel\n\
  jnosql.oracle.nosql.host=http://localhost:8080\n```\n\n使用环境变量进行生产设置（符合十二要素应用方法论），可以确保凭据的安全管理，并更容易在没有硬编码值的情况下切换环境。\n\
  \n一旦 Oracle NoSQL 数据库运行，我们就可以开始定义实体了，将其丰富的关系数据库经验引入 NoSQL 领域。在这里，我们通过将 `Room` 视为实体并将\
  \ `Guest` 视为值对象来落实 DDD 原则。`Guest` 嵌入在 `Room` 中作为子文档，在简化数据模型的同时保持了我们以领域为中心的方法。注意\
  \ Jakarta NoSQL 注解的使用，它们与 Jakarta Persistence 注解类似：\n\n```java\n@Entity\npublic\
  \ record Room (@Id String number, @Column Guest guest) {\n}\n\n@Embeddable(Embeddable.EmbeddableType.GROUPING)\n\
  public record Guest (@Column String documentNumber, @Column String name) {\n}\n\
  ```\n\n定义实体后，让我们移动到仓库层。在这里，我们实现了 `Hotel` 仓库接口，利用 `@Save` 和 `@Delete` 等注解以最少的样板代码管理数据持久化。该仓库提供了入住、退房和房间预订的方法，在利用\
  \ Jakarta EE 仓库功能的同时捕捉了 DDD 概念，如下：\n\n```java\n@Repository\npublic interface Hotel\
  \ {\n\n    @Save\n    Room checkIn(Room room);\n\n    @Delete\n    void checkOut(Room\
  \ room);\n\n    @Find\n    Optional<Room> reservation(@By(expert.os.books.ddd.chapter08.hotels._Room.NUMBER)\
  \ String number);\n\n    Page<Room> findBy(PageRequest pageRequest);\n}\n```\n\n\
  最后，我们应该通过 Helidon 的 CDI 支持将这些操作暴露为 RESTful API。将仓库注入到 `HotelResource` 类中：\n\n```java\n\
  @Path(\"/hotels\")\n@ApplicationScoped\n@Produces(MediaType.APPLICATION_JSON)\n\
  @Consumes(MediaType.APPLICATION_JSON)\npublic class HotelResource {\n    private\
  \ static final Logger LOGGER = Logger.getLogger(HotelResource.class.getName());\n\
  \n    private final Hotel hotel;\n\n    @Inject\n    public HotelResource(Hotel\
  \ hotel) {\n        this.hotel = hotel;\n    }\n\n    public HotelResource() {\n\
  \        this(null);\n    }\n\n    @GET\n    public List<Room> rooms(@QueryParam(\"\
  page\") @DefaultValue(\"1\") int page,\n                            @QueryParam(\"\
  size\") @DefaultValue(\"1\") int size) {\n        LOGGER.info(\"Finding rooms page:\
  \ \" + page + \" size: \" + size);\n        var pageRequest = PageRequest.ofPage(page).size(size);\n\
  \        var rooms = hotel.findBy(pageRequest).content();\n        LOGGER.info(\"\
  Found rooms: \" + rooms.size());\n        return rooms;\n    }\n\n    @GET\n   \
  \ @Path(\"/{number}\")\n    public Room reservation(@PathParam(\"number\") String\
  \ number) {\n        LOGGER.info(\"Finding reservation: \" + number);\n        return\
  \ hotel.reservation(number)\n                .orElseThrow(() -> new WebApplicationException(\"\
  Room not found\", Response.Status.NOT_FOUND));\n    }\n\n    @PUT\n    public Room\
  \ checkIn(Room room) {\n        LOGGER.info(\"Check in: \" + room);\n        return\
  \ hotel.checkIn(room);\n    }\n\n    @DELETE\n    @Path(\"/{number}\")\n    public\
  \ void checkOut(@PathParam(\"number\") String number) {\n        LOGGER.info(\"\
  Check out: \" + number);\n        var room = hotel.reservation(number)\n       \
  \         .orElseThrow(() -> new WebApplicationException(\"Room not found\", Response.Status.NOT_FOUND));\n\
  \        hotel.checkOut(room);\n    }\n}\n```\n\n在代码和配置完成后，是时候本地执行应用程序了。首先通过以下命令打包并运行应用程序：\n\
  \n```bash\nmvn package\njava -jar target/hotel-reservation.jar\n```\n\n一旦应用程序运行，你可以使用\
  \ cURL 通过 HTTP 请求与其交互。以下是几个帮助你开始酒店预订微服务的示例：\n\n\n\n\n\n* 入住客人（Check-in）：此命令通过发送包含房号和客人详情的\
  \ JSON 负载，将客人注册到特定房间：\n\n```bash\ncurl -X PUT -H \"Content-Type: application/json\"\
  \ -d '{\"number\":\"101\", \"guest\":{\"name\":\"John Doe\", \"documentNumber\"\
  :\"12345\"}}' http://localhost:8181/hotels\n```\n\n* 获取所有房间：通过此 GET 请求检索所有房间列表及其预留状态：\n\
  \n```bash\ncurl -X GET http://localhost:8181/hotels\n```\n\n* 退房（Check out）：要从特定房间退房，请使用以下\
  \ DELETE 请求并指定房号：\n\n```bash\ncurl -X DELETE http://localhost:8181/hotels/101\n\
  ```\n\n这些简单的命令允许您在酒店微服务中管理房间入住、退房和房间列表。它们展示了 `Jakarta EE`、`Helidon` 和 `Oracle NoSQL`\
  \ 在符合 DDD 设计的架构中可以提供的无缝交互。\n\n通过这个示例，我们说明了 `Jakarta EE` 如何结合 `Helidon` 和 `Oracle\
  \ NoSQL` 简化符合 DDD 的微服务的创建。遵循这种方法，您可以构建出可扩展、灵活且以领域为中心的应用，从而最大化 `Jakarta EE` 在微服务环境中的能力。\n\
  \n## 结论\n\n本章探讨了 `Jakarta EE` 如何通过 `Jakarta Data`、`CDI` 和 `Jakarta NoSQL` 支持 DDD\
  \ 原则。我们使用 `Helidon` 和 `Oracle NoSQL` 数据库实现了一个酒店预订微服务，展示了 `Jakarta EE` 创建关注领域的企业级应用的能力。这种方法提供了强大的存储库抽象、有效的依赖注入和无缝的数据库集成，简化了符合\
  \ DDD 的应用的开发和可扩展性。\n\n下一章将使用 `Spring` 进行 DDD。`Spring` 的灵活性和流行使其非常适合在 Java 应用中应用\
  \ DDD 原则，支持模块化架构和充分的数据访问。我们将探索利用 `Spring` 进行 DDD，并将其方法与 `Jakarta EE` 进行比较，以突显每个平台如何增强开发。\n\
  \n## 重点复习\n\n* `Jakarta EE` 是 Java 开发的企业级标准：它提供了一致一致的 API，简化了企业级应用的实现，且独立于所使用的框架。\n\
  \n* 上下文和依赖注入 (`CDI`) 增强了模块化：它有助于管理依赖关系、对象周期，并在 DDD 应用中实现更好的关注点分离。\n\n* `Jakarta\
  \ Data` 引入了内置和自定义存储库：它通过提供预定义的存储库接口简化了数据访问，同时允许领域特定的查询方法。\n\n* `Jakarta Data` 原生支持存储库模式（Repository\
  \ pattern）：它提供了一种与数据库交互的结构化方式，将持久化逻辑从业务规则中抽象出来。\n\n* `Jakarta Data` 支持基于方法的查询：开发者可以使用命名规范或如\
  \ `@Insert`、`@Find` 和 `@Delete` 等注解来定义查询方法。\n\n* `Jakarta Data` 中的分页可以是基于偏移（offset）或基于游标（cursor）的：基于偏移的分页基于位置，而基于游标的分页改进了大型数据集的一致性。\n\
  \n* `Jakarta Data Query Language` (`JDQL`) 是 `JPQL` 的子集：它提供了一种灵活且与数据库无关的查询机制，适用于关系型和\
  \ NoSQL 数据库。\n\n* `Bean Validation` 强制领域约束：它确保业务规则（如必填字段或特定格式）应用于整个应用层。\n\n* `Jakarta\
  \ NoSQL` 赋予了数据建模灵活性：它简化了 NoSQL 数据库交互，同时保持了 `Jakarta Persistence` 用户熟悉的结构。\n\n* `Jakarta\
  \ EE` 与 `Helidon` 和微服务无缝集成：这允许在高效应用 DDD 原则的同时，构建可扩展的云原生应用。\n\n## 多选题\n\n1. 在企业级应用背景下，`Jakarta\
  \ EE` 的主要目的是什么？\n\na. 创建轻量级 Java 应用\nb. 为企业级应用开发定义标准 API\nc. 与 `Spring` 框架竞争\nd.\
  \ 提供仅限 Java 的微服务解决方案\ne. 消除对数据库的需求\n\n2. `Jakarta EE` 中的哪种规范主要负责依赖管理和周期处理？\n\na.\
  \ `Jakarta Data`\nb. `Jakarta NoSQL`\nc. Contexts and Dependency Injection（上下文与依赖注入）\n\
  d. `Bean Validation`\ne. `Jakarta RESTful Web Services`\n\n3. 在 DDD 语境下，`Jakarta\
  \ Data` 的主要角色是什么？\n\na. 管理应用安全\nb. 为数据访问提供存储库抽象\nc. 强制执行领域约束\nd. 处理前端 UI 交互\ne.\
  \ 管理用户认证\n\n4. 以下哪种 `Jakarta Data` 存储库类型允许开发者使用 `@Insert` 和 `@Delete` 等注解定义查询方法？\n\
  \na. 内置存储库接口\nb. 自定义存储库接口\nc. 动态存储库\nd. 外部存储库接口\ne. 服务存储库\n\n5. `Jakarta Data` 中的\
  \ `@Save` 注解的作用是什么？\n\na. 从数据库中删除数据\nb. 在保存之前验证数据\nc. 检查数据是否存在，然后相应地插入或更新\nd. 加密数据\n\
  e. 执行软删除\n\n6. `Jakarta Data` 支持哪种类型的分页来处理大型数据集？\n\na. 基于页面和基于偏移\nb. 基于偏移和基于游标\n\
  c. 基于游标和基于动态\nd. 基于页面和基于序列\ne. 基于序列和基于偏移\n\n7. `CDI` 的哪种功能有助于减少创建和管理领域实体的样板代码？\n\
  \na. 拦截器器（Interceptors）\nb. 作用域注解（Scoped annotations）\nc. `CDI` 事件\nd. 生产者方法（Producer\
  \ methods）\ne. 事务管理\n\n8. `Jakarta Data` 的 `JDQL` 是什么？\n\na. `Jakarta Data Query\
  \ Language`，`JPQL` 的子集，用于数据库查询\nb. 用于 `Jakarta EE` 应用的 JSON 解析器\nc. 管理微服务的新框架\n\
  d. 用于移动应用的 Java Query Language\ne. 用于数据验证的 Java Quality Language\n\n9. 描述 Data 存储\
  \ Data Data Data 模式的模式？\n\na. 将所有业务逻辑集中在数据层\nb. 作为领域对象与底层数据库之间的桥梁\nc. 为 CRUD 操作提供复杂的业务逻辑\n\
  d. 仅处理应用中的事务\ne. 跨层验证数据\n\n10. 哪种 `Jakarta EE` 功能有助于强制跨层的数据一致性？\n\na. `CDI`\nb.\
  \ `Jakarta NoSQL`\nc. `Bean Validation`\nd. `JAX-RS`\ne. `Jakarta Messaging`\n\n\
