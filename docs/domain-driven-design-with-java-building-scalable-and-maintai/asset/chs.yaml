  number\", room.getNumber());\n        roomCollection.updateOne(filter, Updates.unset(\"\
  guest\"));\n    }\n\n    @Override\n    public Optional<Room> reservation(String\
  \ number) {\n        RoomNoSQL roomNoSQL = roomCollection.find(eq(\"number\", Long.parseLong(number))).first();\n\
  \        return Optional.ofNullable(roomNoSQL).map(mapper::toDomain);\n    }\n\n\
  \    @Override\n    public Long countBy() {\n        return roomCollection.countDocuments();\n\
  \    }\n\n    @Override\n    public Optional<Room> findEmptyRoom() {\n        RoomNoSQL\
  \ emptyRoom = roomCollection.find(Filters.eq(\"guest\", null)).first();\n      \
  \  return Optional.ofNullable(emptyRoom).map(mapper::toDomain);\n    }\n}\n```\n\
  \n\n\n\n本章探讨了使用领域驱动设计（DDD）对 SQL 和 NoSQL 数据库进行数据建模的基础。我们研究了 SQL 的结构化、模式驱动的设计如何与 DDD\
  \ 形成对比，这通常需要一个映射层来解决领域模型与数据库表之间的阻抗不匹配（impedance mismatch）。\n\n我们强调了 NoSQL 的灵活性和无模式结构，这可以减少这种不匹配，但需要仔细的建模以维护数据完整性。通过\
  \ `Jakarta Persistence` 和 `MongoDB` 的示例，我们说明了如何将 SQL 和 NoSQL 数据模型与 DDD 对齐，并承认每种方法独特的权衡。\n\
  \n在下一章中，我们将探索使用 `Jakarta EE` 的企业级 Java，重点关注如何使用这个可扩展平台基于 DDD 原则开发企业级应用。我们将介绍工具、最佳实践和设计模式，用于构建集成\
  \ SQL 和 NoSQL 数据库的韧性系统，加深我们对大规模 DDD 应用的理解。\n\n## 记忆要点\n\n- `Impedance mismatch`（阻抗不匹配）：面向对象的应用模型与关系型数据库模式之间的结构和概念差距需要一个映射层来将它们对齐。\n\
  - `SQL 数据库遵循规范化`：在关系型数据库中，规范化减少了冗余并确保了数据完整性，但它可能需要影响性能的连接（joins）。\n- `NoSQL 数据库优先考虑反规范化`：NoSQL\
  \ 数据库通常倾向于反规范化，通过存储相关数据来优化查询性能，减少对连接的需求。\n- `ACID vs. BASE`：SQL 数据库遵循强一致性的 `ACID`\
  \ 模型，而 NoSQL 数据库使用 `BASE` 模型，优先考虑可用性和最终一致性。\n- `SQL 数据建模需要模式定义`：在存储数据之前，关系型数据库需要预定义的模式，以确保结构和完整性，但降低了活性。\n\
  - `NoSQL 提供模式灵活性*：大多数 NoSQL 数据库允许无模式数据存储，能够实现灵活的结构，但需要仔细的一致性管理。\n- `映射层桥接应用与数据库模型`：`JPA`\
  \ 和对象文档映射器 (`ODMs`) 等工具促进了领域模型与数据库之间的通信。\n- `NoSQL 中的嵌入与引用`：像 `MongoDB` 这样的文档数据库支持嵌入相关数据（子文档）以加快读取，但可能需要跨多个文档进行更新。\n\
  - `DDD 关注行为`：与关注数据存储的数据库不同，DDD 强调在领域模型中封装行为，以反映真实世界的业务规则。\n- `数据库选择是一种权衡`：选择 `SQL`\
  \ 还是 `NoSQL` 取决于一致性要求、扩展性需求、查询复杂度以及数据库模型与领域对齐的程度等因素。\n\n## 单选题\n\n1. 关系型数据库在数据建模中的主要优势是什么？\n\
