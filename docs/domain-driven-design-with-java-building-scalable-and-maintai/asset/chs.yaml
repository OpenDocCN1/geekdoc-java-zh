  \n![QR-Logo](img/fm1.png)\n\n# 第 1 章 理解领域驱动设计\n\n## 引言\n\n对软件的需求已成为业务成功的战略性和不可或缺的元素，渗透到现代组织的每一层。公司日益依赖技术来提高效率、交付价值并保持竞争力。这种日益增长的依赖强调了能够让软件解决方案与业务目标紧密结合的开发实践的重要性。领域驱动设计（DDD）作为这种需求的应运而生，提供了一种简单的方法来弥补业务预期与技术实现之间持续存在的鸿沟。它使团队能够准确清晰地交付支持并推动业务结果的软件。\n\
  \n随着业务环境变得越来越动态和多化，将领域知识转化为有效软件解决方案的挑战变得愈发明显。一个常见问题在于利益相关者的愿景与软件最终交付的内容之间的不匹配。行业观察指出许多软件项目中的关键失败点：过度关注计划和设计而缺乏验证、客户需求模糊或多变、实施过程中出现不可预见的复杂性，以及产品与工程团队之间的协作薄弱。这些问题导致技术工作严重偏离业务目标。\n\
  \n选择的悖论加剧了当今工具格局中的脱节。虽然开发团队可以接触到前所未有的框架和技术，但海量的选择会导致决策瘫痪、效率低下以及重点迷失。在这样的背景下，复杂性变成了负担而非优势，使得在整个开发过程中保持清晰度和与业务对齐变得日益困难。\n\
  \n\n\n\n这正是领域驱动设计（DDD）实践发挥作用之处。通过将开发植根于业务领域，并鼓励有意的、协作的建模，DDD 为交付能够反映利益者实际需求的解决方案提供了框架。DDD\
  \ 并不是规定特定的架构或技术栈，而是无论技术限制如何，都促进了清晰性、共同理解和长期的可维护性。\n\n本章介绍了 DDD 背后的逻辑，解释了它为什么至关重要以及它旨在解决的问题。它为后续更深层次的技术和战略性主题奠定了基础。掌握\
  \ DDD 不仅仅是学习模式——它始于理解其原则，特别是指导开发从发现到实现的战略维度和战术维度。本章即是这段旅程的第一步。\n\n## 结构\n\n在本章中，我们将探讨以下主题：\n\
  \n* 领域驱动设计的重要性\n* 将业务目标与技术实现联系起来\n* 核心概念与方法论\n\n## 目标\n\n本章为理解为什么 DDD 在软件开发中至关重要奠定了基础，重点关注导致项目失败的挑战，例如业务团队与技术团队之间的不一致、客户预期不明确以及不必要的复杂性。通过探索\
  \ DDD 的原则，本章展示了它如何提供一种结构化的方法来弥合业务与技术之间的差距，促进协作，并确保软件解决方案符合实际需求。本章并没有深入实现细节，而是引入了\
  \ DDD 背后的推理，为全书中对其战略和战术应用的更深层次讨论铺平了道路。\n\n## 领域驱动设计的重要性\n\nDDD 可以通过以下方式解决经常导致软件项目失败的常见挑战：\n\
  \n*   **对齐业务和技术团队：** DDD 提供的实践可以明确业务需求，并确保技术实现能够满足这些需求和预期。\n*   **明确客户预期：** 减少误解和模糊的需求，可以使软件真正满足利益者的目标。\n\
  *   **简化解决方案的设计：** 将系统的复杂性拆分为可管理的部分，可以减少通常让人感到无从从的复杂性，减缓进度，并使长期维护变得困难。通过正确的实践，团队可以从更简单的设计中获益，从而使软件的维护不再那么困难。\n\
  *   **改进跨团队协作：** 当业务团队和技术团队不紧密合作时，关键的业务洞察可能会在翻译过程中丢失。通过 DDD，每个人都可以协作并朝着相同的目标努力。\n\
  \n通过将软件开发植根于业务领域，并培养技术与业务团队之间持续的紧密协作，DDD 实践可以让您的团队每一个 `class`、`method` 和 `variable`\
  \ 都与核心业务需求完美对齐，最终让你对最终产品的价值及其与利益者预期的一致性拥有控制权。\n\nDDD 优势之一是它管理复杂性的能力。在一个软件开发工具和框架不断增长的世界里，开发者开始对选择感到眼不暇接并忽视业务目标只是时间问题。DDD\
  \ 通过结构化的方法应对了这一点，这种方法允许将复杂的业务领域拆分为可管理且集中的子领域。通过这种方式，软件变得更容易理解和维护，同时确保开发过程与整体业务战略保持一致。\n\
  \n此外，DDD 强调了共享语言的重要性，即在业务和技术团队之间一致使用的“通用语言”（Ubiquitous Language）。通用的词汇可以最大限度地减少误解，并驱动项目的所有人员朝着相同的目标努力。开发过程转变为一种跨团队的协作努力，业务和\
  \ IT 部门创建并交付准确反映业务需求和目标的解决方案。\n\n现在，看看 DDD 在现实场景中的实际采用，我们可以参考那些对精确性和团队对齐至关重要的行业。例如，在合规性和准确性至关重要的银行业，DDD\
  \ 确保贷款管理系统和交易平台的设计既满足监管要求，又满足金融专业人士的特定需求。在电子商务领域，DDD 能够开发能够快速适应不断变化的市场需求同时保持无缝客户体验的平台。\n\
  \n最终，DDD 的重要性在于它能够为软件开发过程带来清晰度和焦点。通过确保软件反映并支持业务的战略目标，DDD 提高了解决方案的整体质量和业务价值。了解你的工作所交付的价值可以激励你在项目中有效地实施\
  \ DDD。在接下来的章节中，让我们来探索 DDD 如何帮助弥合业务团队与技术团队之间的差距，为您提供可以改进整个项目跨团队协作的基础知识。\n\n\n\n\n\
  领域（Domain）指的是我们旨在转化为代码的特定主题或知识领域。领域的大小或复杂度并不是问题，因为我们可以应用“分治法”（Divide and Conquer）原则将复杂领域分解为更小、更易理解的子集。\n\
  \n下图说明了软件开发中的这种分治法方法。它直观地表示了软件开发中的知识如何分解为各个领域，例如数据库、文档和架构，并进一步细划分为 `SQL` 和 `NoSQL`\
  \ 等子领域。这种视觉化的分解有助于明确 DDD 如何通过关注特定的业务领域来鼓励理解和管理复杂性。\n\n![一个蓝色的椭圆，标记为 Software Development，包含三个标记为\
  \ Architecture、Database 和 Documentation 的白色椭圆。背景为浅灰色。](img/Figure_1.1.png)\n\n图\
  \ 1.1：作为领域的软件开发\n\n在 DDD 的语境下，业务领域是公司的主要活动区域，反映了其核心交付价值。例如，星巴克主要与咖啡相关，而亚马逊则在零售和云计算等多个领域运营。公司可以不断演进，随着时间的推移改变或扩大其业务领域。\n\
  \n为了管理领域的复杂性，将其细分为子领域。这些可以进一步分类为核心（core）、支持（supporting）和通用（generic）子领域。\n\n由于软件工程师对客户业务的了解有限，领域专家（domain\
  \ expert）发挥着至关重要的作用。领域专家深入理解业务的复杂细节，这些细节自然地成为了软件中的需求。\n\n| 注意：最后一个术语“设计”（Design）可能很难定义，往往会导致与软件架构产生混淆。《软件架构基础基础》（The\
  \ Fundamentals of Software Architecture）等经典著作将架构描述为难以改变的内容或设计，但这仍然是一个抽象概念，因为什么是难以改变的变化而异。Neal\
  \ Ford 的书籍《软件架构实战指南》（Head First in Software Architecture）提供了一个更细致的视角，将架构和设计定义在一个光谱上，其中设计是关于做出塑造软件系统结构和组织的决策，以管理复杂性并创建一个连贯、可维护的架构。\
  \ |\n\n下图展示了从软件架构到设计的决策光谱。它代表了设计与架构之间的紧密联系，以及设计决策如何可以是一个更容易的定义，也可以成为软件系统核心结构的内在部分。\n\
  \n![一个水平的蓝色调光谱，从浅色（左侧，标记为 Architecture）过渡到深色（右侧，标记为 Design）。文字说明大多数决策落在光谱的中部区域。](img/Figure_1.2.png)\n\
  \n图 1.2：架构与设计的光谱\n\n考虑到此，我们可以将 DDD 定义为对软件系统的结构和组织做出有意的决策，旨在提取并将业务知识转化为代码。\n\nDDD\
  \ 与语言无关的，可以应用于使用任何编程语言、范式或框架构建的解决方案。尽管 DDD 通常与面向对象编程（OOP）和 Java 联系在一起，但 DDD 实践也适用于根据项目需求选择的任何其他语言。\n\
  \n| 提示：本书并非取代关于 DDD 的经典文献，而是通过实用的指导来补充它们。Eric Evans 的《Domain-Driven Design: Tackling\
  \ Complexity in the Heart of Software》和 Vaughn Vernon 的《Implementing Domain-Driven\
  \ Design》等基础性著作是必读的，即使它们看起来具有挑战性。 |\n\nDDD 有两个主要组成部分：策略（strategy）和战术（tactics）。两者对于确保良好的技术质量和正确的业务对齐都至关重要。让我们探索这两个方面之间的区别以及它们如何相互作用。\n\
  \n### DDD 的战略方面\n\nDDD 是所有开发工作的基础，重点在于加深对业务、其核心领域以及构成其运营的所有子领域的理解。\n\nDDD 中的策略是关于观察大局，识别业务中应该优先考虑并反映在软件中的最关键领域。这不仅需要协作，还需要与领域专家建立伙伴关系，他们可以传达出系统需要捕获的复杂性。战略性方法使得开发过程中的每项决策都能以对业务背景的坚实、透彻理解作为支持。它指导了整个软件项目的结构和方向。\n\
  \n### DDD 的战术方面\n\nDDD 的战术方面涉及将战略洞解实际应用到代码中。\n\n一旦明确定义了业务领域和子领域，并建立了“通用语言”（Ubiquitous\
  \ Language，即领域的术语和核心概念），DDD 的战术端就上场了。它包括实现特定的设计模式和编码实践，通过软件将战略愿景变为现实。战术确保软件架构与业务模型保持一致，因为领域的抽象概念被转化为具体的、功能的系统组件。DDD\
  \ 策略的标准定义通过可执行的任务准确表示，例如创建实体（entities）、值对象（value objects）、聚合根（aggregates）和存储库（repositories）。\n\
  \n当 DDD 中的策略和战术结合时，就创造了一种凝聚的软件开发方法。这种方法不仅是一种选择，而且是 DDD 中的必要条件。策略提供了总领的愿景并确保软件与业务需求一致，而战术则处理将该愿景转化为运行系统的实际实性工作。两者都是至关重要的；没有坚实的战略基础，软件可能无法充分解决业务的核心挑战；没有有效的战术，即使是最好的战略计划在执行中也会失败。通过整合这两个方面，DDD\
  \ 能够创建出既在技术上健壮又与业务高度相关的软件。\n\n| 提示：正如在《软件设计哲学》（A Philosophy of Software Design）中所解释的那样，战略性的软件工程师理解软件开发不仅仅是编写代码。相比之下，仅仅关注战术可能会害大于利，并获得“战术旋风”（Tactical\
  \ Tornado）的绰号。 |\n\n虽然软件工程师很容易对 DDD 的战术方面感到兴奋，但重要的是，有效的实施必须从策略开始。DDD 的目标是将业务知识提取并编码到软件中，使策略成为至关重要的第一步。在整书中，我们将探索可以让你你的\
  \ DDD 实践提升到新水平的核心策略和战术知识。\n\n## 结论\n\n本章解决了确保软件开发满足客户和利益相关者期望的关键挑战。通过探索 DDD 的核心原则，我们展示了这种方法如何使软件与业务目标一致。我们强调了理解领域、做出有意的设计决策以及成功实施\
  \ DDD 所需的战略基础的基础。本章的关键点包括 DDD 如何确保开发与业务需求一致、领域和设计在将业务知识转化为软件方面的作用，以及业务与技术团队协作的重要性。\n\
  \n下一章将深入研究战略 DDD，探索如何有效地识别和分类领域及子领域。这种战略洞察将提供做出明智的、符合业务的决策所需的工具，确保你的 DDD 努力为客户带来真正的价值。\n\
  \n\n\n\n\n-   DDD 关注业务对齐：DDD 的首要目标是确保软件开发与业务目标保持一致并交付真实价值。\n-   常见的项目失败源于对齐问题：客户预期不明确、协作不畅以及设计过于复杂等问题通常会导致软件无法满足业务需求。\n\
  -   业务领域是 DDD 的核心：软件的结构应该围绕实际业务领域构建，使用反映真实世界操作的概念和语言。\n-   协作是关键：业务团队与技术团队之间通过共享`通用语言`（Ubiquitous\
  \ Language）进行有效沟通，可以减少误解并提高软件成果。\n-   DDD 既是战略性又是战术性的：战略方面侧于理解领域和子域，而战术方面涉及实现反映业务需求的模式和结构。\n\
  -   应该管理复杂度而非增加复杂度：DDD 帮助将复杂系统分解为可管理的部分，确保软件保持适应性、可维护性，并与不断变化的业务需求保持一致。\n-   本章为\
  \ DDD 奠定了基础：它并没有涵盖每一个细节，而是介绍了 DDD 背后的逻辑，为您深入探索其战略和战术应用做好准备。\n\n## 多选题\n\n1. DDD\
  \ 旨在解决的主要挑战是什么？\n\na. 降低软件开发成本\nb. 使软件开发与业务目标一致\nc. 提高软件交付速度\nd. 增加软件项目的技术复杂度\n\
  e. 增强软件界面的审美设计\n\n2. 以下哪不是本章讨论的 DDD 核心重点？\n\na. 领域 (Domain)\nb. 设计 (Design)\nc.\
  \ 战术实现 (Tactical implementation)\nd. 战略基础 (Strategic foundation)\ne. 审美用户界面设计\n\n\
  3. 为什么在 DDD 中拥有战略基础至关重要？\n\na. 它有助于降低软件工具的成本。\nb. 它确保软件架构复杂到难以更改。\nc. 它使软件解决方案与业务目标密切一致。\n\
  d. 它仅关注开发的技术方面。\ne. 它消除了对领域专家的需求。\n\n4. 在 DDD 中，为什么业务与技术团队之间的协作至关重要？\n\na. 增加项目的复杂度\n\
  b. 确保按时交付软件\nc. 培养共同的理解和语言，减少不必要的复杂度并确保软件交付业务真正需要的内容\nd. 减少所需的技术资源并在不增加额外复杂度的情况下交付业务真正的内容\n\
  e. 允许技术团队独立做出所有决策\n\n5. 专家在 DDD 中的主要角色之一是什么？\n\na. 为软件编写代码\nb. 提供指导开发过程的深层业务知识\n\
  c. 管理项目的技术资源\nd. 设计软件的用户界面\ne. 创建详细的软件架构图\n\n### 答案\n\n| 题号 | 答案选项字母 |\n| :--- |\
  \ :--- |\n| 1. | b. |\n| 2. | e. |\n| 3. | c. |\n| 4. | d. |\n| 5. | b. |\n\n##\
