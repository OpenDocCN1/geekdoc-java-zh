  \n\n\n本章将探索如何使用 Quarkus 进行 CDI。虽然可以使用数据库即服务（DBaaS）等外部服务运行数据库，但在本章中，关系型数据库将使用 H2\
  \ 在内存中执行。\n\n- Java 21\n- Git\n- Maven\n- 任何优的 IDE\n\n## 目标\n\n本章将演示 Quarkus Panache\
  \ 如何在符合 DDD 原则的同时简化数据库交互。通过探索三种不同的方法：`PanacheEntityResource`、使用 `PanacheEntity`\
  \ 的活动记录（Active Record）模式，以及使用 `PanacheRepository` 的 Repository 模式，开发者可以清晰地理解如何平衡生产力、封装性和可维护性。本章提供了关于根据项目复杂度选择正确方法的实践见解，确保持久化逻辑在\
  \ DDD 架构中保持高效、可扩展且结构良好。\n\n## Quarkus、Jakarta EE 和 MicroProfile 的集成\n\nQuarkus 与\
  \ Jakarta EE 和 MicroProfile 紧密相，对这些规范提供了广泛支持，同时针对现代云原生环境对其进行了优化。在之前的章节中，我们探索了 Jakarta\
  \ EE 如何为企业级 Java 应用提供坚实的基础，其特点是拥有依赖注入、事务管理、安全等成熟的 API。我们还讨论了 MicroProfile 如何通过引入为微服务定制的\
  \ API（如配置、容错、健康检查和指标）来增强 Java 开发。所有关于这些规范的信息都可以无缝应用到 Quarkus 中，通过对其进行高性能、快速启动和高效资源利用的优化，进一步增强了其能力。\n\
  \nQuarkus 核心支持广泛的 Jakarta EE API，确保了熟悉上下文和依赖注入（CDI）、Jakarta 持久化 API（JPA）、Jakarta\
  \ RESTful Web Services（JAX-RS）以及 Jakarta JSON 绑定（JSON-B）等标准的开发者能够进行平滑过渡。与严重依赖运行时反射的传统企业应用运行时和框架不同，Quarkus\
  \ 将大部分处理移动到了构建时（build time）。这种转变减少了内存开销并提高了执行速度，对于对启动速度和低资源消耗至关重要的容器化和无服务器环境特别有益。\n\
  \nMicroProfile 旨在增强用于微服务的 Jakarta EE，也被 Quarkus 全面采纳。它包含了关键规范，例如允许外部化和动态配置的 MicroProfile\
  \ Config，以及能够为云原生部署提供内置就绪和存活探针的 MicroProfile Health。Quarkus 通过其统一配置模型增强了这些能力，提供了一种可重复且一致的应用程序配置方法，简化了跨环境的配置管理。MicroProfile\
  \ 的观测性功能（如指标和追踪）与 Quarkus 无缝集成，使得监控和优化分布式应用程序变得更加简单。\n\n除了兼容性，Quarkus 还积极贡献于企业 Java\
  \ 的演进。像 CDI Lite 这样的功能灵感主要来自 Quarkus 高效的依赖注入模型，展示了其对广泛生态系统的影响。通过利用 GraalVM 进行原生编译，并针对云端优化\
  \ Jakarta EE 和 MicroProfile API，Quarkus 在保留其核心优势的同时使企业 Java 实现了现代化。开发者可以继续依赖众为人知的\
  \ Jakarta EE 和 MicroProfile 模式，同时从 Quarkus 的效率、灵活性云原生能力中受益。\n\nQuarkus 并不是要取代 Jakarta\
  \ EE 或 MicroProfile；而是要增强它们。它提供了两者的完美结合：企业 Java 规范的稳定性和成熟性，以及云原生开发的快速和轻量级特性。无论是构建传统应用、微服务还是无服务器函数，Quarkus\
  \ 都能让开发者在利用熟悉技术的同时，充分利用现代优化优势。\n\nQuarkus 构建在 Jakarta EE 和 MicroProfile 的坚实基础之上，使开发者可以使用熟悉的技术创建企业级应用，同时利用性能优化。让我们超越理论层面，看看\
  \ Quarkus 的实际运行。我们将探索其精简开发模型如何允许以最少的样板代码和最大的生产力来创建高效、轻量级的应用。\n\n## Quarkus 的实战\n\
  \n现在我们已经探索了 Quarkus 的基础以及它与 Jakarta EE 和 MicroProfile 的连接，是时候将这些概念付诸实践了。\n\n作为一名软件开发者，Quarkus\
  \ 以简化开发和显著提高开发者生产力而闻名。它的深度集成允许毫不费力地设置，就像苹果生态系统的无缝体验一样，在 iPhone 上开始任务并在 Mac 上继续，感觉非常自然。类似地，Quarkus\
  \ 简化了数据库连接。如果你添加 PostgreSQL 作为依赖项，Quarkus 可以自动启动一个基于 Docker 的实例，减少配置负担。这种程度的自动化创建了直观的开发体验，让开发者能够关注业务逻辑而非基础设施问题。\n\
  \n为了简化我们与数据库的集成，我们将使用 Panache，这是一个专为 Quarkus 设计的特定库，旨在简化持久化层的开发。Panache 通过减少样板代码同时保持整洁的领域模型，简化了\
  \ Quarkus 中的数据访问，使其成为 DDD 方法的极佳选择。\n\n在示例中，我们将定义三个语义等同实体：开发者（developer）、程序员（programmer）和软件工程师（software\
  \ engineer）。虽然它们在概念上代表相同的角色，但我们将使用它们来演示使用 Quarkus 构建资源结构的不同方法。探索多种方法将突出 Quarkus\
  \ 如何在保持开发简洁高效的同时支持灵活性。\n\n### 创建并设置新项目\n\n第一步是创建一个 Quarkus 项目。你可以使用 Quarkus 网站快速生成，该网站提供了一个交互式界面来选择依赖项。对于此示例，我们将包含以下组件：\n\
  \n- `quarkus-rest`:在 Quarkus 中启用 RESTful API。\n- `quarkus-rest-jsonb`:提供 JSON 序列化和反序列化。\n\
  - `quarkus-jdbc-h2`:配置内存 H2 数据库以便于测试。\n- `quarkus-hibernate-orm-rest-data-panache`:使用\
  \ Hibernate ORM 和 Panache 简化数据访问。\n\n项目设置完成后，我们准备好探索实现了。在下一节中，我们将定义实体并探索 Quarkus\
  \ 允许我们将它们暴露为资源的不同方式。\n\n### 配置数据库集成\n\n在依赖项就绪后，下一步是配置应用程序属性以确保 Quarkus 正确设置数据库和\
  \ ORM 层。由于我们使用 H2 作为内存关系型数据库，我们在 `application.properties` 中定义了以下设置：\n\n```\nquarkus.datasource.db-kind=h2\n\
  quarkus.datasource.jdbc.url=jdbc:h2:file:../src/main/resources/data/\ndatabase;AUTO_SERVER=true;DB_CLOSE_DELAY=-1\n\
  quarkus.hibernate-orm.dialect=org.hibernate.dialect.H2Dialect\nquarkus.hibernate-orm.database.generation=drop-and-create\n\
  quarkus.hibernate-orm.log.sql=true\n```\n\n这些配置确保 Quarkus 初始化 H2 数据库实例，应用 Hibernate\
  \ ORM 进行实体持久化，并记录 SQL 语句以便观察。`drop-and-create` 策略每次启动时重置数据库，非常适合开发和测试环境。\n\n###\
  \ Panache 实体和资源代码生成\n\n\n\n\n\n让我们来看使用 Quarkus 暴露资源的第一种最直接的方法。我们只需要两个类：一个实体和一个接口，就可以在不编写额外逻辑的情况下创建一个功能完备的\
  \ REST API。\n\n首先，我们使用 Jakarta Persistence 注解创建 `Developer` 实体。该实体扩展了 `PanacheEntity`，这是\
  \ Quarkus Panache 的一项功能，它通过提供内置的 CRUD 操作简化了实体管理。\n\n```java\nimport io.quarkus.hibernate.orm.panache.PanacheEntity;\n\
  \nimport jakarta.persistence.Column;\nimport jakarta.persistence.Entity;\n\n@Entity\n\
  public class Developer extends PanacheEntity {\n    @Column\n    public String name;\n\
  \n    @Column\n    public String email;\n\n    @Column\n    public String language;\n\
  \n    @Column\n    public String city;\n}\n```\n\n由于 `PanacheEntity` 已经包含一个自动生成值的\
  \ `ID` 字段，我们不需要显式地定义它。实体的字段代表了开发者的基本属性，为我们的演示提供了一个简单而实用的示例。\n\n在 Quarkus 中，我们可以使用\
  \ `PanacheEntityResource` 将此实体作为 REST 资源暴露，从而消除了手动实现 REST 端点的需要。\n\n我们所需要创建一个如下所示的接口：\n\
  \n```java\nimport io.quarkus.hibernate.orm.rest.data.panache.PanacheEntityResource;\n\
  \npublic interface DevelopersResource extends PanacheEntityResource<Developer, Long>\
  \ {\n}\n```\n\n在定义开发者实体并使用 `PanacheEntityResource` 将其暴露为资源后，我们可以探索如何与此 API 交互。\n\
  \n### 验证应用程序的行为\n\n由于 Quarkus 会自动生成必要的 RESTful 端点，我们可以在不编写额外代码的情况下执行操作。\n\n通过发送带有所需数据的\
  \ `POST` 请求，我们可以向系统添加新开发者。使用 `curl`，我们可以执行以下命令来创建一个新的开发者条目：\n\n```bash\ncurl -X\
  \ POST \"http://localhost:8080/developers\" \\\n-H \"Content-Type: application/json\"\
  \ \\\n-d '{\n\"name\": \"Alice\",\n\"email\": \"alice@example.com\",\n\"language\"\
  : \"Java\",\n\"city\": \"San Francisco\"\n}'\n```\n\n一旦请求被处理，Quarkus 将新开发者持久化到 H2\
  \ 数据库中。为了验证数据是否已正确存储，我们可以使用 `GET` 请求获取所有注册的开发者：\n\n```bash\ncurl -X GET \"http://localhost:8080/developers\"\
  \ -H \"Accept: application/json\"\n```\n\n如果我们需要根据 `ID` 获取特定的开发者，可以通过追加开发者的标识符来修改\
  \ `GET` 请求。假设我们创建的开发者被分配了 ID `1`，我们可以使用以下命令获取其详情：\n\n```bash\ncurl -X GET \"http://localhost:8080/developers/1\"\
  \ -H \"Accept: application/json\"\n```\n\n更新现有的开发者遵循类似的方法。如果 Alice 决定更改她偏好的编程语言或搬到新城市，我们可以发送带有更新后数据的\
  \ `PUT` 请求，同时保持相同的 ID：\n\n```bash\ncurl -X PUT \"http://localhost:8080/developers/1\"\
  \ \\\n-H \"Content-Type: application/json\" \\\n-d '{\n\"name\": \"Alice\",\n\"\
  email\": \"alice.new@example.com\",\n\"language\": \"Kotlin\",\n\"city\": \"New\
  \ York\"\n}'\n```\n\nQuarkus 将更新现有记录的同时保持数据库的一致性。最后，我们可以发布一个 `DELETE` 请求从系统中删除开发者。例如，删除\
  \ ID 为 `1` 的开发者：\n\n```bash\ncurl -X DELETE http://localhost:8080/developers/1\n\
  ```\n\n此命令将从数据库中删除相应的条目，确保在查询资源时它不再可用。这些简单的命令演示了 Quarkus 如何实现直观且高效的方法来处理 RESTful\
  \ API。它需要极少的设置，同时保持了清晰且结构化的开发流程。现在我们已经探索了暴露资源的最直接的方法，可以转向其他实现方案，它们在利用 Quarkus 效率的同时提供了更多的控制和灵活性。\n\
  \n### 在 Panache 中使用 Active Record\n\n继续上一个示例，之前我们探索了使用 `PanacheEntityResource` 将实体暴露为\
  \ REST 资源的最简单方法，现在我们转向以下方法：使用 `PanacheEntity` 使用 Active Record 模式。\n\n> 注意：对于不熟悉\
  \ Active Record 模式的读者，这是一种设计方法，其中领域对象负责自身的持久化。这种设计模式的对象代表数据库表中的行，封装了数据库访问逻辑，同时允许将领域逻辑直接嵌入实体中。这一概念由\
  \ Martin Fowler 详尽记录，并被旨在简化持久化管理的框架广泛采用。\n\n在此示例中，我们将遵循与之前相同的结构，但会引入一个额外的类来手动定义资源，从而对端点的行为提供更多控制。虽然我们仍然利用了\
  \ Quarkus Panache，但这种方法演示了开发者如何在保持清晰领域模型的同时构建更显式且可定制的 API。\n\n第一步是定义 `SoftwareEngineer`\
  \ 实体。与之前的示例一样，该实体扩展了 `PanacheEntity`，继承了内置的持久化方法。这意味着我们不需要手动指定 `ID` 字段或 CRUD 操作。但与之前的\
  \ `Developer` 示例不同，我们现在将依赖 `PanacheEntity` 的静态方法来查询和持久化数据。\n\n```java\nimport io.quarkus.hibernate.orm.panache.PanacheEntity;\n\
  \nimport jakarta.persistence.Column;\nimport jakarta.persistence.Entity;\n\n@Entity\n\
  public class SoftwareEngineer extends PanacheEntity {\n    @Column\n    public String\
  \ name;\n\n    @Column\n    public String email;\n\n    @Column\n    public String\
  \ language;\n\n    @Column\n    public String city;\n}\n```\n\n实体实体，我们现在定义资源类 `SoftwareEngineerResource`\
  \ 来暴露服务。与之前使用接口不同，我们显式地实现了 REST 端点。这里的区别在于所有的 CRUD 操作都直接通过 Panache 的内置方法（如 `findById()`、`listAll()`\
  \ 和 `persist()`）与 `SoftwareEngineer` 实体进行交互。\n\n```java\nimport io.quarkus.panache.common.Sort;\n\
  import jakarta.enterprise.context.ApplicationScoped;\nimport jakarta.transaction.Transactional;\n\
  import jakarta.ws.rs.*;\nimport jakarta.ws.rs.core.MediaType;\nimport jakarta.ws.rs.core.Response;\n\
  import java.util.List;\n\n@ApplicationScoped\n@Path(\"software-engineers\")\n@Consumes(MediaType.APPLICATION_JSON)\n\
  @Produces(MediaType.APPLICATION_JSON)\npublic class SoftwareEngineerResource {\n\
  \n    @GET\n    @Path(\"{id}\")\n    public SoftwareEngineer get(@PathParam(\"id\"\
  ) Long id) {\n        SoftwareEngineer softwareEngineer = SoftwareEngineer.findById(id);\n\
  \        if (softwareEngineer == null) {\n            throw new WebApplicationException(404);\n\
  \        }\n        return softwareEngineer;\n    }\n\n    @GET\n    public Response\
  \ list() {\n        List<SoftwareEngineer> softwareEngineers = SoftwareEngineer.listAll(Sort.by(\"\
  name\"));\n        return Response.ok(softwareEngineers).build();\n    }\n\n   \
  \ @GET\n    @Path(\"/count\")\n    public long count() {\n        return SoftwareEngineer.count();\n\
  \    }\n\n    @Transactional\n    @POST\n    public Response add(SoftwareEngineer\
  \ softwareEngineer) {\n        SoftwareEngineer.persist(softwareEngineer);\n   \
  \     return Response.ok(softwareEngineer).build();\n    }\n\n    @Transactional\n\
  \    @PUT\n    @Path(\"{id}\")\n    public Response update(@PathParam(\"id\") Long\
  \ id, SoftwareEngineer softwareEngineer) {\n        if (SoftwareEngineer.findById(id)\
  \ == null) {\n            SoftwareEngineer.persist(softwareEngineer);\n        \
  \    return Response.status(Response.Status.CREATED).build();\n        }\n     \
  \   SoftwareEngineer.persist(softwareEngineer);\n        return Response.ok().build();\n\
  \    }\n\n    @Transactional\n    @DELETE\n    @Path(\"{id}\")\n    public void\
  \ delete(@PathParam(\"id\") Long id) {\n        if (!SoftwareEngineer.deleteById(id))\
  \ {\n            throw new WebApplicationException(Response.Status.NOT_FOUND);\n\
  \        }\n    }\n}\n```\n\n\n\n\n\n> 提示：注意，PUT 端点被设计为等等操作，这意味着重复的相同请求将产生相同的结果且不会产生副作用，符合\
  \ REST 最佳实践。换句话说，如果该 ID 的实体存在，则进行更新；如果不存在，则创建一个。在生产环境中，务必验证严格的等等性是否符合需求。如果是，不存在的更新将通过\
  \ 404 错误被拒绝。\n\n此资源类显式地将 REST 端点映射到实体操作，在提供更大灵活性的同时，受益于 `Panache` 简化的数据访问。`SoftwareEngineer`\
  \ 的静态方法执行所有数据库操作，例如获取、计数、创建、更新和删除记录。\n\n我们可以使用与之前示例类似的 `curl` 命令来测试此 API。创建一个新的软件工程师条目可以通过以下\
  \ `POST` 请求完成：\n\n```bash\ncurl -X POST \"http://localhost:8080/software-engineers\"\
  \ \\\n-H \"Content-Type: application/json\" \\\n-d '{\n\"name\": \"Bob\",\n\"email\"\
  : \"bob@example.com\",\n\"language\": \"Python\",\n\"city\": \"Berlin\"\n}'\n```\n\
  \n对于获取、更新或删除 `SoftwareEngineer`，其原理与之前的示例相同，仅资源名称从 `developers` 更改为 `software-engineers`。`GET`、`PUT`\
  \ 和 `DELETE` 请求遵循相同的结构，改为与 `/software-engineers` 端点进行交互。\n\n此实现演示了活动记录（Active Record）方法如何通过直接允许实体类处理持久化逻辑来简化数据访问。虽然这种方法提供了一种快速且有效的管理数据库交互的方法，但某些应用程序需要更结构化的关注点分离。在下一步中，我们将探索另一种方法，利用存储库（Repositories）将持久化逻辑与领域模型进一步解耦，同时受益于\
  \ Quarkus `Panache` 的功能。\n\n## 使用 Panache 使用存储库模式\n\n探索 Quarkus Panache 的第三种也是最后的方法是使用\
  \ `PanacheRepository` 的存储库模式。与之前将持久化逻辑嵌入在实体本身的方法不同，这种方法显式地将数据库操作分离到专用存储库类中。这种方法通过将业务逻辑保持在领域层中并在独立的存储库中管理持久化问题，更符合传统的\
  \ DDD（领域驱动设计）原则。\n\n为了演示这种方法，我们引入了 `Programmer` 实体。在结构上，它与我们之前的实体相同，但现在会将持久化操作委托给存储库，如下：\n\
  \n```java\nimport io.quarkus.hibernate.orm.panache.PanacheEntity;\nimport jakarta.persistence.Column;\n\
  import jakarta.persistence.Entity;\n\n@Entity\npublic class Programmer extends PanacheEntity\
  \ {\n    @Column\n    public String name;\n    @Column\n    public String email;\n\
  \    @Column\n    public String language;\n    @Column\n    public String city;\n\
  }\n```\n\n与之前的实现（我们使用 `PanacheEntity` 的内置方法或依赖 `PanacheEntityResource`）相比，这次我们引入了一个专用的存储库类。`ProgrammerRepository`\
  \ 扩展 `PanacheRepository<Programmer>`，将所有数据库操作与领域模型独立封装：\n\n```java\nimport io.quarkus.hibernate.orm.panache.PanacheRepository;\n\
  import jakarta.enterprise.context.ApplicationScoped;\n\n@ApplicationScoped\npublic\
  \ class ProgrammerRepository implements PanacheRepository<Programmer> {\n}\n```\n\
  \n存储库就绪后，我们现在实现通过 REST API 暴露 CRUD 操作的资源类。与依赖静态方法的 `SoftwareEngineerResource` 不同，此资源注入了\
  \ `ProgrammerRepository` 并将数据库操作委托给它：\n\n```java\nimport io.quarkus.panache.common.Sort;\n\
  import jakarta.enterprise.context.ApplicationScoped;\nimport jakarta.inject.Inject;\n\
  import jakarta.transaction.Transactional;\nimport jakarta.ws.rs.*;\nimport jakarta.ws.rs.core.MediaType;\n\
  import jakarta.ws.rs.core.Response;\nimport java.util.List;\n\n@ApplicationScoped\n\
  @Path(\"programmers\")\n@Consumes(MediaType.APPLICATION_JSON)\n@Produces(MediaType.APPLICATION_JSON)\n\
  public class ProgrammerResource {\n    @Inject\n    ProgrammerRepository repository;\n\
  \n    @GET\n    @Path(\"{id}\")\n    @Produces(\"application/json\")\n    public\
  \ Programmer get(@PathParam(\"id\") Long id) {\n        Programmer programmer =\
  \ repository.findById(id);\n        if (programmer == null) {\n            throw\
  \ new WebApplicationException(404);\n        }\n        return programmer;\n   \
  \ }\n\n    @GET\n    @Produces(\"application/json\")\n    public Response list()\
  \ {\n        List<Programmer> people = repository.listAll(Sort.by(\"name\"));\n\
  \        return Response.ok(people).build();\n    }\n\n    @GET\n    @Path(\"/count\"\
  )\n    public long count() {\n        return repository.count();\n    }\n\n    @Transactional\n\
  \    @POST\n    @Consumes(\"application/json\")\n    @Produces(\"application/json\"\
  )\n    public Response add(Programmer programmer) {\n        repository.persist(programmer);\n\
  \        return Response.ok(programmer).build();\n    }\n\n    @Transactional\n\
  \    @PUT\n    @Path(\"{id}\")\n    @Consumes(\"application/json\")\n    @Produces(\"\
  application/json\")\n    public Response update(@PathParam(\"id\") Long id, Programmer\
  \ programmer) {\n        if (repository.findById(id) == null) {\n            repository.persist(programmer);\n\
  \            return Response.status(204).build();\n        }\n        repository.persist(programmer);\n\
  \        return Response.status(201).build();\n    }\n\n    @Transactional\n   \
  \ @DELETE\n    @Path(\"{id}\")\n    public void delete(@PathParam(\"id\") Long id)\
  \ {\n        if (!repository.deleteById(id)) {\n            throw new WebApplicationException(404);\n\
  \        }\n    }\n}\n```\n\n通过这种方法，所有数据库交互都通过 `ProgrammerRepository` 进行，使得在不修改领域实体的情况下更容易自定义和扩展持久化逻辑。存储库方法对于数据库操作需要自定义查询或不属于领域模型的逻辑复杂应用程序特别有用。\n\
  \n要创建一个新的程序员条目，我们可以发送以下 `POST` 请求：\n\n```bash\ncurl -X POST \"http://localhost:8080/programmers\"\
  \ \\\n-H \"Content-Type: application/json\" \\\n-d '{\n\"name\": \"Charlie\",\n\"\
  email\": \"charlie@example.com\",\n\"language\": \"C++\",\n\"city\": \"London\"\n\
  }'\n```\n\n对于获取、更新或删除程序员的剩余操作与之前的示例相同。唯一的变化是资源名称，从 `developers` 或 `software engineers`\
  \ 更改为 `programmers`。\n\n此实现演示了 Quarkus Panache 中的存储库模式如何提供一种结构化且可扩展的方式来管理持久化。将数据库操作与领域模型解耦提供了更大的灵活性，同时受益于\
  \ Quarkus 的轻级持久化框架。通过此，我们探索了三种将 Quarkus Panache 集成关系型数据库的不同方法，每种方法在简单性、灵活性和架构控制之间都有不同的平衡。\n\
  \n\n\n\n最后一种方法是使用 `PanacheRepository` 的仓库模式，它引入了专用仓库类来处理持久化。将持久化逻辑与实体解耦非常符合 DDD（领域驱动设计），允许领域模型保持纯洁，同时使数据库操作相互独立。尽管这种方法比之前的方法需要更多代码，但它提供了最好的长期可维护性和扩展性，是复杂应用程序的理想选择。\n\
  \n### 从 DDD 视角使用 Panache\n\n为了说明在使用 Panache 时活动记录（Active Record）模式与仓库模式之间的权衡，请考虑以下对比：\n\
  \n- 在 Active Record 方法中（使用 `PanacheEntity`），持久化方法直接嵌入在实体类中。这简化了简单 CRUD 操作的开发，但将领域逻辑与持久化混合在一起，可能违反\
  \ DDD 的关注点分离原则。\n- 仓库模式（使用 `PanacheRepository`）将这些操作委托给单独的类，通过保持实体的纯洁，提高了复杂领域的可维护性。\n\
  \n下表根据生产力、封装性、性能以及与 DDD 原则的结合程度等关键因素，比较了每种方法的优点与权衡。这种对比突显了每种方法如何平衡简单性与可维护性，帮助开发者根据项目的复杂性和长期目标选择最合适的方法。\n\
  \n| 方法 | 生产力 | 封装性 | 定制化能力（新资源、DTO、分层分离） | DDD 结合度 |\n| :--- | :--- | :--- | :---\
  \ | :--- |\n| `PanacheEntityResource` | 非常高（全自动） | 低（直接暴露实体） | 非常有限（与实体紧耦合） | 低（不符合富领域模型）\
  \ |\n| Active Record (`PanacheEntity`) | 高（易于使用） | 中等（持久化与领域逻辑混合） | 中等（允许某些定制但仍有耦合）\
  \ | 中等（嵌入的持久化可能导致领域污染） |\n| 仓库模式 (`PanacheRepository`) | 中等（需要更多代码） | 高（关注点点分离）\
  \ | 非常高（灵活支持 DTO、分层架构和自定义查询） | 高（非常符合富领域模型） |\n\n表 11.1：Quarkus 方法分析\n\n每种方法根据应用程序的复杂性和目标都有不同的用途。`PanacheEntityResource`\
  \ 是快速原型开发和简单 CRUD 应用程序的理想选择，在这些情况下封装性不是主要考虑。Active Record 方法在保持简单性的同时提供了更大的活性，是需要轻量级持久化逻辑应用的极选择。尽管需要更多精力，但仓库模式为可维护、可扩展和领域驱动的应用程序提供了最好的结构。\n\
  \n最终，选择取决于项目需求。`PanacheEntityResource` 或 `PanacheEntity` 对于简单快速的开发很有帮助。然而，对于遵循 DDD\
  \ 的应用程序，带有 `PanacheRepository` 的仓库模式是推荐的方法。这种模式将持久化逻辑与领域分离，使系统对变化更具适应性，同时保持了清晰的业务导向结构。\n\
  \n## 结论\n\n本章探讨了 Quarkus Panache 如何简化 DDD 应用中的持久化，展示了三种具有不同灵活性和维护性水平的方法。我们从 `PanacheEntityResource`\
  \ 开始，这是最自动化的选项，所需精力最少，但将 API 与领域模型紧密耦合在一起。随后，我们检查了 Active Record 方法，由实体管理自身的持久化，它提供了更多的控制，但将领域逻辑与数据库操作混合在一起。最后，我们实现了仓库模式，它将持久化从领域中完全解耦，为\
  \ DDD 应用程序的可维护性和扩展性提供了最好的结构。\n\n每种方法服务于不同的需求，从快速原型设计到结构化的长期开发。虽然 `PanacheEntityResource`\
  \ 和 Active Record 在简单性方面表现出色，但仓库模式为可维护的、业务驱动的应用程序提供了最好的平衡。在这一基础之上，下一章将关注 Java 最佳实践以完善\
  \ DDD 的实现，提供增强可维护性、强制领域边界和改进整体软件设计的策略。\n\n### 记忆要点回顾\n\n- Panache 简化了持久化：它减少了样板代码，并为\
  \ CRUD 操作提供了内置方法。\n- 三种持久化方法：Quarkus 支持 `PanacheEntityResource`、`PanacheEntity`（活动记录）和\
  \ `PanacheRepository`（仓库模式）。\n- `PanacheEntityResource` 最容易使用：它自动生成 REST 端点，但将 API\
  \ 与实体紧密耦合在一起。\n- Active Record (`PanacheEntity`) 平衡了简单性与灵活性：实体处理自身的持久化，减少了对仓库的需求，但混合了领域和持久化逻辑。\n\
  - 仓库模式 (`PanacheRepository`) 确保了关注点分离：它保持领域逻辑独立于持久化，使其成为符合 DDD 应用的最佳选择。\n- 仓库模式的定制化能力最好：它允许使用\
  \ DTO、自定义查询和分层架构。\n- 封装性从 `PanacheEntityResource` 提升到 `PanacheRepository`：方法越结构化，领域模型免受持久化关注问题的保护就越好。\n\
  - 所有方法的性能均保持高水平：Quarkus 高效优化数据访问，但架构选择对可维护性的影响大于原始性能。\n- 根据项目复杂度选择正确的方法：简单的 CRUD\
  \ 应用程序受益于 `PanacheEntityResource` 或 `PanacheEntity`，而复杂应用应使用 `PanacheRepository`。\n\
  - DDD 原则倾向于仓库模式：如果长期可维护性和扩展性是关键，将持久化逻辑分离到仓库是最佳策略。\n\n## 单选题\n\n1. 在 Quarkus 中使用\
  \ `PanacheEntityResource` 的主要优势是什么？\n   a. 它以最少的精力完全自动化 CRUD 操作\n   b. 它允许对数据库查询进行细粒度控制\n\
