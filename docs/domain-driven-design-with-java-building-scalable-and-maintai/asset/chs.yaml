- "# Java 领域驱动设计：基于 DDD 原则构建可扩展且可维护的 Java 应用\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n**献给**\n\
  \n我亲爱的妻子：Poliana\n\n# 关于作者\n\nOtavio Santana 是一位获奖奖的软件工程师和架构师，热于通过开源最佳实践赋能其他工程师，以构建高扩展且高效的软件。他是\
  \ Java 和开源生态系统的知名贡献者，因其工作获得了众多奖项和荣誉。Otavio 的兴趣包括历史、经济、旅行以及精通多种语言，且都伴着极好的幽默感。\n\n\
  # 关于审稿人\n\nKarina Varela 的职业生涯专注于连接和驱动企业级软件的技术。她对大型技术栈、模式和最佳实践有深的理解，特别是在 Java 企业级解决方案领域。这一背景为她构建任务关键型解决方案奠定了坚实基础，从早期的设计阶段到架构定义以及云和容器基础设施平台上的执行。\n\
  \n这种对应用平台的深度专业化结合对开源的积极参与，是她在 Red Hat 和 IBM 参与十多年关键企业解决方案的基础。\n\n作为一名已出版作者和许多社区的活跃贡献者（例如\
  \ SouJava 的协调员），她的工作一直致力于构建健壮的技术并通过开放知识赋能开发者。\n\n这一背景为她最近作为 Aletyx 联合创始人的工作提供了自然基础，在那里，她基于多年的实战经验和开源领导力，构建下一代智能自动化技术。\n\
  \n\n# 前言\n\n长期以来，我一直在各种会议上讨论我最喜欢的话题之一：软件设计和 DDD（领域驱动设计）。像往常一样，我开始问有多少人听过 DDD？答案是一致的，但当我问第二个问题时，票数就发生了变化：你们中有多少人正确地使用\
  \ DDD？答案通常是无人，或者只有少数人。那么，为什么有大量的人知道 DDD，却只有极少数人能正确应用它？为了解决这个问题，我写了这本书来帮助你们。\n\n\
  许多团队在现实项目中有效实施 DDD 时陷入了困难。问题的根源非常简单：尽管这些模式被广泛认可，但它们的目的经常被误解或忽视。本书旨在弥补这一差距，不仅通过解释\
  \ DDD 是什么，还指导如何有效地应用它，从其背后的原理开始。\n\n本书从探索 DDD 存在的基石原因开始。通过理解它的战略原则，开发者可以避免常见的（往往是代价昂贵的）实施错误。许多关于\
  \ DDD 的书籍假设读者已经认同其价值；而这一本退后了一步来建立这种基础理解，结合了其他作者的见解，并用实践示例和真实经验对其进行补充。本书避免了教条主义，将既有理论与现代用例相结合，帮助你根据具体的语境做出更好的设计决策。\n\
  \n为了引导你完成这段旅程，本书分为三个部分。第一部分奠定了 DDD 的战略基础，强调了理解领域、与业务专家协作以及使用边界上下文（bounded contexts）和上下文映射（context\
  \ maps）等概念组织系统的重要性。这一部分特意放在开头，因为掌握战略 DDD 对于防止后期的错位和过度工程至关重要。\n\n一旦建立了该基础，第二部分将转向\
  \ DDD 的战术方面，即设计遇到实现。你将学习如何建模聚合根（aggregates）、封装业务规则，并在各种架构风格（包括单体、微服务和分布式系统）中应用 DDD。这一部分还包含一个专注于测试和验证的章节，帮助你随着时间的推移保持模型的完整性和表达能力。\n\
  \n书的最后总结了所有概念，研究如何使用 Jakarta EE、Spring、Eclipse MicroProfile 和 Quarkus 等工具将 DDD 集成到现实的企业环境中。它还涉及了高级设计实践，包括代码级决策和要避免的反模式。书以对领域故事讲述（domain\
  \ storytelling）的反思结束——这种技术帮助团队建立共同理解，并弥合业务与技术之间的差距。\n\n## 第 1 章：理解领域驱动设计 (ch01.xhtml)\n\
  \n- 旅程从介绍领域驱动设计本身开始——它的历史、动机以及它旨在解决的根本问题。本章通过展示 DDD 如何鼓励技术与业务团队之间的沟通，以及它如何帮助创建既丰富又符合核心领域模型来奠定。\n\
  \n## 第 2 章：战略 DDD 概念 (ch02.xhtml)\n\n- 本章通过探索战略 DDD 概念深化了这种理解。它引入了 DDD 最被忽视的部分和陷阱，即战略层面。事实上，这通常是\
  \ DDD 中最大的错误，我们在这里将探索几个战略 DDD 概念，如边界上下文、映射等。这些工具共同帮助团队管理复杂性并创建更清晰、更有目标的系统。\n\n##\
  \ 第 3 章：战术 DDD 实现 (ch03.xhtml)\n\n- 在这一章中，我们进入战术实现。在这里，DDD 的构建块——实体、值对象、聚合根、服务和仓库——不仅得到了解释，还通过实际的\
  \ Java 代码进行了说明。本章将前几个章节的抽象概念与具体的编程实践联系起来，展示了如何赋予领域逻辑生命，同时保持与基础设施关注点的解耦。\n\n\n\n\n\
  \n## 第 4 章：DDD 应用的测试与验证\n本章自然地讨论了如何通过测试来验证和保护领域逻辑。它不仅了单元测试，还涵盖了使用 `ArchUnit` 和 `jMolecules`\
  \ 等工具进行集成测试和架构验证。它还展示了在 DDD 体系下，测试如何增强领域模型，使其成为“活文档”以及关于业务行为的真理来源。\n\n## 第 5 章：微服务、单体架构和分布式系统中的\
  \ DDD\nDDD 与软件架构无关；事实上，它可以适用于多种架构结构，例如经典且直接的单体架构和分布式系统。本章涵盖了多种架构选择，并解释了如何在 DDD 中使用它们。\n\
  \n## 第 6 章：整合 DDD 与整洁架构（Clean Architecture）\n本章探索了 DDD 与整洁架构之间的协同效应。它没有将它们视为独立的学科，而是演示了它们如何通过强化关注点分离并确保领域逻辑处于核心而相辅相成。你将学习如何构建应用程序，以提高灵活性、可维护性以及领域与外部系统之间清晰的边界。\n\
  \n## 第 7 章：DDD 与数据建模\n数据库是任何现代应用程序的心脏，我们需要考虑 SQL 和 NoSQL 数据库的建模；此外，还要将其与 DDD 结合。处理领域相关的数据建模是本章的核心内容和范围，它研究了两种不同范式（一个来自数据库，一个来自应用）工作的影响。\n\
  \n## 第 8 章：基于 Jakarta EE 的企业级 Java\n本章将讨论引入企业级 Java 领域，重点关注 `Jakarta EE`。它介绍了最新的\
  \ Jakarta 规范（包括 `Jakarta Data`）如何支持友 DDD 设计。\n\n## 第 9 章：基于 Spring 的企业级 Java\n本章介绍了一个如何在\
  \ Spring 平台中使用 DDD 的实战示例，重点关注流行的组件（如 `Spring Data` 和 `Spring Boot`）以及适用于 DDD 的代码结构。\n\
  \n## 第 10 章：Eclipse MicroProfile 与领域驱动设计\n本章介绍了 `Eclipse MicroProfile` 并解释了它如何赋能云原生\
  \ DDD 应用。通过配置、容错和可观测性等功能，`MicroProfile` 帮助开发者构建既具有韧性又以业务逻辑为中心的系统。本章详细讲解了如何在动态环境中构建保持模块化和表达力的应用程序结构。\n\
  \n## 第 11 章：Quarkus 与领域驱动设计\n在本章中，焦点转向 `Quarkus`——一个为高性能和开发者生产力而设计的现代 Java 框架。本章解释了如何使用\
  \ `Quarkus` 扩展、响应式编程和高效的依赖注入，在轻量级、容器化的应用程序中实现 DDD 而不设计质量。\n\n## 第 12 章：DDD 代码设计与最佳实践\n\
  本章关注设计本身。它讨论了维护具有表达力且可持续的代码库的最佳实践，包括如何避免贫血领域模型、何时应用 `Builder` 模式或流式 API，以及如何组织代码以实现长期可读性和协作。它还为负责任地重构和演进领域模型提供了实用建议。\n\
  \n# 第 13 章：最后考虑\n本章是全书的总结，并解释了如何提取战略领域并使用最古老的技术：讲故事来开始实现。这种技术通过以叙事形式视觉化建模流程，使开发者和领域专家达成更紧密的统一。通过讲故事，团队可以发现隐藏的假设，澄清术语，并确保构建的软件真正代表了其所服务的业务。\n\
  \n在全书中，目标是消除 DDD 的神秘感，并为你提供工具和思维，将其应用于真实的 Java 项目中。无论你是从零开始设计系统，还是重构遗留代码库，每一章都旨在帮助你创建能够使用领域语言、并交付真实价值的软件。\n\
