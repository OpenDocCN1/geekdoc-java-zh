  \n`ProductResource` 类作为 REST 层的实现。MicroProfile OpenAPI 注解提供了自动文档文档，使得端点易于发现。通过封装查询、保存和删除产品等操作，保持了职责的清晰分离，防止\
  \ REST 层直接与持久层交互。这种设计提升了可维护性、重用性和可测试性，使得未来适应和扩展系统变得更加容易。\n\n```java\n@ApplicationScoped\n\
  @Path(\"/products\")\n@Tag(name = \"Products\", description = \"Operations related\
  \ to product\")\npublic class ProductResource {\n\n    private final ProductService\
  \ service;\n\n    @Inject\n    public ProductResource(ProductService service) {\n\
  \        this.service = service;\n    }\n\n    @GET\n    @Operation(summary = \"\
  Retrieve a paginated list of products\")\n    public List<ProductDTO> get(@QueryParam(\"\
  page\") @DefaultValue(\"1\") int page,\n                               @QueryParam(\"\
  size\") @DefaultValue(\"10\") int size) {\n        return service.findAll(PageRequest.of(page).size(size),\
  \ Order.by(Sort.asc(\"name\")));\n    }\n\n    @POST\n    @Operation(summary = \"\
  Create a new product\")\n    public ProductDTO insert(ProductDTO product) {\n  \
  \      return service.save(product);\n    }\n\n    @DELETE\n    @Path(\"{id}\")\n\
  \    @Operation(summary = \"Delete a product by ID\")\n    public void delete(@PathParam(\"\
  id\") String id) {\n        service.deleteById(id);\n    }\n\n    @GET\n    @Path(\"\
  {id}\")\n    @Operation(summary = \"Find a product by ID\")\n    public ProductDTO\
  \ findById(@PathParam(\"id\") String id) {\n        return service.findById(id)\n\
  \                .orElseThrow(() -> new WebApplicationException(\"Product not found\"\
  , Response.Status.NOT_FOUND));\n    }\n}\n\n\n### Running the Application\n\n在测试\
  \ API 之前，请确保 MongoDB 数据库正在运行，以便应用程序连接并持久化数据。\n\n要编译并执行应用程序，请运行以下命令：\n\n```bash\n\
  mvn clean package && java -jar target/chapter-10.jar\n```\n\n一旦应用程序运行，开发者可以访问 OpenAPI\
