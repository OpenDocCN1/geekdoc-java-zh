  \ Lightweight Instances for Testing. [`testcontainers.com/`](https://testcontainers.com/)\n\
  9. Elias Nogueira. Base Class Testing Pattern – Why and How to Use. [`eliasnogueira.com/base-test-class-testing-pattern-why-how-to-use/`](https://eliasnogueira.com/base-test-class-testing-pattern-why-how-to-use/)\n\
  10. Testcontainers Documentation. Manual Lifecycle Control with JUnit 5. [`java.testcontainers.org/test_framework_integration/manual_lifecycle_control/`](https://java.testcontainers.org/test_framework_integration/manual_lifecycle_control/)\n\
  \n# 第 5 章 微服务、单体应用和分布式系统中的 DDD\n\n## 引言\n\n考虑这样一个场景：开发团队必须对一个已经在生产环境中并在组织内部使用了多年的遗留应用程序进行现代化。遇到庞大且混乱的代码库的概率很高，这会让你担心会破坏与你可能需要的特定部分修改无关的功能。软件架构当了系统如何增长、适应并满足业务需求的指南。领域驱动设计（DDD）为解决这些挑战提供了一种结构化的方法，特别是在处理复杂领域时。理解业务需求与技术本身同样重要。\n\
  \n\n\n\n\n本章探讨了 DDD（领域驱动设计）如何作为一种战略方法，用于管理反映复杂业务领域的软件系统复杂性。它探索了 DDD 在各种架构风格中的应用，包括单体应用、微服务和其他分布式系统模型，以支持开发功能完备、可维护且可扩展的解决方案。通过实际场景，本章强调了\
  \ DDD 如何帮助做出明智的架构决策，例如评估系统应该保持单体结构还是过渡到微服务架构。\n\n此外，它还讨论了在重构遗留系统时如何应用 DDD 原则，为在保持业务连续性的同时使现有代码库与业务驱动模型对齐提供指导。到本章结束时，读者将清晰地理解在不同架构背景下如何以及何时有效地应用\
  \ DDD，从而做出更具深熟量且符合业务需求的软件设计选择。\n\n## 章节结构\n\n在本章中，我们将探索以下主题：\n\n*   单体架构中的 DDD\n\
  *   微服务架构中的 DDD\n*   对微服务的需求\n*   在分布式系统中应用 DDD\n*   重构遗留代码以符合 DDD 原则\n\n## 技术要求\n\
  \n在本章中，我们将使用 `Java SE` 结合 `jMolecules` 框架探索这些方法。我们的目标是尽可能保持代码与框架无关，因此目前不会依赖任何特定的\
  \ Java 框架：\n\n*   `Java 21`\n*   `Git`\n*   `Maven`\n*   任何首选的 IDE\n\n## 目标\n\n\
  本章旨在探索 DDD 如何应用在不同的架构风格中，从单体应用到分布式系统，包括微服务、事件驱动设计和云原生架构。其目标是提供一种结构化的方法来评估何时使用每种架构、如何在保持业务连续性的同时重构遗留系统，以及如何实施架构治理以防止问题的反复发生。到本章结束时，读者将理解这些决策中涉及的权衡，以及如何在新系统和现有系统中有效应用\
  \ DDD 原则。\n\n### 单体架构中的 DDD\n\n软件架构与设计在实现简单性方面是一场持久的战斗，既要创建易于适应的软件，又要保持谨慎并避免软件腐化（这可能导致代码随着时间的推移变得越来越难以维护）。\n\
  \n正如 George Fairbanks 在 *Just Enough Software Architecture* 中解释的那样，解决方案在于分区、知识和抽象，其中抽象是把大问题拆分为较小问题的关键。这种分而治之的策略自我们面临解决复杂问题的需求以来就一直应用于工程史中。例如，我们可以参考著名建筑的设计和复杂引擎的制造（如蒸汽动力船上的引擎）。在软件行业中，这种策略通常通过分层架构的概念来实现。\n\
  \n软件层就像系统内部的堆栈，每层负责特定的功能。随着你深入堆栈，功能和职责变得越发细致、越详细。一个典型的例子是 `MVC` 架构，它将应用程序分为三个部分：模型（model）、视图（view）和控制器（controller）。这种分离如图所示，减少了一个层与其他层之间的影响并有助于提高解决方案的整体维护性：\n\
  \n![一个包含三个堆叠蓝色框的流程图，标记为 VIEW、CONTROLLER 和 MODER，通过指向下方的虚线箭头连接。背景为白色。 ](img/Figure_5.1.png)\n\
  \n图 5.1：MVC 的表示\n\n为了扩展这一概念，DDD 引入了四个不同层的想法，建议将系统分为四层，每层负责一个特定的区块：\n\n*   **表现层\
  \ (Presentation layer)**：负责向用户展示系统并处理他们的交互。它可以是 Web 页面、移动应用、桌面应用程序或任何其他用户界面表单。用户界面层应该是轻量且简单的，将大多数逻辑和功能委托给应用层。\n\
  *   **应用层 (Application layer)**：协调系统的动作和工作流。它在用户界面和领域层之间进行调解，编排系统支持的用例和场景。这一层应保持轻量且无状态，只持有特定于应用的逻辑。\n\
  *   **领域层 (Domain layer)**：系统的核心，实现本质的业务逻辑和规则。它容了领域模型，封装了实体（entities）、值对象（value\
  \ objects）、聚合（aggregates）、服务以及以领域为中心的组件。领域层是 DDD 发光的地方，因为它关注业务问题的核心，允许模型随着业务需求的增长而自然演进。\n\
  *   **基础设施层 (Infrastructure layer)**：提供系统所需的技术服务和外部组件，如数据库、消息中间件和 API。这一层应该是通用且自适应的，为高层提供支持而不会与它们形成紧密耦合。\n\
  \n> 注意：领域层与表现层隔离，基础设施层也是隔离的。尽管这种分离允许组件独立地替换或升级，但重要的是，在实践中，这种可能会在某些场景可能会可能会破坏，例如，领域实体被标记了基础设施特定的细节（例如\
  \ `JPA` 注解）。虽然遵循书籍建议是理想的，但架构涉及基于上下文的权衡。\n\n图 5.2 展示了这些层如何协同工作的表示：\n\n![一个软件架构层的图表：顶部是表现层，中间是应用层（内部有一个较小的领域层），底部是基础设施层。箭头表示层级之间的流动。\
  \ ](img/Figure_5.2.png)\n\n图 5.2：DDD 层的表示\n\n在组织这些层时，常见的选择是单体应用，即单一统一的软件应用程序，它是自包含且独立于其他应用的。选择单体架构通常是因为它的简单性，在单个组件中处理所有事务可以减少部署、持续集成/持续交付或部署（`CI/CD`）流水线、日志等的复杂性。然而，单体架构的可扩展性（特别是团队的可扩展性）可能会面临挑战。例如，让成千上万名开发者在同一个仓库中工作会导致代码审查、合并和变基出现瓶颈，从而使协作效率低下。\n\
  \n尽管如此，单体并不是一种过时的架构选择。当设计得当时，单体架构可以是可扩展且可维护的。甚至存在一些变体，例如分布式单体和模块化单体。关键在于组织应用程序内部的层和模块，以防止被称为“大泥球”的常见陷阱，即代码变得错综且难以管理。\n\
  \n\n\n\n下图展示了两种模块化单体方法，其中单体内部的边界有助于维护秩序并防止代码腐化。分层单体将应用程序组织成不同的层，例如表示层、应用层、领域层和基础设施层，每一层负责系统的特定方面。这种结构实现了清晰的关注点分离，使得系统更容易理解和维护。相比之下，模块化单体更进一步，在单体内部引入了内部边界，将相关功能分组到模块中，这些模块可以在保留在同一代码库的同时进行独立演进。这种模块化方法允许团队工作更高效，同时减少了代码纠缠的风险。\n\
  \n![比较分层单体和模块化单体架构的图，底部都有蓝色的数据库图标。分层单体具有堆叠的层；模块化单体具有独立的块。](img/Figure_5.3.png)\n\
  \n图 5.3：分层和模块化单体的架构表示表示\n\n为了演示这种方法的应用，我们将使用分层结构创建一个作为单体应用的酒店管理系统，并采用 DDD 原来处理酒店房间预订。我们的第一步是识别领域的战略部分，该部分围绕房间可用性和预订展开。在本书中，我们还将触及如何使用故事技巧从专家那里提取领域知识，我们将在后面的章节中对此进行详细介绍。现在，至关重要的是理解几个塑造我们方法的关键点，如下：\n\
  \n* 酒店领域的核心围绕房间及其可用性展开。\n* 只有在房间可用时，客人才能办理入住。\n* 房间可用性与支付直接挂钩。\n* 退房后，房间必须进行清洁并供下一位客人使用。\n\
  \n我们的目标是让 `Java SE` 尽可能简单且与平台无关。我们不会实现每个功能或集成外部服务。然而，我们将清楚地解释此系统如何适配 `Spring` 和\
  \ `Jakarta EE` 等更复杂的环境，特别是在 `Jakarta` 和 `MicroProfile` 生态系统中，使用如 `Quarkus` 和 `Helidon`\
  \ 等提供程序。这种方法将让你深入地理解如何在各种 Java 上文中有效应用应用 DDD 原则。\n\n我们还将集成 `jMolecules` 来清晰地定义架构中的\
  \ DDD 分层和组件，确保设计的不同方面（如实体和值对象）被显式地表示。此外，我们将利用 `MapStruct` 进行领域与其他层之间的转换，我们稍后会详细介绍这一点。\n\
  \n### 创建领域层并组织包\n\n在构建 Java 项目结构时，通常会围绕包的组织产生讨论，特别是按层包（package by layer）和按功能包（package\
  \ by feature）之间的争论。由于我们应用 DDD，强烈建议按功能组织包。这使代码库与领域模型对齐，并便于以后将领域的部分提取到单独的组件或微服务，我们将在后续章节中探讨这一主题。\n\
  \n我们在应用分层方面的第一个实际步骤是创建一个 `package-info.java` 文件。该文件将作为包的元数据，提供重要的上下文信息。此外，我们应用来自\
  \ `jMolecules` 的 `@DomainLayer` 注解将此包标记为领域层的一部分，如下：\n\n```java\n/**\n* 此包包含代表酒店\n\
  * 预订边界上下文（bounded context）领域模型的类。*/\n\n@DomainLayer\npackage expert.os.books.ddd.chapter04.hotels;\n\
  \nimport org.jmolecules.architecture.layered.DomainLayer;\n```\n\n我们领域的核心是 `Room`\
  \ 概念。为了本章简单起见，我们将客人表示为一个值对象，因为重点不在于支付完成后的客人详细信息。这种极简的方法允许我们专注于房间在酒店内的生命周期，而不会使设计过度复杂。以下代码定义了\
  \ `Room` 实体和 `Guest` 值对象。示例中，只有 `Room` 拥有身份标识，由其房间号表示，房间号在酒店系统中自然地充当唯一标识符。\n\n```java\n\
  import org.jmolecules.ddd.annotation.ValueObject;\nimport org.jmolecules.ddd.annotation.Entity;\n\
  \n@ValueObject\npublic record Guest(String documentNumber, String name) {\n\n}\n\
  \n@Entity\npublic class Room {\n    static final Guest EMPTY_GUEST = new Guest(\"\
  0\", \"EMPTY\");\n\n    @Identity\n    private int number;\n\n    private Guest\
  \ guest;\n\n    public int getNumber() {\n        return number;\n    }\n\n    public\
  \ Guest getGuest() {\n        return guest;\n    }\n\n    public void setGuest(Guest\
  \ guest) {\n        this.guest = guest;\n    }\n\n    public void cleanRoom() {\n\
  \        this.guest = EMPTY_GUEST;\n    }\n\n    public Room(int number, Guest guest)\
  \ {\n        this.number = number;\n        this.guest = guest;\n    }\n}\n```\n\
  \n在这里，`Room` 类作为具有唯一标识符 `number` 的实体存在，而 `Guest` 类是包含基本客人信息（如 `documentNumber` 和\
  \ `name`）的值对象。`Room` 实体维护房间的状态及其当前客人。在客人退房后，将调用 `cleanRoom()` 方法，重置房间状态并通过分配 `EMPTY_GUEST`\
  \ 值对象将其标记为可用。该方法为管理房间可用性提供了一种简单的机制，这是我们领域的核心概念。\n\n这种分层方法不仅围绕领域的核心元素组织代码，而且遵循了 DDD\
  \ 最佳实践，确保我们在构建更多系统组件时，业务逻辑保持整洁、隔离且可扩展。\n\n下一步，我们将介绍存储库（repository），正如在上一章关于 DDD\
  \ 策略中提到的，它代表一个集合，并以领域为中心的方式处理存储交互。数据访问对象（DAO）与 DDD 存储库的关键区别在于它们的关注点。`DAO` 侧重于数据，关注增、查、改、删（CRUD）操作；而\
  \ DDD 存储库以领域为中心，利用领域的通用语言（Ubiquitous Language）为存储操作提供更自然、更面向业务的接口。\n\n判断项目使用的是 `DAO`\
  \ 还是 DDD 存储库模式的最简单方法是检查方法名。`DAO` 方法通常围绕数据库操作，如 `insert`、`update` 和 `delete`。相比之下，DDD\
  \ 存储库将具有与业务领域对齐的方法。例如，在租车系统中，与其使用 `insert` 或 `delete`，存储库可能有 `park`（停车）或 `unpark`（还车）等方法。这种术语的变化反映了领域语言，并表明存储库是作为领域层的一部分而非仅仅是技术数据访问层。\n\
  \n我们的酒店管理系统通过 `Hotel` 实现了存储库。我们也可以将其命名为 `RoomRepository`，这在许多 Java 项目中很常见。尽管如此，`Hotel`\
  \ 的语义选择专注于领域及其业务逻辑，而非底层存储操作。这种区别很重要，因为领域应该驱动整个系统使用的术语。如下面代码所示：\n\n```java\nimport\
  \ org.jmolecules.ddd.annotation.Repository;\nimport java.util.Optional;\n\n@Repository\n\
  public interface Hotel {\n    Room checkIn(Room room);\n    void checkOut(Room room);\n\
  \    Optional<Room> reservation(String number);\n    Long countBy();\n    Optional<Room>\
  \ findEmptyRoom();\n}\n```\n\n\n\n\n在此存储库接口中，我们看到了以领域为中心的方法，如 `checkIn`、`checkOut`\
  \ 和 `reservation`。这些方法与酒店业务保持一致，抽象了数据操作的技术细节，转而关注酒店在现实世界中的行为。例如，`checkIn` 代表将客人分配到房间，而\
  \ `reservation` 则允许我们通过房号预订特定的房间。\n\n我们将探索的下一个类是 `HotelService`，它负责协调存储库与其他服务之间的交互。它遵循\
  \ SOLID 原则，特别是单责任原则。通过将某些逻辑排除在实体之外，该服务类处理复杂的工作流，例如检查可用性、处理支付以及确保房间在退房后得到妥善清洁。\n\n\
  `HotelService` 处理客人入住和退房的关键流程，确保客人在办理入住前完成支付，并与 `payment service` 交互以完成交易。该服务方法封装了\
  \ `Room` 实体不应负责的业务逻辑，保持了关注点的整洁分离。需要注意的是，酒店服务在协调任务时也充当了应用层的角色，但它们本身并不定义业务规则。它负责协调领域对象与外部服务之间的交互。以下是一个简单的示例，在这种情况下，混合这些层是有意义的，但当项目变大时，你可以对层进行隔离：\n\
  \n```java\n@Service\npublic class HotelService {\n\n    private final Hotel hotel;\n\
  \n    private final PaymentService paymentService;\n\n    public HotelService(Hotel\
  \ hotel, PaymentService paymentService) {\n        this.hotel = hotel;\n       \
  \ this.paymentService = paymentService;\n    }\n\n    public Room checkIn(Guest\
  \ guest) {\n        if (hotel.countBy() >= 100) {\n            throw new IllegalStateException(\"\
  Hotel is full\");\n        }\n        var emptyRoom = hotel.findEmptyRoom().orElseThrow(()\
  \ -> new\n        IllegalStateException(\"No empty room\"));\n        paymentService.pay(guest);\n\
  \        emptyRoom.setGuest(guest);\n        return hotel.checkIn(emptyRoom);\n\
  \    }\n\n    public void checkOut(Room room) {\n        Objects.requireNonNull(room,\
  \ \"Room is required\");\n        room.cleanRoom();\n        hotel.checkOut(room);\n\
  \    }\n\n    public Optional<Room> reservation(String number) {\n        return\
  \ hotel.reservation(number);\n    }\n}\n```\n\n在这个 `HotelService` 类中，`checkIn` 方法验证是否有空房，并与\
  \ `PaymentService` 交互以在完成入住前处理客人的支付。`checkOut` 方法确保在客人退房后房间被清洁并恢复到可用状态。这些操作在服务层中进行协调，以保持领域实体仅关注核心业务规则。\n\
  \n最后，我们定义了 `PaymentService` 接口，它如下处理与支付流程的交互：\n\n```java\n@Service\npublic interface\
  \ PaymentService {\n    void pay(Guest guest);\n}\n```\n\n`PaymentService` 抽象了支付的\
  \ own 方式，确保 `HotelService` 能够专注于入住和退房流程，而不会被支付逻辑所困。这使得系统保持模块化且更容易维护，因为不同的服务可以独立演进。\n\
  \n这种结构展示了如何实现一个清晰且模块化的领域模型，其中存储库处理持久化逻辑，而服务在遵循 DDD 原则的同时协调复杂的业务流程。\n\n### 创建应用层\n\
  \n在完成领域层之后，下一步是应用层，它协调业务流的执行，而不嵌入业务规则本身。相反，它利用领域层来实现其目标。应用层负责协调工作流（这些工作流可能跨多个系统或边界上下文），并可以跟踪这些工作流的进度。\n\
  \n如之前提到的，`HotelService` 类承担这种协调角色，将领域逻辑暴露给表示层。在某些情况下，可能需要进一步划分职责，创建一个类来处理领域逻辑，创建另一个类来与表示层交互（例如用例）。这种划分是整洁架构（Clean\
  \ Architecture）的概念，我们稍后会介绍。这种职责划分有助于防止类承担过多的角色，提高可测试性，并遵循单责任原则。然而，过早分离可能会使代码结构过于复杂，因此根据项目的复杂度找到平衡至关重要。\n\
  \n下一层是用户界面（表示）层，它处理来自用户或其他系统的外部请求。例如，在 Web 应用程序中，控制器的主要作用是管理传入的 HTTP 请求并将其转换为应用层可以处理的命令或查询。这一层的设计应该是将领域与用户交互隔离开，确保不会意外违反领域规则。\n\
  \n实现这种隔离的良好策略是使用数据传输对象（DTOs），它们作为用户界面和领域之间的中间媒介。DTO 封装了数据并保证领域实体不会直接暴露给外部世界。DTO\
  \ 的术语可能随架构而异，例如 REST API 中的 `RoomRequest` 和 `RoomResponse`，或者 Jakarta Server Faces\
  \ (JSF) 中的 `RoomBean`。使用 DTO 还允许我们通过排除不应暴露的字段来安全地处理敏感信息。例如，`GuestDTO` 可能会省略密码等敏感数据，你不需要这个字段，只需保留在实体中。\n\
  \n在我们的项目中，我们通过利用 Java records 采用了不可变 DTO，这使得我们的 DTO 简单整洁，同时确保了不可变性。以下是我们的 `GuestDTO`\
  \ 和 `RoomDTO` 示例：\n\n```java\npublic record GuestDTO(String documentNumber, String\
  \ name) {\n}\n\npublic record RoomDTO(int number, GuestDTO guest) {\n}\n```\n\n\
  ### 创建控制器层\n\n下一个部分是控制器，它作为表示层和应用层之间的桥梁。它确保领域与 DTO 直接交互，反之亦然，通过这种转换层维持层之间的隔离。控制器可以实现为\
  \ REST 资源或其他任何用户界面网关，其主要目的是暴露应用服务，同时保持领域逻辑与表示关注解耦。参考以下代码：\n\n```java\n// 暴露应用服务的控制器或资源\n\
  public class HotelController {\n\n    private final HotelService hotelService;\n\
  \n    private final HotelMapper hotelMapper;\n\n    public HotelController(HotelService\
  \ hotelService, HotelMapper hotelMapper)\n    {\n        this.hotelService = hotelService;\n\
  \        this.hotelMapper = hotelMapper;\n    }\n\n    public RoomDTO checkInRoom(GuestDTO\
  \ guestDTO) {\n        var guest = hotelMapper.toEntity(guestDTO);\n        Room\
  \ room = hotelService.checkIn(guest);\n        return hotelMapper.toDTO(room);\n\
  \    }\n\n    public void checkOutRoom(RoomDTO roomDTO) {\n        var room = hotelMapper.toEntity(roomDTO);\n\
  \        hotelService.checkOut(room);\n    }\n}\n```\n\n\n\n\n\n需要注意的是，即使使用像 `MapStruct`\
  \ 这样的映射框架，重命名领域对象或 DTO 中的字段也可能静默地破坏映射器。因此，为这一层编写测试至关重要，以确保重构不会引入问题。以下是使用 `MapStruct`\
  \ 实现的 `HotelMapper` 接口。虽然这是一个简单的 Java SE 实现，但它可以很容易被定义为 Spring 或上下文与依赖注入（CDI）组件，从而能够与\
  \ Spring 和 Jakarta EE 等平台无缝集成。\n\n```java\n@Mapper\npublic interface HotelMapper\
  \ {\n    HotelMapper INSTANCE = Mappers.getMapper(HotelMapper.class);\n    RoomDTO\
  \ toDTO(Room room);\n    Room toEntity(RoomDTO roomDTO);\n    GuestDTO toDTO(Guest\
  \ guest);\n    Guest toEntity(GuestDTO guestDTO);\n}\n```\n\n尽管 `HotelMapper` 类可以被归类为支持组件，但在这种语文中，我们将其视为应用层的一部分，因为它促进了表示层和领域层之间的交互。\n\
  \n### 创建基础设施层\n\n我们在这里讨论的最后一层是基础设施层，它为所有其他层提供技术支持，例如持久化、消息处理或安全性。这一层提供了实现应用业务逻辑并促进其交互所需的各种能力。\n\
  \n除了 `HotelMapper` 之外，基础设施支持另一个例子是 `PaymentService` 的实现，它使用 `CreditCard` 类处理支付。基础设施层可能还会实现\
  \ `Hotel` 仓库，用于存储或检索房间数据。以下是 `CreditCard` 类和基于内存的 `Hotel` 仓库的简单示例：\n\n```java\n\
  public class CreditCard implements PaymentService {\n    private static final Logger\
  \ LOGGER = Logger.getLogger(CreditCard.class.getName());\n\n    @Override\n    public\
  \ void pay(Guest guest) {\n        LOGGER.info(\"Payment with credit card: \" +\
  \ guest);\n    }\n}\n\npublic class MemoryHotel implements Hotel {\n    // 实现类不在本书的范围内\n\
  }\n```\n\n`CreditCard` 类通过记录带有访客详情的支付日志来模拟支付过程，展示了基础设施层如何与领域交互以支持业务操作。`MemoryHotel`\
  \ 类提供了 `Hotel` 仓库的简单内存实现以供演示。然而，在现实世界应用中，它可能会与数据库或外部系统交互。\n\n通过这种结构，我们完成了对构建一个分层、领域驱动系统的基础性回顾，并在领域、应用、表示和基础设施层之间实现了清晰的关注分离。每一层都有其独特的用途，它们之间的隔离确保了系统随着演进而具有的可维护性、可扩展性和可测试性。\n\
  \n我们的项目已经完成。使用 DDD 构建单体应用可以确保结构组织良好且易于维护，每个层都有明确的职责。这种方法通过将领域逻辑与应用的的技术关注点分离，简化了复杂系统的开发。现在我们已经探索了\
  \ DDD 如何在单体架构中工作，我们将重点关注在微服务架构中应用这些原则，在微服务架构中，分布式系统和服务边界等额外挑战也随之而来。\n\n### 微服务架构中的\
  \ DDD\n\n在考虑软件架构时，单体系统在很多情况下仍然是一个有效且行的解决方案。然而，每一个架构决策都涉及权衡，特别是在扩展性方面。单体架构面临的主要挑战之一是团队扩展性。在单个仓库中协调成千上万名开发者会导致巨大的开销，因为时间通常花费在管理合并、变基（rebase）和解决冲突上。此外，随着项目的增长，单体应用的启动时间会增加，特别是在基于\
  \ Java 的反射框架中，更大的代码库需要更多时间来扫描和初始化。\n\n这就是微服务发挥用场的地方。微服务架构将应用程序拆分为更小的、自包含的服务，允许团队在不同的系统部分上独立工作。这种分而治的方法与\
  \ DDD 非常契合，因为 DDD 帮助定义清晰的领域边界，而这些边界边界自然地适合被分离为微服务。通过微服务，你可以隔离系统的最关键部分（如核心业务逻辑），并更高效地分配资源，为独立扩展特定服务提供灵活性。请参考下表进行详细分析：\n\
  \n| 方面 | 单体架构 | 微服务架构 |\n| :--- | :--- | :--- |\n| 团队扩展性 | 由于共享代码库，难以在大规模团队中扩展 |\
  \ 更容易扩展团队，因为每个服务可以由较小的团队拥有 |\n| 启动时间 | 随着应用增长，由于反射和类扫描，启动速度变慢 | 由于服务较小且独立，启动速度更快\
  \ |\n| 部署 | 单一部署单元，大型系统的部署较慢 | 服务独立部署，实现更快速的更新 |\n| 系统复杂性 | 初始复杂度较低，但可能会变成一团大泥球\
  \ | 由于分布式特性，初始复杂度较高 |\n| 通信 | 同一进程内组件之间的直接方法调用 | 需要网络通信（例如 HTTP、gRPC），引入了延迟 |\n\
  | 扩展 | 整个系统扩展，即使只有一个部分需要更多资源 | 单个服务可以被独立扩展 |\n\n表 5.1：微服务和单体架构面临的挑战\n\n随着软件系统复杂性的增加，管理业务领域变得越来越具有挑战性，特别在大规模分布式架构中。DDD\
  \ 为业务领域建模提供了一种战略性方法，这自然地补充了微服务架构。组织通过将 DDD 原则与微服务对齐，可以将复杂系统拆分为更小、更易管理的组件，允许独立开发和部署。\n\
  \nDDD 与微服务之间的协同作用创建了一个镜像业务的灵活、可扩展的结构。DDD 和微服务能够自然契合的原因有以下几点：\n\n*   **限界上下文（Bounded\
  \ contexts）**：在 DDD 中，每个限界上下文为业务逻辑的特定部分定义了清晰的边界。这些上下文可以实现为独立的微服务，确保每个服务专注于特定的领域。\n\
  *   **自主性（Autonomy）**：微服务允许系统的每个部分独立演进，使得更容易适应不断变化的业务需求，而不影响整个系统。\n*   **解耦团队（Decoupled\
  \ teams）**：DDD 鼓励专注于特定领域的自主团队。微服务通过允许团队在独立服务上工作，而无需跨整个应用程序协调更改，从而契合了这一点。\n*   **业务逻辑扩展（Scaling\
  \ business logic）**：通过隔离领域，你可以为需要高性能的核心核心业务服务（如支付处理）分配更强大的资源，而不影响系统的其他部分。\n\n\n\n\
  \n\n- **关注点分离**：每个微服务负责领域的特定部分，降低了单个服务内部的复杂性并提高了可维护性。\n- **独立演进**：每个微服务都可以按照自己的节奏进行演进，允许系统的不同部分进行更新或替换，而不影响其他服务。\n\
  - **更好的资源分配**：可以高效地分配资源，专注于系统最关键的部分，而无需扩展整个单体应用。\n\n例如，在我们的案例中，考虑一个 `PaymentService`，它最初处理信用卡支付，后来扩展到支持如\
  \ `Stripe`、`PayPal` 等第三方提供商。通过将此功能拆分为专用的微服务，我们可以对其进行独立扩展，并添加新的支付提供商，而不会影响系统的其他部分。\n\
  \n虽然微服务在结合 `DDD` 使用时具有明确的优势，但它们也存在固有的挑战，可能会使系统设计和运行复杂化。管理多个独立的服务引入了分布式复杂性，使得维护数据一致性和处理服务间通信变得更具挑战。由于每个服务都需要监控、日志记录和维护，运营开销随之增加。识别并解决这些挑战对于确保向微服务的迁移不会引入比解决的问题更多的问题至关重要。尽管具有这些优势，微服务也面临以下挑战：\n\
  \n- **分布式复杂性**：微服务通过将系统分布在多个服务中引入新层级的复杂性。这可能导致网络延迟、服务发现和通信失败等问题。\n- **数据一致性**：在多个服务之间确保数据一致性比在单体系统中困难。分布式事务和最终一致性模型会引入复杂性。\n\
  - **运营开销**：管理多个服务增加了运营开销，因为每个服务都需要独立的监控、日志记录和维护。\n- **服务间通信**：与单体应用中组件通过进程方法调用进行通信不同，微服务需要基于网络的通信（`HTTP`、`gRPC`），这引入了延迟、复杂性和潜在故障。\n\
  \n谈到微服务时，我们可以发现这种架构能力是演进式架构的自然选择。尽管单体架构在某些情况下仍然有效，但有时将其转换为微服务是有意义的。`DDD` 的核心优势之一是它关注围绕领域本身来组织软件。在探索\
  \ `DDD` 时，类主要是按照按功能分包（package-by-feature）的结构组织的，每个功能都充当一个领域，团队自然会创建与业务对齐的边界，从而在时机成熟时向微服务的迁移更加无缝。\n\
  \n```\ncom.example.hotel.domain\n\n├── reservation\n│   ├── model\n│   │   ├── Guest.java\
  \ // Value Object\n│   │   ├── Room.java // Entity\n│   │   └── ReservationStatus.java\
  \ // Enum or status value\n│   ├── service\n│   │   └── ReservationService.java\
  \ // Domain service\n│   ├── event\n│   │   └── RoomReservedEvent.java // Domain\
  \ event\n│   └── repository\n│       └── Hotel.java // DDD Repository interface\n\
  \n├── payment\n│   ├── model\n│   │   └── PaymentMethod.java // Value Object\n│\
  \   ├── service\n│   │   └── PaymentService.java // Domain service interface\n│\
  \   ├── event\n│   │   └── PaymentConfirmedEvent.java\n│   └── exception\n│    \
  \   └── PaymentDeclinedException.java\n\n└── shared\n    ├── exception\n    │  \
  \ └── BusinessException.java\n    ├── event\n    │   └── DomainEvent.java // Marker\
  \ or base class/interface\n    └── util\n        └── RoomNumberValidator.java\n\
  ```\n\n一个实用的进展是从传统的单体应用开始，逐渐演变为模块化单体。在这个阶段，不同的功能或子领域被隔离到不同的模块中。这种中间结构有助于明确职责、定义集成点并巩固团队对领域的理解。一旦模块之间的边界稳定，并且在业务或技术上需要更大的独立性（例如为了扩展、团队自主性或部署灵活性），这些模块就可以转换为单独的微服务。\n\
  \n这种转变通常会导致发现并实现明确的、边界上下文（bounded contexts），每个微服务封装了业务的特定子领域。例如，考虑一个酒店系统；预订和支付子领域之间可能会出现清晰的划分。其中任何一个都可以进一步发展为自己的边界上下文，能够作为微服务被单独开发和部署。这增强了业务目标与技术架构之间的关系，提高了系统相对于组织的可扩展性。\n\
  \n因此，微服务提供了许多优势，特别是在与 `DDD` 结合时，但它们也引入了复杂性和运营挑战。因此，在迁移之前，仔细评估系统是否真的受益于微服务是。在下一节中，我们将探讨微服务的需求，并帮助评估这种架构是否适用于某个项目。\n\
  \n## 微服务的需求\n\n微服务最近获得了巨大的流行，通常被推崇为构建可扩展、可维护系统的首选方案。然而，与任何架构选择一样，微服务也带有权衡。虽然它们可以提供明确的益处，但它们并不是万能的解决方案，仔细评估它们是否适合你的项目至关重要。\n\
  \n微服务著名作家 Sam Newman 在他的书籍《Building Microservices: Designing Fine-Grained Systems》和《Monolith\
  \ to Microservices: Evolutionary Patterns to Transform Your Monolith》中分享了这一观点。Newman\
  \ 强调，微服务并不意味着是应用程序或初创企业的最佳起点。相反，从单体应用开始可能是一个更务实的选择，使项目在早期阶段保持简单。微服务需要稳健的基础设施、自动化和可观测性流程，这些在早期就会引入显著的复杂性。\n\
  \n例如，如果你还没有自动化部署流水线，微服务可能会变得繁琐，因为每个服务都需要自己的部署过程。同样，可观测性在微服务架构中至关重要。在没有适当的日志记录和追踪的情况下，跨分布式服务识别问题可能会非常耗时且容易出错，特别是在调试涉及多个服务的请求时。这可能需要登录多台机器并手动跟踪请求流，这项任务在时间压力下会变成一场噩梦。\n\
  \n在跳入微服务之前，从单体架构开始是可以的，仅当系统的复杂性和规模确实需要时再拆分为微服务。这种演进的方法允许你的系统在增长的同时，在早期阶段保持可控性，如下表所示：\n\
  \n| 场景 | 何时使用单体架构 | 何时使用微服务 |\n| :--- | :--- | :--- |\n| 团队规模 | 可以容易协作的小型团队 | 需要独立处理系统部分的大型团队\
  \ |\n| 系统复杂度 | 业务需求简单的低复杂度 | 不同领域需要独立演进的高复杂度系统 |\n| 部署自动化 | 无自动化或仅极少 CI/CD 流程 |\
  \ 已建立全自动的 CI/CD 流水线 |\n| 扩展需求 | 全局范围扩展即可 | 特定服务需要独立扩展 |\n| 可观测性 | 对分布式日志和追踪的需求较少\
  \ | 对日志记录、追踪和可观测性有强迫需求 |\n\n\n\n\n\n| 市场上市时间 | 需要快速交付，且不想管理多个服务的开销 | 可以负担早期投入于多个服务的设置和管理的成本\
  \ |\n| :--- | :--- | :--- |\n\n表 5.2: 何时使用微服务以及何时使用单体架构\n\n微服务可以是一种极佳的架构选择，但仅适用于正确的语境。如果你的团队规模较小、业务领域简单，或者你尚未拥有稳健的自动化和监控工具，那么继续使用单体架构可能更好，直到你的系统需要微服务提供的灵活性和扩展性。\n\
  \n软件架构除了单体与微服务这种简单的二元对立之外，还有许多值得探索的内容。分布式系统涵盖了许多模式、挑战和技术，远超这两种方法的范畴。在下一节中，我们将深入探讨在分布式系统中应用\
  \ DDD，探索 DDD 原则如何指导复杂分布式系统的架构，以及在这种更广泛的背景下还需要考虑哪些额外的因素因素。\n\n## 在分布式系统中应用 DDD\n\n\
  在思考分布式系统时，DDD 在单体架构或微服务架构以及各种其他系统架构中都起着至关重要的作用。分布式系统超越了单体与微服务的传统二元对立，DDD 提供了宝贵的工具来组织这些更现代、更分布模式中的复杂领域。\n\
  \n在事件驱动架构中（例如使用 `Kafka` 或 `RabbitMQ` 等消息中间件构建的系统），设计重点在于事件触发业务流程并允许服务进行异步通信。这种方法在分布式系统中特别有价值，因为解耦对于扩展性和韧性至关重要。\n\
  \nDDD 还强调在系统内部使用领域事件，即使在单体或模块化单体架构中也是如此。这些事件代表了业务中的重大发生，并能够在无紧密耦合的情况下促进组件间的通信，从而实现更好的关注点分离。\n\
  \n无论事件是发送到外部系统还是在内部管理，强调领域事件有助于捕捉与领域相关的本质操作和反应。通过清晰定义哪些事件是重要的以及它们如何在边界上下文（bounded\
  \ contexts）或模块中传播，DDD 确保了即使在复杂的分布式架构中，业务逻辑也能保持一致性。\n\n类似的对齐也发生在 Serverless（无服务器）架构中，系统被分解为由特定事件触发的小型无状态函数。Serverless\
  \ 非常适用于需要动态扩展性（系统在不使用时缩减至零）和成本效益的场景。Serverless 非常适合提供季节性类型用例的服务，因为它可以在用户需求增加时处理操作，并在需求降低时通过减少活跃服务来适应。DDD\
  \ 通过确保每个函数都与特定的领域操作绑定，帮助保持对领域的关注。与其将函数视为技术代码单元，不如 DDD 鼓励将它们视为业务操作。每个函数在领域语文中执行一个单一的、有意义的任务。DDD\
  \ 在这种模型中的清晰性确保了即使当扩展性和基础设施管理等基础设施关注点退到背景时，系统仍然保持对业务逻辑关注。\n\n在云原生架构中，扩展和管理韧性的能力至关重要。这些应用程序被设计为模块化，运行在可以处理波动需求的容器化平台上。在这里，DDD\
  \ 提供了一种强大的方法，在基础设施演进和扩展时保持核心业务逻辑的完整性。DDD 对边界上下文（代表特定业务区域的系统部分）的关注，确保了每个云原生服务都有明确的职责，并且可以独立演进而不影响整个系统。即使基础设施动态变化以满足性能需求，领域逻辑仍然保持稳健，允许企业专注于交付价值，而不是管理分布式服务扩展的复杂性。\n\
  \n区分**架构风格**（architectural styles）和**架构模式**（architectural patterns）是非常重要的。前者描述分布式系统的整体结构，而后者指导单个应用程序的内部结构。风格的示例包括事件驱动架构、面向服务的架构\
  \ (SOA) 和 Serverless 设计。这些风格决定了多个服务或应用程序在更广泛的解决方案内部如何交互、通信和扩展。它们影响整个系统的组成和跨环境的部署，通常涉及异步通信、编排或基础设施层面的考虑。\n\
  \n相比之下，架构模式（如单体、微服务和六形架构，也称为端口和适配器架构）关注单个应用程序的内部结构。例如，六形架构强调业务领域与外部接口（如数据库、消息系统或\
  \ Web 控制器）之间的关注点分离。在 във模式中，领域处于核心，并与技术细节隔离开，允许独立演进。DDD 与这种结构契合得很好，因为它强调了分离业务逻辑和清晰定义领域边界的重要性。这种分离在线分布式系统中特别有价值，因为它有助于在技术和接口发生变化时维持一致的领域模型。\n\
  \n最后，许多现代系统采用了混合架构，结合不同的方法以适应特定需求。例如，一个系统可能对核心业务领域使用微服务，但依赖 Serverless 函数处理辅助服务，或使用事件驱动模式来促进组件间的通信。DDD\
  \ 确保即使技术实现涉及多种架构模式，领域模型也保持一致。边界上下文有助于定义系统的哪部分负责什么种职责，确保无论底层基础设施如何构建，领域逻辑都是清晰的。\n\
  \n尽管这些架构是分布式且多样化的，但从应用 DDD 原则来维护整个系统的清晰度和一致性中受益匪浅。虽然领域建模至关重要，但 DDD 的实际价值在于它如何影响团队结构、通信路径和系统边界。通过清晰地定义边界上下文，DDD\
  \ 帮助软件组件与组织的业务能力对齐，使团队能够完全所有特定领域。这种对简化了协调，减少了团队之间的依赖，并培养了更加自主且有效的小组，每个小组专注于业务中一个定义良好的领域。\n\
  \nDDD 在决定何时以及如何开发新的微服务方面也起着战略作用。团队不必根据技术边界过早提取服务，而是可以根据良好的领域边界及其交互模式来做出这些决策。当服务之间需要进行通信时，DDD\
  \ 促进使用有意义的、领域驱动的 API 合约，这些契约在反映共享通用语言（Ubiquitous Language）的同时，尊重每个子域的本地语言。这种清晰性增强了跨团队协作，改进了跨服务边界的治理，并为分布式协调模式（如\
  \ `Saga pattern`）奠定了坚实基础。\n\n\n\n\n\n当我们结束对将 DDD（领域驱动设计）应用于分布式系统的探索时，必须记住，随着系统的演变，你可能会遇到不符合\
  \ DDD 原则的遗留代码。重构这些系统以适应 DDD 方法通常是必要的，以保持你的架构的可维护性和面向未来的适应能力。在接下来的章节中，我们将探索如何重构遗留代码以符合\
  \ DDD 原则，并在不偏离核心业务目标的前提下实现系统现代化。\n\n# 重构遗留代码以符合 DDD 原则\n\n在理想的世界里，我们总是能够从零开始，根据最新的最佳实践和架构原则来设计我们的系统。然而，我们中的大多数人都在与现有系统工作，这些系统往往深层嵌入了遗留代码。这对于企业的核心系统尤为如此，这些系统已经运行了多年，可能无法反映软件架构的最新理念。DDD\
  \ 为这些系统的现代化提供了一种方法，但这需要一种深思熟虑且审慎重构方法。\n\n这一过程中最关键的元素之一是必须制定一套健壮的遗留现代化策略。重构不仅仅是为了改进代码库，更是在保持系统运行的同时，提高其可维护性、可扩展性以及与业务目标的一致性。这种平衡至关重要，因为在大多数情况下，你必须在进行大规模改造的同时维持业务运行。代码必须继续工作，而你又缓慢、小心地将其转换，以更好地反映领域和\
  \ DDD 原则。\n\n在重构时，考虑人为因素至关重要。多年来维护系统的开发者可能已经习惯了现有的代码库，无论这些代码是多么错乱或低效。重大的重构可能会破坏工作流并影响团队士气。某些开发者可能会抵制这些，特别是当他们已经精通当前系统时。克服这一挑战的方法之一是引入架构决策记录（`ADR`）的概念，这种文档可以帮助说明架构变更背后的原因，概述拟议重构的益处和影响。通过数据和清晰的未来路线展示重构背后的逻辑，可以帮助阐明优势并向团队证明他们的顾虑得到了考虑，从而赢得开发团队的支持。\n\
  \n一旦你让团队在重构的必要性上达成共识，下一步就是与利益相关者进行沟通。重构需要时间，利益相关者可能关注的是即时交付物或新功能。为解决技术债争取时间和空间至关重要。通过解释长期利益（例如提高敏捷性、减少错误和提高可扩展性），你可以帮助利益相关者看到这项投资的价值。就处理技术债的时间表或频率达成一致是关重要的，以便使其成为项目持续流程的一部分，而不是一次性的努力。\n\
  \n从技术上讲，重构遗留代码的第一也是最关键的一步是确保所做的任何更改都不会改变系统的现有行为，特别是在业务逻辑方面。这意味着我们需要通过建立测试来保证更改安全性，从而为行为保持不变提供信心。重构是在不影响功能的情况下改变代码的结构，而测试是维持这种平衡的关键。\n\
  \n遗留系统通常测试覆盖率不足，因此在开始任何重大重构之前，构建一套稳固的测试套件至关重要。一旦代码有了良好的测试覆盖，你就可以开始从小规模、增量的步骤进行重构，采取小步子策略以确保如果出现问题，很容易识别问题并回滚到之前的版本。\n\
  \n一次性引入许多更改会使得追踪错误溯到源头变得极其困难。通过增量式工作，你可以确保任何问题都局限在特定的版本或更改集中，最大限度地减少重构过程中产生新问题的风险。在处理任务关键型代码时，这种缓慢、有条理的方法至关重要。\n\
  \n重构遗留系统的下一个基本步骤是确保你正在修复的问题不会再次出现。如果允许混乱的代码库再次变得混乱，那么清理它就没什么意义了。这就是软件架构治理发挥作用的地方。通过建立规则和约束，你可以防止未来的开发者无意中重新引入你正试图解决的问题。像\
  \ `ArchUnit`、`PMD` 和 `Checkstyle` 等工具在这种背景下是非常有价值的。它们允许你在整个项目中执行架构规则、编码标准和最佳实践。例如，如果你的重构部分涉及领域逻辑与基础设施分离，你可以使用\
  \ `ArchUnit` 来确保开发者将来不会无意中将基础设施依赖引入领域层。\n\n归结底，重构遗留代码以符合 DDD 原则不仅需要技术努力，它还需要一种包含人为和技术因素的深思熟虑的策略。系统的现代化涉及构建和维护它的人，而不仅仅是代码本身。花时间在开发团队中建立共识、与利益相关者清晰沟通，并创建一个可持续的技术债处理方法至关重要。只有在解决了这些人为因素之后，你才能转向重构的技术挑战。\n\
  \n重构不仅仅是清理技术债，更是为了制定一个与你业务当前需求相符的长期遗留现代化策略。这样做创建了一个基础，允许系统随着行业演进而演进。这意味着不仅要关注代码，还要团队文化、利益相关者的预期以及将保持系统持续整洁的治理。\n\
  \n展望未来，在遗留系统中应用 DDD 原则通常需要渐进重构，而且它超越了技术层面。现在我们已经探索了如何重构遗留系统，下一步是考虑如何跨整个系统应用这些原则。\n\
  \n## 结论\n\n在本章中，我们探索了 DDD 在各种架构风格（从单体系统到分布式系统）中的应用。我们讨论了 DDD 原则如何指导有效的软件开发。我们研究了采用微服务时涉及的战略决策，以及如何以一种审慎、结构化的方法重构遗留系统，在确保系统持续运行的同时，使其与\
  \ DDD 原则对齐。通过解决重构的技术和人为因素，我们为以领域为核心设计的遗留系统现代化奠定了基础。\n\n在继续之后，我们必须考虑如何将 DDD 与其他架构模式相结合。在下一章中，我们将探索将\
  \ DDD 与整洁架构（Clean Architecture）相结合如何为构建可维护、可扩展的系统创建一个强大的框架，确保你的软件随着业务的演进而保持适应性。\n\
  \n## 重点回顾\n\n- DDD 不限于微服务和单体架构：它在事件驱动、无服务器、云原生和混合架构中都有价值，因为它确保了业务逻辑的清晰。\n- 单体架构仍然是一个选择：它们简化了开发和部署，特别是在自动化和可扩展性要求较低的情况下。\n\
  - 微服务带来了复杂性：它们需要强大的基础设施、部署自动化和可观测性才能发挥作用。\n\n\n\n\n\n# 重构遗留系统\n\n* 重构遗留系统需要策略：必须确保业务的连续性，让团队参与决策，并逐步引入更改以避免中断。\n\
  * 人性因素在重构中至关重要：开发者可能抵制变化，利益相关者在投入现代化努力之前需要看到长期收益。\n* 小步、增量的重构步骤可以防止风险：一次性更改过多会增加引入难以追踪的\
  \ bug 的概率。\n* 架构治理可以防止问题反复出现：如 `ArchUnit`、`PMD` 和 `Checkstyle` 等工具有助于执行最佳实践并防止技术债再次出现。\n\
  * 边界上下文（Bounded contexts）有助于管理分布式复杂性：它们在微服务和事件驱动架构中定义了清晰的服务边界，确保领域对齐。\n* 可观测性对于分布式系统至关重要：如果没有中心化的日志记录和追踪，调试将变得困难且耗时。\n\
  * 使用 DDD 进行现代化不仅仅是技术上的变更：它是一个持续的过程，需要平衡业务需求、技术改进和团队共识。\n\n## 多选题\n\n1. 在单体架构中使用\
  \ DDD 的一个关键优势是什么？\n   a. 它简化了微服务之间的通信。\n   b. 它有助于在组织分层时保持对业务逻辑的关注。\n   c. 它增加了外部依赖的数量。\n\
  \   d. 它减少了对数据库的需求。\n\n2. 下列哪项最好解释了为什么微服务并不总是最佳选择？\n   a. 微服务降低了架构的灵活性。\n   b. 微服务让系统更难扩展。\n\
  \   c. 微服务需要大量的设施和自动化才能进行有效管理。\n   d. 微服务限制了团队添加新功能的能力。\n\n3. 在考虑单体架构中的团队扩展时，主要的挑战是什么？\n\
  \   a. 需要更多的数据库。\n   b. 在大型团队中处理代码合并（merges）和变基（rebases）。\n   c. 创建领域事件的复杂性。\n \
  \  d. 在多个云提供商上部署系统。\n\n4. 哪个工具可以强制架构约束并防止在重构的遗留系统中重新引入错误？\n   a. `Gradle`\n   b.\
  \ `ArchUnit`\n   c. `Maven`\n   d. `Jenkins`\n\n5. 为什么在重构遗留代码时采取小步、增量的步骤很重要？\n \
  \  a. 避免让开发团队产生不满。\n   b. 确保代码行为不变，并且 bug 可以被轻松识别。\n   c. 尽可能减少一次性提交的代码量。\n   d.\
  \ 简化数据库迁移。\n\n6. DDD 如何使分布式系统中的事件驱动受益？\n   a. 通过简化数据库事务。\n   b. 通过定义捕捉有意义业务操作的领域事件并保持对领域逻辑的关注。\n\
  \   c. 通过消除对基础设施代码的需求。\n   d. 通过增加系统复杂性为了更好的控制。\n\n7. 在重构过程中使用 ADR（架构决策记录）的目的是？\n\
  \   a. 记录关于用户界面的决策。\n   b. 帮助向团队传达架构变更并为其理由提供依据。\n   c. 追踪部署过程。\n   d. 减少系统中的类数量。\n\
  \n8. DAO 和 DDD Repository（仓库）的关键区别是什么？\n   a. `DAO` 是领域层的一部分，而仓库是基础设施层的一部分。\n  \
  \ b. `DAO` 专注于数据库操作，而 DDD 仓库使用以业务为中心的语言并关注领域。\n   c. `DAO` 管理领域事件，而仓库处理安全考量。\n \
  \  d. `DAO` 仅用于单体架构，而仓库仅用于微服务。\n\n9. 重构遗留代码以符合 DDD 原则的主要关注点是什么？\n   a. 改变系统的核心功能。\n\
  \   b. 提高系统的性能。\n   c. 在保持行为不变的同时转换代码结构。\n   d. 重写整个系统以匹配最新的技术趋势。\n\n10. 在重构遗留代码时，哪个人的方面是至关重要的？\n\
  \    a. 说服开发者采用新技术。\n    b. 管理团队预期并传达变更的原因，通常使用 `ADR` 等工具。\n    c. 避免对系统架构的任何更改。\n\
  \    d. 确保利益相关者不参与过程。\n\n### 答案\n\n| 题目编号 | 答案选项字母 |\n| :--- | :--- |\n| 1. | b.\
  \ |\n| 2. | c. |\n| 3. | b. |\n| 4. | b. |\n| 5. | b. |\n| 6. | b. |\n| 7. | b.\
  \ |\n| 8. | b. |\n| 9. | c. |\n| 10. | b. |\n\n## 参考文献\n\n1. Newman, Sam. (2020).\
  \ Should I Use Microservices?\n2. Evans, Eric. (2003). Domain-Driven Design: Tackling\
  \ Complexity in the Heart of Software.\n\n# 第 6 章：将 DDD 与洁洁架构集成\n\n## 引言\n可持续系统的设计初就考虑了清晰性和适应性。此外，可以通过结合领域驱动设计（DDD）和洁洁架构（Clean\
  \ Architecture）来管理复杂性，其中 DDD 驱动由业务逻辑驱动的设计，而洁洁架构支持关注点的分离。它们共同帮助开发者创建灵活且可扩展的解决方案。\n\
  \n本节将探索 DDD 和洁洁架构如何协同工作，以及领域建模与架构实践之间的整合如何支持定义良好的层边界及其随而来的收益。这种探索将帮助读者理解如何使用这两种方法设计能够优雅演进并改变他们工作的软件。\n\
  \n## 结构\n在本章中，我们将进一步探讨以下主题：\n* 洁洁架构概述\n* 将 DDD 与洁洁架构结合\n* 为了可维护性构建代码\n\n## 技术要求\n\
  以下是本章使用的工具，我们将使用 Java 21 或更高版本以及任何 IDE：\n* `Java 21`\n* `Git`\n* `Maven`\n* 任何 IDE\n\
  \n## 目标\n本章旨在阐明洁洁架构和 DDD 如何互补以创建可维护、可扩展和适应性强的软件系统。在本章结束时，读者将掌握洁洁架构的原则、依赖规则的重要性，以及如何在领域逻辑与基础设施关注点之间建立清晰分离的结构化软件。此外，他们将学习\
  \ DDD 的领域建模如何契合到洁洁架构的分层方法中，确保核心业务规则与外部依赖隔离开，最终构建出更具韧性且可测试的应用程序。\n\n## 洁洁架构概述\n洁洁架构是一种软件设计哲学，它使系统的核心业务逻辑独立于任何框架或基础设施。它通过\
  \ Robert C. Martin 的书籍《洁洁架构》（Clean Architecture）广为人知，与 Alistair Cockburn 的六边形架构（Hexagonal\
  \ Architecture）密切对齐。这些方法关注于通过分层设计强制执行关注点分离，创建易于理解、测试和随时间维护的系统，从而让开发者了解这种方法的优势。\n\
  \n洁洁架构的核心思想是依赖的方向；依赖关系始终向内流向业务逻辑，确保包含高层策略的内部层不受外部层（更具体的层）更改的影响。内部层与实现细节（如数据库或用户界面）隔离，这些细节位于最外层。\n\
  \n这种设计创建了一个灵活的系统，外部层（如框架或 UI 库）的变化不会影响核心业务逻辑。\n\n洁洁架构通常将系统划分为四个同心层，每层都有特定的角色：\n\n\
  \n\n\n\n- **实体 (Entities)**：这些包含企业级的业务规则，是系统中最抽象的部分。你可以将它们视为领域实体，封装了独立于特定应用程序的核心业务逻辑。\n\
  - **用例 (Use cases)**：这一层包含了特定应用程序的业务规则。用例实现了应用程序的动作，并应该关注单一职责，与 DDD 所说的应用服务紧密对应。\n\
  - **接口适配器 (Interface adapters)**：这一层在用例层和外部系统之间转换数据。它包含了诸如模型-视图-控制器 (`MVC`) 组件，或用于与外部服务交互的网关实现，确保业务逻辑不受特定于基础设施细节的影响。\n\
  - **框架和驱动程序 (Frameworks and drivers)**：最外层，包含数据库、UI 框架或外部 API 等工具。这一层是你实现与外部服务或基础设施进行通信的地方，将其与核心业务逻辑分离开。\n\
  \n下图展示了环形架构：\n\n![整洁架构图，包含多个同心圆，分别标记为 Entities、Use Cases、Interface Adapters 和 Frameworks/Drivers，并列出了\
  \ Controllers、Gateways、Presenters、Devices、DB、Web 和 UI 等示例。](img/Figure_6.1.jpg)\n\
  \n图 6.1：整洁架构插图\n\n依赖规则是该架构的基石：源代码依赖必须指向内部（以同心圆为参考）。这条规则不仅是一项指南，而且是确保架构完整性的基本原则。内层永远不应该感知外层。函数调用、数据格式、数据结构或由外层生成的格式（如数据库模式或\
  \ API 响应格式）不应与内层共享。\n\n遵循这一规则可以确保高层策略与低层细节之间的清晰分离，使得适应新技术或不断演变的业务需求变得更加容易，而不需要大量的重写。\n\
  \n虽然同心圆是一个适当的示意图，但整洁架构并不是僵板的。根据项目的复杂性，你可能需要更多或少的层。这种灵活性使你能够根据特定需求定制架构，始终确保遵循依赖规则，并保护核心业务逻辑免受外层产生不必要的耦合。\n\
  \n现在我们已经探索了整洁架构的结构和指导原则，我们可以探索 DDD 如何融入到这种分层方法中。在下一节中，我们将看到如何将 DDD 丰富的建模能力与整洁架构的关注点分离相结合，从而产生具有高度表现力且对变化适应性的软件系统。\n\
  \n## 将 DDD 与整洁架构结合\n\n在研究六形架构和 DDD 时，显而易见的是它们自然地集成，形成了一个健壮且可维护的设计框架。六形架构（也称为端口和适配器）强调核心应用程序与外部系统的分离，这一原则与\
  \ DDD 的分层紧密一致。具体来说，DDD 的`领域层 (Domain Layer)` 对应于六形中心的核心领域模型。同时，`应用层 (Application\
  \ Layer)` 与协调领域行为的用例或应用服务对应。这种结构上的对应强制了关注点的清晰分离，确保业务规则与用户界面、数据库和其他基础设施组件隔离。\n\n\
  DDD 中的领域层直接对应于六形模型中的`实体 (entities)` 和`聚合根 (aggregates)`。这些代表了系统的核心业务逻辑，不受基础设施或特定框架细节的影响。这种清晰的分离确保了领域保持纯洁并聚焦于业务规则，无论外部系统如何变化。\n\
  \n同样，DDD 中的应用层与六形架构中的用例天然契合。用例代表系统的操作，负责协调业务逻辑但不包含它。它们充当领域模型和外部系统之间的中介，处理输入/输出、验证并调用相应的领域服务。\n\
  \n### 使用整洁架构和 DDD 创建定义良好的边界\n\n为了说明这种结合，我们将继续使用上一章的酒店管理背景。此示例将转换为一个六形模型，同时引入 `jMolecules`\
  \ 框架，特别是 `jmolecules-hexagonal-architecture` 模块。通过利用该模块，我们确保架构遵循清晰的边界，同时保持与 Java\
  \ 无关，允许灵活地集成到你选择的任何 Java 框架中。\n\n我们将保留 `Room`（房间）作为实体，`Guest`（客客）作为值对象，并将 `Hotel`（酒店）作为管理预订和入住/退房的仓库。然而，我们将显著改变\
  \ `HotelService`。\n\n在上一章中，`HotelService` 同时封装了领域逻辑和应用逻辑。虽然这种方法可行，但它混淆了职责，并可能导致违反单一职责原则。整洁架构主张将此类服务拆分为用例，每个类封装了系统必须执行的特定任务的业务逻辑。这种分离不仅提高了可维护性，还增强了可测试性和可重用性。\n\
  \n我们现在不再拥有单一的 `HotelService`，而是有两个不同的用例：一个用于入住，另一个用于退房。这些用例中的每一个封装了一个单一、专注的任务，使代码更容易维护，并确保业务规则得到一致地应用。\n\
  \n`CheckOutUseCase` 处理客人的离开酒店的操作。通过在专用的用例中隔离这种行为，我们确保了逻辑是可重用的，并且可以独立测试。\n\n```java\n\
  import org.jmolecules.architecture.hexagonal.Application;\n\n@Application\npublic\
  \ class CheckOutUseCase {\n\n    private final Hotel hotel;\n\n    public CheckOutUseCase(Hotel\
  \ hotel) {\n        this.hotel = hotel;\n    }\n\n    public void checkOut(Room\
  \ room) {\n        if (room == null) {\n            throw new IllegalArgumentException(\"\
  Room cannot be null\");\n        }\n        room.cleanRoom();\n        hotel.checkOut(room);\n\
  \    }\n}\n```\n\n在这里，`CheckOutUseCase` 仅负责退房过程。清理房间和移除客人的领域逻辑通过 `Room` 实体应用，保持了业务规则的纯洁和隔离。\n\
  \n`CheckInUseCase`协调入住过程，包括检查房间可用性以及通过领域服务处理支付。这种关注点的分离允许用例完全专注于协调工作，同时将领域逻辑委托给适当的服务和实体。\n\
  \n```java\nimport org.jmolecules.architecture.hexagonal.Application;\n\n@Application\n\
  public class CheckInUseCase {\n\n    private final Hotel hotel;\n    private final\
  \ PaymentService paymentService;\n\n    public CheckInUseCase(Hotel hotel, PaymentService\
  \ paymentService) {\n        this.hotel = hotel;\n        this.paymentService =\
  \ paymentService;\n    }\n\n    public Room checkIn(Guest guest) {\n        if (hotel.countBy()\
  \ >= 100) {\n            throw new IllegalStateException(\"Hotel is full\");\n \
  \       }\n        var emptyRoom = hotel.findEmptyRoom().orElseThrow(() -> new\n\
  \        IllegalStateException(\"No empty room available\"));\n        paymentService.pay(guest);\
  \ // 将领域逻辑委托给 PaymentService\n        emptyRoom.setGuest(guest);\n        return\
  \ hotel.checkIn(emptyRoom);\n    }\n}\n```\n\n**提示**：在示例中，我们使用了 `IllegalStateException`，但在这里你可以探索创建异常层次结构。例如，扩展自\
  \ `RuntimeException` 的 `HotelException`，以及扩展自 `HotelException` 的 `HotelFullException`。\n\
  \n\n\n\n在此用例中，办理入住逻辑侧重于业务任务，即确保酒店不会超订、找到空房以及处理支付。支付业务逻辑封装在 `PaymentService` 中，保持了应用层与领域层之间的分的分。\n\
  \n## 在核心应用程序与外部系统之间建立桥梁\n\n将 DDD 与整洁架构（Clean Architecture）结合的下一步是创建在领域模型和外部系统（端口）之间进行翻译的适配器。在这种情况下，我们将使用数据传输对象（DTOs），它们负责在系统边界之间传输数据。这些\
  \ DTO 是简单的、不可变的对象，不包含业务逻辑，使它们成为用例与控制器或 API 等外部接口之间交互的理想选择。\n\n在六边形架构中，适配器充当核心应用程序与外部系统之间的桥梁，翻译请求和响应。适配器可以将来自用户界面或\
  \ API 的输入转换为领域层理解的命令。在我们的案例中，`GuestDTO` 和 `RoomDTO` 充当适配器，在领域对象（例如 `Guest` 和 `Room`）与外部系统之间进行数据转换。\n\
  \n```java\nimport org.jmolecules.architecture.hexagonal.Adapter;\n\n@Adapter\npublic\
  \ record GuestDTO(String documentNumber, String name) {\n}\n\n@Adapter\npublic record\
  \ RoomDTO(int number, GuestDTO guest) {\n}\n```\n\n这些带有 `@Adapter` 注解的 DTO 代表了数据在用例与外部世界之间的流转。它们将内部领域对象（如\
  \ `Room` 和 `Guest`）转换为更适合外部系统的格式（如 API、Web 控制器或其他接口），反之亦然。\n\n在六边形模型中，端口（Port）定义了应用程序与外部世界之间的边界。它代表了应用程序暴露给外部系统的接口，例如控制器、API\
  \ 或其他应用程序。应用程序通过用例与领域交互，而端口将这些用例暴露给外部世界。\n\n在接下来的示例中，我们使用 `HotelController` 作为端口。该控制器是用户交互的入口点，并将业务逻辑委托给相关的用例。\n\
  \n```java\nimport expert.os.books.ddd.chapter06.hotels.CheckInUseCase;\nimport expert.os.books.ddd.chapter06.hotels.CheckOutUseCase;\n\
  import expert.os.books.ddd.chapter06.hotels.Room;\nimport org.jmolecules.architecture.hexagonal.Port;\n\
  \n// 这里我们有一个控制器或资源来暴露应用程序\n@Port\npublic class HotelController {\n    private final\
  \ CheckInUseCase checkInUseCase;\n    private final CheckOutUseCase checkOutUseCase;\n\
  \    private final HotelMapper hotelMapper;\n\n    public HotelController(CheckInUseCase\
  \ checkInUseCase, CheckOutUseCase checkOutUseCase, HotelMapper hotelMapper) {\n\
  \        this.checkInUseCase = checkInUseCase;\n        this.checkOutUseCase = checkOutUseCase;\n\
  \        this.hotelMapper = hotelMapper;\n    }\n\n    public RoomDTO checkInRoom(GuestDTO\
  \ guestDTO) {\n        var guest = hotelMapper.toEntity(guestDTO);\n        Room\
  \ room = checkInUseCase.checkIn(guest);\n        return hotelMapper.toDTO(room);\n\
  \    }\n\n    public void checkOutRoom(RoomDTO roomDTO) {\n        var room = hotelMapper.toEntity(roomDTO);\n\
  \        checkOutUseCase.checkOut(room);\n    }\n}\n```\n\n这种设计确保了领域逻辑保持完好并封装在应用层中，而控制器（端口）负责管理外部交互，而不直接涉及领域实体或逻辑。\n\
  \n因此，以下是我们为了结合 DDD 与整洁架构而创建的所有组件：\n\n*   **领域层 (Domain layer)**：\n    *   `Room`：代表酒店房间的实体。\n\
  \    *   `Guest`：代表顾客的值对象。\n    *   `Hotel`：管理房间入住、退房和预订的仓库接口。\n*   **应用层 (Application\
  \ layer)**：\n    *   `CheckInUseCase`：处理入住逻辑，确保房间可用性和支付处理。\n    *   `CheckOutUseCase`：处理退房逻辑，包括房间清洁和更新仓库。\n\
  *   **适配器 (Adapters)**：\n    *   `GuestDTO` 和 `RoomDTO`：用于在领域与外部系统之间通信数据的 DTO。\n\
  *   **端口 (Port)**：\n    *   `HotelController`：用户交互入口，将任务委托给相应的用例，并在 DTO 与领域实体之间进行数据映射。\n\
  \nDDD 与六边形架构的结合确保了关注点的清晰分离。核心领域逻辑不受基础设施关注点的影响，系统对于未来的变化保持了灵活性。\n\n下一节将探索如何构建可维护的代码结构，讨论在系统演进过程中确保代码保持整洁、模块化和可扩展的策略。这将有助于确保以最小努力实现更改，同时维护架构的完整性和简单性。\n\
  \n## 为了可维护性而构建代码结构\n\n在上一节中，我们看到了 DDD 原则和整洁架构如何影响用例层。影响最显著的改进是将服务拆分为两个不同的用例，这提供了清晰性和易用性。这种方法使应用程序更易理解，并改进了它的文档记录和可测试性。\n\
  \n然而，定义用例并不总是软件设计的起点。虽然将职责拆分到单个用例中有助于可维护性，但在每种场景下，从这项任务开始并不是强制的。\n\n另一个可能的起点是重构，在有稳健测试套件支持的情况下，重构是软件开发中的一种强大工具。重构允许我们随着系统的演进而调整代码，防止软件腐化（代码质量随时间推移而逐渐下降）。\n\
  \n由于业务和产品的变化反映了市场需求，软件领域是不断万变的。在这种环境中，进行重构以维护代码质量并防止在更改时引入不可管理的复杂性至关重要。必须避免过度工程，因为过早添加过多的层或抽象会导致不必要的复杂性，即使初衷是好的。\n\
  \n因此，正如我们之前做的那样，通常更实用的方法是从既作为服务又是应用层的简单服务开始，只有当服务内部的职责开始分散时，才引入额外的层（如用例）。这种方法确保了清晰性和可维护性，在不过度工程的情况下保持代码库清洁。\n\
  \n并不是所有场景都需要拆分为不同的用例。如果特定的业务逻辑在多个操作中具有共同行为，那么维护一个共享服务可能比将其拆分为用例更有意义。例如，`HotelService`\
  \ 可以作为 `CheckInUseCase` 和 `CheckOutUseCase` 共享的通用服务，如下代码段所示：\n\n```java\n@Application\n\
  public class CheckOutUseCase {\n    private final Hotel hotel;\n    private final\
  \ HotelService hotelService;\n}\n\n@Application\npublic class CheckInUseCase {\n\
  \    private final Hotel hotel;\n    private final PaymentService paymentService;\n\
  \    private final HotelService hotelService;\n}\n```\n\n在这种情况下，`HotelService` 组件可以封装两个用例共享的通用逻辑，减少代码重复并保持可维护性。要决定是否使用整洁架构、DDD\
  \ 或两者的结合，你需要按照如下理解各者的目的：\n\n*   **整洁架构 (Clean Architecture)**：侧重于维护不同系统层（UI、业务规则、数据访问等）之间的独立性。它强调解耦，使核心业务逻辑不受框架或外部库的影响。当你需要系统具有灵活性适应性时，它非常有用。\n\
  \n\n\n\n\n- `DDD`: 它是一种解决复杂业务问题的策略方法。它专注于创建一个表示领域的模型，使用实体（entities）、值对象（value objects）、聚合（aggregates）和仓库（repositories）等构建块。在处理复杂领域并需要业务逻辑与软件设计深度集成时，DDD\
  \ 非常有用。\n\n在某些情况下，单独使用洁洁架构（Clean Architecture）是合理的。当主要关注解耦不同的应用程序层（如用户界面、数据访问和业务逻辑）时，洁洁架构是确保灵活性和适应性的理想选择。当业务逻辑并不复杂时，洁洁架构同样有效，允许系统保持与框架无关。它非常适合中小型应用，这些领域的复杂性尚不足以完全使用\
  \ DDD。\n\n另一方面，当领域复杂性很高时，单独使用 DDD 有优势，因为它需要使用实体、值对象和其他丰富的领域构造来构建详细的业务逻辑模型。在策略性领域建模比解耦系统不同层更重要的场景下，这种方法是有益的。此外，当系统必须根据直接反映在代码中的复杂业务规则进行演进时，DDD\
  \ 为管理这种复杂性提供了结构化的方法。\n\n将洁洁架构和 DDD 结合起来为更复杂的系统提供了最平衡的解决方案。当系统层解耦很重要，但业务逻辑也很复杂时，这种组合是必要的。它在具有多个边界上下文（bounded\
  \ contexts）的大型系统中特别有效，其目标是保护核心业务逻辑不受外部依赖的影响，同时通过适当的分层管理应用程序的复杂性。同时使用两者可以确保同时解决维护性和业务逻辑的表达力这两个问题。\n\
  \n### 使用和结合每种方法\n\n我们可以结合这些方法，也可以让它们独立工作。虽然它们结合使用效果更好，但在项目的持续演进过程中，你可以从仅使用 DDD 开始，并在上下文允许合理时添加洁洁架构的分层，如下所示：\n\
  \n- 当解耦和灵活性是主要考虑因素且领域复杂性较低时，使用洁洁架构。\n- 当领域复杂性很高且需要详细的业务逻辑建模时，使用 DDD。\n- 当你需要在平衡层解耦的同时管理复杂的业务逻辑时，同时使用洁洁架构和\
  \ DDD。\n\n下表介绍了这两种方法的视图，说明了何时你可以尝试只使用其中一种，以及最后最佳组合是你可以同时应用两者的情况：\n\n| 维度 | 洁洁架构\
  \ | DDD | 何时同时使用 |\n| --- | --- | --- | --- |\n| 重点 | 解耦系统层（UI、业务规则、数据访问） | 在领域模型中捕捉业务逻辑和复杂性\
  \ | 系统层解耦 + 复杂业务领域建模 |\n| 核心组件 | 应用程序服务；用例，如编排业务逻辑 | 实体、值对象、仓库、服务 | 用于逻辑编排用例 + 用于核心业务复杂的领域实体\
  \ |\n| 独立性 | 业务逻辑独立于 UI、数据库/外部系统 | 软件模型对齐、业务领域和规则 | 业务逻辑独立于外部参与者 + 丰富的领域模型 |\n|\
  \ 复杂性 | 适用于简单的业务 | 处理复杂的业务规则、边界上下文和策略建模 | 最适合既需要关注点分离又需要领域建模的大系统 |\n| 灵活性 | 高灵活性。易于更换框架、UI\
  \ 层或数据库 | 低灵活性。专注于准确捕捉领域 | 框架灵活性 + 丰富且准确的领域 |\n| 测试 | 孤立的用例，更容易测试 | 自包含的领域实体，可测试的领域逻辑\
  \ | 可以同时按层和按功能进行独立测试，支持跨系统的更简单维护和更大扩展性。 |\n| 重构 | 由于层解耦易于重构 | 如果领域模型与基础设施紧密耦合，重构可能更困难\
  \ | 洁洁架构更易重构，DDD 保护了领域逻辑。 |\n\n表 6.1：DDD vs. 洁洁架构\n\n在选择洁洁架构和 DDD 之间时，没有万能的答案。决定取决于领域的复杂性和对系统灵活性的需求。\n\
  \n从更简单的架构开始并随着系统的增长进行演进，这是一种务实的方法，它允许你在简单性和可维护性之间取得平衡。\n\n## 结论\n\n本章探讨了如何将洁洁架构和\
  \ DDD 结合起来以构建可维护的代码结构。我们讨论了将服务拆分为不同的用例如何提高清晰度、简化测试并支持更好的文档。我们还比较了仅有洁洁架构就足够、需要单独使用\
  \ DDD 的场景，以及结合这两种方法如何提供处理复杂系统的强大方式。通过将重构考虑在内并仅在需要时应用分层，我们可以确保软件保持适应性和韧性。\n\n在下一章中，我们将重点关注\
  \ DDD 数据建模的一个关键方面。我们将详细探索如何设计既能准确反映业务逻辑又能保持灵活性简单性的模型。这包括对聚合、仓库以及 DDD 概念与数据库设计的全面讨论。我们的目标是确保数据层与领域对齐，同时支持高效可扩展的操作。\n\
  \n## 记忆点\n\n- `Clean Architecture`洁洁架构：强制分层结构，依赖关系始终指向内部，保护核心业务逻辑不受外部影响。\n- `The\
  \ dependency rule`依赖规则：确保内层独立于外层，防止特定框架细节影响领域逻辑。\n- `Entities layer`实体层：包含企业级业务规则，并在洁洁架构中表示领域模型。\n\
  - `Use cases layer`用例层：编排特定特定的逻辑，而不直接实现领域规则，与 DDD 中的应用程序服务对齐。\n- `Interface adapters`接口适配器：作为核心逻辑和外部系统之间的桥梁，处理数据转换和通信。\n\
  - `Frameworks and drivers layer`框架和驱动层：最外层，包含数据库、API 和 UI 框架等工具，将它们与业务逻辑分离。\n- `DDD\
  \ and Clean Architecture integration`DDD 与洁洁架构的集成：确保业务逻辑保持隔离，同时保持基础设施的灵活和可替换。\n\
  - `Hexagonal architecture (ports and adapters)`六角形架构（端口和适配器）：与洁洁架构自然对齐，支持模块化和可测试。\n\
  - `Decoupling business logic`解耦业务逻辑：通过分离领域关注点技术细节，允许系统在不进行重大重构的情况下进化。\n- `Combining\
  \ Clean Architecture with DDD`将洁洁架构与 DDD 结合：产生既有表现力又能变化的软件设计。\n\n## 选择题\n\n1. 洁洁架构的主要原则是什么？\n\
  a. 依赖关系始终指向外部。\nb. 业务逻辑依赖外部框架。\nc. 依赖关系始终指向内部。\nd. 数据格式在层之间应始终保持相同。\n\n2. 下面不是洁洁架构的典型层？\n\
  a. 实体\nb. 用例\nc. 接口适配器\nd. 控制器\n\n3. 洁洁架构中的哪一层包含系统的核心业务规则？\na. 用例\nb. 实体\nc. 接口适配器\n\
  d. 框架和驱动层\n\n4. 在洁洁架构中，哪一层负责处理与外部系统的通信？\na. 实体\nb. 用例\nc. 接口适配器\nd. 框架和驱动层\n\n\n\
  \n\n\n# 5. 洁洁架构中依赖规则的目的是什么\n\na. 确保外部层依赖于内部层\nb. 允许内部层依赖于外部层\nc. 将 UI 与业务逻辑解耦\n\
  d. 防止内部层感知外部层\n\n# 6. 洁洁架构如何帮助维护系统的灵活性？\n\na. 通过将所有业务逻辑放置在最外层\nb. 通过允许依赖关系同时向内和向外流动\n\
  c. 通过将核心业务逻辑与实现细节隔离开来\nd. 通过将业务逻辑与 UI 和数据库耦合\n\n# 7. DDD 中的哪个概念与洁洁架构中的实体层（entities\
  \ layer）最一致？\n\na. 仓库 (Repositories)\nb. 聚合根 (Aggregates)\nc. 领域实体 (Domain entities)\n\
  d. 值对象 (Value objects)\n\n# 8. 洁洁架构如何确保外层的更改不会影响核心业务逻辑？\n\na. 通过维持没有层的扁平化结构\nb.\
  \ 通过使用依赖规则将内部层与外部层隔离\nc. 通过将所有框架集成到核心层\nd. 通过允许所有层共享访问数据库和 API\n\n# 9. 将 DDD 与洁洁架构结合的主要优势是什么？\n\
  \na. 它减少了应用层对用例的需求。\nb. 它允许业务逻辑和基础设施关注点紧密耦合。\nc. 创建既具有表达力又能对变化产生性的系统。\nd. 它消除了对接口适配器的需求。\n\
  \n# 10. 在一个同时使用 DDD 和洁洁架构的系统中，你预计会在哪里找到特定领域的业务规则？\n\na. 在架构的最外层\nb. 在用例层（use cases\
  \ layer）\nc. 在接口适配器层（interface adapters layer）\nd. 在实体层（entities layer）\n\n### 答案\n\
  \n| 题号 | 选项字母 |\n| :--- | :--- |\n| 1. | c. |\n| 2. | d. |\n| 3. | b. |\n| 4. |\
  \ c. |\n| 5. | d. |\n| 6. | c. |\n| 7. | c. |\n| 8. | b. |\n| 9. | c. |\n| 10. |\
  \ d. |\n\n## 参考文献\n\n1. Evans, Eric. (2003). Domain-Driven Design: Tackling Complexity\
