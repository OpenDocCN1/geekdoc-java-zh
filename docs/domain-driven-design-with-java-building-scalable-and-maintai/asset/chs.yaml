  \n# 第 10 章 Eclipse MicroProfile 与领域驱动设计\n\n## 引言\n\nEclipse MicroProfile 是一个轻量级框架，通过提供一组为云原生应用定制的规范来增强\
  \ Java 微服务。它通过配置管理、健康检查、指标测量和分布式链路追踪等功能扩展了 Jakarta EE 的能力。这些能力与领域驱动设计（DDD）原则高度契合，允许开发者在优化领域模型的同时，满足核心的企业级需求，如低资源消耗（降低成本）、高可扩展性和韧性。\n\
  \n本章将探索如何使用 MicroProfile 来构建遵循 DDD 原则的基于微服务的应用程序。我们将演示如何使用 MicroProfile Config 将基础设施关注点与业务逻辑解耦，以及如何通过最佳实践结构，使领域模型处于架构的核心。通过利用这些特性，开发者可以在领域纯洁性与务实的云原生实现之间取得平衡。\n\
  \n## 结构\n\n在本章中，我们将深入探讨以下主题：\n* 了解 Eclipse MicroProfile 及其目的\n* 将 Eclipse MicroProfile\
  \ 与 DDD 结合\n* 微服务实战示例\n\n## 技术要求\n\n本章将探索 `CDI` 配合 `Helidon` 的用法。相同的概念也可以 `Quarkus`\
  \ 实现。在本章中，我们需要 `Docker` 来运行一个 `MongoDB` 数据库。\n* Java 21\n* Git\n* Maven\n* 任何首选\
  \ IDE\n* Docker\n* MongoDB NoSQL 数据库\n    * 要启动一个新的 `MongoDB` 实例，你可以使用 Docker CLI\
  \ 并运行以下命令：\n\n```\ndocker run -d --name mongodb-instance -p 27017:27017 mongo\n\
  ```\n\n## 目标\n\n本章探索 Eclipse MicroProfile 如何在保持强有力 DDD 方法的同时，增强云原生 Java 微服务的开发。其目标是演示\
  \ MicroProfile 轻量级且模块化的规范（如 `Config`、`OpenAPI` 和 `Jakarta NoSQL`）如何帮助开发者构建可扩展、灵活且结构良好的微服务。到本章结束，读者将理解如何有效地整合这些技术，以创建符合业务需求的、韧性、可维护且松耦合的服务。\n\
  \n## 了解 Eclipse MicroProfile 及其目的\n\nEclipse MicroProfile 是一个轻量级框架，通过提供一组为云原生应用定制的规范来增强\
  \ Java 微服务。它包含了 Jakarta EE 的功能，并使用了配置管理、健康检查、指标测量和分布式链路追踪等功能。这些能力与领域驱动设计（DDD）原则高度契合，允许开发者在优化领域模型的同时，满足核心的企业级需求，如低资源消耗（降低成本）、高可扩展性和韧性。\n\
  \n\n\n\n> 注意：规范之间的代码重复（例如 `Jakarta Config` 和 `MicroProfile Config`）并不是理想的。虽然目标是保持\
  \ Jakarta EE 和 MicroProfile 生态系统的一致性，但目前的局限性导致了具有不同包名的重复代码。这种状况从提交者和用户的角度来看都是次优的，未来应该对其进行改进，以增强内聚性和可用性。\n\
  \n## Eclipse MicroProfile 架构与规范\n\n下图展示了 Eclipse MicroProfile 7 版本的架构和规范。它展示了各种规范在\
  \ MicroProfile 生态系统中如何相互作用，并强调了对 Jakarta EE Core Profile 和独立 MicroProfile 规范的依赖。这种视觉化表示有助于开发者理解框架的结构，以及不同的规范如何处理云原生\
  \ Java 应用的不同需求。\n\n![显示 MicroProfile 7.0 和 Jakarta EE 10 组件的图表，用橙色表示更新的模块，用深蓝色表示未更改的；还显示了独立组件。高亮了\
  \ Config 3.1 和 Core Profile。](img/Figure_10.1.png)\n\n图 10.1：Eclipse MicroProfile\
  \ 版本 7\n\n除了 Jakarta EE 核心配置（core profile）之外，Eclipse MicroProfile 还包含其他关键项目，这些项目主要关注系统的架构和行为（例如微服务）。影响最大的之一的是\
  \ `Eclipse MicroProfile Config`，它允许动态配置管理和配置变量的外部化（如十二因素应用方法所提的）。除了 `Config` 之外，`Metrics`\
  \ 项目也值得探索，因为它提供了开箱即用的应用程序性能和健康洞察，并为定义和暴露应用程序的新指标提供了一种简便的方法。\n\n为了更好地理解 Eclipse MicroProfile\
  \ 的功能，让我们探索它的关键规范，每种规范都旨在解决构建和维护云原生微服务的不同方面：\n\n*   `MicroProfile Config`：遵循十二因素应用方法，为应用程序提供外部化配置。\n\
  *   `MicroProfile Fault Tolerance`：提供弹性机制，如重试、隔离和断路器。\n*   `MicroProfile Health`：定义健康检查以确保服务的可用性。\n\
  *   `MicroProfile Metrics`：通过标准指标实现应用监控。\n*   `MicroProfile OpenAPI`：使用 OpenAPI\
  \ 规范辅助 API 文档。\n*   `MicroProfile OpenTracing`：为微服务提供分布式追踪能力。\n*   `MicroProfile\
  \ JWT Authentication`：启用基于 JSON Web Token 的身份验证。\n*   `MicroProfile Rest Client`：简化微服务之间基于\
  \ HTTP 的通信。\n*   `MicroProfile Reactive Messaging`：支持使用消息系统进行事件驱动通信。\n*   `MicroProfile\
  \ GraphQL`：为 MicroProfile 应用添加对 GraphQL API 的支持。\n\nMicroProfile 的一个关键特性是对其独立规范的支持。虽然它的许多功能基于\
  \ Jakarta EE，但有几个规范可以独立使用。这允许开发者只利用他们需要的，而无需采用整个 Jakarta EE Stack。例如，`MicroProfile\
  \ Config`、`MicroProfile Metrics` 和 `MicroProfile Health` 可以集成到各种 Java 运行时，而不需要 Jakarta\
  \ EE 的组件。这种模块化方法允许团队仅采用 MicroProfile 的核心部分，使其成为微服务和其他轻量部署的灵活选择。\n\n随着进一步探索 Eclipse\
  \ MicroProfile，我们将探讨每个项目如何有助于构建高效、可扩展且可维护的微服务架构。\n\n## 将 Eclipse MicroProfile 与\
  \ DDD 集成\n\n现代软件开发需要可扩展和可维护的架构，同时保持业务逻辑处于核心位置。DDD（领域驱动设计）提供了一种围绕业务领域构建应用程序的方法，确保了清晰性和长期适应性。与\
  \ Eclipse MicroProfile 结合时，开发者获得了强大的工具，可以在分布式、云原生环境中实现 DDD 原则。\n\nEclipse MicroProfile\
  \ 通过提供轻量级规范扩展了 Jakarta EE，解决微服务特有的问题，例如外部化配置、可观测性和弹性。这些功能使团队能够设计专注于业务逻辑并能够处理现代分布式架构复杂性的服务。MicroProfile\
  \ 为实现 DDD 模式提供了灵活的基础，确保技术问题不会掩盖核心领域模型。\n\n虽然 DDD 强调保持领域模型的中心地位，但现实世界的实现通常需要额外的基础设施来支持扩展性、容错和监控。MicroProfile\
  \ 通过关键规范弥补了这一差距，这些规范对 DDD 原则补充如下：\n\n*   `Contexts and Dependency Injection (CDI)`：作为\
  \ MicroProfile 的核心部分，`CDI` 实现了整洁代码设计，强制关注点分离并促进模块化，这对于高效组织领域逻辑至关重要。\n*   `MicroProfile\
  \ Config`：它将配置外部化，保持领域模型的纯洁，允许业务逻辑不受特定环境设置的影响。\n*   `MicroProfile Fault Tolerance`：该功能使用重试、断路器和隔离保护关键领域操作免受故障影响，确保分布式环境中的领域完整性。\n\
  *   `MicroProfile Metrics` 和 `Health`：通过提供领域服务行为的可视性支持可观测性。它帮助团队在影响业务流程之前监控性能并检测异常。\n\
  *   `MicroProfile OpenTracing`：启用跨服务的分布式追踪，使调试领域驱动服务之间的交互变得更容易。\n*   `MicroProfile\
  \ Reactive Messaging`：通过允许服务进行异步通信来支持事件驱动的 DDD 实现，与领域事件对齐并确保一致性。\n\n下表说明了 Eclipse\
  \ MicroProfile 规范如何有助于在微服务环境中实现 DDD。每种规范在维护纯洁领域模型的同时，有效处理配置、弹性和通信等基础设施问题都是至关重要的。通过集成这些功能，MicroProfile\
  \ 允许开发者专注于业务领域，而不会被技术复杂性所困扰。\n\n| MicroProfile 规范 | DDD 益处 |\n| :--- | :--- |\n\
  | `MicroProfile Config` | 通过外部化配置将领域逻辑与基础设施分离。 |\n| `MicroProfile Fault Tolerance`\
  \ | 确保领域服务的弹性，防止故障传播。 |\n| `MicroProfile Health` | 监控领域服务的健康状况，确保系统可靠性。 |\n| `MicroProfile\
  \ Metrics` | 提供领域服务行为的洞察，提高可维护性。 |\n| `MicroProfile OpenTracing` | 启用跨多个微服务的领域交互追踪。\
  \ |\n| `MicroProfile JWT Authentication` | 使用基于角色的访问控制保护领域服务。 |\n| `MicroProfile\
  \ Rest Client` | 简化微服务设置中边界上下文之间的通信。 |\n| `MicroProfile Reactive Messaging` | 支持领域事件传播，实现最终一致性。\
  \ |\n| `MicroProfile GraphQL` | 增强领域聚合根的查询能力。 |\n\n表 10.1：Eclipse MicroProfile 组件\n\
  \n\n\n\n\n通过利用 Eclipse MicroProfile，开发者可以在现代云原生应用中有效应用 DDD（领域驱动设计）原则。强有领域模型与良好集微服务基础设施的结合，确保了业务关注点始终处于核心，同时受益于分布式系统的活性和韧性。\n\
  \n本节将探索如何在实践中应用这些概念。我们将使用具体的示例，演示如何利用 MicroProfile 的功能（例如 `Config`）来构建健壮的、以领域为中心的微服务。我们将看到\
  \ MicroProfile 如何通过实操实现，在真实应用中增强 DDD 原则。\n\n## 微服务实践示例\n\n我们将构建一个管理产品实体的微服务，用以演示如何使用\
  \ DDD 方法有效应用 Eclipse MicroProfile。Helidon 是一个提供 Eclipse MicroProfile 支持的运行时。尽管它支持多个\
  \ Jakarta EE 规范，但它不被认为是像 GlassFish 或 Open Liberty 那种完整的 Jakarta EE 实现。此实现将遵循结构化设计，在领域层、基础设施层应用层之间分离关注点，同时利用\
  \ MicroProfile 的功能（如 `OpenAPI`、`Config` 和 `Fault Tolerance`）。\n\n在持久化方面，我们将使用 `MongoDB`\
  \ 作为数据库，通过 `Jakarta NoSQL` 和 `Jakarta Data` 进行集成，并利用 `Eclipse JNoSQL` 实现。与第 8 章\
  \ 使用 Jakarta EE 企业级 Java 相比，配置上的主要区别在于通过驱动依赖将 `Oracle` 替换为 `MongoDB`，代码如下：\n\n```xml\n\
  <dependency>\n<groupId>org.eclipse.jnosql.databases</groupId>\n<artifactId>jnosql-mongodb</artifactId>\n\
  <version>${jnosql.version}</version>\n</dependency>\n```\n\n我们的微服务将遵循定义良好的结构，强制执行关注点分离，以确保模块化和可维护的架构。这种方法允许系统保持可扩展、可测试，并符合\
  \ DDD 原则，同时在多层有效利用 MicroProfile 的功能：\n\n*   领域层：包含核心业务逻辑和领域实体。\n*   基础设施层：管理数据库交互、外部依赖和配置。\n\
  *   应用层：使用 MicroProfile 特性暴露 RESTful 端点并处理 HTTP 请求。\n\n在设置 `MongoDB` 驱动后，我们还需要更新配置以如下所示定义数据库连接：\n\
  \n```properties\njnosql.mongodb.url=mongodb://localhost:27017\n# 必须定义数据库名称\njnosql.document.database=products\n\
  ```\n\n这是我们遇到的第一个 MicroProfile 规范：`MicroProfile Config`。它允许我们定义可以在不同环境中于修改的配置。例如，在本地运行应用时，可能不需要身份验证，但我们可以在不修改生产环境应用代码的情况下，配置安全凭据。`MicroProfile\
  \ Config` 通过启用外部配置和特定环境覆盖，确保了灵活性和可维护性。\n\n配置就绪后，下一步是定义领域模型。我们将在下一节中引入每个类并解释它们在领域包中的作用。\n\
  \n`Product` 类代表我们领域中的主实体。注意注解 `@Entity`，它使该类成为一个 `Jakarta NoSQL` 文档实体，并将被持久化到 `MongoDB`\
  \ 中：\n\n```java\n@Entity\npublic class Product {\n    @Id\n    @Convert(ObjectIdConverter.class)\n\
  \    private String id;\n\n    @Column\n    private String name;\n\n    @Column\n\
  \    private Manufacturer manufacturer;\n\n    @Column\n    private List<String>\
  \ tags;\n\n    @Column\n    private Set<Category> categories;\n\n    // Getters,\
  \ equals, hashCode, and toString 方法\n}\n```\n\n此类定义了一个具有 ID、名称、制造商、关联标签和类别的产品。它通过引入组合遵循了\
  \ DDD 原则，其中 `Manufacturer` 和 `Category` 类被建模为嵌入对象，而不是独立的实体。\n\n`Manufacturer` 类代表一个值对象，意味着它没有唯一标识，是\
  \ `Product` 文档的一部分。\n\n```java\n@Embeddable(Embeddable.EmbeddableType.GROUPING)\n\
  public record Manufacturer(@Column String name, @Column String address, \n     \
  \                      @Column String contactNumber) {\n}\n```\n\n通过嵌入`制造商详情`，我们避免了不必要的关联并维护了自包含的产品实体。`@Embeddable(Embeddable.EmbeddableType.GROUPING)`\
  \ 注解确保 `Manufacturer` 对象作为子文档存储在 `Product` 文档内部，将相关信息聚合在一起。这与关系型数据库不同，在关系数据库中，嵌入对象通常会被扁平化到同一张表中。如果使用\
  \ `EmbeddableType.FLAT`，则 `Manufacturer` 的字段将直接合并到 `Product` 文档中，而不是分组为子文档。\n\n\
  同样，`Category` 类也是一个值对象，将产品分类在多个类别下。\n\n它被标记为 `@Embeddable(Embeddable.EmbeddableType.GROUPING)`，意味着它的属性将作为子文档存储在\
  \ MongoDB 的 `Product` 文档中。如果使用 `EmbeddableType.FLAT`，其属性将作为主 `Product` 文档的一部分，而不是嵌套结构。\n\
  \n```java\n@Embeddable(Embeddable.EmbeddableType.GROUPING)\npublic record Category(@Column\
  \ String name, @Column String description) {\n}\n```\n\n`ProductRepository` 接口处理数据持久化。它是\
  \ `Jakarta Data` 规范的一部分，该规范提供了一种为 Jakarta 应用定义仓库的标准方法。扩展 `BasicRepository` 可以实现自动的\
  \ CRUD 功能，而无需显式实现，从而实现了简洁且声明式的数据访问方法。\n\n```java\n@Repository\npublic interface\
  \ ProductRepository extends BasicRepository<Product, String> {\n}\n```\n\n在领域模型和仓库准备完成后，下一步是实现应用层。该层使用\
  \ MicroProfile 特性（如 `OpenAPI` 和 `Fault Tolerance`）暴露 RESTful 端点。\n\n作为下一步，我们关注应用层，在暴露领域模型的同时确保其与外部关注点隔离。目标是提供一个清晰的接口，而不让依赖污染领域逻辑。我们使用数据传输对象（DTO）将领域模型与应用层分离来实现这一点。在示例中，我们利用\
  \ `MapStruct` 在实体和 DTO 之间自动转换，减少了手动映射工作并保持代码简洁。\n\n更少的代码简化了开发并提高了可维护性，这是设计清洁架构时考虑的一个重要原则。\n\
  \n这种隔离的另一个方面是独立于领域模型定义 `OpenAPI` 文档。与其直接注解实体（可能会暴露不必要或敏感信息），我们使用 DTO 来精确控制共享的内容。\n\
  \n我们在 `Request` 和 `Response` 对象中使用 DTO 以确保一致性。对于如何处理这一点没有严格的行业标准，开发者采取不同的方法，包括：\n\
  \n*   在请求和响应中使用同一个 DTO 类。\n*   创建单独的 `ProductRequest` 和 `ProductResponse` 类，并在其中封装一个\
  \ `ProductDTO`。\n*   在不同的 `ProductRequest` 和 `ProductResponse` 类中重复字段。\n\n最后一种方案（重复字段）是不推荐的，因为它增加了维护负担而没有产生价值。\n\
  \n`CategoryDTO` 类代表产品的类别，并确保通过 API 仅暴露相关信息如下：\n\n```java\n@Schema(description =\
  \ \"代表产品的类别.\")\n@JsonbVisibility(FieldVisibilityStrategy.class)\npublic class CategoryDTO\
  \ {\n    @Schema(description = \"类别的名称.\")\n}\n```\n\n\n\n\n## ManufacturerDTO\n\
  \n`ManufacturerDTO` 类封装了制造商信息，同时确保只通过 API 共享必要的细节。通过使用此 DTO，我们保持了领域模型的纯洁，并防止了领域相关逻辑无意中暴露给应用层。这种方法通过将外部表示与内部业务逻辑解耦，增强了可维护性和安全性。\n\
