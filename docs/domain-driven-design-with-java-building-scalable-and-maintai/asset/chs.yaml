  \n![QR-Logo](img/fm1.png)\n\n# 第 2 章：战略 DDD 概念\n\n## 引言\n\n开发者主要关注技术实现是很常见的现象，即使在采用领域驱动设计（`DDD`）时也是如此。虽然这种关注至关重要，但它会导致忽视基础性的战略元素，结果导致软件设计不一致且存在缺陷。跳过初始的关键步骤可能会导致整个开发过程走向失败，因为设计可能需要额外的努力才能与核心业务需求和领域复杂度保持对齐。\n\
  \n本章将探索 `DDD` 中经常被忽视但至关重要的方面：战略设计。我们将探索核心概念，如`限界上下文`（bounded contexts）、`上下文映射`（context\
  \ mapping）和`领域事件`（domain events），为有效的 `DDD` 实现奠定基础。\n\n## 结构\n\n在本章中，我们将探讨以下主题：\n\
  \n- 领域和子域\n- 理解限界上下文\n- 上下文映射技术\n- 业务战略与软件设计的对齐\n\n## 目标\n\n本章通过探索如何使用`限界上下文`和`上下文映射技术`来构建复杂的系统，提供对\
  \ `DDD` 的战略性理解。通过在领域内定义清晰的边界并在上下文之间建立有效的关系，开发者可以创建与业务目标保持一致的可扩展和可维护的架构。本章将帮助读者掌握战略性\
  \ `DDD` 原则如何塑造系统设计和团队协作。\n\n## 领域和子域\n\n声称采用 `DDD` 的开发者往往由于对基本目标和流程缺乏理解，而误用了其原则。\n\
  \n对问题领域的全面视角是不可或缺的；它是成功开发的基石。这种理解领域及其子域的初始战略努力是 `DDD` 真正开始的地方。它不是关于跳入代码或选择技术模式，而是让所有参与者对业务达成共识。这包括识别`核心领域`（公司的独特价值所在）、支撑核心业务的支撑子域`以及必要但无差异的`通用子域`。映射这些区域需要领域专家的投入、定义愿景的产品利益相关者以及将这些知识转化为软件的工程师。如果跳过这种协作探索或孤立进行，生成的系统可能在技术上是好的，但与组织的实际需求和目标节节。\n\
  \n理解业务领域及其子域步骤如下：\n\n- 领域包含公司的核心业务，分为特定的子域。\n- 核心子域`将公司与竞争对手区分开来，而`通用子域`在行业内通用，不提供任何竞争优势。\n\
  - `支撑子域`增强了主要业务活动，但没有提供直接的优势。\n\n\n\n\n\n下表通过实际示例比较了三种类型的子域——核心（core）支撑（supporting）和通用（generic）子域，用以说明它们不同的角色。每个子域都可以被视为组织内部的战略部门，以不同的方式推动公司向前发展。该比较强调了两个关键维度：业务逻辑的复杂性和业务差异化程度（后者指的是子域对公司独特价值主张和市场竞争优势的贡献程度）。从这个来看，业务差异化并不是取决于一个子域在内部与其他子域有多不同，而是取决于它对公司在外部脱颖而出有多么关键。尽管所有子域都具有相同的战略权重，但每个对于使组织有效运作并实现其目标都起着至关重要的作用。\n\
  \n| 子域类型 | 角色 | 业务差异化 | 业务逻辑复杂性 | 示例 |\n| :--- | :--- | :--- | :--- | :--- |\n|\
  \ 核心子域 | 公司独特，定义了其身份和竞争优势 | 高 | 高 | 银行的风险评估引擎 |\n| 通用子域 | 可与其他公司通用，属于标准业务活动 | 低\
  \ | 高 | 薪资处理系统 |\n| 支撑子域 | 支持核心业务活动但不提供直接的竞争优势 | 中 | 各异 | 客户服务管理工具 |\n\n表 2.1：子域类型\n\
  \n此表直观地表示了这些子域类型之间的差异，明确了每个对整体架构的贡献。支撑子域和通用子域之间的交集代表了一个灰色区域，根据具体情况，角色可能会重叠。\n\n\
  下图表示了三种子域在业务差异化和业务逻辑复杂性方面的相互作用：\n\n![一张 2x2 矩阵图，显示了业务逻辑复杂性（y 轴从低到高）与业务差异化（x 轴从低到高），并标记了象限：通用、核心、通用/支撑和支撑。](img/Figure_2.1.png)\n\
  \n图 2.1：领域以及业务逻辑与业务差异化\n\n理解领域类型之间的差异对于正确应用战略 DDD 原则来管理业务复杂性至关重要。\n\n### EcoTrack\
  \ Logistics 示例场景\n\n在介绍 EcoTrack 的细节之前，鼓励读者运用他们的分析能力，从业务背景中抽象出领域洞察。目标是根据业务概述中提供的信息，识别核心领域、支撑子域和通用子域。这一练习强化了在现实场景中识别领域边界并理解其各自扮演角色的能力。识别出的子域将在概述之后立即列出以便比较。\n\
  \n考虑一个名为 EcoTrack Logistics 的虚构组织，其成立目的是通过可持续运营来转型物流行业。EcoTrack 的出现源于对绿色运输解决方案日益增长的需求，旨在提供满足并超过行业可持续性标准的环保物流服务。\n\
  \nEcoTrack 运营的核心是环保路线优化系统。这种先进算法通过分析交通状况和天气模式等实时数据，最大限度地减少碳排放和燃料消耗，在竞争激烈的市场中使 EcoTrack\
  \ 脱颖而出。这项创新使 EcoTrack 成为绿色物流的领导者，事实证明其在短短一年内就为一家大型电子商务合作伙伴的交付相关排放减少了 25%。\n\nEcoTrack\
  \ 在标准的车队管理子域下高效管理其车队，支持这一核心创新。该子域处理必要但例行的任务，例如车辆维护调度、GPS 跟踪和司机管理。虽然这些操作在整个行业中都是标准的，但\
  \ EcoTrack 对高效执行这些操作的投入确保了一如既往的高水平服务，强化了公司的卓越运营。\n\n除了物流实力外，EcoTrack 还强调建立强大的客户关系，这些关系通过客户关系管理（CRM）子域进行管理。CRM\
  \ 系统通过提供实时货物跟踪、个性化更新和响应式支持来增强客户满意度。尽管该子域并不驱动物流创新，但它对于维护客户忠诚度和维持业务整体成功至关重要。\n\nEcoTrack\
  \ 通过将其运营结构化为这些不同的子域，专注于在可持续物流解决方案中提供精确和高效。\n\n以下是识别出的领域和子域类型：\n\n*   核心子域：环保路线优化。\n\
  *   通用子域：标准车队管理。\n*   支撑子域：CRM。\n\n下图说明了这种结构以支持对领域的理解：\n\n![一张 EcoTrack 物流流程图，显示三个部分：环保路线优化、标准车队管理和客户关系管理，每个部分都有功能的简要描述。](img/Figure_2.2.png)\n\
  \n图 2.2：环保领域的表示\n\n这家虚构公司提供了一个实用的示例，有助于理解和应用领域及其类型的概念。随着我们继续，下一步将是探索边界上下文（bounded\
  \ contexts）的概念，这将基于我们对领域和子域的理解，并为有效管理领域模型的不同部分提供进一步的清晰。理解边界上下文、语言和领域之间的联系，可以让你通过清晰定义的边界有效地构建结构和管理复杂性。\n\
  \n## 理解边界上下文\n\n在 DDD 中，“领域”（domain）一术指的是问题领域，涵盖了软件解决的具体问题。资深软件匠师、简化软件设计和实现的思想领袖\
  \ Vaughn Vernon 将问题空间（problem space，即识别业务挑战的地方）与解决方案（solution space）区分来。\n\n边界上下文源于通信相关的复杂性。在将领域知识转换为软件时，有效的沟通是不可或缺的。必须建立一种通用语言（Ubiquitous\
  \ Language），以确保所有团队成员、开发者、领域专家和利益相关者彻底理解该领域。这种共享语言随着与领域专家合作获得新见解而演进。\n\n> 提示：在确定项目的通用语言（团队的指南针）时检查你是否处于正确的道路，尝试表述一个业务概念：如果你能清晰地交流它，说明你处于正确的道路上。如果你无法清晰地解释领域中常用的概念，说明你应该与专家合作重新审视领域模型。\n\
  \n\n\n\n\n限界上下文（Bounded context）是一个独特的领域切分，其中`通用语言`（Ubiquitous Language）的特定子集被一致地使用。它是将领域划分为更小、更易管理的部分的方法，每个部分都有由其边界清晰定义的模型和语言。每个限界上下文都有自己的名称，并是`通用语言`的一部分，这简化了对该领域的管理和推理。\n\
  \n限界上下文不需要完全独立；它们通常与其他上下文存在关系。这些关系会影响技术解决方案（系统将如何相互作用）和开发阶段（团队将如何协作）。\n\n识别限界上下文之间关系最简单的方法之一是将它们归类为上游（upstream）或下游（downstream）上下文。将上下文想象成沿河流分布的城市：上游城市影响流向下游的内容。流向下游的某些内容是有价值的，下游城市必须获取它们。这个类比有助于理解变化或信息在上下文之间是如何流动的。\n\
  \n上下文之间的关系可以使用依赖图以图形化的方式表示，其中箭头从下游上下文指向上游上下文，或用上游 `(U)` 和下游 `(D)` 标记它们的角色：\n\n![两张图比较了上游和下游上下文。左图显示了连接上下文的虚线，而右图显示了标记为\
  \ U 和 D 的实线连接两个上下文。](img/Figure_2.3.png)\n\n图 2.3：限界上下文图示例\n\n一旦确定了上下文及其关系，下一步就是决定如何整合它们。这涉及回答以下关键问题：\n\
  \n*   上下文之间将如何进行技术通信？\n*   我们如何映射不同上下文领域模型之间的语言（即从一种`通用语言`翻译成另一种）？\n*   我们如何避免上游发生非意愿或破坏性变化而引起的问题？\n\
  *   我们如何避免在下游上下文中引起问题？\n\n这些问题的答案被汇成上下文映射（context map），如图 2.4 所示。上下文映射可视化地表示了不同的限界上下文如何相互作用，以及用于管理这些交互的策略。\n\
  \n![一个简单的图，包含三个形状：椭圆中的上游上下文，指向矩形中的集成模式，矩形指向另一个椭圆中的下游上下文。](img/Figure_2.4.png)\n\n\
  图 2.4：上下文映射示例\n\n下一节将探索创建有效上下文映射的几种技术，包括共享内核（shared kernel）、客户-供应商（customer-supplier）、顺从（conformist）、反腐层（anticorruption\
  \ layer）、发布语言（published language）、分离方式（separate ways）和开放主机服务（open host service）。这些技术可以作为导航集成和管理多个限界上下文复杂性的工具。\n\
  \n## 上下文映射技术\n\n确定了限界上下文的重要性后，我们现在关注用于管理上下文之间交互和关系的技术。这一过程被称为上下文映射（context mapping），是\
  \ DDD 的关键组成部分，因为它确保了系统不同部分之间定义良好且易于管理的边界和连接。\n\n上下文映射可视化地表示了系统中不同的限界上下文如何相互关联。此映射识别了上下文边界所在，并对这些上下文应该如何通信和整合提供了见解。一个良好的上下文映射使不同系统部分之间的关系显性化，帮助团队避免误解和失调。上下文映射中使用的主要模式和技术如下：\n\
  \n*   **共享内核模式 (Shared kernel pattern)**：当两个团队或上下文需要共享其领域模型的一小部分时发生。这个共享部分（内核）通常是领域中一个极小的、定义良好的子集，两个团队同意共同开发和维护。当上下文之间需要紧密集成时，`Shared\
  \ kernel` 模式非常有用，但由于共同承担责任，必须小心以避免它成为瓶颈。\n*   **客户-供应商模式 (Customer-supplier pattern)**：一个上下文（供应商）提供另一个上下文（客户）消耗的服务或功能。客户有特定的需求和预期，供应商必须确保其服务符合这些要求。这种关系通常需要密切协作，以确保供应商上下文中的更改不会对客户上下文产生负面影响。\n\
  *   **顺从模式 (Conformist pattern)**：当下游上下文（顺从者）被迫遵守上游上下文的模型和决策时产生，即使它更倾向于采用不同的方法。这种模式通常发生在下游上下文对上游上下文几乎没有影响，且必须顺从上游上下文的任何规定时。\n\
  *   **反腐层模式 (Anti-corruption layer (ACL) pattern)**：当一个上下文必须与具有不同或设计不佳模型的另一个上下文交互时使用的防御策略。`ACL`充当保护层，在两个模型之间进行翻译，通过将下游上下文从上游上下文的复杂性或缺陷中隔离来，防止其被污染。在集成无法更改的遗留系统或外部服务时，这种模式至关重要。\n\
  *   **发布语言模式 (Published language pattern)**：涉及为上下文之间的通信创建一个共享语言或协议。这种语言通常是标准化并文档化的，允许不同的上下文以一致且可预测的方式进行交互。`Published\
  \ language` 在多个上下文需要以松耦合的方式交换数据或命令的情况下是有益的。\n*   **分离方式模式 (Separate ways pattern)**：当两个上下文不需要集成时采用。这些上下文独立开发和维护，没有共享模型或通信需求。这种模式通常用于集成两个上下文的成本超过了其收益的情况，允许它们各自独立演进。\n\
  *   **开放主机服务模式 (Open host service pattern)**：提供一个标准化的公共接口，其他上下文可以使用它与特定上下文交互。当一个上下文需要以一致且受控的方式向多个其他上下文提供服务时，这种模式是合适的。通过暴露定义良好的接口，`open\
  \ host service` 模式确保了不同的上下文可以与其交互，而无需理解其内部复杂性。\n\n每个模式都有特定的用途，并提供了一种管理系统中集成多个限界上下文复杂性的方法。模式的选择取决于上下文之间关系的性质、所需的耦合程度以及系统架构的整体目标。\n\
  \n这些上下文映射技术桥接了战略规划和实际实现，塑造了应用程序的不同部分将如何相互作用。每种技术都直接影响系统的集成行为，引导上下文如何通信、交换数据和处理依赖关系。这些映射不是静态的；它们可以随着组织及其需求而演进，在现有的交互不再符合应用程序目标时进行调整。将上下文映射作为实用的蓝图，指导并调整应用程序的架构，使其与组织的结构和预期结果保持一致。\n\
  \n\n\n\n\n精通上下文映射技术对于开发可扩展且可维护的软件系统至关重要。这些方法使各个组件能够在独立演化的同时，保持有效的协同工作。在本章中，我们将深入探讨\
  \ DDD 中的核心概念，例如限界上下文（bounded contexts）和上下文映射技术，说明这些原则如何驱动直接符合业务目标的软件架构。接下来的章节将关注将业务战略与软件设计对齐，以进一步巩固这种一致。\n\
  \n## 将业务战略与软件设计对齐\n\nDDD 的核心原则之一是确保软件架构与整体业务战略紧密一致。这种一致至关重要，因为软件不仅是一种技术工具，更是业务目标和结果的直接实现者。当软件设计反映了业务的战略目标时，它可以快速适应市场变化，简化运营并提供竞争优势。\n\
  \n将软件设计与业务战略对齐的第一步是理解领域。这涉及到深入理解业务的核心流程、挑战和目标。通过识别组织的核心、支持和通用子域，开发者可以优先考虑最需要创新和竞争差异化的领域。将精力集中在核心子域上，可以确保软件反映业务独特的价值主张。通过标准化解决方案处理通用子域可以实现更高效的资源分配。\n\
  \n此外，业务利益相关者与开发者之间的通信至关重要。在领域专家和开发者之间创建一种共享语言——即 `Ubiquitous Language`（通用语言），对于让两个团队都符合业务目标至关重要。这种共同语言减少了误解，并使开发专注于交付价值。\n\
  \n为了有效，这种语言应该被显式地记录为一份动态词汇表，并包含在用户故事、模型名称、API 定义和视觉辅助（如图表）中。这些资源有助于确保整个项目中的清晰度和使用的一致性。\n\
  \n最终，通过将业务战略与软件设计对齐，组织可以创建支持其当前业务并随业务和市场需求增长而演化的系统。这种方法在软件和业务之间建立了共生关系，彼此驱动并支持对方的成功。\n\
  \n## 结论\n\n在本章中，我们涵盖了 DDD 的基本概念，专注于有助于管理复杂性并将软件架构与业务目标对齐的战略元素。我们首先讨论了领域和子域，随后详细探讨了限界上下文以及共享语言的重要性。本章还介绍了上下文映射技术，这对于管理不同系统部分之间的关系、确保每个上下文在保持系统一致性的同时能够独立演化至关重要。\n\
  \n在下一章中，我们将重点从战略 DDD 转向战术 DDD。我们将探索 DDD 的战术实现，提供实际示例和代码来说说明这些概念如何应用于软件开发中，并为您提供在项目中有效应用\
  \ DDD 原则的工具。\n\n## 记忆点\n\n- DDD 中的 `Domain`（领域）指的是问题空间：它代表了软件旨在解决的业务挑战。Vaughn Vernon\
  \ 将其定义为问题空间和一个解决方案。\n- `Bounded context`（限界上下文）定义了清晰的边界：它确保系统的不同部分使用一致的术语和模型，不受其他上下文的干扰。\n\
  - `Ubiquitous Language`（通用语言）是对齐的关键：开发者与领域专家之间的共享语言确保了通信和实现中的清晰性和一致性。\n- `Context\
  \ mapping`（上下文映射）有助于管理集成：它定义了不同的限界上下文如何交互，引导它们之间数据流和依赖关系的处理。\n- `Context mapping\
  \ techniques`（上下文映射技术）反映系统行为：这些技术塑造了应用程序根据业务需求和组织结构进行通信和演化的方式。\n- 限界上下文关系影响设计决策：识别上游下游依赖有助于定义所有权、责任和潜在的集成挑战。\n\
  - `Context boundaries`（上下文边界）在需要时是灵活的：虽然最初被定义，但它们随系统和组织的变化而演变，以更好地适应业务需求。\n\n##\
  \ 多选题\n\n1. DDD 中限界上下文（bounded context）的主要目的是什么？\n   a. 定义系统的物理边界。\n   b. 将数据库与应用程序逻辑分离。\n\
  \   c. 将领域模型拆分为更小、易管理且术语一致的模型。\n   d. 确保所有开发者使用相同的编程语言。\n   e. 管理微服务之间的网络通信。\n\n\
  2. DDD 中的 `Ubiquitous Language`（通用语言）有助于实现什么？\n   a. 在团队中执行严格的编码标准。\n   b. 它确保所有团队成员和领域专家对领域有共同的理解。\n\
  \   c. 它取代了对技术文档的需求。\n   d. 它标准化了用户界面设计。\n   e. 它定义了数据库模式的结构。\n\n3. 在上下文映射中，反腐层（anticorruption\
  \ layer）的作用是什么？\n   a. 防止未经访问数据库。\n   b. 将一个上下文与不同模型的外部系统隔离开。\n   c. 在两个限界上下文之间同步数据。\n\
  \   d. 在限界上下文内部标准化通信协议。\n   e. 管理团队之间的版本控制。\n\n4. 哪种上下文映射模式涉及创建领域模型的一个小型共享子集？\n\
  \   a. Open host service（开放主机服务）\n   b. Conformist（顺从者）\n   c. Shared kernel（共享内核）\n\
  \   d. Separate ways（分离方式）\n   e. Customer-supplier（客户供应商）\n\n5. 如果你很难使用 `Ubiquitous\
  \ Language`（通用语言）解释一个业务概念，你应该怎么办？\n   a. 放弃这个不必要的概念。\n   b. 忽略问题并继续实施。\n   c. 通过删除细节来简化概念。\n\
  \   d. 与领域专家协作以完善语言和模型。\n   e. 用技术术语替换该词。\n\n### 答案\n\n| 题号 | 答案选项字母 |\n| :--- |\
  \ :--- |\n| 1. | a. |\n| 2. | b. |\n| 3. | b. |\n| 4. | c. |\n| 5. | d. |\n\n##\
