  \n# 第 4 章 测试与验证 DDD 应用\n\n## 引言\n\n确保复杂的规则和需求在实践中落地是一项艰巨的任务，对于使用领域驱动设计（DDD）设计的应用程序来说同样充满挑战。自动化测试的实践是确保代码反映预期结果的一种。遗憾的是，当开发者过度关注功能的行为测试时，得到的测试可能缺乏对预期业务逻辑的关键验证，并且无法确保核心领域模型反映了预期的设计。随着时间的推移，这种差距可能会导致偏离\
  \ DDD 原则。采用结构化的方法是确保交付物领域逻辑和整体架构完整性的最佳方式。\n\n掌握有效的测试策略是你扫清障碍并专注于领域模型的方法，这不仅可以发现缺陷，还能在应用程序中强化\
  \ DDD 原则。单元测试对于保护关键组件（如聚合和实体）中的业务逻辑至关重要。可以使用 `ArchUnit` 等技术来确保架构与 DDD 最佳实践保持一致。通过利用测试自动化、集成和代码验证技术，你可以赋予团队自信地创建和演进复杂的\
  \ DDD 应用。\n\n## 结构\n\n在本章中，我们将探讨以下主题：\n\n* DDD 中的测试简介\n* DDD 组件的单元测试\n* 使用 `ArchUnit`\
  \ 进行架构验证\n\n## 技术要求\n\n本章中的示例涵盖了测试，并将依赖 `Java 21+`、`Maven` 以及 `JUnit 5` 和 `AssertJ`\
  \ 等库依赖。\n\n以下是技术要求列表：\n\n* `Java 21`\n* `Git`\n* `Maven`\n* 自选的 IDE\n\n有关库配置的更多信息，请参考本章的\
  \ GitHub 仓库。\n\n## 目标\n\n本章旨在全面理解如何测试和验证 DDD 应用，以确保架构完整性、领域一致性和可维护的代码。通过探索单元测试、集成测试、使用\
  \ `ArchUnit` 进行架构验证以及 `Checkstyle` 和设计模式匹配器 (`PMD`) 等自动化代码验证工具，我们展示了如何在整个开发生命周期中保护\
  \ DDD 原则。此外，我们引入了 `jMolecules` 来增强领域建模的清晰度并强制执行 DDD 标准。在本章结束时，你将拥有知识和工具来有效地测试、验证和维护符合\
  \ DDD 标准的代码库。\n\n## DDD 测试简介\n\n虽然某些开发者可能认为测试是一种负担，但它在 DDD 中的价值不仅在于发现 Bug，还扩展到开发的多个方面。例如，一个健壮的测试套件在代码库和领域模型变化时充当了安全网。它允许在面对变化的业务需求时充满信心地交付，防止对代码库和相关业务规则的影响。\n\
  \nDDD 测试的力量在于它能够支持战术和战略性设计元素。在战术层面，单元测试验证领域构建块（如 `aggregates`、`entities` 和 `value\
  \ objects`）的行为，确保领域的行为反映了预期结果。这些测试还可以作为文档的活动版本，因为可以使用通用语言（Ubiquitous Language）使用领域特定术语来命名或描述测试。在战略方面，测试验证了边界上下文（bounded\
  \ contexts）之间的限制和交互，提供了边界定义、管理和跨通信的高完整性。\n\n下一节介绍了对 DDD 组件（如聚合和实体）进行单元测试的实用技术，并学习如何构建反映领域业务逻辑的测试。\n\
  \n## DDD 组件的单元测试\n\n开发者认为的最重要但也最具挑战性的能力之一，是能够理解并将业务需求转换为可运行的软件。通过一个实践示例，我们将探索使用结构化领域组件构建基础的力量，以及它是如何简化维护性并提高应用程序中领域完整性的。在实现客户忠诚计划的过程中，我们将依赖一个简化的项目来学习核心\
  \ DDD 组件，如 `value objects`、`entities` 和 `aggregates`。首先，介绍一个简单的客户忠诚计划领域模型，以说明积分累积和状态演进，客户可以通过购买获得积分，并通过不同的忠诚度类别（青铜、银色、金色和铂金）获得升级。每个类别都提供越来越好的福利，例如折扣。\n\
  \n下表提供了我们将详细探讨的领域模型组件概述。在这些组件中，`value objects` 在表达没有身份的概念时至关重要，纯粹关注它们的属性。在实现中，特别强调了它们的不可变性（immutable\
  \ nature），这通过防止意外的副作用确保了领域模型的清晰和预测性。另一个关键特征是等性检查基于属性值集合的，这意味着如果两个实例的所有属性都相等，则它们被认为是相等的。这种行为符合值对象代表领域的描述性方面而非被跟踪的实体的原则。\n\
  \n| 组件 | DDD 模式 | 类型 | 属性 |\n| --- | --- | --- | --- |\n| `LoyaltyPoints` | 值对象\
  \ | record | `int points` |\n| `Customer` | 值对象 | record | `String nameString email`\
  \ |\n| `CustomerCategory` | 值对象 | enum | `int pointsThresholdint discountPercentage`\
  \ |\n\n| `LoyaltyCard` | 聚合根 | class | `String idCustomer customerLoyaltyPoints\
  \ loyaltyPointsboolean isPremiumCustomerCategory category` |\n| `LoyaltyCardRegistration`\
  \ | | class | `String idCustomer customerLocalDate registrationDateCard status`\
  \ |\n\n表 4.1：单元测试中的组件\n\n现在，让我们看看每个模型的实现方面，从值对象开始。\n\n### 定义领域组件\n\n首先，检查 `LoyaltyPoints`\
  \ 的领域模型，这是一个代表客户累积积分数的值对象，如下代码所示：\n\n注意：`LoyaltyPoints` 是一个不可变对象。一旦创建，无法修改。添加新积分的唯一方法是创建\
  \ `LoyaltyPoints` 的新实例。\n\n```java\n// 代表累积积分的值对象\npublic record LoyaltyPoints(int\
  \ points) {\n\n    public LoyaltyPoints addPoints(int additionalPoints){\n\n   \
  \     return new LoyaltyPoints(this.points + additionalPoints);\n    }\n\n    public\
  \ boolean canUpgradeToPremium() {\n\n        return this.points >= 1000;\n\n   \
  \ }\n\n}\n```\n\n接下来，我们有 `Customer` 模型，它也是一个值对象。\n\n```java\n// 持有客户信息的值对象\npublic\
  \ record Customer(String name, String email) {}\n```\n\n| 注意：客户的身份标识（例如证号）与忠诚计划本身无关。该身份标识相反，该类的唯一标识符是名称和电子邮件的组合。\
  \ |\n\n\n\n\n\n我们将看到的下一个值对象是 `CustomerCategory`。这个 `Enum` 封装了忠诚度等级（铜牌、银牌、金色和铂金）、相关的阈值以及相应的折扣比例。`Enum`\
  \ 之成为该组件的完美选择，是因为它既满足预定义这些值的需求，又能够以不可变的方式提供它们。遵循相同的模式，`CustomerCategory` 值对象的相等性完全基于它的属性、积分阈值和折扣比例。\n\
  \n```java\n// 带有忠诚度等级、阈值和折扣的值对象\n\npublic enum CustomerCategory {\n    BRONZE(0,\
  \ 0),\n    SILVER(1000, 5),\n    GOLD(5000, 10),\n    PLATINUM(10_000, 15);\n\n\
  \    ...\n\n    private final int pointsThreshold;\n    private final int discountPercentage;\n\
  \n    ...\n\n    public static CustomerCategory getCategoryByPoints(int points)\
  \ {\n        if (points >= PLATINUM.pointsThreshold) {\n            return PLATINUM;\n\
  \        } else if (points >= GOLD.pointsThreshold) {\n            return GOLD;\n\
  \        } else if (points >= SILVER.pointsThreshold) {\n            return SILVER;\n\
  \        } else {\n            return BRONZE;\n        }\n    }\n}\n```\n\n接下来的代码检查了忠诚度计划的聚合根\
  \ `LoyaltyCard`：\n\n```java\npublic class LoyaltyCard {\n    private final String\
  \ id;\n    private final Customer customer;\n    private LoyaltyPoints loyaltyPoints;\n\
  \    private boolean isPremium;\n    private CustomerCategory category;\n    ...\n\
  }\n```\n\n注意：与值对象不同，`LoyaltyCard` 是一个实体，它具有唯一标识（例如通过卡 ID），并且其状态会随着客户购买、积累积分以及提升不同的忠诚度等级而演变。`LoyaltyCard`\
  \ 封装了业务规则，例如添加积分、判断客户是否符合高级状态以及升级其等级。作为聚合根，`LoyaltyCard` 确保了聚合内部各相关组件的一致性。\n\n最后，`LoyaltyCardRegistration`\
  \ 是一个聚合根，作为一个专注于忠诚卡本身生命周期的实体。它跟踪元数据，如注册日期和卡片状态（激活、非激活、挂起）。虽然它不直接管理积分或等级，但它在定义客户与计划的互动方面起着重要作用。\n\
  \n```java\npublic class LoyaltyCardRegistration {\n    private final String id;\n\
  \    private final Customer customer;\n    private final LocalDate registrationDate;\n\
  \    private CardStatus status;\n    ...\n}\n```\n\n通过细致地建模这些组件，我们建立了一个反映忠诚度计划业务规则的整洁领域模型。每个组件在系统中都扮演着明确的角色，值对象封装了不可变的领域值，而\
  \ `LoyaltyCard` 则作为聚合根强制执行相关组件之间的业务一致性。\n\n### 使用测试来验证预期行为\n\n在创建类之后，逻辑上的下一步是定义如何验证行为，并确保领域按预期方式工作。我们将从引入具有强大机制来结构化测试的测试库开始：\n\
  \n*   `JUnit 5` (Jupiter) 提供了编写、组织和运行单元测试的高级功能，支持一系列注解和自定义配置、参数化测试、测试生命周期管理等。\n\
  *    `AssertJ` 是一个流式 API，增强了测试的可读性和表达力。`AssertJ` 也可以作为 Jupiter 的组合使用，允许测试中保持自然的流向。\n\
  \n为了测试 `CustomerCategory`，我们可以遵循测试命名规范开始构建测试类：测试方法以 `should` 前缀开头并描述预期的行为。此外，`@DisplayName`\
  \ 注解以人类可读的格式提供领域上下文，确保测试验证并记录了业务规则。让我们也利用 Jupiter 的一个名为参数化测试的功能来使用数据驱动测试 (DDT)。\n\
  \nDDT 是一种以测试逻辑与数据之间有清晰分离来设计测试的方法论。其优势是可以使用不同的输入来测试相同的逻辑，这种行为源于可以使用外部数据源（如电子表格、数据库和\
  \ CSV 文件）或内联参数的能力。这种做法使得测试更加灵活且可复用，确保了对多种场景的全面覆盖。\n\n观察以下代码以及 `@ParameterizedTest`\
  \ 的用法，并注意它是如何直接作为参数注入 `@ValueSource` 注解中的数据。通过参数注入的数据将用于验证测试。\n\n```java\nimport\
  \ org.junit.jupiter.api.DisplayName;\nimport org.junit.jupiter.params.ParameterizedTest;\n\
  import org.junit.jupiter.params.provider.ValueSource;\nimport static org.assertj.core.api.AssertionsForClassTypes.assertThat;\n\
  \npublic class CustomerCategoryTest {\n\n    @ParameterizedTest\n    @ValueSource(ints\
  \ = {-20, -10, 0, 500, 999}) // 内联数据参数\n    @DisplayName(\"should return Bronze\
  \ category for points less than 1000\")\n    void shouldReturnBronzeCategoryForPointsBelow1000(int\
  \ points) {\n        CustomerCategory category = CustomerCategory.getCategoryByPoints(points);\n\
  \        assertThat(category).isEqualTo(CustomerCategory.BRONZE);\n    }\n\n   \
  \ @ParameterizedTest\n    @ValueSource(ints = {1000, 2000, 4999}) // 内联数据参数\n  \
  \  @DisplayName(\"should return Silver category for points between 1000 and 4999\"\
  )\n    void shouldReturnSilverCategoryForPointsBetween1000And4999(int points) {\n\
  \        CustomerCategory category = CustomerCategory.getCategoryByPoints(points);\n\
  \        assertThat(category).isEqualTo(CustomerCategory.SILVER);\n    }\n\n   \
  \ @ParameterizedTest\n    @ValueSource(ints = {5000, 6000, 9999}) // 内联数据参数\n  \
  \  @DisplayName(\"should return Gold category for points between 5000 and 9999\"\
  )\n    void shouldReturnGoldCategoryForPointsBetween5000And9999(int points) {\n\
  \        CustomerCategory category = CustomerCategory.getCategoryByPoints(points);\n\
  \        assertThat(category).isEqualTo(CustomerCategory.GOLD);\n    }\n\n    @ParameterizedTest\n\
  \    @ValueSource(ints = {10000, 15000}) // 内联数据参数\n    @DisplayName(\"should return\
  \ Platinum category for points 10000 or more\")\n    void shouldReturnPlatinumCategoryForPoints10000More(int\
  \ points) {\n        CustomerCategory category = CustomerCategory.getCategoryByPoints(points);\n\
  \        assertThat(category).isEqualTo(CustomerCategory.PLATINUM);\n    }\n\n \
  \   @ParameterizedTest\n    @ValueSource(ints = {5}) // 内联数据参数\n    @DisplayName(\"\
  should return correct discount for Silver category\")\n    void shouldReturnCorrectDiscountForSilverCategory(int\
  \ expectedDiscount) {\n        CustomerCategory category = CustomerCategory.SILVER;\n\
  \        assertThat(category.discountPercentage()).isEqualTo(expectedDiscount);\n\
  \    }\n\n    @ParameterizedTest\n    @ValueSource(ints = {5000}) // 内联数据参数\n  \
  \  @DisplayName(\"should return correct points threshold for Gold category\")\n\
  \    void shouldReturnCorrectPointsThresholdForGoldCategory(int expectedThreshold)\
  \ {\n        CustomerCategory category = CustomerCategory.GOLD;\n        assertThat(category.pointsThreshold()).isEqualTo(expectedThreshold);\n\
  \    }\n}\n```\n\n前面的测试包含了多种定义，用于验证 `CustomerCategory` `Enum` 及其多个忠诚积分阈值和折扣。观察测试并不是为了验证枚举是否工作，而是为了确保背后的业务逻辑正确反映了多种业务场景的需求。\n\
  \n接下来，让我们应用类似的方法测试 `LoyaltyPoints` 实体，其中不可变性和积分管理的准确性是不可或的：\n\n```java\nimport org.junit.jupiter.api.DisplayName;\n\
  import org.junit.jupiter.params.ParameterizedTest;\nimport org.junit.jupiter.params.provider.ValueSource;\n\
  import static org.assertj.core.api.AssertionsForClassTypes.assertThat;\n\npublic\
  \ class LoyaltyPointsTest {\n\n    @ParameterizedTest\n    @ValueSource(ints = {100,\
  \ 200, 300})\n    @DisplayName(\"should add points correctly\")\n    void shouldAddPointsCorrectly(int\
  \ additionalPoints) {\n        LoyaltyPoints points = new LoyaltyPoints(100);\n\
  \    }\n}\n```\n\n\n\n\n\n```java\nLoyaltyPoints updatedPoints = points.addPoints(additionalPoints);\n\
  \nassertThat(updatedPoints.points()).isEqualTo(100 + additionalPoints);\n\n}\n\n\
  @ParameterizedTest\n@ValueSource(ints = {1000, 1500, 2000})\n@DisplayName(\"should\
  \ return true if points are enough for premium\")\nvoid shouldReturnTrueForPremiumEligibility(int\
  \ points) {\n    LoyaltyPoints loyaltyPoints = new LoyaltyPoints(points);\n    assertThat(loyaltyPoints.canUpgradeToPremium()).isTrue();\n\
  }\n\n@ParameterizedTest\n@ValueSource(ints = {999, 500, 0})\n@DisplayName(\"should\
  \ return false if points are not enough for premium\")\nvoid shouldReturnFalseForPremiumEligibility(int\
  \ points) {\n    LoyaltyPoints loyaltyPoints = new LoyaltyPoints(points);\n    assertThat(loyaltyPoints.canUpgradeToPremium()).isFalse();\n\
  }\n```\n\n在这里，`LoyaltyPointsTest` 确保了积分累加符合预期，并且会员资格能够被正确判定。最后，测试聚合根 `LoyaltyCard`\
  \ 可以让我们更广泛地看到系统如何处理客户的会员状态和高级升级：\n\n```java\nimport org.junit.jupiter.api.DisplayName;\n\
  import org.junit.jupiter.params.ParameterizedTest;\nimport org.junit.jupiter.params.provider.CsvSource;\n\
  import static org.assertj.core.api.Assertions.assertThat;\n\npublic class LoyaltyCardTest\
  \ {\n    @ParameterizedTest\n    @CsvSource({\n        \"0, BRONZE\",\n        \"\
  999, BRONZE\",\n        \"1000, SILVER\",\n        \"1500, SILVER\",\n        \"\
  5000, GOLD\",\n        \"7000, GOLD\",\n        \"10000, PLATINUM\",\n        \"\
  15000, PLATINUM\"\n    })\n    @DisplayName(\"should return the correct category\
  \ based on points\")\n    void shouldReturnCorrectCategoryBasedOnPoints(int points,\
  \ String expectedCategory) {\n        Customer customer = new Customer(\"John Doe\"\
  , \"john.doe@example.com\");\n        LoyaltyCard card = new LoyaltyCard(\"1\",\
  \ customer);\n        card.addPoints(points);\n        assertThat(card.getCategory().toString()).isEqualTo(expectedCategory);\n\
  \    }\n\n    @ParameterizedTest\n    @CsvSource({\n        \"999, false\",\n  \
  \      \"1000, true\",\n        \"1500, true\",\n        \"5000, true\"\n    })\n\
  \    @DisplayName(\"should determine if premium status is reached\")\n    void shouldCorrectlyDeterminePremiumStatus(int\
  \ points, boolean expectedIsPremium) {\n        Customer customer = new Customer(\"\
  Jane Doe\", \"jane.doe@example.com\");\n        LoyaltyCard card = new LoyaltyCard(\"\
  1\", customer);\n        card.addPoints(points);\n        assertThat(card.isPremium()).isEqualTo(expectedIsPremium);\n\
  \    }\n}\n```\n\n这种方法将 DDD 的核心原则与实际测试方法论结合在一起。通过保持一致的测试命名和与领域对的结构，测试可以作为业务逻辑的验证和活文档。\n\
  \n### 增强你的测试\n\n编写有效的测试并设计这些测试至关重要，特别是在处理 DDD 时。理解领域的语义并探索正确的术语是成功的关键。本节将探索增强测试方法论的六个关键步骤，并引导你编写实用的测试如下：\n\
  \n1. **测试指南**：完善的测试指南就像指南针一样，确保项目贡献者遵循统一的测试方法。这些指南有助于保持测试在编写和维护方面的一致性，最终促进对质量的承诺。\n\
  \n指南通常包括以下内容：\n\na. **使用的工具**：定义的测试工具集，以简化测试流程并确保所有贡献的一致性。\n\nb. **命名规范**：测试类和方法具有一致的命名规范，可以增强测试的可读性和可维护性。\n\
  \nc. **特定的测试创建方法**：关于测试创建方法的指南（例如软断言和广泛的断言），确保了对代码行为的全面验证。\n\nd. **覆盖率扩展**：如变异测试（mutation\
  \ testing）等技术有助于发现隐藏 Bug 并提高整体代码质量。\n\n例如，`Jakarta Data` 中的文档概述了将使用的框架、命名规范和测试结构，为项目内的测试实践设定了标准。`JUnit\
  \ 5` 等工具结合 `AssertJ` 提供了一个强大的测试框架。遵循清晰的命名规范（如 `should + 操作 + 预期结果`）也能确保测试既具有描述性又与领域对齐。以下代码展示了一个示例结构：\n\
  \n```java\npublic class LoyaltyCardTest {\n    @Test\n    @DisplayName(\"Should\
  \ correctly create LoyaltyCard with default category\")\n    void shouldCreateLoyaltyCardWithDefaultCategory()\
  \ {\n        Customer customer = new Customer(\"John Doe\", \"john.doe@example.com\"\
  );\n        LoyaltyCard card = new LoyaltyCard(\"1\", customer);\n        assertThat(card.getCategory()).isEqualTo(CustomerCategory.BRONZE);\n\
  \    }\n}\n```\n\n软断言（soft assertion）允许在单个测试中进行多个断言，而不会在第一个失败处停止。与普通断言（一个断言失败就会立即终止测试）不同，软断言会继续运行并捕获所有断言失败。这在测试中验证多个条件并获取所有问题的完整视图时特别有用。例如，如果一个测试方法包含十个断言，使用\
  \ `AssertJ` 库中的 `SoftAssertions` 可以让你在一次运行中精确地看到有多少个断言失败了，而不是在第一个失败处停止并反复运行测试直到所有验证通过通过。这种方法在每次测试执行中都提供了更全面的反馈，并在诊断多个问题时节省了时间如下：\n\
  \n```java\nassertSoftly(softly -> {\n    softly.assertThat(pageable.size()).isEqualTo(20);\n\
  \    softly.assertThat(pageable.page()).isEqualTo(1L);\n    softly.assertThat(3);\n\
  });```\n\n2. **现代测试库**：选择现代工具对于编写有效的测试至关重要。迁移到 `JUnit 5` (`Jupiter`) 带来了让测试更高效的功能，例如改进测试描述、环境特定条件和数据驱动能力。`JUnit\
  \ 5` 简化了复杂的测试需求（例如通过断言和参数），而 `AssertJ` 等库通过提供 Fluent API 提高了可读性。\n\n3. **数据驱动方法**：数据驱动测试涉及使用多组数据运行相同的测试逻辑，通过验证代码在不同条件下的行为提高了覆盖率和可维护性。在\
  \ `JUnit Jupiter` 中，`@ParameterizedTest` 注解通过允许注入数据来实现这种方法。这使得测试可以使用各种输入执行，确保考虑了各种场景和边界情况。例如，在\
  \ `shouldAssignCorrectBasedPoints` 测试中，积分及其对应的类别被注入为参数，系统地验证了每个可能的结果，而无需多个测试方法。\n\
  \n**安排、执行、断言 (AAA)** 模式是编写单元测试的一种清晰且实用的方法。在 **Arrange（安排）**阶段，你设置必要的对象和配置。在 **Act（执行）**阶段，你执行要测试的操作（例如调用某个方法）。最后，在\
  \ **Assert（断言）**阶段，你使用断言检查结果是否符合预期。这种模式增强了可读性，并定义了测试的设置、执行和预期结果。\n\n```java\n@ParameterizedTest\n\
  @CsvSource({\n    \"0, BRONZE\",\n    \"1000, SILVER\",\n    \"5000, GOLD\",\n \
  \   \"10000, PLATINUM\"\n})\n@DisplayName(\"Should assign correct category based\
  \ on points\")\nvoid shouldAssignCorrectCategoryBasedOnPoints(int points, String\
  \ expectedCategory) {\n    // Arrange\n    Customer customer = new Customer(\"John\
  \ Doe\", \"john.doe@example.com\");\n    LoyaltyCard card = new LoyaltyCard(\"3\"\
  , customer);\n\n    // Act\n    card.addPoints(points);\n\n    // Assert\n    assertThat(card.getCategory().toString()).isEqualTo(expectedCategory);\n\
  }\n```\n\n这种灵活性允许与外部数据源无缝集成，提供了一种探索边界情况并确保健健性的机制。\n\n\n\n\n\n### 4. 覆盖扩展\n\n为了跟踪并确保彻底的测试覆盖率，`PITest`、`JaCoCo`\
  \ 和 `Cobertura` 等工具是无价的。特别是 `PITest`，它通过变异测试帮助评估测试的强度，通过在代码库中引入变异并检查测试是否捕获这些故障来发现潜在的漏洞\
  \ [6]。最后，使用容器进行测试彻底改变了集成测试。通过 `TestContainers`，开发者可以在测试期间为数据库或其他服务启动 `Docker` 容器，确保环境隔离且一致。以下是使用\
  \ `TestContainers` 测试 `PostgreSQL` 的示例：\n\n```java\n@Testcontainers\npublic class\
  \ LoyaltyCardRepositoryTest {\n    @Container\n    public PostgreSQLContainer<?>\
  \ postgresContainer = new PostgreSQLContainer<>(\"postgres:13\")\n        .withDatabaseName(\"\
  testdb\")\n        .withUsername(\"test\")\n        .withPassword(\"test\");\n\n\
  \    @Test\n    void shouldSaveAndRetrieveLoyaltyCard() {\n        // Test implementation\n\
  \    }\n}\n```\n\n这种方法允许在真实环境中对数据库交互进行全面测试，确保测试可靠且易于复制。可以考虑 *Effective Software\
  \ Testing: A Developer’s Guide7*。这本书对于测试驱动开发、测试策略以及在软件项目中编写可靠测试的最佳实践提供了宝贵的见解。通过采用这六个步骤：指南、现代库、数据驱动测试、覆盖扩展和容器，你可以提升测试实践的质量，确保你的\
  \ `Java` 项目是健壮、可维护且符合 `DDD` 原则的。\n\n在下一节中，我们将探索使用 `ArchUnit` 进行架构验证，在其中你将学习如何确保你的应用程序架构始终符合\
  \ `DDD` 原则。\n\n## 使用 ArchUnit 进行架构验证\n\n保证应用程序的架构基于 `DDD` 原则对于长期可维护性和业务对齐至关重要。然而，随着代码库的演进，执行架构规则可能是具有挑战性的，特别是当我们我们需要手动识别或需要记忆的某些东西时；我们的基本规则是：所有我们必须记住的东西，我们都会忘记。这时\
  \ `ArchUnit` 就派上用场了。\n\n`ArchUnit` 是一个强大的工具，允许你编写测试来强制架构约束，帮助确保你的应用程序随着时间的推移始终符合\
  \ `DDD` 原则。通过指定架构规则，`ArchUnit` 验证应用程序的结构是否遵循定义的边界，防止意外的依赖和交互。例如，你可以创建测试来验证特定包不依赖于其他包，或者只有某些层可以与特定组件交互。这种主动的方法加强了架构的完整性，并使代码库在演进过程中与\
  \ `DDD` 标准保持一致。\n\n在 `DDD` 中，维护边界上下文（bounded contexts）、聚合（aggregates）和其他核心领域元素的完整性对于保持领域模型的纯洁至关重要。`ArchUnit`\
  \ 帮助验证这些架构模式在整个代码库中得到尊重。\n\n让我们如何使用 `ArchUnit` 在我们的忠诚计划上下文中验证架构规则。例如，我们可能希望强制 `domain`\
  \ 包中的所有类都不应依赖于应用层的类。以下测试确保了领域模型不依赖于应用层：\n\n```java\nimport com.tngtech.archunit.core.domain.JavaClasses;\n\
  import com.tngtech.archunit.core.importer.ClassFileImporter;\nimport com.tngtech.archunit.lang.syntax.ArchRuleDefinition;\n\
  import org.junit.jupiter.api.Test;\n\nclass ArchitectureTest {\n    @Test\n    void\
  \ domainClassesShouldNotDependOnApplicationLayer() {\n        String packageName\
  \ = CardStatus.class.getPackageName();\n        JavaClasses importedClasses = new\
  \ ClassFileImporter().\n            .importPackages(packageName);\n        ArchRuleDefinition.noClasses()\n\
  \            .that().resideInAPackage(packageName)\n            .should().dependOnClassesThat().resideInAPackage(\"\
  ..application..\")\n            .check(importedClasses);\n    }\n}\n```\n\n虽然 `ArchUnit`\
  \ 专注于架构验证，但 `jMolecules` 引入了一组 `DDD` 特有的注解和构建块，使得直接在代码中表达领域概念变得更容易。`jMolecules`\
  \ 提供了诸如 `@AggregateRoot`、`@ValueObject` 和 `@Entity` 等注解，使领域模型更加显式并强制执行 `DDD` 原则。\n\
  \n使用 `jMolecules`，我们可以对忠诚计划领域类进行注解，以提高清晰度和与 `DDD` 的对齐性。这些注解帮助 `ArchUnit` 等工具识别核心领域组件，从而实现更精确的架构验证。\n\
  \n现在让我们使用 `jMolecules` 注解重写忠诚卡领域模型，以强制执行 `DDD` 概念的清晰性如下：\n\n```java\n@ValueObject\n\
  public enum CardStatus {\n    ...\n}\n\n@AggregateRoot\npublic class LoyaltyCard\
  \ {\n    ...\n}\n\n@Entity\npublic class LoyaltyCardRegistration {\n    ...\n}\n\
  ```\n\n通过包含 `jMolecules` 注解，你可以验证你的设计是否连接到目标层并正确应用了这些注解。`jMolecules` 提供了多种集成选项，包括\
  \ `jQAssistant` 和 `ArchUnit` 等工具，它们可以结合使用来强制架构规则。\n\n例如，下面的代码示例演示了如何结合 `ArchUnit`\
  \ 与 `jMolecules` 使用来验证 `DDD` 特有的规则。在这个示例中，我们检查层集成，我们将在 第 5 章 《微服务、单体和分布式系统中的 DDD》中详细讨论层集成，以及\
  \ `DDD` 规则。这些关于 `DDD` 的规则确保实体符合 `DDD` 原则，例如具有适当注解的标识符字段。以下代码引入了 `jMolecules` 提供的验证规则，我们不仅检查层，还根据我们在类中提供的注解检查\
  \ `DDD` 验证规则：\n\n```java\nimport com.tngtech.archunit.core.domain.JavaClasses;\n\
  import com.tngtech.archunit.core.importer.ClassFileImporter;\nimport org.jmolecules.archunit.JMoleculesArchitectureRules;\n\
  import org.jmolecules.archunit.JMoleculesDddRules;\nimport org.junit.jupiter.api.Test;\n\
  \npublic class JMoleculesDddUnitTest {\n    @Test\n    void shouldCheckLayerIntegration()\
  \ {\n        String packageName = CardStatus.class.getPackageName();\n        JavaClasses\
  \ classes = new ClassFileImporter().\n            .importPackages(packageName);\n\
  \        JMoleculesArchitectureRules.ensureLayering().check(classes);\n    }\n\n\
  \    @Test\n    void shouldCheckDDDIntegration() {\n        String packageName =\
  \ CardStatus.class.getPackageName();\n        JavaClasses classes = new ClassFileImporter().\n\
  \            .importPackages(packageName);\n        JMoleculesDddRules.all().check(classes);\n\
  \    }\n}\n```\n\n本节介绍了使用 `ArchUnit` 进行架构验证以及使用 `jMolecules` 改进领域建模并强制执行 `DDD` 原则。结合这些工具为在整个项目中维护架构一致性提供了一个健壮的框架。\n\
  \n## 总结\n\n在本章中，我们探讨了确保 `DDD` 实现保持架构完整性、领域清晰度和高质量代码的各种技术。从验证领域模型的测试策略到利用 `ArchUnit`、`jMolecules`、`Checkstyle`\
  \ 和 `PMD` 等工具，我们看到了自动化检查如何帮助保护项目免受技术偏移，并确保其符合业务需求。这些实践减少了 Bug 和效率低下，允许团队专注于核心领域，促进长期的可持续性。\n\
  \n当我们继续 `DDD` 之旅时，下一章将扩展 `DDD` 如何适应不同的架构范式。无论你是在构建微服务架构还是在单体或分布式系统中工作，我们将探索如何在这些多样化的环境中有效地应用\
  \ `DDD` 原则，并维护业务逻辑与系统结构之间的平衡。\n\n\n\n\n\n## 记忆点\n\n- 测试对于维护符合 DDD 的应用程序至关重要：结构良好的测试可以验证领域逻辑、防止回归，并确保业务规则被正确执行。\n\
  - AAA 模式提高了测试的清晰度：该模式对测试进行了结构化处理，使其更容易阅读、维护和调试。\n- 数据驱动测试增强了测试覆盖率：使用 `JUnit Jupiter`\
  \ 的 `@ParameterizedTest` 可以高效地测试多种场景，而无需重复测试逻辑。\n- 集成测试比以往任何时候都更易实现：通过 `Spring`、`Quarkus`、`Payara`、`Open\
  \ Liberty` 和 `Helidon` 等现代框架以及 `Testcontainers` 等工具，集成测试可以实现自动化并高效执行。\n- `ArchUnit`\
  \ 在代码中强制架构约束：编写架构验证测试有助于维持适当的 DDD 分层，并防止意外的依赖。\n- `jMolecules` 简化了代码中 DDD 概念的表达：使用\
  \ `@AggregateRoot`、`@ValueObject` 和 `@Entity` 等注解明确了领域对象的角色并有助于验证。\n- `Checkstyle`\
  \ 和 `PMD` 防止代码质量下降：这些工具在问题影响领域模型之前强制编码标准并检测潜在问题。\n- 变异测试提升了测试的有效性：如 `PIest` 等工具通过在代码中引入受控故障，来验证测试捕真实变化的能力如何。\n\
  - 通过持续验证可以缓解软件腐化：自动化架构和代码质量检查可确保领域模型与业务需求保持一致。\n- DDD 原则必须在不同的架构中通过验证：无论是在单体应用、微服务还是分布式系统中，应用测试和验证策略都能确保长期的可维护性和可扩展性。\n\
  \n## 单选题\n\n1. DDD 中代码验证工具的主要目的是什么？\n   a. 编写更复杂的代码\n   b. 自动化部署过程\n   c. 确保代码符合\
  \ DDD 原则并维护代码质量\n   d. 提高数据库性能\n   e. 跳过手动测试程序\n\n2. 为什么强制编码标准很重要，特别是在 DDD 项目中？\n\
  \   a. 让新开发者更难阅读代码\n   b. 确保领域语言在整个代码库中一致地应用\n   c. 让构建过程变慢\n   d. 创建更复杂的架构\n  \
  \ e. 增加所需的测试数量\n\n3. 以下哪项是 DDD 项目中 `Checkstyle` 可能执行的规则示例？\n   a. 架构中允许的最大微服务数量\n\
  \   b. 确保聚合根仅保存在特定的存储库中\n   c. 为领域实体强制适当的命名规范\n   d. 验证 API 端点的正确使用\n   e. 限制使用的测试数据集的大小\n\
  \n4. `Checkstyle` 和 `PMD` 如何有助于 DDD 合规性？\n   a. 通过自动生成领域模型\n   b. 通过强制架构规则并检测可能损害领域完整性的代码问题\n\
  \   c. 通过减少对测试的需求\n   d. 通过管理微服务通信\n   e. 通过自动编写测试用例\n\n6. 为什么软件腐化是 DDD 中受关注的问题？\n\
  \   a. 它导致应用性能变慢\n   b. 它导致领域模型与实际实现之间的脱节\n   c. 它增加了需要的微服务数量\n   d. 它增强了代码的可读性\n\
  \   e. 它简化了测试\n\n7. 下列哪项是 DDD 项目单元测试的关键收益？\n   a. 它自动化了领域事件创建\n   b. 它确保每个领域组件的行为符合预期并与业务规则一致\n\
  \   c. 它减少了对代码验证工具的需求\n   d. 它极地化了领域模型中聚合根的数量\n   e. 它增加了微服务的数量\n\n7. 数据驱动测试如何增强\
  \ DDD 项目中的测试有效性？\n   a. 它提高了领域模型的性能\n   b. 它自动生成新的领域实体\n   c. 它通过使用不同的输入数据运行相同的测试逻辑，允许探索不同的场景和边界情况\n\
  \   d. 它验证代码风格的一致性\n   e. 它减少了测试领域聚合根的需求\n\n### 答案\n\n| 题号 | 答案选项字母 |\n| :--- |\
  \ :--- |\n| 1. | c. |\n| 2. | b. |\n| 3. | c. |\n| 4. | b. |\n| 5. | b. |\n| 6.\
