  \ Vernon, Vaughn. Implementing Domain-Driven Design, 2013.\n\n\n\n\n本章对于想要将理论与实际应用的开发者来说至关重要。我们将通过\
  \ Java 模式如何如何使用战术 DDD（领域驱动设计），例如实体、值对象、服务、聚合和存储库。详细的代码示例将展示软件开发如何在有效管理复杂性的同时，反映业务领域模型。\n\
  \n## 章节结构\n\n在本章中，我们将探索：\n\n* 实体和值对象\n* 聚合和聚合根\n* 服务及其角色\n* 存储库实现\n\n## 技术要求\n\n\
  为了跟上本章中的代码示例和练习，请确保你已经准备好以下工具和环境配置：\n\n* Java 21\n* Git\n* Maven\n* 任何你偏好的 IDE\n\
  \n关于库配置的更多信息，请参考本章对应的 GitHub 仓库。\n\n## 目标\n\n本章旨在通过探索实体、值对象、聚合、服务和存储库等关键模式，对战术 DDD\
  \ 提供实操性的理解。在本章结束时，你将能够构建自己的领域模型，确保清晰的边界和职责，并应用实现整洁且可维护的业务逻辑的最佳实践。通过实操示例和实现指南，你将学习如何将\
  \ DDD 原则转化为代码，同时避免常见的陷阱。\n\n## 实体和值对象\n\n在开始战术 DDD 时，需要关注的概念是实体（Entity）。领域建模的起点是代码中实现的核心，换句话说，就是实体。\n\
  \n> **提示：** 虽然实体在战术 DDD 中至关重要，但请记住，它们的设计始终应该受到在此之前所做的战略 DDD 决策的指导。\n\n实体是数据库系统中存储信息的表示，是实现设计模式以及业务或领域定义的基础。\n\
  \n正如《领域驱动设计 1》书中所述，实体的核心特征是连续性（通常称为其生命周期）和身份：\n\n> 许多对象的本质并不是由属性定义的，而是由一条连续性和身份定义的。\n\
  > -Eric Evans\n\n身份是一个唯一且不变的特征，无论属性如何变化，它都能将实体与其他区分来。它保证了随时间推的连续性和可追溯性，通常由唯一标识符（如\
  \ `ID` 或 `code`）表示。\n\n在 DDD 中，身份对于一致识别实体至关重要，即使它的其他属性发生了变化。例如，在一个大学入学系统中，学生的身份由唯一的\
  \ `student ID` 坚决定义，无论姓名或地址如何变化，该 ID 保持不变。这一概念对于有效的实体设计至关重要，确保它们在整个生命周期内无疑问地表示同一个对象。\n\
  \n实体是由其身份定义的（身份唯一地将其与其他区分），而不是由其属性。这种身份允许实体在属性变化时随时间推移保持可识别性。例如，在一个大学入学系统中，学生通过其恒定的学生\
  \ ID 来识别，无论姓名或电子邮件如何变化。这种一致的身份确保了实体在整个生命周期中的连续性。\n\n在实现实体时，请问自己这个领域特定的问题：随着时间的推移，什么决定了这个对象仍然与之前的一样？这种理解塑造了身份如何被定义为\
  \ `entity code`。正如 Evans 指出的那样：\n\n> 警惕那些要求通过属性匹配对象的需求。\n> -Eric Evans\n\n有时，被认为是实体的对象可能是不同的对象类型（例如值对象，这是在本章后半部分探讨的概念）。测试这一点的一种方法是检查需求是否意味着两个对象在比较时应该被视为同一个，这意味着它们被认为是相等的具有匹配的属性。在设计领域模型时，理解这种区别至关重要。让我们从探索一些陷阱开始。\n\
  \n### 实体陷阱\n\n在采用战术 DDD 实践构建第一个实体时，可以避免一个典型的陷阱，特别是当将 Java 实体与普通 Java 对象（POJO）模型结合时。\n\
  \n最常见的错误之一是创建贫血实体（Anemic Entities）：即持有数据但不包含任何领域逻辑或封装 4 的对象。下面的代码通过一个简单的 `Traveller`\
  \ 实体展示了这个问题，其中护照号充当 ID：\n\n```java\npublic class Traveller {\n    private String\
  \ passportNumber;\n    private String name;\n    private Set<String> countries;\n\
  }\n```\n\n从乍看，这个设计可能足够了，因为它允许我们设置所有字段并初始化实例，如下例所示：\n\n```java\n@Test\nvoid shouldCreateTraveller()\
  \ {\n    Traveller traveller = new Traveller();\n    traveller.setPassportNumber(\"\
  123456\");\n    traveller.setName(\"John Doe\");\n    traveller.setCountries(Set.of(\"\
  USA\", \"UK\"));\n    Assertions.assertThat(traveller.getPassportNumber()).isEqualTo(\"\
  123456\");\n    Assertions.assertThat(traveller.getName()).isEqualTo(\"John Doe\"\
  );\n    Assertions.assertThat(traveller.getCountries()).contains(\"USA\", \"UK\"\
  );\n}\n```\n\n然而，这种方法有一个明显的缺陷：在这个 POJO 实体中领域逻辑在哪里？一个 `Traveller` 在没有有效护照号或姓名的情况下存在是否有意义？这种结构的代码缺乏适当的封装。\n\
  \n为每个字段使用公共的 getter 和 setter 与直接暴露公共字段没有区别区别。\n\n此外，这种 API 设计容易产生错误，从而轻易破坏数据一致性和业务规则的完整性。例如，以下代码演示了\
  \ `Traveller` 实体如何处于不一致的状态，这可能导致 `NullPointerException`：\n\n```java\n@Test\nvoid\
  \ breakingApiContract() {\n    Traveller traveller = new Traveller();\n    traveller.setPassportNumber(\"\
  123456\");\n    traveller.setName(\"John Doe\");\n    traveller.setCountries(Set.of(\"\
  USA\", \"UK\"));\n    traveller.setCountries(null);\n    Assertions.assertThatThrownBy(()\
  \ -> traveller.getCountries().contains(\"USA\")).isInstanceOf(NullPointerException.class);\n\
  }\n```\n\n允许 `countries` 字段被设置为 `null` 不仅仅是不便，这种做法损害了 API 的完整性并带来了安全风险。从机密性、完整性和可用性（CIA）三要素\
  \ 5 的角度来看，这种方法通过允许对关键字段进行不受限制的更改来破坏应用程序的完整性。即使这种问题是意外引入的，这种设计被称为贫血领域模型（Anemic Domain\
  \ Model），被认为是 DDD 中的一种反模式。在篇文章中，Martin Fowler 详细阐述了贫血模型的缺点，并提倡使用富模型（Rich Models）6。富模型拥抱封装，确保业务逻辑和数据完整性在实体内部紧密耦合。\n\
  \nRobert C. Martin 在《洁洁代码 7 中也批评了贫血模型，解释说这种错误源于对面向对象范式的误解。他强调，对象的根本原理不仅仅是分组数据，而是暴露行为并隐藏底层数据。当实体仅由\
  \ getter 和 setter 组成而不封装行为时，它们并不是真正的对象。Martin 指出贫血模型比面向对象设计更接近过程化编程，因为它将对象视为数据结构，而不是将行为封装为真正的对象。这意味着贫血模型不被认为是完全面向对象的，并且违背了面向对象（OO）设计的核心哲学。\n\
  \n\n\n\n为了解决这个问题，对 `Traveller` 实体进行了重构，通过构造函数和方法强制执行领域逻辑，避免使用可变状态。将其转变为一个更健壮的 `Tourist`\
  \ 实体，避免使用 setter 并确保通过构造函数和方法执行领域逻辑。这个版本遵循了《Effective Java》中的第 15 条，并与《Clean Code》中侧重于封装行为的原则保持一致。例如，一个\
  \ `Tourist` 在在没有有效护照号码的情况下存在是没有意义的，因此我们通过以下构造函数强制执行这一点：\n\n```java\npublic class\
  \ Tourist {\n\n    private String passportNumber;\n    private String name;\n  \
  \  private Set<String> countries = new HashSet<>();\n\n    public Tourist(String\
  \ passportNumber, String name) {\n        Objects.requireNonNull(passportNumber,\
  \ \"Passport number cannot be null\");\n        Objects.requireNonNull(name, \"\
  Name cannot be null\");\n        this.passportNumber = passportNumber;\n       \
  \ this.name = name;\n    }\n\n    public String getPassportNumber() {\n        return\
  \ passportNumber;\n    }\n\n    public String getName() {\n        return name;\n\
  \    }\n\n    public Set<String> getCountries() {\n        return Collections.unmodifiableSet(countries);\n\
  \    }\n\n    public void addCountry(String country) {\n        Objects.requireNonNull(country,\
  \ \"Country cannot be null\");\n        countries.add(country);\n    }\n}\n```\n\
  \n这个重构后的 `Tourist` 实体现在封装了数据，通过防止空值和不受控的修改来确保其完整性。构造函数保证 `Tourist` 始终拥有有效的护照号码和\
  \ `name`，且 `addCountry` 方法确保 `countries` 不为空。此外，`getCountries` 方法返回一个不可修改的集合，防止外部对内部状态进行修改。\n\
  \n通过设计丰富模型的实体，我们提高了应用程序的完整性和安全性，同时与战术 DDD 的核心原则一致。这种方法使 API 更加健壮，并确保领域逻辑处于设计的中心位置，避免了贫血模型（anemic\
  \ models）的陷阱。\n\nDDD 中的另一个常见错误与类和字段的命名规范有关。在《Clean Code》中，Robert C. Martin 强调了使用有意义名称并避免冗余的重要性。这一原则适用于字段名，例如\
  \ `string nameString`，额外的 `string` 后缀没有增加任何价值。相反，名称应该是 `string name`，这样更自然且简洁。同样，应该避免诸如\
  \ `PersonEntity` 或 `CardEntity` 这样冗类的类名。使用与领域通用语言（Ubiquitous Language）一致的清晰、简洁的命名，会让你的代码更容易读、更有关联，并且对于开发者和利益相关者都更容易维护。\n\
  \n同样的原则也适用于类名。通常没有必要在类名后附加 `Entity`。相反，直接根据领域术语为类命名，例如 `Person`、`Card` 或 `Team`。这种做法提高了代码的可读性，并确保你的代码与业务语言保持紧密结合，使其更加直观。战略\
  \ DDD 的目标是确保代码的语言反映业务领域的语言，这包括类名、属性名和方法名。这种方法加强了代码与业务规则之间的联系，帮助开发者和领域专家更有效地理解和交流。\n\
  \n在某些项目中，`Entity` 后缀是约定的一部分，有助于识别识别领域对象。虽然这可以作为快速搜索的辅助，但它表明存在一种恐惧驱动的设计（fear-driven\
  \ design），可能导致架构由于治理规则而变得过于僵化。必须记住，命名规范应该增强清晰度，而不是削弱它。\n\n为了构建强大且有效的模型，避免弱模型和不必要的命名至关重要。这使我们能够专注于创建准确表示行为的全面模型。例如，让我们考虑一个使用\
  \ `Team` 实体表示足球球队的场景。在这种情况下，球队通过唯一的 `FIFA code` 标识，该代码遵循特定规则，例如最多有 23 名球员并确保每位球员都是唯一的。\n\
  \n```java\npublic class Team {\n\n    private final String fifaCode;\n    private\
  \ final String name;\n    private final List<Player> players;\n\n    private Team(String\
  \ name, String fifaCode) {\n        this.name = name;\n        this.fifaCode = fifaCode;\n\
  \        this.players = new ArrayList<>();\n    }\n\n    public String getFifaCode()\
  \ {\n        return fifaCode;\n    }\n\n    public String getName() {\n        return\
  \ name;\n    }\n\n    public List<Player> getPlayers() {\n        return Collections.unmodifiableList(players);\n\
  \    }\n\n    public void add(Player player) {\n        Objects.requireNonNull(player,\
  \ \"Player is required\");\n        if (players.contains(player)) {\n          \
  \  throw new IllegalArgumentException(\"Player already exists\");\n        } else\
  \ if (players.size() >= 23) {\n            throw new IllegalArgumentException(\"\
  Team is full\");\n        }\n        players.add(player);\n    }\n\n    public static\
  \ Team create(String name, String fifaCode) {\n        Objects.requireNonNull(name,\
  \ \"Name is required\");\n        Objects.requireNonNull(fifaCode, \"FIFA code is\
  \ required\");\n        return new Team(name, fifaCode);\n    }\n}\n```\n\n这种实现果断地利用了《Effective\
  \ Java》中的关键原则，例如采用静态工厂方法代替构造函数，并减少可变性。通过设计 `Team` 类为除了添加球员的能力外主要是不可变的，我们显著减少了领域模型中的\
  \ Bug 风险。\n\n某些 Java 框架（如 `JPA`）由于需要默认构造函数而无法不可变实体。清晰的解决方案领域模型与持久化模型分离，这允许我们在维护健壮领域模型的同时，有效解决持久化需求。\n\
  \n关于实体的可变性，这一决策必须植根于特定的业务背景，正如 Eric Evans 的 DDD 书中所强调的那样。在实体不频繁变化的情况下（例如书籍），不可变性不仅是合适的，而且优的，因为应该创建新版本而不是修改现有版本。\n\
  \n引入不可变特性的有效策略是使用 Java 的 `record` 特性：\n\n```java\npublic record Book(String isbn,\
  \ String name, String author, int edition, Year year) {\n\n    public Book newEdition(String\
  \ isbn, Year year) {\n        return new Book(isbn, name, author, edition + 1, year);\n\
  \    }\n}\n```\n\n在这个示例中，注意不是 `class`，而是 `record` 对象，它是一种被设计为不可变的类型。这个 `Book` 实体作为\
  \ `record`，现在是不可变的，这意味着更改会导致创建新的书籍（例如，新版本），而不是修改现有的。这种行为符合某些领域的自然演变，例如出版行业，其中新版代表重大更新而非细微修改。\n\
  \n\n\n\n- Builder 可以由某些工具和框架自动生成。\n- 需要在 `build()` 方法中进行强校验，以确保所有必填字段都已设置。\n\n另一方面，流式\
  \ API（fluent API）是 Martin Fowler 在 2005 年引入的概念，旨在通过创建 DSL（领域特定语言）来提高代码的可读性。\n\n\
  使用流式 API，在创建新实例时，无需记住方法的调用顺序。它通过促进构建对象所需步骤的可视化，实现了一种自然、直观的编码流。\n\n在设计流式 API 时，需要考虑以下原则：\n\
  \n- 每个方法都应该对输入进行验证，以便在参数无效时快速失败。\n- 方法链应该返回一个有效对象以保证其完整性。\n\n让我们通过一个 `Player` 实体的示例来更好地理解这一点：\n\
  \n```java\npublic class Player {\n    private String name;\n    private Year start;\n\
  \    private Year end;\n    private String email;\n    private Position position;\n\
  \    private int goal = 0;\n}\n```\n\n该实体包含了如 `name`、合同的 `start` 和 `end` 年份、`position`\
  \ 以及进球数等字段。其中涉及一些业务规则：\n\n- 球员的 `name` 和 `position` 是必须的。\n- 进球数不能为负数。\n- 合同必须有有效的\
  \ `start` 和 `end` 日期。\n\n为了执行这些规则，我们可以使用 Builder 或流式 API。它们各有以下权衡：\n\n- **Builder\
  \ 模式**：允许我们逐步构建对象，但我们需要确保不会遗漏任何必填字段。校验逻辑通常发生在 `build()` 方法中，如果缺少必填字段，可能会在运行时产生问题。以下是一个示例：\n\
  \n```java\nPlayer player = Player.builder()\n    .name(\"Ronaldo\")\n    .start(Year.of(2003))\n\
  \    .end(Year.of(2020))\n    .position(Position.FORWARD)\n    .email(\"ronaldo@bahia.com\"\
  )\n    .build();\n```\n虽然这容易实现，但它没有显式地引导开发者填写必填字段。如果不小心跳过了 `name` 方法，错误只会在运行时出现。\n\
  \n- **流式 API**：为构建复杂实体提供了一种更直观、更具引导性的方法。API 中的每一步自然地引向下一步，并在此过程中强制业务规则。这使得过程更具可读性且领域特定化，与\
  \ DDD（领域驱动设计）术语更加契合。\n\n```java\nPlayer player = Player.name(\"Ronaldo\")\n    .start(Year.of(2003))\n\
  \    .end(Year.of(2020))\n    .position(Position.FORWARD)\n    .email(\"ronaldo@bahia.com\"\
  );\n```\n在这里，API 确保开发者指定了球员的 `name`、`position` 和有效的合同期限。每个方法都可以立即验证输入，确保无效参数（如负进球数或缺失\
  \ `position`）在入口处被处理，而不是在运行时。这种方法为对象创建提供了更多的清晰度和信心。\n\n虽然这两种方法在软件设计中各有其用之处，但流式 API\
  \ 可以提供与领域模型更好的对齐，提供语义上的清晰性并减少运行时错误的风险。在更复杂的情况下，流式 API 提供了直观且领域特定的开发体验，这在 DDD 中尤为重要，因为\
  \ DDD 中的术语和行为紧密地反映了业务领域。\n\n在 `Player` 中，我们将 `email` 作为字符串使用，这意味着用户可以输入 \"banana\"\
  \ 而无需任何验证；解决此问题的方法之一是使用值对象（value object），将在下一节中介绍。\n\n### 值对象\n\n值对象是软件设计中的不可变构造，是\
  \ DDD 的核心，它封装了特定的值而不具有任何唯一标识。值对象的主要功能是表示问题领域中不同元素的概念。一旦创建，值对象就无法更改。这一特性通过减少与可变状态相关的风险降低了复杂性并确保了可靠性。通过集中化特定值或一组值，值对象简化了业务逻辑，并让开发者对领域模型具有更大的控制感和更高的表达力。\n\
  \n值对象在软件设计中具有多个优势。它们的不可变性保证了更高的可靠性，因为它们不容易引入与状态更改相关的 bug。此外，它们的模块化允许在多个系统部分之间轻松复用。这种复用性使得软件更具资源，并维护了业务逻辑的一致性。这种复用增强了系统的模块性并促进了业务逻辑的一致性，使软件更容易维护和扩展。此外，值对象通过显式表示业务概念增强了领域模型，从而提高了代码的可读性和清晰度。观察以下\
  \ Java 库中模式的示例，在本例中为货币 API：\n\n```java\nCurrencyUnit usd = Monetary.getCurrency(\"\
  USD\");\nMoney money = Money.of(12, usd);\n```\n\nJava 的日期和时间 API 也证明了值对象如何改进语义并符合领域的通用语言（Ubiquitous\
  \ Language）。新 API 没有使用旧日 API 中通用的 `getInstance()` 方法，而是提供了如 `now()` 这样有意义的方法，如下：\n\
  \n```java\nLocalDate localDate = LocalDate.now();\n```\n这种 API 的改进反映了领域思考，其中 `now`\
  \ 比通用工厂方法更清晰地反映了时间的业务背景。\n\n让我们使用 `Player` 实体将此概念投入实践，创建一个保证一致性和有效性的 `Email` 值对象。以下示例展示了一个\
  \ `Email` 值对象，它确保每个新的 `Email` 实例都是有效的。作为一个值对象，它是不可变的，并且在创建时强制执行校验，确保只接受有效的电子邮件地址。\n\
  \n注意：此类执行了基础电子邮件验证模式（local@domain）并检查了结构和顶级域名。\n\n```java\npublic final class Email\
  \ implements Supplier<String> {\n    private static final String EMAIL_PATTERN =\n\
  \        \"^[_A-Za-z0-9-\\\\+]+(\\\\.[_A-Za-z0-9-\\\\+]+)*@\"\n        + \"[A-Za-z0-9-]+(\\\
  \\.[A-Za-z0-9]+)*(\\\\.[A-Za-z]{2})$\";\n\n    private static final Pattern PATTERN\
  \ = Pattern.compile(EMAIL_PATTERN);\n\n    private final String value;\n\n    @Override\n\
  \    public String get() {\n        return value;\n    }\n\n    private Email(String\
  \ value) {\n        this.value = value;\n    }\n\n    @Override\n    public boolean\
  \ equals(Object o) {\n        if (this == o) {\n            return true;\n     \
  \   }\n        if (o == null || getClass() != o.getClass()) {\n            return\
  \ false;\n        }\n        Email email = (Email) o;\n        return Objects.equals(value,\
  \ email.value);\n    }\n\n    @Override\n    public int hashCode() {\n        return\
  \ Objects.hashCode(value);\n    }\n\n    @Override\n    public String toString()\
  \ {\n        return value;\n    }\n\n    public static Email of(String value) {\n\
  \        Objects.requireNonNull(value, \"email is required\");\n        if (!PATTERN.matcher(value).matches())\
  \ {\n            throw new IllegalArgumentException(\"Invalid email: \" + value);\n\
  \        }\n        return new Email(value);\n    }\n}\n```\n\n从上述代码可以观察到以下几点：\n\
  \n- 在此 `Email` 类中，电子邮件地址一旦验证后就会存储为不可变值，创建后不允许发生进一步更改。\n- `Email.of()` 工厂方法通过在提供的值不符合所需格式时抛出异常，确保创建有效的电子邮件。\n\
  - 格式使用正则表达式（regex）进行验证，以检查有效的电子邮件模式。\n- 该类实现了 `Supplier<String>`，允许它在需要时提供电子邮件字符串值，从而封装了校验逻辑并将其与系统的其他部分分离。\n\
  \n通过使用这种方法，你可以确保每当在领域中使用电子邮件时，它都保证是有效的，从而减少了代码后续出现 bug 或不一致的风险。\n\n\n\n\n除了不可变值对象外，枚举（enums）在建模领域固有的常量值时也可以起着重要作用。枚举提供了一组固定的常量，确保只使用预定义的值。在《Effective\
  \ Java 第 4》中，Joshua Bloch 强调了枚举作为传统常量字段的强大替代方案。\n\n例如，在我们的 `Player` 实体中，我们可以添加一个\
  \ `Color` 枚举来表示球员的球衣颜色。这通过提供与领域直接相关的清晰且不可更改的值，增强了领域模型，并将错误风险降至最低。\n\n```java\nimport\
  \ java.util.function.Supplier;\n\npublic enum Colors implements Supplier<String>\
  \ {\n    BLUE(\"#00FFFF\"), WHITE(\"#FFFFFF\"),\n    BLACK(\"#000000\"), GREEN(\"\
  #008000\");\n\n    private final String value;\n\n    Colors(String value) {\n \
  \       this.value = value;\n    }\n\n    @Override\n    public String get() {\n\
  \        return value;\n    }\n}\n```\n\n对于枚举（例如示例中的 `Colors` 枚举），预定义的颜色值以十六进制代码表示，提供了一组易于引用的不可变常量值。该枚举还实现了\
  \ `Supplier<String>`，允许它在需要时返回颜色值。通过这种方式定义颜色，我们确保了一致性，并减少了如果在代码库中使用自由字符串表示颜色时的错误风险。这种方法简化了逻辑并强制了统一性，确保领域值在整个应用中始终有效且一致。\n\
  \n枚举和值对象具有相同的目的，即在确保不可变性的同时，封装并验证领域逻辑。它们共同使得领域模型更具表现力、可读性，并符合业务需求。\n\n在接之后，我们将探索聚合（aggregate）和聚合根（aggregate\
  \ root）的概念。这些 DDD 构建模块通过定义边界和在相关实体之间执行业务规则，来管理你的领域模型的一致性。\n\n## 聚合与聚合根\n\n在讨论了战术\
  \ DDD 的核心——实体和值对象之后，是时候深入探讨一个最被误解但至关重要的概念之一了：聚合和聚合根。聚合通过定义边界并确保这些边界内的一致性，在构建领域模型方面起着至关重要的作用。\n\
  \n为了明确，聚合并不是：\n\n-   仅仅是实体的集合。\n-   仅仅是一个行为丰富的对象。\n-   或者是一组可以存储在数据库中的实体。\n\n正如\
  \ Martin Fowler 14 所解释的：\n\n> 聚合是数据存储和传输的基本元素；你请求加载或保存整个聚合。事务不应该跨越聚合边界。\n> -Martin\
  \ Fowler\n\nDDD 引入的第一批战术元素是实体和值对象，它们各具具有以下不同的特征：\n\n-   值对象没有身份，是不可变的，并且始终是有效的。它们封装了领域模型中的特定值。\n\
  -   实体拥有身份，其有效性取决于其状态。实体可以包含值对象作为其结构的一部分。\n\n当我们实体和值对象结合起来时，就得到了聚合。Eric Evans 将聚合定义为一组关联对象，我们将它们视为一个数据更改的单元。聚合确保其边界内部的一致性，通常封装了领域中紧密相关的的一个或多个实体和值对象。\n\
  \n一个聚合有一个聚合根，它是与聚合交互的入口。聚合根控制对聚合内其他实体的控制访问，并确保对聚合的所有更改都以一致的方式发生。聚合的一个关键特性是定义良好的事务边界，这意味着聚合内部的更改要么完全成功，要么失败。它确保了跨系统的数据一致性和完整性。\n\
  \n让我们考虑一个足球管理应用程序中的 `Team` 聚合示例。`Team` 是聚合根，控制对其 `Player` 实体的访问。每个 `Team` 可以拥有一个球员列表，但对\
  \ `Team` 的操作（如添加或删除球员）必须遵循特定规则，例如维护 23 人的最大员名单人数。\n\n以下是 `Team` 聚合的示例：\n\n```java\n\
  public class Team {\n    private final String fifaCode;\n    private final String\
  \ name;\n    private final List<Player> players = new ArrayList<>();\n    private\
  \ static final int MAX_PLAYERS = 23;\n\n    public Team(String fifaCode, String\
  \ name) {\n        Objects.requireNonNull(fifaCode, \"FIFA code is required\");\n\
  \        Objects.requireNonNull(name, \"Team name is required\");\n        this.fifaCode\
  \ = fifaCode;\n        this.name = name;\n    }\n\n    public String getFifaCode()\
  \ {\n        return fifaCode;\n    }\n\n    public String getName() {\n        return\
  \ name;\n    }\n\n    public List<Player> getPlayers() {\n        return Collections.unmodifiableList(players);\n\
  \    }\n\n    public void addPlayer(Player player) {\n        Objects.requireNonNull(player,\
  \ \"Player is required\");\n        if (players.size() >= MAX_PLAYERS) {\n     \
  \       throw new IllegalArgumentException(\"Cannot add more than \" + MAX_PLAYERS\
  \ + \" players\");\n        }\n        players.add(player);\n    }\n\n    public\
  \ void removePlayer(Player player) {\n        Objects.requireNonNull(player, \"\
  Player is required\");\n        players.remove(player);\n    }\n}\n```\n\n在这个示例中，`Team`\
  \ 是聚合根，负责管理其内部状态并对其的 `Player` 实体执行规则。你只能通过 `Team` 聚合根添加或删除球员，这确保了团队永远不会超过最大人数，并且所有业务规则都以一致的方式执行。\n\
  \n聚合确保了对其内部状态的任何修改都通过根发生，并且所有更改都遵循必要的验证规则。这种方法为聚合内部提供了数据完整性。\n\n聚合最关键的方面之一是它的事务边界。聚合内部的任何更改（无论是添加球员还是更新团队名称）必须作为单个事务的一部分发生。要么聚合内的所有更改都成功应用，要么全部失败。它保持了聚合的内部状态。\n\
  \n聚合通过定义清晰边界，限制系统其他部分与聚合内部细节的交互，有助于控制复杂度。系统的其他组件应该只与聚合根交互，而不应修改聚合内部实体。\n\n正如我们看到的，聚合和聚合根定义了清晰的事务边界，并在这些边界内执行业务规则。然而，某些职责超出了聚合的处理范围，特别是在处理跨聚合交互时。这就是服务的用。服务封装了不属于聚合或实体的领域逻辑。\n\
  \n在下一节中，我们将探索服务及其作用，讨论它们如何通过管理跨边界的交互来补充聚合。结合聚合理解服务对于构建健壮的领域模型至关重要。\n\n## 服务及其作用\n\
  \n软件开发中定义服务具有挑战性，因为这个词已广泛应用于架构概念，例如面向服务的架构 (SOA) 和微服务。但在 DDD 中，服务一词有明确定义，正如 Eric\
  \ Evans 在他的 DDD 书中解释的那样：\n\n> 如果领域中的重要过程或转换不是 ENTITY 或 VALUE OBJECT 的自然责任，请将操作作为独立接口添加到模型中声明为\
  \ SERVICE。使用模型的语言定义接口，并确保操作名称是通用语言（Ubiquitous Language）的一部分。使 SERVICE 是无状态的。\n>\
  \ -Eric Evans\n\n| 注意：为了便于探讨该主题，建议读者在整个章节中假设术语一词是指 DDD 中定义的概念。 |\n\n\n\n\n\n当领域逻辑不自然属于某个实体或值对象时，服务（Service）充当了关键组件。它协调不同组件（如实体、值对象和存储库）之间的交互。服务对于处理这些组件之间复杂的业务流程和交互至关重要。服务可以分为以下类型：\n\
  \n*   **应用服务 (Application services)**：作为领域层的入口点，协调实体和值对象等领域对象以满足特定的用例。它们通常不包含业务逻辑，而是负责编排领域行为并管理应用流。\n\
  *   **领域服务 (Domain services)**：持有不自然属于任何特定实体或值对象的业务逻辑。它们代表涉及多个实体的操作，或无法整齐地放入特定实体中的抽象领域逻辑。\n\
  *   **基础设施服务 (Infrastructure services)**：管理如文件处理、发送电子邮件以及与外部系统或数据库交互等技术问题。它们关注与基础设施相关的任务，通常支持领域服务或应用服务，但处于领域逻辑之外。\n\
  \n下表显示了不同类型的服务。需要注意的是，协同的服务可以为你的组织和项目带来巨大收益。通常，避免让单个服务处理整个类型的职责，因为这样难以维护，而且极其难以阅读和理解其业务。\n\
  \n| 服务类型 | 说明 | 目的 | 示例 |\n| :--- | :--- | :--- | :--- |\n| 应用服务 | 协调领域交互并管理应用流\
  \ | 协调领域对象以满足用例 | 通过协调 `Player`、`Team` 和 `Finance` 实体来招聘球员 |\n| 领域服务 | 封装不属于特定实体的领域逻辑\
  \ | 代表跨多个实体的业务逻辑 | 根据居住国对球员工资进行货币转换 |\n| 基础设施服务 | 处理技术问题和外部系统交互 | 提供技术支持（文件 I/O、电子邮件、数据库交互）\
  \ | 在招聘球员时发送电子邮件通知 |\n\n表 3.1：DDD 中不同类型的服务\n\n让我们通过足球队的的示例来探索这些概念，以便更好地理解服务是如何工作的。\n\
  \n我们将创建一个 `HiringService` 来处理招聘流程，与领域对象（`Player`、`Team`）和其他服务（`FinanceService`、`EmailService`）交互。该服务代表一个应用服务，因为它协调了多个实体和服务的领域逻辑来满足业务用例。\n\
  \n以下代码显示了 `HiringService` 如何作为编排器工作，充当 `Team`、`Player`、`Finance` 和 `Notification`\
  \ 服务之间的桥梁：\n\n```java\npublic class HiringService {\n\n    private final FinanceService\
  \ financeService;\n    private final EmailService emailService;\n\n    public HiringService(FinanceService\
  \ financeService, EmailService emailService) {\n        this.financeService = financeService;\n\
  \        this.emailService = emailService;\n    }\n\n    public void hirePlayer(Team\
  \ team, Player player, MonetaryAmount salary) {\n        if (!team.canAdd()) {\n\
  \            throw new IllegalStateException(\"Team already has maximum players\"\
  );\n        }\n        financeService.processSalary(player, salary);\n        team.add(player);\n\
  \        emailService.sendHiringNotification(player, team);\n        System.out.println(\"\
  Player \" + player.getName() + \" hired for team \" + team.getName());\n    }\n\
  }\n```\n\n`HiringService` 协调了 `Team` 和 `Player` 对象之间的交互，作为应用服务工作。它确保团队可以添加球员、通过\
  \ `FinanceService` 处理球员工资，并使用 `EmailService` 发送招聘通知。\n\n`FinanceService` 处理了不自然属于任何特定实体的工资相关业务逻辑，使其成为我们示例中领域服务的清晰例子：\n\
  \n```java\npublic class FinanceService {\n\n    public void processSalary(Player\
  \ player, MonetaryAmount salary) {\n        // Process salary payment logic here\n\
  \        System.out.println(\"Processing salary of \" + salary + \" for player \"\
  \ + player.getName());\n    }\n}\n```\n\n最后，我们的基础设施服务 `EmailService` 负责在招聘球员时发送电子邮件通知，代表了处理通信相关技术任务的基础设施服务：\n\
  \n```java\npublic class EmailService {\n    public void sendHiringNotification(Player\
  \ player, Team team) {\n        // Email sending logic here\n        System.out.println(\"\
  Email sent: Player \" + player.getName() + \" hired by team \" + team.getName());\n\
  \    }\n}\n```\n\n服务是编排领域逻辑和管理复杂业务流程的强大工具。然而，最终我们需要存储这些信息，这意味着使用任何数据库引擎，它们都依赖存储库（Repositories）来与持久层交互并管理数据访问。在下一节中，我们将探索如何构建存储库，使服务能够有效地持久化和检索实体及值对象。存储库在抽象数据库交互和确保清晰、可维护的代码方面至关重要。\n\
  \n## 实现存储库\n\n在使用关系数据库或 NoSQL 解决方案开发软件时，我们通常需要处理数据持久化。存储库模式（Repository pattern）是\
  \ DDD 的核心，专注于抽象持久化和存储的细节，允许业务逻辑保持整洁并专注于领域关注。存储库提供了一个以领域为中心的接口来与数据交互，而不暴露数据如何存储的技术细节。正如\
  \ Eric Evans 在《领域驱动设计》中所写道：\n\n“存储库将从数据库检索的数据映射到一种结构中，并提供一个访问领域对象的接口。”\n—Eric Evans\n\
  \n存储库模式允许开发者在处理领域通用语言（Ubiquitous Language）的同时抽象基础设施细节。这样一来，业务逻辑就不需要考虑特定于数据库的查询、更新或数据操作。一个常见的错误是在存储库中误用术语。例如，在一个关注汽车或书籍的领域中，最好根据领域的通用语言来命名存储库，例如汽车使用\
  \ `Garage`，书籍使用 `Library`，而不是使用诸如 `CarRepository` 或 `BookRepository` 等技术术语。虽然添加\
  \ `Repository` 作为后缀使类更容易识别，但它削弱了对领域的关注。\n\n以下是一个 `Library` 接口的示例，它作为管理书籍集合的存储库。提供的操作是以领域为中心的，专注于注册、查找和注销书籍，同时抽象了底层的存储机制。\n\
  \n```java\nimport java.util.Optional;\n\npublic interface Library {\n    Book register(Book\
  \ book); // insert into the collection\n    Optional<Book> findByTitle(String title);\n\
  \    void unregister(Book book); // to remove\n}\n```\n\n相比之下，数据访问对象（DAO）模式暴露了与数据库相关的操作，如插入、更新或删除记录。DAO\
  \ 提供了较低层次的抽象并直接与数据库交互，而存储库模式专注于领域逻辑，形成对比，如下代码所示：\n\n```java\npublic interface BookDAO\
  \ {\n    Optional<Book> findById(String id);\n    void insert(Book book);\n    void\
  \ update(Book book);\n    void deleteByTitle(String title);\n}\n```\n\n下表是 DAO 和存储库模式的对比，强调了它们在关注点、抽象程度以及在应用程序中作用方面的差异：\n\
  \n| 维度 | DAO | Repository |\n| :--- | :--- | :--- |\n| 关注点 | 技术性、与数据库相关的 | 以领域为中心，专注于业务逻辑\
  \ |\n| 抽象层次 | 低层（数据库查询、操作） | 高层（抽象数据存储细节） |\n| 术语使用 | 通常是技术性的（插入、更新、删除） | 通用语言（注册、查找等）\
  \ |\n\n\n\n\n\n| 直接数据处理 | 显式数据库交互 | 从领域中隐藏数据库交互 |\n| :--- | :--- | :--- |\n| 用法\
  \ | 显式处理 CRUD 操作 | 管理领域对象和状态变化 |\n| 示例 | `insert(Book book)` | `register(Book book)`\
  \ |\n\n表 3.2：DAO 与 Repository 模式的区别\n\nRepository 模式在 DDD（领域驱动设计）中起着至关重要的作用，它通过抽象存储和持久化细节，允许业务逻辑专注于领域。与\
  \ `DAOs`（更偏向技术且直接暴露数据库操作）不同，仓库提供了一个与领域通用语言（Ubiquitous Language）一致的高级接口。这种抽象确保了领域逻辑不会被基础设施关注点污染，从而了代码的整洁和可维护性。后续，仓库将成为领域层与持久化层之间的桥梁。\n\
  \n## 结论\n\n在本章中，我们探讨了 DDD 的战术方面，重点关注实体、值对象、聚合、服务和仓库等关键模式的实现。通过这些组件，我们演示了如何将 DDD\
  \ 原则引入代码中，使你的应用程序反映业务领域，并且是健壮、可维护且能够处理复杂性的。从理解贫血模型的陷阱、到通过丰富的领域逻辑增强实体，再到利用值对象和服务实现更精确的关注点点离，我们强调了设计与业务领域深度对齐的软件的重要性。\n\
  \n在你应用 DDD 时，验证和测试这些战术模式对于确保它们在系统内正确运行至关重要。在下一章中，我们将探索如何测试 DDD 组件，重点验证领域逻辑、强制业务规则并确保聚合与服务之间的数据一致性。测试这些元素将提供信心，确保\
  \ DDD 的实现满足业务需求，并在需求演变时保持灵活性。\n\n## 记忆点\n\n- 实体由身份而非属性定义：实体即使属性发生变化，也会随时间推保持其身份。身份确保了领域内的连续性和可追溯性。\n\
  - 值对象是不可变的且缺乏身份：它们代表完全由其属性定义的概念，在创建后不应被修改。相反，当需要更改时，应该创建一个新实例。\n- 贫血模型是一种反模式：避免使用只有\
  \ getter 和 setter 的 `POJOs`。相反，将领域逻辑封装在实体内部，以确保一致性和可维护性。\n- 聚合在边界内强制一致性：聚合将相关的实体和值对象组合在一起，确保它们内部的变化作为一个单个事务单元发生。\n\
  - 聚合根控制访问：只有聚合根应该管理对其内部实体的更新，防止外部组件的直接修改。\n- 服务封装不属于实体的领域逻辑：使用领域服务处理跨越多个实体的业务操作，使用应用服务协调工作流。\n\
  - 仓库抽象数据持久化：仓库使用通用语言访问领域对象，确保领域模型不被数据库逻辑污染。\n- DAO 关注数据库操作，而仓库以领域为中心：DAO 显式地管理 CRUD\
  \ 操作，而仓库提供了关注业务逻辑的高层级抽象。\n- 使用构建器（builders）或流式 API 创建复杂对象：这些模式在构建实体时确保了正确的验证并强制执行了所需的属性。\n\
  - 命名应与通用语言保持一致：避免冗余或技术性的命名，选择反映业务领域的名称以提高清晰度和可维护性。\n\n## 单选题\n\n1. DDD 中实体的一个关键特征是什么？\n\
  \   a. 它始终是不可不可的\n   b. 它有一个唯一的身份\n   c. 它仅由属性定义\n   d. 它可以被值对象替换\n\n2. 在 DDD 中设计实体时常见的陷阱是什么？\n\
  \   a. 使用不可变对象\n   b. 创建具有领域逻辑的热模型\n   c. 使用贫血模型\n   d. 使用值对象代替实体\n\n3. 哪种陈述最符合\
  \ DDD 中的值对象？\n   a. 一个由属性定义的可变对象\n   b. 一个具有身份和生命周期的对象\n   c. 一个没有身份的不可变对象\n   d.\
  \ 一个包含业务规则的数据库对象\n\n4. Repository 在 DDD 中的主要作用是什么？\n   a. 管理低级数据库查询和 CRUD 操作\n \
  \  b. 抽象存储并提供对领域对象的访问\n   c. 处理领域逻辑的验证\n   d. 管理文件 I/O 等技术关注点\n\n5. 下哪项不是 DDD 中的服务类型？\n\
  \   a. 应用服务\n   b. 基础设施服务\n   c. 工具服务\n   d. 领域服务\n\n6. 仓库和 DAO 的主要区别是什么？\n   a.\
  \ 仓库以领域为中心，而 DAO 关注技术性的 CRUD 操作\n   b. 仓库处理基础设施，而 DAO 处理业务逻辑\n   c. 仓库与低级查询工作，而\
  \ DAO 抽象数据库\n   d. 仓库用于 NoSQL，而 DAO 用于关系型数据库\n\n7. DDD 中的聚合（Aggregate）是什么？\n   a.\
  \ 无关对象的集合\n   b. 一组被视为整体处理的关联对象\n   c. 一个没有任何身份的富行为对象\n   d. 一个没有任何事务边界的实体簇\n\n\
  8. 当存在复杂业务规则时，使用哪种模式来简化对象创建？\n   a. 单例模式\n   b. 原型模式\n   c. 构建器模式 (Builder pattern)\n\
  \   d. 工厂模式\n\n9. 何时你应该使用领域服务？\n   a. 当操作跨越多个实体或不自然属于某个特定实体时\n   b. 当你需要管理应用流时\n\
  \   c. 当管理发送邮件等基础设施关注点时\n   d. 当验证用户输入时\n\n10. 下哪项确保聚合内部的变化要么完全成功要么完全失败？\n    a.\
  \ 事务边界\n    b. 最终一致性\n    c. 应用服务\n    d. 仓库模式\n\n### 答案\n\n| 题号 | 选项字母 |\n| :---\
  \ | :--- |\n| 1. | b. |\n| 2. | c. |\n| 3. | c. |\n| 4. | b. |\n| 5. | d. |\n| 6.\
  \ | a. |\n| 7. | b. |\n| 8. | c. |\n| 9. | a. |\n| 10. | a. |\n\n## 参考文献\n\n1. Evans,\
