  \ ProductDTO\n\n`ProductDTO` 类作为产品的 DTO，确保只通过 API 暴露必要信息，同时保持内部领域模型的纯洁。通过使用此 DTO，我们将领域逻辑与外部表示解耦，防止了不必要的依赖，并降低了暴露实现细节的风险。这种结构化的方法允许在修改外部契约时保持灵活性，而不影响核心业务逻辑。\n\
  \n```java\n@Schema(description = \"代表产品。\")\n@JsonbVisibility(FieldVisibilityStrategy.class)\n\
