  \n\n\n\n## 在 Spring Boot 中应用 DDD\n\n## 技术要求\n\n在本章中，我们将使用 `Spring` 平台。我们将使用内存数据库。这样可以避免任何复杂性以及基础设施的准备，例如\
  \ `Docker` 或数据库安装。但是，由于我们使用了 `JPA`，也可以使用其他数据库；要实现这一点，我们需要更新 `Driver` 并确保数据库运行正常。\n\
  \n* `Java 21`\n* `Git`\n* `Maven`\n* 任何你偏好的 IDE\n\n## 目标\n\n本章旨在演示 `Spring Framework`\
  \ 如何通过为依赖注入、数据持久化和应用层暴露提供强大的抽象，从而简化企业级应用中 `DDD` 的实现。通过实战示例，我们将探索 `Spring` 生态系统（利用\
  \ `Spring Boot`、`Spring Data JPA` 和其他关键组件）如何帮助开发者专注于业务逻辑，同时高效地管理基础设施相关问题。在本章结束时，读者将理解如何构建一个基于\
  \ `Spring` 的 `DDD` 应用、集成持久化、通过 `RESTful API` 暴露领域逻辑，并通过全面的测试确保系统的健壮性。\n\n## Spring\
  \ Framework 与 DDD 概览\n\n`Spring Framework` 是一个强大的模块化 Java 生态系统平台，简化了企业级应用开发。凭借其轻量级架构，`Spring`\
  \ 提供了一个与 `DDD` 无缝衔接的全面工具包，使其成为构建复杂的业务驱动型应用的理想选择。核心特性（如依赖注入、事务管理和数据访问）允许开发者专注于领域逻辑建模，而不会被基础设施问题所负担。此外，`Spring`\
  \ 对注解大量的使用为 `DDD` 概念提供了方便的快捷方式，使开发者能够精确地表示领域服务、存储库和聚合。\n\n`Spring` 注解简化了代码并有助于明确类和组件的领域角色。是一些示例：\n\
  \n* `@Service` 注解代表领域服务，业务逻辑和领域动作位于此处。这些服务运行在业务逻辑层，并协调跨聚合或实体的操作。\n* `@Repository`\
  \ 注解封装了数据的存储和检索，代表了 `DDD` 推广的 `Repository` 模式。存储库关注持久化层，在存储和检索领域对象的同时抽象了基础设施问题。\n\
  * 同时，`@Entity` 模型了具有唯一标识的领域实体，直接映射到数据库表或文档，以实现对象关系映射。\n* 最后，`@Component` 是一个更通用的注解，可以支持聚合或基础设施问题，允许灵活集成非领域特定的特定组件。\n\
  \n正如在第 4 章《测试与验证 DDD 应用》中所讨论的，通过测试验证代码设计可以确保应用符合 `DDD` 原则。`jMolecules` 是一个强大的设计验证工具，通过在任何平台上的测试引入了设计检查。在\
  \ `Spring` 生态系统中使用它更进了一步：它的注解与 `Spring Data JPA` 和 `Spring Data MongoDB` 集成，使得面向\
  \ `DDD` 的注解能够影响代码结构和持久化行为。通过这种集成，`Spring` 将领域模型与基础设施连接，通过良好的结构强化了 `DDD` 原则。\n\n\
  `Spring` 的特性天然支持 `DDD` 实践，使得创建架构良好的领域模型变得更加。例如，`Spring Data JPA` 简化了 `Repository`\
  \ 模式和抽象实体持久化，有助于建模存储库并管理聚合根。同样，`Spring Data MongoDB` 允许在 `NoSQL` 数据库中对聚合根进行持久化，为非关系上下文下的\
  \ `DDD` 提供了天然契合。凭借其约定优于配置的方法，`Spring Boot` 简化了基于 `DDD` 的服务的设置并促进了整洁架构（Clean Architecture）。\n\
  \n`Spring Integration` 支持领域事件和消息驱动架构，这在事件驱动的 `DDD` 应用中至关重要。同时，`Spring 面向切编程 (AOP)`\
  \ 管理日志和事务控制等交叉关注点，保持领域逻辑的纯洁并与基础设施问题隔离。\n\n下表引入了 `Spring` 以及它如何使用 `DDD` 增强设计。必须强调的是\
  \ `Spring` 是一个巨大的技术栈。如果使用 `Spring`，值得检查这些元素。下表介绍了一组相关的技术和依赖：\n\n| Spring 特性 | DDD\
  \ 应用 |\n| :--- | :--- |\n| `Spring Data JPA` | 自动化 `Repository` 模式；简化实体持久化 |\n|\
  \ `Spring Data MongoDB` | 允许在 `NoSQL` 中对聚合根持久化；符合 `DDD` |\n| `Spring Boot` | 约定优于配置快速设置基于\
  \ `DDD` 的服务 |\n| `Spring Integration` | 支持领域事件和消息驱动架构 |\n| `Spring AOP` | 处理日志和事务控制等交叉关注点\
  \ |\n\n表 9.1：使用 Spring 应用 DDD\n\n`Spring` 的另一个核心特性是它的依赖注入框架，它允许将对象自动提供到需要它们的类中。`@Autowired`\
  \ 注解是此过程的核心，它在无需手动配置的情况下简化了依赖管理。依赖注入可以通过字段注入或构造函数注入实现，尽管 `Spring` 团队推荐构造函数注入，因为其具有清晰性和不可变性的益处。基于构造函数的注入在\
  \ `DDD` 背景下特别有价值，它确保了在创建对象时所有必要的依赖都是用的。这支持了 `DDD` 对稳定、自包含领域模型的强调。虽然字段注入是可能的，但通常不被推荐，因为它降低了可见性并可能增加测试的复杂度。通过构造函数强制执行依赖，`Spring`\
  \ 有助于构建符合 DDD` 封装和边界边界原则的整洁、可维护且可测试的代码库。\n\n在 `DDD` 应用中，依赖注入通过允许将服务和存储库精确注入到需要的地方而无需直接管理依赖，促进了关注点的分离。这种方法使依赖显式化，增强了层与层之间的边界，并改进了模块化和可维护性。\n\
  \n在接下来的章节中，我们将从概念转向实践。我们将通过真实的代码示例看到如何用 `Spring` 实现 `DDD`，包括在服务和存储库中使用 `@Autowired`\
  \ 进行构造函数注入。这种实践方法将演示如何利用 `Spring` 特性创建结构化、可扩展的 `DDD` 架构。\n\n## 在 Spring Boot 中应用\
  \ DDD\n\n为了演示 `Spring` 如何支持 `DDD`，我们将使用 `Spring` 和 `H2`（内存关系型数据库）构建一个酒店管理示例项目。在实际应用中，会使用\
  \ `PostgreSQL` 等数据库；但为了学习，我们将依靠设置更简单的数据库，以便专注于与 `Spring` 的集成。\n\n 创建并设置新的 Spring\
  \ Boot 项目\n\n设置项目非常简单，这源于 `Spring` 的 `Spring Initializr`，它可以快速生成 `Spring Boot` 项目。为了支持应用的需求，我们将包含以下依赖项：`Spring\
  \ Web` 用于启用 `RESTful` Web 服务，`Spring Data JPA` 用于简化数据访问，以及 `H2` 用于内存数据库。\n\n\n\n\
  \n\n创建项目后，我们将在 `application.properties` 文件中配置 H2 数据库。遵循“云原生应用”（Twelve-Factor App）原则的最佳实践，Spring\
  \ 允许配置在不同环境中灵活且易于管理。对于本地开发，我们直接在 `application.properties` 中设置数据库属性；对于生产环境，我们可以使用环境变量覆盖它们，以确保敏感凭据的安全。以下是一个配置示例如：\n\
  \n```properties\nspring.application.name=chapter-09\nspring.datasource.url=jdbc:h2:mem:testdb\n\
  spring.datasource.driverClassName=org.h2.Driver\nspring.datasource.username=sa\n\
  spring.datasource.password=password\nspring.jpa.database-platform=org.hibernate.dialect.H2Dialect\n\
  spring.jpa.defer-datasource-initialization=true\nspring.h2.console.enabled=true\n\
  ```\n\n此配置设置了一个带有控制台界面的 H2 ，方便我们在测试应用程序时检查表和数据。\n\n### 定义核心领域实体\n\n配置完成后，我们可以使用以下代码为酒店管理系统定义核心领域实体：`Guest`（客人）和\
  \ `Room`（房间）。这些实体代表了关键业务概念，并包含了持久化注解。`Guest` 实体拥有 ID、证件号和姓名，而 `Room` 实体包含房号以及客人的引用，反映了房间与客人之间的关系。\n\
  \n```java\n@Entity\npublic class Guest {\n    @Id\n    @GeneratedValue(strategy\
  \ = GenerationType.IDENTITY)\n    private Long id;\n\n    @Column\n    private String\
  \ documentNumber;\n\n    @Column\n    private String name;\n\n    // Getters and\
  \ Setters\n}\n```\n\n在 `Guest` 实体中，我们定义了基本属性以及用于数据库标识的自动生成 ID。\n\n```java\n@Entity\n\
  public class Room {\n    @Id\n    @GeneratedValue(strategy = GenerationType.IDENTITY)\n\
  \    private Long number;\n\n    @ManyToOne\n    @JoinColumn(name = \"guest_id\"\
  , referencedColumnName = \"id\")\n    private Guest guest;\n\n    // Getters and\
  \ Setters\n}\n```\n\n在 `Room` 实体中，每个房间都有唯一的编号，并可能与客人关联，代表了入住关系。\n\n### 构建存储库和服务层\n\
  \n接下来，我们创建用于数据访问的存储库（Repository）接口。使用存储库模式通过集中数据操作来符合 DDD（领域驱动设计）的原则，而 Spring Data\
  \ JPA 为该模式提供了内置支持。通过扩展 `JpaRepository`，我们获得了基本的 CRUD 操作，并能够按照约定定义查询方法的灵活性，Spring\
  \ 会自动解析并实现这些方法。\n\n```java\n@Repository\npublic interface GuestRepository extends\
  \ JpaRepository<Guest, Long> {\n    Optional<Guest> findByDocumentNumber(String\
  \ documentNumber);\n}\n```\n\n`GuestRepository` 接口包含一个通过证件号查找客人的方法。同样，`RoomRepository`\
  \ 接口提供了检查房间是否空以及通过房号检索房间的方法。\n\n```java\n@Repository\npublic interface RoomRepository\
  \ extends JpaRepository<Room, Long> {\n    Optional<Room> findByGuestIsNull();\n\
  \    Optional<Room> findByNumber(Long number);\n}\n```\n\n为了协调跨实体的数据操作，我们实现了一个 `RoomService`\
  \ 类，作为管理房间和客人的业务业务。Spring 通过构造函数处理依赖注入，简化了将存储库连接到服务的过程。在这里，构造函数上的 `@Autowired` 注入了\
  \ `RoomRepository` 和 `GuestRepository`，允许 `RoomService` 执行入住、退房以及其他操作。\n\n```java\n\
  @Service\npublic class RoomService {\n    private final RoomRepository roomRepository;\n\
  \    private final GuestRepository guestRepository;\n\n    public RoomService(RoomRepository\
  \ roomRepository, GuestRepository guestRepository) {\n        this.roomRepository\
  \ = roomRepository;\n        this.guestRepository = guestRepository;\n    }\n\n\
  \    public List<Room> findRooms(PageRequest pageRequest) {\n        Page<Room>\
  \ page = roomRepository.findAll(pageRequest);\n        return page.getContent();\n\
  \    }\n\n    @Transactional\n    public Room checkIn(Room room) {\n        Room\
  \ roomEntity = roomRepository.findByNumber(room.getNumber())\n            .orElseThrow(()\
  \ -> new EntityNotFoundException(\"Room not found, the room number is \" + room.getNumber()));\n\
  \        Guest guest = guestRepository.findByDocumentNumber(room.getGuest().getDocumentNumber())\n\
  \            .orElseGet(() -> guestRepository.save(room.getGuest()));\n        roomEntity.setGuest(guest);\n\
  \        return roomRepository.save(roomEntity);\n    }\n\n    @Transactional\n\
  \    public void checkOut(Room room) {\n        Room roomEntity = roomRepository.findByNumber(room.getNumber())\n\
  \            .orElseThrow(() -> new EntityNotFoundException(\"Room not found, the\
  \ room number is \" + room.getNumber()));\n        roomEntity.setGuest(null);\n\
  \        roomRepository.save(roomEntity);\n    }\n\n    public Optional<Room> reservation(Long\
  \ number) {\n        return roomRepository.findByNumber(number);\n    }\n\n    public\
  \ Long countBy() {\n        return roomRepository.count();\n    }\n\n    public\
  \ Optional<Room> findEmptyRoom() {\n        return roomRepository.findByGuestIsNull();\n\
  \    }\n}\n```\n\n`RoomService` 类协调了两个存储库之间的操作。它包含了查找房间、处理入住和退房以及识别空房的方法。`checkIn`\
  \ 方法通过房号查找房间，并根据证件号检查客人是否存在。如果不存在，则创建一个新的 `Guest` 并与房间关联。`checkOut` 则清空房间的客人分配，以便未来预留。\n\
  \n在这个示例中，我们看到了 Spring 的注解和依赖注入如何简化了 DDD 面向系统的开发。\n\n### 通过 REST 端点暴露服务\n\n服务层完成后，我们现在可以通过\
  \ `HotelController` 将其暴露给应用层。该控制器作为 API 层，允许外部系统或前端客户端与应用程序交互。它使用 HTTP 端点处理与房间管理相关的请求，并作为客户端与\
  \ `RoomService` 之间的桥梁。\n\n```java\n@RestController\n@RequestMapping(\"/hotels\"\
  )\npublic class HotelController {\n    private static final Logger LOGGER = Logger.getLogger(HotelController.class.getName());\n\
  \    private final RoomService roomService;\n\n    @Autowired\n    public HotelController(RoomService\
  \ roomService) {\n        this.roomService = roomService;\n    }\n\n    @GetMapping\n\
  \    public ResponseEntity<List<Room>> getRooms(@RequestParam(defaultValue = \"\
  0\") int page,\n                                              @RequestParam(defaultValue\
  \ = \"10\") int size) {\n        LOGGER.info(\"Finding rooms page: \" + page + \"\
  \ size: \" + size);\n        PageRequest pageRequest = PageRequest.of(page, size);\n\
  \        List<Room> rooms = roomService.findRooms(pageRequest);\n        LOGGER.info(\"\
  Found rooms: \" + rooms.size());\n        return ResponseEntity.ok(rooms);\n   \
  \ }\n\n    @GetMapping(\"/{number}\")\n    public ResponseEntity<Room> getReservation(@PathVariable\
  \ Long number) {\n        LOGGER.info(\"Finding reservation: \" + number);\n   \
  \     var room = roomService.reservation(number)\n            .orElseThrow(() ->\
  \ new EntityNotFoundException(\"Room not found with number \" + number));\n    \
  \    return ResponseEntity.ok(room);\n    }\n\n    @PutMapping\n    public ResponseEntity<Room>\
  \ checkIn(@RequestBody Room room) {\n        LOGGER.info(\"Check in: \" + room);\n\
  \        Room checkedInRoom = roomService.checkIn(room);\n        return ResponseEntity.ok(checkedInRoom);\n\
  \    }\n\n    @DeleteMapping(\"/{number}\")\n    public ResponseEntity<Void> checkOut(@PathVariable\
  \ Long number) {\n        LOGGER.info(\"Check out: \" + number);\n        Room room\
  \ = roomService.reservation(number)\n            .orElseThrow(() -> new EntityNotFoundException(\"\
  Room not found with number \" + number));\n        roomService.checkOut(room);\n\
  \        return ResponseEntity.noContent().build();\n    }\n}\n```\n\n\n\n\n\n`HotelController`\
  \ 定义了对应应用程序主要操作的 RESTful 端点。`@RestController` 注解告诉 Spring 将此类视为 Web 控制器并自动将响应转换为\
  \ JSON 格式。我们使用构造函数注入将 `RoomService` 注入到 `HotelController` 中，遵循了 Spring 推荐的依赖管理最佳实践，这些资源如下：\n\
  \n* `GET /hotels`: 获取所有房间的分页列表。\n* `GET /hotels/{number}`: 根据房间号获取特定的房间预订。\n* `PUT\
  \ /hotels`: 通过为客人分配房间来处理其入住手续。\n* `DELETE /hotels/{number}`: 处理退房手续，从房间中清除该客人信息。\n\
  \n### 完善错误处理\n\n为了处理诸如“未找到房间”之类的错误，我们将实现一个自定义的异常处理器，将这些异常转换为有意义的 HTTP 响应。在案例中，我们将使用\
  \ `EntityNotFoundException` 来表示缺失的记录，并将其映射到 `404 Not Found` HTTP 状态。\n\n```java\n\
  @ControllerAdvice\npublic class CustomExceptionHandler {\n\n    @ExceptionHandler(EntityNotFoundException.class)\n\
  \    @ResponseStatus(HttpStatus.NOT_FOUND)\n    public ErrorResponse handleEntityNotFoundException(EntityNotFoundException\
  \ ex) {\n        return new ErrorResponse(\"Entity not found\", ex.getMessage());\n\
  \    }\n\n    public static class ErrorResponse {\n        private String error;\n\
  \        private String message;\n\n        public ErrorResponse(String error, String\
  \ message) {\n            this.error = error;\n            this.message = message;\n\
  \        }\n\n        public String getError() {\n            return error;\n  \
  \      }\n\n        public String getMessage() {\n            return message;\n\
  \        }\n    }\n}\n```\n\n`CustomExceptionHandler` 类使用 `@ControllerAdvice` 全局应用于应用程序。在这里，我们为\
  \ `EntityNotFoundException` 定义了一个 `@ExceptionHandler`，它返回带有自定义错误信息的 `404` 状态。这种方法提供了一种统一处理异常的方式，并确保与\
  \ API 客户端之间的清晰的通信。\n\n### 通过单元测试确保代码行为\n\n测试是 Spring 的显著特性之一，它使得独立或组合地测试每一层变得简单。我们将从仓库测试开始，验证自定义查询和\
  \ JPA 功能，然后是服务测试以检查业务逻辑，最后是控制器测试以模拟 HTTP 请求并验证 API 端点。\n\n测试仓库层涉及验证数据库操作（特别是自定义查询）是否按预期工作。使用\
  \ `@DataJpaTest` 和 `H2`，我们可以用最少的设置测试数据库交互。\n\n```java\n@DataJpaTest\nclass GuestRepositoryTest\
  \ {\n\n    @Autowired\n    private GuestRepository guestRepository;\n\n    @BeforeEach\n\
  \    void setUp() {\n        guestRepository.deleteAll();\n    }\n\n    @Test\n\
  \    void shouldSaveAndRetrieveGuestByDocumentNumber() {\n        Guest guest =\
  \ new Guest(\"123456789\", \"John Doe\");\n        guestRepository.save(guest);\n\
  \        Optional<Guest> retrievedGuest = guestRepository.findByDocumentNumber(\"\
  123456789\");\n        assertThat(retrievedGuest).isPresent()\n            .get().extracting(Guest::getName)\n\
  \            .isEqualTo(\"John Doe\");\n    }\n\n    @Test\n    void shouldReturnEmptyWhenGuestNotFoundByDocumentNumber()\
  \ {\n        Optional<Guest> retrievedGuest = guestRepository.findByDocumentNumber(\"\
  999999999\");\n        assertThat(retrievedGuest).isNotPresent();\n    }\n}\n```\n\
  \n服务层测试允许我们验证业务逻辑，包括仓库之间的协调。使用 `@SpringBootTest` 和 `H2`，我们可以在服务上运行集成测试。\n\n```java\n\
  @SpringBootTest\n@Transactional\nclass RoomServiceTest {\n\n    @Autowired\n   \
  \ private RoomService roomService;\n    @Autowired\n    private RoomRepository roomRepository;\n\
  \    @Autowired\n    private GuestRepository guestRepository;\n\n    @BeforeEach\n\
  \    void setUp() {\n        roomRepository.deleteAll();\n        guestRepository.deleteAll();\n\
  \    }\n\n    @Test\n    void shouldCheckInGuestWhenGuestExists() {\n        Guest\
  \ guest = guestRepository.save(new Guest(\"123456789\", \"John Doe\"));\n      \
  \  Room room = roomRepository.save(new Room(6L, null));\n        room.setGuest(guest);\n\
  \        Room checkedInRoom = roomService.checkIn(room);\n        assertThat(checkedInRoom.getGuest()).isEqualTo(guest);\n\
  \    }\n\n    @Test\n    void shouldThrowExceptionWhenRoomNotFoundForCheckIn() {\n\
  \        Room room = new Room();\n        room.setNumber(3L);\n        assertThatThrownBy(()\
  \ -> roomService.checkIn(room))\n            .isInstanceOf(EntityNotFoundException.class);\n\
  \    }\n}\n```\n\n控制器测试模拟 HTTP 请求并验证响应。使用 `@SpringBootTest` 和 `MockMvc`，我们可以验证 `HotelController`\
  \ 是否按预期处理请求。\n\n```java\n@SpringBootTest\n@AutoConfigureMockMvc\nclass HotelControllerTest\
  \ {\n\n    @Autowired\n    private MockMvc mockMvc;\n    @Autowired\n    private\
  \ RoomRepository roomRepository;\n    @Autowired\n    private GuestRepository guestRepository;\n\
  \n    @BeforeEach\n    void setUp() {\n        roomRepository.deleteAll();\n   \
  \     guestRepository.deleteAll();\n    }\n\n    @Test\n    void shouldReturnPagedRooms()\
  \ throws Exception {\n        Room room = roomRepository.save(new Room());\n   \
  \     mockMvc.perform(get(\"/hotels?page=0&size=1\")\n            .contentType(MediaType.APPLICATION_JSON))\n\
  \            .andExpect(status().isOk())\n            .andExpect(jsonPath(\"$\"\
  , hasSize(1)))\n            .andExpect(jsonPath(\"$[0].number\", is(room.getNumber())));\n\
  \    }\n\n    @Test\n    void shouldCheckInGuest() throws Exception {\n        Guest\
  \ guest = guestRepository.save(new Guest(\"123456789\", \"John Doe\"));\n      \
  \  Room room = roomRepository.save(new Room(6L, null));\n        room.setGuest(guest);\n\
  \        String checkInJson = \"\"\"\n        {\n          \"number\": %d,\n   \
  \       \"guest\": {\n            \"documentNumber\": \"123456789\",\n         \
  \   \"name\": \"John Doe\"\n          }\n        }\n        \"\"\".formatted(room.getNumber());\n\
  \        mockMvc.perform(put(\"/hotels\")\n            .contentType(MediaType.APPLICATION_JSON)\n\
  \            .content(checkInJson))\n            .andExpect(status().isOk())\n \
  \           .andExpect(jsonPath(\"$.guest.documentNumber\", is(\"123456789\")))\n\
  \            .andExpect(jsonPath(\"$.guest.name\", is(\"John Doe\")));\n    }\n\
  }\n```\n\n这些测试验证了每一层都按预期工作并支持 DDD 原则。通过提供测试工具，Spring 确保了我们应用程序行为的可靠性。虽然本示例涵盖了核心概念，但\
  \ Spring 的功能还扩展到了安全、高级验证和缓存，这些可以进一步增强应用程序。通过 Spring，我们看到了如何以一种结构化、可维护的方式实现 DDD，在使代码符合业务目标的同时保持未来增长的灵活性。\n\
  \n\n\n\n*   Spring 支持基于环境的配置：可以使用环境变量覆盖应用程序属性，遵循“云云原生应用”（Twelve-Factor App）方法。\n\
  *   异常处理可以集中化：`@ControllerAdvice` 注解允许全局异常处理，使错误响应更具一致。\n*   测试是 Spring 的核心优势：Spring\
  \ 的测试框架支持使用 `H2` 进行集成测试、服务级测试以及使用 `MockMvc` 进行控制器测试。\n*   Spring 关注点分离：通过将应用程序结构为仓库（repositories）、服务（services）和控制器（controllers），Spring\
  \ 强制了整洁且可维护的架构。\n*   Spring Boot 加速设置和开发：约定优于配置（Convention-over-configuration）允许开发者专注于功能而非样板代码。\n\
  *   Spring 的灵活性允许轻松切换：虽然本章使用了 `H2`，但应用程序可以轻松配置使用 `PostgreSQL`、`MySQL` 或 `MongoDB`\
  \ 等数据库。\n\n## 多选题\n\n1. 在 DDD 应用中使用 Spring 的 `@Service` 注解的主要目的是什么？\n   a. 将领域实体映射到数据库表\n\
  \   b. 表示业务逻辑服务\n   c. 定义数据库仓库接口\n   d. 管理日志等横切关注点\n   e. 处理异常过程\n\n2. 使用哪个依赖项在\
  \ Spring 中创建 RESTful Web 服务？\n   a. Spring Boot Actuator\n   b. Spring Security\n\
  \   c. Spring Web\n   d. Spring Data JPA\n   e. Spring Cloud\n\n3. Spring 团队通常推荐使用哪种注入来管理依赖？\n\
  \   a. 字段注入\n   b. Setter 方法注入\n   c. 构造函数注入\n   d. 静态注入\n   e. 接口注入\n\n4. Spring\
  \ 中使用哪个注解来在整个应用程序中定义自定义异常处理器？\n   a. `@ExceptionHandler`\n   b. `@ControllerAdvice`\n\
  \   c. `@RestController`\n   d. `@ResponseStatus`\n   e. `@EnableWebMvc`\n\n5. Spring\
  \ 中的 `@DataJpaTest` 注解主要支持什么？\n   a. 测试 Web 端点\n   b. 测试整个应用程序上下文\n   c. 服务层的单元测试\n\
  \   d. 测试基于 JPA 的仓库交互\n   e. 测试控制器逻辑\n\n6. 以下哪项是 Spring 中 中构造函数注入的优点？\n   a. 通过隐藏依赖来简化依赖管理\n\
