  \n![QR-Logo](img/fm1.png)\n\n# 第 7 章 DDD 与数据建模\n\n## 引言\n\n鉴于数据库和应用通常使用不同的语言，且根根于不同的范式，在保持有意义的应用层的同时实现高效的数据库设计具有挑战性。在本章中，我们将应对这一挑战，引导你了解领域驱动设计（DDD）和数据库原则，以帮助弥合这些差异。\n\
  \n本章提供了关于在 SQL 和 NoSQL 环境下数据建模的实践见解。通过探索它们的优势和权衡，你将学会使数据库结构与你的应用需求对齐。\n\n## 结构\n\
  \n在本章中，我们将更多地探讨以下主题：\n\n* 数据建模中的 DDD 原则\n* 在 SQL 数据库中进行建模\n* 在 NoSQL 数据库中进行建模\n\n\
  ## 技术要求\n\n我们将使用关系型数据库和 NoSQL 数据库，并使用 `Hibernate` 和 `MongoDB` 驱动与 Java 通信。为了避免额外的配置，我们将使用内存数据库\
  \ `H2` 和嵌入式 `MongoDB` 实例。不过，此配置可以更改，并且可以使用 Docker 代替它来访问代码库。\n\n* Java 21\n* Git\n\
  * Maven\n* 任何你偏好的 IDE\n\n## 目标\n\n本章将使读者具备相应的知识和策略，以设计符合 DDD 原则并利用 SQL 和 NoSQL 数据库的有效数据模型。通过探索关系型数据结构与无模式数据结构之间的差异，理解阻抗匹配（impedance\
  \ mismatch），并实现映射策略，读者将学习如何创建可扩展、适应性系统，并在业务逻辑与数据存储之间保持强连接。本章使用实践示例来指导优化性能和领域完整的数据模型构建。\n\
  \n## 数据建模中的 DDD 原则\n\n无论使用 SQL 还是 NoSQL 数据库，数据库和应用都在不同的范式下运行。例如在 Java 中，代码结构与数据库结构显著不同。这种差异被称为“阻抗匹配”，描述了像\
  \ Java 这样面向对象的语言与关系型及 NoSQL 数据库之间的差距。\n\n在 Java 中，我们使用指针、封装和继承来建立关系。相比之下，SQL 数据库使用表、外键和归一化来表示数据关系。理解这些差异对于有效的数据库管理和应用开发至关重要。\n\
  \n下图通过一个简单的示例说明了这一概念：一个包含 `Address` 实例列表的 `Person` 类。在 Java 中，这种关系通过指针或引用创建，但在 SQL\
  \ 中，相同的关系通过由外键链接的独立表来表示。\n\n![图显示了应用对象（Person 和 Address 类）与各种数据库类型（宽列、图、文档、键值）之间的映射不匹配，强调了结构和数据组织方面的差异。](img/Figure_7.1.png)\n\
  \n图 7.1 应用与数据库之间的距离\n\nJava 与数据库原则之间内在缺乏一致性的阻抗匹配，体现在可以在 Java 中使用抽象、封装和继承，但在数据库中需要维护归一化或反归一化的数据。\n\
  \n为了弥补这一鸿沟，我们在两种范式之间引入了一个翻译器，称为映射层。该层在某种程度上缓解了大多数差异以及对应用方面的影响，例如额外的翻译开销、潜在的行为不以及较低的性能。\n\
  \n除了阻抗匹配，还有其他模式可以帮助数据库与应用的集成。这些模式在倾向于数据库或应用之间波动。\n\n更靠近应用侧的模式通过面向对象编程封装数据并暴露行为来优先考虑语义。\n\
  \n更数据导向且更倾向于数据库侧的模式则关注不可变性和数据暴露。\n\n下表有助于直观每种方法的权衡：\n\n| 维度 | 面向对象编程 | 数据导向编程 |\n\
  | :--- | :--- | :--- |\n| 关注点 | 行为与封装 | 数据暴露与不可变性 |\n| 目标 | 隐藏数据细节；暴露行为 | 暴露数据细节；优先考虑不可变性\
  \ |\n| 主要用途 | 应用级建模（例如，仓库） | 数据库级建模 |\n| 权衡 | 增强的语义，可能存在复杂的抽象 | 简化的数据访问，可能的模型局限\
  \ |\n| 示例 | DDD 仓库、领域服务 | SQL 表、NoSQL 集合 |\n\n表 7.1 面向对象编程 vs. 数据导向编程\n\n让我们关注围绕\
  \ DDD 的方面，特别是，让我们看看图中所示的仓库模式（Repository pattern）。注意，这是一个更靠近应用侧的模式，因此允许我们在 Java 中强调语义、抽象和面向对象的原则。\n\
  \n\n\n\n\n![图展示了数据库（面向数据的编程）与应用程序（面向对象的编程）之间的层级：Active Record、Driver、Data Mapper、DAO\
  \ 和 Repository，以从左到右的步骤描绘。](img/Figure_7.2.png)\n\n图 7.2：基于 Java 数据模式的差距和距离\n\n\
  考虑到阻抗不匹配（impedance mismatch），出现了一个常见问题：我们应该创建不同的实体类来将领域和数据库分开，还是应该将它们都放在同一个类中？虽然使用分离类可以提高灵活性，但也会增加复杂性，并可能引发性能方面的考虑。另一方面，重用同一个类简化了结构，但可能需要可能影响领域模型的适配，特别是在于\
  \ SQL 和 NoSQL 数据库之间切换时。根结底，没有一个万能的答案。一种务实的方法是先为两者都创建一个唯一的实体，然后随着模型的演进在必要时进行重构。\n\
  \n在下一节中，我们将探索如何在 SQL 数据库中进行数据建模，并研究在 SQL 结构内部处理这些差异的方法。\n\n### 在 SQL 数据库中建模数据\n\n\
  当我们讨论关系型数据库时，成熟度通常是首先想到的特征。这项技术已经演变了一个多世纪，积累了丰富的知识、文献和实践案例。关系型（`SQL`）数据库通常是新项目的首选，提供了稳定性、社区支持和广泛的资源。此外，它还受益于一种标准的通信语言：`SQL`，它实现了跨系统的一致性查询。这种标准化使得\
  \ SQL 数据库兼容许多工具和应用程序，简化了数据建模和检索。此外，规范化通过将数据组织成结构化的相关表，防止冗余数据并维护数据完整性。\n\n与关系型数据库结构化和数据驱动的范式不同，DDD\
  \ 强调领域逻辑和应用语义。这种差异也是一种阻抗不匹配，因为它需要一个映射层在数据库表和面向对象的领域模型之间进行转换。\n\n以下是 SQL 数据库与 DDD\
  \ 之间区别的总结：\n\n| 维度 | SQL 数据库 | DDD |\n| :--- | :--- | :--- |\n| 关注点 | 数据一致性、完整性和结构\
  \ | 领域逻辑和行为表示 |\n| 数据关系 | 带外键的规范化表 | 封装的领域实体和值对象 |\n| 访问模式 | 面向数据；针对查询进行了优化 | 面向行为；封装了操作\
  \ |\n| 主要目的 | 数据存储和检索 | 应用中的业务逻辑表示 |\n| 建模范式 | 关系型、表格化 | 面向对象、以行为为中心 |\n\n表 7.2：SQL\
  \ vs DDD\n\n### Jakarta Persistence 实战\n\n为了说明这种集成，让我们考虑一个实际示例。在我们的场景中，我们实现了一个 `Hotel`，它本质上是\
  \ `Room` 实体的集合，每个实体都包含对 `Guest` 的引用。为了简单起见并保持框架独立，我们将使用配合 Hibernate 的 `Jakarta Persistence`（以前称为\
  \ `JPA`）。通过不使用 `Spring` 或 `Quarkus` 生态系统的框架，你的学习将完全关注持久层及其与领域层之间的关系。\n\n注意：在这个示例中，我们隔离了持久层以专门关注这些主题。然而，在实际应用中，`Hotel`\
  \ 类可能会被结构化为 repository，因为入住和退房等操作引入了额外的业务需求，例如处理支付。为了简单起见，我们在此示例中没有使用依赖注入，这通常会简化连接池和其他基础设施问题的处理。在生产环境中，不使用依赖注入可能会导致连接泄漏等问题，但为了学习目的，它允许我们在不增加额外复杂层的情况下关注持久化机制。\n\
  \n在下面的代码块中，我们定义了两个实体类 `RoomJPA` 和 `GuestJPA`，代表酒店房间和客人。`RoomJPA` 类包含了与 `GuestJPA`\
  \ 的 `ManyToOne` 关系，表示客人可以住在多个房间。\n\n```java\n@Entity\nclass RoomJPA {\n    @Id\n\
  \    private Long number;\n\n    @ManyToOne\n    @JoinColumn(name = \"guest_id\"\
  , referencedColumnName = \"id\")\n    private GuestJPA guest;\n}\n\n@Entity\nclass\
  \ GuestJPA {\n    @Id\n    @GeneratedValue(strategy = GenerationType.IDENTITY)\n\
  \    private Long id;\n\n    @Column\n    private String documentNumber;\n\n   \
  \ @Column\n    private String name;\n}\n```\n\n接下来，我们将使用一个 mapper 来管理领域表示和数据库表示之间的结构差异。在这种情况下，我们使用\
  \ `MapStruct` 定义一个 `JPAMapper` 接口，它处理 `Room` 和 `Guest` 领域对象与其 JPA 表示 `RoomJPA` 和\
  \ `GuestJPA` 之间的转换：\n\n```java\n@Mapper\ninterface JPAMapper {\n    GuestJPA toEntity(Guest\
  \ guest);\n    Guest toDomain(GuestJPA guestJPA);\n    RoomJPA toEntity(Room room);\n\
  \    Room toDomain(RoomJPA roomJPA);\n}\n```\n\n通过利用 mapper，我们可以封装翻译逻辑，并确保领域层感知数据库架构。\n\
  \n在实体定义和 mapper 之后，我们现在可以实现 `HotelJPA`，它作为持久层。该类利用 JPA 与 SQL 数据交互，将领域逻辑从数据库框架的细节隔离开。在这里，我们处理入住和退房操作，在同一个类中管理房间和客人数据。在实际应用中，为\
  \ `Room` 和 `Guest` 建立独立的 repository 可能更合适，但为了简单起见，我们仅关注房间操作。\n\n```java\npublic\
  \ class HotelJPA implements Hotel {\n    private final SessionFactory sessionFactory;\n\
  \    private final JPAMapper mapper;\n\n    public HotelJPA(SessionFactory sessionFactory,\
  \ JPAMapper mapper) {\n        this.sessionFactory = sessionFactory;\n        this.mapper\
  \ = mapper;\n    }\n\n    @Override\n    public Room checkIn(Room room) {\n    \
  \    try (var session = sessionFactory.openSession()) {\n            Transaction\
  \ transaction = session.beginTransaction();\n            RoomJPA roomJPA = session.get(RoomJPA.class,\
  \ room.getNumber());\n            if (roomJPA != null) {\n                GuestJPA\
  \ guestJPA = mapper.toEntity(room.getGuest());\n                GuestJPA existingGuest\
  \ = (GuestJPA) session\n                    .createQuery(\"from GuestJPA where documentNumber\
  \ = :documentNumber\")\n                    .setParameter(\"documentNumber\", guestJPA.getDocumentNumber())\n\
  \                    .uniqueResult();\n                if (existingGuest == null)\
  \ {\n                    session.save(guestJPA);\n                } else {\n   \
  \                 guestJPA = existingGuest;\n                }\n               \
  \ roomJPA.setGuest(guestJPA);\n                session.saveUpdate(roomJPA);\n  \
  \              transaction.commit();\n                return mapper.toDomain(roomJPA);\n\
  \            }\n            transaction.rollback();\n            throw new IllegalArgumentException(\"\
  Room not found\");\n        }\n    }\n\n    @Override\n    public void checkOut(Room\
  \ room) {\n        try (var session = sessionFactory.openSession()) {\n        \
  \    Transaction transaction = session.beginTransaction();\n            RoomJPA\
  \ roomJPA = session.get(RoomJPA.class, room.getNumber());\n            if (roomJPA\
  \ != null) {\n                roomJPA.cleanRoom();\n                session.saveUpdate(roomJPA);\n\
  \                transaction.commit();\n            } else {\n                transaction.rollback();\n\
  \                throw new IllegalArgumentException(\"Room not found\");\n     \
  \       }\n        }\n    }\n\n    @Override\n    public Optional<Room> reservation(String\
  \ number) {\n        try (var session = sessionFactory.openSession()) {\n      \
  \      RoomJPA roomJPA = session.createQuery(\"from RoomJPA where number = \n```\n\
  \n\n\n\n```java\n:number\", RoomJPA.class)\n        .setParameter(\"number\", Long.parseLong(number))\n\
  \        .uniqueResult();\n\n    return Optional.ofNullable(roomJPA).map(mapper::toDomain);\n\
  \n  }\n}\n\n@Override\npublic Long countBy() {\n    try (Session session = sessionFactory.openSession())\
  \ {\n        return session.createQuery(\"select count(r) from RoomJPA r\", Long.class).uniqueResult();\n\
  \    }\n}\n\n@Override\npublic Optional<Room> findEmptyRoom() {\n    try (Session\
  \ session = sessionFactory.openSession()) {\n        RoomJPA emptyRoom = session.createQuery(\"\
  from RoomJPA where guest\n\n is null\", RoomJPA.class)\n            .setMaxResults(1)\n\
  \            .uniqueResult();\n        return Optional.ofNullable(emptyRoom).map(mapper::toDomain);\n\
  \    }\n}\n}\n```\n\n我们探索的结构化持久化层有效地将领域层与底层数据库隔离离开，允许领域模型能够专注于业务逻辑，而将数据库特定的细节留给持久化基础设施。\n\
  \n领域模型与关系型数据库之间的阻抗差异（impedance mismatch）可以通过在持久化层隔离数据库特定组件并将领域实体映射到数据库表示来管理。这个示例演示了如何通过将关系结构与领域驱动原则对齐，实现针对\
  \ SQL 数据库的有效数据建模。通过关注归一化、映射策略和封装数据库特定细节等关键实践，这种方法确保了应用程序的适应性，同时在领域逻辑和数据库结构之间保持清晰的解耦。\n\
  \n在下一节“在 NoSQL 数据库中建模数据”中，我们将探索如何将 DDD 原则适配 NoSQL 数据库。NoSQL 提供了在某些场景下可能更灵活性和扩展性，我们将检查这些差异如何影响数据建模和领域对齐。\n\
  \n### 在 NoSQL 数据库中建模数据\n\n当我们谈论 NoSQL 数据库时，灵活性通常是其定义特征。与遵循结构化模式和定义标准的 SQL 数据库不同，NoSQL\
  \ 数据库提供了无模式结构，将适应性和性能优于严格的一致性模型。这种灵活性体现在各种 NoSQL 数据库中，包括键值对、文档、宽列、图谱和时间序列，每种类型都有其自己的数据建模方法。虽然\
  \ SQL 和 NoSQL 数据库具有相同的存储信息的根本目的，但 NoSQL 数据库在行为和设计上存在显著差异。与 SQL 数据库的原子性、一致性、隔离性和持久性（ACID）标准相比，NoSQL\
  \ 数据库通常遵循基本可用、软状态和最终一致性（BASE）模型，专注于最终一致性而非严格的事务完整性。此外，NoSQL 数据库强调反规范化（denormalization），即根据访问模式建模数据以优化读操作，使得即使数据在条目之间可能重复，也能保持高效查询。\n\
  \n在 NoSQL 环境下应用 DDD 原则时，会出现某些挑战，特别是在封装、抽象和一致性方面。像 `MongoDB` 这样的文档数据库在某种程度上缩小了这种差距，因为它们可以在单个\
  \ JSON 类文档中存储实体及其相关数据。这允许使用反规范化的数据模型更好地与领域对齐，但在需要多个实体同步的场景下，仍需对数据一致性和更新逻辑进行仔细考虑。\n\
  \n以下是概述 DDD 和 NoSQL 数据库之间关键区别的对比表：\n\n| 维度 | NoSQL 数据库 | DDD |\n| :--- | :--- |\
  \ :--- |\n| 结构 | 无模式，灵活 | 封装的、行为驱动实体 |\n||致性模型 | BASE（最终一致性） | 关注完整性和封装 |\n| 数据建模\
  \ | 反规范化，查询优化 | 领域逻辑和行为表示 |\n| 数据关系 | 嵌入文档（例如，子文档） | 封装的实体，值对象 |\n| 访问模式 | 根据查询设计优化读操作\
  \ | 封装操作和业务逻辑 |\n\n表 7.3：NoSQL vs. DDD\n\n让我们继续使用我们的酒店示例。我们将使用基于文档的 NoSQL 数据库 `MongoDB`\
  \ 来对一个包含 `Room` 实体集合的酒店进行建模。每个 `Room` 将具有一个 `Guest` 属性，以子文档的形式存储，而不是像关系型数据库那样存储在单独表中。`MongoDB`\
  \ 实体的代码如下：\n\n```java\npublic class RoomNoSQL {\n    @BsonProperty(\"number\")\n\
  \    private Long number;\n    @BsonProperty(\"guest\")\n    private GuestNoSQL\
  \ guest;\n}\n\npublic class GuestNoSQL {\n    @BsonProperty(\"documentNumber\")\n\
  \    private String documentNumber;\n    @BsonProperty(\"name\")\n    private String\
  \ name;\n}\n```\n\n然后，我们将使用类似于 SQL 示例的映射层，以维护领域表示和数据库表示之间映射的一致性。该层将 `Room` 和 `Guest`\
  \ 领域对象转换为 `RoomNoSQL` 和 `GuestNoSQL` 实体，如下：\n\n```java\n@Mapper\ninterface NoSQLMapper\
  \ {\n    GuestNoSQL toEntity(Guest guest);\n    Guest toDomain(GuestNoSQL);\n  \
  \  RoomNoSQL toEntity(Room room);\n    Room toDomain(RoomNoSQL);\n}\n```\n\n最后，我们使用\
  \ `MongoDB` 实现 `HotelMongoDB` 类来处理入住、退房和查找房间等操作。在这里，我们直接序列化 `MongoDB` 实体。尽管如此，它仍然需要构造函数、getter\
  \ 和 setter。\n\n```java\npublic class HotelMongoDB implements Hotel {\n    private\
  \ final MongoCollection<RoomNoSQL> roomCollection;\n    private final NoSQLMapper\
  \ mapper;\n\n    public HotelMongoDB(MongoCollection<RoomNoSQL> roomCollection,\
  \ NoSQLMapper mapper) {\n        this.roomCollection = roomCollection;\n       \
  \ this.mapper = mapper;\n    }\n\n    @Override\n    public void checkIn(Room room)\
