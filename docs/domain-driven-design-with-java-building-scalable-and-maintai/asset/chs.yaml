  \ 的展开 Schema。](img/Figure_10.2.png)\n\n图 10.2: Helidon Open API 生成\n\n## Conclusion\n\
  \nEclipse MicroProfile 为开发具有弹性和可观测性的微服务提供了必要的工具。通过集成容错、健康检查和指标，我们确保了服务能够从故障中恢复、提供实时洞察并优化性能。这些能力对于构建在分布式环境中抵抗不可预测条件的健壮应用程序至关重要。\n\
  \n\n\n\n\n在后续的学习中，我们将结合 Quarkus 探索 DDD。Quarkus 是一个强大的框架，它在增强 `MicroProfile` 的同时为云原生应用优化了性能。在下一章中，我们将看到\
  \ Quarkus 如何实现更快的开发、缩启动时间并与 DDD 原则无缝集成，以构建高效可扩展的微服务。\n\n## 记忆点\n\n*   `Eclipse MicroProfile`:\
  \ 一个轻量级框架，通过扩展 `Jakarta EE` 的微服务特定能力，来增强云原生 Java 微服务。\n*   `MicroProfile Config`:\
  \ 允许外部化配置，能够在不修改应用代码的情况下实现运行时灵活性。\n*   `Jakarta NoSQL`: 为集成如 `MongoDB` 等 NoSQL 数据库提供标准的\
  \ API，确保无缝的数据库交互。\n*   `MicroProfile OpenAPI`: 自动生成 API 文档，使 RESTful 服务更易访问并提高互操作性。\n\
  *   `DTOs`: 帮助将领域逻辑与外部表示分离，防止领域模型直接暴露。\n*   `MapStruct`: 自动化 `DTOs` 与领域实体之间的对象映射，减少样板代码并提高可维护性。\n\
  *   `Jakarta Data Repositories`: 通过提供声明式的 CRUD 操作方法来简化数据库交互，无需编写样板代码。\n*   `MicroProfile\
  \ Rest Client`: 通过简化 HTTP 客户端实现方便微服务之间的通信。\n*   `Application layer isolation`（应用层隔离）：通过确保业务逻辑与基础设施关注点分离，保持领域模型的纯洁。\n\
  *   `Next Step—Quarkus`：下一章将探索 Quarkus 如何增强 `MicroProfile`、改进启动时间并为云原生环境优化微服务。\n\
