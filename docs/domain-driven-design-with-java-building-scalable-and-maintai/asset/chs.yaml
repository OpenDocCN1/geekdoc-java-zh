  \ ProductMapper\n\n在领域实体和 DTO 之间转换可能是乏味且易错误的，导致产生大量的样板代码。我们使用 `MapStruct`，这是一个代码生成工具，它在编译时自动生成映射逻辑，以简化这一过程。这种方法减少了手动工作，并确保映射在不同应用层之间保持一致且可维护。\n\
  \n```java\n@Mapper(componentModel = MappingConstants.ComponentModel.JAKARTA_CDI)\n\
  public interface ProductMapper {\n\n    ProductDTO toDTO(Product product);\n\n \
  \   Product toEntity(ProductDTO productDTO);\n\n    ManufacturerDTO toDTO(Manufacturer\
  \ manufacturer);\n\n    Manufacturer toEntity(ManufacturerDTO manufacturerDTO);\n\
  \n    CategoryDTO toDTO(Category category);\n\n    Category toEntity(CategoryDTO\
  \ categoryDTO);\n}\n```\n\n### ProductService\n\n`ProductService` 类充当领域层和 API 之间的桥梁，确保业务逻辑正确执行，同时独立于\
  \ HTTP 特有的关注。该服务通过封装查询、保存和删除产品等操作，保持了职责的清晰分离，防止 REST 层直接与持久层交互。这种设计提升了可维护性、重用性和可测试性，使得未来适应和扩展系统变得更加容易。\n\
  \n```java\n@ApplicationScoped\npublic class ProductService {\n\n    private final\
  \ ProductRepository repository;\n    private final ProductMapper mapper;\n\n   \
  \ @Inject\n    public ProductService(ProductRepository repository, ProductMapper\
  \ mapper) {\n        this.repository = repository;\n        this.mapper = mapper;\n\
  \    }\n\n    public List<ProductDTO> findAll(PageRequest request, Order<Product>\
  \ order) {\n        return repository.findAll(request, order).content().stream()\n\
  \                .map(mapper::toDTO)\n                .toList();\n    }\n\n    public\
  \ ProductDTO save(ProductDTO product) {\n        return mapper.toDTO(repository.save(mapper.toEntity(product)));\n\
  \    }\n\n    public void deleteById(String id) {\n        repository.deleteById(id);\n\
  \    }\n\n    public Optional<ProductDTO> findById(String id) {\n        return\
  \ repository.findById(id);\n    }\n}\n```\n\n```\n`ProductService` 类充当领域层和 API 之间的桥梁，确保业务逻辑正确执行，同时独立于\
