  md: '# INTRODUCTION


    NATURE PLAYS different roles for different people but remains ever present, no
    matter where we find ourselves in life.


    The natural world offers constancy and comfort in chaotic times. When every email
    and text message seems to require an immediate response, a hike in the woods clears
    the mind and reframes our focus. Seasons change in a spectacular array of colors.
    Mountains are old enough to seem ageless, and oceans so expansive that the horizon
    seems limitless. How urgent an alert message be when we''re surrounded by such
    beauty?


    This book collects quotes from artists, scientists, naturalists and philosophers
    on the profound influence of nature. The selections explore the natural world’s
    ability to soothe the soul and put our problems in perspective. Praise for the
    sensual beauty of nature and its endless variety in color and form comprises another
    section. The adventure and delight to be found in the natural world is also explored.


    These quotes give voice to the wonder and joy a nature lover whenever bare feet
    touch the grass.'
