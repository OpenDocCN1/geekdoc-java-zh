    ![](img/2baeafd1a1d852399c249d47757df08e_11_0.png)


    He best remedy for those who are afraid, lonely or unhappy is to go outside, somewhere
    where they can be quite alone with the heavens, nature and God. Because only then
    does one feel that all is as it should be and that God wishes to see people happy,
    amidst the simple beauty of nature. As long as this exists, and it certainly always
    will, I know that then there will always be comfort for every sorrow, whatever
    the circumstances may be. And I firmly believe that nature brings solace in all
    troubles.


    > —ANNE FRANK


    Let the clean air blow the cobwebs from your body. Air is medicine.


