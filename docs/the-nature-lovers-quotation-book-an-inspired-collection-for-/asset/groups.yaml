    # NATURE''S POWER AND LONGEVITY


    ![](img/2baeafd1a1d852399c249d47757df08e_57_0.png)


    ![](img/2baeafd1a1d852399c249d47757df08e_58_0.png)


    ![](img/2baeafd1a1d852399c249d47757df08e_59_0.png)


    TIME TAKES on an expanded meaning when consider the age of the earth and all it
    has seen. The thousands upon thousands of years of existence and the towering
    power of the features of the natural world are awe-inspiring.


    What do we plant when we plant a tree? A thousand things that we daily see, We
    plant the spire that outowers the crag, We plant the staff for our country''s
    flag; We plant the shade from the hot sun, We plant all these when we plant the
    tree.

    —HENRY ABBEY


    ![](img/2baeafd1a1d852399c249d47757df08e_60_0.png)


    Whosoever plants a tree Winks at immortality.

    —FELIX DENNIS


    ![](img/2baeafd1a1d852399c249d47757df08e_60_1.png)


    Too old to plant trees for my gratification, I shall do it for my posterity.

    —THOMAS JEFFERSON


    His grand show is eternal. It is always sunrise somewhere; the dew never dried
    at once; a shower is forever falling; vapor ever rising. Eternal sunrise, eternal
    sunset, eternal dawn and gloaming, on seas and continents, each in its turn, as
    the round earth rolls.

    —JOHN MUIR


    ![](img/2baeafd1a1d852399c249d47757df08e_60_2.png)


    I''m always astonished by a forest. It makes me realise that the fantasy of nature
    is much larger than my own. I still have things to learn.

    —GUNTER GRASS


    Until a blade of grass, nature can laugh at so-called scientific knowledge. Remedies
    will never stand in favor with the products of nature, the living cell of the
    plant, the final result of the rays of the sun, the mother of all life.

    —THOMAS A. EDISON


    ![](img/2baeafd1a1d852399c249d47757df08e_61_0.png)


    Rain whose soft hands have power to cut stones, chisel to shapes of the very mountains.

    —HENRY WARD BEECHER


    When the oak is felled the whole forest echoes with its fall, but a hundred acorns
    are sown in silence by an unnoticed breeze.

    —THOMAS CARLYLE


    The tree is a slow, enduring force straining to win the sky.

    —ANTOINE DE SAINTEXUPERY


    ![](img/2baeafd1a1d852399c249d47757df08e_61_1.png)


    The true beauty of nature is her amplitude; she exists neither for nor because
    of us, and possesses a staying power that all our arsenals cannot threaten (much
    as we can easily destroy our puny selves).

    —STEPHEN JAY GOULD


    # Mountains represent the power of nature; plains, the love of nature!

    —MEHMET MURAT ILHAN


    ![](img/2baeafd1a1d852399c249d47757df08e_62_0.png)


    Countless people have attempted to define the absolute power of the world of nature.
    Some praise it as god, some call it the Buddha, others call it truth. Still others
    convert nature into a philosophy by which they attempt to sound its deepest truth.
    Such attempts to define the power of nature are no more than striving to escape
    its effects.

    —KOICHI TOHE


    Who can say which is the greater sign of creative power, the sun with its planet
    swinging with governed impetus to some incalculable end, or the gold sallow catkin
    with its flashing system of little flies?

    —MARY WEBB


    ![](img/2baeafd1a1d852399c249d47757df08e_62_1.png)


    Great is the person who plants a tree knowing he will never sit under it.

    —ROBERT BALLARD


    ![](img/2baeafd1a1d852399c249d47757df08e_62_2.png)


    Under the pavement the dirt is dreaming of grass.

    —WENDELL BERRY


    The sea is emotion incarnate. It loves, hates, and weeps. It defies all attempts
    to capture it with words and rejects all shackles. No matter what you say about
    it, there is always that which you can’t.

    —CHRISTOPHER PAOLINI


    ![](img/2baeafd1a1d852399c249d47757df08e_63_0.png)


    We ought not to ask why the human mind troubles to fathom the secrets of the universe.
    The diversity of the phenomena of nature is so great, and the treasures hidden
    in the skies so rich, in order that the human mind shall never be lacking in fresh
    nourishment.

    —JOHANNES KEPLER


    Go to the sea or climb the mountain, and with the ruggedest you will find likewise
    the fairest and the most delicate. The greatness and the minuteness of nature
    pass all understanding.

    —JOHN BURROUGHS


    ![](img/2baeafd1a1d852399c249d47757df08e_63_1.png)


    For those who have experienced the joy of being alone with nature there is really
    little need for me to say much more; for those who have not, words of mine can
    even describe the powerful, almost mystical knowledge of beauty and eternity that
    come, suddenly, and all unexpected.

    —JANE GOODALL


    Our earth is old, an old warrior that has lived through many battles. Nevertheless,
    the face of it is still changing, and science sees no certain limit of time for
    its stately evolution. Our solid earth, apparently stable, inert, and finished,
    is changing, mobile, and still evolving...And the secret of it all—the secret
    of the earthquake, the secret of the ocean basin, the secret of the highland—
    is in the heart of the earth, forever invisible to human eyes.

    REGINALD ALWORTH DALY


    ![](img/2baeafd1a1d852399c249d47757df08e_64_0.png)


    The sun does not shine for a few trees and flowers, but for the wide world’s joy.

    —HENRY WARD BEECHER


    When we contemplate the whole globe as one great dewdrop, striped and dotted with
    continents and islands, flying through space with other stars all singing and
    shining together as one, the whole universe appears as an infinite storm of beauty.

    —JOHN MUIR


    ![](img/2baeafd1a1d852399c249d47757df08e_64_1.png)


    Ocean is more ancient than the mountains, and freighted with the memories and
    the dreams of Time.

    H.P. LOVECRAFT


