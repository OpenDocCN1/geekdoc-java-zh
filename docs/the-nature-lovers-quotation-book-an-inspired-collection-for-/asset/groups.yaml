    The sea''s only gifts are harsh blows, and occasionally the chance to feel strong.
    Now I don''t know much about the sea, but I do know that that''s the way it is
    here. And I also know how important it is in life not necessarily to be strong
    but to feel strong. To measure yourself at least once. To find yourself at least
    once in the most ancient of human conditions. Facing the blind death stone alone,
    with nothing to help you your hands and your own head.


    > —JON KRAAUER


    Reading about nature is fine, but if a Verson walks in the woods and listens carefully,
    he can learn more than what is in books, for they speak with the voice of God.


    > —GEORGE WASHINGTON CARVER


    So, if you cannot understand that there is something in which responds to the
    challenge of this mountain and goes out to meet it, that the struggle is the struggle
    of life itself upward and forever upward,'
- md: '

    then you won’t see why we go. What we get from this adventure is just sheer joy.
    And joy is, after all, the end of life.


    > —GEORGE MALLORY


    ![](img/2baeafd1a1d852399c249d47757df08e_41_0.png)


    The very basic core of a man’s living spirit is his passion for adventure. The
    joy of life comes from our encounters with new experiences, and hence there is
    no greater joy to have an endlessly changing horizon, each day to have a new and
    a different sun.


    > —CHRIS MCCANDLESS


    There has always been a part of me that saw wilderness and risk-taking as the
    path to freedom.


    > —SAM KEEN


    ![](img/2baeafd1a1d852399c249d47757df08e_41_1.png)


    Why do we love this cult of wilderness?... because we like the taste of freedom;
    because we like the smell of danger.


    > —EDWARD ABBEY


    ![](img/2baeafd1a1dd852399c249d47757df08e_41_2.png)


    I have climbed my mountain, but I must still live my life.


    > —TENZING NORGAY (THE SECOND MAN ON EVEREST)


    If adventure has a final and all-embracing motive, it is surely this: we go out
    because it is our nature to go out, to climb mountains, and to paddle rivers,
    to fly to the planets and plunge into the depths of the oceans... When man ceases
    to do these things, he is no longer man.

    —WILFRID NOYCE


    The ocean is a central image. It is the symbolism of a great journey.

    —ENYA


    Always I shall be one who loves the wilderness: Swaggers and softly creeps between
    the mountain peaks; I shall listen long to the sea’s bra music; I shall sing my
    song above the shriek of desert winds.

    —EVERETT RUESS


    I had to do with what it felt to be in the wild. With what it was like to walk
    for miles with no reason other than to witness the accumulation of trees and meadows,
    mountains and deserts, streams and rocks, rivers and grasses, sun and sunsets.
    The experience was powerful and fundamental. It seemed to me that it had always
    felt like this to be a human in the wild, and as long as the wild existed it would
    always feel this way.

    —CHERYL STRAYED


    It is the climbing of the mountain that makes the view from the top so breathtaking.

    —RICHARD C. MILLER


    In the mountains, worldly attachments are left behind, and in the absence of material
    distractions, we are opened up to spiritual thought. We should be attempting to
    carry the spiritual experience of the mountains with us everywhere.


    > —JAMLING TENZING NORGAY


    Nature is man’s teacher. She unfolds her treasures to his search, unseals his
    eye, illuminates his mind, and purifies his heart; an influence breathes from
    all the sights and sounds of her existence.


    > —ALFRED BILLINGS STREET


    The place where you lose the trail is not necessarily the place where it ends.


    > —TOM BROWN, JR.


    # PUTTING THINGS IN PERSPECTIVE


    ![](img/2baeafd1a1d852399c249d47757df08e_44_0.png)


    ![](img/2baeafd1a1d852399c249d47757df08e_45_0.png)


    ![](img/2baeafd1a1d852399c249d47757df08e_46_0.png)


    NATURE HAS a way of reminding us of our smallness. Our troubles seem ephemeral
    and insignificant in the ancient order of the natural world.


    Nature is not horrible. Nature is not wonderful. Nature is not cruel. Nature is
    not beautiful. Nature only is.

    —SIMON BARNES


    ![](img/2baeafd1a1d852399c249d47757df08e_47_0.png)


    The same wind that uproots trees makes the grass. The lord loves the weakness
    and lowness of grasses. Never brag of being strong. The axe doesn’t worry how
    thick the branches are. It cuts them to pieces. But not the leaves alone.

    —RUMI


    Every tree started out as a couple of nuts who stood their ground.

    —HENRY DAVID THOREAU


    ![](img/2baeafd1a1d852399c249d47757df08e_47_1.png)


    Nature does not hurry, yet everything is accomplished.

    —LAO TZU


    ![](img/2baeafd1a1d852399c249d47757df08e_47_2.png)


    Mountains don’t kill people, they just sit there. And nature is proof of greater
    power than myself. Both things put in perspective, or at least gently move us
    forward.

    —KRISTIN BAUER


    If there is one thing clear about the centuries dominated by the factory and the
    wheel, it is that although the machine can make everything from a spoon to landing-craft,
    natural joy in earthly living is something it never has and never will be able
    to manufacture.

    —HENRY BEST


    We feel such a strong connection. There is no mind on the other side of the wall.

    —ALAN LIGHTMAN


    The single lesson the garden teaches is that our relationship to the planet need
    not zero-sum, and that as long as the sun still shines and people still plan,
    think and do, we can find ways to provide for ourselves without diminishing the
    world.

    —MICHAEL POLLAN


    A fool sees not the same tree that a wise man sees.

    —WILLIAM BLAKE


    Knowing grass, I understand the meaning of patience. I can appreciate persistence.

    —HAL BORLAND


    How many times it thundered before Franklin took the hint! How many apples fell
    on Newton''s head before he took the hint! Nature is always hinting at us. It
    hints over and over again. And suddenly we take the lesson which life constantly
    repeats to ‘look under your feet.’ You are always nearer to the divine and the
    true sources of your power than you think. The lure of the distant and the difficult
    is deceptive. The great opportunity is where you are. Do not despise your place
    and hour. Every place is under the stars. Every place is the center of the world.

    —JOHN BURROUG


    ![](img/2baeafd1a1d852399c249d47757df08e_49_0.png)


    You must first seek to love plants and nature, and then to cultivate that peace
    of mind which is satisfied with little. He will be happier if he has no rigid
    and arbitrary ideals, for gardens are coquettish, particularly with the novice.

    —LIBERTY HYDE BAILEY


    A garden is a grand teacher. It teaches patience and careful watchfulness; it
    teaches industry and thrift; above all it teaches trust.

    —GERTRUDE JEKYLL


    Never measure the height of a mountain, until you have reached the top. Then you
    will see how low it was.

    —DAG HAMMERSKJ


    How expressively and powerfully does the history of mountains speak to mankind,
    how sublimely it represents the divine essence in direct relationship to god,
    in that it seems all once to deny every transitory vanity of earthly existence.

    —CARL GUSTAV CARUS


    If a man walks in the woods for half of each day, he is in danger of being regarded
    as a loafer. But if he spends his days as a speculator, shearing off those woods
    and making the earth bald before her time, he is deemed industrious and enterprising
    citizen.

    —HENRY DAVID TAU


    Look deep into nature, and then you will understand everything better.

    —ALBERT EINSTIN


    > The least movement is of importance to all nature. The entire ocean is affected
    by a pebble.

    —BLAISE PASCAL


    > The sun, with all those planets revolving around it and dependent on it, still
    ripen a bunch of grapes as if it had nothing else in the universe to do.

    —GALILEO GALILEI


    > An oak tree is an oak tree. That is all it has to do. If an oak tree is less
    than an oak tree, then we are all in trouble.

    —NHAT HANH


    > And forget not that the earth delights to feel your bare feet and the winds
    long to play with your hair.

    —KHALIL GIBRAN


    > A blade of grass is always a blade of grass, whether in one country or another.

    —SAMUEL JOHNSON


    > Perhaps the truth depends on a walk around the lake.

    —WALLACE STEVENS


    > The fairest thing in nature, a flower, still has its roots in earth and manure.

    —D.H. LAWRENCE


    It is part of wisdom never to revisit a wilderness, for the more golden the lily,
    the more certain that someone has gilded it.

    —ALDO LEOPOLD


    In nature, a child finds freedom, fantasy, and privacy: a place distant from the
    adult world, a separate peace.

    —RICHARD LOUV


    Even if I knew that tomorrow the world would go to pieces, I would still plant
    my apple tree.

    —MARTIN LUTHER


    The world is not to be put in order. The world is order. It is for us to put ourselves
    in unison with this order.

    —HENRY MILLER


    Nature knows no indecencies; man invents them.

    —MARK TWAIN


    The wilderness holds answers to questions man has not yet learned to ask.

    —NANCY NEWHALL


    Good timber does not grow with ease; the stronger the wind, the stronger the trees.

