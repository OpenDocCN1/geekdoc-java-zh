    There is not one little blade of grass, there is no color in this world that is
    not intended to make men rejoice.

    —JOHN CALVIN


    If the sight of the blue skies fills you with joy, if a blade of grass springing
    up in the fields has power to move you, if the simple things of nature have a
    message that you understand, rejoice, for your soul is alive.

    —ELEANORA DUSE


    ![](img/2baeafd1a1d852399c249d47757df08e_65_0.png)


    If you can’t be in awe of Mother Nature, there’s something wrong with you.

    —ALEX TREBEK


    Whatever form it takes, camping is earthy, soul enriching and character building,
    and there can be few such satisfying moments as having your tent pitched and the
    smoke rising from your campfire as the golden sun sets on the horizon—even if
    it’s just for a fleeting moment before the rain spoils everything.

    —PIPPA MIDDLETON


    ![](img/2baeafd1a1d852399c249d47757df08e_65_1.png)


    I promise you that the same stuff swings planets around stars makes electrons
    dance in your heart. It is in you, outside you, you are it. It is beautiful. Trust
    in this. And you your life will be grand.

    —KAMAL RAVIKANT


    The first act of awe, when man was struck with the beauty or wonder of Nature,
    was the first spiritual experience.

    —HENRYK SKOLIMOWOWKI


    ![](img/2baeafd1a1d852399c249d47757df08e_66_0.png)


    Between every two pines is a doorway to a new world.

    —JOHN MUIR


