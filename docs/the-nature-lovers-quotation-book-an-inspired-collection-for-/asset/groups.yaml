    当一棵树被砍倒，向太阳露出它赤裸的死亡伤口时，人们可以在树干那明亮、刻有的圆盘中读出它的整个历史：在它的年轮中、伤痕中，所有的斗争、所有的痛苦、所有的快乐与繁荣都真实地写在那里，贫瘠的岁月与奢华的岁月，承受的攻击，经受的风暴。每一个年轻的农少年都知道，最坚硬、最高贵的木材年轮最窄；在高山上和持续的危险中，生长着最不可摧毁、最强大、最理想的树木。


