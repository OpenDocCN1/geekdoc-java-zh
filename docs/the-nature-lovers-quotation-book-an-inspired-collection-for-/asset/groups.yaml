- md: '

    When a tree is cut down and reveals its naked death-wound to the sun, one can
    read its whole history in the luminous, inscribed disk of its trunk: in the rings
    of its years, its scars, all the struggle, all the suffering, all the happiness
    and prosperity stand truly written, the narrow years and the luxurious years,
    the attacks withstood, the storms endured. And every young farm boy knows that
    the hardest and noblest wood has the narrowest rings, high on the mountains and
    in continuing danger the most indestructible, the strongest, the ideal trees grow.


    > —HERMAN HESSE


    ![](img/2baeafd1a1d852399c249d47757df08e_17_0.png)


    We are nature. We are nature seeing nature. The red-winged blackbird flies in
    us.


    > —SUSAN GRIFFIN


    The foot that is familiar with the grass belongs usually to a man of lighter heart
    than he whose souls seldom wander from the pavement; and the best elixir vitae
    is a run, as often as we can contrived amid the sweets of new and lovely scenery,
    where nature sits, fresh from the hand of the Creator, almost chiding us for our
    delay.


    > —LEOPOLD HARTLEY GRINDON


    Flowers speak to us if we listen. Appreciating the blossom in hand or pausing
    in the garden to admire the beauty quiets our outer selves till we hear something
    new, something we did not hear before—the still, small voice of Nature herself.

    —JEAN HERSEY


    > Even in a time of elephantine vanity and greed, one never has to look far to
    see the campfires of gentle people.

    —GARRISON KEILLOR


    > Every time I''m in the woods, I feel like I''m in church.

    — —PETE SEEGER


    > Why are there trees I never walk under but large and melodious thoughts descend
    upon me?

    —WALT WHITMAN


    > As a spiritual person, nature for me has always been a healing place. Going
    back all the way to my childhood on the farm, the fields and forests were places
    of adventure and self-discovery. Animals were companions and friends, and the
    world moved at a slower, more rational pace than the bustling cities where I''d
    resided my adult life.

    —DAVID MIXNER


    Today I have grown taller from walking with the trees.


    ## KARLE WILSON BAKER


    ![](img/2baeafd1a1d852399c249d47757df08e_19_0.png)


    Nature is the clearest source of solitude. The greatness of nature can overwhelm
    the insignificant chatter by which we measure most of our days. If you have the
    wisdom and the courage to go to nature alone, the larger rhythms, the eternal
    hum, will make itself known all the sooner. When you have found it, it will always
    be there for you. The peace without will become the peace within, and you will
    be able to return to it in your heart wherever you find yourself.


