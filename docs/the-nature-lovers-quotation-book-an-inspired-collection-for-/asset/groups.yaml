  mdcn: '

    那么你就不会明白我们为什么要出发。我们从这场冒险中获得的只是纯粹的喜悦。而喜悦，毕竟，是生命的终点。


    > —乔治·马洛里


    ![](img/2baeafd1a1d852399c249d47757df08e_41_0.png)


    人生存精神中最基本的内核是对冒险的热爱。生活的乐趣源于我们与新体验的相遇，因此，没有什么比拥有一个无尽变化的地平线，每天都有一颗新颖且不同的太阳更令人喜悦了。


    > —克里斯·麦克兰德斯


    我内心总有一部分认为荒野和涉险是通往自由的道路。


    > —萨姆·基恩


    ![](img/2baeafd1a1d852399c249d47757df08e_41_1.png)


    我们为什么热爱这种对荒野的崇拜？因为我们喜欢自由的味道；因为我们喜欢危险的气息。


    > —爱德华·阿比


    ![](img/2baeafd1a1dd852399c249d47757df08e_41_2.png)


    我已经爬上了我的山，但我必须继续过我的生活。


    > —丹增·诺尔盖（珠穆朗玛峰第二二人）


    如果冒险有一个最终且包容一切的动机，那一定是这个：我们出发是因为我们的本性使我们出发，去爬山，去划船，飞向行星，潜入深海……当人停止做这些事情时，他就不再为人了。

    —威尔弗里德·诺伊斯


    海洋是一个核心意象。它是伟大旅程的象征。

    —恩雅


    我将永远是一个热爱荒野的人：在山峰间昂首或轻盈穿行；我将长久地倾听大海的呼吸；我将在沙漠风的尖啸中唱响我的歌。

    —埃弗里特·鲁斯


    我必须体验置身荒野的感受。那种无目的地行走几英里，唯一的理由仅仅是见证树木与草甸、山脉与沙漠、溪流与岩石、河流与草地、阳光与日落的积聚。这种体验是强大且根本的。在我看来，在荒野中的人类感觉一直是这样，只要荒野存在，这种感觉就永远如此。

    —谢丽尔·斯特瑞德


    正是攀登的过程，让山顶的景色如此惊为观止。

    —理查德·C·米勒


    在山中，世俗的执念被抛在脑后，在没有物质干扰的情况下，我们对精神性的思考开放了。我们应该尝试将山的灵性体验带到任何地方。


    > —贾姆林·丹增·诺尔盖


    自然是人的老师。她向他的寻找展示自己的宝藏，开启他的双眼，照亮他的心灵，净化他的内心；一种影响从她存在的所有景观和声音中呼之而出。


    > —阿尔弗雷德·比林格斯·街特


    你迷路的地方并不一定是路径终结的地方。


    > —汤姆·布朗·Junior号


    # 视角转换


    ![](img/2baeafd1a1d852399c249d47757df08e_44_0.png)


    ![](img/2baeafd1a1d852399c249d47757df08e_45_0.png)


    ![](img/2baeafd1a1d852399c249d47757df08e_46_0.png)


    自然有一种方式提醒我们自己的渺小。在自然界古老的秩序中，我们的烦恼显得转瞬即逝且微不足道。


    自然并不可怕。自然并不奇妙。自然并不残酷。自然并不优美。自然只是如此。

    —西蒙·巴内斯


    ![](img/2baeafd1a1d852399c249d47757df08e_47_0.png)


    拔起树木的 same吹长了草。主喜爱弱小和低矮。永远吹耀自己的强大。斧头并不担心树枝有多厚，它将它们切碎。但不仅仅是叶子。

    —鲁米


    每一棵树最初都是几颗立在地的坚果。

    —亨利·大卫·梭罗


    ![](img/2baeafd1a1d852399c249d47757df08e_47_1.png)


    自然不匆忙，却一切已成就。

    —老子


    ![](img/2baeafd1a1d852399c249d47757df08e_47_2.png)


    山并不杀人，它们只是静坐那里。而自然证明了比我更大的力量。将两者置于视角，或者至少让我们向前移动。

    —克里斯汀·鲍尔


    在被工厂和轮子统治的世纪里，有一点是明确的：机器可以制造从勺子到登陆器的一切东西，但生活的喜悦是它有过也永远无法制造的。

    —亨利·贝


    我们感到如此强烈的联系。墙的另一侧没有思想。花园教会的唯一课程是，我们与星球的关系并非零和，而且只要太阳依然照射，人们仍然计划、思考和行动，我们就能找到不损害世界的方式维持自己。

    —迈克尔·波兰


    愚人看不见智者所看到的同一棵树。

    —威廉·布莱克


    通过认识草，我理解了耐心的含义。我可以欣赏坚持。

    —哈尔·波兰


    在富兰克林接受暗示之前，雷响了多少次！在牛顿接受暗示之前，有多少个苹果掉在他头上！自然总是向我们暗示。它一次又一次地重复着“看看你的脚下”。你离神性和力量真正的源头比你想象的要近。遥远和困难是欺骗性的。机会就在所在地。每个地方都在星辰之下。每个地方都是世界的中心。

    —约翰·伯鲁


    ![](img/2baeafd1a1d852399c249d47757df08e_49_0.png)


    你必须寻求热爱植物和自然，然后培养那种知足常乐的心态。如果没有僵化和武断的理想，他更快乐，因为花园对初学者是有调情的。

    —莉伯蒂·海德·贝利


    花园是一个伟大的老师。它教会耐心和细心；它教会勤奋和节约；最重要的是，它教会信任。

    —格鲁特德·杰基


    在到达山顶之前，永远不要测量山的高度。那时你就会看到它是多低了。

    —达格·哈默斯杰


    山的历史如此富有力且有力地向人类诉说，它是如此崇高地代表了与神直接相关的神性，因为它似乎一次性否定了世间所有的虚荣。

    —卡尔·古斯塔夫·卡鲁斯


    如果一个人每天有一半时间在森林里散步，他有被视为游民的危险。但如果他像投机者一样度过一天，砍掉那些森林让土地提前光秃，他会被视为勤奋且富有进取的公民。

    —亨利·大卫·陶


    深视自然，你将更好地理解一切。

    —阿尔伯特·爱因斯坦


    > 最微小的运动对所有自然都至关重要。整个海洋都会受到一颗卵石的影响。

    —布莱斯·帕斯卡


    > 太阳，带着所有环绕它转动并依赖它的行星，依然在结一串葡萄，仿佛它在宇宙中没有其他可做的事。

    —伽利略·伽利莱


    > 橡树就是橡树。这是它所要做的全部。如果橡树不如橡树，那么我们都陷入了麻烦。

    —那言·福


    > 不要忘记，大地乐于感受你的赤脚，风也渴望玩弄你的头发。

    —哈里里·吉卜兰


    > 一根草永远是一根草，无论是在一个国家还是另一个国家。

    —缪埃尔·约翰逊


    > 也许真理取决于绕湖散步。

    —华莱士·史文斯


    > 自然中最高美的事——花，其根仍在在土壤和粪肥中。

    —D.H·劳伦斯


    永不再次回到荒野是智慧的一部分，因为百合越金黄，就越有人给它镀了金。

    —阿尔多·奥波德


    在自然中，孩子找到了自由、幻想和私密：一个远离成人世界的地方，一份独立的宁静。

    —理查德·洛夫


    即使我知道明天世界将分崩，我依然会种下我的苹果树。

    —马丁·路德


    世界不需要被秩序。世界本身就是秩序。是我们让自己与这种秩序保持一致。

    —亨利·米勒


    自然没有不秽；人类发明了它们。

    —马克·吐威


    荒野包含着人类尚未学会提问的问题的答案。

    —南希·纽霍


    好的木材长得并不容易；风越大，树越强壮。

