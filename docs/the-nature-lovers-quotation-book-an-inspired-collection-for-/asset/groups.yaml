    自然是孤独最清晰的源泉。自然的伟大可以压倒我们用来衡量大部分时光的无足道碎念。如果你有智慧和勇气独自走向自然，那大大的节奏、永恒的嗡嗡声会尽早显现。当你找到它时，它将永远在那里等着你。外表的平静将变成内心的平静，无论你身处何地，都能在心中回到它。


    > -肯特·内伯恩


