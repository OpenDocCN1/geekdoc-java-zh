    Emerged from the black oil pools in the forgotten house of dreams in the wild
    backcountry of the heart. I am heir to the sun, child of Mother Earth and the
    Mayan galaxy. All the mountain cures and healing waters and winds and junipers
    run deep in my bloodstream.


    > -JIMMY SANTIAGO BACA


