    ![](img/2baeafd1a1d852399c249d47757df08e_21_0.png)


    在广阔的世界，人们受到奖赏或惩罚的方式往往完全随机。在花园里，因果、劳动与回报重新结合在一起。在毫无意义的世界里，园艺是有意义的。因此推之然，世界上的花园越多，正义就越多，产生的意义也越多。


    > —安德鲁·威尔


    与地球以及彼此结合，为土地带来新生命，恢复水源，清新空气，更新森林，照顾植物，保护生物，庆祝海洋，为阳光欢欣，唱星辰之歌，回忆我们的命运，更新我们的精神，活力我们的身体，重建人类社区，促进正义与和平，爱我们的孩子并爱彼此，作为一个慈爱之秘的多样化表达汇在一起，为了地球的治愈和所有生命的更新。


    > —马丁·路德·金，士.


