  mdcn: "\n\n## 自然爱好者名录集\n\n## 针对徒步、露营和野外活动的灵感之选\n\n# 自然爱好者名录集\n 针对徒步、露营和野外活动的灵感之选\n\
    \n![](img/2baeafd1a1d852399c249d47757df08e_1_0.png)\n\nHatherleigh Press 致力于保护和维护地球的自然资源。环境责任感和可持续发展实践已纳入我们公司的使命宣言中。\n\
    \n访问我们的网站 www.hatherleighpress.com，在线注册以获取免费优惠、折扣、特别活动及更多信息。\n\n# 自然爱好者名录集\n\n\
    文本版权 © 2007 Hatherleigh Press, Ltd.\n可提供美国国会图书馆书版分类出版数据。\nISBN: 0-5816-745-2\n\
    \n所有权利保留。未经出版者书面许可，不得以任何形式或任何手段（电子或或其他）对本书的任何部分复制、存储在检索系统中或传输。\n\n设计：CAROLYN KASPER\n\
    \n![](img/2baeafd1a1d852399c249d47757df08e_2_0.png)\n\n# 目录\n\n- 引言\n- 静心之道\n\
    - 自然之美与馈赠\n- 冒险精神\n- 视角的转换\n- 自然的力量与长寿\n\n![](img/2baeafd1a1d852399c249d47757df08e_4_0.png)\n\
    \n# 引言\n\n自然对不同的人扮演着不同的角色，但无论我们生活在何处，它无处不在。\n\n在混乱的时代，自然世界提供了恒定与安慰。自然世界带给我们一种平静感和精神上的交流。当每封电子邮件和短信似乎都需要立即回复时，在森林中徒步可以清醒大脑并重新调整我们的焦点。季节以绚丽的色彩变换。山脉古老到仿佛永恒，海洋广阔到让地平线似乎无边际。当我们被这种美景环绕时，报警信息又有何急呢？\n\
    \n这本书汇集了艺术家、科学家、自然学家和哲学家关于自然深远影响的引言。选文探讨了自然世界抚慰灵魂并让我们重新审视问题的能力。对自然感官美及其在色彩和形式上无限多样性的赞美是另一部分。同时也探索了在自然世界中可以找到冒险与喜悦。\n\
    \n这些引言为自然爱好者每当赤脚触碰大地时内心的惊奇与喜悦发声。\n\n![](img/2baeafd1a1d852399c249d47757df08e_6_0.png)\n\
    \n![](img/2baeafd1a1d852399c249d47757df08e_7_0.png)\n\n# 静心之道\n\n![](img/2baeafd1a1d852399c249d47757df08e_9_0.png)\n\
    \n![](img/2baeafd1a1d852399c249d47757df08e_10_0.png)\n\n当我们的生活变得混乱时，我们在自然中找到慰藉。自然世界赋予我们和平感和精神上的交流。我们的内心世界得到了自然的丰富和抚慰。\n\
    \n那些沉思地球之美的人会发现力量源，只要生命延续，这种力量就会持久。在自然的反复循环中，存在着无限的治愈力量——黎明在黑夜之后，春天在冬日之后。\n\n\
    > —瑞秋·卡森（RACHEL CARSON）\n\n![](img/2baeafd1a1d852399c249d47757df08e_11_0.png)\n\
    \n对于那些恐惧、孤独或不幸的人来说，最好的药方就是出去，去一个他们可以与天空、自然和上帝独处的地方。因为只有在那里，人们才会一切如常，上帝希望人们在自然的纯美中获得快乐。只要这一切还存在（它无疑将永远存在），我知道无论情况如何，每一种忧伤都将会有慰藉。我坚信，自然在一切困难中带来慰藉。\n\
    \n> —安妮·弗兰克（ANNE FRANK）\n\n让清新的空气吹走你身上的尘垢。空气是良药。\n\n> —莉莉安·罗塞尔（LILLIAN RUSSELL）\n\
    \n![](img/2baeafd1a1d852399c249d47757df08e_11_1.png)\n\n成千上万精疲力竭、神经、过度文明的人开始发现，走进大山就是回家；荒野是必需品；山地公园和保护区不仅是木材的源泉和灌溉河流的来源，更是生命的源泉。\n\
    —约翰·缪尔（JOHN MUIR）\n\n让宇宙成为你的伴侣，时刻记住事物的本质——山川河流，树木草木，以及人类——还有落花落叶。\n—松尾芭（MATUO\
    \ BASHO）\n\n![](img/2baeafd1a1d852399c249d47757df08e_12_0.png)\n\n上帝在荒野中、花园里、田野间完全且真实地存在。\n\
    —马丁·路德（MARTIN LUTHER）\n\n![](img/2baeafd1a1d852399c249d47757df08e_12_1.png)\n\n\
    让人们进入荒野获得超凡的体验，可以赋予他们多年，甚至终生。\n—保罗·乔治（PAUL GEORGE）\n\n自然是我上帝的显现。我每天去自然中寻找日常工作的灵感。我遵循自然在其领域内使用的原则。\n\
    —弗兰克·劳埃德·赖特（FRANK LLOYD WRIGHT）\n\n![](img/2baeafd1a1d852399c249d47757df08e_12_2.png)\n\
    \n虽无法逃离世俗的世界，但我可以从山泉取水泡茶，让心安定。\n—上田秋鸣（UEDA AKINI）\n\n现在我在每一片生长的叶子、每一朵绽放的花中看到了秘密，在大地的声音和水的流动中，在树木的低语中（我听到了，我听到了），在蜜蜂的嗡嗡声中，在雨歌中，在阳光和荣耀之后，在月色星光之后，在生命的睡眠和黑暗之后；我拥有一切所需。\n\
    —沃尔特·惠特曼（WALT WHITMAN）\n\n草地是我的教堂，我漫步其中，我是我自己的大教堂。\n—亨利·戴卫·梭罗（HENRY DAVID THOREAU）\n\
    \n而，我们这远离尘嚣的生活，在树木中找到语言，在流溪中找到书籍，在石头中找到讲道，在万物中找到美好。\n—威廉·莎士比亚（WILLIAM SHAKESPEARE）\n\
    \n"
