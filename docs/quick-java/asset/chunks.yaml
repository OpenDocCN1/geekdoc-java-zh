    \ additional classes and methods that are important for writing concurrent programs\
    \ and for doing animation.\n\nEvery one of these classes is far richer than this\
    \ section would suggest. Only the basics are described here.\n\n## 10.1 Threads\n\
    \nA `thread` is the flow of control in a program. Modern operating systems are\
    \ `multiprocessing`: they do many things at the same time. This might be accomplished\
    \ by assigning different threads to different cores, or by interrupting one thread\
    \ to turn over execution to another. Even a simple Java program uses multiple\
    \ threads and hides the details so you don’t have to think about them. You can,\
    \ however, directly create and manipulate threads.\n\nA `Thread` is an object\
    \ representing a flow of control. When you step through a program, you are following\
    \ a thread. Threads are just like any other object; you can create them and send\
    \ messages to them. Every program uses threads.\n\nThere are two ways to create\
    \ another `Thread` and start it running:\n\n*   Write a class that extends `Thread`\
    \ and overrides the `public void run()` method.\n    *   Create an object of this\
    \ class.\n    *   Send the object the (inherited) `start()` message.\n*   Write\
    \ a class that implements `Runnable` and overrides the `public void run()` method.\n\
    \    *   Create an object `obj` of this class.\n    *   Create a new `Thread(obj)`.\n\
    \    *   Send the `Thread` the `start()` message.\n\nA `Thread` can be in one\
    \ of four states (see [Figure 10.1](#ch10.xhtml_fig10_1)):\n\n*   `Ready`: all\
    \ set to run\n*   `Running`: actually doing something\n*   `Waiting`, or `blocked`:\
    \ needs something\n*   `Dead`: will never do anything again\n\n![The states of\
    \ a thread are: ready, running, waiting, dead](images/fig10_1.jpg)\n\n[Figure\
    \ 10.1 States of a thread.](#ch10.xhtml_Ffig10_1)\n\nExecution is controlled by\
    \ the Java scheduler, but you can request it to do some things. A call to `start()`\
    \ is one such request. Another is that you can request the current `Thread` to\
    \ pause for a given number of milliseconds.\n\n`Thread.sleep(milliseconds);`\n\
    \nIt is possible for this call to raise an `InterruptedException`.\n\n```\ntry\
    \ {Thread.sleep(1000);}\n```\n\n```\ncatch (InterruptedException e) { }\n```\n\
    \n> **Warning:** The very first version of Java allowed one `Thread` to control\
    \ other `Threads` with the methods `stop`, `suspend`, and `resume`. This was immediately\
    \ recognized as a Bad Idea, and those methods were immediately deprecated. Never\
    \ use them!\n\nA simple alternative to using deprecated methods is for one thread\
    \ to set a flag that can be read by another thread.\n\n```\nboolean okToRun =\
    \ true;\n```\n\n```\nsecondThread.start();\n```\n\n```\npublic void run() {\n\
    ```\n\n```\nwhile (firstThread.okToRun) {...}\n```\n\n```\n}\n```\n\n## 10.2 Synchronization\n\
    \nThere are many cases when it is desirable to have many processes (threads) running\
    \ in parallel. For example, other work could be done while a slow database access\
    \ or file transfer is in process.\n\nSubtle, irreproducible errors can result\
    \ when a value is being changed by one thread while being accessed by a different\
    \ thread, or when two threads both try to update the same value. To avoid this\
    \ situation, Java introduces the concept of `synchronization`, which simply means\
    \ giving one thread temporary but exclusive access to a value or set of values.\n\
    \nYou can synchronize on an object:\n\n```\nsynchronized (obj) { code }\n```\n\
    \nHere, `synchronized` is being used as a statement. No other code can synchronize\
    \ on `obj` until the `code` finishes.\n\n> **Note 1:** It often makes sense to\
    \ synchronize on the object you want to access or modify, but this is not a requirement.\
    \ Any object can be used for synchronization, and the `code` might access or modify\
    \ completely unrelated values.\n\n> **Note 2:** Synchronizing on an object prevents\
    \ *only* other threads synchronizing on the *same* object from running. Unsynchronized\
    \ code, or code synchronizing on other objects, is not affected.\n\nYou can synchronize\
    \ a method:\n\n```\nsynchronized void methodName(arguments) { code }\n```\n\n\
    In this case, `synchronized` is being used as a method modifier; it synchronizes\
    \ on the object `this`.\n\nSynchronizing on an object means that the thread gets\
    \ a “lock” on that object, and no other thread can synchronize on it until the\
    \ code finishes and the lock is released. While it has the lock, the thread can\
    \ also use any other methods that synchronize on the same object. Again, there\
    \ is no protection from unsynchronized code, or from code that synchronizes on\
    \ some other object.\n\nThe point of multithreading is to allow different threads\
    \ to run at the same time, so long as they are not attempting to access the same\
    \ objects. Synchronization is expensive, and it is very difficult to maintain\
    \ correctness while pursuing efficiency.\n\n## 10.3 Timers\n\nA `javax.swing.Timer`\
    \ is used to schedule code for repeated execution. The constructor takes two parameters:\
    \ an `int time` in milliseconds, which is used to set both the initial delay and\
    \ the time between events; and an `ActionListener` (usually an anonymous inner\
    \ class) to do something at each “tick” of the `Timer`.\n\n```\nTimer timer =\
    \ new Timer(40, event -> doSomething());\n```\n\nThere are a number of messages\
    \ that can be sent to a `Timer`, including `stop()`, `start()`, `setDelay(ms)`,\
    \ and `restart()`.\n\n## 10.4 Property Changes\n\nA `java.beans.PropertyChangeSupport`\
    \ object is one way that an object can inform other objects that it has been updated.\n\
    \n> **Terminology:** A `bean` is any Java class that (1) has a no-argument constructor,\
    \ (2) has at least some “properties” (private fields) that have getters and setters,\
    \ and (3) is serializable. Saying that a class is a bean is simply saying that\
    \ it has these characteristics.\n\nBasic operation is as follows:\n\n1.  Create\
    \ a new `PropertySupportObject(bean)`, where `bean` is the object to be “watched”\
    \ or “listened to.”\n2.  Each time the `bean` completes an update, it should send\
    \ the message `firePropertyChange(propertyName, oldValue, newValue)` to the `PropertySupportObject`.\
    \ This is probably best done within the bean itself.\n    *   The `propertyName`\
    \ is a String, and the `oldValue` and `newValue` can be the values of the entire\
    \ `bean` object, or of some part of it.\n    *   This method will only cause a\
    \ `PropertyChangeEvent` to occur if the `oldValue` and the `newValue` are different.\n\
    3.  To add a listener to the bean, send the message `addPropertyChangeListener(listener)`\
    \ to the `PropertySupportObject`. Any number of listeners may be added.\n4.  To\
    \ listen to a bean, a class must implement `PropertyChangeListener` and override\
    \ the inherited `public void propertyChange(PropertyChangeEvent event)` method.\n\
    \    *   The `event` parameter has the accessible fields `event.propertyName`,\
    \ `event.oldValue`, and `event.newValue`. The latter two are of type Object, so\
    \ should be cast to the desired type.\n\nIt isn’t necessary for a class to have\
    \ all the bean characteristics in order to use the above classes and methods.\n\
    \n## 10.5 SwingWorker\n\nA `worker thread` provides a means of running a long-running\
    \ process on a background thread so that the main thread can continue to do work.\
    \ This is particularly important in a GUI (graphical user interface) program,\
    \ where a long-running process can make the GUI unresponsive.\n\nThe `SwingWorker`\
    \ class provides a simple way to create a worker thread. There are three threads\
    \ involved:\n\n*   The `current thread` creates and starts a `SwingWorker`, then\
    \ continues to run without interruption.\n*   The `worker thread` executes the\
    \ long-running code.\n*   The `event dispatch` thread handles all the GUI events.\n"
