    # Author


    To all my students past, present, and future I’m David Matuszek, known to most
    of my students as “Dr. Dave.” I wrote my first program on punched cards in 1963
    and immediately got hooked. I taught my first computer classes in 1970 as a graduate
    student at the University of Texas. I eventually got my PhD from there, and’ve
    been teaching ever since. Admittedly, I spent over a dozen years in industry,
    but even then I taught as adjunct at Villanova University. I finally escaped from
    industry and joined the Villanova faculty full-time for a few years, then I moved
    to the University of Pennsylvania, where I directed a Master''s in Computer and
    Information Technology (MCIT) program for students entering computer science from
    another discipline. Throughout my career, my main interests have been in artificial
    intelligence (AI) and programming languages. I’ve also written science fiction
    novels—*Ice Jockey*, *All True Value*, and *A Prophet in Paradise*—and I expect
    to write more. And, hey, if you’re a former student of mine, drop me a note. I’d
    love to hear from you at davidmatuszek@gmail.com.


    # Preface


    If you are an experienced programmer, this book is your guide to getting up speed
    in Java in a hurry. Not just the language, but also the basics of unit testing,
    graphical user interfaces, threads, and functional programming. If you are coming
    from one of the C languages, you will find most statement familiar. These are
    clearly designated, so you can just skim over material. If you are coming from
    C++, you will find the object-oriented concepts are very similar, but the terminology
    is different. If you are coming from another language, such as Python, there is
    very little you can skip. Sorry. Let’s get started!


    # Versions


    This book is about Java 8 and Java 17. Why those two?


    Java 8 is the last version that is free for commercial use. If you are programming
    for Android, Java 8 (also known as version 1.8) is the last version you can use.
    For these reasons, additions to Java after version 8 will be noted as such. As
    this book is being written, the current version is 17. A new version is released
    every six months, so when you buy this book, the latest version number is probably
    higher. This should not be a concern, because Java “never throws away.” Newer
    versions do not invalidate older versions, and the language changes gradually.
    In fact, Java 17 is an LTS (Long Term Support) version, along with versions 8
    and 11.


    If you are uncertain which version of Java you have, you can execute this from
    the command line:


    ```

    java -version

    ```


    or execute the following println statement from within a running Java program:


    ```

    System.out.println(System.getProperty("java.version"));

    ```


    Since Java 9, you can also run jpshell from the command line. This program lets
    you execute Java statements (such as the above print statement) one at a time.
    This is no way to write a program, but it’s handy for trying things out. If you
    have yet to download Java, it comes in two main varieties: the JRE (Java Runtime
    Environment) is used to run existing programs, and the JDK (Java Development Kit),
    which is used to create and run programs (the JDK contains the JRE). Since you
    are reading this book, you almost certainly want the JDK. You can get the Java
    SE (Standard Edition) JDK from [https://www.oracle.com/java/technologies/downloads/](https://www.oracle.com).
    Java 9 and beyond are (currently) free for personal use, but commercial users
    should obtain a license from the Oracle Corporation.


    # Chapter 1 A Lightning Tour of Java


    DOI: [10.1201/9781003402947-1](https://doi.org/10.1201/9781003402947-1)


    This book is designed to get the experienced programmer in some other language
    to start programming in Java as quickly as possible. Consequently, this first
    chapter is very condensed and takes a great deal for granted; you do not have
    to understand or remember everything in the first reading. Later chapters will
    cover the same material more slowly and in greater detail.


    > Note: Java is verbose, and code lines are often 80 to 100 characters long. Such
    lines have been split into more but shorter lines in an attempt to improve readability.


    ## 1.1 Projects


    A program, or ***project***, consists of one or more ***packages***. A ***package***
    is a directory or folder that contains Java files.


    Java files contain ***classes***, usually one class per file. A ***class*** describes
    a new type of ***object***, and bundles together the object''s ***fields*** (its
    data) and its ***methods***. A class has one or more ***constructors*** to create
    new objects of that type.

