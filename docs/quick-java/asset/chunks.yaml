    with the expectation that they may be extended later.


    The use of getters and setters does incur a slight loss in performance. However,
    they give you the freedom to revise and update the structure of your objects without
    having to worry about what other classes may be accessing the fields of those
    objects. It also gives you a lot more flexibility. For example, your object could
