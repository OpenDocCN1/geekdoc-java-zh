    ```

    case "Yes":

    ```


    ```

    case "YES":

    ```


    ```

    some statements

    ```


    在 Java 14 及以后，上述内容可以简化为：


    ```

    case "yes", "Yes", "YES": some statements.

    ```


    `default` 情况是可选的，且应该放在最后；如果没有找到更早匹配的 `expression`，将执行它。如果没有找到匹配的 `expression`
    且没有 `default` 情况，`switch` 语句将退出而不执行任何操作。


    始终包含 `default` 情况是一个良好的习惯，即使你认为已经涵盖了所有可能性。`default` 情况可以是空的，也可以包含语句 `assert false;`；用此指示这段代码不应被触及。（断言语句在节
    3.3.2.1 中介绍过。）


    `statements` 可以是任意数量的零或多个语句的序列。

