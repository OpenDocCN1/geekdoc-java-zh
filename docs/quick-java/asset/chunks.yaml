    \ teleprinter code. Seven bits was enough to represent 128 characters, which seemed\
    \ like enough at the time.\n\nUnfortunately, that left one bit free, and if that\
    \ extra bit were set to 1 rather than 0, another 128 characters could be added:\
    \ dashes, “smart quotes,” French characters, and so on. So every manufacturer\
    \ did so, and did it differently, with the result that, say, smart quotes on a\
    \ Windows machine came out as garbage characters on the Macintosh, and vice versa.\
    \ You still see the occasional garbage character today, from people who unknowingly\
    \ use some platform-specific encoding for non-ASCII characters.\n\nToday, almost\
    \ everything uses `Unicode`, which is adequate for most of the languages of the\
    \ world. Unicode includes mathematical symbols, arrows, traffic signs, emojis,\
