    ```

    JFrame myFrame = new JFrame();

    ```


    To specify a standard action to take when a JFrame is closed:


    ```

    setDefaultCloseOperation(JFrame.EXIT_ON_CLOSE);

    ```


    or HIDE_ON_CLOSE, DISPOSE_ON_CLOSE, or DO_NOTHING_ON_CLOSE.


