    The [java.lang](https://docs.oracle.com/en/java/javase/17/docs/api/java.base/java/lang/package-summary.html)
    page contains a brief description of the purpose of the package, and very brief
    descriptions of what some of the classes are for. Following that is a list of
    “Related Packages,” followed by a tabbed list of classes. For purposes of illustration,
    choose either “All Classes and Interfaces” from the tabbed list (probably already
    selected) or “Classes.”


    You will see some of the classes we have already mentioned, such as [Character](https://docs.oracle.com/en/java/javase/17/docs/api/java.base/java/lang/Character.html)
    and [Exception](https://docs.oracle.com/en/java/javase/17/docs/api/java.base/java/lang/Exception.html).
    Scroll down and click on `String`.


    Right under `Class String` you will see that its superclass is [java.lang.Object](https://docs.oracle.com/en/java/javase/17/docs/api/java.base/java/lang/Object.html)
    (clickable) and that it has implemented some interfaces (also clickable). The
    methods inherited from `Object` will not be described on this page (unless they
    have been overridden), but they will be listed further down. Methods from the
    interfaces are described below, along with all the other methods.


    Next is a brief explanation of string objects, a field summary, a list of constructors,
    and further down a tabbed list of lists, one of which is “All Methods.” If that
    tab isn’t already selected, then click it.


    We will pick one method on this page to examine. Scroll down to the line that
    looks like [Table 3.1](#ch03.xhtml_table3_1):


    [Table 3.1 Short indexOf entry in Java API](#ch03.xhtml_Ttable3_1)


    | int | `indexOf(String str)` | Returns the index within this string of the first
    occurrence of the specified substring. |


    This line says that the `indexMethod` takes a `String` as a parameter, and returns
    an `int` result. After this, there is a brief description of what the method does—a
    longer description is further down the page. What is only *implied* (because this
    is a method in the `String` class) is that `indexOf` is a message you send to
    a `String`: For example, `story.indexOf("Toby")` searches the string `story` for
    the string `"Toby"`.


    In this line, `indexOf` and `String` are bold, meaning that they are clickable.
    Often, the description is all you need, but you can click on the method name to
    jump down to a detailed description.


    There will be a lot on these pages you don’t understand. That''s fine; the important
    thing is to get comfortable exploring the documentation, and using the parts you
    do understand. If you are working a lot with strings, it is worthwhile to look
    through the methods to find ones you might use.


    One important word to know is “deprecated.” A `deprecated` method is one that
    still works, but has been supplanted by something newer and better. Don’t use
    deprecated methods if you can avoid it. Usually there is a link to the newer,
    shinier version.


    ## 3.5 Objects and Classes


    The syntax of classes and objects will be discussed later, but it is helpful to
    begin with some understanding of what these things are.


    Before object-oriented programming, data and functions would be distributed throughout
    a program, perhaps grouped to some extent, but with no formal organization. Object-oriented
    programming provides that organization.


    An `object` is a “thing.” Some objects represent things in the real world, such
    as a `Customer` or a `Date`. Most objects represent things in the “computer world,”
    such as a `String` or a `HashMap`. Some things are in-between, such as a `Calendar`.
    Each object has some data, called `fields`, describing this particular object,
    and it has some methods, defining what the object can do.


    A `method` is a `function that belongs to an object` (or, in some cases, to a
    class). The methods manipulate the data of the object in various ways, such as
    updating it or providing information about it. Originally, Java had no actual
    functions; it only had methods.


    A `class` defines a `type` of object. It tells what fields are in each object,
    and what methods operate on that object.


    For example, if you were to write the software to maintain an online store, you
    might have:


    * An `Inventory` object to maintain a list of `Item` objects you have for sale.

    * Numerous `Item` objects, each with a price, a description, a `shippingWeight`,
    a `numberOnHand`, and so on.

    * An `Order` object might be a list of `Items` being ordered by a `Customer`.
    You might have methods to add an `Item` to this order and to remove an `Item`
    from it.

    * Each `Customer` object could have a name, a `currentOrder` (of type `Order`),
    an `amountOwed`, and so on.


    Each class has at least one `constructor` for making new objects of that type.
    To create a new `Item` object, you may have to provide the constructor with a
    description of the item, its shipping weight, its price, and whatever else is
    important about the item.


    > **Key concept: *Object-oriented programming*** is all about creating a society
    of cooperating, active “agents” (called “objects”) that, working together, accomplish
    the desired task.


    In Java almost everything, and certainly all executable code, is in classes.


    An `interface` is a list of methods that a class may choose to implement. Interfaces
    are described in [section 4.1.3](#ch04.xhtml_sec4_001_001).

