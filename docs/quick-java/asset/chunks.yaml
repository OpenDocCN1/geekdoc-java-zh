    ### 5.2.2.4 字符与 Unicode


    `字符编码`（character encoding）是字符与整数之间约定的映射：''A'' 是 65，“B'' 是 66，以此此类推。Java 内部使用 Unicode，特别是
    UTF-16。Unicode 是复杂的，了解它的历史可能有所帮助。


    最早的字符编码之一是 `ASCII`，“美国信息交换标准代码”。它每个字符使用一个字节。一个字节是 8 位，但 ASCII 只使用了其中 7 位，因为它基于七位电字机代码。7
    位足以表示 128 个字符，这在当时看来是是足够的。


    遗憾的是，这留下了一个空闲位，如果这个额外的位被设置为 1 而不是 0，就可以再添加 128 个字符：破折号、“智能引号”、法语字符等。因此，每个制造商都这样做，且方式各异，导致的结果是，例如
    Windows 机器上的智能引号在 Macintosh 上会变成乱码，反之亦然。今天你仍然能偶尔看到乱码，那是人们在不经意间对非 ASCII 字符使用了某些特定平台的编码导致的。


    今天，几乎所有内容都使用 `Unicode`，它对于世界上大多数语言都是足够的的。Unicode 包含了数学符号、箭头、交通标志、表情符号等。


    当 Java 采用 Unicode 时，Unicode 每个字符使用两个字节（16 位）。ASCII 字符集是 Unicode 的子集——''A'' 仍然是
    65，以此此类推。这允许表示 65536 个字符，在加入中文、日语、阿拉伯语及少数其他语言之前这是足够的。


    > **术语：** 在 Java 中，`代码点`（code point）是 Unicode 字符的数值编码，可以放入两个字节中；即 ''\u0000'' 到
    ''\uuFFFF''。`补充字符`（supplementary character）是指超过两个字节的字符。Java 可以以某种方式处理补充字符，但 `Character`
    类中的大多数方法只能与代码点一起。


    在内部，Java 在可能时使用单字节字符表示字符串，在必须时使用双字节字符，在别无其他选择时使用更多字节。幸运的是，它很好地向程序员隐藏了这种复杂性。以“代码点”作为参数的字符方法接收的是“普通”字符或小于
    65536 的数字。


    `char` 是基本类型，因此它不能像对象一样处理。为了弥补这一缺陷，`java.lang` 包包含一个 `Character` 类，带有许多静态方法。这些包括
