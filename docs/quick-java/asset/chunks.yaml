  trans: "\n`expression` 的值必须是 case `Types` 的超类型。当找到匹配的 `Type` 时，`expression` 的值将赋值给相应的\
    \ `variable`，并执行 `action`（表达式或语句）。\n\n与早期版本的 switch 语句不同，`any` 对象类型可以作为 case 类型，包括\
    \ `null`。然而，基本类型不能使用。\n\n`guarded pattern`（守护模式）允许我们在选择类型后对值进行额外的测试。它的形式如下：\n\n\
    ```\ncase Type variable && guard -> action\n```\n\n其中 `guard` 是使用 `variable` 值的布尔表达式。如果布尔表达式很复杂，应该放在括号中。\n\
    \n这是一个使用 switch 表达式的示例。\n\n```java\nString s = switch (shape) {\ncase Rectangle\
    \ r && r.width == r.height ->\n\"It's a square';\ncase Rectangle r ->\n'It's a\
    \ rectangle';\ncase Triangle t ->\n'It's a' + t.width + 'by' +\nt.height + 'triangle.';\n\
    default -> 'It's a shape.';\n};\nSystem.out.println(s);\n```\n\n### 3.3.2.5 Try-catch-finally\n\
    \n可能抛出受检异常的代码必须在声明抛出该异常的方法中，或者必须在 try-catch-finally 语句的 try 部分。语法如下：\n\n```java\n\
    try {\n    可能会抛出异常的代码\n} catch (SomeExceptionType variable) {\n    处理此类异常的代码\n\
    } catch (SomeOtherExceptionType variable) {\n    处理此其他异常类型的代码\n} finally {\n \
    \   在离开前总是会执行的代码\n}\n```\n\n可以根据需要编写任意数量 catch 块来捕获不同类型的异常；`finally` 块通常是可选的。但\
    \ 如果 catch catch 块，则需要一个 finally 块。\n\n首先，执行 `try` 块中的代码。如果它正常完成（没有异常或错误），则跳过\
    \ catch 块。但如果在执行 `try` 块期间发生异常或错误，执行将立即跳转到第一个可以处理该类型异常的 catch 块。\n\n无论 `try` 块中的代码是否正常完成，`finally`\
    \ 块（如果存在）**总是**执行。如果 `try` 块或其中一个 catch 块尝试通过其他方式退出（通过 `return`、`break` 或 `continue`\
    \ 语句），`finally` 块会“横插进来”并在退出语句发生之前执行。\n\n### 3.3.2.6 Throw Statements\n\n当 Java\
    \ 检测到发生错误时，它会创建一个 `Exception` 对象并将其抛出（`throws`）。你的代码也可以故意创建并抛出异常。通常情况下，你会在 `throw`\
    \ 语句中创建一个新异常。\n\n```java\nthrow new ExceptionType(message);\n```\n\n> **注意：**\
    \ 这与 C++ 的不同在于，在 Java 中，只有 `Throwable` 类型（异常和错误）可以被抛出。\n\n在本节中我们只考虑一个简单的示例。\n\n\
    假设如果变量 `b` 为负，意味着出了某些问题。你可能会写：\n\n```java\nif (b < 0) {\n    throw new Exception(\"\
    b is negative\");\n}\n```\n\n这段代码创建了一个非常通用的类型 `Exception` 对象（还有更多具体的异常类型），并立即抛出该\
    \ `Exception`。\n\n某些异常类型是受检的（`checked`）。如果你执行可能抛出受检异常的代码，Java 强制要求你对其做某些处理；如果不这样做，将是语法错误。你可以做的一件事是将违规代码放在\
    \ try-catch 语句的 try 部分。\n\n或者，你可以说你的方法（可能）抛出该异常。那么无论谁调用你的代码都必须处理该异常；这不再是你的责任了。\n\
    \n```java\nint myMethod(int a, int b) throws Exception {\n    if (b < 0) {\n \
    \       throw new Exception(\"b is negative\");\n    }\n    // 其他内容\n}\n```\n\n\
    现在，调用 `myMethod` 的代码必须在 try-catch 语句的 try 部分中调用它，或者该调用方法的头部必须包含 `throws` 部分。通过这种方式，异常在最终被处理之前，可能会向上传递多层方法调用。如果它一直上传到\
    \ `main` 方法且 `main` 方法没有处理它，程序将带错误终止。\n\n> **注意：** 异常的一类特殊组，`RuntimeException`\
    \ 及其子类，是未检的（`unchecked`）异常；也就是说，它们不需要被捕获或在方法头部中提到。未检异常通常是程序中错误的结果。\n\nJava 中的异常是复杂且昂贵的，因此它们应该保留用于处理问题的情况；它们不应该作为“正常”控制流的一部分。\n\
    \n### 3.3.3 Reading from a File\n\n从文本文件读取或写入的基本方法是：(1) 打开文件，(2) 使用文件，(3) 关闭文件。这些步骤每一步都可能引发必须处理的异常。\n\
    \n`FileReader` 类具有读取字符并返回它们的方法。这很不方便，因此读取文件的通常方法是在其周围封装一个 `BufferedReader`。`BufferedReader`\
    \ 具有以下方法（以及其他）：\n\n* `readLine()` 读取并返回一行（作为 `String`），或者如果到达文件末尾则返回 `null`。\n\
    * `read(charArray, index, n)` 从 `index` 开始向字符数组中填充 `n` 个字符。返回值为实际读取的字符数。\n* `close()`\
    \ 关闭 `BufferedReader` 及其关联的 `FileReader`。关闭一个已关闭的读取器不会抛出异常。\n\n`FileReader` 构造函数的\
    \ `file` 参数可以是 `File` 对象，可以是表示文件路径的字符串。如果文件不存在，构造函数将抛出 `FileNotFoundException`。`BufferedReader`\
    \ 的构造函数不会抛出 `IOException`，但对 `readLine`、`read` 或 `close` 的任何使用可能会如此。\n\n```java\n\
    FileReader fr = new FileReader(file);\nBufferedReader br = new BufferedReader(fr);\n\
    String line = br.readLine();\n```\n\n### 3.3.4 Try With Resources\n\ntry-resources\
    \ 语句是 try-catch-finally 语句的扩展，提供了一种在使用后关闭资源更方便的方法。与其编写：\n\n```java\ntry { … }\n\
    ```\n\n不如：\n\n```java\ntry (resource declarations) { … }\n```\n\n可以有任意数量的可关闭资源声明，用分号隔开。例如：\n\
    \n```java\ntry (FileReader fr = new FileReader(\"/Users/dave/test.txt\");\n  \
    \   BufferedReader br = new BufferedReader(fr)) {\n    String line = br.readLine();\n\
    \    System.out.println(line);\n} catch (IOException e) { }\n```\n\n通过这种构造，无论是否发生异常，`FileReader`\
    \ 和 `BufferedReader` 在使用后都会自动关闭。\n\n如果这段代码出现在标记为抛出 `IOException` 的方法中，则 catch\
    \ 子句是可选的。finally 子句是可选的，但通常不需要。\n\n> **注意：** 上述路径之所以是这种形式是因为代码是在 Macintosh 上测试的。在\
    \ Windows 机器，路径通常以 C: 开头并使用双反斜杠而不是斜杠。\n\nJava 9 引入了 try-resources 语句的更短版本，有时很有用。在这个版本中，如果资源之前已经定义并且最终的或“有效最终的”（effectively\
    \ final），则只需命名它们。例如，如果 `BufferedReader br` 和 `FileReader fr` 已经定义并且是有效最终的，那么这种简单的形式就可以工作：\n\
    \n```java\ntry (br; fr) {\n    line = br.readLine();\n    System.out.println(line);\n\
    } catch (IOException e) { }\n```\n"
