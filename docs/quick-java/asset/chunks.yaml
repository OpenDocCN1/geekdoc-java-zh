  trans: "\n用于返回值的方法的循环。`expression` 的类型必须与方法预期返回的类型相同，或者比该类型窄。\n\n例如，如果一个方法预期返回 `double`\
    \ 类型的值，返回语句可以使用 `int` 类型的表达式；在方法返回时，结果将转换为 `double`。\n\n### 3.3.1.14 空语句\n\n尽管用途非常有限，但\
    \ Java 允许使用“空”语句，它由一个单独的分号组成。以下语句是等价的：\n\n```\nfor (n = 1; n < 1000; n = 2 * n)\
    \ {}\n```\n\n以及\n\n```\nfor (n = 1; n < 1000; n = 2 * n);\n```\n\n这两种语句的结果都会导致\
    \ `n` 被设置为 1024。\n\n### 3.3.2 C++ 中不存在的语句\n\n以下语句要么完全不存在于 C++ 中，要么与之差异巨大，因此需要额外的解释。\n\
    \n#### 3.3.2.1 断言语句 (Assert Statements)\n\n`assert` 语句的特殊之处在于它通常“什么都不做”。相反，它是某种可执行文档的形式：你是在*断言*某些事是真实的。它有两种形式：\n\
    \n```\nassert booleanExpression;\n```\n\n```\nassert booleanExpression : expression;\n\
    ```\n\n执行过程如下：求值 `booleanExpression`，如果为真，控制直接传递到下一条语句。但如果为假，则会抛出一个 `AssertionError`。如果使用第二种形式，`expression`\
    \ 的值（可以是任何类型）将包含在错误消息中。\n\n默认情况下，断言被视为注释。若要使 `assert` 语句可执行，请使用 VM 标记 `-enableassertions`\
    \ 或其缩写 `-ea`。\n\n> **注意：** 从命令行运行时，`VM`（`Virtual Machine`虚拟机）标记可以放在 `java` 单词之后。在\
    \ IDE 中运行时，标记将作为配置选项出现。\n\n`assert` 语句的目的是声明一个你认为在程序该处始终为真的条件。它不应该被用于检查你认为可能发生的潜在错误情况；对于这种情况，你应该抛出异常（参见第\
    \ 3.3.2.6 节）。\n\n在编写代码时，养成在适当位置添加 `assert` 语句的习惯是一个好主意。\n\n除非你有用的内容要添加，否则使用第二种形式（带有\
    \ `expression`）意义不大。例如，如果你认为某个数组索引 `i` 始终在数组范围内，你可能会说：\n\n```\nassert i >= 0 &&\
    \ i < myArray.length:\n```\n\n```\n\"Bad array index:\" + i;\n```\n\n最后，可以使用惯用写法\
    \ `assert false;` 来表示你认为某些代码段（例如 `switch` 语句的 `default` 情况）永远无法被访问。然而，将此（或其他任何）语句放置在\
    \ Java 编译器知道无法到达的位置（例如紧跟在 `return` 语句之后）将是语法错误。\n\n#### 3.3.2.2 打印“语句”\n\n有两种可以向用户打印消息的“语句”。它们是：\n\
    \n```\nSystem.out.println(value);\n```\n\n以及\n\n```\nSystem.out.print(value);\n\
    ```\n\n区别在于 `print` 仅打印 `value` 的字符串表示，而 `println` 打印该字符串后跟着一个换行符。也就是说，`print`\
    \ 之后打印的下一个内容将在同一行，而 `println` 之后打印的下一个内容将另起新行。\n\n尽管 `print` 和 `println` 的用法就像语句一样，但它们实际上是方法，具有在屏幕上显示某些内容的*副作用*。（没有副作用的方法调用也可以用作语句，但这通常没有意义，因为返回值会被忽略。）\n\
    \n如果 `value` 是一个对象类型，`print` 和 `println` 将调用其 `toString` 方法以获取对象的对象的打印表示。这让你对对象如何被打印有了相当的/可观的控制权（参见第\
    \ 4.4.1 节）。\n\n在 `print` 或 `println` 调用的参数列表中直接构造字符串（使用 `+` 连接各个部分）通常很方便。任何“添加”到字符串中的内容都将被转换为字符串。\n\
    \n```\nSystem.out.println(\"The sum is\" + sum);\n```\n\n> **技术说明：** `System`\
    \ 是 `java.lang` 包中一个类的名，`out` 是 `System` 类中类型为 `PrintStream` 的对象。`PrintStream`\
    \ 类有几个方法，包括 `print` 和 `println`。使用这些方法时不需要了解这一点。\n\n打印到屏幕很容易，但从键盘获取输入需要使用 `Scanner`\
    \ 对象，这在第 3.4.1.3 节中有所介绍。\n\n#### 3.3.2.3 Switch 语句和表达式\n\nJava 14 引入了显著改进的 `switch`\
    \ 语句。（旧版本仍然可用）。新版本既可以当作语句，也可以用作返回值的*表达式*。其语法如下：\n\n```\nswitch (expression) {\n\
    ```\n\n```\ncase constants1 -> action1\n```\n\n```\ncase constants2 -> action2\n\
    ```\n\n```\n…\n```\n\n```\ncase constantsN -> actionN\n```\n\n```\ndefault ->\
    \ actiondef\n```\n}\n```\n\n`expression` 产生整数、`String` 或 `Enum`。\n\n`switch` 无论是作为语句还是表达式，都会求值\
    \ `expression`，选择匹配的项，并执行与常量相关的 `action`。`constants` 是逗号分隔的列表。\n\n> **注意：** 与“经典”switch\
    \ 语句不同，这里不会贯穿（fall through）到下一个操作。\n\n当作为语句时，每个 `action` 是单条语句，可能是复合语句。`default`\
    \ 情况是可选的；如果没有匹配的常量，则什么都不做。\n\n当作为表达式时，每个 `action` 可以是\n\n* 类型类型的表达式，作为 switch\
    \ 的值。\n* 复合语句，包含 `yield`。`yield` 的作用类似于方法中的 `return` 语句。\n* `throw` 语句。\n\n作为表达式时，它*必须*返回值或抛出异常。在实践中，这意味着要么需要\
    \ `default` 情况，要么 `constants` 包含了 `Enum` 的所有可能值。\n\n下面的无意义示例说明了 switch 作为表达式的用法。\n\
    \n```\nlong nonsense = switch (i) {\ncase 1 -> 100000000000L;\ncase 2 -> 17 *\
    \ x;\ncase 3, 4 -> 'a';\ncase 5 -> {\n    System.out.println(\"Five!\");\n   \
    \ yield 55;\n}\ncase 6 -> throw new RuntimeException();\ndefault -> -1;\n};\n\n\
    ```\nSystem.out.println(nonsense);\n```\n\n#### 3.3.2.4 Switch 语句中的模式匹配\n\n如上一节所述，Java\
    \ 14 引入了 switch 语句的新形式，以及 switch *表达式*，使用箭头 (->) 代替冒号 (:)。Java 17 使用模式匹配极大扩展了\
    \ switch 语句和表达式的功能。\n\n> **警告：** 模式匹配是 Java 17 的一个*预览功能*。这意味着 (1) 它在未来的 Java 版本中可能会更改或消失，并且\
    \ (2) 你可能需要设置 `enable-preview` 标记才能使用它。\n\n尽管名字如此，但模式匹配与正则表达式无关。相反，切换是基于表达式的*类型*进行的，表达式的结果被赋值给新变量。\n\
    \n```\nswitch (expression) {\ncase Type1 variable1 -> action1\ncase Type2 variable2\
    \ -> action2\n…\ncase TypeN variableN -> actionN\ndefault -> actiondef\n}\n```\n"
