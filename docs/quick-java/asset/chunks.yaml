  trans: "\n\n```\nmyCake instanceof Cake // true\n```\n\n```\nmyCake instanceof Object\
    \ // true\n```\n\n`instanceof` 测试可以用来检查一个变量是否可以强制转换为特定类型，但它不会执行强制转换。\n\n```\n\
    if (obj instanceof BirthdayCake) {\n```\n\n```\nBirthdayCake bc = (BirthdayCake)\
    \ obj;\n```\n\n```\n… 在此处使用 bc\n```\n\n```\n}\n```\n\n从 Java 14 开始，这可以简写为：\n\n\
    ```\nif (obj instanceof BirthdayCake bc) {\n```\n\n```\n… 在此处使用 bc\n```\n\n```\n\
    }\n```\n\n## 4.4 重写 (Overriding)\n\n对象从其超类继承方法，`Object` 是所有对象的根超类，因此每个对象都继承了 `Object`\
    \ 类中定义的所有方法。\n\n如果继承的方法不是所需的所需的，可以使用具有相同名称、相同参数个数和相同参数类型的不同方法对其进行**重写**（替换）。要做到这一点：\n\
    \n1.  在方法之前直接编写 `@Override` 注解。\n    *   `annotation`（注解）是给编译器的指令。`@Override`\
    \ 注解要求编译器检查名称和参数列表是否与继承的方法匹配，因为如果不匹配，你只是在定义另一个方法，而不是在重写方法。\n\n2.  编写一个与你想要重写的方法具有相同名称、相同参数个数以及相同类型（顺序相同）的方法。\n\
    \    *   参数 `names` 不需要相同，且重写方法甚至可以有不同的返回类型。\n\n3.  确保新方法的访问权限**至少与它所重写的方法一样**。（权限顺序为\
    \ `private`、`package`、`protected` 和 `public` ）。如果被继承的方法是 `public` 的，则任何重写它的方法也必须是\
    \ `public`。\n\n在定义自己的对象时，重写从 `Object` 继承的三个方法通常是一个好主意：\n\n*   `toString()` 返回此对象的\
    \ `String` 字符串表示。\n*   `equals(obj)` 测试此对象是否与对象 `obj` 相等。\n*   `hashCode()` 返回此对象的\
    \ `int` 类型的哈希码。\n\n这些方法的继承版本几乎没有用处；它们的存在是为了可以被重写。通过在 `Object` 中定义它们，Java 可以确保每个对象都拥有这些方法的某个版本。\n\
    \n如果你的类重写了继承的方法，该继承方法仍然可用：只需在方法调用前加上 `super` 前缀即可。也就是说，`super.methodName(parameters)`\
    \ 将忽略本地方法 `methodName` 并使用继承的版本。\n\n继承的字段可以通过声明一个同名的字段被**遮蔽**（shadowed，隐藏）。这通常是因为程序员没有意识到该字段已经存在；如果不需要被遮蔽的字段，这个错误就是无害的。当变量被遮蔽时，`super.fieldName`\
    \ 可以访问继承的字段。\n\n### 4.4.1 重写 toString\n\n每个对象都有一个从 `Object` 继承的 `toString` 方法。当将对象“相加”到字符串以及尝试打印对象时，它会被自动调用。你也可以直接调用它。\n\
    \n继承的 `toString` 方法非常没用。它的存在主要是作为一个占占位符，以便你用一个更有用的版本来重写它。\n\n这里是 `Counter` 对象一个可能的\
    \ `toString` 方法：\n\n```\n@Override\npublic String toString() {\n    return \"\
    My count is \" + count;\n}\n```\n\n继承的 `toString` 方法是 `public` 的，因此重写它的版本必须是 `public`。\n\
    \n继承的 `toString` 不接受参数并返回 `String` 结果，因此重写它的版本也必须这样做。\n\n如果这些方面的任何一个**不匹配**继承的\
    \ `toString` 方法，那么你可能拥有一个重载（overloads）但没有重写继承方法的有效方法。如果该方法标记了 `@Override` 注解，这种错误会被捕获。\n\
    \n虽然 `toString` 方法可以用于向用户展示信息，但其他方法通常为此目的编写的。`toString` 的真正价值在于调试期间，此时它可以显示对象的实际内容。\n\
    \n### 4.4.2 重写 Equals\n\n每个对象都从 `Object` 继承一个 `equals` 方法，但该方法实际测试的是**身份标识**（identity）。根据该方法，两个对象“相等”当且仅当它们是**同一个**对象，且占据内存中的**相同**位置。这也是\
    \ `==` 比较运算符应用于对象时所做的事情。\n\n> **重要：** 对于对象而言，`==` 始终是身份标识测试，而不是相等性测试。`equals`\
    \ 方法**也是**一个身份标识测试，除非它已经针对该特定类的对象被重写。\n\n继续使用我们的 `Counter` 类作为示例，一个典型的 `equals`\
    \ 方法看起来如下：\n\n```\n@Override\npublic boolean equals(Object obj) {\n    if (obj\
    \ == this) return true;\n    if (! (obj instanceof Counter)) return false;\n \
    \   Counter that = (Counter)obj;\n    return this.count == that.count;\n}\n```\n\
    \n1.  首先，我们说正在重写某个方法，然后给它一个与我们尝试重写的方法完全相同的头部。\n2.  编写与你想要重写的方法相同名称、相同参数个数和相同参数类型（顺序相同）的方法。（参数\
    \ `names` 不需要相同，且重写方法甚至可以有不同的返回类型。）\n3.  确保新方法的访问权限**至少与它所重写的方法一样**。（权限顺序为 `private`、`package`、`protected`\
    \ 和 `public` ）。如果被继承的方法是 `public` 的，则任何重写它的方法也必须是 `public`。\n\n（注：此处原文逻辑似乎存在部分乱码或重复，已根据逻辑进行了翻译处理）\n\
    \n1.  首先，我们说正在重写某个方法，然后给它一个与我们尝试重写的方法完全相同的头部。\n2.  一个极其常见的错误是指定错误的类型。我们通常想要比较这个\
    \ `Counter` 和另一个 `Counter`，所以 `equals` 的参数必须是 `Object`。\n3.  接下来我们看我们是否在比较 `Counter`\
    \ 自身。`this` 关键字指向当前执行方法的对象；也就是说，如果我们在测试 `c1.equals(c2)`，`this` 指向 `c1`。\n4.  由于该方法接受**任何**类型的对象作为参数，我们可能希望在调用\
    \ Octopus 时返回 `false`。\n5.  说 `obj.count` 是错误的，因为并不是所有对象都有 `count` 字段。我们必须将 `obj`\
    \ 强制转换为 `Counter` 并保存到 `Counter` 类型的变量中以便使用。（我喜欢使用变量名，但其他名字也可以。）\n6.  最后，我们有两个\
    \ `Counter` 对象可以比较。这种测试可能非常复杂，但对于我们简单的 `Counter` 对象，我们只需测试它们的 `count` 字段是否相等。\n\
    \n`equals` 方法应该定义一个等价关系（equivalence relation）。也就是说，对于任何对象 `obj[1]` 和 `obj[2]`，它应该具有以下属性：\n\
    \n*   自反性（Reflexive）：`obj[1].equals(obj[1])` 始终为真。\n*   对称性（Symmetric）：`obj[1].equals(obj[2])`\
    \ 的结果应与 `obj[2].equals(obj[1])` 相同。\n*   传递性（Transitive）：如果 `obj[1].equals(obj[2])`\
    \ 且 `obj[2].equals(obj[3])`，那么 obj[1].equals(obj[3])` 必须成立。\n\n遗憾的是，对称性只能“部分”实现。如果\
    \ `obj[1]` 是一个对象而 `obj[2]` 是 `null`，那么 `obj[1].equals(obj[2])` 应该返回 `false`，但\
    \ `obj[2].equals(obj[1])` 会导致 `NullPointerException`。可以通过让两者都产生 `NullPointerException`\
    \ 来来实现对称性，但这似乎并不好用。\n\n幸运的是，任何合理的 `equals` 定义都可能满足这些属性，只要它们在 Java 中是可以满足的。\n\n\
    ### 4.4.3 重写 HashCode\n\nJava 中有一条“规则”，如果你重写了 `equals`，就也应该重写 `hashCode`。\n\n"
- fmt: "\n`hash code` is an arbitrary integer assigned to an object. It has no more\
    \ meaning than, say, a phone number. Hash codes are used by a number of classes,\
    \ such as `HashSet` and `HashMap`. If you never use these classes, and never give\
    \ your code to anyone who might, there is no need to override `hashCode`; but\
    \ it's cheap and easy to do, so you should anyway.\n\nThe point to remember is\
    \ that *equal objects must have equal hash codes*. If you use only part of an\
    \ object to test for equality, use those same parts to create a hash code. This\
    \ is absolutely necessary for classes like `HashMap` to work correctly.\n\nIt\
    \ is *not*, repeat *not*, the case that unequal objects must have different hash\
    \ codes. It's better if they do, but relatively harmless if they don’t. If you\
    \ use a hash code of zero for every object, your code may run a thousand times\
    \ slower, but it will still work.\n\nWe have defined two `Counter` objects to\
    \ be equal if they have the same `count` value, so the `hashCode` method practically\
    \ writes itself.\n\n```java\n@Override\npublic int hashCode() {\n    return count;\n\
    }\n```\n\nIf you have a `Customer` class with a `name` field, and if the `name`\
    \ fields of two customers have to match for them to be considered equal, you can\
    \ use the hash code of `name` for the hash code of your `customer`.\n\n```java\n\
    @Override\npublic int hashCode() {\n    return name.hashCode();\n}\n```\n\nIf\
    \ your `equals` method for `Customer` also requires other fields to be equal,\
