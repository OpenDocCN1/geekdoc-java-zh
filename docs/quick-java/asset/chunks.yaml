  trans: "\n一元运算符和赋值运算符是`右结合的`——具有相同优先级的运算符从右到左执行。例如，`a = b += c` 意味着 `a = (b += c)`。\n\
    \n和往常一样，可以使用括号显式地指定运算顺序。Java 中还有许多其他运算符，但由于极少有程序员知道完整的优先级表，最好使用括号来使运算顺序清晰可见。\n\
    \n不重要的运算符（`++`、`--`、`?::` 以及移位和位操作运算符）将在稍后讨论——分别参见 5.2.4.4 节 (`++` 和 `--`)、5.2.4.2\
    \ 节 (`?:`) 以及 5.2.4.3 节（位和移位）。\n\n当仅使用整数类型（包括 `char`）进行算术运算时，结果为 `int`。使用 `double`\
    \ 与任何数值类型进行算术运算的结果都是 `double`。\n\n布尔运算 `&&` 和 `||` 是`短路操作`：如果在求值左侧操作数后已知结果，则不再计算右侧操作数。因此，在表达式\
    \ `f(x) && g(x)` 中，如果 `f(x)` 为假，则结果必为假，因此不计算 `g(x)`。同样，在表达式 `f(x) || g(x)` 中，如果\
    \ `f(x)` 为真，则结果必为真，因此不计算 `g(x)`。\n\n### 3.2.6 声明与转换\n\n每个变量必须声明其类型以及可选的初始值。例如：\n\
    \n* `int count = 0, size;` \n* `double min, max, average;`\n* `char c;`\n\n如果\
    \ Java 认为你可能在给变量赋值之前就使用了它，它将会报错。如果 Java 没有捕获到这个错误，数值类型使用的值将为零，布尔类型将为 false。\n\n\
    `char` 变量可以存储约 65000 个 UTF-16 字符中的任何一个（参见 5.2.2.4 节）。字符内部存储为数字，并可以像整数一样用于算术运算。你可以用十六进制编写\
    \ UTF-16 字符，如 `'\\uxxxx'`，其中 `xxxx` 是 `'\\u0000'` 到 `'\\uffff'` 之间的十六进制数。例如，`'\\\
    u0041'` 是 'A'，`'\\u03A3'` 是 'Σ'。\n\n在上述类型中，`double` 被认为比 `int` `宽`，而 `int` 比 `char`\
    \ 宽。一种类型的值可以赋值给宽类型的变量。也就是说，`char` 值可以赋值给 `int` 变量或 `double` 变量，`int` 变量可以赋值给 `double`\
    \ 变量。这被称为`向上转换`（upcasting）。\n\n要进行相反操作，即将较宽的值赋值给较窄类型的变量，你必须将值`强制转换`（cast，或向下转换）到目标类型。通过在值之前紧跟目标类型的名称并加上括号来实现。例如：\n\
    \n```java\nint i = 0;\n```\n\n```java\ndouble d = 2.71828;\n```\n\n```java\ni\
    \ = (int)d;\n```\n\n```java\nSystem.out.println(i); // 输出 2\n```\n\n在上面的示例中，小数部分丢失了。\n\
    \n强制转换影响紧随其后的值：`(int)2 * d` 仅将 `2` 转换为 `int`（它已经是 int 了）。要转换一个表达式，请在表达式周围加上括号：`(int)(2\
    \ * d)`。\n\n另一个例子，考虑：\n\n```java\nchar ch = (char)('a' + 1); // 结果为 'b'\n```\n\
    \n这种强制转换是必要的，因为 `'a' + 1` 的结果类型是 `int`。\n\n在转换到较窄类型时，程序员有责任确保值能够放入该较窄类型，否则结果将非常出乎意。例如，`byte`\
    \ 只能存储 −128 到 127 之间的值，但强制转换 `(byte)1000` 是合法的且结果为 −24。\n\n`boolean` *不是*数值类型，且不能转换为其他类型或从其他类型转换。\n\
    \n### 3.2.7 常量\n\n在变量声明前加上 `final` 关键字会使其变为`常量`；其值不能被更改。例如：\n\n```java\nfinal\
    \ int DAYS_IN_A_WEEK = 7;\n```\n\nJava 了一了一些内置常量，如 `Math.PI` 和 `Math.E`。\n\n常量有助于避免使用“魔数”（代码中意义可能不完全明确的数字）。如果代码给一个变量加\
    \ 29，就会产生问题：为什么要加 29？\n\n然而，用常量的值来命名常量是愚蠢的，例如：\n\n```java\nfinal int TWELVE =\
    \ 12;\n```\n\n因为这对于提高代码的清晰度没有任何帮助。\n\n### 3.2.8 方法\n\n方法类似于函数，不同在于它属于类。由于方法属于类，在\
    \ Java 中每个方法都必须声明。其语法如下：\n\n```java\n/**\n 文档注释\n */\n访问修符 返回类型 方法名(参数列表) {\n\
    \    语句\n}\n```\n\n一个方法包含：\n1. 可选文档注释，说明方法的作用和使用方法。\n2. 可选的访问修饰符。\n3. 返回类型，如果不返回值则为\
    \ `void`。\n4. 方法名。方法名应以小字母开头。\n5. 参数列表。如果没有参数，括号仍然存在。\n6. 方法体，由大括号 {} 组成。\n\n\
    示例：\n\n```java\n/**\n * 闰年是指被 4 整除但不被 100 整除的年份，\n * 除非也能被 400 整除。\n */\nboolean\
    \ isLeapYear(int year) {\n    if (year % 4!= 0) return false;\n    if (year %\
    \ 100!= 0) return true;\n    return year % 400 == 0;\n}\n```\n\n在方法体内你可以声明带有或带有初始值的变量，例如\
    \ `int count = 0;`。所有此类声明都是局部的，也就是说只能在方法内部可见和使用。变量声明通常放在方法开头。方法可以使用其参数的值、局部变量以及类定义的任何字段。关键字\
    \ `this` 指向“该”对象，即执行方法的对象。当局部变量或参数与字段同名时，`name` 本身指向局部变量或参数，而 `this.name` 指向字段。\n\
    \n> 给 Python 程序员的提示：`this` 类似于 Python 中的 `self`。区别在于 `this` 是关键字而不是变量名，且该词通常可以省略。\n\
    \n如果方法被声明返回某种类型的值，则它必须使用具有正确类型的返回语句（或可以转换为正确类型的值）。在没有执行返回语句之前，它不能到达方法的结尾。\n\n\
    如果方法被声明为 `void`（无返回值），则方法可以通过执行不带指定值的 `return;` 来结束，也可以通过到达方法结尾来结束。\n\n> 注意：void\
    \ 不是一个值，所以 `return void;` 是不允许的\n\n为了编写一个完整的程序，至少有一个包含以下特殊方法的“启动”类：\n\n```java\n\
    public static void main(String[] args) { }\n```\n\n### 3.2.9 方法调用方法\n\n"
- fmt: "\nMethods belong to objects, so to “call” a method, you technically “send\
    \ a message to an object.” Do this by naming the object, putting a dot, then putting\
    \ the name of the method and, in parentheses, the correct number and types of\
    \ `arguments`. Each argument is an expression (possibly a single value or variable).\n\
    \n```\nobj.methodName(arguments)\n```\n\nThere must be one argument for each parameter,\
    \ and it must be of a type that can be assigned to that parameter. The called\
    \ method returns a result that can be used in further expressions.\n\nWhen a method\
    \ calls another method in the same class (so that the object is “talking to itself”),\
    \ the `obj` can be the keyword `this`, or it can be omitted. For example, if `isLeapYear`\
    \ is in the same class as `printLengthOfYear`, then in `printLengthOfYear` you\
    \ can say either `this.isLeapYear(year)` or simply `isLeapYear(year)`.\n\n```java\n\
    public void printLengthOfYear(int year) {\n    int days = 365;\n    if (isLeapYear(year))\
    \ { // \"this.\" omitted\n        days = 366;\n    }\n    System.out.println(year\
    \ + \" has \" + days + \" days.\");\n}\n```\n\n### 3.2.10 Overloading\n\nMethods\
    \ may be `overloaded`. That is, a class can have two or more methods with the\
    \ same name, so long as the methods have a different `number` of parameters or\
    \ different `types` of parameters. For example, a class might have two or more\
    \ methods named `bump`.\n\nThe types do not have to match up exactly. If there\
    \ is no exact match, but the argument(s) can be widened to an appropriate type,\
    \ then the method can be used. For example, the `bump(int n)` method could be\
    \ called with `char` argument, but not with a `double` argument.\n\nIf we were\
    \ to add a `bump(char n)` method, then a `bump` message with a `char` argument\
    \ would call this new method, not the one expecting an `int` argument.\n\nConstructors,\
    \ like methods, can be overloaded.\n\nMany of the methods provided by Java are\
    \ overloaded. For example, there are nine versions of `System.out.print(arg)`\
    \ and ten of `System.out.println(arg)`. These methods have a separate version\
    \ for each of `boolean`, `char`, `double`, `float`, `int`, `long`, `Object`, `String`,\
    \ and `char[]`. (No separate versions are provide for `byte` and `short`, because\
    \ these can be widened and used by the `int` method.) There is one additional\
    \ version of `println` that takes no argument, and prints a blank line.\n\n###\
    \ 3.2.11 Scope\n\nEvery variable has a `scope`, which is the part of the program\
    \ in which the variable may be used. The scope depends on where the variable is\
    \ declared.\n\n#### 3.2.11.1 Variables Declared in Classes\n\nVariables that are\
    \ declared within a class are available everywhere within the class. If a variable\
    \ is declared with an initial value, that value may be used in subsequent declarations.\n\
    \n```java\npublic class MyClass {\n    int x = 5;\n    int y = x + 1; // can use\
    \ x here\n    int z = w + 1; // but this is illegal\n    // now we can use x,\
    \ y, and z\n    int w = 3;\n    // now we can also use w\n    …\n}\n```\n\nHere's\
    \ one way to think of it. When a class is first used, Java goes through and executes\
    \ all the top-level declarations (that is, those not in methods), in the order\
    \ that they appear. After that, the methods in the class are available for use.\n\
    \n> **Exception:** static methods in a class (such as the `main` method) can only\
    \ use static variables in that class.\n\n#### 3.2.11.2 Variables Declared in Methods\n\
    \nA `block` or `compound statement` is a group of declarations and/or statements\
    \ enclosed in braces, {}.\n\nA `method` consists of a `header` and a `body`; the\
    \ body is a `block`.\n\n```java\npublic double average(double x, double y) {\n\
    \    double sum = x + y;\n    return sum / 2;\n}\n```\n\nThe parameters (in this\
    \ example, `x` and `y`) can be used everywhere in the method, but are not available\
    \ outside the method. Variables declared within the body (`sum` in this example)\
    \ follow the scope rules for blocks (see the next section).\n\nThe parameters\
    \ and the variables declared within the body are `local variables`; they are created\
    \ when the method is invoked (used), and discarded when the method returns. Local\
    \ variables do not retain their values from one invocation (call) of the method\
    \ to the next; each invocation starts all over again.\n\n#### 3.2.11.3 Variables\
    \ Declared in Blocks\n\nA variable declared within a block is accessible (can\
    \ be used) from the point of declaration to the end of the block. For example:\n\
    \n```java\n{\n    x = 1; // illegal!\n    int x; // scope of \"x\" starts here\n\
    \    x = 2; // legal\n} // scope of \"x\" ends here\nx = 3; // illegal!\n```\n\
    \nVariable declarations are usually put first in a block.\n\n### 3.3 Statement\
    \ Types\n\nJava and C++ both borrowed heavily from C, and many of the statement\
    \ types are identical. One significant difference is that, in Java, the `condition`\
    \ of an `if`, `while`, or `for` statement *must* be an expression that results\
    \ in boolean value, not other type.\n\nThe following statements are not in C++,\
    \ or differ significantly from C++.\n\n- `variable = expression;`\n- `expression;`\n\
    - `{ statements }`\n- `if (condition) { statements }`\n- `if (condition) { statements\
    \ } else { statements }`\n- `while (condition) { statements }`\n- `for (initialization;\
    \ condition; update) { statements }`\n- `for (variable: collection) { statements\
    \ }`\n- `do { statements } while (condition)`\n- `switch (expression) { case value1:\
    \ statements1 case value2: statements2 … default: statementsdef }`\n- `label:\
    \ statement;`\n- `break;`\n- `break label;`\n- `continue;`\n- `continue label;`\n\
    - `return value;`\n- `return;`\n- `;` // empty statement\n\nJava is usually formatted\
    \ to put the opening brace of a control statement on the same line as the control\
    \ statement, and the closing brace aligned with the control. Java programmers\
    \ are encouraged to use braces even when the block consists of a single statement.\n\
    \n- `try { statements } catch (ExceptionType variable) { statements } finally\
    \ { statements }`\n- `throw Exception;`\n\n### 3.3.1 Statements Also in C++\n\n\
    If you are coming from C++ or one of the other C type languages, you probably\
    \ already know everything in this section. It's all the normal loops, conditional\
    \ statements, assignments, blocks, and so forth. Feel free to skip ahead to [section\
    \ 3.3.2], Statements Not In C++.\n\n#### 3.3.1.1 Blocks\n\nA `compound statement`,\
    \ or `block`, is some number (possibly zero) of declarations and statements, enclosed\
    \ in braces, {}.\n"
