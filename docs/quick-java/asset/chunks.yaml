    Ternary expressions can be nested, but parentheses should be used to make the
    nesting easier to read.


    ### 5.2.4.3 Bit and Shift Operators


    Any of the integer types may be treated as a sequence of bits. If `i` and `j`
    are integer values, then the following operations are provided:


    *   `~i` — inverts every bit of `i`, that is, changes every 0 to a 1 and every
    1 to a 0. Numerically, this is the equivalent of `-i - 1`.

    *   `i & j` — “ands” the corresponding bits together. Each resultant bit is 1
    if and only if both bits are 1.

    *   `i | j` — “ors” the corresponding bits together. Each resultant bit is 0 if
    and only if both bits are 0.

    *   `i ^ j` — “exclusive ors” the corresponding bits together. Each resultant
    bit is 1 if and only if the two bits are different.

    *   `i << j` — shifts the bits of `i` to the left `j` places. Numerically, this
    is the equivalent of `i * 2^(j)`.

    *   `i >> j` — shifts the bits of `i` to the right `j` places, with the leftmost
    bit (the sign bit) duplicated. Numerically, this is the equivalent of `i / 2^(j)`.

    *   `i >>> j` — shifts the bits of `i` to the right `j` places, with zeros coming
    to the left.


    The shorter integer types are converted to 32-bit integers before the above operations
    are performed, so the result is always an `int` value.


    ### 5.2.4.4 Increment and Decrement Operators


    The increment operator, `++`, adds one to a variable. It can be used as either
    a prefix operator or a postfix operator, that is, either as `++x` or as `x++`.


    The decrement operator, `--`, subtracts one from a variable, and can also be used
    as a prefix or postfix operator.


    Used as a standalone statement, or as the increment (or decrement) part of a `for`
    loop, the prefix and postfix versions do the same thing. They behave differently
    when used as part of an expression.


    The prefix versions add or subtract one to the variable *before* using it in an
    expression. The postfix versions add or subtract one to the variable *after* using
    it in an expression. This can get very confusing; the statement


    ```

    x = x++;

    ```


    leaves `x` unchanged. Don’t use these operators in an expression without good
    reason.


    ## 5.3 The Outer Language


    In the earliest versions of Java, there was just one kind of class, the “top level”
    class that we have been discussing up to now. Modern Java has additional class
    types: enums, records, final classes, sealed classes, abstract classes, and four
    different kinds of inner classes. In addition, `modules` give an even higher level
    of organization to classes than just packages.


    ### 5.3.1 Generic Classes


    A `generic` or `parameterized class` is one which takes one or more `type parameters`
    enclosed in angle brackets, `< >`. Within the class, a `type variable` may be
    used almost anywhere a type name would otherwise be used.


    In [section 3.4.1.5](#ch03.xhtml_sec3_004_001_005) we discussed the use of a generic
    class, the `Stack`. Generic classes were introduced in Java 5, and a number of
    pre-existing classes (`Stack`, `ArrayList`, `HashMap`, etc.) were parameterized.
    For backward compatibility, you can create and use objects of a parameterized
    class without type parameters, but the compiler will produce warning messages.


    To define your own generic class, use the syntax:


    ```

    class ClassName<TypeVariable, … , TypeVariable> { … }

    ```


    A `type variable` is like an ordinary variable, except that it holds a `type`
    rather than a value. Type variables are usually written as single capital letters.
    Within the class definition, the type variables can be used in almost any place
    where ordinary type names can be used.


    Here''s an example of a genericized class:


    ```

    import java.util.*;

    ```


    ```

    public class Box<T> {

    ```


    ```

    private List<T> contents;

    ```


    ```

    public Box() {

    ```


    ```

    contents = new ArrayList<T>();

    ```


    ```

    }

    ```


    ```

    public void add(T thing) {

    ```


    ```

    contents.add(thing);

    ```


    ```

    }

    ```


    ```

    public T grab() {

    ```


    ```

    if (contents.size() > 0) {

    ```


    ```

    return contents.remove(0);

    ```


    ```

    }

    ```


    ```

    else return null;

    ```


    ```

    }

    ```


    ```

    }

    ```


    Now you can create a `Box` that can hold only a specific type of object, for example,
    a `String`.


    ```

    Box<String> box = new Box<String>();

    ```


    You can use a type variable, such as `T` above, almost anywhere you can use the
    name of a type. But there are a few exceptions:


    *   You cannot declare static variables of a type variable: `static T thing;`

    *   You cannot return a type variable from a static method: `static T getValue()
    { return someT;}`

    *   You can declare, but not instantiate, an array of a type variable: `T[] values
    = new T[]`

    *   You can declare, but not instantiate, an array of a type variable: `Box<T>
    boxes = new Box<T>[]`

    *   The above code defines a `Box` of `String`. If you need more, you can say
    `<T extends A>`, which bounds the type. It specifies that `T` must be either class
    `A`, or a subclass of `A`, or implement interface `A`.

    *   Another legal syntax is `<T extends A & B & C>`, where `A` is the name of
    a class, and `B` and `C` are names of interfaces.


    Generics do not exist in the compiled code. If you declare and use `Box<String>`
    and another `Box<Double>`, these will be separate.


    ### 5.3.2 Interfaces


    An `interface` is a list of `abstract methods`—methods that have a header, but
    no body. Any class that implements the interface must supply complete methods,
    with the same header and a body.


    An interface, like a class, defines the name of a type. Variables of that type
    can hold any object of a class that implements that type. For example,


    ```

    List<String> names = new ArrayList<String>();

    ```


    In this example, `List` is an interface, so you cannot create objects of `List`;
    but `ArrayList` is a class that implements `List`, so you can create objects of
    this type. Now you can use the methods specified in the `List` interface (`add`,
    `remove`, `contains`, etc.) with `names`. If you later decide `names` should be
    a `Stack` (a class that implements `List`), you can change the declaration to


    ```

    List<String> names = new Stack<String>();

    ```


    and no other changes in the code are required (except possibly for what you need
    to import).


    > Note: Interfaces may also contain non-abstract static and default methods. Default
    methods can be used as is, or can be overridden in an implementing class. These
    features are not covered in this book.


    In [section 5.3.1](#ch05.xhtml_sec5_003_001) we defined a `Box` class with `add`
    and `grab` methods. We might later decide to write an unrelated `Shelf` class
    that also has these two methods, and then a `Cabinet` class, also with `add` and
    `grab` methods. Each of these classes might store its contents in a completely
    different way, possibly in a list or a two-dimensional array. The classes may
    also have different data and additional, unique methods.


    We can write a generic interface, which we’ll call `Storage`, to specify the methods
    these classes must provide.


    ```

    interface Storage<T> {

    ```


    ```

    public void add(T thing); // no body

    ```


    ```

    public T grab(); // no body

    ```


    ```

    }

    ```


    Now each of these classes can implement the new interface, with its own versions
    of the `add` and `grab` methods.

