    ### 5.3.9 Modules


    A `package` is a collection of related classes. A very large program, however,
    may consist of hundreds of packages. To make a class in one package available
    to a class in another package, it had to be made public, which makes it available
    everywhere. This isn’t generally desirable.


    Java 9 introduced `modules`, which provide additional restrictions on visibility.
    A module is a directory containing any number of packages, along with a top-level
    file named `module-info.java`. This file contains the text:


    ```

    module moduleName {

    ```


    ```

    directives

    ```


    ```

    }

    ```


    where the `moduleName` must be unique, may not contain underscores, and usually
    has the same name as the directory it is in.


    When packages are in a module, the keyword `public` makes an element available
    to other packages in the same module, not everywhere.


    To use a package in one module from a package in a different module, the first
    module must `export` the package, and the second must `require` the package. For
    example, a directory named `giveModule` may contain packages `src/com/xyz/giver`
    and `src/com/xyz/secret`, along with this `module-info.java` file:


    ```

    module giveModule {

    ```


    ```

    exports com.xyz.giver;

    ```


    ```

    exports com.xyz.secret to takeModule;

    ```


    ```

    }

    ```


    This specifies that the giver package can be used by anyone that requires it,
    while only the `takeModule` module can require the package `secret`.


    > Note: Windows uses backslashes rather than forward slashes to indicate directory
    structure, while Java uses dots.


    In this example, the directory containing the taker package also contains this
    `module-info.java` file:


    ```

    module takeModule {

    ```


    ```

    requires transitive giveModule;

    ```


    ```

    }

    ```


    The optional word `transitive` implies that any module which requires `takeModule`
    will also have access to `giveModule`.


    Modules may not have circular dependencies. If module `A` requires module `B`,
    module `B` cannot require module `A`.


    All the Java-supplied packages have been organized into about 100 modules, and
    every module declaration automatically requires `java.base`. The `java.base` module
    consists of 32 packages, including `java.lang`, `java.util`, `java.io`, and `java.math`.


    ### 5.3.10 Build Tools


    Java programs must be `compiled` (turned into `byte code`) before they can be
    executed. The `javac` command will compile a single file (which must have the
    `.java` extension) into a file of byte code with the `.class` extension.


    However, all but the simplest programs consist of multiple classes, each on a
    separate `.java` file. A file cannot be compiled successfully until all of the
    classes it depends on have been compiled. Moreover, compilation can be time-consuming,
    so we don’t want to compile everything each time one little change is made. But
    if one Java file is changed and re-compiled, files that depend on it must also
    be re-compiled. Re-compiling these files may lead to re-compiling still more files.


    A `build tool` takes as input a list of file dependencies, and compiles or re-compiles
    only those files that need it. `Ant`, `Maven`, and `Gradle` are popular build
    tools. If you are using an IDE, one or both of these tools will be built-in for
    you, and you can let the IDE do the work.


    # Chapter 6 Functional Programming


    DOI: [10.1201/9781003402947-6](https://doi.org/10.1201/9781003402947-6)


    The basic idea of `functional programming` is that functions are values, and can
    be treated as such. Functions can be stored in variables, passed as arguments
    to methods, returned as the result of a method, combined to form new functions,
    and applied in part or in full to arguments. Along with this is the idea that
    data is `immutable`; functions applied to data produce new data rather than changing
    existing data.


    There are three factors that add to the complexity of functional programming in
    Java. First, Java is designed around methods, which are associated with classes;
    functions are a recent inclusion. Second, primitives are treated differently from
    objects, which leads to a combinatorial explosion of methods. Third, Java''s data
    structures are all mutable, which is inconsistent with the general practice of
    functional programming.


    ## 6.1 Function Literals


    Starting in Java 8, you can define a `lambda expression` (also called `function
    literal`) as follows:


    ```

    (parameters) -> expression

    ```


    or


    ```

    (parameters) -> statement

    ```


    *   Each of the `parameters` consists of a type (int, etc.) and a name, although
    in many cases the type declaration may be omitted or replaced with `var`, and
    Java will figure out the correct type.

    *   If there is only one parameter, and the type is not specified, the parentheses
    may be omitted.

    *   If there are no parameters, empty parentheses, `()`, are required.

    *   The `statement` may be a compound statement (enclosed in braces) and may contain
    return statements.

    *   Functions cannot be defined at the top level; they can only be defined within
    methods (or another function).


    The `method reference operator`, `::`, is a way of “wrapping” a method inside
    a functional interface, so that it can be used as if it were a function.


    Essentially, `x :: m` is an abbreviation of `x -> x.m(...)`, where `m` has an
    unspecified number of parameters. If there is more than one method named `m`,
    method resolution is performed in the usual way, by the types and number of parameters.


    ## 6.2 Functional Interfaces


    A `functional interface` is any interface that declares exactly one abstract method,
    called its `SAM` (Single Abstract Method). For example, the `Comparable` interface
    declares the `compareTo(T)` single abstract method, the `Runnable` interface declares
    `run()`, and the `ActionListener` interface declares `actionPerformed(event)`.


    The most common use of function literals is to pass them into methods as arguments.
    However, a method must specify the type of each of its parameters. In the case
    of a function literal, the type will always be the name of some kind of functional
    interface, but that name isn’t obvious. Java provides 43 types of functional interfaces,
    each with an associated SAM.


    For example, suppose the lambda expression is `x -> x * x`, and `x` is an integer.
    Then the type of this lambda expression is `IntUnaryOperator`, and the associated
    SAM is `applyAsInt(int)`. As a trivial example, we can define this method:


    ```

    void run(IntUnaryOperator fun, int n) {

    ```


    ```

    System.out.println(fun.applyAsInt(n));

    ```


    ```

    }

    ```


    When we call this method with `run(x -> x * x, 12)`, it will print 144.

