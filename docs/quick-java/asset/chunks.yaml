    # Chapter 9 How to Build a GUI Program


    DOI: [10.1201/9781003402947-9](https://doi.org/10.1201/9781003402947-9)


    Here is the general formula for building a GUI program:


    1. Import the necessary packages.

    2. Create a window in which to display things—usually a `JFrame`. Optionally create
    some `JPanels` to put in the `JFrame`.

    3. Use the `setLayout(manager)` method to choose a `layout manager` for each `JFrame`
    and `JPanel`. The layout manager is in charge of putting things in the correct
    places in the window or panel.

    4. Create some `Components`, such as buttons, panels, etc.

    5. Ask the layout manager to place the components.

    6. Write some `Listeners` and attach them to your components. When a user interacts
    with a component, one or more `Events` will occur, and your `Listener` can execute
    some code to handle the event.

    7. Display the window.


    ## 9.1 Event-Driven Programs


    A program without a GUI is in complete control, from beginning to end. It may
    use some dialogs to interact with the user, but the program is always in control.


    A GUI program is different—it is `event-driven`. The program does some initialization,
    creates the GUI, then waits for something to happen—a mouse click, a key press,
    a timer signal, the completion of a file transfer, and so on. Each time one of
    these things occurs, an `event` is created. There may be dozens or even hundreds
    of events each second, most of which are ignored. The program defines a `listener`
    for each event it cares about, does something in response to that event, then
    goes back to “listening” for the next event of interest.


    ## 9.2 The Event Dispatch Thread


    Java programs run in multiple `threads`, (code executing concurrently) and Swing
    is not `thread safe`—it does not prevent simultaneous access to data, which can
    result in data corruption. Running a Swing program directly from the main thread
    can result in rare but unpredictable errors. Unless you are doing parallel programming,
    all you really need to know is how to run Swing from a special `event dispatch
    thread`. Here''s how:


    ```

    import javax.swing.SwingUtilities;

    ```


    ```

    import javax.swing.JFrame;

    ```


    ```

    public class MyGUI extends JFrame implements Runnable {

    ```


    ```

    public static void main(String[] args) {

    ```


    ```

    SwingUtilities.invokeLater(new MyGUI());

    ```


    ```

    }

    ```


    ```

    public void run() {

    ```


    ```

    // add components to this JFrame

    ```


    ```

    pack();

    ```


    ```

    setVisible(true);

    ```


    ```

    }

    ```


    ```

    }

    ```


    The name `MyGUI` can be changed, but `run` is a method required by the `Runnable`
    interface.


    ## 9.3 Import the Necessary Packages


    The Swing components are in `javax.swing.*`, so you always need to import that
    for a Swing application.


    Swing is built on top of AWT and uses a number of AWT packages, including most
    of the layout managers, so you need to import `java.awt.*`.


    Most listeners also come from the AWT, so you also need to import `java.awt.event.*`.


    A few listeners, such as `DocumentListener` and `ListSelectionListener`, are specific
    to Swing, so if you use them you need to import `javax.swing.event.*`.


    For more complex GUIs, there are additional `java.awt.something` and `javax.swing.something`
    packages that you may need to import.


    > **Note:** The `x` in `javax` originally stood for “experimental,” but once Swing
    came into widespread use, it was undesirable to rename the package.


    ## 9.4 Make a Container


    A `container` is a graphical area that can hold visible components. A `component`
    is something that can be added to a container.


    Two important subclasses of `Container` are `JFrame` and `JPanel`.


    For an application, the main (outermost) container is typically a `JFrame`:


    ```

    JFrame frame = new JFrame(); // or

    ```


    ```

    JFrame frame = new JFrame("Text for title bar");

    ```


    You can create a `JFrame` in the class that contains the `public static void main`
    method, but it''s often more convenient to have this class extend `JFrame`.


    A `JPanel` is both a container (it can have components added to it) and a component
    (it can be added to containers). Each `JPanel` has its own layout manager. All
    but the simplest windows consist of a `JFrame` containing several `JPanels`, with
    each `JPanel` containing one or more `widgets` (visible GUI components).


    To create a `JPanel`:


    ```

    JPanel panel = new JPanel(); // default: flow layout

    ```


    ```

    JPanel panel = new JPanel(layoutManager);

    ```


    ## 9.5 Add a Layout Manager


    Every container (`JFrame` or `JPanel`) has a layout manager associated with it.
    You can use the default layout manager or specify a different one. Here are the
    layout managers we will cover in some detail:


    * `BorderLayout` (see [Figure 9.1](#ch09.xhtml_fig9_1)) — This is the default
    layout manager for a `JFrame`. It provides five areas into which you can put up
    to five components; any area without a component simply disappears.

    * `FlowLayout` (see [Figure 9.2](#ch09.xhtml_fig9_2)) — This is the default layout
    manager for a `JPanel`. It just adds components from left to right, top to bottom.

    * `GridLayout` (see [Figure 9.3](#ch09.xhtml_fig9_3)) — This puts components into
    a rectangular grid, with all areas being the same size and shape.


    Since there are only a few more kinds of layout managers, they are listed here:


    * `BoxLayout` — Puts components in a single row or column.

    * `CardLayout` — Uses JComboBox to choose which JPanel to display.

    * `GridBagLayout` — Allows precise control of layout, but is very difficult to
    use.

    * `GroupLayout` — Works with horizontal and vertical layouts separately.

    * `SpringLayout` — Allows precise control of relationships between components.


    To use a layout manager other than the default, call `container.setLayout(layoutManager)`.
    For example:


    ```

    myPanel.setLayout(new GridLayout(rows,columns));

    ```


    Once the layout manager has been determined, components can be added. The method
    to use depends on the type of.


    * For a flow layout, use `container.add(component);`

    * For a grid layout, use either `container.add(component);` or `container.add(component,index);`
    where the `index` is a single integer starting at 0.

    * For a border layout, use `container.add(component, BorderLayout.area);` where
    the `area` is one of NORTH, SOUTH, EAST, WEST, and CENTER. The border areas take
    up only as much space as necessary to lay out their components, and the center
    gets all the remaining space.


    A `JTabbedPane` (see [section 9.8.4](#ch09.xhtml_sec9_008_004)) is not a layout
    manager but is a good alternative to CardLayout.


    ## 9.6 Create Components


    A `widget` is a GUI control, such as a button or text area, intended for the user
    to interact with. Widgets are components; they can be added to a container such
    as a `JPanel` or `JFrame`.


    [Figure 9.4](#ch09.xhtml_fig9_4) shows some of the more commonly used widgets.


    An `active` widget is one that causes the program to do something whenever it
    is used. Buttons and most menu items are active: Clicking on an active widget
    has an immediate effect.


    A `passive` widget is one that accepts information but doesn’t immediately do
    something with it; it just holds on to the information until the program asks
    for it. Text fields, text areas, check boxes, and radio buttons are almost always
    passive. Some widgets, like combo boxes, can be either active or passive.


    A widget is made active by attaching a listener to it.

