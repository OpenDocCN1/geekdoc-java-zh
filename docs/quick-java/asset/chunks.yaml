    ```


    To add the JEditorPane editor to the content JPanel:


    ```

    content.setLayout(new BorderLayout());

    ```


    ```

    content.add(scroller, BorderLayout.CENTER);

    ```


    By putting the JScrollPane in the CENTER of the JFrame, and not putting anything
    around the edges, the JScrollPane will fill up the entire JFrame.


    To set and get the text of a JEditorPane:


    ```

    editor.setText("This is <i>Sample</i> text");

    ```


    ```

    String myText = editor.getText();

    ```


    ### 9.8.3 JScrollPane


    A ***scroll pane*** can be used to hold any large component that you might want
    to scroll (in this example, a previously defined JEditorPane named editor).


