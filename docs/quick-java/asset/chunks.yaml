    ### 4.1.8 References


    In order to work with objects, it is critical to understand the concept of ***references***.


    Each variable in a program has a fixed, limited amount of memory in which to store
    its data. An int gets 4 bytes (32 bits), and a double gets 8 bytes (64 bits).
    The same holds true for objects: A variable of an object type (String, array,
    Customer, etc.) gets only 4 bytes. This obviously isn’t enough for most objects.


    Instead, each object is stored in a particular area of memory called the ***heap*,**
    where it can occupy as many bytes as it needs. What is actually stored in the
    variable is a ***reference*** to that location in the heap, typically implemented
    as a memory address.


    > **Note:** A reference is similar to a ***pointer*** in other languages. The
    main difference is that arithmetic cannot be done on references.


    When a primitive value is copied from one variable into another, it is duplicated.
    Each variable has its own copy of the value (see [Figure 4.1](#ch04.xhtml_fig4_1)).


    ![Figure represents an assignment of a primitive copies the value](images/fig4_1.jpg)


    [Figure 4.1 Assignment of a primitive.](#ch04.xhtml_Ffig4_1)


    After the assignment b = a, the variable b has a *copy* of the value from a, and
    either variable can be modified independently.


    When an object is copied from one variable into another, it is again a simple
    value that is copied; but that value is a *reference* to an object, not the object
    itself (see [Figure 4.2](#ch04.xhtml_fig4_2)).


    ![Figure represents an assignment of an object copies the reference](images/fig4_2.jpg)


    [Figure 4.2 Assignment of an object.](#ch04.xhtml_Ffig4_2)


    After the assignment obj2 = obj1, both variables refer to the *same* object. Either
    reference can be used to “talk to” and change the object, and the data in the
    object will be the same regardless of which reference is used to view it.


    The same thing happens when a method is called. If a primitive value is given
    as an argument, the method gets a *copy* of that value, but if an object is given
    as an argument, the method gets a copy of that *reference*.


    It is seldom necessary to make a copy of an object, and there is no built-in,
    easy way to do it. If a copy must be made, probably the best way is to add a ***copy
    constructor*** in the class definition. A copy constructor is a constructor that
    takes an object of the same type as its parameter, and copies all the data values
    from it into the new object. This must be done carefully, because some of the
    fields of the copied object may be themselves references to other objects.


    ### 4.1.9 Constructors II


    When an object is constructed, it is actually constructed in layers, with Object
    being the foundation layer for every object.


    If you have a Customer class, and this class extends Person, and Person extends
    Object, then when you create a new Customer object, here''s what happens:


    *   The constructor for Customer calls the constructor for Person.'
