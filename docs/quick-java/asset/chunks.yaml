    ## 5. `+` 正数前面带有一个加号\n## 6. `,` 数字包含分组分隔符\n## 7. `(` 负数被包含在括号中\n\n以及一些可能的转换格式（必须存在其中之一）：\n\
    \n1. `%b` 布尔值\n2. `%c` 字符\n3. `%d` 整数\n4. `%e` 科学计数法\n5. `%f` 浮点数\n6. `%s` 字符串\n\
    7. `%tc` 完整的日期和时间\n8. `%n` 此平台上的换行符\n9. `%%` 字符 %\n\n`Formatter` 类的功能远不止于此。特别是为日期和时间指定了超过\
    \ 30 种转换格式。\n\n### 5.2.2.11 正则表达式\n\n`regular expression` 了一种描述字符串字符串的模式。例如，正则表达式\
    \ `c[aou]t` 描述“cat”、“cot”和“cut”三个单词。正则表达式可以用于测试、搜索和处理字符串。\n\n正则表达式是高度标准化的，并适用于许多编程语言。如果你熟悉正则表达式，本节将告诉你如何在\
    \ Java 中使用它们；但如果不熟悉，你仍然对不包含标点符号的字符串使用以下方法。\n\nJava 有一个 `java.util.regex.Pattern`\
    \ 类，但 `String` 类中的几个方法可以接收一个格式正确的字符串（在下文中写为 `regex`），并将其视为正则表达式。这些方法是：\n\n* `string.matches(regex)`—测试此\
    \ `string` 是否匹配 `regex` 模式。\n* `string.replaceFirst(regex, replacement)`—返回一个字符串，其中第一个匹配\
    \ `regex` 的子字符串被 `replacement` 替换。\n* `string.replaceAll(regex, replacement)`—返回一个字符串，其中每个匹配\
    \ `regex` 的子字符串都被 `replacement` 替换。\n* `string.split(regex)`—由 `regex` 匹配的字符串作为分隔符；由此分割的子字符串以数组形式返回。\n\
    * `string.split(regex, limit)`—返回一个包含不超过 `limit` 个匹配子字符串的数组。\n\n你可以在不了解正则表达式语法的情况下使用这些方法。你只需要记住，许多标点符号在正则表达式中具有特殊含义，但字母、数字和空格没有。因此，任何仅由字母、数字和空格组成的\
    \ `regex` 都代表其本身。\n\n遗憾的是，Java 字符串使用反斜杠来转义某些字符，例如用于换行的 `\\n`，而正则表达式使用反斜杠用于某些 `character\
    \ classes`，例如用于数字的 `\\d`。这使得在 Java 中编写正则表达式有些困难。\n\n要在 Java 字符串中插入反斜杠，你需要将其双倍：`\\\
    \\`。因此，要在 Java 字符串中插入两个字符 `\\d`，你必须输入三个字符 `\\\\d`。其他字符类也可以类似地处理。\n\n### 5.2.3\
    \ 集合\n\nJava 提供了大量的 `collection types`，包括 `sets`、`lists`、`maps`、`stacks`、`queues`\
    \ 和 `deques`。这些类型都实现了 `java.util.Collection` 接口。对于学习使用这些类型非常有帮助，因为这意味着它们具有许多相同的方法。\n\
    \n> **注意：** 虽然数组无疑是集合，但它们早于 `Collection` 接口，并且没有实现它。\n\n只有对象而不是“基本数据类型”（数字、字符和布尔值）可以放入集合中。\n\
    \n使用这些集合比看起来要复杂一些。许多 `Collection` 类型（包括 `Set`、`List`、`Map`、`Queue` 和 `Deque`）本身是接口而不是类。这意味着你可以声明该类型的变量，但不能创建它；你只能创建实现类的对象。因此，你经常会看到这样的代码：\n\
    \n```\nSet<Item> items = new HashSet<>();\n```\n\n上述代码声明 `items` 为一个 `Set`，具有所有的\
    \ `Set` 操作，但不包含任何 `HashSet` 特有的操作。如果在稍后的某个点需要另一种实现（例如 `TreeSet`），则可以更改实现，而不会对使用\
    \ `items` 变量的代码产生任何影响。\n\n`Stack`、`Vector` 和 `PriorityQueue` 也实现了 `Collection`\
    \ 接口，但它们是类，因此可以直接创建这些类型的对象。\n\n这里是某些 `Collection` 类型的简要摘要，以及典型的实现类：\n\n* `Set`,\
    \ `HashSet` — 一个没有重复且没有特定顺序的值集合。\n* `List`, `ArrayList` — 有序的值序列，可能包含重复。\n* `Map`,\
    \ `HashMap` — 键到值的映射。\n* `Stack` — 后进先出的数据结构。\n* `Queue`, `LinkedList` — 先进先出的数据结构。\n\
    * `PriorityQueue` — “最小”（优先级最高）的值先输出。\n* `Deque`, `ArrayDeque` — 可以在两端插入和删除值。\n\
    * `Vector` — 可调整大小的、基于数组的值序列。\n\n以下是 `Collection` 接口中列出的一些方法，因此适用于上述类型的所有对象：`add(object)`、`addAll(collection)`、`remove(object)`、`removeAll(collection)`、`clear()`、`contains(object)`、`equals(object)`、`size()`\
    \ 和 `toArray()`。\n\n#### 5.2.3.1 迭代器\n\n`iterable object` 是任何可以遍历的对象。所有的集合类型都是可迭代的。这不包括数组。Java\
    \ 有三种迭代器：\n\n* `Enumeration` 已经过时，将在此讨论。请改用 `Iterator`。\n* `Iterator` 是一个可以用于任何集合的接口。它提供了\
    \ `next()`、`hasNext()` 和 `remove()`。\n* `ListIterator` 是用于各种类型列表的接口。它支持正向和反向遍历列表，以及添加、删除或修改。\n\
    \n方法 `c.iterator()` 将返回 `c` 的迭代器。方法 `c.hasNext()` 在 `c` 有剩余元素时返回 `true`，如果是，可以使用\
    \ `c.next()` 返回下一个值。\n\n```\nList list = new LinkedList();\nlist.add(\"one\");\n\
    list.add(\"two\");\nlist.add(\"three\");\nIterator iter = list.iterator();\nwhile\
    \ (iter.hasNext()) {\n    System.out.println(iter.next());\n}\n```\n\n方法 `c.remove()`\
    \ 将从集合中移除 `next()` 返回的上一个元素。并不是所有的类型都允许此操作。\n\n### 5.2.4 其他运算符\n\n除了 `instanceof`\
    \ 运算符外，Java 的运算符都是一个、两个或三个非字母字符。\n\n#### 5.2.4.1 instanceof\n\n`instanceof` 运算符测试给定对象是否可以转换为给定类型，但实际执行转换的由程序员完成：\n\
    \n```\nif (obj instanceof String) {\n    String s = (String)obj;\n    // ... 使用\
    \ s\n}\n```\n\n从 Java 14 开始，这些现在可以组合使用：\n\n```\nif (obj instanceof String s) {\n\
    \    // ... 使用 s\n}\n```\n\n#### 5.2.4.2 三元运算符\n\nJava 有一个 `ternary operator`，它类似于表达式的\
    \ if-then-else 而不是语句。也就是说，它可以作为表达式或作为表达式的一部分。\n\n语法为：\n\n```\nbooleanExpression\
    \ ? valueIfTrue: valueIfFalse\n```\n\n例如：\n\n```\nlarger = a > b ? a: b;\n```\n\
    \n甚至\n\n```\nString s = \"n is \" + (n % 2 == 0 ? \"even\": \"odd\");\n```\n\n\
    `valueIfTrue` 和 `valueIfFalse` 不需要是相同类型，但其中一种类型在上下文中必须是合法的。\n\n"
