  trans: "\n\n### 3.2.1 原始类型\n\n这里有四个最重要且最常用的原始类型：\n\n* `int` 是一个整数，或“整数字”。它可以存储足够用于大多数用途的数字（约正负二十亿）。为了让非常大的数字更具可读性，你可以在数字之间加上下划线。\n\
    * `double` 是一个 64 位的“实数”（浮点数）。它可以存储非常大或非常小的数字，精度约为 17 位数字。它可以使用科学计数法书写，其中用 `e`\
    \ 或 `E` 表示指数：$6.0221409 \\times 10^{(23)}$ 可以写成 `6.0221409e+23`。与整数一样，你也可以在数字之间加上下划线。\n\
    * `char` 是单个字符。常用字符可以直接通过包含在单引号中来表示，例如 `'a'`。某些字符需要用转义序列表示，例如用于换行的 `'\\n'`。\n\
    * `boolean` 是一个单一的真或假值。\n\n另外四种原始类型（`long`、`short`、`byte` 和 `float`）在大多数程序中并不使用，将在第\
    \ 5.2.2.6 节中讨论。\n\n### 3.2.2 数组\n\n`array` 是相同类型的有序值序列。要访问数组中的单个值，使用语法 `arrayName[index]`。合法的索引范围从\
    \ 0（数组中的第一个值）到 `arrayName.length - 1`（最后一个值）。\n\n`declaring` 数组最简单的语法有两种：\n\n\
    ```java\nbaseType[] arrayName;\n```\n\n或者：\n\n```java\nbaseType arrayName[];\n\
    ```\n\n例如，\n\n```java\nint[] scores;\n```\n\n这声明了但没有定义 `scores` 变量。也就是说，它的类型已经被分配，但没有给它分配该类型的值。已声明但未定义的数组变量将具有特殊值\
    \ `null`，尝试使用它将导致错误。\n\n要同时声明并定义 `scores`，你可以说：\n\n```java\nint[] scores = new\
    \ int[35];\n```\n\n一旦定义了数组，你就不能更改它的大小。然而，数组的大小不是其类型的一部分，因此任何大小的 `int` 数组都可以赋值给\
    \ `scores`。稍后，你可能会将不同大小的不同数组赋值给 `scores`。你可以通过查询它的长度变量 `array.length` 来获取数组的大小。\n\
    \n按照上述方式创建的数组，其元素将分别设置为 0、`false` 或 `null`（对应数值数组、布尔数组或对象数组）。另一种方法是使用语法 `new type[]\
    \ {value, ...}` 创建一个具有特定值的数组，例如：\n\n```java\nint[] ary = new int[] {3, 1, 4, 1,\
    \ 6};\n```\n\n或者使用稍简单的：\n\n```java\nint[] ary2 = {3, 1, 4, 1, 6};\n```\n\n数组中的值本身也可以是数组。这有一种特殊的语法，如下例所示：\n\
    \n```java\ndouble elevation[][]; // declaration\n```\n\n```java\nelevation = new\
    \ double[50][75]; // definition\n```\n\n```java\nelevation[49][74] = 123.45;\n\
    ```\n\n`elevation` 数组可以被称为`二维数组`，但更准确的说法是一个其元素恰好是数组的一维数组。数组可以有三维、四维甚至更多维度。\n\n\
    多维数组中的第一个索引通常称为 `row`（行）数，第二个索引称为 `column`（列）数。上面的数组有 50 行（索引从 0 到 49）和 75 列（索引从\
    \ 0 到 74）。\n\n数组中的值必须都是相同类型，但数组的大小不是该类型的一部分。以下代码构造了一个“三角形”数组数组，其中每个子数组都比前一个数组大：\n\
    \n```java\nint[] triangle = new int[10];\n\nfor (int i = 0; i < triangle.length;\
    \ i++) {\n    triangle[i] = new int[i + 1];\n}\n```\n\n### 3.2.3 字符串\n\n`string\
    \ literal` 是包含在引号（双引号）中的零个或多个字符的序列。例如：\n\n```java\n\"\" // 一个空字符串\n\"hello\" //\
    \ 一个包含五个字符的字符串\n```\n\n某些字符无法直接输入字符或字符串常量中；例如字符串内部的双引号。这些字符可以通过通过 `escaping` 它们（在它们前面加一个反斜杠）来包含：\n\
    \n```java\n\"He said, \\\"Don't go.\\\"\"\n```\n\n重要的 `escape sequences` 有：\n\n\
    * `\\n` 是“换行”字符，无论它在你的计算机系统上如何编码（在 Windows 上与 Unix 和 Macintosh 上不同）。\n* `\\t`\
    \ 是制表符，表示任意数量的空白区域。\n* `\\\"` 是双引号字符（在双引号字符串内部很有用）。\n* `\\'` 是单引号字符。\n* `\\\\\
    ` 是反斜杠字符。\n* `\\uxxxx` 是写为恰好四个十六进制数字的 Unicode 字符。\n\n此外，还有很少使用的 `\\b`（退格）、`\\\
    r`（回车）和 `\\f`（换页）。\n\n### 3.2.4 异常\n\n检出异常（checked exception）是程序要求处理的异常。例如，如果你尝试读取文件，Java\
    \ 知道可能会发生很多问题，并要求你使用 `try-catch-finally`。基本上，这条语句的意思是：“我会尝试这样做，但如果失败了我会捕获异常。”\n\
    \n未检出异常（unchecked exception）是可能会发生但你不被要求去检查的异常。这些异常总是源于程序中的错误，例如超出数组边界或尝试使用 `null`\
    \ 对象。解决方案是调试程序。\n\n### 3.2.5 运算符与优先级\n\nJava 具有通常的算术运算符以及通常的`优先级`先乘除后加减）。优先级最高的运算符先执行，除了少数例外，大多数运算符是`左结合`的——也就是说具有相等优先级的运算符从左到右执行。例如，`12\
    \ - 2 - 3 * 4 == 10 - 12 == -2`。\n\n常见的运算符从高优先级到低优先级：\n\n* 方法调用和数组索引\n* 算术运算：\n\
    \    1. 一元 `+` 和一元 `-`\n    2. `*`（乘法）、`/`（除法）和 `%`（余数或取模）\n    3. `+`（加法）和 `-`（减法）\n\
    * 布尔（逻辑）运算符：\n    1. `!`（非）\n    2. `&&`（与）\n    3. `||`（或）\n* 不等测试：\n    1. `<\
    \ <= >= >`（小于、小于等于、大于等于、大于）\n* 等于测试：\n    1. `==`（等于）和 `!=`（不等于）\n* 赋值运算符：\n \
    \   1. `=`（简单赋值）\n    2. `+=`、`-=`、`*=`、`/=` 和 `%=`（`x op= y` 简自 `x = x op y`）。\n\
    \n"
- fmt: "\nThe unary and assignment operators are `right associative`—operators of\
    \ equal precedence are done right-to-left. For example, `a = b += c` means `a\
    \ = (b += c)`.\n\nAs usual, parentheses can be used to explicitly specify an order\
    \ of operations. There are a number of other operators in Java, but since very\
    \ few programmers know the complete precedence table, it is better to use parentheses\
    \ to make the order of operations clear.\n\nLess important operators (`++`, `--`,\
    \ `?::`, and the shift and bit manipulation operators) will be discussed later—see\
    \ [sections 5.2.4.4](#ch05.xhtml_sec5_002_004_004) (`++` and `--`), [5.2.4.2](#ch05.xhtml_sec5_002_004_002)\
    \ (`?:`), and [5.2.4.3](#ch05.xhtml_sec5_002_004_003) (bit and shift), respectively.\n\
    \nWhen arithmetic is done using only integral types (including `char`), the result\
    \ is an `int`. Arithmetic using a `double` with any numeric type results in a\
    \ `double`.\n\nThe boolean operations `&&` and `||` are `short-circuit operations`:\
    \ If the result is known after evaluating the left operand, the right operand\
    \ is not evaluated. Thus, in the expression `f(x) && g(x)`, if `f(x)` is false\
    \ then the result has to be false, so `g(x)` is not evaluated. Similarly, in the\
    \ expression `f(x) || g(x)`, if `f(x)` is true then the result has to be true,\
    \ so `g(x)` is not evaluated.\n\n### 3.2.6 Declarations and Casting\n\nEvery variable\
    \ must be declared, along with its type and an optional initial value. For example:\n\
    \n* `int count = 0, size;` \n* `double min, max, average;`\n* `char c;`\n\nJava\
    \ will complain if it thinks you might be using a variable before it has been\
    \ given a value. If Java doesn’t catch this mistake, the value used will be zero\
    \ for numeric types or false for booleans.\n\nA `char` variable can hold any of\
    \ about 65000 UTF-16 characters (see [section 5.2.2.4](#ch05.xhtml_sec5_002_002_004)).\
    \ Characters are stored internally as numbers, and can be used in arithmetic as\
    \ if they were integers. You can write a UTF-16 character in hexadecimal as `'\\\
    uxxxx'`, where `xxxx` is a hexadecimal number in the range `'\\u0000'` to `'\\\
    uffff'`. For example, `'\\u0041'` is 'A', and `'\\u03A3'` is 'Σ'.\n\nAmong the\
    \ above types, a `double` is considered to be `wider` than an `int`, and an `int`\
    \ is wider than a `char`. A value of one type can be assigned to a variable of\
    \ a wider type. That is, a `char` value can be assigned to an `int` variable or\
    \ a `double` variable, and an `int` variable can be assigned to a `double` variable.\
    \ This is called `upcasting`.\n\nTo go in the other direction, that is, to assign\
    \ a wider value to a narrower type of variable, you must `cast` (or `downcast`)\
    \ the value to the desired type. Do this by putting the name of the desired type\
    \ in parentheses immediately before the value. For example:\n\n```java\nint i\
    \ = 0;\n```\n\n```java\ndouble d = 2.71828;\n```\n\n```java\ni = (int)d;\n```\n\
    \n```java\nSystem.out.println(i); // prints 2\n```\n\nIn the above example, the\
    \ fractional part is lost.\n\nA cast affects the one immediately following value:\
    \ `(int)2 * d` casts only the `2` to an `int` (which it already is). To cast an\
    \ expression, put parentheses around it: `(int)(2 * d)`.\n\nAs another example,\
    \ consider:\n\n```java\nchar ch = (char)('a' + 1); // result is 'b'\n```\n\nThe\
    \ cast is necessary because the result type of `'a' + 1` is `int`.\n\nWhen casting\
    \ to a narrower type, it is the programmer's responsibility to ensure that the\
    \ value will fit in that narrower type, or the results will be quite unexpected.\
    \ For example, a `byte` can hold only values between −128 and 127, but the cast\
    \ `(byte)1000` is legal and results in −24.\n\nA `boolean` is *not* a numeric\
    \ type, and cannot be cast to or from any other type.\n\n### 3.2.7 Constants\n\
    \nPutting the word `final` in front of a variable declaration makes it into a\
    \ `constant`; its value cannot be changed. For example:\n\n```java\nfinal int\
    \ DAYS_IN_A_WEEK = 7;\n```\n\nJava provides some built-in constants, such as `Math.PI`\
    \ and `Math.E`.\n\nConstants help avoid the use of “magic numbers”—numbers in\
    \ code whose meaning may not be absolutely clear. If the code adds 29 to a variable,\
    \ the question arises, why 29?\n\nHowever, it is silly to name a constant after\
    \ its value, for example:\n\n```java\nfinal int TWELVE = 12;\n```\n\nbecause this\
    \ does nothing to improve the clarity of the code.\n\n### 3.2.8 Methods\n\nA method\
    \ is like a function, except that it belongs to a class. This gives it special\
    \ access to the variables and other methods of that class. The syntax is:\n\n\
    ```java\n/**\n * documentation comment\n */\naccess returnType methodName(parameterList)\
    \ {\n    statements\n}\n```\n\nA method consists of:\n1. An optional documentation\
    \ comment to tell the user what the method does and how to use it.\n2. An optional\
    \ access specifier.\n3. The return type, or void if the method does not return\
    \ a value.\n4. The method name. Method names should begin with lowercase letter.\n\
    5. A parameter list. If there are no parameters, the parentheses must still be\
    \ present.\n6. The body of the method, consisting of braces {},\n\nHere is an\
    \ example:\n\n```java\n/**\n * A leap year is a year divisible by 4 but not 100,\n\
    \ * unless it is also divisible by 400.\n */\nboolean isLeapYear(int year) {\n\
    \    if (year % 4!= 0) return false;\n    if (year % 100!= 0) return true;\n \
    \   return year % 400 == 0;\n}\n```\n\nIn the body of the method you can have\
    \ declarations of variables, with or without an initial value, for example: `int\
    \ count = 0;`. All such declarations are local to the method, that is, they can\
    \ be seen and used only within the method. Variable declarations are usually put\
    \ first in the method. A method may make use of the values given to its parameters,\
    \ its local variables, and any fields defined by the class. The keyword `this`\
    \ refers to “this” object, the one executing the method. When there is a local\
    \ variable or parameter with the same name as a field, then `name` by itself refers\
    \ to the local variable or parameter, while `this.name` refers to the field.\n\
    \n> Note to Python programmers: The keyword this is like self in Python. The two\
    \ differences are that this is a keyword, not a variable name, and that the word\
    \ this can usually be omitted.\n\nIf the method is declared to return a value\
    \ of a certain type, it must use a return statement with a value of the correct\
    \ type (or a value that can be widened to the correct type). It may not reach\
    \ the end of the method without executing a return statement.\n\nIf a method is\
    \ declared to be void (have no return value), then the method can finish either\
    \ by executing `return;` with no value specified, or by reaching the end of the\
    \ method.\n\n> Note: void is not a value, so `return void;` is not allowed\n\n\
    To make a complete program, there must be at least one “starting” class that contains\
    \ the following special method:\n\n```java\npublic static void main(String[] args)\
    \ { }\n```\n\nThere can be multiple methods with the same name, so long as they\
    \ have different numbers of parameters or different parameter types. Java looks\
    \ at both the name and the parameters (but not the return type) to decide which\
    \ method to use.\n\n### 3.2.9 Methods Calling Methods\n"
