    # 作者


    致我所有过去、现在和未来的学生们：我是 David Matuszek，大多数学生称我为“Dave 博士”。我在 1963 年第一次打孔卡上写了我的第一个程序，并立刻迷上了其中。1970
    年，我作为德克萨斯大学的研究生教了我的第一门计算机课。我最终在那里获得了博士学位，并从那时起一直从事教学。诚然，我在工业界度过了十多年，但即便如此，我仍曾在诺瓦纳大学担任兼职教师。我最终离开了工业界，在诺瓦纳大学全职任教了几年，然后搬到了宾夕法尼亚大学，在那里我指导了一个面向从其他学科进入计算机科学专业的计算机与信息技术硕士项目（MCIT）。在我的职业生涯中，我的主要兴趣是人工智能（AI）和编程语言。我还写过科幻小说——*Ice
    Jockey*、*All True Value* 和 *A Prophet in Paradise*，我预计我还会写更多。而且，嘿，如果你是我的老学生，请给我写封信。我很乐意在
    davidmatuszek@gmail.com 收到你们的来。


    # 前言


    如果你是一个经验丰富的程序员，这本书将是引导你快速上手 Java 的指南。不仅是语言本身，还包括单元测试、图形用户界面、线程和函数式编程的基础知识。


    [注：如果你是一个经验丰富的程序员，这本书将是引导你快速上手 Java 的指南。不仅是语言本身，还包括单元测试、图形用户界面、线程和函数式编程的基础知识。]


    # 版本


    这本书关于 Java 8 和 Java 17。为什么是这两个版本？Java 8 是最后一个可以商业免费使用的版本。由于这些原因，Java 8 之后的版本将会注明。Java
    每六个月发布一个新版本，这并不需要担心，因为当你买这本书时，最新版本可能是 17。


    如果你不确定使用的是哪个版本的 Java，可以从命令行执行：


    ```

    java -version

    ```


    或者在运行的 Java 程序中执行以下打印语句：


    ```

    System.out.println(System.getProperty("java.version"));

    ```


    自 Java 9 起，你还可以从命令行运行 jshell。这个程序让你一次执行一条 Java 语句（如上面的打印语句）。这不是编写程序的方法，但对于尝试非常有用。如果你还没有下载
    Java，它有两个主要变：JRE（运行时环境）用于运行程序，JDK（开发工具包）用于创建和运行程序（JDK 包含 JRE）。由于你阅读这本书，你几乎需要 JDK。你可以从
    [`www.oracle.com/java/technologies/downloads/`](https://www.oracle.com/java/technologies/downloads/)
    获取 Java SE（标准版）JDK。Java 9 及之后的版本对个人使用免费，但商业用户应向 Oracle 公司获取许可。


    # 第一章 Java 闪电


    DOI: [10.1201/9781003402947-1](https://doi.org/10.1201/9781003402947-1)


    本书旨在让其他语言的经验程序员尽可能地开始 Java 编程。因此，本章内容非常密集并假设许多前提；你在第一次阅读时不需要理解或记住所有内容。后续章节将更慢、更详细地涵盖相同的材料。


    > 注意：Java 是冗长的，代码行通常为 80 到 100 个字符。这些行被拆分成更多但更短的行，以提高可读性。


    ## 1.1 项目


    一个程序，或项目（project），由一个或多个包（package）组成。包是一个包含 Java 文件的目录或文件夹。Java 文件包含类（class），通常每个文件一个类。类描述了一个新类型的对象（object），并将对象的字段（fields，即数据）和方法（methods）封装在一起。类有一个或多个构造函数（constructors）来创建该类型的新对象。


