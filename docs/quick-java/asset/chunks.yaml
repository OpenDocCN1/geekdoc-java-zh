  trans: "\n\n```java\nclass Box<T> implements Storage<T> { … }\n```\n\n```java\n\
    class Shelf<T> implements Storage<T> { … }\n```\n\n```java\nclass Cabinet<T> implements\
    \ Storage<T> { … }\n```\n\n这带给我们的能力是编写接受 `Storage` 参数参数的方法，并使用该参数的 `add` 和 `grab`\
    \ 方法。接口名称 `Storage` 的用法就像它是父类名称一样。\n\n```\nvoid method rearrange(Storage<T> storage)\
    \ {\n    // 使用 add 和 grab 的代码\n}\n```\n\n由于 `rearrange` 对任何实现 `Storage` 的类都有效，我们不需要为\
    \ `Box`、`Shelf` 和 `Cabinet` 这三个类分别编写 `rearrange` 方法。\n\n定义接口的语法为：\n\n```\naccessType\
    \ interface Name { … }\n```\n\n其中 `accessType` 必须是 `public` 或省略（即“包权限”）。\n\n接口可以包含常量（`final`\
    \ 变量）。接口内部声明的所有变量自动都是 `public`、`static` 且 `final`，并且必须赋值。可以使用 `public`、`static`\
    \ 和 `final` 关键字，但它们是多余的。同样，接口中的方法也可以（冗余地）使用 `abstract` 修饰符进行声明。\n\n在某些接口中（例如 `Collection`\
    \ 接口），你会发现某些被列为“可选（optional）”的方法。这**并不**意味着实现类可以忽略这些方法。相反，这是一种建议，表示提供的方法可以直接抛出一个\
    \ `UnsupportedOperationException`。\n\n### 5.3.3 抽象类\n\n假设我们想写一个 `clear()` 方法来移除\
    \ `Box` 对象中的所有内容。我们可能会写：\n\n```java\npublic void clear() {\n    T thing;\n   \
    \ do {\n        thing = grab();\n    } while (thing != null);\n}\n```\n\n这可以放在\
    \ `Box` 类中，但如果我们想对其他 `Storage` 类型使用它呢？如果我们把它放在 `Box` 类中，那么它只对 `Box` 对象有效。我们显然不想在所有可以使用该方法的类中都放置该方法的相同副本。\n\
    \n一种解决方案是将 `Storage` 接口更改为**抽象类**。\n\n```java\nabstract class Storage<T> {\n \
    \   public abstract void add(T thing); // 无方法体\n    public abstract T grab();\
    \ // 无方法体\n    public void clear() {\n        T thing;\n        do {\n       \
    \     thing = grab();\n        } while (thing != null);\n    }\n}\n```\n\n抽象类是一种可以包含抽象方法的类，每个抽象方法都必须用\
    \ `abstract` 关键字标记。抽象类是类（所有方法均完全定义）和接口（没有方法是完全定义的）之间的一种中间体。\n\n通过这一更改，`Box`、`Shelf`\
    \ 和 `Cabinet` 类不再实现接口 `Storage`，而是扩展抽象类 `Storage`。\n\n```java\nclass Box<T> extends\
    \ Storage<T> { … }\nclass Shelf<T> extends Storage<T> { … }\nclass Cabinet<T>\
    \ extends Storage<T> { … }\n```\n\n由于抽象类是“不完整的”的（它们缺少一些方法实现），你无法直接从这些类创建对象。抽象类的存在是为了被子类化，子类可以提供缺失的方法定义。\n\
    \n为了防止类被直接实例化而仅通过子类实例化，即使一个类不包含任何抽象方法，也可以被声明为 `abstract`。\n\n### 5.3.4 Final 类和密封类\n\
    \n正如之前提到的，变量可以是 `final` 的，这意味着它的值不能被改变。同样，**final 方法**不能在任何子类中被重写，而**final 类**不能被子类化。\n\
    \n```java\npublic final class Human {\n    final String species = \"Homo sapiens\"\
    ;\n    final String getSpecies() {\n        return species;\n    }\n    // 其他方法\
    \ …\n}\n```\n\n接口*不能*是 `final` 的，因为接口的全部意图在于允许类去实现它。\n\n从 Java 16 开始，类可以是**密封的（sealed）**，这意味着类定义精确地指定了它拥有哪些子类。（没有子类的类不能被视为密封的，但它可以是\
    \ `final` 的。）\n\n```\npublic sealed class Thing\npermits Animal, Vegetable, Mineral\
    \ { … }\n```\n\n这三个子类必须与 `Thing` 类位于同一个包或模块中。为了方便起见，如果所有子类与密封类位于同一个文件中，则可以省略 `permits`\
    \ 子句。\n\n密封类的所有子类必须是 `final`、`sealed` 或 `non-sealed`。`final` 类不能有子类；`sealed` 类必须恰好拥有列出的子类；而\
    \ `non-sealed` 类可以或可以有子类。\n\n```java\nfinal class Animal extends Thing { … }\n\
    sealed class Vegetable extends Thing permits Carrot { … }\nfinal class Carrot\
    \ extends Vegetable { … }\nnon-sealed class Mineral extends Thing { … }\nclass\
    \ Quartz extends Mineral { … }\n```\n\n接口也可以是密封的；`permits` 子句列出了允许实现接口的类。接口可以由类和记录（records）实现，也可以被其他类扩展。除了将\
    \ `class` 单词替换为 `interface` 单词外，语法和要求是相同的。\n\n### 5.3.5 内部类\n\n最初，所有类都是“顶层”类，即不是定义在另一个类内部。Java\
    \ 从此后引入了四种内部类：成员类、静态成员类、局部类和匿名类。\n\n#### 成员类\n\n**成员类**是定义在另一个类内部的类。它可以访问外部类中的名称。\n\
    \n```java\npublic class OuterClass {\n    int outerVariable;\n    public OuterClass(int\
    \ number) {\n        outerVariable = number;\n    }\n    class MemberClass {\n\
    \        int innerVariable = 20;\n        int getSum(int parameter) {\n      \
    \      return outerVariable + innerVariable + parameter;\n        }\n    }\n \
    \   public static void main(String[] args) {\n        OuterClass outer = new OuterClass(100);\n\
    \        OuterClass.MemberClass inner = outer.new MemberClass();\n        System.out.println(inner.getSum(3));\n\
    \        outer.run();\n    }\n    void run() {\n        MemberClass localInner\
    \ = new MemberClass();\n        System.out.println(localInner.getSum(4));\n  \
    \  }\n}\n```\n\n当 `main` 方法运行时，结果将是 123 和 124。\n\n#### 静态成员类\n\n**静态成员类**的定义方式与成员类相似，但带有\
    \ `static` 关键字。尽管它位于另一个类内部，但静态成员类实际上是一个“外部”类——它对包含类中的名称没有特殊的访问权限。\n\n要在包含类外部引用静态内部类，请使用语法\
    \ `OuterClassName.InnerClassName`。\n\n（此处原文已中断，未翻译后续内容）\n"
- fmt: "\nWhen the `main` method runs, the results will be 223 and 225.\n\n### 5.3.5.3\
    \ Local Inner Classes\n\nA `local inner class` is defined within a method, and\
    \ the usual scope rules apply to it. It is only accessible within that method,\
    \ therefore access restrictions (public, protected, package) do not apply. However,\
    \ because objects (and their methods) created from this class may persist after\
    \ the method returns, a local inner class is not allowed to use parameters or\
    \ non-final local variables of the method.\n\n```java\npublic class OuterClass\
    \ {\nint outerVariable = 10000;\nstatic int staticOuterVariable = 2000;\npublic\
    \ static void main(String[] args) {\nOuterClass outer = new OuterClass();\nSystem.out.println(outer.run());\n\
    }\nObject run() {\nint localVariable = 666;\nfinal int finalLocalVariable = 300;\n\
    class LocalClass {\nint innerVariable = 40;\nint getSum(int parameter) {\n// Cannot\
    \ access localVariable here\nreturn outerVariable +\nstaticOuterVariable +\nfinalLocalVariable\
    \ +\ninnerVariable + parameter;\n}\n@Override\npublic String toString() {\nreturn\
    \ \"I'm an instance of LocalClass\";\n}\n}\nLocalClass local = new LocalClass();\n\
    System.out.println(local.getSum(5));\nreturn local;\n}\n}\n```\n\nWhen the `main`\
    \ method runs, the results will be 12345 (printed from the `run` method) and \"\
    I'm an instance of LocalClass\" (printed from the `main` method).\n\n### 5.3.5.4\
    \ Anonymous Inner Classes\n\nAn `anonymous inner class` is one that is declared\
    \ and used to create exactly one object (typically as a parameter to a method),\
    \ all within a single statement.\n\nAn anonymous inner class may extend a class:\n\
    \n```java\nnew SuperClass(parameters) { class body }\n```\n\nHere, `SuperClass`\
    \ is not the name of the class being defined (that class has no name), but rather\
    \ the name of the class being extended. The `parameters` are the parameters to\
    \ a constructor for that superclass.\n\nAlternatively, an anonymous inner class\
    \ may implement an interface:\n\n```java\nnew Interface() { interface body }\n\
    ```\n\nInner classes are frequently used as event listeners. The example below\
    \ uses an anonymous inner class (`ActionListener`) as a button listener.\n\n```java\n\
    import java.awt.event.ActionEvent;\nimport java.awt.event.ActionListener;\nimport\
    \ javax.swing.*;\n\npublic class OuterClass extends JFrame {\npublic static void\
    \ main(String[] args) {\nOuterClass outer = new OuterClass();\nJButton button\
    \ =\nnew JButton(\"Don't click me!\");\nbutton.addActionListener(\nnew ActionListener()\
    \ {\npublic void actionPerformed(\nActionEvent event) {\nSystem.out.println(\"\
    Ouch!\");\n}\n});\nouter.add(button);\nouter.pack();\nouter.setVisible(true);\n\
    }\n}\n```\n\nBecause anonymous inner classes occur within a method, they break\
    \ up the flow and add several lines to the method. Consequently, the actual code\
    \ within an anonymous inner class should be kept very short.\n\n### 5.3.6 Enums\n\
    \nAn enum (enumeration) is a kind of class. It has a superclass, `Enum`, from\
    \ which it inherits some methods. An enum has all the features of an “ordinary”\
    \ class (fields, constructors, methods, etc.), except that an enum has a fixed,\
    \ finite number of instances (objects) of the class, defined directly within the\
    \ class itself. In other words, when you define an enum, you also define all its\
    \ possible values, and you cannot later create additional values.\n\nAn enum is\
    \ appropriate when you need a variable that represents one of a fixed set of values—for\
    \ example, the months of a year. They provide type safety: You cannot, for instance,\
    \ assign a `Coin` value to a `Month` variable.\n\nThe simplest form of enum consists\
    \ of a list of constants, each of which is one of the values of the enum. For\
    \ example,\n\n```java\nenum Weekday { SUN, MON, TUE, WED, THU, FRI, SAT }\n```\n\
    \nThis example defines the type `Weekday` and seven instances (values) of that\
    \ type. Each of these is a unique constant. Because they are unique, it is okay\
    \ to compare them with `==` as well as with the `equals` method.\n\nIn the `Weekday`\
    \ example, each of the instances (`SUN`, `MON`, etc.) has been created by (implicitly)\
    \ calling the default `Weekday` constructor. As with any class, you can write\
    \ your own constructors; however, (1) those constructors will be private, and\
    \ (2) you call them, not by saying `new`, but by giving the instance name followed\
    \ by a parameter list. For example,\n\n```java\npublic enum Coin {\nprivate final\
    \ int value;\nCoin(int value) {\n    this.value = value;\n}\npublic int value()\
    \ {\n    return value;\n}\n```\n*(Note: The source text provided some fragmented\
    \ code blocks for the Coin enum and Weekday examples; I have reconstructed the\
    \ logical structure based on the provided text segments.)*\n\n### 5.3.7 Records\n\
    \nA `record` is a kind of class, available since version 14. The purpose is to\
    \ encapsulate a small amount of data in a full-featured class. As an example,\n\
    \n```java\nrecord Range(int min, int max) { }\n```\n\nThe above is a complete\
    \ record declaration; you don’t need to put anything inside the braces (although\
    \ you may if you wish). For this declaration, the compiler will generate:\n\n\
    - Two private final int fields named `min` and `max`,\n- A constructor with `min`\
    \ and `max` as parameters,\n- The getter methods `min()` and `max()`,\n- The methods\
    \ `equals(Object)`, `hashCode()`, and `toString()`.\n\nYou can replace the default\
    \ constructor with your own, using the usual syntax. Another option is to write\
    \ a `compact constructor`:\n\n```java\npublic Range {\n    assert min <= max;\n\
    }\n```\n\nA compact constructor gets its parameters from the record declaration,\
    \ and automatically saves them as private final fields. You can override any or\
    \ all of the generated methods with your own, so long as they have the same signature.\
    \ You can also add fields, initializers, and methods, but they must all be static.\
    \ Records may be inner classes or local to a method.\n\n### 5.3.8 Serialization\n\
    \nA `serializable` object is one that can be converted to a sequence of bytes,\
    \ usually so that it can be written to a file. To read it again, it has to be\
    \ `deserialized`. In order for an object to be serializable:\n\n- It must implement\
    \ the `java.io.Serializable` interface. This is a `marker interface`—one that\
    \ doesn’t list any methods, so none have to be defined in order to implement it.\n\
    - Every field of the object must be either serializable or `transient`.\n\n  \
    \  - Strings, arrays, and “wrapped” primitives are all serializable, as are many\
    \ Java-supplied objects such as `HashMap`. Check the Java documentation if you\
    \ are unsure.\n    - A field of the object is considered serializable if it is\
    \ an object that has an accessible no-argument constructor to initialize its fields\
    \ when it is deserialized.\n"
