    # Chapter 7 Unit Testing


    DOI: [10.1201/9781003402947-7](https://doi.org/10.1201/9781003402947-7)


    ## 7.1 Philosophy


    Testing is an essential part of programming. You can do *ad hoc* testing (testing
    whatever occurs to you at the moment), or you can build a ***test suite*** (a
    thorough set of tests that can be run at any time).


    People naturally want to minimize effort, and building a test suite is additional
    effort. However, experiments repeatedly show that writing test suites takes less
    time and effort than debugging without a test suite, and results in far more reliable
    code. In addition, the existence of a test suite makes it *much* easier to maintain
    and modify the program, particularly after a few months have passed.


    Besides, debugging is even less fun than writing tests.


    Deadlines are often used as an excuse for not doing thorough testing—“There isn’t
    time!” This is a flawed argument, since thorough testing *reduces* total programming
    time.


    That said, programmers are human, and they will only do adequate testing if (1)
    the tests are easy to write, and even more importantly, (2) the tests are effortless
    to run. A good ***test framework*** such as JUnit makes both of these things possible.


    It is very difficult to write tests for methods that were not written with testing
    in mind. To be testable:


    *   Methods should do only one thing, not a large variety of things. The simpler
    the method, the simpler the test.


    *   Methods should be as self-contained as possible. They should not depend on
    context any more than absolutely necessary. They should not require other methods
    to execute before this one. Tests that can be run in isolation are much easier
    to write than those that require elaborate setup.


    *   Methods should absolutely not require any interaction with the programmer.
    Tests that require more than a single button click to run will be run much less
    often, if at all.


    *   Methods should not do any input/output. There are advanced techniques, not
    covered here, for testing input/output methods without demanding programmer interaction.


    Fortunately, rules for writing testable methods are also rules for a good programming
    style.


    It is good practice to write the tests for a method concurrently with writing
    the method. Some even advocate writing the tests *before* writing the method,
    as this helps clarify what the method is supposed to do.


    After a method has been written and tested, additional errors may be discovered.
    There is a specific technique for dealing with this situation. *First*, write
    a test that demonstrates the error; *then* fix it. This is useful because, for
    whatever reason, some errors have a habit of recurring.


    ## 7.2 What to Test


    Testing should cover both the common cases and the edge cases, where things are
    most likely to go wrong.


    For example, if you have a method isPrime to decide whether a number is a prime,
    you might decide to test whether isPrime(28) is false and isPrime(29) is true.
    Having done that, it is probably redundant and even a bit silly to also test whether
    isPrime(30) is false and isPrime(31) is true.


    You might, however, want to check that isPrime(15) is false, in case the method
    somehow decides that all odd numbers are prime. It''s also worth checking worth
    checking that isPrime(2) is true, in case the method decides that all even numbers
    are non-prime. In fact, 2 is an edge case, since it is the only even prime number.


    Another edge case is isPrime(1), which should be false. Although it passes the
    general test (not divisible by any number other than itself and 1), mathematicians
    define 1 as not a prime number.


    Other edge cases are zero and negative numbers. Primality is not defined for these
    numbers, and the programmer must decide what to do in these cases (and preferably,
    test that that is what actually happens). If the decision is “that can’t happen
    anyway”, the appropriate thing to do is to put the statement assert n > 0; at
    the beginning of the isPrime method, and test that an inappropriate call throws
    an exception.


    > **Reminder:** assert statements (see [section 3.3.2.1](#ch03.xhtml_sec3_003_002_001))
    are “free” in that they are treated just like comments, and do not add to code
    size or execution time, unless they are explicitly enabled in the run-time configuration
    setting.


    ## 7.3 JUnit


    JUnit is a well-established test framework. To use it, here''s the general approach:


    1.  Define a class to hold the tests, and import the test framework.


    2.  Include any number of test methods, ***annotated*** (preceded) by @Test. Each
    test will call one or more ***assertion methods***.


    3.  If any of the tests manipulate global variables, you should have a method
    annotated with @BeforeEach to initialize them.'
