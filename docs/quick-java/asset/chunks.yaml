    Notes:


    *   When a character is typed, the event handlers keyPressed, keyTyped, and keyReleased
    are called, in that order. When other keys (shift, option, up arrow, etc.) are
    typed, only keyPressed and keyReleased are called.


    *   All three methods can use getKeyCode(), which returns an int.


    *   The keyTyped method (only) can use the getKeyChar method to return the char.


    *   A Container must have “focus” in order to respond to events. Usually, this
    occurs by clicking on it or tabbing to it.


    *   To determine which key was pressed, you can compare the ***key code*** to
    any of a large number of constants in the KeyEvent class, such as VK_A, VK_SHIFT,
    or VJ_DOWN. Non-English keyboards have the keys arranged differently, but the
    VK (virtual keyboard) values are independent of the keyboard arrangement.


    ### 9.8.17 Mouse Input


    All of the common widgets handle mouse events automatically. However, if you wish
    to do something special, such as point at specific parts of an image, you can
    write your own mouse listeners. There are separate listeners for clicks, movement,
    and scrolling.


    The MouseListener interface specifies five public void methods: mouseEntered,
    mouseExited, mousePressed, mouseReleased, and mouseClicked. Each of these receives
    a MouseEvent argument (see below). The only one of these methods you are likely
    to care about is mouseClicked, but MouseListener is an interface, so you have
    to provide them all, even if they don’t do anything.


    The MouseMotionListener interface specifies two public void methods, mouseMoved
    and mouseDragged, both with a MouseEvent argument.


    The MouseEvent object has the following methods (among others):


    *   getButton() returns one of the values MouseEvent.BUTTON1, MouseEvent.BUTTON2,
    or MouseEvent.BUTTON3.


    *   getX() and getY() return the mouse location, in pixels, relative to the top-left
    corner of the component that has the listener. X values increase as the mouse
    pointer moves to the right, and Y values increase as the mouse pointer moves down.


    *   getXOnScreen() and getYOnScreen() return the mouse location relative to the
    top-left corner of the display screen.


    *   getClickCount() returns the number of closely-spaced mouse clicks.


    The MouseAdapter class provides empty versions of all of the above methods, so
    you can extend this class and override any of the methods you care to use. See
    [section 9.8.10](#ch09.xhtml_sec9_008_010) on the JLabel widget for an example
    of using a MouseAdapter.


    There is also a MouseWheelListener interface. It requires a mouseWheelMoved method
    with a MouseWheelEvent parameter. Since a JScrollPane is almost always more convenient,
    this interface is not covered here.


