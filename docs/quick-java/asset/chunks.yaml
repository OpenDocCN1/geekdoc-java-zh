    for this lack, each primitive type has a corresponding ***wrapper class***. Those
    classes are: `Boolean`, `Byte`, `Character`, `Double`, `Float`, `Integer`, `Long`,
    and `Short`. They are all in `java.lang`, which is automatically imported.


    Wrapping and unwrapping happen automatically. If a method expects an Object as
    an argument, but you call it with a primitive, the primitive will be “wrapped”
    into the correct kind. Similarly, if you try to add 1 to an `Integer` object,
    that object will be unwrapped to an `int`.


