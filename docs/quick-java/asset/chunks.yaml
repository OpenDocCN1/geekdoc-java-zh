    class that it is in, and it will return a Password object. (Constructors do not
    use an explicit return statement.)


    Notice that the constructor has access to *two* different variables, both named
    password. One is the field, or instance variable, while the other is a parameter.
    This may look strange, but it is quite commonly done, especially in constructors.
    To distinguish between them, the name password by itself refers to the parameter,
    while this.password refers to the instance variable.


    Next is a method named matches, which will return a boolean (true or false) value.
    Because strings are objects, the matches method must compare them using equals.


    > **Note:** Although using == to compare strings *often* works, it won’t work
    here; see [section 5.2.2.8](#ch05.xhtml_sec5_002_002_008) for an explanation.
    You should always use equals to compare strings.


    Finally, there is a reset method that takes two strings as parameters and tells
    whether the reset succeeded. It is not marked public, protected, or private, so
