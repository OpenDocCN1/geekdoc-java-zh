  trans: "\n将 Java 认为为由“内部语言”和“外部语言”组成是很有用的。内部语言由数据、方法和语句组成，对于一个只有一个类的小型程序来说，这些已经足够了。同样复杂的外部语言则由用于组织大型程序的所有各种类型的类和接口组成。\n\
    \n在完成一些准备工作后，下一章将描述 Java 的内部语言（非常像 `C` 或 `C++`），接下来的章节将描述外部语言。\n\n## 2.1 IDE\n\
    \n> **章节摘要：** 强烈建议使用 IDE。如果你还没有使用，IntelliJ IDEA 是最适合初学者的工具之一。\n\n你仅需文本编辑器和命令行就可以创建并运行复杂的\
    \ Java 程序，但这种做法非常费力。\n\n一个专业的`集成开发环境`（`IDE`）对开发程序具有不可比拟的帮助。一个非常基础的 IDE 集成了文本编辑器、编译器、调试器和代码执行器。专业级的\
    \ IDE 还会建议适用的方法、提供即时文档查询、为错误提供纠正、进行自动版本备份、协助重构代码以及许多其他服务。我曾听学生告诉我，他们能在我的课程中成功，仅仅是因为他们的\
    \ IDE 为他们写了程序。\n\n对专业 IDE 的异议是它是一个巨大且复杂的程序，很难学习（例如类似于 `Microsoft Word`）。这无疑是事实。我的建议是获取一个良好的、功能齐全的\
    \ IDE，并像使用可以运行程序的文本编辑器一样使用它。没有必要立即学习它所有的功能。\n\n最流行的 Java IDE 有 `Eclipse`、`NetBeans`、`IntelliJ\
    \ IDEA` 以及仅限 Mac 的 `Xcode`。它们都是非常优秀的，并且拥有忠实的用户；而且都有免费版本。它们都可以（并且已经）被用于许多其他语言。其中，IntelliJ\
    \ IDEA 不需要预先了解界面，只需在每一步引导初学者即可。\n\n尽管如此，有时 IDE 仅仅会拒绝工作。这可能是由于升级导致文件版本不兼容，或其他类似的问题。（我在\
    \ `Eclipse` 上遇到过很多这类问题）。重新安装 IDE 可能有所帮助。探索所有设置也可能有帮助。当然，你可以切换到不同的 IDE。\n\n还有一些简单的\
    \ IDE，通常是专门为学生编写的，例如 `BlueJ`、`JCreator` 和 `DrJava`。简单 IDE 的优点是它不那么令人畏畏。缺点是它对程序员的帮助较少。\n\
    \n俗话说，任何语言中最难写的程序都是“Hello World”；之后所有的程序都只是这一个延伸。同样，一旦你成功地使用专业 IDE 编写并执行了一个程序，剩下的都只是延伸了。\n\
    \n## 2.2 注释和标签\n\nJava 中有三种注释。\n\n*   以 `//` 开头并持续到行尾的注释。\n    *   当置于代码行末尾时，它们对该行代码进行了某种说明。\n\
    \    *   当单独放在一行中时，它们对随后的代码进行了某种说明。\n    *   许多 IDE 会通过在每行开头添加 `//` 来注释掉整个代码块。\n\
    \n*   以 `/*` 开头并持续到 `*/` 的注释。\n    *   这些用于无法在单行内显示的注释，并对随后的代码进行了某种说明。\n    *\
    \   它们也可以用于在代码代码的中间插入注释。\n\n*   以 `/**` 开头并持续到 `*/` 的注释。\n    *   这些是`文档 (doc)\
    \ 注释`。它们紧挨在类、方法、接口或变量的声明之前。\n    *   Doc 注释通常在第一行之后的每行开头都写一个星号。\n\n文档注释可以包含`标签`，如\
    \ `@param` 和 `@return`；其中许多描述可以在 第 5.2.1.2 节 Javadoc 中找到。\n\n示例：\n\n```java\n\
    /**\n * 返回两个数的和。\n * @param a 第一个数字。\n * @param b 第二个数字。不能为负数。\n * @return 两个数的和。\n\
    \ * @throws AssertionError 如果 b 为负数。\n */\nint add(int a, int b) {\n    assert\
    \ b >= 0; // 除非设置了 -ea，否则会被忽略\n    while (b > 0) {\n        // 将 1 从 b 移动到 a\n\
    \        b -= 1;\n        a += 1;\n    }\n    return a;\n}\n```\n\nJavadoc 是一个从\
    \ doc 注释和标签中提取信息并生成非常专业文档的程序，通常但不一定是 HTML。非 doc 注释会被忽略。\n\n# 第 3 章 Java 的“内部语言”\n\
    \nDOI: [10.1201/9781003402947-3](https://doi.org/10.1201/9781003402947-3)\n\n\
    一个 Java 程序由一个或多个类组成。本书使用“内部语言”是指指在单个顶层类内部发生的情况。对于简单的程序，一个类可能就是所有需要的。\n\n## 3.1\
    \ 变量和命名规范\n\n`变量`是一个可以赋值的名称。变量在不同时间可以不同的值。\n\n所有变量都必须声明。当一个变量被声明时，它会被赋予一个值（注：原文此处意为赋予类型，根据语境为类型）。所有变量都必须声明。当一个变量被声明时，它被赋予一个`类型`，告诉它可以拥有什么类型的值。它也可以被赋予一个初始值。`int`\
    \ 变量只能有整数值，`String` 变量只能有字符串值，以此类推。Java 是区分大小大小的；即 `result`、`Result` 和 `RESULT`\
    \ 是三个不同的名称。基本类型名称都是小写的，而对象类型名称如 `String` 是大写的。\n\n`实例变量`是一个在类中声明的变量，但每个`实例`或对象都有一个独立的拷贝。`类变量`（或`静态变量`）使用\
    \ `static` 关键字在类中声明。它只有一个，而不是每个对象一个，它被认为归类本身所有。`局部变量`是在方法内部声明的变量。它仅在该方法内有效。`参数`也是方法的局部的。\n\
    \n`常量`是一个值不能改变的“变量”。通过添加 `final` 关键字来指示。\n\n## 3.2 数据类型\n\n有八种`原始`数据类型：`char`、`byte`、`short`、`int`、`long`、`float`、`double`\
    \ 和 `boolean`。所有其他值（数组、字符串等）都属于某个类或对象类型。这种区别是非常重要的。\n\n"
- fmt: "\n### 3.2.1 Primitive Types\n\nHere are the four most important and most used\
    \ primitive types:\n\n* An `int` is an integer, or “whole number.” It can hold\
    \ numbers large enough for most purposes (about plus or minus two billion). To\
    \ make very large numbers more readable, you can put underscores between digits.\n\
    * A `double` is a 64-bit “real” (floating point) number. It can hold very large\
    \ and very small numbers, with about 17 digits of accuracy. It may be written\
    \ in scientific notation, with `e` or `E` denoting the exponent: $6.0221409 \\\
    times 10^{(23)}$ can be written as `6.0221409e+23`. As with integers, you can\
    \ put underscores between digits.\n* A `char` is a single character. Common characters\
    \ can be written simply by enclosing them in single quotes, for example, `'a'`.\
    \ Some characters need to be represented by escape sequences, such as `'\\n'`\
    \ for a newline.\n* A `boolean` is a single true or false value.\n\nThe other\
    \ four primitive types (`long`, `short`, `byte`, and `float`) aren’t used in most\
    \ programs, and will be discussed in [section 5.2.2.6](#ch05.xhtml_sec5_002_002_006).\n\
    \n### 3.2.2 Arrays\n\nAn `array` is an ordered sequence of values, all of the\
    \ same type. To access the individual values in an array, use the syntax `arrayName[index]`.\
    \ Legal indices range from 0 (the first value in the array) to `arrayName.length\
    \ - 1` (the last value).\n\nThe simplest syntax for `declaring` an array is either:\n\
    \n```\nbaseType[] arrayName;\n```\n\nor:\n\n```\nbaseType arrayName[];\n```\n\n\
    For example,\n\n```java\nint[] scores;\n```\n\nThis declares but does not define\
    \ the `scores` variable. That is, its type has been assigned, but no value of\
    \ that type has been assigned to it. An array variable that has been declared\
    \ but defined will have the special value `null`, and attempting to use it will\
    \ result in an error.\n\nTo both declare and define `scores`, you can say:\n\n\
    ```java\nint[] scores = new int[35];\n```\n\nOnce an array is defined, you cannot\
    \ change its size. However, the size of an array is not part of its type, so an\
    \ `int` array of any size can be assigned to `scores`. Later, you might assign\
    \ a different array, of a different size, to `scores`. You can find the size of\
    \ an array by asking it for its length variable, `array.length`.\n\nArrays created\
    \ as shown above will have its elements set to 0, `false`, or `null`, for numeric,\
    \ boolean, or object arrays, respectively. Alternatively, an array can be created\
    \ with specific values, using the syntax `new type[] {value, ...}`, for example,\n\
    \n```java\nint[] ary = new int[] {3, 1, 4, 1, 6};\n```\n\nor with the slightly\
    \ simpler\n\n```java\nint[] ary2 = {3, 1, 4, 1, 6};\n```\n\nThe values in an array\
    \ can themselves be arrays. There is a special syntax for this, as in the following\
    \ examples:\n\n```java\ndouble elevation[][]; // declaration\n```\n\n```java\n\
    elevation = new double[50][75]; // definition\n```\n\n```java\nelevation[49][74]\
    \ = 123.45;\n```\n\nThe `elevation` array can be referred to as a `two-dimensional\
    \ array`, but it is more accurately thought of as a one-dimensional array whose\
    \ elements happen to be arrays. Arrays may have three, four, or even more dimensions.\n\
    \nThe first index in a multi-dimensional array is usually called the `row` number,\
    \ and the second index the `column` number. The above array has 50 rows with indices\
    \ 0 to 49, and 75 columns with indices 0 to 74.\n\nThe values in an array must\
    \ all be of the same type, but the array size is not part of that type. The following\
    \ code constructs a “triangular” array of arrays, in which each sub-array is larger\
    \ than the one preceding it:\n\n```java\nint[] triangle = new int[10];\n\nfor\
    \ (int i = 0; i < triangle.length; i++) {\n    triangle[i] = new int[i + 1];\n\
    }\n```\n\n### 3.2.3 Strings\n\nA `string literal` is a sequence of zero or more\
    \ characters enclosed in quotation (double quote) marks. For example:\n\n```java\n\
    \"\" // an empty string\n\"hello\" // a string containing five characters\n```\n\
    \nSome characters cannot be entered directly in a character or string constant;\
    \ for example, double quotes within a string. These characters can be included\
    \ by `escaping` them (putting a backslash in front of them):\n\n```java\n\"He\
    \ said, \\\"Don't go.\\\"\"\n```\n\nThe important `escape sequences` are:\n\n\
    * `\\n` is a “newline” character, however that is encoded on your computer system\
    \ (it is different on Windows than on Unix and Macintosh).\n* `\\t` is a tab character,\
    \ representing an arbitrary amount of white space.\n* `\\\"` is a double quote\
    \ character (useful inside doubly-quoted strings).\n* `\\'` is a single quote\
    \ character.\n* `\\\\` is a backslash character.\n* `\\uxxxx` is a Unicode character\
    \ written as exactly four hex digits.\n\nIn addition, there are the seldom-used\
    \ `\\b` for backspace, `\\r` for carriage return, and `\\f` for feed.\n\n### 3.2.4\
    \ Exceptions\n\nA checked exception is one that your program is required to deal\
    \ with. For example, if you try to read a file, Java knows that there are a lot\
    \ of things that could go wrong, and requires you to have `try-catch-finally`.\
    \ Basically, this statement says: “I’m going to try to do this, but if it doesn’t\
    \ work I will catch the exception and do something.”\n\nAn unchecked exception\
    \ is one that might happen, but you aren’t required to check for it. These exceptions\
    \ always result from bugs in your program, such as going outside the bounds of\
    \ an array, or trying to use a `null` object. The solution is to debug the program.\n\
    \n### 3.2.5 Operators and Precedence\n\nJava has the usual arithmetic operators,\
    \ with the usual `precedence` (multiplications before additions, etc.). Operators\
    \ with the highest precedence are done first and, with some exceptions, most operators\
    \ are `left associative`—that is, operators with equal priority are done left\
    \ to right. For example, `12 - 2 - 3 * 4 == 10 - 12 == -2`.\n\nThe most common\
    \ operators, from highest to lowest precedence, are:\n\n* Method calls and array\
    \ indexing\n* Arithmetic operations:\n    1. unary `+` and unary `-`\n    2. `*`\
    \ (multiplication), `/` (division), and `%` (remainder, or modulus)\n    3. `+`\
    \ (addition) and `-` (subtraction)\n* Boolean (logical) operators:\n    1. `!`\
    \ (not)\n    2. `&&` (and)\n    3. `||` (or)\n* Inequality tests:\n    1. `< <=\
    \ >= >` (less than, less or equal, greater or equal, greater than)\n* Equality\
    \ tests:\n    1. `==` (equal to) and `!=` (not equal to)\n* Assignment operators:\n\
    \    1. `=` (simple assignment)\n    2. `+=`, `-=`, `*=`, `/=`, and `%=` (`x op=\
    \ y` is short for `x = x op y`).\n"
