    import java.awt.Point;\nimport java.beans.*;\nimport javax.swing.JPanel;\n\n/**\n\
    \ * View 显示了 Model 中正在发生的内容。\n * 在此示例中，Model 只有一个\n * 一个跳动的球。\n * @author David\
    \ Matuszek\n */\npublic class View extends JPanel\nimplements PropertyChangeListener\
