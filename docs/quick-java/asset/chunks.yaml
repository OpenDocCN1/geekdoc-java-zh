  trans: "\n与本书中描述的大多数类一样，`Scanner` 类拥有的方法比这里提到的多得多。例如，扫描器可以使用正则表达式来告诉它读取什么内容。\n\n\
    ### 3.4.1.4 控制台 (Console)\n\n`java.io.Console` 类提供了一种比 `Scanner` 类简单得多的读取用户输入的方法，但它有一个显著的缺点：它要求存在一个交互式的“控制台”。取决于\
    \ Java 程序的执行方式，控制台可能存在也可能不存在。在许多情况下，从命令行运行时可以使用 `Console`，但在 IDE 中运行时则不可以使用。\n\
    \n如果没有可用的控制台，构造函数调用 `new Console()` 将返回 `null`。否则，以下是新创建的控制台上可以进行的一些操作：\n\n* \
    \  `readLine()` 返回一行，格式为字符串。\n*   `readLine(formatString, value, … , value)` 格式化并显示一个作为提示符的字符串，然后读取并返回一行。\n\
    \    *   `格式字符串`在第 5.2.2.10 节中进行了描述。也可以使用不带插值 `values` 的纯字符串。\n*   `readPassword()`\
    \ 返回一个字符数组（即 `char[]`）中的一行，且不显示输入的内容。\n*   `readPassword(formatString, value,\
    \ … , value)` 格式化并显示一个作为提示符的字符串，然后读取并以字符数组的形式返回一个不显示的行。也可以使用纯字符串。\n*   `printf(formatString,\
    \ value, …, *value)` 格式化并显示一个字符串。\n*   `writer()` 返回一个与此控制台关联的 `PrintWriter`。\n\
    \    *   `Console` 对象本身不具备 `print` 和 `println` 方法，但这些消息可以发送到 `writer()` 返回的 `PrintWriter`。\n\
    \n### 3.4.1.5 对象、泛型和栈\n\n对象最通用的类型是 `Object`。如果你声明一个 `Object` 数组，你可以将任何类型的对象放入其中——字符串、栈、线程，等等。你也可以声明得更具体，声明一个（例如）`String`\
    \ 数组，那么该数组只能包含字符串。\n\n除了数组之外，Java 还有各种类型的集合（Collections）：`Stacks`、`Lists`、`HashMaps`\
    \ 等。最初，*任何*类型的对象都可以被推入 `Collection`，没有办法变得更具体。当你从集合中获取一个值时，你得到的是一个 `Object`，必须将其强制转换（`cast`）为正确的类型。为了后兼容，这种风格仍然允许。\n\
    \n例如，Java 有一个 `Stack` 类型（在 `java.util` 包中），具有 `push` 和 `pop` 等操作。\n\n```\nStack\
    \ stuff = new Stack();\n```\n\n```\nstuff.push(\"abracadabra\");\n```\n\n```\n\
    stuff.push(new File(\"abc.txt\"));\n```\n\n```\nFile foo = (File)stuff.pop();\n\
    ```\n\n```\nString spell = (String)stuff.pop();\n```\n\n在现代代码中，最好明确可以放入栈中的什么类型的值。这是通过使用`类型参数`（type\
    \ parameters）或`泛型`（generics）实现的。类型参数被放在对象类型后的角括号中。\n\n```\nStack<String> words\
    \ = new Stack<String>();\n```\n\n```\nwords.push(\"abracadabra\");\n```\n\n```\n\
    words.push(new File(\"abc.txt\")); // 非法\n```\n\n为了尽量减少冗余，定义中的类型参数（即 `new` 关键字之后）可以是一个空的“菱形”`<>`。\n\
    \n```\nStack<String> words = new Stack<>();\n```\n\n> **注意：** 在我正在使用的 Java 版本中，显然甚至“菱形”也可以省略，但这不是\
    \ Java 的已公告特性。\n\n作为一个额外的奖励，当你从泛型化的集合中检索一个对象时，不再需要将其强制转换为正确的类型。\n\n```\nString\
    \ word = words.pop();\n```\n\n泛型化的类型名称可以用任何可以使用“普通”类型名称的地方，例如在方法的声明中。例如，\n\n```\n\
    int find(String target,\n```\n\n```\nStack<String> words) { … }\n```\n\n### 3.4.1.6\
    \ 映射 (Maps)\n\n`java.util` 包中最实用的对象之一是 `HashMap`。\n\n`map` 是一个查找表或字典；它将`键`（keys）与`值`（values）关联起来。对于联系人列表，键可能是某人的名字，值则是该人的电话号码。\n\
    \n```\nHashMap<String, Integer> phones = new HashMap<>();\n```\n\n```\nphones.put(\"\
    Joan\", 555_1212);\n```\n\n> **注意：** 上述代码之所以有效，是因为尽管在需要对象的地方不能使用原始类型，Java 会将 `int`\
    \ 值 `555_1212` “包装”成一个 `Integer` 对象。\n\n`HashMap` 是一种特殊的 `Map`，支持极快的查找。任何对象类型都可以作为键。\n\
    \n> **注意：** 如果`keys` 是具有自定义 `equals` 方法的用户自定义对象，那么这些对象*必须*也具有一个自定义的 `hashCode`\
    \ 方法，以便为相同的对象产生相同的哈希码。\n\n`HashMap` 上的一些重要操作包括：\n\n*   `map.put(key, value)` —\
    \ 向 `map` 中添加 `key/value` 对。\n*   `map.putIfAbsent(key, value)` — 如果 `key` 不存在，则向\
    \ `map` 中添加 `key/value` 对。\n*   `map.get(key)` — 返回与 `key` 关联的值，如果 `key` 不在 `map`\
    \ 中则返回 `null`。\n*   `map.getOrDefault(key, defaultValue)` — 返回与 `key` 关联的值，如果\
    \ `key` 不在 `map` 中则返回 `defaultValue`。\n*   `map.size()` — 返回 `map` 中 `key/value`\
    \ 对的数量。\n*   `map.clear()` — 移除 `map` 中的所有内容。\n*   `map.remove(key)` — 从 `map`\
    \ 中删除 `key` 及其关联的值。\n*   `map.keySet()` — 返回 `map` 中所有键的 `Set` 视图。\n\n> **注意：**\
    \ 视图类似于对象的窗口，随着对象的改变而改变。在上述情况下，`keySet()` 返回的 `Set` 可以像“普通”集合一样使用，但 `map` 内容的变化会改变它。\n\
    \n### 3.4.1.7 Java API\n\nJava *API*（应用程序接口）是一个巨大的资源，包含七千多个类，组织在两百个包中。能够找到并使用这个资源是非常重要的。\n\
    \n要找到文档，可以在网上搜索“java 17 api”或类似词汇。搜索结果中的顶部结果应该是 “[Overview (Java SE 17 & JDK 17)](https://docs.oracle.com/en/java/javase/17/api/)”。（如果你是为\
    \ Android 或类似平台编程，你需要 Java 8 文档。）该链接将带你进入一个模块列表页面；点击 [java.base](https://docs.oracle.com/en/java/javase/17/docs/api/java.base/module-summary.html)。页签此页面；这是一个很好的起点。如果你对\
    \ GUI 开发感兴趣，也请收藏 [java.desktop](https://docs.oracle.com/en/java/javase/17/docs/api/java.desktop/module-summary.html)\
    \ 链接。\n\n在 [java.base](https://docs.oracle.com/en/java/javase/17/docs/api/java.base/module-summary.html)\
    \ 页面上，列表顶部的包之一是 [java.lang](https://docs.oracle.com/en/java/javase/17/docs/api/java.base/java/lang/package-summary.html)。这个包对于每个\
    \ Java 程序都是必不可少的，并且会自动导入到每个 Java 程序中。点击 [java.lang](https://docs.oracle.com/en/java/javase/17/docs/api/java.base/java/lang/package-summary.html)\
    \ 进入列出该包中所有类的页面。\n"
