    \ type has been assigned to it. An array variable that has been declared but defined\
    \ will have the special value null, and attempting to use it will result in an\
    \ error.\n\nTo both declare and define scores, you can say:\n\n```\nint[] scores\
    \ = new int[35];\n```\n\nOnce an array is defined, you cannot change its size.\
    \ However, the size of an array is not part of its type, so an int array of any\
    \ size can be assigned to scores. Later, you might assign a different array, of\
    \ a different size, to scores. You can find the size of an array by asking it\
    \ for its length variable, ***array***.length.\n\nArrays created as shown above\
    \ will have its elements set to 0, false, or null, for numeric, boolean, or object\
    \ arrays, respectively. Alternatively, an array can be created with specific values,\
    \ using the syntax new ***type***[] {***value***, ***…***}, for example,\n\n```\n\
    int[] ary = new int[] {3, 1, 4, 1, 6};\n```\n\nor with the slightly simpler\n\n\
    ```\nint[] ary2 = {3, 1, 4, 1, 6};\n```\n\nThe values in an array can themselves\
    \ be arrays. There is a special syntax for this, as in the following examples:\n\
    \n```\ndouble elevation[][]; // declaration\n```\n\n```\nelevation = new double[50][75];\
    \ // definition\n```\n\n```\nelevation[49][74] = 123.45;\n```\n\nThe elevation\
    \ array can be referred to as a ***two-dimensional array***, but it is more accurately\
    \ thought of as a one-dimensional array whose elements happen to be arrays. Arrays\
    \ may have three, four, or even more dimensions.\n\nThe first index in a multi-dimensional\
    \ array is usually called the ***row*** number, and the second index the ***column***\
    \ number. The above array has 50 rows with indices 0 to 49, and 75 columns with\
    \ indices 0 to 74.\n\nThe values in an array must all be of the same type, but\
    \ the array size is not part of that type. The following code constructs a “triangular”\
    \ array of arrays, in which each sub-array is larger than the one preceding it:\n\
    \n```\nint[] triangle = new int[10];\n```\n\n```\nfor (int i = 0; i < triangle.length;\
    \ i++) {\n```\n\n```\ntriangle[i] = new int[i + 1];\n```\n\n```\n}\n```\n\n###\
    \ 3.2.3 Strings\n\nA ***string literal*** is a sequence of zero or more characters\
    \ enclosed in quotation (double quote) marks. For example:\n\n```\n\"\" // an\
    \ empty string\n```\n\n```\n\"hello\" // a string containing five characters\n\
    ```\n\nSome characters cannot be entered directly in a character or string constant;\
    \ for example, double quotes within a string. These characters can be included\
    \ by ***escaping*** them (putting a backslash in front of them):\n\n```\n\"He\
    \ said, \\\"Don't go.\\\"\"\n```\n\nThe important ***escape sequences*** are:\n\
    \n*   \\n is a “newline” character, however that is encoded on your computer system\
    \ (it is different on Windows than on Unix and Macintosh).\n\n*   \\t is a tab\
    \ character, representing an arbitrary amount of white space.\n\n*   \\\" is a\
    \ double quote character (useful inside doubly-quoted strings).\n\n*   \\\" is\
    \ a single quote character.\n\n*   \\\\ is a backslash character.\n\n*   \\u***xxxx***\
    \ is a Unicode character written as exactly four hex digits.\n\nIn addition, there\
    \ are the seldom-used \\b for backspace, \\r for carriage return, and \\f for\
    \ form feed.\n\nAlthough escape sequences have to be typed using two or more characters,\
    \ each one counts as a single character, so \"\\\"Who?\\\"\".length() is 6.\n\n\
    > **Note:** Arrays have a length *field*, ***array***.length, but Strings have\
    \ a length *method*, ***string***.length().\n\nStrings literals are values, and\
    \ can be saved in String variables:\n\n```\nString name = \"We're doing Java\"\
    ;\n```\n\nStrings can be ***concatenated***, or “pasted together,” with the +\
    \ operator:\n\n```\nString fullName = firstName + \" \" + lastName;\n```\n\nA\
    \ value of any type, when concatenated (“added”) to a string, is automatically\
    \ converted to a string.\n\n```\nString message = \"There are\" + count + \"errors.\"\
    ;\n```\n\nStrings are ***immutable***, that is, you cannot change the length or\
    \ the characters in a string; you can only create a new string.\n\n### 3.2.4 Exceptions\n\
    \nLots of things can go wrong in a program: dividing by zero, going outside the\
    \ bounds of an array, reading a file that isn’t there. When one of these things\
    \ happens, Java creates a type of object called an Exception. There are many different\
    \ subtypes of Exception, for example, ArithmeticException and the all-too-common\
    \ NullPointerException.\n\n*Exceptions are objects*, just like strings and arrays\
    \ are objects, and there are two general kinds: ***checked*** and ***unchecked***.\n\
    \nA checked exception is one that your program is required to deal with. For example,\
    \ if you try to read a file, Java knows that there are a lot of things that could\
    \ go wrong, and requires you to have code to handle it if they do. The usual way\
    \ to handle it is with a try-catch-finally statement (see [section 3.3.2.5](#ch03.xhtml_sec3_003_002_005)).\
    \ Basically, this statement says: “I’m going to *try* to do this, but if it doesn’t\
    \ work I will *catch* the exception and do something appropriate.”\n\nAn unchecked\
    \ exception is one that might happen, but you aren’t required to check for it.\
    \ These exceptions almost always result from bugs in your program, such as going\
    \ outside the bounds of an array, or trying to use a null object. The solution\
    \ is to debug the program.\n\n### 3.2.5 Operators and Precedence\n\nJava has the\
    \ usual arithmetic operators, with the usual ***precedence*** (multiplications\
    \ before additions, etc.). Operators with the highest precedence are done first\
    \ and, with some exceptions, most operators are ***left associative***—that is,\
    \ operators with equal priority are done left to right. For example, 12 − 2 −\
    \ 3 * 4 == 10 − 12 == −2.\n\nThe most common operators, from highest to lowest\
    \ precedence, are:\n\n*   Method calls and array indexing\n\n*   Arithmetic operations:\n\
    \n    1.  unary + and unary -\n\n    2.  * (multiplication), / (division), and\
    \ % (remainder, or modulus)\n\n    3.  + (addition) and - (subtraction)\n\n* \
    \  Boolean (logical) operators:\n\n    1.  ! (not)\n\n    2.  && (and)\n\n   \
    \ 3.  || (or)\n\n*   Inequality tests:\n\n    1.  < <= >= > (less than, less or\
    \ equal, greater or equal, greater than)\n\n*   Equality tests:\n\n    1.  ==\
    \ (equal to) and != (not equal to)\n\n*   Assignment operators:\n\n    1.  = (simple\
    \ assignment)\n\n    2.  +=, -=, *=, /=, and %= (x ***op***= y is short for x\
    \ = x ***op*** y)."
