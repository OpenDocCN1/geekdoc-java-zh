    ## 3.4 Classes and Objects


    A Java program consists of some number of ***objects*** interacting with one another,
    yet all executable code is in ***classes***. So, what is the relationship between
    classes and objects?


    Simply, each class defines a type, and objects are values of that type. Here is
    an analogy: A *class* is like a recipe, while *objects* are the things you can
    make by following the recipe. Once you have the recipe (class), you can make many
    things (objects) from it. Almost everything in a class is devoted to describing
    what is in the object, and what it can do.


    A class contains fields, constructors, and methods.


    *   The ***fields*** (or ***instance variables***) are the data belonging to the
    object.


    *   The ***constructors*** create new objects of that type. To call a constructor,
    use the keyword new.


    *   The ***methods*** are code to manipulate that data.


    The purpose of a constructor is to make a new object in a valid state. It does
    this by accepting values (as parameters) and saving those values in the instance
    variables, and typically little else. It might do some limited computation to
    get the object set up properly, but that''s all. Any future manipulation of the
    object will be done by the methods.


    ### 3.4.1 Some Useful Objects


    Every Java program must have at least one class, and that class must have a public
    static void main(String[] args) method, which is where the program begins execution.
    Before we get into writing any additional classes (what I refer to as the “outer
    language” of Java), this section will introduce several useful predefined classes.


    Java provides a large number of packages, containing a very large number of already
    written and tested classes. This is great, because it means a lot of good code
    is ready for your use; but it also means you need to learn your way around those
    packages. This book will help with that. For starters, there are two main packages
    you need to know about:


    *   java.lang contains the most fundamental classes, and is automatically imported
    into any program you write.


    *   java.util contains most of the data structures you will need.


    #### 3.4.1.1 String Objects


    A ***string*** is a sequence of zero or more characters. Instead of calling a
    constructor, as is done with most objects, a string is created by putting characters
    inside double quote marks. Other than that, a string is an ordinary object. The
    data are the characters in the string, and there are a few dozen methods for working
    with that string.


    For example, suppose you have


    ```

    String language = "Java";

    ```


    You can get the length of this string by using the length() method:


    ```

    int numChars = language.length();

    ```


    To send a message to an object: **Name** the object, put a **dot**, then say what
    **method** you want the object to execute, and what **arguments** (if any) the
    method needs.


    I find the formal terminology awkward, so I like to say we “talk” to an object.
    We “tell” it something, or “ask” it something. In the above, we said, “Hey, language,
    what is your length?” Similarly, language.charAt(0) says, “Hey, language, what
    is your first character?” and language.toUpperCase() says, “Hey, language, give
    me an all caps version of yourself.”


    Unlike many objects, strings are ***immutable***—they cannot be altered. Methods
    like toUpperCase never change the original string; they always return a new String
    object.


    #### 3.4.1.2 StringBuilder Objects


    A more typical object is the StringBuilder. Strings are immutable, so if you make
    thousands of modifications to a string, you are actually creating thousands of
    new strings. This can be expensive. It is more efficient to use a ***mutable***
    (modifiable) StringBuilder object.


    To create a new StringBuilder object (or any other kind of object), use the keyword
    new, the name of the class, and any required arguments. Like this:


    ```

    StringBuilder builder = new StringBuilder("Java");

    ```


    StringBuilder has lots of methods for changing the string data, all of which use
    the standard dot notation. For example, to add text to the end, you can say


    ```

    builder.append("Script");

    ```


    Here are a few of the many methods you can use:


    *   charAt(***index***) — returns the char at the specified ***index***.


    *   insert(***index***, ***string***) — puts the ***string*** into the StringBuffer
    starting at the ***index***.


    *   replace(***start***, ***end***, ***string***) — replaces the characters from
    ***start*** to ***end***-1 with ***string***.


    *   delete(***start***, ***end***) — deletes the characters from ***start*** up
    to, but not including, ***end***.


    When you are finished, you can ask the StringBuilder object to return a String
    version of itself.


    ```

    language = builder.toString(); // now "JavaScript"

    ```


    Almost all provided classes and objects keep their data private, and the only
    way to access their data is by using the methods they provide. When they do make
    data available it is usually as a constant, for example Math.PI and Math.E in
    the Math class. This is good practice in general.


    #### 3.4.1.3 Using Scanner


    Since it is fairly simple to produce output that the user sees, using the methods
    print and println, you might think it is easy to get input from the user. It isn’t.


    To read input from the user, first import the Scanner class.


    ```

    import java.util.Scanner;

    ```


    (Remember that imports go before the class declaration). Next, define an object
    of this type:


    ```

    Scanner scanner = new Scanner(System.in);

    ```


    The System.in argument says the scanner is to take input from the keyboard. (The
    argument could also be a file, or even a string, which is nice for testing purposes.
    We don’t explore those options here.)


    A scanner can read in either “tokens” or lines. A ***token*** is any sequence
    of characters bounded by ***whitespace*** (spaces, tabs, newlines), while lines
    are bounded by newline characters.


    To read in tokens, a scanner has the methods next() (reads a token as a string),
    nextInt(), nextDouble(), and nextBoolean(). It also has methods for a number of
    other types, not including char. An InputMismatchException will result if the
    user enters a value of the wrong type.


    One way to avoid errors is to check the type of the next token by “looking ahead”
    at it, with the methods hasNextInt(), hasNextDouble(), hasNextBoolean(), or just
    hasNext(). Or, calls to the scanner can be made inside a try-catch statement.


    The method nextLine() will read in, as a string, the next line.


    > **Caution:** Tokens are delimited by whitespace, while lines are delimited by
    newlines; but newlines are a kind of whitespace. If a token is read at the end
    of a line, a following nextLine() will return an empty string.


    You seldom need more than one Scanner. If you want to make use of a scanner in
    several different classes or packages, use a public static variable to hold the
    Scanner object, and put it in an accessible class.


    Scanners should be closed after use: scanner.close().'
