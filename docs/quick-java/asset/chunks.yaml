- fmt: "\nA method is like a function, except that a method belongs to an object,\
    \ and (normally) works with the fields of that object. A method may contain `declarations`\
    \ of variables and will contain executable statements.\n\nTo summarize, here is\
    \ how a project is organized:\n\n*   packages (directories) of files\n    *  \
    \ classes (generally one per file); each class contains:\n        *   fields (the\
    \ data)\n        *   constructors, containing declarations and statements\n  \
    \      *   methods, containing declarations and statements\n\nIn addition to the\
    \ above, packages in Java 9 and later can be organized into even larger units,\
    \ called `modules`. This is appropriate for programs with large numbers of packages.\
    \ The JDK (Java Development Kit) is huge, consisting of about a hundred modules,\
    \ hundreds of packages, and thousands of classes. The single module relevant to\
    \ this book is `java.base`.\n\nModules will be discussed briefly in [section 5.3.9](#ch05.xhtml_sec5_003_009).\n\
    \n## 1.2 First Glimpse: The Circle Class\n\nThe following program demonstrates\
    \ the overall structure of a Java program and provides an initial glimpse into\
    \ what a Java program looks like.\n\n```\npackage examples.shapes;\n\npublic class\
    \ Circle {\nprivate int radius;\n\npublic Circle(int r) {\n    radius = r;\n}\n\
    \npublic double area() {\n    return Math.PI * Math.pow(radius, 2);\n}\n\n}\n\
    ```\n\nThe package declaration says that this code is in a folder (directory)\
    \ named `shapes` which is in a folder (directory) named `examples`. If any import\
    \ declarations were needed (none are), they would immediately follow this line.\n\
    \nThe code defines a public class named `Circle`. The word `public` means that\
    \ the class can be used by any code throughout the program. Because `Circle` is\
    \ a public class, it must be on a file named `Circle.java`; this allows other\
    \ code to find it.\n\nThe `Circle` class has one integer `instance variable` named\
    \ `radius`. Every new `Circle` object that is created will have its own `radius`,\
    \ and because `radius` is marked `private`, it cannot be seen outside this class.\n\
    \nNext is a constructor. It is recognizable as a constructor because it has the\
    \ exact same name (`Circle`) as the class in which it occurs. It takes an integer\
    \ parameter `r`, saves the value of `r` in its own instance variable `radius`,\
    \ and returns a newly created `Circle` object. It does not use a return statement.\n\
    \nFinally, there is a method `area` that takes no parameters. It computes and\
    \ returns the area of this circle.\n\nNow that we have a `Circle` class, let's\
    \ use it.\n\n```\npackage examples.shapes;\n\npublic class CircleApp {\n    public\
    \ static void main(String[] args) {\n        int size = 10;\n        Circle c\
    \ = new Circle(size);\n        double area = c.area();\n        System.out.printf(\n\
    \            \"The area of a circle \" +\n            \"with radius %d is %7.2f\"\
    ,\n            size, area);\n    }\n}\n```\n\nThis class, `CircleApp`, happens\
    \ to be in the same directory as the `Circle` class.\n\n`CircleApp` does not have\
    \ an explicit constructor (it has an implicit one, but ignore that for now). It\
    \ does have a `main` method, which is the starting point for the program. For\
    \ complex reasons, the `main` method is always defined as `public static void\
    \ main(String[] args)`—just memorize this for now; understanding will come later.\n\
    \nThe `main` method then:\n\n*   Declares a local variable `size` as an integer\
    \ and gives it a value of 10.\n*   Declares another local variable `c` of type\
    \ `Circle` and uses the keyword `new` to call the `Circle` constructor. It gets\
    \ back a newly created `Circle` object and assigns it to `c`.\n*   Asks `c` for\
    \ its area, and assigns the result to the `double` (floating point) variable `area`.\n\
    *   Prints the result:\n    The area of a circle with radius 10 is 314.16\n\n\
    ## 1.3 Data\n\nEvery data value in Java is either a `primitive` or an `object`.\
    \ There are eight kinds of primitives, most of them numeric types. Objects are\
    \ defined by `classes`, and each class defines a new type of object.\n\nThe four\
    \ most important types of primitive are: `int` (integers, or whole numbers), `double`\
    \ (numbers containing a decimal point), `boolean` (the values true and false),\
    \ and `char` (individual characters).\n\nTwo important types of object are `strings`\
    \ and `arrays`. Strings are objects defined by the `String` class, while arrays\
    \ are defined using a more traditional syntax (but they are still objects.)\n\n\
    An obvious distinction between primitives and objects is that primitives have\
    \ `operations`: `3 * n`, `big && round`, and so on, while objects have `methods`.\
    \ (Exception: the `+` operator can be used to `concatenate` (“add”) strings.)\n\
    \n> **Terminology:** You don’t “call” a method. Instead, you “send a message to\
    \ an object,” where the “message” consists of the method name and its parameters.\n\
    \nTo send a message to an object, use `dot notation` like this: `object.method(parameters)`.\
    \ For example, `firstName.charAt(0)`.\n\nLiteral strings are enclosed in double\
    \ quotes: \"Hello\". Character literals are written in single quotes: ’a’.\n\n\
    All variables must be `declared` before use; this specifies their type. They can\
    \ also be `defined`, or given an initial value.\n\n```\nint count; // declaration\n\
    count = 0; // definition\nint count = 0; // declaration + definition\n```\n\n\
    All the values in an array must be of the same type. The type of the array is\
    \ written as the type of the elements, followed by empty brackets. For example,\
    \ `int[]` denotes an array of integers. The length of an array is not part of\
    \ the declaration; it is part of a definition.\n\n```\nint[] numbers = new int[100];\n\
    ```\n\nArrays are `zero-based`. The first element in the above `numbers` array\
    \ is `numbers[0]`, and the last element is `numbers[99]`. The length of this array,\
    \ 100, is given by `numbers.length`.\n\nThe values in a newly-declared array will\
    \ all be zero (for numeric arrays), `false` (for boolean arrays), or `null` (for\
    \ arrays of objects). Because characters are treated as numeric values, the values\
    \ in an array of `char` will be the character \"NUL\" whose code is zero.\n\n\
    ## 1.4 Operators\n\nJava has the usual arithmetic operators: `+` (add), `` (subtract,\
    \ or unary minus), `*` (multiply), `/` (divide), and `%` (remainder, or modulus).\
    \ The multiplicative operators `*`, `/`, and `%` are done before the additive\
    \ operators `+` and ``. Operations of the same precedence are done left right.\n\
    \nThere is no exponentiation operator. Exponentiation is done by calling the `pow`\
    \ method in the `Math` module: `Math.pow(r, 2)`.\n\nArithmetic expressions using\
    \ only integers result in an integer result. If the expression involves a `double`,\
    \ the result will be a `double`.\n\nJava has the boolean operators `&&` (and),\
    \ `||` (or), and `!` (not). The comparison operators `<`, `<=`, `==` (equals),\
    \ `!=` (not equal), `>`, and `>=` all result in booleans. Booleans are not numbers,\
    \ and you cannot use a number where a boolean is expected.\n\nSee [section 3.2.5](#ch03.xhtml_sec3_002_005)\
    \ for more detailed information on operators.\n\n## 1.5 Program Structure\n\n\
    A Java program consists of one or more `classes`. Each class is typically in a\
    \ file of its own, named after the class but with.java extension. If a class is\
    \ named `Example`, it should be in a file named `Example.java`.\n\nA Java file\
    \ may contain a `package` declaration, which names the folder that the file is\
    \ in, and some `import` declarations, to give the current class access to classes\
    \ in other packages. (Classes in the same package don’t need to be explicitly\
    \ imported.) The code for the class follows these initial declarations.\n\n```\n\
    package teamMaker;\nimport java.util.HashSet;\n```\n\n> **Note:** An asterisk\
    \ (“star”) may be used to import all the classes in a package, for example, import\
    \ java.util.*;.\n\nA `class` is a recipe, or blueprint, for making objects. Classes\
    \ contain declarations, constructors, and methods.\n\n```\npublic class ClassName\
    \ {\n    declarations\n    constructors\n    methods\n}\n```\n"
