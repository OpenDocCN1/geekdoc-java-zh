- fmt: "\n> **Style rule:** When the user clicks an active widget, it should be obvious\
    \ that some action has occurred. This can be fairly subtle; for example, many\
    \ editors display an asterisk next to the file name when a file is modified, and\
    \ remove the asterisk when the file is saved.\n\nA `tooltip` is a small text message\
    \ that pops up when the user hovers over a component, usually to give a little\
    \ more information about the purpose of the component. Tooltips can be added to\
    \ almost any component.\n\n```\nwidget.setToolTipText(\"Purpose of widget\");\n\
    ```\n\n## 9.7 Add Listeners\n\nOnce a GUI program is started up, it typically\
    \ does nothing more until an `event` occurs. If there is a `listener` for that\
    \ event, the listener executes some block of code to completion, then nothing\
    \ more happens until the next event occurs.\n\nMany events are handled “automatically,”\
    \ by built-in listeners. If you type a character while the focus is on a text\
    \ field, somewhere under the hood there is a listener that responds to the event\
    \ by drawing that character in the text field. If you click a button, the button\
    \ “depresses” (changes appearance) as the result of some built-in listener. However,\
    \ all these built-in listeners do is change the appearance of the text field or\
    \ button. To have the button do something useful, you must add a listener to it\
    \ that will execute some code when the button is clicked.\n\nGenerally speaking,\
    \ you shouldn’t add listeners to passive widgets like text fields or checkboxes.\
    \ Instead, just ask for their value when you need to know it.\n\nDifferent widget\
    \ types have different kinds of listeners. A `JButton` should have an `ActionListener`,\
    \ while a `JSlider` might have a `ChangeListener`.\n\nSome listeners, such as\
    \ `ActionListener`, are `functional interfaces`—they define exactly one abstract\
    \ method. For these listeners, you can simply supply a function, for example,\n\
    \n```\naddActionListener(event -> code)\n```\n\nOther listeners are not functional\
    \ interfaces, typically because they specify more than one method. For these,\
    \ you must define a class that implements all the methods, and provide an object\
    \ of that class—for example, see the implementation of `KeyListener` in [section\
    \ 9.8.16](#ch09.xhtml_sec9_008_016).\n\nYou can also write listeners for mouse\
    \ clicks, mouse movement, and key presses, but you don’t need to unless you are\
