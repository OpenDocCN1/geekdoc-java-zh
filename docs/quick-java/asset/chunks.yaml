    ```java\ntry (FileWriter fw = new FileWriter(\"/Users/dave/test2.txt\")) {\n \
    \   fw.write(\"Hello\\n\");\n    fw.write(\"Goodbye\");\n} catch (IOException\
    \ e) {}\n```\n\n上述代码段将在 `test2.txt` 文件不存在不存在时创建该文件，并将该文件的任何现有内容替换为 `Hello` 和 `Goodbye`\
    \ 这两行。若要向现有文本文件的末尾添加内容，请使用 `FileWriter` 的 `append(string)` 方法。\n\n## 3.4 类与对象\n\
    \n一个 Java 程序由数量相互作用的 `objects`（对象）组成，但所有可执行代码都在 `classes`（类）中。那么，类和对象之间是什么关系呢？\n\
    \n简单来说，每个类定义了一种类型，而对象是该类型的值。这里有一个类比：`class` 就像一个食谱，而 `objects` 是你按照食谱做出的东西。一旦你有了食谱（`class`），你就可以用它制作很多东西（`objects`）。类中的几乎所有内容都用于描述对象包含什么以及它可以做什么。\n\
    \n类包含字段（fields）、构造函数（constructors）和方法（methods）。\n\n*   `fields`或实例变量）是属于对象的数据。\n\
    *   `constructors`（构造函数）创建该类型的新对象。要调用构造函数，请使用 `new` 关键字。\n*   `methods`（方法）是操纵这些数据的代码。\n\
    \n构造函数的目的是创建一个处于有效状态的新对象。它通过接受值（作为参数）并将这些值保存在实例变量中来实现，并且通常不做其他操作。它可能会进行一些有限的计算以正确设置对象，但仅此而已。未来对该对象的任何操作都将通过方法完成。\n\
    \n### 3.4.1 一些常用的对象\n\n每个 Java 程序必须至少有一个类，且该类必须有一个 `public static void main(String[]\
    \ args)` 方法，这是程序开始执行的地方。在我们开始编写任何额外的类（我称之为 Java 的“外层语言”）之前，本节将介绍几个实用的预定义类。\n\n\
    Java 提供了大量的包（packages），其中包含了极大量已经编写并测试过的类。这太棒了，因为这意味着有很多优秀的代码准备好供你使用；但也意味着你需要学习如何熟悉这些包。本书将在这方面提供帮助。首先，你需要了解的两个主要的包：\n\
    \n*   `java.lang` 包含了最基础的类，并自动导入到你编写的任何程序中。\n*   `java.util` 包含了你所需的大多数数据结构。\n\
    \n#### 3.4.1.1 String 对象\n\n`string` 是一个零个或多个字符的序列。字符串不像大多数对象那样调用构造函数，而是通过在双引号内放入字符来创建的。除此之外，字符串是一个普通的对象。其数据是字符串中的字符，并且有几十种方法可以处理该字符串。\n\
    \n例如，假设你有\n\n\n\n```java\nString language = \"Java\";\n```\n\n你可以使用 `length()`\
    \ 方法获取此字符串的长度：\n\n```java\nint numChars = language.length();\n```\n\n向对象发送消息：**命名**对象，输入一个**点**（dot），然后说你想让对象执行什么种**方法**（method），以及该方法需要的**参数**（arguments，如果有的话）。\n\
    \n我觉得正式的术语很别扭，所以我喜欢说我们在与对象“交谈”。我们“告诉”它某些事，或者“问”它某些问题。在上面的例子中，我们说：“嘿，language，你的长度是多少？”同样，`language.charAt(0)`\
    \ 说：“嘿，language，你的第一个字符是什么？”而 `language.toUpperCase()` 说：“嘿，language，给我一个你的全大写版本。”\n\
    \n与许多对象不同，字符串是 `immutable`（不可变的）的——它们不能被更改。像 `toUpperCase()` 这样的方法永远不会改变原始字符串；它们总是返回一个新的\
    \ `String` 对象。\n\n#### 3.4.1.2 StringBuilder 对象\n\n一种更典型的对象是 `StringBuilder`。字符串是不可变的，所以如果你对字符串进行了数千次修改，你实际上是创建了数千个新字符串。这可能是昂贵的。使用一个可变的（`mutable`，可修改）`StringBuilder`\
    \ 对象更高效。\n\n要创建一个新的 `StringBuilder` 对象（或任何其他类型的对象），请使用关键字 `new`、类名以及任何所需的参数。如下：\n\
    \n```java\nStringBuilder builder = new StringBuilder(\"Java\");\n```\n\n`StringBuilder`\
    \ 有许多方法来更改字符串数据，所有这些方法都使用标准的点表示法。例如，要在末尾添加文本，你可以说\n\n```java\nbuilder.append(\"\
    Script\");\n```\n\n以下你可以使用的许多方法中的几个：\n\n*   `charAt(index)` — 返回指定 `index` 处的\
    \ `char`。\n*   `insert(index, string)` — 从 `index` 开始将 `string` 放入 `StringBuffer`\
    \ 中。\n*   `replace(start, end, string)` — 将从 `start` 到 `end-1` 的字符替换为 `string`。\n\
    *   `delete(start, end)` — 删除从 `start` 到不包括 `end` 的字符。\n\n当你完成时，可以要求 `StringBuilder`\
    \ 返回它的字符串版本。\n\n```java\nlanguage = builder.toString(); // 现在是 \"JavaScript\"\n\
    ```\n\n"
- fmt: "\nAs with most of the classes described in this book, the `Scanner` class\
    \ has many more methods than are mentioned here. For example, a scanner may use\
    \ regular expressions to tell it what to read.\n\n### 3.4.1.4 Console\n\nThe class\
    \ `java.io.Console` provides a much simpler way to read input from the user than\
    \ the `Scanner` class, but it has a significant disadvantage: It requires the\
    \ presence of an interactive “console.” Depending on how the Java program is being\
    \ executed, a console may or may not be present. In many cases, `Console` can\
    \ be used when running from the command line, but not when running from an IDE.\n\
    \nThe constructor call `new Console()` will return `null` if no console is available.\
    \ Otherwise, here are some of the operations available on the new console:\n\n\
    *   `readLine()` returns one line, as a string.\n*   `readLine(formatString, value,\
    \ … , value)` formats and displays a string to be used as a prompt, then reads\
    \ and returns one line.\n    *   `Format strings` are described in [section 5.2.2.10](#ch05.xhtml_sec5_002_002_010).\
    \ A plain string, with no interpolated `values`, can also be used.\n*   `readPassword()`\
    \ returns one line in a character array (that is, a `char[]`), without displaying\
    \ what is typed.\n*   `readPassword(formatString, value, … , value)` formats and\
    \ displays a string to be used as a prompt, then reads and returns one undisplayed\
    \ line in a character array. A plain string can also be used.\n*   `printf(formatString,\
    \ value, …, *value)` formats and displays a string.\n*   `writer()` returns a\
    \ `PrintWriter` associated with this console.\n    *   A `Console` object does\
    \ not itself have `print` and `println` methods, but these messages can be sent\
    \ to the `PrintWriter` returned by `writer()`.\n\n### 3.4.1.5 Objects, Generics,\
    \ and Stacks\n\nThe most general type of object is `Object`. If you declare an\
    \ array of `Object`, you can put any kind of object into it—strings, stacks, threads,\
    \ whatever. Or you can be more specific, and declare an array of (for example)\
    \ `String`, and the array can then hold only strings.\n\nAlong with arrays, Java\
    \ has various types of Collections: `Stacks`, `Lists`, `HashMaps`, and so on.\
    \ Originally, *any* type of object could be pushed onto a `Collection`, and there\
    \ was no way to be more specific. When you got a value out of the collection,\
    \ you got an `Object`, and had to `cast` it to the correct type. For backwards\
    \ compatibility, this style is still allowed.\n\nFor example, Java has a `Stack`\
    \ type (in the `java.util` package), with operations `push` and `pop` (among others).\n\
    \n```\nStack stuff = new Stack();\n```\n\n```\nstuff.push(\"abracadabra\");\n\
    ```\n\n```\nstuff.push(new File(\"abc.txt\"));\n```\n\n```\nFile foo = (File)stuff.pop();\n\
    ```\n\n```\nString spell = (String)stuff.pop();\n```\n\nIn modern code, it is\
    \ preferable to be specific as to what type of values may be put into a stack.\
    \ This is done by using `type parameters`, or `generics`. The type parameter is\
    \ put into angle brackets after the object type.\n\n```\nStack<String> words =\
    \ new Stack<String>();\n```\n\n```\nwords.push(\"abracadabra\");\n```\n\n```\n\
    words.push(new File(\"abc.txt\")); // not legal\n```\n\nTo minimize redundancy,\
    \ the type parameter in the definition (that is, after the word `new`) can be\
    \ an empty “diamond,” `<>`.\n\n```\nStack<String> words = new Stack<>();\n```\n\
    \n> **Note:** In the version of Java I am using, apparently even the “diamond”\
    \ can be omitted, but this is not an announced feature of Java.\n\nAs an added\
    \ bonus, when you retrieve an object from a genericized collection, you no longer\
    \ have to cast it to the correct type.\n\n```\nString word = words.pop();\n```\n\
    \nThe genericized type name can be used wherever an “ordinary” type name can be\
    \ used, such as in the declaration of a method. For example,\n\n```\nint find(String\
    \ target,\n```\n\n```\nStack<String> words) { … }\n```\n\n### 3.4.1.6 Maps\n\n\
    One of the most useful objects in the `java.util` package is the `HashMap`.\n\n\
    A `map` is a lookup table, or dictionary; it associates `keys` with `values`.\
    \ For a contact list, the key might be a person's name, and the value that person's\
    \ phone number.\n\n```\nHashMap<String, Integer> phones = new HashMap<>();\n```\n\
    \n```\nphones.put(\"Joan\", 555_1212);\n```\n\n> **Note:** The above works because,\
    \ although a primitive cannot be used where an object is required, Java will “wrap”\
    \ the `int` value `555_1212` into an `Integer` object.\n\nA `HashMap` is a particular\
    \ kind of `Map` which supports extremely fast lookups. Any object types can be\
    \ used as keys.\n\n> **Note:** If the `keys` are user-defined objects which have\
    \ a user-defined `equals` method, then those objects *must* also have a user-defined\
    \ `hashCode` method that gives equal hash codes for equal objects.\n\nA few of\
    \ the important operations on a `HashMap` are:\n\n*   `map.put(key, value)` —\
    \ adds the `key/value` pair to the `map`, possibly replacing a previous `value`.\n\
    *   `map.putIfAbsent(key, value)` — adds the `key/value` pair to the `map`, unless\
    \ the `key` is already in it.\n*   `map.get(key)` — returns the value associated\
    \ with the `key`, or `null` if the `key` isn’t in the `map`.\n*   `map.getOrDefault(key,\
    \ defaultValue)` — returns the value associated with the `key`, or `defaultValue`\
    \ if the `key` isn’t in the `map`.\n*   `map.size()` — returns the number of key/value\
    \ pairs in the `map`.\n*   `map.clear()` — removes all from the `map`.\n*   `map.remove(key)`\
    \ — deletes the `key` and its associated value from the `map`.\n*   `map.keySet()`\
    \ — returns a `Set` “view” of all the keys in `map`.\n\n> **Note:** A *view* is\
    \ like a “window” into the object, and changes as the object changes. In the above,\
    \ the `Set` returned by `keySet()` can be used just like an “ordinary” set, except\
    \ that changing the contents of `map` will change the values.\n\n### 3.4.1.7 The\
    \ Java API\n\nThe Java *API* (*Application Programmer Interface*) is a huge resource\
    \ consisting of seven thousand classes, organized into two hundred packages. It\
    \ is important to be able to find your way around this resource and make use of\
    \ it.\n\nTo find the documentation, search online for “java se 17 api” or similar.\
    \ One of the top hits should be something like “[Overview (Java SE 17 & JDK 17)](https://docs.oracle.com/en/java/javase/17/api/).”\
    \ (If you are programming for Android or similar, you will want the Java SE 8\
    \ documentation instead.) Following that link should take you to a page with a\
    \ long list of modules; click on the one for [java.base](https://docs.oracle.com/en/java/javase/17/docs/api/java.base/module-summary.html).\
    \ Bookmark this page; it is a good starting point. If you are interested in GUI\
    \ development, also bookmark the link to [java.desktop](https://docs.oracle.com/en/java/javase/17/docs/api/java.desktop/module-summary.html).\n\
    \nOne of the packages on the [java.base](https://docs.oracle.com/en/java/javase/17/docs/api/java.base/module-summary.html)\
    \ page, very near the top of the list, is [java.lang](https://docs.oracle.com/en/java/javase/17/docs/api/java.base/java/lang/package-summary.html).\
    \ This package is necessary for every Java program and is automatically imported\
    \ into every Java program. Click on [java.lang](https://docs.oracle.com/en/java/javase/17/docs/api/java.base/java/lang/package-summary.html)\
    \ to go to a page listing all the classes in this package.\n"
