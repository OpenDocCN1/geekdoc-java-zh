    \nA `Graphical User Interface`, or `GUI` (pronounced “gooey”), provides interaction\
    \ with the user beyond simple text entry and printing. GUIs provide familiar buttons,\
    \ text fields, menu items, and so on, common to almost all user-facing programs.\n\
    \n## 8.1 A Brief History\n\nGUIs have been available from the very first Java\
    \ implementation. The original GUI toolkit was the `AWT`, the `Abstract Window\
    \ Toolkit`, which was platform-specific and quite primitive.\n\nLater came `Swing`,\
    \ a much better, platform-independent toolkit. It was built “on top of” `AWT`,\
    \ and many of the `AWT` packages are still needed in `Swing` applications.\n\n\
    A third toolkit, `JavaFX`, was released in 2008. It was originally intended to\
    \ replace `Swing`. While it is still available as part of the `OpenJFX` project,\
    \ it has been dropped from the standard releases of Java. For this reason, our\
    \ description of GUI programming uses `Swing`.\n\n## 8.2 Dialogs\n\nA `dialog`\
    \ is used to get a simple response from the user. Dialogs can be used without\
    \ having to create a full-fledged GUI. To determine the location of the dialog\
    \ on the screen, a `parent` component must be specified; if it is null, the dialog\
    \ will be centered on the screen.\n\nThere are four kinds of `JOptionPane` dialogs:\
    \ Confirm, Input, Message, and Option. Additional dialog types are provided for\
    \ choosing a color (`import java.awt.Color`), or for loading or saving a file\
    \ (various classes from `java.io`). You can also create your own custom dialog.\n\
    \nAll provided dialogs are `modal`, that is, the user must respond to them before\
    \ anything else can be done in the application. Custom dialogs may be modal or\
    \ nonmetal.\n\n### 8.2.1 Message Dialog\n\nA `message dialog` is a modal dialog\
    \ with a single OK button.\n\nTo display a `JOptionPane` message dialog, import\
    \ `javax.swing.JOptionPane` and do the following:\n\n```java\nJOptionPane.showMessageDialog(parent,\
    \ \"This is a message dialog.\");\n```\n\n### 8.2.2 Confirm Dialog\n\nA `confirm\
    \ dialog` is a modal dialog with Cancel, No, and Yes buttons. The return result\
    \ will be an integer equal to one of `YES_OPTION`, `NO_OPTION`, or `CANCEL_OPTION`.\n\
    \nTo display a `JOptionPane` confirm dialog, import `javax.swing.JOptionPane`\
    \ and do the following:\n\n```java\nint yesNo = JOptionPane.showConfirmDialog(parent,\
    \ \"Do you really want to do that?\");\nif (yesNo == JOptionPane.YES_OPTION) {\n\
    \    System.out.println(\"Action confirmed\");\n}\n```\n\n### 8.2.3 Input Dialog\n\
    \nAn `input dialog` is a modal dialog that provides a place for the user to enter\
    \ a single line of text and has Cancel and OK buttons.\n\nTo display a `JOptionPane`\
    \ input dialog, import `javax.swing.JOptionPane` and do the following:\n\n```java\n\
    String userName = JOptionPane.showInputDialog(parent, \"What is your name?\");\n\
    ```\n\n### 8.2.4 Option Dialog\n\nAn `option dialog` is a modal dialog that displays\
    \ a number of buttons, each labeled with a string taken from an array of strings.\
    \ Clicking on a button returns an index into that array.\n\nTo display a `JOptionPane`\
    \ option dialog, import `javax.swing.JOptionPane` and do the following:\n\n```java\n\
    Object[] options = new String[] { \"Java\", \"Python\", \"C++\" };\nint option\
    \ = JOptionPane.showOptionDialog(\n    parent,\n    \"Choose an option:\", //\
    \ message\n    \"Option Dialog\", // title\n    JOptionPane.YES_NO_OPTION, //\
    \ option type\n    JOptionPane.QUESTION_MESSAGE, // message type\n    null, //\
    \ icon\n    options, // array of strings or components\n    options[0]); // initial\
    \ selection\n);\n```\n\nThe option type may be one of `DEFAULT_OPTION`, `YES_NO_OPTION`,\
    \ `YES_NO_CANCEL_OPTION`, or `OK_CANCEL_OPTION`. The message type may be one of\
    \ `ERROR_MESSAGE`, `INFORMATION_MESSAGE`, `WARNING_MESSAGE`, `QUESTION_MESSAGE`,\
    \ or `PLAIN_MESSAGE`.\n\nIf the user just closes the dialog, the integer `JOptionPane.CLOSED_OPTION`\
    \ is returned.\n\n### 8.2.5 Color Chooser Dialog\n\nTo declare and use a `JColorChooser`,\
    \ import `java.awt.Color` and `javax.swing.JColorChooser` and do the following:\n\
    \n```java\nJColorChooser colorChooser = new JColorChooser();\nColor chosenColor\
    \ = colorChooser.showDialog(parent, \"Choose a color:\", Color.WHITE);\n```\n\n\
    ### 8.2.6 Load File Dialog\n\nA `file chooser` is a dialog that can be used to\
    \ navigate to a particular file, either to read from it or to write to it. This\
    \ section shows example code for reading from a text file.\n\nNecessary imports:\
    \ `javax.swing.JFileChooser`, `java.io.File`, `java.io.BufferedReader`, `java.io.FileReader`,\
