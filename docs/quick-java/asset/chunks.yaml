    \ contains a `public static void main` method, so this is where the program will\
    \ begin execution.\n\nThe next lines declare variables `c1` and `c2` of type `Counter`,\
    \ create new `Counter` objects with different initial values, and assign them\
    \ to the variables.\n\nThe following lines use `dot notation` to send several\
    \ `bump` messages, with different parameters, to the `c1` and `c2` objects.\n\n\
    Finally, the result will be:\n\n### 4.2 Inheritance\n\nClasses form a treelike\
    \ hierarchy, with `Object` at the root. Every class, except `Object`, has one\
    \ superclass. The keyword `extends` denotes the superclass. If you don’t specify\
    \ a superclass, `Object` is assumed.\n\n```java\nclass Person {\n}\n```\n\n```java\n\
    class Customer extends Person {\n}\n```\n\nWhen you define a class, it inherits\
    \ all the fields and methods available to its superclasses. For example, if you\
    \ have a `Person` class that has a `name` field, then `Customer` also has a name\
    \ field. If `Person` has a `visit` method, then `Customer` also has a `visit`\
    \ method. Inherited methods can be `overridden` (replaced) by declaring a method\
