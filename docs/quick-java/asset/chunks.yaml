    ## 10.6 The Bouncing Ball


    Animation is performed by displaying a series of still images, one after the other,
    with minor changes between each image and the next. A bouncing ball is the “Hello
    world” of animation—a small disk that moves steadily across a window, and “bounces”
    (changes direction) when it encounters an edge of the window. Our version (see
    [Figure 10.2](#ch10.xhtml_fig10_2)) will have two buttons, **Run** to start the
    animation and **Stop** to pause it.


    ![](images/fig10_2.jpg)


    [Figure 10.2 The Bouncing Ball example.](#ch10.xhtml_Ffig10_2)


    Our implementation uses the MVC model, with the unimaginatively named classes
    Model, View, and Controller. The controller sets up the GUI and creates objects
    of the other two types; the model controls the position of the ball; and the view
    displays the ball in the window.


    The model is treated as a “bean” (although it does not have all the characteristics
    of a bean), and PropertyChangeEvents are used to keep the model as independent
    as possible from the rest of the code.


    In the following we mention only the main points of the Bouncing Ball program;
    the complete code is in an appendix.


    ### 10.6.1 MVC


    ***MVC***, or ***Model-View-Controller*** is a useful design pattern when one
    thread is used to control another thread, such as when doing animation.


    > **Terminology:** A ***design pattern*** is simply a way of organizing code that
    has been found to be generally useful. MVC is considered here in order to introduce
    some useful objects and interfaces.


    The ***model*** is the code doing the actual work of the simulation, animation,
    or whatever. It should be free of any input/output, and completely independent
    of both the view and the controller. If there is a GUI, it should be completely
    unknown to the model.


    The ***view*** displays information about what is going on in the model. In the
    case of an animation, it displays the current frame of the animation.


    The ***controller*** is used to send commands or information to the model.


    The model, view, and controller can be implemented as three separate classes,
    but in small GUI programs, it is often convenient to combine the controller and
    view into a single class.


    ### 10.6.2 Controller


    The controller''s main job is to set up the GUI, so it extends JFrame and adds
    **Run** and **Stop** buttons. It creates the model and the view. Since the view
    has to know about the model, but the model doesn’t have to know about the view,
    the model is created first.


