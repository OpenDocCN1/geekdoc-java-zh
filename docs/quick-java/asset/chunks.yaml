    ### 5.2.2.9 Multiline Strings


    A text block, also known as a multiline string, is a special syntax for writing.
    Here is an example:


    ```

    String textBlock = """

    First line

    Middle line

    Last line""";

    System.out.println(textBlock);

    ```


    This will print:

    ```

    First line

    Middle line

    Last line

    ```


    ### 5.2.2.10 Formatter


    Sometimes you want more control than `System.out.print` and `System.out.println`
    give. The `java.util.Formatter` class gives you this. The basic use is:


    ```java

    Formatter f = new Formatter();

    f.format("The value of %s is %7.4f", "pi", Math.PI);

    f.format(" and %s is %6.4f.", "e", Math.E);

    System.out.println(f);

    f.close();

    ```


    This will output:

    ```

    The value of pi is 3.1416 and e is 2.7183.

    ```


    If you want to format and print a single string, the `printf` method will do that:


    ```java

    System.out.printf(formatString, value, … , value);

    ```


    A format specifier has the following syntax:


    `%[index$][flags width conversion]`


    The optional `index$` lets you choose which value (counting from 1, not 0) to
    put in this place. The optional `width` is the number of character positions to
    use.

