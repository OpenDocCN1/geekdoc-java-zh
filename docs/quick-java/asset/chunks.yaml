    \nConstructors are not inherited.\n\n### 4.3 Casting Objects\n\nRecall that numeric\
    \ values can be `cast` (converted) from one type to another. An `int` value can\
    \ be put into a `double` variable with no trouble because a `double` is in some\
    \ sense “wider” than an `int`. But to put a `double` value into an `int` variable,\
    \ it must be explicitly cast to an `int` by putting `(int)` in front of the variable;\
    \ for example, `int pi = (int)Math.PI;`.\n\nSmartly, objects of one type can be\
    \ put into a variable of a different type if and only if one of the types is an\
    \ ancestor (superclass) of the other. `Upcasting` is casting to an ancestor type,\
    \ and can happen automatically; `downcasting` is casting to a descendant type,\
    \ and an explicit cast is required. For example, if `BirthdayCake` extends `Cake`\
    \ and `Cake` extends `Object`, then the following assignments are possible:\n\n\
