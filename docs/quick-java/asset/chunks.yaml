    # Author


    I’m **David Matuszek**, known to most of my students as “Dr. Dave.”


    I wrote my first program on punched cards in 1963 and immediately got hooked.


    I taught my first computer classes in 1970 as a graduate student in computer science
    at the University of Texas in Austin. I eventually got my PhD from there, and
    I’ve been teaching ever since. Admittedly, I spent over a dozen years in industry,
    but even then I taught as an adjunct at Villanova University.


    I finally escaped from industry and joined the Villanova faculty full-time for
    a few years, then I moved to the University of Pennsylvania, where I directed
    a Master''s in Computer and Information Technology (MCIT) program for students
    entering computer science from another discipline.


    Throughout my career, my main interests have been in artificial intelligence (AI)
    and programming languages. I’ve used a *lot* of programming languages.


    I retired in 2017, but I can’t stop teaching, so I’m writing a series of “quick
    start” books on programming and programming languages. I’ve also written three
    science fiction novels—*Ice Jockey*, *All True Value*, and *A Prophet in Paradise*—and
    I expect to write more. Check them out!


    And, hey, if you’re a former student of mine, drop me a note. I’d love to hear
    from you at [david.matuszek@gmail.com](mailto:david.matuszek@gmail.com).


    # Preface


    If you are an experienced programmer, this book is your guide to getting up to
    speed in Java in a hurry. Not just the language, but also the basics of unit testing,
    graphical user interfaces, threads, animation, and functional programming.


    If you are coming from one of the C languages, you will find most of the statement
    types familiar. These are clearly designated, so you can just skim over that material.


    If you are coming from C++, you will find the object-oriented concepts are very
    similar, but the terminology is different.


    If you are coming from another language, such as Python, there is very little
    you can skip. Sorry.


    Let’s get started!


    # Versions


    This book is about **Java 8** and **Java 17**. Why those two?


    Java 8 is the last version that is free for commercial use. If you are programming
    for Android, Java 8 (also known as version 1.8) is the last version you can use.
    For these reasons, additions to Java after version 8 will be noted as such.


    As this book is being written, the current version is 17\. A new version is released
    every six months, so when you buy this book, the latest version number is probably
    higher. This should not be a concern, because Java “never throws anything away.”
    Newer versions do not invalidate older versions, and the language changes gradually.
    In fact, Java 17 is an ***LTS*** (***Long Term Support***) version, along with
    versions 8 and 11.


    If you are uncertain which version of Java you have, you can execute this from
    the command line:


    > ```

    > java -version

    > ```


    or execute the following println statement from within a running Java program:


    > ```

    > System.out.println(System.getProperty("java.version"));

    > ```


    Since Java 9, you can also run jshell from the command line. This program lets
    you execute Java statements (such as the above print statement) one at a time.
    This is no way to write a program, but it’s handy for trying things out.


    If you have yet to download Java, it comes in two main varieties: the ***JRE***
    (***Java Runtime Environment***) is used to run existing programs, and the ***JDK***
    (***Java Development Kit***), which is used to create and run programs (the JDK
    contains the JRE). Since you are reading this book, you almost certainly want
    the JDK.


    You can get the Java SE (Standard Edition) JDK from [https://www.oracle.com/java/technologies/downloads/](https://www.oracle.com).


    Java 9 and beyond are (currently) free for personal use, but commercial users
    should obtain a license from the Oracle Corporation.


