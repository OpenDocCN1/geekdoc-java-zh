    ### 5.2.1.2 Javadoc


    > A ***documentation comment***, or ***doc comment***, is a comment that can be
    used by the javadoc program to produce professional-looking documentation. This
    is how the official Java documentation is produced.


    Doc comments should be written *for the benefit of the programmer who needs to
    use your code*. That programmer does not care *how* your code works, only that
    it *does* work. Implementation details should be put in internal comments; they
    do not belong here.


    If your `.java` files are in a folder named (say) `myProgram`, then you can simply
    execute `javadoc myProgram` from the command line. This will produce several HTML
    pages which you can view in any browser.


    A doc comment must begin with `/**`, end with `*/`, and be placed *directly before*
    a class, interface, field, constructor, or method declaration. It consists of
    a textual description and some optional ***tags***; which tags can be used depends
    on the kind of thing being documented. If the documented item is genericized,
    the type variables can be specified with tags.


    A doc comment for a **class** should provide general information about what kind
    of object it represents.


    A doc comment for an **interface** should tell what capabilities it provides.


    A doc comment for a **field** should describe the data held by the field. Most
    fields should be private; javadoc can be set to include or to ignore information
    about private fields and methods.


    A doc comment for a **constructor** should tell how its parameters are used.


    A doc comment for a **method** should tell the user what the method does and how
    to use it, not how it is implemented.


    Doc comments may contain javadoc tags. Here are the most common ones:


    *   @author ***Author name*** (for classes and interfaces)

    *   @version ***date or version number*** (for classes and interfaces)

    *   @param ***name purpose*** (for describing a parameter of a method or constructor;
    use one tag for each parameter)

    *   @param ***typeParameter purpose*** (for type parameters of genericized classes,
    methods, and constructors; use one tag for each type parameter)

    *   @return ***description*** (for methods, to tell what is expected of the result)

    *   @throws ***exceptionType description*** (for exceptions possibly thrown by
    methods or constructors; use one tag for each exception type)

    *   @exception is a synonym for @throws

    *   @deprecated ***text*** (should tell why this class or method should no longer
    be used, and should suggest an alternative)


    A good IDE can generate skeletal doc comments for you, so all you have to do is
    fill in the details.


