    # Chapter 8 GUIs and Dialogs


    DOI: [10.1201/9781003402947-8](https://doi.org/10.1201/9781003402947-8)


    A ***Graphical User Interface***, or ***GUI*** (pronounced “gooey”), provides
    interaction with the user beyond simple text entry and printing. GUIs provide
    familiar buttons, text fields, menu items, and so on, common to almost all user-facing
    programs.


    ## 8.1 A Brief History


    GUIs have been available from the very first Java implementation. The original
    GUI toolkit was the ***AWT***, the ***Abstract Window Toolkit***, which was platform-specific
    and quite primitive.


    Later came ***Swing***, a much better, platform-independent toolkit. It was built
    “on top of” AWT, and many of the AWT packages are still needed in Swing applications.


    A third toolkit, ***JavaFX***, was released in 2008\. It was originally intended
    to replace Swing. While it is still available as part of the OpenJFX project,
    it has been dropped from the standard releases of Java. For this reason, our description
    of GUI programming uses Swing.


