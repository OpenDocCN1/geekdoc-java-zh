    in the original version of Java; they are later additions.


    ## 5.1 Information Hiding


    ***Information hiding***—providing each section of code access to only the information
    it needs to know—is important in programming.


    Information is not hidden for any nefarious reason; it is done to limit the amount
    of information a human has to deal with. Think of driving a car: It would be much
    more difficult if you had to pay attention to the details of timing, gear ratios,
    suspension, and so on. Instead, you are given easy access to only the information
    you need to drive.


    Information hiding also reduces dependencies among code. If the internal structure
    of an object is not available, other classes cannot have code that depends on
    that structure.


    In the same way, each class and each method should provide services to the code
    that uses them, while hiding the details of its operation.


    ### 5.1.1 Reasons for Privacy


    Fields in an object all have package access by default; I consider this to be
    a design flaw in Java. Fields should be private by default. Since they are not,
    the programmer should mark every field private unless there is a reason to make
    it more public.


    Here are five reasons for this statement:


    1.  It is the responsibility of each class to ensure the validity (consistency)
    of its objects, and it does not have full control if its variables are not private.


    2.  If a private variable in a class gets an erroneous value, the error must have
    been caused by something in the class, not something outside the class. This simplifies
    debugging.


    3.  If all the fields of an object are private, all manipulation of an object
    is centralized in the methods of that object.


    4.  If all fields of an object are private, the internal representation of that
    object can be changed without affecting any other classes. For example, the representation
    of points on a plane might be changed from rectangular coordinates to polar coordinates.
    This is not possible if other objects are already accessing the object''s fields.


    5.  Making the fields private is a form of information hiding. It limits but also
    simplifies what can be done to the object in other classes.


    For example, consider a class Person with an instance variable weight. Presumably,
    weight should never be negative. If an error occurs that causes it to become negative,
    and the variable is private, then we know the error must have occurred within
    the class Person, and nowhere else. But if weight is not private, the error could
    be anywhere (in, say, a Product that is guaranteed to help a person lose ten pounds
    a week).


