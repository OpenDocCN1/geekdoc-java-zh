    The braces indicate a block of `statements`. If there is only one statement, the
    braces may be omitted; however, it is good style to always include the braces.


    As an example, an array can be declared and its contents written out by:


    ```

    int[] ary = {3, 1, 4, 1, 6};

    ```


    ```

    for (int i = 0; i < ary.length; i += 1) {

    ```


    ```

    System.out.println(ary[i]);

    ```


    ```

    }

    ```


    Also legal, but much less commonly used, the `initialization` and the `update`
    may each consist of two or more assignments. For example,


    ```

    for (int i = 1, j = 100; i < j; i = 2 * i, j -= 1) {

    ```


    ```

    System.out.println("i = " + i + ", j = " + j);

    ```


    ```

    }

    ```


    Two additional statement types, `break` and `continue`, can also control the behavior
    of `for` loops. These statements, described in sections 3.3.1.11 and 3.3.1.12,
    can be used with statement labels.


    ### 3.3.1.8 For-each Loop


    A `for`-each loop does not involve any explicit testing; it simply goes through
    every element of an array, in order. This is simpler and more convenient when
    the index location of the elements is not needed. The syntax is:


    ```

    for (type variable: array) { statements }

    ```


    As with a traditional `for` loop, the `type` must be omitted if the `variable`
    has been previously declared. Also, as with the traditional `for` loop, the scope
    of the `variable` is the entire `for` statement. For example, every element in
    a `String` array `names` can be printed out as follows:


    ```

    for (String name: names) {

    ```


    ```

    System.out.println(name);

    ```


    ```

    }

    ```


    The `for`-each loop can also be used with iterable objects (see [section 5.2.3.1](#ch05.xhtml_sec5_002_003_001)).


    ### 3.3.1.9 Classic switch Statements


    Just as the `if` statement provides a choice between two blocks of code, based
    on a boolean value, the `switch` statement provides a choice between several blocks
    of code, based on an integer, character, string, or `Enum` value.


    > **Note:** This section describes the “traditional” `switch` statement, available
    in all versions of Java. For the newer (and better) version available in Java
    14 and beyond, see [section 3.3.2.3](#ch03.xhtml_sec3_003_002_003).


    The syntax is fairly complex:


    ```

    switch (expression) {

    ```


    ```

    case constant1:

    ```


    ```

    statements1;

    ```


    ```

    break;

    ```


    ```

    case constant2:

    ```


    ```

    statements2;

    ```


    ```

    break;

    ```


    ```

    …

    ```


    ```

    case constantN:

    ```


    ```

    statementsN;

    ```


    ```

    break;

    ```


    ```

    default:

    ```


    ```

    statementsdef;

    ```


    ```

    }

    ```


    Operation is as follows. The `expression` is evaluated, then compared to each
    case `constant` in order. When a `constant` is found that is equal to the `expression`,
    execution begins with the following statements, and continues until either a `break`
    or a `return` is encountered, or until the end of the entire `switch` statement.


    The value of the `expression` must be one of the integer types (including `char`),
    or a string, or an `Enum` value (see [section 5.3.6](#ch05.xhtml_sec5_003_006)).
    The `constants` may be integers, characters, literal strings, or `Enum` values.


    The `break` statement is not required at the end of each case, just strongly recommended.
    Without a `break`, control will “fall through” into the next group of statements.
    This is seldom what you want to happen. On the rare occasion that this really
    is the desired behavior, you should include a comment that the omission is intentional,
    otherwise you or someone else may “correct” this apparent problem at some later
    date.


    If the same code should be executed for one or more constants, rather than duplicating
    the code, one case `constant`: can be followed immediately by the next, for example


    ```

    case "yes":

    ```


    ```

    case "Yes":

    ```


    ```

    case "YES":

    ```


    ```

    some statements

    ```


    In Java 14 and later, the above can be abbreviated to


    ```

    case "yes", "Yes", "YES": some statements.

    ```


    The `default` case is optional, and should come last; it will be executed if no
    earlier matching `expression` is found. If no matching `expression` is found and
    there is no `default` case, the `switch` statement exits without doing anything.


    It is good style always to include a `default` case, even if you believe that
    all possibilities have been covered. The `default` case might be empty, or it
    could include the statement `assert false`; to indicate that this code should
    never be reached. (Assert statements are covered in [section 3.3.2.1](#ch03.xhtml_sec3_003_002_001).)


    The `statements` may be any sequence of zero or more statements. It is not necessary
    to use braces to group the statements (including the following `break` statement)
    into a compound statement, although this is sometimes done.


    Here is a contrived example:


    ```

    int i = 3;

    ```


    ```

    String s;

    ```


    ```

    switch (i) {

    ```


    ```

    case 1:

    ```


    ```

    s = "one";

    ```


    ```

    break;

    ```


    ```

    case 2:

    ```


    ```

    s = "two";

    ```


    ```

    break;

    ```


    ```

    default:

    ```


    ```

    s = "many";

    ```


    ```

    }

    ```


    This will result in `s` being set to "many".


    ### 3.3.1.10 Labeled Statements


    The syntax of a labeled statement is


    ```

    identifier: statement;

    ```


    Any statement may be labeled with an `identifier`, but it really only makes sense
    to label loop statements and switch statements. Labels are used in conjunction
    with the `break` and `continue` statements.


    ### 3.3.1.11 Break Statements


    A `break` statement is used to prematurely exit the immediately enclosing loop
    (of any kind) or `switch` statement.


    It can also be used to exit nested loops and/or `switch` statements. To do this,
    put a `label` (see previous section) on the loop or switch statement you want
    to exit. ... put the label after the word:


    ```

    break;

    ```


    Given an array of numbers, consider the problem of finding two numbers such that
    one is exactly times the other. The following code solves this.


    ```

    int i, j = 0;

    ```


    ```

    int[] ary = {7, 30, 9, 20, 3, 5};

    ```


    ```

    id: for (i = 0; i < ary.length; i += 1) {

    ```


    ```

    for (j = 0; j < ary.length; j += 1) {

    ```


    ```

    if (i!= j && ary[i] == 10 * ary[j]) {

    ```


    ```

    break id;

    ```


    ```

    }

    ```


    ```

    }

    ```


    ### 3.3.1.12 Continue Statements


    A `continue` statement is used to go from the middle of a loop to the beginning
    of the next time through. That is, the `continue` statement causes the enclosing
    loop to return to the test of a `while` loop, to the increment and test of a `for`
    loop, or to the beginning of a `do-while` loop.


    If the `continue` statement is within nested loops, it can be used to go to the
    beginning of a particular loop. To do this, put a `label` on the desired loop,
    and put that label after the word:


    ```

    continue label;

    ```


    The following code computes the average of the positive values in the array `ary`,
    ignoring the zero and negative values.


    ```

    int[] ary = {10, 20, 5, -1, 30, -12, 50};

    ```


    ```

    double sum = 0;

    ```


    ```

    int count = 0;

    ```


    ```

    for (int i = 0; i < ary.length; i += 1) {

    ```


    ```

    if (ary[i] <= 0) continue;

    ```


    ```

    sum += ary[i];

    ```


    ```

    count += 1;

    ```


    ```

    }

    ```


    ```

    double average = sum / count;

    ```


    While there is nothing actually wrong with the `continue` statement, refactoring
    the code to remove it almost always results in a simpler and more understandable
    program.


    ### 3.3.1.13 Return Statements


    When a method is defined, it must specify the type of the value to be returned.
    If no value is to be returned, the keyword `void` must be used in place of a type
    name, and the use of a `return` statement is optional. Examples:


    ```

    int add(int a, int b) {

    ```


    ```

    return a + b;

    ```


    ```

    }

    ```


    ```

    void print(int x) {

    ```


    ```

    System.out.println(x);

    ```


    ```

    return; // superfluous

    ```


    ```

    }

    ```


    The syntax of the `return` statement is either simply


    ```

    return;

    ```


    for a `void` method, or


    ```

    return expression;

    ```

