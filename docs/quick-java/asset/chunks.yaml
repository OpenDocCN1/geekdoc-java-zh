    The above code assumes that it is in a class that extends JFrame. Alternatively,
    you can create a JFrame and save it in a variable, then send messages to that
    variable. In particular, the messages setDefaultCloseOperation, getContentPane,
    pack, and setVisible should be sent to the JFrame.


    > **Technical note:** It is actually the “content pane” of a JFrame that holds
    the components; the setLayout and add methods pass these calls along to the content
    pane. Very old code may still refer to the content pane explicitly.


    ### 9.8.2 JEditorPane


    An ***editor pane*** is a special kind of container that supports editing plain
    text (text/plain) or ***hypertext*** (text/html). It implements the keyboard shortcuts
    for cut, copy, and paste, but not undo/redo.


    The construction uses somewhat complex nesting. In the example below, the JFrame
    contains the JScrollPane scroller which contains the JPanel content which contains
    the JEditorPane editor.


    To declare and define a JEditorPane:


    ```

    JEditorPane editor = new JEditorPane();

    ```


    To declare and define a JPanel to serve as the view of a JScrollPane:


    ```

    JPanel content = new JPanel();

    ```


    To declare and define a JScrollPane holding the JPanel:


    ```

    JScrollPane scroller = new JScrollPane(editor);

    ```


