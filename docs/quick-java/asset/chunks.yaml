    [java.lang](https://docs.oracle.com/en/java/javase/17/docs/api/java.base/java/lang/package-summary.html)
    页面包含了对该包用途的简要描述，以及对某些类用途的非常简短的描述。之后是“相关包”列表，接着是类的选项卡式列表。为了方便说明，请从选项卡式列表中选择“所有类和接口”（可能已经已被选中）或“类”。


    你将看到我们已经提到过的一些类，例如 [Character](https://docs.oracle.com/en/java/javase/17/docs/api/java.base/java/lang/Character.html)
    和 [Exception](https://docs.oracle.com/en/java/javase/17/docs/api/java.base/java/lang/Exception.html)。向下滚动页面并点击
    `String`。


    在 `Class String` 正下方，你会看到它的父类是 [java.lang.Object](https://docs.oracle.com/en/java/javase/17/docs/api/java.base/java/lang/Object.html)（可点击），并且它实现了一些接口（也可点击）。从
    `Object` 继承的方法将在此页面上进行描述（除非它们被重写了），但它们将列在更下方。接口的方法将在下方进行描述，以及所有其他方法。


    接下来是字符串对象的简要说明、字段摘要、构造函数列表，以及下方的列表选项卡式列表，其中之一是“所有方法”。如果该选项卡未选中，请点击它。


    我们将选取此页面上的一个方法进行检查。向下滚动到类似于 表 3.1 的那行：


    表 3.1 Java API 中短的 indexOf 条目


    | int | `indexOf(String str)` | 返回指定的子字符串在此字符串中首次出现的索引。 |


    这一行表示 `indexMethod` 接受一个 `String` 作为参数，并返回一个 `int` 结果。此之后是对该方法作用的简要描述——更详细的描述在页面下方。唯一*隐含*的（因为这是
    `String` 类中的一个方法）是 `indexOf` 是你发送给 `String` 的消息：例如，`story.indexOf("Toby")` 在字符串
    `story` 中搜索字符串 `"Toby"`。


    在这一行中，**indexOf** 和 **String** 是加粗的，意味着它们是可点击的。通常，描述就是你所需要的，但你可以点击方法名跳转到详细描述处。


    这些页面上会有很多你看不懂的内容。这没关系；重要的是熟悉探索文档，并使用你确实懂的部分。如果你经常处理字符串，那么浏览这些方法以寻找你可能用到的方法是值得的。


    一个需要知道的重要词汇是“**deprecated**”（已弃用）。一个 `deprecated` 方法仍然有效，但已被某些更新、更好的东西所取代。如果可能，请不要使用已弃用的方法。通常有一个指向更更新、更佳版本的链接。


    ## 3.5 对象和类


    类和对象的语法将在稍后讨论，但从一开始就了解一下这些东西是什么是有帮助的。


    在面向对象编程之前，数据和函数分布在整个程序中，可能在某种程度上进行了分组，但没有正式的组织。面向对象编程提供了这种组织。


    一个 `object`（对象）是一个“东西”。某些对象代表现实世界中的东西，例如 `Customer` 或 `Date`。大多数对象代表“计算机世界”中的东西，例如
    `String` 或 `HashMap`。有些东西介于之间，例如 `Calendar`。每个对象都有一些数据，称为 `fields`（字段），描述这个特定的对象，它还有一些方法，定义了对象可以做什么。


    `method`（方法）是属于对象的函数（在某些情况下属于类）。方法以各种方式操作对象的数据，例如更新数据或提供关于它的信息。最初，Java 没有真正的函数，只有方法。


    一个 `class`（类）定义了对象的 `type`（类型）。它告诉每个对象包含哪些字段，以及哪些方法可以操作该对象。


    例如，如果你正在编写维护在线商店的软件，你可能会：


    * 一个 `Inventory` 对象，用于维护你出售的 `Item` 对象列表。

    * 许多 `Item` 对象，每个都有价格、描述、`shippingWeight`、`numberOnHand` 等。

    * 一个 `Order` 对象可能是 `Customer` 订购的 `Items` 列表。你可能有方法向此订单添加 `Item` 或从中移除 `Item`。

    * 每个 `Customer` 对象可能有一个名称、一个 `currentOrder`（类型为 `Order`）、`amountOwed` 等。


    每个类至少有一个 `constructor`（构造函数）用于创建该类型的新对象。要创建一个新的 `Item` 对象，你可能需要向构造函数提供物品描述、重量、价格以及关于物品的任何其他信息。


    > **核心概念：*面向对象编程***的核心在于创建一个协作的、活跃的“代理”（称为“对象”）社会，它们通过合作完成所需的任务。


