    Load which file?\");\n```\n\nTo get a reader for the chosen file:\n\n```java\n\
    BufferedReader br = null;\nint result = chooser.showOpenDialog(parent);\nif (result\
    \ == JFileChooser.APPROVE_OPTION) {\n    File file = chooser.getSelectedFile();\n\
    \    try {\n        if (file != null) {\n            String fileName = file.getCanonicalPath();\n\
    \            FileReader fr = new FileReader(fileName);\n            br = new BufferedReader(fr);\n\
    \        }\n    } catch (IOException e) { }\n}\n```\n\nTo read the first line:\n\
    \n```java\ntry {\n    String line = br.readLine();\n} catch (IOException e) {\
    \ }\n```\n\n### 8.2.7 Save File Dialog\n\nThe code for writing to a file is similar\
    \ to the code for reading from file. You need to use `save dialog` instead of\
    \ `open dialog`, and `PrintWriter` instead of `BufferedReader`.\n\nNecessary imports:\
    \ `javax.swing.JFileChooser`, `java.io.File`, `java.io.PrintWriter`, `java.io.FileOutputStream`,\
    \ and `java.io.IOException`.\n\nTo display a `JChooser` save file dialog:\n\n\
    ```java\nJFileChooser chooser = new JFileChooser();\nchooser.setDialogTitle(\"\
    Save file as?\");\n```\n\nTo get the file chosen in `JChooser` save file dialog:\n\
    \n```java\nint result = chooser.showSaveDialog(parent);\nPrintWriter pr = null;\n\
    if (result == JFileChooser.APPROVE_OPTION) {\n    File file = chooser.getSelectedFile();\n\
    \    String fileName;\n    try {\n        if (file != null) {\n            fileName\
    \ = file.getCanonicalPath();\n            FileOutputStream stream = new FileOutputStream(fileName);\n\
    \            pr = new PrintWriter(stream, true);\n        }\n    } catch (IOException\
    \ e) { }\n}\n```\n\nTo write to the file: Close the `PrintWriter` when done.\n\
    \n### 8.2.8 Custom Dialog\n\nIf none of the supplied dialogs is exactly what you\
    \ need, you can define on your own. What you need to import will depend on what\
