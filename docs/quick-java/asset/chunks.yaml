    #### 3.2.11.2 Variables Declared in Methods


    A ***block*** or ***compound statement*** is a group of declarations and/or statements
    enclosed in braces, {}.


    A ***method*** consists of a ***header*** and a ***body***; the body is a ***block***.


    ```

    public double average(double x, double y) {

    ```


    ```

    double sum = x + y;

    ```


    ```

    return sum / 2;

    ```


    ```

    }

    ```


    The parameters (in this example, x and y) can be used everywhere in the method,
    but are not available outside the method. Variables declared within the body (sum
    in this example) follow the scope rules for blocks (see the next section).


    The parameters and the variables declared within the body are ***local variables***;
    they are created when the method is invoked (used), and discarded when the method
    returns. Local variables do not retain their values from one invocation (call)
    of the method to the next; each invocation starts all over again.


    #### 3.2.11.3 Variables Declared in Blocks


    A variable declared within a block is accessible (can be used) from the point
    of declaration to the end of the block. For example:


    ```

    {

    ```


    ```

    x = 1; // illegal!

    ```


    ```

    int x; // scope of "x" starts here

    ```


    ```

    x = 2; // legal

    ```


    ```

    } // scope of "x" ends here

    ```


    ```

    x = 3; // illegal!

    ```


    Variable declarations are usually put first in a block.


    ## 3.3 Statement Types


    Java and C++ both borrowed heavily from the C language, and many of the statement
    types are identical.


    One significant difference is that, in Java, the ***condition*** (test) of an
    if, for, while, or do-while statement *must* be an expression that results in
    a boolean value, not any other type.


    Java is usually formatted to put the opening brace of a control statement on the
    same line as the control statement, and the closing brace aligned with the control
    statement (see below for examples). In addition, Java programmers are encouraged
    to use braces even when the block consists of only a single statement.


    > **Note:** Statements may be labeled for access by break and continue statements
    (see sections [3.3.1.1](#ch03.xhtml_sec3_003_001_001) and [3.3.1.12](#ch03.xhtml_sec3_003_001_012)),
    but there is no goto statement.


    The following statements are not in C++, or differ significantly from those in
    C++. See [section 3.3.2](#ch03.xhtml_sec3_003_002) for detailed descriptions.


    ```

    ● assert booleanExpression;

    ```


    ```

    ● assert booleanExpression: expression;

    ```


    ```

    ● switch (expression) {

    ```


    ```

    case labels1 -> action1

    ```


    ```

    case labels2 -> action2

    ```


    ```

    …

    ```


    ```

    case labelsN -> actionN

    ```


    ```

    default -> actiondef

    ```


    ```

    }

    ```


    ```

    ● System.out.println(value);

    ```


    ```

    ● System.out.print(value);

    ```


    ```

    ● try {

    ```


    ```

    statements

    ```


    ```

    }

    ```


    ```

    catch (ExceptionType variable) {

    ```


    ```

    statements

    ```


    ```

    } // there may be multiple catch clauses

    ```


    ```

    finally {

    ```


    ```

    statements

    ```


    ```

    }

    ```


    ```

    ● throw Exception;

    ```


    Here is a list of the statements that are essentially the same as those in C++.


    ```

    ● variable = expression;

    ```


    ```

    ● expression;

    ```


    ```

    ● { statements }

    ```


