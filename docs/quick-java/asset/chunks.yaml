    ### 5.2.1.4 Namespaces


    Names are kept in ***namespaces***, and the names in one namespace are independent
    of the names in other namespaces. Thus, for example, a variable may have the same
    name as a method without causing any conflict. Java uses six different namespaces:


    *   package names

    *   type names

    *   field (variable) names

    *   method names

    *   local variable names (including parameters)

