    These methods can throw an `IOException` or a `ClassNotFoundException`, so these
    must be handled, and the `stream` and `file` should be closed after use.


    If the definitions of the relevant classes change after serialization, the deserialized
    results can be incorrect. To ensure consistency, the serializable class should
    have a `version number` associated with it.


