    数组是对象，它们有一个 `length` 字段，但数组的大多数方法只是继承自 `Object` 的方法。然而，`java.util.Arrays` 类提供了许多实用的静态方法。


    *   `Arrays.toString(array)`—返回 `array` 的字符串表示。该 `array` 可以是任何类型。

    *   `Arrays.deepToString(array)`—返回 `array` 的字符串表示。该 `array` 必须是一个对象数组。对于多维数组，应使用此方法。

    *   `Arrays.sort(array)`—按升序对 `array` 进行排序，并返回 `void`。该数组可以是 `boolean` 类型以外的任何原始类型，或者是任何实现了
    `Comparable` 接口的对象类型。（Java 提供的大量对象都实现了 `Comparable`）。

    *   `Arrays.binarySearch(array, key)`—在**排序数组**中搜索 `key` 并返回找到找到的索引。如果没有找到 `key`，该方法将返回负索引
    `-p-1`，其中 `p` 是 `key` 如果在数组中应该所在的位置。数组可以是数值类型或任何实现了 `Comparable` 接口的对象类型，但不能是
    `boolean` 数组。

    *   `Arrays.equal(array1, array2)`—测试两个相同类型的数组是否相等。对象数组的比较是使用该对象的 `equals` 方法完成的。


    如前所述，`interface`（接口）是一个类可以选择实现的方法列表。


    `Comparable` 接口需要一个方法：`compareTo(Type obj)`，其中 `Type` 是实现该接口的类名。例如，如果 `Person`
    类实现了 `Comparable` 接口，它就必须提供一个 `compareTo(Person obj)` 方法。该方法返回的结果根据该对象是小于、等于还是大于
    `obj` 而返回负数、零或正数。


    如果根据对象的某个数值属性（例如，人的年龄）进行比较，`compareTo` 方法可以简单返回 `this.age - obj.age`。


    ### 5.2.2.8 字符串（Strings）


    字符串是对象。字符串大约有十五种构造函数，但创建字符串的常用方法是在是在双引号之间放置一些字符。一旦完成这一操作，你就可以像往常一样向字符串发送消息。


    例如，如果 `s` 是一个字符串，你可以通过调用 `s.length()` 来询问它有多少个字符。你可以通过调用 `s.toUpperCase()` 来获取它的大写版本。你可以通过调用
    `s.contains("Java")` 来询问它是否包含子字符串“Java”。以此此类推。


    记住字符串是**不可变**（`immutable`）对象是很有用的。没有任何可以发送给字符串的消息能够改变该字符串的字符。像 `toUpperCase` 这样的方法返回的是一个新的字符串，但保持原始字符串不变。


    字符串有一个 `equals` 方法，在比较字符串时你可以并且也应该使用它。如果 `s` 和 `t` 是字符串，你可以调用 `s.equals(t)` 并得到你预期的结果。但有两个潜在的陷阱。


    > **陷阱 #1。** 你不能向空对象（null object）发送消息。如果 `s` 是 `null`，`s.equals(t)` 将导致错误。（注：原文此处存在大量重复句式，翻译时已按逻辑精处理）。

