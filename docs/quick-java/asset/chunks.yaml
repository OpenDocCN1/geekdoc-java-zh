    \ 'A' is 65, 'B' is 66, and so on. Java uses Unicode internally, specifically\
    \ UTF-16. Unicode is complicated, and a bit of history might help to make sense\
    \ of it.\n\nOne of the earliest character encodings was `ASCII`, `American Standard\
    \ Code for Information Interchange`. It used one byte per character. A byte is\
