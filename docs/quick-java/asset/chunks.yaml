    is true, the ***statements*** are executed, then the entire loop (starting with
    the test) is executed again.


    For example, the number of digits in a nonzero number can be computed by:


    ```

    int countDigits(int number) {

    ```


    ```

    int count = 0;

    ```


    ```

    while (number != 0) {

    ```


    ```

    number = number / 10;

    ```


    ```

    count += 1;

    ```


    ```

    }

    ```


    ```

    return count;

    ```


    ```

    }

    ```


    The braces indicate a block of statements. If there is only one statement, the
    braces may be omitted; however, it is good style to always include the braces.


    Normally, the statements controlled by the loop must affect the condition being
    tested. In the above example, number is compared to 0, and the statements in the
    loop change the value of number. If the controlled statements never make the condition
    false, then the loop never exits, and the program “hangs” (stops responding).
    This is a kind of error is commonly, if inaccurately, called an ***infinite loop***.


    Two additional statement types, break and continue (see sections 3.3.1.11 and
    3.3.1.12), can also control the behavior of while loops. These statements can
    be used with statement labels.


    #### 3.3.1.6 Do-while Loops


    A do-while loop is a loop with the test at the bottom, rather than the more usual
    test at the top. The syntax is:


    ```

    do {

    ```


    ```

    statements

    ```


    ```

    } while (condition);

    ```


    First, the ***statements*** are executed, then the ***condition*** is tested;
    if it is true, then the entire loop is executed again. The loop exits when the
    ***condition*** gives a false result.


    This kind of loop is most often used when the test doesn''t make any sense until
    the loop body has been executed at least once. For most purposes, the while loop
    is preferable.


    For example, suppose you want to choose a random number between 0 and 1000 that
    is divisible by 7. You cannot test the number until after you have chosen it,
    so do-while is appropriate.


    ```

    Random rand = new Random();

    ```


    ```

    int x;

    ```


    ```

    do {

    ```


    ```

    x = rand.nextInt(1000);

    ```


    ```

    } while (x % 7 != 0);

    ```


    As with a while loop, an infinite loop will result if the exit condition is never
    satisfied.


    The do-while loop is a little harder to think about than a while loop. Since we
    want a number that *is* divisible by 7, the loop has to test that the number *is
    not* divisible by 7.


    Unlike other kinds of control statement, the braces in a do-while are required,
    even if only a single statement is in the loop.


    The following code does *not* work:


    ```

    do {

    ```


    ```

    int x = rand.nextInt(1000);

    ```


    ```

    } while (x % 7 != 0); // error

    ```


    Variables declared within a block are local to that block. If the variable x is
    declared within the braces of the do-while loop, it cannot be used in the condition,
    which lies outside of the block.


    Two additional statement types, break and continue, can also control the behavior
    of do-while loops. These statements can be used with statement labels.


    #### 3.3.1.7 Traditional For Loops


    A for loop is a loop with the test at the top. The syntax is:


    ```

    for (initialization; condition; update) {

    ```


    ```

    statements

    ```


    ```

    }

    ```


    The ***initialization*** is performed first, and only once. After that, the ***condition***
    is tested and, if true, the ***statements*** are executed and the ***update***
    is performed; then control returns to the ***condition***. In other words, the
    for loop behaves almost exactly like the following while loop:


    ```

    initialization;

    ```


    ```

    while (condition) {

    ```


    ```

    statements;

    ```


    ```

    update;

    ```


    ```

    }

    ```


    The ***initialization*** is typically either an assignment to a previously declared
    variable, for example, i = 0, or a combined declaration and assignment, for example,
    int i = 0. The ***update*** is typically an assignment statement such as i +=
    1.


    The scope of any variable declared in the ***initialization*** (that is, where
    the variable can be used), is the entire for statement.'
