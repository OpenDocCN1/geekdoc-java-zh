- fmt: "\nAt each step, the `x` position is advanced by `dx`, and the `y` position\
    \ by `dy`. A “bounce” occurs when the ball goes too far to the left or too far\
    \ to the right, and this is accomplished by changing the sign of `dx`.\n\n```\n\
    position.x += dx;\n```\n\n```\nif (position.x < 0 || position.x >= xLimit) {\n\
    \    dx = -dx;\n}\n```\n\n```cpp\nposition.x += dx;\n```\n\nThe code for updating\
    \ `position.y` is almost identical.\n\nThe model represents a ball bouncing around\
    \ within a bounding box. It is irrelevant to the model that the bounding box corresponds\
    \ to the edges of a window. It is perfectly legal to draw outside a window; anything\
    \ drawn there simply isn’t visible.\n\nTo make the new position available to other\
    \ classes, the model has a `PropertyChangeSupport` object (named `pcs`). This\
    \ is public so that it can be accessed by the view class.\n\n```\npublic PropertyChangeSupport\
    \ pcs;\n```\n\nEach time the model completes a step, it tells `pcs` to fire off\
    \ an event containing the new value of the ball's position.\n\n```\nthis.pcs.firePropertyChange(\"\
    position\", null, position);\n```\n\n### 10.6.4 View\n\nThe task of the view class\
    \ is simply to clear the window and draw a ball in it each time it receives a\
    \ `PropertyChangeEvent`. This means it has to “listen” for those events. To do\
    \ this, it implements `PropertyChangeListener`.\n\n```\npublic class View extends\
    \ JPanel\nimplements PropertyChangeListener {…}\n```\n\nIt has to provide a listener\
    \ for the events:\n\n```\n@Override\npublic void propertyChange(PropertyChangeEvent\
    \ event) {\n    position = (Point) event.getNewValue();\n    repaint();\n}\n```\n\
    \nBut this isn’t enough; one more step is required: The `View` class is now a\
    \ listener, but the same `PropertyChangeSupport` object used earlier must be told\
