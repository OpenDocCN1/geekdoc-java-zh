    a class). The methods manipulate the data of the object in various ways, such
    as updating it or providing information about it. Originally, Java had no actual
    functions; it only had methods.


    A ***class*** defines a ***type*** of object. It tells what fields are in each
    object, and what methods operate on that object.


    For example, if you were to write the software to maintain an online store, you
    might have:


    *   An Inventory object to maintain a list of Item objects you have for sale.


    *   Numerous Item objects, each with a price, a description, a shippingWeight,
    a numberOnHand, and so on.


    *   An Order object might be a list of Items being ordered by a Customer. You
    might have methods to add an Item to this order and to remove an Item from it.


    *   Each Customer object could have a name, a currentOrder (of type Order), an
    amountOwed, and so on.


    Each class has at least one ***constructor*** for making new objects of that type.
    To create a new Item object, you may have to provide the constructor with a description
    of the item, its shipping weight, its price, and whatever else is important about
    the item.


    > **Key concept: *Object-oriented programming*** is all about creating a society
    of cooperating, active “agents” (called “objects”) that, working together, accomplish
    the desired task.


    In Java almost everything, and certainly all executable code, is in classes.


    An ***interface*** is a list of methods that a class may choose to implement.
    Interfaces are described in [section 4.1.3](#ch04.xhtml_sec4_001_003) and [5.3.2](#ch05.xhtml_sec5_003_002);
    for now, it is not too misleading to think of an interface as a kind of class.


    # Chapter 4 The “Outer Language” of Java


    DOI: [10.1201/9781003402947-4](https://doi.org/10.1201/9781003402947-4)


    The earlier sections of this book focussed on what can be done within a single
    “top level” class. A typical Java program consists of multiple top-level classes,
    and may also use abstract classes, interfaces, any or all of the four types of
    inner class, as well as the specialized Enum class. While it is not standard terminology,
    you can think of this structure as the “outer language” of Java.


    ## 4.1 Class Structure


    A ***class*** defines a type of object. It tells what data objects of that type
    contain and what methods they have. Here are the most important parts of a class
    definition:


    ```

    access class ClassName {

    ```


    ```

    fields

    ```


    ```

    constructors

    ```


    ```

    methods

    ```


    ```

    }

    ```


    Every object has a type, and the name of that type is the same as the ***ClassName***.
    If you define a class Item, then every object created from that class will be
    of type Item.


    Normally, every top-level class goes in a separate file, and the name of the file
    must be the name of the class, with the extension.java.


    > **Note:** More than one top-level class *can* be put in a file, but only one
    of them can be public, and that is the one the file must be named after. However,
    one class per file is the recommended organization.


    ### 4.1.1 A Simple Class


    We will begin by looking at a simple example of a class; later sections will describe
    each of the parts of a class in detail.


    The name of the class is Password, and each object created from the class will
    hold one password. The method matches will tell us if a password is correct, and
    the reset method will allow us to change it. Without further ado, here''s the
    class:


    ```

    public class Password {

    ```


    ```

    private String password;

    ```


    ```

    public Password(String password) {

    ```


    ```

    this.password = password;

    ```


    ```

    }

    ```


    ```

    public boolean matches(String attempt) {

    ```


    ```

    return attempt.equals(password);

    ```


    ```

    }

    ```


    ```

    boolean reset(String oldPassword,

    ```


    ```

    String newPassword) {

    ```


    ```

    if (matches(oldPassword)) {

    ```


    ```

    password = newPassword;

    ```


    ```

    }

    ```


    ```

    return password.equals(newPassword);

    ```


    ```

    }

    ```


    ```

    }

    ```


    The name of the class is Password, and it is public, so it can be seen and used
    anywhere in the project.


    The class has a field named password, of type String. It is private, so it cannot
    be seen or used outside this class.'
