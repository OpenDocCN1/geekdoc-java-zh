  trans: "\n\n已在不同细节程度的有用类有 `StringBuilder`、`Scanner`、`Stack` 和 `HashMap`。本节描述了一些对于编写并发程序和制作动画重要的额外类和方法。\n\
    \n这些类中的每一个都比本节所描述的丰富得多。这里只描述了基础部分。\n\n## 10.1 线程 (Threads)\n\n`thread`（线程）是程序中的控制流。现代操作系统是多进程的（multiprocessing）：它们同时执行很多任务。这可以通过将不同的线程分配给不同的核心来实现，也可以通过中断一个线程并将执行权交给另一个线程来实现。即使是一个简单的\
    \ Java 程序也使用了多个线程，并隐藏了这些细节，以便你无需考虑它们。然而，你可以直接创建和操作线程。\n\n`Thread` 是一个表示控制流的对象。当你单步程序时，你正在遵循一个线程。线程和任何其他对象一样；你可以创建它们并向它们发送消息。每个程序都使用线程。\n\
    \n有两种方法可以创建另一个 `Thread` 并启动其运行：\n\n*   编写一个继承 `Thread` 的类并重写 `public void run()`\
    \ 方法。\n    *   创建该类的对象。\n    *   向该对象发送（继承自）`start()`消息。\n*   编写一个实现 `Runnable`\
    \ 的类并重写 `public void run()` 方法。\n    *   创建该类的对象 `obj`。\n    *   创建一个新的 `Thread(obj)`。\n\
    \    *   向 `Thread` 发送 `start()` 消息。\n\n`Thread` 可以处于四种状态之一（参见图 10.1）：\n\n*  \
    \ `Ready`（就绪）：已准备好运行\n*   `Running`（运行）：正在实际执行操作\n*   `Waiting`（等待）或 `blocked`（阻塞）：需要某些东西\n\
    *   `Dead`（死亡）：将永远不再做任何事情\n\n![线程的状态为：准备，运行，等待，死亡](img/fig10_1.jpg)\n\n图 10.1\
    \ 线程的状态。\n\n执行由 Java 调度器控制，但你可以请求它执行某些事情。调用 `start()` 就是这样一种请求。另一种是你可以请求当前 `Thread`\
    \ 暂停给定的毫秒数。\n\n`Thread.sleep(milliseconds);`\n\n此调用可能会抛出 `InterruptedException`。\n\
    \n```\ntry {Thread.sleep(1000);}\n```\n\n```\ncatch (InterruptedException e) {\
    \ }\n```\n\n> **警告：** Java 最早版本允许一个 `Thread` 通过 `stop`、`suspend` 和 `resume` 方法控制其他\
    \ `Threads`。这立即被认为是一个坏主意，这些方法立即被废弃。永远不要使用它们！\n\n使用废弃方法的简单替代方案是让一个线程设置一个可以被另一个线程读取的标记。\n\
    \n```\nboolean okToRun = true;\n```\n\n```\nsecondThread.start();\n```\n\n```\n\
    public void run() {\n```\n\n```\nwhile (firstThread.okToRun) {...}\n```\n\n```\n\
    }\n```\n\n## 10.2 同步 (Synchronization)\n\n许多情况下，让许多进程（线程）并行运行理想的。例如，在等待数据库访问或文件传输的过程中可以进行其他工作。\n\
    \n当一个值被一个线程更改同时被另一个线程访问，或者当两个线程都尝试更新同一个值时，可能会产生微妙的、不可重现的错误。为了避免这种情况，Java 引入了 `synchronization`（同步）的概念，它简单意味着赋予一个线程对一个值或一组值的临时但排他的访问。\n\
    \n你可以对对象进行同步：\n\n```\nsynchronized (obj) { code }\n```\n\n在这里，`synchronized` 被用作语句。在\
    \ `code` 完成之前，没有其他代码可以对 `obj` 进行同步。\n\n> **注意 1：** 对你想要访问或修改的对象进行同步通常是有意义的，但这不是强制要求的。任何对象都可以用于同步，而\
    \ `code` 可能会访问或修改完全无关的值。\n\n> **注意 2：** 对对象进行同步*仅*会阻止其他对*相同*对象进行同步的线程运行。未同步的代码，或对其他对象进行同步的代码不受影响。\n\
    \n你可以对方法进行同步：\n\n```\nsynchronized void methodName(arguments) { code }\n```\n\n\
    在这种情况下，`synchronized` 被用作方法修饰符；它对对象 `this` 进行同步。\n\n对对象进行同步意味着线程获取了该对象的“锁”，在代码完成并释放锁之前，没有其他线程可以对其进行同步。在持有锁期间，线程还可以使用任何其他对相同对象进行同步的方法。同样，它无法受到未同步代码或对某些其他对象进行同步的代码保护。\n\
    \n多线程的意义在于允许不同的线程同时运行，只要它们没有尝试访问相同的对象。同步是昂销的，而且在追求效率的同时保持正确性是非常困难的。\n\n## 10.3\
    \ 定器 (Timers)\n\n`javax.swing.Timer` 用于调度代码的重复执行。构造函数接受两个参数：以毫秒为单位的 `int time`，用于设置初始延迟和事件之间的时间；以及一个\
    \ `ActionListener`（通常是匿名内部类），用于在 `Timer` 的每次“滴答”（tick）执行某些操作。\n\n```\nTimer timer\
    \ = new Timer(40, event -> doSomething());\n```\n\n有许多可以发送给 `Timer` 的消息，包括 `stop()`、`start()`、`setDelay(ms)`\
    \ 和 `restart()`。\n\n## 10.4 属性变化 (Property Changes)\n\n`java.beans.PropertyChangeSupport`\
    \ 对象是对象通知其他对象其已更新的一种方式。\n\n> **术语：** `bean` 是任何满足以下条件的 Java 类：(1) 有无参数构造函数，(2)\
    \ 至少拥有具有 getter 和 setter 的某些“属性”（私有字段），并且 (3) 是可序列化的。说一个类是 bean 仅仅是说它具有这些特征。\n\
    \n基本操作如下：\n\n1.  创建一个新的 `PropertySupportObject(bean)`，其中 `bean` 是要被“观察”或“监听”的对象。\n\
    2.  每当 `bean` 完成一次更新时，它应该向 `PropertySupportObject` 发送消息 `firePropertyChange(propertyName,\
    \ oldValue, newValue)`。这可能最好在 bean 内部完成。\n    *   `propertyName` 是一个字符串，`oldValue`\
    \ 和 `newValue` 可以是整个 `bean` 对象的值，也可以是其某些部分的值。\n    *   当 `oldValue` 和 `newValue`\
    \ 不同时，此方法才会触发 `PropertyChangeEvent`。\n3.  要向 bean 添加监听器，向 `PropertySupportObject`\
    \ 发送消息 `addChangeListener(listener)`。可以添加任意数量的监听器。\n4.  要监听 bean，类必须实现 `PropertyChangeListener`\
    \ 并重写继承的 `public void propertyChange(PropertyChangeEvent event)` 方法。\n    *  \
    \ `event` 参数具有可访问的字段 `event.propertyName`、`event.oldValue` 和 `event.newValue`。后两个是\
    \ Object 类型，因此应强制转换为所需的类型。\n\n为了使用上述类和方法，类并不需要所有的 bean 特征。\n\n## 10.5 SwingWorker\n\
    \n`worker thread`（工作线程）提供了一种在后台线程运行长时间运行过程的方法，以便主线程可以继续工作。这在 GUI（图形用户界面）程序中特别重要，因为长时间运行的过程会导致\
    \ GUI 无响应。\n\n`SwingWorker` 类提供了一种创建工作线程的简单方法。涉及三个线程：\n\n*   `current thread`\
    \ 创建并启动 `SwingWorker`，然后继续运行不受中断。\n*   `worker thread` 执行长时间运行的代码。\n*   `event\
    \ dispatch` 线程处理所有的 GUI 事件。\n\n"
