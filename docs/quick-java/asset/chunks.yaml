    A ***declaration*** consists of a type, a name, an optional equals sign, and a
    value, and ends with a semicolon. It may be marked as public or private, and in
    addition, it may be preceded by the word static.


    ```

    public static double Avogadro = 6.0221409e+23;

    ```


    If a variable is marked with static, there is only one of it, it belongs to the
    class itself, and all objects of that class share this one variable. Otherwise,
    it is an ***instance variable*** (also called a ***field***), and every object
    has a separate copy of that variable.


    A ***constructor*** is used to create new objects whose type is ***ClassName***.


    ```

    ClassName(parameters) {

    ```


    ```

    declarations

    ```


    ```

    statements

    ```


    ```

    }

    ```


    A constructor is called with new ***ClassName***(***arguments***). It *always*
    returns a newly created object; a return statement is unnecessary, and if used,
    it must be a “bare” return statement, not supplying a value. A constructor typically
    does little more than assign values to the instance variables of the new object.


    A ***method*** is a callable chunk of code. It is like a function, except that
    it belongs to an object (or to a class). The basic structure of a method is


    ```

    returnType methodName(parameters) {

    ```


    ```

    declarations

    ```


    ```

    statements

    ```


    ```

    }

    ```


    The ***returnType*** may be any primitive or object type, or the keyword void.
    If the ***returnType*** is void, the method will return when a return; statement
    is executed, or when the end of the method is reached. But if the method is to
    return a value, it must terminate with a return ***expression***; statement, where
    ***expression*** results in a value that can be put in a variable of type ***returnType***.


    To send a message to an object (that is, to call one of its methods), use the
    syntax ***object***.***methodName***(***arguments***). The value of this expression
    will be the value returned by the method (or null if no value is returned).


    ## 1.6 Statements


    The most commonly used statements are assignment statements, blocks (or compound
    statements), if statements, while loops, and for loops. All statements except
    blocks must end with a semicolon. The println method may be used to produce output.


    A ***block*** combines any number of statements into a single ***compound statement***
    by enclosing them in braces, {}.


    An ***assignment statement*** gives a value to a variable. If the variable has
    not previously been declared, the type must be specified; the variable can be
    used from the point of declaration to the end of the innermost enclosing block.


    An ***if statement*** tests a boolean condition and executes a statement if the
    condition is true. It may have an else part, which will execute a different statement
    if the condition is false. Since each part controls a single statement, that statement
    is typically a block.


    ```

    if (2 + 2 == 4) {

    ```


    ```

    System.out.println("All is well.");

    ```


    ```

    } else {

    ```


    ```

    System.out.println("What??");

    ```


    ```

    }

    ```


    A while loop evaluates a boolean condition. If the condition is true, it executes
    a statement (usually a block), then comes back to the test. It exits when the
    test evaluates to false.


    ```

    int count = 10;

    ```


    ```

    while (count > 0) {

    ```


    ```

    System.out.println(count);

    ```


    ```

    count = count - 1;

    ```


    ```

    }

    ```


    ```

    System.out.println("Blast off!");

    ```


    A for loop sets an initial value, tests a boolean condition, executes a statement
    if the condition is true, executes an update, and returns to the test. It exits
    when the test returns false.


    ```

    for (int i = 10; i > 0; i = i - 1) {

    ```


    ```

    System.out.println(i);

    ```


    ```

    }

    ```


    ```

    System.out.println("Blast off!");

    ```


    > **Note:** The above statements require a *boolean* condition to serve as a test.
    You cannot use a numeric value as a test.


    The prevailing convention in the C family of languages is to put the opening brace
    of a block by itself at the beginning of a line. In Java, however, the style has
    always been to put the opening brace at the end of the line, as in the examples
    above. “When in Rome, do as the Romans do.”


    Java has no “print” statement, but the print and println *methods* can be used
    as if they were statements. System.out.println(***arg***) takes a single argument
    and sends it to standard output, followed by a ***newline*** character, ’\n’.
    System.out.print(***arg***) does the same but without the newline.


    ## 1.7 Program Execution


    The value of a good ***IDE*** (***Integrated Development Environment***) cannot
    be overstated. NetBeans, Eclipse, IntelliJ IDEA, and Xcode (Mac only) are all
    excellent. Of these, IntelliJ IDEA may be the easiest for a beginner. Any IDE
    will provide a simple way to run your program.


    The program will start execution at the main method of a public class. The main
    method should have this *exact* header:


    ```

    public static void main(String[] args) {

    ```


    If you are not using an IDE, any plain text editor (*not* a word processor) may
    be used to create a program. Each class should be on a separate file, and the
    name of the file should be the name of the class with the .java extension.


    If you are using Java 11 or later, you can run a program by navigating to the
    folder containing the Java file and opening a command/terminal window. In that
    window, enter java ***fileName***. The file should run and produce output.


    If the above does not work, you may need to first compile the file and then run
    it. To do this, execute the pair of commands:


    ```

    javac ClassName.java

    ```


    ```

    java ClassName.class

    ```


    If a program consists of multiple files, any file that is used by another file
    must be compiled before the file that uses it can be compiled.


    ## 1.8 Hello World


    To begin programming as quickly as possible, you can use the following “Hello
    World” program as a framework. You don’t need to understand it completely in order
    to get started.


    ```

    public class MyClass {

    ```


    ```

    String hello = "Hello World";

    ```


    ```

    public static void main(String[] args) {

    ```


    ```

    new MyClass().doSomething();

    ```


    ```

    }

    ```


    ```

    void doSomething() {

    ```


    ```

    System.out.println(hello);

    ```


    ```

    }

    ```


    ```

    }

    ```


    If saved on a file named MyClass.java, this program can be executed by following
    the instructions in the previous section.


    There are two methods, main and doSomething. The program begins execution in the
    main method. The main method is in a “static context,” which means it can’t directly
    use any methods or variables that aren’t also static. To get out of static context,
    main creates a new object of type MyClass and immediately calls its doSomething
    method; this is where you would put your code. After all this, you can forget
    about the word static until you have a use for it.


    The declaration void doSomething() defines a ***method*** named doSomething. It
    takes no parameters, as indicated by the empty parentheses, and returns no value,
    as indicated by void. The method body is enclosed in braces, {}, and consists
    of a call to the method System.out.println with the argument hello. The println
    will print "Hello World" to ***standard output***, which (depending on how you
    are running Java) should be somewhere on your screen.


    Statements end with a semicolon. There are two statements in the above, one to
    call doSomething and one to print Hello World.


    The names MyClass and doSomething (but not main) may be replaced with names of
    your choosing. By convention, class names always begin with a capital letter,
    and method names with a lowercase letter.


    With HelloWorld as a starting point, you can add methods and code to make a useful
    program.


