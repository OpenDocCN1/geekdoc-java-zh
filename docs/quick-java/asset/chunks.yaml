    ## 3.5 Objects and Classes


    The syntax of classes and objects will be discussed later, but it is helpful to
    begin with some understanding of what these things are.


    Before object-oriented programming, data and functions would be distributed throughout
    a program, perhaps grouped to some extent, but with no formal organization. Object-oriented
    programming provides that organization.


