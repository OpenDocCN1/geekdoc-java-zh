- fmt: "\nIt can be useful to think of Java as consisting of an “inner language” and\
    \ an “outer language.” The inner language consists of data, methods, and statements,\
    \ and is all that is needed for a small program with only a single class. The\
    \ equally complex outer language consists of all the various kinds of classes\
    \ and interfaces used to organize a large program.\n\nAfter some preliminaries,\
    \ the next chapter describes the inner language of Java (which is very like `C`\
    \ or `C++`), and the following chapter describes the outer language.\n\n## 2.1\
    \ IDEs\n\n> **Section summary:** The use of an IDE is strongly recommended. If\
    \ you don’t already use one, IntelliJ IDEA is one of the most beginner-friendly.\n\
    \nYou can create and run complex Java programs with nothing more than a text editor\
    \ and the command line, but this is doing things the hard way.\n\nA professional\
    \ `Integrated Development Environment` (`IDE`) is immeasurably helpful in developing\
    \ programs. A very basic IDE integrates a text editor, a compiler, a debugger,\
    \ and a code executor. A professional-level IDE will also suggest applicable methods,\
    \ provide instant documentation lookup, offer corrections for mistakes, make automatic\
    \ version backups, assist in reorganizing code, and any number of other services.\
    \ I have had students tell me that they succeeded in my course only because their\
    \ IDE wrote their programs for them.\n\nThe objection to a professional IDE is\
    \ that it's a big, complicated program that's hard to learn (comparable to `Microsoft\
    \ Word`, for example). This is undeniably true. My recommendation is to get a\
    \ good, full-featured IDE and use it like a text editor that can run your programs.\
    \ There is no need to learn all its features right away.\n\nThe most popular Java\
    \ IDEs are `Eclipse`, `NetBeans`, `IntelliJ IDEA`, and the Mac-only `Xcode`. All\
    \ are excellent and have ardent users; all have free versions. All can be (and\
    \ are) used for a number of other languages. Of these, IntelliJ IDEA requires\
    \ no prior knowledge of the interface but simply guides the beginning user at\
    \ each step.\n\nThat said, sometimes an IDE will simply refuse to work. This could\
    \ be the result of an upgrade, so that file versions are incompatible, or some\
    \ similar problem. (I have had this problem a lot with `Eclipse`). Reinstalling\
    \ the IDE may help. Exploring all the possible settings may help. And, of course,\
    \ you can switch to a different IDE.\n\nThere are simpler IDEs, often written\
    \ specifically for students, such as `BlueJ`, `JCreator`, and `DrJava`. The advantage\
    \ of a simpler IDE is that it is less intimidating. The disadvantage is that it\
    \ does less to help the programmer.\n\nIt has been said that the hardest program\
    \ to write in any language is “Hello World”; all subsequent programs are just\
    \ elaborations of this one. In the same way, once you successfully use a professional\
    \ IDE to write and execute a program, all the rest is just elaboration.\n\n##\
    \ 2.2 Comments and Tags\n\nThere are three kinds of comments in Java.\n\n*   Comments\
    \ beginning with `//` and continuing to the end of the line.\n    *   When placed\
    \ at the end of a line of code, they say something about that line of code.\n\
    \    *   When placed on a line by itself, they say something about the code that\
    \ follows.\n    *   Many IDEs will comment out an entire block of code by putting\
    \ `//` at the beginning of each line.\n\n*   Comments beginning with `/*` and\
    \ continuing up to `*/`.\n    *   These are used for comments that won’t fit on\
    \ a single line, and they say something about the code that follows.\n    *  \
    \ They may also be used to put a comment in the middle of a line of code.\n\n\
    *   Comments beginning with `/**` and continuing up to `*/`.\n    *   These are\
    \ `documentation (doc) comments`. They are placed immediately before the declaration\
    \ of a class, method, interface, or variable.\n    *   Doc comments are usually\
    \ written with an asterisk at the beginning of each line after the first.\n\n\
    Documentation comments can contain `tags` such as `@param` and `@return`; many\
    \ of these are described in [Section 5.2.1.2](#ch05.xhtml_sec5_002_001_002), Javadoc.\n\
    \nExample:\n\n```java\n/**\n * Returns the sum of two numbers.\n * @param a The\
    \ first number.\n * @param b The second number. Cannot be negative.\n * @return\
    \ the sum of the two numbers.\n * @throws AssertionError if b is negative.\n */\n\
    int add(int a, int b) {\n    assert b >= 0; // ignored unless -ea is set\n   \
    \ while (b > 0) {\n        // Move a 1 from b into a\n        b -= 1;\n      \
    \  a += 1;\n    }\n    return a;\n}\n```\n\nJavadoc is a program that extracts\
    \ the information from doc comments and tags and produces very professional-looking\
    \ documentation, usually but not necessarily as HTML. Non-doc comments are ignored.\n\
    \n# Chapter 3 The “Inner Language” of Java\n\nDOI: [10.1201/9781003402947-3](https://doi.org/10.1201/9781003402947-3)\n\
    \nA Java program consists of one or more classes. This book uses “inner language,”\
    \ to mean what happens within a single, top-level class. For simple programs,\
    \ one class may be all that is needed.\n\n## 3.1 Variables and Naming Conventions\n\
    \nA `variable` is a name that can be assigned a value. A variable can have different\
    \ values at different times.\n\nAll variables must be declared. When a variable\
    \ is declared, it is given a `type` that tells what kind of values it can have.\
    \ It may also be given an initial value. An `int` variable can only have an integer\
    \ value, a `String` variable can only have a character string as its value, and\
    \ so on.\n\nJava is case-sensitive; that is, `result`, `Result`, and `RESULT`\
    \ are three different names. The names of the primitive types (`int`, `double`,\
    \ etc.) are all lowercase, while object type names such as `String` are capitalized.\n\
    \nAn `instance variable` is one that is declared in a class but a separate copy\
    \ of it is “owned” by each individual `instance`, or object, of that class.\n\n\
    A `class variable`, or `static variable`, is declared in a class using the keyword\
    \ `static`. There is only one of it, not one per object, and it is considered\
    \ to be “owned” by the class itself, not by the individual objects.\n\nA `local\
    \ variable` is one that is declared within a method. It is available only within\
    \ that method. `Parameters` to a method are also local to that method.\n\nA `constant`\
    \ is a “variable” whose value cannot be changed. It is indicated by adding the\
    \ keyword `final`.\n\nMany kinds of things in Java have names, not just variables.\
    \ Proper naming and capitalization helps the experienced Java programmer know\
    \ what kind thing is being named. There are strong conventions for names:\n\n\
    *   Variable names and method names are almost never abbreviated: Use `employee`\
    \ rather than `emp`; use `yearEndBonus` rather than `yebonus`. (However, very\
    \ common abbreviations can be used, such as `max` and `min`.)\n*   Variable names\
    \ and method names always begin with a lowercase letter.\n*   Variable names and\
    \ class names are usually nouns. Method names are usually verbs, or begin with\
    \ a verb.\n*   If a name consists of multiple words, the first letter of all words\
    \ except the first is capitalized, for example, `firstName`, `totalCost`. (One\
    \ common name for this style is `camelCase`.)\n*   Although legal, variable names\
    \ never contain the underscore (unless they are constants) or the dollar sign.\n\
    \    *   In Java 9 and later, underscores in names are discouraged (except for\
    \ constants), and an underscore by itself is not a legal name.\n*   The names\
    \ of constants are written in all capital letters. If the constant name consists\
    \ of multiple words, underscores are used between the words. For example, `END_OF_LINE_MARKER`.\n\
    *   Class names and interface names always begin with a capital letter, and multiword\
    \ names are camel case.\n\n## 3.2 Basic Data Types\n\nThere are eight `primitive`\
    \ data types: `char`, `byte`, `short`, `int`, `long`, `float`, `double`, and `boolean`.\
    \ All other values (arrays, strings, etc.) are of some class, or object, type.\
    \ The distinction is important.\n"
  raw: "It can be useful to think of Java as consisting of an “inner language” and\
    \ an “outer language.” The inner language consists of data, methods, and statements,\
    \ and is all that is needed for a small program with only a single class. The\
    \ equally complex outer language consists of all the various kinds of classes\
    \ and interfaces used to organize a large program.\n\nAfter some preliminaries,\
    \ the next chapter describes the inner language of Java (which is very like C\
    \ or C++), and the following chapter describes the outer language.\n\n## 2.1 IDEs\n\
    \n> **Section summary:** The use of an IDE is strongly recommended. If you don’t\
    \ already use one, IntelliJ IDEA is one of the most beginner-friendly.\n\nYou\
    \ can create and run complex Java programs with nothing more than a text editor\
    \ and the command line, but this is doing things the hard way.\n\nA professional\
    \ ***Integrated Development Environment*** (***IDE***) is immeasurably helpful\
    \ in developing programs. A very basic IDE integrates a text editor, a compiler,\
    \ a debugger, and a code executor. A professional-level IDE will also suggest\
    \ applicable methods, provide instant documentation lookup, offer corrections\
    \ for mistakes, make automatic version backups, assist in reorganizing code, and\
    \ any number of other services. I have had students tell me that they succeeded\
    \ in my course only because their IDE wrote their programs for them.\n\nThe objection\
    \ to a professional IDE is that it's a big, complicated program that's hard to\
    \ learn (comparable to Microsoft Word, for example). This is undeniably true.\
    \ My recommendation is to get a good, full-featured IDE and use it like a text\
    \ editor that can run your programs. There is no need to learn all its features\
    \ right away.\n\nThe most popular Java IDEs are *Eclipse*, *NetBeans*, *IntelliJ\
    \ IDEA*, and the Mac-only *Xcode*. All are excellent and have ardent users; all\
    \ have free versions. All can be (and are) used for a number of other languages.\
    \ Of these, IntelliJ IDEA requires no prior knowledge of the interface but simply\
    \ guides the beginning user at each step.\n\nThat said, sometimes an IDE will\
    \ simply refuse to work. This could be the result of an upgrade, so that file\
    \ versions are incompatible, or some similar problem. (I have had this problem\
    \ a lot with Eclipse.) Reinstalling the IDE may help. Exploring all the possible\
    \ settings may help. And, of course, you can switch to a different IDE.\n\nThere\
    \ are simpler IDEs, often written specifically for students, such as *BlueJ*,\
    \ *JCreator*, and *DrJava*. The advantage of a simpler IDE is that it is less\
    \ intimidating. The disadvantage is that it does less to help the programmer.\n\
    \nIt has been said that the hardest program to write in any language is “Hello\
    \ World”; all subsequent programs are just elaborations of this one. In the same\
    \ way, once you successfully use a professional IDE to write and execute a program,\
    \ all the rest is just elaboration.\n\n## 2.2 Comments and Tags\n\nThere are three\
    \ kinds of comments in Java.\n\n*   Comments beginning with // and continuing\
    \ to the end of the line.\n\n    *   When placed at the end of a line of code,\
    \ they say something about that line of code.\n\n    *   When placed on a line\
    \ by itself, they say something about the code that follows.\n\n    *   Many IDEs\
    \ will comment out an entire block of code by putting // at the beginning of each\
    \ line.\n\n*   Comments beginning with /* and continuing up to */.\n\n    *  \
    \ These are used for comments that won’t fit on a single line, and they say something\
    \ about the code that follows.\n\n    *   They may also be used to put a comment\
    \ in the middle of a line of code.\n\n*   Comments beginning with /** and continuing\
    \ up to */.\n\n    *   These are ***documentation (doc) comments***. They are\
    \ placed immediately before the declaration of a class, method, interface, or\
    \ variable.\n\n    *   Doc comments are usually written with an asterisk at the\
    \ beginning of each line after the first.\n\nDocumentation comments can contain\
    \ ***tags*** such as @param and @return; many of these are described in [Section\
    \ 5.2.1.2](#ch05.xhtml_sec5_002_001_002), Javadoc.\n\nExample:\n\n```\n/**\n```\n\
    \n```\n* Returns the sum of two numbers.\n```\n\n```\n* @param a The first number.\n\
    ```\n\n```\n* @param b The second number. Cannot be negative.\n```\n\n```\n* @return\
    \ the sum of the two numbers.\n```\n\n```\n* @throws AssertionError if b is negative.\n\
    ```\n\n```\n*/\n```\n\n```\nint add(int a, int b) {\n```\n\n```\nassert b >= 0;\
    \ // ignored unless -ea is set\n```\n\n```\nwhile (b > 0) {\n```\n\n```\n// Move\
    \ a 1 from b into a\n```\n\n```\nb -= 1;\n```\n\n```\na += 1;\n```\n\n```\n}\n\
    ```\n\n```\nreturn a;\n```\n\n```\n}\n```\n\nJavadoc is a program that extracts\
    \ the information from doc comments and tags and produces very professional-looking\
    \ documentation, usually but not necessarily as HTML. Non-doc comments are ignored.\n\
    \n# Chapter 3 The “Inner Language” of Java\n\nDOI: [10.1201/9781003402947-3](https://doi.org/10.1201/9781003402947-3)\n\
    \nA Java program consists of one or more classes. This book uses “inner language,”\
    \ to mean what happens within a single, top-level class. For simple programs,\
    \ one class may be all that is needed.\n\n## 3.1 Variables and Naming Conventions\n\
    \nA ***variable*** is a name that can be assigned a value. A variable can have\
    \ different values at different times.\n\nAll variables must be declared. When\
    \ a variable is declared, it is given a ***type*** that tells what kind of values\
    \ it can have. It may also be given an initial value. An int variable can only\
    \ have an integer value, a String variable can only have a character string as\
    \ its value, and so on.\n\nJava is case-sensitive; that is, result, Result, and\
    \ RESULT are three different names. The names of the primitive types (int, double,\
    \ etc.) are all lowercase, while object type names such as String are capitalized.\n\
    \nAn ***instance variable*** is one that is declared in a class but a separate\
    \ copy of it is “owned” by each individual ***instance***, or object, of that\
    \ class.\n\nA ***class variable***, or ***static variable***, is declared in a\
    \ class using the keyword static. There is only one of it, not one per object,\
    \ and it is considered to be “owned” by the class itself, not by the individual\
    \ objects.\n\nA ***local variable*** is one that is declared within a method.\
    \ It is available only within that method. ***Parameters*** to a method are also\
    \ local to that method.\n\nA ***constant*** is a “variable” whose value cannot\
    \ be changed. It is indicated by adding the keyword final.\n\nMany kinds of things\
    \ in Java have names, not just variables. Proper naming and capitalization helps\
    \ the experienced Java programmer know what kind of thing is being named. There\
    \ are strong conventions for names:\n\n*   Variable names and method names are\
    \ almost never abbreviated: Use employee rather than emp; use yearEndBonus rather\
    \ than yebonus. (However, very common abbreviations can be used, such as max and\
    \ min.)\n\n*   Variable names and method names always begin with a lowercase letter.\n\
    \n*   Variable names and class names are usually nouns. Method names are usually\
    \ verbs, or begin with a verb.\n\n*   If a name consists of multiple words, the\
    \ first letter of all words except the first is capitalized, for example, firstName,\
    \ totalCost. (One common name for this style is ***camelCase***.)\n\n*   Although\
    \ legal, variable names never contain the underscore (unless they are constants)\
    \ or the dollar sign.\n\n    *   In Java 9 and later, underscores in names are\
    \ discouraged (except for constants), and an underscore by itself is not a legal\
    \ name.\n\n*   The names of constants are written in all capital letters. If the\
    \ constant name consists of multiple words, underscores are used between the words.\
    \ For example, END_OF_LINE_MARKER.\n\n*   Class names and interface names always\
    \ begin with a capital letter, and multiword names are camel case.\n\n## 3.2 Basic\
    \ Data Types\n\nThere are eight ***primitive*** data types: char, byte, short,\
    \ int, long, float, double, and boolean. All other values (arrays, strings, etc.)\
    \ are of some class, or object, type. The distinction is important."
