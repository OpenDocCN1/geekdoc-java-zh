    \ {\n            @Override\n            public void actionPerformed(ActionEvent\
    \ e) {\n                makeOneStep();\n            }\n        });\n        timer.stop();\n\
    \    }\n\n    /**\n     * 设置球应该反弹\n     * 跳的“墙”。\n     * @param xLimit 右墙（像素）。\n\
    \     * @param yLimit 地板（像素）。\n     */\n    public void setLimits(int xLimit,\
    \ int yLimit) {\n        this.xLimit = xLimit - 20;\n        this.yLimit = yLimit\
    \ - 20;\n        position = new Point(Math.min(position.x, xLimit), Math.min(position.y,\
    \ yLimit));\n    }\n\n    /**\n     * @return 球的位置。\n     */\n    public Point\
    \ getPosition() {\n        return position;\n    }\n\n    /**\n     * 让球开始移动。这通过\n\
    \     * 启动定时器来实现，\n     * 定期让球移动“一步”。\n     */\n    public void start() {\n  \
    \      timer.start();\n    }\n\n    /**\n     * 让球停在原地。\n     */\n    public void\
    \ pause() {\n        timer.stop();\n    }\n\n    /**\n     * 让球按照它移动的方向\n    \
    \ * 进一步。\n     * 如果它撞到墙，它的运动方向\n     * 就会改变。该方法\n     * 然后触发 PropertyChange 事件。\n\
    \     */\n    public void makeOneStep() {\n        // 执行工作\n        position.x\
    \ += dx;\n        if (position.x < 0 || position.x >= xLimit) {\n            dx\
    \ = -dx;\n            position.x += dx;\n        }\n        position.y += dy;\n\
    \        if (position.y < 0 || position.y >= yLimit) {\n            dy = -dy;\n\
    \            position.y += dy;\n        }\n        this.pcs.firePropertyChange(\"\
    position\", null, position);\n    }\n}\n```\n"
