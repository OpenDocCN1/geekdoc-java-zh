  trans: "\n方法属于对象，因此要“调用”一个方法，从技术上讲是在“向对象发送消息”。操作方法是：命名对象，加一个点号，然后写出方法的名称，并在括号中提供正确数量和类型的\
    \ `arguments`（参数）。每个参数都是一个表达式（可能是一个单一的值或变量）。\n\n```\nobj.methodName(arguments)\n\
    ```\n\n每个参数必须对应一个参数，且该参数的类型必须是可以赋值给该参数的。被调用的方法返回一个结果，该结果可以在后续表达式中使用。当方法调用同一类中的另一个方法时（即对象在“自言自语”），`obj`\
    \ 可以关键字 `this`，也可以省略。例如，如果 `isLeapYear` 和 `printLengthOfYear` 在同一个类中，那么在 `printLengthOfYear`\
    \ 中，你可以说 `this.isLeapYear(year)` 或者直接说 `isLeapYear(year)`。\n\n```java\npublic\
    \ void printLengthOfYear(int year) {\n    int days = 365;\n    if (isLeapYear(year))\
    \ { // 省略了 \"this.\"\n        days = 366;\n    }\n    System.out.println(year\
    \ + \" has \" + days + \" days.\");\n}\n```\n\n### 3.2.10 重载\n\n方法可以被**重载**（overloaded）。也就是说，一个类可以拥有两个或多个相同的方法，只要这些方法的参数数量（`number`）或类型（`types`）不同。例如，一个类可能有两个或多个名为\
    \ `bump` 的方法。\n\n类型不需要完全匹配。如果没有精确匹配，但参数可以宽化（widened）为适当的类型，那么就可以使用该方法。例如，`bump(int\
    \ n)` 方法可以用 `char` 参数调用，但不能用 `double` 参数调用。\n\n如果我们添加一个 `bump(char n)` 方法，那么带有\
    \ `char` 参数的 `bump` 消息将调用这个新方法，而不是期望 `int` 参数的方法。\n\n构造方法和方法一样，也可以被重载。\n\nJava\
    \ 提供的许多方法都是重载的。例如，`System.out.print(arg)` 有九个版本，`System.out.println(arg)` 有十个版本。这些方法为\
    \ `boolean`、`char`、`double`、`float`、`int`、`long`、`Object`、`String` 和 `char[]`\
    \ 各自提供了独立的版本。（没有为 `byte` 和 `short` 提供独立版本，因为它们可以被宽化并由 `int` 方法使用。）`println` 还有一个额外的版本不接受参数，并打印空行。\n\
    \n### 3.2.11 作用域\n\n每个变量都有一个作用域（`scope`），即变量可以使用程序部分。作用域取决于变量声明的位置。\n\n#### 3.2.11.1\
    \ 类中声明的变量\n\n在类内部声明的变量在类的任何地方都是可用的。如果声明变量时赋予了初始值，则该值可以在后续的声明中使用。\n\n```java\n\
    public class MyClass {\n    int x = 5;\n    int y = x + 1; // 在这里可以使用 x\n    int\
    \ z = w + 1; // 但这是非法的\n    // 现在我们可以使用 x, y 和 z\n    int w = 3;\n    // 现在我们也可以使用\
    \ w\n    …\n}\n```\n\n这里有一种理解方式：当类第一次被使用时，Java 会按照它们出现的顺序执行所有的顶层声明（即那些不在方法中的声明）。之后，类中的方法就可以使用了。\n\
    \n> **异常：**类中的静态方法（如 `main` 方法）只能使用该类中的静态变量。\n\n#### 3.2.11.2 方法中声明的变量\n\n`block`（块）或\
    \ `compound statement`（复合语句）是一组被大括号 {} 括起来的声明和/或语句。\n\n一个 `method`（方法）由一个头部（`header`）和一个正文（`body`）组成；主体是一个\
    \ `block`。\n\n```java\npublic double average(double x, double y) {\n    double\
    \ sum = x + y;\n    return sum / 2;\n}\n```\n\n参数（在本例中为 `x` 和 `y`）可以在方法的任何地方使用，但在方法外部不可用。在体内声明的变量（在本例中为\
    \ `sum`）遵循块的作用域规则（见节）。\n\n参数和在体内声明的变量是**局部变量**（`local variables`）；它们在方法被调用（使用）时创建，在方法返回时丢弃。局部变量不会保留从一次方法调用到下一次调的值；每次调用都从头开始。\n\
    \n#### 3.2.11.3 块中声明的变量\n\n在块中声明的变量从声明点到块的结束处都是可访问的（可以使用的）。例如：\n\n```java\n{\n\
    \    x = 1; // 非法！\n    int x; // \"x\" 的作用域从这里开始\n    x = 2; // 合法\n} // \"x\"\
    \ 的作用域在此结束\nx = 3; // 非法！\n```\n\n变量声明通常放在块的开头。\n\n### 3.3 语句类型\n\nJava 和 C++\
    \ 都大量借鉴了 C 语言，许多语句类型是相同的。一个显著的区别是在 Java 中，`if`、`while` 或 `for` 语句的 `condition`（条件）*必须*是一个结果产生布尔值的表达式，而不是其他类型。\n\
    \n以下语句在 C++ 中不存在，或与 C++ 有显著差异：\n\n- `variable = expression;`\n- `expression;`\n\
    - `{ statements }`\n- `if (condition) { statements }`\n- `if (condition) { statements\
    \ } else { statements }`\n- `while (condition) { statements }`\n- `for (initialization;\
    \ condition; update) { statements }`\n- `for (variable: collection) { statements\
    \ }`\n- `do { statements } while (condition)`\n- `switch (expression) { case value1:\
    \ statements1 case value2: statements2 … default: statementsdef }`\n- `label:\
    \ statement;`\n- `break;`\n- `break label;`\n- `continue;`\n- `continue label;`\n\
    - `return value;`\n- `return;`\n- `;` // 空语句\n\nJava 的格式是将控制语句的左大括号放在控制语句同一行，并将右大括号与控制语句对齐。即使块只包含语句，Java\
    \ 程序员也鼓励使用大括号。\n\n- `try { statements } catch (ExceptionType variable) { statements\
    \ } finally { statements }`\n- `throw Exception;`\n\n### 3.3.1 C++ 中也有的语句\n\n\
    如果你来自 C++ 或其他 C 类型语言，你可能已经熟悉本节中的所有内容。它们都是普通的循环、条件语句、赋值、块等等。你可以直接跳到[ 3.3.2 节]，C++\
    \ 中不存在的语句。\n\n#### 3.3.1.1 块\n\n`compound statement` 或 `block` 是被大括号 {} 括起来的若干（可能为零）声明和语句。\n\
    \n"
- fmt: "\nControl statements, such as if statements and loops, control the execution\
    \ of a single statement. If you want to control more than just one statement,\
    \ you must enclose those statements in braces, `{}`, to make them into a (single)\
    \ compound statement.\n\n> **Style:** Standard Java style is to put an opening\
    \ brace at the end of a line, never on a line by itself. The closing brace should\
    \ be indented the same amount as the line containing the opening brace.\n\nThe\
    \ body of a class or method must always be a block.\n\nGood style dictates that\
    \ statements within a block be indented relative to the start of the block. The\
    \ usual indentation for Java is four spaces.\n\n### 3.3.1.2 Assignment Statements\n\
    \nAn `assignment statement` assigns a value to a variable. For example, if `x`\
    \ is of type `int`, then\n\n```\nx = 5;\n```\n\ngives `x` the value `5`.\n\nThe\
    \ value of a variable, but not its type, may be changed. For example, the assignment\
    \ statement\n\n```\nx = 10;\n```\n\nwill give `x` the new value `10`.\n\nFor each\
    \ arithmetic operator `op`, the expression\n\n```\nvariable op= expression;\n\
    ```\n\nis shorthand for\n\n```\nvariable = variable op expression;\n```\n\nFor\
    \ example, `x += 1;` adds `1` to `x`.\n\n### 3.3.1.3 Method Calls and Varargs\n\
    \nMethod calls can be used as statements, because they can have side effects.\
    \ For example, if `a` is an array, `a.sort()` sorts the array.\n\nMethods that\
    \ have no side effects should not be used as statements, because they don’t do\
    \ anything. If `str` is the string `\"Hello\"`, the expression `str.toUpperCase()`\
    \ returns the string `\"HELLO\"`, and this can be assigned to a variable, but\
    \ does not change the value of `str`. Hence, using `str.toUpperCase()` as a statement\
    \ does nothing.\n\nYou can write a method that takes a variable number of arguments,\
    \ or `varargs`. Simply put three dots after the type name of the last parameter.\
    \ When the method is called, Java puts all those last values into an array for\
    \ you.\n\n```\npublic double average(double… args) {\n    double sum = 0;\n  \
    \  for (double arg: args) {\n        sum += arg;\n    }\n    return sum / args.length;\n\
    }\n```\n\nThe call `average(10.0, 20.0, 30, 41.0)` will return `25.25`.\n\n###\
    \ 3.3.1.4 If Statements\n\nAn if statement tests a condition. If the condition\
    \ is true, the following statement (typically, a compound statement) is executed.\
    \ If the condition is not true, the if statement does nothing. The syntax is:\n\
    \n```\nif (condition) {\n    statements\n}\n```\n\nFor example, the following\
    \ if statement resets `x` to zero if it has become negative.\n\n```\nif (x < 0)\
    \ {\n    x = 0;\n}\n```\n\nAn if statement may also have an `else` clause. If\
    \ the condition is true, the statement following the condition is executed. If\
    \ the condition is not true, the statement following the keyword `else` is executed.\
    \ Both statements are typically compound statements. The syntax is:\n\n```\nif\
    \ (condition) {\n    some statements\n} else {\n    some other statements\n}\n\
    ```\n\nFor example,\n\n```\nif (x % 2 == 0) {\n    x = x / 2;\n} else {\n    x\
    \ = 3 * x + 1\n}\n```\n\nIt is good style to always use the braces, even if they\
    \ include only a single statement. However, if either part contains just one (non-compound)\
    \ statement, it is legal to omit the braces. If you do this, you should put the\
    \ single statement on the same line as the `if` or the `else`.\n\n```\nif (x %\
    \ 2 == 0) x = x / 2;\nelse x = 3 * x + 1;\n```\n\nJava, unlike Python, has no\
    \ single keyword as an abbreviation for `else if.\n\n```\nif (x < 0) {\n    System.out.println(\"\
    x is negative\");\n} else if (x > 0) {\n    System.out.println(\"x is positive\"\
    );\n} else {\n    System.out.println(\"x is zero\");\n}\n```\n\n### 3.3.1.5 While\
    \ Loops\n\nA while loop is a loop with the test at the top. The syntax is:\n\n\
    ```\nwhile (condition) {\n    statements\n}\n```\n\nFirst, the `condition` is\
    \ tested; if it is false, nothing more is done, and the loop exits without ever\
    \ executing the `statements`. If the `condition` is true, the `statements` are\
    \ executed, then the entire loop (starting with the test) is executed again.\n\
    \nFor example, the number of digits in a nonzero number can be computed by:\n\n\
    ```\nint countDigits(int number) {\n    int count = 0;\n    while (number != 0)\
    \ {\n        number = number / 10;\n        count += 1;\n    }\n    return count;\n\
    }\n```\n\n### 3.3.1.6 Do-while Loops\n\nA do-while loop is a loop with the test\
    \ at the bottom, rather than the top. The syntax is:\n\n```\ndo {\n    statements\n\
    } while (condition);\n```\n\nFirst, the `statements` are executed, then the `condition`\
    \ is tested; if it is true, the entire loop is executed again. If the `condition`\
    \ is false, the loop exits.\n\nFor example, suppose you want to choose a random\
    \ number between 0 and 1000 that is divisible by 7. You cannot test the number\
    \ until after you have chosen it, so do-while is appropriate.\n\n```\nRandom rand\
    \ = new Random();\nint x;\ndo {\n    x = rand.nextInt(1000);\n} while (x % 7 !=\
    \ 0);\n```\n\nUnlike other kinds of control statement, the braces in a do-while\
    \ are required, even if only one statement is in the loop. The following code\
    \ does not work:\n\n```\ndo {\n    int x = rand.nextInt(1000);\n} while (x % 7\
    \ != 0); // error\n```\n\n### 3.3.1.7 Traditional For Loops\n\nA for loop is a\
    \ loop with the test at the top. The syntax is:\n\n```\nfor (initialization; condition;\
    \ update) {\n    statements\n}\n```\n\nThe `initialization` is performed first,\
    \ and only once. After that, the `condition` is tested and, if true, the `statements`\
    \ are executed and the `update` is performed; then control returns to the `condition`.\
    \ In other words, the for loop behaves almost exactly like the following while\
    \ loop:\n\n```\ninitialization;\nwhile (condition) {\n    statements;\n    update;\n\
    }\n```\n\nThe `initialization` is typically either an assignment to a previously\
    \ declared variable, for example, `i = 0`, or a combined declaration and assignment,\
    \ for example, `int i = 0`. The `update` is typically an assignment statement\
    \ such as `i += 1`.\n\nThe scope of any variable declared in the `initialization`\
    \ (that is, where the variable can be used), is the entire for statement.\n"
