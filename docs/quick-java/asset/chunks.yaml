    ### 4.1.2 The Class Header


    The class header may be as simple as the word class followed by the name of the
    class, or it may be as complex as the following:


    ```

    access class ClassName extends SuperClass

    ```


    ```

    implements Interface1, … , InterfaceN

    ```


    The ***access*** may be either public or omitted:


    *   public: Can be seen and used anywhere in the project.


    *   ***package***: (default, no keyword) Can be seen and used by any classes in
    the same package (directory). The package keyword, which specifies which directory
    this class is in, cannot be used here.


    There are two additional access types:


    *   protected: Can be seen and used by any classes in the same directory, and
    by any subclasses of this class, wherever they may be.


    *   private: Can be seen and used only within this one class and, if in an inner
    class, by its enclosing classes.


    Fields and methods can be labeled with any one of the above access types, with
    “package” as the default. Local variables of a method cannot be so labeled; they’re
    just local.


    By convention, the ***ClassName*** should begin with a capital letter. It defines
    a ***type***; every object created from this class will be of type ***ClassName***.


    Classes are arranged in a hierarchy, with the Object class at the root (top) of
    the hierarchy. Every class except Object ***extends*** one other class, called
    its ***superclass***, and inherits data and methods from that superclass. If the
    superclass is omitted, Object is assumed.


    Briefly, ***inheritance*** means that if class B extends class A, then all the
    data and methods in A are also part of B. B can ***extend*** what it receives
    from A by defining additional data and methods. This will be examined in detail
    in [section 4.2](#ch04.xhtml_sec4_2).


    The class may also ***implement*** some interfaces, as described briefly in the
    next section.


    ### 4.1.3 Interfaces I


    An ***interface*** is a list of methods—just the method headers, not the body.
    A class that implements an interface must supply those methods, with the same
    headers but also with a body. For example, the String class implements the CharSequence
    interface, and that interface requires the String class to supply several methods,
    among them charAt(***index***), length(), and isEmpty().


    A class may extend another class, thus inheriting all its fields and methods.
    Similarly, an interface may extend another interface, thus inheriting additional
    methods to be implemented.


    The purpose of an interface is to provide a common set of methods used by similar
    classes. For example, StringBuilder (see [section 3.4.1.2](#ch03.xhtml_sec3_004_001_002))
    also implements CharSequence, therefore it also has the methods charAt(***index***),
    length(), and isEmpty(), along with many others not possessed by the String class.


    The syntax of interfaces will be described in [section 5.3.2](#ch05.xhtml_sec5_003_002).


    ### 4.1.4 Fields


    A class typically contains ***fields*** (or more accurately, ***field declarations***).
    This is where data is kept. It is the values in these fields that make one object
    different from another object of the same type.


    A field declaration looks like this:


    ```

    static access type fieldName = expression;

    ```


    If the word static is present, then there is only one copy of the variable being
    defined, and it is shared by all instances of the class. Otherwise, every object
    created from this class has its own copy of the ***fieldName*** variable. In the
    Password class mentioned earlier, every object of that type has its own password
    field.


    > **Terminology:** An object is an ***instance*** of its class, so a field belonging
    to an object is also called an ***instance variable***. A static variable belongs
    to the class itself, and is also called a ***class variable***.


    The ***access*** can be omitted (“package” access), or it can be either public,
    protected, or private.


    Most fields should be marked private. Any fields that are not private can be accessed
    by other classes. As a program is being developed, or later updated, other classes
    may come to depend on these non-private variables, and this (possible) dependency
    makes it difficult or impossible to update or modify the class without the danger
    of breaking some code somewhere. Instead, all access to fields should be under
    the control of the methods in the class. This is how it is done in the Java-supplied
    classes, and how you should do it.


    > **Note:** Private fields are private *to the class, not* to the object. Objects
    have no privacy from other objects of the same type. For example, code in the
    Password class (see [section 4.1.1](#ch04.xhtml_sec4_001_001)) can access not
    only this.password, but also john.password, jane.password, and so on.


    The ***type*** of a field can be the name of any primitive type (int, double,
    etc.) or the name of any class type (String, Exception, Password, etc.).


    By convention, each ***fieldName*** should begin with a lowercase letter.


    The ***expression***, if present, is typically just a simple value, though it
    can be an expression involving any fields defined above it.


    Examples:


    ```

    String name;

    ```


    ```

    double length = 22.75;

    ```


    ```

    private int count = 0;

    ```


    ### 4.1.5 Constructors I


    The purpose of a constructor is to create an object in a valid state. No other
    work should be done in a constructor.


    A constructor looks a lot like a method, but the ***returnType*** and ***methodName***
    are replaced by the ***ClassName***. The syntax is


    ```

    /** documentation comment */

    ```


    ```

    access ClassName(parameterList) {

    ```


    ```

    declarations

    ```


    ```

    statements

    ```


    ```

    }

    ```


    In a constructor, the keyword this refers to the object being constructed.


    A constructor typically doesn’t declare any local variables; all it does is use
    its parameters to assign values to the instance variables. For convenience, it
    is common for the parameters to have the same names as the instance variables,
    so a constructor may consist of little more than some assignments of the form
    this.***name*** = ***name***;.


    For example, you might have a class Customer that starts out like this:


    ```

    public class Customer {

    ```


    ```

    String name;

    ```


    ```

    String address;

    ```


    ```

    double amountOwed = 0;

    ```


    ```

    /** Here is the constructor */

    ```


    ```

    Customer(String name, String address) {

    ```


    ```

    this.name = name;

    ```


    ```

    this.address = address;

    ```


    ```

    }

    ```


    ```

    }

    ```


    Here, this.name and this.address refer to the instance variables, while name and
    address refer to the parameters.


    The constructor is called with the keyword new. For example,


    ```

    Customer c = new Customer("Jane", "jane@aol");

    ```


    The newly created object is returned as the value of the call to the constructor.
    No return statement is necessary in a constructor.


