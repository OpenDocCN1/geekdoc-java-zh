    ### 3.3.2 Statements Not in C++


    The following statements are either not in C++ at all, or they are sufficiently
    different to warrant additional explanation.


    #### 3.3.2.1 Assert Statements


    The assert statement is unusual in that it usually “doesn''t do anything.” Rather,
    it is a form of executable documentation: you are *asserting* that something is
    true. There are two forms:


    ```

    assert booleanExpression;

    ```


    ```

    assert booleanExpression : expression;

    ```


    Execution is as follows. The ***booleanExpression*** is evaluated, and if true,
    control just passes to the next statement. But if it is false, an AssertionError
    is thrown. If the second form is used, the value of the ***expression*** (which
    may be any type) is included in the error message.


    By default, assertions are treated like comments. To make assert statements executable,
    use the VM flag -enableassertions or its abbreviation -ea.


    > **Note:** When running from a command line, ***VM*** (***Virtual Machine***)
    flags may be placed after the word java. When running from an IDE, flags will
    be a configuration option.


    The purpose of the assert statement is to state some condition that you believe
    will always be true at that point in the program. It should not be used to check
    for possible error conditions that you believe could happen; for that, you should
    throw an exception (see [section 3.3.2.6](#ch03.xhtml_sec3_003_002_006)).


    It is a good idea to get into the habit of putting in assert statements, as appropriate,
    when you write the code.


    There is little point in using the second form (with ***expression***) unless
    you have something useful to add. For example, if you believe that some array
    index i is always within the array bounds, you might say


    ```

    assert i >= 0 && i < myArray.length:

    ```


    ```

    "Bad array index:" + i;

    ```


    Finally, the idiom assert false; can be used to indicate that you believe that
    a certain section of code (for example, the default case of a switch statement)
    can never be reached. However, it is a syntax error to put this (or any other)
    statement in a location that the Java compiler knows cannot be reached, such as
    immediately following a return statement.


    #### 3.3.2.2 Print “Statements”


    There are two “statements” that can print a message to the user. They are


    ```

    System.out.println(value);

    ```


    and


    ```

    System.out.print(value);

    ```


    The difference is that print just prints a string representation of the ***value***,
    while println prints that string followed by a newline character. That is, the
    next thing printed after a print will be on the same line, but the next thing
    printed after a println will be on a new line.


    Although print and println are used as if they were statements, they are actually
    methods that have the ***side effect*** of displaying something on your screen.
    (Method calls which do not have side effects can also be used as statements, but
    this is usually pointless, since the return value is ignored.)


    If the ***value*** is an object type, print and println will call its toString
    method to get a printable representation of the object. This gives you considerable
    control over how your objects are printed (see [section 4.4.1](#ch04.xhtml_sec4_004_001)).


    It is often convenient to construct a string (using “+” to join the parts) directly
    in the parameter list of a call to print or println. Anything “added” to a string
    will be converted to a string.


    ```

    System.out.println("The sum is" + sum);

    ```


    > **Technical note:** System is the name of a class in the java.lang package,
    and out is an object of type PrintStream in the System class. The PrintStream
    class has several methods, including print and println. You don’t need to know
    this in order to use the methods.


    Printing to the screen is easy, but getting input from the keyboard requires the
    use of a Scanner object, covered in [section 3.4.1.3](#ch03.xhtml_sec3_004_001_003).


    #### 3.3.2.3 Switch Statements and Expressions


    Java 14 introduced a significantly improved version of the switch statement. (The
    old version is still available.) The new version can be used either as a statement
    or as an *expression* that returns a value. The syntax is:


    ```

    switch (expression) {

    ```


    ```

    case constants1 -> action1

    ```


    ```

    case constants2 -> action2

    ```


    ```

    …

    ```


    ```

    case constantsN -> actionN

    ```


    ```

    default -> actiondef

    ```


    ```

    }

    ```


    The ***expression*** must result in an integer, String, or Enum value.


    The ***constants*** are comma-separated lists of one or more values of the same
    type as ***expression***. Constants may not be duplicated.


    The switch, whether used as a statement or as an expression, evaluates the ***expression***,
    chooses a case whose ***constant*** is equal to that of ***expression***, and
    executes the one ***action*** associated with that constant. If no constant matches,
    the default action is executed.


    > **Note:** Unlike the “classic” switch statement, there is no “fall through”
    to the next action.


    When switch is used as a statement, each ***action*** is a single statement, possibly
    a compound statement. The default case is optional; if no constant is matched
    and there is no default case, the statement does nothing.


    When switch is used as an expression, each ***action*** may be


    *   An expression of the correct type to be used as the value of the switch.


    *   A compound statement, containing a statement of the form yield ***expression***.
    The yield acts rather like a return statement in a method; it causes the switch
    to exit with the expression as its value.


    *   A throw statement.


    When switch is used as an expression, it *must* either return a value or throw
    an exception. In practical terms, this means that either the default case is required,
    or the ***constants*** include every possible value of an Enum.


    The following nonsensical example illustrates the use of switch as an expression.


    ```

    long nonsense = switch (i) {

    ```


    ```

    case 1 -> 1000000000000L;

    ```


    ```

    case 2 -> 17 * x;

    ```


    ```

    case 3, 4 -> ''a'';

    ```


    ```

    case 5 -> {

    ```


    ```

    System.out.println("Five!");

    ```


    ```

    yield 55;

    ```


    ```

    }

    ```


    ```

    case 6 -> throw new RuntimeException();

    ```


    ```

    default -> -1;

    ```


    ```

    };

    ```


    ```

    System.out.println(nonsense);

    ```


    #### 3.3.2.4 Pattern Matching in switch Statements


    As mentioned in the previous section, Java 14 introduced a new form of the switch
    statement, as well as a switch *expression*, using arrows (->) instead of colons
    (:). Java 17 greatly expands what switch statements and expressions can do, using
    pattern matching.


    > **Warning:** Pattern matching is a ***preview feature*** of Java 17\. This means
    (1) it may change or disappear in future versions of Java, and (2) you may have
    to set the enable-preview flag in order to use it.


    Despite the name, pattern matching has nothing to do with regular expressions.
    Instead, the switching is done on the *type* of an expression, and the result
    of the expression is assigned to a new variable.


    ```

    switch (expression) {

    ```


    ```

    case Type1 variable1 -> action1

    ```


    ```

    case Type2 variable2 -> action2

    ```


    ```

    …

    ```


    ```

    case TypeN variableN -> actionN

    ```


    ```

    default -> actiondef

    ```


    ```

    }

    ```'
