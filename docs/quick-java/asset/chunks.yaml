    Not all collection types allow this operation.


    ### 5.2.4 Additional Operators


    With the exception of the instanceof operator, Java''s operators are one, two,
    or three non-alphabetic characters.


    #### 5.2.4.1 instanceof


    The instanceof operator tests whether a given object *can* be cast to a given
    type, but it''s up to the programmer to actually perform the cast:


    ```

    if (obj instanceof String) {

    ```


    ```

    String s = (String)obj;

    ```


    ```

    … use s …

    ```


    ```

    }

    ```


    Since Java 14, these can now be combined:


    ```

    if (obj instanceof String s) {

    ```


    ```

    … use s …

    ```


    ```

    }

    ```


    #### 5.2.4.2 The Ternary Operator


    Java has a ***ternary operator***, which is like an if-then-else for expressions
    rather than for statements. That is, it can be used as an expression or as part
    of an expression.


    The syntax is:


    ```

    booleanExpression ? valueIfTrue: valueIfFalse

    ```


    For example:


    ```

    larger = a > b ? a: b;

    ```


    or even


    ```

    String s = "n is " + (n % 2 == 0 ? "even": "odd");

    ```


    The ***valueIfTrue*** and ***valueIfFalse*** do not need to be the same type,
    but either type must be legal in the context.'
