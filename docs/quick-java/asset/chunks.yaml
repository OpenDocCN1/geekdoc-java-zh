  trans: "\n当 `main` 方法运行时，结果将将会是 223 和 225。\n\n### 5.3.5.3 局部内部类\n\n`局部内部类`定义在方法内部，并适用通用的作用域规则。它只在相应方法内是可见的，因此访问限制（public,\
    \ protected, package）并不适用。但是，由于从该类创建的对象（及其方法）在方法返回后可能仍然存在，因此局部内部类不允许使用方法的参数或非最终（non-final）局部变量。\n\
    \n```java\npublic class OuterClass {\nint outerVariable = 10000;\nstatic int staticOuterVariable\
    \ = 2000;\npublic static void main(String[] args) {\nOuterClass outer = new OuterClass();\n\
