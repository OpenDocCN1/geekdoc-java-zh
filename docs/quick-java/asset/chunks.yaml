  trans: "\n在每一步中，`x` 位置移动 `dx`，`y` 位置移动 `dy`。当球移动得太靠左或太靠右时，会发生“反弹”，这通过改变 `dx` 的符号位来实现。\n\
    \n```\nposition.x += dx;\n```\n\n```\nif (position.x < 0 || position.x >= xLimit)\
    \ {\n    dx = -dx;\n}\n```\n\n```cpp\nposition.x += dx;\n```\n\n更新 `position.y`\
    \ 的代码几乎相同。\n\n该模型表示一个在边界框内弹跳的球。边界框是否对应于窗口边缘与模型无关。在窗口之外绘制是完全允许的；在那里绘制的任何内容只是不可见。\n\
    \n为了让其他类能够获取新位置，模型拥有一个 `PropertyChangeSupport` 对象（命名为 `pcs`）。它是公共的，这样视图类就可以访问它。\n\
    \n```\npublic PropertyChangeSupport pcs;\n```\n\n每当模型完成一步时，它都会告诉 `pcs` 触发一个包含球位置新值的事件。\n\
    \n```\nthis.pcs.firePropertyChange(\"position\", null, position);\n```\n\n###\
    \ 10.6.4 视图\n\n视图类的任务仅仅是在每次接收到 `PropertyChangeEvent` 时清空窗口并在其中画一个球。这意味着它必须“监听”这些事件。为了做到这一点，它实现了\
    \ `PropertyChangeListener`。\n\n```\npublic class View extends JPanel\nimplements\
    \ PropertyChangeListener {…}\n```\n\n它必须为事件提供一个监听器：\n\n```\n@Override\npublic\
    \ void propertyChange(PropertyChangeEvent event) {\n    position = (Point) event.getNewValue();\n\
    \    repaint();\n}\n```\n\n但这还不够，还需要最后一步一步：`View` 类现在是一个监听器了，但必须告诉之前使用的同一个 `PropertyChangeSupport`\
    \ 对象它的存在。\n\n```\nmodel.pcs.addPropertyChangeListener(this);\n```\n\n你可以将 `View`\
    \ 理解为“订阅”了由 `pcs` 发出的系列事件。\n\n# 附录 A：弹跳球代码\n\n## 弹跳球：控制器\n\n```java\n/**\n * 这是一个基础“弹跳球”动画的示例，\n\
    \ * 使用了模型-视图-控制器（MVC）设计模式\n * 以及 Timer 和 PropertyChangeSupport 类。\n */\nimport\
    \ java.awt.BorderLayout;\nimport java.awt.event.ActionEvent;\nimport java.awt.event.ActionListener;\n\
    import java.awt.event.ComponentAdapter;\nimport java.awt.event.ComponentEvent;\n\
    import java.util.Timer;\nimport javax.swing.JButton;\nimport javax.swing.JFrame;\n\
    import javax.swing.JPanel;\n\n/**\n * 控制器设置 GUI 并处理\n * 控件（在此例为按钮）。\n * @author\
    \ David Matuszek\n */\npublic class Controller extends JFrame {\n    JPanel buttonPanel\
    \ = new JPanel();\n    JButton runButton = new JButton(\"Run\");\n    JButton\
    \ stopButton = new JButton(\"Stop\");\n    Timer timer;\n\n    /**\n     * 模型是执行所有计算\n\
    \     *的对象。它独立于\n     * 控制器和视图对象。\n     */\n    Model model;\n\n    /**\n    \
    \ * 视图对象显示\n     * 模型中正在发生的情况。\n     */\n    View view;\n\n    /**\n     * 运行弹跳球。\n\
    \     * @param args 忽略参数。\n     */\n    public static void main(String[] args)\
    \ {\n        Controller c = new Controller();\n        c.init();\n        c.display();\n\
    \    }\n\n    /**\n     * 设置模型与视图\n     * 之间的通信。\n     */\n    private void init()\
    \ {\n        model = new Model();\n        view = new View(model);\n    }\n\n\
    \    /**\n     * 显示 GUI。\n     */\n    private void display() {\n        layOutComponents();\n\
    \        attachListenersComponents();\n        setSize(300, 300);\n        setVisible(true);\n\
    \        setDefaultCloseOperation(JFrame.EXIT_CLOSE);\n    }\n\n    /**\n    \
    \ * 在 GUI 中排列组件。\n     */\n    private void layOutComponents() {\n        setLayout(new\
