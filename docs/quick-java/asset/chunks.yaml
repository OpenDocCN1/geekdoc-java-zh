    #### 3.3.1.14 Empty Statements


    Although of very limited use, Java does allow the use of an “empty” statement,
    consisting of a semicolon by itself. The following statements are equivalent:


    ```

    for (n = 1; n < 1000; n = 2 * n) {}

    ```


    and


    ```

    for (n = 1; n < 1000; n = 2 * n);

    ```


