    \n当你需要一个表示固定值集合中某一个值的变量时（例如，一年的月份），枚举是合适的。它们提供了类型安全：例如，你不能将一个 `Coin` 值赋值给 `Month`\
    \ 变量。\n\n枚举最简单的形式由常量列表组成，每个常量都是枚举的值之一。例如，\n\n```java\nenum Weekday { SUN, MON,\
