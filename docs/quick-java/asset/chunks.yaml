    \ my sample code calls a `handleEvent` method (not provided) that I wrote for\
    \ testing purposes. This should be replaced with your code for handling the event.\n\
    \n### 9.8.1 JFrame and JPanel\n\nThe easiest way to create a Swing GUI is to have\
    \ your main class extend `JFrame`.\n\nTo extend your main class:\n\n```\npublic\
    \ class Examples extends JFrame {...}\n```\n\nAlternatively, to create a new `JFrame`:\n\
    \n```\nJFrame myFrame = new JFrame();\n```\n\nTo specify a standard action to\
