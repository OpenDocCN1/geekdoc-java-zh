  trans: "\n\n方法类似于函数，不同之处在于方法属于一个对象，并且（通常）与该对象的字段一起工作。方法可以包含变量的 `declarations`（声明），并包含可执行的语句。\n\
    \n总结一下，项目的组织方式如下：\n\n*   文件的 packages（包，目录）\n    *   classes（类，通常每个一个）；每个类包含：\n\
    \        *   fields（数据）\n        *   构造函数，包含声明和语句\n        *   方法，包含声明和语句\n\n\
    除了上述内容，Java 9 及更高版本中的包可以被组织成更大的单元，称为 `modules`（模块）。这对于具有大量包的程序非常合适。JDK（Java 开发工具包）巨大，由数百个模块、数百个包和数千个类组成。与本书相关的单个模块是\
    \ `java.base`。\n\n将在第 5.3.9 节中简要讨论模块。\n\n## 1.2 初探：Circle 类\n\n以下程序演示了 Java 程序的整体结构，并对\
    \ Java 程序的样貌提供了初步了解。\n\n```\npackage examples.shapes;\n\npublic class Circle {\n\
    private int radius;\n\npublic Circle(int r) {\n    radius = r;\n}\n\npublic double\
    \ area() {\n    return Math.PI * Math.pow(radius, 2);\n}\n\n}\n```\n\n包声明表示此代码位于名为\
    \ `shapes` 的文件夹（目录）中，该文件夹位于名为 `examples` 的文件夹（目录）中。如果需要任何 import 声明（这里），它们将紧随这一行。\n\
    \n代码定义了一个名为 `Circle` 的公共类。`public` 关键字意味着该类可以被程序中的任何代码使用。由于 `Circle` 是一个公共类，它必须位于名为\
    \ `Circle.java` 的文件中；这允许其他代码找到它。\n\n`Circle` 类有一个名为 `radius` 的整数 `instance variable`（实例变量）。每个创建的新\
    \ `Circle` 对象将拥有自己的 `radius`，由于 `radius` 被标记为 `private`（私有的），它在类外部可见。\n\n接下来是一个构造函数。它之所以被识别为构造函数，是因为它与其所在的类名完全相同（`Circle`）。它接受一个整数参数\
    \ `r`，将 `r` 的值保存在自己的实例变量 `radius` 中，并返回一个新创建的 `Circle` 对象。它没有使用 return 语句。\n\n\
    最后是一个不接受任何参数的方法 `area`。它计算并返回此圆的面积。\n\n现在我们有了一个 `Circle` 类，让我们使用它吧。\n\n```\npackage\
    \ examples.shapes;\n\npublic class CircleApp {\n    public static void main(String[]\
    \ args) {\n        int size = 10;\n        Circle c = new Circle(size);\n    \
    \    double area = c.area();\n        System.out.printf(\n            \"The area\
    \ of a circle \" +\n            \"with radius %d is %7.2f\",\n            size,\
    \ area);\n    }\n}\n```\n\n这个类 `CircleApp` 恰好与 `Circle` 类位于同一个目录下。\n\n`CircleApp`\
    \ 没有显式的构造函数（它有一个隐式的构造函数，但现在先忽略它）。它确实有一个 `main` 方法，这是程序的起点。由于复杂的原因，`main` 方法始终被定义为\
    \ `public static void main(String[] args)`——现在只需记住它；理解以后会来。\n\n`main` 方法随后：\n\n\
    *   声明一个局部变量 `size` 为整数并赋值为 10。\n*   声明另一个类型为 `Circle` 的局部变量 `c`，并使用关键字 `new`\
    \ 调用 `Circle` 构造函数。它获取一个新创建的 `Circle` 对象并赋值给 `c`。\n*   向 `c` 请求面积，并将结果赋值给 `double`（浮点）变量\
    \ `area`。\n*   打印结果：\n    半径为 10 的圆的面积为 314.16\n\n## 1.3 数据\n\nJava 中的每个数据值要么是\
    \ `primitive`（基本类型），要么是 `object`（对象）。八种基本类型中大部分是数值类型。对象由 `classes`（类）定义，每个类定义一种新类型的对象。\n\
    \n四种最重要的基本类型是：`int`（整数或全数）、`double`（包含小数点的数字）、`boolean`（true 和 false 值）和 `char`（单个字符）。\n\
    \n两种重要的对象类型是 `strings`（字符串）和 `arrays`（数组）。字符串是由 `String` 类定义的对象，而数组是使用更传统的语法定义的（但它们仍然是对象）。\n\
    \n基本类型和对象之间明显的区别是，基本类型具有 `operations`（操作）：如 `3 * n`、`big && round` 等，而对象具有 `methods`（方法）。（异常：`+`\
    \ 运算符可以用于 `concatenate`（“连接”）字符串。）\n\n> **术语：** 你不是在“调用”方法。相反，你是在“向对象发送消息”，其中“消息”由方法名及其参数组成。\n\
    \n向对象发送消息请使用像这样的 `dot notation`（点符号表示法）：`object.method(parameters)`。例如，`firstName.charAt(0)`。\n\
    \n字面量字符串包含在双引号中：\"Hello\"。字符字面量写在单引号中：’a’。\n\n所有变量在使用之前必须 `declared`（声明）；这指定了它们的类型。它们也可以被\
    \ `defined`（定义），或赋予一个初始值。\n\n```\nint count; // declaration\ncount = 0; // definition\n\
    ```\n\n数组的元素必须是相同的类型。数组的类型位于，例如 `int[]`。\n\n```\nint[] numbers = new int[100];\n\
    ```\n\n数组是基于索引的。`numbers` 数组的第一个元素是 `numbers[0]`，最后一个是 `numbers[99]`。长度由 `numbers.length`\
    \ 提供。\n\n## 1.4 运算符\n\nJava 有常用的算术运算符：`+`（加）、``（减，或负号）、`*`（乘）、`/`（除）和 `%`（取模）。乘法运算符\
    \ `*`、`/` 和 `%` 的优先级高于加法运算符 `+` 和 ``。\n\n没有幂运算符。幂通过调用 `Math` 模块中的 `pow` 方法来实现：`Math.pow(r,\
    \ 2)`。\n\n使用整数的算术表达式产生整数。如果表达式涉及 `double`，结果将是 `double`。\n\nJava 有布尔运算符 `&&`（与）、`||`（或）和\
    \ `!`（非）。比较运算符 `<`、`<=`、`==`（等于）、`!=`（不等于）、`>` 和 `>=` 都产生布尔。布尔不是数字，你不能在期望布尔的地方使用数字。\n\
    \n更多关于运算符的详细信息请参见第 3.2.5 节。\n\n## 1.5 程序结构\n\nJava 程序由一个或多个 `classes` 组成。每个类通常位于一个独立的文件，以类名命名并带有\
    \ .java 扩展名。如果一个类名为 `Example`，它应该位于 `Example.java` 文件中。\n\nJava 文件可以包含一个 `package`\
    \ 声明，命名文件所在的文件夹，以及一些 `import` 声明，以便当前类访问其他包中的类。（同一包中的类不需要显式导入。）类的代码位于这些初始声明之后。\n\
    \n```\npackage teamMaker;\nimport java.util.HashSet;\n```\n\n"
- fmt: "\nClasses marked `public` are available everywhere throughout the program.\n\
    \nA `declaration` consists of a type, a name, an optional equals sign, and a value,\
    \ and ends with a semicolon. It may be marked as `public` or `private`, and in\
    \ addition, it may be preceded by the word `static`.\n\n```\npublic static double\
    \ Avogadro = 6.0221409e+23;\n```\n\nIf a variable is marked with `static`, there\
    \ is only one of it, it belongs to the class itself, and all objects of that class\
    \ share this one variable. Otherwise, it is an `instance variable` (also called\
    \ a `field`), and every object has a separate copy of that variable.\n\nA `constructor`\
    \ is used to create new objects whose type is `ClassName`.\n\n```\nClassName(parameters)\
    \ {\n```\n\n```\ndeclarations\n```\n\n```\nstatements\n```\n\n```\n}\n```\n\n\
    A constructor is called with `new` `ClassName(`arguments`)`. It *always* returns\
    \ a newly created object; a return statement is unnecessary, and if used, it must\
    \ be a “bare” return statement, not supplying a value. A constructor typically\
    \ does little more than assign values to the instance variables of the new object.\n\
    \nA `method` is a callable chunk of code. It is like a function, except that it\
    \ belongs to an object (or to a class). The basic structure of a method is:\n\n\
    ```\nreturnType methodName(parameters) {\n```\n\n```\ndeclarations\n```\n\n```\n\
    statements\n```\n\n```\n}\n```\n\nThe `returnType` may be any primitive or object\
    \ type, or the keyword `void`. If the `returnType` is `void`, the method will\
    \ return when a `return;` statement is executed, or when the end of the method\
    \ is reached. But if the method is to return a value, it must terminate with a\
    \ `return` `expression;` statement, where `expression` results in a value that\
    \ can be put in a variable of type `returnType`.\n\nTo send a message to an object\
    \ (that is, to call one of its methods), use the syntax `object`.`methodName(`arguments`)`.\
    \ The value of this expression will be the value returned by the method (or null\
    \ if no value is returned).\n\n## 1.6 Statements\n\nThe most commonly used statements\
    \ are assignment statements, blocks (or compound statements), if statements, while\
    \ loops, and for loops. All statements except blocks must end with a semicolon.\
    \ The `println` method may be used to produce output.\n\nA `block` combines any\
    \ number of statements into a single `compound statement` by enclosing them in\
    \ braces, `{}`.\n\nAn `assignment statement` gives a value to a variable. If the\
