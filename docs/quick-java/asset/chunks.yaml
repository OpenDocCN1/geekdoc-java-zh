    It is good style always to include a default case, even if you believe that all
    possibilities have been covered. The default case might be empty, or it could
    include the statement assert false; to indicate that this code should never be
    reached. (Assert statements are covered in [section 3.3.2.1](#ch03.xhtml_sec3_003_002_001).)


    The ***statements*** may be any sequence of zero or more statements. It is not
    necessary to use braces to group the statements (including the following break
    statement) into a compound statement, although this is sometimes done.


    Here is a contrived example:


    ```

    int i = 3;

    ```


    ```

    String s;

    ```


    ```

    switch (i) {

    ```


    ```

    case 1:

    ```


    ```

    s = "one";

    ```


    ```

    break;

    ```


    ```

    case 2:

    ```


    ```

    s = "two";

    ```


    ```

    break;

    ```


    ```

    default:

    ```


    ```

    s = "many";

    ```


    ```

    }

    ```


    This will result in s being set to "many".


    #### 3.3.1.10 Labeled Statements


    The syntax of a labeled statement is


    ```

    identifier: statement;

    ```


    Any statement may be labeled with an identifier, but it really only makes sense
    to label loop statements and switch statements. Labels are used in conjunction
    with the break and continue statements.


    #### 3.3.1.11 Break Statements


    A break statement is used to prematurely exit the immediately enclosing loop (of
    any kind) or switch statement.


    It can also be used to exit nested loops and/or switch statements. To do this,
    put a *label* (see previous section) on the loop or switch statement you want
    to exit, and put the label after the word break:


    ```

    break label;

    ```


    Given an array of numbers, consider the problem of finding two different numbers
    such that one is exactly ten times the other. The following code solves this problem.


    ```

    int i, j = 0;

    ```


    ```

    int[] ary = {7, 30, 9, 20, 3, 5};

    ```


    ```

    id: for (i = 0; i < ary.length; i += 1) {

    ```


    ```

    for (j = 0; j < ary.length; j += 1) {

    ```


    ```

    if (i!= j && ary[i] == 10 * ary[j]) {

    ```


    ```

    break id;

    ```


    ```

    }

    ```


    ```

    }

    ```


    ```

    }

    ```


    ```

    System.out.println(ary[i] + ", " + ary[j]);

    ```


    Some programmers dislike the break statement, and indeed, there is usually a better
    way to solve a problem without using it.


    #### 3.3.1.12 Continue Statements


    A continue statement is used to go from the middle of a loop to the beginning
    of the next time through the loop. That is, the continue statement causes the
    enclosing loop to return to the test of a while loop, to the increment and test
    of a for loop, or to the beginning of a do-while loop.


    If the continue statement is within nested loops, it can be used to go to the
    beginning of a particular loop. To do this, put a label on the desired loop, and
    put that label after the word continue.


    ```

    continue label;

    ```


    The following code computes the average of the positive values in the array ary,
    ignoring the zero and negative values.


    ```

    int[] ary = {10, 20, 5, -1, 30, -12, 50};

    ```


    ```

    double sum = 0;

    ```


    ```

    int count = 0;

    ```


    ```

    for (int i = 0; i < ary.length; i += 1) {

    ```


    ```

    if (ary[i] <= 0) continue;

    ```


    ```

    sum += ary[i];

    ```


    ```

    count += 1;

    ```


    ```

    }

    ```


    ```

    double average = sum / count;

    ```


    While there is nothing actually wrong with the continue statement, refactoring
    the code to remove it almost always results in a simpler and more understandable
    program.


    #### 3.3.1.13 Return Statements


    When a method is defined, it must specify the type of the value to be returned.
    If no value is to be returned, the keyword void must be used in place of a type
    name, and the use of a return statement is optional. Examples:


    ```

    int add(int a, int b) {

    ```


    ```

    return a + b;

    ```


    ```

    }

    ```


    ```

    void print(int x) {

    ```


    ```

    System.out.println(x);

    ```


    ```

    return; // superfluous

    ```


    ```

    }

    ```


    The syntax of the return statement is either simply


    ```

    return;

    ```


    for a void method, or


    ```

    return expression;

    ```'
