    ```


    可选单词 `transitive`（传递性的）意味着任何需要 `takeModule` 的模块也将获得对 `giveModule` 的访问权限。


    模块之间不能有循环依赖关系。如果模块 `A` 需要模块 `B`，则模块 `B` 就不能需要模块 `A`。


    所有 Java 提供的包已组织成约 100 个模块，每个模块声明都会自动需要 `java.base`。`java.base` 模块由 32 个包，包括 `java.lang`、`java.util`、`java.io`
    和 `java.math`。


    ### 5.3.10 构建工具


    Java 程序在执行之前必须被 `compiled`（编译成字节码）。`javac` 命令将单个文件（必须具有 `.java` 扩展名）编译为具有 `.class`
    扩展名的字节码文件。


    然而，除了简单的程序外，所有程序由多个类组成，每个类位于一个独立的 `.java` 文件中。在它依赖的所有类被编译之前，该文件无法成功编译。此外，编译可能非常耗时，因此我们不想在每次进行微小更改时都编译所有内容。但如果更改并重新编译了一个
    Java 文件，依赖它的文件也必须重新编译。重新编译这些文件可能会导致编译更多的文件。


    `build tool`（构建工具）将文件依赖列表作为输入，并仅编译或重新编译那些需要的文件。`Ant`、`Maven` 和 `Gradle` 是流行的构建工具。如果你正在使用
    IDE，这些工具中的一个或两个将是内置的，你可以让 IDE 完成工作。


    # 第 6 章 函数式编程


    DOI: [10.1201/9781003402947-6](https://doi.org/10.1201/9781003402947-6)


    `functional programming`（函数式编程）的基本思想是函数是值，可以被视为值。函数可以存储在变量中，作为参数传递给方法，作为方法的返回值，组合成新函数，并部分或全部应用于参数。与之对应的是数据是
    `immutable`（不可变的）的；应用于数据的数据会产生新数据，而不是更改现有数据。


    有三个因素增加了 Java 函数式编程的复杂性。首先，Java 是围绕方法设计的，方法与类相关；函数是最近引入的。其次，基本数据类型的处理方式与对象不同，这导致了组合的复杂性。第三，数据结构是可变的，这与函数应用于数据的理念是不符的。


    ## 6.1 Lambda 表达式


    从 Java 8 开始，你可以如下定义一个 `lambda expression`（Lambda 表达式），也称为 `function literal`（函数字面量）：


    ```

    (parameters) -> expression

    ```


    或者


    ```

    (parameters) -> statement

    ```


    *   `parameters` 由一个类型（如 int 等）和一个名称组成，尽管在许多情况下可以省略类型。

    *   如果只有一个参数且未指定类型，则可以省略括号。

    *   如果没有参数，则空括号 `()` 是必须的。

    *   `statement` 可以是一个复合语句（在大括号内），并包含 `return` 语句。

    *   函数不能在顶层定义；它们只能在方法（或函数）内部定义。


    `method reference operator` `::`是将方法封装在函数接口内部的方法，使其可以像函数一样使用。


    本质上，`x :: m` 是 `x -> x.m(...)` 的缩写，其中 `m` 有未指定的参数。如果存在多个名为 `m` 的方法，将按照通常的方式通过类型和参数进行解析。


    ## 6.2 函数式接口


    `functional interface`（函数式接口）是任何仅有一个抽象方法的接口，这被称为 `SAM`（单抽象方法）。例如，`Comparable`
    接口声明了唯一的抽象方法 `compareTo(T)`，`Runnable` 接口声明了 `run()`，`ActionListener` 接口声明了 `actionPerformed(event)`。


    函数字面量常用的用法是将它们作为参数传递给方法。然而，方法必须指定每个参数的类型。在函数字面量的情况下，类型始终是某种函数式接口的名称，但该名称显而易见。Java
    提供了 43 种函数式接口类型，每种类型一个关联的 SAM。

