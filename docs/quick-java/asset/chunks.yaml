    tags are described in [section 5.2.1.2](#ch05.xhtml_sec5_002_001_002).


    The ***access*** tells what other classes can use this method. It can be public,
    “package” (default), protected, or private.


    The ***returnType*** tells what kind of value is returned by the method. If the
    method does not return a value, the keyword void is required.


    By convention, the ***methodName*** should begin with a lowercase letter. Methods
    may be ***overloaded***; that is, there can be multiple methods with the same
    name, so long as they have different numbers of parameters or different parameter
    types. Java looks at both the name and the parameters (but *not* the return type)
    to decide which method to use.


    Each element in the ***parameterList*** must be a variable ***name*** preceded
