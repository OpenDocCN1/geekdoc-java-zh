- fmt: "\nA method is like a function, except that it belongs to a class. Like a function,\
    \ it takes parameters and may return a value. The syntax is\n\n```\n/** documentation\
    \ comment */\n```\n\n```\naccess returnType methodName(parameterList) {\n```\n\
    \n```\ndeclarations\n```\n\n```\nstatements\n```\n\n```\n}\n```\n\nWith minor\
    \ exceptions, methods contain all the executable code of a program.\n\nThe optional\
    \ `documentation comment` should tell the user what the method does and how to\
    \ use it. It should describe any restrictions on the parameter values, and what\
    \ to expect of the return value. It should not talk about how the method is implemented.\
    \ The documentation (doc) comment may also contain `tags` to add specific kinds\
    \ of information: The `@param` tag describes a parameter, `@return` describes\
    \ the result, and `@throws` describes an exception that may be thrown. Additional\
    \ tags are described in [section 5.2.1.2](#ch05.xhtml_sec5_002_001_002).\n\nThe\
    \ `access` tells what other classes can use this method. It can be public, “package”\
    \ (default), protected, or private.\n\nThe `returnType` tells what kind of value\
    \ is returned by the method. If the method does not return a value, the keyword\
    \ `void` is required.\n\nBy convention, the `methodName` should begin with a lowercase\
    \ letter. Methods may be `overloaded`; that is, there can be multiple methods\
    \ with the same name, so long as they have different numbers of parameters or\
    \ different parameter types. Java looks at both the name and the parameters (but\
    \ not the return type) to decide which method to use.\n\nEach element in the `parameterList`\
    \ must be a variable `name` preceded by its `type` (for example, `String password`).\
    \ A primitive type is passed in “by value”: The method gets an independent copy\
    \ of the value. An object type is passed in “by reference”: The method gets a\
    \ `reference` to the actual object, not a copy of it (see [section 4.1.8](#ch04.xhtml_sec4_001_008))\n\
    \nIf a method does not take parameters, the parentheses must still be present.\n\
    \nIn the body of the method you can have `declarations` of variables, with or\
