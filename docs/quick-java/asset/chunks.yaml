    \ where ***xxxx*** is a hexadecimal number in the range '\\u0000' to '\\uffff'.\
    \ For example, '\\u0041' is 'A', and '\\u03A3' is 'Σ'.\n\nAmong the above types,\
    \ a double is considered to be ***wider*** than an int, and an int is wider than\
    \ a char. A value of one type can be assigned to a variable of a wider type. That\
    \ is, a char value can be assigned to an int variable or a double variable, and\
    \ an int variable can be assigned to a double variable. This is called ***upcasting***.\n\
    \nTo go in the other direction, that is, to assign a wider value to a narrower\
    \ type of variable, you must ***cast*** (or ***downcast***) the value to the desired\
    \ type. Do this by putting the name of the desired type in parentheses immediately\
    \ before the value. For example,\n\n```\nint i = 0;\n```\n\n```\ndouble d = 2.71828;\n\
    ```\n\n```\ni = (int)d;\n```\n\n```\nSystem.out.println(i); // prints 2\n```\n\
    \nIn the above example, the fractional part is lost.\n\nA cast affects the *one*\
    \ immediately following value: (int)2 * d casts only the 2 to an int (which it\
    \ already is). To cast an expression, put parentheses around it: (int)(2 * d).\n\
    \nAs another example, consider:\n\n```\nchar ch = (char)('a' + 1); // result is\
    \ 'b'\n```\n\nThe cast is necessary because the result type of 'a' + 1 is int.\n\
    \nWhen casting to a narrower type, it is the programmer's responsibility to ensure\
    \ that the value will fit in that narrower type, or the results will be quite\
    \ unexpected. For example, a byte can hold only values between −128 and 127, but\
    \ the cast (byte)1000 is legal and results in −24.\n\nA boolean is *not* a numeric\
    \ type, and cannot be cast to or from any other type.\n\n### 3.2.7 Constants\n\
    \nPutting the word final in front of a variable declaration makes it into a ***constant***;\
    \ its value cannot be changed. For example,\n\n```\nfinal int DAYS_IN_A_WEEK =\
    \ 7;\n```\n\nJava provides some built-in constants, such as Math.PI and Math.E.\n\
    \nConstants help avoid the use of “magic numbers”—numbers in code whose meaning\
    \ may not be absolutely clear. If the code adds 29 to a variable, the question\
    \ arises, why 29?\n\nHowever, it is silly to name a constant after its value,\
    \ for example,\n\n```\nfinal int TWELVE = 12;\n```\n\nbecause this does nothing\
    \ to improve the clarity of the code.\n\n### 3.2.8 Methods\n\nA method is like\
    \ a function, except that it belongs to a class. This gives it special access\
    \ to the variables and other methods of that class. The syntax is\n\n```\n/**\n\
    ```\n\n```\n* documentation comment\n```\n\n```\n*/\n```\n\n```\naccess returnType\
    \ methodName(parameterList) {\n```\n\n```\ndeclarations\n```\n\n```\nstatements\n\
    ```\n\n```\n}\n```\n\nThere is no special keyword to begin the definition of a\
    \ method. A method definition consists of:\n\n1.  An optional ***documentation\
    \ comment*** to tell the user what the method does and how to use it.\n\n2.  An\
    \ optional ***access*** specifier (see [section 4.1.2](#ch04.xhtml_sec4_001_002)).\
    \ Default is *package* access.\n\n3.  The ***return type*** of value to be returned\
    \ by the method, or void if the method does not return a value.\n\n4.  The ***method\
    \ name***. Method names should begin with a lowercase letter.\n\n5.  A parenthesized,\
    \ comma-separated ***parameter list***. If there are no parameters, the parentheses\
    \ must still be present. Each parameter consists of:\n\n    *   The type of value\
    \ expected for that parameter, and\n\n    *   The name of the parameter.\n\n6.\
    \  The body of the method, consisting of a pair of braces, {}, containing any\
    \ number of declarations and executable statements.\n\nHere is an example:\n\n\
    ```\n/**\n```\n\n```\n* A leap year is a year divisible by 4 but not\n```\n\n\
    ```\n* by 100, unless it is also divisible by 400.\n```\n\n```\n*/\n```\n\n```\n\
    boolean isLeapYear(int year) {\n```\n\n```\nif (year % 4!= 0) return false;\n\
    ```\n\n```\nif (year % 100!= 0) return true;\n```\n\n```\nreturn year % 400 ==\
    \ 0;\n```\n\n```\n}\n```\n\nIn the body of the method you can have ***declarations***\
    \ of variables, with or without an initial value, for example,\n\n```\nint count\
    \ = 0;\n```\n\nAll such declarations are ***local*** to the method, that is, they\
    \ can be seen and used only within the method. Variable declarations are usually\
    \ put first in the method body. A method may make use of the values given to its\
    \ parameters, its local variables, and any ***fields*** defined by the class it\
    \ is in.\n\n> **Note:** If a parameter or local variable has the same name as\
    \ a field of the class, it will ***shadow*** (hide) the field. This is commonly\
    \ done in constructors, and can be done for similar purposes in methods.\n\nTo\
    \ make a complete program, there must be at least one “starting” class that contains\
    \ the following special method:\n\n```\npublic static void main(String[] args)\
    \ { … }\n```\n\nThere can be multiple methods with the same name, so long as they\
    \ have different numbers of parameters or different parameter types. Java looks\
    \ at both the name and the parameters (but not the return type) to decide which\
    \ method to use.\n\nIf the method is declared to return a value of a certain type,\
    \ it must use a return statement with a value of the correct type (or a value\
    \ that can be widened to the correct type). It may not reach the end of the method\
    \ without executing a return statement.\n\nWithin the method, the ***statements***\
    \ can refer to any fields of the class, any parameters, and any local declarations.\
    \ The keyword this refers to “this” object, the one executing the method. When\
    \ there is a local variable or parameter with the same ***name*** as a field,\
    \ then ***name*** by itself refers to the local variable or parameter, while this.***name***\
    \ refers to the field.\n\n> **Note to Python programmers:** The keyword this is\
    \ like self in Python. The two differences are that this is a keyword, not a variable\
    \ name, and that the word this can usually be omitted.\n\nIf a method is declared\
    \ to be void (have no return value), then the method can finish either by executing\
    \ return; with no value specified, or by reaching the end of the method.\n\n>\
    \ **Note:** void is not a value, so return void; is not allowed\n\n### 3.2.9 Methods\
    \ Calling Methods"
