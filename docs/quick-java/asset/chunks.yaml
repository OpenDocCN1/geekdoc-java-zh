  trans: "\n\n- `static`: 编译程序定义了类 `MyClass`（以及程序中的任何其他类），但此时还没有对象，只有类。由于没有对象，因此也没有任何实例方法。但\
    \ `main` 方法是静态的，它属于类 `MyClass`，而该类已经存在了。因此，操作系统可以向类 `MyClass`发送 `main` 消息。\n-\
    \ `void`: `main` 方法不返回结果。\n- `main`: 操作系统始终通过向程序发送 `main(arguments)` 消息来启动 Java\
    \ 程序。具体来说，由于它正尝试在名为 `MyClass.class` 的文件（从 `MyClass.java` 编译而来）上运行程序，它向类 `MyClass`发送\
    \ `main` 消息。\n    - 多个类可以拥有 `main` 方法，因此一个程序中可能有多个可能的起始点。例如，你可能有一个程序同时用于消息的编码和解码，并在\
    \ `Encoder` 类和 `Decoder` 类中都拥有一个 `main` 方法。\n- `(String[] args)`: `main` 方法可以接收参数，这些参数可以来自命令行或\
    \ IDE。参数通过空格分隔，并以 `strings` 的形式出现。没有参数也可以的——Java 中零长度的数组是合法的。\n\n作为你可以编写的最简单 Java\
    \ 程序之一的示例，假设你在名为 `myPackage` 的文件夹中有一个名为 `MyClass.java` 的文件，内容如下：\n\n```java\n\
    package myPackage;\n```\n\n```java\npublic class MyClass {\n    public static\
    \ void main(String[] args) {\n        System.out.println(args[0] + args[1]);\n\
    \    }\n}\n```\n\n如果你位于包含 `myPackage` 文件夹的文件夹/目录下，可以使用以下命令编译此程序：\n\n```bash\n\
    javac myPackage/MyClass.java\n```\n\n你可以通过以下命令运行它：\n\n```bash\njava myPackage/MyClass\
    \ abc 123\n```\n\n结果将是：\n\n```\nabc123\n```\n\n### 4.1.13 更完整的示例\n\n以下是一个使用类和对象的完整示例，尽管它没什么意义）。\n\
    \n这段代码位于名为 `Counter.java` 的文件中，位于名为 `tools` 的文件夹（目录）中。文件夹和文件的名称必须与包和类的名称完全匹配。（你的\
    \ IDE 会为你处理这一点。）在该包/文件夹中可能且很可能存在其他类。\n\n```java\npackage tools;\n\n/**\n * 一个简单的计数器类\n\
    \ */\npublic class Counter {\n    private int count; // 字段\n\n    /** 构造函数，用于创建一个带有初始值的\
    \ Counter 对象。\n     */\n    public Counter(int initial) {\n        count = initial;\n\
    \    }\n\n    /** 计数器增加 n。 */\n    public void bump(int n) {\n        count +=\
    \ n;\n    }\n\n    /** 计数器增加 1。 */\n    public void bump() {\n        bump(1);\n\
    \    }\n\n    /** 返回计数器的值。 */\n    public int getCount() {\n        return count;\n\
    \    }\n}\n```\n\n该类描述了一个新类型，即 `Counter` 类型。\n\n该类有一个字段 `int count`。从该类创建的的每个对象都将拥有它们自己的\
    \ `count` 字段，因此你可以拥有多个计数器来跟踪不同的值。构造函数接受一个参数 `initial` 作为 `count` 的初始值。\n\n该类有三个方法，两个命名为\
    \ `bump`，一个命名为 `getCount`。这些方法被声明为 `public`，以便从包外部使用。`bump()` 方法向 `count` 字段加\
    \ `1`，而 `bump(int n)` 方法向 `count` 字段加 `n`；它们都不返回任何值。`getCount` 方法返回 `count` 的当前值。\n\
    \n为了完成这个示例，让我们写一个程序来测试我们的 `Counter` 类。\n\n```java\npackage toolUser;\n\nimport\
    \ tools.*;\n\npublic class CounterTest {\n    public static void main(String[]\
    \ args) {\n        Counter c1 = new Counter(0);\n        Counter c2 = new Counter(100);\n\
    \        c1.bump(2);\n        c1.bump(8);\n        c2.bump(100);\n        c2.bump();\n\
    \        System.out.println(c1.getCount() + \", \" + c2.getCount());\n    }\n\
    }\n```\n\n该类位于一个独立的文件夹中，名为 `toolUser`。第二行表示导入或使 `tools` 包中的所有内容可用。\n\n包和导入语句位于文件的开头，在类定义之前。\n\
    \n下一行声明了一个类 `CounterTest`，它是 `public` 的，以便不同包中的类使用。\n\n`CounterTest` 类包含一个 `public\
    \ static void main` 方法，因此这是程序开始执行的地方。\n\n接下来的行声明了类型为 `Counter` 的变量 `c1` 和 `c2`，创建了具有不同初始值的新\
    \ `Counter` 对象，并将它们赋值给变量。\n\n接下来的行使用 `dot notation` 向 `c1` 和 `c2` 对象发送了带有不同参数的多个\
    \ `bump` 消息。\n\n最后，结果将是\n\n### 4.2 继承\n\n类形成了树形层次结构，以 `Object` 为根。除了 `Object`\
    \ 之外，每个类都有一个超类。关键字 `extends` 表示超类。如果你不指定超类，则默认为 `Object`。\n\n```java\nclass Person\
    \ {\n}\n```\n\n```java\nclass Customer extends Person {\n}\n```\n\n当你定义一个类时，它继承了超类可用的字段和方法。例如，如果你有一个拥有\
    \ `name` 字段的 `Person` 类，那么 `Customer` 也有 `name` 字段。如果 `Person` 有一个 `visit` 方法，那么\
    \ `Customer` 也有 `visit` 方法。通过声明具有相同名称和参数的方法可以重写（overridden）继承来的方法；详见第 4.4 节。\n\
    \n构造函数不被继承。\n\n### 4.3 转换\n\n回想数值值可以从一种类型强制转换（cast）到另一种类型。`int` 值可以直接放入 `double`\
    \ 变量，因为 `double` 在某种程度上比 `int` “宽”。但要把 `double` 值放入 `int` 变量中，必须显式强制转换为 `int`，即在变量前加上\
    \ `(int)`；例如，`int pi = (int)Math.PI;`。\n\n智能地，一种类型的对象可以放入不同类型的变量中，前提是其中一种类型是另一种类型的祖先（超类）。`向上转型`是转换为祖先类型，并且可以自动发生；`向下转型`是转换为后代类型，需要显式强制转换。例如，如果\
    \ `BirthdayCake` 继承 `Cake` 且 `Cake` 继承 `Object`，那么以下赋值是可能的：\n\n```java\nBirthdayCake\
    \ myCake = new BirthdayCake();\nCake cake = myCake;\nObject obj = myCake;\nmyCake\
    \ = (BirthdayCake)cake;\nmyCake = (BirthdayCake)obj;\ncake = (Cake)obj;\n```\n\
    \n向上转型的通常原因是是将对象放入更通用对象的集合中；例如，将`生日蛋糕`放入蛋糕数组中。`生日蛋糕`并没有丢失它的特殊特征（例如蜡烛），但从更通用的类型\
    \ `Cake` 变量无法访问这些特征。\n\n在向下转型对象时，Java 会插入一个隐式检查，确认该对象确实是目标类型，如果不是，则抛出 `ClassCastException`。当对象位于更具体的类型变量中，新增的特性（字段和方法）再次可用。\n\
    \n你可以使用 `instanceof` 运算符来测试对象是否属于给定的类型或超类型。\n\n```java\nmyCake instanceof BirthdayCake\
    \ // true\n```\n\n"
- fmt: "\n```\nmyCake instanceof Cake // true\n```\n\n```\nmyCake instanceof Object\
    \ // true\n```\n\nAn `instanceof` test can be used to test whether a variable\
    \ can be cast to a certain type, but it doesn’t perform the cast.\n\n```\nif (obj\
    \ instanceof BirthdayCake) {\n```\n\n```\nBirthdayCake bc = (BirthdayCake) obj;\n\
    ```\n\n```\n… use bc here\n```\n\n```\n}\n```\n\nStarting with Java 14, this can\
    \ be abbreviated as\n\n```\nif (obj instanceof BirthdayCake bc) {\n```\n\n```\n\
    …use bc here\n```\n\n```\n}\n```\n\n## 4.4 Overriding\n\nObjects inherit methods\
    \ from their superclasses, and `Object` is the root superclass of all objects,\
    \ therefore every object inherits all the methods defined in the `Object` class.\n\
    \nIf an inherited method is not exactly what is desired, it can be `overridden`\
    \ (replaced) by a different method with the same name and the same number and\
    \ types of parameters. To do this,\n\n1.  Write the annotation `@Override` directly\
    \ before the method.\n    *   An `annotation` is an instruction to the compiler.\
    \ The `@Override` annotation asks the compiler to check that the name and parameter\
    \ list match with those of an inherited method because, if they don’t, you are\
    \ simply defining another method, not overriding one.\n\n2.  Write a method with\
    \ the same name, same number of parameters, and same types of parameters (in the\
    \ same order) as the method you wish to override.\n    *   The parameter `names`\
    \ don’t have to be the same, and the overriding method may even have a different\
    \ return type.\n\n3.  Make sure the new method `is at least as public` as the\
    \ method it overrides. (The sequence is private, “package,” protected, and public.)\
    \ If the inherited method is public, any method that overrides it must also be\
    \ `public`.\n\nIt is usually a good idea, when defining your own objects, to override\
    \ three of the methods inherited from `Object`:\n\n*   `toString()` returns a\
    \ `String` representation of this object.\n*   `equals(obj)` tests if this object\
    \ is equal to object `obj`.\n*   `hashCode()` returns an `int` hash code for this\
    \ object.\n\nThe inherited versions of these methods are fairly useless; they\
    \ exist so that they can be overridden. By defining them in `Object`, Java can\
    \ be sure that every object has some version of these methods.\n\nIf your class\
    \ overrides an inherited method, that inherited method is still available to you:\
    \ just prefix the method call with `super`. That is, `super.methodName(parameters)`\
    \ will ignore the local method `methodName` and use the inherited version.\n\n\
    An inherited field can be `shadowed` (hidden) by declaring a field with the same\
    \ name. This is usually done because the programmer did not realize the field\
    \ already exists; and if the shadowed field is never needed, the mistake is harmless.\
    \ When a variable is shadowed, `super.fieldName` gives access to the inherited\
    \ field.\n\n### 4.4.1 Overriding toString\n\nEvery object has a `toString` method,\
    \ inherited from `Object`. It is called automatically when “adding” an object\
    \ to a string and when trying to print an object. You can also call it directly.\n\
    \nThe inherited `toString` method is pretty useless. It's there primarily as a\
    \ placeholder so that you can override it with a more useful version.\n\nHere\
    \ is a possible `toString` method for the `Counter` object:\n\n```\n@Override\n\
    public String toString() {\n    return \"My count is \" + count;\n}\n```\n\nThe\
    \ inherited `toString` method is `public`, therefore the version that overrides\
    \ it must be `public`.\n\nThe inherited `toString` takes no parameters and returns\
    \ a `String` result, so the version that overrides it must do the same.\n\nIf\
    \ any of these aspects do *not* match the inherited `toString` method, you may\
    \ have a valid method that overloads but doesn’t override the inherited one. If\
    \ the method is annotated with `@Override`, this kind of error will be caught.\n\
    \nWhile a `toString` method can be used to present information to the user, other\
    \ methods are usually written for that purpose. The real value of `toString` comes\
    \ during debugging when it can show the actual contents of objects.\n\n### 4.4.2\
    \ Overriding Equals\n\nEvery object inherits an `equals` method from `Object`,\
    \ but what that method actually tests for is `identity`. According to this method,\
    \ two objects are “equal” if and only if they are the `same` object, occupying\
    \ the `same` location in memory. This is also what the `==` comparison operator\
    \ does when applied to objects.\n\n> **Important:** For objects, `==` is always\
    \ an identity test, not an equality test. The `equals` method is *also* an identity\
    \ test, unless it has been overridden for that particular class of objects.\n\n\
    Continuing to use our `Counter` class as an example, here is what a typical `equals`\
    \ method would look like:\n\n```\n@Override\npublic boolean equals(Object obj)\
    \ {\n    if (obj == this) return true;\n    if (! (obj instanceof Counter)) return\
    \ false;\n    Counter that = (Counter)obj;\n    return this.count == that.count;\n\
    }\n```\n\n1.  First, we say that we are overriding some method, then we give it\
    \ the exact same header as the method we are trying to override. (The parameter\
    \ `obj` may have a different name, but everything else must be the same.)\n2.\
    \  An extremely common error is to specify the `wrong type of parameter`. We normally\
    \ want to compare this `Counter` to another `Counter`, so it makes sense for `equals`\
    \ to use a `Counter` parameter. However, this doesn’t work. To override a method\
    \ that has an `Object` parameter, the parameter `must` be of type `Object`.\n\
    3.  Next we see if we are comparing the `Counter` to itself. The keyword `this`\
    \ refers to the object currently executing the method; that is, if we were testing\
    \ `c1.equals(c2)`, the word `this` refers to `c1`.\n4.  Since the method will\
    \ take *any* kind of object as a parameter, we probably want to return `false`\
    \ if the method is called with an Octopus.\n5.  It would be an error to say `obj.count`,\
    \ because not all objects have a `count` field. We have to `cast` `obj` to a `Counter`\
    \ and save it in a variable of type `Counter` in order to use it. (I like to use\
    \ the variable name that, but any other name would do.)\n6.  Finally, we have\
    \ two `Counter` objects that we can compare. This test could be quite complex,\
    \ but for our simple `Counter` objects we’ll just test if their `count` fields\
    \ are equal.\n\nThe `equals` method should define an `equivalence relation`. That\
    \ is, it should have the following three properties for any objects `obj[1]` and\
    \ `obj[2]`:\n\n*   `Reflexive: obj[1].equals(obj[1])` should always be true.\n\
    *   `Symmetric: obj[1].equals(obj[2])` should always give the same result as `obj[2].equals(obj[1])`.\n\
    *   `Transitive: If obj[1].equals(obj[2])` and `obj[2].equals(obj[3])`, then it\
    \ should be the case that obj[1].equals(obj[3])`.\n\nUnfortunately, symmetry can\
    \ only be “mostly” achieved. If `obj[1]` is an object but `obj[2]` is `null`,\
    \ then `obj[1].equals(obj[2])` should give `false`, but `obj[2].equals(obj[1])`\
    \ would result in a `NullPointerException`. Symmetry *could* be achieved by making\
    \ both of these result in a `NullPointerException`, but that hardly seems useful.\n\
    \nFortunately, any reasonable definition of `equals` is likely to satisfy these\
    \ properties, insofar as they can be satisfied in Java.\n\n### 4.4.3 Overriding\
    \ HashCode\n\nThere is a “rule” in Java that if you override `equals`, you should\
    \ also override `hashCode`.\n"
