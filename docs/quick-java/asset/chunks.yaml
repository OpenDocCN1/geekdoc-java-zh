- fmt: "\n# 4. Execute the class. The class does not define a main method; that is\
    \ in the JUnit framework. When run, JUnit will produce a report that either (1)\
    \ says all tests passed or (2) tells which tests failed.\n\nIf you have written\
    \ the tests properly, they will not ask you for input or otherwise interrupt the\
    \ running of the tests.\n\n## 7.4 JUnit 5 Assertions\n\nA `unit test` is a test\
    \ of a single class. It is an ordinary class that imports a test framework and\
    \ annotates some of its methods to mark them for special processing. First, do\
    \ the following:\n\n```\nimport org.junit.jupiter.api.*;\n```\n\n```\nimport static\
    \ org.junit.jupiter.api.Assertions.*;\n```\n\n```\nimport static org.junit.jupiter.api.Assumptions.*;\n\
    ```\n\nThe first import statement makes the annotations available, the second\
    \ makes the test methods (such as `assertEquals`) available, and the third makes\
    \ assumptions (described later) available.\n\nNext, write the methods that will\
    \ be used by JUnit. Each method should be `public void`, should take no parameters,\
    \ and should have one of the following annotations:\n\n* `@BeforeAll` annotates\
    \ a static method that will be run only once before any tests are run. This is\
    \ used when the tests use expensive resources; for example, it might open a database.\n\
    * `@BeforeEach` annotates a method that will be run before each and every test.\
    \ It should reset any global variables to a pristine state so that the execution\
    \ of one test does not influence the results of some other test.\n* `@Test` marks\
    \ a method as a test method. Ideally, each test method tests a single method in\
    \ the class being tested. Sometimes there are several tests for the same method,\
    \ testing different kinds of input. Sometimes a test method has to depend on the\
    \ correct functioning of some methods in order to test other methods.\n* `@AfterEach`\
    \ annotates a method that will run after each test. This is rarely used.\n* `@AfterAll`\
    \ marks a static method that executes after all tests have been run. Its purpose\
    \ is to close any resources opened by `@BeforeAll`.\n* `@DisplayName(string)`\
    \ can be put before the test class or in front of individual tests, to use `string`\
    \ in place of the class name or test method name when reporting results.\n\nThe\
    \ test methods (those annotated with `@Test`) are ordinary code but contain one\
    \ or more assertions. The assertions available for use in the `@Test` methods\
    \ include:\n\n* `assertEquals(expected, actual)` compares values of any type.\
    \ For comparing objects, it uses their `equals` method.\n* `assertEquals(expected,\
    \ actual, delta)` compares floating point numbers, where `delta` is the absolute\
    \ amount by which the two numbers may differ and still be considered equal.\n\
    * `assertArrayEquals(array1, array2)` compares two arrays. For arrays of objects,\
    \ this does a deep comparison. For arrays of floating point numbers, there may\
    \ be an additional `delta` argument.\n* `assertTrue(booleanExpression)` and `assertFalse(booleanExpression)`.\n\
    * `assertSame(object1, object2)` and `assertNotSame(object1, object2)` are tests\
    \ of identity, that is, whether `object1` and `object2` are references to the\
    \ same object.\n* `assertNull(object)` and `assertNotNull(object)`.\n* `assertTimeout(ms,\
    \ function)` fails if the `function` (not method) takes longer than `ms` milliseconds.\n\
    \    * Example: `assertTimeout(100, () -> slowMethod(x, y));`\n* `fail(message)`\
    \ and `fail(exception)`.\n\nAll of these tests except `fail` may take an optional\
    \ last argument `message`.\n\n> **Note:** The `fail` method (which, yes, causes\
    \ the test to fail) is useful for writing tests that use more complex logic.\n\
    \nA test method may contain as many assertions as desired. However, if one fails,\
    \ the remaining assertions in that method are not executed, so it is better not\
    \ to have too many. Instead, write additional test methods to test different aspects\
    \ of the method.\n\nIf you have a class containing a number of methods, most good\
    \ IDEs will write a skeletal test class for you, so that you only have to add\
    \ the assertions.\n\nA test class may also contain unannotated methods. These\
    \ are ignored by JUnit but may be used by the test methods.\n\n## 7.5 Testing\
    \ Exceptions\n\nIf a method might throw an exception, you should test whether\
    \ it does throw that exception when it should. However, the obvious way of writing\
    \ the test does not work.\n\n```\nassertThrows(exception, methodCall); // wrong!\n\
    ```\n\nThe problem is that the parameters to `assertThrows` are evaluated *before*\
    \ the method is called, so if `methodCall` throws an exception, `assertThrows`\
    \ never gets a chance to catch it and deal with it.\n\nThere are two ways to solve\
    \ this problem. The more convenient way, in modern Java, is for the second argument\
    \ to `assertThrows` to be a `function that calls the method`. Like so:\n\n```\n\
    assertThrows(exception, () -> methodCall);\n```\n\nThis works because the function\
    \ is passed to `assertThrows`, which then executes the function to cause the exception\
    \ to happen. For example,\n\n```\nassertThrows(ArithmeticException.class, () ->\
    \ divide(0, 0));\n```\n\n> **Note:** The first argument to `assertThrows` must\
    \ be a class, but exceptions such as `ArithmeticException` are *type names*, not\
    \ classes. The `.class` suffix returns the class itself.\n\nIf you do not have\
    \ functions available, the same test can be written as follows:\n\n```\ntry {\n\
    \    divide(0, 0);\n    fail();\n} catch (ArithmeticException e) { }\n```\n\n\
    ## 7.6 Assumptions\n\nIn addition to assertions, JUnit 5 provides three kinds\
    \ of `assumptions`.\n\n* `assertTrue(booleanExpression)`: if `booleanExpression`\
    \ is false, the test is aborted.\n* `assertFalse(booleanExpression)`: if `booleanExpression`\
    \ is true, the test is aborted.\n* `assumeTrue(booleanExpression)`: if `booleanExpression`\
    \ is false, the test is aborted.\n\nIf the assumption is not met, the test is\
    \ aborted rather than failing. This is useful for tests that only make sense under\
    \ certain conditions, such as a specific operating system.\n\n```java\nassumeTrue(System.getProperty(\"\
    os.name\").contains(\"Mac\"));\n```\n\n## 7.7 Simple Test Example\n\nThe following\
    \ code tests a very simple class, `Account`, which was used as an example. It\
    \ has a constructor and the methods `deposit`, `withdraw`, `getBalance` (and `transfer`,\
    \ which is not tested here).\n\n```java\npackage account;\n\nimport org.junit.jupiter.api.*;\n\
    import static org.junit.jupiter.api.Assertions.*;\n\npublic class AccountTest\
    \ {\n    Account account;\n\n    @BeforeEach\n    public void setup() {\n    \
    \    this.account = new Account();\n    }\n\n    @Test\n    public void openAccount()\
    \ {\n        assertEquals(0, account.getBalance());\n    }\n\n    @Test\n    public\
    \ void testDeposit() {\n        account.deposit(100);\n        assertEquals(100,\
    \ account.getBalance());\n        account.deposit(70);\n        assertEquals(170,\
    \ account.getBalance());\n    }\n\n    @Test\n    public void testIllegalDeposit()\
    \ {\n        account.deposit(-10000);\n        assertEquals(0, account.getBalance());\n\
    \    }\n\n    @Test\n    public void goodWithdrawal() throws Exception {\n   \
    \     account.deposit(100);\n        account.withdraw(35);\n        assertEquals(65,\
    \ account.getBalance());\n    }\n\n    @Test\n    @DisplayName(\"Exception test,\
    \ old style\")\n    public void badWithdrawal() {\n        try {\n           \
    \ account.withdraw(35);\n            fail(\"Did not throw exception\");\n    \
    \    } catch (Exception e) { }\n    }\n\n    @Test\n    @DisplayName(\"Exception\
    \ test, new style\")\n    public void badWithdrawal2() {\n        assertThrows(Exception.class,\
    \ () -> account.withdraw(35));\n    }\n}\n```\n"
