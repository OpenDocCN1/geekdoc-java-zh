  trans: "\n\n# 4. 执行该类。该类没有定义 `main` 方法；该方法位于 JUnit 框架中。运行时，JUnit 将生成一个报告，显示 (1)\
    \ 所有测试均通过，或 (2) 告知哪些测试失败了。\n\n如果你正确地编写了测试，它们不会向你请求输入或在此中断测试的运行。\n\n## 7.4 JUnit\
    \ 5 断言\n\n`unit test` 是对单个类的测试。它是一个普通的类，导入了测试框架并对其某些方法进行注解，以将其标记为特殊处理。首先，执行以下操作：\n\
    \n```\nimport org.junit.jupiter.api.*;\n```\n\n```\nimport static org.junit.jupiter.api.Assertions.*;\n\
    ```\n\n```\nimport static org.junit.jupiter.api.Assumptions.*;\n```\n\n第一个导入语句使得注解可用，第二个语句使得测试方法（如\
    \ `assertEquals`）可用，第三个语句使得假设（（后文将描述）可用。\n\n接下来，编写将由 JUnit 使用的方法。每个方法都应该是 `public\
    \ void`，不应接受任何参数，并且应该具有以下注解之一：\n\n* `@BeforeAll` 注解一个静态方法，该方法将在任何测试运行之前运行一次。这用于测试使用了昂贵资源的情况；例如，它可能会打开一个数据库。\n\
    * `@BeforeEach` 注解一个在每个测试之前运行的方法。它应该将任何全局变量重置为初始状态，以确保一个测试的执行不会影响其他测试的结果。\n* `@Test`\
    \ 将一个方法标记为测试方法。理想情况下，每个测试方法都测试被测类中的单个方法。有时对同一个方法会有多个测试，以测试不同类型的输入。有时，一个测试方法必须依赖某些方法的正确运行，以便测试其他方法。\n\
    * `@AfterEach` 注解一个在每个测试后运行的方法。这很少使用。\n* `@AfterAll` 标记一个在所有测试运行后执行的静态方法。其目的是关闭由\
    \ `@BeforeAll` 打开的任何资源。\n* `@DisplayName(string)` 可以放在测试类之前或单个测试之前，以便在报告结果时使用\
    \ `string` 代替类名或测试方法名。\n\n测试方法（那些被了了 `@Test` 注解的方法）是普通代码，但它们包含一个或多个断言。在 `@Test`\
    \ 方法中可使用的断言包括：\n\n* `assertEquals(expected, actual)` 比较任何类型的值。对于对象，它使用它们的 `equals`\
    \ 方法。\n* `assertEquals(expected, actual, delta)` 比较浮点数，其中 `delta` 是两个数字之间仍可被视为相等的绝对差值。\n\
    * `assertArrayEquals(array1, array2)` 比较两个数组。对于对象数组，这将执行深度比较。对于浮点数数组，可能有一个额外的\
    \ `delta` 参数。\n* `assertTrue(booleanExpression)` 和 `assertFalse(booleanExpression)`。\n\
    * `assertSame(object1, object2)` 和 `assertNotSame(object1, object2)` 是恒等性测试，即\
    \ `object1` 和 `object2` 是否指向同一个对象的引用。\n* `assertNull(object)` 和 `assertNotNull(object)`。\n\
    * `assertTimeout(ms, function)` 如果 `function`（而非方法）耗时超过 `ms` 毫秒，则失败。\n    * 示例：`assertTimeout(100,\
    \ () -> slowMethod(x, y));`\n* `fail(message)` 和 `fail(exception)`。\n\n除了 `fail`\
    \ 之外，所有这些测试都可以接受一个可选的最后一个参数 `message`。\n\n> **注意：** `fail` 方法（是的，它会导致测试失败）对于编写使用复杂逻辑的测试非常有用。\n\
    \n测试方法可以包含任意数量的断言。然而如果其中一个失败，该方法中的其余断言将不会执行，因此最好不要过多。相反，应该编写额外的测试方法来测试方法的不同方面。\n\
    \n如果你有一个包含多个方法的类，大多数良好的 IDE 都会为你编写一个骨架测试类，你只需要添加断言即可。\n\n测试类也可能包含未注解的方法。这些方法会被\
    \ JUnit 忽略，但可以被测试方法使用。\n\n## 7.5 测试异常\n\n如果一个方法可能会抛出异常，你应该测试它在需要时是否抛出了该异常。然而，编写测试的标准方法无效。\n\
    \n```\nassertThrows(exception, methodCall); // 错误！\n```\n\n问题在于 `assertThrows`\
    \ 的参数在方法被调用*之前*就会求值，因此如果 `methodCall` 抛出异常，`assertThrows` 将没有机会捕获并处理它。\n\n解决这个问题有两种方法。在现代\
    \ Java 中，更方便的方法是让 `assertThrows` 的第二个参数成为`一个调用方法的函数`。如下：\n\n```\nassertThrows(exception,\
    \ () -> methodCall);\n```\n\n这之所以有效，是因为函数被传递给了 `assertThrows`，然后它执行该函数以导致异常发生。例如：\n\
    \n```\nassertThrows(ArithmeticException.class, () -> divide(0, 0));\n```\n\n>\
    \ **注意：** `assertThrows` 的第一个参数必须是一个类，但像 `ArithmeticException` 这样的异常是*类型名称*而不是类。`.class`\
    \ 后缀返回类本身。\n\n如果你没有可用的函数，可以如下编写相同的测试：\n\n```\ntry {\n    divide(0, 0);\n    fail();\n\
    } catch (ArithmeticException e) { }\n```\n\n## 7.6 假设\n\n除了断言之外，JUnit 5 还提供了三种类型的`假设`。\n\
    \n* `assertTrue(booleanExpression)`：如果 `booleanExpression` 为假，则中止测试。\n* `assertFalse(booleanExpression)`：如果\
    \ `booleanExpression` 为真，则中止测试。\n* `assumeTrue(booleanExpression)`：如果 `booleanExpression`\
    \ 为假，则中止测试。\n\n如果假设不满足，测试将中止而非失败。这对于在某些条件下才有意义的测试非常有用，例如特定的操作系统。\n\n```java\n\
    assumeTrue(System.getProperty(\"os.name\").contains(\"Mac\"));\n```\n\n## 7.7\
    \ 测试示例\n\n以下代码测试了一个简单的类 `Account`，它被用作示例。它有一个构造函数以及 `deposit`、`withdraw`、`getBalance`\
    \ 方法（以及此处未测试的 `transfer` 方法）。\n\n```java\npackage account;\n\nimport org.junit.jupiter.api.*;\n\
    import static org.junit.jupiter.api.Assertions.*;\n\npublic class AccountTest\
    \ {\n    Account account;\n\n    @BeforeEach\n    public void setup() {\n    \
    \    this.account = new Account();\n    }\n\n    @Test\n    public void openAccount()\
    \ {\n        assertEquals(0, account.getBalance());\n    }\n\n    @Test\n    public\
    \ void testDeposit() {\n        account.deposit(100);\n        assertEquals(100,\
    \ account.getBalance());\n        account.deposit(70);\n        assertEquals(170,\
    \ account.getBalance());\n    }\n\n    @Test\n    public testIllegalDeposit()\
    \ {\n        account.deposit(-10000);\n        assertEquals(0, account.getBalance());\n\
    \    }\n\n    @Test\n    public void goodWithdrawal() throws Exception {\n   \
    \     account.deposit(100);\n        account.withdraw(35);\n        assertEquals(65,\
    \ account.getBalance());\n    }\n\n    @Test\n    @DisplayName(\"Exception test,\
    \ old style\")\n    public void badWithdrawal() {\n        try {\n           \
    \ account.withdraw(35);\n            fail(\"Did not throw exception\");\n    \
    \    } catch (Exception e) { }\n    }\n\n    @Test\n    @DisplayName(\"Exception\
    \ test, new style\")\n    public void badWithdrawal2() {\n        assertThrows(Exception.class,\
    \ () -> account.withdraw(35));\n    }\n}\n```\n"
