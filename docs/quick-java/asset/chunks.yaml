  trans: "\n\n方法类似于函数，不同在于它属于一个类。和函数一样，它接收参数并可能返回一个值。其语法如下：\n\n```\n/** documentation\
    \ comment */\n```\n\n```\naccess returnType methodName(parameterList) {\n```\n\
    \n```\ndeclarations\n```\n\n```\nstatements\n```\n\n```\n}\n```\n\n在极少数例外，方法包含了程序所有的可执行代码。\n\
    \n可选的 `documentation comment`（文档注释）应该告诉用户该方法的作用以及如何使用它。它应该描述对参数值的任何限制，以及对返回值的预期结果。它不应该涉及方法的实现细节。文档（doc）注释还可能包含\
    \ `tags`（标签）以添加特定类型的信息：`@param` 标签描述参数，`@return` 描述结果，而 `@throws` 描述可能抛出的异常。额外的标签请见第\
    \ 5.2.1.2 节。\n\n`access`（访问修饰符）告知哪些其他类可以使用此方法。它可以是 `public`（公共）、“package”（包私有/默认）、`protected`（保护）或\
    \ `private`（私有）。\n\n`returnType`（返回类型）告知方法返回什么类型的值。如果方法不返回值，则需要关键字 `void`。\n\n\
    按照惯例，`methodName`（方法名）应该以小写字母开头。方法可以被“重载”；即可以多个同名方法，只要它们的参数数量或参数类型不同。Java 通过同时检查名称和参数（但不检查返回类型）来决定使用哪种方法。\n\
    \n`parameterList`（参数列表）中的每个元素必须是一个变量 `name`（名称），其前面带有它的 `type`（类型），例如 `String\
    \ password`。基本数据类型是“按值传递”的：方法获得的是该值的独立副本。对象类型是“按引用传递”的：方法获得的是实际对象的 `reference`（引用），而不是对象的副本（参见第\
    \ 4.1.8 节）。\n\n如果方法不接受参数，括号也必须存在。\n\n在方法体中，你可以对变量进行 `declarations`（声明），可以有初始值，也可以没有，例如\n\
    \n```\nint count = 0;\n```\n\n与字段不同，变量不能拥有 `access` 访问修饰符；所有变量都是方法的 `local`（局部的），且在方法外部不可见无法使用。变量声明通常放在方法体的开头。\n\
    \n在方法内部，`statements`（语句）可以引用类的任何字段、任何参数以及任何局部声明。\n\n### 4.1.7 示例：银行账户\n\n以下（极其极度简化的）银行账户类示例演示了方法的用法以及访问变量的各种方式。\n\
    \n```\npublic class Account {\nprivate int funds = 0;\n\nvoid deposit(int amount)\
    \ {\n  if (amount > 0) {\n    funds += amount;\n  }\n}\n\nvoid withdraw(int amount)\
    \ throws Exception {\n  if (funds >= amount) {\n    funds -= amount;\n  } else\
    \ {\n    throw new Exception(\"Insufficient funds\");\n  }\n}\n\nint getBalance()\
    \ {\n  return funds;\n}\n\nvoid transferFrom(Account other, int amount)\nthrows\
    \ Exception {\n  other.withdraw(amount);\n  deposit(amount);\n}\n\npublic static\
    \ void main(String[] args)\nthrows Exception {\n  Account john = new Account();\n\
    \  Account mary = new Account();\n  john.deposit(100);\n  mary.transferFrom(john,\
    \ 75);\n  System.out.println(john.getBalance());\n}\n}\n```\n\n正如正确做法所要求的，对字段\
    \ `funds` 的所有访问和修改都由同一类中的方法处理。当从另一个账户 `other` 取钱时，是通过请求另一个对象执行提款操作完成的。\n\n下面这行代码给出了字段应该是私有的其中一个原因：\n\
    \n```\njohn.funds = 1_000_000;\n```\n\n另一个原因是，如果私有 `funds` 变量发生了任何意外情况，错误一定在类内部的某处。如果\
    \ `funds` 不是私有的，错误可能出现在程序中可以访问该类的任何部分。\n\n`withdraw` 方法可能会抛出异常。`transferFrom`\
    \ 方法可以使用 `try-catch` 语句来处理异常，但由于它没有这样做，它必须向“向上”传递异常。`main` 方法做了同样的事情，但从这里开始“向上”意味着传递操作系统，这将导致程序崩溃——这不是理想的行为。\n\
    \n还有其他可以且应该抛出异常的地方，例如在提取负数金额的资金时。\n\n同样注意的是，`funds` 变量将金额表示为 `integer`（整数）金额（可能是分）。金额应该始终`精确`地表示，而不是估算地；使用\
    \ `double` 可能会导致法律问题。\n\n这样的类通常不会包含 `main` 方法；我临时性地放了一个为了做一些非常简单的测试。要有更好的测试方法，请参见第\
    \ 7.7 节。\n\n### 4.1.8 引用\n\n为了操作对象，理解 `references`（引用）的概念至关重要。程序中的每个变量都有固定的、有限的内存来存储数据。`int`\
    \ 获得 4 字节（32 位），`double` 获得 8 字节（64 位）。对象也是如此：对象类型（String、数组、Customer 等）只获得 4\
    \ 字节。相反，对象存储在一个名为堆的特定内存区域，它在那里占据所需的字节数。\n\n> **注意：** 引用类似于其他语言中的 `pointer`（指针）。\n\
    \n变量中实际存储的是指向该位置的 `reference`。\n\n当基本值从一个变量复制到另一个变量时，它是被复制的（参见图 4.1）。\n\n```\n\
    基本类型的赋值复制了值\n```\n\n在赋值 `b = a` 后，变量 `b` 拥有该值的 `copy`。当对象从一个变量复制到另一个变量时，再次复制的是一个简单值；但该值是对象的\
    \ `reference`，而不是对象本身（参见图 4.2））。\n\n```\n对象的赋值复制了引用\n```\n\n在赋值 `obj2 = obj1`\
    \ 后，两个变量都指向 `same`（同一个）对象。任何引用都可以用于“对话”并修改该对象，对象中的数据将是相同的。\n\n调用方法时发生相同的情况。如果将基本值作为参数传递，方法获得的是该值的\
    \ `copy`，但如果将对象作为参数传递，方法获得的是该 `reference` 的副本。\n\n很少需要复制对象，而且没有内置的、简单的方法来实现。如果必须进行复制，最好的方法可能是在类定义中添加一个拷贝构造函数。拷贝构造函数是一个接受与自身类型相同的对象作为参数的构造函数，将其所有数据值复制到新对象中。这必须小心进行，因为被复制对象的某些字段本身就是指向其他对象的引用。\n\
    \n### 4.1.9 构造函数 II\n\n当对象被构造时，它实际上是分层构造的，`Object` 是每个基础层。\n\n如果你有一个 `Customer`\
    \ 类，该类继承 `Person`，而 `Person` 继承 `Object`，那么当你创建一个新的 `Customer` 对象时，会发生什么：\n\n\
    *   `Customer` 的构造函数调用了 `Person` 的构造函数。\n\n"
- fmt: "\n* The constructor for `Person` calls the constructor for `Object`.\n   \
    \ * The constructor for `Object` creates and returns a basic object. own    *\
    \ The constructor for `Person` adds the data and methods needed for a `Person`\
    \ object, and returns it.\n* The constructor for `Customer` adds the data and\
    \ methods needed for a `Customer` object, and returns it.\n\nThe result is that\
    \ the `Customer` object inherits all the data and methods from `Person`, and all\
    \ the data and methods from `Object`. It can use these things just as if they\
    \ were defined here in the `Customer` class.\n\nThe first action in any constructor\
    \ must be to call a constructor for its superclass. You can write an explicit\
    \ call like this: `super(parameters);`. A call like this must be the very first\
    \ line in your constructor because the foundation must be built before you can\
    \ begin adding to it.\n\nIf you don’t explicitly call a constructor for the superclass,\
    \ Java supplies an implicit (“invisible”) call for you. If you could see it, it\
    \ would look like this: `super();`.\n\n> **Trap:** Java provides an invisible\
    \ constructor with no parameters if and only if you don’t write a constructor\
    \ for the class. Other code could depend on that invisible constructor. If you\
    \ later write an explicit constructor, the invisible constructor will disappear,\
    \ probably resulting in errors in previously working code.\n\nIf the `Person`\
    \ class has an explicit constructor that takes parameters, and you write `Customer`\
    \ as a subclass of `Person`, you must write a constructor that calls the `Person`\
    \ constructor with the proper arguments.\n\n```\npublic class Customer extends\
    \ Person {\n```\n\n```\nprivate double amountOwed = 0;\n```\n\n```\nprivate String\
    \ otherInfo;\n```\n\n```\n/** Here is the constructor */\n```\n\n```\nCustomer(String\
    \ name, String address,\n```\n\n```\nString otherInfo) {\n```\n\n```\nsuper(name,\
    \ address); // required\n```\n\n```\nthis.otherInfo = otherInfo;\n```\n\n```\n\
    }\n```\n\n```\n}\n```\n\nIn this example, `Customer` objects have the instance\
    \ variables `name` and `address` because they are inherited from the `Person`\
    \ class. These variables should not be declared again in the `Customer` class.\n\
    \nYou can have multiple constructors for a class, distinguished by the number\
    \ and/or types of the parameters. Each constructor can be independent of the others.\
    \ Often, however, one of these constructors does most of the work, and you would\
    \ like the other constructors to call it. You can do this by using the keyword\
    \ `this` instead of `super`.\n\nIf, in a constructor, you say `this(parameters)`\
    \ as the very first action, then that other constructor will be called, and it\
    \ is responsible for calling the superclass constructor. Constructors can be “chained”\
    \ in this way, and only the last constructor in the chain will call the superclass\
    \ constructor.\n\n### 4.1.10 Static\n\nAn object bundles together data about a\
    \ thing, and methods to operate on that thing. But objects are defined by classes,\
    \ and a class may have its own data and methods.\n\n> **Terminology:** A `class\
    \ variable` is a variable (field) that belongs to the class itself. A `class method`\
    \ is one that is not associated with any particular object. These are indicated\
    \ by the word `static` in their declaration.\n\nThere is only one copy of each\
    \ static variable, shared by all objects of that class. Static variables are used\
    \ to say something about the class or something that is the same for every object\
