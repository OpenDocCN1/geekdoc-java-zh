  trans: "\n\n控制语句（如 if 语句和循环）控制单个语句的执行。如果你想控制多于一个语句，则必须将这些语句封装在大括号 `{}` 中，以使它们成为一个（单条）复合语句。\n\
    \n> **风格：** 标准的 Java 风格是将左括号放在行末，而绝不将其单独放在一行。右括号的缩进量应与包含左括号的行保持相同。\n\n类或方法的体体始终是一个块（block）。\n\
    \n良好的风格要求块内的语句相对于相对于块的开始位置进行缩进。Java 的通常缩进是四个空格。\n\n### 3.3.1.2 赋值语句\n\n`assignment\
    \ statement` 为变量分配值。例如，如果 `x` 的类型是 `int`，那么\n\n```\nx = 5;\n```\n\n将 `5` 赋值给 `x`。\n\
    \n变量的值可以改变，但其类型不可。例如，赋值语句\n\n```\nx = 10;\n```\n\n将新值 `10` 赋值给 `x`。\n\n对于每个算术运算符\
    \ `op`，表达式\n\n```\nvariable op= expression;\n```\n\n是\n\n```\nvariable = variable\
    \ op expression;\n```\n\n的简写。\n\n例如，`x += 1;` 将 `1` 加到 `x`。\n\n### 3.3.1.3 方法调用与可变参数\n\
    \n方法调用可以作为语句，因为它们可以产生副作用。例如，如果 `a` 是一个数组，`a.sort()` 会对该数组排序。\n\n没有副作用的方法不应作为语句使用，因为它们没有执行任何操作。如果\
    \ `str` 是字符串 `\"Hello\"`，表达式 `str.toUpperCase()` 返回字符串 `\"HELLO\"`，这可以赋值给变量，但不会改变\
    \ `str` 的值。因此，将 `str.toUpperCase()` 作为语句不会产生任何效果。\n\n你可以编写一个接受数量数量参数（即可变参数 `varargs`）的方法。只需在最后一个参数的类型名后加上三个点。当调用该方法时，Java\
    \ 会为你将所有这些值放入一个数组中。\n\n```\npublic double average(double… args) {\n    double\
    \ sum = 0;\n    for (double arg: args) {\n        sum += arg;\n    }\n    return\
    \ sum / args.length;\n}\n```\n\n调用 `average(10.0, 20.0, 30, 41.0)` 将返回 `25.25`。\n\
    \n### 3.3.1.4 if 语句\n\nif 语句测试条件。如果条件为真，则执行后续语句（通常是复合语句）。如果条件为假，则 if 语句不执行任何操作。语法如下：\n\
    \n```\nif (condition) {\n    statements\n}\n```\n\n例如，下面的 if 语句会在 `x` 变为负数时将其重置为零。\n\
    \n```\nif (x < 0) {\n    x = 0;\n}\n```\n\nif 语句还可以有一个 `else` 分句。如果条件为真，则执行条件之后的语句。如果条件为假，则执行\
    \ `else` 关键字之后的语句。这两个语句通常都是复合语句。语法如下：\n\n```\nif (condition) {\n    some statements\n\
    } else {\n    some other statements\n}\n```\n\n例如，\n\n```\nif (x % 2 == 0) {\n\
    \    x = x / 2;\n} else {\n    x = 3 * x + 1\n}\n```\n\n良好的风格是始终使用大括号，即使它们只包含单条语句。然而，如果任何一部分只包含一条（非复合）语句，则省略大括号是允许的。如果你这样做，将单条语句与\
    \ `if` 或 `else` 放在同一行。\n\n```\nif (x % 2 == 0) x = x / 2;\nelse x = 3 * x + 1;\n\
    ```\n\nJava 与 Python 不同，没有单一关键字作为 `else if` 的缩写。\n\n```\nif (x < 0) {\n    System.out.println(\"\
    x is negative\");\n} else if (x > 0) {\n    System.out.println(\"x is positive\"\
    );\n} else {\n    System.out.println(\"x is zero\");\n}\n```\n\n### 3.3.1.5 while\
    \ 循环\n\nwhile 循环是一种测试在顶部的循环。其语法如下：\n\n```\nwhile (condition) {\n    statements\n\
    }\n```\n\n首先测试 `condition`；如果它为假，则不再进行任何操作，循环退出且从未执行 `statements`。如果 `condition`\
    \ 为真，则执行 `statements`，然后再次执行整个循环（从测试开始）。\n\n例如，非零数字的位数可以通过以下方式计算：\n\n```\nint\
    \ countDigits(int number) {\n    int count = 0;\n    while (number != 0) {\n \
    \       number = number / 10;\n        count += 1;\n    }\n    return count;\n\
    }\n```\n\n### 3.3.1.6 do-while 循环\n\ndo-while 循环是一种测试在底部而非顶部的循环。其语法如下：\n\n```\n\
    do {\n    statements\n} while (condition);\n```\n\n首先执行 `statements`，然后测试 `condition`；如果它为真，则再次执行整个循环。如果\
    \ `condition` 为假，循环退出。\n\n例如，假设你想在 0 到 1000 之间选择一个能被 7 整除的随机数。在你选择它之前无法测试该数字，因此\
    \ do-while 是合适的。\n\n```\nRandom rand = new Random();\nint x;\ndo {\n    x = rand.nextInt(1000);\n\
    } while (x % 7 != 0);\n```\n\n与其他类型的控制语句不同，do-while 中的大括号是强制要求的，即使循环中只有一条语句。以下代码不起作用：\n\
    \n```\ndo {\n    int x = rand.nextInt(1000);\n} while (x % 7 != 0); // error\n\
    ```\n\n### 3.3.1.7 传统的 for 循环\n\nfor 循环是一种测试在顶部的循环。其语法如下：\n\n```\nfor (initialization;\
    \ condition; update) {\n    statements\n}\n```\n\n首先执行 `initialization` 且仅一次。之后，测试\
    \ `condition`，如果为真，则执行 `statements` 并执行 `update`；然后控制权返回到 `condition`。换句话说，for\
    \ 循环的行为几乎与下面的 while 循环完全：\n\n```\ninitialization;\nwhile (condition) {\n    statements;\n\
    \    update;\n}\n```\n\n`initialization` 通常是对预先声明的变量进行赋值，例如 `i = 0`，或者是声明与赋值的结合，例如\
    \ `int i = 0`。`update` 通常是一个赋值语句，例如 `i += 1`。\n\n在 `initialization` 中声明的任何变量的作用域（即该变量可以使用范围）是整个\
    \ for 语句。\n\n"
