  trans: "\n\n*   `Person` 的构造函数调用了 `Object` 的构造函数。\n    * `Object` 的构造函数创建并返回一个基础对象。\n\
    \    * own`Person` 的构造函数添加了 `Person` 对象所需的数据和方法，并将其返回。\n* `Customer` 的构造函数添加了\
    \ `Customer` 对象所需的数据和方法，并将其返回。\n\n结果是，`Customer` 对象继承了来自 `Person` 的所有数据和方法，以及来自\
    \ `Object` 的所有数据和方法。它使用这些东西，就像它们是在 `Customer` 类中定义的一样一样。\n\n任何构造函数中的第一个动作必须是调用其父类的构造函数。你可以像这样写一个显式调用：`super(parameters);`。这样的调用必须是构造函数中的第一行，因为在开始在其添加内容之前，必须先构建好基础。\n\
    \n如果你没有显式地调用父类的构造函数，Java 会为你提供一个隐式的（“不可见的”）调用。如果你能看到它，它看起来像这样：`super();`。\n\n\
    > **陷阱：** 且仅当在你没有为该类编写构造函数时，Java 才会提供一个无参数的不可见构造函数。其他代码可能依赖于这个不可见的构造函数。如果你之后编写了显式构造函数，不可见的构造函数将会消失，可能会导致之前运行的代码出现错误。\n\
    \n如果 `Person` 类有一个接收参数的显式构造函数，而你将 `Customer` 写为 `Person` 的子类，你必须编写一个带有适当参数调用 `Person`\
    \ 构造函数的构造函数。\n\n```\npublic class Customer extends Person {\n```\n\n```\nprivate\
    \ double amountOwed = 0;\n```\n\n```\nprivate String otherInfo;\n```\n\n```\n\
    /** 这里是构造函数 */\n```\n\n```\nCustomer(String name, String address,\n```\n\n```\n\
    String otherInfo) {\n```\n\n```\nsuper(name, address); // 必须的\n```\n\n```\nthis.otherInfo\
    \ = otherInfo;\n```\n\n```\n}\n```\n\n```\n}\n```\n\n在这个示例中，`Customer` 对象拥有实例变量\
    \ `name` 和 `address`，因为它们继承自 `Person` 类。这些变量不应该在 `Customer` 类中再次声明。\n\n你可以为一个类拥有多个构造函数，通过参数的数量和/或类型来区分。每个构造函数都可以相互独立。然而，通常情况下，这些构造函数中的一个会执行大部分工作，而你希望其他构造函数调用它。你可以通过使用关键字\
    \ `this` 而不是 `super` 来实现这一点。\n\n如果在构造函数中你将 `this(parameters)` 作为第一个动作，那么另一个构造函数将被调用，并且它负责调用父类的构造函数。构造函数可以这样进行“链式调用”，并且只有链中的最后一个构造函数会调用父类的构造函数。\n\
    \n### 4.1.10 静态 (Static)\n\n对象将关于某事的数据以及操作该事的方法封装在一起。但对象是由类定义的，而类可以有它自己的数据和方法。\n\
    \n> **术语：** `类变量`是属于类本身的变量（字段）。`类方法`是不与任何特定对象关联的方法。这些在声明中通过 `static` 单词来标出。\n\n\
    每个静态变量只有一个副本，由该类的所有对象共享。静态变量用于说明关于类的一些信息，或者对于类中的每个对象都相同的内容。\n\n```\naccess static\
    \ type fieldName = expression;\n```\n\n```\naccess static returnType methodName(parameterList)\
    \ { … }\n```\n\n假设你有一个 `Customer` 类，每个 `Customer` 对象都持有关于该特定客户的信息。现在假设你想跟踪有多少个客户；即\
    \ `Customer` 对象被创建了多少次。你可以向类中添加一个 `howMany` 字段，但让每个 `Customer` 对象都拥有它自己的（可能不同的）`howMany`\
    \ 值是毫无意义的。解决方案是添加一个 `howMany` 字段，但将其设为静态的。\n\n```\npublic class Customer {\n```\n\
    \n```\nprivate String name;\n```\n\n```\nprivate String address;\n```\n\n```\n\
    private double amountOwed = 0;\n```\n\n```\nprivate static int howMany = 0;\n\
    ```\n\n```\nCustomer(String name, String address) {\n```\n\n```\nthis.name = name;\n\
    ```\n\n```\nthis.address = address;\n```\n\n```\nhowMany += 1;\n```\n\n```\n}\n\
    ```\n\n```\n}\n```\n\n现在，由于 `howMany` 是一个类变量，我们不需要特定的对象来调用它；我们可以说 `Customer.howMany`。\n\
    \n> **注意：** 我们不需要该类的对象来使用它的静态字段和方法，但如果我们有一个，我们也可以使用它。也就是说，如果 `richGuy` 是一个 `Customer`\
    \ 对象，我们可以说 `richGuy.howMany` 并获得与 `Customer.howMany` 相同的结果，或者与 `poorGuy.howMany`\
    \ 相同。这看起来可能很困惑，因为它是在向特定对象发送消息，但从对象的类中获取响应。\n\n静态方法（类方法的另一种名称）工作方式相同；它们附加到类上，而不是特定的对象。我们可以直接向类“说话”（发送消息），或者间接地通过与该类的任何对象说话来交流。例如，\n\
    \n```\nstatic int getHowMany() {\n```\n\n```\nreturn howMany;\n```\n\n```\n}\n\
    ```\n\n```\n…\n```\n\n```\nint customers;\n```\n\n```\n// 以下行都是等价的\n```\n\n```\n\
    customers = Customer.getHowMany();\n```\n\n```\ncustomers = richGuy.getHowMany();\n\
    ```\n\n```\ncustomers = poorGuy.getHowMany();\n```\n\n静态方法不属于任何特定对象（实例），因此它们不能使用实例变量或方法也应该设为静态。\n\
    \n```\nstatic double feetToMiles(double feet) {\n```\n\n```\nreturn feet / 5280.0;\n\
    ```\n\n```\n}\n```\n\n### 4.1.11 逃离静态限制\n\nJava 是面向对象的，而不是面向类的。也就是说，对象被频繁使用，而类几乎完全用于定义和创建对象。\n\
    \n然而，Java 程序始终从静态上下文开始，即 `public static void main(String[] args)` 方法。因为它是静态的，它不能使用实例变量。\n\
    \n如果你想做的事情足够简单，你可能只想写一个包含几个方法的类。在这种情况下，你可以将每个方法都设为静态的，但这很麻烦。或者，你可以创建一个你所在的类的对象，并对其调用一个非静态方法。这就是我们在书中非常早的时候做的。\n\
    \n```\npublic class MyClass {\n```\n\n```\npublic static void main(String[] args)\
    \ {\n```\n\n```\nnew MyClass().run();\n```\n}\n```\n\n```\nvoid run() {\n```\n\
    \n```\nSystem.out.println(\"Hello World\");\n```\n}\n```\n\n```\n}\n```\n\n这个程序启动，正如每个\
    \ Java 程序一样，在静态方法 `main` 中。然后它创建一个新的 `MyClass` 对象并立即调用该对象的 `run` 方法。现在其他一切都可以从\
    \ `run` 方法开始，你不再被强制将所有内容都设为静态。\n\n### 4.1.12 main 方法\n\n我们现在可以解释极其复杂的 main 方法了。它看起来如下：\n\
    \n```\npublic class MyClass {\n```\n\n```\npublic static void main(String[] args)\
    \ { … }\n```\n\n类的名称是 `MyClass`，所以它必须位于一个名为 `MyClass.java` 的文件中。编译它会生成一个新文件 `MyClass.class`，它是准备好执行的。从你喜欢的操作系统，你或你的\
    \ IDE 尝试执行此文件。如何做到？\n\n*   `public`: 类和方法都必须是公共的，也就是说从任何地方可用。特别，它必须对你的操作系统可用。\n\
    \n"
- fmt: "\n- `static`: Compiling the program defines the class `MyClass` (and any other\
    \ classes in your program), but there are no objects yet, just classes. Since\
    \ there are no objects, neither are there any instance methods. But the `main`\
    \ method is static and it belongs to the class `MyClass`, which does already exist.\
    \ Therefore, the operating system can send the message `main` to the class `MyClass`.\n\
    - `void`: The `main` method does not return a result.\n- `main`: The operating\
    \ system always starts a Java program by sending it the message `main(arguments)`.\
    \ Specifically, since it is trying to run a program on the file named `MyClass.class`\
    \ (compiled from `MyClass.java`), it sends the message `main` to the class `MyClass`.\n\
    \    - More than one class can have a `main` method, so you can have more than\
    \ one possible starting point in a program. For example, you might have one program\
    \ to both encode and decode messages and have a `main` method in both an `Encoder`\
    \ class and a `Decoder` class.\n- `(String[] args)`: The `main` method can take\
    \ arguments, either from the command line or from the IDE. Arguments are separated\
    \ by spaces, and come in as `strings`. It's okay if there are no arguments—zero-length\
    \ arrays are legal in Java.\n\nAs an example of one of the simplest Java programs\
    \ you can have, suppose you have the following program on a file named `MyClass.java`\
    \ in a folder named `myPackage`:\n\n```java\npackage myPackage;\n```\n\n```java\n\
    public class MyClass {\n    public static void main(String[] args) {\n       \
    \ System.out.println(args[0] + args[1]);\n    }\n}\n```\n\nIf you are in a folder/directory\
    \ containing the folder `myPackage`, you can compile this program with:\n\n```bash\n\
    javac myPackage/MyClass.java\n```\n\nYou can run it by saying:\n\n```bash\njava\
    \ myPackage/MyClass abc 123\n```\n\nAnd the result will be:\n\n```\nabc123\n```\n\
    \n### 4.1.13 A More Complete Example\n\nThe following is a complete, if rather\
    \ pointless, example of a program that uses classes and objects.\n\nThis code\
    \ is in a file named `Counter.java`, in a folder (directory) named `tools`. The\
    \ names of folders and files must exactly match the names of packages and classes.\
    \ (Your IDE will take care of this for you.) There may be, and probably are, other\
    \ classes in this same package/folder.\n\n```java\npackage tools;\n\n/**\n * A\
    \ simple counter class\n */\npublic class Counter {\n    private int count; //\
    \ a field\n\n    /** Constructor to make a Counter\n     * object with an initial\
    \ value.\n     */\n    public Counter(int initial) {\n        count = initial;\n\
    \    }\n\n    /** increments the counter by n. */\n    public void bump(int n)\
    \ {\n        count += n;\n    }\n\n    /** increments the counter by 1. */\n \
    \   public void bump() {\n        bump(1);\n    }\n\n    /** returns the value\
    \ of the counter. */\n    public int getCount() {\n        return count;\n   \
    \ }\n}\n```\n\nThe class describes a new type, the `Counter` type.\n\nThe class\
    \ has one field, `int count`. Every object made from this class will have its\
    \ own `count` field, so you can have multiple counters keeping track of different\
    \ values. The constructor takes a parameter `initial` to use as the initial value\
    \ of `count`.\n\nThe class has three methods, two named `bump` and one named `getCount`.\
    \ These are declared public so they can be used from outside the package. The\
