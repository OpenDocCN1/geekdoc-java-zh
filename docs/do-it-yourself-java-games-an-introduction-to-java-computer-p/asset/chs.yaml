  \ 关键点及更多\n\n* 将你可能希望让其他类使用的方法放在单独的类中。\n\n* 方法可以是私有的（private）、受保护的（protected）或公有的（public）。\n\
  \    * `private` 方法只能由定义它的类使用。\n    * `protected` 方法可以在定义它的类以及任何继承该类的类中使用。\n   \
  \ * `public` 方法可以在任何类中使用，甚至是在互不相关的类中。\n\n* 除非你有理由让方法变为受保护的或公有的，否则将所有方法都设为 `private`。\n\
  \n* `static` 方法必须是自包含的。它只能使用作为参数传递的数据或在方法内部声明的数据。而且，它只能使用 Java 自带的方法或同样是静态的方法。\n\
  \n* 要将方法声明为 `static`，请在 `private`、`protected` 或 `public` 单词之后添加 `static` 单词。\n\n\
  * 公共静态方法可以通过在方法名前加上类名来从任何类中轻松调用。例如，`scramble()` 是 `MyStringMethods` 的一个公共静态方法。要调用它，使用：\n\
  \n```\nnewWord = MyStringMethods.scramble(word);\n```\n\n* 非静态的公共方法需要你先声明一个该类型的新变量，然后从该变量调用方法。例如，`nextInt()`\
  \ 是 `Random()` 的一个公共方法，但它不是静态的。要调用它，使用：\n\n```\nRandom rand = new Random();\nindex\
  \ = rand.nextInt(10);\n```\n\n* 在之前的一个课程中，`MyWindow` 继承了 `DIYWindow`（父类）以共享 `promptForInt()`\
  \ 方法。为什么 `MyStringMethods` 不也继承 `DIYWindow` 呢？当方法应该被相同类型（父类）的类使用时，继承父类。`scramble()`\
  \ 不仅会被 `DIYWindow` 类或 `MyWindow` 类使用。因此，`scramble()` 不应该放在继承这些类的中。\n\n* `scramble()`\
  \ 和 `parseInt()` 都是静态方法。为什么你必须将 `My String Methods` 项目添加到构建路径才能使用 `scramble()`，但你不需要添加\
  \ `Integer` 项目就可以使用 `parseInt()`？`Integer` 类是 Java 开发工具包（JDK）的一部分。因此，`Integer` 已经包含在每个类的构建路径中了`MyStringMethods`\
  \ 不是 Java 开发工具包的一部分，所以你必须手动将 `My String Methods` 添加到构建路径。\n\n# 项目 13 - Secret 代码\
  \ (Secret Code)\n\nSecret Code 程序允许你创建与朋友分享的秘密信息。\n\n这里是 Secret Code 程序的截图：\n\n\
  ![](img/00036.jpeg)\n\n## 课程 13.1 - 写入文件\n\n将数据写入文件，以便数据可以被同一个程序或另一个程序再次使用。\n\n\
  在本节中，你将创建一个用于编码和解码消息的密钥，然后将该密钥写入文件。\n\n### 尝试一下\n\n开始编写下一个程序：\n\n1. 创建名为 `Secret\
