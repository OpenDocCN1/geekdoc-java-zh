  \ Windows、Mac 或 Linux 操作系统的电脑上运行。然而，本书没有提供如何在这些系统上安装和设置的说明。\n\n## 创建 Java 文件夹\n\n\
  在你的电脑上创建一个自己的工作文件夹。建议将 Java 文件夹放在用户文件夹中，但你也可以放在电脑的任何位置。我将我的文件夹命名为 `java` 并放在用户文件夹\
  \ `c:\\Users\\Annette` 中。\n\n在 Windows 7 中创建文件夹，点击`开始 / 计算机` 打开`Windows 资源管理器`。在\
  \ Windows 10 中，点击`开始 / 资源管理器`。然后转到你想创建新文件夹的目录，点击`新建文件夹`按钮。为你的文件夹命名。\n\n如果你和另一个也想进行\
  \ Java 编程的人共享电脑，请为你们每个人创建一个不同的 Java 工作文件夹。你们的 Java 文件夹必须名称不同，或者位于不同的文件夹中。\n\n##\
  \ 下载并安装 Java\n\n你将使用 Java 语言编写程序。你的电脑需要免费的 Java 开发工具包来从 Java 代码生成程序。Java 开发工具包只需要在你的电脑上安装一次，无论计划有多少人计划进行\
  \ Java 编程。\n\n安装开发工具包：\n\n1. 访问 `http://www.oracle.com/technetwork/java/downloads/index.html`。\n\
  2. 点击下所示下载按钮，下载适用于 `Java 标准版` (`SE`) 的最新版本 `Java 开发工具包` (`JDK`)。\n3. 如图所示，接受许可协议。根据你拥有的\
  \ Windows 版本，下载 Windows x86 或 Windows x64 版本的工具包。Windows x86 适用于 32 位 Windows；Windows64\
  \ 适用于 64 位 Windows。\n    - 如何知道你拥有 32 位还是 64 位的 Windows？在 Windows 7 中，点击`开始 / 计算机`查看`系统`。在\
  \ Windows 10 中，点击`开始 / 设置 / 关于`。`系统类型`会指示你是 32 位还是 64 位的操作系统。\n4. 双击下载的 `.exe` 文件安装\
  \ Java。你应该接受所有的安装默认。\n\n## 下载并安装 Eclipse\n\nEclipse 是一个免费的 Java 开发环境。Eclipse 可以简化代码输入、识别编程错误并建议修复方法。\n\
  \n建议将 Eclipse 安装在你的用户文件夹中，但你也可以将其放在电脑的任何位置。我把它放在用户文件夹 `c:\\Users\\Annette` 中。\n\n\
  1. 从 `http://www.eclipse.org/downloads/` 下载最新版本的 `Java 版 IDE`。根据你的 Windows 版本，下载\
  \ 32 位或 64 位版本到电脑的任何位置。\n2. 要压缩下载的 `.zip` 文件，右键点击文件名，选择`解压所有...`，并浏览你想安装 Eclipse\
  \ 的文件夹。我将其解压到了用户文件夹 `c:/Users/Annette/`。\n    - 如果你和其他人共享电脑进行 Eclipse 编程，请将每个人的\
  \ Eclipse 副本解压到不同的文件夹。\n\n在桌面上为 Eclipse 创建快捷方式。这些说明适用于 Windows 7 和 10：\n\n1. 打开从\
  \ `.zip` 文件解压时创建的 `eclipse` 文件夹。我的 `eclipse` 文件夹位于 `c:/Users/Annette`。\n2. 右键点击\
  \ `eclipse.exe` 并选择`复制`。\n3. 在桌面上右键点击并选择`粘贴快捷方式`。\n4. 如果你不是电脑上唯一使用 Eclipse 编程的人，右键点击刚刚创建的快捷方式并根据你的需要重命名。例如，我将其重命名为\
  \ `Eclipse for Annette`。\n\n## 下载 DIYJava.zip\n\n课程需要一些文件。这些文件包含在 Godland Software\
