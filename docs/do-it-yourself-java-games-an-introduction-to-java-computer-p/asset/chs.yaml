  *   如果一个方法定义了多个参数，调用该方法时必须以相同的顺序传递相同数量的参数。\n\n## 第 13.4 节 - 字符串中字符的索引\n\n你的 Secret\
  \ Code 程序需要从字母表字符串中找到消息的每个字符，并找到哪个字符位于密钥字符串的相同位置。为了做到这一点，它必须找到字符在字符串中的索引（index）。\n\
  \n### 尝试一试\n\nString 的 `indexOf()` 方法返回搜索字符串在字符串中首次出现的位置。例如，如果一个名为 `text` 的变量值为“Hello\
  \ World”，而你想知道字符串中空格的位置，你应该使用：\n\n```\ntext.indexOf(\" \");\n```\n\n上述代码将返回值 5，因为字符串中的索引从\
  \ 0 开始计数。\n\n如果搜索字符串在字符串中出现多次，`indexOf()` 返回其第一次出现的位置。例如：\n\n```\ntext.indexOf(\"\
  l\");\n```\n\n将返回值 2。\n\n如果搜索字符串不在字符串中，它返回值 -1。例如：\n\n```\ntext.indexOf(\"a\");\n\
  ```\n\n将返回值 -1。\n\n方法 `indexOf()` 是区分大小写的。例如：\n\n```\ntext.indexOf(\"h\");\n```\n\
