  \n这里是温度转换器的截图：\n\n![](img/0003.jpeg)\n\n## Lesson 10.1 - 运算顺序\n\nJava 允许你在语句中进行加、减、乘、除以及调用其他方法。Java\
  \ 按默认顺序执行这些操作。本节向你展示当存在多个操作时如何控制 Java 的顺序。\n\n### 尝试一下\n\n开始编写下一个程序：\n\n1.  创建一个名为\
  \ `Temperature Converter` 的 Java 项目，并将 `MyWindow` 和 `DIY.jar` 添加到项目中。\n2.  在项目中创建一个名为\
  \ `.temperatureconverter` 的包。\n3.  创建一个名为 `TemperatureConverter` 的类，父类为 `MyWindow`\
