  - 方法名可以包含数字、字母、美元符号和下划线。通常不使用美元符号和下划线。\n- 方法名中不允许出现空格或点。\n- 方法名不能以数字开头。\n- 方法名通常以`lowercase`\
  \ 小写字母开头。\n- 方法名通常全小写。但是，如果方法名包含多个单词，第一个单词的首字母通常小写，其他所有单词的首字母都大写。\n- 方法名后面总是跟着括号。\n\
