  \n### 关键点及更多\n\n*   要向文件写入内容，请创建一个 `BufferedWriter` 变量，根据需要多次调用其 `write()` 方法，然后使用\
  \ `close()` 关闭文件。\n    *   只有字符串可以写入文件。因此，在将数据写入文件之前，你必须先将数据转换为字符串。\n    *   调用\
  \ `newLine()` 方法使下一次 `write()` 写入文件中的新行。\n    *   如果每个变量稍后都要从文件中读取并放入单独的变量中，请每个变量写入新的一行。\n\
  * 写入文件可能会导致 `IOException`。将创建、写入和关闭步骤，以及任何你不希望在无法打开文件时运行的代码，封装在 `try/catch` 块中。\n\
  *   如果文件不存在，写入文件将创建一个新文件。\n*   如果文件已存在，写入文件将替换文件中的原有内容。\n*   不带路径名的写入操作将将文件放在你类的\
  \ Java 项目文件夹中。\n*   如果你想将文件保存到不同的位置，请在文件名中包含路径名。路径名是从驱动器号开始的完整文件夹名称。然而，请记住，在运行程序的任何计算机上，该路径都必须已经存在。例如，要将\
  \ `key.txt` 保存到 `c:\\users\\Annette\\`，请使用以下代码。（提示：在 Java 字符串的每个反斜杠前使用转义字符。）\n\n\
  ```\nfileName = \"c:\\\\users\\\\Annette\\\\key.txt\";\n```\n\n*   使用记事本或其他任何其他基础文本编辑器查看写入文件的内容。\n\
  *   你想在你的秘密信息中编码哪些字符？仅仅是字母表吗？大写和小写字母？数字、空格或标点符号呢？将所有你想编码的字符放入 `alphabet` 中并再次运行程序。原始\
  \ `alphabet` 中包含的字符越多，别人试图破解你的加密信息就越困难。\n\n## 第 13.2 节 - 从文件读取，捕获多个异常\n\n在本节中，你将使用另一个程序来读取上一个程序写入文件的数据。从文件中读取时可能会发生多个异常。\n\
