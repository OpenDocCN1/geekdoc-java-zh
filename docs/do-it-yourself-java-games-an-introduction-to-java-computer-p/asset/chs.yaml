  \ `ChooseAnAdventure.java`*\n\n* * *\n\n```\n ...\n\n  public ChooseAnAdventure()\
  \ {\n\n      ...\n\n    String choice = input();\n\n    switch(choice) {\n    case\
  \ \"___\" :  \n      print(\"______________________\");\n      break;\n    case\
  \ \"___\" :  \n      print(\"______________________\");\n      break;\n    case\
  \ \"___\" :  \n      print(\"______________________\");\n      break;\n    }\n \
