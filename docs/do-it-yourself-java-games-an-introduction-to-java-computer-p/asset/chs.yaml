  ```\n《动手 Java 游戏》已更新至第二版，以支持 Windows 10 和 Java 8。\n\n# 设置\n\nJava 编程的第一步是安装并设置几个需要的程序。如果你需要更详细的设置说明，请参见\
  \ `附录 C - 安装所需的软件和文件`。完成这个简短的设置后，你将编写第一个 Java 程序。\n\n## 创建 Java 工作文件夹\n\n首先，在你的电脑上创建一个用于所有\
  \ Java 工作的文件夹。我将我的文件夹命名为 `java` 并将其放在用户文件夹 `c:\\Users\\Annette` 中。因此，我的 Java 工作文件夹是\
  \ `c:\\Users\\Annette\\java`。\n\n如果有多个人要在你的电脑上创建 Java 程序，你应该为每个人创建一个不同的工作文件夹。本书将你需要执行的每个操作都列在编号列表中，如下所示：\n\
  \n1. 在你的电脑上创建一个 Java 工作文件夹。\n\n如果你想查看如何创建工作文件夹的更详细说明，请参见 `附录 C - 安装所需的软件和文件`。\n\n\
  ## 下载并安装 Java\n\n创建 Java 程序需要免费的 Java 开发工具包。\n\n1. 从 `http://www.oracle.com/technetwork/java/javase/downloads/index.html`\
  \ 下载适用于 `Java 标准版 (SE)` 的最新版本 `Java 开发工具包` (`JDK`)。如果你不确定应该下载哪个版本，请参见 `附录 C - 安装所需的软件和文件`。\n\
  2. 双击下载的文件进行安装。\n\n## 下载并安装 Eclipse\n\n你将使用免费的 Eclipse Java 开发环境来输入入你的 Java 程序代码并创建你的程序。\n\
  \n\n\n\n\n1. 从 [*http://www.eclipse.org/downloads/](http://www.eclipse.org/downloads/)\
  \ 下载最新版本的 `Eclipse IDE for Java Developers`。\n\n2. 从下载的 .zip 文件中提取文件到你的电脑。我把我的放在用户文件夹\
  \ `c:\\Users\\Annette` 中。如果有有多人在你的电脑上创建 Java 程序，请为每个额外的人再次提取文件到不同的文件夹中。\n\n3. 在你刚刚解出的\
  \ `eclipse` 目录中为 `eclipse.exe` 文件创建一个快捷方式。我的文件位于 `c:\\Users\\Annette\\eclipse`。将此启动\
  \ Eclipse 的快捷方式粘贴到你的桌面上。如果有有多人在你的电脑上创建 Java 程序，请为你们的每个人创建并重命名一个快捷方式。例如，我将我的重命名为\
  \ `Eclipse for Annette`。\n\n如果你想了解有关如何下载和安装 Eclipse 或创建快捷方式的更详细说明，请查看*附录 C - 安装所需的软件和文件*。\n\
