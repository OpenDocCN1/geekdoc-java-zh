  c\" :  \n      plantTheBeans();\n      break;\n    default :  \n      __________;\n\
  \    }\n      ...\n```\n\n* * *\n\n*完成列表*\n\n如果你现在运行程序并输入“a”、“b”或“c”以外的内容，它将重复故事和选项。\n\
