  \ 格的底部，如图所示：\n\n![](img/00008.jpeg)\n\n你现在已经了创建第一个程序所需的所有内容！\n\n# 项目 1 - Hello World\n\
  \n传统上，每个人的第一个程序都是打印“Hello World”。第一个程序演示了如何创建、保存和运行程序。它还展示了所有 Java 程序中使用的基本结构。\n\
  \n这是 Hello World 程序创建的窗口截图：\n\n![](img/00009.jpeg)\n\n## 课程 1.1 - Java 项目和包\n\n\
  程序首先按 Java 项目组织，然后按 Java 项目中的包组织。你将为书中的每个程序创建一个 Java 项目。\n\n包包含通常被一起使用的程序文件。由于书中的程序很小，你创建的大多数\
  \ Java 项目将只包含一个包。\n\n在本课程中，你将为你的第一个程序创建一个 Java 项目和一个包。\n\n### 试一试\n\n创建你的第一个 Java\
  \ 项目，命名为 `Hello World` ：\n\n1. 如果 Eclipse 尚未打开：\n    1. 双击你在桌面上创建的 `Eclipse` 快捷方式。\n\
  \    2. 点击 `OK` 使用你的 Java 工作文件夹作为工作空间。\n\n2. 在 `Package Explorer` 格中点击右键并选择 `New\
  \ / Java Project`。\n\n3. 将 Java 项目命名为 `Hello World`，如果 JRE 是 1.7 或更高，则选择 `Use Default\
  \ JRE`，然后如如下所示点击 `Next`。如果默认 JRE 低于 1.7，选择选项 `Use an execution environment JRE`\
  \ 并选择 1.7 或更高版本。\n\n![](img/00010.jpeg)\n\n4. 点击`Libraries*`，然后点击 `Add External\
  \ JARs...,`，如下所示。\n\n![](img/00011.jpeg)\n\n5. 浏览并选择安装在 Java 工作文件夹中的 `DIYJava.jar`，然后点击\
  \ `Open`。\n\n6. 点击 `Finish`。\n\n`Package Explorer` 格现在列出了一个项目（`Hello World`）以及添加\
  \ JAR 文件 (`DIYJava.jar`)，如图所示：\n\n![](img/00012.jpeg)\n\n为 `Hello World` 项目中的你的\
  \ Hello World 程序创建一个包：\n\n1. 在 `Hello World` 项目上点击右键并选择 `New / Package`。\n2. 将包命名为\
  \ `annette.godtland`，如图。\n3. 点击 `Finish`。\n\n`Package Explorer` 格现在显示你创建的包：\n\n\
  ![](img/00013.jpeg)\n\n### 关键点及更多\n\n- Java 程序员传统上使用他们的名字或公司名作为包名的第一部分。\n- 使用全小写字母且无空格。\n\
  - 在包名的不同类别之间使用点。例如，如果包名标识了创建者和用途，在创建者和用途之间加一个点。\n- 在创建书中的 Java 项目时，请确保选择 JavaSE-1.7\
  \ 或更高版本。一旦在创建项目时选择了此选项，Eclipse 将对此后的所有项目默认使用该选项。\n- Java 项目用于 Eclipse；包用于 Java。由于你正在使用\
  \ Eclipse，所以你将同时使用 Java 项目和包。\n\n## 课程 1.2 - 类、超类和程序\n\nJava 程序由一个或多个类组成。类包含实际的程序代码：按顺序执行所需任务的指令。\n\
  \n每个类都必须指定另一个类作为其超类。例如，打算在窗口中运行的程序必须指定某种窗口类作为其超类。\n\n在本课程中，你将创建你的第一个类：一个运行在 `DIYWindow`\
  \ 中的程序。\n\n### 试一试\n\n使用 `DIYWindow` 类作为超类创建你的第一个类：\n\n1. 在 `Package Explorer` 格中的你的包上点击右键并选择\
  \ `New / Class`。\n2. 为类名输入 `HelloWorld`，如下所示。（提示：“Hello”和“World”之间没有空格。）\n3. 在 *Superclass*\
  \ 处点击 `Browse`。\n    1. 为 *type* 输入“diy”，选择 `DIYWindow`，*如下所示，*然后点击 `OK`。\n\n\n\n\
  \n\n### 4. 你想要创建哪些方法的存根（stubs）？请选择这些选项，如下所示：\n\n1. `public static void main (String[]\
  \ args)`。\n2. 来自父类的 `Constructors`（构造函数）。\n3. 是否选择第三选项 `Inherit abstract methods`（继承抽象方法）并不重要。\n\
