  \  }\n```\n\n* * *\n\n*完成的列表*\n\n接下来，我们将字母表和密钥保存到文件中。写入文件涉及以下步骤：\n\n* 通过创建 `BufferedWriter`\
  \ 变量打开文件。\n* 通过调用 BufferedWriter 的 `write()` 方法写入文件。\n    * 重复调用 `write()` 直到所有字符串都写入文件。\n\
  \    * 如果你想让下一个字符串位于文件的新的一行，请使用 BufferedWriter 的 `newLine()` 方法。\n* 通过调用 BufferedWriter\
  \ 的 `close()` 方法关闭文件。\n\n例如，要将 *Hello* 和 *World* 写入名为 `myFile.txt` 的文件，且每个单词占据单独一行，使用以下代码：\n\
