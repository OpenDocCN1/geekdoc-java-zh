  * 数组是数据列表。一旦声明了数组，其大小就无法更改。\n* 数组只能包含一种类型的数据，例如字符串、整数、双点数，甚至是你自己定义的类型。在声明数组时，需要声明数组将要存储的数据类型。\n\
