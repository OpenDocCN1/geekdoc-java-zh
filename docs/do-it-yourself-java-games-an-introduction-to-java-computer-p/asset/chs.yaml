  * * *\n\n```\n ...\n\n  public ChooseAnAdventure() {\n\n      ...\n\n    print(\"\
  c) Plant the beans?\");\n    String _________ = _______________;\n\n      ...\n\
  ```\n\n* * *\n\n完成列表 你可以写一个长的 `if` 语句来检查 `choice` 是否等于 `\"a\"`，否则如果 `choice` 等于\
  \ `\"b\"`，否则如果 `choice` 等于 `\"c\"`。然而，还有另一种类型的代码可以检查值是否等于几个选择之一。它被称为 `switch` 语句。\n\
  \n通常的 `switch` 语句如下：\n\n```\nswitch(________) {\ncase ______ :\n  ________________;\
  \ \n  ________________; \n  break;\ncase ______ :\n  ________________; \n  ________________;\
  \ \n  break;\ncase ______ :\n  ________________; \n  ________________; \n  break;\n\
  }\n```\n\n为了填充 `switch` 语句的细节：\n\n* **switch** - 在括号中放入要检查不同值的变量。例如，如果你想检查变量 `reply`\
  \ 是否为 `\"Yes\"` 或 `\"No\"`，请使用：\n\n```\nswitch(reply) {\n```\n\n* case - 为每个预期值创建一个\
  \ `case` 及其值。例如，如果预期值之一是 `\"Yes\"`，请使用：\n\n```\ncase \"Yes\" :\n```\n\n* **:** -\
  \ 在冒号后放置一行或多行代码，当变量具有该 `case` 的值时运行它们。\n\n* break**;** - 在 `case` 代码的末尾放置 `break`\
  \ 语句。程序随后将跳到 `switch` 语句的结束。\n\n1. 添加一个 `switch` 语句到：\n    1. 如果用户输入 `\"a\"`，打印“正在上山。”\n\
