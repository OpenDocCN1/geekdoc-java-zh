  \n*   为什么你不直接将 `word` 和 `clue` 作为参数传递给这些方法呢？正如前面的课程中提到的，参数只发送变量的副本。如果方法更改了声明为参数的变量，它更改的只是副本，而不是原始值。你需要通过这些方法来更改原始变量的值。因此，你不能直接将它们作为参数传递。\n\
  \n## 课程 14.4 - 将字符串转换为大写\n\n如果用户可以使用大写（大写字母）或小写字母输入内容，程序将更易用。然而，Java 字符串是区分大小写的。例如：在\
  \ Java 中，“Quit”不等于“quit”。\n\n你可以通过将所有用户输入以及你计划与其比较的文本转换为大写，来编写程序使输入不区分大小写。这样，用户就可以输入大写或小写的文本。\n\
  \n### 尝试一下\n\n如果单词是“quit”且猜测是“lint”，你的程序现在会打印正确的提示。接下来，让用户输入他们自己的猜测。\n\n1.  修改代码，让用户猜测一个单词，而不是将\
  \ `guess` 设置为“lint”。\n2.  创建 `word` 的副本并将其放入名为 `originalWord` 的新字符串中。\n3.  创建一个名为\
  \ `solved` 的布尔值，初始设为 `false`。\n4.  在 `solved` 不为 true 时重复这些步骤：\n\n    1.  将 `word`\
