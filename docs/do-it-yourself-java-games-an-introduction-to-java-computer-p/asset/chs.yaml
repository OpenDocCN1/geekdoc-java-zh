  \n## 课程 2.2 - 导出程序 (Export a Program)\n\n如果你想在没有 Eclipse 的情况下运行程序，或者想在不同的计算机上运行它，你必须\
  \ `export`（导出）完成后的程序。\n\n如果你导出了程序，它将在你的计算机上生成一个 `JAR` 文件（Java 归档文件）。`JAR` 文件名以 `.jar`\
  \ 结尾。要运行程序，双击 `JAR` 文件即可。\n\n### 尝试一下 (Try It)\n\n1. 在 `Package Explorer` 格中右键点击\
  \ `ASCII Art` 项目并选择 `Export`。\n2. 如下图所示，选择 `Runnable JAR File`，并点击 `Next`。\n3. 如下所示，选择\
  \ `ASCIIArt` `Launch configuration,`（启动配置）。\n4. 如下所示，在 `Export destination`（导出目标）处输入\
  \ `ASCIIArt.jar`。\n5. 如图所示，选择 `Package required libraries into generated JAR`（将所需的库打包到生成的\
  \ JAR）选项：\n\n![](img/00020.jpeg)\n\n6. 点击 `Finish` 完成导出。\n\n要在没有 Eclipse 的情况下运行你的程序：\n\
  \n1. 在你的 Java 工作文件夹中找到 `ASCIIArt.jar`。\n2. 双击 `ASCIIArt.jar`。\n\n### 关键点及更多内容\n\n\
  * 如果你想在 Eclipse 之外或不同的计算机上运行程序，请将程序导出为 `JAR` 文件。\n* 你可以将不同版本的程序保存在不同的 `JAR` 文件中。例如，你可能为不同的\
  \ ASCII 图片准备不同的 `JAR` 文件。使用所有相同的导出选项，但为每个版本的程序命名不同的 `Export destination`。\n* 你导出的\
  \ `JAR` 文件可以在任何安装了 `Java Runtime Environment`（Java 运行时）的 Windows、Mac、Linux 或 Solaris\
  \ 计算机上运行。\n    * 大多数计算机为了运行其他程序已经安装了 `Java Runtime Environment`。\n    * `Java Runtime\
  \ Environment` 已在你安装的 `Java Development Kit`（Java 开发工具包）中。因此，它已经安装在你的计算机上。\n   \
  \ * 任何人都可以从 http://java.com/en/download/index.jsp`](http://java.com/en/download/index.jsp)\
  \ 下载并安装 `Java Runtime Environment`，而无需 `Java Development Kit`。\n\n## 课程 2.3 - 分享程序\
  \ (Share a Program)\n\n有很多方法可以分享你的程序。本课将教你如何使用 `Google Drive` 和 `Facebook` 分享程序。这些说明假设你已经拥有\
  \ Google 和 Facebook 账号。\n\n查看本课末的“关键点及更多内容”了解分享程序的其他方法。\n\n### 尝试一下 (Try It)\n\n\
  1. 进入[`drive.google.com``](http://drive.google.com/) 的 Google Drive 并登录你的账号。\n2.\
  \ 点击如下所示的 `new` 按钮并选择 `File upload`（上传文件）。\n\n![](img/00021.jpeg)\n\n3. 浏览并选择你想分享的\
  \ `JAR` 文件。\n4. 上传完成后，右键点击上传的 `JAR` 文件并选择 `Share`（分享）。\n5. 点击窗口右下角的 `Advanced`（高级）链接：\n\
  \n![](img/00022.jpeg)\n6. 点击如下所示的 `Share link via Facebook`（通过 Facebook 分享链接）按钮。\n\
  7. 编写一条 `Facebook` 动态来介绍你的链接。![](img/00023.jpeg)\n\n### 关键点及更多内容\n\n* 要分享程序，请执行以下操作之一：\n\
  \    * 将 `JAR` 文件作为附件通过电子邮件发送给朋友。\n    * 将 `JAR` 文件放在网上，然后分享该文件的链接。\n* 要将你的 `JAR`\
  \ 文件放在网上，请执行以下操作之一：\n    * 将其放在你自己的网站上。\n    * 将其放在 Google Drive 上。\n    * 将其放入\
  \ Dropbox。\n\n## 3.1 - 重用字符串 (Reuse Strings)\n\n字符串变量可以设置一次，然后多次使用。字符串变量使得更改单词或短语变得简单。\n\
