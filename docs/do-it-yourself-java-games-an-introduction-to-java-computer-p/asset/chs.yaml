  \ `setFontSize` 代码行。\n\n## 课程 1.3 - 变量与字符串\n\n变量是命名的数据片段。字符串变量持有字符数据序列（文本）。如果你将文本放入字符串中，你就可以保存、使用和重复使用文本。\n\
  \n### 尝试一下\n\n1. 将类构造函数中的代码替换为以下代码。按照所示精确输入代码。\n\n*列表 1-8，来自 HelloWorld.java*\n\n\
  ```java\n ...\n\n  public HelloWorld() {\n    String word1 = \"Jeff's\";\n    String\
  \ word2 = \"awesome\";\n    String word3 = \"dog\";\n    print(word1);    \n   \
  \ print(word2);    \n    print(word3);    \n  }\n    ...\n```\n\n*[完成后的列表]*\n\n\
  它打印了什么？\n\n1. 反转前 2 个 `print` 语句的内容。\n\n*列表 1-9，来自 HelloWorld.java*\n\n```java\n\
  \ ...\n\n  public HelloWorld() {\n    String word1 = \"Jeff's\";\n    String word2\
  \ = \"awesome\";\n    String word3 = \"dog\";\n    print(word2);    \n    print(word1);\
  \    \n    print(word3);    \n  }\n    ...\n```\n\n*[完成后的列表]*\n\n注意，单词是 `print`\
  \ 语句的顺序打印的。\n\n1. 按照所示重新排列行。\n\n*列表 1-10，来自 HelloWorld.java*\n\n```java\n ...\n\n\
  \  public HelloWorld() {\n    String word1 = \"Jeff's\";\n    print(word1);    \n\
  \    String word2 = \"awesome\";\n    print(word2);    \n    String word3 = \"dog\"\
  ;\n    print(word3);    \n  }\n    ...\n```\n\n*[完成后的列表]*\n\n它打印了什么？\n\n1. 按照所示交换前\
  \ 2 行。\n\n*列表 1-11，来自 HelloWorld.java*\n\n```java\n ...\n\n  public HelloWorld()\
  \ {\n    print(word1);    \n    String word1 = \"Jeff's\";\n    String word2 = \"\
  awesome\";\n    print(word2);    \n    String word3 = \"dog\";\n    print(word3);\
  \    \n  }\n    ...\n```\n\n*[完成后的列表]*\n\n你在第一个 `print` 语句中收到一个语法错误，内容为：\n\n```\n\
  word1 cannot be resolved to a variable.\n```\n\n1. 将所有代码移动到构造函数的开头。\n2. 多次添加语句。\n\
  \n*列表 1-12，来自 HelloWorld.java*\n\n```java\n ...\n\n  public HelloWorld() {\n   \
  \ String word1 = \"Jeff's\";\n    String word2 = \"awesome\";\n    String word3\
  \ = \"dog\";\n    print(word2);    \n    print(word1);    \n    print(word3);  \
  \  \n  }\n    ...\n```\n\n*[完成后的列表]*\n\n### 关键点及更多\n\n* 变量是数据片段。\n* 要声明变量，请给出一个名称，例如：`String\
  \ option = \"Yes\";`\n* 变量名可以包含数字。\n* 变量名不能以数字开头。\n* 变量名通常以小写开头。\n* 字符串变量通常简单称为“字符串”。\n\
  * 赋值只进行一次。\n* 变量可以任意顺序声明，但在使用它们之前必须声明。\n* 要声明变量，请给出一个名称，例如：`String option = \"No\"\
  ;`\n* 字符串变量通常简单称为“字符串”。\n* 赋值只进行一次。\n\n## 课程 1.4 - 拼接字符串、转义字符\n\n加号用于拼接字符串。转义字符用于在字符串中使用特殊字符。\n\
  \n### 尝试一下\n\n1. 添加一个新字符串变量 `statement`，连接 `word1`、`word2` 和 `word3`，并打印它的值。\n\n\
  *列表 1-13，来自 HelloWorld.java*\n\n```java\n ...\n\n  public HelloWorld() {\n    String\
  \ word1 = \"Jeff's\";\n    String word2 = \"awesome\";\n    String word3 = \"dog\"\
  ;\n    String statement = word1 + word2 + word3;\n    print(statement);\n  }\n \
  \   ...\n```\n\n1. 在每个单词之间添加空格。（提示：空格应输入为引号之间的空格，\" \"。）\n\n*列表 1-14，来自 HelloWorld.java*\n\
  \n```java\n ...\n\n  public HelloWorld() {\n    String word1 = \"Jeff's\";\n   \
  \ String word2 = \"awesome\";\n    String word3 = \"dog\";\n    String statement\
  \ = word1 + \" \" + word2 + \" \" + word3;\n    print(statement);    \n  }\n   \
  \ ...\n```\n\n你可以通过使用换行符号 \"\\n\" 将字符串分成两行。\n\n1. 替换构造函数中的所有代码并按照所示精确输入代码。\n\n*列表\
  \ 1-15，来自 HelloWorld.java*\n\n```java\n ...\n\n  public HelloWorld() {\n    String\
  \ greeting = \"Hello, Annette.\\nHow are you?\";\n    print(greeting);    \n  }\n\
  \    ...\n```\n\n1. 你如何修改 `greeting` 字符串，使其在两行文本之间包含空行，如下列表所示？（提示：必须开始第二个换行符。）\n\
  \n\n\n\n\n```\nHello Annette.\n\n你好吗？\n```\n\n列表 1-16，来自 `HelloWorld.java`\n\n```\n\
  \ ...\n\n  public HelloWorld() {\n    String greeting = \"Hello, Annette.________How\
  \ are you?\";\n    print(greeting);    \n  }\n    ...\n```\n\n已完成的列表\n\n1. 替换构造函数中的所有代码，完全按照所示操作，并尝试将引号作为打印内容的一部分，如下所示：\n\
  \n```\nAnnette said to say \"hi\".\n```\n\n列表 1-17，来自 `HelloWorld.java`\n\n```\n\
  \ ...\n\n  public HelloWorld() {\n    print(\"Annette said to say \"hi\".\");  \
  \  \n  }\n    ...\n```\n\n已完成的列表\n\n### 理解错误和转义字符\n\n发生了什么？你收到了一个错误。在字符串中，你想显示的每个双引号之前都要加上转义字符（反斜杠\
  \ `\\`）。否则，Java 会认为引号是用来开始或结束字符串的。\n\n如何记住哪种斜杠 `\\` 或 `/` 被称为反斜杠（backslash）？反斜杠\
  \ `\\` 是顶部向后倾斜的，而正斜杠 `/` 是顶部向前倾斜的。在 Java 中，反斜杠 `\\` 是转义字符，而正斜杠 `/` 是除法符号。除法将在后面的课程中介绍。\n\
  \n1. 在围绕 'hi' 的每个双引号之前添加转义字符（反斜杠）。\n\n列表 1-18，来自 `HelloWorld.java`\n\n```\n ...\n\
  \n  public HelloWorld() {\n    print(\"Annette said to say \\\"hi\\\".\");    \n\
  \  }\n    ...\n```\n\n已完成的列表\n\n但如果你想在字符串中包含一个反斜杠 `\\` 呢？在字符串中你想显示的每个反斜杠之前加上转义字符（反斜杠\
  \ `\\`）。\n\n例如，要打印 `http:\\`，请使用：\n\n```\nprint(\"http:\\\\\\\\\");\n```\n\n1. 在需要的地方使用转义字符修改代码，使其打印出以下行。（提示：并不是所有的空处都需要转义字符。）\n\
  \n```\nMy user folder is \"c:\\Users\\Annette\".\n```\n\n列表 1-19，来自 `HelloWorld.java`\n\
  \n```\n ...\n\n  public HelloWorld() {\n    print(__\"My user folder is __\"c:__\\\
  Users__\\Annette__\".__\");    \n  }\n    ...\n```\n\n已完成的列表\n\n### 关键点与更多\n\n*\
  \ 使用加号 `+` 将字符串连接在一起。\n* 在字符串中使用转义字符（反斜杠 `\\`）来处理特殊字符：\n    * 字符串中的 `\\n` 会导致其后的任何内容都打印到新行。\n\
  \    * `\\\"` 可用于在字符串中包含双引号。\n    * `\\\\` 可用于在字符串中包含反斜杠。\n\n## 项目 2 - ASCII 艺术\n\
  \n是时候发挥一点创造力了。你将学习在这个 ASCII 程序中制作一些图形，然后将你完成的程序分享给其他人。这是一张 ASCII 艺术的截图：images/0019.jpeg\n\
  \n## 课程 2.1 - 可打印字符\n\n`ASCII` 代表美国标准交换代码。`ASCII` 是电子设备上可以显示的每个字符的标准数值代码。这确保了所有电子设备对代码都显示相同的字符。ASCII\
  \ 艺术是用在键盘上输入的字符制成的图片。\n\n### 它\n\n在你创建程序时，请记住 Java 项目名称、包名和类名相似，但有细微区别：\n\n* Java\
  \ 项目名称：每个单词的首字母大写；单词之间使用空格。\n* 包名：使用全小字母；删除单词之间的空格。\n* 类名：每个单词的首字母大写；删除单词之间的空格。\n\
  \n开始编写下一个程序：\n\n1. 创建一个名为 `ASCIIArt` 的新项目，并将 `Java.jar` 添加到项目中。\n2. 在项目中创建一个名为 `asciiart`\
  \ 的新包。\n3. 创建一个名为 `ASCIIArt` 的新类，带有 `DIYWindow` 以及 `main()` 方法及其构造函数的存根。\n4. 在 `main()`\
  \ 中添加代码调用 `ASCIIArt()`。\n\n列表 2-1，来自 `ASCIIArt.java`\n\n```\npackage annette.godtland.asciiart;\n\
