  \ Games: Introduction to Java Graphics and Event-Driven\n\n(images/0040.jpeg)\n\n\
  More Do-It-self Games: Introduction to Java Graphics and Event-Driven 是 Do-It-self\
  \ Games 系列的第二本书。你将学会创建窗口和对话框、添加按钮和输入字段、使用图像和图形以及响应键盘输入和鼠标点击。你会创建更多游戏，包括多个益智游戏、文字游戏和纸牌游戏。它可以在\
  \ [Amazon.com](http://www.amazon.com/dp/B00N325E2) 买。\n\n这本书假设你已经理解 Java 编程，或者读过\
  \ Do-It-self Games: Introduction to Java Computer。\n\n# 附录 A - 术语表\n\n**ArithmeticException**\n\
  \n当你尝试进行不允许的算术运算（例如除以零）时抛出的[exception]。参见 *Lesson 8.5 - Integer Subtraction, Multiplication,\
  \ and Division*。\n\n**array**\n\n\n\n\n\n数组是 Java 列表的一种。所有项必须是相同类型，可以是 Java 原生类型或\
  \ Java 对象。数组的大小在声明时设置，且不能更改。参见课程 12.4  - 数组中的关键点和更多。参见课程 14.5  - 空数组中的关键点和更多。\n\n\
  ### ArrayList\nArrayList 是 Java 列表的一种类型。ArrayList 只能包含 Java 对象，不能包含 Java 原生类型，且列表中的所有项必须是相同类型。可以通过添加或删除项随时更改\
  \ ArrayList 的大小。参见课程 15.6  - 数组列表中的关键点和更多。\n\n### block of code\n代码块是一行或多行程序代码，它们作为一个单元组合在一起，并用大括号\
  \ `{ }` 围起来。参见课程 1.2  - 类、超类和程序中的关键点和更多。\n\n### boolean\n布尔值是一个真或假条件。布尔值必须类型为“true”或“false”，且不加引号。布尔变量在\
  \ Java 中被声明为“boolean”。参见课程 13.5  - 布尔数据类型中的关键点和更多。\n\n### break\nbreak 用于 switch\
  \ 语句，用于跳转到 switch 语句的末，而不是执行下一行代码。参见课程 6.2  - switch 语句中的关键点和更多。\n\n### build path\n\
  构建路径是包含当前 Java 项目所需代码的所有 Java 项目和库的列表。参见课程 8.7 - 扩展 DIYWindow 类。\n\n### byte\nbyte\
  \ 是一个 Java 整数变量。它可以持有 -128 到 128 之间的数字。参见课程 8.1 - 整数数据类型和加法中的关键点和更多。\n\n### calculate\n\
  要计算数字，你需要对其他数字进行加、减、乘、除。参见课程 8.5  - 整数减法、乘法和除法中的关键点和更多。参见课程 10.1 - 运算顺序中的关键点和更多。参见课程\
  \ 16.3  - 取模中的关键点和更多。\n\n### call\n当你调用一个方法时，意味着程序在执行下一行代码之前应该运行该方法中的代码。参见课程 6.3\
  \ - 方法。\n\n### case\ncase 标签标记了 switch 语句中变量某个预期值要运行的代码。参见课程 6.2  - switch 语句中的关键点和更多。参见课程\
  \ 6.4  - switch 默认中的关键点和更多。参见课程 13.6 - 无 break 的 case 中的关键点和更多。参见课程 15.1  - 带整数的\
  \ switch 语句中的关键点和更多。\n\n### char\nchar 是 Java 字符变量。参见课程 15.2 - 字符数据类型中的关键点和更多。\n\
  \n### character\n字符始终是一个字符。字符值必须在两侧各加上单引号。字符变量在 Java 中被声明为‘char”。参见课程 15.2 - 字符数据类型中的关键点和更多。\n\
  \n### class\n类是创建程序对象的蓝图。类定义了对象可以包含的信息（实例变量）以及对象可以执行的操作（方法）。参见课程 1.2  - 类、超类和程序中的关键点和更多。参见课程\
  \ 8.7 - 扩展 DIYWindow 类中的关键点和更多。\n\n### code\n程序代码是一系列计算机指令，按顺序执行时执行所需的任务。参见课程 1.2\
  \  - 类、超类和程序中的关键点和更多。\n\n### comment\n注释是你写在代码中的笔记，用于提醒你代码的意图或标记代码区域。运行程序时，注释会被忽略。参见课程\
  \ 12.1 - 注释中的关键点和更多。\n\n### comment out\n你可以通过将某些代码行转换为注释来“注释掉”这些行。当你将代码转换为注释时，该代码将被忽略，因为程序会忽略注释。参见课程\
  \ 12.1 - 注释中的关键点和更多。\n\n\n\n\n\n条件是一个值为真或为假的 code。查看 课程 5.1 - If 语句、相等或包含字母的字符串\
  \ 中的 关键点与更多。查看 课程 9.1 - 比较数字 中的 关键点与更多。查看 课程 13.5 - 布尔数据类型 中的 关键点与更多。\n\n### console\n\
  \n控制台是显示 Java 错误信息或你的程序 `System.out.println()` 消息的地方。在 Eclipse 中，控制台通常位于窗口的底部面板。查看\
  \ 课程 8.4 - Try/Catch 块和异常 中的 关键点与更多。查看 课程 12.3 - 输出到控制台 中的 关键点与更多。\n\n### constructor\n\
  \n构造函数是在创建 class 的 instance（也称为 object）时被调用的特殊 method。查看 课程 16.2 - 构造函数 中的 关键点与更多。\n\
  \n### convert\n\n当你转换 variable 时，你使用某种形式的 calculation 来更改它。例如，你可以将 string 转换为 integer，或者将\
  \ string 转换为全大写字母，或者编写程序将温度从华氏度转换为摄氏度。查看 课程 8.2 - 将字符串转换为整数 中的 关键点与更多。查看 项目 10 -\
  \ 温度转换器。查看 课程 14.4 - 将字符串转换为大写字母 中的 关键点与更多。\n\n### data\n\n数据是 variable 可以持有的信息或值的另一个名称。查看\
  \ 课程 1.3 - 变量与字符串 中的 关键点与更多。查看 课程 13.1 - 写入文件 中的 关键点与更多。查看 课程 13.2 - 从文件读取、捕获多个异常\
  \ 中的 关键点与更多。\n\n### decimal number\n\n小数是一个 fractional 数值，小数点后带有数字，例如 1.25。小数 variables\
  \ 在 Java 中被声明为 `double` 或 `float`。查看 课程 8.6 - Double 数据类型 中的 关键点与更多。\n\n### declare\n\
  \n当你声明 variable 时，你说明它的存在，为其分配属性并可选地分配一个初始值。查看 课程 1.3 - 变量与字符串 中的 关键点与更多。\n\n###\
  \ decrement\n\n递减 variable 是通过较小的值（通常是 1）来减少它的值。查看 课程 9.3 - 整数递增 中的 关键点与更多。\n\n\
  ### define\n\n当你定义 class 或 method 时，你为其分配属性并为其功能提供 code。查看 课程 1.2 - 类、超类与程序 中的 关键点与更多。查看\
  \ 课程 6.3 - 方法 中的 关键点与更多。查看 课程 7.1 - 带参数的方法 中的 关键点与更多。查看 课程 8.3 - 返回值的方法 中的 关键点与更多。查看\
  \ 课程 8.7 -  DIYWindow 类 中的 关键点与更多。查看 课程 12.5 - 方法 中的 关键点与更多。查看 课程 13.3 - 带多个参数的方法\
  \ 中的 关键点与更多。\n\n### double\n\ndouble 是一种 Java decimal number variable。它可以持有精度高达\
  \ 16 位小数的数字。double 使用小数点书写，但不带引号。查看 课程 8.6 - Double 数据类型 中的 关键点与更多。\n\n### else\
  \ block\n\nelse 块紧跟添加到 if statement 末尾的 block of code。只有当 [if statement] 的 condition\
  \ 为假时，else 块才会执行 [runs]。查看 课程 5.1 - If 语句、相等或包含字母的字符串 中的 关键点与更多。\n\n### escape character\n\
  \n转义字符（反斜杠，`\\`）用于标记 string 中的特殊字符。查看 课程 1.4 - 合并字符串、转义字符 中的 关键点与更多。\n\n### equation\n\
  \n方程是显示数字或 calculation 等于另一个数字或 [calculation] 的文本。\n\n### exception\n\n异常是 Java\
  \ 不知如何处理意外情况。例如，如果你尝试将字母字符转换为 integer 或者尝试从不存在的文件读取时，就会发生异常。查看 课程 8.4 - Try/Catch\
  \ 块和异常 中的 关键点与更多。\n\n### exclusive and operator\n\n\n\n\n\n逻辑与运算符 `&&` 检查它两侧的条件是否都为真。参见\
  \ Lesson 5.1 - If 语句、相等或包含字母的字符串中的关键点及更多。\n\n### 逻辑异或运算符\n逻辑异或运算符 `||` 检查它两侧至少有一个条件为真。参见\
  \ Lesson 5.1 - If 语句、相等或包含字母的字符串中的关键点及更多。\n\n### 导出 (export)\n当你导出程序时，你将其从 Eclipse\
  \ 中取出并放入一个单独的 JAR 文件中。然后你可以通过双击 JAR 文件在不通过 Eclipse 的情况下运行程序。参见 Lesson 2.2 - 导出程序中的关键点及更多。\n\
  \n### 扩展 (extend)\n当一个类扩展第二个类时，它使第二个类 成为第一个类的父类。换句话说，它使第一个类 成为第二个类的类型，并且它可以使用第二个类的所有公的和保护的方法以及实例变量。参见\
  \ Lesson 8.7 - 扩展 DIYWindow 类中的关键点及更多。\n\n### 提取 (extract)\n提取文件是将存储在 ZIP 文件或 JAR\
  \ 文件中的文件复制到电脑上另一个文件夹的过程。参见 附录 C - 安装所需的软件和文件中的下载并安装 Eclipse。\n\n### 文件未找到异常 (FileNotFoundException)\n\
  当你尝试从一个不存在的文件读取时，会抛出 `FileNotFoundException` 异常。参见 Lesson 13.2 - 从文件读取、捕获多个异常中的关键点及更多。\n\
  \n### 最终 (final)\n最终变量 是那些值永远不会被程序改变变量。参见 Lesson 14.6 - 静态最终变量中的关键点及更多。\n\n### 浮点\
  \ (float)\n`float` 是一种 Java 小数变量。它可以持有精度高达约 7 位小数的数字。`float` 类型定义时不加引号，并且必须在末添加“f”。参见\
  \ Lesson 8.6 - 类型中的关键点及更多。\n\n### for 循环 (for loop)\n`for` 循环是一个重复指定次数的[代码块]。参见\
  \ Lesson 11.1 - 循环中的关键点及更多。\n\n### 分数 (fraction)\n分数是一个数字，它是整数 的一部分，例如二分之一或分之一。\n\
  \n### 生成 (generate)\n当某物被生成时，它被创建了，通常是由 Eclipse 在你创建类时自动完成的。参见 Lesson 1.2 - 程序中的关键点及更多。\n\
  \n### 硬件 (hardware)\n硬件是电脑的物理部分：硬盘、鼠标等。操作系统 允许与硬件交互。\n\n### if 语句 (if statement)\n\
  `if` 语句是一个代码块，只有当条件为真时才运行。`if` 语句也可以有一个可选的 `else` 。参见 Lesson 5.1 - If 语句、相等或包含字母的字符串中的关键点及更多。\n\
  \n### 导入 (import)\n`import` 语句用于将你的类](#part0003_split_092.html_class) 连接到代码使用的其他类。如果\
  \ Java 无法识别代码中使用的类](#part0003_split_092.html_class)，你需要在类的开头使用 `import` 语句导入该类](#part0003_split_092.html_class)。`import`\
  \ 语句必须使用类的完整正确名称，这包含了[包]名。参见 Lesson 9.2 - 生成中的关键点及更多。\n\n### 递增 (increment)\n要递增变量](#part0003_split_092.html_variable)，增加其值，通常增加\
  \ 1。参见 Lesson 9.3 - 递增整数中的关键点及更多。\n\n### 索引 (index)\n索引是项在某物中的位置。例如，索引用于命名字符在字符串中的位置、列表中的项，以及通过\
  \ [for 循环]的次数。参见 Lesson 13.4 - 字符串中的字符索引中的关键点及更多。参见 Lesson 15.3 - 下一个字符索引中的关键点及更多。\n\
  \n**无限循环**\n\n\n\n\n\n无限循环是指一段可能会永远重复的代码块，因为其结束条件永远无法满足。你可能需要使用 Eclipse 的终止按钮或重启电脑来结束无限循环。请参见第\
  \ 7.3 Lesson - 无限循环中的关键点与更多。\n\n### initialize（初始化）\n要初始化一个变量，需要为其赋予第一个值。请参见第 1.3\
  \ Lesson - 变量与字符串中的关键点与更多。\n\n### input（输入）\nInput 是名词：指用户在程序运行时输入程序的数据。Input 也可以是动词，指用户向程序输入（进入）数据。Input\
  \ 还是一个方法的名称：`input()`。程序应该调用 `input()` 等待用户输入数据。请参见第 4.1 Lesson - 输入字符串中的关键点与更多。参见第\
  \ 15.4 Lesson - 检查用户输入中的关键点与更多。\n\n### instance（实例）\n类是对象的定义。类的实例是根据类定义创建的内容。请参见第\
  \ 16.1 Lesson - 对象、卡片中的关键点与更多。\n\n### instance variable（实例变量）\n实例变量是在类定义中声明的变量，而不是方法内部的变量。此类变量可以被类的任何方法使用，而无需作为参数传递给这些方法。请参见第\
  \ 14.3 Lesson - 实例变量中的关键点与更多。\n\n### int\n`int` 是 Java 整数型变量。它可以存储于 -2,147,483,647\
  \ 到 2,147,483,647 之间的数字。请参见第 8.1 Lesson - 整数数据类型与加法中的关键点与更多。\n\n### integer（整数）\n\
  整数是一个数值；即正整数或负整数整数。整数在定义类型时不带引号或小数点。整数变量在 Java 中声明为 `int`、`byte`、`short` 或 `long`。请参见第\
  \ 8.1 Lesson - 整数数据类型与加法中的关键点与更多。参见第 8.2 Lesson - 将字符串转换为整数中的关键点与更多。参见第 8.5 Lesson\
  \ - 整数减法、乘法与除法中的关键点与更多。\n\n### invalid（无效）\n如果某物是无效的，意味着它是不被允许的。请参见第 15.4 Lesson\
  \ - 检查用户输入中的关键点与更多。\n\n### IOException\n`IOException` 是在读取或写入文件时发生错误而抛出的异常。例如，无法打开一个存在的文件。请参见第\
  \ 13.1 Lesson - 写入文件中的关键点与更多。参见第 13.2 Lesson - 读取文件、捕获多个异常中的关键点与更多。\n\n### JAR file\n\
  JAR 文件是 Java 档文件（Java Archive）。它包含一个或多个 Java 代码文件夹或文件。JAR 文件以 `.jar` 作为扩展名。如果 JAR\
  \ 文件被创建为 Java 可执行文件，你只需双击它即可运行该 JAR 文件中的程序。请参见第 1.1 Lesson - Java 项目与包中的关键点与更多。参见第\
  \ 2.2 Lesson - 导出程序中的关键点与更多。\n\n### Java project（Java 项目）\nJava 项目是 Eclipse 中 Java\
  \ 代码最高级别的组织形式。书中的每个程序都组织在 Eclipse 中一个独立的 Java 项目中。Java 项目包含一个或多个包，每个包包含一个或多个类。由于程序较小，书中的大多数\
  \ Java 项目只包含一个包。请参见第 1.1 Lesson - Java 项目与包中的关键点与更多。\n\n### library（库）\nEclipse\
  \ 将外部 JAR 文件称为库。例如，`DIYJava.jar` 是一个 JAR 文件，必须使用 `DIYWindow` 类将其作为库添加到任何 Java 项目的构建路径中。请参见第\
  \ 1.1 Lesson - Java 项目与包中的关键点与更多。\n\n### listing（列出）\n程序列出通常显示文件中的所有程序代码。书中的列出是部分列出，在未包含文件代码的地方使用了省略号“…”。请参见第\
  \ 1.2 Lesson - 类、超类与程序中的关键点与更多。参见附录 B - 完整的代码列出。\n\n### long\n`long` 是一个 Java 整数型变量。它可以存储于\
  \ -9,223,372,036,854,775,807 到 9,223,372,036,854,775,807 之间的数字。\n\n### main() 方法\n\
  \n\n\n\n\n`main()` 方法是程序启动时第一个调用的方法。请查看课程 1.2 - 类、超类和程序中的关键点及更多。\n\n### maximum\n\
  最大值是允许的最高值。\n\n### method\n方法是一个命名的代码块，可以从程序的任何地方被调用。请查看课程 6.3 - 方法中的关键点及更多。请查看课程\
  \ 7.1 - 带参数的方法中的关键点及更多。请查看课程 8.3 - 返回值的方法中的关键点及更多。请查看课程 12.5 - 静态方法中的关键点及更多。请查看课程\
  \ 13.3 - 带多个参数的方法中的关键点及更多。\n\n### minimum\n最小值是允许的最低值。\n\n### modulo\n取模是一种类似于除法的操作。它不是给出一个整数并丢弃余数，取模是丢弃整数并给出余数。请查看课程\
  \ 16.3 - 取模中的关键点及更多。\n\n### mono-spaced font\n等宽字体是所有字符宽度相同的字体。相比之下，比例字体是每个字符宽度都不同的字体。例如，在\
  \ Courier New 等等宽字体中，字母“i”和“W”的宽度是相同的。在比例字体（如 Times New Roman）中，字母“W”比字母“i”宽得多。请查看课程\
  \ 1.2 - 类、超类和程序。\n\n### not operator\n非运算符 `!` 返回条件的相反值。例如，`!true` 返回 false。请查看课程\
  \ 5.1 - If 语句、相等的或包含字母的字符串中的关键点及更多。\n\n### null\nNull 意味着某些东西没有值，甚至不是空值或 0。如果你尝试使用一个没有值的变量，你将收到错误。\n\
  \n### NumberFormatException\n如果你尝试将某些无法转换为数字的内容转换为数字，就会抛出 NumberFormatException\
  \ 异常](#part0003_split_092.html_exception)。例如，如果你尝试将“abc”转换为数字，你将收到 NumberFormatException。请查看课程\
  \ 8.4 - Try/Catch 块和异常。\n\n### object\n对象是类的实例。对象持有[类]中定义的信息，并可以调用其[方法]。请查看课程 16.1\
  \ - 对象中的关键点及更多。\n\n### operating system\n操作系统是计算机上管理其他程序与计算机硬件交互的[软件]。操作系统包括 Windows、Mac\
  \ 等。请查看附录 - 软件。\n\n### package\n包包含一个或多个使用的类文件。请查看课程 1.1 - 项目中的关键点及更多。\n\n### parameter\n\
  参数是在方法被调用时传递给[方法]的值。该[方法]随后可以在其[代码]中使用该值。请查看课程 7.1 - 带参数的方法中的关键点及更多。请查看课程 13.3 -\
  \ 带多个参数的方法中的关键点及更多。\n\n### pass\n将值传递给[方法]意味着将其作为[参数]发送给[方法]。请查看课程 7.1 - 带参数的方法。\n\
  \n### primitive\nJava 原始类型包括 `int`、`double`、`char`、`boolean`、`short`、`long` 和 `float`。它们没有类定义，也没有可以从它们调用的方法。请查看课程\
  \ 15.6 - 数组列表中的关键点及更多。\n\n### private\n[变量]或[方法]可以被声明为私有。私有声明意味着只有声明它的[类]可以查看并使用它。请查看课程\
  \ 6.3 - 方法中的关键点及更多。请查看课程 8.7 - 扩展 DIYWindow 类中的关键点及更多。请查看课程 12.5 - 静态方法中的关键点及更多。请查看课程\
  \ 14.3 - 实例变量中的关键点及更多。\n\n### programmer\n程序员是编写计算机程序代码的人。\n\n\n\n\n\n你通过向用户 提问并等待回答来提示其输入某些内容。查看\
  \ `课程 8.3 - 返回值的方法中的 `关键点及更多；查看 `课程 8.6 - Double 数据类型中的 `关键点及更多；查看 `课程 14.1 - 提示是或否中的\
  \ `关键点及更多`.\n\n### protected（保护的）\n\n变量或方法可以被声明为保护的。保护的声明 意味着只有声明它的类，或者任何扩展了该声明类的类\
  \ 才能看到并使用它。查看 `课程 8.7 - 扩展 DIYWindow 类中的 `关键点及更多`.\n\n### public（公共的）\n\n变量或方法可以被声明为公共的。公共的声明\
  \ 意味着相同构建路径中的任何类 都可以看到并使用它。查看 `课程 8.7 - 扩展 DIYWindow 类中的 `关键点及更多；查看 `课程 12.5 - 静态方法中的\
  \ `关键点及更多；查看 `课程 14.3 - 实例变量中的 `关键点及更多`.\n\n### Quick Fix（快速修复）\n\n你可以使用 Eclipse\
  \ 的快速修复选项来查看 Eclipse 认为可以修复语法错误 的方法列表。当你选择其中一个选项时，Eclipse 将按照你选择的方式为你修复代码。查看 `课程\
  \ 1.2 - 类、超父类和程序中的 `关键点及更多`.\n\n### random（随机的）\n\n如果随机选择了某项，意味着列表中的任何项目都可能被选中。这只是意味着任何一个项目被选中的概率与其他任何项目相等。查看\
  \ `课程 9.2 - 生成随机数中的 `关键点及更多`.\n\n### reboot（重启）\n\n你通过关闭电脑然后重新开启来重启计算机。\n\n### resolved（已解析）\n\
  \n当你收到无法解析变量 名称的错误时，意味着 Java 不知道该变量 是什么。此错误通常通过声明 `variable` 来修复。当你收到类无法解析的错误时，意味着\
  \ Java 不知道该 `class` 是什么。此错误通常通过 `Quick Fix` `import` 来修复。查看 `课程 7.1 - 方法中的 `关键点及更多；查看\
  \ `课程 9.2 - 生成随机数`.\n\n### return（返回）\n\n当方法 返回一个值时，它会将该值传给调用者。并不是所有方法](#part0003_split_092.html_method)\
  \ 都返回值。如果方法 返回一个值，`code` 可以将结果赋值给 `variable`。查看 `课程 8.3 - 返回值的方法中的 `关键点及更多`.\n\n\
  ### run（运行）\n\n当你运行程序时，Java 会调用程序的 `main()` 方法并顺序执行 `code` 的每一行指令。查看 `课程 1.2 - 类、超父类和程序中的\
  \ `关键点及更多`.\n\n### scramble（洗乱）\n\n要打乱一组项目，你需要以随机顺序重新排列它们。查看 `课程 12.1 - 注释中的 `关键点及更多`.\n\
  \n### short（短型）\n\n`short` 是一种 Java 整数变量。它可以存储 -32768 到 32768 之间的数字。查看 `课程 8.1 -\
  \ 整数数据类型和加法中的 `关键点及更多`.\n\n### shortcut（快捷方式）\n\n快捷方式是实现某事的更快捷的方法。例如，你可以在电脑桌面创建一个快捷图标来启动可能需要更多步骤启动的程序。查看\
  \ `课程 13.8 - Jar 文件中的 `关键点及更多；查看 `下载并安装 Eclipse 在附录 C - 安装所需的软件和文件](#part0003_split_093.html_Appendix-C---Install-Required-Software-and-Files)`.\n\
  \n### software（软件）\n\n软件是计算机程序的别名。软件是由[程序员]编写的程序 code 创建的。\n\n### statement（语句）\n\
  \n\n\n\n\n语句（Statement）是一行完整的 `code`，通常包含并包括结尾的分号 `;`。某些语句，例如 `if statements` 和\
  \ `switch statements`，包含一个 `block of code`（代码块）。此类语句在 `block of code` 之后结束，而不是在分号之后。请参见\
  \ Lesson 1.2 - 类、超类和程序 中的 关键点及更多。请参见 Lesson 5.1 - If 语句、相等或包含字母的字符串 中的 关键点及更多。请参见\
  \ Lesson 6.2 - Switch 语句 中的 关键点及更多。请参见 Lesson 7.2 - While 循环 中的 关键点及更多。请参见 Lesson\
  \ 11.1 - For 循环 中的 关键点及更多。\n\n### static\n静态 `methods`（方法）是自包含的。它们只能使用 `passed`\
  \ 的 `data` 作为其 `parameters`（参数）。静态 `method` 可以通过使用 `class` 名称后跟 `method` 名称来 `called`（调用）。静态\
  \ `variables`（变量）由从 `class` 创建的每个 `object`（对象）共享。如果一个 `object` 更新了静态 `variable`\
  \ 的值，从该 `class` 创建的所有 `objects` 都能看到该 `variable` 的相同新值。请参见 Lesson 12.5 - 静态方法 中的\
  \ 关键点及更多。请参见 Lesson 14.6 - 静态 Final 变量 中的 关键点及更多。\n\n### string\n字符串（String）是零或多个任意字符的文本。字符串值必须以双引号开头和结束。字符串\
  \ `variables` 在 Java 中被 `declared`（声明）为“String”。请参见 Lesson 1.3 - 变量和字符串 中的 关键点及更多。请参见\
  \ Lesson 8.2 - 将字符串转换为整数 中的 关键点及更多。请参见 Lesson 10.1 - 运算顺序 中的 关键点及更多。请参见 Lesson 12.2\
  \ - 字符串长度和子字符串 中的 关键点及更多。请参见 Lesson 13.4 - 字符串中字符的索引 中的 关键点及更多。请参见 Lesson 14.2 -\
  \ 替换字符串中的字符 中的 关键点及更多。\n\n### stub\n存根代码（Stub code）是一个自动生成的、具有 `valid`（有效的）`declaration`（声明）的\
  \ `method`。方法的内容留空供你编写。\n\n### superclass\n每个 `class`（类）都必须有一个超类（superclass），即任何为其添加了任何\
  \ Java `class`。一个 `class` 被视为其超类的一种 `type`（类型），并可以使用其超类的任何 `public` 或 `protected`\
  \ 的 `instance variables`（实例变量）或 `methods`（方法）。例如，一个将 `DIYWindow` 命名为超类的 `class`\
  \ 是 `DIYWindow` 的一种 `type`，可以使用 `DIYWindow` 中的 `print()` 和 `input()` 方法。请参见 Lesson\
  \ 1.2 - 类、超类和程序 中的 关键点及更多。请参见 Lesson 8.7 -  DIYWindow 中的 关键点及更多。### switch statement\n\
  switch 语句是一个 `block of code`，它根据 `variable` 的每个预期值 `runs`（运行）不同的 `code`。请参见 Lesson\
  \ 6.2 - Switch Statements 中的 关键点及更多。请参见 Lesson 6.4 - Switch Default 中的 关键点及更多。请参见\
  \ Lesson 13.6 - Case without Break 中的 关键点及更多。请参见 Lesson 15.1 - Switch Statement\
  \ with Integers 中的 关键点及更多。\n\n### syntax error\n语法错误（syntax error）发生在程序 `code` 不符合\
  \ Java 要求的顺序或内容时。在运行程序之前必须修复所有的语法错误。Eclipse 提供了 `Quick Fix`（快速修复）工具来方便查找和修复语法错误。请参见\
  \ Lesson 1.2 - 类、超类和程序 中的 关键点及更多。\n\n### terminate\n如果你终止（terminate）一个程序，它就会停止。请参见\
  \ Lesson 7.3 - Infinite Loops 中的 关键点及更多。\n\n### try/catch block\ntry/catch 块包含一个\
  \ `try` 块和一个或多个 `catch` 块。将可能抛出 `exception`（异常）的 `code` 包在 `try` 块中。在 `try` 块结束处为每个预期的\
  \ `exception` 放置 `catch` 块。在 `catch` 块内部放入 `code` 以捕获异常时运行。程序随后可以继续执行 try/catch\
  \ 块之后的 `code`。请参见 Lesson 8.4 - Try/Catch Blocks and Exceptions 中的 关键点及更多。\n\n###\
  \ type\n\n\n\n\n\n在 Java 中，一个事物的类型通常是它的类或它的父类。例如，`HelloWorld` 类是一种 `DIYWindow` 类型；或者一个声明为字符串的变量其类型即为\
  \ `string`。请参阅课程 1.2 - 类、父类与程序中的关键要点及更多。\n\n### 未处理的异常\n\n未处理的异常是指未被任何代码处理的异常。添加一个\
  \ try/catch 块来处理异常。如果程序遇到未处理的异常，将会停止。请参阅课程 8.4 - Try/Catch 块与异常中的关键要点及更多。\n\n##\
  \ 解序\n\n要对一组项目进行解序，你需要将它们恢复到正确的顺序。\n\n### 解压\n\n解压（Unzip）是指从 ZIP 文件中提取文件的过程。请参阅附录\
  \ C - 安装所需的软件和文件中的下载并安装 Eclipse。\n\n### 用户\n\n用户是指运行程序的人。请参阅课程 4.1 - 输入字符串中的关键要点及更多。\n\
  \n### 有效\n\n如果某物是有效的（valid），意味着它是被允许的。请参阅课程 15.4 - 检查用户输入中的关键要点及更多。\n\n### 变量\n\n\
  变量是一个命名的数据，其值可以改变。请参阅课程 1.3 - 变量与字符串中的关键要点及更多。请参阅课程 3.1 - 重用字符串中的关键要点及更多。\n\n###\
  \ 可见\n\n如果一个变量或方法是可见的，意味着它可以被看到。三三种不同的可见性设置是私有、受保护](#part0003_split_092.html_protected)和公共。请参阅课程\
  \ 6.3 - 方法中的关键要点及更多。请参阅课程 8.7 - 扩展 DIYWindow 中的关键要点及更多。请参阅课程 12.5 - 静态方法中的关键要点及更多。请参阅课程\
  \ 14.3 - 实例变量中的关键要点及更多。\n\n### while 循环\n\nwhile 循环是一个代码块，直到条件满足为止会重复。请参阅课程 7.2\
  \ - While 循环中的关键要点及更多。\n\n### 整数\n\n整数是指没有额外分数或小数部分的数值。整数变量在 Java 中声明为 `byte` (#part0003_split_092.html_byte)、`short`\
  \ (#part0003_split_092.html_short)、`int` (#part0003_split_092.html_int) 或 `long`\
  \ (#part0003_split_092.html_long)。请参阅课程 8.1 - 整数类型与加法中的关键要点及更多。\n\n### 工作文件夹\n\n\
  你将创建一个工作文件夹来包含程序所需的所有 Java 代码 和其他文件。请参阅设置中的创建工作文件夹。请参阅课程 1.1 - Java 项目与包中的关键要点及更多。请参阅附录\
  \ C - 安装所需的软件和文件中的创建工作文件夹。\n\n### 包装类\n\n每个 Java 基本类型 都有对应的包装类，并可用于转换 Java [基本类型]\
  \ 为对象。例如，`Integer` 是整数 的包装类。\n\n### ZIP 文件\n\nZIP 文件包含一个或多个文件或文件夹，这些文件经过压缩以节省空间并更易传输。\n\
