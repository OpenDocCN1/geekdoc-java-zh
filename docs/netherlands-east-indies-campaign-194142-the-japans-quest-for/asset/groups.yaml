    # ABOVE LEFT


    In 1940, a position for a regimental-size unit was built in the Ciater spot on
    the Sukajilang road. The position was located in a tea plantation. An anti-tank
    obstacle of logs and naval gun was occupied by a 5 cm gun in a pillbox with trenches
    frontline. Behind a ravine, higher up the slope, lay two lines of pillboxes connected
    by trenches. The position was originally built but neglected, and defended in
    1941/42. This grainy photo shows one of the Ciater pillboxes, the heavily damaged
    and overgrown limit of the field. (Public document)


    Reinforcements, having arrived, the 2nd Company, 1st Infantry Battalion was withdrawn
    from the position that evening.


    On the northern axis of advance, in the 2nd Division area, the Sato Detachment,
    reduced to just two battalions, evacuated Jakarta in the late evening of 5 March
    1942. Due to the NEI troops who had retreated, it encountered no resistance to
    the west of Jakarta. The rapid occupation of the capital was something of a surprise
    to Sixteenth Army. After Blackforce''s retreat at Leuwilang, the main force of
    the 2nd Division attacked Bogor in a pincer movement. The city fell into Japanese
    hands on the morning of 6 March 1942. The next target was Bandung.


    On the morning of 6 March, Major Wakamatsu launched an attack on the flank of
    the makedeshifts. The two companies of the road were surprised as they were receiving
    the bread distribution; not set. However, the companies quickly recovered and
    repelled two infantry assaults. The third attack was supported by cannon and machine-gun
    fire from three Japanese tanks at the Subang-Bandung junction, but this attack
    was also repelled. The enemy broke the fight and retreated to the right. The units
    were scattered during this retreat. Although not attacked, the entire Left-Half
    2st Infantry Battalion, one platoon, withdrew, when the first shots were fired.
    After this, the Ciater position had been definitively breached. But Wakamatsu
    did not pursue the retreat of Dutch troops.


    # ABOVE RIGHT


    A 7.5cm gun (Bergillerie) in position a bamboo bush. This still has metal wheels,
    most pieces were constructed for pneumatic rubber tyres. The gun at Cisanto had
    a truck for transport. The battery of four guns saw action at the Ciater pass.
    The pass was used for infantry weapons. Artillery batteries were allocated to
    infantry units. However, the Ciater commander needed infantry (Beeldboek WO2-NIOD)


    During these battles, 74th soldiers were captured by the Japanese. In the afternoon
    of 6 March, or the morning of 7 March, almost all were executed by the Japanese,
    with only a handful surviving the massacre.


    In the afternoon of 6, Colonel De Veer gave up the Wates post and concentrate
    on the three-crossroads at Tollek. A Japanese infantry attack on the triple junction
    was beaten by 7 March 1942, the troops at the Tollek crossroads received orders
    to withdraw to Lembang.


    North of Lembang, a resistance line was improved with 9th Infantry Battalion,
    15th Infantry Battalion and De Vries Battalion (formed from remnants of 2nd Infantry
    Regiment). This added two West Coast of Sumatra companies, garrison infantry from
    West Sumatra, and 4th Infantry.


    ![](img/52135db0eb5e64e74130266a9290cbf8_84_0.png)


