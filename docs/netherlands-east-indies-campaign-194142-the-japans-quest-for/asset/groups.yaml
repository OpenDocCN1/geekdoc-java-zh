  - '[PAGE 12]


    # FAR LEFT


    Colonel Toshige Shoji was an old acquaintance of Imamura. They had served together
    in units for quite some time. On 2 March 1942, at Subang, Shoji was surprised
    by the counter-attack of the NEI Mobile Unit. They were unaware of the presence
    of his headquarters and drove on. In September 1942, the 230th Infantry Regiment,
    38th Division was moved to Rabaul and deployed to Guadal. It suffered heavy casualties.
    The failure on Guadalcanal resulted in Shoji being transferred from a front-line
    unit to a depot and garrison unit. At the end of the war, he was the commanding
    officer of the Sendai Area Command, Japan. This photo was taken after his promotion
    to major-general in March 1944.


    ![](img/52135db0eb5e64e74130266a9290cbf8_12_0.png)


    independently and would demonstrate initiative if necessary, Shoji did indeed
    this, but not as anticipated by Imamura. In fact, he acted against explicit orders
    by attacking the Cative position if necessary, a bold action that was rewarded
    with success: he reached the heart of the NEI force in two days and defeated the
    campaign.


    Major-General Shoji was sentenced to death in 1949 by the Temporary Courts-Martial
    at Jakarta for crimes committed at Kalidati, Subang and the Crater Pass. However,
    this sentence was converted into a ten-year prison following an appeal.


    Major-General Saburo Endo (1883–1994) was the commander of the Imperial Japanese
    Air Service (IJAS) 3rd Division. He graduated from the Military Officers School
    in 1911 and from the Military Staff College in 1922. He became an artillery officer.
    He gained international experience at the disarmament conference in Geneva in
    1927 and the disarmament conference of the League of Nations in 1931. As a staff
    officer, he was assigned to the North China Area Army in 1937. As de staff officer,
    he made the switch to air force in later life. He was an aggressive commander.
    In Japan, he became annoyed by the slow progress of the 2nd Division and on his
    own initiative he moved the center of gravity of the air support by his 3rd Division
    from the 2nd Division to the Subang Detachment. He was praised by the Twenty-Fifth
    Army and the Third Air Force for the conduct of the 3rd Division during the Battle
    of Malay and NEI campaigns.


    Major-General Shizuhiro Sakaguchi (1887–1947) became commander of the infantry
    of the 6th Division in 1941. For the Southern Offensive, his group was reorganized
    into the 65th Mixed Infantry Group and A (Sakaguchi Detachment). Major-General
    Sakaguchi took part in the campaign against the Netherlands East Indies, from
    Tarakan to Japan. In addition to air forces, he captured important oil wells and
    installations. To reach his goal, Sakaguchi was ruthlessly inventive as well:
    ruthless,


    Major-General Saburo Endo commanded the 3rd Division. This unit was involved in
    the Malay, South Sumatra and the Java campaigns. He was an experienced staff officer.
    On stationed at Kalidati, his aircraft smashed the major NEI counter-attack on
    the airfield. He then supported Shoji''s attack initiative, he forced the shift
    from providing air support for the advance in West Java to Bandung. After the
    capitulation meeting, explicitly threatened the delegation with Bandung. He subsequently
    joined the Military Affairs Department of the Army Air Force. In 1945, Endo was
    the President of the Oriental Bureau and President of the Pharmaceutical Industry.
    The photo shows Endo after his promotion to lieutenant-general, serving dress
    M143 (Type 3). (Mainichi Newspapers)'
