    为了加强拉哈的防御，澳大利亚湾湾部队于1941年12月1日抵达，其组成部分包括湾湾部队司令部；加强后的第2/1营；第18反坦克兵营的C连；来自2/11野战工队的一个工兵排以及一些后勤力量，总兵力约1,170人。随后建立了一个区域联合总部，以指挥印度尼西亚东印度陆军（RNEI）和澳大利亚军队。在拉哈，湾湾部队深受疟疾和痢痢疾的困扰。在日本入侵前两周，湾湾部队指挥官更换为W.J.R.
    Scott中校。后者与东印度领地指挥官之间的协作不尽如人意。


    日本海军等待切断盟军的安岛-库普空中交通线。作为为进攻曼纳多做准备、消灭盟军火力的一部分，日本海军第21航空舰队轰炸了安岛。这是一系列打击的开端，随后是武装侦察。在登陆前不久，又发生了新一轮的空袭，这次是由母载飞机实施的。在日本压力和已经侦察的入侵舰队面前，澳荷联合司令部（ABDCOM）于1942年1月27日下令撤离剩余的航空单位。


    东印度领地指挥官J.L.R. Kapitz中校执行了一项计划，该计划基于东印度陆军对沿岸阵地进行固定防御，由湾湾部队的一部分负责防御拉哈机场，并由湾湾部队其余部分和东印度陆的一部分组成机动通用预备队。1942年1月10日，根据Kapitz的提议，决定湾湾部队防守拉哈周边的劳提姆南部地区。预计不会在劳提姆东岸登陆。劳提姆东岸的山地平原由三个由半训练印度尼西亚民兵小队驻守的阵地防御。考虑到地形，印澳联合计划基本上是防御性的。


    当1942年1月30日明确日本人将从南部登陆时，Kapitz预计登陆将发生在帕索索（Passo）。他将防御重心转移到一个由三个连、一个机枪连和一个民兵小队组成的阵地。该阵地比希图岛和劳提姆之间地峡上的安岛市更有价值。通过这种方式，Kapitz增加了与南部湾湾部队的距离。盟军力量因此被进一步碎片化，可能会被任何强大的对手逐个击败。


