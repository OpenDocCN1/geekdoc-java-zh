    The island of Ambon was centrally located in the eastern part of Indonesian archipelago.
    It had a natural harbour and a well-equipped airport. The Japanese attack on the
    island comprised a joint army and naval amphibious assault at two separate landing
    zones, culminating in two separate operations: one on the southern peninsula by
    the IJA against the rapidly defeated Nei troops and the more resilient Australian
    Gulf Force; and the other by the IJN on the northern peninsula, which attack and
    ultimately took Laha Airfield.


    ![](img/52135db0eb5e64e74130266a9290cbf8_53_0.png)


    # EVENTS


    Times are given in Japan Standard Time (JST - UTC+09:00 unless otherwise stated.
    Moluccas Time (MCT) was UTC+08:30.


    ### Saturday, 31 January 1942


    - 1. 0240hs and 0250hs: Unopposed amphibious night landing of Eastern detachment
    from the soft coast of Laitimor. The rapid night attack makes tours towards Passi;
    the left two mountain tracks towards Ambon City in poor weathers.

    - 2. The Nei reinforcements at Rutung and Soijabatta defeated the Japanese attack.

    - 3. 0130hs: Amphibious landing by the reinforced 1st SLF (approx. 1,000 men)
    at Holisei. Japanese penetration of 4th Company. Garrison Rat own (reinforced)elled
    off and defended Japanese positions.

    - 4. 0320hs: Nei attack at Holisei is over and the landing completed. The Nei
    detachment withdrew and conducts actions on the route of advance.

    - 5. 0800hs (MCT): Nei reinforcements arrive at Rutung and Soijabatta, but the
    Japanese left attack counters are made; Lieutenant-Colonel Kapust has repelled
    the reinforcements.

    - 6. 0730 hs (MCT): The Japanese night attack on the left flank, flanking the
    penetration at Rutung and occupying the eastern south flank of Holisei was successful.
    The Nei counter attacks make no headway, and the Japanese position is taken.

    - 7. Advancing south in heavy rains, the 1st SLF comes under heavy assault from
    Laha by the 2nd 1st SLF and 10th Company, 3rd Battalion, Regiment.

    - 8. 1700hs: The Japanese left left under attack by Ambon City.

    - 9. The 10th Company, 3rd Battalion 22th Infantry Regiment is sent into the envelope
    to the affair from the high ground to the north.


    ### Sunday, 1 February 1942


    - 1. 0130hs: Lieutenant-Colonel Kapust and the Nei troops in the position improved
    a defence in the south-west, but during the day position is pushed his back.

    - 2. 1110hs: The Japanese left attack pushes south from Ambon City. Gulf Force.


    ### Tuesday, 2 February 1942


    - 1. 0220hs: Japanese 2nd Company manages to penetrate the eastern line between
    B and C Companies, 2-21 21st Battalion and service and supply to Gulf Force.

    - 2. 1200hs: The Japanese attack on Laha is defended by the Battalion HQ, D Company
    of 2 21st Battalion and service and supply to Gulf Force.

    - 3. Lieutenant-Colonel Scott; Gulf Force correctly identifies that Mal Nei has
    not defected by the Japanese. He orders a withdrawal from Ambon to the En.

    - 4. 0630hs: The Eastern Detachment is countered by the 15th Division and starts
    to clear the area of heavy mines. Minesweeper No 11 and No 12 stra are damaged
    and 2 lost.

    - 5. 1800hs: The Japanese assault takes place by the entire 1st SLF, and breaks
    through the Australian defence. At 06ls, the airfield is captured retreative after
    the Australian 1st Division.


