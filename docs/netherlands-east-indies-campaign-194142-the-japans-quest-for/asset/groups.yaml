    ![](img/52135db0eb5e64e74130266a9290cbf8_99_0.png)


    # 1941–42年荷兰东印度战役


    ## 日本对石油的追求


    日本帝国在 1941 年底至 1942 年初发起的征服扩张，是为了实现日本帝国的自给自足，特别是在石油这种珍贵物资方面。荷兰（或荷属）东印度因其丰富的油田和橡胶种植园而成为日本的首要目标。尤其是油田，备受青睐，因为该殖民地是世界第五大石油生产和出口地，而日本国内产量有限。这本插图丰富的研究详尽描述了日本联合作作战如何征服了荷兰属东印度的广阔土地，包括波罗洲、望加腊、提汶、爪哇、苏门答腊和安汶汶。作者
    Marc Loebstein 仔细记录了荷兰军队及其英国、澳洲和美国盟军的顽强防御，而日本军队则逐个击破了孤立的岛屿和油田。书中深入涵盖了截至 1942 年
    3 月底双方的作战计划、武器装备、部队构成及战斗，将这场常被忽视的二战战役生动地呈现在读者面前。


