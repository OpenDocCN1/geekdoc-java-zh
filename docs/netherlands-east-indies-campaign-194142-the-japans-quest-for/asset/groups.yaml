  - '[PAGE 23]


    These Australian units were part of the all-volunteer Second Australian Imperial
    Forces (2nd AIF). In their deployment in the Netherlands East Indies, they lacked
    heavy weapons. Moreover, they were neither equipped for jungle warfare. The soldiers
    were dressed in shorts, which were unsuitable for duty in heavily vegetated terrain
    under tropical conditions. Scratches and cuts on the knees and lower legs led
    to tropical sores. Prevention was virtually unknown. The result was a high sickness
    rate and a decline in fighting power. Command relations with the local RNEI commanders
    left much to be desired.


    In February 1942, an ad hoc infantry brigade was formed from Australian units
    and stragglers in Java: Battlefield. Brigadier A.S. Blackburn regrouped three
    infantry battalions (approximately 2,000 men) reinforced with two batteries of
    the US 231st Field Artillery Regiment and the British B Squadron, 3rd King''s
    Own Hussars with Mk VI light tanks. The battalions had only light infantry armament,
    with three mortars with limited ammunition stocks, and anti-tank rifles. Battlefield
    lacked anti-tank guns and anti-tank mines, and a field ambulance was also missing.
    In contrast, a British platoon added the core of this unit had gained combat experience
    in Syria.


    Great Britain did not contribute forces until shortly before the fall of Singapore.
    The British forces in the Netherlands East Indies were mostly reinforcements by
    troops withdrawn from Malaysia. As a result of the Japanese advance through Malaysia
    and at airfields around Singapore, the RAF and RAF squadrons were withdrawn to
    Sumatra and Java from 16 June 1942. British anti-aircraft artillery was deployed
    for ground-based defense.


    After the loss of Sumatra, the remaining British forces were reorganized. They
    consisted of RAF and RAF squadrons as per West Group or BRITAIR and Recc Group,
    the British 16th Anti-Aircraft Brigade and B Squadron, 3rd King''s Own Hussars.
    Four Air Ministry Experimental Station (AMES) units with radar installations were
    operational at the end of February. In the second half of February, the Royal
    Navy contributed to the Combining Force.


    The States provided the USAF''s Far East Air Force (FEAF) and the Asiatic Fleet
    evacuated the Philippines. The FEAF was first withdrawn to Darwin, northern Australia,
    but later in December deployed to Java. The FEAF would eventually consist of 5th
    Bomb Command and Interceptor Command equipped with modern aircraft. Interceptor
    Command deployed for the area of East Java.


    Ships from the Asiatic Fleet participated with success in the maritime defence
    of the archipelago. On 23 and 24 January 1941, Patrol Wing 10 was withdrawn from
    the Philippines with eight Catalina US Navy boats loaded to Halong, Ambon.


    On 11 January 1942, the HQ 26th Field Artillery Brigade and 2nd Battalion, 131st
    Field Artillery Regiment arrived in Surabaya by the USA (part of the Pencabra
    Convoy). The latter was a field artillery battalion of the Texas National Guard
    and mobilized in late 1940. It arrived in Java with full strength, but half the
    motor transport and none of the 14 organic:50-cal. heavy machine guns. The unit
    was also equipped with 12 M2A 75mm truck-drawn guns shortly before departure from
    the United States. No shooting practice had been held with the new artillery.
    Of the eight American SCR-268 radar sets, two were operational at the end of January
    1942.'
