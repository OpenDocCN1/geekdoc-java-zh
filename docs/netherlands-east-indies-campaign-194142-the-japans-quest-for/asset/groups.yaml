    # 1941–42年荷属东印度群战役


    日本对石油的追求


    ![](img/52135db0eb5e64e74130266a9290cbf8_0_0.png)


    MARC LOHNSTEIN | 绘画：GRAHAM TURNER


    ## 作者


    ## 绘画家


    Marc Lohnstein 拥有历史学硕士学位；他的主要研究方向是印度尼西亚和苏里南以前的荷兰殖民地。他专长殖民军队和警察组织、制服及战术，并就这些主题发表了多项研究。他目前担任荷兰阿姆斯特丹皇家退役军人之家和布隆贝克博物馆的助理策展员。


    Graham Turner 是一位领先的历史艺术家，专攻中世纪。他为 Osprey 出版社插画了大量作品，涵盖了从10世纪阿拉伯哈里发法国军队的着装，到血腥的中世纪战斗，再到英国红衣军的日常生活等广泛主题。作为插画师
    Michael Turner 之子，Graham 在英国伯金汉郡生活和工作。


