    important as a base for air operations against Java. The planned occupation would
    continue, but the attack from the sea was cancelled. Sakaguchi Detachment would
    occupy the city mainly overland, while the IJN would support a small-scale maritime
    operation along the coast.


    After mobilization, the South-Eastern Borneo Garrison Battalion numbered 1,250
    men. It was assigned to the defence of two airfields, Kotawaraginin and Oelin.
    On the morning of 10 February 1942, the Japanese overland force occupied Oelin.
    The airfield had been destroyed and the NEI defenders had partly withdrawn to
    Java. Bandjarmasin was also occupied that day. At the times highly challenging
    advance through the jungle took its toll: 80 per cent contracted malaria, and
    nine men died of this. On 25 February 1942, Oelin was commissioned by the IJN
    23rd Air Flotilla as a relay base.


    # PALEMBANG (OPERATION L)


    The main focus of the Japanese offensive against the Netherlands East Indies was,
    until the first half of February 1942, in the Makassar Strait and the eastern
    part of the Indonesian archipelago the IJN operation. This would change mid-February
    with the attack on Palembang, South Sumatra. The Japanese also significantly increased
    the pace of their offensive. On 14 February 1942, they attacked Palembang, followed
    on 19 February by the landing on Bali and the next day on Timor. In less than
    a week, three operations and an air raid on Port Darwin served the lines of communication
    between Java and the outside world.


    Sumatra is an elongated island (1,750km) with a mountain range along the west
    coast, with many volcanoes and the east coast deep rivers cutting across a wide,
    swampy coastal plain. The island is covered with old-growth forest. Palembang
    the primary city of South Sumatra with over 109,000 inhabitants in the 1930s.
    It lay 150km inland on the Musi River. The main oil wells were at Djambi. The
    road network was limited. A railway line from Palembang, and a partly asphalt,
    gravel main road featuring several concrete bridges connected to Lampung (Ostaven),
    some 48km distance. This line of communication was accessible in many places from
    the east coast via navigable rivers and swamps. It was vulnerable. The roads around
    Palembang were mostly causeways. In Palembang there was no permanent crossing
    over the Musi River. This crucial connection was maintained by several ferries.


    Palembang was not only an extremely important springboard for the Japanese advance
    towards Java, but also an important oil production area. East of the city had
    two refineries: Plaju and Sungai Gei. These refineries processed one-third of
    total NEI oil production. This was the only source of high-quality fuel (100 octane)
    in the NEI. Palembang I, also known as Talembangatu, was 15km from the city. The
    city''s civilian airfield with an L-shaped, paved runway. Palembang II airfield
    still under construction, with 75km-west of Palembang. It was brought into use
    in late December 1941 and early January 1942, and consisted of a large clearing
    in the jungle. Partly because of this, this airfield remained unknown to the Japanese.'
