  - '[PAGE 90]


    assessment of the enemy troops, could only end in failure. The troops lacked fire
    support and the southern pincer in particular was numerically too weak, not to
    mention the ambiguous nature of the orders issued. The northern axis of the NEI
    counterattack clashed with the supporting attack of the Kitamura Unit (48th Reconnaissance
    Regiment) and was driven back. On the southern axis of advance, the De Iong Detachment
    (3rd Cavalry Squadron and 10th Battalion, 6th Infantry Regiment) fought a delaying
    action against the vanguard of the Abe Unit and was driven back even before the
    Naval Battalion arrived. The Abe Unit reached Kertosono on 5 March 1942.


    The bridge over the Brandas was destroyed. Due to the rapid and powerful Japanese
    advance, the counter-attack ordered by Ilgen on 5 March 1942. At Kertosono, the
    Japanese managed to force a passage over the Brandas the same day. The Japanese
    at Kediri fell into Japanese hands undamaged by day. The blocking position between
    the Brandas advanced towards Porong. On 6 March 1942, the vanguard of the Abe
    Unit, comprising infantry supported by artillery, tanks and aircraft, launched
    an attack. The NEI defence was quickly broken and Porong occupied. Surabaya was
    surrounded. The 48th Division prepared to attack Surabaya on 9 March 1942. However,
    on 8 March, the white flag was raised. The battery from 17th Heavy Artillery,
    with 15cm howitzers brought in especially from Manchuria for the attack on Surabaya,
    did not have to take action.


    After the failure of the planned counter-attack, and the Japanese movement towards
    Surabaya, Ilgen made preparations for the transition to guerrilla warfare. The
    capitulation rendered on afternoon of 8 March 1942, the Japanese entered Surabaya.


    # SURRENDER


    Against the background of a disintegrating NEI Army and a crumbling NEI colonial
    administration, Major-General Pesman ordered a local surrender in the evening
    of 7-8 March 1942. However, Lieutenant General Imamura wanted to enforce an overall
    capitulation. Negotiations took place on 8 March in Kalidjati with Imamura on
    the one hand, and Governor General Van Stenborough Stauchower and Lieutenant-General
    Ter Poorten on the other. The NEI delegation had to accept the inevitable. Moreover,
    the Japanese were threatening to bomb Bandung. The RNI army captured on 9 March
    1942.


    The British, Australian and American troops in Java signed a capitulation agreement
    in Bandung on 12 March 1942. Brigadier Blackburn had wanted to continue the battle
    south of Bandung after


