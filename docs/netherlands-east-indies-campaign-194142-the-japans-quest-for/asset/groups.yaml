    # West Java


    During the landing in Bantam Bay, the Japanese were fired upon by the Allied ships
    US Houston and HMAS Perth, who wanted to be seen in the west. In the confusing
    battle, both ships were sunk. A Japanese ship was sunk friendly and three transport
    ships were severely damaged, ran aground and heeled over. Nor were the Japanese
    forced from air. Between 27 February and 1 March 1942, Allied air forces switched
    from counter-attack against the Palembang area to harassing attacks on Japanese
    landing operations. The transport fleets, the lands themselves were bombed and
    stranded.


    At Merak the (local) NEI coastal detachment (c. 40 men) opposed the landing, the
    Nasu Detachment that landed at Merak consisted of the 16th Infantry Regiment (reduced)
    and 2nd Reconnaissance Regiment. This detachment had to carry out the supporting
    attack towards Bogor. With the motorized 2nd Reconnaissance Regiment, a unit of
    battalion strength, the vanguard was occupied that same morning at 0700hrs.


    Throughout their offensive in the NEL, the Japanese made use of tanks, although
    they were not because on the battlefield at Malacca. At the front of this mechanized
    and motorized column to Serang, West Java, we see two light tanks of the battles-size
    2nd Tank Regiment. There are no civilians looking on them. The tanks are Type
    95 Ha-Go light tanks, armed with a Type 94 (1934) 37mm gun and 7.7mm Type 97 MG
    in the hull. The tank commander is seen in the turret. A wooden frame has been
    attached to the tank, to camouflage material, as shown on the second tank that
    follows. (Manichi Newspapers)


