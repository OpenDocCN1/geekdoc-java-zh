    # Admiral Isoroku Yamamoto, Commander-in-Chief Combined Fleet,


    placed the core of the IJN, the Carrier Task Force, the 5th Carrier Division,

    at the disposal of the Southern Task Force as part of the Phase III operations

    on 8 February 1942. The Southern Task Force deployed the aircraft carriers

    an an air strike on Port Darwin (Mobile Operation I) and for operations

    of Java (Mobile Operation II). On Thursday morning, 19 February

    1942, planes from the four Carrier Force aircraft carriers supported

    by 54 planes from the 1st Air Flora of Kendari and Ambon attacked

    the north Australian port city of Darwin. The latter was an important but

    poorly equipped base for operations in the Netherlands East Indies. With the

    deastating air strike, it was put out of action for the time being.


    In the early hours (0235 and 0315) of 20 February 1942, troops

    from the Eastern District landed in three areas on the undefended south

    cof Timor. Eastern District consisted of the 1st and 3rd battalions,

    228th Regiment; the 2nd Battalion, 38th Mountain Artillery

    Regiment; and a light tank company. The IJN delivered two platoons of the

    st Sasebo SLF and the remaining troops of the 3rd Yokosuka SLF. In

    tree columns operating, side used the detailed tracks, and an

    improved road to cross the mountain range north towards

    Kpang and Penfei. It was like a repeat of the attack on Ambon. On 22

    February 1942, a fourth landing took place at Tenau, which included tanks,

    among other things.


    After the amphibious landing, Leggatt decided to vacate and destroy the

    afield. D Company took up a blocking position of Kupang on

    road to Baoben to stop the Japanese advance. Along the main connecting

    road, line of communication, Leggatt intended to delay a

    next. In the operation near Tjampang (45km east of Kupang), he

    intended to make a final stand. With his firepower, in the form of

    .303-caliber guns and jun mortars, would come into ours.


    The NEI Kupang Detachment cleared their positions on the coast and

    assembled south of Kupang. It of had to take up a blocking position on

    the Baoben-Kupang road and reside with D Company. No further orders

    of the afternoon, the territorial commander were forthcoming. As the

    Captain A.L. Vastrik commanded the Kupang Detachment (189

    ment) and moved towards Penfei. In the morning of 21 February 1942, he

    and his second-in-command were, wounded by friendly Australian

    fire, and dropped out of the line. Their successor, a youthful nervous,

    did not join the Australians. The RNEI Army''s

    role played out before it had even started.


    At 104hrs, the airborne landing by 45 Japanese paratroopers from the

    HQ, 1st and 3rd Yokosuka SLF took place on a meadow

    about 12km from their objective: the airfield. This drop zone was chosen

    because of the losses at Menado; the paratroopers blocked the main road

    of Babaoes. This unexpectedly threatened Sparrow Force in its rear, and cut off

    tis intended retreat. Leggatt responding to his cries

    west of Babaoes. Meanwhile, he failed to

    establish communications with Australian troops under Brigadier Vale

    Tampang. As a result, there was no coordinated action against the

    Japanese blockade. However, because of their encounter with the Australian

    troops, the paratroopers were unable to reach the airfield.


    ![](img/52135db0eb5e64e74130266a9290cbf8_68_0.png)


    67'
  - '[PAGE 69]


    The next day, at 1024hrs, the second echelon of 250 men from 2nd Company, 3rd
    Yokosuka SLF jumped onto the same drop zone. Leggatt counter-attacked and succeeded
    in recapturing Babaoe. However, the Eastern Detachment''s right attack unit, the
    reinforced 2nd Company, 1st Battalion (206 men), made the main road at the end
    of the day and formed a new roadblock east of Babaoe. Once again, the Australian
    retreat route had cut.


    In the afternoon of 22 February 1942, Sparrow Force managed to finally open the
    road, having attacked several times during the morning. The Japanese vanguard
    from Kupang, however, caught up, followed the next morning by the reinforced 1st
    Battalion, 228th Infantry Regiment with tanks. Lieutenant-Colonel Leggatt was
    forced to surrender.


    Sparrow Force''s combat suffered from declining morale and an increasing death
    rate (30 per cent). Morale declined under air strikes, Japanese successes elsewhere,
    the lack of air support and the knowledge that reinforcements would not be forthcoming.
    Tactically speaking, communication was ''very difficult to maintain in this type
    of country''. Leggatt recognized this issue. Partly for this reason, he wanted
    to fight it out in the open area near Tampiong. He also deployed his troops on
    21 and 22 February 1942 in a fragmented manner, losing valuable time – that Leggatt
    did not have in view of the Japanese advance against this anticipated threat.
    The troops showed a lack of willingness to fight on 20 and 21 February 1942; at
    this stage, they ''were not confident and were apt to withdraw when shots were
    fired in their vicinity''. This could be attributed to a lack of combat experience.
    On 22 February 1942, nervousness resulted in panic. Despite these shortcomings,
    Sparrow Force stood firm. Its casualties amounted to 150 men killed or wounded,
    while 200 were missing. The 3rd Yokosuka SLF suffered 38 killed and 40 to 50 wounded.
    The Eastern Detachment reported 67 killed and 56 wounded. The Japanese imprisoned
    1136 men: 179 British, Australians and 23 Dutch


    At the same time as the attack on Kupang, the Eastern Detachment also attacked
    Dilly, the capital of Portuguese Timor. Dilly had been occupied on 17 December
    1941 by a combined NEI-Australian detachment under Dutch leadership. The RNE Army
    had urged this step to prevent Japan from establishing an air base, from which
    it would have been able to reach the airfield at Makassar and Kendari, directly
    threaten Ambon and Darwin, and the control of communication between the Netherlands
    East Islands and Australia.


    The NEI-Australian expedition consisted of the reinforced Manadonese 3rd Company,
    8th Infantry Battalion from Java, a battery of 7.5cm field guns, a detachment
    of engineers and some service personnel. It was reinforced by six brigades from
    the Kupang Garrison Battalion. The Australians deployed the 2nd Independent Company,
    a command unit (270 men). The Dutch contingent totalled 604 men. The expedition''s
    commander was Lieutenant-Colonel N.L.W. van Straten. The NEI detachment defended
    the post of Dilly and the airfield in positions without depth. As a command unit,
    the 2nd Independent Company was not suited to static defence. It was designated
    as the reserve and located in the mountains 4km south-west of Dilly. One section
    was stationed at the airfield.'
  - '[PAGE 70]


    The presence of NEI and Australian troops in Portuguese Timor made Japan question
    how it would deal with this neutral territory. The Imperial General HQ wanted
    to avoid conflict with Portugal. However, the Southern Army (IJA) and Southern
    Task Force (IJN) agreed that Allied forces in Dilly posed a threat to the attack
    on Kupang. They had to be driven out. Dilly thereafter had to remain in Japanese
    hands as an important base for operations against Darwin. The Sixteenth Army objected
    to the simultaneous actions on Timor. It wanted to concentrate its forces on the
    conquest of Kupang. It referred to the unsuccessful attack on Laha in the operation
    against Ambon. The Imperial General HQ ended this discussion.


    On 20 February 1942, the Eastern Detachment with the reinforced 2nd Battalion,
    22th Infantry Regiment (led by commander Colonel Sadashachi Doi) planned a direct
    attack on Dilly. This failed due to NEI artillery and machine-gun fire. Colonel
    Doi modified his plan and landed just a kilometre to the west. The amphibious
    landing took place at 021hrs. The main force started a frontal attack on the airfield,
    with the 5th Company conducting an envelopment and the 7th Company (reinforced)
    turning movement to the south of Dilly. Lieutenant-Colonel Van Straten reinforced
    the airfield defences. His retreat route was, however, threatened. Some of the
    NEI troops had fled. In addition, he could not call in the 2nd Independent Company
    because of a breakdown in communications. The Australians would not learn of the
    landing until around 090hrs. On seeing the fleet, Van Straten estimated the Japanese
    strength to be 4,000-5,000 men. At 0800hrs, he decided to make a general retreat
    towards 2nd Independent Company. By the end of the morning, Dilly was in Japanese
    hands.


    The IJA''s losses amounted to seven killed. 24 soldiers lost their lives: eight
    NEI men and 16 Australians. The number of Allied prisoners was 33.


    The defeated Australian and NEI troops from Dutch and Portuguese Timor retreated
    into the mountains. They eventually started a guerrilla campaign. However, that
    story is beyond the scope of this book.


    With the capture of Timor, and the Carrier Task Force in the waters of Java, the
    island''s encirclement was complete. It was now cut off from reinforcements from
    Australia. Within a week, Japanese troops would land on Java.


    # JAVA (OPERATION H)


    On 19 February 1942, on Wavell''s advice, the Combined Chiefs of Staff decided
    to stop sending troops to Java as reinforcements. The Australian army corps would
    be sent to Australia and Burma instead. On its way to Java was therefore longer
    to be shipped to Java. The island was thus, to all intents and purposes, given
    up. Wavell reassigned as Supreme Commander, closed his personal headquarters and
    left Java on 25 February 1942. Dutch officers took command. Lieutenant-General
    H. te Poorten, already became the commander-in-chief ABDA-ARM. On Java, ABDA-AIR
    was renamed Java Air Commander (JAC) with Major-General L. van Oijen at his head.
    Vice Admiral C.E.L. Helfrich was from 14 the commander of ABDA-FLOAT.'
