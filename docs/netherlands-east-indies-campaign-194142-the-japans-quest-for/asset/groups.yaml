  - '[PAGE 63]


    # NEI COUNTER-ATTACK AT PLAJFU REFINERY, 14 FEBRUARY 1942 (PP. 60–61)


    For the IAI attack at Palembang on 14 February 1942, the battalion-sized 2nd Raider
    Regiment could only allocate the 1st Company (less elements, 99).


    The U paratroopers, led by company commander 1st Lieutenant Nakao, landed at the
    refineries at 0930hrs local (South Sumatra) to its south-west where some land
    did in the refinery itself. They managed to establish a base behind the oil tanks
    on the site and set up a shelter under fire on top of the oil tanks and in the
    refinery upper platform.


    At 1230hrs, the Moesi reinforcement met the 2nd Company. He had at his disposal
    from 4th Company, 10th Infantry Battalion, two machine guns (75mm MG) and one
    mortar (20mm AT). The Moesi Oil refinery formed a force with one MG platoon and
    one platoon to recover the left and right flank. His left flank was covered by
    a platoon of Town Guards. The attack engaged the 33rd Company, 10th Infantry Battalion,
    which reinforced the force into three battalions. His total strength was 312 men
    (engaging the Town Guards).


    Captain Oh began at 1320hrs. The assault was slow to counter sniper fire. With
    the arrival of reinforcements, the attack gained momentum, and the Japanese were
    repelled from an oil tank.


    This scene shows the NEI assault at the end of the offensive on the Palembang
    junction by the right forward platform led by Captain-


    2nd Lieutenant E.J. van Blommestein was armed with klewangs drawn. The assault
    was covered by mortar fire, and MMG fire aimed at the Japanese positions in the
    towers and among the oil tanks. Further cover was provided by smoke from a burning
    solar tank. On Van Blommestein''s left was the refinery platform bounded by


    The assaulting Menadonese soldiers (1) were armed with M.95 carbines (2) and klewangs
    (3). In the background, a soldier threw a hand grenade (4). When the grenade,
    the 2nd-zm long force unravelled, the safety pin to be pulled out exploded on
    impact, hit the machine gun (5) loaded with 6.5 x 53.5mm M15. The Japanese paratroopers
    are beginning to retreat (6)


    After the recovery of the refinery, Van Blommestein 1st Class Police and Menadonese
    Bantuan took control of the refinery and lowered the three flags (7) under intense
    Japanese fire.


    That, at 2100hrs, an enemy attempted to extinguish the Japanese resistance of
    about 15 men using hand grenades. The attack hit the 10th Infantry Battalion with
    at least one Company which was severely injured.


    A number of oil tanks caught fire at the refinery during the attack. The fire
    quickly spread through the marsh. The water was trapped. The supplies were moved
    up to the marsh. The Japanese again formed for the next morning attack. But at
    0300hrs, Captain Oh ordered to withdraw. The refinery and its supplies fell into
    Japanese hands, with only minor damage to the installations.


    ![](img/52135db0eb5e64e74130266a9290cbf8_63_0.png)'
  - '[PAGE 64]


    Combined Striking Force, IJN, was also deployed against the Japanese fleet. Vice
    Admiral Ozawa deployed his air units against this threat. With air cover and with
    the element of surprise lost, Doorman decided to cancel the action.


    After midnight on 15 February 1942 the operation of Operation L commenced with
    the arrival of the Japanese transport ships at Muntok, Bangka. The Muntok landing
    of 1st Battalion (reduced), the 29th Infantry Regiment left at Muntok at 022shrs
    and quickly took the city and Muntok Field. The latter was immediately expanded
    by the 33rd Airfield Company. The NEI units left Bangka and were ordered to withdraw
    by RAF. The river-ending units left the Musi Delta and reached the mouth of the
    river by Palembang. The Iwabuchi left the unit on the left wing aided by the Saleh
    River past Palembang towards Martapura. The IJN supported this attack with mineseping
    operations in the river. The river-ending units were repeatedly attacked by RAF
    planes from Palembang II. The Japanese suffered minor losses. Air coverage was
    limited due to commitments elsewhere. IJ was in action against the Combined Striking
    Force, while the Third Air supported the airborne landing. The Military Aviation
    Service and FEAF few members bombed Palembang but enjoyed little success.


    ![](img/52135db0eb5e64e74130266a9290cbf8_64_0.png)


    The repeated strikes could not halt the Palembang river-ending units. During the
    night of 15 February, Palembang received reports from coastguards against the
    Japanese fleet approaching the Musi, the disembarkation in landing craft and the
    retreat up the Musi. The territorial commander ordered the destruction of the
    oil refineries and withdrawal to Palembang at approximately 0300hrs. The artillery
    battery located at Radjen on the Musi was destroyed and evacuated. Colonel-Vogelsen
    moved himself to command the post to the bank. Sungai Refinery on Pl, however,
    fell into Japanese with large stocks of oil and aviation fuel and only damage
    to its installations. Thorough destruction of Palembang had been prepared but
    not the territorial commander could forbid the destruction on 14 February 1942:
    the territorial commander recalled the unit to Palembang. The territorial commander
    prematurely ordered the telephone exchange to be destroyed, and retreated to Lah.


    The withdrawal ordered to troops to south-east of the Musi, not to the north of
    Palembang. The order to recapture Palembang A Airfield by 1st Company, 10th Infantry
    Battalion was defied by the territorial commander on the morning of 15 February
    1942. Shortly after noon, the Japanese echelon, comprising 33rd Company, 2nd Raider
    Regiment (90 men), jumped over Palembang I. The 10th Infantry Battalion''s commander,
    Major B.P. de Vries, was also informed that the Japanese landing troops had approached
    by 8km via the Palembang River. He then decided to call off the counter-attack
    and withdrew his troops to the east bank of the Musi.


