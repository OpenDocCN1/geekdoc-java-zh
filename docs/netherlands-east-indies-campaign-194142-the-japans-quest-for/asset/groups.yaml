  - '[PAGE 22]


    Netherlands East Indies. Plans to strengthen the fleet with battleships, battlecruisers
    or heavy cruisers led to fierce decursion within the navy. There was no unanimity.
    In 1938, a fleet plan was submitted for the construction of three battlecruisers,
    among others, but it was not implemented. In 1941, the Netherlands East Indies
    the following vessels were present: two light cruisers, a flotilla leader, seven
    destroyers and 15 submarines. The Naval Aviation Service (Marine Luftvaartienst)
    had 59 flying boats (Dortnier Do24k and Consolidated PBY Catalina) and eight tactical
    reconnaissance planes.


    ![](img/52135db0eb5e64e74130266a9290cbf8_22_0.png)


    The defence of the Netherlands East Indies against a foreign enemy suffered from
    structural weaknesses. In 1930, an indigenous population of 60 million souls was
    dominated politically, administratively and economically by 240 thousand Europeans.
    The position of this European top layer was weakened after May 1950 as meant from
    the Netherlands fell away. The Indonesian people created nationalist desires.
    The US Chief of Naval (Operations Harold R. Stark stated that in 12 November 1940
    ‘Memorandum for the Strategy (Plan Dog)’. This political situation cannot be viewed
    as in permanent equilibrium. The rulers are unsurpassed by a home country or by
    an alliance. Native rebellions have occurred in the past, and more in the future.
    A retired colonel appeared in a Netherlands East Indies newspaper on 23 July 1940
    the idea that the vast of the population, especially in Java, was considered as
    completely loyal and even attached to the authority, as it was now established
    and organized. This view turned out to be an idé fixe. The Dutch colonial state
    and its army were essentially an occupation force with little support from within
    Indonesian society.


    Five heavily armed NEI soldiers in firing positions. In the upper right is an
    LMG team, comprising gun and assistant, operating the Thompson Madsen M15 carbine
    gun (karabijnmachine gun). The two soldiers in the foreground are armed with the
    Sten sub-machine gun. (STEN M39) at upper right is wearing his gas mask in the
    ‘ready’ position. (Beeldbank WW2 - NIOD)


    # ALLIES


    As agreed in the Anglo-Dutch Australian staff conference in February 1941 and
    recorded in the Plans for the Employment of Naval and Air Forces (PLENAPS) of
    12 November 1941, after the breakout of hostilities Australia sent units to the
    islands of Ambon and Timor in the Netherlands East Indies. 13 Squadron RAAF stationed
    light bomber and coastal reconnaissance aircraft on Ambon and at the island of
    Buru. Penfoe Airfield on Timor, a flight from 2 Squadron RAAF was stationed. For
    security purposes, three battalion groups were formed from the 23rd Infantry Brigade,
    Australia 8th Division: Lark Force (for Rabaul, New Britain), Gulf Force (Ambon)
    and Sparrow Force (Timor). With these units Australia formed a ‘forward observation
    line’.'
