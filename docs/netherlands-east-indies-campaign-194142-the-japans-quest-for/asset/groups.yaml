  mdcn: '


    ![](img/52135db0eb5e64e74130266a9290cbf8_41_0.png)


    行动通过西部的曼纳多（Menado）和东部的卡凯哈（Kakeha）实施钳抄战，捕捉了分散的荷兰印度（NE）军队，同时日本伞降兵通过曼纳多二号机场（兰戈安）进攻中心。曼纳多由
    B.F.A. Schmoller 少校领导的苏拉威西及曼纳多领土司令部曼纳多部队司令部的驻守部队防御。兵力约为 1,500 人，由若干互不联系、战斗价值各异的独立单元组成。曼纳多连队的沿岸防御迅速被攻破，城市被占领。经过短暂战斗，伞降兵成功夺取了机场。荷兰属东尼群岛共和国军（RNEI）部队发起了两次反击，但缺乏协调且力量过弱。伞降兵在下午还占领了被遗弃的海军基地。从曼纳多发起的进攻被一次后卫行动阻滞。此后，协同抵抗彻底瓦解了。


    占领曼纳多导致特种登陆部队 44 人阵亡，184 人受伤。阵亡者包括 12 名伞降兵，他们的运输机被自己的战斗机击落。日方声称击杀了 140 人并俘了 48
    人。根据荷兰记录，有20 名士兵死亡，其中一些被处决。


    随着塔拉干（Tarakan）和曼纳多的沦落，北方防线被突破。对于强调新加坡的韦威尔来说，荷兰东印度群岛北部和东部边缘基地防御并非优先事项。他希望为随后的战斗保留空军。荷兰人和美国人显然意见不同。他们共同部署飞机对抗日军防御。


    军事航空队和远东空军（FEAF）针对塔拉干及其机场的日本登陆舰队执行任务。后者受损，但总体结果相对有限。日本零式战斗机造成了沉重损失。军事航空队总共损失 30
    名士兵和 23 名机组。1942 年 1 月 13 日，军事航空队结束了对该岛的进攻。


    军事航空队缺乏进攻曼纳多的任务，因此针对后者的任务由澳洲空军（RAAF）和远东空军执行。结果不理想。日本海军本部（JN）提到曼纳多敌机的猛烈反击。幸运的是这没有给我们造成[重大]损失，因为他们的攻击是单机进行的，而且技术并不高。我们观察到，如果我们受到大量[敌机]编队的攻击，我们的损失将是毁灭性的.¹³
    这种评估同样适用于塔拉干。


    ¹³ Remmelink, W. ed. (trans.). The Operations of the Navy in the Dutch East Islands
    and the Bay of Bengal. The Courts Fortune/Leiden University Press, 2016, pp. 167–71.


    ## 巴里巴板 (BALIKPAPAN)


    两周后，日本人在 1942 年 1 月 24 日发起了第二次跃进。同样同时进行了登陆作战。坂口支队登陆巴里巴板，此时日本海军在苏拉威西发动进攻。


    塔拉干机场的准备工作被严重延误。结果，日本陆军和海军不仅被迫推迟了对巴里巴板的进攻三天，还取消了计划中的伞降兵部署。为了（几乎）完整地夺取石油设施，坂口派遣了两个印度尼战营向巴里巴板发出最后通牒。破坏自然资源和设施的行为将导致荷兰军事人员处以死刑。此外，坂口调整了作战计划。利用出袭性，一个单元将通过河流渗透后方，切断撤退路线。驻守军很快将被迫投降。后来两名来自塔拉干的印度尼警察当了向导。1942
    年 1 月 16 日，日本战斗机驻塔拉干。两天后，他们开始对巴里巴板进行打击。


    巴里巴板是婆罗洲东重要的石油港，有一个炼油厂和一个大型储罐区（160 个坦克）。城市位于一个大海湾，周围被沼泽和植被茂密的地区包围。荷兰驻守军共有 1,200
    人，由第 6 步兵营、一个包含两个步兵连和一个机枪连的野战营（缩减后）以及第 2 岸防高空炮连组成。驻守军接命令通过速战术防御巴里巴板，并进行后卫行动为破坏设施争取时间。如果巴里巴板落入敌手，命令是进行游击战。


    荷兰军指挥官 C. van den Hoogen 中尉未回应坂口的最后通牒，立即开始破坏基础设施。一旦石油设施被毁，Van Hoogen 决定不再防御巴里巴板。坂口支队于
    1942 年 1 月 24 日 02:40 登陆在防御区外的三个地点。在城市北湾的登陆威胁了后方的驻守军。1942 年 2 月 20 日，78 名平民和战俘被处决。


