    # 第一阶段行动


    1941年12月7日至8日，日本发起了“甲号作战”（Operation A-Go），同时对美国和英国的资产发起了同步的大范围多线攻势。尽管未受到直接攻击，但荷兰于1941年12月8日向日本宣战。根据参谋会议的协议，荷属东印度群（NEI）军事航空队将一架飞机（机翼）和一个战斗机中队派往马来亚。荷兰皇家海军派遣了一艘轻巡洋舰和潜艇。除了军事航空队的重大贡献外，荷兰荷属东印度陆军（RNEI
    Army）还派遣了四个营（等同于分区）的骑兵团（Marechaussee Corps），这是一支来自亚齐专门从事游击战的步兵部队。他们于1942年1月和2月将该营部署在马来亚。其人数约为142人，其中包括印度尼籍士兵。在取得一些成功行动后，部分部队于1942年3月返回苏门答腊。


    在三丹和马来亚北部登陆后，船运力量已投入可用用于“乙号作战”（Operation B）；1941年12月16日占领了米里，并于12月24日占领了古井和Labondo。荷属东印度陆军将此视为严重威胁，并由军事航空队轰炸做出回应。荷兰皇家海军派遣潜艇对抗日本在古井的野心行动。这些攻击造成了相当的破坏，但未能阻止日军的推进。


    菲律宾民尼延描岛的港口达沃于1941年12月20日被占领，若洛随后也于12月25日被占领。随着古井、达沃和若洛被占领，进攻荷属东印度群岛的基地已落入日本人之手。日本没有选择最初计划的帕劳，而是将位置优的达沃作为“丙号作战”（Operation
    H）的集结点。在针对马来亚和菲律宾的行动仍在进行时，日本海军于1941年12月26日转向第二阶段行动，进攻荷属东印度。婆罗洲沿岸的丹加滩和北苏拉威锡的石油是首批受攻击的目标。


    古井、达沃和若洛的机场状况比预期糟糕得多。海军建设需要更多时间来准备这些基地。达沃和若洛直到8号才完全可用。


    日本的南方进攻攻势发生在雨季，此时亚洲大陆上空存在高压系统，北半球受东风影响，南半球受西南风影响。来自中国海和太平洋的大部分潮湿空气伴随大阵雨和低能见度，阻碍了航空行动，阻碍了飞行移动并导致无线电通信不畅。视线大部分是热带丛林。丛林中只有少数大城市。道路极其受限。爪哇是一个例外，该主岛连接着现代道路网络以及铁路和轨道网。


    ![](img/52135db0eb5e64e74130266a9290cbf8_39_0.png)


    # 左上方


    从1937年起，荷属东印度航空队将现有的三个侦察和战斗机中队重组为水平轰炸机中队。为此，他们在1936年及后的几年购买了美国制造的格林马丁B-109和166双发动机轰炸机。照片中的飞机是WH-2（莱特哈逊2型），注册号为M-514和M-339。四名机员中有三名能够胜。飞机带有1939年11月15日引入的国家标记。两架飞机均于1941年分配给第2/3航空群，并在义顺（新加坡）或稍后在卡利亚蒂（Brokhoff博物馆）失事。


    # 右上方


    1942年1月。尽管有这些延迟，日本南方军仍希望将进攻爪哇的时间提前一个月。他们寻求利用行动的有利进展，保持势头，并领先于美国海军和英国皇家海军可能的援军。考虑到空军基地交付的延迟以及可用运输舰和海军护卫舰的数量有限，日本海军反对提前。在日本陆军的巨大压力下，日本海军最终在1942年1月1日的“甘拉姆协议”（Cam
    Rah Agreement）中表示同意。


    一名配备弹匣式20mm Solithm-1800反坦克步枪（M38）的射手。总共有72支此类步枪。S18为步兵营提供了便携式坦克武器。一个反坦克步枪小组（10人）配备两支反坦克步枪，分配给每个步兵营的第4连（重武器连）。Beeldbeank
    WW2 - NIOD）


