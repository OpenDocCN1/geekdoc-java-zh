    # OPPOSING FORCES


    # JAPANESE


    The Imperial Japanese Army (IJA) and the Imperial Japanese Navy (IJN) worked together
    in the Imperial General Headquarters (IGHQ). The IGHQ was chaired by the emperor
    and formed the military and political summit of the army and navy. The IGHQ was
    not an umbrella headquarters. The armed forces were not subordinated, but had
    their own parallel organizations. For joint operations, agreement had been sought
    between the two armed forces. The resulting compromises were recorded in a written
    agreement. Consultation between the IGHQ and the government took place in the
    IGHQ–government liaison conferences. We also find this consultation structure
    between the IJA and IJN at an operational level. Inter-service competition was
    particularly strong.


    Of 51 infantry divisions, the IJA made 11 available for the Southern Offensive
    (Operation A-Go), organized into four armies controlled by the new Southern Army
    (Nampo Gun). Three divisions were earmarked for the attack on the Netherlands
    East Indies. Sixth Army was formed under Lieutenant-General Hiroshi Imamura on
    6 November 1941. This army consisted of the 2nd Division and the 56th Mixed Infantry
    Group (Sakaguchi Detachment) of the 56th Division. At a later stage of operations,
    the 38th Division and 48th Division would be added. With the exception of the
    38th, these were Type A1 divisions and had experience of swampy terrain in southern
    China, while the 48th Division was not only motorized but also amphibiously-trained.
    The IJA set up parachute training in December 1940. The airborne 1st Raiding Group
    witnessed its first combat in the Netherlands East Indies.


    Given problems with available shipping, the 11 divisions were significantly reduced
    in strength before the Southern Offensive from approximately 24,000 to 13,000–14,000
    men. Three divisions were motorized. Even with the force reduction, the 2nd Division
    did lead the 3rd Battalion, 2nd Artillery Regiment in Japan due to a shortage
    of ships. The assigned divisions were triangular, consisting of the standard infantry
    group headquarters with three infantry regiments, a field or mountain artillery
    regiment, a reconnaissance regiment, an engineer regiment, a transport regiment
    and further support units. The reconnaissance, engineer and transport regiments
    were actually battalion-size units.'
