    - 28 February: The RNE Army surrender.

    - 1 March: Japanese Shoji Detachment takes Kalidjati Airfield.

    - 2 March: Battle at Lewwilang between units from the Japanese 2nd Division and
    Blackforce.

    - 3/5 March: British B Squadron, 3rd The King''s Hussars disembark in South Sumatra.

    - 5 March: Jakarta is evacuated by the RNE Army and occupied by the Japanese.
    ADACOM decides to evacuate South Sumatra. Ciater defensive position breached by
    the Japanese.

    - 6 March: Japanese air raid on Darwin, northern Australia. Negotiations concerning
    the RNE Army''s complete surrender take place in Kalidjati. Combined Chiefs of
    Staff decide not to send Australian Corps to Japan.

    - 7 March: Cilac and Surabaya are occupied by the Japanese. Disembarkation at
