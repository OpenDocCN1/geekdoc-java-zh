    South Sumatra was defended by Palembang and Djambi Territorial Command. The command
    consisted of a regional headquarters, the Palembang and Djambi Garrison Battalion
    of six companies, a Demolition VIB light battalion, Palembang Town Guard and Japanese
    Town. For the defense of the oil installations, the territorial troops were reinforced
    with a machine-gun company and a detachment of eight 7.5cm guns and two 4cm AA
    guns. The garrison was also five APCs: two at Palembang and one. The total strength
    was 1,300. The commander was Lieutenant-Colonel L.N.W. Vogelesang.


    Bandar Lampung (Oosthaven), south Sumatra. On 14 February 1942, the Japanese attacked
    Palembang, the first reinforcements of ground troops from Middle East arrived
    at Oosthaven. A MK V light tank from background destroyed and collapsed buildings.
    In the late afternoon of 15 February 1942, orders were received to re-embark the
    3rd King''s Hussars. The unit was shipped to wharf before action as part of Blackforce.
    (Australian War Memorial)


    From 16 January 1942, Palembang developed into a major British base. The bombers
    were reorganized into No. 225 (Bomber) Group, stationed at Palembang. On 1 February
    1942, No. 226 (Fighter) Group was formed, by Palembang Regiment. Ground-based
    air defense was reinforced by: 6th Anti-Aircraft Regiment (RA) (reduced), a troop
    from 78th Battery, 35th Light Anti-Aircraft Regiment (RA) and a troop from 89th
    Light Anti-Aircraft Battery (RA). As Air Commodore J.F. Hunter, commander of No.
    225 (Bomber) Group, acted as Air Officer Commanding Mobile.


    A small army of Australian Corps arrived on 26 January 1942 by plane to Jakarta.
    Go Lieutenant-General J.D. Lavarak, and his chief of staff, Brigadier Fry, explored
    the deployment area. In South Sumatra, they expected the Japanese would first
    occupy Bukity as a forward base to gain local control and superiority. They would
    attack the oil refineries by paratroopers. This airborne operation would be combined
    with an upstream river operation. Lavarak therefore advised Wavelli to immediately
    strengthen the defenses of the oil refineries and the airfield with an infantry
    battalion and to hand out rifles to RAF, RAAF and AA guns. It was decided to send
    one infantry battalion to the refineries and one to the islands of Bangka and
    Belitung. After the arrival of Australian reinforcements, the defence of Palembang
    and Palembang would be reinforced with a squadron of light lanks.


    On 5 February 1942, two REI Army battalions left Java for Sumatra: the 10th Infantry
    Battalion (reduced) moved to Bangka and the reinforced 2nd Company, 12th Infantry
    Battalion headed to Belitung. Once Australian reinforcements arrived, these battalions
    would have to return to Java. The 10th Infantry Battalion''s headquarters and
    two companies were stationed in Praboboeing. The 1st Company, 10th Infantry Battalion
    (Japanese) was stationed in Palembang. The choice of Praboboeing was not ideal.
    It was too far from the protected locations to be able to counter-attack. Palembang
    was provisionally meted with buses and trucks driven by called-up Indonesian drivers.
    The 10th Infantry Battalion became available to the Territorial Commander.


    Operation L, targeting Bangka island and Palembang, had to be postponed twice
    due to the poor condition of Kuch Airfield and the unavailability of Singawang
    II. Kuant in Malaysia had taken over


