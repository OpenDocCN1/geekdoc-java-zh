    # 敌指挥官


    作为新成立的第十六军司令官，55岁的今村将军被赋予了征服荷属东印度群的任务。作为一名出色的组织者，他的作战计划极其大胆。在登陆爪哇岛时，他的船遭了友军误击；他掉入满是油的水中，并在几小时后被营救（《马尼拉报》）。


    # 日本人


    今村晖石中将（1886–1968）是1942年第十六军的司令官。他于1907年成为军官。今村对英国军队有深入了解；1917年，他被派往伦敦担任了三年的副武官，1927年担任英属印度的武官。除了这些海外任职外，他还在日本帝国陆军总谋部的作战科以及满洲关东军军部获得过参谋经验。他曾作为团长和师长在中国拥有过实战经验。从1940年至1941年6月，他担任影响力极大的军训练监察总监副长。1941年11月6日，他受天皇任命为第十六军司令，这是一项光荣的任务。他是南方进攻战的关键一环。由于距离遥远且信号设备丢失，今村在爪哇战役期间对第十六军的指挥控制有限。


    战后，他被澳大利亚政府指控战争罪。他被判定有罪并判处十年监禁。1948–49年间，雅加达的临时军事法庭就婆罗洲和爪哇犯下的战争罪对其进行了审判。然而，他被判无罪。


    今村在日本军中以其作为具有坚定且不屈斗争精神的勇敢指挥官”而闻名。他是一个高明的组织者，愿意承担巨大的作战风险。庄次支队的登陆极具果敢，但也近乎鲁莽。


    庄次俊茂上佐（1890–1974）是1941年第38师第230步兵团团长。该团参加了1941年12月和1942年3月的香港攻坚战。今村亲自选择庄次，带领一个小小的团级战斗群在爪哇执行一项重要的第二次行动。他信任庄次会独立行动，并在必要时表现出主动性，庄次确实做到了这一点，但并非今村预期的那样。事实上，他违反了明确命令，在必要时进攻了Cative阵地，这一大胆行动赢得了成功：他在两天内到达了荷属东印度军队的核心区域并击败了该战役。


    庄次少将于1949年被雅加达临时军事法庭因在卡里达蒂、苏邦和火山口山口犯下的罪行被判处死刑。然而，在上诉后，该判决被改为十年监禁。


    远藤三郎少将（1883–1994）是日本帝国空军（IJAS）第3师的司令官。他于1911年毕业于军官学校，1922年毕业于陆军参谋学校。他成为一名炮兵军。他在1927年的日内瓦裁军会议上获得了国际经验。


    ![](img/52135db0eb5e64e74130266a9290cbf8_11_0.png)


    ![](img/52135db0eb5e64e74130266a9290cbf8_12_0.png)


    # 极左翼


    庄次俊茂是今村的老相。他们曾在多个部队中共役过很长时间。1942年3月2日，在苏邦，庄次被荷属东印度机动部队的反击打了个措手。他们没有意识到他的司令部的存在，继续向前推进。1942年9月，第38师第230步兵团转移到拉巴乌尔并部署到瓜达尔康岛。该部队遭受了惨重伤亡。瓜达尔康之战的失败导致庄次从前线部队调往储备和驻守部队。战争结束时，他是日本仙台地区司令部的指挥官。这张照片是在1944年3月晋升为少将后拍摄的。


    ![](img/52135db0eb5e64e74130266a9290cbf8_12_0.png)

