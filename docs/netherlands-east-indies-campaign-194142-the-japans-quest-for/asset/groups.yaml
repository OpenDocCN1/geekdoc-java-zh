    参谋本部（隶属战争部）指挥野战军。


    指挥链因因荷兰皇家海军（Koninklijke Marine）的存在而变得更加复杂。它不属于荷属东印度（REI）机构，而是隶属于荷兰国防部。尽管海军司令官在作战上受总督指挥，但在行政政策上需向荷兰国防部长负责。海军的资金来自荷兰和REI的预算。武装力量在物理上保持分离。总部位于万隆，而荷兰皇家海军驻在雅加达。


    ![](img/52135db0eb5e64e74130266a9290cbf8_20_0.png)


    1942年3月5日，总督从位于伦敦的荷兰政府处解除了最高指挥权。总督随后可以自由继续在日本统治下管理该地区。事实证明这只是愿人如意。


    在战间期，REI军经历了三轮紧缩减：1922-1923年、1927年以及1930-35年。由于欧洲和亚洲国际局势紧张局势升温，国防再次增加。军司令部制定了1936年强化计划。这项八项计划规定了进一步加强空军、步兵机械化、为步兵和（海岸）炮兵配备火力，并填补了人员空缺。


    1941年底，RNEI骑兵被重组为一个骑兵中队和四个侦察中队。一个摩托化中队指挥一个小组，由两辆配备了福特GP吉普车的吉普车和一个配备了M3（装甲）白色侦察车和AC30（装甲）Avis-Strauss汽车的汽车排组成，每个小组包含一个配备12.7mm
    M30柯特机枪的分队。


    航空队在1936年从两个侦察中队和一个一线兵力18架飞机的战斗机中队转变为军事航空队，拥有七个中轰机中队、四个战斗机中队两个侦察中队。它拥有95架轰炸机、99架战斗机、34架侦察机和155架其他飞机。1936年至1939年间购买的中型水平MartinB-10/19
    WH轰炸机在当时虽先进，到1941年虽已过时但性能依然良好，它们的装甲和防御武器面对日本战斗机的攻击时过于薄弱。随后，162架北美B-25C-5NA Mitchell中型轰炸机于1942年2月开始交付——已太晚未能参加战斗。RNEI的主战斗机布鲁斯特B339（D63）性能完全不逊于日本陆军战斗机岛田Ki-43型（隼）。然而，日本海军战斗机三菱A6M2（零式战斗机）的火力更猛，并配有曳弹。


    除了部分过时的装备，缺乏经过训练的（技术）人员是RNEI空军的第二个弱点。例如，战斗员没有正式的战斗飞行训练。这是由于缺乏经验丰富的教练以及缺乏有效的战斗战术。


    对空军的优先考虑导致了时代现代化的延迟。重点是增加火力机动性。前者通过进口俯射武器得到了加强，


    19


    照片显示了位于万隆的第2骑兵中队及其汽车，前景是指挥小组，右侧是装甲车和指挥小组的无线电。（国家档案馆DLC，公有领域）


    ![](img/52135db0eb5e64e74130266a9290cbf8_21_0.png)


    反坦克和防空武器以及手枪。机动性通过购买卡车和装甲车提高。部分车辆是动员时征用的民用车辆。坦克也被引入了REI军。1939年，订购了118辆维克斯利-Carden-Loyd轻坦克和指挥坦克。当英国在1940年封锁大多数坦克的供应时，在美国Mamon-Herrington公司找到了替代供应商。从那里总共订购了63辆坦克。只有少数坦克从该订单于1942年初交付。


    1937年，RNEI骑兵收到了12辆Alvis-Strausser AC3D装甲车。Alvis-Strausser有四名成员，包括一名驾驶员，受5-10mm装甲保护。其武器包括炮塔上的一挺6.55mm柯特-布朗宁-维克斯机枪、驾驶员的一挺6.55mm机枪以及车内的另一挺6.55mm维克斯机枪。建立了四个排，每排12辆装甲车。1941年，这些排被分配到四个摩托化中队。（Beeldbank
    WW2 - NIOD）；


    1936年至1942年间，RNEI军处于永久的重组状态。


    在人员和装备方面，一个RNEI步兵团在大多数点上与与日本对应部队相当。然而，RNEI军在掷击队营和炮兵团方面明显要弱得多（见表3）。RNEI军和日本陆军炮兵团的规模差异不大。机动炮兵步兵配备了24门7.5cm火炮和12门10.5cm炮。在坦克方面，日本占占优势。与荷兰军相比，日本人平均拥有17辆维克斯利-Carden-Loyd轻坦克。荷兰人拥有36辆Marmon-Herrington坦克。


    ### 表3：比较


    | 兵力 | RNEI军 | 日本陆军 |

    | :--- | :--- | :--- |

    | 马匹 | 3,843 (2,719) | 3,687 |

    | 步枪 | 710 (203) | 408 |

