    On 22 February 1942, the RNE General HQ decided to adjust the operation plan for
    Java in the absence of further Allied support. This was a week before the Japanese
    landings on Java. In order to achieve some success against the superior numbers
    of Japanese troops, it was decided to concentrate on West Java with the simultaneous
    formation of a strategic reserve. The transfer of troops from East Java was vetoed
    by the governor general. The Commander of the Navy found the Surabaya fleet base
    indispensable for supporting the navy. Central Java, however, was abandoned. With
    the 3rd Division in East Java, a certain fragmentation of forces remained.


    The decision had repercussions on command lines and troop positions in West and
    Central. In West Java, the area of operations of 1st Division was reorganized
    into separate commands: West Group, Bandung Group and East Group. A separate East
    Group command and 3rd Division (East Java) consisted of an infantry regiment with
    support weapons. The 2nd Infantry Regiment became the strategic reserve for West
    Java with the 1st Mountain Artillery Battalion. To cope with these changes in
    the operational plan, the necessary troops were moved from Central to West Java
    to their new and unfamiliar operating areas. The Japanese offensive against Java
    had never erupted in all its intensity.


