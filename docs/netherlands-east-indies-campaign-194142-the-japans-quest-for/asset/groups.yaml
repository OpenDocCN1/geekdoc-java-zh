    (referred to as Ledo in Japanese sources). On 28 December 1941, the Southern Army
    ordered the Kawaguchi Detachment to prepare for the capture of this base. With
    the chagrin of the Southern Army, however Kawaguchi saw little point in an operation
    against Singkawang II.


    On 6 January 1942, the announced leadership of the Southern Army ordered Kawaguchi
    to conquer Singkawang as soon as possible.


    By the end of January 1942, the Kawaguchi Detachment had begun a large movement.
    Overland, a force moved towards Singkawang and captured the thoroughly destroyed
    airfield on 27 January 1942. A second force moved in improved transport and landed
    successfully in four locations across the west coast. The RNEI West Borneo Battalion,
    with a strength of approximately 1,000 men and arguably compromised morale, was
    reinforced with the 2nd Battalion, 15th Punjab Regiment of the British Indian
    Army, that had been withdrawn from Kawaguchi with a remaining strength of 783
    men. This force could only slow the Singkawang advance. After the general capitulation
    in March 1942, the NEI troops surrendered. The 2nd Battalion, 15th Punjab Regiment
    withdrew to South Borneo, and then later surrendered on 31 March. Japanese losses
    were 19 men killed, two fatally injured and 30 wounded in action. They reported
    270 killed and 182 prisoners of war.


    Due to the destruction, the wet ground and long-destroyed supply route over land,
    Singkawang II could not be used for the landing operation on Java. The JNN 22nd
    Air Florilla therefore transferred its headquarters to Kuching on 8 February 1942.
    Due to the poor conditions at Kuching, aircraft could not be fuelled with a full
    load. This made carrying out air strikes on Java difficult.


    With the loss of Singkawang II, Manggarat at Balikpapan, Kendari II and the elimination
    of Samarinda II, the second line of airfields had been broken.


    ![](img/52135db0eb5e64e74130266a9290cbf8_49_0.png)


    Kendari Airfield on Sulawesi was described as one of the best airfields in the
    Indonesian archipelago; it had three runways (1000m by 600m), and was easy to
    extend. Unlike other airfields, it could be put use immediately. The airfield
    was far from the coast, lying 25km. On 27 February 1942, the 21st Air Florilla
    HQ moved to the airfield. Kendari provided an important base for operations against
    Ambon and Timor, thus against the Java-Australia line of communications. This
    picture was taken in 1947 (Leiden University Libraries, CC BY 4.0)


    # AMBON


    Ambon is an irregularly shaped island with a long coastline and a small surface
    of 716km². It consists of two large masses, Hitu and Litimour, separated by a
    large inner bay. It has low and medium mountains peaks rising to 460m and 1,000m.
    These are very steep and densely covered with secondary forest. There are few
    roads outside built-areas, only animal tracks and footpaths.


    After 1936, Ambon was developed into an auxiliary supply base for the Royal Netherlands
    Navy. The island was centrally located in the eastern part of the Indonesian archipelago.
    The inner bay provided a sheltered harbour area. It had two airfields: Halong
    Naval Base and Aaha Field with a 1,700-long concrete runway.


    The garrison consisted of the Moluccas Garrison Battalion and the 4th Coastal
    and AA Artillery Company. The Garrison Battalion was made up of a headquarters,
    three companies, a machine-gun company, a korverband (short service) company,
    a (European) militia company, a Veteran Reserve'
