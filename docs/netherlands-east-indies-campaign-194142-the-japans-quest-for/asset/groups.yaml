    卡里加提机场（Kalidjati Airfield）是主要的军事航空作战基地之一。1942年，ABDA航空将两个中队连接至卡里加提：英国皇家空军第8（轰炸机）中队和英国皇家空军第1（侦察）中队。荷兰集团也从该机场执行防御任务。地面防御由第49轻防空团（英国皇家空军）和来自第3防空团的部队提供。在日军登陆当天早晨，英国皇家空军陆军第3团被第6重轰炸机团（英国皇家空军）第12炮队取代，该队与荷兰荷属东印度（NEI）部队共同部署执行地面防御，以撤离机场。然而，英国人的行动实在太慢了。这张机场照片拍摄于1930年至1942年间。到1942年，该机场已扩建，包含了照片底部湖泊旁的两条跑道。右侧是通往苏邦（Subang）的方向，即日军从该方向进攻机场。（林登大学图书馆，KITLV
    49427）


    该市是一个重要的十字路口。部队于12:30向南朝兰卡斯比特滕（Rangkasbiteng）移动。位于兰卡斯比特滕的N1分队由第2步团第10营和两辆装甲车组成，失败了。他们仓忙撤退，未能实现预期的阻击效果。福岛分队也登陆了梅拉克（Merak）。该队由第4步团（减员后）组成。他们通过齐朱翁河（Cijung
    River）奇袭了卡里马贾（Kalimajar）的桥梁。佐藤（Sato）分队由第29步团组成，位于万丹湾（Bantam Bay）。


    对于西部指挥官希林将（Major-General Schilling）来说，万丹湾的登陆完全令他意外。日军沿南方路线的推进速度远快于预期。从色浪（Serang）到雅加达和波哥（Bogor）的两条路分叉。沿两条路线推进只会增加敌方进攻轴之间的距离。日军的快速推进进一步拉开了这段距离。根据希林的说法，这提供了一个取得局部性胜利的机会。他决定集中力量对抗这一南方进攻轴。然而，由于卡里加提形势的发展，他不得不取消了反击。


    庄司（Shoji）分队在3月04:30之前，在轻巡洋舰和驱逐舰的掩护下，从运输舰登陆在埃雷塔恩（Eretan）。庄司并没有使用步兵抢占滩头，而是部署了坦克和卡车上岸。水松部队（Wakamatsuki
    Unit）——由第230步团第2营、坦克团第1连（缺少部分兵员，由95式甲号轻坦克组成）以及运输连组成——登陆并立即向卡里加提冲去。枝仓突击队（Egashira
    Raading Unit，第230步团第1营）被负责占领锡塔鲁河（Citarum River）大桥。小野（Ono）部队必须保卫登陆区，并作为分队的预备队。但并未成功。早晨，空袭袭击了登陆滩头和船只。日军损失了约100人。由辅助水上机“海洋丸号”（Maruanyoanyo）和“上川号”四架水上飞机提供的空中覆盖被击退。


    在前往机场的途中，水松部队应对了几个由常规步兵排组成的荷属东印度卫军侦察队、民卫队以及卡里加提的一处临时路障。道路是畅通的。卡里加提机场的驻守部队措手不及。就在当天早晨，地面防御由第6重轰炸机团第12炮队接管。


