    all, the action came too late. The Japanese troops had already reached their ground
    objectives.


    # TIMOR


    The island of Timor was politically divided into Dutch and Portuguese parts. The
    eastern part was Portuguese and its capital was Dilli. The western part was Dutch,
    with a small Portuguese enclave on the north-west coast, and its capital was Kupang.
    The island has a length of 476km and 102km wide. it is very mountainous and covered
    with tropical forests. The road network was limited. In the Dutch part, one main
    connecting road (4-5m wide) ran from Kupang to the Portuguese border. The roadside
    terrain was unsuitable for motor vehicles except coral and swamps. Penfoei Airfield
    was located about 4km north-east of Kupang.


    > HMT Orcades arrived from the Middle with 3,301 troops of the Australian 7th
    Division in Tanj on 16 February 1942. Only part of the division disembarked on
    18 February: General Wav planned to use them for airfield. The troops stayed here
    on the gangplank of HMT Orcades until the two soldiers in the foreground joined
    with other Australian units and troops. The Orcades departed on 21 March as Convoy
    SJ 6 (Colombo Colombo). On 10 October 1942, the Orcades were sunk by a German
    submarine. (Australian War Memorial)


