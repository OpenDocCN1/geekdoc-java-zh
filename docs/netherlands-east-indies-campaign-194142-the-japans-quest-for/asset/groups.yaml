    On the roads leading from West Java to Jakarta, on all access roads linking the
    Priangan Plateau with the city of Bandung, on the north-south roads in the narrow
    part of Java between Cirebon and Semarang and on the roads leading to Surabaya,
    anti-tank defences were well suited for an all-round defence. An extended position
    was constructed around Surabaya. Secondly, the mobile defence of the aforementioned-key
    points would be courted by four regiments with auxiliary weapons. Relying on local
    defences, the mobile forces would operate as effectively as possible and defend
    the key points with counter-attacks against any enemy troops that landed.


    After 1940, the system of direct coastal defence was expanded by adding artillery
    and coastal positions at the ports of Semarang, Pekalongan and Tegal. However,
    only limited resources could be made available for this.


    On Java, it was also planned to execute guerrilla warfare after defeat in a conventional
    battle. However few preparations were made for this.


    # ALLIES


    # Staff conferences 1940–41


    As the threat from Japan increased, so did the Western Powers'' need for mutual
    consultation. At the end of 1940 and 1941, this resulted in Anglo-Dutch, Dutch-American
    and Anglo-Dutch-Australian and multinational conferences in Singapore, Jakarta
    and Manila. These conferences were limited to military-level discussions. The
    United States was neutral and was unwilling or unable to make any concrete commitments.
    Great Britain and the Netherlands did not guarantee to come to the aid of the
    Netherlands Indies in the event of a Japanese attack. The Netherlands itself followed
    a neutral course in Asia after 1940. All explains why the Western Powers failed
    to reach a political agreement.


    At the staff conferences, agreements were made the Western Powers planned a military
    operational level in the event of a Japanese attack primary defensive operations
    in the Far East with a lack of maritime resources. Two simultaneous Japanese large-scale
    operations were considered unlikely. Four scenarios were identified for Japan.
    Under Scenario B, the British would receive military support from the Dutch following
    an attack on Malaya. The Dutch underlined the strategic importance of Singapore
    and made naval and air forces available for its defence. The Military Aviation
    Service would supply a group of three bomber squadrons (27 aircraft) and one fighter
    squadron, while the Royal Netherlands Navy made to six submarines available for
    this purpose. The Dutch surface fleet would be for convoy protection to Borneo
    and the Netherlands East Indies. It was agreed that, in order to deny the Japanese
    access to Borneo, North Borneo, North Sulawesi and Ambon would be held. Against
    these Dutch commitments, Australia stated that they would supply an air force
    and army units for Ambon and Timor.


    A joint and multinational headquarters was not set up. At most, liaison officers
    were exchanged. There was no question of large-scale multinational exercises.


