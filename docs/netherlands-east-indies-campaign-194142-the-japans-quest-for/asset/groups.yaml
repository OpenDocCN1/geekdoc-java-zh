  mdcn: '

    南苏门腊由巨胆和占碑领地司令部防御。该司令部由一个地区总部、下辖六连的巨胆和占碑驻守营团、一个VIB爆破轻营团、巨胆市守卫队和日本城镇组成。为了防御油库设施，领地部队增援了一个机枪连和一个由八门7.5厘米火炮和两门4厘米防空炮组成的分队。驻守队还有五辆装甲运兵车：两辆在巨胆，一辆在另一处。总人数为1,300人。指挥官是L.N.W.
    Vogelesang中校。


    万达兰榜（Oosthaven），南苏门腊。1942年2月14日，日本军进攻巨胆，来自中东的第一批地面部队增援抵达Oosthaven。一辆MK V轻型坦克摧毁并压塌了建筑。1942年2月15日傍晚晚分，收到命令重新装登第3皇家骑兵团团。该部队在行动前作为“黑力量”（Blackforce）的一部分被运往码头。（澳大利亚战争纪念馆）


    从1942年1月16日起，巨胆发展成为一个主要的英国基地。轰炸机被重组为第225（轰炸机）群，驻扎巨胆。1942年2月1日，由巨胆团组建了第226（战斗机）群。地面防空得到了以下兵力的增援：第6防空团（皇家陆军）（减员）、来自第35轻防空团（皇家陆军）78炮兵的一个连，以及来自第89轻防空炮（皇家陆军）的一个连。当时第225（轰炸机）群指挥官J.F.
    Hunter空运监担任移动航空指挥官。


    一支规模较小的澳大利亚军军团于1942年1月26日乘坐飞机抵达雅加达。J.D. Lavack中将和他的参谋长Fry准将考察了部署区域。在南苏门腊，他们预计日本军会首先占领Bukity作为前线基地，以获得当地控制权和优势。日本军将派遣伞兵攻击油炼厂。这次伞降行动将与上游河流行动结合。因此，Lavack建议Wavelli立即用一个步兵营加强油炼厂和机场的防御，并向皇家空军（RAF）、澳洲空军（RAAF）和防空炮发放步枪。决定派遣一个步兵营到油炼厂，另一个去往邦卡岛和勿里统岛。在澳大利亚增援到达后，巨胆和巨胆的防御将由一个轻型坦克中队加强。


    1942年2月5日，两个REI陆军营团离开爪哇腊前往苏门腊：第10步兵团（减员）移往邦卡，加强后的第12步兵团第2公司前往勿里统。一旦澳大利亚增援到达，这些营团必须返回爪哇腊。第10步兵团总部和两个连驻扎在Prabobuing。第10步兵团（日军）第1连驻扎在巨胆。选择abobuing并不理想，它离保护区域太远，无法进行反击。巨胆临时配备了由征召的印度尼西亚司机驾驶的巴士和卡车。第10步兵团供领地指挥官调遣。


    针对邦卡岛和巨胆的L号行动（Operation L）由于Kuch机场状况不佳以及Singawang II无法使用而推迟了两次。马来西亚的Kuant接了这一角色，但该机场未能及时准备就。最终，L号行动计划于1942年2月15日开始。


    为了消灭苏门腊的盟军空中力量并压制爪哇腊，日本陆军（IJA）和日本海军（IJN）于1942年1月28日在Muntok-巨胆线跨区域展开行动。日本陆军想防守线西部，日本海军想防守线东部。在进行初步攻击后，第3航空师于1942年2月6日至13日在苏门腊上方发起了大规模进攻，以获得当地空优权。第22航空飞行队在邦卡和勿里统上方执行了任务。日本军随后认为大部分盟军飞机已被摧毁。事实证明这为过早了。


    尽管遭受了损失，英国人在日军登陆当天仍有以下可用飞机：24架“风暴”战斗机、31架洛克希德·哈逊轰炸机和36架布里斯托尔·阿姆斯特MK I和MK IV轻型战斗机。许多行动并未成功。巨胆II未被日本军发现为基地，因此可部署战斗机和轰炸机。在整个范围内，不存在日本制权的问题。


    正如Lavack中将预料，L号行动是一次伞降与水陆协同的攻击。日本陆军专门为征服巨胆训练了第1突击团。但第1突击团最终未能投入使用，因为它在1942年1月初的一次航运事故中损失了装备，还爆发了斑疹热疫情。结果是，第2突击团（仍在训练中）被部署。

