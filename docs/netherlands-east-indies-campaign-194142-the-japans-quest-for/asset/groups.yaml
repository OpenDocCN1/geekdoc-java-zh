    W.P. van Veen, and Lieutenant-Colonel P.G. Mantel, Head of Section III (Defence),
    Colonel Bakkers was promoted to major general on 19 February 1942. For office
    work, following the mobilization, the white uniform was replaced with the grey-green
    field uniform. (Museum Nasionalbek)


    ![](img/52135db0eb5e64e74130266a9290cbf8_33_0.png)


    ![](img/52135db0eb5e64e74130266a9290cbf8_33_1.png)


    detachments were disbanded or eventually. The direct defence of airfields was
    organized in a uniform manner following the 1941 mobilization. This comprised
    to three pillboxes with machine guns for covering the airfield and light machine
    guns to counter attacks; three armed personnel carriers (overvaligan) and four
    infantry brigades (each comprising a section of 15 men). The airfields were to
    serve as redoubts. In 1935, field battalions, albeit with modified organizations
    and armaments, were transferred from Java to the oil island of Tarakan (7th Infantry
    Battalion) and the port of Balikpapan (6th Infantry Battalion). If called, these
    sites were to be destroyed to prevent them falling into an attacker''s hands.
    Following that, the infantry were to engage in guerrilla warfare. The numerous
    small, scattered and isolated garrisons had no chance of outside help. They would
    be bypassed or overwhelmed by superior Japanese forces.


    In accordance with the 1927 Principles of Defence, the RNE Army planned to concentrate
    most of the field army on Java following the outbreak of war, in order to defend
    Surabaya naval base in the east of the island. However, in 1941, the RNE Army
    decided to continue of warfare in 1939 and 1940 led the RNE Army to conclude that
    ''rapid operations should be reckoned with, carried out in several places simultaneously,
    whereby one (or more) points by the opponent is being pushed back powerfully and
    quickly with the help of mobilized and mechanized forces.'' The Java Army therefore
    had to consist of deployable units in West, Central and East Java to execute quick,
    decisive counter-attacks. This required extensive motorization and mechanization
    of the field army. Significant reinforcement of territorial forces on the coast
    and inland was deemed necessary for security.


    The RNE Army command identified three key locations in the defence of Java:


    +   1. The army and navy operating bases, namely Bandung and Surabaya;

    2. The capital and seat of government Jakarta, and the port of Tanjung Priok;

    3. Cilacap, the main port on the south coast.


    The defence of Java was based on indirect coastal defence with direct coastal
    defence at the three main ports. The three key points were primarily defended
    by a direct defence and by positions on the possible advance routes.'
