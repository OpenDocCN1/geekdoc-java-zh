  mdcn: '

    位于格蓉（Sungei Gerong）东南部的巴民丹二号（Palembang II）未被日军发现，因此未受攻击。中午时，对伞兵部队的空中支援停止。


    炼油厂采取了全方位防御，每处驻有约150名守军。防御重点是抵御来自穆茂西河的进攻。然而，日军从南方发起了进攻。在岛炼油厂（Pulau Refinery），大部分伞兵降落在西南侧，并在那里建立了阵地。内伊（Nei）防御者收到来自一支配备高空火的英国防空队（20人）的，反击了一次扫荡。城镇守卫队清扫了西部的居住区。下午开始时，加强后的第10营第2公司有部分人员阵亡，第1公司几乎清扫了整个建筑群，加强后的帕拉莫博伊（Paramoeboey）随同他们清理了剩余约15人的小组。日军对格蓉炼油厂的进攻立即被击退。1942年2月14日，伞兵报告称，在加入的32人中，有39名伞兵伤亡。


    沃格莱萨（Vogelesa）中校派遣一个配备两辆装甲车的削减后领地卫队以及加强后的第10营第1公司进攻了巴民丹一号。城镇守卫队被命令在市北建立拦截位置。第10营第1公司的反击直到16:30才开始。第10营在普巴拉奥伊（Prabaraoi）的核心以及岛炼油厂的部分守军当天上午正在演习。因此，响应迟缓。根据澳大利亚第一军团总工程师斯蒂尔（C.S.
    Steele）准将的建议，英国皇家空军（RAF）在穆茂西河渡口组织了RAF人员建立了桥头堡。几次试图抵达巴民丹一号的无协调行动均失败在日军的路障之手。第10营第1公司的反击并不顺利，但在下午清扫了路障。由于计划恢复进攻，他们停滞到了晚上。白天，内伊领地指挥官对战斗局势感到乐观。伞兵对炼油厂的进攻已经失败。尽管巴民丹在经过长时间抵抗后落入日军手中，但计划中的反击很有成功的希望。


    那天早晨，巴民丹的RAF总部出现了混乱。亨特（Hunter）空巡下达了撤离巴民丹并将战斗机移回巴民丹二号的命令。随后他被命令将战斗机移往雅加达。该命令在中午左右被ABDA-AIR撤回，飞机得以返回。巴民丹的RAF总部被清空，并在下午早些重新占领。然而，其发射机和密码已被毁。ABDA司令部（ADBACOM）在海上做出反应。前往南苏门答腊的日军船队于1942年2月9日10日离开甘蓝湾（Cam
    Ran Bay），并在2月13日晨遭到侦察。随后在当天傍晚和第二天早上遭了来自巴民丹的英国飞机的袭击。日军没有损失。盟军先锋。


    巴民丹第10步兵营第2公司的五名门纳多步兵。该公司发动反击并将日军伞兵驱逐出岛炼油厂。背景中可以看到燃烧的炼油厂。士兵配备了M15连发卡宾枪，穿着1937型绿色野战服并配有绑腿，戴着带有后期护颈部的钢盔（用于防晒）。布龙贝克博物馆（Museum
    Bronbeek）。


