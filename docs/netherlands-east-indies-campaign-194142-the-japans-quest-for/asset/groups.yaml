    expected. The mountain plains of the south-east coast were defended by three positions
    manned with semi-trained Indonesian militia sections. In view of the terrain,
    the NEI-Australian plan was mainly defensive in nature.


    When it became clear on 30 January 1942 that the Japanese would land in the south,
    Kapitz expected it to take place at Passo. He moved the centre of gravity of the
    defence to the position with three companies, the machine-gun company and a militia
    section. This position was worth Ambon City on the isthmus between Hitu and Lautim.
    With this, Kapitz increased the distance from Gulf Force in the south. The Allied
    forces further fragmented by this, could be defeated piecemeal by any powerful
    opponent.


    The Eastern Task Unit and the Air Force of the Southern Task Force carried out
    the attack on Ambon. The 2nd Carrier Division was placed under the command of
    the Air Unit. It was a considerable force. Between 0240 and 0520hrs on Saturday,
    31 January 1942, Japan''s Eastern Detachment (fo Detachment), consisting of the
    228th Infantry Regiment, 38th Division, landed from Hong Kong via Davao on the
    undef southeast coast of Ambon. This threatened the rear of the heavily fortified
    bay at Ambon. After the successful landing, the left unit, the main force, crossed
    the mountain ridge in two parallel columns under jungle heavy rainfall and a stormy
    westerly wind (Beaufort Force 8). The weather


