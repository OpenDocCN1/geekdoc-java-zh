  mdcn: "\n这些澳大利亚部队是全志愿性质的第二澳大利亚帝国陆军（2nd AIF）的一部分。在荷属东印度群岛的部署期间，他们缺乏重武器。此外，他们也不具备丛林战的装备。士兵们穿着短裤，这在热带地区植被茂密的地形中执行任务并不合适。膝盖和小腿的擦伤和割伤导致了热带疮。预防措施几乎不为人知。结果是发病率极高，战斗力下降。与当地荷属东印度海军（RNEI）指挥官的关系也不尽如人。\n\
    \n1942年2月，由爪哇岛的澳大利亚部队和溃散士兵组成了一支临时步兵旅：“战场旅”。A.S. 布莱克恩准将将三个步兵营（约2,000人）重新组编，并增援了美国第231野战炮兵团的两个连以及英国第3国王皇家骑兵团的第B连，后者配备了Mk\
    \ VI型轻型坦克。这些营团仅配备轻型步兵武器，拥有三门弹药储备有限的迫击炮和反坦克步枪。战场旅缺乏反坦克炮和反坦克地雷，还缺少野战救护。相比之下，作为该部队核心的一支英国连曾在叙利亚获得过战斗经验。\n\
    \n直到新加坡陷落前不久，英国才开始派遣部队。荷属东印度群岛的英军大部分是从马来西亚撤回的部队增援。由于日本军穿过马来西亚并占据了新加坡附近的机场，英国皇家空军（RAF）及其中队于1942年6月16日起撤回至苏门答腊和爪哇。英国防空炮被部署用于地面防御。\n\
    \n在失去苏门答腊后，剩余的英军进行了重组。他们由根据西小组（West Group）或BRITAR及侦察小组（Recc Group）划分的英国第16防空团以及第3国王皇家骑兵团第B连组成。2月月底，四个配备了雷达装置的空军部实验站（AMES）单位投入了运行。2月下旬，英国皇家海军为联合部队贡献了力量。\n\
    \n美国提供了美国空军远东军（FEAF），而亚洲舰队撤离了菲律宾。FEAF首先撤回至澳大利亚北部的达文，但随后在12月部署到爪哇。FEAF最终由配备现代机群的第5轰炸司令部和拦截司令部组成。拦截司令部部署在东爪哇地区。\n\
    \n亚洲舰队的舰只成功参与了该群岛的海上防御。1941年1月23和24日，第10巡逻队从菲律宾撤离，8艘载满美国海军卡塔利娜型飞机的飞往哈龙湾、安汶。\n\n\
    1942年1月11日，第26野战炮兵旅总部和第131野战炮兵团第2营通过美国抵达泗水（Pencabra护队的一部分）。后者是德克萨斯州国民卫队的一个野战炮兵营，于1940年底开始动员。他们满员抵达爪哇，但只有一半的机动运输工具到位，且14挺直属的50口径重机枪全无到位。该部队在离开美国前不久还配备了12门M2A型\
    \ 75毫米牵引炮。这些新火力尚未进行过射击训练。在8套美国SCR-268雷达中，到1942年1月底只有两套处于运行状态。\n\n# 战斗序列\n\n# 日军\n\
