    1942, the majority of Australian prisoners of war at Laha were executed by.


    # MAKASSAR


    The Japanese wanted to take Makassar on Sulawesi and establish it as a base for
    the offensive against Java. The operation was purely a naval affair of the Netherlands
    East Indies was carried out by the 1st Base Unit with air support from the 2nd
    Air Unit. Given the activities of the Allies in the Makassar Strait, this attack
    was not carried out from Menado around the west of Sulawesi, but by Kendari around
    the east and south of Sulawesi. An additional advantage of this clockwise operation
    was the possibility of assigning units from the Ambon operation. The attack was
    scheduled for 9 February 1942. The amphibious landing was conducted by the Sasebo
    Combined SLF.


    In addition to the Celebes and Menado Territorial Command, Makassar also housed
    the Makassar Troops Command. Colonel M. Voeren in control of all troops on Sulawesi,
    but he lacked the means to control the scattered detachments after the Japanese
    landings. The Makassar Troops Command consisted of c. 1,000 men of the Celebes
    and Menado Garrison Battalion. Colonel Voeren based his defence on the Malaya
    campaign. He set the goal of inflicting greater losses as possible and trying
    down enemy units for as long as could be achieved. To this end, he traded the
    generally followed operational concept of direct coastal defence for an intense
    defence: slowing down the enemy to carry out the planned destruction of Mandai
    Airfield, and ending in the defence of the Tjamba position in the mountainous
    interior. The entire plan was defensive.


    The Japanese naval convoy was attacked by submarines. Although one Japanese destroyer
    was damaged and one was sunk, this did not hinder the amphibious landing. At midnight
    Sunday 8–9 February 1942, the Sasebo Combined SLF made an amphibious landing in
    two areas 3km south of Makassar. The city was occupied around noon. The NEI defenders
    succeeded in destroying Mandai Airfield. At the end of the day, the offensive
    phase of the operation had ended for the IJN, leaving only mopping-up operations.
    The IJN claimed to have killed 77 enemy troops and taken 85 prisoners of war.
    Japanese losses were four killed and five injured from the SLF, and five killed
    and six injured on the sunken destroyer.


    The NEI garrison had fallen back on the Tjamba position. The latter was only attacked
    on 27 February 1942, and the following day. The remaining REI army troops melted
    away through desert. In addition, the population had adopted an Anti-Dutch attitude.
    On 7 March 1942, the NEI territorial commander surrendered. Little had come of
    his goal of tying down the Japanese.


