    ### 1942年1月11日


    - 1. 0400，萨巴斯联合特种部队总部及其支援单位和第2萨塞尔布特种部队在门纳多南北（1,800 km）进行两栖登陆。人数处于劣势的NEI部队措手不及，被日军切断。日军占领了机场。

    - 2. 0420，第2萨塞尔布特种部队（1,400 km）在肯马进攻门纳多。来自两个师的一个连的小沿岸小组（120人）在拉多湾（Lado bay）登陆并被日军击退。

    - 3. 0952–1020，第1横须特种部队首次空降以建立营总部信号，第1和第2萨塞尔布部队（134人）位于朗戈安。NEI防守者被日军阻拦并撤回后方。

    - 4. 0945，第1萨塞尔布特种部队用轻型坦克开火，被击退，但NEI利用预设的前方阵地成功实施了拦截。日本伞兵损失惨重，并于1900前撤离机场。

    - 5. 为了封锁通往阿马多（Amado）的路，命令一个连控制阿马多。从门纳多连的一个排撤退。1300，他们到达预设位置准备在1400左右进行阻击战。第2萨塞尔布特种部队撤往阿马多。

    - 6. 在肯马，机动队（两辆装甲车）被派遣支援进攻。他们遭遇了日本侦察队并摧毁敌方。

    - 7. 上午，指挥官从克拉斯（Keras）调动预备队阻止日军推进。两个剩余的连的反击失败。

    - 8. 1300：夺取机场后，第1横须特种部队朝第二个目标——第2萨塞尔布基地前进。

    - 9. 遭遇抵抗，特种部队未能阻止日军推进。1450，卡卡（Kakas）被日本陆军占领。第1横须特种部队的主力撤回机场。


