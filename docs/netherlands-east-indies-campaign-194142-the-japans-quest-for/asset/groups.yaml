    安汶岛位于印度尼西亚群岛东部中心。该岛拥有天然港口和设施完备机场。日军对该岛的进攻包含了陆海联军在两个不同登陆区的联合两栖登陆攻击，最终形成了两项独立行动：日本陆军（IJA）在南部半岛对阵迅速溃败的荷兰殖民部队和更具韧性的澳洲湾击部队；另一项由日本海军（IJN）在北部半岛发动，进攻并最终夺取了拉哈机场。


    ![](img/52135db0eb5e64e74130266a9290cbf8_53_0.png)


    # 事件


    时间采用日本标准时间（JST - UTC+09:00，除非另有说明）。马鲁鹿时间（MCT）为 UTC+08:30。


    ### 1942年1月31日，周六


    - 1. 0240及0250：东侧分遣队从莱蒂莫的软岸进行无阻碍的夜间两栖登陆。快速的夜袭转向帕西（Passi）；通往安汶市的两条山路天气恶劣。

    - 2. 位于鲁通和索伊亚巴塔的荷兰援军击败了日军进攻。

    - 3. 0130：加强后的第一陆战战斗部队（SLF，约1000人）在霍利塞进行两栖登陆。日军渗透了第四连。驻守的荷兰人（加强后）击退了日军并守卫了阵地。

    - 4. 0320：荷兰在霍利塞的进攻结束，登陆完成。荷兰分遣队撤退并在前进线上采取行动。

    - 5. 0800 (MCT)：荷兰援军到达鲁通和索伊亚巴塔，但日军发起了反击；卡普斯塔中校击退了援军。

    - 6. 0730 (MCT)：日军对左翼发起的夜间进攻成功，侧击了鲁通的渗透并占领了霍利塞东南部翼。荷兰的反击未取得进展，日军阵地被占领。

    - 7. 在大雨中向南推进，第一陆战战斗部队遭到来自拉哈的第二第一陆战战斗部队和第3团第10连的猛烈进攻。

    - 8. 1700：日军左翼受到安汶市的攻击。

    - 9. 第22步兵团第3营第10连被派往北侧高地包围该事件现场。


    ### 1942年2月1日，周日


    - 1. 0130：卡普斯塔中校及其阵地上的荷兰部队加强了西南方向的防御，但在白天阵地被击退。

    - 2. 1110：日军左翼从安汶市向南推。。澳洲湾击部队。


    ### 1942年2月2日，周二


    - 1. 0220：日军第二连成功渗透了第21团第2营B、C连之间的东侧防线，以及澳洲湾击部队的后勤供应。

    - 2. 1200：日军对拉哈的进攻由第21团营部、D连以及澳洲湾击部队的后勤部门负责防御。

    - 3. 斯科特中校；澳洲湾击部队正确判断马尔·荷兰人并未叛日。他下令从安汶撤退到En。

    - 4. 0630：东侧分遣队遭到第15师的反击，开始清理区域内的密集水雷。11号和12号扫雷艇受损，损失了2艘。

    - 5. 1800：日军由整个第一陆战战斗部队发动进攻，突破了澳洲人的防御。061时，在澳洲第1师撤退后，机场被占领。


