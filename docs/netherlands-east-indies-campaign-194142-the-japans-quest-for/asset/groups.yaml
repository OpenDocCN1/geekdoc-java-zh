    | 中机枪 | - | 36 |

    | 重机枪 | - | 9 |

    | 机关炮或反坦克 | 24 | 6 |

    | 反坦克 | 6 | 6 |

    | 步兵团级 | 4 | - |

    | 注：括号内的数字为第2师。 | |


    荷兰属东印度。曾计划通过战列、巡洋舰等加强海军，但未被实施。1941年，荷兰属东印度拥有以下舰只：两艘巡洋舰、一艘驱逐队队长、七艘驱逐舰。海军航空队（Marinevaartdienst）拥有59架水上飞机（多尼Do24和固民PBY卡提纳）和8架战术侦察机。


    针对外敌的荷兰属东印度殖民地防御存在结构性弱点。


    # 盟军


    根据1941年2月英荷澳参谋会议的协议，并记录在1941年11月12日的《海军空军部署计划》（PLENAPS）中，战斗爆发后，澳大利亚向荷兰属东印度的望汶和提摩尔岛派遣了部队。澳大利亚空军第13中队在望汶和布鲁岛驻扎了轻型轰炸机和海岸侦察飞机。提摩尔的Penfoe机场驻扎了来自第2中队的飞行队。出于安全考虑，从澳大利亚陆军8师第23步兵旅组成了三个营级：拉克部队（负责拉巴尔、新不列颠）、海湾部队（望汶）和雀兵部队（提摩尔）。

