    演变成了联盟内部的防御斗争。然而，这对于这些盟友并没有影响。同盟国内部及彼此之间的利益并不是平行的。英国和美国在战争的这一阶段也太弱了，无法减缓日本人的进攻，更不用说停止它。战争爆发仅一个月后，才建立了一个联合（多国）司令部。这太晚了。在作战上，利用水平屏障进行间接防御的概念失败了。军事航空队的轰炸机和战斗机太少，无法成功实施。水平屏障对舰只也不起奏效。日本人对荷兰荷军（Nei）取得了战术奇袭。在安汶汶岛和提汶岛，他们在本不宜登陆的岸边进行了两栖登陆。


    ![](img/52135db0eb5e64e74130266a9290cbf8_93_0.png)


    这四处荷兰荷军静态海岸屏障中的位于塔拉干（Tarakan）半岛的西南岸；每处有两道屏障：3  7.5cm L40 炮和 4 x 12cm L40 的 Karosengi
    炮，用于守卫前线前的雷障。这些屏障部分包含了从 2010 年缴获的大炮，在 Karosengi 屏障的混凝土底座上显示出一门生锈的快速射击 12cm L40/2
    号炮。该炮带有带装甲盾的转动座。它是由克鲁伯在 1901 年制造的海军炮。该炮由一名荷兰荷军炮手、一名助手和弹药携带员操作（私人收藏）。


    在战术上，激进且机动的日本人将荷兰荷军推向了错误的轨道。制空权让荷兰荷军部队陷入瘫痪。当飞机接近时，部队寻找掩体并长时间停留。特别是印尼籍成分对荷兰荷军的意愿不足，荷兰荷军（REI
    Army）在军事能力方面进行着心理战。战斗情报往往匮乏。由于日本攻击的强度和方向未知，荷兰荷军在进攻时陷入了困难。计划和协调非常糟糕。结果是反击是以碎片化的方式进行的，且力量过弱。在第
    2 步团和 Teerin 组的反击中，按照规则，当敌人处于火炮射程——15公里内时才开始推进优势。而荷兰荷军由于偏离了目标，必须在高温下通过战斗阵型在艰难的地形中行军数小时。结果是进攻部队的兵员损失和精疲力竭——而这一切都是面对敌方优势的情况下。澳大利亚少
    way J.H. Brown 以一种犹豫且支破碎的方式指出了 1941 年 11 月的缺点：


    “没有准备任何协调的火力计划，营团指挥官也没有制定任何计划，他们向前移动约一英里，而且距离前线还很远。人的印象是，攻击缺乏高层的动力，在实践中将是致命的。”
    Brown 认为主要的弱点在于团级和地区指挥官，他们缺乏实践经验。根据调查结果，澳大利亚军报局长表示：“军队装备良好。他们的训练主要是防御性的，对进攻战术的知识更多是理论性的而非实践。”⁵


    指挥陷入混乱。师指挥官与连级指挥官直接接触，反之亦然，绕过了层级指挥线。


    随着对荷属东印度群岛的征服，日本夺得了梦寐以求的石油生产和炼能力以及其他战略资源。石油方面，荷属东印度岛的油井和设施大部分被毁。日本人被阻止使用它们六个月。日本人还是很快地开始了开采和精炼，尽管没有达到战前的产量数字。丰加腊占了日本航空燃料消耗的
    78% 和原油的 22%。


    表 12：荷属东印度（NEI）石油产量

    | 期间 | 产量（百万吨） | 产量（桶） | 出口日本的百分比 |

    |---|---|---|---|

    | 1942 年 4 月至 1943 年 3 月 | 4 | 29 | 40 |

    | 1943 年 4 月至 1944 年 3 月 | 7 | 51 | 30 |

    | 1944 年 4 月至 1945 年 3 月 | 5.5 | 40 | 14 |

    | 1945 年 4 月至投降 | 1 | 7 | 0 |


    提取和精炼的石油向日本的运输变成了瓶颈。1939 年，日本油船队由 38 艘船组成，总容量为 3124 万桶。这少于年度进口量的 10%。石油主要通过其他国家的船运输。这对日本面临了一个几乎无法解决的问题。美国的进攻和飞机攻击对日本油船队造成了破坏。日本结束战争，再次面临燃料极端短缺！


    随着日本战败，荷属东印度在 1942 年 3 月 8 日瓦解。随后是三年的严占。荷属东印度的影响力几乎完全归零。欧洲战俘部分被用于机场的建设，例如在弗勒斯岛、缅甸和苏门答腊的铁路线上。在
    42,233 名欧洲战俘中，有 8,200 人死亡（19.4%）。欧洲人被押在民营中，估计有 100,000 人。其中 16,820 人死亡。留在营外的欧洲人约
    120,000 人。日本人被迎接为解放者，对印尼人造成了 250 万人的死亡。日本人雇用了大量临时工人 *romusha*（强迫工人）。估计有 160,000
    人被部署在爪哇岛之外。在此过程中许多人死亡。日本占领政策是印尼独立运动的加速器。1944 年 9 月，日本宣布不久将给予独立。然而，1945 年 8 月，它更进了一，承诺独立。日本投降后两天，印尼领袖哈塔和苏加诺采取了主动，在
    1945 年 8 月 17 日宣布独立。荷兰承认这一点又过了四年。


