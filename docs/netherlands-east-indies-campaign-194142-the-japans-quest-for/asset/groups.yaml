    ## 左翼


    亚瑟·塞福斯·布莱肯（Arthur Seforth Blackburn, 1892–1960）是一位维多利亚十字勋获得者。他在爪哇指挥一支名为“黑力”的战斗部队。布莱肯出生于澳大利亚。他在第一次世界大战期间作为澳大利亚帝国军（AIF）军官在加里富岛和西线战斗，并在那里赢得了维多利亚十字勋。他于
    1917 年因健康原因退役回到澳大利亚回归生活，但保留了兵役身份。1940 年，他以上校的身份回到军队。布莱肯指挥一个机枪营并在叙利亚赢了战斗。1942 年，他成为所有澳大利亚驻印帝国（AII）人员的司令。他在短时间内将自己的指挥部编制成一个步兵旅。他深度部署了部队，并在反包围角色中建立了机动预备队。布莱肯证明是一个充满活力且富有创意的指挥官。


