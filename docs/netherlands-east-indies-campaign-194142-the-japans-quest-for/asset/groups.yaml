    # ALLIED


    Hein ter Poorten (1887–1968) was Chief of the General Staff of the RNEI Army from
    1939 to 1941. After the fatal plane crash that killed his predecessor, he became
    commander of the army in the Netherlands East Indies and headed war on 23 October
    1941. Ter Poorten also became ABDA-ARM (the ABDA land forces) commander with the
    establishment of ABDACOM.


    Ter Poorten was born in Bintenz (Bogor) Java in 1887 and was appointed an officer
    in the artillery of the colonial army in 1908. Ter Poorten was a pioneer in the
    field of military aviation. He was the first Dutch professional officer to obtain
    an international flying licence (1911). From 1915 to 1917, he served with the
    Experimental Flight Unit. Between 1919 and 1922, he attended studies at the Netherlands
    Staff College (Hogere Rijkschool) of the artillery in 1923. In 1939, the former
    Army Commander referred to him as ‘a particular gifted officer, a man of original
    ideas, great gaze and clear insight …’ He was a strong supporter of cooperation
    with the British in Malaysia and Australia, and with the Americans in the Philippines.
    Ter Poorten wanted to hold onto Singapore and retain Java as the main base for
    an Allied counter-offensive.


    Two months after the outbreak of war, the 54-year-old Ter Poorten was exhausted
    and had to seek medical attention. As a result, he was not physically and mentally
    at his best in the period under discussion. From being a general optimist, he
    had no illusions about the chances of victory, and was therefore criticised for
    being negative. The Army Commander said not to have strong leadership during the
    fighting. He heavily depended on his chief of staff, Colonel (later Major-General)
    Rudolf Bakkers.


    Relations with the NEI governor and commander-in-chief Jhr. Tjarda van Starsenburg,
