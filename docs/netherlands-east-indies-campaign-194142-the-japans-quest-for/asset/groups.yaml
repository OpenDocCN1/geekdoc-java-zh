    # THE NEI MOBILE UNITS ATTACK SUBANG,2 MARCH 1942 (PP. 78-79)


    On the first day of the Japanese landing on Java, the Shoji Detachment Kalidadjati
    Airfield. The NEI Army responded with various counter-attacks, one of which was
    by a team of tanks and armoured infantry with artillery support. Its 2nd Battalion
    was to the north and its HQ at Kalidadjati. The 1st Battalion (reduced to half)
    and 6th Company moved to the site. At Subang, Colonel Shoji''s HQ was secured
    by 4th Company, one AT gun section and two MGs (100 men in total equipped with
    a mountain gun, an anti-tank gun and two MGs).


    On Monday 2 March 1942, at 0810h (Java Time), the NEI Mobile Unit, commanded by
    Captain J.G. Vast, attacked Subang was made up of its HQ, a reconnaissance section,
    a tank company, one AT gun section and a supply train. It was reinforced with
    the 2nd Mountain Artillery Battalion. What followed was the first successful attack
    in Dutch East military history.


    This scene shows the moments after the attacking NEI armoured column formed its
    way through a road roadblock out of Subang. The same platoon was pinned down in
    a fight with Japanese defenses. We are seen here by the Japanese to block the
    road, riddled by holes (no two busted aside) carts (2). The Dutch Harrington armoured
    car III that the cable tries left was overrun on the right of the road (3). The
    tank platoon (comprising several Harrington CLTS 4A tanks) has advanced little
    fire (4) and the road is pushing towards Subang. On either side of the road, Japanese
    troops have taken up positions in civil build


    air-raid trenches, ditches, inside the houses and behind trees (5). They have
    opened fire on the following NEI infantry as they disembark from the APCs (6).
    The Ambonese 1st platoon infantry moved to the left of the road (7), which was
    the Menadonese 2nd platoon deployed to the right (8).


    The company commander is standing in the road with a MG gun in a forward position
    camouflaged with a net has suffered a firing malfunction (10). The NEI guns have
    taken up position on the road (11).


    Although the Japanese nearly completely surrounded, the Mobile Unit failed to
    exploit this success. The tanks had to fight in a single file in a built-up area.
