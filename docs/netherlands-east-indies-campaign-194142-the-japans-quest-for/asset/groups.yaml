    # THE CAMPAIGN


    # PHASE I OPERATIONS


    On 7/8 December 1941, Japan launched Operation A-Go with a simultaneous, broad-front
    offensive against assets of the United States and Great Britain. Although not
    directly attacked, the Netherlands declared war on Japan on 8 December 1941. In
    accordance with the agreements at the staff conferences, the NEI Military Aviation
    Service moved an aircraft craft (wing) and a squadron of fighters to Malaya. The
    Royal Netherlands Navy dispatched a light cruiser and submarines. In addition
    to the significant contribution of the Military Aviation Service and the RNEI
    Army sent four brigades (equivalent to sections) of the Marechaussee Corps, an
    infantry unit from Aceh specializing in in-guerrilla operations. They deployed
    the brigade in Malaya January and February 1942. Its strength was c. 142 men,
    including the Indonesian posters. After some successful actions, part of the detachment
    returned to Sumatra in March 1942.


    After the landings in Sian and northern Malaya, shipping became available for
    Operation B; the conquest of Miri and on (Kuching) Labondo on 16 December 1941
    and on 24 December 1941. The RNEI Army saw this as a serious threat and responded
    with bombing by the Military Aviation Service. The Royal Netherlands Navy deployed
    submarines against the Japanese ambitious operations at Kuching. These attacks
    inflicted considerable damage, but to halt the Japanese advance.


    Davao, a port in Mindanao in the Philippines, was occupied on 20 December 1941,
    with Jolo following on 25 December 1941. With the occupation of Kuching, Davao
    and Jolo, the bases for the attack on the Netherlands East Indies were in Japanese
    hands. Instead of the initially planned Palau, the favourable located Davao became
    the assembly point for Operation H. While the operations against Malaya and the
    Philippines were still in swing, IJNI switched to Phase II operations, the NEI,
    on 26 December 1941. The oil of Tanjakan off the coast of Borneo and on North
    Sulawesi were the first targets to be attacked.


    The state of the airfields at Kuching, Davao and Jolo turned out to be far worse
    than expected. The naval construction needed more time to prepare these bases.
    Davao and Jolo were only fully available from 8.


    The Japanese Southern Offensive took place during the rainy season with a high-pressure
    system over the Asian mainland and the region-East Monsoon in the Northern Hemisphere
    and the North-West Monsoon in the Southern Hemisphere. The mostly moist air from
    the China Sea and Pacific with heavy rain showers and poor visibility made air
    operations. Hindered flight movements and led to poor radio communications. The
    visibility mostly consisted of tropical jungle. The few large cities in the jungle.
    The road was limited in extreme. Java was an exception. The main island connected
    with a modern road network and with rail and railways.


