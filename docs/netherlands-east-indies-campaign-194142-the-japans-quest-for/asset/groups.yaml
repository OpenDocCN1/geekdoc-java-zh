    ## 极左翼


    H·特尔波滕（H. ter Poorten）中将在 1941 年 10 月初在其继任者去世后被任命为荷属东印度陆（RNEI）司令官，当时他已担任参谋长两年。他在
    1942 年 1 月还成为了 ABDA 空军司令官。由于作战陆地区域分散，该指挥部实际上涵盖的范围很小。指挥负担被证明非常沉重。特尔波滕出现在这张照片中。然而，当日本陆军进攻时，他已经精疲力竭，完全不胜任。特尔波滕穿着
    1941 年 9 月的野服，但袖子上佩戴着短炮兵的章。（私人收藏）


    在最初的讨论中，他希望协商殖民地的划分，并就继续实行民政达成协议。他指责特尔波滕导致失败。


    特尔波滕与总督一同被俘。他于 1945 年 8 月 17 日在中国沈阳获释。他认为自己成了为了 RNEI 和荷属东印度失败的替罪羊。尽管如此，他获得了荣誉退役。他于
    1968 年在荷兰去世。


    鲁道夫·巴克斯斯（Rudolph Bakkers, 1894-1967）是一位欧洲父亲和印度尼西亚母亲的儿子，于 1941 年 10 月 27 日成为 RNEI
    陆军参谋长。巴克斯斯曾在参谋学院学习，并在 1933 年至 1936 年在该学院教学。作为一名印欧人，他在种族主义的殖民社会中过上了辉煌的职业。然而，他也经历了歧视。例如，他没有被邀请代替陆军参加
    ABDACOM 的日常讨论；他是一个不受重视的参谋官。


    47 岁的巴克斯斯被描述为一个素质极高且心心软的人。后者可能阻碍了他做出艰难的决定。战争爆发前妻子的去世在他身上留下了阴影。但巴克斯斯在 1941 年提出了建立一支导向西方、武装且机械化的军队的建议。这些计划显示了远见，但对
    RNEI 陆军来说过于野心勃勃。他的建议总是被陆军司令官接受。


    维杰布兰·席林（Wijibrand Schilling, 1890-1958）从 1941 年 3 月至 1942 年 2 月担任第 1 师和第一军区司令官。席林（1942
    年 1 月时 52 岁）没有在皇家军事学院参加三年的军官课程，而是作为士官接受训练。后来，他参加了为期两年的军官课程。席林过参谋学院，并在 1929 年至
    1935 年间教授战术和地图绘制。他在西爪哇担任参谋和作战职务。因此，他非常熟悉自己的作战区域。快速的推进也让他感到惊讶。然而，他认为针对日本在西爪哇南部轴线可以取得部分成功。


    在这张照片中，W·席林（W. Schilling）少将是一名校。他于 1941 年 4 月 30 日被任命为将。


    这位 52 岁的将是第 1 师/西部小组的司令。他也是一名能干的军官，但他错过了几次晋升。他的名字被特尔波滕作为总参谋长提到的一项资产。由于他拒绝了领导 Kalidajat-Sub
    反攻的邀请，他的职位受到了阻碍。随着1942 年 3 月从普里南根高原撤退，他是西部小组和万加达小组的联合司令。


    从 1945 年获释后，席林担任了几个月的司令官，但再次没有被选中。相反，他成为了荷兰军事博物馆的馆长，军衔中将。1949 年，他被荣誉退役并回到荷兰。（巴克斯）


