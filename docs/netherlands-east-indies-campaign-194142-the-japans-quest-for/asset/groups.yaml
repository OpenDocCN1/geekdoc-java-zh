    网格线每隔5km（3.1英里）所示；见日方文献。1941年12月28日，陆军命令川口部队准备夺取该基地。然而，由于陆军的懊恼，川口部队认为针对辛望二号的行动毫无意义。


    1942年1月6日，陆军领导层命令川口尽快征服辛望。


    到1942年1月底，川口部队开始了大规模移动。陆路部队朝辛望推进，并在1942年1月27日占领了被彻底毁的机场。第二支部队乘坐改进后的运输工具成功在沿岸的四个地点登陆。荷属西婆罗洲营人数约1000人且士气受挫，由英国印度军第15旁遮团第2营加强，该部队从川口撤出剩余783人。这支部队只能减慢辛望的推进。1942年3月大投降后，NEI部队投降。第15旁遮团第2营撤往南婆罗洲，随后于3月31日投降。日本损失为19人死亡，2人重伤，30人受伤。他们报告有270人死亡182战俘。


    由于破坏、地面潮湿以及长期中断的陆路供应线，辛望二号无法用于爪哇的登陆行动。因此，日本海军第22航空队于1942年2月8日将总部迁至古井。由于古井条件恶劣，飞机无法加满燃油。这使得对爪哇进行空袭变得困难。


    随着辛望二号、巴里卡板的曼加拉、肯达里二号以及萨马林达二号的丢失，第二线机场已被打破。


    ![](img/52135db0eb5e64e74130266a9290cbf8_49_0.png)


    苏门腊岛上的肯达里机场被描述为印尼群岛最好的机场之一；它有三条跑道（1000米x600米），容易扩展。与其他机场不同，它可以立即投入使用。机场离岸25公里。1942年2月27日，第21航空队移动到该机场。肯达里为针对安汶和提莫尔的行动提供了重要基地，从而切断了爪哇-澳大利亚的通信线。这张照片拍摄于1947年（莱顿大学图书馆，CC
    BY 4.0）


    ## 安汶


    安汶岛是一个形状不规则的岛屿，海岸线长，面积为716平方公里。它由两个大地块——Hitu和Litimour组成，被一个巨大的内湾隔开。它有中低山峰，高度分别为460米和1000米。这些山非常陡峭，密布着次生森林。建筑区外道路很少，只有动物小径和步行径。


    1936年后，安汶被开发为荷属荷兰海军的辅助供应基地。该岛位于印尼群岛东部中心。内湾提供了避风的港口区域。它有两个机场：哈龙海军基地和阿哈机场（后者有一条1700米长的混凝土跑道）。


    守军由望汶群守军营和第4岸防防空炮连组成。守军营由一个总部、三个连、一个机枪连、一个短期兵连、一个（欧洲）民兵连和一个退伍军预备队组成。


