  - '[PAGE 47]


    # THE JAPANESE ASSAULT ON MENADO,

    11–12 JANUARY 1942


    The Japanese captured Menado Langoan (II) airfield and the seplane base with a
    simultaneous amphibious and airborne assault by naval landing and airborne forces.
    The NEI forces were caught in a pincer movement, from Menado in the west and Kema
    in the east, with Japanese paratroopers attacking the centre near the airfield.
    The scattered and outnumbered NEI forces managed to stall the inland advance of
    the Japanese amphibious forces by delaying from positions. They could not, however,
    prevent them from establishing contact with the paratroopers. The airfield was
    fiercely defended, but fell into Japanese hands after a brief fight. NEI counter-attacks
    lacked coordination, were too weak and failed, whereupon remnants of the garrison
    retreated into the mountains being an ill-fated guerrilla campaign.


    ![](img/52135db0eb5e64e74130266a9290cbf8_47_0.png)


