    taken into account that ‘Japan will turn to the South’.


    The Netherlands East Indies consisted of a chain of many islands. For the defence
    of this archipelago, the preservation of air superiority and control of the sealanes
    was essential. A significant air force and fleet could prevent an enemy from acquiring
    the archipelago and naval bases. The great distances and fragmented shape of the
    archipelago prevented coordinated defence. It gave an attacker with air and naval
    superiority the opportunity to neutralize a strongly defended island by capturing
