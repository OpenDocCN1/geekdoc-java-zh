    # 左上方


    1940年，在 Sukajilang 路的 Ciater 地点建立了一个团级规模的阵地。该阵地位于一片茶园中。一个由木桩和海军炮构成的反坦克障碍被一门位于前沿壕沟的掩堡内的5厘米炮占据。在山谷后方，坡度较高的地方，有两排由壕沟连接的掩堡。该阵地最初建成后一直被忽视，直到1941/42年间才进行了防御。这张颗粒感的照片展示了
    Ciater 掩堡之一，它是这片损毁严重且草木丛生的战地边缘。（公文文件）


    援军到达后，第1步兵团第公司于当晚从阵地撤出。


    在进攻的北轴线上，第2师区域内，佐藤队（Sato Detachment）缩减至仅两个营，于1942年3月5日深夜撤离雅加达。由于撤退的荷属东印度群（NEI）军队，他们在雅加达西侧未遭遇任何抵抗。迅速占领首都让第十六军感到有些意外。在黑力部队（Blackforce）于
    Leuwilang 撤退后，第2师的主力采取包抄战进攻了布加尔（Bogor）。该市于1942年3月6日早晨落入日本人手中。下一个目标是万隆（Bandung）。


    3月6日早晨，水松少佐（Major Wakamatsu）对阵地转移的侧翼发起了进攻。路上的两个连在正在领取面包（并非战斗状态）时感到措手不及。然而，这些连迅速恢复了战斗并击退了两次步兵进攻。第三次攻击得到了
    Subang-Bandung 交汇处三辆日本坦克提供的火炮和机枪火力支持，但这次攻击也被击退了。敌人打破了战斗向右侧撤退。各部队在撤退过程中溃散。尽管没有受到攻击，整个第2步兵团左半部分的一个排在听到第一声枪响后就撤退了。此后，Ciater
    阵地被彻底攻破。但水松并没有追击荷兰军队的撤退。


    # 右上方


    一门位于竹丛中的7.5厘米火炮（山战榴炮/Bergillerie）。它仍带有金属轮子，大部分部件是为充气轮胎设计的。位于 Cisanto 的火炮有一辆卡车运输。由四门炮组成的炮兵在
    Ciater 山口参加了战斗。该山口用于步兵武器。炮兵营被分配给步兵单位。然而，Ciater 的指挥官需要步兵（参考 Beeldboek WO2-NIOD）。


    在这些战斗中，74名士兵被日本人俘。3月6日下午或3月7日早晨，几乎所有人都被日本人处决，只有极少数人从屠杀中幸存。


    6日下午，De Veer 军校（Colonel De Veer）放弃了 Wates 哨所，集中守守 Tollek 的三个交叉路口。日本步兵对三路路口的进攻在1942年3月7日前被击败，Tollek
    路口的部队接到命令撤往万隆（Lembang）。


    在万隆北部，通过第9步兵营、第15步兵营和 De Vries 营（由第2步兵团残部组成）加强了一条防御线。这增加了两个苏门答拉西海岸公司、来自苏门答拉西的驻守兵以及第4步兵。


    ![](img/52135db0eb5e64e74130266a9290cbf8_84_0.png)


