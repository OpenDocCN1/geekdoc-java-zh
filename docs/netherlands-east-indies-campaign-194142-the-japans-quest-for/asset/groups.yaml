    Battalion. On paper it seemed a decent fighting force, but morale was very low
    and its combat value was questionable. Moreover, the NEI Army was showing signs
    of disintegration. With the breakthrough at the Ciater position, the fight seemed
    like it was over.


    Kragan was an ideal landing point with 35km-long beach and major connecting roads
    in the proximity. The vanguard of the Sakaguchi Detachment set foot ashore 6km
    south of Kragan on 1 March 1942 at 0700. The other units, the Matsumoto and Yamamoto
    units, did not land until the following day. Their transport was lost because
    it had been damaged during the invasion of Bali. The Sakaguchi Detachment (the
    Kume Detachment left on) consisted of the 2nd and 3rd Infantry battalions, 4th
    Infantry Regiment, two artillery batteries, an armoured car unit and 2nd Independent
    Company attached. Sakaguchi''s objective was the southern port city of Cilacap,
    the capture of which would cut off the escape route from Jakarta and Bandung.
    In the second phase, it would mop up remaining units in Central Java.


    The NEI Army''s 2nd Division, in Central Java, under General P. Cox, was reduced
