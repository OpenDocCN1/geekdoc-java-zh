    - 18 January: Japanese landing on and conquest of Bali.

    - 19 January: Japanese Shoji Detachment attacks Ciater defensive position.

    - 20 January: Japanese landings on Java.

    - 21 January: Japanese occupation of Surabaya.

    - 22 January: Formation of HQ No. 226 (Fighter) Group (RAF) in Palembang, Sumatra.

