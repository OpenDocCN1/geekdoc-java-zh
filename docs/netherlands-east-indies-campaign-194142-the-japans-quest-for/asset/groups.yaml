    # 1942年2月14日普拉炼油厂内伊的反击（第60–61页）


    对于1942年2月14日在巴民丹的日军（IAI）进攻，营规模的第2突击团只能分配第1公司（兵员较少，99人）。


    由连长中尾（Nakao）中尉率领的美国伞兵于当地时间（南苏门答腊）上午09:30降落在炼油厂的西南侧，那里部分土地位于炼油厂内部。他们成功地在地的油罐后方建立了基地，并在火力下于油罐顶部和炼油厂上平台建立了避难所。


    12:30，穆茂西（Moesi）援军与第2公司会合。他调动了第10步兵营第4公司的两挺机枪（75mm MG）和一门迫击炮（20mm AT）。穆茂西炼油厂形成了由一个机枪排和一个排组成的部队来收复左右侧翼。他的左侧翼由一个城镇守卫排负责。进攻方接触了第10步兵营第33公司，后者将部队加强为三个营。他的总兵力为312人（与城镇守卫队交战）。日军对格蓉炼油厂的进攻立即被击退。1942年2月14日，伞兵报告称，在加入的32人中，有39名伞兵伤亡。


    沃格莱萨中校派遣一个配备两辆装甲车的削减后领地卫队以及加强后的第10营第1公司进攻了巴民丹一号。城镇守卫队被命令在市北建立拦截位置。第10营第1公司的反击直到16:30才开始。第10营在普巴拉奥伊的核心以及岛炼油厂的部分守军当天上午正在演习。因此，响应迟缓。根据澳大利亚第一军团总工程师斯蒂尔（C.S.
    Steele）准将的建议，英国皇家空军（RAF）在穆茂西河渡口组织了RAF人员建立了桥头堡。几次试图抵达巴民丹一号的无协调行动均失败在日军的路障之手。第10营第1公司的反击并不顺利，但在下午清扫了路障。由于计划恢复进攻，他们停滞到了晚上。白天，内伊领地指挥官对战斗局势感到乐观。伞兵对炼油厂的进攻已经失败。尽管巴民丹在经过长时间抵抗后落入日军手中，但计划中的反击很有成功的希望。


    那天早晨，巴民丹的RAF总部出现了混乱。亨特空空巡下达了撤离巴民丹并将战斗机移回巴民丹二号的命令。随后他被命令将战斗机移往雅加达。该命令在中午左右被ABDA-AIR撤回，飞机得以返回。巴民丹的RAF总部被清空，并在下午早些重新占领。然而，其发射机和密码已被毁。ABDA司令部（ADBACOM）在海上做出响应。前往南苏门答腊的日军船队于1942年2月9日10日离开甘蓝湾，并在2月13日晨遭到侦察。随后在当天傍晚和第二天早上遭了来自巴民丹的英国飞机的袭击。日军没有损失。盟军先锋。


    巴民丹第10步兵营第2公司的五名门纳多步兵。该公司发动反击并将日军伞兵驱逐出岛炼油厂。背景中可以看到燃烧的炼油厂。士兵配备了M15连发卡宾枪，穿着1937型绿色野战服并配有绑腿，戴着带有后期护颈部的钢盔（用于防晒）。布龙贝克博物馆（Museum
    Bronbeek）。


    ![](img/52135db0eb5e64e74130266a9290cbf8_60_0.png)


    ![](img/52135db0eb5e64e74130266a9290cbf8_62_0.png)


