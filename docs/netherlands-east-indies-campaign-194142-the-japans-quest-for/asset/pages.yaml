- pgno: 69
  md: 'The next day, at 1024hrs, the second echelon of 250 men from 2nd Company, 3rd
    Yokosuka SLF jumped onto the same drop zone. Leggatt counter-attacked and succeeded
    in recapturing Babaoe. However, the Eastern Detachment''s right attack unit, the
    reinforced 2nd Company, 1st Battalion (206 men), made the main road at the end
    of the day and formed a new roadblock east of Babaoe. Once again, the Australian
    retreat route had cut.


    In the afternoon of 22 February 1942, Sparrow Force managed to finally open the
    road, having attacked several times during the morning. The Japanese vanguard
    from Kupang, however, caught up, followed the next morning by the reinforced 1st
    Battalion, 228th Infantry Regiment with tanks. Lieutenant-Colonel Leggatt was
    forced to surrender.


    Sparrow Force''s combat suffered from declining morale and an increasing death
    rate (30 per cent). Morale declined under air strikes, Japanese successes elsewhere,
    the lack of air support and the knowledge that reinforcements would not be forthcoming.
    Tactically speaking, communication was ''very difficult to maintain in this type
    of country''. Leggatt recognized this issue. Partly for this reason, he wanted
    to fight it out in the open area near Tampiong. He also deployed his troops on
    21 and 22 February 1942 in a fragmented manner, losing valuable time – that Leggatt
    did not have in view of the Japanese advance against this anticipated threat.
    The troops showed a lack of willingness to fight on 20 and 21 February 1942; at
    this stage, they ''were not confident and were apt to withdraw when shots were
    fired in their vicinity''. This could be attributed to a lack of combat experience.
    On 22 February 1942, nervousness resulted in panic. Despite these shortcomings,
    Sparrow Force stood firm. Its casualties amounted to 150 men killed or wounded,
    while 200 were missing. The 3rd Yokosuka SLF suffered 38 killed and 40 to 50 wounded.
    The Eastern Detachment reported 67 killed and 56 wounded. The Japanese imprisoned
    1136 men: 179 British, Australians and 23 Dutch


    At the same time as the attack on Kupang, the Eastern Detachment also attacked
    Dilly, the capital of Portuguese Timor. Dilly had been occupied on 17 December
    1941 by a combined NEI-Australian detachment under Dutch leadership. The RNE Army
    had urged this step to prevent Japan from establishing an air base, from which
    it would have been able to reach the airfield at Makassar and Kendari, directly
    threaten Ambon and Darwin, and the control of communication between the Netherlands
    East Islands and Australia.


    The NEI-Australian expedition consisted of the reinforced Manadonese 3rd Company,
    8th Infantry Battalion from Java, a battery of 7.5cm field guns, a detachment
    of engineers and some service personnel. It was reinforced by six brigades from
    the Kupang Garrison Battalion. The Australians deployed the 2nd Independent Company,
    a command unit (270 men). The Dutch contingent totalled 604 men. The expedition''s
    commander was Lieutenant-Colonel N.L.W. van Straten. The NEI detachment defended
    the post of Dilly and the airfield in positions without depth. As a command unit,
    the 2nd Independent Company was not suited to static defence. It was designated
    as the reserve and located in the mountains 4km south-west of Dilly. One section
    was stationed at the airfield.'
