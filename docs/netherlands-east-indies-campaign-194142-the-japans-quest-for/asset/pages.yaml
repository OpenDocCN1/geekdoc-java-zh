  md: 'south-east of Sunge Gerong, Palembang II, unknown to the Japanese, was therefore
    not attacked. Around noon, air support for the airborne troops ceased.


    The refineries were arranged for all-round defence with a garrison of approximately
    150 men at each them. The focus was on repelling an attack from the Musi River.
    However, the Japanese attack came from the south. At Pulau Refinery, the majority
    of the paratroopers landed on the south-west, while they established themselves
    at the site. The Nei defenders received reinforcements from a British anti-aircraft
    squad (20 men) of AA guns, countered a sweep. The Town guard cleared the residential
    area of the west. At the beginning of the afternoon, the reinforceded 2nd Company,
    10th Battalion killed in action and the 1st Company had almost cleared the complex,
    and the reinforced Paramoeboey with them to mop up the remaining group of about
    15 men. The Japanese attack on Sungei Gerong Refinery was immediately refuted.
    On 14 February 1942, the paratrooper reported losses of 39 paratroopers killed
    in and wounded out of 32 men who joined.


    Lieutenant-Colonel Vogelesa introduced one platoon (reduced) of territorial troops
    in two armoured cars and the reinforced 1st Company, 10th Battalion attacked Palembang
    I. The Town guard was ordered to take up a blocking position north of the city.
    The counter-attack by 1st Company, 10th Battalion started only at 1630hrs. The
    core of 10th Battalion at Prabaraoi and part of Pulau''s garrison was on exercise
    that morning. As a result, the response started late. On the advice of Brigadier
    C.S. Steele, Chief Engineer of Australian I Corps, the RAF organized a bridgehead
    with RAF personnel at the Musi ferry. Several uncoordinated actions to reach Palembang
    I failed the Japanese roadblock. The counter-attack by 1st Company, 10th Battalion
    did not go smoothly, but in the afternoon it cleared the roadblock. With the intent
    of resuming it halted until night, during the day, the Nei territorial commander
    felt optimistic about the course of the battle. The paratrooper attack on the
    refineries had failed. Although Palembang had fallen into Japanese hands after
    lengthy resistance, the planned counterattack stood a good chance of success.


    Confusion registered at RAF HQ Palembang that morning. Air Commodore Hunter gave
    the order to evacuate Palembang and move the fighters back to Palembang II. He
    was then ordered to move the fighter aircraft to Jakarta. This order was revoked
    by ABDA-AIR around noon, and the aircraft returned. RAF HQ in Palembang was cleared,
    and in the early afternoon reoccupied. However, its transmitter and the codes
    had been destroyed. ADBACOM responded at sea. The Japanese convoy coveted for
    South Sumatra left Cam Ran Bay on 9 and 10 February 1942 and was reconnoit on
    the morning of 13 February. It was then attacked by British aircraft from Palembang
    in the evening of the day and the following morning. The Japanese suffered no
    losses. The allied vanguard


    Five Menado riflemen of the 2nd Company, Infantry Battalion at Palembang. The
    company counter-attacked and expelled the Japanese paratroopers from Pulau Refinery.
    In the background, the burning oil refinery was seen. The soldiers were armed
    with the M15 repeating carbine, wearing the green field dress Model 1937 with
    puttees, and the steel helmet with later neck flap (for protection against the
    sun). (Museum Bronbeek)


