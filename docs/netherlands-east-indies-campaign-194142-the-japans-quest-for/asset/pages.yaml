  md: 'to a defensive struggle in an alliance. However, it had no influence over these
    allies. The interests with and between the Allies were not parallel ones. Great
    Britain and the United States were also too weak at this stage of the war to slow
    the Japanese advance, let alone stop it. A combined (multinational) headquarters
    was set up only one month after the breakout of the war. This was too late. Operationally,
    the concept of indirect defense with horizontal barriers failed. The Military
    Aviation Service had too few bombing and combat aircraft to successfully implement
    it. Horizontal barriers were also unsuccessful against ships. The Japanese achieved
    tactical surprise against the Nei. On Ambon and Timor, they made amphibious landings
    on coasts that remained unsuitable.


    ![](img/52135db0eb5e64e74130266a9290cbf8_93_0.png)


    These of the four Nei static coastal barriers were on the south-west coast of
    Tarakan at Peninsula; there were two barriers each of: 3 x 7.5cm L40 and Karosengi
    of 4 x 12cm L40 to guard the mine barriers in front of the Lines Front. The barriers
    were partly including the guns captured from 2010 and showing a rusty, rapid fire
    12cm L40/No. 2 on a concrete foundation of Karosengi Barrier. The gun had a pivot
    mounting with an armoured shield. It was a naval artillery piece made by Kru in
    1901. The gun was operated by a Nei gun commander and an assistant and ammunition
    carriers (Private collection)


    Tactically, the aggressive and mobile Japanese pushed the Nei Army on the wrong
    track. Air superiority was paralyzing the Nei units. When aircraft approached,
    troops sought cover and remained for long periods of time. In particular the Indonesian
    components showed insufficient willingness to the Nei troops and the REI Army
    fought psychologically in terms of military capability. Combat intelligence was
    often lacking. As the strength and direction of Japanese attacks were unknown.
    The REI Army made difficult when attacking. Planning and coordination were poor.
    As a result, counter-attacks took place in a fragmented manner and with forces
    that were too weak. In the counter-attack of the 2nd Infantry Regiment and Teerin
    Group, the advantage to advance was started according to the rules, when the enemy
    was within range of their artillery—15km. As the Nei troops, off the target had
    to advance in battle formation for hours through tough terrain under hot temperatures.
    The result was loss of element and exhaustion among the attacking troops—and all
    in the face of enemy superiority. Australian Major J.H. Brown pointed out in a
    hesitant and fragmented manner. The shortcomings in November 1941:


    “No coordinated fire plan had been prepared nor had any were made by battalion
    commanders had moved forward about a mile and still well before the front line
    were frankly. The impression was that the attack suffered from lack of drive from
    above and would have been fatal in practice.’ Brown saw the main weakness in the
    battalion and regional commanders who lacked practical experience.’ Based on findings,
    the Australian Director of Military Intelligence stated that ‘the army is well
    equipped. Their training is mainly defensive and their knowledge of offensive
    tactics is more theoretical than practical.’15


    Command was chaotic. Division commanders had direct contact with company-level
    commanders and vice versa, bypassing the hierarchical command lines.


    With the conquest of the Netherlands East India, Japan had seized coveted petroleum
    production and refining capacity and other strategic resources. Limits over to
    petroleum, the wells and installations in the Netherlands East Islands had largely
    destroyed. The Japanese were prevented from using them for six months. The Japanese
    managed'
  merge: -1
  img_proc: true
- pgno: 94
  md: 'to start extraction and refining relatively quickly, although pre-war production
    figures were not achieved. Palembang accounted for 78 per cent of Japan''s aviation
    fuel consumption and 22 per cent of crude oil.


    Table 12: Petroleum production in the NEI

    | Period | Production in million tons | Production in barrels | Export to Japan
    in per cent |

    |---|---|---|--|

    | April 1942 to March 1943 | 4 | 29 | 40 |

    | April 1943 to March 1944 | 7 | 51 | 30 |

    | April 1944 to March 1945 | 5.5 | 40 | 14 |

    | April 1945 to January surrender | 1 | 7 | 0 |


    The transport of extracted and refined petroleum to Japan turned out to be a bottleneck.
    In 1939, the Japanese tanker fleet comprised 38 ships with a total capacity of
    3,124 million barrels. That was less than 10 per cent of annual imports. Oil imports
    were largely transported by ships from other countries, ones which Japan came
    into conflict. This presented the country with an almost unsolvable problem.


    The US offensive and aircraft attacks played havoc among the Japanese tanker fleet.
    ''Japan ended continuing the war, again suffering from an extreme shortage of
    fuel!''^{16}


    Alongside the defeat by Japan, the Netherlands East Indies also disintegrated
    on 8 March 1942. Three years of heavy occupation followed. European influence
    in the Netherlands East Indies was almost completely nullified. The prisoners
    of war were partly employed Java for the construction of airfields, for example,
    the island of Flores and railway lines in Burma-Sumatra on Sumatra and mines in
    Japan. Of the 42,233 European prisoners of war taken, 8,200 (19.4 per cent) died.
    The European population was interned in civilian camps. This involved an estimated
    100,000 persons. Of these, 16,820 died. About 120,000 Europeans remained outside
    the camps.


    The Japanese, greeted as liberators, inflicted a heavy toll on Indonesia. Hunger
    is said to have killed 2.5 million Indonesians. Japan employed a large number
    mainly Japanese as workers. Some of these *romusha* (forced labourers) were employed
    on a temporary basis. It is estimated that 160,000 and 220,000 were deployed outside
    Java. Many died in the process.


    The Japanese occupation served as a multiplier for the Indonesian independence
    movement. The occupation policy was not aimed at granting independence within
    the Greater Asian Co-Prosperity Sphere. Indonesia had to be serviceable to the
    Japanese war. Japan gradually changed its attitude as the war changed. In September
    1944, Japan declared that it would grant Indonesia independence in the near future.
    However, in August 1945, it went a step further and promised independence. However,
    on 15 August 1945, Japan forced to surrender, negating further cooperation over
    Indonesian independence.


    Two days after the Japanese capitulation, the Indonesian leaders Mohammad Hatta
    and Sukarno took the initiative, declaring independence on 17 August 1945. It
    would take four more years of negotiation and warfare before the Netherlands recognized
    this.'
