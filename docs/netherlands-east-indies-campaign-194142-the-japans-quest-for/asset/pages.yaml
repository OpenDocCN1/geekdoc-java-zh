- pgno: 66
  md: 'During the fighting at Palembang and also in the retreat, the NEI troops, in
    particular the territorial ones, showed a certain ''reluctance'' to be deployed.
    In the counter-attack at Plains, a platoon of 30 Company, 10th Infantry Battalion
    refused to advance. The latter was thwarted by the failures of the platoon commander.


    South Sumatra was lost in two days. The pincer from the west had closed around
    Java. Within a few days, the pincer from the east would enclose it; the main island
    of the Netherlands East Indies was surrounded and no longer untenable.


    # BALI


    0100hrs on 19 February 1942, the 3rd Battalion (reduced), 1st Formosan Infantry
    Regiment, a mountain artillery section and an independent engineers of the 48th
    Division landed on the south coast of Bali. The 1st Base Unit of the JIN proceeded
    to Tarakan Documents were found there indicating Bali''s airfield was in good
    condition. In addition, the location was extremely favourable. From Bali it was
    not only possible to conduct the air campaign against East Java but also to cut
    off the supply from Australia. The JIN 23rd Air Flotilla then made a strong case
    to include Bali in the operation plan. we to do at the center in Manila on 26
    January 1942.


    Bali was defended by the Projada Corps, an Indonesian battalion-sized unit with
    some European officers and NCOs. The Japanese landing, then corps disintegrated
    under widespread desertion. Pasar airfield fell completely, almost intact, into
    Japanese hands. The 23rd Airfield headquarters was moved from Balikpapan to Bali
    on 26 February 1942.


    ABDACOM reacted with violent raids on the Japanese transport ships during the
    disembarkation of troops and supplies. The Combined Strike Force was also deployed
    against this threat on the eastern flank. It attacked the Japanese landing fleet
    with an unsuccessful hit-and-run attack on the night of 19/20 February 1942. Above
    all, the action came too late. The Japanese troops had already reached their ground
    objectives.


    # TIMOR


    The island of Timor was politically divided into Dutch and Portuguese parts. The
    eastern part was Portuguese and its capital was Dilli. The western part was Dutch,
    with a small Portuguese enclave on the north-west coast, and its capital was Kupang.
    The island has a length of 476km and 102km wide. it is very mountainous and covered
    with tropical forests. The road network was limited. In the Dutch part, one main
    connecting road (4-5m wide) ran from Kupang to the Portuguese border. The roadside
    terrain was unsuitable for motor vehicles except coral and swamps. Penfoei Airfield
    was located about 4km north-east of Kupang.


    > HMT Orcades arrived from the Middle with 3,301 troops of the Australian 7th
    Division in Tanj on 16 February 1942. Only part of the division disembarked on
    18 February: General Wav planned to use them for airfield. The troops stayed here
    on the gangplank of HMT Orcades until the two soldiers in the foreground joined
    with other Australian units and troops. The Orcades departed on 21 March as Convoy
    SJ 6 (Colombo Colombo). On 10 October 1942, the Orcades were sunk by a German
    submarine. (Australian War Memorial)


