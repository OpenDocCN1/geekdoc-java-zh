    # PHASE II OPERATIONS: THE CONQUEST OF THE NEI


    The Empire of Japan had on 8 December 1941 not declared war on the Netherlands.
    It was still attempting to bring the Netherlands East Indies peacefully within
    its sphere of influence as a protectorate, following the Indochina model. However,
    the Netherlands did not respond to this wish. Japan subsequently declared war
    on the Netherlands on 11 January 1942. Operation H, the conquest of the NEI, was
    based on a rapid and methodical advance almost simultaneously over three axes
    towards the


