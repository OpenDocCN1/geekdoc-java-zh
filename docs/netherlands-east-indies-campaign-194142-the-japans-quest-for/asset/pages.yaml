- pgno: 40
  md: 'main island of Java: South Sumatra from the west, through the Makassar Strait
    in the centre and via the Banda Sea from the east. The capture and preparation
    of air bases in South Sumatra, Borneo and Sulawesi was essential for the air operation
    against Java. Ambon and Kupang on Timor to be occupied, to secure the left flank
    of the advance to Java and to sever Allied communications with Australia.


    # TARAKAN


    At the end of December 1941, the IJN started the campaign to eliminate Allied
    power on Tarakan and at Menado. On 4 January 1942, Tarakan Airfield was evacuated
    by the NEI Military Aviation Service six days later. Without an early warning
    system and adequate ground-based defense, the advanced airfield proved to be too
    vulnerable to air attacks. On 26 December 1941, an air strike followed on the
    Tondano bay near North Sulawesi. The naval air base was closed down.


    On 11 January 1942, the Japanese landed simultaneously on Tarakan and at Menado.
    The Sakaguchi Detachment and the 2nd SLF attacked Tarakan. Tarakan was defended
    by the NEI 7th Infantry Battalion, a battalion with reinforced armament, and the
    3rd Coastal and AA Company. The commander, Lieutenant-Colonel S. de Wael, ordered
    the destruction of the oilfields and oil tanks since the strength of the garrison
    was 1,365 men.


    The Japanese landed between midnight and 0430hrs at three points on the virtually
    contested east coast.${12}$ The attack was delayed because the main force landed
    on the wrong beach. Thereafter, the infantry assault dealth to Dutch resistance.
    A night attack managed to penetrate the defence failed to materialize. The REI
    commander considered his defense had been breached and had no reserves to plug
    the gap. The morning of the 12th, the garrison offered to surrender.


    Unaware of the capitulation, the REI Karungi battery sank two Japanese marines,
    the W13 and W14, under fire; 159 soldiers were killed. The IJN subsequently captured
    215 prisoners of the war on the battle on 19 January 1942. The Sakaguchi Detachment
    lost of seven killed and 35 injured. The 2nd SLF reported three injured, and claimed
    to have killed some 300 soldiers of the REI Army, wounded 40 and taken 871 prisoner.
    According to Dutch reports, 33 soldiers did not include the military personnel
    executed on 19 January 1942.


    ![](img/52135db0eb5e64e74130266a9290cbf8_40_0.png)


    ![](img/52135db0eb5e64e74130266a9290cbf8_40_1.png)


    # MENADO


    On the morning of 11 January 1942, the Eastern Attack Unit with the Sasebo Combined
    Base and the 1st Yokosuka SLF conducted an amphibious and airborne


