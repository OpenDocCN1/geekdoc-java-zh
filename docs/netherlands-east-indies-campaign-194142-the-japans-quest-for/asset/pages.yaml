  md: 'On 22 February 1942, the RNE General HQ decided to adjust the operation plan
    for Java in the absence of further Allied support. This was a week before the
    Japanese landings on Java. In order to achieve some success against the superior
    numbers of Japanese troops, it was decided to concentrate on West Java with the
    simultaneous formation of a strategic reserve. The transfer of troops from East
    Java was vetoed by the governor general. The Commander of the Navy found the Surabaya
    fleet base indispensable for supporting the navy. Central Java, however, was abandoned.
    With the 3rd Division in East Java, a certain fragmentation of forces remained.


    The decision had repercussions on command lines and troop positions in West and
    Central. In West Java, the area of operations of 1st Division was reorganized
    into separate commands: West Group, Bandung Group and East Group. A separate East
    Group command and 3rd Division (East Java) consisted of an infantry regiment with
    support weapons. The 2nd Infantry Regiment became the strategic reserve for West
    Java with the 1st Mountain Artillery Battalion. To cope with these changes in
    the operational plan, the necessary troops were moved from Central to West Java
    to their new and unfamiliar operating areas. The Japanese offensive against Java
    had never erupted in all its intensity.


    out in East Java by the IJN 11th Air Fleet and in West Java by the IJA with the
    Third Air Force and Both faced a shortage of suitable air, and logistical problems.
    In addition, the IJA''s operations were severely affected by bad weather. The
    primary offensive against Java began on 3 February 1942 with Operation Z, a three-day
    offensive to eliminate Allied airpower in Java. The targets were Surabaya, Madura
    and Malang. After two days of action, on 3 and 5 February 1942, the IJN was convinced
    that Allied airpower in East Java was virtually eliminated. New attacks followed
    on 7, 8 and 9 February, but had no effect, the weather also interfered with IJN
    operations against West Java, and the focus was shifted to attack Allied shipping
    around around and Java. The IJA was only able to start its campaign against Java
    on 19 February from Penang. When the Western Landing Unit operated off, Java had
    yet to begin. There was no question of superiority over Java. In the eyes of the
    IJN, the air offensive against West Java did not bear enough fruit. The Allied
    and air forces remained active. For this reason, the IJN proposed the landing
    on Java by two days until 28 February 1942. The Southern Task Force was reinforced
    and the air campaign against West Java intensified.


    During Operation Z, the IJN air units by chance also engaged the Allied ships
    that thought heavy losses had been inflicted on the Allied ships during two days
    of attacks. In fact, only two American cruisers were damaged; the USS Houston,
    48 men died and 20 were injured.


    ABDAIR responded to the loss of South Sumatra with an offensive counter-air operation
    aimed at impairing Japanese flight capacity as possible by bombing attacks on
    the oil tank farm at Batu Refinery, on the Musi River, the Muntok anchorage and
    Palembang Airfield.


    OPPOSITE

    Java was the main and administrative centre of the Netherlands Islands. It was
    a long (1,060km) and narrow (200km) island with a large population. A mountainous
    volcanic area extends the length of the island to north with many rivers flowing
    from the mountains. The south coast, on the other hand, is frequently mountainous.
    Any primary areas were cleared. The Japanese is a high plateau in West Java, containing
    the city of Bandung (Bandung), surrounded by mountains. The island have three
    major towns: Portanjuk (West), Surabaya (East Java) and one on the south coast
    (Central Java). The road network was well developed with mostly connecting roads
    and railways connecting north and south coasts. At Cep (Tjeepo) in Central Java
    there was an oil refinery.'
