- pgno: 45
  md: '# ATTACK ON NE STRONGPOINT NO.10, EAST FRONT, TARAKAN, 11 JANUARY 1942 (PP.
    42–43)


    ** On 11 January 1942, the Sakaguchi Detachment and the 2nd Kur SLF began their
    amphibious attack on Tarakan at three points the east coast. The Right Wing Unit
    – comprising 1st Battalion and two companies from 3rd Battalion, 146th Infantry
    Regiment, half the regional artillery and 1st Engineer Company (reduced) – and
    the 2nd Kur SLF landed at 0000hrs and 0300hrs (JST). According to the plan, the
    drilling site (in the centre of the island), Lingkas and the Karangan batteries
    (on the west coast) were in Japanese hands by dawn. The airfield would then be
    captured.


    From the start, the operation did not go as planned. The Right Wing Unit landed
    4-km from the planned landing point, deforming the start of the attack and, so
    surprise was lost. Then the Left Unit became disoriented in the jungle and did
    not reach, let alone capture, their objective of the Karangan batteries.


    The Right Wing marched through forests to reach the inland landing point, and
    at dawn, they overwhelmed the NEI Strongpoint at Amal. The attack on the NEI Eastern
    Front began around 0900hrs time. The Eastern Front consisted of five mutually
    supporting strongpoints, numbered 8 to 12. Only strongpoints 10 and 11 were occupied
    by the NEI defenders, which weakened the firing line. The strongpoints lay directly
    on the Japanese axis of advance.


    Here we see the attack on Strongpoint No. 10. In the background oil-drilling operation
    also began. Strongpoint 10 was under command of Sergeant Turnbull, while No. 11
    was managed by first Lieutenant J.C. den Hoff, his staff, a section of MGs and
    two LMG groups (totaling 23 men). Turnbull strongpoint consisted of six concrete
    pillboxes (3); command


    post with observation post, four pillboxes for the MGs and a reserve position
    for one of the automatic weapons in the rear. Each pillbox was protected by a
    double blast wall. The MGs were located in trenches protected by an earth ramp.
    The MGs strongpoints were protected by a double blast wall approximately 30m in
    front of them. The whole position was obstructed by dense undergrowth 40m-50m
    to its front. All obstacles were cleared by flanking fire from the MGs. The fields
    of fire were hindered by the fast-growing tropical vegetation (5). The Japanese
    and NEI small-arms fire was halted by mortar and 7.5cm artillery fire (6). Strongpoint
    10 was finally captured after Sergeant Turnbull was killed along with the rest
    of the defenders wounded.


    The NEI commander, Lieutenant-Colonel D. De Wal, established a defensive line
    manned by improved units and the NEI 1st Company. 77th Infantry Battalion and
    the Linkskraft in reserve. However, when ordered to attack, the company refused
    to move forward in order time. The Japanese planned to retake the NEI positions
    using a night attack. They manage to penetrate the two ducts, but the rest of
    the NEI line was unharmed. Air support was called to bring the NEI batteries in
    the morning. Lieutenant-Colonel De Wal ordered a counter-attack to re the front
    line. The line breached, and he had no reserves to plug the gap. That morning,
    the NEI troops encountered wounded...


