- pgno: 85
  md: '# JAPANESE BREAKTHROUGH AT CIATER PASS,

    5–7 MARCH 1942


    After the successful Japanese amphibious landings on the island of Java, Kalidjati
    field was captured the same morning intact. Repeated NEI counter-attacks were
    repelled. On 5 March, the Shoji Detachment attacked the Ciater position from Subang
    with one infantry battalion and ample air support from the 3rd Air Division The
    Ciater position north of the city of Bandung was defended by Group Bandung with
    a single reinforced infantry company. After the main defensive line was breached,
    rushed-in NEI reinforcements tried to halt the Japanese advance. Once these forces
    were also eliminated, the road to Bandung lay open.


    ![](img/52135db0eb5e64e74130266a9290cbf8_85_0.png)


    # EVENTS


    Times are given in local time (UTC+700) unless otherwise stated.


    +   Thursday, 5 March 1942

    1. 06:00 - Japanese infantry and tanks began moving along the road to Ciater.

    2. 08:00 - NEI units encountered Japanese scouts and a skirmish began.

    3. 10:00 - Japanese artillery began shelling the NEI positions.

    4. 12:00 - NEI units launched a counter-attack but were repelled.

    5. 14:00 - Japanese air support attacked the NEI supply lines.

    6. 16:00 - NEI units began to withdraw to the second line of defense.

    7. 18:00 - Japanese forces reached the outskirts of the village.

    8. 20:00 - NEI units established a defensive perimeter around the pass.

    9. 22:00 - Japanese forces continued their push against the NEI lines.


    +   Friday, 6 March 1942

    1. 02:00 - Japanese forces launched a main assault on the Ciater pass.

    2. 04:00 - NEI units suffered heavy casualties from Japanese mortar fire.

    3. 06:00 - Japanese infantry broke through the first line of defense.

    4. 08:00 - NEI units began a desperate retreat towards the south.

    5. 10:00 - Japanese forces captured the high ground overlooking the pass.

    6. 12:00 - NEI units were surrounded in several small pockets.

    7. 14:00 - Japanese air support destroyed the remaining NEI vehicles.

    8. 16:00 - Many NEI units surrendered or were killed in action.

    9. 18:00 - Japanese forces established control over the entire pass area.


    +   Saturday, 7 March 1942

    1. 01:00 - Japanese forces continued their advance towards Bandung.

    2. 03:00 - Remaining NEI resistance was eliminated in the area.

    3. 05:00 - Japanese units secured the road to the city center.

    4. 07:00 - Japanese command reported the breakthrough at Ciater.

    5. 09:00 - Japanese supply columns began moving into the area.

    6. 11:00 - NEI reinforcements were cut off by the Japanese advance.

    7. 13:00 - Japanese forces reached the outskirts of Bandung.

    8. 15:00 - Japanese units began the encirclement of the city.

    9. 17:00 - The battle for Ciater Pass was declared over.'
