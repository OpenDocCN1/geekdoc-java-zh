- pgno: 47
  md: '# THE JAPANESE ASSAULT ON MENADO,

    11–12 JANUARY 1942


    The Japanese captured Menado Langoan (II) airfield and the seplane base with a
    simultaneous amphibious and airborne assault by naval landing and airborne forces.
    The NEI forces were caught in a pincer movement, from Menado in the west and Kema
    in the east, with Japanese paratroopers attacking the centre near the airfield.
    The scattered and outnumbered NEI forces managed to stall the inland advance of
    the Japanese amphibious forces by delaying from positions. They could not, however,
    prevent them from establishing contact with the paratroopers. The airfield was
    fiercely defended, but fell into Japanese hands after a brief fight. NEI counter-attacks
    lacked coordination, were too weak and failed, whereupon remnants of the garrison
    retreated into the mountains being an ill-fated guerrilla campaign.


    ![](img/52135db0eb5e64e74130266a9290cbf8_47_0.png)


    # EVENTS


    Times are in Japan Standard Time (JST - UTC+09:00) unless otherwise stated.

    Celebes Time (CTS is is UTC+06:00).


    11 January 1942


    +   1. 0400hrs Amphibious landing of Sabase Combined SF HQ with support units
    and 2nd Salseb SF (1,800 km) north and south of Menado. The outnumbered NEI forces
    were caught off guard and cut off by the Japanese. The Japanese seized the airfield.

    2. 0420hrs Menado attacked by 2nd Salseb SF (1,400 km) at Kema. The small coastal
    detail (120 men) of a Company of two Division landed and forced retreat by the
    Japanese on Lado bay hands.

    3. 0952–1020hrs First drop of 1st Yokosuka SF constructing batal HQ signal, with
    1st and 2nd Salseb units (134 men) at Langoan. The NEI defenders were delayed
    by the Japanese and retreated to the rear.

    4. 0945hrs, 1st Salseb SF opened fire by light tanks, pushed back, but was met
    by successful NEI de-lay(w)s using the prepared oncourse position forward. The
    Japanese paratroopers suffered heavy losses and retreated from the air-fieldfield
    by 1900hrs.

    5. To block the road to Amado, a Company was ordered to control Amado. One retreated
    with a section from Menado Company. At 1300hrs, they reached the prepared position
    to fight a delaying action around 1400hrs. The 2nd Salseb SF retreated to Amado.

    6. At Kema, the Mobile Column (two armoured) was sent to support the assault on
    the airfield. They encountered a Japanese recon-sq and destroyed an enemy squad.

    7. During the morning, the Officer Commanding moved out of his reserves from Keras
    to stop the Japanese advance. A counter attack by the two remaining sections of
    R (v) Company in the direction of the airfield from the south failed.


    +   8. 1300hrs: securing the airfield, the 1st Yokosuka SF heads towards the secondary
    objective of 2nd Salseb base.

    9. Encountered with resistance, SF, fails to block the Japanese advance. At 1450hrs,
    Kakas was taken at 1500hrs by the Japanese marine base. The main body of 1st Yokosuka
    SF retreated to the air-field.


    12 January 1942


    +   10. 0800hrs, the 2nd Salseb SF attacks Langoan. The 1st Salseb forces cleared
    the road from Tompopo to Tomando. The 2nd Salseb moves by along the western and
    eastern shores of the lake.

    11. 1100hrs, 2nd Salseb SF makes contact with 1st Yokosuka SF near Lado Pas. 1st
    Salseb SF retreats by 12300hrs. They reach Lango and Kakas. The operation is over.


    +   12. The NEI garrison began a fight for guerrilla war, with the lack of suitable
    terrain, it seems to fail. After the fall of the major towns, disadvantage is
    high among the remaining NEI units. By the end of February, it is over.


    ![](img/52135db0eb5e64e74130266a9290cbf8_47_1.png)'
