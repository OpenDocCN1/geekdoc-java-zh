- pgno: 28
  md: '# OPPOSING PLANS


    # JAPANESE


    The Netherlands East Indies did not attract the interest of Japan''s armed forces
    until the second half of the 1930s. After the occupation of the Netherlands by
    Germany in May 1940, a joint study into simultaneous operations against four enemies:
    the United States, Great Britain, the Netherlands and China. A slow start, this
    accelerated from April 1941. It was now clear that a peaceful submission of the
    Netherlands East Indies was not possible. In mid-1941, concrete plans had already
    been formed.


    The IJN planned a ''clockwise advance''. This plan envisioned the conquest of
    the Philippines from the north by two divisions in two months. Java would then
    be taken by two divisions. Singapore would be captured in an enrolment from Sumatra
    to the south, and from Malaysia to the north. The IJA, on the other hand, favoured
    a ''counter-clockwise advance''. It wished to capture Singapore with a rapid advance.
    It would block British reinforcements and significantly shorten the turnaround
    time of the entire operation. This attack would take place simultaneously with
    the offensive against the Philippines. This would mean an attack on both flanks,
    Malaysia and the Philippines, which would then meet on Java.


    In the Tokyo Agreement of 10 November 1941, the Southern Army on the one hand,
    and the Combined Fleet and Southern Task Force on the other, laid down their plans
    on paper. In the Wakuni Agreement, both armed forces reached agreement about the
    Philippines and the Netherlands East Indies.


    Table 7: The schedule for Operation H: the Tokyo Agreement


    | Day of start of landing (X day = start of the war) | Key area to capture | Assembly
    point |

    |---|---|---|

    | X + 23 | Menado | Palau |

    | X + 25 | Tarakan | Palau |

    | X + 35 | Kendari | Menado |

    | X + 35 | Balikpapan | Tarakan |

    | X + 45 | Makassar | Kendari |

    | X + 50 | Bandjermasin | Balikpapan |

    | X + 60 | Ambon and Kupang | Palau |

    | X + 80 | Java, Sumatra | Hong Kong for the capture of Sumatra, Manila for eastern
    Java, Taiwan and Hong Kong for western Java'
