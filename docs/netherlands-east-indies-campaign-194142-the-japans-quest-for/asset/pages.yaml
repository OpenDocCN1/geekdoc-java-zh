- pgno: 6
  md: '# ORIGINS OF THE CAMPAIGN


    In December 1941, Japan took up arms against the Western Powers in what it claimed
    to be a struggle of self-defence and self-preservation. In just few months, Japan
    subdued South-East Asia and created a Greater East Asian Co-Prosperity Sphere.
    It then took the Allies nearly four years to defeat Japan and retake the area.


    The Japanese Southern Offensive A-Go, consisted of three major campaigns: Malaya,
    the Philippines and the Netherlands East Indies. This work describes the attack
    and conquest of the Netherlands East Indies. What place did the Netherlands East
    Indies (NEI, present-day Indonesia) occupy the Japanese war goals? How did Japan
    intend to achieve this? What were the defensive plans of the Netherlands East
    Indies? And how did the campaign progress at the operational and tactical level?


    # JAPANESE EXPANSION


    Japan''s expansion into China brought into conflict with the other major powers
    in Asia. Border fighting took place with the Soviet Union in 1938 and 1939. Great
    Britain could little to count on this expansion. Even prior to World War I, it
    lacked the means to simultaneously maintain battle fleets in European and Asian
    waters. It was the United States that took lead in curbing Japan''s expansion
    of power, but also to curb it. To this end, it imposed ever more stringent economic
    sanctions and military pressure by moving, in 1940, most of the US fleet from
    the Pacific coast to Hawaii, and stationed B-17 long-range bombers in the Philippines.
    The sanctions would be lifted if Japan withdrew from China and French IndoChina.
    Japan would not only have to give up its empire and aspirations to become a great
    power, but also would have to submit to the economic supremacy of the United States.


    Japan looked at accessing strategic raw materials that the US was denying, and
    its gaze fell upon the Netherlands East Indies.


    In the 1930s aerial photo, the Bataafsche Petroleum Maatschappij (BPM) oil refineries
    at Plaju can be seen in the center foreground with the residential area to the
    left background. The refineries of the Nederlandse Koninklijke Petroleum Maatschappij
    (NKPM) at Sungai Geong, east of Palembang, South Sumatra. To the left is the Musi
    River. The refineries accounted for one-third of total oil production. This was
    the only quality aviation fuel. The main wells were at Djambi. BPM was owned by
    the American Standard Oil Company. BPM was owned by Royal Shell. (London University
    Libraries, KITLV 27290)


