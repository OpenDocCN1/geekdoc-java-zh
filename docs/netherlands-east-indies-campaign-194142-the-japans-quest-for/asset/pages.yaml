- pgno: 29
  md: 'The IJN was allocated the clockwise advance, and the IJA counter-clockwise
    one.


    Previously, on 10 October 1941, the IJA informed Emperor Hirohito that the capture
    of most of the key areas in the south was possible in about five months (150 days).
    This date was then finalized. The IJA and IJN agreed the timeframe given in Table
    7 for the attack on the Netherlands East Indies: codename Operation H.


    The main objective and capstone of the Southern Offensive, Operation A-Go, was
    the conquest of oil wells and the oil refineries in the Netherlands East Indies.
    The NEI campaign depended heavily on the success of Japanese operations elsewhere
    in South-East Asia. This was primarily based on the results of the surprise attack
    on the US fleet in Hawaii. The relocation of the US Battle Force (reorganized
    into the US Atlantic Fleet and US Pacific Fleet on 1 February 1941) to Hawaii
    was considered a significant deterrent by the Americans, but had brought this
    fleet within reach of the Japanese fleet. The attack was supposed to disable the
    Pacific Fleet for at least six months. The Pacific Fleet would no longer be able
    to thwart the conquest of South-East Asia. The operational plan subsequently provided
    for the conquest and use of Malaysia, British Borneo and the Philippines as a
    springboard for the attack on the Netherlands East Indies. The success of the
    Japanese attack on these areas was therefore a precondition for the conquest of
    the NEI. These operations affected the Netherlands East Indies campaign in a further
    way. A large part of the IJN and IJA units destined for the Netherlands East Indies
    were deployed in previous operations in China and the Philippines. These only
    became after Hong Kong and Manila were conquered. The entire outcome of the Southern
    Offensive would depend on widespread coordination between land, sea and air units.


    There was no question of the element of spirit in the operations against the Netherlands
    East Indies. After all, this had evaporated with the operations against Malaya,
    British Borneo and the Philippines. In addition, Java might have in the meantime
    received American and British reinforcements. The enormous distances involved
    were a further complicating factor. The many dependencies made the Southern Offensive
    an extremely risky operation. A further risk was the often faulty intelligence
    on which the Japanese were forced to base their operational plans.


    The Japanese did not think highly of the combat power of the RNEI Army. The indigenous
    troops in particular were considered to lack spirit. They expected to conquer
    Java in about a week.


    # Table 8: Japanese operational codenames


    | Operation | Codename |

    |---|---|

    | Operation A-Go | Southern Offensive |

    | Operation B | British Borneo |

    | Operation E | Malaya |

    | Operation H | Java |

    | Operation L | Bangka and Palembang |

    | Operation M | Philippines |

    | Operation Q | landing at Kuantan, cancelled |

    | Operation S | landing at Endau, cancelled |

    | Operation T | northern Sumatra invasion |

    | Operation Z | air campaign against Java |'
