- pgno: 36
  md: '![](img/52135db0eb5e64e74130266a9290cbf8_36_0.png)


    General A.P. Wavell on his arrival in Jakarta on 10 January 1942. On the left
    is the British General H.F. Walsh, while to the right (with back towards viewer)
    is Lieutenant-General H. ter Poorten and Admiral T.C. Hart (USN). Wavell was an
    experienced officer and commander, formerly the commander-in-chief Middle East
    Command and the current commander-in-chief India. As Supreme Commander ABDACOM,
    his decision-making was scarce fortune. He used up scarce resources at Singapore,
    and were scarce in ground troops where air and naval reinforcements were needed.
    Because of his focus on Singapore, he hardly used any resources to counter the
    Japanese defence in the centre and east of the Indonesian archipelago. (Beeldbank
    WW2 - NIOD)


    The Netherlands and Australia had been important partners during the staff conferences.
    This immediately ended with the outbreak of war in Asia. Strategic policy became
    an Anglo-Australian affair, with the Americans in the lead. The Dutch, Australian
    and also the New Zealand governments were not consulted and instead presented
    with a *fait accompli*. This was not only to the situation, but also to appointments.
    British or American officers were appointed to all major command positions. ABDA-ARM
    was reserved for a Dutchman: the Army Commander H. ter Poorten. This clearly indicates
    the importance of that command. This state of affairs led to tensions with Australia
    and the Netherlands.


    In January 1942, upon British request, it was decided to move the Australian I
    Corps, consisting of the Australian 6th and 7th divisions, and the British 7th
    Armoured Brigade from the Middle East to the Netherlands East Indies. Wavell assigned
    a division to South Sumatra and a division with the tank brigade to Central Java.
    With the fall of Singapore in sight, Wavell decided to divert these reinforcements
    to Burma. It was clear that with the fall of Singapore, the defence of India was
    his priority. Australian political and military leadership no longer supported
    this intention. Australian troops were needed in Australia. On 19 February 1942,
    the CCS decided to send no further reinforcements to Java. Some Australian and
    British units, however, still disembarked there.


    The question was whether the planned reinforcement of Java with ground troops
    could stop the Japanese advance – not to mention whether would be operational
    in time. Given Japanese sea and air, a successful defence of the Netherlands East
    Indies was only possible with a large-scale reinforcement of Allied air and naval
    assets. However, sufficient aircraft were not available, while the Americans were
    unwilling to risk the US Pacific Fleet in the Western Pacific.'
