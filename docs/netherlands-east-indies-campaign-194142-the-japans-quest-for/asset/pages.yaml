  md: '# AFTERMATH


    After the Japanese Java Campaign had ended, large parts of the Netherlands East
    Indies remained unoccupied. In three operations, New Guinea and the Lesser Sunda
    Islands were occupied without a fight between March and May. The islands located
    between New Guinea and Australia followed between late July and September 1942.
    In July, these islands were occupied by small NEI detachments (Operation Plover).
    Only Merake in the far south of New Guinea remained in Dutch hands.


    The IJA and IJN had driven the Western Powers from Asia and secured an immense
    area. In order to preserve these achievements, the second stage of operations
    would shift from the offensive to the defensive, securing the perimeter. Western
    counter-attacks would fail. The war would end in a compromise peace, whereby the
    Western Powers would have to accept the Japanese dominant position in South-East
    Asia. In the second stage, Japan would wage a war of attrition against the largest
    industrialized power, the United States. As the weaker party, Japan could not
    hope to win this battle of attrition. The intended limited war became total war,
    with the inevitable demise of the Empire.


    During the Southern Offensive, the IJA and the IJN regularly clashed over the
    implementation and the timetable. Both parties fundamentally differed in operational
    terms. The IJA wanted to quickly occupy strategic points and wage battle so that
    the enemy did not have time to organize his defense. The IJN advocated a systematic
    approach consisting of an campaign aimed at gaining air superiority by taking
    out enemy firepower at the landing site, but also in the hinterland. Only then
    could the amphibious landings take place. Partly as a result of this, the IJN
    reported optimistic results from their campaign. Their amphibious landings regularly
    faced Allied air strikes and attacks by naval units. Despite the previous campaign,
    these turned out to be insufficiently supplied, if at all.


    The Netherlands East Indies campaign took place in an extremely unfavourable period
    of the year: the wet monsoon. Japanese air operations suffered from bad to very
    bad weather. It was not always possible to fly and provide cover to the land and
    naval forces. In addition heavy rainfall rendered airfields virtually unusable.
    The southern airfields and runways were too short had a a negative impact on the
    effectiveness of the air branch. The Japanese had underestimated this point in
    their planning. On the other hand, Japanese ground troops regularly used rain
    and mist to surprise the NEI defenders.


    The NEI Army, in terms of operations, tactics and command, turned out to be qualitatively
    inferior to its Japanese opponent. The NEI was committed'
