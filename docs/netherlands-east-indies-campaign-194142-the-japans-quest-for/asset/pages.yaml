    The IJA and IJN performed ruthlessly during Operation A-Go. War crimes occurred
    regularly. Civilians and prisoners of war, including the wounded, were deliberately
    murdered in various places.


    # RNE ARMY


    The RNE Army was a colonial force with a twofold task: internal security, and
    defence against a foreign enemy. This dualism was reflected in its organization,
    tactics and armament. Small detachments of garrison infantry were stationed in
    the ''Outer Regions'' (Buitengwezen) – beyond Java and Madura. They were trained
    to fight an internal enemy: they served to maintain authority and armament. The
    6.5mm M95 repeating carbine and the clevang (a stave). The Java Army (Javaleger)
    was stationed on Java. It fully fulfilled a defensive role and was therefore intended
    to fight a possible foreign enemy. Its core comprised four infantry regiments,
    two artillery regiments and one army-cavalry.


    The RNE Army was a standing professional army of the core of the army and counter-balanced
    the numerical dominance of non-Europeans. The non-Europeans (i.e. Indonesians)
    were not recruited from all populations, but from a few select ethnic groups from
    the Indonesian archipelago. The proportion of Europeans was increased in wartime
    by european conscription. Conscription for Indians was only introduced in 1941
    under pressure from the external threat. Annual quotas of 3,000 people were expected.
    In fact, Indonesian conscription was limited to Java, the Minahasa Peninsula (North
    Sulawesi) and Ambon, and by this point it was of too little, too late.


    In peace and wartime, the Netherlands East Indies did not have a headquarters
    for land and naval forces. The two lines of command only converged at the governor
    general as commander-in-chief of the army and fleet. The army and navy had their
    own chain of command under the Commander of the Army (Legercommandant) and the
    Commander of the Navy (Commandant Zeemacht). These commanders headed the Department
    of War and the Department of Navy respectively. These administrative departments
    combined the functions of a department of defence, general headquarters, operational
    and support organization. During wartime, the operational tasks of the War Department
    were transferred to the General Headquarters (Algemeen Hoofdkwartier) (Hoofdkwartier
    Veldleger) would be formed from the Operations Branch of'
