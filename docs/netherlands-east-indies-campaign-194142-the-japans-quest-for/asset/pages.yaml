- pgno: 99
  md: 'Accounts of history''s greatest conflicts, detailing the command strategies,
    tactics and battle experiences of the opposing forces throughout the crucial stages
    of each campaign


    ![](img/52135db0eb5e64e74130266a9290cbf8_99_0.png)


    # THE NETHERLANDS EAST CAMPAIGN 1941–42


    Japan''s Quest for Oil


    Imperial Japan''s campaigns of conquest in late 1941 to early 1942 were launched
    in order to achieve self-sufficiency for the Japanese Empire, chiefly in the precious
    commodity of oil. The Netherlands (or Dutch) Indies formed Japan''s primary objective,
    on account of its abundant oilfields and rubber plantations. The former, in particular,
    were highly prized, given that the colony was the fifth-largest producer and exporter
    of oil in the world, and Japan had only domestic production. This highly illustrated
    study describes in full detail how the Japanese combined-arms offensive subjugated
    the vast terrain of the Netherlands East Indies, including Borneo, Celebes, Timor,
    Java, Sumatra and Ansible. Author Marc Loebstein carefully records the stubborn
    defence of Dutch forces and their British, Australian and American counterparts,
    as Japanese forces picked off isolated islands and oilfields one by one. The operational
    plans, weaponry and forces, and conduct of fighting by the opposing sides up to
    late March 1942 are covered in depth, bringing an often overlooked campaign of
    World War II vividly to life.


    ![](img/52135db0eb5e64e74130266a9290cbf8_99_1.png)


    Full colour battlescen • illustrations • 3-dimensional ''bird''s-eye-views'' •
    Maps


