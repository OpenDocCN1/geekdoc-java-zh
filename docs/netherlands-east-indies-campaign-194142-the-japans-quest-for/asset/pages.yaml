  md: '# OIL: FUEL FOR SHIPS, PLANES AND WAR


    Oil was the Achilles'' heel of the Japanese Empire. It depended almost entirely

    on imports for its consumption, as shown in Table 1. The United States

    slied more than half of Japan''s oil consumption, and thus an American

    el embargo would hit Japan hard. The Netherlands East Indies provided

    a logic, if not sole, alternative to American oil, one that could meet

    Japan''s needs.


    Table 1: Japanese oil supply 1937-39 (million barrels)


    | Year | Consumption | Own production | Import | United States | Netherlands East
    Indies | Other |

    |---|---|---|---|---|---|-|

    | 1937 | 41 | 3.1 | 38 | 25 | 10 | 3 |

    | 1938 | 46 | 3.0 | 43 | 30 | 10 | 3 |

    | 1939 | 40 | 3.1 | 36.8 | 19.4 | 14.1 | 3.3 |


    In addition to oil, the Netherlands East Indies also was an important source

    of rubber, tin and bauxite. In 1938, worldwide demand for natural

    rubber was 933,000 tons; the Netherlands East Indies accounted for 30,872

    tons, or 32 per cent of the world market. In 1938, 27,737 kilotonnes of tin

    was extracted out of the c.148,100 long tons worldwide, in third place

    a Malaysia and Bolivia. The Netherlands East Indies also quarried 245,354

    tons of bauxite in 1938. It also produced 90 per cent of the cinchona plant,

    and had a monopoly on the main malaria drug: quinine.


    Table 2: The Netherlands East Indies oil industry (million barrels)


    | Year | Production (including British Borneo) | Netherlands East Indies consumption
    | Export (excluding Japan) | Export to Japan |

    |---|---|---|---|-|

    | 1937 | 59.8 | 18.4 | 31.4 | 10 |

    | 1938 | 61.3 | 19.7 | 31.5 | 10 |

    | 1939 | 66.0 | 19.8 | 32.1 | 14.1 |


    Given the importance of the Netherlands East Indies as a supplier of strategic

    raw materials, Japan was committed to growing the area within its sphere of\influence:
    the Great East Asian Co-Prosperity Sphere. Between 1940 and

    1941, Japan began negotiations to increase its influence in the Netherlands

    Indies and to acquire the necessary strategic raw materials by peaceful

    means. However, Japan complicated these negotiations by establishing an

    alliance with Germany and Italy in September 1940; the Tripartite Pact. The

    Netherlands had been at war with and subsequently occupied by Germany

    Since that year. The Japanese threat was clearly felt. The Netherlands

    Australia took part in military staff conferences with Great Britain and

    Japan, in the event of war with Japan. The United States was present as an observer.
    The Netherlands felt

    strengthened by these staff conferences with regard to Japan. However,

    and the

    United States. The Netherlands East Indies delayed negotiations with

    Sphere. The was also unwilling to join the Greater East Asian Co-Prosperity

    with. That did not bring Japan the result it had expected, and they

    were therefore ended in June 1941.'
