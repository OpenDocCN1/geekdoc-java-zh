  md: 'East Java and the island of Bali were part of the NEI 3rd Military Department
    under Major-General G.A. Ilgen, who also commanded the 3rd Division. This division,
    also known as the Surabaya Detachment, was tasked with defending Surabaya naval
    base. The static defence of the base was assigned to the Surabaya Security Force
    (Veiligheidsoerajah). The Mobile Group – consisting of 6th Infantry Regiment,
    3rd Cavalry Squadron, 1st Field Artillery Battalion and the US Battery E, 2nd
    Battalion, 13rd Field Artillery Regiment – was tasked with the mobile defence
    of the naval base. On 1 March 1942, the RNN Commander made some naval forces available
    to him. The Naval Battalion was formed, consisting of a HQ, four companies of
    marines and naval guards, a machine-gun section and logistics train, with a total
    strength of approximately 400 men.


    After the destruction of the fleet, Surabaya lost its significance as a naval
    base. As at Singapore, Major-General Ilgen and his troops were defending an empty
    base.


    On 1 March 1942, the Japanese invasion invaded Kragan. Allied air raids sank one
    ship while a second ship was left. A total of 62 people were killed and 210 wounded.
    However, these losses did not stop the landing coming ahead at 0345 and 0400 hours.
    Rembang was captured as speed. Roadblocks blocked, the Solo River was recovered
    in the afternoon of 2 March. The division found all the bridges and the Cepu refinery
    destroyed and the oils were on fire. The burning of the Solo River took more than
    a day. In the event of 4 March, the ABC Unit (the main force) made advance towards
    Kertondo on the Bandung River.


    Following the air strikes on the Japanese landing fleet at Kragan, FEAF ceased
    operations and evacuated personnel to Australia on 1 and 2 March 1942. The Java
    Air Command had not authorized this and lodged a protest. The Military Aviation
    Service also helped to evacuate the airfields in Central and East Java for Android.


    Major General Ilgen planned an offensive action by his Mobile Group on 28 February
    1942 against the Japanese landing. However, he regretted it. Instead, Ilgen decided
    to move to the defensive


