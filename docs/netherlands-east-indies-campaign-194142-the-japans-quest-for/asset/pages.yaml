    # ALLIES


    As agreed in the Anglo-Dutch Australian staff conference in February 1941 and
    recorded in the Plans for the Employment of Naval and Air Forces (PLENAPS) of
    12 November 1941, after the breakout of hostilities Australia sent units to the
    islands of Ambon and Timor in the Netherlands East Indies. 13 Squadron RAAF stationed
    light bomber and coastal reconnaissance aircraft on Ambon and at the island of
    Buru. Penfoe Airfield on Timor, a flight from 2 Squadron RAAF was stationed. For
    security purposes, three battalion groups were formed from the 23rd Infantry Brigade,
    Australia 8th Division: Lark Force (for Rabaul, New Britain), Gulf Force (Ambon)
    and Sparrow Force (Timor). With these units Australia formed a ‘forward observation
    line’.'
