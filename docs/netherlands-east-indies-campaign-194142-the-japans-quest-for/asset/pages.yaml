  md: '![](img/52135db0eb5e64e74130266a9290cbf8_84_0.png)


    Battalion. On paper it seemed a decent fighting force, but morale was very low
    and its combat value was therefore questionable. Moreover, the RNEI Army was showing
    signs of disintegration. With the breakthrough at the Ciater position, the fight
    seemed like it was over.


    # Central Java


    Kragan was an ideal landing point with 35km-long beach and major connecting roads
    in the proximity. The vanguard of the Sakaguchi Detachment, set foot ashore 6km
    south-east of Kragan on 1 March 1942 at 0700hrs. The other units, the Matsumoto
    and Yamamoto units, did not land until the following day. Their transport ship
    was lost because it had been damaged during the invasion of Bali. The Sakaguchi
    Detachment (the Kume Detachment left on Borneo) consisted of the 2nd and 3rd Infantry
    battalions, 146th Infantry Regiment, two artillery batteries, an armoured car
    unit and 2nd Transport Company with 259th Independent Transport Company attached.
    Sakaguchi''s objective was the southern port city of Cilacap, the capture of which
    would cut off the escape route from Jakarta and Bandung. In the second phase,
    it would mop up remaining units in Central Java.


    The RNEI Army''s 2nd Division, in Central Java, under General P.A. Cox, was reduced
    on 22 February 1942 by the relocation to West Java of the 4th Infantry Regiment.
    South Group, two motorized cavalry squadrons (4th Cavalry Squadron and Life Guards
    Cavalry Squadron) and the Chilacap Detachment remained. South Group was a weak
    infantry regiment formed in January 1942 by merging three understrength and underarmed
    infantry battalions and a newly formed machine-gun company of mostly semi-trained
    Indonesian part-time auxiliaries. The unit was almost fully motorized. South Group
    was tasked with ''security'' and protection [of Cilacap port] by positioning itself
    behind the Serayu River''.'
