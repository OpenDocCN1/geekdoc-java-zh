  md: 'the General Staff (part of the Department of War) to command the field army.


    The chain of command was further complicated by the position of the Royal Netherlands
    Navy (Koninklijke Marine). It was not an REI institute, but came under the Ministry
    of Defence in the Netherlands. Although the Commander of the Navy was operationally
    under the governor general, he was accountable to the Minister of Defence in the
    Netherlands for his administrative policy. The Navy was funded from the Netherlands
    and REI budgets. The armed forces remained physically separate. The General Headquarters
    were in Bandung. The Royal Netherlands Navy was in Jakarta.


    ![](img/52135db0eb5e64e74130266a9290cbf8_20_0.png)


    On 5 March 1942, the governor general was released from supreme command by the
    Netherlands in London. The governor general would then be free reign to continue
    to administer the area under the Japanese. This turned out to be wishful.


    In the interbellum, the REI Army underwent three rounds of austerity cuts: 1922-1923,
    1927 and 1930-35. Defense increased again due to the rising international tension
    in Europe and Asia. The army command formulated the 1936 reinforcement plan. This
    eight-point programme provided for further reinforcement of the air arm, mechanization
    of the infantry, inclusion of firepower for infantry and (coastal) artillery and
    the filling of gaps in personnel.


    At the end of 1941, the RNEI''s cavalry was reorganized into a mounted squadron
    and four reconnaissance. A motorized squadron commanded a group, two jeeps equipped
    with Ford GP jeeps and a platoon of cars with M3 (pau) White Scout Cars and AC30
    (pau) Avis-Stra each included a section of 12.7mm M30 Colt machine guns.


    The Aviation Service was converted from two reconnaissance squadrons and a fighter
    squadron with a first-line strength of 18 aircraft in 1936 into the Military Aviation
    Service, with seven medium bomber squadrons, four fighter squadrons and two reconnaissance
    squadrons. It had 95 bombers, 99 fighters, 34 reconnaissance aircraft and 155
    other aircraft. The mid-level horizontal Martin B-10/19 WH bomber purchased between
    1936 and 1939 was made then at point, considered obsolete by 1941 still performed
    well, their armour and defensive armament were too weak against attacks from Japanese
    fighters. Next 162 North American B-25C-5NA Mitchell medium bombers were delivered
    from February 1942 - too late to join the fight. The RNEI''s main fighter, the
    Brewster B339 (D63) aircraft, was in no way inferior to the Nakajima Ki-43-La
    (Oscar), the IJA fighter plane. The Mitsubishi A6M2 (Zeke/Zero), the IJN fighter
    was, however, more heavily armed and had tracer ammunition.


    In addition to partly obsolete material, a lack of trained (technical) personnel
    was the second weakness of the RNEI''s air arm. For example, there was no formal
    combat flight training for fighter pilots. This was due to a shortage of experienced
    instructors and the lack of effective combat tactics.


    The prioritization of the air arm led to a delay in the modernization of the era.
    The emphasis was on increasing firepower and mobility. The former was increased
    with imports of plunging-fife weapons,


