- pgno: 46
  md: 'The losses among Sakaguchi''s force amounted to eight casualties on land and
    39 at sea.

    ABDACOM became operational on 15 January 1942, and was now facing its first test.
    It deployed air and naval forces against the Japanese landing fleet heading for
    Balikapan. The Military Aviation Service flew few missions against the Japanese
    ships. From Java, JAAF conducted several missions in January. Air strikes caused
    the Japanese fleet to lose two transport ships and damaged three transport ships,
    a seaplane tender and a destroyer.

    The convoy had already been attacked on route on 23 January 1942 by Dutch submarines;
    shortly after the fleet departed, the Japanese transport ships were unexpectedly
    attacked by the four American destroyers of Destroyer Division 59 around 0300hrs.
    In a ''hit-and-run'' attack, these warships sank four transport ships, damaging
    two others and a patrol boat. At least 121 Japanese sailors lost their lives.
    Despite a massive blow to the Japanese air and naval presence, the Allies had
    inflicted significant losses on the Japanese transport fleet heading for Balikapan.


    On 23 January 1942, the Japanese discovered the secret airfield Samarinda using
    air reconnaissance. After several attacks, the remaining Military Aviation Service
    aircraft were withdrawn from Samarinda II. The base remained operational for the
    time being. The Military Aviation Service commanded to use Oelin airfield in Bandarmans
    for hit-and-run attacks from Java on Balikapan. On 27 January 1942, a squadron
    was surprised on the ground by an air raid and was destroyed. In total, nine Glenn
    Martins lost their life. This marked the end of any deployment by the Military
    Aviation Service after Borneo.


    # KENDARI


    Simultaneously with the attack on Balikapan, the Eastern Attack Unit based on
    Menado struck the important Kendari II in South-East Sulawesi. Here, the landing
    took place in the early morning (0422hrs). The same day, and at (1700hrs) the
    airfield was mostly undamaged. The REI Army garrison at Kendari had about 500
    men. The planned robust defence of the airfield did not take place due to weak
    leadership and a reluctant lack of willingness to fight. The NEI troops withdrew
    to the interior, where a large part deserted or were sent on leave. At least six
    NEI soldiers were killed on 24 January 1942.


    The IJN switched to Phase III operations on 24 January 1942. With the conquest
    of Balikapan and Kendari, Java came within flying range of the land-based bombers
    and fighters.


    # SINGKAWANG


    Because Kuing airfield did not meet Japanese expectations, the IJN put its hopes
    on the secret airfield discovered on 20 December 1941, Singawang II


