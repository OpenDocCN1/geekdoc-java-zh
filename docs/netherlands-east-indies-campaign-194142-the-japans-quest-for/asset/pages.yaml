- pgno: 75
  md: 'Kalidjati Airfield was one of the main Military Aviation operating bases. In
    1942, ABDA-AIR connected two squadrons to Kalidjati: No.8 (Bomber) Squadron RAF
    and No.1 (Reconnaissance) Squadron RAF Dutch Group also operated defence from
    the airfield. Ground-based defence was provided by 49th Light Anti-Aircraft Regiment
    (RAF) and units from 3rd Anti-Aircraft Battalion. On the morning of the Japanese
    landing, the 2nd RAF Army 3rd Regiment was relieved by 12th Battery, 6th Heavy-Aircraft
    Regiment (RAF) deployed in a ground-defence role alongside Dutch NEI units to
    evacuate the airfield. The British, however, were too slow. The photo of the airfield
    was taken between 1930 and 1942. By 1942, the field had been extended to include
    two runways of the lake at the bottom of the picture. To the right lies to Subang,
    the direction from which the Japanese approached the airfield. (Linden University
    Libraries, KITLV 49427)


    The city was an important crossroads. The unit turned south towards Rangkasbiteng
    at 12:30hrs. The N1 detachment at Rangkasbiteng, consisting of 10th Battalion,
    2nd Infantry Regiment, and two armoured cars, failed. It hastily retreated, with
    little of the intended delaying coming to pass. The Fukushima Detachment also
    landed at Merak. It was made up of the 4th Infantry Regiment (reduced). It took
    the bridge at Kalimajar via the Cijung River by surprise. The Sato detachment,
    consisting of the 29th Infantry Regiment, with the Fukushima in Bantam Bay.


    For West Commander, Major-General Schilling, the landings in Bantam Bay certainly
    came as no surprise. The Japanese advance along the southern route was considerably
    faster than expected. The two roads from Serang to Jakarta and Bogor diverged.
    An advance along both routes would only increase the distance between the enemy
    axes of advance. The rapid Japanese advance further increased the distance. According
    to Schilling, this offered an opportunity to achieve a limited success. He decided
    to concentrate his force against this southern axis of advance. However, because
    of developments at Kalidjati, he had to cancel his counterattack.


    The Shoji detachment landed from transport ships under the cover of a light cruiser
    and destroyers at Eretan between and 0430hrs in March. Instead of using infantry
    to secure the beach, Shoji deployed the tanks and trucks ashore. The Wakamatsuki
    Unit – 2nd Battalion, 230th Infantry Regiment with the 1st Company, Tank Regiment
    (less elements, comprising Type 95 Ha-Go light tanks) and with the transport company
    – landed and immediately rushed towards Kalidjati. The Egashira Raading Unit (1st
