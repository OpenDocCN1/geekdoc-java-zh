  md: 'counter-offensive was partly successful, but proved insufficient to stop the
    Japanese offensive. FEAF, in turn, carried out an independent counter-air operation
    against Bali after its fall. In addition to the offensive counter-air operation,
    Allied aircraft, in conjunction with anti-aircraft artillery, were deployed in
    a defensive counter-air operation: the air defence of the airfields, the main
    ports and the bay. By the end of February 1942, aircraft reinforcements were sent
    by ship to Java. However, the seaplane tender USS Langley was packed in crates
    and were yet to be destroyed.


    ![](img/52135db0eb5e64e74130266a9290cbf8_73_0.png)


    The amphibious landing of the Sato Detachment in Area No. 1, Sector C, Bantam
    near St Nicholas Point. A and B north and south of the Sunda Strait. The Japanese
    amphibious landings to take place in complete darkness and carried them out after
    moonlight, preferably on days when moon at dawn. On Tarakan, the landing was on
    a half-ebb tide. They used special landing craft. The unloading was done by trucks
    which turned out to be unprepared for it. After the ship at Merak failed on 4
    March 1942, the transport ships sailed from Bantam to Merak to continue with unloading
    (Main Newspapers)


    The Sixteenth Army''s operation from mid-February 1942 provided for simultaneous
    landings at dawn on 26 February West and East Java. The 48th Division landed at
    Kragan and captured Surabaya. The Sakaguchi Detachment also landed at Kragan and
    captured Cilac in Central Java. The 2nd Division landed in Bantam Bay. The primary
    goal was the conquest of Java. A powerful second force advanced to Bogor to capture
    this city. The Shoji Detachment landed at Eretan West, captured Kalidjati airfield
    by surprise and occupied the bridge over the Citarum River to block the road between
    Jakarta and Bandung. After the capture of Jakarta, the main body of the 2nd Division
    and the Shoji Detachment were to jointly attack the Bandung stronghold from the
    north. Bandung south. Depending on the circumstances, the ancillary forces for
    Bogor and the Shoji Detachment would occupy Bandung in one go. In February 1942,
    this would have cut off the reinforcement and supply route to Java.


    On 26 February 1942, the two Japanese invasion fleets approached Java from the
    bases at Cam Ranh Bay and Jolo. The Western Landing Unit comprised 56 transport
    ships and 27 warships. The Eastern Landing Unit counted 38 transport ships for
    the 48th Division and for the Sakaguchi Detachment. This unit was spotted on 25
    February 1942 at the Balikpapan anchorage. The Allied Combined Striking Force
    sailed from Surabaya to search and attack the Eastern Transport Fleet. The transport
    ships found not. However, the squadron encountered the Japanese escort unit. The
    resulting Battle of the Java Sea followed on 27 and 28 February 1942, IJN controlled
    the waters around Java. With this success, the one-day.


    On the night of Saturday 28 February to Sunday 1 March 1942, the invasion had
    begun. The Western Landing Unit came ashore at two locations in West Java. The
    Sixteenth Army HQ and the 2nd Division landed in a much at Merak from 0200hrs.
    The Shoji Detachment landed in Area No. 2 about 200km east of Eretan Wetan. The
    Asault Assault Force, and Nie Wiel with


