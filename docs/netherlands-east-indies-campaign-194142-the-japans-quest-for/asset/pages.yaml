    # OPERATION T (NORTHERN SUMATRA)


    After the conquest of Palembang and the advance to Bandar Lampung, the JJA 38th
    Division had captured Bengkulu and Djambi respectively on 24 February and 4 March
    1942. Central and North Sumatra were still in Dutch hands.


    The NEI troops in North and Central Sumatra supported lightly armed garrison infantry
    with militia, Home and Town Guards. Tactical units did not exceed one or more
    brigades of 20 men. Even before the Japanese resistance against Dutch colonial
    authority erupted in February 1942. The RNI Army troops were then largely deployed
    to quell this, also as the Japanese landings protected the evacuation of the European
    population and relatives of Indonesian soldiers.


    On 12 March 1942, the IJA Imperial Guard Division landed in four locations on
    North and East Sumatra as planned. The NEI units suffered from large-scale desertion
    among Indonesian soldiers. European troops maintained their cohesion, but lacked
    any fighting spirit. On 28 March 1942, the remaining NEI capitulated.


