  md: '# CHRONOLOGY


    # 1941


    # 1942


    1 December Military Aviation Service of the Royal Netherlands East Indies (RNEI)
    Army (Wapen der Militaire Luchtvaart van het Koninklijk Nederlands-Indisch Leger,
    ML-KNIL) is mobilized.


    10 January General A.P. Wavell and his staff arrive at Batavia (Jakarta).


    11 January Japan declares war on the Netherlands.


    7/8 December Japanese attacks on Pearl Harbor, Mal, Hong Kong and the Philippines.


    Japanese landings on Tarakan and at Menado. Menlo is taken.


    8 December The Netherlands declares war on Japan.


    HQ 26th Field Artillery Brigade and 22nd Battalion, 131st Field Artillery Regiment
    (both US Army) disembark at Surabaya, Java.


    Partial NEI disembarks in outlying areas, and of coast, anti-aircraft artillery
    and searchlight on Java, Madura, Bali and Lombok.


    12 January RNEI garrison in Tarakan surrenders, formalized the following day.


    9 December NEI troops turn out for the mobilization.


    American-British-Australian Command (ABDACOM) is activated.


    Aircraft Group (Vliegtuiggroep, VLG.) and a fighter squadron of the RNEI Military
    Aviation Service are stationed in Singapore.


    18 January Transfer of HQ No. 25 (Bomber) Group (RAF) from Singapore to Palembang,
    Sumatra.


    10 December Destruction of British naval Force Z: Prince of Wales and HMS Repulse
    are sunk by Japanese attack.


    Japanese amphibious landings at, and capture of, Balikpapan (East Borneo) and
    Kendari (Sul).


    11 December General mobilization of the RNEI Army.


    27 January Naval engagement at Balikpapan.


    12 December NEI troops turn out for the general mobilization.


    Japanese capture of Singawang II Airfield (West Borneo).


    Sparrow Force disembarks on Timor.


    30 January Japanese occupation of Pontianak, West Borneo.


    16 December Japanese landing and capture of Miri, British Borneo.


    31 January Japanese amphibious landings on Ambon and conquest of Ambon City.


    17 December Gull Force disembarks on Ambon.


    Main body of RNEI army troops surrenders on Ambon.


    Netherlands-Australian expedition disembarks at Dilly, Portuguese Timor.


    Formation of HQ No. 226 (Fighter) Group (RAF) in Palembang, Sumatra.


    24 December Japanese landing at Kuching, British Borneo.


    2 February Arrival of 6th Heavy Air-Aircraft Regiment (reduced) and 78th, 35th
    Light Air-Aircraft Regiment (RA) in Palembang.


    27 December Japanese forces occupies the NEI Tambelan Islands in the South China
    Sea.


    2 February Surrender of Gull Force on Ambon.


    29 December 19th Bombard Group (USAAF) transfers from Australia to Malang, Java.'
