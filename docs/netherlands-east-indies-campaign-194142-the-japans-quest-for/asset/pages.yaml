- pgno: 18
  md: 'The IJA successfully conducted a daring offensive. Due to the aggressive and
    mobile action undertaken, the IJA seized the initiative and kept it for the duration
    of the entire campaign. Its opponents were not given the opportunity to build
    an effective defence or to deploy sufficient reinforcements. The Southern Offensive
    was carried out on an operational level to the degree acquiring superiority; conducting
    an amphibious landing, sometimes in combination with an airborne operation; capturing
    an airfield; and preparing the airfield, into which army and navy forces deployed.
    This process was repeated. Using this approach, Japan secured its air and naval
    advantage. The various attack units could support each other if necessary. It
    kept the Allies off-balance and concentrated counter-attack. Amphibious landings
    occurred shortly after midnight, and were often executed in several places simultaneously.
    Fortified coastal strips were avoided. After the landing, little time was spent
    on consolidating the position, with units pushing directly inland. The emphasis
    was on speed, with advances by road. On Java, the divisions and Sakaguchi detachment
    operated along two parallel axes. Tanks were the well disciplined and quick to
    act. The infantry deployed only after first contact. If that did not work, an
    event was made to immediately eliminate the opponent. If threatened by encirclement,
    the enemy usually broke tact. Cohesion was strictly maintained. Japan''s military
    was well trained. This operational and tactical performance proved to be extremely
    effective.


    The Combined fleet was organized into several subfleets. Task forces were formed
    for fleets operations. The Southern Task Force was formed for Operation-O and
    was the naval equivalent of the Southern Army. During the attack on Malaysia and
    the Philippines - the Phase I operations – it consisted of the Main Unit, Philippines
    Unit, Air Unit and Submarine Unit. During the Phase II operations – the attack
    on the Netherlands East Indies – most of the Philippines was transferred to the
    newly formed Netherlands East Indies.


    Historically, the IJN focused on fighting a decisive naval battle. In the Southern
    Offensive, the IJN would control its opponent using advanced air bases. For the
    new amphibious and construction tasks, by the end of 1941 the IJN had formed nine
    battalion-sized Special Landing Forces (SLFs), including two parachute-trained
    SLFs, and six operational construction units for the expansion of airfields.


    The advanced air bases had to be captured from the enemy and made suitable for
    Japanese operation. The latter turned out to be more difficult than expected.
    The airfields mostly consisted of grass and were too waterlogged to hold the weight
    of the aircraft due to the heavy rainfall during the wet season. The runways were
    often too narrow and too short. For Japanese fighter planes, runways had to be
    at least 100m, 1,000m long and able to support a weight of three tons. For medium-sized,
    land-based aircraft, a length of 1,200m was required. The new construction units
    comprised ten officers, 20 administrative staff and, depending on the task, up
    to 3,000 military workers. However, these units lacked modern construction material.
    The commissioning of captured airfields took longer


    ![](img/52135db0eb5e64e74130266a9290cbf8_18_0.png)


    This youthful Japanese member of the Special Landing Forces is dressed in the
    SLF Model 38 (1905) uniform. His weapons comprise the 6.5mm Type 38 Araka rifle
    with mounted bayonet Model 30 (1897). He carried a set of 99-cartridge pouches.
    Others were seen behind him on his right and on his left in a haversack. He has
    a helmet with a fabric cover with camouflage. The SLF soldiers were elite troops,
