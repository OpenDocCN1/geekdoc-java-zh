  md: '# MOVING SOUTH


    The Japanese occupation of the southern Chinese island of Hainan in 1939 and the
    deployment of troops in northern French Indochina in 1940 and southern French
    Indochina in July 1941 brought the British possessions of Malaysia and Singapore,
    and the Netherlands East Indies, within reach of Japanese land-based aircraft.
    It also put further pressure on the Netherlands to meet the Japanese requirements.
    However, this move southwards towards a fierce response from the United States.
    It froze Japanese assets on 26 July 1941. A total shutdown of oil supplies was
    not intended, but in fact the American response boiled down to that. Great Britain
    agreed to it, and the Netherlands reluctantly followed, aware that taking agreed
    to the embargo meant with Japan.


    Japan''s faced with the feared oil embargo, and its attempt to peacefully create
    an alternative in the form of increased supplies from the Netherlands East Indies
    had also failed. For Japan, in light of the US economic stranglehold, only two
    choices remained open: yield to US demands, or to acquire the necessary raw materials
    by force. Japan chose the latter. The American policy to keep Japan from further
    expansion in South-East Asia through economic and military pressure failed.


    For Japan to have a chance to win a military conflict at all, it would need to
    act in 1940-41. The war in Europe had severely weakened its potential opponents
    and/or tied down their forces elsewhere. The balance of power had shifted in favour
    of Japan. With the Two-Ocean Navy Act of July 1940, the US had initiated a major
    naval construction programme. Japan saw a window of opportunity. It was now or
    never.


    Tarakan is a small, hilly and jungle-covered island off the coast of Borneo. The
    crude oil that was extracted from the island was sold directly as without refining.
    Tarakan accounted for of total NEI petroleum production. and an oil tank farm
    for storage. The image shows derricks probably at Pamusian c. 1940. (Leiden University
    Libraries, KITLV 176860).


