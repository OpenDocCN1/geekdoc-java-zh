- pgno: 32
  md: 'With that, the cornerstone of British defence in the Far East was removed.
    Britain''s position was so weak that, according to the historian H.P. Willmot,
    ''the British regarded the Dutch not so much as a weak ally that helped but as
    a force of support that could be tapped in an effort to boost Britain''s own position''
    (1982, p. 121). On the list of priorities the United States were Pearl Harbor,
    Australia, the Philippines and keeping nationalist China at war. For both allies,
    Australia was essential for the reconnaissance of South-East Asia. Ultimately,
    the Netherlands Indies were left to fend for itself.


    The RNE Army leadership disagreed with the underlying assumption of the 1927 Principles
    of Defence. In the event of a war in the Pacific, the RNE Army expected to face
    a targeted conquest against Java, on account of its naval base and oil sites.
    Given the size of the archipelago and the available resources, the RNE Army leadership
    opted for the territorial defence of:


    +   1. Java with the seat of government, naval base and key army and navy institutions;

    2. Naval and aircraft support centres in the Outer Regions;

    3. The major areas involved in the extraction of strategic raw materials.


    The RNE Army developed an operational doctrine of indirect coastal defence in
    depth and using horizontal bombers. The air arm was the first line of defence,
    to prevent any enemy transport fleet from reaching Java. The navy formed the second
    line of defence, and the army third. Both were intended to attack transport ships
    landing troops, not Japanese warships. ''Only landing troops can occupy a support
    point in an archipelago. Warships never! ... A war is fought with a ship, not
    an airplane.''110 This demonstrates the full potential of the air arm had to be
    realized.


    The required airfields were constructed in the Outer Regions. These airfields
    formed three lines of resistance. The one ran from Sabang and Medan over Tarakan
    in Borneo and Longao (Menado) in Sulawesi to Bajo in Western New Guinea. The second
    line was formed by the airfields Pakarang on Sumatra, Singawang II and Samarinda
    II on Borneo, Kendari II on Sulawesi, Ambon II and at Kupang on Timor. Palembang
    I Airfield in Sumatra, the airfields in Java and Den Pasar in Bali formed a final
    resistance line. In peacetime, the aircraft groups were stationed in Java. Allocation
    of aircraft to the Outer Regions was temporary and on a second basis.


    The Royal Netherlands considered the new role of the Military Aviation Service
    to be in contradiction with the 1927 principles. It pointed to risk that the airfields
    could be captured by the enemy and used for an attack on Java. The RNE Army planned
    to reduce this risk by constructing the airfields inland and not on the coast,
    and by preparing for their destruction if need be. Some of the airfields were
    constructed in secret. For a long time, the Japanese were unaware of the existence
    of Singawang II, Samarinda II and Palembang II airfields. However, the novelty
    proved correct.


    After 1940, the primary task of a number of detachments in the Outer Regions became
    the defence of the airfields and/or oil installations. Maintaining order and peace
    became a secondary priority. Numerous'
