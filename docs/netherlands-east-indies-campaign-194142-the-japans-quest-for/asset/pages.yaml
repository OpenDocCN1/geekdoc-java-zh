  md: 'On 2 March 1942, Major-General Cox had to give up his best battalion, the Left-Half
    21st Infantry Battalion, to Bandung Group.


    The remaining units of the 2nd Division of Home Guard, Town and Rural Guards and
    Veteran Reserve Corps elements with low combat value. were tasked with offering
    resistance on the outskirts of the built-up areas of Surakarta, Yogyakarta, Semarang
    and Magelang, without this developing into sustained fighting, and without rendering.
    The aim was to stop the Japanese advance. The roads from the north to the south
    coast had their bridges destroyed and were partially blocked with fallen trees.


    The Japanese advance progressed smoothly, and was only delayed by the state of
    the roads. No significant opposition was encountered from the NEI territorial
    troops. Sakaguchi sent his main force, the Yamamoto Echelon (HQ 146th Infantry
    Regiment and three companies) along the Kanauji Echelon, from Yogyakarta to the
    coast directly reached the river in the south. On 5 March, he defeated the Matsumoto
    Echelon (3rd Battalion, reduced) towards Magelang.



    ![](img/52135db0eb5e64e74130266a9290cbf8_87_0.png)


    A number of roads were blocked by the NEI troops using obstacles such as fell
    trees or crates packed with rubble, and bridges destroyed barriers slowed the
    Japanese advance down significantly. The NEI territorial troops did not offer
    much resistance. In the last week of 1942, Central Java was largely cleared of
    NEI troops. This motorized column of the South Java Army is shown on the march
    Kragan: A Type 1 four-wheeled, 2.72-ton Toyota truck heads the column. (Mainichi
    News-paper.)


    At Surakarta and Magelang, a large number of NEI troops were captured. The Kanauji
    Echelon reached the Serayu River on 6 March. However, all bridges had been destroyed.


    desertion. One night, virtually an entire company of the Mangku Negro Battalion
    defeated. In the evening of 7 March 1942, the Japanese crossed the river in the
    south. Group South offered little resistance and was ordered to withdraw. Gilac
    was captured in the morning of 8 March 1942. The fight for Central Java was over.


    # East Java


    The conquest of East Java was assigned to the IJA 48th Division. This motorized
    division was deployed as part of the Fourteenth Army in the attack on the Philippines.
    After the capture of Manila, the formation was taken out of the line and prepared
    for shipment. Based on its experience in the Philippines, the 48th Division''s
    leadership convinced Sixth Army to the operational plan for Java by reducing the
    number of landing points from two to one and concentrating on objective: Surabaya.
    The Lieutenant-General Yuitsu Tsuchibashi, the commanding officer of 48th Division,
    wanted to quickly secure the points over the Solo River and the oil installations
    at Cepu. Making most of his mobility, he then made a rapid advance with force
    towards the Brandas River. He expected the decisive battle to take place. After
    the enemy forces, he would capture Porong and attack Surabaya from the south.
    Diversions planned along the Solo River. The division was originally equipped
    with sufficient motor vehicles to transport one-third of the infantry. In the
    Philippines, however, enough vehicles were used to transport the entire division.


