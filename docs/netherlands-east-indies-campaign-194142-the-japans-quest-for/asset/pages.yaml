  md: '![](img/52135db0eb5e64e74130266a9290cbf8_65_0.png)


    # ABOVE LEFT


    Japanese paratroopers of the 1st Company, 2nd Raiding placed flags on two of the
    four distillation towers of Reformant at the Plaju Refinery near Palembang. The
    NEI counter-attack, these flags were removed by an officer and two Cyclone soldiers
    of 20th Company, Indonesian Infantry Battalion. Here, Indonesian soldiers returned
    to Jakarta (Java) from Sumatra, February 1942. (Beebilback WW II - NOOD)


    # ABOVE RIGHT


    The RAF retreated to Palembang II. Air Commodore Hunter soon also had Palembang
    cleared. The RAF then withdrew to Bandar Lampung road and rail. This retreat was
    chaotic. Equipment and unit cohesion were both lost. In contrast, the 6th Heavy
    Anti-Aircraft Regiment and 10th Infantry Battalion, with 400–500 territorial troops,
    withdrew in an orderly manner, although 6th Heavy Anti-Aircraft Regiment subsequently
    had to leave behind the remaining guns. The 10th Infantry Battalion conducted
    a rearguard action against the Iwuchi Unit on 18 February 1942 in Martapura. The
    Japanese failed to cut off the retreat in time. After a short firefight, 10th
    Infantry Battalion broke the action.


    Contrary to reports, Japanese river-ending units did not reach Palembang until
    the evening of 15 February 1942. That evening, with the 2nd Raiding Regiment established.
    On the 16th, contact was made with the paratroopers at the refineries. On the
    evening of 16 February, the Main Unit of 38th Division anchored at the mouth of
    the Musi River, but did not reach Palembang on the 20th. Palembang was only discovered
    by the Japanese on 16 February.


    In the late afternoon of 15 February 1942, all forces in Singapore surrendered.
    The fall of Singapore, as ABDACOM warned, led to a change in programme. The troops
    that had arrived at Bandar Lampung were ordered not to disembark. Convoys JS1
    and JS2 had to sail to Tanjung Priok and await further orders. ABDA-AIR ordered
    the evacuation of RAF personnel via Bandar Lampung. The troopsvarrho their ships.
    South Sumatra was given up relatively quickly by ABDACOM.


    The river component of the assault on Palembang was commanded by three divisions,
    two of which were ordered to make contact with the paratroopers. The burning along
    the River can be seen. This unit is likely the one that ascended the Musi River
    (the column), or the follow-on 30th Division troops. (unlisted: Getty Images)'
