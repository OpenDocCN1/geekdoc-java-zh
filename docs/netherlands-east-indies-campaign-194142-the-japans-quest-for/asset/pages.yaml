- pgno: 50
  md: 'Corps and detachments outside Ambon. In addition, four APCs were also sent
    to Ambon. The garrison there featured the Indonesian Militia Battalion and Town
    Country Guards. In total, it was about 2,600 men strong. In addition to these
    troops, the Military Aviation Service stationed a patrol of three fighter aircraft
    at Laha. The Royal Netherlands stationed a squadron of seaplanes on Ambon.


    To bolster the defence of Laha, the Australian Gulf Force arrived on 1st December
    1941, consisting of HQ Gulf Force; the reinforced 2/1st Battalion; C Troop, 18th
    Anti-Tank Battery; a section of engineers from 2/11th Field Company; and some
    support, with a total strength of c. 1,170 men. An Area Combined Headquarters
    was established for the command of RNEI and Australian forces. On Laha, Gulf suffered
    particularly from malaria and dysentery. Two weeks prior to the Japanese invasion,
    the commanding Gulf Force was replaced by Lieutenant-Colonel W.J.R. Scott. The
    collaboration between the latter and the NEI territorial commander left much to
    desired.


    The IJN waited to sever the Allied airflow Ambon-Kup line of communication. As
    part of the elimination of Allied firepower in preparation for the attack on Menado,
    the IJN 21st Air Flotilla bombed Ambon. This was the beginning of a series of
    strikes, followed by armed reconnaissance. Shortly before the landings, new air
    raids followed, this time by carrier-based aircraft. Under Japanese pressure and
    the now-reconnoitred invasion fleet, ABDCOM ordered the withdrawal of the remaining
    air units on 27 January 1942.


    The NEI territorial commander, Lieutenant-Colonel J.L.R. Kapitz, followed a plan
    based on the fixed defence of coastal positions by the NEI troops, the defence
    of Laha Airfield by part of Gulf Force and the formation of a covering general
    reserve by the rest of Gulf Force and part of the NEI troops. On 10 January 1942,
    as proposed by Kapitz, it was decided that Gulf Force would defend the southern
    part of Lautim around Laha. Landings on the south-east coast of Lautim were not
    expected. The mountain plains of the south-east coast were defended by three positions
    manned with semi-trained Indonesian militia sections. In view of the terrain,
    the NEI-Australian plan was mainly defensive in nature.


    When it became clear on 30 January 1942 that the Japanese would land in the south,
    Kapitz expected it to take place at Passo. He moved the centre of gravity of the
    defence to the position with three companies, the machine-gun company and a militia
    section. This position was worth Ambon City on the isthmus between Hitu and Lautim.
    With this, Kapitz increased the distance from Gulf Force in the south. The Allied
    forces further fragmented by this, could be defeated piecemeal by any powerful
    opponent.


    The Eastern Task Unit and the Air Force of the Southern Task Force carried out
    the attack on Ambon. The 2nd Carrier Division was placed under the command of
    the Air Unit. It was a considerable force. Between 0240 and 0520hrs on Saturday,
    31 January 1942, Japan''s Eastern Detachment (fo Detachment), consisting of the
    228th Infantry Regiment, 38th Division, landed from Hong Kong via Davao on the
    undef southeast coast of Ambon. This threatened the rear of the heavily fortified
    bay at Ambon. After the successful landing, the left unit, the main force, crossed
    the mountain ridge in two parallel columns under jungle heavy rainfall and a stormy
    westerly wind (Beaufort Force 8). The weather'
