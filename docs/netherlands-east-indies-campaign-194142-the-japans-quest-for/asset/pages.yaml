- pgno: 42
  md: 'The preparation of Tarakan Airfield was seriously delayed. As a result, the
    IJA and IJN were not only forced to postpone the attack on Balikpapan for three
    days, but also to cancel the planned deployment of patroopers. To take the oil
    installations (almost) intact, Sakaguchi sent two Indonesian battalions of war
    with an ultimatum to Balikpapan. Destruction of natural resources and facilities
    would be punished with death for the Dutch military. In addition, Sakaguchi adjusted
    the operation plan. Using a surprise, one unit would infiltrate the hinterland
    via the river, and cut off the retreat route. The garrison would soon be forced
    to surrender. Two Indonesian police officers from Tarakan were later to have acted
    as guides. On 16 January 1942, Japanese fighters were stationed at Tarakan. Two
    days later, they began strikes against Balikpapan.


    Balikpapan was an important oil port in eastern Borneo, with a refinery a large
    tank farm (160 tanks). The city was located on a large bay surrounded by swamp
    and heavily overgrown country. The Nei garrison, running 1,200 men, composed of
    the 6th Infantry Battalion, a field battalion (reduced) with two infantry companies
    and a machine-gun company, and the 2nd Coastal and AA Artillery Company. The garrison
    was ordered to defend Balikpapan by coup de main, and to conduct a delaying action
    to gain time to carry out the destruction of the facilities. If Balikpapan fell
    into enemy hands, the order was to wage guerrilla.


    The commander of the Nei troops, Lieutenant-Colonel C. van den Hoogen, did not
    respond to Sakaguchi''s ultimatum and immediately began destroying the infrastructure.
    Once the oil facilities were out the REI Headquarters demanded withdrawal of the
    garrison, chiefly to Banjarmasin. However, at the time of the Japanese landing,
    a decision was to be made.


    The Sakaguchi Detachment landed at 0240hrs on 24 January 1942 at three locations
    outside the defended coastal areas. The destroyed and vacated Manggar Airfield
    and the Samboja drilling site were captured without resistance. The advantage
    towards the city was severely affected by road demolitions. The landing in the
    north bay of the city threatened the garrison in the rear. Following the progress
    in destroying the oil infrastructure and the threat of being cut off, Van Hoogenhead
    decided not to defend Balikpapan. He broke the fight and retreated with 700 men.
    In view of the destruction carried out, Sakaguchi fulfilled his threat. On 20
    February 1942, 78 civilians and prisoners of war were executed on the beach.


    ABOVE LEFT

    The Menado II Airfield (Lagoon) under airborne attack by the 1st Yokosuka SLEF.
    The Japanese paratroopers jumped directly onto the target from an altitude of
    150m. The airfield was still under construction; but the support fighter aircraft,
    The Japanese put the airfield into operation immediately. On 16 January 1942,
    the HQ of the 21st Air Fleetilla moved to Davao. (Main source: Wikipedia)


    ABOVE RIGHT

    A light machine-gun section of the 1st Yokosuka SLEF fired by an officer, position
    at Menado II Airfield (Lagoon). The group weapon was a Type 96 (1936) 6.5mm Light
    machine gun. The machine gunner wears the Japanese of 2nd class. (Public domain)'
