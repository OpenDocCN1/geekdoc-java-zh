  md: 'this role, but this airfield was not made ready in

    ine. Eventually, Operation L was scheduled to

    commence 15 February 1942.


    To destroy Allied airpower in Sumatra

    and also to suppress it on Java, the IJA and

    IJN the operating area across the line

    Muntok-Palembang on 28 January 1942. The

    IJA wanted to defend the west and the IJN to the

    east of this line. Following preliminary attacks,

    3rd Air Division launched a major offensive

    over Sumatra from 6 February to 13

    February 1942 to gain local air superiority. The

    22nd Air Flotilla flew missions over Bangka and

    Belitung. The Japanese aircraft subsequently believed

    that the bulk of the Allied aircraft had been destroyed. This turned out to

    be premature.


    Despite the losses suffered, the British still had the following aircraft

    available on the day of the Japanese landings: 24 Hurricane fighters, 31

    Lockheed Hudson bombers and 36 Bristol Arnhem MK I and MK IV

    light fighters. Many of the Bene were unsuccessful. Palembang II was

    ot discovered by the Japanese as a base, and was therefore available for the

    deployment of fighter aircraft and bombers. In all of, there was no question

    of Japanese supremacy.


    Operation L, as predicted by Lieutenant-General Lavack, was a

    combined airborne and amphibious/river attack. The IJA had specifically

    trained the 1st Raiding Regiment (an airborne unit) for the conquest of

    Palembang. The 1st Raiding Regiment turned out to be unavailable because

    it had lost armour and equipment in a shipping accident in early January

    1942 and also was struck by an outbreak of paratyphus fever. As a

    result, the 2nd Raiding Regiment, still in training, was deployed. A raiding

    regiment consisted of four companies of 160 men and actually had the

    strength of a battalion.


    The 1st Raiding Group was not strong enough to simultaneously attack

    hold the three chosen objectives, the airborne and the two refineries.

    Southern Army prioritized the capture of the airfield. If the refineries

    were to be captured before the Allies could destroy them. But even now, the

    avavailable forces were too small for three objectives. Moreover, the group had

    to hold the objectives until the arrival of the main force of the 38th Division

    (scheduled for L-2, Day L marking the amphibious landing on Bangka). The

    airborne landing was scheduled for L-1.


    The 38th Division was tasked with capturing Palembang city. The losses

    it suffered during the taking of Hong Kong had been made good.

    Nevertheless, the division was not at full strength. Two detachments were

    formed from its ranks, to be deployed: the Eastern Detachment\and Shooji Detachment.
    For the Palembang operation, the 38th Division

    therefore consisted of a core of four infantry battalions of the 229th Infantry

    Regiment. An independent transport battalion, a shipping engineer

    and special units, including an oil-drilling unit, went under

    is control.


    Under Admiral Jisabu Ozawa, the IJN provided large-scale

    maritime support to Operation L Ozawa''s Malaya Unit (First Southern


