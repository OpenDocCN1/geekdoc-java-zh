  md: '# OPPOSING COMMANDERS


    As commanding officer of the newly formed Sixteenth Army, the 55-year-old Imam
    was tasked with conquering the Netherlands East Indies. A skilled organizer, his
    operational plan was extremely daring. When landing on Java, his ship was torpedoed
    by friendly fire; he was pitched into the oil-covered water, and rescued some
    hours later (Manila Newspapers)


    # JAPANESE


    Lieutenant-General Hitoshi Imamura (1886–1968) was the commander of the Sixteenth
    Army in 1942. He became an officer in 1907. Imamura had inside knowledge of the
    British Army; in 1917, he was posted to London for three years as Deputy Military
    Attaché, and in 1927 he was an attaché in British India. In addition to these
    foreign postings, he gained staff experience with the Operations Section of the
    Imperial Japanese General Staff and with the staff of the Kwantung Army in Manchuria.
    He had operational experience in China as a regimental and division commander.
    From 1940 to June 1941, he served as the deputy chief of the influential Inspectorate
    General of Military Training. On 6 November 1941, his appointment by the emperor
    of the Sixteenth Army followed, a prestigious assignment. He was the final piece
    of the Southern Offensive. Due to the great distances and loss of its signal equipment,
    Imamura had limited command and control over the Sixteenth Army during the campaign
    in Java.


    After the war, he was charged with war crimes by the Australian government. He
    was found guilty and sentenced to ten years'' imprisonment. In 1948–49, the Temporary
    Courts-Martial in Jakarta brought him to trial for war crimes in Borneo and Java.
    However, he was acquitted.


    Imamura was known in the Japanese military for his ''bravery as a commander with
    a resolute and indomitable fighting spirit''. He was a skilled organizer and willing
    to take great operational risks. The landing of the Shoji Detachment was decisively
    daring, but also bordered on reckless.


    Colonel Toshishige Shoji (1890–1974) was commander of the 230th Infantry Regiment,
    38th Division in 1941. This regiment took part in the conquest of Hong Kong in
    December 1941 and in March 1942. Imamura personally chose Shoji to lead an important
    second operation in Java with a small regimental battle group. He trusted that
    Shoji would act


