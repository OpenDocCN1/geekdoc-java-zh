  md: 'consisting of the 48th Division and the Sakaguchi Detachment, landed near Kragan
    in East Java.


    The landing zones were far apart. This meant that the Java campaign would consist
    of widely separated operational areas. This made it difficult for the Twentieth
    Army to direct the troops in Central and East Java in particular. To allow these
    troops to operate independently, special units and equipment were added, clear
    operational instructions were provided, and a special staff officer was posted
    to the headquarters. This control problem was exacerbated by the loss of Twentieth
    Army communications and codebooks upon landing. Without means of communication,
    General Imamura lacked command and control over the Twentieth Army during the
    campaign in Java.


    The defenders'' intelligence position on Java was unequivocally terrible. On 1
    March 1942, it was estimated that the Japanese had landed with two divisions in
    West Java. At least two divisions would have landed at Kragan. On 4 March 1942,
    this number was adjusted upwards: four inantam, one Indramayu (Eretan Wetan) and
    in East Java two between four divisions. In fact, the Java Army and the Seventeenth
    Army were roughly the same strength, as indicated in Data 10.4


