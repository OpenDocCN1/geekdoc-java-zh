- pgno: 70
  md: 'The presence of NEI and Australian troops in Portuguese Timor made Japan question
    how it would deal with this neutral territory. The Imperial General HQ wanted
    to avoid conflict with Portugal. However, the Southern Army (IJA) and Southern
    Task Force (IJN) agreed that Allied forces in Dilly posed a threat to the attack
    on Kupang. They had to be driven out. Dilly thereafter had to remain in Japanese
    hands as an important base for operations against Darwin. The Sixteenth Army objected
    to the simultaneous actions on Timor. It wanted to concentrate its forces on the
    conquest of Kupang. It referred to the unsuccessful attack on Laha in the operation
    against Ambon. The Imperial General HQ ended this discussion.


    On 20 February 1942, the Eastern Detachment with the reinforced 2nd Battalion,
    22th Infantry Regiment (led by commander Colonel Sadashachi Doi) planned a direct
    attack on Dilly. This failed due to NEI artillery and machine-gun fire. Colonel
    Doi modified his plan and landed just a kilometre to the west. The amphibious
    landing took place at 021hrs. The main force started a frontal attack on the airfield,
    with the 5th Company conducting an envelopment and the 7th Company (reinforced)
    turning movement to the south of Dilly. Lieutenant-Colonel Van Straten reinforced
    the airfield defences. His retreat route was, however, threatened. Some of the
    NEI troops had fled. In addition, he could not call in the 2nd Independent Company
    because of a breakdown in communications. The Australians would not learn of the
    landing until around 090hrs. On seeing the fleet, Van Straten estimated the Japanese
    strength to be 4,000-5,000 men. At 0800hrs, he decided to make a general retreat
    towards 2nd Independent Company. By the end of the morning, Dilly was in Japanese
    hands.


    The IJA''s losses amounted to seven killed. 24 soldiers lost their lives: eight
    NEI men and 16 Australians. The number of Allied prisoners was 33.


    The defeated Australian and NEI troops from Dutch and Portuguese Timor retreated
    into the mountains. They eventually started a guerrilla campaign. However, that
    story is beyond the scope of this book.


    With the capture of Timor, and the Carrier Task Force in the waters of Java, the
    island''s encirclement was complete. It was now cut off from reinforcements from
    Australia. Within a week, Japanese troops would land on Java.


    # JAVA (OPERATION H)


    On 19 February 1942, on Wavell''s advice, the Combined Chiefs of Staff decided
    to stop sending troops to Java as reinforcements. The Australian army corps would
    be sent to Australia and Burma instead. On its way to Java was therefore longer
    to be shipped to Java. The island was thus, to all intents and purposes, given
    up. Wavell reassigned as Supreme Commander, closed his personal headquarters and
    left Java on 25 February 1942. Dutch officers took command. Lieutenant-General
    H. te Poorten, already became the commander-in-chief ABDA-ARM. On Java, ABDA-AIR
    was renamed Java Air Commander (JAC) with Major-General L. van Oijen at his head.
    Vice Admiral C.E.L. Helfrich was from 14 the commander of ABDA-FLOAT.'
