- pgno: 30
  md: '# NETHERLANDS EAST INDIES


    From 1913 onwards, the Netherlands considered Japan as a potential enemy. Japan
    pursued political and economic expansion, and it had the – a powerful fleet and
    army – to do. The Netherlands expected that Japan’s striving for extension of
    its authority could not be achieved on the Asian mainland. It therefore had already
    taken into account that ‘Japan will turn to the South’.


    The Netherlands East Indies consisted of a chain of many islands. For the defence
    of this archipelago, the preservation of air superiority and control of the sealanes
    was essential. A significant air force and fleet could prevent an enemy from acquiring
    the archipelago and naval bases. The great distances and fragmented shape of the
    archipelago prevented coordinated defence. It gave an attacker with air and naval
    superiority the opportunity to neutralize a strongly defended island by capturing
    a supporting location on another island. Java was the main island and the DEI
    administrative centre, and by far the most inhabitants. Its island form was narrow
    and elongated. Its strategic locations were also spread throughout the island.
    The administrative centre was in West Java, and the naval base in East Java. This
    called for a robust defence, but at the same time made a concentrated defence
    of the main island extremely difficult.


    Until around 1900, the defence of the NEI was based on the defence of Java. New
    Principles of Defence (Defensiegregels) were established in 1927. This new doctrine
    broke with the previous one in one or two areas. Protecting the Netherlands East
    Indies no longer focused on defence, but instead on maintaining neutrality. The
    Netherlands East Indies was no longer to fear an attack at coast; rather, it was
    to guard against a coup de main. The defence plan was then primarily aimed at
    maintaining Dutch authority in the NEI colony. The second point of divergence
    from the former plan was the doctrine. Tarakan and Balikpapan were identified
    as particularly vulnerable points due to the extraction and refining of petroleum
    trees. The RNE Army was responsible for maintaining neutrality in Java with the
    support of the Royal Navy. In the Outer Regions, this task was assigned to the
    navy, with support in some locations from the army. The NEI unexpectedly became
    involved in an armed conflict between the major powers, resistance was to be offered
    until help from a foreign ally or allies was forthcoming. In fact, with the Principles
    of Defence 1927, the Netherlands acknowledged that it did not have the means to
    successfully defend the Netherlands East Indies independently against Japanese
    aggression.


    The 1927 Principles of Defence were particularly flawed regarding the threat assessment
    and the evaluation of foreign (viz. British and American) support. The support
    from a supposed alliance lay beyond the Netherlands’ control. The Washington Conference
    of 1921–22 was said to the RNEI Army, nothing could be further from the truth.
    The agreed ban on the construction of maritime bases and the development of the
    naval base in Singapore only increased the strategic importance of the Netherlands
    East Indies. However, preservation of the NEI was a priority for neither Great
    Britain nor the United States. Firstly, Britain’s priorities lay in the Far East
    with India and Singapore. Secondly, Britain-land lacked the required resources.
    Due to the war in Europe, it was unable to send a significant naval force to Singapore.'
