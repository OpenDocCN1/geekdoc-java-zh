- pgno: 59
  md: 'Japanese paratroopers jumping from Airy Type-100 Transport Model 1 (Mitsubishi
    Ki-57) planes. Allied codename Topsy. This aircraft had a crew of four and carried
    11 paratroopersably the 3rd Company, 2nd Regiment (90 men) that jumped on 15 February
    1940 over Palembang Airfield. (Keystone-France/Gamma Photo via Images)


    Expeditionary Fleet provided the Main Unit and two Escort units. The 1st Air Unit
    and the 22nd Air Flotilla provided air support to the transport. The 2nd Air unit
    support to the transport fleet, guarded Bangka and Palembang anchorage, and supported
    the operation upstream of the rivers. The 4th Carrier Division formed the 3rd
    Air Unit and had to guard against Allied ships. The 9th Base force delivered the
    raid-ascending unit.


    On Saturday morning, 14 February 1942 at 112hrs, the paratroopers of the 2nd Raider
    Regiment jumped up, consisting of the regimental headquarters, signal unit, 4th
    Company and half the 2nd Company (180 men), 3km to the south, and two platoons
    of company (60 men) landed immediately after Palembang. The airfield defenders
    were kept in by aerial bombardment strafing, which would have given the paratroopers
    enough time to regroup after landing. The airborne operation was not flawless.
    British fighter planes attacked twice, but were driven off both occasions. The
    paratroopers did not jump with their weapons and ammunition; these were dropped
    in containers. Due to the difficult terrain, the paratroopers often failed to
    recover them. Often armed only with pistols and grenades, could not develop enough
    firepower to overcome the resistance and take the airfield. Some paratroopers
    with an LMG erected a roadblock 8km from the city, on the way to the airfield,
    hindering communications between Palembang and the airfield.


    The Palembang garrison consisted of battery from 15th Heavy Aircraft Regiment
    with 3.7in guns, a section from 78th Battery and a troop from 99th Battery (from
    35th Light Aircraft Regiment) with 40mm Bors, 150 RNEI army men and the defence
    sections (ground defence detachments) of No. 258 and 605 (Fighter) squadrons (about
    60 men). Wing Commander H.G. Maguire acted as commander on Saturday to the senior
    officer being ill. The AA gunners were able to take the control of their positions
    by forming ground defence squads and anti-paratroop patrols. The personnel had
    received weapons and ground defence training and had familiarized themselves with
    the wider environment of their gun positions. The airfield fiercely opposed the
    attacking paratroopers all day. Once the AA artillery had used up its ammunition
    stocks against air and ground targets, it was partially evacuated to Palembang
    under cover. With 70 men left, Wing Commander Maguire saw no way of defending
    the airfield against night attacks. He and men withdrew north-west in trucks shortly
    before night. The runways, although mined, were not destroyed, as the store containing
    the detonators burnt down during the attack. The airfield fell into Japanese hands
    unamended.


    The refineries were attacked by the 1st Company, 2nd Raider Regiment at 1130hrs.
    Sixty men landed at Plaju, and the 3rd Platoon (39 men) jumped


