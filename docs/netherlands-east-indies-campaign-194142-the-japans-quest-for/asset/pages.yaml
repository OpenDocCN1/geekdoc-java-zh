  md: '![](img/52135db0eb5e64e74130266a9290cbf8_41_0.png)


    operation that caught the scattered NE forces in a pincer movement from Menado
    in the west and Kakeha in the east, with Japanese paratroopers attacking the centre
    by the Menado II Airfield (Langoan). Menado was defended by garrison troops of
    the Menado Troops Command, of the Celebes and Menado Territorial Command, under
    Major B.F.A. Schmoller. The strength was c. 1,500 in a number of separate, unconnected
    units of differing combat value.


    The coastal defence by the Menado Company was quickly overcome and the city was
    occupied. After a short battle, the paratroopers managed to capture the airfield.
    Two counter-attacks were launched by RNEI troops, but lacked coordination and
    were too weak. The paratroopers also captured the abandoned naval base in the
    afternoon. The advance from Menado held up by a delaying action. After this, coordinated
    resistance disintegrated.


    The capture of Menado cost the Special Landing Forces 44 killed and 184 injured.
    Among the fallen were 12 paratroopers whose transport aircraft was shot down by
    their own fighter aircraft. Japan claimed 140 killed and 48 prisoners of the RNE
    Army. According to Dutch records, 20 soldiers died, of whom were executed.


    The northern line of defence been breached by the fall of Tarakan and Menado.
    For Wavell, with his emphasis on Singapore, the defence of bases in the northern
    and eastern periphery of the Netherlands East Islands not a priority. He wanted
    to preserve his air forces for the later battle. The Dutch and Americans clearly
    thought otherwise. Together, they deployed their aircraft against the Japanese
    defence.


    The Military Aviation Service and FEAF missions against the Japanese landing fleet
    at Tarakan and its airfield. The latter was damaged, but overall the results were
    relatively limited. Japanese Zeke fighters inflicted a heavy toll. The Military
    Aviation Service lost a total of 30 boys and 23 crew members. On 13 January 1942,
    the Military Aviation Service ended attacks on the island.


    The Military Aviation Service lacked any missions of attacking Menado, and so
    missions against the latter were flown by the RAAF and FEAF. The results were
    poor. The JN spoke of Menado'' fierce counter-attacks of enemy aircraft. It was
    fortunate that [the] caused no [major] damage to us because their attacks were
    carried out by single planes, and, moreover, their skill was not very great. We
    observe that our losses must have been disastrous should we have been attacked
    by a considerable number of [enemy planes] in formation.¹³ Such an evaluation
    could apply equally to Tarakan.


    # BALIKPAPAN


    After two weeks, the Japanese made their second leap forward on 24 January 1942.
    Again amphibious operations were performed simultaneously. The Sakaguchi Detachment
    landed at Balikpapan, when the IJN attacked on Sulawesi.


    > ¹³ Remmelink, W. ed. (trans.). The Operations of the Navy in the Dutch East
    Islands and the Bay of Bengal. The Courts Fortune/ Leiden University Press, 2016,
    pp. 167–71.'
