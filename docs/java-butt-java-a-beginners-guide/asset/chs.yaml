  \ `b` 的语义规则必须在评估 `c` 之后执行。语法树节点之间属性之间的依赖关系可以用依赖图表示。\n\n在构造语法树的依赖图之前，将每个语义规则写成形式\
  \ `b := f(c, ..., c)`。如果属性 `b` 依赖于属性 `c`，图中有一个从节点 `c` 到节点 `b` 的边。算法上，给定语法树的依赖图按以下方式构造：\n\
