  \ 属性管理\n\n终结符属性的管理并不算复杂。表示常数的标记（tokens）不需要任何属性，因为我们的目标不是处理值或生成等效代码。另一方面，由于我们的语言定义了一种显式变量声明的机制，最好由词法分析器提供变量的语法名称，这样就可以根据它们是否出现在语句中，将它们插入符号表或在符号表中查找它们。\n\
  \n一个更复杂的问题是如何识别复杂变量的类型（因为我们已经看到，使用单个词法单元是不可能的）。接下来，假设用户定义了以下变量：`alpha: POINTER TO\
  \ ARRAY [23] OF POINTER TO PROCEDURE(): ARRAY[2] OF INTEGER;`\n\n毫无疑问，我们需要一个符号表来存储每个变量的名字及其类型。此外，这些信息必须以某种智能的方式存储，以便后续帮助我们检测错误，并允许我们知道哪些数据修饰符可以使用哪些不能。你决定存储变量类型的方法，也应该用于在对变量应用了一系列类型修饰符后，存储该表达式的类型。\n\
  \n解决方案是使用字母对每个类型或类型构造器进行编码，包括用 `'u'` 表示的未定义类型。\n\n| 类型和构造器 | 字母代码 |\n| :--- | :---\
  \ |\n| POINTER TO | p |\n| ARRAY [] OF | to |\n| PROCEDURE (): | F |\n| BOOLEAN\
  \ | b |\n| INTEGER | i |\n| REAL | r |\n| CHAR | c |\n| UNDEFINED | or |\n\n一个完整的类型将由栈表示，栈中保存这些字母的序列。图\
  \ 7.9 显示了与 `alpha` 变量类型相关的字母以及该变量在符号表中的结构。栈是通过从右到左查看类型构建的，这确保了栈顶是 `alpha` 的主类型：`alpha`\
  \ 首先是一个指针（由 `'p'` 表示）。正因如此，递归语法是向右递归的，因为归约操作将按照它们必须出现的顺序进行，并必须将项推入栈中。\n\n此外，如果一个表达式关联了类型栈作为属性，那么很容易找到哪些修饰符可以应用于它：如果栈顶是\
  \ `'p'`，则应用 `^`；如果栈顶是 `'a'`，则应用 `[NUM]`；如果栈顶是 `'f'`，则应用 `()`。这不仅容易，在应用类型修饰符后计算该表达式的类型栈也很容易。例如，如果变量\
  \ `gamma` 的类型是 `POINTER TO X`，那么 `gamma ^` 的类型就是 `X`，只需移除与 `gamma` 关联的类型栈的顶部即可得到表达式\
  \ `gamma ^` 的类型栈。\n\n### 7.4.2.3 实现类型栈\n\n建议的字符栈可以通过许多不同的方式实现。在我们的情况下，将使用数组作为栈，因此位置\
  \ `0` 将存储元素数量，这些元素从位置 `1` 开始放置，最高位置对应栈顶。20 个位置就足够。`alpha` 类型栈的结构如图 7.10 所示。\n\n\
  使用这种结构，入栈、出栈和顶操作非常简单。假设类型变量为 `char [20]`，则：\n\n```c\nstack (char x) . 它包含递增的类型 `type\
  \ [0]`，然后将 `x` 放入 `type [type [0]]` 中；单条语句：`type [++ type [0]] = x;`\nunstack ()\
  \ . 它仅包含减小 `type [0]` 的长度，留下 `type [0] -`;\nchar top () . 位置 0 给出栈顶的位置，然后单条语句：`return\
  \ type [type [0]];`\n```\n\n尽管我们将使用这种方法，但显而易见我们在存储类型时浪费了内存。考虑到今天处理的内存量，这不应该让我们担心。如果内存是一个问题，则必须使用某种基于位的编码。由于我们总共有\
  \ 8 个字母需要表示，3 个位就足够表示其中的每一个，如下表所示：\n\n| 类型和构造器 | 比特代码 |\n| :--- | :--- |\n| POINTER\
  \ TO | p - 100 |\n| ARRAY [] OF | a - 101 |\n| PROCEDURE (): | f - 110 |\n| BOOLEAN\
  \ | b - 111 |\n| INTEGER | i - 001 |\n| REAL | r - 010 |\n| CHAR | c - 011 |\n|\
  \ UNDEFINED | u - 000 |\n\n此外，假设额外的存储空间填充为 0，由于代码 `000` 与未定义类型关联，可以不存储栈的大小，而是寻找栈顶只需查找第一个非\
  \ `000` 的三位序列。如果不存在，则类型为未定义。\n\n根据这种编码，代码 `111`、`001`、`010`、`011` 和 `000` 只能位于底部；此外，代码\
  \ `100`、`101` 和 `110` 永远不会位于底部，因为它们需要在另一个类型上应用。这一事实允许我们使用相同的代码来表示原始类型和类型构造器：如果它位于栈底，则引用一个原始类型，否则引用的是构造器。是的，此外我们通过整数指针表示类型，未定义类型将由指向\
  \ `null` 的指针给出，因此编码为：\n\n| 类型和构造器 | 比特代码 |\n| :--- | :--- |\n| POINTER TO | p -\
  \ 01 |\n| ARRAY [] OF | to - 10 |\n| PROCEDURE (): | f - 11 |\n| BOOLEAN | b - 00\
  \ |\n| INTEGER | i - 01 |\n| REAL | r - 10 |\n| CHAR | c - 11 |\n```\n\n\n\n\n其中相同颜色的行具有相同的位代码。请注意，只要你不想保存类型的长度且未使用的位被填充为\
  \ `0`，就无法使用代码 `00` 来表示某种类型的构造函数。这不会产生任何混淆，因为栈底部的只能是基本类型；图 7.11 显示了 alpha 类型如何使用\
  \ 16 位整数进行编码的。\n\n图 7.11. 基于位的编码 (Bit-based encoding)\n\n## 7.4.2.4. 语义动作 (Semantic\
  \ actions)\n\n对于语义动作，我们将关注通过 `of` 产生式规则给出的语法。在我们定义的语言中，通过它存在一个声明区域和一个变量使用区域（尽管它们可以交替出现）。因此，由解析器在标识符声明时将标识符插入到符号表中。\n\
  \n从 `prog` 规则中可以看出，有一个 epsilon 规则（空产生式），它允许你在分析的最开始处就直接通过它进入，作为 `prog` 规则自身递归的基步骤。\n\
  \n在 `decl` 和 `type` 规则中，我们执行的是右递归语法。因此，类型规则允许从基到顶构建栈，仅执行栈操作。另一方面，`decl` 规则允许你为每个声明的标识符分配类型，同样是从右向左的，如图\
  \ 7.12 所示。由此可见，当分析器在语法上遇到基本类型时，会构建一个包含单个字符的栈（对应找到的类型），并将其赋值为非终结符 `type` 的属性。当根据右递归规则归约为新的类型非终结符时，后继类型的属性被作为构造前驱类型属性的起点；只需向其添加该情况对应的类型构造器字符（该情况在图\
  \ 7.12 中用灰色标记）。\n\n一旦构建了完整类型，解析器应通过规则进行归约：\n```\ndecl: ID ':' type\n```\n以便必须为指示为\
  \ `ID` 属性的变量在符号表中创建一个条目（根据图 7.12 为 `c`）；该变量的类型将由 `type` 属性给出。当然，有必要检查它是否执行了变量重复声明。由于可以同时声明多个变量，其余变量（根据图\
  \ 7.12 为 `b` 和 `a`）通过归约规则来识别：\n```\ndecl: ID ',' decl\n```\n![](img/image_rsrcDHP.jpg)\
  \ 图 7.12. 栈类型的构建以及对符号表中每个变量的赋值。\n\n显然，该过程与上一个规则非常相似，即为 `ID` 属性变量在符号表中创建一个输入，并为其分配一个\
  \ `of` 类型的栈。当然，这需要将类型栈作为非终结符 `decl` 的属性，因此栈必须在从后继非终结符到前驱的产生式中传播，即到 `decl`。结论是，`type`\
  \ 和 `decl` 都有一个类型栈作为属性。\n\n现在继续学习表达式的规则。目标是让 `expression` 也关联一个类型栈，以便在完成整个表达式的解析后，将其类型栈作为参数传递给函数，该函数将其内容翻译成自然语言句子。\n\
  \n表达式可以分为三部分：\n1) 基本类型，由任何类型的常量组成；\n2) 简单类型，由变量组成；\n3) 复杂类型，由右侧带有类型修饰符的简单表达式组成。\n\
  \n类型 1 的表达式关联着一个字符的类型栈，该字符对应识别出的字面量类型：`NUM` 为 `'i'`，`NUMREAL` 为 `'r'`，`CHARACTER`\
  \ 为 `'c'`，`CTELOGICA` 为 `'b'`。\n\n类型 2 的表达式拥有的类型栈与它们所代表的变量完全相同。如果变量未声明，则栈类型将仅有一个表示未定义类型的\
  \ `'u'`（你不能使用字母 `'i'`，因为会会与 `INTEGER` 的 `'i'` 混淆）。![](img/image_rsrcDHR.jpg)\n\n\
  类型 3 的表达式从一个表达式（关联有类型栈）以及一个类型修饰符开始。在这种情况下，检查主表达式类型（由其类型栈的顶部表示）是否支持该类型修饰符，如节 7.4.2.2\
  \ 节尾所示。例如，如果我们发现 `\"expr ^\"`、`\"expr [NUM]\"` 或 `\"expr ()\"`，检查类型 alpha 的主体是否分别为\
  \ `'p'`、`'a'` 或 `'f'`。假设变量 `a` 已如图 7.12 所示声明，该图显示了识别表达式 `\"a ^ [3]\"` 期间的类型栈。\n\n\
  当它通过规则进行归约时：\n```\nexpr : ID\n```\n在符号表中查找作为 `ID` 属性的变量；一旦找到，`expr` 的属性将是该变量类型栈的拷贝。\n\
  \n当应用规则时：\n```\nexpr : expr '^' | expr '[' NUM ']' | expr '(' ')'\n```\n将验证所应用规则的修饰符与应用于它的表达式栈顶部的类型兼容。如果兼容，则结果表达式（前驱）的类型将与后继类型相同，但缺少顶部元素。如果不应发布错误消息，则结果表达式为未定义类型。\n\
  \n简而言之，类型构造器通过向栈中插入字符来构建栈，而类型修饰符通过从顶部移除字符来破坏栈。\n\n## 7.4.3 使用 Lex / Yacc 的解决方案\n\
