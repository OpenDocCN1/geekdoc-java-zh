  class Data {\n    String tmpExpr, etqFinal;\n}\nclass Condition {\n    String etqTrue,\
  \ etqFalse;\n    private static int actualTmp = 0;\n    private static String newTmp\
  \ () {\n        return \"tmp\" + (++ actualTmp);\n    }\n    private static int\
