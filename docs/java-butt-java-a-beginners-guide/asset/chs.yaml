  \ ID; }[b¯ / \\ t \\ n]​ {; } |  |\n| .​ {return yytext [0]; }Y%%​ /* 选项 2 */[0\
  \ - 9] +​ {return NUM; }[A- Z] [A- Z0 -9] * {return ID; }[b¯ / \\ t \\ n]​ {; }\
  \ | / * 语法错误。将错误传递给 a.si。 * / |\n| '(' &#124; ')' &#124; '*' &#124; '+'​ {return\
  \ yytext [0]; } | / * a.si. 只接收有效的标记 * / |\n| .​ {printf (\"Lexical error. \\n\"\
  ); } | |\n\n这些选项在面对词法错误时的行为不同，例如当用户在预期输入 `+` 的地方输入 `@` 或任何其他运算符时。在选项 1 中，由于模式 `.`\
