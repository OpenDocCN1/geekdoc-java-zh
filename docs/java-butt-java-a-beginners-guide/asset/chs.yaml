  \n| $\\alpha$ 或 $A$ 剩余符号的属性。 | 一个 | 二 | k |\n\n在任何情况下，属性 `b` 都认为依赖于属性 `c`, `c`,\
  \ ..., `c`。属性文法是一种语法驱动的定义，其中语义规则中的 `functions` 不能产生副作用。语义规则的赋值通常被写为 `expressions`（表达式）。在某些情况下，语法驱动定义中某个语义规则的唯一目的是创建一个副作用。这些语义规则通常被写为过程调用或程序片段。它们可以被视为定义了关联产生式左导形式中非终符的虚拟合成属性值的规则，因此在显示时既不显示该占位属性，也不显示语义规则的\
  \ `: =` 符号。\n\n例如，表 4.1 的语法驱动定义是为一个实现计算器的翻译器设计的。该定义为每个非终符 `E`、`T` 和 `F` 分配了一个取值为\
  \ `integer` 的合成属性 `val`。对于 `E`、`T` 和 `F` 的每个产生式，语义规则都根据后导部属性的值来计算左导部符号的 `val` 属性值。\n\
