  \n如果我们向你提供以下输入![](img/image_rsrcDFM.jpg) 153166\n\n`JavaCC(id + id) * (id + id)`\n\
  \n生成的树如下：\n```\nStart\nExpression\nExpSuma\nExpMult\nExpunary\nExpression\nExpSuma\n\
