  \n## 4.2.3 翻译方案\n\n翻译方案是一个自由上下文文法，其中我们在产生式规则的右侧发现了穿插的程序片段，我们称这些为**语义动作**（semantic\
  \ actions）。翻译方案类似于语法驱动的定义，不同之处在于语义规则的评估顺序被显式地显示出来。某些动作执行的位置在大括号中给出并写在产生式规则的右侧。例如：\n\
  \n```\nA ÷ cd {printf (c + d)} B\n```\n\n在设计翻译方案时，必须遵守某些限制，以确保当动作引用某个属性时，该属性是可用的。这些限制源于构建树时选择的解析类型，它们确保了动作不会引用尚未计算的属性。\n\
  \n最简单的例子是只需要**合成属性**（synthesized attributes）的情况。在这种情况下，可以通过创建一个包含每个语义规则赋值语句的动作，并将该动作放置在相关产生式规则的右侧末尾来构建翻译方案。例如，产生式规则\
  \ `T ÷ T * F` 和语义动作 `T.val := T.val * F.val` 导致如下产生式和语义动作：\n\n```\nT ÷ T * F {T.val\
  \ := T.val * F.val}\n```\n\n如果你同时拥有**继承属性**（inherited attributes）和合成属性，应该更加谨慎，因此在使用文法符号的属性时需要遵循一些规则：\n\
  \n1. 产生式规则右侧符号的继承属性必须在在该符号之前的动作中被计算出来。\n2. 动作不能引用位于该动作右侧符号的合成属性。\n3. 左侧非终结元的合成属性只能在它所有相关的属性都计算完毕后才能计算。计算这些属性的动作必须放置在产生式的右侧末尾。\n\
  \n满足这些约束的定义良好的翻译方案被称为良好定义的。示例：\n\n```\nD ÷ T {L.her = T.type} L;\nT ÷ int {T.tipo\
  \ = \"integer\"}\nT ÷ real {T.type = “real”}\nL ÷ {L.her = L.her} L, id {add type\
  \ (id.ptr_tbs, L.her)}\nL ÷ id {add type (id.ptr_tbs, L.her)}\n```\n\n## 4.2.4 带有属性的\
  \ LALR 分析\n\n在本节中，我们将学习带有属性的 `LALR (1)` 分析是如何构的的。让我们记住，`LALR (1)` 能够在任何时候知道应用哪条规则而没有误差（对于满足\
  \ `LALR (1)` 约束的文法）。事实上，这被用于安全地执行动作。在回溯的情况下，可能会在执行一个动作后需要返回，因为我们意识到该规则是不正确的。在这种情况下，如何撤销一个动作呢？由于这是不可能的，在回溯分析中，无法在进行分析的同时执行动作，但必须先处理句子，然后在稍后的阶段安全地执行动作。\n\
  \n### 4.2.4.1 归约/归约冲突\n\n某些翻译方案无法被 `LALR (1)` 解析器直接识别。特别是语义动作通常只在进行归约（reduction）时执行，而永远不在移动（move）时执行。因此，带有穿插动作的翻译方案变成了另一种等效形式，它只包含位于规则末尾的动作，如第\
  \ 4.1.2 节所示。\n\n尽管如此，这种转换可能导致不再是 `LALR (1)` 的情况，如图 4.10 所示。在这种情况下，存在归约/归约冲突，因为文法不是\
  \ `LALR`。正如已经指出的，归约/归约冲突发生在分析的某一个时刻，此时不知道应用哪条规则。在上述用例中，如果输入字符串 \"abcd\"，当前两个 token\
  \ 被消费（“A”和“b”）时，我们无法知道应用哪条规则 `g`，`U` 还是 `V`，因为前 token 搜索是 \"c\"，而这恰好发生在 `U` 和 `V`\
  \ 处。要解决这个问题，我们需要 `LALR (3)` 分析，因为只看“c”是不够的；看 \"d\" 也不够；必须向前看一个字符，到 \"e\" 或 EOF，以便通过哪条规则进行归约，从而应用哪个动作。\n\
  \n### 4.2.4.2 移动/归约冲突\n\n还有更令人困惑的情况，发生在歧义文法中，即一个句子可能有多个语法树的文法。例如一个简单的文法：\n\n```\n\
  S ÷ aB\nB ÷ aC\n```\n\n当读取字符串 \"aad\" 时，当前两个 \"a\" 和 token 被消费时，前置搜索是第三个“a”...（注：原文此处似乎不完整，已按原意翻译）\n\
