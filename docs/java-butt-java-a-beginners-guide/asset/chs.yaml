  \ ())}\n```\n\n该语法与产生规则表示的语法相比有两个不同。首先，非终端符 `list_sent` 消失了，因为它在语法上等同于 `prog`（在这里我们命名为\
  \ `grammar`）。这导致需要在非终端符 `sentFinished` 的最后一个规则中进行单一错误处理。显然，这也可以通过基于规则的语法来实现，但我们更倾向于在同一个语法中演示多个错误规则的管理。\n\
  \n第二个区别在于通过下降语法对条件进行管理。在处理如字符序列：`\"((((27 * 8) ...\"` 之前，必须知道省略号的内容，以便判断前三个括号是与表达式关联还是与条件关联：如果我们发现字符\
  \ `>`，则括号与条件关联；但如果我们发现 `\"7) \"`，那么至少第三个括号属于一个表达式，我们仍然需要继续向后看以确定另外两个括号属于什么。这个问题有三个明确区分的解决方案：\n\
  \n1. 建立无限的前瞻查找（infinite lookahead）。\n2. 区分表达式的分组和条件的分组；例如，表达式可以分组在圆括号中，条件分组在方括号中。这是本示例采用的解决方案。\n\
  3. 将条件视为逻辑类型或布尔类型的表达式。这是最广泛接受的决策，尽管在本例中没有选择它，因为它意味着了我们不希望关注的类型管理。\n\n### 8.4.2 初步示例\n\
