  \ compiler architecture model which is divided into frontend and backend, the initial\
  \ stage translates a source program to an intermediate representation from which\
  \ the final stage generates object code, either in the form of machine or assembler\
  \ code. The details of object language are confined to final stage, making it easy\
  \ to reuse the frontend to create compilers for other platforms. This way, although\
  \ a priori it may be easier to translate a source program directly to object language,\
  \ the two main advantages of using intermediate code independent of the target machine\
  \ are retargeting is facilitated by this phase. The versatile philosophy in compiler\
  \ construction reaches its extreme in the implementation of languages that are compiled\
  \ and pseudo-interpreted in execution. This means that at compile time code is generated\
  \ of virtual microprocessor (called P-code in UCSD, bytecodes in Java, etc.) which\
  \ is interpreted at runtime via a Virtual Machine (JVM). The design has the advantage\
  \ that it facilitates the portability of programs.\n\n#### 8.2 Triplet code\nIn\
  \ order to facilitate the understanding of the code generation phase, we will not\
  \ focus on the pure machine code of any microprocessor, but in intermediate code\
  \ close to any of them. Each of the instructions that we can generate has four sections:\n\
  1. first operand (memory address where the first operand is).\n2. second operand\
  \ (memory address where the second operand is).\n3. Operator (operation code).\n\
  4. Result (memory address where to store the result, or which to jump).\n\nImmediate,\
  \ that is, the address of an operand can be substituted for the operand itself.\
  \ These types of instructions are called three-way codes, triplets. In essence,\
  \ triplets are very similar to any assembly code, there are operations to add, subtract,\
  \ etc. There are also instructions for the flow of execution, and symbolic labels\
  \ may appear in the middle of the code in order to identify the destination of the\
  \ jumps.\n\nThe triplets that we can use are:\n- Binary assignment: `x = op z`,\
  \ where `op` is a binary operation or logic.\n- Unary assignment: `x = op y`, where\
  \ `op` is a unary operation.\n- Simple assignment or copy: `x = y`, where the value\
  \ of `y` is assigned to `x`.\n- Unconditional jump: `goto tag`.\n- Conditional jumps:\
  \ `if x rel goto label`.\n\nAs can be deduced from the proposed triplets, the memory\
  \ addresses will be managed symbolically, that is, through names instead of numbers.\
  \ Of course, to generate triplets closer to a machine code, each of these names\
  \ must be translated into a memory address only. For example, you can assume that\
  \ an integer value occupies 16 bits, a real one occupies 32 bits, a character occupies\
  \ 8 bits, etc. With the above triplets we will cover all the examples proposed in\
  \ this chapter. However, these triplets do not include all the possibilities of\
  \ basic execution contemplated by a microprocessor. For example, for calling a subroutine\
  \ you have triplets to put the parameters on the stack:\n- `param x`: puts the real\
  \ parameter `x` on the stack.\n- `call p, n`: calls the subroutine that begins at\
  \ label `p` and tells it to take `n` parameters from the top of the stack.\n- `pop\
  \ x`: takes a parameter from the stack and stores it in the `x` address.\n- `return\
  \ y`: returns the value `y`.\n\n#### 8.3 A simple compiled calculator\nTo illustrate\
  \ how the code of triplets is used in a grammar, we are going to suppose that our\
  \ calculator instead of being an interpreted calculator is a compiled calculator,\
  \ that is, instead of interpreting the expressions we are going to generate equivalent\
  \ intermediate code.\n\n##### 8.3.1 Construction steps\nBefore starting to code\
  \ the lexical and parsers, it is necessary to state exactly what you want to do\
  \ and with what grammar. For this you must propose a preliminary example of what\
  \ the calculator should do to at.\n\n###### 8.3.1.1 Proposal of an example\nThe\
  \ goal is for the calculator to produce an output text before a text from entry.\n\
