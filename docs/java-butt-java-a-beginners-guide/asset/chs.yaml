  \ token.image; }}\nSKIP: {<ILLEGAL: (~ [])> {System.out.println (\"Character:\"\
  \ + image + \"not expected.\");}}\n```\n\n虽然非终结符 `sentFinished()` 和 `assignedComposite()`\
