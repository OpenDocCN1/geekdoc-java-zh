  \ = T.val` | |\n| `T ÷ T * F` | `T.val = T.val * F.val` | |\n| `T ÷ F` | `T.val\
  \ = F.val` | |\n| `F ÷ (E)` | `F.val = E.val` | |\n| `F ÷ num` | `F.val = num.val_lex`\
  \ | |\n\n表 4.1 简单计算器的语法驱动定义\n\n`LALR (1)` 分析。我们还将看到一个使用 `JavaCC` 的示例，但目前，我们将继续深入研究语法驱动定义。在语法驱动定义中，假设标记（tokens）只有合成属性，因为定义中没有为它们提供任何语义规则。词法分析器通常提供终结符属性的值。此外，假设起始符号没有继承属性（除非另有说明），因为在许多情况下它没有父节点节点。\n\
  \n### 4.2.2.1 合成属性\n\n合成属性在实践中被广泛使用。仅使用合成属性的语法驱动定义被称为“带合成属性的定义”。通过带合成属性的定义，你可以通过向上评估语义规则来装饰语法树，从叶子节点到根节点计算属性。\n\
