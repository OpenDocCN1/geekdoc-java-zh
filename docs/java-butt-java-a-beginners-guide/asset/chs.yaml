  \n![](img/image_rsrcDGN.jpg)\n\n## 7.1 概述\n\n编译器必须检查源程序是否遵循语法约定以及描述源语言的语义。这种验证确保了能够检测并随后通知程序员某些错误，这些错误使得调试变得更简单，但从纯粹的语法角度来看是无法管理的。在这些错误中，最常见的是源于数据类型的使用，这些类型可能是语言本身提供的（基本类型），或者是程序员根据语言提供的语法结构创建的（用户类型）。基本上，数据类型的使用正是为了让程序员声明每个变量的用途（存储整数、实数、字符字符串等），以便编译器能够自动检测出程序员在什么情况下犯了错误（例如，如果你尝试将一个整数和一个字符字符串相加）。\n\
  \n类型管理确保语法结构构件的类型与你语境中的意图相匹配。例如，Modula-2 中预定义的算术运算符 `mod` 需要整数型数值操作数，因此使用类型管理必须确保这些操作数是整数类型。同样地，类型管理还必须确保解引用（dereferencing）仅应用于指针，索引操作仅对数组进行，函数应用了正确数量和类型的参数等。\n\
  \n由类型管理器收集的信息在生成代码时也是很有用的。例如，算术运算符通常适用于整数和实数（可能还有其他类型），并且根据每个运算符的语境来确定存储计算中间结果所需的内存空间。当一个符号或函数在不同语境下表示不同的操作时，称其为重载（overloaded）；例如，加法（由符号\
  \ \" + \" 表示）通常对整数和实数进行重载。重载可能伴随着类型转换，即编译器提供运算符将操作数转换为语境预期的类型。例如，考虑像 \"x + i\" 这样的表达式，其中\
  \ x 是实数类型，i 是整数类型。由于计算机内部整数和实数的表示方式不同，且对整数和实数的操作使用不同的机器指令，编译器可能需要首先转换其中一个操作数，以确保两个操作数都具有相同的类型，以便你在\
  \ 187![](img/image_rsrcDGP.jpg) 200 类型管理处放置求和。\n\n图 7.1 的语法生成了由整数和实数常数组成的表达式，并对这些应用加法算术运算符\
  \ +`。当两个整数相加时，结果是整数，除非它是实数。通过这种方式，每个子表达式都有关联的类型以及依赖于它的存储空间，就像它们在运行时会关联一个值一样，如图右侧的树所示。图\
  \ 7.1。每个子表达式类型的计算示例。整数之和产生整数，但如果涉及实数值，则结果将是实数。\n\n重载的另一种概念是多态（polymorphism），它出现在面向对象的语言中。在这些语言中，存在继承层次结构，更特化的类型继承自更通用的类型，使得特殊的类型可以包含通用类型所缺乏的特征，甚至可以通过一种被称为“函数重写（function\
  \ rewriting）”的方法改变祖类中某些方法的操作。在这些语言中，当一个函数具有通用的类型参数时，它是多态的，但可以使用相同继承链中的特化类型参数（即通用类型的后代）来执行它，从而在每种情况下通过动态链接触发不同的动作。根据动态绑定（dynamic\
  \ bonding），在执行时会检测实际参数的类型并执行它们自己的方法（如果它们被重写了），而不是父类的方法。我们的语言拥有一些重载的预定义函数是一回事，允许定义重载函数是另一回事。对于后者，你必须某种方式解决符号表中的冲突，因为同一个函数名关联了不同的参数和函数体。\n\
  \n## 7.2 标识、结构和函数兼容性\n\n当你准备构建一种新编程语言时，事实类型之间建立严谨且文档良好的兼容性标准是至关重要的，这样使用该语言的程序员就会有预期。\n\
  \n我们理解，当两个类型 `A` 和 `B` 兼容时，给定两个类型分别为 `b A` 和 `B` 的表达式 `e` 和 `et`，它们在给定的语境中可以交换使用。有很多不同的语境，其中最常见的（188201![](img/image_rsrcDGR.jpg)）是赋值，因此如果变量\
  \ `v` 的类型为 `A` 且有一个形式 `v: := e` 的赋值，那么 `A` 和 `B` 是兼容的。\n\n另一个语境是算术运算，例如加法：如果语言允许\
  \ `e + e` 形式的表达式，我们将说 `A` 和 `B` 在赋值上是兼容的。基本上，类型之间可以建立三种兼容性标准：标识（nominal）、结构（structural）和函数（functional）。标识兼容性是最严格的，即决定两个变量是否可以赋值的强力条件；函数兼容性是最宽松的，而结构兼容性处于中间水平。当然，开发者可以设置这些之间的其他标准。为了解释这些标准的区别，我们将使用\
  \ C 中定义的以下类型：\n\n```c\ntypedef struct {\n    char name [20];\n    char surnames\
  \ [35];\n    int age;\n} employee e1, e2;\n\ntypedef struct {\n    char name [20];\n\
  \    char surnames [35];\n    int age;\n} customer c1, c2;\n```\n\n`customer` 和\
  \ `employee` 类型名称不同，从标识来看是不同的。然而，它们的内容是相同的，因此从结构来看是等价的。这种情况下，标识兼容性防止了赋值 `e1 = c1`，但允许\
  \ `e1 = e2`，因为 `e1` 和 `c2` 属于完全相同的类型（由于它们具有相同的名称）。标识兼容性在声明匿名类型时具有强影响。继续之前的示例，会有：\n\
  \n```c\nstruct {\n    char name [20];\n    char surnames [35];\n    int age;\n}\
  \ e1, e2;\n\nstruct {\n    char name [20];\n    char surnames [35];\n    int age;\n\
  } c1, c2;\n```\n\n其中变量 `e1`、`e2`、`c1` 和 `c2` 的类型是未命。一般规则，在这些情况下，标识兼容性为每个声明创建一个内部名称的类型，一个\
  \ `e1` 和 `e2` 属于（因此是兼容的），另一个 `c1` 和 `c2` 属于（在标识上也是兼容的）。函数兼容性甚至不需要表达式具有相同的结构。两个表达式\
  \ `e` 和 `et` 分别类型为 `A` 和 `B`，如果结构不同但在某些语境中可以交换使用。最常见的情况是能够相加整数和实数值。一般来说，整数通常用补码表示，而实数用浮点表示。虽然使用了相同的字节数，它们的结构本质上是不同的，但大多数语言允许它们之间执行算术运算。在这些语言中，整数类型和实数类型之间存在函数兼容性。函数兼容性要求编译器检测不同结构的表达式正确混合的情况，以生成执行表达式类型转换的代码。例如，当将整数与实数相加时，必须将整数转换为实数，然后执行操作。这种自动操作被称为“提升（promotion）”。在面向对象的语言中，还支持继承：如果类\
  \ `B` 继承自另一个类 `A`（`B` 是一个 `A`），作为一般规则，类 `B` 的对象应该在任何需要类型 `A` 对象的地方，因为 `B` 是一个 `A`，因此满足模拟它的所有函数要求。\n\
  \n## 7.3 基本类型管理\n\n在此处，将学习一个基础计算器的管理，其中包含了字符字符串类型，以及之前章节已处理过的整数类型。\n\n### 7.3.1\
  \ 起始语法\n\n...整数和字符字符串类型。字符串可以通过重载运算符 `\" + \"` 来连接，记住，它也允许相加整数。通过语言部分的两个函数允许两种类型之间的转换。为了避免陷入不必要的细节中，删除了一些算术运算和多次赋值。此外，为了说明回车并不总是被视为分隔符，在建议的语法中它被用作终止符，起到之前示例语法中分号的作用。Yacc\
  \ 格式的语法如下：\n\n```yacc\nprog: prog assign '\\ n'\n| prog PRINT expr '\\ n'\n| prog\
  \ error '\\ n'\n| / * Epsilon * /;\n\nassign: ASIG ID expr;\nexpr: expr '+' expr\n\
  | expr '*' expr\n| TO_ENTER '(' expr ')'\n| A_CADENA '(' expr ')'\n| ID\n| NUMBER\n\
  | CHAIN;\n```\n\nJavaCC 语法保持不变：\n\n```java\ngrammar void (): {} {(sentFinished ())\
  \ *}\nvoid sentFinished (): {\n    <PRINT> expr () <RETURNODECARRO>\n    | <ID>\
  \ <ASIG> expr () <RETORNODECARRO>\n    | / * Error handling * /}\nvoid expr ():\
  \ {term () (\"+\" term ()) *}\nvoid term (): {fact () (\"*\" fact ()) *}\nvoid fact\
  \ (): {\n    <ID>\n    | <NUMBER>\n    | <CHAIN>\n    | <To_String> \"(\" \")\"\n\
  \    | <A_ENTER> \"(\" \")\"\n}\n```\n\n每个构造的语义角色是：可以将表达式的值赋值给变量。是不可能的多次赋值：`ASIG\
  \ ID expr` 。你可以处理两种类型的值：字符字符串和整数。语法没有让程序员可以声明每个类型的区域，但将由第一次赋值定义的。也就是说，当变量 `x` 第一次出现时，赋值为\
  \ 6，所以 `x` 的类型是整数。变量的类型在程序执行期间不能改变。显示表达式的值：`PRINT expr` 。因此，允许显示整数值和字符串，如果我们从函数的角度来看，我们可以说\
  \ `PRINT` 是多态函数。对于整数，将能够进行加法和乘法。对于字符串，进行这些操作没有意义，尽管我们将使用函数进行类型转换。这些与内置函数不同，它们被存储在库中。这些函数是：\n\
  `A_String (expr)` : 参数是整数类型的表达式并返回代表它的文本。\n`A_ENTER (expr)` : 参数是代表数字的字符表达式并返回其整数值作为结果。\n\
  \n## 7.3.2 构建步骤\n\n一旦使用的语法是清晰的，继续下面的步骤以完成构建。这些构造适应编译器的要求。\n\n### 7.3.2.1 示例建议\n\n\
  为了继续构建步骤，通常是给输入一个示例。输入显示黑色，输出显示蓝色，错误消息显示红色：\nb = \"Comrade Trotsky\"\na = 7\nc =\
  \ 12 + 3\nPRINT c + 5\nPRINT b\n字符串和整数不能相加。\nPRINT b + \"Comrade, founder of the\
  \ USSR.\"\nPRINT A_ENTER(\"23\") * 4\n\n### 7.3.2.2 符号表定义\n\n在这一步中，定义符号表的结构，如果问题需要的话。在这种情况下，我们需要符号表，因为它存储标识符的值。还需要保存每个变量的类型，以控制其使用符合声明意图（在第一次赋值中）。这种方式，变量的类型将存储在符号表中：\n\
  'c': 字符串类型。\n'e': 整数类型。\n'i': 未定义类型。这种情况发生在尝试给变量赋值错误表达式的结果时。由于存在不同类型，C 语言中用 union\
  \ 结构解决，而在 Java 中你将有一个句柄，取决于变量的类型，它将指向整数或字符串。图 7.2 显示符号表的结构。\n\n图 7.2。进入 7.3.2.1\
  \ 点句子后符号表的情况。\n\n### 7.3.2.3 属性映射\n\n下一步是研究哪些属性与终结符和非终结符相关。\n\n### 7.3.2.3.1 终结符属性\n\
  \n对于 `NUMBER` 和 `CHAIN` 终结符，因为它们代表整数和字符串常量，将它们代表的常量赋值为属性是明智的。对于 `NUMBER`，读取的词转换为相应的整数，因为我们感兴趣对其进行算术操作。对于字符字符串，需要删除双引号，因为它们只是分隔符，不是字面量本身。\n\
  \n另一方面，正如注释过的，由于我们正在定义一种没有显式声明区域的语言，将由词法分析器将标识符插入符号表，以减轻语法的任务。终结符属性 `ID` 因此是该表中的一个条目。基本上，词法分析器在遇到标识符时会查找表；如果是，它将其输入作为属性关联找到的\
  \ `ID` 并返回给语法；如果不是，它会在表中创建一个新条目并返回给语法。这里出现的问题是：符号表中的新条目是什么？让我们分析例如，第一个句子：\nb = \"\
  Comrade Trotsky\"。当词法分析器找到标识符 `b` 时，它在符号表（初始为空）中查找它，没有找到，在其中创建一个新节点。这个节点将有一个名字 \"\
  b\"，但它的类型是什么？`b` 的类型取决于第一次赋值给出的值（在这种情况下是字符字符串），但问题是词法分析器看不到它当前找到的词 \"b\"，所以仍然无法知道赋值背后表达式的类型。`b`\
  \ 的类型在程序执行时是确定的。JavaCC 语法保持保持不变：\n\n```java\ngrammar void (): {} {(sentFinished\
  \ ()) *}\nvoid sentFinished (): {\n    <PRINT> expr () <RETURNODECARRO>\n    | <ID>\
  \ <ASIG> expr () <RETORNODECARRO>\n    | / * Error handling * /}\nvoid expr ():\
  \ {term () (\"+\" term ()) *}\nvoid term (): {fact () (\"*\" fact ()) *}\nvoid fact\
  \ (): {\n    <ID>\n    | <NUMBER>\n    | <CHAIN>\n    | <To_String> \"(\" \")\"\n\
  \    | <A_ENTER> \"(\" \")\"\n}\n```\n\n\n\n\n\n| a = 7 | 正常工作 |\n| :--- | :---\
  \ |\n| a = 7 + \"hello\" | 失败（且类型从 a 变为未定义） |\n| a = \"bad\" | 正常工作（但不应该这样做） |\n\
  \n我会改变 `a` 的值和类型，这相对于我们语言的语义来说是错误的。一旦一旦类型被分配给变量，它将始终保持不变；是的，如果在执行期间分配了一个错误的表达式，变量的类型本身也会保持不变，其值也不会改变。这种行为可以通过在符号表中添加一个布尔变量来修改，用于告知变量的值是否已知，这样错误的赋值就会将这个\
  \ `Type management` `variable` 设为 `false`，如图 7.7 所示。图 7.7 包含一个字段，表明尽管知道变量的类型，但由于最后一次赋值是错误的，导致其值是未知的。\n\
  \n### 7.3.3 使用 Lex / Yacc 的解决方案\n\n`C` 语言的解决方案从之前节中建议的符号表结构开始，并使用与 6.4.2 节中引入的相同的接口，如下文件\
  \ `TabSimb.c` 所示：\n\n```c\n#include <stdio.h>\n#include <stdlib.h>\ntypedef struct\
  \ _symbol {\n    struct _symbol * sig;\n    char name [20];\n    char type;\n  \
  \  Union {\n        char cad_value [100];\n        int int_value;\n    } info;\n\
  } symbol;\n\nvoid insert (symbol ** p_t, symbol * s) {\n    s-> sig = (* p_t);\n\
  \    (* p_t) = s;\n}\n\nsymbol * search (symbol * t, char name [20]) {\n    while\
  \ ((t != NULL) && (strcmp (name, t-> name))) {\n        t = t-> sig;\n    }\n  \
  \  return (t);\n}\n\nvoid print (symbol * t) {\n    while (t != NULL) {\n      \
  \  printf(\"%s:%c:\", t-> name, t-> type);\n        if (t-> type == 'c') \n    \
  \        printf(\"%s \\n\", t->info.cad_value);\n        else if (t-> type == 'e')\
  \ \n            printf(\"%d \\n\", t->info.int_value);\n        else \n        \
  \    printf(\"Undefined \\n\");\n        t = t-> sig;\n    }\n}\n```\n\n`Lex` 程序的工作方式与第\
  \ 6 节的计算器类似，但现在我们还必须识别通过 `CHAIN` 令牌返回的字符串类型字面量。其属性是不带引号的词法单元。此外，当第一次识别出用户标识符时，必须将其输入符号表并指示其类型为未定义，这样当通过分配给它的第一个表达式的类型和值时，语法就可以为其分配正确的类型。此外，回车符没有被忽略，而是返回给解析器，因为它是我们语法的一部分。最后，注意令牌\
  \ `PRINT` 对应词法单元 `\"PRINT\"`，因为没有什么是强制令牌命名与它们代表的保留字同名。`TipSimpl.lex` 程序如下：\n\n```lex\n\
  %%\n[0-9] + { yylval.numero = atoi (yytext); }\n\\\"[^\\\"]*\\\" { return NUMBER;\
  \ }\nstrcpy (yylval.string, yytext + 1); yylval.string [yyleng-2] = 0; return STRING;\
  \ }\n\"PRINT\" { return PRINT; }\n\"A_ENTERO\" { return TO_ENTER; }\n\"A_CADENA\"\
  \ { return TO_String; }\n\":=\" { return ASIG; }\n[a-zA-Z] [a-zA-Z0-9]* {\n    if\
  \ (strlen (yytext) > 19) yytext [19] = 0;\n    yylval.ptr_simbolo = search (t, yytext);\n\
  \    if (yylval.ptr_symbol == NULL) {\n        yylval.ptr_symbol = (symbol *) malloc\
  \ (sizeof (symbol));\n        strcpy (yylval.ptr_symbol-> name, yytext);\n     \
  \   yylval.ptr_symbol-> type = 'i';\n        insert (& t, yylval.ptr_symbol);\n\
  \    }\n    return ID;\n}\n```\n\n包含第 16 行是为了避免当程序员使用超过 19 个字符的变量名时在 `C` 中出现严重错误。最后，`Yacc`\
  \ 程序执行了第 7.3.2.4 节中注释的操作。需要将字符串转换为整数的控制应仅由数字组成（开头有一个可选的连字符以表示负数），这是通过使用 `C` 代码中定义区域定义的\
  \ `isNumber()` 函数实现的。此外，特别注意了确保语义类型错误不会在每个屏幕上产生多于一条消息。每个人都遇到过这样的编译器：在面对代码行中的简单错误时，提供了三或四条错误信息。这些错误链会让程序员感到困惑，因此编译器构造者必须尽可能地避免它们。这样，在处理如\
  \ `c := 4 * \"p\" * \"k\" * 5` 这样的条目之前（其树如图 7.8.a) 所示），只会显示一条错误信息。这是因为在加法或乘法时的错误信息只有在每个参数本身是正确的，但与相邻参数的操作会产生错误时才会显示。然而，像这样的条目……\n\
  \n\n\n\n\n```c\n| 109 | printf (\"Type of% s not defined. \\ n\", $ 1-> name); |\n\
  | 110 | else |\n| 111 | if ($$. type == 'e') |\n| 112 | $$. info.int_value = $ 1->\
  \ info.int_value; |\n| 113 | else |\n| 114 | strcpy ($$. info.cad_value, $ 1-> info.cad_value);\
  \ |\n| 115 | } |\n| 116 | NUMBER { |\n| 117 | $$. type = 'e'; |\n| 118 | $$. info.int_value\
  \ = $ 1; |\n| 119 | } |\n| 120 | CHAIN { |\n| 121 | $$. type = 'c'; |\n| 122 | strcpy\
  \ ($$. info.cad_value, $ 1); |\n| 123 | } |\n| 124 | ; |\n```\n\n![](img/image_rsrcDH4.jpg)\n\
  \n```c\n#include \"TipSimpl.c\"\nvoid main () {\n    yyparse ();\n    print (t);\n\
  }\nvoid yyerror (char * s) {\n    printf (\"% s \\ n\", s);\n}\n```\n\n### 7.3.4\
