  \ 的元组，因此即使在完全不需要时，每个符号也有一个关联的属性（如上面示例中的标记 `+` 情况）。所产生的更改如图 4.3 所示。\n\n因此，属性是与终结符或非终结符关联的信息。动作或语义规则是一种可以访问终结符和/或非终结符属性的算法。作为语义动作，你不仅可以对属性进行赋值，还可以添加代码；例如，当建立关联时：\n\
  \n![](img/image_rsrcDDG.jpg)\n\n```c\nE ÷ E + T\ntwo {\n    E = E + T;\n    one\n\
  }\ntwo {\n    printf (\"% d \\n\", E)\n}\none\n```\n\n使用伪 C 语法，那么每当应用 `E` 规则时，屏幕上都会显示该规则属性的值，在示例中，值将是\
  \ 45 和 65。如果你只想显示全局结果，可以添加一个新规则 `S ÷ E`，并将规则 `E` 的 `printf` 传递给这个规则：\n\n```c\nS\
  \ ÷ E {\n    printf (\"% d \\n\", E);\n}\n```\n\n8598 属性文法\n\n```c\nE ÷ E + T\n\
  two {\n    E = E + T;\n    one\n}\n```\n\n通过这种方式，语法树的构建将多出一次规约，当完成后，结果将出现在屏幕上。注意添加此规则并没有在语法意义上修改语法，因为它继续识别相同的语言，但尽管如此，它通过允许我们只可视化计算的最终结果为我们提供了一个清晰的用途。\n\
  \n图 4.3 不带属性和带属性的栈管理 `α`。\n\n## 4.1.2 语义动作的执行\n\n将语义规则与产生规则关联有两种方法：\n\n-   **语法指导定义**：由将语义动作与产生规则关联组成，但这种关联并没有指示何时应该执行该语义动作。假设在第一阶段构建完整的语法树，然后按照允许计算树节点所有属性的顺序执行语义动作。\n\
  -   **翻译方案**（Translation scheme）：与语法指导定义相同，仅在于额外假设或提供了关于何时必须执行语义动作的信息。此外，还可以在产生规则的后件的符号之间插入动作，例如：`A\
  \ ÷ cd {A = c + d} B`。\n\n![](img/image_rsrcDDH.jpg) 99\n\n在 LR 情况下，动作在进行规约时运行。在带有递归函数的情况下，递归动作与用于识别每个\
  \ BNF 表达式的代码交织在一起。只要我们拥有带有嵌入动作的翻译方案，就可以将其传递给等效的语法指导定义。例如，该方案：\n\n```text\nA ÷ cd\
  \ {action} B\none\n```\n\n可以变为：\n\n```text\nA ÷ cd N\none\nN ÷ g {action}\none\n\
  ```\n\n这是等价的。基本上，这种变换包括引入一个虚拟终结符（示例中的 `N`）来替换每个中间语义动作（`action`），并创建一个以该非终结符为前导、以该语义动作为动作的新类型\
  \ epsilon 的产生规则。\n\n初看之下，这种变换似乎是麻烦的；例如，当将方案：\n\n```c\nA ÷ cd {printf (\"% d \\n\"\
  , c + d); } B\n```\n\n转换为：\n\n```c\nA ÷ cd N\none\nN ÷ g {printf (\"% d \\n\", c\
  \ + d); one}\n}\n```\n\n出现了一个引用 `c` 和 `d` 属性的语义动作，而这些属性关联的规则中 `c` 和 `d` 并不参与。然而，由于只有一个规则在前件中出现\
  \ `N`，且也只有一个规则在后件中出现 `N`，很显然，每当分析器尝试规约到 `N` 或调用实现 `N` 的递归函数时，最后消耗的两个标记将是 `c` 和 `d`，因此语义动作可以在处理最后两个标记的属性时执行，尽管当你粗略查看翻译方案转换后得到的语法指导定义时，似乎看起来有些不对劲。\n\
  \n在处理产生规则（而非递归函数）时，我们可能会遇到其他其他问题。例如，如果你有：\n\n```text\nA ÷ cd {A = c + d} B\n```\n\
  \n并且它变为：\n\n```text\nA ÷ cd N\none\nN ÷ g {A = c + d}one\n```\n\n图 4.4 由规则 `N 6\
  \ g. one.` 规约后的栈 `α` 方案。语义动作无法访问 `A` 的属性，因为 `A` 尚未规约，且不在栈上。\n\n87 ![](img/image_rsrcDDJ.jpg)\
