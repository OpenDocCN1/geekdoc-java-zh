- "# Java 入门指南\n\n\n\n![](img/image_rsrcDAX.jpg)\n\n\n\n\n# 第一章：引言\n\n## 1.1 概述\n\
  计算机与人之间主要的通信机制之一是发送和接收文本消息：用户使用键盘输入指令，计算机执行该指令，并返回一条关于所执行操作的告知性消息作为结果。\n\n尽管目前计算机的演进正趋向于使用创新且符合人体学的用户界面（如鼠标、触摸屏、图形数位板等），但我们可以说，用户在这些界面上执行的几乎所有操作早晚都会被翻译成命令序列，这些序列的执行方式就像是键盘输入过的一样。\n\
  \n另一方面，从 IT 专业人士的角度来看，在计算机上执行的工作充满了许多需要与机器进行直接文本通信的情况：例如使用命令解释器（`shell`）、构建批处理作业文件、使用各种语言进行编程等。即使是像\
  \ `WordPerfect` 和 `MS Word` 这样的文字处理器，也使用结构化文本编码存储用户编写的文档，每当文档被打开时，它都会被识别、遍历并显示在屏幕上。\n\
  \n正因如此，任何称职的计算机科学家都无法避免需要深入了解日常工作中使用的、作为人机交互基础的工具的细节：`翻译器`（translator）。在许多情况下，了解编译器的不同部分是如何工作的非常有帮助，特别是那些负责切割源文本将其转换为语法有效短语的部分。例如，如果我们有一个来自数据库合并的\
  \ `MS Word` 文档，并想从中获取原始的 `DB`（数据库），可能会出现一个看似复杂的情况。如何解决这个问题呢？基于文档结构是由重复块组成的这一事实，解决方案可以是：\n\
  \n1. 将文档转换为纯文本格式。\n2. 使用`翻译器`对该文本进行处理以消除多余字符，生成另一个文本，其中数据库表中的每个字段都包含在引号。\n3. 将上述文本导入任何\
  \ `DBMS`（数据库管理系统）。\n\n`翻译器`构造的其他应用还包括为没有该特性的语言创建预处理器（例如，为了在 `C` 中方便地使用 `SQL`，你可以编写一个预处理器来引入嵌入的\
  \ `SQL`），甚至将 `ASCII 10`（LF）字符转换为 HTML `<br>` 以将文本传递到网页。\n\n在本章中，我们将介绍编译器的构造，并描述其组件、它们工作的环境以及一些有助于构建其编译器的软件。\n\
  \n## 1.2 翻译器概念\n`翻译器`被定义为一个程序，它将用源语言编写的文本或程序翻译或转换为目标语言编写的相应文本或程序，并可能产生错误信息。翻译器包含了`编译器`（其目标语言通常是机器码）和`解释器`（其目标语言由解释器可以执行的原子操作组成）。图\
  \ 1.1 显示了构成编译器/解释器的基本框图。\n\n需要强调的是，今天构建一个编译器的速度非常快。在世纪 20 世纪 50 年代，翻译器被认为是极其难编写的程序。例如，第一个\
  \ `Fortran` 编译器（`Formula Translator`）需要等同于 18 年的个人工作（实际上并没有花那么长时间，因为工作是团队合作完成的）。在自动机理论和形式语言理论应用于翻译器的创建之前，它们的开发一直受到问题和错误的困扰。然而，在今天，一个基础的编译器可以是任何计算机科学专业学生的毕业设计项目。\n\
  \n### 1.2.1 翻译器的类型\n自从计算诞生以来，人们表达需求的形式与计算机解释指令的方式之间存在着鸿沟。翻译器试图弥越这一鸿沟，让人类的工作变得更容易，这导致了自动机理论应用于计算的不同领域和特定领域，产生了我们接下来将看到的不同类型的翻译器。\n\
  \n#### 1.2.1.1 语言翻译器\n它们从一种给定的语言翻译成另一种语言，例如从英语翻译成西班牙语。这类翻译器面临许多问题，即：\n- **对人工智能的需求和固定表达问题**：人工智能的问题在于它有许多人工成分而真正的智能很少，因此今天几乎无法翻译具有深层含义的短语。作为一个轶事，在冷战期间，为了尝试从俄语到英语及反之的自动翻译，他们通过输入英文文本测试了一个原型：“The\
  \ spirit is strong but the flesh is weak”（精神是强大的但肉体是脆弱的），将其翻译成俄语后再译回英语以查看是否与原文匹配。当开发者们得到：“The\
  \ wine is good but the meat It is rotten”（酒很好，但肉是烂的——在英语中 spirit 既指精神也指酒精）时，他们有多惊讶啊。其他难以翻译的例子由这类短语组成，例如：“Piel\
  \ of chicken”（鸡皮）、“in case the flies”（如果有苍子的情况下）、“molar mallet”（磨牙器锤）等。\n- **难以在词义的规范中进行形式化。**\n\
  - **词义随上下文的变化。** 例：“to say that, he took a cookie”（说，他拿了一块饼干）。\n\n通常情况下，语言翻译中最满意的结果出现在语言的限制子集上。甚至如此，出现在文本解释中几乎没有歧义空间的子集中：法律演讲稿、技术文档等。\n\
  \n#### 1.2.1.2 编译器\n编译器的输入是形式语言的句子，输出是一个可执行文件，也就是说，它执行了从高级语言代码到机器码的翻译（编译器也被理解为提供目标文件而非最终可执行文件的程序）。\n\
  \n#### 1.2.1.3 解释器\n它像编译器，但输出是执行。输入的程序在输入的同时被识别并执行。没有物理结果（机器码），只有逻辑结果（一次执行）。有些语言只能被解释，例如\
  \ `SNOBOL`（面向字符串的符号逻辑语言）、`LISP`（列表处理语言）、某些版本的 `BASIC`（初学者全能符号指令代码）等。\n\n解释器的主要优势是允许易于调试。在缺点方面，我们可以首先提到执行速度慢，因为在与翻译内容同时运行时，无法对其进行高程度的优化；例如，如果程序进入循环且优化不是非常精细，相同的指令将被反复地解释和执行，从而减慢程序的执行速度。另一个缺点是在执行期间，解释器必须驻留在内存中，从而消耗更多资源。\n\
  \n除了翻译能够通过使程序更接近机器来优化程序之外，解释执行型语言还具有特点：它们允许构建它们可以自我修改的程序。某些语言尝试结合编译器和解释器的优点并避免它们的缺点；它们是伪解释语言。在这些语言中，源程序通过伪编译生成一个伪可执行文件。为了执行这个伪可执行文件，使其通过一个可以相对高效解释的执行引擎。这具有可移植性的优点，因为伪可执行文件独立于运行它的机器，目前已知的最佳例子是\
  \ `Java` 语言；某些版本的 `Pascal` 和 `COBOL`（面向业务的通用符号语言）也是伪解释的。\n\n#### 1.2.1.4 预处理器\n\
  它们允许在实际编译之前修改源程序。它们利用宏和编译指令。例如，在 `C` 语言中，预处理器用包含 `Uno.c` 文件的完整代码替换 `#include` 指令，这样当编译器开始时，它发现代码已经插入到源程序中了。其他一些预处理指令允许编译可选块：`#ifdef`、`#define`、`#ifndef`。预处理器对程序员来说通常是透明的，甚至可以被认为是编译器的准备阶段。\n\
  \n#### 1.2.1.5 命令解释器\n命令解释器将简单语句翻译为对库程序的调用。它们特别用于操作系统（`shell` 就是一个命令解释器）。被调用的程序可以驻留在内核（kernel）中，也可以存储在某些外部设备上作为可执行例程按需要调入内存。例如，在\
  \ `MS-DOS` 下输入 `copy` 命令，其功能是复制操作系统文件，它驻留在内存中。\n\n#### 1.2.1.6 汇编器和宏汇编器\n它们是编译器的先驱，因为在计算初期，程序是直接用机器码编写的。汇编语言在每条指令与助记词之间建立一一的关系，使得用户使用助记词编写程序，而汇编器负责将其翻译成机器码。这种方式通常直接产生可执行代码，而不是产生目标文件。汇编器是一个简单的编译器，其源语言的结构非常简单，允许将每个句子翻译为机器码中的单条指令。这种编译器支持的语言被称为汇编语言。例：\n\
  ```\n汇编指令: LD HL, #00\n生成的机器码: 65.00h\n```\n另一方面，存在高级汇编器，它们允许将宏指令翻译成各种机器指令。这些程序被称为宏汇编器。从形式角度看，宏汇编器可以被理解为一种预处理器。\n\
  \n#### 1.2.1.7 源转换器\n它们允许将高级语言翻译成另一种高级语言，并可能产生错误信息。例如，由于文档结构是由重复块组成的，解决方案可以是：\n\n\
  1. 将文档转换为纯文本格式。\n2. 使用翻译器处理该文本以消除多余字符，并生成另一个文本的文本。\n3. 将上述文本导入任何 `DBMS`。\n\n####\
  \ 1.2.1.8 交叉编译器\n它是一种生成在另一种机器上执行的代码的编译器，即使在开发阶段使用的机器与目标机器是不同的。这种情况下，转换器通常使用绝对地址，而不是相对地址。\n\
  \n\n\n\n\n| `DO5I = 2.5` | (将值 2.5 赋值给变量 `DO5I`) |\n| `DO 5 I = 2, 5` | (对于 `I`\
  \ = 2, 3, 4 和 5 重循环) |\n\n在这种语言中，在注释和特定类型的字符串之外，空格是没有意义的（在那个信息资源稀缺的时代，为了节省存储空间），因此假设在开始词法分析之前，会抑制所有可移除的空格。在这种情况下，上述命题在词法分析器面前出现的形式将是：`DO5I\
  \ = 2.5` `DO5I = 2.5`\n\n词法分析器在读取到逗号之前，不知道 `DO` 是一个保留字还是变量名的的前缀。为了能够识别它，有必要通过执行所谓的\
  \ `lookahead`（前瞻，或预搜索）操作来检查远超该单词本身的链式输入。这种处理的复杂性建议将其隔离在解析的一个独立阶段中。\n\n无论如何，在像 `Fortran`\
  \ 这样的语言中，是先设计语言然后设计编译器，这导致了像刚才那样的问题。今天的语言在设计时已经考虑了构建编译器的可用工具，并避免了这类情况。\n\n## 2.3\
  \ Token（标记）、Pattern（模式）和 Lexeme（词法）\n\n从通用的角度来看，我们可以抽象出 ![](img/image_rsrcDBR.jpg)\
  \ 实现词法分析的程序，其结构如下：\n\n| (正则表达式) | 一个 | {要执行的动作} | 一个 |\n| :--- | :--- | :--- | :---\
  \ |\n| (正则表达式) | 二 | {要执行的动作} | 二 |\n| (正则表达式) | 3 | {要执行的动作} | 3 |\n| ... | ...\
  \ | ... | ... |\n| (正则表达式) | n | {要执行的动作} | n |\n\n其中每个要执行的动作都是程序片段，描述了当输入序列匹配正则表达式时，词法分析器应该采取的操作。通常这个动作会以返回一个\
  \ `Lexical category`（词法类别）而结束。\n\n这一切引导我们得出以下在整个学习过程中至关重要的概念：\n\n- **Pattern (模式)**：是一个正则表达式。\n\
  - **Token (标记)**：它是与模式关联的词法类别。每个 token 变成一个唯一的标识符数字或代码。在某些情况下，每个数字都带有后续阶段分析所需的额外信息。token\
  \ 的概念从语法分析器使用的语法角度来看，与 `terminal`（终结符）的概念直接对应。\n- **Lexema (词法值)**：它是匹配模式的特定字符序列。例如：`\"\
  8\"`、`\"23\"` 和 `\"50\"` 是符合模式 `+('0' | '1' | '2' | ... | '9')` 的 lexeme。一个模式可以匹配的\
  \ lexeme 数量可以是有限的也可以是无限的，例如，模式 `'W''H''I''L''E'` 只匹配 lexeme `\"WHILE\"`。\n\n一旦检测到一组字符匹配模式，就认为检测到了\
  \ lexeme。你的词法类别编号以及该数字或 `token` 将连同额外信息（如果需要）传递给语法分析器。在图 1.13 中可以看到某些类别关联了信息，而另一些则没有。\n\
  \n例如，如果你需要构建一个识别整数、实数和小小写用户 ID 的词法分析器，你可以提出如下结构：\n\n| 正则表达式+ | 关联终结符 |\n| :--- |\
  \ :--- |\n| `(0 ... 9)` | `NUM_ENT` |\n| `+ (0 ... 9). (0 ... 9)` | `NUM_REAL` |\n\
  | `(a ... z) (a ... z 0 ... 9)` | `ID` |\n\n与整数语法类别关联的是 token `NUM_ENT`，它可以等于数字\
  \ 280；与实数语法类别关联的是 token `NUM_REAL`，它等于数字 281；用户标识符语法类别拥有 token `ID`，它等于数字 282。因此，正则表达式-动作结构如下（假设动作用\
  \ `C` 或 `Java` 表示）：\n\n```c\n+ (0 ... 9) {return 280;}\n+ (0 ... 9). (0 ... 9) {return\
  \ 281;}\n(a ... z) (a ... z 0 ... 9) {return 282;}\n\"\" {}\n```\n\n通过这种方式，遵循该结构的词法分析器如果在执行过程中\
  \ ![](img/image_rsrcDBS.jpg) 遇到字符串：`95.7 99 cont2942`，词法分析将尝试读取更大的 lexeme，因此尽管文本\
  \ `\"95\"` 符合第一个模式，但点及其随后的数字 `\".7\"` 使得分析器决定识别 `\"95.7\"` 为一个整体，而不是独立地识别 `\"95\"\
  ` 和 `\".7\"`；这就是返回 `NUM_REAL` token 的方式。显而易见，除此以外的行为将成为问题的根源。然后模式 `\"\"` 和关联的动作允许忽略空格。`\"\
  99\"` 匹配 `NUM_ENT` 模式，而单词 `\"cont\"` 匹配 `ID`。\n\n为了方便理解与模式关联的动作，我们不再使用数字 280、281\
  \ 和 282，而是定义了助记符：\n\n```c\n#define NUM_ENT 280\n#define NUM_REAL 281\n#define ID\
  \ 282 (\"\" \\ T \\ n)\n```\n\n```c\n+ (0 ... 9) {return NUM_ENT;}\n+ (0 ... 9).\
  \ (0 ... 9) {return NUM_REAL;}\n(a ... z) (a ... z 0 ... 9) {return ID;}\n```\n\n\
  在这个新版本中，通过 `\"\" \\ t \\ n` 进入的 lexeme 没有关联的动作，因此默认情况下执行空动作。\n\n\n\n\n其中 `p` 是一个正则表达式，`action`\
  \ 是一个程序片段，用于描述词法分析器在遇到符合 `p` 的词法（lexeme）时应该采取的动作。在 `Lex` 中，动作是用 C 语言编写的，尽管有许多类似于\
  \ `PCLex` 的元编译器允许使用其他语言进行编码，例如使用 Java 语言的 `Jflex`。由 `PCLex` 创建的词法分析器被设计为与语法分析器同步工作。为了实现这一点，在生成的代码中有一个名为\
  \ `yylex()` 的函数，当它被调用时（通常由语法分析器调用），会开始逐字符地读取输入，直到找到输入中匹配其中一个正则表达式 `p` 的最长前缀；该前缀构成一个词法，一旦被读取，它就被认为“已消费”，其含义是读取器已移动到该词法之后的第一个字符。然后\
  \ `yylex()` 执行 `action`。通常，此动作会将控制权交还给语法分析器，并通知你找到的标记（token）。如果动作没有返回，词法分析器将寻找一个新的词法，并此类推，直到某个动作将控制权返回给语法分析器，或者到达由\
  \ `EOF`（文件结束）字符表示的末尾。重复搜索词法直到找到显式的返回语句，使得词法分析器能够恰当地处理空格和注释。\n\n在执行与模式关联的动作之前，`yylex()`\
  \ 将读取到的词法存储在变量 `yytext` 中。除了标记之外，你还想要向调用函数（通常是语法分析器）传递的任何额外信息，必须存储在全局变量 `yylval`\
  \ 中，其类型稍后会看到。使用 `PCLex` 得到的程序相对较大（尽管运行也非常快），但在面对如今处理的海量内存时，这通常不是问题。`PCLex` 的巨大优势在于它允许你非常快速地构建复杂的分析器。\n\
  \n### 2.4.2 创建词法分析器\n如所述，`PCLex` 拥有它自己的语言，我们称之为 `Lex`，它允许你指定词法分析器的抽象结构，包括正则表达式以及在找到符合每个模式的词法时所采取的动作。\n\
  \n使用该工具创建词法分析器的步骤如下（图 2.4）：\n1. 构建一个 `Lex` 语言的文本文件，其中包含语法分析器的抽象结构。\n2. 使用 `PCLex`\
  \ 元编译上述文件。这将获得一个标准 C 字体的文件。有时你必须对此代码进行直接修改，尽管最新版本的 `PCLex` 已经尽量减少了这种情况。\n3. 使用 C\
  \ 编译器编译 `PCLex` 生成的 C 源码，从而获得一个遵循 2.4.1 节中描述步骤的可执行程序。\n\n### 图 2.4 从 Lex 规范中获取可执行程序\n\
  如果我们运行 `prog.exe`，应用程序将等待通过键盘输入字符串，以便对其进行词法切分；通过按下 `Ctrl` 和 `Z` 键输入文件结束（屏幕上显示 `^Z`）。因此，程序将输入字符串拆分为尽可能长的词法，并为每一个词法执行与其匹配的所符合的模式所关联的动作。\n\
  \n例如，如果 `Lex` 中的源码形式如下：\n```\n[0-9] + {printf (\"number\");} [A-Z] + {printf (\"\
  word\");}\n```\n而我们输入：`HELLO 23 ^ z`\n当词法匹配模式时，`yylex()` 将控制权交给其动作。屏幕上将得到以下结果：\n\
  ```\nword number\n```\n单词“HELLO”符合第二个模式，单词“23”符合第一个模式。请注意，我们没有对空格指定任何模式；默认情况下，当发现不匹配任何模式的字符或字符序列时，生成的\
  \ `yylex()` 函数将将其直接通过标准输出显示，并继续识别下一个词法。\n\n为了避免通过键盘输入源字符串，而是从文件识别，我们可以通过以下方式重定向输入：\n\
  `prog <file.pas> output.txt`\n其中：\n\n| `<file.pas` | 重定向输入和 |\n| `> output.txt`\
  \ | 重定向输出， |\n\n\n\n\n或者使用类型为 `FILE` 的变量 `yyin` 和 `yyout` 将它们初始化为相应的文件。这些变量由 `PCLex`\
  \ 生成的代码提供，初始它们分别指向 `stdin` 和 `stdout`。\n\n## 2.4.3 Lex 语言\n\n一个 `Lex` 程序具有以下结构：\n\
  \n```\nLex definitions area %% /* * 是整个程序中唯一强制性的内容 * /\nRules area%%\nFunction area\n\
  ```\n\n这是在 `Lex` 中可以构建的最小程序：\n%% 在规则区域（rules area）中，你定义了要在输入中查找词法单元（lexemes）的模式，在这些正则表达式旁边，你用\
  \ C 语言详细描述了在找到匹配指定模式的字符串后执行的动作（Actions）。分隔符 \"%%\" 必须位于第 0 列，就像规则和其他特定于 `Lex` 语言的信息一样。\n\
  \n正如已经过的，在 `Lex` 中，如果输入字符串不匹配任何模式，所采取的动作是将该输入写入输出。因此，由于程序 `%%` 没有指定任何模式，生成的词法分析器所做的事情是将输入字符串复制到输出（默认情况下，输出是标准输出）。\n\
  \n## 3346 词法分析\n\n### 2.4.3.1 识别词法单元的 Lex 前提\n\n`PCLex` 生成的 `yylex()` 在遇到歧义时识别词法单元遵循两个基本原则。这些原则按优先级排序：\n\
  \n1. 始终通过识别最长词法单元的模式进入![](img/image_rsrcDBW.jpg)\n2. 发生冲突时，使用出现在第一个模式。\n\n根据第二个前提的结果：识别如\
  \ `WHILE` 等保留字的模式和 `WHILE` 模式始终放在用户标识模式之前。\n\n例如，一个 `Pascal` 的词法分析器（其中 `TYPE` 和\
  \ `VAR` 是保留字）可能看起来如下：\n\n```\n%%\"TYPE\"\"VAR\"[AZ] [A-Z0-9] *...\n```\n\n当 `yylex()`\
  \ 遇到字符串 `\"VAR\"` 时会发生冲突（因为该词法单元可以通过第二个和第三个模式进入）。此时取出现在之前的模式，在示例中为 `\"VAR\"`，将该词法单元识别为保留字。改变这两个模式的顺序将产生严重后果：\n\
  \n```\n%%\"TYPE\"[AZ] [A-Z0-9] *\"VAR\"...\n```\n\n因为这次词法单元 `\"VAR\"` 将通过用户标识模式进入，它将永远不会被识别为保留字：`\"\
  VAR\"` 模式变得多余了。\n\n### 2.4.3.2 Lex 特殊字符\n\n`Lex` 依赖 ASCII 字符集来表示正则表达式，因此我们接下来看到的字符对于该目的具有特殊含义：\n\
  \n- `\"\"`：用于包含任何字面量字符串。根据一般规则，除非包含特殊符号，否则字面量不需要包含在引号中，例如`\"WHILE\"` 模式和 `WHILE`\
  \ 模式是等价的；但为了表示例如 Modula-2 中释的开头，必须对构成模式的字符加引号：`\"(*\"`，因为它本身包含了特殊符号。\n- `\\`：使下一个字符变为字面量。例如：`\\\
  \"` 识别引号。\n- `\\`：也用于表示那些屏幕上没有直接表示的字符：`\\n` 表示换行符，`\\t` 表示制表符等。\n- `\\`：八进制的 `#`\
  \ 代表 ASCII 值为八进制 `#` 的字符。例如：`\\012` 识别十进制字符 10，对应于 `LF`（换行符）。\n- `[]`：允许你指定字符列表，即包含在括号内的字符之一，例如：`[abc]`\
  \ 识别 'a'、'b' 或 'c'（`[abc] / (a | b | c)`）。在括号内部，以下字符也有特殊含义：\n    - `-`：表示范围。例如：`[A-Z0-9]`\
  \ 识别从 'A' 到 'Z' 或从 '0' 到 '9' 的任何字符。\n    - `^`：当出现在开头（紧跟 `[` 之后）时表示取反。例如：`[^ abc]`\
  \ 识别除 'a'、'b' 或 'c' 之外的任何字符。例如：`[^ AZ]` 识别除从 'A' 到![](img/image_rsrcDBX.jpg) 'Z'\
  \ 之外的字符。\n- `?`：前面的字符是可选的。例如：`a? / (a | g)`。例如：`[AZ]?` 识别从 'A' 到 'Z' 或 g。例如：`a?\
  \ B / ab | gb`。\n- `.`：代表任何字符（但只有一个），换行符(\\n)。它非常有趣，因为它允许我们收集任何未被上述模式识别的字符。\n- `|`：表示可选性（或）。例如：`a\
  \ | b` 识别 'a' 或 'b'。例如：`.: | \\N` 识别任何字符。模式 `(. | \\N) *` 很奇，因为这是整个程序，由于 `yylex()`\
  \ 有识别最长的前提，它可能会忽略任何其他模式。事实证明，在识别过程中可能会由于变量 `yytext` 的存储空间溢出而发生错误，记住，它存储当前的词法单元。\n\
  - `*`：表示前面的内容重复 0 次或多次。\n- `+`：表示前面的内容重复 1 次或多次。\n- `()`：允许分组（与算术表达式中的相同）。\n- `{}`：表示重复范围。例如：`a\
  \ {1,5} / aa? A? A? A?` 键可以是某种 *限制的*。它还允许我们为正则表达式命名，以便在多个模式中重用；这稍后会看到。\n\n\n\n\n\
  ![](img/image_rsrcDBY.jpg)\n\n在两个程序中，当词法 `\"home\"` 出现在行首时，两种模式都可以匹配，然后根据现有的二义性，`Lex`\
  \ 会选择第一个。因此，请注意在第一个程序中，它是由相应的模式匹配的，而第二个程序中是由通用模式匹配的，因此模式 `^ \"home\"` 永远不会被使用。\n\
  \n/: 且且仅当其为简单序列（如示例所示）的前缀时，才会识别其置前的模式。例如：`ab / c`；在这种情况下，如果输入的内容是 `\"Abcd\"`，则词法\
  \ `\"ab\"`会被识别，因为它后面紧跟着 `'c'`。如果输入的是 `\"abdc\"`，则该模式将不适用。另一方面，像 `ab / c +` 这样的模式是错误的，因为\
  \ `c +` 模式不被认为是简单序列。\n\n### 2.4.3.4 词法状态 (Lexical status)\n\n词法状态变得类似于互斥的逻辑变量（一次只有一个状态处于激活状态），用于指示只有在关联的词法状态激活时才能应用该模式。在我们目前为止看到的示例中，我们一直使用的是默认词法状态，该状态默认在启动\
  \ `yylex()` 任务时处于激活状态。由于它是默认词法状态，我们不需要对其进行任何显式引用。\n\n各种词法状态（也称为 `start conditions`）在\
  \ Lex 的定义区域中声明，格式如下：\n```\n% START id, id, ...\n```\n\n与模式关联的动作可以通过执行 `BEGIN` 宏来激活词法状态，该宏由\
  \ `Lex` 生成的程序提供。因此：\n```\nBEGIN id;\n```\n它将激活 `start id` 条件，该条件应该在之前已经声明。激活一个词法状态会自动导致所有其他状态的取消。\n\
  \n另一方面，默认词法状态可以通过以下方式激活：\n```\nBEGIN 0;\n```\n要指示某个模式仅在发现 `start id` 条件激活时才作为备选候选，可以在该模式前面加上字符串\
  \ `\"<id>\"`。如果一个模式没有关联显式的起始条件，则假设它关联的是默认词法状态。\n\n以下示例显示了如何显示 Modula-2 程序中所有过程和函数的名称：\n\
  ```\n% START PROC\n%%\"PROCEDURE\" {BEGIN PROC;}\n<PROC> [a-zA-Z] [a-zA-Z0-9]* {\
  \ printf (\"%s \\n\", yytext); BEGIN 0; }\n```\n\n### 2.4.3.5 定义区域和函数区域\n\nLex 程序的定义区域有三个基本用途：\n\
  1. 定义词法状态。\n2. 为最频繁的模式命名。\n3. 编写对整个程序全局有效的 `C` 代码。\n\n已经见过如何定义词法状态，因此我们将继续研究另外两种可能性。\n\
  \n![](img/image_rsrcDBZ.jpg) ![](img/image_rsrcDC0.jpg)\n\n在定义区域中，我们可以创建经常使用的辅助正则表达式并为它们命名。稍后，这些模式可以在规则区域中通过简单在大括号\
  \ `{}` 中指定它们的名称来引用。例如，以下两个程序是等价的，但第一个更清晰，规则也更简洁：\n\n| 程序 1 | | 程序 2 |\n| :--- |\
  \ :--- | :--- |\n| `D` | `[0-9]` | `%%` |\n| `L` | `[a-zA-Z]` | `[0-9] +` |\n| `%%`\
  \ | | `[a-zA-Z] [a-zA-Z0-9]*` |\n\n\n\n\n\n{D} +{L} ({L} | {D}) *请记住，在 Lex 中，所有内容必须从第一列开始。如果某些内容没有从该列开始，PCLex\
  \ 将将其直接传递给生成的 C 程序，而不对其进行处理。通过这种方式，可以创建变量的定义等。然而，不建议这样做，因为 Lex 有一个专门的块用于此操作，在其中你甚至可以处理器指令，而这些指令必须从第一列开始。因此，定义区域还允许你放置纯\
  \ C 代码，这些代码将原封地翻译到 PCLex 生成的 C 程序的开头。对于这些代码，它们使用分隔符 `% {` 和 `%}`。\n\n```c\n% {\n\
  #include <stdlib.h>\ntypedef struct _Node {\n    int value;\n    Node * next; \n\
  } Node;\nNode * symboltable;\n%}\n```\n\n将在此区域使用的全局变量声明放在规则区域的动作（actions）部分中，并包含一个实现符号的文件的\
  \ `#include` 是正常的。读者可能想知道 PCLex 生成的 C 程序中的 `main()` 函数包含什么。事实是，PCLex 并不生成任何 `main()`，相反，它必须由程序员指定。作为一个通用规则，当想要独立运行词法分析器（不带关联的语法分析器）时，通常与每个规则相关的动作不包含任何返回，并且包含一个只调用\
  \ `yylex()` 的 `main()`：\n\n```c\nvoid main () {\n    yylex ();\n};\n```\n\n为了指定\
  \ `main()` 以及估计合适的额外函数数量，可以使用函数区域。该区域会被 PCLex 完全复制到生成的 C 文件中。这就是为什么为了实际目的，在定义区域的\
  \ `% {` 和 `%}` 之间编写代码等同于在函数中编写。以下示例显示了字面量 \"result\" 在输入字符串中出现了几次：\n\n```lex\n%\
  \ {int cont = 0;%}\n%%\n\"Outcome\" {cont ++;}\n. | \\n {;}\n%%\nvoid main () {\n\
  \    yylex ();\n    printf (\"result appears% d times\", cont);\n}\n```\n\n## 2.\
  \ 2.4.3.6 PCLex 提供的函数和变量\n\n众所周知，PCLex 生成的 C 程序的的基础核心是 `yylex()` 函数，它负责查找词元（lexeme）并执行与其相关的动作。这个过程反复执行，直到某个动作找到一个返回或输入结束。此外，PCLex\
  \ 还提供了其他函数、宏和支持变量；下面是按重要性排序的最有趣的列表：\n\n*   `yylex()`：实现词法分析器。\n*   `yytext`：包含当前词元。\n\
  *   `yyleng`：当前词元的字符数。\n*   `yylval`：是一个全局变量，允许与语法分析器进行通信。它实际上不是由 PCLex 定义的，而是由\
  \ `PCYacc` 工具定义的，将在后面的章节中学习它。\n*   `yyin`：类型为 `* FILE`，指向被读取的输入文件。初始指向 `stdin`，因此输入文件匹配输入标准。\n\
  *   `yyout`：类型为 `* FILE`，它指向输出文件（初始为 `stdout`）。\n*   `yyerror()`：这是一个负责输出和处理错误的函数（它会移除屏幕上的错误信息）。它实际上由\
  \ `PCYacc` 定义，正如你稍后看到的。\n*   `yylineno`：整数变量，奇怪的是，它必须由程序员创建、初始化和更新。用于跟踪正在处理的行数。它通常初始化为\
  \ 1，并在每次遇到回车符时加 1。\n*   `yywrap()`：`yylex()` 算法每次遇到 EOF 都会自动调用此宏。这个宏的用处是它可以重新定义（为此，你必须先用\
  \ `#undef` 指令删除它）。如果输入字符串实际上没有结束，此宏应该返回假（在 C 中用整数 0 表示），这可能发生在两种情况：a）正在处理一个二进制文件，其中间可能包含\
  \ EOF 字符，在这种情况下，必须通过对比文件长度与已消耗字符串长度来发现文件的真实结束；b）要识别的字符串被分成几个文件，在这种情况下，当你到达其中一个文件的结尾时，必须在\
  \ `yyin` 中加载下一个并继续处理。如果发现的 EOF 确实是待处理字符串的结束，`yywrap()` 应返回真（整数值 1）。\n*   `yyless(int\
  \ n)`：将当前词元的前 `n` 个字符留在 `yytext` 中。其余部分返回输入，因此我们可以说它们被取消了。`yyleng` 也会方便地修改。例如，模式\
  \ `abc * \\n` 等同于：\n```c\nabc * \\n {yyless (yyleng-1); }\n```\n*   `input()`：从输入中读取下一个字符并将其附加到当前词元。例如，程序：\n\
  ```lex\n%%\nabc {\n    printf (\"% s\", yytext);\n    input ();\n    printf (\"\
  % s\", yytext);\n}\n```\n在输入 \"abcde\" 之前它将通过此模式进入：`input()` 之前的词元（第一个 `printf`\
  \ 中）是 \"abc\"，在 `input()` 之后（第二个 `printf` 中）是 \"abce\"。\n*   `output(char c)`：向标准输出输出字符\
  \ `c`。PCLex 不支持此函数，但 Lex 支持。\n*   `unput(char c)`：取消消耗字符 `c` 并将其放在输入的开头。例如，假设程序：\n\
  ```lex\n%%\nabc {\n    printf (\"% s\", yytext);\n    unput ('t');\n}\nsuch {\n\
  \    printf (\"% s\", yytext);\n}\n```\n接收 \"abc\"。词元的前三个字符与第一个模式匹配。然后 \"al\" 留在输入中，由于执行了\
  \ `unput ('t')`，输入实际上是 \"such\"，匹配第二个模式。\n*   `ECHO`：将输入复制到输出宏（不符合任何模式的词元的动作）。\n\
  *   `yymore()`：允许继续识别下一个词元，但不删除 `yytext` 的当前内容，因此读取的新词元已连接上去。PCLex 不支持此函数，但 Lex\
  \ 支持。`yymore()` 的主要用途更容易识别引号中的字面量。假设你想构建一个识别引号字面量的模式，第一个想法可以是：\n```lex\n[^\"]*\n\
  ```\n这会识别如 \"Hello\"、\"bye\" 甚至 \"Ho\"。\"Hello comrade\" 会产生问题，因为第一个引号被视为结束标记。这个问题通过以下\
  \ Lex 块解决：\n```lex\n[^\"]* {\n    if (yytext[yyleng-1] == '\\'')\n        yymore\
  \ ();\n    else\n        input();\n}\n```\n此模式识别引号字符串（除了最后一个引号），因此带有引号的字符串分部分识别。继续之前的示例，\"\
  Hello, comrade\" 将通过使用 `unput` 和作为标志的全局变量来解决，`yymore()` 永远不会运行，因为它类似于 goto。\n* \
  \  `REJECT`：拒绝当前词元，将其返回输入并寻找另一个模式。`REJECT` 告诉 `yylex()` 找到词元不匹配当前正则表达式。如果 `REJECT`\
  \ 后面有内容，则不会执行。例如，为了搜索 \"keyboard\" 和 \"side\" 出现的次数，可以构造以下 Lex 程序：\n```lex\n% {int\
  \ t = 0, l = 0;}\n%%\nkeyboard {t ++; REJECT;}\nside {l ++;}\n```\n输入 \"keyboard\"\
  \ 时，该程序的行为如下：\n1.-通过读取最长词元 \"Keyboard\" 的模式并执行动作：变量 `t` 增加，当前词元被拒绝，返回整个文本。\n2.-屏幕屏幕显示不匹配任何模式的字符时的默认动作。\n\
  3.-词元 \"side\" 与第二个模式匹配并执行动作：变量 `l` 增加。\n最后，很清楚程序员不应该声明任何与我们学习的相同的函数或变量。事实上，PCLex\
  \ 还会生成一组由单字符组成的辅助变量，因此最好不要命名单字母或以 `yy` 开头的变量或函数。\n\n## 2.5 JFlex 词法分析器生成器\n\nJFlex\
  \ 是由 Gerwin Klein 开发的词法分析器生成器，是普林斯大学开发的 JLex 工具的扩展。JFlex 使用 Java 开发并生成 Java 代码。为\
  \ JFlex 编写的程序格式与 Lex 编写的类似，因此我们将仅关注模式以及 JFlex 输入文件框架之间的差异和扩展。安装和运行 JFlex 是非常简单的。一旦有了\
  \ `jflex-1.3.5.zip` 文件，我们就有 `JFlex.jar` 文件，它只在元编译时是必要的，生成的解析器是完全独立的。JFlex 包的 `Main`\
  \ 类负责元编译我们的输入 `.jflex` 程序；因此，典型的调用形式如下：\n```bash\njava JFlex.Main file.jflex\n```\n\
  这将生成一个实现词法分析器的 `Yylex.java` 文件。图 2.5 展示了要遵循的过程，以及生成的类的默认名称为 `Yylex`。\n\n### 2.5.1\
  \ 从 JFlex 规范获取可移植的 Java 程序\n\n从一个可以讨论的初步示例开始是有趣的。示例（存储在名为 `test.jflex` 的文本文件中）如下：\n\
  \n```java\n/* JFlex example */\nimport java.io.*;\n%%\n//% class Lexer\n//% int\n\
  //% unicode\n//% line\n//% column\n{\n    public static void main (String [] args)\
  \ {\n        Yylex parser = new Yylex(new InputStreamReader (System.in));\n    \
  \    try {\n            parser.yylex();\n        } catch (IOException x) {\n   \
  \         System.out.println (\"Error on line\" + parser.yyline + \"column\" + parser.yycolumn);\n\
  \        }\n    }\n%}\nLine terminator = \\r | \\n | \\r \\n\nwhitespace = {line\
  \ terminator} | [\\t\n% state STRING\n%%\n<YYINITIAL> \"IF\" {\n    System.out.println\
  \ (“IF”);\n}\n<YYINITIAL> {\n    \"=\" {\n        System.out.println (\" =\");\n\
  \    }\n    \"! =\" {\n        System.out.println (\" =\");\n    }\n    \"THEN\"\
  \ {\n        System.out.println (\" THEN\");\n    }\n    whitespace {\n        /*\
  \ Ignore */\n        yybegin(STRING);\n    }\n}\n<STRING> [^\"]* {\n    System.out.println\
  \ (\"Found an ID\");\n}\n<STRING> \"\\\"\" {\n    if (yytext[yyleng-1] == '\\'')\n\
  \        yymore ();\n    else\n        input();\n} {\n    System.out.println (\"\
  A string cannot end in\");\n} {\n    System.out.println(\"Found\" + yytext() + \"\
  on string\");\n} {\n    yybegin(YYINITIAL);\n} {\n    System.out.println (\"Found\
  \ any character\");\n}\n```\n\n如所示，文本被 `%%` 分成三个部分，就像 Lex 一样。然而，每个部分的内容不同，通用结构是：代码区域、导入、选项和声明。下面描述了后两个区域。\n\
  \n### 2.5.2 选项和声明区域\n\n第一个区域用于在规则区导入包。这里你还可以为 JFlex 生成的 `.java` 文件指定 clause。\n\n\
  #### 2.5.2.1 选项\n\n此区域允许你向 JFlex 指定一系列适应元编译生成的 `.java` 文件的选项。以 `%` 字符开头。\n\n####\
  \ 2.5.2.1.1 类选项\n\n最重要的类选项有：\n*   `class name`：默认，JFlex 生成并实现词法分析器的类名为 `Yylex` 并位于\
  \ `yylex.java` 中。使用此选项可以更改类的名称。\n*   `interface`：生成实现指定接口的类（默认 `yylex`）。程序员必须输入使实现有效的方法。\n\
  *   `extends name`：生成自指定类的类。\n*   `public`：生成公共类。默认生成的类没有可见性范围。\n*   `final`：生成一个\
  \ final 类，没有任何可以继承它。\n*   `abstract`：生成一个无法创建对象的抽象类。\n*   `{code}`：程序员可以通过在 `% {`\
  \ 和 `%}` 符号之间向 `yylex` 类包含自己的声明和方法。\n*   `{init}`：通过此选项由 JFlex 自动在构造函数中包含代码。\n\n\
  #### 2.5.2.1.2 分析函数选项\n\n这些选项允许修改负责执行词法分析的方法或函数。最重要的选项有：\n*   `function name`：默认，开始解析的函数名为\
  \ `yylex()` 并返回 `Ytoken` 值。此选项允许你重命名 `yylex()` 函数。\n*   `int`：使 `yylex()` 函数返回 `int`\
  \ 类型的值而不是 `Ytoken`。\n*   `wrap`：使 `yylex()` 函数返回 `Integer` 类型的值代替 `Ytoken`。\n* \
  \  `type name`：使 `yylex()` 函数返回指定的类型（基本类型）而不是 `Ytoken`。在任何情况下，JFlex 都不会创建 `Ytoken`\
  \ 类，必须从外部提供或在代码区域指定。\n\n#### 2.5.2.1.3 文件结束选项\n\n默认，当 `yylex()` 遇到文件结束字符时，它返回空值。如果在之前的选项中指定了\
  \ `%int`，它将返回在 `Yylex` 类中定义为 `public static final` 的 YYEOF 值。为了改变这种行为，最重要的文件结束选项有：\n\
  *   `eofclose`：导致 `yylex()` 一遇到 EOF 就关闭读取通道。\n*   `eofval {code}`：当 `yylex()` 发现\
  \ EOF 时执行代码块。此选项将用于此处。\n\n#### 2.5.2.1.4 字符集选项\n\n这些选项允许你指定 JFlex 生成的词法解析器的输入编码字符集。可能性有：\n\
  *   `7bit`：默认选项，假设输入的每个字符由一个最高位为 0 的单字节组成，提供了 128 个字符。\n*   `8bit`：假设输入的每个字符由一个完整的字节组成，提供了\
  \ 256 个字符。\n*   `unicode`：假设输入将由 Unicode 字符组成。这并不意味着每个字符取两个字节，而是字符恢复留给运行 `yylex()`\
  \ 的平台。\n*   `ignore`：通过使用 `Character` 类的 `toUpperCase` 和 `toLowerCase` 方法使 `yylex()`\
  \ 忽略大小写。显然，前三个选项是互斥的。\n\n#### 2.5.2.1.5 计数器选项\n\n这些选项导致词法分析器存储词元开始时的字符数、行数或列数。命名为：\n\
  *   `char`：在 `yychar` 中存储从输入通道开始到当前词元之间的字符数。\n*   `line`：在 `yyline` 中存储词元所在的行号。\n\
  *   `column`：在 `yycolumn` 中存储词元所在的列号。所有计数器都从 0 开始。\n\n\n\n\n\n```java\n| \"=\" |\
  \ {System.out.println (\"Found =\"); } |\n| \"! =\" | {System.out.println (\"Found!\
  \ =\"); } |\n```\n\n### JFlex 与 Lex 的区别\n\n该领域与 `Lex` 相比的重要区别主要集中在 `JFlex` 包含了一些用于指定模式的额外功能，如下：\n\
  \n- `\\u #hexadecimal`：代表 Unicode 值为 `#hexadecimal` 的字符。例如：`\\u042D` 代表字符 \"Э\"\
  。\n- `!`：匹配任何不通过所遇模式进入的词法标记（lexeme）。例如：`! (Ab)` 匹配除标记 \"ab\" 以外的任何内容。![](img/image_rsrcDC9.jpg)\n\
  - `~`：匹配以任何内容开头，并以符合后续模式的文本首次出现作为结尾的词法标记。识别 Java 风格注释（非嵌套）变得更简单的方法是模式：`\"/ *\"`\
  \ `~`\"* /\"`\n\n### 预定义字符类\n\n另一方面，`JFlex` 包含了一些预定义的字符类。这些类被包含在符号 `[:` 和 `:]` 之间，每个类都匹配满足特定谓词的字符集。例如，模式\
  \ `[: digit:]` 匹配满足 `Character` 类中 `isDigit()` 逻辑函数的字符。\n\n模式列表如下：\n\n| 模式 | 关联的谓词\
  \ |\n| :--- | :--- |\n| `[: jletter:]` | `isJavaIdentifierStart()` |\n| `[: jletterdigit:]`\
  \ | `isJavaIdentifierPart()` |\n| `[: letter:]` | `isLetter()` |\n| `[: digit:]`\
  \ | `isDigit()` |\n| `[: uppercase:]` | `isUpperCase()` |\n| `[: lowercase:]` |\
  \ `isLowerCase()` |\n\n\n\n\n最后，与 `Lex` 的其他两个重要区别是：\n每个规则必须有一个关联的词法动作，即使它是空的。\n\
  如果一个词法（lexeme）不符合任何模式，则会发生词法错误。\n模式 `\\n` 仅包含 ASCII 代码 10 字符，但不包含 `ASCII 13` 字符，后者由\
  \ `\\r` 模式表示。\n\n## 2.5.4 `Yylex` 类的函数和变量\n\n我们已经见过 `JFlex` 生成的两个最重要的函数，程序员可以在词法动作中使用它们。我知道这里处理的是成员函数和变量，因此，如果它们在词法动作之外使用，应该指示它们所属的上下文对象（例如\
  \ `myAnalyzer.yylex()`）。在这里我们回顾并扩展了它们：\n\n- `Yylex (Reader r)`：词法分析器的构造函数。接受读取字符的输入通道作为参数。\n\
  - `Yytoken yylex()`：实现词法分析器的主函数。接收调用 `Yylex` 构造函数时指定的参数输入。你可以抛出 `IOException`，建议在\
  \ `try-catch` 语句内部调用它。\n- `String yytext()`：返回当前的词法（lexeme）。\n- `int yylength()`：返回当前词法单元的字符数。\n\
  - `void yyreset (Reader r)`：关闭当前输入通道并将输入重定向到参数指定的新通道。\n- `void yypushStream (Reader\
  \ r)`：将当前输入流保存到栈中，并在新的指定通道上继续读取。当结束时，将从栈中取出之前的通道并继续读取。该函数对于实现 C 等语言中的 `#include`\
  \ 指令具有特殊重要。\n- `void yypushback (int n)`：等同于 Lex 的 `yyless()` 函数。\n- `yyline`, `yychar`\
  \ 和 `yycolumn`：这些分别是由 `% line`、`% char` 和 `% column` 选项生成的变量，并在 2.5.2.1 节中讨论过。\n\
  \n# 第 3 章 语法分析\n\n## 3.1 概述\n每种编程语言都遵循描述其所接受的良好程序的语法结构的规则。以 Pascal 为例，一个程序由块（blocks）组成；块由语句（sentences）组成；语句由表达式（expressions）组成；表达式由词法组件（lexical\
  \ components）组成；以此类推，直到基本字符。你可以通过自由上下文文法或使用 `BNF`（Backus-Naur 形式）表示法来描述编程语言构造的语法。\n\
  \n形式文法为语言设计者和编译器开发者带来了显著优势：\n- 语法是编程语言的精确的语法规范。\n- 可以从语法树中自动生成解析器。\n- 上述的自动生成过程可以发现歧义性。\n\
  - 语法为编程语言提供了结构，使其更容易生成代码和检测错误。\n- 如果用语法描述语言，则更容易扩展/修改语言。\n\n本主题的大部分内容将致力于编译器中常用的语法分析方法。我们将从基础知识和手动应用的的正确技术开始。接下来，我们将讨论管理和语法错误恢复。我们将学习使用下自动机（battery-powered\
  \ automata）的正式分析方法，最后，我们将深入自动生成语言解析器的元编译器的操作。\n\n## 3.2 解析器概念\n它是分析器中的一个阶段，负责根据给定的语法检查代表输入文本的标记序列\
  \ A。如果输入程序有效，它将提供基于计算表示识别它的语法树。该树是分析阶段后续阶段（语义分析）的起点。\n\n但这是理论；在实践中，解析器驱动编译过程，使得其余阶段随着语法识别输入序列而不断演进，因此树往往甚至不会被实际生成。\n\
  \n在实践中，解析器还负责：\n- 它结合了语义动作，在其中放置编译器的其余阶段（词法分析器除外）：从语义分析到代码生成。\n- 报告发现的语法错误的性质，并尝试从中恢复以继续编译。\n\
  - 控制词法分析器识别的标记流。\n\n简而言之，它执行了编译几乎所有的操作，产生一种称为语法驱动编译的工作方法。\n\n## 3.3 语法错误处理\n如果编译器只能处理正确的程序，它的设计和实现将大大简化。程序的初始版本往往是不正确的，良好的编译器应该帮助程序员识别和定位错误。此外，考虑错误管理可以简化编译器的结构并提高其对错误的响应。\n\
  \n编程错误可以是以下类型：\n- 词法错误：由拼错标识符、关键字或操作符引起。\n- 语法错误：由算术表达式或括号不平衡引起。\n- 语义错误：例如将操作符应用于不兼容的操作数。\n\
  - 逻辑错误：可以是无限递归调用。\n- 纠正错误：当程序没有按照程序员实际意愿执行时。\n\n显然，纠正错误无法被编译器检测，因为它们涉及到程序员对所构建程序的抽象概念，而这些概念对编译器来说是未知的，而且可能是不可获知的。另一方面，逻辑错误的检测意味着巨大的计算量，因为编译器必须能够发现运行程序可能遵循的不同流，这在许多情况下，这不仅是昂贵的，而且是不可能的。由于于这些原因，目前的编译器侧重于识别前三种类型的错误。在这个主题中，我们将讨论语法错误，即那些阻止正确构建语法树的错误。\n\
  \n从编译器的创建来看，语法错误处理是最复杂的。我们感兴趣的是当编译器发现错误时，不要彻底取消编译，而是恢复并继续寻找错误。恢复错误并不意味着纠正它，而是能够在尽管发现错误的情况下继续构建语法树。鉴于此，解析器的错误处理程序应该实现目标：\n\
  - 清晰且准确地指示错误。你必须通过相应的消息报告错误类型及其位置。\n- 从错误中恢复，以便继续检查条目。\n- 区分错误和警告。警告通常用于报告有效的语句，但因为它们出现频率较低，它们可能是逻辑错误的来源。\n\
  - 不要显著减慢编译速度。一个良好的编译器应该考虑到可能发生的错误而制作，从而简化了其结构。此外，如果编译器本身准备好承认即使是最频繁的 bug，那么你就可以改进对这些错误的响应，甚至纠正它们。\n\
  \n下面将依次讨论几种管理错误的策略。\n\n### 3.3.1 忽略问题\n这种策略（英语中称为 panic mode，恐慌模式）包括忽略从入口到安全条件的其余部分。这种情况在我们发现一个特殊标记（例如\
  \ 'END'）时发生。从该点开始，继续正常分析。\n\n### 3.3.2 短语级恢复\n在发现错误后尝试纠正它。例如，在上述案例中，你可能足够聪明而插入标记\
  \ `;`。使用这种方法要小心，因为它可能导致无限恢复，即纠正尝试不是正确的，而是引入了新错误，而新错误反又尝试以同样错误的方式纠正，以此类推。\n\n###\
  \ 3.3.3 附加产生规则\n这种机制在描述语言的正式文法中增加了产生规则，以识别最常见的错误。继续 3.3.1 点的情况，你可能放置类似的内容：\n`wrong_sent\
  \ ÷ sent_unfinished sent_finished`\n`sent_finished ÷ statement ';'`\n`sent_unfinished\
  \ ÷ sentence`\n这赋予了我们更大的控制权，甚至允许我们恢复并纠正问题，并发布警告消息而不是错误消息。\n\n### 3.3.4 全局纠正\n该方法尝试尽一切手段为标记序列获取语法树。如果存在任何错误且序列无法被识别，该方法将推断出一个与原始序列尽可能的语法正确的标记序列，并为该序列生成树。也就是说，解析器向词法询问整个标记序列，它所返回的是与输入字符串最接近但没有错误的内容，以及识别它的树。\n\
  \n## 3.4 解析器使用的语法\n我们将精力放在语法分析的研究上\n\n\n\n\n| `E` | `→` | `E + T` |\n| `T` | `|`\
  \ | `T` |\n| `T` | `→` | `T * F` |\n| `to` | `|` | `F` |\n\n![](img/image_rsrcDCF.jpg)\n\
  \n基于形式文法的语言，否则编译的理解工作将变得非常困难。编译器所接受的语言的格式化可以使其构建过程系统化，并允许可能更容易地纠正那些极难定位的错误，例如某些句子识别中的歧义问题。\n\
  \n解析器所接受的语法是上下文无关文法，因为要理解更复杂的语法或自动构建能够识别其所接受句子的归自动机是不的。\n\n请记住，语法 `G` 是由一个包含四个元素的元组\
  \ `(N, T, P, S)` 定义的：\n- `N` = 非终结符（Non-terminals）。\n- `T` = 终结符（Terminals）。\n-\
  \ `P` = 产生规则（Production Rules）。\n- `S` = 起始公理（Initial Axiom）。\n\n例如，一个识别算术运算的无歧语法可以是表\
  \ 3.1 中的那个。在表中，`N = {E, T, F}`，因为 `E`、`T` 和 `F` 出现在某些规则的左侧；`T = {id, num, (,), +,\
  \ *}`；`P` 是七条产生规则，且 `S = E`，因为默认情况下起始公理是第一条产生规则的前驱。\n\n### 3.4.1 推导\n\n产生规则可以被等同于产生规则重写，其中左侧的非终结符被产生式右侧的伪字符串替换。我们可以认为伪字符串是任何终结符和/或非终结符的序列。形式上，当一个伪字符串\
  \ `α` 在伪链 `β` 中推导出时，记为 `α` ⇒ `β`，当：\n\n注意，在 `α` 内部可能会有多个可以重写的非终结符 `A`，导致多种可能的推导。这使得它们产生了以下概念：\n\
  - **左推（Bypass to the left）**：是指对起始伪字符串中最左侧的非终结符进行重写。\n- **右推（Bypass on the right）**：是指对起始伪字符串中最右侧的非终结符进行重写。\n\
  \n| `F` | `→` | `id` |\n| `ç` | `|` | `num` |\n| `and` | `|` | `(E)` |\n\n表 3.1\
  \ 识别算术表达式的无歧语法\n\n![](img/image_rsrcDCG.jpg)\n\n### 语法分析\n\n例如，从表 3.2 的语法开始，我们将从起始公理出发，尽可能进行所有的左右向左推导，目标是构建标记链：`(id\
  \ * id + id)`。在每一个步骤中。伪链由一个小箭头指向，被选择用于进行下一次推导的非终结符。\n\n| `E` | `→` | `E + E` |\n\
  | `to` | `|` | `E * E` |\n| `to` | `|` | `num` |\n| `to` | `|` | `id` |\n| `ε` |\
  \ `|` | `(E)` |\n\n表 3.2 识别算术表达式的歧义语法\n\n\n\n\n左侧的推导为：`EYE + EYE * E + EY id * E\
  \ + EY id * id + EY id * id + idone one two one two 3 8 8 8 8 8`。\n\n右侧的推导将产生：`EYE\
  \ + EYE + id YE * E + id YE * id + id Y id * id + id3 3 two 3 one two 3 8 8 8 8\
  \ 8`。从初始公理开始的任何推导序列后产生的伪字符串称为型式。\n\n### 3.4.2 语言句子的句法树\n\n就像我们可以分析一个西班牙语句子并得到句法树一样，对编程语言的句子也是可能的。基本上，句法树对应于句子，遵守语法规则，并构成一个用于描述该句子推导过程的表示。树的根是初始公理，根据我们的习惯，我们将将其画在树的顶部或底部。\n\
  \n作为树的内部节点，是我们所应用的产生式规则中的非终结元素，每一个元素拥有的子节点数量等于所应用规则右侧符号的数量。\n\n让我们来看一个使用框 3.1 中语法的例子；假设我们必须识别词法分析器提供的字符串\
  \ `(a + b) * a + b`，其提供的形式为 `(id + id) * id + id`，我们将构建句法树，它如图 3.2 所示。\n\n注意，从初始公理开始并终到达待识别字符串的推导序列构成了句法树的表示。每一步都会添加树的新部分，因此过程开始时从一个只有一个根（初始公理）的树开始，如下：\n\
  \n```\n![](img/image_rsrcDCH.jpg)\n图 3.2. 对应于序列 `(id + id) * id + id` 识别的句法树，用颜色标记。我们看到的推导也从初始公理开始。通过这样，在每次推导中，从正在形成的树中选择一个叶子节点并添加它们的子节点。每一步，正在构建的树的叶节点构成了推导运行的型式。另一方面，推导序列不仅表示句法树，还提供了产生式规则应用顺序的信息。\n\
  ```\n\n这棵树的构建涉及产生式规则的智能应用。如果待识别的句子是错误的，即它不属于语法生成的语言，将无法获得其句法树。在其他情况下，一个语句可能允许多个句法树。当这种情况发生时，称该语法是歧义的。必须避免这种情况，因此必须修改语法或应用消除歧义的规则（我们稍后会）。\n\
  \n例如，框 3.2 的语法是歧义的，因为在多次相加之前不区分左和右，也就是说，在由标记 `id aux cont + id + id` 翻译的句子 \"aux\
  \ + cont + i\" 之前，你可以得到图中所示两个不同的树：\n\n```\n![](img/image_rsrcDCJ.jpg)\n句法分析\n图 3.3.\
  \ 使用歧义语法识别句子的示例。两棵树遵循两个推导序列：\n蓝色树：`EYE + id YE + E + id YE + id + Y id + id`\n另一棵树：`EYE\
  \ + EY id + E + EY id + id + id + id`\n```\n\n如所所的，问题的关键在于第二次推导：在蓝色的树中，推导是向右进行的，而在另一棵树中是向左的；如果从字符串向初始公理读取树，蓝色树导致和\
  \ `((id + id) + id)` 的左结合性，而另一棵产生右结合性 `(id + (id + id))`。这一事实可以让我们意识到，句法树的构建方式也涉及语义方面。\n\
  \n## 3.5 解析的类型\n\n根据构建句法树采用的近似方法：\n\n- **自下法（Descendants）**：它们从初始公理开始，向左进行推导，直到获得识别判定的导符序列。它们可能是：“带回溯的”。使用递归函数。`![](img/image_rsrcDCK.jpg)`\
  \ 来自 LL(1) 语法。\n- **自向上（Ascending）**：它们从输入句子开始，反向推导（从后件到前件），直到初始公理。它们可能是：“带回溯的”。来自\
  \ LR(1) 语法。\n\n我们将在下面详细学习这些方法中的每一种。\n\n#### 3.5.1 带回溯的向下分析\n\n由于这是一种自向下的方法，我们从初始公理开始，顺序对正在处理的句子形式的最左侧非终结符应用所有可能的规则。我们可以说，语言中的所有句子都作为树节点存在，表示从任何型式开始的所有可能的推导，并以初始公理为根。这是语法的通用树，因此它的分支是推导序列，并代表了句法树。基本上，我们可以说带回溯的下降分析方法旨在在通用树中搜索待识别的句子；当找到它时，将其与根隔离开的路径就提供了句法树。现在，句子可能是错误的，且没有作为树的节点，加上树很可能是无限的，这导致需要提出一个语句来告诉我们何时取消搜索，因为它被认为是徒劳的。\n\
  \n为了看到这个例子，让我们从表 3.3 的语法开始，它与图 3.1 中的等效，尽管现在提出的这个不是左递归的。并且假设你想识别以下序列：\n\n| E | T\
  \ + E |\n| :--- | :--- |\n| E | T |\n| T | F * T |\n| T | F |\n| F | go |\n| F |\
  \ num(E) |\n\n**表 3.3** 不产生歧义且非左递归的用于识别算术表达式的语法\n\n\n\n\n\n# 语法分析：`(id + num) *\
  \ id + num`\n\n使用图 3.4 中的树，可以推导出所提语法法可识别的所有可能句子。分析所遵循的带回溯的下降算法，其过程是在这棵树中进行搜索，通过首次深度遍历找到最终终止于待识别句子的分支。\n\
  \n具有句型形式 `τ` 的分支何时会被丢弃呢？例如，![](img/image_rsrcDCM.jpg) 当 `τ` 的第一个非终结符左侧的标记序列与图 3.4（表记语法的通用树）不匹配时。\n\
  \n它们仅表示了左侧的推导符以及树中从待识别序列头部开始的前四层。虽然可以建立其他的剪枝标准，但我们将在研究中使用这一个。\n\n简而言之，其意在于遍历通用树，深入每个分支，直到找到一个无法匹配所搜索句子的句型，在这种情况下该分支被丢弃；或者匹配了所寻求的内容，此时句子被接受。如果通过任何分支都无法确认句子，则该句子被拒绝。\n\
  \n在图 3.4 的通用树中，根据我们的剪枝标准，继续执行已无意义的分支被标记为红色。其余分支将继续对语句 \"(id + num) * id + num\"\
  \ 进行搜索。此外，每个轴都用所应用的规则标识符进行了编号。\n\n由于选定了剪枝标准，如果语法是左递归的，深度搜索将无法运行，因为将会存在无限分支，其中句型左侧的终结符数量不会增加，我们的搜索将进入无限递归。在这种情况下，必须引入新的剪枝标准。\n\
  \n带回溯的解析器在实践中很少使用。这是因为回溯效率非常低，而且还有其他基于不同机制的更强大的分析类型，正如我们后面将看到的。即使对于自然语言，回溯也完全无效，人们更倾向于其他方法。![](img/image_rsrcDCN.jpg)\
  \ ![](img/image_rsrcDCP.jpg) 以下是带回溯的自顶向下分析算法：\n\n```\nPrecondition: Sentential form\
  \ `/μ A δ`, with `μ 0 T`, `A 0 N`, and `δ 0 (N c T)*`\n\nDescendingWith Backspace\
  \ Analysis ( sententialform , input )\n  Yes `μ †` Left part ( input ) Return End\
  \ Yes\n  For each `p 0 {p 0 P 'p / A ÷ α}i i i* formaSentential´ / μ α δ / μ´ A´\
  \ δ´,i​` with `μ´ 0 T`, `A´ 0 N`, `y δ´ 0 (N c T) *`\n    If `μ´ / inputSentence`\
  \ recognized!ReturnEnd yes\nDescendingWith Backspace Analysis ( formSentential´\
  \ , input )\n  Yes Sentence recognized! Return End Yes\nEnd ForForEnd Analysis DescendingWithReverse\n\
  而主调用将是：\n`Descending AnalysisWith Backspace ( initial axiom , stringAReconocer )`\n\
  Yes NOT Acknowledged sentence!Sentence not recognized !!End yes\n```\n\n## 语法分析执行\n\
