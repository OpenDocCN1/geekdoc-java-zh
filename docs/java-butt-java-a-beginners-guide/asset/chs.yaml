  \ generationAssignComposite()` 也包含了将简单赋值作为其递归基例的概念。\n\n## 8.4 控制语句中的代码生成\n\n在学习了算术表达式中代码生成的通用机制后，下一步是研究等同于控制执行流的高级语句的三元组代码。这些语句包括了\
  \ `WHILE` 和 `REPEAT` 循环，以及 `IF` 和 `CASE` 条件语句。\n\n正如我们在第 8.2 节中所看到的，执行流的控制是通过 `goto`\
  \ 和 `call` 三元组在低层完成的。在本文中不会详细讨论子程序管理，而是专门关注无条件和有条件的 `goto`。\n\n### 8.4.1 起始语法\n\n\
  我们的目标是识别那些允许我们对整数类型变量进行赋值的程序，并根据条件评估进行流程更改。条件可以是简单的也可以是复杂的；在简单情况下，只会出现关系运算符：`>`、`<`\
  \ `=` 等；在复杂情况下，可以使用逻辑运算符 `AND`、`OR` 和 `NOT` 来连接最基础的条件。\n\n如所示，有 `WHILE` 类型和 `REPEAT`\
  \ 类型循环。在前者中，在进入循环体之前会评估一个条件；如果条件为真，则执行循环体并重新开始过程；否则，则继续 `WHILE` 之后的下一个语句。因此，只要伴随\
  \ `WHILE` 的条件为真，循环体就会一直执行。另一方面，`REPEAT` 循环在执行循环体后评估条件，因此循环体将一直运行，直到循环条件为真。\n\n作为条件语句，允许使用\
  \ `IF` 子句，它允许在条件为真时选择性地执行一个代码块。同样，一个 `IF` 也可以带有一个可选的 `ELSE` 部分，当条件为假时执行它。另一方面，还包含了\
  \ `CASE` 语句，它评估一个算术表达式并与默认值列表中的每个元素进行比较；如果与其中任何一个匹配，则执行与该值相关的代码块。如果与它们任何一个都不匹配，则执行（可选地）由\
  \ `OTHERWISE` 子句指示的代码块。最后，决定不包含 `FOR` 语句，以便让读者尝试编写自己的解决方案，因为这是一个有趣的练习。\n\n为了阐明代码生成的纯机制，并且不混入语义动作（不包含任何与符号表管理或类型控制相关的动作），因此决定我们的小型语言只有\
  \ `integer` 类型，且不需要在在使用之前声明变量。\n\n将使用的产生规则格式的语法如下：\n\n```text\nprog : prog sent\
  \ ';' | prog error ';' | / * Epsilon * /\nsent : ASIG ID expr \n      | IF cond\
  \ THEN sent ';' optional FIN IF\n      | '{' sent_list '}'\n      | WHILE cond DO\
  \ sent ';' FIN WHILE\n      | REPEAT sent ';' UNTIL cond\n      | ';' sent_case\n\
  optional : ELSE sent ';'\n      | ';' / * Epsilon * /\nsent_list : / * Epsilon *\
  \ /\n      | sent_list sent ';'\n      | ';' sent_list error ';'\nsent_case : case_home\
  \ OTHERWISE sent ';' FIN CASE\n      | ';' start_case FIN CASE\nhome_case : CASE\
  \ expr OF\n      | ';' case_home CASE expr ':' sent ';'\nexpr : NUMBER\n      |\
  \ ID\n      | expr '+' expr\n      | expr '-' expr\n      | expr '*' expr\n    \
  \  | expr '/' expr\n      | '-'expr% prec MINUS_UNARY\n      | '(' expr ')'\ncond\
  \ : expr '>' expr\n      | expr '<' expr\n      | expr 'MAI'expr\n      | expr 'MEI'expr\n\
  \      | expr '=' expr\n      | expr 'DIF'expr\n      | NOT cond\n      | cond AND\
  \ cond\n      | cond OR cond\n      | '(' cond ')'\n```\n\n\n\n\n\n![](img/image_rsrcDJR.jpg)\
  \ 需要注意的是，`WHILE`、`REPEAT`、`IF` 等语句的体由单个语句组成。如果你想包含多个语句，其机制是求助于使用复合语句。复合语句由由大括号分隔的语句列表组成，如规则所示：`sent:\
  \ '{' sent_list '}'`。此外，没有任何限制阻止在任何流程控制语句的体中进入另一个流程控制语句。更重要的是，判断（Judgments）的嵌套可以在任何深度发生。这一事实使得必须特别注意错误控制。如语法所示，有两个错误规则，一个在程序级，另一个在\
  \ `sent_list` 级（即在复合语句的体中）。如果复合语句内部发生语法错误，而你只有程序层级的错误规则，那么恢复将是错误的，因为恐慌模式（panic mode）机制会从栈中弹出项，直到找到\
  \ `prog ;`，然后它会提取标记直到找到分号。最后，它将继续解析过程，认为它已经方便地恢复了错误，并且后续语句位于程序级，但这是错误的，因为它们处于复合语句内部。这个问题在图\
  \ 8.6 中得到了阐明。为了避免这种情况，有必要在复合语句级引入一个新的错误规则。图 8.6 使用复合语句时需要两个错误规则![](img/image_rsrcDJS.jpg)\
