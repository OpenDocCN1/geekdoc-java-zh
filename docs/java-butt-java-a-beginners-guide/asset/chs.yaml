  \ + (++ actualEtq);\n    }\n    private String generateTerceto (String third) {\n\
  \        String tmp = newTmp ();\n        System.out.println (tmp + triplet);\n\
  \        return tmp;\n    }\n    private BlockCondition generateCondition (String\
  \ Rvalor1, String condition, String Rvalor2) {\n        BlockCondition etqs = new\
  \ BlockCondition ();\n        etqs.etqTrue = newEtq ();\n        etqs.etqFalse =\
