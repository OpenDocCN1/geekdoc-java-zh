  \ yytext ()); }\n[b¯ / \\ t] + {\n    currentLine ++;\n}\n{\n    System.out.println\
  \ (\"Lexical error on line\" +\n}\n```\n\n与 Cup 相比，根本区别在于使用了 `CASE` 和 `Condition`\
  \ 对象来为某些非终结符分配多个属性。另一方面，`generateTerceto` 和 `generateCondition` 函数与 Lex 和 Yacc 不同，现在必须赋值给\
  \ `RESULT`。最后，在规则内就地且通过冒号分离的属性名称是为了提高代码的可读性。Cup 程序如下：\n\n```java\nimport java_cup.runtime.*;\n\
  import java.io.*;\nparser {:\n    public static void main (String args []) throws\
