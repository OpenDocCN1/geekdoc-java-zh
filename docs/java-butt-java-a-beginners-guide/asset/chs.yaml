  e: e '+' t {printf (\"This is a sum. \\n\"); }\n| t {printf (\"This is a term. \\\
  n\"); };\n```\n\n### 4.3.1.4 函数区域\nYacc 规范的第三部分由用 C 语言编写的支持例程组成。在这里必须提供一个名为 `yylex()`\
  \ 的函数的词法分析器。如有，可以添加其他过程，例如支持例程或编译总结。\n\n词法分析器 `yylex()` 生成由标记及其关联属性值组成的对。如果返回了如\
  \ `NUM` 或 `ID` 的标记，则该标记必须在 Yacc 规范的第一部分声明。与标记关联的属性值通过变量 `yylval` 传递给解析器，如第 4.3.2\
  \ 节所示。在将 Yacc 与 Lex 集成时，在此部分必须 `#include` 由 PCLex 生成的文件。\n\n具体而言，此部分必须指定指定函数：`main()`，它通过调用\
  \ `yyparse()` 启动解析器；`void yyerror(char * s)`，它接收一个描述错误的字符串。此时，变量 `yychar` 包含接收到的预期的终结符。\n\
  \n## 4.3.2 属性管理\n如所述，规则可以包含语义动作，![](img/image_rsrcDE5.jpg)，这些仅仅是 C 语言中局部声明和语句的序列。但\
  \ Yacc 中动作的真正威力在于每个终结符或非终结符都可以关联一个属性。属性名称始终是相同的，取决于符号在规则中所占的位置，而不是符号本身；通过这样，名称 `$$`\
  \ 指向规则前部的属性，而 `$ i` 指向与后部第 i 个语法符号关联的属性，即：\n- 前部属性是 `$$`。\n- 后部第 1 个符号的属性是 `$ 1`。\n\
  - 后部第 2 个符号的属性是 `$ 2`。\n- 等此类推。\n\n只要语义动作被相关的产生规则还原就会执行，因此它通常负责根据 `$ i` 计算 `$$`\
  \ 的值。例如，如果我们假设语法中所有符号（终结符和非终结符）的属性都是整数类型，它将具有：%%\n\n```yacc\nØe: e '+' t {$$ = $1\
  \ + $3;}\n| t {$$ = $1;}\nÚt: t '*' f {$$ = $1 * $3; }\n| F {$$ = $1;}\nÜf: m '('\
  \ e ')' {$$ = $1 * $3; }\n| m ID {$$ = $1 * $2; }\n| m NUM {$$ = $1 * $2; }\n```\n\
  \n\n\n\n\n`; /* Epsilon */ {$$ = +1; } to | '-' | {$$ = -1; };` 另一方面，在以前例的规则 `Ý`\
  \ 和 `Þ` 中，可以看到 `$2` 分别引用与 `ID` 和 `NUM` 相关的属性；但是，由于 `ID` 和 `NUM` 是终结符（terminal），它们的属性值是什么呢？是谁来决定在它们中保存什么值呢？\n\
  \n答案是，词法分析器负责给终结符的属性赋值。记住在第 2.4.3.6 节中研究过，`PCLex` 提供了全局变量 `yylval`，它允许与标记（token）关联额外信息。通过这个变量，词法分析器可以将属性传递给语法分析器。这样，当词法分析器接收到类似\
  \ `\"27 + 13 + 25\"` 的字符串时，它不仅应该生成 `NUM` '+' `NUM` '+' `NUM` 标记序列，还应该加载每个 `NUM`\
  \ 属性的值，并且必须在返回标记之前（在执行 `return NUM;` 之前）完成。在我们的情况下，我们将为每个 `NUM` 关联代表其词法单元的整数值，以便语法分析器的语义操作对其进行处理。\n\
  \nLex 模式及其关联词法动作如下：\n```c\n[0-9] + {yylval = atoi (yytext); return NUM; }\n```\n\
  `atoi()` 函数将文本转换为整数。注意，每当调用 `atoi()` 时，转换都将成功，因为由于关联模式，存储在 `yytext` 中的词法单元不会包含非数字。此外，假设变量\
  \ `yylval` 也是整数类型。\n\n`PCYacc` 需要一些额外信息来执行属性管理（attribute management），也就是说，我们必须通知你语法中每个符号关联的属性类型，无论是终结符还是非终结符。为了这一点，必须定义宏\
  \ `YYSTYPE`，它指示了所有属性的类型；换句话说，`PCYacc` 假设所有属性都是 `YYSTYPE` 类型，因此你必须给这个宏赋值值。这样，如果我们希望所有属性都是\
  \ `int` 类型，只需在定义区域全局声明部分写入：\n```c\n#define YYSTYPE int\n```\n事实上，`PCYacc` 强制要求 Yacc\
  \ 程序中包含这样的声明，即使属性没有被任何使用：`PCYacc` 要求始终关联属性并感知你的类型。\n\n然而，很明显，语法中的并非所有符号都需要相同类型的属性，非常常见的情况是数字关联一个整数属性，而标识符（identifiers）关联一个符号表指针，该表存储了关于它的重要信息。在这种情况下，可以将\
  \ `YYSTYPE` 声明为 C 联合体（union），这样虽然语法中的所有符号都拥有该联合体作为属性，但每个符号只使用其指定的字段。虽然这种方法可能会稍微浪费内存，但它允许对解析栈进行一致性管理，从而提高效率。\n\
  \n此外，使用联合体作为 `YYSTYPE` 的机制是一种常见的做法，`PCYacc` 通常有一个子句允许在一步内完成定义 `YYSTYPE` 并声明联合体。该子句的形式为：\n\
  ```c\n%union { /* C 语言联合体的体 */ }\n```\n记住 C 语言中的联合体允许你定义带有变体部分的记录。此外，在联合体中，所有内容都是变体，也就是说，在联合体体声明的所有字段共享相同的内存空间，因此联合体的大小是其包含的最大字段的大小。继续我们的例子，联合体的形式如下：\n\
  ```c\n%union {\n    int number;\n    node * ptrNode;\n}\n```\n借此，`YYSTYPE` 已经变成了一个联合体（不再需要包含\
  \ `#define YYSTYPE`），因此任何符号都可以引用 `number` 字段或 `ptrNode` 字段，但不能两者都引用。按照规则，每个语法符号无论出现在哪条规则中，都始终使用\
  \ `% union` 的同一个字段；因此，`PCYacc` 提供了一种机制来指示每个符号应该使用哪一个字段。在此基础上，我们节省了对 `%union` 字段的连续引用。\n\
  \n该机制包括在定义的 `% token` 子句中使用角括号，为语法中的每个终结符指定要使用的字段；为了指示非终结符属性的类型，将使用 `% type` 子句，它与\
  \ `% token` 等，只是列出的是非终结符而不是终结符。按照这种表示法，我们的示例如下：\n```y\n%union {\n    int number;\n\
  \    node * ptrNode;\n}\n%token <number> NUM\n%token <ptrNode> ID\n%type <number>\
  \ etfm%%\n```\n\n| 规则 | 动作 |\n| :--- | :--- |\n| `Øe: e '+' t` | `{$$ = $1 + $3;}`\
  \ |\n| `Ù \\|; t;` | `{$$ = $1;}` |\n| `Út: t '*' f` | `{$$ = $1 * $3; }` |\n| `Û\
  \ \\|; F;` | `{$$ = $1; }` |\n| `Üf: m '(' e ')'` | `{$$ = $1 * $3; }` |\n| `Ý \\\
  |; m ID` | `{/* 从 (* $2) 提取一些信息 */ }` |\n| `Þ \\|; m NUM` | `{$$ = $1 * $2;}` |\n\
  \n\n\n\n/ * Epsilon * / {$$ = +1; } 到 | '-' {$$ = -1 }; 请注意，尽管 `YYSTYPE` 是 `union`\
  \ 类型，但 `$$` 和 `$ i` 并不是指向它们的字段，这归功于 `%` 标记和 `%` 类型声明为我们生成了这些引用。此外，如果我们在某个点使用了某个符号的属性，而我们又没有在\
  \ `%` 标记或 `%` 类型子句中指定其类型，`PCYacc` 将在元编译期间发出错误信息。这些转换是由 `PCYacc` 执行的，因此由 `PCLex`\
  \ 管理的词法动作在引用 `yylval` 时，必须显式地指定要操作的字段。一个实现我们语法的词法分析器的 `HeLex` 程序将是：\n\n```\n%%\n\
  \ /* Option 1 */\n[0 - 9] + {yylval.numero = atoi (yytext); return NUM; }\n[A- Z]\
  \ [A -Z0 -9] * {yylval.ptrNode = ...; return ID;}\n[b¯ / \\ t \\ n] {; }\n. {return\
  \ yytext [0]; }\n```\n\n我们将与用户标识符相关的属性管理留给专门用于符号表的章节（图 4.12：不涉及标识符的字符串识别的语法树。109![](img/image_rsrcDE8.jpg)\
  \ 122 属性文法）。现在，我们只关注数值常量。图? 显示了用于识别字符串 \"27 + 13 + 25\" 的生成的树；属性值以下标的形式出现。\n\n###\
  \ 4.3.2.1 中间动作\n\n也可以在规则的中间（即在后结的符号之间）放置动作。然而，之前提到过 `PCYacc` 构建的解析器每当在构建语法树时通过关联规则归约时，都会执行语义动作。那么，中间动作何时执行呢？在这些情况下，`PCYacc`\
  \ 执行文法转换，提供另一种等效形式，其中中间动作出现在形式为 `N ÷ g` 的新规则右侧，其中 `i` 是由 `iPCYacc` 生成的任意数字。例如：\n\
  \n```\nA: B {$$ = 1; } C {x = $ 2; y = $ 3; };\nNi: / * Epsilon * / {$$ = 1; };\n\
  A: B Ni C {x = $ 2; y = $ 3;};\n```\n\n语义动作的执行受点 4.1.2.4 所示机制的影响。\n\n### 4.3.3 歧义\n\
  \n`PCYacc` 不仅允许你轻松表达要识别的语法并生成解析器，还提供了辅助消除歧义的工具。 4.3.1 节中提出的语法是一种强制乘法和除法的优先级高于加法和减法的机制，且最小的一元运算符是优先级最高的。然而，从纯语法的角度来看，该语法生成的语言使用语法和\
  \ : 表达要简单得多：\n\n```\ne '+' e | e '-' e | e '*' e | e '/' e | '-' e | '(' e ')' |\
  \ ID | NUM;\n```\n\n这显而易见是存在歧义的。例如，在处理 \"27 * 13 + 25\" 之前，可能会得到图 4.13 中的语法树；在情况\
  \ a) 中，先乘后加；而在情况 b) 中，先加后乘。由于乘法的优先级高于加法，从语义角度来看，只有情况 a) 是有效的，否则将得到结果 110123![](img/image_rsrcDE9.jpg)图\
  \ 4.13：根据歧义语法识别有效句的语法树。请注意语义结果如何根据评估顺序的不同产生差异。正确选项是 a)，因为乘法的优先级高于加法。\n\n这种情况发生是因为当解析器拥有\
  \ `expr. 27'*' expr.` 并遇到 `'+'` 时，会发生移/归约（shift/reduce）冲突：如果移进，你得到树 b)；如果归约，你得到树\
  \ a)。如果你有两个加法而不是一个乘法和一个加法，也会发生相同的问题；类似地，像 a) 这样的树将是正确的，因为加法是左结合的。通常，如果一个规则是左递归的，意味着包含它的运算符是左结合的；右递归亦如此。这就是为什么所提语法是有歧义的，因为每个规则同时向右和向左递归，这意味着运算符同时是左结合和右结合的，这没有意义。尽管大多数运算符是左结合的，但也有右结合的情况，例如幂运算符。此外，某些运算符甚至不是结合的，例如除法的取模运算符（余数）。\n\
  \n尽管我们已经看到更改语法可以解决这个问题，但 `PCYacc` 提供了一种机制来解决由移/归约冲突引起的歧义，而无需引入所提语法。除非另有说明，`PCYacc`\
  \ 将根据以下两个前提解析解析器动作表中的所有冲突：\n\n1. 归约/归约（reduce/reduce）冲突通过选择 Yacc 程序中先写的冲突规则来解决。\n\
  2. 移/归约（shift/reduce）冲突倾向于移进。\n\n这些这些之外，`PCYacc` 为开发者提供了自行解决语法冲突的可能性。解决方案来自于优先级和结合性子句：`%\
  \ left`、`% right`、`% nonassoc` 和 `% prec`。11124 属性文法 `% left`、`% right` 和 `% nonassoc`\
  \ 允许指示运算符的结合性（左左：压缩，右右：移动，非结合-不结合：错误）；此外，子句指定的顺序允许 `PCYacc` 知道哪些运算符的优先级更高。这些子句放置在定义区域，通常在终符列表之后。例如，`%\
  \ left '-'`![](img/image_rsrcDEA.jpg) 使规则 `e: e '-' e` 是无歧义的。注意对于 `PCYacc`，没有运算符的概念（无论是算术的），但在这些子句中，任何发生移/归约冲突的符号（无论是终符）。如果多个符号被写在相同的\
  \ `% left`、`% right` 或 `% nonassoc`，将指示它们具有相同的优先级。格式如下：\n\n```\n% left '-' '+'\n\
  % left '*' '/'\n```\n\n表示 `+` 和 `-` 具有相同优先级且为左结合，`*` 和 `/` 也是。由于 `*` 和 `/` 排在 `-`\
  \ 和 `+` 之后，这通知 `PCYacc` `*` 和 `/` 的优先级高于 `+` 和 `-`。存在同一终符可以代表多个符号的情况，`% left`、`%\
  \ right` 或 `% nonassoc` 将指示它们具有相同的优先级。（注：输入文本高度重复性；我将提供清理后的文本流）。\n\n\n\n\n\n| prog\
  \ | : | / * Epsilon * / | | |\n| :--- | :--- | :--- | :--- |\n| | `\\|` | prog sent\
  \ ';' | |\n| | `\\|;` | prog error ';' | `{yyerrok;}` |\n| sent | : | ID '=' NUM\
  \ | |\n\n运行此此宏会通知解析器恢复成功。如果没有调用，由 `PCYacc` 生成的解析器将进入一个名为“安全条件”的状态，并保持在该状态直到位移了三个标记。安全条件防止解析器发出更多的错误信息（在出现新的语法错误之前），其目的是避免由于错误恢复不当导致级联错误。调用\
  \ `yyerrok` 会让解析器退出安全条件，这样它就会通知我们所有的、绝对语法错误，即使是由于错误的错误恢复导致的错误。\n\n尽管能够恢复语法错误，但 `PCYacc`\
  \ 并没有生成正确报告错误的分析器，而仅限于报告这些错误的存在，而不指定它们的性质。这种缺陷可以通过以下步骤来纠正：\n\n1.  在 Yacc 函数区域，放置指令：`#include\
  \ \"errorlib.c\"`，并且不要包含 `yyerror(char * s)` 函数，该函数已经硬编码在 `errorlib.c` 文件内部。\n2.\
  \  编译 YACC 程序为：`pcyacc -d -pyaccpar.c file.yac`。\n    - `-d` 创建文件 `yytab.h`，该文件包含了解析器栈的描述以及与每个标记相关的代码。\n\
  \    - `-pyaccpar.c` 导致一个包含实现 `PCYacc` 的有限栈自动机的骨架。它没有使用默认骨架，而是使用了 `yaccpar.c`，其中包含了\
  \ 115128 个属性文法的新的错误处理函数。`yaccpar.c` 使用了来自 `errorlib.h` 的文件。\n3.  运行程序 `tokens.com`。该程序读取\
  \ `yytab.h` 文件并生成 `yytok.h` 文件，该文件只是带引号并用逗号分隔的标记名称序列。该文件被 `errorlib.c` 用于指示期望的标记。\n\
  4.  编译 `file.c`（例如使用 Turbo C）：`tc file.c`。\n\n通过这种方式，当 `file.exe` 执行并发生语法错误时，你将获得一个清晰的错误信息：`\"\
  Error in line ...: found the token ... and expected one of the tokens ...\"`，其中省略号由语法分析器自动填充，分别是错误所在的行、导致该错误的错误标记以及有效的标记列表。\n\
  \n### 4.3.5 最终示例\n\n最后，将我们在前面的章节中看到的所有 Yacc 代码块合并，计算器的示例如下：\n\n| % {#define YYSTYPE\
  \ int%}% token NUMBER% left '+' '-'% left '*' '/'% right LESS_UNARY%%prog​ :​ /\
  \ * Epsilon * / | | |\n| :--- | :--- | :--- | :--- |\n| | `\\|` | prog expr ';'\
  \ | `{printf (\"=% d \\n\", $ 2);}` |\n| | `\\|` | prog error ';'; | `{yyerrok;}`\
  \ |\n| expr | : | expr '+' expr | `{$$ = $ 1 + $3;}` |\n| | `\\|` | expr '-' expr\
  \ | `{$$ = $ 1 - $3;}` |\n| | `\\|` | expr '*' expr | `{$$ = $ 1 * $3;}` |\n| |\
  \ `\\|` | expr '/' expr | `{$$ = $ 1 / $3;}` |\n| | | '-' expr% prec LESS_UNARY\
  \ `{$$ = - $ 2;}` |\n| | `\\|` | '(' expr ')' | `{$$ = $ 2;}` |\n| | `\\|;` | NUMBER\
  \ | `{$$ = $ 1;}` |\n\n```\n%%\n#include \"lexico.c\"\nvoid main () {\n    yyparse\
  \ ();\n}\nvoid yyerror (char * s) {\n    printf (\"% s \\n\", s);\n}\n```\n\n###\
  \ 4.4 Cup 解析器生成器\n\n`Cup` 是在佐治亚理工学院（美国）开发的 LALR 解析器，它生成 Java 代码并允许你输入用该语言编写的语义动作。它使用与\
  \ `PCYacc` 非常类似的符号，并且基于产生规则。\n\n#### 4.4.1 主要区别\n\n作为介绍，它与 `PCYacc` 的主要区别在于：\n\n\
  - 规则的前驱和后继部分通过 `::=` 分隔，而不是 `:`。\n- 不可以在产生规则中使用简单字符（`+`, `-`, `*`, `/` 等）作为终端，因此所有终端都必须显式声明：`PLUS`、`MINUS`、`COMMA`\
  \ 等。\n- 使用 `terminal` 代替 `% token`。\n- 使用 `non terminal` 代替 `% type`。\n- 终端列表必须用逗号分隔并以分号结束，类似于非终端列表。在两个列表中，所有的终端和非终端无论其是否具有属性都必须包含。\n\
  - 如果终端或非终端关联了属性，它不能是基本类型，而必须是一个对象（`Object`）。因此，你不应该使用 `int` 而应该使用 `Integer`，不使用\
  \ `char` 而应该使用 `Character` 等。\n- 没有 `% union`，但每个终端和非终端的类型直接通过对应类的名称来标明：`Integer`、`Character`、`MyRecord`\
  \ 等。也不需要使用角括号来指示这种类型。\n- 在中间语义动作中，动作之前的后继部分的属性可以用只读模式使用（就像它们来自最终 Java 类型一样）。\n-\
  \ 分别使用 `precedence left`、`precedence right` 和 `precedence nonassoc` 代替 `% left`、`%\
  \ right` 和 `% nonassoc`。然而，`% prec` 子句的用法与 `PCYacc`相同。\n- 使用 `start` 代替 `% start`。\n\
  - 没有用 `%%` 符号分隔的区域。\n- 在开始执行生成的分析器之前，使用子句 `init` 配合 `{Java_block;}` 的 Java 代码块。\n\
  - 要将生成的分析器与词法分析器连接，使用子句 `scan` 配合 `{return scanner.next_token();}`。\n\n\n\n\nCup\
  \ 本身是用 Java 编写的，因此执行它时需要安装某些 JRE（Java 运行时环境）。主程序由 `java_cup.Main` 类表示，如果计算器示例存储在名为\
  \ `calculator.cup` 的文件中，则可以通过以下形式进行编译：\n\n```\njava java_cup.Main calculator.cup\n\
  ```\n\n这会生成 `sym.java` 和 `parser.java` 文件。可见，Cup 遵循了（广泛接受的）类名大写约定。`sym.java` 类包含了必要的常量，以便引用终结符：`sym.MAS`、`sym.POR`\
  \ 等，这使得词法分析器在词法上工作起来更容易，它必须通过如下形式的语句返回这些终结符：例如 `return new Symbol (sym.MAS);`\n\n\
  继续我们的计算器示例，你需要包含动作语义（actions semantics），并能够引用后续（consequent）符号和前件（antecedent）非终结符的属性。与\
  \ Yacc 类似，语义动作被封装在 `{:` 和 `:}` 字符之间。然而，引用属性的方法与 Yacc 使用的方法有显著不同。\n\n首先，前件属性不称为 `$$`，而是\
  \ `RESULT`；同样地，后续的属性不是编号的而是命名的，这意味着开发者自己必须决定给后续每个符号的属性起什么名称。该名称通过在产生规则中放在终结符/非终结符之后，并用冒号隔开来指示\
  \ Cup。这样，对于类似规则：\n`expr ::= expr PLUS expr;`\n将赋予它如下形式的语义意义：\n`expr ::= expr: eIzq\
  \ PLUS expr: eRch{: RESULT = new Integer (eIzq.intValue () +eDch.intValue()); :};`\n\
  \n遵循这一机制，将其余语义动作添加到我们的计算器示例中：\n\n```java\nimport java_cup.runtime.*;\n/* 初始化词法分析器（如有）\
  \ */\ninit with {: scanner.init (); :};\n/* 终结符向词法分析器的请求 */\nscan with {: return\
  \ scanner.next_token (); :};\n\n/* 不带属性的终结符 */\nterminal PUNTOYCOMA, PLUS, MINUS,\
  \ POR, BETWEEN, MODULE;\nterminal UMENOS, LPAREN, RPAREN;\n\n/* 关联属性的终结符 */\nterminal\
  \ Integer NUMBER;\n\n/* 不带属性的非终结符 */\nnon terminal expr_list;\n/* 关联属性的非终结符 */\n\
  non terminal Integer expr;\n\n/* 优先级 */\nprecedence left MORE, LESS;\nprecedence\
  \ left BY, BETWEEN, MODULE;\nprecedence left UMENOS;\n\n/* 语法法 */\nexpr_list ::=\
  \ expr_list expr: e POINT AND COMMA {: System.out.println (\"=\" + e); :}\n| EXPR_LIST\
  \ POINT AND COME error\n| /;\n\n/* Epsilon */\n|;\nexpr ::= expr: e1 PLUS expr:\
  \ e2{: RESULT = new Integer (e1.intValue () + e2.intValue()); :}\n| expr: e1 MINUS\
  \ expr: e2{: RESULT = new Integer (e1.intValue () - e2.intValue()); :}\n| expr:\
  \ e1 BY expr: e2{: RESULT = new Integer (e1.intValue () * e2.intValue()); :}\n|\
  \ expr: e1 BETWEEN expr: e2{: RESULT = new Integer (e1.intValue () / e2.intValue());\
  \ :}\n| expr: e1 MODULE expr: e2{: RESULT = new Integer (e1.intValue ()% e2.intValue());\
  \ :}}\n| NUMBER: n{: RESULT = n; :}\n| LESS expr: e% prec UMENOS{: RESULT = new\
  \ Integer (0 - e.intValue ()); :}}\n| LPAREN expr: e RPAREN{: RESULT = e; :};\n\
  ```\n\n如之前暗示的，为了让这一切运行，有必要将其与词法分析器连接，该分析器在返回每个终结符之前返回一个 `java_cup.runtime.Symbol`\
  \ 类型的对象。该类的对象具有类型为 `Object` 的 `value` 字段，代表它们的属性，词法分析器必须分配一个与 Cup 中终结符声明中指定的类一致的对象。\n\
  \n## 4.4.2 完整语法\n\nCup 文件由五个主要块组成，我们将在后文中看到。\n\n### 4.4.2.1 包规范和导入\n\n在第一个块下，可以选择性指定需要导入的类。你也可以指定生成的类所属的包。\n\
  \n### 4.4.2.2 用户代码\n\nCup 包含一个独立的非公共类（包含在 `parser.java` 文件中），用于所有用户指定的语义动作。如果开发者可能使用以下语句在此类内部包含一个\
  \ Java 块：\n`action code {: java_block:}`\n变量、函数等可以在此块中声明，且全部为 `static`，因为没有可访问的对象来引用非静态组件。在这里声明的所有内容都将可语义动作访问。\n\
  \n也可以在 `parser` 类本身中进行 Java 声明，通过声明：\n`parser code {: java_block:}`\n这对于包含启动应用程序的\
  \ `main()` 方法非常有用。\n\n以下两个语句用于与词法分析器通信。第一条是：`init with {: java_block:}`，它在请求第一个\
  \ token 之前执行指定的代码；目标可能是打开文件、初始化存储结构等。最后，Cup 可以与任何词法分析器通信，因为声明：`scan with {: java_block:}`\
  \ 允许你指定在处理输入时返回下一个 token 的代码块。\n\n### 4.4.2.3 符号列表\n\n此节列出了语法中所有的终结符和非终结符。你可以有多个终结符和非终结符列表，只要它们不重复即可。每个终结符列表以单词\
  \ `terminal` 开头，每个非终结符列表以 `non terminal` 开头。两个列表必须用逗号隔开，并以分号结束。通过这些列表还可以指定每个符号（无论是否为终结符）的属性，这些属性必须继承自\
  \ `Object`。要做到这一点，可以将属性类型匹配的符号分组同一个列表中，该类型将关联在单词 `terminal` 之后，形式如下：`terminal ClassName\
  \ terminal1, terminal2;` `non terminal ClassName noTerminal1, noTerminal2;`。\n\n\
  ### 4.4.2.4 结合性和优先级\n\n此节的语义与其 Yacc 中的对应部分相同，即允许在某些终结符之前解决移动/归约 (move / reduce)\
  \ 冲突。这样，当遇到下一个 token 为 `terminal1` 或 `terminal2` 的冲突时，选择归约而不是移位。相反，在相同情况下它选择移位。最后，`nonassoc\
  \ terminal1, terminal2;` 在分析时遇到移位/归约冲突时将抛出语法错误。可以根据需要指示任意数量的此类子句，知道它们出现的顺序会导致在找到最后列表中的终结符时优先进行归约，也就是说，找到的子句越靠后，你进行归约时的优先级就越高。\n\
  \n\n\n\n;未出现在上述任何列表中的符号被认为具有最低优先级。\n\n### 4.4.2.5 语法\n\nCup 程序的最后一部分是需要识别的语法，它通过产生规则表示，这些规则必须以分号结尾，并且符号\
  \ `::=` 用作箭头。\n\n语法可以从一个语句开始，说明初始公元（axiom）是什么。如果省略了此子句，则假设初始公元是第一个规则的前件。该声明的格式如下：\n\
  `start with noTerminal;`\n\n与 Yacc 类似，可以更改产生移动/归约（move / reduce）冲突规则的优先级和优先顺序，方法在其旁边添加子句：`%\
  \ prec terminal`。产生规则允许在其内部包含语义动作，这些动作由符号 `{:` 和 `:}` 隔开。在这些动作中，你可以放置任何 Java 代码块，其中对规则符号属性的访问尤为重要。前件的属性由\
  \ Java 变量 `RESULT` 提供，而后续符号的属性则可以通过用户为每个符号指定的名称来访问。该名称指示在符号的右侧，并用两个冒号与其隔开。在语义动作中的用法必须与在符号列表中指示符号时分配的类型一致。使用中间语义动作时要小心，因为在这种情况下，后续可访问符号的属性只能读取，这通常强制要求从\
  \ Jflex 给它们一个初始值。这种情况的示例可以在 8.4.6 节中学习。\n\n另一方面，与 PCYacc 一样，特殊符号 `error` 允许使用恐慌模式（panic\
  \ mode）进行错误恢复。在第 7.4.4 节中更详细介绍了 Cup 中正确的错误处理。\n\n### 4.4.3 Cup 的执行\n\nCup 元编译器本身用\
  \ Java 编写，因此它的执行遵循任何 Java 程序的模型。主类是 `java_cup.Main`，它从标准输入获取输入：\n`java java_cup.Main\
  \ <inputFile`\n\n也可以按照格式为元编译器指定一些选项：\n`java java_cup.Main options <inputFile`\n\n\
  其中最有趣的选项有：\n- `-package packagename`: 解析器和符号类将位于指定的包中。\n- `-parser parsername`:\
  \ 解析器将被命名为 `parsername` 而不是 `parser`。\n- `-symbols symbolName`:分组语法符号的类将被命名为 `symbolName`\
  \ 而不是 `sym`。\n- `-expect number`: 默认情况下，Cup 在遇到归约/归约冲突时中止元编译。如果你希望行为与 PCYacc 相同，即发生此类冲突时按出现顺序选择第一个规则，则需要告诉\
  \ Cup 预期的归约/归约冲突数量。使用此选项指定。\n- `-progress`: 让 Cup 在处理输入语法时提供信息。\n- `-dump`: 生成语法的可读转储、Cup\
  \ 生成的自动机状态以及分析表的转储。如果你只想获取分析表（用于解决冲突），可以使用更简洁的选项 `-dump_states`，它会跳过语法和表分析。\n\n\
  属性语法\n\n另一方面，为了让 Cup 方便地与词法分析器通信，它必须实现 `java_cup.runtime.Scanner` 接口，定义如下：\n```java\n\
  public interface Scanner {\n    public Symbol next_token () throws java.lang.Exception;\n\
  }\n```\n\n最后，为了让应用程序运行，必须包含一个 Java `main()` 函数，该函数构造 `parser` 类型的对象，关联一个 `Scanner`\
  \ 类型的对象（它将执行词法分析），并在 `try-catch` 语句中通过调用 `parse()` 函数启动过程。可以按照以下格式完成：\n```java\n\
  parser code {:\npublic static void main (String [] arg) {\n    /* 创建一个解析器对象 */\n\
  \    parser parserObj = new parser (); \n    /* 分配 Scanner */\n    Scanner myAnalyzerLexico\
  \ = new Yylex (new InputStreamReader (System.in));\n    parserObj.setScanner (myLexicScanner);\n\
  \    try {\n        parserObj.parse ();\n    } catch (Exception x) {\n        System.out.println\
  \ (\"Fatal error.\");\n    }\n}};};\n```\n假设 `Yylex` 是实现词法分析器的类。\n\n### 4.4.4 与\
  \ JFlex 的通信\n\nJFlex 包含了 `% cup` 选项，它等同于以下子句：\n```java\n% cup implements java_cup.runtime.scanner\n\
  % function next_token\n% type java_cup.runtime.Symbol\n% eofval { return new java_cup.runtime.Symbol\
  \ (sym.EOF); }\n% eofclose\n```\n如果用户更改了分组符号的类名（默认为 `sym`），你必须在 JFlex 中也使用指令：\n\
  `% cup symbolName` 以便 `% cup` 正确生成代码。\n\n从前面的子句可以看出，词法分析器必须以 `Symbol` 类对象的形式向语法分析器返回令牌，该类位于\
  \ `java_cup.runtime` 包中，因此必须由词法分析器导入。它有两个构造函数：\n- `Symbol (int n)`：利用 `sym` 类中定义的整数常量，此构造函数允许你创建不关联属性的对象。\n\
  - `Symbol (int n, Object o)`：与上一个类似，但多了一个参数，该参数构成了返回令牌的关联属性的值。\n\n这样，识别实现我们计算器的\
  \ Cup 语法所需的词法分析器将由以下 JFlex 程序提供：\n```java\nimport java_cup.runtime.*;\n%%\n%unicode\n\
  % cup\n% line\n%column\n\n\"+\" | {return new Symbol (sym.MAS); } |\n| \"-\" | {return\
  \ new Symbol (sym.MENOS); } |\n| \"*\" | {return new Symbol (sym.POR); } |\n| \"\
  /\" | {return new Symbol (sym.ENTRE); } |\n| \"%\" | {return new Symbol (sym.MODULE);\
  \ } |\n| \";\" | {return new Symbol (sym.POINTYCOMA); } |\n| \"(\" | {return new\
  \ Symbol (sym.LPAREN); } |\n| \")\" | {return new Symbol (sym.RPAREN); } |\n| [:\
  \ digit:] +[\\ t \\ r \\ n] + {;} | {return new Symbol (sym.NUMBER, new Integer\
  \ (yytext ())); } |\n| . | {System.out.println (\"Lexical error.\" + Yytext () +\
  \ \"-\"); } |\n```\n\n\n\n\n\n# 第 5 章 JavaCC\n\n## 5.1 简介\nJavaCC（Java Compiler\
  \ Compiler - Java 编写的元编译器）是 JavaCC 中的核心元编译器，无论从其功能还是其传播范围来说都是。它是一种通过递归函数方法辅助构建词法分析和语法分析器的工具，尽管它允许使用非常接近\
  \ BNF（巴科斯范式）的松散表示法。通过这种方式，生成的解析器在获取语法树时使用自顶向下技术。\n\n### 5.1.1 通用特性\nJavaCC 集成了词法分析器和语法[分析器]，且它生成的代码不依赖于任何外部库，这赋予了它有趣的环境独立性特性。广义来说，其主要特性如下：\n\
  \n- 生成自顶向下的解析器，允许使用通用语言的语法，并在构建语法树过程中使用合成属性（synthesized）和继承属性（inherited）。\n- 词法和语法规范位于单个文件中。通过这种方式，可以更轻松地读取和维护语法。然而，在引入语义动作时，我们建议使用某些注释来提高可读性。\n\
  - 支持使用词法状态，以及在标记标识符后添加包含 Java 代码块的词法动作。\n- 它包含了不同类型的标记：普通的（`TOKEN`）、特殊的（`SPECIAL_TOKEN`）、跳过的（`SKIP`）和延续的（`MORE`）。它允许你使用更清晰的规范，同时允许\
  \ JavaCC 在元编译期间更好地处理错误和警告信息。\n- 特殊标记会被生成的扫描器忽略，但可以供开发者处理。\n- 词法规范可以定义标记，使其在全局或特定模式中均不区分大写和小写字母。\n\
  - 它通过使用自己的正则表达式符号（如 `(A)*`、`(A)+`）采用了了自己的 BNF 表示法。\n- 默认生成 `LL (1)` 解析器。然而，语法中可能存在\
  \ `LL (1)` 以外的部分，JavaCC 通过在冲突点本地解析位移歧义的能力来解决这个问题。换句话说，仅在这些点允许 `a.si. I` 转换为 `LL\
  \ (k)`，而在其他规则处保留 `LL (1)` 以提高效率。\n- 在自顶向下的解析器生成器中，JavaCC 是错误处理最好的工具之一。JavaCC 生成的分析器能够准确确定错误位置，提供全面的诊断信息。\n\
  - 允许 Unicode 编码的输入，因此词法可以包含任何非 ASCII 字符。这有助于对语言元素的描述。\n- 允许对生成的解析器和词法进行调试，使用 `DEBUG_PARSER`、`DEBUG_LOOKHEAD`\
  \ 和 `DEBUG_TOKEN_MANAGER`。\n- JavaCC 提供了许多不同选项来定制你的生成解析器的行为。\n- 包含了 `JJTree` 工具，这是一个用于具有强大树功能开发的预处理器。\n\
  - 包含了 `JJDoc` 工具，将语法文件转换为文档文件。\n- 它非常高效，适用于专业环境，并已成为最流行的元编译器之一（可能是 `JFlex / Cup`\
  \ 以上）。\n- JavaCC 目前由 `java.net` 维护，官方文档可以在 `https://javcc.dev.java.net` 找到。遗憾的是，此类文档过于正式，没有包含任何教程，这正是本节的目标。\n\
  \n### 5.1.2 初步示例\n配合 `Cup`，我们将从关于 JavaCC 输入结构的初步示例开始我们的之旅，用于此的表示法 \"JavaCC\" 将用于引用\
  \ JavaCC 工具以及它支持的语法。\n\n我们用 JavaCC 编写的示例如下：\n\n```java\noptions {\n    LOOKAHEAD\
  \ = 1; \n}\n\nPARSER_BEGIN (Example) \npublic class Example { \n    public static\
  \ void main (String args []) throws ParseException { \n        Example myParser\
  \ = new Example (System.in); \n        myParser.exprlist ();\n    }\n}\nPARSER_END\
  \ (Example)\n\nSKIP: {\" \" | \"\\t\" | \"\\n\" | \"\\r\"}\n\nTOKEN [IGNORE_CASE]:\
  \ {\"a-z\" | \"0-9\"}\n\nvoid listExpr (): {} { (LOOKAHEAD(2) expr () )*}\n\nvoid\
  \ expr (): {} {\"@SOMETHING\"}\n```\n\nJavaCC 程序通常存储在 `.jj` 扩展文件中。因此，之前的示例存储在 `Example.jj`\
  \ 中，通过调用批处理文件 `javacc` 完成元编译如下：\n\n```bash\njavacc Example.jj\n```\n\n这将产生以下输出文件：\n\
  - `Example.java`：解析器。\n- `TokenManager.java`：词法分析器。\n- `ExampleConstants.java`：与每个标记关联的接口。\n\
  \n同样，它存储了开发者提供的每个标记，以便解析器可以发布清晰的错误信息。此外还有必要的类：\n- `ParseException.java`：实现语法错误。当解析器遇到这些错误之一时，会抛出一个异常，该异常可以在语法树的任何节点处捕获。\n\
  - `SimpleCharStream.java`：实现词法分析器可以读取的输入通道。传统的类型是 `InputStream` 和 `Reader`。\n- `Token.java`：词法和语法分析器通信的对象。\n\
  - `TokenMgrError.java`：实现词法错误。无法被捕获，因此开发者必须在元编译目录中收集所有可能的词法。过程见图 5.1。编译 JavaCC 产生的所有文件（根据图中的\
  \ `Example.java`）的编译链。\n\n图 5.1 使用 JavaCC 的元编译过程。从单个文件（`Example.jj`）开始，JavaCC 生成了\
  \ 3 个依赖文件和其他 4 个相同的文件。\n\n## 5.2 JavaCC 程序结构\n如示例所示，JavaCC 程序的的基本结构是：\n\n```java\n\
  options {Options area}\nPARSER_BEGIN (ClassName)\nJava compilation unit with class\
  \ name Classname\nPARSER_END (ClassName)\nArea tokens\nBNF function area\n```\n\n\
  `options area` 允许你指定某些指南，帮助 JavaCC 生成更高效、适应开发者特定需求的词法解析器。在示例中，我们指示默认语法是 `LL (1)`\
  \ 类型，除非在某点另有指示。\n\n`PARSER_BEGIN` 和 `PARSER_END` 子句用于告诉 JavaCC 我们主类的名称，并包含该类以及任何想要包含支持的其他类，例如符号表管理器。在示例中可以看到主类构成了解析器本身，`main()`\
  \ 函数创建一个 `Example` 类型的对象，同时向构造函数传递要输入的源：键盘 (`System.in`)。\n\nJavaCC 创建的类将为规则区域的每个非终端包含一个函数。每个函数将负责消耗其在识别树中对应的输入部分。因此，假设初始公式是\
  \ `listExpr`，调用 `myParser.exprlist()` 将消耗所有输入（如果这是可以接受的）。\n\n以下两个区域可以混合，尽管通常是先指示标记，最后是\
  \ BNF 中的规则，特别是为了代码清晰的原因。在示例中，指示了两种类型的标记。在 `SKIP` 子句下的标记是那些将被消耗但不传递解析器的标记；在我们的情况下，它们是空格、制表符、回车\
  \ (CR) 和换行符 (LF)。\n\n### 5.2.1 选项\n该部分以 `options` 关键字开头，后面跟着括号中的一个或多个选项列表。整个部分可以省略，因为不是强制性的。选项名称大写，以\
  \ `;` 结尾，并通过 `=` 与其关联的值分离。下面是最重要的选项及其执行的功能详情：\n\n- `LOOKAHEAD`：指示解析器在做出决定之前考虑的标记数量。默认值为\
  \ 1，将执行 `LL (1)` 分析。搜索的标记数越少，分析执行越快。此值可以在某些规则中修改。\n- `AMBIGITY_CHECK`：如果 `LOOKAHEAD`\
  \ 大于 1，JavaCC 会在元编译之前收集所有可能的词法并生成自己的错误。这种类型的错误无法被捕获，因此通过该选项，JavaCC 可以提供更准确的错误信息。\n\
  - `FORCE_LA_CHECK`：当该选项为 true 时，JavaCC 会在语法树的任何节点处捕获这些错误。\n- `STATIC`：如果该值为 true，JavaCC\
  \ 将以静态方式处理词法，即使它们不存在于目录中。\n- `BUILD_PARSER`：当该选项为 true 时，JavaCC 会生成解析器。\n- `COMMON_ACTION`：如果该选项为\
  \ true，JavaCC 会在元编译时执行该动作。\n- `TOKEN_MGR_DECLS`：通过这种方式，JavaCC 能够跟踪每个标记。\n- `DEBUG_TOKEN`：如果该选项为\
  \ true，JavaCC 会跟踪。\n- `COMMON_ACTION`：其默认值是 1。\n- `IGNORE_CASE`：如果指示为 true，词法不区分大写和小写。\n\
  - `UNICODE_INPUT`：如果设为 true，词法分析器可以处理 Unicode 字符。\n- `OUTPUT_DIRECTORY`：其默认值为当前。控制输出文件的生成位置。\n\
  \n### 5.2.2 标记区域\n根据开发者的需求，该区域允许构建语法分析器。在 JavaCC 的术语中，词法分析器被称为标记管理器。\n\n- `SKIP`：忽略词法。\n\
  - `MORE`：搜索下一个标记但将其连接到已恢复的标记上。\n- `TOKEN`：获取词法并创建一个 `Token` 类型的对象，返回给解析器（或任何调用者）。这种返回自动发生，开发者无需指定任何返回语句。\n\
  - `SPECIAL_TOKEN`：与 `SKIP` 相同，但以可以恢复的方式存储词法。这在构造源源代码翻译器时非常有用，尽管它们不影响翻译过程。\n\n\n\n\
  \n\n```markdown\n| \"to\" {}<S1> MORE: { | Ø;}: S1 |\n| \"b\" {}: S2}<S2> TOKEN:\
  \ { | ORint long = image.length () - 1; image.setCharAt (long, image.charAt (long)\
  \ .toUpperCase ());OR |\n| \"cd\" {} | OR ; }: DEFAULT |\n\n```\n\n在输入 \"abcd\"\
  \ 之前，变量 `image` 在代码的 `Ø`、`Ù`、`Ú` 和 `Û` 处分别具有值 \"a\"、ab\"、aB\" 和 \"aBcd\"。\n\n`lenghtOfMatch`：整数类型变量，表示最后一个恢复的词法（lexeme）的长度。参考上一个例子，该变量在代码的\
  \ `Ø`、`Ù`、`Ú` 和 `Û` 处分别取值为 1、1、1 和 2。完整图像的长度可以通过 `StringBuffer` 类的 `length()` 方法进行计算。\n\
  \n`curLexState`：整数类型变量，表示当前的词法状态。可以通过开发者赋予的名称直接操作词法状态，因为 JavaCC 会在其生成的一个文件中（根据 5.1.2\
  \ 节的示例为 `ExampleConstants.java`）初始化对应的 Java 常量。\n\n`matchedToken`：Token 类型变量，存储当前标记。参考上一个例子，`matchedToken.token`\
  \ 在代码的 `Ø`、`Ù`、`Ú` 和 `Û` 处分别取值为 \"a\"、ab\"、ab\" 和 \"abcd\"。\n\n`switchTo(int estadoLéxico)`：允许程序切换到新词法状态的函数。如果从词法动作调用此函数，它必须是执行的最后一个操作。显然，为了使其生效，它不能在词法动作后使用\
  \ `: newLexicalState1` 子句。该函数在识别中非常有用，例如处理嵌套注释：\n\n```\nTOKEN_MGR_DECLS: { int numComments\
  \ = 0;}\nSKIP: {\"/ *\" {numComments = 1;}: InsideComment}<InComment> SKIP: {\"\
  / *\" {numComments ++;}| \"* /\" {numComments--; if (numComments == 0) switchTo\
  \ (DEFAULT); } | <(~ [\\ * \\\\ b¯ / \\ t \\ n \\ r]) +> | <[\\ * \\\\ b¯ / \\ t\
  \ \\ n \\ t]>}\n```\n\n词法动作还可以使用可选子句 `TOKEN_MGR_DECLS` 中声明的任何内容。以下示例显示了如何使用各种模式和公共变量\
  \ `longString` 计算字符串的长度（注意最后两个模式顺序的重要性，否则引号将永远无法识别闭合）：\n\n```markdown\nTOKEN_MGR_DECLS:\
  \ {int longString;}\nMORE: {![](img/image_rsrcDF5.jpg) \"\\\" \"{longString = 0;}:\
  \ InsideString}<IntroString> TOKEN: {<STRLIT: \"\\\" \"> {System.out.println (\"\
  \ Size = \"+ longString);}:DEFAULT}<IntroString> MORE: {<~ [\"\\ n\", \"\\ r\"]>\
  \ {longString ++;}}\n```\n\n如果 `COMMON_TOKEN_ACTION` 选项为 true，则必须指定。`TOKEN_MGR_DECLS`\
  \ 子句是强制性的，它至少必须包含 `CommonTokenAction()` 函数，其头文件为 `void CommonTokenAction (Token\
  \ t)`，并且每当恢复任何词（无论其类型如何）时都会被调用，如 5.2.1.1 节所示。5.2.2.3 Token 类和标记管理器\n\n如前所述，每当词法分析器找到与普通标记相对应的词时，都会返回一个\
  \ `Token` 类的对象。该类的变量和主函数如下：\n\n- `image`：String 类型变量，存储识别出的词。\n- `kind`：对于开发者为每个模式关联的名称，JavaCC\
  \ 在其生成的常量类中包含一个整数常量。`kind` 变量存储这些整数之一，具体来说是匹配该词的模式名称。\n- `beginLine`、`beginColumn`、`endLine`\
  \ 和 `endColumn`：整数类型变量，分别表示词开始和结束的行号和列号。\n- `specialToken`：Token 类型变量，当且仅当上一个标记为特殊类型时引用它；否则它将存储空值。\n\
  \n最后指出，JavaCC 在解析器类 `Lexical`（根据 5.1.2 节的示例为 `ExampleTokenManager`）中提供了两个可能感兴趣的方法，如果你只想构建该解析器的话：\n\
  \n- 一个接收 `CharStream` 类型对象的构造函数，该对象将包含要分析的输入。\n- `getNextToken()` 函数，返回在入口找到的后续\
  \ `Token` 类型对象。开发者必须控制标记类型 `<EOF>` 以防读取超出输入范围。\n\n以下示例说明了一个仅打算使用词法分析部分的 JavaCC 程序。尽管\
  \ `BUILD_PARSER` 选项为 false，但 JavaCC 强制指示 `PARSER_BEGIN` 和 `PARSER_END` 子句，以及内部的同名类，即使它是空的。\n\
  \n```markdown\noptions {/ * 不要生成类 Example * /BUILD_PARSER = false; }\nPARSER_BEGIN\
  \ (Example)![](img/image_rsrcDF6.jpg) public class Example {}\nPARSER_END (Example)\n\
  / * 在标记管理器中声明 main() 函数 * /TOKEN_MGR_DECLS: {public static void main (String args\
  \ []) throws ParseException {Example TokenManager myLexer = new ExampleTokenManager\
  \ (new SimpleCharStream (System.in));Token t; while ((t = myLexer.getNextToken ()).\
  \ kind! = ExampleTokenManager.EOF)\n```\n```System.out.println (\"You have written\"\
  \ + t.image); }}SKIP: {\"\"| \\ t\"| \\ n\"| \\ r\"}TOKEN [IGNORE_CASE]: {<ID: ([\"\
  a\" - \"z\"]) +}>```\n\n通过这种方式，`main()` 函数通过 `TOKEN_MGR_DECLS` 子句直接包含在标记管理器中，我们构建了词法分析器预期的输入通道类型，并传递给构建器。标记管理器可以读取的输入通道来自\
  \ `CharStream`；JavaCC 提供了继承自 `CharStream` 的 `SimpleCharStream` 类，以便创建可用于词法分析的有效通道。`SimpleCharStream`\
  \ 是 `InputStream` 和 `Reader` 类的封装或层，其构造函数接收这两种类型中的对象作为参数。一旦完成，逐个恢复标记并在屏幕上显示相应的消息。通过输入内容也可以相同的效果：\n\
  \n```markdown\noptions {BUILD_PARSER = false; }\nPARSER_BEGIN (Example) public class\
  \ Example {} PARSER_END (Example)\nTOKEN_MGR_DECLS: {public static void main (String\
  \ args []) throws ParseException { new ExampleTokenManager (new SimpleCharStream\
  \ (System.in)). getNextToken ();}}\n```\nSKIP: {\"\"| \\ t\"| \\ n\"| \\ r\"}SKIP\
  \ [IGNORE_CASE]: {<ID: ([\"a\" - \"z\"]) +> {System.out.println (\"You have written\"\
  \ + image); }} 紧凑得多，并且与之前的等效代码相比进行了修改。(image_rsrcDF7.jpg)\n\n### 5.2.3 BNF 函数区域\n\
  \n如前所述，JavaCC 基于递归函数实现的自下降解析器，因此我们语法法中的每个非终结符都将转换为不同的函数，该函数的实现由 JavaCC 生成。该区域具有以下结构：`typeReturn\
  \ functionJava (param):`\n\n| one​ {codigoJava}​ one​ {exprBNF}​ one | one | one\
  \ |\n| typeReturn functionJava (param):two​ {codigoJava}​ two​ {exprBNF}​ two...\
  \ | two | two |\n```\n\n\n\n\n\n由于每个非终符（non-terminal）都会被转换为 `Java` 中的一个函数，开发者不仅必须指定其名称，还要提供该函数的完整头定义（header）。这一事实具有根本性的意义，因为：\n\
  \n“JavaCC 允许通过传递参数和在使用非终符时（或等同于调用实现该非终符的函数）获取结果，在 BNF 规则之间交换属性，这分别相当于在语法树中向下传递属性和向上传递属性。”\n\
  \n另一方面，BNF 表达式 `exprBNF` 可以使用以下组件：\n- `noTerminal ()`：表示非终符 `noTerminal` 的使用。注意函数调用的括号。\n\
  - `<>`：允许你引用标记区域（token area）中声明的终端（terminal）。\n- `Ex.::<NUMBER>\"\":`：允许表示匿名标记，包含字面量字符串类型的字符。\n\
  - `*`：表示括号内内容重复 0 次或多次。\n- `+`：表示括号内内容重复 1 次或多次。\n- `?`：表示括号内的内容是可选的。\n- `[]`：与\
  \ `?` 含义相同，因此 `(pattern)?` 等同于 `[Pattern]`。\n- `|`：表示可选性。例如：`(\"text1\" | \"text2\"\
  )` 匹配 \"text1\" 和 \"text2\"。\n\n通过这种方式，可以通过语法规则提供一种识别表达式的方法：\n\n```java\nvoid expr\
  \ (): {} { term () ( ( “+” | ”-“ ) term () ) *}\nvoid term (): {} { fact () ( (\
  \ “*” | ”/“ ) fact () ) *}\nvoid fact (): {} {<NUMBER> | <ID>| \" ( \" Expr () \"\
  \ ) \" }\n```\n\nJava 代码段允许你定位 Java 语句以及非终符函数实现中的 Java 语句绑定。其中，这可以允许你获取解析器在识别句子时所采取操作的轨迹。例如，以下程序：\n\
  \n```java\nvoid expr (): {System.out.println (\"Recognizing an expression\"); }\
  \ { term () ( ( “+” | ”-“ ) term () ) *}\nvoid term (): {System.out.println (\"\
  Recognizing a term\"); } { fact () ( ( “*” | ”/“ ) fact () ) *}\nvoid fact (): {System.out.println\
  \ (\"Recognizing a factor\"); } {<NUMBER> | <ID>| \" ( \" Expr () \" ) \" }\n```\n\
  \n在输入 \"23 + 5 * (8-5)\" 之前产生输出：\nRecognizing an expression\nRecognizing a term\n\
  Recognizing a factor\nRecognizing a term\nRecognizing a factor\nRecognizing a factor\n\
  Recognizing an expression\nRecognizing a term\nRecognizing a factor\nRecognizing\
  \ a term\nRecognizing a factor\n\n图 5.2. 基于 BNF 规则识别表达式的语法树。为了清晰起见，没有画出 `NUMBER`\
  \ 标记，这些标记与识别该句子的语法树的前序遍历一致，如图 5.2 所示。\n\n注意，当使用 BNF 记法时，如果规则中使用了重复，规则下方的符号数量可能会变化。例如，继续上面的语法，`expr`\
  \ 规则可以在语法树中产生任意数量的子节点；作为演示，与 \"23 + 5 + 7 + 8 + 5\" 识别相关的树如图 5.3 所示，其验证结果由解析器输出给出：\n\
  Recognizing an expression\nRecognizing a term\nRecognizing a factor\nRecognizing\
  \ a term\nRecognizing a factor\nRecognizing a term\nRecognizing a factor\nRecognizing\
  \ a term\nRecognizing a factor\nRecognizing a term\nRecognizing a factor\n\n图 5.3.\
  \ 带有 `*` 或 `+` 类型展开的 BNF 表达式相关的语法树可能有不确定数量的子节点\n\n如前所述，JavaCC 默认生成 LL (1) 类型解析器，这意味着它们能够通过查询输入中的下一个标记（token）在不同的流选项之间进行选择。然而，我们已知并不是所有的语法都是\
  \ LL (1)，因此可能会出现需要查询入口处多个一个标记才能做出决策的情况。例如，以下语法：\n\n```java\nvoid expr (): {} {<ID>\
  \ | <ID> \".\" expr () | <ID> \"()\"}\n```\n\n它不是 LL (1)，因为在输入如 \"cont.aux ()\"\
  \ 之前，解析器看到的第一个标记是 `<ID>`，但由于 `expr ()` 的三个可能选项都以 `<ID>` 开头，没有足够的信息来选择哪一个。在这种情况下，预查两个标记将允许我们做出正确判断。\n\
  \n为了实现这一点，第 5.2.1 节看到的 `LOOKAHEAD` 选项允许你告诉 JavaCC 所提供的语法类型，即在做出决策之前你必须预查的标记数量。尽管如此，在大多数情况下，JavaCC\
  \ 编程语言的语法包含大部分 LL (1) 表达式，只有少数规则可能需要预查 2 个或最多 3 个。在这些情况下，如果你保持默认的预查（为 1），并告诉 JavaCC\
  \ 在哪些特定情况下应该使用高级的预查，你将获得更高效的解析器。这是通过预查或局部前瞻（local lookahead）实现的，其形式为：\n\n```\nLOOKAHEAD\
  \ ( n ) pattern\n```\n\n一个模式，且它本身也被视为一种模式。该语句的含义非常简单：它告诉解析器在进入 pattern 之前，通过获取 `n`\
  \ 个标记来确保这是正确的。通过这种方式，上面的语法可以保持为 LL (1)，并指示如下形式的局部前瞻：\n\n```java\nvoid expr (): {}\
  \ {LOOKAHEAD (2) <ID> | <ID> \".\" expr () | <ID> \"()\"}\n```\n\n此外，JavaCC 能够判断开发者指定的预查是否恰当，但允许在每次调用非终符时传递参数并返回值，如第\
  \ 5.2.3 点所示。通过这种方式，每当调用非终符时，我们可以将返回值赋值给该规则关联的全局变量；该值作为合成属性（synthesized attribute）。此外，当声明非终符时，它可以具有形式参数，以便使用实际参数调用，这些参数将作为继承属性（inherited\
  \ attributes）。\n\n遗憾的是，JavaCC 也不允许标记关联属性，因此应该是语义动作直接处理词法（lexemes）。虽然在大多数情况下这很麻烦，但它的优点是每个动作可以从词法中提取适合你的信息，而不是在出现相同终端的地方始终使用相同的属性。下一个示例说明了创建计算器的\
  \ BNF 规则和相关的语义动作：\n\n```java\nint expr (): { int accum1 = 0, accum2 = 0;} {\n  \
  \  accum1 = term () ( \n        \"+\" accum2 = term () {accum1 += accum2; } |\n\
  \        \"-\" accum2 = term () {accum1 -= accum2; } \n    );\n    return accum1;\n\
  }\n\nint term (): { int accum1 = 0, accum2 = 0;} {\n    accum1 = fact () ( \n  \
  \      \"*\" accum2 = fact () {accum1 *= accum2; } |\n        \"/\" accum2 = fact\
  \ () {accum1 /= accum2; } \n    );\n    return accum1;\n}\n\nint fact (): { int\
  \ accum = 0;} {\n    <NUMBER> {return Integer.parseInt (token.image); } |\n    \"\
  (\" accum = expr () \")\" {return accum; }\n}\n```\n\n\n\n\n\n![](img/image_rsrcDFB.jpg)\
  \ 对于某个值，在定义它的每个选项末尾必须包含一个语义动作，并带有一致的返回语句。此外，可以将语义动作放置在 BNF 子表达式中（如 `expr` 和 `term`，在点\
  \ `Ø`、`Ù`、`Ú` 和 `Û` 处）。每当识别流通过这些点时，语义动作就会执行一次。例如，在处理输入 `23 + 5 + 11` 之前，它会通过点 `Ø`\
  \ 达到次，因为需要通过两次子表达式 `(\"+\" Term())` 才能识别该输入。\n\n此外，请注意，放置在终结符之后的语义动作可以通过变量 `token`\
  \ 访问与之关联的标记对象。尽管提到了预搜索，但这样做仍然可行，因为是解析器在每个每个终结符后立即加载该变量，无论你之前为了决定选择哪个选项而预搜索了哪些标记。\n\
  \n当语义动作被包含在 BNF 表达式内部时，这种情况会变得极其罕见，因为在代码海洋中识别语法非常困难。为了避免这个问题，建议在定义该非终结符的纯 BNF 表达式前面放置注释。\n\
  \n另一方面，当一个终结符 `t` 在所有出现的后件中始终具有相同的属性时，通常通过创建一个规则 `T ::= t`，将从 `t` 计算出的属性与 `T` 关联，并在其他规则中使用\
  \ `T` 代替 `t`，这样会更具可读性。\n\n遵循上述两个建议，计算器的示例将：\n\n```c\n/*expr :: = term ((\"+\" |\
  \ \"-\") term) */\nint expr (): { int accum1 = 0, accum2 = 0; } {\n| accum1 = term\
  \ () ({return accum1; } |) * | Ø (\"+\" accum2 = term () {accum1 += accum2;})Ù (\"\
  -\" accum2 = term () {accum1 -= accum2;})145 |\n```\n\n\n\n\n\n```java\n/* 158JavaCC\
  \ */\n/* term :: = fact ((\"*\" | \"/\") fact) */\nint term (): { int accum1 = 0,\
  \ accum2 = 0;} { \n    accum1 = fact () ( (\"*\" accum2 = fact () {accum1 *= accum2;})\
  \ | (\"/\" accum2 = fact () {accum1 /= accum2;})) \n    * {return accum1; } \n}\
  \ \n```\n![](img/image_rsrcDFC.jpg)\n```java\n/* fact :: = NUMBER | \"(\" expr \"\
  )\" */\nint fact (): { int accum = 0;} { \n    accum = number () {return accum;\
  \ } | \"(\" accum = expr () \")\" {return accum; }} \n}\nint number (): {} {\n \
  \   <NUMBER> {return Integer.parseInt (token.image); }} \n}\n```\n\n### 5.4 错误管理\n\
  \n在 JavaCC 中，可以通过两种方式实现错误处理：\n1. 自定义错误消息。\n2. 从错误中恢复。\n\n#### 5.4.1 JavaCC 的旧版本\n\
  在 JavaCC `0.6` 版本之前，为了自定义错误消息，必须将 `ERROR_REPORTING` 选项设置为 `true`。开启后，JavaCC 将为解析器类提供以下变量：\n\
  - `error_line`, `error_column`: 类型为 `integer` 的变量，表示检测到错误的行号和列号。\n- `error_string`:\
  \ `String` 类型变量，存储发生错误的词法单元（lexeme）。如果预查（`lookahead`）被设置为大于 `1` 的值，`error_string`\
  \ 可能包含一组词法单元。\n- `expected_tokens`: `String []` 类型变量，包含可能有效的标记（tokens）。同样，如果预查被设置为大于\
  \ `1` 的值，`expected_tokens` 中的每个项目可以是一个标记序列 `146159`，而不仅仅一个孤立的标记。\n\n每当解析器遇到语法错误时，它都会调用\
  \ `token_error()` 函数，开发者需要重写该函数。这需要创建一个继承自解析器类的新类。\n\n类似地，词法分析器也可以利用以下元素：\n- `error_line`,\
  \ `error_column`: 词法错误的行号和列号。\n- `error_after`: 尝试识别的词法单元片段字符串。\n- `curChar`: 产生词法错误的字符。\n\
  - `LexicalError()`: 当管理器 token 发现词法错误时调用的函数。\n\n![](img/image_rsrcDFD.jpg)\n\n####\
  \ 5.4.2 JavaCC 的现代版本\n目前，JavaCC 通过启动 `TokenMgrError` 和 `ParseException` 异常来处理词法和语法错误，如果这些类在工作目录中不存在，JavaCC\
  \ 会自动生成它们。其哲学是：开发者应该通过正确控制任何输入词法单元（包括无效单元）来防止词法错误的发生，在这种情况下，应发布相应的错误消息。\n\n通过这种，开发者可以修改\
  \ `ParseException` 类以适应需求。默认情况下，该类拥有以下变量：\n- `currentToken`: 类型为 `Token`，存储产生错误的标记对象。\n\
  - `expectedTokenSequences`: 类型为 `int [] []`，目的与上一节中的变量 `expected_tokens` 相同。\n-\
  \ `tokenImage`: 类型为 `String []`，存储最后读取的词法单元。如果预查为 `1`，则以下条件成立：`tokenImage[0].equals(currentToken.image)`。\n\
  \n另一方面，错误恢复不需要对 `ParseException` 类进行任何修改，而是使用类似于 `try-catch` 的句结构在方便的地方捕获异常。该句结构也被视为一种模式，因此它可以出现在任何预期出现的地方。句结构的形式如下：\n\
  \n```java\ntry {\n    Pattern\n} catch (AnyException x) {\n    Java Recovery Code\n\
  }\n```\n\n注意，JavaCC 的 `try-catch` 句结构可以捕获任何异常，而不仅仅是 `ParseException`，因此开发者可以创建自己的异常并在发生的地方和时间抛出它们。例如，创建一个\
  \ `SymbolsTableException` 异常可能会很有用。\n\n恢复代码通常以恐慌模式（panic mode）工作，消耗所有条目直到遇到安全标记（security\
  \ token）。下面的示例说明了如何从以分号结尾的语句中恢复错误。\n\n```java\nvoid FinishedStatement(): {} {\n\
  \    try {\n        (statement () <POINTANDOMA>)\n    } catch (ParseException e)\
  \ {\n        System.out.println (e.toString ());\n        Token t;\n        do {\n\
  \            t = getNextToken ();\n        } while (t.kind != POINT ANDOMA);\n \
  \   }}}\n```\n\n### 5.5 最终示例\n汇总在本章 ![](img/image_rsrcDFE.jpg) ![](img/image_rsrcDFF.jpg)\
