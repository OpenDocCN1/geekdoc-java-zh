  \ JavaCC170183\n\n# 第 6 章 符号表\n\n## 6.1 概述\n符号表也称为“名称表”或“标识符表”，它简单的高性能数据结构，用于存储所有关于用户标识符的必要信息。它有两个主要功能：\n\
  1. 执行语义检查。\n2. 生成代码。\n\n此外，该结构仅在编译期间保留在内存中，而在执行期间不保留（但在带有调试选项编译的情况下）。解释器通常在执行期间也在内存中维护符号表，因为这与翻译是同时进行的。\n\
  \n符号表存储了你当前需要的程序变量信息；例如：名称、类型、内存位置地址、大小等。对符号表进行适当且有效的管理非常重要，因为它的操作消耗了大量的编译时间。因此，其效率至关重要。\n\
  \n符号表还用于存储有关 ![](img/image_rsrcDG6.jpg) 用户创建的数据类型、枚举类型以及任何由用户创建的标识符的信息。在这种情况下，开发者可以选择将不同类型的标识符混合在单个表中，或者设置多个表，每个表容纳不同类别的标识符：变量表、数据类型表、用户函数表等。我们仍然将主要关注于用户变量。\n\
  \n## 6.2 关于用户标识符的信息\n开发者决定存储在此表中的信息将取决于你正在开发的翻译器的特定特性。这些信息可能包括：\n\n*   **元素的名称。**\
  \ 可以通过限制或不限制其长度来存储名称或标识符。如果使用每个名称的固定最大尺寸进行限制并存储，可以提高创建速度并提高操作效率，但代价是将名称长度限制在少数几种情况下，并且在大多数情况下浪费空间。171184\
  \ 符号表用例。另一种方法是为每个用例启用所需的以保存名称的内存。在 `C` 中，通过 `char *` 类型很容易实现；例如，如果我们用 `Modula-2`\
  \ 编写编译器，则应该使用 `ADDRESS` 类型。在 `Java` 的情况下，由于有了 `String` 类型，这并不涉及困难。符号表搜索通常通过此名称进行；因此，为了加速此操作，符号表通常是一个哈希表（`hash`），其中搜索和插入操作的成本近似为常数（`O(1)`）。\n\
  *   **元素的类型。** 在存储变量时，知道每个变量所属的数据类型（无论是否为基本类型）至关重要，以便控制对这些变量的使用与其声明时的类型保持一致。第 7\
  \ 章专门负责这种管理。\n*   **内存地址。** 运行时存储其值的内存地址。该地址是必要的，因为引用变量的指令必须在执行时知道在哪里找到该变量的值，以便生成机器码，无论是全局变量还是局部变量。在不允许递归的语言中，地址随着语句的生成按顺序分配。在具有块结构的语言中，地址是相对于分配给该特定内存区域（函数或过程）的起始给出的。\n\
  *   **元素的值。** 在使用简单解释器时，由于解释器中的编译和执行时间是重叠的，如果我们将其值存储在符号表中，你会发现更容易管理变量。然而，在编译器中，符号表绝不存储值![](img/image_rsrcDG7.jpg)\n\
  *   **维度数量。** 如果要存储的变量是数组，也可以存储它的维度。虽然这些信息可以从类型结构中提取，但可以显式说明以进行更有效的控制。\n*   **形式参数的类型。**\
  \ 如果要存储的标识符属于函数或过程，则有必要存储形式参数的类型，以控制此函数的每次调用使用实实参数。返回类型也作为元素的类型存储。\n*   **其他信息。**\
  \ 为了获取统计摘要和信息，存储其他数据可能很有趣：使用该标识符的行号、声明它的行号、激活记录大小（见 9.3.2 节）、它是全局变量还是局部变量、如果是局部变量则在哪个函数中声明的等。172185\n\
  \n## 6.3 符号表考虑因素\n符号表可以使用有用信息进行初始化，这些信息可以存储在单个结构或多个结构中：\n*   **常量：** `PI`、`E`、`NUMERO_AVOGADRO`\
  \ 等。\n*   **库函数：** `EXP`、`LOG`、`SQRT` 等。\n*   **保留字。** 某些词法分析器不直接识别保留字，而是只识别用户。一旦获取输入之一，它们会在保留字表中查找，看其是否与任何保留字匹配；如果找到，它们将标记返回给表中关联的解析器；如果没有找到，则将其作为真正的标识符返回。这便于词法分析的工作，此外，由于此表是不变的，它可以存储在完美哈希表中（即所有搜索都恰好为\
  \ `O(1)` 的表），从而构成了比我们所看到的的 `PCLex` 或 `JavaCC` 更高效的替代方案。\n\n图 6.1 编译器不同阶段对符号表的访问\n\
  \n通常情况下，随着分析阶段的进行和新的 ![](img/image_rsrcDG8.jpg) 标识符声明的发生，词法分析器或取决于我们遵循策略的解析器将在符号表中插入新条目，始终避免重复条目的存在。语义分析器通过符号表执行上下文敏感检查，并且在合成阶段，中间代码生成器使用与每个标识符相关的内存地址生成与输入等效的程序。根据一般规则，代码优化器不需要使用它，尽管没有阻止它访问它。\n\
  \n尽管访问和操作符号表的效率 173186 对应制作一个良好的编译器至关重要，但通常方便对其进行渐进开发。因此，在编译器构建的早期阶段，考虑到其复杂性，最好包含尽可能简单的符号表（例如，基于简单的链表），以避免错误扩散到编译器的其他阶段。一旦各个阶段运行正常，就可以将精力集中在优化符号表的管理上。为了使这个过程不影响已经开发的编译器阶段，有必要为符号表提供一个从开始定义且不变的清晰接口：在优化符号表时，修改其实现，但保持其接口。\n\
