  \ `b := f(c, ..., c)` 中的依赖属性 `c, ..., c` 在节点 `b` 被评估之前在节点处是可用的。\n\n由语法驱动定义指定的翻译可以说明如下：\n\
  1. 使用底层文法构建输入的语法树。\n2. 按照上述方法构造依赖图。\n3. 从依赖图的拓扑排序获取语义规则的评估顺序。按照此顺序评估语义规则将产生输入的翻译并/或触发其解释。\n\
