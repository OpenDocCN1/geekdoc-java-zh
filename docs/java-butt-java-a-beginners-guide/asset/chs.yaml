  \n\n\n\n\n### 8.4.3 条件管理\n\n我们刚刚定义的语言所支持的所有流变化都是条件性的。换句话说，程序根据条件的真假值，通过执行一条语句或另一个语句来遵循其执行流。这意味着，我们决定生成的用于评估条件的代码将对管理不同控制语句中的流转起到决定性作用。\n\
  \n在这方面，存在两种基本可能性。也许最简单的方法是认为条件是逻辑类型的特殊表达式，其求值值为 0 或 1（分别为假或真），并像整数类型表达式一样被存储在临时变量中。界定该条件的语句将随时请求变量的值，以决定流流向何处继续。\n\
  \n例如，规则：\n`sent: IF cond THEN sent optional FIN IF`\n将在点 a 处的动作中建立一个类型如下的三元组组：\n\
  `if tmpXX = 0 goto etqFalse`\n其中 `tmpXX` 是存储条件评估结果的变量。如果它的值不为 0（即条件为真），则不发生跳转，执行流继续，这对应于\
  \ IF 的体语句。结果是，该语句仅在条件为真时执行。作为可选部分（optional），它对应于 `ELSE` 的体（可能是空的），因为这正是在条件为假时你应该跳转的地方。在任何情况下，一旦执行了\
  \ IF 的体，必须跳转到 `FIN IF` 之后，以避免顺序执行 `ELSE` 的可选部分。因此，在点 b 处必须放置三元组：\n`goto etq`\n`label\
  \ etqFalse:`\n\n最后，IF 的结束标签必须放在完整语句之后的点 c 处：\n`label etqFINIF:`\n生成的完整代码如下：\n\n\
  ```text\n// 评估 cond 并将其值放入 tmpXX 的代码\nif tmpXX = 0 goto etqFalse\n// IF 语句的代码\n\
  goto etq\nlabel etqFalse:\n// ELSE 语句代码\nlabel etqFINIF:\n```\n\n为了实现这一目的，必须在语义动作的后件中插入贯穿其中的语义动作。此外，在此处识别为\
  \ `etqFalse` 和 `etqFINIF` 的标签实际上必须我们的编译器即时生成的任何标签，例如分别是 `etq125` 和 `et5563`。\n\n\
  在任何情况下，这种条件评估机制都会导致效率下降，因为复合条件必须完全经过评估。为了在不精简代码的情况下避免这个问题，使用了一种允许使用短路逻辑评估条件的技术。例如，在形式为\
  \ `cond OR cond` 的复合条件中，如果第一个条件为假，则只评估第二个，因为否则，可以确保无论 `cond` 的值如何，`OR` 的结果都为真。`AND`\
  \ 也会发生类似的情况。我们将使用这种方法，并在下文中详细解释。\n\n#### 8.4.3.1 使用短路逻辑进行条件评估\n\n该机制是每个 `cond` 生成一个包含两个跳转（`goto`）的代码块：如果满足条件，则跳转到标签\
  \ `A`；如果不满足条件，则跳转到另一个标签 `B`。为简单条件生成此类代码是非常容易的。他们将研究复合条件中的短路逻辑。\n\n##### 8.4.3.11\
  \ 简单条件\n\n作为起点，假设表达式和赋值生成的与 8.3 节计算器中研究的中间代码相同。因此，面对如下条件：\n`7 * a > 2 * b - 1`\n\
  将使用规则：\n`cond: expr '>' expr one`\n根据 `expr` 的规则，且尚未在 `cond` 规则中引入任何语义动作，生成了代码：\n\
  \n```text\ntmp1 = 7 * a\ntmp2 = 2 * b\ntmp3 = tmp2 - 1\n```\n\n其中 Ø 行对应于 `expr`，Ù\
  \ 行和 Ú 行对应 `one expr`。此外，代表 `expr` 的属性值为 `\"tmp1\"`，而代表另一个 `expr` 的属性值为 `\"tmp3\"\
  `。\n\n另一方面，我们声称简单条件的产生式规则如：\n\n| `cond: expr op expr one rel` | 生成如下形式的代码块： |\n\
  | :--- | :--- |\n| `if var op var goto etqone rel` | True (真) |\n\n\n\n\n\n`goto\
  \ etq False` 其中 `var` 是第一个表达式的表示，可以是临时变量、一个用户变量或数值常数；`var` 代表第二个表达式；`op` 代表比较运算符：大于\
  \ (`>`)、小于 (`<`)、不等于 (`<>`) 等。此外，`etq True` 和 `etq False` 是由编译器按顺序生成的即时标签：`etq001`、`etq002`\
  \ 等，与生成临时变量的方式类似。\n\n继续我们的示例，我们感兴趣的生成的代码是：\n\n```\nif tmp1> tmp3 goto etq001 goto\
  \ etq002\n```\n其中 `etq001` 代表 `etq True`，`etq002` 代表 `etq False`。要生成这段代码，只需为条件规则关联一个语义动作即可，使其保持如下：\n\
  \n```c\ncond: expr '>' expr one two {\n    259272\n    newEtq ($$.etqTruth); \n\
  \    newEtq ($$.etqFalse);\n    printf (\"\\tif%s>%s goto%s \\n\", $1, $3, $$.etqTruth);\
  \ \n    printf (\"\\tgoto%s \\n\", $$.etqFalse);\n}\n```\n\n从这个语义动作可以看出，与条件关联的属性是一对标签，一个真，一个假。此外，生成的代码块有两个\
  \ goto（一个条件跳转和一个无条件跳转）指向标签，但尚未定位任何一个的 set，即它们没有标签。图 8.7 显示了与每个语法块关联的代码。\n\n**图 8.7.\
  \ 简单条件的代码生成**\n\n这是因为在利用条件的规则（无论是在 `IF` 中还是在 `WHILE` 中），你应该适当地放置这些标签。例如，`WHILE`\
  \ 会将真标签的目的放在循环体的开始，而假标签将放在循环体之后；这样，当条件为假时跳过循环体，当条件为真时执行一个新循环。其他语句也会发生类似的情况；图 8.8\
  \ 显示了 `IF` 的情况。\n\n**图 8.8. 应生成完整 IF 语句的代码**\n\n### 8.4.3.1.2 复合条件\n\n上述讨论得出的一个事实是，在构建条件（`IF`、`WHILE`\
  \ 等）时的判断，无论是对于简单条件还是对于涉及逻辑运算符 `AND`、`OR` 和 `NOT` 的复合条件，都必须进行统一处理。因此，复合条件本身必须生成一个代码块，其中包含两个尚未建立目标。标签目标将赋值为非终结符\
  \ `cond` 的属性，因此复合条件的处理方法与简单条件一致。\n\n此外，希望使用短路技术，即只有当条件的真假值在它所涉及的复合条件的求值中起决定性作用时，才对其进行求。如果我们把条件生成的代码块看作一个黑盒，在某个时刻跳转到一个伪标签或真实标签，如图\
  \ 8.9.a) 所示，那么下面的解释就能被更好地理解。\n\n因此，在类似 `cond: cond AND cond` one two 的规则之前，将生成图\
  \ 8.9.b) 中的代码块。但由于必须将一切归约为复合条件的集合，图 8.9.b) 中的块应被简化为只有一个，其中只一个真标签和一个假标签，如图 8.9.c)\
  \ 所示。我们假设流到达了上方一个块。\n\n**图 8.9. 与条件关联的块图**\n\n换句话说，图 8.9.c) 显示，在尚未为规则 `cond: cond\
  \ AND cond` 关联任何语义动作的情况下，将生成具有四个 GOTOS 但没有标签的两个块。所以我们的目标是：将四个无标签的 GOTOS 减少到两个 GOTOS，并匹配通用\
  \ `cond` 块的真、假标签。只有当第一个条件为真时，才评估第二个条件；否则，短路技术不需要评估它，因为整体条件已经是假的了。\n\n**图 8.10. 由\
  \ AND 组成的条件关联的代码**\n\n通过这种方式，最终结果是我们生成了一个单一的大代码块，其中只有一个真标签和一个假标签。通过获得一个大的代码块，从外部角度来看，我们可以统一处理条件，无论它是简单条件还是复合条件。\n\
  \n我们可以以非常简单的方法实现这两个目标；方法是策略性地放置 `cond` 标签，以便仅在 `cond` 满足时跳转到评估 `cond` 的代码；当 `cond`\
  \ 为假时，必须不评估 `cond`，而应该跳转到与 `cond` 为假相同的地方，即 `etq_2 False`。通过这样，如果任何一个条件为假，最终结果就是跳转到\
  \ `etq_2 False`，如果两个都为真，则将跳转到 `etq_2 True`。因此，`cond` 标签将与全局条件标签匹配，你需要按照指示放置两个语义动作来编写标签。块图将如图\
  \ 8.11 所示。\n\n**图 8.11. 与 AND 复合条件关联的块图**\n\n如果我们将箭头替换为三元组代码，我们就得到了一个像图 8.10 中的块。如所示，要生成两个条件之间的标签将需要包含一个中间语义动作。同样，从图中也可以看到，用于获取两个条件假结果的权宜之是相同的：只需在第一个目的地之后，定位一个跳转到第二个标签的无条件跳转语句即可。此外，整个块的真、假标签对应于\
  \ `cond` 的真、假，即 `etq_2 True` 和 `etq_2 False`，因此这两个属性必须从 `cond` 原封不动地复制到相应两个产生式中的前驱\
  \ `cond` 中。图 8.12 显示了针对 `a > 3 AND a < 8` 条件生成的代码示例。\n\n**图 8.12. 条件 a > 3 AND a\
  \ < 8 的生成代码**\n\n与中间产生式规则关联的语义动作将是：\n\n```c\ncond: cond AND {\n    printf (\"label%s\
  \ \\n\", $1.etqTruth);\n}\ncond {\n    printf (\"label%s \\n\", $1.etqFalse);\n\
  \    printf (\"\\tgoto%s \\n\", $4.etqFalse);\n    strcpy ($$.etqTruth, $4.etqTruth);\n\
  \    strcpy ($$.etqFalse, $4.etqFalse);\n}\n```\n\n为了很好理解这些语义动作，我们必须记住，中间动作被 Yacc\
  \ 翻译为一个非终结符，因此在对后续符号进行编号时会被计算在；因此，与第二个条件关联的属性被称为 `$4` 而不是 `$3`；`$3` 真的是中间动作本身。另一方面，中间动作也可以放置在\
  \ `AND` 标记之前，产生相同的结果。然而，当语义动作可以放置在规则的多个点时，尽可能推迟它是有方便的，因为可以避免解析器中的移/归冲突。\n\n复合条件的处理相对于简单条件是系统且统一的。这允许我们生成大型代码块，这些块反过来可以参与其他复合条件。换句话说，建议的语义动作允许为形式如\
  \ `cond AND cond AND cond ... AND cond` 的 `cond` 的条件正确生成代码。\n\n### 8.4.3.2 代码生成\n\
  \n正如读者已经预测的那样，逻辑 `OR` 运算符的处理遵循类似于研究 DNA 的模式，不同是它们交换了第一个条件中真假标签的角色，这产生了一个类似于图 8.13\
  \ 的块图。图 8.14 显示了条件 `a = 3 OR a = 5` 生成的代码示例，而与中间产生式规则关联的语义动作将是：\n\n\n\n\n\n| cond:\
  \ cond OR | {printf (\"label% s \\ n\", $ 1.etqFalso);} |\n| cond | {printf (\"\
  label% s \\ n\", $ 1.etqTruth); printf (\"\\ tgoto% s \\ n\", $ 4.etqTruth); strcpy\
  \ ($$. etqTruth, $ 4.etqTruth); strcpy ($$. etqFalso, $ 4.etqFalso); } |\n\n图 8.13.\
  \ 与 OR 复合条件相关的框图\n\n最后，`NOT` 运算符有非常特殊的处理方式。如果你仔细思考，当根据规则 `cond: NOT cond` 执行时，解析器将已经执行了与后件条件（`cond`）相关的语义动作，因此\
  \ `sa` 已经生成了所有判断其真值所需的必要代码。因此，为 `NOT` 运算符的出现生成更多相关代码没有意义，只需交换后件真、假标签的角色就足够了，这将变为图\
  \ 8.14 所示：条件 `a = 3 OR a = 5` 生成的代码（image_rsrcDK4.jpg），分别是前件的假标签和真标签。换句话之，当 `cond`\
  \ 为假时，会跳转到前件的真标签，因为 `NOT cond` 为真。\n\n图 8.15 显示了上述过程的框图。另一方面，图 8.16 显示了与条件 `\"a>\
  \ 3\"` 和条件 `\"NOT a> 3\"` 相关的属性示例，两种情况下生成的代码是相同的。图 8.15. 与 NOT 复合条件相关的框图\n\n中间产生式规则相关的语义动作是：\n\
  ```\ncond: NOT cond {strcpy ($$. etqTruth, $ 2.etqFalse);strcpy ($$. etqFalse, $\
  \ 2.etqTrue); }\n```\n图 8.16. 条件 `NOT a> 3` 生成的代码\n\n至此，我们完成了该语言提出的所有逻辑运算符。对于其他运算符，如\
  \ `NAND`、`NOR`、`IMPLIES`（蕴含逻辑）等，处理程序相同。一个特殊情况是 `XOR` 运算符，其真表如下：\n\n| A | B | A XOR\
  \ B |\n| :--- | :--- | :--- |\n| True | True | False |\n| True | False | True |\n\
  | False | True | True |\n| False | False | False |\n\n该运算符不支持短路，因此必须生成支持临时变量的代码，以便在两个条件相等时跳转到假标签情况，否则跳转到真标签。\n\
  \n### 8.4.4 流程控制语句的管理 (image_rsrcDK5.jpg) 代码生成\n\n此时，我们将处理条件及其相关标签，以生成根据这些条件的值改变执行顺序流的语句代码。这些语句是：`IF`、`WHILE`、`CASE`\
  \ 和 `REPEAT`。\n\n#### 8.4.4.1 IF-THEN-ELSE 语句\n\n`IF` 语句的情况是最简单的。在这里，只需指示条件的真标签与\
  \ `THEN` 之后的代码关联，而假标签与可能位于 `ELSE` 之后的代码关联。在任何情况下，一旦完成 `THEN` 语句，在 `IF` 的末尾必须发生一次跳转，因为我们不希望执行\
  \ `ELSE` 语句。因此，在 `THEN` 语句之后，我们创建一个新标签并对其产生跳转，将该标签的地址放在 `IF` 代码的末尾。可以通过一个示例得到很好的理解：\n\
  \n| 源代码 | 中间代码 |\n| :--- | :--- |\n| `IF A> 0 THEN S1: = 1;ELSE S2: = 2;END IF`\
  \ | `if A> 0 goto etq1 goto etq2 label etq1: S1 = 1 goto etq3` |\n| | `label etq2:S2\
  \ = 2 label etq3: ` |\n\n框图可以见图 8.17。粗略来说，要做到这一点你需要插入两个中间语义动作，一个显示红色标记的代码，另一个用于蓝色标记的代码。`etq3`\
  \ 标签存储在我们在我们暂称之为 `etqFINIF` 的变量中；因此，必要的语义动作如下（这种简单的近似假设每个 `IF` 都有一个 `ELSE`；稍后我将提出一般情况）：\n\
  \n```\n{printf (“label% s \\ n”, $ 2.etqTruth); }\nsent: IF cond THEN sent ELSE\
  \ sent FIN IF {printf (“label% s: \\ n”, etqFINIF ); }\n{newEtq ( etqFINIF ); printf\
  \ (\"\\ tgoto% s \\ n\", etqFINIF ); printf (\"label% s: \\ n\", $ 2.etqFalso);\
  \ }\n```\n\n然而，这里有一个在后续控制语句中将成为常见的问题：`etqFINIF` 变量在哪里声明？（注意，该变量在上面的示例中使用了斜体，因为它还没有被声明）。显然，源程序中出现的每个不同的\
  \ `IF`（image_rsrcDK6.jpg）图 8.17. IF 语句的框图都需要一个不同的 `IF` 结束标签。因此，很明显，这个标签不能存储在全局变量中，因为\
  \ `ELSE` 中的中的语句可能是另一个 `IF`，这使得有必要通过相同的规则对其进行归约，并在到达最终语义动作（黑色部分）之前覆盖全局变量的值。\n\n另一方面，`etqFINIF`\
  \ 不能在蓝色的语义动作中声明（那里通过作为参数传递给新函数 `Etq` 给其赋值），因为在这种情况下它将是 C 语言块的局部变量，在结束的语义动作中不可见。因此，你需要在某处声明它，使其足够全局，以便在同一规则的两个语义动作中可见；但它必须足够局部，以便嵌套的\
  \ `IFs` 可以分配局部值而不覆盖外层 `IF` 的标签。值得注意的是，像 JavaCC 这样的元编译器使用与每个 BNF 规则相关的代码区域来解决这个问题；这里你可以声明变量\
  \ `etqFINIF` 并在相同规则的任何动作中使用它。如果有嵌套的 `IFs`，代表非终结符的函数调用递归本身将负责创建带有该变量副本的作用域。JavaCC\
  \ 采用的解决方案可以为解决 PCYacc 中的问题提供一些线索：我们需要一个对于整个规则局部的变量，你可以在所有语义动作中使用它，但在存在嵌套 `IF` 时让它变得不同。解决方案是使用\
  \ `IF` 令牌作为该变量的容器，并将其赋值为属性：`IF` 令牌属性可以被其后的语义动作访问，如果存在例如三个嵌套的 `IFs`，每一个都将有自己的属性。假设于此，规则保持不变：\n\
  \n```\nsent: IF cond THEN sent {printf (“label% s \\ n”, $ 2.etqTruth); }{newEtq\
  \ ($ 1); }\n```\n\n\n\n\n\n## 280 代码生成\n\n```c\nprintf (\" tgoto% s \\ n\", $ 1);\
  \ \nprintf (\"label% s: \\ n\", $ 2.etqFalso); } \noptional FIN IF {printf (“label%\
  \ s: \\ n”, $ 1); }\n```\n\n图 8.18 显示了示例语句生成的代码。![](img/image_rsrcDK7.jpg) 请注意，如果\
  \ `ELSE` 部分不存在（可选非终结符通过 `epsilon` 规则归约），代码可以正常工作，尽管并非完全最优。图 8.18. 简单 `IF` 语句生成的代码。\n\
  \n### 8.4.4.2 WHILE 语句\n\n`WHILE` 和 `REPEAT` 的情况非常相似。在这两种情况下，都有必要在循环开始处放置一个标签，该标签将在每次迭代结束时被跳过（此处此处应为跳转以重复）。\n\
  \n在 `WHILE` 的情况下，条件代码生成在下方，因为在进入执行循环体之前必须对其进行求值。真标签位于组成主体的语句之前，这些是在条件为真时必须执行的内容。在语句末尾将将跳转到循环开始处，再次检查条件。条件的虚假标签将位于与\
  \ `WHILE` 相关的所有内容的末尾，或者说，位于为 `WHILE` 语句后续语句生成的代码的开头。通过这种方式，当条件不再满足时，将开始执行 `WHILE`\
  \ 语句之后的语句序列。\n\n请记住与 `WHILE` 相关的产生规则是：\n`sent: WHILE cond DO sent FIN WHILE`\n\n\
  因此，我们为了正确构建流所需的代码块是图 8.19 中阴影所示的部分。图 8.19 的其余部分显示了条件标签应该的位置，以及创建一个与 `WHILE` 开头关联的新标签的必要性。此标记的属性与之前一点解释的关于\
  \ `IF` 语句的属性非常相似。换句话说，它将被存储为 `WHILE` 令牌自身的属性。\n\n通过这种方式，块图完全遵循了 `WHILE` 循环的语义：\n\
  1. 检查条件。\n2. 如果为真，则执行 `sent` 并返回上一点以再次检查条件。\n3. 如果为假，则退出循环，流继续执行 `WHILE` 之后的语句。\n\
  \n最后，与 `WHILE` 产生规则相关的语义动作将：\n```yacc\nsent: WHILE {newEtq ($ 1); printf (\"label%\
  \ s: \\ n\", $ 1); }\ncond DO {printf (\"label% s: \\ n\", $ 3.etqTruth); }\nsent\
  \ FIN WHILE {printf (\"\\ tgoto% s \\ n\", $ 1); printf (\"label% s: \\ n\", $ 3.etqFalso);}\n\
  ```\n\n### 8.4.4.3 REPEAT 语句\n\n让我们记住与 `REPEAT` 语句相关的产生规则：\n`sent: REPEAT sent UNTIL\
  \ cond`\n\n其中你可以看到条件在执行至少一次循环后是如何被求值的。只要条件为假，主体就会一直运行，或者说，直到条件满足为止。\n\n为了让生成的中间代码以相同的方式运行，理想情况下，条件的假标签应该放在主体的开头，该标签允许程序的顺序流继续。因此，紧跟在假标签之后的是语句的代码，因为条件是最后被求值的。在语句之后我们放置条件代码。由于假标签已经放在了循环开头，只需在条件代码之后放置真标签，这将产生一个类似于图\
  \ 8.20 所示的理想块图。\n\n图 8.20. `REPEAT` 语句的理想块图。![](img/image_rsrcDK9.jpg) ![](img/image_rsrcDKA.jpg)\
  \ 然而，能够生成符合图 8.20 所示的代码是不可行的，因为假标签无法放在主体语句之前，因为它们的值尚未知。换句话说，假标签是在条件归约时生成的，而这发生在我们需要可视化你的标签之后。从另一个角度来看，当你知道假标签的值时，再显示它的标签已经太晚了，因为这在归约主体语句之前就必须完成。\n\
  \n注意以下操作是错误的，因为它试图访问一个在执行该操作时是未知的属性：\n```yacc\nsent: REPEAT {printf (\"label% s:\
  \ \\ n\", $ 5.etqFalso ); } sent UNTIL cond\n```\n\n为了解决这个问题，我们采用所谓的间接法，即创建一个新的\
  \ `REPEAT` 开始标记，然后创建一个代码块并在其中按顺序放置：\n1. 假标签。\n2. 一个跳转到 `REPEAT` 开始标记的 `goto`。\n\n\
  块图将如图 8.21 所示。这种代码非常低效，可以在以后阶段进行优化。\n\n图 8.21. `REPEAT` 语句的块图。\n\n与 `REPEAT` 产生规则相关的语义动作保持为：\n\
  ```yacc\nsent: REPEAT {newEtq ($ 1);printf (\"label% s: \\ n\", $ 1); }\nsent UNTIL\
  \ cond { printf (\"label% s: \\ n\", $ 5.etqFalso); printf (\"\\ tgoto% s \\ n\"\
  , $ 1); printf (\"label% s: \\ n\", $ 5.etqTrue);}\n```\n![](img/image_rsrcDKB.jpg)\
  \ 图 8.22 显示了示例的 `REPEAT` 语句生成的代码。\n\n### 8.4.4.4 CASE 语句\n\n`CASE` 语句最难翻译，因为它允许内部不确定数量的\
  \ `CASE` 子句，这迫使它们在执行时带入一系列属性。该语句的语义目标与 `switch` 语言相同，仅需要一个 `break` 子句在每个 case 处中断流。另一方面，从语法角度来看，不能只使用产生规则来指示它，必须诉诸递归并声明一些新的终结符。识别它的语法部分是：\n\
  ```yacc\nsent : sent_case;\nsent_case : start_case FIN CASE|start_case OTHERWISE\
  \ CASE;\nhome_case : CASE expr|case_start expr;\n```\n可见 `sent_case` 非终结符包含了两种可能性，一种带有\
  \ `OTHERWISE` 子句，另一种没有。两种规则都可以被替换为关于 `OTHERWISE` 可选性的单一规则，例如：\n```yacc\nsent_case\
  \ : start_case optional_case FIN CASE;\noptional_case: OTHERWISE;\n```\n![](img/image_rsrcDKC.jpg)\
  \ 但我们将保留它，与 `IF` 语句的决策相同，可以通过不同的方式完成，包括用于生成代码的语义动作。此外，建议的语法允许 `CASE OF FIN CASE`\
  \ 构建，其中包含了单个 `CASE` 子句。从我们的观点来看，它是有效的，但如果我们想避免它，必须替换 `home_case` 中的第一个，并如下：\n`case:\
  \ CASE ':' sent`\n\n图 8.23 显示了识别 `CASE` 语句的语法树部分，其中你可以看到 `start_case` 非终结符上的递归。一旦看到了这些细节，我们现在转向代码生成。首先要实现的是生成代码的主要规则是语法树中出现最多的，即：\n\
  `case_start : home_case`\n`home_case : CASE ':' sent`\n\n以这种方式，与该规则相关的语义将在整个 `CASE`\
  \ 语句的归约期间被重复执行。考虑到这一点，让我们对生成的中间代码结构有一个初步的想法，考虑到每个 `CASE` 块的结构必须是相同的（但不涉及的变量和标签）。因此，与图\
  \ 8.23 示例相关的将具有图 8.24 中类似的块。在最后一个图中，它们根据生成的产生规则被标记为不同的颜色。蓝色是 `start_case` 第二条规则生成的块，绿色是\
  \ `start_case` 第一条规则生成的块，棕色是包含 `OTHERWISE` 子句的 `sent_case` 规则生成的块。此外，除了每个 `expr`\
  \ 块，还有运行时假设该表达式总结果的变量名称（临时或否）。最后，条纹块代表已由其他产生规则生成的中间代码；因此，所有没有条纹的我们必须在与 `CASE` 产生规则相关的语义动作中生成。\n\
  \n图 8.24. `CASE` 语句的代码块。从图中所示，已经实现了所有蓝色块的形状大致相同：\n- 存储在 `tmp` 中的局部表达式计算\n- 将 `tmp.`\
  \ 与 `tmp` 比较。如果不相同，则跳转到 `expr` 块的结尾\n- 与 `sent` 语句相关的中间代码\n- 跳转到 `CASE` 语句的结尾\n\n\
  显然，此代码生成的最大复杂性在于 `CASE` 规则（`start_case` 的第二条规则），因为它应该是生成图 8.24 中标记为蓝色的所有代码。让我们仔细研究其中一个蓝色块。每个蓝色代码块中我们需要生成的三元组又分为两部分：一部分插入在\
  \ `expr` 和 `sent` 之间，另一部分在它们的 `i` 块末尾。下一步是检查此代码以推导出每个非终结符需要哪些属性。专注于出现的变量和标签，可以将它们分为两个部分：\n\
  - `tmp` 变量和 `ietq` 标记是每个块局部的，也就是说，它们不会在一个块中使用超过一次。\n- 变量 `tmp.` 和 `expretq` 标签 `FIN_CASE`\
  \ 在所有块中重复使用。它也被用于 `sent_case` 规则，以便最后查看 `etq` `FIN_CASE`。`tmp.` 代表将要比较的表达式，`etq`\
  \ 代表 `CASE` 的结束，即与每个 `CASE` 语句相关的代码后将跳过的标签。一方面，变量 `tmp` 是 `CASE` 局部表达式生成的并存储在非终结符属性\
  \ `expr` 中，因此在任何语义中都是可访问的。\n\n\n\n\n\n## 数据结构定义\n\n| 字段索引 | 类型 | 字段描述 |\n| :---\
  \ | :--- | :--- |\n| 8 | `char` | `etq_final[21]` |\n| 9 | `char` | `variable_expr[21]`\
