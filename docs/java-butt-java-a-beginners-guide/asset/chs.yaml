  \ 4.5 所示。按照惯例，非终结符符号用小写，终结符用大写，箭头被替换为 `:`，并且每个规则必须以 `;` 结尾。\n\n#### 语法 Yacc 表示法\n\
  ```yacc\n%% / * 规则区域 * /\nE ÷ E + T\ne: e '+' t\n| T | t;\nT ÷ T * F\nt: t '*' f\n\
