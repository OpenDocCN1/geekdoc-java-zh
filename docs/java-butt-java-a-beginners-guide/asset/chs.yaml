  ## 3.5.2 使用递归函数的自顶向下分析\n\n无上下文文法构成了一种表示形式化语言的机制。然而，它并不是唯一的机制，因为 BNF 记法和语法图具有相同的能力。假设\
  \ BNF 记法也允许表示形式化语言，下面将给出语法图的定义，并证明这些图至少与上述 BNF 记法具有相同的能力。从现在起，我们将能够使用任何允许递归的编程语言构建一个特殊的解析器（ad\
  \ hoc parser）。\n\n### 3.5.2.1 语法图\n\n语法图（也称为 Conway 图）是一种图导向的结构，其中非终结元素以矩形形式出现，终结元素以圆形或椭圆形式出现。\n\
  \n每个语法图都有起点和终点，这些点通常不显式表示，但假设起点在图的左侧，终点在右侧。每一条起点为 `α`、终点为 `β` 的弧表示符号 `α` 之后可以跟随\
  \ `β`（`α` 和 `β` 都可以是终结符是非终结符）。这构成了从图开始到结束的所有路径，它们代表了有效的句法形式。\n\n### 3.5.2.2 语法图的能力\n\
  \n我们将通过对基本的 BNF 操作进行归纳，证明语法图允许我们表示与 BNF 记法相同的文法：\n\n| 操作 | BNF | 语法图 |\n| :--- |\
  \ :--- | :--- |\n| 并列 (Juxtaposition) | `AB` | |\n| 选择 (Option) | `A \\|\\| B` |\
  \ `g \\|\\| B` | \n| 重复 (Repetition) | 次或多次 `{B}` | 次或多次 `[B]` |\n\n遵循上表假设的“罗塞石石可以将任何\
  \ BNF 表达式转换为相应的语法图，因为 `A` 和 `B` 反过来可以是表达式或复杂的图。另一方面，任何深入研究语法图的人可能注意到，并不总是容易将语法图转换为对应的\
  \ BNF 记法表示。\n\n### 3.5.2.3 与执行流的对应关系\n\n现在，我们将建立程序执行流与在一个或多个语法图中识别有效语句时可以遵循的路径之间的对应关系。例如，并列操作将如图\
  \ 3.10 所示。图 3.10。并列语法图与遵循相同流的函数之间的等效性。该函数与图同名。\n\n编程练习由遵循以下演进的相互调用的重要详细过程组成。在开始完整示例之前，最好思考一下当我们需要在语法图中查找终结符号时应该如何操作。在这种情况下，有必要控制词法分析器返回的\
  \ token 是否符合语法图的预期。例如，图 3.11 中的图将通过代码块翻译：\n\n```\nfunction Prog () {\n    sent ();\n\
  \    if (token == ';') {\n        consume_token ();\n    } else {\n        Syntactic\
  \ error!\n    }\n}\n```\n\n其中 `to_consume_token` 指在词法分析器时请求下一个 token。在后续的示例中，我们假设词法分析器提供一个名为\
  \ `get_token()` 的函数，它将下一个 token 在全局变量 `token` 中。根据这一标准，如果我们从图 3.12 的图开始，生成的代码将是：\n\
  \n```\nfunction prog2 () {\n    get_token ();\n    sent ();\n    if (token == ';')\
  \ {\n        get_token ();\n    } else if (token == END) {\n        get_token ();\n\
  \    } else {\n        Syntactic error!\n    }\n}\n```\n\n必须意识到，为了解析器能够开始识别，`token`\
  \ 变量必须已经预加载了一个值；这个变量被称为预搜索标记（前瞻符，lookahead），它是至关重要的，因为这将允许我们决定在语法图中继续执行流的哪里，正如我们稍后看到的。同样重要的是要理解这里被泛指标记为\
  \ `Error` 的内容。图 3.12。一个用于 `prog2` 的新语法图：`prog2 syntactic!`。它实际上由一个指示发现错误行号的消息以及其性质组成，例如：“期望一个\
  \ ',' 但发现了 token < ””。\n\n### 3.5.2.4 完整示例\n\n在本节中，我们将为一组表示图构建递归函数，这些图表示一种由逻辑/算术表达式组成的语言，每个表达式都以分号结尾。初始公理由非终结符序列给出，该序列还应该负责执行第一次\
  \ `get_token()`，如下所示如何控制词法分析器发送的最后一个伪标记是否为 EOF（文件结束）。图 3.13 序列语法图\n\n```\nfunction\
  \ Sequence () {\n    get_token ();\n    do {\n        expression ();\n        while\
  \ (token != PUNTOYCOMA) {\n            Error in expression!\n            get_token\
  \ ();\n        }\n        get_token ();\n    } while (token != EOF);\n}\n```\n\n\
  在这种情况下，`;` (`PUNTOYCOMA`) 作为一种安全 token，允许使用 panic 模式进行错误恢复（见点 3.3.1）。图 3.14 表达式语法图\n\
  \n```\nfunction expression () {\n    exprSimple (); \n    if ((token == EQUAL) ||\
  \ (token == ME) || (token == MEI) || (token == DIST) || (token == MAI) || (token\
  \ == MA)) {\n        get_token ();\n        exprSimple ();\n    }\n}\n```\n\n图 3.15\
  \ `exprSimple` 的语法图\n\n```\nfunction exprSimple () {\n    if ((token == MORE) ||\
  \ (token == LESS)) {\n        get_token ();\n    } else {\n        finished ();\n\
  \    }\n}\n```\n\n图 3.16 项（Term）语法图\n\n```\nfunction Term () {\n    factor ();\n\
  \    while ((token == POR) || (token == DIV) || (token == DIV_ENT) || (token ==\
  \ MOD) || (token == AND)) {\n        get_token ();\n        finished ();\n    }\n\
  }\n```\n\n图 3.17 因子（Factor）语法图\n\n```\nfunction Factor () {\n    switch (token)\
  \ {\n        case ID:\n            get_token ();\n            break;\n        case\
  \ NUM:\n            get_token ();\n            break;\n        case NOT:\n     \
  \       get_token ();\n            factor ();\n            break;\n        case\
  \ AB_PAR:\n            get_token ();\n            if (token != CE_PAR) {\n     \
  \           expression ();\n            } else {\n                get_token ();\n\
  \            }\n            break;\n        default:\n            Error: Invalid\
  \ expression.\n    }\n}\n```\n\n这个示例展示了如何相对容易地获得函数来模拟语法图在识别时遵循的执行路径。\n\n### 3.5.2.5\
  \ 关于函数自顶向下分析的结论\n\n并不是每个语法图都能如此容易地转换为递归函数；特别是在图中可以遵循多条路径的节点，遵循哪条路径的决定基于输入中的下一个 token，因此该\
  \ token 充当判别器。图 3.18a 有两个以相同 token 开头的备选。情况 b) 消除了这个问题。作为经验，这些图可以被重构，使得它们非常适合我们的函数构造，如图\
  \ 3.18b 所示。编译器使用 BNF 记法来表示文法，并为文法的每个非终结符构造一个递归函数，其中包含了所有识别的内部逻辑。在冲突情况下（如上所示），编译器开发者可以指示使用更大数量的预搜索标记。\n\
  \n## 3.5.3 LL 文法的自顶向下分析 (1)\n\n这种类型的分析基于表格形式的识别自动机，称为语法检查表。该表以文法的非终结符为纵轴，以终结符（包括\
  \ EOF）为横轴。每个内部单元格（对应于终结符的列和非终结符的行）的内容包含一个产生式，或者为空，空值被解释为对待识别链的拒绝。通常情况下，我们可以说 LL(1)\
  \ 文法是一种只需检查输入中的一个符号就足以应用哪条规则的文法，从初始公理开始并向左进行推导。该方法由从以下开始的算法组成：要识别的字符串，以及一个指针，该指针告诉我们哪个是当前的预搜索（由所述\
  \ token 表示）。一个符号栈（终结符和非终结符）；我们将用 `X` 表示此栈的顶部。一个与文法唯一关联的语法检查表。在本文中将介绍如何从文法获取此表。我们将用\
  \ `M` 表示此表，它将为文法的每个非终结符有一行，为每个终结符有一列（包括 EOF）：`。始终，输入字符串将以 EOF 结束，从现在起我们用符号 `$` 表示。上述算法反复查询\
  \ `M` 表，直到接受或拒绝句子。从带有 `$` 和初始公理 `S` 的栈开始，每个步骤都遵循以下一点（它们是互斥的）：\n\n1. 如果 `X = a =\
  \ $` 则接受。\n2. 如果 `X = a...$` 则从栈中移除 `X` 并移动指针。\n3. 如果 `X = T` 且 `X...a` 则拒绝。\n4.\
  \ 如果 `X = N` 则查询表中的项 `M[X, a]`，并且：\n   如果 `M[X, a]`为空：拒绝。\n   如果 `M[X, a]` 不空，则从栈中移除\
  \ `X` 并反序放入结果。例如：如果 `M[X, a] = {X UVY}`，则从栈中移除 `X` 并反序放入 `UVY`，如图 3.19 所示。\n\n##\
  \ 3.5.4 LL 方法中的规则应用 (1)\n\n与递归函数的自顶向下分析一样，一旦应用了规则，无法通过任何回的回溯撤销。这种类型分析的主要缺点之一是 LL(1)\
  \ 文法的数量较少；然而，当文法不是 LL(1) 时，通常可以通过转换来获得一个等效的 LL(1) 文法。例如，以下文法不是 LL(1)：\n\n`E -> E\
  \ + T | T`\n`T -> T * F | F`\n`F -> (E) | go`\n\n但可以对其进行因子化，使其变为：\n\n`E -> T E'`\n\
  `E' -> + T E' | g`\n`T -> F T'`\n`T' -> * F T' | g`\n`F -> (E) | go`\n\n它是等效的是 LL(1)\
  \ 的。\n\n\n\n\n\n| TN | go | + | * | ( | ) | $ |\n| :--- | :--- | :--- | :--- | :---\
  \ | :--- | :--- |\n| AND | E ÷ TE ' | | | E ÷ TE ' | | |\n| AND' | | E '÷ + TE'\
  \ | | | E '÷ g | E '÷ g |\n| T | T ÷ F T ' | | | T ÷ F T ' | | |\n| T ' | | T '÷\
  \ g | T '÷ * F | | T '÷ g | T '÷ g |\n\n`T ' F F ÷ id F ÷ (E)` \n\n显然显然，这张表属于语法法部分，可以用于拒绝或识别任何语句。也就是说，该表不是为识别每个句子而构建的，而是专门与语法相关，并成为你的带栈有限自动机的表示。\n\
