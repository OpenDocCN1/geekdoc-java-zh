  ExpSuma\nExpMult\nExpunary\nIdentifier\nExpMult\nExpunaryIdentifier\n```\n\n我们看到每个非终结节点（`.jjt`\
  \ 文件中的 java 函数）都被唯一地分配了一个整数值，并且默认情况下，每个节点（非终结节点）都被分配一个名称。如果用户没有分配名称，它与实现该非终结方法的名称相同。为了能够分配与默认设置不同的名称，有必要使用字符\
  \ `#` 后跟上我们想要分配的名称。\n\n### 5.6.2.1 使用 `##` 重命名节点\n\n`##` 是一个构造函数，用于户可以用不同于 JavaCC\
  \ 默认调用方式调用每个节点。必须在多模式下操作，以便每个节点都可以从我们紧接着放在 `#` 构造函数之后的名称派生。它还用于简化语法，并从栈中移除对树没有贡献的节点。\n\
  \n在选项区域，多模式必须如下激活：\n```java\noptions {MULTI = true;}\n```\n\n如果我们对同一个示例使用后者（`example1.jjt`），语法如下：\n\
  `void Expression () #void: {}` 154167![](img/image_rsrcDFN.jpg)\n\n```java\n{ExpSum\
  \ ()}\nvoid ExpSuma () #void: {((\"+\" | \"-\") ExpMult ()) *} #Sum (> 1)}\nvoid\
  \ ExpMult () #void: {(ExpUnaria () ((\"*\" | \"/\" | \"%\") ExpUnaria ()) *} #Mult\
  \ (> 1)}\nvoid ExpUnaria () #void: {\"(\" Expression () \")\" | Identifier () |\
  \ <INTEGER>}\n```\n\n并且 `example1TreeConstants` 文件将：\n```java\npublic interface\
  \ example1TreeConstants {\n    public int JJTHOME = 0;\n    public int JJTVOID =\
  \ 1;\n    public int JJTSUMA = 2;\n    public int JJTMULT = 3;\n    public int JJTIDENTIFIER\
  \ = 4;\n    public String [] jjtNodeName = {\"Start\",\"void\",\"Sum\",\"Identifier\"\
  };\n}\n```\n\n再次输入相同的字符串，得到如下输出（栈跟踪）：\nStartSumIdentifierSumIdentifier\n\n我们观察到那些重命名为\
  \ `#void` 的非终结节点没有出现在对应的栈中。当我们只想使用对树真正有贡献的节点时，这非常有用，如上所述。\n\n### 5.6.2.2 树的构建 `JavaCC`\n\
  \n尽管 `JavaCC` 是一个自顶部的语法生成器，但 JJTree 从底部构建规则序列的树。为了实现这一点，它使用了一个在生成后存储节点的栈。通过为一组节点分配一个父节点![](img/image_rsrcDFP.jpg)，这些子节点从栈中移除并与父节点关联。只要栈可以访问，就可以执行\
  \ 'push'、pop' 以及任何其他操作。这些方法是自动实现的，因为 JJTree 负责生成上述状态文件（例如 `example1State.java` 和\
  \ `example1bisState.java`）。下面是已生成的一些方法：\n\n```java\nJJTState () {\n    nodes = new\
  \ java.util.Stack ();\n    marks = new java.util.Stack ();\n    sp = 0;\n    mk\
  \ = 0;\n}\nboolean nodeCreated () {\n    return node_created;\n}\nNode rootNode\
  \ () {\n    return (Node) nodes.elementAt(0);\n}\nvoid pushNode (Node n) {\n   \
  \ nodes.push (n);\n    ++ sp;\n}\nNode popNode () {\n    if (--sp < mk) {\n    \
  \    mk = ((Integer) marks.pop()).intValue();\n    }\n    return (Node) nodes.pop\
  \ ();\n}\n```\n\n### 5.6.2.3 节点类型\n\nJJTree 为两种基本节点类型提供了装饰，此外为了方便使用了一些简化。节点是具有定义数量子节点构建的。记住父节点与从栈中获取的一个多个子节点关联并重新插入其中，形成结构的一部分。定义节点可以如下创建：156169\
  \ `#DefiniteNode (INTEGER EXPRESSION)` `EXPRESSION` 可以是任何类型的表达式。常见的是该表达式是一个常量（整数类型）。DefiniteNode\
  \ 是用来指定它之前的节点（非终结节点、函数）的名称。\n\n只要父节点求值为真，就会构建与范围关联的所有子节点。如果不是，该节点就不会创建，将它们之前关联的子节点返回栈。这表示如下![](img/image_rsrcR.jpg)\
  \ `#ConditionalNode (BOOLE EXPRESSION)` `BOOLE EXPRESSION` 可以是任何类型的表达式。与上例一样，节点的名称由\
  \ `ConditionalNode` 给出。这些节点有两种常见的缩写类型：\n- `#IndefiniteNode` 等于 `#IndefiniteNode\
  \ (true)`。\n- `#GTNode (> 1)` 等于 `#GTNode (1)`。\n\n当 `#IndefiniteNode` 后面跟着另一个带有括号的表达式时，会在\
  \ JJTree 中导致歧义情况。在这种情况下，你必须将还原的表达式替换为未还原的版本：`(... ..) #N (a ())` 是一个歧义表达式。相反，你应该使用\
  \ `(... ..) #N (true)`。注意作为参数传递给节点的表达式必须有副作用。JJTree 没有指定它会被评估多少次。默认情况下，JJTree 将每个非终结节点视为未定义节点，并从其产生式派生名称。用户可以使用以下表达式更改此派生名称，如上述在区域所示：`void\
  \ Expuma () #expS: {}{ExpMult () ((\"+\" | \"-\") ExpMult ()) *}`\n\n当解析器识别非终结节点\
  \ `Expuma ()` 时，它从一个名为 `expS` 的未定义节点开始。它被画在栈上，因此在扩展 `Expuma ()` 的非终结节点创建并存储在栈上的任何树解析都将从其移除并成为结构\
  \ `expS` 的一部分。生成的子节点在栈上为 `ExpMult`。如果你想抑制由节点的创建，可以使用以下语法：`void Expuma () #void:\
  \ {}{ExpMult () ((\"+\" | \"-\") ExpMult ()) *}` 1570 现在解析器树存储在栈上的任何由非终结节点 `Expuma\
  \ ()` 生成的节点将留在栈上成为其子节点。这种操作可以默认对于未装饰的节点（没有属性指定）完成，使用 `NODE_DEFAULT_VOID` 选项。这是通过向\
  \ `example1bis.jjt` 的选项区域添加以下代码实现的：\n```java\noptions {MULTI = true;}(image_rsrcDFS.jpg)\
  \ NODE_DEFAULT_VOID = true; }\n```该选项对代码的影响是“保存”每个非终结节点：`:void ExpSum (): {}{ExpMult\
  \ () ((\"+\" | \"-\") ExpMult ()) *}`。使用 `#` 构造函数的另一种代码方法是下一个：`void Expuma () #void:\
  \ {(ExpMult () ((\"+\" | \"-\") ExpMult ()) *} #Sum (> 1)}` `Expuma ()` 节点将具有一个多个名为\
  \ `Sum` 的子节点。`#Sum` 构造函数是条件类型，并表示其元数大于 1。使用条件类型由于不知道有多少个非终结节点要生成后后缀形式的句子，作用域对应于紧接它的扩展单元。\n\
  \n### 5.6.3 节点的作用域和用户操作 15871\n\n每个节点都与一个作用域关联。为了访问节点，用户定义的访问必须与节点相同的作用域，此外，必须使用特殊的\
  \ `jjThis` 方法来引用它。该标识隐式声明如下：\n```java\nSimpleNode Start (): {}{Expression () \"\
  ;\";{return jjtThis; }\n``` 171 通过这种方式更容易访问想要访问的节点的字段和方法。该标识始终返回节点的作用域。作用域是紧接节点的扩展单元（装饰节点\
  \ `）；例如，它可以是括号中的表达式。当产生式被装饰时（可能是默认节点），作用域是产生式的右部分，包括声明块。你也可以使用 `jjThis` 方法，将其作为引用部分的参数。基于我使用的语法的示例如下：\n\
  ```java\nvoid ExpUnaria (): {} {\"(\" Expression () | Identifier () | <ENTER>}\n\
  void Identifier () #Identifier: { Token token;}{ token = <IDENTIFIER> {jjtThis.setName\
  \ (token.image); }}\n```![](img/image_rsrcDFT.jpg) ![](img/image_rsrcU.jpg) 这里 `jjThis`\
  \ 在调用它的节点的作用域内“工作”。所做的修改将对该节点产生影响。这种操作可以通过使用 `NODE_SCOPE_HOOK` 选项完成，默认设置为 false（更多信息请见“节点钩”部分）。在移除屏幕上栈存储的节点时，我们观察到对应\
  \ (a + b) * (c + d) 的输出是：\nStartMultSumIdentifierSumIdentifier\n\n为了更新每个节点的 name\
  \ 字段的值，我们必须实现 `setName()` 方法（或者我们想要的任何其他，如 `setFirstToken()`、`setLastToken()`、`getName()`\
  \ ...）。形式和位置在节点钩区域中解释。用户对节点作用域采取的最终动作是不同的。当代码执行时，节点的子节点从栈中移除并添加到存储在节点本身，在 159javaCC\
  \ 中。可以使用 `jjGetChild()` 方法访问父节点。每个节点属性的访问方法已经实现，如上所述。其他用户操作只能访问栈上的子节点，因为它们还没有父节点。具有节点描述符且求值为假的条件节点不会被添加到栈中，任何子节点也不会添加到其结构中。最终用户在作用域内可以通过调用\
  \ `nodeCreated()` 方法（在 `SimpleNode.java` 中实现）来指定节点是否已创建。如果节点条件满足且节点已创建，则返回 true。\n\
  \n### 5.6.4 处理异常 172\n\n对节点的任何访问或任何错误操作都会导致错误的生成。如果我们修改它们，我们就确定这些方法执行了分配给它们的默认操作。可以是将解析器对象存储在节点中，以便你可以提供解析器生成的所有节点共享的状态。例如，解析器可以维护一个符号表。162175\n\
  \n### 5.6.6 节点的生命周期\n\n节点在生成过程中会经过一系列步骤。从节点本身看到的序列如下：\n1. 调用节点构造函数并带有一个整数整数参数。此参数告诉我们它是什么类型的节点，在简单模式下特别有用。JJTree\
  \ 自动生成一个名为 `parserConstants.java` 的文件并为节点声明常量。此外，声明一个名为 `jjtNodeName` 的字符串数组将整数分配给节点名称。对于我们的示例，文件如下：\n\
  ```java\npublic interface example2 {\n    public int JJTHOME = 0;\n    public int\
  \ JJTVOID = 1;\n    public int JJTSUMA = 2;\n    public int JJTMULT = 3;\n    public\
  \ int JJTIDENTIFIER = 4;\n    public int JJTENTERO = 5;\n    public String [] jjtNodeName\
  \ = {\"Start\",\"void\",\"Mult\",\"Identifier\"};\n}\n```\n2. 调用 `jjOpen()` 方法。如果\
  \ `NODE_SCOPE_HOOK` 选项激活，则调用用户定义的 openScope 并节点作为参数。例如，你可以在节点中存储第一个标记：\n```java\n\
  static void jjtreeOpen (Node node) {\n    ((SimpleNode) node).setFirstToken (getToken\
  \ (1));\n}\n``` 方法必须在主类 example2.jjt 中实现。如果在节点运行时抛出处理器，JJTree 将永远引用该节点。该节点不会关闭，除非使用节点作为参数调用\
  \ closeHook()。否则，如果节点节点求值为假，该节点将被丢弃。`jjClose()` 方法被调用。存储在栈上的节点是定义节点的元数；如果是条件（> 1）定义的，它们添加的顺序是未指定的。\n\
  \n### 5.6.7 执行参数 177\n\nJJTree 为命令行和选项 JavaCC 语句提供了选项：\n`BUILD_NODE_FILES`（默认 true）：为语法中的其他节点生成\
  \ `SimpleNode` 实现。`MULTI`（默认 false）：在多模式下生成解析树。每个节点（非终结节点）创建且未声明为 void，生成名为 `NodeName.java`\
  \ 的文件，其中每个节点继承 `SimpleNode`。这些文件是自动生成的。`NODE_DEFAULT_VOID`（默认 false）：不是创建未装饰输出作为未定义节点，而是创建`NODE_FACTORY`（默认\
  \ false）：使用生成方法构建节点，结构如下：`static Node jjtCreate (int id)` `NODE_PREFIX` (\"AST\"\
  ) 用于在多模式下从节点 id 构建节点类名。默认自动设置的前缀是包含节点实现的文件扩展 `SimpleNode`。`NODE_SCOPE_HOOK`（默认 false）：在每个输入和输出节点作用域上插入用户定义的解析器调用。参见“节点钩子”。`NODE_USERS_PARSER`（默认\
  \ false）：JJTree 将使用节点构造的替代方案。例如：\n```java\nstatic Node MyNode.jjtCreate(MyParser\
  \ p, id);\nMyNode (MyParser p, id);\n``` `STATIC`（默认 true）：为静态解析器生成代码。必须与 JavaCC\
  \ 提供的等选项使用。该选项的值在 Java 源码所示。`VISITOR`（默认 false）：在节点类中插入 `jjAccept()` 方法，并为语法中每个类型的节点生成访问者实现。`VISITOR_EXCEPTION`\
  \ (\"默认 false）：如果该选项激活，则用于 `jjAccept()` 和 `visit()` 方法的结构。注意该选项将在 JJTree 的后续版本中被移除。\n\
  \n### 5.6.8 JTree 中的状态\n\nJJTree 将其状态保存在解析器类名为 `jjtree` 的字段中。该成员的方法可以操作节点的栈。上面讨论了该类的自动生成方法，指示生成的代码存储在哪个文件中。\n\
