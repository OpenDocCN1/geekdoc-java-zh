  \ `E` 所代表表达式的值，即 `E.val`。\n\n### 4.2.2.2 继承属性\n\n继承属性在分析树节点的值是由其父节点的属性和/或兄弟节点的属性定义的。继承属性用于表示构造在所出现环境中对编程语言的依赖关系。例如，你可以使用继承属性来检查句柄出现在赋值的左侧还是右侧，以决定标识符是地址还是值。虽然总是可以通过语法重写直接定义以只使用合成属性，但有时使用带继承属性的语法驱动定义会更自然。\n\
