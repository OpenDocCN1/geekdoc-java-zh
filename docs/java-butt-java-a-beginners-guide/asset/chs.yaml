  \ id T` `{type.id = Type.type;D.type = T.type;}`\n\n## 4.2.2.6 S-属性文法\n\n这是一种仅包含合成属性（synthesized\
  \ attributes）的属性文法。S-属性文法也是 L 属性文法。由于语法树是在语法分析过程中构建构建的，因此合成属性可以使用自底向上的解析器进行求值。解析器可以将与语法符号相关的合成属性值保存在它的栈中。每当完成一次归约（reduction）时，就会根据所归约的产生式右侧语法符号在栈上出现的属性，计算出新的合成属性值。\n\
