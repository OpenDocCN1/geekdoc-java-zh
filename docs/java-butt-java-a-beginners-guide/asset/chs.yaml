  \ 和 `GenerateCondition` 函数，这些函数接收相应的参数，使得第 119 到 134 行的规则变得更加紧凑清晰。\n\n第 13 行紧邻先行项类型声明的\
  \ `% union` 为语法的终结符和非终结符建立了属性框架。需要注意的是，`% union` 有多个具有相同类型（`char [21]`）的字段，但名称不同：`number`、`variable_aux`、`label_aux`\
  \ 和 `next_label`，就像两个内部结构相同的记录（两个字符字符串）：`second_block` 和 `case_block`。这是因为尽管它们在结构上一致，但在语义上它们有不同的目标，因此选择用不同的名称来复制它们。这从效率的角度来看没有影响，因为\
  \ `% union` 占据的空间是相同的。\n\n最后，作为标记 `NUMBER` 的属性，字段类型为 ![](img/image_rsrcDKM.jpg)\
  \ ![](img/image_rsrcDKN.jpg) 文本而不是整数数值值，因为我们的目的是生成三元组，并且不对这些值本身进行算术运算。此外，第 119 行的语义动作强制所有数字字面量通过直接赋值的三元组通过临时变量进行管理。\n\
  \n## 8.4.6 使用 JFlex / Cup 的解决方案\n\nJFlex 和 Cup 的解决方案与上述提供的 Lex 和 Yacc 解决方案非常相似。JFlex\
  \ 的唯一区别在于必须由它负责为终结符 `IF`、`WHILE`、`REPEAT` 和 `CASE` 分配必要的标签，因为在 Cup 的中间动作中无法修改属性。\
  \ \n\n为了让这一点更明显，JFlex 代码有一个 `static` 函数，允许生成标签（带有前缀 `etqL` 以区分于 Cup 生成的，后者的前缀为 `etqY`），因为\
  \ JFlex 动作无法访问在 Cup 中声明的函数定义。因此代码保持如下：\n\n```java\nimport java_cup.runtime.*;\n\
  import java.io.*;\n%%\n{\n    int currentline = 1;\n    private static int actualEtq\
  \ = 0;\n    private static String newEtq () {\n        return \"etqL\" + (++ currentEtq);\n\
  \    }\n}\n% unicode\n% cup\n% line\n% column\n% state COMENT\n%%^ [b¯ / \\ t] *\
  \ \"*\"\n{\n    yybegin (COMENT); \n}\n<COMMENT>. + {; }\n<COMMENT> \\ n {currentLine\
  \ ++; yybegin (YYINITIAL); }\n\"+\" {return new Symbol (sym.MAS); }\n\"*\" {return\
  \ new Symbol (sym.POR); }\n\"/\" {return new Symbol (sym.ENTER); }\n\"-\" {return\
  \ new Symbol (sym.LESS); }\n\"(\" {return new Symbol (sym.LPAREN); }\n\")\" {return\
  \ new Symbol (sym.RPAREN); }\n\"{\" {return new Symbol (sym.LKEY); }\n\"}\" {return\
  \ new Symbol (sym.RLLAVE); }\n\";\" {return new Symbol (sym.POINTYCOMA); }\n\":\"\
  \ {return new Symbol (sym.DOSPOINTS); }\n\":=\" {return new Symbol (sym.ASIG); }\n\
  \">\" {return new Symbol (sym.MAJOR); }\n\"<\" {return new Symbol (sym.MENOR); }\n\
  \"=\" {return new Symbol (sym.EQUAL); }\n\">=\" {return new Symbol (sym.MAI); }\n\
  \"<=\" {return new Symbol (sym.MEI); }\n\"!=\" {return new Symbol (sym.DIF); }\n\
  CASE {return new Symbol (sym.CASE); }\nOF {return new Symbol (sym.OF); }\nCASE {return\
  \ new Symbol (sym.CASE, newEtq ()); }\n![](img/image_rsrcDKP.jpg) OTHERWISE {return\
  \ new Symbol (sym.OTHERWISE); }\nREPEAT {return new Symbol (sym.REPEAT, newEtq ());\
  \ }\nUNTIL {return new Symbol (sym.UNTIL); }\nIF {return new Symbol (sym.IF, newEtq\
  \ ()); }\nTHEN {return new Symbol (sym.THEN); }\nELSE {return new Symbol (sym.ELSE);\
  \ }\nWHILE {return new Symbol (sym.WHILE, newEtq ()); }\nDO {return new Symbol (sym.DO);\
