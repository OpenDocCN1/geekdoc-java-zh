  \n### 3.5.4 自底向上分析概述\n\n在详细介绍不同类型的自底向上分析之前，研究它们所有类型共同拥有的概念和方法论是比较方便的。自底向上分析的目标是从下往上构建语法树，即从标记（tokens）开始到初始公理（initial\
  \ axiom），这与自顶向下的情况相比，它减少了误用规则的次数（如果我们指的是考虑回溯的情况的话），或者拓宽了可以分析的文法范围（如果我们说的是 `LL(1)`\
  \ 情况）。\n\n无论是否存在回溯，在任何给定时刻，输入字符串都将被分为两个部分，称为 `α` 和 `β`：\n* `β`：代表通过 `consume: β0T`\
  \ 消耗的输入字符串块（标记序列）。它始终与输入字符串右侧部分的某一部分重合。可以假设，起初 `β` 与待完全识别的字符串（包括结束符 `EOF`）重合。\n\
  * `α`：始终匹配输入字符串的剩余部分，即它们反向应用某些产生式规则的块：`α0(NcT)`。\n\n例如，如果我们想要识别 `\"id + id + id\"\
  `，从图 3.3 的文法开始，语法树将从空树（`α = g`）开始构建，并消耗整个输入字符串（`β = id + id + id`）。在消耗第一个标记 `:`\
  \ 之后，现在我们可以反向应用规则 `æ`，使得 `α` 变为 `F:`，现在可以应用规则 `Ñ`，产生 `:`。这样，树就一点点构建起来。如所示，`α` 代表了从上方观察正在向上构建的语法树：`α`\
  \ 是一个上升的句型。\n\n#### 3.5.4.1 自底向上分析器中的操作\n\n当解析器构建树时，它会面对不同的配置（称为 `α-β` 对配置），并必须对下一步要执行的操作做出决定。基本上，它有四种不同的操作，每种类型的自底向上解析器根据何时应用这些操作的“智能性”与其他区分开来。任何自底向上分析机制都由从初始配置开始并逐渐应用操作组成，每个操作都允许从一个源配置到另一个目标配置。当目标配置使得\
  \ `α` 代表完整的语法树且 `β` 已消耗了所有标记时，过程结束。可用的操作如下：\n\n1. **ACCEPT（接受）**：字符串被接受：`β / EOF`\
  \ 和 `α / S`（初始公理）。\n2. **REJECT（拒绝）**：输入字符串无效。\n3. **Reduce（归约）**：由将产生式规则反应用于位于\
  \ `α` 最右端的某些元素组成。例如，如果我们有设定：\n    `α / [XX ... X1 two p + 1 p X ... X m ] -β / [a\
  \ ... am + 1] n`（记住 `X0(NcT) ya0T`），并且存在形式为 `i A -> 6kp + 1X ... Xm` 的规则，那么通过该规则进行的归约就是进入配置：\n\
  \    `α / [XX ... X1 two k p T O] -β / [a ... am + 1] n`。\n    通过 epsilon 规则进行归约是可行的，也就是说如果我们从设定开始：\n\
  \    `α / [XX ... XX1 two p p + 1 ... X] -β / [a ... a]m m + 1 n`可以通过形式为 `A -> 6k`\
  \ 的规则进行归约，得到：\n    `α / [XX ... XX1 two p p + 1 ... X km T O] -β / [a ... am + 1]\
  \ n`。\n4. **Move（移位）**：它仅删除 `β` 中最左边的终结符并放在 `α` 的右侧。例如，如果我们有配置：\n    `α / [XX ...\
  \ XX1 two p p + 1 ... X] -β / [aa ... a]m m + 1 m + 2 n`\n    偏移将变为：\n    `α / [XX\
  \ ... XX1 two p p + 1 ... X a] -β / [a ... a]m m + 1 m + 2 n`。\n\n简而言之，通过归约和移位，我们必须接受或拒绝输入字符串。在进行位移之前，我们必须对\
  \ `α` 进行所有可能的归约，因为这些归约是在 `α` 的右侧进行的，而不是中间。当 `α` 是初始公理且 `β` 是空带（仅包含 `EOF`）时，输入字符串被接受。当\
  \ `β` 不是空带或 `α` 不是初始公理且没有规则可以应用时，链结束。\n\n### 3.5.5 带有回溯的向上分析\n\n与自顶向下的情况一样，这种类型的分析尝试使用暴力法测试所有可能的操作（归约和移位），直到达到语法树，或者耗尽所有选项（在这种情况下字符串被拒绝）。算法如下：\n\
  \n**前提**：`α0 (NcT)` 和 `β0T`\n\n**带回溯的向上分析 (α, β)**：\n```\n对于 P 中的每个 p 执行:\n    如果\
  \ (p) / tail(α):\n        α'-β' = reduce α-β by rule i\n        If α / S:\n    \
  \        Sentence recognized! (ACCEPT)\n        Else:\n            AscendingWithBackward\
  \ Analysis (α ', β')\nEnd for\nIf β α:\n    α'-β' = displace α-β\n    AscendingWithBackward\
  \ Analysis (α ', β')\n```\n而主调用将是：\n```\nAnalysisAscendantWithBackspace (g, string)\n\
  If Yes:\n    Acknowledged!\nElse:\n    Sentence not recognized (REFUSE)\nEnd\n```\n\
  正如读者将体会到的，该算法在具有 epsilon 规则的文法之前不会结束（即允许空字符串作为语言的一部分被识别）。这是因为 epsilon 规则总是可以反向应用的，导致无限的向上分支。例如，无论链被识别，让我们回到表\
  \ 3.1 的文法，查看识别 `\"id * id\"` 的过程：\n\n| Rule stack | α | β | Action |\n| :--- | :---\
  \ | :--- | :--- |\n| g | Y | | Displace |\n| go | * id | Reduce by F -> id |\n|\
  \ 5 | F | * id | Reduce by T -> F |\n| 5-4 | T | * id | Reduce by E -> T |\n| 5-4-2\
  \ | AND * | Displace |\n| 5-4-2 | E * | go | Displace |\n| 5-4-2 | E * id | g |\
  \ Reduce by F -> id |\n| 5-4-2-5 | E * F | g | Reduce by T -> F |\n| 5-4-2-5-4 |\
  \ T | g | Reduce by E -> T |\n| 5-4-2-5-4 | E | g | Backspace |\n\n### 3.5.6 LR\
  \ 文法的自底向上分析\n\n在本节中将引入一种用于处理广泛类无关文法的有效语法分析技术。该技术称为 `LR(k)`。输入字符串从左到右检查，而 `R` 表示通过最右推导（rightmost\
  \ derivation）反向提供语法树。最后，`k` 指决定是归约还是移位的向前标记数量。省略时假设 `k=1`。\n\nLR 分析非常有吸引力，原因有几点：它可以识别使用上下文文法生成的绝大多数编程语言。这些分析器的操作方法的优势在于几乎在错误发生的同时就能定位错误源，而不是通过回溯等程序。该方法的缺点是，对于典型的语言，手动构建\
  \ LR 解析器是必要的，因此需要使用自动生成器。幸运的是，有几种生成器。以后我们将学习它们的设计和使用：`Yacc` 和 `Cup`。使用 `Yacc` 或\
  \ `Cup`，你可以自动生成其解析器。如果文法包含歧义或难以理解的构造，编译器可以定位问题规则并报告它们。\n\n这种技术与 `LL(1)` 类似，其操作基于与文法唯一关联的特殊表。构建该表有几种技术。第一方法\
  \ `Simple LR (SLR)` 最容易应用但最不利。第二方法 `Canonical LR` 最强大但开销最大。第三方法 `LALR` 适用于大多数编程语言，并且可以用很小的精力高效地实现。基本上，一种方法优另一种取决于它可以应用的文法数量。支持的文法范围越广，该方法越强大。\n\
  \n从功能上来说，一个 LR 分析器由两个不同的部分组成：a) 程序和 b) 分析表。如下所示，过程程序有一个简单的操作，并且在分析器之间保持不变。根据文法，分析表是完全标识分析器的那个。图中显示了\
  \ LR 分析器通用结构的概图。从图中可以看出，解析器处理以 `$` 符号结束的输入字符串。该链从左到右读取，单符号识别使得做出决策成为可能。\n\n此外，算法使用形式为\
  \ `s X s X ... X0` 的栈，其中符号 `s` 在位于所示。每个 `X` 是文法符号 `(NcT)`，状态代表栈中并放在自身状态之前的信息。`0`\
  \ 代表初始状态且没有关联符号。查询栈顶的状态和输入中的下一个标记可以决定进行哪种归约或是否移位。\n\n作为通用规则，LR 识别器的分析表包含两个任务：转移到另一个状态的任务\
  \ (`GOTO`) 和要采取的操作的任务 (`ACTION`)。`GOTO` 表的形式为 `E × {states}` 并包含 `E` 的状态，而 `ACTION`\
  \ 的形式为 `E × (terminal)` 并包含我们在 3.5.4 节看到的四种操作之一。假设在任何给定时刻栈顶的状态为 `s`，当前标记为 `a`，LR\
  \ 解析器通过重复应用以下步骤直到接受或拒绝输入字符串：\n\n1. 咨询 `ACTION` 表中的项 `(s, a)`。内容可以是接受、拒绝、移位或归约。\n\
  2. 一旦上一个过程完成，栈顶有一个符号和一个状态（顺序如下），这将为我们提供 `GOTO` 表中的一个项。该项的内容被放在栈顶。\n\n形式上，LR 分析器的配置被定义为上述方式的一个对：`(s\
  \ X s X ... X s, aa ... a $0)`，其中第一部分是栈的当前内容，第二部分是待识别的输入子串，即预测标记。我们将从这个通用配置开始后续研究。\n\
  \n\n\n\n| 0 T-2 * -7 F-10 | $ | R3-2 |\n| 0 T-2 | $ | R2-1 |\n| 0 E-1 | $ | Accept\
  \ |\n\n请注意，使用这种方法，栈承担了 `α` 的功能。在插入状态的存在上的差异在于：栈底部有一个初始状态，且 `α` 的每个符号都有与其关联的状态。另请注意，当通过规则进行归约时，相同的推导结果与\
  \ `α` 的最右侧重合。\n\n### 3.5.6.1 关于 LR 分析的考虑 (1)\n\n在构建 `Translator` 过程中应该采取的首要步骤之一是正确选择该语言所识别的文法。这不是一个简单的步骤，因为尽管通常情况下存在许多等价文法，但在实际应用中，等价文法之间的行为差异具有特殊的特殊性。本节提供了关于如何正确选择的一些概念。\n\
  \n| 0 T-2 * -7 (-4 T-20 T-2 * -7 (-4 E-80 T-2 * -7 (-4 E-8 + -60 T-2 * -7 (-4 E-8\
  \ + -6 id-50 T-2 * -7 (-4 E-8 + -6 F-30 T-2 * -7 (-4 E-8 + -6 T-90 T-2 * -7 (-4\
  \ E-80 T-2 * -7 (-4 E-8) 11 | 78 | + id) $+ id) $ id) $) $) $) $) $$ | R2-8D-6D-5R6-3R4-9R1-8D-11R5-10\
  \ |\n\n\n\n\n\n![](img/image_rsrcDD9.jpg) 语法法。 3.5.6.1.1 左递归或右递归\n\n最基本的方法之一是决定使用左递归规则还是右递归规则。例如，为了识别由逗号分隔的标识符序列，如\
  \ `id, id, id`，可以在两种不同的文法之间进行选择：\n\na) `list ⌋ ID to list ',' ID`\nb) `list ⌋ ID\
  \ to | ID ',' list`\n\n嗯，当识别一个句子时，我们可以观察到获得了非常不同的树，正如图 `3.26` 中通过识别“go, Yo hice”所示。相反，如果我们应用\
  \ `LR` 识别，所执行的步骤序列会有径然不同：在 `b)` 情况下，它们会一个接一个地顺序移动整个链标记，最后根据链的长度连续进行几次归约；在 `a)` 情况下，几个标记（逗号和一个\
  \ `ID`）会被移动并由 `⌤` 归约，依此类推进行位移和归约。\n\n通过这样，使用右递归时，栈 `α` 的大小会不断增加直到开始归约。因此，在足够大的标识符列表面前可能会发生溢出。最方便的方法是使用左递归文法，使栈的大小保持稳定。在绝对需要右递归的情况下（这些情况中的某些将在第\
  \ 7992 章句法分析中介绍），应避免提供可能产生溢出的过长链。\n\n![](img/image_rsrcDDA.jpg) 图 `3.26`。等价文法对同一句子的识别：a)\
  \ 左递归，b) 右递归\n\n### 3.5.6.1.2 冲突\n\n当解析器无法为文法生成语法检查时，就会发生冲突。基本上有两种冲突：\n\n- **移进/归约**\
  \ (`Shift / Reduce`）。它们通常由于歧义文法引起。\n- **归约/归约** (`Reduce / Reduce`）。因为文法不接受 `LR(k)`\
  \ 分析。\n\n`移进/收缩` 冲突出现在动作表中。在同一个单元格中既有用于归约的 `R` 也有用于位移的 `D`，冲突在于程序不知道该归约还是位移。例如，这样一个简单的文法如下：\n\
  \n```\nEXPR ⌋ EXPR '+' EXPR\n```\n\n![](img/image_rsrcDDA.jpg) 图 `3.27`。歧义示例 8093\n\
  \n显然是歧义的（它同时是左递归和右递归），因此在处理像 \"num + num + num\" 简单的输入之前，可以产生两个不同的语法树（见图 `3.27`）。\n\
  \n另一方面，`归约/归约` 冲突出现在分析器对某些情况可以使用两个或多个规则时。这种情况通常出现在文法不是 `LR(1)`，即前瞻标记不足以做出采取什么动作的决定。例如，假设文法为：\n\
  \n```\nS ⌋ aaBdd | aCdd\nB ⌋ aN\nC ⌋ yy\n```\n\n只能识别标记序列 \"aaadd\" 和 \"aaad\"。嗯，如此简单的文法不是\
  \ `LR(1)`（见图 `3.28`）。假设在图中 ![](img/image_rsrcDDB.jpg) ![](img/image_rsrcDDC.jpg)\
  \ 你想识别序列 \"aaad\";在这种情况下，正确的做法是通过 `N` 进行归约。然而，这完全取决于在前瞻标记（一个“d”）之后是另一个另一个“d”还是我们遇到了\
  \ EOF。一个 `LR(2)` 解析器能够做出正确的决定，但 `LR(1)` 则不能。\n\n图 `3.28`。归约/归约冲突示例。问号表示分析器不知道接下来是什么。\n\
  \n`归约/归约` 冲突在大多数情况下是可以消除的。通过在最后时刻延迟归约决定来实现。例如，文法：\n\n```\nS ⌋ aaadd | aaadis\n```\n\
  \n与上一个等价，但它是 `LR(1)`，因为只有在末尾的 EOF 之前才决定归约，此时它将根据已完全读取的标记处于正确的状态。\n\n### 3.5.6.2\
  \ 关于 LR 分析的结论 (1)\n\n在标题 `3.5.6` 中，我们通过使用相应的分析表研究了 `LR` 分析器的工作原理。在最后一个示例中可以观察到，位于栈顶的状态始终包含归约（如果进行的话）所必需的信息。此外，我们特意省略了过程程序的结构，因为它本质上是一个带栈的有限自动机。\n\
  \n总来说，可以说明，给定 `LR` 分析器的结构，通过检查输入字符串中最后一个消耗标记右侧的 `k` 个符号，就可以精确决定执行什么动作（归约、位移等）。这就是为什么这种文法通常被称为\
  \ `LR(k)` 的原因。正如已经提到的，在实践中几乎所有的编程语言都可以使用 `LR(1)` 文法进行分析。\n\nKnuth 在 1965 年设计的 `LR(1)`\
  \ 表对于传统编程语言文法来说太大了。1969 年，De Remer 和 Korenjack 发现了紧凑这些表的方法，使得这种类型的分析器变得实用且可管理。应用于这些表的算法与之前看到的相同。我们\
  \ true 三种主要类型的 `LR(k)` 文法，它们根据能力相互包含而有所不同，形式如下：\n\n- `SLR(k)`\n- `LALR(k)`\n- `LR(k)`\n\
  \n但它们各自对应的语言在集合上并不匹配，也就是说，如果存在一个识别语言 `L` 的 `LR(1)` 文法，也存在一个识别语言 `L` 的 `SLR(1)` 文法。Knuth\
  \ 在 1965 年设计的 `LR(1)` 表对于传统编程语言文法来说太大了。1969 年，De Remer 和 Korenjack 发现了紧凑这些表的方法，使得这种类型的分析器变得实用且可管理。\n\
  \n\n\n\n\n| 产生规则 | 关联语义动作 |\n| :--- | :--- |\n| `E ÷ E + Tone two` | `{E = E + T;one\
  \ two}` |\n| `E ÷ T` | `{E = T;}` |\n| `T ÷ T * Fone two` | `{T = T * F;one two}`\
  \ |\n| `T ÷ F` | `{T = F;}` |\n| `F ÷ (E)` | `{F = E;}` |\n| `F ÷ num` | `{F = NUM;}`\
  \ |\n\n\n\n\n这些操作在每当通过关联规则进行语法规约时都必须执行。根据带有递归函数的解析器的操作方式，就像每个函数都返回一个代表其作为根结的子树的值。LR\
