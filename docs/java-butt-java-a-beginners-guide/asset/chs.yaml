  \ 127 行声明的标签可以合并为一个，因为其中两个永远不会同时使用；为了提高代码的可读性，没有进行这种合并。\n\n# 第 9 章：运行时内存管理\n\n##\
  \ 9.1 执行期间的内存组织\n正如在前几节注释过的，为了让程序在操作系统上运行，必须存在一个加载器（loader），它为程序提供一块连续的内存以供执行。因此，由编译生成的程序代码必须组织成利用该内存块的形式，因此编译器必须在目标程序中包含其运行所需的所有代码。\n\
  \n程序执行期间的内存管理技术在不同语言之间、甚至在不同编译器之间也不同。本章研究了`Fortran`、`Pascal`、`C`、`Modula-2` 等命令式语言中的内存管理。其他类型语言（函数型、逻辑型等）的内存管理通常与此处出现的组织方式不同。\n\
  \n对于命令式语言，编译器生成的程序在运行时的内存组织（大致）类似于图 9.1 所示。![](img/image_rsrcDM1.jpg) 在图中，以下部分为：\n\
  - 代码区\n- 固定大小数据区 (Fixed Size Data Zone)\n- 栈 (Stack or stack)\n- 堆 (Heap or heap)\n\
  \n**图 9.1. 编译程序执行时的内存结构**\n\n## 9.2 代码区\n这是可执行程序的指令以机器码存储的区域，同时也包含了你使用的过程和函数对应的代码。其大小和内容在编译时确定，因此说它的大小在运行时是固定的。\n\
  \n这样，编译器在生成代码时，会将代码顺序放置在该区域内，并方便地界定每个函数、过程和主程序（如果有，如在`Pascal` 或`Modula-2` 等语言中常见的情况）。\n\
  \n最终的可执行程序将由该区域以及关于运行时数据内存需求的信息组成，包括固定大小块和动态数据块大小的估计。这些信息将在加载器（链接器）在将可执行文件加载到主内存时使用，以便进行程序的执行。\n\
  \n### 9.2.1 覆盖（Overlays）\n当可用主内存小于完整程序大时，某些编译器使用![](img/image_rsrcDM2.jpg) 覆盖（overlay）或“分段”（flaps）将目标程序代码分。这些覆盖是存储在独立文件中的对象代码段并在动态加载到中央内存中，即在程序执行期间加载。它们被称为“分段”，是因为两个覆盖可以在不同时刻占用同一块内存，产生重叠。为了使内存使用更高效，程序的覆盖部分被分组为区域和模块，每个模块都包含一组完整的函数或过程。图\
  \ 9.2 显示了若干个部分是如何定位的。\n\n**图 9.2. 在静态内存不同区域使用覆盖的代码区配置示例**。\n\n在运行时，每个覆盖区只能有一个覆盖部分存储在主内存中。编译器在代码段中为每组覆盖留出一个连续的内存区域。该区域的大小必须等于加载其上的最大模块的大小。\n\
  \n程序员负责确定定义多少个覆盖区、每个覆盖模块中封装了哪些函数和过程，以及如何组织这些模块以占据每个覆盖区。需要注意的限制是，模块的函数不应引用同一覆盖中另一个模块的函数，因为它们永远不会同时在内存中。显然，带有覆盖的结构化程序的执行时间高于没有覆盖且所有代码都留在内存中的程序，因为在程序执行期间，当调用其包含的任何函数时，都必须加载每个模块。程序员的任务是设计覆盖结构，以尽可能减少这些操作的次数。覆盖技术不仅用于待编译程序相对于系统可用内存非常大的情况，还用于当你希望在内存较低的情况下获得必须与其他操作系统共存的较小程序时。\n\
  \n## 9.3 数据区\n程序处理的数据目前分为三个大块：\n1. 一个专门用于存储任何代码行均可访问的全局变量。此块是`永久固定大小数据区` (Size Data\
  \ Zone Permanent)。\n2. 另一个专门用于存储每个函数和过程的局部变量。它们不能存储在前一个块中，主要有两个原因：a) 在调用函数之前没有必要存储其变量，且在执行完成后即可释放；以及\
  \ b) 在递归函数执行期间，必须存储多个局部变量的实例，具体取决于对该同一函数的调用次数。此块是栈（the battery）。![](img/image_rsrcDM3.jpg)\n\
  3. 最后一个块专门用于存储用户通过 `malloc` / `free`、`new` / `dispose` 等直接管理的内存块。这些任务所需的内存量随程序运行而异，且所在的数据不属于任何函数的局部，而是持续到释放。此块是`堆`\
  \ (Heap)。\n\n### 9.3.1 固定大小数据区\n运行时内存存储变量内容最简单的方法是在整个程序执行期间使用静态或永久内存。并不是所有对象（变量）都可以静态存储。对象要存储在静态内存中，其大小（存储所需的字节数）必须在编译时已知。由于此限制，以下无法存储在静态内存中：\n\
  - 递归过程或函数的局部变量，因为编译时不知道需要的次数。\n- 动态数据结构，如列表、树等，因为直到程序运行时才知道其形成的元素数量。\n\n因此，函数的局部变量是定义大小的数据，但对于那些取决于作用域出现次数的情况，则需要根据某些动态标准进行存储。同样无法在此区域存储动态结构，即通过指针动态空间创建的结构：动态列表、动态图等。这些数据的大小是不确定的，因此无法保存在固定大小数据区。虽然可能认为递归函数的代码大小也取决于自调用的次数，但事实并非如此：要执行的指令总是相同的，改变的是你操作的数据，即局部变量。静态内存分配技术是直观的，正如![](img/image_rsrcDM4.jpg)\
  \ 图 9.3 所示。\n\n**图 9.3. 全局变量 X 的内存分配**\n\n（固定数据区边界）全局变量 `X` 存储在此，指针移动存储该变量所需的字节数。换句话说，每个变量都分配了一个地址和一段根据其类型对应的内存；这些部分从固定大小数据区的开始顺序放置。例如，如果我们发现\
  \ Modula-2 的语句：\n```modula\na, b: INTEGER; c: ARRAY [1..20] OF REAL; c: CHAR; d:\
  \ REAL;\n```\n并且假设 `INTEGER` 占用 2 字节，`REAL` 占用 5 字节，`CHAR` 占用 1 字节，且假设数据区的起始位于 `0000h`\
  \ 位置（该地址相对于 `DS` 数据段，该段可以指向任何内存地址，并将由加载器方便地初始化），那么我们得到地址和大小分配：\n\n\n\n\n\n| 变量 |\
  \ 大小 | 起始方向 |\n| :--- | :--- | :--- |\n| to | 2 bytes | 0000h |\n| b | 2 bytes |\
  \ 0002h |\n| c | 100 bytes | 0004h |\n| d | 1 byte | 0068h |\n| and | 5 byte | 0069h\
  \ |\n\n这种内存分配是在编译时完成的，对象从程序执行开始到结束期间都是有效且可访问的。每个全局变量关联的方向是固定的，并且相对于数据段，也就是说，从程序加载的内存起始点开始，该方向始终保持相同（该起始点在不同执行之间可能会有所不同）。\n\
  \n在允许子程序的语言中，只要这些小程序的所有对象都可以静态存储（例如在不允许递归的 Fortran-IV 中），就会在静态内存中存储一个与每个子程序对应的激活记录（activation\
  \ record），其结构如图 9.4.a) 所示。这些激活记录将包含局部变量、形式参数和函数返回的值，并如图 9.4.b) 所示，线性分布在固定大小的数据区域中。\n\
  \n在每个激活记录内部，局部变量被组织成序列。每个过程只有一个激活记录，因此不允许递归调用。当过程 `P` 调用另一个过程 `Q` 时，遵循的过程如下：\n\n\
  \n\n\n`P`（调用者）评估实际的调用参数，以防尝试复杂的表达式，并使用一个用于缓冲的临时内存区域。例如，如果对 `Q` 的调用为 `\"Q ((3 * 5)\
  \ + (2 * 2), 7)\"`，则机器码中调用本身之前的操作必须在某些临时内存区域上执行。\n\n运行时内存管理（在某个点，必须有一个内存区域，其中包含中间值\
  \ `15` 和中间值 `4`，以便于在下方对它们进行相加）。在静态内存利用的情况下，该临时区域可以由整个程序共用，因为它的大小可以在编译时被减去。\n\n`Q`\
  \ 初始化其变量并开始执行。由于变量永久存储在内存中，因此很容易实现每个变量在每个新调用中是否保留其内容的属性（类似于 C 语言中 `static` 修饰符的行为）。\n\
  \n图 9.4。与非递归函数相关的激活记录结构。每个函数或过程都有一个不同大小的关联激活记录，这取决于它拥有多少个局部变量、返回值的类型等。\n\n### 9.3.2\
  \ 栈 (Stack)\n\n具有块结构的语言是由模块或代码段组成的，其执行是顺序的；这些模块反过来可以在其指令序列中包含对其他模块的调用，而这些模块有时又可以调用其他子模块，依此类推。\n\
  \n这类语言的出现带来了对更灵活的内存托管技术的需求，这些技术能够适应程序执行期间由于递归调用对内存的需求。在这些语言中，每当一个过程开始执行时，就会产生一个包含其执行所需的对象的激活记录，并在完成后将其消除。\n\
  \n在递归调用期间，只有最后一个被调用的过程在运行，而调用者序列则处于“休眠”状态。这意味着，当被调用的函数结束时，它们必须按照调用序列的反序重新激活调用过程。\n\
  \n出于这个原因，与每个块相关的不同激活寄存器必须放置在一个栈中，它们在块执行开始时进入栈，并在结束时退出。激活记录的结构在不同语言之间不同，甚至在某些编译器之间也不同，这正是有时难以链接两个不同编译器生成的代码的问题之一。通常，过程激活记录通常包含图\
  \ 9.5 所示的某些字段。\n\n图 9.5。支持递归的语言中激活记录的完整结构\n\n内容存储在对应于在开始进程之前微处理器寄存器中机器状态的区域。这些值必须在执行结束时被替换。负责复制机器状态的代码对所有过程都是通用的。\n\
  \n指向父级激活记录的指针允许访问该人员所涉及的其他过程内部声明的变量。该激活记录属于这些过程。例如，假设有如下的程序块：\n\n```\nPROCEDURE\
  \ A1\nVAR A1_a, A1_b: INTEGER;\nPROCEDURE B1\nVAR B1_c, B1_d: INTEGER;\nBEGIN...END\
  \ B1;\nPROCEDURE B2\nVAR B2_e, B2_f: INTEGER;\nPROCEDURE C2\nVAR C2_g, C2_h: INTEGER;\n\
  BEGIN...CALL B1;...END C2;\nBEGIN...CALL C2;...END B2;\nBEGIN (* 主程序 *)...CALL B2;...END;\n\
  ```\n\n使用指向父级激活记录的指针是因为一个过程可以使用其被声明所在过程的局部变量。在这个例子中，`C2`可以使用变量：`C2_g` 和 `C2_h`（它们是自己的）。`B2_e`\
  \ 和 `B2_f`（来自它们的父级，即声明 `C2` 的那个过程）。`A1_a` 和 `A1_b`（来自它们的父父级），但它不能使用 `B1_c` 或 `B1_d`，因为\
  \ `C2` 没有嵌入在 `B1` 中。\n\n与固定大小的数据区一样，触发日志包含用于存储实际参数（与标头中出现的变量关联的值）和局部变量（在块或过程内部定义的变量）的空间，以及一个用于存储函数返回值的区域和一个用于表达式中间值计算的临时值区域。\n\
  \n任何两个不同的块或过程通常具有不同大小的激活记录。这种大小通常在编译时是已知的，因为关于组成它的对象所占空间有足够的信息。在某些情况下并非如此，例如在 `C`\
  \ 中使用不确定长度的数组。在这些情况下，激活记录必须在结尾包含一个溢出区域，其大小在编译时不固定的，只有在过程实际运行时才确定。这使得内存管理变得复杂了一些，因此某些低成本编译器移除了这一功能。\n\
  \n虽然在进行递归调用时保存连续版本的数据是关重要的，但应用于它们的指令总是相同的，因此这些指令只需要保存一次。然而，显而易见的是，在每次递归调用，相同的代码将与不同的数据工作，因此编译器应该生成为这种可能性准备的代码，不要对变量进行绝对引用（全局定义的变量外，其内存位置在程序执行过程中不会改变），而是根据你的激活记录的起始位置进行相对引用。\n\
  \n当一个 `P` 过程调用另一个过程 `Q` 时，栈管理程序分为两个阶段开发；第一阶段对应于过程 `P` 在转移控制权给 `Q` 之前包含的代码，第二阶段对应于块执行开始时进入栈并在结束时退出的代码。激活记录的结构在语言之间各异，甚至在某些编译器之间也异。示例如下：\n\
  \n```\nPROCEDURE A1\nVAR A1_a, A1_b: INTEGER;\nPROCEDURE B1\nVAR B1_c, B1_d: INTEGER;\n\
  BEGIN...END B1;\nPROCEDURE B2\nVAR B2_e, B2_f: INTEGER;\nPROCEDURE C2\nVAR C2_g,\
  \ C2_h: INTEGER;\nBEGIN...CALL B1;...END C2;\nBEGIN...CALL C2;...END B2;\nBEGIN\
  \ (* 主程序 *)...CALL B2;...END;\n```\n\n1. 任何两个不同的块或过程通常具有不同大小的激活记录。这种大小通常在编译时是已知的，因为关于组成它的对象所占空间有足够的信息。在某些情况下并非如此，例如在\
  \ `C` 中使用不确定长度的数组时。在这些情况下，激活记录必须在结尾包含一个溢出区域，其大小在编译时不固定的，只有在过程实际运行时才确定。这使得内存管理变得复杂了一些，因此某些低成本编译器移除了这一功能。\n\
  \n2. 虽然在进行递归调用时保存连续版本的数据是关重要的，但应用于它们的指令总是相同的，因此这些指令只需要保存一次。然而，显而易见的是，在每次递归调用相同的代码将与不同的数据工作，因此编译器应该生成为这种可能性准备的代码，不要对变量进行绝对引用（全局定义的变量外，其内存位置在程序执行过程中不会改变），而是根据你的激活记录的起始位置进行相对引用。\n\
  \n3. 当一个 `P` 过程调用另一个过程 `Q` 时，栈管理程序分为两个阶段开发；第一阶段对应于过程 `P` 在转移控制权给 `Q` 之前包含的代码，第二阶段对应于块执行开始时进入栈并在结束时退出的代码。\n\
  \n4. 任何两个不同的块或过程通常具有不同大小的激活记录。这种大小通常在编译时是已知的，因为关于组成它的对象所占空间有足够的信息。在某些情况下并非如此，例如在\
  \ `C` 中使用不确定长度的数组时。在这些情况下，激活记录必须在结尾包含一个溢出区域，其大小在编译时不固定的，只有在过程实际运行时才确定。这使得内存管理变得复杂了一些，因此某些低成本编译器移除了这一功能。\n"
