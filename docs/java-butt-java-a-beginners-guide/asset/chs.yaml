  \ `main()` 中通过 `yyparse()` 函数调用解析器：%\n\n```c\n% token ID NUM%%...%%\nvoid main ()\
  \ { yyparse ();\n```\n\n两个空格将由字符 \"b¯ &\" 表示。104117\n\n### 4.3.1.3 规则区域\n这是最重要的区域，因为它规定了构成我们想要识别的语言语法的产生规则。每个规则在语法上都具有形式：`nonTerminal:\
