- md: "\nBuilding a REST API with Spring 4\n\n## 3: SPRING SECURITY FOR A REST API\n\
    \n## 1. Overview\n\nThis section shows how to Secure a REST Service using Spring\
    \ and Spring Security 3.1 with Java based configuration. We will focus on how\
    \ to set up the Spring Configuration specifically for the REST API using a Login\
    \ and Cookie approach.\n\n## 2. Spring Security in the web.xml\n\nThe architecture\
    \ of Spring Security is based entirely on Servlet Filters and, as such, comes\
    \ before Spring MVC in regards to the processing of HTTP requests. Keeping this\
    \ in mind, a filter needs to be declared in the web.xml of the application:\n\n\
    ```xml\n<filter>\n  <filter-name>springSecurityFilterChain</filter-name>\n  <filter-class>org.springframework.web.filter.DelegatingFilterProxy</filter-class>\n\
    </filter>\n<filter-mapping>\n  <filter-name>springSecurityFilterChain</filter-name>\n\
    \  <url-pattern>/*</url-pattern>\n</filter-mapping>\n```\n\nThe filter must necessarily\
    \ be named 'springSecurityFilterChain' to match the default bean created by Spring\
    \ Security in the container.\n\nNote the defined filter is not the actual class\
    \ implementing the security logic but a DelegatingFilterProxy with the purpose\
    \ of delegating the Filter's methods to an internal bean. This is done so that\
    \ the target bean can still benefit from the Spring context lifecycle and flexibility.\n\
    \n## Building a REST API with Spring 4\n\n## 3. The Security Configuration\n\n\
    The URL pattern used to configure the Filter is /* even though the entire web\
    \ service is mapped to /api/* so that the security configuration has the option\
    \ to secure other possible mappings as well, if required.\n\n```xml\n<?xml version=\"\
    1.0\" encoding=\"UTF-8\"?>\n<beans\n  xmlns=\"http://www.springframework.org/schema/security\"\
    \n  xmlns:xsi=\"http://www.w3.org/2001/XMLSchema-instance\"\n  xmlns:beans=\"\
    http://www.springframework.org/schema/beans\"\n  xmlns:sec=\"http://www.springframework.org/schema/security\"\
    \n  xsi:schemaLocation=\"http://www.springframework.org/schema/security\n  http://www.springframework.org/schema/security/spring-security-3.2.xsd\n\
    \  http://www.springframework.org/schema/beans\n  http://www.springframework.org/schema/beans/spring-beans-4.0.xsd\"\
    >\n\n  <http entry-point-ref=\"authenticationEntryPoint\">\n    <intercept-url\
    \ pattern=\"/api/admin/**\" access=\"ROLE_ADMIN\"/>\n  </http>\n\n  <form-login\n\
    \    authentication-success-handler-ref=\"mySuccessHandler\"\n    authentication-failure-handler-ref=\"\
    myFailureHandler\"\n  />\n\n  <logout />\n\n  <bean id=\"mySuccessHandler\"\n\
    \    class=\"org.rest.security.MySavedRequestAwareAuthenticationSuccessHandler\"\
    />\n  <bean id=\"myFailureHandler\"\n    class=\"org.springframework.security.web.authentication.SimpleUrlAuthenticationFailureHandler\"\
    />\n\n  <authentication-manager alias=\"authenticationManager\">\n    <authentication-provider>\n\
    \      <user-service>\n        <user name=\"temporary\" password=\"temporary\"\
    \ authorities=\"ROLE_ADMIN\"/>\n        <user name=\"user\" password=\"user\"\
    \ authorities=\"ROLE_USER\"/>\n      </user-service>\n    </authentication-provider>\n\
    \  </authentication-manager>\n\n</beans>\n```\n\nMost of the configuration is\
    \ done using the security namespace – for this to be enabled, the schema locations\
    \ must be defined and point to the correct 3.1 or 3.2 XSD versions. The namespace\
    \ is designed so that it extends the common uses of Spring Security while providing\
    \ raw beans to accommodate more advanced scenarios.\n\n### 3.1. The <http> element\n\
    \nThe <http> element is the main container element for HTTP security configuration.\
    \ In the current implementation, it only secured a single mapping: /api/admin/**.\
    \ Note that the mapping is relative to the root context of the web application,\
    \ not to the rest Servlet; this is because the entity security configuration lives\
    \ in the root Spring context and not in the child context of the Servlet.\n\n\
    ### 3.2. The Entry Point\n\nIn a standard web application, the authentication\
    \ process may be automatically triggered when the client tries to access a secured\
    \ resource without being authenticated – this is usually done by redirecting to\
    \ a login page so that the user can enter credentials. However, for a REST Web\
    \ Service this behavior doesn't make sense – Authentication should only be done\
    \ by a request to the correct URI and all requests should simply fail with a 401\
    \ UNAUTHORIZED status code if the user is not authenticated.\n\nSpring Security\
    \ handles this automatic triggering of the authentication process with the concept\
    \ of an Entry Point – this is a required part of the configuration, and can be\
    \ injected via the entry-point-ref attribute of the <http> element. Keeping in\
    \ mind that this functionality doesn't make sense in the context of the REST Service,\
    \ the new custom entry point is defined to simply return 401 whenever it is triggered:\n\
    \n```java\n@Component(\"restAuthenticationEntryPoint\")\npublic class RestAuthenticationEntryPoint\
    \ implements AuthenticationEntryPoint{\n    @Override\n    public void commence(HttpServletRequest\
    \ request, HttpServletResponse response,\n    AuthenticationException authException)\
    \ throws IOException {\n        response.sendError(HttpServletResponse.SC_UNAUTHORIZED,\
    \ \"Unauthorized\");\n    }\n}\n```\n\nA quick sidenote here is that the 401 is\
    \ sent without the WWW-Authenticate header, as required by the HTTP Spec – we\
    \ need to set it manually.\n\n### 3.3. The Login Form for REST\n\nThere are multiple\
    \ ways to do Authentication for REST – one of the default Spring provides is Form\
    \ Login - org.springframework.security.web.authentication.UsernameAuthenticationFilter.\n\
    \nThe `<form-login>` element will create this filter and also allow us to set\
    \ our custom success handler on it.\n\n> Note that for a standard web application,\
    \ the auto-config attribute of the <http> element is shorthand syntax for some\
    \ simple security configuration. While it doesn't fit and REST API.\n\n### 3.4.\
    \ Authentication should return 200 instead of 301\n\nBy default, form login will\
    \ answer a successful authentication request with a 302 status code; this makes\
    \ sense in the context of actual login form which needs to redirect after login.\
    \ For a RESTful web service however, the desired response for successful authentication\
    \ should be 200 OK.\n\nThis is done by injecting a custom success handler in the\
    \ login filter, to replace the default one. The new handler implements the exact\
    \ same as the default SavedRequestAwareSuccessHandler with one notable difference\
    \ - the redirect logic is removed.\n\n### 3.5. Failed Authentication should return\
    \ 401 instead of 302\n\nSimilarly – we configured the authentication failure handler\
    \ – same way we did with the success handler.\n\nLuckily – in this case, we don’t\
    \ need to actually define a new class for this handler – the standard implementation\
    \ – SimpleUrlAuthenticationFailureHandler – does just fine.\n\nThe only difference\
    \ is that – now that we’re defining this explicitly in our XML config – it’s not\
    \ going to get a default failureUrl from Spring – and so it won’t redirect.\n"
  mdcn: "\n\n使用 Spring 4 构建 REST API\n\n## 3: 用于 REST API 的 SPRING SECURITY\n\n##\
    \ 1. 概述\n\n本节展示了如何使用 Spring 和 Spring Security 3.1 基于 Java 的配置来保护 REST 服务。我们将重点关注如何使用登录和\
    \ Cookie 方式，为 REST API 专门设置 Spring 配置。\n\n## 2. web.xml 中的 Spring Security\n\n\
    Spring Security 的架构完全基于 Servlet 过滤器（Filters），因此在处理 HTTP 请求时，它运行在 Spring MVC 之前。考虑到这一点，需要在应用程序的\
    \ `web.xml` 中声明过滤器：\n\n```xml\n<filter>\n  <filter-name>springSecurityFilterChain</filter-name>\n\
    \  <filter-class>org.springframework.web.filter.DelegatingFilterProxy</filter-class>\n\
    </filter>\n<filter-mapping>\n  <filter-name>springSecurityFilterChain</filter-name>\n\
    \  <url-pattern>/*</url-pattern>\n</filter-mapping>\n```\n\n过滤器必须命名为 'springSecurityFilterChain'，以匹配\
    \ Spring Security 在容器中创建的默认 bean。\n\n注意，定义的过滤器并不是实现安全逻辑的实际类，而是一个 `DelegatingFilterProxy`，其目的是将过滤器的方法委托给内部\
    \ bean。这样做是为了目标 bean 仍然可以从 Spring 上下文生命周期和灵活性中受益。\n\n使用 Spring 4 构建 REST API\n\
    \n## 3. 安全配置\n\n用于配置过滤器的 URL 模式是 `/*`，尽管整个 Web 服务映射到 `/api/*`，这样安全配置就有权在需要时保护其他可能的映射映射。\n\
    \n```xml\n<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<beans\n  xmlns=\"http://www.springframework.org/schema/security\"\
    \n  xmlns:xsi=\"http://www.w3.org/2001/XMLSchema-instance\"\n  xmlns:beans=\"\
    http://www.springframework.org/schema/beans\"\n  xmlns:sec=\"http://www.springframework.org/schema/security\"\
    \n  xsi:schemaLocation=\"http://www.springframework.org/schema/security\n  http://www.springframework.org/schema/security/spring-security-3.2.xsd\n\
    \  http://www.springframework.org/schema/beans\n  http://www.springframework.org/schema/beans/spring-beans-4.0.xsd\"\
    >\n\n  <http entry-point-ref=\"authenticationEntryPoint\">\n    <intercept-url\
    \ pattern=\"/api/admin/**\" access=\"ROLE_ADMIN\"/>\n  </http>\n\n  <form-login\n\
    \    authentication-success-handler-ref=\"mySuccessHandler\"\n    authentication-failure-handler-ref=\"\
    myFailureHandler\"\n  />\n\n  <logout />\n\n  <bean id=\"mySuccessHandler\"\n\
    \    class=\"org.rest.security.MySavedRequestAwareAuthenticationSuccessHandler\"\
    />\n  <bean id=\"myFailureHandler\"\n    class=\"org.springframework.security.web.authentication.SimpleUrlAuthenticationFailureHandler\"\
    />\n\n  <authentication-manager alias=\"authenticationManager\">\n    <authentication-provider>\n\
    \      <user-service>\n        <user name=\"temporary\" password=\"temporary\"\
    \ authorities=\"ROLE_ADMIN\"/>\n        <user name=\"user\" password=\"user\"\
    \ authorities=\"ROLE_USER\"/>\n      </user-service>\n    </authentication-provider>\n\
    \  </authentication-manager>\n\n</beans>\n```\n\n大部分配置都是使用安全命名空间完成的——为了启用此功能，必须定义架构位置并指向正确的\
    \ 3.1 或 3.2 XSD 版本。该命名空间的设计初衷是扩展 Spring Security 的通用功能，同时提供了原始 bean 以适应更高级的场景。\n\
    \n### 3.1. <http> 元素\n\n`<http>` 元素是 HTTP 安全配置的主容器元素。在当前实现中，它只保护了一个单一映射：`/api/admin/**`。注意，该映射是相对于\
    \ Web 应用程序的根上下文，而不是相对于 Servlet；这是因为实体安全配置位于根 Spring 上下文中，而不是在 Servlet 的子上下文中。\n\
    \n### 3.2. 入口点 (Entry Point)\n\n在标准的 Web 应用中，当客户端尝试在未验证的情况下访问受保护资源时，验证过程可能会自动触发——这通常通过重定向到登录页面来实现，以便用户输入凭据。然而，对于\
    \ REST Web 服务，这种行为没有意义——认证应该通过请求正确的 URI 来完成，如果用户未验证，所有请求都应简单返回 401 UNAUTHORIZED\
    \ 状态码。\n\nSpring Security 通过“入口点”（Entry Point）的概念来处理这种验证过程的自动触发——这是配置的必要部分，可以通过\
    \ `<http>` 元素的 `entry-point-ref` 属性注入。考虑到此功能在 REST 服务语境下没有意义，新的自定义入口点被定义为每当被触发时简单返回\
    \ 401：\n\n```java\n@Component(\"restAuthenticationEntryPoint\")\npublic class\
    \ RestAuthenticationEntryPoint implements AuthenticationEntryPoint{\n    @Override\n\
    \    public void commence(HttpServletRequest request, HttpServletResponse response,\n\
    \    AuthenticationException authException) throws IOException {\n        response.sendError(HttpServletResponse.SC_UNAUTHORIZED,\
    \ \"Unauthorized\");\n    }\n}\n```\n\n这里顺带提一下，401 的发送时没有 WWW-Authenticate 头部，根据\
    \ HTTP 规范的要求——我们需要手动设置它。\n\n### 3.3. REST 的登录表单\n\n为 REST 进行认证有多种方法——Spring 提供的默认方法之一是表单登录（Form\
    \ Login）：`org.springframework.security.web.authentication.UsernameAuthenticationFilter`。\n\
    \n`<form-login>` 元素将创建此过滤器并允许我们在上面设置自定义成功处理器。\n\n> 注意，对于标准的 Web 应用，`<http>` 元素的\
    \ `auto-config` 属性是某些安全配置的简写语法。它并不适用于 REST API。\n\n### 3.4. 认证应返回 200 而非 301\n\
    \n默认情况下，表单登录会对成功的认证请求返回 302 状态码；这在需要登录后重定向的实际登录表环境中是合理的。但对于 RESTful Web 服务，认证成功的预期响应应该是\
    \ 200 OK。\n\n这是通过在登录过滤器中注入自定义成功处理器并替换默认处理器来实现。新的处理器实现与默认的 `SavedRequestAwareSuccessHandler`\
    \ 完全相同，显著不同之处在于删除了重定向逻辑。\n\n### 3.5. 认证失败应返回 401 而非 302\n\n同样地，我们配置了认证失败处理器——方式与成功处理器相同。\n\
    \n幸运的是，在这种情况下，我们不需要为此处理器实际定义新类——标准实现类 `SimpleUrlAuthenticationFailureHandler`\
    \ 效果良好。\n\n唯一的区别是——由于我们现在已经在 XML 配置中显式定义了它——它将不会从 Spring 获取默认 `failureUrl`——因此它不会进行重定向。\n\
    \n"
