    Building a REST API with Spring 4\n\n# 12: ERROR HANDLING FOR REST WITH SPRING\n\
    \n## 1. Overview\n\nThis section will focus on **how to implement Exception Handling\
    \ with Spring for a REST API**. We'll look at the recommended solution with Spring\
    \ 3.2 and 4.x but also at all the older options as well.\n\n**Before Spring 3.2**,\
    \ the two main approaches to handling exceptions in a Spring MVC application:\
    \ `ExceptionHandlerResolver` or the `@ExceptionHandler` annotation. Both of these\
    \ have some clear downsides.\n\n**After 3.2** we now have the new @ControllerAdvice\
    \ annotation to address the limitations of the previous two solutions.\n\nAll\
    \ of these do have one in common - they deal with the **separation of concerns**\
    \ well. The app can throw exception normally to indicate a failure of some kind\
    \ - exceptions which will then be handled separately.\n\n## 2. Solution 1 – The\
    \ Controller level @ExceptionHandler\n\nThe first solution works at the @Controller\
    \ level - we will define a method to handle exceptions, and annotate that with\
    \ @ExceptionHandler.\n\n# Building a REST API with Spring\n\n## 3. Solution 2\
    \ – The HandlerExceptionResolver\n\n```java\npublic class FooController{\n   \
    \ @ExceptionHandler(CustomException1.class, CustomException2.class)\n    public\
    \ void handleException() {\n        //\n    }\n}\n```\n\nThis approach has a major\
    \ drawback – the @ExceptionHandler annotated method is only active for that particular\
    \ Controller, not globally for the entire application. Course adding this to every\
    \ controller makes it not well suited for a general exception handling mechanism.\n\
    \nThe limitation is often worked around by having all Controllers extend a Base\
    \ Controller class – however, this can be a problem for applications, for whatever\
    \ reasons, the Controllers cannot be made to extend from another base class which\
    \ may be in another jar or not directly modifiable, or by themselves not be directly\
    \ modifiable.\n\nNext, we'll look at another way to solve the exception handling\
    \ problem – one that is global and does not include any changes to existing artifacts\
    \ as Controllers.\n\n## 3. Solution 2 – The HandlerExceptionResolver\n\nThe second\
    \ solution is to define a HandlerExceptionResolver – this will resolve any exception\
    \ thrown by the application. It will also allow us to implement a uniform exception\
    \ handling mechanism in our REST API.\n\nBefore going for a custom resolver, let’s\
    \ go over the existing implementations.\n\n### 3.1 ExceptionHandlerExceptionResolver\n\
    \nThis resolver was introduced in Spring 3.1 and is enabled by default in the\
    \ DispatcherServlet. This is actually the core component of how the @ExceptionHandler\
    \ mechanism presented earlier works.\n\nBuilding a REST API with Spring4\n\n###\
    \ 3.2. DefaultHandlerExceptionResolver\n\nThe Resolver was introduced in Spring\
    \ 3.0 and is enabled by default in the DispatcherServlet. It is used to resolve\
    \ standard Spring exceptions to their corresponding HTTP Status Codes, namely\
    \ Client error - 4xx and Server error - 5xx status codes. Here is the full list\
    \ of the Spring Exceptions handles, and how these are mapped to status codes.\n\
    \nWhile it sets the Status Code of the Response properly, one limitation is it\
    \ doesn't set anything to the body of the Response. For a REST API - the Status\
    \ Code is really not enough information to present to the Client - the response\
    \ has to have a body as well, the application to give additional information about\
    \ the failure.\n\nThis can be solved by configuring View resolution and rendering\
    \ error content through ModelAndView, but the solution is not optimal - which\
    \ is why a better option has been made available with Spring 3.2 - we'll talk\
    \ about that in the latter part of this section.\n\n### 3.3. ResponseStatusExceptionResolver\n\
    \nThis resolver was also introduced in Spring 3.0 and is enabled by default in\
    \ the DispatcherServlet. It's main responsibility is to use the @ResponseStatus\
    \ annotation on custom exceptions and to map these exceptions to HTTP status codes.\n\
    \nSuch a custom exception may look like:\n\n```java\n@ResponseStatus(value = HttpStatus.NOT_FOUND)\n\
    public final class ResourceNotFoundException extends RuntimeException {\n    public\
    \ ResourceNotFoundException() {\n        super();\n    }\n    public ResourceNotFoundException(String\
    \ message, Throwable cause) {\n        super(message, cause);\n    }\n    public\
    \ ResourceNotFoundException(String message) {\n        super(message);\n    }\n\
    \    public ResourceNotFoundException(Throwable cause) {\n        super(cause);\n\
    \    }\n}\n```\n\n# Building a REST API with Spring4\n\n## 3.4.SimpleMappingExceptionHandlerResolverAndMethodExceptionHandlerResolver\n\
    \nSame as the DefaultExceptionHandlerResolver, this resolver is limited in the\
    \ way it deals with the body of the response - it maps the Status Code on the\
    \ response, but the body is still null.\n\n## 3.4.SimpleMappingExceptionHandlerResolverAnnotationMethodExceptionHandlerResolver\n\
    \nThe SimpleMappingExceptionHandlerResolver has been around for quite some time\
    \ - it comes out the older Spring MVC model and is not relevant for a REST Service.\
    \ It is used to map exception class names to view names.\n\nThe AnnotationMethodExceptionHandlerResolver\
    \ was introduced in Spring 3.0 to handle exceptions through the @ExceptionHandler\
    \ annotation, but has been deprecated by ExceptionHandlerResolver as of Spring\
    \ 3.2.\n\n## 3.5. Custom HandlerExceptionHandlerResolver\n\nThe combination of\
    \ DefaultExceptionHandlerResolver and ResponseStatusExceptionHandler goes a long\
    \ way towards providing a good error handling mechanism for a Spring REST Service.\
    \ The downside is - as mentioned before - no control over the body of the response.\n\
    \nIdeally, we'd be able to output JSON or XML, depending on what format the client\
    \ has asked for (via the Accept header).\n\nThis alone justifies creating a new,\
    \ custom exception resolver:\n\n```java\n@Component\npublic class ResponseStatusExceptionHandlerResolver\
    \ extends AbstractExceptionHandlerResolver (\n\n  @Override\n  protected ModelAndView\
    \ doResolveException(\n    HttpServletRequest request, HttpServletResponse response,\
    \ Object handler, Exception ex) {\n    try {\n      if (ex instanceof IllegalArgumentException)\
    \ {\n        return handleIllegalArgument((IllegalArgumentException)ex, response,\
    \ handler);\n      }\n    }\n  }...\n```\n"
