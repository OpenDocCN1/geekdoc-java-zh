    \ 200 OK\nETag: \"0c3b37c6770c8aad4cb04a11\"\nContent-Type: application/json;charset=UTF-8\n\
    Content-Length: 56\n```\n\nAnd you have it – ETags in the wild and saving bandwidth.\n\
    \nTo use ETag in Spring is extremely easy to set up and completely **transparent**\
    \ for the application. The support is enabled by adding a simple *Filter* in web.xml:\n\
