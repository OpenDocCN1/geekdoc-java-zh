  - '[PAGE 17]


    # 2: BUILD A REST API WITH SPRING 4 AND JAVA CONFIG


    # 1. Overview


    This section shows how to set up REST in Spring – the Controller and HTTP response
    codes, configuration of payload marshalling and content negotiation.


    # 2. Understanding REST in Spring


    The Spring framework supports 2 ways of creating RESTful services:


    +   - using MVC with ModelAndView

    - using HTTP message converters


    The ModelAndView approach is older and much better documented, but also more verbose
    and configuration heavy. It tries to shoehorn the REST paradigm into the old model,
    which is without problems. The Spring team understood this and provided first-class
    REST support with Spring 3.0.


    The new approach, based on HttpMessageConverter and annotations, is much more
    lightweight and easy to implement. Configuration is minimal and provides sensible
    defaults for what you would expect from a RESTful service. It is however newer
    and a bit on the light side concerning documentation; what''s more, the reference
    doesn''t go out of it''s way to make the distinction and the tradeoffs between
    the two approaches as clear as they should be. Nevertheless, this is the way RESTful
    services should be built after Spring 3.0.'
- md: "\n## 3. The Java Configuration\n\n```java\n@Configuration\n@EnableMvc\npublic\
    \ class WebConfig{\n//}\n```\n\nThe new @EnableMvc annotation does a number of\
    \ useful things - specifically, in the case of REST, it detects the existence\
    \ of Jackson and JAXB 2 on the classpath and automatically creates and registers\
    \ default JSON and XML converters. The functionality of the annotation is equivalent\
    \ to the XML version:\n\n```xml\n<mvc:annotation-driven />\n```\n\nThis is a shortcut,\
    \ and though it may be useful in many situations, it's not perfect. When more\
    \ complex configuration is needed, remove the annotation and extend WebMvcConfigurationSupport\
    \ directly.\n\n## 4. Testing the Spring Context\n\nStarting with Spring 3.1, we\
    \ get first-class testing support for @Configuration classes:\n\n```java\n@RunWith(SpringJUnit4Runner.class)\n\
    @ContextConfiguration(classes = {ApplicationConfig.class, PersistenceConfig.class\
    \ }, loader = AnnotationConfigContextLoader.class)\npublic class SpringTest{\n\
    \n@Test\npublic void whenContextIsInstantiated_thenNoExceptions(){\n//\n}\n```\n\
    \nThe Java configuration classes are simply specified with the @Configuration\
    \ annotation and the new AnnotationConfigContextLoader loads the bean definitions\
    \ from @Configuration classes.\n\n## 5. The Controller\n\n**Notice** that the\
    \ WebConfig configuration class was not included in the test because it needs\
    \ to run in a Servlet context, which is not provided.\n\nThe **@Controller** is\
    \ the central artifact in the entire Web Tier of the RESTful API. For the purpose\
    \ of the following examples, the controller is modeling a simple REST resource\
    \ – Foo:\n\n```java\n@Controller\n@RequestMapping(value = \"foos\")\nclass FooController{\n\
    \n    @Autowired\n    FooService service;\n\n    @RequestMapping(method = RequestMethod.GET)\n\
    \    @ResponseBody\n    public List<Foo> findAll() {\n        return service.findAll();\n\
    \    }\n\n    @RequestMapping(value = \"/id\", method = RequestMethod.GET)\n \
    \   @ResponseBody\n    public Foo findOne(@PathVariable(\"id\") Long id) {\n \
    \       return RestPreconditions.checkFound(service.findById(id));\n    }\n\n\
    \    @RequestMapping(method = RequestMethod.POST)\n    @ResponseStatus(Status.CREATED)\n\
    \    public Long create(@RequestBody Foo resource) {\n        Preconditions.checkNotNull(resource);\n\
    \        return service.create(resource);\n    }\n\n    @RequestMapping(value\
    \ = \"/id\", method = RequestMethod.PUT)\n    @ResponseStatus(Status.OK)\n   \
    \ public void update(@PathVariable(\"id\") Long id, @RequestBody Foo resource)\
    \ {\n        Preconditions.checkNotNull(resource);\n        RestPreconditions.checkNotNull(service.getById(resource.getId()));\n\
    \        service.update(resource);\n    }\n\n    @RequestMapping(value = \"/id\"\
    , method = RequestMethod.DELETE)\n    @ResponseStatus(Status.OK)\n    public void\
    \ delete(@PathVariable(\"id\") Long id) {\n        service.deleteById(id);\n \
    \   }\n}\n```\n\n# Building a REST API with Spring\n\n## 6. Mapping the HTTP response\
    \ codes\n\nYou may have noticed I'm using a very simple, guava style RestPreconditions\
    \ utility:\n\n```java\npublic class RestPreconditions {\n    public static <T>\
    \ T checkFind(final T resource) {\n        if (resource == null) {\n         \
    \   throw new MyResourceNotFoundException();\n        }\n        return resource;\n\
    \    }\n}\n```\n\nThe Controller implementation is non-public – this is because\
    \ it doesn't need to be. Usually the controller is the last in the chain (`DispatcherServlet`)\
    \ and simply receives HTTP requests from the Spring front controller. If there\
    \ is no use case where the controller has been injected or manipulated through\
    \ a direct reference, then I prefer not to declare it as public.\n\nThe **request\
    \ mappings** are straightforward - as with any controller, the actual value of\
    \ the mapping as well as the method used to determine the target method for the\
    \ request.. `@RequestBody` will bind the parameters of the method to the body\
    \ of the HTTP request, whereas `@ResponseBody` does the same for the response\
    \ and return type. They also ensure that the resource will be marshalled and unmarshalled\
    \ using the correct HTTP converter. **Content negotiation** will take place to\
    \ choose which one of the active converters will be used, based mostly on the\
    \ Accept header, although other HTTP headers may be used to determine the representation\
    \ as well.\n\nThe status codes of the HTTP response are one of the most-important\
    \ parts of the REST service, and the subject can quickly become very complex.\
    \ Getting these right can be what makes or breaks the service.\n\n### 6.1. Unmapped\
    \ Requests\n\nIf Spring MVC receives a request which doesn't have a mapping, it\
    \ considers the request not to be allowed and returns a **405 METHOD NOT ALLOWED**\
    \ back to the client. It is also good practice to include the Allow HTTP header\
    \ when returning a 405 to the client, in order to specify which operations are\
    \ allowed. This is the standard behavior of Spring MVC and does not require any\
    \ additional configuration.\n\n### 6.2. Valid, Mapped Requests\n\nFor any request\
    \ that has a mapping, Spring MVC considers the request valid and responds with\
    \ 200 OK if no status code is specified otherwise. It is because of that this\
    \ controller declares different @ResponseEntity for the create, update and delete\
    \ actions but not for get, which should indeed return the default 200 OK.\n\n\
    ### 6.3. Client Error\n\nIn case of a client error, custom exceptions are defined\
    \ and mapped to the appropriate error codes. Simply throwing these exceptions\
    \ from any of the layers of the web tier will ensure Spring maps the corresponding\
    \ status code on the HTTP response.\n\n```java\n@ResponseEntity(value = HttpStatus.BAD_REQUEST\
    \ )\npublic class BadRequestException extends RuntimeException(\n//\n)\n@ResponseEntity(value\
    \ = HttpStatus.NOT_FOUND)\npublic class ResourceNotFoundException extends RuntimeException(\n\
    )\n```\n\nThese exceptions are part of the REST API and, as such, should only\
    \ be used in the appropriate layers conforming to REST; if instance a DAO/DAL\
    \ layer exist, it should not use the exceptions directly. Note also that these\
    \ are not checked exceptions but runtime exceptions - in line with Spring practices\
    \ and idioms.\n\n### 6.4. Using @ExceptionHandler\n\nAnother option to map custom\
    \ exceptions on specific status codes is to use the @ExceptionHandler annotation\
    \ in the controller. The problem with that approach is that the annotation only\
    \ applies to the controller in which it is defined, not to the entire Spring Container,\
    \ which means it needs to be declared in each controller individually. This quickly\
    \ becomes cumbersome, especially in more complex applications with many controllers.\
    \ There are a few JIRA issues opened with Spring at this time handle all related\
    \ limitations: SPR-8124, SPR-7278, SPR-8406.\n\n## 7. Additional Maven dependencies\n\
    \nIn addition to the spring-webmvc dependency required for the standard web application,\
    \ we'll need to set up content marshalling and unmarshalling for the REST API:\n\
    \n```xml\n<dependencies>\n  <dependency>\n    <groupId>com.fasterxml.jackson.core</groupId>\n\
    \    <artifactId>jackson-databind</artifactId>\n    <version>${jackson.version}</version>\n\
    \  </dependency>\n  <dependency>\n    <groupId>javax.xml.bind</groupId>\n    <artifactId>jaxb-api</artifactId>\n\
    \    <version>${jaxb-api.version}</version>\n    <scope>runtime</scope>\n  </dependency>\n\
    </dependencies>\n```\n\n```xml\n<properties>\n  <jackson.version>2.4.0</jackson.version>\n\
    \  <jaxb-api.version>2.2.11</jaxb-api.version>\n</properties>\n```\n\nThese are\
    \ the libraries used to convert the representation of the REST resource to either\
    \ JSON or XML.\n\n## 8. Conclusion\n\nThis section covered the configuration and\
    \ implementation of a REST Service using Spring 4 and Java based configuration,\
    \ discussing HTTP response codes, basic Content Negotiation and marshaling.\n\n\
    In the next sections of the series I will focus on Discoverability of the API,\
    \ advanced content negotiation and working with additional representations of\
    \ a Resource.\n\nThis is an Eclipse based project, so it should be easy to import\
    \ and run as it is.\n"
