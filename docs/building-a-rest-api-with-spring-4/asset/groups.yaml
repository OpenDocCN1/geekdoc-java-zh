    # 2. REST and ETags


    From the official Spring documentation on ETag support:


    An ETag (entity tag) is an HTTP response header returned by an HTTP/1.1 compliant
    server used to determine change in content at a given URL.


    ETags are used for two things – caching and conditional requests. The **ETag value
    can be tough as a hash tag** computed out of the bytes of the Response body. Because
    a cryptographic hash function is lowly used, even the smallest modification of
    the body will drastically change the output and thus the value of ETag. This is
    only for strong ETags – the protocol provide a weak ETag as well.


    Using an `If-*` header turns a standard GET request into a conditional GET. The
    two `If-*` headers that are using with ETags are "If-None-Match" and "If-Match"
    – each with its own semantics as discussed later in this section.'
