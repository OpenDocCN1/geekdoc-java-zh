  - '[PAGE 48]


    # 4.1. Anonymous request


    With both basic and digest filters in the security chain, the way a anonymous
    request – a request containing no authentication credentials (Authorization HTTP
    header) is processed by Spring Security is the two authentication filters find
    no credentials and will continue execution of the filter chain. Then, seeing how
    the request wasn''t authenticated, an AccessDeniedException is thrown and caught
    in the ExceptionTranslationFilter, which commences the digest entry point, prompting
    the client for credentials.


    The responsibilities of both basic and digest filters are very narrow – they will
    continue to execute the security filter chain if they are unable to identify the
    type of authentication credentials in the request. It is because of that Spring
    Security can have the flexibility to be configured with support for multiple authentication
    protocols on the same URI.


    When a request is containing the correct authentication credentials – either basic
    or digest – that protocol will be rightly used. However, for an anonymous request,
    the client will get prompted only for digest authentication credentials. This
    is because the digest entry point is configured as the main and single entry point
    of the Spring Security chain; as such digest authentication can be considered
    the default.


    # 4.2. Request with authentication credentials


    A request with credentials for Basic authentication will be identified by the
    Authorization header starting with the prefix “Basic”. When processing such a
    request, the credentials will be decoded in the basic authentication filter and
    the request will be authorized. Similarly, a request with credentials for Digest
    authentication will use the prefix “Digest” for it’s Authorization header.


    # 5. Testing both scenarios


    The tests will consume the REST service by creating a new resource after authenticating
    with either basic or digest:'
