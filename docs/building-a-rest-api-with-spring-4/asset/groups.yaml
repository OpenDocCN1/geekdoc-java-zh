    \ with both JSON and XML\n\n```\n...\npublic String getMimeType() {\n    return\
    \ MediaType.APPLICATION_XML.toString();\n}\n```\n\nNote that these marshallers\
    \ are not Spring beans themselves. The reason for that they are bootstrapped into\
    \ the Spring context by the TestMarshallerFactory, so there is no need to make\
    \ them components directly.\n\n# 5. Consuming the Service with both JSON and XML\n\
    \nAt this point we should be able to run a full integration test against the deployed\
    \ service. Using the marshaller is straightforward – an IMarshall is simply injected\
    \ directly into the test:\n\n```\n@ActiveProfiles(\"test\")\npublic abstract class\
    \ SomeRestLiveTest {\n\n@Autowired\nprivate IMarshall marshaller;\n\n// tests\n\
    \n}\n```\n\nThe exact marshaller that will be injected by Spring will of course\
    \ be decided by the value of test.mime property; this could be picked up from\
    \ a properties file or simply set on the test environment manually. If however\
    \ a value is not provided for this property, the TestMarshallerFactory will simply\
    \ fall back on the default marshaller – the JSON marshaller."
