    # 4. Maven and other trouble


    The Spring core dependencies necessary for a web application and for the REST
    Service have been discussed in detail. For example, we''ll need to add: spring-security-web
    and spring-security-config - all of these have also been covered in the Maven
    for Spring Security tutorial.


    It''s worth paying close attention to how the Maven will resolve the older Spring
    dependencies - the resolution strategy will start causing problems once the security
    artifacts are added to the pom. To address this problem, some of the core dependencies
    will need to be overridden in order to keep them at the right version.


    # 5. Conclusion


    This section covered the basic security configuration and implementation for a
    RESTful Service using Spring Security 3.1, discussing the web.xml, the security
    configuration, the HTTP status codes for the authentication process and the Maven
    resolution of the security artifacts.


