    There is of course the option of Java based configuration as well.


    What is relevant here is the <http-basic> element inside the main <http> element
    of the configuration - this is enough to enable Basic Authentication for the entire
    application. The Authentication Manager is not the focus of this section, so we
    are using an in memory manager with the user and password defined in plaintext.


    The *web.xml* of the web application enabling Spring Security has already been
    discussed in the previous section.


    # 3. Consuming The Secured Application


    The *curl* command is our go to tool for consuming the secured application.


    First, let''s try to request the /homepage.html without providing any security
    credentials.


    ```

    curl -i http://localhost:8080/spring-security-mvc-basic-auth/homepage.html

    ```


    We get back the expected 401 Unauthorized and the Authentication Challenge:


    ```

    HTTP/1.1 401 Unauthorized

    Server: Apache-Coyote/1.1

    Set-Cookie: JSESSIONID=E5ABD3C16B65A007FAAE619; Path=/spring-security-mvc-basic-auth/;
    HttpOnly

    WWW-Authenticate="Spring Security Application"

    Content-Type: text/html;charset=utf-8

    Content-Length: 1061

    Date: Wed, 29 May 2013 15:14:08 GMT

    ```


    The browser would interpret this challenge and prompt us for credentials with
    a simple dialog, but since we''re using *curl*, this isn''t the case.


    Now, let''s request the same resource - the homepage – **provide the credentials**
    to access it as well:


    ```

    curl -i user1:user1Pass http://localhost:8080/spring-security-mvc-basic-auth/homepage.html

    ```


    Now, the response from the server is **200 OK** along with a *Cookie*.'
