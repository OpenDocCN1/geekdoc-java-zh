    \ REST 规范（RESTful）。\n\n# 6. 结论\n\n本节试图对演进 REST 服务这一非常多样且困难的问题提供概述。我们讨论了两种常见的解决方案及其的优缺点，以及在\
    \ REST 语境下思考这些方法的方法。材料最后论证了第二种解决方案——媒体类型版本化，同时检查了对 RESTful API 可能的更改。\n\n# 14：使用多种\
