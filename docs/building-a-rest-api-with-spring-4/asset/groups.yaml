    }\n```\n\n## 5.2. 删除或更改现有的表示\n\n在现有表示的设计中删除、重命名或通常的重构信息对客户端来说都是破坏性变更，因为它们已经理解并依赖于旧格式。\n\
    \n这就是内容协商（Content Negotiation）大显用场的地方——对于此类更改需要引入**一个新的厂商 MIME 类型**（vendor MIME\
