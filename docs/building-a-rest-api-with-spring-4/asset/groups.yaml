    # 5. Conclusion


    In this section we introduce security into a simple Spring REST API by leveraging
    the Digest Authentication support in the framework.


    The implementation of these examples can be found in the github project - this
    is an Eclipse based project, so it should be easy to import and run as it is.


    When the project runs locally, the homepage html can be accessed at (or, with
    minimal Tomcat configuration, on port 80):


    http://localhost:8080/spring-security-mvc-digest-auth/homepage.html


    Finally, in the next section we''ll see that there is no reason for an application
    needs to choose between Basic and Digest authentication - both can be set up simultaneously
    on the same URI structure, in such a way that the client can pick between the
    two mechanisms when consuming the web application.'
