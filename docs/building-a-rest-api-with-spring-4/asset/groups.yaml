    \ {\n        Preconditions.checkNotNull(resource);\n        RestPreconditions.checkNotNull(service.getById(resource.getId()));\n\
    \        service.update(resource);\n    }\n\n    @RequestMapping(value = \"/id\"\
    , method = RequestMethod.DELETE)\n    @ResponseStatus(Status.OK)\n    public void\
    \ delete(@PathVariable(\"id\") Long id) {\n        service.deleteById(id);\n \
    \   }\n}\n```\n\n# 使用 Spring 构建 REST API\n\n## 6. 映射 HTTP 响应码\n\n你可能注意到我使用了一个非常简单的、Guava\
    \ 风格的 `RestPreconditions` 工具类：\n\n```java\npublic class RestPreconditions {\n\
    \    public static <T> T checkFind(final T resource) {\n        if (resource ==\
    \ null) {\n            throw new MyResourceNotFoundException();\n        }\n \
    \       return resource;\n    }\n}\n```\n\n控制器的实现是非公开的 - 这是因为它没有必要公开。通常控制器是链的末端（`DispatcherServlet`），仅接收来自\
    \ Spring 前端控制器的 HTTP 请求。如果没有通过直接引用来注入或操作控制器的用例，那么我倾向于不将其声明为公开。\n\n**请求映射（request\
    \ mappings）** 非常直观 - 与任何控制器一样，映射的实际值以及用于确定请求目标方法的方法都是。`@RequestBody` 会将方法的参数绑定到\
    \ HTTP 请求体中，而 `@ResponseBody` 对响应和返回类型执行相同的操作。它们还确保资源将使用正确的 HTTP 转换器进行序列化和反序列化。**内容协商（Content\
    \ negotiation）**将发生，以决定使用激活转换器中的哪一个，主要取决于 `Accept` Header，尽管也可能使用其他 HTTP Header来确定表示形式。\n\
    \nHTTP 响应的状态码是 REST 服务最重要的部分之一，该主题可能会迅速变得非常复杂。正确处理这些状态码可能决定服务的成败。\n\n### 6.1.\
    \ 未映射的请求\n\n如果 Spring MVC 接收到一个没有映射的请求，它将认为该请求是不允许的，并向客户端返回 **405 METHOD NOT ALLOWED**。在向客户端返回\
    \ 405 时，包含 `Allow` HTTP Header 也是一种良好做法，以指定哪些操作是被允许的。这是 Spring MVC 的标准行为，不需要任何配置。\n\
    \n### 6.2. 有效的已映射请求\n\n对于任何有映射的请求，Spring MVC 认为该请求是有效的，如果没有指定其他状态码，则将响应 200 OK。正因如此，该控制器为创建、更新和删除操作声明了不同的\
    \ `@ResponseEntity`，但没有为 get 操作声明，因为 get 确实应该返回默认的 200 OK。\n\n### 6.3. 客户端错误\n\
    \n在发生客户端错误时，定义了自定义异常并映射到相应的错误码。只需从 Web 层的任何层抛出这些异常，即可确保 Spring 在 HTTP 响应上映射相应的状态码。\n\
    \n```java\n@ResponseEntity(value = HttpStatus.BAD_REQUEST )\npublic class BadRequestException\
    \ extends RuntimeException(\n//\n)\n@ResponseEntity(value = HttpStatus.NOT_FOUND\n\
    )\npublic class ResourceNotFoundException extends RuntimeException(\n)\n```\n\n\
    这些异常属于 REST API 的一部分，因此，不应直接在 DAO/DAL 层使用。请注意，这些不是检查异常（checked exceptions），而是运行时异常\
    \ - 符合 Spring 的实践和惯用法。\n\n### 6.4. 使用 @ExceptionHandler\n\n另一种将自定义异常映射到特定状态码的方法是在控制器中使用\
    \ `@ExceptionHandler` 注解。这种方法的问题是，注解仅适用于定义它的控制器，而不是整个 Spring 容器，这意味着需要在每个控制器中单独声明。在在许多控制器的复杂应用程序中很快就会变得繁琐。Spring\
    \ 目前有一些 JIRA 问题正在处理此类限制：SPR-8124、7278、8406。\n\n## 7. 额外的 Maven 依赖\n\n除了标准应用程序所需的\
    \ `spring-webmvc` 依赖外，我们还需要为 REST API 设置内容序列化和反序列化：\n\n```xml\n<dependencies>\n\
    \  <dependency>\n    <groupId>com.fasterxml.jackson.core</groupId>\n    <artifactId>jackson-databind</artifactId>\n\
    \    <version>${jackson.version}</version>\n  </dependency>\n  <dependency>\n\
    \    <groupId>javax.xml.bind</groupId>\n    <artifactId>jaxb-api</artifactId>\n\
    \    <version>${jaxb-api.version}</version>\n    <scope>runtime</scope>\n  </dependency>\n\
    </dependencies>\n```\n\n```xml\n<properties>\n  <jackson.version>2.4.0</jackson.version>\n\
    \  <jaxb-api.version>2.2.11</jaxb-api.version>\n</properties>\n```\n\n这些库用于将 REST\
    \ 资源的表示形式转换为 JSON 或 XML。\n\n## 8. 结论\n\n本节涵盖了使用 Spring 4 和 Java 配置的 REST 服务配置和实现，讨论了\
    \ HTTP 响应码、基础内容协商和序列化。\n\n在该系列的后续章节中，我将关注 API 的可发现性、高级内容协商以及处理资源的额外表示。\n\n这是一个基于\
    \ Eclipse 的项目，因此应该很容易导入和运行。\n\n"
