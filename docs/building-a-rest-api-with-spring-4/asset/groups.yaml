  - '[PAGE 53]


    # 3. Client-Server Communication – JSON only


    # 3.1. High Level Content Negotiation


    Each HttpMessage implementation has one or several associated MIME Types.


    When receiving a new request, Spring will **use of the “Accept” header to determine
    the media type** that it needs to respond with.


    It will then try to find a registered converter that is capable of handling that
    specific media type – and it will use to **convert the entity** and send back
    the response.


    The process is similar for receiving a request which contains JSON information
    – the framework will **use the “Content-Type” header to determine the media**
    type of the request body.


    It will then search for a HttpMessageConverter that can **convert the body** sent
    by the client to a Java Object.


    Let’s clarify this with a **quick example:**


    +   - the Client sends a GET request to /foo with the **Accept** header set to
    *application/json* – to get all *Foo* resources as Json

    - the Foo Controller is hit and returns the corresponding Foo Java entities

    - Spring then uses one of the Jackson message converters to marshall the entities
    to json


    Let’s now look at the specifics of how this works – and how we should leverage
    the @ResponseBody and @RequestBody annotations.


    # 3.2. @ResponseBody


    @ResponseBody on a Controller method indicates to Spring that **the return value
    of the method** is serialized directly to the body of the HTTP Response. As discussed
    above, the “Accept” header specified by the Client will be used to choose the
    appropriate Http Converter to marshall the entity.'
