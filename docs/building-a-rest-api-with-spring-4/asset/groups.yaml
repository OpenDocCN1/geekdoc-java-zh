    Building a REST API with Spring4


    4. Other potential discoverable URIs and microformats


    Note that the full low level code for extractURIByRel - responsible for extracting
    the URIs by rel relation is shown here.


    This test covers the thorny subject of Link Relations in REST: the URI to retrieve
    all resources uses the rel="collection" semantics.


    This type of link relation has not yet been standardized, but is already in use
    by several microformats and proposed for standardization. Usage of non-standard
    link relations opens the discussion about microformats and richer semantics in
    RESTful servers.


    # 4. Other potential discoverable URIs and microformats


    Other URIs could potentially be discovered via the Link header, but there is only
    so much the existing types of link relations allow without moving to a richer
    semantic markup such as defining custom link relations, the Atom Publishing Protocol
    or microformats.


    For example the client should be able to discover the URI to create new Resources
    when doing a GET on a specific Resource; unfortunately there is no link relation
    to model semantics. Luckily it is standard practice that the URI for creation
    is the same as the URI to GET all resources of that type, with the only difference
    being the POST HTTP method. Forms can also be used to achieve this.


