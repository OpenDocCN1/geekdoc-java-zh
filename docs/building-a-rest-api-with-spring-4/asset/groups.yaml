    \ Spring 4\n\n## 11: REST PAGINATION IN SPRING\n\n## 1. Overview\n\nThis section\
    \ will focus on the implementation of pagination in a REST API, using Spring MVC\
    \ and Spring Data.\n\n## 2. Page as Resource vs Page as Representation\n\nThe\
    \ first question when designing pagination in the context of a RESTful architecture\
    \ is whether to consider the page as an actual Resource or a Representation of\
    \ Resources.\n\nTreating the page itself as a resource host introduces a host\
    \ of problems such as no longer being able to uniquely identify resources between\
    \ calls. This, coupled with the fact that, in the persistence layer, the page\
    \ is not a proper entity but a holder that is constructed when necessary, makes\
    \ the choice straightforward: the page is part of the representation.\n\nThe next\
    \ question in the pagination design in the context of REST is where to include\
    \ the paging information:\n\n- in the URI path: /foo/page/1\n- in the URI query:\
    \ /foo?page=1\n\nKeeping in mind that a page is not a Resource, encoding the page\
    \ information in the URI is no longer an option.\n\nWe are going to use the standard\
    \ way of solving this problem by encoding the paging information in a URI query.\n\
    \n## 3. The Controller\n\nNow, for the implementation – the Spring MVC Controller\
    \ for pagination is straightforward:\n\n```java\n@RequestMapping(value = \"admin/foo\"\
    , params = { \"page\", \"size\"}, method = GET )\n@ResponseBody\npublic List<Foo>\
    \ findPaginated(\n    @RequestParam(\"page\") int page, @RequestParam(\"size\"\
    ) int size,\n    UriComponentsBuilder uriBuilder, HttpServletResponse response)\
    \ {\n    Page<Foo> resultPage = service.findPaginated(page, size);\n    if (page\
    \ > resultPage.getTotalPages()) {\n        throw new ResourceNotFoundException();\n\
    \    }\n    eventPublisher.publishEvent(new PaginatedResultsRetrievedEvent<Foo>(\n\
    \        Foo.class, uriBuilder, response, page, resultPage.getTotalPages(), size));\n\
    \n    return resultPage.getContent();\n}\n```\n\nThe two query parameters are\
    \ injected into the Controller method via @RequestParam.\n\nWe're also injecting\
    \ the Http Response and UriComponentsBuilder to help with **Discoverability**\
    \ – we are decoupling via a custom event. If that is not a goal of the API, you\
    \ can simply remove the custom event and be done.\n\nFinally – note that the focus\
    \ of this article is only the REST and the web layer – to go deeper into the data\
    \ access of pagination you can check out this article about Pagination with Spring\
    \ Data.\n\n## 4. Discoverability for REST pagination\n\nWithin the scope of **pagination**,\
    \ satisfying the HATEOAS constraint of REST means enabling the client of the API\
    \ to discover the next and previous pages based on the current page in the navigation.\
    \ For this purpose, we are going to use the **Link HTTP header**, coupled with\
    \ the official \"next\", \"prev\", \"first\" and \"last\" link relation types.\n\
    \n## Building a REST API with Spring 4\n\nIn REST, Discoverability is a cross\
    \ cutting concern, applicable not only to specific operations but to types of\
    \ operations. For example, when a Resource is created, the URI of that Resource\
    \ should be discoverable.\n\n```java\nvoid addLinkHeader(UriComponentsBuilder\
    \ builder, HttpServletResponse response, Class<?> clazz, int totalPages, int size)\
    \ {\n    StringBuilder linkHeader = new StringBuilder();\n    String resourceName\
    \ = clazz.getSimpleName().toLowerCase();\n\n    if (hasNextPage(page)) {\n   \
    \     String nextPage = constructNextPage(builder);\n        linkHeader.append(\"\
    <\").append(nextPage).append(\"; rel=\\\"next\\\"; \");\n    }\n    if (hasPreviousPage(page))\
    \ {\n        String prevPage = constructPrevPage(builder);\n        linkHeader.append(\"\
    <\").append(prevPage).append(\"; rel=\\\"prev\\\"; \");\n    }\n    if (hasFirstPage(page))\
    \ {\n        String firstPage = constructFirstPage(builder);\n        linkHeader.append(\"\
    <\").append(firstPage).append(\"; rel=\\\"first\\\"; \");\n    }\n    if (hasLastPage(page,\
    \ totalPages)) {\n        String lastPage = constructLastPage(builder, totalPages);\n\
    \        linkHeader.append(\"<\").append(lastPage).append(\"; rel=\\\"last\\\"\
    ; \");\n    }\n    response.addHeader(\"Link\", linkHeader.toString());\n}\n```\n\
    \nIn short, listeners check if the navigation allows for next, previous, first\
    \ and last pages and if it adds relevant URIs to the Link Header.\n\nNote that\
    \ for brevity, I included only partial code samples and the full code here.\n\n\
    ## 5. Test Driving Pagination\n\nBoth the main logic of pagination and discoverability\
    \ are covered by small, focused integration tests; as in the previous section,\
    \ the rest-assured library is used to consume the REST service and to verify the\
    \ results.\n\nThese are examples of pagination integration tests; for a full test\
