    \ response, ) {\n        Uri uri = ServletUriComponentsBuilder.fromCurrentRequest().path(\"\
    /{idOfNewResource}\").buildAndExpand(idOfNewResource).toUri();\n        response.setHeader(\"\
    Location\", uri.toASCIIString());\n    }\n}\n```\n\n我们现在正在使用 `ServletUriComponentsBuilder`——它是在\
    \ Spring 3.1 中引入的用于帮助使用当前请求的工具。通过这种方式，我们不需要传递任何内容，只需简单地静态访问它。\n\n如果 API 返回 `ResponseEntity`——我们也可以使用此处引入的\
    \ `Location` 支持。\n\n### 4. 获取单个资源\n\n在检索单个资源时，客户端应该能够发现获取该特定类型所有资源的 URI：\n\n使用\
    \ Spring 4 构建 REST API\n\n```java\n@Component\nclass SingleResourceRetrievedDiscoveryabilityListener\n\
    implements ApplicationListener<SingleResourceRetrieved>{\n    @Override\n    public\
    \ void onApplicationEvent(SingleResourceRetrieved resourceRetrievedEvent) {\n\
    \        Preconditions.checkNull(resourceRetrievedEvent);\n    }\n    HttpServletResponse\
    \ response = resourceRetrievedEvent.getResponse();\n    addLinkHeaderOnSingleResourceRetrieval(request,\
    \ response);\n    }\n    void addLinkHeaderOnSingleResourceRetrieval(HttpServletResponse\
    \ response) {\n        String requestURL = ServletUriComponentsBuilder.fromCurrentRequest().path(toSlash()).build().toString();\n\
    \        int positionOfSlash = requestURL.indexOf(\"/\");\n        String uriForCreation\
    \ = requestURL.substring(0, positionOfSlash);\n        String linkValue = LinkUtil.createLinkHeader(uriForCreation,\
    \ \"collection\");\n        response.addHeader(\"Link\", linkValue);\n    }\n\
    }\n```\n\n**注意** 链接的语义使用了多种微格式（microformats），但尚未标准化。\n\n`Link` 头部是用于可发现性的最常用的\
    \ HTTP 头部之一。创建它的工具非常简单：\n\n```java\npublic final class LinkUtil {\n    public\
    \ static String createLinkHeader(String uri, String rel) {\n        return \"\
    <\" + uri + \"\\\";rel=\\\"\" + rel + \"\\\"\";\n    }\n}\n```\n\n### 5. 根路径的可发现性\n\
    \n根路径是整个服务的入口点——它是客户端首次使用 API 时接触的地方。HATEOAS 约束应该贯穿始终并被实现，那么这里就是起点。**系统中的所有主 URI\
    \ 都必须从根路径可发现**这一事实，到这里不应该让人感到意外。\n\n使用 Spring 4 构建 REST API\n\n### 5.1. 可发现性不是关于更改\
    \ URI\n\n让我们来看这个控制器：\n\n```java\n@RequestMapping(value = \"admin\",method = RequestMethod.GET)\n\
    @ResponseStatus(value = HttpStatus.NO_CONTENT)\npublic void adminRoot(HttpServletRequest\
    \ request, HttpServletResponse response) {\n    String rootURI = request.getURI().toString();\n\
    \    URI fooUri = new UriTemplate(\"{rootURI}/resource\").expand(rootURI, \"foo\"\
    );\n    String linkToFoo = LinkUtil.createLinkHeader(fooUri.toASCII(), \"collection\"\
    );\n    response.addHeader(\"Link\", linkToFoo);\n}\n```\n\n这当然只是该概念的说明，关注于单个示例\
    \ URI 用于 Foo 资源——真实的实现应地为发布给客户端的所有资源添加 URI。\n\n这可能是一个有争议点——一方面，HATEOAS 的目的是让客户端发现\
    \ API 的 URI 而不依赖硬编码值。另一方面——这并不是 Web 的工作方式：是的，URI 会被发现，但也会被书签。\n\n一个微妙但重要的区别是 API\
    \ 的演进——旧的 URI 应该仍然有效，但任何发现 API 的客户端都应该发现新的 URI——这允许 API 动态变化，并让良好的客户端在 API 变化时表现良好。\n\
    \n## 6. 可发现性的局限性\n\n"
