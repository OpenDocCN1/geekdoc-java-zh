    使用 Spring 4 构建 REST API


    ## 6. 可发现性的局限性 (Caveats)


    获取理想状态——这就是我们消耗每一个新网页的方式——是在在没有任何文档的情况下进行的。因此，如果该概念在 REST 语境下更具问题性，那么它必须是技术实现方面的问题，而不是是否可能实现的问题。


    尽管如此，从技术角度来说，我们离完全可行的解决方案还有很距离——规范和框架支持仍在不断进化，正因为如此，可能必须做出妥协；尽管如此，这些仍然是妥协，并且应该被视为妥协。


    ## 7. 结论


    ![](img/9e952c1884adb105358b0d748e0b42fd_73_0.png)


    在这一节中，我们涵盖了 RESTful 服务 Spring MVC 框架下可发现性的某些特性的实现，并探讨了可发现性的核心概念。


    所有这些示例和代码段的实现可以在我的 github 项目找到——这是一个基于 Eclipse 的项目，因此很容易导入和运行。


    ## 10: 使用 Spring 处理 REST 中的 ETAG


    ## 1. 概述


    本节将侧重于**在 Spring 中使用 ETags**、REST API 的集成测试以及使用 `curl` 的消费场景。


    ## 2. REST 和 ETags


    来自关于 ETag 支持的官方 Spring 文档：


    ETag（实体标签）是由符合 HTTP/1.1 标准的服务器返回的 HTTP 响应头，用于确定给定 URL 下内容的变化。


    ETags 用于两个方面——缓存和条件请求。**ETag 值可能像一个哈希标签**，它是根据响应体的字节计算得的。由于加密哈希函数很少使用，即使对正文进行最微小的修改也会剧烈改变输出，从而改变
    ETag 的值。这仅适用于强 ETag（strong ETags），协议也提供弱 ETag（weak ETag）。


    使用 `If-*` 头会将标准的 GET 请求转换为条件 GET。与 ETags 一用的两个 `If-*` 头是 "If-None-Match" 和 "If-Match"——在在本节稍后的讨论中，它们各自各自的语义。


    ## 3. 使用 curl 进行客户端-服务器通信


    涉及 ETags 的简单客户端-服务器通信可以分解为以下步骤：


    - 首先，客户端发起 REST API 调用——响应包含 ETag 头，以供未来存储用：


    ```

    curl -H "Accept: application/json" -i http://localhost:8080/rest-sec/api/resources/1

    ```


    ```

    HTTP/1.1 200 OK

    ETag: "f88dd058fe00490961a64f01be66a7"

    Content-Type: application/json;charset=UTF-8

    Content-Length: 52

    ```


    - 接下来，客户端请求 REST API 时包含上一步中 ETag 值的 If-None-Match 请求头；如果资源在服务器上没有更改，响应将不包含正文，且状态码为
    304 - Not Modified（未修改）：


    ```

    curl -H "Accept: application/json" -H "If-None-Match: "f88dd058fe00490961a64f01be66a7"

    -i http://localhost:8080/rest-sec/api/resources/1

    ?

    ```


    ```

    HTTP/1.1 304 Not Modified

    ETag: "f88dd058fe00490961a64f01be66a7"

    ```


    - 现在，在再次检索资源之前，我们将通过执行更新来更改它：


    ```

    curl --user admin@fake.com:adminpass -H "Content-Type: application/json" -

    -X PUT -data ''{"name":"updated"}'' http://localhost:8080/rest-sec/api/resources/1

    ```


    ```

    HTTP/1.1 200 OK

    ETag: "b88dd058fe00490961a64f01be66a7"

    Content-Type: application/json;charset=UTF-8

    Content-Length: 52

    ```

    '
