    # 7: HTTP MESSAGE CONVERTERS WITH THE SPRING FRAMEWORK


    # 1. Overview


    This section describes **how to Configure HttpConverter in Spring.**


    Simply put, message converters are used to marshall and unmarshall Java Objects
    to and from JSON, XML, etc - over HTTP.


    # 2. The Basics


    # 2.1. Enable Web MVC


    The Web Application needs to be **configured with Spring MVC support** - one convenient
    and very customizable way to do this is to use the `@EnableWebMvc` annotation:


    ```

    @EnableWebMvc

    @Configuration

    @ComponentScan("org.baeldung.web")

    public class WebConfig extends WebMvcConfigurerAdapter {

    }

    ```'
