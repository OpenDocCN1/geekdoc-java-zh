- md: "\n# Building a REST API with Spring4\n\n## 4. Solution 3 – The New @ControllerAdvice\
    \ (Spring 3.2 And Above)\n\n```java\ncatch (ExceptionHandler ex) {\n    logger.warn(\"\
    Handling of \" + ex.getClass().getName() + \" \");\n    resulted in Exception\"\
    , handlerException);\n}\nreturn null;\n}\n\nprivate ModelAndView handleIllegalArgument(\n\
    \    IllegalArgumentException ex, HttpServletResponse response) throws IOException\
    \ {\n    response.sendError(HttpServletResponse.SC_CONFLICT);\n    String accept\
    \ = request.getHeader(HttpHeaders.ACCEPT);\n    return new ModelAndView();\n}\n\
    ```\n\nOne detail to notice here is the Request header itself is available, so\
    \ the application can consider the value of the Accept header sent by the client.\
    \ For example, if the client asks for application/json then, in case of an error\
    \ condition, the application should still return a response encoded with application/json.\n\
    \nThe other implementation detail is that a ModelAndView is returned – this is\
    \ the body of the response and it will allow the application to set whatever is\
    \ necessary on.\n\nThis approach is a consistent and easily configurable mechanism\
    \ for the error handling of a Spring REST Service. It does however have limitations:\
    \ it's interacting with the low level HttpServletResponse and it fits into the\
    \ old MVC model which uses ModelAndView – so there's still room for improvement.\n\
    \n## 4. Solution 3 – The New @ControllerAdvice (Spring 3.2 And Above)\n\nSpring\
    \ 3.2 brings support for a global @ExceptionHandler with the new @ControllerAdvice\
    \ annotation. This enables a mechanism that breaks away from the older MVC model\
    \ and use of ResponseEntity along with the type safety and flexibility of @ExceptionHandler.\n\
    \n```java\n@ControllerAdvice\npublic class ResponseEntityExceptionHandler extends\
    \ EntityExceptionHandler {\n\n    @ExceptionHandler(value = {IllegalIllegalArgumentException.class,\
    \ IllegalStateException.class})\n    protected ResponseEntity<Object> handleConflict(RuntimeException\
    \ ex, WebRequest request) {\n        String bodyOfResponse = \"This should be\
    \ application specific\";\n        return handleExceptionInternal(ex, bodyOfResponse,\
    \ new HttpHeaders(), HttpStatus.CONFLICT, request);\n    }\n}\n```\n\nThe new\
    \ annotation allows the multiple scattered @ExceptionHandler from before to be\
    \ consolidated into a single, global error handling component.\n\nThe actual mechanism\
    \ is extremely simple but also very flexible:\n\n- it allows full control over\
    \ the body of the response as well as the status code\n- it allows mapping of\
    \ several exceptions to the same method, to be handled together\n- it makes good\
    \ use of the newer RESTful ResponseEntity response\n\nOne thing to keep in mind\
    \ here is to match the exceptions declared with @ExceptionHandler with the exception\
    \ used as argument of the method. If these don't match, the compiler will not\
    \ complain – no reason it should, and Spring will not complain either.\n\nHowever,\
    \ when the exception is actually thrown at runtime, the exception resolving mechanism\
    \ will fail with:\n\n```\njava.lang.IllegalStateException: No suitable resolver\
    \ for argument [0] [type=...\nHandlerMethod details: ...\n```\n\n## 5. Conclusion\n\
    \nWe discussed here several ways to implement an exception handling mechanism\
    \ for a REST API in Spring, starting with the older mechanism and continuing with\
    \ the Spring 3.2 support and into 4.0 and 4.1.\n\nIt's an Eclipse based project,\
    \ so it should be easy to import and run as it is.\n\n# 13: VERSIONING A REST\
    \ API\n\n## 1. The Problem\n\nEvolving a REST API is a difficult problem – one\
    \ for which many options are available. This section discusses through some of\
    \ these options.\n\n## 2. What is in the Contract?\n\nBefore anything else, we\
    \ need to answer one simple question: What is the Contract between the API and\
    \ the Client?\n\n### 2.1. URIs part of the Contract?\n\nLet's first consider the\
    \ URI structure of the REST API – is that part of the contract? Should clients\
    \ bookmark, hardcode and generally rely on URIs of the API?\n\nIf they would,\
    \ the interaction of the Client with the REST Service would no longer be driven\
    \ by the Service itself, but by what Roy Fielding calls out-of-band information:\n\
    \nA REST API should be entered with no prior knowledge beyond the initial URI\
    \ (bookmark) and set of standardized media types that are appropriate for the\
    \ intended audience...Failure implies that out-of-band information is driving\
    \ interaction instead of hypertext.\n\nSo clearly URIs are part of the contract!\n\
    \n### 2.2. Media Types part of the Contract?\n\nWhat about Media Types?\n\nIn\
    \ order to successfully consume the API, the Client and the Service need to support\
    \ the Vary HTTP header to indicate that there are multiple versions.\n\n## 3.\
    \ High Level Options\n\nNow that we have a clear concept of what is part of the\
    \ Contract between the Client and the Service, as well as a high level overview\
    \ of the options to version the API, let's discuss how to tackle it.\n\n- URI\
    \ Versioning\n- Media Type Versioning\n\n## 4. Advantages and Disadvantages\n\n\
    Now that we have a clear concept of what is part of the Contract between the Client\
    \ and the Service, as well as a high level overview of the options to version\
    \ the API, let's discuss the advantages and disadvantages of each.\n"
  mdcn: "\n\n# 使用 Spring4 构建 REST API\n\n## 4. 方案 3 – 新的 @ControllerAdvice（Spring\
    \ 3.2 及以上）\n\n```java\ncatch (ExceptionHandler ex) {\n    logger.warn(\"Handling\
    \ of \" + ex.getClass().getName() + \" \");\n    resulted in Exception\", handlerException);\n\
    }\nreturn null;\n}\n\nprivate ModelAndView handleIllegalArgument(\n    IllegalArgumentException\
    \ ex, HttpServletResponse response) throws IOException {\n    response.sendError(HttpServletResponse.SC_CONFLICT);\n\
    \    String accept = request.getHeader(HttpHeaders.ACCEPT);\n    return new ModelAndView();\n\
    }\n```\n\n这里需要注意的一个细节是请求头本身是可用的，因此应用程序可以考虑客户端发送的 Accept 头部的值。例如，如果客户端请求 `application/json`，那么在发生错误时，应用程序仍然应该返回用\
    \ `application/json` 编码的响应。\n\n另一个实现细节是返回了一个 `ModelAndView` —— 这是响应的主体，它允许应用程序设置任何必要的内容。\n\
    \n这种这种方法为 Spring REST 服务的错误处理提供了一种一致且易于配置的机制。然而，它也有其局限性：它与底层的 `HttpServletResponse`\
    \ 交互，并且符合使用 `ModelAndView` 的旧 MVC 模型 —— 所以它仍然有改进空间。\n\n## 4. 方案 3 – 新的 @ControllerAdvice（Spring\
    \ 3.2 及以上）\n\nSpring 3.2 通过新的 `@ControllerAdvice` 注解带来了对全局 `@ExceptionHandler`\
    \ 的支持。这使得我们能够摆脱旧的 MVC 模型，并使用 `ResponseEntity` 结合 `@ExceptionHandler` 的类型安全性和灵活性的机制。\n\
    \n```java\n@ControllerAdvice\npublic class ResponseEntityExceptionHandler extends\
    \ EntityExceptionHandler {\n\n    @ExceptionHandler(value = {IllegalIllegalArgumentException.class,\
    \ IllegalStateException.class})\n    protected ResponseEntity<Object> handleConflict(RuntimeException\
    \ ex, WebRequest request) {\n        String bodyOfResponse = \"This should be\
    \ application specific\";\n        return handleExceptionInternal(ex, bodyOfResponse,\
    \ new HttpHeaders(), HttpStatus.CONFLICT, request);\n    }\n}\n```\n\n新的注解允许将以前散落在各处的多个\
    \ `@ExceptionHandler` 合并到一个单一的全局错误处理组件中。\n\n实际的机制非常简单，但也非常灵活：\n\n- 它允许对响应主体以及状态码进行完全控制\n\
    - 它允许将多个异常映射到同一个方法进行统一处理\n- 它充分利用了较新的 RESTful `ResponseEntity` 响应\n\n这里需要记住的一点是将与\
    \ `@ExceptionHandler` 声明的异常与方法参数中使用的异常相匹配。如果它们不匹配，编译器不会报错 —— 没理由报错，Spring 也不会报错。\n\
    \n然而，当运行时抛出异常时，异常解析机制将失败并报错：\n\n```\njava.lang.IllegalStateException: No suitable\
    \ resolver for argument [0] [type=...\nHandlerMethod details: ...\n```\n\n## 5.\
    \ 结论\n\n在这里讨论了在 Spring 中实现 REST API 异常处理机制的几种方法，从旧机制开始，一直到 Spring 3.2 的支持，以及 4.0\
    \ 和 4.1。\n\n这是一个基于 Eclipse 的项目，所以很容易导入和运行。\n\n# 13：REST API 的版本控制\n\n## 1. 问题\n\
    \n演进 REST API 是一个困难的问题 —— 有许多选项可用。本节将讨论其中一些选项。\n\n## 2. 合约中包含什么？\n\n在考虑其他事情之前，我们需要回答一个简单的问题：API\
    \ 与客户端之间的契约（Contract）是什么？\n\n### 2.1. URI 是合约的一部分吗？\n\n让我们首先考虑 REST API 的 URI\
    \ 结构 —— 它是合约的一部分吗？客户端是否应该书签化、硬编码并通常依赖于 API 的 URI？\n\n如果他们这样做了，客户端与 REST 服务的交互将不再由服务本身驱动，而是由\
    \ Roy Fielding 所说的“带外信息（out-of-band information）”驱动的：\n\n一个 REST API 的进入除了初始 URI（书签）和适用于目标受众的一系列标准媒体类型之外，不应有任何先验知识……失败意味着交互是由带外信息驱动的，而不是超文本（hypertext）。\n\
    \n所以显然，URI 是合约的一部分！\n\n### 2.2. 媒体类型是合约的一部分吗？\n\n媒体类型（Media Types）呢？\n\n为了成功地消费\
    \ API，客户端和服务端需要支持 `Vary` HTTP 头部，以指示存在多个版本。\n\n## 3. 高级选项\n\n现在我们已经对客户端与服务之间合约的内容有了清晰的概念，并且对\
    \ API 版本控制的选项有了高级概述，让我们讨论一下如何解决这个问题。\n\n- URI 版本控制\n- 媒体类型版本控制\n\n## 4. 优点与缺点\n\
    \n现在我们已经对客户端与服务之间合约的内容有了清晰的概念，并且对 API 版本控制的选项有了高级概述，让我们讨论一下各自的优缺点。\n\n"
