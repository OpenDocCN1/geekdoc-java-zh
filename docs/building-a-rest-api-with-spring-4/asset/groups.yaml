- md: "\n## 3. Client-Server Communication – JSON only\n\n### 3.1. High Level Content\
    \ Negotiation\n\nEach HttpMessage implementation has one or several associated\
    \ MIME Types.\n\nWhen receiving a new request, Spring will **use the “Accept”\
    \ header to determine the media type** that it needs to respond with.\n\nIt will\
    \ then try to find a registered converter that is capable of handling that specific\
    \ media type – and it will use it to **convert the entity** and send back the\
    \ response.\n\nThe process is similar for receiving a request which contains JSON\
    \ information – the framework will **use the “Content-Type” header to determine\
    \ the media** type of the request body.\n\nIt will then search for a HttpMessageConverter\
    \ that can **convert the body** sent by the client to a Java Object.\n\nLet’s\
    \ clarify this with a **quick example:**\n\n- the Client sends a GET request to\
    \ /foo with the **Accept** header set to *application/json* – to get all *Foo*\
    \ resources as Json\n- the Foo Controller is hit and returns the corresponding\
    \ Foo Java entities\n- Spring then uses one of the Jackson message converters\
    \ to marshall the entities to json\n\nLet’s now look at the specifics of how this\
    \ works – and how we should leverage the @ResponseBody and @RequestBody annotations.\n\
    \n### 3.2. @ResponseBody\n\n@ResponseBody on a Controller method indicates to\
    \ Spring that **the return value of the method** is serialized directly to the\
    \ body of the HTTP Response. As discussed above, the “Accept” header specified\
    \ by the Client will be used to choose the appropriate Http Converter to marshall\
    \ the entity.\n\n## Building a REST API with Spring\n\nLet's look at a simple\
    \ example:\n\n```java\n@RequestMapping(method=RequestMethod.GET, value=\"/foos/{id}\"\
    )\npublic @ResponseBody Foo findById(@PathVariable long id) {\n    return fooService.get(id);\n\
    }\n```\n\nNow, the client will specify the \"Accept\" header to application/json\
    \ in the request - example curl command:\n\n```bash\ncurl --header \"Accept: application/json\"\
    \ http://localhost:8080/spring-rest/foos/1\n```\n\nThe Foo class:\n\n```java\n\
    public class Foo {\n    private long id;\n    private String name;\n}\n```\n\n\
    And the Http Response Body:\n\n```json\n{\n    \"id\": 1,\n    \"name\": \"Paul\"\
    \n}\n```\n\n### 3.3. @RequestBody\n\n@RequestBody is used on the argument of a\
    \ Controller method - it indicates to Spring that the body of the HTTP Request\
    \ is deserialized to that particular Java entity. As discussed previously, the\
    \ “Content-Type” header specified by the Client will be used to determine the\
    \ appropriate converter for this.\n\nLet's look at an example:\n\n```java\n@RequestMapping(method=RequestMethod.PUT,\
    \ value=\"/foo/{id}\")\npublic @ResponseBody void updateFoo(@RequestBody Foo foo,\
    \ @PathVariable String id) {\n    fooService.update(foo);\n}\n```\n\nNow, let's\
    \ consume this with a JSON object - we're specifying \"Content-Type\" to be application/json.\n\
    \n```bash\ncurl -i -X PUT \"Content-Type: application/json\" -d '{\"id\":\"83\"\
    ,\"name\":\"Klik\"}' http://localhost:8080/spring-rest/foo/1\n```\n\nWe get back\
    \ 200 OK – a successful response:\n\n```http\nHTTP/1.1 200 OK\nServer: Apache-Coyote/1.1\n\
    Content-Length: 0\nDate: Fri, 10 Jan 2014 11:18:54 GMT\n```\n\n## 4. Custom Converters\
    \ Configuration – adding XML Support\n\nWe can customize the message converters\
    \ by extending the WebMvcConfigurer class and overriding the configureMessageConverters\
    \ method:\n\n```java\n@EnableWebMvc\n@Configuration\n@ComponentScan(\"org.baeldung.web\"\
    )\npublic class WebMMvcConfig extends WebMvcConfigurerAdapter {\n\n    @Override\n\
    \    public void configureMessageConverters(List<? extends HttpMessageConverter>\
    \ converters) {\n        messageConverters.add(createXmlConverter());\n      \
    \  messageConverters.add(new MappingJackson2HttpMessageConverter());\n\n     \
    \   super.configureMessageConverters(converters);\n    }\n}\n```\n\n## Building\
    \ a REST API with Spring 4. Custom Converters Configuration – adding XML Support\n\
    \n```java\nprivate HttpMessageConverter<Object> createXmlHttpMessage() {\n  MarshallingHttpMessage\
    \ xmlConverter = \n    new MarshallingHttpMessage();\n\n  XStreamMarshaller xstreamMarshall\
    \ = new XStreamMarshaller();\n  xmlConverter.setSerializer(xstreamMarshall);\n\
    \  xmlConverter.setUnmarshaller(xstreamMarshall);\n\n  return xmlConverter;\n\
    }\n```\n\nNote that the XStream library now needs to be present on the classpath.\n\
    \nAlso be aware by extending this support class, we are losing the default message\
    \ converters which were previously pre-registered – we only have what we define.\n\
    \nLet's go over this example – we are creating a new converter – the MarshallingHttpMessageConverter\
    \ and we're using the Spring XStream support to configure it. This allows a great\
    \ deal of flexibility since we're working with the low level APIs of the underlying\
    \ marshalling framework – and in case XStream – we can configure however we want.\n\
    \nWe can now do the same for Jackson – by defining our Mapping.Jackson2HttpMessageConverter\
    \ we can now use a custom ObjectMapper on this converter and it has been configured\
    \ as we need.\n\nIn this case XStream is the selected marshaller/unmarshaller\
    \ implementation, but others like CastorMarshall can be used – refer to Spring\
    \ API documentation for full list of available marshallers.\n\nAt this point –\
    \ with XML enabled on the back end – we can consume the API with XML Representations:\n\
    \n```bash\ncurl --header \"Accept: application/xml\" http://localhost:8080/spring-rest/foos/1\n\
    ```\n\n## Using Spring’s RestTemplate with Message Converters\n\nAs well as the\
    \ server side, HTTP Message Conversion can be configured on the client side. We're\
    \ going to configure the template with \"Accept\" and \"Content-Type\" headers.\n\
    \n### 5.1. Retrieving the Resource with Accept Header\n\n```java\n@Test\npublic\
    \ void getFoo() {\n  String uri = \"http://localhost:8080/spring-rest/foos/{id}\"\
    ;\n  RestTemplate restTemplate = new RestTemplate();\n  Foo foo = restTemplate.getForObject(uri,\
    \ Foo.class);\n  assertEquals(new Integer(1), foo.getId());\n}\n```\n\n### 5.2.\
    \ Retrieving a Resource with application/xml Accept header\n\nLet's now explicitly\
    \ retrieve the Resource as XML – same way we did previously – and we're going\
    \ to set these on the RestTemplate.\n\n```java\n@Test\npublic void ConsumingXml_whenReadingTheFoo_thenCorrect()\
    \ {\n    String URI = \"http://localhost:8080/spring-rest/foos/{id}\";\n    RestTemplate\
    \ restTemplate = new RestTemplate();\n    restTemplate.setMessageConverters(getMessageConverters());\n\
    \n    HttpHeaders headers = new HttpHeaders();\n    headers.setAccept(Arrays.asList(MediaType.APPLICATION_XML));\n\
    \    HttpEntity<Foo> foo = new HttpEntity<>(headers);\n\n    ResponseEntity<Foo>\
    \ response = \n        restTemplate.exchange(URI, HttpMethod.GET, foo, Foo.class,\
    \ \"1\");\n    Foo resource = response.getBody();\n    assertThat(resource, notNullValue());\n\
    }\n\nprivate List<HttpMessageConverter<?>> getMessageConverters() {\n    List<HttpMessageConverter<?>>\
    \ converters = new ArrayList<HttpMessageConverter<?>>();\n    XStreamMarshaller\
    \ marshaller = new XStreamMarshaller();\n    MarshallingHttpMessageConverter marshallingConverter\
    \ = new MarshallingHttpMessageConverter(marshaller);\n    converters.add(marshallingConverter);\n\
    \    return converters;\n}\n```\n\n### 5.3. Retrieving a Resource with application/json\
    \ Accept header\n\nSimilarly, let's consume the REST API by asking for JSON:\n\
    \n```java\n@Test\npublic void ConsumingJson_whenReadingTheFoo_thenCorrect() {\n\
    \    String URI = \"http://localhost:8080/spring-rest/foos/{id}\";\n\n    RestTemplate\
    \ restTemplate = new RestTemplate();\n    restTemplate.setMessageConverters(getMessageConverters());\n\
    \n    HttpHeaders headers = new HttpHeaders();\n    headers.setAccept(Arrays.asList(MediaType.APPLICATION_JSON));\n\
    \    HttpEntity<Foo> foo = new HttpEntity<>(headers);\n\n    ResponseEntity<Foo>\
    \ response = \n        restTemplate.exchange(URI, HttpMethod.GET, foo, Foo.class,\
    \ \"1\");\n    Foo resource = response.getBody();\n}\n```\n"
  mdcn: "\n\n## 3. 客户端-服务器通信 – 仅限 JSON\n\n### 3.1. 高级内容协商\n\n每个 HttpMessage 实现都有一个或多个相关的\
    \ MIME 类型。\n\n当接收到新请求时，Spring 将**使用“Accept”请求头来确定它需要响应的媒体类型**。\n\n随后，它将尝试寻找一个能够处理该特定媒体类型的注册转换器（converter）——并使用它来**转换实体**并返回响应。\n\
