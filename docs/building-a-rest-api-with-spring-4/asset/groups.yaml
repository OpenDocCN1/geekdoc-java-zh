  - "[PAGE 45]\n\n# 6: BASIC AND DIGEST AUTHENTICATION FOR A REST SERVICE WITH SPRING\
    \ SECURITY\n\n# 1. Overview\n\nThis section discusses how to **set up both Basic\
    \ and Digest Authentication on the same URI structure of a REST API**. In the\
    \ two previous sections, we discussed another method of securing the REST Service\
    \ - form based authentication, so Basic and Digest authentication is the natural\
    \ alternative, as well as the RESTful one.\n\n# 2. Configuration of Basic Authentication\n\
    \nThe main reason that form based authentication is not ideal for a RESTful Service\
    \ is that Spring Security will make **use of Sessions** - this of course on the\
    \ server, **the statelessness constraints in REST** is practically ignored.\n\n\
    We'll start by setting up Basic Authentication – first we remove the old custom\
    \ entry point and filter from the `<http>` security element:\n\n```\n<http create-session=\"\
    stateless\">\n  <intercept-url pattern=\"/api/admin/**\" access=\"ROLE_ADMIN\"\
    \ />\n\n<http-basic />\n</http>\n```\n\nNote how support for basic authentication\
    \ has been added with a single configuration line - `<http-basic />` - which handles\
    \ the creation and wiring of both the `BasicAuthenticationFilter` and the `BasicAuthenticationEntryPoint`."
- md: "\n## 2.1. Satisfying the stateless constraint – getting rid of sessions\n\n\
    One of the main constraints of the RESTful architectural style is that the client-server\
    \ communication is fully stateless, as the original dissertation reads:\n\n###\
    \ 5.1.3. Stateless\nWe add a constraint to the client-server interaction: communication\
    \ must be stateless in nature, as in the client-stateless-server (CSS) style of\
    \ Section 3.4.3 (Figure 5-3), such that each request from client to server must\
    \ contain all of the information necessary to understand the request, and cannot\
    \ take advantage of any stored context on the server. Session state is therefore\
    \ kept entirely on the client.\n\nThe concept of Session on the server is with\
    \ a long history in Spring Security, and removing it has been difficult until\
    \ now, especially when configuration was done by using the namespace. However,\
    \ Spring Security 3.1 augments the namespace configuration with a new stateless\
    \ option for session creation, which effectively guarantees that no session will\
    \ be created or used by Spring. What this new option does completely removes all\
    \ session related filters from the security filter chain, ensuring that authentication\
    \ is performed for each request.\n\n## 3. Configuration of Digest Authentication\n\
    \nStarting with the previous configuration, the filter and entry point necessary\
    \ to set up digest authentication will be defined as beans. Then, the digest entry\
    \ point created by <http-basic> behind the scenes. Finally, the custom digest\
    \ filter will be introduced in the security filter chain using the after semantics\
    \ of the security namespace to position it directly after the basic authentication\
    \ filter.\n\n## Building a REST API with Spring4\n\n## 4. Supporting authentication\
    \ protocols in the same RESTful service\n\n```xml\n<http create-session=\"stateless\"\
    \ entry-point-ref=\"digestEntryPoint\">\n  <intercept-url pattern=\"api/admin/**\"\
    \ access=\"ROLE_ADMIN\" />\n</http>\n\n<http-basic>\n  <custom-filter ref=\"digestFilter\"\
    \ after=\"BASIC_AUTH_FILTER\" />\n</http>\n\n<bean id=\"digestFilter\" class=\"\
    org.springframework.security.web.authentication.DigestFilter\">\n  <beans:property\
    \ name=\"userDetailsService\" ref=\"userService\" />\n  <beans:property name=\"\
    authenticationEntryPoint\" ref=\"digestEntryPoint\" />\n</beans:bean>\n\n<bean\
    \ id=\"digestEntryPoint\" class=\"org.springframework.security.web.authentication.DigestAuthenticationEntryPoint\"\
    >\n  <beans:property name=\"realmName\" value=\"Contacts Realm via Digest Authentication\"\
    \ />\n  <beans:property name=\"key\" value=\"acegi\" />\n</beans:bean>\n\n<authentication-manager>\n\
    \  <authentication-provider>\n    <user-service id=\"userService\" />\n    <user\
    \ name=\"eparasiv\" password=\"eparasiv\" authorities=\"ROLE_ADMIN\" />\n    <user\
    \ name=\"user\" password=\"user\" authorities=\"ROLE_USER\" />\n  </authentication-provider>\n\
    </authentication-manager>\n```\n\nUnfortunately there is no support in the security\
    \ namespace to automatically configure the digest authentication the way basic\
    \ authentication can be configured with <http-basic>. Because of that, the necessary\
    \ beans had to be defined and wired manually into the security configuration.\n\
    \n## 4. Supporting authentication protocols in the same RESTful service\n\nBasic\
    \ or Digest authentication can be easily implemented in Spring Security 3.x; it\
    \ is supporting both of them for the same RESTful web service, on the same URI\
    \ mappings introduces a new level of complexity in the configuration and testing\
    \ of the service.\n\n## 4.1. Anonymous request\n\nWith both basic and digest filters\
    \ in the security chain, the way a anonymous request – a request containing no\
    \ authentication credentials (Authorization HTTP header) is processed by Spring\
    \ Security is the two authentication filters find no credentials and will continue\
    \ execution of the filter chain. Then, seeing how the request wasn't authenticated,\
    \ an AccessDeniedException is thrown and caught in the ExceptionTranslationFilter,\
    \ which commences the digest entry point, prompting the client for credentials.\n\
    \nThe responsibilities of both basic and digest filters are very narrow – they\
    \ will continue to execute the security filter chain if they are unable to identify\
    \ the type of authentication credentials in the request. It is because of that\
    \ Spring Security can have the flexibility to be configured with support for multiple\
    \ authentication protocols on the same URI.\n\nWhen a request is containing the\
    \ correct authentication credentials – either basic or digest – that protocol\
    \ will be rightly used. However, for an anonymous request, the client will get\
    \ prompted only for digest authentication credentials. This is because the digest\
    \ entry point is configured as the main and single entry point of the Spring Security\
    \ chain; as such digest authentication can be considered the default.\n\n## 4.2.\
    \ Request with authentication credentials\n\nA request with credentials for Basic\
    \ authentication will be identified by the Authorization header starting with\
    \ the prefix “Basic”. When processing such a request, the credentials will be\
    \ decoded in the basic authentication filter and the request will be authorized.\
    \ Similarly, a request with credentials for Digest authentication will use the\
    \ prefix “Digest” for it’s Authorization header.\n\n## 5. Testing both scenarios\n\
    \nThe tests will consume the REST service by creating a new resource after authenticating\
    \ with either basic or digest:\n\n## Building a REST API with Spring4\n\n## 5.\
    \ Testing both scenarios\n\n```java\n@Test\npublic void givenAuthenticatedByBasicAuth_whenARourcesCreated_then201IsReceived(){\n\
    // Given\n// When\nResponse response = given()\n.auth(digest).preemptively(basic(ADMIN_USERNAME,\
    \ ADMIN_PASSWORD))\n.contentType(HttpStatus.MIME_JSON).body(new Foo(randomAlphabetic(\
    \ 6 ))\n.post(paths.getFooURL());\n\n// Then\nassertThat(response.getStatusCode(),\
    \ is( 201 ));\n}\n@Test\npublic void givenAuthenticatedByDigestAuth_whenARourcesCreated_then201IsReceived(){\n\
    // Given\n// When\nResponse response = given()\n.auth(digest).preemptively(basic(ADMIN_USERNAME,\
    \ ADMIN_PASSWORD))\n.contentType(HttpStatus.MIME_JSON).body(new Foo(randomAlphabetic(\
    \ 6 ))\n.post(paths.getFooURL());\n\n// Then\nassertThat(response.getStatusCode(),\
    \ is( 201 ));\n}\n```\n\nNote that the test using basic authentication adds credentials\
    \ to the request preemptively, regardless if the server has challenged for not.\
    \ This is to ensure that.\n\n## 6. Conclusion\n\nThis section covered the configuration\
    \ and implementation of both Basic and Digest authentication for a RESTful service,\
    \ using Spring Security 3.0 namespace as well as new features added by 3.1.\n\n\
    For the full implementation, check out the github project.\n\n## Building a REST\
    \ API with Spring4\n\n## 7. HTTP MESSAGE CONVERTERS WITH THE SPRING FRAME\n\n\
    ## 1. Overview\n\nThis section describes how to Configure HttpConverter in Spring.\
    \ Simply put, message converters are used to marshall and unmarshall Java Objects\
    \ to and from JSON, XML, etc. - over HTTP.\n\n## 2. The Basics\n\n### 2.1. Enable\
    \ Web MVC\n\nThe Web Application needs to be configured with Spring MVC support\
    \ - one convenient and very customizable way to do this is to use the `@EnableWebMvc`\
    \ annotation:\n\n```java\n@EnableWebMvc\n@Configuration\n@ComponentScan(\"org.baeldung.web\"\
    )\npublic class WebConfig extends WebMvcConfigurerAdapter {\n}\n```\n\n## Building\
    \ a REST API with Spring4\n\n### 2.. The Default Message Converters\n\nNote that\
    \ this class extends WebMvcConfigurerAdapter – which will allow us to change the\
    \ default list of Http Converters with our own.\n\n###2.2. The Default Message\
    \ Converters\n\nBy default, the following HttpMessageConverters instances are\
    \ pre-enabled:\n\n- ByteArrayHttpMessageConverter - converts byte arrays\n- StringHttpMessageConverter\
    \ - converts Strings\n- ResourceHttpMessageConverter – converts org.springframework.core.io.Resource\
    \ for any type of octet stream\n- SourceHttpMessageConverter – converts javax.xml.transform.Source\n\
    - FormHttpMessageConverter – converts form data to/from a MultiValueMap<String,\
    \ String>\n- Jaxb2RootElementHttpMessageConverter – converts Java objects to/from\
    \ XML (added only if JAXB2 is present on the classpath)\n- MappingJackson2HttpMessageConverter\
    \ – converts JSON (added only if Jackson 2 is present on the classpath)\n- MappingJacksonHttpMessageConverter\
    \ – converts JSON (added only if Jackson is present on the classpath)\n- AtomFeedHttpMessageConverter\
    \ – converts Atom feeds (added only if Rome is present on the classpath)\n- RssChannelHttpMessageConverter\
    \ – converts RSS feeds (added only if Rome is present on the classpath)\n\n##\
    \ Building a REST API with Spring4\n"
  mdcn: "\n\n## 2.1. 满足无状态约束 – 移除 Session\n\nRESTful 架构风格的主要约束之一是客户端与服务器之间的通信完全无状态的，正如原文所示：\n\
    \n### 5.1.3. 无状态\n我们为客户端-服务器交互添加了一个约束：通信在本质上是无状态的，如第 3.4.3 节中的客户端无状态服务器（CSS）风格（图\
    \ 5-3），因此从客户端到服务器的每个请求必须包含理解该请求所需的所有信息，且不能利用服务器上存储的任何上下文。因此，Session 状态完全保留在客户端。\n\
    \n服务器端的 Session 概念在 Spring Security 中有着悠久的历史，直到现在移除它一直非常困难，特别是当使用命名空间进行配置时。然而，Spring\
    \ Security 3.1 为命名空间配置增加了一个新的 `stateless` 选项用于创建会，这有效地保证了 Spring 不会创建或使用会。此新选项完全从安全过滤器链中移除了所有与会\
    \ 相关的过滤器，确保每个请求都执行身份验证。\n\n## 3. 摘要认证（Digest Authentication）的配置\n\n从之前的配置开始，设置摘要认证所需的过滤器和入口点（entry\
    \ point）将被定义为 bean。然后，由 `<http-basic>` 在后台创建摘要入口点。最后，将使用安全命名空间的 `after` 语义在安全过滤器链中引入自定义的摘要过滤器，将其直接放置在基础认证过滤器的之后。\n\
    \n## 使用 Spring4 构建 REST API\n\n## 4. 在同一个 RESTful 服务中支持多种身份验证协议\n\n```xml\n<http\
    \ create-session=\"stateless\" entry-point-ref=\"digestEntryPoint\">\n  <intercept-url\
    \ pattern=\"api/admin/**\" access=\"ROLE_ADMIN\" />\n</http>\n\n<http-basic>\n\
    \  <custom-filter ref=\"digestFilter\" after=\"BASIC_AUTH_FILTER\" />\n</http>\n\
    \n<bean id=\"digestFilter\" class=\"org.springframework.security.web.authentication.DigestFilter\"\
    >\n  <beans:property name=\"userDetailsService\" ref=\"userService\" />\n  <beans:property\
    \ name=\"authenticationEntryPoint\" ref=\"digestEntryPoint\" />\n</beans:bean>\n\
    \n<bean id=\"digestEntryPoint\" class=\"org.springframework.security.web.authentication.DigestAuthenticationEntryPoint\"\
    >\n  <beans:property name=\"realmName\" value=\"Contacts Realm via Digest Authentication\"\
    \ />\n  <beans:property name=\"key\" value=\"acegi\" />\n</beans:bean>\n\n<authentication-manager>\n\
    \  <authentication-provider>\n    <user-service id=\"userService\" />\n    <user\
    \ name=\"eparasiv\" password=\"eparasiv\" authorities=\"ROLE_ADMIN\" />\n    <user\
    \ name=\"user\" password=\"user\" authorities=\"ROLE_USER\" />\n  </authentication-provider>\n\
    </authentication-manager>\n```\n\n遗憾的是，安全命名空间并不支持像通过 `<http-basic>` 配置基础认证那样自动配置摘要认证。由于由于，必须手动定义并将必要的\
    \ bean 组接到安全配置中。\n\n## 4. 在同一个 RESTful 服务中支持多种身份验证协议\n\n基础（Basic）或摘要（Digest）认证可以在\
    \ Spring Security 3.x 中轻松实现；但在同一个 RESTful Web 服务的同一个 URI 映射上同时支持这两种认证，会为服务的配置和测试引入新的复杂性。\n\
    \n## 4.1. 匿名请求\n\n由于安全链中同时存在基础过滤器和摘要过滤器，Spring Security 处理匿名请求（即不包含身份验证凭据的 HTTP\
    \ Authorization 头）的方式是：两个身份验证过滤器都未找到凭据并将继续执行过滤器链。随后，由于请求未通过身份验证，将抛出 `AccessDeniedException`\
    \ 并在 `ExceptionTranslationFilter` 中被捕获，启动摘要入口点，提示客户端提供凭据。\n\n基础和摘要过滤器的职责非常窄——如果它们无法识别请求中的身份验证凭据类型，它们将继续执行安全过滤器链。正因为如此，Spring\
    \ Security 具有灵活性，可以配置在同一个 URI 上支持多种身份验证协议。\n\n当请求包含正确的身份验证凭据（无论是基础还是摘要）时，将正确使用该协议。然而，对于匿名请求，客户端仅会被提示摘要认证凭据。这是因为摘要入口点被配置为\
    \ Spring Security 链的主且唯一入口点；因此，摘要认证可以视为默认认证。\n\n## 4.2. 带有身份验证凭据的请求\n\n带有基础认证凭据的请求将通过以“Basic”开头的\
    \ Authorization 头来识别。处理此类请求时，凭据将在基础认证过滤器中解码并对请求进行授权。同理，带有摘要认证凭据的请求其 Authorization\
    \ 头将使用前缀“Digest”。\n\n## 5. 测试两种场景\n\n测试将通过在通过基础或或摘要认证后创建一个新资源来消耗 REST 服务：\n\n\
    ## 使用 Spring4 构建 REST API\n\n## 5. 测试两种场景\n\n```java\n@Test\npublic void givenAuthenticatedByBasicAuth_whenARourcesCreated_then201IsReceived(){\n\
    // Given\n// When\nResponse response = given()\n.auth(digest).preemptively(basic(ADMIN_USERNAME,\
    \ ADMIN_PASSWORD))\n.contentType(HttpStatus.MIME_JSON).body(new Foo(randomAlphabetic(\
    \ 6 ))\n.post(paths.getFooURL());\n\n// Then\nassertThat(response.getStatusCode(),\
