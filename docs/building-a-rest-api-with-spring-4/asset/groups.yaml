    \n# 12: 使用 Spring 进行 REST 异常处理\n\n## 1. 概述\n\n本节将关注**如何使用 Spring 为 REST API 实现异常处理**。我们将查看\
    \ Spring 3.2 和 4.x 推荐的解决方案，也会查看所有旧选项。\n\n**在 Spring 3.2 之前**，在 Spring MVC 中处理异常的两种主要方法：`ExceptionHandlerResolver`\
    \ 或 `@ExceptionHandler` 注解。这两者都有一些明显的缺点。\n\n**3.2 之后**，我们现在有了新的 @ControllerAdvice\
    \ 注解来解决之前两个解决方案的局限性。\n\n所有这些方案都有共同点——它们很好地处理了**关注点分离**。应用程序可以正常地抛出异常来表示某种故障——这些异常将由单独处理。\n\
    \n## 2. 方案 1 – Controller 级别的 @ExceptionHandler\n\n第一个方案在 @Controller 级别工作——我们将定义一个方法来处理异常，并用\
    \ @ExceptionHandler 标注它。\n\n# 使用 Spring 构建 REST API\n\n## 3. 方案 2 – HandlerExceptionResolver\n\
    \n```java\npublic class FooController{\n    @ExceptionHandler(CustomException1.class,\
    \ CustomException2.class)\n    public void handleException() {\n        //\n \
    \   }\n}\n```\n\n这种方法有一个主要的缺点——被 @ExceptionHandler 注解的方法只对该特定的 Controller 有效，而不是对整个应用程序全局。在每个控制器中添加此内容使其不适用于通用的异常处理机制。\n\
    \n这种局限性通常通过让所有 Controller 继承一个 Base Controller 类来解决——然而，对于应用程序来说，这可能会是一个问题，因为由于某些原因，Controller\
    \ 无法继承另一个基类（该基类可能在另一个 jar 包中或无法直接修改），或者它们本身无法修改。\n\n接下来，我们将查看另一种解决异常问题的方法。\n\n\
