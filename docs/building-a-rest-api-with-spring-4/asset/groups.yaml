- md: "\nBuilding a REST API with Spring4\n\n## 5.4. Update a Resource with XML Content-Type\n\
    \n```java\nassertThat(resource, notNullValue());\nprivate List<HttpMessageConverter<?>>\
    \ getMessageConverters() {\n    List<HttpMessageConverter<?>> converters = new\
    \ ArrayList<HttpMessageConverter<?>>();\n    converters.add(new MappingJackson2HttpMessageConverter());\n\
    \    return converters;\n}\n```\n\n# 5.4. Update a Resource with XML Content-Type\n\
    \nFinally, let's also send JSON to the REST API and specify the media type of\
    \ that data via the Content-Type header:\n\n```java\n@Test\npublic void givenConsumingXml_whenWritingTheFoo_thenCorrect()\
    \ {\n    String URI = BASE_URI + \"foo/{id}\";\n    RestTemplate restTemplate\
    \ = new RestTemplate();\n    restTemplate.setMessageConverters(getMessageConverters());\n\
    \n    Foo resource = new Foo(4, \"json\");\n    HttpHeaders headers = new HttpHeaders();\n\
    \    headers.setAccept(Arrays.asList(MediaType.APPLICATION_JSON));\n    headers.setContentType(MediaType.APPLICATION_XML);\n\
    \    HttpEntity<Foo> entity = new HttpEntity<>(resource, headers);\n\n    ResponseEntity<Foo>\
    \ response =\n        restTemplate.exchange(URI, HttpMethod.PUT, entity, Foo.class);\n\
    \    Foo fooResponse = response.getBody();\n\n    Assert.assertEquals(resource.getId(),\
    \ fooResponse.getId());\n}\n```\n\nWhat we're interested in here is that we're\
    \ able to mix media types - we are sending XML data but we're waiting for JSON\
    \ back from the server. This shows just how powerful the Spring conversion mechanism\
    \ is.\n\n## 6. Conclusion\n\nIn this section, we looked at how Spring MVC allows\
    \ us to specify and fully customize Message Converters to automatically marshall/unmarshall\
    \ Java Entities to and from XML or JSON. This is of course a simplistic definition,\
    \ and there is much more that the message conversion mechanism can do - as we\
    \ see from the last test. We also looked at how to leverage the same mechanism\
    \ with RestTemplate - leading to a fully type-safe way of consuming the API. This\
    \ is an Eclipse project, so it should be easy to import and run.\n\n# 8. REST\
    \ API DISCOVERABILITY AND HATEOAS\n\n## 1. Overview\n\nThe section will focus\
    \ on Discoverability of the REST API, HATEOAS and practical scenarios driven by\
    \ tests.\n\n## 2. Why make the API Discoverable\n\nDiscoverability of an API is\
    \ a topic that doesn't get enough attention, and as a consequence few APIs get\
    \ right. It is also something that, if done correctly, can make the API not only\
    \ RESTful but also elegant. To understand discoverability you need to understand\
    \ the constraint of Hypermedia As The State (HATEOAS); this constraint of REST\
    \ API is about full discoverability of actions/transitions on a Resource. If interaction\
    \ is to be driven by the API itself, then the server should be descriptive enough\
    \ to instruct the client how to use the API via hypertext, which may be the Link\
    \ header.\n\n## 3. Discoverability Scenarios (Driven by tests)\n\nDoes it mean\
    \ for a REST service to be discoverable? Throughout this section, we will test\
    \ individual traits of discoverability using JUnit, rest-assured and Hamcrest.\
    \ Since the REST Service has been previously secured, each test needs to authenticate\
    \ before consuming the API.\n\n### 3.1. Discover the valid HTTP methods\n\nWhen\
    \ a REST Service is consumed with an invalid HTTP method, the response should\
    \ be 405 METHOD NOT ALLOWED; in addition, it should also help the client discover\
    \ the HTTP methods that are allowed for that particular Resource using the Allow\
    \ Header:\n\n```java\n@Test\npublic void whenPOSTIsSentToValidResource_thenAllowHeaderListsAllowedActions()\
    \ {\n  // Given\n  String uriOfExistingResource = restTemplate.createResource();\n\
    \n  // When\n  Response res = givenAuth().post(uriOfExistingResource);\n\n  //\
    \ Then\n  String allowHeader = res.getHeader(HttpHeaders.ALLOW);\n  assertThat(allowHeader,\
    \ anyOf(containsString(\"GET\"), containsString(\"PUT\"), containsString(\"DELETE\"\
    )));\n}\n```\n\n### 3.2. Discover the URI of the newly created Resource\n\nThe\
    \ operation of creating a new Resource should always include the URI of the newly\
    \ created resource in the response, using the Location Header. If the client does\
    \ a GET on that URI, the resource should be available:\n\n### 3.3. Discover the\
    \ URI to GET All Resources of type\n\n```java\n@Test\npublic void whenResourcesCreated_thenUriOfTheCreatedResourcesDiscoverable()\
    \ {\n  // When\n  Foo newResource = new Foo(randomAlphabetic(6));\n  Response\
    \ resp = givenAuth().contentType(\"application/json\")\n    body(newResource).post(fooURI);\n\
    \  String uriOfNewResource = resp.getHeader(HttpHeaders.LOCATION);\n\n  // Then\n\
    \  Response response = givenAuth().header(HttpHeaders.ACCEPT, \"application/json\"\
    )\n    get(uriOfNewResource);\n\n  Foo resourceFromServer = response.body(Foo.class);\n\
    \  assertThat(newResource, equalTo(resourceFromServer));\n}\n```\n\nThe test follows\
    \ a simple scenario: a new *Foo* is created and the HTTP response is used to discover\
    \ the URI where the Resource is now accessible. The tests then go one step further\
    \ and do a GET on that URI to retrieve the resource and compare it to the original,\
    \ and make sure it has been correctly persisted.\n\nWhen we GET any particular\
    \ *Foo* resource, we should be able to discover what we can do next: we can list\
    \ all the available *Foo resources*. Thus, the operation of retrieving a resource\
    \ should always include in its response the URI to get all the resources of that\
    \ type, making use of the **Link** header:\n\n```java\n@Test\npublic void whenResourcesRetrieved_thenUriToGetAllResourcesIsDiscoverable()\
    \ {\n  // When\n  String uriOfExistingResource = createAsUri();\n\n  // When\n\
    \  Response getResponse = givenAuth().get(uriOfExistingResource);\n\n  // Then\n\
    \  String uriToAllResources = HTTPLinkHeaderUtil\n    .extractUriByRel(getResponse.getHeader(\"\
    Link\"), \"collection\");\n\n  Response getAllResponse = givenAuth().get(uriToAllResources);\n\
    \  assertThat(getAllResponse.getStatusCode(), is(200));\n}\n```\n\n## 4. Other\
    \ potential discoverable URIs and microformats\n\nNote that the full low-level\
    \ code for `extractURIByRel` - responsible for extracting the URIs by rel relation\
    \ is shown here.\n\nThis test covers the thorny subject of Link Relations in REST:\
    \ the URI to retrieve all resources uses the rel=\"collection\" semantics. This\
    \ type of link relation has not yet been standardized, but is already in use by\
    \ several microformats and proposed for standardization. Usage of non-standard\
    \ link relations opens the discussion about microformats and richer semantics\
    \ in RESTful servers.\n"
