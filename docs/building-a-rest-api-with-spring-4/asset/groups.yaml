- md: "\n## 5. Conclusion\n\nWe have seen how a REST API is fully discoverable from\
    \ the root and with no prior knowledge - meaning the client is able to navigate\
    \ it by doing a GET on the root. Moving forward, all state changes are driven\
    \ by the client using the available and discoverable transitions that the REST\
    \ API provides in representations (hence Representational State Transfer).\n\n\
    This section covered some of the traits of discoverability in the context of a\
    \ REST web service, discussing HTTP method discovery, the relation between create\
    \ and get, discovery of the URI to get all resources, etc.\n\nThe implementation\
    \ of all these examples and code snippets can be found in my github project -\
    \ this is an Eclipse based project, so it should be easy to import and run as\
    \ it is.\n\n# Building a REST API with Spring 4\n\n## 9: HATEOAS FOR A SPRING\
    \ REST SERVICE\n\n### 1. Overview\n\nThis section will focus on the implementation\
    \ of discoverability in a Spring REST Service and on satisfying the HATEOAS constraint.\n\
    \n### 2. Decouple Discoverability through events\n\nDiscoverability as a separate\
    \ aspect or concern of the web layer should be decoupled from the controller handling\
    \ the HTTP request. In order to do so, the Controller will fire off events for\
    \ all the actions that require additional manipulation of the HTTP response.\n\
    \nFirst, the events:\n\n```java\npublic class SingleResourceRetrieved extends\
    \ ApplicationEvent {\n    private HttpServletResponse response;\n\n    public\
    \ SingleResourceRetrieved(Object source,\n        HttpServletResponse response)\
    \ {\n        super(source);\n        this.response = response;\n    }\n\n    public\
    \ HttpServletResponse getResponse() {\n        return response;\n    }\n}\npublic\
    \ class ResourceCreated extends ApplicationEvent {\n    private HttpServletResponse\
    \ response;\n    private long idOfNewResource;\n\n    public ResourceCreated(Object\
    \ source,\n        HttpServletResponse response, long idOfNewResource) {\n   \
    \     super(source);\n```\n\nBuilding a REST API with Spring 4\n\n### 2. Decouple\
    \ Discoverability through events\n\n```java\nthis.response = response;\nthis.idOfNewResource\
    \ = idOfNewResource;\n}\npublic HttpServletResponse getResponse() {\n    return\
    \ response;\n}\npublic long getIdOfNewResource() {\n    return idOfNewResource;\n\
    }\n```\n\nThen, the Controller, with 2 simple operations - find by id and create:\n\
    \n```java\n@Controller\n@RequestMapping(value = \"/foos\")\npublic class FooController\
    \ {\n\n    @Autowired\n    private ApplicationEvent eventPublisher;\n\n    @Autowired\n\
    \    private FooService service;\n\n    @RequestMapping(value = \"foos/{id}\"\
    , method = RequestMethod.GET)\n    @ResponseBody\n    public Foo findById(@PathVariable(\"\
    id\") Long id, HttpServletResponse response) {\n        Foo resourceById = Preconditions.checkNotNull(service.findOne(id));\n\
    \        eventPublisher.publishEvent(new SingleResourceRetrieved(this, resourceById));\n\
    \        return resourceById;\n    }\n\n    @RequestMapping(method=RequestMethod.POST)\n\
    \    @ResponseStatus(HttpStatus.CREATED)\n    public void create(@RequestBody\
    \ Foo resource, HttpServletResponse response) {\n        Preconditions.checkNotNull(resource);\n\
    \        Long id = service.create(resource).getId();\n        eventPublisher.publishEvent(new\
    \ ResourceCreated(this, response));\n    }\n}\n```\n\nThese events can be handled\
    \ by any number of decoupled listeners, each focusing on it’s particular case\
    \ and each moving towards satisfying the overall HATEOAS constraint.\n\nThe listeners\
    \ should be the last objects in the call stack and no direct access to them is\
    \ necessary; as such are not public.\n\n### 3. Make the URI of a newly created\
    \ Resource discoverable\n\nAs discussed in the previous section on HATEOAS, the\
    \ operation of creating a new Resource should return the URI of that resource\
    \ in the Location HTTP header of the response; this is returned by a listener:\n\
    \n```java\n@Component\nclass ResourceCreatedDiscoverabilityListener\nimplements\
    \ ApplicationListener<ResourceCreated>{\n    @Override\n    public void onApplicationEvent(ResourceCreated\
    \ resourceCreatedEvent) {\n        Preconditions.notNull(resourceCreatedEvent);\n\
    \n        HttpServletResponse response = resourceCreated.getResponse();\n    \
    \    long idOfNewResource = resourceCreated.getIdOfNewResource();\n\n        addLinkHeaderOnResourceCreation(response,\
    \ idOfNewResource);\n    }\n    void addLinkHeaderOnResourceCreation(HttpServletResponse\
    \ response, ) {\n        Uri uri = ServletUriComponentsBuilder.fromCurrentRequest().path(\"\
    /{idOfNewResource}\").buildAndExpand(idOfNewResource).toUri();\n        response.setHeader(\"\
    Location\", uri.toASCIIString());\n    }\n}\n```\n\nWe are now using the ServletUriComponentsBuilder\
    \ - this was introduced in Spring 3.1 to help with using the current Request.\
    \ This way, we don't need to pass anything around and we can simply access this\
    \ statically.\n\nIf the API would return ResponseEntity - we could also use the\
    \ Location support introduced here.\n\n### 4. Get of single Resource\n\nOn retrieving\
    \ a single Resource, the client should be able to discover the URI to get all\
    \ Resources of that particular type:\n\nBuilding REST API with Spring 4\n\n```java\n\
    @Component\nclass SingleResourceRetrievedDiscoveryabilityListener\nimplements\
    \ ApplicationListener<SingleResourceRetrieved>{\n    @Override\n    public void\
    \ onApplicationEvent(SingleResourceRetrieved resourceRetrievedEvent) {\n     \
    \   Preconditions.checkNull(resourceRetrievedEvent);\n    }\n    HttpServletResponse\
    \ response = resourceRetrievedEvent.getResponse();\n    addLinkHeaderOnSingleResourceRetrieval(request,\
    \ response);\n    }\n    void addLinkHeaderOnSingleResourceRetrieval(HttpServletResponse\
    \ response) {\n        String requestURL = ServletUriComponentsBuilder.fromCurrentRequest().path(toSlash()).build().toString();\n\
    \        int positionOfSlash = requestURL.indexOf(\"/\");\n        String uriForCreation\
    \ = requestURL.substring(0, positionOfSlash);\n        String linkValue = LinkUtil.createLinkHeader(uriForCreation,\
    \ \"collection\");\n        response.addHeader(\"Link\", linkValue);\n    }\n\
    }\n```\n\n**Note** the semantics of the link make use of several microformats,\
    \ but not yet standardized.\n\nThe Link header is one of the most used HTTP header\
    \ for the purposes of discoverability. The utility to create this is simple:\n\
    \n```java\npublic final class LinkUtil {\n    public static String createLinkHeader(String\
    \ uri, String rel) {\n        return \"<\" + uri + \"\\\";rel=\\\"\" + rel + \"\
    \\\"\";\n    }\n}\n```\n\n### 5. Discoverability at the Root\n\nThe root is the\
    \ entry point in the entire service -it the root is the entry point in the entire\
    \ service - it is what the client comes into contact when consuming the API for\
    \ the first time. The HATEOAS constraint is to be considered and implemented throughout,\
    \ then this is the place to start. The fact that **all main URIs of the system\
    \ have to be discoverable from the root** shouldn't come as much of a surprise\
    \ by this point.\n\nBuilding a REST API with Spring 4\n\n### 5.1. Discoverability\
    \ is not about changing URIs\n\nLet's look at the controller for this:\n\n```java\n\
    @RequestMapping(value = \"admin\",method = RequestMethod.GET)\n@ResponseStatus(value\
    \ = HttpStatus.NO_CONTENT)\npublic void adminRoot(HttpServletRequest request,\
    \ HttpServletResponse response) {\n    String rootURI = request.getURI().toString();\n\
    \    URI fooUri = new UriTemplate(\"{rootURI}/resource\").expand(rootURI, \"foo\"\
    );\n    String linkToFoo = LinkUtil.createLinkHeader(fooUri.toASCII(), \"collection\"\
    );\n    response.addHeader(\"Link\", linkToFoo);\n}\n```\n\nThis is of course\
    \ an illustration of the concept, focusing on a single, sample URI, for Foo Resources\
    \ - a real implementation should add, similarly, URIs for all the Resources published\
    \ to the client.\n\nThis can be a controversial point - the one hand, the purpose\
    \ of HATEOAS is to have the client discover the URIs of the API and not rely on\
    \ hardcoded values. On the other hand - this is not how the web works: yes, URIs\
    \ are discovered, but they are also bookmarked.\n\nA subtle but important distinction\
    \ is evolution of the API - the old URIs should still work, but any client that\
    \ will discover the API should discover the new URIs - allows the API to change\
    \ dynamically, and good clients to work well when the API changes.\n\n## 6. Caveats\
    \ of Discoverability\n\nAs some of the discussions around the previous articles\
    \ state, the first goal of discoverability is to make minimal or no use of documentation\
    \ and have the client learn and understand how to use the API via the responses\
    \ it gets. In fact, this shouldn't be regarded as such a far\n"
  mdcn: "\n\n## 5. 结论\n\n我们已经看到 REST API 如何从根路径在没有任何先验知识的情况下完全可发现——这意味着客户端能够通过对根路径执行\
    \ `GET` 请求来导航它。未来，所有的状态更改都由客户端驱动，使用 REST API 在表示中提供的可用且可发现的转换（因此称为表示态转移，Representational\
    \ State Transfer）。\n\n本节涵盖了 REST Web 服务背景下可发现性的某些特性，讨论了 HTTP 方法的发现、创建（create）与获取（get）之间的关系、获取所有资源的\
    \ URI 发现等。\n\n所有示例和代码段的实现可以在我的 github 项目中找到——这是一个基于 Eclipse 的项目，因此应该很容易导入和运行。\n\
    \n# 使用 Spring 4 构建 REST API\n\n## 9: 用于 Spring REST 服务的 HATEOAS\n\n### 1. 概述\n\
    \n本节将重点关注 Spring REST 服务中可发现性的实现，以及如何满足 HATEOAS 约束。\n\n### 2. 通过事件解耦可发现性\n\n可发现性作为\
    \ Web 层的一个独立方面或关注点，应该与处理 HTTP 请求的控制器解耦。为了实现这一点，控制器将为所有需要对 HTTP 响应进行额外处理的操作触发事件。\n\
    \n首先是这些事件：\n\n```java\npublic class SingleResourceRetrieved extends ApplicationEvent\
    \ {\n    private HttpServletResponse response;\n\n    public SingleResourceRetrieved(Object\
    \ source,\n        HttpServletResponse response) {\n        super(source);\n \
    \       this.response = response;\n    }\n\n    public HttpServletResponse getResponse()\
    \ {\n        return response;\n    }\n}\npublic class ResourceCreated extends\
    \ ApplicationEvent {\n    private HttpServletResponse response;\n    private long\
    \ idOfNewResource;\n\n    public ResourceCreated(Object source,\n        HttpServletResponse\
    \ response, long idOfNewResource) {\n        super(source);\n```\n\n使用 Spring\
    \ 4 构建 REST API\n\n### 2. 通过事件解耦可发现性\n\n```java\nthis.response = response;\nthis.idOfNewResource\
    \ = idOfNewResource;\n}\npublic HttpServletResponse getResponse() {\n    return\
    \ response;\n}\npublic long getIdOfNewResource() {\n    return idOfNewResource;\n\
    }\n```\n\n然后，控制器包含 2 个简单的操作——根据 ID 查找和创建：\n\n```java\n@Controller\n@RequestMapping(value\
    \ = \"/foos\")\npublic class FooController {\n\n    @Autowired\n    private ApplicationEvent\
    \ eventPublisher;\n\n    @Autowired\n    private FooService service;\n\n    @RequestMapping(value\
    \ = \"foos/{id}\", method = RequestMethod.GET)\n    @ResponseBody\n    public\
    \ Foo findById(@PathVariable(\"id\") Long id, HttpServletResponse response) {\n\
    \        Foo resourceById = Preconditions.checkNotNull(service.findOne(id));\n\
    \        eventPublisher.publishEvent(new SingleResourceRetrieved(this, resourceById));\n\
    \        return resourceById;\n    }\n\n    @RequestMapping(method=RequestMethod.POST)\n\
    \    @ResponseStatus(HttpStatus.CREATED)\n    public void create(@RequestBody\
    \ Foo resource, HttpServletResponse response) {\n        Preconditions.checkNotNull(resource);\n\
    \        Long id = service.create(resource).getId();\n        eventPublisher.publishEvent(new\
    \ ResourceCreated(this, response));\n    }\n}\n```\n\n这些事件可以由任何数量解耦的监听器处理，每个监听器关注其特定情况，并都朝着满足整体\
    \ HATEOAS 约束的目标。\n\n监听器应该是调用栈中的最后一个对象，且不需要直接访问它们；因此它们不是公开的。\n\n### 3. 使新创建资源的\
    \ URI 可发现\n\n正如在上一节关于 HATEOAS 的讨论中所述的，创建新资源的操作应该在响应的 `Location` HTTP 头部中返回该资源的\
    \ URI；这由监听器返回：\n\n```java\n@Component\nclass ResourceCreatedDiscoverabilityListener\n\
    implements ApplicationListener<ResourceCreated>{\n    @Override\n    public void\
    \ onApplicationEvent(ResourceCreated resourceCreatedEvent) {\n        Preconditions.notNull(resourceCreatedEvent);\n\
    \n        HttpServletResponse response = resourceCreated.getResponse();\n    \
    \    long idOfNewResource = resourceCreated.getIdOfNewResource();\n\n        addLinkHeaderOnResourceCreation(response,\
