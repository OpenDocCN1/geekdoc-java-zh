    \ ETag support:\n\nAn ETag (entity tag) is an HTTP response header returned by\
    \ an HTTP/1.1 compliant server used to determine change in content at a given\
    \ URL.\n\nETags are used for two things – caching and conditional requests. The\
    \ **ETag value can be tough as a hash tag** computed out of the bytes of the Response\
    \ body. Because a cryptographic hash function is lowly used, even the smallest\
    \ modification of the body will drastically change the output and thus the value\
    \ of ETag. This is only for strong ETags – the protocol provide a weak ETag as\
    \ well.\n\nUsing an `If-*` header turns a standard GET request into a conditional\
    \ GET. The two `If-*` headers that are using with ETags are \"If-None-Match\"\
    \ and \"If-Match\" – each with its own semantics as discussed later in this section.\n\
    \n## 3. Client-Server communication with curl\n\nA simple Client-Server communication\
    \ involving ETags can be broken down into the steps:\n\n- first, the Client makes\
    \ a REST API call – the Response includes the ETag header to be stored for future:\n\
    \n```\ncurl -H \"Accept: application/json\" -i http://localhost:8080/rest-sec/api/resources/1\n\
    ```\n\n```\nHTTP/1.1 200 OK\nETag: \"f88dd058fe00490961a64f01be66a7\"\nContent-Type:\
    \ application/json;charset=UTF-8\nContent-Length: 52\n```\n\n- next the Client\
    \ requests the REST API includes the If-None-Match request header with the ETag\
    \ value from the previous step; if the Resource has not changed on the Server,\
    \ the Response will contain no body and a status code of 304 - Not Modified:\n\
    \n```\ncurl -H \"Accept: application/json\" -H \"If-None-Match: \"f88dd058fe00490961a64f01be66a7\"\
    \n-i http://localhost:8080/rest-sec/api/resources/1\n?\n```\n\n```\nHTTP/1.1 304\
    \ Not Modified\nETag: \"f88dd058fe00490961a64f01be66a7\"\n```\n\n- now, before\
    \ retrieving the Resource again, we will change it by performing an update:\n\n\
    ```\ncurl --user admin@fake.com:adminpass -H \"Content-Type: application/json\"\
    \ -\n-X PUT -data \"{\"id\":\"1\",\"name\":\"newRoleName2\",\"description\":\"\
    theNewDescription\" }\n```\n\n```\nhttp://localhost:8080/rest-sec/api/resources/1\n\
    ```\n\n```\nHTTP/1.1 200 OK\nETag: \"d41d8cd98f00b204e9800998ecf8427e\"\nContent-Length:\
    \ 0\n```\n\n## 4. ETag support in Spring\n\n- **finally**, we send out the last\
    \ request to retrieve again; keep in mind that it has been updated since the last\
    \ time it was retrieved, so the ETag value should no longer work – the response\
    \ will contain new data and a new ETag, can be stored for further use:\n\n```\n\
