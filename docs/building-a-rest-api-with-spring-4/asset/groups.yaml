    # 14: TESTING REST WITH MULTIPLE MIME TYPES


    #  1. Overview


    This final section will focus on **testing a REST Service with multiple Media
    Types/representations.**


    We will write integration tests capable of switching between the multiple types
    of Representations supported by the API. The goal is to be able to run the exact
    same test consuming the exact same URIs of the service, just asking for a different
    Media Type.


    # 2. Goals


    Any REST API needs to expose it''s Resources as representations using some sort
    of Type, and in many cases more than a single one. **The client will set the Accept
    header** to choose the type of representation it asks for from the service.


    Since the Resource can have multiple representations, the server will have to
    implement a mechanism responsible with choosing the right representation - also
    known as **Content Negotiation**. Thus, if the client asks for `application/xml`,
    then it should get an XML representation of the Resource, and if it asks for `application/json`,
    then it should get JSON.


    # 3. Testing Infrastructure


    We will begin by defining a simple interface for a **marshaller** – this will
    be the main abstraction that will allow the test to switch between different Media
    Types:'
  - "[PAGE 107]\n\n# Building a REST API with Spring4\n\n```\npublic interface IMarshaller\
    \ {\n...\n    String getMime();\n}\n```\n\nWe then need a way to initialize the\
    \ right marshaller. For this mechanism, we will use a SpringFactoryBean to initialize\
    \ the marshaller and a simple property to determine which marshaller to use:\n\
    \n```\n@Component\n@Profile(\"test\")\npublic class TestMarshaller implements\
    \ FactoryBean<IMarshaller> {\n\n    @Autowired\n    private Environment env;\n\
    \n    public IMarshaller getObject() {\n        String testMime = env.getProperty(\"\
    test.mime\");\n        if (testMime != null) {\n            switch (testMime)\
    \ {\n                case \"json\":\n                    return new JacksonMarshaller();\n\
    \                case \"xml\":\n                    return new XStreamMarshaller();\n\
    \                default:\n                    throw new IllegalStateException();\n\
    \            }\n        }\n        return new JacksonMarshaller();\n    }\n\n\
    \    public Class<IMarshaller> getObjectType() {\n        return IMarshaller.class;\n\
    \    }\n\n    public boolean isSingleton() {\n        return true;\n    }\n}\n\
    ```\n\nLet's look over this:\n\n+   - first, the new Environment abstraction introduced\
    \ in Spring 3.1 is used here – for more on this check out the detailed article\
    \ on Properties with Spring\n- the test.mime property is retrieved from the environment\
    \ and used to determine"
  - "[PAGE 108]\n\n# Building a REST API with Spring4\n\n# 4. The JSON and XML Marshallers\n\
    \n+   - which marshaller to create - some Java 7 switch on String syntax at work\
    \ here\n- next, the default marshaller, in case the property is not defined at\
    \ all, is going to be the Jackson marshaller for JSON support\n- finally this\
    \ BeanFactory is only active in a test scenario, as the new @Profile support,\
    \ also introduced in Spring 3.1 is used\n\nThat's it - the mechanism is able to\
    \ switch between marshallers based on whatever the value of the test.mime property\
    \ is.\n\n# 4. The JSON and XML Marshallers\n\nMoving on, we'll need the actual\
    \ marshaller implementation – one for each supported Type.\n\nFor JSON we'll use\
    \ Jackson as the underlying library:\n\n```\npublic class JacksonMarshaller implements\
    \ Marshaller {\n  private ObjectMapper objectMapper;\n\npublic JacksonMarshaller()\
    \ {\n  super();\n  objectMapper = new ObjectMapper();\n}\n\n@Override\npublic\
    \ String getMime() {\n  return MediaType.APPLICATION_JSON.toString();\n}\n```\n\
    \nFor the XML support, the marshaller uses XStream.\n\n```\npublic class XStreamMarshaller\
    \ implements Marshaller {\n  private XStream xstream;\n\npublic XStreamMarshaller()\
    \ {\n  super();\n  xstream = new XStream();\n}\n```"
