    # 8: REST API DISCOVERABILITY AND HATEOAS


    # 1. Overview


    The section will focus on Discoverability of the REST API, HATEOAS and practical
    scenarios driven by tests.


    # 2. Why make the API Discoverable


    Discoverability of an API is a topic that doesn''t get enough well deserved attention,
    and as a consequence very few APIs get it right. It is also something that, if
    done correctly, can make the API not only RESTful and usable but also elegant.


    To understand discoverability you need to understand that constraint that is Hypermedia
    As The Engine Of Application State (HATEOAS); this constraint of a REST API is
    about full discoverability of actions/transitions on a Resource from Hypermedia
    (Hypertext really), and the only driver of application state.


    If interaction is to be driven by the API through the conversation itself, concretely
    via Hypertext, then there can be no documentation, as would coerce the client
    to make assumptions that are in fact out of the context of the API.


    In conclusion, the server should be descriptive enough to instruct the client
    how to use the API via Hypertext only, which, in the case of a HTTP conversation,
    may be the Link header.'
