  - "[PAGE 27]\n\nBuilding a REST API with Spring4\n\n3.2. The Entry Point\n\n# 3.1.\
    \ The &lt;http&gt; element\n\nThe &lt;http&gt; element is the main container element\
    \ for HTTP security configuration. In the current implementation, it only secured\
    \ a single mapping: /api/admin/**. Note that the mapping is relative to the root\
    \ context of the web application, not to the rest Servlet; this is because the\
    \ entity security configuration lives in the root Spring context and not in the\
    \ child context of the Servlet.\n\n# 3.2. The Entry Point\n\nIn a standard web\
    \ application, the authentication process may be automatically triggered when\
    \ the client tries to access a secured resource without being authenticated –\
    \ this is usually done by redirecting to a login page so that the user can enter\
    \ credentials. However, for a REST Web Service this behavior doesn't make sense\
    \ – Authentication should only be done by a request to the correct URI and all\
    \ requests should simply fail with a 401 UNAUTHORIZED status code if the user\
    \ is not authenticated.\n\nSpring Security handles this automatic triggering of\
    \ the authentication process with the concept of an Entry Point – this is a required\
    \ part of the configuration, and can be injected via the entry-point-ref attribute\
    \ of the &lt;http&gt; element. Keeping in mind that this functionality doesn't\
    \ make sense in the context of the REST Service, the new custom entry point is\
    \ defined to simply return 401 whenever it is triggered:\n\n```\n@Component(\"\
    restAuthenticationEntryPoint\")\npublic class RestAuthenticationEntryPoint implements\
    \ AuthenticationEntryPoint{\n    @Override\npublic void commence(HttpServletRequest\
    \ request, HttpServletResponse response,\nAuthenticationException authException)\
    \ throws IOException(\n    response.sendError(HttpServletResponse.SC_UNAUTHORIZED,\
    \ \"Unauthorized\");\n}\n```\n\nA quick sidenote here is that the 401 is sent\
    \ without the WWW-Authenticate header, as required by the HTTP Spec – we of course\
    \ set the value manually if we need to."
  - '[PAGE 28]


    # 3.3. The Login Form for REST


    There are multiple ways to do Authentication for a REST API - one of the default
    Spring Security provides is Form Login - which uses an authentication processing
    filter - org.springframework.security.web.authentication.UsernameAuthenticationFilter.


    The `<form-login>` element will create this filter and also allow us to set our
    custom authentication success handler on it. This can also be done manually using
    the `<custom-filter>` element to register a filter at the position FORM_LOGIN_FILTER
    - but the namespace support is flexible enough.


    > Note that for a standard web application, the auto-config attribute of the <http>
    element is shorthand syntax for some simple web security configuration. While
    this makes sense in the context of some simple configurations, it doesn''t fit
    and should not be used for a REST API.


    # 3.4. Authentication should return 200 instead of 301


    By default, form login will answer a successful authentication request with a
    301 MOVED PERMANENTLY status code; this makes sense in the context of an actual
    login form which needs to redirect after login. For a RESTful web service however,
    the desired response for successful authentication should be 200 OK.


    This is done by injecting a custom authentication success handler in the login
    filter, to replace the default one. The new handler implements the exact same
    login as the default org.springframework.security.web.authentication.Handler SavedRequestAwareAuthenticationSuccessHandler
    with one notable difference - the redirect logic is removed.'
  - "[PAGE 29]\n\n# 3.5. Failed Authentication should return 401 instead of 302\n\n\
    Similarly – we configured the authentication failure handler – same way we did\
    \ with the success handler.\n\nLuckily – in this case, we don’t need to actually\
    \ define a new class for this handler – the standard implementation – SimpleUrlAuthenticationFailureHandler\
    \ – does just fine.\n\nThe only difference is that – now that we’re defining this\
    \ explicitly in our XML config – it’s not going to get a default defaultFailureUrl\
    \ from Spring – and so it won’t redirect.\n\n```\npublic class MySavedRequestAuthenticationSuccessHandler\n\
    extends SimpleUrlAuthenticationSuccessHandler\n\nprivate RequestCache requestCache\
    \ = new HttpSessionRequestCache();\n\n@Override\npublic void onAuthenticationSuccess(HttpServletRequest\
    \ request, HttpServletResponse response, Authentication authentication) throws\
    \ ServletException, IOException {\n    SavedRequest savedRequest = requestCache.getRequest(request);\n\
    \n    if (savedRequest == null) {\n        clearAuthenticationAttributes(request);\n\
    \        return;\n    }\n    String targetUri = getDefaultTargetUrl(request) ||\
    \ (targetUri == null && StringUtils.hasText(savedRequest.getRequest().getURI()))\
    \ ? savedRequest.getRequest().getURI() : null;\n    requestCache.removeRequest(request,\
    \ response);\n    clearAuthenticationAttributes(request);\n    return;\n}\n\n\
    clearAuthenticationAttributes(request);\n}\n\npublic void setRequestCache(RequestCache\
    \ requestCache) {\n    this.requestCache = requestCache;\n}\n```"
- md: "\n## 3.6. The Authentication Manager and Provider\n\nThe authentication process\
    \ uses an in-memory provider to perform authentication – this is meant to simplify\
    \ the configuration as a production implementation of these artifacts is outside\
    \ the scope of this post.\n\n## 3.7 Finally – Authentication against the running\
    \ REST Service\n\nNow let's see how we can authenticate against the REST API –\
    \ the URL for login is /j_spring_security_check – and a simple curl command performing\
    \ login would be:\n\n```\ncurl -i -X POST -d username=user -d password=userPass\n\
    http://localhost:8080/spring-security-rest/j_spring_security_check\n```\n\nThis\
    \ request will return the Cookie which will be used by any subsequent request\
    \ against the REST Service.\n\nWe can use curl to authentication and store the\
    \ cookie it receives in a file:\n\n```\ncurl -i -X POST -d username=user -d password=userPass\
    \ -c /opt/cookies.txt\nhttp://localhost:8080/spring-security-rest/j_spring_security_check\n\
    ```\n\nThen we can use the cookie from the file to do further authenticated requests:\n\
    \n```\ncurl -i --header \"Accept:application/json\" GET -b /opt/cookies.txt\n\
    http://localhost:8080/spring-security-rest/api/foos\n```\n\nThis authenticated\
    \ request will correctly result in a 200 OK:\n\n```\nHTTP/1.1 200 OK\nServer:\
    \ Apache-Coyote/1.1\nContent-Type: application/json;charset=UTF-8\nTransfer-Encoding:\
    \ chunked\nDate: Wed, 24 Jul 2013 20:31:13 GMT\n\n[{\"id\":\"0\",\"name\":\"JbidXc\"\
    }]\n```\n\n## 4. Maven and other trouble\n\nThe Spring core dependencies necessary\
    \ for a web application and for the REST Service have been discussed in detail.\
    \ For example, we'll need to add: spring-security-web and spring-security-config\
    \ - all of these have also been covered in the Maven for Spring Security tutorial.\n\
    \nIt's worth paying close attention to how the Maven will resolve the older Spring\
    \ dependencies - the resolution strategy will start causing problems once the\
    \ security artifacts are added to the pom. To address this problem, some of the\
    \ core dependencies will need to be overridden in order to keep them at the right\
    \ version.\n\n## 5. Conclusion\n\nThis section covered the basic security configuration\
    \ and implementation for a RESTful Service using Spring Security 3.1, discussing\
    \ the web.xml, the security configuration, the HTTP status codes for the authentication\
    \ process and the Maven resolution of the security artifacts.\n\n![](img/9e952c1884adb105358b0d748e0b42fd_31_0.png)\n\
    \n# Building a REST API with Spring4\n\n## 4. SPRING SECURITY BASIC AUTHENTICATION\n\
    \n### 1. Overview\n\nThis section shows how to set up, configure and customize\
    \ Basic Authentication with Spring. We're going to build on this simple Spring\
    \ MVC example, and secure the UI of the MVC application with the Basic Auth mechanism\
    \ provided by Spring Security.\n\n### 2. The Spring Security Configuration\n\n\
    The Configuration for Spring Security is still XML:\n\n```xml\n<?xml version=\"\
    1.0\" encoding=\"UTF-8\"?>\n<beans xmlns=\"http://www.springframework.org/schema/security\"\
    \nxmlns:xsi=\"http://www.w3.org/2001/XML-Schema-instance\"\nxmlns:beans=\"http://www.springframework.org/schema/beans\"\
    \nsi:schemaLocation=\"http://www.springframework.org/schema/security http://www.springframework.org/schema/security/spring-security-3.1.xsd\
    \ http://www.springframework.org/schema/beans http://www.springframework.org/schema/beans/spring-beans-3.2.xsd\"\
    >\n\n  <http use-expression=\"true\">\n    <intercept-url pattern=\"/**\" access=\"\
    isAuthenticated()\" />\n  </http>\n\n  <http-basic />\n</http>\n\n  <authentication-manager>\n\
    \    <authentication-provider>\n      <user-service>\n        <user name=\"user1\"\
    \ password=\"userPass\" authorities=\"ROLE_USER\" />\n      </user-service>\n\
    \    </authentication-provider>\n  </authentication-manager>\n\n</beans>\n```\n\
    \nThere is of course the option of Java based configuration as well.\n\nWhat is\
    \ relevant here is the <http-basic> element inside the main <http> element of\
    \ the configuration - this is enough to enable Basic Authentication for the entire\
    \ application. The Authentication Manager is not the focus of this section, so\
    \ we are using an in memory manager with the user and password defined in plaintext.\n\
    \nThe *web.xml* of the web application enabling Spring Security has already been\
    \ discussed in the previous section.\n\n## 3. Consuming The Secured Application\n\
    \nThe *curl* command is our go to tool for consuming the secured application.\n\
    \nFirst, let's try to request the /homepage.html without providing any security\
    \ credentials.\n\n```\ncurl -i http://localhost:8080/spring-security-mvc-basic-auth/homepage.html\n\
    ```\n\nWe get back the expected 401 Unauthorized and the Authentication Challenge:\n\
    \n```\nHTTP/1.1 401 Unauthorized\nServer: Apache-Coyote/1.1\nSet-Cookie: JSESSIONID=E5ABD3C16B65A007FAAE619;\
    \ Path=/spring-security-mvc-basic-auth/; HttpOnly\nWWW-Authenticate=\"Spring Security\
    \ Application\"\nContent-Type: text/html;charset=utf-8\nContent-Length: 1061\n\
    Date: Wed, 29 May 2013 15:14:08 GMT\n```\n\nThe browser would interpret this challenge\
    \ and prompt us for credentials with a simple dialog, but since we're using *curl*,\
    \ this isn't the case.\n\nNow, let's request the same resource - the homepage\
    \ – **provide the credentials** to access it as well:\n\n```\ncurl -i user1:user1Pass\
    \ http://localhost:8080/spring-security-mvc-basic-auth/homepage.html\n```\n\n\
    Now, the response from the server is **200 OK** along with a *Cookie*.\n\n## 4.\
    \ Further Configuration – The Entry Point\n\n```\nHTTP/1.1 200 OK\nServer: Apache-Coyote/1.1\n\
    Set-Cookie: JSESSIONID=301225C7AE7C7B40892887389996785D; Path=/security-mvc-basic-auth/;\
    \ HttpOnly\nContent-Type: text/html;charset=ISO-8859-1\nContent-Language: en-US\n\
    Content-Length: 90\nDate: Wed, 29 May 2013 15:19:38 GMT\n```\n\nFrom the browser,\
    \ the application can be consumed normally - the only difference is that a login\
    \ page is no longer a hard requirement since all browsers support Basic Authentication\
    \ and use a dialog to prompt the user for credentials.\n\nBy default, the BasicAuthenticationEntryPoint\
    \ provisioned by Spring Security returns a full html page for a 401 Unauthorized\
    \ response back to the client. This html representation of the error renders well\
    \ in a browser, but it is not well suited for other scenarios, such as a REST\
    \ API where a json representation may be preferred.\n\nThe namespace is flexible\
    \ enough for this requirement as well – to address this – the entry point can\
    \ be overridden:\n\n```\n<http-basic entry-point-ref=\"myBasicAuthenticationEntryPoint\"\
    \ />\n```\n\nThe new entry point is defined as a standard bean:\n\n```java\n@Component\n\
    public class MyBasicAuthenticationEntryPoint extends BasicAuthenticationEntryPoint\
    \ {\n\n    @Override\n    public void doAuthenticate(HttpServletRequest request,\
    \ HttpServletResponse response, AuthenticationException auth)\n        throws\
    \ IOException, ServletException {\n        response.addHeader(\"WWW-Authenticate\"\
    , \"Basic realm=\" + getRealmName() + \"\\\"\");\n        response.setStatus(HttpServletResponse.SC_UNAUTHORIZED);\n\
    \        PrintWriter writer = response.getWriter();\n        writer.println(\"\
    HTTP Status 401 - \" + auth.getMessage());\n    }\n\n    @Override\n    public\
    \ void afterPropertiesSet(Properties set) throws Exception {\n        setRealmName(\"\
    Baelung\");\n        super.afterPropertiesSet(set);\n    }\n}\n```\n\nBy writing\
    \ directly to the HTTP Response we now have full control over the format of the\
    \ response body.\n\n## 5. The Maven Dependencies\n\nThe Maven dependencies for\
    \ Spring Security have been discussed before in the Spring Security with Maven\
    \ article - we will need both spring-security-web and spring-security-config available\
    \ at runtime.\n\n## 6. Conclusion\n\nIn this example we secured the existing REST\
    \ application with Spring Security and Basic Authentication. We discussed the\
    \ XML configuration and we consumed the application with simple curl commands.\
    \ Finally took control of the exact error message format - moving from the standard\
    \ HTML error page to a custom text or json format.\n\nThe implementation of this\
    \ section can be found in the github project - this is an Eclipse based project,\
    \ so it should be easy to import and run as it is. When the project runs locally,\
    \ the sample html can be accessed at:\n\n```\nhttp://localhost:8080/spring-security-mvc-basic-auth/homepage.html\n\
    ```\n"
  mdcn: "\n\n## 3.6. 身份验证管理器（Authentication Manager）与提供者\n\n身份验证过程使用一个内存提供者来执行验证——其目的是为了简化配置，因为这些构件的生产实现不在本文的讨论范围之内。\n\
    \n## 3.7 最后 – 针对运行中的 REST 服务进行身份验证\n\n现在让我们来看看如何对 REST API 进行身份验证——登录的 URL 为 `/j_spring_security_check`\
    \ ——一个执行登录的简单 `curl` 命令如下：\n\n```\ncurl -i -X POST -d username=user -d password=userPass\n\
    http://localhost:8080/spring-security-rest/j_spring_security_check\n```\n\n此请求将返回一个\
    \ Cookie，该 Cookie 将被任何对 REST 服务的后续请求使用。\n\n我们可以使用 curl 进行身份验证并将接收到的 cookie 存储在文件中：\n\
    \n```\ncurl -i -X POST -d username=user -d password=userPass -c /opt/cookies.txt\n\
    http://localhost:8080/spring-security-rest/j_spring_security_check\n```\n\n然后，我们可以使用文件中的\
    \ Cookie 进行进一步的身份验证请求：\n\n```\ncurl -i --header \"Accept:application/json\" GET\
    \ -b /opt/cookies.txt\nhttp://localhost:8080/spring-security-rest/api/foos\n```\n\
    \n此经过身份验证的请求将正确返回 200 OK：\n\n```\nHTTP/1.1 200 OK\nServer: Apache-Coyote/1.1\n\
    Content-Type: application/json;charset=UTF-8\nTransfer-Encoding: chunked\nDate:\
    \ Wed, 24 Jul 2013 20:31:13 GMT\n\n[{\"id\":\"0\",\"name\":\"JbidXc\"}]\n```\n\
    \n## 4. Maven 及其他问题\n\nWeb 应用和 REST 服务必需的 Spring 核心依赖已经进行了详细讨论。例如，我们需要添加 `spring-security-web`\
    \ 和 `spring-security-config` —— 所有所有内容在“Maven for Spring Security”教程中也都涵盖过。\n\n\
    值得关注的是 Maven 将如何解析旧版本的 Spring 依赖——一旦将安全构件添加到 `pom` 中，解析策略将开始产生问题。为了解决这个问题，需要对某些核心依赖进行重写，以保持它们处于正确的版本。\n\
    \n## 5. 结论\n\n本节涵盖了使用 Spring Security 3.1 构建 RESTful 服务的基本安全配置和实现，讨论了 `web.xml`、安全配置、身份验证过程的\
    \ HTTP 状态码以及安全构件的 Maven 解析。\n\n![](img/9e952c1884adb105358b0d748e0b42fd_31_0.png)\n\
    \n# 使用 Spring4 构建 REST API\n\n## 4. SPRING SECURITY 基础认证（BASIC AUTHENTICATION）\n\
    \n### 1. 概述\n\n本节展示了如何使用 Spring 设置、配置和自定义基础认证。我们将基于这个简单的 Spring MVC 示例构建，并使用 Spring\
    \ Security 提供的基础认证机制保护 MVC 应用的 UI。\n\n### 2. Spring Security 配置\n\nSpring Security\
    \ 的配置仍然是 XML：\n\n```xml\n<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<beans xmlns=\"\
    http://www.springframework.org/schema/security\"\nxmlns:xsi=\"http://www.w3.org/2001/XML-Schema-instance\"\
    \nxmlns:beans=\"http://www.springframework.org/schema/beans\"\nsi:schemaLocation=\"\
    http://www.springframework.org/schema/security http://www.springframework.org/schema/security/spring-security-3.1.xsd\
    \ http://www.springframework.org/schema/beans http://www.springframework.org/schema/beans/spring-beans-3.2.xsd\"\
    >\n\n  <http use-expression=\"true\">\n    <intercept-url pattern=\"/**\" access=\"\
    isAuthenticated()\" />\n  </http>\n\n  <http-basic />\n</http>\n\n  <authentication-manager>\n\
    \    <authentication-provider>\n      <user-service>\n        <user name=\"user1\"\
    \ password=\"userPass\" authorities=\"ROLE_USER\" />\n      </user-service>\n\
    \    </authentication-provider>\n  </authentication-manager>\n\n</beans>\n```\n\
    \n当然，也有基于 Java 的配置选项。\n\n这里相关的是配置主 `<http>` 元素内部的 `<http-basic>` 元素这足以启用整个应用程序的基础认证。身份验证管理器（Authentication\
    \ Manager）不是本节的重点，因此我们使用了一个定义了明文用户名和密码的内存管理器。\n\n启用 Spring Security 的 Web 应用的\
    \ *web.xml* 已经在上一节中讨论过。\n\n## 3. 使用受保护的应用\n\n*curl* 命令是我们消费受保护应用的首选工具。\n\n首先，让我们尝试在不提供任何安全凭据的情况下请求\
    \ `/homepage.html`。\n\n```\ncurl -i http://localhost:8080/spring-security-mvc-basic-auth/homepage.html\n\
    ```\n\n我们收到了预期的 401 Unauthorized 和身份验证挑战：\n\n```\nHTTP/1.1 401 Unauthorized\n\
    Server: Apache-Coyote/1.1\nSet-Cookie: JSESSIONID=E5ABD3C16B65A007FAAE619; Path=/spring-security-mvc-basic-auth/;\
    \ HttpOnly\nWWW-Authenticate=\"Spring Security Application\"\nContent-Type: text/html;charset=utf-8\n\
    Content-Length: 10\nDate: Wed, 24 Jul 2013 20:31:13 GMT\n```\n\n浏览器会解析响应并弹出身份验证对话框，但由于我们使用了基础认证，因此登录页面不再是强制要求的。现在让我们带上凭据请求资源：\n\
    \n```\ncurl -i user1:userPass http://localhost:8080/spring-security-mvc-basic-auth/homepage.html\n\
    ```\n\n服务器将返回 **200 OK** 并带有一个 *Cookie*：\n\n```\nHTTP/1.1 200 OK\nServer: Apache-Coyote/1.1\n\
    Set-Cookie: JSESSIONID=E5ABD3C16B65A007FAAE619; Path=/spring-security-mvc-basic-auth/;\
    \ HttpOnly\nContent-Type: text/html;charset=utf-8\nContent-Length: 90\nDate: Wed,\
    \ 24 Jul 2013 20:31:13 GMT\n```\n\n## 4. 进一步配置 – 入点（Entry Point）\n\n默认情况下，Spring\
    \ Security 提供的 `BasicEntryPoint` 会向客户端返回一个 HTML 页面。这种错误表示在浏览器中渲染效果良好，但不适用于其他场景，例如可能需要\
    \ JSON 格式的 REST API。\n\n命名空间也足够灵活以满足这一需求——为了解决这个问题，可以重写入点：\n\n```xml\n<http-basic\
    \ entry-ref=\"myAuthenticationEntryPoint\" />\n```\n\n新的入点被定义为标准的 bean：\n\n```java\n\
    @Component\npublic class MyBasicAuthenticationEntryPoint extends BasicAuthenticationEntryPoint\
    \ {\n\n    @Override\n    public void doAuthenticate(HttpServletRequest request,\
    \ HttpServletResponse response, AuthenticationException auth)\n        throws\
    \ IOException, ServletException {\n        response.addHeader(\"WWW-Authenticate\"\
    , \"Basic realm=\" + getRealmName() + \"\\\"\");\n        response.setStatus(HttpServletResponse.SC_UNAUTHORIZED);\n\
    \        PrintWriter writer = response.getWriter();\n        writer.println(\"\
    HTTP Status 401 - \" + auth.getMessage());\n    }\n\n    @Override\n    public\
    \ void afterPropertiesSet(Properties set) throws Exception {\n        setRealmName(\"\
    Baelung\");\n        super.afterPropertiesSet(set);\n    }\n}\n```\n\n通过直接写入 HTTP\
    \ 响应，我们现在完全控制响应体的格式。\n\n## 5. Maven 依赖\n\nSpring Security 的 Maven 依赖在之前的“Maven\
    \ Spring Security”文章中讨论过——我们在运行时需要 `spring-security-web` 和 `spring-security-config`。\n\
    \n## 6. 结论\n\n在示例中，我们使用 Spring Security 和基础认证保护了现有的 REST 应用。我们讨论了 XML 配置，并使用简单的\
    \ `curl` 命令消费了应用。最后控制了精确的错误消息格式——从标准的 HTML 错误页面转换为自定义的文本或 JSON 格式。\n\n本节的实现可以在\
    \ GitHub 项目中找到——这是一个基于 Eclipse 的项目，因此应该很容易导入和运行。当项目在本地运行时，可以通过以下地址访问示例 HTML：\n\
    \n```\nhttp://localhost:8080/spring-security-mvc-basic-auth/homepage.html\n```\n\
    \n"
