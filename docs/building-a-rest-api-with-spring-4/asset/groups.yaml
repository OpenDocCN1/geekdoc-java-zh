    # 6. Conclusion


    This section is tried to provide an overview of the very diverse and difficult
    problem of evolving a REST Service. We discussed the two common solutions, advantages
    and disadvantages of each one, and ways to reason about these approaches in the
    context of REST. The material concludes making the case for the second solution
    - versioning the media types, while examining the possible changes to a RESTful
    API.'
