    \ @ResponseBody 和 @RequestBody 注解。\n\n### 3.2. @ResponseBody\n\nController 方法上的\
    \ @ResponseBody 向 Spring 表明**方法的返回值**将直接序列化到 HTTP 响应正文中。正如如上所述，客户端指定的“Accept”请求头将用于选择合适的\
    \ Http 转换器来对实体进行处理。\n\n## 使用 Spring 构建 REST API\n\n让我们来看一个简单的示例：\n\n```java\n\
    @RequestMapping(method=RequestMethod.GET, value=\"/foos/{id}\")\npublic @ResponseBody\
    \ Foo findById(@PathVariable long id) {\n    return fooService.get(id);\n}\n```\n\
    \n现在，客户端将在请求中指定 \"Accept\" 请求头为 application/json -  curl 命令：\n\n```bash\ncurl\
    \ --header \"Accept: application/json\" http://localhost:8080/spring-rest/foos/1\n\
    ```\n\nFoo 类：\n\n```java\npublic class Foo {\n    private long id;\n    private\
    \ String name;\n}\n```\n\n以及 HTTP 响应正文：\n\n```json\n{\n    \"id\": 1,\n    \"\
    name\": \"Paul\"\n}\n```\n\n### 3.3. @RequestBody\n\n@RequestBody 用于 Controller\
    \ 方法的参数——它向 Spring 表明 HTTP 请求的正文将被反序列化为特定的 Java 实体。如之前所述，客户端指定的“Content-Type”请求头将用于确定此处合适的转换器。\n\
    \n让我们来看一个示例：\n\n```java\n@RequestMapping(method=RequestMethod.PUT, value=\"/foo/{id}\"\
    )\npublic @ResponseBody void updateFoo(@RequestBody Foo foo, @PathVariable String\
    \ id) {\n    fooService.update(foo);\n}\n```\n\n现在，让我们用一个 JSON 对象来消费它——我们指定 \"\
    Content-Type\" 为 application/json。\n\n```bash\ncurl -i -X PUT \"Content-Type:\
    \ application/json\" -d '{\"id\":\"83\",\"name\":\"Klik\"}' http://localhost:8080/spring-rest/foo/1\n\
    ```\n\n我们收到了 200 OK – 成功的响应：\n\n```http\nHTTP/1.1 200 OK\nServer: Apache-Coyote/1.1\n\
    Content-Length: 0\nDate: Fri, 10 Jan 2014 11:18:54 GMT\n```\n\n## 4. 自定义转换器配置\
    \ – 添加 XML 支持\n\n我们可以通过扩展 WebMvcConfigurer 类并重写 configureMessageConverters 方法来自定义消息转换器：\n\
    \n```java\n@EnableWebMvc\n@Configuration\n@ComponentScan(\"org.baeldung.web\"\
    )\npublic class WebMMvcConfig extends WebMvcConfigurerAdapter {\n\n    @Override\n\
    \    public void configureMessageConverters(List<? extends HttpMessageConverter>\
    \ converters) {\n        messageConverters.add(createXmlConverter());\n      \
    \  messageConverters.add(new MappingJackson2HttpMessageConverter());\n\n     \
    \   super.configureMessageConverters(converters);\n    }\n}\n```\n\n## 使用 Spring\
    \ 4 构建 REST API – 自定义转换器配置 – 添加 XML 支持\n\n```java\nprivate HttpMessageConverter<Object>\
    \ createXmlHttpMessage() {\n  MarshallingHttpMessage xmlConverter = \n    new\
    \ MarshallingHttpMessage();\n\n  XStreamMarshaller xstreamMarshall = new XStreamMarshaller();\n\
    \  xmlConverter.setSerializer(xstreamMarshall);\n  xmlConverter.setUnmarshaller(xstreamMarshall);\n\
    \n  return xmlConverter;\n}\n```\n\n注意，现在类路径上需要存在 XStream 库。\n\n此外请注意，通过扩展此支持类，我们失去了之前预注册的默认消息转换器——我们只拥有我们定义的那些。\n\
    \n让我们来看这个示例——我们正在创建一个新的转换器——MarshallingHttpMessageConverter，并使用 Spring 的 XStream\
    \ 支持来配置它。这提供了极大的灵活性，因为我们正在处理底层序列化框架的底层 API —— 在 XStream 的情况下，我们可以按照自己的意愿进行配置。\n\
    \n我们现在可以对 Jackson 做同样的事情——通过定义我们的 Mapping.Jackson2HttpMessageConverter，我们现在可以在此转换器上使用自定义的\
    \ ObjectMapper，并按照我们需要对其进行配置。\n\n在这种情况下，XStream 是选定的序列化/反序列化实现，但也可以使用其他如 CastorMarshall\
    \ 等 – 请参阅 Spring API 文档获取可用序列化器的完整列表。\n\n此时，在后端启用了 XML 后，我们可以用 XML 表示来消费 API：\n\
    \n```bash\ncurl --header \"Accept: application/xml\" http://localhost:8080/spring-rest/foos/1\n\
    ```\n\n## 使用带有转换器的 RestTemplate\n\n正如服务器端一样，消息转换也可以在客户端进行配置。我们将为模板设置“Accept”和“Content-Type”请求头。\n\
    \n### 5.1. 使用 Accept 请求头获取资源\n\n```java\n@Test\npublic void getFoo() {\n  String\
    \ uri = \"http://localhost:8080/spring-rest/foos/{id}\";\n  RestTemplate restTemplate\
    \ = new RestTemplate();\n  Foo foo = restTemplate.getForObject(uri, Foo.class);\n\
