- md: "\n# 5: SPRING SECURITY DIGEST AUTHENTICATION\n\n## 1. Overview\n\nThis section\
    \ illustrates how to set up, configure and customize Digest Authentication with\
    \ Spring. Similar to the previous section about Basic Authentication, we're going\
    \ to build on top of the Spring REST Service from the previous sections, and secure\
    \ the application with the Digest Auth mechanism provided by Spring Security.\n\
    \n## 2. The Security XML Configuration\n\nFirst thing to understand about the\
    \ configuration is that, while Spring Security does have full out of the box support\
    \ for the Digest authentication mechanism, this support is **not as well integrated\
    \ into the namespace** as Basic Authentication.\n\nIn this case, we need to manually\
    \ define the beans that are going to make up the configuration - the *DigestAuthenticationFilter*\
    \ and the *DigestAuthenticationEntryPoint*.\n\n```xml\n<?xml version=\"1.0\" encoding=\"\
    UTF-8\"?>\n<beans xmlns=\"http://www.springframework.org/schema/beans\"\n    \
    \   xmlns:xsi=\"http://www.w3.org/2001/XMLSchema-instance\"\n       xmlns:security=\"\
    http://www.springframework.org/schema/security\"\n     xsi:schemaLocation=\"http://www.springframework.org/schema/beans\n\
    \           http://www.springframework.org/schema/beans/spring-beans.xsd\n   \
    \        http://www.springframework.org/schema/security\n           http://www.springframework.org/schema/security/spring-security-3.2.xsd\"\
    >\n\n  <security:bean id=\"digestFilter\" class=\"org.springframework.security.web.authentication.DigestAuthenticationFilter\"\
    >\n    <property name=\"userDetails\" ref=\"userService\" />\n    <property name=\"\
    authenticationEntryPoint\" ref=\"digestEntryPoint\" />\n  </security:bean>\n\n\
    \  <security:bean id=\"digestEntryPoint\" class=\"org.springframework.security.web.authentication.DigestAuthenticationEntryPoint\"\
    >\n    <property name=\"realmName\" value=\"Digest Authentication\" />\n    <property\
    \ name=\"key\" value=\"challenge\" />\n  </security:bean>\n\n  <security:http\
    \ entry-point-ref=\"digestEntryPoint\">\n    <security:intercept-url pattern=\"\
    /*\" access=\"isAuthenticated\"/>\n    <security:custom-filter ref=\"digestFilter\"\
    \ before=\"BASIC_AUTH_FILTER\"/>\n  </security:http>\n\n  <security:authentication-manager>\n\
    \    <security:authentication-provider>\n      <security:user-service id=\"userService\"\
    >\n        <security:user name=\"user1\" password=\"Pass\" authorities=\"ROLE_USER\"\
    \ />\n      </security:user-service>\n    </security:authentication-provider>\n\
    \  </security:authentication-manager>\n\n</beans>\n```\n\nNext, we need to integrate\
    \ these beans into the overall security configuration – in this case, the namespace\
    \ is still flexible enough to allow us to do that.\n\nThe first part of this is\
    \ pointing the custom entry point bean via the `entry-point-ref` attribute of\
    \ the main `<http>` element. The second part is **adding the newly defined digest\
    \ filter into the filter chain**. Since this filter is functionally equivalent\
    \ to the *BasicAuthenticationFilter*, we are using the same position in the chain\
    \ – this is specified by `BASIC_AUTH_FILTER` alias in Spring Security Standard\
    \ Filters.\n\nFinally, notice that the Digest Filter is configured to **point\
    \ to the user service** – here, the namespace is again useful as it allows us\
    \ to specify a bean for the default user service created by the `<user-service>`\
    \ element.\n\n## 3. Consuming the Secured Application\n\nWe're going to use the\
    \ `curl` command to consume the secured application and understand how a client\
    \ can interact with it. Let's start by requesting the homepage **without providing\
    \ security credentials** in the request:\n\n```bash\ncurl -i http://localhost/spring-security-digest-auth/homepage.html\n\
    ```\n\nAs expected, we get back a response with a 401 Unauthorized status code:\n\
    \n```\nHTTP/1.1 401 Unauthorized\nServer: Apache-Coyote/\nSet-Cookie: JSESSIONID=CF0233C;\
    \ Path=/spring-security-digest-auth/; HttpOnly\nWWW-Authenticate: Digest Realm=\"\
    Digest Authentication\", qop=\"auth\", nonce=\"MTM3M3zODE2Nt3GToC3MmtxN2JKOWYYzXtc4MdzZmIn2QY0ZT0UN2RKZg\"\
    \nContent-Type: text/html; charset=utf-8\nContent-Length: 1061\nDate: Fri, 12\
    \ Jul 2013 14:04:25 GMT\n```\n\nIf this request was sent by the browser, the authentication\
    \ challenge would prompt the user for credentials using a simple user/password\
    \ dialog. Let's now **provide the correct credentials** and send the request again:\n\
    \n```bash\ncurl -i --user user1:Pass http://localhost/spring-security-digest-auth/homepage.html\n\
    ```\n\n**Notice** that we are enabling Digest Authentication for the `curl` command\
    \ via the `-digest` flag. The first response from the server will be the same\
    \ – the **401 Unauthorized** – but the challenge will be intercepted and acted\
    \ upon a second request – which will succeed with a **200 OK**.\n\n## 4. The Maven\
    \ Dependencies\n\n```\nHTTP/1.1 401 Unauthorized\nServer: Apache-Coyote/1.1\n\
    Set-Cookie: SESSIONID-A5661ED0...; Path=/spring-security-digest-auth/; HttpOnly\n\
    WWW-Authenticate: Digest realm='Digest Realm via Digest Authentication', qop=\"\
    auth\",\nMTMMzYxQyOgtOTcMzIz4MOWQGUYzQgYmZWRIJMDQZZWKOA==\nContent-Type: text/html;charset=utf-8\n\
    Content-Length: 101\nDate: Fri, 12 Jul 2013 14:15:29 GMT\n\nHTTP/1.1 200 OK\n\
    Server: Apache-Coyote/1.1\nSet-Cookie: SESSIONID-A5661ED0...; Path=/spring-security-digest-auth/;\
    \ HttpOnly\nContent-Type: text/html;charset=utf-8\nContent-Length: 101\nDate:\
    \ Fri, 12 Jul 2013 14:15:29 GMT\n```\n\n## 5. Conclusion\n\nIn this section we\
    \ introduce security into a simple REST API by leveraging the Digest Authentication.\
    \ The implementation of these examples can be found in the github project - this\
    \ is an Eclipse based project, so it should be easy to import and run. When the\
    \ project runs locally, the homepage html can be accessed at (or, with minimal\
    \ Tomcat configuration, on port 80):\n\nhttp://localhost:8080/spring-security-digest-auth/homepage.html\n\
    \nFinally, in the next section we'll see that there is no reason for an application\
    \ needs to choose between Basic and Digest authentication - both can be set up\
    \ simultaneously on the same URI structure, in such a way that the client can\
    \ pick between the two when consuming the web application.\n"
  mdcn: "\n\n# 5: SPRING SECURITY 摘要认证 (DIGEST AUTH)\n\n## 1. 概述\n\n本节将说明如何使用 Spring\
    \ 设置、配置和自定义摘要认证（Digest Authentication）。与之前关于基础认证（Basic Authentication）的部分类似，我们将基于之前章节构建的\
    \ Spring REST 服务，并使用 Spring Security 提供的摘要认证机制来保护应用程序。\n\n## 2. 安全 XML 配置\n\n\
    关于配置首先需要理解的一是：虽然 Spring Security 对摘要认证机制提供了完全开箱支持，但这种支持**在命名空间中的集成程度不如**基础认证。\n\
    \n在这种情况下，我们需要手动定义构成配置的 bean —— 即 *DigestAuthenticationFilter* 和 *DigestAuthenticationEntryPoint*。\n\
    \n```xml\n<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<beans xmlns=\"http://www.springframework.org/schema/beans\"\
    \n       xmlns:xsi=\"http://www.w3.org/2001/XMLSchema-instance\"\n       xmlns:security=\"\
    http://www.springframework.org/schema/security\"\n     xsi:schemaLocation=\"http://www.springframework.org/schema/beans\n\
    \           http://www.springframework.org/schema/beans/spring-beans.xsd\n   \
    \        http://www.springframework.org/schema/security\n           http://www.springframework.org/schema/security/spring-security-3.2.xsd\"\
    >\n\n  <security:bean id=\"digestFilter\" class=\"org.springframework.security.web.authentication.DigestAuthenticationFilter\"\
    >\n    <property name=\"userDetails\" ref=\"userService\" />\n    <property name=\"\
    authenticationEntryPoint\" ref=\"digestEntryPoint\" />\n  </security:bean>\n\n\
    \  <security:bean id=\"digestEntryPoint\" class=\"org.springframework.security.web.authentication.DigestAuthenticationEntryPoint\"\
    >\n    <property name=\"realmName\" value=\"Digest Authentication\" />\n    <property\
    \ name=\"key\" value=\"challenge\" />\n  </security:bean>\n\n  <security:http\
    \ entry-point-ref=\"digestEntryPoint\">\n    <security:intercept-url pattern=\"\
    /*\" access=\"isAuthenticated\"/>\n    <security:custom-filter ref=\"digestFilter\"\
    \ before=\"BASIC_AUTH_FILTER\"/>\n  </security:http>\n\n  <security:authentication-manager>\n\
    \    <security:authentication-provider>\n      <security:user-service id=\"userService\"\
    >\n        <security:user name=\"user1\" password=\"Pass\" authorities=\"ROLE_USER\"\
    \ />\n      </security:user-service>\n    </security:authentication-provider>\n\
    \  </security:authentication-manager>\n\n</beans>\n```\n\n接下来，我们需要将这些 bean 集成到整体安全配置中——在这种情况下，命名空间仍然足够灵活，允许我们完成操作。\n\
    \n第一部分是通过主 `<http>` 元素的 `entry-point-ref` 属性指向自定义的入口点 bean。第二部分是**将新定义的摘要过滤器添加到过滤器链中**。由于该过滤器的在功能上等同于\
    \ *BasicAuthenticationFilter*，因此我们使用了过滤器链中的相同位置——这是通过 Spring Security 标准过滤器中的\
    \ `BASIC_AUTH_FILTER` 别名指定的。\n\n最后，注意摘要过滤器被配置为**指向用户服务**——在这里，命名空间再次发挥了作用，因为它允许我们为\
    \ `<user-service>` 元素创建的默认用户服务指定 bean。\n\n## 3. 调用受保护的应用程序\n\n我们将使用 `curl` 命令来调用受保护的应用程序，并理解客户端如何与其交互。首先，我们在请求中**不提供任何安全凭据**来请求首页：\n\
    \n```bash\ncurl -i http://localhost/spring-security-digest-auth/homepage.html\n\
    ```\n\n如预期，我们收到了一个带有 401 Unauthorized 状态码的响应：\n\n```\nHTTP/1.1 401 Unauthorized\n\
    Server: Apache-Coyote/\nSet-Cookie: JSESSIONID=CF0233C; Path=/spring-security-digest-auth/;\
    \ HttpOnly\nWWW-Authenticate: Digest Realm=\"Digest Authentication\", qop=\"auth\"\
    , nonce=\"MTM3M3zODE2Nt3GToC3MmtxN2JKOWYYzXtc4MdzZmIn2QY0ZT0UN2RKZg\"\nContent-Type:\
    \ text/html; charset=utf-8\nContent-Length: 1061\nDate: Fri, 12 Jul 2013 14:04:25\
    \ GMT\n```\n\n如果此请求是由浏览器发送的，认证挑战将使用简单的用户/密码对话框提示用户输入凭据。现在让我们**提供正确的凭据**并再次发送请求：\n\
    \n```bash\ncurl -i --user user1:Pass http://localhost/spring-security-digest-auth/homepage.html\n\
    ```\n\n**注意**，我们通过 `-digest` 标记为 `curl` 命令启用了摘要认证。服务器的第一个响应将是相同的 —— **401 Unauthorized**\
    \ ——但挑战将在第二次请求中拦截并处理 —— 该请求将成功并返回 **200 OK**。\n\n## 4. Maven 依赖\n\n```\nHTTP/1.1\
    \ 401 Unauthorized\nServer: Apache-Coyote/1.1\nSet-Cookie: SESSIONID-A5661ED0...;\
    \ Path=/spring-security-digest-auth/; HttpOnly\nWWW-Authenticate: Digest realm='Digest\
    \ Realm via Digest Authentication', qop=\"auth\",\nMTMMzYxQyOgtOTcMzIz4MOWQGUYzQgYmZWRIJMDQZZWKOA==\n\
    Content-Type: text/html;charset=utf-8\nContent-Length: 101\nDate: Fri, 12 Jul\
    \ 2013 14:15:29 GMT\n\nHTTP/1.1 200 OK\nServer: Apache-Coyote/1.1\nSet-Cookie:\
    \ SESSIONID-A5661ED0...; Path=/spring-security-digest-auth/; HttpOnly\nContent-Type:\
    \ text/html;charset=utf-8\nContent-Length: 101\nDate: Fri, 12 Jul 2013 14:15:29\
    \ GMT\n```\n\n## 5. 总结\n\n在本节中，我们通过利用摘要认证为简单的 REST API 引入了安全性。这些示例的实现可以在 GitHub\
    \ 项目中找到——这是一个基于 Eclipse 的项目，因此很容易导入和运行。当项目在本地运行时，可以通过以下地址访问首页 HTML（或在最小化 Tomcat\
    \ 配置下，通过 80 端口访问）：\n\nhttp://localhost:8080/spring-security-digest-auth/homepage.html\n\
    \n最后，在下一节中，我们将看到应用程序并没有必要在基础认证和摘要认证之间进行选择——两者都可以在相同的 URI 结构上同时设置，使得客户端在调用 Web\
    \ 应用程序可以在两者之间进行选择。\n\n"
