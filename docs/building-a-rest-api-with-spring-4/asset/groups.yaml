    # 11: REST PAGINATION IN SPRING


    # 1. Overview


    This section will focus on the implementation of pagination in a REST API, using
    Spring MVC and Spring Data.


    # 2. Page as Resource vs Page as Representation


    The first question when designing pagination in the context of a RESTful architecture
    whether to consider the page as an actual Resource or a Representation of Resources.


    Treating the page itself as a resource host introduces a host of problems such
    as no longer being able to uniquely identify resources between calls. This, coupled
    with the fact that, in the persistence layer, the page is not proper entity but
    a holder that is constructed when necessary, makes the choice straightforward:
    the page is part of the representation.


    The next question in the pagination design in the context of REST is where to
    include the paging information:


    +   - in the URI path: /foo/page/1

    - the URI query: /foo?page=1


    Keeping in mind that a page is not a Resource, encoding the page information in
    the URI is no longer an option.


    We are going to use the standard way of solving this problem by encoding the paging
    information in a URI query.'
