    # Building a REST API with Spring4


    # 8. REST Paging with Range HTTP headers


    Another option is to return redirect - 303 (See Other) - to the first page. A
    conservative route would be to simply return to the client a 405 (Method Not Allowed)
    for the GET request.


    # 8. REST Paging with Range HTTP headers


    A relatively different way of implementing pagination is to work with the HTTP
    Range headers - Range, Content-Range, If-Range, Accept-Ranges - and HTTP status
    codes - 206 (Partial Content), 413 (Request Entity Too Large), 416 (Requested
    Range Not Satisfiable). One view on this approach is that the HTTP Range extensions
    were not intended for pagination, and that they should be managed by the Server,
    not by the Application. Implementing pagination based on the HTTP Range header
    extensions is nevertheless technically possible, although not nearly common as
    the implementation discussed in this section.


    # 9. Conclusion


    We illustrated how to implement Pagination in a REST API using Spring, and discussed
    how to set up and test Discoverability.


    If you want to go in depth on pagination in the persistence level, check out our
    JPA or Hibernate pagination tutorials.


    The implementation of all these examples and code snippets can be found in my
    github project - this is an Eclipse based project, so it should be easy to import
    and run as it is.


