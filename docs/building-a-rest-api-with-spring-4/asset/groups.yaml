    \ the exact same URIs of the service, just asking for a different Media Type.\n\
    \n## 2. Goals\n\nAny REST API needs to expose it its Resources as representations\
    \ using some sort of Type, and in many cases more than a single one. **The client\
    \ will set the Accept header** to choose the type of representation it asks for\
    \ from the service.\n\nSince the Resource can have multiple representations, the\
    \ server will have to implement a mechanism responsible with choosing the right\
    \ representation - also known as **Content Negotiation**. Thus, if the client\
    \ asks for `application/xml`, then it should get an XML representation of the\
    \ Resource, and if it asks for `application/json`, then it should get JSON.\n\n\
    ## 3. Testing Infrastructure\n\nWe will begin by defining a simple interface for\
    \ a **marshaller** – this will be the main abstraction that will allow the test\
    \ to switch between different Media Types:\n\n# Building a REST API with Spring\
    \ 4\n\n```java\npublic interface IMarshaller {\n...\n    String getMime();\n}\n\
    ```\n\nWe then need a way to initialize the right marshaller. For this mechanism,\
    \ we will use a SpringFactoryBean to initialize the marshaller and a simple property\
    \ to determine which marshaller to use:\n\n```java\n@Component\n@Profile(\"test\"\
    )\npublic class TestMarshaller implements FactoryBean<IMarshaller> {\n\n    @Autowired\n\
    \    private Environment env;\n\n    public IMarshaller getObject() {\n      \
    \  String testMime = env.getProperty(\"test.mime\");\n        if (testMime !=\
    \ null) {\n            switch (testMime) {\n                case \"json\":\n \
    \                   return new JacksonMarshaller();\n                case \"xml\"\
    :\n                    return new XStreamMarshaller();\n                default:\n\
    \                    throw new IllegalStateException();\n            }\n     \
    \   }\n        return new JacksonMarshaller();\n    }\n\n    public Class<IMarshaller>\
    \ getObjectType() {\n        return IMarshaller.class;\n    }\n\n    public boolean\
    \ isSingleton() {\n        return true;\n    }\n}\n```\n\nLet's look over this:\n\
    \n(Note: The OCR text seems to have some overlapping/interleaved sections in pages\
