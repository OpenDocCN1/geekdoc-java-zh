    \ 112\n\n# 1: BOOTSTRAP A WEB APPLICATION WITH SPRING 4\n\n## 1. Overview\n\n\
    This section illustrates how to Bootstrap a Web Application with Spring and also\
    \ discusses how to make the jump from XML to Java without having to completely\
    \ migrate the entire XML configuration.\n\n## 2. The Maven pom.xml\n\n```xml\n\
    <project xmlns=\"http://maven.apache.org/POM/4.0.0\"\nxmlns:xsi=\"http://www.w3.org/2001/XMLSchema-instance\"\
    \n     xsi:schemaLocation=\"http://maven.apache.org/POM/4.0.0 http://maven.apache.org/xsd/maven-4.0.0.xsd\"\
    >\n  <modelVersion>4.0.0</modelVersion>\n  <groupId>rest</groupId>\n  <artifactId>rest</artifactId>\n\
    \  <version>0.0.1-SNAPSHOT</version>\n  <packaging>war</packaging>\n\n  <dependencies>\n\
    \    <dependency>\n      <groupId>org.springframework</groupId>\n      <artifactId>spring-webmvc</artifactId>\n\
    \      <version>5.3.1</version>\n      <exclusions>\n        <artifactId>commons-logging</artifactId>\n\
    \        <groupId>commons-logging</groupId>\n      </exclusions>\n    </dependency>\n\
    \  </dependencies>\n\n  <build>\n    <finalName>rest</finalName>\n```\n\n# Building\
    \ a REST API with Spring\n\n## 2.1. The cglib dependency before Spring 3.2\n\n\
    ```xml\n<plugins>\n  <plugin>\n    <groupId>org.apache.maven</groupId>\n    <artifactId>maven-compiler-plugin</artifactId>\n\
    \    <version>3.1</version>\n    <configuration>\n      <source>1.6</source>\n\
    \      <target>1.6</target>\n      <encoding>UTF-8</encoding>\n    </configuration>\n\
    \  </plugin>\n</build>\n<properties>\n  <spring.version>4.0.5.RELEASE</spring.version>\n\
    </properties>\n</project>\n```\n\n## 2.1. The cglib dependency before Spring 3.2\n\
    \nYou may wonder why cglib is a dependency - it turns out there is a valid reason\
    \ to include it the entire configuration cannot function without it. If removed,\
    \ Spring will throw:\n\nCaused by: java.lang.IllegalStateException: CGLIB is required\
    \ to process @Configuration classes. Either add CGLIB to the classpath or remove\
    \ the following @Configuration bean definitions\n\nThe reason this happens is\
    \ explained by the way Spring deals with @Configuration classes. These classes\
    \ are effectively beans, and because of this they need to be aware of the Context,\
    \ and respect scope and other bean semantics. This is achieved by dynamically\
    \ creating a cglib proxy with this awareness for each @Configuration class, hence\
    \ the cglib dependency.\n\nAlso, because of this, there are a few restrictions\
    \ for Configuration annotated classes:\n\n- Configuration classes should not be\
    \ final\n- They should have a constructor with no arguments\n"
