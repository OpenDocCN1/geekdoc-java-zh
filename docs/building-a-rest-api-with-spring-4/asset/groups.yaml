    \ it was necessary to manually register the PropertySourcesPlaceholderConfigurer,\
    \ see the Properties with Spring Tutorial.\n\n## 2: BUILD A REST API WITH SPRING\
    \ 4 AND JAVA CONFIG\n\n# 1. Overview\n\nThis section shows how to set up REST\
    \ in Spring – the Controller and HTTP response codes, configuration of payload\
    \ marshalling and content negotiation.\n\n# 2. Understanding REST in Spring\n\n\
    The Spring framework supports 2 ways of creating RESTful services:\n\n-   using\
    \ MVC with ModelAndView\n-   using HTTP message converters\n\nThe ModelAndView\
    \ approach is older and much better documented, but also more verbose and configuration\
    \ heavy. It tries to shoehorn the REST paradigm into the old model, which is without\
    \ problems. The Spring team understood this and provided first-class REST support\
    \ with Spring 3.0.\n\nThe new approach, based on HttpMessageConverter and annotations,\
    \ is much more lightweight and easy to implement. Configuration is minimal and\
    \ provides sensible defaults for what you would expect from a RESTful service.\
    \ It is however newer and a bit on the light side concerning documentation; what's\
    \ more, the reference doesn't go out of it's way to make the distinction and the\
    \ tradeoffs between the two approaches as clear as they should be. Nevertheless,\
    \ this is the way RESTful services should be built after Spring 3.0.\n"
  mdcn: "\n\n## 2.2. Spring 3.2 及更高版本中的 cglib 依赖\n\n从 Spring 3.2 开始，不再需要显式地添加 cglib\
    \ 作为依赖。这是因为 Spring 现在对 cglib 进行内联（inlining）——这将确保所有基于类的代理代理功能在 Spring 3.2 中都能开箱即用。\n\
    \n新的 cglib 代码被放置在 Spring 包下：`org.springframework.cglib`（替换了原来的 `net.cglib`）。更改包名的原因是为了避免与类路径上已存在的任何\
    \ cglib 版本发生冲突。\n\n此外，现在使用了新的 cglib 3.0，它是从旧的 2.2 依赖升级而来的（更多细节请参阅此 JIRA 议）。\n\n\
    最后，随着 Spring 4.0 的发布，在 Java 8 即将到来的之际，此类变化（如移除 cglib 依赖）是可以预期的——你可以关注此内容。通过 Spring\
    \ Jira 跟踪 Spring 的支持情况，并通过 Java 8 资源页面关注相关动态。\n\n## 3.2. 基于 Java 的 Web 配置\n\n\
    ```java\n@Configuration\n@ImportResource(\"classpath:/rest_config.xml\")\n@ComponentScan(basePackages=\"\
    org.rest\")\n@PropertySource(\"classpath:rest.properties\",\"classpath:web.properties\"\
    )\npublic class AppConfig {\n  @Bean\n  public static PropertySourcesPlaceholderConfigurer\
    \ properties(Properties properties) {\n    return new PropertySourcesPlaceholderConfigurer();\n\
    \  }\n}\n```\n\n首先是 `@Configuration` 注解——这是 Java Spring 配置使用的元组件；它本身被标记为 `@Component`，这使得被标记的类成为标准的\
    \ Bean，因此也是组件扫描的候选。`@Configuration` 类的主要目的是为 Spring IoC 容器提供 Bean 定义源。更详细的描述，请参考官方文档。\n\
    \n## 使用 Spring4 构建 REST API\n\n然后，使用 `@ImportResource` 来导入现有的基于 XML 的 Spring 配置。这些配置仍将从\
    \ XML 迁移到 Java，或者作为你想要保留的遗留配置。无论何种方式，将其导入容器对于成功迁移都是关重要的，这允许在不产生太大风险的情况下进行小步。被替换的等效\
    \ XML 注解为：\n\n```xml\n<import resource=\"classpath:/rest_config.xml\" />\n```\n\
    \n接下来是 `@ComponentScan` —— 它配置了组件扫描指令，有效地替换了 XML：\n\n```xml\n<context:component-scan\
    \ base-package=\"org.rest\" />\n```\n\n从 Spring 3.1 开始，`@Configuration` 默认排除在类路径扫描之外——参见此\
    \ JIRA 议。但在 Spring 3.1 之前，这些类应该被显式地排除：\n\n```java\nexcludeFilters = { @ComponentScan.Filter(Configuration.class)\
    \ }\n```\n\n`@Configuration` 类不应该被自动发现，因为它们已经由容器指定并使用——允许它们被重新发现并引入 Spring 上下文会导致以下错误：\n\
    \n> Caused by: org.springframework.framework.context.annotation.ConflictingBeanDefinitionException:\
    \ 注解指定的 Bean 名称 'webConfig' 对应于类类 [org.rest.spring.AppConfig] 与已有的同名且同类但不兼容的 Bean\
    \ 定义 [org.rest.spring.AppConfig] 冲突\n\n最后，使用 `@Bean` 注解来配置属性支持——`PropertySourcesPlaceholderConfigurer`\
    \ 在标记了 `@Bean` 的方法中初始化，这表明它将是一个由容器管理的 Spring Bean。这种新配置替换了以下 XML：\n\n```xml\n\
    <context:property-placeholder location=\"classpath:persistence.properties, classpath:web.properties\"\
    \ ignore-unresolvable=\"true\" />\n```\n\n## 使用 Spring4 构建 REST API\n\n关于为什么需要手动注册\
    \ `PropertySourcesPlaceholderConfigurer` 的更深入讨论，请参阅《Spring 属性教程》。\n\n## 3.1. web.xml\n\
    \n```xml\n<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<web-app xmlns=\"http://java.sun.com/xml/ns/javaee\"\
    \ xmlns:xsi=\"http://www.w3.org/2001/XMLSchema-instance\" xsi:schemaLocation=\"\
    http://java.sun.com/xml/ns/javaee/web-app_3_0.xsd http://java.sun.com/xml/ns/javaee\"\
    \ id=\"rest\" version=\"3.0\">\n\n    <context-param>\n        <param-name>contextClass</param-name>\n\
    \        <param-value>org.springframework.web.context.support.AnnotationConfigWebApplicationContext</param-value>\n\
    \    </context-param>\n    <context-param>\n        <param-name>contextConfigLocation</param-name>\n\
    \        <param-value>org.springframework.rest.root</param-value>\n    </context-param>\n\
    \    <listener>\n        <listener-class>org.springframework.web.context.ContextLoaderListener</listener-class>\n\
    \    </listener>\n    <servlet>\n        <servlet-name>rest</servlet-name>\n \
    \       <servlet-class>org.springframework.web.servlet.DispatcherServlet</servlet-class>\n\
    \        <init-param>\n            <param-name>contextClass</param-name>\n   \
    \         <param-value>org.springframework.web.context.support.AnnotationConfigWebApplicationContext</param-value>\n\
    \        </init-param>\n        <init-param>\n            <param-name>contextConfigLocation</param-name>\n\
    \            <param-value>org.springframework.rest.root</param-value>\n      \
    \  </init-param>\n        <load-on-startup>1</load-on-startup>\n    </servlet>\n\
    \    <servlet-mapping>\n        <servlet-name>rest</servlet-name>\n        <url-pattern>/*</url-pattern>\n\
    \    </servlet-mapping>\n    <welcome-list>\n        <welcome-file>/</welcome-file>\n\
    \    </welcome-list>\n</web-app>\n```\n\n## 使用 Spring4 构建 REST API\n\n关于为什么需要手动注册\
    \ `PropertySourcesPlaceholderConfigurer` 的更深入讨论，请参阅《Spring 属性教程》。\n\n## 3.1. web.xml\n\
    \n```xml\n<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<web-app xmlns=\"http://java.sun.com/xml/ns/javaee\"\
    \ xmlns:xsi=\"http://www.w3.org/2001/XMLSchema-instance\" xsi:schemaLocation=\"\
    http://java.sun.com/xml/ns/javaee/web-app_3_0.xsd http://java.sun.com/xml/ns/javaee\"\
    \ id=\"rest\" version=\"3.0\">\n\n    <context-param>\n        <param-name>contextClass</param-name>\n\
    \        <param-value>org.springframework.web.context.support.AnnotationConfigWebApplicationContext</param-value>\n\
    \    </context-param>\n    <context-param>\n        <param-name>contextConfigLocation</param-name>\n\
    \        <param-value>org.springframework.rest.root</param-value>\n    </context-param>\n\
    \    <listener>\n        <listener-class>org.springframework.web.context.ContextLoaderListener</listener-class>\n\
    \    </listener>\n    <servlet>\n        <servlet-name>rest</servlet-name>\n \
    \       <servlet-class>org.springframework.web.servlet.DispatcherServlet</servlet-class>\n\
    \        <init-param>\n            <param-name>contextClass</param-name>\n   \
    \         <param-value>org.springframework.web.context.support.AnnotationConfigWebApplicationContext</param-value>\n\
    \        </init-param>\n        <init-param>\n            <param-name>contextConfigLocation</param-name>\n\
    \            <param-value>org.springframework.rest.root</param-value>\n      \
    \  </init-param>\n        <load-on-startup>1</load-on-startup>\n    </servlet>\n\
    \    <servlet-mapping>\n        <servlet-name>rest</servlet-name>\n        <url-pattern>/*</url-pattern>\n\
    \    </servlet-mapping>\n    <welcome-list>\n        <welcome-file>/</welcome-file>\n\
    \    </welcome-list>\n</web-app>\n```\n\n## 使用 Spring4 构建 REST API\n\n关于为什么需要手动注册\
    \ `PropertySourcesPlaceholderConfigurer` 的更深入讨论，请参阅《Spring 属性教程》。\n\n## 3.1. web.xml\n\
    \n```xml\n<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<web-app xmlns=\"http://java.sun.com/xml/ns/javaee\"\
    \ xmlns:xsi=\"http://www.w3.org/2001/XMLSchema-instance\" xsi:schemaLocation=\"\
    http://java.sun.com/xml/ns/javaee/web-app_3_0.xsd http://java.sun.com/xml/ns/javaee\"\
