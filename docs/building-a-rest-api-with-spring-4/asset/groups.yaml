    \ change - the new URI can replace the old one and Clients will be able to discover\
    \ the URI and still function.\n\nIt is worth noting that, while using version\
    \ identifiers in the URI is problematic for these reasons, it is not un-RESTful\
    \ in any way.\n\n# 6. Conclusion\n\nThis section is tried to provide an overview\
    \ of the very diverse and difficult problem of evolving a REST Service. We discussed\
    \ the two common solutions, advantages and disadvantages of each one, and ways\
    \ to reason about these approaches in the context of REST. The material concludes\
    \ making the case for the second solution - versioning the media types, while\
    \ examining the possible changes to a RESTful API.\n\n# 14: TESTING REST WITH\
    \ MULTIPLE MIME TYPES\n\n## 1. Overview\n\nThis final section will focus on **testing\
