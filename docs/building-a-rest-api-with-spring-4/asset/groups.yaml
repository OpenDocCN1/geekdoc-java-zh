  - '[PAGE 15]


    # Building a REST API with Spring4


    First, the root context is defined and configured to use

    AnnotationConfigWebApplicationContext instead of the default XmlWebApplicationContext.
    The newer AnnotationConfigWebApplicationContext accepts @Configuration annotated
    classes as input for the Container configuration and is needed in order to set
    up the Java based context.


    Unlike XmlWebApplicationContext, it assumes no default configuration class locations,
    so the "contextConfigLocation" init-param for the Servlet must be set. This will
    point to the java package where the @Configuration classes are located; the fully
    qualified name(s) of the classes are also supported.


    Next, the DispatcherServlet is configured to use the same kind of context, with
    the only difference that it''s loading configuration classes out of a different
    package.


    Other than this, the web.xml doesn''t really change from an XML to a Java based
    configuration.


    # 4. Conclusion


    The presented approach allows for a smooth migration of the Spring configuration
    from XML to Java, mixing the old and the new. This is important for older projects,
    which may have a lot of XML based configuration that cannot be migrated all at
    once.


    This way, in a migration, the XML beans can be ported in small increments.


    In the next section on REST with Spring, I cover setting up MVC in the project,
    configuration of the HTTP status codes, payload marshalling and content negotiation.


    This is an Eclipse based project, so it should be easy to import and run as it
    is.


    ![](img/9e952c1884adb105358b0d748e0b42fd_15_0.png)'
