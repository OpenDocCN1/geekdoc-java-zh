    # 3. Consuming the Secured Application


    We''re going to use the `curl command` to consume the secured application and
    understand how a client can interact with it.


    Let''s start by requesting the homepage - **without providing security credentials**
    in the request:


    ```

    curl -i http://localhost/spring-security-mvc-digest-auth/homepage.html

    ```


    As expected, we get back a response with a 401 Unauthorized status code:


    ```

    HTTP/1.1 401 Unauthorized

    Server: Apache-Coyote/

    Set-Cookie: JSESSIONID=CF0233C; Path=/spring-security-mvc-digest-auth/; HttpOnly

    WWW-Authenticate: Digest Realm via Digest Authentication", qop="auth", nonce="MTM3M30zODE2Nt3GToC3MmtxN2JJKOWYYzXtc4MdzMzZmIn2QYm0ZT0UN2RKZg=""

    Content-Type: text/html; charset=utf-8

    Content-Length: 1061

    Date: Fri, 12 Jul 2013 14:04:25 GMT

    ```


    If this request was sent by the browser, the authentication challenge would prompt
    the user for credentials using a simple user/password dialog.


    Let''s now **provide the correct credentials** and send the request again:


    ```

    curl -i --user user1:Pass http://localhost/spring-security-mvc-digest-auth/homepage.html

    ```


    **Notice** that we are enabling Digest Authentication for the `curl` command via
    the `-digest` flag.


    The first response from the server will be the same – the **401 Unauthorized**
    – but the challenge will be intercepted and acted upon a second request – which
    will succeed with a **200 OK**.'
