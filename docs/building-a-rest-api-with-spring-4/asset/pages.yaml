    \ for the error handling of a Spring REST Service. It does however have limitations:\
    \ it's interacting with the low level HttpServletResponse and it fits into the\
    \ old MVC model which uses ModelAndView – so there's still room for improvement.\n\
    \n# 4. Solution 3 – The New @ControllerAdvice (Spring 3.2 And Above)\n\nSpring\
    \ 3.2 brings support for a global @ExceptionHandler with the new @ControllerAdvice\
    \ annotation. This enables a mechanism that breaks away from the older MVC model\
    \ and use of ResponseEntity along with the type safety and flexibility of @ExceptionHandler."
