  md: '# 3: SPRING SECURITY FOR A REST API


    # 1. Overview


    This section shows how to Secure a REST Service using Spring and Spring Security
    3.1 with Java based configuration. We will focus on how to set up the Spring Configuration
    specifically for the REST API using a Login and Cookie approach.


    # 2. Spring Security in the web.xml


    The architecture of Spring Security is based entirely on Servlet Filters and,
    as such, comes before Spring MVC in regards to the processing of HTTP requests.
    Keeping this in mind, a filter needs to be declared in the web.xml of the application:


    ```

    <filter>

    <filter-name>springSecurityFilterChain</filter-name>

    <filter-class>org.springframework.web.filter.DelegatingFilterProxy</filter-class>

    </filter>

    <filter-mapping>

    <filter-name>springSecurityFilterChain</filter-name>

    <url-pattern>/*</url-pattern>

    </filter-mapping>

    ```


    The filter must necessarily be named ''springSecurityFilterChain'' to match the
    default bean created by Spring Security in the container.


    Note the defined filter is not the actual class implementing the security logic
    but a DelegatingFilterProxy with the purpose of delegating the Filter''s methods
    to an internal bean. This is done so that the target bean can still benefit from
    the Spring context lifecycle and flexibility.'
  merge: -1
  pgno: 25
- img_proc: true
  md: "# Building a REST API with Spring4\n\n3. The Security Configuration\n\nThe\
    \ URL pattern used to configure the Filter is /* even though the entire web service\
    \ is mapped to /api/* so that the security configuration has the option to secure\
    \ other possible mappings as well, if required.\n\n# 3. The Security Configuration\n\
    \n```\n<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<beans\n  xmlns=\"http://www.springframework.org/schema/security\"\
    \n  xmlns:xsi=\"http://www.w3.org/2001/XMLSchema-instance\"\n  xmlns:beans=\"\
    http://www.springframework.org/schema/beans\"\n  xmlns:sec=\"http://www.springframework.org/schema/security\"\
    \n  xsi:schemaLocation=\"http://www.springframework.org/schema/security\n  http://www.springframework.org/schema/security/spring-security-3.2.xsd\n\
    \  http://www.springframework.org/schema/beans\n  http://www.springframework.org/schema/beans/spring-beans-4.0.xsd\"\
    >\n\n  <http entry-point-ref=\"authenticationEntryPoint\">\n    <intercept-url\
    \ pattern=\"/api/admin/**\" access=\"ROLE_ADMIN/>\n  </http>\n\n  <form-login\n\
    \    authentication-success-handler-ref=\"mySuccessHandler\"\n    authentication-failure-handler-ref=\"\
    myFailureHandler\"\n  />\n\n  <logout />\n\n  <bean id=\"mySuccessHandler\"\n\
    \    class=\"org.rest.security.MySavedRequestAwareAuthenticationSuccessHandler\"\
    />\n  <bean id=\"myFailureHandler\"\n    class=\"org.springframework.security.web.authentication.SimpleUrlAuthenticationFailureHandler\"\
    />\n\n  <authentication-manager alias=\"authenticationManager\">\n    <authentication-provider>\n\
    \      <user-service>\n        <user name=\"temporary\" password=\"temporary\"\
    \ authorities=\"ROLE_ADMIN\"/>\n        <user name=\"user\" password=\"user\"\
    \ authorities=\"ROLE_USER\"/>\n      </user-service>\n    </authentication-provider>\n\
    \  </authentication-manager>\n\n</beans>\n```\n\nMost of the configuration is\
    \ done using the security namespace – for this to be enabled, the schema locations\
    \ must be defined and point to the correct 3.1 or 3.2 XSD versions. The namespace\
    \ is designed so that it extends the common uses of Spring Security while providing\
    \ raw beans to accommodate more advanced scenarios."
