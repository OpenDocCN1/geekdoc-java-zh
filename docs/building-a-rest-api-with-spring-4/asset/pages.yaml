  md: "# 6: BASIC AND DIGEST AUTHENTICATION FOR A REST SERVICE WITH SPRING SECURITY\n\
    \n# 1. Overview\n\nThis section discusses how to **set up both Basic and Digest\
    \ Authentication on the same URI structure of a REST API**. In the two previous\
    \ sections, we discussed another method of securing the REST Service - form based\
    \ authentication, so Basic and Digest authentication is the natural alternative,\
    \ as well as the RESTful one.\n\n# 2. Configuration of Basic Authentication\n\n\
    The main reason that form based authentication is not ideal for a RESTful Service\
    \ is that Spring Security will make **use of Sessions** - this of course on the\
    \ server, **the statelessness constraints in REST** is practically ignored.\n\n\
    We'll start by setting up Basic Authentication – first we remove the old custom\
    \ entry point and filter from the `<http>` security element:\n\n```\n<http create-session=\"\
    stateless\">\n  <intercept-url pattern=\"/api/admin/**\" access=\"ROLE_ADMIN\"\
    \ />\n\n<http-basic />\n</http>\n```\n\nNote how support for basic authentication\
    \ has been added with a single configuration line - `<http-basic />` - which handles\
    \ the creation and wiring of both the `BasicAuthenticationFilter` and the `BasicAuthenticationEntryPoint`."
  merge: -1
  pgno: 45
- img_proc: true
  md: '# 2.1. Satisfying the stateless constraint – getting rid of sessions


    One of the main constrains of the RESTful architectural style is that the client-server
    communication is fully stateless, as the original dissertation reads:


    ### 5.1.3 Stateless

    We add a constraint to the client-server interaction: communication must be stateless
    in nature, as in the client-stateless-server (CSS) style of Section 3.4.3 (Figure
    5-3), such that each request from client to server must contain all of the information
    necessary to understand the request, and cannot take advantage of any stored context
    on the server. Session state is therefore kept entirely on the client.


    The concept of Session on the server is with a long history in Spring Security,
    and removing it has been difficult until now, especially when configuration was
    done by using the namespace. However, Spring Security 3.1 augments the namespace
    configuration with a new stateless option for session creation, which effectively
    guarantees that no session will be created or used by Spring. What this new option
    does completely removes all session related filters from the security filter chain,
    ensuring that authentication is performed for each request.


    # 3. Configuration of Digest Authentication


    Starting with the previous configuration, the filter and entry point necessary
    to set up digest authentication will be defined as beans. Then, the digest entry
    point created by <http-basic> behind the scenes. Finally, the custom digest filter
    will be introduced in the security filter chain using the after semantics of the
    security namespace to position it directly after the basic authentication filter.'
  merge: -1
