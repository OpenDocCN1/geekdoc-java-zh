  md: "# Building a REST API with Spring\n\n# 3. Solution 2 – The HandlerExceptionResolver\n\
    \n```\npublic class FooController{\n    @ExceptionHandler(CustomException1.class,\
    \ CustomException2.class)\n    public void handleException() {\n        //\n \
    \   }\n}\n```\n\nThis approach has a major drawback – the @ExceptionHandler annotated\
    \ method is only active for that particular Controller, not globally for the entire\
    \ application. Course adding this to every controller makes it not well suited\
    \ for a general exception handling mechanism.\n\nThe limitation is often worked\
    \ around by having all Controllers extend a Base Controller class – however, this\
    \ can be a problem for applications, for whatever reasons, the Controllers cannot\
    \ be made to extend from another base class which may be in another jar or not\
    \ directly modifiable, or by themselves not be directly modifiable.\n\nNext, we'll\
    \ look at another way to solve the exception handling problem – one that is global\
    \ and does not include any changes to existing artifacts as Controllers.\n\n#\
    \ 3. Solution 2 – The HandlerExceptionResolver\n\nThe second solution is to define\
    \ a HandlerExceptionResolver – this will resolve any exception thrown by the application.\
    \ It will also allow us to implement a uniform exception handling mechanism in\
    \ our REST API.\n\nBefore going for a custom resolver, let’s go over the existing\
    \ implementations.\n\n# 3.1 ExceptionHandlerExceptionResolver\n\nThis resolver\
    \ was introduced in Spring 3.1 and is enabled by default in the DispatchDispatcher.\
