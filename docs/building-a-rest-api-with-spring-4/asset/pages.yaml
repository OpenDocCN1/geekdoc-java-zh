  md: "Building a REST API with Spring4\n\n3.2. The Entry Point\n\n# 3.1. The &lt;http&gt;\
    \ element\n\nThe &lt;http&gt; element is the main container element for HTTP security\
    \ configuration. In the current implementation, it only secured a single mapping:\
    \ /api/admin/**. Note that the mapping is relative to the root context of the\
    \ web application, not to the rest Servlet; this is because the entity security\
    \ configuration lives in the root Spring context and not in the child context\
    \ of the Servlet.\n\n# 3.2. The Entry Point\n\nIn a standard web application,\
    \ the authentication process may be automatically triggered when the client tries\
    \ to access a secured resource without being authenticated – this is usually done\
    \ by redirecting to a login page so that the user can enter credentials. However,\
    \ for a REST Web Service this behavior doesn't make sense – Authentication should\
    \ only be done by a request to the correct URI and all requests should simply\
    \ fail with a 401 UNAUTHORIZED status code if the user is not authenticated.\n\
    \nSpring Security handles this automatic triggering of the authentication process\
    \ with the concept of an Entry Point – this is a required part of the configuration,\
    \ and can be injected via the entry-point-ref attribute of the &lt;http&gt; element.\
    \ Keeping in mind that this functionality doesn't make sense in the context of\
    \ the REST Service, the new custom entry point is defined to simply return 401\
    \ whenever it is triggered:\n\n```\n@Component(\"restAuthenticationEntryPoint\"\
    )\npublic class RestAuthenticationEntryPoint implements AuthenticationEntryPoint{\n\
    \    @Override\npublic void commence(HttpServletRequest request, HttpServletResponse\
    \ response,\nAuthenticationException authException) throws IOException(\n    response.sendError(HttpServletResponse.SC_UNAUTHORIZED,\
    \ \"Unauthorized\");\n}\n```\n\nA quick sidenote here is that the 401 is sent\
    \ without the WWW-Authenticate header, as required by the HTTP Spec – we of course\
    \ set the value manually if we need to."
  merge: -1
  pgno: 27
- img_proc: true
  md: '# 3.3. The Login Form for REST


    There are multiple ways to do Authentication for a REST API - one of the default
    Spring Security provides is Form Login - which uses an authentication processing
    filter - org.springframework.security.web.authentication.UsernameAuthenticationFilter.


    The `<form-login>` element will create this filter and also allow us to set our
    custom authentication success handler on it. This can also be done manually using
    the `<custom-filter>` element to register a filter at the position FORM_LOGIN_FILTER
    - but the namespace support is flexible enough.


    > Note that for a standard web application, the auto-config attribute of the <http>
    element is shorthand syntax for some simple web security configuration. While
    this makes sense in the context of some simple configurations, it doesn''t fit
    and should not be used for a REST API.


    # 3.4. Authentication should return 200 instead of 301


    By default, form login will answer a successful authentication request with a
    301 MOVED PERMANENTLY status code; this makes sense in the context of an actual
    login form which needs to redirect after login. For a RESTful web service however,
    the desired response for successful authentication should be 200 OK.


    This is done by injecting a custom authentication success handler in the login
    filter, to replace the default one. The new handler implements the exact same
    login as the default org.springframework.security.web.authentication.Handler SavedRequestAwareAuthenticationSuccessHandler
    with one notable difference - the redirect logic is removed.'
  merge: -1
