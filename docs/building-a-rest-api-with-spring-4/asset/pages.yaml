  md: "# Building a REST API with Spring4\n\n# 2. The Security XML Configuration\n\
    \n```\n<beans:bean id=\"digestFilter\"\n  class=\"org.springframework.security.web.authentication.DigestAuthenticationFilter\"\
    >\n  <property name=\"userDetails\" ref=\"userService\" />\n  <property name=\"\
    authenticationEntryPoint\" ref=\"digestEntryPoint\" />\n</beans:bean>\n<beans:bean\
    \ id=\"digestEntryPoint\"\n  class=\"org.springframework.security.web.authentication.DigestAuthenticationEntryPoint\"\
    >\n  <property name=\"realName\" value=\"Realm via Digest Authentication\" />\n\
    \  <property name=\"key\" value=\"acegi\" />\n</beans:bean>\n\n<!-- the security\
    \ namespace configuration -->\n<http url-expressions=\"true\" point-ref=\"digestEntryPoint\"\
    >\n  <intercept-url pattern=\"/*\" access=\"isAuthenticated(j)\"/>\n</http>\n\n\
    <custom-filter ref=\"digestFilter\" after=\"BASIC_AUTH_FILTER\" />\n\n<authentication-manager>\n\
    \  <authentication-provider>\n    <user-service id=\"userService\">\n      <user\
    \ name=\"user1\" password=\"userPass\" authorities=\"ROLE_USER\" />\n    </user-service>\n\
    \  </authentication-provider>\n</authentication-manager>\n\n<beans:beans>\n```\n\
    \nNext, we need to integrate these beans into the overall security configuration\
    \ – and in this case, the namespace is still flexible enough to allow us to do\
    \ that.\n\nThe first part of this is to pointing the custom entry point bean,\
    \ via the entry-point-ref attribute of the main <http> element.\n\nThe second\
    \ part is **adding the newly defined digest filter into the security filter chain**.\
    \ Since this filter is functionally equivalent to the *BasicAuthenticationFilter*,\
    \ we are using the same position in the chain – this is specified by the BASIC_AUTH_FILTER\
    \ alias in the overall Spring Security Standard Filters.\n\nFinally, notice that\
    \ the Digest Filter is configured to **point to the user service bean** – and\
    \ here, the namespace is again very useful as it allows us to specify a bean name\
    \ for the default user service created by the \\<user-service>* element:\n\n```\n\
    <user-service id=\"userService\">\n```"
