  md: '# 14: TESTING REST WITH MULTIPLE MIME TYPES


    #  1. Overview


    This final section will focus on **testing a REST Service with multiple Media
    Types/representations.**


    We will write integration tests capable of switching between the multiple types
    of Representations supported by the API. The goal is to be able to run the exact
    same test consuming the exact same URIs of the service, just asking for a different
    Media Type.


    # 2. Goals


    Any REST API needs to expose it''s Resources as representations using some sort
    of Type, and in many cases more than a single one. **The client will set the Accept
    header** to choose the type of representation it asks for from the service.


    Since the Resource can have multiple representations, the server will have to
    implement a mechanism responsible with choosing the right representation - also
    known as **Content Negotiation**. Thus, if the client asks for `application/xml`,
    then it should get an XML representation of the Resource, and if it asks for `application/json`,
    then it should get JSON.


    # 3. Testing Infrastructure


    We will begin by defining a simple interface for a **marshaller** – this will
    be the main abstraction that will allow the test to switch between different Media
    Types:'
