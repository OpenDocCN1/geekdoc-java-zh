    </filter-mapping>\n```\n\nThe filter is mapped on the same URI pattern as the\
    \ RESTful API itself. The filter itself is the standard implementation of ETag\
    \ since Spring 3.0.\n\nThe implementation is a **shallow** one – the ETag is calculated\
    \ based on the response,"
