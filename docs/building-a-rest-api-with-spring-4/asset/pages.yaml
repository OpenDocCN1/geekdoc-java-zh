  md: '# 3.6. The Authentication Manager and Provider


    The authentication process uses an in-memory provider to perform authentication
    – this is meant to simplify the configuration as a production implementation of
    these artifacts is outside the scope of this post.


    # 3.7 Finally – Authentication against the running REST Service


    Now let''s see how we can authenticate against the REST API – the URL for login
    is /j_spring_security_check – and a simple curl command performing login would
    be:


    ```

    curl -i X POST -d username=user -d password=userPass

    http://localhost:8080/spring-security-rest/j_spring_security_check

    ```


    This request will return the Cookie which will be used by any subsequent request
    against the REST Service.


    We can use curl to authentication and store the cookie it receives in a file:


    ```

    curl -i X POST -d username=user -d password=userPass -c /opt/cookies.txt

    http://localhost:8080/spring-security-rest/j_spring_security_check

    ```


    Then we can use the cookie from the file to do further authenticated requests:


    ```

    curl -i--header "Accept:application/json" GET -b /opt/cookies.txt

    http://localhost:8080/spring-security-rest/api/foos

    ```


    This authenticated request will correctly result in a 200 OK:


    ```

    HTTP/1.1 200 OK

    Server: Apache-Coyote/1.1

    Content-Type: application/json;charset=UTF-8

    Transfer-Encoding: chunked

    Date: Wed, 24 Jul 2013 20:31:13 GMT


    [{"id":"0","name":"JbidXc"}]

    ```'
