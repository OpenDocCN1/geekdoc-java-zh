    \ {\n    String rootURI = request.getURI().toString();\n    URI fooUri = new UriTemplate(\"\
    {rootURI}/resource\").expand(rootURI, \"foo\");\n    String linkToFoo = LinkUtil.createLinkHeader(fooUri.toASCII(),\
    \ \"collection\");\n    response.addHeader(\"Link\", linkToFoo);\n}\n```\n\nThis\
    \ is of course an illustration of the concept, focusing on a single, sample URI,\
    \ for Foo Resources - a real implementation should add, similarly, URIs for all\
    \ the Resources published to the client.\n\n# 5.1. Discoverability is not about\
    \ changing URIs\n\nThis can be a controversial point - the one hand, the purpose\
    \ of HATEOAS is to have the client discover the URIs of the API and not rely on\
    \ hardcoded values. On the other hand - this is not how the web works: yes, URIs\
    \ are discovered, but they are also bookmarked.\n\nA subtle but important distinction\
    \ is evolution of the API - the old URIs should still work, but any client that\
    \ will discover the API should discover the new URIs - allows the API to change\
    \ dynamically, and good clients to work well when the API changes.\n\nIn conclusion\
    \ - just because all URIs of the RESTful service web be considered cool URLs (and\
    \ cool URIs don't change) - that doesn't mean that adhering to the HATEOAS constraint\
    \ isn't extremely useful when evolving the API.\n\n# 6. Caveats of Discoverability\n\
    \nAs some of the discussions around the previous articles state, the first goal\
