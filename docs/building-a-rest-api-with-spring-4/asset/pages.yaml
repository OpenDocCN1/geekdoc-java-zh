  md: '# 6. Maven and Jenkins


    If Maven is set up to run integration tests against an already deployed REST Service,
    then it can be run like this:


    ```

    mvn test -Dtest.mime=xml

    ```


    Or, if this the build uses the integration-test phase of the Maven lifecycle:


    ```

    mvn integration-test -Dtest.mime=xml

    ```


    For more details about how to use these phases and how to set up the Maven build
    so that it will bind the deployment of the application to the *pre-integration-test
    goal*, run the integration tests in the integration-test goal and then shut down
    the deployed service in *post-integration-test*, see the [Integration Testing
    with Maven]() article.


    With **Jenkins**, the job must be configured with:


    ```

    This build is parametrized

    ```


    And the *String* parameter: **test.mime=xml** added.


    A common Jenkins configuration would be having to jobs running the same set of
    integration tests against the deployed service - one with XML and the other with
    JSON representations.'
