  md: '# Building a REST API with Spring4


    # 3. Client-Server communication with curl


    # 3. Client-Server communication with curl


    A simple Client-Server communication involving ETags can be broken down into the
    steps:


    +   - first, the Client makes a REST API call – the Response includes the ETag
    header to be stored for future:


    ```

    curl -H "Accept: application/json" -i http://localhost:8080/rest-sec/api/resources/1

    ```


    ```

    HTTP/1.1 200 OK

    ETag: "f88dd058fe00490961a64f01be66a7"

    Content-Type: application/json;charset=UTF-8

    Content-Length: 52

    ```


    +   - next the Client requests the REST API includes the If-None-Match request
    header with the ETag value from the previous step; if the Resource has not changed
    on the Server, the Response will contain no body and a status code of 304 - Not
    Modified:


    ```

    curl -H "Accept: application/json" -H "If-None-Match: "f88dd058fe00490961a64f01be66a7"

    -i http://localhost:8080/rest-sec/api/resources/1

    ?

    ```


    ```

    HTTP/1.1 304 Not Modified

    ETag: "f88dd058fe00490961a64f01be66a7"

    ```


    +   - now, before retrieving the Resource again, we will change it by performing
    an update:


    ```

    curl --user admin@fake.com:adminpass -H "Content-Type: application/json" -

    -X PUT -data "{"id":"1","name":"newRoleName2","description":"theNewDescription"
    }

    ```


    ```

    http://localhost:8080/rest-sec/api/resources/1

    ```


    ```

    HTTP/1.1 200 OK

    ETag: "d41d8cd98f00b204e9800998ecf8427e"

    Content-Length: 0

    ```'
