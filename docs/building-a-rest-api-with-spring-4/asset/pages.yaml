  md: "# 5. Possible Changes to the API\n\nNext, let's consider the types of changes\
    \ to the REST API – these are introduced here:\n\n+   - representation format\
    \ changes\n- resource changes\n\n# 5.1. Adding to the Representation of a Resource\n\
    \nThe format documentation of the media type should be designed with forward compatibility\
    \ in mind; specifically - a client should ignore information that it doesn't understand\
    \ (which JSON does better than XML).\n\nNow, adding information in the Representation\
    \ of a resource **will not break existing clients** these are correctly implemented.\n\
    \nTo continue our earlier **example**, adding the amount in the representation\
    \ of the user will be a breaking change:\n\n```\n{\n  \"user\": {\n    \"name\"\
    : \"John Smith\",\n    \"amount\": \"300\"\n  }\n}\n```\n\n# 5.2. Removing or\
    \ changing an existing Representation\n\nRemoving, renaming or generally restructuring\
    \ information in the design of existing representations is a breaking change for\
    \ clients, because they already understand and rely on the old format.\n\nThis\
    \ is where Content Negotiation comes in – for such changes, **a new vendor MIME\
    \ type** needs to be introduced."
