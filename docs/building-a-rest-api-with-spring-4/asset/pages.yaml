  md: "Building a REST API with Spring4\n\n3.2. DefaultHandlerExceptionResolver\n\n\
    # 3.2. DefaultHandlerExceptionResolver\n\nThe Resolver was introduced in Spring\
    \ 3.0 and is enabled by default in the DispatcherServlet. It is used to resolve\
    \ standard Spring exceptions to their corresponding HTTP Status Codes, namely\
    \ Client error - 4xx and Server error - 5xx status codes. Here is the full list\
    \ of the Spring Exceptions handles, and how these are mapped to status codes.\n\
    \nWhile it sets the Status Code of the Response properly, one limitation is it\
    \ doesn't set anything to the body of the Response. For a REST API - the Status\
    \ Code is really not enough information to present to the Client - the response\
    \ has to have a body as well, the application to give additional information about\
    \ the failure.\n\nThis can be solved by configuring View resolution and rendering\
    \ error content through ModelAndView, but the solution is not optimal - which\
    \ is why a better option has been made available with Spring 3.2 - we'll talk\
    \ about that in the latter part of this section.\n\n# 3.3. ResponseStatusExceptionResolver\n\
    \nThis resolver was also introduced in Spring 3.0 and is enabled by default in\
    \ the DispatcherServlet. It's main responsibility is to use the @ResponseStatus\
    \ annotation on custom exceptions and to map these exceptions to HTTP status codes.\n\
    \nSuch a custom exception may look like:\n\n```\n@ResponseStatus(value = HttpStatus.NOT_FOUND)\n\
    public final class ResourceNotFoundException extends RuntimeException {\n    public\
    \ ResourceNotFoundException() {\n        super();\n    }\n    public ResourceNotFoundException(String\
    \ message, Throwableable cause) {\n        super(message, cause);\n    }\n   \
    \ public ResourceNotFoundException(String message) {\n        super(message);\n\
    \    }\n    public ResourceNotFoundException(Throwable cause) {\n        super(cause);\n\
    \    }\n}\n```"
