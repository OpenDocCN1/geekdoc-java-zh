  md: "# Building a REST API with Spring\n\n# 6. Mapping the HTTP response codes\n\
    \nYou may have noticed I'm using a very simple, guava style RestPreconditions\
    \ utility:\n\n```\npublic class RestPreconditions {\n    public static <T> T checkFind(final\
    \ T resource) {\n        if (resource == null) {\n            throw new MyResourceNotFoundException();\n\
    \        }\n        return resource;\n    }\n}\n```\n\nThe Controller implementation\
    \ is non-public** – this is because it doesn't need to be. Usually the controller\
    \ is the last in the chain (`DispatcherServlet`) and simply receives HTTP requests\
    \ from the Spring front controller. If there is no use case where the controller\
    \ has been injected or manipulated through a direct reference, then I prefer not\
    \ to declare it as public.\n\nThe **request mappings** are straightforward - as\
    \ with any controller, the actual value of the mapping as well as the method used\
    \ to determine the target method for the request.. `@RequestBody` will bind the\
    \ parameters of the method to the body of the HTTP request, whereas `@ResponseBody`\
    \ does the same for the response and return type. They also ensure that the resource\
    \ will be marshalled and unmarshalled using the correct HTTP converter. **Content\
    \ negotiation** will take place to choose which one of the active converters will\
    \ be used, based mostly on the Accept header, although other HTTP headers may\
    \ be used to determine the representation as well.\n\n# 6. Mapping the HTTP response\
    \ codes\n\nThe status codes of the HTTP response are one of the most important\
    \ parts of the REST service, and the subject can quickly become very complex.\
    \ Getting these right can be what makes or breaks the service.\n\n# 6.1. Unmapped\
    \ Requests\n\nIf Spring MVC receives a request which doesn't have a mapping, it\
    \ considers the request not to be allowed and returns a **405 METHOD NOT ALLOWED**\
    \ back to the client. It is also"
