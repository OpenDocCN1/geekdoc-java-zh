  md: 'Building a REST API with Spring4


    6.2. Valid, Mapped Requests


    good practice to include the Allow HTTP header when returning a 405 to the client,
    in order to specify which operations are allowed. This is the standard behavior
    of Spring MVC and does not require any additional configuration.


    # 6.2. Valid, Mapped Requests


    For any request that has a mapping, Spring MVC considers the request valid and
    responds with 200 OK if no status code is specified otherwise. It is because of
    that this controller declares different @ResponseEntity for the create, update
    and delete actions but not for get, which should indeed return the default 200
    OK.


    # 6.3. Client Error


    In case of a client error, custom exceptions are defined and mapped to the appropriate
    error codes. Simply throwing these exceptions from any of the layers of the web
    tier will ensure Spring maps the corresponding status code on the HTTP response.


    ```

    @ResponseEntity(value = HttpStatus.BAD_REQUEST )

    public class BadRequestException extends RuntimeException(

    //

    )

    @ResponseEntity(value = HttpStatus.NOT_FOUND)

    public class ResourceNotFoundException extends RuntimeException(

    )

    ```


    These exceptions are part of the REST API and, as such, should only be used in
    the appropriate layers conforming to REST; if instance a DAO/DAL layer exist,
    it should not use the exceptions directly. Note also that these are not checked
    exceptions but runtime exceptions - in line with Spring practices and idioms.


    # 6.4. Using @ExceptionHandler


    Another option to map custom exceptions on specific status codes is to use the
    @ExceptionHandler annotation in the controller. The problem with that approach
    is that the annotation only applies to the controller in which it is defined,
    not to the entire Spring


