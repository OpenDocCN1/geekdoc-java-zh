    \ {\n  MarshallingHttpMessage xmlConverter = \n    new MarshallingHttpMessage();\n\
    \n  XStreamMarshall xstreamMarshall = new XStreamMarshall();\n  xmlConverter.setSerializer(xstreamMarshall);\n\
    \  xmlConverter.setUnmarshaller(xstreamMarshall);\n\n  return xmlConverter;\n\
