  md: '# 13: VERSIONING A REST API


    # 1. The Problem


    Evolving a REST API is a difficult problem – one for which many options are available.
    This section discusses through some of these options.


    # 2. What is in the Contract?


    Before anything else, we need to answer one simple question: What is the Contract
    between the API and the Client?


    # 2.1. URIs part of the Contract?


    Let''s first consider the URI structure of the REST API – is that part of the
    contract? Should clients bookmark, hardcode and generally rely on URIs of the
    API?


    If they would, the interaction of the Client with the REST Service would no longer
    be driven by the Service itself, but by what Roy Fielding calls out-of-band information:


    A REST API should be entered with no prior knowledge beyond the initial URI (bookmark)
    and set of standardized media types that are appropriate for the intended audience...Failure
    implies that out-of-band information is driving interaction instead of hypertext.


    So clearly URIs are not part of the contract! The client should only know a single
    URI – the entry point to the API – all other URIs should be discovered while consuming
    the API.'
  merge: -1
  pgno: 98
- img_proc: true
  md: '# 2.2. Media Types part of the Contract?


    What about the Media Type information used for the representations of Resources
    – are these part of the contract between the Client and the Service?


    In order to successfully consume the API, the Client must have prior knowledge
    of these Media Types – in fact, the definition of these media types represents
    the entire contract, and is where the REST Service should focus on the most:


    A REST API should spend almost all of its descriptive effort in defining the media
    type(s) used for representing resources and driving application state, or in extending
    relation names and/or hypertext-enabled mark-up for existing standard media types.


    So the Media Type definitions are part of the contract and should be prior knowledge
    for the client that consumes the API – this is where standardization comes in.


    We now have a good idea of what the contract is, let’s move on to how to actually
    tackle the versioning problem.


    # 3. High Level Options


    Let''s now discuss the high level approaches to versioning the REST API:


    +   - URI Versioning – version the URI space using version indicators

    - Media Type Versioning – version the Representation of the Resource


    When we introduce the version in the URI space, the Representations of Resources
    are considered immutable, so when changes need to be introduced in the API, a
    new URI space needs to be created.'
  merge: -1
  pgno: 99
- img_proc: true
  md: "For example, say an API publishes the following resources – users and privileges:\n\
    \n```\nhttp://host/v1/users\nhttp://host/v1/privileges\n```\n\nNow, let's consider\
    \ that a breaking change in the users API requires **a second version to** be\
    \ introduced:\n\n```\nhttp://host/v2/users\nhttp://host/v2/privileges\n```\n\n\
    When we **version the Media Type and extend the language**, we [go through]()\
    \ Content Negotiation on this header. The REST API would make use of custom [endor\
    \ media types]() instead of generic media types as *application/json*. It is these\
    \ media types that are going to be versioned instead of the URIs.\n\nFor example:\n\
    \n```\n==>\nGET /users/3 HTTP/1.1\nAccept: application/vnd.myname.v1+json\n<=\n\
    HTTP/1.1 200 OK\nContent-Type: application/vnd.myname.v1+json\n{\n  \"user\":{\n\
    \    \"name\": \"John Smith\"\n  }\n}\n```\n\nWhat is important to understand\
    \ here is that **the client makes no assumptions about the structure of the response**\
    \ what is defined in the media type. This is why generic media types are not ideal\
    \ – these **do not provide enough semantic information** and force the client\
    \ to use additional hints to process the actual representation of the resource.\n\
    \nAn exception to this is using some other way of uniquely identifying the semantics\
    \ of the content – such as an XML schema."
  merge: -1
  pgno: 100
- img_proc: true
  md: '# 4. Advantages and Disadvantages


    Now that we have a clear concept of what is part of the Contract between the Client
    and the Service, as well as a high level overview of the options to version the
    API, let''s discuss the advantages and disadvantages of each approach.


    First, introducing version identifiers in the URI leads to a very large URI footprint.
    This is due to the fact that any breaking change in any of the published APIs
    will introduce a whole new tree of representations for the entire API. Over time,
    this becomes a burden to maintain as well as a problem for the client – which
    now has more options to choose from.


    Version identifiers in the URI also severely inflexible - there is no way to evolve
    the API of a single Resource, or a small subset of the overall API. As we mentioned
    before, this is an all or nothing approach - part of the API moves to the new
    version, then the entire API has move along with it. This makes upgrading clients
    from v1 to v2 a major undertaking – which leads to slower upgrades and longer
    sunset periods for the old versions.


    HTTP Caching is also a major concern when it comes to versioning.


    From the perspective of proxy caches in the middle, each approach has advantages
    and disadvantages: if the URI is versioned, then the cache will need to keep multiple
    copies of each Resource – one for every version of the API. This puts load on
    the cache and decreases the cache hit rate, since different clients will use different
    versions. Also, some cache invalidation mechanisms will not work. If the media
    type is the one that is versioned, then the Client and the Service need to support
    the Vary HTTP header to indicate that there are multiple versions being cached.


    From the perspective of client caching however, the solution that versions the
    media type involves slightly more than the one where URLs contain the version
    identifier. This is because it''s simply easier to cache something when its key
    is an URL than a media type.


    Let''s end this section with defining some goals (straight out of API Evolution):


    +   - keep compatible changes out of names

    - avoid new major versions

    - makes changes backwards-compatible

    - think about forwards-compatibility'
