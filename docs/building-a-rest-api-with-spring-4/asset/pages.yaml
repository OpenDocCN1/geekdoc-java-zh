  md: "# 3. The Controller\n\nNow, for the implementation – the Spring MVC Controller\
    \ for pagination is straightforward:\n\n```\n@RequestMapping(value = \"admin/foo\"\
    ,params = { \"page\", \"size\"},method = GET )\n@ResponseBody\npublic List<Foo>\
    \ findPaginated(\n    @RequestParam(\"page\") int page, @RequestParam(\"size\"\
    ) int size,\n    UriComponentsBuilder uriBuilder, HttpServletResponse response)\
    \ {\n    Page<Foo> resultPage = service.findPaginated(page, size);\n    if (page\
    \ > resultPage.getTotalPages()) {\n        throw new ResourceNotFoundException();\n\
