    \nOn the Spring support – to use ETag in Spring is extremely easy to set up and\
    \ completely **transparent** for the application. The support is enabled by adding\
    \ a simple *Filter* in the web.xml:\n\n```\n<filter>\n<filter-name>etagFilter</filter-name>\n\
