  md: "# Building a REST API with Spring4\n\n# 3.4.SimpleMappingExceptionHandlerResolverAndAnnotationMethodExceptionHandlerResolver\n\
    \nSame as the DefaultExceptionHandlerResolver, this resolver is limited in the\
