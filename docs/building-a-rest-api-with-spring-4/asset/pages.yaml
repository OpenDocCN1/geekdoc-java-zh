  md: "# Building a REST API with Spring\n\n# 2.1. The cglib dependency before Spring\
    \ 3.2\n\n```\n<plugins>\n  <plugin>\n    <groupId>org.apache.maven</groupId>\n\
    \    <artifactId>maven-compiler-plugin</artifactId>\n    <version>3.1</version>\n\
    \    <configuration>\n      <source>1.6</source>\n      <target>1.6</target>\n\
    \      <encoding>UTF-8</encoding>\n    </configuration>\n  </plugin>\n</build>\n\
    <properties>\n  <spring.version>4.0.5.RELEASE</spring.version>\n</properties>\n\
    </project>\n```\n\n# 2.1. The cglib dependency before Spring 3.2\n\nYou may wonder\
    \ why cglib is a dependency - it turns out there is a valid reason to include\
    \ it the entire configuration cannot function without it. If removed, Spring will\
    \ throw:\n\nCaused by: java.lang.IllegalStateException: CGLIB is required to process\
    \ @Configuration classes. Either add CGLIB to the classpath or remove the following\
    \ @Configuration bean definitions\n\nThe reason this happens is explained by the\
    \ way Spring deals with @Configuration classes. These classes are effectively\
    \ beans, and because of this they need to be aware of the Context, and respect\
    \ scope and other bean semantics. This is achieved by dynamically creating a cglib\
    \ proxy with this awareness for each @Configuration class, hence the cglib dependency.\n\
    \nAlso, because of this, there are a few restrictions for Configuration annotated\
    \ classes:\n\n+   - Configuration classes should not be final\n- They should have\
    \ a constructor with no arguments"
  merge: -1
  pgno: 11
- img_proc: true
  md: "# 2.2. The cglib dependency in Spring 3.2 and beyond\n\nStarting with Spring\
    \ 3.2, it is no longer necessary to add cglib as an explicit dependency. This\
    \ is because Spring is now inlining cglib - which will ensure that all class based\
    \ proxying functionality will work out of the box with Spring 3.2.\n\nThe new\
    \ cglib code is placed under the Spring package: org.springframework.cglib (replacing\
    \ the original net.cglib). The reason for the package change is to avoid conflicts\
    \ with any cglib versions already existing on the classpath.\n\nAlso, the new\
    \ cglib 3.0 is now used, upgraded from the older 2.2 dependency (see this JIRA\
    \ issue for more details).\n\nFinally, now Spring 4.0 is out in the wild, changes\
    \ like this (removing the cglib dependency) are to be expected with Java 8 just\
    \ around the corner - you can watch this. Spring Jira to keep track of the Spring\
    \ support, and the Java 8 Resources page to keep tabs on that.\n\n# 3.2. The Java\
    \ based Web Configuration\n\n```\n@Configuration\n@ImportResource(\"classpath:/rest_config.xml\"\
    )\n@ComponentScan(basePackages=\"org.rest\")\n@PropertySource(\"classpath:rest.properties\"\
    ,\"classpath:web.properties\")\npublic class AppConfig {\n  @Bean\n  public static\
    \ PropertySourcesPlaceholderConfigurer properties(Properties properties) {\n \
    \   return new PropertySourcesPlaceholderConfigurer();\n  }\n}\n```\n\nFirst,\
    \ the @Configuration annotation - this is the meta artifact used by the Java Spring\
    \ configuration; it is itself-annotated with @Component, which makes the annotated\
    \ classes standard beans and as such, also candidates for component scanning.\
    \ The main purpose of @Configuration classes is to sources of bean definitions\
    \ for the Spring IoC Container. For a more detailed description, see the official\
    \ docs."
  merge: -1
  pgno: 12
- img_proc: true
  md: '# Building a REST API with Spring4


    Then, @ImportResource is used to import the existing XML based Spring configuration.
    This configuration will still be migrated from XML to Java, or simply legacy configuration
    that you wish to keep. Either way, importing it into the Container is essential
    for a successful migration, allowing small steps without to much risk. The equivalent
    XML annotation that is replaced:


    ```

    <import resource="classpath:/rest_config.xml" />

    ```


    Moving on to @ComponentScan - this configures the component scanning directive,
    effectively replacing the XML:


    ```

    <context:component-scan base-package="org.rest" />

    ```


    As of Spring 3.1, the @Configuration are excluded from classpath scanning by default
    - see this JIRA issue. Before Spring 3.1 though, these classes should have been
    excluded explicitly:


    ```

    excludeFilters = { @ComponentScan.Filter(Configuration.class) }

    ```


    The @Configuration classes should not be autodiscovered because they are already
    specified and used by the Container - allowing them to be rediscovered and introduced
    into the Spring context will result in the following error:


    > Caused by: org.springframework.framework.context.annotation.ConflictingBeanDefinitionException:
    Annotation-specified bean name ''webConfig'' for bean class [org.rest.spring.AppConfig]
    conflicts with existing, non-compatible bean definition of same name and class
    [org.rest.spring.AppConfig]


    And finally, using the @Bean annotation to configure the properties support -
    PropertySourcesPlaceholderConfigurer is initialized in a @Bean annotated method,
    indicating it will a Spring bean managed by the Container. This new configuration
    has replaced the following XML:


    ```

    <context:property-placeholder location="classpath:persistence.properties, classpath:web.properties"
    ignore-unresolvable="true" />

    ```'
  merge: -1
