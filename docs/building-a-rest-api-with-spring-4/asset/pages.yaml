  md: "# Building a REST API with Spring4\n\nIn REST, Discoverability is a cross cutting\
    \ concern, applicable not only to specific operations but to types of operations.\
    \ For example, time a Resource is created, the URI of that Resource should be\
    \ discoverable by the client. This requirement is relevant for the creation of\
    \ ANY Resource, it should be dealt with separately and decoupled from the main\
    \ Controller flow.\n\nWith Spring, this decoupling is focused on Events, as was\
    \ thoroughly discussed in the previous section focused on Discoverability of the\
    \ REST Service. In the case of pagination, the event-PaginatedResultsRetrievedEvent\
    \ - fired in the controller layer, and discoverability is implemented with a custom\
    \ listener for this:\n\n```\nvoid addLinkHeaderOnPagedResourceRetrieval(\n   \
    \ UriComponentsBuilder builder, HttpServletResponse response,\n    Class clazz,\
    \ int totalPages, int size) {\n\n    String resourceName = clazz.getSimpleName().toString().toLowerCase();\n\
    \    builder.path(\"/admin/\" + resourceName);\n\n    StringBuilder linkHeader\
    \ = new StringBuilder();\n    if (hasNextPage(page, totalPages)) {\n        String\
    \ nextPage = constructNextPageUri(builder, page, size);\n        linkHeader.append(createLinkHeader(nextPage,\
    \ \"next\"));\n    }\n    if (hasPreviousPage(page)) {\n        String prevPage\
    \ = constructPrevPageUri(builder, page, size);\n        linkHeader.append(createLinkHeader(prevPage,\
    \ \"prev\"));\n    }\n    if (hasFirstPage(page)) {\n        String firstPage\
    \ = constructFirstPageUri(builder, size);\n        linkHeader.append(createLinkHeader(firstPage,\
    \ \"first\"));\n    }\n    if (hasLastPage(page, totalPages)) {\n        String\
    \ lastPage = constructLastPageUri(builder, totalPages, size);\n        linkHeader.append(createLinkHeader(lastPage,\
    \ \"last\"));\n    }\n    response.addHeader(\"Link\", linkHeader.toString());\n\
    }\n```\n\nIn short, - listeners check if the navigation allows for a next, previous,\
    \ first and last pages and if it adds the relevant URIs to the Link HTTP Header.\n\
