    \n# 2. The Security XML Configuration\n\nFirst thing to understand about the configuration\
    \ is that, while Spring Security does have full out of the box support for the\
    \ Digest authentication mechanism, this support is **not as well integrated into\
    \ the namespace** as Basic Authentication was.\n\nIn this case, we need to manually\
    \ define the raw beans that are going to make up the configuration - the *DigestAuthenticationFilter*\
    \ and the *DigestAuthenticationEntryPoint*.\n\n```\n<?xml version=\"1.0\" encoding=\"\
    UTF-8\"?>\n<beans xmlns=\"http://www.springframework.org/schema/security\"\n \
    \    xmlns:xsi=\"http://www.w3.org/2001/XMLSchema-instance\"\n     xmlns:beans=\"\
    http://www.springframework.org/schema/beans\"\n     xsi:location=\"http://www.springframework.org/schema/security\n\
    http://www.springframework.org/schema/security/spring-security-3.1.xsd\nhttp://www.springframework.org/schema/beans\n\
    http://www.springframework.org/schema/beans/spring-beans-3.2.xsd\">\n```"
