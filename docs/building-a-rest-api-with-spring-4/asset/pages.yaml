  md: '# 7. Conclusion


    This section showed how to properly test a REST API that works with multiple representations.
    Most APIs do publish their Resources under multiple Representations, so testing
    of these is vital; the fact that we can use the exact same tests across all of
    them is just cool.


    The full implementation of this mechanism – using actual integration tests and
    verifying both the XML and JSON representations - can be found in the github project.
    This is an Eclipse based project, so it should be easy to import and run as it
    is.'
