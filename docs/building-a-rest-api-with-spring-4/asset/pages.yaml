    \ this does represent an incompatible change for the Client - which will have\
    \ to respect the new Representation and understand the new semantics, but the\
    \ URI space will remain stable and will not be affected.\n\n# 5.3. Major Semantic\
    \ Changes\n\nThese changes are in the meaning of the Resources, the relations\
    \ between them or what the map to in the backend. This kinds of changes may require\
    \ a new media type, or they may require publishing a new, sibling Resource next\
    \ to the old one and making use of linking to point to it.\n\nWhile this sounds\
    \ like using version identifiers in the URI all again, the important distinction\
    \ is that the new Resource is published independently of any other Resources in\
    \ the API and will not affect the entire API at root.\n\nThe REST API should adhere\
    \ to the HATEOAS constraint - most of the URIs should be DISCOVERED by Client,\
    \ not hardcoded. Changing such an URI should not be considered an incompatible\
    \ change - the new URI can replace the old one and Clients will be able to discover\
    \ the URI and still function.\n\nIt is worth noting that, while using version\
    \ identifiers in the URI is problematic for these reasons, it is not un-RESTful\
    \ in any way."
