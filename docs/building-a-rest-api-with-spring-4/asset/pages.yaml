    @Test

    public void givenAuthenticatedByDigestAuth_whenARourcesCreated_then201IsReceived(){

    // Given

    // When

    Response response = given()

    .auth(digest).basic(ADMIN_USERNAME, ADMIN_PASSWORD))

    .contentType(HttpStatus.MIME_JSON).body(new Foo(randomAlphabetic( 6 ))

    .post(paths.getFooURL());


    // Then

    assertThat(response.getStatusCode(), is( 201 ));

    }

    ```


    Note that the test using basic authentication adds credentials to the request
    preemptively, regardless if the server has challenged for authentication or not.
    This is to ensure that the server doesn''t need to challenge the client for credentials,
    because if it did, the challenge would be for Digest credentials, since that is
    the default.


