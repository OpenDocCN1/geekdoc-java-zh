  md: "# 3.5. Failed Authentication should return 401 instead of 302\n\nSimilarly\
    \ – we configured the authentication failure handler – same way we did with the\
    \ success handler.\n\nLuckily – in this case, we don’t need to actually define\
    \ a new class for this handler – the standard implementation – SimpleUrlAuthenticationFailureHandler\
    \ – does just fine.\n\nThe only difference is that – now that we’re defining this\
    \ explicitly in our XML config – it’s not going to get a default defaultFailureUrl\
    \ from Spring – and so it won’t redirect.\n\n```\npublic class MySavedRequestAuthenticationSuccessHandler\n\
    extends SimpleUrlAuthenticationSuccessHandler\n\nprivate RequestCache requestCache\
    \ = new HttpSessionRequestCache();\n\n@Override\npublic void onAuthenticationSuccess(HttpServletRequest\
    \ request, HttpServletResponse response, Authentication authentication) throws\
    \ ServletException, IOException {\n    SavedRequest savedRequest = requestCache.getRequest(request);\n\
    \n    if (savedRequest == null) {\n        clearAuthenticationAttributes(request);\n\
    \        return;\n    }\n    String targetUri = getDefaultTargetUrl(request) ||\
    \ (targetUri == null && StringUtils.hasText(savedRequest.getRequest().getURI()))\
    \ ? savedRequest.getRequest().getURI() : null;\n    requestCache.removeRequest(request,\
    \ response);\n    clearAuthenticationAttributes(request);\n    return;\n}\n\n\
    clearAuthenticationAttributes(request);\n}\n\npublic void setRequestCache(RequestCache\
    \ requestCache) {\n    this.requestCache = requestCache;\n}\n```"
  merge: -1
