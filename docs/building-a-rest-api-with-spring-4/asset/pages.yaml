  md: '# 12: ERROR HANDLING FOR REST WITH SPRING


    # 1. Overview


    This section will focus on **how to implement Exception Handling with Spring for
    a REST API**. We''ll look at the recommended solution with Spring 3.2 and 4.x
    but also at at the older options as well.


    **Before Spring 3.2**, the two main approaches to handling exceptions in a Spring
    MVC application: `ExceptionHandlerResolver` or the `@ExceptionHandler` annotation.
    Both of these have some clear downsides.


    **After 3.2** we now have the new @ControllerAdvice annotation to address the
    limitations of the previous two solutions.


    All of these do have one in common - they deal with the **separation of concerns**
    well. The app can throw exception normally to indicate a failure of some kind
    - exceptions which will then be handled separately.


    # 2. Solution 1 – The Controller level @ExceptionHandlerHandler


    The first solution works at the @Controller level - we will define a method to
    handle exceptions, and annotate that with @ExceptionHandler.'
