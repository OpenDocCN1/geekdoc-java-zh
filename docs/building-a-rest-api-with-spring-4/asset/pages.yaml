  md: "Building a REST API with Spring4\n\n3. Discoverability Scenarios (Driven by\
    \ tests)\n\n# 3. Discoverability Scenarios (Driven by tests)\n\nSo does it mean\
    \ for a REST service to be discoverable? Throughout this section, we will test\
    \ individual traits of discoverability using Junit, rest-assured and Hamcrest.\
    \ Since the REST Service has been previously secured, each test first need to\
    \ authenticate before consuming the API.\n\n# 3.1. Discover the valid HTTP methods\n\
    \nWhen a REST Service is consumed with an invalid HTTP method, the response should\
    \ be 405 METHOD NOT ALLOWED; in addition, it should also help the client discover\
    \ the valid HTTP methods that are allowed for that particular Resource, using\
    \ the Allow HTTP Header in the:\n\n```\n@Test\npublic void\nwhenPOSTIsSentToValidResource_thenAllowHeaderListsTheAllowedActions()\
    \ {\n  // Given\nString uriOfExistingResource = restTemplate.createResource();\n\
    \n  // When\nResponse res = givenAuth().post(uriOfExistingResource);\n\n  // Then\n\
    String allowHeader = res.getHeader(HttpHeaders.ALLOW);\nasertThat(allowHeader,\
    \ AnyOf<String> anyOf(\ncontainsString(\"GET\"), containsString(\"PUT\"), containsString(\"\
    DELETE\"))));\n}\n```\n\n# 3.2. Discover the URI of the newly created Resource\n\
    \nThe operation of creating a new Resource should always include the URI of the\
    \ newly created resource in the response, using the Location HTTP Header. If the\
    \ client does a GET on that URI, the resource should be available:"
