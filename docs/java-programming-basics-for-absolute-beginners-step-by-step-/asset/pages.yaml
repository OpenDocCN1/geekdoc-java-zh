  md: '# Introduction


    Welcome to the wonderful world of programming, the chapters contained in this
    book will give you a basic understanding of programming in Java. By its final
    chapter you will be able to create a complete program on your own, using Java.


    An important aspect of this series, and your learning experience, is **learning
    by doing**. Practical examples are proven to be the best way to learn a programming
    language, which is why I have crammed as many examples into this guide as possible.
    I have tried to keep the core of the examples similar, so the only variable is
    the topic under discussion. This makes it easier to understand what we are implementing.
    As you progress through the chapters, remember to follow along with the examples
    and try them yourself.


    In order to use the information contained in this book, you must have a computer
    that runs Windows, Macintosh, Linux, or UNIX operating system. You must know how
    to run a program, copy a file, create a folder, and navigate through menus. These
    are the only requirements for being able to program using Java.


    Thank you for your interest in this versatile language and let''s have some fun!'
