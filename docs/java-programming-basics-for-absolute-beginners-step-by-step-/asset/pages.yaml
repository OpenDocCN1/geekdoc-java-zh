    \ to execute. Let’s look at an example of the ‘while’ statement.\n\n# Example\
    \ 48: The following program is used to showcase how to use the while loop.\n\n\
    ```\n// This is a Java class\npublic class Demo\n{\n  // This is the main entry\
    \ point of the Java program\n  public static void main(String args[])\n{\n   \
    \ int i=0;\n    while(i<4)\n    {\n      System.out.println(\"The value of i is\
    \ \" + i);\n      i++;\n    }\n  }\n}\n```\n\nThings to note about the above program:\n\
    \n+   - We are defining an integer ‘i’ which has an initial value of 1.\n- In\
    \ the while loop we state the condition that while the value of ‘i’ is less than\
