  md: '# 4.4 Different Java Editions


    Java has many editions. The different editions and what they stand for are briefly
    discussed below:


    +   - The Java Standard Platform Edition – This is the core Java platform. This
    is what provides the Java programming API, which are the different programs that
    compile and run Java programs. Here you get access to the core classes, such as
    the system classes, networking, security, database access and graphical user interfaces.

    - Java Enterprise Edition – This is mostly used for developing and supporting
    applications on a major scale. It''s primarily targeted at large organizations
    that need to develop application on multiple tiers and multiple platforms. Here
    you can build more scalable, reliable, and secure network applications.

    - Java Micro Edition – This is a smaller subset of the Java programming language
    and is used to develop application for smaller devices such as mobile phones and
    tablets.

    - Java FX - JavaFX is a platform for creating rich internet applications using
    a lightweight user interface API. This API can make use of high level graphic
    processors to create more appealing applications to the end users.'
