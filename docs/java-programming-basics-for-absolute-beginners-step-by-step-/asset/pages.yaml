  md: "# 1.2 Array Bounds Checking\n\nAt runtime, Java will check whether the array\
    \ has the required number of values defined. If one tries to access a value which\
    \ is outside the bounds of the array, an exception will be thrown. An example\
    \ is shown below.\n\nExample 3: The following program is used to showcase array\
    \ bounds checking.\n\n```\npublic class HelloWorld {\n    public static void main(String[]\
    \ args) {\n        int[] array1 = new int[2];\n        array1[0] = 1;\n      \
    \  array1[1] = 2;\n        array1[2] = 3;\n    }\n}\n```\n\nYou don't need to\
    \ understand the complete program for now, but let's just have a quick look at\
    \ the following lines of the code.\n\n1) int[] array1 = new int[2];\n\nHere are\
    \ the bounds of declaring an array, which is a set of integer values. The value\
    \ of '2' means that we can only store two values in the array.\n\n2) array1[0]\
    \ = 1;\n\narray1[1] = 2;\n\narray1[2] = 3;\n\nWith this code we can see that we\
    \ are assigning 3 values to the array. When you run this program, you will get\
    \ an error because the program will see that the array has gone out of its maximum\
    \ allowable bounds of two. You will get the below error at runtime.\n\nException\
    \ in thread \"main\"\n\njava.lang.ArrayIndexOutOfBoundsException: 2"
