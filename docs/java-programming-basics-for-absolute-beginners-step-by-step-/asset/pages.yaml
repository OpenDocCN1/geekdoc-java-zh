  md: '+   - Internet Protocol version 6 (IPv6) support.

    - Non-blocking IO.

    - Logging API.

    - Image I/O API for reading and writing images in formats like JPEG and PNG.

    - Integrated XML parser and XSLT processor (JAXP).

    - Integrated security and cryptography extensions (JCE, JSSE, JAAS).

    - Java Web Start included.

    - Preferences API (java.util.prefs).


    # ## J2SE 5.0 - Support for the following:


    +   - Generics, which provides compile-time (static) type safety for collections
    and eliminates the need for most typecasts.

    - Metadata, which is also called annotations. This allows language constructs
    such as classes and methods to be tagged with additional data, which can be processed
    by metadata-aware utilities.

    - Autoboxing/unboxing. This allows for automatic conversions between primitive
    types (such as int) and primitive wrapper classes (such as Integer).

    - Enumerations. Here the enum keyword creates a typesafe, ordered list of values.

    - Varags. This is the last parameter of a method, which can now be declared using
    a type name followed by three dots.

    - Enhanced ‘for each’ loop. The ‘for’ loop syntax is extended with a special syntax
    for iterating over each member of either an array or an Iterable, such as the
    standard Collection classes.

    - Improved of execution for multi-threaded Java programs. The new Java memory
    model addresses issues of complexity, effectiveness, and performance of previous
    specifications.

    - Static imports.'
