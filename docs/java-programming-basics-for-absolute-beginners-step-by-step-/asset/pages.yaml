  md: "# 1.1 Strong Type Checking\n\nJava is a strong type language. Every variable\
    \ that is defined needs to be attached to a data type. An example is shown below.\n\
    \nExample 2: The following program shows a strong typing for the Java programming\
    \ language.\n\n```\npublic class HelloWorld\n{\n    public static void main(String[]\
    \ args) {\n        int i=5;\n        System.out.println(\"The value of i is \"\
    +i);\n    }\n}\n```\n\nYou don't need to understand the complete program for now,\
    \ but let's have a quick look at 2 lines of the code.\n\n+   1) int i=5;\n\nHere\
    \ we are defining something known as a variable, which is used to hold a value.\
    \ The value that can be stored depends on the data type. In this example we are\
    \ saying that 'i' is of the type 'int' or Integer, which is a number data value.\n\
    \n+   2) System.out.println(\"The value of i is \"+i)\n\nHere we print the value\
    \ of 'i' by means of the System.out.println statement. If we did not declare 'i'\
    \ as an integer value, we would then get the below error if we had to compile\
    \ the program.\n\nHelloWorld.java:5: error: cannot find symbol\n\nSystem.out.println(\"\
    The value of i is \"+i)\n\n^\n\nsymbol: variable i\n\nlocation: class HelloWorld"
