  md: '# 4.1 The Java Software Development Kit


    The Java Software Development Kit is used to code your Java development language.
    This also contains a program known as javac, which is the Java compiler. The Java
    compiler is a separate program that is used to go through the Java code and break
    the code into smaller pieces known as symbols.


    In turn, once the Java compiler has done its part, it will then pass it on the
    the Java Interpreter. This will take the compiled code and make it into a file
    that can be understood by the underlying operating system. The Java Development
    Kit can be downloaded from the following site:


    http://www.oracle.com/technetwork/java/javase/downloads/jdk8-downloads-2133151.html'
