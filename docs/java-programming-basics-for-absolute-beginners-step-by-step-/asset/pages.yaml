    {\n    case constant-expression :\n        statement(s);\n        break;\n\n \
    \   case constant-expression :\n        statement(s);\n        break;\n\n    default\
    \ :\n        statement(s);\n}\n```\n\nIn the ‘switch’ statement, you can evaluate\
