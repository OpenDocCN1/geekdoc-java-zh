  md: '# 11. Type Conversion


    The Java programming language allows type conversion between primitive types.
    This allows the conversion from one data type to another. There are 2 types of
    conversions, one is called implicit and the other, explicit. We will discuss implicit
    conversion first. Here the java compiler performs the type conversion if it is
    not mentioned in the program.


    Below is an example of an implicit conversion.


    ```

    char valA=''a'';

    int valB=valA;

    ```


    In the first statement, we are assigning the character value of ''a'' to an identifier
    of valA. In the second statement, even though we declare a variable of the type
    integer, we are still able to assign the variable of the type character to this.
    This conversion is done directly by the compiler.


    Type conversions should always be done with caution as it can have unknown consequences
    in the output of the program. The following primitive types can undergo type conversion:


    +   - char

    - byte

    - short

    - int

    - long

    - float

    - double


    Now let''s look at an example on how we can work with implicit conversions.'
