  md: "# 1. What is Java?\n\nJava is a programming language that is built by Sun Microsystems,\
    \ which was later taken over by the Oracle Corporation. It is designed to run\
    \ on any operating system that supports Java. This is what made the language so\
    \ popular, because the developer just had to write the program once, and the program\
    \ could then run on any operating system without the need for the programmer to\
    \ change the code.\n\nMost of the modern applications built around the world are\
    \ made from the Java programming language. Most of the server side and business\
    \ logic components of major applications are built on the Java programming language.\n\
    \nA sample Java program is shown below.\n\n# Example 1: The following program\
    \ is used to showcase a simple Java program.\n\n```\npublic class HelloWorld {\n\
    \    public static void main(String[] args) {\n        System.out.println(\"Hello\
    \ World!\");\n    }\n}\n```\n\nDuring the entire course of this book you will\
    \ learn how to write programs such as the one above, and also learn advanced concepts\
    \ that will enable you to start writing complete application programs.\n\nSome\
    \ of the design goals for Java are mentioned below:\n\n+   - The language is intended\
    \ to be written once and have the ability to be run on any operating system."
  merge: -1
  pgno: 8
- img_proc: true
  md: '+   - The language should provide support for numerous software engineering
    principles.


    +   - The language is intended to be used in developing software components suitable
    for deployment in distributed environments.


    +   - Portability is an important factor. This is why Java has the ability to
    run on Windows, Linux and the MacOS operating system.


    +   - Support for internationalization is very important.


    +   - Java is intended to be suitable for writing applications for both hosted
    and embedded systems.


    Other design goals are discussed next.'
