- md: "\n## 7.8 Boolean Data Type\n\nThis data type is used to define a Boolean value,\
    \ which can either be true or false.\n\nExample 24: The following program is used\
    \ to showcase the Boolean data type.\n\n```java\n// This is a Java class\npublic\
    \ class Demo\n{\n    // This is the main entry point of the Java program\n   \
    \ public static void main(String args[])    {\n        // Initializing a variable\n\
    \        boolean i = true;\n        boolean j = false;\n\n        // Displaying\
    \ the variable\n        System.out.println(\"The value of i is \"+i);\n      \
    \  System.out.println(\"The value of j is \"+j);\n    }\n}\n```\n\nWith this program,\
    \ the output is as follows:\n\nThe value of i is True\n\nThe value of j is False\n\
    \n## 7.9 String Data Type\n\nThis data type is used to define a sequence of characters.\n\
    \n**Example 25: The following program is used to showcase the string data type.**\n\
    \n```java\n// This is a Java class\npublic class Demo\n{\n    // This is the main\
    \ entry point of the Java program\n    public static void main(String args[])\n\
    \    {\n        // Initializing a variable\n        String i = \"Hello\";\n  \
    \      String j = \"World\";\n\n        // Displaying the variable\n        System.out.println(\"\
    The value of i is \"+i);\n        System.out.println(\"The value of j is \"+j);\n\
    \    }\n}\n```\n\nWith this program, the output is as follows:\n\n**The value\
    \ of i is Hello**\n\n**The value of j is World**\n\n## 7.10 Default Values for\
    \ Fields\n\nIf no values are defined for fields in the various data types, they\
    \ are assigned their default values. We will discuss fields in detail when we\
    \ cover classes in book 2 of the series, but it’s good to have a basic understanding\
    \ of this point. The table below provides the default values for the various data\
    \ types.\n\nTable 2: Data Types Default Values\n\n| Data Type | Default Value\
    \ |\n|--- | --- |\n| byte | 0 |\n| short | 0 |\n| int | 0 |\n| long | 0L |\n|\
    \ float | 0.0f |\n| double | 0.0d |\n| char | '\\u0000' |\n| string | null |\n\
    | boolean | false |\n\n## 8. Variables\n\nVariables are used to define values\
    \ which can be changed during the course of the program. You can have different\
    \ types of variables based on the various data types. Let's look at the different\
    \ types of variables we can create based on their data type.\n\n## 8.1 Character\
    \ Variables\n\nThese are variables that are used to hold characters, which can\
    \ be changed at any point in time in the program. Let's look at an example of\
    \ a character variable.\n\nExample 26: The following program is used to showcase\
    \ character variables.\n\n```java\n// This is a Java class\npublic class Demo\n\
    {\n    // This is the main entry point of the Java program\n    public static\
    \ void main(String[] args)\n    {\n        // Initializing a variable\n      \
    \  char i='A';\n\n        // Displaying the variable\n        System.out.println(\"\
    The value of i is \"+i);\n        i='B';\n\n        System.out.println(\"The value\
    \ of i is \"+i);\n    }\n}\n```\n\nWith this program, the output is as follows:\n\
    \nThe value of i is A\n\nThe value of i is B\n\n## 8.2 Integer Variables\n\nThese\
    \ are variables that are used to hold integers, which can be changed at any point\
    \ in time in the program. Let's look at an example of an integer variable.\n\n\
    Example 27: The following program is used to showcase integer variables.\n\n```java\n\
    // This is a Java class\npublic class Demo\n{\n    // This is the main entry point\
    \ of the Java program\n    public static void main(String args[])\n    {\n   \
    \     // Initializing a variable\n        int i=5;\n\n        // Displaying the\
    \ variable\n        System.out.println(\"The value of i is \"+i);\n        i=6;\n\
    \n        System.out.println(\"The value of i is \"+i);\n    }\n}\n```\n\nWith\
    \ this program, the output is as follows:\n\nThe value of i is 5\n\nThe value\
    \ of i is 6\n\n## 8.3 Floating Point Variables\n\nThese variables are used to\
    \ hold floating point numbers, which can of course be changed at any point in\
    \ time within the program. Let's look at an example of a floating point variable.\n\
    \nExample 28: The following program is used to showcase floating point variables.\n\
    \n```java\n// This is a Java class\npublic class Demo\n{\n    // This is the main\
    \ entry point of the Java program\n    public static void main(String args[])\n\
    \    {\n        // Initializing a variable\n        float i=1.11F;\n\n       \
    \ // Displaying the variable\n        System.out.println(\"The value of i is \"\
    +i);\n        i=2.22F;\n        System.out.println(\"The value of i is \"+i);\n\
    \    }\n}\n```\n\nWith this program, the output is as follows:\n\nThe value of\
    \ i is 1.11\n\nThe value of i is 2.22\n\n## 8.4 Double Variables\n\nThese are\
    \ variables that are used to hold double point numbers, which can be changed at\
    \ any point in time within the program. Let's look at an example of a double point\
    \ variable.\n\nExample 29: The following program is used to showcase double point\
    \ variables.\n\n```java\n// This is a Java class\npublic class Demo\n{\n    //\
    \ This is the main entry point of the Java program\n    public static void main(String\
    \ args[])\n    {\n        // Initializing a variable\n        double i=1.111d;\n\
    \n        // Displaying the variable\n        System.out.println(\"The value of\
    \ i is \"+i);\n        i=2.222d;\n        System.out.println(\"The value of i\
    \ is \"+i);\n    }\n}\n```\n\nWith this program, the output is as follows:\n\n\
    The value of i is 1.111\n\nThe value of i is 2.222\n\n## 8.5 String Variables\n\
    \nThese are variables that are used to hold strings, which can be changed at any\
    \ point in time within the program. Let's look at an example of a string variable.\n\
    \nExample 30: The following program is used to showcase string variables.\n\n\
    ```java\n// This is a Java class\npublic class Demo\n{\n    // This is the main\
    \ entry point of the Java program\n    public static void main(String args[])\n\
    \    {\n        // Initializing a variable\n        String i = \"Hello\";\n\n\
    \        // Displaying the variable\n        System.out.println(\"The value of\
    \ i is \"+i);\n        i = \"World\";\n        System.out.println(\"The value\
    \ of i is \"+i);\n    }\n}\n```\n\nWith this program, the output is as follows:\n\
    \nThe value of i is Hello\n\nThe value of i is World\n\n## 8.6 Boolean Variables\n\
    \nThese are variables that are used to hold booleans, which can be changed at\
    \ any point in time within the program. Let's look at an example of a boolean\
    \ variable.\n\nExample 31: The following program is used to showcase boolean variables.\n\
    \n```java\n// This is a Java class\npublic class Demo\n{\n    // This is the main\
    \ entry point of the Java program\n    public static void main(String[] args)\n\
    \    {\n        // Initializing a variable\n        boolean i = true;\n\n    \
    \    // Displaying the variable\n        System.out.println(\"The value of i is\
    \ \"+i);\n        i = false;\n        System.out.println(\"The value of i is \"\
    +i);\n    }\n}\n```\n\nWith this program, the output is as follows:\n\nThe value\
    \ of i is true\n\nThe value of i is false\n\n## 8.7 Variables Scope\n\nVariables\
    \ also have a defined scope and this depends on where they are defined in a program.\
    \ Let's take the sample block of code below.\n\n```java\npublic static void main(String\
    \ args[])\n{\n    int a;\n}\n```\n\nHere ‘a’ is defined in the beginning of the\
    \ main function and hence has a global scope. This means it can be used anywhere\
    \ in the program. But now let’s look at another example of variable declaration.\n\
    \n```java\npublic static void main(String args[])\n{\n    // Inner Scope\n   \
