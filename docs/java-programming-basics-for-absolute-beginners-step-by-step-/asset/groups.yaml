    \n## 4.3 理解 JRE\n\n正如我们在前面的节中所看到的，Java 运行环境（JRE）用于运行 Java 应用程序。这是 Java 编程语言的一个重要方面。下面的图表从更好的视角展示了\
    \ Java 运行环境的工作原理。\n\n![](img/686a81b12470303bcb9a73c9bf6bac1c_42_0.png)\n\n编译器首先将\
    \ Java 程序编译为具有 .class 扩展名的文件。如果你想在 Windows 机器上执行 Java 程序，你需要在 Windows 机器上安装兼容的\
    \ Java 运行环境，然后运行 Java 程序。如果你想在 Linux 机器上执行 Java 程序，你需要为 Linux 安装特定的 Java 运行环境。\n\
    \n以下是各种操作系统的 Java 运行环境下载链接。\n\nhttp://www.oracle.com/technetwork/java/javase/downloads/jre8-downloads-2133155.html\n\
    \n## 4.4不同的 Java 版本\n\nJava 有许多版本。下面简要讨论了不同版本及其含义：\n\n- Java 标准平台版（Java Standard\
    \ Platform Edition – SE）——这是 Java 核心平台。它提供了 Java 编程 API，即用于编译和运行 Java 程序的各种程序。在这里，你可以访问核心类，例如系统类、网络、安全、数据库访问和图形化用户界面。\n\
    - Java 企业版（Java Enterprise Edition – EE）——这主要用于开发和支持大规模应用程序。它主要针对需要在多层和多平台上开发应用程序的大型组织。在这里，你可以构建更具扩展性、可靠且安全的网络应用程序。\n\
    - Java 微型版（Java Micro Edition – ME）——这是 Java 编程语言的一个较小子集，用于为手机和平电脑等较小设备开发应用程序。\n\
