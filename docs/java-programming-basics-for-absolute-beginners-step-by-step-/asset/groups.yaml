    \ is as follows:\n\nThe value of i+j is 15\n\nThe value of i+=j is 15\n\nThe value\
    \ of i-=j is 5\n\nThe value of i*=j is 5\n\nThe value of i /=j is 5\n\nThe value\
    \ of i%=j is 5\n\n## 10.5 Bitwise Operators\n\nThese are operators that are used\
