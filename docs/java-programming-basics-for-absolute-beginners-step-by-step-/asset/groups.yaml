- md: "\n## 13.2 If-Else Statement\n\nIn the ‘if-else’ statement we have the option\
    \ of executing an optional statement when the ‘if’ condition does not evaluate\
    \ to true.\n\nThe general syntax of the ‘if-else’ statement is given below.\n\n\
    ```java\nif(condition)\n{\n    //Execute code\n}\nelse\n{\n    //Execute code\n\
    }\n```\n\nExample 54: The following program is used to showcase how to use the\
    \ if-else statement.\n\n```java\n// This is a Java class\npublic class Demo\n\
    {\n    // This is the main entry point of the Java program\n    public static\
    \ void main(String args[])\n    {\n        int i = 7;\n        if (i < 5)\n  \
    \      {\n            System.out.println(\"The value of i is less than 5\");\n\
    \        }\n        else\n        {\n            System.out.println(\"The value\
    \ of i is more than 5\");\n        }\n    }\n}\n```\n\nWith this program, the\
    \ output is as follows:\n\n# **The value of i is more than 5**\n\n## 13.3 Switch\
    \ Statement\n\nThe ‘switch’ statement helps us to evaluate multiple options at\
    \ one time and then execute code based on those various options.\n\nThe general\
    \ syntax of the ‘switch’ statement is given below.\n\n```java\nswitch(expression)\n\
    {\n    case constant-expression :\n        statement(s);\n        break;\n\n \
    \   case constant-expression :\n        statement(s);\n        break;\n\n    default\
    \ :\n        statement(s);\n}\n```\n\nIn the ‘switch’ statement, you can evaluate\
    \ the condition against multiple expressions. For each matching expression you\
    \ can have a corresponding statement to execute. Once the statement is found,\
    \ the break statement can help to exit from the switch statement. You can also\
    \ have a default statement which gets executed if neither of the expressions matches\
    \ the condition in the switch statement.\n\n## Example 55: The following program\
    \ is used to showcase how to use the switch statement.\n\n```java\n// This is\
    \ a Java class\npublic class Demo\n{\n    // This is the main entry point of the\
    \ Java program\n    public static void main(String args[])\n{\n  int i=4;\nswitch\
    \ (i)\n{\n    case 1: System.out.println(\"The value of i is 1\");\n    break;\n\
    \    case 2: System.out.println(\"The value of i is 2\");\n    break;\n    case\
    \ 3: System.out.println(\"The value of i is 3\");\n    break;\n    case 4: System.out.println(\"\
    The value of i is 4\");\n    break;\n    default: System.out.println(\"The value\
    \ of i is unknown\");\n    break;\n  }\n}\n}\n```\n\nThings to note about the\
    \ above program:\n\n- We are defining the switch statement to evaluate the value\
    \ of ‘i’.\n- We are defining the different possible values of ‘i’ using the case\
    \ statements.\n- We finally define the default statement, which gets executed\
    \ if none of the case statements match the desired expression.\n\nWith this program,\
    \ the output is as follows:\n\n# The value of i is 4\n\n## 13.4 Nested Statements\n\
    \nWe can also make use of nested statements in decision making. Let’s look at\
    \ some examples of nested statements.\n\nExample 56: The following program shows\
    \ how to use the nested decision making statements.\n\n```java\n// This is a Java\
    \ class\npublic class Demo\n{\n    // This is the main entry point of the Java\
    \ program\n    public static void main(String args[])\n    {\n        int i=4;\n\
    \        if (i > 0)\n        {\n            if (i == 4)\n            {\n     \
    \           System.out.println(\"The value is 4\");\n            }\n        }\n\
    \    }\n}\n```\n\nIn the above program we are making use of multiple if statements\
    \ in the program.\n\nWith this program, the output is as follows:\n\nThe value\
    \ of i is 4\n\nLet’s look at another example of using nested decision making statements.\n\
    \n## Example 57: The following program shows how to use the nested decision making\
    \ statements.\n\n```java\n// This is a Java class\npublic class Demo\n{\n    //\
    \ This is the main entry point of the Java program\n    public static void main(String[]\
    \ args)\n    {\n        int i = 4;\n        if (i > 0) \n        {\n         \
    \   switch (i) \n            {\n                case 1:\n                    System.out.println(\"\
    The value of i is 1\");\n                    break;\n                case 2:\n\
    \                    System.out.println(\"The value of i is 2\");\n          \
    \          break;\n                case 3:\n                    System.out.println(\"\
    The value of i is 3\");\n                    break;\n                case 4:\n\
    \                    System.out.println(\"The value of i is 4\");\n          \
    \          break;\n                default:\n                    System.out.println(\"\
    The value of i is unknown\");\n                    break;\n            }\n   \
    \     }\n    }\n}\n```\n\nWith this program, the output is as follows:\n\n# **The\
