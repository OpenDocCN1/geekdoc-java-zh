- md: "\n```java\nint j=6; // Inner Scope\nSystem.out.println(\"The value of j is\
    \ \"+j);\n}\nSystem.out.println(\"The value of j is \"+j);\n}\n}\n```\n\nWith\
    \ this program, you will actually get a compile time error.\n\n**Error:(15, 49)\
    \ java: cannot find symbol**\n\n**symbol: variable j**\n\n**location: class Demo**\n\
    \nAs right so there is an error in the program because we are trying to use the\
    \ value of ‘j’ outside the scope in which it is defined.\n\n## 9. Constants\n\n\
    A constant is an identifier whose value does not change during the course of the\
    \ program. For example, if you were to define an identifier with a name of ‘val’,\
    \ assign a value of 5 to it, and also define it as a constant value, then you\
    \ would not be able to change the value of that identifier.\n\nIn Java, the syntax\
    \ for defining a constant is shown below.\n\n```java\nstatic final datatype identifier\
    \ = value\n```\n\nWhere:\n\n- Static is a keyword which means that the variable\
    \ is available without the need of having to define an instance of the class.\n\
    - The final keyword is used to denote that the value assigned to the identifier\
    \ cannot be changed during the course of the program.\n\nLet’s now at an example\
    \ of how we can define constants in a program.\n\n### Example 34: The following\
    \ program is used to show how to define constants.\n\n```java\n// This is a Java\
    \ class\npublic class Demo\n{\n    static final int i=5;\n\n    // This is the\
    \ main entry point of the Java program\n    public static void main(String args[])\n\
    \    {\n        System.out.println(\"The value of i is \"+i);\n    }\n}\n```\n\
    \nWith this program, the output is as follows:\n\n# The value of i is 5\n\nNow\
    \ let’s write the same program, but this time try to change the value of ‘i’ during\
    \ the course of the program.\n\n### Example 35: The following program is used\
    \ to show the wrong way to work with constants.\n\n```java\n// This is a Java\
    \ class\npublic class Demo\n{\n    static final int i=5;\n    // This is the main\
    \ entry point of the Java program\n    public static void main(String args[])\n\
    \    {\n        System.out.println(\"The value of i is \"+i);\n        i++;\n\
    \    }\n}\n```\n\nWith this program, you will get a compile time error as shown\
    \ below.\n\nError:(10, 9) java: cannot assign a value to final variable\n\nWe\
    \ can define multiple constants in a program and we can also use them alongside\
    \ normal variables. Let’s look at another example of how we can use constants.\n\
    \n### Example 36: The following program is used to show another example of constants.\n\
    \n```java\n// This is a Java class\npublic class Demo\n{\n  static final int ValA=5;\n\
    \  static final int ValB=5;\n  // This is the main entry point of the Java program\n\
    \  public static void main(String args[])\n  {\n    int ValC=ValA+ValB;\n    System.out.println(\"\
    The value of ValC is \"+ValC);\n  }\n}\n```\n\nIn the above program we are carrying\
