    \ This makes it easier to understand what we are implementing. As you progress\
    \ through the chapters, remember to follow along with the examples and try them\
    \ yourself.\n\nIn order to use the information contained in this book, you must\
    \ have a computer that runs Windows, Macintosh, Linux, or UNIX operating system.\
    \ You must know how to run a program, copy a file, create a folder, and navigate\
    \ through menus. These are the only requirements for being able to program using\
    \ Java.\n\nThank you for your interest in this versatile language and let's have\
    \ some fun!\n\n# 1. What is Java?\n\nJava is a programming language that is built\
    \ by Sun Microsystems, which was later taken over by the Oracle Corporation. It\
    \ is designed to run on any operating system that supports Java. This is what\
    \ made the language so popular, because the developer just had to write the program\
    \ once, and the program could then run on any operating system without the need\
    \ for the programmer to change the code.\n\nMost of the modern applications built\
    \ around the world are made from the Java programming language. Most of the server\
    \ side and business logic components of major applications are built on the Java\
    \ programming language.\n\nA sample Java program is shown below.\n\n# Example\
    \ 1: The following program is used to showcase a simple Java program.\n\n```\n\
    public class HelloWorld {\n    public static void main(String[] args) {\n    \
    \    System.out.println(\"Hello World!\");\n    }\n}\n```\n\nDuring the entire\
    \ course of this book you will learn how to write programs such as the one above,\
    \ and also learn advanced concepts that will enable you to start writing complete\
    \ application programs.\n\nSome of the design goals for Java are mentioned below:\n\
    \n- The language is intended to be written once and have the ability to be run\
    \ on any operating system.\n- The language should provide support for numerous\
    \ software engineering principles.\n- The language is intended to be used in developing\
    \ software components suitable for deployment in distributed environments.\n-\
    \ Portability is an important factor. This is why Java has the ability to run\
    \ on Windows, Linux and the MacOS operating system.\n- Support for internationalization\
    \ is very important.\n- Java is intended to be suitable for writing applications\
    \ for both hosted and embedded systems.\n\nOther design goals are discussed next.\n\
    \n# 1.1 Type Checking\n\nJava is a strong type. Every variable needs to be attached\
    \ to a data type. An example is shown below.\n\nExample 2: The following program\
    \ shows strong typing for the Java language.\n\n```\npublic class HelloWorld {\n\
    \    public static void main(String[] args) {\n        int i=5;\n        System.out.println(\"\
    The value of i is \"+i);\n    }\n}\n```\n\nYou don't need to understand the complete\
    \ program for now, but let's just have a quick look at the following lines of\
    \ the code.\n\n- int i=5;\n\nHere we are defining something known as a variable,\
    \ which is used to hold a value. The value of 'i' is of Integer, which is a number.\n\
    \n- System.out.println(\"The value of i is \"+i);\n\nHere we print the value of\
    \ 'i' by means of the System.println statement. If we did not declare 'i' as an\
    \ integer value, we would then get the below error if we had to compile the program.\n\
    \nHelloWorld.java:5: error: cannot find symbol\nSystem.out.println(\"The value\
    \ of i is \"+i)\n^\nsymbol: i\nlocation: HelloWorld\n\n# 1.2 Array Bounds Checking\n\
    \nAt runtime, Java will check whether the array has the required number of values.\
    \ If one tries to access a value which is outside the bounds of the array, an\
    \ exception will be thrown. An example is shown below.\n\nExample 3: The following\
    \ program is used to showcase array bounds checking.\n\n```\npublic class HelloWorld\
    \ {\n    public static void main(String[] args) {\n        int[] array1 = new\
    \ int[2];\n        array1[0] = 1;\n        array1[1] = 2;\n        array1[2] =\
    \ 3;\n    }\n}\n```\n\nYou don't need to understand the complete program for now,\
    \ but let's just have a quick look at the following lines of the code.\n\n- int[]\
    \ array1 = new int[2];\n\nHere are the bounds of declaring an array, which is\
    \ a set of integer values. The value of '2' means that we can only store two values\
    \ in the array.\n\n- array1[0] = 1;\n- array1[1] = 2;\n- array1[2] = 3;\n\nWith\
    \ this code we can see that we are assigning 3 values to the array. When you run\
    \ this program, you will get an error because the program will see that the array\
    \ has gone out of its maximum allowable bounds of two. You will get the below\
    \ error at runtime.\n\nException in thread \"main\"\n\njava.lang.ArrayIndexOutOfBoundsException:\
    \ 2\n"
