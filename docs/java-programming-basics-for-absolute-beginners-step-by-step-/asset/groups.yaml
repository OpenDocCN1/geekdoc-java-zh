    The value of valA is \" + valA);\n        System.out.println(\"The value of valB\
    \ is \" + valB);\n    }\n}\n```\n\nWith this program, the output is as follows:\n\
    \nThe value of valA is a\n\nThe value of valB is 97\n\nIn the output you can see\
    \ that the character value is converted to its equivalent ASCII value when being\
    \ taken as an integer. Let’s see another example with floating and double precision\
