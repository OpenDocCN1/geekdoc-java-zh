    UserA\");\n        stud.Display();\n    }\n}\n}\n```\n\n## 3.8 多态\n\n这是编译器在运行时确定需要调用的类的能力。例如，你可以让基类变量指向派生类的对象。下面是一个多态的示例。我们将在该系列的第二本书中详细介绍。\n\
