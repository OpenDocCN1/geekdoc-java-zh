    ## 2. History of Java


    The Java language was designed by James Gosling and first appeared on the scene
    in May of 1995. The programming language has gone through various releases, with
    the current version being version 8.


    In the year 2006, Java had released the Java Virtual Machine. The Java Virtual
    Machine is used to run Java programs on the relevant operating systems, and was
    made available under free software/open-source distribution terms.


    Below are the release date and the .net framework version for each Java version
    release.


    | Version | Release Date |

    |--- |--- |

    | JDK 1.0 | January 23, 1996 |

    | JDK 1.1 | February 19, 1997 |

    | J2SE 1.2 | December 8, 1998 |

    | J2SE 1.3 | May 8, 2000 |

    | J2SE 1.4 | February 6, 2002 |

    | J2SE 5.0 | September 30, 2004 |

    | Java SE 6 | December 11, 2006 |

    | Java SE 7 | July 28, 2011 |


    Below we go into detail on the various versions of Java and the features which
    were introduced with each version.


    ## JDK 1.1 - Support for the following:


    - An extensive retooling of the AWT event model.

    - Inner classes added to the language.

    - JavaBeans.

    - JDBC.

    - RMI.

    - Reflection, which supports Introspection only. No modification at runtime is
    possible.

    - JIT (Just In Time) compiler on Microsoft Windows platforms, produced for JavaSoft
    by Symantec.

    - Internationalization and Unicode support originating from Taligent.


    ## J2SE 1.2 - Support for the following:


    - Strictfp keyword.

    - The Swing graphical API was integrated into the core classes.

    - Sun''s JVM was equipped with a JIT compiler.

    - Java plug-in.

    - Java IDL, an IDL implementation for CORBA interoperability.

    - Collections framework.


    ## J2SE 1.3 - Support for the following:


    - HotSpot JVM included.

    - RMI was modified to support optional compatibility with CORBA.

    - Java Naming and Directory Interface (JNDI) included in core libraries.

    - Java Platform Debugger Architecture (JPDA).

    - JavaScript.

    - Synthetic proxy classes.


    ## J2SE 1.4 - Support for the following:


    - Regular expressions modeled after Perl regular expressions.

    - Exception chaining, which allows for an exception to encapsulate original lower-level
    exceptions.

    - Internet Protocol version 6 (IPv6) support.

    - Non-blocking IO.

    - Logging API.

    - Image I/O API for reading and writing images in formats like JPEG and PNG.

    - Integrated XML parser and XSLT processor (JAXP).

    - Integrated security and cryptography extensions (JCE, JSSE, JAAS).

    - Java Web Start included.

    - Preferences API (java.util.prefs).


    ## J2SE 5.0 - Support for the following:


    - Generics, which provides compile-time (static) type safety for collections and
    eliminates the need for most typecasts.

    - Metadata, which is also called annotations. This allows language constructs
    such as classes and methods to be tagged with additional data, which can be processed
    by metadata-aware utilities.

    - Autoboxing/unboxing. This allows for automatic conversions between primitive
    types (such as int) and primitive wrapper classes (such as Integer).

    - Enumerations. Here the enum keyword creates a typesafe, ordered list of values.

    - Varags. This is the last parameter of a method, which can now be declared using
    a type name followed by three dots.

    - Enhanced ‘for each’ loop. The ‘for’ loop syntax is extended with a special syntax
    for iterating over each member of either an array or an Iterable, such as the
    standard Collection classes.

    - Improved of execution for multi-threaded Java programs. The Improved of execution
    for multi-threaded Java programs. The new Java memory model addresses issues of
    complexity, effectiveness, and performance of previous specifications.

    - Static imports.


    ## Java SE 6 - Support for the following:


    - Scripting Language Support. A generic API is introduced for tight integration
    with scripting languages, and built-in Mozilla JavaScript Rhino integration.

    - Dramatic performance improvements for the core platform and Swing.

    - Improved Web Service support through JAX-WS.

    - JDBC 4.0 support.

    - Java Compiler API. This is an API allowing a Java program to select and invoke
    a Java Compiler programmatically.

    - Upgrade of JAXB to version 2.0.

    - Support for pluggable annotations.

    - Many GUI improvements, which included integration of SwingWorker in the API,
    table sorting and filtering, and true Swing double-buffering.

    - JVM improvements, which included synchronization and compiler performance optimizations,
    new algorithms and upgrades to existing garbage collection algorithms, and application
    start-up performance.


    ## Java SE 7 - Support for the following:


    - JVM support for dynamic languages, with the new invokedynamic bytecode.

    - Compressed 64-bit pointers.

    - Strings in the switch statement.

    - Automatic resource management in the try-statement.

    - Improved type inference for generic instance creation.

    - Simplified varargs method declaration.

    - Binary integer.

    - Automatic resource management in the try-statement.

    - Improved type inference for generic instance creation.

    - Simplified varargs method declaration.

    - Binary integer.

