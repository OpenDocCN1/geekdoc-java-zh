    \ match the main Java class in the program.\n\n# ### Step 2\n\nNext to compile\
    \ the program, we will use the javac command from the java development kit. The\
    \ command used to compile the program is shown below.\n\n```\njavac HelloWorld.java\n\
    ```\n\nThis will compile the program and create a new class file called HelloWorld.class\n\
    \n# ### Step 3\n\nThe next step is to run the program. This can be done via the\
    \ java program. So we just run the following command."
