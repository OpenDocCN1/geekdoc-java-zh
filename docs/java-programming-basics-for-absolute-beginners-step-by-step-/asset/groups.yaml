    {\n    // This is the main entry point of the Java program\n    public static\
    \ void main(String args[])\n    {\n        // Here we are printing Hello World\
    \ to the console\n        System.out.println(\"Hello World\");\n    }\n}\n```\n\
    \nWith this program, the output is follows:\nHello World\n\nNow let’s break the\
    \ program down into multiple steps to understand each statement.\n\n- public class\
    \ Demo: This statement is used to define the class. All Java code must reside\
    \ in a class. The name of the main class should also be the same as the file which\
    \ holds the class.\n- public static void main(String args[]): This is the main\
