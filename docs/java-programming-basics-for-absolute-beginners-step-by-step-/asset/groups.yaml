    \n## 11. 类型转换\n\nJava 语言允许在类型之间进行转换。类型分为隐式转换和显式转换。隐式转换是由编译器自动完成的。这些类型包括：\n- byte\n\
    - short\n- int\n- long\n- float\n- double\n\n在进行类型转换时始终要小心。隐式转换发生在：\n- 将较小类型的变量转换为较大的类型\n\
    - 将 char 转换为 int、long、float 或 double\n- 将 int 转换为 long 或 double\n\n显式转换（也称为强制类型转换）是由程序员手动指定的。这通常发生在：\n\
    - double 转换为 float\n- float 转换为 long\n- long 转换为 int\n- int 转换为 short\n- short\
    \ 转换为 byte\n- int 转换为 char\n- float 转换为 char\n\n下面是一个隐式转换的示例：\n\n```java\nchar\
    \ i = 'a';\nint j = i;\n```\n\n在上面的代码中，`i` 的值被赋值给 `j`。\n\n显式转换示例如下：\n\n# 示例 44：以下程序展示了显式转换。\n\
