    \ highly fragmented/interleaved in the source text; I have reconstructed the logic\
    \ based on standard Java patterns and the provided snippets to ensure a coherent\
    \ code structure.)*\n\n## 4. The Java Compiler\n\nThe Java programming language\
    \ consists of the following main components:\n\n## 4.1 The Software Development\
    \ Kit\n\nThe Java Development Kit is used to code your development language. This\
    \ also contains a program known as javac, which is the Java compiler. The Java\
    \ compiler is a separate program that is used to go through the Java code and\
    \ break it into smaller pieces known as symbols.\n\nIn turn, once the Java compiler\
    \ has done its part, it will then pass it on the Java Interpreter. This will take\
    \ the compiled code and make it into a file that can be understood by the underlying\
    \ operating system. The Java Development Kit can be downloaded from the following\
    \ site:\n\nhttp://www.oracle.com/technetwork/java/javase/downloads/jdk8-downloads-2133151.html\n\
    \n## 4.2 The Runtime Environment\n\nThe Java Runtime Environment is specific to\
    \ each operating system, and it is used to run the java program. Next, let’s understand\
    \ how the compilation process works.\n\n### Step 1\n\nFirst you will write a java\
    \ program and store it in a file with the .java extension. Let’s take an example\
    \ of the below code.\n\n```java\npublic class HelloWorld {\n    public static\
    \ void main(String[] args) {\n        System.out.println(\"Hello World!\");\n\
    \    }\n}\n```\n\nWe will store this in a file called HelloWorld.java. Note that\
    \ the name of the file has to match the main Java class in the program.\n\n###\
    \ Step 2\n\nNext to compile the program, we will use the javac command from the\
    \ java development kit. The command used to compile the program is shown below.\n\
    \n```\njavac HelloWorld.java\n```\n\nThis will compile the program and create\
    \ a new class file called HelloWorld.class.\n\n### Step 3\n\nThe next step is\
    \ to run the program. This can be done via the java program. So we just run the\
    \ following command.\n\n```bash\njava HelloWorld\n```\n"
