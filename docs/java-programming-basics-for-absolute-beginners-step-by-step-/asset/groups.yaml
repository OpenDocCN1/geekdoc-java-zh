    \ Note that we have not mentioned any extension when running the java program.\n\
    \n## 4.3 Understanding the JRE\n\nThe Java Runtime Environment, as we have seen\
    \ in the earlier section, is used to run Java applications. This is an important\
    \ aspect of the Java programming language. The diagram below gives a better perspective\
    \ of how the Java Runtime Environment works.\n\n![](img/686a81b12470303bcb9a73c9bf6bac1c_42_0.png)\n\
    \nThe compiler first compiles the Java program into a file with the .class extension.\
    \ If you wanted to execute the java program onto a Windows machine, you would\
    \ need to install the compatible Java Runtime Environment onto the Windows machine\
    \ and then run the Java program. If you wanted to execute the Java program onto\
    \ a Linux machine, you would need to install the specific Java Runtime Environment\
    \ for Linux.\n\nBelow is the link for the Java Runtime Environment downloads for\
    \ the various operating systems.\n\nhttp://www.oracle.com/technetwork/java/javase/downloads/jre8-downloads-2133155.html\n\
    \n## 4.4 Different Java Editions\n\nJava has many editions. The different editions\
    \ and what they stand for are briefly discussed below:\n\n- The Java Standard\
    \ Platform Edition – This is the core Java platform. This is what provides the\
    \ Java programming API, which are the different programs that compile and run\
    \ Java programs. Here you get access to the core classes, such as the system classes,\
    \ networking, security, database access and graphical user interfaces.\n- Java\
    \ Enterprise Edition – This is mostly used for developing and supporting applications\
    \ on a major scale. It's primarily targeted at large organizations that need to\
    \ develop application on multiple tiers and multiple platforms. Here you can build\
    \ more scalable, reliable, and secure network applications.\n- Java Micro Edition\
    \ – This is a smaller subset of the Java programming language and is used to develop\
    \ application for smaller devices such as mobile phones and tablets.\n- Java FX\
    \ - JavaFX is a platform for creating rich internet applications using a lightweight\
    \ user interface API. This API can make use of high level graphic processors to\
    \ create more appealing applications to the end users.\n\n## 5. Building Your\
    \ Environment\n\nIn order to start working with creating Java programs, you need\
    \ to get the following in place.\n\n### 5.1 Installing the Java Development Kit\n\
    \nThe Java Development Kit, or JDK, is used to develop Java based programs. The\
    \ JDK has all the necessary supporting code to help in developing Java based applications.\
    \ It is released by Oracle, who continues to make improvements and revisions on\
    \ fixes reported by developers or end users. The link for the Java Development\
    \ Kit can be found below.\n\nhttp://www.oracle.com/technetwork/java/javase/downloads/jdk8-downloads-2133151.html\n\
    \nOnce the Java Development Kit is installed, the next step is to ensure that\
    \ it is installed properly. The easiest way to do this, is to issue the following\
    \ command.\n\n```\njava -version\n```\n\nA sample output is given below. It will\
    \ show the Java version that is installed on the system.\n\njava version \"1.8.0_101\"\
    \n\nJava(TM) SE Runtime Environment (build 1.8.0_101-b13)\n\nJava HotSpot(TM)\
    \ 64-Bit Server VM (build 25.101-b13, mixed mode)\n\n## 5.2 Writing Programs in\
    \ Editors\n\nTo write programs, you use a simple editor such as Notepad or you\
    \ can use a full-fledged Integrated Development Environment (IDE). Below is a\
    \ list of some of the most popular IDEs that are available for Java and some of\
    \ their relevant features.\n\n### 5.2.1 Eclipse\n\nThis IDE has been around for\
    \ quite a long time and is very popular and widely used amongst the Java development\
    \ community. Some of the core features of the IDE are:\n\n- It's free and open\
    \ source. Hence there are many developers who keep contributing to the IDE.\n\
    - It can be used to develop applications in other languages such as C++, Ruby,\
    \ HTML5 and PHP.\n- It has a rich client platform.\n- It provides the ability\
    \ of refactoring code.\n- It helps in code completion.\n- It has a wide variety\
    \ of extensions and plugins.\n- It also has support for most source code version\
    \ control systems.\n\nThe official link for Eclipse is www.eclipse.org\n\n###\
    \ 5.2.2 IntelliJ IDEA\n\nThis is another popular IDE used by the Java development\
    \ community. Some of the core features of this IDE are:\n\n- The community edition\
    \ is free and open source.\n- The paid edition provides much more features and\
    \ allows developers to build enterprise applications with the Java Enterprise\
    \ Edition.\n- It provides the ability of refactoring code.\n- It helps in code\
    \ completion.\n- It has a wide variety of extensions and plugins.\n- It also has\
    \ support for most source code version control systems.\n\nThe official link for\
    \ IntelliJ IDEA is https://www.jetbrains.com/idea\n\n### 5.2.3 NetBeans\n\nThis\
    \ IDE can also be used to develop all sorts of Java based applications, right\
    \ from Java standard programs to enterprise and mobile based applications. Some\
    \ of the core features of the IDE:\n\n- With its editors, code analyzers, and\
    \ converters you can quickly and smoothly upgrade your applications to use new\
    \ Java language constructs, such as lambdas.\n- It provides support for most source\
    \ code version control systems.\n- It has a rich client platform.\n- It provides\
    \ the ability of code completion.\n\nThe official link for NetBeans is https://netbeans.org\n\
    \n![](img/686a81b12470303bcb9a73c9bf6bac1c_42_0.png)\n\n![](img/686a81b12470303bcb9a73c9bf6bac1c_52_0.png)\n\
    \n![](img/686a81b12470303bcb9a73c9bf6bac1c_53_0.png)\n\n## 6. Your First Program\n\
    \nLet’s dive into your program. We have already seen in the previous chapter how\
    \ to get the entire setup. It’s now time to develop your first program. Below\
    \ is the code.\n\nExample 14: The following program is used to showcase a simple\
