    # 7. Data Types


    Data types are used in programming languages to store different types of data.
    For example if you wanted to store text data, you would probably have a data type
    of ''string''. If you wanted to store a number you can have a data type of ''number''
    or ''integer''. This depends on the programming language and what data types are
    defined. Data types help to make the program type safe and free from errors.


    Now let''s look at the different data types available in Java.


    # Table 1: Data Types


    | Data Type | Description | Range (bits) |

    | byte | This is an 8-bit signed two complement integer | -128 to 127 |

    | short | This is a 16-bit signed two complement integer | -32,768 to 32,767 |

    | int | This is a 32-bit signed two complement integer | -2,147,483,648 to 2,147,483,647
    |

    | long | This is a 64-bit signed two complement integer | -9223372036854775808
    to 9223372036854775808 |

    | float | This is a single-precision 32-bit IEEE 754 floating point | -3.40282338
    to 3.40282338 |

    | double | This is a double-precision 64-bit IEEE 754 floating point | -1.7976931486232e308
    to 1.7976931486232e308 |

    | char | This is a single 16-bit Unicode character | 0 to 65,535 |'
