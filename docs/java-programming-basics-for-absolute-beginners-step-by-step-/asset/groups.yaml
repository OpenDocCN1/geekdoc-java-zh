- md: "\n## 3.4 Object Oriented\n\nThis is one of the basic principles of any programming\
    \ language wherein one can define classes and objects. Classes are an encapsulation\
    \ of properties and methods. Classes are relevant to real time entities. Below\
    \ is a simple example of a Java program which works with classes. We will see\
