    Showcasing the >> operator \" + (i>>j));\n    }\n}\n```\n\nWith this program,\
    \ the output is as follows:\n\nShowcasing the & operator 0\n\nShowcasing the |\
    \ operator 15\n\nShowcasing the ^ operator 15\n\nShowcasing the << operator 20\n\
    \nShowcasing the >> operator 0\n\n## 11. Type Conversion\n\nThe Java programming\
    \ language allows type conversion between primitive types. This allows the conversion\
    \ from one data type to another. There are 2 types of conversions, one is called\
    \ implicit and the other explicit. We will discuss implicit conversion first.\
    \ Here the java compiler performs the type conversion if it is not mentioned in\
    \ the program.\n\nBelow is an example of an implicit conversion.\n\n```java\n\
    char valA='a';\nint valB=valA;\n```\n\nIn the first statement, we are assigning\
    \ the character value of 'a' to an identifier of valA. In the second statement,\
    \ even though we declare a variable of the type integer, we are still able to\
    \ assign the variable of the type character to this. This conversion is done directly\
    \ by the compiler.\n\nType conversions should always be done with caution as it\
    \ can have unknown consequences in the output of the program. The following primitive\
    \ types can undergo type conversion:\n\n- char\n- byte\n- short\n- int\n- long\n\
    - float\n- double\n\nNow let's look at an example on how we can work with implicit\
    \ conversions.\n\n# Example 44: The following program is used to showcase the\
