    \ program is used to showcase a simple Java program for interfaces.\n\n```java\n\
    interface IStudent\n{\n    // Only the function is part of the interface\n   \
    \ void Display();\n}\n\nclass Student implements IStudent\n{\n    // Encapsulating\
