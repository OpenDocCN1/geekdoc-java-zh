    \     System.out.println(\"The ID of the student is \"+stud.getID());\n    }\n\
    }\n}\n```\n\n## 3.6 Inheritance\n\nJava has the support for classes to inherit\
    \ the properties and methods of other classes. This greatly helps in not having\
    \ the need to develop classes over and over again, and helps in better development\
    \ of an application. An example of inheritance is given below. We will see this\
    \ in further detail in book 2 of the series.\n\n**Example 9: The following program\
    \ is used to showcase a simple Java program for inheritance.**\n\n```java\nclass\
    \ Person\n{\n    // Encapsulating the ID property\n    private\n    int ID;\n\
