    \ is \" +stud.getName());\n    }\n}\n}\n```\n\n## 3.7 Interfaces\n\nAn interface\
    \ is a contract that a class must abide by. In an interface you have function\
    \ definitions and in the class which uses the interface, you will provide information\
    \ into the interface function. An example of interfaces is given below. We will\
