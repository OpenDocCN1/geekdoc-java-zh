    output should resemble the following:


    Score: 1400

    Temperature: 75.2

    Name: Jonathan


    ## 4-2: Anatomy of an Assignment Statement


    Look at the following line:


    ```

    int score = 1400;

    ```


    This is called an assignment statement, because it assigns a value (1400) to a
    variable (score). Computers store information in memory. A variable is a space
    in memory that has a name. That name is used by Java to refer to that space in
    memory, whenever your code accesses (makes use of). Give your variables names
    that briefly describe the data they contain. For example, num_monkeys would be
    a good name for a variable holding the number of monkeys in a zoo, where nm would
    be harder to understand, at a glance.


    Every variable, in Java, has a data type (int, short). The variable is of type
    int. An is an integer (whole number that can be positive, negative, or zero).
    Any information of this kind (an integer) can be stored in a variable of type
    int. The type, int, is not a class, but is a primitive (simple) data type, which
    is built in Java.


    A variable is used to store a value. However, a variable IS NOT THE SAME THING
    AS value! The variable is here, and its value is 1400. A value is meaningful in
    the context of an encyclopedia program, 1400, in a game, could be a player’s score,
    and to the variable, score. In 1400, in an encyclopedia program, could be a year
    in history.


    The = (assignment) operator tells Java to assign the value, 1400, and in an assignment
    statement, the variable ALWAYS goes on the left side of the =, and the value ALWAYS
    goes on the right side of the =. Picture the = operator as an arrow pointing to
    the left (–):


    ```

    int score ← 1400;

    ```


    Think of it, and say it as, “int score gets 1400.”


    To recap, the assignment statement, int score = 1400; creates a named variable
    score, of type int, and assigns it the value of 1400.


    Two other data types, in Java, are double and String. A variable of type double
    can store a real number, such as 75.2. The type, double, like int, is a primitive
    type. A variable of type String can store a string of text, such as “Jonathan”.
    The String class is a built-in class.


    ## 4-3: More Kinds of Print Statements


    Look at the following lines:


    ```

    String name = "Jonathan";

    System.out.print("Name: ");

    System.out.println(name);

    ```


    On the second line, a literal is passed to the print method. The string literal,
    "Name: ", is like a variable of type String, which has a value of "Name: ". Unlike
    a variable, however, "Name: " has no name, in your code. On the third line, the
    variable is passed to the println method. The println method accesses the value
    of name, in order to print Jonathan on the screen. The name of a variable, of
    a given type, can be used anywhere where a literal of that type can be used.


    Arguments of type int and double can also be passed to the print and println methods.


    ## 4-4: Changing the Value of a Variable


    After this line ...


    ```

    System.out.println(name);

    ``` ... add the following lines to your code:

    score = 1500;

    System.out.print("New Score: ");

    System.out.println(score);

    ```


    Run your program. The last line of your program’s output should be:


    New Score: 1500


    The value of a variable can vary (change)! The line, score = 1400;, declared the
    existence of a variable named score, of type int, and assigned the value of 1400
    to it. To assign a value to a variable, for the first time, is to initialize variable.
    You are giving that its initial (first) value.


    Later on, another assignment statement, score = 1500;, assigns a new value, 1500,
    to the variable, score. When the print statement, System.out.println(score); is
    executed, the number, 1500, gets printed, because the value of score is now 1500,
    rather than 1400.


    The data type of score is not specified again, because Java already knows, from
    the first assignment statement (int score = 1400;), score''s data type is int.
    Again, picture the score = operator as an arrow pointing to the left: ← 1500;


    The assignment statement is ALWAYS written: score = 1500! It is NEVER written:
    1500 = score; If you picture the = operator as an arrow pointing to the left,
    you can assign the value of score to the number.


    To recap, the assignment statement, score = 1500;, assigns the value of 1500 to
    the variable named score, which already exists. As you know, the name of a variable,
    of a given type, can be used anywhere that a literal of that type can be used.
    After the SECOND appearance of this line ...


    ```

    System.out.println(score);

    ``` ... add the following lines to your code:

    ```

    double boiling_point = 21.0;

    temp = boiling_point;

    System.out.print("New Temperature: ");

    System.out.println(temp);

    ```


    Run your program. The last line of your program''s output should be: New Temperature:
    21.0


    The first new assignment statement, boiling_point = 21.0., creates a variable
    named boiling_point, of type double, and assigns it the value of 21.0. The second
    new assignment statement, temp = boiling_point; assigns the VALUE OF boiling_point
    (21.0) to the variable temp, which already exists. In “arrow form”:


    ```

    temp ← boiling_point;

    temp ← 21.0;

    ```


