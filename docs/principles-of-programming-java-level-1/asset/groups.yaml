    ```

    3 int a = sc.nextInt();

    4 sc.nextLine();

    5 System.out.println("You entered: " + a + ".");

    6 System.out.print("Enter a sentence: ");

    7 String sentence = sc.nextLine();

    8 System.out.println("You entered (" + sentence + ")");

    ```


    When the program reaches line 3, it waits for the user to enter an integer. The
