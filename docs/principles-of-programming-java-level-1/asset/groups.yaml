    ## Boolean Logic


    ### 8-1: Inside the “Mind” of a Computer


    You may think your computer is “smart”. You may even own a “smart phone”. However,
    computers actually have no intelligence at all! A computer can only do what it
    has been programmed to do. It gets its apparent “intelligence” from the cleverness
    of its programmers.


    Computers are actually pretty stupid! They have to be told EXACTLY how to do everything,
    they do not have the instincts or intuition that animals and humans have. They
    do not think, although they decide, in a sense, the “thought process” of a computer
    is quite simplistic: everything is on or off, yes or no, black or white, or zero,
    true or false.


    A computer runs on electricity. Its electrical circuits as containing many tiny
    light bulbs, which can be either on or off, depending on how light switches are
    flipped.


    ## 8-2: Questions, Answers, and the Boolean Data Type


    Despite their lack of intelligence, computers can answer questions. However, the
    questions may be yes-or-no questions. For example, “Is the chicken ready?” To
    a computer, the chicken is ready, or it is not ready. There are no-betweens, “slightly
    undercooked”. Alternatively, it’s true that the chicken is ready, or it’s false
    that the chicken is ready.


    A value of true or false is a Boolean (pronounced “BOO-lee-in”) value. The values
    of true and false are the ONLY two Boolean values. In Java, Boolean values can
    be stored in variables of the primitive data type, boolean. All things are named
    after the mathematician, George Boolean (1815–1864).


    You must remember, though, the computer is stupid. It doesn’t know ANYTHING about
    what a chicken is, or what readiness means! The computer must do EXACTLY what
    it means for a chicken to be ready. Let’s say a recipe tells you the chicken for
    45 minutes. You translate the question, “Is the chicken ready?” to “Has the chicken
    been cooking for at least 45 minutes?” This new question is more specific, and
    the computer now “understands” the concept of readiness, for this chicken. It
    still doesn’t know what a chicken is, but it doesn’t need to here.


    In code, the amount of time, in minutes, that the chicken has been cooking for
    can be stored in a variable; let’s call it cookTime. The value of this variable
    can be compared with the target value of 45 minutes. IF the chicken has been cooking
    for at least 45 minutes, THEN the chicken is ready. The result of this comparison
    (true or false) can be stored in a variable of type boolean; let’s call it ready.
    An oven’s program can check the value of ready. If ready is true, the oven can
    sound an alarm. In code:


    ```java

    boolean ready = cookTime >= 45;

    ```


    The expression, cookTime >= 45, is called a Boolean expression because it yields
    a Boolean value. There are six ways in which the quantities can be related in
    Java:


    | Relational Operator | Meaning |

    | :--- | :--- |

    | == | equal to |

    | != | not equal to |

    | < | less than |

    | <= | less than or equal to (at most) |

    | > | greater than |

    | >= | greater than or equal to (at least) |


    For another example, let''s say we have a calculator. Calculators can perform
    many operations, but they cannot divide by zero. If a user wishes to divide two
    numbers, the calculator must first check that the divisor (the number one is dividing
    by) is not zero. IF the divisor is not zero, THEN the calculator can divide the
    numbers. ELSE, IF it is NOT true (false), THEN the calculator will display an
    error message. In code:


    ```java

    boolean can_divide = divisor != 0;

    ```


