    \ 8: “Boolean Logic”\n\n- 8-1: Inside the “Mind” of a Computer\n- 8-2: Questions,\
    \ Answers, and the Boolean Data Type\n# Lesson 9: “Making Decisions Two Choices:\
    \ If and Else”\n\n- 9-1: Deciding Between Two Choices: If and Else\n- 9-2: Deciding\
    \ Between More Than Two Choices: If, Else If, and Else\n\n# Lesson 10: “Advanced\
    \ Boolean Logic”\n\n- 10-1: The Logical NOT Operator\n- 10-2: The Logical AND\
    \ Operator\n- 10-3: The Logical OR Operator\n# Lesson 11: “Loops”\n\n- 11-1: Repeating\
    \ Actions with While Loops\n- 11-2: Game: “Guess My Number”\n# Appendix: “Other\
    \ Useful Information”\n\n- A-1: What to Do If You Need Help\n- A-2: Naming Things\
    \ in Java\n- A-3: Methods of the String Class\n- A-4: Methods of the Math Class\n\
    - A-5: How to Get Multi-Word Input, Using the Scanner Class\n\n# Master Vocabulary\
    \ List for Lessons 0-11 and the Appendix\n\n# Lesson 0\n\n“Setting Up Your Computer\
    \ for Software Development”\n\n## 0-1: Installing the Necessary Software\n\nModern\
    \ computer systems do not usually come with the software (programs) necessary\
    \ for software development (the creation of new programs). In order to develop\
    \ software, you will need to install a few things on your computer.\n\nThe first\
    \ thing that you will need to install is the Java Runtime Environment (JRE), which\
    \ allows you to run programs in Java. You will be learning to use the Java programming\
    \ language. A programming language is a special language that allows a person\
    \ (a programmer) to tell a computer to do something, by telling it EXACTLY how\
    \ to do that. A programmer writes a program’s source code, and runs a special\
    \ program called a compiler, which transforms the source code into something the\
    \ computer can understand.\n\nTo install the JRE, follow these instructions:\n\
    \n- Go to http://www.java.com.\n- Click the “Free Download” button.\n- On the\
    \ next screen, click the “Agree and Start Download” button.\n- Your computer will\
    \ download a program. Once it has been downloaded, follow the prompts on the screen:\n\
    \  - Click the “Install” button.\n  - If there is any offer to install unrelated\
    \ piece of software, such as “Search by”, UNCHECK THE BOX next to “Search by”,\
    \ then click the “Next” button.\n  - Wait.\n  - If the JRE installer detects out\
    \ of date versions, click “Remind Me Later” button.\n  - Click the “Close” button.\n\
    \  - Your web browser will open.\n\nThe JRE only allows you to run programs, though.\
    \ The next thing you will need to install is the Java Development Kit (JDK), which\
    \ is a collection of tools that will allow you to develop programs in Java. However,\
    \ to simplify the process of installing the necessary software on your computer,\
    \ you can combine the installation of the JDK with an integrated development environment\
    \ (IDE) called NetBeans. An IDE allows you to write your code, compile it, run\
    \ your programs, and debug mistakes all in one place.\n\nTo install the JDK and\
    \ NetBeans IDE, follow these instructions:\n\n- Go to http://www.netbeans.org.\n\
    - Click the “JDK with NetBeans IDE SE bundle” link. It’s in paragraph of text\
    \ near the bottom of the page. You may need to scroll down.\n- Check the “Accept\
    \ License Agreement” button.\n- Click the red arrow/link next to your operating\
    \ system.\n- If your computer is from 2010 or later, choose “x64”.\n- Else, choose\
    \ “x86”.\n- If you don’t know, choose “x86”.\n\nYour computer will download a\
    \ program. Once it has been downloaded, follow the prompts:\n\n- Click the “Next”\
    \ button.\n- Wait. Check the “I accept the terms in the license agreement.” radio\
    \ button.\n- Click the “Next” button.\n- Click the “Next” button.\n- Click the\
    \ “Install” button.\n- Wait.\n- If you get a dialog box on the screen which asks\
    \ you to close certain programs before continuing, click “Close Programs and Continue”\
    \ button.\n- Click the “Finish” button.\n\nIf everything worked, then it’s time\
    \ to begin the next lesson, which you will write your first program in Java!\n\
    \n# Lesson 1\n\n“The First Program: ‘Hello World’”\n\n## 1-1: Getting Something\
    \ on the Screen\n\nIt's time to start up the NetBeans IDE and begin writing your\
    \ first program in Java!\n\nEvery program you make must be contained within a\
    \ project. A project is basically your program’s home while it is being written.\
    \ To set up this project, follow these instructions:\n\n- Select \"New Project\"\
    \ from the File menu.\n- At the prompt:\n  - In the \"Categories\" section, select\
    \ \"Java\".\n  - In the \"Projects\" section, select \"Java Application\".\n \
    \ - Click the \"Next\" button.\n- At the prompt:\n  - Replace the content of the\
    \ \"Project Name\" field (text box) with Hello World.\n  - Click the \"Finish\"\
    \ button.\n\nNow, you have a project, called Hello World, which contains one source\
    \ file: HelloWorld.java. A source file is a text file that contains source code.\
    \ Source code is text that is written in a programming language (like Java). Source\
    \ code can be turned into a program by a compiler. HelloWorld.java will contain\
    \ the code for the simple program Hello World.\n\nIn HelloWorld.java, replace\
    \ this line of code ...\n\n```\n// TODO code application logic here\n```\n\n...\
    \ with this:\n\n```\nSystem.out.println(\"Hello World!\");\n```\n\nNow, head over\
    \ to the Run menu and select “Run Project”. The program should output the following\
    \ text:\n\nHello World!\n\nTo output, or print something is to write it on the\
    \ screen. The output is the text that gets written on the screen.\n\nCongratulations!\
    \ You have just written your first Java program! Traditionally, when you learn\
    \ a new programming language, the first program you write is one that prints Hello\
    \ World! on the screen.\n\nIn the next lesson, you will learn about this program.\n\
    \n# Lesson 2\n\n“Anatomy of the First Program”\n\n## 2-1: The Whole Program\n\n\
    Right now, your Hello World program contains about 20 lines of code. Since you\
    \ are just starting out, you can safely ignore most of it.\n\n## 2-2: The Print\
    \ Statement\n\nLooking at the following line:\nSystem.out.println(\"Hello World!\"\
    );\n\nThis is the only part of the Hello World program that actually does anything!\
    \ It's called a *print statement*, because it tells the computer to print something\
    \ on the screen. This print statement tells the computer to print Hello World!\
    \ on the screen. A *statement* is a piece of code that tells the computer to perform\
    \ an action.\n\nThe semicolon (;) at the end of the print statement is required.\
    \ **Try removing that semicolon.** If you remove the semicolon, NetBeans will\
    \ put a red, squiggly underline underneath that line of code, as if it were a\
    \ spelling error in Microsoft Word. If NetBeans gives you the following helpful\
    \ hint: ';' expected. If you try to run your project with that mistake in your\
    \ code, you will get an error message. **Put that semicolon back. Programming\
    \ requires you to be precise!**\n\n## 2-3: The main Method\n\nLook at the following\
    \ code:\npublic static void main(String[] args)\n\nThis *declares* the *main method*\
    \ of your program. To declare is to announce to Java that it exists, what kind\
    \ of thing it is (here, a method), and what its name is. A method is like a \"\
    subprogram\", which performs one of the program's tasks, whenever it is *called*\
    \ (to run).\n\nThis method's name is main. The main method is a special method,\
    \ because it's your *entry point*. Whenever your program is run, the computer\
    \ starts running its code from here.\n\nIn Hello World, the main method contains\
    \ one statement within its *curly braces*. A method can contain ANY number of\
    \ statements, even none at all. An opening curly brace {} marks the beginning\
    \ of the main method's body, while a closing curly brace {} marks the end of its\
    \ body. **Make sure that every curly brace in your code is matched by a closing\
    \ curly brace!**\n\n## 2-4: The HelloWorld Class"
