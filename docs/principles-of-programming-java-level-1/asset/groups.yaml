    ## A-4: Methods of the Math Class


    The Math Class contains many useful methods. The following are a few commonly-used
    ones.


    - static int abs(int n)

    - static double abs(double n)


    This method returns the absolute value of n. The absolute value of a number is
    that number''s distance from zero. For example, -3.5 is 3.5 units away from zero,
    so the absolute value of -3.5 is 3.5. The absolute value of 3.5 is also 3.5. The
    abs method can be called with an argument of int or double. If an int is passed
    to it, the method will return an int. If a double is passed to it, the method
    will return a double.


    Example Code:


    ```

    int abs1 = Math.abs(-7); // abs1 = 7

    double abs2 = Math.abs(1.25); // abs2 = 1.25

    ```


    - static double ceil(double n)


    This method returns the ceiling of n, which is the smallest integral value, of
    type double, that is greater than or equal to n.


    Example Code:


    ```

    double ceil1 = Math.ceil(-4.8); // ceil1 = -4.0

    double ceil2 = Math.ceil(1.0); // ceil2 = 1.0

    ```


    - static int max(int a, int b)

    - static double max(double a, double b)


    This method returns the floor of n, which is the largest integral value, of type
    double, that is less than or equal to n. (Wait, the OCR text says floor for max,
    but contextually max returns the larger of two). If a is larger than b, this method
    returns a. Otherwise, it returns b. The max method can be called with two arguments
    of type int or double. If ints are passed to it, the method will return an int.
    If doubles are passed to it, the method will return a double.


    Example Code:


    ```

    int larger1 = Math.max(10, 4); // larger1 = 10

    double larger2 = Math.max(1.5, 2.5); // larger2 = 2.5

    ```

