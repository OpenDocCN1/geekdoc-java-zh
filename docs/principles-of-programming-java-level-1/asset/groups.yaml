    double temp\_cels $\leftarrow$ 5.0 / 9.0 * (68.0 – 32.0);

    double temp\_cels $\leftarrow$ 5.0 / 9.0 * (36.0);

    double temp\_cels $\leftarrow$ 0.5555555555555556 * 36.0;

    double temp\_cels $\leftarrow$ 20.0;

