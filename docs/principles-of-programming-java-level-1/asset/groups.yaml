    # # Lesson 2


    # “Anatomy of the First Program”


    # ## 2-1: The Whole Program


    Right now, your Hello World program contains about 20 lines of code. Since you
    are just starting out, you can safely ignore most of it.


    # ## 2-2: The Print Statement


    Looking at the following line:

    System.out.println("Hello World!");


    This is the only part of the Hello World program that actually does anything!
    It''s called a *print statement*, because it tells the computer to print something
    on the screen. This print statement tells the computer to print Hello World! on
    the screen. A *statement* is a piece of code that tells the computer to perform
    an action.


    The semicolon; (;) at the end of the print statement is required. **Try removing
    that semicolon.** If you remove semicolon, NetBeans will put a red, squiggly underline
    underneath that line of code, as if it were a spelling error, in Microsoft Word.
    If you NetBeans give you the following helpful hint: '';'' expected. If you try
    to run your project, with that mistake in your code, you will get an error message.
    **Put that semicolon back. Programming requires you to be precise!**


    # ## 2-3: The main Method


    Look at the following code:

    public static void main(String[] args)


    This *declares* the *main method* of your program. To declare is to announce to
    Java that it exists, what kind of thing it is (here, a method), and what its name
    is. A method is like a "subprogram", which performs one of the program''s tasks,
    whenever it is *called* (to run).


    This method''s name is main. The main method is a special method, because it''s
    your *entry point*. Whenever your program is run, the computer starts running
    its code from here.


    In Hello World, the main method contains one statement within its *curly braces*.
    A method can contain ANY number of statements, even none at all. An opening curly
    brace {} marks the beginning of the main method''s body, while a closing curly
    brace {} marks the end of its body. **Make sure that every curly brace in your
    code is matched by a closing curly brace!**


