    # A-5: How to Get Multi-Word Input, Using the Scanner Class


    In Lesson 7, you learned how to get user input with the Scanner class. To get
    a single word from a user, call the next method of a Scanner object.


    How do I get more than one word from a user? Call the nextLine method of a Scanner
    object as in the following example code:


    ```

    Scanner sc = new Scanner(System.in);

    System.out.print("Enter a sentence: ");

    String sentence = sc.nextLine();

    System.out.println("You entered: " + sentence);

    ```


    The nextLine method of sc waits for the user to enter a single line (at least
    zero characters, including possible spaces) of text, and returns a String. A line
    of text ends with a newline. A newline is a special character or sequence of characters,
    which means "put all after this on the next line" to the computer. In simpler
    terms, a newline is like a press of the Enter/Return key.


    However, the Scanner class was really designed for reading files, not from a user’s
    keyboard. Therefore, an unexpected and annoying thing can happen, if you call
    the nextLine AFTER calling one of Scanner’s other methods (like nextInt or next).
    Create a new project, and write the following code in the main’s method:


    +   1. Scanner sc = new Scanner(System.in);

    2. System.out.print("Enter an integer: ");

    3. int a = sc.nextInt();

    4. System.out.println("You entered: " + a + \.");\n5. System.out.print("Enter
    a sentence: ");

    6. String sentence = sc.nextLine();

    7. System.out.println("You entered: " + sentence + " ");"


    The numbers to the left of each line of code are line numbers. Try running your
    program. Let lousy program didn’t let me enter a sentence! The integer worked
    fine, but when it was time for me to enter my sentence, I got the following output:


    Enter a sentence: You entered


    System.in is an InputStream. The Scanner, sc, is "connected to" that InputStream,
    when sc is created. The methods of the Scanner class all begin with the word,
    next. What does this'
  - '[PAGE 54]


    all mean?


    A stream is a sequence of elements of data. When your program begins, System.in,
    an input stream, contains no data, because the user has not input anything yet.
    The nextInt method returns the NEXT token (whole piece of data) in the stream,
    which must be of the correct type: since the user has not input anything yet,
    there are no tokens in the input stream ... until the user provides one, by typing
    an integer, and pressing Enter/Return.


    Once the user has entered something, nextInt looks in the stream for it. nextInt
    ignores any whitespace characters (such as spaces or newlines). It processes any
    non-whitespace characters into a value of type int (to be returned by nextInt).
    It stops, when it encounters a space or a newline (just after the end of the token).


    Any spaces before the integer are ignored. If the user presses Enter/Return (or
    types only spaces, and presses Enter/Return), nextInt will not find a token. This
    will cause the program to keep waiting for the user to enter an integer! If the
    user enters a token that cannot be processed into an integer, such as abc, the
    program will crash, and display an error message. This will happen, because nextInt
    doesn''t know how to process the token, abc, into an integer. The program was
    EXPECTING a token that could be processed into an integer. If the user enters
    MORE THAN one integer on the line, such as 10 4 8, the above program''s output
    will be the following:


    Enter an integer: 10 4 8


    You entered: 10.


    Enter a sentence: You entered ( 4 8


    nextInt will only process the VERY NEXT token in the stream (10) into an integer.
    Once nextInt arrives at the space after the token (10), it will stop there, leaving
    “ 4 8” in the stream. The newline, which the user''s press of the Enter/Return
    key has placed after “ 4 8”, will also be left in the stream.


    There is still stuff in the stream! If the program called nextAgain, nextInt would
    not wait for the user to enter another integer. It would immediately return 4,
    since 4 is the NEXT token in the stream.


    When the program reaches line 6, the nextLine method will be called. next returns
    a String, which contains ALL of the characters in the stream (whitespace and non-whitespace),
    EXCEPT for the next newline. nextLine ADVANCES PAST the next newline, before stopping.


    Since there is still stuff in the stream, the program does not wait for the user
    to enter input, upon reaching line 6. Instead, the program puts “ 4 8” (nextLine''s
    token) into the variable, sentence. Then, the program reaches line 7, which prints
    the value of sentence between parentheses.


    The stream is now empty again, but the program has advanced beyond the place where
    we wanted the user to enter a sentence (6), and has now ended. Even if the user
    had entered 10, on line 3, a newline would have been left in the stream. nextLine
    would have advanced past that newline, without waiting for the user to enter a
    sentence. nextLine'
  - '[PAGE 55]


    would have returned an empty string (containing all zero of the characters before
