    ## A-5: How to Get Multi-Word Input, Using the Scanner Class


    In Lesson 7, you learned how to get user input with the Scanner class. To get
    a single word from a user, call the next method of a Scanner object.


    How do I get more than one word from a user? Call the nextLine method of a Scanner
    object as in the following example code:


    ```java

    Scanner sc = new Scanner(System.in);

    System.out.print("Enter a sentence: ");

    String sentence = sc.nextLine();

    System.out.println("You entered: " + sentence);

    ```


    The nextLine method of sc waits for the user to enter a single line (at least
    zero characters, including possible spaces) of text, and returns a String. A line
    of text ends with a newline. A newline is a special character or sequence of characters,
    which means "put all after this on the next line" to the computer. In simpler
    terms, a newline is like a press of the Enter/Return key.


    However, the Scanner class was really designed for reading files, not from a user’s
    keyboard. Therefore, an unexpected and annoying thing can happen, if you call
    the nextLine AFTER calling one of Scanner’s other methods (like nextInt or next).
    Create a new project, and write the following code in the main’s method:


    1. Scanner sc = new Scanner(System.in);

    2. System.out.print("Enter an integer: ");

    3. int a = sc.nextInt();

    4. System.out.println("You entered: " + a + ".");

    5. System.out.print("Enter a sentence: ");

    6. String sentence = sc.nextLine();

    7. System.out.println("You entered: " + sentence + " ");


    The numbers to the left of each line of code are line numbers. Try running your
    program. Let lousy program didn’t let me enter a sentence! The integer worked
    fine, but when it was time for me to enter my sentence, I got the following output:


    Enter a sentence: You entered


    System.in is an InputStream. The Scanner, sc, is "connected to" that InputStream,
    when sc is created. The methods of the Scanner class all begin with the word,
    next. What does this all mean?


    A stream is a sequence of elements of data. When your program begins, System.in,
    an input stream, contains no data, because the user has not input anything yet.
    The nextInt method returns the NEXT token (whole piece of data) in the stream,
    which must be of the correct type: since the user has not input anything yet,
    there are no tokens in the input stream ... until the user provides one, by typing
    an integer.


