    ## A-2: Java 中的命名


    变量、符号常量、方法和类都有名称，这些名称被称为标识符（identifiers）。符号常量类似于变量，区别在于你只能给它赋值一次。它的值永远无法通过你的代码更改。你可以几乎随心地为这些东西命名，只要你遵守以下规则：


    - 标识符中只使用大写字母、小写字母、数字和下划线 (_) 字符。

    - 标识符不能以数字开头。

    - 避免标识符长度超过 32 个字符。

    - 不要使用保留字作为标识符。

    - 保留字在蓝色中显示，具有特殊含义。保留字的一些示例是 `int`、`public` 和 `class`。


    合法的（Java允许的）标识符示例是什么？不合法的（Java不允许的）标识符是什么？标识符 `7_ways_from_sunday` 合法吗？`John`
    呢？


    这些规则给了你很大的自由，但优秀的程序员会遵循各种命名约定（命名事物的方法），以便让自己和其他程序员更容易阅读和理解代码：


    - 让重要事物的名称易于记忆。例如，`num_dogs` 比 `nd` 更容易一眼看懂。“哦，那是狗的数量。”相比之下，“天哪，nd 到底是什么？”现在多打几个字可以避免以后**大量的**挫败感！

    - 不要使用过长或过短的名字。例如，`the_little_kangaroo_who_lives_in_the_zoo` 可能太长了，而 `tlkwitz`
    几乎无法理解。想象一下必须反复输入第一个名字！像 `lil_roo_in` 可能会更好。


    - 不要使用以下划线开头的名字。同样，不要连续使用下划线，因为很难区分 `__`（两个）和 `___`（三个）。

    - 对于短标识符，避免使用容易混淆的字母和数字。很容易混淆 `I`、`l`（小写 L 或大写 I）与 `1`（数字）。同样，也很容易将 `o` 或 `O`（小写
    o 或大写 O）与 `0`（数字）混淆。

