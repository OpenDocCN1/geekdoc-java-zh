    将华氏度转换为摄氏度的公式为 $C=\frac{(F-32)}{5}$。在这个公式中，$C$ 代表摄氏度，$F$ 代表华氏度。这个公式可以翻译成 Java。在数学中，字母是变量。$F$
    变为 `temp_fahr`，$C$ 变为 `temp_cels`。一个 $an$ 可以被可视化为 $(-)$ 的赋值。


    完成这些步骤后，公式看起来如下：$temp\_cels=\frac{(temp\_fahr-32)}{5}$。数学中的分数线是除法符号，所以它变成了 $5
    / 9$。然而，温度的小数点可能有数字，因此通过在它们后面加上 $.0$ 将这些整数转换为 `double` 类型，例如 $5.0/9.0$。在数学中，两个操作数相邻意味着相乘，因此公式在
    Java 中最终看起来像这样：$temp\_cels=5.0/9.0*(temp\_fahr-30)$。Java 中可以使用括号，就像数学中一样，强制表达式的某些部分在其他部分之前求值。


