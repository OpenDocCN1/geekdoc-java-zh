    ## A-2: Naming Things in Java


    Variables, symbolic constants, methods, and classes all have names, which are
    called identifiers. A Symbolic constant is like a variable, except that you can
    only assign it a value once. Its value can never be changed by your code. You
    can name these things almost anything like you, provided you obey the following
    rules:


    - Only use uppercase letters, lowercase letters, numbers, and underscores (_)
    character) in an identifier.

    - An identifier cannot begin with a number.

    - Avoid making an identifier longer than 32 characters.

    - Do not use a reserved word as an identifier.

    - Reserved words have special meanings in blue for you. Some examples of reserved
    words are int, public, and class.


    What would be an example of a legal (allowed in Java) identifier? How about an
    illegal (NOT allowed in Java) identifier? Is the identifier, 7_ways_from_sunday,
    legal? How about John?


    Those rules give you a lot of freedom, but good programmers follow various naming
    conventions (ways of naming things), in order to make their code more readable
    and understandable by themselves and other programmers:


    - Make the names of important things easy to remember. For example, num_dogs is
    easier to understand, at a glance, than nd. “Oh, that’s the number of dogs.” versus
    “What in world is nd?” A little bit of typing now can save LOTS of frustration!

    - Don’t use names that are too long or too short. For example, the_little_kangaroo_who_lives_in_the_zoo
    is probably too long, tlkwitz is nearly impossible to understand. Imagine having
    to repeatedly type the first one! Something like lil_roo_in might be better.


    - Don''t use names that begin with underscores. Also, don''t use underscores in
    a row, because it''s hard to tell __ (two of them) and ___ (three of them) apart.

    - For short identifiers, use letters and numbers that can be easily confused with
    each other. It''s easy to confuse I l (lowercase L or uppercase I) with 1 (number).
    Likewise, it''s easy to confuse o or O (lowercase o or uppercase O) with 0 (number).

    - Variables are often given all-case identifiers, with words separated by underscores.
    Examples: link, all_points.

    - Symbolic constants are often given all-uppercase identifiers, with words separated
    by underscores. Examples: FEET_PER_MILE, PI.

    - Methods are often given in camel case, with the first letter lowercase. An example
    of camel case: UnderTheSea. There are no underscores; words run into each other,
    but can be distinguished from each other, because the first letter of each word
    is capitalized. Examples: main, toString, eraseAllFiles.

    - Classes are often given in camel case, with the first letter uppercase. Examples:
    String, PrintStream, EvilianMutant.


    In a project group, every member of the group should follow the naming conventions!


