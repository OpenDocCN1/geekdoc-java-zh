    System.out.print("y = ");

    System.out.println(y);

    System.out.print("z = ");

    System.out.println(z);

    System.out.print("x + y = ");

    System.out.println(x + y);

    System.out.print("x - y = ");

    System.out.println(x - y);

    System.out.print("x * y = ");

    System.out.println(x * y);

    System.out.print("x / y = ");

    System.out.println(x / y);

    System.out.print("x % y = ");

    System.out.println(x % y);

    ```


    Run your program. The program should output the following text:


    x = 5

    y = 3

    z = 7

    x + y = 8

    x - y = 2

    x * y = 15

    x / y = 1

    x % y = 2


    Look at the following line:


    ```

    int x = 2 + 3;

    ```


    This is an assignment statement. A variable of type int, x, is declared. The variable
    x gets initialized to the value that is the result of the expression, 2 + 3, which
    is 5. An expression is a combination of one or more operands (pieces of data)
    and zero or more operators (+), which yields a result when it gets evaluated.
    To evaluate an expression is to calculate its result. In “arrow form”, step-by-step:


    ```

    x ← 2 + 3;

    x ← 5;

    ```


    Look at the next line:


    ```

    int y = x - 2;

    ```


    The value of x is 5, so:


    ```

    y ← x - 2;

    y ← 3;

    ```


    Look at the next line:


    ```

    int z = x + 2;

    ```


    The value of x is 5, so:


    ```

    z ← x + 2;

    z ← 7;

    ```


    Look at the next line:


    ```

    int z = x;

    ```


    The value of x is 5, so:


    ```

    z ← x;

    z ← 5;

    ```


    A single operand, like x or 5, can be an expression, too! Look at the next line:


    ```

    x = z + 2;

    ``` (Wait, the OCR says `x = z + 2`, but based on context of `z=7`, it should
    be `z = x + 2`. Let''s stick to the provided OCR text but fix the logic flow).


    Look at the next line:


    ```

    x = z + 2;

    ```


    The value of z is 5, so:


    ```

    x ← z + 2;

    x ← 7;

    ```


    That statement assigned a new value, 7, to x. The value of z is still 5, even
    though “x” had previously been assigned to z, by the statement, int z = x;. Assigning
    the VALUE OF x to z does that. The variables, x and z ARE NOT “LINKED” to each
    other by the = operator! When an assignment statement is executed, ONLY the value
    of the variable on the LEFT side of THAT = can change!


    An expression that yields a result of a given type, can be used anywhere that
    a literal value or the value of a variable, of that type, can be used. Look at
    the following print statement:


    ```

    System.out.println(x + y);

    ```


    Before this statement executes, the expression, x + y, gets evaluated (to a result
    of 10, since the value of x is 7 and the value of y is 3). The statement gets
    executed, as if it were, System.out.println(10); since the result of x + y is
    10.


    By now, you have probably figured out that the + operator is used for addition,
    and that the - operator is used for subtraction. The * operator is used for multiplication,
    and the / operator is used for division.


    The % operator, however, is NOT used for calculating percentages! The expression,
    % y, yields the remainder that remains from the division of x by y. For example,
    the result of 35 % 4 is 3, because 35 ÷ 4 yields 8, with a remainder of 3. Four
    goes into thirty-five eights, with yield left over. Often, code like 35 % 4 is
    read, "3 mod 4". "Mod" short for modulus, which is a fancy word for remainder.


    Why does x / y yield? In math, 7 ÷ 3 yields 2.333...! If Both operands are of
    type int, then the result will be of type int. Therefore, the / operator performs
    integer division of x by y. To perform integer division, the result of x ÷ y,
    as a decimal, and then remove the part after the decimal point. 7 ÷ 3 = 2.333...c
    = 2.


    To get a result of double (+, -, *, /, %) which may have digits after a decimal
    point), any of the arithmetic operators, make sure that AT LEAST one of the operands,
    in the expression, is of double. For example, the result of 7 / 4 is 1.75. The
    result of 7.0, is of type double, because it contains a decimal point. Meanwhile,
    the result of 7 / 4 is 1, because both 7 and 4 are of type int. In evaluating
    7 / 4, integer division is performed.


