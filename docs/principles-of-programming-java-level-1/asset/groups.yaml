    \ Scanner 类获取多词输入\n\n# 课程 0-11 及附录主词汇表\n\n# 课程 0\n\n“为你的软件开发准备计算机”\n\n## 0-1：安装必要的软件\n\
    \n现代计算机系统通常不带有软件开发（即创建新程序）所需的软件（程序）。为了开发软件，你需要在你的计算机上安装一些东西。\n\n你需要安装的第一件事是 Java\
    \ 运行环境 (JRE)，它允许你运行 Java 程序。你将学习使用 Java 编程语言。编程语言是一种特殊的语言，它允许人类（程序员）通过告诉计算机**精确地**如何做，来让计算机执行某任务。程序员编写程序的源代码，并运行一种名为编译器的特殊程序，它将源代码转换为计算机可以理解的内容。\n\
    \n要安装 JRE，请遵循以下指令：\n\n- 访问 http://www.java.com。\n- 点击“免费下载”（Free Download）按钮。\n\
    - 在下一个屏幕，点击“同意并开始下载”（Agree and Start Download）按钮。\n- 你的计算机将下载一个程序。下载完成后，按照屏幕提示操作：\n\
    \  - 点击“安装”（Install）按钮。\n  - 如果有安装无关软件的提示（例如“Search by”），**取消勾选**“Search by”旁边的框，然后点击“下一步”（Next）按钮。\n\
    \  - 等待。\n  - 如果 JRE 安装程序检测到过旧版本，点击“稍后提醒”（Remind Me Later）按钮。\n  - 点击“关闭”（Close）按钮。\n\
    \  - 你的浏览器将打开。\n\nJRE 只允许你运行程序。你需要安装的下一件事是 Java 开发工具包 (JDK)，它是一个工具集合。为了简化在计算机上安装必要软件的过程，你可以将\
    \ JDK 的安装与名为 NetBeans 的集成开发环境 (IDE) 结合起来。IDE 允许你在一个地方编写代码、编译代码、运行程序并调试错误。\n\n\
