  md: "# Lesson 0\n\n“Setting Up Your Computer for Software Development”\n\n# 0-1:\
    \ Installing the Necessary Software\n\nModern computer systems do not usually\
    \ come with the software (programs) necessary for software development (the creation\
    \ of new programs). In order to develop software, you will need to install a few\
    \ things on your computer.\n\nThe first thing that you will need to install is\
    \ the Java Runtime Environment (JRE), which allows you to run programs in Java.\
    \ You will be learning to use the Java programming language. A programming language\
    \ is a special language that allows a person (a programmer) to tell a computer\
    \ to do something, by telling it EXACTLY how to do that thing. A programmer writes\
    \ a program’s source code, and runs a special program, called a compiler, which\
    \ transforms the source code into something the computer can understand.\n\nTo\
    \ install the JRE, follow these instructions:\n\n+   * Go to http://www.java.com.\n\
    * Click the “Free Java Download” button.\n* On the next screen, click the “Agree\
    \ and Start Free Download” button.\n* Your computer will download a program. Start\
    \ that once, it has been downloaded.\n* Follow the prompts (that tell you to do\
    \ something) on the screen:\n  * Click the “Install” button.\n  * If there is\
    \ any “offer” to install an unrelated and (BAD) piece of software, such as the\
    \ “Search App by Ask”, UNCHECK THE BOX next to “Add the Search by Ask”, and then\
    \ click the “Next” button.\n  * Wait.\n  * If the JRE installer detects out-of-date\
    \ Java versions, click the “Remind Me Later” button.\n  * Click the “Close” button.\n\
    \  * Your web browser will re-open.\n\nThe JRE only allows you to run (start and\
    \ up) Java programs, though. The next thing that you will need to install is the\
    \ Java Development Kit (JDK), which is a collection of tools that will allow you\
    \ to develop programs in Java. However, to simplify the process of installing\
    \ the necessary software on your computer, you can combine the installation of\
    \ the JDK with the installation of an integrated development environment (IDE)\
    \ called NetBeans. An IDE allows you to write your code, compile it, run your\
    \ programs, and debug (fixes mistakes in your code), all in one place.\n\nTo install\
    \ the JDK and the NetBeans IDE, follow these instructions:\n\n+   * Go to http://www.netbeans.org."
