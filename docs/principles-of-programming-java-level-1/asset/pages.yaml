    “something else”, the program can get even more specific. IF the value of grade
    is at least 65, THEN the grade is a D. ELSE, meaning that the value of grade is
    less than 65, the grade is an F. The Else block, at the end, is a “catch-all”,
    which causes the computer to decide that “all other grades” (those less than 65)
    are F’s.


    In summary, this is one way in which a computer can decide between five options,
    using Boolean logic: by making up to four choices between two options! Java allows
    allows you to decide between ANY number of options with conditional statements.'
