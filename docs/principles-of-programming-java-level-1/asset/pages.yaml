    You should get in the habit of writing good comments, which explain your code.
    One way of writing a comment is to put text between a /* and a /. This type of
    comment is called a multi-line comment, because it can span multiple lines. Example:


    /* This method is used to reset the game.


    The player starts with 3 lives.


    */


    Another way of writing a comment is to put text after a //. This type of comment
    is called a single-line comment, because it only continues until the end of that
    line. Example:


