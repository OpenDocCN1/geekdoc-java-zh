  md: '```

    boolean ready = cook_time >= 45;

    ```


    The expression, cook_time >= 45, is called a Boolean expression, because it yields
    a Boolean value. The >= operator means "greater than or equal to" (or "at least").
    It is one of the relational operators, because it''s used to relate (compare),
    in some way, the quantity on its left side is relate to the quantity on its right
    side. There are six ways in which the quantities can be related to each other,
    and six relational operators, in Java:


    | Relational Operator | Meaning |

    | --- | --- |

    | == | equal to |

    | != | not equal to |

    | < | less than |

    | <= | less than or equal to (at most) |

    | > | greater than |

    | >= | greater than or equal to (at least) |


    For another example, let''s say we have a calculator program. Calculators can
    perform many operations, but they cannot divide by zero. If a user wishes to divide
    two numbers, the calculator must first check that the divisor (the number that
    one is dividing by) is not zero. In code, the divisor can be stored in a variable;
    let''s call it divisor. The value of this variable can be compared with the forbidden
    value of 0. IF the divisor is not zero, THEN the user can divide the two numbers.
    The result of this comparison can be stored in a variable of type boolean; let''s
    call it can_divide. IF can_divide is true, THEN the calculator will divide the
    two numbers, and display the result on the screen. ELSE, IF can_divide is NOT
    true (false), THEN the calculator will display an error message on the screen.
    In Java code:


    ```

    boolean can_divide = divisor != 0;

    ```


    In the next lesson, you will learn how computers actually make decisions, based
    on the values of user input and other data, using Boolean logic.'
