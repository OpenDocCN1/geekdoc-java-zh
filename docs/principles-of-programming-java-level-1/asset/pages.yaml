  md: '# Lesson 4


    # “Information Storage”


    #  4-1: Program: “Know and Show”


    Create a new project, called Know and Show. In the program’s main method, write
    the following code:


    ```

    int score = 1400;

    System.out.print("Score: ");

    System.out.println(score);

    double temp = 75.2;

    System.out.print("Temperature: ");

    System.out.println(temp);

    String name = "Jonathan";

    System.out.print("Name: ");

    System.out.println(name);

    ```


    In your program, replace Jonathan with your own name. Run your program. The program’s
    output should resemble the following:


    Score: 1400

    Temperature: 75.2

    Name: Jonathan


    # 4-2: Anatomy of an Assignment Statement


    Look at the following line:


    ```

    int score = 1400;

    ```


    This is called an assignment statement, because it assigns a value (1400) to a
    variable (score). Computers store information in memory. A variable is a space
    in memory that has a name. That name is used by Java to refer to that space in
    memory, whenever your code accesses (makes use of). Give your variables names
    that briefly describe the data they contain. For example, num_monkeys would be
    a good name for a variable holding the number of monkeys in a zoo, where nm would
    be harder to understand, at a glance.


    Every variable, in Java, has a data type (for, short). The variable, is of type
    int An is an integer (whole number that can be positive, negative, or zero). Any
    information of this kind (an integer) can be stored in a variable of type int.
    The type, int, is not a class, but is a primitive (simple) data type, which is
    built in Java.


    A variable is used to store a value. However, a variable IS NOT THE SAME THING'
