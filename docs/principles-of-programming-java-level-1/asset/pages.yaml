  md: 'Look at the following code:


    ```

    public class HelloWorld

    ```


    This declares the HelloWorld class of your program. **Classes are tricky to explain!**
    A class usually defines the concept of a type of object. An object is a “thing”,
    such as an individual dog or an individual truck, which has state and behaviors.


    State describes an object. For example, one part of a dog’s state is its old age:
    how old is Spot? A behavior is something an object can do. For example, a dog
    can bark, and a truck can sound its horn.


    A type is the “category” into which an object falls. For example, Spot falls into
    the category of objects known as “dogs”. A type is like a class. **Don’t confuse
    objects with classes!** The individual dog, Spot, is not the same thing as the
    CONCEPT OF a dog (the definition of “dogness”).).


    Java is an object-oriented programming language. This means that in Java, much
    of your code will be organized around the use of objects and their classes. However,
    some classes, like HelloWorld, are not used to define types of objects. Rather,
    they are used to hold data (information) and methods, since basically every piece
    of code, in Java, must be contained within scope.


    The HelloWorld class’s body is enclosed within curly braces, just like the body
    of a method. It contains your program’s main method. The main method’s body is
    said to be nested within the body of the HelloWorld class. This means that the
    whole body of the main method is located within the body of the HelloWorld class.


    # ## 2-5: Packages


    Look at the following line:


    ```

    package hello.world;

    ```


    This statement tells Java that all of the classes in the HelloWorld.java file
    belong to the hello.world package. A package is like a folder that contains one
    or more classes.


    # ## 2-6: Comments


    There is other text in your program, which looks like it’s written in English,
    rather than in Java. These pieces of text are not code, but comments. A comment
    is a piece of text in your source code, which does not run, when your program
    runs.


    Some uses for comments:


    +   - Comments can be used to describe what code does.

    - Months later, you might forget what a piece of your code does.

    - A comment could help someone else, who needs to use your code, to better understand
    it.

    - Well-written comments can help programmers’ jobs easier.

    - They can also be used to label code: who wrote it, its purpose, etc.

    - Finally, code can be “commented out”, or prevented from running, by placing
    it'
