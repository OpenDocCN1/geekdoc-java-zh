  md: '# Lesson 5


    # “Calculation”


    # 5-1: Arithmetic in Java


    Create a new project, called Arithmetic in Java. In the program’s main method,
    write the following code:


    ```

    int x = 2 + 3;

    int y = x - 2;

    int z = x;

    x = z + 2;

    System.out.print("x = ");

    System.out.print(x);

    System.out.print(",", y = ");

    System.out.print(y);

    System.out.print(",", z = ");

    System.out.println(z);

    System.out.print("x + y = ");

    System.out.println(x + y);

    System.out.print("x - y = ");

    System.out.println(x - y);

