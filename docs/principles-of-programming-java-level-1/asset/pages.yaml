    - static double max(double a, double b)


    This method returns the *floor* of n, which is the largest integral value, of
    type double, that is less than or equal to n.


    Example Code:


    ```

    double floor1 = Math.floor(-4.8); // floor1 = -5.0

    double floor2 = Math.floor(1.0); // floor2 = 1.0

    ```


    If a is larger than b, this method returns a. Otherwise, it returns b. The max
    method can be called with two arguments of type int or double. If ints are passed
    to it, the method will return an int. If doubles are passed to it, the method
    will return a double.


    Example Code:


    ```

    int larger1 = Math.max(10, 4); // larger1 = 10

