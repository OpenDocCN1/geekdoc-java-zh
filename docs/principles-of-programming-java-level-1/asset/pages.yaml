  md: 'Fahrenheit temperature. The variable, temp\_cels, is used to store the Celsius
    temperature.


    The formula for converting degrees Fahrenheit to degrees Celsius is $C=\frac{(F-32)}{5}$.
    In this formula, $C$ stands for Celsius and $F$ stands for Fahrenheit. This formula
    can be translated into Java. The letters, in math, are variables. $F$ becomes
    temp\_fahr, and $C$ becomes temp\_cels. An $an$ can be visualized as an assignment
    of $(-)$.


    After those steps are done, the formula looks like this: $temp\_cels=\frac{(temp\_fahr-32)}{5}$.
    A fraction bar, in math, is a division sign, so it becomes $5 / 9$. However, temperatures
    can have digits after a decimal point, so make those integers doubles, by placing
    $.0$ after them, like $5.0/9.0$. In math, two operands touching each other implies
    multiplication, so the formula ends up looking like this, in Java: $temp\_cels=5.0/9.0*(temp\_fahr-30)$.
    Parentheses can be used in Java, just as they can in math, to force certain parts
    of an expression to be evaluated before others.


    Like math, Java also has an order of operations. Expressions in parentheses are
    evaluated first, from the innermost set of parentheses outward. Then, multiplications
    (*), divisions (/), and moduli (%) are performed, from left to right. Finally,
    additions (+) and subtractions (-) are done, from left to right.


    The evaluation of the above expression, step-by-step, in “arrow form":

    Note: The value of temp\_fahr is 68.0.


    ```

    double temp\_cels $\leftarrow$ 5.0 / 9.0 * (temp\_fahr – 32.0);

    double temp\_cels $\leftarrow$ 5.0 / 9.0 * (68.0 – 32.0);

    double temp\_cels $\leftarrow$ 5.0 / 9.0 * (36.0);

    double temp\_cels $\leftarrow$ 0.5555555555555556 * 36.0;

    double temp\_cels $\leftarrow$ 20.0;

    ```


    temp\_cels initialized to 20.0, since 68°F is 20°C.


    Test this program, by changing the value of temp\_fahr, on your own. Try the following
