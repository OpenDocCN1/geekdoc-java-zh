  md: '# Introduction


    The Web Component Developer exam is one of the advanced level certifications in
    the world of Java. But this doesn''t mean it has to be more difficult than the
    programmer''s exams. That''s because its focus is on testing your knowledge about
    APIs. To be more specific, the servlet API and JSP related technologies.


    You''ll also need to understand Web and network related concepts, how a container
    works, and the elements of some XML configuration files. In today''s world, with
    web frameworks like JavaServer Faces and Spring MVC that make easier the development
    of web applications, many people don''t know the basic or low-level stuff that
    helps to understand why things are the way they are and to resolve very specific
    problems. And that''s a real problem.


    With that in mind, this book gives emphasis to the servlet and JSP sections of
    the exam since since in my experience, these are the sections with more weight.
    So this book presents 120 questions distributed across the twelve major topics
    covered by the exam in the following way:


    | Section | Number of Questions |

    |---|---|n| 1. Introduction to Java Servlets | 5 |

    | 2. Introduction to Java Server Pages | 5 |

    | 3. Implementing a MVC Design | 5 |

    | 4. The servlet''s environment | 25 |

    | 5. Container facilities for servlets and JSPs | 10 |

    | 6. More view facilities | 15 |

    | 7. Developing JSP pages | 15 |

    | 8. Developing JSP pages using custom tags | 10 |

    | 9. More Controller facilities | 10 |'
  merge: -1
  pgno: 10
- img_proc: true
  md: "| 10. More options for the Model | 5 |\n| 11. Asynchronous web applications\
    \ | 5 |\n| 12. Web application security | 10 |\n\n# # How to use this book\n\n\
    This book should not be your only resource if you are planning to take the Java\
    \ EE 6 Web Component Developer exam. It is just intended to be a supplement. A\
    \ good strategy to pass the exam would be the following:\n1. Take a course that\
    \ covers all the topics of the exam or study with a good strategy.\n2. Practice\
    \ all you can with mock exams.\n\nThe purpose behind this book is to help you\
    \ with the second point. There are many mock exams and simulators offered by companies\
    \ that claim to have a lot of questions and drills. The problem with most of them\
    \ is that many of those questions have nothing to do with the topics covered by\
    \ the exam, are ambiguous, repetitive or simply just too easy to compare it to\
    \ the real test.\n\nIn contrast, this book presents for each of the twelve major\
    \ topics covered by the exam, 5, 10, 15, or 25 well-thought questions properly\
    \ formatted, each with a link to its answer and an explanation. You can try to\
    \ answer the question by yourself and after that if you get the correct answer\
    \ before proceeding to the next or answer all the questions within a section,\
    \ record your answers somewhere and see how many of them you got right. For all\
    \ the wrong answers, you can go back to study on the topic covered by each question\
    \ until you master it.\n\nFurther, I offer you some tips to pass the exam:\n\n\
    +   - Think about the concept question is asking. Is it something that affects\
    \ the whole web application? Then maybe it relates to the ServletContext. Is it\
    \ something in sounds can be related to the request? the response? or a servlet\
    \ or a JSP page?\n- Don't rush through the exam. Do not read the question too\
    \ quickly, try to fully understand what the question is asking before answer it.\n\
    \ Study one topic at a time.\n- Give yourself enough time to study. Avoid cramming.\n\
    - Be sure to check out http://www.javaranch.com. It has the best"
