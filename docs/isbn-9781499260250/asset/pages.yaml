  md: '# Answers Section 8. Developing JSP pages using custom tags


    # 8.5. The correct options are C and D.


    Explanation:


    Tag library descriptor files must have the extension .tld and must be packaged
    in the /WEB-INF/ directory or subdirectory of the WAR file or in the /META-INF/
    directory or subdirectory of a tag library packaged in a JAR. If a tag is implemented
    as a tag file and is packaged in /WEB-INF/tags/ or a subdirectory, a TLD will
    be generated automatically by the web container, though you can provide one if
    you wish.


    Thus, you can specify taglib directives in the following ways:


    +   * Using the context-relative path that refers directly to the TLD or JAR file:

    <@ taglib uri="WEB-INF/tld/f.tld" prefix="f" %>


    +   * Using the page-relative path that refers directly to the TLD or JAR file:

    <@ taglib uri="../WEB-INF/tld/f.tld" prefix="f" %>


    +   * Using the URI element defined in the TLD:

    <@ taglib uri="http://example.com/functions" prefix="f" %>


