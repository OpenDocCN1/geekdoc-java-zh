  md: '# Answers Section 7. Developing JSP pages


    7.15. The correct options are C and D.


    # Explanation:


    There are 9 implicit objects that we can directly use in JSP page. Seven of them
    are declared as local variables at the start of _jspService() method whereas two
    of them are arguments of that method.


    +   1. request. Implements the javax.servlet.http.HttpServletRequest interface.
    It represents the request made by the client.


    +   2. response. Implements the javax.servlet.http.HttpServletResponse interface.
    It represents the response to be given to the client.


    +   3. out. It''s an instance of the javax.servlet.jsp.JspWriter class. It''s
    used to write the output content.


    +   4. session. Implements the javax.servlet.http.HttpSession interface. It''s
    used to store session state for a single user.


    +   5. application. Implements the javax.servlet.ServletContext interface. It
    gives facility for a JSP page to obtain and set information about the web application
    in which it is running.


    +   6. exception. It''s an instance of the java.lang.Throwable class. It is available
    in JSP error pages only and represents the exception that caused the control to
    pass to the JSP error page.


    +   7. config. Implements the javax.servlet.ServletConfig interface. It gives
    facility for a JSP page to obtain the initialization parameters available.


    +   8. page. It''s an instance of the java.lang.Object class. It represents the
    current JSP page, serving as a reference to the Java servlet object that implements
    the JSP page on which it is accessed.


    +   9. pageContext. It''s an instance of the javax.servlet.jsp.PageContext abstract
    class. It provides methods to get and set attributes in different scopes and for
    transferring requests to other resources.


