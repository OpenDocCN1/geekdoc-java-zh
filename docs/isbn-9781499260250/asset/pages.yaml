  md: '# Answers Section 12. Web application security


    12.10. The correct option is D.


    Explanation:


    The Java Authentication and Authorization Service (JAAS) consist of a set of APIs
    and interfaces for programmatic authentication and authorization. Authentication
    in JAAS is performed through a pluggable authentication module architecture (PAM),
    which uses one or more LoginModules to authenticate a user or service. Compared
    to declarative security, JAAS enables the security developer to customize the
    authentication process for an individual application.


    Those pluggable LoginModules perform the authentication based on information provided
    through callback handlers. Custom LoginModules must implement the methods defined
    by the javax.security.auth.spi.LoginModule interface.


    Callback handlers are used to obtain the user credentials to pass to the login
    module(s) for authentication. User credentials could be provided through login
    forms, tokens, certificates, etc. The login() method of a LoginModule is called
    by the LoginContext to authenticate a user and returns either true for a successful
    authentication, false for a failed authentication, or throw a javax.security.auth.login.LoginException
    in case of a failure.


