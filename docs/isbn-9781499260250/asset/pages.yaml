    # Explanation:


    There are two mechanisms for including another Web resource in a JSP page: the
    include directive and the jsp:include element.


    The include directive is processed when the JSP page is translated into a servlet
    class. This is exactly the same thing as copy-pasting the content of the included
    file at the location of the include statement:


