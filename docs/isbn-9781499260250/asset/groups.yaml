    # Answers Section 3. Implementing a MVC Design


    # 3.3. The correct option is C.


    # Explanation:


    The javax.servlet.RequestDispatcher class is used to forward a request to a resource.
    You can get it in two ways:


    +   - From HttpServletRequest, although it cannot extend outside the current servlet
    context.


    +   - From ServletContext, to obtain a RequestDispatcher for resources in foreign
    contexts.


    This means that if you use an absolute path (such as "/views/1.jsp"), there is
    no difference. But if you use relative path (such as "views/1.jsp"), you must
    use HttpServletRequest.getRequestDispatcher(), since ServletContext.getRequestDispatcher()
    doesn''t allow it. Thus:


