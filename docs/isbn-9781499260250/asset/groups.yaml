    # Answers Section 11. Asynchronous web applications


    # 11.3. The correct option is D.


    # Explanation:


    Taken from the Servlet 3.0 Specification, section 2.3.3.3:


    ```

    dispatch()

    The dispatch method takes no argument. It uses the original

    URI as the path. If the AsyncContext was initialized via the

    startAsync(ServletRequest, ServletResponse) and the request

    passed is an instance of HttpServletRequest. then the dispatch is to the

    URI returned by HttpServletRequest.getRequestURI(). Otherwise the

    dis is to the URI of the request when it was last dispatched by the

    container.

    ```


    Examples:


    ```

    REQUEST to /url/A

    AsyncContext ac = request.startAsync();

    ac.dispatch(); //does a ASYNC dispatch to /url/A


    REQUEST to /url/A

    FORWARD to /url/B

    getRequestDispatcher("/url/B").forward(request, response);

    AsyncContext ac = request.startAsync();

    ac.dispatch(); //does a ASYNC dispatch to /url/A


    REQUEST to /url/A

    FORWARD to /url/B

