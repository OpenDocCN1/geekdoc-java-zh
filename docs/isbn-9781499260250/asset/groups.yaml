    # Answers Section 11. Asynchronous web applications


    11.1. The correct options are A and C.


    # Explanation:


    Option A is true. Dispatching from a servlet that has asyncSupported set to true
    to one where asyncSupported is set to false is allowed. In this case, the response
    will be committed when the service method of the servlet that does not support
    async is exited and it is the container''s responsibility to call complete on
    the AsyncContext so that any interested AsyncListener instances will be notified.
    (Servlet 3.0 Specification, section 2.3.3.3)


    Option B is not true. Dispatching from a synchronous servlet to an asynchronous
    servlet would be illegal. However the decision of throwing an IllegalStateException
    is differed to the point when the application calls startAsync. (Servlet 3.0 Specification,
    section 2.3.3.3)


    Option C is true. In an asynchronous processing, initially the servlet returns
    without generating a response.


    Option D is not true. The method HttpServletRequest.startAsync puts the request
    into asynchronous mode and initializes the returned AsyncContext with the given
    request and response objects.


    Option E is not true. Async servlets can be called from Ajax calls (which are
    also asynchronous calls).


    # View Question on page 141'
