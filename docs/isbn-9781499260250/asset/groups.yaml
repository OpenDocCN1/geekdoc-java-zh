- md: "\n## Answers Section 12. Web application security\n\n### 12.6. The correct\
    \ options is C.\n\n### Explanation:\n\nThe attribute value of @HttpConstraint\
    \ indicates the authorization semantic that applies (only) when attribute rolesAllowed\
    \ returns an empty array.\n\nThe type of the value attribute is ServletSecurity.EmptyRoleSemantic,\
    \ which is an Enum with the following values:\n\n- DENY. Indicate that access\
    \ is denied independent of authentication state and identity.\n- PERMIT. Indicate\
    \ that access is permitted independent of authentication state and identity.\n\
    \nThe default value for this element is PERMIT. DENY is not supported in combination\
    \ with a non-empty rolesAllowed list.\n\nView Question on page 154\n\n## Answers\
    \ Section 12. Web application security\n\n12.7. The correct option is B.\n\n###\
    \ Explanation:\n\nLike HTTP Basic Authentication, HTTP Digest Authentication authenticates\
    \ a user based on a username and a password. However, unlike HTTP Basic Authentication,\
    \ HTTP Digest Authentication does not send user passwords over the network. In\
    \ HTTP Digest authentication the client sends a one-way cryptographic hash of\
    \ the password. (Servlet 3.0 Specification, section 13.6.2)\n\nView Question on\
    \ page 155\n\n## Answers Section 12. Web application security\n\n12.8. The correct\
    \ options are A and D.\n\nExplanation:\n\nThe strength of the required protection\
    \ is defined by the value of the transport guarantee. A transport guarantee of\
    \ INTEGRAL is used to establish a requirement for content integrity and a transport\
    \ guarantee of CONFIDENTIAL is used to establish a requirement for confidentiality.\
    \ The transport guarantee of NONE indicates that the container must accept the\
    \ constrained requests when received on any connection, including an unprotected\
    \ one. (Servlet 3.0 Specification, section 13.8)\n\nView Question on page 156\n\
    \n## Answers Section 12. Web application security\n\n12.9. The correct option\
    \ is C.\n\n### Explanation:\n\nThe HTTP operations and web resources to which\
    \ a security constraint applies are identified by one or more web resource collections.\
    \ A web resource collection consists of the following elements:\n\n- url-patterns\n\
    - http-method\n- http-method-omissions\n\nView Question on page 157\n\n## Answers\
    \ Section 12. Web application security\n\n12.10. The correct option is D.\n\n\
    Explanation:\n\nThe Java Authentication and Authorization Service (JAAS) consist\
    \ of a set of APIs and interfaces for programmatic authentication and authorization.\
    \ Authentication in JAAS is performed through a pluggable authentication module\
    \ architecture (PAM), which uses one or more LoginModules to authenticate a user\
