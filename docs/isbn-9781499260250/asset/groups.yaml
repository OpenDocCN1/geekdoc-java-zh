    ## Answers Section 9. More Controller facilities


    9.7. The correct options are B and D.


    Explanation:


    The ServletRegistration.Dynamic object represents a servlet and addMapping adds
    a servlet mapping with the given URL patterns to the servlet. If this method is
    called multiple times, each successive call adds a mapping to the servlet.


    Method ServletRegistration.Dynamic.setAsyncSupported applies to the servlet, not
    the mappings. A call to this method overrides any previous setting.


    Method ServletRegistration.Dynamic.setMultipartConfig applies to the mappings
    defined. If this method is called multiple times, each successive call overrides
    the effects of the former.


    Method ServletRegistration.Dynamic.setServletSecurity applies to all mappings
    added to this ServletRegistration up until the point that the ServletContext from
    which it was obtained has been initialized.


