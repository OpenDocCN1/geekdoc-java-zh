    - C. ${param.paramName}\n- D. ${pageContext.servletConfig.initParameter.paramName}\n\
    - E. ${application.paramName}\n\nView Answer on page 232\n\n# Practice Questions\
    \ Section 6. More view facilities\n\n# 6.3. Given:\n\n```jsp\n<%\njava.util.List\
