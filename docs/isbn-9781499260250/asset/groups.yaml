    # 7.5. The correct option is D.


    Explanation:


    The jsp:getProperty tag returns the value of the property. This tag also displays
    the value, converting the value of property to String and then inserting it to
    the response stream. Its syntax is:


    ```

    <jsp:getProperty name="instanceOfBean" property="propertyName"/>

    ```


    Where:


