    # Answers Section 7. Developing JSP pages


    7.8. The correct option is D.


    # Explanation:


    There are two mechanisms for including another Web resource in a JSP page: the
    include directive and the jsp:include element.


    The include directive is processed when the JSP page is translated into a servlet
    class. This is exactly the same thing as copy-pasting the content of the included
    file at the location of the include statement:


    ```

    <@ include file="filename" %>

    ```


    The jsp:include element is processed when a JSP page is executed. This will make
    a request (using the request dispatcher) that will execute the indicated page
    and then include the output in place of the jsp:include statement:


    ```

    <%jsp:include page="includedPage" />

    ```


