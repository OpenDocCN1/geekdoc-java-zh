    # 3.4. The correct options are D and E.


    # Explanation:


    Expression Language (EL) uses the ${} syntax. They can refer to the following
    objects and their properties or attributes:


    +   - JavaBeans components

    - Collections

    - Java SE enumerated types

    - Implicit objects


    To refer to properties, you use the . or [] notation. So, if you wanted to reference
    the name property of the Person Bean, you could use either the expression ${person.name}
    or the expression ${["name"]} using double or single quotes for the String literal.


    EL defines the following literals:


    +   - Boolean: true and false

    - Integer: as in Java

    - Floating point: as in Java

    - String: with single and double quotes, " is escaped as \\", '' is escaped as
    \\'', and \\ is escaped as \\

    - Null: null


    And the following operators:


    +   - Arithmetic: +, -, (binary), *, / and div, % and mod, - (unary)

    - Logical: and, &&, or, ||, not, !

    - Relational: ==, eq, !=, ne, <, 1lt, gt, <=, ge, >=, le.

    Comparisons can be made against other values, or against boolean, string, integer,
    or floating point literals.'
