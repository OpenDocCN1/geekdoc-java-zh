    # Answers Section 7. Developing JSP pages


    7.6. The correct option is B.


    Explanation:

    The standard way to set beans properties in a JSP page is by using the jsp:setProperty
    tag. An asterisk (*) means that all bean properties with names that match request
    parameters sent to the page are set automatically. The following table summarizes
    the various ways to set a property using jsp:setProperty:


    | Source | Syntax |

    | --- | --- |

    | String constant | <jsp:setProperty name="beanName" property="propName" value="string-constant"/>
    |

    | Request Parameter | <jsp:setProperty name="beanName" property="propName" param="param-name"/>
    |

    | Request parameter name that matches bean property | <jsp:setProperty name="beanName"
    property="propName" /><br/><jsp:setProperty name="beanName" property="*" /> |

    | Expression | <jsp:setProperty name="beanName" property="propName" value="expression"
    /><br/><jsp:setProperty name="beanName" property="propName">

    <jsp:attribute name="value">Expression</jsp:attribute>

    </jsp:setProperty>


    If the value cannot be converted to the type of the property, an Exception is
    thrown.


