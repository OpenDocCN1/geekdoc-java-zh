    解析：


    `ServletRegistration.Dynamic` 对象代表一个 servlet，`addMapping` 根据指定的 URL 模式为 servlet
    添加映射。如果此方法被调用多次，每次连续调用都会为该 servlet 添加一个映射。


    方法 `ServletRegistration.Dynamic.setAsyncSupported` 适用于 servlet，不适用于映射。调用此方法会覆盖任何之前的设置。


    方法 `ServletRegistration.Dynamic.setMultipartConfig` 适用于定义的映射。如果此方法被调用多次，每次连续调用都会覆盖之前的效果。


    方法 `ServletRegistration.Dynamic.setServletSecurity` 适用于已添加到该 `ServletRegistration`
    的所有映射，直到获取该对象的 `ServletContext` 完成为止。


