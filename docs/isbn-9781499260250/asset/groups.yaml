    # Answers Section 7. Developing JSP pages


    7.14. The correct option is D.


    # Explanation:


    To specify that the web container should forward control to an error page if an
    exception occurs, the following page directive must be included:


    ```

    <@ page errorPage="errorPage.jsp" %>

    ```


    And the following page directive must be included in the error page:


    ```

    <@ page isErrorPage="true" %>

    ```


    So an object of type javax.servlet.ErrorData is available to the error page.


