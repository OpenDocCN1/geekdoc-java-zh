    Option A is not true. During initialization, when an UnavailableException indicates
    a minimum time of unavailability, the container must wait for the period to pass
    before creating and initializing a new servlet instance. Otherwise, the servlet
    must not be placed into active service and must be released by the servlet container
    (Servlet 3.0 Specification, section 2.3.2.1).


    Option B is true. UnavailableException has the constructor `UnavailableException(java.lang.String
    msg, int seconds)` that gives an estimate of how long the servlet will be unavailable.


    Option C is not true. The recommended thing to do is to throw an UnavailableException
    indicating a minimum time of unavailability.


    Option D is not true. If a permanent unavailability is indicated by the UnavailableException,
    the servlet container must remove the servlet from service, call its destroy method,
    and release the servlet instance. Any requests refused by the container by that
    cause must be returned with a SC_NOT_FOUND (404) response (Servlet 3.0 Specification,
    section 2.3.3.2).


    Option E is true. The container may choose to ignore the distinction between permanent
    and temporary unavailability and treat all UnavailableExceptions as permanent,
    thereby removing a servlet that throws any UnavailableException from service (Servlet
    3.0 Specification, section 2.3.3.2).


