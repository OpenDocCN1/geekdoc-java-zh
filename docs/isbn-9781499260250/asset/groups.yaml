    # Answers Section 6. More view facilities


    # 6.6. The correct option is C.


    Explanation:

    In addition to the . and [] operators, the Expression Language (EL) provides the
    following operators:


    +   - Arithmetic: +, (binary), *, / and div, % and mod, - (unary)

    - Logical: and &&, or, ||, not !

    - Relational: ==, !=, ne, <, >, gt, <=, >=, le. Comparisons can be made against
    other values, or against boolean, String, and integer or floating point literals.

    - Empty: The empty operator is used to determine whether a value is null or empty.

    - Conditional: A ? B : C. Evaluate B or C, depending on the result of the evaluation
    of A.


    The precedence of operators highest to lowest, left to right is as follows:


    +   - []

    - () - Used to change the precedence of operators.

    - - (unary) not ! empty

    - * / div mod

    - + - <= >= lt gt le

    - == != eq ne

    - && and

    - || or

    - ?:


    Option A evaluates to false. 3 is not greater than n.


    Option B evaluates to false. 1 is not greater or equal than n.'
