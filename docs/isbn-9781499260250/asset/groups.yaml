    Answers Section 8. Developing JSP pages using custom tags


    # 8.3. The correct option is C.


    Explanation:


    The c:set tag is a replacement of jsp:setProperty. It allows you to set bean properties,
    Map values, and create scoped variables.


    To create a variable, you can use the following syntax:


    ```

    <c:set var="num" value="1" scope="session" />

    ```


    The value of the variable can also be a scriptlet or EL expression:


    ```

    <c:set var="num" value="${param.number}" scope="session" />

    ```


    Alternatively, the value can be supplied in the body of the tag


    ```

    <c:set var="num" scope="session">

    1

    </c:set>

    ```


    To set a property of a variable, you use the following syntax:


    ```

    <c:set target="person" property="age" value="20" />

    ```


