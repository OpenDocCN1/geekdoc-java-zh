    \n- A. 函数方法的签名必须是 public boolean p(java.lang.String)\n- B. 函数方法的签名必须是 public boolean\
    \ process(java.lang.String)\n- C. 函数方法的签名必须是 public static boolean p(java.lang.String)\n\
    - D. 函数方法的签名必须是 public boolean process(java.lang.String)\n\n第 243 页答案\n\n# 练习题第\
