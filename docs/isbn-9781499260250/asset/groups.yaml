    # 引言


    Web 组件开发者考试是 Java 世界的高级认证之一。但这并不意味着它必须比程序员考试更难。这是因为它的重点在于测试你对 API 的了解。具体来说，就是
    servlet API 和 JSP 相关的技术。


    你还需要理解 Web 和网络相关的概念、容器如何工作，以及某些 XML 配置文件的元素。在当今世界中，随着 JavaServer Faces 和 Spring
    MVC 等 Web 框架使得 Web 应用开发变得更加简单，许多人并不了解基础或低层知识，而这些知识有助于理解为什么情况是现在这样，以及解决非常具体的问题。这确实是一个问题。


    考虑到这一点，本书重点关注考试中的 servlet 和 JSP 部分，因为根据我的经验，这些部分的权重更大。因此，本书展示了 120 个问题，分布在考试涵盖的
    12 个主要主题中，分布如下：


    | 部分 | 题目数量 |

    ||---||

    | 1. Java Servlets 简介 | 5 |

    | 2. Java Server Pages 简介 | 5 |

    | 3. 实现 MVC 设计 | 5 |

    | 4. servlet 的环境 | 25 |

    | 5. 用于 servlets 和 JSPs 的容器功能 | 10 |

    | 6. 更多视图功能 | 15 |

    | 7. 开发 JSP 页面 | 15 |

    | 8. 使用自定义标签开发 JSP 页面 | 10 |

    | 9. 更多控制器功能 | 10 |

    | 10. Model 的更多选项 | 5 |

    | 11. 异步 Web 应用 | 5 |

    | 12. Web 应用安全 | 10 |


    ## 如何使用本书


    如果你计划参加 Java EE 6 Web 组件开发者考试，那么这本书不应该是你的唯一资源。它只是旨在作为补充。通过考试的良好策略将是：

    1. 参加一个涵盖所有考试主题的课程，或者按照良好的策略进行学习。

    2. 尽可能地通过模拟考试进行练习。


    本书的目的是帮助你完成第二点。许多公司提供了许多模拟考试和模拟器，声称有大量的题目和练习。大多数模拟题的问题在于，其中许多题目与考试涵盖的主题无关，含义模糊、重复，或者仅仅与真实测试相比太简单了。


    相比之下，本书针对考试涵盖的 12 个主要主题中的每一个，都提供了 5、10、15 或 25 个格式正确、经过经过熟虑的问题，每个问题都带有答案链接和解释。你可以尝试自己回答问题，在进入下一个问题之前如果你得到了正确答案，或者回答一个部分内的所有问题，请记录你的答案并看看对了多少个。对于所有错误的答案，你可以回去学习每个问题所涵盖的主题，直到你掌握它。


    此外，我为你提供了一些通过考试的技巧：


    - 思考问题在问关于什么概念。它是影响整个 Web 应用的东西吗？那么它可能与 ServletContext 相关。它是与 request、response
    或 servlet 或 JSP 页面相关的吗？

    - 不要匆忙考试。不要太快阅读题目，在回答之前尝试完全理解题目在问什么。

    - 一次学习一个主题。

    - 为自己留足够的时间学习。避免临时抱佛。

    - 直接查看 http://www.javaranch.com。那里有最好的认证论坛和良好的社区。


    这里是一些有用链接：


    - Java EE 6 API 文档：http://docs.oracle.com/javaee/6/api/

    - Servlet 3.0 规范：https://jcp.org/aboutJava/communityprocess/mrel/final/jsr315/

    - JSP 2.2 规范：https://jcp.org/aboutJava/communityprocess/mrel/jsr245/

    - JSTL 1.2 规范：https://jcp.org/aboutJava/communityprocess/mrel/jsr052/index2.html


    如果你对书中提出的问题有疑问，可以访问网站 http://www.javapracticequestions.com 获取信息或联系作者。


    如果你喜欢或觉得这本书对你有帮助，请推荐它。如果你不喜欢，请提供反馈以改进它。并告诉我你考试考得如何。祝你好运。


    Esteban Herrera


