- md: "\n# Answers Section 7. Developing JSP pages\n\n7.8. The correct option is D.\n\
    \n# Explanation:\n\nThere are two mechanisms for including another Web resource\
    \ in a JSP page: the include directive and the jsp:include element.\n\nThe include\
    \ directive is processed when the JSP page is translated into a servlet class.\
    \ This is exactly the same thing as copy-pasting the content of the included file\
    \ at the location of the include statement:\n\n```\n<@ include file=\"filename\"\
    \ %>\n```\n\nThe jsp:include element is processed when a JSP page is executed.\
    \ This will make a request (using the request dispatcher) that will execute the\
    \ indicated page and then include the output in place of the jsp:include statement:\n\
    \n```\n<%jsp:include page=\"includedPage\" />\n```\n\n# View Question on page\
    \ 94\n\n# Answers Section 7. Developing JSP pages\n\n7.9. The correct option is\
    \ C.\n\nExplanation:\nThe following are the major phases of a JSP page life cycle:\n\
    \n- Compilation. This involves:\n  - Parsing the JSP.\n  - Turning the JSP into\
    \ a servlet.\n  - Compiling the servlet.\n- Initialization. When a container loads\
    \ a JSP page it invokes the jspInit() method before servicing any requests.\n\
    - Execution. Whenever a client requests a JSP page and the page has been loaded\
    \ and initialized, the container invokes the _jspService() method of the JSP.\n\
    - Destruction. When a JSP page is being removed from use by the container and\
    \ the jspDestroy() method is called.\n\n# View Question on page 95\n\n# Answers\
    \ Section 7. Developing JSP pages\n\n7.10. The correct option is B.\n\n# Explanation:\n\
    \nThe JSP declaration tag is used to declare fields and methods:\n<%! field or\
    \ method declaration %>\n\nThe code written inside the JSP declaration tag is\
    \ placed outside the _jspService() method of the generated servlet.\n\n# View\
    \ Question on page 96\n\n# Answers Section 7. Developing JSP pages\n\n# 7.11.\
    \ The correct option is D.\n\n# Explanation:\n\nThe page directive is used to\
    \ provide instructions to the container belonging to the current JSP page. The\
    \ content type is one of attributes associated with page directive.\n\nThe basic\
    \ syntax of the page directive is:\n<%@ page attribute=\"value\" %>\n\nWhen using\
    \ the XML format in the JSP page, the syntax is:\n<jsp:directive.page attribute=\"\
    value\" />\n\n# View Question on page 97\n\n# Answers Section 7. Developing JSP\
    \ pages\n\n7.12. The correct options are C and E.\n\nExplanation:\n\nThe list\
    \ of attributes associated with the page directive is the following:\n\n| Attribute\
    \ | Purpose |\n| --- | --- |\n| buffer | Specifies a buffering model for the output\
    \ stream. |\n| autoFlush | Controls the behaviour of the servlet buffer. |\n|\
    \ contentType | Defines the character encoding scheme. |\n| errorPage | Defines\
    \ the URL of another JSP that reports on Java unchecked runtime exceptions. |\n\
    | isErrorPage | Indicates if this JSP page is a URL specified by another JSP page's\
    \ errorPage attribute. |\n| extends | Specifies a superclass that the generated\
    \ servlet must extend. |\n| import | Specifies a list of packages or classes for\
    \ use in the JSP as the Java import statement does for Java classes. |\n| info\
    \ | Defines a string that can be accessed with the servlet's getServletInfo()\
    \ method. |\n| isThreadSafe | Defines the threading model for the generated servlet.\
    \ |\n| language | Defines the programming language used in the JSP page. |\n|\
    \ session | Specifies whether or not the JSP page participates in HTTP sessions.\
    \ |\n| isELIgnored | Specifies whether or not EL expression within the JSP page\
    \ will be ignored. |\n| isScriptingEnabled | Determines if scripting elements\
    \ are allowed for use. |\n\n# View Question on page 98\n\n# Answers Section 7.\
    \ Developing JSP pages\n\n7.13. The correct option is B.\n\nExplanation:\n\nTo\
    \ pass parameters to an included page, we use the jsp:param tag like this:\n\n\
    ```\n<jsp:include page=\"2.jsp\">\n<jsp:param name=\"p1\" value=\"1\" />\n<jsp:param\
    \ name=\"p2\" value=\"2\" />\n</jsp:include>\n```\n\nWe can extract the parameters\
    \ in the included page using expression language:\n\n```\n${param.p1}\n${param.p2}\n\
    ```\n\nOr implicit objects:\n\n```\n<%= request.getParameter(\"p1\")%>\n<%= request.getParameter(\"\
    p2\")%>\n```\n\n# View Question on page 99\n\n# Answers Section 7. Developing\
    \ JSP pages\n\n7.14. The correct option is D.\n\n# Explanation:\n\nTo specify\
    \ that the web container should forward control to an error page if an exception\
    \ occurs, the following page directive must be included:\n\n```\n<@ page errorPage=\"\
    errorPage.jsp\" %>\n```\n\nAnd the following page directive must be included in\
    \ the error page:\n\n```\n<@ page isErrorPage=\"true\" %>\n```\n\nSo an object\
    \ of type javax.servlet.ErrorData is available to the error page.\n\n# View Question\
    \ on page 100\n\n# Answers Section 7. Developing JSP pages\n\n7.15. The correct\
    \ options are C and D.\n\n# Explanation:\n\nThere are 9 implicit objects that\
    \ we can directly use in JSP page. Seven of them are declared as local variables\
    \ at the start of _jspService() method whereas two of them are arguments of that\
    \ method.\n\n- 1. request. Implements the javax.servlet.http.HttpServletRequest\
    \ interface. It represents the request made by the client.\n- 2. response. Implements\
    \ the javax.servlet.http.HttpServletResponse interface. It represents the response\
    \ to be given to the client.\n- 3. out. It's an instance of the javax.servlet.jsp.JspWriter\
    \ class. It's used to write the output content.\n- 4. session. Implements the\
    \ javax.servlet.http.HttpSession interface. It's used to store session state for\
    \ a single user.\n- 5. application. Implements the javax.servlet.ServletContext\
    \ interface. It gives facility for a JSP page to obtain and set information about\
    \ the web application in which it is running.\n- 6. exception. It's an instance\
    \ of the java.lang.Throwable class. It is available in JSP error pages only and\
    \ represents the exception that caused the control to pass to the JSP error page.\n\
    - 7. config. Implements the javax.servlet.ServletConfig interface. It gives facility\
    \ for a JSP page to obtain initialization parameters.\n- 8. page. It's an instance\
    \ of the java.lang.Object class. It represents the current JSP page, serving as\
    \ a reference to the Java servlet on which it is accessed.\n- 9. pageContext.\
    \ It's an instance of the javax.servlet.jsp.PageContext abstract class. It provides\
    \ methods to get and set attributes in different scopes and for transferring requests\
    \ to other resources.\n\n# View Question on page 101\n\n# Answers Section 8. Developing\
    \ JSP pages using custom tags\n\n# Answers Section 8. Developing JSP pages custom\
    \ tags\n\n8.1. The correct options are A and C.\n\n# Explanation:\n\nOption A\
    \ is true. JSTL include tags for SQL, XML, and formatting functionality among\
    \ others.\n\nOption B is not true. To use JSTL, you need the file jstl.jar and\
    \ standard.jar.\n\nOption C is true. <% taglib prefix=\"s\" uri=\"http://java.sun.com/jsp/jstl/core\"\
    \ %> is the tag directive to use the core JSTL tags.\n\nOption D is not true.\
    \ The JAR files containing the tags are placed in the WEB-INF/lib directory.\n\
    \n# View Question on page 105\n\n# Answers Section 8. Developing JSP pages custom\
    \ tags\n\n8.2. The correct option is C.\n\n# Explanation:\n\nThe c:import tag\
    \ provides all of the functionality of the jsp:include tag but also allows for\
    \ inclusion of absolute URLs and to expose the contents of a page in a String\
    \ or java.io.Reader object.\n\nThe c:import tag has has following attributes:\n\
    \n| Attribute | Description | Required | Default |\n| --- | --- | --- | --- |\n\
    | url | URL to retrieve and import into the page | Yes | None |\n| context | /\
    \ followed by the name of a local web application | No | Current application |\n\
    | charEncoding | Character set to use for imported data | No | ISO-8859-1 |\n\
    | var | Name of the variable to store imported text | No | Print to page |\n|\
    \ scope | Scope of the variable used to store imported text | No | Page |\n| varReader\
    \ | Name of an alternate variable to expose the imported text as a java.io.Reader\
    \ | No | None |\n\n# View Question on page 106\n"
  mdcn: "\n\n# 第 7 部分：开发 JSP 页面\n\n7.8. 正确选项是 D。\n\n# 解析：\n\n在 JSP 页面中包含另一个 Web 资源有两种机制：包含指令（include\
    \ directive）和 `jsp:include` 元素。\n\n包含 指令在 JSP 页面翻译成 servlet 类时被处理。这与在包含语句的位置复制粘贴包含文件的内容完全相同：\n\
    \n```\n<@ include file=\"filename\" %>\n```\n\n`jsp:include` 元素在 JSP 页面执行时被处理。它将发出一个请求（使用请求调度器\
    \ request dispatcher）来执行指定的页面，然后将输出结果替换掉 `jsp:include` 语句：\n\n```\n<%jsp:include\
    \ page=\"includedPage\" />\n```\n\n# 在第 94 页查看问题\n\n# 第 7 部分：开发 JSP 页面\n\n7.9.\
    \ 正确选项是 C。\n\n解析：\n以下是 JSP 页面生命周期的主要阶段：\n\n- 编译。这涉及：\n  - 解析 JSP。\n  - 将 JSP 转换为\
    \ servlet。\n  - 编译 servlet。\n- 初始化。当容器加载 JSP 页面时，它会在处理任何请求之前调用 `jspInit()` 方法。\n\
    - 执行。每当客户端请求 JSP 页面且该页面已加载并初始化时，容器就会调用 JSP 的 _jspService() 方法。\n- 销毁。当 JSP 页面从容器中移除时，会调用\
    \ `jspDestroy()` 方法。\n\n# 在第 95 页查看问题\n\n# 第 7 部分：开发 JSP 页面\n\n7.10. 正确选项是 B。\n\
    \n# 解析：\n\nJSP 声明标签（declaration tag）用于声明字段和方法：\n<%! field or method declaration\
    \ %>\n\n写在 JSP 声明标签内部的代码被放置在生成的 servlet 的 _jspService() 方法之外。\n\n# 在第 96 页查看问题\n\
    \n# 第 7 部分：开发 JSP 页面\n\n# 7.11. 正确选项是 D。\n\n# 解析：\n\n页面指令（page directive）用于向属于当前\
    \ JSP 页面的容器提供指令。`contentType` 是与页面指令相关的属性之一。\n\n页面指令的基本语法为：\n<%@ page attribute=\"\
    value\" %>\n\n在 JSP 页面中使用 XML 格式时，语法为：\n<jsp:directive.page attribute=\"value\"\
    \ />\n\n# 在第 97 页查看问题\n\n# 第 7 部分：开发 JSP 页面\n\n7.12. 正确选项是 C 和 E。\n\n解析：\n\n与页面指令相关的属性列表如下：\n\
    \n| 属性 | 用途 |\n| --- | --- |\n| buffer | 指定输出流的缓冲模型。 |\n| autoFlush | 控制 servlet\
    \ 缓冲区行为。 |\n| contentType | 定义编码方案。 |\n| errorPage | 定义另一个 JSP 的 URL，该页面报告 Java\
    \ 未检查的运行时异常。 |\n| isErrorPage | 表示此 JSP 页面是否由另一个 JSP 页面的 `errorPage` 属性指定的 URL。\
    \ |\n| extends | 指定生成的 servlet 必须继承的父类。 |\n| import | 指定在 JSP 中使用的包或类列表，就像 Java\
    \ import 语句对 Java 类所做的那样。 |\n| info | 定义一个可以通过 servlet 的 `getServletInfo()` 方法访问的字符串。\
    \ |\n| isThreadSafe | 定义生成的 servlet 的线程模型。 |\n| language | 定义 JSP 页面使用的编程语言。 |\n\
    | session | 指定 JSP 页面是否参与 HTTP 会话。 |\n| isELIgnored | 指定 JSP 页面内的 EL 表达式是否被忽略。\
    \ |\n| isScriptingEnabled | 决定允许使用脚本元素。 |\n\n# 在第 98 页查看问题\n\n# 第 7 部分：开发 JSP\
    \ 页面\n\n7.13. 正确选项是 B。\n\n解析：\n\n要向包含的页面传递参数，我们像这样使用 `jsp:param` 标签：\n\n```\n\
    <jsp:include page=\"2.jsp\">\n<jsp:param name=\"p1\" value=\"1\" />\n<jsp:param\
    \ name=\"p2\" value=\"2\" />\n</jsp:include>\n```\n\n我们可以使用表达式语言（EL）在包含的页面中提取参数：\n\
    \n```\n${param.p1}\n${param.p2}\n```\n\n或者使用隐式对象：\n\n```\n<%= request.getParameter(\"\
    p1\")%>\n<%= request.getParameter(\"p2\")%>\n```\n\n# 在第 99 页查看问题\n\n# 第 7 部分：开发\
    \ JSP 页面\n\n7.14. 正确选项是 D。\n\n# 解析：\n\n要指定发生异常时 Web 容器应将控制权转发到错误页面，必须包含以下页面指令：\n\
    \n```\n<@ page errorPage=\"errorPage.jsp\" %>\n```\n\n并且在错误页面中必须包含以下页面指令：\n\n\
    ```\n<@ page isErrorPage=\"true\" %>\n```\n\n因此，javax.servlet.ErrorData 类型的对象对错误页面可用可用。\n\
    \n# 在第 100 页查看问题\n\n# 第 7 部分：开发 JSP 页面\n\n7.15. 正确选项是 C 和 D。\n\n# 解析：\n\n在 JSP\
    \ 页面中我们可以直接使用 9 个隐式对象。其中 7 个在 _jspService() 方法的开始处被声明为局部变量，而另外 2 个是该方法的参数。\n\n\
    - 1. request。实现了 `javax.servlet.http.HttpServletRequest` 接口。它代表客户端发出的请求。\n- 2.\
    \ response。实现了 `javax.servlet.http.HttpServletResponse` 接口。它代表给给客户端的响应。\n- 3.\
    \ out。它是 `javax.servlet.jsp.JspWriter` 类的实例。它用于写入输出内容。\n- 4. session。实现了 `javax.servlet.http.HttpSession`\
    \ 接口。它用于存储单个用户的会话状态。\n- 5. application。实现了 `javax.servlet.ServletContext` 接口。它为\
    \ JSP 页面提供了获取和设置其运行的 Web 应用程序信息的功能。\n- 6. exception。它是 `java.lang.Throwable` 类的实例。它仅在\
    \ JSP 错误页面可用，代表导致控制权传递到 JSP 错误页面的异常。\n- 7. config。实现了 `javax.servlet.ServletConfig`\
    \ 接口。它为 JSP 页面提供了获取初始化参数的功能。\n- 8. page。它是 `java.lang.Object` 类的实例。它代表当前的 JSP\
    \ 页面，作为访问 Java servlet 的引用。\n- 9. pageContext。它是 `javax.servlet.jsp.PageContext`\
    \ 抽象类的实例。它提供了在不同作用域内获取和设置属性的方法，并将请求传输到其他资源。\n\n# 在第 101 页查看问题\n\n# 第 8 部分：使用自定义标签开发\
