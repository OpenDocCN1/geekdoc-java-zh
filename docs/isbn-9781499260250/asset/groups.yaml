    # Answers Section 8. Developing JSP pages using custom tags


    # 8.8. The correct options are C and D.


    Explanation:

    The directive to include the JSTL Core library is:

    <@ taglib prefix="c" uri="http://java.sun.com/jsp/jstl/core"%>


    The list of Core JSTL tags is:


    | Tag | Description |

    |---|---|

    | <c:out> | Like <%= ..>, for expressions. |

    | <c:set> | Sets the result of an expression evaluation in a ''scope''. |

    | <c:remove> | Removes a scoped variable (from a particular scope, if specified).
    |

    | <c:catch> | Catches any Throwable that occurs in its body and optionally exposes
    it. |

    | <c:if> | Simple conditional tag that evaluates its body if the supplied condition
    is true. |

    | <c:choose> | Simple conditional tag that establishes a context for mutually
    exclusive conditional operations, marked by <when> and <otherwise>. |

    | <c:when> | Subtag of <choose> that includes its body if its condition evaluates
    to ''true''. |

    | <c:otherwise> | Subtag of <choose> that follows <when> tags and runs only if
    all of the prior conditions evaluated to ''false''. |

    | <c:import> | Retrieves an absolute or relative URL and exposes its contents
    to either page, a String in ''var'', or a Reader in ''varReader''. |

    | <c:forEach> | The basic iteration tag, accepting many different collection types
    and supporting subsetting and other functionality. |'
