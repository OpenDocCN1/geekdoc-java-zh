    # Explanation:


    If there are more than one web-fragment jars, the processing order can be specified
    with <absolute-ordering> in web.xml and <ordering> in web-fragment.xml. The ordering
    of web-fragments is specified in the following priority:


    +   - From <absolute-ordering> in web.xml, if it exists

    - From <ordering> for each web-fragment.xml, if it exists

    - Otherwise, the ordering is unspecified.


    In the question:


    +   - <before> means the document must be ordered before the document with the
    name matching the <name> element.

    - If the <before> element contains a nested <others/>, the document will be moved
    to the beginning of the list of sorted documents. If there are multiple documents
    stating <before><others/>, they will all be at the beginning of the list of sorted
    documents, but the ordering within the group of such documents is unspecified.


    Since A and C specify a before-others ordering, they must come first (either A
    or C), which eliminates all options but B.


    You can find more info about ordering in sections 8.2.2 and 8.2.3 of Servlet 3.0
    specification.


