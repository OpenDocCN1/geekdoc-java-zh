    ## Answers Section 2. Introduction to Java Server Pages


    ### 2.4. The correct options are A and D.


    ### Explanation:


    The interactions between the three MVC components are defined like this:


    - A model notifies its associated view/views and controllers when there has been
    a change in its state. This notification allows views to update their presentation,
    and the controllers to change the available set of commands. In some cases, a
    MVC implementation might instead be "passive", so that other components must poll
    the model for updates rather than being notified.


    - A view is told by the controller all the information it needs for generating
    an representation of the model to the user. It can also provide generic mechanisms
    to inform the controller of user input.


    - A controller can send commands to the model to update the model’s state. It
    can also send commands to its associated view to change the view’s presentation
    of the model.


    ### View Question on page 14


    ## 2.5. The correct options are A and C.


    ### Explanation:


    A JSP page can act as a view as well as a controller. It can do anything a servlet
    can do and, since a controller job is to control all interactions within the application,
    one or many JSP pages can do this job. This is not the recommended way to program
    a controller and it may only be practical for the simplest controllers.


    ### View Question on page 15


    ## Answers Section 3. Implementing a MVC Design


    ### 3.1. The correct option is C.


    ### Explanation:


    The method getNamedDispatcher takes a String specifying the name of a servlet.
    The servlet name is defined in web.xml as <servlet-name> sub-element of the <servlet>
    element or with a @WebServlet annotation. The request is dispatched to that servlet.


    ### View Question on page 19


    ### 3.2. The correct option is A.


    ### Explanation:


    Option A is the correct option to get an attribute.


    Option B is not correct. request.getParameter() is the method to get parameters.
    Parameters are different than attributes. They are contained in the query string
    or posted form data so their type is String, while attributes are set by the servlet
    container or programmatically by developers and can be of any type.


    Option C is not a valid option, it throws a compile-time error.


    Option D is not a valid option, it throws a compile-time error.


    ### View Question on page 20


    ### 3.3. The correct option is C.


    ### Explanation:


    The javax.servlet.RequestDispatcher class is used to forward a request to a resource.
    You can get it in two ways:


    - From HttpServletRequest, although it cannot extend outside the current servlet
    context.


    - From ServletContext, to obtain a RequestDispatcher for resources in foreign
    contexts.


    This means that if you use an absolute path (such as "/views/1.jsp"), there is
    no difference. But if you use relative path (such as "views/1.jsp"), you must
    use HttpServletRequest.getRequestDispatcher(), since ServletContext.getRequestDispatcher()
    doesn''t allow it. Thus:


    Option A is not correct. getRequestDispatcher is receiving a relative path.


    Option B is not correct. The method forwardRequest doesn''t exist.


    Option D is not correct. The method forwardRequest doesn''t exist.


    ### View Question on page 21


    ### 3.4. The correct options are D and E.


    ### Explanation:


    Expression Language (EL) uses the ${} syntax. They can refer to the following
    objects and their properties or attributes:


    - JavaBeans components

    - Collections

    - Java SE enumerated types

    - Implicit objects


    To refer to properties, you use the . or [] notation. So, if you wanted to reference
    the name property of the Person Bean, you could use either the expression ${person.name}
    or the expression ${["name"]} using double or single quotes for the String literal.


    EL defines the following literals:


    - Boolean: true and false

    - Integer: as in Java

    - Floating point: as in Java

    - String: with single and double quotes, " is escaped as \", '' is escaped as
    \'', and \\ is escaped as \\

    - Null: null


    And the following operators:


    - Arithmetic: +, -, (binary), *, / and div, % and mod, - (unary)

    - Logical: and, &&, or, ||, not, !

    - Relational: ==, eq, !=, ne, <, lt, gt, <=, ge, >=, le.

    Comparisons can be made against other values, or against boolean, string, integer,
    or floating point literals.


    - Empty: The empty operator can be used to determine whether a value is null or
    empty.

    - Conditional: A ? B : C. Evaluates B or C depending on the result of the evaluation
    of A.


    ### View Question on page 22


    ### 3.5. The correct options are A and C.


    ### Explanation:


    Option A is true. The service method of a servlet is called for each request received
    by the servlet container.


    Option B is not true. The container initializes the servlet instance by calling
    the init method.


    Option C is true. Once the destroy method is called on a servlet instance, the
    container may not route other requests to that instance of the servlet. If the
    container needs to enable the servlet again, it must do so with a new instance
    of the servlet''s class.


    Option D is not true. The method ServletRequest.setParameter(String, String) doesn''t
    exist. You can only store attributes in the request with ServletRequest.setAttribute(String,
    Object).


    Option E is not true. ServletRequest.getRequestDispatcher(String) returns null
    if for any reason cannot return a RequestDispatcher.


    ### View Question on page 23


    ## Answers Section 4. The servlet''s environment


    ### 4.1. The correct options are C and E.


    ### Explanation:


    The methods in javax.servlet.http.HttpServletRequest related to headers:


    - long getDateHeader(String name). Returns the value of the specified request
    header as a long value that represents a Date object.


    - String getHeader(String name). Returns the value of the specified request header
    as a String. If the request did not include a header of the specified name, this
    method returns null. If there are multiple headers with the same name, this method
    returns the first head in the request.


    - Enumeration<String> getHeaders(String name). Returns all the values of the specified
    request header as an Enumeration of String objects.


    - Enumeration<String> getHeaderNames(). Returns an enumeration of all the header
    names this request contains. If the request has no headers, this method returns
    an empty enumeration.


    - int getHeader(String name). Returns the value of the specified request header
    as an int. If the request does not have a header of the specified name, this method
    returns -1. If the header cannot be converted to an integer, this method throws
    a NumberFormatException.


    In all cases, the header name is case insensitive.


    ### View Question on page 27


    ### 4.2. The correct option is H.


    ### Explanation:


    void addCookie(Cookie cookie) is the method in javax.servlet.http.HttpServletResponse
    that adds the specified cookie to the response. This method can be called multiple
    times to set more than one cookie.


    ### View Question on page 28


    ### 4.3. The correct option is D.


    ### Explanation: Since the servlet is accessed by multiple threads, the only safe
    place where data can be stored is in variables local to the executing method.
    Among the options, the ServletRequest object is the only one that meets this condition.


    ### View Question on page 29

