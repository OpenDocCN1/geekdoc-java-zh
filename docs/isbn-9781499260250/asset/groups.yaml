    # Answers Section 8. Developing JSP pages using custom tags


    # 8.4. The correct option is D.


    Explanation:


    The c:forTokens split a string separated by a delimiter in tokens and iterate
    over them. This tag also accept multiple delimiters.


    The most used attributes for this tag are the following:


    +   items. It contains the string which is having the tokens on which the iteration
    will happen.


    +   delims. It contains the characters which will separate the tokens in the string.


    +   var. It''s the name of the exported scoped variable for the current item of
    the iteration.


    +   varStatus. Name of the exported scoped variable for the status of the iteration.
    The varStatus attribute makes a new variable that holds an instance of javax.servlet.jstl.core.LoopTagStatus.


