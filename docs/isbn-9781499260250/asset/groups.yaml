    ## Answers Section 8. Developing JSP pages using custom tags


    ### 8.3. The correct option is C.


    Explanation:


    The c:set tag is a replacement of jsp:setProperty. It allows you to set bean properties,
    Map values, and create scoped variables.


    To create a variable, you can use the following syntax:


    ```

    <c:set var="num" value="1" scope="session" />

    ```


    The value of the variable can also be a scriptlet or EL expression:


    ```

    <c:set var="num" value="${param.number}" scope="session" />

    ```


    Alternatively, the value can be supplied in the body of the tag


    ```xml

    <c:set var="num" scope="session">

    1

    </c:set>

    ```


    To set a property of a variable, you use the following syntax:


    ```xml

    <c:set target="person" property="age" value="20" />

    ```


    # View Question on page 107


    ## Answers Section 8. Developing JSP pages using custom tags


    ### 8.4. The correct option is D.


    Explanation:


    The c:forTokens split a string separated by a delimiter in tokens and iterate
    over them. This tag also accept multiple delimiters.


    The most used attributes for this tag are the following:


    - items. It contains the string which is having the tokens on which the iteration
    will happen.

    - delims. It contains the characters which will separate the tokens in the string.

    - var. It''s the name of the exported scoped variable for the current item of
    the iteration.

    - varStatus. Name of the exported scoped variable for the status of the iteration.
    The varStatus attribute makes a new variable that holds an instance of javax.servlet.jstl.core.LoopTagStatus.


    # View Question on page 108


    ## Answers Section 8. Developing JSP pages using custom tags


    ### 8.5. The correct options are C and D.


    Explanation:


    Tag library descriptor files must have the extension .tld and must be packaged
    in the /WEB-INF/ directory or subdirectory of the WAR file or in the /META-INF/
    directory or subdirectory of a tag library packaged in a JAR. If a tag is implemented
    as a tag file and is packaged in /WEB-INF/tags/ or a subdirectory, a TLD will
    be generated automatically by the web container, though you can provide one if
    you wish.


    Thus, you can specify taglib directives in the following ways:


    - Using the context-relative path that refers directly to the TLD or JAR file:

    `<@ taglib uri="WEB-INF/tld/f.tld" prefix="f" %>`


    - Using the page-relative path that refers directly to the TLD or JAR file:

    `<@ taglib uri="../WEB-INF/tld/f.tld" prefix="f" %>`


    - Using the URI element defined in the TLD:

    `<@ taglib uri="http://example.com/functions" prefix="f" %>`


    # View Question on page 109


    ## Answers Section 8. Developing JSP pages using custom tags


    ### 8.6. The correct options are B and D.


    Explanation:


    Option A is not valid. The body of the tag doesn''t accept scriptlet code.


    Option B is valid. The attribute arg1 is optional since is not marked as required.


    Option C is not valid. The name of the tag is f1.


    Option D is valid. The body of the tag accepts static text, EL expressions, and
    custom tags.


    # View Question on page 110


    ## Answers Section 8. Developing JSP pages using custom tags


    ### 8.7. The correct options are A and E.


    Explanation:


    JSTL includes a number of standard functions, most of which are common string
    manipulation functions. The directive to include the JSTL Functions library is:

    `<@ taglib prefix="fn" uri="http://java.sun.com/jsp/jstl/functions" %>`


    The list of JSTL Functions is:


    | Function | Description |

    | :--- | :--- |

    | fn:contains() | Tests if an input string contains the specified substring. |

    | fn:containsIgnoreCase() | Tests if an input string contains the specified substring
    in a case insensitive way. |

    | fn:endsWith() | Tests if an input string ends with the specified suffix. |

    | fn:escapeXml() | Escapes characters that could be interpreted as XML markup.
    |

    | fn:indexOf() | Returns the index within a string of the first occurrence of
    a specified substring. |

    | fn:join() | Joins all elements of an array into a string. |

    | fn:length() | Returns the number of items in a collection, or the number of
    characters in a string. |

    | fn:replace() | Returns a string resulting from replacing in an input string
    all occurrences with a given string. |

    | fn:split() | Splits a string into an array of substrings. |


    | | |

    | :--- | :--- |

    | fn:startsWith() | Tests if an input string starts with the specified prefix.
    |

    | fn:substring() | Returns a subset of a string. |

    | fn:substringAfter() | Returns a subset of a string following a specific substring.
    |

    | fn:substringBefore() | Returns a subset of a string before a specific substring.
    |

    | fn:toLowerCase() | Converts all of the characters of a string to lower case.
    |

    | fn:toUpperCase() | Converts all of the characters of a string to upper case.
    |

    | fn:trim() | Removes white spaces from both ends. |


    # View Question on page 111


    ## Answers Section 8. Developing JSP pages using custom tags


    ### 8.8. The correct options are C and D.


    Explanation:


    The directive to include the JSTL Core library is:

    `<@ taglib prefix="c" uri="http://java.sun.com/jsp/jstl/core" %>`


    The list of Core tags is:


    | Tag | Description |

    | :--- | :--- |

    | <c:out> | Like expressions. |

    | <c:set> | Sets the result of expression in scope. |

    | <c:remove> | Removes a scoped variable (from particular scope). |

    | <c:catch> | Catches any Throwable that occurs in body. |

    | <c:if> | Simple conditional tag that evaluates condition. |

    | <c:choose> | Simple conditional tag that chooses between alternatives. |

    | <c:when> | Subtag of choose that evaluates condition. |

    | <c:otherwise> | Subtag of choose for default action. |

    | <c:import> | Retrieves an absolute or relative URL. |

    | <c:forEach> | Basic iteration over different types. |

    | <c:forTokens> | Iterates over tokens, separated by delimiters. |

    | <c:param> | Adds a parameter to import tag. |

    | <c:redirect> | Redirects to a new URL. |

    | <c:url> | Creates a URL with optional parameters. |


    ## Answers Section 8. Developing JSP pages using custom tags


    ### 8.9. The correct option is B.


    Explanation:


    Option A is not true. c:set works with Map objects.


    Option B is true. It will put an element in the map if there’s none with specified
    key.


    Option C is not true. c:set accept EL expressions.


    Option D is not true. c:set cannot create Map objects, it only modifies existing
    ones.


    # View Question on page 112


    ## Answers Section 8. Developing JSP pages using custom tags


    ### 8.10. The correct option is B.


    Explanation:


    c:choose works like a switch statement in that lets you choose between a number
    of alternatives, but instead of case statements, the c:choose tag has c:when tags
    and instead of a default clause to specify a default action, c:choose has c:otherwise.


    c:when tag has one attribute, the condition to evaluate, while c:choose and c:otherwise
    don''t have any attribute.


    In the question, ${1000*3/2} is evaluated to 1500 and 2 is printed.


    # View Question on page 113


    ## Section 9. More Controller facilities


    ### 9.1. The correct options are B and D.


    Explanation:


    Option A is not true. You can register initialization parameters dynamically with
    ServletRegistration.Dynamic.setInitParameter().


    Option B is true. You can add listeners dynamically with ServletContext.addListener().


    Option C is not true. You can configure filter mappings with FilterRegistration.Dynamic.addMappingForServletNames().


    Option D is true. With ServletRegistration.Dynamic you can configure a servlet
    or filter to support asynchronous operations.

