    \ can be achieved with other technologies.\n\nOption B is not true. Servlets are\
    \ compiled Java classes.\n\nOption D is not true. Servlets are not tied to a specific\
    \ client-server protocol, although they are most commonly used with HTTP.\n\n\
    View Question on page 4\n\n## Answers Section 1. Introduction to Java Servlets\n\
    \n### 1.3. The correct option is D.\n\n#### Explanation:\n\nOption A is not valid.\
    \ javax.servlet.Servlet is an interface with methods like service, destroy, etc.,\
    \ and MyServlet doesn't implement them.\n\nOption B is not valid. javax.servlet.Servlet\
    \ is an interface.\n\nOption C is not valid. javax.servlet.GenericServlet is an\
