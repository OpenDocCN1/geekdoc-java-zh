    ## More options for the Model


    10.3. The correct options are A and C.


    # Explanation:


    Option A is true. A persistence unit defines a set of all entity classes that
    are managed by a EntityManager instance.


    Option B is not true. Persistence units are defined by the persistence xml configuration
    file.


    Option C is true. Applications obtain a EntityManager instance from the method
    EntityManagerFactory.createEntityManager.


    Option D is not true. Entity instances are in one of four states:


    - New entity instances have no persistent identity and are not yet associated
    with a persistence context.

    - Managed entity instances have a persistent identity and are associated with
    a persistence context.

    - Detached entity instances have a persistent identity and are not currently associated
    with a persistence context.

    - Removed entity instances have a persistent identity, are associated with a persistence
    context, and are scheduled for removal from the data store.


    Option E is not true. An application that uses JPA does not need to explicitly
    create a connection, as it would when using JDBC. It uses a DataSource object
    that can be created in the server.


