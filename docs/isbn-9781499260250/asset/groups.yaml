    # 4.1. The correct options are C and E.


    # Explanation:


    The methods in javax.servlet.http.HttpServletRequest related to headers:


    +   - long getDateHeader(java.lang.String name). Returns the value of the specified
    request header as a long value that represents a Date object.


    +   - java.lang.String getHeader(java.lang.String name). Returns the value of
    the specified request header as a String. If the request did not include a header
    of the specified name, this method returns null. If there are multiple headers
    with the same name, this method returns the first head in the request.


    +   - java.util.Enumeration<java.lang.String> getHeaders(java.lang.String name).
    Returns all the values of the specified request header as an Enumeration of String
    objects.


    +   - java.util.Enumeration<java.lang.String> getHeaderNames(). Returns an enumeration
    of all the header names this request contains. If the request has no headers,
    this method returns an empty enumeration.


    +   - int getHeader(java.lang.String name). Returns the value of the specified
    request header as an int. If the request does not have a header of the specified
    name, this method returns -1. If the header cannot be converted to an integer,
    this method throws a NumberFormatException.


    In all cases, the header name is case insensitive.


