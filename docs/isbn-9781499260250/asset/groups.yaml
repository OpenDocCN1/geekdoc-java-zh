  mdcn: '


    ## 答案章节 12. Web 应用安全


    ### 12.6. 正确选项是 C。


    ### 解释：


    `@HttpConstraint` 的属性值指示了仅当属性 `rolesAllowed` 返回空数组时适用的授权语义。


    `value` 属性的类型为 `ServletSecurity.EmptyRoleSemantic`，它是一个包含以下取值的枚举：


    - DENY。表示无论认证状态和身份如何，都拒绝访问。

    - PERMIT。表示无论认证状态和身份如何，都允许访问。


    该元素的默认值为 `PERMIT`。在与非空 `rolesAllowed` 列表组合时，不支持 `DENY`。


    在第 154 页查看问题


    ## 答案章节 12. Web 应用安全


    12.7. 正确选项是 B。


    ### 解释：


    与 HTTP Basic 认证一样，HTTP Digest 认证根据用户名和密码对用户进行身份验证。然而，与 HTTP Basic 认证不同，HTTP Digest
    认证不会在网络上发送用户密码。在 HTTP Digest 认证中，客户端发送密码的单向加密哈希值。（Servlet 3.0 规范，第 13.6.2 节）


    在 155 页查看问题


    ## 答案章节 12. Web 应用安全


    12.8. 正确选项是 A 和 D。


    解释：


    所需的保护强度由 `transport guarantee` 的值定义。使用 `INTEGRAL` 传输保证是为了建立内容完整性需求，使用 `CONFIDENTIAL`
    传输保证是为了建立机密性需求。`NONE` 传输保证表示容器在从任何连接（包括不受保护的连接）接收请求时，必须接受受约束的请求。（Servlet 3.0 规范，第
    13.8 节）


    在 156 页查看问题


    ## 答案章节 12. Web 应用安全


    12.9. 正确选项是 C。


    ### 解释：


    适用于安全约束的 HTTP 操作和网络资源由一个或多个网络资源集合识别。网络资源集合包含以下元素：


    - url-patterns

    - http-method

    - http-method-omissions


    在第 157 页查看问题


    ## 答案章节 12. Web 应用安全


    12.10. 正确选项是 D。


    解释：


    Java 认证和授权服务 (JAAS) 由一组用于程序化认证和授权的 API 和接口组成。JAAS 中的认证通过可插认证模块架构 (PAM) 执行，该架构使用一个或多个
    `LoginModule` 对用户或服务进行身份验证。与声明式安全相比，JAAS 允许安全人员为单个应用程序自定义认证过程。


    这些可插的 `LoginModule` 根据回调处理器提供的信息执行认证。自定义的 `LoginModule` 必须实现由 `javax.security.auth.spi.LoginModule`
    接口定义的方法。


    回调处理器用于获取用户凭据并将其传递给登录模块进行认证。用户凭据可以通过登录表、令牌、证书等提供。`LoginContext` 调用 `LoginModule`
    的 `login()` 方法来验证用户，认证成功返回 `true`，认证失败返回 `false`，或者在失败时抛出 `javax.security.auth.login.LoginException`。


    在第 158 页查看问题


