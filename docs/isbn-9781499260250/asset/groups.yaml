    # 7.13. The correct option is B.


    Explanation:


    To pass parameters to an included page, we use the jsp:param tag like this:


    ```

    <jsp:include page="2.jsp">

    <jsp:param name="p1" value="1" />

    <jsp:param name="p2" value="2" />

    </jsp:include>

    ```


    We can extract the parameters in the included page using expression language:


    ```

    ${param.p1}

    ${param.p2}

    ```


    Or implicit objects:


    ```

    <%= request.getParameter("p1")%>

    <%= request.getParameter("p2")%>

