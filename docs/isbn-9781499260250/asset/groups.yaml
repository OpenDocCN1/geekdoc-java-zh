    # Answers Section 1. Introduction to Java Servlets


    # 1.1. The correct options are B and E.


    # Explanation:


    Option A is not true. A servlet is not a CGI program.CGI programs can be developed
    in many languages (Java being one of them), but they can be placed under some
    special directory (typically called "cgi-bin"), create a separate process for
    each request that is terminated as soon as the data transfer is completed, and
    they communicate with web servers via special library files. Servlets are server-side
    Java code that run in a server application, follow a standard framework, have
    a life cycle, and are loaded in memory to process requests.


    Option B is true. A servlet does not need to use a separate process to handle
    each client request, it simply spawns another thread within the same process.


    Option C is not true. A servlet is a Java class that makes use of the classes
    in the packages javax.servlet and javax.servlet.http.


    Option D is not true. CGI stands for Common Gateway Interface.


    Option E is true. As stated in the servlet specification, a Web application is
    a collection of servlets, HTML pages, classes, and other resources that make up
    a complete application on a Web server.


    # View Question on page 3'
