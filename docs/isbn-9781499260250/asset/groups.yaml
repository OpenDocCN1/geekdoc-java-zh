    \ 的实现可能是“被动”的，因此其他组件必须轮询模型以更新，而不是接收通知。\n\n- 视图（View）由控制器告知其在为用户生成模型表示所需的所有信息。它还可以提供通用机制来通知控制器用户输入。\n\
