  - '[PAGE 246]


    # Answers Section 6. More view facilities


    6.3. The correct options are B and D.


    # Explanation:


    When evaluating a expression like ${expr}, the container will look for an attribute
    called expr in the page, request, session, and application scopes and will return
    its value if it''s found.


    If expr evaluates to a Map, List, or array, the contained values are accessed
    using the [] operator, as in ${expr-a[expr-b]}. In the case of a List or an array,
    the value of expr-b is converted to int and the result of expr-a.get(expr-b) or
    Array.get(expr-a, expr-b) is returned, as appropriate.


    View Question on page 71'
