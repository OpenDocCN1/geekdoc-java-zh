    # Answers Section 11. Asynchronous web applications


    # 11.2. The correct option is C.


    Explanation:


    The following methods can be used to dispatch requests from the AsyncContext:


    ```

    dispatch(path)

    ```


    The dispatch method takes a String argument describing a path within the scope
    of the ServletContext. This path must be relative to the root of the ServletContext
    and begin with a ''/''


    ```

    dispatch(servletContext, path)

    ```


    The dispatch method takes a String argument describing a path within the scope
    of the ServletContext specified. This path must be relative to the root of the
    ServletContext specified and begin with a ''/''


    ```

    dispatch()

    ```


    The dispatch method takes no argument. It uses the original URI as the path. If
    the AsyncContext was initialized via startAsync(HttpServletRequest, ServletResponse)
    and the request passed is an instance of HttpServletRequest, then the dispatch
    is to the URI returned by HttpServletRequest.getRequestURI(). Otherwise the dispatch
    is to the URI of the request when it was last dispatched by the container.


    # View Question on page 142'
