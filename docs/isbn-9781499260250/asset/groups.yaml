    # Explanation:


    The following filter-mapping element maps the logging filter to MyServlet:


    ```xml

    <filter-mapping>

    <filter-name>LoginFilter</filter-name>

    <servlet-name>MyServlet</servlet-name>

    </filter-mapping>

    ```


    The mapping could also have specified the URL pattern "/MyServlet":


    ```xml

    <filter-mapping>

    <filter-name>LoginFilter</filter-name>

    <url-pattern>MyServlet</url-pattern>

    </filter-mapping>

    ```


    Note that the filter-mapping, servlet, and servlet-mapping elements must appear
    in the deployment descriptor.


