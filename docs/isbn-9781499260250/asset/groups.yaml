    ## More options for the Model


    10.1. The correct option is B.


    # Explanation:


    First, establish a connection with the data source you want to use. A data source
    can be a database, a file system, or some other source of data with a corresponding
    JDBC driver.


    Second, create a Statement object from the connection. Statement is an interface
    that represents a SQL statement.


    Then, to execute a query, call an execute method from the Statement. This will
    return a ResultSet object.


    From the ResultSet object, retrieve the results.


    When you are finished, close all the objects to release the resources.


