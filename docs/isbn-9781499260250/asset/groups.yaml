    \nxsi:schemaSchemaLocation=\"http://java.sun.com/xml/ns/j2ee/web-jsptagliblibrary_2_0.xsd\"\
    \nversion=\"2.0\">\n  <tlib-version>1.0</tlib-version>\n  <short-name>f</short-name>\n\
    \  <uri>http://example.com/functions</uri>\n  <tag>\n    <name>f1</name>\n   \
    \ <tag-class>com.example.F1Tag</tag-class>\n    <body-content>scriptless</body-content>\n\
    \    <attribute>\n      <name>arg1</name>\n      <rtexprvalue>true</rtexprvalue>\n\
    \    </attribute>\n  </tag>\n</taglib>\n```\n\n以下哪些选项代表了使用前缀 \"f\" 导入上述标签的有效用法？多项选题。\n\
    \n- A.\n<f:f1 arg1=\"1\">\n<%= request.getAttribute(\"a\") %>\n</f:f1>\n\n- B.\n\
    <f:f1>\n${f:f1}\n</f:f1>\n\n- C.\n<f:arg arg1=\"1\">\na\n</f:f>\n\n- D.\n<f:f1\
    \ arg1=\"1\">\n<jsp:getProperty name=\"beanName\" property=\"propName\" />\n</f:f1>\n\
    \n在第 276 页查看答案\n\n## 练习题第 8 节 使用自定义标签开发 JSP 页面\n\n### 8.7. 以下哪些项属于 JSTL 标准函数的一部分？多项选题。\n\
    \n- A. fn:contains()\n- B. fn:indexAt()\n- C. fn:size()\n- D. fn:toLower()\n-\
    \ E. fn:trim()\n\n在第 277 页查看答案\n\n## 练习题第 8 节 使用自定义标签开发 JSP 页面\n\n### 8.8. 以下哪些项属于\
    \ JSTL 核心标签的一部分？多项选题。\n\n- A. c:include\n- B. c:default\n- C. c:when\n- D. c:url\n\
    - E. c:try\n\n在第 279 页查看答案\n\n## 练习题第 8 节 使用自定义标签开发 JSP 页面\n\n### 8.9. 已：\n\n\
    ```xml\n<c:set target=\"${mapVar}\" property=\"key1\" value=\"${array[0].value}\"\
    \ />\n```\n\n以下哪些声明是正确的？多项选题。\n\n- A. c:set 不与 Map 对象工作。\n- B. 如果 map 中没有键为 key1\
    \ 的元素，它会在 map 中放入一个元素。\n- C. 它会抛出错误因为它因为它接受 EL 表达式。\n- D. 它创建了一个名为 mapVar 的 Map。\n\
    \n在第 281 页查看答案\n\n## 练习题第 8 节 使用自定义标签开发 JSP 页面\n\n### 8.10. 已：\n\n```xml\n<c:set\
    \ var=\"n\" property=\"key1\" value=\"${1000*3/2}\"/>\n<c:choose>\n  <c:when test=\"\
    ${n < 1000}\">\n    1\n  </c:when>\n  <c:when test=\"${n > 1000}\">\n    2\n \
    \ </c:when>\n  <c:otherwise>\n    3\n  </c:otherwise>\n</c:choose>\n```\n\n此代码段的输出是什么？\n\
    \n- A. 1\n- B. 2\n- C. 3\n- D. 13\n- E. 23\n- F. 以上都不是。\n\n在第 282 页查看答案\n\n##\
    \ 练习题第 9 节 更多的控制器功能\n\n目标：\n\n- 理解 servlet 的生命周期\n- 描述并使用 servlet API 的更多高级元素\n\
    - 创建过滤器并在 Web 中使用它们\n\n## 练习题第 9 节 更多的控制器功能\n\n### 9.1. 以下哪些声明是正确的？多项选题。\n\n-\
    \ A. 你不能动态注册初始化参数。\n- B. 你可以通过 ServletContext.addListener 动态地添加监听器。\n- C. 你可以通过\
    \ ServletRegistration.Dynamic 动态地配置过滤器映射。\n- D. 通过 ServletRegistration.Dynamic，你可以配置\
    \ servlet 或过滤器支持异步操作。\n\n在第 287 页查看答案\n\n## 练习题第 9 节 更多的控制器功能\n\n### 9.2. 以下哪些声明是正确的？多项选题。\n\
    \n- A. 程序化添加 servlet 和过滤器的方法可以在任何时间调用。\n- B. ServletContextListener.context 方法可以调用程序化添加\
    \ servlet 和过滤器的方法。\n- C. ServletContainerInitializer.onStartup 方法可以调用程序化添加 servlet\
    \ 和过滤器的方法。\n- D. ServletContextListener.onStartup 方法可以调用程序化添加 servlet 和过滤器的方法。\n\
    \n在第 288 页查看答案\n\n## 练习题第 9 节 更多的控制器功能\n\n### 9.3. 以下哪些声明是正确的？多项选题。\n\n- A. 过滤器必须实现\
    \ javax.servlet.FilterChain 接口。\n- B. 过滤器必须实现 doFilter 方法。\n- C. doFilter 方法的参数类型为\
    \ ServletRequest、ServletResponse 和 FilterChain。\n- D. 不同过滤器的执行可以链式。\n\n在第 289\
    \ 页查看答案\n\n## 练习题第 9 节 更多的控制器功能\n\n### 9.4. 以下哪些接口是 ServletContext.addListener\
    \ 方法的有效参数？多项选题。\n\n- A. javax.servlet.ServletContextAttributeListener\n- B. javax.servlet.FilterListener\n\
    - C. javax.servlet.SessionAttributeListener\n- D. javax.servlet.CookieListener\n\
    \n在第 290 页查看答案\n\n## 练习题第 9 节 更多的控制器功能\n\n### 9.5. 以下哪些声明是正确的？多项选题。\n\n- A. 所有\
    \ ServletContextListener 都在 Web 应用过滤器之前被通知上下文初始化。\n- B. 所有 ServletContextListener\
    \ 在 Web 应用过滤器之后被通知上下文初始化。\n- C. 所有 servlet 和过滤器在 ServletContextListener 通知之前被销毁。\n\
    - D. 所有 servlet 和过滤器在 ServletContextListener 通知之后被销毁。\n- E. ServletContextListener\
    \ 的实现在上下文销毁时按声明顺序被调用。\n- F. ServletContextListener 的实现在上下文销毁时被调用。\n\n在第 291 页查看答案\n\
    \n## 练习题第 9 节 更多的控制器功能\n\n### 9.6. 以下哪些是程序化添加 servlet 的有效方法？多项选题。\n\n- A. ServletRegistration.Dynamic.addServlet(java.String,\
    \ Class<? extends Servlet>)\n- B. ServletRegistration.Dynamic.addServlet(java.String)\n\
    - C. ServletContext.addServlet(java.String, Class<? extends Servlet>)\n- D. ServletContext.addServlet(java.String)\n\
    \n在第 292 页查看答案\n\n## 练习题第 9 节 更多的控制器功能\n\n### 9.7. 已：\n\n```java\nServletRegistration.Dynamic\
    \ srd = ...\nsrd.addMapping(\"/MyServlet\");\nsrd.setAsyncSupported(true);\nsrd.addMapping(\"\
    /My2\");\n```\n\n以下哪些声明是正确的？多项选题。\n\n- A. 只有 \"My2\" 会映射到代表的 servlet。\n- B. \"\
    My1\" 和 \"My2\" 都会映射到代表的 servlet。\n- C. 只有 \"My2\" 映射支持异步操作。\n- D. \"My1\" 和 \"\
    My2\" 映射都支持异步操作。\n\n在第 293 页查看答案\n\n## 练习题第 9 节 更多的控制器功能\n\n### 9.8. 以下哪些项是 javax.servlet.annotation.WebFilter\
    \ 的属性？多项选题。\n\n- A. initParams\n- B. asyncSupported\n- C. icon\n- D. loadOnStartup\n\
    - E. name\n\n在第 294 页查看答案\n\n## 练习题第 9 节 更多的控制器功能\n\n### 9.9. 已：\n\n```xml\n<filter>\n\
    \  <filter-name>LoginFilter</filter-name>\n  <filter-class>com.example.LoginFilter</filter-class>\n\
    </filter>\n<servlet>\n  <servlet-name>MyServlet</servlet-name>\n  <servlet-class>com.example.MyServlet</servlet-class>\n\
    </servlet>\n<servlet-mapping>\n  <servlet-name>MyServlet</servlet-name>\n  <url-pattern>MyServlet</url-pattern>\n\
    </servlet-mapping>\n```\n\n以下哪些片段将使过滤器在访问 MyServlet 时执行？多项选题。\n\n- A.\n<filter-mapping>\n\
    \  <filter-name>LoginFilter</filter-name>\n  <servlet-mapping>MyServlet</servlet-mapping>\n\
    </filter-mapping>\n\n- B.\n<filter-mapping>\n  <filter-name>LoginFilter</filter-name>\n\
    \  <servlet-mapping>MyServlet</servlet-mapping>\n</filter-mapping>\n\n- C.\n<filter-mapping>\n\
    \  <filter-name>LoginFilter</filter-name>\n  <url-pattern>MyServlet</url-pattern>\n\
    </filter-mapping>\n\n- D.\n<filter-mapping>\n  <filter-name>LoginFilter</filter-name>\n\
    \  <servlet>MyServlet</servlet>\n</filter-mapping>\n\n在第 295 页查看答案\n\n"
