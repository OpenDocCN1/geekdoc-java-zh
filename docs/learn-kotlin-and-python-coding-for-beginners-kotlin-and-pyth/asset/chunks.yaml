- fmt: " # Kotlin User Defined Functions\n\nIn this tutorial series, I am going to\
    \ focus on user defined functions. In Kotlin, functions are defined using `fun`\
    \ keyword.\n\n## Syntax\n\n```\nfun functionName(parameters) : returnType{\n}\n\
    ```\n\nIf you do not specify a `returnType`, it treats it as a void method. `parameters`\
    \ are optional. Parameters must be typed and multiple parameters are separated\
    \ by comma (`,`).\n\n## Syntax\n\n```\nfun functionName(param1 : type, param2:\
    \ type …. paramN:type) : returnType{\n}\n```\n\n## Example\n\n```kotlin\n// void\
    \ function with no arguments\nfun printWelcomeMessage() {\n    println(\"Welcome\
    \ buddy\")\n}\n\n// void function with one argument\nfun printWelcomeMessage(name:\
    \ String) {\n    println(\"Welcome $name\")\n}\n\n// void method with two arguments\n\
    fun printWelcomeMessage(firstName: String, lastName: String) {\n    println(\"\
    Welcome [$firstName, $lastName]\")\n}\n\n//non-void function with no arguments\n\
    fun getWelcomeMessage(): String {\n    return \"Welcome\"\n}\n\n//non-void function\
    \ with one argument\nfun getWelcomeMessage(name: String): String {\n    return\
    \ \"Welcome $name\"\n}\n\n//non-void function with two arguments\nfun getWelcomeMessage(firstName:\
    \ String, lastName: String): String {\n    return \"Welcome [$firstName, $lastName]\"\
    \n}\n```\n\n### FunctionsDemo.kt\n\n```kotlin\n// void function with no arguments\n\
    fun printWelcomeMessage () {\n    println( \"Welcome buddy\" )\n}\n\n// void function\
    \ with one argument\nfun printWelcomeMessage (name: String) {\n    println( \"\
    Welcome $name\" )\n}\n\n// void method with two arguments\nfun printWelcomeMessage\
    \ (firstName: String, lastName: String) {\n    println( \"Welcome [$firstName,\
    \ $lastName]\" )\n}\n\n//non-void function with no arguments\nfun getWelcomeMessage\
    \ (): String {\n    return \"Welcome\"\n}\n\n//non-void function with one argument\n\
    fun getWelcomeMessage (name: String): String {\n    return \"Welcome $name\"\n\
    }\n\n//non-void function with two arguments\nfun getWelcomeMessage (firstName:\
    \ String, lastName: String): String {\n    return \"Welcome [$firstName, $lastName]\"\
    \n}\n\nfun main (args: Array<String>) {\n    printWelcomeMessage()\n    printWelcomeMessage(\
    \ \"Ram\" )\n    printWelcomeMessage( \"Ram\" , \"JJTam\" )\n    var message =\
    \ getWelcomeMessage()\n    println( \"${message}\" )\n    message = getWelcomeMessage(\
    \ \"Ram\" )\n    println( \"${message}\" )\n    message = getWelcomeMessage( \"\
    Ram\" , \"JJTam\" )\n    println( \"${message}\" )\n}\n```\n\n### Output\n\n```\n\
    Welcome buddy\nWelcome Ram\nWelcome [Ram, JJTam]\nWelcome\nWelcome Ram\nWelcome\
    \ [Ram, JJTam]\n```\n\nIf your function body has only one statement, then you\
    \ can omit the braces `{}`\n\n### Example\n\n```kotlin\nfun square(x: Int) = x\
    \ * x\nfun cube(x: Int) = x * x * x\nfun printMessage() = \"Hello World\"\n```\n\
    \n### FunctionsDemo.kt\n\n```kotlin\nfun square (x: Int) = x * x\nfun cube (x:\
    \ Int) = x * x * x\nfun printMessage () = \"Hello World\"\n\nfun main (args: Array<String>)\
    \ {\n    println( \"Square of 10 is ${square(10)}\" )\n    println( \"Cube of\
    \ 10 is ${cube(10)}\" )\n    println(printMessage())\n}\n```\n\n### Output\n\n\
    ```\nSquare of 10 is 100\nCube of 10 is 1000\nHello World\n```\n\n## Kotlin: Call\
    \ functions using parameter names\n\nIn Kotlin, you can call the functions using\
    \ parameter names, this is similar to 'Keyword arguments' feature in python.\n\
    \n```kotlin\nfun printEmployee(id: String, firstName: String, lastName: String,\
    \ designation: String) {\n    println(\"\\nid : $id\\nfirstName : $firstName\\\
    nlastName : $lastName\\ndesignation : $designation\")\n}\n```\n\nIn kotlin, you\
    \ can call the function by using the parameter names.\n\n```kotlin\nprintEmployee(id\
    \ = \"1\", firstName = \"JJTam\", lastName = \"Delhi\", designation = \"engineer\"\
    )\n```\n\nOne advantage of specifying parameter names is, you can change the arguments\
    \ order while calling the function.\n\n```kotlin\nprintEmployee(designation =\
    \ \"engineer\", firstName = \"JJTam\", lastName = \"Delhi\", id = \"1\")\n```\n\
    \n### KeyWordArgsDemo.kt\n\n```kotlin\nfun printEmployee (id: String, firstName:\
    \ String, lastName: String, designation: String) {\n    println( \"\\nid : $id\\\
    nfirstName : $firstName\\nlastName : $lastName\\ndesignation : $designation\"\
    \ )\n}\n\nfun main (args: Array<String>) {\n    printEmployee( \"1\" , \"JJTam\"\
    \ , \"Delhi\" , \"Engineer\" )\n    printEmployee(id = \"1\" , firstName = \"\
    JJTam\" , lastName = \"Delhi\" , designation = \"engineer\" )\n    printEmployee(designation\
    \ = \"engineer\" , firstName = \"JJTam\" , lastName = \"Delhi\" , id = \"1\" )\n\
    }\n```\n\n### Output\n\n```\nid : 1\nfirstName : JJTam\nlastName : Delhi\ndesignation\
    \ : Engineer\n\nid : 1\nfirstName : JJTam\nlastName : Delhi\ndesignation : engineer\n\
    \nid : 1\nfirstName : JJTam\nlastName : Delhi\ndesignation : engineer\n```\n\n\
    ## Kotlin: Function default arguments\n\nWe can specify default values to function\
    \ parameters. These default values are used, when you do not specify any values\
    \ to the function arguments while calling.\n\n```kotlin\nfun readFile(offset:\
    \ Int = 0, numOfBytes: Int = 1024) {\n    println(\"Reading file from offset :\
    \ $offset, numOfBytes : $numOfBytes \")\n}\n\nreadFile()\n```\n\nSince `readFile()`\
    \ called with no arguments, `offset` and `numOfBytes` are set to default values.\n\
    \n```kotlin\nreadFile(10)\n```\n\nSince `readFile()` called with one argument\
    \ `10`, `offset` is set to `10` and `numOfBytes` is set to default value `1024`.\n\
    \n```kotlin\nreadFile(10, 300)\n```\n\nSince `readFile()` called with two arguments,\
    \ `offset` is set to `10` and `numOfBytes` is set to `1024`.\n\n### DefaultValues.kt\n\
    \n```kotlin\nfun readFile (offset: Int = 0 , numOfBytes: Int = 1024 ) {\n    println(\
    \ \"Reading file from offset : $offset, numOfBytes : $numOfBytes \" )\n}\n\nfun\
    \ main (args: Array<String>) {\n    readFile()\n    readFile( 10 )\n    readFile(\
    \ 10 , 300 )\n}\n```\n\n### Output\n\n```\nReading file from offset : 0, numOfBytes\
    \ : 1024\nReading file from offset : 10, numOfBytes : 1024\nReading file from\
    \ offset : 10, numOfBytes : 300\n```\n\nNamed arguments further enhance this feature,\
    \ when you would like to set the values to some of the arguments and remaining\
    \ take default values.\n\n```kotlin\nreadFile(numOfBytes=500)\n```\n\nSince `readFile()`\
    \ is called by specifying `numOfBytes` to `500`\n\n### FunctionsDemo.kt\n\n```kotlin\n\
    fun readFile (offset: Int = 0 , numOfBytes: Int = 1024 ) {\n    println( \"Reading\
    \ file from offset : $offset, numOfBytes : $numOfBytes \" )\n}\n\nfun main (args:\
    \ Array<String>) {\n    readFile(numOfBytes= 500 )\n}\n```\n\n### Output\n\n```\n\
    Reading file from offset : 10, numOfBytes : 1024, bufferSize :  JaysCode 500\n\
    ```\n\n## Kotlin: unit (or) void functions\n\n`Unit` returning functions are similar\
    \ to void functions in Java. If a function do not return any value, its return\
    \ type is `Unit`.\n\n### UnitDemo.kt\n\n```kotlin\nfun welcome (name: String)\
    \ : Unit {\n    println( \"Welcome $name\" )\n    return Unit // You can simply\
    \ call return\n}\n\nfun main (args: Array<String>) {\n    var returnValue = welcome(\
    \ \"Hari JJTam\" )\n    println( \"Returned value is $returnValue\" )\n}\n```\n\
    \n### Output\n\n```\nWelcome Hari JJTam\nReturned value is kotlin.Unit\n```\n\n\
    Specifying the type `Unit` and returning `Unit` from unit functions is optional.\n\
    \n### UnitDemo.kt\n\n```kotlin\nfun welcome (name: String) {\n    println( \"\
    Welcome $name\" )\n}\n\nfun main (args: Array<String>) {\n    var returnValue\
    \ = welcome( \"Hari JJTam\" )\n    println( \"Returned value is $returnValue\"\
    \ )\n}\n```\n\n## Kotlin: Single Expression functions\n\nWhen a function returns\
    \ single expression, you can omit curly与生 curly braces.\n\n### Example\n\n```kotlin\n\
    fun square(num: Int) = num * num\nfun cube(num: Int) = num * num * num\n```\n\n\
    ### FunctionDemo.kt\n\n```kotlin\nfun square (num: Int) = num * num\nfun cube\
    \ (num: Int) = num * num * num\n\nfun main (args: Array<String>) {\n    println(\
    \ \"Square of 5 is ${square(5)}\" )\n    println( \"Cube of 5 is ${cube(5)}\"\
    \ )\n}\n```\n\n### Output\n\n```\nSquare of 5 is 25\nCube of 5 is 125\n```\n\n\
    ## Kotlin: Local functions\n\nIn kotlin, you can define a function inside other\
    \ function.\n\n### Example\n\n```kotlin\nfun factorial(n: Int): Int {\n    fun\
    \ fact(n: Int): Int {\n        if (n == 0) return 1\n        return n * fact(n\
    \ - 1)\n    }\n    if (n < 0) return -1\n    else return fact(n)\n}\n```\n\nAs\
    \ you see above snippet, I defined `fact` inside the `factorial` function. `fact`\
    \ is the local function, whereas `factorial` is the outer function.\n\n### FunctionDemo.kt\n\
    \n```kotlin\nfun factorial (n: Int): Int {\n    fun fact (n: Int): Int {\n   \
    \     ifOxford if (n == 0 ) return 1\n        return n * fact(n - 1 )\n    }\n\
    \    if (n < 0 ) return - 1\n    else return fact (n)\n}\n\nfun main (args: Array<String>)\
    \ {\n    var factorialOf5 = factorial( 5 )\n    println( \"factorial Of 5 : $factorialOf5\"\
    \ )\n}\n```\n\n### Output\n\n```\nfactorial Of 5 : 120\n```\n\nLocal functions\
    \ can access the data defined in outer functions.\n\n## Kotlin: Member functions\n\
    \nA function that is defined inside a class (or) object is called member function.\n\
    \n### Example\n\n```kotlin\nclass Number {\n    fun isEven(num: Int): Boolean\
    \ {\n        return num % 2 == 0\n    }\n}\n```\n\nIn above snippet, `isEven`\
    \ is a member function.\n\n### FunctionDemo.kt\n\n```kotlin\nclass Number {\n\
    \    fun isEven (num: Int): Boolean {\n        return num % 2 == 0\n    }\n}\n\
    \nfun main (args: Array<String>) {\n    var obj = Number()\n    var is5Even =\
    \ obj.isEven( 5 )\n    var is6Even = obj.isEven( 6 )\n    println( \"Is 5 Even\
    \ : $is5Even\" )\n    println( \"Is 6 Even : $is6Even\" )\n}\n```\n\n### Output\n\
    \n```\nIs 5 Even : false\nIs 6 Even : true\n```\n\n---\n\n# Learn Python Quickly\n\
    \n## Coding for Beginners with Hands on Projects\n\nBy J J Tam\n\nWell it is almost\
    \ 5 years I started my IT career, I love to work in Java, and explore open source\
    \ packages. Now a day I felt bored to work in Java, so want to learn new language,\
    \ one of my friend suggested me to learn python. Immediately I thought, why should\
    \ I learn python?\n\nFollowing are some of the reasons that forced me to learn\
    \ python…(First and best reason is I am fed up in working with same language for\
    \ 5 years……….:))\n\na. Python is open source and is available on Windows, Mac\
    \ OS X, and Unix operating systems. You can download and work with python for\
    \ free.\n\nb. Python is fun to experiment and easy to learn. Python provides interpreter\
    \ that can be used interactively, which makes it easy to experiment with features\
    \ of the language.\n\nc. You can extend the python interpreter with new functions\
    \ and data types implemented in C or C++\n\nd. Python improves developer productivity\
    \ many times as compared to C, C++ and Java.\n\ne. No need to compile python program,\
    \ it runs immediately after development.\n\nf. We can easily port python project\
    \ from one platform to another (Of course Java also provides this feature)\n\n\
    g. Rich in built library. Many third party open source libraries are available\
    \ for logging, web development (Django — the popular open source web application\
    \ framework written in Python), networking, database access etc.\n\nh. Python\
    \ has very great community, whatever the problem you faced in python, you will\
    \ get quick help.\n\n## Install python on MAC OS\n\n**Step 1:** Download python\
    \ software from following location. I downloaded pkg file to install on mac os.\n\
    \n`https://www.python.org/downloads/`\n\n**Step 2:** Click the pkg file.\n\n![](Image00015.jpg)\n\
    \nPress Continue.\n\n![](Image00016.jpg)\n\nPress Continue.\n\n![](Image00017.jpg)\n\
    \nAccept license agreement and press Continue.\n\n![](Image00018.jpg)\n\nYou can\
    \ change the installation location use the button `Change Install Location`, and\
    \ press the button Install.\n\n![](Image00019.jpg)\n\nOnce installation is successful,\
    \ you will get following screen.\n\n![](Image00020.jpg)\n\nOnce installation is\
    \ successful, open terminal and type `python3` (Since I installed python 3.5).\n\
    \n```\n$ python3\nPython 3.5 . 0 (v3. 5.0 :374 f501f4567, Sep 12 2015 , 11 :00\
    \ :19 )\n[GCC 4.2 . 1 (Apple Inc. build 5666 ) (dot 3 )] on darwin\nType \"help\"\
    \ , \"copyright\" , \"credits\" or \"license\" for more information.\n>>> quit()\n\
    ```\n\nUse `quit()` to exit from python prompt.\n\n### Location of python3\n\n\
    ```\n$ which python3\n/Library/Frameworks/Python.framework/Versions/3.5/bin/python3\n\
    $ which python3.5\n/Library/Frameworks/Python.framework/Versions/3.5/bin/python3.5\n\
    ```\n\nOn windows machines python usually placed at `C:\\Python35`.\n\n## Python:\
    \ Hello World program\n\nOpen any text editor and copy the statement `print ('hello\
    \ world')` and save the file name as `hello.py`.\n\n### hello.py\n\n```python\n\
    print ('hello world')\n```\n\nOpen terminal (or) command prompt, use the command\
    \ `python3 hello.py` to run the file `hello.py`. You will get output like below\n\
    \n```\n$ python3 hello.py\nhello world\n```\n\n### What happens when you instruct\
    \ python to run your script?\n\nPython first compiles your source code to byte\
    \ code and sends it to python virtual machine (PVM). Byte code is the platform\
    \ independent representation of your source code. PVM reads the byte code one\
    \ by one and execute them.\n\n![](Image00021.jpg)\n\n**Note:**"
