  trans: " \n # Kotlin：数字\n\n```kotlin\nfun main(args: Array<String>) {\n    var doubleVar:\
    \ Double = 1.23\n    var floatVar: Float = 1.23f\n    var longVar: Long = 123\n\
    \    var intVar: Int = 123\n    var shortVar: Short = 123\n    var byteVar: Byte\
    \ = 123\n    println(\"doubleVar : ${doubleVar}\")\n    println(\"doubleVar :\
    \ ${floatVar}\")\n    println(\"longVar : ${longVar}\")\n    println(\"intVar\
    \ : ${intVar}\")\n    println(\"shortVar : ${shortVar}\")\n    println(\"byteVar\
    \ : ${byteVar}\")\n}\n```\n\n**输出**\n\n```\ndoubleVar : 1.23\ndoubleVar : 1.23\n\
    longVar : 123\nintVar : 123\nshortVar : 123\nbyteVar : 123\n```\n\n## 十六进制、八进制和二进制字面量表示法\n\
    \nKotlin 支持十六进制和二进制表示法，但不支持八进制表示法。十六进制数通过前缀 `0x` 表示。\n\n```kotlin\nfun main(args:\
    \ Array<String>) {\n    var hexaNum: Int = 0x123\n    var binaryNum: Int = 0b10101010\n\
    \    println(\"hexaNum : ${hexaNum}\")\n    println(\"binaryNum : ${binaryNum}\"\
    )\n}\n```\n\n**输出**\n\n```\nhexaNum : 291\nbinaryNum : 170\n```\n\n你也可以使用 `_`\
    \ 来表示数字。\n\n```kotlin\nfun main(args: Array<String>) {\n    var ten = 10\n   \
    \ var hundred = 100\n    var thousand = 1000\n    var tenThousand = 10_000\n \
    \   var oneLaksh = 100_000\n    var tenLaksh = 1_000_000\n    println(\"ten :\
    \ ${ten}\")\n    println(\"hundred : ${hundred}\")\n    println(\"thousand : ${thousand}\"\
    )\n    println(\"tenThousand : ${tenThousand}\")\n    println(\"oneLaksh : ${oneLaksh}\"\
    )\n    println(\"tenLaksh : ${tenLaksh}\")\n}\n```\n\n**输出**\n\n```\nten : 10\n\
    hundred : 100\nthousand : 1000\ntenThousand : 10000\noneLaksh : 100000\ntenLaksh\
    \ : 1000000\n```\n\n# Kotlin：字符\n\n`Char` 关键字用于定义单个字符。字符用单引号括起来。\n\n示例\n\n```kotlin\n\
    var myChar: Char = 'a'\n```\n\n```kotlin\nfun main(args: Array<String>) {\n  \
    \  var myChar: Char = 'a'\n    println(\"Value of myChar is : ${myChar}\")\n}\n\
    ```\n\n**输出**\n\n```\nValue of myChar is : a\n```\n\nJava 支持的所有转义序列在 Kotlin 中同样支持。\n\
    \n## 将字符转换为整数\n\n`Char` 类型提供了 `toInt()` 方法，用于将字符转换为整数。\n\n```kotlin\nfun main(args:\
    \ Array<String>) {\n    var myChar: Char = 'a'\n    println(\"Value of myChar\
    \ is : ${myChar}\")\n    println(\"Value of myChar in int is : ${myChar.toInt()}\"\
    )\n}\n```\n\n**输出**\n\n```\nValue of myChar is : a\nValue of myChar in int is\
    \ : 97\n```\n\n# Kotlin：布尔值\n\n`Boolean` 类型用于表示 `true`、`false` 状态。\n\n```kotlin\n\
    fun main(args: Array<String>) {\n    var trueState: Boolean = true\n    var falseState:\
    \ Boolean = false\n    println(\"Value of trueState is : ${trueState}\")\n   \
    \ println(\"Value of falseState is : ${falseState}\")\n}\n```\n\n**输出**\n\n```\n\
    Value of trueState is : true\nValue of falseState is : false\n```\n\n# Kotlin：字符串\n\
    \n`String` 是字符的集合，用双引号括起来。Kotlin 中的字符串通过关键字 `String` 定义，且这些字符串是*不可变的*。\n\n示例\n\
    \n```kotlin\nvar message: String = \"Good Morning\"\n```\n\n```kotlin\nfun main(args:\
    \ Array<String>) {\n    var message: String = \"Good Morning\"\n    println(message)\n\
    }\n```\n\n**输出**\n\n```\nGood Morning\n```\n\nJava 支持的所有转义序列（`\\n`、`\\t`、`\\a`\
    \ 等）在 Kotlin 中同样支持。\n\n示例\n\n```kotlin\nvar message: String = \"Good Morning\\\
    nHow are you\\nsee you soon\"\n```\n\n```kotlin\nfun main(args: Array<String>)\
    \ {\n    var message: String = \"Good Morning\\nHow are you\\nsee you soon\"\n\
    \    println(message)\n}\n```\n\n**输出**\n\n```\nGood Morning\nHow are you\nsee\
    \ you soon\n```\n\n如果你不想执行转义，则将字符串嵌入 `\"\"\"`（三引号）中。\n\n```kotlin\nfun main(args:\
    \ Array<String>) {\n    var message: String = \"\"\"Good Morning\\nHow are you\\\
    nsee you soon\nAfter two lines\\bgood bye\"\"\"\n    println(message)\n}\n```\n\
    \n**输出**\n\n```\nGood Morning\\nHow are you\\nsee you soon\nAfter two lines\\\
    bgood bye\n```\n\n## 字符串模板表达式\n\n通过使用模板表达式，你可以在字符串中计算表达式。模板表达式以 `$` 符号开头，后跟一个名称。\n\
    \n示例\n\n```kotlin\nvar a = 10\nprintln(\"Value of a is : $a\")\n```\n\n任意表达式用花括号括起来\n\
    \n```kotlin\nvar str = \"Hello World\"\nprintln(\"$str length is ${str.length}\"\
    )\n```\n\n```kotlin\nfun main(args: Array<String>) {\n    var a = 10\n    var\
    \ str = \"Hello World\"\n    println(\"Value of a is : $a\")\n    println(\"$str\
    \ length is ${str.length}\")\n}\n```\n\n**输出**\n\n```\nValue of a is : 10\nHello\
    \ World length is 11\n```\n\n# Kotlin：数组\n\n`Array` 表示相同类型元素的集合。Kotlin 提供了 `Array`\
    \ 类来表示数组。\n\n通过使用库函数 `arrayOf`，你可以定义一个数组。\n\n示例\n\n```kotlin\nval numbers: Array<Int>\
    \ = arrayOf(10, 20, 30, 40, 50)\n```\n\n```kotlin\nfun main(args: Array<String>)\
    \ {\n    val numbers: Array<Int> = arrayOf(10, 20, 30, 40, 50)\n    for (element\
    \ in numbers) {\n        println(element)\n    }\n}\n```\n\n**输出**\n\n```\n10\n\
    20\n30\n40\n50\n```\n\nKotlin 提供了以下库函数来定义基本类型的数组。\n\n- `byteArrayOf()`\n- `shortArrayOf()`\n\
    - `intArrayOf()`\n- `longArrayOf()`\n- `floatArrayOf()`\n- `doubleArrayOf()`\n\
    - `CharArray()`\n- `BooleanArray()`\n\n```kotlin\nfun main(args: Array<String>)\
    \ {\n    var a: ByteArray = byteArrayOf(1, 2, 3)\n    val b: ShortArray = shortArrayOf(1,\
    \ 2, 3)\n    val c: IntArray = intArrayOf(1, 2, 3)\n    var d: LongArray = longArrayOf(1L,\
    \ 2L, 3L)\n    val e: FloatArray = floatArrayOf(1f, 2f, 3f)\n    val f: DoubleArray\
    \ = doubleArrayOf(1.1, 2.2, 3.3)\n    var g: CharArray = charArrayOf('a', 'b',\
    \ 'c')\n    var h: BooleanArray = booleanArrayOf(true, false, true)\n    println(\"\
    Elements of Byte array are : \")\n    for (ele in a) {\n        println(ele)\n\
    \    }\n    println(\"\\n\\nElements of Short array are : \")\n    for (ele in\
    \ b) {\n        println(ele)\n    }\n    println(\"\\n\\nElements of Int array\
    \ are : \")\n    for (ele in c) {\n        println(ele)\n    }\n    println(\"\
    \\n\\nElements of Long array are : \")\n    for (ele in d) {\n        println(ele)\n\
    \    }\n    println(\"\\n\\nElements of Float array are : \")\n    for (ele in\
    \ e) {\n        println(ele)\n    }\n    println(\"\\n\\nElements of Double array\
    \ are : \")\n    for (ele in f) {\n        println(ele)\n    }\n    println(\"\
    \\n\\nElements of Char array are : \")\n    for (ele in g) {\n        println(ele)\n\
    \    }\n    println(\"\\n\\nElements of Boolean array are : \")\n    for (ele\
    \ in h) {\n        println(ele)\n    }\n}\n```\n\n**输出**\n\n```\nElements of Byte\
    \ array are :\n1\n2\n3\n\nElements of Short array are :\n1\n2\n3\n\nElements of\
    \ Int array are :\n1\n2\n3\n\nElements of Long array are :\n1\n2\n3\n\nElements\
    \ of Float array are :\n1.0\n2.0\n3.0\n\nElements of Double array are :\n1.1\n\
    2.2\n3.3\n\nElements of Char array are :\na\nb\nc\n\nElements of Boolean array\
    \ are :\ntrue\nfalse\ntrue\n```\n\n## 定义空值数组\n\nKotlin 提供了 `arrayOfNulls` 库函数来定义空值数组。\n\
    \n```kotlin\nfun main(args: Array<String>) {\n    var a: Array<Int?> = arrayOfNulls(5)\n\
    \    for (element in a) {\n        println(element)\n    }\n}\n```\n\n**输出**\n\
    \n```\nnull\nnull\nnull\nnull\nnull\n```\n\n## 使用工厂函数定义数组\n\nKotlin 提供了一个工厂函数，它接受大小和一个函数\
    \ `f` 作为参数来定义数组。函数 `f` 用于为数组提供初始值。\n\n```kotlin\nvar squares = Array(5, { i ->\
    \ i * i })\n```\n\n上面的语句定义了一个大小为 5 的数组 `squares`，并初始化为 `{1, 4, 9, 16, 25}`\n\n\
    ```kotlin\nfun main(args: Array<String>) {\n    var squares = Array(5, { i ->\
    \ i * i })\n    var cubes = Array(5, { i -> i * i * i })\n    println(\"Elements\
    \ in squares array : \")\n    for (ele in squares) {\n        println(ele)\n \
    \   }\n    println(\"\\nElements in cubes array : \")\n    for (ele in cubes)\
    \ {\n        println(ele)\n    }\n}\n```\n\n**输出**\n\n```\nElements in squares\
    \ array :\n0\n1\n4\n9\n16\n\nElements in cubes array :\n0\n1\n8\n27\n64\n```\n\
    \n## 打印数组元素\n\n在我之前的文章中，我解释了什么是数组以及如何在 kotlin 中定义它。在这篇文章中，我将展示如何打印数组的元素。\n\n###\
    \ 使用 For 循环打印数组元素\n\n```kotlin\nfun main(args: Array<String>) {\n    var arr:\
    \ Array<Int> = arrayOf(1, 2, 3, 4)\n    for (ele in arr) {\n        println(ele)\n\
    \    }\n}\n```\n\n**输出**\n\n```\n1\n2\n3\n4\n```\n\n### 使用 `Arrays.toString` 方法打印数组元素\n\
    \n```kotlin\nimport java.util.Arrays\n\nfun main(args: Array<String>) {\n    var\
    \ arr: Array<Int> = arrayOf(1, 2, 3, 4)\n    println(Arrays.toString(arr))\n}\n\
    ```\n\n**输出**\n\n```\n[1, 2, 3, 4]\n```\n\n### 使用 `array.indices` 打印数组元素\n\n```kotlin\n\
    fun main(args: Array<String>) {\n    var arr: Array<Int> = arrayOf(2, 3, 5, 7)\n\
    \    for (index in arr.indices) {\n        println(arr[index])\n    }\n}\n```\n\
    \n**输出**\n\n```\n2\n3\n5\n7\n```\n\n### 使用 `array.withIndex` 打印数组元素\n\n```kotlin\n\
    fun main(args: Array<String>) {\n    var arr: Array<Int> = arrayOf(2, 3, 5, 7)\n\
    \    for ((index, value) in arr.withIndex()) {\n        println(\"index : $index,\
    \ value : $value\")\n    }\n}\n```\n\n**输出**\n\n```\nindex : 0, value : 2\nindex\
    \ : 1, value : 3\nindex : 2, value : 5\nindex : 3, value : 7\n```\n\n### 使用 While\
    \ 循环打印数组元素\n\n```kotlin\nfun main(args: Array<String>) {\n    var arr: Array<Int>\
    \ = arrayOf(2, 3, 5, 7)\n    var sizeOfTheArray = arr.size;\n    var index: Int\
    \ = 0;\n    while (index < sizeOfTheArray) {\n        println(\"index : $index,\
    \ value : ${arr[index]}\")\n        index++\n    }\n}\n```\n\n**输出**\n\n```\n\
    index : 0, value : 2\nindex : 1, value : 3\nindex : 2, value : 5\nindex : 3, value\
    \ : 7\n```\n\n# Kotlin：位运算符\n\n下表总结了 Kotlin 支持的位运算符。\n"
- fmt: " | Operator | Description | Java Equivalant |\n| --- | --- | --- |\n| `shl`\
    \ | Perform signed shift left | `<<` |\n| `shr` | Perform signed shift right |\
    \ `>>` |\n| `ushr` | Perform unsigned shift right | `>>>` |\n| `and` | Bitwise\
    \ and | `&` |\n| `or` | Bitwise or | `&#124;` |\n| `xor` | Bitwise X-OR | `^`\
    \ |\n| `inv()` | Bitwise inversion | `~` |\n\nOther than `inv()`, all other operators\
    \ are used in infix form. Ex: `var1 shl var2`, `var1 or var2`\n\n## 1. `shl`:\
    \ Perform signed shift left\n\nLeft shift operator shifts all the bits to one\
    \ bit left, i.e, it doubles the value.\n\nSyntax:\n```\nvariable shl n\n```\n\
    left shift the variable by 'n' number of times. `Variable shl n` is equals to\
    \ `variable = variable * 2 power n`\n```\nvar1 shl 1 = 2 * 2 power 1 = 4\nvar1\
    \ shl 2 = 2 * 2 power 2 = 8\nvar1 shl 9 = 2 * 2 power 9 = 1024\n```\n\nLeftShift.kt\n\
    ```kotlin\nfun main (args: Array<String>) {\n  var var1: Int = 2\n  var res1 =\
    \ var1 shl 1\n  var res2 = var1 shl 2\n  var res3 = var1 shl 9\n  println( \"\
    res1 : ${res1}\" )\n  println( \"res2 : ${res2}\" )\n  println( \"res3 : ${res3}\"\
    \ )\n}\n```\n\nOutput\n```\nres1 : 4\nres2 : 8\nres3 : 1024\n```\n\n## 2. `shr`:\
    \ Perform signed shift right\n\nRight shift operator shifts all the bits to one\
    \ bit right, i.e, it half (divide by 2) the value\n\nSyntax:\n```\nvariable shr\
    \ n\n```\nright shift the variable by 'n' number of times. `Variable shr n` is\
    \ equals to `variable = variable / 2 power n`\n```\nvar a : Int = 128\na shr 1\
    \ = 128 / (2 power 1) = 64\na shr 2 = 128 / (2 power 2) = 32\n```\n\nRightShift.kt\n\
    ```kotlin\nfun main (args: Array<String>) {\n  var a: Int = 128\n  var res1 =\
    \ a shr 1\n  var res2 = a shr 2\n  var res3 = a shr 3\n  println( \"res1 : ${res1}\"\
    \ )\n  println( \"res2 : ${res2}\" )\n  println( \"res3 : ${res3}\" )\n}\n```\n\
    \nOutput\n```\nres1 : 64\nres2 : 32\nres3 : 16\n```\n\n## 3. `ushr`: Unsigned\
    \ right shift\n\nShifts all the bits to one bit right, and make the left most\
    \ bit to zero\n\nSyntax\n```\nVariable ushr n\n```\n\nUnsignedRightShift.kt\n\
    ```kotlin\nfun main (args: Array<String>) {\n  var a: Int = - 128\n  var res1\
    \ = a ushr 1\n  println( \"res1 : ${res1}\" )\n}\n```\n\nOutput\n```\nres1 : 2147483584\n\
    ```\n\nExplanation\n\n-128 in 2's complement form is\n```\n11111111 11111111 11111111\
    \ 10000000\n```\n`>>>` shifts the one bit right and replace leftmost bit by zero\n\
    \nso (`-128 ushr 1`) is like below sequence\n```\n01111111 11111111 11111111 11000000\n\
    ```\n\n## 4. Bit Wise `and`, `or`, `xor`\n\n| Bit1 | Bit2 | and | or |\n| ---\
    \ | --- | --- | --- |\n| 0 | 0 | 0 | 0 |\n| 0 | 1 | 0 | 1 |\n| 1 | 0 | 0 | 1 |\n\
    | 1 | 1 | 1 | 1 |\n\nHelloWorld.kt\n```kotlin\nfun main (args: Array<String>)\
    \ {\n  var a: Int = 8\n  var b: Int = 9\n  println( \"a and b is ${a and b} \"\
    \ )\n  println( \"a or b is ${a or b} \" )\n  println( \"a xor b is ${a xor b}\"\
    \ )\n}\n```\n\nOutput\n```\na and b is 8\na or b is 9\na xor b is 1\n```\n\nExplanation\n\
    ```\na   = 0000 1000\nb   = 0000 1001\na&b = 0000 1000\n\na   = 0000 1000\nb \
    \  = 0000 1001\na|b = 0000 10001\n\na   = 0000 1000\nb   = 0000 1001\na^b = 0000\
    \ 0001\n```\n\nNote: Bit wise operators are applicable only to integer values\
    \ like `byte`, `short` etc., these are not applicable to `float`, `double`, `Boolean`.\n\
    \n## 5. `inv()`: Bitwise inversion\n\nInversion operator change the bit value\
    \ to zero, if it is one and change the bit value to one if it is zero.\n\nExample\n\
    ```\nvar a : Int = 8\n```\n`a` in binary format is\n```\n0 0 0 0 0 1 1 1\n```\n\
    `a.inv()` in binary format is\n```\n1 1 1 1 1 0 0 0\n```\n\nInverse.kt\n```kotlin\n\
    fun main (args: Array<String>) {\n  var a: Int = 8\n  println( \"Value of a is\
    \ : ${a}\" )\n  println( \"inversion of a is : ${a.inv()}\" )\n}\n```\n\nOutput\n\
    ```\nValue of a is : 8\ninversion of a is : -9\n```\n\n# Kotlin: Logical Operators\n\
    \nKotlin supports logical operators (also called as Boolean operators), to combine\
    \ multiple conditions.\n\n- `||` – lazy disjunction\n- `&&` – lazy conjunction\n\
    - `!` - negation\n\n## 1. `||` – lazy disjunction\n\n`operand1 || operand2`: It\
    \ returns true, if any of the operand evaluates to true, otherwise returns false.\n\
    \n| Operand1 | Operand2 | Evaluates To |\n| --- | --- | --- |\n| False | false\
    \ | false |\n| False | true | true |\n| True | false | true |\n| True | true |\
    \ true |\n\nBooleanOr.kt\n```kotlin\nfun main (args: Array<String>) {\n  var operand1:\
    \ Boolean = false\n  var operand2: Boolean = false\n  println( \"${operand1} ||\
    \ ${operand2}: ${(operand1 || operand2)}\" )\n  operand1 = false\n  operand2 =\
    \ true\n  println( \"${operand1} || ${operand2}: ${(operand1 || operand2)}\" )\n\
    \  operand1 = true\n  operand2 = false\n  println( \"${operand1} || ${operand2}:\
    \ ${(operand1 || operand2)}\" )\n  operand1 = true\n  operand2 = true\n  println(\
    \ \"${operand1} || ${operand2}: ${(operand1 || operand2)}\" )\n}\n```\n\nOutput\n\
    ```\nfalse || false : false\nfalse || true : true\ntrue || false : true\ntrue\
    \ || true : true\n```\n\nWhy `||` is called as Lazy Disjunciton?\n\nIf the first\
    \ expression evaluates to true, then Kotlin won't evaluates the entire expression.\
    \ So Logical OR is called short circuit OR (or) Lazy disjunction operator.\n\n\
    LazyDisjunciton.kt\n```kotlin\nfun main (args: Array<String>) {\n  var a : Int\
    \ = 10\n  var b : Int = 21\n  if ((a < b) || (a++ < b)) {\n    System. out .println(\
    \ \"This statement evaluated\" );\n  }\n  System. out .println( \"a is not incremented\
    \ \" + a);\n  if ((a > b) || (a++ > b)) {\n    System. out .println( \"This statement\
    \ is evaluated\" );\n  }\n  System. out .println( \"a is incremented \" + a);\n\
    }\n```\n\nOutput\n```\nThis statement evaluated\na is not incremented 10\na is\
    \ incremented 11\n```\n\n## 2. `&&` – lazy conjunction\n\n`operand1 && operand2`:\
    \ It returns true, if both the operand evaluates to true, otherwise returns false.\n\
    \n| Operand1 | Operand2 | Evaluates To |\n| --- | --- | --- |\n| False | false\
    \ | false |\n| False | true | false |\n| True | false | false |\n| True | true\
    \ | true |\n\nBooleanAnd.kt\n```kotlin\nfun main (args: Array<String>) {\n  var\
    \ operand1: Boolean = false\n  var operand2: Boolean = false\n  println( \"${operand1}\
    \ && ${operand2}: ${(operand1 && operand2)}\" )\n  operand1 = false\n  operand2\
    \ = true\n  println( \"${operand1} && ${operand2}: ${(operand1 && operand2)}\"\
    \ )\n  operand1 = true\n  operand2 = false\n  println( \"${operand1} && ${operand2}:\
    \ ${(operand1 && operand2)}\" )\n  operand1 = true\n  operand2 = true\n  println(\
    \ \"${operand1} && ${operand2}: ${(operand1 && operand2)}\" )\n}\n```\n\nOutput\n\
    ```\nfalse && false: false\nfalse && true: false\ntrue && false: false\ntrue &&\
    \ true: true\n```\n\nWhy `&&` is called Lazy conjunction operator?\n\nIf the first\
    \ statement in the expression evaluates to false, then kotlin won't evaluate the\
    \ entire expression. So, Logical AND is called short circuit AND.\n\nLazyConjunction.kt\n\
    ```kotlin\nfun main (args: Array<String>) {\n  var a: Int = 10\n  var b: Int =\
    \ 21\n  if ((a > b) && (a++ > b)) {\n    System. out .println( \"This statement\
    \ not evaluated\" );\n  }\n  System. out .println( \"a is not incremented \" +\
    \ a);\n  if ((a < b) && (a++ < b)) {\n    System. out .println( \"This statement\
    \ is evaluated\" );\n  }\n  System. out .println( \"a is incremented \" + a);\n\
    }\n```\n\nOutput\n```\na is not incremented 10\nThis statement is evaluated\n\
    a is incremented 11\n```\n\n## 3. Logical not (`!`) Operator\n\nIf the operand\
    \ is false, `!` Operator evaluates it to true\n\nIf the operand is true, `!` Operator\
    \ evaluates it to false\n\n| Operand | Evaluates To |\n| --- | --- |\n| False\
    \ | true |\n| True | false |\n\nLogicalNot.kt\n```kotlin\nfun main (args: Array<String>)\
    \ {\n  var operand1: Boolean = false\n  var operand2: Boolean = true\n  println(\
    \ \"operand1 : ${operand1}\" )\n  println( \"!operand1 : ${!operand1}\" )\n  println(\
    \ \"operand2 : ${operand2}\" )\n  println( \"!operand2 : ${!operand2}\" )\n}\n\
    ```\n\nOutput\n```\noperand1 : false\n!operand1 : true\noperand2 : true\n!operand2\
    \ : false\n```\n\n# Kotlin: `===` vs `==`\n\nKotlin supports two types of equality.\n\
    \n- Referential Equality\n- Structural Equality"
