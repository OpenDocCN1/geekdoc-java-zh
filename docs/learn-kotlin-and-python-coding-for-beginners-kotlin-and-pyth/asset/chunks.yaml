    \ 'PTR', 'Nil')\n(-1, 'Nil', 'Nil')\n```\n\n## Python：类变量与实例变量\n\n类变量与类相关联，对该类的所有实例（对象）都可用；而实例变量则是对象独有的，用于唯一标识该对象。\n\
