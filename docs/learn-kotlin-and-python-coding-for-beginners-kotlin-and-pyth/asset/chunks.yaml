    >>>\n>>>\n>>> len(numbers)\n3\n>>> len(numbers[0])\n4\n>>> len(numbers[1])\n4\n\
    >>> len(numbers[2])\n5\n>>>\n>>> numbers[0][1] = 9\n>>> numbers[1][1:4] = [10,\
    \ 12, 14]\n>>> numbers\n[[1, 9, 5, 7], [2, 10, 12, 14], [2, 3, 5, 7, 11]]\n```\n\
    \n## Python：list extend：追加给定列表的元素\n\nPython 提供了 `extend` 方法，用于追加给定列表中的所有项目。\n\n\
    `test.py`\n\n```\nevenNumbers = [2, 4, 6]\noddNumbers = [1, 3, 5]\nnumbers = []\n\
    numbers.extend(evenNumbers)\nprint(numbers)\nnumbers.extend(oddNumbers)\nprint(numbers)\n\
    ```\n\n```\n$ python3 test.py\n[2, 4, 6]\n[2, 4, 6, 1, 3, 5]\n```\n\n## Python：insert：在指定位置插入元素\n\
    \n列表提供了 `insert` 方法，用于在指定位置插入元素。\n\n### 语法\n\n`list.insert(i, x)`\n\n- `list.insert(0,\
    \ x)`：在列表开头插入元素 x。\n- `list.insert(len(list), x)`：在列表末尾插入元素 x。\n- `list.insert(2,\
    \ x)`：在第 2 个位置插入元素 x。\n\n`test.py`\n\n```\nlist = [2, 4, 6]\nprint(list)\nlist.insert(0,\
    \ -2)\nprint(list)\nlist.insert(len(list), 8)\nprint(list)\nlist.insert(2, 3)\n\
    print(list)\n```\n\n```\n$ python3 test.py\n[2, 4, 6]\n[-2, 2, 4, 6]\n[-2, 2,\
    \ 4, 6, 8]\n[-2, 2, 3, 4, 6, 8]\n```\n\n## Python：list remove：移除元素\n\n列表提供了 `remove`\
    \ 方法，用于从中移除元素 `x`。\n\n### 语法\n\n`list.remove(x)`\n\n`remove` 方法移除列表中值为 x 的第一个项目。\n\
    \n`test.py`\n\n```\nlist = [2, 4, 6, 6, 4, 2]\nprint(list)\nlist.remove(6)\nprint(list)\n\
    ```\n\n```\n$ python3 test.py\n[2, 4, 6, 6, 4, 2]\n[2, 4, 6, 4, 2]\n```\n\n如果元素不在列表中，`remove`\
    \ 方法会抛出错误。\n\n`test.py`\n\n```\nlist = [2, 4, 6, 6, 4, 2]\nprint(list)\nlist.remove(60)\n\
    print(list)\n```\n\n```\n$ python3 test.py\n[2, 4, 6, 6, 4, 2]\nTraceback (most\
    \ recent call last):\n  File \"test.py\", line 4, in <module>\n    list.remove(60)\n\
    ValueError: list.remove(x): x not in list\n```\n\n## Python：list：pop：移除列表中的最后一个元素\n\
    \n`list.pop([i])`\n\n不带参数的 `pop` 方法移除列表中的最后一个元素。如果指定位置 `i`，则移除位置 `i` 处的元素并返回它。\n\
    \n`test.py`\n\n```\nlist = [2, 4, 6, 6, 4, 2]\nprint(list)\nprint(\"Removing last\
    \ element \", list.pop())\nprint(list)\nprint(\"Removing element at index 2 \"\
    , list.pop(2))\nprint(list)\n```\n\n```\n$ python3 test.py\n[2, 4, 6, 6, 4, 2]\n\
    Removing last element  2\n[2, 4, 6, 6, 4]\nRemoving element at index 2  6\n[2,\
    \ 4, 6, 4]\n```\n\n## Python：list：清除列表中的所有元素\n\n列表提供了 `clear` 方法，用于清除列表中的所有元素。\n\
    \n`test.py`\n\n```\nlist = [2, 4, 6, 6, 4, 2]\nprint(list)\nlist.clear()\nprint(list)\n\
    ```\n\n```\n$ python3 test.py\n[2, 4, 6, 6, 4, 2]\n[]\n```\n\n## Python：list：index：获取元素的索引\n\
    \n`list.index(x)`\n\n`list` 提供了 index 方法，返回值为 x 的第一个项目的索引。\n\n`test.py`\n\n```\n\
    list = [2, 4, 6, 6, 4, 2]\nprint(list)\nprint(\"index of 2 is \", list.index(2))\n\
    print(\"index of 4 is \", list.index(4))\nprint(\"index of 6 is \", list.index(6))\n\
    ```\n\n```\n$ python3 test.py\n[2, 4, 6, 6, 4, 2]\nindex of 2 is  0\nindex of\
    \ 4 is  1\nindex of 6 is  2\n```\n\n如果元素不在列表中，会抛出错误。\n\n`test.py`\n\n```\nlist\
    \ = [2, 4, 6, 6, 4, 2]\nprint(list)\nprint(\"index of 20 is \", list.index(20))\n\
    ```\n\n```\n$ python3 test.py\n[2, 4, 6, 6, 4, 2]\nTraceback (most recent call\
    \ last):\n  File \"test.py\", line 4, in <module>\n    print(\"index of 20 is\
    \ \", list.index(20))\nValueError: 20 is not in list\n```\n\n## Python：list：对列表元素进行排序\n\
    \n`list` 提供了 sort 方法，用于对列表元素进行排序。默认情况下，sort 方法按升序对元素进行排序。要按降序对元素进行排序，请传递 `reverse=True`\
    \ 参数。\n\n`test.py`\n\n```\nlist = [12, 5, 32, 43, 21, 356]\nprint(list)\nlist.sort()\n\
    print(list)\nlist.sort(reverse=True)\nprint(list)\n```\n\n```\n$ python3 test.py\n\
    [12, 5, 32, 43, 21, 356]\n[5, 12, 21, 32, 43, 356]\n[356, 43, 32, 21, 12, 5]\n\
    ```\n\n## Python：count：统计元素出现的次数\n\n列表提供 count 方法，用于统计元素在结果中出现的次数。\n\n`test.py`\n\
    \n```\nlist = [12, 5, 32, 43, 21, 356, 5, 21]\nprint(list)\nprint(\"5 appears\
    \ \", list.count(5), \" times \")\nprint(\"12 appears \", list.count(12), \" times\
    \ \")\n```\n\n```\n$ python3 test.py\n[12, 5, 32, 43, 21, 356, 5, 21]\n5 appears\
    \  2  times\n12 appears  1  times\n```\n\n## Python：list：反转列表元素\n\n列表提供了 reverse\
    \ 方法，用于反转列表元素。\n\n`test.py`\n\n```\nlist = [12, 5, 32, 43, 21, 356, 5, 21]\nprint(list)\n\
    list.reverse()\nprint(list)\n```\n\n```\n$ python3 test.py\n[12, 5, 32, 43, 21,\
    \ 356, 5, 21]\n[21, 5, 356, 21, 43, 32, 5, 12]\n```\n"
- fmt: " ```python\n[21, 5, 356, 21, 43, 32, 5, 12]\n```\n\n## Python: list: Copy\
    \ elements of list\n\n`List` provides `copy` method, to get a shallow copy of\
    \ the list.\n\n`test.py`\n```\nlist = [12, 5, 32, 43, 21, 356, 5, 21]\nlist1 =\
    \ list.copy()\nprint(list)\nprint(list1)\nlist1.append(12345)\nprint(list)\nprint(list1)\n\
    ```\n\n```\n$ python3 test.py\n[12, 5, 32, 43, 21, 356, 5, 21]\n[12, 5, 32, 43,\
    \ 21, 356, 5, 21]\n[12, 5, 32, 43, 21, 356, 5, 21]\n[12, 5, 32, 43, 21, 356, 5,\
    \ 21, 12345]\n```\n\n## Python: list: del: delete elements\n\nBy using `del` statement,\
    \ you can remove an element from a list using index.\n\n`test.py`\n```\nlist =\
    \ [12, 5, 32, 43, 21, 356, 5, 21]\nprint(list)\ndel list[0]\ndel list[5]\nprint(list)\n\
    ```\n\n```\n$ python3 test.py\n[12, 5, 32, 43, 21, 356, 5, 21]\n[5, 32, 43, 21,\
    \ 356, 21]\n```\n\nBy using `del` statement, you can remove slices from list.\n\
    \n`test.py`\n```\nlist = [12, 5, 32, 43, 21, 356, 5, 21]\nprint(list)\ndel list[2:6]\n\
    print(list)\n```\n\n```\n$ python3 test.py\n[12, 5, 32, 43, 21, 356, 5, 21]\n\
    [12, 5, 5, 21]\n```\n\nBy using `del` statement, you can clear list. `del list[:]`\
    \ removes all elements from list `list`.\n\n`test.py`\n```\nlist = [12, 5, 32,\
    \ 43, 21, 356, 5, 21]\nprint(list)\ndel list[:]\nprint(list)\n```\n\n```\n$ python3\
    \ test.py\n[12, 5, 32, 43, 21, 356, 5, 21]\n[]\n```\n\nBy using `del` statement,\
    \ you can remove variable itself. Once you remove variable, you can't use it.\
    \ If you try to use the variable, after it removed, you will get error.\n\n`test.py`\n\
    ```\nlist = [12, 5, 32, 43, 21, 356, 5, 21]\nprint(list)\ndel list\nlist[0] =\
    \ 1\n```\n\n```\n$ python3 test.py\n[12, 5, 32, 43, 21, 356, 5, 21]\nTraceback\
    \ (most recent call last):\n  File \"test.py\", line 5, in <module>\n    list[0]\
    \ = 1\nTypeError: 'type' object does not support item assignment\n```\n\n## Python:\
    \ Looping over lists\n\n### Using for loop\n\n```\nfor var in list:\n    # Do\
    \ processing here\n```\n\nYou can use `for` loop like above to loop over a list.\
    \ Following example explains this.\n\n```\n>>> countries = ['India', 'China',\
    \ 'Pakisthan', 'Sri Lanka', 'Bangladesh']\n>>> for i in countries:\n...     print(i)\n\
    ...\nIndia\nChina\nPakisthan\nSri Lanka\nBangladesh\n```\n\n### By using enumerate\
    \ method, we can iterate over a list.\n\nBy using `enumerate` function\n\n`enumerate`\
    \ function return the position, corresponding value in the list.\n\n```\n>>> countries\n\
    ['India', 'China', 'Pakisthan', 'Sri Lanka', 'Bangladesh']\n>>> for i,v in enumerate(countries):\n\
    ...     print(i, v)\n...\n0 India\n1 China\n2 Pakisthan\n3 Sri Lanka\n4 Bangladesh\n\
    ```\n\n### To loop over a sequence reversely\n\n`reversed` function is used to\
    \ loop over a sequence reversely.\n\n```\n>>> countries\n['India', 'China', 'Pakisthan',\
    \ 'Sri Lanka', 'Bangladesh']\n>>>\n>>> for i in reversed(countries):\n...    \
    \ print(i)\n...\nBangladesh\nSri Lanka\nPakisthan\nChina\nIndia\n```\n\n### To\
    \ loop over a sequence in sorted order\n\nUse `sorted` function to loop over a\
    \ sequence in sorted order.\n\n```\n>>> for i in sorted(countries):\n...     print(i)\n\
    ...\nBangladesh\nChina\nIndia\nPakisthan\nSri Lanka\n```\n\n### Loop over more\
    \ than one list at a time\n\n`zip` function is used to loop over more than one\
    \ list at a time.\n\n```\n>>> for country, capital in zip(countries, capitals):\n\
    ...     print(country, capital)\n...\nIndia Delhi\nChina Beijing\nPakisthan Islamabad\n\
    Sri Lanka Sri Jayawardenepura - Kotte\nBangladesh Dhaka\n```\n\n### Loop using\
    \ index\n\n```\n>>> countries\n['India', 'China', 'Pakisthan', 'Sri Lanka', 'Bangladesh']\n\
    >>>\n>>> for i in range(len(countries)):\n...     print(countries[i])\n...\nIndia\n\
    China\nPakisthan\nSri Lanka\nBangladesh\n```\n\n## Python: tuples\n\nA tuple is\
    \ just like a list, consist of number of values separated by commas.\n\n### Differences\
    \ between tuple and list\n\na. List is mutable, where as tuple is immutable\n\n\
    b. Tuple can contain heterogeneous data, where as list usually contains homogeneous\
    \ data.\n\n`test.py`\n```\nemployee = (1, \"Hari Krihsna\", \"Delhi\", 12345.678)\n\
    print(employee)\nprint(employee[0])\nprint(employee[1])\nprint(employee[2])\n\
    print(employee[3])\n```\n\n```\n$ python3 test.py\n(1, 'Hari Krihsna', 'Delhi',\
    \ 12345.678)\n1\nHari Krihsna\nDelhi\n12345.678\n```\n\nAs you observe above example,\
    \ elements in tuple are enclosed in parenthesis. Eventhough tuples are immutable,\
    \ you can create tuples which contain mutable objects, such as lists.\n\n`test.py`\n\
    ```\nemployee = (1, [])\nprint(employee)\nemployee[1].append(2)\nemployee[1].append(4)\n\
    employee[1].append(6)\nprint(employee)\n```\n\n```\n$ python3 test.py\n(1, [])\n\
    (1, [2, 4, 6])\n```\n\n### Packing and unpacking\n\nYou can define tuples, without\
    \ using parenthesis.\n\nFor example,\n\n```\nemployee=1, \"Hari Krihsna\", \"\
    Delhi\", 12345.678\n```\n\nAbove one is the example of tuple packing.\n\n```\n\
    id, firstName, lastName, salary = employee\n```\n\nAbove one is an example of\
    \ tuple unpacking. Sequence unpacking requires that there are as many variables\
    \ on the left side of the equals sign as there are elements in the sequence.\n\
    \n`test.py`\n```\nemployee = 1, \"Hari Krihsna\", \"Delhi\", 12345.678\nid, firstName,\
    \ lastName, salary = employee\nprint(id)\nprint(firstName)\nprint(lastName)\n\
    print(salary)\n```\n\n```\n$ python3 test.py\n1\nHari Krihsna\nDelhi\n12345.678\n\
    ```\n\n### Concatenate tuples\n\n` sodass ` operator is used to concatenate tuples.\n\
    \n```\n>>> tuple1 = (1, \"HI\", 2, 45.65)\n>>> tuple2 = (\"abcdef\", 54, 67)\n\
    >>> tuple3 = tuple1 + tuple2\n>>> tuple3\n(1, 'HI', 2, 45.65, 'abcdef', 54, 67)\n\
    ```\n\n### Slicing\n\nJust like lists, you can access tuples using slice notation.\n\
    \n| Example | Description |\n| --- | --- |\n| `tuple[start:end]` | Returns tuple\
    \ from index start (included) to end index (excluded). |\n| `tuple[:end]` | Returns\
    \ tuple from index 0(included) to end index (excluded). |\n| `tuple[start:]` |\
    \ Return tuple from index start to till end. |\n| `tuple[-2:]` | Return elements\
    \ from 2nd last to end. |"
