    \ {\n    var obj = MyClass()\n    var result = obj.getSum(10, 20)\n    println(\"\
    Sum of 10 and 20 is : $result\")\n}\n```\n\n**Output**\n\n```\nSum of 10 and 20\
    \ is : 30\n```\n\n### Can object declaration be local?\n\nObject declarations\
