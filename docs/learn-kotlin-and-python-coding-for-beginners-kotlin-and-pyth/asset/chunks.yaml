    How to create ObjectUnlike  Java , '' new '' keyword is not required to define
    an object.Syntaxvar objectName  = ClassName(arguments)Exvar emp1 = Employee("Shwetha")var
    emp2 = Employee("JJTam", "G")ConstructorDemo.ktclass Employee {  var firstName:
    String = ""  var lastName: String = ""constructor(fName: String) {  this .firstName
    = fName  this .lastName = fName}constructor(fName: String, lName: String) {  this
    .firstName = fName  this .lastName = lName}}fun printEmployee (emp: Employee)
    {println( "firstName : ${emp.firstName}, lastName : ${emp.lastName}" )}fun main
    (args: Array<String>) {  var emp1 = Employee( "Shwetha" )  var emp2 = Employee(
    "JJTam" , "G" )printEmployee(emp1)printEmployee(emp2)}OutputfirstName : Shwetha,
    lastName : ShwethafirstName : JJTam, lastName : GKotlin: InheritanceInheritance
    is the concept of re usability. Object of one class can get the properties and
    methods of object of another class by using inheritance.By using inheritance,
    you can create new class by extending the existing class. The new class is called
    derived class and the existing class is called base class.![](Image00012.jpg)Exampleopen
    class BaseClass {}class DerivedClass : BaseClass{}By default, all the classes
    in kotlin are final. To make these class inheritable, you should use the keyword
    ‘open’.Let’s see inheritance feature by an example. In every organization, there
    are two kinds of employees.a .      Permanent Employeesb .      Contract EmployeesBoth
    the permanent and contract employees share properties like firstName, lastName
    and id. Where as contract employees has separate payroll company. We can place
    these common properties (firstName, lastName and id) in separate class Employee
    and make the classes PermanentEmployee and ContractEmployee inherit these properties
    from the common base class Employee.![](Image00013.jpg)open class Employee {}class
    PermanentEmployee : Employee {}class ContractEmployee : Employee {}Find the below
    working application.Inheritance.ktopen class Employee {  var firstName: String
    = ""  var lastName: String = ""  var id: String = ""constructor(firstName: String,
    lastName: String, id: String) {  this .firstName = firstName  this .lastName =
    lastName  this .id = id}open fun getEmployee (): String {  return "firstName :
    $firstName, lastName: $lastName, id: $id"}}class PermanentEmployee : Employee
    {  var healthInsuranceNumber = ""  var salary: Double = 0.0constructor(firstName:
    String, lastName: String, id: String, healtInsuranceNumber: String, salary: Double)
    : super(firstName, lastName, id) {  this .healthInsuranceNumber = healtInsuranceNumber 
    this .salary = salary}  override fun getEmployee (): String {  return super.getEmployee()
    + ", healthInsuranceNumber: $healthInsuranceNumber, salary: $salary"}}class ContractEmployee
    : Employee {  var payRollCompany = "ABC"constructor(firstName: String, lastName:
    String, id: String, payRollCompany: String) : super(firstName, lastName, id) { 
    this .payRollCompany = payRollCompany}  override fun getEmployee (): String { 
    return super.getEmployee() + ", payRollCompany: $payRollCompany"}}fun main (args:
    Array<String>) {  var emp = PermanentEmployee( "JJTam" , "Delhi" , "123" , "health3425"
    , 56789.01 )println(emp.getEmployee())}OutputfirstName : JJTam, lastName: Delhi,
    id: 123, healthInsuranceNumber: health3425, salary: 56789.01constructor(firstName:
    String, lastName: String, id: String, healtInsuranceNumber: String, salary: Double)
    : super(firstName, lastName, id)If super class don’t have default constructor,
    then all the sub class constructors must call the super class constructor explicitly.By
    default, all the functions and classes are not inheritable (final), to make them
    inheritable, you should use the keyword ‘open’.open class Employee {         open
    fun getEmployee(): String {                 return "firstName : $firstName, lastName:
    $lastName, id: $id"         }}To override a function of super class, you should
    use override keyword.class PermanentEmployee : Employee {         override fun
    getEmployee(): String {                 return super.getEmployee() + ", healthInsuranceNumber:
    $healthInsuranceNumber, salary: $salary"         }}Important Pointsa .      If
    the class has a primary constructor, the base type can (and must) be initialized
    right there, using the parameters of the primary constructor.b .      If the class
    has no primary constructor, then each secondary constructor has to initialize
    the base type using the super keyword, or to delegate to another constructor which
    does that. Note that in this case different secondary constructors can call different
    constructors of the base type.Kotlin: Overriding methodsBy using ‘override’ keyword,
    you can override the methods of base class. By default all the methods in a class
    are final (not overridable), you can make them overridable by using ‘open’ keyword’.Override.ktopen
    class BaseClass {open fun sayHello (){  println( "******Hello World******" )}}class
    DerivedClass : BaseClass(){  override fun sayHello (){  println( "@@@@Hello World@@@@@"
    )}}fun main (args: Array<String>) {  var obj = DerivedClass()obj.sayHello()}Output@@@@Hello
    World@@@@@As you observe above snippet, DerivedClass inhrites from BaseClass.
    sayHello() method of DerivedClass override the sayHello() method of BaseClass
    using override keyword.A method defined with the keyword ‘override’ is itself
    open, so the child classes of the DerivedClass, can override this method.Override.ktopen
    class BaseClass {open fun sayHello () {  println( "******Hello World******" )}}open
    class DerivedClass : BaseClass() {  override fun sayHello () {  println( "@@@@Hello
    World@@@@@" )}}class ChildDerivedClass : DerivedClass() {  override fun sayHello
    () {  println( "####Hello World####" )}}fun main (args: Array<String>) {  var
    obj = ChildDerivedClass()obj.sayHello()}Output####Hello World####If you want to
    prohibit the re-overriding, use the keyword final.Exopen class DerivedClass :
    BaseClass() {         final override fun sayHello() {                 println("@@@@Hello
    World@@@@@")         }}Override.ktopen class BaseClass {open fun sayHello () { 
    println( "******Hello World******" )}}open class DerivedClass : BaseClass() {final
    override fun sayHello () {  println( "@@@@Hello World@@@@@" )}}class ChildDerivedClass
    : DerivedClass() {  override fun sayHello () {  println( "####Hello World####"
    )}}fun main (args: Array<String>) {  var obj = ChildDerivedClass()obj.sayHello()}When
    you try to compile above program, kotlin compiler throws below error.''sayHello''
    in ''DerivedClass'' is final and cannot be overriddenKotlin: Overriding propertiesIn
    my previous post, I explained how to override methods, overriding of properties
    is similar to overriding of methods.Below step by step procedure explains, how
    to override a property.Step 1:  Define a variable with open modifier in Base class.open
    class BaseClass {open var name: String = "Base Class"}Step 2:  In sub class redefine
    the variable with same name using override modifier.open class DerivedClass :
    BaseClass() {override var name: String = "Derived Class"}Find the below working
    application.Inheritance.ktopen class BaseClass {open var name: String = "Base
    Class"}open class DerivedClass : BaseClass() { override var name: String = "Derived
    Class"}fun main (args: Array<String>) { var obj = DerivedClass()println("name
    : $obj.name" )}Outputname : Derived ClassCan I override a val property with var
    property?Yes, you can override a val property with a var property.Inheritance.ktopen
    class BaseClass {open val name: String = "Base Class"}open class DerivedClass
    : BaseClass() { override var name: String = "Derived Class"}fun main (args: Array<String>)
    { var obj = DerivedClass()println("name : ${obj.name}" )}Can I override a var
    property with val property?No, you can’t override a var property with val property.Inheritance.ktopen
    class BaseClass {open var name: String = "Base Class"}open class DerivedClass
    : BaseClass() { override val name: String = "Derived Class"}fun main (args: Array<String>)
    { var obj = DerivedClass()println("name : ${obj.name}" )}When you try to compile
    above program, you will end up in below compilation error.ERROR: Var-property
    public open val name: String defined in DerivedClass cannot be overridden by val-property
    public open var name: String defined in BaseClass (6, 11)Kotlin: Calling super
    class methodsBy using super keyword, you can call super class methods.Syntaxsuper.methodNameSuperDemo.ktopen
    class BaseClass {open fun printMsg () {  println( "Hello Base class" )}}open class
    DerivedClass : BaseClass() {  override fun printMsg () {  println( "Hello Derived
    class" )  super.printMsg()}}fun main (args: Array<String>) {  var obj = DerivedClass()obj.printMsg()}OutputHello
    Derived classHello Base classKotlin: Nested classesA class can be nested in other
    class.Exclass Outer {         class Nested {         }}How to create an object
    to nested class?var obj = Outer.Nested()NestedClass.ktclass Outer {  fun printMsg
    () {  println( "Inside Outer class" )}  class Nested {  fun printMsg () {   println(
    "Inside Nested class" )  }}}fun main (args: Array<String>) {  var outerObj = Outer() 
    var nestedObj = Outer.Nested()outerObj.printMsg()nestedObj.printMsg()}OutputInside
    Outer classInside Nested classCan I access the member variables defined in outer
    class from nested class?No, you can’t access the member variables defined in outer
    class from nested class.NestedDemo.ktclass Outer {  private var x = 10  class
    Inner {  fun getX () = x}}When you try to compile above program, you will end
    up in below error.Unresolved reference: xKotlin: Inner classesInner classes are
    like nested class, only difference is you can access the members of outer class
    from inner class.How to define inner class?Inner class is defined using the keyword
    ‘inner’.How to define object of inner class?var innerObj = Outer().Inner()InnerDemo.ktclass
    Outer { fun printMsg () {  println("Inside Outer class" )}inner class Inner { 
    fun printMsg () {   println("Inside Inner class" )  }}}fun main (args: Array<String>)
    { var outerObj = Outer() var innerObj = Outer().Inner()outerObj.printMsg()innerObj.printMsg()}OutputInside
    Outer classInside Inner classYou can able to access the member variables of outer
    class from inner class.InnerDemo.ktclass Outer { private var x = 10inner class
    Inner {  fun getX () = x}}fun main (args: Array<String>) { var innerObj = Outer().Inner() var
    x = innerObj.getX()println("x = $x" )}Outputx = 10Kotlin: InterfacesWhat is an
    Interface ?Interfaces are the contracts in the outside world.What it mean?Take
    an example, let us assume, there is a standard for all mobile phones, as per the
    standard, below are the basic functionality for the mobile phones to provide. [![](Image00014.jpg)](https://1.bp.blogspot.com/-BmT-R4h8cDM/Wld5KaEiVUI/AAAAAAAAJOM/GA-J8OYY53IuzCeKXvF4NK27qYfFwHa1gCLcBGAs/s1600/kotlin+interfaces.jpg)Vendor1
    provides the functionality for the mobile in language JAVAVendor2 provides the
    functionality for the mobile in language C++Vendor3 provides the functionality
    for the mobile in language JAVAVendor4 provides the functionality for the mobile
    in language Cthat mean all the vendors providing the same functionality, but the
    way they are providing is different.One more example is IBM JAVA, Oracle JAVA
    are providing the functionality for JAVA, but the way they implemented the features
    is different.How to define an interface in kotlin?You can define the interfaces
    using ''interface'' keyword. Interfaces in kotlin are similar to  interfaces in
    Java8.interface InterfaceName{  /* Function without body*/  fun method1 ()  /*
    Function with body*/  fun mehtod2 (){}}How to implement an interface?kotlin class
    can implement one or more interfaces.Syntaxclass ClassName : Interface1, Interface2...InterfaceN{}Find
    the below working application.HelloWorld.ktinterface Arithmetic {  fun sum (a:
    Int, b: Int): Int  fun sub (a: Int, b: Int): Int}class ArithmeticImpl : Arithmetic
    {  override fun sum (a: Int, b: Int): Int {  return a + b}  override fun sub (a:
    Int, b: Int): Int {  return a - b}}fun main (args: Array<String>) {  var obj =
    ArithmeticImpl()println( "Sum of 10 and 20 is : ${obj.sum(10, 20)}" )println(
    "Sub of 10 and 20 is : ${obj.sub(10, 20)}" )}OutputSum of 10 and 20 is : 30Sub
    of 10 and 20 is : -10Can a class implement more than one interface?yes, a class
    can implement more than one interfaces.class ArithmeticImpl : Arithmetic, Message
    {}In the above example, "ArithmeticImpl" class is implementing Arithmetic and
    Message interfaces.Find the below working application.HelloWorld.ktinterface Arithmetic
    {  fun sum (a: Int, b: Int): Int  fun sub (a: Int, b: Int): Int}interface Message
    {  fun amoutMe (): String}class ArithmeticImpl : Arithmetic, Message {  override
    fun sum (a: Int, b: Int): Int {  return a + b}  override fun sub (a: Int, b: Int):
    Int {  return a - b}  override fun amoutMe (): String {  return "ArithmeticImpl
    class"}}fun main (args: Array<String>) {  var obj = ArithmeticImpl()println( "Sum
    of 10 and 20 is : ${obj.sum(10, 20)}" )println( "Sub of 10 and 20 is : ${obj.sub(10,
    20)}" )println(obj.amoutMe())}OutputSum of 10 and 20 is : 30Sub of 10 and 20 is
    : -10ArithmeticImpl classCan I define properties in interface?Yes, you can define
    properties in interfaces. Properties can be abstract (or) have definition.HelloWorld.ktinterface
    DemoInterface {  var variable1: String  val variable2: String  get () = "Hello
    World"}class MyClass : DemoInterface {  override var variable1: String = "Hello"}fun
    main (args: Array<String>) {  var obj = MyClass()println( "variable1 : ${obj.variable1}"
    )println( "variable2 : ${obj.variable2}" )}Outputvariable1 : Hellovariable2 :
    Hello WorldKotlin: Overriding conflict while implementing interfacesIf you are
    implementing more than one interface and those interfaces have same method signatures,
    then you will end up in conflict scenario.HelloWorld.ktinterface Interface1{ fun
    welcomeMessage (name : String){  println("Welcome $name" )}}interface Interface2{ fun
    welcomeMessage (name : String){  println("Good Morning $name" )}}class MyClass
    : Interface1, Interface2{}When you try to compile above program, you will end
    up in below error.ERROR: Class ''MyClass'' must override public open fun welcomeMessage(name:
    String): Unit defined in Interface1 because it inherits multiple interface methods
    of it (13, 1)How to resolve above error?'
  trans: " \n ```kotlin\nclass Employee {\n  var firstName: String = \"\"\n  var lastName:\
    \ String = \"\"\n  constructor(firstName: String) {\n    this.firstName = firstName\n\
    \    this.lastName = firstName\n  }\n  constructor(firstName: String, lastName:\
    \ String) {\n    this.firstName = firstName\n    this.lastName = lastName\n  }\n\
    }\n\nfun printEmployee(emp: Employee) {\n  println(\"firstName : ${emp.firstName},\
    \ lastName : ${emp.lastName}\")\n}\n\nfun main(args: Array<String>) {\n  var emp1\
    \ = Employee(\"Hareesh\", \"Seeram\")\n  var emp2 = Employee(\"Praneeth\")\n \
    \ printEmployee(emp1)\n  printEmployee(emp2)\n}\n```\n\n输出\n\n```\nfirstName :\
    \ Hareesh, lastName : Seeram\nfirstName : Praneeth, lastName : Praneeth\n```\n\
    \n主构造函数必须被次构造函数显式调用。我的意思是，如果一个类有主构造函数，那么次构造函数必须直接或通过其他 constructors 间接地委托给主构造函数。\n\
    \n```kotlin\nclass Employee(var firstName: String) {\n  ...\n  ...\n  constructor(fName:\
    \ String, lName: String) : this(fName) {\n    this.lastName = lName\n    this.id\
    \ = \"\"\n  }\n}\n```\n\n在上面的例子中，`Employee` 类有一个主构造函数，我们在定义次构造函数时使用 `this` 关键字调用主构造函数。\n\
    \n`ConstructorDemo.kt`\n\n```kotlin\nclass Employee(var firstName: String) {\n\
    \  var lastName: String = \"\"\n  var id: String = \"\"\n  constructor(fName:\
    \ String, lName: String) : this(fName) {\n    this.lastName = lName\n    this.id\
    \ = \"\"\n  }\n  constructor(fName: String, lName: String, id: String) : this(fName)\
    \ {\n    this.lastName = lName\n    this.id = id\n  }\n}\n\nfun printEmployee(emp:\
    \ Employee) {\n  println(\"id : ${emp.id}, firstName : ${emp.firstName}, lastName\
    \ : ${emp.lastName}\")\n}\n\nfun main(args: Array<String>) {\n  var emp1 = Employee(\"\
    JJTam\")\n  var emp2 = Employee(\"Hareesh\", \"Seeram\")\n  var emp3 = Employee(\"\
    Praneeth\", \"Sai\", \"123\")\n  printEmployee(emp1)\n  printEmployee(emp2)\n\
    \  printEmployee(emp3)\n}\n```\n\n输出\n\n```\nid : , firstName : JJTam, lastName\
    \ :\nid : , firstName : Hareesh, lastName : Seeram\nid : 123, firstName : Praneeth,\
    \ lastName : Sai\n```\n\n## Kotlin：向主构造函数传递默认值\n\n你可以向主构造函数传递默认值。\n\n示例：\n\n```kotlin\n\
    class Employee(var firstName: String = \"JJTam\", var lastName: String = \"Delhi\"\
    ) {\n}\n```\n\n上面的代码片段为 `Employee` 类定义了一个带有默认值的主构造函数。\n\n```kotlin\nvar emp1 =\
    \ Employee()\n```\n\n由于我们没有向构造函数传递任何参数，`firstName` 和 `lastName` 将使用默认值进行初始化。`firstName`\
    \ 被初始化为 `JJTam`，`lastName` 被初始化为 `Delhi`\n\n```kotlin\nvar emp2 = Employee(\"\
    Rachit\")\n```\n\n由于我们只传递了第一个参数，`firstName` 被赋值为 `Rachit`，`lastName` 被赋值为 `Delhi`\n\
    \n```kotlin\nvar emp3 = Employee(\"Shwetha\", \"kam\")\n```\n\n`firstName` 被赋值为\
    \ `Shwetha`，`lastName` 被赋值为 `Kam`。\n\n`ConstructorDemo.kt`\n\n```kotlin\nclass\
    \ Employee(var firstName: String = \"JJTam\", var lastName: String = \"Delhi\"\
    ) {\n}\n\nfun printEmployee(emp: Employee) {\n  println(\"firstName : ${emp.firstName},\
    \ lastName : ${emp.lastName}\")\n}\n\nfun main(args: Array<String>) {\n  var emp1\
    \ = Employee()\n  var emp2 = Employee(\"Rachit\")\n  var emp3 = Employee(\"Shwetha\"\
    , \"kam\")\n  printEmployee(emp1)\n  printGrouped: emp2)\n  printEmployee(emp3)\n\
    }\n```\n\n输出\n\n```\nfirstName : JJTam, lastName : Delhi\nfirstName : Rachit,\
    \ lastName : Delhi\nfirstName : Shwetha, lastName : kam\n```\n\n## Kotlin：定义私有主构造函数\n\
    \n通过在类头中指定 `private` 访问修饰符，你可以定义私有主构造函数。\n\n`PrivateConDemo.kt`\n\n```kotlin\n\
    class Employee private constructor(var firstName: String) {\n  var lastName: String\
    \ = \"\"\n  constructor(fName: String, lName: String) : this(fName) {\n    this.lastName\
    \ = lName\n  }\n}\n\nfun printEmployee(emp: Employee) {\n  println(\"firstName\
    \ : ${emp.firstName}, lastName : ${emp.lastName}\")\n}\n\nfun main(args: Array<String>)\
    \ {\n  var emp1 = Employee(\"Shwetha\", \"kam\")\n  printEmployee(emp1)\n}\n```\n\
    \n输出\n\n```\nfirstName : Shwetha, lastName : kam\n```\n\n## Kotlin：如何创建对象\n\n\
    与 Java 不同，定义对象时不需要 `new` 关键字。\n\n语法\n\n```kotlin\nvar objectName = ClassName(arguments)\n\
    ```\n\n示例\n\n```kotlin\nvar emp1 = Employee(\"Shwetha\")\nvar emp2 = Employee(\"\
    JJTam\", \"G\")\n```\n\n`ConstructorDemo.kt`\n\n```kotlin\nclass Employee {\n\
    \  var firstName: String = \"\"\n  var lastName: String = \"\"\n  constructor(fName:\
    \ String) {\n    this.firstName = fName\n    this.lastName = fName\n  }\n  constructor(fName:\
    \ String, lName: String) {\n    this.firstName = fName\n    this.lastName = lName\n\
    \  }\n}\n\nfun printEmployee(emp: Employee) {\n  println(\"firstName : ${emp.firstName},\
    \ lastName : ${emp.lastName}\")\n}\n\nfun main(args: Array<String>) {\n  var emp1\
    \ = Employee(\"Shwetha\")\n  var emp2 = Employee(\"JJTam\", \"G\")\n  printEmployee(emp1)\n\
    \  printEmployee(emp2)\n}\n```\n\n输出\n\n```\nfirstName : Shwetha, lastName : Shwetha\n\
    firstName : JJTam, lastName : G\n```\n\n## Kotlin：继承\n\n继承是可重用性的概念。通过使用继承，一个类的对象可以获得另一个类对象的属性和方法。\n\
    \n通过使用继承，你可以通过扩展现有类来创建新类。新类称为派生类，现有类称为基类。\n\n![](img/Image00012.jpg)\n\n示例\n\n\
    ```kotlin\nopen class BaseClass {\n}\n\nclass DerivedClass : BaseClass {\n}\n\
    ```\n\n默认情况下，Kotlin 中的所有类都是 final 的。要使这些类可继承，你应该使用关键字 `open`。\n\n让我们通过一个例子来了解继承特性。在每个组织中，有两种员工。\n\
    \na. 正式员工\nb. 合同工\n\n正式员工和合同工都共享 `firstName`、`lastName` 和 `id` 等属性。而合同工有单独的薪酬公司。我们可以将这些共同属性（`firstName`、`lastName`\
    \ 和 `id`）放在单独的类 `Employee` 中，并让 `PermanentEmployee` 和 `ContractEmployee` 类从共同的基类\
    \ `Employee` 继承这些属性。\n\n![](img/Image00013.jpg)\n\n```kotlin\nopen class Employee\
    \ {\n}\n\nclass PermanentEmployee : Employee {\n}\n\nclass ContractEmployee :\
    \ Employee {\n}\n```\n\n找到下面的可运行应用程序。\n\n`Inheritance.kt`\n\n```kotlin\nopen class\
    \ Employee {\n  var firstName: String = \"\"\n  var lastName: String = \"\"\n\
    \  var id: String = \"\"\n  constructor(firstName: String, lastName: String, id:\
    \ String) {\n    this.firstName = firstName\n    this.lastName = lastName\n  \
    \  this.id = id\n  }\n  open fun getEmployee(): String {\n    return \"firstName\
    \ : $firstName, lastName: $lastName, id: $id\"\n  }\n}\n\nclass PermanentEmployee\
    \ : Employee {\n  var healthInsuranceNumber = \"\"\n  var salary: Double = 0.0\n\
    \  constructor(firstName: String, lastName: String, id: String, healtInsuranceNumber:\
    \ String, salary: Double) : super(firstName, lastName, id) {\n    this.healthInsuranceNumber\
    \ = healtInsuranceNumber\n    this.salary = salary\n  }\n  override fun getEmployee():\
    \ String {\n    return super.getEmployee() + \", healthInsuranceNumber: $healthInsuranceNumber,\
    \ salary: $salary\"\n  }\n}\n\nclass ContractEmployee : Employee {\n  var payRollCompany\
    \ = \"ABC\"\n  constructor(firstName: String, lastName: String, id: String, payRollCompany:\
    \ String) : super(firstName, lastName, id) {\n    this.payRollCompany = payRollCompany\n\
    \  }\n  override fun getEmployee(): String {\n    return super.getEmployee() +\
    \ \", payRollCompany: $payRollCompany\"\n  }\n}\n\nfun main(args: Array<String>)\
    \ {\n  var emp = PermanentEmployee(\"JJTam\", \"Delhi\", \"123\", \"health3425\"\
    , 56789.01)\n  println(emp.getEmployee())\n}\n```\n\n输出\n\n```\nfirstName : JJTam,\
    \ lastName: Delhi, id: 123, healthInsuranceNumber: health3425, salary: 56789.01\n\
    ```\n\n```kotlin\nconstructor(firstName: String, lastName: String, id: String,\
    \ healtInsuranceNumber: String, salary: Double) : super(firstName, lastName, id)\n\
    ```\n\n如果超类没有默认构造函数，那么所有子类构造函数都必须显式调用超类构造函数。\n\n默认情况下，所有函数和类都是不可继承的（final），要使它们可继承，你应该使用关键字\
    \ `open`。\n\n```kotlin\nopen class Employee {\n  open fun getEmployee(): String\
    \ {\n    return \"firstName : $firstName, lastName: $lastName, id: $id\"\n  }\n\
    }\n```\n\n要覆盖超类的函数，你应该使用 `override` 关键字。\n\n```kotlin\nclass PermanentEmployee\
    \ : Employee {\n  override fun getEmployee(): String {\n    return super.getEmployee()\
    \ + \", healthInsuranceNumber: $healthInsuranceNumber, salary: $salary\"\n  }\n\
    }\n```\n\n### 重要要点\n\na. 如果类有主构造函数，基类型可以在那里立即初始化，使用主构造函数的参数。\n\nb. 如果类没有主构造函数，那么每个次构造函数都必须使用\
    \ `super` 关键字初始化基类型，或委托给这样做的另一个构造函数。请注意，在这种情况下，不同的次构造函数可以调用基类型的不同构造函数。\n\n## Kotlin：覆盖方法\n\
    \n通过使用 `override` 关键字，你可以覆盖基类的方法。默认情况下，类中的所有方法都是 final 的（不可覆盖），你可以通过使用 `open`\
    \ 关键字使它们可覆盖。\n\n`Override.kt`\n\n```kotlin\nopen class BaseClass {\n  open fun\
    \ sayHello() {\n    println(\"******Hello World******\")\n  }\n}\n\nclass DerivedClass\
    \ : BaseClass() {\n  override fun sayHello() {\n    println(\"@@@@Hello World@@@@@\"\
    )\n  }\n}\n\nfun main(args: Array<String>) {\n  var obj = DerivedClass()\n  obj.sayHello()\n\
    }\n```\n\n输出\n\n```\n@@@@Hello World@@@@@\n```\n\n正如你在上面的代码片段中观察到的，`DerivedClass`\
    \ 继承自 `BaseClass`。`DerivedClass` 的 `sayHello()` 方法使用 `override` 关键字覆盖了 `BaseClass`\
    \ 的 `sayHello()` 方法。\n\n使用关键字 `override` 定义的方法本身是开放的，因此 `DerivedClass` 的子类可以覆盖此方法。\n\
    \n`Override.kt`\n\n```kotlin\nopen class BaseClass {\n  open fun sayHello() {\n\
    \    println(\"******Hello World******\")\n  }\n}\n\nopen class DerivedClass :\
    \ BaseClass() {\n  override fun sayHello() {\n    println(\"@@@@Hello World@@@@@\"\
    )\n  }\n}\n\nclass ChildDerivedClass : DerivedClass() {\n  override fun sayHello()\
    \ {\n    println(\"####Hello World####\")\n  }\n}\n\nfun main(args: Array<String>)\
    \ {\n  var obj = ChildDerivedClass()\n  obj.sayHello()\n}\n```\n\n输出\n\n```\n\
    ####Hello World####\n```\n\n如果你想禁止重新覆盖，请使用关键字 `final`。\n\n示例\n\n```kotlin\nopen\
    \ class DerivedClass : BaseClass() {\n  final override fun sayHello() {\n    println(\"\
    @@@@Hello World@@@@@\")\n  }\n}\n```\n\n`Override.kt`\n\n```kotlin\nopen class\
    \ BaseClass {\n  open fun sayHello() {\n    println(\"******Hello World******\"\
    )\n  }\n}\n\nopen class DerivedClass : BaseClass() {\n  final override fun sayHello()\
    \ {\n    println(\"@@@@Hello World@@@@@\")\n  }\n}\n\nclass ChildDerivedClass\
    \ : DerivedClass() {\n  override fun sayHello() {\n    println(\"####Hello World####\"\
    )\n  }\n}\n\nfun main(args: Array<String>) {\n  var obj = ChildDerivedClass()\n\
    \  obj.sayHello()\n}\n```\n\n当你尝试编译上面的程序时，Kotlin 编译器会抛出以下错误。\n\n```\n'sayHello'\
    \ in 'DerivedClass' is final and cannot be overridden\n```\n\n## Kotlin：覆盖属性\n\
    \n在我之前的文章中，我解释了如何覆盖方法，属性的覆盖与方法的覆盖类似。\n\n下面的分步程序解释了如何覆盖属性。\n\n步骤 1：在基类中使用 `open`\
    \ 修饰符定义变量。\n\n```kotlin\nopen class BaseClass {\n  open var name: String = \"\
    Base Class\"\n}\n```\n\n步骤 2：在子类中使用相同的名称和 `override` 修饰符重新定义变量。\n\n```kotlin\n\
    open class DerivedClass : BaseClass() {\n  override var name: String = \"Derived\
    \ Class\"\n}\n```\n\n找到下面的可运行应用程序。\n\n`Inheritance.kt`\n\n```kotlin\nopen class\
    \ BaseClass {\n  open var name: String = \"Base Class\"\n}\n\nopen class DerivedClass\
    \ : BaseClass() {\n  override var name: String = \"Derived Class\"\n}\n\nfun main(args:\
    \ Array<String>) {\n  var obj = DerivedClass()\n  println(\"name : $obj.name\"\
    )\n}\n```\n\n输出\n\n```\nname : Derived Class\n```\n\n### 我可以用 var 属性覆盖 val 属性吗？\n\
    \n是的，你可以用 `var` 属性覆盖 `val` 属性。\n\n`Inheritance.kt`\n\n```kotlin\nopen class BaseClass\
    \ {\n  open val name: String = \"Base Class\"\n}\n\nopen class DerivedClass :\
    \ BaseClass() {\n  override var name: String = \"Derived Class\"\n}\n\nfun main(args:\
    \ Array<String>) {\n  var obj = DerivedClass()\n  println(\"name : ${obj.name}\"\
    )\n}\n```\n\n### 我可以用 val 属性覆盖 var 属性吗？\n\n不，你不能用 `val` 属性覆盖 `var` 属性。\n\n`Inheritance.kt`\n\
    \n```kotlin\nopen class BaseClass {\n  open var name: String = \"Base Class\"\n\
    }\n\nopen class DerivedClass : BaseClass() {\n  override val name: String = \"\
    Derived Class\"\n}\n\nfun main(args: Array<String>) {\n  var obj = DerivedClass()\n\
    \  println(\"name : ${obj.name}\")\n}\n```\n\n当你尝试编译上面的程序时，你会遇到以下编译错误。\n\n```\n\
    ERROR: Var-property public open val name: String defined in DerivedClass cannot\
    \ be overridden by val-property public open var name: String defined in BaseClass\
    \ (6, 11)\n```\n\n## Kotlin：调用超类方法\n\n通过使用 `super` 关键字，你可以调用超类方法。\n\n语法\n\n```kotlin\n\
    super.methodName\n```\n\n`SuperDemo.kt`\n\n```kotlin\nopen class BaseClass {\n\
    \  open fun printMsg() {\n    println(\"Hello Base class\")\n  }\n}\n\nopen class\
    \ DerivedClass : BaseClass() {\n  override fun printMsg() {\n    println(\"Hello\
    \ Derived class\")\n    super.printMsg()\n  }\n}\n\nfun main(args: Array<String>)\
    \ {\n  var obj = DerivedClass()\n  obj.printMsg()\n}\n```\n\n输出\n\n```\nHello\
    \ Derived class\nHello Base class\n```\n\n## Kotlin：嵌套类\n\n一个类可以嵌套在另一个类中。\n\n\
    示例\n\n```kotlin\nclass Outer {\n  class Nested {\n  }\n}\n```\n\n### 如何创建嵌套类的对象？\n\
    \n```kotlin\nvar obj = Outer.Nested()\n```\n\n`NestedClass.kt`\n\n```kotlin\n\
    class Outer {\n  fun printMsg() {\n    println(\"Inside Outer class\")\n  }\n\
    \  class Nested {\n    fun printMsg() {\n      println(\"Inside Nested class\"\
    )\n    }\n  }\n}\n\nfun main(args: Array<String>) {\n  var outerObj = Outer()\n\
    \  var nestedObj = Outer.Nested()\n  outerObj.printMsg()\n  nestedObj.printMsg()\n\
    }\n```\n\n输出\n\n```\nInside Outer class\nInside Nested class\n```\n\n### 我可以在嵌套类中访问外部类中定义的成员变量吗？\n\
    \n不，你不能在嵌套类中访问外部类中定义的成员变量。\n\n`NestedDemo.kt`\n\n```kotlin\nclass Outer {\n  private\
    \ var x = 10\n  class Inner {\n    fun getX() = x\n  }\n}\n```\n\n当你尝试编译上面的程序时，你会遇到以下错误。\n\
    \n```\nUnresolved reference: x\n```\n\n## Kotlin：内部类\n\n内部类类似于嵌套类，唯一的区别是你可以从内部类访问外部类的成员。\n\
    \n### 如何定义内部类？\n\n内部类使用关键字 `inner` 定义。\n\n### 如何定义内部类的对象？\n\n```kotlin\nvar innerObj\
    \ = Outer().Inner()\n```\n\n`InnerDemo.kt`\n\n```kotlin\nclass Outer {\n  fun\
    \ printMsg() {\n    println(\"Inside Outer class\")\n  }\n  inner class Inner\
    \ {\n    fun printMsg() {\n      println(\"Inside Inner class\")\n    }\n  }\n\
    }\n\nfun main(args: Array<String>) {\n  var outerObj = Outer()\n  var innerObj\
    \ = Outer().Inner()\n  outerObj.printMsg()\n  innerObj.printMsg()\n}\n```\n\n\
    输出\n\n```\nInside Outer class\nInside Inner class\n```\n\n你可以从内部类访问外部类的成员变量。\n\
    \n`InnerDemo.kt`\n\n```kotlin\nclass Outer {\n  private var x = 10\n  inner class\
    \ Inner {\n    fun getX() = x\n  }\n}\n\nfun main(args: Array<String>) {\n  var\
    \ innerObj = Outer().Inner()\n  var x = innerObj.getX()\n  println(\"x = $x\"\
    )\n}\n```\n\n输出\n\n```\nx = 10\n```\n\n## Kotlin：接口\n\n### 什么是接口？\n\n接口是与外部世界的契约。\n\
    \n### 这是什么意思？\n\n举个例子，假设所有手机都有一个标准，根据该标准，以下是手机应提供的基本功能。\n\n![](https://1.bp.blogspot.com/-BmT-R4h8cDM/Wld5KaEiVUI/AAAAAAAAJOM/GA-J8OYY53IuzCeKXvF4NK27qYfFwHa1gCLcBGAs/s1600/kotlin+interfaces.jpg)\n\
    \n供应商 1 用 JAVA 语言提供手机功能\n\n供应商 2 用 C++ 语言提供手机功能\n\n供应商 3 用 JAVA 语言提供手机功能\n\n供应商\
    \ 4 用 C 语言提供手机功能\n\n这意味着所有供应商都提供相同的功能，但他们提供的方式不同。\n\n另一个例子是 IBM JAVA 和 Oracle\
    \ JAVA 都提供 JAVA 功能，但他们实现功能的方式不同。\n\n### 如何在 Kotlin 中定义接口？\n\n你可以使用 `interface`\
    \ 关键字定义接口。Kotlin 中的接口类似于 Java8 中的接口。\n\n```kotlin\ninterface InterfaceName {\n\
    \  /* 没有函数体的方法 */\n  fun method1()\n  /* 有函数体的方法 */\n  fun mehtod2() {\n  }\n\
    }\n```\n\n### 如何实现接口？\n\nKotlin 类可以实现一个或多个接口。\n\n语法\n\n```kotlin\nclass ClassName\
    \ : Interface1, Interface2...InterfaceN {\n}\n```\n\n找到下面的可运行应用程序。\n\n`HelloWorld.kt`\n\
    \n```kotlin\ninterface Arithmetic {\n  fun sum(a: Int, b: Int): Int\n  fun sub(a:\
    \ Int, b: Int): Int\n}\n\nclass ArithmeticImpl : Arithmetic {\n  override fun\
    \ sum(a: Int, b: Int): Int {\n    return a + b\n  }\n  override fun sub(a: Int,\
    \ b: Int): Int {\n    return a - b\n  }\n}\n\nfun main(args: Array<String>) {\n\
    \  var obj = ArithmeticImpl()\n  println(\"Sum of 10 and 20 is : ${obj.sum(10,\
    \ 20)}\")\n  println(\"Sub of 10 and 20 is : ${obj.sub(10, 20)}\")\n}\n```\n\n\
    输出\n\n```\nSum of 10 and 20 is : 30\nSub of 10 and 20 is : -10\n```\n\n### 一个类可以实现多个接口吗？\n\
    \n是的，一个类可以实现多个接口。\n\n```kotlin\nclass ArithmeticImpl : Arithmetic, Message {\n\
    }\n```\n\n在上面的例子中，`ArithmeticImpl` 类实现了 `Arithmetic` 和 `Message` 接口。\n\n找到下面的可运行应用程序。\n\
    \n`HelloWorld.kt`\n\n```kotlin\ninterface Arithmetic {\n  fun sum(a: Int, b: Int):\
    \ Int\n  fun sub(a: Int, b: Int): Int\n}\n\ninterface Message {\n  fun amoutMe():\
    \ String\n}\n\nclass ArithmeticImpl : Arithmetic, Message {\n  override fun sum(a:\
    \ Int, b: Int): Int {\n    return a + b\n  }\n  override fun sub(a: Int, b: Int):\
    \ Int {\n    return a - b\n  }\n  override fun amoutMe(): String {\n    return\
    \ \"ArithmeticImpl class\"\n  }\n}\n\nfun main(args: Array<String>) {\n  var obj\
    \ = ArithmeticImpl()\n  println(\"Sum of 10 and 20 is : ${obj.sum(10, 20)}\")\n\
    \  println(\"Sub of 10 and 20 is : ${obj.sub(10, 20)}\")\n  println(obj.amoutMe())\n\
    }\n```\n\n输出\n\n```\nSum of 10 and 20 is : 30\nSub of 10 and 20 is : -10\nArithmeticImpl\
    \ class\n```\n\n### 我可以在接口中定义属性吗？\n\n是的，你可以在接口中定义属性。属性可以是抽象的，也可以有定义。\n\n`HelloWorld.kt`\n\
    \n```kotlin\ninterface InterfaceName {\n  /* Function without body */\n  fun method1()\n\
    \  /* Function with body */\n  fun mehtod2() {\n  }\n}\n```\n\n### 如何实现接口？\n\n\
    Kotlin 类可以实现一个或多个接口。\n\n语法\n\n```kotlin\nclass ClassName : Interface1, Interface2...InterfaceN\
    \ {\n}\n```\n\n找到下面的可运行应用程序。\n\n`HelloWorld.kt`\n\n```kotlin\ninterface Arithmetic\
    \ {\n  fun sum(a: Int, b: Int): Int\n  fun sub(a: Int, b: Int): Int\n}\n\nclass\
    \ ArithmeticImpl : Arithmetic {\n  override fun sum(a: Int, b: Int): Int {\n \
    \   return a + b\n  }\n  override fun sub(a: Int, b: Int): Int {\n    return a\
    \ - b\n  }\n}\n\nfun main(args: Array<String>) {\n  var obj = ArithmeticImpl()\n\
    \  println(\"10 和 20 的和是：${obj.sum(10, 20)}\")\n  println(\"10 和 20 的 pecified\
    \ 差是：${obj.sub(10, 20)}\")\n}\n```\n\n输出\n\n```\n10 和 20 的和是：30\n10 和 20 的差是：-10\n\
    ```\n\n### 一个类可以实现多个接口吗？\n\n是的，一个类可以实现多个接口。\n\n```kotlin\nclass ArithmeticImpl\
    \ : Arithmetic, Message {\n}\n```\n\n在上面的例子中，`ArithmeticImpl` 类实现了 `Arithmetic`\
    \ 和 `Message` 接口。\n\n找到下面的可运行应用程序。\n\n`HelloWorld.kt`\n\n```kotlin\ninterface\
    \ Arithmetic {\n  fun sum(a: Int, b: Int): Int\n  fun sub(a: Int, b: Int): Int\n\
    }\n\ninterface Message {\n  fun amoutMe(): String\n}\n\nclass ArithmeticImpl :\
    \ Arithmetic, Message {\n  override fun sum(a: Int, b: Int): Int {\n    return\
    \ a + b\n  }\n  override fun sub(a: Int, b: Int): Int {\n    return a - b\n  }\n\
    \  override fun amoutMe(): String {\n    return \"ArithmeticImpl class\"\n  }\n\
    }\n\nfun main(args: Array<String>) {\n  var obj = ArithmeticImpl()\n  println(\"\
    10 和 20 的和是：${obj.sum(10, 20)}\")\n  println(\"10 和 20 的差是：${obj.sub(10, 20)}\"\
    )\n  println(obj.amoutMe())\n}\n```\n\n输出\n\n```\n10 和 20 的和是：30\n10 和 20 的差是：-10\n\
    ArithmeticImpl class\n```\n\n### 我可以在接口中定义属性吗？\n\n是的，你可以在接口中定义属性。属性可以是抽象的，也可以有定义。\n\
    \n`HelloWorld.kt`\n\n```kotlin\ninterface DemoInterface {\n  var variable1: String\n\
    \  val variable2: String\n    get() = \"Hello World\"\n}\n\nclass MyClass : DemoInterface\
    \ {\n  override var variable1: String = \"Hello\"\n}\n\nfun main(args: Array<String>)\
    \ {\n  var obj = MyClass()\n  println(\"variable1 : ${obj.variable1}\")\n  println(\"\
    variable2 : ${obj.variable2}\")\n}\n```\n\n输出\n\n```\nvariable1 : Hello\nvariable2\
    \ : Hello World\n```\n\n## Kotlin：实现接口时的覆盖冲突\n\n如果你正在实现多个接口，而这些接口具有相同的方法签名，那么你会遇到冲突场景。\n\
    \n`HelloWorld.kt`\n\n```kotlin\ninterface Interface1 {\n  fun welcomeMessage(name:\
    \ String) {\n    println(\"Welcome $name\")\n  }\n}\n\ninterface Interface2 {\n\
    \  fun welcomeMessage(name: String) {\n    println(\"Good Morning $name\")\n \
    \ }\n}\n\nclass MyClass : Interface1, Interface2 {\n}\n```\n\n当你尝试编译上面的程序时，你会遇到以下错误。\n\
    \n```\nERROR: Class 'MyClass' must override public open fun welcomeMessage(name:\
    \ String): Unit defined in Interface1 because it inherits multiple interface methods\
    \ of it (13, 1)\n```\n\n### 如何解决上述错误？\n"
- fmt: " By overriding the function `welcomeMessage` in `MyClass`, you can get rid\
    \ of above error.\n\n```kotlin\nclass MyClass : Interface1, Interface2 {\n   \
    \ override fun welcomeMessage(name: String) {\n        println(\"Hello $name\"\
    )\n    }\n}\n```\n\nFind the below working application.\n\n**HelloWorld.kt**\n\
    \n```kotlin\ninterface Interface1 {\n    fun welcomeMessage(name: String) {\n\
    \        println(\"Welcome $name\")\n    }\n}\n\ninterface Interface2 {\n    fun\
    \ welcomeMessage(name: String) {\n        println(\"Good Morning $name\")\n  \
    \  }\n}\n\nclass MyClass : Interface1, Interface2 {\n    override fun welcomeMessage(name:\
    \ String) {\n        println(\"Hello $name\")\n    }\n}\n\nfun main(args: Array<String>)\
    \ {\n    var obj = MyClass()\n    obj.welcomeMessage(\"JJTam\")\n}\n```\n\n**Output**\n\
    \n```\nHello JJTam\n```\n\n## How can I call interface method implementations\
    \ from class?\n\nBy using `super` keyword, you can call interface method implementations\
    \ from a class.\n\n**Ex**\n\n```kotlin\nclass MyClass : Interface1, Interface2\
    \ {\n    override fun welcomeMessage(name: String) {\n        super<Interface1>.welcomeMessage(name)\n\
    \        super<Interface2>.welcomeMessage(name)\n    }\n}\n```\n\nFind the below\
    \ working application.\n\n**HelloWorld.kt**\n\n```kotlin\ninterface Interface1\
    \ {\n    fun welcomeMessage(name: String) {\n        println(\"Welcome $name\"\
    )\n    }\n}\n\ninterface Interface2 {\n    fun welcomeMessage(name: String) {\n\
    \        println(\"Good Morning $name\")\n    }\n}\n\nclass MyClass : Interface1,\
    \ Interface2 {\n    override fun welcomeMessage(name: String) {\n        super<Interface1>.welcomeMessage(name)\n\
    \        super<Interface2>.welcomeMessage(name)\n    }\n}\n\nfun main(args: Array<String>)\
    \ {\n    var obj = MyClass()\n    obj.welcomeMessage(\"JJTam\")\n}\n```\n\n**Output**\n\
    \n```\nWelcome JJTam\nGood Morning JJTam\n```\n\n## Kotlin: Object Expressions\n\
    \nIf you want to create an object that is slight modification to the existing\
    \ class, you can use anonymous class. By using Object expressions, you can create\
    \ anonymous class.\n\nFor example,\n\n```kotlin\nopen class PrintUtil {\n    public\
    \ open fun welcomeMessage(name: String) {\n        println(\"Hello $name\")\n\
    \    }\n}\n```\n\nNow we can define anonymous class like below.\n\n```kotlin\n\
    /* Define object using anonymous class */\nvar anonymousObj: PrintUtil = object\
    \ : PrintUtil() {\n    override fun welcomeMessage(name: String) {\n        println(\"\
    Welcome $name\")\n    }\n}\n```\n\nAs you observe above snippet, I defined the\
    \ object `anonymousObj` using object expression. Object expressions are defined\
    \ using the keyword `object`.\n\n**HelloWorld.kt**\n\n```kotlin\nopen class PrintUtil\
    \ {\n    public open fun welcomeMessage(name: String) {\n        println(\"Hello\
    \ $name\")\n    }\n}\n\nfun main(args: Array<String>) {\n    var obj = PrintUtil()\n\
    \    obj.welcomeMessage(\"JJTam\")\n    /* Define object using anonymous class\
    \ */\n    var anonymousObj: PrintUtil = object : PrintUtil() {\n        override\
    \ fun welcomeMessage(name: String) {\n            println(\"Welcome $name\")\n\
    \        }\n    }\n    anonymousObj.welcomeMessage(\"JJTam\")\n}\n```\n\n**Output**\n\
    \n```\nHello JJTam\nWelcome JJTam\n```\n\nYou can also pass parameterized constructor\
    \ while defining anonymous class\n\n```kotlin\nopen class PrintUtil(var greeting:\
    \ String) {\n    public open fun welcomeMessage(name: String) {\n        println(\"\
    Hello $name\")\n    }\n}\n```\n\nWe can define anonymous class like below.\n\n\
    ```kotlin\n/* Define object using anonymous class */\nvar anonymousObj: PrintUtil\
    \ = object : PrintUtil(\"Good Morning\") {\n    override fun welcomeMessage(name:\
    \ String) {\n        println(\"Welcome $name\")\n    }\n}\n```\n\nFind the below\
    \ working application.\n\n**HelloWorld.kt**\n\n```kotlin\nopen class PrintUtil(var\
    \ greeting: String) {\n    public open fun welcomeMessage(name: String) {\n  \
    \      println(\"Hello $name\")\n    }\n}\n\nfun main(args: Array<String>) {\n\
