    \ number\nEnter input ptr\nPlease enter valid number\nEnter input 10\n10\n```\n\
    \n### How try and except block work?\n\nThe statements in try block executed first.\
    \ If no exception occurs, the except clauses are skipped and execution of the\
    \ try statement is finished. If any exception occurs during the execution of try\
    \ block, the rest of the try clause is skipped.\n\n`try` block followed by number\
    \ of except clauses, if exception thrown in try cause matches to any exception\
    \ followed by except clause, then particular except clause is executed.\n\nIf\
    \ an exception occurs which does not match the exception named in the except clause,\
    \ it is passed on to outer try statements; if no handler is found, it is an unhandled\
    \ exception and execution stops by throwing exception message.\n\nTry block can\
    \ be followed by multiple except clauses\n\n```\nwhile True :\n    try :\n   \
    \     x = int (input (\"Enter divisor \" ))\n        y = int (input (\"Enter dividend\
    \ \" ))\n        print (x/ y)\n        break ;\n    except ValueError :\n    \
    \    print (\"Please enter valid number\" )\n    except ZeroDivisionError :\n\
    \        print (\"y should be non zero\" )\n```\n\n```\n$ python3 test.py\nEnter\
    \ divisor 2\nEnter dividend 0\ny should be non zero\nEnter divisor 4\nEnter dividend\
    \ 0\ny should be non zero\nEnter divisor 4\nEnter dividend 2\n2.0\n```\n\n###\
    \ Handling multiple exceptions in single except clause\n\nAn except clause can\
    \ catch more than one exception. For example `except (ValueError, ZeroDivisionError)`\
    \ can handle both `ValueError` and `ZeroDivisionError`.\n\n```\nwhile True :\n\
    \    try :\n        x = int (input (\"Enter divisor \" ))\n        y = int (input\
