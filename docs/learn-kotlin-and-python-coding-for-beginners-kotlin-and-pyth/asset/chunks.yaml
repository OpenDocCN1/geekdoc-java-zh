  trans: " \nSegment 1:\n # Kotlin 用户自定义函数\n\n在本教程系列中，我将重点介绍用户自定义函数。在 Kotlin 中，函数使用\
    \ `fun` 关键字定义。\n\n## 语法\n\n```\nfun functionName(parameters) : returnType{\n}\n\
    ```\n\n如果不指定 `returnType`，则将其视为 void 方法。`parameters` 是可选的。参数必须指定类型，多个参数之间用逗号（`,`）分隔。\n\
    \n## 语法\n\n```\nfun functionName(param1 : type, param2: type …. paramN:type) :\
    \ returnType{\n}\n```\n\n## 示例\n\n```kotlin\n// 无参数的 void 函数\nfun printWelcomeMessage()\
    \ {\n    println(\"Welcome buddy\")\n}\n\n// 带一个参数的 void 函数\nfun printWelcomeMessage(name:\
    \ String) {\n    println(\"Welcome $name\")\n}\n\n// 带两个参数的 void 方法\nfun printWelcomeMessage(firstName:\
    \ String, lastName: String) {\n    println(\"Welcome [$firstName, $lastName]\"\
    )\n}\n\n// 无参数的非 void 函数\nfun getWelcomeMessage(): String {\n    return \"Welcome\"\
    \n}\n\n// 带一个参数的非 void 函数\nfun getWelcomeMessage(name: String): String {\n   \
    \ return \"Welcome $name\"\n}\n\n// 带两个参数的非 void 函数\nfun getWelcomeMessage(firstName:\
    \ String, lastName: String): String {\n    return \"Welcome [$firstName, $lastName]\"\
    \n}\n```\n\n### FunctionsDemo.kt\n\n```kotlin\n// 无参数的 void 函数\nfun printWelcomeMessage\
    \ () {\n    println( \"Welcome buddy\" )\n}\n\n// 带一个参数的 void 函数\nfun printWelcomeMessage\
    \ (name: String) {\n    println( \"Welcome $name\" )\n}\n\n// 带两个参数的 void 方法\n\
    fun printWelcomeMessage (firstName: String, lastName: String) {\n    println(\
    \ \"Welcome [$firstName, $lastName]\" )\n}\n\n// 无参数的非 void 函数\nfun getWelcomeMessage\
    \ (): String {\n    return \"Welcome\"\n}\n\n// 带一个参数的非 void 函数\nfun getWelcomeMessage\
    \ (name: String): String {\n    return \"Welcome $name\"\n}\n\n// 带两个参数的非 void\
    \ 函数\nfun getWelcomeMessage (firstName: String, lastName: String): String {\n\
    \    return \"Welcome [$firstName, $lastName]\"\n}\n\nfun main (args: Array<String>)\
    \ {\n    printWelcomeMessage()\n    printWelcomeMessage( \"Ram\" )\n    printWelcomeMessage(\
    \ \"Ram\" , \"JJTam\" )\n    var message = getWelcomeMessage()\n    println( \"\
    ${message}\" )\n    message = getWelcomeMessage( \"Ram\" )\n    println( \"${message}\"\
    \ )\n    message = getWelcomeMessage( \"Ram\" , \"JJTam\" )\n    println( \"${message}\"\
    \ )\n}\n```\n\n### 输出\n\n```\nWelcome buddy\nWelcome Ram\nWelcome [Ram, JJTam]\n\
    Welcome\nWelcome Ram\nWelcome [Ram, JJTam]\n```\n\n如果函数体只有一条语句，则可以省略花括号 `{}`\n\
    \n### 示例\n\n```kotlin\nfun square(x: Int) = x * x\nfun cube(x: Int) = x * x *\
    \ x\nfun printMessage() = \"Hello World\"\n```\n\n### FunctionsDemo.kt\n\n```kotlin\n\
    fun square (x: Int) = x * x\nfun cube (x: Int) = x * x * x\nfun printMessage ()\
    \ = \"Hello World\"\n\nfun main (args: Array<String>) {\n    println( \"Square\
    \ of 10 is ${square(10)}\" )\n    println( \"Cube of 10 is ${cube(10)}\" )\n \
    \   println(printMessage())\n}\n```\n\n### 输出\n\n```\nSquare of 10 is 100\nCube\
    \ of 10 is 1000\nHello World\n```\n\n## Kotlin：使用参数名调用函数\n\n在 Kotlin 中，可以使用参数名调用函数，这类似于\
    \ Python 中的\"关键字参数\"特性。\n\n```kotlin\nfun printEmployee(id: String, firstName:\
    \ String, lastName: String, designation: String) {\n    println(\"\\nid : $id\\\
    nfirstName : $firstName\\nlastName : $lastName\\ndesignation : $designation\"\
    )\n}\n```\n\n在 Kotlin 中，可以使用参数名来调用函数。\n\n```kotlin\nprintEmployee(id = \"1\",\
    \ firstName = \"JJTam\", lastName = \"Delhi\", designation = \"engineer\")\n```\n\
    \n指定参数名的一个优点是，在调用函数时可以更改参数的顺序。\n\n```kotlin\nprintEmployee(designation = \"engineer\"\
    , firstName = \"JJTam\", lastName = \"Delhi\", id = \"1\")\n```\n\n### KeyWordArgsDemo.kt\n\
    \n```kotlin\nfun printEmployee (id: String, firstName: String, lastName: String,\
    \ designation: String) {\n    println( \"\\nid : $id\\nfirstName : $firstName\\\
    nlastName : $lastName\\ndesignation : $designation\" )\n}\n\nfun main (args: Array<String>)\
    \ {\n    printEmployee( \"1\" , \"JJTam\" , \"Delhi\" , \"Engineer\" )\n    printEmployee(id\
    \ = \"1\" , firstName = \"JJTam\" , lastName = \"Delhi\" , designation = \"engineer\"\
    \ )\n    printEmployee(designation = \"engineer\" , firstName = \"JJTam\" , lastName\
    \ = \"Delhi\" , id = \"1\" )\n}\n```\n\n### 输出\n\n```\nid : 1\nfirstName : JJTam\n\
    lastName : Delhi\ndesignation : Engineer\n\nid : 1\nfirstName : JJTam\nlastName\
    \ : Delhi\ndesignation : engineer\n\nid : 1\nfirstName : JJTam\nlastName : Delhi\n\
    designation : engineer\n```\n\n## Kotlin：函数默认参数\n\n我们可以为函数参数指定默认值。当调用函数时未指定任何值时，将使用这些默认值。\n\
    \n```kotlin\nfun readFile(offset: Int = 0, numOfBytes: Int = 1024) {\n    println(\"\
    Reading file from offset : $offset, numOfBytes : $numOfBytes \")\n}\n\nreadFile()\n\
    ```\n\n由于 `readFile()` 调用时没有参数，`offset` 和 `numOfBytes` 被设置为默认值。\n\n```kotlin\n\
    readFile(10)\n```\n\n由于 `readFile()` 调用时带有一个参数 `10`，`offset` 被设置为 `10`，`numOfBytes`\
    \ 被设置为默认值 `1024`。\n\n```kotlin\nreadFile(10, 300)\n```\n\n由于 `readFile()` 调用时带有两个参数，`offset`\
    \ 被设置为 `10`，`numOfBytes` 被设置为 `1024`。\n\n### DefaultValues.kt\n\n```kotlin\nfun\
    \ readFile (offset: Int = 0 , numOfBytes: Int = 1024 ) {\n    println( \"Reading\
    \ file from offset : $offset, numOfBytes : $numOfBytes \" )\n}\n\nfun main (args:\
    \ Array<String>) {\n    readFile()\n    readFile( 10 )\n    readFile( 10 , 300\
    \ )\n}\n```\n\n### 输出\n\n```\nReading file from offset : 0, numOfBytes : 1024\n\
    Reading file from offset : 10, numOfBytes : 1024\nReading file from offset : 10,\
    \ numOfBytes : 300\n```\n\n命名参数进一步增强了这个特性，当你想为某些参数设置值，而其余参数使用默认值时。\n\n```kotlin\n\
    readFile(numOfBytes=500)\n```\n\n由于 `readFile()` 调用时指定了 `numOfBytes` 为 `500`\n\
    \n### FunctionsDemo.kt\n\n```kotlin\nfun readFile (offset: Int = 0 , numOfBytes:\
    \ Int = 1024 ) {\n    println( \"Reading file from offset : $offset, numOfBytes\
    \ : $numOfBytes \" )\n}\n\nfun main (args: Array<String>) {\n    readFile(numOfBytes=\
    \ 500 )\n}\n```\n\n### 输出\n\n```\nReading file from offset : 10, numOfBytes :\
    \ 1024, bufferSize :  JaysCode 500\n```\n\n## Kotlin：unit（或）void 函数\n\n返回 `Unit`\
    \ 的函数类似于 Java 中的 void 函数。如果函数不返回任何值，其返回类型为 `Unit`。\n\n### UnitDemo.kt\n\n```kotlin\n\
    fun welcome (name: String) : Unit {\n    println( \"Welcome $name\" )\n    return\
    \ Unit // 你也可以直接调用 return\n}\n\nfun main (args: Array<String>) {\n    var returnValue\
    \ = welcome( \"Hari JJTam\" )\n    println( \"Returned value is $returnValue\"\
    \ )\n}\n```\n\n### 输出\n\n```\nWelcome Hari JJTam\nReturned value is kotlin.Unit\n\
    ```\n\n在 unit 函数中，指定 `Unit` 类型和返回 `Unit` 是可选的。\n\n### UnitDemo.kt\n\n```kotlin\n\
    fun welcome (name: String) {\n    println( \"Welcome $name\" )\n}\n\nfun main\
    \ (args: Array<String>) {\n    var returnValue = welcome( \"Hari JJTam\" )\n \
    \   println( \"Returned value is $returnValue\" )\n}\n```\n\n## Kotlin：单表达式函数\n\
    \n当函数返回单个表达式时，可以省略花括号。\n\n### 示例\n\n```kotlin\nfun square(num: Int) = num * num\n\
    fun cube(num: Int) = num * num * num\n```\n\n### FunctionDemo.kt\n\n```kotlin\n\
    fun square (num: Int) = num * num\nfun cube (num: Int) = num * num * num\n\nfun\
    \ main (args: Array<String>) {\n    println( \"Square of 5 is ${square(5)}\" )\n\
