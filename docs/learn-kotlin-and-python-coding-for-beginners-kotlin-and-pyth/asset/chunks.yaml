    Value of falseState is : ${falseState}\")\n}\n```\n\n**Output**\n\n```\nValue\
    \ of trueState is : true\nValue of falseState is : false\n```\n\n# Kotlin: Strings\n\
    \n`String` is a collection of characters, enclosed in double quotes. Strings in\
