    ```\n\n## Remove an element from set\n\n`'remove'` method is used to remove element\
    \ from set.\n\n```\n>>> temp\n{2, 3, 5, 7, 11, 13}\n>>>\n>>> tem p . remove (\
    \ 2 )\n>>> temp\n{3, 5, 7, 11, 13}\n>>>\n>>> tem p . remove ( 1 1 )\n>>> temp\n\
