    \n![](img/Image00011.jpg)\n\n## 在 Kotlin 中定义变量\n\n变量是用于存储数据的命名内存位置。\n\n### 语法\n\
    \n```kotlin\nvar variableName : DataType = value\nval variableName : DataType\
    \ = value\n```\n\n`var` 和 `val` 都是关键字。\n\n例如：\n\n```kotlin\nvar a : Int  =10;\n\
    ```\n\n`a` 是 `Int` 类型，赋值为 `10`。\n\n```kotlin\nval b : Double = 1.23\n```\n\n`b`\
    \ 是 `Double` 类型，赋值为 `1.23`。关键字 `val` 用于定义常量（不可变对象）。\n\n**HelloWorld.kt**\n\n```kotlin\n\
    fun main (args: Array<String>) {\n    var a : Int  = 10 ;\n    val b : Double\
    \ = 1.23\n    println( \"a : ${a}\" )\n    println( \"b : ${b}\" )\n}\n```\n\n\
    ```\nC:\\>kotlinc HelloWorld.kt\nC:\\>kotlin HelloWorldKt\na : 10\nb : 1.23\n\
    ```\n\n## Kotlin 中的数据类型\n\nJava 有 `int`、`float`、`char` 等原始类型，Kotlin 呢？\n\n从用户的角度来看，Kotlin\
    \ 将一切设计为对象，但在运行时布尔值、数字和字符表示为原始类型。\n\n**HelloWorld.kt**\n\n```kotlin\nfun main\
    \ (args: Array<String>) {\n    var doubleVar: Double = 1.23\n    var floatVar:\
    \ Float = 1.23f\n    var longVar: Long = 123\n    var intVar: Int = 123\n    var\
    \ shortVar: Short = 123\n    var byteVar: Byte = 123\n    println( \"doubleVar\
    \ : ${doubleVar}\" )\n    println( \"doubleVar : ${floatVar}\" )\n    println(\
    \ \"longVar : ${longVar}\" )\n    println( \"intVar : ${intVar}\" )\n    println(\
    \ \"shortVar : ${shortVar}\" )\n    println( \"byteVar : ${byteVar}\" )\n}\n```\n\
    \n**输出**\n\n```\ndoubleVar : 1.23\ndoubleVar : 1.23\nlongVar : 123\nintVar : 123\n\
    shortVar : 123\nbyteVar : 123\n```\n\n## Kotlin: 可空类型\n\n默认情况下，Kotlin 引用类型（`Int`、`Float`、`Double`、`String`\
    \ 等）不接受 `null` 值。Kotlin 引入此特性是为了避免空指针异常。\n\n**Test.kt**\n\n```kotlin\nfun main\
    \ (args: Array<String>) {\n    var name : String = \"JJTam\"\n    name = null\n\
    }\n```\n\n当你尝试编译上述程序时，Kotlin 会抛出以下错误。\n\n```\nERROR: Null can not be a value of\
    \ a non-null type String (6, 9)\n```\n\n### 如何定义可以接受 null 值的变量？\n\n通过使用可空类型，你可以定义接受\
    \ `null` 值的变量。在引用类型后追加 `?` 以接受 `null` 值。\n\n| Type | Nullable type |\n|------|---------------|\n\
    | Int | Int? |\n| String | String? |\n| Double | Double? |\n| Person | Person?\
    \ |\n\n例如：\n\n```kotlin\nvar id: Int? = 1\nvar name: String? = \"JJTam\"\nvar\
    \ salary: Double? = 123.456\nvar person: Person? = Person( \"JJTam\" )\n\nid =\
    \ null\nname = null\nsalary = null\nperson = null\n```\n\n## Kotlin: 数字\n\nKotlin\
    \ 提供以下数据类型来支持数字。\n\n| Data Type | Size in Bits |\n|-----------|--------------|\n\
    | Double | 64 |\n| Float | 32 |\n| Long | 64 |\n| Int | 32 |\n| Short | 16 |\n\
    | Byte | 8 |\n"
