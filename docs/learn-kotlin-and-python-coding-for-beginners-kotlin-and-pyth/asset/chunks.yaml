    \ positional argument follows keyword argument\n```\n\n# Python 列表\n\n列表是方括号之间用逗号分隔的一组值。\n\
    \n```python\n>>> primes = [2, 3, 5, 7, 11, 13, 17, 19, 23]\n>>> primes\n[2, 3,\
    \ 5, 7, 11, 13, 17, 19, 23]\n```\n\n`primes` 是一个包含素数的列表。\n\n```python\n>>> students\
    \ = [\"Hari\", \"JJTam\", \"Kiran\", \"Ravi\"]\n>>> students\n['Hari', 'JJTam',\
    \ 'Kiran', 'Ravi']\n```\n\n`students` 是一个包含所有学生姓名的列表。\n\n列表可以包含任何类型的数据。\n\n```python\n\
    >>> objects = [1, 3, \"Hello\", 10.23]\n>>> objects\n[1, 3, 'Hello', 10.23]\n\
    ```\n\n你可以使用索引访问列表的元素。\n\n```python\n>>> objects\n[1, 3, 'Hello', 10.23]\n>>>\
    \ objects[0]\n1\n>>> objects[2]\n'Hello'\n```\n\n`objects[0]` 返回列表 `objects` 的第一个元素。\n\
    \n`objects[1]` 返回列表 `objects` 的第二个元素。\n\n`-ve` 索引也可用于访问列表的元素。\n\n```python\n>>>\
    \ objects\n[1, 3, 'Hello', 10.23]\n>>> objects[-1]\n10.23\n>>> objects[-3]\n3\n\
    ```\n\n## 切片\n\n切片用于获取子列表。\n\n| 示例 | 说明 |\n|---------|-------------|\n| `list[start:end]`\
    \ | 返回从起始索引（包含）到结束索引（不包含）的子列表。 |\n| `list[:end]` | 返回从索引 0（包含）到结束索引（不包含）的子列表。\
    \ |\n| `list[start:]` | 返回从起始索引到末尾的子列表。 |\n| `list[-2:]` | 返回从倒数第二个到末尾的列表。 |\n"
