    \ cardinality(Number of distinct elements) of the set.\n\n```\n>>> evenNumber\
    \ s = { 2 , 4 , 6 , 8 , 8 , 4 , 1 0 }\n>>> len(evenNumbers)\n5\n```\n\n### `x\
    \ in s` : Check whether element is in set or not\n\n`'in'` operator is used to\
