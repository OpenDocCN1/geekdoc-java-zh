- fmt: " # Python: Functions: Default Argument Values\n\nIn Python, you can pass default\
    \ values to function arguments.\n\n```python\ndef welcomeMessage(name='user',\
    \ message='Hello'):\n    print(message, name)\n```\n\nYou can call above function\
    \ in following ways.\n\n`welcomeMessage()` : prints `Hello user`\n\n`welcomeMessage('JJTam')`\
    \ : prints `Hello JJTam`\n\n`welcomeMessage('JJTam', \"Welcome\")` : prints `Welcome\
    \ JJTam`\n\n```python\n# test.py\ndef welcomeMessage(name='user', message='Hello'):\n\
    \    print(message, name)\n\nwelcomeMessage()\nwelcomeMessage('JJTam')\nwelcomeMessage('JJTam',\
    \ \"Welcome\")\n```\n\n```\n$ python3 test.py\nHello user\nHello JJTam\nWelcome\
    \ JJTam\n```\n\n**Note:** Default value is evaluated only once. So be cautious,\
    \ while using mutable objects like lists, dictionary etc., For example, following\
    \ function accumulates the result in subsequent calls.\n\n```python\n# test.py\n\
    def getEvenNumbers(limit, result=[]):\n    i = 2\n    while (i < limit):\n   \
    \     result.append(i)\n        i += 2\n    return result\n\nprint(getEvenNumbers(4))\n\
    print(getEvenNumbers(8))\nprint(getEvenNumbers(12))\n```\n\n```\n$ python3 test.py\n\
    [2]\n[2, 2, 4, 6]\n[2, 2, 4, 6, 2, 4, 6, 8, 10]\n```\n\nIf you don't want the\
    \ default to be shared between subsequent calls, you can write the function like\
    \ below instead:\n\n```python\ndef getEvenNumbers(limit, result=None):\n    if\
    \ result is None:\n        result = []\n    i = 2\n    while (i < limit):\n  \
    \      result.append(i)\n        i += 2\n    return result\n\nprint(getEvenNumbers(4))\n\
    print(getEvenNumbers(8))\nprint(getEvenNumbers(12))\n```\n\n```\n$ python3 test.py\n\
    [2]\n[2, 4, 6]\n[2, 4, 6, 8, 10]\n```\n\n# Python: Functions: Keyword Arguments\n\
    \nFunctions can also be called using keyword arguments, i.e, by using argument\
    \ names.\n\n```python\ndef printEmployee(id, firstName, lastName, designation='Engineer'):\n\
    \    print(id, firstName, lastName, designation)\n```\n\nAbove function can be\
    \ called in following ways.\n\n```python\nprintEmployee(id=1, lastName='Delhi',\
    \ firstName='Hari')\nprintEmployee(lastName='JJTam', firstName='Rama', id=2)\n\
    printEmployee(designation='Tech Lead', lastName='Battu', firstName='Gopi', id=3)\n\
    ```\n\n```python\n# test.py\ndef printEmployee(id, firstName, lastName, designation='Engineer'):\n\
    \    print(id, firstName, lastName, designation)\n\nprintEmployee(id=1, lastName='Delhi',\
    \ firstName='Hari')\nprintEmployee(lastName='JJTam', firstName='Rama', id=2)\n\
    printEmployee(designation='Tech Lead', lastName='Battu', firstName='Gopi', id=3)\n\
    ```\n\n```\n$ python3 test.py\n1 Hari Delhi Engineer\n2 Rama JJTam Engineer\n\
    3 Gopi Battu Tech Lead\n```\n\n**Note:**\n\na. Keyword arguments must follow positional\
    \ arguments.\n\n```python\ndef printEmployee(id, firstName, lastName, designation='Engineer'):\n\
    \    print(id, firstName, lastName, designation)\n\nprintEmployee(1, lastName='Delhi',\
    \ firstName='Hari', \"engineer\")\n```\n\nWhen you tries to compile above file,\
    \ you will get following error.\n\n```\n$ python3 test.py\n  File \"test.py\"\
    , line 4\n    printEmployee(1, lastName='Delhi', firstName='Hari', \"engineer\"\
    )\n                                                         ^^^^^^^^^\nSyntaxError:\
    \ positional argument follows keyword argument\n```\n\n# Python Lists\n\nList\
    \ is group of values in between square brackets separated by commas.\n\n```python\n\
    >>> primes = [2, 3, 5, 7, 11, 13, 17, 19, 23]\n>>> primes\n[2, 3, 5, 7, 11, 13,\
    \ 17, 19, 23]\n```\n\n`primes` is a list that contain prime numbers.\n\n```python\n\
    >>> students = [\"Hari\", \"JJTam\", \"Kiran\", \"Ravi\"]\n>>> students\n['Hari',\
    \ 'JJTam', 'Kiran', 'Ravi']\n```\n\n`students` is a立新 that contain all student\
    \ names.\n\nList can contain any type of data.\n\n```python\n>>> objects = [1,\
    \ 3, \"Hello\", 10.23]\n>>> objects\n[1, 3, 'Hello', 10.23]\n```\n\nYou can access\
    \ elements of list by using index.\n\n```python\n>>> objects\n[1, 3, 'Hello',\
    \ 10.23]\n>>> objects[0]\n1\n>>> objects[2]\n'Hello'\n```\n\n`objects[0]` return\
    \ the first element of list `objects`.\n\n`objects[1]` return the second element\
    \ of list `objects`.\n\n`-ve` indexes also used to access elements of a list.\n\
    \n```python\n>>> objects\n[1, 3, 'Hello', 10.23]\n>>> objects[-1]\n10.23\n>>>\
    \ objects[-3]\n3\n```\n\n## Slicing\n\nSlicing is used to get sub list.\n\n| Example\
    \ | Description |\n|---------|-------------|\n| `list[start:end]` | Returns sub\
    \ list from index start (included) to end index (excluded). |\n| `list[:end]`\
    \ | Returns sub list from index 0(included) to end index (excluded). |\n| `list[start:]`\
    \ | Return sub list from index start to till end. |\n| `list[-2:]` | Return list\
    \ from 2nd last to end. |"
