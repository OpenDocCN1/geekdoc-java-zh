    \ test.py\n[2, 4, 6, 6, 4, 2]\nRemoving last element  2\n[2, 4, 6, 6, 4]\nRemoving\
    \ element at index 2  6\n[2, 4, 6, 4]\n```\n\n## Python: list: clear all elements\
    \ in the list\n\nList provides `clear` method to clear all elements in the list.\n\
    \n`test.py`\n\n```\nlist = [2, 4, 6, 6, 4, 2]\nprint(list)\nlist.clear()\nprint(list)\n\
    ```\n\n```\n$ python3 test.py\n[2, 4, 6, 6, 4, 2]\n[]\n```\n\n## Python: list:\
    \ index: Get index of element\n\n`list.index(x)`\n\n`list` provides index method,\
    \ which returns the index of the first item whose value is x.\n\n`test.py`\n\n\
    ```\nlist = [2, 4, 6, 6, 4, 2]\nprint(list)\nprint(\"index of 2 is \", list.index(2))\n\
    print(\"index of 4 is \", list.index(4))\nprint(\"index of 6 is \", list.index(6))\n\
    ```\n\n```\n$ python3 test.py\n[2, 4, 6, 6, 4, 2]\nindex of 2 is  0\nindex of\
