    \ b)` | 返回一个随机整数 N，满足 a <= N <= b。它等价于 `random.randrange(a, b+1)` |\n| `random.choice(seq)`\
    \ | 从非空序列 seq 中返回一个随机元素。如果 seq 为空，则引发 IndexError。 |\n| `random.shuffle(list)`\
    \ | 就地打乱一个列表，即对其进行随机排列 |\n| `random.random()` | 返回区间 [0.0, 1.0) 内的下一个随机浮点数。 |\n\
    | `random.uniform(a, b)` | 返回一个随机浮点数 N，当 a <= b 时满足 a <= N <= b，当 b < a 时满足 b\
