    \  var myChar: Char = 'a'\n    println(\"Value of myChar is : ${myChar}\")\n}\n\
    ```\n\n**Output**\n\n```\nValue of myChar is : a\n```\n\nAll the escape sequences\
    \ that are supported by Java are also supported by Kotlin.\n\n## Convert Character\
    \ to Int\n\n`Char` type provides `toInt()` method to convert a character to integer.\n\
    \n```kotlin\nfun main(args: Array<String>) {\n    var myChar: Char = 'a'\n   \
    \ println(\"Value of myChar is : ${myChar}\")\n    println(\"Value of myChar in\
