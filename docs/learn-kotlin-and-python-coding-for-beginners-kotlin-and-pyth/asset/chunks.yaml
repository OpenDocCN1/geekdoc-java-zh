    \n```\nValue of x is  : 10\nValue of y is  : 20\n```\n\n### 单例对象可以有超类型吗？\n\n是的，单例对象可以有超类型。\n\
    \n**示例**\n\n```kotlin\nobject mySingleTonObj : Arithmetic {\n    override fun\
    \ sum(x: Int, y: Int): Int {\n        return x + y\n    }\n}\n```\n\n查看下面的可运行应用。\n\
    \n**HelloWorld.kt**\n\n```kotlin\ninterface Arithmetic {\n    fun sum(x: Int,\
    \ y: Int): Int\n}\n\nclass MyClass {\n    object mySingleTonObj : Arithmetic {\n\
    \        override fun sum(x: Int, y: Int): Int {\n            return x + y\n \
    \       }\n    }\n\n    fun getSum(x: Int, y: Int): Int {\n        return mySingleTonObj.sum(x,\
    \ y)\n    }\n}\n\nfun main(args: Array<String>) {\n    var obj = MyClass()\n \
    \   var result = obj.getSum(10, 20)\n    println(\"Sum of 10 and 20 is : $result\"\
    )\n}\n```\n\n**Output**\n\n```\nSum of 10 and 20 is : 30\n```\n\n### 对象声明可以是局部的吗？\n\
    \n对象声明不能是局部的。例如，你不能在函数内部定义它们。\n\n**HelloWorld.kt**\n\n```kotlin\nfun main(args:\
    \ Array<String>) {\n    object mySingleTonObj {\n        fun sum(x: Int, y: Int):\
    \ Int {\n            return x + y\n        }\n    }\n}\n```\n\n当你尝试编译上述程序时，你会遇到如下错误。\n\
    \n```\nNamed object 'mySingleTonObj' is a singleton and cannot be local. Try to\
    \ use anonymous object instead\n```\n\n## Kotlin：伴生对象\n\n通过使用伴生对象，你可以使用类名来访问成员（无需定义对象）。\n\
    \n**HelloWorld.kt**\n\n```kotlin\nclass TestClass {\n    companion object {\n\
    \        fun sayHello() {\n            println(\"Hello\")\n        }\n    }\n\
    }\n\nfun main(args: Array<String>) {\n    TestClass.sayHello()\n}\n```\n\n**Output**\n\
    \n```\nHello\n```\n\n正如你在上面的代码片段中看到的，我使用 `TestClass` 调用了伴生对象的 `sayHello` 函数（没有创建\
    \ `TestClass` 的任何对象）。\n\n你可以为伴生对象命名。\n\n```kotlin\ncompanion object FunModules\
    \ {\n    fun sayHello() {\n        println(\"Hello\")\n    }\n}\n```\n\n**HelloWorld.kt**\n\
    \n```kotlin\nclass TestClass {\n    companion object FunModules {\n        fun\
    \ sayHello() {\n            println(\"Hello\")\n        }\n    }\n}\n\nfun main(args:\
    \ Array<String>) {\n    TestClass.sayHello()\n}\n```\n\n**Output**\n\n```\nHello\n\
    ```\n\n通过在伴生对象上添加 `@JvmStatic` 注解，你可以在任何 Java 类中将其用作静态成员。\n\n**HelloWorld.kt**\n\
    \n```kotlin\nimport kotlin.jvm.JvmStatic\n\nclass TestClass {\n    companion object\
    \ {\n        @JvmStatic\n        fun sayHello() {\n            println(\"Hello\"\
    )\n        }\n    }\n}\n```\n\n**CompanionDemo.java**\n\n```java\npublic class\
    \ CompanionDemo {\n    public static void main(String args[]) {\n        TestClass.sayHello();\n\
    \    }\n}\n```\n\n**Output**\n\n```\nHello\n```\n\n## Kotlin：匿名内部类\n\n匿名内部类可以使用对象表达式来创建。\n\
    \n**示例**\n\n```kotlin\nprintMessage(object : PrinterUtil() {\n    override fun\
    \ welcomeMessage() {\n        println(\"Good Morning customer\")\n    }\n})\n\
    ```\n\n查看下面的可运行应用。\n\n**HelloWorld.kt**\n\n```kotlin\nopen class PrinterUtil {\n\
    \    open fun welcomeMessage() {\n        println(\"Welcome user\")\n    }\n}\n\
    \nfun printMessage(printUtl: PrinterUtil) {\n    printUtl.welcomeMessage()\n}\n\
    \nfun main(args: Array<String>) {\n    printMessage(object : PrinterUtil() {\n\
    \        override fun welcomeMessage() {\n            println(\"Good Morning customer\"\
    )\n        }\n    })\n}\n```\n\n**Output**\n\n```\nGood Morning customer\n```\n\
    \n## Kotlin：抽象类\n\n抽象类可以包含没有实现的方法。抽象类使用 `abstract` 关键字定义。\n\n**示例**\n\n```kotlin\n\
    interface Arithmetic {\n    fun sum(x: Int, y: Int): Int\n    fun sub(x: Int,\
    \ y: Int): Int\n    fun mul(x: Int, y: Int): Int\n    fun div(x: Int, y: Int):\
    \ Int\n}\n\nabstract class ArithmeticImpl : Arithmetic {\n    override fun sum(x:\
    \ Int, y: Int): Int {\n        return x + y\n    }\n\n    override fun sub(x:\
    \ Int, y: Int): Int {\n        return x - y\n    }\n}\n```\n\n你不能为抽象类定义实例（对象）。\n\
    \n### 抽象方法\n"
- fmt: " Just like how you defined abstract class, you can define abstract method\
    \ (method without implementation) using the keyword `abstract`.\n\n```kotlin\n\
    abstract class ArithmeticImpl : Arithmetic{\n  override fun sum (x : Int, y :\
    \ Int) : Int{\n    return x + y\n  }\n  override fun sub (x : Int, y : Int) :\
    \ Int{\n    return x - y\n  }\n  abstract fun areaofCircle (radius : Int) : Int\n\
    }\n```\n\nIn the above snippet, I declared `areaOfCircle` as abstract method.\
    \ Any concrete class that is extending this abstract class must provide implementation\
    \ to all the abstract methods.\n\n```kotlin\nclass ConcreteArithmetic : ArithmeticImpl()\
    \ {\n  override fun mul (x: Int, y: Int): Int {\n    return x * y\n  }\n  override\
    \ fun div (x: Int, y: Int): Int {\n    return x / y\n  }\n  override fun areaofCircle\
    \ (radius: Int): Double {\n    return 3.14 * radius * radius\n  }\n}\n```\n\n\
    Find the below working application.\n\n`HelloWorld.kt`\n```kotlin\ninterface Arithmetic\
    \ {\n  fun sum (x: Int, y: Int): Int\n  fun sub (x: Int, y: Int): Int\n  fun mul\
    \ (x: Int, y: Int): Int\n  fun div (x: Int, y: Int):Int\n}\n\nabstract class ArithmeticImpl\
    \ : Arithmetic {\n  override fun sum (x: Int, y: Int): Int {\n    return x + y\n\
    \  }\n  override fun sub (x: Int, y: Int): Int {\n    return x - y\n  }\n  abstract\
    \ fun areaofCircle (radius: Int): Double\n}\n\nclass ConcreteArithmetic : ArithmeticImpl()\
    \ {\n  override fun mul (x: Int, y: Int): Int {\n    return x * y\n  }\n  override\
    \ fun div (x: Int, y: Int): Int {\n    return x / y\n  }\n  override fun areaofCircle\
    \ (radius: Int): Double {\n    return 3.14 * radius * radius\n  }\n}\n\nfun main\
    \ (args: Array<String>) {\n  var obj = ConcreteArithmetic()\n  var sumOf10And20\
    \ = obj.sum( 10 , 20 )\n  var subOf10And20 = obj.sub( 10 , 20 )\n  var mulOf10And20\
    \ = obj.mul( 10 , 20 )\n  var divOf10And20 = obj.div( 10 , 20 )\n  var areaOfCircle\
    \ = obj.areaofCircle( 5 )\n  println( \"sumOf10And20 = $sumOf10And20\" )\n  println(\
    \ \"subOf10And20 = $subOf10And20\" )\n  println( \"mulOf10And20 = $mulOf10And20\"\
    \ )\n  println( \"divOf10And20 = $divOf10And20\" )\n  println( \"areaOfCircle\
    \ = $areaOfCircle\" )\n}\n```\n\nOutput\n```\nsumOf10And20 = 30\nsubOf10And20\
    \ = -10\nmulOf10And20 = 200\ndivOf10And20 = 0\nareaOfCircle = 78.5\n```\n\n##\
    \ Kotlin: functions\n\nFunction is a block of statements, used to reuse the code.\
    \ In kotlin, there are two types of funcitons.\n\n* Kotlin library functions (ex:\
    \ `print`, `sqrt` etc.,)\n* User defined functions."
