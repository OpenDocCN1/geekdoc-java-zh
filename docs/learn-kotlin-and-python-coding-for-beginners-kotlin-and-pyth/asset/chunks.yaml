    \n`readlines` 方法用于将文件的所有行读取为列表。\n\n```\n>>> data = f.readlines()\n>>> data\n['First\
    \ line\\n', 'Second line\\n', 'Third line\\n', 'Fourth line\\n']\n```\n\n### 使用\
    \ for 循环读取文件\n\n要从文件中读取行，可以对文件对象进行循环。\n\n```\n>>> f = open(\"/Users/hariJJTam_Delhi/data.txt\"\
    )\n>>> for line in f:\n...     print(line)\n...\nFirst line\n\nSecond line\n\n\
    Third line\n\nFourth line\n```\n\n如您观察到的输出，每行之后都打印了换行。您可以通过向 print 方法传递 `end`\
    \ 参数来消除这一点。\n\n```\n>>> f = open(\"/Users/hariJJTam_Delhi/data.txt\")\n>>> for\
    \ line in f:\n...     print(line, end='')\n...\nFirst line\nSecond line\nThird\
    \ line\nFourth line\n```\n\n## Python：向文件写入数据\n\nPython 提供以下方法向文件写入数据。\n\n- `write()`：用于向文件写入固定序列的字符。返回写入文件的字符数。\n\
    - `writelines()`：`writelines` 可以写入字符串列表。\n\n```\n>>> f = open(\"/Users/hariJJTam_Delhi/data.txt\"\
    , 'w')\n>>>\n>>> f.write(\"Hello, How are you\\n\")\n19\n>>> f.write(\"I am fine,\
    \ How is u\\n\")\n20\n>>> data = [\"first line\\n\", \"second line\\n\"]\n>>>\
    \ f.writelines(data)\n>>> f.close()\n>>>\n>>> f = open(\"/Users/hariJJTam_Delhi/data.txt\"\
    )\n>>> for line in f:\n...     print(line, end='')\n...\nHello, How are you\n\
    I am fine, How is u\nfirst line\nsecond line\n```\n\n`write` 方法只接受字符串参数。如果您尝试插入非字符串数据，将会得到\
    \ `TypeError`。\n\n```\n>>> f = open(\"/Users/hariJJTam_Delhi/data.txt\", 'w')\n\
    >>> f.write(123)\nTraceback (most recent call last):\n  File \"<stdin>\", line\
    \ 1, in <module>\nTypeError: write() argument must be str, not int\n```\n\n要写入字符串以外的内容，需要先将其转换为字符串。通过使用\
    \ `str` 函数，您可以将非字符串数据转换为字符串。\n\n```\n>>> a = 123.45\n>>> temp = str(a)\n>>> temp\n\
    '123.45'\n>>>\n>>> f = open(\"/Users/hariJJTam_Delhi/data.txt\", 'w')\n>>> f.write(temp)\n\
    6\n>>>\n>>> f.close()\n>>>\n>>> f = open(\"/Users/hariJJTam_Delhi/data.txt\")\n\
    >>> f.read()\n'123.45'\n```\n\n## Python：类和对象\n\n类是创建对象的蓝图。\n\n### 语法\n\n```\n\
    class ClassName:\n    <statement-1>\n    ...\n    <statement-N>\n```\n\n`class`\
