    \          println(\"Hello\")\n        }\n    }\n}\n```\n\n**CompanionDemo.java**\n\
    \n```java\npublic class CompanionDemo {\n    public static void main(String args[])\
    \ {\n        TestClass.sayHello();\n    }\n}\n```\n\n**Output**\n\n```\nHello\n\
    ```\n\n## Kotlin: Anonymous Inner class\n\nAnonymous inner classes can be created\
