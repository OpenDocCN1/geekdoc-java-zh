    \n```\n>>> numbers\n[2, 4, 6, 8, 10, 1, 3, 5, 7, 9]\n>>> numbers[0] = 12\n>>>\
    \ numbers[1] = 14\n>>> numbers\n[12, 14, 6, 8, 10, 1, 3, 5, 7, 9]\n```\n\n## Add\
    \ elements to end of list\n\nList provides `append` method to add new elements\
    \ to the end of a list.\n\n```\n>>> numbers\n[12, 14, 6, 8, 10, 1, 3, 5, 7, 9]\n\
    >>>\n>>> numbers.append(11)\n>>> numbers.append(13)\n>>>\n>>> numbers\n[12, 14,\
    \ 6, 8, 10, 1, 3, 5, 7, 9, 11, 13]\n```\n\n## Assignment to slices\n\nIf you want\
    \ to replace sequence of elements in a list, you can use slice notation.\n\n`numbers[2:5]\
