    ## Python interactive command line


    Open command prompt (or) terminal and type `python3` command. It opens python
    interactive session.


    ```

    $ python3

    Python 3.5.0 (v3.5.0:374f501f4567, Sep 12 2015, 11:00:19)

    [GCC 4.2.1] on darwin

    Type "help", "copyright", "credits" or "license" for more information.

    >>>

    ```


    ### How to exit from python interpreter


    On Windows, a `Ctrl-Z` gets you out of this session; on Unix, try `Ctrl-D` instead.
    Another way is simply call the `quit()` function to quit from python.


    ```

    $ python3

    Python 3.5.0 (v3.5.0:374f501f4567, Sep 12 2015, 11:00:19)

    [GCC 4.2.1] on darwin

    Type "help", "copyright", "credits" or "license" for more information.

    >>> quit()

    $

    ```


    You can type any statement (or) expressions in python interpreter, interpreter
    execute those statements and gives you the result.


    ```

    >>> 10+20

    30

    >>> 20*20

    400

    >>> print(''Hello World'')

    Hello World

    ```


    **Note:** On Unix, the Python 3.x interpreter is not installed by default with
    name `python`, so that it does not conflict with other installed Python 2.x executable.


    ## Python: Operators


    An operator is a symbol, which perform an operation. Following are the operators
    that python supports.


    - Arithmetic Operators

    - Relational Operators

    - Assignment Operators

    - Logical Operators

    - Bitwise Operators

    - Membership Operators

    - Identity Operators


    ### Arithmetic Operators in python


    Following are the arithmetic operators supported by python.


    | Operator | Description | Example |

    | + | Addition | `2+3` |

    | - | Subtraction | `2-3` |

    | * | Multiplication | `2*3` |

    | / | Division always returns a float value. To get only integer result use `//`.
    | `2/3` returns `0.6666666666666666` |

    | // | Floor division discards the fractional part | `2//3` returns `0` |

    | % | Returns the remainder of the division. | `2%3` |

    | ** | Power | `2**3` returns 2 power 3 = `8` |


    ```

    >>> 4 + 2

    6

    >>> 4 - 2

    2

    >>> 4 / 2

    2.0

    >>> 4 * 2

    8

    >>> 4 // 2

    2

    >>> 4 ** 2

    16

    ```


    ### Relational Operators in python


    Relational operators determine if one operand is greater than, less than, equal
    to, or not equal to another operand.


    | Operator | Description | Example |

    | == | Equal to | `a==b` returns true if a is equal to b, else false |

    | != | Not equal to | `a!=b` returns true if a is not equal to b, else false.
    |

    | > | Greater than | `a>b` returns true, if a is > b, else false. |

    | >= | Greater than or equal to | `a>=b` returns true, if a is >= b, else false.
    |

    | < | Less than | `a<b` returns true, if a is < b, else false. |

    | <= | Less than or equal to | `a<=b` returns true, if a is <= b, else false.
    |


    ```

    >>> a = 10

    >>> b = 12

    >>> a == b

    False

    >>> a != b

    True

    >>> a > b

    False

    >>> a >= b

    False

    >>> a < b

    True

    >>> a <= b

    True

    ```


    ### Assignment operators in python


    Assignment operators are used to assign value to a variable. Following are the
    assignment operators provided by python.


    | Operator | Description |

    | = | `a=10` assigns 10 to variable a |

    | += | `a+=10` is same as `a=a+10` |

    | -= | `a-=10` is same as `a=a-10` |

    | *= | `a*=10` is same as `a=a*10` |

    | /= | `a/=10` is same as `a=a/10` |

    | //= | `a//=10` is same as `a=a//10` |

    | %= | `a%=10` is same as `a=a%10` |

    | **= | `a**=10` is same as `a=a**10` |


    ```

    >>> a = 10

    >>> a

    10

    >>>

    >>> a += 10

    >>> a

    20

    >>>

    >>> a -= 10

    >>> a

    10

    >>>

    >>> a *= 10

    >>> a

    100

    >>>

    >>> a /= 10

    >>> a

    10.0

    >>>

    >>> a //= 10

    >>> a

    1.0

    >>>

    >>> a **= 10

    >>> a

    1.0

    ```


    #### Multiple Assignments


    You can assign values to multiple variables simultaneously.


    ```

    >>> a, b, c = 10, ''hello'', 12.345

    >>> a

    10

    >>> b

    ''hello''

    >>> c

    12.345

    ```


    ### Logical Operators in python


    Following are the logical operators supported by python.


    | Operator | Description |

    | and | ''a and b'' returns true if both a, b are true. Else false. |

    | or | ''a or b'' return false, if both a and b are false, else true. |

    | not | ''not a'' Returns True if a is false, true otherwise |


    ```

    >>> a = bool(0)

    >>> b = bool(1)

    >>>

    >>> a

    False

    >>> b

    True

    >>>

    >>> a and b

    False

    >>>

    >>> a or b

    True

    >>>

    >>> not a

    True

    >>>

    >>> not(a and b)

    True

    >>>

    >>> not(a or b)

    False

    ```


    ### Bitwise Operators in python


    Python supports following bitwise operators, to perform bit wise operations on
    integers.


    | Operator | Description |

    | >> | bitwise right shift |

    | << | bitwise left shift |

    | & | bitwise and |

    | ^ | Bitwise Ex-OR |

    | &#124; | Bitwise or |

    | ~ | Bitwise not |


    Following post, explains bitwise operators clearly. http://self-learning-java-tutorial.blogspot.in/2014/02/bit-wise-operators.html


    ```

    >>> a = 2

    >>> a >> 1

    1

    >>>

    >>> a << 1

    4

    >>>

    >>> a & 3

    2

    >>> a | 3

    3

    >>>

    >>> ~a

    -3

    ```


    ### Membership operators in python


    Membership operators are used to test whether a value or variable is found in
    a sequence (string, list, tuple, set and dictionary).


    | Operator | Description |

    | in | Return true if value/variable is found in the sequence, else false. |

    | not in | Return True if value/variable is not found in the sequence, else false
    |


    ```

    >>> primeNumbers = [2, 3, 5, 7, 11]

    >>> 2 in primeNumbers

    True

    >>> 4 in primeNumbers

    False

    >>> 4 not in primeNumbers

    True

    ```


    ### Identity operators in python


    Identity operators are used to compare the memory locations of two objects.


    | Operator | Description |

    | is | `a is b` returns true, if both a and b point to the same object, else false.
    |

    | is not | `a is not b` returns true, if both a and b not point to the same object,
    else false. |


    ```

    >>> name1 = "Hari JJTam"

    >>> name2 = name1

    >>> name3 = "Hari JJTam"

    >>> name4 = "abc"

    >>>

    >>> name1 is name2

    True

    >>> name1 is name3

    False

    >>> name1 is name4

    False

    >>> name1 is not name3

    True

    ```


    ## Python: Short circuit operators


    Boolean operators `and`, `or` are called short circuit operators, it Is because
    evaluation of expression stops, whenever the outcome determined.


    ### Why Boolean and is called short circuit operator?


    Since if the first statement in the expression evaluates to false, then python
    won''t evaluates the entire expression. So boolean `and` is called short circuit
    and.


    ### Why Boolean OR is called short circuit operator?


    Since if the first statement evaluates to true, then Python won''t evaluates the
    entire expression.


    ## Strings in python


    String is a sequence of character specified in single quotes(''…''), double quotes("…"),
    (or) triple quotes ("""…""" or '''''' … ''''''). Strings in python are immutable,
    i.e., an object with a fixed value.


    ```

    >>> str1 = ''Hello World''

    >>> str2 = "Hello World"

    >>> str3 = """Hello

    ... World... """

    >>> str1

    ''Hello World''

    >>> str2

    ''Hello World''

    >>> str3

    ''Hello\nWorld\n''

    ```


    Special characters are escaped with backslash.


    ```

    >>> message = ''He don\''t know about this''

    >>> message

    "He don''t know about this"

    ```


    `print` method treat characters preceded by \ (backslash) as special characters.


    ```

    >>> print(''firstline\nsecondline'')

    firstline

    secondline

    ```


    As you observe output, `\n` prints new line. If you don''t want characters prefaced
    by \ to be interpreted as special characters, you can use raw strings by adding
    an `r` before the first quote


    ```

    >>> print(r''firstline\nsecondline'')

    firstline\nsecondline

    ```


    ### Concatenate strings


    ''+'' operator is used to concatenate strings.


    ```

    >>> hello = "Hello,"

    >>> message = "How are you"

    >>> info = hello + message

    >>> info

    ''Hello,How are you''

    ```


    Two or more string literals next to each other are automatically concatenated.


    ```

    >>> ''Hello '' "How " ''are '' ''you''

    ''HelloHowareyou''

    ```


    ### Repeat strings


    By using ''*'', we can repeat the strings.


    ```

    >>> ''hi'' * 2

    ''hihi''

    >>> ''hi'' * 2 + ''hello'' * 3

    ''hihihellohellohello''

    ```


    ### Access specific character from strings


    You can access, specific character of string using index position.


    ```

    >>> name = "Hello World"

    >>> name[0]

    ''H''

    >>> name[6]

    ''W''

    ```


    Index 0 represents 1st character, 1 represents 2nd character etc.,


    You can also use negative numbers for indexing. -1 represents last character;
    -2 represents second-last character etc.,


    ```

    >>> name

    ''Hello World''

    >>> name[-1]

    ''d''

    >>> name[-2]

    ''l''

    >>> name[-7]

    ''o''

    ```


    ### Slicing


    Slicing is used to get sub string of given string.


    | Example | Description |

    | string[start:end] | Returns sub string from index start (included) to end index
    (excluded). |

    | string[:end] | Returns sub string from index 0(included) to end index (excluded).
    |

    | string[start:] | Return sub string from index start to till end. |'
