    False\n>>>\n>>> 2 i n evenNumbers\nTrue\n```\n\n### `x not in s` : Check whether\
    \ element is in set or not\n\n`'not in'` operator is opposite of `'in'` operator,\
    \ return true if the element is not in set, else false.\n\n```\n>>> evenNumbers\n\
    {8, 10, 2, 4, 6}\n>>>\n>>> 1 0 no t i n evenNumbers\nFalse\n>>>\n>>> 10 0 no t\
    \ i n evenNumbers\nTrue\n```\n\n### `isdisjoint(other)`\n\nReturn true if two\
    \ sets are disjoint, else false. Two sets are said to be disjoint if they have\
    \ no element in common.\n\n```\n>>> evenNumbers\n{8, 10, 2, 4, 6}\n>>>\n>>> evenNumber\
    \ s . isdisjoint( { 1 , 3 , 5 , 7 })\nTrue\n>>>\n>>> evenNumber s . isdisjoint(\
    \ { 1 , 3 , 5 , 7 , 8 })\nFalse\n```\n\n### `issubset(other)`\n\nReturn true,\
    \ if this set is subset of other, else false.\n\n```\n>>> evenNumbers\n{8, 10,\
