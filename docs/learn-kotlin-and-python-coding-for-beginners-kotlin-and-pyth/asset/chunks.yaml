    - Python：生成随机数\n\n# 快速学习 KOTLIN\n## 面向初学者的编程实战项目\n### 作者：J J TAM\n\n## Kotlin\
    \ 简介\n\nKotlin 是一种高级编程语言，运行在 JVM 上。Kotlin 将源代码编译为 Java 字节码，并使用 JVM 运行应用程序。你可以交替使用\
    \ Java 和 Kotlin，这意味着你可以从 Java 调用 Kotlin 函数，反之亦然。\n\n### 先决条件\n\n需要具备 Java 基础知识。\n\
    \n### Kotlin 是面向对象的吗？\n\n是的，Kotlin 是面向对象的语言，你可以创建类、对象，并应用多态、继承等面向对象编程概念。\n\n###\
    \ Kotlin 是函数式语言吗？\n\n是的，Kotlin 是一种函数式语言。在函数式编程语言中，函数是基本的构建块，你可以返回一个函数，将函数作为参数传递给其他函数等。\n\
    \n### Kotlin 是开源的吗？\n\n是的。\n\n### 使用 Kotlin 可以开发哪类应用程序？\n\n- 构建移动应用程序\n- 开发服务器端应用程序\n\
    - 你可以开发任何能用 Java 开发的应用程序\n"
- fmt: " # Kotlin 基础教程\n\n## 常见问题\n\n### 可以在浏览器中运行 Kotlin 代码吗？\n\nKotlin 可以编译为 JavaScript，因此你可以在浏览器中运行应用程序。\n\
    \n### Kotlin 是静态类型语言吗？\n\n是的，Kotlin 是静态类型语言。对于静态类型语言，变量的类型在编译时已知。你可以参考我的文章 *statically\
    \ vs dynamically typed languages* 来了解静态类型和动态类型语言的区别。\n\n### Kotlin 可以推断类型吗？\n\n\
    是的，与 Java 不同，你不需要在定义变量时指定类型。Kotlin 会根据上下文推断类型。\n\n例如：\n\n```kotlin\nvar name =\
    \ \"JJTam\"\n```\n\n由于 `\"JJTam\"` 被赋值给变量 `name`，Kotlin 推断其类型为 `String`。\n\n```kotlin\n\
    var age = 28\n```\n\n由于数字 `28` 被赋值给变量 `age`，Kotlin 推断其类型为 `Int`。\n\n## 安装 Kotlin\n\
    \nKotlin 可以通过命令行模式安装，也可以安装在 Eclipse、IntelliJ 等 IDE 中。\n\n- 在命令行模式下安装 Kotlin\n\
    - 在 Eclipse 中安装 Kotlin\n- 在 IntelliJ 中安装 Kotlin\n\n### 在命令行模式下安装 Kotlin\n\n从以下位置下载\
    \ Kotlin。在撰写本文时，`1.1.4` 是最新版本。\n\n`https://github.com/JetBrains/kotlin/releases/tag/v1.1.4`\n\
    \n解压下载的 zip 文件，并将 `bin` 目录添加到系统路径。\n\n打开新的命令提示符并输入 `kotlinc` 命令。\n\n```\nC:\\\
    >kotlinc\nWelcome to Kotlin version 1.1.4 (JRE 1.8.0_102-b14)\nType :help for\
    \ help, :quit for quit\n>>>\n```\n\n如上面的输出所示，它显示了 Kotlin 版本和底层 JRE 版本。\n\n输入命令\
    \ `:help` 以列出可用命令。\n\n```\nC:\\>kotlinc\nWelcome to Kotlin version 1.1.4 (JRE\
    \ 1.8.0_102-b14)\nType :help for help, :quit for quit\n>>>\n```\n\n你可以在 Kotlin\
    \ 提示符中计算表达式。\n\n```\n>>> var a = 10\n>>> var b = 20\n>>> a + b\n30\n>>> a-b\n\
    - 10\n>>> a*b\n200\n>>> a/b\n0\n>>> println(a)\n10\n>>> println( \"value of b\
    \ : \" + b)\nvalue of b : 20\n```\n\n## Kotlin: Hello World 程序\n\n`.kt` 是 Kotlin\
    \ 文件的扩展名。\n\n创建文件 `HelloWorld.kt`，内容如下。\n\n**HelloWorld.kt**\n\n```kotlin\nfun\
    \ main (args:Array<String>){\n    println( \"Hello World\" )\n}\n```\n\n关键字 `fun`\
    \ 用于定义函数。\n\n`main` 是应用程序的主函数。程序执行从这里开始。\n\n`args:Array<String>`\n\n在 Kotlin 中，变量名先声明，然后是类型。在上面的例子中，`args`\
    \ 是字符串数组类型的变量。\n\n`println(\"Hello World\")`\n\n上面的语句将消息 `Hello World` 打印到控制台。如你所见，与\
    \ Java 不同，Kotlin 语句不以 `;` 结尾。\n\n### 编译 HelloWorld.kt\n\n打开命令提示符并输入命令 `kotlinc\
    \ HelloWorld.kt`。\n\n```\nC:\\Users\\JJTam\\Documents\\Study\\Kotlin\\Programs>kotlinc\
    \ HelloWorld.kt\n\nC:\\Users\\JJTam\\Documents\\Study\\Kotlin\\Programs>dir\n\
    \ Volume in drive C is OSDisk\n Volume Serial Number is 1034-4F6F\n\n Directory\
    \ of C:\\Users\\JJTam\\Documents\\Study\\Kotlin\\Programs\n\n09/02/2017  11:18\
    \ AM    <DIR>          .\n09/02/2017  11:18 AM    <DIR>          ..\n09/02/2017\
    \  11:09 AM                57 HelloWorld.kt\n09/02/2017  11:18 AM            \
    \   980 HelloWorldKt.class\n09/02/2017  11:18 AM    <DIR>          META-INF\n\
    \               2 File(s)          1,037 bytes\n               3 Dir(s)  63,190,188,032\
    \ bytes free\n```\n\n如你所见 `dir` 命令的输出，你可以观察到 Kotlin 生成了 `HelloWorldKt.class` 和一个\
    \ `META-INF` 目录。\n\n### 运行 HelloWorld.kt\n\n你可以使用 `kotlin HelloWorldKt` 命令运行 HelloWorld\
    \ 文件。\n\n```\nC:\\Users\\JJTam\\Documents\\Study\\Kotlin\\Programs>kotlin HelloWorldKt\n\
    Hello World\n```\n\n### 创建并运行 JAR\n\n你也可以创建 JAR 文件，并使用 Java 启动器运行 JAR 文件。\n\n\
    使用命令 `kotlinc HelloWorld.kt -include-runtime -d HelloWorld.jar` 创建 JAR 文件。\n\n\
    `-include-runtime` 选项告诉 Kotlin 编译器，在 `HelloWorld.jar` 文件中包含 Kotlin 运行时。\n\n```\n\
    C:\\Users\\JJTam\\Documents\\Study\\Kotlin\\Programs>kotlinc HelloWorld.kt -include-runtime\
    \ -d HelloWorld.jar\n\nC:\\Users\\JJTam\\Documents\\Study\\Kotlin\\Programs>dir\n\
    \ Volume in drive C is OSDisk\n Volume Serial Number is 1034-4F6F\n\n Directory\
    \ of C:\\Users\\JJTam\\Documents\\Study\\Kotlin\\Programs\n\n09/02/2017  11:24\
    \ AM    <DIR>          .\n09/02/2017  11:24 AM    <DIR>          ..\n09/02/2017\
    \  11:24 AM           869,262 HelloWorld.jar\n09/02/2017  11:09 AM           \
    \     57 HelloWorld.kt\n               2 File(s)        869,319 bytes\n      \
    \         2 Dir(s)  63,401,816,064 bytes free\n```\n\n一旦 JAR 文件创建完成，你可以像运行其他 JAR\
    \ 文件一样调用它。使用命令 `java -jar HelloWorld.jar`\n\n```\nC:\\Users\\JJTam\\Documents\\\
    Study\\Kotlin\\Programs>java -jar HelloWorld.jar\nHello World\n```\n\n## 在 Eclipse\
    \ 中设置 Kotlin\n\n打开 Eclipse。Help -> Eclipse Marketplace。\n\n![](Image00002.jpg)\n\
    \n搜索 Kotlin。\n\n![](Image00003.jpg)\n\n点击 `Install` 按钮安装 Kotlin 插件。\n\n安装成功后，Eclipse\
    \ 会要求重启。重启 Eclipse。\n\n### 创建新的 Kotlin 项目\n\n打开 Eclipse。File -> New -> Other。\n\
    \n![](Image00004.jpg)\n\nKotlin -> Kotlin Project。\n\n![](Image00005.jpg)\n\n\
    按 Next。\n\n在 `Kotlin Project` 窗口中，将项目名命名为 `Hello World`，然后点击 Finish 按钮。\n\nKotlin\
    \ 项目结构如下所示。\n\n![](Image00006.jpg)\n\n### 创建 HelloWorld.kt 文件\n\n右键点击 `src` 文件夹\
    \ -> New -> Other。\n\n![](Image00007.jpg)\n\n选择 `Kotlin File` 并按 Next。\n\n![](Image00008.jpg)\n\
    \n将文件名命名为 `Hello World` 并按 `Finish` 按钮。\n\n![](Image00009.jpg)\n\n将以下代码片段复制到 `HelloWorld.kt`\
    \ 文件中。\n\n**HelloWorld.kt**\n\n```kotlin\nfun main (args: Array<String>) {\n \
    \   println(\"Hello World\" )\n}\n```\n\n### 运行 HelloWorld.kt 文件\n\n右键点击 HelloWorld.kt\
    \ 文件的源代码 -> Run As -> Kotlin Application。\n\n![](Image00010.jpg)\n\n如果一切顺利，你可以在控制台中看到消息\
    \ `Hello World`。\n\n![](Image00011.jpg)\n\n## 在 Kotlin 中定义变量\n\n变量是用于存储数据的命名内存位置。\n\
    \n### 语法\n\n```kotlin\nvar variableName : DataType = value\nval variableName :\
    \ DataType = value\n```\n\n`var` 和 `val` 都是关键字。\n\n例如：\n\n```kotlin\nvar a : Int\
    \  =10;\n```\n\n`a` 是 `Int` 类型，赋值为 `10`。\n\n```kotlin\nval b : Double = 1.23\n\
    ```\n\n`b` 是 `Double` 类型，赋值为 `1.23`。关键字 `val` 用于定义常量（不可变对象）。\n\n**HelloWorld.kt**\n\
    \n```kotlin\nfun main (args: Array<String>) {\n    var a : Int  = 10 ;\n    val\
    \ b : Double = 1.23\n    println( \"a : ${a}\" )\n    println( \"b : ${b}\" )\n\
    }\n```\n\n```\nC:\\>kotlinc HelloWorld.kt\nC:\\>kotlin HelloWorldKt\na : 10\n\
    b : 1.23\n```\n\n## Kotlin 中的数据类型\n\nJava 有 `int`、`float`、`char` 等原始类型，Kotlin\
    \ 呢？\n\n从用户的角度来看，Kotlin 将一切设计为对象，但在运行时布尔值、数字和字符表示为原始类型。\n\n**HelloWorld.kt**\n\
    \n```kotlin\nfun main (args: Array<String>) {\n    var doubleVar: Double = 1.23\n\
    \    var floatVar: Float = 1.23f\n    var longVar: Long = 123\n    var intVar:\
    \ Int = 123\n    var shortVar: Short = 123\n    var byteVar: Byte = 123\n    println(\
    \ \"doubleVar : ${doubleVar}\" )\n    println( \"doubleVar : ${floatVar}\" )\n\
    \    println( \"longVar : ${longVar}\" )\n    println( \"intVar : ${intVar}\"\
    \ )\n    println( \"shortVar : ${shortVar}\" )\n    println( \"byteVar : ${byteVar}\"\
    \ )\n}\n```\n\n**输出**\n\n```\ndoubleVar : 1.23\ndoubleVar : 1.23\nlongVar : 123\n\
    intVar : 123\nshortVar : 123\nbyteVar : 123\n```\n\n## Kotlin: 可空类型\n\n默认情况下，Kotlin\
    \ 引用类型（`Int`、`Float`、`Double`、`String` 等）不接受 `null` 值。Kotlin 引入此特性是为了避免空指针异常。\n\
    \n**Test.kt**\n\n```kotlin\nfun main (args: Array<String>) {\n    var name : String\
    \ = \"JJTam\"\n    name = null\n}\n```\n\n当你尝试编译上述程序时，Kotlin 会抛出以下错误。\n\n```\n\
    ERROR: Null can not be a value of a non-null type String (6, 9)\n```\n\n### 如何定义可以接受\
    \ null 值的变量？\n\n通过使用可空类型，你可以定义接受 `null` 值的变量。在引用类型后追加 `?` 以接受 `null` 值。\n\n| Type\
    \ | Nullable type |\n|------|---------------|\n| Int | Int? |\n| String | String?\
    \ |\n| Double | Double? |\n| Person | Person? |\n\n例如：\n\n```kotlin\nvar id: Int?\
    \ = 1\nvar name: String? = \"JJTam\"\nvar salary: Double? = 123.456\nvar person:\
    \ Person? = Person( \"JJTam\" )\n\nid = null\nname = null\nsalary = null\nperson\
    \ = null\n```\n\n## Kotlin: 数字\n\nKotlin 提供以下数据类型来支持数字。\n\n| Data Type | Size\
    \ in Bits |\n|-----------|--------------|\n| Double | 64 |\n| Float | 32 |\n|\
    \ Long | 64 |\n| Int | 32 |\n| Short | 16 |\n| Byte | 8 |"
