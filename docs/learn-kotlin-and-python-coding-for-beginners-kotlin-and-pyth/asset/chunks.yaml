  trans: " \n # 类\n\n用通俗的话来说，我把类称为类别。所有人都属于人类别，猫、狮子、大象属于动物类别。因此，类或类别是一组具有相似属性和行为的对象。\n\
    \n## 编程术语中的对象与类\n\n### 什么是对象？\n\n对象是相关状态和行为的软件捆绑体。Kotlin 的主要优势在于，你可以将 Kotlin 中的对象与现实世界中的对象进行比较。因此，在\
    \ Kotlin 中处理对象非常容易。\n\n### 什么是类？\n\n类是创建对象的蓝图或原型。你可以使用 `class` 关键字来定义类。\n\n**语法**\n\
    \n```\nclass ClassName {\n  // 属性\n  // 函数\n}\n```\n\n**示例**\n\n```\nclass Employee\
    \ {\n  var firstName : String = \"\"\n  var lastName : String = \"\"\n}\n```\n\
    \n上面的代码片段定义了 `Employee` 类，它定义了两个属性（`firstName`、`lastName`）。\n\n如何为 `Employee`\
    \ 类定义对象？\n\n```\nvar emp1 = Employee()\n```\n\n上面的语句用于为 `Employee` 类定义一个对象。\n\n\
    如何访问与对象 `emp1` 相关联的属性？\n\n对象的成员（`firstName` 和 `lastName`）使用 `.` 符号来访问。\n\n**语法**\n\
    \n```\nobjName.propertyName\n```\n\n**示例**\n\n```\nemp1.firstName = \"Chamu\"\n\
    emp1.lastName = \"Delhi\"\n```\n\n**Employee.kt**\n\n```\nclass Employee {\n \
    \ var firstName: String = \"\"\n  var lastName: String = \"\"\n}\n```\n\n**Main.kt**\n\
    \n```\nfun main (args: Array<String>) {\n  var emp1 = Employee()\n  emp1.firstName\
    \ = \"Chamu\"\n  emp1.lastName = \"Delhi\"\n  println( \"First name : ${emp1.firstName}\"\
    \ )\n  println( \"Last name : ${emp1.lastName}\" )\n}\n```\n\n**输出**\n\n```\n\
    First name : Chamu\nLast name : Delhi\n```\n\n## Kotlin：声明属性\n\n你可以在类中定义属性。属性可以是可变的（mutable）或不可变的（一旦定义便无法更改）。\n\
    \n### 如何定义可变属性？\n\n可变属性使用 `var` 关键字定义。\n\n**示例**\n\n```\nvar name : String = \"\
    JJTam\"\n```\n\n### 如何定义不可变属性？\n\n不可变属性使用 `val` 关键字定义。\n\n**示例**\n\n```\nval name\
    \ : String = \"JJTam\"\n```\n\n```\nclass Employee{\n  var name : String = \"\
    JJTam\"\n  var age : Int = 28\n  val orgID : String = \"ORG1234\"\n}\n```\n\n\
    如你所见，在 `Employee` 类中，我将 `name` 和 `age` 定义为可变属性，`orgID` 定义为不可变属性。\n\n### 如何访问类中的属性？\n\
    \n通过定义对象，你可以访问类的属性。使用 `.` 符号来访问类的实例属性。\n\n**语法**\n\n```\nobjectName.propertyName\n\
    ```\n\n**HelloWorld.kt**\n\n```\nclass Employee {\n  var name: String = \"JJTam\"\
    \n  var age: Int = 28\n  val orgID: String = \"ORG1234\"\n}\n\nfun main (args:\
    \ Array<String>) {\n  var emp = Employee()\n  println( \"name : ${emp.name}\"\
    \ )\n  println( \"age : ${emp.age}\" )\n  println( \"orgID : ${emp.orgID}\" )\n\
    }\n```\n\n**输出**\n\n```\nname : JJTam\nage : 28\norgID : ORG1234\n```\n\n定义属性时无需添加属性类型，Kotlin\
    \ 环境会自动推断。但添加类型可以提高程序的可读性。\n\n```\nclass Employee {\n  var name = \"JJTam\"\n\
    \  var age = 28\n  val orgID = \"ORG1234\"\n}\n```\n\n## Kotlin：属性的 getter 和 setter\n\
    \n在我之前的文章中，我解释了如何定义属性，除了定义之外，我们还可以为属性添加 getter 和 setter 方法。\n\n**语法**\n\n```\n\
    var <propertyName>[: <PropertyType>] [= <property_initializer>]\n[<getter>]\n\
    [<setter>]\n```\n\n定义属性时，`PropertyType`、`getter` 和 `setter` 都是可选的。\n\n**HelloWorld.kt**\n\
    \n```\nclass Employee {\n  var name: String = \"JJTam\"\n  get () = field\n  set\
    \ (value) {\n    field = value\n  }\n  var age : Int = 28\n  get () = field\n\
    \  set (value) {\n    field = value\n  }\n  val orgID = \"ORG1234\"\n}\n\nfun\
    \ main (args: Array<String>) {\n  var emp = Employee()\n  println(\"name : ${emp.name}\"\
    \ )\n  println(\"age : ${emp.age}\" )\n  println(\"orgID : ${emp.orgID}\" )\n\
    }\n```\n\n**输出**\n\n```\nname : JJTam\nage : 28\norgID : ORG1234\n```\n\n如你所见，我使用了\
    \ `field` 标识符来引用幕后字段。按照惯例，setter 方法使用 `value` 作为参数名，但你可以使用任何名称。\n\n### 为什么我需要\
    \ getter 和 setter 方法？\n\ngetter 和 setter 方法用于在发送/设置信息之前对数据进行转换/验证。\n\n```\nvar\
    \ age : Int = 28\nget() = field\nset(value) {\n  if(value < 0 || value > 100)\n\
    \    field = 3\n}\n```\n\n例如，在上面的代码片段中，setter 方法在将年龄设置到属性之前对其进行验证。如果用户将年龄设置为 `<0`\
    \ 或 `> 100`，年龄将被设置为 `3`。下面是完整的可运行应用。\n\n**HelloWorld.kt**\n\n```\nclass Employee\
    \ {\n  var name: String = \"JJTam\"\n  get () = field\n  set (value) {\n    field\
    \ = value\n  }\n  var age: Int = 28\n  get () = field\n  set (value) {\n    if\
    \ (value < 0 || value > 100 )\n      field = 3\n  }\n  val orgID = \"ORG1234\"\
    \n}\n\nfun main (args: Array<String>) {\n  var emp = Employee()\n  println(\"\
    name : ${emp.name}\" )\n  println(\"age : ${emp.age}\" )\n  println(\"orgID :\
    \ ${emp.orgID}\" )\n  emp.age = -100\n  println(\"\\nAfter setting the age to\
    \ -100\" )\n  println(\"name : ${emp.name}\" )\n  println(\"age : ${emp.age}\"\
    \ )\n  println(\"orgID : ${emp.orgID}\" )\n}\n```\n\n**输出**\n\n```\nname : JJTam\n\
    age : 28\norgID : ORG1234\n\nAfter setting the age to -100\nname : JJTam\nage\
    \ : 3\norgID : ORG1234\n```\n\nKotlin 为可变属性（使用 `var` 关键字定义的属性）提供默认的 getter 和 setter\
    \ 方法，而为不可变属性（使用 `val` 关键字定义的属性）仅提供 getter 方法。\n\n```\nvar name = \"JJTam\" //\
    \ 类型为 String，具有默认的 getter 和 setter\nval orfID = \"orf1234\" // 类型为 String，具有默认的\
    \ getter\n```\n\n## Kotlin：定义类的成员函数\n\nKotlin 中的函数使用 `fun` 关键字定义。\n\n**示例：**\n\
    \n```\nfun square(x : Int) : Int{\n  return x*x\n}\n```\n\n上面的代码片段定义了一个名为 `square`\
    \ 的函数，它接受一个 `Int` 类型的参数并返回整数。\n\n**Employee.kt**\n\n```\nclass Employee {\n  private\
    \ var firstName: String = \"\"\n  private var lastName: String = \"\"\n  fun getFirstName\
    \ (): String {\n    return firstName\n  }\n  fun getLastName (): String {\n  \
    \  return lastName\n  }\n  fun setFirstName (firstName: String) {\n    this .firstName\
    \ = firstName\n  }\n  fun setLastName (lastName: String) {\n    this .lastName\
    \ = lastName\n  }\n}\n```\n\n**Main.kt**\n\n```\nfun main (args: Array<String>)\
    \ {\n  var emp1 = Employee()\n  emp1.setFirstName( \"Chamu\" )\n  emp1.setLastName(\
    \ \"Delhi\" )\n  println( \"firstName : ${emp1.getFirstName()}\" )\n  println(\
    \ \"lastName : ${emp1.getLastName()}\" )\n}\n```\n\n**输出**\n\n```\nfirstName :\
    \ Chamu\nlastName : Delhi\n```\n\n## Kotlin：成员属性必须初始化\n\n在 Kotlin 中，成员属性要么被初始化，要么必须声明为抽象。让我们通过一个例子来看看。\n\
    \n**Employee.kt**\n\n```\nclass Employee {\n  private var firstName: String\n\
    \  private var lastName: String\n  fun getFirstName (): String {\n    return firstName\n\
    \  }\n  fun getLastName (): String {\n    return lastName\n  }\n  fun setFirstName\
    \ (firstName: String) {\n    this .firstName = firstName\n  }\n  fun setLastName\
    \ (lastName: String) {\n    this .lastName = lastName\n  }\n}\n```\n\n尝试编译上面的程序，你会得到如下错误。\n\
    \n```\nC:\\>kotlinc Employee.kt\nEmployee.kt:2:2: error: property must be initialized\
    \ or be abstract\n        private var firstName: String\n        ^\nEmployee.kt:3:2:\
    \ error: property must be initialized or be abstract\n        private var lastName:\
    \ String\n```\n\n### 如何消除上述错误？\n\n有两种方法，要么初始化属性，要么将属性设为抽象。\n\n**方法 1：先初始化 firstName\
    \ 和 lastName 属性**\n\n**Employee.kt**\n\n```\nclass Employee {\n  private var firstName:\
    \ String = \"\"\n  private var lastName: String = \"\"\n  fun getFirstName ():\
    \ String {\n    return firstName\n  }\n  fun getLastName (): String {\n    return\
    \ lastName\n  }\n  fun setFirstName (firstName: String) {\n    this .firstName\
    \ = firstName\n  }\n  fun setLastName (lastName: String) {\n    this .lastName\
    \ = lastName\n  }\n}\n```\n\n**方法 2：将属性设为抽象**\n\n**Employee.kt**\n\n```\nabstract\
    \ class Employee {\n  abstract var firstName: String\n  abstract var lastName:\
    \ String\n}\n```\n\n## Kotlin：const：编译时常量\n\n你可以使用 `const` 关键字定义编译时常量。\n\n**示例**\n\
    \n```\nconst val VENDOR_NAME = \"Self Learning Java blog\"\n```\n\n**HelloWorld.kt**\n\
    \n```\nconst val VENDOR_NAME = \"Self Learning Java blog\"\nconst val PI = 3.14\n\
    \nfun main (args: Array<String>) {\n  println( \"Vendor Name $VENDOR_NAME\" )\n\
    \  println( \"Value of PI : $PI\" )\n}\n```\n\n**输出**\n\n```\nVendor Name Self\
    \ Learning Java blog\nValue of PI : 3.14\n```\n\n定义编译时常量时，属性必须满足以下前提条件。\n\n* 顶层属性或对象的成员\n\
    * 使用 `String` 类型或基本类型的值进行初始化\n* 没有自定义 getter\n"
- fmt: " # Kotlin: `const` vs `val`\n\n`const` keyword is used to define compile time\
    \ constants, i.e, the value of the `const` variable is known at compile time.\
    \ Whereas `val` is used to define constants at run time.\n\nFor example, you can't\
    \ define a `const` like below.\n\n```kotlin\nconst val PICon = getPI()\n```\n\n\
    When you try to compile the kotlin program with above statement, you will end\
    \ up in below error.\n\n> 'Const 'val' has type 'Unit'. Only primitives and String\
    \ are allowed'.\n\nThis is because, `getPI()` is evaluated at run time and assign\
    \ the value to `PICon`, but `const` is used to define the constant at compile\
    \ time.\n\nFind the below working application.\n\n`HelloWorld.kt`\n\n```kotlin\n\
    const val VENDOR_NAME = \"Self Learning Java blog\"\nval PICon = getPI()\n\nfun\
    \ getPI (): Double {\n    return 3.14\n}\n\nfun main (args: Array<String>) {\n\
    \    println( \"Vendor Name $VENDOR_NAME\" )\n    println( \"Value of PI : $PICon\"\
    \ )\n}\n```\n\n**Output**\n\n```\nVendor Name Self Learning Java blog\nValue of\
    \ PI : 3.14\n```\n\n# Kotlin: `lateinit` : Late initialized properties\n\nBy default,\
    \ kotlin do not allow uninitialized properties. You must initialize them at the\
    \ time of declaration (or) in the constructor. Let me explain with an example.\n\
    \n`HelloWorld.kt`\n\n```kotlin\nclass Employee {\n    var id : String\n    var\
    \ name : String\n    var city : String\n}\n```\n\nWhen you try to compile above\
    \ program, you will end up in below error.\n\n```\nERROR: Property must be initialized\
    \ or be abstract (2, 2)\nERROR: Property must be initialized or be abstract (3,\
    \ 2)\nERROR: Property must be initialized or be abstract (4, 2)\n```\n\n## How\
    \ to resolve above problem?\n\nThere are three ways:\n- a. Initialize the variables\
    \ at the time of declaration\n- b. Define the variables in constructor\n- c. Use\
    \ late initialization\n\n### Initialize the variables at the time of declaration\n\
    \n```kotlin\nclass Employee {\n    var id: String = \"123\"\n    var name: String\
    \ = \"JJTam\"\n    var city: String = \"Ongole\"\n}\n```\n\n### Define the variables\
    \ in constructor\n\n```kotlin\nclass Employee {\n    var id: String\n    var name:\
    \ String\n    var city: String\n\n    constructor() {\n        id = \"123\"\n\
    \        name = \"JJTam\"\n        city = \"Ongole\"\n    }\n}\n```\n\n### Use\
    \ late initialization\n\nBy using `lateinit` keyword, we can inform kotlin that\
    \ this variable will be initialized at later point of time.\n\n```kotlin\nclass\
    \ Employee {\n    lateinit var id: String\n    lateinit var name: String\n   \
    \ lateinit var city: String\n}\n```\n\n## Can I access `lateinit` property before\
    \ initialization?\n\nNo, If you try to access a `lateinit` property before initialization,\
    \ you will end up in `UninitializedPropertyAccessException`\n\n`HelloWorld.kt`\n\
    \n```kotlin\nclass Employee {\n    lateinit var id: String\n    lateinit var name:\
    \ String\n    lateinit var city: String\n}\n\nfun main (args: Array<String>) {\n\
    \    var obj = Employee()\n    println( \"Id : ${obj.id}\" )\n}\n```\n\nWhen you\
    \ try to run above program, you will end up in below exception.\n\n```\nException\
    \ in thread \"main\" kotlin.UninitializedPropertyAccessException: lateinit property\
    \ id has not been initialized\n    at Employee.getId(HelloWorld.kt:2)\n    at\
    \ HelloWorldKt.main(HelloWorld.kt:10)\n```\n\nTo resolve the error define the\
    \ `lateinit` properties before accessing.\n\n`HelloWorld.kt`\n\n```kotlin\nclass\
    \ Employee {\n    lateinit var id: String\n    lateinit var name: String\n   \
    \ lateinit var city: String\n}\n\nfun main (args: Array<String>) {\n    var obj\
    \ = Employee()\n    obj.id = \"123\"\n    println( \"Id : ${obj.id}\" )\n}\n```\n\
    \n**Output**\n\n```\nId : 123\n```\n\n# Kotlin: Constructors\n\nKotlin classes\
    \ have a primary constructor and one or more secondary constructors. Constructors\
    \ are defined using `constructor` keyword.\n\n## Primary Constructor\n\nPrimary\
    \ constructor is defined as part of the class header.\n\nEx\n\n```kotlin\nclass\
    \ Employee constructor(fName: String, lName: String) {\n    ....\n    ....\n}\n\
    ```\n\n`Employee.kt`\n\n```kotlin\nclass Employee constructor (fName: String,\
    \ lName: String) {\n    init{\n        println( \"fName : $fName, lName : $lName\"\
    \ )\n    }\n}\n```\n\n`Main.kt`\n\n```kotlin\nfun main (args: Array<String>) {\n\
    \    var emp1 = Employee( \"Hareesh\" , \"Seeram\" )\n}\n```\n\n**Output**\n\n\
    ```\nfName : Hareesh, lName : Seeram\n```\n\n`init{}` is equivalent to the initializer\
    \ block of java, it is used to place the object initialization code. This block\
    \ is called on every object instantiation.\n\nYou can omit the `constructor` keyword\
    \ while defining primary constructor, if the constructor do not have any modifier\
    \ (or) annotation associated with it.\n\n`Employee.kt`\n\n```kotlin\nclass Employee\
    \ (fName: String, lName: String) {\n    init{\n        println( \"fName : $fName,\
    \ lName : $lName\" )\n    }\n}\n```\n\n### Defining member variables as part of\
    \ primary constructor\n\nIf you add the keyword `var`/`val` to the type parameter\
    \ in primary constructor, it creates a field in class.\n\n`Main.kt`\n\n```kotlin\n\
    class Employee ( var firstName: String, var lastName: String) {}\n\nfun main (args:\
    \ Array<String>) {\n    var emp1 = Employee( \"Hareesh\" , \"Seeram\" )\n    println(\
    \ \"firstName : ${emp1.firstName}, lastName : ${emp1.lastName}\" )\n}\n```\n\n\
    **Output**\n\n```\nfirstName : Hareesh, lastName : Seeram\n```\n\nIn the above\
    \ snippet, I defined `firstName` and `lastName` fields as part of primary constructor\n\
    \n# Kotlin: Secondary Constructors\n\nKotlin class can have more than one secondary\
    \ constructors.\n\n## How to define secondary constructor?\n\nYou should use the\
    \ keyword `constructor` to define secondary constructor.\n\n**Syntax**\n\n```kotlin\n\
    constructor(arguments){\n```"
