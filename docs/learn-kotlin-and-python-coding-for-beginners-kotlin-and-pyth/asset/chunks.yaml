    >>> for i,v in enumerate(countries):\n...     print(i, v)\n...\n0 India\n1 China\n\
    2 Pakisthan\n3 Sri Lanka\n4 Bangladesh\n```\n\n### 反向遍历序列\n\n使用 `reversed` 函数来反向遍历序列。\n\
    \n```\n>>> countries\n['India', 'China', 'Pakisthan', 'Sri Lanka', 'Bangladesh']\n\
    >>>\n>>> for i in reversed(countries):\n...     print(i)\n...\nBangladesh\nSri\
    \ Lanka\nPakisthan\nChina\nIndia\n```\n\n### 按排序顺序遍历序列\n\n使用 `sorted` 函数来按排序顺序遍历序列。\n\
    \n```\n>>> for i in sorted(countries):\n...     print(i)\n...\nBangladesh\nChina\n\
    India\nPakisthan\nSri Lanka\n```\n\n### 同时遍历多个列表\n\n使用 `zip` 函数来同时遍历多个列表。\n\n\
    ```\n>>> for country, capital in zip(countries, capitals):\n...     print(country,\
    \ capital)\n...\nIndia Delhi\nChina Beijing\nPakisthan Islamabad\nSri Lanka Sri\
    \ Jayawardenepura - Kotte\nBangladesh Dhaka\n```\n\n### 使用索引遍历\n\n```\n>>> countries\n\
    ['India', 'China', 'Pakisthan', 'Sri Lanka', 'Bangladesh']\n>>>\n>>> for i in\
    \ range(len(countries)):\n...     print(countries[i])\n...\nIndia\nChina\nPakisthan\n\
    Sri Lanka\nBangladesh\n```\n\n## Python: 元组\n\n元组与列表类似，由多个用逗号分隔的值组成。\n\n### 元组与列表的区别\n\
    \na. 列表是可变的，而元组是不可变的\n\nb. 元组可以包含异构数据，而列表通常包含同构数据。\n\n`test.py`\n```\nemployee\
    \ = (1, \"Hari Krihsna\", \"Delhi\", 12345.678)\nprint(employee)\nprint(employee[0])\n\
    print(employee[1])\nprint(employee[2])\nprint(employee[3])\n```\n\n```\n$ python3\
    \ test.py\n(1, 'Hari Krihsna', 'Delhi', 12345.678)\n1\nHari Krihsna\nDelhi\n12345.678\n\
    ```\n\n如上面的例子所示，元组中的元素用圆括号括起来。尽管元组是不可变的，但你可以创建包含可变对象（如列表）的元组。\n\n`test.py`\n```\n\
    employee = (1, [])\nprint(employee)\nemployee[1].append(2)\nemployee[1].append(4)\n\
    employee[1].append(6)\nprint(employee)\n```\n\n```\n$ python3 test.py\n(1, [])\n\
    (1, [2, 4, 6])\n```\n\n### 打包和解包\n\n你可以不使用圆括号来定义元组。\n\n例如，\n\n```\nemployee=1,\
    \ \"Hari Krihsna\", \"Delhi\", 12345.678\n```\n\n上面是元组打包的例子。\n\n```\nid, firstName,\
    \ lastName, salary = employee\n```\n\n上面是元组解包的例子。序列解包要求等号左侧的变量数量与序列中的元素数量相同。\n\
    \n`test.py`\n```\nemployee = 1, \"Hari Krihsna\", \"Delhi\", 12345.678\nid, firstName,\
    \ lastName, salary = employee\nprint(id)\nprint(firstName)\nprint(lastName)\n\
    print(salary)\n```\n\n```\n$ python3 test.py\n1\nHari Krihsna\nDelhi\n12345.678\n\
    ```\n\n### 连接元组\n\n`+` 运算符用于连接元组。\n\n```\n>>> tuple1 = (1, \"HI\", 2, 45.65)\n\
    >>> tuple2 = (\"abcdef\", 54, 67)\n>>> tuple3 = tuple1 + tuple2\n>>> tuple3\n\
    (1, 'HI', 2, 45.65, 'abcdef', 54, 67)\n```\n\n### 切片\n\n与列表一样，你可以使用切片符号来访问元组。\n\
    \n| 示例 | 说明 |\n| --- | --- |\n| `tuple[start:end]` | 返回从索引 start（包含）到 end 索引（不包含）的元组。\
    \ |\n| `tuple[:end]` | 返回从索引 0（包含）到 end 索引（不包含）的元组。 |\n| `tuple[start:]` | 返回从索引\
    \ start 到末尾的元组。 |\n| `tuple[-2:]` | 返回从倒数第二个到末尾的元素。 |\n"
