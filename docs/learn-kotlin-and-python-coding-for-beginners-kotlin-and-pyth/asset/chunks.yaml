  trans: " \n字典通过键进行索引，键是不可变类型。你可以使用字符串、数字或任何其他不可变类型作为键。如果元组只包含字符串、数字或元组，则可以用作键。\n\
    \n## 使用 dict 构造函数构建字典\n\n`class dict(**kwarg)`\n`class dict(mapping, **kwarg)`\n\
    `class dict(iterable, **kwarg)`\n\n上述构造函数用于定义字典。\n\n```python\n>>> emps = dict([(1,\
    \ \"Pradeep\"), (2, \"Srinath\"), (3, \"Thushar\")])\n>>> emps\n{1: 'Pradeep',\
    \ 2: 'Srinath', 3: 'Thushar'}\n>>> a = dict(one=1, two=2, three=3)\n>>> a\n{'two':\
    \ 2, 'three': 3, 'one': 1}\n>>> b = dict({'three': 3, 'one': 1, 'two': 2})\n>>>\
    \ b\n{'two': 2, 'three': 3, 'one': 1}\n```\n\n## 获取字典中的项目数量\n\n使用 `len` 方法获取字典中的项目数量。\n\
    \n```python\n>>> employees\n{1: {'Hari JJTam', 'Delhi'}, 2: {'Prithi', 'Nair'},\
    \ 3: {'Shekkappa', 'Mohan'}}\n>>> \n>>> len(employees)\n3\n```\n\n## 获取与键关联的值\n\
    \n使用 `D[key]` 获取与键关联的值。\n\n```python\n>>> employees[1]\n{'Hari JJTam', 'Delhi'}\n\
    >>> employees[2]\n{'Prithi', 'Nair'}\n>>> employees[3]\n{'Shekkappa', 'Mohan'}\n\
    ```\n\n如果键不在字典中，则抛出 `KeyError`。\n\n```python\n>>> employees[5]\nTraceback (most\
    \ recent call last):\n  File \"<stdin>\", line 1, in <module>\nKeyError: 5\n```\n\
    \n## 覆盖与键关联的值\n\n`d[key] = value`\n\n上述语句覆盖与键关联的值，如果键不存在，则创建新项。\n\n```python\n\
    >>> employees\n{1: {'Hari JJTam', 'Delhi'}, 2: {'Prithi', 'Nair'}, 3: {'Shekkappa',\
    \ 'Mohan'}}\n>>> employees[4] = {\"Ranganath\", \"Thippisetty\"}\n>>> employees[1]\
    \ = {\"Phalgun\", \"Garimella\"}\n>>> \n>>> employees\n{1: {'Garimella', 'Phalgun'},\
    \ 2: {'Prithi', 'Nair'}, 3: {'Shekkappa', 'Mohan'}, 4: {'Ranganath', 'Thippisetty'}}\n\
    ```\n\n## 删除与键关联的项\n\n`del d[key]`\n\n使用 `del` 语句删除与键关联的项（项指 `<key, value>` 对）。\n\
    \n```python\n>>> employees\n{1: {'Garimella', 'Phalgun'}, 2: {'Prithi', 'Nair'},\
    \ 3: {'Shekkappa', 'Mohan'}, 4: {'Ranganath', 'Thippisetty'}}\n>>> del employees[2]\n\
    >>> \n>>> employees\n{1: {'Garimella', 'Phalgun'}, 3: {'Shekkappa', 'Mohan'},\
    \ 4: {'Ranganath', 'Thippisetty'}}\n```\n\n如果键不在字典中，则抛出 `KeyError`。\n\n```python\n\
    >>> del employees[2]\nTraceback (most recent call last):\n  File \"<stdin>\",\
    \ line 1, in <module>\nKeyError: 2\n```\n\n## 检查键是否存在\n\n`key in d`\n\n如果键在字典中，`in`\
    \ 运算符返回 true，否则返回 false。\n\n```python\n>>> employees\n{1: {'Garimella', 'Phalgun'},\
    \ 3: {'Shekkappa', 'Mohan'}, 4: {'Ranganath', 'Thippisetty'}}\n>>> \n>>> 2 in\
    \ employees\nFalse\n>>> \n>>> 3 in employees\nTrue\n```\n\n## 检查键是否不存在\n\n`key\
    \ not in d`\n\n如果键不在字典中，`not in` 运算符返回 true，否则返回 false。\n\n```python\n>>> employees\n\
    {1: {'Garimella', 'Phalgun'}, 3: {'Shekkappa', 'Mohan'}, 4: {'Ranganath', 'Thippisetty'}}\n\
    >>> \n>>> 2 not in employees\nTrue\n>>> \n>>> 3 not in employees\nFalse\n```\n\
    \n## 获取字典的迭代器\n\n`iter(d)`\n\n`iter` 函数返回字典键的迭代器。\n\n```python\n>>> for key in\
    \ iter(employees):\n...     print(key, employees[key])\n...\n1 {'Garimella', 'Phalgun'}\n\
    3 {'Shekkappa', 'Mohan'}\n4 {'Ranganath', 'Thippisetty'}\n```\n\n## 删除字典中的所有项\n\
    \n使用 `clear` 函数删除字典中的所有项。\n\n```python\n>>> employees\n{1: {'Garimella', 'Phalgun'},\
    \ 3: {'Shekkappa', 'Mohan'}, 4: {'Ranganath', 'Thippisetty'}}\n>>> \n>>> employees.clear()\n\
    >>> employees\n{}\n```\n\n## 复制字典\n\n使用 `copy()` 方法获取此字典的浅拷贝。\n\n```python\n>>>\
    \ employees = {1: {'Garimella', 'Phalgun'}, 3: {'Shekkappa', 'Mohan'}, 4: {'Ranganath',\
    \ 'Thippisetty'}}\n>>> employees\n{1: {'Garimella', 'Phalgun'}, 3: {'Shekkappa',\
    \ 'Mohan'}, 4: {'Ranganath', 'Thippisetty'}}\n>>> \n>>> emps = employees.copy()\n\
    >>> emps\n{1: {'Garimella', 'Phalgun'}, 3: {'Shekkappa', 'Mohan'}, 4: {'Ranganath',\
    \ 'Thippisetty'}}\n```\n\n## 从给定字典的键创建新字典\n\n`fromkeys(seq[, value])`\n\n使用 seq\
    \ 中的键和设置为 value 的值创建新字典。\n\n```python\n>>> employees\n{1: {'Garimella', 'Phalgun'},\
    \ 3: {'Shekkappa', 'Mohan'}, 4: {'Ranganath', 'Thippisetty'}}\n>>> emps = employees.fromkeys([1,\
    \ 2, 3], \"default\")\n>>> emps\n{1: 'default', 2: 'default', 3: 'default'}\n\
    ```\n\n## 获取与此键关联的值\n\n`get(key[, default])`\n\n使用 `get` 方法获取与给定键关联的值。如果键不存在，则返回默认值。如果未给定默认值，则默认为\
    \ `None`，因此此方法永远不会引发 `KeyError`。\n\n```python\n>>> employees\n{1: {'Garimella',\
    \ 'Phalgun'}, 3: {'Shekkappa', 'Mohan'}, 4: {'Ranganath', 'Thippisetty'}}\n>>>\
    \ employees.get(1)\n{'Garimella', 'Phalgun'}\n>>> \n>>> employees.get(5, {\"Kiran\
    \ Kumar\", \"Darsi\"})\n{'Kiran Kumar', 'Darsi'}\n```\n\n## 获取字典中的所有项\n\n使用 `items`\
    \ 方法获取字典中的所有项。\n\n```python\n>>> employees.items()\ndict_items([(1, {'Garimella',\
    \ 'Phalgun'}), (3, {'Shekkappa', 'Mohan'}), (4, {'Ranganath', 'Thippisetty'})])\n\
    ```\n\n## 从字典中获取所有键\n\n使用 `keys()` 方法从字典中获取所有键。\n\n```python\n>>> employees.keys()\n\
    dict_keys([1, 3, 4])\n```\n\n## pop(key[, default])\n\n如果键在字典中，pop 方法删除并返回与此键关联的值。如果键不存在，则返回默认值。如果未指定默认值，则抛出\
    \ `KeyError`。\n\n```python\n>>> employees\n{1: {'Garimella', 'Phalgun'}, 3: {'Shekkappa',\
    \ 'Mohan'}, 4: {'Ranganath', 'Thippisetty'}}\n>>> \n>>> employees.pop(1)\n{'Garimella',\
    \ 'Phalgun'}\n>>> \n>>> employees.pop(1, {\"dummy\"})\n{'dummy'}\n>>> \n>>> employees.pop(1)\n\
    Traceback (most recent call last):\n  File \"<stdin>\", line 1, in <module>\n\
    KeyError: 1\n```\n\n## 从字典中删除任意项\n\n使用 `popitem()` 方法从字典中删除随机项。如果字典为空，则抛出 `KeyError`。\n\
    \n```python\n>>> employees\n{3: {'Shekkappa', 'Mohan'}, 4: {'Ranganath', 'Thippisetty'}}\n\
    >>> \n>>> employees.popitem()\n(3, {'Shekkappa', 'Mohan'})\n>>> \n>>> employees.popitem()\n\
    (4, {'Ranganath', 'Thippisetty'})\n>>> \n>>> employees.popitem()\nTraceback (most\
    \ recent call last):\n  File \"<stdin>\", line 1, in <module>\nKeyError: 'popitem():\
    \ dictionary is empty'\n```\n\n## setdefault(key[, default])\n\n如果键在字典中，setdefault\
    \ 方法返回与其关联的值，否则将键设置为 default 并返回 default。\n\n```python\n>>> employees\n{}\n>>>\
    \ employees.setdefault(1, {'Shekkappa', 'Mohan'})\n{'Shekkappa', 'Mohan'}\n>>>\
    \ \n>>> employees\n{1: {'Shekkappa', 'Mohan'}}\n>>> \n>>> employees.setdefault(1,\
    \ {'Garimella', 'Phalgun'})\n{'Shekkappa', 'Mohan'}\n>>> \n>>> employees\n{1:\
    \ {'Shekkappa', 'Mohan'}}\n```\n\n## 从其他字典更新字典\n\n`update([other])`\n\n使用 `update`\
    \ 方法从 other 更新字典的键/值对，覆盖现有键。\n\n```python\n>>> emps1 = {1: {'Garimella', 'Phalgun'},\
    \ 3: {'Shekkappa', 'Mohan'}, 4: {'Ranganath', 'Thippisetty'}}\n>>> emps2 = {1:\
    \ {'Hari JJTam', \"Delhi\"}, 5: {'Sudheer', 'Ganji'}}\n>>> \n>>> emps1\n{1: {'Garimella',\
    \ 'Phalgun'}, 3: {'Shekkappa', 'Mohan'}, 4: {'Ranganath', 'Thippisetty'}}\n>>>\
    \ \n>>> emps2\n{1: {'Hari JJTam', 'Delhi'}, 5: {'Ganji', 'Sudheer'}}\n>>> \n>>>\
    \ emps1.update(emps2)\n>>> \n>>> emps1\n{1: {'Hari JJTam', 'Delhi'}, 3: {'Shekkappa',\
    \ 'Mohan'}, 4: {'Ranganath', 'Thippisetty'}, 5: {'Ganji', 'Sudheer'}}\n>>> \n\
    >>> emps2\n{1: {'Hari JJTam', 'Delhi'}, 5: {'Ganji', 'Sudheer'}}\n```\n\n## 从字典中获取所有值\n\
    \n使用 `values` 方法从字典中获取所有值。\n\n```python\n>>> emps1\n{1: {'Hari JJTam', 'Delhi'},\
    \ 3: {'Shekkappa', 'Mohan'}, 4: {'Ranganath', 'Thippisetty'}, 5: {'Ganji', 'Sudheer'}}\n\
    >>> \n>>> emps1.values()\ndict_values([{'Hari JJTam', 'Delhi'}, {'Shekkappa',\
    \ 'Mohan'}, {'Ranganath', 'Thippisetty'}, {'Ganji', 'Sudheer'}])\n```\n\n# Python\
    \ 模块\n\n模块是一个包含定义的文件。我们可以在模块文件中定义类、模块、变量等，并在其他 Python 脚本中重用它们。\n\n例如，创建一个文件 `arithmetic.py`\
    \ 并复制以下代码。\n\n`arithmetic.py`\n\n```python\ndef sum(a, b):\n    return a + b\n\
    \ndef subtract(a, b):\n    return a - b\n\ndef mul(a, b):\n    return a * b\n\n\
    def div(a, b):\n    return a / b\n```\n\n打开 Python 解释器，使用 `import` 关键字导入模块并调用模块中定义的函数。\n\
    \n```python\n>>> import arithmetic\n>>> \n>>> arithmetic.sum(10, 20)\n30\n>>>\
    \ arithmetic.subtract(10, 20)\n-10\n>>> arithmetic.mul(10, 20)\n200\n>>> arithmetic.div(10,\
    \ 20)\n0.5\n```\n\n## 如何获取模块名称\n\n通过使用属性 `__name__`，你可以获取模块名称。\n\n```python\n\
    >>> arithmetic.__name__\n'arithmetic'\n```\n\n## 将模块的函数用作本地函数\n\n```python\n>>>\
    \ import arithmetic\n>>> sum = arithmetic.sum\n>>> sub = arithmetic.subtract\n\
    >>> mul = arithmetic.mul\n>>> div = arithmetic.div\n>>> \n>>> sum(10, 20)\n30\n\
    >>> mul(10, 20)\n200\n>>> sub(10, 20)\n-10\n```\n\n# Python：模块中的可执行语句\n\n模块可以包含可执行语句。这些语句仅在\
    \ import 语句中首次遇到模块名称时执行。\n\n`arithmetic.py`\n\n```python\nprint(\"Simple api to\
    \ perform arithmetic operations\")\n\ndef sum(a, b):\n    return a + b\n\ndef\
    \ subtract(a, b):\n    return a - b\n\ndef mul(a, b):\n    return a * b\n\ndef\
    \ div(a, b):\n    return a / b\n```\n\n```python\n>>> import arithmetic\nSimple\
    \ api to perform arithmetic operations\n>>> \n>>> arithmetic.sum(10, 20)\n30\n\
    >>> import arithmetic\n>>> \n>>> arithmetic.div(10, 20)\n0.5\n```\n\n观察上面的代码片段，print\
    \ 语句仅在模块首次导入时执行，第二次导入时不执行。\n\n# Python：直接从模块导入函数\n\n通过使用 from、import 关键字，我们可以直接从模块导入函数。\n\
    \n`arithmetic.py`\n\n```python\nprint(\"Simple api to perform arithmetic operations\"\
    )\n\ndef sum(a, b):\n    return a + b\n\ndef subtract(a, b):\n    return a - b\n\
    \ndef mul(a, b):\n    return a * b\n\ndef div(a, b):\n    return a / b\n```\n\n\
    ```python\n>>> from arithmetic import sum, subtract, mul, div\n>>> \n>>> sum(10,\
    \ 20)\n30\n>>> subtract(20, 30)\n-10\n```\n\n使用语句 `from fibo import *` 导入所有函数。这会导入所有名称，除了以下划线（`_`）开头的名称。\n\
    \n# Python：在其他模块中导入模块\n\n模块可以使用 import 语句导入其他模块。\n\n`arithmetic.py`\n\n```python\n\
    def sum(a, b):\n    return a + b\n\ndef subtract(a, b):\n    return a - b\n\n\
    def mul(a, b):\n    return a * b\n\ndef div(a, b):\n    return a / b\n```\n\n\
    `main.py`\n\n```python\nimport arithmetic\n\nprint(arithmetic.sum(10, 20))\nprint(arithmetic.subtract(10,\
    \ 20))\nprint(arithmetic.mul(10, 20))\nprint(arithmetic.div(10, 20))\n```\n\n\
    ```bash\n$ python3 main.py\n30\n-10\n200\n0.5\n```\n\n## 注意\n\n不必将所有 import 语句放在模块的开头。你可以在需要时导入。\n\
    \n# Python 命令行参数\n\nPython 脚本接受任意数量的命令行参数。此选项方便我们在运行时配置应用程序。\n\n## 如何传递命令行参数\n\
    \n`python scriptname arg1 arg2 …argN`\n\n通过使用 `sys` 模块，我们可以访问命令行参数。\n\n`sys.argv[0]`\
    \ 包含文件名\n\n`sys.argv[1]` 包含第一个命令行参数，`sys.argv[2]` 包含第二个命令行参数，等等。\n\n`arithmetic.py`\n\
    \n```python\ndef sum(a, b):\n    return a + b\n\ndef subtract(a, b):\n    return\
    \ a - b\n\ndef mul(a, b):\n    return a * b\n\ndef div(a, b):\n    return a /\
    \ b\n```\n\n`main.py`\n\n```python\nimport arithmetic\n\nif __name__ == \"__main__\"\
    :\n    import sys\n    a = int(sys.argv[1])\n    b = int(sys.argv[2])\n    print(sys.argv[0])\n\
    \    print(\"a = \", a, \"b = \", b)\n    print(arithmetic.sum(a, b))\n    print(arithmetic.subtract(a,\
    \ b))\n    print(arithmetic.mul(a, b))\n    print(arithmetic.div(a, b))\n```\n\
    \n```bash\n$ python3 main.py 10 11\nmain.py\na =  10 b =  11\n21\n-1\n110\n0.9090909090909091\n\
    ```\n\n```bash\n$ python3 main.py 8 13\nmain.py\na =  8 b =  13\n21\n-5\n104\n\
    0.6153846153846154\n```\n\n# Python：文件处理\n\n在本帖及后续帖子中，我将解释如何打开、读取和写入文件。\n\n##\
    \ 如何打开文件\n\n要从文件读取数据或向文件写入数据，我们需要一个指向文件的引用对象。使用 `open` 方法获取文件对象。\n\n`open(file,\
    \ mode='r', buffering=-1, encoding=None, errors=None, newline=None, closefd=True,\
    \ opener=None)`\n\n`open` 函数以特定模式打开文件并返回相应的文件对象。如果无法打开文件，则抛出 `OSError`。\n"
- fmt: " | Parameter | Description |\n| file | Full path of the file to be opened.\
    \ |\n| mode | Specifies the mode, in which the file is opened. By default file\
    \ opens in read mode. |\n| buffering | `0`: Switch off the buffer (only allowed\
    \ in binary mode)`1`: Line buffering (only usable in text mode)`>1`: Specify the\
    \ size of buffer in bytes.If you don't specify any value, by default buffering\
    \ works like below.a . Binary files are buffered in fixed-size chunks; the size\
    \ of the buffer is chosen using a heuristic trying to determine the underlying\
    \ device's \"block size\" and falling back on `io.DEFAULT_BUFFERdol-size`.b .\
    \ \"Interactive\" text files use line buffering. |\n| encoding | Type of encoding\
    \ used to encode/decode a file. This value should be used in text mode. if encoding\
    \ is not specified the encoding used is platform dependent. |\n| errors | Specifies\
    \ how encoding and decoding errors are to be handled. This cannot be used in binary\
    \ mode |\n| newline | controls how universal newlines mode works. A manner of\
    \ interpreting text streams in which all of the following are recognized as ending\
    \ a line: the Unix end-of-line convention `'\\n'`, the Windows convention `'\\\
    r\\n'`, and the old Macintosh convention `'\\r'`. |\n| closefd | If `closefd`\
    \ is `False` and a file descriptor rather than a filename was given, the underlying\
    \ file descriptor will be kept open when the file is closed. If a filename is\
    \ given `closefd` must be `True` (the default) otherwise an error will be raised\
    \ |\n\nFollowing are different modes that you can use while opening a file.\n\n\
    | Mode | Description |\n| `'r'` | open for reading |\n| `'w'` | open for writing,\
    \ truncating the file first |\n| `'x'` | open for exclusive creation, failing\
    \ if the file already exists |\n| `'a'` | open for writing, appending to the end\
    \ of the file if it exists |\n| `'b'` | binary mode |\n| `'t'` | text mode (default)\
    \ |\n| `'+'` | open a disk file for updating (reading and writing) |\n\nFor example,\
    \ `data.txt` contains following data.\n\n```\ndata.txt\nFirst line\nSecond line\n\
    Third line\nFourth line\n```\n\n```\n>>> f = open(\"/Users/hariJJTam_Delhi/data.txt\"\
    )\n>>>\n>>> f.read()\n'First line\\nSecond line\\nThird line\\nFourth line\\n'\n\
    ```\n\n## Python: Reading files\n\nFollowing methods are used to read file contents.\n\
    \n- `read`\n- `readline`\n- `readlines`\n\n### `read(size)`\n\nReads `size` bytes\
    \ of data and returns it as a string or bytes object. If size is negative (or)\
    \ omitted, all the file contents are returned. If the end of the file has been\
    \ reached, `f.read()` will return an empty string (`''`).\n\n```\n>>> f = open(\"\
    /Users/hariJJTam_Delhi/data.txt\")\n>>> f.read()\n'First line\\nSecond line\\\
    nThird line\\nFourth line\\n'\n```\n\n### `readline`\n\nRead single line from\
    \ file. A newline character (`\\n`) is left at the end of the string. Return an\
    \ empty string, if the file reaches to end.\n\n```\n>>> f = open(\"/Users/hariJJTam_Delhi/data.txt\"\
    )\n>>> f.readline()\n'First line\\n'\n>>> f.readline()\n'Second line\\n'\n>>>\
    \ f.readline()\n'Third line\\n'\n>>> f.readline()\n'Fourth line\\n'\n>>> f.readline()\n\
    ''\n```\n\n### `readlines`\n\n`readlines` method is used to read all the lines\
    \ of a file as list.\n\n```\n>>> data = f.readlines()\n>>> data\n['First line\\\
    n', 'Second line\\n', 'Third line\\n', 'Fourth line\\n']\n```\n\n### Reading a\
    \ file using for loop\n\nFor reading lines from a file, you can loop over the\
    \ file object.\n\n```\n>>> f = open(\"/Users/hariJJTam_Delhi/data.txt\")\n>>>\
    \ for line in f:\n...     print(line)\n...\nFirst line\n\nSecond line\n\nThird\
    \ line\n\nFourth line\n```\n\nAs you observe output, new line is printed after\
    \ every line. You can get rid of this by passing `end` parameter to print method.\n\
    \n```\n>>> f = open(\"/Users/hariJJTam_Delhi/data.txt\")\n>>> for line in f:\n\
    ...     print(line, end='')\n...\nFirst line\nSecond line\nThird line\nFourth\
    \ line\n```\n\n## Python: Write data to file\n\nPython provides following methods\
    \ to write data to a file.\n\n- `write()`: Used to write a fixed sequence of characters\
    \ to a file. Return number of characters written to file.\n- `writelines()`: `writelines`\
    \ can write a list of strings.\n\n```\n>>> f = open(\"/Users/hariJJTam_Delhi/data.txt\"\
    , 'w')\n>>>\n>>> f.write(\"Hello, How are you\\n\")\n19\n>>> f.write(\"I am fine,\
    \ How is u\\n\")\n20\n>>> data = [\"first line\\n\", \"second line\\n\"]\n>>>\
    \ f.writelines(data)\n>>> f.close()\n>>>\n>>> f = open(\"/Users/hariJJTam_Delhi/data.txt\"\
    )\n>>> for line in f:\n...     print(line, end='')\n...\nHello, How are you\n\
    I am fine, How is u\nfirst line\nsecond line\n```\n\n`write` method only accepts\
    \ string argument. If you try to insert non-string data, you will get `TypeError`.\n\
    \n```\n>>> f = open(\"/Users/hariJJTam_Delhi/data.txt\", 'w')\n>>> f.write(123)\n\
    Traceback (most recent call last):\n  File \"<stdin>\", line 1, in <module>\n\
    TypeError: write() argument must be str, not int\n```\n\nTo write something other\
    \ than a string, it needs to be converted to a string first. By using `str` function,\
    \ you can convert non string data to string.\n\n```\n>>> a = 123.45\n>>> temp\
    \ = str(a)\n>>> temp\n'123.45'\n>>>\n>>> f = open(\"/Users/hariJJTam_Delhi/data.txt\"\
    , 'w')\n>>> f.write(temp)\n6\n>>>\n>>> f.close()\n>>>\n>>> f = open(\"/Users/hariJJTam_Delhi/data.txt\"\
    )\n>>> f.read()\n'123.45'\n```\n\n## Python: classes and objects\n\nClass is a\
    \ blue print to create objects.\n\n### Syntax\n\n```\nclass ClassName:\n    <statement-1>\n\
    \    ...\n    <statement-N>\n```\n\n`class` keyword is used to define a class.\
    \ You can instantiate any number of objects from a class.\n\n### Syntax\n\n```\n\
    objName = new ClassName(arguments)\n```\n\n`test.py`\n\n```python\nclass Employee:\n\
    \    \"\"\" Employee class \"\"\"\n    noOfEmployees = 0  # Class level variable\n\
    \n    def __init__(self, id, firstName, lastName):\n        self.id = id\n   \
    \     self.firstName = firstName\n        self.lastName = lastName\n        Employee.noOfEmployees\
    \ = Employee.noOfEmployees + 1\n\n    def displayEmployee(self):\n        print(self.id,\
    \ self.firstName, self.lastName)\n\nemp1 = Employee(1, \"Hari JJTam\", \"Delhi\"\
    )\nprint(\"Total Employees\", Employee.noOfEmployees)\nemp2 = Employee(2, \"PTR\"\
    , \"Nayan\")\nprint(\"Total Employees\", Employee.noOfEmployees)\nemp3 = Employee(3,\
    \ \"Sankalp\", \"Dubey\")\nprint(\"Total Employees\", Employee.noOfEmployees)\n\
    \nemp1.displayEmployee()\nemp2.displayEmployee()\nemp3.displayEmployee()\n```\n\
    \n```\n$ python3 test.py\nTotal Employees 1\nTotal Employees 2\nTotal Employees\
    \ 3\n1 Hari JJTam Delhi\n2 PTR Nayan\n3 Sankalp Dubey\n```\n\n### `__init__(arguments)`\n\
    \n`__init__` is a special function called constructor used to initialize objects.\
    \ In `Employee` class, `__init__` method is used to initialize `id`, `firstName`,\
    \ `lastName` to an object at the time of creation.\n\n### `noOfEmployees=0`\n\n\
    `noOfEmployees` is a class variable, shared by all the objects. Class variable\
    \ are accessed using Class name like `ClassName.variableName`, `Employee.noOfEmployees`\
    \ is used to access the class variable `noOfEmployees`.\n\n### Instance variables\n\
    \nInstance variables have values unique to an object. Usually these are defined\
    \ in `__init__` method. `Employee` class has 3 instance variables `id`, `firstName`,\
    \ `lastName`.\n\nThe first parameter of any method in a class must be `self`.\
    \ This parameter is required even if the function does not use it. `self` is used\
    \ to refer current object.\n\n## Python: class: built in class attributes\n\n\
    Following are the built in class attributes.\n\n| Attribute | Description |\n\
    | `__dict__` | Dictionary contains class namespace. |\n| `__doc__` | Points to\
    \ documentation string of a class |\n| `__name__` | Class name |\n| `__module__`\
    \ | Module name in which the class is defined |\n| `__bases__` | Tuple representing\
    \ the base classes of this class |"
