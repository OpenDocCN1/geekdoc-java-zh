    >>> oddNumbers\n{9, 3, 5, 1, 7}\n>>> powersOf2\n{16, 8, 2, 4, 1}\n>>> number s\
    \ . intersection_update(oddNumbers, powersOf2)\n>>> numbers\n{1}\n```\n\n## Difference\
    \ update\n\n`difference_update(other, ...)`\n\n`set -= other | ...`\n\nUpdate\
    \ the set, removing elements found in others.\n\n```\n>>> oddNumbers\n{9, 3, 5,\
