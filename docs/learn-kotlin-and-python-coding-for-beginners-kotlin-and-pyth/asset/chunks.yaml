  trans: " \n # Kotlin：`const` 与 `val`\n\n`const` 关键字用于定义编译期常量，也就是说，`const` 变量的值在编译时就已经确定。而\
    \ `val` 则用于定义运行期常量。\n\n例如，你不能像下面这样定义 `const`。\n\n```kotlin\nconst val PICon =\
    \ getPI()\n```\n\n当你尝试编译包含上述语句的 Kotlin 程序时，你会遇到如下错误。\n\n> 'Const 'val' has type\
    \ 'Unit'. Only primitives and String are allowed'.\n\n这是因为 `getPI()` 是在运行期求值并将值赋给\
    \ `PICon`，但 `const` 是用来在编译期定义常量的。\n\n请看下面的可运行示例。\n\n`HelloWorld.kt`\n\n```kotlin\n\
    const val VENDOR_NAME = \"Self Learning Java blog\"\nval PICon = getPI()\n\nfun\
    \ getPI (): Double {\n    return 3.14\n}\n\nfun main (args: Array<String>) {\n\
    \    println( \"Vendor Name $VENDOR_NAME\" )\n    println( \"Value of PI : $PICon\"\
    \ )\n}\n```\n\n**输出**\n\n```\nVendor Name Self Learning Java blog\nValue of PI\
    \ : 3.14\n```\n\n# Kotlin：`lateinit`：延迟初始化属性\n\n默认情况下，Kotlin 不允许存在未初始化的属性。你必须在声明时（或）在构造函数中对其进行初始化。让我用一个例子来说明。\n\
    \n`HelloWorld.kt`\n\n```kotlin\nclass Employee {\n    var id : String\n    var\
    \ name : String\n    var city : String\n}\n```\n\n当你尝试编译上述程序时，你会遇到如下错误。\n\n```\n\
    ERROR: Property must be initialized or be abstract (2, 2)\nERROR: Property must\
    \ be initialized or be abstract (3, 2)\nERROR: Property must be initialized or\
    \ be abstract (4, 2)\n```\n\n## 如何解决上述问题？\n\n有三种方法：\n- a. 在声明时初始化变量\n- b. 在构造函数中定义变量\n\
    - c. 使用延迟初始化\n\n### 在声明时初始化变量\n\n```kotlin\nclass Employee {\n    var id: String\
    \ = \"123\"\n    var name: String = \"JJTam\"\n    var city: String = \"Ongole\"\
    \n}\n```\n\n### 在构造函数中定义变量\n\n```kotlin\nclass Employee {\n    var id: String\n\
    \    var name: String\n    var city: String\n\n    constructor() {\n        id\
    \ = \"123\"\n        name = \"JJTam\"\n        city = \"Ongole\"\n    }\n}\n```\n\
    \n### 使用延迟初始化\n\n通过使用 `lateinit` 关键字，我们可以告知 Kotlin 该变量将在稍后某个时间点进行初始化。\n\n```kotlin\n\
    class Employee {\n    lateinit var id: String\n    lateinit var name: String\n\
    \    lateinit var city: String\n}\n```\n\n## 我可以在初始化之前访问 `lateinit` 属性吗？\n\n不可以。如果你尝试在初始化之前访问\
    \ `lateinit` 属性，你会遇到 `UninitializedPropertyAccessException`。\n\n`HelloWorld.kt`\n\
    \n```kotlin\nclass Employee {\n    lateinit var id: String\n    lateinit var name:\
    \ String\n    lateinit var city: String\n}\n\nfun main (args: Array<String>) {\n\
    \    var obj = Employee()\n    println( \"Id : ${obj.id}\" )\n}\n```\n\n当你尝试运行上述程序时，你会遇到如下异常。\n\
    \n```\nException in thread \"main\" kotlin.UninitializedPropertyAccessException:\
    \ lateinit property id has not been initialized\n    at Employee.getId(HelloWorld.kt:2)\n\
    \    at HelloWorldKt.main(HelloWorld.kt:10)\n```\n\n要解决该错误，请在访问之前定义 `lateinit`\
    \ 属性。\n\n`HelloWorld.kt`\n\n```kotlin\nclass Employee {\n    lateinit var id:\
    \ String\n    lateinit var name: String\n    lateinit var city: String\n}\n\n\
    fun main (args: Array<String>) {\n    var obj = Employee()\n    obj.id = \"123\"\
    \n    println( \"Id : ${obj.id}\" )\n}\n```\n\n**输出**\n\n```\nId : 123\n```\n\n\
    # Kotlin：构造函数\n\nKotlin 类有一个主构造函数和一个或多个次构造函数。构造函数使用 `constructor` 关键字定义。\n\n##\
    \ 主构造函数\n\n主构造函数定义为类头的一部分。\n\n示例\n\n```kotlin\nclass Employee constructor(fName:\
    \ String, lName: String) {\n    ....\n    ....\n}\n```\n\n`Employee.kt`\n\n```kotlin\n\
    class Employee constructor (fName: String, lName: String) {\n    init{\n     \
    \   println( \"fName : $fName, lName : $lName\" )\n    }\n}\n```\n\n`Main.kt`\n\
    \n```kotlin\nfun main (args: Array<String>) {\n    var emp1 = Employee( \"Hareesh\"\
    \ , \"Seeram\" )\n}\n```\n\n**输出**\n\n```\nfName : Hareesh, lName : Seeram\n```\n\
    \n`init{}` 相当于 Java 的初始化块，用于放置对象初始化代码。该块在每次对象实例化时都会被调用。\n\n如果主构造函数没有任何修饰符（或）注解，定义主构造函数时可以省略\
    \ `constructor` 关键字。\n\n`Employee.kt`\n\n```kotlin\nclass Employee (fName: String,\
    \ lName: String) {\n    init{\n        println( \"fName : $fName, lName : $lName\"\
    \ )\n    }\n}\n```\n\n### 将成员变量定义为主构造函数的一部分\n\n如果你在主构造函数的类型参数前添加 `var`/`val` 关键字，它会在类中创建一个字段。\n\
    \n`Main.kt`\n\n```kotlin\nclass Employee ( var firstName: String, var lastName:\
    \ String) {}\n\nfun main (args: Array<String>) {\n    var emp1 = Employee( \"\
    Hareesh\" , \"Seeram\" )\n    println( \"firstName : ${emp1.firstName}, lastName\
    \ : ${emp1.lastName}\" )\n}\n```\n\n**输出**\n\n```\nfirstName : Hareesh, lastName\
    \ : Seeram\n```\n\n在上述代码片段中，我将 `firstName` 和 `lastName` 字段定义为主构造函数的一部分。\n\n# Kotlin：次构造函数\n\
    \nKotlin 类可以有多个次构造函数。\n\n## 如何定义次构造函数？\n\n你应该使用 `constructor` 关键字来定义次构造函数。\n\n\
    **语法**\n\n```kotlin\nconstructor(arguments){\n```\n"
- fmt: " ```kotlin\nclass Employee {\n  var firstName: String = \"\"\n  var lastName:\
    \ String = \"\"\n  constructor(firstName: String) {\n    this.firstName = firstName\n\
    \    this.lastName = firstName\n  }\n  constructor(firstName: String, lastName:\
    \ String) {\n    this.firstName = firstName\n    this.lastName = lastName\n  }\n\
    }\n\nfun printEmployee(emp: Employee) {\n  println(\"firstName : ${emp.firstName},\
    \ lastName : ${emp.lastName}\")\n}\n\nfun main(args: Array<String>) {\n  var emp1\
    \ = Employee(\"Hareesh\", \"Seeram\")\n  var emp2 = Employee(\"Praneeth\")\n \
    \ printEmployee(emp1)\n  printEmployee(emp2)\n}\n```\n\nOutput\n\n```\nfirstName\
    \ : Hareesh, lastName : Seeram\nfirstName : Praneeth, lastName : Praneeth\n```\n\
    \nPrimary constructor must be called from secondary constructor explicitly. What\
    \ I mean is, if a class has primary constructor, then the secondary constructor\
    \ must delegate to the primary constructor either directly (or) indirectly using\
    \ other secondary constructors.\n\n```kotlin\nclass Employee(var firstName: String)\
    \ {\n  ...\n  ...\n  constructor(fName: String, lName: String) : this(fName) {\n\
    \    this.lastName = lName\n    this.id = \"\"\n  }\n}\n```\n\nIn the above example,\
    \ `Employee` class has a primary constructor, We are calling primary constructor\
    \ using `this` keyword, while defining secondary constructor.\n\n`ConstructorDemo.kt`\n\
    \n```kotlin\nclass Employee(var firstName: String) {\n  var lastName: String =\
    \ \"\"\n  var id: String = \"\"\n  constructor(fName: String, lName: String) :\
    \ this(fName) {\n    this.lastName = lName\n    this.id = \"\"\n  }\n  constructor(fName:\
    \ String, lName: String, id: String) : this(fName) {\n    this.lastName = lName\n\
    \    this.id = id\n  }\n}\n\nfun printEmployee(emp: Employee) {\n  println(\"\
    id : ${emp.id}, firstName : ${emp.firstName}, lastName : ${emp.lastName}\")\n\
    }\n\nfun main(args: Array<String>) {\n  var emp1 = Employee(\"JJTam\")\n  var\
    \ emp2 = Employee(\"Hareesh\", \"Seeram\")\n  var emp3 = Employee(\"Praneeth\"\
    , \"Sai\", \"123\")\n  printEmployee(emp1)\n  printEmployee(emp2)\n  printEmployee(emp3)\n\
    }\n```\n\nOutput\n\n```\nid : , firstName : JJTam, lastName :\nid : , firstName\
    \ : Hareesh, lastName : Seeram\nid : 123, firstName : Praneeth, lastName : Sai\n\
    ```\n\n## Kotlin: Passing default values to primary constructor\n\nYou can pass\
    \ default values to the primary constructor.\n\nEx:\n\n```kotlin\nclass Employee(var\
    \ firstName: String = \"JJTam\", var lastName: String = \"Delhi\") {\n}\n```\n\
    \nAbove snippet defines a primary constructor to the class `Employee`, with default\
    \ values.\n\n```kotlin\nvar emp1 = Employee()\n```\n\nSince we do not pass any\
    \ arguments to the constructor, `firstName` and `lastName` are initialized with\
    \ default values. `firstName` is initialized with `JJTam` and `lastName` is initialized\
    \ with `Delhi`\n\n```kotlin\nvar emp2 = Employee(\"Rachit\")\n```\n\nSince we\
    \ passed only first argument, `firstName` is assigned with value `Rachit` and\
    \ `lastName` is assigned with value `Del`hi\n\n```kotlin\nvar emp3 = Employee(\"\
    Shwetha\", \"kam\")\n```\n\n`firstName` is assigned with value `Shwetha` and `lastName`\
    \ is assigned with value `Kam`.\n\n`ConstructorDemo.kt`\n\n```kotlin\nclass Employee(var\
    \ firstName: String = \"JJTam\", var lastName: String = \"Delhi\") {\n}\n\nfun\
    \ printEmployee(emp: Employee) {\n  println(\"firstName : ${emp.firstName}, lastName\
    \ : ${emp.lastName}\")\n}\n\nfun main(args: Array<String>) {\n  var emp1 = Employee()\n\
    \  var emp2 = Employee(\"Rachit\")\n  var emp3 = Employee(\"Shwetha\", \"kam\"\
    )\n  printEmployee(emp1)\n  printEmployee(emp2)\n  printEmployee(emp3)\n}\n```\n\
    \nOutput\n\n```\nfirstName : JJTam, lastName : Delhi\nfirstName : Rachit, lastName\
    \ : Delhi\nfirstName : Shwetha, lastName : kam\n```\n\n## Kotlin: Define private\
    \ primary constructor\n\nBy specifying the `private` access specifier in the class\
    \ header, you can define a private primary constructor.\n\n`PrivateConDemo.kt`\n\
    \n```kotlin\nclass Employee private constructor(var firstName: String) {\n  var\
    \ lastName: String = \"\"\n  constructor(fName: String, lName: String) : this(fName)\
    \ {\n    this.lastName = lName\n  }\n}\n\nfun printEmployee(emp: Employee) {\n\
    \  println(\"firstName : ${emp.firstName}, lastName : ${emp.lastName}\")\n}\n\n\
    fun main(args: Array<String>) {\n  var emp1 = Employee(\"Shwetha\", \"kam\")\n\
    \  printEmployee(emp1)\n}\n```\n\nOutput\n\n```\nfirstName : Shwetha, lastName\
    \ : kam\n```\n\n## Kotlin: How to create Object\n\nUnlike Java, `new` keyword\
    \ is not required to define an object.\n\nSyntax\n\n```kotlin\nvar objectName\
    \ = ClassName(arguments)\n```\n\nEx\n\n```kotlin\nvar emp1 = Employee(\"Shwetha\"\
    )\nvar emp2 = Employee(\"JJTam\", \"G\")\n```\n\n`ConstructorDemo.kt`\n\n```kotlin\n\
    class Employee {\n  var firstName: String = \"\"\n  var lastName: String = \"\"\
    \n  constructor(fName: String) {\n    this.firstName = fName\n    this.lastName\
    \ = fName\n  }\n  constructor(fName: String, lName: String) {\n    this.firstName\
    \ = fName\n    this.lastName = lName\n  }\n}\n\nfun printEmployee(emp: Employee)\
    \ {\n  println(\"firstName : ${emp.firstName}, lastName : ${emp.lastName}\")\n\
    }\n\nfun main(args: Array<String>) {\n  var emp1 = Employee(\"Shwetha\")\n  var\
    \ emp2 = Employee(\"JJTam\", \"G\")\n  printEmployee(emp1)\n  printEmployee(emp2)\n\
    }\n```\n\nOutput\n\n```\nfirstName : Shwetha, lastName : Shwetha\nfirstName :\
    \ JJTam, lastName : G\n```\n\n## Kotlin: Inheritance\n\nInheritance is the concept\
    \ of re usability. Object of one class can get the properties and methods of object\
    \ of another class by using inheritance.\n\nBy using inheritance, you can create\
    \ new class by extending the existing class. The new class is called derived class\
    \ and the existing class is called base class.\n\n![](Image00012.jpg)\n\nExample\n\
    \n```kotlin\nopen class BaseClass {\n}\n\nclass DerivedClass : BaseClass {\n}\n\
    ```\n\nBy default, all the classes in kotlin are final. To make these class inheritable,\
    \ you should use the keyword `open`.\n\nLet's see inheritance feature by an example.\
    \ In every organization, there are two kinds of employees.\n\na. Permanent Employees\n\
    b. Contract Employees\n\nBoth the permanent and contract employees share properties\
    \ like `firstName`, `lastName` and `id`. Where as contract employees has separate\
    \ payroll company. We can place these common properties (`firstName`, `lastName`\
    \ and `id`) in separate class `Employee` and make the classes `PermanentEmployee`\
    \ and `ContractEmployee` inherit these properties from the common base class `Employee`.\n\
    \n![](Image00013.jpg)\n\n```kotlin\nopen class Employee {\n}\n\nclass PermanentEmployee\
    \ : Employee {\n}\n\nclass ContractEmployee : Employee {\n}\n```\n\nFind the below\
    \ working application.\n\n`Inheritance.kt`\n\n```kotlin\nopen class Employee {\n\
    \  var firstName: String = \"\"\n  var lastName: String = \"\"\n  var id: String\
    \ = \"\"\n  constructor(firstName: String, lastName: String, id: String) {\n \
    \   this.firstName = firstName\n    this.lastName = lastName\n    this.id = id\n\
    \  }\n  open fun getEmployee(): String {\n    return \"firstName : $firstName,\
    \ lastName: $lastName, id: $id\"\n  }\n}\n\nclass PermanentEmployee : Employee\
    \ {\n  var healthInsuranceNumber = \"\"\n  var salary: Double = 0.0\n  constructor(firstName:\
    \ String, lastName: String, id: String, healtInsuranceNumber: String, salary:\
    \ Double) : super(firstName, lastName, id) {\n    this.healthInsuranceNumber =\
    \ healtInsuranceNumber\n    this.salary = salary\n  }\n  override fun getEmployee():\
    \ String {\n    return super.getEmployee() + \", healthInsuranceNumber: $healthInsuranceNumber,\
    \ salary: $salary\"\n  }\n}\n\nclass ContractEmployee : Employee {\n  var payRollCompany\
    \ = \"ABC\"\n  constructor(firstName: String, lastName: String, id: String, payRollCompany:\
    \ String) : super(firstName, lastName, id) {\n    this.payRollCompany = payRollCompany\n\
    \  }\n  override fun getEmployee(): String {\n    return super.getEmployee() +\
    \ \", payRollCompany: $payRollCompany\"\n  }\n}\n\nfun main(args: Array<String>)\
    \ {\n  var emp = PermanentEmployee(\"JJTam\", \"Delhi\", \"123\", \"health3425\"\
    , 56789.01)\n  println(emp.getEmployee())\n}\n```\n\nOutput\n\n```\nfirstName\
    \ : JJTam, lastName: Delhi, id: 123, healthInsuranceNumber: health3425, salary:\
    \ 56789.01\n```\n\n```kotlin\nconstructor(firstName: String, lastName: String,\
    \ id: String, healtInsuranceNumber: String, salary: Double) : super(firstName,\
    \ lastName, id)\n```\n\nIf super class don't have default constructor, then all\
    \ the sub class constructors must call the super class constructor explicitly.\n\
    \nBy default, all the functions and classes are not inheritable (final), to make\
    \ them inheritable, you should use the keyword `open`.\n\n```kotlin\nopen class\
    \ Employee {\n  open fun getEmployee(): String {\n    return \"firstName : $firstName,\
    \ lastName: $lastName, id: $id\"\n  }\n}\n```\n\nTo override a function of super\
    \ class, you should use `override` keyword.\n\n```kotlin\nclass PermanentEmployee\
    \ : Employee {\n  override fun getEmployee(): String {\n    return super.getEmployee()\
    \ + \", healthInsuranceNumber: $healthInsuranceNumber, salary: $salary\"\n  }\n\
    }\n```\n\n### Important Points\n\na. If the class has a primary constructor, the\
    \ base type can (and must) be initialized right there, using the parameters of\
    \ the primary constructor.\n\nb. If the class has no primary constructor, then\
    \ each secondary constructor has to initialize the base type using the `super`\
    \ keyword, or to delegate to another constructor which does that. Note that in\
    \ this case different secondary constructors can call different constructors of\
    \ the base type.\n\n## Kotlin: Overriding methods\n\nBy using `override` keyword,\
    \ you can override the methods of base class. By default all the methods in a\
    \ class are final (not overridable), you can make them overridable by using `open`\
    \ keyword'.\n\n`Override.kt`\n\n```kotlin\nopen class BaseClass {\n  open fun\
    \ sayHello() {\n    println(\"******Hello World******\")\n  }\n}\n\nclass DerivedClass\
    \ : BaseClass() {\n  override fun sayHello() {\n    println(\"@@@@Hello World@@@@@\"\
    )\n  }\n}\n\nfun main(args: Array<String>) {\n  var obj = DerivedClass()\n  obj.sayHello()\n\
    }\n```\n\nOutput\n\n```\n@@@@Hello World@@@@@\n```\n\nAs you observe above snippet,\
    \ `DerivedClass` inherits from `BaseClass`. `sayHello()` method of `DerivedClass`\
    \ override the `sayHello()` method of `BaseClass` using `override` keyword.\n\n\
    A method defined with the keyword `override` is itself open, so the child classes\
    \ of the `DerivedClass`, can override this method.\n\n`Override.kt`\n\n```kotlin\n\
    open class BaseClass {\n  open fun sayHello() {\n    println(\"******Hello World******\"\
    )\n  }\n}\n\nopen class DerivedClass : BaseClass() {\n  override fun sayHello()\
    \ {\n    println(\"@@@@Hello World@@@@@\")\n  }\n}\n\nclass ChildDerivedClass\
    \ : DerivedClass() {\n  override fun sayHello() {\n    println(\"####Hello World####\"\
    )\n  }\n}\n\nfun main(args: Array<String>) {\n  var obj = ChildDerivedClass()\n\
    \  obj.sayHello()\n}\n```\n\nOutput\n\n```\n####Hello World####\n```\n\nIf you\
    \ want to prohibit the re-overriding, use the keyword `final`.\n\nEx\n\n```kotlin\n\
    open class DerivedClass : BaseClass() {\n  final override fun sayHello() {\n \
    \   println(\"@@@@Hello World@@@@@\")\n  }\n}\n```\n\n`Override.kt`\n\n```kotlin\n\
    open class BaseClass {\n  open fun sayHello() {\n    println(\"******Hello World******\"\
    )\n  }\n}\n\nopen class DerivedClass : BaseClass() {\n  final override fun sayHello()\
    \ {\n    println(\"@@@@Hello World@@@@@\")\n  }\n}\n\nclass ChildDerivedClass\
    \ : DerivedClass() {\n  override fun sayHello() {\n    println(\"####Hello World####\"\
    )\n  }\n}\n\nfun main(args: Array<String>) {\n  var obj = ChildDerivedClass()\n\
    \  obj.sayHello()\n}\n```\n\nWhen you try to compile above program, kotlin compiler\
    \ throws below error.\n\n```\n'sayHello' in 'DerivedClass' is final and cannot\
    \ be overridden\n```\n\n## Kotlin: Overriding properties\n\nIn my previous post,\
    \ I explained how to override methods, overriding of properties is similar to\
    \ overriding of methods.\n\nBelow step by step procedure explains, how to override\
    \ a property.\n\nStep 1: Define a variable with `open` modifier in Base class.\n\
    \n```kotlin\nopen class BaseClass {\n  open var name: String = \"Base Class\"\n\
    }\n```\n\nStep 2: In sub class redefine the variable with same name using `override`\
    \ modifier.\n\n```kotlin\nopen class DerivedClass : BaseClass() {\n  override\
    \ var name: String = \"Derived Class\"\n}\n```\n\nFind the below working application.\n\
    \n`Inheritance.kt`\n\n```kotlin\nopen class BaseClass {\n  open var name: String\
    \ = \"Base Class\"\n}\n\nopen class DerivedClass : BaseClass() {\n  override var\
    \ name: String = \"Derived Class\"\n}\n\nfun main(args: Array<String>) {\n  var\
    \ obj = DerivedClass()\n  println(\"name : $obj.name\")\n}\n```\n\nOutput\n\n\
    ```\nname : Derived Class\n```\n\n### Can I override a val property with var property?\n\
    \nYes, you can override a `val` property with a `var` property.\n\n`Inheritance.kt`\n\
    \n```kotlin\nopen class BaseClass {\n  open val name: String = \"Base Class\"\n\
    }\n\nopen class DerivedClass : BaseClass() {\n  override var name: String = \"\
    Derived Class\"\n}\n\nfun main(args: Array<String>) {\n  var obj = DerivedClass()\n\
    \  println(\"name : ${obj.name}\")\n}\n```\n\n### Can I override a var property\
    \ with val property?\n\nNo, you can't override a `var` property with `val` property.\n\
    \n`Inheritance.kt`\n\n```kotlin\nopen class BaseClass {\n  open var name: String\
    \ = \"Base Class\"\n}\n\nopen class DerivedClass : BaseClass() {\n  override val\
    \ name: String = \"Derived Class\"\n}\n\nfun main(args: Array<String>) {\n  var\
    \ obj = DerivedClass()\n  println(\"name : ${obj.name}\")\n}\n```\n\nWhen you\
    \ try to compile above program, you will end up in below compilation error.\n\n\
    ```\nERROR: Var-property public open val name: String defined in DerivedClass\
    \ cannot be overridden by val-property public open var name: String defined in\
    \ BaseClass (6, 11)\n```\n\n## Kotlin: Calling super class methods\n\nBy using\
    \ `super` keyword, you can call super class methods.\n\nSyntax\n\n```kotlin\n\
    super.methodName\n```\n\n`SuperDemo.kt`\n\n```kotlin\nopen class BaseClass {\n\
    \  open fun printMsg() {\n    println(\"Hello Base class\")\n  }\n}\n\nopen class\
    \ DerivedClass : BaseClass() {\n  override fun printMsg() {\n    println(\"Hello\
    \ Derived class\")\n    super.printMsg()\n  }\n}\n\nfun main(args: Array<String>)\
    \ {\n  var obj = DerivedClass()\n  obj.printMsg()\n}\n```\n\nOutput\n\n```\nHello\
    \ Derived class\nHello Base class\n```\n\n## Kotlin: Nested classes\n\nA class\
    \ can be nested in other class.\n\nEx\n\n```kotlin\nclass Outer {\n  class Nested\
    \ {\n  }\n}\n```\n\n### How to create an object to nested class?\n\n```kotlin\n\
    var obj = Outer.Nested()\n```\n\n`NestedClass.kt`\n\n```kotlin\nclass Outer {\n\
    \  fun printMsg() {\n    println(\"Inside Outer class\")\n  }\n  class Nested\
    \ {\n    fun printMsg() {\n      println(\"Inside Nested class\")\n    }\n  }\n\
    }\n\nfun main(args: Array<String>) {\n  var outerObj = Outer()\n  var nestedObj\
    \ = Outer.Nested()\n  outerObj.printMsg()\n  nestedObj.printMsg()\n}\n```\n\n\
    Output\n\n```\nInside Outer class\nInside Nested class\n```\n\n### Can I access\
    \ the member variables defined in outer class from nested class?\n\nNo, you can't\
    \ access the member variables defined in outer class from nested class.\n\n`NestedDemo.kt`\n\
    \n```kotlin\nclass Outer {\n  private var x = 10\n  class Inner {\n    fun getX()\
    \ = x\n  }\n}\n```\n\nWhen you try to compile above program, you will end up in\
    \ below error.\n\n```\nUnresolved reference: x\n```\n\n## Kotlin: Inner classes\n\
    \nInner classes are like nested class, only difference is you can access the members\
    \ of outer class from inner class.\n\n### How to define inner class?\n\nInner\
    \ class is defined using the keyword `inner`.\n\n### How to define object of inner\
    \ class?\n\n```kotlin\nvar innerObj = Outer().Inner()\n```\n\n`InnerDemo.kt`\n\
    \n```kotlin\nclass Outer {\n  fun printMsg() {\n    println(\"Inside Outer class\"\
    )\n  }\n  inner class Inner {\n    fun printMsg() {\n      println(\"Inside Inner\
    \ class\")\n    }\n  }\n}\n\nfun main(args: Array<String>) {\n  var outerObj =\
    \ Outer()\n  var innerObj = Outer().Inner()\n  outerObj.printMsg()\n  innerObj.printMsg()\n\
    }\n```\n\nOutput\n\n```\nInside Outer class\nInside Inner class\n```\n\nYou can\
    \ able to access the member variables of outer class from inner class.\n\n`InnerDemo.kt`\n\
    \n```kotlin\nclass Outer {\n  private var x = 10\n  inner class Inner {\n    fun\
    \ getX() = x\n  }\n}\n\nfun main(args: Array<String>) {\n  var innerObj = Outer().Inner()\n\
    \  var x = innerObj.getX()\n  println(\"x = $x\")\n}\n```\n\nOutput\n\n```\nx\
    \ = 10\n```\n\n## Kotlin: Interfaces\n\n### What is an Interface?\n\nInterfaces\
    \ are the contracts in the outside world.\n\n### What it mean?\n\nTake an example,\
    \ let us assume, there is a standard for all mobile phones, as per the standard,\
    \ below are the basic functionality for the mobile phones to provide.\n\n[![](Image00014.jpg)](https://1.bp.blogspot.com/-BmT-R4h8cDM/Wld5KaEiVUI/AAAAAAAAJOM/GA-J8OYY53IuzCeKXvF4NK27qYfFwHa1gCLcBGAs/s1600/kotlin+interfaces.jpg)\n\
    \nVendor1 provides the functionality for the mobile in language JAVA\n\nVendor2\
    \ provides the functionality for the mobile in language C++\n\nVendor3 provides\
    \ the functionality for the mobile in language JAVA\n\nVendor4 provides the functionality\
    \ for the mobile in language C\n\nthat mean all the vendors providing the same\
    \ functionality, but the way they are providing is different.\n\nOne more example\
    \ is IBM JAVA, Oracle JAVA are providing the functionality for JAVA, but the way\
    \ they implemented the features is different.\n\n### How to define an interface\
    \ in kotlin?\n\nYou can define the interfaces using `interface` keyword. Interfaces\
    \ in kotlin are similar to interfaces in Java8.\n\n```kotlin\ninterface InterfaceName\
    \ {\n  /* Function without body */\n  fun method1()\n  /* Function with body */\n\
    \  fun mehtod2() {\n  }\n}\n```\n\n### How to implement an interface?\n\nkotlin\
    \ class can implement one or more interfaces.\n\nSyntax\n\n```kotlin\nclass ClassName\
    \ : Interface1, Interface2...InterfaceN {\n}\n```\n\nFind the below working application.\n\
    \n`HelloWorld.kt`\n\n```kotlin\ninterface Arithmetic {\n  fun sum(a: Int, b: Int):\
    \ Int\n  fun sub(a: Int, b: Int): Int\n}\n\nclass ArithmeticImpl : Arithmetic\
    \ {\n  override fun sum(a: Int, b: Int): Int {\n    return a + b\n  }\n  override\
    \ fun sub(a: Int, b: Int): Int {\n    return a - b\n  }\n}\n\nfun main(args: Array<String>)\
    \ {\n  var obj = ArithmeticImpl()\n  println(\"Sum of 10 and 20 is : ${obj.sum(10,\
    \ 20)}\")\n  println(\"Sub of 10 and 20 is : ${obj.sub(10, 20)}\")\n}\n```\n\n\
    Output\n\n```\nSum of 10 and 20 is : 30\nSub of 10 and 20 is : -10\n```\n\n###\
    \ Can a class implement more than one interface?\n\nyes, a class can implement\
    \ more than one interfaces.\n\n```kotlin\nclass ArithmeticImpl : Arithmetic, Message\
    \ {\n}\n```\n\nIn the above example, `ArithmeticImpl` class is implementing `Arithmetic`\
    \ and `Message` interfaces.\n\nFind the below working application.\n\n`HelloWorld.kt`\n\
    \n```kotlin\ninterface Arithmetic {\n  fun sum(a: Int, b: Int): Int\n  fun sub(a:\
    \ Int, b: Int): Int\n}\n\ninterface Message {\n  fun amoutMe(): String\n}\n\n\
    class ArithmeticImpl : Arithmetic, Message {\n  override fun sum(a: Int, b: Int):\
    \ Int {\n    return a + b\n  }\n  override fun sub(a: Int, b: Int): Int {\n  \
    \  return a - b\n  }\n  override fun amoutMe(): String {\n    return \"ArithmeticImpl\
    \ class\"\n  }\n}\n\nfun main(args: Array<String>) {\n  var obj = ArithmeticImpl()\n\
    \  println(\"Sum of 10 and 20 is : ${obj.sum(10, 20)}\")\n  println(\"Sub of 10\
    \ and 20 is : ${obj.sub(10, 20)}\")\n  println(obj.amoutMe())\n}\n```\n\nOutput\n\
    \n```\nSum of 10 and 20 is : 30\nSub of 10 and 20 is : -10\nArithmeticImpl class\n\
    ```\n\n### Can I define properties in interface?\n\nYes, you can define properties\
    \ in interfaces. Properties can be abstract (or) have definition.\n\n`HelloWorld.kt`\n\
    \n```kotlin\ninterface DemoInterface {\n  var variable1: String\n  val variable2:\
    \ String\n    get() = \"Hello World\"\n}\n\nclass MyClass : DemoInterface {\n\
    \  override var variable1: String = \"Hello\"\n}\n\nfun main(args: Array<String>)\
    \ {\n  var obj = MyClass()\n  println(\"variable1 : ${obj.variable1}\")\n  println(\"\
    variable2 : ${obj.variable2}\")\n}\n```\n\nOutput\n\n```\nvariable1 : Hello\n\
    variable2 : Hello World\n```\n\n## Kotlin: Overriding conflict while implementing\
    \ interfaces\n\nIf you are implementing more than one interface and those interfaces\
    \ have same method signatures, then you will end up in conflict scenario.\n\n\
    `HelloWorld.kt`\n\n```kotlin\ninterface Interface1 {\n  fun welcomeMessage(name:\
    \ String) {\n    println(\"Welcome $name\")\n  }\n}\n\ninterface Interface2 {\n\
    \  fun welcomeMessage(name: String) {\n    println(\"Good Morning $name\")\n \
    \ }\n}\n\nclass MyClass : Interface1, Interface2 {\n}\n```\n\nWhen you try to\
    \ compile above program, you will end up in below error.\n\n```\nERROR: Class\
    \ 'MyClass' must override public open fun welcomeMessage(name: String): Unit defined\
    \ in Interface1 because it inherits multiple interface methods of it (13, 1)\n\
    ```\n\n### How to resolve above error?\n```"
