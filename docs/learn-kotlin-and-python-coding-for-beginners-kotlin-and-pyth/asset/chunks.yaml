  trans: " \n字节码不是机器可理解的代码，它是 Python 特有的表示形式。\n\n## Python 交互式命令行\n\n打开命令提示符（或）终端，输入\
    \ `python3` 命令。这将打开 Python 交互式会话。\n\n```\n$ python3\nPython 3.5.0 (v3.5.0:374f501f4567,\
    \ Sep 12 2015, 11:00:19)\n[GCC 4.2.1] on darwin\nType \"help\", \"copyright\"\
    , \"credits\" or \"license\" for more information.\n>>>\n```\n\n### 如何退出 Python\
    \ 解释器\n\n在 Windows 上，按 `Ctrl-Z` 可以退出此会话；在 Unix 上，请尝试按 `Ctrl-D`。另一种方法是直接调用 `quit()`\
    \ 函数来退出 Python。\n\n```\n$ python3\nPython 3.5.0 (v3.5.0:374f501f4567, Sep 12 2015,\
    \ 11:00:19)\n[GCC 4.2.1] on darwin\nType \"help\", \"copyright\", \"credits\"\
    \ or \"license\" for more information.\n>>> quit()\n$\n```\n\n你可以在 Python 解释器中输入任何语句（或）表达式，解释器会执行这些语句并给出结果。\n\
    \n```\n>>> 10+20\n30\n>>> 20*20\n400\n>>> print('Hello World')\nHello World\n\
    ```\n\n**注意：** 在 Unix 上，Python 3.x 解释器默认不会以 `python` 名称安装，以避免与其他已安装的 Python 2.x\
    \ 可执行文件冲突。\n\n## Python：运算符\n\n运算符是一种符号，用于执行操作。以下是 Python 支持的运算符。\n\n- 算术运算符\n\
    - 关系运算符\n- 赋值运算符\n- 逻辑运算符\n- 位运算符\n- 成员运算符\n- 身份运算符\n\n### Python 中的算术运算符\n\n\
    以下是 Python 支持的算术运算符。\n\n| 运算符 | 描述 | 示例 |\n| + | 加法 | `2+3` |\n| - | 减法 | `2-3`\
    \ |\n| * | 乘法 | `2*3` |\n| / | 除法始终返回浮点数值。要仅获取整数结果，请使用 `//`。 | `2/3` 返回 `0.6666666666666666`\
    \ |\n| // | 地板除法，舍弃小数部分 | `2//3` 返回 `0` |\n| % | 返回除法的余数。 | `2%3` |\n| ** | 幂运算\
    \ | `2**3` 返回 2 的 3 次方 = `8` |\n\n```\n>>> 4 + 2\n6\n>>> 4 - 2\n2\n>>> 4 / 2\n\
    2.0\n>>> 4 * 2\n8\n>>> 4 // 2\n2\n>>> 4 ** 2\n16\n```\n\n### Python 中的关系运算符\n\n\
    关系运算符用于判断一个操作数是否大于、小于、等于或不等于另一个操作数。\n\n| 运算符 | 描述 | 示例 |\n| == | 等于 | `a==b` 如果\
    \ a 等于 b 则返回 true，否则返回 false |\n| != | 不等于 | `a!=b` 如果 a 不等于 b 则返回 true，否则返回 false。\
    \ |\n| > | 大于 | `a>b` 如果 a > b 则返回 true，否则返回 false。 |\n| >= | 大于或等于 | `a>=b` 如果\
    \ a >= b 则返回 true，否则返回 false。 |\n| < | 小于 | `a<b` 如果 a < b 则返回 true，否则返回 false。\
    \ |\n| <= | 小于或等于 | `a<=b` 如果 a <= b 则返回 true，否则返回 false。 |\n\n```\n>>> a = 10\n\
    >>> b = 12\n>>> a == b\nFalse\n>>> a != b\nTrue\n>>> a > b\nFalse\n>>> a >= b\n\
    False\n>>> a < b\nTrue\n>>> a <= b\nTrue\n```\n\n### Python 中的赋值运算符\n\n赋值运算符用于给变量赋值。以下是\
    \ Python 提供的赋值运算符。\n\n| 运算符 | 描述 |\n| = | `a=10` 将 10 赋值给变量 a |\n| += | `a+=10`\
    \ 等同于 `a=a+10` |\n| -= | `a-=10` 等同于 `a=a-10` |\n| *= | `a*=10` 等同于 `a=a*10` |\n\
    | /= | `a/=10` 等同于 `a=a/10` |\n| //= | `a//=10` 等同于 `a=a//10` |\n| %= | `a%=10`\
    \ 等同于 `a=a%10` |\n| **= | `a**=10` 等同于 `a=a**10` |\n\n```\n>>> a = 10\n>>> a\n\
    10\n>>>\n>>> a += 10\n>>> a\n20\n>>>\n>>> a -= 10\n>>> a\n10\n>>>\n>>> a *= 10\n\
    >>> a\n100\n>>>\n>>> a /= 10\n>>> a\n10.0\n>>>\n>>> a //= 10\n>>> a\n1.0\n>>>\n\
    >>> a **= 10\n>>> a\n1.0\n```\n\n#### 多重赋值\n\n你可以同时为多个变量赋值。\n\n```\n>>> a, b,\
    \ c = 10, 'hello', 12.345\n>>> a\n10\n>>> b\n'hello'\n>>> c\n12.345\n```\n\n###\
    \ Python 中的逻辑运算符\n\n以下是 Python 支持的逻辑运算符。\n\n| 运算符 | 描述 |\n| and | 'a and b' 如果\
    \ a 和 b 都为 true，则返回 true。否则返回 false。 |\n| or | 'a or b' 如果 a 和 b 都为 false，则返回\
    \ false，否则返回 true。 |\n| not | 'not a' 如果 a 为 false 则返回 True，否则返回 true |\n\n```\n\
    >>> a = bool(0)\n>>> b = bool(1)\n>>>\n>>> a\nFalse\n>>> b\nTrue\n>>>\n>>> a and\
    \ b\nFalse\n>>>\n>>> a or b\nTrue\n>>>\n>>> not a\nTrue\n>>>\n>>> not(a and b)\n\
    True\n>>>\n>>> not(a or b)\nFalse\n```\n\n### Python 中的位运算符\n\nPython 支持以下位运算符，用于对整数执行位运算。\n\
    \n| 运算符 | 描述 |\n| >> | 位右移 |\n| << | 位左移 |\n| & | 位与 |\n| ^ | 位异或 |\n| &#124;\
    \ | 位或 |\n| ~ | 位非 |\n\n以下文章清楚地解释了位运算符。http://self-learning-java-tutorial.blogspot.in/2014/02/bit-wise-operators.html\n\
    \n```\n>>> a = 2\n>>> a >> 1\n1\n>>>\n>>> a << 1\n4\n>>>\n>>> a & 3\n2\n>>> a\
    \ | 3\n3\n>>>\n>>> ~a\n-3\n```\n\n### Python 中的成员运算符\n\n成员运算符用于测试某个值或变量是否存在于序列（字符串、列表、元组、集合和字典）中。\n\
    \n| 运算符 | 描述 |\n| in | 如果值/变量在序列中找到，则返回 true，否则返回 false。 |\n| not in | 如果值/变量在序列中未找到，则返回\
    \ True，否则返回 false |\n\n```\n>>> primeNumbers = [2, 3, 5, 7, 11]\n>>> 2 in primeNumbers\n\
    True\n>>> 4 in primeNumbers\nFalse\n>>> 4 not in primeNumbers\nTrue\n```\n\n###\
    \ Python 中的身份运算符\n\n身份运算符用于比较两个对象的内存位置。\n\n| 运算符 | 描述 |\n| is | `a is b` 如果 a\
    \ 和 b 指向同一对象，则返回 true，否则返回 false。 |\n| is not | `a is not b` 如果 a 和 b 不指向同一对象，则返回\
    \ true，否则返回 false。 |\n\n```\n>>> name1 = \"Hari JJTam\"\n>>> name2 = name1\n>>>\
    \ name3 = \"Hari JJTam\"\n>>> name4 = \"abc\"\n>>>\n>>> name1 is name2\nTrue\n\
    >>> name1 is name3\nFalse\n>>> name1 is name4\nFalse\n>>> name1 is not name3\n\
    True\n```\n\n## Python：短路运算符\n\n布尔运算符 `and`、`or` 被称为短路运算符，这是因为一旦结果确定，表达式的求值就会停止。\n\
    \n### 为什么布尔 and 被称为短路运算符？\n\n因为如果表达式中的第一个语句求值为 false，那么 Python 就不会对整个表达式求值。因此布尔\
    \ `and` 被称为短路 and。\n\n### 为什么布尔 OR 被称为短路运算符？\n\n因为如果第一个语句求值为 true，那么 Python 就不会对整个表达式求值。\n\
    \n## Python 中的字符串\n\n字符串是用单引号（'…'）、双引号（\"…\"）（或）三引号（\"\"\"…\"\"\" 或 ''' … '''）指定的一系列字符。Python\
    \ 中的字符串是不可变的，即具有固定值的对象。\n\n```\n>>> str1 = 'Hello World'\n>>> str2 = \"Hello World\"\
    \n>>> str3 = \"\"\"Hello\n... World... \"\"\"\n>>> str1\n'Hello World'\n>>> str2\n\
    'Hello World'\n>>> str3\n'Hello\\nWorld\\n'\n```\n\n特殊字符用反斜杠转义。\n\n```\n>>> message\
    \ = 'He don\\'t know about this'\n>>> message\n\"He don't know about this\"\n\
    ```\n\n`print` 方法将 \\（反斜杠）开头的字符视为特殊字符。\n\n```\n>>> print('firstline\\nsecondline')\n\
    firstline\nsecondline\n```\n\n如你所见，`\\n` 输出换行。如果你不希望以 \\ 开头的字符被解释为特殊字符，可以在第一个引号前添加\
    \ `r` 来使用原始字符串\n\n```\n>>> print(r'firstline\\nsecondline')\nfirstline\\nsecondline\n\
    ```\n\n### 连接字符串\n\n'+' 运算符用于连接字符串。\n\n```\n>>> hello = \"Hello,\"\n>>> message\
    \ = \"How are you\"\n>>> info = hello + message\n>>> info\n'Hello,How are you'\n\
    ```\n\n两个或多个相邻的字符串字面量会自动连接。\n\n```\n>>> 'Hello ' \"How \" 'are ' 'you'\n'HelloHowareyou'\n\
    ```\n\n### 重复字符串\n\n使用 '*'，我们可以重复字符串。\n\n```\n>>> 'hi' * 2\n'hihi'\n>>> 'hi' *\
    \ 2 + 'hello' * 3\n'hihihellohellohello'\n```\n\n### 从字符串中访问特定字符\n\n你可以使用索引位置访问字符串的特定字符。\n\
    \n```\n>>> name = \"Hello World\"\n>>> name[0]\n'H'\n>>> name[6]\n'W'\n```\n\n\
    索引 0 表示第 1 个字符，1 表示第 2 个字符，依此类推。\n\n你也可以使用负数进行索引。-1 表示最后一个字符；-2 表示倒数第二个字符，依此类推。\n\
    \n```\n>>> name\n'Hello World'\n>>> name[-1]\n'd'\n>>> name[-2]\n'l'\n>>> name[-7]\n\
    'o'\n```\n\n### 切片\n\n切片用于获取给定字符串的子字符串。\n\n| 示例 | 描述 |\n| string[start:end] |\
    \ 返回从索引 start（包含）到 end 索引（不包含）的子字符串。 |\n| string[:end] | 返回从索引 0（包含）到 end 索引（不包含）的子字符串。\
    \ |\n| string[start:] | 返回从索引 start 到末尾的子字符串。 |\n"
- fmt: " | `string[-2:]` | Return characters from 2nd last to end. |\n\n```\n>>> message\
    \ = \"Hello World\"\n>>> message[0:5]\n'Hello'\n>>> message[5:]\n' World'\n>>>\
    \ message[:]\n'Hello World'\n>>> message[-2:]\n'ld'\n>>> message[-5:-2]\n'Wor'\n\
    ```\n\n## Get length of the string\n\nFunction `len(str)` is used to get the length\
    \ of the string.\n\n```\n>>> message\n'Hello World'\n>>> len(message)\n11\n>>>\
    \ len(\"How are you \")\n11\n```\n\n## Python: if condition\n\n### \"if\" statement\n\
    \n`\"if\"` tell the program execute the section of code when the condition evaluates\
    \ to true.\n\n**Syntax**\n\n```\nif_stmt ::=\n  \"if\" expression \":\" suite\n\
    ```\n\n**test.py**\n\n```python\na = 10\nif (a < 10):\n    print(\"a is less than\
    \ 10\")\nif (a == 10):\n    print(\"a is equal to 10\")\nif (a > 10):\n    print(\"\
    a is greater than 10\")\n```\n\n```\n$ python3 test.py\na is equal to 10\n```\n\
    \n### if-else statement\n\nIf the condition true, then if block code executed.\
    \ other wise else block code executed.\n\n**Syntax**\n\n```\nif_stmt ::=\n  \"\
    if\" expression \":\" suite\n                  [\"else\" \":\" suite]\n```\n\n\
    **test.py**\n\n```python\na = 10\nif (a != 10):\n    print(\"a is not equal to\
    \ 10\")\nelse:\n    print(\"a is equal to 10\")\n```\n\n### if-elif-else statement\n\
    \nBy using if-elif-else construct, you can choose number of alternatives. An if\
    \ statement can be followed by an optional elif...else statement.\n\n**Syntax**\n\
    \n```\nif_stmt ::=\n  \"if\" expression \":\" suite\n              ( \"elif\"\
    \ expression \":\" suite )*\n              [\"else\" \":\" suite]\n```\n\n**test.py**\n\
    \n```python\na = 10\nif (a > 10):\n    print(\"a is greater than 10\")\nelif (a\
    \ < 10):\n    print(\"a is less than 10\")\nelse:\n    print(\"a is equal to 10\"\
    )\n```\n\n```\n$ python3 test.py\na is equal to 10\n```\n\n**Note:**\n\na. In\
    \ python, any non-zero integer value is treated as true; zero is false.\n\n**test.py**\n\
    \n```python\nif (100):\n    print(\"Hello\")\nelse:\n    print(\"Bye\")\n```\n\
    \n```\n$ python3 test.py\nHello\n```\n\nb. Any sequence (string, list etc.,) with\
    \ a non-zero length is true, empty sequences are false.\n\n**test.py**\n\n```python\n\
    list = []\ndata = \"abc\"\nif (list):\n    print(\"list is not empty\")\nelse:\n\
    \    print(\"list is empty\")\nif (data):\n    print(\"data is not empty\")\n\
    else:\n    print(\"data is empty\")\n```\n\n```\n$ python3 test.py\nlist is empty\n\
    data is not empty\n```\n\n## Python: while statement\n\n`while` statement executes\
    \ a block of statements until a particular condition is true\n\n**Syntax**\n\n\
    ```\nwhile_stmt ::=\n  \"while\" expression \":\" suite\n                    \
    \      [\"else\" \":\" suite]\n```\n\n`else` clause is optional. If the expression\
    \ evaluates to false, then else clause will execute (if else present), and terminates.\n\
    \n**test.py**\n\n```python\na = 2\nprint(\"Even numbers are \")\nwhile (a < 10):\n\
    \    print(a, end=' ')\n    a += 2\nelse:\n    print(\"\\nExit from loop\")\n\
    print(\"Done \")\n```\n\n```\n$ python3 test.py\nEven numbers are\n2 4 6 8\nExit\
    \ from loop\n\nDone\n```\n\n## Python: for statement\n\nPython's for statement\
    \ is used to iterate over the items of any sequence like a list, string.\n\n**Syntax**\n\
    \n```\nfor_stmt ::=\n  \"for\" target_list \"in\" expression_list \":\" suite\n\
    \              [\"else\" \":\" suite]\n```\n\n`else` clause is optional, it is\
    \ executes, once the loop terminates.\n\n**test.py**\n\n```python\nnames = [\"\
    Phalgun \", \"Sambith \", \"Mahesh \", \"swapna \"]\nfor name in names:\n    print(name)\n\
    else:\n    print(\"Exiting from loop\")\nprint(\"Finsihed Execution \")\n```\n\
    \n```\n$ python3 test.py\nPhalgun\nSambith\nMahesh\nswapna\nExiting from loop\n\
    Finsihed Execution\n```\n\n## Python: break statement\n\n`break` statement is\
    \ used to come out of loop like for, while.\n\n**test.py**\n\n```python\ni = 0\n\
    while (1):\n    i += 2\n    print(i)\n    if (i == 10):\n        break\nelse:\n\
    \    print(\"Exiting loop\")\nprint(\"Finished Execution \")\n```\n\n```\n$ python3\
    \ test.py\n2\n4\n6\n8\n10\nFinished Execution\n```\n\nAs you observe the output,\
    \ print statement in else clause is not printed. It is because, else clause will\
    \ not execute, when a break statement terminates the loop.\n\n## Python: continue\
    \ statement\n\n`continue` statement skips the current iteration of loops like\
    \ for, while.\n\n**test.py**\n\n```python\ni = 2\nwhile (i < 20):\n    i += 2\n\
    \    if (i % 2 != 0):\n        continue\n    print(i)\nelse:\n    print(\"Exiting\
    \ loop\")\nprint(\"Finished Execution \")\n```\n\nAbove program prints all the\
    \ even numbers up to 20 (exclusive).\n\n```\n$ python3 test.py\n4\n6\n8\n10\n\
    12\n14\n16\n18\n20\nExiting loop\nFinished Execution\n```\n\n## Python: functions\n\
    \nA function is a block of statements identified by a name. The keyword `def`\
    \ is used to define a function. Functions are mainly used for two reasons.\n\n\
    a. To make code easier to build and understand\n\nb. To reuse the code\n\n**Syntax**\n\
    \n```\ndef functionName(argument1, argument2 …. argumentN):\n```\n\n**test.py**\n\
    \n```python\ndef factorial(n):\n    if (n <= 1):\n        return 1\n    result\
    \ = 1\n    for i in range(2, n + 1):\n        result *= i\n    return result\n\
    \nprint(factorial(1))\nprint(factorial(2))\nprint(factorial(3))\nprint(factorial(4))\n\
    print(factorial(5))\n```\n\n```\n$ python3 test.py\n1\n2\n6\n24\n120\n```\n\n\
    Variables created before function definition may be read inside of the function\
    \ only if the function does not change the value.\n\n**test.py**\n\n```python\n\
    # Create the x variable and set to 44\nx = 44\n\n# Define a simple function that\
    \ prints x\ndef f():\n    x += 1\n    print(x)\n\n# Call the function\nf()\n```\n\
    \nRun above program, you will get following error.\n\n```\n$ python3 test.py\n\
    Traceback (most recent call last):\n  File \"test.py\", line 11, in <module>\n\
    \    f()\n  File \"test.py\", line 7, in f\n    x += 1\nUnboundLocalError: local\
    \ variable 'x' referenced before assignment\n```\n\nRemove `x += 1` statement\
    \ and re run the above program, value of `x` is printed to console.\n\n## Python:\
    \ functions: return statement\n\n`return` statement is used to return a value\
    \ from function to the caller.\n\n**test.py**\n\n```python\ndef factorial(n):\n\
    \    if (n <= 1):\n        return 1\n    result = 1\n    for i in range(2, n +\
    \ 1):\n        result *= i\n    return result\n\nprint(factorial(1))\nprint(factorial(2))\n\
    print(factorial(3))\nprint(factorial(4))\nprint(factorial(5))\n```\n\n```\n$ python3\
    \ test.py\n1\n2\n6\n24\n120\n```\n\n`return` without an expression argument returns\
    \ `None`.\n\n```python\ndef hello():\n    print(\"Hello\")\n\nprint(hello())\n\
    ```\n\n```\n$ python3 test.py\nHello\nNone\n```"
