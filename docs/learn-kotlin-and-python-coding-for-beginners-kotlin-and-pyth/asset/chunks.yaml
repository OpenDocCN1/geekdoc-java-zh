    \ list.remove(x): x not in list\n```\n\n## Python: list: pop: remove last element\
    \ in the list\n\n`list.pop([i])`\n\n`pop` method without argument removes last\
    \ element in the list. If you specify the position `i`, it removes the element\
    \ at position `i` and return it.\n\n`test.py`\n\n```\nlist = [2, 4, 6, 6, 4, 2]\n\
    print(list)\nprint(\"Removing last element \", list.pop())\nprint(list)\nprint(\"\
