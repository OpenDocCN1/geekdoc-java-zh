    )\n    }\n})\n```\n\nFind the below working application.\n\n**HelloWorld.kt**\n\
    \n```kotlin\nopen class PrinterUtil {\n    open fun welcomeMessage() {\n     \
    \   println(\"Welcome user\")\n    }\n}\n\nfun printMessage(printUtl: PrinterUtil)\
    \ {\n    printUtl.welcomeMessage()\n}\n\nfun main(args: Array<String>) {\n   \
