  \n列表提供 count 方法，用于统计元素在结果中出现的次数。\n\n`test.py`\n\n```\nlist = [12, 5, 32, 43, 21,\
  \ 356, 5, 21]\nprint(list)\nprint(\"5 appears \", list.count(5), \" times \")\n\
