  \n安装成功后，你将看到以下屏幕。\n\n![](img/<Image00020.jpg>)\n\n安装成功后，打开终端并输入 `python3`（因为我安装了\
  \ Python 3.5）。\n\n```\n$ python3\nPython 3.5 . 0 (v3. 5.0 :374 f501f4567, Sep 12\
  \ 2015 , 11 :00 :19 )\n[GCC 4.2 . 1 (Apple Incutm Inc. build 5666 ) (dot 3 )] on\
  \ darwin\nType \"help\" , \"copyright\" , \"credits\" or \"license\" for more information.\n\
  >>> quit()\n```\n\n使用 `quit()` 退出 Python 提示符。\n\n### python3 的位置\n\n```\n$ which\
  \ python3\n/Library/Frameworks/Python.framework/Versions/3.5/bin/python3\n$ which\
  \ python3.5\n/Library/Frameworks/Python.framework/Versions/3.5/bin/python3.5\n```\n\
  \n在 Windows 机器上，Python 通常位于 `C:\\Python35`。\n\n## Python：Hello World 程序\n\n打开任意文本编辑器，复制语句\
  \ `print ('hello world')` 并将文件保存为 `hello.py`。\n\n### hello.py\n\n```python\nprint\
  \ ('hello world')\n```\n\n打开终端（或）命令提示符，使用命令 `python3 hello.py` 运行文件 `hello.py`。你将获得如下输出\n\
  \n```\n$ python3 hello.py\nhello world\n```\n\n### 当你指示 Python 运行脚本时会发生什么？\n\nPython\
  \ 首先将你的源代码编译为字节码，然后将其发送到 Python 虚拟机（PVM）。字节码是源代码的平台无关表示。PVM 逐条读取字节码并执行它们。\n\n![](img/<Image00021.jpg>)\n\
  \n**注意：**\n\n\n \n字节码不是机器可理解的代码，它是 Python 特有的表示形式。\n\n## Python 交互式命令行\n\n打开命令提示符（或）终端，输入\
  \ `python3` 命令。这将打开 Python 交互式会话。\n\n```\n$ python3\nPython 3.5.0 (v3.5.0:374f501f4567,\
  \ Sep 12 2015, 11:00:19)\n[GCC 4.2.1] on darwin\nType \"help\", \"copyright\", \"\
  credits\" or \"license\" for more information.\n>>>\n```\n\n### 如何退出 Python 解释器\n\
  \n在 Windows 上，按 `Ctrl-Z` 可以退出此会话；在 Unix 上，请尝试按 `Ctrl-D`。另一种方法是直接调用 `quit()` 函数来退出\
  \ Python。\n\n```\n$ python3\nPython 3.5.0 (v3.5.0:374f501f4567, Sep 12 2015, 11:00:19)\n\
  [GCC 4.2.1] on darwin\nType \"help\", \"copyright\", \"credits\" or \"license\"\
  \ for more information.\n>>> quit()\n$\n```\n\n你可以在 Python 解释器中输入任何语句（或）表达式，解释器会执行这些语句并给出结果。\n\
  \n```\n>>> 10+20\n30\n>>> 20*20\n400\n>>> print('Hello World')\nHello World\n```\n\
  \n**注意：** 在 Unix 上，Python 3.x 解释器默认不会以 `python` 名称安装，以避免与其他已安装的 Python 2.x 可执行文件冲突。\n\
  \n## Python：运算符\n\n运算符是一种符号，用于执行操作。以下是 Python 支持的运算符。\n\n- 算术运算符\n- 关系运算符\n- 赋值运算符\n\
  - 逻辑运算符\n- 位运算符\n- 成员运算符\n- 身份运算符\n\n### Python 中的算术运算符\n\n以下是 Python 支持的算术运算符。\n\
  \n| 运算符 | 描述 | 示例 |\n| + | 加法 | `2+3` |\n| - | 减法 | `2-3` |\n| * | 乘法 | `2*3` |\n\
  | / | 除法始终返回浮点数值。要仅获取整数结果，请使用 `//`。 | `2/3` 返回 `0.6666666666666666` |\n| // | 地板除法，舍弃小数部分\
  \ | `2//3` 返回 `0` |\n| % | 返回除法的余数。 | `2%3` |\n| ** | 幂运算 | `2**3` 返回 2 的 3 次方 =\
  \ `8` |\n\n```\n>>> 4 + 2\n6\n>>> 4 - 2\n2\n>>> 4 / 2\n2.0\n>>> 4 * 2\n8\n>>> 4\
  \ // 2\n2\n>>> 4 ** 2\n16\n```\n\n### Python 中的关系运算符\n\n关系运算符用于判断一个操作数是否大于、小于、等于或不等于另一个操作数。\n\
  \n| 运算符 | 描述 | 示例 |\n| == | 等于 | `a==b` 如果 a 等于 b 则返回 true，否则返回 false |\n| != |\
  \ 不等于 | `a!=b` 如果 a 不等于 b 则返回 true，否则返回 false。 |\n| > | 大于 | `a>b` 如果 a > b 则返回\
  \ true，否则返回 false。 |\n| >= | 大于或等于 | `a>=b` 如果 a >= b 则返回 true，否则返回 false。 |\n|\
  \ < | 小于 | `a<b` 如果 a < b 则返回 true，否则返回 false。 |\n| <= | 小于或等于 | `a<=b` 如果 a <=\
  \ b 则返回 true，否则返回 false。 |\n\n```\n>>> a = 10\n>>> b = 12\n>>> a == b\nFalse\n>>>\
  \ a != b\nTrue\n>>> a > b\nFalse\n>>> a >= b\nFalse\n>>> a < b\nTrue\n>>> a <= b\n\
  True\n```\n\n### Python 中的赋值运算符\n\n赋值运算符用于给变量赋值。以下是 Python 提供的赋值运算符。\n\n| 运算符 |\
  \ 描述 |\n| = | `a=10` 将 10 赋值给变量 a |\n| += | `a+=10` 等同于 `a=a+10` |\n| -= | `a-=10`\
  \ 等同于 `a=a-10` |\n| *= | `a*=10` 等同于 `a=a*10` |\n| /= | `a/=10` 等同于 `a=a/10` |\n\
  | //= | `a//=10` 等同于 `a=a//10` |\n| %= | `a%=10` 等同于 `a=a%10` |\n| **= | `a**=10`\
  \ 等同于 `a=a**10` |\n\n```\n>>> a = 10\n>>> a\n10\n>>>\n>>> a += 10\n>>> a\n20\n>>>\n\
  >>> a -= 10\n>>> a\n10\n>>>\n>>> a *= 10\n>>> a\n100\n>>>\n>>> a /= 10\n>>> a\n\
  10.0\n>>>\n>>> a //= 10\n>>> a\n1.0\n>>>\n>>> a **= 10\n>>> a\n1.0\n```\n\n####\
  \ 多重赋值\n\n你可以同时为多个变量赋值。\n\n```\n>>> a, b, c = 10, 'hello', 12.345\n>>> a\n10\n>>>\
  \ b\n'hello'\n>>> c\n12.345\n```\n\n### Python 中的逻辑运算符\n\n以下是 Python 支持的逻辑运算符。\n\
  \n| 运算符 | 描述 |\n| and | 'a and b' 如果 a 和 b 都为 true，则返回 true。否则返回 false。 |\n| or\
  \ | 'a or b' 如果 a 和 b 都为 false，则返回 false，否则返回 true。 |\n| not | 'not a' 如果 a 为 false\
  \ 则返回 True，否则返回 true |\n\n```\n>>> a = bool(0)\n>>> b = bool(1)\n>>>\n>>> a\nFalse\n\
  >>> b\nTrue\n>>>\n>>> a and b\nFalse\n>>>\n>>> a or b\nTrue\n>>>\n>>> not a\nTrue\n\
  >>>\n>>> not(a and b)\nTrue\n>>>\n>>> not(a or b)\nFalse\n```\n\n### Python 中的位运算符\n\
  \nPython 支持以下位运算符，用于对整数执行位运算。\n\n| 运算符 | 描述 |\n| >> | 位右移 |\n| << | 位左移 |\n| & |\
  \ 位与 |\n| ^ | 位异或 |\n| &#124; | 位或 |\n| ~ | 位非 |\n\n以下文章清楚地解释了位运算符。http://self-learning-java-tutorial.blogspot.in/2014/02/bit-wise-operators.html\n\
  \n```\n>>> a = 2\n>>> a >> 1\n1\n>>>\n>>> a << 1\n4\n>>>\n>>> a & 3\n2\n>>> a |\
  \ 3\n3\n>>>\n>>> ~a\n-3\n```\n\n### Python 中的成员运算符\n\n成员运算符用于测试某个值或变量是否存在于序列（字符串、列表、元组、集合和字典）中。\n\
  \n| 运算符 | 描述 |\n| in | 如果值/变量在序列中找到，则返回 true，否则返回 false。 |\n| not in | 如果值/变量在序列中未找到，则返回\
  \ True，否则返回 false |\n\n```\n>>> primeNumbers = [2, 3, 5, 7, 11]\n>>> 2 in primeNumbers\n\
  True\n>>> 4 in primeNumbers\nFalse\n>>> 4 not in primeNumbers\nTrue\n```\n\n###\
  \ Python 中的身份运算符\n\n身份运算符用于比较两个对象的内存位置。\n\n| 运算符 | 描述 |\n| is | `a is b` 如果 a 和\
  \ b 指向同一对象，则返回 true，否则返回 false。 |\n| is not | `a is not b` 如果 a 和 b 不指向同一对象，则返回\
  \ true，否则返回 false。 |\n\n```\n>>> name1 = \"Hari JJTam\"\n>>> name2 = name1\n>>>\
  \ name3 = \"Hari JJTam\"\n>>> name4 = \"abc\"\n>>>\n>>> name1 is name2\nTrue\n>>>\
  \ name1 is name3\nFalse\n>>> name1 is name4\nFalse\n>>> name1 is not name3\nTrue\n\
  ```\n\n## Python：短路运算符\n\n布尔运算符 `and`、`or` 被称为短路运算符，这是因为一旦结果确定，表达式的求值就会停止。\n\n###\
  \ 为什么布尔 and 被称为短路运算符？\n\n因为如果表达式中的第一个语句求值为 false，那么 Python 就不会对整个表达式求值。因此布尔 `and`\
  \ 被称为短路 and。\n\n### 为什么布尔 OR 被称为短路运算符？\n\n因为如果第一个语句求值为 true，那么 Python 就不会对整个表达式求值。\n\
  \n## Python 中的字符串\n\n字符串是用单引号（'…'）、双引号（\"…\"）（或）三引号（\"\"\"…\"\"\" 或 ''' … '''）指定的一系列字符。Python\
  \ 中的字符串是不可变的，即具有固定值的对象。\n\n```\n>>> str1 = 'Hello World'\n>>> str2 = \"Hello World\"\
  \n>>> str3 = \"\"\"Hello\n... World... \"\"\"\n>>> str1\n'Hello World'\n>>> str2\n\
  'Hello World'\n>>> str3\n'Hello\\nWorld\\n'\n```\n\n特殊字符用反斜杠转义。\n\n```\n>>> message\
  \ = 'He don\\'t know about this'\n>>> message\n\"He don't know about this\"\n```\n\
  \n`print` 方法将 \\（反斜杠）开头的字符视为特殊字符。\n\n```\n>>> print('firstline\\nsecondline')\n\
  firstline\nsecondline\n```\n\n如你所见，`\\n` 输出换行。如果你不希望以 \\ 开头的字符被解释为特殊字符，可以在第一个引号前添加\
  \ `r` 来使用原始字符串\n\n```\n>>> print(r'firstline\\nsecondline')\nfirstline\\nsecondline\n\
  ```\n\n### 连接字符串\n\n'+' 运算符用于连接字符串。\n\n```\n>>> hello = \"Hello,\"\n>>> message\
  \ = \"How are you\"\n>>> info = hello + message\n>>> info\n'Hello,How are you'\n\
  ```\n\n两个或多个相邻的字符串字面量会自动连接。\n\n```\n>>> 'Hello ' \"How \" 'are ' 'you'\n'HelloHowareyou'\n\
  ```\n\n### 重复字符串\n\n使用 '*'，我们可以重复字符串。\n\n```\n>>> 'hi' * 2\n'hihi'\n>>> 'hi' * 2\
  \ + 'hello' * 3\n'hihihellohellohello'\n```\n\n### 从字符串中访问特定字符\n\n你可以使用索引位置访问字符串的特定字符。\n\
  \n```\n>>> name = \"Hello World\"\n>>> name[0]\n'H'\n>>> name[6]\n'W'\n```\n\n索引\
  \ 0 表示第 1 个字符，1 表示第 2 个字符，依此类推。\n\n你也可以使用负数进行索引。-1 表示最后一个字符；-2 表示倒数第二个字符，依此类推。\n\
  \n```\n>>> name\n'Hello World'\n>>> name[-1]\n'd'\n>>> name[-2]\n'l'\n>>> name[-7]\n\
  'o'\n```\n\n### 切片\n\n切片用于获取给定字符串的子字符串。\n\n| 示例 | 描述 |\n| string[start:end] | 返回从索引\
  \ start（包含）到 end 索引（不包含）的子字符串。 |\n| string[:end] | 返回从索引 0（包含）到 end 索引（不包含）的子字符串。\
  \ |\n| string[start:] | 返回从索引 start 到末尾的子字符串。 |\n\n\n \n | `string[-2:]` | 返回从倒数第\
  \ 2 个字符到末尾的字符。 |\n\n```\n>>> message = \"Hello World\"\n>>> message[0:5]\n'Hello'\n\
  >>> message[5:]\n' World'\n>>> message[:]\n'Hello World'\n>>> message[-2:]\n'ld'\n\
  >>> message[-5:-2]\n'Wor'\n```\n\n### 获取字符串长度\n\n函数 `len(str)` 用于获取字符串的长度。\n\n```\n\
  >>> message\n'Hello World'\n>>> len(message)\n11\n>>> len(\"How are you \")\n11\n\
  ```\n\n## Python：if 条件语句\n\n### \"if\" 语句\n\n`\"if\"` 告诉程序在条件求值为真时执行该段代码。\n\n**语法**\n\
  \n```\nif_stmt ::=\n  \"if\" expression \":\" suite\n```\n\n**test.py**\n\n```python\n\
  a = 10\nif (a < 10):\n    print(\"a is less than 10\")\nif (a == 10):\n    print(\"\
  a is equal to 10\")\nif (a > 10):\n    print(\"a is greater than 10\")\n```\n\n\
  ```\n$ python3 test.py\na is equal to 10\n```\n\n### if-else 语句\n\n如果条件为真，则执行 if\
  \ 代码块。否则执行 else 代码块。\n\n**语法**\n\n```\nif_stmt ::=\n  \"if\" expression \":\" suite\n\
  \                  [\"else\" \":\" suite]\n```\n\n**test.py**\n\n```python\na =\
  \ 10\nif (a != 10):\n    print(\"a is not equal to 10\")\nelse:\n    print(\"a is\
  \ equal to 10\")\n```\n\n### if-elif-else 语句\n\n通过使用 if-elif-else 结构，你可以选择多种替代方案。if\
  \ 语句后面可以跟可选的 elif...else 语句。\n\n**语法**\n\n```\nif_stmt ::=\n  \"if\" expression\
  \ \":\" suite\n              ( \"elif\" expression \":\" suite )*\n            \
  \  [\"else\" \":\" suite]\n```\n\n**test.py**\n\n```python\na = 10\nif (a > 10):\n\
  \    print(\"a is greater than 10\")\nelif (a < 10):\n    print(\"a is less than\
  \ 10\")\nelse:\n    print(\"a is equal to 10\")\n```\n\n```\n$ python3 test.py\n\
  a is equal to 10\n```\n\n**注意：**\n\na. 在 Python 中，任何非零整数值都被视为真；零为假。\n\n**test.py**\n\
  \n```python\nif (100):\n    print(\"Hello\")\nelse:\n    print(\"Bye\")\n```\n\n\
  ```\n$ python3 test.py\nHello\n```\n\nb. 任何具有非零长度的序列（字符串、列表等）为真，空序列为假。\n\n**test.py**\n\
  \n```python\nlist = []\ndata = \"abc\"\nif (list):\n    print(\"list is not empty\"\
  )\nelse:\n    print(\"list is empty\")\nif (data):\n    print(\"data is not empty\"\
  )\nelse:\n    print(\"data is empty\")\n```\n\n```\n$ python3 test.py\nlist is empty\n\
  data is not empty\n```\n\n## Python：while 语句\n\n`while` 语句执行一段代码块，直到某个条件为真。\n\n\
  **语法**\n\n```\nwhile_stmt ::=\n  \"while\" expression \":\" suite\n            \
  \              [\"else\" \":\" suite]\n```\n\n`else` 子句是可选的。如果表达式求值为假，则 else 子句将执行（如果存在\
  \ else），然后终止。\n\n**test.py**\n\n```python\na = 2\nprint(\"Even numbers are \")\n\
  while (a < 10):\n    print(a, end=' ')\n    a += 2\nelse:\n    print(\"\\nExit from\
  \ loop\")\nprint(\"Done \")\n```\n\n```\n$ python3 test.py\nEven numbers are\n2\
  \ 4 6 8\nExit from loop\n\nDone\n```\n\n## Python：for 语句\n\nPython 的 for 语句用于遍历任何序列（如列表、字符串）中的项目。\n\
  \n**语法**\n\n```\nfor_stmt ::=\n  \"for\" target_list \"in\" expression_list \":\"\
  \ suite\n              [\"else\" \":\" suite]\n```\n\n`else` 子句是可选的，它在循环终止后执行。\n\
  \n**test.py**\n\n```python\nnames = [\"Phalgun \", \"Sambith \", \"Mahesh \", \"\
  swapna \"]\nfor name in names:\n    print(name)\nelse:\n    print(\"Exiting from\
  \ loop\")\nprint(\"Finsihed Execution \")\n```\n\n```\n$ python3 test.py\nPhalgun\n\
  Sambith\nMahesh\nswapna\nExiting from loop\nFinsihed Execution\n```\n\n## Python：break\
  \ 语句\n\n`break` 语句用于跳出 for、while 等循环。\n\n**test.py**\n\n```python\ni = 0\nwhile\
  \ (1):\n    i += 2\n    print(i)\n    if (i == 10):\n        break\nelse:\n    print(\"\
  Exiting loop\")\nprint(\"Finished Execution \")\n```\n\n```\n$ python3 test.py\n\
  2\n4\n6\n8\n10\nFinished Execution\n```\n\n正如你观察到的输出，else 子句中的 print 语句没有打印出来。这是因为，当\
  \ break 语句终止循环时，else 子句不会执行。\n\n## Python：continue 语句\n\n`continue` 语句跳过 for、while\
  \ 等循环的当前迭代。\n\n**test.py**\n\n```python\ni = 2\nwhile (i < 20):\n    i += 2\n  \
  \  if (i % 2 != 0):\n        continue\n    print(i)\nelse:\n    print(\"Exiting\
  \ loop\")\nprint(\"Finished Execution \")\n```\n\n上面的程序打印所有小于 20 的偶数（不包括 20）。\n\n\
  ```\n$ python3 test.py\n4\n6\n8\n10\n12\n14\n16\n18\n20\nExiting loop\nFinished\
  \ Execution\n```\n\n## Python：函数\n\n函数是由名称标识的语句块。关键字 `def` 用于定义函数。函数主要用于两个原因。\n\n\
  a. 使代码更易于构建和理解\n\nb. 重用代码\n\n**语法**\n\n```\ndef functionName(argument1, argument2\
  \ …. argumentN):\n```\n\n**test.py**\n\n```python\ndef factorial(n):\n    if (n\
  \ <= 1):\n        return 1\n    result = 1\n    for i in range(2, n + 1):\n    \
  \    result *= i\n    return result\n\nprint(factorial(1))\nprint(factorial(2))\n\
  print(factorial(3))\nprint(factorial(4))\nprint(factorial(5))\n```\n\n```\n$ python3\
  \ test.py\n1\n2\n6\n24\n120\n```\n\n在函数定义之前创建的变量，只有在函数不修改该值的情况下，才能在函数内部读取。\n\n**test.py**\n\
  \n```python\n# Create the x variable and set to 44\nx = 44\n\n# Define a simple\
  \ function that prints x\ndef f():\n    x += 1\n    print(x)\n\n# Call the function\n\
  f()\n```\n\n运行上面的程序，你会得到以下错误。\n\n```\n$ python3 test.py\nTraceback (most recent\
  \ call last):\n  File \"test.py\", line 11, in <module>\n    f()\n  File \"test.py\"\
  , line 7, in f\n    x += 1\nUnboundLocalError: local variable 'x' referenced before\
  \ assignment\n```\n\n删除 `x += 1` 语句并重新运行上面的程序，`x` 的值将打印到控制台。\n\n## Python：函数：return\
  \ 语句\n\n`return` 语句用于将值从函数返回给调用者。\n\n**test.py**\n\n```python\ndef factorial(n):\n\
  \    if (n <= 1):\n        return 1\n    result = 1\n    for i in range(2, n + 1):\n\
  \        result *= i\n    return result\n\nprint(factorial(1))\nprint(factorial(2))\n\
  print(factorial(3))\nprint(factorial(4))\nprint(factorial(5))\n```\n\n```\n$ python3\
  \ test.py\n1\n2\n6\n24\n120\n```\n\n不带表达式参数的 `return` 返回 `None`。\n\n```python\n\
  def hello():\n    print(\"Hello\")\n\nprint(hello())\n```\n\n```\n$ python3 test.py\n\
  Hello\nNone\n```\n\n\n \n # Python：函数：默认参数值\n\n在 Python 中，你可以为函数参数传递默认值。\n\n```python\n\
  def welcomeMessage(name='user', message='Hello'):\n    print(message, name)\n```\n\
  \n你可以通过以下方式调用上述函数。\n\n`welcomeMessage()` ：打印 `Hello user`\n\n`welcomeMessage('JJTam')`\
  \ ：打印 `Hello JJTam`\n\n`welcomeMessage('JJTam', \"Welcome\")` ：打印 `Welcome JJTam`\n\
  \n```python\n# test.py\ndef welcomeMessage(name='user', message='Hello'):\n    print(message,\
  \ name)\n\nwelcomeMessage()\nwelcomeMessage('JJTam')\nwelcomeMessage('JJTam', \"\
  Welcome\")\n```\n\n```\n$ python3 test.py\nHello user\nHello JJTam\nWelcome JJTam\n\
  ```\n\n**注意：** 默认值只计算一次。因此，在使用列表、字典等可变对象时要小心。例如，以下函数在后续调用中会累积结果。\n\n```python\n\
  # test.py\ndef getEvenNumbers(limit, result=[]):\n    i = 2\n    while (i < limit):\n\
  \        result.append(i)\n        i += 2\n    return result\n\nprint(getEvenNumbers(4))\n\
  print(getEvenNumbers(8))\nprint(getEvenNumbers(12))\n```\n\n```\n$ python3 test.py\n\
  [2]\n[2, 2, 4, 6]\n[2, 2, 4, 6, 2, 4, 6, 8, 10]\n```\n\n如果你不希望默认值在后续调用之间共享，可以像下面这样编写函数：\n\
  \n```python\ndef getEvenNumbers(limit, result=None):\n    if result is None:\n \
  \       result = []\n    i = 2\n    while (i < limit):\n        result.append(i)\n\
  \        i += 2\n    return result\n\nprint(getEvenNumbers(4))\nprint(getEvenNumbers(8))\n\
  print(getEvenNumbers(12))\n```\n\n```\n$ python3 test.py\n[2]\n[2, 4, 6]\n[2, 4,\
  \ 6, 8, 10]\n```\n\n## Python：函数：关键字参数\n\n函数也可以使用关键字参数调用，即通过使用参数名称。\n\n```python\n\
  def printEmployee(id, firstName, lastName, designation='Engineer'):\n    print(id,\
  \ firstName, lastName, designation)\n```\n\n上述函数可以通过以下方式调用。\n\n```python\nprintEmployee(id=1,\
  \ lastName='Delhi', firstName='Hari')\nprintEmployee(lastName='JJTam', firstName='Rama',\
  \ id=2)\nprintEmployee(designation='Tech Lead', lastName='Battu', firstName='Gopi',\
  \ id=3)\n```\n\n```python\n# test.py\ndef printEmployee(id, firstName, lastName,\
  \ designation='Engineer'):\n    print(id, firstName, lastName, designation)\n\n\
  printEmployee(id=1, lastName='Delhi', firstName='Hari')\nprintEmployee(lastName='JJTam',\
  \ firstName='Rama', id=2)\nprintEmployee(designation='Tech Lead', lastName='Battu',\
  \ firstName='Gopi', id=3)\n```\n\n```\n$ python3 test.py\n1 Hari Delhi Engineer\n\
  2 Rama JJTam Engineer\n3 Gopi Battu Tech Lead\n```\n\n**注意：**\n\na. 关键字参数必须跟在位置参数之后。\n\
  \n```python\ndef printEmployee(id, firstName, lastName, designation='Engineer'):\n\
  \    print(id, firstName, lastName, designation)\n\nprintEmployee(1, lastName='Delhi',\
  \ firstName='Hari', \"engineer\")\n```\n\n当你尝试编译上述文件时，你会得到以下错误。\n\n```\n$ python3\
  \ test.py\n  File \"test.py\", line 4\n    printEmployee(1, lastName='Delhi', firstName='Hari',\
  \ \"engineer\")\n                                                         ^^^^^^^^^\n\
  SyntaxError: positional argument follows keyword argument\n```\n\n## Python 列表\n\
  \n列表是方括号之间用逗号分隔的一组值。\n\n```python\n>>> primes = [2, 3, 5, 7, 11, 13, 17, 19, 23]\n\
  >>> primes\n[2, 3, 5, 7, 11, 13, 17, 19, 23]\n```\n\n`primes` 是一个包含素数的列表。\n\n```python\n\
  >>> students = [\"Hari\", \"JJTam\", \"Kiran\", \"Ravi\"]\n>>> students\n['Hari',\
  \ 'JJTam', 'Kiran', 'Ravi']\n```\n\n`students` 是一个包含所有学生姓名的列表。\n\n列表可以包含任何类型的数据。\n\
  \n```python\n>>> objects = [1, 3, \"Hello\", 10.23]\n>>> objects\n[1, 3, 'Hello',\
  \ 10.23]\n```\n\n你可以使用索引访问列表的元素。\n\n```python\n>>> objects\n[1, 3, 'Hello', 10.23]\n\
  >>> objects[0]\n1\n>>> objects[2]\n'Hello'\n```\n\n`objects[0]` 返回列表 `objects` 的第一个元素。\n\
  \n`objects[1]` 返回列表 `objects` 的第二个元素。\n\n`-ve` 索引也可用于访问列表的元素。\n\n```python\n>>>\
  \ objects\n[1, 3, 'Hello', 10.23]\n>>> objects[-1]\n10.23\n>>> objects[-3]\n3\n\
  ```\n\n### 切片\n\n切片用于获取子列表。\n\n| 示例 | 说明 |\n|---------|-------------|\n| `list[start:end]`\
  \ | 返回从起始索引（包含）到结束索引（不包含）的子列表。 |\n| `list[:end]` | 返回从索引 0（包含）到结束索引（不包含）的子列表。 |\n\
  | `list[start:]` | 返回从起始索引到末尾的子列表。 |\n| `list[-2:]` | 返回从倒数第二个到末尾的列表。 |\n\n\n \n\
  \ ```\n>>> objects[1, 3, 'Hello', 10.23]\n>>> objects[-1]\n10.23\n>>> objects[-3]\n\
  3\n>>> objects\n[1, 3, 'Hello', 10.23]\n>>>\n>>> objects[:]\n[1, 3, 'Hello', 10.23]\n\
  >>>\n>>> objects[2:]\n['Hello', 10.23]\n>>>\n>>> objects[:3]\n[1, 3, 'Hello']\n\
  >>>\n>>> objects[-2:]\n['Hello', 10.23]\n```\n\n### 连接两个列表\n\n`+` 运算符用于连接两个列表。\n\
  \n```\n>>> even = [2, 4, 6, 8, 10]\n>>> odd = [1, 3, 5, 7, 9]\n>>> numbers = even\
  \ + odd\n>>> numbers\n[2, 4, 6, 8, 10, 1, 3, 5, 7, 9]\n```\n\n列表是可变的；你可以更改列表中的值。\n\
  \n```\n>>> numbers\n[2, 4, 6, 8, 10, 1, 3, 5, 7, 9]\n>>> numbers[0] = 12\n>>> numbers[1]\
  \ = 14\n>>> numbers\n[12, 14, 6, 8, 10, 1, 3, 5, 7, 9]\n```\n\n### 在列表末尾添加元素\n\n\
  列表提供了 `append` 方法，用于在列表末尾添加新元素。\n\n```\n>>> numbers\n[12, 14, 6, 8, 10, 1, 3, 5,\
  \ 7, 9]\n>>>\n>>> numbers.append(11)\n>>> numbers.append(13)\n>>>\n>>> numbers\n\
  [12, 14, 6, 8, 10, 1, 3, 5, 7, 9, 11, 13]\n```\n\n### 切片赋值\n\n如果你想替换列表中的一系列元素，可以使用切片表示法。\n\
  \n`numbers[2:5] = [21, 22, 23]`\n\n上述语句分别用 21、22、23 替换索引 2、3、4 处的元素。\n\n`numbers[:]\
  \ = []`\n\n上述语句通过将所有元素替换为空列表来清空列表。\n\n```\n>>> numbers\n[12, 14, 6, 8, 10, 1, 3,\
  \ 5, 7, 9, 11, 13]\n>>>\n>>> numbers[2:5] = [21, 22, 23]\n>>> numbers\n[12, 14,\
  \ 21, 22, 23, 1, 3, 5, 7, 9, 11, 13]\n>>>\n>>> numbers[:] = []\n>>> numbers\n[]\n\
  ```\n\n### 获取列表长度\n\n使用 `len` 函数，你可以获取列表的长度。\n\n```\n>>> vowels = ['a', 'e', 'i',\
  \ 'o', 'u']\n>>> len(vowels)\n5\n```\n\n### 嵌套列表\n\n一个列表可以嵌套在另一个列表中。例如，在下面的示例中，numbers\
  \ 包含 3 个列表，第一个列表表示奇数，第二个列表表示偶数，第三个列表表示质数。\n\n```\n>>> numbers = [[1, 3, 5, 7], [2,\
  \ 4, 6, 8], [2, 3, 5, 7, 11]]\n>>> numbers\n[[1, 3, 5, 7], [2, 4, 6, 8], [2, 3,\
  \ 5, 7, 11]]\n>>>\n>>> numbers[0]\n[1, 3, 5, 7]\n>>>\n>>> numbers[1]\n[2, 4, 6,\
  \ 8]\n>>>\n>>> numbers[2]\n[2, 3, 5, 7, 11]\n>>>\n>>>\n>>> len(numbers)\n3\n>>>\
  \ len(numbers[0])\n4\n>>> len(numbers[1])\n4\n>>> len(numbers[2])\n5\n>>>\n>>> numbers[0][1]\
  \ = 9\n>>> numbers[1][1:4] = [10, 12, 14]\n>>> numbers\n[[1, 9, 5, 7], [2, 10, 12,\
  \ 14], [2, 3, 5, 7, 11]]\n```\n\n## Python：list extend：追加给定列表的元素\n\nPython 提供了 `extend`\
  \ 方法，用于追加给定列表中的所有项目。\n\n`test.py`\n\n```\nevenNumbers = [2, 4, 6]\noddNumbers =\
  \ [1, 3, 5]\nnumbers = []\nnumbers.extend(evenNumbers)\nprint(numbers)\nnumbers.extend(oddNumbers)\n\
  print(numbers)\n```\n\n```\n$ python3 test.py\n[2, 4, 6]\n[2, 4, 6, 1, 3, 5]\n```\n\
  \n## Python：insert：在指定位置插入元素\n\n列表提供了 `insert` 方法，用于在指定位置插入元素。\n\n### 语法\n\n`list.insert(i,\
  \ x)`\n\n- `list.insert(0, x)`：在列表开头插入元素 x。\n- `list.insert(len(list), x)`：在列表末尾插入元素\
  \ x。\n- `list.insert(2, x)`：在第 2 个位置插入元素 x。\n\n`test.py`\n\n```\nlist = [2, 4, 6]\n\
  print(list)\nlist.insert(0, -2)\nprint(list)\nlist.insert(len(list), 8)\nprint(list)\n\
  list.insert(2, 3)\nprint(list)\n```\n\n```\n$ python3 test.py\n[2, 4, 6]\n[-2, 2,\
  \ 4, 6]\n[-2, 2, 4, 6, 8]\n[-2, 2, 3, 4, 6, 8]\n```\n\n## Python：list remove：移除元素\n\
  \n列表提供了 `remove` 方法，用于从中移除元素 `x`。\n\n### 语法\n\n`list.remove(x)`\n\n`remove` 方法移除列表中值为\
  \ x 的第一个项目。\n\n`test.py`\n\n```\nlist = [2, 4, 6, 6, 4, 2]\nprint(list)\nlist.remove(6)\n\
  print(list)\n```\n\n```\n$ python3 test.py\n[2, 4, 6, 6, 4, 2]\n[2, 4, 6, 4, 2]\n\
  ```\n\n如果元素不在列表中，`remove` 方法会抛出错误。\n\n`test.py`\n\n```\nlist = [2, 4, 6, 6, 4, 2]\n\
  print(list)\nlist.remove(60)\nprint(list)\n```\n\n```\n$ python3 test.py\n[2, 4,\
  \ 6, 6, 4, 2]\nTraceback (most recent call last):\n  File \"test.py\", line 4, in\
  \ <module>\n    list.remove(60)\nValueError: list.remove(x): x not in list\n```\n\
  \n## Python：list：pop：移除列表中的最后一个元素\n\n`list.pop([i])`\n\n不带参数的 `pop` 方法移除列表中的最后一个元素。如果指定位置\
  \ `i`，则移除位置 `i` 处的元素并返回它。\n\n`test.py`\n\n```\nlist = [2, 4, 6, 6, 4, 2]\nprint(list)\n\
  print(\"Removing last element \", list.pop())\nprint(list)\nprint(\"Removing element\
  \ at index 2 \", list.pop(2))\nprint(list)\n```\n\n```\n$ python3 test.py\n[2, 4,\
  \ 6, 6, 4, 2]\nRemoving last element  2\n[2, 4, 6, 6, 4]\nRemoving element at index\
  \ 2  6\n[2, 4, 6, 4]\n```\n\n## Python：list：清除列表中的所有元素\n\n列表提供了 `clear` 方法，用于清除列表中的所有元素。\n\
  \n`test.py`\n\n```\nlist = [2, 4, 6, 6, 4, 2]\nprint(list)\nlist.clear()\nprint(list)\n\
  ```\n\n```\n$ python3 test.py\n[2, 4, 6, 6, 4, 2]\n[]\n```\n\n## Python：list：index：获取元素的索引\n\
  \n`list.index(x)`\n\n`list` 提供了 index 方法，返回值为 x 的第一个项目的索引。\n\n`test.py`\n\n```\n\
  list = [2, 4, 6, 6, 4, 2]\nprint(list)\nprint(\"index of 2 is \", list.index(2))\n\
  print(\"index of 4 is \", list.index(4))\nprint(\"index of 6 is \", list.index(6))\n\
  ```\n\n```\n$ python3 test.py\n[2, 4, 6, 6, 4, 2]\nindex of 2 is  0\nindex of 4\
  \ is  1\nindex of 6 is  2\n```\n\n如果元素不在列表中，会抛出错误。\n\n`test.py`\n\n```\nlist = [2,\
  \ 4, 6, 6, 4, 2]\nprint(list)\nprint(\"index of 20 is \", list.index(20))\n```\n\
  \n```\n$ python3 test.py\n[2, 4, 6, 6, 4, 2]\nTraceback (most recent call last):\n\
  \  File \"test.py\", line 4, in <module>\n    print(\"index of 20 is \", list.index(20))\n\
  ValueError: 20 is not in list\n```\n\n## Python：list：对列表元素进行排序\n\n`list` 提供了 sort\
  \ 方法，用于对列表元素进行排序。默认情况下，sort 方法按升序对元素进行排序。要按降序对元素进行排序，请传递 `reverse=True` 参数。\n\n\
