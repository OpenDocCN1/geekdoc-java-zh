  [12, 5, 32, 43, 21, 356, 5, 21]\n5 appears  2  times\n12 appears  1  times\n```\n\
  \n## Python：list：反转列表元素\n\n列表提供了 reverse 方法，用于反转列表元素。\n\n`test.py`\n\n```\nlist\
  \ = [12, 5, 32, 43, 21, 356, 5, 21]\nprint(list)\nlist.reverse()\nprint(list)\n\
  ```\n\n```\n$ python3 test.py\n[12, 5, 32, 43, 21, 356, 5, 21]\n[21, 5, 356, 21,\
