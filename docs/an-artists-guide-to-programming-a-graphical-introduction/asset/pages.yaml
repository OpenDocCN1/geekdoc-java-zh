  md: '# Sketch 11: Displaying Text


    Text is essential in nearly all practical computational programs and in many generative
    art and new art programs as well. Text is a primary way that humans communicate,
    and while we say that "a picture is worth a thousand words," it is frequently
    true that a few carefully chosen words can make an otherwise incomprehensible
    image into a valuable communications tool. Think of the labels on the axis of
    a graph, for instance.


    We draw text in the sketch window in the same way that we draw lines and ellipses,
    using a simple function. The first thing you need to know is that text is starting
    at a particular (x, y) location, where x and y represent the coordinates of the
    lower-left corner of the box that encloses the text when not considering descenders.
    Characters such as y extend below this box, and so have y values greater than
    the value specified.


    We will draw text using a call to the function text()


    ```

    text("This is a string to be drawn", 100, 20);

    ```


    In this case, the coordinates of the lower left of the string are (100, 20). The
    initial font and size are default, and these defaults are system dependent. Size
    is easy to specify using the textSize(n) function ① passing the desired size of
    the characters in pixels (not points). The color used to draw the text is the
    current fill color, not the stroke color.


    The alignment of the text can be specified using calls to the textAlign() function
    ② Horizontal alignment can be LEFT, CENTER, or RIGHT with respect to the x- and
    y-coordinates specified in the text() function call; the default is LEFT. Vertical
    alignment can be TOP, CENTER, BOTTOM, or BASELINE with respect to the x- and y-coordinates
    specified in the text() function call; the default is BASELINE. BOTTOM is the
    line that defines the lowest y value for any character, such as the bottom of
    a descender. BASELINE defines the lowest y value of a typical character with no
    descender. So, the call


    ```

    textAlign(CENTER, BOTTOM);

    ```


    will center the current text from left to right (the specified x value is the
    center of the string) and aligned so that the specified y value is the bottom
    of the string.


    Example A illustrates how to display text in two different sizes. Example B shows
    a line drawn horizontally on each x-coordinate and vertically down each y-coordinate
    specified in the text() call. It shows the alignment of the text with respect
    to the specified coordinates.


    > The names CENTER, LEFT, RIGHT, and so on are just constants declared by the
    Processing system. Their specific values are not important, but the system must
    know what that value is so that the system can make the proper alignments.'
