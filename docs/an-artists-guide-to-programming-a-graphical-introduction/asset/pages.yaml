  md: '# Sketch 10: Triangles and Motion


    Just as rectangles are drawn using the built-in rect() function, triangles are
    drawn using the built-in triangle() function. Triangles can''t be drawn with a
    height and width; their shape is determined by their three angles. As a result,
    the triangle() function has six arguments: the x, y coordinates of the three vertices
    (corners).


    This sketch draws triangles using the mouse. Like the previous sketches that draw
    rectangles and lines, this sketch uses mouseReleased() to determine when a point
    has been selected. After three clicks, a triangle will be drawn using the three
    selected points as the vertices.


    After the triangle is drawn, it begins to move downward, as if it had been pushed
    slightly. It continues to move downward until it hits the bottom border of the
    sketch window, where it disappears.


    We accomplish the motion by adding a small value (delta = 1) to the y-coordinates
    of the triangle each time it is drawn. This draws the triangle at successively
    lower locations in the window until it appears to pass beyond the bottom edge
    of the window. In fact, the triangle still exists to the Processing system, and
    its coordinates continue to update even though it can''t be seen.


    If the user of this program clicks the mouse after the triangle is drawn, the
    triangle disappears and the drawing process begins again. We restart the drawing
    process by re-initializing all the vertices to -1, which indicates that they have
    not been defined.


    The following line of code is commented out inside of draw():


    ```

    // delta = delta + 1;

    ```


    If you remove the // at the beginning of the line, the line will execute and the
    triangle will fall faster and faster, as if being pulled by a force (for example,
    gravity). Remove the // from the line near the mouseReleased() as well and the
    initial speed will reset to 1 with each new triangle drawn.'
