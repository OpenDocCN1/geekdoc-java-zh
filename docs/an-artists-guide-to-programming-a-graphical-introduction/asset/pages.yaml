  md: '# Sketch 68: Saving a State—A Spinning Propeller


    This sketch will draw a spinning propeller. We can code this in many ways, some
    of them simpler than the method in this sketch, but the purpose is to use a simple
    example to explain how and why to save(restore) the *geometric state* of a sketch.


    The geometric state is the resultant combination of all the translation, rotation,
    and scaling that accumulate during the display of an object up to a specific point
    in the drawing process. Rotating an object about its center means translating
    the origin to the center of the object, by rotating, and then translating the
    origin back to its original location. If the state is not restored by undoing
    the translation, then all objects drawn from that time will translate to the location
    of the object.


    The current state, whatever it is, including all rotation, translation, and scaling,
    is saved using a call to the function pushMatrix() and is restored by a call popMatrix().
    These calls must occur in pairs, like brackets: a pushMatrix() has a corresponding
    call to popMatrix(). For example, you could save and restore state while rotating
    a triangle about its center at (100, 100), shown in Figure 68-1, as follows:


    ```

    pushMatrix();

    translate(100, 100);

    rotate(angle);

    triangle(0,-20, 20,-20, -20, 20);

    popMatrix();

    ```


    At this point, rotation and angle are back to their original values, and the next
    object can be drawn from a clean state.


    This sketch draws a propeller with four sections, each being one blade, which
    is is an image. We draw the blade four times: once in the original orientation,
    and three times each rotated about the propeller center point by 90 degrees. Each
    section drawn uses a save and restore:


    ```

    pushMatrix();      // Save

    rotate(PI);             // Rotate

    image(prop, 0, 0);     // Draw

    popMatrix();          // Restore

    ```


    The four-section propeller is drawn inside a drawProp(x,y) function that saves
    the state on entering the function, translates to (x, y), scales the image, rotates
    it, updates the angle so it draws the propeller at a different angle and draws
    the four sections. We use multiple calls to the drawProp() to draw a rotating
    propeller at multiple locations.


    ![](img/7534641f255e2513226c900fd85d94f3_171_0.png)


    Figure 68-1: The transformations needed to rotate an object about its center'
