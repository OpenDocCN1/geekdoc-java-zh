  md: '# Sketch 63: The PShapeObject-A Rotating Planet


    This sketch will display a rotating planet (a sphere) and allow the user to move
    around it in 3D. The new part in this sketch is texture-mapping the planet''s
    surface onto the sphere, which is really a collection of polygons. One way to
    do this is to build a model of a sphere out of polygons and do the texture-mapping
    within a beginShape() and endShape() block. Another easier way is to use a PShape
    object, which is a data type for arbitrary shapes.\ To implement the rotating
    planet, we will create a PShape object through a call to createShape(), which
    allows us to build arbitrarily complex shapes using the large set of drawing operations
    provided by the PShape class. It is possible to create almost anything using a
    PShape, and the documentation available online is necessary for complex operations.
    Our case is simple, because sphere is one of the shapes provided. This call that
    makes the planet, where globe is a PShape object ①


    ```

    globe = createShape(SPHERE, 100); // 100 is the size of the sphere

    ```


    The texture, a map of Mars as a PImage variable named tim, is applied using globe
    .setTexture(tim) ②


    translate(x, y, z);

    We then display the planet in draw() using a call to the shape() function ③


    ```

    translate(x, y, z);

    globe.rotateY(radians(0.5)); // rotateY function is part of PShape

    shape(globe); // This displays the shape in the window

    ```


    This code positions the sphere in the center of the field of view and rotates
    it about its own axis before displaying it. The usual keys allow the user to change
    the viewing position.


    A 3D modeling package such as Studio Max or Maya creates shapes such as cars and
    chairs out of polygons and saves them to a file with the suffix .obj. Animations
    and games use polygon files to create objects within their imaginary worlds by
    rendering and texture-mapping the polygons. Processing programs use the loadShape()
    function to read an .obj file and return a Processing PShape object. Here is an
    example code sequence:


    ```

    PShape s;

    s = loadShape("chair.obj");

    shape(s);

    ```'
