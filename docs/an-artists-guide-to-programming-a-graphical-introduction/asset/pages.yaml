  md: '# AUTHOR’S NOTE


    Processing is a programming language designed by Casey Reas and Ben Fry to be
    used by artists creating generative art. It is based on Java, and it extends Java
    in many useful ways: it allows the programmer to easily read, display, and write
    image files; it has functions for drawing elementary shapes and curves; it makes
    manipulating colors simple; and so on. Most importantly, it opens a window into
    which the programmer/artist will draw. All Processing programs are intended to
    create an image, a visual output.


    This book presents the Processing language and its many applications in a set
    of graduated examples. The details of the syntax are not the focus, although they
    are explained briefly. The idea is to present a collection of programs that the
    reader can experiment with. When the book is open to any sketch, the left side
    of the page will have descriptive text, while the right will show the program
    and the result, as an image.'
  merge: -1
  pgno: 12
