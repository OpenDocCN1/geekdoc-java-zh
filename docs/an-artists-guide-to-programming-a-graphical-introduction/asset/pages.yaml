  md: 'Today''s artists need to know how to work with pixels as well as with pencils.
    An Artist''s Guide to Programming provides a creative introduction to coding using
    Processing, a Java-based language designed to be visually intuitive. In 100 short,
    hands-on lessons, you''ll go from drawing lines and circles to creating sophisticated
    simulations and programming experience is required.


    +   - Create user interfaces and generate interactive multidimensional animations


    +   - Simulate real-world phenomena, like smoke, flocking birds, and the Northern
    Lights


    +   - Share your work online


    Each lesson features a one-page Processing program, or sketch, that produces graphical
    or sonic output. Alongside the program, you''ll find a detailed explanation of
    the code, the concepts behind it, and images of the result. You''ll be amazed
    at what you can do with your short, experimental programs, from creating a driving
    simulation drawing intricately realistic plants to generating audio visualizations
    and more.


    Beyond artistic techniques, you''ll also build up a foundational knowledge of
    computer science. You''ll learn how to use variables, loops, conditions, functions,
    and classes to write your own programs and bring your ideas to life through code.
    By the end of the book, you''ll be able to make your own digital artwork or apply
    your programming prowess to other creative disciplines.


    You''ll learn how to:


    +   - Draw basic shapes, set colors, add textures, and animate text


    +   - Work with or manipulate image, video, and sound files


    # ABOUT THE AUTHOR


    Jim Parker is a professor, author, and artist who has published a dozen books
    and over 177 technical papers in addition to writing short stories. He has degrees
    in mathematics and computer science, and a PhD from the State University of Ghent,
    Belgium. He has also exhibited generative art and sent art into space.


