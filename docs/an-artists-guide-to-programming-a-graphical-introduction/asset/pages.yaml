  md: '# Sketch 26: Duplicating images—More Functions


    The purpose of the sketch is to give you some ideas about how to organize code
    functions properly. This program will read an image, make a copy, and increase
    the brightness of the copy. The brighter version will be displayed when a mouse
    button is pressed.


    The first function is brighten(). It is passed an image (named img) and an integer
    value (named val) as parameters. Its purpose is to increase the brightness value
    of an image by extracting the HSB value from each pixel in a nested loop, adding
    the amount val to the brightness portion, and saving the back in the image. This
    is the essential part.


    ```

    // Extract the HSB values from the pixel at (i,j)

    c = img.get(i,j);

    // Add val to the brightness and save again.

    img.set(i,j, color(hue(c), saturation(c)+val));

    ```


    We use a new feature in draw(). Processing provides us with a variable mousePressed
    that is true if mouse button is depressed and false otherwise, and this can be
    used in place of the mousePressed() callback function in very simple cases. In
    this instance, we display the brightness-enhanced image when the mouse button
    is pressed, and the original otherwise.


    ```

    if (mousePressed) draw(img2, 0, 0);

    else draw(img1, 0, 0);

    ```


    The second function in this sketch makes a copy of the original image. We define
    the duplicate function as follows:


    ```

    PImage duplicate(PImage from)

    ```


    According to the definition of this function, the function takes an image as an
    argument and returns an image. In fact, it returns a new image that is a copy
    of the one passed in. The Processing-supplied function that creates a new image
    is named createImage() and has this form:


    ```

    createImage(width, height, RGB);

    ```


    The width and height should be self-explanatory; the constant RGB specifies the
    form of the image, which in this case is RGB color. The image returned by CreateImage
