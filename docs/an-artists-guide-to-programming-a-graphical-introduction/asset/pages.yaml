  md: '# Sketch 27: Saving an Image and Adjusting Transparency


    We are going to write a sketch that will allow the user to select a color in an
    image that will become transparent, and then save the image as a GIF. We can save
    any PImage in a file, just as most image files can be read into a PImage. If img
    is a PImage variable, we can save it as a file using this function call:


    ```

    img.save("image.jpg");

    ```


    The parameter is the name of the file to be created. In the situation above, it
    will create a file named image.jpg and save the pixels of the PImage in JPEG format.
    The format is completely determined by the last three letters of the filename:
    .jpg for a JPEG file, .gif for a GIF file, .png for a PNG file, and so on. Processing
    saves the image that we created in the sketch.


    For this sketch, the first step is to read and display the image. Next, we move
    the mouse over a pixel with the color we want to make transparent, and click the
    button. Finally we save the image in a format that allows transparency (GIF).


    In Sketch 2 I mentioned transparent colors. We can set a fourth color component,
    referred to as alpha, a value between 0 (completely transparent) and 255 (completely
    opaque), as long as the GIF format allows transparency; the format that does is
    RGB. In this sketch, when the image is read in, we make a copy of the previous
    sketch, but using RGB as the color format. When we click the button, the program
    looks at the pixel at the cursor''s coordinates and adds an alpha value of 0 to
    the color coordinates. Then the color in the PImage is updated with the new alpha
    value.


    The original image that we read from the file is a variable named img1; the copy
    includes alpha values is img2; Processing makes a copy of the image using the
    following statement, as we do at:


    ```

    img2 = createImage(img1.width, img1.height, RGB);

    ```


    This creates an image of the correct size, and now we must copy all of the pixels
    from img1 into img2. When we do so, the pixels in img2 have the alpha component,
    because it was specified in the createImage() call. When a mouse click specifies
    a background-color, all pixels of that color are given an alpha value of 0. Then
    img2 is saved in a file named out.gif.


    The program ends with a call to exit(), because otherwise it would continue to
    save the same file again and again.


    Why is it important to set a transparent background for an image? Computer games!


    The string parameter img, save("image.jpg"); can include a full path name, so
    the file can be saved in any directory on your PC.'
