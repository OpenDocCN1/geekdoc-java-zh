  md: 'Illumination can profoundly change the appearance of a scene. The location
    of lights will cause specific portions of objects or scenes to be visible while
    others are not. Colored lights can change the apparent color of objects. Directional
    lighting can illuminate some portions of an object and not. Processing provides
    all of these options.


    In this sketch, we will draw a sphere and permit the user to select the type of
    lighting used by typing a number. The lighting may be ambient (1), directional
    (2), point (3), spot (4), or all three: directional, point, and spot (5). The
    default lighting is 0. When the user changes the kind of lighting, the color changes
    as well: ambient is cyan, directional is violet, point is yellow, and spot is
    green.


    The previous sketches have used a call to provide default illumination. Alternatively,
    we can use a call to the ambientLight() function ① to specify a color and, optionally,
    a location for ambient lighting, which is illumination that permeates the scene.


    ```

    ambientLight(r, g, b, x, y, z);

    ```


    The first three parameters specify the RGB values for the color of the light.
    The next three are optional, and specify a location in three dimensions. Light
    spreads in all directions from this point.


    The directionalLight() ② specifies light from a specific direction, so it appears
    brighter when striking a surface perpendicular to that direction and less bright
    as the angle changes.


    ```

    directionalLight(r, g, b, dx, dy, dz);

    ```


    Again, the first three parameters represent the color of the light. The next three
    specify the direction. So, for example, if dy=1 and dz=0, the object will be illuminated
    from above.


    The pointLight() function ③ creates a single location from which illumination
    comes, like a lamp. This call places a light location with the specified RGB values
    at the given (x, y, z) location:


    ```

    pointLight(r, g, b, x, y, z);

    ```


    Finally, a spotlight() ④ is a concentrated directional light, and it is the most
    complex of the lighting sources. This call specifies a light of color RGB at location
    (x, y, z) pointed in direction (dx, dy, dz):


    ```

    spotlight(r,g,b,x,y,z, dx,dy,dz, angle, center);

    ```


    The value of angle is the dispersion angle of the light; the smaller the angle,
