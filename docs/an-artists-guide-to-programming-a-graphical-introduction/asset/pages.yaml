  md: '# Sketch 58: Moving the Viewpoint in 3D


    In a first-person computer game, the representation of the player in the game
    is an avatar, controlled by the player. Pressing W moves the avatar forward, S
    moves it backward, A moves it left, and D moves it right. This scheme is easier
    for a player to understand but harder to implement than the scheme we have been
    using.


    In the sketches presented so far, the movement has been automatic or based on
    simplistic assumptions—A and D move along the x-axis and W and S move along the
    z-axis—but people do not move in that way. The A and D keys should rotate the
    player about their own axis, and the W and S keys should move the player forward
    and backward along the direction defined by that angle. As a demonstration of
    avatar movement control, this sketch draws nine cubes and allows the user to move
    among them using this technique.


    The avatar has a direction in which it is facing, defined by the variable angle
    (degrees). The A and D keys allow the user to change this angle by one degree
    per key. Changing the angle will not modify the camera position, but it does modify
    the center of the scene by rotating about the avatar. Because the vertical axis
    is y, we can calculate this in the x-z plane as a simple trigonometric relationship


    ```

    cx = cos(radians(angle))*2000.0;

    z = sin(radians(angle))*2000.0;

    ```


    The value 20,000 represents a large distance, effectively infinite, that provides
    a distant focus point.


    W moves the avatar unit along the direction it is facing, which is the variable
    angle. Each unit moved changes the x position by dx and the z position by dz,
    as defined in Figure 58-1.


    ![](img/7534641f255e2513226c900fd85d94f3_149_0.png)


    Figure 58-1: Converting [x, z] motion to (angle, distance)


    The position of the avatar is (eyex, eyez), and it is likely that for any forward
    or backward movement, both of these values will change. One key press will move
    the avatar 5 units, or dx5.


    The radians() function can be used to convert an angle in degrees into radians.'
