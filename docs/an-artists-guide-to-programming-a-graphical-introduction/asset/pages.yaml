  md: '# Sketch 4: Loops–Drawing 20 Circles


    Programmers often need to execute the same code over and again, sometimes with
    small variations. A program that draws 50 ellipses in the sketch window could
    be written using fifty calls to the ellipse() function, one for each ellipse drawn.
    Another way is to have one statement with a call to ellipse(), and execute it
    50 times in a loop.


    A loop in a program is a collection of statements that executes repeatedly from
    the first to the last, in the same order. You must specify the condition upon
    which the loop will exit. It''s pretty common to know in advance how many times
    the loop should execute, in the example of drawing 50 ellipses. Sometimes you
    will know the number ahead of time, but you can calculate it, and N depends on
    some other thing. In either case, a counter is called for a loop in Processing
    because the reserved word for is used to begin the loop.


    ```

    for (i=0; i<10; i+=1) statementA;

    ```


    This loop executes 10 times: once when the variable i=0, again when i=1, when
    i=2, and so on until i=9. When i is 10, the condition (i<10) becomes false and
    the loop ends. As a result, statementA executes 10 times, one for each value of
    0 to 9. The loop has four parts:


    +   **i=0** The initialization is executed the first time through the loop.


    +   **i<10** The loop will continue to execute so long as the continuation is
    true.


    +   **i+=1** At the end of each iteration, after the statement is executed, the
    increment will be executed.


    +   **statementA** This is the code that gets executed repeatedly.


    If the exception is at the beginning, the loop does not execute even once. The
    statement that executes be a compound statement, which is a collection of statements
    enclosed in braces. In fact, any time I refer to a statement, it can mean a compound
    statement.


    # Example A


    A loop in Processing can draw 20 ellipses ① starting at (20, 40) and ending at
    (210, 40). The ellipses are circles and are drawn next to each other. The draw()
    function exists but does not do anything.


    # Example B


    We can make the color for each circle by using a compound statement. Let''s change
    the green value by 10 each time a circle is drawn, starting with green = 10 ③
    Red and blue both stay at their maximum of 255. The code within the loop needs
    to set the fill color, draw the circle, and adjust the fill color for the iteration
    ②.


    The loop executes for 20 values of i: 0 to 19 inclusive. If we were to expand
    the code to show what it would look like this:


    ```

    (i=0) fill(255, 10, 255); ellipse(20, 40, 10, 10); g = 20;

    (i=1) fill(255, 20, 255); ellipse(30, 40, 10, 10); g = 30;

    (i=2) fill(255, 30, 255); ellipse(40, 40, 10, 10); g = 40;

    ---

    (i=19) fill(255, 190, 255); ellipse(210, 40, 10, 10); g = 200;

    ```'
