  md: "# Sketch 98: The Computer Game Breakout\n\nThe original game Breakout was designed\
    \ and built in 1975 by legendary early of games Nolan Bushnell, Steve Wniak (later\
    \ of Apple fame), and Steve Bristow at Atari. In basic concept, it is a variation\
    \ of Pong for one player, where the paddle is used to bounce a ball into bricks\
    \ that vanish when hit. The original game has eight rows of rectangular bricks,\
    \ with pairs of rows having the same color. The ball bounces off the sides and\
    \ top of the game screen, and off a brick after it disappears, but is free to\
    \ pass through the bottom. The player must move the paddle to hit the downward-moving\
    \ ball to prevent it from disappearing. The player has three turns (that is, they\
    \ can miss the ball three times) to clear the screen of bricks, and different\
    \ colored bricks score a different number of points.\n\nThis sketch will implement\
    \ a simplified version of the game. There are three rows of red bricks, all worth\
    \ the same amount. There is no sound and no high score. The bricks are filled\
    \ rectangles,30 pixels by 15 pixels, and the ball is a simple circle, 3 pixels\
    \ across. A 2D array exists[i][], is used to keep track of which bricks have been\
    \ eliminated, and the brick in row i will be drawn if exists[i][j] is true. Drawing\
    \ the bricks is therefore simple:\n\n```\nfor (int i=0; i<nCols; i++) // Draw\
    \ all bricks\n  for (int j=0; j<nRows; j++)\n    if (exists[i][j]) rect (i*30,\
    \ j*15, 30, 15);\n```\n\nThe ball is drawn at (x, y) and is moving each frame\
    \ by an amount (dx, dy). The paddle is a simple line centered at (px, py). Typing\
    \ A key moves the paddle by 10 pixels (px-=px) it moves right by the same px -\
    \ 30 and px + 30, then the ball changes y-direction (dy=-dy) and it appears to\
    \ bounce. If the ball meets the coordinate py (py = 300) it bounces.\nThe ball\
    \ also bounces off the top of the screen (y=0) and the sides (x<0 or x>width).\n\
    We test the ball against each brick for a collision during each frame; this is\
    \ done using the absolute coordinates of each brick. If the brick at (i, j) exists,\
    \ then these are the brick boundaries:\n\n| Dimension | Coordinate value | Boundary\
    \ | Coordinate value | Boundary |\n|---|---|---|---|--|\n| X | i*30+20 | Left\
    \ edge | i*30+50 | Right edge |\n| Y | j*15+30 | Top edge | | Bottom edge |\n\n\
    Simply check the ball's coordinates against these values for every brick, and\
    \ bounce if the ball is inside the brick. At the same time setting exists[i][j]\
    \ to false and increasing the score.\n\nAfter the ball falls past the bottom,\
    \ we decrement life and the ball is redrawn at a random x location at y value\
    \ 150. The game is over when the value of life is 0 or the score is the maximum\
    \ of 36.\n\nThis simple version features. The bounce off of the brick is not on\
    \ the side of the brick that was hit; the bounce of the ball is always changed.\
    \ The bounce off the paddle is always the same, no matter where the point of impact."
