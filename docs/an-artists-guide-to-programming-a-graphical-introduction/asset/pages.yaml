  md: '# Sketch 20: Rotating an Image


    Rotation and translation can be applied to complex objects as well as simple lines
    and circles. In particular, we can rotate images about arbitrary points by any
    angle.


    There can be a problem in determining how to place the image so that it lies entirely
    on the screen. Images are rectangular, and rotating them increases their width
    or height. If we don''t place the image properly within the window, one or more
    corners could rotate out of the window''s boundaries, as shown in Figure 20-1.


    ![](img/7534641f255e2513226c900fd85d94f3_63_0.png)


    Figure 20-1: Rotating an image out of the window''s boundaries


    The top pair of images shows the result of rotating an image that was displayed
    in the upper-left corner of the window. Rotating by 45 degrees moves half of the
    image off of the screen. The bottom pair of images shows what can happen when
    an image is rotated about its center without a large enough window: the corners
    of the image are cut off.


    This sketch displays a continuously rotating image. The image is read in, and
    the window size is set to *double* the image size in each dimension ①. The draw()
    function translates the origin to the center of the image and rotates the image
    by angle and displays it, thus rotating the image about its own center ②. The
    value of angle is increased by a tiny amount for the next time `draw()` is called
    ③. The image appears in the center of the window and appears to rotate.'
