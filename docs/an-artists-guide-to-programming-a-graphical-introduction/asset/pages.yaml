  md: '# Sketch 46: Likert Scale


    A Likert scale is a rating scale for answering questions, commonly used in questionnaires.
    The person being asked the question selects one of the answers from a set of choices
    (often five) ranging from ''Strongly Disagree'' to ''Strongly Agree''. The idea
    is to collect standard answers upon which statistics can be computed.


    This sketch poses a question by drawing it near the top of the screen. The possible
    answers are numbered from 1 (Strongly Disagree) to 5 (Strongly Agree), and each
    answer corresponds to a circle. To select an answer, the user clicks on a circle,
    and the circle gets filled in. When the user has answered to their satisfaction,
    they type any key and the sketch asks another question.


    The questions reside in a text file named questions.txt that is opened within
    setup(). We assume that there are multiple questions, and each is one line of
    text in the file. The loadStrings() function reads them all into an array question,
    the length of which is the number of questions. Each question is asked (displayed)
    according to its index variable, questionNo, which iterates from 0 to the number
    of questions. The user selects an answer, one of five possible, by clicking the
    mouse within one of the five circles (using a variable named selected) in the
    mouseReleased().


    When the user types a key, keyPressed() is called, and the selection will be written
    to a file named save.txt. Then the questionNo variable will be incremented, resulting
    in the next question being displayed. When all questions have been asked (that
    is, when questionNo > question.length), the file is closed and the program ends.
    The answers chosen by the user to all questions are now stored in the save.txt
    file.


    > There is only one output file, but there may be many users. We can prompt users
    for their name or an ID number, and that could be used as the basis for a filename,
    so that many distinct sets of answers could be saved. Another option would be
    to create filenames that end in consecutive numbers. When the program begins,
    it could try to open files until it arrived at one that did not exist; that would
    be the next usable filename.'
