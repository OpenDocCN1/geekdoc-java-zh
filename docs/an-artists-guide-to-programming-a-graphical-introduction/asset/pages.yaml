  md: '# Sketch 42: A Button


    After text from the console or a file and basic mouse gestures, the simple button
    is the third most popular use input method. It is ubiquitous on web pages, game
    screens, and any system that requires on/off or yes choices from a user. It is,
    of course, based on the old-fashioned push button that has existed for a long
    time as an electrical device, and it works in a natural way: push the button and
    something happens.


    Graphically, a button is really just a rectangle. It is usually filled with a
    color and has a text label or image to indicate its function. When the user clicks
    the mouse while the cursor is inside the button, the task assigned to the button
    is executed, usually by calling some function. Properties that a button has its
    position (the x and y-coordinates of the upper left corner of the button), size
    (the width and height of the button), label (the string that is written in the
    button), and a color or image that will appear in the button.


    A button is said to be armed when the mouse cursor lies over it. When armed, a
    mouse click will drawn with a different color or font when it is armed to indicate
    the activation to the user.


    The button implemented in this sketch causes the background color of the sketch
    window to change. It is armed when the mouse enters the rectangle ① :


    ```

    if ( (mouseX>=bx) && (mouseX<=bx+bw) && (mouseY>=by) && (mouseY<by+bh) ) {

    ```


    where (bx, by), by is the size of the button.


    the button() function returns true when this condition is true. The drawButton()
    draws and fills the rectangle and draws the text ②. When the button is armed,
    drawButton() also changes the fill color from green to red. And, of course, the
    mousePressed() function determines whether the button was pressed and changes
    the background color if so ④


    Because this sketch only implements a single button, it doesn''t use much code.
    It is common for an application to have many buttons, as you''ll see in the next
    sketch.


    Instead of drawing and filling a rectangle, you can draw an image to represent
    the button, using the image() function instead of rect(). In this case, the unarmed
    and armed images would also be properties of the button. The test of the mouse
    coordinates is against the numeric values of the rectangle or image size and is
    independent of whether anything is actually drawn. The graphical rendition of
    the button is for the convenience of the user.'
