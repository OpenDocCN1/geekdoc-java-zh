  md: '# Sketch 69: L-Systems—Drawing Plants


    Drawing realistic-looking plants is difficult. Living things do not usually contain
    straight lines, which is what computers draw best. In addition, there is a random
    nature to life forms that humans recognize, so are critical of renderings. In
    1968 a botanist Aristid Lindenmeyer developed a scheme for describing growth of
    fungi and algae, and then later expanded it to deal with more advanced plant life.
    This was in turn adapted by computer graphics practitioners to a scheme for drawing
    plants. We call this an L-system.


    An L-system is technically a grammar, which is a set of rules for making strings.
    If a grammar has two rules, X->F and X->X, then it is showing how to take a symbol,
    X, and transform it into a sequence of characters. For each X, we choose which
    replacement rule to follow, and continue replacing all Xs (referred to as non-terminal
    symbols) until there are no more left to replace. Here is an example expansion
    for this grammar: X->F->Xf->Xff.


    In an L-system, a grammar that can define a plant, the final string represents
    a recipe for drawing something. It uses the following systems:


    +   Draw a line segment.

    Save the current state (pushMatrix()).

    Go to the previous state (popMatrix()).

    Rotate by a positive angle.

    Rotate by a negative angle.


    The grammar uses two rules to produce a scheme of strings:

    X->ff

    X->f-[[X]+X]+f+[X]-X


    Unless the plant consists of only two straight lines (ff), the first step would
    be X->f-[[X]+X]+f+[X]-X. Then each X would be replaced by the right side of a
    production, the second step might be f-[[X]+X]+f+[X]-X->f-[[X]+X]+f+[X]-ff+[ff]+ff,
    followed by f-[[[[ff]]+[ff]]+[ff]]+[ff]]+[ff]]ff, which can now be drawn.


    The makeStyles function calls itself to expand strings and append them to the
    string constructed. It will only call itself to a depth specified by the first
    parameter, levels, and then return, guaranteeing that the program will will eventually
    end. The string generated by the grammar is passed to the drawPlant() function,
    which executes each character as a graphical operation, drawing the plant. In
    the void drawPlant(float length, float angle, string intLevel), the first parameter,
    length, is the length of the line to draw for the symbol f; the angle is the rotation
    angle for the + and - characters; s is the string generated by makeLevel indicates
    a depth for drawing lines. Essentially, makeString() creates a string that is
    a program for how to draw the plant, and drawPlant() executes program.


    Part 8'
