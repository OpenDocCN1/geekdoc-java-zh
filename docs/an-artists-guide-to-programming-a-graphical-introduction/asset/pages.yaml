  md: "# Sketch 24: User-Defined Functions\n\nUp to this point, we have been using\
    \ drawing functions provided by the Processing system: ellipse(), line(), mousePressed(),\
    \ and so on. We have not analyzed the concept of functions much, partly because\
    \ it appears fairly obvious what is going. However, if we wish to create our own\
    \ functions, there are some things we need to understand.\n\nA function is a name\
    \ given to a collection of code. When the name of the function is used in a statement,\
    \ function is said to be invoked or called, and the code within the function is\
    \ executed. This means that functions can be executed from many different places\
    \ without repeating the code itself, by calling it.\n\nA function can return a\
    \ value: we have used such functions before. For example, color() and get() return\
    \ color and pixel values. Functions that do not return a value are said to void,\
    \ and that's for the word void in front of setup() and draw(). They are functions\
    \ that do not return a value.\n\nTo create a new function, we must follow the\
    \ same syntax as setup() and draw(): we write the type, the function name, parentheses,\
    \ and then the function body in brackets. For example:\n\n```\nvoid newFunctionA()\
    \ {\nint newFunctionB() {\n  code\n  return value;\n}\n```\n\nAbove, newFunctionA()\
    \ does not return a value, and it is called or invoked using the function call\
    \ newFunctionA(); newFunctionB() returns an integer value and must have a return\
    \ statement indicating the value to be returned. This type of function is called\
    \ as if it were part of an expression:\n\n```\na = newFunctionB();\nx = newFunctionB()*2\
    \ + 1;\n```\n\nThere can be more than one return statement in a function, but\
    \ only one will be executed, once a function returns, no other code in the function\
    \ can execute.\n\nFunctions may have parameters or arguments, values that are\
    \ given to the function when it is called. When calling the function color(),\
    \ we list three values in the parentheses: red, green, and blue. These variables\
    \ are specifically passed for the function, and their values are available to\
    \ do calculations within the function.\n\nLet's make a function that calculates\
    \ the distance between two points, (x0, y0) and (x1, y1):\n\n```\nfloat distance\
    \ (int x0, int y0, int x1, int y1)\n```\n\nThe arguments to the function are named\
    \ x0, y0, x1, and y1, and they have types, in this case integer (int). The arguments\
    \ are used to calculate the distance between the points (x0, y0) and (x1, y1)\
    \ as follows:\n\n```\n\\sqrt{(x0-x1)^2 + (y0-y1)^2}\n```\n\nThis sketch uses two\
    \ mouse clicks to determine the points: (x0, y0) ② and (x1, y1) ③. It draws a\
    \ marker at each point and displays the distance between them as a text message\
    \ at the bottom of the window ④."
