  md: '# Sketch 65: A Driving Simulation with Waypoints


    Sketch 60 allowed a user to drive around a track in 3D, and Sketch 64 illustrated
    how to create curves, like a track that a simulated car could drive on. Computer
    games often have automated vehicles that compete with the player, giving the impression
    of being a real opponent. This sketch will implement a system for computer-controlled
    cars that are similar to the methods used in those computer games.


    It''s important to realize that games and simulations do not necessarily do what
    the people do. A human driver will orient the car on the next turn they could
    see and we could build a computer program to do this too, but it would be pretty
    complicated. Another option is to use predetermined knowledge about the track
    to steer the vehicle. In this case, the programmer provides more information to
    the program at the outset, but the resulting simplicity in code is worth the effort.


    To be specific, the programmer breaks the track into linear pieces. The linear
    pieces should be as long as possible and join to other vertices called waypoints,
    places where the direction of the line, the car changes. (We can dissect this
    way.) Each waypoint will have a number or label assigned by the programmer. When
    the car is at waypoint 1, the program will change its direction of motion to move
    toward waypoint 2. When it arrives at waypoint 2, it will steer to waypoint 3.
    Because the segments are linear, we don''t need to steer between waypoints.


    This sketch implements waypoints as a collection of arrays, each array containing
    one dimension of the waypoints. The location of waypoint i is in the array locations
    wx[i] and wy[i]. In a more accurate simulation, a waypoint would have much more
    information associated with it: changes in speed and acceleration, rate of change
    of the turn, and perhaps graphical information like brake lights turning on. In
    the current sketch, the only other thing needed is the angle between the current
    and the next waypoint so that we can rotate the car to face the new direction.
    We could calculate this, the positions of the waypoints and the angles between
    them determined in advance. We declare arrays wx, wy, and wa and initialize them
    with the position and angle data, which implicitly defines the size of the arrays.
    It is not possible to specify the size of an array using a number and initialize
    it using that.


    Using the vehicle''s assigned speed (changed using W and S), we compute its position
    change each frame as dx = speed * (wx[i+1]-wx[i])/d(i,i+1) where d is the distance
    between i and i+. We see that the vehicle has arrived at waypoint i when it is
    within speed pixels of it, at which point it changes direction and aims for the
    next waypoint, i+1. The waypoint variable indicates the last waypoint encountered,
    meaning that the vehicle is aiming for waypoint+1. The waypoint count wraps around
    the end, so we increment modulo-N where N is the number of waypoints: the waypoint
    following N is 0.


    Pressing the spacebar allows the user to see where the waypoints and paths are.'
