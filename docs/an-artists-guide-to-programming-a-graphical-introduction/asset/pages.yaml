  md: '# Sketch 78: Synthetic Sounds


    This sketch will implement a small synthesizer. It will only have eight keys,
    more like a child''s toy piano, but it will be functional and can serve as the
    basis for more complex sound synthesis projects.


    Min provides a type (class) named AudioOutput that allows us to display signals,
    not just sound files, on the PC hardware. It allows the playing of a note, although
    not exactly musical notes as normally understood. A note in this context is a
    digital audio signal having a specific frequency.


    The name of the AudioOutput variable in the sketch is, and it is initialized ①
    as the following:


    ```

    out = minim.getLineOut(Min.STEREO);

    ```


    This call allocates a new instance of AudioOutput that is accessible from the
    variable out. To play a note, call the playNote() function ②:


    ```

    out.playNote(440.0);

    ```


    This sends a sine wave with a frequency of 440 Hz (the musical note A) to the
    sound card. playNote() can be called with nearly any frequency, because the “notes”
    are just snippets of a sine wave.


    Unfortunately, the AudioOutput object likes to impose a specified duration on
    a note, so the system believes to be a single unit of time. To imitate a musical
    instrument played by a human who can vary the duration, we need to call playNote()
    with more parameters:


    ```

    out.playNote(0, 1000, 493.9);

    ```


    In this example, 0 is the time until the note is to be played (immediately), 1,000
    units is the duration, and the final parameter is the frequency; 1,000 units is
    a long time.


    The sketch displays a simple piano image with labeled keys. When the user clicks
    the mouse on the graphical piano keys, the program plays that note ③; the value
    of the x position of the mouse tells us what the note is (in mousePressed()).
    When the mouse button is released, the program creates a new AudioOutput ④ so
    that the old note stops playing and a new one can start (in mouseReleased()).'
