  md: '# Sketch 74: Mixing Two Sounds


    In the process of sound mixing, we assign each of a number of sound sources to
    different output levels or volumes. In live music concerts this makes the sound
    of each instrument audible at the proper volume level. We also do this when recording
    multiple sources of sound, such as microphones, guitars, and other instruments,
    which need to have their volume levels adjusted so that no one component overwhelms
    the total. Mixers have been around for a long time, and most have sliding controls
    to adjust volume levels of sound signals. This sketch will use the slider control
    developed in Sketch 43 to adjust the volume of two different sounds.


    The sketch begins by declaring two Audioplayers ①, one for each, loading the sound
    files ②, and starting to play them ③. Next we create two controls; one A, having
    position and control variables being "a" (asider, aslayer, value) and the other
    is B (bsider, bvalue, and so on). The value of A is used to set the volume of
    the first of the sounds being played by (player), and B controls the volume of
    the other (player).


    We set the output level by calling the min function gain(). This function has
    a parameter that represents the value of the gain (proportional to volume). The
    units in gain are decibels (dB) and they begin at -80 and end at +14 for a total
    range of 94 dB units. The range of the slider values is 1,000. Thus, the gain
    for player a is using the following call ④:


    ```

    player.setGain(value/1000.0 * 94 - 80);

    ```


    If the slider value is at the minimum of 0, the gain will be 0/1,000 * 94 - 80
    = 0 - 80 = -80. If the slider value is at the maximum of 1,000, the gain will
    be 1,000/1,000 * 94 - 80 = 94 - 80 = 14. That the gain values have the correct
    output for the extreme values supports the idea that the mapping is correct. The
    dB scale is logarithmic, though, this is an approximation of the truth.


    When the sketch is executing, the two files will play. The top slider right will
    increase the volume of the sound.mp3 file, and sliding the lower slider will control
    the volume of the sound.mp3 file. The idea is to find relative levels that sound
    right.


    > It would be better to implement the slider widget that controls the volume as
    a class so that multiple sliders could be placed on any screen and pass multiple
    values to the program. Some mixers have scores of inputs, each controlled separately.
    Also note that in this sketch the usual call to play() ⑤, which is replaced by
    a call to loop() ⑥, which continually replays the sound from the beginning until
    it ends (for example, player.loop()).'
