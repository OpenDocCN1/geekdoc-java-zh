  md: '# Sketch 82: Saving Still Frames from a Video


    This sketch will allow the user to save a set of still image frames from a video.
    The video is played in a loop so that the user can select all of the frames they
    need. Clicking the mouse will start saving images, and again will stop it.


    Saving frames is accomplished using the save() function of the Movie class object.
    If movie is a Movie object, the following call saves the current frame in the
    named file as the type indicated by the file extension:


    ```

    movie.save("name.jpg");

    ```


    This is the same way we save Pictures. In this case, we save a JPEG, GIF, PNG,
    and other file formats work too.


    To save multiple frames without overwriting the same file each time, we might
    use the number of stills that we have already saved, stored in the variable v,
    in the filename, as follows:


    ```

    movie.save("frame+"+v+".jpg");

    ```


    This means the filenames would be frame1.jpg, frame2.jpg, and so on.


    With this labeling scheme, there''s no way to tell where one sequence ends and
    the next one begins. This sketch solves that problem by using the variable nclicks
    in conjunction with v. When the user clicks the mouse while the frames are being
    saved, nclicks is incremented, and v is reset. We build a filename using the frame
    count and a letter that is relative to the nclicks variable: nclicks = 0 adds
    the letter "a" to the name, nclicks = 1 adds "b" to the name, and so on. The file
    for each frame is actually saved as follows:


    ```

    movie.save("frame+"+char(nclicks+int(''a''))+\v+".jpg");

    ```


    The first sequence would be frame1.jpg, frame2.jpg, ... and the second would be
    frame1.jpg and so on.


    The sketch draws the still on the screen, but this is for the user—it will not
    appear on the saved image.


    Another way to save video frames is to display them in the sketch window then
    save the sketch window as an image. If we did that in this case, the time drawn
    on the window would in fact be saved to the file with the image.'
