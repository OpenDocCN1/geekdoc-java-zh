  md: '# Sketch 12: Manipulating Text Strings


    The previous sketch is really an introduction to character strings, which are
    a natural way for a human to communicate with a computer. A string is a sequence
    of characters; so is a word, a sentence, or a paragraph. At a high level, a string
    consists of a collection of characters in a specific order. There is a first character,
    a second, and so on until the final one is reached. The number of characters in
    this sequence is the length of the string.

    String constants are character sequences enclosed in double quotes like: "To be
    or not to". We can use string constants to declare variables that are Strings
    and assign values to them. At I, for example, we declare two string variables
    and assign string constants to them:


    ```

    String s1 = "To be or not to be"

    String s2 = "that is the question."

    ```


    Strings can be constructed by sticking other strings together. The + operator,
    when applied to strings, means concatenate or append, so the quote can be completed
    by concatenating these two strings:


    ```

    s1 = s1 + s2;

    ```


    This makes s1 become "To be or not to bethat the question." Unfortunately, this
    is not quite right, because we need a comma and a space between the two strings.
    This would be better:


    ```

    s1 = s1 + " " + s2;

    ```


    The first character, "T", in this has an index of 0, meaning it is in the position
    of string. The character "o" is in position 1, and so on.

    A substring is a sequence of characters within the string specified by indices.
    The substring of s1 from index 6 to 11 is the string "or not", and it is found
    in Processing as follows:


    ```

    s1.substring(6,12)

    ```


    The length of this string is six characters, and that length is returned by the
    function length():


    ```

    s1.substring(6,12).length()

    ```


    The character at a specific location can be found with the charAt() function.
    For example, s1.charAt(3) is "b" and s1.charAt(18) is " ".


