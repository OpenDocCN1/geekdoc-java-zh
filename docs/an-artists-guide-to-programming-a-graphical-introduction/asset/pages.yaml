  md: "# Sketch 75: Displaying Audio Waveforms\n\nMost computer-based sound editors\
    \ display a graphical rendering of the audio signal and allow the user to \"grab\"\
    \ parts of it with the mouse and move or delete them. This graphical display is\
    \ actually a plot of audio volume versus time. Some music players display such\
    \ a plot in real time, as the music is playing. That's exactly what this sketch\
    \ will do. It draws the plot of whatever sound the computer is playing.\n\nDrawing\
    \ this requires the ability to get the sound data as numbers in real time. A bit\
    \ of error does not matter, because this is not a scientific tool, so it's possible\
    \ to use some of the code from Sketch 72, which also displayed an audio visualization.\
    \ Here we will fill a buffer and then play it as sound data until the data is\
    \ finished.\n\nAudio is represented as a set of consecutive numerical values that\
    \ can reasonably be stored in an array (buffer). There are two channels (stereo),\
    \ and any value from a buffer can be retrieved using the in.get() or in.get()\
    \ functions, specifying which sample is used. For example, the program gets a\
    \ data point from the left-channel by calling in.get()  ① and uses this value\
    \ to represent all levels in the current buffer. This is just one data point from\
    \ many samples, and it is possible to specify the buffer size when the getLine()\
    \ calls. The system plays sound from this buffer and refills whenever it needs\
    \ more data. We specify a size of 1,024 samples per buffer ②\n\n```\nin = minimum.get(Min.StereO,\
    \ 1024);\n```\n\nIf the window is 512 pixels wide, then 1 pixel for every 2 samples,\
    \ its height being the value retrieved by the call to get data element between\
    \ -1 and +1, we draw the 1,024 data points as a line from (i, data) to (i+1, data+1)\
    \ for all i between 0 and 1,023 by two ③ This is illustrated in Figure 75.\n\n\
    ![](img/7534641f255e2513226c900fd85d94f3_187_0.png)\n\nFigure 75-1: Scaling samples\
    \ and plotting them as lines\n\nIn other words, we have the following:\n\n```\n\
    for (int i=0; i<1024; i=2)\n{\n  ly = in.left.get(i)*100+height/2;\n  if (i!=0)\
    \ line (i, y, i+2, ly);\n  y = ly;\n}\n```\n\nWe do this in the draw() function\
    \ so it will refresh every 10th of a second and display an animated version of\
    \ the audio. We scale the data by multiplying by 100, giving a total height of\
    \ 200 pixels, and then translate it to the vertical center of the window by adding\
    \ this to the data point.\n\n> It may be better to show both stereo channels simultaneously,\
    \ or to average the two as the volume for each sound moment."
