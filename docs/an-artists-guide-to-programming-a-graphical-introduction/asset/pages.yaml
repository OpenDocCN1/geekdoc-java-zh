  md: '# # The Basics of a Programming Language: Processing


    When someone programs computers, they are really communicating with it. It is
    an imperative and precise communication. Imperative because the computer has no
    choice; it is being told what to do, and will do exactly. Because a computer does
    not apply any interpretation to what it is being told. Computers do not think
    and cannot evaluate a command that would "expose the item to a fatal dose of radiation"
    without any skepticism. So, as programmers, must be careful and precise in what
    we instruct the machine to do.


    When we communicate with each other, we use a language. Similarly, humans use
    languages to communicate with computers, but these languages are artificial (humans
