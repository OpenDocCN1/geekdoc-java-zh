  md: '# Sketch 40: Writing text to a File


    Computer programs use text to tell their users what is going on. Sometimes, as
    in the previous sketch, they use text to save the state of the program, often
    a game; sometimes the program writes numerical results or records the progress
    of a program. Text is a typical and natural way for computers to communicate with
    humans.


    Here''s the problem to be solved: we want to simulate a ball on the screen, moving
    at a constant speed, as was done in Sketch 28; write the position of the ball
    to a file during each frame; and when the ball collides with the edge of the screen.


    The output method that corresponds to saveStrings() is the function saveStrings().nWe
    declare an array of strings, where each string will be written as a line of text
    to the file. When a ball position is to be saved, a string is created that represents
    the position, and it is stored in one of the array locations. Then the array index
    is incremented so the next string goes in the next location


    ```

    data[index] = (x0,y0) = (""+x0+",""+y0+"");

    index = index+1;

    ```


    When the ball collides with a side of the screen, we put a message like "Collision
    left" in the array and then increment the index


    When the array is full, what happens when the index is greater than 499, saveStrings()
    writes all of the strings to a file and ends the program


    ```

    saveStrings("save.txt", data);

    ```


