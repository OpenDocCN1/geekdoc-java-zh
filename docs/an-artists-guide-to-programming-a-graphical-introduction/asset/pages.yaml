  md: '# Sketch 51: Basic 3D Objects


    We have been drawing only two-dimensional (2D) objects so far: lines, circles,
    triangles, rectangles, and images. Processing can draw three-dimensional (3D)
    objects too, although all that we can represent on a computer screen is a view
    of, a 2D projection onto a plane. This projection aspect what makes 3D more difficult.
    The x dimension is horizontal, and the y is vertical, and displaying those coordinates
    on a 2D screen is obvious. The third dimension, called z, would be perpendicular
    to the screen''s surface. In order to visualize it, the three coordinates must
    be reduced to two, which is what the projection does.


    Processing provides a 3D box (cube) and a sphere. In this sketch, we''ll draw
    these standard objects to show 3D works.


    To render 3D objects, Processing needs to use software that performs 3D drawing
    operations, called a 3D renderer. The default renderer, called P2D, handles only
    two dimensions. If we specify three dimensions, we provide the P3D renderer as
    argument to the size function within setup:


    ```

    size (300, 400, 300);

    ```


    Now all 3D operations are provided through functions, just as rectangles and ellipses
    are in 2D. Cubes and spheres are provided function sphere(R) draws a sphere with
    radius R at the origin.


    A sphere is drawn as a collection of triangles that have x-, y-, and z-coordinates
    at each vertex, oriented along the surface of the sphere and connected from edge
    to edge. Think of it as the 3D version of drawing a circle using many-connected
    short straight lines; it''s not exactly smooth, but if the triangles are small
    enough, the illusion works. The triangles will be visible unless outlines are
    turned off with noStroke().


    The box(s) function draws a cube where each side is s pixels long. To specify
    size in each direction, we use the second function of box: box(w, h, d).


    To draw each shape somewhere other than the origin, we first call the translate()
    function to move the origin to the location where the sphere is to be drawn. In
    3D, coordinates have three values: x, y, and z, and translate() has corresponding
    parameters.


    Finally, when drawing in three dimensions, we need illumination to create depth.
    To enable lighting, we call lights() in the draw() function. Without the call
    to lights(), the sphere on the left of the Output would just look like a circle.


    # Example A


    We draw two spheres: one with the triangles composing the sphere visible (right)
    and one with them hidden (using noStroke()), left. The spheres move away from
    the point of view and then back, showing the third dimension more clearly than
    if they were.


    # Example B


    We draw two cubes, again with the right one showing the cube outlines and with
    the left one not. The cubes also move away from the camera and then back again
    (along the z-axis).'
