  md: '# Sketch 62: Seeing the World Through a Window


    Many games, animations, and simulations (driving or space travel, example) use
    view through a window as a part of the interface. This sketch implements a window
    that looks out on a 3D scene and allows the user to move about that scene while
    looking through the window.


    This is a more advanced application of pGraphics. We''ll render a simple 3D scene
    to (the window) into a pGraphics instance named pg, read a 2D image with transparent
    sections (the window) into a pGraphics instance named g2, and draw the two graphics
    objects to the screen using calls to image().


    The 3D primitives we''ll use to draw the 3D scene are all part of pGraphics. We
    enable with a parameter to createGraphics() ❶ instead of size() in Sketch 51,
    and then we''ll set up the 3D parameters with calls to ➁ ambientLight(). The basic
    call to size() sets up the graphics window; each pGraphics instance like having
    a distinct window to draw in, and all of the usual graphics methods can be used
    by the dot notation: pg.line(), pg.ellipse(), and so on. No graphics object is
    visible unless drawn in the window. Thus we can create a simulated 3D space inside
    the object, drawing four cubes that there targets to be viewed through the window.


    The 2D portion involves displaying a 2D image (a PImage variable named that) represents
    the window (Figure 62-1). The GIF image has transparent sections, created by defining
    a color (in this case green) as transparent using an image editor like Photoshop.
    We will call this kind of image stencil.


    ![](img/7534641f255e2513226c900fd85d94f3_159_0.png)


    Figure 62-1: The stencil for the window


    The sketch draws the two images on the window, pg first (the 3D rendering) ③ followed
    by g2 (the stencil) ❹ The transparent parts of g2 allow the 3D scene to be seen
    through the window.


    The user can control the viewpoint for the 3D scene using the keyboard in the
    usual way ❺ The 3D scene changes as a consequence of the change in the viewpoint,
    but the 2D scene does not. The result is that the window stays in the same place
    but the view seen through it (the transparent portions) changes as a function
    of that viewpoint, as if the user were inside a moving vehicle looking at a scene
    outside.'
