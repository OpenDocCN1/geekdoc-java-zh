  md: '# Sketch 83: Processing Video in Real Time


    Some applications process or analyze a video frame by frame, and it is not necessary
    to see the result in real time. For example, it is possible to analyze a batter''s
    swing by capturing a video, enhancing relevant portions in each frame, and then
    putting the enhanced frames back video form. It is even possible, when the analysis
    of each frame does not require too much computational effort, to do the processing
    as the video is playing and see the result as the action is going on.


    In this sketch, the video that we used in the previous sketches will be converted
    to grayscale and then thresholded in real time, as we did in Sketch 23 for a small
    image.

    Recall that we can create a Movie object just like a P (which has the same local
    functions). We extract each pixel p in the movie image using `movie.loadPixels()`
    and calculate a brightness or grey level by averaging the color components: red(p)+green(p)/3.
    If this value is less than a threshold, the corresponding pixel in the display
    image is set to black; otherwise it is set to white. In this sketch, the threshold
    value is 100. The result is a video that displays only black and white pixels.


    The setup is the same as before, but we also create a image size of the video
    frame (named display) that will hold a processed copy of each frame as it is displayed.
    The `draw()` function reads a frame when it is drawn and then calls a local function
    to calculate a thresholded image. After thresh() has created a thresholded version
    of the movie image, both are displayed, one above the other, and both versions
    play simultaneously.


    The result in this case is impressive, but it does give an idea of what we could
    do. For example, if we choose the threshold carefully, it might be possible to
    show only the motion of the car in the scene, removing the background clutter.


    In other videos, we could locate faces, enhance and read license plates on moving
    cars, or inspect and count apples moving past the camera on a conveyor belt. These
    are problems in computer vision, and Processing is a good tool for building computer
    vision systems because of the ease with which it deals with images.


    A tool called SimpleOpenNI is available for download from https://code.google.com/p/simple-enni/.
    It allows Processing to communicate with Kinect devices, which in turn allows
    us to acquire 3D images in real time. Microsoft uses this to build computer games,
    but there are many other potential uses, like the computer vision problems just
    described.'
