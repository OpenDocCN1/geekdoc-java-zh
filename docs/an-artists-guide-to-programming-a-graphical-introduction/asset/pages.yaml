  md: '# Sketch 54: Bouncing Ball in 3D


    Sketch 28 was a simulation of a bouncing ball. A circle (ball) moved about a window,
    bouncing when it struck the boundary. An obvious extension of this into three
    dimensions has a sphere bouncing about the inside of a cube. When the sphere (ball)
    strikes one of the sides of the cube, it bounces. This is conceptually the same
    problem in two dimensions, but it requires quite a bit more code because there
    are more conditions to check and more things to draw.


    The scene consists of the cube and a sphere. The cube occupies most of the field
    of view, bounded by the coordinate axes. We''ll draw the coordinate axes in special
    colors to show the three primary directions: x will be green, y will be blue,
    and z will be red. Instead of calling box(), we''ll draw the cube as the 12 lines
    that compose the edges that we can see the ball inside.


    We''ll start the cube from the origin in the upper-left corner, followed by the
    remaining nine edges, using the cube() . To see if the ball has collided with
    a side, we''ll test the ball''s coordinates against the x, y, and z values of
    the bounding planes, which are aligned with the coordinate axes.


    We can still use the sphere() to draw the bouncing ball at position (x, y, z)
    using a translation of the origin to that point before drawing. After each frame,
    we move the ball by an amount (dx, dy, dz). If ball coordinates are such that
    the ball extends past any of the faces, then the ball—reuses the direction of
    motion to move away from the face. This is implemented by the move() function.
    For example, in the x-direction, this is the specific test for a bounce:


    ```

    if (x<6 || x>194) dx = -dx;

    ```


    This test is for a sphere size of 12, because it checks against the radius of
    6 pixels. A sphere of radius ris if the cube is in contact with its center within
    r pixels of a face, and r is half of the specified sphere size. Because the cube
    starts at (0, 0, 0) and is 200 units in each direction, the ball collides around
    x-coordinates 6 and 194.


    The center of the cube is at (100, 100, 100). This point is the center of the
    scene. We stare into the cube from the viewpoint at the (x, y) center, which is
    (100, 100), but along the z-axis 400 units.


    > NOTE

    A 3D version of the game Pong could be created from this basic program. Paddles
    could be small rectangles aligned to the opposite y-z axes. The left paddle could
    be moved with the W, A, S, and D keys, and the right paddle with the arrow keys.
    Bouncing off of the y-z planes would occur only if the sphere''s y and z-coordinates
    placed it within the rectangle defined by the paddle.'
