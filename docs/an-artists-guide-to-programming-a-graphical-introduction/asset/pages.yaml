  md: '# Sketch 73: Bouncing Ball with Sound Effects


    In movies, animations, theater, and computer games, a sound effect is (usually)
    a short piece of audio that indicates something has happened. A telephone ringing,
    the smack of a bat hitting a baseball, and the splash of a stone falling into
    a lake are all examples of sound effects. This sketch will illustrate the use
    of a sound effect in an in-simulation.


    Sketch 28 simulated a bouncing ball. It looks nice, but it would be better as
    an animation if a sound accompanied each bounce. Sound is an important cue to
    humans, and a sound effect lends realism to the graphics. It does not have to
    be accurate; it just has to be some click or bounce noise that corresponds to
    the event. With the code from Sketch 28, we''ll add an AudioPlayer object from
    the Mini library to play MP3 file when the ball strikes a side of the window.


    To create the sound effect, we will save the sound of a thumb (such as a bouncing
    on the floor or a cap being set on a table) using a PC microphone and a freely
    available sound editor/capture tool such as Audacity (https://audacity.org/) or
    GoldWave (https://www.goldwave.ca/). This sketch assumes the sound is saved as
    click.mp3.


    After the initialization of #init, an AudioPlayer (the variable player) reads
    the MP3 file. When the ball strikes a side of the window, as detected by the functions
    bounce() and younce(), the ball changes direction and we play the sound with a
    call to player.play()


    We have to rewind the sound each time it is played to make sure it starts from
    the beginning. The rewind() function within AudioPlayer does this.


    Four kinds of sound are normally used in animations and computer games: sound
    effects, music, ambient sound, and voice. Ambient sound is continuous, sometimes
    random sound from the background. The sound of rain falling, traffic, crowds,
    and water flowing are examples. Ambient sound, like music, starts at some particular
    point in the animation of a graphic and has a long duration, often repeating when
    it has finished. Human voice usually consists of individual sentences, each saved
    as a separate file. These play back as part of a narrative, sometimes in an undetermined
    order. The activity of a user can determine what voice snippet plays at a particular
    time. In that sense, it is like a sound effect, a short audio segment, but one
    that is not necessarily associated with the action.'
