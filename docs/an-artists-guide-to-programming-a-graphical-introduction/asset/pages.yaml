  md: '# Sketch 8: M/M/1 Queue—Time in Simulations


    A single-server queuing system, or M/M/1 queuing system, is like a bank teller.
    Customers arrive at random times to the teller for service. The service requires
    some amount of time, and then the customer departs. if the teller is busy with
    a customer when another one arrives, the new arrival waits in a queue or waiting
    line. When a departure occurs, the next customer in line is served; if there is
    no one in the queue, the teller (server) becomes idle. This system represents
    many well in real life: checkouts, gas stations, waiting for a bus, air traffic
    and ships arriving in a port.


    This sketches one server and one queue, which can be adapted to do more, and it
    calculates the average queue length. The value in doing a simulation of such a
    system is in finding out how long the queue becomes, how time a client spends
    in the queue, what percentage of the time the server is busy, and so on. All of
    this concerns us wasted time.


    In the real world, time is continuous, but on the computer, that is not possible.
    Instead, the time of the simulation takes discrete values: time = 0, time = 1.5,
    time = 3.99, and so on. When the simulation starts, we set the variable time to
    the time of the first arrival, and the time that after will be the time of the
    first event being processed. This is known as a next event simulation: the current
    time in the simulation keeps jumping ahead to the time of the next event (or departure)
    that occurs.


    Arrivals happen at random times according to a particular probability distribution.
    When an arrival happens, it (the customer) enters the queue for the service (teller).
    If there is no queue, it gets served immediately; otherwise it must wait. When
    it gets to the server (teller), it will require some amount of time to be served,
    and then it will leave. Here are the steps to handle each event:


    | Arrival | Departure |

    | 1. Place the arrival into the queue ⊕ | 1. Remove the job from the queue ⊕ |

    | 2. Is the server busy? | 2. Queue empty? |

    | 3. If not, start the server. | 3. If so, the server becomes idle. |

    | 4. Schedule the next arrival. | 4. If not, schedule a departure. |


    The queue is an array holding numbers. Adding to the queue means placing a new
    value (the randomly generated service time for the job) at the end of the queue.
    When a value departs the queue, it removes the first element and moving each consecutive
    value by one place. The function insert(t) ⊕ inserts t into the queue, whereas
    out() ⊕ removes the element from the queue. The queue is empty (or the system
    is idle) if there is nothing in the queue ⊕.


    The statistical distribution of times between arrivals and departures is according
    to the negative exponential distribution. If the average time between arrivals
    is μ, then this will be the time of the next arrival in the simulation:


    ```

    -μ * log(random(1))

    ```


    A similar situation exists for departures.'
