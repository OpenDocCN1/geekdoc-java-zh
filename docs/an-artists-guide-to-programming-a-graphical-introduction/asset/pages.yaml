  md: '# Sketch 56: Texture Mapping


    In Sketch 55 we gave each of a prism a distinct color to make it easy to identify
    each face. This was done as an exercise, but in most real applications, a prism
    would either be a single color or would have a texture placed on it. A texture
    is a pattern, often simply an image, that by which we can make a simple prism
    look like many things: a building, a book, a chair—anything with corners. This
    sketch applies a texture (carpet) to a polygon (a rectangle) and moves the viewport
    so that the 3D effect can be seen.


    Applying an image to a polygon is a process called texture mapping. The details
    of the algorithm are complex, but the idea is simple enough, and the way it is
    implemented in Processing fits nicely into the scheme already explained for drawing
    objects. In English, the process is as follows:


    +   1. Read in an image that will serve as the texture This will be a Page.

    2. Define the coordinates of a 3D polygon, possibly part of a bigger object.

    3. Map each of the four corners of the texture to a vertex of a bigger polygon;
    that is, if the polygon is a rectangle, decide which corners of the texture image
    will be placed over corners of the rectangle.

    4. Convert the coordinate mapping into calls to the vertex() function

    5. Bracket the vertex calls between beginShape() and endShape().

    6. Immediately after beginShape(), tell Processing which texture image to use
    by calling the built-in texture() function


    In this example, we use an image of carpet texture. As an orientation marker,
    a red rectangle is placed in the upper-left corner and a green one in the upper
    right. The texture image is 524 by 928 pixels. This is the coordinate mapping
    from texture to vertices, as shown in Figure 56-1:


    +   - Texture (0, 0) maps to polygon (0, 0, 0).

    - Texture (524, 0) maps to polygon (sx, 0, 0).

    - Texture (524, 928) maps to polygon (sx, sy, 0).

    - Texture (0, 928) maps to polygon (0, sy, 0).


    ![](img/7534641f255e2513226c900fd85d94f3_145_0.png)


    Figure 56-1: Mapping texture coordinates to a polygon'
