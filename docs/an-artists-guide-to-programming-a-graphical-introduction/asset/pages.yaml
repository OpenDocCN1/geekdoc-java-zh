  md: '# Sketch 6: Arrays—Drawing many Circles


    A variable can hold a value, such as a single number. If we want more values,
    we can use more variables. For example, to draw two circles, we could have two
    sets of coordinate variables, say x0, y0 and x1, y1, and we could draw the two
    circles with two calls:


    ```

    ellipse(x0, y0, 10);

    elipse(x1, y1, 10);

    ```


    But if we wanted to draw a circle every time the mouse button was clicked, and
    to draw where the cursor is on the screen? We don''t know how many circles to
    draw in advance, so we don''t want to keep track of x and y using Processing calls
    an array. An array is a collection of values all having the same type. The syntax
    for declaring an array is


    ```

    int x = new int[100];

    ```


    This declaration defines an array named x that can hold 100 integers. The phrase
    [int x] means "define a new array x," and the phrase new int[100] defines the
    size, where 100 could be replaced by any constant. The preceding declaration could
    be done in two parts:


    ```

    int x;

    x = new int[100];

    ```


    You access the values in the array using an index, a number that specifies which
    of the values you use, starting from 0: x[0] is the first element (value) in the
    array with index 0, x[1] is the second with index of 1, and so on to the last,
    x[99].


    The example uses two arrays, for x and one for y, and draws a circle at the coordinates
    where the mouse button is clicked (pressed and released). Initially each element
    in the x and y array is given the value -1 in setup(). This is called a sentinel
    value, and it indicates that there is no circle defined at index. The n variables
    have been defined, which is how many mouse clicks have been recorded; it starts
    at 0 and is incremented to the maximum number of circles MAXCIRCLES, a constant
    defined to 10. When the mouse button is released, the system calls mouseReleased()
    callback function ①, which saves the current value of the coordinates in x and
    y at the current position increments n by 1. If n equals MAXCIRCLES, it is reset
    to 0 ②, which means that new circles will be drawn over the earliest drawn. The
    old ones will, of course, be lost.


    The draw() function sets the background and then draws a circle at the mouse coordinates.
    Then all the elements of the x array are examined, and if the value of element[i]
    is greater than 0, a circle is drawn at x[i] ③ using this call:


    ```

    ellipse(x[i], y[i], 18);

    ```


    The constant value MAXCIRCLES is defined using a special property in its declaration:


    ```

    final int MAXCIRCLES = 100;

    ```


    The value of MAXCIRCLES can''t be changed anywhere in the program because it is
    final. (and x[] would be used to define the size of the two arrays


    ```

    int x[] = new int[MAXCIRCLES];

    ```'
