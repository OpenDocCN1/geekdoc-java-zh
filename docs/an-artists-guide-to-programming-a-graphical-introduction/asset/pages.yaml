  md: "# Sketch 43: The Class Object—Multiple Buttons\n\nThis sketch will create and\
    \ display three buttons, one for each color component: red, green, and blue. When\
    \ a button is clicked, the corresponding components of the background color will\
    \ change randomly.\n\nIf an application needs many buttons, the scheme presented\
    \ in Sketch 42 becomes awkward. When we want a type, like PImage or PFont, that\
    \ represents a button, so we can declare button variables or an array of buttons.\
    \ The new button type should contain within it all of the properties of a button\
    \ along with all the code, written as functions, that performs the legal button\
    \ operations.\n\nMaking a custom type with associated functions is done using\
    \ a feature called a class. A class is a way to enclose variables and functions\
    \ and give them a name. The button class would look like this:\n\n```\nclass button\
    \ {\n  your code here\n}\n```\n\nInside the braces, we declare the variables used\
    \ by the button: x, y, width, height, label, and so on. The functions drawButton()\
    \ and buttonArmed() go inside the class too, along with something called a constructor:\
    \ a function that is called automatically each new button (or, in general, a class\
    \ object) is created. The class statement and what follows inside the braces declares\
    \ the class as custom type, and when you declare a variable of that, you create\
    \ an instance, one specific object that has the class variables and functions\
    \ within it.\n\nA variable of class button is declared just like a PImage variable:\n\
    \n```\nbutton b1, b2, b3;\n```\n\nThe next step, as with PImage or PFont, is to\
    \ create an instance of the button class using new and assign it to:\n\n```\n\
    b1 = new button(100, 150, 90, 30, \"Button\");\n```\n\nWhen you use, Processing\
    \ calls the constructor for the class. The constructor accepts parameters, such\
    \ as position or size, and saves them for later use in drawing the button. The\
    \ constructor function has the same name as the class (in this case, button) and\
    \ has no type—it is not preceded by void or a type name. The constructor itself\
    \ has no return value, but the new operator will return a new instance of the\
    \ class. If you define more than one constructor, Processing calls the one that\
    \ matches the type and number of parameters given in the new statement. The constructor\
    \ then returns a new instance of the class. You can create as many instances as\
    \ your computer memory allows.\n\nYou access variables and functions in a class\
    \ variable using dot notation. For the class instance bred x is bred.x, and to\
    \ draw it, you would call bred.draw(). The main draw function will draw() for\
    \ each of the buttons, or they won't be displayed, and the mousePressed() function\
    \ in the main program must check each button to see if it was clicked (that is,\
    \ if the mouse cursor is inside the button) using the armed() function in each\
    \ button."
