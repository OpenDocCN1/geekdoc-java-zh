  md: '# Sketch 50: Client/Server Communication


    A lot of computer network communication is based on what is called a client/server
    model. It could just as easily be a listener/speaker or receiver/sender model
    because it amounts to having one computer or processing information across a network
    (the server) and another computer, or many other computers, receiving that data
    (the clients).


    Here''s how client/server software should work. A server first announces to the
    world that it is active and sending data. It must have an address to be used uniquely,
    and it must start sending data (bytes, for example). A client identifies that
    it wishes to collect data from by using the server''s address. If the address
    represents an active server, the client starts to read data from the server. The
    server must indicate when data is available, and if data is requested and none
    has been sent, the client waits until data is present.


    This example has a server sending character data and a client receiving and displaying
    the data, implemented as two different sketches. The server sends "This is a message
    from J Parker"; the client reads characters from the server, constructs a string
    from them, and displays this string in the display window.


    Processing does not have a native ability to build client/server systems, but
    a library that exists for that. Processing uses external libraries for many things,
    including video, audio, and various specific interfaces of both. For this example,
    we need to import the Network library at both the client and server sketches using
    this line:


    ```

    import processing.net;

    ```


    In the server code, the first step is to create a Server (part of the Network
    library) and assign it to the variable named sender, and then specify the port
    (in this case, port 5000), which is simply a number. A port is like a television
    channel, used to send or receive data, and all that matters is that no other software
    is using this port. The server sends characters one at a time from a sender to
    the outside world through the port by calling the write function


    ```

    sender = new Server(this, 5000);

    --snip--

    sender.write(nextChar);

    ```


    nextChar is a character from the message.

    The client first tries to connect to the server. The client must know the IP address
    of the server, which is its unique identifier (***, ***, ***) in this case). The
    client connects to the server through the constructor using the same port


    ```

    me = new Client(this, "***, ***, ****", 5000);

    ```


    The client reads characters, one at a time, using the readChar() function


    ```

    nextChar = (char)me.readChar();

    ```


    In this example, you have to start the server first and find out its IP address.
    You can use the ipconfig on the computer where you are running the server sketch
    to find the IP address. Then you can connect the client on any other computer
    on your network.


    > The address *** *** *** *** was used to avoid publishing a real address.'
