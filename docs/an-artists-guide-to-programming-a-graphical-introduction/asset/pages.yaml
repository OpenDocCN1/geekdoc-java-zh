  md: '# Sketch 45: A Gauge Display


    The obvious way for a computer to display a numeric result is to simply display
    the number, but sometimes a more analog approach is easier for people to deal
    with. Some people like digital clocks, and some prefer the old kind with hands.
    The analog display can be faster for a human to process. A common kind of display
    is a gauge, where a pointer of some kind rotates and points to a number. Most
    older speedometers are displays of this type, for example: Figure 45-1 illustrates
    a gauge as a graphic and shows a simple abstraction of the situation.


    ![](img/7534641f255e2513226c900fd85d94f3_119_0.png)


    Figure 45-1: A gauge showing a value O (left), and the angles that are involved
    in the display (right)


    A gauge can display values between a minimum and a maximum numeric value. The
    minimum value corresponds to the minimum angle the pointer can have (labeled $\alpha$
    in the figure), and the maximum value corresponds to the maximum angle the pointer
    can have (labeled $\beta$). In this sketch, angles map directly onto values so
    that a difference of one degree represents the same amount of change. To display
    a value, we calculate the angle that corresponds to that value, named theta in
    the sketch, and draw the pointer at that angle.


    One way to look at this is as a slider that is shaped like a curve. Although the
    gauge is only a display, the mathematics of where to place the pointer is the
    same as for a slider, we use angles instead of straight-line distances, and it
    is reorganized to provide a value for the position. Figure 45-2 shows how the
    slider converts into what we need for a gauge, and shows the formula for finding
    where to draw the pointer. This formula is really the same as the one we used
    for the slider.


    ![](img/7534641f255e2513226c900fd85d94f3_119_1.png)


    $$\Theta pos = (\beta - \alpha) \frac{v - dataMin}{dataMax - dataMin} + \alpha$


    Figure 45-2: The gauge is like a bent slider. The equation shown here determines
    a position value (angle) given a numerical value, but it is otherwise the same
    as the one we used for the slider.'
