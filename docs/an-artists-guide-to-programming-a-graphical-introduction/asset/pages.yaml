  md: '# Sketch 34: Fonts, Sizes, Character Properties


    When text is drawn on the screen, there are many ways to draw each character.
    The size, weight, orientation, and style can vary widely. A font specifies a particular
    size, weight, and style of a typeface. Fonts are saved as files that contain the
    instructions for drawing each character. Bold, italic, normal, and each important
    size are individual files. The font name, a style, and a size are frequently part
    of the filename.


    Processing many fonts, but one must be set up in a file using the Tools menu,
    which you can choose the font name, style, and size, as shown in Figure 34-1.


    ![](img/7534641f255e2513226c900fd85d94f3_95_0.png)


    Figure 34-1: Setting up a font


    Select CourierNewPS-BoldMT with size 48 and click OK to create a file named CourierNewPS-BoldMT-48.v
    inside a local directory named data. You can repeat this process as often as needed,
    creating many files. You need fonts in order to load and use fonts in Processing.


    Using a font is somewhat involved process. You need to first create a variable
    of type pFont (Processing font) for each font desired, and then load the font
    using the loadFont() function:


    ```

    pFont font1;

    font1 = loadFont("CourierNewPS-BoldMT-48.vlw");

    ```


    To establish a font for the use, call''() with the font variable and the desired
    size: textSize(font1, 48). The size is specified in pixels, not the standard for
    a font, which is points. Finally, you can always change the font size by calling
    textSize(size)


    This sketch loads the Courier Bold 48 font and establishes it. Then it draws the
    string "Hello" in sizes varying from 2 pixels to 55 pixels, changing by one pixel
    size each time draw() is called.'
