  md: '# Sketch 97: Lightning


    Lightning moves quickly, randomly, and brightly. It would seem to be a difficult
    thing to capture in a computer graphic sense, and yet because it is in everyone''s
    experience, there are situations where it would be important to draw lightning.
    The sketch is a basic attempt to do that.


    As was the situation with the auroral simulation of Sketch 91, there is a history
    and literature on the subject of drawing lightning, and a lot of it is based on
    an effort to model the physical process by which lightning occurs in the real
    world. This is too complex to reproduce in a small program, but some of the fruits
    of that can be useful. Researchers have measured the angle between a stroke of
    lightning and a branch, for instance (about 16 degrees), and also the likelihood
    of branch.


    This sketch will generate lightning shapes as small, connected line segments.
    The length of the segment and the angle from the previous one will be random.
    The main part is a various segments in the first part of the main and branching
    parts: a line segment with starting point x[i] and y[i] connected to endpoint
    point x[i+1], y[i+1] for i=0 to 0. A branch will occur at random, with probability
    0.2, and it will occupy another row of the array, first branch starting at x[0],
    y[1], the second at x[2], y[0], and so on.


    A branch can also terminate, with probability 0.2, but the main branch cannot.
    It will continue until it reaches a value greater than 205, or it terminates.
    A new lightning stroke will occur, at a random time and x location.


    Each time draw() is called, a new section of stroke is created and drawn, so the
    lightning is a dynamic display. It appears to descend from the top of the image
    down to the ground, or to the water in this case: a background image of a storm
    at sea is displayed, and the lightning strokes start in the clouds and strike
    the water.


    This scheme has some flaws. Sometimes, at random, strokes can appear in what a
    human would consider an unrealistic branch. Branches can pass over each other,
    sometimes more than once. This could occur in real life, but it does not happen
    very often. Lightning path usually has a surrounding glow, too, and this is missing
    from the sketch. Lightning is a source of illumination and would alter the ambient
    light in the scene. It is possible to reproduce this effect, but using a static
    image as the background makes it difficult to change the illumination. Finally,
    we added the lightning strokes iteratively, and once they are determined to a
    specific point, do not change. Lightning paths have been seen to move along their
    length, not just at the lower end, but the effect is subtle.


    The code offers chances for experimentation. We can alter the probabilities of
    the creation of a new branch or of an existing one being deleted. The length of
    each section, now random between 0 and 12, and the angle, random between -30 and
    +30 degrees, can also have a significant visual impact on the result.'
