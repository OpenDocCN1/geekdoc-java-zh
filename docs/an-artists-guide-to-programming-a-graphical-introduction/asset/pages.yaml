  md: '# Sketch 9: Nim


    Nim is a game so old that its origins are lost to history. It was likely invented
    in China, and it is one of the oldest games known. It was also one of the first
    games to have a computer or electronic implementation and has been the frequent
    array of assignments in computer programming classes. The game starts with three
    rows of objects, such as matches or coins, and there are a different number of
    objects in each row. A player may remove many objects from one row as they choose,
    they must remove at least one and must take them only from one row. Players take
    turns removing objects, and the player taking the final one is the winner.


    This sketch will implement the game using 9, 7 and 5 coins, and it will play one
    itself.

    Setting the stage for the game involves reading an image for the object, in this
    case a penny, and drawing the correct number of coins in the window. When the
    player clicks the mouse over one of the coins, and all of coins to the left are
    removed, and the remaining ones will move. Then the computer will remove some
    coins.


    There are three 100 pixels apart, so when the player clicks the mouse, the row
    index is simply i = (mouse/100)-1. The number of coins removed is the number of
    coins to the left, in which the case of the sketch is j = (mouseX-10)/45+1 because
    we draw them 45 pixels apart, identified from the 10 left. An array named val
    contains the number of coins in each row, when the user clicks the mouse, this
    is the


    ```

    val[i] = val[i] - j;

    ```


    This reduces the number of coins in row (mouseY/100-1) by (mouseX-10)/45+1.

    Then it is the computer''s turn. There is a strategy that will permit the computer
    to almost always win, as long as the player makes the first move. It involves
    computing a parity value and making a move to ensure that we maintain that parity
    value. Consider the initial state and the state after taking two coins from row
    1:


    | Before After |

    | Row 1 | 5=0 1 0 1 3=0 0 1 1 |

    | Row 2 | 7=0 1 1 1 |

    | Row 3 | 9=1 0 0 1 9=1 0 0 1 |

    | Parity | 0 1 1 1 1 0 |


    The parity is determined by looking at each digit in the binary representation
    of the values. In each column, the parity bit for column is 1 if the number of
    bits in the column is odd and 0 if it is even. We can calculate this using the
    exclusive OR operation, which is Processing as "^", like so: val[0]^val[1]^val[2].


    The strategy in Nim is to make a move that makes the parity value 0. It turns
    out that this is always possible; in the preceding situation, the computer might
    remove 5 coins from row 3 giving this state:


    | Row 1 | 3=0 0 1 1 |

    | Row 2 | 7=0 1 1 1 |

    | Row 3 | 4=0 1 0 0 |

    | Parity | 0 0 0 0 |


    This is what the sketch does after every move the player makes: computes the parity
    of all possible moves until it finds one with 0 parity.'
