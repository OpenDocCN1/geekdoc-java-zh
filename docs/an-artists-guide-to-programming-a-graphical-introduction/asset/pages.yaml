  md: '# Sketch 31: Animation—Generating TV Static


    We have used random numbers before, in Sketches 8 and 30. Random numbers serve
    a few important functions in games, simulations, and other software:


    +   * Nature uses unpredictable forms and shapes. Placing trees in a forest in
    a two-dimensional grid is a giveaway that there was a mind in the planting. This
    does not happen in nature. Instead, trees in a forest have an average distance
    from the same manner and otherwise to perform a random collection.

    * Intelligent creatures do not behave predictably. Cars on a freeway that all
    behave in the same manner look very old. Cars have distances from each other,
    random speeds, and random behaviors within a possible range.

    * When playing poker or craps, the cards and dice ought to display random values,
    or the game is simply no fun.


    This sketch draws a television that looks as if it were tuned to a vacant channel.
    What is seen on the screen used to be called snow, and it is really created by
    random voltages from signals received from space and various local electronic
    and electrical devices. We cannot predict what the TV will receive at any particular
    moment, so we draw a 2D set of random grey pixels. This set of values changes
    every time the screen updates. There is an impression of random motion, rapid
    flashing of spots on the screen, but no organized images.


    First, we display a background image of a TV set ① and then set the pixels within
    the screen section to random black/white values each time draw() is called ②.


    ```

    if (random(3)<1) set (i, j, BLACK);

    else set (i, j, WHITE);

    ```


    To make it appear as though a channel were poorly tuned in, we could display an
    image faintly over the static by setting the alpha for the image to a low value,
    perhaps 30 or so. The static would be visible through the image. The tint() function
    changes the color and transparency of whatever is drawn then on, so we could use
    it to change the transparency of the channel image, as follows:


    ```

    tint(255, 255, 255, 127);

    image(back, 49, 49);

    ```


    The parameters to tint() are color coordinates, the first three being RGB and
    the fourth transparency (alpha). In the preceding example, the color is white
    (no actual tint) but the transparency is 127, which is half transparent.


    In the code for this sketch, the tint and TV image are commented out. To see the
    image, remove the comment characters from those two lines ➲.'
