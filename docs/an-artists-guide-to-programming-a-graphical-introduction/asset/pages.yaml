  md: '# Sketch 86: Displaying a Clock


    Time in a computer program can mean many things. There is execution time, the
    number of CPU cycles used by a program to a particular point. There is process
    time, or the amount of time that a program has been active. There is real time,
    which is the time on your watch. We can also call clock time. This sketch will
    acquire the clock time from the computer system and display it as the hands of
    a traditional clock.


    Getting the time of day from Processing is easy. These are the basic functions:


    +   hour(): Returns the current hour in the day using a 24-hour clock

    minute(): Returns the number of minutes past the hour.

    second(): Returns the number of seconds into the current minute.


    The clock will be a circle, and there will be three linear indicators (hands):
    a second hand, a minute hand, and an hour hand. Since there are 60 seconds in
    a minute, the second hand will rotate around its center point by 360/60, or 6
    degrees each second. The same is true of the minute hand; since there are 60 seconds
    per minute and 60 minutes in an hour, it rotates 6 degrees per minute. The origin
    for drawing the second hand is the clock''s center, but the other endpoint is
    not known, only the angle. If the length of the second hand is r, then the second
    point can be determined with trigonometry, as seen in Figure 86-1.


    ![](img/7534641f255e2513226c900fd85d94f3_213_0.png)


    Figure 86-1: Determining the position of a clock hand


    The angle defined by Processing is not the same as that for a clock. On a clock,
    vertical represents 0, whereas in Processing that is -90 degrees. Drawing the
    second hand with (cx, cy) as the center point and with a length of r would be
    done as follows, where the variable s is the number of seconds ❶:


    ```

    s = radians(second())*6 - 90.0;

    line(cx, cy, cx+cos(s)*r, cy+sin(s)*r);

    ```


    The same scheme works for the minute hand, which is shorter. The hour hand should
    be shorter still, and the hour() value is divided by 2 if it exists 12. Also,
    there are only 12 hours in the 360-degree cycle, not 60, so each hour amounts
    to 30 degrees. The hour hand moves continuously around the face and does not jump
    when the hand changes, so each minute that should pass the hour hand a little
    bit; 30 degrees (1 hour) is 60 minutes, so each minute moves the hour hand by
    0.5 degrees ❷ This is the code:


    ```

    h = radians(hour()*30.0-90.0) + radians(minute()*0.5);

    ```'
