    \ They can't type, and they can't enter code. So, in the scenes where the camera\
    \ is looking over the main character's shoulder at the screen we need a special\
    \ effect—something that makes appear as if she's coding. Do we use computer animation?\
    \ That can be expensive. The usual trick is to use a simple program that displays\
    \ text, specific text, no matter what keys are struck. That way the actors don't\
    \ have to know anything how to press a key.\n\nMaking this program in Processing\
    \ is straightforward, given what we know so for. The program opens and initializes\
    \ a message, the text to be typed onto the screen ① could be read from a file.\
    \ A variable N starts as 0 and initializes the string; each character to N has\
    \ been typed and should appear on the screen. The draw() function draws all of\
    \ characters to N each time it is called, one character at a time, spacing them\
    \ nine pixels apart.\n\nTo organize the text lines, we use the \" character to\
    \ indicate where lines end. When the program sees that character in the string,\
    \ it doesn't display it, but instead resets the x position to the starting value\
    \ and increases the y position by 15 pixels (one line).\n\nThe draw() function\
    \ outputs the text, starting at the statement ②\n\n```\nfor (int i=0; i<N; i++)\
    \ // display the next character\n```\n\nEither displays one of the characters\
    \ in the string ③ or or the character in the string is \"!\" and it begins a new\
    \ line\n\n```\ntext(\"message.charAt(i), x, y);\nx = x + 10;\n\nif (message.charAt(i)\
    \ == '!')\n{\n  y = y + 15; // Move vertically down to next line\n  x = 15; //\
    \ and start at pixel 15.\n}\n```\n\nFinally, when a key is pressed, as indicated\
