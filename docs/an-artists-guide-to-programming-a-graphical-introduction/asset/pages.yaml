  md: '# Sketch 64: Splines—Drawing Curves


    So far, we''ve rendered simple geometric objects like lines, ellipses, rectangles,
    and spheres using predefined Processing functions. But many real-world objects
    are not linear or elliptical; they have complex shapes. Examples are legion, including
    fan blades, jewelry, clothing, and living things—even graphs of data. To demonstrate,
    this sketch allows the user to draw curves using a series of mouse clicks and
    to see how the selected ''control points'' affect the curves.


    Using splines to render curves. In the earlier days of drafting, people used pencils
    and T-squares, people used something called a spline to draw smooth, oddly shapes.
    It was a long, flexible metal strip that could hold a shape, align with points
    on paper, and allow the drafter to connect them using a pencil. Mathematically,
    a spline is a polynomial function that approximates a curve by using a set of
    points. The details can be complex, but the idea is to use many polynomials connected
    end to end to build the curve. Processing hides the complexity.


    Processing provides a function curve() that implements a type of polynomial named
    the Catmull-Rom spline. This function uses four points to define each section
    of the curve. The first two define the direction the curve will have at the beginning,
    and the second two define the direction it will have at the end. The curve itself
    consists of a set of points (pixels) between the middle two points. As seen in
    Figure 64-1, the angle defined by the first two points establishes the direction
    of the curve at P1, which defines the shape of the polygon between P2 by the direction
    between P2 and P3. In the figure, the points P1 and P2 in the two examples are
    the same, but the curves have a different shape due to the different positions
    of P0 and P3.


    ![](img/7534641f255e2513226c900fd85d94f3_163_0.png)


    Figure 64-1: Control points of a spline curve


    This is the function called in Processing to draw a curve section between P1=(x1,y1)
    and P2=(x2,y2);


    ```

    curve(x0,y0, x1,y1, x2,y2, x3,y3);

    ```


    The start and end points, (x0,y0) and (x3,y3), to control the shape. To draw a
    longer curve, we need multiple calls to curve(), with the endpoints of one being
    the beginning of the next.


    This sketch allows the user to select points, drawn as red lines using mouse clicks,
    and to observe the shape change caused by the position of the next point as the
    mouse moves. Four points define a curve, so when the user selects the fourth point,
    a red curve is drawn using the points specified, and then a blue curve that changes
    as the mouse is drawn from the final point to the mouse position (mouse,mouse).
    Clicking again will add a new point to the curve, extending the red portion to
    include the new point and'
