  md: "We need to understand that 0 degrees is horizontal, and we convert the starting\
    \ (α) and ending (β) angles they are relative to 0. Starting at α, we decrease\
    \ the angle of the pointer as the value increases towards the maximum. If α is\
    \ 140, then β should be -45 rather than the equivalent angle, 315, so that β <\
    \ α.\n\nThe gauge() draws the pointer at the angle specified by the equation in\
    \ Figure 45-2 given a value, v. Don't forget that angles in Processing need to\
    \ be given as radians, so pos has to be converted from degrees.\n\n```\nint val\
    \ = 0;\nint dv = -1;\nint count = 0;\nfloat dctr = 180.0/3.14159;\nimage backgroundImage;\
    \ // Rendered gauge\nint dataMin=0,dataMax=100;\nfloat alpha=230, beta=-40;\n\
