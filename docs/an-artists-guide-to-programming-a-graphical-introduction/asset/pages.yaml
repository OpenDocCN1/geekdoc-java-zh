  md: "# Sketch 52: 3D Geometry—Viewpoints, Projections\n\n3D objects are really simulations\
    \ in which the edges and faces have locations in virtual space having three coordinates.\
    \ Because computer screens are 2D, visualizing these objects means projecting\
    \ them onto a plane so they can be drawn on a screen.\n plane lies between the\
    \ object and the location from which the object is being seen, or the viewpoint.\
    \ The viewpoint is a location in 3D space, marked by an eye in Figure 52-1. (2D\
    \ scenes don't really have a viewpoint; the entire image is a plane in the first\
    \ place.)\n\n![](img/7534641f255e2513226c900fd85d94f3_137_0.png)\n\nFigure 52-1:\
    \ Viewing a 3D object\n\nThere is a second crucial point for defining how a 3D\
    \ view appears, and that is the location where the viewer (camera) is looking.\
    \ This is the center of the scene, denoted by (cx, cy, cz). The plane on which\
    \ the 3D scene is projected to the line between (ex, ey, ez) and (cx, cy, cz),\
    \ and precisely what can be depends on the field of view, or the angle of the\
    \ visible field, what determines can be seen without moving the camera.\n\nIn\
    \ Processing, we use a call to camera() ① to set up the basic 3D configuration:\n\
    \n```\ncamera(ex, ey, ez, cx, cy, cz, 0, 1, 0);\n```\n\nThe first three parameters\
    \ are the viewpoint, and the next three are the center of the scene. The last\
    \ three represent a vector that defines the direction up so that the scene is\
    \ oriented correctly. In this example, up is the positive y-direction. It is a\
    \ choice made by the programmer.\nThis sketch uses the camera() function to change\
    \ the view of a pair of 3D objects according to user key presses. We move the\
    \ location of the viewpoint by incrementing or decreasing the values of ex and\
    \ ez inside the keyPressed() ② the key pressed: A decreases x (moves left), D\
    \ increases x (moves right), W decreases z, and S increases z (the distance to\
    \ the objects). This is the equivalent of moving the player in a video game. The\
    \ sphere is drawn at (cx, cy, cz) so that it is guaranteed to be visible at the\
    \ outset. To move the center of the scene away from the sphere, we can change\
    \ the value of cy with the up and down arrow keys. You can see the effect of changing\
    \ the viewpoint and the center of the scene by experimenting with them using the\
    \ keyboard."
