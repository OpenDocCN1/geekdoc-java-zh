  md: '# Sketch 57: Billboards—Simulating a Tree


    Let''s draw a tree in three dimensions. A prism is a simple thing, but a tree
    has many leaves, branches, bark, and myriad details. Graphics specialists have
    devised very complex methods to create things like trees, mountains, and living
    things, but in most cases, it is not necessary to go to that. For artwork, animations,
    and games, there are ways to simplify things (to "cheat") so that they look pretty
    good while being easy to implement. Building a tree as a billboard is one of those
    things.


    In its simplest form, a billboard is a rectangle with a texture drawn on it. It
    resembles the kind of billboard you can see while driving tourist highways, and
    in computer graphics, it would normally occur only at a large distance from the
    viewer. To make a tree, we use two billboards at right angles to each other, joined
    at the vertical center of each. Each one is a rectangle with a tree textured onto
    it. From any angle one sees the tree, and moving the viewpoint appears to change
    the view of tree. From close up it is happening, when seen from a medium distance
    or while the viewer is moving, the illusion is a good one.


    Figure 57-1 shows how we arrange the two perpendicular rectangles in three dimensions.
    The texture placed on them needs to have a transparent background, or the white
    rectangles will be visible. This means using either a GIF or PNG image file, which
    are the ones that support transparency.


    ![](img/7534641f255e2513226c900fd85d94f3_147_0.png)


    Figure 57-1: Two perpendicular rectangles


    The sketch first reads in the tree image that we''ll use as a texture and opens
    the window, as usual. The draw() function sets up the camera and draws two rectangles
    at the origin, both using the tree as a texture that we map onto the rectangles
    to what was done in Sketch 56. We rotate the second texture-mapped rectangle by
    90 degrees and translate it by 13 units in the x and z directions to align it
    with the center of the first rectangle. (The rectangle is 26 units wide, and 13
    units is half of that.)


    We also change the viewpoint slightly in each frame so that the 3D effect is obvious
    when the sketch is exciting.


    > Use of billboards can be more interesting and dynamic than this. Imagine that
    we need a burning torch. We could make a set of animation frames of a burning
    torch using Paint and map them onto the billboard in sequence. The result is a
    convincing representation of a burning torch, especially if the background is
    otherwise dark.'
