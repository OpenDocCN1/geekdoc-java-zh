  md: '# Sketch 81: Playing a Video with a Jog Wheel


    A jog wheel (or shuttle wheel) is a device, often circular, that allows the user
    to advance or back a video. Turning clockwise moves the video forward by individual
    frames, turning it counterclockwise moves the video backward. Editors often use
    this for editing the video needs to be positioned by frame. This sketch will implement
    an approximation of this jogging process. The video will begin to play, and the
    user can adjust the speed and direction of play using the mouse. At any point,
    the user can stop the video and play back up slowly to arrive at any specific
    frame.


    To do this we address the problem of how to play a video backward. The jump()
    function permits the positioning of the video at any moment in time. The time
    of any particular frame depends on the frame rate, which is the number of frames
    per second. Given a frame rate, we know that each frame lasts 1/rate seconds.
    The final frame occurs at duration()seconds from the start, so positioning at
    the frame before can be done with the following:


    ```

    movie.jump(movie.duration-(1/rate))

    ```


    The frame before that is at (movie.duration-(1/rate)*2) and so on. Simply step
    backward through the frames in this way, read the frame, and display it.

    In the sketch, we store the time of the current frame in a variable, and the time
    between frames is in the variable ftime. We will use the mouse to control the
    speed with which the video will be displayed. A mouse click in the middle of the
    screen sets the speed to 0 by setting ftime to 0. A click on the right sets ftime
    to a value in proportion to the distance from the middle, and it moves the video
    forward; a click on the left sets ftime to a value that moves the video backward.
    Initially ftime = 1/rate, but this becomes -3 times for a far left click and +3
    times for a far right click. This is the whole calculation 2:


    ```

    ftime = 3*((Float)(width/2 - mouseX)/(width/2));/rate;

    ```


    A minor problem occurs at the end of the video, which is really the beginning
    if it is playing in reverse. Time is set to 0 if the end is found while moving
    forward, and it is set to duration()-ftime if the end is found while moving backward.

    The basic display process 1 occurs within draw() and is as follows:


    ```

    if (movie.available()) movie.read(); // Read a frame if one is there

    image(movie,0,0);                               // Display it

    time = time - ftime;                            // Advance/retard the time value

    movie.jump(time);                               // Set frame to the one at that
    time

    ```


    The sketch displays a simple calculation to allow the user to select a speed,
    and it also displays the value of ftime.'
