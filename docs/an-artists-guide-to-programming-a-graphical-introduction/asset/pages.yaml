  md: '# Sketch 17: Manipulating Images—Magnifier


    Some computers have a "magnifying glass" object that is controlled by the mouse
    and displays a close-up (magnified) view of a part of the screen. It allows people
    with a minor visual impairment to see things more clearly, and it allows everyone
    to get a better-look at menus and other screen-based objects.


    Magnification is done by increasing the size of each pixel in the original image.
    If each pixel in the original becomes four pixels (in a square) in the new image,
    then the size of the new image will be double that of the original, giving the
    appearance of a magnified version, as shown in Figure 17-1. The image will contain
    no more detail than the original; it will just be easier to see.


    ![](img/7534641f255e2513226c900fd85d94f3_57_0.png)


    Figure 17-1: Magnifying an image


    Implementing a magnifying glass is a simple matter using the functions that Processing
    provides. First we display the target image and use the techniques discussed in
    previous sketches to select a rectangular region in the sketch window to magnify.
    By pressing the mouse button, the user selects a square beginning at the mouse
    coordinates with a size of 50×50. The functions mousePressed() and mouseReleased()
    are called when the button is pressed and released, and we use these functions
    to set a flag variable named mag. If mag is set, we copy the selected part of
    the original image into another Image named sub using the get() function. The
    copied image is resized to 100×100 pixels using the resize():


    ```

    sub.resize(100,100);

    ```


    Taking a 50×50 image and making it 100×100 effectively doubles its size. The resized
    image is drawn on the screen at the location from which it was copied, or the
    new image is larger than the extracted one, so the new position is appropriate,
    and some pixels from the original will be hidden behind the new, larger copy.'
