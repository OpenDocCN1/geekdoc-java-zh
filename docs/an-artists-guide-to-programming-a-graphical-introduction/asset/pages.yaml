  md: '# Sketch 14: Images—Theory and Practice


    Images are used often in the visual arts, and Processing was designed for artists,
    so it''s no surprise that images are pretty easy to use in the program. There
    are some basic things you need to know, though.


    One is for an image to be used on a computer, it must be digitized; that is, it
    must be turned into numbers. If an image was not created by a computer in the
    first place, then it has to be scanned or photographed, and each location on the
    original image must be a number indicating the color seen there. The result is
    a two-dimensional array of numbers, each small area of image is considered to
    be uniform in color, even if the most prominent color is selected to represent
    the entire area. This color is stored at the (x, y) location in the internal representation,
    and it''s called a picture element, or pixel for short. The complete collection
    of these pixels is an approximation of the original image. Drawing an image on
    screen means the pixels on a portion of the computer screen to match those in
    the image. This is what the image() function does.


    Images are most often thought of being Nx×M in size, where N is the number of
    rows and M is the number of columns. The total number of pixels in an image is
    Nx×M.


    The pixel data types offer programmers a variety of ways to access the pixels
    in an image and manipulate them. Properties of an image can be accessed using
    ". (dot) notation. For a pixel variable named image, for example, we have the
    following properties:


    ```

    image.width  // Width of the image, in pixels

    image.height // Height of the image, in pixels

    ```


    We wish to create a graphics area that is the same size as a particular image,
    but the size() function can only use constants to set the window size. To get
    around this, we can add surface. setResizable(true) to setup(). It lets us resize
    the graphics area while the sketch is running with a call to surface.setSize(),
    which we can use non-constants like image.width.


    Individual values can be accessed using functions that return or set colors based
    on (x, y) coordinates:


    ```

    image.get(x,y);               // Returns the color of the pixel at column x and
    row y

    image.set(x,y,color(255,0,0)) // Sets the pixel at (x,y) to return

    ```


    If we simply call get() or set() with no image specified, Processing assumes that
    the image intended is whatever is being displayed in the sketch window; if not,
    the program ends by calling the function name exit(). The loadImage() function
    returns a special value null if the image could not be read, so that can be used
    as an indicator that the image file, for example, was not found. If the image
    is okay, the program sets the size of the window to be the same size as that image,
    using the image''s width and height properties. When the setup() function displays
    the image, it will fill the entire window.


    # Example A


    The second sketch does not call exit() if the image file cannot be opened. Instead,
    it displays an error message in the graphics window'
