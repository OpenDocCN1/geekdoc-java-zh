  md: '# Sketch 76: Controlling a Graphic with Sound


    PC-based music players frequently offer a set of visualizers that present abstract
    images that change in coordination with the music, as shown in Figure 76-1. Sketch
    75 is a visualizer that displays the actual signal, which can be useful for signal
    analysis and editing, but the purpose of music player visualizations is to entertain
    by presenting interesting images. This sketch represents one attempt to implement
    such a visualizer.


    ![](img/7534641f255e2513226c900fd85d94f3_189_0.png)


    Figure 76-1: An example visualizer


    There are many ways to control images using music, but the underlying idea is
    to pull numbers from the sound data and use them as parameters to some graphical
    model so the display reacts to the actual sound. Beyond the raw sound data points
    described in the previous sketch, we want to measure values that indicate changes
    in the sound so the display is dynamic. The difference between two consecutive
    values is one measure. These numbers would need to be similar to each other, two
    values at a fixed time from each other might give a better range of numbers. Another
    idea would be to use the difference between the left and right channels. More
    complicated measurements include the difference between a data value and the average
    for a short time or the difference between the maximum and minimum values over
    a time period.


    Once we decide which measurements to use, what will we use the values for this?
    This depends on the visual effect we desire. They could represent x, positions,
    colors, speed, or even shape parameters.


    This sketch will use ellipses as the basis for the display. The data from the
    left and right channels of the current buffer will increase the width and height
    parameters of an ellipse to be drawn at the center of the screen. The size of
    the ellipse will increase by five pixels for each frame, so it will grow from
    the center outwards. The color of the ellipse will be related to the difference
    between the current left data value and the corresponding left data value from
    the previous buffer. This means a color for a function of variation over time.
    By drawing each ellipse with a transparency (alpha) value of 30, we can make the
    colors blend into each other. Using transparency, we should display the largest
    ellipses first, and then smaller ones, or the smaller will be overwhelmed by ones
    drawn above them. We must maintain a set of parameters for these ellipses that
    we can display all of them correctly each iteration, and by saving them in a set
    of arrays: colors, hsize, and vsize for the ellipse color and size.'
