  md: '# Sketch 72: Displaying a Sound''s Volume


    Sketch 71 does not have a very interesting display. Its display is auditory, while
    that is in keeping with its primary function, the Processing language usually
    creates more graphical output. One obvious way to accomplish this is to display
    the volume of a sound visually, as numbers on a dial or, in this sketch, the height
    of vertical bars.


    To make this sketch, we must get numerical values for the sound that we read from
    the file. The AudioInput component class of Minim allows a connection to the current
    record source for the computer. For this sketch to function properly, the user
    needs to set the source device to monitor the sound as it plays. For example,
    if the sound input is a file, we could use this code:


    ```

    player = minim.loadFile("song.mp3");

    ```


    Assuming this is true, the sketch uses a variable of the AudioInput type (named
    in) and initializes it with getLineIn().


    ```

    in = minim.getLineIn(Minim.STEREO);

    ```


    Now the variable in can access the functions belonging to AudioInput, which include
    the ability to get individual data values. Sound on computer consists of sampled
    voltages that have been rescaled to a convenient range. Then, normally between
    -1 and +1, that represents the volume. We can access each of the stereo channels:
    the left channel is in.left, and the right is in.right(these of type AudioBuffer
    is an array of real numbers). The get() function allows access to the numerical
    values:


    ```

    ly = in.left.get(128);

    ```


    This gets the first value in the buffer, which could be positive or negative,
    so for display purposes it is better to use the abs(in.left.get(128)), which is
    simply the magnitude of the value shifted to the range 0 to 2. Now this number
    can represent the height of a rectangle, proportional to the sound volume:


    ```

    rect(100, 200, 20, -ly*100);

    ```


    The same process works for both the left and right channels.

    The total duration of a sound loaded into the variable player.duration(); the
    current position, assuming that it is playing, player.position(). When the sound
    is over, player.length() <= player.position(), and the Minim specification says
    that it is important to close and stop Minim to ensure that resources are given
    back to the system (via in.close(); minim.stop()). In the sketch, the stop() function
    does.

    The sketch also displays a numerical value for the sound data. A real number potentially
    has a lot of digits, most of which are not important. To print only two decimal
    places, in the sketch, multiply the value by 100 and convert it to an integer.
    This removes the remaining fractional part (all other digits to the right). Then
    convert this back to real fractional:


    ```

    (int)(ly*100)/100.0;

    ```'
