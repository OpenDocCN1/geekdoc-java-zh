  md: '# Sketch 71: Playing a Sound File


    One displays an image but plays a sound; why is that? Whatever the reason, Processing
    has no standard facility for displaying audio. It does have some libraries for
    purpose, however, most importantly Minim. (We used a library in Sketch 20.)


    Using Minim, this sketch will play an MP3 or WAV sound file using the standard
    PC sound interface. Adding to this, if the user presses the A key, the sound will
    move towards the left speaker, and if they press the D key (which is to the right
    of the A key), the sound will move towards the right speaker.


    The first statement in the program indicates that we want to access the Minim
    library:


    ```

    import ddf.minim.*;

    ```


    Then we need to create a single instance of the Minim library. The Minim library
    is a class, and it contains functions that can load and play sound files. Define
    a variable named of type Minim, and initialize it in the setup() function as follows:


    ```

    minim = new Minim(this);

    ```


    Now declare a sound player variable


    ```

    AudioPlayer player;

    ```


    Assign it sound file as read from an MP3 file using the Minim function loadFile():


    ```

    player = minim.loadFile("song.mp3");

