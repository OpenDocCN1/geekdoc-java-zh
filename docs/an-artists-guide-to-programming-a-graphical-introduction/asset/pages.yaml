    \ () {\n  _size(170, 108);\n  backgroundImage = loadImage(\n    \"data/gauge.png\"\
    );\n  frameRate(30);\n  background(255);\n}\n```\n\n![](img/7534641f255e2513226c900fd85d94f3_120_1.png)\n\
