  md: '# Sketch 66: Many Small Objects—A Snowstorm


    A Processing program redraws the screen many times each gives. Visible objects
    must be redrawn in each frame, and to do so the program must use the parameters
    (size, location, shape, and color) of all of them. Drawing each object takes time,
    so if there are many, is it still possible to redraw them all quickly enough?
    In many cases it is, if the objects themselves are not complex. This sketch will
    draw falling snowflake that moves realistically between frames.


    Snowflakes are, in fact, very complex shapes, but from a distance they are white
    blobs. We draw them as small rectangles width and height by a small random value
    each frame to simulate the effect of snowflake fluttering as it falls. Set the
    dimensions with the formula width = size + random(3)-1.5, size is set to 3, and
    the value of random(3) is a number between 0 and 3, random(3)-1.5 have a value
    between -1 and +1.5, causing a change in the size between 1.5 and 4.5. Each snowflake
    also has a slightly different falling speed. This gives the illusion of depth
    because flakes that fall appear nearer to the viewer than ones that fall slower.
    The speed is selected at random, and it yields the desired effect.


    Snow does not normally fall straight down; we observe it drifting and floating
    with air currents. The speed at which each snowflake falls a bit at random as
    it falls to try to give the illusion of realism. If we set dx to a nonzero value,
    it simulates a wind, and snow will blow in the specified direction.


    Each frame, we generate 30 new snowflakes with random horizontal positions and
    y-coordinates of 0 (at the top of the window, to maintain the illusion). The number
    of snowflakes created during each frame is random and is a function of the position
    of the mouse. The nearer the mouse is to the top of the screen, the less snow
    will appear to fall. This is the number of flakes created:


    ```

    N = (int)random(((float)mouseY/height)*30);

    ```


    This means that no flakes fall for small values of mouseY, while the maximum of
    up to 30 new snowflakes during each frame occurs when mouseY/height is at its
    maximum of 1.0.

    The variable SIZE has a value of 5,000, which is the number of snowflakes that
    can be on the screen at any time. Initially there are only a few, but the array
    will fill up quickly. When all 5,000 array elements are occupied, we start over
    again at 0, assuming that the snowflakes at the beginning of the array have fallen
    past the bottom of the screen and are not visible. This technique is referred
    to as a circular array.'
