  md: '# Sketch 3: if Statements—Changing Colors Conditionally


    In daily life, people often deal with conditional actions, although little if
    any thought is given to the data. We express the conditions in human language,
    of course:


    > “If it is raining, we’ll watch TV, but if it is sunny, we’ll go skiing"

    “If the light is red, then stop, but if it is green, just drive on.”


    We can also use conditional actions when programming a computer. If some situation
    is true, we execute a section of code. The condition or situation has to be expressed
    in numerical terms, and the result is a true or false result. Such conditions
    are frequently the result of comparisons between numbers, such as “is equal to
    10” or “is the x-coordinate less than the width.”


    Conditional code is dealt with using an if statement, which has the following
    syntax:


    ```

    if ( condition ) code;

    ```


    Conditions can be comparisons between numbers, so the following are all conditions:


    | (x > 2) | (width == 640) | (width != height) |


    There are some special symbols in use here. The = symbol means assignment


    ```

    if ( condition ) code;

    else code;

    ```


    Example B uses an else to accomplish the same task as Example A ❷


    # Example C


    The third code example alternates between red and green each time draw() is called,
    creating a colored flashing effect.'
