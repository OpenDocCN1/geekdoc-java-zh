  md: '# Sketch 48: Opening a Web Page


    A page is really just a text file containing the description of that page in enough
    detail to draw it on the screen. A program called a browser reads and renders
    that file into a viewable page. The file itself resides on a computer somewhere
    on the internet, and in order to display it, we must first load it to the user''s
    computer. The browser arranges this to be done, but the file must have a unique
    name that identifies it—unique in the whole world, because the internet is a planetwide
    network. This unique name is called the Uniform (or Universal) Resource Locator,
    shortened to URL. Most people know this by the term web address, and an example
    is https://www.microsoft.com.


    The URL contains the directions for how to find the web page, and it is the equivalent
    of a filename. Displaying the page is a complex operation, and browsers are very
    complicated systems.

    Processing operations and displays web pages using a function named link(), which
    accepts a URL as a parameter. This function passes the URL to the default browser
    on your computer, which opens and displays the page. So the following call will
    open the Microsoft page in a browser:


    ```

    link("https://www.microsoft.com");

    ```


    If the browser is already open, it may open a new tab.


    # Example A


    This sketch opens the Microsoft page as previously described. It does so when
    a mouse button is pressed while the cursor is within the display window.


    # Example B


    This sketch is a combination of Example A and Sketch 37. The user types a URL,
    and the sketch passes a string from the characters being typed. When the user
    types ENTER, the sketch passes the URL to link(), and the browser will open and
    display the corresponding-page.


    When the user types a character, it is usually placed in the variable key, then
    added to the string. However, some keys do not produce characters, such as the
    arrow keys, or SHIFT. In Processing, uppercase characters involve two key presses:
    the SHIFT key and the character. Processing system refers to them as coded keys
    and treats them differently. If the key has the value CODED, then the key was
    pressed was one of the special ones, and the keyCode variable indicates what key
    was pressed. The value UP, for example, the up-arrow key was pressed.


    In this sketch, we''ll ignore all coded keys, because the SHIFT key is needed
    to send uppercase letters and some punctuation (like the colon, ":"), but it should
    not be thought of as a key press. The keyPressed() function ignores coded keys
    using the following code:


    ```

    if (key == CODED) return;

    ```'
