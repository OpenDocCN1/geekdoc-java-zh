  md: '# Sketch 94: Pathfinder


    Pathfinding amounts to finding a route from one place to another in two or three
    dimensions. Potential routes could be blocked by walls, rivers, wires, or a host
    of other obstacles.

    Of course, it is the best route that is desired, where "best" can be based on
    many factors, such as physical distance, time, or cost. In circuit design, we
    use pathfinding to find a connection between circuit elements. In computer games,
    it find a path to get a game object from one place to another. This sketch will
    implement a basic pathfinding method in two dimensions.


    The method begins at some initial point, (x, y), and there is a destination or
    target point to be reached, (xi, yi). Each neighbor (xj, yj) of (x, y) is marked
    with its distance to (x, y). Then we look at the neighbors of those locations
    (xj, yj) and mark those locations with distance to the start, by adding the distance
    to the neighbor (xj, yj) to (x, y). We keep repeating this until we finds the
    target point (xi, yi). Now we know the distance to the start point, and the best
    route can be traced following the connected locations with the smallest marked
    value. A neighbor must be an open space, not an obstacle, in order to be marked,
    so the route will never pass through obstacles.


    The program begins by reading in an image where obstacles appear in black and
    the background is white. The start and end positions of the path are specified
    in the program as x, y coordinates starts, start, and end (you can change these
    to a)


    Beginning at the start coordinates, we examine the neighboring pixels ① The neighbors
    of any pixels are to the left, right, above, or below. The distance between pixels
    (xj, yj) and (xi, yi) is therefore |xj - xi| + |yj - yi| and is an integer. This
    is measuring of distance between the start point and the end point, you could
    adapt the pathfinding method to use other distance measurements as well.


    If one of the neighbors is the end of the path, the search is ②; otherwise we
    use the pixel color shade of gray proportional to its distance from the start
    point. We use the red component of the RGB color as shade, so as the red increases,
    the color gets brighter. We could instead use a separate 2D array to store distances,
    especially if floating point distances are required, or when calculating Euclidean
    distances.


    Next, we examine all pixels that have the red value 1 (those from the start) in
    the same way, and set their neighbors to 2. Then we set their neighbors to 3,
    and so on until we reach the end location.


    At this point, the distance to the start point is to trace back to the start,
    look for a neighbor of the end location that has a value of N-1; any one will
    do. Mark that location as being on the route, and look for a neighbor of that
    location that has a value of N-2; at any moment there will be many paths having
    a particular value, but only ones connected to the path are interesting. The path
    is complete when we reach the start location. The drawRoute function searches
    the neighbors of the end pixel for a neighbor with a value of N, marks that pixel
    with a specific color, and recursively finds a neighbor of that pixel, marks it,
    and so on ③


    ```

    set(i,j,color(0,100,200));ndrawRoute(i,j,n-1);

    ```


    The result is a path that is drawn on the displayed image.


    The colors indicate distance in this sketch to illustrate the method. This would
    not be done in an actual application. Also, this is generally too slow for many
    applications, and (and more complex) algorithms exist. The most commonly used
    method is the A* algorithm.'
