  md: "# Sketch 37: Inputting a Filename\n\nAll of the sketches in this book so far\
    \ use filename constants when rendering an image. To be more flexible, most programs\
    \ allow the user to enter a command or filename, even a number, from the keyboard,\
    \ and that user input directs the code to use specific data. This is our next\
    \ task—ask the user to enter an image filename from the keyboard and display that\
    \ image in the sketch window.\n\nWe already know that the keyPressed() function\
    \ is called whenever the user presses a key, and the variable key contains the\
    \ character that represents the key that was pressed, at least for letters and\
    \ numbers. Other keys, like arrow keys, use a keycode, like ENTER or BACKSPACE,\
    \ to tell us what the key is. Given these facts, one way to read a user-given\
    \ filename would be to append the characters typed by the user to a string, and\
    \ when we see the ENTER value, to use the preceding string as a filename. This\
    \ should work fine, but we need to handle some conventions.\n\nFirst, the user\
    \ needs to see what they are typing. The string so far must appear somewhere on\
    \ the screen so that the user can see what has been typed.\n\nNext, corrections\
    \ must be possible. Traditionally one presses the BACKSPACE key to move backward\
    \ over the string and delete characters so that new, correct one can be entered,\
    \ we'll implement corrections using BACKSPACE. Finally, if an incorrect name is\
    \ entered, a corresponding image file might not exist, and the user needs to be\
    \ informed.\n\nWhen the user types a letter or number, indicated by the variable\
    \ key, we add that character to a string named s using the concatenation operation\
    \ ①:\n\n```\ns = s + key;\n```\n\nIf that character is a backspace and the string\
    \ has characters in it, we remove the last character entered ②:\n\n```\nif (s.length()>0\
    \ && key==BACKSPACE)\n  s = s.substring(0, s.length()-1);\n```\n\nThe draw() function\
    \ will display this string each time the screen is updated, allowing the user\
    \ to see the current string. Finally, if the key was pressed was ENTER, then the\
    \ string is complete and we should open and display the file. If loadImage() returns\
    \ null, there is no such image, and the word Error is displayed in place of the\
    \ filename ③:\n\n```\nif(key==ENTER || key==RETURN)\n{\n  img = loadImage(s);\n\
    \  if (img == null) s = \"Error\";\n}\n```"
