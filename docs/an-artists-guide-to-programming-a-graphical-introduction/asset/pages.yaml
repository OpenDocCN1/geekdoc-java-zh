  md: '# Sketch 49: Loading Images from a Web Page


    Since a web page is just a text file, as you saw in Sketch 48, it should be possible
    to read that file and see what is inside. For example, it should be possible to
    identify any sound files (for example, MP3s) accessed by the page, or which images
    (.jpg, .gif, .png, and so on) will be a part of the page. This sketch will locate
    images referenced in a web page and display them in the display window.


    The first thing to do is read the page. It contains HTML, a language for describing
    the document, and reading it out to be easy: parsing URLs to be just like filenames
    in the loadStrings() function. You can use the Mink Hollow Media page as a text
    file by directly passing the URL to loadStrings():


    ```

    String web[] = loadStrings("https://minkollowmedia.ca/");

    ```


    Or, as is in this sketch, loadStrings(url+"/file), where url is the web address
    and file is the name of the file we want. At this point, the web page is available
    as a collection of strings in the array web, one line in the file.


    HTML uses calling an img tag to display images in the page:


    ```

    <img src="imagename.jpg">

    ```


    The filename of an image follows the src=", so the sketch should look for the
    sequence of characters within the strings in web. If found, the following characters,
    up to the closing quote character ("),"), are the filename. We can locate a string
    within another using the indexOf() function


    ```

    i = s.indexOf("*", j);

    ```


    In this example, indexOf() searches the string s for the string "src=", starting
    at the character index j. It returns the index of the location where the string
    was found, or -1 if it was not found. If the string is found, we call the getName()
    function to extract the filename itself from the string. The getName() function
    reads and saves characters until it encounters the terminal double quote and returns
    the filename as a string. This string is used as a filename for loadImage(), and
    if an image with that name can be loaded, it is displayed.


    There are many legal ways to specify a filename, and the code here also tries
    one other: it will take the URL and add a slash (/) the filename to see if that
    works. Some images might not be located using this method, and some files are
    not images (like JavaScript, video, and audio) can be extracted. They will fail
    to display as images, and error messages will appear in the console.


    You could save the extracted images as files by simply save() when the image is
    successfully loaded. The act of extracting information from a web page using a
    program is called scraping.'
