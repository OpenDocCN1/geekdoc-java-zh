  md: '# Sketch 92: A Dynamic Advertisement


    On video screens all over the world, we see public advertising. In airports, shopping
    malls, and even schools, promotional material of all kinds is presented to a captive
    audience. Video is a convenient medium, since the price of large plasma and LCD
    screens has dropped below $10 per inch. Video is a more dynamic medium as well,
    allowing ads to do multiple presentations in sequence, something that printed
    posters and billboards can''t.


    The technology connected with video ads is well known too (Biteable Ad Maker,
    InVideo, even Adobe Premiere), and it''s available on the computer desktop. This
    sketch is one example of a simple advertisement—for a Tex-Mex restaurant. It is
    loosely based on a collection of actual video presentations seen in airports in
    North America.


    First we need a good image of the subject (the product: a burrito). The image
    used here is publicly available (https://commons.wikimedia.org/wiki/File:CarneAsada-burrito.jpg),
    but in general such images are professional photographs taken at high resolution.
    In the sketch, this image is 800×431 pixels. We reduce it to a smaller size, 770×401,
    or 30 pixels smaller in dimension. In this so we can slowly move the image for
    a more dynamic presentation. We display the image using this statement ①, where
    xoff and yoff are offsets for positioning the image before display:


    image (ad1, xoff, yoff);


    These offsets change in frame by a small amount, up to a maximum of 30 pixels,
    at which time the displacement reverses direction ②:


    ```

    xoff += dx; yoff += dy;

    if (xoff <= -30 || xoff > 0) dx = -dx;

    if (yoff <= -30 || yoff > 0) dy = -dy;

    ```


    The values of dx and dy are very small, 0.05 and 0.03 respectively. They differ
    in value so that the image appears to move in a vaguely elliptical manner.


    The text is displayed over the image in a fixed position, reinforcing the motion
    of the image. The text at the bottom remains the same throughout, but the text
    at the top changes. The implementation has two stages: if the variable stage =
    0, we display the first string (“It takes us hours to make it”) ③. After 850 frames
    (about 28 seconds) have passed, we increment the variable stage, and as a result
    we display the second string (“It takes you five minutes to eat it”) ④. After
    900 more frames, stage becomes 1 again and the cycle repeats.


    We could allow an arbitrary number of stages to allow for the presentation of
    multiple distinct messages and images, and in a random sequence.'
