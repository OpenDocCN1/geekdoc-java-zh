  md: '# Sketch 38: Inputting an Integer


    In the previous sketch, we had the user enter a string from the keyboard, and
    we used the string as a filename. This is a basic use of a string—using a sequence
    of characters to communicate data to the computer and back. What if, instead of
    entering an integer, we wanted to specify some number of things to input? This
    would mean entering an integer. when a number is entered at the keyboard, the
    string is not the number but is a text representation of the number. To get the
    actual number, the characters that compose it have to be converted into numeric
    form.


    The string "184" is an integer in string form, obviously representing the number
    hundred eighty-four (184). This is one hundred plus eight plus four, or $10^2
    + 8*10^1 + 4*10^0$. To convert string into numeric form, we need to peel off the
    digits one by one and multiply by the power of 10.


    We can take the first digit, and add it to sum. Then we take the next digit and
    add to the sum multiplied by 10, and repeat again until the incoming character
    is not a digit. The powers of 10 accumulate with the first digit representing
    the highest-power and the final digit representing $10^0$, or one.


    This is the essential piece of code:


    ```

    val = val * 10 + (key-''0'');

    ```


    The expression key-''0'', where key is a digit, represents the numeric value of
    a digit character (that is, from 0 to 9). Assuming that val is initially 0, we
    get this after the user types ''1'':


    ```

    val = 0*10 + (''1''-''0'') = 0 + 1 = 1

    ```


    Now the user types ''8'', and we get this:


    ```

    val = 1 * 10 + (''8''-''0'') = 10 + 8 = 18

    ```


    Finally the user types ''4'':


    ```

    val = 18* 10 + (''4''-''0'') = 180 + 4 = 184

    ```


    To make this sketch marginally useful, it allows us to enter two values, an x
    and a y value, and draws a circle at these coordinates. An error on entry sets
    the coordinate to 0.'
