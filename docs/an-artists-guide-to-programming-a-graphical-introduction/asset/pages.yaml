  md: '# Sketch 44: A Slider


    A slider is a user interface widget that allows the user to move a small object
    (a cursor) along a linear path, horizontally or vertically. The relative position
    of the cursor along the path represents a number. The cursor in one extreme position
    corresponds to the minimum value, and the cursor in the extreme position represents
    the maximum. If the cursor is halfway between the min and max positions, the value
    associated with the slider is halfway between the min and max values.


    This widget can be used to position a large image in a small window or a lot of
    text within a smaller area, and we call it a scroll bar in those cases. The purpose
    of a slider is, more generally, to allow the user to select a number geometrically
    by sliding a cursor between two limits, rather than typing it. It is a natural
    idea to choose a number as a fraction of a total, or as part of a range of values.
    If we define sliderPos as the position of the cursor in pixels from the start
    of the slider, sliderWidth as the width of the slider in pixels, and sliderMax
    and sliderMin as the numerical values associated with the min and max cursor positions,
    this is the selected value


    ```

    value = (int)((((float)sliderPos/sliderWidth)*sliderMax + sliderMin);

    ```


    This expression is based on the fact that the slider position is a fraction of
    the total set of positions, and this represents the same fraction of the range
    between the sliderMin and sliderMax values (see Figure 44-1).


    | sliderMin | value | sliderMax |

    |---|---|---|n| posMin | pos | posMax |

    | | maxWidth | |


    | value - sliderMin = (pos - posMin) / (pos - posMin) |

    | sliderMax - sliderMin = (posMax - sliderMin) / posMax |

    | (sliderMax - sliderMin) (pos - posMin) |

    | value - sliderMin = maxWidth / (maxWidth * sliderPos + sliderMin) |

    | Where: sliderPos = pos - posMin / range = sliderMax - sliderMin / posMax - posMin
    = maxWidth |


    **Figure 44-1:** A slider


    A slider can be represented graphically in many ways. In this sketch, the widget
    is a horizontal rectangle with a circular cursor, and the current numerical value
    is drawn to the right. However, the cursor can be rectangular, elliptical, a pointer,
    or other shapes.


    The draw() function draws the rectangle and the cursor using the sliderPos variable,
    which is set when the user selects the cursor with the mouse and then moves (slides)
    between the ends of the rectangle. To build a slider class, you would make class
    variables for the position, size, current cursor position and value, and class
    functions to draw the slider and the cursor position (which you''d then call as,
    for example, slider.draw() or slider.draw()).


    A common use for sliders is a way to display an image. Often an image will not
    fit into a particular window, or into any window; some images are very large.
    Rather than'
