  md: '# Sketch 35: Scrolling Text


    A news *scroll* is a common feature of television news and weather stations. It
    is a summary of stories that scrolls from right to left across the bottom of the
    screen as other things are happening on the rest of the screen. It is common to
    see stock prices displayed in this way as well. How could we do this in a Processing
    sketch window?


    First, the text for a particular item has an x-coordinate where it is drawn, and
    it will be drawn using the `text()` function. The x-coordinate is constant and
    will be somewhere near the bottom of the screen. In this sketch it is 400x200
    and the y-coordinate for the text is 190. The x-coordinate changes.


    The text to be displayed should start near the right side of the screen; for example,
    with width-10 pixels. Each frame displayed should move the text to the left, so
    `draw()` will subtract one from x each time it is called:


    ```

    text(x, y);

    x = x - 1;

    ```


    There will usually be more than one message in the scroll. The first message could
    disappear before the second one is displayed, but this is unusual for a text scroll.
    Another idea is to have multiple strings drawn next to each other, moving in lockstep.
    The strings are in an array called `headlines`.


    Suppose we have two strings. Each one has an index that accesses the strings (i1
    and i2) and x position (x1, x2). If the first string, `headlines[i1]`, is drawn
    at location x1 plus a small space. In Processing terms, it looks like this:


    ```

    x2 = x1 + (int)textWidth(headlines[i1]) + 10;

    ```


    textWidth() is a function that takes a string as a parameter and, using the current
    font size, returns the width in pixels of that string when drawn. The value is
    small. When the first string disappears on the left of the screen, its plotted
    position plus its length will be less than 0


    ```

    x1+textWidth(headlines[i1]) < 0

    ```


    At this point, a new string (that is, the next index) should be obtained and positioned
    to the right of the second string:


    ```

    i1 = (i2)%5;

    x1 = x2 + (int)textWidth(headlines[i2]) + 10;

    ```


    The same happens when the second string disappears on the left.'
