    \ 0, 0);\n  gauge(119, 55, 25, 25);\n  val = val + dv;\n  if (val > dataMax) {\n\
    \    val = dataMax; dv = -dv;\n  } else if (val < dataMin) {\n    val = dataMin;\
    \ dv = -dv;\n  }\n```\n\n![](img/7534641f255e2513226c900fd85d94f3_120_2.png)\n\
    \n```\nvoid gauge (int x, int y, int v, int dy, int dial_length) {\n  float theta;\n\
    \  int xx, yy;\n  // Calculate rotation angle of pointer\n  theta = radians((v-dataMin)*(beta-alpha))/(dataMax-dataMin)\
    \ + alpha);\n  stroke(0, 0, 0);\n  yy = int(dial_length * sin(theta)); // x-coordinate\
    \ of rotated pointer end\n  xx = int(dial_length * cos(theta)); // y-coordinate\
