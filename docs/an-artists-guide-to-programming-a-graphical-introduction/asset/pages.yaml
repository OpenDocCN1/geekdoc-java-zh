  md: '# Sketch 22: Setting and Changing the Values of Pixels


    Pixel values in an image, including the drawing area, can be changed using the
    set() function. We specify a pixel location using coordinates and identify the
    color to draw at that point. For example,


    ```

    set(i,j, color(255, 255, 0));

    ```


    This sets the pixel in the graphics area at location (i,j) to yellow, or RGB (255,
    255, 0). If the coordinates lie outside of the window, the pixel will be drawn
    but not be visible. We can set a color for all pixels in the window using the
    background() function:


    ```

    background (255, 100, 40)

    ```


    This calls the sketch window with orange.


    # Example A


    Setting all pixels in the window without using the background() function requires
    a loop—nested loops, in fact. The first loop examines all pixels in the horizontal
    direction; that is, all pixels in a specified row. The second loop looks at all
    possible values of i, which is to show all rows. The first loop sets the flag
    ready within the second so that all pixels in rows are modified:


    +   for (i=0; i<width; i++)

    for (j=0; j<height; j++)

    set(i,j,color(255, 100, 40));


    This sets all pixels in the sketch window to orange.


    # Example B


    The pixel values of an image can be modified before the image is displayed in
    the sketch window. Not only can the color be replaced, but a pixel value can be
    changed more subtly to a variation of what is already there. This example first
    loads and displays an image. When the program detects a button press with mousePressed(),
    which indicates that the image on the screen is to be modified, pixel by pixel,
    in a loop like that of the previous example. In this case, we replace the RGB
    value of each pixel with its brightness value, and the result is a grey image
    showing no color. When the mouse button is released (mouseReleased()), the program
    clears the flag (sets it to false), and the image is displayed in color again.'
  merge: -1
