  md: '# Sketch 61: Layering


    One of the key features of modern graphics programs like Photoshop is the idea
    of layers. That''s the creation of a set of graphical objects (images) that are
    placed on top of each other to achieve a complex effect. Transparency makes it
    possible to see objects on lower layers. This sketch uses three layers: an image
    of the moon, a circle around a center, and a targeting display (reticle). Using
    the keyboard, the user can reposition the moon image. The goal of the interface
    is to allow the user to align the reticle with the target circle.


    Drawing inside the sketch window involves using a graphics object called PGraphics.
    The background(), line(), and ellipse() functions, many others, are of the PGraphics
    class, though we can use them without a PGraphics object. Alternatively, our drawing
    can take place in one of these objects and then be displayed on the screen by
    calling image(). This sketch will draw the moon image with an ellipse highlighting
    inside of a PGraphics instance, and we''ll display it in the sketch window.


    The variable used for the PGraphics object is named pg, and the function that
    creates one is (reasonably enough) createGraphics() ①


    ```

    PGraphics pg;

    pg = createGraphics(moon.width, moon.height);

    ```


    Here, moon is the PImage variable that holds the background image of the moon.
    To draw in a PGraphics object, use the functions that we have used before, but
    specify the pg variable as the target ②


    ```

    pg.beginDraw();

    pg.image(moon, 0, 0);

    pg.stroke(0, 200, 0);

    pg.noFill();

    pg.ellipse(393, 233, 12, 12);

    pg.endDraw();

    ```


    Drawing is preceded by a call to beginDraw(), a function that is similar to a
    bracket; the corresponding end bracket is a call to endDraw(). If you don''t use
    these calls, Processing doesn''t initialize the object, and drawing will not work
    (even though Processing may not generate an error). The preceding code draws the
    moon image in the PGraphics objects and draws a circle around a target.


    The draw() function displays the PGraphics object using the image(pg, xoff, yoff),
    where xoff and yoff are positional offsets that are controlled using key presses
    of W, A, S, and D in the traditional way ③ (A Graphics object has many of the
    properties of a PImage, since image() can display both). The values of xoff and
    yoff are generally negative so that the underlying graphic shifts left and up
    under the window, which remains stable, from its starting point in the upper-left
    corner. The draw() function also draws the reticle as a small set of lines that
    point to the center of the window ④'
