  md: "# Sketch 80: Playing a Video\n\nWe can use Processing to play videos, but as\
    \ was the situation with audio. Processing does not have its own facility for\
    \ doing so. Instead, we use the Movie class from the processing.video library,\
    \ which in turn uses the underlying Java-based video functions. As a first example,\
    \ this sketch will load and display a short video.\n\nFirst, we import the processing.video\
    \ library \\uf1 as the first line in the program:\n\n```\nimport processing.video.*;\n\
    ```\n\nNow we can declare an instance of the Movie class \\uf12, for each movie\
    \ we want to play:\n\n```\nMovie movie;\n```\n\nWe load the video file when we\
    \ initialize the class instance by calling its constructor (Sketch 43), specifying\
    \ the name of the file as a parameter \\uf13:\n\n```\nmovie = new Movie(this,\
    \ \"car.avi\");\n```\n\nIn the setup() function, we begin reading the video from\
    \ the file by calling the movie.play() function (which doesn't just play the video,\
    \ as you'd expect). A video is a sequence of compressed frames, just like an animation,\
    \ and each one can take some significant time to read and decode. After we call\
    \ play(), the system tries to read frames from the file, and when one is ready,\
    \ the available() function returns true. We can then acquire the frame using read().\
    \ Like a PGraphics object, a Movie object can be treated as an image and displayed\
    \ using the image() function. Thus, this is the process for displaying a movie\
    \ \\uf14:\n\n```\nif (movie.available()) {\n  movie.read();\n  image(movie, 0,\
    \ 0);\n}\n```\n\nIf no new frame was available, read() would not be called, and\
    \ the previously read frame would be displayed in its place. This is usually noticeable.\n\
    The Movie class plays the sound with the movie.\nThe sketch also presents relevant\
    \ information at the top of the window. It counts the number of frames read in\
    \ and displays that. It also displays the time count, which is the number of seconds\
    \ that have been played so far, retrieved from the movie.time() function call\
    \ \\uf15. When the movie is complete, as indicated by movie.time() >= movie.duration()\
    \ \\uf16, the counters reset and the movie resumes playing from the first frame\
    \ by calling movie.jump(t). The jump(t) function call moves the current frame\
    \ to the one at time t. Playing in a loop could also be accomplished by calling\
    \ movie.loop(0) instead of movie.play(). In that case, the replaying of the movie\
    \ from location 0 would be automatic."
