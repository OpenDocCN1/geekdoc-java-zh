  md: '# Sketch 13: Loading and Displaying an Image


    Images are everywhere in cyberspace, and even people without explicit computer
    know the names of the image formats, or at least the file suffixes: GIF, JPEG,
    BMP, PNG, and so on. Each of these sequences of letters is symbolic of a different
    way of storing images in computer form, and each has specific pros and cons for
    different purposes. GIF images were developed for use on the early internet, and
    each has the ability to store animations. The JPEG (or JPG) format is used by
    almost all digital cameras, and it compresses pictures into relatively few bytes.


    You should recognize the importance of images and how complex a task it is to
    read from one of these file formats. A program to read most GIF files would require
    more than a thousand lines of code. The fact that Processing provides an easy-to-use
    facility to read, and draw images is one of its advantages over other programming
    languages.


    Processing a type that represents an image, much as an integer is represented
    by the int, and the system can read an image file into a variable with one call
    to a function. The type is PImage (short for *Processing Image*), and the function
    is loadImage(). For the image to load, it should be saved in the same folder as
    the sketch file, or in a subfolder called `data`.


    # Example A


    Let''s assume that an image named *image.jpg* exists and we want to read this
    image and display it in the sketch window. The first thing to do is declare a
    PImage variable, *im*, into which we will place the image ❶. Inside of setup(),
    we will create a sketch window (using size()) and read the image. The following
    statement reads the image and assigns it to the variable:


    ```

    im = loadImage("image.jpg");

    ```


    Now the image data is stored in some internal form in the variable *im*.

    Displaying the image is done from the draw() function, although it could be done
    in this instance from setup() as well. The Processing system gives us a function
    image() that will draw a PImage into the sketch window at a particular (x, y)
    location (specifying the location of the upper-left corner of the image). The
    following call draws the image so that its upper-left corner corresponds to the
    window''s upper-left corner:


    ```

    image(im, 0, 0);

    ```


    # Example B


    This program is the same as Example A, but it draws the image at location (150,
    30) ❷. Now the image is more neatly displayed in the available space.


    The type PImage is defined by Processing but is a little different from types
    like-int and float. In fact, PImage is something called a class, and we can make
    our own classes.'
