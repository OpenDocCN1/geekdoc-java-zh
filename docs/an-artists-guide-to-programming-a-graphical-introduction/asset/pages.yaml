  md: '# About the Author


    Jim Parker is a professor, author, and artist who has published a dozen books
    and over 170 technical papers, in addition to writing short stories. He has degrees
    in mathematics and computer science, and a PhD from the State University of Ghent,
    Belgium. His areas of expertise include computer simulation, image processing,
    artificial intelligence, game design, and generative art. He has exhibited generative
    art, and even sent art into space. He lives on a small ranch in the foothills
    of the Rocky Mountains, where he helps raise small animals and Tennessee walking
    horses.


    # About the Technical Reviewer


    Jeffrey Boyd received his PhD in computer science from the University of British
    Columbia and is currently an associate professor at the University of Calgary.
    His research focuses on sensing and computer vision, with applications in analyzing
    human motion, interactive art and music, sonification, and computational musicology.
    Dr. Boyd and his students do diverse work that includes wearable systems that
    provide real-time, sonic feedback to train and rehabilitate speed skaters; numerous
    art and sound installations; and the musicalological study of contemporary composers
    through the analysis of ambisonic recordings of their work.'
