  md: '```

    <DOCTYPE html>

    <html>

    <head>

    <title> Sketch 100: Processing on the Web</title>

    <script src="min.js"></script>

    </head>

    <body bgcolor="a99aa">

    <br>

    <h1>Sketch 91: Simulating the Aurora</h1><br>

    This is sketch 91 adapted for the web. <br>

    Among objects that are difficult to render on a computer, the northern lights
    or aurora is near the top of the list. They flicker and roll, the colors change,
    the shape changes at various speeds, and they have no one specific shape. There
    have been efforts to draw them with more or less success; this sketch is one of
    attempts.<br>

    <center>

    <canvas data-processing-sources="sketch100.pdf"></canvas>

    </center>

    <br>

    There are many shapes that the aurora can take, and this sketch will only attempt
    to draw one of: the typical curtain type.<br>

    The sketch will make the color change slowly as a function of Y position. Starting
    with a value at the bottom of the auroral curtain, the hue will increase in pixels
    above. Starting at a value of h-5, the hue increases according to:<br>

    b = h + random(87)<br>

    So that the hue increases at a random rate, but always increases, as the y coordinate
    changes.

    At the very top of the curtain the brightness will decrease also, fading the color
    away.<br>

    Next, notice that the aurora appears to consist of vertical strokes and is banded
    horizontally. This is accomplished in the program by changing the saturation of
    the pixels periodically as a function of X coordinate. The code is:<br>

    if(i == 0) s=220+random(20)-10;<br>

    else if(i%2 == 0) s = 210+random(20)-10;<br>

    else s = 200+random(20);\nwhere i is the horizontal position and s is the saturation.
    i%3 is the remainder when i is divided by 3, so there is a somewhat random variation
    in the saturation, giving darker bands.<br>

    The curtain effect is accomplished using a sine function to locate the pixels
    vertically. For a basic coordinate (i,j) the actual pixel will be at (i,j-bb*sin(a*i))
    where the parameters and bb change by a small and random amount during each iteration.
    This makes the curtain move.<br>

    </body>

    </html>

    ```'
