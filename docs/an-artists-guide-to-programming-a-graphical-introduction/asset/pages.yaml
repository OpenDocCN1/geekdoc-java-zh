  md: '# Sketch 16: Manipulating Images II—Cropping


    Cropping an image refers to the removal of an arbitrary rectangular sub-image.
    We crop images generally to make a more appealing image or remove extraneous material.
    In Paint or Photoshop we use the mouse, clicking first on the desired upper-left
    corner of the cropped image, dragging the mouse to the desired lower-right corner,
    and releasing the button. All of the image outside of the selected rectangle are
    discarded. Sketch will crop an image and optionally expand the cropped region
    to fill the image window.


    First the image is read in and the sketch window is resized to fit the image.
    The draw() function displays the image (named img) centered in the window using
    the following code


    ```

    image(img, (width-img.width), (height-img.height)/2);

    ```


    If the image has not been cropped, width-img.width will be 0, and the call will
    be image(img, 0, o). Otherwise the image will be smaller than the window, and
    (width-width/2) will be the number of pixels needed on the left to center the
    cropped image. The same is done for height, which places the image in the center
    of the window.


    When mouse button is pressed (mousePressed()), the cropping starts, using the
    point where the cursor is, which is saved as x0 and y0. A rectangle is drawn from
    this to the current mouse coordinates, implementing a buffer rectangle


    When the mouse button is released, the mouse coordinates are evaluated to ensure
    that the current mouse mouseY represent the lower-right corner of the crop box;
    in other words, make sure that mouse is bigger than it was when the mouse button
    was pressed, and make sure for mouseY. If so, the values of x0 and y0 are swapped
    with the values of mouse and mouseY. Then we create a cropped image with the get()
    function, using the upper-left and lower-right coordinates


    ```

    sub = get(x0, y0, (mouseX-x0), mouseY-y0));

    ```


    The get() function returns a rectangular region of an image specified by a coordinate
    pair, and a height. In the preceding call (x0, y0) are the upper-left coordinates,
    the width is the distance between the mouse value and the upper-left x value,
    and the height is the distance between mouseY and the upper-left y value. In this
    case, get() returns the image displayed in the sketch window as original.


    The sub-image returned by the get() function becomes the current image to be displayed
    in draw(img) (the variable img) centered in the window


    A new idea in this sketch is the test to see which mouse button was pressed. In
    mouseReleased(), this function tests for the mouse button:


    ```

    if (mouseButton == RIGHT) sub.resize(width, height);

    ```


    If that was the one released, the sub-image is rescaled to fit the window.

    At we resize the graphics window to be the size of the image, as we''ve done before.'
