  md: '# Sketch 60: A Driving Simulation


    Driving simulations and games have a specific, standard interface and visual presentation.
    Unlike previous sketches, where users can move about the space but are not visibly,
    driving simulations display the avatar as a car, and the camera (viewpoint) is
    usually behind and above the car so that the view of the car is always looking
    forward. Cars drive on roads, so a background is important; without one users
    can''t tell they are on a road or have any real idea of how they are moving. This
    sketch will allow a user to drive a vehicle (a rectangular prism, actually) around
    a track, using the same scheme to move the avatar as before.


    The first thing to create is a track. It will simply be an image, so we can use
    Paint or some other drawing program. It should be large enough so that it provides
    some entertainment (variety) and does not distort too badly when displayed. The
    example shown in Figure 60-1 is 1,000x1,000 pixels.


    ![](img/7534641f255e2513226c900fd85d94f3_153_0.png)


    Figure 60-1: A simple track for driving on


    The sketch reads this image and uses it as a texture for a 1,000x1,000 square
    drawn on the x-z plane 1


    ```

    beginShape(QUADS);

    texture(track);

    vertex (0, 0, 0, 0);    vertex (1000, 0, 0, 0);

    vertex (1000, 0, 1000, 1000);

    vertex (0, 0, 1000, 0, 1000);

    endShape();

    ```


    The viewpoint needs to be above and behind the car. If the variables dx and dz
    represent the unit change in the x and z directions for the given angle (the current
    facing angle of the car), carX and carZ are the horizontal and vertical positions
    of the car, then this should be the viewpoint 2


    ```

    eyex = dx*50; eyez = carZ - dz*50;

    ```


    And it should have some fixed height eye=20. The 50 is a scale factor that depends
    on the image size.

    We draw the car at coordinates (carX, 0, carZ). After each step, these coordinates
    change as a function of the car''s speed (velocity); the velocity value increases
    or decreases as the user presses the W and S keys 3 (as opposed to previous sketches
    in which we moved forward and backward using those keys). The W key is the accelerator'
