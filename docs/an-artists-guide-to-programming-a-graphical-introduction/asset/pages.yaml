  md: "# # Sketch 91: Simulating the Aurora\n\nThis sketch is adapted for the web.\n\
    Among objects that are difficult to render on a computer, the northern lights\
    \ or aurora borealis vary in speed, and generally have no fixed shape there is\
    \ no one specific shape. There have been many efforts to draw them with more or\
    \ less success, this sketch is one of those attempts.\n\n![](img/7534641f255e2513226c900fd85d94f3_246_0.png)\n\
    \n```\n/* @pjs preload=\"trees.gif, stars.jpg\";\nfloat a=0.2, bb=10;\nimage foreground,\
    \ background;\n\nvoid setup () {\n  foreground=loadImage(\"trees.gif\");\n  background=loadImage(\"\
    stars.jpg\");\n  size(400, 224);\n  colorMode(HSB);\n}\n\nvoid draw () {\n  float\
    \ h, s, b=250, dt=0;\n  image (background, 0, 0);\n  for (int i=0; i<390; i++)\
    \ {\n    if (i%3 == 0) s=220+random(20)-10;\n    else if (i%2 == 0) s=210+random(20)-10;\n\
    \    else s=200+random(20)-10;\n    h=15;\n    for (int j=130; j>30; j--) {\n\
    \      if (j<=10) dt=(100-j)*3;\n      stroke (h, s, b, 200-dt);\n      h=h+random(.87);\n\
    \      point (i, j-bb*sin(a));\n    }\n    a=a+random(0.001)-0.0005;\n    bb=bb+random(1)-0.5;\n\
    \    if (bb<16) bb=15;\n    if (bb<-10) bb=0;\n    if (a<-0.1 || a>0.1) a=0;\n\
    \  }\n  image (foreground, 0, 0);\n```"
