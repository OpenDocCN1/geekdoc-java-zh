  md: '# Sketch 77: Positional Sound


    Because humans have two ears, we can roughly identify the location of a sound.
    We do this partly by using the difference in time of arrival and the volume of
    the sound at each ear. A sound is louder in the ear that is nearest to the source,
    and we can use this fact to simulate positional sound using a computer. In this
    sketch, we''ll play a sound and let the user start a listening position in the
    center of the sketch window. The user can move about, changing the angle they
    are facing with the A and D keys and stepping forward and backward using W and
    S.


    When the user is facing exactly towards or away from a sound source, the loudness
    in each ear should be about equal. When they are facing so that the left ear is
    pointing to the source, the volume in the left ear is loudest and in the right
    ear it is the quietest, and vice versa when the right ear is facing the sound.
    With this in mind, we can map volumes loudest in the left to equal loudest in
    the right as a function of the volume the listener is facing.


    Imagine an angle made between the listener''s position, the source position, and
    the x-axis, labeled θ in Figure 77-1. The angle that the listener is facing combines
    with the angle between the listener and the object to determine how loud the sound
    will seem in each ear, and thus determines how loud we should play the sound from
    each speaker to simulate positional sound.


    ![](img/7534641f255e2513226c900fd85d94f3_191_0.png)


    Figure 77-1: Geometry of positional audio


    The angle θ is determined using trigonometry as the arctangent of the difference
    in x over the difference in y, or the following, where atan2 handles the case
    where the angle is vertical:


    ```

    θ = atan2(y1-y0, x1-x0)

    ```


    The difference between the facing angle and θ (theta) defines an angle that controls
    the volume between two stereo channels being played, via the setPan() function.
    A parameter of -1 means full left channel, 0 means a balance, and +1 means full
    right. A bit of fiddling on paper shows that a 0-degree angle to the source should
    correspond to a pan of 0, 90 degrees has a pan of -1, 180 degrees has a pan of
    0, and 270 degrees has a pan of +1. These are the extreme points of function -sin(facing-theta),
    so this value is passed to setPan().


    In summary, the sound file (a simple tone) starts playing θ; the sound source
    is initially at (200, 200) and the user is initially at (300, 200) but can rotate
    and move. The volume of the sound played in each speaker is set by determining
    the angle θ, computing delta = facing-theta, and setting the pan to -sin(delta)
    θ.


    170 Part 9'
