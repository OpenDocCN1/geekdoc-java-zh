  md: '# Sketch 2: Colors


    We can specify a shade of grey with a single numerical component, but we can also
    specify a color by providing three numerical components to the same function.
    These components are given in the traditional order: red, then green, then blue.
    Each component fits in a single byte (8 bits), and it is represented by a number
    ranging from 0 to 255 that determines the shade of the component. Smaller values
    yield a darker color.


    The numbers (255, 0, 0) specify the brightest shade of red, while the numbers
    (254, 0, 0) specify a slightly darker shade of red. Green would be (0, 255, 0)
    and blue would be (0, 0, 255). Yellow is red and green, so a set of RGB coordinates
    for yellow would be (255, 255, 0). Grey values have the three components nearly
    equal.


    This is the RGB representation of colors. There are other representations:


    # Example A


    This sketch draws various circles of colors. In the draw() function, the first
    three calls to fill() and ellipse() draw the first row of circles: red 🔴, green
    🟢, and blue 🔵. The fill color changes before drawing each circle.


    The second row of circles is filled with yellow 🟡, magenta 🟣, and cyan 🔵. Each
    color here has nonzero color values.


    The final row contains circles filled with increasingly brighter grey values ⚪.
    Each circle has three equal color values.


    # Example B


    We can use a fourth component that represents transparency, sometimes referred
    to as the alpha channel. The components (255, 0, 0, 128) indicate that red is
    255, green and blue are 0, and transparency is 128, or 50 percent. Higher values
    indicate lower transparency. We can give any color any legal transparency in addition
    to R, G, and B values.


    This sketch draws sets of overlapping red, green, and blue circles to show transparency.


    In the draw() function, the first three calls to fill() and ellipse() ⚫ draw the
    upper-left set of circles with a fill color transparency of 20.


    The second three calls ⚪ draw the upper-right set of circles with a transparency
    of 100.


    The third three calls 🔘 draw the lower-right set of circles with a transparency
    of 180.


    The final three calls ⚪ draw the lower-left set of circles with a transparency
    of 255, which means color is completely opaque.


    Processing defines a color type for specifying colors. It contains values for
    red, green, blue, and transparency. The function color(r, g, b, a) takes numerical
    values and returns a value of the color type. Variables can also hold values of
    the color type.


    We could declare a variable and initialize it as follows:


    ```

    color r;

    r = color(255, 0, 0); // The variable r now holds a red color.

    ```'
