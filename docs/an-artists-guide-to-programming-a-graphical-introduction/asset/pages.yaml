  md: '# Sketch 9: A Rectangle


    You could draw a rectangle by drawing four lines that represent the edges, but
    the Processing system would not consider this to be a rectangle; it has no way
    to know that the four lines are a single object. Instead, Processing has a function
    for drawing rectangles, called rect(). Rectangles will be filled with the current
    fill color, just as circles were.


    The default way to specify a rectangle is CORNER mode, where the first two parameters
    you supply are the coordinates of the upper-left corner of the rectangle, followed
    by the width and height, in pixels. If you specify CENTER mode, the first two
    parameters are the coordinates of the center of the rectangle. CORNER mode specifies
    the coordinates of the first corner, then the coordinates of the diagonally opposite
    corner. You can change the mode using one of the following calls:


    ```

    rect(CORNER);

    rect(CENTER);

    rect(CORNERS);

    ```


    In this sketch we use CORNER mode, as specified in the setup function, and fill
    the rectangle with a shade of: (200, 0, 160). In the previous sketches, the mousePressed()
    function sets a Boolean variable to true when the mouse button is pressed ①, and
    mouseReleased() clears the variable (sets it to false) ②.


    The global variables x and y represent the first corner of the rectangle and the
    current value of mouseX ③ When the mouse button is pressed, we set x and y to
    the current value of mouseY ④, and the flag variable is set so that x has been
    set. The draw() function will draw a rectangle with (x, y) as one corner and the
    current mouse position (mouseX, mouseY) as the other ⑤. This implements the rubber
    band effect.


    Global variables x1 and y1 are the coordinates of the center of the rectangle.
    When the mouse is released, we see the values of x1 and y1 to the current mouse
    coordinates ⑥, and this completes the rectangle. The draw() function will draw
    the rectangle with the value of x1 and y1 as the opposite corner because flag
    is not false.


    Ellipses have drawing modes too, as set by the function ellipseMode(). ellipseMode(CENTER)
    is the default mode, and the one with which you are familiar. ellipseMode(CORNER)
    treats the first two parameters of ellipse as the coordinates of the upper-left
    corner and the remaining two as the width and height. ellipseMode(CORNERS) treats
    the first two parameters as the coordinates of one corner of a box enclosing the
    ellipse and the second two parameters as the coordinates of the second corner.'
