  md: '# Sketch 91: Simulating the Aurora


    Among objects that are difficult to render on a computer, the northern lights,
    or aurora, is near the top of the list. They flicker and roll, the colors change,
    the shape changes at various speeds, and they generally have no one specific shape.
    There have been efforts to draw them with more or less success; this sketch is
    one of attempts.


    There are many shapes that the aurora can take, and we will only attempt to draw
    one of those in this sketch: the typical curtain type, one example of which appears
    in Figure 91-1.


    ![](img/7534641f255e2513226c900fd85d94f3_225_0.png)


    Figure 91-1: Red and green aurora


    The sketch will make the color change slowly as a function of y position. Starting
    with a red value at the bottom of the auroral curtain, the hue will increase in
    pixels above. Starting with a hue value of h=15, the hue increases according to
    this equation.


    ```

    h = h + random(.87);

    ```


    Thus, the hue increases at a random rate, but it always increases as the y-coordinate
    changes. At the very top of the curtain, the brightness will decrease, fading
    the color away.


    Next, notice that the aurora appears to consist of vertical strokes and is banded
    horizontally. This is accomplished in the program by changing the saturation of
    the pixels periodically as a function of the x-coordinate. This is the code, where
    i is the horizontal position and s is the saturation:


    ```

    if (i%3 == 0) s = 220+random(20)-10;

    else if (i%2 == 0) s = 210+random(20)-10;

    else s = 200+random(20)-10;

    ```


    i3 is the remainder when i is divided by 3, so there is a somewhat random variation
    in the saturation, giving darker bands.'
