  md: '# Sketch 47: A Thermometer


    The original thermometer, made of glass with a colored fluid inside, had a design
    imposed by its function, but it was also an excellent way to display numeric data.
    It represents a number as the height of a colored line or rectangle. It is easy
    to see how tall a rectangle is and easy to compare to others. This idea has been
    used in many places, most noticeably on sound equipment to show volume.


    The representation on a computer is straightforward. A colored rectangle grows
    and shrinks as a function of how large a numeric variable is. Such a variable
    has a minimum and maximum value, and the rectangle has a minimum (usually 0) and
    maximum height. The mapping between the number and the height can be done as for
    the slider (Sketch 44) and the dial gauge (Sketch 45). In this sketch, it is implemented
    bit differently, but it is computed in the same way.


    This sketch computes how much taller the rectangle gets for each increase in the
    variable. If the rectangle''s height can go from ystart to yend, and the range
    of data values is from dataMin to dataMax, then the change in rectangle height
    for each data increment is as follows:


    ```

    delta = (float)(ystart-y)/(float)(dataMax-dataMin);

    ```


    Then for any data value, data, the height of the rectangle relative to ystart
    is the following:


    ```

    val = ystart-(int)(data*delta);

    ```


    This process only draws a rectangle, which is not very exciting, so we''ll add
    a background image (created specifically for this program) that contains an image
    of a glass thermometer and gradations that allow the user to interpret the height
    as a number. The coordinates of the rectangle have to be mapped specifically onto
    the image so that the rectangle aligns with the thermometer column, using a similar
    process as in Sketch 45.


    This example generates a random numeric value for display. After starting arbitrarily
    at data = 15, the values change by a small random amount each frame.'
