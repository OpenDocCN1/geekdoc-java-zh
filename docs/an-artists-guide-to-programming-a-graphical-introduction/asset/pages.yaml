  md: '# Sketch 33: Flood Fill—Filling in Complex Shapes


    Drawing a rectangle or ellipse that is filled with a particular color is easy
    to do

    Processing. You simply specify a fill color using the fill() function and draw
    the

    shape. However, there''s no function for filling an arbitrary shape or region,
    so let''s

    make one. It has the advantage of showing you how filling is done in general.


    This sketch reads an image with a white background that contains regions outlined

    with black (though you can use other colors). The regions do not have to be regular

    polygons, just that they should be closed, in that there is an inside and an outside,
    with no

    gaps in the edges. When the user clicks on a pixel, the region surrounding that
    pixel

    will be filled with a random color.


    The pixel that is clicked on has a color, the background color (bgcolor in the
    sketch).

    A random color will be selected for the fill color (variable fillColor). The goal
    is to set

    all of the pixels within the region that currently have the background color to
    the goal of

    fill color. The first step is to set the selected pixel to the fill color, followed
    by setting all

    neighboring pixels repeatedly, until no candidates remain.


    After the first pixel is changed, every background-colored pixel is a neighbor

    it it is also set to the fill color. A neighbor is defined as a pixel that is
    immediately

    adjacent either vertically or horizontally. Then all of the pixels are scanned
    again, and

    bany background pixel that is a neighbor of a filled-colored pixel is set to the
    fill color. The

    process is shown in Figure 33-1.


    ![](img/7534641f255e2513226c900fd85d94f3_91_0.png)


    Neighbors of [x,y] Set "seed" pixel Set neighbors Set neighbors of neighbors


    Figure 33-1: Filling in neighboring pixels


    The process is repeated until no change is made. The process stops at the bound-

    because boundary pixels do not have the background color and are not changed.

    This is not the only method for implementing a fill, nor is it the fastest, but
    it is prob-

    early the easiest to comprehend.


    The mouseReleased() function sets the values of the bgcolor and fillColor variables

    and sets the first (seed) pixel to the fill color. The nay() function returns
    true if the

    pixel indicated by the parameters is a neighbor to a filled-colored pixel. Each
    time

    draw() (once per frame), it displays one iteration of the filling process, so
    the

    process appears animated.'
