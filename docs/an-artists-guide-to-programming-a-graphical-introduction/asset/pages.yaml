  md: '# Sketch 19: Rotating About Any Point—Translation


    Being able to rotate objects is essential, but only being able to rotate the upper-left
    corner of the screen is inconvenient. Rotation about an object''s center is what
    we usually want, but it requires knowledge of the object. Objects can be complex
    things in graphics; an object might be just a circle or square, or it might be
    a building or a car. Processing cannot be expected to know what an object is or
    where the center might be. However, Processing makes it possible to move the center
    of rotation to any coordinate we choose, using the translate() function.


    translate() takes an x- and a y-coordinate that changes the origin to location
    for all future drawing. The following example moves the origin to the location
    (100, 200) in the window, which makes the coordinate (0, 0):


    ```

    translate(100, 200);

    ```


    The word translate means, in mathematical terms, to reposition, so a translation
    involves changing the position of an object. If we translate the origin to (50,
    50) and then draw a circle at (0, 0), the circle will appear at window coordinates
    (50, 50) on the screen. Further circles will be drawn relative to window coordinates
    (50, 50). Because rotations use (0, 0) as the axis, we can set the axis to any
    coordinates we like and rotate object about any point.


    # Example A


    As a basic example, we will draw a circle at (0, 0) using the ellipse() function
    ① and then call translate() to change the origin to (50, 50). A second call to
    ellipse() that is exactly the same as the first draws a circle at screen coordinates
    (50, 50). A further ellipse() call drawing a circle at (30, 40) draws the circle
    at screen coordinates (80, 90); that is, (30, 40) relative to the new origin at
    (50, 50).


    # Example B


    In this sketch we rotate a line about its center. The process is to translate()
    to the center of the line, in this case (150, 100) ② rotate by the current angle
    ③ and then draw the line. The coordinates of the line must reflect the fact that
    the origin is the line''s center, not one end. Because the center of the line
    is at (150, 100), the line should be drawn from -50 to +50 in the x-direction
    so as to be 100 pixels long. The translated coordinates of the start would be
    (150 – 50, 200 – 100), or (100, 100). The coordinates of the endpoint will simply
    be 100 pixels further in in x, or (200, 100). A small circle is drawn at the midpoint
    (origin) ④ that it can be seen.


    The rotation angle increases each time draw() is called ④. Since the line is drawn
    each time draw() is called, the image shows a slowly rotating line.'
