  md: '# Sketch 5: Lines


    Drawing lines is a basic thing to do in graphics. A line in Processing is really
    a line segment, and it is specified by identifying two endpoints that to be connected
    by the line. The function that draws a line is named line(), and it takes the
    coordinates of the endpoints as parameters (for a total of four parameters). The
    call line(10,10, 20,20) will draw a line in the window between coordinates (10,
    10) and (20, 20).


    # Example A


    Let''s draw some note paper. We can draw a horizontal line that runs the full
    width of the sketch window using this call, for some vertical y:


    ```

    line (0, y, width, y);

    ```


    The width of the window is given by the variable width, and the height of the
    window is given by the variable height. The start of the line is (0, y) at the
    left of the image window y pixels from the top; the end of the line is at (width,
    y) at the right of the window and the same y value.


