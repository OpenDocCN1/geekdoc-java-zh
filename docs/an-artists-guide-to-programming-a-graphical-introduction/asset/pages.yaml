    \ of stars to complete the game-like appearance.\n\nThe test to see whether the\
    \ rocket has reached a side differs from the circle example because the sprite\
    \ is a rectangular image drawn from the upper-left corner, and the distance to\
    \ the boundary differs between left/right and up/down. The test on the left edge\
