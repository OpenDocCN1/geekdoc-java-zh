  md: 'If ambient illumination is off and the background is dark, any objects drawn
    within the 3D space of the Processing graphics world will not be visible. This
    sketch simulates illumination in a new way—as a small spotlight source in a dark
    space. The spotlight shines on the center-of-scene coordinates, and the rest of
    the scene is until. The sketch places three cubes of different colors around the
    scene ⊕, and the user can explore the space by rotating and turning with the cubes
    to light up.


    This sketch uses the same code for keyPressed() as the previous sketch, so the
    avatar can rotate and move forward and backward ⊕. A Processing spotlight is placed
    at the camera coordinates ⊕:


    ```

    spotLight(255,255,20, eyex,eyey,cx,cy,cz, PI/4, 300);

    ```


    The first parameters (255, 255, 20) of the spotlight represent the RGB values
    for the color of the light, the next three (eyex, eyey, eyez) are the 3D coordinates
    of the light, and the next three (cx, cy, cz) are the coordinates towards which
    the light is pointed. This means that wherever the camera/avatar moves, a spotlight
    is shining on the center of the scene. The angle for the light, PI/4 (45 degrees)
    is the 10th parameter, and we can increase or decrease it to see what happens
    to the scene. The 300 indicates how strongly light concentrates near the center
    of the spot, with larger numbers being more focused.


    We can define lights for other types of local illumination. Car headlights, for
    example, are two spotlights separated by a small distance. There is a commented-out
    statement that adds a second light to the one in the sketch:


    ```

    spotLight(255,255,20, eyex+3*dx, eyey+3*dy, cx,cy,cz, PI/4, 300);

    ```


    Spotlights are only visible by their light reflected off of objects. They cannot
    be seen as glowing objects. The same is true of point lights and other sources.
    In sense, lights are not objects. Surrounding a light with an object illuminates
    the objects around it does not make the light source visible.


    We can make lights on and off or change color by calling the spotLight() function
    or not, depending on a flag that is true or false, named flash. Simply change
    a counter after each frame, and change the flag after a fixed number of frames
    (20 here). The following code illuminates one of two spheres alternately with
    red or blue, like police cars:


    ```

    if (count % 20 == 0) flash = !flash; // If flash is true, make it false

    if (flash) spotLight(255,0,0, 335, 0, 0, -1, 0, PI/4, 300);

    else spotLight(0,0,255, 50, 33, 0, -1, 0, PI/4, 300);

    sphere(20);

    tlate(50, 0, 0); sphere(20); translate(50, 0, 0);

    ```'
