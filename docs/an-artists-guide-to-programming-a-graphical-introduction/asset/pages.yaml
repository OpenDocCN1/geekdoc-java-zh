  md: '# Sketch 95: Metaballs–Lava Lamp


    This sketch represents an attempt to create a dynamic graphical simulation of
    a lava lamp, a popular item from the 1960s (see Figure 95-1). Most North Americans
    will recognize one, because they have undergone a resurgence in popularity, perhaps
    due to an interest in retro furnishings. The lamp is a glass container filled
    with oil. It is an incandescent lamp at the bottom and some colored wax. When
    the lamp heats up, it melts the wax, and globules slowly rise to the top, creating
    shape. Cooling globules fall to the bottom, creating a dynamic visual effect as
    the smooth surfaces move.


    ![](img/7534641f255e2513226c900fd85d94f3_233_0.png)


    Figure 95-1: A lava lamp [shown in motion online: https://en.wikipedia.org/wiki/File:Lava_lamp_(017)_ies.svg]


    Each blob in the lamp moves on its own, so we''ll use a collection of points with
    x, y coordinates that form the center of each blob, and these points can move
    about in a 2D area. We''ll create the blob in an interesting way: each one is
    a sphere, and we''ll render a 2D view looking down at the part of the 3D blobs
    that have z (height) values greater than a threshold, like an aerial view of an
    island sticking out of the water (Figure 95-2). These 3D functions are referred
    to as isososurfaces or metaballs.


    ![](img/7534641f255e2513226c900fd85d94f3_233_1.png)


    Figure 95-2: How the threshold slices the 3D function


    As two metaballs get close to each other, the height of the area where they intersect
    is the sum of the two objects, and as they get nearer, this region will exceed
    the z threshold, so it will appear in the 2D rendering (Figure 95-3). This creates
    the illusion of wax blobs interacting.


    ![](img/7534641f255e2513226c900fd85d94f3_233_2.png)


    Figure 95-3: How the metaballs add up to produce a blob


    We will use a simple function for the metaball: a sphere, as defined by the named
    equation (). It defines a pixel value at any point x, y with respect to a sphere
    k at some other point, as follows:


    ```

    radius[k] / sqrt( (xx-x[k])*(xx-x[k]) + (yy-y[k])*(yy-y[k]) )

    ```'
