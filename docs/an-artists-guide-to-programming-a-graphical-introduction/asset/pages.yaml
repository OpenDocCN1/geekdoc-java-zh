  md: '# Sketch 9: A Robot Arm


    The word robot is often associated with a human-shaped mechanical device, but
    by far the most common robots are more restricted devices with a single function
    and a small range of motion. An example would be the kind of robot that welds
    joints or paints cars in factories. These frequently look like an arm, complete
    with multiple joints and some kind of tool at the end of the arm where the hand
    would be. This sketch allows a user to move a 2D simulation of the arm using key
    presses.


    The robot in the simulation is typical of the type described, as with the commercially
    available PUMA. It consists of three linked segments, each of which can be rotated
    at the joint, as shown in Figure 96-1. The joints are the shoulder (angle1), joined
    by the biceps to the elbow (angle2), joined by the forearm to the wrist (angle3),
    which connects to the hand. The user controls the angles by using the joints:
    angle1 is controlled by Q and E, angle2 by A and D, and angle3 by Z and C.


    ![](img/7534641f255e2513226c900fd85d94f3_235_0.png)


    We represent each section by an image. The axis of rotation is not the upper-left
    corner or the center of the image but instead is a point in the image where the
    joint is connected to the previous one. The angle for joint is increased by pressing
    one key and decreased by another, but because they are connected to each other,
    the rotations must be relative to the previous section. The rotations are computed
    from the shoulder to down. Then the hand is drawn at the final rotated location
    (three rotations), the forearm is drawn at the location previous (two rotations),
    and finally the bicep after its rotation. This is accomplished using the Processing
    functions pushMatrix() and popMatrix(); the shoulder is joined and then the state
    pushed ①, the elbow is rotated and pushed ②, the wrist is rotated and drawn. Then
    we restore the previous state, draw the bicep ③, and perform one more restoration.


    The images that represent the arm parts must be analyzed and the results coded
    into the program as coordinates. For example, consider: this is where the bicep
    (armA in the code) meets the forearm (armB in the code). The point where it has
    an offset from the image by a different amount, as shown in Figure 96-2. For the
    bicep, the point of contact is (16, 37) as measured from its upper left. The connection
    to the forearm is at (31, 25) relative to the that image, which is its axis of
    rotation as well. So, to rotate the forearm, we first translate it by (-31, -25)
    so that it appears at the correct place. The forearm must be translated when drawn
    so that the connection on the bicep at (16, 37) aligns with the connection on
    the forearm-arm at (31, 25), so the next translation is (16–30, -(37–24)), or
    (17, -13). We reverse the sign on the y-coordinate because the direction of y
    is reversed from the usual y-axis-'
