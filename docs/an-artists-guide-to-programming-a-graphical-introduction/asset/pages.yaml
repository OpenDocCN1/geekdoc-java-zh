  md: '# Sketch 85: Mapping Live Video as a Texture


    In the previous sketches, you saw that a Movie object can be treated as a PImage
    for display purposes and even for extracting pixels from a video frame. This sketch
    shows the use of a video as a texture for a 3D surface, again like PImage. The
    idea is to paint a four-cornered plane (a quad) with a movie so that the video
    plays on a 3D plane and is foreshortened as the user''s point of view changes.


    The first part of the sketch sets up the webcam (as before), establishes the camera
