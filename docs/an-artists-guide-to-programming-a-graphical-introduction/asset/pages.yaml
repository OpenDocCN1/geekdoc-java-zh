  md: '# Sketch 36: Text Animation


    Animating text can create an interesting effect. It has been used in commercials
    and by artists in the past, but it has never been as easy to do as it is now.
    A string can be drawn along a curved path, even a moving curved path; characters
    in the string can change in orientation, size, color, or even fact. Motion can
    vary according to user input, either by following the mouse or moving as a result
    of audio or video input.


    A key to animating text is to access each character in the string using the charAt()
    function. The first character in the string str is returned by str.charAt(0),
    the second character is str.charAt(1), and so on. In this way, each character
    can be accessed individually and made to behave in a different way from other
    characters.


    This sketch causes the word Processing to explode, the component letters flying
    in all directions at different speeds; character sizes change too. Each character
    has a distinct position (arrays x and y), velocity (arrays dx and dy), and size
    (array size) ①


    Initially, we draw the word Processing neatly in the center of the screen as a
    set of individual characters ②:


    ```

    for (int i = 0; i<c1; i++)

    text(si.charAt(i), x[i], y[i]);

    ```


    After a few seconds (60 frames) ③, we change the position of each character every
    frame ④, thus moving them, and we adjust individual sizes too. The characters
    move off in random directions, eventually disappearing from the screen.'
