  md: '# Sketch 1: A Circle


    Drawing a circle requires quite a bit of in C or Java, but it''s one of the simplest
    programs in Processing. There isn''t a circle function in Processing, so to draw
    a circle we draw an ellipse that has equal width and height, which is the same
    thing as a circle.


    # Example A


    The setup() function calls the predefined size() function to open a sketch window
    with a width of 400 pixels and a height of 300 pixels.


    The draw() function draws a circle every time it is called (60 times per second
    by default) with the ellipse() function, which has four parameters. The first
    and second parameters specify the pixel coordinates of the ellipse''s center.
    The third and fourth parameters specify the ellipse''s width and height. The call
    ellipse(200, 150, 50, 50) draws an ellipse centered at (200, 100) that is 50 pixels
    wide and 50 pixels high, which is essentially a circle with a diameter of 50 pixels.


    By default, the background color is set to a medium grey, and the color that fills
    the circle is white. The circle is outlined by a black line.


    # Example B


    This example is like Example A, but now the background color is set to white,
    and the color that fills the circle (and any other basic shape) is set to black.


    The background() function specifies the background color with a single number
    parameter ranging from 0 to 255 where 0 is black and 255 is white. Numerical values
    outside of this range are illegal. In this case the color is set to white (255).
    The background() function is specified in the draw() function so that the background
    is redrawn each time. If background() was called in setup(), the background would
    only be drawn once, at the beginning of execution.


    The fill() function specifies the fill color of basic shapes with the same single
    number parameter as the background() function. In this case fill color is set
    to black (0), and it remains until changed by another call to fill(). Thus, fill()
    could have been called once within setup() and the effect would have been the
    same.


    # Example C


    In this case the background color (white = 255) and fill color (black = 0) are
    specified in setup(). This sketch draws two ellipses, not circles, in the draw()
    function to show how the width and height parameters are used. The first call
    to ellipse() draws the leftmost ellipse, which is 100 pixels wide and 50 pixels
    high. The second call to ellipse() draws the rightmost ellipse, which is 50 pixels
    wide and 100 pixels high.


    The noFill() function causes ellipses and other objects to be drawn without any
    fill color so that the background color shows the object.'
