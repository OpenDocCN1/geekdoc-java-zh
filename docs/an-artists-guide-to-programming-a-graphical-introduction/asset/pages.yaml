  md: '# Sketch 7: Lines with Rubber Banding


    We are using the mouse to draw lines again. A line consists of a starting point
    and an endpoint, having an x and a y component. We previously drew a line when
    the mouse was clicked on start and end points on the screen, but it only drew
    one line. What if we wanted to be able to draw many lines like this?


    We define a starting point when the mouse is pressed ❶ and the endpoint when the
    button is released ❷, as we did before. But now we can store these points in arrays
    and draw them all during each screen update. The arrays x0 have the starting x-coordinate
    of a line, and y0 has the corresponding y-coordinate. The arrays x1 and y1 store
    the end coordinates. When the mouse is pressed, and when the mouse is released,
    we draw the endpoint as x[n] and y[n] and increment the value of n. This program
    will allow us to draw 256 lines because of the fixed size of the arrays.


    When the starting point has been selected, we draw a line from that point to the
    current mouse coordinates to show how the line would look ❸ This is called rubber
    banding because the line appears to stretch and contract as the mouse moves. When
    the mouse button is released, we finalize the end coordinates and draw the final
    line.


    During each frame (the default is 30 frames per second) we draw all of the saved
    lines by calling x0[i], y0[i], x1[i], y1[i] for all i from 0 to n-1. We draw the
    rubber band line if the mouse button is currently pressed (when down is set to
    true) false when the button is released, within mouseDown. If down is true, a
    line is drawn from the last selected coordinates:


    ```

    line(x0[n], y0[n], mouseX, mouseY);

    ```


    This implements the rubber banding.


    As a new idea, the sketch implements an erase feature. If the user types the BACKSPACE
    key, a user-defined function named keyPressed() ❹ is called. A variable named
    key provides the value of the key that was pressed, so inside keyPressed(key)
    we check if the key is BACKSPACE, and if so we decrease the value of n (the number
    of lines so far) by 1. As a result, the last line will not be drawn, and the next
    line will be saved over the erased line in the coordinate arrays.'
