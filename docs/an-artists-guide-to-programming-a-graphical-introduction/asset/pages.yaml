  md: "# Sketch 10: Spring-Mass System\n\nIn this sketch we will simulate a spring-mass\
    \ system. We will use a simple Euler method to solve the equations of motion.\
    \ The force exerted by the spring is F = -kx, where k is the spring constant and\
    \ x is the displacement from the equilibrium position. We also include a damping\
    \ force F = -cv, where c is the damping coefficient and v is the velocity.\n\n\
    ```\nvoid setup() {\n  size(600, 400);\n  background(255);\n}\n\nvoid draw() {\n\
    \  background(255);\n  float k = 0.1;\n  float c = 0.05;\n  float m = 1.0;\n \
    \ static float x = 0, v = 0, dt = 0.1;\n  float a = (-k * x - c * v) / m;\n  v\
    \ += a * dt;\n  x += v * dt;\n  ellipse(300 + x, 200, 20, 20);\n}\n```\n\n![](img/7534641f255e2513226c900fd85d94f3_13_0.png)\n\
    \nThe following graph shows the displacement of the mass over time.\n\n![](img/7534641f255e2513226c900fd85d94f3_13_1.png)\n\
    \nThe following graph shows the velocity of the mass over time.\n\n![](img/7534641f255e2513226c900fd85d94f3_13_2.png)\n\
    \nIf we increase the damping coefficient 'c', we can see that the oscillations\
    \ decay more quickly.\n\nThe code is available to you. Use it, change it, share\
    \ it. You can download the code and all the necessary supporting files (images,\
    \ sound files, and so on) at https://nostarch.com/artists-guide-programming/\n\
    \nSome concepts will be more complex than others, of course. There is plenty of\
    \ documentation for Processing on the internet, beginning with the https://processing.org/site.\
    \ Processing can be used with Arduino computers too. It has modules for sound,\
    \ video, and scientific calculations, and it can be used to present images in\
    \ a browser. It is my hope that this book will allow you to start experimenting\
    \ with programming and generative art.\n\nWhy are there few comments in the code?\
    \ To save space on the right page! The entire left page is a description of the\
    \ program and method, so it is in a large comment.\n\nJim Parker"
  merge: -1
