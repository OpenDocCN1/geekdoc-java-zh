  md: '# Sketch 21: Getting the Value of a Pixel


    While developing Sketch 14, we discussed how to get a pixel value from a PImage
    using the get() function. We can get the color value of the pixel at (x, y) in
    a PImage named im as:


    ```

    color c;

    PImage im;

    c = im.get(x, y);

    ```


    The picture currently being displayed in the sketch window has a privileged position
    because it cannot be accessed without using a variable. A pixel value on the screen
    can be obtained by simply calling get():


    ```

    c = get (x, y);

    ```


    We can therefore get the color of the pixel at the current mouse position with


    ```

    c = get (mouseX, mouseY);

    ```


    This sketch loads an image and allows the user to click any pixel to see its color,
    which will be displayed on the right side of the screen as a colored bar and RGB
    values in text form. The first sketch loads an image and sizes the window to fit
    it, with an extra region on the right side. In draw() it displays the image with
    a background color of (200, 200, 200) ❶; when the mouse button is pressed, it
    assigns the pixel value (color) at mouseX, mouseY coordinates to the color variable
    c ❷; it displays the color on the right side of the image and the RGB values as
    text at the upper-right corner of the screen ❸. Whenever the mouse button is clicked,
    the color value displayed will change.


    > NOTE Another way to describe a color is with the HSB system, in which the three
    color values represent the hue, saturation, and brightness. Hue is the actual
    color, such as red or blue. Saturation indicates the intensity of the color. Brightness
    indicates a value of light. Changing to HSB mode in Processing is done by calling
    colorMode(HSB, 256), for example, in which each of H, S, and B have values between
    0 and 255. The call colorMode(RGB, 256) would return to the default RGB coordinates.


    No matter what the color mode is, the function hue(c), when c is a color, will
    return the hue value. The functions saturation(c) and brightness(c) yield the
    other two HSB components.'
