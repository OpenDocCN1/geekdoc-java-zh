  md: "# Sketch 25: Elements of Programming Style\n\nStyle in a program refers to\
    \ the code that doesn't usually impact the execution but that do have an effect\
    \ on how other people read, modify, or repair it.\n\nFor example, there is a way\
    \ to place human-readable text in a program for other programmers to read. Any\
    \ text that follows a pair of slashes is called a comment, and it is ignored by\
    \ Processing; as it is any text between the symbols /* and */ which delineate\
    \ comments that can span many lines. Programs should have relevant comments embedded\
    \ within the code to explain what is going on any human looking at it. Comments\
    \ should be clear, offer an explanation, and never simply replace the code itself.\n\
    \nThe nature of the comments in a program is one aspect of what we call indentation\
    \ to convey structure. There is no single correct way to indent, but the standard\
    \ shown in the sketches in this book has consistent features. For example, the\
    \ \"[ and \"] characters used to enclose blocks of code always line up with each\
    \ other vertically so that the blocks are easy to identify. The only exception\
    \ is when they are on the same line:\n\n```\nif (x0 < 0) {\n  x0 = mouse;\n  y0\
    \ = mouseY;\n}\n```\n\nIn other books, you might see another style:\n\n```\nif\
    \ (x0 < 0) {\n  x0 = mouse;\n  y0 = mouseY;\n}\n```\n\nThe location of brackets\
    \ doesn't matter to the programming language's compiler, but a programmer should\
    \ be consistent.\n\nVariables should have meaningful names. The variables x0 and\
    \ y0 above represent x-and y-coordinates, so the names make sense. A variable\
    \ named pixelCount should contain a count of pixels. It is pretty easy to give\
    \ variables names, and doing so does not impact how fast the code is or how much\
    \ memory it requires in order to execute.\n\nNumeric constants should be named\
    \ variables so that the purpose of the constant can be inferred from the name.\
    \ A perfect example is PI instead of 3.1415. A program should contain very few\
    \ any numerical constants, and names should be used instead. Consider the following\
    \ code:\n\n```\nr = d*0.01745;\n```\n\nThe number 0.01745 is meaningless to most\
    \ people. Now consider this:\n\n```\nr = d *2*PI/360.0;\n```\n\nThis is better.\
    \ Two times PI/360 is the conversion between radians and degrees. Best would be\n\
    \n```\nradians = degrees * degrees_to_radians;\n```\n\nwhere degrees_to_radians\
    \ equals 0.01745. Now anyone reading the code can easily see what is happening."
