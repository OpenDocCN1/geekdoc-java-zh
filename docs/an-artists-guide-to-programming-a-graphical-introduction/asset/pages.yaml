  md: '# Sketch 100: Processing sketches on the Web


    Processing sketches can easily execute within a browser, requiring little to no
    modification to make dynamic and interactive web objects. The system that allows
    this is Processing.js; it converts the Processing sketch into JavaScript before
    running it and displays the result in an HTML5 canvas.


    There are four steps in running a sketch for the web:


    +   1. Download Processing.js. This means going to a site like https://processingjs.org/download/
    and getting the files processing.js and processing.min.js.

    2. Create the Processing sketch. We''ll use Sketch, the aurora simulation, as
    our example. This sketch will be named sketch100.pde.

    3. Create a web page within you''ll embed the sketch. It must load processing.min.js
    as a script in the header of the page

    4. Create a canvas, specifying sketch100.pde as a data source


    ```

    <script src="processing.min.js"></script>

    <canvas data-processing-sources="sketch100.pde"></canvas>

    ```


    This will only work properly on a web server, so you need to upload all files
    to a server and display the page from the internet, or install a server on your
    computer.

    All three files—the HTML source, the sketch, and processing.min.js—should be in
    the same directory on the web server. When the page is loaded, the sketch should
    run and display results in the canvas.


    There may be other issues depending on the sketch. First, if the sketch uses images,
    these must be preloaded so that their size and other properties are available
    when the sketch runs. A preload directive must appear at the beginning of the
    sketch. For example, in this case, the trees.gif and stars.jpg are used


    ```

    /* pjs preload="trees.gif, stars.jpg"; */

    ```


    Be careful, if the sketch uses integers. The Processing code is translated into
    JavaScript, which has no integer type. Integers will become floating-point values.
    Any program that depends on integer arithmetic (like 5/2=2) will not work properly.

    Any program that requires a Java library won''t work either. Minim is a Java library,
    and there are JavaScript variations of these, but using them will require learning
    how JavaScript works and how to access JavaScript from Processing and vice versa.


    The HTML code for the web page follows the code for the sketch on the next page.'
