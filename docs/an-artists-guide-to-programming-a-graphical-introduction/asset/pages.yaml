  md: '# Sketch 30: Detecting Sprite-Sprite Collisions


    It is a relatively simple matter to decide whether a sprite is still within a
    window, but the window remains fixed and the window doesn''t move. But what if
    the size of the window changes at the same time? How would we determine if any
    two sprites moving at the same time collided when both were moving? The situation
    of circular objects is the simplest and a general solution, so this sketch will
    handle an arbitrary number of circular objects (balls) that will bounce off the
    boundaries and each other.


    The coordinates of each ball will be stored in xpos[i] and ypos[i]. Drawing object
    i is simple ②


    ```

    ellipse(xpos[i], ypos[i], 10, 10);

    ```


    Any two objects collide if they get near each other than twice the radius, or
    if their 10 pixel areas overlap. Here are the steps in the sketch:


    +   1. Define positions and speeds (dx, dy) for each of n balls.

    2. Each step (frame) is defined by a call to draw(). First, draw a circle at each
    location xpos[i], ypos[i] ③.

    3. Change the position: xpos[i] = xpos[i] + d[i], and for the same for y ④.

    4. Check for a collision with the boundary (bounce), and if there is one, implement
    the reaction to the collision. A bounce? ⑤


    For each ball, check the distance between it and every other ball. If the distance
    is less than twice the radius, then change the direction of both balls (implementing
    a collision as a bounce) ⑥


    And that''s. The bounce() function ⑦ is a different from the previous one, but
    it effectively does the same thing. The distance() function calculates the Euclidean
    distance between the two balls, as you saw in Sketch 24. If two balls overlap
    after bouncing, they could stick together until they collide with another ball.


    NOTE A rectangular object NxM pixels in size (N > M) has a circle that surrounds
    it that can be used to check collisions. The center is (N/2, M/2) and the width
    is N. Using a bounding circle is not precise, but it is quick. The enclosing circle
    for the spaceship in Sketch 29 is shown in Figure 30-1.


    ![](img/7534641f255e2513226c900fd85d94f3_85_0.png)


    Figure 30-1: The enclosing circle for a rectangular object


    64 Part 3'
