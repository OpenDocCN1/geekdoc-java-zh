  md: '# Sketch 18: Rotation


    When rotating something, we always need to specify an axis of rotation, in which
    two dimensions is a point and an angle. A rotation is specified using a call to
    the function rotate(),


    ```

    rotate(angle);

    ```


    where angle is specified in radians. A circle contains 2π radians and also 360
    degrees, so to convert from degrees to radians means multiplying the degrees by
    3.14159/180.0, or by using the Processing function radians(x). The point (axis)
    about which the rotation will take place is the origin of the window''s coordinate
    system, (0, 0), by default. It is the upper-left corner of the window, and the
    rotation will be clockwise around this point.


    When a rotation is specified, all things drawn from that point will be rotated.
    Calling rotate() again rotates it by a further angle. Turning off the rotation
    is not possible, such as but a call to rotate (-angle) will undo the call to rotate(angle).


    # Example A


    The first example draws a figure illustrating rotations. A horizontal line is
    drawn and labeled ①, followed by a line that is rotated by 10 degrees ② and then
    by one rotated by 20 degrees ③. To avoid the text rotated, the rotation is “undone”
    (rotated by the negative angle) before drawing the text labels.


    # Example B


    A line is drawn from the origin. It has a small ball on the end. This line is
    rotated from 0 to 90 degrees in small steps, with each step displayed within draw()
    because the line and ball are drawn there. When the line is rotating clockwise,
    the angle is incremented by 0.01 radians each time draw() is called ④. When the
    line becomes vertical and further out of view, the change in angle for each frame
    (variable d) is changed to -d ⑤. Now the line rotates back to its original position,
    and at that point (0 degrees) the value of d is changed to become positive again.
    The object, which looks like a pendulum, bounces between 90 degrees and 0 degrees.


    The rotation angle is reset to 0 each time draw() is called.'
