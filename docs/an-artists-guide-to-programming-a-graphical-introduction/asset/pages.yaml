  md: '# Sketch 23: Changing the Values of Pixels—Thresholding


    The act of thresholding an image changes the color value of each pixel to either
    black or white, depending on the original color or brightness. Thresholding creates
    a binary image: each pixel can be thought of as either on or off. Why do this?
    Some images have content that is fundamentally binary; a scan of a text has black
    characters on a white background. In other cases, it is a way to simplify an image
    so that we can perform other operations, such as detecting edges or features.
    Thresholding an image of red blood cells might facilitate counting them, for example.


    Thresholding an image is a two-step process: one that retains the features of
    the image. We usually do this by examining all the pixels in the image and computing
    a value using some statistical formula. A threshold value is a number between
    0 and 255; all pixel brightness values smaller than the threshold will be set
    to black (0), and those greater will be set to white (255).


    To address the second step first applying the threshold is a simple matter of
    looking at each pixel and deciding whether it is less or greater than threshold.
    we assign the value to the variable g, extract the brightness, and then test it:


    ```

    if (threshold) g = black;

    else g = white;

    ```


    The value black is the color (0, 0, 0), and white is (255, 255, 255).


    In this sketch, we will determine the threshold manually, using the mouse position.
    This is the horizontal position of the mouse as a percentage of the total window
    width:


    mouseX/width


    If we multiply this fraction by 255, we get a value between 0 and 255 that is
    in proportion to how far to the right the mouse is. We''ll use this value as a
    threshold. When the mouse is on the left side of the window, the threshold will
    be small and most of the image will be white; when the mouse is on the right,
    the threshold will be large and the image will be largely black.


    The draw() function calculates and applies the threshold, it will be dynamic,
    and we can watch the image change as the mouse moves.


    When calculating a threshold from pixel values, we could select the average pixel
    level as the threshold; the implication here is that half the pixels would be
    black and half white. However, this is not a good method for text, because many
    more pixels in a text image will be white than will be black. There are many other
    algorithms for thresholding images, but there is no best one in general.


    We could also threshold each color value separately to create interesting images,
    with each color either full on or full off.'
  merge: -1
