  md: '# Sketch 70: Warping an Image


    In 1991 the general public saw *morphing* for the first time, an effect that uses
    a computer to smoothly convert one image into another. The computer produces a
    small sequence of images that, when played back as a video sequence, an object
    appears to continuously change shape to become the other. The film *Terminator
    2* used it and, arguably most strikingly, the Michael Jackson music video for
    the song "Black or White" used it in a sequence where faces morphed into one another.
    This sketch performs a warp or bending of an image, but does not do a complete
    morph.


    The principle underlying the morphing method is called a *polynomial warp*. Imagine
    we place an image over a regular grid and then bend the grid using a mathematical
    function and take the image with it. The result is an image that changes in a
    particular way—a warp. Morphing between two images requires that we establish
    a correspondence between the image, usually by a human. A function bends (maps)
    one image into another (warp) while the pixel values change systematically from
    the source to the destination values.


    If the image is a face and the warp is based on a sine curve, we create an effect
    that looks like a funhouse mirror, as shown in Figure 70-1. The geometry of the
    original face bends (*maps*) into that of the new one according to the function.


    ![](img/7534641f255e2513226c900fd85d94f3_175_0.png)


    Figure 70-1: Warping a face


    This sketch implements an image warp. We read an image and display the pixels
    according to a sine function transformation of coordinates. The original image
    is source, and this is the mapping between original and new pixel coordinates:


    ```

    newX = (int)(x+ size*sin(radians(3*y)));

    newY = (int)(y+ size*cos(radians(4*x)));

    ```


    This mapping is arbitrary, chosen for an amusing effect. The loop that does the
    mapping ① has to map pixel values from the destination back to the source, the
    other way around. Each pixel in the source does correspond to a pixel in the destination,
    but there may be unmapped pixels in the result if we do not mapping the other
    way. So for each pixel (x,y) in the destination image, we transform it to (newX,
    newY) using the desired function and then find the corresponding pixel in the
    source image. We then set the destination (x,y) to the source (newX, newY).


    In the sketch, the values of ds and size are parameters to the transformation
    function, and they change slightly each frame ②, creating a cyclical change in
    the image that a person would perceive as an animation of the bending or warping
    motion.


    154 Part 8'
