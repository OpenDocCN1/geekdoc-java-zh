  md: 'Craig Reynolds created a system called Boids in 1986. It was a simulation of
    the behavior of birds when in a flock, or fish in a school. A flock is a collection
    of distinct objects of the same kind. They move, and end up in the same place.
    They also don''t wish to hit each other. The simulation involves knowing where
    each object is, how fast it is moving, and what direction it is traveling, and
    then updating the position of each object iteratively. Three rules make the objects
    a flock:


    **Separation** Objects try to maintain a small distance between themselves and
    their neighbors. During each iteration, object moves away (if possible) from any
    neighbor near them a distance d.


    **Alignment** Objects try to match velocities with nearby objects. This keeps
    them from spreading out too much. We compute a local velocity as seen from the
    object and then add a fraction of that to the object''s velocity for the next
    iteration.


    **Cohesion** An object will try to move toward the center of mass of its neighbors.
    This keeps them in a group. We find the center of mass, not including the current
    object itself, and move the object a (1 percent to 3 percent) of the way toward
    that point.


    Each position is stored as a vector (Vector object) that has an x and y component.
    The vector array flock stores the velocity of each object. The draw() function
    calls functions that move and draw the object. match() computes a new velocity,
    trying to match neighbors center() moves each object toward the center of mass
    and away() attempts to keep the spacing between objects. We call each of the three
    for each object during each iteration. Each of these functions returns a value
    that we add to the object''s position. Objects are small circles, and they will
    follow the mouse as we move it.


    Read more about Craig Reynolds at https://www.red3d.com/cwr/.'
