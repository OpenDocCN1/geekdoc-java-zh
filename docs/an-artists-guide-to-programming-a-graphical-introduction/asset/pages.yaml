  md: '# Sketch 87: Time Differences—Measuring Reaction Time


    Measuring the time between two events is the subject of this sketch: in particular,
    the time between a prompt by the computer and a response by the user, the reaction
    time. A typical (average) reaction time for a human is about 0.215 seconds. That
    is, between the time that a light goes on and the time that someone can press
    a button in response, an average of 215 milliseconds pass.


    This sketch measures reaction time by having the user click the mouse as quickly
    as they can when the background changes from grey to green. The background changes
    back to grey, and the cycle repeats five times. The program measures the time
    between the screen turning green and the mouse click using the millis() function,
    and it averages the five trials to get a more precise measurement.


    We use millis() the function used in the previous sketch to move the second hand,
    second() only returns seconds. millis() returns the number of milliseconds (1/1,000
    seconds) since the sketch started executing. On the face of it, that value does
    not seem to have much meaning, but it does mean that the time difference between
    two events can be measured accurately. Simply call millis() when the first event
    happens, save the value, call it again when the second event occurs, and subtract
    the two.


    The millis() function can be used for other purposes, the least of which is to
    determine how long it takes for a particular loop or function to execute. This
    sort of measurement is important when a program takes too long and the programmer
    needs to find ways to speed it up. Measuring one call to a function would not
    likely work, because most functions execute too quickly to measure, even slow
    functions. Instead, we put a function to be tested within a loop and execute it
    by the number of iterations to determine the time needed for a single execution.
    Here is how the function get(12,100) could be timed:


    ```

    t1 = millis();

    for (int i=0; i<100000000; i++) y = get(12,100);

    t2 = millis();

    println("Time was "+(t2-t1)+" or +((t2-t1)/100000000.0));

    ```


    The times obtained vary so taking an average over many trials should give a more
    accurate result. Execution times may change depending on what other programs are
    executing at the same time or how many virtual memory page faults occurred.'
