  md: '# Sketch 32: Frame Animation


    Animation involves displaying a sequence of still images on the screen at such
    a rate that the human visual system interpolates changes in position in the images
    and perceives motion. It is an illusion, in much the same way any motion picture
    is an illusion. The previous sketch animated a display in a very basic manner,
    creating the illusion of random TV images by generating them with code. Most animations
    require that image sequence be created by an artist and then displayed as a sequence.


    For a Processing sketch to display an animation, the program has to read in the
    images (*frames*) to be displayed and then display them one after the other. The
    set of frames can be stored in an array of PImage values, one per frame.


    The two examples in this sketch use an image sequence that represents the gait
    of a human; the 11 images compose one entire cycle of a single step, and repeating
    them makes it appear as if the character is walking.


    # Example A


    Eleven images, named *a000.bmp* through *a010.bmp*, represent the animation. The
    program reads the images into consecutive elements of the frames array ①. The
    *draw()* function displays the next image in sequence each time it''s called,
    increasing an index variable *n* from 0 to 10 and decreasing it to 0 again repeatedly
    ②.


    # Example B


    In Example A we needed to know in advance how many images belonged to the animation.
    In Example B we only require the names of the files begin with *a000.bmp* and
    the number increases by one for consecutive images. When the program fails to
    read an image file, as indicated by the fact that *loadImage()* returns null,
    the program presumes that all of the images have been loaded ③. The program counts
    the images as they are read and then displays them as before.


    The loop within which the images are loaded has a break ④ statement in it to escape
    the loop when *null* is detected.'
