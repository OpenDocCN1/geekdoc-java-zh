  md: '# Sketch 28: Bouncing Object in a Window


    This sketch illustrates a good way to check whether an object is within a sketch
    window (though it is only completely accurate when the object is circular). The
    object here is a circle, or a ball if you prefer. The program moves the ball,
    and when the ball moves the window boundary (the "wall"), it bounces, or reverses
    direction.


    A simple test establishes whether the ball has exceeded the boundary. In the case
    of the right boundary wall, for example, it''s whether x + radius > 0, where x
    is the ball''s center position, radius is the radius, and width is the width of
    the window. If the ball is moving slowly enough, we can simply reverse the direction
    of motion when the ball passes this test by changing dx (the amount the ball moves
    horizontally between each frame) to -dx. However, this approach isn''t completely
    accurate, and it gets worse when the ball moves at high speeds. Why? Because the
    ball will move past the boundary before the program determines that it has reached
    the boundary. Consider the situation in Figure 28-1.


    ![](img/7534641f255e2513226c900fd85d94f3_81_0.png)


    The ball moves dx pixels each iteration. If it places the ball past an edge of
    the window, we place it the same number of pixels before it moved, past the edge
    that it moved, change its direction. This keeps the pixels-per-second velocity
    constant.


    Figure 28-1: A fast-moving ball might overshoot the boundary before you can tell
    it to bounce back.


    If this dx has the ball moving several diameters per frame, it can easily be on
    the left of the wall in one frame and on the right of the wall in the next. At
    some time in between, it must have collided with the wall. In that case, the amount
    the ball has overshot the wall should be found, and the ball should be placed
    an equivalent distance to the wall, to simulate a bounce. We calculate that distance
    as delta (Δ), and it equals (x + radius) - 0 for a circle. Given this distance,
    the ball''s new, post-bounce x position is width - delta radius - 0, as shown
    at the bottom of Figure 28-1.


    At the left side of the window, we know the ball has overshot the boundary when
    x < radius 0. In this case, we position the ball by setting x to (2 * radius)
    - x, and we reverse the ball''s direction of motion.


    The vertical (y) situation is symmetrical 0.


    Most objects are not circular but can have a (virtual, invisible) circle drawn
    around them, and we can use this circle to detect collisions against the boundary.'
