  md: '# Sketch 79: Recording and Saving Sound


    This sketch captures the audio currently playing on the computer and saves it
    in a file in .wav format. This would permit recording sound from Skype calls,
    websites, and podcasts, to name a few.


    In Sketches 75 and 76 we used Minim and an AudioInput object to access the currently
    playing sound for visualization. In this case, the next step is to create an AudioRecorder,
    which takes as a parameter an input from which we can collect sound; that is,
    the AudioInput object connected to the currently playing sound.


    An AudioInput has three functions (methods) of sound:


    ```

    beginRecord() Start saving audio samples.

    endRecord() Stop the audio samples.

    save() Store the saved samples as an audio file.

    ```


    How much audio data we can save depends on the memory available on the computer.


    The sketch opens a window and displays the playing sound signal as in Sketch 75.
    If the user types the R character Ⓡ (handled by keyReleased()), we call beginRecord()
    and start saving data. If the user types Q Ⓗ or S Ⓢ, we call save and the recording
    stops.


    We specify the file used to save the data as a parameter on the creation of the
    AudioRecorder Ⓘ:


    ```

    recorder = minim.createRecorder(input, "processing.wav", true);

    ```


    Here, input is the already existing AudioInput object, processing.wav is the file
    where we''ll save the sound data, and the final parameter represents whether or
    not the recording is buffered, which is to say whether the data is saved in memory
    or written directly to the file. If it''s not buffered, the system opens the file
    when recording begins. Otherwise the system opens the file when we write the data.


    A small change to this code would allow the user to save to a different file each
    time they start and stop recording. This could be useful for voice recording,
    such as reading scripts or reading books to tape.'
