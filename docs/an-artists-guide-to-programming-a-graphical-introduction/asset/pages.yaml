  md: '# Sketch 39: Reading Parameters from a File


    Many computer programs save values in use when the program starts, or restarts.
    Initial values, locations for buttons and other interface objects, high scores
    for a game: most people have had the experience of all read from files when a
    program begins. playing a computer game and saving the state so that you can resume
    at a later time; this also involves saving data in a file and retrieving it later.
    This sketch retrieves the state of a game, albeit a simple one—checkers—from a
    file that contains the positions of all of the checkers in a game.


    Checkers uses an 8x8 grid of squares on squares, usually referred to as black
    and white, are placed. Only half of the squares are really, and these squares
    also have two colors. checkers can only be one of those colors, so the easy part
    of this sketch is to draw the squares and place checkers on squares when it is
    known what the locations are. The new part is reading the data and interpreting
    that as checker positions


    As a scheme for representing a checker board, imagine a set of squares with eight
    rows of columns each. A square can be indexed as (i, j), where i is the row and
    j is the column. The color of the checker on the square can be 0 for one and for
    1—the colors do not matter, only that checkers of color 0 belong to the other.
    The checkers have fixed positions, but the checker locations are read from the
    file, which contains a row for the position and color of each checker, like this:


    | row col color | e.g. 1 2 1 |

    | row col color | e.g. 1 4 1 |


    The file contains one-digit integers separated by single spaces, three per line.
    A structured format is easy to read and is, in fact, typical of data that has
    been created by a computer.


    To read a file in Processing, we''ll use the built-in function loadstrings(),
    which reads a set of strings from a file (given a string parameter), with one
    string being one in the line. loadstrings() returns an array of strings that we''ll
    assign to the variable dlines. To find the number of items in the array (the same
    as the number of lines in the file), we use the length property in dlines: dlines.length.


    When a line is read in, we use it to place a checker on a square, and when all
    checkers are read in, we draw them on the screen. To place the checker, we extract
    three integers from each string in dlines and then place the correct piece in
    the correct place using the row and column indices.


    We convert the string data into numbers as follows


    ```

    y = dlines[i].charAt(0) - ''0'';

    ```


    Each piece is one of two colors, indicated by the variable k[i]. A checker is
    20 pixels wide, so we draw one at (x[i], y[i]) with these lines:


    ```

    if (k[i]==0) fill(200,0,0); else fill(200,200,000); // Color?

    ellipse(x[i]*40+20, y[i]*40+20, 20, 20);

    ```


    The horizontal position is offset from the left by 20 pixels, and each successive
    position is 40 pixels further right. The expression x[i]*40+20 gives the x location
    at which draw checker number 1. It is symmetrical for the vertical position'
