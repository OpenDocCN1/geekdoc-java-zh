  md: '# Sketch 89: Predator-Prey Simulation


    Picture rabbits and coyotes living together in their natural environment. They
    don''t get along in the traditional sense: \; coyotes tend to eat rabbits when
    they can. Rabbits can breed very quickly, whereas coyotes cannot. And, of course,
    if rabbits are the only prey, then if the rabbits all perish, the coyotes will
    also, soon after. This is a predator-prey relationship, and it can be simply modeled
    when there is only one species in each group.


    Mathematically the predator-prey relationship is represented by a pair of differential
    equations (don''t worry, very little actual math here) that look like this:


    ```

    $\frac{dx}{dt} = ax - \beta x$\n$\frac{dy}{dt} = \delta y - \gamma y$

    ```


    Here $\frac{dy}{dt}$ represents how the coyote population is growing, and $\frac{dx}{dt}$
    is how fast the rabbit population is growing. The solution to these equations,
    known as the Lotka-Volterra equations, is not important. The program will simulate
    them. In these equations, the variables are as follows:


    +   x: The number of rabbits (prey animals)

    y: The number of coyotes (predator species)

    $\alpha$: The rate at which the rabbit population grows, unfettered

    $\beta$: The rate at which prey and predators meet and a rabbit dies as a result

    $\gamma$: The rate of death of predators due to natural causes or moving away

    $\delta$: The rate of growth of the predator population


    The simulation will begin with specified values of the four variables $\alpha$,
    $\beta$, $\gamma$, and $\delta$ (alpha, beta, gamma, and delta) and will have
    known initial population sizes. It will then compute a new population each time
    draw() executes, based on the preceding equations. This is the critical code for
    the rabbits ��


    ```

    alpha = alpha*Nrabbits - beta*Nrabbits*Ncoyotes;\Nrabbits = (int)(Nrabbits + dr);

    ```


    And for the coyotes


    ```

    dc = delta*Nrabbits*Ncoyotes - gamma*Ncoyotes;\Ncoyotes = (int)(Ncoyotes + dc);

    ```


    The populations are then rendered graphically in the window. (position does not
    matter) ��, and each rabbit is a green circle somewhere on the screen ��. We can
    observe the relative populations increase and decrease as the predator population
    and the prey population change. If all of the prey die, the predators do too;
    if all of the predators die, the prey grows without limit.'
