  md: '# Sketch 99: Midpoint Displacement—Simulating Terrain


    This sketch will generate a pseudo-random terrain profile, with a darkening sky
    and twinkling stars. The heart of this sketch is the midpoint displacement method
    for generating terrain, and while this example is only two-dimensional, it illustrates
    the more general algorithm pretty well.


    The method starts with a line, which in the case of this sketch is a line that
    runs horizontally across the entire image. Next we select the midpoint of the
    line, displace it by a random value between dy and -dy, and create two lines as
    in Figure 99-1.


    ```

    x = 0

    ```


    ```

    x = width

    ```


    ![](img/7534641f255e2513226c900fd85d94f3_241_0.png)


    Figure 99-1: Splitting a line


    Then we do the same thing again with the two lines just created, except we decrease
    the value of dy. The result is four lines. Each time we generate a new line pair,
    the resulting segments can be split again using a smaller dy value until some
    termination criterion is reached. In the sketch, the initial value of dy is 75,
    and the splitting process ceases when it becomes smaller than 2.


    The splitting process is accomplished by a recursive procedure, md()


    ```

    void md(float x0, float y0, float x1, float y1, float dy)

    ```


    Here, (x0, y0) and (x1, y1) are the line segment endpoints, and dy is the maximum
    value of the random height change. This procedure finds the midpoints and calls
    itself twice, passing the left and right halves of the line and a smaller dy.
    The process continues as illustrated in Figure 99-2 until we reach the minimum
    value of dy.


    The line endpoints are then saved in an array pair, lx[] and ly[]. We don''t actually
    draw the line segments but make a filled region by drawing a line from each endpoint
    down to the bottom of the window that is as thick as half of the line segment
    x. The result is a horizon line with a convincing random nature.


    ![](img/7534641f255e2513226c900fd85d94f3_241_1.png)


    Figure 99-2: Multiple recursive splits create a realistic horizon.'
