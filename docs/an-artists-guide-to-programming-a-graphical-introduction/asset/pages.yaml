  md: '# Sketch 67: Particle Graphics–Smoke


    Some things are difficult to model using polygons: soft and amorphous shapes like
    water, fire, clouds, and smoke, for example. Such things can move in unpredictable
    ways and expand to fill arbitrary shapes. This sketch will draw smoke emitting
    from a smokestack and illustrate a key method in modern computer graphics: a particle
    system.


    A particle system combines a large number of small objects to form a complex shape.
    The objects are usually simple, like spheres or circles, and have a set of parameters
    that control their display. The basic parameters of a circle are position, velocity,
    color, and size. Initial parameters usually have a random element: speed plus
    minus a random radius. For an emitter, the location is the area where the system
    creates new particles (circles), usually with a small, random displacement, the
    particles are not exactly at the emitter.


    The particle system produces a large number of overlapping circles, possibly somewhat
    transparent, with moving slightly different speeds (unlike the previous sketch
    for density). The previous sketch drew a large number of small objects that could
    still be seen as individual snowflakes. In this sketch, if enough of these particles
    exist, we can''t distinguish them individually, and they form an object in combination.
    As the number increases and the objects overlap, the result looks like fog or
    smoke.


    The sketch defines a number of circles to be created (SIZE) and declares arrays
    for position, speed, and size of each one: the value of x[i] is the x position
    of the 12th circle. Initially, the variable last holds the index of the last defined.
    We increment last each frame as we create new circles, and we reset to zero when
    the number exceeds SIZE.


    The draw() function runs through the arrays and draws each circle that exists
    (meaning x[i] > 0). It changes the circle''s position by a small random amount,
    may change the size slightly, and gives it a color that varies around RGB = (205,
    205, 150). It creates a random number of new circles, giving them positions near
    the emitter, a vertical speed, and a small speed.


    The effect is striking. With up to 800 circles, the system yields a remarkably
    good impression of smoke moving upward. The sketch reads and displays a background
    image of a smokestack for a better visual effect.


    The outline around the circles has been turned off with noStroke(), but it is
    educational to delete that statement and run the program so that the particles
    can be seen. The way the particles move and overlap is clearer, in Figure 67-1.


    ![](img/7534641f255e2513226c900fd85d94f3_169_0.png)


    Figure 67-1: Particles showing the outline of the circles'
