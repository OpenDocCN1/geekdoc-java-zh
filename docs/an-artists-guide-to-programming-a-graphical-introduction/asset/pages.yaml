  md: '# Sketch 8: Random Circles


    This sketch draws circles at random places on the screen, with random colors.
    Randomness refers to unpredictability, and it is a complex concept. If you try
    to draw straight lines with a pencil, it is impossible that any two of them will
    be identical. There are variations that creep in and cause minor changes in each
    line. The same is true of brush strokes when painting. No two humans will be exactly
    the same, and the differences will be unpredictable but apparent.


    When using a computer, a random number generator creates numbers that are random
    with respect to each other. Random numbers can be used to simulate random events
    in games like dice or,, to do things that a user would find unpredictable, or
    to simulate complex real-world situations. For example, things like the spacing
    between cars on a road and the appearance of raindrops on a window appear random
    because we do not understand all of the complex factors that enter the situation.


    The random number generator in Processing is named random. The random (100) will
    generate a real number between 0 and 100, not including 100. The random (10, 20)
    will return a real number between 10 and 20, but less than 20. The random (0,
    width) generates a x position within the sketch window, and random (0, height)
    generates a y position.


    Like Sketch 6, this stores coordinates in arrays and uses them to draw circles
    with calls to ellipse(), but instead of drawing circles when the mouse is clicked,
    a new circle is created automatically every second. To do this, we set the rate
    at which draw() is called (the frameRate(1) in setup()). Each time draw() is called,
    we generate a new x- and y-coordinate using random() and save it in the x and
    y arrays.


    ```

    x[ncircles] = (int)random(0, width);

    y[ncircles] = (int)random(0, height);

    ```


    The (int) in front of the calls to random converts the result, a float, into a
    new type, int. This is called a cast, and we are changing the floating-point value
    into an integer because we cannot use values with decimal points as coordinates.
    This can also be done by using the function int():


    ```

    x[ncircles] = int(random(0, width));ny[ncircles] = int(random(0, height));

    ```


    The random number generator can be used to generate random dice rolls using this
    call:

    roll = int(random(1, 7));

    This call can never return the value 7, and it truncates the float values between
    1 and 2 to be 1, 2 and 3 to be 2, and so on. A random coin toss (1=heads, 2=tails)
    would be generated as follows:


    ```

    toss = int(random(1, 2) + 0.5);

    ```'
