  md: '# Sketch 84: Capturing Video from a Webcam


    Webcams are present on most computers and almost all laptops. The previous sketches
    dealt with video that had already been captured, in the sense that a video file
    was available to be displayed or processed. this sketch will capture live video
    data from a webcam and display it in grayscale.


    The capture class deals with cameras and image/video capture. To use it, first
    declare an instance 1.


    Capture camera;


    Then initialize it using the class constructor. The class constructor may take
    only the parameter this, or this or a device specifier 2.


    ```

    Camera = new Capture (this);

    camera = new Capture (this, myCamera);

    ```


    The myCamera variable is a device specify string of the following form:


    ```

    "name=USB2.0 HD VC Webcam,size=160x120,fps=15"

    ```


    The result of the information in this string has an obvious meaning, and is not
    at absolutely necessary. If you know that the camera has a resolution of 640×480,
    the following call will open the camera:


    ```

    camera = new Capture (this, "size=640x480");

    ```


    Image capture begins with a call to start() 3.


    ```

    camera.start();

    ```


    As playing a video, a frame is available when camera.available() returns true.
    The camera instance can now be treated like a UIImage and be displayed with a
    call to image().


    This sketch copies the camera image into a PImage, display 4. The function gray()
    converts the color image into a gray one, which is displayed in place of the original.
    The result is a moving grayscale image of what is being captured by the camera.
    Patient take some time to capture the camera device.


    The Capture class function list() looks at the camera devices available on the
    computer and returns a list of descriptors that can be used in the constructor.
    So, if this line


    ```

    String[] cameras = Capture.list();

    ```


    were to be followed by this


    ```

    for (int i=0; i<cameras.length; i++))

    println(cameras[i]);

    ```


    a list of available cameras would be printed to the window. We could select one
    and use the index for it in the code to select it from the cameras[] array. For
    instance, you could search for a camera that is 640×480 at 130 frames per second
    and find it camera i in the list. Then you could use the selector you by indexing
    the array:


    ```

    camera = new Capture (this, cameras[i]);

    ```


    186 Part 10


    *'
