  md: '# Sketch 55: Constructing 3D Objects Using Planes


    Processing provides only spheres and boxes as basic 3D objects, but that does
    not mean that we cannot make more complex things. We can construct arbitrary objects
    from polygons. This means we need to design the objects first, either on paper
    or using a 3D modeling program like Blender or Maya. The design yields a set of
    coordinates of the vertices (corner points) of the polygons in three dimensions.
    We can then use Processing to draw these polygons and thus display the object.


    Since prisms are the easiest objects to build, this sketch will draw a prism and
    color the various faces differently so we can tell which is which. The point of
    view will move in a pattern so that the 3D nature of the object is clear.


    A rectangular prism consists of rectangles joined along their edges. A cube is
    a rectangular prism, for example. The first step is to determine the values of
    the coordinates for each of the corners of the rectangles that will compose the
    prism. A piece of graph paper is useful for this: sketch the prism and define
    the x, y, z coordinate system (x is horizontal). Then start with the origin, the
    (0, 0, 0) point, and place the coordinates on the drawing where they belong, as
    in Figure 55-1. Now you can simply read off the coordinates of each rectangle
    in any order you like. For example, the front face of the prism in the figure
    is defined by the following coordinates: (0, 0, 0), (sx, 0, 0), (sx, sy, 0), and
    (0, sy, 0).


    ![](img/7534641f255e2513226c900fd85d94f3_143_0.png)


    Figure 55-1: 3D coordinates of a prism


    To draw polygons that are connected as an object, we bookend that drawing code
    calls to the beginShape() and endShape() functions. In this case, because the
    polygons are used rectangles, beginShape() is passed the argument QUAD; another
    option would be TRIANGLES. This argument specifies to Processing the number of
    vertices needed for each polygon (in this case four). Between the begin and end
    calls, we place calls to a function named vertex(). Each call specifies a point
    that represents, in this instance, a corner of a rectangle. For example, in 3D
    space the front face of the prism is defined by these calls:


    ```

    vertex(0, 0, 0);

    vertex(sx, 0, 0);

    vertex(sx, sy, 0);

    vertex(0, sy, 0);

    ```


    122 Part 7'
