  md: '# Sketch 15: Manipulating Images—Aspect Ratio


    In the previous sketch we used the size of an image to define the size of the
    sketch window. It''s also possible to change the size of an image so that it fits
    into an existing window. The resize() function, part of the PImage data type,
    can be used to specify a size for an image. It does not make a copy but resizes
    the PImage itself. Here''s an example call to this function:


    +   - img.resize(w, h);


    This will cause the image stored in the img variable to be expanded or contracted
    to w pixels by h pixels high.


    # Example A


    In the first example, we scale the image to the size of the window, which is 240x480.
    Note that the image has been distorted, squashed from the sides and made taller.
    Note that all of the work is done in setup(), and draw() has no code.

    Any image has an aspect ratio, which is the relationship between the width and
    height of the image. It is often expressed as w. For example, 16:9 would be the
    aspect ratio of an image that had 16 pixels in the x-direction (width) for 9 pixels
    in the y-direction (height). The aspect ratio is sometimes expressed as a fraction,
    dividing the height into the width, so the ratio of 16:9 would be written as 1.8
    in this way. The reason that the image in Example A looks old is that the aspect
    ratio has been changed by forcing the image to fit into an arbitrary rectangle.


    # Example B


    This sketch draws an image into a window, scaling it so that the aspect ratio
    remains intact. The first thing to be done is to compute the aspect ratio of the
    original image:


    +   - aspect = (float)w/(float)h;


    We use float variables because the aspect ratio will be a fraction. When we place
    an image into a fixed space, its largest dimension (width or height) determines
    the overall size of the image within the window. We will adjust the largest side
    of the image to exactly fit the corresponding side of the window, which means
    means making the image larger or smaller. The other dimension of the image is
    kept proportional to this new scaled value. So if the image is taller than it
    is wide, we will map the height of the image to the height of the window:


    ```

    h = height;

    ```


    and the width will be in proportion to the original aspect ratio (converted to
    an integer):


    ```

    w = (int)(h*aspect);

    ```


    Now the image can be resized for display:


    ```

    img.resize(w, h);

    ```'
