    # Transcription and Translation Conventions


    In this book, Yiddish and *losh koyesh* terms are italicized, transliterated and
    translated in parentheses as they appear once per chapter, to make reading easier.
    I have also included a glossary after this appendix as a reference for key terms
    in *losh koyesh*, Yesishish, and Yiddish. When Yiddish or *losh koyesh* appear
    in a digital text or post, I leave them as originally rendered by the author,
    which is rarely italicized and may use a different orthography than my transliteration
    or incorporate multiple alphabets. Writers on social media or blogs generally
    did not translate Jewish terms and concepts into English at all, hinting that
    their primary audiences were other-Orthodox Jews. In these cases, I added my translations
    in brackets.


    Readers will therefore experience orthographic variation throughout this book,
    transcribing Yiddish from its Hebrew alphabet into the English alphabet can be
    a challenge given the diversity of speakers and limited Hebrew Yiddish standardization.
    Jews speak different regional dialects of Yiddish, and in general there is little
    concern with standardization of Yiddish spelling, transcription, or grammatical
    correctness in either Hebrew or English alphabets. I decided to transcribe Yiddish
    from its Hebrew alphabet using a modified YIVO Institute for Jewish Research system,
    which differs from some of the few conventionalized spellings for Yiddish and
    *losh koyesh* words. For example, ultra-Orthodox Jews (Hasidic and Yesishish)
    generally write “ch” for the sound of Chanuk and Rachel (the woman’s name, Rachel);
    in contrast and in order to be clearer to English speakers, I use “kh” to write
    Hanuka and Rukhel. Another English-language convention I adopted for readability
    is the “Hasidic,” instead of “Chassis,” as well as adding double consonants to
    translate words to *Yiddishkayt* or Shabb.


    In my inscriptions of spoken language I have mostly chosen a rendering... I do
    to make reading easier, even though this may not always accurately reflect the
    diversity of spoken language (belief). The *losh koyesh* word is written as אוגשה
    in the Hebrew alphabet. When this word is spoken it is pronounced differently
    in different communities based on regional variations. For example, Hebrew Jews,
    especially Hungarian Hasidim, say, emine (e-MIN-A). Israeli Hebrew speakers use
    the Sephardic pronunciation and say, ememunah (e-moo-NA).'
