  md: '# LIFE-CHANGING DOUBT


    stopped “washing negl vasser,” the ritual handwashing upon waking each morning.
    A mutual asked him if he still prayed. If he kept the Sabbath, did he still believe?
    Hiding in her bedroom closet and whispering late at night, so their children would
    not hear, he told her everything. She devastated and told me she cried for three
    days straight. Then, just a few months later, the vaad ha-tsinius (the Committee
    on Modesty), a group of self-appointed activists and rabbis, contacted Yisroel
    through his brother-in-law. They knew that he had just bought a book on science
    from Amazon for his twelve-year-old daughter, which included a section on the
    theory of evolution, which Hasidic Jews reject.


    Yisroel''s world was literally falling apart, and that was when I met him. A mutual
    contact, Zalman, who had been forced to leave his own Orthodox community a few
    years earlier, introduced us, knowing I was conducting anthropological research
    with those living double and those we tried to help. Over the next year, Yisroel
    and I met periodically in a wooden booth in the back of a dark bar on Manhattan''s
    Upper West Side, aside the safe anonymity of Columbia University students. He
    had his long side curls with a long beard, glasses, and a big velvet yarmulke.
    However, as a small personal rebellion, he took off the high black hat most Hasidic
    men wear, and instead of the usual Hasidic men''s long jacket, he always wore
    a cardigan or a parka.


    Yisroel told me his story as it was unfolding. Although he was always anxious
    about protecting the anonymity of his family, he seemed to talk, often asking
    me about his legal rights, I knew little about. When we couldn''t meet, we communicated
    on WhatsApp, the secure messaging app that so many ultra-Orthodox Jews used. He
    told me how he his wife were trying to figure out how to make their life work
    again. He promised her that he would keep practicing in front of the children.
    He hoped it was enough.


    With permission, he gave me Rukhy''s number, and I began to talk with her, too,
    on the phone and on Facebook. Rukhy, who used to rely on her husband for spiritual
    guidance, told me how his doubt had begun affect her: how she worried about her
    faith glitching (slipping); how she had begun to reach out to other women in similar
    situations online; and about her new sense of responsibility for the rakhnius
    (spirituality) in their home, traditionally the authority of the husband. Yisroel''s
    secret was her now too. She could tell no one, not even her mother or her sisters
    who lived across the street. She told me she was scared, angry, and heartbroken
    all at once.'
