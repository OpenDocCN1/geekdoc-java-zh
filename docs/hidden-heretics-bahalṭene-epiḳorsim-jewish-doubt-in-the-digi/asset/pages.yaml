    practices cease to create feelings of warmth (*varemkay*) and closeness to God
    and community.


    **Kfira**: heresy.


    **Klal Yisrael**: the Jewish people, meaning Jews all over the world.


    **Koyfer** (plural, *kofrim*): a heretic, denying God or Torah.

    **Loshn koydesh**: holy language, the ancient Hebrew and Aramaic used in the Torah
    and its commentaries. *Loshn koydesh* is distinct from other variants of Hebrew,
    using the language in Israel (*ivrit*) and the Hebrew *maskilum* used.


    **Maskil** (plural, *maskilim*): an adherent of the Haskalah, the Jewish Enlightenment
    (see above). *Maskil* created a modern, secular form of Hebrew in their writings
    and publications and fought vigorously against the growing Hasidic movement and
    the Yiddish language.


    **Matn toyre**: God''s revelation of the Torah to Moses and the Jews standing
    at Sinai.

    **Mesraya**: Jewish tradition handed down from parents to children.


    **Mitzvah** (plural, *mitsweot*): commandments. There are 613 commandments. 248
    are positive (to do) and 365 are negative (not to).

    **Mosdos**: Ultra-Orthodox schools and institutions of learning.


    **Musar**: ethical and philosophical writings of nineteenth-century Lithuanian
    Jews.

    **Ofglekert**: open-minded, enlightened.


    **OTD**: off the *derekh* (path), those who leave the Orthodox Jewish communities.

    **Peyos**: curls worn by ultra-Orthodox men.

    **Pnimiyius/khitsoynius**: theological terms referring to the interior or exterior
