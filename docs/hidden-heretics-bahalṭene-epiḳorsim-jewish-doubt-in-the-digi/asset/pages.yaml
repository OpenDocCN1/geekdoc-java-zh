    I met with Pinny after soon, and with so many others I met, I heard about the
    difficulties of keeping secrets in intimate domestic spaces. Living a double lives
    life often included lying to, hiding from, and sometimes betraying a spouse. This
    made everyday life rife with ethical choices. Those living double lives had to
    navigate murky moral dilemmas in their marriages. For still-religious spouses
    who discovered a husband or wife''s life-changing doubt, their worlds turned upside
    down. The uniqueness of each double life''s marriage tells us more broadly about
    the diversity of life-changing doubt over time.


    Sociologist Georg Himmel defined secrets as knowledge kept by some and from others,
    considering insiders and outsiders, who know and know they don''t know. Secrets
    themselves are never inherently moral or immoral; rather, they are generative,
    creating boundaries between people who struggle with the tension between revelation
    and secret keeping. For those living lives that tension between revelation and
    secret keeping choosing between self-fulfillment and comfortable familiarity,
    individual truth and protection of their family. Under the very noses of their
    still-religious spouses, double lives secretly violating the religious laws and
    obligations upon which their marriages were built, all the appearing as Ultra-Orthodox
    men and women to friends, family, and their communities. These kinds of moral
    compromises were the price those living double lives paid for their reluctance
    to leave the security of the known. They made what they saw as the most ethical,
    responsible decision of all: to shield their families from pain by keeping their
    life-changing doubt a secret.


    Anthropologist Tanny Luhmann, writing about secrecy among contemporary witches
    in England, "To hold a secret is to assert control over your private life, to
    choose what you make public."² When those living lives rejected ultra-Orthodox
    orthodoxy and its obligations, they often developed an alternative moral system,
    one inflected by North American liberal ideas about the individual''s right to
    autonomy, their personal authority to make ethical judgments, with other liberal
    values like tolerance and pluralism.³ Their emerging liberal ideas about the person
    contrasted to ultra-Orthodox notions, which emphasized each Jew''s responsibility
