    belief in God was something to be discussed not assumed. In the Hebrew school
    classes I attended, Jewish laws seemed, at least to me, ethical suggestions rather
    than obligations. I learned that Judaism was a religion of questioning, not a
    religion of submission. It was only in graduate school, as I prepared to research
    with Hasidic Jews, that I read about the history of Reform Judaism, as a legacy
    of nineteenth-century German Jews'' efforts to make Judaism align with emerging
    European modernity, something it ironically shared with earlier struggles over
    Jewishness.


    What is now called Ultra-Orthodoxy was a traditionalist movement that arose in
    eighteenth-century eastern Europe in response to the rapid social changes provoked.¹²
    Contemporary Ultra-Orthodoxy includes two major strands of Ashkenazi (European)
    Jewish Orthodox, Hasidic and Yishvish.¹³ These were originally opposed to each
    other, with each claiming traditional authority.¹¹⁴ After the Holocaust, though,
    as Ultra-Orthodox Jews successfully rebuilt communities in the United States,
    Canada, South Africa, England, Belgium, and Israel, to name a few places, Hasidic
    and Yishvish communities grew less oppositional, especially in contrast to the
    American rise of Modern Orthodoxy, a denomination that attempted to balance adherence
    to Jewish law with full participation in the world.


    Nevertheless, there remain significant differences between and among Yishvish
    and Hasidic Ultra-Orthodox Jews. For example, different Hasidic communities who
    often trace their lineages to towns and cities in eastern Europe are led by a
