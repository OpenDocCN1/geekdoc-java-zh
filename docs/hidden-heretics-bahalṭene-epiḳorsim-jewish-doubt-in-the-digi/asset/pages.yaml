  md: '# CHAPTER 1


    The Committee on using any social media, part of the growing effort by the ultra-Orthodox
    to control the internet and protect the community from what was increasingly called
    the "crisis of emuna," or the crisis of faith. This made Yisrael angry, and he
    brought up his constitutional right to privacy, having only recently learned about
    the existence of the Constitution at all. He was not rebellious, he insisted.
    He was simply following his conscience. The committee threatened to expel his
    children from school and to tell Yisrael''s parents unless he and Rukhy agreed
    to a religious therapist, someone who worked with a rabbi and returned to the
    community. Many ultra-Orthodox Jews believe that religious doubt might be symptomatic
    of an underlying mental illness, perhaps a pressure, trauma, or anxiety, something
    that could be treated and cured. Afraid, Yisrael and Rukhy tried a number of different
    therapists, religious and secular, but none helped Yisrael regain his faith.


    What Yisrael called his "journey" was still unfolding. Would he and his wife stay
    together, and if he did, would her faith continue to slip? Would the religious
    authorities and institutions be able to control the decisions Yisrael and his
    wife made? Would they expel his children, which would have serious repercussions
    for the entire family''s life, especially when came time for matchmaking? Where
    did his responsibilities as a parent lie, especially as his children got older?
    Was there anyone, a therapist or a rabbi, who could help Yisrael regain his faith,
    something he still wished for?


    Yisrael''s story was but one of many, the uncharted territory of ultra-Orthodox
    hiding heretic double lives where belief and practice were at odds; these were
    men and women, no longer believed in the literal truth of divine revelation at
    Mount Sinai. Nevertheless, they felt bound by love and a sense of responsibility
    to their still-religious spouses and children. Keeping secrets from those they
    were closest to, double lifers upheld the public appearance of adhering to ultra-Orthodoxy,
    even as they explored forbidden worlds, online and in person, beyond their own.


    Those living double lives are part of a broader twenty-first-century generational
    crisis of authority among the ultra-Orthodox. Despite their demographic growth,
    there have been increasingly loud struggles over competing knowledge and truths.
    The internet facilitated the formation of a public oppositional voice, one included
    anonymous expressions of life-changing doubt and validated radically changing
    perceptions of oneself in the world. Gender was key to the experience and of possibili'
  merge: -1
  pgno: 18
- img_proc: true
  md: '# LIFE-CHANGING DOUBT 5


    ties for living double lives, since gender structures authority in both ultra-
    Orthodox life and its alternative public. Begun in online spaces, but soon crossing
    over to meetings in person, this alternative public gave a platform to dangerous
    questions: Who should have the authority for making life choices? What and who
    defined Orthodox Judaism or self-fulfillment or an ethical life? The pages ahead
    ask what double lifers'' everyday struggles can tell us about religious doubt
    and social change in the digital age.


    ***


    Until recently, ultra-Orthodox Jews experiencing the kind of life-changing doubt
    that Yisriel did have troubling others like themselves. One might suspect from
    outside signs that a cousin or friend was doubting—maybe he had hidden an English
    book in his Hebrew prayer in shul (synagogue) or maybe her skirt had gotten an
    inch shorter—but meant possibly risking everything. Back then, living a double
    life was very lonely unless you had the means to venture out of your community.
    For example, Tsvi, a Hasidic man in his sixties had lived a double life for decades,
    till he had found kindred spirits among Jews in public libraries or Jewish seminars
    in Manhattan. Women living double lives, especially with children, generally had
    much less independence than someone like Tsvi, so they were even more than men.


    Since the early 2000s, however, the internet has created new possibilities for
    those living double lives to find each other and build secret worlds together.
    Through blogging and then on social media (forums, Facebook groups, and texting
    platforms like WhatsApp), many began to anonymously critique, parody, and what
    they call “the system,” the structures of rabbinic authority and their affiliated
    institutions, such as schools, synagogues, charities, kosher businesses, and summer
    camps. They also wrote and discussed, in gendered varieties of Yiddish and English,
    their changing sense of themselves in the world. Once they trusted each other,
    they met up in person, secretly exploring their new desires, ideals, and feelings
    around New York City.


    Those living double lives formed an anonymous public with its own morality. This
    public, selectively rooted in North American liberal morality, included ideals
    of individual autonomy, choice, and self-fulfillment. Double- women had fewer
    avenues for participation in this public, however; they had less access to new
    technologies, less mobility for getting together, and were sometimes less comfortable
    speaking up or writing in mixed-gender groups.'
  merge: -1
  pgno: 19
- img_proc: true
  md: '# CHAPTER 1


    In reaction to this growing chorus of anonymous critics, ultra-Orthodox Jewish
    rabbis, rebbes (Hasidic leaders), educators, and self-appointed communal activists
    (askonim) began to rethink their approaches to what they called "the internet"
    or, in Yiddish, *teknologia or keylim* (devices), and especially smartphones.
    They came to the conclusion that the internet was more dangerous to Jewish continuity
    than the Holocaust. As a public poster circulated on WhatsApp warned: "The Holocaust
    burned our bodies, but the internet burned our souls."


    At the same time, rabbinic leadership began the contemporary period as "crisis
    of faith." They claimed that exterior materials and embodied practices (kitshoyonis)—for
    example, distinctive clothing (levush), head covering, ritual practice as prayer—could
    no longer assure, as had in the recent past, the cultivation of shared interior
    faith, one enough to resist the temptations of the Gentile world. As a rabbi noted
    in the popular ultra-Orthodox magazine, *Ami*, "Before levush was... Nowadays
    we have the Internet, where everyone is anonymous and no *levush* can act as a
    shield." To staunch what many worried was a growing wave of secret doubters and
    those leaving the faith, rabbinic leadership began speaking explicitly about how
    to protect and cure integrity (*the pnimyus*)—hearts, minds, and souls.


    Rabbinic leadership''s public talk and writing about interior integrity identified
    two authoritative bodies of knowledge, or what anthropologist Talal Asad called
    "discursive traditions"; Jewish theology and American popular psychology. To protect
    Jewish souls against the corruption of the internet, rabbinic leadership began
    holding fiery anti-internet rallies (*asifes*), including the 2012 event in Citi
    Field Stadium in Queens, which drew over forty thousand men and boys. In rallies,
    leaders announced the internet for disrupting the healthy soul of each Jew to
    defeat the innate inclination for evil (*yeitzer hora*), including a willingness
    to submit to hierarchies of male authority. They posted edicts limiting access
    to the internet and enlisted the ultra-Orthodox school systems to support them.


    However, when life-changing doubt was revealed or confessed, rabbinic advisors
    almost always referred the person to a religious (*frum*) therapist or less formal
    satellites—Jewish life coaching or outreach (*kiruv*) rabbis. Religious therapy
    as a discipline was founded in the nineties, and there was a wide range of professionalization:
    some master''s degrees from reputable universities, while others practiced without
    licensing or training. Some therapists cast life-changing doubt as a symptom,
    either of insufficient spiritual education or of underlying emotional issues.'
  merge: -1
  pgno: 20
- img_proc: true
  md: '# LIFE-CHANGING DOUBT


    They pathologized doubt using medicalized models of emotional health, which designated
    faith the normative default. This was a change from decades past, when those who
    left doubted were seen less as a threat and as weak as undisciplined, in thrall
    to their evil inclination or Satan.


    In this latest chapter of North American ultra-Orthodox life, the crisis of emuna
    and struggles over the internet should be understood as a wider crisis of authority.
    On the heels of political, economic, and social conflicts, in the context of exploding
    population growth, a small, homegrown generational backlash has been challenging
    the authority of ultra-Orthodox leadership and their claims as the legitimate
    arbiters of tradition (mesoyra). In this social drama, the internet became a lightning
    rod for wider communal debates about religious authority through public discourse
    about interiority. Numbers of those living doubles and fellow travelers are not
    readily known, with individual estimates varying from a hundred to thousands worldwide,
    increasingly figure large in the ultra-Orthodox imagination.² Using the public
    yet intimate anonymity of the internet, those living doubles rejected the heightened
    religious stringencies of their communities following the Second War and wrote
    their changing inner lives into being. Ultra-Orthodox leadership, in contrast,
    denied the contemporary crisis of authority as the latest threat—the most recent
    in a long history of such threats—to the very survival of the Jewish people.


    Arriving in the 1950s after the Holocaust as refugees, primarily from Eastern
    Europe, ultra-Orthodox Jews today make up about 10 percent of the estimated 5.3
