    # The Second Line of Defense for Life-Changing Doubt: Religious Therapy


    Frum was rooted in the complementary integration of religious texts and popular
    psychology. A key architect, writes historian Andrew Heinze, was Rabbi Abraham
    Twersky, who was trained as both a rabbi and a psychologist. In the nineties,
    he developed what was a connection between Jewish ethical philosophy (mussar)
    and twelve-step programs, with their emphasis on self-esteem and growth. Musssar
    notions of human nature were often severe and pessimistic, with some believing
    that only fear of God’s punishment kept Jews from sin. Musssar located emotions
    in the heart (lev) and emphasized the importance of the will (rotsn) in self-improvement,
    particularly in struggles with the inclination for evil (yetzer hara). In the
    Musssar model of the person, those with problems, including religious doubt, were
    blamed for their weak will in fighting their inclination for evil. Mental health
    problems were framed as individual moral failings.


    In contrast, Twersky and a growing number of others emphasized that emotions were
    found in the brain, so that the will would not always help those with psychological
    illnesses. This led to the development, as Heinze suggests, of "a more nuanced
    and empathetic" treatment of human addictions and other psychological problems.⁸
    In this schema, religious'
