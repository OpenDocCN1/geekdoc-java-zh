  md: 'The major components of Yiddish is loshn koydes, Germanic, and Slavic languages.
    In the United States, the Yiddish of Hasidic Jews has acquired a great deal of
    English, though it generally remains written in the Hebrew alphabet.²


    Other-Orthodox communities (the Yeshivish) in the contemporary United States use
    a different Yiddish language, Yesvish English: a variety of English written in
    the English alphabet that incorporates Yiddish and loshn koydes words and expressions.
    An example of Yesvish English is the expression, “I’ll eat by you,” where the
    use of “you” is a direct translation from the Yiddish construction, Ikhl esn bay
    dir, “I’ll eat at your house.” Yesvish English can be more or less intelligible
    to speakers of Standard English, depending on how much or how little Yiddish and
    loshn koydes are integrated.


    Troglossia is shaped by gender schooling among the ultra-Orthodox, with boys and
    girls learning using these three languages differently. All ultra-Orthodox boys
    learn to read loshn koydes in private religious schools. For Yesvish boys, the
    language of instruction and discussion of loshn koytexts is Yesvish English. In
    contrast, the language of instruction and discussion is Hasidic Yiddish, Yiddish
    with loshn koydes and English components. Some Hasidic schools offer very secular
    education, and boys may not speak or write much English through adulthood.


    In contrast, private Yesvish schools for girls are divided into religious and
    secular studies in the morning and the afternoon. In their religious studies Yesvish
    and Hasidic girls learn to read loshn koydes, too, but their religious study is
    much less extensive than for boys, and does not include Talmud study. For Yesvish
    the language of instruction is Yesvish English or Standard English. In Hasidic
    schools, girls are taught in Yiddish in the mornings for religious subjects and
    in the afternoon for “secular” subjects. Some girls’ schools teach Yiddish literacy
