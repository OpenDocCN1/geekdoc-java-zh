    # The Morality of Individual Choice


    Rearing children to participate in a dominant plural ideology, while simultaneously
    and secretly undermining that ideology, was ethically complicated. The compromise
    many living double made was to claim that they were creating "choices" for their
    children, the opportunity to choose what their lives would be like. But the concept
    of choice for children in particular was also complicated. Children have agency,
    but their agency is constrained in ways that are different from adults because
    they are not fully competent adults; rather, they are fully competent children,
    at least for a time.


    Further choosing to be religious or not, even as a young adult, was not simply
    a matter of deciding between a Christmas tree or a Hanukkah, Passover seder or
    an Easter basket. As Leyh pointed out, children''s entire socialization through
    adulthood was bound with ultra-Orthodoxy. Their social and economic worlds, whom
    they might marry, the languages they speak or read, all were forged in ultra-Orthodox
    institutions that had a consistent message. The choice to follow a heret parent
    and choose a different way of life would be fraught with the loss of all that
    children were taught was good and true, along with their means to earn a living,
    a chance to get married and live among family and friends.'
