    # The Still-Religious Spouses


    The exercise of a double life''s newfound autonomy directly compromised their
    still-religious spouse. These spouses were forced into ethical dilemmas that were
    not of their own choosing, dilemmas that could lead to gendered shifts in authority
    at home and in the street. They were also required to keep secrets they wanted
    or needed to remain in the marriage, secrets they found morally repugnant because
    they required lying to innocent others.


    Just as gendered authority structured life-changing for the person living a double
