  md: '# GLOSSARY


    **Agudas Yisrael:** Orthodox Jewry''s national umbrella organization that is guided
    by a council of Torah sages (Moetses Gedolei Hatorah).


    **Apikoyrus (plural, apikorsim):** a skeptic, someone who denigrates the sages/rabbis,
    reads heretical literature, rejects specific doctrines. From the Greek, and Epicurean.


    **Askn (plural, askonim):** a self-appointed activist in an ultra-Orthodox community.


    **Bil toyre** a waste of time, specifically time that could have been spent by
    men and boys studying Torah.


    **Bum (fem. bunte):** an ultra-Orthodox Jew who is lax with observance and wants
    to have a good time. Bums do not necessarily challenge the system. They are simply
    too lazy or selfish to take on the obligations of religious stringencyency. See
    also tune baygel.


    **Emuna:** religious, belief, trust in God.


    **Frum:** religious, observant.


    **Glitsh:** slip or slide.





    **Hasidic Judaism:** a spiritual revival movement founded in the eighteenth century
    in contemporary Ukraine, which spread throughout eastern Europe. Hasidic Judaism
    was a radical movement for the Jews and emphasized individualized connection to
    God. Hasidic Jews rebuilt their communities worldwide. Each Hasidic community
    known as a *court (hof)* is led by a rebbe, who acts as an intermediary between
    his Hasidim (male adherents) and God. Courts are named after their eastern European
    country or town of origin, and leadership is inherited through male lines of descent.


    **Haskalah:** Jewish Enlightenment, a mid-eightteenth-century to late nineteenth-century
    intellectual movement among central and eastern European Jews. Inspired by the
    European Enlightenment, the Jewish Enlighteners (*maskilim*) attempted to both
    preserve and renew Judaism, espousing rationalism, liberalism, and freedom.'
