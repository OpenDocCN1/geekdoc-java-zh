    # Authority, Media, and Laughter


    Religious studies scholar Geburt Meyer describes how specific media at his-torical
    moments might authorize experiences of the divine, making cer-tain relationships
    or ways of being a possibility.⁴⁷ This is not to say that the medium itself creates
    persons, but rather that a newly introduced medium may legitimize particular feelings
    and experiences, including different possibilities for social interaction, written
    and spoken.³³⁸ The Jblocks and the wider hectic counterpublic legitimated the
    emotional and intellectual experience of life-changing doubt, at least for men.
    The Jblocks allowed double lifers to express their emerging feelings and ideas,
    to write new desires into being, and to create real relationships with fellow
    travelers. The internet, with its speed, unfettered access to knowledge and interlocutors,
    and especially its anonymity, in fact, create a new kind of counterpublic within
    all the span of a decade.


    The material affordances of a new medium, as anthropologists Faye Ginsburg, Lila
    Abu-Lughod, and Brian Larkin, foster particular relations-tions to the body and
    perceptions of space.³⁹ For example, double-life women with less access to computers
    and almost no unsur-veiled free had fewer opportunities to explore other ways
