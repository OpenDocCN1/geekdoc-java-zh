    # The Ethics of a Double Life


    Life-changing for double lifers was not what philosopher Charles Taylor dubbed
    a “subtraction story,” a disenchantment ending in secularism.⁶ Those living lives
    did not experience a radical conversion from belief, which transformed their everyday
    lives into a “before” and an “after.” Instead, living a double life was a drawn-out,
    messy process, one that continuously tacked on emotional commitments, moral dispositions,
    and many kinds of kinds. Such a life necessitated picking and choosing between
    yet related moral systems, simultaneously inhabiting two different ways of being
    in the world. This meant that life-changing doubt was not necessarily a process
    that always ended in certainty.³⁷ Indeed, even when life-changing doubt reached
    a process of intellectual certainty, there was an emotional entanglement with
    ultra-Orthodoxy, with its habitus, and with a legacy of loss and disillusionment.
    This entanglement persisted not only because double lifers continued to participate
    in the everyday rhythms of the life of Orthodoxy, but also because their experiences
    of life-changing doubt—of anger for women or sadness for men—changed their minds,
    their hearts, their languages, and their bodies.


    Double lifers elaborated a contingent morality, one that straddled contradictions
    and hypocrisy, in order to protect their families and themselves. Perhaps unsurprisingly,
    many drew on North American liberal values, although refracted through and in
