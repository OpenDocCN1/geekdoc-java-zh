  md: '# Life-Changing Doubt, the Internet, and a Crisis of Authority


    Yisroel was an earnestly pious boy growing up Hasidic in Brooklyn, New York. With
    his side curls grazing his shoulders, thick plastic glasses, and big black velvet
    yarmuke, he looked like all the other boys in his yeshiva, where he studied the
    Torah and its commentaries from the morning until late at night. When he was thirteen,
    Yisroel began to notice contradictions that troubled him in the religious texts
    he was studying. He didn''t initially doubt the truth of ultra-Orthodox Judaism,
    but he had problematic questions—what are called in Yiddish emuna kashes (questions
    about faith). Only once did he timidly confide in his teacher, a rabbi, who angrily
    warned him that such questions came from the sin of masturbation. From then on,
    confused and ashamed, he kept his questions to himself and tried, as he told me,
    to "push them under the rug." At eighteen he got married, and he and his wife,
    Rukhy, who he barely knew but grew to adore, had five children in quick succession.
    To support his growing family, Yisroel eventually stopped studying Torah and,
    as many Hasidic men do, to work in information technology.


    However, in 2003, when he was twenty-nine, his questions began to nag him again.
    And this time, thanks to his work with computers, he turned to the internet, secretly
    searching for and reading forbidden scholarly articles on theology, biblical criticism,
    and science. He hoped to finally find answers to his questions about faith in
    these non-Jewish sources, but they only provoked more questions. He decided then,
    he told me, that he had to "take his questioning all the way."'
  merge: -1
  pgno: 15
- img_proc: true
  md: '# 2 CHAPTER 1


    Late at night, sitting alone in the kitchen after everyone had gone to bed and
    the only sound was the humming of the two dishwashers (for meat and one for dairy),
    he began reading some of the then-popular he-ultra-Orthodox blogs, like Hasidic
    Rebel and Shtreimer. These led him to online forums of the day, where writing
    under a pseudonym in Yiddish and English, Yisrael debated with ultra-Orthodox
    Jewish doubters and even some who had left Jewish Orthodoxy to go “off the derekh”
    (path). He tried to convince them (and himself) that they were wrong. All of his
    searching, he told me, remembering his anguish, “tortured” him, but he could not
    stop.


    Eventually, his questions gave way to doubt in the central premise of ultra-Orthodox
    Jewish authority that God revealed the Torah to the Jews at Mount Sinai since
    Moses. Yisrael was in such agony at this heresy (kfira) that he secretly began
    to make phone calls to rabbis outside of his community who specialized in answering
    questions of faith. His arguments failed to convince him. Despite continuing to
    observe the mitzvot, the 613 prohibitions and commandments that had always directed
    every aspect of his life, he began to doubt their divine nature.


    The first time he violated one of the commandments was on a Sabbath-evening in
    2012. His youngest was crying, and he knew that turning on the musical mobile
    above her crib would calm her down. Observant Jews do not turn electricity on
    or off during the Sabbath. He stood in the dark with his hand on the switch for
    a long time—yes, no, yes, no, yes, no? And then he switched it on. Each time he
    broke another commandment, like using his phone on the Sabbath, or skipping daily
    prayers, or even eventually sneaking nonkosher cut into the pocket of his jacket
    to nibble on at, he told me, he felt a sense of “freedom,” finally “in control
    of his life.


    That was when he became one of the growing number of what ultra-Orthodox class
    in English “double life” or “ITC” (in the closet), or what Yiddish-speaking ultra-Orthodox
    called bahaltena aporiskis (hidden here-), who those feature in this book: men
    and women who practiced religiously in public, including at home, but who violated
    the commandments in secret because they no longer believed them to be God’s words
    to his chosen people. Yisrael and others like him kept their double lives secret
    to protect their families and for fear of being cast out in a world they were
    ill-prepared to navigate.


    In 2014, after Yisrael had developed a growing network of double-life friends
    on social media and in person, his wife, Rukhy, finally confronted him. He had
    noticed that the intimacy of their bedroom, he had'
