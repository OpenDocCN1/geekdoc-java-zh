    # The Morality of Time, Tradition, and New Technologies of Communication


    Both double and rabbinic authorities compared the contemporary crisis of faith
    to the Jewish Enlightenment in central and eastern Europe, asserting historical
    continuities and revisiting old battles over claims to Jewish Orthodoxy. In fact,
    the contemporary period and the Jewish Enlightenment were historical moments of
    technological, political, linguistic, and religious change, so the parallel was
    apt. In particular, Jbloggers and Jewish Enlighteners were each living in times
    with unprecedented opportunities for participation in the non-Jewish world and
    access to diverse bodies of knowledge. This led both to experiment with language,
    genre, and literary style to address expanding reading publics, thanks to changes
    in technologies of communication, print or digital.


    An implicit shared ideology about time and tradition underpinned contemporary
    comparisons to the ultra-Orthodox Judaism. The alternative modernity of today''s
    ultra-Orthodox Judaism was perceived, in part, by the moral decay of successive
    generation, since each was further moved from the moment of divine revelation
    at Mount Sinai; the concept is called *yerides ha-dor*, decline of the generations.
    This understanding of history inverted modernist ideals of progress with their
    freedom from coercive authority. Instead, contemporary ultra-Orthodox Jews described
    freedom as a selfish, immature lack of discipline. In this regressive notion of
    history, frequently invoked with rosy glasses as a destroyed, pre-Holocaust eastern
    European shtetl (small town), all Jews in the past, even heretics, were at a higher
    moral level. Simultaneously, another version of history circulated, that conflated
    threats to Jewish existence regardless of time or place. For example, Egypt, the
    Jewish Enlightenment, the later twentieth-century secularizing Jewish youth movements
    and radical politics, and the Holocaust were all equivalencies that they threatened
    the Jewish people. That is why contemporary ultra-Orthodox rabbinic leadership
    could assert that the medium of the internet was actually not new at all; it was
    just their generational challenge, their *nisoyen ha-dor*, and those doing the
    challenge were not at the same level of past heretics.


    Jbloggers, in contrast, aligned themselves with *maskilim* and the Jewish Enlightenment
    in their eagerness to prove that their life-changing doubt was an intellectual
    critique of the system and did not stem from emotional problems or uncontrolled
