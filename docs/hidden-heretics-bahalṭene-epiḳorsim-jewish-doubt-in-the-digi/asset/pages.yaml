    When a husband''s or a wife''s doubts and transgressions were discovered by the
    still-religious spouse, gendered relationships were often thrown into disarray.


    Social media was the arena where dilemmas over religious authority and doubt were
    played out for double lives. Some, influenced by rabbinic campaigns against the
