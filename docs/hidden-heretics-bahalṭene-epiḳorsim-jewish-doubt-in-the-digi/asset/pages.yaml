  md: '# APPENDIX


    # What You Need to Know about

    Ultra-Orthodox Jewish Languages


    # Jewish Multilingualism


    Ultra-Orthodox Jewish communities today are multilingual, as religious Jews have
    been for millennia. Their multilingualism can be defined as “triglossia,” meaning
    their linguistic repertoire includes three languages, each used for a distinctive
    communal activity; (a) *loshn koydesh* (holy language; ancient Hebrew and Aramaic)
    is the language used for prayer and religious study; (b) a Jewish language, such
    as Yiddish or Ladino, is spoken and written as a vernacular or everyday language
    among Jews; (c) a “coterritorial” language, such as English or Polish, is used
    for communicating with non-Jews in the wider state or empire where Jews lived
    and among themselves too. *Loshn koydesh* is considered a sacred language has
    remained constant over time and space, distinctive from other forms of Hebrew,
    including Modern Hebrew in Israel (*irril*). In contrast, Jewish vernaculars and
    coterritorial languages have changed as Jews settled in different places. Examples
    of a few Jewish scholars beyond Yiddish or Ladino include Judeo-Arabic and Judeo-Greek
    spoken in areas where the coterritorial languages have been respectively Arabic
    and Greek.


    In the post-World War II United States, in addition to reading, praying, and studying
    *loshn koydesh*, some ultra-Orthodox Jews (Hasidim) speak and read in Yiddish
    (Yid=Jewish, Yiddish-Jewish), a language that developed initially during contact
    between Jews and Gentiles living along the Rhine beginning in the year 1000. As
    Jews migrated east over hundreds of years throughout Europe, Yiddish expanded
    to include linguistic elements from wherever they settled, though it remained
    written in the Hebrew alphabet.'
