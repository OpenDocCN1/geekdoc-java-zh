  md: '# PRINCETON STUDIES IN

    CULTURE AND TECHNOLOGY


    Princeton Studies in Culture and Technology

    Tom Boellstorff and Bill Maurer, series editors

    This series presents innovative work that extends classic ethnographic methods
    and questions into areas of pressing interest in technology and economics. It
    explores the varied ways new technologies combine with older technologies and
    cultural understandings to shape novel forms of subjectivity, embodiment, knowledge,
    and community. By doing so, the series demonstrates the relevance of anthropological
    inquiry to emerging forms of digital culture in the broadest sense.


    +   * Hidden Heretics: Jewish Doubt in the Digital Age by Ayala Fader

    Hacking Diversity: The Politics of Inclusion in Open Technology Cultures by Chris-ina
    Dunbar-Hester

    Hydropolitics: The Itaipu Dam, Sovereignty, and the Engineering of Modern South
    America by Christine Folch

    The Future of Immortality: Remaking Life and Death in Contemporary Russia by Anya
    Bernstein

