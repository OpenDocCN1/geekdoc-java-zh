    # What Is a JVM and JRE?


    JVM (Java Virtual Machine) is used to execute Java programming. Its role is to
    transform bytecode into code that is understood by the JRE and the JDK. Besides
    that, it also has important roles in security and the management of the program''s
    memory.


    JVM has an execution engine that allows the compiling and understanding of code.
    A class loader, so you can import and initialize Java class files, and a runtime
    data area that has threads, stack areas and method areas.


    JRE (Java Runtime Environment) are the tools that we use to execute Java programming.
    Its main function is to execute Java programs, if you need to compile or develop
    code, you don''t need JRE.


    JRE deployment solutions that allow the deployment of features such as Java Plugin
    and Java Web Start. It has development toolkits that allow developers to work
    on the interface of the user. Integration libraries, allow you to use both integration
    and class libraries, as well as utility and language libraries.


    # What is a Java compiler?


    A compiler is used to take the text file and compile it into a Java file. The
    standard Java compiler is Java Language Compiler (javac), but there are others
    such as the GNU compiler, or the ECP (Eclipse Compiler for Java).


    As we have seen, Java programs are written in statements and we need compilers
    to translate those into something that is executable by a computer, such as a
    Java file.


