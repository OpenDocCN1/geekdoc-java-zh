  md: '# Instance Variables


    These variables are declared outside any block, method, or constructor; however,
    they are still declared in a class. These are non-static variables, but much like
    static variables, their default value is zero and so their initialization is not
    mandatory. And only by creating objects you can have access to the instance variable.


    But what are the real differences between static variables and instance variables?


    +   - We can only have one copy of a static variable per class, unlike with instance
    variables where each object has its own copy of the variable.


    +   - The way we access these variables also differs. For instance, by directly
    using the class name we can have access to the static variables, however, to have
    access to instance variables we can have it through object reference.


