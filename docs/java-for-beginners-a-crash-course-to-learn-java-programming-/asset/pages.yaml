  md: '# Static Checking


    A compiler will not compile a program if a variable has an incorrect value, and
    that is called a type declaration bug because you are declaring a wrong value.
    If this happens your program will crash or give you wrong results.


    Static typing aids programmers in recognizing the bug before the execution of
    the code. If the variable does not correspond to the type of the assigned value,
    the program will not compile. For instance, if we use an int variable for a string
    such as "Hello World", there will be an error stating incompatible types, as we
    have seen the int type of variable is designed to hold certain numbers and not
    words.


    Sometimes these bugs are not caught by the compiler, and so when running the code
    it will cause an error called runtime errors. Static typing aids programmers in
    avoiding runtime errors. We will learn more about the different types of bugs
    and how to debug your code later in this book.'
