  md: '# Differences Between Classes and Objects


    The main concept of Java programming is its definition of classes and objects.
    If we had to think about real-life examples, a class would dog and the objects
    breed. So the whole class would be dogs and inside that class, we would have different
    breeds of dogs. Another example could be class fruit and objects strawberry, orange,
    or kiwi.


    The way they relate to each other is when we create a class, all the objects from
    that class will have inherited its variables. Say we create two objects: a poodle
    and a cocker from the class dog. Both of these objects would have, four legs,
    one tail, and two ears, if those were our variables.


    To go a little further, we have seen dog is a class, cocker is an object. These
    objects have certain attributes, just like a real cocker would have such as the
    color of the fur, or their weight. And then, we have methods that tell us behavior
    about the cocker such as barking or eating.


    So when we use a class to build an object, we are using the class as a sort of
    blueprint with the right attributes and methods.'
