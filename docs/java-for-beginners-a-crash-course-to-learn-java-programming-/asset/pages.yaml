  md: '# Comment


    You can sometimes add comments to your code. This is so a programmer can give
    instructions to other programmers or other people while they read the code. These
    are sentences that the compiler does not read and, so, not processed by the computer.
    These comments don''t need to use any syntax, and usually are pretty straightforward
    to write. For that to happen you will need to add double slashes before typing
    in the text. If we continue with the example above we can write it like this:


    ```

    System.out.println("Hello World!");

    //Output: Hello World!

    ```


    If you want to add a comment throughout multiple lines you will need to start
    with /* and finish with *.*


    To give you an example:


    ```

    //This is a comment in a single line

    /*

    ```


    This is a comment

    in multiple

    */


    There are other types of comments that can be done in your coding. By using /**
    and */ we are adding Javadoc comments that can be used to add new documentation
    for Application Programming Interfaces or APIs.


    You should be a bit more careful using these comments because they will eventually
    be part of the documentation. You should also use them before you declare any
    methods, classes, or fields.


    ```

    /**

    *This is how a Javadoc comment would look like

    if you need to add it to your code for instructions.

    */

    ```'
