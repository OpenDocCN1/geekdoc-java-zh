  md: '# Automatic Memory Management


    This feature allows programmers to avoid having to perform manual memory management,
    something that in some programming languages is quite common. The issue with this
    is that, if the programmer forgets or doesn’t do it on time, a memory leak can
    happen. When this happens the program will consume an unnecessary amount of memory.
    It can also happen that the memory is allocated twice and this can lead the program
    to crash.'
