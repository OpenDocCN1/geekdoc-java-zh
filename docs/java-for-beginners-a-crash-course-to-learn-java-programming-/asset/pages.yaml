  md: '# Class Variables


    These types of variables are also known as static variables. They are similar
    to other types of variables like static variables but differ in the method of
    declaring. Class variables use a static keyword inside the class, but without
    the need, or outside any block or constructor. Regardless of how many objects
    you create, static variables can only have a single copy per class.


    These are also created when the program starts running and erased automatically
    as soon as it finishes and because their default value is zero, their initialization
    is not mandatory. However, if we access the static variable through an object,
    a warning message will pop up from the compiler, but the program will not halt.
    Instead, the compiler will automatically change the object name with the class
    name.'
