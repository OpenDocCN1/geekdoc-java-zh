  md: '# Execution in Multiple Operating Systems


    This is a great feature of Java programming as it allows any code written in Java
    to easily run on another operating system. This is done by compiling specific
    Java bytecode that can be considered “halfway” written and allow a smooth transition
    when run on other operating systems. There are certain implementations of compilers
    that compile to native object code, allowing the removal of a middle bytecode
    stage.'
