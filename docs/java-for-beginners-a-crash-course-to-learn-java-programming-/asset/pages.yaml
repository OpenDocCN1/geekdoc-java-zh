  md: '# # Chapter 9: Inheritance and Polymorphism


    Inheritance and polymorphism are two extremely important features of Java programming
    and are one of the reasons why Java is an object-oriented language. Let us first
    focus on inheritance.


    As you might have wondered, inheritance in Java should have something to do with
    the inheritance we have in our world. If you thought that, you are right. Like
    the traits you inherit from your parents like brown hair, blue eyes, or your height,
    in Java, you can also inherit class traits. You will have a parent class and a
    child class just like in real.


    Let''s say you have a class *mammals* and you give it some characteristics as
    warm blood, four legs, or fur. But now you want to create a class *cat*, you don''t
    need to define and create the different methods all over again, you can use inheritance
    of classes to pass some of the traits in *mammals* to the class *cat*. Because
    cats are mammals, this can take some of the methods and fields. This is important
    so we don''t need to constantly redefine members of the same class all over again.


    Even though the class *cat* will inherit all the traits the class *mammals* has,
    *cat* can also have their unique methods.


    A parent class can also be called a superclass or a base class and is the class
    where you take methods and traits from, while the child class, subclass or sometimes
    also called derived class is a class that takes from the parent class, which in
    our example is the class *cat*.


    So how do we apply inheritance? We need to know how to define a child class that
    can take from the parent class, and for that, we need to use the keyword *extends*.
    This is how it looks when used in code:'
