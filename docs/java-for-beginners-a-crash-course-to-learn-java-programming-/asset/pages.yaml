  md: '# ## Chapter 12: Debugging


    A computer or software error in a program or in any other system that ends with
    a wrong result or a different than the expected result is called a bug. Debugging,
    on the other hand, is what we call when we solve a computer bug. There are many
    strategies and tactics that we can use to solve those types of issues, such as
    log file analysis, unit testing, profiling, control flow analysis, or memory dumps,
    and there are also many tools designed for specific computer languages that help
    programmers and developers to debug, called debuggers.


    In Java programming, although there are numerous ways to address and classify
    bugs, we can divide them into three main sections:


    +   - Logic errors: These are bugs that are usually found by programmers when
    searching for errors in the code.


    +   - Syntax errors: These are bugs that the compiler identifies, such as grammar
    errors.


    +   - Run-time errors: These errors happen once the program is running.


    Usually, syntax errors and bugs are the easiest to find since the compiler does
    the job for you, followed by run-time bugs. And the hardest to look for and fix
    are logic errors since the programmer has to actively look for them in the lines
    of code. Let''s go through these three different types of errors:'
  merge: -1
