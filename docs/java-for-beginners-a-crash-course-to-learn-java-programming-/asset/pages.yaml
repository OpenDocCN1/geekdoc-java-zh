  md: '# Security


    Java is a very secure programming language, mainly because it doesn''t use explicit
    pointers. These explicit pointers, sometimes seen in other programming languages,
    mean that the programmer has to define explicitly cursors when certain statements
    are executed. By not using pointers, the memory area cannot be directly accessed.


    Another great point is that Java runs on a virtual machine sandbox. The JRE (Java
    runtime environment), provides the ability to load classes, also known as classloaders,
    into JVM (Java Virtual Machine). This means that the class packages are separated
    from the network, reducing the risk of being accessible for someone else.'
  merge: -1
