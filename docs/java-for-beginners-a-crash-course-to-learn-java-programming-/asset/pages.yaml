  md: '# Main () Method


    The main () method is essential in every application run on Java and indicates
    an entry point for the program and the application. Every other method branches
    out from the main () method. This main () method is inside the class listing the
    program and should be between curly braces.


    As we have seen in the example above, in order to run the program you need to
    type public static void main(String[] args) {}.


    Anything between the curly brackets is syntax and is part of the attributed class.


    (String[] args)is any information we want to copy into the program. It''s classified
    as syntax and needed to run the program.


    Let''s break the above code down. Main is the class of the code written above.
    Note that every class should start with an uppercase letter. You should remember
    this, as Java programming is case sensitive. When you are copying variables and
    calling classes, make sure you write the name as it is. As we have mentioned above
    as well, the class name should match the file name, though without the added ".java".


    For now, all you need to understand is that anything you write inside your main()
    is going to be executed by the compiler. We will get to the other words later.
    To recap this bit of information: Every Java program must have a main() and have
    the same filename as the class.'
