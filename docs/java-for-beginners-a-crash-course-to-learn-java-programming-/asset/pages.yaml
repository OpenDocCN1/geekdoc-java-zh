  md: '# Compiler


    The basic and main function of a compiler is to translate human-friendly code
    into a language that computers can process.


    Compiling means running the program. When you compile a program the class you
    converts into a file that ends in .class, also known as byte code. Then, you can
    use a Java virtual machine, or JVM to run the code.


    After you have installed JVM, you can open a terminal or command window and go
    to where you have saved the Java program. Type the name of the program that should
    end in .java and press enter to compile the code.


    After that you should be able to see the .class file appearing, assuming there
    are no errors in your code.


    Usually, or at least while you are learning, a compiler might have run the program
    for you automatically, however, when you are working away from a platform development
    environment, the compiler might do it or not and you need to know what mistakes
    you have made. The Java compiler usually understands where the mistake might be
    on your code before the computer starts running it.


    As an example, if you have a file named Compiling.java, we could compile it with
    a command on the terminal as :


    ```

    Javac Compiling.java

    ```


    If there were no mistakes, the compiler would have created a .class file. So this
    Compiling.class could be executed with a terminal command:


    ```

    java Compiling

    ```


    If there were errors in your code, no .class would have been created and you would
    have to fix your mistakes and run the command to create a .class file.'
  merge: -1
