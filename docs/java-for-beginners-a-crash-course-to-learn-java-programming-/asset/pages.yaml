  md: '# # Manipulating Variables: Order of Operations


    Java programming follows the same rules as any other mathematical operation. You
    probably remember when you were learning operations in school, that these had
    certain orders to be followed in order to come up with the right result. Let''s
    take this operation, for instance:


    ```

    int num = 6*(12-2) + 6/2;

    ```


    If we were to do this ourselves without the use of a calculator or the terminal,
    this would be the order of operations:


    Parentheses; Exponents, Modulo/Multiplication/Division; Addition/Subtraction.


    And when operators are in the same order, then we would first do the operations
    on the left. So this is how we would calculate the ''int num'':


    The parentheses would be calculated first:


    ```

    6 * 10 + 6/2;

    ```


    Then, the next thing you would do be the multiplication, and the equation would
    look like this:


    ```

    60 + 6/2;

    ```


    According to the order of operators, the next operation would be the division.
    So we would have this:


    ```

    60 +3;

    ```


    And the int num would be 63.'
