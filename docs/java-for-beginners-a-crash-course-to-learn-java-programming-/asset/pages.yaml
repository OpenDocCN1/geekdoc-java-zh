  md: '# # Manipulating Variables: Modulo


    Modulo is represented by %, and its intent is to give us the remainder of two
    divided numbers. For instance, if you bake 13 muffins, and you give them in batches
    of 3, how many muffins would you have left before you ran out of batches? You
    could make out four batches and have one leftover muffin. This is how you can
    calculate that using Java code:


    ```

    int muffinsMade = 13;

    int muffinsLeft = 13%3;

