  md: '# Dividing Your Program


    This might be a radical measure, but if you delete your code

    temporarily, or part of it, and compile it to see if the

    program was successful you can narrow down where the

    issue is. For instance, if you delete half of your code and run

    the program and there''s no issue, you can add half of the

    halt that you have deleted, or one fourth, and run it again

    until you know where the issue is.


    Instead of deleting the code temporarily, you can keep it

    as a comment. In most editors, you can highlight and

    comment it out by pressing `command + /`.'
