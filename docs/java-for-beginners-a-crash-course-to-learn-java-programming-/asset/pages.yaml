  md: '# Introduction


    When Java programming started to come to light, it was first called "oak", back
    in June of 1991. It was created by programmer James Gosling and some of his colleagues
    at Sun Microsystems with the goal of incorporating a language that had roots in
    C-like notations but was simpler than those types of programming languages. Java
    programming, in, has many of the same syntax programming languages like C/C++
    have, but with a simpler way of processing and writing.


    In 1995, Java 1.0 was released to the public with a peculiar promise that held
    to this day almost intact: "Write once, run anywhere". It was such a success that
    soon the main web browsers at the time started to use them in their regular configurations.
    As it continued to expand in popularity, Java 2.0 was released and it was designed
    for both smaller and larger platforms. And so, with more versatility than its
    predecessor.


    Even though Java might be seen as an easier programming language, it has tremendous
    depth and can be used in numerous applications in our society. In fact, there
    are more than three billion devices today running Java. It''s used for many applications,
    and many times we are interacting with Java programming and we don''t know. Some
    of its more important applications are:


    +   - Video Games

    - Web Servers

    - Web Applications

    - Mobile and Desktop Applications

    - And even connections between Databases, etc.


    In this book, we will cover everything that is necessary for you to write Java
    code and become proficient in only one'
  merge: -1
