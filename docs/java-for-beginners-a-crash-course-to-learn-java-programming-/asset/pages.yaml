  md: '# # Chapter 14: FAQ


    In this chapter, we will answer some of the most frequently asked questions about
    Java that we do not cover in the book, or were covered but not answered completely.


    # ## What is JDK?


    JDK stands for Java Development Kit and is part of the core packages that the
    Java program uses. The JDK allows programmers and developers to make programs
    in Java, and these programs can be run by either the JVM (Java Virtual Machine)
    or the JRE (Java Runtime Environment), which we will explain in the next question.
    In its essence, JDK is composed of both JVM and JRE. The JDK includes the compiler
    that we need to compile code and the in-built Java class libraries. You need to
    download the JDK software if you want to create applications based on Java programming.


    There are different types of JDK aimed at different types of applications. Which
    one you choose will depend on what you want to develop. There are three packages
    available: Java Standard Edition (Java SE), Java Enterprise Edition (Java JME)
    and Java Mobile Edition (JME). Here''s a little explanation about downloading
    and installing your JDK (we will use the SE version for this purpose).


    First, you need to go to oracle.com and a list of JDK will pop up. You will have
    to select between three different tools: Public JRE, Source Code or Development
    Tools. You can install all of them, or just one or two. If you are starting out,
    you will only need the Development Tools.


    Once you have installed, you can open your Command prompt and type the `java`
    command and the return should be the version of Java that you have just installed.
    You will also need the `javac` in order to compile your programs. You can install
    the `javac` that is inside the `jdk` directory that you have just installed.'
  merge: -1
