  md: '# On Windows


    Some Windows PCs come with Java already installed. You can easily check that by
    using the search bar and typing “Java”, or by using Command Prompt (cmd.exe) and
    typing:

    C:\Users\Your name on your computer>java - version


    If you got Java already installed on your Windows computer, you would see something
    similar to this, depending on the Java version you would have installed:

    Java version “11.0.1” 2018-10-16 LTS

    Java(™) SE Runtime Environment 18.9

    Java HotSpot(™) 64-bit Server VM 18.9


    On the other hand, if Java is not installed on your Windows computer, you can
    download your copy at oracle.com.


    These are the steps that you need to follow in order to install Java on your Windows
    computer:


    +   1. After you have downloaded the file, go to “Control Panel” > “System and
    Security” > “System” > “Advanced System Settings.”

    2. Under the “Advanced” tab, click on “Environment variables”.

    3. Select “Path” and click on “Edit”.

    4. Click on “New”. Java is, by default, installed in C:\Program Files\Java\jdk-11.0.1.
    You will need to add a new path ending in “bin”. So, it would look like this:
    C:\Program Files\Java\jdk-11.0.1\bin.

    5. The last thing you have to do is open Command Prompt (cmd.exe) and write “java-version”,
    just to check if it is actually running on your computer.'
