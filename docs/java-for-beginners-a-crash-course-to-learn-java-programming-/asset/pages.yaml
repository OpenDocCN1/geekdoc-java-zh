  md: '# File Management


    In order for you to import a File class, you need to import the java.io package.
    Here’s how you can make a new object for the class, and indicate a filename:


    ```

    import java.io.File;

    //here you are importing a File class

    File aObject = new File(anyfilename.txt");

    //you need to add the filename"

    ```


    Here’s a list of methods that you can use with the File class:


    +   - canWrite() - It’s a boolean type and checks if the file can be written


    +   - createNewFile() - It’s a boolean type and allows the creation of a new empty
    file


    +   - canRead() - It’s a boolean type and checks if the file can be read


    +   - exists() - It’s a boolean type of method and checks if the file exists somewhere


    +   - getName() - It’s a string type of method and returns the anime of the given
    file


    +   - delete() - It’s a boolean type of method and it deletes a file


    +   - length() - It’s a long type of method and it gets back the size of the file
    at hand


    +   - getAbsolutePath() - Returns the pathname of the file'
