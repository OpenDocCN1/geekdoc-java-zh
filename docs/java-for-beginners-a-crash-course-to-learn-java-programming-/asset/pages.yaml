  md: '# Logic Errors


    Even when we get rid of both run-time and syntax errors, we still don''t seem
    to get the right output, even though there are no errors. This is called a logic
    error and is a frequent mistake among programmers, especially beginners.


    This is usually because there''s a flaw in the way the programmer wrote the code.
    The compiler or program doesn''t give you any errors because it''s a thinking
    problem. The way you have designed the code is not correct to have the output
    you desire. These can be really difficult bugs to fix. However, there are techniques
    and tools that can help you save a lot of time when searching for these mistakes,
    called test-driven development or TDD. This process aims to give errors to the
    code when there are logic errors in it.'
  merge: -1
  pgno: 211
