  md: '# Able to run and execute codes remotely


    # Object-Oriented Programming


    There are many ways to interpret an object-oriented programming language (OO),
    depending on the language itself. With Java, the main component for this affirmation
    is the ability to combine both code and data into entities objects.


    With this, Java separates the code from the data or separates things that change
    from things that do not change. This is to help stabilize large projects that
    might otherwise reduce in quality if this wasn''t implemented. Basically, it''s
    a way to simplify large and complicated projects.


    Another great use for OO languages is that objects can become more generic and
    so be used in different projects even without writing them again. This helps build
    large projects faster by reusing objects that would otherwise take longer to write.
    Other features of Java’s OO are:


    +   - Has a clear structure, easier for programmers to understand


    +   - Aids in maintaining the code accessible by using DRY (don’t repeat yourself)


    +   - Reuse of applications with less time to create them'
