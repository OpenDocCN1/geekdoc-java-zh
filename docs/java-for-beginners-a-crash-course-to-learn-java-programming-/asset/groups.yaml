- md: "\n## Assigning Values to Instance Fields\n\nWe have mentioned arguments before,\
    \ what these are is that they are values that we can pass into the method. Once\
    \ we do that, we can use them to give instance fields initial values. Look at\
    \ this example:\n\n```java\npublic class Chocolate {\n    String flavor;\n   \
    \ public Chocolate(String chocolateFlavor) {\n        //here we are able to assign\
    \ a parameter value to an instance field\n        flavor = chocolateFlavor;\n\
    \    }\n    public static void main(String[] args) {\n        //here we call the\
    \ constructor to supply the parameter value\n        Chocolate ferrero = new Chocolate(\"\
    fruity\");\n    }\n}\n```\n\nIn order for this, the given type value has to be\
    \ equal to the parameter type declared. When we look at the constructor, we see\
    \ that the chocolateFlavor is referring to the value that we have passed, in this\
    \ case, \"fruity\". \"Fruity\" is then assigned to flavor, which is the instance\
    \ field.\n\nIn this example, we have already declared flavor when we did flavor\
    \ = chocolateFlavor, which we don't have to assign anymore. The instance, ferrero,\
    \ holds flavor which is an instance field that refers to the value \"fruity\"\
    . For us to access the value of the field, in this case, flavor we would use the\
    \ dot \".\" For example:\n\n```java\n/*how to access a field: objectName.fieldName\
    \ */ //it would be \"fruity\"\n```\n\nNow, when a value is passed during a method\
    \ call, this is called an actual parameter. When we call an argument through the\
    \ process of calling a method, it's called call by value. To give you an example,\
    \ when in the exercise above we have declared the object ferrero, the String value\
    \ “fruity” is passed as an argument. The chocolateFlavor, which is a formal parameter,\
    \ is then assigned a copy of the value.\n\n## Multiple Fields\n\nInstance fields\
    \ can be added to objects without a limit, as long as program needs them. In our\
    \ example, we will add more instances so the program has multiple fields. Will\
    \ will place a boolean hasAllergens, that says if the chocolate has any allergens\
    \ such as nuts, as well as an int grams indicating the grams in one chocolate.\
    \ This is how it should look:\n\n```java\npublic class Chocolate {\n  String flavor;\n\
    \  //we will add new field here\n  boolean hasAllergens;\n  int gramsPerChocolate;\n\
    \  //now we will add the new parameters that link to new fields\n  public Chocolate(String\
    \ flavor, boolean allergens, int grams) {\n    flavor = chocolateFlavor;\n   \
    \ //new parameters\n    hasAllergens = allergens;\n    gramsPerChocolate = grams;\n\
    \  }\n  public static void main(String[][]){\n    //passing the new values into\
    \ method call\n    Chocolate ferrero = new Chocolate(\"nutty\", true, 72);\n \
    \   Chocolate tony = new Chocolate(\"fruity\", false, 64);\n    System.out.println(tonys.hasAllergens);\n\
    \    //this would be false\n    System.out.println(ferrero.gramsPerChocolate);\n\
    \    //here would be 72 grams\n  }\n}\n```\n\nAs we can see the constructor has\
    \ more than one parameter, and so is able to receive values for the newly created\
    \ fields. One thing to take into consideration is that the order in which you\
    \ present your parameters has to be the same when you pass the values.\n\nThese\
    \ are the basic concepts that you need to know when we talk about classes and\
