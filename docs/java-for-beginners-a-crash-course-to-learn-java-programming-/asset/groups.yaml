    # Java Enums


    Enums are a special type of class that are an agglomerate of unchanging variables
    called constants. There are a few differences between a class and enum, but both
    of these have methods and attributes. However, enum constants cannot be overridden
    and are so unchanging. These are public, final, and static.


    You can''t use an enum for the creation of objects. So when would we use enum?
    You use enum when you know for sure the values won''t change. For instance, seasons,
    months, or colors.


    ```

    enum LightTrafficSignal {

    RED ("halt"), GREEN ("go"), ORANGE ("slower");

    private String move;

    public String getMove() {

    return this.move;

    }

    private LightTrafficSignal (String move) {

    this.move = move;

    }

    nLightTrafficSignal signal = LightTrafficSignal.valueOf("RED");

    signal = LightTrafficSignal.valueOf("GREEN");

    signal = LightTrafficSignal.valueOf("ORANGE");

    ```'
- md: "\n# Java User Input\n\nThis is a very useful class in Java. With the Scanner\
    \ class, you can get user inputs. In order for you to import the Scanner class,\
    \ you will need to use java.util package. There are many methods inside the Scanner\
    \ class. For this example we will use one that allows us to read Strings, it's\
    \ called nextLine() method:\n\n```java\nimport java.util.Scanner;\nclass Main\
    \ {\n    public static void main(String[] args) {\n        Scanner aObject = new\
    \ Scanner(System.in);\n        //this is so we are able to create a scanner object\n\
    \        System.out.println(\"Enter nickname\");\n        String userNickname\
    \ = aObject.nextLine();\n        System.out.println(\"Nickname is \" + userNickname);\n\
    \    }\n}\n```\n\nThe printout should be something like:\nEnter nickname\n(here\
    \ you would enter the nickname you have chosen)\nNickname is: (nickname you have\
    \ chosen)\n\nWe used nextLine() so we could read Strings, but there are many other\
    \ methods inside Scanner that allow you to read other values. For example:\n\n\
    - nextDouble() allows you to read double.\n- nextBoolean() allows you to read\
    \ boolean values.\n- nextInt() allows you to read int values, and so on.\n\n#\
    \ Java Dates\n\nWe have given an example above relating to the java.time package\
    \ by using the class LocalDateTime which represents both date and time. But there\
    \ are other useful classes in this package such as LocalDate only representing\
    \ date and LocalTime only representing time.\n\nTo give you another example of\
    \ a current date:\n```java\nimport java.time.LocalDate;\npublic class Main {\n\
    \    public static void main(String[] args) {\n        LocalDate aObject = LocalDate.now();\n\
    \        System.out.println(aObject);\n    }\n}\n```\n\nTo do that time, we would\
    \ proceed in a similar way:\n```java\nimport java.time.LocalTime;\npublic class\
    \ Main {\n    public static void main(String[] args) {\n        LocalTime aObject\
    \ = LocalTime.now();\n        System.out.println(aObject);\n    }\n}\n```\n\n\
    And the output would be the current date on your computer.\nThere's another class\
    \ inside the java.time package and it's called DateTimeFormatter using the method\
    \ ofPattern(). This allows you to format date and time, as you wish. Here's an\
    \ example:\n```java\nimport java.time.LocalDateTime;\nimport java.time.format.DateTimeFormatter;\n\
    public class Main {\n    public static void main(String[] args) {\n        LocalDateTime\
    \ aObject = LocalDateTime.now();\n        System.out.println(\"No formatting \"\
    \ + aObject + \" = \" + aObject);\n        DateTimeFormatter aFormatObject = DateTimeFormatter.ofPattern(\"\
    dd-MM-yyyy HH:mm:ss\");\n        String formattedDate = aObject.format(aFormatObject);\n\
    \        System.out.println(\"With formatting:\" + formattedDate);\n    }\n}\n\
    ```\n\nThe output would be as follows:\nNo formatting—yyyy-MM-dd : HH:mm:ss\n\
    With formatting—dd-MM-yyyy : HH:mm:ss\n\nYou don't have to necessarily use this\
    \ configuration; instead, you can use dd/MM/yyyy, or dd-MMM-yyyy and the program\
    \ will adjust it accordingly.\n\n# Java HashMap\n\nIn the chapter about arrays\
    \ and ArrayList, we have learned that you can hold different values orderly, and\
    \ we are able to access them by calling the index number these values are in.\
    \ These values, when we use ArrayList, are of int type. With a HashMap, you can\
    \ hold other keys and values in pairs, as well as access them through an index\
    \ by using other types such as Strings for instance.\n\nIn this case, you would\
    \ use an object key (or index) to a different object (or value). This way you\
    \ can hold different types or even the same type. For example, have a look at\
    \ this snippet:\n\n```java\nimport java.util.HashMap;\nHashMap<String, String>\
    \ countriesContinents = new HashMap<String, String>();\n```\n\nAbove you have\
    \ imported the HashMap and created an object named countriesContinents. Let's\
    \ have a look at a whole code block:\n\n```java\nimport java.util.HashMap;\npublic\
    \ class Main {\n    public static void main(String[] args) {\n        HashMap<String,\
    \ String> countriesContinents = new HashMap<String, String>();\n        countriesContinents.put(\"\
    Europe\", \"England\");\n        countriesContinents.put(\"North America\", \"\
    USA\");\n        countriesContinents.put(\"Asia\", \"Japan\");\n        System.out.println(countriesContinents);\n\
    \    }\n}\n```\n\nIf you want to access an item within the HashMap, you need to\
    \ use get(), like this:\n\n```java\ncountriesContinents.get(\"Asia\");\n```\n\n\
    If you want to remove a value, then you would use remove(), or if you want to\
    \ remove all the items, you would use clear(). If you want to figure out the size\
    \ of your HashMap you would use size() method.\n\n# Java HashSet\n\nJust like\
    \ HashMap, you access HashSet by importing the java.util package. This allows\
    \ you to create a mathematical set using a hash table data type. It's a sort of\
    \ collection of items. Here's how you create it:\n\n```java\nimport java.util.HashSet;\n\
    HashSet<String> dogs = new HashSet<String>();\n```\n\nIf you want to add items,\
    \ you do it this way:\n```java\nimport java.util.HashSet;\npublic class Main {\n\
    \    public static void main(String[] args) {\n        HashSet<String> dogs =\
    \ new HashSet<String>();\n        dogs.add(\"Poodle\");\n    }\n}\n```\n\nIf you\
    \ want to remove a value, then you would use remove(), or if you want to remove\
    \ all the items, you would use clear(). If you want to figure out the size of\
    \ your HashMap you would use size() method.\n\n# Wrapper Classes\n\nEven though\
    \ we previously said primitives, we can now use objects. Every primitive has a:\n\
    - Byte\n- Short\n- Integer\n- Long\n- Float\n- Double\n- Character\n- Boolean\n\
    \nHere's how we use them:\n```java\npublic class Main {\n    public static void\
    \ main(String[] args) {\n        Integer aInt = 8;\n        Double aDouble = 4.9;\n\
    \        Character aChar = 'R';\n        System.out.println(aInt);\n        System.out.println(aDouble);\n\
    \        System.out.println(aChar);\n    }\n}\n```\n\n# Regular Expressions\n\n\
    Java uses this feature to search for text. What it's called regular expression,\
    \ we can use the java.regex package. This includes Matcher class for searching,\
    \ Pattern class to define a pattern, and PatternSyntaxException that identifies\
    \ a syntax error. Here's what it would look like:\n\n```java\nimport java.regex.Matcher;\n\
    import java.regex.Pattern;\npublic class Main {\n    public static void main(String[]\
    \ args) {\n        Pattern pattern = Pattern.compile(\"programming\");\n     \
    \   Matcher matcher = pattern.matcher(\"I love programming in Java\");\n     \
    \   while (matcher.find()) {\n            System.out.println(matcher.group());\n\
    \        }\n    }\n}\n```\n\nWe use Pattern.compile() to create our pattern. We\
    \ use the first parameter to declare the pattern being searched, and the second\
    \ to declare the search as case-insensitive, so it doesn't matter if we use capitals\
    \ or lowercase letters.\n\nThen, we use the matcher() to search for a String and\
    \ return an object. Finally, the find() method is used to output the experiment,\
    \ if there's a match it's true, if there's no match it is false and it wasn't\
    \ found.\n\nThe Pattern.CASE_INSENSITIVE is called a flag, and when used with\
    \ the compile() method we can change the way the search is done. There are more\
    \ flags, such as:\n- Pattern.LITERAL: allows any special characters in a pattern\
    \ to be treated as regular characters.\n- Pattern.UNICODE_CASE: if used with CASE_INSENSITIVE\
    \ you can ignore characters that do not belong in the English alphabet.\n"
