    \ however, if an error occurs after you have compiled a properly, then it might\
    \ be a run-time error. These are errors that the compiler can't get and are related\
    \ to things that the compiler only looks at the code at hand. Examples of run-time\
    \ errors are missing files or division by zero.\n\nIf you do try to divide something\
    \ by zero, you will likely find an error message with some similar to this:\n\
    *Exception: / by zero*\njava.lang.ArithmeticException: / by zero\nat Debug.main(Debug.java:8)\n\
    \nJava identifies these bugs with the word Exception as you can see in the message.\
    \ It also gives you the line where the error happened just like syntax errors\
