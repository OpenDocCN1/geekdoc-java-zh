    \ 3\n\n```java\ndouble myHeight = 1.70;\nSystem.out.println(myHeight);\n```\n\n\
    Example 4\n\n```java\nint houseNumber = 4;\nhouseNumber = 7;\nSystem.out.println(houseNumber);\n\
    //Here the printout would be 7\n```\n\nIn this last example, we first declared\
