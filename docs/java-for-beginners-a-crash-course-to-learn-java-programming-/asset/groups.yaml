  mdcn: "\n\n# 计数器变量\n\n计数器变量（有时称为迭代器）是我们在循环时使用的变量。这样做是为了程序在达到该变量的值时退出循环。例如，让我们再次查看密码示例，但稍微稍有不同：\n\
