    为了能够创建类的对象或实例，我们需要一个构造方法。当你定义构造方法时，你必须在类内部定义它。让我们来看这个示例：\n\n```java\npublic class\
    \ Chocolates {\n    //这是一个构造方法\n    public Chocolate() {\n        //这些是创建巧克力 对象的指令\n\
    \    }\n    public static void main(String[] args) {\n        //main方法的主体\n  \
    \  }\n}\n```\n\n为了让我们创建对象或实例，我们需要在 `main()` 中调用构造方法。所以，如果我们想将一个新的巧克力对象赋值给变量 `ferrero`，它看起来像这样：\n\
