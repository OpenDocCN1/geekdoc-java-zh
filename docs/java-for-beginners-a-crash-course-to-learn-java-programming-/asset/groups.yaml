    # Abstract Classes and Methods


    When we mention abstraction, we are talking about hiding certain data from the
    user, and showing them only the necessary data. We can do this through abstract
    classes or interfaces. We''ll explain what interfaces are, but first, let us understand
    what abstract classes are all about.


    We can use abstract classes, as well as methods. When we use abstract classes,
    we cannot create objects. Abstract methods can only be used if we are also using
    an abstract class, and the body is given by a subclass, so abstract methods do
    not have bodies. But you can use regular and abstract methods when using an abstract
    class. For instance:


    ```

    abstract class Insect {

    public abstract void insectNoise();

    public void sleep() {

    System.out.println("Bzzz");

    }

    ```


    If we want to create an object we would need to inherit from another class through
    polymorphism which we will learn in another chapter.


    # Interfaces


    We can also achieve abstraction through the use of interfaces. We can use interfaces
    when we have methods with empty bodies and we want to group them together. In
    order to access interface methods, we have to use the keyword implement. Like
    this:


    ```

    interface Insect {

    public void insectNoise();

    //this is the interface method

    public void sleep();

    //this is the interface method

    ```'
