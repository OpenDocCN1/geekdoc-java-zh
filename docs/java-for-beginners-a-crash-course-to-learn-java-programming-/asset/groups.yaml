    \ and Semicolons\n\nThese are lines and spaces between the code that the program\
    \ ignores. This is so other people such as friends or colleagues can easily interpret\
    \ the code. By adding whitespaces you are making the code clear to understand.\
    \ Such an example of that could be:\n\n```\nSystem.out.println(\"You can write\
    \ whatever you want here\");\nSystem.out.println(\"As you can see, there’s a space\
    \ between line codes\");\n```\n\nThis should be seen, after you run the program,\
    \ like this:\nYou can write whatever you want here."
  - '[PAGE 30]


    As you can see, there’s a space between the lines of code.


    In the output, however, you would not see any lines or spaces between what you
    wrote as they are ignored by the program.


    Semicolons are read by the program and it announces the end of a sentence or statement.
    However, you don’t add semicolons when you add curly braces.


    # Statements


    Statements are lines of code that do one task. In order to have no errors, all
    statements should finish with a semicolon as we have mentioned above.


    ```

    System.out.println("Hello World");

    ```


    As you can see in our example, you need to use a semicolon to let the program
    know that the statement is finished.


    # Print Statements


    ```

    System.out.println("Hello World");

    ```


    This is the line of code that prints out the statement and outputs the information
    on the screen. Let’s break down every single word means:


    +   * System: It’s a class built in the Java program containing many things that
    programmer can use with the program.

    * out: It means “output”. So the result of the output.

    * println: means “print line” and is when you want to print the line on the screen.


    Using this line allows you to create a new line on the screen. You can add anywhere
    on the code and the program will read it, as long as you write it properly and
    close it using the semicolon.


    You can create several printing outputs that will appear on one line using print
    instead of println.'
