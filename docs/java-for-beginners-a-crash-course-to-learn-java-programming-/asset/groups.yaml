    ## Manipulating Variables: Order of Operations


    Java programming follows the same rules as any other mathematical operation. You
    probably remember when you were learning operations in school, that these had
    certain orders to be followed in order to come up with the right result. Let''s
    take this operation, for instance:


    ```java

    int num = 6*(12-2) + 6/2;

    ```


    If we were to do this ourselves without the use of a calculator or the terminal,
    this would be the order of operations:


    Parentheses; Exponents, Modulo/Multiplication/Division; Addition/Subtraction.


    And when operators are in the same order, then we would first do the operations
    on the left. So this is how we would calculate the ''int num'':


    The parentheses would be calculated first:


    ```java

    6 * 10 + 6/2;

    ```


    Then, the next thing you would do be the multiplication, and the equation would
    look like this:


    ```java

    60 + 6/2;

    ```


    According to the order of operators, the next operation would be the division.
    So we would have this:


    ```java

    60 + 3;

    ```


    And the int num would be 63.


    ## Manipulating Variables: Greater Than and Less Than


    By using greater than ‘>’ and less than ‘<’, called relational operators, we can
    make boolean comparisons. If we take an example of a bank account again and we
    want to figure out if when we withdraw cash, we were taking out less than we have
    in our account.


    ```java

    double balanceBankAccount = 1000.02;

    double amountWithdraw = 500.02;

    System.out.println(amountWithdraw < balanceBankAccount);

    //the output would come up as true, as we are taking out less than we have on
    the account

    ```


    We can use this to know if we can buy something, or if we have enough money in
    our bank account to purchase something. This is how you would use boolean variables
    with greater and less than signs:


    ```java

    double balanceAccount = 1000.02;

    double costOfNewBike = 1500;

    boolean canBuyBike = balanceAccount > costOfNewBike;

    //the result would come out as false because the bike is higher than what you
    have on the bank account

    ```


    ## Manipulating Variables: Equals and Not Equals


    We can also know if two variables are the same by using ''==''. This can be used
    to know if you got paid the right wage amount, for instance. Here is how it can
    be done:


    ```java

    double wageAmount = 700;

    double calculatedWage = 17.50 * 40;

    System.out.print(wageAmount == calculatedWage);

    // this would be true, as the two variables are equal

    ```


    Now, we can do the same to find out if two different variables are not the same:

    ```java

    double balance = 150.00;

    double amountDeposited = 50;

    double balanceAfterDeposit = balance + amountDeposited;

    boolean changeBalance = balance != balanceAfterDeposit;

    // this would be true

    ```


    The sign to check if two variables are not the same is ''!=''


    ## Manipulating Variables: Greater/ Less Than or Equal To


    Turning again to the example of wage paid. How could we determine if we got paid
    at least the expected amount? In this case, we use less than or equal to ''<='',
    or greater than or equal to ''>=''. This is how it would look if we code it:


    ```java

    double wageAmount = 700;

    double calculatedWage = 17.50 * 40;

    System.out.println(wageAmount >= calculatedWage);

    //in this case, the output would be true, as the two variables are the same

    ```


    ## Manipulating Variables: .equals() (very similar content to equals() in string
    methods)


    It makes sense that we only use operations with primitive types. You would think,
    using operations with strings wouldn''t work, as there are no numbers to make
    any operations. But we can still use arithmetics, in this case use ''.'', equality
    to know if two strings are the same. For that we use ''.equals()''. This is a
    method to compare two objects so we don''t use the operation symbols that we have
    been using so far. Here''s an example:


    ```java

    String person1 = "Jack";

    String person2 = "Rodri";

    String person3 = "Rodri";

    System.out.println(person1.equals(person3));

    //this would come out as false because "Jack" is not "Rodri"

    System.out.println(person2.equals(person3));

    //this would be true, because "Rodri" is the same as "Rodri"

    ```


    ## Manipulating Variables: String Concatenation


    So far, the operators we have been talking about only work with primitives. But
    it''s not always like that, some also work with strings. If for example, we want
    to add your name to an account, we can use ''+'' to add two strings together:


    ```java

    String yourName = "Rodri Sanchez";

    System.out.println("Your name is:" + yourName);

    ```


    The printout would be: Your name is: Rodri Sanchez. This is called concatenating
    a string. But you can go one step further and use a primitive as a variable and
    the Java programming will understand it. Let''s give the example of a simple bank
    account report:


    ```java

    double bankAccountBalance = 250.50;

    String message = "Your balance is:" + bankAccountBalance;

    System.out.println(message);

    ```


    The printout would be: Your balance is: 250.5.


    ## Manipulating Variables: final Keyword


    We have talked about variables and how we can manipulate them. But the truth is,
    some variables should stay constant, such as our day, using the ‘final’ word.
    Like this:


    ```java

    final int weddingDay = 20;

    ```


    If we try it, the compiler would come up with an error.


    ## Types of Variables


    There are three different types of variables in Java that allow for different
    functions:


    - Class Variables

    - Local Variables

    - Instance Variables


    ## Class Variables


    These types of variables are also known as static variables. They are similar
    to other types of variables but differ in the method of declaring. Class variables
    use the static keyword inside the class, but outside any block. Regardless of
    how many objects you create, static variables can only have a single copy.


    These are also created when the program starts running and erased automatically
    as soon as it finishes because their default value is zero, their initialization
    is not mandatory. However, if we access the static variable through an object,
    a warning message will pop up but the program will not halt. Instead, the compiler
    will automatically change the object name with the class name.


    ## Local Variables


    If you can define a variable within a constructor, method, or block, then it is
    a local variable. These local variables only exist with the variable declared
    on that block, meaning that the local variable won’t exist within other blocks.


    Unlike class variables, the initialization of local variables is mandatory before
    use and is created once the block is entered or when the call returns from the
    function.


    ## Instance Variables


    These variables are declared outside any block, method, or constructor; however,
    they are still declared in a class. These are non-static variables, but much like
    static variables, their default value is zero and so their initialization is not
    mandatory. And only by creating objects you can have access to the instance variable.

