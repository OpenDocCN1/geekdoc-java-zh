    # Chapter 7: Classes


    As we have seen, Java is an object-oriented program, and we’ve talked about its
    functionalities and roughly how it works in the first chapter of this book. Now,
    we are going to learn about classes, but before, let us just go back and remind
    ourselves of what an object-oriented language is.


    We have learned about the three types of information Java programming can hold:
    string, numbers, and boolean. But that is not enough if we want to create variables
    that are more complex. Let us set a real-life example and choose a school program
    that wants to track its students through their name, GPA, grade year, and scholarship
    status. We could do that because we can use names as a string, GPA as numbers,
    their school year as strings too and if they have a scholarship as boolean.


    Now, we have also learned about functions. So in this case, we want to know if
    their GPA is enough to give them honors, so we could set hasHonors(), or if they
    can be given a scholarship related to their GPA as giveScholarship(), and these
    would be functions. With all this information we can create our own data type
    and mold it according to a real-life situation.


    So how do we create our own data type? First, we need to create a class and declare
    its variables. As we have seen before, class works as a sort of blueprint, and
    it’s a set of rules and data types to inform the program how the new data type
    or class would look like.'
