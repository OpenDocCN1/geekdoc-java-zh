    # ## Chapter 12: Debugging


    A computer or software error in a program or in any other system that ends with
    a wrong result or a different than the expected result is called a bug. Debugging,
    on the other hand, is what we call when we solve a computer bug. There are many
    strategies and tactics that we can use to solve those types of issues, such as
    log file analysis, unit testing, profiling, control flow analysis, or memory dumps,
    and there are also many tools designed for specific computer languages that help
    programmers and developers to debug, called debuggers.


    In Java programming, although there are numerous ways to address and classify
    bugs, we can divide them into three main sections:


    +   - Logic errors: These are bugs that are usually found by programmers when
    searching for errors in the code.


    +   - Syntax errors: These are bugs that the compiler identifies, such as grammar
    errors.


    +   - Run-time errors: These errors happen once the program is running.


    Usually, syntax errors and bugs are the easiest to find since the compiler does
    the job for you, followed by run-time bugs. And the hardest to look for and fix
    are logic errors since the programmer has to actively look for them in the lines
    of code. Let''s go through these three different types of errors:'
  - '[PAGE 208]


    # Syntax Errors


    The compiler is the first method we usually use to detect any syntax error in
    our code such as grammar mistakes that we sometimes make. These are very easy
    to spot and fix because the compiler tells you exactly where the error occurred,
    as sometimes will tell you what went wrong with your code. Some of the most common
    syntax errors are very simple things that we forget sometimes such as missing
    semicolons, the closing or opening of parenthesis, or brackets, or sometimes even
    misspelled methods or variables. The compiler usually gives you the exact line
    where the error occurs.'
  - '[PAGE 209]


    # Run-Time Errors


    Many times our code won''t have any syntax errors and so the compiler will run
    the program with no problem, however, if an error occurs after you have compiled
    a code properly, then it might be a run-time error. These are errors that the
    compiler can''t get and are related to things that the compiler only looks at
    the code at hand. Examples of run-time errors are missing files or division by
    zero.


    If you do try to divide something by zero, you will likely find an error message
    with some similar to this:

    *Exception: / by zero*

    java.lang.ArithmeticException: / by zero

    at Debug.main(Debug.java:8)


    Java identifies these bugs with the word Exception as you can see in the message.
    It also gives you the line where the error happened just like syntax errors and
    a backtrace, sometimes called stack backtrace. These are frames of the program
    from the method that was running until where the Exception occurred.


    In the example above we have got an ArithmeticException tells us that an error
    occurred when the program was doing an arithmetic calculation, as dividing by
    zero. But there are three more common Exceptions; NullPointerException tells us
    that the program ran a method on an object or tried to access a variable that
    was null. FileNotFoundException occurs when the program can''t find the file you
    chose to open, and lastly, another common Exception ArrayIndexOutOfBoundsException,
    which we have already mentioned, is when you choose an index that is greater than
    the index in the array.'
- md: "\nThere is a way that we can quickly and easily spot Exceptions, by using two\
    \ keywords together; try and catch. When you use `try` on a block of code, you\
    \ are asking that bit of code to be tested for errors when you run it. When you\
    \ use `catch` after the `try`, you are allowing that block of code to run if there's\
    \ a bug when you use try.\n\nFor example:\n\n```\ntry {\n    int dimension = length\
    \ / width;\n} catch (ArithmeticException e) {\n    System.err.println(\"ArithmeticException:\
    \ \" +e.getMessage());\n}\n```\n\nInstead of the regular print line order, we\
    \ used System.err.println(), as this allows us to print the error and make it\
    \ easier to spot the mistake.\n\n## Logic Errors\n\nEven when we get rid of both\
    \ runtime time and syntax errors, we still don't seem to get the right output,\
    \ even though there are no errors. This is called a logic error and is a frequent\
    \ mistake among programmers, especially beginners.\n\nThis is usually because\
    \ there's a flaw in the way the programmer wrote the code. The compiler or program\
    \ doesn't give you any errors because it's a thinking problem. The way you have\
    \ designed the code is not correct to have the output you desire. These can be\
    \ really difficult bugs to fix. However, there are techniques and tools that can\
    \ help you save a lot of time when searching for these mistakes, called test-driven\
    \ development or TDD. This process aims to give errors to the code when there\
    \ are logic errors in it.\n\n## Debugging Techniques\n\nIf you have been through\
    \ your code over and over again but you still can't find the source of the problem,\
    \ you can choose to perform some techniques to try and solve the issue.\n\n##\
    \ Print Statement Method\n\nYou can use `System.out.println()` to verify your\
    \ code at different points of your code. You can look for return or variable values\
    \ by using the print statement at every block of code until something comes up.\n\
    \n## Dividing Your Program\n\nThis might be a radical measure, but if you delete\
    \ your code temporarily, or part of it, and compile it to see if the program was\
    \ successful you can narrow down where the issue is. For instance, if you delete\
    \ half of your code and run the program and there's no issue, you can add half\
    \ of the halt that you have deleted, or one fourth, and run it again until you\
    \ know where the issue is.\n\nInstead of deleting the code temporarily, you can\
    \ keep it as a comment. In most editors, you can highlight and comment it out\
    \ by pressing `command + /`.\n\n## Chapter 13: Java Files\n\nThe way you handle\
    \ Java files is also relevant to understanding the basics of Java programming.\
    \ In fact, there's a dedicated class where you are able to manage files, from\
    \ creating to altering or even deleting them. In this chapter we will go through\
    \ the main functions you can do with the File class.\n\n## File Management\n\n\
    In order for you to import a File class, you need to import the `java.io` package.\
    \ Here’s how you can make a new object for the class, and indicate a filename:\n\
    \n```java\nimport java.io.File;\n//here you are importing a File class\nFile aObject\
    \ = new File(\"anyfilename.txt\");\n//you need to add the filename\n```\n\nHere’s\
    \ a list of methods that you can use with the File class:\n\n- `canWrite()` -\
    \ It’s a boolean type and checks if the file can be written\n- `createNewFile()`\
    \ - It’s a boolean type and allows the creation of a new empty file\n- `canRead()`\
    \ - It’s a boolean type and checks if the file can be read\n- `exists()` - It’s\
    \ a boolean type of method and checks if the file exists somewhere\n- `getName()`\
    \ - It’s a string type of method and returns the name of the given file\n- `delete()`\
    \ - It’s a boolean type of method and it deletes a file\n- `length()` - It’s a\
    \ long type of method and it gets back the size of the file at hand\n- `getAbsolutePath()`\
    \ - Returns the pathname of the file\n- `mkdir()` - It's a boolean type of method\
    \ and is able to create a directory\n- `list()` - It's a string type and is able\
    \ to return arrays of the file\n\n## Create a File\n\nAs we have seen above, by\
    \ using the `createNewFile()` method. If you have created it with success, a true\
    \ boolean value will return. If there's already a file with that name in the directory,\
    \ the boolean value will return false. Here's how it looks:\n\n```java\nimport\
    \ java.io.File;\nimport java.io.IOException;\n//this is for the class to manage\
    \ errors if they occur\npublic class CreatingAFile {\n    public static void main(String[]\
    \ args) {\n        try {\n            File aObject = new File(\"insertfilename.txt\"\
    );\n            if (aObject.createNewFile()) {\n                System.out.println(\"\
    The file was successfully created:\" + aObject.getName());\n            } else\
    \ {\n                System.out.println(\"The file exists\");\n            }\n\
    \        } catch (IOException i) {\n            System.out.println(\"There was\
    \ an error\");\n            i.printStackTrace();\n        }\n    }\n}\n```\n\n\
    Here if the file was successfully created, you would see \"The file was successfully\
    \ created:insertfilename.txt\". If the file already exists, you would see \"The\
    \ file exists\".\n\n## Writing a File\n\nIn order to write a file, we will use\
    \ the `FileWriter` class as well as the `write()` method. Here's an example:\n\
    \n```java\nimport java.io.FileWriter;\nimport java.io.IOException;\npublic class\
    \ WritingAFile {\n    public static void main(String[] args) {\n        try {\n\
    \            FileWriter aFile = new FileWriter(\"insertfilename.txt\");\n    \
    \        aFile.write(\"Hello world!\");\n            aFile.close();\n        \
    \    System.out.println(\"The file was successfully written!\");\n        } catch\
    \ (IOException e) {\n            System.out.println(\"There was an error\");\n\
    \            e.printStackTrace();\n        }\n    }\n}\n```\n\n## Reading a File\n\
    \nWe have previously used the class that we are going to use now to read a file.\
    \ By using Scanner class, you are able to read contents inside text files. Here's\
    \ an example of how to do it:\n\n```java\nimport java.io.File;\nimport java.io.FileNotFoundException;\n\
    import java.util.Scanner;\npublic class ReadingAFile {\n    public static void\
    \ main(String[] args) {\n        try {\n            File aObject = new File(\"\
    insertfilename.txt\");\n            Scanner aTextReader = new Scanner(aObject);\n\
    \            while (aTextReader.hasNextLine()) {\n                String data\
    \ = aTextReader.nextLine();\n                System.out.println(data);\n     \
    \       }\n            aTextReader.close();\n        } catch (FileNotFoundException\
    \ e) {\n            System.out.println(\"There was an error\");\n            e.printStackTrace();\n\
    \        }\n    }\n}\n```\n\nWe can also return information about a file by using\
    \ a File method. For example:\n\n```java\nimport java.io.File;\npublic class GettingInfo\
    \ {\n    public static void main(String[] args) {\n        File aObject = new\
    \ File(\"insertfilename.txt\");\n        if (aObject.exists()) {\n           \
    \ System.out.println(\"Name of the file:\" + aObject.getName());\n           \
    \ System.out.println(\"Get the Path:\" + aObject.getAbsolutePath());\n       \
    \     System.out.println(\"Is it readable?\" + aObject.canRead());\n         \
    \   System.out.println(\"Is it writable?\" + aObject.canWrite());\n          \
    \  System.out.println(\"Size of the file:\" + aObject.length());\n        } else\
    \ {\n            System.out.println(\"It doesn't exist.\");\n        }\n    }\n\
    }\n```\n"
  mdcn: "\n\n有一种方法可以让我们通过结合使用两个关键字——`try` 和 `catch` 来快速且轻松地发现异常（Exceptions）。当你对一段代码块使用\
    \ `try` 时，你是在要求程序在运行该代码时对其进行错误测试。当你在 `try` 之后使用 `catch` 时，如果在使用 `try` 期间发生了错误，你将允许该代码块继续运行。\n\
    \n例如：\n\n```\ntry {\n    int dimension = length / width;\n} catch (ArithmeticException\
    \ e) {\n    System.err.println(\"ArithmeticException: \" +e.getMessage());\n}\n\
    ```\n\n我们没有使用常规的打印顺序，而是使用了 `System.err.println()`，因为这允许我们打印错误并更容易发现问题。\n\n## 逻辑错误\n\
    \n即使我们消除了所有的运行时错误和语法错误，但似乎仍然无法得到正确的输出，尽管并没有报错。这被称为逻辑错误（logic error），是程序员（尤其是初学者）经常犯错误。\n\
    \n这通常是因为程序员编写代码的方式存在缺陷。编译器或程序不会给你提供任何错误，因为这是一个逻辑问题。你设计代码的方式无法产生你所预期的输出。这些可能是非常难以修复的\
    \ Bug。然而，有一些技术和工具可以帮助你在寻找这些错误时节省大量时间，被称为测试驱动开发（TDD）。这个过程旨在当代码存在逻辑错误时为代码抛出错误。\n\
    \n## 调试技巧\n\n如果你反复检查你的代码，但仍然找不到问题的根源，你可以选择执行一些技巧来尝试解决问题。\n\n## 打印语句法\n\n你可以使用\
    \ `System.out.println()` 在代码的不同点验证你的代码。你可以在每个代码块中使用打印语句来查找返回值或变量值，直到发现异常所在。\n\n\
    ## 分解你的程序\n\n这可能是一个激进的，但如果你临时删除代码或部分代码并编译查看程序是否成功，你就可以缩小问题范围。例如，如果你删除了一半代码并运行程序没有问题，你可以加回被删除的一半或四分之一，然后重新运行，直到知道问题出在哪里。\n\
    \n与其临时删除代码，你可以将其作为注释。在大多数编辑器中，你可以通过选中代码并按下 `command + /` 来将其注释。\n\n## 第 13 章：Java\
    \ 文件\n\n处理 Java 文件的方法对于理解 Java 编程的基础也同样重要。事实上，有一个专门的类可以让你管理文件，从创建、修改甚至删除文件。在本章中，我们将介绍通过\
    \ `File` 类可以执行的主要功能。\n\n## 文件管理\n\n为了导入 `File` 类，你需要导入 `java.io` 包。以下是如何为该类创建一个新对象并指定文件名：\n\
    \n```java\nimport java.io.File;\n//这里你正在导入一个 File 类\nFile aObject = new File(\"\
    anyfilename.txt\");\n//你需要添加文件名\n```\n\n以下是你可以配合 `File` 类使用的方法列表：\n\n- `canWrite()`\
    \ - 布尔类型，用于检查文件是否可以被写入\n- `createNewFile()` - 布尔类型，用于允许创建一个新的空文件\n- `canRead()`\
    \ - 布尔类型，用于检查文件是否可以被读取\n- `exists()` - 布尔类型的方法，用于检查文件是否存在于某处\n- `getName()` -\
    \ 字符串类型的方法，返回给定文件的名称\n- `delete()` - 布尔类型的方法，用于删除文件\n- `length()` - 长整型类型的方法，获取当前文件的大小\n\
    - `getAbsolutePath()` - 返回文件的路径\n- `mkdir()` - 布尔类型的方法，能够创建目录\n- `list()` - 字符串类型，能够返回文件数组\n\
    \n## 创建文件\n\n如我们上面所示，通过使用 `createNewFile()` 方法。如果你创建成功，将返回一个 `true` 布尔值。如果目录中已存在同名文件，布尔值将返回\
    \ `false`。它的样子如下：\n\n```java\nimport java.io.File;\nimport java.io.IOException;\n\
    //这用于在发生错误时管理错误\npublic class CreatingAFile {\n    public static void main(String[]\
    \ args) {\n        try {\n            File aObject = new File(\"insertfilename.txt\"\
    );\n            if (aObject.createNewFile()) {\n                System.out.println(\"\
    The file was successfully created:\" + aObject.getName());\n            } else\
    \ {\n                System.out.println(\"The file exists\");\n            }\n\
    \        } catch (IOException i) {\n            System.out.println(\"There was\
    \ an error\");\n            i.printStackTrace();\n        }\n    }\n}\n```\n\n\
    在这里如果文件创建成功，你会看到 \"The file was successfully created:insertfilename.txt\"。如果文件已存在，你会看到\
    \ \"The file exists\"。\n\n## 写入文件\n\n为了写入文件，我们将使用 `FileWriter` 类以及 `write()` 方法。这是一个示例：\n\
    \n```java\nimport java.io.FileWriter;\nimport java.io.IOException;\npublic class\
    \ WritingAFile {\n    public static void main(String[] args) {\n        try {\n\
    \            FileWriter aFile = new FileWriter(\"insertfilename.txt\");\n    \
    \        aFile.write(\"Hello world!\");\n            aFile.close();\n        \
    \    System.out.println(\"The file was successfully written!\");\n        } catch\
    \ (IOException e) {\n            System.out.println(\"There was an error\");\n\
    \            e.printStackTrace();\n        }\n    }\n}\n```\n\n## 读取文件\n\n我们之前使用的类现在将被用于读取文件。通过使用\
    \ `Scanner` 类，你可以读取文本文件内部的内容。以下是这样做的示例：\n\n```java\nimport java.io.File;\nimport\
    \ java.io.FileNotFoundException;\nimport java.util.Scanner;\npublic class ReadingAFile\
    \ {\n    public static void main(String[] args) {\n        try {\n           \
    \ File aObject = new File(\"insertfilename.txt\");\n            Scanner aTextReader\
    \ = new Scanner(aObject);\n            while (aTextReader.hasNextLine()) {\n \
    \               String data = aTextReader.nextLine();\n                System.out.println(data);\n\
    \            }\n            aTextReader.close();\n        } catch (FileNotFoundException\
    \ e) {\n            System.out.println(\"There was an error\");\n            e.printStackTrace();\n\
    \        }\n    }\n}\n```\n\n我们也可以通过使用 `File` 方法返回关于文件的信息。例如：\n\n```java\nimport\
    \ java.io.File;\npublic class GettingInfo {\n    public static void main(String[]\
    \ args) {\n        File aObject = new File(\"insertfilename.txt\");\n        if\
    \ (aObject.exists()) {\n            System.out.println(\"Name of the file:\" +\
    \ aObject.getName());\n            System.out.println(\"Get the Path:\" + aObject.getAbsolutePath());\n\
    \            System.out.println(\"Is it readable?\" + aObject.canRead());\n  \
    \          System.out.println(\"Is it writable?\" + aObject.canWrite());\n   \
    \         System.out.println(\"Size of the file:\" + aObject.length());\n    \
    \    } else {\n            System.out.println(\"It doesn't exist.\");\n      \
    \  }\n    }\n}\n```\n\n"
