  mdcn: "\n\n# 逻辑非：!\n\n当你想要相反的结果，或者想在代码中表达清晰的意图时，可以使用此运算符。例如，如果你只需要在某个条件为假时运行代码。你可以这样写：\n\
    \n```java\nboolean hasEnoughGoals = false;\nif(!hasEnoughGoals) {}\n```\n\n##\
