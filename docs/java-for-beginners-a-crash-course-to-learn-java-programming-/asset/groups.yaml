    \ != 3398 && tries < 3) {\n    System.out.println(\"Wrong, try again\");\n   \
    \ password = getNewPassword();\n    tries += 1;\n}\n```\n\n然而，你需要确保可能会发生变化，否则你可能会陷入死循环导致程序崩溃。\n\
    \n### Do/ While 循环\n\n这些是我们刚刚看到的 while 循环的稍微变体。在这里，代码将在运行之前先不知道条件是否可能为真。如果是，那么它将继续运行直到条件保持为真。示例如所示：\n\
