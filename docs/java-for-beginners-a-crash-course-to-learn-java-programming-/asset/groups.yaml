    # Displaying Variables


    As we have seen, to print out a statement we would use System.out.println(). But
    what if we wanted to print out text, as well as a variable? You can do that using
    the "+" operator sign. Like this:


    ```

    String myCat = "Rufus";

    System.out.println("Hi there " + myCat);

    // The printout would be Hi there Rufus

    ```


    You can also add two variables together using the same operator sign. For example:


    ```

    String givenName = "Aaron";

    String familyName = "Salva";

    String wholeName = givenName + familyName;

    System.out.println(wholeName);

    // The printout would be "Aaron Salva"

    ```


    We can also declare more than one variable at a time. For that, we need to use
    a comma sign ",", but only if the variables are of the same type. For example:


    ```

    double weight = 70.5, height = 1.70, width = 5.5;

    System.out.println(weight + height + width);

    ```'
