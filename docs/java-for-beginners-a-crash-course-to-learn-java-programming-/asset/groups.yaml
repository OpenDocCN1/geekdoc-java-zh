    and installing your JDK (we will use the SE version for this purpose).


    First, you need to go to oracle.com and a list of JDK will pop up. You will have
    to select between three different tools: Public JRE, Source Code or Development
    Tools. You can install all of them, or just one or two. If you are starting out,
    you will only need the Development Tools.


    Once you have installed, you can open your Command prompt and type the `java`
    command and the return should be the version of Java that you have just installed.
    You will also need the `javac` in order to compile your programs. You can install
    the `javac` that is inside the `jdk` directory that you have just installed.'
