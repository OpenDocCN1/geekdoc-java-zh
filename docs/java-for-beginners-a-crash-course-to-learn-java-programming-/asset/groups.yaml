    # # Chapter 2: Variables


    Not all types are objects, even though Java is object-oriented. Primitives are
    basic variables where the language is built on. Those primitives are:


    +   - byte (number, 1 byte)

    - short (number, 2 bytes)

    - int (number, 4 bytes)

    - long (number, 8 bytes)

    - float (float number, 4 bytes)

    - double (float number, 8 bytes)

    - char (a character, 2 bytes)

    - boolean (true or false)


    In this chapter, we will go through the importance of variables in Java programming.
    How can variables help us achieve what we want in Java, as well as the different
    types and how we can manipulate variables and use them in our code to perform
    different tasks.


    Java variables are containers of data that allow you to save values while you
    are running the code. Each data type has a variable assigned to it that illustrates
    the quantity and type of data value that can hold in it.


    In other words, variables are the name given to any memory location while running
    the program and it is also the most basic unit of storage measurement in Java
    programming.


    Variables are information in the program. Once we name that information, we can
    use the name to access it later.


    Before you use any variable as a memory location, you first need to declare them,
    and even during the execution of the program, you can change the variables.'
