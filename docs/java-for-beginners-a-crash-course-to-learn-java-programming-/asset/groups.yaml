    # Class


    Although we will look at classes in more detail in the following chapters, we
    will roughly explain what it is, so you can make sense of the process done here.
    A class is a concept, in this case, a single concept (let''s just think of it
    as a single concept for now). Every program in Java has to have a class, and the
    name of that class has to be the name of the file program.


    In our example the class is HelloWorld. This means the class has to be declared
