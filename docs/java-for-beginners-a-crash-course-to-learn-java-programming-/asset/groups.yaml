    因为在编码时，程序员经常使用循环作为工具来帮助编写需要执行多次的代码。这不仅节省了时间，而且在我们寻找 bug 时也有帮助。通常，当我们运行循环时，Java\
    \ 中有三种主要的循环：for 循环、while 循环和 for-each 循环。我们将介绍它们以及如何使用它们。\n\n### While 循环\n\n\
    还记得 if 语句吗？While 循环的工作方式类似。如果写成代码，它如下：\n\n```java\nwhile(funkiness > 5) {\n  \
