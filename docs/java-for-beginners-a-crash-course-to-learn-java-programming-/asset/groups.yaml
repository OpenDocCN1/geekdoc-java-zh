  mdcn: "\n\n## 第3章：字符串方法\n\n我们在上一章中提到过字符串（Strings），但它们不仅仅是 Java 中的一个对象那么简单。字符串对于\
    \ Java 编程非常重要，这就是为什么 Java 有一个专门的 String 类，它包含许多可以在编写代码时对我们帮助的方法。此外，你不需要导入任何类，因为它们属于\
    \ `java.lang` 包，对于这种编程语言来说是非常基础的。在本节中，我们将将介绍 Java 编程中常用的许多 String 方法，这些方法将出现在本书的后续章节中。\n\
    \n## toString() 方法\n\n你尝试过打印对象吗？你通常会得到一个随机数字，对吧？例如，如果我们打印上面示例中的一个对象，我们会得到类似 `myCoolMotorcycle@5bc6do78`\
    \ 的内容，其中 `myCoolMotorcycle` 是对象，而 `5bc6do78` 将是内存中的位置。嗯，这并没有告诉我们关于这辆摩托车的很多信息。但我们可以改变它，让它打印出更多内容和信息。这时\
    \ `toString()` 方法就派上用场了。当我们使用这个方法时，我们打印对象，因为我们返回了一个字符串。就像这段代码片段：\n\n```java\n\
    class Motorcycle {\n    String color;\n    public Motorcycle(String motorcyclecolor)\
    \ {\n        color=motorcycleColor;\n    }\n    public static void main(String[]\
    \ args){\n        Motorcycle myCoolMotorcycle = new\n        Motorcycle(\"black\"\
    );\n        System.out.println(myCoolMotorcycle);\n    }\n    public String toString(){\n\
    \        return \"This is a \" + color + \" motorcycle.\";\n    }\n}\n```\n\n\
    这将带给我们输出：This is a black motorcycle. 因为我们写了 `System.out.println(myCoolMotorcycle)`，这反过来给了我们关于对象\
    \ `myCoolMotorcycle` 的信息。\n\n## length()\n\n在 Java 编程中，`length()` 用于返回字符的数量，在这种情况下，即字符串的长度。例如，如果我们有一个名为\
    \ \"line\" 的字符串并想要返回这个字符串的长度，我们会编写 `line.length()`。为了给你举例，请看这段代码：\n\n```java\n\
    String line = \"Hi there!\";\nSystem.out.println(line.length());\n```\n\n你认为会打印出什么？如果你猜是\
    \ 9，那么你是正确的。如果你猜是 8，请记住空格也被算作一个字符。\n\n## concat()\n\n这个字符串方法将一个字符串连接到另一个。这被称为拼接，即将将一个字符串的结尾与另一个字符串连接。假设我们有两个名为\
    \ `line1` 和 `line2` 的字符串。例如，我们编写了代码：\n\n```java\nString word = new\nString (\"\
    Alpha\");\nword = word.concat(\"Century\");\nSystem.out.println(word);\n```\n\n\
    系统将打印 \"AlphaCentury\"。我们在这个示例中所做的是取存储在 \"word\" 中的字符串对象 \"Alpha\"，并连接（或者在这种情况下是与新对象拼接），并将这两个单词链接起来。例如，如果我们没有给\
    \ \"word\" 赋值，而是写了以下代码：\n\n```java\nString word = \"Alpha\";\nword.concat(\"Century\"\
    );\nSystem.out.println(word);\n```\n\n我们将只打印 \"Alpha\"，因为字符串是不可变的（immutable），所以我们不能改变它的值。\n\
    \n如果你还记得的话，我们使用 `toString()` 方法来打印对象的名称而不是它的内存位置。我们使用 `concat()`，然后把该 `toString()`\
    \ 方法的对象连接到我们的第一个字符串上。换句话说，我们不是连接或拼接我们的初始字符串和另一个字符串，我们不是连接它的内存位置，而是 `toString()`\
    \ 的结果。\n\n## equals() & .compareTo()\n\n在变量章节中，我们已经稍微讨论过 `equals()` 方法，但现在我们将进一步完善这个概念。正如你可能记得的，我们不能在字符串中使用任何运算符，因此我们需要\
    \ `equals()` 方法。由于我们不能使用运算符，我们需要比较字符串。现在，如果我们想按字母顺序（lexicographically）比较两个字符串，我们会使用\
    \ `.compareTo()`。正如你可能记得，我们需要 `equals()` 来比较两个字符串。例如：\n\n```java\nString dog1\
    \ = \"Rufus\";\nString dog2 = \"Fido\";\nSystem.out.println(dog1.compareTo(dog2));\n\
    ```\n\n如果结果为 0，说明字符串相等。如果结果为负，意味着第一个字符串在第二个字符串之前。如果结果为正，意味着第一个字符串在第二个字符串之后。\n\n\
    ## indexOf()\n\n`indexOf()` 方法返回子字符串首次出现的索引。如果找不到子字符串，它返回 -1。例如：\n\n```java\n\
    String text = \"Hello World\";\nSystem.out.println(text.indexOf(\"World\"));\n\
    ```\n\n输出将是 6，因为 \"World\" 始于索引 6。\n\n## charAt()\n\n当我们使用 `charAt()` 方法时，我们可以获取指定索引处的字符。例如：\n\
    \n```java\nString line = \"dog\";\nSystem.out.println(line.charAt(1));\n```\n\n\
    输出将是 \"o\"，因为 \"o\" 在索引 1。\n\n## substring()\n\n记得上面我们使用 `indexOf()` 来打印吗？嗯，如果我们使用\
    \ `substring()`，我们可以打印字符串的一部分。例如：\n\n```java\nString sentence = \"To be, or not\
    \ be? That is the question.\";\nSystem.out.println(sentence.substring(21));\n\
    ```\n\n输出将是 “That is the question.”因为它从索引 21 开始。如果我们不想输出运行到结尾，我们需要定义结尾。如下：\n\n\
    ```java\nString sentence = \"To be, or not be? That is the question.\";\nSystem.out.println(sentence.substring(21,\
    \ 28));\n```\n\n这将类似于：“That is.”正如你可能注意到的，当我们添加两个参数时，第一个包含，最后一个排除。但注意索引 28 不在输出中，所以如果你想切分句子，你需要增加一个数字。例如：\n\
    \n```java\nString sentence = \"To be, or not be? That is the question.\";\nSystem.out.println(sentence.substring(21,\
    \ 22));\n```\n\n我们的结果将是 “T”.\n\n## toUpperCase() & toLowerCase()\n\n有时我们需要返回与代码中大小写不同的字符串值，为此，我们可以使用\
    \ `toUpperCase()` 和 `toLowerCase()`。正如你可能已经猜到的，前者返回大写形式的字符串，后者返回小写形式。\n\n```java\n\
    String word = \"Oh my!\";\nString uppercase =\nword.toUpperCase();\n//这将存储字符串\
    \ \"OH MY!\"\nString lowercase =\nword.toLowerCase();\n//这将存储字符串 \"oh my!\"\n\
    ```\n\n如果你需要搜索数据库，这非常棒。但一个小小的错误，例如将数据存储为小写而不是大写，会让搜索变得非常困难。请确保正确地使用此功能。\n\n字符串方法是\
    \ Java 编程中的一项基本功能，在本章中我们学习了：\n\n- 与不同的字符串方法有关\n- 每个字符串方法具体的功能是什么\n- 学习了字符串方法的实际应用\n\
    \n"
