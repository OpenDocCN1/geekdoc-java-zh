    # What Is a JVM and JRE?


    JVM (Java Virtual Machine) is used to execute Java programming. Its role is to
    transform bytecode into code that is understood by the JRE and the JDK. Besides
    that, it also has important roles in security and the management of the program''s
    memory.


    JVM has an execution engine that allows the compiling and understanding of code.
    A class loader, so you can import and initialize Java class files, and a runtime
    data area that has threads, stack areas and method areas.


    JRE (Java Runtime Environment) are the tools that we use to execute Java programming.
    Its main function is to execute Java programs, if you need to compile or develop
    code, you don''t need JRE.


    JRE deployment solutions that allow the deployment of features such as Java Plugin
    and Java Web Start. It has development toolkits that allow developers to work
    on the interface of the user. Integration libraries, allow you to use both integration
    and class libraries, as well as utility and language libraries.


    # What is a Java compiler?


    A compiler is used to take the text file and compile it into a Java file. The
    standard Java compiler is Java Language Compiler (javac), but there are others
    such as the GNU compiler, or the ECP (Eclipse Compiler for Java).


    As we have seen, Java programs are written in statements and we need compilers
    to translate those into something that is executable by a computer, such as a
    Java file.


    # What is Java API?


    Java API stands for application programming interface, which is prewritten classes,
    interfaces and packages. This helps developers and programmers to be faster developing
    Java programs. There are three types of API:'
  - '[PAGE 229]


    +   - Official Java APIs

    - Optional Java APIs, are official but not as necessary as the first group

    - Third-party APIs, usually created by users and can be downloaded online


    # ### What is Java Web Start and how is it launched?


    The main function of the Java Web Start is to allow you to run Java programs and
    applications on the Web. It''s easy to use and it doesn''t need complex installation
    processes.

    You have access to the Java Web Start once the JRE is installed automatically,
    so you should already have it on your computer once you install Java. It''s easy
    to launch the Web Start, and there are several ways to do it: You can just click
    on a web page link, create a shortcut and launch it from your desktop, or you
    can launch it through the control panel in your computer. Just go to Settings
    > Control Panel > click on the Java icon. Then go onto the General tab and click
    on View. Double click on the application and it will launch.


    # ### What is a Java Plug-in?


    Java Plug-in allows you to use applets in your web browser. Like Java Web Start,
    the Java Plug-in is installed simultaneously when you install the JRE.


    # ### How do I get a Java certification?


    A Java certification allows you to show that you are competent in using Java programming.
    Like many certifications, you will need to have classes. Take a final exam and
    pass it to acquire your certification.


    The first thing you need to do is to choose the certification you want to take.
    There are different levels and types of certification depending on what you want
    to do with your Java skills. Either way, if you are starting out, you should start
    with the basic certification and grow from there.

    You will have to take classes, and depending on the certification you are taking,
    the number of classes might'
  - '[PAGE 230]


    differ. Nowadays you can choose to have those lessons in person or online, whatever
    suits you better, these are both good options. Once you are done with the classes,
    and you feel ready to take the exam, all you need to do is book it. The institution
    you are having lessons from should provide you with a certified exam. You might
    need to get a voucher, that lasts for six months, and schedule the exam. The number
    of exams also depends on the level of certification you are taking. Some of the
    official Java certifications are:


    +   - Oracle Certified Associate Java Programmer (OCAJP) - This is the basic certification,
    where you learn about the basics of Java. You need to take the OCAJP first if
    you want to continue your Java education.


    +   - Oracle Certified Professional Java Programmer (OCPJP) - This shows that
    you have advanced Java skills.


    +   - Oracle Certified Professional Java Application Developer (OCJPAD) - This
    shows that you can both program and develop apps with Java.


    +   - Oracle Certified Master Java Enterprise Architect (OCMKEA) - It shows that
    you have mastered Java. It is one of the highest Java certifications you can get.


    # Does Java need a license?


    Java is free for educational use if run on a browser. From January 2019, commercial
    users of Java SE will have to buy an annual subscription if they want to get future
    updates. For reference, the desktop pricing per month is $2.50, while the processor
    pricing if you need to use it on Cloud or Servers is $25 a month.


