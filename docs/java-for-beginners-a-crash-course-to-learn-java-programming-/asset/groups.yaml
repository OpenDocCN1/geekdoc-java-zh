    # Threads


    In java, threads make a program work in an easier way when doing more than one
    at a time. By performing tasks in the background, threads allow the main program
    to run smoothly. You can create a thread in two different ways. You can extend
    the Thread class by overriding the run() like this:


    ```

    public class Main extends Thread {

    public void run() {

    System.out.println("This is how you create a thread");

    }

    }

    ```


    Or you can add a Runnable interface like this:


    ```

    public class Main implements Runnable {

    public void run() {

    System.out.println("This is how you create a thread");

    }

    }

    ```'
