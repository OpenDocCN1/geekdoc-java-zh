  mdcn: "\n注释（comments）和打印（print）的区别在于，注释不会显示在你的编辑器或终端上。\n\n要复习这一节，你只需要记住使用 `//` 添加单行注释，通过使用\
    \ `/* */`，你可以按顺序编写多行注释。\n\n## 类 (Class)\n\n尽管我们将在接下来的章节中详细介绍类，但我们将粗略解释一下它是什么，以便你理解这里的操作过程。类是一个概念，在这种情况下，是一个单一的概念（目前让我们把它想成一个单一的概念即可）。Java\
    \ 中的每个程序都必须有一个类，且该类的名称必须与程序名称相同。\n\n在我们的示例中，类是 `HelloWorld`。这意味着该类必须在一个名为 `HelloWorld.java`\
    \ 的文件中声明。\n\n## 编译器 (Compiler)\n\n编译器的基本功能是将人类友的代码翻译成计算机可以处理的语言。\n\n编译意味着运行程序。当你编译程序时，类会被转换为一个以\
    \ `.class` 结尾的文件，也称为字节码。然后，你可以使用 Java 虚拟机（或 JVM）来运行代码。\n\n安装好 JVM 后，你可以打开终端或命令行窗口，进入你保存\
    \ Java 程序的目录。输入以 `.java` 结尾的程序名称并按回车编译代码。\n\n之后，你应该能看到 `.class` 文件的出现，假设你的代码中没有错误。\n\
    \n通常，或者至少在你学习期间，编译器可能会为你运行程序；然而，当你离开平台开发环境工作时，编译器可能会运行也可能不会，你需要知道自己犯了哪些错误。Java\
    \ 编译器通常在计算机开始运行代码之前就能理解代码中可能出错的地方。\n\n例如，如果你有一个名为 `Compiling.java` 的文件，我们可以在终端上使用命令来编译它：\n\
    \n```\njavac Compiling.java\n```\n\n如果没有错误，编译器将创建一个 `.class` 文件。因此，可以使用使用终端命令执行此\
    \ `Compiling.class`：\n\n```\njava Compiling\n```\n\n如果你的代码中存在错误，则不会创建 `.class`\
    \ 文件，你必须修复错误并运行命令来创建 `.class` 文件。\n\n如果编译器运行且没有错误，它将创建一个可执行的 `.class` 文件。这意味着你可以从终端运行程序。\n\
    \n这是一个 `.java` 文件和 `.class` 文件的示例。假设我们有以下代码：\n\n```\npublic class Compileandecutable.java\
    \ {\n    public static void main(String[] args) {\n        System.out.println(\"\
    These are the differences\");\n    }\n}\n```\n\n我们可以通过添加命令来编译此程序：\n`javac Compileandecutable.java`\n\
    \n如果一切顺利且你没有犯任何错误，这意味着你的程序编译成功了。这也意味着你应该有两个不同的文件：\n\nCompileandecutable.class。这是这是我们未编译的代码文件，可以由\
    \ JVM 执行。只需使用命令 `java Compileandecutable` 即可执行此程序。\n\n## 空格与分号 (Whitespace and\
    \ Semicolons)\n\n这些是程序忽略的代码之间的行和空格。这样做是为了让朋友或同事等其他人能够轻松解释代码。通过添加空格，你让代码易于理解。这样的示例如下：\n\
    \n```\nSystem.out.println(\"You can write whatever you want here\");\nSystem.out.println(\"\
    As you can see, there’s a space between line codes\");\n```\n\n在运行程序后，看到的应该如下所示：\n\
