    \   default:\n        // 代码\n        break;\n}\n```\n\n在本节中，我们将学习 switch 语句以及它是如何工作的。\n\
    \n```java\nint fruit = 1;\nswitch (fruit) {\n    case 1:\n        System.out.println(\"\
    Apple\");\n        break;\n    case 2:\n        System.out.println(\"Banana\"\
    );\n        break;\n    default:\n        System.out.println(\"Unknown fruit\"\
    );\n}\n```\n\n"
