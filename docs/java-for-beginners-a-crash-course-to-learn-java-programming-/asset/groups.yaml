    \    //note that it's place 51 because it is not inclusive\n    System.out.println(randomNumbr);\n\
    }\n// the printout would be a number between 0 and 50\n```\n\n# Java Packages\
    \ & API\n\nWhen we talk about packages in Java, we are mentioning groups of classes.\
    \ Just like a computer folder, for example. In order to create clear and more\
    \ maintainable code, we use packages with unique names so we don’t get confused\
    \ about which are which. We can divide these packages into two different categories:\n\
    \n- Built-in (from the Java API)\n- Own Packages (created by users)\n\n# Built-in\
    \ Packages\n\nThese are the Java API and they can be seen as an internal Java\
    \ library with classes that are already written and ready to use. All of these\
    \ packages are free to use. You can find many classes that there allow you to\
    \ do many things.\n\nThis internal Java library is then further divided into classes\
    \ and packages. If you import a class, you will get a single class with its attributes\
    \ and methods, but if you import a package, you will get several classes that\
    \ are related to each other. So how do we import packages or classes from the\
    \ Java internal library? Let's have a look:\n\n```java\nimport package.nameOfClass;\n\
    //you would import a single class\nimport package.nameOfPackage.*;\n//you would\
    \ import a package\nimport java.time.LocalDateTime;\n```\n\nTo give you a specific\
    \ example:\nThe package in the example above would be java.time, this package\
    \ allows you to introduce dates, times, duration and instants. And then we would\
    \ narrow it down to the class LocalDateTime, which allows access to the current\
    \ date and time. For example:\n\n```java\nimport java.time.LocalDateTime;\npublic\
    \ class TimeNow {\n    public static void main(String[] args) {\n        LocalDateTime\
    \ now = LocalDateTime.of(2022, 3, 45, 32, 6600);\n        System.out.println(\"\
    Hours = \" + now.getHour());\n        System.out.println(\"Minutes = \" + now.getMinute());\n\
    \        System.out.println(\"Seconds = \" + now.getSeconds());\n        System.out.println(\"\
    Nanos = \" + now.getNano());\n        System.out.println(\"Year = \" + now.getYear());\n\
    ```\n\nThe printout would look something like this:\nHours = 3\nMinutes = 45\n\
    Seconds = 32\nNano = 6600\nYear = 2022\nMonth = FEBRUARY\nDay = 3\n\nIf you go\
    \ to the official website of Oracle, you will have many packages to choose from\
    \ and many other classes. Just remember, if you want to import a whole package,\
    \ you need to write it like this:\nimport java.time.*;;\n\nYou will need to use\
    \ the \"*\" in order to import the whole package.\n\n# User-Defined/Third-Party\
    \ Packages\n\nIf you want to create your own package, you will need to store it\
    \ in a specific Java directory. The keyword you will need to use is *package*,\
    \ and it's applied like this:\n\n```java\npackage myownpack;\nclass MyPackageClass\
    \ {\n    public static void main(String[] args) {\n        System.out.println(\"\
    I created this package\");\n    }\n}\n```\n\nYou will need to save this as MyPackageClass.java\
    \ in order to compile it:\n\n```bash\nC:\\Users\\Name of Your Computer>javac MyPackageClass.java\n\
    Then,\nC:\\Users\\Name of Your Computer>javac -d .\nMyPackageClass.java\n```\n\
    \nThere are two keywords here: -d allows you to specify a certain destination\
    \ to save the file, while \".\" allows you to retain the package in the same directory.\n\
    \nThen, after we have compiled the package, a folder named “myownpack” was created.\
    \ To run you will need to type:\n\n```bash\nC:\\Users\\Name of Your Computer>java\n\
    myownpack.MyPackageClass\n```\nAnd you will get:\n\n# Abstract Classes and Methods\n\
    \nWhen we mention abstraction, we are hiding certain details and showing only\
    \ the necessary data. We can use abstract classes and methods. For instance:\n\
    \n```java\nabstract class Insect {\n    abstract void insectNoise();\n    public\
    \ void sleep() {\n        System.out.println(\"Sleeping...\");\n    }\n}\n```\n\
    \nclass Bee extends Insect {\n    @Override\n    void insectNoise() {\n      \
    \  System.out.println(\"Bzz!\");\n    }\n}\n\npublic class Main {\n    public\
    \ static void main(String[] args) {\n        Bee bee = new Bee();\n        bee.insectNoise();\n\
    \        bee.sleep();\n    }\n}\n\n# Interfaces\n\nInterfaces are used to define\
    \ a contract that classes must implement. A class can implement multiple interfaces.\n\
    \n```java\ninterface oneInterface {\n    void aMethod();\n}\n\ninterface twoInterface\
    \ {\n    void bMethod();\n}\n```\n\nclass DemonstrationClass implements oneInterface,\
    \ twoInterface {\n    @Override\n    public void aMethod() {\n        System.out.println(\"\
