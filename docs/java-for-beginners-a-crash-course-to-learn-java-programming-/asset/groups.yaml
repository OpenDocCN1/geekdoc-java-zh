    \ These are bugs that the compiler identifies.\n- Run-time errors: These happen\
    \ once the program is running.\n\nUsually, syntax errors and bugs are the easiest\
    \ to find since the compiler does the job for you, followed by run-time. And the\
    \ hardest to look for and fix are logic errors since the programmer has to actively\
    \ look for them. Let's go through these three different types:\n\n# Syntax Errors\n\
    \nThe compiler is the first method we usually use to detect any syntax error in\
    \ our code as grammar mistakes that we make. These are very easy to spot and fix\
