    century B.C.¹⁹ But many names in the Deir el Medina archives contain only one
    or two strong consonants, that even when one suspects that a name is foreign,
    there may be possible cognates in two or three west Asiatic languages. In such
    cases, it is not possible to be certain that the name is foreign—and if it is,
    there remain problems in determining its origin. These difficulties revolve around
    two areas of evidence: the source material in foreign languages, and the often
    tricky issue of phonetic transmission and change.


    First, the source material. It is clear from Egyptian textual and pictorial evidence
    that foreigners came to Egypt from all regions around the Nile Valley and personal
    names from all these are preserved in Egyptian documents. But it is not always
    possible to suggest precise cognates in foreign languages: that is, the same name
    actually written in a foreign language. For the major languages of western Asia—Akkadian,
    Hittite, Hurrian, Amorite, and a number of more locals such as Ugaritic, Hebrew,
    and Phoenician—we possess enormous store of names; their collection and study
    has been a major research effort for generations, that our ability to compare
    foreign names in Egyptian texts with those in the whole of western Asia is almost
    unlimited. By contrast, because we have no contemporary texts in other African
    languages, comparable African names simply do not exist. We know that Libyans
    and Nubians lived in Egypt and in texts, but the names as originally written down
    in these languages are lost to us. The Sudanese Merotic texts preserve a large
    number of personal names, but they date to Hellenistic and Christian times. The
    earliest Libyan names written in a local language appear in Punic texts from places
    like Carthage, again from Hellenistic and Roman times.²⁰ One cannot use these
    later languages as comparative material for African names found a thousand years
    earlier during Egypt’s New Kingdom. In other words, though we can be reasonably
    sure that Libyans and Nubians lived in El Medina and that some Libyan and Nubian
    names appear in the village archives (indirect evidence warrants the assumption
    in a few cases: see Appendix A, nos. 31, 32, and 34), it is rarely that we can
    define a specific personal name as African—and even when we are unable to produce
    a cognate in an African language. This means, of course, that we are unable to
    assess the extent of African penetration into the native population of Egypt.
    Unless contemporary inscriptions in the Af-'
