    In selecting foreign cognates from the sources—namely West Asiatic—that we do
    have, we confront the complicated matter of phonetics. Because Egyptian scribes
    in recording a foreign word or name wrote what they *heard*, we are dealing with
    oral, not written, transmission and all its intricate phonetic problems. This
    simple fact opens a veritable Pandora’s box of difficulties. I will illustrate
    this with a modern example. In a small Arabic restaurant in Beirut our waiter,
    who spoke neither English nor French, asked if we would like some “obble bye.”
    Of course, he meant “apple pie,” but there is no p phoneme in Lebanese Arabic,
    so he heard this as a b. Likewise, he said “obble” rather than able because his
    ear could not distinguish the English sound in “apple.”


    We face exactly this kind of phonetic problem in trying to isolate the original
    of a foreign name, recorded in Egyptian, where we suspect came one of the languages
    of western Asia. When the Asiatic foreigners who came to live at El del Medina
    pronounced their names, the transmission of those names into Egyptian depended
    on how they sounded to Egyptian hearers. The village scribes therefore had to
    make do with what *they* heard and then spell foreign names and words as best
    they could. Since the languages of western Asia contained phonemes not present
    in Egyptian (and vice versa), such phonemes were reproduced in writing by Egyptian
    phonemes that only approximated the correct pronunciation.


    Some years ago, I lived in a small town in Massachusetts where, because of the
    local strong New England accent, I was known as “Mr. Wad.” I tried vainly to correct
    the error but finally gave up in the face of a whole community recorded locally,
    the archives of a Massachusetts village would forever have preserved the temporary
    presence of one “Wad.” Much the same happened at Del Medina, so that even though
    we have an enormous amount of comparative material in the West Asiatic languages,
    we are often hampered by having to deal with what an Egyptian scribe heard and
    wrote down as he heard it, as it was not really pronounced. Every language has
    phonemes that are simply not heard by those who do not speak it, as any English
    speaker knows who has wrestled with the sounds of Arabic, Russian, or Chinese.


