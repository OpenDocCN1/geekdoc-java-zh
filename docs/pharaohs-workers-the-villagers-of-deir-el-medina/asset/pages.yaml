  md: '# FOUR


    # Aspects of Domestic Life and Religion


    Florence D. Friedman


    Religious concerns and obligations were a part of everyday life for the people
    of Deir el Medina. It is well documented that workers frequently took days off
    to perform a variety of cultic duties in the village: brewing beer for local festivals,
    making libations to the dead, or preparing and assisting at funerals.¹ There were
    festival celebrations in honor of deified kings, most notably Amenhotep I, the
    traditional founder of the village and oracle par excellence.² There were also
    devotions to Thuthose III of the Eighteenth Dynasty, and celebrations of the jubilee
    festivals of Rams II and III.³ Furthermore, the villagers participated, at least
    in some cases, in such major Theban celebrations as the Festival of the Valley
    and the festival of Opet, possibly even developing a local variant of the Opet
    festival within their own community⁴


    The inhabitants of Deir el Medina seem to have enjoyed a shared religious culture
    with Thebes, and probably Egypt as a whole, but religious practices within their
    life were often focused on personal concerns that could be addressed to favorite
    deities, and deified kings or forebears. Individuals made pleas to the gods through
    votive offerings in their local temples and private chapels, and through funerary
    offerings at the tombstites of deceased relatives whom they honored and whose
    aid they implored. In seeking the help of the gods or of the dead, the settlers
    adapted formal religious experience to personal and family needs, liber-


    [95]'
  merge: -1
  pgno: 105
- img_proc: true
  md: '# Spiritual and Intellectual Matters


    ally employing magic, divination, oracles, and seers peculiar to their settlement.⁵


    The movement from the broader, formal structure of worship of the standard deities
    to the more specific and personal veneration of gods and divinized beings who
    could help in private life was undoubtedly the norm in settlements everywhere,
    but it is clearer in Deir el Medina thanks to the material remains that have survived.
    At such a uniquely presented site one can see evidence of beliefs that are less
    the result of theological engineering than the product of naturally evolving popular
    tradition. One personal aspect of this tradition concerned domestic religion,
    practices carried on in the household, some of which mirrored cult practices conducted
    in the worthy chapels and at tombs.


    Housing in Deir el Medina, which was provided by the state, was fairly standard
    in plan. Though there were certainly variations in size and the number of rooms,
    the typical village house in Ramesse times consisted of an antechamber, or first
