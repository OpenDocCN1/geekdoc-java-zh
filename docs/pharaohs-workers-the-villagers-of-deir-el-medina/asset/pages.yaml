    also known. Whether those priests did more in the way of instruction, preaching,
    blessing, or assisting the workmen is not known and therefore perhaps not likely.


    The cult of the long-deceased Amenhotep I, known as "Lord of the Village" and
    regarded as its founder, was among the most important for these particular villagers.
    This deified king had many feasts during the year at which his statue was carried
    in procession by the *wab* priests, and he was called upon to resolve disputes,
    particularly those involving real estate. The god''s oracular pronouncements—however
    they were made with the help of whatever priests—had great weight, and his processes
    were a high point in community life. There were cult chapels to at least each
    pharaoh of the New Kingdom as well, since they or Amenhotep could replace Amon-Re
    in a ritual performed by Rams II, and could also replace Osiris in a tomb painting
    of the judgment of the deceased, the annual parade of Amon-Re from Karnak to the
    West Bank was part of the beautiful Feast of the Valley, the greatest festival
    in which the villagers participated, and Osiris was one of the most frequently
    represented.


    In addition to cult statues (probably of wood), votive stelae, and libation basins,
    several chapels had benches for twelve persons, seven on one side and five on
    the other. These benches and seating arrangements have no parallel elsewhere and
    no satisfactory explanation as yet. Persons may have sometimes slept from a god,
    as Ashraf Sadek has suggested (Popular Religion in Egypt during the New Kingdom;
    Hildesheim, 1988). In any case, these chapels—with hidden oracles, animal pens,
    resident guards, libation basins, as from cooking, benches, and cult objects for
    all kinds, including ancestors—must have been very special gathering places, where
    so-called offerings were consumed by like-minded people or family groups who perhaps
    belonged to or attended one or more of these fraternities or assemblies.


    The settlement on the path from Deir el Medina to the Valley of the Kings, where
    the workmen spent nights during the ten-day week, also contained more than 50
    small shrines, indicating the wide-spread personal devotion of the workmen even
    away from home and family. They also suggest that social devants—such as a woman
    known to have stolen temple property and to have sworn a false oath,'
