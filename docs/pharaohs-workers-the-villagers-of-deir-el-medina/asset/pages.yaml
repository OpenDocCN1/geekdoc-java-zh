    # Magical Practices

    among the Villagers


    Joris F. Borghouts


    It is a curious paradox that the New Kingdom village of Deir el Medina is the
    best-documented community in the whole history of Pharaonic Egypt and, at the
    same time, a most exceptional one. It was not an agricultural settlement, which
    could have had a natural growth, but an artificial one. Its inhabitants were stonemasons
    and painters and their families, people who probably had a higher degree of literacy
    than those elsewhere.¹ Also, as workers in the service of the state they were
    relatively well paid, and when their salaries, they received in the form of rations,
    were in arrears, they could complain directly to such high officials as the vizier
    and, later, the high-priest of Amon in Karnak or even go on strike, surviving
    administrative records show.² The workmen were well aware of their own importance,
    for theirs was the duty of building and decorating tombs for kings and nobles,
    and stoppage of the work would be a reason for concern in high places. They privileged
    people, even though their employment was sometimes subject to the arbitrary decisions
    of the mighty pharaonic bureaucracy.³ The village—its inhabitants never referred
    to it otherwise as “pa demi” (p³ dmi), the “Village”—ended its existence in a
    disturbing way. With continual raiding by Bedouin in Libyan deserts made it an
    insecure place to live, the community moved in its entirety to the safe precincts
    of the funerary temple of a former king, Rams III, at nearby Medinet Habu. Thereafter,
    its members’ history is characterized'
