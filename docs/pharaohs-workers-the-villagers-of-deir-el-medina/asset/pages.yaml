  md: '# ONE


    # Rank, Roles, and Rights


    Barbara S. Lesko


    > A man is asked about his rank,

    a woman is asked about her husband.

    —Maxims of Ani


    Contrary to popular belief, the pyramids of the pharaohs were not constructed
    by slaves, nor the richly outfitted tombs in the Valley of the Kings by many who
    were subsequently put to death to protect the hidden royal treasures. Just how
    much actual freedom and wealth the tomb builders of the New Kingdom enjoyed a
    major concern of the scholars engaged in studying Deir el Medina. The ancients
    themselves left behind many various records which, taken together, help shape
    an assessment of their social and financial status and even their freedom of movement.
    Judging their actual civil liberties, how much they their countrymen were able
    to live free of manipulation by others, to pursue a life of their own choosing,
    is far more difficult, and the final word on this subject will surely not be written
    for some time to come.


    When the workmen''s village was reestablished in western Thebes after the Amarna
    interlude, it was part of a changed world. Thebes was no longer a power, for Horemheb
    and the subsequent kings of the Nineteenth Dynasty saw the strategic necessity
    of again residing in ruling from the northern regions of the country, besieged
    as it had been by Asiatics since the last years of Tutankhamun''s reign. Now were
    the old Theban aristocratic and clerical families any longer in evidence. If the
    latter had been victims of Akhenaton''s monotheistic religious zeal, the former
    now found themselves outmaneuvered by the rising professional'
  merge: -1
  pgno: 25
- img_proc: true
  md: '# Social and Economic Concerns


    warrior class. The army was the largest and most cohesive group left after the
    Amarna period—clearly the only institution on which the king could rebuild the
    country.


    The void in the temples closed by Akhenaton, under Horem-hab, filled by “ordinary
    priests and lectors from the pick of the army,” according to Alan Gardiner.¹ This
    policy was accelerated under the Ramessides, and similarly, the militarization
    of the state administration was undertaken in the late Eighteenth and the Nineteenth
    Dynasty.² The most important officials invariably had military backgrounds, and
    now those chose to be buried in the north close to the centers of power, as in
    the great Memphite necropolis at Saqqara. It is noteworthy, however, that in Egyptian
    culture one finds few ever celebrating an individual’s acts of heroism and no
    portraits of military men with their arms and armor. The invincible might of the
    divine king apparently preempted claims of personal value and power on the part
    of private persons.


    The population of western Thebes was not large and was very likely impoverished
    when Horemhab turned his attention to it.³ During the Nineteenth and Twentieth
    Dynasties most inhabitants were priests and those who worked temple lands or crafted
    the divine images and implements needed in the temples or the necropolis. Priestly
    families lived off the landholdings of their temples and the food that was first
    offered on the altars. Gustave Lefebvre found evidence that the priests of Amon
    of the Nineteenth Dynasty enjoyed only moderate social prestige, and Ahmed Kadry
    found “no proper leadership for a renewed struggle for power” among this priestly
    hierarchy.⁵


    It must be remembered, however, that at its highest levels much of the clergy
    had its roots in the warrior class and was very much controlled by the crown.
    Hardy argues that the entire economic life of the country was “controlled by the
    king through an efficient state apparatus composed mainly of the personnel of
    the new military class.”⁶ Indeed, at the top of society, just below the royal
    family, the aristocracy of chariot-owning knights, who lived in the provinces
    if they wished and who held much property in the form of land and slaves.⁷ In
    general, couriers from the warrior class were given land grants large enough to
    permit them a decent standard of living after taxes were paid to the crown. They
    and royal family members enjoyed social prestige and influence with pha-raoh.'
  merge: -1
  pgno: 26
- img_proc: true
  md: '# Rank, Roles, and Rights


    To argue for the military''s hand in everything, however, is to overstate the
    case. It must not be forgotten that another very important and elite group controlled
    the civil administration. Ever since the Old Kingdom, Egypt had been run by a
    vast civil service staffed by men whose primary qualifications were intelligence
    and education. Almost from the beginning of their history, the kings of Egypt
    required ambitious building projects, and it was the scribal class that did the
    calculating for the procurement of building materials and the engineering of the
    structures. Government scribes computed the taxes that paid for these projects
    and drew up the roll calls for the labor corées that carried out the work. In
    fact, virtually every aspect of life in this sophisticated nation, from land measurement
    to time and calendrical calculations, needed a body of educated civil servants
    proficient in mathematics, particularly geometry, and well-trained in the reading
    and composition of a very complex writing system. A literary forming in the Middle
    Kingdom extolled the scribe as superior to (even tumultuous of) in all other careers,
    and this together with the popularity of portraying any man of stature as a scribe
    (a tradition since the Old Kingdom) suggests that the attitude of pride and superiority
    was certainly well established among this class of people. Even snobbish variations
    on this theme are found in the literature of the New Kingdom: “Be a scribe, that
    your limbs be smooth and your hands languid, that you may go dressed in white,
    be exalted so the courtiers salute you . . . . one who is skilled, he arises step
    by step until he reaches [the position of] an official.”—8


    The recognition of promotions to positions of real power was readily within their
    ranks, which were closed to all who were not well trained and educated, encouraged
    the air of superiority among scribes, and theirs were an elite class; as the author
    of a Twentieth Dynasty school text put, “One calls and a thousand answer” (P.
    Lensing, AEL). It took years of student study to master writing and required a
    poor family to forgo the labor of one of sons in order to permit him to advance
    in the world, the scribe’s life was one of relative ease and status. Even military
    leaders, significant though they were to the real power of the Egyptian empire,
