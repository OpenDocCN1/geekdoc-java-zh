    The population at Deir Medina was in any case a microcosm of all Egypt. We find,
    for example, this mixture of Canaanites and other foreigners in the Tomb Robbery
    Papyri, which are concerned with the whole Theban region, and the Wilbur Papyrus,
    which records the population of a region in Middle Egypt.27 The village was thus
    much like other parts of the country with respect to the diverse origins of its
    inhabitants.


