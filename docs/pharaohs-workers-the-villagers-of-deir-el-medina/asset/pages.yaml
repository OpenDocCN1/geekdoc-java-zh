  md: '# Introduction


    organization of work, the economy, society, education, legal and religious concerns,
    and some factors that are difficult to categorize.


    The ancient name of the site was Set Maat, “the Place of Truth,” and the workmen
    “servants” in the Place of Truth. The community seems to have been established
    near the beginning of the Eighteenth Dynasty, at least by the reign of Thutmose
    I (c. 1500 B.C.)—whose name has been found on some bricks in the walls surrounding
    the village—or perhaps a few years earlier, since the villagers through many generations
    did Amenhotep I and his mother, Queen Ahmose Nefertari, in special esteem, possibly
    as patrons of the workmen’ community.


    The Eighteenth Dynasty occupation of the site is not well documented, and it would
    have been abandoned anyway during the so-called Amarna interlude (1367–50 B.C.),
    when Akhenaton moved his royal residence and had to the tomb prepared at El Amarna.
    Essentially, our story begins at the very end of the Eighteenth Dynasty, with
    the reestablishment of the royal work gangs in western Thebes under Horemhab in
    his seventh year. Since the community at Deir Medina thrived from nearby Medina
    Habu to the beginning of the Twenty-First Dynasty, we are speaking now of some
    230 years, roughly 1310––1080– B.C. Obviously, in the few centuries when the village
    was inhabited and the work on the many royal tombs progressed, the material remains
    of the earlier generations of workers would have been displaced by those of the
    later; and in the several millennia, since would have been lost to invaders, nearby
    villagers, monks who settled in the valley, serious tomb robbers, and tourists.
    Even survives after all this, has much to teach us.


    A major find of papy was made near the village in the 1840s, and throughout the
    last century objects obtained to be taken from the area. Scientific excavation
    of the site of Deir Medina from 1905 to 1909 by the Italian archaeologist Ernesto
    Schiaparelli added considerably to the Egyptian Museum at Turin, and its collection
    of papy and ostraca (the broken potsards and limestone flakes used as writing
    material) grew enormously. A French mission began working at Deir Medina in 1917
    and under Bernard Bruyere''s direction between 1922 and 1951 excavated the entire
    site—village, cemetery, and dump—providing a very substantial base of documented
    material. From it, we now know many of the people who belonged to the community
    through


    [7]'
  merge: -1
  pgno: 17
- img_proc: true
  md: '# Introduction


    the years, often where they lived, where they were buried, what they owned, and
    even in a few cases their handwriting and artistic peculiarities. With this base
    much that was removed in the almost free-for-all plunder of the previous century
    can now be reassociated. Many pieces from the extensive nineteenth-century collections
    by Henry Salt and Bernardino Drovetti and now enhancing the British Museum in
    London, the Egyptian Museum in Turin, the Louvre, the Ägyptisches Museum Berlin,
    and even the Museo Nacional de Rio de Janeiro are evidently from Deir el Medina,
    including hundreds of stele, statues, and papyrus.


    Bruyère’s seasons of work were followed by prompt publication of preliminary reports,
    though the full publication of the tombs and finds continues at a very slow pace.
    Unfortunately, Bruyère apparently did not have sufficient control over his dig;
    it now seems that half the papyrus excavated from the site during the 1920s were
    removed surreptitiously while the excavations were going on. The large pit used
    at a town dump, perhaps at a later period, was probably his most rewarding discovery,
    since it contained thousands of ostraca with both literary and nonetary. Bruyère
    was particularly fortunate to have as his philologist the great Czech Egyptologist
    Jaroslav Černý, who later became professor of Egyptology at Oxford’s Queens College.
    His decipherment and publication of many of the non own ostraca have formed the
    basis for much of the information that has already been published about the community
    and the foundation upon which the students and the rest of us are attempting to
    build.


    The sales documents that survive provide important data on prices and exchange
    in the ancient economy. Private letters reveal details of social relations, parenting,
    and marriage. Charms and prayers say much of these people’ approach to the divine,
    their beliefs and fears. Egyptologists seeking facts about the history of law
    and jurisprudence, early medicine and public health, or labor relations naturally
    turn to the records of Deir el Medina and their wealth of detail. Through popular
    books and even a television series, millions around the world would have been
    introduced to some of the inhabitants of the village and gained a general understanding
    of what life was like three thousand years ago in this fascinating artists’ colony.
    There are still myriad details to recover and puzzles to solve, however, and the
    interpretive work continues. It is the goal of the contributors to this volume
    to reveal still more about the lives of Pharaoh’s workers.'
