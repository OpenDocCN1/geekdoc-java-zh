    In the four hundred years or so of its occupational existence, however, the Village
    developed certain religious customs of its, such as the high esteem for their
    chief saint, the deified king Amenhotep I. So far, no overall study of the religious
    life of this community has been undertaken, although there are studies on festivals,
    individual gods, and some of the cultic aspects.6 Yet we are still waiting for
    the integrated research would be based on both archaeological and textual sources
    and would put these things together in a coherent pattern. It would be a unique
    opportunity to study popular religion in its relationship to all kinds of aspects
    of the daily life.7


    I will not attempt to do anything of the kind in here. I will merely touch certain
    aspects of magical practice, as far as reported by the written sources, and this
    magic is of the everyday event. In what has so far been written on magic has been
    on the religious life of this community of artisans, the subject of magic has
    been almost completely neglected. One reason for this disregard is that perhaps
    magical practice has mostly a private character, whereas present-day Egyptology
    focuses rather on the abundantly documented funerary and temple religion: that
    is, on official theology. Further, there is a tendency to dissociate what is generally
    regarded as religion from what is considered magic, although from the viewpoint
    of anthropology, separating the two often makes little sense.


    Indeed, in ancient Egypt magic was firmly rooted in theology. According to a statement
    made some seven hundred years before this village began its history, in the famous
    “Teaching for King Mericare” of the early Middle Kingdom (c. 2000 B.C.), magic
    was sent to mankind as a gift from the creator god himself and served “to ward
    off the stroke of an unexpected event.”8 A recent discovery has identified a part
    of this teaching among the many literary pieces coming from the remains of Deir
    Medina, so some of the more enlightened inhabitants may have known this statement,
    too.9 The term used in this source is “heka” (hk3), and though there are more
    terms (as we shall see), it is also the most frequent one in the documentation
