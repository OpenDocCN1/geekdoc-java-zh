  md: '![](img/3849815dccde09afee541e3ef8522fa5_99_0.png)


    It is always difficult to understand the psychology of people who lived so long
    ago and about whom we have only random knowledge. At Deir Medina, where the workmen''s
    whole lives were devoted to excavating and decorating royal tombs intended for
    life after death, there had to be a special aura of magic and mystery that would
    have particularly touched the most religious among them. Since the decoration
    of the Books of the Dead, if not from the royal tombs, combined with the tomb
    chapels of their own tombs contains mythological vignettes from Books of the Dead
    the more customary ritual and daily life scenes that they could have studied in
    the tomb of the elite, it would seem that the villagers were generally quite religious,
    optimistic about a blessed hereafter, and willing to devote the most of their
    time and resources to that end. Their expectation for the afterlife would probably
    not have been equivalent to that of their kings and queens, which they like others
    would have understood, but presumably believed that they were capable of attaining
    a state not less blessed than that of the nobility or at least of the local Theban
    officialdom buried in other nearby cemetery hills.


    Private votive stelae provide perhaps the best evidence of the personal piety
    and religion of the common people of Deir Medina. These were individual expressions
    of faith or confidence in one or another deity, gratitude for divine favors, and
    petitions in adversity. Physical ailments required a deity''s attention as much
    as a physician''s; the carved and'
  merge: -1
  pgno: 99
- img_proc: true
  md: '# Spiritual and Intellectual Matters


    painted ears on many stelae were intended to get a god''s attention rather than
    to call attention to earaches. The votive stelae show insistent public action,
    which the members of the community as a whole would have understood and sympathized
    with, and a closeness to the gods borders familiarity rather than awe or dread.
    Among the household deities favored De El Medina, women looked to Hathor, Taweret,
    and Bes for protection in childbirth, and to Renenutet and Mereseger for food
    and safety. The workmen themselves seem to have particularly honored Ptah and
    Reshep in connection with their patronage of craftsmanship and strength, and shrines
    to Thoth and Seshat reflect the scribal activity of some.


    The number of chapels dedicated to various deities is indicative of the workmen''s
    devotion, tolerance, and need for public religious expression. The villagers had
    to sixteen to eighteen small temples or chapels; the larger ones among them were
    those dedicated to Hathor and Reshep II at the north end of the village and to
    Ptah on the southwestern path leading to the Valley of the Queens. Any individual
    chapel would have provided a local residence for the god or goddess to whom it
    was dedicated and a locus for offerings to that deity. From some of the chapels
    suggest that a few were devoted to ancestor cults, shrines to the greatest gods
    mingling with those (Mereseger), distant (Khnum, Satis, and Anubis), and foreign
    (Reshep, Anath, and Kadesh) gods of royal ancestor cults. The chapels symbolize
    the recognition of both national and local gods, and in the important matter of
    their mortuary beliefs—it would seem that the local Mereseger, “Lady of the Mountain”
    was at least as important as the god of the dead, Osiris.


    Although the small temples or chapels may have been places for some ritual observances
