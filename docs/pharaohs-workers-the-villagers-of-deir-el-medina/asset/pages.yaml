  md: 'The workmen who lived at Deir el Medina included the quarrymen or stonecutters
    who excavated the royal tombs in the limestone hills and cliffs of the Valley
    of the Kings and Valley of the Queens, and also the sculptors, craftsmen, and
    painters who decorated the excavated tombs. Although the limestone is generally
    soft and not difficult to work, the extent of the excavations—often hundreds of
    feet into the cliffs or the valley floors—and the fine finish of the delicate
    low-relief carving demonstrate the considerable extent of each undertaking as
    well as the high quality of the sculptor’s work. The quarrymen and sculptors were
    generally the same individuals, apparently. The decoration was guided by accomplished
    draftsmen who laid out the designs and enlarged them from gridline drawings to
    fit the space available, carefully checking and frequently correcting the guidelines
    on the walls. The painters'' confident lines and fine brush strokes indicate their
    high skill, and the wide variety of pigments available to them permitted feathering,
    shading, and remarkable detail in the representation of textiles.


    The size of the tomb work varied from about thirty in the slow period during the
    middle of the long reign of Ramses II to twenty in the reign of Ramses IV; to
    sixty men would have been the norm. In addition to the artisans, the village generally
    housed some administrators—specifically, the foremen of the two separate gangs
    that shared the work, and at least one scribe in the Nineteenth and two or more
    in the


    [II]'
  merge: -1
  pgno: 21
- img_proc: true
  md: '# Social and Economic Concerns


    Twentieth Dynasty. The community included the workmen'' wives, children and other
    dependents as well, and was served by a few resident coppersmiths, carpenters,
    potters, basket-makers, and even a part-time physician. Support staff who resided
    not in the Place of Truth nearby—woodcutters, water carriers, fishermen, gardeners,
    washermen, and flour grinders—were likewise paid by the state and supervised by
    local officials. Although some newcomers periodically joined the community, particularly
    when the work force was increased in size, the population was generally fairly
    stable, and fathers could be succeeded by sons through many generations. Still,
    there would not have been enough vacancies for apprentices to provide jobs for
    all the children of the workmen, and with occasional decreases in the size of
    the work force, many would have been laid off or forced to accept more menial
    jobs.


    From what we know of the income and status of the workmen, they would have to
    be considered in modern terms as middle class. They certainly had no royal or
    noble family connections, and much of their work, such as quarrying the tombs,
    was difficult and unpopular. They were not slaves, however, but salaried employees
    whose individual wages—paid in the form of rations—were perhaps three times those
    of a fieldhand. In addition, “moonlighting”—making furniture, stelae, or other
    funeral equipment for their neighbors—was a widespread practice that helped some
    achieve an even comfortable standard of living. When on occasion their pay rations
    were overdue, they did not hesitate to go out on strike. In one instance, on the
    authority of the vizier (second in command to pharaoh, the official or less directly
    in overall charge of their work), the temple storerooms across the river at Karnak
    were opened to pay them.


    When they were not moonlighting, the sculptors bus themselves in preparing their
    tombs and burial equipment, probably making use of the valuable copper tools provided
    for their use in the royal tombs, even though these would have worn down quickly.
    The painters likewise either allowed to use or may have appropriated some of the
    pigments intended for the royal tombs for their own tomb paintings as well as
    the commissions they carried out for others. Perhaps such perquisites went along
    the job.


    The villagers established their own cemeteries on the nearby hillsides, just a
    stone''s throw from their homes. The bottom courses of the eastern hill were the
    site of burials of babies and children, with adults'' graves'
  merge: -1
  pgno: 22
- img_proc: true
  md: '# Social and Economic Concerns


    higher up—many of these from the Eighteenth Dynasty, judging from finds such as
    scarabs bearing the name of Queen Hatshepsut in the larger cemetery, with its
    pyramidion-topped tomb chapels with solar stelae, some pre-Amarna inhabitants
    were buried, but this is primarily Rameside century. At the end of the Rameside
    period the workmen and their families were transferred for their own safety from
    the village of Deir el Medina to within the mighty walls of the mortuary temple
    of Rams III at nearby Medinet Habu.


    It is interesting to note that these particular workmen apparently did not toil
    in the other nearby tombs of officials and priests; at least there is no evidence
    to indicate that any of them did. Were they responsible for the construction of
    the huge mortuary temples of the kings—work of quite a different type involving
    the quarrying and transport of sandstone and the making of mud bricks. Although
    one might expect that the relief carving and painting of both tomb and temple
    walls would have been done by a special class of artists, this was not the case
    with the tomb workers, survive, they probably lived closer to the cultivation
    or at the temple sites in temporary quarters as those known from earlier times.


    The royal necropolis quite logically had guard posts for protection of the royal
    burials. A similar post at the village itself led some modern scholars to posit
    a very restrictive environment akin to confinement for the workmen, the matter
    of the villagers'' freedom of movement is taken up from below by Andrea McDowell.
    The question of the ethnic backgrounds of many workmen with foreign-sounding names
    is considered in detail by William A. Ward, whose study of possible foreign connections
    has provided a new dimension to the community. But first, the village social setting,
    familial relationships, and some legal contractual and financial matters are examined
    by Barbara S. Lesko.


