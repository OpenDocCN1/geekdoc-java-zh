    Administrators of the Tomb


    The most powerful civil official in New Kingdom Egypt was the king''s vizier,
    who functioned as overseer of the vast civil service and as chief justice of the
    land. To this trusted official was also given the responsibility of producing
    the royal tomb. Thus, when the tomb workers sent gift of two silver chisels to
    their vizier in the reign of Ramses V, were expressing their gratitude and loyalty
    to the official upon whom they were most dependent. It was undoubtedly the high
    importance of their responsibility and the "classified" nature of their labor
    that placed the tomb workers under the direct control of the supreme civil administration.
    On behalf of the pharaoh the vizier ordered and inspected the project and officially
    received the completed tomb from the necropolis community. The delivery of these
    and other supplies was one of the concerns of his office in Thebes. Although there
    were generally two viziers in the Nineteenth and Twentieth Dynasties, the one
    for Upper Egypt is believed not to lived in the south; there are records that
    a vizier personally inspected the royal tomb''s progress and visited the workers
    village. Knowing that they were working directly for their pharaoh and answering
    only to the highest officials in the land must have given the workers on the royal
    tomb a sense of great prestige and respect in the eyes of their fellow citizens.


    In theory, all the artisans of the tomb, and definitely their foremen and scribes,
    were directly appointed by the vizier. Certainly, when the workers had a serious
    problem, perhaps a complaint against a foreman, they felt they could appeal to
    the vizier for aid. Normally, however, the foreman was their leader, representing
    their interests to the authorities and hearing their complaints. At the time of
    high tensions, the artisans did not receive their wages, one foreman of the time
    sided with his man against the administration—the tomb''s scribe, resorted to
    threats to get the strikers back on the job.¹¹⁰


    The two foreman (for each of the two crews, called "Right" and "Left") that worked
    both sides of the royal tomb at once were supposed to oversee the work on a daily
    basis. Together with at least one scribe, they were regarded as the administrators
    (rwdw) or chiefs (ryw) of the tomb workers. This triumvirate was responsible for
    maintaining order in'
