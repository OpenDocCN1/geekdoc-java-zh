    Egypt had not organized themselves into guilds, which might have provided solidarity
    with social and economic safeguards; rather, all the men on the work force belonged
    to the pharaoh and were essentially powerless before the state.


    The great pyramids and towering temples of the land were not built without a significant
    cost in human life and limb. Egypt bent its back for the greater glory of its
    rulers, and an ordinary man called up for work gang or military duty had little
    recourse unless he was wealthy enough or knew someone influential enough to buy
    off the bailiffs of the state. The tomb workers may have been well provided by
    the state (because to use a modern metaphor) their masters knew a machine worked
    best when it was well oiled. Security considerations would also have played a
    part: no pharaoh could risk his tomb and treasure with an impoverished and desperate
    population living close by, privy to the knowledge of plans and location. But
    job security, civil liberties, self-determination are modern concepts and were
    not within the grasp of pharaoh’s workers.'
