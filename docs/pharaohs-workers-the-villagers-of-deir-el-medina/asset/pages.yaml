    posit that a villager might worship Ptah at home or in nearby votive chapels,
    or she might similarly make an offering to a bust in any and all such locations.
    Whether praying to gods (Hathor or Ptah), kings (Amenhotep I), or ancestral chiefs
    had become ḫ in the afterlife, the ordinary person wanted to connect with and
    gain the protection of those outside the boundaries of moral existence. That connection,
    believed to be effected through offerings and supplications, could apparently
    be made equally effectively in multiple settings.


    # Summary


    The box bed structures, the ḫ ikr n R'' stelae, and the anthropoid busts all reflect
    the villagers'' desires to obtain personal protection and aid in areas ranging
    from mother and infant care to a myriad of other daily life concerns. The bed
    structure apparently alludes to the fertility of the family through its future
    offspring; the stelae and the busts, to the family''s relations with and dependence
    on the recent decad, these objects illustrating, as others have noted, the settlers''
    desire to preserve ties among present, past, and future generations.77 The bed
    area within the home could provide seclusion for a mother and babe under protection
    of household deities and may also have a place of worship, while cult objects
    in the home and elsewhere allowed one to appeal to recently deceased relatives.
    Both the stelae and busts appear to have been means by which the households of
    Deir el Medina—and possibly of Egypt as a whole—hoped to attain some measure of
    security in an otherwise uncertain world.


