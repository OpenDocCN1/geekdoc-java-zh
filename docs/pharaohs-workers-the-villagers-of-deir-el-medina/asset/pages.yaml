  md: '# Introduction


    Enough of the ancient Egyptian workers'' output still survives to astound all
    who visit the Nile Valley. The masses of huge blocks moved to-construct the pyramids,
    the soaring granite obelisks, the mighty figures carved from cliff faces, the
    elaborate decoration of wall surfaces in the chambers and corridors of tombs that
    penetrate deep underground—all these lead us to ask, who were the people who carried
    out such works and did so with what we would call primitive tools? Are they not
    even more interesting than the kings who ruled them; are they not more impressive
    for the challenges they accepted and overcame? The ancient Egyptian workmen—whether
    they built vast temples or manufactured intricate gold chains, cut and finished
    straight walls in the cramped interior of a stone sarcophagus or gave hard stone
    vessels the thinnest of walls—inspire both awe and admiration.


    But who were these people? How did they live and what did they believe? Were they
    rewarded for their skilled work, or were they exploited? Were they anonymous,
    or were they acclaimed during their lives? In order to answer questions we need
    contemporary written texts, preferably texts written by and for the ancient workers
    themselves. Only such documentation can reveal their economic, legal, and social
    activities and bring the working-class community into focus. So far, in very few
    archaeological sites have any such documents found. But fortunately, one has yielded
    a substantial, well-preserved archive. This is


    [1]'
  merge: -1
  pgno: 11
- img_proc: true
  md: '# Introduction


    the village of Deir el Medina, the settlement for the workers who hewed and decorated
    the tombs of the pharaohs of Egypt''s brilliant Age of Empire, the New Kingdom.


    Consequently, Deir el Medina is among the most thoroughly documented and best-known
    communities from the ancient world. In this village—located west of modern Luxor
    on the left (west) bank of the Nile half a mile beyond the cultivated land bordering
    the river, and between the Valley of the Kings and the Valley of the Queens—lived
    a number of the civil servants, stoncutters, and craftsmen/artists who prepared
    the tombs of their kings and queens. The village occupied the southern part of
    the Theban necropolis in a valley beyond Garnet Murai hill, where a small temple
    was built during the Eighteenth Dynasty and the much larger structure of Ramses
    III during the Twentieth. The workmen would have used this opening to go around
    to the southwest when their work lay in the Valley of the Queens. The northern
    opening of the valley provided the Deir el Medina inhabitants their direct access
    to the cultivation, eastward toward Garnet Murai hill and down to the area where
    the temple called the Ramesseum was built by Ramses II in the Nineteenth Dynasty.
    Or, heading straight north, they could follow the base of the high, steep cliffs
    to Deir el Bahri with its Eleventh and Eighteenth Dynasty temples, notably that
    of Queen Hatshepsut. The major path from the village, however, proceeded north
    from its western foothills along the top of those same cliffs that surround Deir
    el Bahri to a spot where the workmen made another small settlement for themselves
    before the path descended to their most important work area—the Valley of the
    Kings.


    The walled village, conforming in general shape to the narrow valley in which
    it was situated, could not have a pleasant environment. The barren hills that
    surround it reflect the heat of the desert sun on it, and the hill of Garnet Murai
    effectively cuts off some of the prevailing north breeze and much of the verdant
    river valley below. The site had no trees, and all water had to be carried in
    at least half a mile away. Nevertheless, these workmen and their families left
    a record of village life at Deir el Medina that spans almost four hundred years
    and parallels much of the history of the Egyptian New Kingdom or Empire. The surviving
    records shed little light on the major events of the time, however. Rather, they
    inform us about everyday life in ancient Egypt: the


