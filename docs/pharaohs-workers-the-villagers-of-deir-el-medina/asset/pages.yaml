  md: '# Contributors


    Joris F. Borghouts is Professor of Egyptology and Chairman of the Department of
    Egyptology at the University of Leiden in the Netherlands. He received his Ph.D.
    from that university in 1971 and has written extensively on Egyptian magic and
    religion as well as on Egyptian language and literature. He has recently published
    a grammar of the Middle Egyptian or classical phase of the ancient language.


    Florence D. Friedman is Curator of Ancient Art at the Museum of Art, Rhode Island
    School of Design in Providence, where she both teaches and organizes exhibitions.
    She received her Ph.D. in Egyptology from Brandeis University and has written
    on ancient Egyptian religious concepts as well as art historical topics.


    Barbara S. Lesko is the Administrative Research Assistant in the Department of
    Egyptology at Brown University and an Instructor in the Brown Learning Community,
    having received her M.A. in Egyptology from the University of Chicago in 1965.
    She has collaborated with her husband, Leonard H. Lesko, for many years to produce
    the five-volume Dictionary of Late Egyptian, but has specialized in social history,
    with an emphasis on the women of ancient Egypt.'
  merge: -1
  pgno: 201
- img_proc: true
  md: '# Contributors


    Leonard H. Lesko has been Charles Edwin Wilbur Professor of Egyptology and Chairman
    of the Department of Egyptology at Brown University since 1982. He received his
    Ph.D in Egyptology from the University of Chicago in 1969 when teaching for the
    University of California. His interests span religious and literary texts, ancient
    oenology, and lexicography have resulted in a number of publications including
    the Dictionary of Late Egyptian (editor) and Religion in Ancient Egypt (co-author).


    Andrea G. McDowell received her Ph.D in Ancient History from the University of
    Pennsylvania in 1987, and her dissertation was later published as Jurisdiction
    in the Workman''s Community of Deir el Medinah. After teaching at the University
    of Leiden and receiving a Research Fellowship at Somerville College, Oxford, she
    is currently an Assistant Professor of Egyptology in the Department of Near Eastern
    Studies at the Johns Hopkins University.


    William A. Ward, for many years Professor of Ancient Near Eastern History and
    Languages at the American University of Beirut, is currently Visiting Professor
    of Egyptology at Brown University and Director of Brown''s Ancient Studies Program.
    He received his Ph.D. from Brandeis University in 1958 and has produced many books
    including studies of scarabs, Egyptian administrative titles, and intercultural
    relations in the ancient Eastern Mediterranean world.


