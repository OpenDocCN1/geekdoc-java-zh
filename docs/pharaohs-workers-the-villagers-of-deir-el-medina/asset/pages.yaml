    from repetition, not the phrases of familiar utterance which the ancestors spoke.”
    This statement is significant because it indicates that much had already been
    written in this vein and also shows that Khakhepere’-seneb may have been more
    interested in the form than the substance of his complaints. Khakhepere’-seneb
    wanted to avoid plagiarism in his own work; specifically, he did not want to be
    accused of presenting “a tale of telling after the fact: they did it long ago.
    Not a tale whose telling they anticipate. This is seeking misfortune. It is falsehood.
    There is no one who shall remember a come''s name to others.³36 In this passage
    Khakhepere’-seneb was describing the major works of two of his predecessors of
    the Twelfth Dynasty. In spite of the fact that their tales were potentially false,
    the names of Neferti and Khety were remembered by others hundreds of years—partly
    because they were included in the list in P. Chester Beatty IV—and their fame
    and works survive to the present. Because Khakhepere’s name derived from


    [139]'
  merge: -1
  pgno: 149
- img_proc: true
  md: '# Spiritual and Intellectual Matters


    of Senusret II, he can safely be placed later in the dynasty by Senusret I''s
    propagandists, and he may actually have been lamenting a contemporary turn of
    events rather than merely writing the formulaic type of text popular by the disruptions
    of the First Intermediate Period. That event could indeed have been the suppression
    of the nomarchs'' power by Senusret III.³ The situation would have had more urgency
    then, and the complaint could also reflect some criticism of this royal move by
    someone outside the royal court: that is, a priest. Khakhephere-seneb''s criticism
    of the earlier court scribes Neferti and Khety had political as well as literary
    motives.


    Neferti obviously had been used by Amenemhet I or his son Senusret I to write
    a piece justifying the Twelfth Dynasty.³⁸ Amenemhet appears in Neferti''s work
    as Ameny, the savior from the south, but since Amenemhet''s assassination was
    the spur to so many other pieces ordered by Senusret I, Neferti''s prophecy could
    also have been forged as one more link in the chain of texts to justify and glorify
    the usurpers. At any rate, the work is an ex post fact set in the Old Kingdom
    of Senefuru which purports to foretell the horrors of the First Intermediate Period
    and the coming of Ameny. It omits any mention of Amenemhet II, who actually succeeded
    Mentuhotep II, who served vizier before he took the throne for himself. Clearly,
    Neferti''s work was flawed by falsehood, and Khakphereneb was incensed by it.
    His anger could have been a priestly response to a political fiction, but obviously
    thought that such fictions were serious, perhaps because he saw that they were
    believed. It is not the same as if he had criticized the author of the Shipwrecked
    Sailor for telling lies.³ He saw the harm in misrepresenting history, and this
    in itself is a significant first, or at least the earliest documented case. It
    is unfortunate that he had not expressed himself more clearly, but under the circumstances
    we are fortunate that he was able to write anything and that he wrote survived.


    Papyrus Chester Beatty IV refers to Khety as the “foremost” of the writers listed
    and also mentions that he was the real author of the Instruction of Amenemhet
    I.⁴⁰ Since that text clearly alludes to the assassination of that king, it is
    another misrepresentation on several counts and was recognized as such in antiquity.
    Senusret I, who promoted the ghostwritten work, was the beneficiary of the text
    as well as the beneficiary of


    [140]'
  merge: -1
  pgno: 150
- img_proc: true
  md: '# Literature, Literacy, and Literati


    the death of his father. The piece alleges (as does the separate but contemporaneous
    story of Simuche) that he was far away at the time of the assassination, asserts
    that he was to have the throne “handed over” to him anyway, and prophecies for
    him a very successful reign.


    Assuming that this “famous” Khety is the same scribe Dua-Khety wrote the Satire
    on the Trades, he has a second work of a very different kind that can be used
    in assessing his merit.41 The satire—apparently the most popular work at Deir
    el Medina42—is not very subtle but does a teacher’s concern for his students and
    the entertaining tricks he would use to keep them at their studies. The scribe’s
    lot is depicted as far better than that of in any other occupation that Khety
    considers, and he wants to emulate him. The idea is quite clever, so if he had
    invented it or ever perfected it, he would deserve credit. But the work itself
    refers to the Book of Kemet, which probably did much the same kind of thing and
    was much earlier work known to Khety.


    Khety’s Instruction of Amenemhet I had a precursor with which he was probably
    familiar, the Instruction for King Mericare.43 This posthumous work from the end
    of the Tenth Dynasty, if authentic, explains a negative turn of events in moral
    terms and is a pietistic document. Khety wrote in more practical terms and provided
    a variety of excuses for the king’s assassination, none of which had anything
    to do with divine retribution. Even without this difference of attitude, Khety’s
    king and the royal office come as weak and very human—not the picture his patron
    would ideally have wanted—aside from the few pointed references employed for the
    expculation of Senuret, the question still remains whether the texts that survived
    are really Khety’s best. Lacking any other evidence, it is impossible to say,
    but these two alone should hardly merited him such high acclaim.


    Hans Goedicke suggested that Khety could have himself written Mericare,” and the
    scribe’s name could indeed reflect a Heliopolitan connection.44 If he wrote both
    instructions, we could readily accept his greatness, the more so since he would
    have succeeded in placing the Heracopolitans in a better light than the Thebans
    he ostensibly continued to serve. Aside from the style, tone, and date arguments
    that I raised against Goedicke’s suggestion earlier,45 the Mericare text could
    have been written well after the fact by an unbiased historian, but I still find
    it hard to believe that the person who wrote it could'
  merge: -1
  pgno: 151
- img_proc: true
  md: '# Spiritual and Intellectual Matters


    also have produced, even for hire, such an inferior imitation. Interestingly,
    though the Instruction of Amenemhet I was the most popular literary work found
    among the ostraca at Deir el Medina, and there was also a copy in the papyrus
    of Ken-her-khephes.⁶


    Finally, Ptahjemhedhuty, although his name is not directly connected with any
    known Middle Kingdom work, has been suggested as the likely author of the Loyalist
    Instruction known from a late Middle Kingdom steela and later copies, many from
    Deir el Medina.⁴⁷ This is a hymn of praise for the king and an exhortation to
    share in the adoration of him which seems excessive on both counts: “Adore the
    King . . . in the innermost part of your bodies. Be friendly with His Majesty
    in your hearts. He is Perception, which is in hearts, and his eyes search out
    every body. He is Re (the sun god) by whose rays one sees; he is one who illuminates
    the Two Lands over the sun disk.⁴⁸


    Three of these renowned Middle Kingdom authors, then apparently blatantly have
    written other works, but the fact that these “books of instruction” survived in
    numerous copies at Deir el Medina, where the authors were also found inside the
    Chester Beatty papyrus, would seem to demonstrate that these are the works for
    which they were remembered. All may have been employed in the court schools, perhaps
    at different times during the Twelfth Dynasty—schools as Dua-Khety described when
    he took his son to “the Residence to place him in the school of writings among
    the magistrates, the most eminent men of the Residence.”⁴⁹ The fourth author,
    Khakheperre’-seneb, who condemned the lack of originality, the plagiarism, and
    the false prophecies the other three authors were guilty of, can at least credited
    as one of the world’s first literary critics. Since he has been identified as
    a priest, and his brief work does not show the same clear inclination to propagate
    for the crown, he could have come from a different background, perhaps from a
    temple school. After saying how difficult it was to find anything to say and pointing
    out what sorts things were to be avoided, however, not have very much of his own
    to offer.


    Since all four of these scribes were textbook authors whose works were used in
    the scribal schools, their reputations would probably have been enhanced considerably
    by having their names sandwiched between those of the most famous writers of the
    Old Kingdom. I suggested


    [142]'
  merge: -1
  pgno: 152
- img_proc: true
  md: '# Literature, Literacy, and Literati


    earlier that this may have been done intentionally by a later teacher in the scribal
    system.50 It would certainly be interesting to know more about the scribe who
    authored the text on verse of Papyrus Chester Beatty IV. He was obviously familiar
    with the works used in the schools. He also advocated writing above all else,
    sounding obviously like a teacher himself. Gardiner said that he “was a scribe
    of great experience,” and Pestman has suggested that Amen-nakhthe, the son of
    Naunakhthe, may have been the scribe who wrote these exercises.51 Whoever was,
    he does not seem to display either a religious or political bias of his own, and
    he may not even aware of the flaws that we see in the works of his predecessors.


    The four Middle Kingdom scribes who taught in the schools probably possessed elaborately
    decorated tombs of their own at least none survived. Their fame, however, did
    survive for hundreds of years—even among the Egyptians in a comparatively new
    village such as Deir Medina—most probably because their texts had been repeatedly
    copied by succeeding generations of teachers and students. Even their original
    purposes might have been forgotten, the works magnified the fame of the Twelfth
    dynasty kings to such an extent that the name Senusret (Sesostris) was ranked
    among the greatest pharaohs of Egypt to the time of Herodotus and Diodorus Siculus.52


    The list in Papyrus Chester Beatty obviously omits some Middle Kingdom fiction
    writing and a few psychological and inspirational works that have also survived.53
    It makes no mention of any New Kingdom works written in Late Egyptian, passing
    over even the two exceptionally works of Amenemopet and Ani.54 Since the text
    with the list is itself essentially a Middle Egyptian piece with many Late Egyptian
    corruptions, it may have been an earlier composition badly preserved in the Ramesseide
    copy.55 The original could have been closer in time to the Middle Kingdom authors
    mentioned; which would at least explain its omissions, its flawed nature, and
    the exaggerated assessment of authors who clearly were not among the best of ancient
    Egypt. The more sensitive Instruction (or Maxims) of Ani, found at Deir el Medina
    among the rolls that belonged to Ken-her-khepsf''s library, praises mothers, defends
    the independence of wives, extols the virtues of marital fidelity, advocates the
    planting of flower gardens, and recommends praying with loving heart in words
    that are hidden.'
  merge: -1
  pgno: 153
- img_proc: true
  md: '# Spiritual and Intellectual Matters


    Perhaps the most distinguished and exciting texts of the Chester Beatty papyri
    are those in an anthology of romantic lyric poems which, together with poetic
    texts from elsewhere in Egypt, have been shown to possess many themes in common
    with the lyric poetry of later Eastern cultures and include examples of courtly
    love poetry as well as the more down-to-earth songs of women.^56 Seventy percent
    of these songs are presented as coming from the mouths of women, but unfortunately,
    we have not yet identified any of the original authors.


    As the copyist of Chester Beatty IV was probably himself a scribe, teacher, or
    advanced student, it is clear that though his colloquial language was Late Egyptian,
    he understood enough Middle Egyptian to make his substitutions, however careless,
    in the right places without being terribly bothered by them. Obviously, the schools
    were urging continued use of the classics in the very different older language.
    Keeping Middle Egyptian alive would have been useful for anyone involved, as these
    workmen were, with copying monumental inscriptions and archaizing religious texts.^57
    The old literary texts being copied for writing practice would logically have
    been used also to help scribes learn the old language in preparation for these
    practical tasks. But perhaps they were also kept alive for their own sake, as
    historical anachronisms, even if they were not as good as some of the then current
    literature.


