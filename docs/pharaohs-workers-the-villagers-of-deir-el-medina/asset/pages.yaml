    # Cultic Household Items


    Just as concern for one’s offspring is universal, so are individuals’ expressions
    of need for help in daily living. Cultic items in the De Medina household reveal
    that the villagers looked not only to standard deities of the royal and elite
    class—such as Hathor and Ptah—for succor also to intermediaries in the form of
    divined royal and private ancestors. Amenhotep I and his mother, Queen Ahmose
    Nefertari, of the Eighteenth Dynasty were understood as divined patrons of the
    village. The villagers’ close relationship to and dependency on this pair is illustrated,
    among other ways, by false-door dedications to they found in the second room of
    most houses.44 As Černý has outlined, Amenhotep, for example, appears on funerary
    stelae, lintels, offering tables, and even some wall paintings. The numerous sanctuaries
    in the village and other votive chapels throughout the Theban area testify to
    their profound popularity, surpassing even that of the Theban god Amon.45


    The villagers also displayed their belief in a more personal cult through particular
    forms of stelae and ancestral busts, by means of which they hoped to invoke the
    aid of the decent dead. Indeed, the stelae and busts were objects for offerings
    and worship not only in the home but in many other village locations as well.


