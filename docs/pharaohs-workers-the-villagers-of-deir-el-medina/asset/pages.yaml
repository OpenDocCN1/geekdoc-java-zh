    those foreigners themselves or their recent ancestors were foreign. The practice
    at Deir el Medina seems to have been that resident foreigners gave Egyptian names
    to their children, foreign names often reappeared among the grandchildren as a
    kind reminder of the family''s origins.


    Recognizing foreign names, however, is not always a simple matter. No single method
    of doing so is totally reliable in itself, but several characteristics—preferably
    in combination—are useful.


    First, a name may have a consonantal structure that is obviously non-Egyptian
    and for which a readily apparent foreign cognate can be produced. For example,
    the names *Irtnn* and *Mrky* can be immediately recognized as Hittite *Aritenna*
    and Semitic *Milkuya*. Many names that seem at first glance are, actually quite
    good Egyptian names: *mk*, thought to represent Hurrian Ammaku, turns out to be
    Egyptian¹-mk.t, meaning something like “great of protection.”⁸


    Second is the use of the “throwstick” hieroglyph as a determinative. Because scribe
    practice restricted its use to the names of foreign persons and places, its appearance
    is an indicator that the name in question is not Egyptian. The problem is that
    its absence does not mean the reverse. The throwstick sign is frequently omitted
    in the spelling of demonstrably foreign names; about half the known foreign names
    in Egyptian texts were spelled without it, because of the spelling habits of individual
    scribes.


    Third, when an individual is specifically identified as a foreigner, his name
    can be reasonably assumed to be foreign. Such are the “Nubian stonemason Trky”
    who played his trade at Deir el Bahri and the “ Canaanite Basiya” who worked at
    Deir el Medina. Yet these appellations can never be taken literally, such terms
    as the Canaanite, the Nubian, Libyan were often used as names by people who were
    not of immediate foreign origin. The difference is whether such terms are labels
    (“The Canaanite X”) or personal names (“The Caanite”). The former can be taken
    as a foreign name; the latter often cannot.¹⁰


    Fourth, there is the use of “group-writing,” a method of spelling whereby meaningless
    we consonants¹, y, w—are inserted into the consonantal structure of a name or
    word where they do not belong. These insertions have traditionally been thought
    to represent vowels, and the general belief is that this extended orthography
    developed to spell mainly foreign words and names; therefore, its use in spelling'
  merge: -1
  pgno: 73
- img_proc: true
