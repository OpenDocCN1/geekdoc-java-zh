    practice of magic (*hekau*) in everyday life. Expected dangers like attacks by
    scorpions and snakes are documented in many spells. To cure ailments inflicted
    by such animals and demonic diseases the magician often set up a mythical narrative
    in which the origin of the illness is investigated by the sufferer finally as
    the victor. Thus knowledge of the origin of snake poison, the theme of a long
    mythical spell with the gods Re and Isis as the chief personages, averted the
    danger of dying of a bite or sting.


    Roaming dead persons are another class of troublemakers; but surprisingly little
    testimony has come to light of villagers practicing magic against each other.
    For social conflicts the local oracle or the court of justice offered sufficient
    opportunity to straighten things out. On the other hand, spells and rituals make
    mention of a kind of stereotyped inimical person called "the hot one" (*shemu*),
    perhaps the equivalent of a village witch.


