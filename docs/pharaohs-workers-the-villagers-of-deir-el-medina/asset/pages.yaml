    # Social Status of Foreigners at Deir el Medina


    I have so far identified the Deir el Medina texts twenty-masculine and ten feminine
    names of West Asiatic origin: for example, Semitic Bariya and Delilah, Hurrian
    Tulpiya and Zilli. Of these thirty-two names, nineteen are of Semitic origin,
    five are Hurrian, six are either Semitic or Hurrian/Hittite, and two are the ethnic
    appellative “the Cypriot,” which may indicate these two women’s origin, though
    it could be easily defined as Canaanite. With one or two exceptions, these are
    all of people who lived in the village. I think it is safe to assume that all
    these people or their recent ancestors came from Canaan; the linguistic mix of
    West Asians at Deir el Medina certainly reflects that of Canaan. The contemporary
    archives of Ugarit on the coast prove that the population of Canaan was made chiefly
    of Semitic and Hurrian speakers, with Hittites and other groups constituting minorities.¹21
    Archaeological evidence also indicates the presence of Aegeanans at Ugarit, though
    to the best of my knowledge no attempt has been made to identify Aegean names
    in the considerable archives of the city. The other main textual sources of the
    period–the Amarna Letters, the archives of Alalakh (again on the Syrian coast),
    and the Old Testament–also reflect the population mix would represent the Canaanites
    who came to Deir el Medina² It is therefore logical that the Canaanites represent
    the various linguistic groups that made up the population of their homeland.


    What was the personal situation of those of foreign extraction who lived at Deir
    el Medina? Within the community, the Canaanites all belonged to the lower functional
    levels of village society.³ Nine of the women were housewives, and while their
    husbands could be determined, married to ordinary workmen. The tenth woman was
    attached to a work gang as a servant.⁴ Of the twenty-two men, one was a necropolis
    guard, two were gardeners, and others were all ordinary workmen. So far, no Canaanites
    have shown up in the ranks of Foremen, Scribes, or other professionals who formed
    the upper levels of the Deir el Medina social structure with the single exception
    of the Chapel Scribe Zabû (see Appendix A, no. 3), whose office places him in
    the lower temple reaccuracy. If I am confident in assuming that this individual
    was attached to the small local chapels just outside the village, then we can
    consider him resident there, though he may well have come from elsewhere; in any
    event, his function derived from the village, no matter what


