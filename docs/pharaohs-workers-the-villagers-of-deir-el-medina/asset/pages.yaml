    # Income among the Tomb Workers


    The military influence on New Kingdom society may be seen at Deir Medina, where
    Horemhab was. Within the tomb, the artisans were organized into two “crews” (the
    word used was the same applied in naval contexts: *isw t*), and originally this
    was also true for the housing arrangements in the village. It is interesting to
    note, as Kadry did, that the pay rations for the tomb workers, though adequate,
    were not lavish as for the troops, who received meat; the tomb workers generally
    received only fish with their grain and vegetables. As the offerings to the gods
    would have included meat, it can be inferred that plainly families enjoyed a higher
    standard of living and were among the classes Kadry called “rich,” compared with
    the tomb workers.¹³ Jac. J. Janssen, on the other hand, considered the workers
    collectively “well off.”¹⁴


    It would seem logical to examine purchasing power as a guide to wealth rather
    than diet. Certainly within the workmen’s village there were varying incomes,
    even officially. The two foreman, who had the most direct responsibilities for
    the completion of the royal tomb, each received 7¹½ *khar* of emmer wheat and
    2 of barley (for beer) as his basic monthly pay, a *khar* equal to 76.8 liters.
    In addition, commodities such as oil and vegetables were delivered to him and
    all the workers of the village. The foreman deputy, as was a man of the crew (and
    often the son of the foreman), earned the same as his mates: 5¹½ *khar* (4 of
    wheat, 1¹½ of barley). This monthly stipend in grains has calculated as much adequate
    for a family of ten.¹⁵ Thus a family must have surplus grain that could be used
    like cash to procure other products in this barter economy.


    A scribe’s wage has been the subject of some dispute. Apparently he was paid only
    22½ *khar* of wheat and 1 *khar* of barley; if it is correct, it would be an example
    of skilled “blue-collar” workers earning better


