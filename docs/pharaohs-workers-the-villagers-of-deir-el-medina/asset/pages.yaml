    personal name has long been considered a sure sign that the name is foreign. But
    this is simply not true; group-writing is very common in the spelling of countless
    native Egyptian words, and especially in the New Kingdom, of countless Egyptian
    personal names.11 Conversely, many obvious foreign names and words are regularly
    spelled in the normal Egyptian consonantal manner, such as the divine names Ba’al,
    ‘Anat, and Astarte. It is the use of this orthography in the Deir el Medina texts
    that has led to the incorrect identification of some Egyptian persons as Nubian
    or Libyan.12


    And fifth, there are frequent cases where a single individual has two names: one
    is inevitably a good Egyptian; the other can be either his original foreign name
    or an Egyptian nickname by which he was presumably known to his family and friends.
    These may be applied to him—say, in different parts of his tomb chapel—or together
    in the formula “X who called Y.” The difficulty is that Egyptian scribes used
    this formula reversibly in the New Kingdom. They might give the Egyptian name:
    *kbr* (foreign) who is called R’mss-nht,13 *Ipuwy* (nickname) who is called ‘Imn-m-ip.t.14
    Or they might start with the full Egyptian name, followed by the foreign name
    or Egyptian nickname: *Ib3-nfr*Imn who is called P3br (foreign);15 *Imn-htp* who
    is called Hy (nickname).16 On the occasion occasion the same person may be referred
    to both ways: “Benya who is called Paheqamen” and “Paheqamen who is called Benya.”17
    The problem, then, is to determine whether the alternative to the full Egyptian
    name is an Egyptian nickname or a foreign name—no easy task, especially since
    the two may be spelled in exactly the same way.


    Despite the inconsistencies, the more of the foregoing five criteria the certain
    we can be of its Egyptian origin. Unfortunately, in many cases even minimal precision
    is impossible, and the decisions are particularly troublesome. John Chadwick observes
    that in choosing Greek cognates for personal names found in Mycenaean Greek B
    texts, “the degree of probability [that a given choice is correct] increases with
    the length of the word [and] shorter words often admit of several identifications.”18
    This statement applies equally to foreign names in Egyptian texts. One can easily
    see in Egyptian the Amarna Letters, the correspondence between foreign rulers
    and the Egyptian court in the later fourteenth'
  merge: -1
