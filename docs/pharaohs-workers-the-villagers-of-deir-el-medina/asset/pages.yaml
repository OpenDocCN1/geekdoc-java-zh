  md: '# THREE


    # Foreigners Living in the Village


    William A. Ward


    The lands of Khor and Kush

    and the land of Egypt

    You have set every man in his place.

    —Hymn to the Aton


    It has been recognized since the early years of Egyptology that by New Kingdom
    times the population of Egypt was liberally sprinkled with families of foreign
    origin. This phenomenon, however, appeared long before the New Kingdom. During
    the Middle Kingdom, for we know that weavers, dancers, and other professionals
    from abroad were living in Egypt, and Canaanite merchants founded settlements
    at Tel ed Dab’a and related sites in the eastern Delta.¹


    Foreigners came to Egypt primarily for economic reasons, to find work in their
    various professions or glean the profits of international trade. By New Kingdom
    times they were a prominent part of the population, and their presence was further
    encouraged throughout the centuries of Egyptian control over Nubia and Canaan.
    Some foreigners may have been forcibly brought to Egypt as prisoners of war, but
    certainly not in the large numbers that the popular view suggests; nor did the
    majority come as slaves (slavery has been vastly overrated as a component in Egyptian
    society, basically owing to a misunderstanding of Egyptian terminology).²Rather,
    during the centuries that Deir el Medina flourished, there was in the whole ancient
    world a mobile middle class, people who did not work the land or serve in a local
    administration and were not tied to a particular place. Weavers, stonemasons,
    soldiers and sailors, merchants, artists, musicians and dancers, priests—all these
    moved freely to wherever they could exercise their skills.


    [61]'
  merge: -1
  pgno: 71
- img_proc: true
  md: '# Social and Economic Concerns


    strangers in every town and city from Mycenae to Persia, free agents, moving where
    they wished and when they wished. Many of them came to the Nile Valley.


    A survey of the full extent of foreigners living in New Kingdom Egypt gives the
    distinct impression that they were largely free people who had come to Egypt of
    their own volition to find employment and a more stable life than they had at
    home. They were already part of the construction industry in the Eighteenth Dynasty,
    and thereafter we find more and more foreigners in positions of (often considerable)
    authority. From gardeners and ship captains to army officers and royal servants,
    foreigners established themselves at all levels of Egyptian life.³ It is not surprising,
    therefore, that some inhabitants of Deir el Medina were either recent immigrants
    or the descendants of families of foreign extraction. Though their presence has
    long been recognized by the excavators of the site, statements to this have been
    limited to lists of personal names believed (often incorrectly) to be non-Egyptian.⁴
    And this is the heart of the problem—how to recognize foreign residents by their
    personal names when there is little more than personal names to go on.


    # Identifying Foreign Personal Names in Egyptian Texts


    There is in the Berlin Museum small, very crude stela from Tell el-Amarna of a
    man called Trr. He is portrayed as a Canaanite with a Canaanite hair style, beard,
    and dress.⁵ His name is the very common Semitic name Dalilu. His wife also has
    a Semitic name, though she is portrayed as an Egyptian. Here, there is no problem:
    a foreign name with an excellent Canaanite cognate identifies a portrait of an
    obviously Canaanite individual. But we rarely have precise information from Deir
    el Medina. As far as I know, none of the villagers with the single exception of
    a subsidiary figure in one tomb chapel who has plumes in his hair following the
    Libyan style (Appendix B, no. 2). It is reported that features of the mummies
    in certain tombs confirm the presence of foreigners, though no details have been
    published.³ Otherwise, the human pictorial and archaeological evidence is silent,
    and we must rely solely on personal names.


    Fortunately, there is every probability that native Egyptians did not give foreign
    names to their children. Therefore, when we find persons with non-Egyptian personal
    names, we can generally be sure that either'
  merge: -1
  pgno: 72
- img_proc: true
