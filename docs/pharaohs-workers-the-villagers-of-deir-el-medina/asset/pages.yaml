    Gods were frequently called upon to intercede in the villagers’ personal problems,
    and an instruction from the Maxims of Ani, which was

    found in the village (see the epigraph above), tells how one should pray

    meaningfully.


    Two aspects of personal piety and the religion of commoners in the

    village of Deir el Medina, relevant to our understanding of ancient Egyptian culture
    in general, are the veneration (worship?) or at least close

    involvement with household deities and ancestors, and the invocation

    use of magic with its roots in mythology. Florence Friedman’s contribution deals
    with the former, and Joris Borghout’s with the latter. My

    own concluding chapter discussed some literary and educational matters

    that link the Deir el Medina workmen with Egyptians who lived hun-dreds of years
    earlier.'
