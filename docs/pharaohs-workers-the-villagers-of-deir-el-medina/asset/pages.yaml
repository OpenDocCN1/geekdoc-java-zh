    # Women and Children of the Village


    Evidence shows that families were large, with many young people in the village—quite
    possibly as many as two hundred during periods of population—it is not surprising
    that a number of them were put to work at local chores. Some of their activities
    are reflected in art and in texts. The illustrated ostraca show girls and boys
    tending oxen, and several depict a boy hunting with a tethered ape. Other boys
    are burning a pot, so various local craftsmen were probably assisted by the young.
    The delivery of food supplies to the artisans at work in the Valley of the Kings
    was assigned to a large team of young men “who were in rotation every day.” Although
    letters indicate that women prepared the food, it was apparently regarded as undesirable
    for women to deliver it to the gangs of workers. The ostraca picture young girls
    engaged in leisure activities as swimming, boating, and bird trapping.³We do not
    know at what age the average girl married, though it was doubtless in her teens.
    Young men were advised to “marry young.”³⁴


    The records of Deir el Medina have provided most of the information we have on
    in the New Kingdom. Wives of scribes, foremen, and workers all shared the same
    life within this isolated community’s confines walls, although the scribes and
    foremen’s families lived in the largest houses. It seems significant however,
    that of the women who used a religious rank with their names, the vast majority
    were married to either scribes or foremen.³⁵ They served in the harem of the great
    god Amon-Re and held the titles sẖmy.t (chantress) and even w�bt.t (lay-priestess)
