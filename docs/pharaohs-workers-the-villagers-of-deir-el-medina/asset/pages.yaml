    Can determine the social stratification of a society in many ways. In the present
    volume, B. S. Lesko suggests, on the basis of economic status, that the social
    strata at De el Medina ranged from the upper middle to the lower strata of say,
    the whole Theban region. The village had neither the very rich nor the poor who
    stood at the upper and lower ends of the economic scale in the Egyptian population
    as a whole. I am thinking about in terms of functional stratification: that is,
    the relative importance of individual’s place in the functions of the village.
    In this, administrators were the most important. The least important—or the most
    easily replaced—were the ordinary workmen and the whole range of ancillary workmen.
    Between these two groups were the artists, physicians, priests, and other specialists
    who took orders from the administrators but exercised a certain degree of personal
    initiative and independence in their work. Thus, in the general economic framework
    of Egypt the village was indeed middle class, we can speak of,, and and lower
    functional classes as well. The Canaanites and their descendants all belonged
    to the lower functional stratum of De el Medina and, as far as the present evidence
    goes, did not rise above that, at least during the first few generations of an
    originally foreign family’s residence in the village.



