    the workplace and village and on the weekend sat at the local tribunal that heard
    complaints. It was the foremen who carried out the decisions of the court. If
    letters needed to be sent to the vizier''s office concerning the work, a foreman
    was often the named correspondent and the recipient of the reply. Even though
    the foremen probably could read, however, it was more likely the official scribe
    of the tomb who penned the letters, as he was specially trained in the niceties
    of official letter writing.


    The number of scribes seems to have varied over the years: times there was only
    one, at others times for each side. In the late Ramesseide period, Jaroslav Černý
    found there were functioning at once. While the foremen'' concerns were with the
    technical work, its progress, and the workers themselves, a scribe''s responsibility
    was for recordkeeping and other administrative paperwork. At the tomb each day,
    sitting apart, he noted who was absent and recorded occurrences of significance:
    deliveries to the work force (such as visits from officials), and the like. He
    created a diary of the tomb, first making notations on stone ostraca and later
    formalizing his notes on papyrus roll. Excerpts from this diary were sent to the
    vizier''s office. More than anyone, the scribe was the true on-site representative
    of government''s interests. But his recording skills were not confined strictly
    to royal tomb concerns. He was on hand in the village, at least on weekends, to
    write up various documents such as oaths, wills, and deeds of sale. It is not
    clear this would have been regarded as part of his proper responsibilities or
