    of the village, Canaanites did not have the same opportunities as the native population.
    This seems to apply to descendants of Canaanites as the original immigrants.


    In the wider population of the whole Theban region, however, both in the government
    and the administration of the great funerary temples, one finds Canaanites in
    responsible positions, such as the Semite Abu, a Scribe of the Vizier (also in
    no. 35) who penned one of the Deir el Medina papyri. This leads to a suggestive
    but very preliminary conclusion: Canaanites could advance to high positions in
    the wider Theban population, but local prejudice—perhaps“custom” is a better word—in
    the village denied them the upward mobility enjoyed by their counterparts in the
    temples and across the river. So the reason may have been no more complicated
    than the more important and better-paying jobs were kept within a few native village
    families.


    At this stage I hesitate to comment on the Libyan component at Deir Medina I can
    point to only three personal names that are Libyan. But one of these, Kher/Kl,
    was common throughout Egypt and was not born by no less than three inhabitants
    of the village (see Appendix A, no. 31, and Appendix B, nos. 1–11). There were
    also at least three individuals named Kr (Appendix A, no. 32), and one Dydy (no.
    34). This gives us seventeen Libyans, but among them we find not only individuals
    in the lower ranks of village society also a Chief Craftsman, a Guardian of the
    Tomb, a scribe, and a priest. Perhaps the Libians who moved to Deir el Medina
    had a somewhat better chance for upward mobility than the Canaanites. With only
    thirty-two Canaanite and seventeen names so identified, such a conclusion is premature.


    Chronologically, it is not possible to fix precise dates for all the Canaanites,
    so we must be content for the present with very general observations. Three date
    to the Eighteenth Dynasty (though the evidence is not completely certain), seven
    to the Nineteenth Dynasty, nine to the Twentieth, ten to the Twenty-first, and
