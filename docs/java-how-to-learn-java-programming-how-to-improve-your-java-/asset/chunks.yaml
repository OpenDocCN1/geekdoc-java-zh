    # 如何学习 Java 编程：如何在 2020/2021 年提升你的 Java 代码水平


    ## 如何学习 Java 编程

    学习编程可能是最近非常流行的新技能。它的需求如此巨大，以至于高中都将编程加入了课程中。编程（Programming）和编码（Coding）经常通用使用，但两者是不同的，你将在在这里对它们进行分析。随着每一项任务的数字化，并随着
    AI 技术变得智能化和自动化，学习编码已成为时代的必然。


    你所能想象的一切事情通常都是通过应用程序或网站完成的，从叫车、点外卖或在线购物，到看电影、甚至参加课程和玩游戏。随着应用程序的数字化，对开发者和程序员的需求也随之增加，因此学习一种编程语言将是有益的。本文讨论了如何学习你选择的编程语言，从而开启你编程之旅的正确方式。那么，让我们开始吧！


    ### 如何学习编码

    在继续阅读之前，让我提醒你，你选择选择了一条需要耐心和动力的道路，尽管途中充满挑战，绝不能放弃。请阅读并遵循以下步骤来成为一名程序员。


    ### 学习编程基础

    第一也是最的一步骤是确定要学习的语言。建议从 `Python` 开始，因为它像英语一样直观，你可以很容易找到许多最简单的 `Python` 教程并上手。但你应该选择一个你感兴趣、并且支持你未来真正想开发的项目的语言。


    所以，如果你打算开发移动应用，你可能想从 Android 的 `Java` 或 `Kotlin` 以及 iOS 的 `Swift` 开始；如果你想创建一个网站，通常建议先从
    `Javascript` 开始。对于数据科学、AI 和机器学习领域的职业，`Python` 和 `R` 是值得研究的语言。


    你可能通过以下两种方式之一了解这些语言：


    1. **通过交互式网站**：推荐使用 `Codecademy` 和 `Freecodecamp` 等网站进行交互式编码。这些网站的设计理念是考虑到许多初在开始学习编码时会被配置环境所困住。这些网站提供了在线文本编辑器和编译器，让你立即开始编码。

    2. **通过视频教程**：如果你是一个喜欢在步骤指导下进行深度学习的个人，我们建议你参加任何在线编程教程，它们会教你从零开始安装并下载指定的 IDE，学习语言的基本概念，最后通过一个顶石项目来检查你的编码技能。一些教程和课程还提供证书，这在你以后寻找工作时会很有帮助。我们推荐
    `Pluralsight` 和 `Lynda` 来搜索热门语言的初级教程。你还想去 `Hackr.io` 查看一些高评分的教程。


    ### 专注于学习编程基础

    总是建议建立坚实的基础，以便成为一名专业的程序员。彻底学习基础知识，通过创建并解决自己的问题来检查你的实际代码。重点关注以下开始学习的主题，因为它们在大多数语言中都是通用的：


    * `Data Types`（数据类型）

    * `Variables`（变量）

    * `Functions`（函数）

    * `Array` 数组或 `Lists`

    * `If statements`（条件语句）

    * `Conditional loops`（条件循环）

    * `Classes` 和 `objects`（类与对象）

    * `Exception handling`（异常处理）

    * `Trees`（树）、`maps`（映射）等。


    ### 构建你的第一个项目

    构建个人项目是分析和学习你所学知识的最好方法。构建一个你选择的项目将为你提供该语言的详细实践学习经验，因为你会遇到之前学过的概念的实现，并发现如何部署该项目供你和他人使用。此外，当你构建项目时，将它们添加到你的个人资料或
    `GitHub` 账户中，这可以在以后寻找开发工作时为你提供帮助。


    在这个阶段出现的最大问题是：**我应该如何选择项目？** 这是大多数人在决策阶段停滞不前的地方——即该构建什么？答案很简单。


    1. **选择你感兴趣的**：无论是涉及学习还是编码，你首要想做的是你感兴趣的事情。你要喜欢所选的项目领域，这样你才能被它吸引，并保持投入直到完成。如果你选择了一个你不感兴趣的东西，你会发现自己中途放弃了项目，因为你最终可能会对它失去兴趣。所以要选一个能让你投入其中的东西，比如如果你喜欢玩游戏，你可能只想开发一个你自己喜欢的电脑游戏。同样，如果你喜欢摄影，你可能想创建一个展示你作品的作品集网站；如果你对交易感到好奇，你可能会设计一个应用或网站来研究股票图表。在开始创建之前，分析并提供你想要的想法。

    2. **从简单的东西开始**：对自己的能力充满信心是很棒的，但过度自信不是。因此，建议你在深入研究复杂项目之前，先从简单直观的项目开始，以更多地探索语言。例如，如果你选择创建一个电脑游戏，不要直接开始制作像《英雄联盟》那样复杂的电脑游戏，而是从像“井棋”（tic-tac-toe）这样的游戏开始；或者如果你想创建一个网站，不要从构建像
    `Amazon` 或 `Facebook` 那样的开始，而是选择一个简单一点的比如待办事项。

    3. **构建对你自己及社区有用的东西**：要有创新精神，构建对你以及对社区有用的东西。构建社区感兴趣的项目将让你的项目获得一些下载量或观众，通过这种方式，你在寻找工作时会有东西可以展示，并比其他竞争者更有优势。


    ### 一些启动的想法

    如果你对从哪里开始感到困惑，我们提供了一些可以帮助你开始项目构建的想法。你可以从一个像待办列表这样简单的网站开始；如果你想制作一个游戏应用，那么像`俄罗斯陆`、`数独`以及
    `flappy bird` 这样的游戏都是学习编程的好选择。如果你想要一些有挑战性的东西，你可能会考虑构建一个几乎像 `Twitter` 的网站，但功能没有
    `Twitter` 那么多，只需具备推文和关注的基本功能即可。`Hacker` 为你提供了许多从初级到高级的语言项目想法。

