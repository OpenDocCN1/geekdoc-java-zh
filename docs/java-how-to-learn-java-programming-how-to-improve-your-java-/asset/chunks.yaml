  trans: "\n\n# Kotlin\n虽然与 `Java` 和 `Python` 等语言相比，使用 Kotlin 的开发者较少，但 Kotlin 正在迅速普及，尤其是由于\
    \ Google 将命名为 Android 开发的一线语言。Google 非常致力于让 `Kotlin` 成为一种广受欢迎的语言，以至于他们现在提供了一门名为\
    \ `Android Basics in Kotlin` 的网络课程，这是初学者的绝佳起点。此外还有 Google 托管的额外课程，包括 `Kotlin Bootcamp\
    \ for Programmers`、`Android Kotlin Fundamentals`，以及针对那些经验较丰富的人士的 `Advanced Android\
    \ in Kotlin`。虽然大多数 Kotlin 开发者使用该语言创建移动应用，但它也越来越多地用于 Web 后端项目、桌面应用甚至物联网 (IoT) 项目。换句话说，即使你对构建\
    \ Android 应用不感兴趣，它也值得一看。\n\n# Swift\n起初，在 Apple 软件生态系统中活跃的开发者只有 `Objective-C`\
    \ 一种语言可以编程。在三十之后，Apple 内部的一些开发者认为是时候尝试新事物了。2014 年，他们辛勤工作的结晶 `Swift` 问世，并在随后的几年里迅速获得了许多特性（并解决了一些棘手的问题）。最新版本的\
    \ `Swift` 提供了更高的模块稳定性和稳定的二进制接口，提升了该语言的灵活性。如果你对为 iOS、iPadOS、macOS、watchOS 以及 Apple\
    \ 在未来几年可能优先首发的任何设备构建应用（*咳* 增强现实操作系统 *咳*）有兴趣，那么理解它是至关重要的。如果你正在从事任何与移动应用和服务交叉的业务，iOS\
    \ 的知识也非常重要。如果你正在学习 `Swift`，请务必理解函数、循环、集合、数组和字符串，以及结构体（structs）和类（classes）。`Swift\
    \ Playgrounds` 虽然表面上针对儿童，但对所有年龄段的 Swift 初学者都大有裨益。\n\n# JavaScript\n如果你对构建任何与 Web\
    \ 相关的内容（无论是 Web 应用还是网站）感兴趣，那么你必须变得尽可能地精通 `JavaScript`，因为该语言处理了 Web 大部分的底层功能（学习\
    \ `HTML` 和 `CSS` 同样重要，但那是另一个故事了）。想要开始学习 `JavaScript` 的人应该看看时尚的 `JavaScript Tutorial`，该教程将语言的各个方面划分为独立的模块。`Full\
    \ Stack Academy` 也提供了免费课程的细分。一旦你熟练了语言的基础知识，就应该开始探索框架，这可以简化这种偶尔让人繁琐的语言的工作流。\n\n\
    此外，如果你正在学习 `JavaScript`，非常值得花时间尽可能地了解 `TypeScript`，它是 `JavaScript` 的超集，刚刚发布了 `4.0`\
    \ 版本。无论你认为 `TypeScript` 是否是一门独立的编程语言（许多流行的编程语言排名倾向于认为如此），不可否认，`TypeScript` 提供的增强将加速你的\
    \ JavaScript 编程。（对于初学者来说，`TypeScript` 将你编写的任何代码编译为 `JavaScript`。）根据 2020 年 Stack\
    \ Overflow 开发者调查，约 67.1% 的受访开发者表示他们喜欢 `TypeScript`，仅次于 `Python` (66.7%) 和 `Kotlin`\
    \ (62.9%)。这是一个让你尝试它的它的有力动力。\n\n# 初级 Python 课程\n有很多初级 Python 课程可以选择，那么如何知道哪些值得投入呢？在筛选选项时，请搜索以下特征：\n\
    \n## 1. 提供基础知识\nPython 可能是一门复杂的编程语言，在深入更高级的内容之前，你需要一门传达基础知识的课程。这有助于消除困惑。\n\n##\
    \ 2. 补充资源\n包含额外资源的初级 Python 类是理想的。你将评估自己对内容的理解程度，并在整个教学过程中实施所学的技能。寻找带有阅读材料、测验、活动、项目或所有者混合的课程。\n\
    \n## 3. 自学进度\n避免那些设定严格截止日的课程。至关重要的是，要按照自己舒适的节奏学习，并让你能够完全掌握课程中所教授的内容。\n\n## 我们的精选\n\
    我们在 Udemy 上整理了一份最简单的初级 Python 课程清单。我们的精选来自顶级的远程学习提供商，包括 `Coursera`、`edX`、`LinkedIn\
    \ Learning`、`Team TreeHouse` 和 `Udemy`。每个选择都有简介和价格范围，帮助你做出明智决策。\n\n## 初级 Python\
    \ 课程\n无论你是追求需要使用 `Python` 的职业，还是处于入门岗位，这些入门课程都值得考虑。\n\n### 1. Python Programming\
    \ Made Easy: A Concise Python Course 由 Udemy 提供\n**适用人群：** 初学者以及需要复习 Python 的个人\
    \  **价格：** 促销中\n这门来自 Udemy 的高评分课程以趣味的方式教授 `Python`。它由经验丰富的软件开发 Cher Hin Chong\
    \ 引导，他通过深入的视频演示来展示课程中的关键概念。注册费用包括 20 节视频课程，涵盖了 `Python` 安装、变量、数据类型、字符串操作、类型转换、排序等内容。在完成课程后，你还将获得一张完成证书。\n\
    \n### 2. Python 3 schedule — Build 5 Network Applications 由 Udemy 提供\n**适用人群：**\
    \ 想要了解 `Python 3` 的新程序员 \n这本 Udemy 畅销书由 `PythonTutorial IO` 提供，面向想要了解 `Python\
    \ 3` 的新程序员。它涵盖了 5 个网络应用：\n- 通过 `SSH` 读取/写入设备配置\n- 构建一个交互式子网计算器\n- 提取网络参数并构建图表\n\
    - 构建基础网络包捕获器\n- 配置文件管理和电子邮件通知\n\n现在注册即可解锁 11 小时的视频课程。你还将获得文章和资源来辅助学习。讲师 Mihai\
    \ Catalin Teodosiu 是一位经验丰富的 Python 开发者。在课程之前，具备 `CLI`、`OSI 层`、`SSH2`、`TCP/IP`\
    \ 和 `Telnet` 等网络概念的基础知识将帮助。\n\n### 3. Python 3 Masterclass — Make Your Job Tasks\
    \ Easier! 由 Udemy 提供\n**适用人群：** 入门数据输入员、开发者、工程师、信息技术和内部控制人员\n这本 Udemy 畅销书面向想要提高技能的入门数据输入员、开发者、工程师、信息技术和内部控制人员。你将发现如何高效使用\
    \ `Python` 并为职业增长做好准备。`Python 3 Masterclass — Make Your Job Tasks Easier!` 从零开始教授所有基础。教学涵盖的概念包括字符串、数字、布尔值、集合、元组、字典、循环、条件、异常等等。如果这门课程看起来适合你，现在注册即可获得终身访问权限，包含\
    \ 16 小时的录制视频。你还将获得 156 篇文章、43 份下载资源和 50 个代码练习。该课程还由 Mihai Teodosiu 主授。\n\n###\
    \ 4. Python Programming: A Concise Introduction 由 Wesleyan University 提供\n**适用人群：**\
    \ 几乎没有编程经验的初学者  **价格：** 免费\n该课程由 Wesleyan University 提供，互动式地介绍了 `Python 版本 3.x`\
    \ 编程。它最适合几乎没有编程经验的初学者。\n\nPython Programming: A Concise Introduction 包含 4 个模块：\n\
    - Python 编程\n- 使用列表和导入库 — 随机库\n- 元组、数据字典、文本和 CSV 文件\n- 函数值、排序、格式化、统计以及菜单驱动的数据库程序\n\
