    ### 5. Google 提供的 Python 速成课程


    **适用人群：** 无编程经验的学生

    **价格：** 免费


    想学习 Python 但总是四处忙碌？看这门入门课程就对了。它是“Google Python 自动化 IT 运维专业证书”计划中的核心课程。


    Python 速成课程分为 5 个核心组成部分：

    - Hello Python!

    - Python 基础语法

    - 循环

    - 字符串、列表和字典

    - 面对象编程


    课程还有一个终极项目，允许你在模拟环境中应用所学知识。在学习教学内容的过程中，你将完成一系列阅读材料和测试。你应该能在 25 小时内完成这门课程。


    ### 6. 莱斯大学提供的 Python 编程基础课程


    **适用人群：** 刚接触 `Python` 的个人

    **价格：** 免费


    该课程由莱斯大学提供，“Python 编程基础”深入探讨了通过 Python 构建程序以及编程的其他关键元素。它是“Python 脚本入门”专业课程中的主要课程。课程分为
    4 类：

    - 将 Python 用作计算器

    - 函数

    - 逻辑与条件

    - Python 模块


    课程材料通过一系列视频、阅读材料和测试交付，完成需要 12 小时。


    协调人 Scott Rixner 和 Joe Warren 是计算机科学教授。获取这门课程。


    ### 7. Team Treehouse 提供的 Python 基础课程


    **适用人群：** 几乎或完全没有 `Python` 经验的个人

    **价格：** 包含在月度会员中


    在不到 4 小时的时间内，这门来自 Treehouse 的入门课程将教你 Python 的构建基块。它涵盖了条件分支、异常处理、输入与输出、循环和其他基础编程概念。“Python
    基础”由开发者 Craig Dennis 带领，并将课程分为 4 个部分：

    - 认识 Python

    - 类型与分支

    - 函数与循环

    - 大功就绪


    每个部分都细分为几个微小且易于吸收的步骤。你跟随教学内容应该不会遇到困难。如果你有 Treehouse 月度会员，可以免费注册；否则，你可以通过免费 7 天试用尝试该课程。获取这门课程。


    ### 8. LinkedIn Learning 提供的 Python 学习


    **适用人群：** 新手开发者以及需要复习的资深开发者

    **价格：** $44.99 或包含在月度会员中


    这门入门课程由 Google 开发者关系经理兼战略合作伙伴 Joe Marini 主持，最适合新接触 `Python` 的人。如果你是资深开发者并希望对基础知识进行快速速成，你也会发现这门课程很有用。“学习
    Python”耗时略超过 2 小时，由以下模块组成：

    - 入门

    - Python 基础

    - 处理日期和时间

    - 处理文件

    - 处理网络数据


    注册包含在 29.99 美元的 LinkedIn 月度会员中，否则你需要支付 44.99 美元的固定费用。


    ### 9. 微软提供的 Python 入门：绝对初学者


    **适用人群：** 刚接触 `Python` 的个人

    **价格：** 免费


    通过微软的这门入门课程，你将以最快的速度学习 `Python` 的机制。你还将发现如何在短短 5 周内学会编码。“Python 入门：绝对初学者”由高级内容开发人员
    Eric Camplin 。它深入探讨了带有参数和返回值的可重用函数、使用条件语句和循环进行决策和重复，以及收集输入和处理输入/输出的方法。你还将发现如何在
    `Jupyter` 笔记本中使用 `Python` 并排查代码错误。


    你将获得编写采用条件逻辑并为用户提供响应的程序的知识和技能。MALINA PRONTO


