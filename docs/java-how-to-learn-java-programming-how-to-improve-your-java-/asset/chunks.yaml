    # 1. 学会正确 Google 错误

    这是一个你必须掌握的重要步骤。搜索和浏览你代码中的错误可以帮助你在瞬间纠正代码；但反过来，如果你不擅长这项，可能就像在没有地图的情况下跳入代码的漩涡。我想在这里与你分享的小技巧是：在
    Google 上搜索之前，将你的编译器生成的错误加上双引号（`“ ”`）。这样，Google 就会针对性地定位错误，因为相同的句子会提供更准确的过滤结果。


    # 2. 引导你的热门网站

    像 `Stack-Overflow` 和 `Reddit` 等网站在这里位列前茅，通过它们的代码指导全球的开发者。这是一个由来自各个领域的开发者组成的完整社区，他们聚在一起为彼此的项目提供帮助。在这里发布你的疑问可能需要
    2-3 周才能得到回复，但这是值得的，尽管你可能已经自己找到了你错误的答案，因为我们中的许多人可能都遇到过类似的错误。还建议你只需回答一些你能回答的问题来帮助他人，这样你也能从中学习。


    # 3. 活动与聚会

    这一步刚开始可能会很困难，因为它需要你克服害羞心理，但相信我，一旦你开始，你就会享受。所以，从尝试寻找与你有相似兴趣的人开始，并理解甚至与他们一起工作。你可以尝试查看你
    Facebook 活动页面上的某些“编码活动”，或访问 meetup 网站并建立联系以获取更多信息。


    # 寻找工作或实习

    最后，许多人学习编程语言是为了完成开发工作。因此，一旦你足够自信，或者相信你已经掌握了一些基础编程知识，你就会想通过从实习开始进入开发行业。在你感兴趣的项目期间开始担任有薪或无薪实习生，否则你甚至可以协助或与经验丰富的开发者一起来来。作为实习生给了你发现和增强技能的机会，有时甚至获得报酬。尽管你没有痛苦，但你获得了一个在行业内建立网络的机会，供未来参考和安置。你可以通过以下方式开始寻找实习：


    - **LinkedIn**：它是最受信赖的来源，可以接触良好的受众，并可能帮助你找到感兴趣的广泛实习。

    - **招聘招聘**：这些非常有帮助，因为你有机会与招聘人员面对面，从而讨论你的兴趣并分析项目是否也吸引你。

    - **人脉关系**：这通常是获得实习的最推荐方式，因为你通过别人的推荐进入就业，注定比其他候选人更有优势，因为如果他们公司的人推荐了你，他们倾向于很容易信任你。你将通过参加上述的活动和聚会建立你的人脉网络。


    # 计算机科学学位或训练营

    哪种方法有助于学习编程？对于那些开始学习代码的人来说，通过在学习课程期间加入 `Bootcamp` 来复习可能是一个常见问题。对于目前的问题没有特定的答案，因为它完全取决于个人以及他们的学习能力。为了进一步指导你，如果你是一个尚未进入研究生阶段的高中生，且编程是你想要从事的职业，那么你想要获得计算机学位；但如果计算和编码是你职业生涯后期才感兴趣的事情，那么你可能想在学习选择的编程语言期间参加
    `Bootcamp`。然而，建议你自己在花费昂贵的 `Bootcamp` 之前，先从一个付费或免费的网页课程开始，先体验一下编码的氛围。


    # 如何在 2020/2021 年提高你的 Java 代码水平

    如果你是一个 `Java` 开发者，过去几年的技能进步为 Java 世界带来了变化。


    众所周知，`Java` 可能是一种非常成功且流行的编程语言。它被广泛用于构建日常生活中使用的应用，从桌面应用到 Web 应用、科学超级计算机、游戏机、手机，并到互联网。`Java`
    程序员目前主要在信息技术领域被招募，在那里，`Java` 几乎被应用于每一个角落。因此，`Java` 已成为任何人可以立即进入的增长最快、最有前景的领域之一。但
    `Java` 的初学者（即使是经验丰富的开发者）一直会有这个挥之不去的问题：“我该如何提高我的 `Java` 技能？”使用 `Java` 解决现实世界的问题并不是容易的，许多初学者觉得这很难。在世界上实际应用你的知识之前，研究并理解
    Java 概念是关重要的。


    # 为什么 Java 流行？

    有几个原因导致 `Java` 在各种编程语言中很流行：

    - `Java` 易于理解，它的语法用最少的字符实现，它运行在适当的服务器上，这可能是 AI 和 ML 项目的强制性特性。

    - `Java` 的跨平台特性允许你为多个竞争平台开发软件。

    - 你可以轻松地学习并做出有效的解决方案，因为在优秀的 Java 社区中，总有人可以帮助你。

    - 有许多免费的教程可以学习 Java，这让学习变得更容易。从机器学习解决方案、神经网络到遗传编程和多机器人系统，`Java` 是那门可以实现所有这些内容的编程语言。


    # 增强编码技能的顶级技巧

    如果你尝试提高自己的技能，我们将为你分享一些顶级技巧。让我们循序渐进看看你如何提高技能：


    ## 1. 掌握基础知识

    第一步是明确你的基础，以建立稳健的基础。这涉及到寻求并深入理解数据结构、算法、面向对象原则和设计模式。理解面向对象原则并理解与现实相关的概念。如果你发现提高自己很困难，找一个诚实的来源参加培训课程来加强基础并提高你的技能。记住，要理解概念而不是死记硬背。


    初学者应该学习的一些 Java 基础包括：

    - `Java 8`

    - `Spring 框架 (Spring Boot)`

    单元测试

    - `API 和 库`

    - `JVM 内部`

    - 设计模式

    - `DevOps 工具`

    - `Kotlin`


    ## 2. 学习 OO（面向对象）原则

    接一步是加强对面向对象原则的理解。面向对象设计原则如 `抽象`、`封装`、`多态`和`继承` 在 Java 中非常重要。学习基础并将这些设计原则应用于你的代码中。确保设计原则或模式有现实案例。


    参考 `Apache` 的开放 ASCII 文本文件并搜索一些关于 OOP 设计原则的良好资源。


    ## 3. 阅读书籍和博客保持更新

    书籍可以为你提供坚实的知识，无论你是初学者还是复杂的开发者。你将学习从概念到现实对象的所有内容。


