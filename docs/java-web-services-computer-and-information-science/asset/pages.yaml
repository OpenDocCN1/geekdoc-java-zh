    # 3.4.1 SOAP Intermediaries


    SOAP defines intermediaries as nodes for providing message processing and protocol
    routing characteristics between sending and receiving applications. Intermediary
    nodes reside between the sending and receiving nodes and process parts of the
    message defined in the SOAP header. The two types of intermediaries are as follows:


    +   - **Forwarding intermediaries.** This type processes the message by describing
    and constructing the semantics and rules in the SOAP header blocks of the forwarded
    message.


    +   - **Active intermediaries.** This type handles additional processing by modifying
    the outbound message for the potential recipient SOAP nodes with a set of functionality.'
