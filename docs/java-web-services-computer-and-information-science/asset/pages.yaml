  md: '# SOAP Web Services 131


    The SOAP encoding defines a set of rules for expressing its data types. It is
    a generalized set of data types that are represented by the programming languages,
    databases, and semi-structured data required for an application. SOAP encoding
    also defines serialization rules for its data model using an encodingStyle attribute
    under the SOAP-ENV namespace that specifies the serialization rules for a specific
    element or a group of elements.


    SOAP encoding supports both simple- and compound-type values.


    # 3.3.1 Simple Type Values


    The definition of simple type values is based on the “W3C XML Schema, Part -2:
    Datatypes” specification. Examples are primitive data types such as string, integer,
    decimal, and derived simple data types including enumeration and arrays. The following
    examples are a SOAP representation of primitive data types:


    > Database is an organized collection of data, generally stored and accessed electronically
    from a computer system.


    ```

    <int>98765</int>

    <decimal> 98765.43</decimal>

    <string> Java Rules </string>

    ```


    The derived simple data types are built from simple data types and are expressed
    in the W3C XML Schema.


