    +   Create test clients for invoking the deployed Web services.


    +   Register and publish your Web service in a UDDI registry, in case require
    enabling the service available by searching public/private UDDI registries for
    Web services.


    These steps are common. They are based on the implementation available from most
    popular Web services platform vendors. Perhaps in the future, implementation may
    vary, based on emerging standards.


