  md: '# SUMMARY


    +   - Java and XML are known to be a perfect fit for building portable business
    applications, Java provides the portability of code that can be executed on various
    platforms and XML provides the portability of data that can be processed on diverse
    platforms.


    +   - XML is an ASCII-based structured meta-data language that has been widely
    adopted in the industry.


    +   - A root is the topmost element in an XML document. For a document to be syntactically
    correct, it must contain only one root element.


    +   - Processing instructions (PIs) are used for providing information to the
    XML processing application.


    +   - Comments are used for defining parts of an XML structure. Comments are defined
    using the same syntax as HTML.


    +   - A tag is the element markup identified by the angle brackets. Each tag must
    have a start tag and a close tag.


    +   - An element is the data delimited by a start tag and an end tag. It is the
    building block used for creating XML documents.


    +   - Namespaces in an XML document are used to prevent naming collisions within
    same or different XML documents. The namespace syntax enables prefix definition
    and an associated URI/URL to exist.


    +   - JAXP provides a plugability layer, which enables application developers
    to change parser implementations without affecting the application logic.


    +   - The JAXP API model is easy to understand and simple to use. The parsing
    classes and interfaces are packaged under the javax.xml.parsers package and on
    top of existing SAX or DOM APIs.


    +   - The Simple Access for XML (SAX) API is based on an event-driven processing
    model where the data elements are interpreted on a sequential basis and callbacks
    are called based on selected constructs.


    ![](img/386c9660607eea1159d16febe1f732ac_229_0.png)'
