  md: '# XML MESSAGING USING JAXM AND SAAJ


    # CHAPTER

    6


    Study how to write smart contracts, which is the basic unit of programming

    a blockchain for business purposes. It is the equivalent of being taught

    HTML and Java during the early Internet days. And master how to create

    assets or tokenize existing ones on a blockchain.


    William Mougayar


    # LEARNING OBJECTIVES


    After studying this chapter, you will be able to:


    +   - Describe the role of JAXM in web services

    - Learn about JAXM API programming model

    - Know the basic programming steps for using JAXM


    # INTRODUCTION


    This chapter discusses the Java API for XML messaging

    (JAXM) and SOAP with Attachment API for Java (SAAJ).

    Both JAXM and SAAJ enable XML-based messaging for B2B

    and Web services applications supporting a wide range of

    industry standards, including SOAP and ebXML.


    JAXM is an integral part of the JWSDP, which provides

    synchronousous and asynchronous messaging capabilities in the

    Web services environment and enables the exchanging of

    XML documents over the intranet or Internet. JAXM provides

    a messaging infrastructure and standard API mechanisms

    for building, sending, and receiving XML messages.


    ![](img/386c9660607eea1159d16febe1f732ac_234_0.png)'
  merge: -1
  pgno: 234
- img_proc: true
  md: 'In addition to JAXM, JWSDP provides SAAJ, which facilitates the sending and
    receiving of XML documents as SOAP-messages without a JAXM provider infrastructure
    and the handling of SOAP-based HTTP requests/responses. Initially, SAAJ was part
    of the JAXM 1.0 API bundle, and from JAXM 1.1 this package is referred to as SAAJ
    1.1 APIs.


    Both the JAXM and SAAJ APIs are fully compliant with SOAP 1.1 specifications and
    SOAP 1.1 with attachments, which helps Java Web services developers write JAXM-
    or SOAP-based XML messaging applications with minimal effort and little understanding
    of SOAP messaging. In a business context using JAXM or SAAJ, the XML documents
    exchanged can be produced information, purchase orders, invoices, order confirmations,
    or whatever.


    # 6.1 THE ROLE OF JAXM IN WEB SERVICES


    JAXM is an API framework based on the messaging protocols defined by the SOAP
    1.1 specifications and SOAP attachments. JAXM uses a standard messaging provider
    infrastructure and Java-based APIs to facilitate the sending and receiving of
    XML-based messages asynchronously in a Web environment and supporting Web services
    standards and protocols. The core features of JAXM are as follows:


    +   - Has portable XML messaging applications

    - Has synchronous (request/response) and asynchronous (one-way) messaging

    - Transmits and routes messages to many providers

    - Ensures message delivery through reliable messaging

    - Supports standard Internet protocols, such as HTTP, SMTP, and FTP


    When using JAXM without a provider infrastructure, the messages can be sent and
    received as requests and responses through a SOAP connection using the SAAJ 1.1
    APIs provided with JWSDP 1.0.


    JAXM provides the notion of messaging profiles, which enable messaging protocols
    to be implemented over SOAP messaging.


    JAXM-based application client must use a messaging profile to identify its under
    transport bindings, message structure, and semantics. This establishes an agreement
    between the JAXM client and its JAXM messaging provider.


    ![](img/386c9660607eea1159d16febe1f732ac_235_0.png)'
  merge: -1
  pgno: 235
- img_proc: true
  md: '# XML Messaging Using JAXM and SAAJ 221


    JAXM-based applications (senders and receivers) can be deployed in JAXM servlet
    2.2 or J2EE 1.3-compliant server providers. JAXM runs as an asynchronous application
    and executes methods upon receiving messages from the provider. JAXM applications
    running without providers can run as standalone clients, exchanging messages as
    requests and responses with another JAXM/SOAP 1.1-compliant application.In a Web
    scenario, the JAXM messaging infrastructure acts like a SOAP intermediary to route
    messages between destinations. The Web services request sends messages to its
    JAXM messaging provider, which then routes the messages to the Web service provider''s
    JAXM messaging provider. The Web services provider receives the message and executes
    the appropriate methods as required by the service requester or it may reroute
    the message to its next intermediate destination or its final destination.


    # 6.1.1 JAXM Application Architecture


    Figure 1 represents a JAXM-based application architecture and its core elements.


    +   * JAXM clients. JAXM clients are JAXM-based application components that send
    and receive JAXM messages. The JAXM clients (senders and receivers) can run using
    a JAXM provider or without a provider. JAXM clients using a provider connection
    can send and receive messages asynchronously as one-way transmissions. A JAXM
    client also take advantage of the provider-offered features like message reliability
    and ensured delivery. In the case of JAXM without a provider, the JAXM client
    can send and receive messages as requests and responses over a SOAP connection.
    In general, a JAXM receiver client does not require a JAXM provider.


    ![](img/386c9660607eea1159d16febe1f732ac_236_0.png)


    Figure 1. A JAXM-based application architecture.


    ![](img/386c9660607eea1159d16febe1f732ac_236_1.png)'
  merge: -1
  pgno: 236
- img_proc: true
  md: '# Java Web Services


    JAXM messages. JAXM messages are XML documents based on SOAP standards and conventions
    that define the basic message for-mat during a JAXM communication. The SAA 1.1
    API provides the low-level Java APIs for constructing SOAP 1.1-compliant XML messages
    (with or without attachments).


    JAXM connections. JAXM connections are a set of pre-configured JAXM clients to
    a provider or SOAP implementation. The JAXM clients send and receive messages
    using these connections. A JAXM connection using a provider is quite similar to
    a connection to a message-oriented middleware. In the case of connections without
    a JAXM provider, it works quite similar to a peer-to-peer communication model
    where the destination is refer-ring to a SOAP endpoint.


    JAXM profiles. JAXM messaging profiles provide the flexibility to use messaging
    protocols implemented over SOAP messaging. In a client application, the profile
    defines the transport bindings, message header definitions, and semantics specific
    to SOAP messages. The JM client using a JAXM provider is required to use a messaging
    profile, which is usually provided as a URL referring to an XML schema that defines
    the message structure. For instance, the profile for the ebXML Message Service
    (MS) specification can be found at http://www.ebxml.org/project_teams/transport/messageHeader.xsd.
    The JAXM reference implementation provided with JWSDP 1.0 supplies messaging profiles
    for SOAP-RP and ebXML.


    ![](img/386c9660607eea1159d16febe1f732ac_237_0.png)


    Communication is the act of conveying meanings from one entity or group to another
    through the use of mutually understood signs, symbols, and semiotic rules.


    ![](img/386c9660607eea1159d16febe1f732ac_237_1.png)


    JWSDP is a free software development kit (SDK) for developing Web Services, Web
    applications and Java applications with the newest technologies for Java.


