  md: '# 254 Java Web Services


    RPC-based services using session beans and message-driven beans. The JAX-RPC 1.0
    runtime services also provide support for HTTP-based basic authentication and
    session management.


    ![](img/386c9660607eea1159d16febe1f732ac_269_0.png)


    Authentication is the act of proving an assertion, such as the identity of a computer
