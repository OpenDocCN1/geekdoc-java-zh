    Figure 3. Messaging-based communication model.


    # ## 2.4 IMPLEMENTING WEB SERVICES


    The process of implementing Web services is quite similar to implementing any
    distributed application using CORBA or RMI. However, in Web services, all the
    components are bound dynamically only at its runtime when using standard protocols.
    Figure 4 illustrates the process highlights of implementing Web services.


    As illustrated in Figure 4, the basic steps of implementing Web services are as
    follows:


    +   1. The service provider creates the Web service typically as SOAP-based service
    interfaces for exposed business applications. The provider then deploys them in
    a service container or using a SOAP runtime environment, and then makes them available
    for invocation over a network. The service provider also describes the Web service
    as a WSDL-based service description, which defines the clients and the service
    container with a consistent way of identifying the service location, operations,
    and its communication model.

    2. The service provider then registers the WSDL-based service description with
    a service broker, which is typically a UDDI registry.

    3. The UDDI registry then stores the service description as binding templates
    and URLs to WSDLs located in the service provider environment.

    4. The service requester locates the required services by querying the UDDI registry.
    The service requester obtains the binding information and the URLs to identify
    the service provider.

    5. Using the binding information, the service requester invokes the service provider
    and retrieves the WSDL Service description for those registered services. Then,
    the service requester creates a proxy application and establishes communication
    with the service provider using SOAP.


    ![](img/386c9660607eea1159d16febe1f732ac_65_1.png)'
  merge: -1
  pgno: 65
- img_proc: true
  md: '6. Finally, the service requestor communicates with the service provider and
    exchanges data or messages by invoking the available services in the service container.


    ![](img/386c9660607eea1159d16febe1f732ac_66_0.png)


    **Figure 4.** Process steps involved in implementing services.


    In the case of ebXML-based environment, the steps just shown are the same, except
    ebXML registry and repository, ebXML Messaging, and ebXML CPP/CAP are used instead
    of UDDI, SOAP, and WSDL, respectively. The basic steps shown also do not include
    the implementation of security and quality of service (QoS) tasks.


    # 2.5 DEVELOPING WEB SERVICES-ENABLED APPLICATIONS


    The design and development process of creating a Services-enabled application
    is not different from the typical process of developing a distributed application.
    In case of Web services, it can be created as a new application or using an existing
    application by repurposing them as services.In a Web services implementation,
    it is possible to expose existing legacy applications as services by encapsulating
    the core business functionalities of those underlying applications. The underlying
    applications can be of any application implemented in any programming language
    and running on any platform.


    ![](img/386c9660607eea1159d16febe1f732ac_66_1.png)


    Programming language is a formal language comprising a set of instructions that
    produce various kinds of output. Programming languages are used in computer programming
    to implement algorithms.


    ![](img/386c9660607eea1159d16febe1f732ac_66_2.png)'
  merge: -1
  pgno: 66
- img_proc: true
  md: 'Figure 5 represents a typical Web services implementation model providing service-oriented
    interfaces supporting a variety of back-end application environments.


    The implementation steps generally involved in developing Web services solutions
    by exposing back-end business applications are as follows:


    +   1. The potential business component of the underlying application will be
    encapsulated as service-oriented interfaces using SOAP and then exposed as Web
    services by deploying them in a Web service container or a SOAP runtime environment.
    Using those SOAP-based interfaces, the service container handles all the incoming
    SOAP requests/responses or messaging-based operations and maps them as methods
    and arguments of the underlying business application.


    ![](img/386c9660607eea1159d16febe1f732ac_67_0.png)


    Figure 5. Exposing applications through Web services.


    +   2. WSDL-based service descriptions will be generated and reside in a service
    container. WSDL defines the communication contract required for invoking the SOAP-based
    service interfaces. These WSDL-based service descriptions will be published in
    a UDDI registry as service templates and its location URLs. The interfaces required
    for publishing in the UDDI registry are usually provided by the Web service container.


    +   3. The service requester finds the services using the discovery mechanisms
    (registry API) and obtains the service description and its provider location URL.
    It then connects to the service provider to obtain WSDL.


    +   4. To invoke the services exposed by the service provider, the service requestor
    (service delivery environment) is required to implement SOAP-based client interfaces
    according to the service description defined in the WSDL.'
  merge: -1
  pgno: 67
- img_proc: true
  md: '# Web Services Architecture


    The Web services container/runtime environment generally provides the tools required
    for creating SOAP-based services interfaces from existing applications and generating
    WSDL-based service descriptions. Depending on the Web runtime environment, some
    providers also test environments for UDDI and interfaces for publishing services
    interfaces.


    The previous steps are usually common at all levels of Web services development,
    irrespective of the target application such as J2EE, CORBA, Microsoft .NET, or
    standalone applications based on Java, C++, Microsoft Visual Basic, and legacy
    applications based on, the Mainframe environment. As a result, implementing Web
    services unifies J2EE, CORBA, .NET, and other XML-based applications with interoperability
    and data sharing.


    # 2.5.1 How to Develop Java-Based Web Services


    With the overwhelming success of Java in Web and pervasive applications running
    on a variety of platforms and devices, the Java platform has become the obvious
    choice for enterprise architects and developers. In addition to the Java platform,
    today the J2EE-based application environment has also become the preferred solution
    for running Web services-based solutions.


    Web services are generally driven by a Web-enabled application environment for
    HTTP communication. Because of that fact, in most cases the J2EE-based Web services
    environment plays a vital role as a service enabler for deploying Java and J2EE
    components as Web services. In addition, the adoption of a J2EE-based Web services
    environment carries one significant advantage: the deployment of Web services
    interfaces by the automatic inheritance of all the characteristics of the J2EE
    container-based services such as transactions, application security, and back-end
    application/databases connectivity.


    Let''s take a closer look at how to build Web services implementation using a
    J2EE environment.


    # Building Web Services in the J2EE Environment


    The process of building Web services using a J2EE environment involves exposing
    J2EE components such as servlets and EJBs. In addition, J2EE applications can
    also access these exposed services using standard protocols.


    In a typical implementation, a J2EE-based Web services model defines another way
    of exposing their business components similar to Web applications and RMI/IIOP-based
    application connectivity without changing the architectural model or code of the
    existing J2EE components.


    ![](img/386c9660607eea1159d16febe1f732ac_68_0.png)'
