  md: '# Universal Description, Discovery, and Integration (UDDI)


    Universal Description, Discovery, and Integration, or UDDI defines the standard
    interfaces and mechanisms for registries intended for publishing and storing descriptions
    of network services in terms of XML messages. It is similar to the yellow pages
    or a telephone directory businesses list their products and services. Web services
    use UDDI as a standard for registering the Web service providers. By communicating
    with the UDDI registries, the service requesters locate services and then invoke
    them.


    In the Web services model, UDDI provides the registry for Web services to function
    as a service broker enabling the service providers to populate the registry with
    service descriptions and service types and the service requesters to query the
    registry to find and locate the services.


    It enables Web applications to interact with a UDDI-based registry using SOAP
    messages. These registries can be either services within an enterprise or a specific
    community, or they can be public registries to service the whole business community
    of the Internet. The UDDI working group includes technology vendors like Sun Microsystems,
    IBM, HP, SAP, Oracle, and Microsoft.


    # ebXML


    ebXML defines a global electronic marketplace where enterprises find one another
    and conduct business collaborations and transactions. It also defines a set of
    specifications for enterprises to conduct electronic business over the Internet
    by establishing a common standard for business process specifications, business
    information modeling, business process collaborations, collaborative partnership
    profiles, and agreements and messaging, ebXML is an initiative sponsored by the
    United Nations Center for Trade Facilitation and Electronic Business (UN/CEFACT)
    and the Organization for the Advancement of Structured Structured Information
    Standards (OASIS). Popular standards organizations like Open Travel Alliance (OTA),
    Open Application Group, Inc. (AGI), Global Commerce Initiative (GCI), Health Level
    7 (HL7, a healthcare organization), and RosettaNet (an XML standards committee)
    have also endorsed it.


    In the Web services model, ebXML provides a comprehensive framework for the electronic
    marketplace and B2B process communication by defining standards for business processes,
    partner profile and agreements, registry and repository services, messaging services,
    and core components. It complements and extends with other Web services like SOAP,
    WSDL, and UDDI. In particular:


    +   - ebXML Business Process Service Specifications (BPSS) enable business processes
    to be defined.


    ![](img/386c9660607eea1159d16febe1f732ac_40_0.png)'
