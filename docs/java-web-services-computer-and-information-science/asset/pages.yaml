    # JAX-RPC Client Invocation Programming Models


    The JAX-RPC 1.0 specification defines the implementation of a JAX-RPC-based client
    using any of the following client invocation programming models:


    +   - Stub-based


    +   - Dynamic proxy


    +   - Dynamic invocation


    Now, let''s take a look at these different ways of client implementation and walk
    through the programming steps required for each.


    # Stub-Based Client


    A stub-based model is the simplest client-programming model. This model uses the
    local stub classes generated by the xrpc tool. To ensure that the stub classes
    are available in the CLASSPATH.


