  md: '# CREATING .NET

    INTEROPERABILITY


    # CHAPTER

    4


    From the point of view of the people who are using the platform, one of the

    most valuable things about Java is the consistency, the interoperability.


    James Gosling


    ![](img/386c9660607eea1159d16febe1f732ac_166_0.png)


    # LEARNING OBJECTIVES


    After studying this chapter, you will be able to:


    +   - Know the means of ensuring interoperability

    - Understand the Microsoft .NET framework

    - Discuss about developing Microsoft .NET client for web services

    - Learn about challenges in creating web services interoperability

    - Understand the WS-I initiative and its goals

    - Describe the public interoperability testing efforts


    # INTRODUCTION


    This chapter discusses the basics of Web services interoperability and illustrates
    an interoperable Web services scenario using Java and Microsoft .NET-based application
    environments. One of the goals of Web services is to solve the interoperability
    problem by adopting industry standard protocols and data formats,'
  merge: -1
  pgno: 166
- img_proc: true
  md: 'which enable transparent application-to-application communication and data
    exchange between applications, systems, networks, and devices.


    Web services technologies like XML, SOAP, WSDL, and UDDI have demonstrated how
    to create service-oriented applications that communicate and operate with one
    another over a network.


    Although Web services promote interoperability, creating and testing interoperability
    between Web services becomes a real challenge when differences and limitations
    exist among implementations, especially because of application-specific dependencies
    and characteristics such as transport protocols, data types, XML processing, and
    compatibility. In real-world scenarios involving business partner collaborations,
    the Web service provider needs to take particular care to define standard interoperability
    mechanisms and communication protocol for the partner applications, enabling them
    to build their own service clients. This enables partner applications using different
    systems to easily interact with the Web service provider and conduct seamless
    transactions with them.


    # 4.1 MEANS OF ENSURING INTEROPERABILITY


    In a Web services environment, the Simple Object Access Protocol, or SOAP, is
    the facto standard communication protocol. This protocol provides conventions
    for representing data and application interaction methods like remote procedural
    calls (RPCs) and messaging. This facilitates inter-application communication and
    seamless data sharing among applications residing on a network, regardless of
    their native language implementation, operating systems, hardware platforms, and
    the like. In turn, it also enables the development of compatible Web services
    by leveraging interoperability among business applications running across a wide
    range of systems and devices.


    Interoperability in Web services becomes a real challenge when a service request
    finds problems while invoking a method in the service provider environment or
    when it does not understand a message sent by the service provider. This'
  merge: -1
  pgno: 167
- img_proc: true
  md: 'is usually caused by prerequisites and factors exposed by the service provider
    or service requestor environments, and it is mostly caused by the dependencies
    of the underlying SOAP runtime implementation. Thus, it becomes essential for
    Web services offered by a service provider to ensure that the services are used
    by a variety of service requestor clients to the best possible accommodation of
    both conforming and non-conforming SOAP implementations. Different ways exist
    to ensure service interoperability with the service providers. The following sections
    discuss the major ones.


    #  4.1.1 Declaring W3C XML Schemas


    Defining W3C XML Schema Definitions (XSD) and target namespaces for all the application
    data types and having a supporting SOAP implementation for both the service provider
    and service requestor resolves all interoperability issues specific to the data
    types. This helps to create SOAP proxy-based clients for the service requestors
    with all the defined data types by providing automatic encoding and mapping for
    the service provider-defined XSD data types.


    > The SOAP client runtime implementation must provide those dynamic invocation
    services.


    #  4.1.2 Exposing WSDL


    Most Web platforms and SOAP implementations provide this as an automatic mechanism
    by delivering WSDL for all its exposed services. The exposed WSDL defines the
    service provider information and service specific parameters required by a service
    requestor for invoking the services, which enables the building service clients
    to interact with the service provider, thus ensuring interoperability based on
    the WSDL. The service clients also can be dynamically generated from a service
    provider''s WSDL lookup.


    #  4.1.3 Creating SOAP Proxies


    For a Web service, the client SOAP proxies can be created manually or can be generated
    dynamically based on the WSDL-details of the service provider. In the automatic
    generation of SOAP proxies, sometimes they may throw SOAP faults during service
    invocation and may require some'
  merge: -1
  pgno: 168
- img_proc: true
  md: 'modifications in the SOAP headers or the encoded RPC calls. In most cases,
    this problem occurs due to non-conforming WSDL and SOAP implementation in the
    infrastructure of the service provider or requestor.


    # 4.1.4 Testing Interoperability


    To ensure interoperability between the service provider and requestor exists,
    the underlying SOAP implementations also can be tested. In that case, the SOAP
    implementations of the service provider and the requestor must agree and conform
    to the following SOAP-specific dependencies:


    +   - The defined SOAP transport protocol bindings (like http)

    - The supported version of SOAP (like SOAP 1.1 or SOAP 1.2)

    - The version of WSDL from the service provider and its ability to support by
    the service requestor client

    - The version of W3C XML Schema supported by the SOAP message, especially the
    SOAP envelope and its body elements


    Most services platforms and SOAP implementation providers test their products
    among SOAP implementations using a standard test suite. This suite can be used
    to ensure interoperability with other SOAP implementations for conformance testing.


    To explore the concepts, let''s experiment with an interoperability scenario using
    a Java-based Web services implementation to interact with a Microsoft-based service
