    Simple data types cannot contain other elements or any of their attributes. The
    schema element, using simple data types, is defined using the following-syntax:

    `<element name="[name of element]" type="[type of element]" [option(s)]`


    For example:


    `element name="Price" type="decimal" />`


    Name is used to identify the XML element that the schema can constrain, type refers
    to the type of data that is expected to be stored between the elements. There
    are also other possibilities of variation, such as the occurrence of an element
    in the XML document.


    Similarly to DTDs, XML Schema provides an equivalent to (+,?) attrib-utes, which
    are called minOccurs and maxOccurs. Revisiting the syntax, we get


    ```

    <element name="[name of element]"

    type="[type of element]"

    minOccurs="[Min-occurrences]"

    maxOccurs="[Max-occurrences]"

