    # 5.1 EXTENSIBLE MARKUP LANGUAGE (XML)


    XML is an ASCII-based structured meta-data language that has been widely adopted
    in the industry. Currently, it is adopted in many areas such as security (for
    example, SAML and XACML), metadata (for example, XML Schema and TopicMaps), and
    presentation (for example, XHTML and XSLT); XML was created in 1996 and embodied
    by the W3C group since early 1998. It is a derivative of the well-known SGML markup
    language, which has been around for a long time but has not gotten much acceptance
    as XML due to its complexity. XML was created as an extensible way to represent
    data. It does not define a standard and well-defined set of tags (such as HTML)
    but rather provides the capability to create custom tags. It has the flexibility
    to define complex data structures in a modular way, promoting clarity and consistency.HTML
    tags, referred to as markup, have a specific meaning. When interpreted by a browser,
    the HTML tags have a particular presentation-oriented function within the document.
    For example, the tag <Body> marks the beginning of a page. Anything that is inside
    the <Body> tag is rendered and displayed on the Web page. The <Body> tag also
    contains a closing tag, which is represented by the </Body> tag. In XML, the same
    set of tags could have different meanings. For example, consider an XML file that
    describes the characteristics of a person. The Person tag contains a Body tag
    that will contain the weight and height of a person. The following is an XML representation
    of such description:


    ```

    <xml version="1.0" ?>

    <Friends>

    <Person>

    <Name>Jane Doe</Name>

    <Age>21</Age>

    <Body>

    ```


