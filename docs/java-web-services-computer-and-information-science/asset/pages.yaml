  md: '# Adding Attachment Parts


    Our next step is to add AttachmentPart to the message using JavaBeans Activation
    Framework (JAF) API. To add an attachment to the message, we create an AttachmentPart
    object:


    ```

    // Access the URL of an image attachment

    URL url = new URL(\http://www.wiley.com/jws/jwsbookcover.jpg\n

    // Use JAF, and create a JAF DataHandler with this URL

    DataHandler handler = new DataHandler(url);


    // Create and Add an AttachmentPart

    message.addAttachmentPart();

    message.createAttachmentPart(handler);

    ```


    # Saving the Message


    Update the SOAPMessage object with all the additions to the message by calling
    the saveChanges() method:


    ```

    // Save the message

    message.saveChanges();

    ```


    # Sending the Message


    Now that the message has been created and the contents added and it is ready to
    be sent, the message can be sent asynchronously using the ProviderConnection method
    send():


    ```

    // Send the message

    pc.send(message);

    ```


    # Closing the Provider Connection


    The last step to do is close ProviderConnection by calling Provider-Connection.close().


    ```

    // Close the provider connection

    pc.close();

    ```


