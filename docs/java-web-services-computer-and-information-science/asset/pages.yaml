    Figure 4. A Java RMI architectural model.


    The Java RMI architecture is composed of the following components:


    +   - **RMI client.** The RMI client, which can be a Java applet or a standalone
    application, performs the method invocations on a server object. It can pass arguments
    that are primitive data types or serializable objects.


    +   - **RMI stub.** The RMI stub is the client proxy generated by the rmi compiler
    (rmic provided along Java developer kit–JDK) that encapsulates the network information
    of the server and performs the delegation of the method invocation to the server.
    The stub also marshals arguments and unmarshals the return values from the method
    execution.


    +   - **RMI infrastructure.** The RMI infrastructure consists of two layers: the
    remote reference layer and the transport layer. The remote reference layer separates
    the specific method reference behavior from the client stub. It handles certain
    reference semantics like connection retries, which are unicast/multicast of the
    invocation requests. The transport layer actually provides the networking infrastructure,
    which facilitates the actual data transfer during method invocations, the passing
    of formal arguments, and the return of back execution results.


    +   - **RMI skeleton.** The RMI skeleton, which also is generated using the RMI
    compiler (rmic) receives the invocation requests from the stub and processes the
    arguments (marshalling) and delegates them to the RMI server. Upon successful
    method execution, it marshals the return values and passes them back to the RMI
    stub via the RMI infrastructure.


