  md: '# 7.1.1 Comparing JAX-RPC with JAXM


    While comparing JAX-RPC with JAXM, both are an integral part of JWSDP but provide
    different API-based mechanisms for developing Web services. Table 1 compares the
    features of JAX-RPC to JAXM.


    JAX-RPC is also a best-fit solution over JAXM especially in request/ response
    communications where high performance, limitations in memory, and maintaining
    client state are defined as the key requirements.


    Now, let''s take a closer look at a JAX-RPC-based Web service application and
    explore its features.


    # 7.1.2 JAX-RPC Application Architecture


    Figure 1 represents a JAX-RPC-based application architectural model and its core
    elements.


    A typical JAX-RPC application architectural model consists of the following elements:


    +   - JAX-RPC service. Represents a business component that can be implemented
    in Java or generated from existing Java classes or from a WSDL document. In a
    JEE environment, it can be implemented as a servlet, stateless session bean, or
    a message-driven bean. During deployment, the JAX-RPC service is assigned with
    one or more service endpoints and then is configured to a transport protocol binding.
    For instance, a JAX-RPC service can be bound to HTTP and all the messages exchanged
    as HTTP-based requests and responses using its assigned endpoint. The JAX-RPC
    services do not dictate that it has be accessed by a JAX-RPC client and thus a
    non-Java client running on heterogeneous environments can access it.


    +   - JAX-RPC service client. Represents a JAX-RPC-based service client that can
    access a service. The service client is independent of the target implementation
    on the service provider. This means that the accessed service can be a service
    implemented using a Java platform or a SOAP 1.1-compliant service running on a
    non-


    ![](img/386c9660607eea1159d16febe1f732ac_267_0.png)


    The JAX service clients can import WSDL exposed by a service provider and can
    generate Java-based classes to access the service.


