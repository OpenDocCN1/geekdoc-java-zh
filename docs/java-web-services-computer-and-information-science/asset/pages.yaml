    # 6.3.1 Using a JAXM Provider


    Figure 3 illustrates a JAXM provider-based communication scenario.


    ![](img/386c9660607eea1159d16febe1f732ac_246_0.png)


    The key features of using a JAXM provider-based communication are as follows:


    +   * It defines an asynchronous communication model where the sender and receiver
    do not need to be connected at all times and the receiver does not require blocking
    of the destination for receiving messages.


    +   * It provides reliability mechanisms to store and forward messages to one-to-many
    destinations and uses messaging protocols to adopt high-level messaging protocols
    like ebXML.


    If a JAXM messaging provider is used, when client sends a message, the message
    goes to the messaging provider and then is forwarded to its recipient. The provider
    facilitates the transmission to its destination receiving the message on behalf
    of the application.


    # Steps for Sending Messages with a Message Provider


    The key programming steps for sending messages using JAXM APIs with a messaging
    provider are as follows:'
  merge: -1
