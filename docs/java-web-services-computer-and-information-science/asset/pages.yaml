  md: '# Developing the ACME Web Service Requestor


    To build the ACME Web service requestor, it is a requirement to create SOAP-based
    client interfaces using the WSDL-based descriptions exposed by the ACME service
    provider (WebLogic environment). Although it is not mandatory to choose any programming
    language for implementing the client interfaces, it must support the use of SOAP
    for communication.


    As discussed earlier, we will be using Apache Axis to build the ACME requestor
    client environment. Axis provides a WSDL2Java tool to build Java-based proxies
    and skeletons for WSDL descriptions.


    To create the service requestor client as Java Axis environment, the following
    tasks are involved:


    +   1. Install and set up Apache Axis development environment. Ensure that Axis
    class libraries and other optional libraries (that is, Apache Xerces, Xalan) are
    in the Java compiler class path.


    +   2. Create test client directory and run the org.apache.axis.wsdl.WSDL2Java
    utility by providing an ACME Web services WSDL URI as an argument; this will generate
    the Java-based client bindings.


    +   3. Using an Ant script, compile the generated source files with a stub client,
    which invokes the services from the ACME Web services.


    +   4. Test the client execution.


    Let''s take a closer look at the details of demonstrating the previous steps.


    # Setting up the Axis Environment


    Install the Apache download and create a shell/batch script to set up the CLASSP
    environment, including all the provided Axis libraries.


    # Generating the Java Proxies


    Create a directory named ACMEClient and run the WSDL2Java utility with the WSDL
    URI of ACMEWebService as an argument.


    For example, you may execute the following command line:


    ```

    java org.apache.axis.wsdl.WSDL2Java \ \

    http://namesh:7001/acme_service/ACMEWebService?WSDL

    ```


    This will generate a package named localhost that includes a list of client classes
    as follows:


    ![](img/386c9660607eea1159d16febe1f732ac_116_0.png)'
