    **Figure 10.** Web services operational model, showing roles and relationships

    These roles and relationships are defined as follows:


    +   - **Service provider.** The service provider is responsible for developing
    and deploying the Web services. The provider also defines the services and publishes
    them with the service broker.

    - **Service broker.** The service broker (also commonly referred to as a service
    registry) is responsible for service registration and discovery of the Web services.
    The broker lists the various service types, descriptions, and locations of the
    services that help the service requesters find and subscribe to the required services.

    - **Service requestor.** The service requestor is responsible for the service
    invocation. The requestor locates the Web service using the service broker, invokes
    the required services, and executes it from the service provider.


