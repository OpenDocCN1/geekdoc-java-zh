    In the following sections, XML validation will be used to constrain XML data.
    We will see how to use XML validation with JAXP and XML data binding using Castor.
    Parsing of the data is an essential mechanism for interpreting the tags and elements
    that compose an XML data structure. There have been many vendor implementations
    that enable the parsing of XML, but one major factor was lacking: the standardization
    of XML processing. This is how Java APIs for XML processing and binding were born—these
    standards are also known as JAXP and JAXB. These two standards provide a standardized
    and vendor-neutral approach for XML processing. The following sections describe
    the two standards by going through the APIs and examples.


    # 5.2 JAVA API FOR XML PROCESSING (JAXP)


    Now that we have seen an overview of XML, we can begin looking at the various
    APIs available for the processing of XML. The process in which the XML is interpreted
    is called parsing and where various templates are applied to XML to produce a
    different output is called trans-formation. The API that embraces both of these
    is called Java API for XML Processing, JAXP. JAXP also is an integral part of
    JWSDP and it facilitates the role of XML processing in Java Web services.


    ![](img/386c9660607eea1159d16febe1f732ac_212_0.png)


    Keyword

    structure is a data organization, management, and storage format that enables
    efficient access and modification.


