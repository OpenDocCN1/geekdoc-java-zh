    Engine) for the .NET Framework. CLR enables applications to install and execute
    code, and provides services such as memory management, including garbage collection,
    threading, exception handling, deployment support, application runtime security,
    versioning, and so on.


    CLR provides a set of JIT (just-in-time) compilers, which compile MSIL to produce
    native code to the target system. CLR defines a set of rules as Common Type System
    (CTS) and Common Language System (CLS) that specifies the .NET-supported languages
    required for developing compilers supporting a .NET platform. This enables the
    compiler


