  md: '# Java Web Services


    Most SOAP implementations provide their own serialization and deserialization
    mechanisms and a predefined XML Schema supporting the SOAP encoding rules and
    mapping application-specific data types. These serializers and deserializers supporting
    SOAP encoding rules provide the encoding and decoding of data on runtime mapping
    XML elements to target objects and vice versa. It leverages interoperability between
    disparate applications using SOAP messages.


    We will study the serializers and deserializers of a SOAP implementation in the
    example illustration using Apache Axis discussed in the structure titled Axis
    Infrastructure and Components. So far we discussed the structure of a SOAP message
    and the representation of its data types. Now, let''s take a look at how to exchange
    SOAP messages using SOAP communication.


    # SOAP MESSAGE EXCHANGE MODEL


    Basically, SOAP is a stateless protocol by nature and provides a composable one-way
    messaging framework for transferring XML between SOAP applications which are referred
    to as SOAP nodes. These SOAP nodes represent the logical entities of a SOAP message
    path to perform routing or processing. In a SOAP message, nodes are usually represented
    with an endpoint URI as the next destination in the message. In a SOAP message,
    a SOAP node can be one of the following:


    +   - SOAP sender. The one who generates and sends the message.

    - SOAP receiver. The one who ultimately receives and processes the message with
    a SOAP response, message, or fault.

    - SOAP intermediary. The one who can play the role of a SOAP sender or SOAP receiver.
    In a SOAP message exchange there can be zero or more SOAP intermediaries between
    the SOAP sender and receiver to provide a distributed processing mechanism for
    SOAP messages.


    Figure 2 represents a basic message exchange model with different SOAP nodes.

    In a SOAP exchange model, the SOAP message passes from the initiator to the final
    destination by passing through to intermediaries. In a SOAP messaging path, the
    SOAP intermediaries represent certain functionalities and provide routing to the
    next destination. It is important to note that SOAP does not define the actual
    SOAP senders, intermediaries, and receivers of the SOAP message along its message
    path or order of destination. However, SOAP can indicate which part of the message
    is meant for processing at a SOAP node. Thus, it defines a decentralized message-exchanging
    model that enables a distributed processing in the message route with a message
    chain.


    ![](img/386c9660607eea1159d16febe1f732ac_153_0.png)'
