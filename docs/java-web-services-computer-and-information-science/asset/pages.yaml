    The emergence of the WS-I initiative, which is examined in the next section, will
    address these issues as part of its goals.


    # 4.5 THE WS-I INITIATIVE AND ITS GOALS


    The Web Services Interoperability Organization, or WS-I, started as an industry
    initiative by IBM and Microsoft, along with a handful of Web services platform
    and application vendors. The ultimate goal of WS-I is to promote interoperability
    in Web services implementations across platforms, applications, programming languages,
    and devices. At the time of this book''s writing, WS-I is in the very early stage
    of defining its goals and planning its deliverables.


    As part of its deliverable plan, WS-I is planning to introduce the concept of
    WS-I profiles to address the interoperability issues on compatibility problems
    due to specification versions, dependencies, and requirements. The concept of
    the WS-I profiles focuses on the Web services applications interoperability to
    conform their compliance on specifications and its support to profiles.


    For example, the basic WS-I profile addresses the specifications listed in Table
    1.


    Table 1. WS-I Basic Profile


    | SPECIFICATIONS | VERSION |

    |---|--|

    | XML Schema | XML Schema 1.0 |

    | SOAP | SOAP 1.1 |

    | WSDL | WSDL 1.1 |

    | UDDI | UDDI 1.0 |


    At the time of this book''s writing, WS-I is working on developing WS-I profiles
    on the evolving Web services specifications and its associated W3C standards.


