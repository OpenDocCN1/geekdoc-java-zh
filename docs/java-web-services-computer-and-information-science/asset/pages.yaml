  md: '# Java Web Services


    # SUMMARY


    +   Web service is a standardized medium to propagate communication between the
    client and server applications on the World Wide Web. A web service is a software
    module that is designed to perform a certain set of tasks.


    +   The Internet has revolutionized our business by providing an information highway,
    which acts as a new form of communication backbone. This new information medium
    shifted business from the traditional brick-and-mortar infrastructures to a virtual
    world where they can serve customers not just the regular eight hours, but round-the-clock
    and around the world.


    +   Distributing Computing is a type of computing in different components and
    objects comprising an application can be located on different computers connected
    to a network


    +   The Common Object Request Broker Architecture (CORBA) is an industry wide,
    open standard initiative, developed by the Object Management Group (OMG) for enabling
    distributed computing that supports a wide range of application environments.
    OMG is a non-profit consortium responsible for the production and maintenance
    of framework specifications for distributed and interoperable object-oriented
    systems.


    +   The Object Request Broker (ORB) is an object bus that provides a transparent
    mechanism for sending requests and receiving responses to and from objects, regardless
    of the environment and location.


    +   The Microsoft Component Object Model (COM) provides a way for Windows-based
    software to communicate with each other by defining a binary and network standard
    in a Windows operating environment.


    +   Message-Oriented Middleware (MOM) is based upon a loosely coupled asynchronous
    communication model where the application client does not need to know its application
    recipients or its method arguments. These Web-based B2B communications have been
    around for some time. Using on custom and proprietary technologies which are meant
    for exchanging data and doing transactions over the Web.


    +   Simple Object Access Protocol, or SOAP, is a standard for a lightweight XML-messaging
    protocol. It enables an exchange of information between two or more peers and
    enables them to communicate with each other in a decentralized, distributed application
    environment.


    +   The Services Definition Language (WSDL) is an XML format for describing the
    network services and its access information. It defines a binding mechanism used
    to attach a protocol, data format, an abstract message, or set of endpoints defining
    the location of services.


    ![](img/386c9660607eea1159d16febe1f732ac_49_0.png)'
