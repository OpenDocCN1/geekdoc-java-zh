  md: "# Document Type Definition\n\nA Document Type Definition (DTD)—commonly known\
    \ as DOYPE—is a document containing the element restrictions of an XML data document\
    \ must follow in order to be considered valid. A DTD can be defined within the\
    \ XML document or saved in an external file with a .dtd extension.\n\nXML elements\
    \ are declared with an element declaration using the syntax:\n\n```\n<!ELEMENT\
    \ element-name (element-content)>\n```\n\nElement-name is the XML element definition.\
    \ Element-content defines the type of elements. It defines whether the element\
    \ is a data type or a com-pound type consisting of other elements and data. Various\
    \ element types can be defined in an element, among which the following:\n\n+\
    \   - EMPTY. Empty tag.\n- #CDATA. Character data; should not be parsed by the\
    \ XML parser.\n- #PCDATA. Parsed character data; parsed by the XML parser. If\
    \ elements are declared in #PCDATA, then elements also must be defined.\n- ANY.\
    \ Any content.\n\nIf a DTD is defined inside the XML, the declaration is included\
    \ in the DOCTYPE construct. The following examples show how to define DTDs in\
    \ both internal and external ways. These examples demonstrate how to define an\
    \ element Product children sequences of Id and Price:\n\n```\n<xml version=\"\
    1.0\"?>\n<!DOCTYPE Product [\n  <!ELEMENT Product (Id,Price)>\n  <!ELEMENT Id\
    \ (#PCDATA)>\n  <!ELEMENT Price (#PCDATA)>\n]\n<Product>\n  <Id>3124090231</Id>\n\
    \  <Price>49.99</Price>\n</Product>\n```\n\nThe following example is an equivalent\
    \ DTD, but it is defined in an external file called Product.dtd:"
