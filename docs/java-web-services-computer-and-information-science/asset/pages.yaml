  md: "# Defining the Remote Interface (Service Definition)\n\nThe service interface\
    \ defines the set of exposed methods that can be invoked by the service requester\
    \ clients. In JAX-RPC, it is referred to as Service Definition. The client stubs\
    \ and server ties are generated based on this interface. From a programming model's\
    \ standpoint, the programming rules involved in defining the remote interface\
    \ are as follows:\n\n+   - The remote interface of the service definition must\
    \ be declared as public.\n- The remote interface must extend the java.rmi.Remote\
    \ interface and all of the methods must throw a java.rmi.RemoteException.\n- The\
    \ remote interface must not contain any declaration as static constants.\n\nAll\
    \ of the parameters and return values of the methods must be sub-ported as part\
    \ of JAX-RPC-supported data types. In case of unsupported data types, it is required\
    \ to use custom serializers and deserializers to facilitate Java-to-XML and XML-to-Java\
    \ mappings.\n\n```\nFor example\nThe following is a code listing that defines\
    \ a remote interface-of a service definition (BookPriceIF.java):\n```java\nimport\
    \ java.rmi.Remote;\nimport java.rmi.RemoteException;\n\npublic interface BookPriceIF\
