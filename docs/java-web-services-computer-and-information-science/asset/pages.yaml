    So far, we have looked at the SOAP message exchange model and the different roles
    involved in a SOAP message path. Now, let''s take a look at the SOAP communication
    and the supported message flow patterns.


    # 3.5 SOAP COMMUNICATION


    SOAP is designed to communicate between applications independent of the underlying
    platforms and programming languages. SOAP supports the following two types of
    communication models:


    +   - SOAP RPC. It defines a remote procedural call-based synchronous communication
    where the SOAP nodes send and receive messages using request and response methods
    and parameters and return the values.

    - SOAP Messaging. It defines a document-driven communication where SOAP nodes
    send and receive XML-based documents using synchronous and asynchronous messaging.


    Now, let''s explore the details of both the communication model and how it is
    represented in the SOAP messages.


    # 3.5.1 SOAP RPC


    The SOAP RPC representation defines a tightly coupled communication model based
    on requests and responses. Using RPC conventions, the SOAP message is represented
    by method names with zero or more parameters and return values. Each SOAP request
    message represents a call to a remote object in a SOAP server and each method
    call will have zero or more parameters. Similarly, the SOAP response message will
    return the results as return values with zero or more out parameters. In both
    SOAP RPC requests and responses, the method calls are serialized into XML-based
    data types defined by the SOAP encoding rules.


    ![](img/386c9660607eea1159d16febe1f732ac_156_0.png)'
