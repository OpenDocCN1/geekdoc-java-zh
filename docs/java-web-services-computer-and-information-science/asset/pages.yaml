    # 1.2.6 Other Industry Standards Supporting Web Services


    Many industry initiatives and standards supporting Web services are currently
    available and many more will be available in the future. The most prominent initiatives
    to embrace Web services standards are described in the following sections.


    # Web Services Choreography Interface (WSCI)


    The Web Services Choreography Interface, or WSCI, is an initiative from Sun Microsystems,
    BEA, Intia, and SAP that defines the flow of messages exchanged in a particular
    process of Web services communication. It describes the collective message flow
    among Web services during the interactions that occur between Web services communication.
    This facilitates the bridging of business processes and Web services enabling
    Web services to be part of the business processes of an organization or spanning
    multiple organizations.


    # Web Services Flow Language (WSFL)


    The Web Services Flow Language, or WSFL, is an XML-based language initiative from
    IBM for describing Web services compositions. These compositions are categorized
    as flow models and global models. Flow models can be used for modeling business
    processes or workflows based on Web services, and global models can be used for
    modeling links between Web services interfaces that enable the interaction of
    one Web service with an operation to another Web service interface. Using WSFL
    compositions support a wide range of interaction patterns between the partners
    participating in a business process, especially hierarchical interactions and
    peer-to-peer interaction between partners.


    ![](img/386c9660607eea1159d16febe1f732ac_41_0.png)'
  merge: -1
  pgno: 41
- img_proc: true
  md: '# Evolution and Emergence of Web Services 27


    # Directory Services Markup Language (DSML)


    The Directory Services Markup Language, or DSML, defines an XML schema for representing
    directory structural information as an XML document, and it allows the publishing
    and sharing of directory information via Internet protocols HTTP, SMTP, and so
    forth. DSML does not define the attributes for the directory structure or for
    accessing the information. A DSML document defines the directory entries or a
    directory schema or it can be used on top of any industry directory protocols
    like LDAP. DSML defines the standard for exchanging information between different
    directory services and enables interoperability between them. Bowstreet originally
    proposed DSML as a standard and it received support from leading vendors like
    IBM, Oracle, Sun Microsystems, Microsoft, and so on.


    # XLANG


    Similar to WSFL, XLANG defines an XML-based standard specification for defining
    business process flows in Web services. It also defines a notation for expressing
    actions and complex operations in Web services. Microsoft developed the XLANG
    specification and it has been implemented in Microsoft BizTalk server 2000, especially
    for handling Enterprise Application Integration (EAI) and B2B communication.


    # Business Transaction Protocol (BTP)


    The Business Transaction Protocol (BTP) specification provides a support for Web
    services-based distributed transactions enabling the underlying transaction managers
    to provide the flexibility of handling HA-compliant, two-phase commit transaction
    engines. BTP is an OASIS initiative that facilitates large-scale business-to-business
    (B2B) deployments enabling distributed transactions in Web services.


    # XML Encryption (XML ENC)


    The XML Encryption, or XML ENC, is an XML-based standard for securing data by
    encryption using XML representations. In Web services, it secures the exchange
    of data between the communicating partners.


    # XML Key Management System (XKMS)


    The XML Key Management System, or XKMS, is an XML-based standard for integrating
    public key infrastructure (PKI) and digital certificates for securing Internet
    transactions, especially those used in Web services. XKMS consists of two parts:
    the XML Key Information Service Specification (X-KISS) and the XML Key Registration
    Service Specification (X-KRSS). The X-KISS specification defines a protocol for
    a trust


    ![](img/386c9660607eea1159d16febe1f732ac_42_0.png)'
  merge: -1
  pgno: 42
- img_proc: true
  md: '# 28 Java Web Services


    service that resolves public key information contained in XML-SIG elements. The
    X-KRSS describes how public key information is registered.


    # XML Signature (XML DSIG)


    The XML Encryption, or XML DSIG, is an XML-based standard for specifying XML syntax
    and processing rules for creating and representing digital signatures. In Web
    services, an XML digital signature helps XML-based transactions by adding authentication,
    data integrity, and support for non-repudiation to the data during exchange among
    the communicating partners.


    # Extensible Access Control Markup Language (XACML)


    The Extensible Access Control Markup Language, or XACML, is an XML-based standard
    for specifying policies and rules for accessing information over Web-based resources.
    In Web services, XACML sets the rules and permissions on resources shared among
    the communicating partners. XACML is one of the security initiatives made by OASIS
    security services technical committee.


    # Security Assertions Markup Language (SAML)


    The Security Assertions Markup Language, or SAML, defines an XML-based framework
    for exchanging authentication and authorization information. SAML uses a generic
    protocol consisting of XML-based request and response formats, and it can be bound
    to many communication models and transport protocols. One of the key objectives
    of SAML is to provide and achieve single sign-on for applications participating
    in Web services. SAML is an initiative from the security services technical committee
    of OASIS.


    # 1.2.7 Known Challenges in Web Services


    Web services present some key challenges associated with the mission-critical
    business requirements. These challenges need to be addressed before the services
    are fully implemented. Some of the key challenges are as follows:


    +   - Distributed transactions. With heterogeneous resources, it should be studied
    and tested with standard solutions based on BTP; WS-Transactions, and WS-Coordination.

    - Quality of Service (QoS). In case of a mission-critical solution, the service
    providers must examine the reliability and performance of the service in peak
    load and uncertain conditions for high availability.


