- img_proc: true
  md: 'In general, SOAP intermediaries enable a distributed processing model to exist
    within the SOAP message exchange model. By using SOAP intermediaries, features
    can be incorporated like store and forward, intelligent routing, transactions,
    security, and logging, as well as other value additions to SOAP applications.


    # 3.4.2 SOAP Actor


    In a SOAP message to represent a target SOAP node, the SOAP actor global attribute
    with a URI value can be used in the Header element. SOAP defines an actor with
    a URI value, which identifies the name of the SOAP receiver node as an ultimate
    destination. Listing 22 is an example of a SOAP actor attribute.


    ```

