  md: '# Java Web Services


    SunPlanet also released their Web services capabilities, adopting a Java platform
    and supporting Java APIs for Web services as per JWSDP.


    JWSDP 1.0 provides a one-stop Java API solution for building Web services using
    a Java platform. The key API components include the following:


    +   - Java API for XML Messaging (JAXM)

    - Java API for XML Processing (JAXP)

    - Java API for XML Registries (JAXR)

    - Java API for XML Binding (JAXB)

    - Java API for XML-Based RPC (JAX-RPC)

    - Java WSDP Registry Server (JWSDP)

    - Java Server Pages Standard Tag Library (JSTL)


    # Exposing J2EE Components as Web Services


    This section explores the J2EE environment and the Web services techniques available
    for leveraging J2EE components as Web services. The J2EE environment delivers
    platform-independent component-based applications providing a multi-tiered distributed
    application model with several advantages like security, scalability, administration
    tools, portability between vendor implementations, and reliability of deployed
    applications. In general, it defines the following components residing in logical
    tiers:


    +   - JavaServer Pages (JSP) and Java Servlet-based components as Web components
    running on the Web/Server container of the J2EE server.

    - Enterprise JavaBeans (EJB)-based components as business or persistence components
    running on the EJB container of the J2EE server.

    - JDBC (Java Database connectivity) and J2 connector architecturebased components
    as the integration of the J2EE server for integrating database applications and
    enterprise information systems.


    The key differences between J2EE components and traditional Java applications
    is that J2EE components are assembled and deployed into a J2EE application server
    in compliance with the J2EE specification. These components are managed by J2EE
    server system services such as synchronization, multithreading, and connection
    pooling. Additionally, the J2EE server implementation provides capabilities like
    clustering, transaction coordination, messaging, and database connection pooling.
    J2EE components as Web services provide robust Web services-based applications
    by fully utilizing the potential of J2EE application serverdeployed components
    and standards-based communication provided by the Web services container.


    ![](img/386c9660607eea1159d16febe1f732ac_71_0.png)'
  merge: -1
  pgno: 71
- img_proc: true
  md: '# Web Services Architecture


    In short, developing Web services from J2EE-based applications requires the implementation
    of components using J2EE component APIs (such as EJBs and servlets), then packaging
    and deploying them in a J2EE container as their enterprise applications. The components
    are then hosted in a J2EE-compliant application server. Exposing these J2EE components
    as Web services also requires a Web services environment, which enables the creation
    and deployment of SOAP-based proxy interfaces. In a typical scenario, exposing
    a J2EE-based application component as Web services involves the steps in the following
    list:


    Steps for the Service Provider


    +   1. The potential J2EE component deployed in an application server environment
    will be encapsulated as a service-oriented interface using SOAP and deployed in
    a Web services runtime environment.

    2. WSDL-based service descriptions are generated and then reside in the services
    runtime environment. The service requester creates SOAP-based client interfaces
    using the WSDL-based descriptions.

    3. Using registry APIs, WSDLs are used for publishing the services in a public/private
    UDDI registry.


    Steps for the Service Requestor


    +   - The service requester clients create SOAP-based client interfaces using
    the WSDL-based descriptions exposed by the service provider.

    - The service requester may choose to use any language for implementing the client
    interfaces, but it must ensure the use of SOAP for communication.

    - These client interfaces then are used to invoke the service providerdeployed
    services.


    At this time of writing, most J2EE application servers are developing their Web
    services runtime environment as a service container for a J2EE environment; most
    of them already made their beta available. The upcoming release of J2EE 1.4 and
    EJB 2.1 specifications focuses on Web services.


    Now, let''s take a look at the full-featured implementation of a real-world example
    of exposing J2EE components as Web services.


