    # 4.4 CHALLENGES IN CREATING WEB SERVICES INTEROPERABILITY


    As of today, more than 50 Web services platforms, including SOAP implementations,
    are available to provide Web services support for a variety of languages, APIs,
    applications, and systems. But not all of the services exposed from these SOAP
    implementations are guaranteed to interoperate and run across disparate applications
    and systems. Most interoperability problems occur in RPC-based Web services because
    of the type mapping issues between the service provider and requester, which are
    due to the lack of type mapping support in SOAP processing. In Messaging-based
    Web services, this is


