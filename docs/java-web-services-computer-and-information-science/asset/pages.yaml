  md: '# 6.1.2 JAXM Messaging: Interaction Patterns


    As per the JAXM 1.1 specifications, all JAXM provider implementations must provide
    and facilitate the following message interaction patterns:


    +   **Asynchronous inquiry.** In this pattern, a message producer application
    sends a message and does not wait for a response from the message consumer. The
    message consumer processes the message and returns a response as a new operation.
    That is, the process of both sending and receiving the messages occurs in two
    separate operations.

    * **Asynchronous update with acknowledgment.** The message consumer acknowledges
    the receipt of the message to the provider or its message sender. This acknowledgment
    depends on the implementation of the provider.

    * **Synchronous inquiry.** Synchronous inquiries are typical for request/response-based
    communication: The message sender waits for a response after sending a message
    to the receiver using the same connection.

    * **Synchronous update.** Like the asynchronous update, in a synchronous update
    after sending the initial request, the message''s sender waits for a response
    as an acknowledgement that the message was sent.

    * **Fire and forget.** The message sender does not wait or anticipate a response
    from the message receiver.


    Now, let''s explore the previous JAXM features and how they are represented in
    the JAXM programming model.


