  md: '# SUMMARY


    +   The Web services architecture represents the logical evolution of traditional
    computer-based applications over the Internet. It defines a distributed computing
    mechanism by adopting a service-oriented architecture SOA, where all of the applications
    are encapsulated as services and made available for invocation over a network.


    +   The Simple Object Access Protocol, or SOAP, plays the role of the messaging
    protocol for exchanging information between the service provider and the service
    requestor.


    +   The Web Services Description Language, or WDDL, is an XML schema-based specification
    for describing Web services as a collection of operations and data input/output
    parameters as messages.


    +   Universal Description, Discovery, and Integration, or UDDI, defines a mechanism
    to register and categorize Web services in a general-purpose registry that users
    communicate in order to discover and locate registered services.


    +   ebXML provides a standard framework for building an electronic marketplace
    by enabling the standardization of business processes, business partner profiles,
    and partner agreements.


    +   In Web services architecture, depending upon the functional requirements,
    it is possible to implement the models with RPC-based synchronous or messaging-based
    synchronous/asynchronous communication models. These communication models need
    to be understood before Web services are designed and implemented.


    +   The RPC-based communication model defines a request/response-based synchronous
    communication. When the client requests a service, the client waits until a response
    is sent back from the server before continuing any operation.


    +   The messaging-based communication model defines a loosely coupled and document-driven
    communication. The service requestor invoking a messaging-based service provider
    does not wait for a response.


    +   Web services are generally driven using a Web-enabled application environment
    for HTTP communication. Because of that fact, in most cases the J2EE-based Web
    services environment plays a vital role as a service enabler for deploying Java
    and J2EE components as Web services.'
