  md: '# SUMMARY


    +   JAXM is an integral part of the JWSDP, which provides synchronous and asynchronous
    messaging capabilities in the Web services environment and enables the messaging
    of XML documents over the intranet or Internet.


    +   JAXM is an API framework based on the messaging protocols defined by the SOAP
    1.1 specifications and SOAP attachments. JAXM uses a standard messaging provider
    infrastructure and Java-based APIs to facilitate the sending and receiving of
    XML-based messages asynchronously in a Web services environment and supporting
    Web services standards and protocols.


    +   JAXM provides the notion of messaging profiles, which enable messaging protocols
    to be implemented over SOAP messaging.


    +   JAXM-based applications (senders and receivers) can be deployed in Java servlet
    2.2- or JEE 1.3-client server providers. JAXM runs as an asynchronous application
    and executes methods using messaging from the provider. JAXM applications running
    without providers can run standalone clients, exchanging messages as requests
    and responses with another JAXM/SOAP1.1-compliant application.


    +   JAXM clients are JAXM-based application components that send and receive JAXM
    messages. The JAXM clients (senders and receivers) can run using a JAXM provider
    or without a provider. JAXM clients using a provider connection can send and receive
    messages asynchronously as one-way transmissions.


    +   JAXM messages are XML documents based on SOAP standards and conventions that
    define the basic message-for-mat during a JAXM communication. The SAAJ 1.1 API
    provides the low-level Java APIs for constructing SOAP 1.1-compliant XML messages
    (with or without attachments).


    +   JAXM connections are a set of pre-configured JAXM client connections to a
    JAXM provider or a SOAP implementation. The JAXM clients send and receive messages
    using these connections. A JAXM connection using a provider is quite similar to
    a connection to a message-oriented middleware.


    +   JAXM messaging profiles provide the flexibility to use messaging protocols
    implemented over SOAP messaging.


    +   The JAXM administration console enables the configuration of JAXM provider-specific
    properties such as a number of retries for message delivery, retry intervals,
    logging, and so forth.


    +   The JAXM provider is a JAXM-compliant messaging infrastructure that implements
    the JAXM API interfaces and classes. It facilitates the transmission and routing
    of JAXM messages.


    ![](img/386c9660607eea1159d16febe1f732ac_258_0.png)'
