    #  1.1.5 Java RMI


    Java RMI was developed by Sun Microsystems as the standard mechanism to enable
    distributed Java objects-based application development using the Java environment.
    RMI provides a distributed Java application environment by calling remote objects
    and passing them as arguments or return values. It uses Java serialization – a
    lightweight object persistence technique that allows the conversion of objects
    into streams.


    Before RMI, the only way to do inter-process communications in the Java platform
    was to use the Standard network libraries. Though the java.net APIs provided sophisticated
    support for network functionalities, they were not intended to support or solve
    the distributed computing challenges. Java RMI uses Remote Method Protocol (JRMP)
    as the interprocess communication protocol, enabling Java objects living in different
    Java Virtual Machines (VMs) to transparently invoke another''s methods. Because
    these VMs can be running on different computers anywhere on the network, RMI enables
    object-oriented distributed computing. RMI also uses a reference-counting garbage
    collection mechanism that keeps track of external object references to remote
    objects (live connections) using the virtual machine. When an object is found
    unreferenced, it is considered to be a weak reference and it will be garbage collected


    In RMI-based application architectures, a registry (rmireistry) provides a simple
    non-persistent naming lookup service that is used to store the remote object references
    and to enable lookups from client applications. The RMI infrastructure based on
    the JRMP acts as the medium between the RMI clients and remote objects. It intercepts
    client requests, passes invocation arguments, delegates invocation requests to
    the RMI skeleton, and finally passes the return


