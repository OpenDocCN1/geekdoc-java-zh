    # 5.2.3 JAXP API Model


    The JAXP API model is quite easy to understand and simple to use. The parsing
    classes and interfaces are packaged under the java.xml.parsers package and sit
    on top of existing SAX or DOM APIs. Transformation classes and interfaces are
    packaged in java.xml. transform and provide utilities for performing XSLT transformations.
    Something really important to understand about JAXP is that it ships with Sun’s
    Crimson parser, which is the reference implementation of the JAXP parser. The
    parser implementation is packaged in parser.jar with package-name com.sun.xml.parser,
    which is not part of the JAXP specifications. Developers have the tendency to
    refer to the com.sun.xml parser package as JAXP. The use of this package also
    misuses the concept of JAXP by bypassing the high-level interfaces by calling
    the JAXP directly.


    Table 4 is a listing of classes and interfaces of the JAXP package (java.xml.parsers.*
    and java.xml.transform.*'
