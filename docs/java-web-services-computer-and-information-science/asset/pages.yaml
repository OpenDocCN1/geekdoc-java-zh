    # 1.2.5 Core Web Services Standards


    The five core Web services standards and technologies for building and enabling
    Web services are XML, SOAP, WSDL, UDDI, and eXML. An overview of each is presented
    in the following sections.


    # Extensible Markup Language (XML)


    In February 1998, the World Wide Web Consortium (W3C) officially endorsed the
    Extensible Markup Language (XML) as a standard data format. XML uses Unicode,
    and it is structured self-describing neutral data that can be stored as a simple
    text document for representing complex data and to make it readable. Today, XML
    is the de facto facto standard.


    ![](img/386c9660607eea1159d16febe1f732ac_38_1.png)'
