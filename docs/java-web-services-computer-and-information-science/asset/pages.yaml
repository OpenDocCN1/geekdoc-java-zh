  md: '# Java Web Services


    In a UNIX environment:


    ```

    xrpc -classpath $CLASPATH -keep -both -d build/classes serviceconfig.xml

    ```


    In this command, the option -classpath refers to the CLASPATH, including the service
    interface and implementation classes and JAX-RPC libraries; -keep refers to saving
    the generated source files (java) and the WSDL documents; -both refers to the
    generating of the stubs and tie classes; and -nd refers to the destination directory.
    To find more xrpc options, refer to the JAX-RPC implementation documentation for
    syntax and usage information.


    As a result, the preceding command generates the:


    +   - Client-side stubs and server-side classes

    - Serialization and deserialization classes representing the data-type mappings
    between Java primitives and XML data types

    - A WSDL document

    - Property files associated with the service


    # Packaging and Deployment


    According to JWSDP 1.0, JAX-RPC-based services are specified with only servlet-based
    service endpoints and the JAX-RPC services are required to be deployed as a servlet
    in a Java servlet 2.2-based container. This mandates that the JAX-RPC-based services
    are packaged as a Web application (WAR). To package a JAX-RPC service as a Web
    application, we need to create a WAR file that includes the following classes
    and other configuration files:


    +   - Remote interface of the service

    - Service implementation of the remote classes

    - Serializer and deserializer classes

    - Server-side (tie) classes created by xrpc

    - Property files created by xrpc

    - Other supporting classes required by the service implementation

    - WSDL document describing the service

    - Web application deployment descriptor (web.xml)


    Except for the deployment descriptor, we have seen the process required for creating
    those classes and property files using xrpc.


    ![](img/386c9660607eea1159d16febe1f732ac_273_0.png)'
