  md: '# PREFACE


    Java is the name for both the programming language that can be used for building
    complex web applications and for the software platform that used this programming
    language as its most essential component. It is widely used by development companies
    to build secure, robust and scalable applications. Web service is a standardized
    medium to propagate communication between the client and server applications on
    the World Wide Web. Web services emerged to lower the barriers to application
    integration, by making it easier to discover, access and use remote applications
    and data, in ways that overcome some important costs and limitations usually implied
    in building interoperability services. This book will help understand some jargon
    related to Java web services.


    # Organization of the Book


    This book is an introduction to a variety of new technologies, approaches, and
    ideas for writing web-based applications to take advantage of the Java web services
    architecture. The book will cover the entire spectrum from the promise of cloud
    computing to the grid of XML content. Students will gain practical, hands-on experience
    with implementations of the Java XML and web service APIs including JAXP, JAXB,
    JAX-WS 2.0, WSEE, and XWSS.


    Chapter 1 is an introduction to evolution and emergence of web services. It presents
    the concepts of Web services, especially focusing on the definition of Web services,
    the standards and technologies that the services use, and the benefits of using
    these services.


    Chapter 2 presents a focus on web services architecture and its core building
    blocks. The web services communication models are also given. You will also know
    the developing web services-enabled applications.'
