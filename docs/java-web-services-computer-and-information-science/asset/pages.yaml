    implementation), the JAXM administration console can be accessed through a Web
    browser at http://localhost:8081/jaxm-provideradmin/index.jsp.


    +   - JAXM provider. The JAXM is a JAXM-compliant messaging infrastructure that
    implements the JAXM API interfaces and classes. It facilitates the transmission
    and routing of JAXM messages. When there is a transmission failure, the provider
    takes the responsibility of resending it. The provider also facilitates other
    reliability requirements like message persistence, acknowledgement, and so on.
    The JAXM infrastructure providers are required to be in compliance with SOAP 1.1
    specifications and its supported transport protocols, enabling messaging interoperability
    with non-JAXM clients with SOAP 1.1 compliance. A provider can be set up and configured
    as part of a Java servlet 2.2-compliant Web container or J2EE 1.3-compliant application
    server. To send and receive messages, the JAXM client establishes a connection
    with the provider. The provider tracks the sending and receiving of messages,
    ensuring guaranteed message delivery as defined by the messaging protocol. The
    JAXM provider uses profiles to support the messaging protocols implemented over
    SOAP 1.1. The JAXM 1.1 RI currently provides messaging profiles for SOAP-RP and
    ebXML.


    3G E-LEARNING'
