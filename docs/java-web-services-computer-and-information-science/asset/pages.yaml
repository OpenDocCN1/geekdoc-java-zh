  md: '# SUMMARY


    +   - JAX-RPC is an integral part of the JWSDP. In a JWSDP

    JAX-RPC is an integral part of the JWSDP. In a JWSDP-based Web services

    environment, JAX-RPC provides XML-based RPC functionality between the

    service requestors and the service provider.


    +   - JAX-RPC is quite typical to Java Remote Method Invocation (RMI), which

    handles RPC mechanisms by passing serialized Java objects between Java

    applications in a distributed computing environment; whereas JAX-RPC uses

    SOAP-based RPC and WSDL mechanisms to invoke Web services running

    heterogeneous environments.


    +   - JAX-RPC defines an API framework and runtime environment for creating

    and executing XML-based remote procedural calls. The Web service requestors

    inoke the service provider’s methods and transmit parameters and they receive

    return values as XML-based requests and responses.


    +   - The service interface defines the set of exposed methods that can be invoked

    by the service requestor clients.


    +   - According to JWSDP 1.0, JAX-RPC-based services are specified with only

    servlet-based service endpoints and the JAX-RPC services are required to be

    deployed as a servlet in a Java servlet 2.2-based container. This mandates the

    JAX-RPC-based services are packaged as a Web application (WAR).


    +   - The JAX-RPC 1.0 client-side APIs are defined in a single package structure
    as

    avax.xml.rpc, which provides a set of interfaces and classes that support the

    JAX-RPC clients intending to invoke RPC-based services, and the JAX-RPC

    runtime implements them.


    +   - A stub-based model is the simplest client-programming model. This model

    uses the local stub classes generated by the xrpcc tool.


