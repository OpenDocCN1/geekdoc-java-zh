    # 1.2.2 Motivation and Characteristics


    Web-based B2B communication has been around for some time time. These Web-based
    B2B solutions are usually based on custom and proprietary technologies and are
    meant for exchanging data and doing transactions over the Web.


    However, B2B has its own challenges. For example, in B2B communication, connecting
    new or existing applications and adding new business partners have always been
    a challenge.


    Due to this fact, in some cases the scalability of the underlying business applications
    is affected. Ideally, the business applications and information from a partner
    organization should be able to interact with the application of the potential
    partners seamlessly without redefining the system or its resources. To meet these
    challenges, it is clearly evident that there is a need for standard protocols
    and data formatting for enabling seamless and scalable B2B applications and services.
    Web services provide the solution


