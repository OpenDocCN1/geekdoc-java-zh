  md: '# 5.2.1 JAXP


    In the last couple of years, XML parsing has been standardized to two distinct
    processing models: Simple API for XML (SAX) and Document Object Model (DOM). These
    two standards address parsing needs by providing APIs that enable developers to
    work with XML data. Many vendors have implemented their own specific parsers that
    address the most common parsing models of SAX and DOM. This led to API standardization
    complexities where applications using one specific vendor method calls to perform
    equivalent parsing tasks. In the case where the parsers needed to be swapped,
    developers had to rewrite the parsing code to adapt to the new specific vendor
    standard.


    To address these complexities, in late 1999, Sun Microsystems came with a draft
    of the Java API for XML Parsing (JAXP) 1.0 specification. The purpose of the specification
    was to provide a standard high-level API layer for abstracting lower-level details
    of XML parsing. The first version of JAXP (1.0) supported SAX 1.0 and DOM 1 parsing
    specifications. The feature set focused around parsing, which had a limitation
    that many complained about because it did not support for any XML transformation
    processing. The latest version of JAXP 1.1 supports SAX 2.0, SAX 2 extensions,
    and DOM level 2. It also includes transformation support based on eXtensible Stylesheet
    Language Transformations (XSLT) specification. The purpose behind JAXP is to provide
    an abstraction that parsing using SAX or DOM looks the same no matter what type
    of SAX or DOM is used by the application. This abstraction is referred to as pluggable
    interface.


    # 5.2.2 Uses for JAXP


    JAXP provides a pluggability layer, which enables developers to change parser
    implementations without affecting the application logic. One JAXP-compliant parser
    can be exchanged for another parser seamlessly, without much effort. JAXP provides
    a set of standard interfaces that encapsulate the details behind parser interactions.
    These interfaces act as abstractions that prevent the developer from working with
    XML directly. These abstractions are implementations of the SAX and DOM parsing
    standards and the XSLT transformation standard.


    ![](img/386c9660607eea1159d16febe1f732ac_213_0.png)


    ![](img/386c9660607eea1159d16febe1f732ac_213_1.png)'
  merge: -1
