  md: '# EVOLUTION AND EMERGENCE OF WEB SERVICES


    # CHAPTER 1


    Infrastructure web services had to happen.


    Jeff Bezos


    # LEARNING OBJECTIVES


    After studying this chapter, you will be able to:


    +   - Know the evolution of distributed computing

    - Learn about concepts of Web services


    # INTRODUCTION


    Web service is a standardized medium to propagate communication between the client
    and server applications on the World Wide Web. A web service is a software module
    that is designed to perform a certain set of tasks. The web services can be searched
    for over the network and can also be invoked accordingly.


    When invoked, the web service would be able to provide the functionality to the
    client, which invokes that web service.


    ![](img/386c9660607eea1159d16febe1f732ac_16_0.png)'
  merge: -1
  pgno: 16
- img_proc: true
  md: 'Introduces the reader to Web services by taking an evolutionary journey of
    distributed computing and the emergence of Web services, and then it devoting
    an exclusive overview on Web services, addressing its motivation, characteristics,
    industry standards and technologies, strategies and solutions, and in its benefits
    and limitations.


    The background of distributed computing and the evolution of Internet-enabled
    technologies is explored in the first section. Here, we will examine the definition
    and reasons for using distributed computing and the core distributed computing
    technologies.


    Next section presents the concepts of Web services, especially focusing on the
    definition of Web services, the standards and technologies that the services use,
    and the benefits of using these.


    # 1.1 EVOLUTION OF DISTRIBUTED COMPUTING


    The Internet has revolutionized our business by providing an information highway,
    which acts as a new form of communication backbone. This new information medium
    has shifted business from the traditional brick-and-mortar infrastructures to
    a virtual world where they can serve customers not just the regular hours, but
    round-the-clock and around the world.


    Additionally, it enhances our organizations with significant benefits in business
    productivity, cost savings, and customer satisfaction. As a result, modern organizations
    are compelled to re-evaluate their business models and plan on a business vision
    to interact with their customers, suppliers, resellers, and partners using an
    Internet-based technology space.


    To achieve this goal of obtaining an Internet business presence, organizations
    are exposing and distributing their business applications over the Internet by
    going through a series of technological innovations. The key phenomenon of enabling
    business applications over the Internet is based on a fundamental technology called
    distributed computing.


    ![](img/386c9660607eea1159d16febe1f732ac_17_0.png)'
  merge: -1
  pgno: 17
- img_proc: true
  md: '# Evolution and Emergence of Web Services


    Distributed computing has been popular within local area networks for many years,
    and it took a major step forward by adopting the Internet as its base platform
    and by supporting its open standard-based technologies.


    # 1.1.1 Distributed Computing


    In the early years of computing, mainframe-based applications were considered
    to be the best-fit solution for executing large-scale data processing applications.


    With the advent of personal computers (PCs), the concept of software programs
    running on standalone machines became much more popular in terms of the cost of
    ownership and the ease of use application.


    With the number of PC-based application programs running on independent machines
    growing, the communications between such application programs became extremely
    complex and added a growing challenge in the aspect of application-to-application
    interaction.


    ![](img/386c9660607eea1159d16febe1f732ac_18_0.png)


    The use of concurrent processes which communicate through message-passing has
    roots in operating system architectures studied in the 1960s. The first widespread
    distributed systems were local-area networks such as Ethernet, which was invented
