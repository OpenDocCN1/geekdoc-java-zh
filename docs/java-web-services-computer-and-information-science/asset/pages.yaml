    # 3.1.1 The Emergence of SOAP


    SOAP initially was developed by DevelopMentor, Inc., as a platformindependent
    protocol for accessing services, objects between applications, and using HTTP-based
    communication. SOAP used an XML-based vocabulary for representing RPC calls and
    their parameters and return. In 1999, the SOAP 1.0 specification was made publicly
    available as a joint effort supported by vendors RogueWave, IONA, ObjectSpace,
    Digital Creations, UserLand, Microsoft, and DevelopMentor. Later, the SOAP 1.1
    specification was released as a W3C Note with additions contributions from IBM
    and Lotus supporting a wide range of systems and communication models like RPC
    and Messaging. Nowadays, the current version of SOAP 1.2 is part of the W3C XML
    Protocol Working Group led by vendors such as Sun Microsystems, IBM, HP, BEA,
    Microsoft, and Oracle. At the time of this book’s writing, SOAP 1.2 is available
    as a public W3C working draft. To find out the current status of the SOAP specifications
    refer to the W3C Web site at www.w3c.org.


    > SOAP was designed as an access protocol and released as XML-RPC in 1998 as part
    of Frontier 5.1 by Dave Winer, Don Box, Bob Atkinson, and Mohsen Al-Ghese for
    Microsoft, where Atkinson and Al-Ghese were working.


    # 3.1.2 Understanding SOAP Specifications


    The SOAP 1.1 specifications define the following:


    +   - Syntax and semantics for representing XML documents as structured SOAP messages


