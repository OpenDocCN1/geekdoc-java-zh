  md: 'Data can also be parsed with non-JAXP parsers such as the underlying org.xml.sax
    Parser, but these approaches aren''t vendor-neutral. SAX 2.0 introduced the XMLReader,
    which is essentially a parser class that is wrapped by the SAXParser implementation.
    XMLReader is obtained by calling getXMLReader() from the XML-Parser.


    # Reading and Writing XML


    Reading and writing XML documents with SAX requires a parsing handler class (extended
    from DefaultHandler) to be implemented. This handler class provides logic coded
    in the callback methods defined by the pro-grammer. The parser then processes
    the input stream and invokes the handler''s callback methods to perform the actual
    work (see Figure 4). The parse method accepts various input parameters, including
    java.io.InputStream, org.xml.sax.InputSource, java.io.File, and java.lang.String.
    The second parameter is the implementation of the DefaultHandler class.


    ![](img/386c9660607eea1159d16febe1f732ac_223_0.png)


    Figure 4. Sequence diagram showing JAXP parsing using SAX.'
