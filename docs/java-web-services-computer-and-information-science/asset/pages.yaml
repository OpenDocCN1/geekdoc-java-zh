  md: '# Java Web Services


    +   1. Create a connection to the provider.

    2. Create a message factory.

    3. Create a message.

    4. Populate the message.

    5. Add the attachment parts.

    6. Save the message.

    7. Send the message.

    8. Close the connection.


    To run a JAXM application using a messaging provider, we must configure the JAXM
    client and the messaging provider.


    ![](img/386c9660607eea1159d16febe1f732ac_247_0.png)


    Each of these steps is described in the following paragraphs.


    # Creating a Connection to the Provider


    First, we need to instantiate a ProviderConnection object to create an active
    connection to the messaging provider. To create this connection, we use a JNDI
    lookup to obtain an instance of the ProviderConnection-Factory class. Once we
    get an instance of the connection factory, we can then create a connection to
    the messaging provider.


    ```

    // Use a JNDI lookup to create the Initial naming context

    Context ctx = new InitialContext();


    // Look up a JAXM provider connection factory

    ProviderConnectionFactory pcf =

    (ProviderConnectionFactory)ctx.lookup("providerUI\n

    // Create a JAXM provider connection

    ProviderConnection pc = pcf.createConnection();

    ```


    # Creating a Message Factory


    Use the connection to create a MessageFactory object, which is used to create
    a message. When you create a MessageFactory object, the MessageFactory returned
    instances of SOAPMessage subclasses appropriate to the given messaging profile.
    Before creating Message-Factory, we must first out the provider-supported profiles
    from its metadata information and ensure that the provider supports the profile
    we need to use. In the following snippet, the profile that matches the ebXML profile
    is as a String to the method createMessageFactory:


    ![](img/386c9660607eea1159d16febe1f732ac_247_1.png)'
