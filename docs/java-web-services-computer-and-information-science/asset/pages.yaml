  md: '# Building RPC Web Services with JAX-RPC 251


    +   - Stub and ties


    +   - Dynamic proxy


    +   - Dynamic invocation


    +   - Using WSDL, JAX-RPC enables interoperability with any SOAP 1.1-based Web


    +   - Provides data types mapping between Java and XML


    +   - Supports standard Internet protocols such as HTTP


    +   - Service endpoints and client services are portable across JAX-RPC implementations


    The JAX-RPC-based Web services can be deployed in the Java servlet 2.2- or the
    J2EE 1.3-client server providers. JAX-RPC-based services and clients are developed
    and deployed as J2EE components.


    In a Web services scenario, using JAX-RPC, the service requester and service provider
    can communicate and execute SOAP-based requests and responses and exchange XML
    as parameters or return values. For service provider, JAX-RPC provides support
    for exposing business components as services; for the service requester, JAX-RPC
    defines a mechanism to access and invoke JAX-RPC-based services or any SOAP 1.1-compliant
    RPC-based Web services. JAX-RPC provides APIs for data type mappings between Java
    and XML, which enables on-the-fly Java-to-XML and XML-to-Java mappings during
    communication; when a client invokes a JAX-RPC service, its XML parameters are
    mapped to Java objects. Similarly, when returning a response, the Java objects
    are mapped to XML elements as return values. JAX-RPC also enables the development
    of pluggable serializers and deserializers to support any data type map-ping between
    Java and XML, which can be packaged with a JAX-RPC service. In addition, JAX-RPC
    defines mappings between WSDL and Java, through which a WSDL document provided
    by services can be mapped to Java classes as client stubs and server-side ties.


    # Table 1. Comparison of JAX-RPC with JAXM


    | JAX-RPC | JAXM |

    |---|---|

    | Synchronous RPC-based service interaction | Asynchronous/synchronous messaging-based
    service interaction |

    | Message sent as XML-based requests and responses | Message sent as document-driven
    XML messages |

    | Exposes internals to service requests | Loosely coupled and not expose internals
    to service requesters |

    | Provides a variety of client invocation models | Does not provide a client-specific
    programming model |

    | No reliability mechanisms | Provides guaranteed message delivery and reliability
    mechanisms |


