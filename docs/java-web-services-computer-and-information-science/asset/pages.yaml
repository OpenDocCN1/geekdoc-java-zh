  md: '# Comments


    Comments are used for documenting parts of an XML structure.

    Comments are defined using the same syntax as HTML. The following is an example
    of a comment:


    ```

    <!-- this is a comment -->

    ```


    # Tags


    A tag is the element markup identified by the angle brackets. Each tag must have
    a start tag and a close tag. An XML file that contains a closing for every tag
    in a nested form is considered to be a well-formed file. A is considered to be
    an empty tag if it stands by itself without any attributes. An empty tag serves
    the purpose of an identifier in a XML structure. For example:


    ```

    <LineItem ProductNo="210020" Quantity="4000"/>

    ```


    can be equivalently represented as


    ```

    <LineItem>

    <Product_No>210020</Product_No>

    <Quantity>4000</Quantity>

    </LineItem>

    ```


    The first example shows how the attributes can be used in a tag. This is also
    an example of an empty tag where no data is present. It simply defines the name
    and age and closes itself with the slash (/).


    A number of things need to be kept in mind when an XML structure is designed.


    When data is very large, it makes more sense to use elements rather then attributes
    for clarity. Data that contains various HTML or formatting tags also should be
    defined as an element. On the other hand, if the data is short and does not change
    very often, defining it as an attribute might be the right approach to take.


