  md: '# 5.2.4 JAXP Implementations


    Many implementations of JAXP 1.1 currently exist, including Crimson-son, Apache
    Xerces, XML parser from IBM, and Oracle.


    A new change found in the Java Development Toolkit (JDK) 1.4 is the addition of
    JAXP APIs and reference implementations. The reference implementations include
    Crimson for XML parsing and Xalan for XML transformations.


    # 5.2.5 Processing XML with SAX


    The Simple Access for XML (SAX) API is based on an event-driven processing model
    where the data elements are interpreted on a sequential basis and callbacks are
    called on selected constructs. It is similar to the AWT 1.1 Event Delegation Model,
    where UI components generate events based on user input and where event listeners
    perform actions. SAX biggest advantage is that it does not load any XML documents
    into memory; therefore it is considered to be very fast and lightweight. SAX supports
    validation but does not enforce the use of it. Having validation, a document is
    checked for conformance against a schema document (DTD or XML Schema). It uses
    a sequential read-only approach and does not support random access to the XML
    elements.


    There are several ways to process XML data using SAX APIs. One of them is to use
    a JAXP (javax.xml.parsers.*) API which maps many low-level SAX specific calls
    or the SAX (org.xml.sax*) directly. Using the SAX API directly is more difficult
    because it requires more steps to perform equivalent functionality that is encapsulated
    in the JAXP API. In this section, we will focus around the JAXP specifics and
    will not cover vendor-specific SAX APIs in great detail because this spans a very
    large area.


    SAX as a processing model is very simple (see Figure 3). The basics consist of
    the following three steps:


    +   1. Implement a class that extends the DefaultHandler and holds callback methods
    for every type of construct found in XML that-contains implementation based on
    your needs.


    ![](img/386c9660607eea1159d16febe1f732ac_216_0.png)'
  merge: -1
  pgno: 216
- img_proc: true
  md: '+   2. Instantiate a new SAX Parser class. The Parser reads the XML source
    file and triggers a callback implemented in the DefaultHandler class.


    +   3. Read the XML source sequentially. With the sequential reading, it is not
    possible to randomly access elements in the structure. The rest depends upon your
    implementation residing in the Handler class.


    ![](img/386c9660607eea1159d16febe1f732ac_217_0.png)


    Figure 3. JAXP using the SAX processing model.


    The following sections describe JAXP-specific SAX processing. These steps consist
    of the following:


    +   - Getting Factory and Parser classes to perform XML parsing

    - Setting options such as namespaces, validation, and features

    - Creating a DefaultHandler implementation class


    # Getting a Factory and Parser


    The JAXPSParser class is responsible for parsing the XML data, and the implementation
    of the org.xml.sax.DefaultHandler handles all of the callbacks for specific tags.
    In order for an application to obtain an instance of the parser, it must get an
    instance of the SAXParser upon which it can call parse methods.


    # How to Get a SAX Parser


    The following is a step-by-step demonstration on how to create a SAX parser.


    +   1. Instantiate the implemented Handler class. JAXP1.1 requires the handler
    to extend from DefaultHandler as opposed to HandlerBase, which was the implementation
    used in JAXP 1.0.


    ```

    DefaultHandler handler = new MyImplOfHandler();

    ```'
