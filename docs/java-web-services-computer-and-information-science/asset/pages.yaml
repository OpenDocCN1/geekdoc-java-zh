  md: '# 1.1.7 Message-Oriented Middleware


    Although CORBA, RMI, and DCOM differ in their basic architecture and approach,
    they adopted a tightly coupled mechanism of a synchronous communication model
    (request/response). All these technologies are based upon binary communication
    protocols and adopt tight integration across their logical tiers, which is susceptible
    to scalability issues.


    Message-Oriented Middleware MOM is based upon a loosely coupled asynchronous communication
    model where the application client does not need to know its application recipients
    or its method arguments.


    MOM enables applications to communicate indirectly using a messaging provider
    queue. The application client sends messages to the messaging queue (message holding
    area), and the receiving application picks up the message from the queue.


    In this operation model, the application sending messages to another application
    continues to operate without waiting for the response from that application.


    Figure 6 illustrates a high-level MOM architecture showing application-to-application
    connectivity


    In MOM-based architecture, applications interacting with its messaging infrastructure
    use custom adapters.


    Client applications communicate with the underlying messaging infrastructure using
    these adapters for sending and receiving messages. For reliable delivery, messages
    can be persisted in a database/file system as well.


    Some of the widely known MOM-based technologies are SunONE Message Queue, IBM
    MQSeries, TIBCO, SonicMQ, and Microsoft Messaging Queue (MSMQ).


    The Java Platform provides a Java-based messaging API (JMS-Java Message Service),
    which is developed as part of the Sun Java Community Process (JCP) and is also
    currently part of the JEE 1.3 specifications.


    All the leading MOM vendors like SunONE, TIBCO, IBM, BEA, Talarian, Sonic, Fiorano,
    and Spiritwave support the JMS specifications.


    JMS provides Point-to-Point and Publish/Subscribe messaging models with the following
    features:


    +   - Complete transactional capabilities

    - Reliable message delivery

    - Security


