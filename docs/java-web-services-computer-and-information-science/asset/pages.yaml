- img_proc: true
  md: '# 24 Java Web Services


    standard for structuring data, content, and data format for electronic documents.
    It has already been widely accepted as the universal language lingua franca for
    exchanging information between applications, systems, and devices across the Internet.


    In the core of the Web services model, XML plays a vital role as the common wire
    format in all forms of communication. XML also the basis for other Web services
    standards. By learning XML, you will be prepared to understand and explore Web
    services.


    # Simple Access Protocol (SOAP)


    Simple Access Object Protocol, or SOAP, is a standard for a lightweight XML-based
    messaging protocol. It enables an exchange of information between two or more
    peers and enables them to communicate with each other in a decentralized, distributed
    application environment. Like XML, SOAP is also independent of the application
    model, language, and running platforms or devices. SOAP is endorsed by W3C and
    key industry vendors like Microsystems, IBM, HP, SAP, and Microsoft. These vendors
    have already announced their support by participating in the W3C XML protocol-working
    group. The ebXML initiative from UN/CECAFT also has announced its support for
    SOAP.


    In the core of Web services model, SOAP is used as the messaging protocol for
    transport with binding on top of various Internet protocols as HTTP, SMTP, FTP,
    and so on. SOAP uses XML as the message format, and it uses a set of encoding
    rules for representing data as messages. Although SOAP is used as a messaging
    protocol in Web services, it can also operate on a request/response model by exposing
    the functionality using SOAP/RPC based on procedural calls. SOAP also can be used
    with J2EE-based application frameworks.


    # Web Services Definition Language (WSDL)


    The Web Services Definition Language (WSDL) is an XML format for describing the
    network services and its access information. It defines a binding mechanism to
    attach a protocol, data format, an abstract message, or set of endpoints defining
    the location of services.


    In the core of the Web services model, WSDL is used as the metadata language for
    defining Web services and how service providers and requesters communicate with
    one another. WSDL describes the Web services functionalities offered by the service
    provider, where the service is located, and how to access the service. Usually
    the service provider creates Web services by generating WSDL from its exposed
    business applications. A public/private registry is utilized for storing and publishing
    the WSDL-based information.


