    # Processing Instructions


    Processing instructions (PIs) are used for providing information to the XML processing
    application. Things like scripts could be embedded in XML documents for extra
    processing. A prolog is considered to be a processing instruction but is reserved
    for XML standards. Processing instructions usually are used in special applications
    to perform special tasks.


    The following is an example of a processing instruction:


    ```

    <?target instructions?>

    ```


    where the following are indicated:


    +   * **target.** It is the name of the application that will be performing the
    processing.

    * **instruction.** String containing information that is passed to the target
    application. An example of a PI that is seen in the majority of XML documents
    is the prolog:


    ```

    <?xml version="1.0" ?>

    ```


