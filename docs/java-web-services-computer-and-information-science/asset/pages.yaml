  md: "For example, one disadvantage of the DTD is that it is hard to read and does\
    \ not use XML as the definition format. DTDs are not very good at expressing sophisticated\
    \ constraints on elements, as the number of maximum and minimum occurrences of\
    \ a particular element. DTDs do not have the capability to reuse previously defined\
    \ structures. They do not have support for type inheritance, subtyping, and abstract\
    \ declarations. A more flexible standard that covers most of the limitations of\
    \ DTDs is XML Schema. This standard is becoming more popular as the definition\
    \ format, because it is easier to understand and maintain.\n\n# XML Schema\n\n\
    XML Schema is currently a W3C recommendation (www.w3.org/XML/Schema). XML Schema\
    \ is hierarchical and enables type, structure, and relation definitions to exist\
    \ as well as field validations within elements. XML Schema is harder to learn\
    \ and create than DTDs but solves the major limita of DTDs. The schema definition\
    \ is written in XML, which seems like a natural fit in the XML world with great\
    \ tool support for creating and editing XML documents. XML Schema is not part\
    \ of the XML 1.0 specification, which means that valid XML documents only apply\
    \ to documents that are validated by DTDs using DOYPE declaration.\n\n# Comparing\
    \ DTD to XML Schema\n\nThe following demonstrates the difference between a DTD\
    \ and an XML Schema definition for the sample xml file:\n\n```\n<Product>123456</Product>\n\
    <Price>49.99</Price>\n```\n\nThe DTD for the previous XML code is as follows:\n\
