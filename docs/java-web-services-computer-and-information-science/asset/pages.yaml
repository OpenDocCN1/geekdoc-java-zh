  md: '# Creating a .NET Client Using Proxy Classes


    The next step involves creating a .NET client, which uses the instance of the
    proxy to the Web service to invoke the methods with parameters to get results.
    You may choose any .NET language (Visual Basic, C#, and so on) to create the client
    application.


    # Compiling the Client Application


    The next step is to compile the client application including the proxy DLL. To
    compile the client application, you may run the following from your Windows command
    prompt (in a single line):


    ```

    csc.exe /target:exe

    /r:AcmeService.dll

    AcmeClient.cs

    /out:AcmeClient.exe

    ```


    This command creates AcmeClient.exe, an executable .NET client application file,
    to invoke the service provider. In the command, the /target:exe option indicates
    the executable, /r: specifies the required libraries, AcmeClient.cs refers to
    the name of the client source file, and the /out:AcmeClient.exe option indicates
    the output executable file.


    # Executing the Client from a Windows Environment


    The final step is running the AcmeClient.exe file in a Windows environment which
    will invoke the service provider application and execute the required methods.


    This summarizes the steps involved in creating a .NET service client for a Web
    services provider. Now let''s take a look at a real-world case study of how to
