  md: 'WebLogic 7.0 provides servicegen, a SOAP and WSDL generation that enables the
    creation of SOAP-based service-oriented interfaces from JEE components. It also
    provides a client generator utility, clientgen, which enables the creation of
    Java-based clients to invoke Web services. Additionally, it also provides serializer
    and deserializer classes, which convert XML to WSDL representations of data, and
    vice-versa.


    The ACME Web services provider also JAXP-compliant XML parser and PointBase as
    its database for storing and querying information. JAXP and PointBase are also
    available as part of the BEA WebLogic bundle and separate download. The PointBase
    database also can be used as an evaluation query for development purposes.


    # 2. Service Requester Side Features


    Apache Axis 1.0B3 is a SOAP 1.1-compliant implementation with capabilities to
    enable Java-based SOAP services to be created, assembled, and deployed. More importantly,
    it provides a utility for automatic WSDL generation from deployed services and
    a WSDL2 Java tool for building Java proxies and skeletons from WSDL obtained from
    service providers.


    The service requestor will use Apache Axis 1.0B3 as its SOAP client environment
    to invoke the services of an ACME Web services provider.


    Apache Axis is an open-source effort from Apache and is available as a free download
    from http://xml.apache.org/axis/index.html.


    To build and deploy the JEE components and SOAP interfaces, we create XML-based
    build scripts using Apache Ant. Apache Ant is a Java-based Makefile utility available
    as a free download at http://jakarta.apache.org/ant/index.html.


