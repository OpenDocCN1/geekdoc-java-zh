  md: '# 4.2 MICROSOFT .NET FRAMEWORK


    Microsoft .NET is part of the Microsoft .NET platform-Microsoft''s strategy for
    developing distributed applications through XML services. The Microsoft .NET Framework
    provides a full-fledged environment for developing XML services in a Microsoft
    Windows-based environment. It facilitates a runtime infrastructure and APIs for
    developing Web services using various languages as C#, Visual Basic, and so forth.
    The .NET Framework provides the infrastructure for defining the overall .NET platform.
    Microsoft provides compilers that generate a new code referred to as Microsoft
    Intermediate Language (MSIL). MSIL is a CPU-independent code instruction, which
    is able to run on any system supporting its native machine language.


    The .NET compilers provided by Microsoft are as follows:


    +   * VB.NET (Visual Basic for .NET)

    * C++ .NET (Visual C++ for .NET)

