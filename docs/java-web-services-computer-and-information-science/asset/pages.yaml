    Web services enable businesses to communicate, collaborate, and conduct business
    transactions using a lightweight infrastructure by adopting an XML-based data
    exchange format and industry standard delivery protocols.


    The basic characteristics of a Web services application model are as follows:


    +   - Web services are based on XML messaging, which means that the data exchanged
    between the Web service provider and the user are defined in XML.

    - Web services provide a cross-platform integration of business applications over
