  md: '# Web Services Architecture 93


    In the WebLogic 7.0 environment, using the servicen utility requires an EJB jar
    file as input. It automatically generates the ‘JAX-RPC based serviced interfaces,
    user-defined data type components (serializer and deserializer classes), and the
    web-services.xml deployment descriptor, and then packages them as a deployable
    EAR file by introspecting the input EJB.


    Thus, by creating a servicen Ant task in the build.xml, it is possible to generate
    all the service classes required for exposing an EJB as a Web service. Listing
    19 is an Ant task for generating the service classes for ACMESession EJB. For
    the deployed components, we will be using ACMEWebService as the name of the Web
    service, and its URI and the name for EAR, JAR, and WAR are webservices_acmes.ear,
    acme_ejb.jar, and acme_service.war, respectively.


    ```

    <target name="build-ear" depends="build-ejb">

    <delete dir="$(build)"/>

    <mkdir dir="$(build)"/>

    <copy todir="$(build)" file="$(dist)/acme_ejb.jar"/>

    <servicegen

    dest="$(build)/webservices_acme.ear"

    warName="acme_service.war">

    <servicejbjar="$(build)/acme_ejb.jar"

    targetNamespace=

    http://localhost:7001/acme_services/ACMEWebService

    serviceName="ACMEWebService"

    serviceURI="/ACMEWebService"

    generateMethods="True"

    pexpandMethods="True">

    <client

    packageName="jws.ch3.ejb"


    clientJarName="$(client_file)"/>

    </service>

    </servicegen>

    </target>

    ```


    **Listing 19.** Ant task for generating the service classes from ACMESession EJB.


    Similar to the servicen utility, WebLogic 7.0 also provides a clientgen utility
    that creates a client JAR file containing the client specific stubs (JAX-RPC based),
    and


