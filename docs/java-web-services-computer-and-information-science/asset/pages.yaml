    # 5.1.1 XML Syntax


    This section will discuss some terminology associated with XML that describes
    XML-specific syntax and what it means.


    # XML Naming Conventions


    Naming has to be respected for the XML document to be well formed. Blank spaces
    are not permitted in XML names. A name must start with an alphabetical letter
    (A to Z or a) or an underscore (_). It can be followed with more letters, digits
    [0 to 9], underscores, hyphens (-), periods (.), and colons (:). Although a colon
    is permitted, it is mostly used when a document uses namespaces (see the section
    titled Namespaces that follows). Names are also case-sensitive in an XML document,
    therefore <product> and <Product> are considered to be two different elements.
    It is up to the developer to choose whether


