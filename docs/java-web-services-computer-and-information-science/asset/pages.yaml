    # ### 3.2.4 SOAP Fault


    In a SOAP message, the SOAP Fault element is used to handle errors and to find
    out status information. This element provides the error and/or status information.
    It can be used within a Body element or a Body entry.


    It provides the following elements to define the error and status of the SOAP
    message in a readable description, showing the source of the information and its
    details:


    +   - **Faultcode**. The faultcode defines the algorithmic mechanism for the SOAP
    application to identify the fault. It contains standard values for identifying
    the error or status of the SOAP application. The namespace identifiers for these
    faultcode values are defined in http://schemas.xmlsoap.org/soap/envelope/. The
    following faultcode element values are defined in the SOAP 1.1 specification:

    - **VersionMismatch** This value indicates that an invalid namespace is defined
    in the SOAP envelope or an unsupported version of a SOAP message.

    - **MustUnderstand** This value is returned if the SOAP receiver node cannot handle
    and recognize the SOAP header block when the MustUnderstand attribute is set to
    1. The MustUnderstand values can be set to 0 for false and 1 for true.

    - **Client** This faultcode indicates when a problem originates from the receiving
    client. The possible problems could vary from an incorrect SOAP message, a missing
    element, or incorrect namespace definition.

    - **Server** This faultcode indicates that a problem has been encountered during
    processing on the server side of the application, and that the application could
    not process further because the issue is specific to the content of the SOAP message.

    - **Faultstring**. The faultstring element provides a readable description of
    the fault exhibited by the SOAP application.

    - **Faultactor**. The faultactor element provides the information about the ultimate
    SOAP actor (Sender/Receiver/Intermediary) in the message who is responsible for
    the SOAP fault at the particular destination of a message.

    - **Detail**. The detail element provides the application-specific error or status
    information related to the defined Body block.


