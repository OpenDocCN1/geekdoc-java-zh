  md: '# WEB SERVICES

    ARCHITECTURE


    # CHAPTER

    2


    The common thread for everything I do is this idea of a Web-services architecture.
    What does that mean? It means taking components of software and systems and having
    them be self-describing, so that you can aim them, ask them what their capabilities
    are, and communicate with them using a standard protocol.


    Bill Gates


    # LEARNING OBJECTIVES


    After studying this chapter, you will be able to:


    +   - Describe the web services architecture and its core building blocks

    - Know the tools of the trade

    - Understand the web services communication models

    - Learn about implementing web services

    - Know the developing web services-enabled applications


    # INTRODUCTION


    The Web services architecture represents the logical evolution of traditional
    computer-based applications to services-oriented applications over the Internet.
    It defines a distributed computing mechanism by adopting a service-oriented architecture
    (SOA), where all of the applications are encapsulated as services and made available
    for invocation over a network.


    ![](img/386c9660607eea1159d16febe1f732ac_56_0.png)'
  merge: -1
  pgno: 56
- img_proc: true
  md: 'These services can be leveraged from different applications and platforms with
    varying technologies adopting common industry standards and platform-independent
    and language-neutral Internet protocols for enabling application interoperability,
    making them easily accessible over the Internet. In addition, it provides a mechanism
    for categorizing and registering the services in a common location making them
    available for discovery services architecture and collaboration over the Internet
    or corporate networks. Using Web services architecture and adhering to its standards
    also exposing and legacy applications as Web services, and the clients invoking
    these services do not require that they are aware of their target system environment
    and its underlying implementation model.


    # 2.1 WEB SERVICES ARCHITECTURE AND ITS CORE BUILDING BLOCKS


    The basic principles behind the Web services architecture are based on SOA and
    Internet protocols. It represents a composable application solution based on standards
    and standards-based technologies. This ensures that the implementations of Web
    services applications are compliant to standard specifications, thus enabling
    interoperability with those compliant applications. Some of the key design requirements
    of the Web services architecture are the following:


    +   * To provide a universal interface and a consistent solution model to define
    the application as modular components, enabling them as disposable services

    * To define a framework with a standards-based infrastructure model and protocols
    to support services-based applications over the Internet

    * To address a variety of service delivery scenarios ranging from e-business (B2C),
    business-to-business (B2B), peer-to-peer (P2P), and enterprise application integration
    (EAI)-based application communication

    * To enable distributable modular applications as a centralized and decentralized
    application environment that supports boundary-less application communication
    for inter-enterprise and intra-enterprise application connectivity

    * To enable the publishing of services to one or more public or private directories,
    enabling potential users to locate the published services using standardbased
    mechanisms that are defined by standards organizations

    * To enable the invocation of those services when it is required, subject to authentication,
    authorization, and other security measures


    To handle these requirements, a typical Web service architectural model consists
    of three key logical components as core building blocks mapping the operational
    roles and relationships of a Web services environment. Figure 1 represents the
    core building blocks of a typical Web services.


    ![](img/386c9660607eea1159d16febe1f732ac_57_0.png)'
  merge: -1
  pgno: 57
- img_proc: true
  md: '# Web Services Architecture 43


    Services container/runtime environment. The services container acts as the Web
    services runtime environment and hosts the service provider. Typical to a Web
    application environment, it defines the Web services runtime environment for client
    communication as a container of Web services interfaces by exposing the potential
    components of the underlying applications. It facilitates the service deployment
    and services administration. In addition, it also handles the registration of
    the service description with the service registries. Usually, the Web services
    platform implements the services container. In some circumstances, the Web application
    provides system services and APIs that can be leveraged by the Web services container.


    ![](img/386c9660607eea1159d16febe1f732ac_58_0.png)


    Figure 1. Core building blocks of Web services architecture.


    +   - Services registry. The services registry hosts the published services and
    acts as a broker providing a facility to publish and store the description of
    Web services registered by the service providers. In addition, it defines a common
    access mechanism for the service requesters for locating the registered services.


    To build the Web services architecture with these logical components, we need
    to use standardized components and a communication model for describing and invoking
    the services that are universally understood between the services and their


    ![](img/386c9660607eea1159d16febe1f732ac_58_1.png)'
  merge: -1
  pgno: 58
- img_proc: true
  md: 'potential service requesters. It also requires a standard way to publish the
    services by the service provider and store them in the service broker. In turn,
    service requesters can find them.


    +   - WSDL. This resides in the services container and provides a standardized
    way to describe the Web services as a service description. In ebXML-based architecture,
    ebXML CPP/A provides services descriptions including partner profiles examples.


    +   - UDDI. This provides a standard mechanism for publishing and discovering
    registered Web services, and it also acts as the registry and repository to WSDL-based
    service descriptions. In ebXML-based architecture, ebXML Registry & Repository
    provides a facility to store CPP/CPA descriptions for business collaboration.


    ![](img/386c9660607eea1159d16febe1f732ac_59_0.png)


    # 2 TOOLS OF THE TRADE


    Let''s take a look at the role of how Web services standards and technologies
    and how they are represented in Web services architecture and its development
    process.


    # 2.2.1 Simple Object Access Protocol (SOAP)


    The Simple Object Access Protocol, or SOAP, plays the role of the messaging protocol
    for exchanging information between the service provider and the service requester.
    It consists of the following:


    +   - SOAP Envelope. It describes the message, identifying the contents and the
    envelope''s processing information.


    +   - SOAP Transport. It defines the bindings for the underlying transport protocols
    such as HTTP and SMTP.


    +   - SOAP Encoding. It defines a set of encoding rules for mapping the instances
    of the application-specific data to XML elements.


    +   - SOAP RPC conventions. It defines the representation of the RPC requests
    and responses. These SOAP requests and responses are marshaled in a data type
    and passed in to a SOAP body.


    ![](img/386c9660607eea1159d16febe1f732ac_59_1.png)


    ![](img/386c9660607eea1159d16febe1f732ac_59_2.png)'
