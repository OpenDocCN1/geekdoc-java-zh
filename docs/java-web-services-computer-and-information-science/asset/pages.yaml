  md: 'Chapter 3 presents an in-depth discussion on the core fundamentals of Simple
    Object Access Protocol (SOAP) and the role of SOAP in developing Web services
    architecture and its implementation. This chapter covers the W3C definition of
    SOAP standards, conventions, messages, SOAP communication models, and implementation
    of SOAP-based applications for Web services.


    Chapter 4 discusses the basics of Web services interoperability and illustrates
    an interoperable Web services scenario using Java and Microsoft .NET-based application
    environments.


    Chapter 5 explores about XML processing and data binding with Java APIs. Java
    and XML are known to be a perfect fit for building portable business applications,
    where XML provides the portability of data that can be processed on diverse platforms.
    These two technologies can be ported from one platform to another without any
    effort, and in addition, Java applications can talk to non-Java applications by
    using XML as the communication protocol.


    Chapter 6 discusses the Java API for XML messaging (JAXM) and SOAP with Attachment
    API for Java (SAAJ). Both JAXM and SAAJ enable XML-based messaging for B2B and
    Web services applications supporting a wide range of industry standards, including
    SOAP and ebXML.


    Chapter 7 discusses the Java API for XML RPC (JAX-RPC), which enables the development
    of Web services incorporating XML-based remote procedural calls (RPCs). JAX-RPC
    is an integral part of the JWSDP. In a JWSDP-based Web services environment, JAX-RPC
    provides XML-based RPC functionality between the service requestors and the service
    provider.'
