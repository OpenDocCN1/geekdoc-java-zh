  md: '# ROLE MODEL


    # MIGUEL DE ICAZA


    Miguel de Icaza (born November 23, 1972) is a Mexican American programmer, best
    known for starting the GNOME, Mono, and Xamarin projects.


    ![](img/386c9660607eea1159d16febe1f732ac_178_0.png)


    # Biography


    # Early Years


    Icaza was born in Mexico City and studied Mathematics at the National Autonomous
    University of Mexico (UNAM), but dropped out before getting a degree to work in
    IT. He came from a family of scientists in which his father is a physicist and
    his mother a biologist. He started writing free software in 1992.


    # Early Software Career


    One of the earliest pieces of software he wrote for Linux was the Midnight Commander
    file manager in 1994, a text-mode file manager. He was also one of the early contributors
    to the Wine project.


    He worked with David S. Miller on the Linux SPARC port and wrote several of the
    video and network drivers in the port, as well as the libc ports to the platform.
    Both worked extending Linux for MIPS to run on SG1''s Computers and wrote the
    original X drivers for the system. With Ingo Molnar he wrote the original software
    implementation of RAID-1 and RAID-5 drivers of the Linux kernel.


    In summer of 1997, he was interviewed by Microsoft for a job in the Internet Explorer
    team (work on a SPARC port), but lacked the university degree required to work
    H-IB visa. He said in an interview that he tried to persuade his interviewers
    to free the IE code before Netscape did with their own browser.


    # GNOME, Xianim, Xamarin and Mono


    De Icaza started the GNOME project with Federico Mena in August 1997 to create
    a completely free desktop environment and component model for Linux and other
    Unix-like operating systems. He also created the GNOME spreadsheet program, Numeric.


    In 1999, Icaza, along with Nat Friedman, co-founded Helix Code, a GNOME-oriented
    free software company that employed a large number of GNOME'
  merge: -1
  pgno: 178
- img_proc: true
  md: '# Java Web Services


    hackers. In 2001, Helix Code, later renamed Ximian announced the Mono Project,
    to be led by Icaca, with the goal to implement Microsoft''s new .NET development
    platform on Linux and Unix-like platforms. In August 2003, Ximian was acquired
    by Novell. There, Icaca was Vice President of Developer Platform.


    In May 2011, Icaca started Xamarin to replace MonoTouch and Mono for Android after
    Novell was bought by Attachmate and the projects were abandoned. Shortly afterwards,
    Xamarin and Novell reached an agreement where Xamarin took over the development
    and sales of these products.


    In February 2016, Xamarin announced being acquired by Microsoft. One month later
    in Microsoft Build conference, it was announced that the Mono Project would be
    relicensed by MIT, Visual Studio would include Xamarin (even the free versions)
    without restrictions, and Xamarin SDKs were opensourced.


    # Advocacy of Microsoft Open Technologies


    De Icaca endorsed Microsoft''s Open XML (OOXML) document standard, disagreeing
    with a lot of the widespread criticism in the open source and free-software community.He
    developed Mono – a free and open-source alternative to Microsoft''s .NET Framework
    – for GNOME. This has raised disagreement due to the patents that Microsoft holds
    on the .NET Framework.


    De Icaca was criticized by Richard Stallman on the Software Freedom Day 2009,
    who labeled him as “Traitor to the Free Software Community”. Icaca responded on
    his blog to Stallman with the remark that he believes in a “world of possibility”
    and that he is open for discussions to improve the pool of open source and free
    software.


    # Preference for Mac over Linux


    In August 2012, De Icaca criticized the Linux desktop as “killed by Apple”. De
    Icaca specifically criticized a generally developer-focused culture, lack of backward
    compatibility and fragmentation among the various Linux distributions. In March
    2013, de Icaca announced on his personal blog that he regularly used macOS instead
    of Linux for desktop computing.


    # .NET Foundation Director


    In 2014 he joined Anders Heielsberg on stage during the announcements of the .NET
    Foundation and the open sourcing of Microsoft''s C# Compiler. He serves on the
    board of directors of the .NET Foundation.


    ![](img/386c9660607eea1159d16febe1f732ac_179_0.png)'
