  md: '# XML Schema Declaration Using Namespace


    The schema declarations begin the same way a regular XML document begins, with
    a prolog. It starts with <schema> as the root element. It then includes references
    to an XML schema namespace declaration. Namespace declarations are needed in this
    case because the document being operated upon references specific elements from
    the schema. The schema elements provide the semantics for constraining elements
    in the other namespace of the XML document being processed. The following is a
    fragment of an XML schema declaration:


    ```

    <?xml version="1.0" ?>

    <schema targetNamespace="http://www.acme.com/warehouse/catalog"

    xmlns="http://www.w3.org/2001/XMLSchema"

    xmlns:Catalog="http://www.acme.com/warehouse/catalog">


    <element name="Product" type="string"/>

    <element name="Price" type="string"/>

    ```


    The root element <schema> contains a targetNamespace attribute, which specifies
    the target that the schema will constrain. The previous example shows that two
    different namespaces are defined. One is the default (unqualified) used by the
    XML Schema and the second (qualified) is the target document defined using the
    Catalog prefix. There are no general rules for choosing a namespace the same as
    the targetNamespace. There is not an optimal solution to this problem; which namespace
    is optimal truly depends upon whether the schema will be extended, whether it
    will import different schemas, and any number of other things.


    # Multiple Schemas


    There could be a case where the XML document refers to names of elements found
    in multiple namespaces that are defined in multiple schemas. In that case, the
    location of the XML schemas must be specified using the schemaLocation attribute.
    The following example shows a fragment of an XML document:


    ```

    <?xml version="1.0" ?>

    <Catalog:Product xmlns="http://www.acme.com/warehouse/catalog/"

    xmlns:Buyer="http://www.acme.com/warehouse/buyers/"

    xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"

    si:schemaLocation="http://www.acme.com/warehouse/catalogs.xsd

    http://www.acme.com/warehouse/catalog

    http://www.acme.com/warehouse/buyers

    http://www.acme.com/schema/customers.xsd">

    ```


    ![](img/386c9660607eea1159d16febe1f732ac_204_0.png)'
