    # 5.1.3 Validation of XML Documents


    Before the parser processes a document, it is checked for well-formedness. A well-formed
    document is a document in which every tag has an equivalent closing tag meaning;
    it conforms to the XML specification. A document that is formed not necessarily
    be valid. A valid document is a document that conforms to certain constraints
    defined in a schema definition. Validity is used for checking whether a document
    conforms to certain standards agreed upon by collaborating parties (for example,
    two businesses conducting the exchange of computer parts). These two businesses
    must provide the data in such a way that both under-stand what is represented
    and what is meant by it.


    The following example demonstrates a structure that is not well formed:


    ```

    <!-- Not well-formed document -->

    <?xml version="1.0"?>

    <Employee>

    <Person>Jane</Person>

    <Age>21

    </Employee>

    </Age>

    ```


    In the previous example, the Age and Employee elements are not properly nested.
    The order in which the paired tags are opened and closed is very important for
    a document to be considered well formed.


