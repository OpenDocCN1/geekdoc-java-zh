    # 3.5.2 SOAP Messaging


    SOAP Messaging represents a loosely coupled communication model based on message
    notification and the exchange of XML documents. The SOAP message body is represented
    by XML documents or literals according to a specific W3C XML schema, and it is
    produced and consumed by sending or receiving SOAP node(s). The SOAP sender node
    sends a message with an XML document as its body message and the SOAP receiver
    node processes it.


    Listing 26 represents a SOAP message and a SOAP messaging-based communication.
    The message contains a header block InventoryNotice and the body product, both
    of which are application-definition and not defined by SOAP. The header contains
    information required by the receiver node and the body contains the actual message
    to be delivered.


    ```

    <env:Envelope xmlns:env="http://www.w3.org/2001/12/soap-envelope">

    <env:Header>

    <n:InventoryNotice xmlns:n="http://jws.wiley.com/Inventory">

    <n:productcode>J687698696-</</n:productcode>

    </n:InventoryNotice>

    </env:Header>

    <env:Body>

    <m:product xmlns:m="http://jws.wiley.com/product">

    <m:name>Developing Java Web Services</m:name>

    <m:quantity>25000</m:quantity>

    <m:date>2002-07-01T14:00:05:00</m:date>

    </m:product>

    </env:Body>

    </env:Envelope>

    ```


    **Listing 26.** SOAP message using messaging-based communication.


