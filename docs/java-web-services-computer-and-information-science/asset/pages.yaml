    # 7.2.2 JAX-RPC-Based Client Implementation


    According to the JAX-RPC 1.0 specification, JAX-RPC based service clients are
    independent of service implementation, and the service client does not depend
    upon its service provider or its running platform using Java or non-Java environments.
    The JAX-RPC provides client-side APIs and defines a client invocation model for
    accessing and invoking Web services.


