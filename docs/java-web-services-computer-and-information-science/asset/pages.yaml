    for a parser and transformer to be compliant, it must follow the JAXP specification.
    The flexibility of having the freedom to choose any parser is very important.
    It enables an application developer to choose a parser that best fits the requirements
    of the service.


    In addition to the plugability layer, JAXP is made simple. The APIs are very straightforward
    and the learning curve is much smaller than learning a new proprietary API. The
