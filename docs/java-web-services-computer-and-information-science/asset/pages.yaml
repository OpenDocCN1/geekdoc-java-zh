  md: '# BUILDING RPC WEB SERVICES WITH JAX-RPC


    # CHAPTER 7


    Today, Web services is really about developing for the server. What it means to
    developers is any set of systems services that you make a Web service to access
    by any kind of device with a highly interactive client, not just a browser.


    John Fowler


    # LEARNING OBJECTIVES


    After studying this chapter, you will be able to:


    +   - Describe the role of JAX-RPC in web services

    - Learn about JAX-RPC APIs and implementation model


    # INTRODUCTION


    This chapter discusses the Java API for XML RPC (JAX-RPC), which enables the development
    of Web services incorporating XML-based remote procedural calls (RPCs).


    JAX-RPC is an integral part of the JSDP. In a JSP-based Web services environment,
    JAX-RPC provides XML-based RPC functionality between the service requestors and
    the service provider. JAX-RPC provides standard API mechanisms for creating RPC-based
    Web services and a runtime environment for Web services applications. Through
    these applications, a service requestor client can invoke remote calls to access
    the services exposed by a service provider.


    ![](img/386c9660607eea1159d16febe1f732ac_264_0.png)'
  merge: -1
  pgno: 264
- img_proc: true
  md: 'JAX-RPC also defines mappings between WSDL-based service

    descriptions and Java classes and provides tools to generate WSDL

    from Java classes and vice-versa. This enables developers to create

    JAX-RPC clients for Web services that enable interoperability to

    occur between Web services applications using different

    languages and/or on heterogeneous platforms.


    JAX-RPC is quite typical to Java Remote Method Invocation

    (RMI), which handles RPC mechanisms by serializing

    Java objects in a distributed computing

    environment; where JAX-RPC uses SOAP-based and WSDL

    mechanisms to invoke Web services on heterogeneous

    environments.


    Currently, the JAX-RPC 1.0 is fully compliant with the SOAP

    1.1 protocol and specifications and supports HTTP as its

    transport protocol.


    This helps the Web services developers write JAX-RPC-

    based Web applications with minimal effort and little

    understanding of SOAP RPC. In a Web services context,

    using JAX-RPC the service requester and service provider can

    execute SOAP-based requests and responses and exchange XML

    as parameters or return values.


    # 7.1 THE ROLE OF JAX-RPC IN WEB SERVICES


    In a Web services environment, JAX-RPC defines an API

    framework and runtime environment for creating and executing

    XML-based remote procedural calls. The Web service requesters

    in invoke the provider''s methods and transmit parameters

    and receive return values as XML-based requests and

    responses. Typically, the Web service endpoints and

    participating application clients use JAX-RPC for defining and

    executing the RPC-based Web services.


    The core features of JAX-RPC are are as follows:


    +   - Provides APIs for defining JAX-RPC-based Web services,

    hiding the underlying complexities of SOAP packaging

    and messaging

    - Provides APIs for invoking RPC-based Web

    services based on


    ![](img/386c9660607eea1159d16febe1f732ac_265_0.png)


    JAX-RPC hides all of the complexities of the underlying

    SOAP packaging and messaging by providing the required

    mapping between Java and XML/WSDL.


    ![](img/386c9660607eea1159d16febe1f732ac_265_1.png)


    Request-response protocols date to early distributed

    computing in the late 1960s, theoretical proposals

    of remote procedure calls as the model of network

    operations date to the 1970s, and practical

    implementations date to the early 1980s. Bruce

    Nelson is generally credited with coming

    term "remote procedure call" in 1981.


    ![](img/386c9660607eea1159d16febe1f732ac_265_2.png)'
