  md: '# 4.3 DEVELOPING MICROSOFT .NET CLIENT FOR WEB SERVICES


    Typical to any other Web services requester environment, the .NET based clients
    also embrace Web services standards and protocols to communicate with any Web
    services providers. This enables .NET client applications running on Windows platforms
    to access Web services exposed from other platforms, as long as they are compliant
    with Web services standards.


    To develop Microsoft .NET clients for invoking Web services, the .NET Framework
    SDK provides toolsets for generating SOAP proxies and for implementing the .NET
    clients. A .NET Framework SDK installation provides the proxy generators (wsdl.exe)
    for accessing WSDL and the generating proxy classes and compilers (csc.exe). It
    also enables clients to be using any .NET-supported language, as C# or Visual
    Basic.


    # 4.3.1 Key Steps in Creating a Web Service Requester Using the .NET Framework


    The key steps in creating a Web services client using the .NET Framework are provided
    in the following sections.


    # Obtaining the WSDL of a Web Service


    The first step in creating a Web services client is to locate the service provider
    and obtain its WSDL, which describes the exposed Web services defining its message
    type, operation, port type, binding, and so on.


    # Generating a Proxy for the Web Service


    The .NET Framework SDK provides the WSDL.exe utility, which generates proxy client
    classes for a Web service exposed using WSDL. To create a .NET-based Web services
    proxy client class, you may run the following from your Windows command prompt
    (in a single line):


    ![](img/386c9660607eea1159d16febe1f732ac_172_0.png)'
