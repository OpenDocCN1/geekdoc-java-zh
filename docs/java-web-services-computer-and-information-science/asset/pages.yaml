    # Elements


    An element is the data delimited by a start tag and an end tag. It is the building
    block used for creating XML documents. An XML document essentially is composed
    of many elements. The topmost element is called the root element. All elements
    that are directly under the root are referred to as child elements of the root
    element. In the following code, the root element is the Catalog element and the
    child elements of the root elements are the CatalogId, Product, and EuroProducts.
    These three elements are considered to be siblings in relation to one another,
    and the root element is considered to be an ancestor of the three siblings. This
    tree structure can span much deeper than we are able to show in the following
    simple example code:


    ```

    <!-- Catalog Is a Start or Root element -->

    <Catalog>

    <CatalogId Id=''123456'' />

    <!-- Product element contains children elements -->

    <Product>

    <!-- Id element contains character data -->

    <Id>1234</Id>

    <!-- Price contains attribute currency --\>

    <Price currency=''USD''>199.99</Price>

    ```


    ```

    </Product>

    <!-- Empty element -->

    <EuroProducts/>

    <!-- Closing element -->

    </Catalog>

    ```


    # Attributes


    Attributes provide additional information about an element. They have a key and
    value pair that identifies the different attribute. Many attributes can exist
    in one element. If attributes are used, the XML document can have a reduced number
    of tags, as shown in the following code:


    ```

    <Price currency="USD">12.99</Price>

    <Price currency="CND">21.99</Price>

    ```


