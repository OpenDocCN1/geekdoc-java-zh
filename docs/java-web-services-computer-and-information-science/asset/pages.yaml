    # 2.3 WEB SERVICES COMMUNICATION MODELS


    In Web services architecture, depending on the functional requirements, it is
    possible to implement the models with RPC-based synchronous or messaging-based
    synchronous/asynchronous communication models. These communication models need
    to be understood before Web services are designed and implemented.


    ![](img/386c9660607eea1159d16febe1f732ac_63_0.png)


    # 2.3.1 RPC-Based Communication Model


    The RPC-based communication model defines a request/response-based synchronous
    communication.


    When the client sends a request, the client waits until a response is sent back
    from the server before continuing any operation.


    Typical to implementing CORBA or RMI communication, the RPC-based Web services
    are tightly coupled and are implemented with remote objects to the client application.
    Figure 2 represents an RPC-based communication model in Web services.


    The clients have the capability to provide parameters in method calls to the Web
    service provider. Then, clients invoke the Web services by sending parameter values
    to the Web service provider that executes the required methods, and then sends
    back the return values.


    Additionally, using RPC-based communication, both the service provider and requestor
    can register and discover services, respectively.'
  merge: -1
  pgno: 63
- img_proc: true
  md: '# Web Services Architecture


    ![](img/386c9660607eea1159d16febe1f732ac_64_0.png)


    Figure 2. RPC-based communication model in Web services.


    # 2.3.2 Messaging-Based Communication Model


    The messaging-based communication model defines a loosely coupled and document-driven
    communication. The service requester invoking a messaging-based service provider
    does not wait for a response. Figure 3 represents a messaging-based communication
    model in Web services architecture.


    In Figure 3, the client service requester invokes a messaging-based Web service;
    it typically sends an entire document rather than sending a set of parameters.
    The service provider receives the document, processes it, and then may or may
    not return a message. Depending upon the implementation, the client can either
    send or receive a document asynchronously to and from a messaging-based Web service,
    but it cannot do both functionalities at an instant. In addition, it is also possible
    to implement messaging with a synchronous communication model where the client
    makes the service request to the service provider, and then waits and receives
    the document from the service provider.


    Adopting a communication model also depends on the Web service provider infrastructure
    and its client protocol for RPC and Messaging. The current version of SOAP 1.2
    and ebXML Messaging supporting these communication models; it is quite important
    to ensure that the protocols are compliant and supported by the Web services providers.
    It is also important to satisfy other quality of services (QoS) and environmental
    requirements like security, reliability, and performance.


    Before jumping into the development approaches, let''s take a look at the process
    steps of implementing a Web services model.'
