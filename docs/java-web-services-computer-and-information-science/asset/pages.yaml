  md: '# Steps for Sending a Message without a Message Provider


    The key programming steps for sending messages using JAXM APIs with-out a messaging
    provider or using a SOAP connection are as follows:


    +   1. Create a SOAP connection.

    2. Create a message factory.

    3. Create a message.

    4. Populate the SOAP message.

    5. Add the SOAP attachment parts.

    6. Save the SOAP message.

    7. Send the message and receive the response.

    8. Close the provider connection.


    Each of these steps is described in the following paragraphs.


    # Creating a SOAP Connection


    The first step is to create a SOAPConnection object for sending messages directly
    with its partner application. To create this connection, we must obtain an instance
    from the SOAPFactory class. Once we get an instance of the connection factory,
    then we can create a SOAPConnection:


    ```

    // Create an Instance of SOAP connection factory

    SOAPConnectionFactory scf

    = SOAPConnectionFactory.newInstance();


    // Create a SOAP connection using the factory Instance

    SOAPConnection sc = scf.createConnection();

    ```


    # Creating a Message Factory


    Create an instance of a MessageFactory object, which enables the creation of instances
    of SOAPMessage:


    ```

    // Create an instance of the message factory

    MessageFactory msgFactory = MessageFactory.newInstance();

    ```


    ![](img/386c9660607eea1159d16febe1f732ac_253_0.png)'
  merge: -1
  pgno: 253
- img_proc: true
  md: '# Creating a Message


    Using the MessageFactory instance, create SOAPMessage objects:


    SOAPMessage message = msgFactory.createMessage();


    # Populating the SOAP Message


    All messages are created with a SOAP part that contains a SOAP envelope, and in
    turn, it contains the SOAP header and body. The SOAP part of the message, including
    its header and body elements, can contain only data formatted using XML, whereas
    a SOAP attachment part contain any kind of data, including XML, non-XML, and **binary
    data**. This is the same process that we discussed earlier using the provider.


    To populate the message, first we must get the message''s SOAPPart object then
    its envelope object:


    ```

    // Get the SOAP Part from the message.

    SOAPPart soapPart = message.getSOAPPart();


    // Get the SOAP Envelope

    SOAPEnvelope soapEnvelope = soapPart.getEnvelope();

    ```


    Then, we use the SOAPEnvelope object to obtain both the SOAPHeader and SOAPBody
    objects used for setting the contents of the SOAP part of the message:


    ```

    // Create a header from the envelope

    SOAPHeader soapHeader = soapEnvelope.getHeader();


    // Create the SOAPBody

    SOAPBody soapBody = soapEnvelope.getBody();

    ```


    Then, we add content to the header using a SOAPHeader object that contains SOAPHeaderElement
    objects. A new SOAPHeaderElement object is then created and added to the header.
    The new SOAPHeaderElement object is initialized with the specified Name object:


    > Binary data is whose unit can take on only two possible states, traditionally
    labeled as 0 and 1 in accordance with the binary number system and Boolean algebra.


