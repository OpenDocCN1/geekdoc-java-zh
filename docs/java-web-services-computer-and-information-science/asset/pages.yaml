  md: "# Java Web Services\n\nIn a J2EE-based application server environment, J2EE\
    \ components can be exposed for remote access through RMI/IIOP. In the case of\
    \ a Web service provider using a J2EE environment, in addition to RMI/IIOP, it\
    \ is also possible to expose those components as a service via WSDL and handle\
    \ the exposed service by sending and receiving SOAP-based requests/responses or\
    \ messages.\n\n![](img/386c9660607eea1159d16febe1f732ac_69_0.png)\n\nToday most\
    \ Web services platform providers and J2EE application server vendors have released\
    \ their supporting toolsets for exposing the J2EE components as EJBs and Servlets\
    \ as Web services. Typically, these tools provide functionality to generate WSDL-based\
    \ service descriptions and service interface classes, which send and receive SOAP\
    \ messages based on the services defined in the WSDL.\n\nThe following steps are\
    \ commonly involved in creating Web services from a J2EE-based application component:\n\
    \n+   - Select a Web services platform provider, which provides a consistent platform\
    \ for building and deploying services over the J2EE applications.\n- Define a\
    \ Web service-enabled application and its behavior.\n  - Select the potential\
    \ J2EE components (for example, EJBs, Servlets, and JMS applications) that are\
    \ required to be exposed as services or are using the existing services.\n- Choose\
    \ the communication model (RPC-based synchronous or messaging-based asynchronous)\
    \ depending upon the required behavior of the underlying components (for example,\
    \ Session or Entity EJBs using RPC-based communication or JMS applications using\
    \ messaging-based communication).\n- Ensure that the service uses only built-in/custom\
    \ data types mapping for XML and Java supported by the Web services container.\
    \ This applies only to RPC-based communication models.\n- Develop the Web service\
    \ by writing the interfaces required for accessing the exposed components (for\
    \ example, EJBs, Servlets, and JMS applications).\n\n![](img/386c9660607eea1159d16febe1f732ac_69_1.png)"
