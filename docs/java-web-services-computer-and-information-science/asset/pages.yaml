  md: '# Java Web Services


    +   - Encoding standards for representing data in SOAP messages

    - A communication model for exchanging SOAP messages applications.

    - Bindings for the underlying transport protocols as SOAP transport

    - Conventions for sending and receiving messages using RPC and messaging


    SOAP is not a programming language or a business application component for building
    business applications. SOAP is intended for use as a portable communication protocol
    to deliver SOAP messages, which have to be created and processed by an application.


    In general, SOAP is simple and extensible by design, unlike other distributed
    computing protocols, the following features are not supported by SOAP:


    +   - Garbage collection

    - Object by reference

    - Object activation

    - Message batching


    SOAP and ebXML are complementary to each other. In fact, SOAP is leveraged by
    an ebXML Messaging service as a communication protocol with an extension that
    provides security and reliability for handling business transactions in e-business
    and B2B frameworks.


    # 3.2 ANATOMY OF A SOAP MESSAGE


    SOAP defines the structure of an XML document, rules, and mechanisms that can
    be used to enable communication between applications. It does not mandate a single
    programming language or a platform, nor does it define its own language or platform.


    > Communication protocol is a system of rules that allow two or more entities
    of communications system to transmit information via any kind of variation of
    a physical quantity.


    Before we go exploring the SOAP features, let''s walk through an existing SOAP
    message and understand the XML syntax, semantic rules, and conventions. The example
    in Listing 4.1 is a SOAP request/response message for obtaining book price information
    from a book catalog service provider. The SOAP request accepts a string parameter
    as the name of the book and returns a float at the price of the book as a SOAP
    response.


    In the scenario in Listing 1, the SOAP message is embedded in an HTTP request
    for getting the book price information from www.wiley.com for the book Developing
    Java Web Services.'
