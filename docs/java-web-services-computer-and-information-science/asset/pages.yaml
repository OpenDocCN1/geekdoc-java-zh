  md: '# SUMMARY


    +   - XML-based protocols have been used in the industry for a while now—some
    even before the W3C SOAP effort began—however, some of these protocols did not
    get accepted by the industry for various reasons.


    +   - SOAP defines the structure of an XML document, rules, and mechanisms that
    can be used to enable communication between applications. It does not mandate
    a single programming language or a platform, nor does it define its own language
    or platform.


    +   - The SOAP envelope is the primary container of a SOAP message''s structure
    and is the mandatory element of a SOAP message. It is represented as the root
    element of the message as Envelope.


    +   - The SOAP header is represented as the first immediate child element of a
    SOAP envelope, and it has to be namespaced.


    +   - A SOAP envelope contains a SOAP body as its child element, and it may contain
    one or more optional SOAP body entries. The Body represents the mandatory processing
    information or the payload intended for the receiver of the message.


    +   - the SOAP Fault element is used to handle errors and to find out status information.
    It can be used within a Body element or as a Body entry.


    +   - The SOAPUnderstand attribute indicates that the processing of a SOAP header
    block is mandatory or optional at the target SOAP node.


    +   - The SOAP encoding defines a set of rules for expressing its data types.
    It is a generalized set of types programming languages, databases, and semi-structured
    data required for an application.


    +   - The polymorphic accessor enables programming languages to access data types
    during runtime. SOAP provides a polymorphic instance by defining an xsi:type attribute
    that represents the type of the value.


    +   - Compound value types are based on composite structural patterns that represent
    member values as structure or array types.


    +   - Partially transmitted arrays are defined using a SOAP-ENC:offset, which
    enables the offset position to be indicated from the first element (counted as
    zeroorigin), which is used as an offset of all the elements that will be transmitted.


    +   - Sparse arrays are defined using a SOAP-ENC:position, which enables the position
    of an attribute to be indicated with an array and returns its value instead of
    listing every entry in the array.


