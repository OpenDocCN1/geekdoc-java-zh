    # Elements


    XML schema elements provide definitions for the content of an XML data document.
    A name and a type represent an element.


    The type sets a restriction to which the XML document elements must conform. Element
    types come in two different forms: primitive or complex.


    Primitive or simple element types are defined by the XML Schema specification.
