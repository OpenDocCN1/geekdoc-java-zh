    # INTRODUCTION


    This chapter presents an in-depth discussion on the core fundamentals of Simple
    Object Access Protocol (SOAP) and the role of SOAP in developing Web services
    architecture and its implementation. This chapter covers the W3C definition of
    SOAP standards, conventions, messages, SOAP communication models, and implementation
    of SOAP-based applications for Web services.'
