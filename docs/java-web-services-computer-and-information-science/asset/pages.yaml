    # 7.2 JAX-RPC APIS AND IMPLEMENTATION MODEL


    As JAX-RPC 1.0 specifications, JAX-RPC defines both service and client implementation
    models intending to do RPC-based messaging using a JAX-RPC runtime environment
    or directly to a SOAP service. The core JAX-RPC APIs are packaged as javax.xml.rpc,
    which provides the run-time mechanisms package and java.xml.rpc.handler.* as its
    SOAP message handler API package.


    # 7.2.1 JAX-RPC-Based Service Implementation


    The JAX-RPC 1.0 specification does not define any APIs for implementing JAX-RPC-based
    services. JAX-RPC-based services can be implemented using Java classes (similar
    to writing an RMI application) or by using a WSDL document. In both cases, JAX-RPC
    does not specify any requirements for its service client implementation to access
    and use the deployed services. The following sections look at those two different
    ways of service implementation and walk through the programming steps required.


    ![](img/386c9660607eea1159d16febe1f732ac_269_1.png)


    Programming is the process of creating a set of instructions that tell a computer
    how to perform a task.


    # Developing a JAX-RPC Service from Java Classes


    Developing a JAX-RPC-based service (also referred to as a JAX-RPC service definition)
    is quite similar to developing an RMI application. The steps involved are as follows:


    +   - Define the remote interface (Service Definition).

    - Implement the remote interface (Service Implementation).

    - Configure the service.

    - Generate the stubs and ties.

    - Package and deploy the service.


    Now, let''s take a look at the previous steps by walking through a sample application.


