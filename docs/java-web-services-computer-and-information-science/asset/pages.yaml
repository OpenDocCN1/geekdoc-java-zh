  md: '# Java Web Services


    With the emergence of Web services, SOAP has become the facto communication protocol
    standard for creating and invoking applications exposed over a network. SOAP is
    similar to traditional binary protocols like IIOP (CORBA) or JRMP (RMI), but instead
    of using a binary representation, it adopts text-based data representation using
    XML. SOAP defines a lightweight wire protocol and encoding format SOAP can use
    a variety of Internet standard protocols (such as HTTP and SMTP) as its transport,
    and provides conventions for representing models like remote procedural calls
    (RPCs) and document-driven messaging. This enables inter-application communication
    in a distributed environment and interoperability between heterogeneous applications
    over the networks. With its widespread acceptance leading IT vendors and Web developers,
    SOAP is gaining popularity and adoption in most popular business applications
    for enabling them as Web services.


    # XML-BASED PROTOCOLS AND SOAP


    ![](img/386c9660607eea1159d16febe1f732ac_133_0.png)


    XML-based protocols have been used in the industry for a while—now even before
    the W3C SOAP effort began—however, some of these protocols did not get accepted
    by the industry for various reasons. Some of the popular XML-based protocols are
    the following:


    +   - **XML (Metadata Interchange)**. XML was developed by OMG to explore technological
    synergy between XML and OMG technologies using XML and CORBA. CORBA defines an
    open interchange model for CORBA and object-based technologies in a standardized
    way, enabling them to interoperate using XML and providing the ability to exchange
    programming data over the Internet.


    +   - **XML RPC (XML - Remote Procedure Call)**. RPC was originally developed
    byed Inc. It is an RPC-based communication protocol that runs over the Internet
    using HTTP as its transport protocol. It encodes RPC parameters and return values
    in XML. The parameters can consist of numbers, scalars, strings, dates, lists,
    and complex records.


    ![](img/386c9660607eea1159d16febe1f732ac_133_1.png)


    SOAP is an ongoing W3C effort in leading IT vendors participating in order to
    come to a consensus on important tasks associated with XML-based protocols and
    to define their requirements and usage scenarios.'
