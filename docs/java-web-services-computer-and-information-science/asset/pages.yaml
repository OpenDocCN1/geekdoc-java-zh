  md: '# Web Services Architecture


    # DAVE WINER


    Dave Winer (born May 2, 1955 in Queens, New York City) is an American software
    developer, entrepreneur, and writer who resides in New York City. Winer is noted
    for his contributions to outliners, scripting, content management, and web services,
    as well as blogging and podcasting. He is the founder of the software companies
    Living Videot, Userland Software and Small Picture Inc., a former contributing
    editor for the Web magazine HotWired, the author of the Scripting News weblog,
    a former research fellow at Harvard Law School, and current visiting scholar at
    New University’s Arthur L. Carter Journalism Institute.


    ![](img/386c9660607eea1159d16febe1f732ac_120_0.png)


    # Early Life and Education


    Winer was born on May 2, 1955, Queens, New York City, the son of Eve Winer, Ph.D.,
    a school psychologist and Leon Winer, Ph.D., a former professor of the Columbia
    University Graduate School of Business. Winer is also the nephew of German novelist
    Arno Schmidt and a relative of Heidi Lamarr. He graduated from the Bronx High
    School of Science in 1972. In 1978 he received an MS in Computer Science from
    the University of Wisconsin–Madison.


    # Career


    # Early Work in Outliners


    In 1979 Dave Winer became an employee of Personal Software, where he worked on
    his own product named VisiText, which was his first attempt to build a commercial
    product around an “expand and collapse” outline display and which ultimately established
    outliners as a software product. In 1981 he left the company and founded Living
    Videotext to develop this still-unfinished product. The company was based in Mountain
    View, CA, and grew to more than 50 employees.


    ThinkTank, which based on VisiText, was released in 1983 for Apple II and was
    promoted as an “idea processor.” It became the “first popular outline processor,
    the one that made the term generic.” A ThinkTank release for the IBM PC followed
    in 1984, as well as releases for the Macintosh 128K and 512K. Ready, a RAM resident
    outliner for the IBM PC released in 1985, was commercially successful but soon
    succumbed to


    ![](img/386c9660607eea1159d16febe1f732ac_120_1.png)'
  merge: -1
  pgno: 120
- img_proc: true
  md: 'the competing Sidekick product for Borland. MORE, released for Apple’s Macintosh
    in 1986, combined an outliner and a presentation program. It became “uncontested
    in the marketplace” and won the MacUser’s Editor’s Choice Award for “Best Product”
    in 1986.


    In 1987, at the height of the company’s success, Winer Sold Videotext for Symantec
    for an undisclosed substantial transfer of stock that “made his fortune.” Winer
    continued to work at Symantec’s Living Videotext division, after six months he
    left the company in pursuit of other challenges.


    # Years at UserLand


    Winer founded UserLand Software in 1988 and served as the company’s CEO until
    2002.


    UserLand’s original flagship product, Frontier, was a system-level scripting environment
    for the Mac. Winer’s pioneering weblog, Scripting News, takes its name from this
    early interest. Frontier was an outliner-based scripting language, echoing Winer’s
    longstanding interest in outlines and anticipating code-folding editors of the
    late 1990s. Winer became interested in web publishing while helping automate the
    process of strikers’ online newspaper in San Francisco’s newspaper strike of November
    1994. According to Newsweek, through this experience, he “revolutionized Net publishing.”
