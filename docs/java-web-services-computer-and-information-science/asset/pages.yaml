    # Testing the ACME Web Services Provider


    So far we have looked at building the components and generating the service classes
    for the ACME services provider. From now on, let''s test the service classes using
    the static client and WebLogic server-provided utilities.


    To execute the static client AcmeWebServiceClient class, you may execute the Ant
    utility with run as an argument. The successful execution of the program invokes
    the ACMEWebService and then fetches the Product Catalog as an XML base string.


    If everything works successfully, you will get the output shown in Figure 13.


    As part of every Web service deployment, the WebLogic 7.0 server automatically
    generates home pages for all of the deployed Web services. Through this page,
    it does the following:


    +   * Tests the invoke operations to ensure the operations are working correctly

    * Displays SOAP request and response messages based on the invocation

    * Displays the WSDL describing the service and operations provided by the Web
    service

    * Downloads the deployed Web service-specific JAR file containing the JAX-RPC
    stub interfaces and classes required for invoking the Web service from an application


    ![](img/386c9660607eea1159d16febe1f732ac_112_0.png)


