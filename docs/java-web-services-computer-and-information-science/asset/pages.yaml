    SAXParserFactory saxFactory = SAXParserFactory.newInstance();

    javax.xml.parsers.SAXParser saxParser =

    saxFactory.newSAXParser();

    ```


    While getting an instance of the factory and parser, there are a couple of things
    that can go wrong. The factory configuration can be wrong, and an exception will
    be thrown to indicate this problem. The exception is called FactoryConfigurationException,
    and it must be caught during the instantiation of the factory object. The second
    area is where the application can fail is while the parser object is instantiated.
    In this case, the Parser-ConfigurationException must be caught while the factory
    instiates a new parser. The following is a listing of more complete code:


    ```

    try {

    SAXParserFactory saxFactory = SAXParserFactory.newInstance();

    javax.xml.parsers.SAXParser saxParser =

    saxFactory.newSAXParser();

    } catch (FactoryConfigurationError fce) {

    // handle exception here

    } catch (ParserConfigurationException pce) {

    // handle exception here

    }

    ```


    The next step, once the parser is obtained, is to call the parse() method by passing
    the XML data to be parsed and a Handler class to handle the data that is being
    passed. The following are possibilities in which the parser can be used:


    +   ** Passing file as a parameter */

    saxParser.parse(new File(someString), mySAXExampleHandler);


    +   ** Passing a URI as a String parameter */

    saxParser.parse("http://www.acme.com/xml/PurchaseOrder.xml", mySAXExampleHandler);


    +   ** Parsing Input stream as a parameter */

    saxParser.parse(someInputStream, mySAXExampleHandler);


    There are options with HandlerBase in the parse() method, but these are SAX 1.0
    implementations. The current JAXP version implement these for backward compatibility,
    but you should use DefaultHandler when JAXP 1.1 is used.


