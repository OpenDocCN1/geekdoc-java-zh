  md: '# Java Web Services


    Java is the name for the programming language that can be used for building complex
    web applications and for the software platform that used this programming language
    as its most essential component. It is widely used by development companies to
    build secure, robust and scalable web applications. Web service is a standardized
    medium to propagate communication between the client and server applications on
    the World Wide Web. Web services emerged to lower the barriers to application
    integration, making it easier to discover, access use remote applications and
    data, in ways that overcome some important costs and limitations usually implied
    in building interoperability services. This book will help understand some important
    jargon related to Java web services.


    This book is an introduction to a variety of new technologies, approaches, and
    ideas for writing web-based applications to take advantage of the Java web services
    architecture. The book will cover the entire spectrum from the promise of cloud
    computing to the grit of XML content. Students will gain practical, hands-on experience
    with implementations of the Java XML and web service APIs including JAXP, JAXB,
    JAX-WS 2.0, WSEE, and XWS.


