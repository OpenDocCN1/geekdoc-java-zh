    on. Due to the flexibility of using open standards and protocols, it also facilitates
    Enterprise Application Integration (EAI), business-to-business (B2B) integration,
    and application-to-application (A2A) communication across the Internet and corporate
    intranet. In organizations with heterogeneous applications and distributed application
    architectures, the introduction of Web services standardizes the communication
    mechanism and enables interoperability of applications based on different programming
    languages residing on different platforms.


