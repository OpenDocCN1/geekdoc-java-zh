    # ## 1.1.2 The Importance of Distributed Computing


    The distributed computing environment provides many significant advantages over
    a traditional standalone application. The following are some of those key advantages:


    +   - **Higher performance.** Applications can execute in parallel and distribute
    the load across multiple servers.

    - **Collaboration.** Multiple applications can be connected through standard distributed
    computing mechanisms.

    - **Higher reliability and availability.** Applications or servers can be clustered
    in multiple machines.

    - **Scalability.** This can be achieved by deploying these reusable distributed
    components on powerful servers.

    - **Extensibility.** This can be achieved through dynamic (re)configuration of
    applications that are distributed across the network.'
