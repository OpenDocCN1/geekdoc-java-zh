    \ property, code the specified getter and setter such that in each setter, the\
    \ corresponding property check is invoked and the property is only set/unset,\
    \ if the check does not detect any constraint violation.\n\n## 3. Implementing\
    \ Unidirectional Non-Functional Associations with Plain JS\n\n- 3. For each multi-valued\
    \ property, code its add and remove operations, as well as the specified get/set\
    \ operations:\n\n- 1. Code the add/remove operations as (instance-level) methods\
