    \ : number (pkey) |\n| name[1] : string |\n| empno[1] : number (unique) |\n| category[0..1]\
    \ : number |\n| department[0..1] : string |\n\n图 13.4：Person 角色的 TCI。\n\n在 JTI\
    \ 方法的情况下，除了上述步骤 1-5 之外，我们还会：\n\n1. 将根表 (people) 的主键列 (personId) 复制到所有子表中。\n2.\
