    ## 12.3 Intention versus Extension


    The intention of an object type is given by the set of its features, including
    attributes, associations, constraints and operations.


    The extension of an object type is the set of all objects instantiating the object
    type. The extension of an object type is also called its population.


    ## 126 — 12 Subtyping and Inheritance


