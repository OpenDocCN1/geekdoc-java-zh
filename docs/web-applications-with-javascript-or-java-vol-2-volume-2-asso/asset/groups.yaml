    | person_id | name | emp_no |

    |---|---|--|

    | 101 | Harry Wagner | 21035 |


    employees


    | person_id | name | emp_no | department |

    |---|---|---|--|

    | 1002 | Peter Boss | 23107 | Sales |


    managers


    **TCI 方法的优点：** (1) 给定类层次结构在各个元素（类）方面的结构被显式地表示。(2) 当给定类层次结构的划分互不相交时，TCI 会导致内存高效的冗冗存储。


    **缺点：** (1) TCI 方法无法忠实地表示原始类层次结构中表达的子类型关系。特别是，对于任何代表子类（员工、经理或作者）的行，没有信息表明它代表一个父类（人）。因此，TCI
    模式没有告知所表示的子类型；相反，保留在应用模型中的元信息与数据库解耦了。(2) TCI 方法需要重复列定义，这是一种模式冗余的形式。(3) 每当子类重叠时，TCI
    方法可能会导致数据冗余。在我们的示例中，作者可以是员工，因此对于任何重叠的情况，我们需要复制父类的数据。


    ### 12.7.4.3 链接继承 (Joined Inheritance)


    为了避免重叠情况下的数据冗余，我们采用图 12.12 所示的 JTI 方法，通过将子表（*subtables*）通过父类（*super*）的主键连接到父类（*superclasses*），并使用带有
    «fk» 刻型标记的外键列来实现。img/26953d102345733859f6258a9956_15_png


    12.12：表示 Person 角色的 JTI 模型。


    该模型的一个可接受种群是：


    | person_id | name |

    | --- | --- |

    | 1001 | Harry Wagner |

    | 1002 | Peter Boss |

    | 1003 | Tom Daniels |

    | 1077 | Immanuel Kant |


    | person_id | biography |

    | --- | --- |

    | 1001 | 1956年出生于马萨诸塞州波士顿，. . . |

    | 1077 | 曼努埃尔·康德（1724–1804）是一位德国哲学家。. . . |


    | person_id | emp_no |

    | --- | --- |

    | 1001 | 21035 |

    | 1002 | 23107 |


    | person_id | department |

    | --- | --- |

    | 1002 | Sales |


    **JTI 方法的优点：** (1) 子类型关系被显式保留。(2) 避免了重叠情况下的数据冗余。


    **缺点：** (1) JTI 方法的主要缺点是查询子类时需要连接（join），这可能会产生性能问题。


    ## 12.8 测验 (Quiz)


    如果你想查看这些答案，可以查看我们的论坛。如果你不在论坛上找到答案，可以发帖询问。


