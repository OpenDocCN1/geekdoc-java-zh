    # 10 Special Topics on Associations


    # 10.1.2 Composition


    It''s amazing how much confusion exists about the distinction between the part-whole
    association concepts aggregation and composition. The main problem is the widespread
    misunderstanding (even among expert software developers and the authors of UML
    that the concept of composition implies a life-cycle dependency between the whole
    and its parts that the parts cannot exist without the whole. But this view ignores
    the fact that there are also cases of part-whole associations with non-shareable
    parts where the parts can be detached from and survive the destruction of the
    whole.


    In the UML specification document, the definition of the term "composition" has
    always implied non-shareable parts, but it has not clear what is the defining
    characteristic of "composition", and what is merely an optional characteristic.
    Even in the UML version 2.5 (as of 2015), after an attempt to provide the definition
    of the term "composition", it remains still ambiguous and doesn''t provide any
    guidance how to model part-whole associations with non-shareable parts where the
    parts can be detached from, and survive the destruction of, the whole as opposed
    to the case where the parts cannot be detached and are destroyed together with
    the whole. They say:


    If a composite object is deleted, all of its parts are objects that were deleted
    with it.


    But at the same time they also say:


    > A object may be removed from a composite object before the composite object
    is deleted, and thus not be deleted as part of the composite object.


    This points to an incompleteness of the UML definition, which does not account
    for life-cycle dependencies between components and composites. It''s therefore
    important to understand how the UML definition can be enhanced, e.g. by introducing
    a UML stereotype for characterizing "inseparable" compositions, or by introducing
    a constraint key word inseparable compositions for characterizing the association
    end at the component side.


    Martin Fowler explained, the main issue for characterizing composition relationships
    is that "an object can only be the part of one composition relationship". This
    is also explained in the blog post UML Composition with Aggregation as Association
    by G. Bellelekens. In addition to defining this characteristic of a composition
    (to have exclusive, or non-shareable, parts), a composition may also come with
    a life-cycle dependency between the composite and its components. In fact, there
    are two kinds of such dependencies:


    +   1. Whenever a composite must be attached to a composite, or in other words,
    when it has a mandatory composition, as expressed by the "exactly one" multiplicity
    at the composite side of the composition line, then it must either be re-used
    (in or re-attached to) another composite, or destroyed, when its current composite
    is destroyed. This is exemplified by the composition between Person and Heart,
    shown in the diagram below. A heart is either destroyed or transplanted to another
    person, when its owner has died.'
  - '[PAGE 130]


    2. Whenever a component must not be detached from its composite, or in other words,
    when it is inseparable, then, and only then, the component has to be destroyed,
    when its composite is destroyed. An example of a composition with inseparable
    parts is the composition between Person and Brain.


    ![](img/26c953d1023457333859f69258a99556_130_0.png)


    In summary, the life-cycle dependency created by inseparable parts only applies
    to specific cases of composition, but not in general. It is, therefore, not a
    defining characteristic. The UML spec states: "A part may be removed from a composite
    instance before deleted, and then not deleted as part of the composite instance.


    When such a life-cycle dependency applies, it represents a special form of Existential
    Dependency, which implies the CASCADE deletion policy discussed in Section 1.2.


    In the example of a Car-Engine composition, as shown in the following diagram,
    it''s clearly the case that the engine can be detached from the car before the
    car is destroyed, in which case the engine is not destroyed and can be re-used.
    This is implied by the zero or one multiplicity at the composite side of the composition
    line.


    | Car | Engine |

    |---|---|

    | licenseNo : String | id : String |

    | color : String 0..1 | 0..1 | cylinderCapacity : Decimal |


    The multiplicity of a composition''s association at the composite side is either
    1 or 0..1, depending on the fact if components have a mandatory composite or not.
    Of course, the fact that a component is inseparable implies that it has a mandatory
    composite, and consequently the composite''s multiplicity must be 1.


