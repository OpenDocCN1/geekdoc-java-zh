    \nA standard DBMS stores information (objects) in the rows of tables, which have\
    \ been conceived as set-theoretic relations in relational database systems. The\
    \ relational database language SQL is used for defining, populating, updating\
    \ and querying such databases. But there are also simpler storage techniques that\
    \ allow to store data in the form of table rows, particularly key-value storage\
    \ systems, such as JavaScript's Local Storage API, allow storing a serialization\
    \ of a JSON entity (map of entity records) as the string value associated with\
    \ the table as a key.\n\nWhile the classical version of SQL (SQL92) has no support\
    \ for subtyping and inheritance, this has been changed in SQL99. However, the\
    \ subtyping-related language elements of SQL99 have only been implemented in some\
    \ DBMS, for instance in the open source DBMS PostgreSQL. As a consequence, for\
    \ designing a model that can be implemented with various frameworks using SQL\
    \ DBMSs (including weaker technologies such as MySQL and SQLite), we cannot use\
    \ the SQL99 features for subtyping, but have to model inheritance hierarchies\
    \ in database design models by means of plain tables and foreign key dependencies.\
    \ This mapping from class hierarchies to relational tables (and back) is the business\
    \ of Object-Relational-Mapping frameworks such as JPA Providers (like Hibernate),\
    \ Microsoft's Entity Framework, or the Active Record approach of the Rails framework.\n\
    \nThere are essentially three alternative approaches to represent a class hierarchy\
    \ with database tables:\n\n- 1. **Single Table Inheritance (STI)** is the simplest\
    \ approach, where the entire class hierarchy is represented by a single table,\
    \ containing columns for all attributes of the root class and all of its subclasses,\
    \ and named after the name of the root class.\n- 2. **Table per Class Inheritance\
    \ (TCI)** is an approach, where each class of the hierarchy is represented by\
    \ a corresponding table containing also columns for inherited properties, repeating\
    \ the columns of the tables that represents its super.\n- 3. **Joined Tables Inheritance\
    \ (JTI)** is a more logical approach, where each subclass is represented by a\
    \ corresponding table (subtable) connected to the table representing its superclass\
    \ (supertable) via its primary key referencing the primary key of the superclass,\
    \ such that the (inherited) properties of the superclass are not represented as\
    \ columns in subtables.\n\nNotice that the STI approach is closely related to\
    \ the **Class Hierarchy Merge** design pattern discussed in Section 12.6 above.\
    \ When this design pattern has already been applied in the design model, or the\
    \ design model has already been refactored according to this design pattern, the\
    \ class hierarchies (their subclasses) in the data model to have been eliminated\
    \ in the design, and consequently also coded in the form of class definitions\
    \ in the app's model layer, so there is no anymore to map class hierarchies to\
    \ single tables. Otherwise, the design model contains a class hierarchy that is\
    \ implemented with a corresponding class hierarchy in the app's model layer, which\
    \ would be mapped to database tables with the help of the STI approach.\n\nWe\
    \ illustrate the use of these approaches with the help of two simple examples.\
