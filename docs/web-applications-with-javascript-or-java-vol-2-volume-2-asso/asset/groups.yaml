    ## 7.1 双向关联


    当一个派生的反向引用属性是多值的，而其反向属性是单值的（例如图 7.4 所示的 `Publisher::publishedBooks` 是由 `Book::publisher`
    派生的），其生命周期依赖意味着：


    - 1. 每当创建一个“基对象”（例如书）时，对应的反向属性必须进行更新，方法是向其值集中添加指向新基对象的引用（即向 `Publisher::publishedBooks`
    中添加指向新对象的引用）；

    - 2. 每当基属性更新时（例如，为书分配了新的出版商），对应的反向属性（在我们的示例中为 `Publisher::publishedBooks`）也必须更新，即从其值集中移除旧对象引用并添加新引用；

    - 3. 每当销毁一个基对象（例如书）时，对应的反向属性必须更新，即从其值集中移除该基对象（例如从 `Publisher::publishedBooks`
    中移除指向待销毁对象的引用）。


    请注意，从计算的角度来看，我们可以选择两个互反的引用属性（如 `Book::authors` 和 `Author::authoredBooks`）中的任意一个为主。在许多情况下，关联代表了不对称的本体论存在依赖，这种依赖决定了两个互反属性中哪一个是主。例如，`Book`
    类和 `Author` 类之间的作者关系关联代表了书对其作者的本体论存在依赖。一本书在存在上依赖于它的任何一个作者，而作者在存在上并不依赖于她的任何书。因此，`Book`
    和 `Author` 之间对应的对象生命周期依赖意味着，它们的双向关联通过在 `Book::authors` 中维护 `Author` 引用作为主属性的自然选择来维护，而
    `Author::authoredBooks` 则是从 `Book::authors` 派生的从属属性。


    ## 7.2 构建 OO 类模型


    由于经典编程语言不支持将显式关联作为一等公民，而仅支持通过引用属性表示隐式关联的类，因此我们必须消除所有显式关联以获取 OO 类模型。


    ### 7.2.1 基本属性


    我们消除关联过程的起点是一个包含各种单向和双向关联的信息设计模型，例如图 7.1 所示的模型仍然包含任何非定向关联，我们首先必须通过对其端点的所有权做出决策将它们转换为定向关联，这种决策通常基于导航需求。


    请注意，在 `Publisher-Book-Author` 信息设计模型中，两个关联——`publisher-publishedBooks` 和 `authoredBooks-authors`（或
    `Authorship`）都是定向的，如关联端点的所有权点所示。为了从信息设计模型中消除所有显式关联，我们必须执行以下操作：


    - 1. 消除连接源类与目标类的单向关联，通过用源类中的引用属性替换它们，使目标类成为其取范围（range）。

    - 2. 通过用一对互反的引用属性替换来消除双向关联。


    ### 7.2.2 如何消除单向关联


    连接源类与目标类的单向关联被替换为其源类中一个对应的引用属性，该属性的范围是目标类。其多重性与目标关联端的多重性相同。它的名称是该关联端的名称（如果有的话），否则设置为目标类的名称（如果引用属性是多值的，则可能使用复数形式）。


    ### 7.2.3 如何消除双向关联


    双向关联（如图 7.1 所示中 `Book` 类和 `Author` 类之间的作者关联）被替换为一对互反的引用属性，如 `Book::authors` 和
    `Author::authoredBooks`。由于这两个引用属性表示相同的信息（相同的二元关系集合），因此考虑将其中一个视为“主”，另一个视为“从”（后者由主属性派生）。我们讨论了一一对一关联和多对多关联的情况：


    - 1. 在双向的一对一关联的情况下，这会在两个关联类中的每个类中产生一对互反取值的引用属性。由于两者本质上代表相同的信息（链接/关系的集合），必须选择其中一个被视为主属性，使得另一个是从属属性，该从属属性通过反转由主属性派生。在类图中，从属属性被指定为派生属性，并且每当发生以下情况时会自动更新：1)
    创建了新的主对象，2) 主引用属性被更新，或 3) 主对象被销毁。这种转换在图 7.2 中所示。


    | Committee | chairedCommittee | chair |

    | --- | --- | --- |

    | name : String | 0..1 | ClubMember |


    ![](img/26c953d1023457333859f69258a99556_103_0.png)


    | Committee | ClubMember |

    | --- | --- |

    | name : String | /chairedCommittee[0..1] : Committee (inverse of chair) |

    | chair : ClubMember | |


    **图 7.2：** 将双向一对一关联转换为一对互反的单值引用属性的主从属性对。


    - 2. 双向多对多关联被映射到参与关联的两个类中各的一对互反的多值引用属性。同样，在其中一个类中，表示（反向）关联的多值引用属性被指定为派生属性，每当另一个类中的对应属性更新时，它就会自动更新。这种转换在图
    7.3 中所示。


    | Book | authored Books | Author |

    | --- | --- | --- |

    | name : String | (id) | name : String |

    | title : String | | ID : Integer |


    ![](img/26c953d1023457333859f69258a99556_103_1.png)


    | Book | Author |

    | --- | --- |

    | isbn : String | name : String |

    | title : String | |

    | authors : Author | /authoredBooks : Book (inverse of author) |


    **图 7.3：** 将双向多对多关联转换为互反多值属性的主从对。


    ### 7.2.4 得到的 OO 类模型


    将两个双向关联替换为引用属性后，我们得到了图 7.4 所示的 OO 类模型。


    | Book | Publisher |

    | --- | --- |

    | isbn[1]: String {id} | name[1]: String {id} |

    | title[1]: String | address[1]: String |

    | year[1]: Integer | /publishedBooks[*]: Book (inverse of publisher) |

    | publisher[0..1]: Publisher | Author |

    | authors[*]: Author | name[1]: String /authoredBooks[*]: Book |


    图 7.4：具有两互反属性对的 OO 类模型。


    由于书本质上依赖于出版商，反之则不然，因此在出版商和作者对象中维护主引用作为派生（或“从”）数据是自然的。因此，我们将 `publishedBooks` 和
    `authoredBooks` 定义为派生反向属性，这在 OO 类模型中通过斜杠前缀指示。


    该 OO 模型含义可以通过涉及的三个模型类的示例数据填充来说明：


    | Name | Address | Published books |

    | --- | --- | --- |

    | Bantam Books | New York, USA | 0553345842 |

    | Basic Books | New York, USA | 0465030793 |


