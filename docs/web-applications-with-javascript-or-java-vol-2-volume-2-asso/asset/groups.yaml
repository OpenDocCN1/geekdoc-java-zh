    \n## 2.5.5 Choose and Implement a Deletion Policy\n\nFor any reference property,\
    \ we have to choose and implement one of the two possible deletion policies discussed\
    \ in Section 1.2 for managing the corresponding object destruction dependency\
    \ in the destroy method of the property's range class. In our case, when deleting\
