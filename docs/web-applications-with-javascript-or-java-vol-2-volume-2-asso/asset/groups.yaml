    TCI approach would get the SQL table model shown in Figure 12.11 below. A TCI
    model represents each concrete class of the class hierarchy as a table, such that
    each subclass is represented by a table that also contains columns for inherited
    properties, thus repeating the columns of the table that represents the superclass.'
