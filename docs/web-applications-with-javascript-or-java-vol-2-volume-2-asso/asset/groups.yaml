    \    document.getElementById(\"Publisher-M\").style.display = \"none\";\n    document.getElementById(\"\
    Publisher-R\").style.display = \"block\";\n  }\n};\n```\n\n## 9 Implementing Bidirectional\
    \ Associations with Java EE\n\nIn this chapter, we show\n\n- 1. how to derive\
