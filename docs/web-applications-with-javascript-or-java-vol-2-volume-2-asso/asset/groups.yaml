    # World Wide Web


    The WWW (or, simply, “the Web”) is a huge client-server network based on HTTP,
    HTML and XML, where web browsers (and other ‘user agents’), acting as HTTP clients,
    access web server programs, acting as HTTP servers.


    # World Wide Web Consortium


    The W3C is an international organization in charge of developing and maintaining
    web standards.


    # X


    # XML HTTP Request


    The XML HTTP Request (XHR) API allows a JavaScript program to exchange HTTP messages
    with back-end programs. It can be used for retrieving/submitting information from/to
    a back-end program without submitting HTML forms. XHR-based approaches have been
    subsumed under the acronym “AJAX” in the past.'
