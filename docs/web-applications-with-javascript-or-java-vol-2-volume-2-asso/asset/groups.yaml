    \        break;\n      default:\n        // remove underscore prefix\n       \
    \ rec[p.substr(1)] = this[p];\n    }\n  }\n  return rec;\n}\n```\n\n## 3.5 Code\
    \ the View\n\n### 3.5.1 Showing Information About Associated Objects in Retrieve/List\
    \ All\n\nFor showing information about the authors of a book in the Retrieve/List\
