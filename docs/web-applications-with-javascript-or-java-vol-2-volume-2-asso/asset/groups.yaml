    \ 关键字定义其与 Person 的子类型关系：\n\n```\npublic class Person {\n    private String firstName;\n\
    \    private String lastName;\n    ..\n}\npublic class Student extends Person\
    \ {\n    private int studentNo;\n```\n\n# 14.2 案例研究 1：使用单继承实现类层次结构 — 161\n\n```\n\
    public Student( String first, String last, int studNo) {\n  super(firstName, lastName);\n\
    \  this.setStudNo( studNo);\n}\n```\n\n注意，在 Student 类中，我们定义了一个包含创建 Student 实例所需的所有参数的构造函数。在这个子类构造函数中，我们使用\
    \ `super` 来调用父类 Person 的构造函数。\n\n# 14.2 案例研究 1：使用单表继承实现类层次结构\n\n在本示例中，我们实现了图 12.1\
