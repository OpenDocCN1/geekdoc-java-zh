    \n第一个要考虑的选择是使用**单表继承 (STI)**、**类按表继承 (TCI)** 或 **连接表继承 (JTI)** 方法，这些方法在第 12.7.4\
    \ 节中介绍。在 STI 方法中，一个分段（或整个层次结构）由单个表表示，包含所有相关类的所有属性的列，如图 13.3 所示的示例模型。\n\n| « entity\
    \ table » | category: |\n| :--- | :--- |\n| personid[1]: number (pkey) | 1 = Author\
