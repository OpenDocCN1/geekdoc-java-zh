    \  if (categoryIndexStr) {\n    pl.v.app.displaySegmentFields(formEl, BookCategoryEL.labels,\n\
    \    parseInt(categoryIndexStr) + 1);\n  } else {\n    pl.v.app.undisplayAllSegmentFields(formEl,\
    \ BookCategoryEL.labels);\n  }\n}\n```\n\nRecall that the category selection list\
    \ contains a non-selection option \"----\" with the empty string as return value,\
    \ and a list of options formed by the enumeration labels of BookCategoryEL.labels\
    \ such that their value is the corresponding array index (starting with 0) as\
    \ string. Consequently, the variable categoryIndexStr has either the value \"\"\
    \ (empty string) or one of \"0\", \"1\", \"2\", etc.\n"
