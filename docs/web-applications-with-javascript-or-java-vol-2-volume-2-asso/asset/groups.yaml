    ## 1.2 引用完整性


    引用是我们应用程序数据库中的重要信息项。然而，只有当应用程序维护了它们的引用完整性（referential integrity）时，它们才有意义。这意味着对于任何引用，数据库中都必须存在一个被引用的对象。因此，任何域为类
    `C` 范围为类 `D` 的引用 `p` 都带有一个引用完整性约束，该约束在以下任何情况下都必须检查：


    1. 创建类型为 `C` 的新对象时；

    2. 类型为 `C` 的对象的 `p` 值被改变时；

    3. 销毁类型为 `D` 的对象时。


