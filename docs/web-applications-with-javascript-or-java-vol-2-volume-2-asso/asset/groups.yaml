    \ technique for a class hierarchy, the @Inheritance annotation (e.g. Book in our\
    \ example) must be set for the superclass, and it provides the strategy parameter\
    \ with the value InheritanceType.SINGLE_TABLE. The @DiscriminatorColumn annotation\
    \ specifies the name of the table column storing the values that discriminate\
    \ between different types of subclasses (Textbook and Biography, in our example).\n\
    \nUnfortunately, we cannot use our BookCategoryEL enumeration for defining the\
    \ type of the discriminator column, because Java expressions like BookCategoryEL.TEXTBOOK.name()\
    \ are not constant, so a Java compiler exception is thrown. Instead, we use DiscriminatorType.STRING.\
    \ The @DiscriminatorValue annotation specifies a unique value to be stored in\
    \ the discriminator column of rows representing an instance of the class.\n\n\
    Further, we define the subtypes Textbook and Biography:\n\n```\n@Entity(name=\"\
    textbooks\")\n@DiscriminatorValue(value=\"TEXTBOOK\")\n@ManagedBean(name=\"textbook\"\
