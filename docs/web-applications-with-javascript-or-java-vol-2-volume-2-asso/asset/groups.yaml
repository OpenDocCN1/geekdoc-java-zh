    public boolean equals(Object obj) {\n    if (obj instanceof Publisher) {\n   \
    \     Publisher publisher = (Publisher) obj;\n        return this.name.equals(publisher.name);\n\
    \    } else return false;\n}\n```\n\n### 4.5.3.2 编写视图代码\n\n为了在创建和更新用例中允许选择与当前编辑对象关联的对象，一个\
    \ HTML 选择列表（一个 `select` 元素）将通过 `h:selectOneMenu` 的关联对象类型的实例进行填充。位于 `WebContent/views/books/`\
    \ 文件夹下的 `create.xhtml` 文件更新如下：\n\n```xml\n<ui:composition template=\"/WEB-INF/templates/page.xhtml\"\
    >\n<ui:define name=\"content\">\n<h:form id=\"createBookForm\" styleClass=\"pure-form\
    \ pure-form-aligned\">\n```\n\n```xml\n<h:panelGrid columns=\"3\">\n\n<h:outputLabel\
    \ for=\"publisher\" value=\"Publisher:\" />\n<h:selectOneMenu id=\"publisher\"\
    \ value=\"#{book.publisher}\">\n<f:selectItem value=\"\" itemLabel=\"----\" />\n\
    <f:selectItems value=\"#{publisherCtrl.publishers}\" var=\"p\" itemLabel=\"#{p.name}\"\
    \ itemValue=\"#{p}\" />\n<f:converter converterId=\"pl.m.converter.PublisherConverter\"\
    \ />\n</h:selectOneMenu>\n<h:message for=\"publisher\" errorClass=\"error\" />\n\
    </h:panelGrid>\n<h:commandButton value=\"Create\" \naction=\"#{bookCtrl.create(book.isbn,\
    \ book.title, book.year, book.publisher.name)}\" />\n</h:form>\n</ui:openMenu>\n\
    </ui:composition>\n```\n\n转换器由 `f:converter` 元素及其关联的 `@ConverterId` 指定。该属性的值与定义转换器类时使用的\
    \ `@FacesConverter` 注解的 `value` 属性指定的必须相同，例如：\n\n```java\n@FacesConverter(value\
    \ = \"pl.m.converter.PublisherConverter\")\n```\n\n通常，可以使用转换器的本地名称（例如 `PublisherConverter`），或者在存在命名冲突风险时使用全限定名（例如\
    \ `pl.m.converter.PublisherConverter`）。我们建议在所有情况下都使用全限定名。`PublisherController`\
    \ 的 `getPublishers` 方法负责返回可用出版社列表：\n\n```java\npublic List<Publisher> getPublishers()\
    \ {\n    return em.findAll();\n}\n```\n\n书籍的创建是通过使用 `h:commandButton` 实现的。它会调用\
