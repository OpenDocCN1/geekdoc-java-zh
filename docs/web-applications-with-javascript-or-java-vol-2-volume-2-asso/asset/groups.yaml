    \ we also save the direct instances of Person (as records of the people table).\
    \ This is necessary because changes to Employee or Author instances may imply\
    \ changes of Person.instances.\n\nFor instance, for Employee data management,\
    \ we define in v/employees.js:\n\n```\npl.v.employees.manage = {\n  exit: function\
    \ () {\n    Employee.saveAll();\n    Person.saveAll();\n  },\n..\n```\n\n# 14\
    \ Subtyping with Java EE\n\nIn this chapter, we explain two case studies based\
    \ on fragments of the information model of our running example, the Public Library\
    \ app. In the first case study, we consider the single-level class hierarchy with\
    \ root Book in Figure 12.1, which is an incomplete disjoint segmentation. We use\
    \ the Single Table Inheritance approach for mapping this class hierarchy to a\
    \ single database table.\n\nIn the second case study, we consider the multi-level\
    \ class hierarchy consisting of the Person roles Employee, Manager and Author,\
    \ shown in Figure 12.8. We use the Joined Table Inheritance approach for mapping\
    \ this class hierarchy to a set of database tables that are related with each\
    \ other via foreign key dependencies.\n\nIn both cases we showed\n\n- 1. how to\
    \ derive a Java Entity class model,\n- 2. how to code the Java Entity class model\
    \ in the form of Java Entity classes,\n- 3. how to write the view and controller\
    \ code based on the model code.\n\n# 14.1 Subtyping in Java\n\nJava provides built-in\
    \ support for subtyping with its extends keyword, but it does not support multiple\
    \ inheritance. Consider the following information design model:\n\n| Person |\n\
    | :--- |\n| firstName : String |\n| lastName : String |\n| |\n| Student |\n| studNo\
    \ : Integer |\n\nFirst, we define the superclass Person. Then, we define the subclass\
