    test case remains unchanged.'
- md: "\n## 14.3 Case Study 2: Implement a Class Hierarchy with Joined Table Inheritance\n\
    \nThe starting point for our case study is the design model shown in Figure 12.8\
    \ above. In the following sections, we show how to eliminate the Manager class\
    \ using the Class Hierarchy Merge design pattern and how to implement the Person\
    \ hierarchy and use Joined, Multiple Table Inheritance storage with the help of\
    \ JPA framework.\n\n### 14.3.1 Make the Java Entity class model\n\nWe design the\
    \ model classes of our example app with the help of a Java Entity model that we\
    \ derive from the design model by essentially leaving the generalization as they\
    \ are and just adding getters and setters to each class. However, in the case\
    \ of our example app, it is natural to apply the Class Hierarchy Merge design\
    \ pattern to the segmentation of Employee for simplifying the data model by eliminating\
    \ the Manager subclass. This leads to the model shown in Figure 14.2 below. Notice\
    \ we have made two technical decisions:\n\n| Java Entity |\n| :--- |\n| Person\
    \ |\n| <get/set> personid : Integer (id) |\n| <get/set> name : String |\n| checkPersonIdAsId(in\
    \ id : String, in type) : ConstraintViolation |\n\n| enumeration |\n| :--- |\n\
    | EmployeeTypeEL |\n| MANAGER |\n\n| Java Entity |\n| :--- |\n| Employee |\n|\
    \ <get/set> empNo[1] : Integer (unique) |\n| <get/set> type(0.[1] : EmployeeTypeEL\
    \ |\n| <get/set> department(0.[1] : String |\n| checkUniqueEmpNo(in n : Integer)\
    \ : ConstraintViolation toString() : String create(in pld : Integer, in n : String,\
    \ in bio : String) retrieveAll() : Employee[*] |\n\n{disjoint, complete} |\n\n\
    | Java Entity |\n| :--- |\n| Author |\n| <get/set> biography : String |\n| toString()\
    \ : String create(in pld : Integer, in name : String, in bio : String) retrieveAll()\
    \ : Author[*] |\n\n![](img/26c953d1023457333859f69258a99556_184_0.png)\n\n- 1.\
    \ We have declared the segmentation of Person into Employee and Author to be disjoint\
    \ and complete, that is, any person is either an employee or an author. Since\
    \ Java does not support multiple classification, we cannot implement an overlapping\
    \ segmentation, as needed when modeling roles, with Java.\n- 2. We have turned\
    \ Person into an abstract class (indicated by its name in italics the class rectangle),\
    \ which means that it cannot have direct instances, but only indirect ones via\
    \ its subclasses Employee and Author. This technical design is compatible with\
    \ the fact that any Person is an Employee or Author (or both), and consequently\
    \ there is no need for any object to instantiate Directly.\n\n### 14.3.2 New Issues\n\
    \nCompared to the model of our first case study, shown in Figure 14.1 above, we\
    \ have to define the category relationships between Employee and Person, as well\
    \ as between Author and Person, using the JPA annotation.\nIn the UI we have to\
    \ take care of:\n\n- 1. Adding the views (in the folders WebContent/views/authors\
    \ and WebContent/views/employees) and controller classes (AuthController and EmployeeController)\
    \ for the corresponding Author and Person model classes.\n\n- 2. Deal with the\
    \ Manager case, by adding a \"Special type\" select control, in the forms of the\
    \ \"Create book\" and \"Update book\" use cases in WebContent/views/books/create.xhtml\
    \ and WebContent/views/books/update.xhtml. Segment property fields (i.e., department\
    \ in our example) are only displayed, and their validation is performed, when\
    \ a corresponding employee type has selected.\n\n### 14.3.3 Code the Model Classes\
    \ of the Java Entity Class\n\nThe Entity class model shown in Figure 14.2 above\
    \ is coded by using the JavaBeans Person, Employee and Author as well as for the\
    \ enumeration EmployeeCategoryEL.\n\n### 14.3.3.1 Define the Category Relationships\n\
    \nWe define the category relationships between Employee and Person, as well as\
    \ between Author and Person, using the JPA annotations. At first we create the\
    \ Person class as shown below:\n\n```java\n@Entity @Table(name=\"persons\")\n\
    @Inheritance(strategy=InheritanceType.JOINED)\n```\n\n## 14.3 Case Study 2: Implement\
    \ a Class Hierarchy with Joined Inheritance — 171\n\n```java\n@DiscriminatorColumn(name=\"\
    category\",\ndiscriminatorType=DiscriminatorType.STRING, length=16)\npublic abstract\
    \ class Person {\n    @Id @NotNull(message=\"A person ID is required!\")\n   \
    \ Integer personId;\n    @NotNull(message=\"A name is required!\") @Column(nullable=false)\n\
    \    private String name;\n}\n```\n\nComparing with the Book hierarchy shown in\
    \ Test Case 1, the @Inheritance annotation defines the strategy=InheritanceType.JOINED.\
    \ This means, for every class in the inheritance hierarchy, a database table is\
    \ used. The @DiscriminatorColumn(name=\"category\") specifies the column in the\
    \ corresponding table (i.e., persons) of the top hierarchy class (i.e., Person)\
    \ which stores the discriminator values used to identify the type of each entry\
    \ (table row).\n\nNotice that the Java class Person is declared as abstract, which\
    \ means it can't be initialized, instead we can and initialize subclasses derived\
    \ from it (i.e., Employee and Author). This also means we don't declare a @DiscriminatorValue\
    \ because no instance of Person is stored in the database table.\n\nFurther, we\
    \ define the Author class as follows:\n\n```java\n@Entity @Table(name=\"authors\"\
    )\n@DiscriminatorValue(value=\"AUTHOR\")\n@ManagedBean(name=\"author\") @ViewScoped\n\
    public class Author extends Person {\n    @NotNull(message=\"A biography is required!\"\
    )\n    private String biography;\n}\n```\n\nThe Author class inherits Person,\
    \ therefore the get and set methods corresponding to personId and name properties\
    \ are available. The @discriminatorValue(value=\"AUTHOR\") specifies the column\
    \ of the category table stores the value AUTHOR for every entry which comes from\
    \ persisting an Author instance.\nFinally, we define the Employee class:\n\n```java\n\
    @Entity @Table(name=\"employees\")\n@DiscriminatorValue(value=\"EMPLOYEE\")\n\
    @ManagedBean(name=\"employee\") @ViewScoped\npublic class Employee extends Person\
    \ {\n    @Column( nullable=false)\n```\n\n```java\n    @NotNull message=\"An employee\
    \ ID is required!\"\n    private Integer empNo;\n    @Column(nullable=false, length=32)\n\
    \    @Enumerated(EnumType.STRING)\n    private EmployeeCategoryEL type;\n    @Column(nullable=true,\
