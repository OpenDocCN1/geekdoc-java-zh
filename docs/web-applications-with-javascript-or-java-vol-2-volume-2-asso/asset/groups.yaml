- md: "\n## 106 9 Implementing Bidirectional Associations with Java EE\n\nFor instance,\
    \ for the multi-valued reference property Book::authors that is coupled to the\
    \ derived inverse reference property Author::authoredBooks for implementing the\
    \ bidirectional association between Book and Author, the addAuthor method is coded\
    \ in the following way:\n\n```java\npublic class Book {\n  ..\n  public void addAuthor(Author\
    \ author) {\n    if (this.authors == null) {\n      this.authors = new HashSet<Author>();\n\
    \    }\n    if (!this.authors.contains(author)) {\n      // add the new author\
    \ reference\n      this.authors.add(author);\n      // add the derived inverse\
    \ reference\n      author.addAuthoredBook(this);\n    }\n  }\n}\n```\n\nFor the\
    \ removal removeAuthor we obtain the following code:\n\n```java\npublic class\
    \ Book {\n  ..\n  public void removeAuthor(Author author) {\n    if (this.authors\
    \ != null && author != null &&\n        this.authors.contains(author)) {\n   \
    \   // delete the author reference\n      this.authors.remove(author);\n     \
    \ // delete the derived inverse reference\n      author.removeAuthoredBook(this);\n\
    \    }\n  }\n}\n```\n\nRemember, for a Java Collection, such as Set or List, the\
    \ contains method compares two objects by using the equals method of the objects.\
    \ For example, for using the contains method over a Set<Author>, such as publishedBooks,\
    \ in the Author class we implement the following equals method (two authors are\
    \ equal if their personId property values are):\n\n```java\npublic class Author\
    \ {\n  @Override\n  public boolean equals(Object obj) {\n    if (obj instanceof\
    \ Author) {\n      Author author = (Author) obj;\n      return this.personId.equals(author.personId);\n\
    \    } else return false;\n  }\n}\n```\n\n### 9.2.6 Take Care of Deletion Dependencies\n\
    \nWhen a Book instance b, with a single reference b.publisher to a Publisher instance\
    \ p and multiple references b.authors to Author instances, is destroyed, the derived\
    \ inverse references have to be removed first (e.g., by removing b from p.publishedBooks).\
    \ This is accomplished by calling the methods for the single and multi-valued\
    \ properties with a null parameter, e.g., b.setPublisher(null) and b.setAuthors(null)\
    \ within the Book.delete method:\n\n```java\npublic class Book {\n  public static\
    \ void delete(EntityManager em, UserTransaction ut, String isbn) throws Exception\
    \ {\n    ut.begin();\n    Book b = em.find(Book.class, isbn);\n    b.setPublisher(null);\n\
    \    b.setAuthors(null);\n    em.remove(b);\n    ut.commit();\n  }\n}\n```\n\n\
    In the same way, we have to take care of deleting the references to Book instances\
    \ when deleting a Publisher or an Author instance:\n\n```java\npublic class Author\
    \ {\n  ..\n  public static void delete(EntityManager em,\n    UserTransaction\
    \ ut, Integer personId) throws Exception {\n    ut.begin();\n    Author a = em.find(Author.class,\
    \ personId);\n    a.setAuthoredBooks(null);\n    em.remove(a);\n    ut.commit();\n\
    \  }\n}\n```\n\nAnd, likewise,\n\n```java\npublic class Publisher {\n  public\
    \ static void delete(EntityManager em,\n    UserTransaction ut, String name) throws\
    \ Exception {\n    ut.begin();\n    Publisher p = em.find(Publisher.class, name);\n\
    \    p.setPublishedBooks(null);\n    em.remove(p);\n    ut.commit();\n  }\n}\n\
    ```\n\n### 9.2.7 Entity Managers and Cached Entities\n\nUnfortunately, JPA does\
    \ not provide automatic maintenance of inverse references. According to the Java\
    \ Persistence Wiki, we have to implement the (direct and inverse) relations management\
    \ with set/add/remove methods:\n\n> A common problem with bidirectional relationships\
    \ is the application updates one side of the relationship, while the other side\
    \ does not get updated, and becomes out of sync. In JPA, as in general, it is\
    \ the responsibility of the application or the object model to maintain relationships.\
    \ If your application adds to one side of relationship, then it must add to the\
    \ other side. This is commonly resolved through add or set methods in the object\
    \ model that handle both sides of the relationships, so the application code does\
    \ not need worry about it. There are two ways to go about this: you can either\
    \ add the relationship maintenance code to one side use the setter from that side\
    \ (such as making the other side protected), or add to both sides and ensure you\
    \ avoid an infinite loop.\n\nWe have used an entity manager for each controller\
    \ class. Every entity manager maintains a set of cached entities which can be\
    \ “shared” with other entity managers using the merge method. In our example code,\
    \ as part of the create and update methods of each model class, we have to merge\
    \ the entities that belong to another entity manager. For example, in the Book.create\
    \ method, we need to merge the new book's publisher, managed by the PublisherController's\
    \ entity manager, and all its authors, managed by the AuthorController's entity\
    \ manager:\n\n```java\npublic class Book {\n    public static void create(EntityManager\
    \ em,\n        UserTransaction ut,\n        String isbn, String title, Integer\
    \ year,\n        Publisher publisher, Set<Author> authors)\n    throws Exception\
    \ {\n    ut.begin();\n    Book book = new Book(isbn, title, year,\n        publisher,\
    \ authors);\n    em.persist(book);\n    if (publisher != null) {\n        em.merge(publisher);\n\
    \    }\n    if (authors != null) {\n        for (Author a : authors) {\n     \
    \       em.merge(a);\n        }\n    }\n    ut.commit();\n}\n```\n\n### 9.3 Exploiting\
    \ Inverse Properties in the User Interface\n\nIn the case of unidirectional associations,\
    \ for the case of authors, we used a method in the Book model class, i.e., getAuthorNames(),\
    \ which returns a comma-separated list of author names as a string:\n\n```java\n\
    public class Book {\n  ..\n  public String getAuthorNames() {\n    String result\
    \ = \"\";\n    int i = 0, n = 0;\n    if (this.authors != null) {\n      n = this.authors.size();\n\
    \      for (Author author : this.authors) {\n        result += author.getName();\n\
    \        if (i<n-1) {\n            result += \" \";\n        }\n        i++;\n\
    \      }\n    }\n    return result;\n  }\n}\n```\n\nPublisher may have large number\
    \ of books. As a better alternative to our string serialization, we can use a\
    \ JSF converter class which allows us to present the list of authors in a custom\
    \ way. In our case, we choose to present it as list of names, where every name\
    \ is presented on a separate line. And we annotate it with @FacesConverter as\
    \ follows:\n\n```java\n@FacesConverter(value=\"p.m.converter.BookListConverter\"\
    )\npublic class ListConverter implements Converter {\n    @Override\n    public\
    \ Object getAsObject(FacesContext context,\nUIComponent component, String value)\
    \ {\n        return null; // this method is not needed\n    }\n```\n\n```java\n\
    \    @Override\n    public String getAsString(FacesContext context,\nUIComponent\
    \ component, Object value) {\n    String result = \"\";\n    int i=0, n=0;\n \
    \   if (value == null) {\n        return null;\n    } else if (value instanceof\
    \ Set<?>) {\n        n = ((Set<Book>)value).size();\n        for (Book b : (Set<Book>)\
    \ value) {\n            result += b.getTitle();\n            if (i<n-1) {\n  \
    \              result += \"<br/>\";\n            }\n        }\n    }\n    i++;\n\
    \    return result;\n    }\n}\n```\n\nWe use the converter in the XHTML page:\n\
    \n```xml\n<ui:composition template=\"/INF/templates/page.xhtml\">\n<ui:define\
    \ name=\"content\">\n<h:dataTable value=\"#{publisherController.publishers}\"\
    \ var=\"p\">\n<h:column>\n<f:facet name=\"Published books</f:facet>\n<h:outputText\
    \ value=\"#{p.publishedBooks}\" escape=\"false\" converter=\"#{p.m.converter.BookListConverter}\"\
    />\n</h:column>\n</h:dataTable>\n<h:button value=\"Back\" outcome=\"index\" />\n\
    </ui:define>\n</ui:composition>\n```\n"
  mdcn: "\n\n## 106 9 使用 Java EE 实现双向关联\n\n例如，对于多值引用属性 `Book::authors`，它与派生的反向引用属性\
    \ `Author::authoredBooks` 耦合，以实现 `Book` 和 `Author` 之间的双向关联，`addAuthor` 方法的代码如下：\n\
    \n```java\npublic class Book {\n  ..\n  public void addAuthor(Author author) {\n\
    \    if (this.authors == null) {\n      this.authors = new HashSet<Author>();\n\
    \    }\n    if (!this.authors.contains(author)) {\n      // 添加新的作者引用\n      this.authors.add(author);\n\
    \      // 添加派生的反向引用\n      author.addAuthoredBook(this);\n    }\n  }\n}\n```\n\
    \n对于删除操作 `removeAuthor`，我们得到以下代码：\n\n```java\npublic class Book {\n  ..\n  public\
    \ void removeAuthor(Author author) {\n    if (this.authors != null && author !=\
    \ null &&\n        this.authors.contains(author)) {\n      // 删除作者引用\n      this.authors.remove(author);\n\
    \      // 删除派生的反向引用\n      author.removeAuthoredBook(this);\n    }\n  }\n}\n```\n\
    \n记住，对于 Java 集合（如 `Set` 或 `List`），`contains` 方法通过使用对象的 `equals` 方法来比较两个对象。例如，为了\
    \ `Author` 类对 `Set<Author>`（如 `publishedBooks`）使用 `contains` 方法，我们实现了以下 `equals`\
    \ 方法（如果两个作者的 `personId` 属性值相等，则认为它们相等）：\n\n```java\npublic class Author {\n  @Override\n\
    \  public boolean equals(Object obj) {\n    if (obj instanceof Author) {\n   \
    \   Author author = (Author) obj;\n      return this.personId.equals(author.personId);\n\
    \    } else return false;\n  }\n}\n```\n\n### 9.2.6 处理删除依赖\n\n当一个 `Book` 实例 `b`（具有单一引用\
    \ `b.publisher` 指向 `Publisher` 实例 `p` 以及多个引用 `b.authors` 指向 `Author` 实例）被销时，必须首先移除派生的反向引用（例如，通过从\
    \ `p.publishedBooks` 中移除 `b`）。这是通过在 `Book.delete` 方法中调用单一值和多值属性的方法并传入 `null` 参数来实现，例如\
    \ `b.setPublisher(null)` 和 `b.setAuthors(null)`：\n\n```java\npublic class Book\
    \ {\n  public static void delete(EntityManager em, UserTransaction ut, String\
    \ isbn) throws Exception {\n    ut.begin();\n    Book b = em.find(Book.class,\
    \ isbn);\n    b.setPublisher(null);\n    b.setAuthors(null);\n    em.remove(b);\n\
    \    ut.commit();\n  }\n}\n```\n\n同样地，在删除 `Publisher` 或 `Author` 实例时，我们必须处理对 `Book`\
    \ 实例引用的删除：\n\n```java\npublic class Author {\n  ..\n  public static void delete(EntityManager\
    \ em,\n    UserTransaction ut, Integer personId) throws Exception {\n    ut.begin();\n\
    \    Author a = em.find(Author.class, personId);\n    a.setAuthoredBooks(null);\n\
    \    em.remove(a);\n    ut.commit();\n  }\n}\n```\n\n同样地，\n\n```java\npublic class\
    \ Publisher {\n  public static void delete(EntityManager em,\n    UserTransaction\
    \ ut, String name) throws Exception {\n    ut.begin();\n    Publisher p = em.find(Publisher.class,\
    \ name);\n    p.setPublishedBooks(null);\n    em.remove(p);\n    ut.commit();\n\
    \  }\n}\n```\n\n### 9.2.7 实体管理器与缓存实体\n\n遗憾的是，JPA 不提供对反向引用的自动维护。根据 Java Persistence\
    \ Wiki，我们必须通过 `set/add/remove` 方法来实现对（直接和反向）关系的管理：\n\n> 双向关系中的一个常见问题是应用程序更新了关系的一侧，而另一侧没有更新，导致不同步。在\
    \ JPA 中，与通常情况一样，维护关系是应用程序或对象模型的责任。如果你的应用程序向关系的一侧添加了内容，那么它也必须向另一侧添加。这通常通过对象模型中处理关系双边的\
    \ `add` 或 `set` 方法来解决，这样应用程序代码就不需要担心这个问题。有两种方法：你可以在一侧添加该关系的维护代码并使用该侧的 setter（例如将另一侧设为\
    \ `protected`），或者在双侧都添加并确保避免无限循环。\n\n我们为每个控制器类使用了一个实体管理器（entity manager）。每个实体管理器都维护一组缓存实体，这些实体可以通过\
    \ `merge` 方法与其他实体管理器进行“共享”。在我们的示例代码中，作为每个模型类 `create` 和 `update` 方法的一部分，我们必须合并属于另一个实体管理器的实体。例如，在\
    \ `Book.create` 方法中，我们需要合并新书籍的出版商（由 `PublisherController` 的实体管理器管理）以及它所有的作者（由\
    \ `AuthorController` 的实体管理器管理）：\n\n```java\npublic class Book {\n    public static\
    \ void create(EntityManager em,\n        UserTransaction ut,\n        String isbn,\
    \ String title, Integer year,\n        Publisher publisher, Set<Author> authors)\n\
    \    throws Exception {\n    ut.begin();\n    Book book = new Book(isbn, title,\
    \ year,\n        publisher, authors);\n    em.persist(book);\n    if (publisher\
    \ != null) {\n        em.merge(publisher);\n    }\n    if (authors != null) {\n\
    \        for (Author a : authors) {\n            em.merge(a);\n        }\n   \
    \ }\n    ut.commit();\n}\n```\n\n### 9.3 在用户界面中利用反向属性\n\n在单向关联的情况下，对于作者的情况，我们在\
    \ `Book` 模型类中使用了一个方法 `getAuthorNames()`，它返回一个用逗号分隔的作者名称列表字符串：\n\n```java\npublic\
    \ class Book {\n  ..\n  public String getAuthorNames() {\n    String result =\
    \ \"\";\n    int i = 0, n = 0;\n    if (this.authors != null) {\n      n = this.authors.size();\n\
    \      for (Author author : this.authors) {\n        result += author.getName();\n\
    \        if (i<n-1) {\n            result += \" \";\n        }\n        i++;\n\
    \      }\n    }\n    return result;\n  }\n}\n```\n\n出版社可能有大量的书籍。作为序列化的更好的替代方案，可以使用\
    \ JSF 转换类以自定义的方式展示作者列表。在我们的案例中，我们选择以列表的形式展示，每个名称单独占一行。并使用 `@FacesConverter` 对其注解如下：\n\
    \n```java\n@FacesConverter(value=\"p.m.converter.BookListConverter\")\npublic\
    \ class ListConverter implements Converter {\n    @Override\n    public Object\
    \ getAsObject(FacesContext context,\nUIComponent component, String value) {\n\
    \        return null; // 此方法不需要\n    }\n```\n\n```java\n    @Override\n    public\
    \ String getAsString(FacesContext context,\nUIComponent component, Object value)\
    \ {\n    String result = \"\";\n    int i=0, n=0;\n    if (value == null) {\n\
    \        return null;\n    } else if (value instanceof Set<?>) {\n        n =\
    \ ((Set<Book>)value).size();\n        for (Book b : (Set<Book>) value) {\n   \
    \         result += b.getTitle();\n            if (i<n-1) {\n                result\
    \ += \"<br/>\";\n            }\n        }\n    }\n    i++;\n    return result;\n\
    \    }\n}\n```\n\n我们在 XHTML 页面中使用该转换器：\n\n```xml\n<ui:composition template=\"\
    /INF/templates/page.xhtml\">\n<ui:define name=\"content\">\n<h:dataTable value=\"\
    #{publisherController.publishers}\" var=\"p\">\n<h:column>\n<f:facet name=\"Published\
    \ books</f:facet>\n<h:outputText value=\"#{p.publishedBooks}\" escape=\"false\"\
    \ converter=\"#{p.m.converter.BookListConverter}\"/>\n</h:column>\n</h:dataTable>\n\
    <h:button value=\"Back\" outcome=\"index\" />\n</ui:define>\n</ui:composition>\n\
    ```\n\n"
