    \ ${this.year}`;\n  if (this.publisher) bookStr += `, publisher: ${this.publisher.name}`;\n\
    \  return bookStr + `, authors: ` + Object.keys(this.authors).join(\", \");\n\
    }\n```\n\nThe Book::toRecord() function needs to serialize all property slots.\
    \ It deletes the underscore prefix for the corresponding record:\n\n```javascript\n\
    toRecord() {\n  var rec = {};\n  for (let p of Object.keys(this)) {\n    // copy\
