    \ dependency arrows (representing foreign key dependencies) that are annotated\
    \ at source end with the name of subtable's primary key (here: personId).\n\n\
    ### 13.3.3 New Issues\n\nCompared to the model of our first case study, shown\
    \ in Figure 13.1 above, we have to deal with a number of new issues in the model\
    \ code:\n\n1. Defining the subtype relationships between Employee and Person,\
