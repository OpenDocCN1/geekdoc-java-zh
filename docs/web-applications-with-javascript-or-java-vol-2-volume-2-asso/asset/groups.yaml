    \ 中定义：\n\n```\npl.v.employees.manage = {\n  exit: function () {\n    Employee.saveAll();\n\
    \    Person.saveAll();\n  },\n..\n```\n\n# 14 使用 Java EE 进行子类型化\n\n在本章中，我们将基于我们的运行示例（公共图书馆应用）的信息模型片段，解释两个案例研究。在第一个案例研究中，我们考虑了图\
    \ 12.1 所示的以 Book 为根的单级类层次结构，这是一个不完全的不相交划分。我们使用单表继承（Single Table Inheritance）方法将此类层次结构映射到单个数据库表。\n\
    \n在第二个案例研究中，我们考虑了图 12.8 所示的由 Employee、Manager 和 Author 角色组成的多级类层次结构。我们使用连接表继承（Joined\
    \ Table Inheritance）方法将此类层次结构映射到一组通过外键依赖相互关联的数据库表。\n\n在两种情况下，我们都展示了：\n\n- 1. 如何推导出\
