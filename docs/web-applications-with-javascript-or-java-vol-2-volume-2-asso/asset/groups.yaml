    # 1.5 Adding Directionality to a Non-Directed Association


    not support associations as first class citizens. They do not have a language
    element defining associations. Consequently, an OOP class design model, which
    we call OO class model, must not contain any explicit association.


    # 1.5 Adding Directionality to a Non-Directed Association


    When we make an information model in the form of a UML class diagram, we typically
    end up with a model containing one or more associations that do not have any ownership
    for their ends, as, for instance, in Figure 1.4. When there is no ownership dot
    at either end of association, such as in this example, this means the model does
    not specify how the association is to be represented (or realized) with the help
    of reference properties. Such an association does not have any direction. According
    to the UML 2.5 specification, the ends of such association are "owned" by itself,
    and not by any of the classes participating in it.


    | chairedCommittee | ClubMember |

    |---|---|---|

    | name : String | 0.1 | 1 |


    Figure 1.4: A model of a non-directed association between Committee and ClubMember.


    An information design model that contains an association without association end
    ownership dots is acceptable as a relational database design model, but it is
    incomplete as a design model for OOP languages.


    For instance, the Model of Figure 1.4 provides a relational database design with
    entity tables, committees and clubmembers, and a separate one-to-one relationship
    table committee_clubmember_as_chair. But it does not provide a design of Java
    classes, since it does not specify how the association is to be implemented with
    the help of reference properties.


    There are three options how to turn an information design model of a non-directed
    association (without any association ownership dots) into an information model
    where all associations are either unidirectional or bidirectional: we can place
    an ownership dot at either end or at both ends of the association. Each of these
    three options defines a different way to represent, or implement, the association
    with the help of reference properties. So, for the association shown in Figure
    1.4 above, we have the following options:


    - 1. Place an ownership dot at the chair association end, leading to the model
    shown in Figure 1.2, which can be transformed into the OO class model shown in
    Figure 1.1 above.


