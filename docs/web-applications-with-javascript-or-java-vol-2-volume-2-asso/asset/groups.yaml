    ```\n\n注意，构造函数使用 ES2015 的函数参数解构功能通过单个记录参数进行定义。\n我们按照以下方式为 `category` 属性编码 `checkCategory`\
    \ 和 `setCategory` 方法：\n\n```javascript\nstatic checkCategory(c) {\n  if (c ===\
