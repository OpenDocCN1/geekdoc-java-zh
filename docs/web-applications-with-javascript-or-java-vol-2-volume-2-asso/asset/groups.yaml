    | name: String | |

    | chair: ClubMember | |


    图 1.1: 委员会通过引用属性 `chair` 表达其拥有一个俱乐部成员。


    面向对象的编程语言（如 JavaScript、PHP、Java 和 C#）直接支持引用属性的概念，即该属性的引用不是数据类型，而是引用类型或类，其值是指向该类实例的对象引用。


    默认情况下，属性的重基数（multiplicity）为 1，这意味着该属性是强制的且功能性的（换句话说，是单值的），恰好有一个值，例如图 1.1 所示 `Committee`
    类中的 `chair` 属性。功能性属性是可选的（非强制），重基数位 0..1，这意味着该属性的最小基数为 0，最大基数为 1。


    引用属性可以是单值的的（功能性的），也可以是多值的（非功能性的）。例如，图 1.1 所示的 `Committee::chair` 属性是单值的，因为它为俱乐部分配了一个唯一的俱乐部成员作为主席。多值引用属性的示例是图
    1.11 所示的 `Book::authors` 属性。


