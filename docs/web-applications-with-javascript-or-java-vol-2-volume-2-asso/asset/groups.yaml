    \ *Java 实体模型*。提示：添加检查和 setter 方法。\n- 3. 按照指南编写你的 JS 类模型或 Java 实体模型。\n\n### 6.1\
    \ 为电影分配导演和演员\n\n此项目基于下方所示的信息设计模型。之前的应用程序需要扩展，以增加管理电影导演和演员数据的功能。这是通过添加 `Person`\
    \ 模型类以及 `Movie` 与 `Person` 之间的两个单向关联来实现的：\n\n- 1. 多对一关联，分配恰好一个人作为电影的**导演**；\n\
    - 2. 多对多关联，分配零个或多个个人作为电影的**演员**。\n\n![](img/26c953d1023457333859f69258a99556_94_0.png)\n\
