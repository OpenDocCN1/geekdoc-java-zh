    \n子类型化和继承关系已经在面向对象编程（OOP）、数据库语言（如 SQL99）、XML 架构语言 XML Schema 以及其他计算语言中以各种方式和不同程度得到了支持。其核心在于，计算语言中的子类型化关于定义层次结构以及特征的继承：OOP\
