    ## 7 Bidirectional Associations


    In OO modeling and programming, a bidirectional association is an association
    that is represented as a pair of mutually inverse reference properties, which
    allow ''navigation'' (object access) in both directions.

    The model shown in Figure 7.1 below (about publishers, books and their authors)
    serves as our running example. Notice that it contains two bidirectional associations,
    as indicated by the ownership dots at both association ends.


    | Publisher | published Books | Book | authored Books | Author |

    | :--- | :--- | :--- | :--- | :--- |

    | name : String (id) | | isbn : String (id) | | | personid : Integer (id) |

    | address : String | 0.1 | * | year : Integer | * | name : String |


    Figure 7.1: The Publisher-Book-Author information design model with two bidirectional
    associations.


    ## 7.1 Inverse Properties


    For being able to easily retrieve the committees that are chaired or co-chaired
    by a club member, we add two reference properties to our Committee-ClubMember
    example: the property of a club member to be the chair of a committee (ClubMember::sharedCommittee)
    and the property of a club member to be the chair-of-a-committee (ClubMember::coChairedCommittee)
    may chair or co-chair at one committee (where the disjunction is non-exclusive).
    So, we get the following model:


    | Committee | ClubMember |

    | :--- | :--- |

    | name : String | chairedCommittee[0..] : Committee |

    | chair : ClubMember | coChairedCommittee[0..] : Committee |


    Notice that there is a close correspondence between the two reference properties
    Committee::chair and ClubMember::chairedCommittee. They are the inverse of each
    other: when the club member Tom is the chair of the budget committee, expressed
    by the tuple ("budget committee", "Tom"), then the budget committee is the chaired
    by the club member Tom, expressed by the inverse tuple ("Tom", "budget committee").
    For expressing this inverse correspondence in the diagram, we append an inverse
    property constraint, inverse of chair, in curly braces to the declaration of the
    property ClubMember::chairedCommittee, and a similar one to the property Committee::chair,
    as shown in the following diagram:


    | Committee | ClubMember |

    | --- | --- |

    | name : String | chairedCommittee[0..1] : Committee (inverse of chair) |

    | chair : ClubMember (inverse of chairedCommittee) | coChairedCommittee[0..1]
    : Committee |


    Using the reference path notation of OOP languages, with c referencing a Committee
    object, we obtain the equation:


    ```

    c.chair.chairedCommittee = c (7.1)

    ```


    Or, the other way around, m referencing a ClubMember object, we obtain the equation:


    ```

    m.chairedCommittee.chair = m (7.2)

    ```


    Notice when the property $p_2$ is the inverse of a property $p_1$, this implies
    that, the other way around, $p_1$ is the inverse of $p_2$. Therefore, we declare
    the property ClubMember::chairedCommittee to be the inverse of Committee::chair,
    then, implicitly, Committee::chair is the inverse of ClubMember::chairedCommittee.
    We therefore call them mutually inverse reference properties. Having such a pair
    in a model implies *redundancy* because each of the two inverse reference properties
    can be derived from the other by inversion. This type of redundancy implies *data
    storage overhead* and *update-overhead*, which is the price to pay for the bidirectional
    navigability that supports efficient object access in both directions.


    For maintaining the duplicate information of a mutually inverse reference property,
    it is common to treat one of the inverse properties as the *master*, and the other
    one as the *slave*, and take this distinction in consideration in the code of
    the methods (such as the property setters) of the affected model classes. We indicate
    the slave of an inverse reference property pair in a model diagram by be *derived*
    using the UML notation of a slash prefix of the name as shown in the following
    diagram:


    | Committee | ClubMember |

    | --- | --- |

    | name : String | chairedCommittee[0..1] : Committee (inverse of chair) |

    | chair : ClubMember | coChairedCommittee[0..1] : Committee |


    The property chairedCommittee in ClubMember is now *derived* (as indicated by
    its slash). Its annotation {inverse of chair} defines a *derivation rule* according
    to which it is derived by inverting the property Committee::chair.


    ## 7.1 Inverse Properties


    In a UML class diagram, the derivation of a property can be specified by an OCL
    derive expression that evaluates the value of the property for a given object.
    In the case of a property being the inverse of another property, specified by
    the constraint expression (inverse of anotherProperty) appended to the property,
    the derivation expression is implied. In our example, for any club member m, it
    evaluates to the object c that c.chair = m. In OCL, this derivation would be evaluated
    like object


    ```

    context ClubMember::chairedCommittee: Committee

    drive:

    if Committee.allInstances().exists(c | c.chair = self) then c

    ```


    There are two ways to realize the derivation of a property: it may be derived
    via a read-time computation of its value, or it may be derived on update via an
    update-time computation performed whenever one of the variables in the derivation
    expression (typically, another property) changes its value. The latter case responds
    to a materialized view in a database. While a reference property that is derived
    on read may not guarantee efficient navigation, the on-read property derived on
    update has to provide efficient navigation.


    When we designate an inverse reference property as derived by prefixing it with
    a slash (/), we indicate that it is derived on update. For instance, the property
    /chairedCommittee in the example above is derived on update from the property
    chair.


    In the case of a derived reference property, we have to deal with life-cycle dependencies
    between the affected model classes requiring special change management mechanisms
    based on the functionality of the represented association (either one-to-one,
    many-to-one or many-to-many).


    In our example of the derived inverse reference property ClubMember::cha, which
    is single-valued and optional, this means that

    1. whenever a new member object is created (with a mandatory chair assignment),
    the corresponding ClubMember::chairedCommittee property has to be assigned accordingly;

    2. whenever the chair property is updated (that is, a new chair is assigned to
    a committee), the corresponding ClubMember::chairedCommittee property has to be
    unset for the club member who was the previous chair and set for the one being
    the new chair;

    3. whenever a committee object is destroyed, the corresponding ClubMember::chairedCommittee
    property has to be unset.

