    \ : String) : ConstraintViolation | checkRefIn(in : String) : ConstraintViolation\
    \ | checkAddress(in : String) : ConstraintViolation | toString() : string | toRecord()\
    \ : Object |\n\n# Author\n\n## 8.2 编写模型代码\n\n可以直接为 JS 类模型以获取我们 JavaScript 前端应用模型层代码。\n\
    \n### 8.2.1 新问题\n\n与单向关联应用相比，我们必须处理许多新的技术问题：\n\n- 我们定义了派生反向引用属性（如 Publisher::publishedBooks），但不包含检查操作，也不包含设置操作。\n\
