    \ 角色类层次结构的 JS 类模型。\n\n### 13.3.2 构建 JS 实体表模型\n\n由于我们使用浏览器的 Local Storage 作为示例应用的持久化存储技术，我们必须处理简单的键值存储。对于每个具有单数（大写）名称\
