    \ property is destroyed (e.g., a Book instance with a single reference b.publisher\
    \ to a Publisher instance p is destroyed), the derived inverse references have\
    \ to be removed first (e.g., by removing p from publishedBooks). Notice that when\
    \ a new object is created with a single reference or multiple as the value of\
    \ a master reference property (e.g., a new Book with a single reference b.publisher),\
    \ its setter or add method will be invoked and take care of the\n\nIn the UI code\
    \ we can now exploit the inverse reference, for instance.\n\n## 9.2.2 Summary\n\
    \n1. Code the bidirectional association.\n2. Code the inverse reference property\
    \ in the model class.\n3. Code the inverse property with the JPA annotation.\n\
    4. Code the constraints with Java annotations.\n5. Code the getters and setters\
    \ as well as the add and remove methods.\n6. Code the create, update and delete\
    \ operations.\n7. Code the inverse reference in the following sections.\n\n##\
    \ 9.2.3 Code Each Class of the Java Entity Model\n\nIn the Publisher class, we\
    \ add the publishedBooks property and we use the @OneToMany annotation corresponding\
    \ to @ManyToOne from the Book class:\n\n```\npublic class Publisher {\n  ..\n\
    \  @OneToMany(fetch=FetchType.EAGER, mappedBy=\"publisher\")\n  private Set<Book>\
    \ publishedBooks;\n}\n```\n\nThe mappedBy parameter of the @OneToMany annotation\
    \ of publishedBooks specifies the property in the Book class:\n\n```getpublic\
    \ class Book {\n  ..\n  @ManyToOne(fetch=FetchType.EAGER)\n  @JoinColumn(name=\"\
    PUBLISHER_ID\")\n  private Publisher publisher;\n}\n```\n\nIn the Author class\
    \ we add the authoredBooks property with the @ManyToMany annotationget to @ManyToMany\
    \ from the Book class:\n\n```\npublic class Author {\n  ..\n  @ManyToMany(fetch=FetchType.EAGER,\
    \ mappedBy=\"authors\")\n  private Set<Book> authoredBooks;\n}\n```\n\nThe mappedBy\
    \ attribute of the @ManyToMany annotation for authoredBooks property specifies\
    \ the name of the inverse property in the Book class:\n\n```\npublic class Book\
    \ {\n  ..\n  @ManyToMany(fetch=FetchType.EAGER)\n  @JoinTable(\n    name=\"books_authors\"\
    ,\n    joinColumns = @JoinColumn(name=\"BOOK_ISBN\"),\n    inverseJoinColumns\
    \ = @JoinColumn(name=\"AUTHOR_PERSONID\")\n  )\n  private Set<Author> authors;\n\
    }\n```\n\nWe also use the @JoinTable annotation to specify the join table name\
    \ for the Many-To-Many relation and the corresponding column names for the join\
    \ table, e.g., the table is books_authors and the columns are BOOK_ISBN and AUTHOR_PERSONID.\n\
    \n## 9.2.4 Code the Setter Operations\n\nAny setter for a reference property that\
    \ is coupled to a derived inverse reference property (implementing a bidirectional\
    \ association), now also needs to assign/add/remove inverse references to/from\
    \ (the value set) of the inverse property. An example of such a setter is the\
    \ following setPublisher method:\n\n```\npublic class Book {\n  ..\n  public void\
