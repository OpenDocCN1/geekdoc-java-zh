    \ divElems = document.getElementsByTagName(\"div\");\n// an HTMLCollection is\
    \ iterable\nfor (let dEl of divElems) {\n  console.log(dEl.id);\n}\n```\n\nA *for-of*\
    \ loop is often more handy than a *for* loop whenever a counter variable is not\
    \ needed. As opposed to a *forEach* loop, a *for-of* loop allows iterating HTMLCollections\
    \ and can be abandoned with break.\n\n### 2.1.4 Template Literals\n\n... are enclosed\
    \ by backtick characters (like `...` ) instead of double or single quotes and\
    \ allow a concise syntax for (possibly multi-line) string values resulting from\
    \ a combination of fixed text parts and variables/expressions. For instance,\n\
    \n```\nconst classValues = \"card important\";\nconst name = \"Joker\";\nconst\
    \ htmlTemplate = `<div`\n```\n\n### 2.1.5 Spread Operator\n\n... allows spreading\
    \ (1) the elements of an iterable in places where arguments are expected, or (2)\
    \ the fields of an object into new objects. For instance,\n\n```\nconst user =\
    \ {name: \"Alice\", age: 30};\nconst {name, ...rest} = user;\n```\n\n### 2.1.6\
    \ Destructuring\n\nUsing destructuring, the parameter fields are assigned to ordinary\
