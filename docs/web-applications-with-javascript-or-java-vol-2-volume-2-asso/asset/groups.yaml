    \        } catch (Exception e1) {\n            e1.printStackTrace();\n       \
    \ }\n        e.printStackTrace();\n    } catch (Exception e) {\n        e.printStackTrace();\n\
    \    }\n    return \"create\";\n}\n```\n\nThe update book case is similar to the\
    \ create book use case.\n\n## 5.6 Run the App and Get the Code\n\nFor running\
    \ your application, you may first have to stop your Tomcat/TomEE server (with\
    \ bin/shutdown.bat for Windows or bin/shutdown.sh for Linux). Next, down-load\
    \ and unzip our ZIP file containing all the source code of the app and the ANT\
    \ script file that you have to edit (modify the server.folder property value).\n\
    \nNow, execute the deploy command in your console or terminal:\n\n```bash\nant\
    \ deploy -Dapp=Unidirectional\n```\n\nFinally, start your Tomcat server (using\
    \ bin/shutdown.bat for Windows or bin/shutdown.sh for Linux). Please be patient,\
    \ this can take some time. It will be ready when you open a browser by:\n\nhttp://localhost:8080/UnidirectionalApp/views/index.xhtml\n\
    \n## 5.7 Sets Versus Ordered Sets as the Values\n\nRecall that a set is an unordered\
    \ collection that has unique elements, while a list is an ordered collection that\
    \ may contain the same element than once. When a non-functional association is\
    \ ordered, like Book::authors in Figure 5.1, this implies that the range of the\
    \ corresponding property needs to be an ordered collection.\n\n| Book | authored\
    \ | Author |\n|---|---|---|\n| <std> isbn : String | | <std> personid : Integer\
    \ |\n| title : String | | name : String |\n| year : Integer | * | (ordered) |\n\
    \nIn theory, set-valued properties should be defined with Set<T>, such as Set<Book>\
    \ as the range of authoredBooks, while ordered-set-valued properties should be\
    \ defined with SortedSet<T>, such as SortedSet<Author> as the range of authors.\
    \ The Java interface is typically implemented by HashSet, while SortedSet by TreeSet.\n\
    \nHowever, if there is no concern about avoiding duplicate elements, both set-valued\
    \ and ordered-set-valued properties can also be defined with the generic interface\
    \ type List<T> as their range, which is typically implemented by ArrayList.\n\n\
    ## 6 Unidirectional Associations Practice Projects\n\nAll projects include the\
    \ following tasks:\n\n- 1. Make an **OO class model** derived from the given design\
    \ model. Hint: replace associations with corresponding reference properties.\n\
    - 2. Make a *JavaScript class model* or a *Java Entity class model* derived from\
    \ the OO class model. Hint: add check and setter methods.\n- 3. Code your JS class\
    \ model or Java Entity class model, following the provided guidelines.\n\n###\
    \ 6.1 Assign a Director and Actors to a Movie\n\nThis project is based on the\
    \ information design model shown below. The app from the previous assignments\
    \ is to be extended by adding the possibility to manage data about the actors\
    \ and the director of a movie. This is achieved by adding a model class Person\
    \ and two unidirectional associations between **Movie** and **Person**:\n\n- 1.\
    \ a many-to-one association assigning exactly one person as the **director** of\
    \ a movie, and\n- 2. a many-to-many association assigning zero or more persons\
    \ as the **actors** of a movie.\n\n![](img/26c953d1023457333859f69258a99556_94_0.png)\n"
