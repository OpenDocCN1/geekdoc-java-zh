    \ from the corresponding value of the derived inverse reference property (such\
    \ as removing b from p.publishedBooks), if the derived inverse reference property\
    \ is multi-valued, otherwise the corresponding value of the derived inverse reference\
    \ property has to be unset or updated;\n\nNotice when a new is created with single\
