    +   - the render attribute used with f:ajax specifies which of the JSF components
    are to be updated . This is needed because the live DOM changes (client side,
    server side) which applies after the AJAX call. AJAX is used to submit the form
    for revaluation when the special selection list is changed (something is selected).
    As a result, it enforces the rendering of the three panels corresponding to three
    book cases: simple book, text book and biography. Using execute="this" we enforce
    the re-evaluation of the form at server side, so the resulting HTML DOM structure
    contains the changes accordingly to the conditions specified by the rendered attributes
    of the various JSF elements. Notice that a JSF element that has a conditional
    expression must be a child of another JSF element which is always part of the
    DOM.

    - h:panelGroup is used to define a set of elements which are either or hidden.

    - the action attribute of the h:commandButton can''t be used with conditional
    expressions, therefore we have to create three command buttons, one for each case:create/update
    a Book, a TextBook or a Biography. The method of the corresponding controller
    class (i.e., BookController, TextBookControllerBiographyController is called).

    - since we do not have a corresponding property in the Java class(es) for the
    special type (category), we can use JSF variables to store the value of the single
    select list, and then use the variable in rendered conditions for various elements.
    Therefore, for the h:selectOneMenu, the value="#{viewScope.bookTypeValue}" specifies
    that we use a "on the fly" defined property named bookTypeVal, which is part of
    the view scope JSF object(s). We can also define such variable outside the view
    scope, e.g.,value="#{bookTypeValue}", but in this case they are requested, so
    their value is lost after submitting the form, and the rendered conditions cannot
    be correctly evaluated.


