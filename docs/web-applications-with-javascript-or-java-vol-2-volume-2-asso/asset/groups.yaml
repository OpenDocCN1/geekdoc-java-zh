  - "[PAGE 178]\n\n# 14.2 Case Study 1: Implement a Class Hierarchy with Single Inheritance\
    \ — 163\n\n# 14.2.3.1 Summary\n\n+   1. Code the enumeration type (to be used\
    \ in the facelets).\n2. Code the model classes and add the corresponding JPA annotations\
    \ for class hierarchy.\n\nThese steps are discussed in more detail in the following\
    \ sections.\n\n# 14.2.3.2 Code the Enumeration Type BookCategoryEL\n\nThe enumeration\
    \ type BookCategoryEL is coded as a Java enum, providing enumeration literals\
    \ as well (human-readable) labels:\n\n```\npublic enum BookCategoryEL {\n    TEXTBOOK(\"\
    Textbook\"), BIOGRAPHY(\"Biography\");\n    private final String label;\n\n  \
    \  private BookCategoryEL(String label) {\n        this.label = label;\n    }\n\
    \    public String getLabel() { return this.label; }\n}\n```\n\n# 14.2.3.2.1 Code\
    \ the Model Classes\n\nWe code the model classes Book, Textbook and Biography\
    \ in the form of Java classes using suitable JPA annotations:\n\n```\n@Entity\
    \ @Table(name=\"books\")\n@Inheritance(strategy=InheritanceType.SINGLE_TABLE)\n\
    @DiscriminatorColumn(name=\"category\",\n    discriminatorType=STRING, length=16)\n\
    @DiscriminatorValue(value=\"BOOK\")\n@ManagedBean\npublic class Book {\n    @Id\
    \ @Column(length=10)\n    @NotNull(message=\"An ISBN is required!\")\n    @Pattern(regexp=\"\
    \\\\d(\\\\d|X)\\\\\b\",\n    message=\"The ISBN must be a. . .!\")\n    private\
    \ String isbn;\n    @Column(nullable=false)@NotNull(message=\"A title is required!\"\
    )\n    private String title;\n    @Column(nullable=false)@NotNull(message=\"A\
    \ year is required!\")\n    @UpToNextYear\n```"
- md: "\n## 164 14 Subtyping with Java EE\n\n```java\n@Min(value=1459, message=\"\
    The year must not be before 1459!\")\nprivate Integer year;\n// constructors,\
    \ set, get and other methods\n```\n\nWhen using the JPA Single Table Inheritance\
    \ technique for a class hierarchy, the @Inheritance annotation (e.g. Book in our\
    \ example) must be set for the superclass, and it provides the strategy parameter\
    \ with the value InheritanceType.SINGLE_TABLE. The @DiscriminatorColumn annotation\
    \ specifies the name of the table column storing the values that discriminate\
    \ between different types of subclasses (Textbook and Biography, in our example).\n\
    \nUnfortunately, we cannot use our BookCategoryEL enumeration for defining the\
    \ type of the discriminator column, because Java expressions like `BookCategoryEL.TEXTBOOK.name()`\
    \ are not constant, so a Java compiler exception is thrown. Instead, we use DiscriminatorType.STRING.\
    \ The @DiscriminatorValue annotation specifies a unique value to be stored in\
    \ the discriminator column of rows representing an instance of the class.\n\n\
    Further, we define the subtypes Textbook and Biography:\n\n```java\n@Entity(name=\"\
    textbooks\")\n@DiscriminatorValue(value=\"TEXTBOOK\")\n@ManagedBean(name=\"textbook\"\
    )@ViewScoped\npublic class Textbook extends Book {\n    @Column( nullable=false)\
    \ @NotNull(\n        message=\"A subject area value is required\"\n    )\n   \
    \ private String subjectArea;\n    // constructors, set, get and other methods\n\
    }\n```\n\nTextbook and Biography are subclasses of Book, so we define them with\
    \ extends Book. For each subclass, we add a @DiscriminatorValue annotation with\
    \ a value from the BookCategoryEL enumeration.\n\n## 14.2.4 STI Database Schema\n\
    \nAs a result of the annotation\n\n```java\n@Inheritance(strategy=InheritanceType.SINGLE_TABLE)\n\
    ```\n\n## 14.2 Case Study 1: Implement a Class Hierarchy with Single Table Inheritance\n\
    \nonly one database table is used for representing a class hierarchy. This table\
    \ contains the columns corresponding to all the properties of the classes from\
    \ the hierarchy plus the discriminator column. In our example, the books table\
    \ contains the following columns: isbn, title, year, subjectArea, about and category.\
    \ The simplified corresponding SQL-DDL code used to generate the books table for\
    \ our application is shown below:\n\n```sql\nCREATE TABLE IF NOT EXISTS `books`\
    \ (\n  `ISBN` varchar(10) NOT NULL,\n  `TITLE` varchar(255) NOT NULL,\n  `YEAR`\
    \ int(11) NOT NULL,\n  `SUBJECTAREA` varchar(255) DEFAULT NULL,\n  `ABOUT` varchar(255)\
    \ DEFAULT NULL,\n  `category` varchar(16) DEFAULT NULL\n)\n```\n\n## 14.2.5 Write\
    \ the View And Controller Code\n\nThe user interface (UI) consists of a page that\
    \ allows navigating to the data management pages (in our example, index.xhtml\
    \ in the folder WebContent/views/books/). Such a data management page contains\
    \ four sections: retrieve/list books, create book, update book and delete book.\n\
    \n### 14.2.5.1 Summary\n\nWe have to take care of handling the category discriminator\
    \ and the subjectArea and segment properties in the “List all books” use case\
    \ as well as in the “Create book” and “Update book” use cases:\n\n- 1. Adding\
    \ a segment information column (`Special type`) to the display table of the Retrieve/List\
    \ All use case in retrieveGetAll.xhtml in the folder WebContent/views/books/.\n\
    - 2. Adding a “Special type” select control, and corresponding form fields for\
    \ all segment properties, in the forms of the “Create book” and “Update book”\
    \ use cases in create.xhtml and update.xhtml in the folder WebContent/views/books/.\
    \ Segment property fields are only displayed, and their validation occurs only\
    \ when a corresponding book category has been selected.\n\n### 14.2.5.2 Add a\
    \ Segment Information Column in Retrieve/List All\n\nWe add a \"Special type\"\
    \ column to the display table of the \"List all books\" use case in books.html.\n\
    \n```xml\n<h:dataTable value=\"#{bookController.books}\" var=\"b\">\n  --\n  <h:column>\n\
    \    <f:facet name=\"header\">Special type</f:facet>\n    #{b.getClass().getSimpleName()\
    \ != 'Book' ? b.getClass().getSimpleName() : ''}\n  </h:column>\n</h:dataTable>\n\
    ```\n\nA conditional expression is used to check if the Java bean name is Book,\
    \ in which case we don't show it, or if it is something else (e.g. Textbook or\
    \ Biography), and then it is shown. This expression also shows how to call/various\
    \ Java bean methods, not only custom methods.\n\n### 14.2.5.3 Add a \"Special\
    \ Type\" Select Control in Create and Update\n\nIn both cases, we need to allow\
    \ selecting a special category of book ('textbook' or 'biography') with the help\
