- md: "\n## 2.6 Code the View and Controller — 35\n\nThe Create user interface is\
    \ set up by the following procedure:\n\n```javascript\npl.v.books.create = {\n\
    setupInterface: function () {\n    const formEl = document.querySelector(\"section#Book-C\
    \ > form\"),\n    selectPublisher = formEl.selectPublisher,\n    saveButton =\
    \ formEl.commit;\n    // add event listeners for responsive validation\n    formEl.isbn.addEventListener(\"\
