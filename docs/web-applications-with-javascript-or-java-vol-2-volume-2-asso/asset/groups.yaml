    Whenever an app has to manage the data of a larger number of object types, there\
    \ may be various subtype (inheritance) relationships between some of types. Subtypes\
    \ and inheritance are important elements of information models. Software applications\
    \ have to implement them in a proper way, typically as part of model-view-controller\
    \ (MVC) architecture. Unfortunately, application development frameworks do not\
    \ provide much support for dealing with class hierarchies.\n\n## 12 Subtyping\
    \ and Inheritance\n\nThe concept of a subtype, or subclass, is a fundamental concept\
    \ in natural language, mathematics, and informatics. For instance, in English\
    \ we say that a bird is an animal, or the class of all birds is a subclass of\
    \ the class of animals. In linguistics, the noun “bird” is a hyponym of the noun\
    \ \"animal\".\n\nAn object type may be specialized by subtypes (for instance,\
    \ Bird by Parrot) or generalized by subtypes (for instance, Bird and Mammal are\
    \ generalized by Animal). Specialization and generalization are two sides of the\
    \ coin.\n\nA subtype inherits all features from its supertypes. When a subtype\
    \ inherits attributes, associations and constraints from a subtype, this means\
    \ these features need not be repeatedly rendered for the subtype in the class\
    \ diagram, but the reader of the diagram has to understand that all features of\
    \ a subtype also apply to its subtypes.\n\nWhen an object type has more than one\
    \ direct supertype, we have a case of multiple inheritance, which is common in\
    \ conceptual modeling, but prohibited in many object-oriented programming languages,\
    \ such as Java and C#, which only allow class hierarchies with a unique subtype\
    \ for each object type.\n\n### 12.1 Introducing Subtypes by Specialization\n\n\
    A new object type may be introduced by specialization whenever it represents a\
    \ special case of another object type. We illustrate this for our example model\
    \ where we capture textbooks and biographies as special cases of books. This means\
    \ text books and biographies also have an ISBN, a title and a publishing year,\
    \ but in addition they have further features such as the attribute subjectArea\
    \ for text books and biographies. Consequently, in Figure 12.1, we introduce the\
    \ object types Textbook and Biography by specializing the object type Book, that\
    \ is, as subtypes of.\n\n![](img/26c953d1023457333859f69258a99556_138_0.png)\n\
    \nFigure 12.1: The object type Book with two subtypes: Textbook and Biography.\n"
