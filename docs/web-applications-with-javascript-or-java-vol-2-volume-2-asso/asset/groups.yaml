    \ `deploy` 命令：\n\n```bash\nant deploy -Dapp=Unidirectional\n```\n\n最后，启动你的 Tomcat\
    \ 服务器（Windows 使用 `bin/shutdown.bat`，Linux 使用 `bin/shutdown.sh`）。请耐心等待，这可能需要一些时间。当你通过浏览器打开以下地址时，它就准备就绪了：\n\
    \nhttp://localhost:8080/Unidirectional/views/index.xhtml\n\n## 5.7 集合作为值\n\n回想集合是无序且元素唯一的集合，而列表可以包含相同的元素。当非功能关联是有序的（如图\
    \ 5.1 中的 `Book::authors`），这意味着相应属性的范围需要是一个有序集合。\n\n| Book | authored | Author\
    \ |\n|---|---|---|\n| <std> isbn : String | | <std> personid : Integer |\n| title\
    \ : String | | name : String |\n| year : Integer | * | |\n\n在理论上，集合值属性应该定义为 `Set<T>`，例如作为\
    \ `authoredBooks` 的范围；而有序集合值属性应该定义为 `SortedSet<T>`，例如作为 `authors` 的范围。Java 接口通常由\
    \ `HashSet` 实现，`SortedSet` 则由 `TreeSet` 实现。\n\n然而，如果不担心重复元素，集合值和有序集合值都可以使用通用接口类型\
    \ `List<T>` 定义其范围，它通常由 `ArrayList` 实现。\n\n## 6 单向关联练习项目\n\n所有项目都包含以下任务：\n\n- 1.\
