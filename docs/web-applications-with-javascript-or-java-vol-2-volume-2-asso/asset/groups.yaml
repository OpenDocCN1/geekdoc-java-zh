    \ code you now have to take care of maintaining the derived inverse reference\
    \ properties by maintaining the derived (sets) of inverse references that form\
    \ the values of a derived inverse reference property. In this particular:\n  \
    \ - whenever the value of a single-valued master reference property is initialized\
    \ or updated with the help of a setter (such as assigning a reference to an Publisher\
    \ instance p to b.publisher for a Book instance), an inverse reference has to\
    \ be assigned or added to the corresponding value of the derived inverse reference\
    \ property (such as adding b to p.publishedBooks); when the value of the master\
    \ reference property is updated and the derived inverse reference property is\
    \ multi-valued, the obsolete inverse reference to the previous value of the single-valued\
    \ master reference property has to be deleted;\n   - whenever the value of an\
    \ optional single-valued master reference property is unset (e.g., by assigning\
    \ null to b.publisher for a Book instance), the inverse reference has to be removed\
    \ from the corresponding value of the derived inverse reference property (such\
    \ as removing b from p.publishedBooks); if the derived inverse reference property\
    \ is multi-valued, otherwise the corresponding value of the derived inverse reference\
    \ property has to be unset or updated;\n   - whenever a reference is added to\
    \ the value of a multi-valued master reference property with the help of an add\
    \ method (such as adding an Author reference to b.authors for a Book instance),\
