    \ key of Object.keys(Book.instances)) {\n      const book = Book.instances[key];\n\
    \      const row = tableBodyEl.insertRow(-1);\n      row.insertCell(-1).textContent\
    \ = book.isbn;\n      row.insertCell(-1).textContent = book.title;\n      row.insertCell(-1).textContent\
    \ = book.year;\n      // if the book is a publisher, show its name\n      row.insertCell(-1).textContent\
    \ =\n        book.publisher ? book.publisher.name : \"\";\n    }\n  }\n  document.getElementById(\"\
    Book-M\").style.display = \"none\";\n  document.getElementById(\"Book-R\").style.display\
    \ = \"block\";\n};\n```\n\nFor a multi-valued reference property, the table cell\
    \ would have to be filled with a list of all associated objects referenced by\
    \ the property.\n\n### 2.6.3 Selecting Associated Objects in the Create and Update\
    \ Use Cases\n\nFor allowing to select objects to be associated with the currently\
    \ edited object from the Create and Update use cases, an HTML selection list (i.e.,\
    \ a select element) is populated with option elements formed from the instances\
    \ of the associated object type with the help of a utility method fillSelectWithOptions.\
    \ The HTML element is defined in the books.html view file:\n\n```html\n<section\
    \ id=\"Book-C\" class=\"UI-Page\">\n<h1>Public Library: Create a new book record/</h1>\n\
    <form>\n  ...\n  <div class=\"select-one\">\n    <label>Publisher: <select name=\"\
    selectPublisher\"></select></label>\n  </div>\n  ...\n</form>\n</section>\n```\n"
  mdcn: "\n\n## 2.5 编写模型 - 29\n\n注意，由于 `name` 属性是 `Publisher` 的标准 ID 属性，我们只在 `checkName`\
    \ 中检查语法约束，并在 `checkNameAsId` 中检查必填值和唯一性约束，后者会调用 `checkName`：\n\n```js\nstatic\
    \ checkNameAsId(n) {\n  var validationResult = Publisher.checkName(n);\n  if ((validationResult\
    \ instanceof NoConstraintViolation)) {\n    if (n === undefined) {\n      return\
    \ new MandatoryValueConstraintViolation(\n        \"A publisher name is required!\"\
    );\n    } else if (Publisher.instances[n]) {\n      validationResult = new UniquenessConstraintViolation(\n\
    \        \"There is already a publisher record with this name!\");\n    } else\
    \ {\n      validationResult = new NoConstraintViolation();\n    }\n  }\n}\n```\n\
    \n如果我们需要在其他类中处理 ID 引用（外键），我们需要提供进一步的检查，称为 `checkNameAsIdRef`，用于检查引用完整性约束：\n\n\
    ```js\nstatic checkNameAsIdRef(n) {\n  var validationResult = Publisher.checkName(n);\n\
    \  if ((validationResult instanceof NoConstraintViolation) &&\n    n !== undefined)\
    \ {\n    if (!Publisher.instances[n]) {\n      validationResult = new ReferentialIntegrityConstraintViolation(\n\
    \        \"There is no publisher record with this name!\");\n    }\n  }\n  return\
    \ validationResult;\n}\n```\n\n条件 `!Publisher.instances[n]` 检查是否存在具有给定名称 `n` 的出版社对象，然后创建一个\
    \ `ReferentialIntegrityConstraintViolation` 异常类实例的 `validationResult` 对象。`Book.checkNameAsRef`\
    \ 函数由 `Book.checkPublisher` 函数调用：\n\n```js\nclass Book {\n  ..\n  static checkPublisher(publisher_id)\
    \ {\n    var validationResult = null;\n    if (publisher_id === undefined || publisher_id\
    \ === \"\") {\n      validationResult = new NoConstraintViolation(); // optional\n\
    \    } else {\n      // 调用外键约束检查\n      validationResult = Publisher.checkNameAsRef(publisher_id);\n\
    \    }\n    return validationResult;\n  }\n  ..\n}\n```\n\n## 2.5.4 编写属性 Setter\n\
    \n在 setter 方法中，会调用相应的检查函数，只有当检查未检测到约束违反时，才会设置属性。对于引用属性，我们避免使用对象引用或 ID 引用调用 setter。由此产生的歧义通过测试在调用\
    \ setter 时提供的参数是否为对象来解决。例如，出版社的 setter 是如下方式编写的：\n\n```js\nclass Book {\n  ..\n\
    \  set publisher(p) {\n    if (!p) // 取消出版社\n      delete this._publisher;\n \
    \   } else { // 注意此处此处多了一个大括号\n      // p 可以是 ID 引用或对象引用\n      publisher_id =\
    \ (typeof p===\"object\") ? p : p.name;\n      const validationResult = Book.checkPublisher(publisher_id);\n\
    \      if (validationResult instanceof NoConstraintViolation) {\n        // 创建新的出版社引用\n\
    \        this._publisher = Publisher.instances[publisher_id];\n      } else {\n\
    \        throw validationResult;\n      }\n    }\n  }\n}\n```\n\n## 2.5.5 选择并实现删除策略\n\
    \n对于任何引用属性，我们必须在第 1.2 节讨论的两种可能的删除策略中选择并实现一种，用于属性范围类的 `destroy` 方法中管理相应的对象销毁依赖。在我们的案例中，当删除出版社记录时，必须在两者之间选择：\n\
    \n- 1. 删除所有由删除出版社出版的书记录（生存依赖）；\n- 2. 从所有由删除出版社出版的书中删除指向该删除出版社的引用（生存独立）。\n\n假设书籍在生存上不依赖于其出版社，我们选择第二种方案。在下面的\
    \ `Publisher.destroy` 方法代码中，对于所有相关的书籍对象，`book.publisher` 属性都被清空了：\n\n```js\nPublisher.destroy\
    \ = function (name) {\n    const publisher = Publisher.instances[name];\n    //\
    \ 删除书籍对象中所有对该出版社的引用\n    for (let key of Object.keys(Book.instances)) {\n    \
    \    const book = Book.instances[key];\n        if (book.publisher === publisher)\
    \ {\n            delete book.publisher; // 删除槽位\n            console.log(\"\"\
    \ + book.isbn + \" updated.\");\n        }\n    }\n    // 删除出版社记录\n    delete\
    \ Publisher.instances[name];\n    console.log(\"Publisher \" + name + \" deleted.\"\
    );\n};\n```\n\n注意，对已删除出版社的所有引用的删除是通过顺序扫描所有书籍对象完成的，当书籍很多时，这可能是无效的。如果每个出版社对象都持有一个指向所有该出版社出版的书的列表，效率将会高得多。创建和维护列表将使书籍与其出版社之间的关联变为双向的。\n\
    \n## 2.5.6 序列化与对象到存储的映射\n\n对于引用属性（例如 `Book::publisher`），序列化函数 `Book::toString()`\
    \ 必须显示被引用对象的人类可读标识符，例如 `publisher.name`：\n\n```js\ntoString() {\n  var bookStr\
    \ = `Book: ISBN: ${this.isbn}, title: ${this.title},` +\n  `year: ${this.year}`;\n\
    \  if (this.publisher) bookStr += `, publisher: ${this.publisher.name}`;\n  return\
    \ bookStr + \"\";\n}\n```\n\n对象到存储的转换函数 `Book::toRecord()` 将带有对象引用的（无类型）带类型对象转换为带有\
    \ ID 引用的记录对象：\n\n```js\ntoRecord() {\n  var rec = {};\n  for (let p of Object.keys(this))\
    \ {\n    // 只处理带下划线的属性\n    if (p.charAt(0) === \"_\") {\n      switch (p) {\n\
    \        case \"_publisher\":\n          // 将对象引用转换为 ID 引用\n          if (this._publisher)\
    \ rec.publisher = this._publisher.name;\n          break;\n        default:\n\
    \          // 移除下划线\n          rec[p.substr(1)] = this[p];\n      }\n    }\n \
    \ }\n  return rec;\n}\n```\n\n反向转换，从带 ID 引用的无类型记录转换为带对象引用的类型对象，是由 `Book` 构造函数完成的，它接受参数。\n\
    \n## 2.6 编写视图与控制器\n\n用户界面（UI）由 `index.html` 组成，允许导航到各个管理页面（例如 `books.html` 和 `publishers.html`）。每个数据管理页面包含\
    \ 5 个部分：查询、创建、编辑、更新和删除，每次只显示一个（通过设置 CSS `display:none` 属性来实现）。\n\n### 2.6.1 初始化\
    \ App\n\n为了初始化数据管理用例，所需的数据（例如出版社和书籍记录）必须从持久化存储中加载。这是通过 `c/books.js` 中的 `pl.c.books.manage`\
    \ 实现的：\n\n```js\npl.c.books.manage = {\n  initialize: function () {\n    Publisher.retrieveAll();\n\
    \    Book.retrieveAll();\n    pl.v.books.setUserInterface();\n  }\n}\n```\n\n\
    管理的 `initialize` 方法首先加载出版社，然后通过调用 `setUp` 方法渲染书籍数据。\n\n### 2.6.2 在查询列表中显示关联对象\n\
    \n在示例中，我们只有一个引用属性 `Book::publisher`，它是功能且可选的。要在查询列表用例中显示可选的出版社，HTML 表格中的相应单元格将被填充：\n\
    \n```js\npl.v.books.retrieveAndAll={\n  setupUserInterface: function () {\n  \
    \  const tableBodyEl = document.querySelector(\"#sectionBook-R tbody\");\n   \
    \ tableBodyEl.innerHTML = \"\"; // 清空旧内容\n    for (let key of Object.keys(Book.instances))\
    \ {\n      const book = Book.instances[key];\n      const row = tableBodyEl.insertRow(-1);\n\
    \      row.insertCell(-1).textContent = book.isbn;\n      row.insertCell(-1).textContent\
    \ = book.title;\n      row.insertCell(-1).textContent = book.year;\n      // 如果书籍有出版社，则显示其名称\n\
    \      row.insertCell(-1).textContent =\n        book.publisher ? book.publisher.name\
    \ : \"\";\n    }\n  }\n  document.getElementById(\"Book-M\").style.display = \"\
    none\";\n  document.getElementById(\"Book-R\").style.display = \"block\";\n};\n\
    ```\n\n对于多值引用属性，表格单元格必须填充所有引用的关联对象的列表。\n\n### 2.6.3 在创建和更新用例中选择关联对象\n\n为了在创建和更新用例中从当前编辑的对象中选择关联对象，HTML\
    \ 选择列表（即 `select` 元素）将通过实用方法 `fillSelectWithOptions` 根据关联对象类型的实例填充选项。该 HTML 元素定义在\
    \ `books.html` 视图文件中：\n\n```html\n<section id=\"Book-C\" class=\"UI-Page\">\n\
    <<h1>Public Library: Create a new book record/</h1>\n<form>\n  ...\n  <div class=\"\
    select-one\">\n    <label>Publisher: <select name=\"selectPublisher\"></select></label>\n\
    \  </div>\n  ...\n</form>\n</section>\n```\n\n"
