  mdcn: "\n\n## 164 14 Java EE 中的子类型\n\n```java\n@Min(value=1459, message=\"The year\
    \ must not be before 1459!\")\nprivate Integer year;\n// constructors, set, get\
    \ and other methods\n```\n\n当使用 JPA 单表继承（Single Table Inheritance）技术处理类层次时，必须为父类设置\
    \ `@Inheritance` 注解（例如示例中的 Book），并将其 `strategy` 参数设置为 `InheritanceType.SINGLE_TABLE`。`@DiscriminatorColumn`\
    \ 注解指定了存储区分不同子类类型（在我们的示例中为 Textbook 和 Biography）值的表列名。\n\n遗憾的是，我们无法使用 `BookCategoryEL`\
    \ 枚举来定义判别器列的类型，因为像 `BookCategoryEL.TEXTBOOK.name()` 这样的 Java 表达式不是常量，因此会导致 Java\
    \ 编译器抛出异常。相反，我们使用 `DiscriminatorType.STRING`。`@DiscriminatorValue` 注解指定了存储在代表类实例行的判别器列中的唯一值。\n\
    \n此外，我们定义了子类型 `Textbook` 和 `Biography`：\n\n```java\n@Entity(name=\"textbooks\"\
    )\n@DiscriminatorValue(value=\"TEXTBOOK\")\n@ManagedBean(name=\"textbook\")@ViewScoped\n\
    public class Textbook extends Book {\n    @Column( nullable=false) @NotNull(\n\
    \        message=\"A subject area value is required\"\n    )\n    private String\
    \ subjectArea;\n    // constructors, set, get and other methods\n}\n```\n\n`Textbook`\
    \ 和 `Biography` 是 `Book` 的子类，因此我们通过 `extends Book` 来定义它们。对于每个子类，我们都添加一个 `@DiscriminatorValue`\
    \ 注解，其值来自 `BookCategoryEL` 枚举。\n\n## 14.2.4 STI 数据库架构\n\n由于注解：\n\n```java\n@Inheritance(strategy=InheritanceType.SINGLE_TABLE)\n\
    ```\n\n## 14.2 案例研究 1：使用单表继承实现类层次\n\n使用一个数据库表来表示类层次。该表包含了对应于层次中所有类属性的列，加上判别器列。在我们的示例中，`books`\
    \ 表包含以下列：isbn、title、year、subjectArea、about 和 category。用于为我们的应用程序生成 `books` 表的简化\
    \ SQL-DDL 代码所示：\n\n```sql\nCREATE TABLE IF NOT EXISTS `books` (\n  `ISBN` varchar(10)\
    \ NOT NULL,\n  `TITLE` varchar(255) NOT NULL,\n  `YEAR` int(11) NOT NULL,\n  `SUBJECTAREA`\
    \ varchar(255) DEFAULT NULL,\n  `ABOUT` varchar(255) DEFAULT NULL,\n  `category`\
    \ varchar(16) DEFAULT NULL\n)\n```\n\n## 14.2.5 编写视图和控制器代码\n\n用户界面（UI）包含一个允许导航到数据管理页面（在我们的示例中，位于\
    \ WebContent/views/books/ 文件夹下的 `index.xhtml`）。此类数据管理页面包含四个部分：检索/列表书籍、创建书籍、更新书籍和删除书籍。\n\
    \n### 14.2.5.1 总结\n\n在“列出所有书籍”以及“创建书籍”和“更新书籍”用例中，我们必须处理类别判别器以及 `subjectArea` 和分段属性：\n\
    \n- 1. 在 WebContent/views/books/ 文件夹下的 `retrieveGetAll.xhtml` 中，“检索/列表所有”用例的显示表中添加一个分段信息列（`Special\
    \ type`）。\n- 2. 在 WebContent/views/books/ 文件夹下的 `create.xhtml` 和 `update.xhtml`\
    \ 中，“创建书籍”和“更新书籍”用例的表单添加一个“Special type”选择控件，以及对应所有分段属性的表单字段字段字段在选择了相应的书籍类别时才会显示，并且仅进行验证。\n\
    \n### 14.2.5.2 在检索/列表所有添加分段信息列\n\n我们在 `books.html` 的“列出所有书籍”用例的显示表中添加了“Special\
    \ type”列。\n\n```xml\n<h:dataTable value=\"#{bookController.books}\" var=\"b\"\
    >\n  --\n  <h:column>\n    <f:facet name=\"header\">Special type</f:facet>\n \
    \   #{b.getClass().getSimpleName() != 'Book' ? b.getClass().getSimpleName() :\
