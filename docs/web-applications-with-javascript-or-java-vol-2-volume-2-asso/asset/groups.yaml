    ## 12.7 Subtyping and Inheritance in Computational Languages


    An example of an admissible population for this model is the following:


    | person_id | name | categories | biography | emp_no | department |

    | --- | --- | --- | --- | --- | --- |

    | 1001 | Harry Wagner | Author, Employee | Born in Boston, MA, in 1956, . . .
    | 21035 | |

    | 1002 | Peter Boss | Manager | | 23107 | Sales |

    | 1003 | Tom Daniels | | | | |

    | 1077 | Immanuel Kant | Author | Immanuel Kant (1724–1804) was a German philosopher.
    . . . | | |


    Notice that the Person contains four different types of people:


    - 1. A person, Harry Wagner, who is both an author (with a biography) and an employee
    (with an employee number).

    - 2. A person, Peter Boss, who is a manager (a special type of employee), managing
    the Sales department.

    - 3. A person, Tom Daniels, who is neither an author nor an employee.

    - 4. A person, Immanuel Kant, who is an author (with a biography).


    **Pros of the STI approach:** It leads to a faithful representation of the subtype
    relationships expressed in the original class hierarchy; in particular, any row
    representing a subclass instance (an employee, manager or author) also represents
    a superclass instance (a person).


    **Cons:** (1) In the case of a multi-level class hierarchy where the subclasses
    have little in common, the STI approach does not lead to a good representation.
    (2) The structure of the given class hierarchy in terms of its elements (classes)
    is only implicitly preserved.


    ### 12.7.4.2 Table Per Class Inheritance


    In a more realistic model, the subclasses of Person in Figure 12.8 above would
    have many more attributes, so the STI approach would be no longer feasible. The
    TCI approach would get the SQL table model shown in Figure 12.11 below. A TCI
    model represents each concrete class of the class hierarchy as a table, such that
    each subclass is represented by a table that also contains columns for inherited
    properties, thus repeating the columns of the table that represents the superclass.


    | «SQL table» | «SQL table» |

    | :--- | :--- |

    | people | employees |

    | person_id : INTEGER (pkey) | person_id : INTEGER (pkey) |

    | name : VARCHAR | name : VARCHAR |

    | | emp_no : INTEGER (unique) |

    | «SQL table» | «SQL table» |

    | authors | managers |

    | person_id : INTEGER (pkey) | person_id : INTEGER (pkey) |

    | name : VARCHAR | name : VARCHAR |

    | biography : VARCHAR | emp_no : INTEGER (unique) |

    | | department : VARCHAR |


    Figure 12.11: A TCI table model representing the Person roles hierarchy.


    A TCI table can be derived from the information design model by performing the
    following steps:


    - 1. Replacing the standard ID property modifier [id] in all classes with {pkey}
    for indicating that the standard ID property is a primary key.

    - 2. Replacing the singular (capitalized) class names (Person, Author, etc.) with
    pluralized lowercase table names (people, authors, etc.), and replacing camel
    case properties (*personId* and *empNo*) with lowercase underscore-separated names
    for columns (*personid* and *empno*).

    - 3. Adding a <table> stereotype to all class rectangles.

    - 4. Replacing the platform-independent datatype names with SQL datatype names.

    - 5. Dropping all generalization/inheritance arrows and adding all columns of
    supertables (such as *person_id* and *name* from *people*) to their subtables
    (authors and employees).


    Each table would only be populated with rows corresponding to the direct instances
    of the represented class. An example of an admissible population for this model
    is the following:


    | people | |

    | :--- | :--- |

    | personId | name |

    | 1003 | Tom Daniels |


    | authors | | | |

    | person_id | name | biography |

    | 1001 | Harry Wagner | Born in Boston, MA, in 1956, . . . |

    | 1077 | Immanuel Kant | Immanuel Kant (1724–1804) was a German philosopher. .
    . . |


    | person_id | name | emp_no |

    |---|---|--|

    | 101 | Harry Wagner | 21035 |


    employees


    | person_id | name | emp_no | department |

    |---|---|---|--|

    | 1002 | Peter Boss | 23107 | Sales |


    managers


    **Pros of the TCI approach:** (1) The structure of the given class hierarchy in
    terms of its elements (classes) is explicitly represented. (2) When the segmentations
    of the given class hierarchy are disjoint, TCI leads to memory-efficient non-redundant
    storage.


    **Cons:** (1) The TCI approach does not yield a faithful representation of the
    subtype relationships expressed in the original class hierarchy. In particular,
    for any row representing a subclass (an employee, manager or author) there is
    no information that it represents a superclass (a person). Thus, the TCI schema
    does not inform about the represented subtype; rather, meta-information, which
    is kept in the app''s model, is decoupled from the database. (2) The TCI approach
    requires repeating column definitions, which is a form of schema redundancy. (3)
    The TCI approach may imply data redundancy whenever subclasses overlap. In our
    example, authors can be employees, so for any person in the overlap we would need
    to duplicate the data for all columns representing properties of the superclass
    (in our example, this only concerns the property name).


    ### 12.7.4.3 Joined Inheritance


    For avoiding the data redundancy of TCI in the case of overlapping segments, we
    take the JTI approach as exemplified in the SQL model shown in Figure 12.12. This
    model connects subclasses (*subtables*) to tables representing superclasses (*super*)
    by defining their primary key column(s) to be at the same time a foreign key referencing
    superbe''s primary key. Notice that foreign keys are visualized in the form of
    UML stereotyped with «fk» and annotated at their source side with the name of
    the foreign key column.


    img/26c953d1023457333859f69258a99556_155_0.png


    12.12: A JTI model representing the Person roles hierarchy.


    An example of an admissible population for this model is the:


    | person_id | name |

    | --- | --- |

    | 1001 | Harry Wagner |

    | 1002 | Peter Boss |

    | 1003 | Tom Daniels |

    | 1077 | Immanuel Kant |


    | person_id | biography |

    | --- | --- |

    | 1001 | Born in Boston, MA, in 1956, . . . |

    | 1077 | Immanuel Kant (1724–1804) was a German philosopher. . . . |


    | person_id | emp_no |

    | --- | --- |

    | 1001 | 21035 |

    | 1002 | 23107 |


    | person_id | department |

    | --- | --- |

    | 1002 | Sales |


    **Pros of the JTI approach:** (1) Subtyping relationships and the structure of
    class hierarchies are explicitly preserved. (2) Data redundancy in the case of
    overlapping segments is avoided.


    **Cons:** (1) The main disadvantage of JTI approach is that for querying a subclass,
    join queries (for joining segregated entity data) are required, which may create
    performance issues.


