    # 14.3 Case Study 2: Implement a Class Hierarchy with Joined Table Inheritance


    The starting point for our case study is the design model shown in Figure 12.8
    above. In the following sections, we show how to eliminate the Manager class using
    the Class Hierarchy Merge design pattern and how to implement the Person hierarchy
    and use Joined, Multiple Table Inheritance storage with the help of JPA framework.


    # 14.3.1 Make the Java Entity class model


    We design the model classes of our example app with the help of a Java Entity
    model that we derive from the design model by essentially leaving the generalization
    as they are and just adding getters and setters to each class. However, in the
    case of our example app, it is natural to apply the Class Hierarchy Merge design
    pattern to the segmentation of Employee for simplifying the data model by eliminating
    the Manager subclass. This leads to the model shown in Figure 14.2 below. Notice
    we have made two technical decisions:


    | Java Entity |

    | Person |

    | |

    | <get/set> personid : Integer (id) |

    | <get/set> name : String |

    | checkPersonIdAsId(in id : String, in type) : ConstraintViolation |


    | enumeration |

    | EmployeeTypeEL |

    | MANAGER |


    | Java Entity |

    | Employee |

    | <get/set> empNo[1] : Integer (unique) |

    | <get/set> type(0.[1] : EmployeeTypeEL |

    | <get/set> department(0.[1] : String |

    checkUniqueEmpNo(in n : Integer) : ConstraintViolation toString() : String create(in
    pld : Integer, in n : String, in bio : String) retrieveAll() : Employee[*] |


    {disjoint, complete}


    | Java Entity |

    | Author |

    | <get/set> biography : String |

    tString() : String create(in pld : Integer, in name : String, in bio : String)
    retrieveAll() : Author[*] |


    ![](img/26c953d1023457333859f69258a99556_184_0.png)'
  - '[PAGE 185]


    +   1. We have declared the segmentation of Person into Employee and Author to
    be disjoint and complete, that is, any person is either an employee or an author.
    Since Java does not support multiple classification, we cannot implement an overlapping
    segmentation, as needed when modeling roles, with Java.


    +   2. We have turned Person into an abstract class (indicated by its name in
    italics the class rectangle), which means that it cannot have direct instances,
    but only indirect ones via its subclasses Employee and Author. This technical
    design is compatible with the fact that any Person is an Employee or Author (or
    both), and consequently there is no need for any object to instantiate Directly.


    # 14.3.2 New Issues


    Compared to the model of our first case study, shown in Figure 14.1 above, we
    have to define the category relationships between Employee and Person, as well
    as between Author and Person, using the JPA annotation.

    in the UI we have to take care of:


    +   1. Adding the views (in the folders WebContent/views/authors and WebContent/views/employees)
    and controller classes (AuthController and EmployeeController) for the corresponding
    Author and Person model classes.


    +   2. Deal with the Manager case, by adding a "Special type" select control,
    in the forms of the "Create book" and "Update book" use cases in WebContent/views/books/create.xhtml
    and WebContent/views/books/update.xhtml. Segment property fields (i.e., department
    in our example) are only displayed, and their validation is performed, when a
