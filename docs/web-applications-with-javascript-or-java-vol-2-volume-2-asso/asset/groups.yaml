    ## 前言


    本书两卷著作介绍了如何使用模型驱动的方法来设计和实现 Web 应用，利用了目前最流行的两种技术：前端的 JavaScript 和后端的 Java。我们关注的是
    Web 开发中的通用概念：数据完整性、枚举以及类层次结构。


    我们假设读者已经熟悉 JavaScript 的 Web 开发基础知识，并对学习如何使用 Java 进行后端开发感兴趣。本书特别适用于计算机科学或相关专业的学生，以及正在参加相关
    Web 应用开发课程的开发者。


    本书还提供了关于 JavaScript 框架（如本地存储以及 MySQL 数据库）的详细信息。


