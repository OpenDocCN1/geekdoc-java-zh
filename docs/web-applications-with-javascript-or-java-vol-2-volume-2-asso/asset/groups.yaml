    binary relationships), it''s an option to consider one of them as the "master"
    and the other one "slave", which is derived from the master. We discuss the cases
    of a one-to-one and a many-to-many association


    +   1. In the case of a bidirectional one-to-one association, which leads to a
    pair of mutually inverse-valued reference properties, in each of the two associated
    classes. Since both of them essentially represent the same information (the collection
