    to the ID reference property of the referencing object.


    In OO languages, a property is defined for an object type, or class, which is
    its domain. The values of a property are either data values from some datatype,
    in which case the property is called an attribute, or they are object references
    referencing an object from some class, in which the property is called a reference
    property. For instance, the class Committee shown in Figure 1.1 below has an attribute
    name with range String, and a reference property chair with range ClubMember.


    | Committee | ClubMember |

