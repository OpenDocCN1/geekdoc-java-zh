    完成平台无关的面向对象类模型后，可以从中推导出针对特定实现平台选择的一个或多个特定平台实现模型。特定平台实现模型的类型示例包括 JS 类模型、Java 实体类模型和
    SQL 表模型。


    特定平台实现模型仍然可以用 UML 类图的形式表示，但它仅包含可以在所选平台中直接编码的建模元素。因此，对于任何考虑的平台，都需要两个准则：1) 如何制作特定平台的实现模型，2)
    如何对该模型进行编码。


    ## 1.8 用户界面中的引用属性渲染


    用于用户界面（UI）中数据输入和输出的小部件（widgets）通常对应于模型中定义的属性。我们必须区分对应各种类型的输入字段与对应枚举属性或引用属性的选择部件（如选择列表）。在
    UI 中使用选择控件而非输入字段来表示引用属性，可以防止输入无效的 ID，从而维护引用完整性。


    通常情况下，单值引用属性无论属性填充了多少个对象，都可以渲染为 UI 中的单选列表。如果引用属性的范围足够小（例如小于 7 个），则可以使用单选按钮组。


    多值引用属性可以渲染为 UI 中的多选列表。然而，当有许多选项（例如超过 20 个）时，相应的 HTML 多选控件实际上是不可用的，因为选择方式太分散。在只有少数选项（例如不超过
    7 个）的特殊情况下，对于 UI 中所有关联对象的列表，我们需要开发一种特殊的 UI 小部件，允许从引用属性范围中添加（删除）对象。


    这种多选控件由以下部分组成：

    - 1. 关联对象的 HTML 列表，每个项目包含一个删除按钮；

    - 2. 一个选择控件，允许多值引用属性范围内添加新的关联对象。


    ## 1.9 多值引用属性的集合类型


    默认情况下，非功能关联将目标类的实例关联到源类的任何实例，这意味着对应多值引用属性是集合（sets）。还存在某些情况，非功能关联是有序的，因此对应引用属性的值的形式为有序集合。


    在以下示例中，`publishedBooks` 关联无序，而 `authors` 关联是有序的，因为作者的顺序是有意义的。注意在 UML 类图中，有序关联用
    `{ordered}` 注解标记。


    ## 1.6 引用属性与单向关联


    | 出版社 | 已出版书籍 | 作者 (有序) | 作者 |

    |---|---|---|---|

    | name : String (id) | isbn : String (id) | * | personid : Integer {id} |

    | address : String | 0.1 * | title : String, year : Integer | * | name : String
    |


    有序关联不应基于目标类的属性。在我们的示例中，这意味着作者的顺序不应该代表字母顺序，而是代表无法通过 `Author` 属性获取的信息。事实如此，因为它代表了某种无法通过任何属性表达的意义。


    注意，通过向关联的目标类添加一个或多个属性，可以将有序关联转换为无序关联。有序关联通过不需要辅助属性显式排序，允许更简洁的信息模型和更高效的实现。


    多值引用属性的两个重要集合类型是集合（sets），对于包（多集合）和序列（有序多集合），多值引用属性的集合类型是包或序列，这可以在类图中使用 `{nonunique}`（或
    `{ordered, nonunique}`）注解表示。注意，使用列表（如 JS 数组或 `List` 接口）作为有序和无序多值属性的范围是非常常见的。


    ## 1.10 测验


    如果你想查找以下测验的答案，可以查看我们的讨论论坛。如果你在论坛中没有找到答案，可以发帖提问。


    ### 1.10.1 题 1：“一对一”的含义


    说一个关联是“一对一”意味着什么？

    意味着它是（选择一个）：


    - 双向的

    - 同时具有功能性和完全性

    - 是功能性的

    - 同时具有功能性和反向性


    ### 1.10.2 题 2：何时检查引用完整性


    对于域为 C 范围为 D 的引用属性 `p`，在何时必须检查引用完整性（选择一个或多个）：


    - □ 一个 C 类型对象被销毁。

    - □ 某个 C 类型对象的 `p` 值被更改。

    - 创建了一个新的 C 类型对象。

    - □ 一个 D 类型对象被销毁。

    - □ 创建了一个新的 D 类型对象。


    ### 1.10.3 题 3：“功能性”的含义


    单向二元关联是功能性的，当且仅当（选择一个）：


    - O 源类的每个对象最多关联一个目标类对象。

    - O 目标类的每个对象最多关联一个源类对象。

    - O 源类的每个对象至少关联一个目标类对象。

    - O 源类的每个对象恰好关联一个目标类对象。


    ### 1.10.4 题 4：对象销毁依赖关系


    假设我们有一个具有标准标识符属性 `id` 的对象 B，以及一个具有引用 `B::id` 的引用属性 `b_id` 的对象 A。此外，有一个 `b.id =
    11` 的 B 类型对象 b 以及一个 `a.b_id = 11` 的 A 类型对象 a。以下描述是正确的？选择一个或多个：


    - □ 当对象 a 中的 引用被取消赋值（在 JS 中将 `a.b_id` 设置为 `undefined`，在 Java 中设为 `null`）且没有其他对象引用
    b 时，对象 b 可以被销毁。

    - □ 只有在 b 被销毁之前，对象 a 才能被销毁。


