    # 第一部分：关联


    我们在第一卷中过的三个示例应用程序——最小应用、验证应用和枚举应用——都局限于管理一个对象类型的数据。然而，一个真实的应用程序必须管理多个对象类型的数据，这些类型通常以各种方式相互关联。特别是，对象类型之间可能存在关联和子类型（继承）关系。处理关联和子类型关系是软件应用工程中的高级问题。它们在教科书中往往没有得到充分讨论，也没有得到应用开发框架的良好支持。


    关联是信息模型的重要元素。应用程序必须以适当的方式实现它们，特别是在模型-视图-控制器（MVC）架构的模型层中。遗憾的是，应用开发框架对处理关联提供的支持有限。


    有两个重要的区别，它们之间是相互独立的：


    - 1. 功能性与非功能性（“多对多”）关联。

    - 2. 单向关联与双向关联。


    功能性关联对应于数学中所谓的函数（function），而多对多关联对应于数学中所谓的关系（relation）。


    在 OO 建模和编程中，单向关联对应于引用属性（reference property），而双向关联对应于一对互反的引用属性。


    # 1 引用属性和单向关联


    为对象类型（或类）定义的属性，如果其值是指向另一个类型或同类型类型对象的引用，则被称为引用属性。例如，下方图 1.1 所示的委员会（Committee）有一个引用属性
    `chair`，其值是指向俱乐部成员（ClubMember）对象的引用。


    对象类型之间的关联对这些类型对象之间的关系进行了分类。例如，委员会-拥有-俱乐部成员作为主席（Committee-has-ClubMember-as-chair）的关联在图
    1.2 所示的类图中被可视化为一条线，它分类了财务委员会-拥有彼特·米勒作为主席（FinanceCommittee-has-PeterMiller-as-chair）、招聘委员会-拥有苏珊·史密作为主席（RecruitmentCommittee-has-SusanSmith-as-chair）以及咨询委员会-拥有莎拉·安德森作为主席（AdvisoryCommittee-has-SarahAnderson-as-chair）的关系，其中对象彼特·米勒（PeterMiller）、苏珊·史密（SusanSmith）和莎拉·安德森（SarahAnderson）是俱乐部成员（ClubMember）类型，而财务委员会（FinanceCommittee）、招聘委员会（RecruitmentCommittee）和咨询委员会（AdvisoryCommittee）是委员会（Committee）类型。作为关系集的关联可以表示如下表：


    | 委员会-拥有-俱乐部成员作为主席 (Committee-has-ClubMember-as-chair) | | |

    | :--- | :--- | :--- |

    | 财务委员会 (Finance Committee) | 彼特·米勒 (Peter Miller) | |

    | 招聘委员会 (Recruitment Committee) | 苏珊·史密 (Susan Smith) | |

    | 咨询委员会 (Advisory Committee) | 莎拉·安德森 (Sarah Anderson) | |


    引用属性对应于关联的一种特殊形式，即单向二元关联。通常情况下二元关联不需要方向性，但引用属性表示从属性的域类（定义处）到其范围类（引用处）的单向关联。


    通常，关联是涉及两个或多个对象类型的关系类型。两个对象类型之间的关联被称为二元关联。在本书中我们只讨论二元关联。为了简单，当我们是指二元关联时使用“关联”。


    个体关系（如财务委员会-拥有彼特·米勒作为主席 (FinanceCommittee-has-PeterMiller-as-chair)）是业务交流和信息系统中重要的信息项，而委员会-拥有-俱乐部成员作为主席
    (Committee-has-ClubMember-as-chair)）是信息模型的重要元素。应用程序必须以适当的方式实现它们，特别是在模型-视图-控制器（MVC）架构的模型层中。遗憾的是，许多应用框架缺乏所需的支持。


    在数学中，关联以抽象方式形式化为均匀元组的集合，称为关系（relation）。在信息系统和软件工程经典的实体关系（ER）建模中，对象被称为实体，关联被称为关系类型。统一建模语言（UML）包含了用于信息建模的
    类图。在 UML 中，对象类型被称为类，关系类型被称为关联，而个体关系被称为“链接”（links）。这些术语总结表所示：


    | 我们首选的术语 | UML | ER 图 | 数学 |

    | :--- | :--- | :--- | :--- |

    | 对象 (object) | object | entity | individual |

    | 对象类型 (object type) | class | entity type | unary relation |

    | 关系 (relationship) | link | relationship | tuple |

    | 关联 (relationship type) | association | relationship type | relation |

    | 功能性关联 (functional association) | | | function |


    我们首先讨论引用属性，它们在“无关联”的类模型中隐式地表示二元关联。


    ## 1.1 引用和引用属性


    引用可以是人类可读的，也可以是内部对象引用。人类可读的引用指向人类交流中使用的标识符，例如天体的唯一名称、书籍的 ISBN 以及公司员工的编号。内部对象引用指向
    OOP 对象的计算机内存地址，从而为访问主内存中的对象提供了高效机制。


