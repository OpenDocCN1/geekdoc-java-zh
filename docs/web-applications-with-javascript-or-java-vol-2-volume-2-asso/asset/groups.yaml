    \ Dependency);\n\n- 1. deleting all books (co-)authored by the deleted author\
    \ (reflecting the logic of Existential Dependency);\n- 2. dropping all books (co-)authored\
    \ by the deleted author (reflecting the logic of Existential Independence).\n\n\
    For simplicity, we use the second option. This is shown in the following code:\n\
    \n```javascript\nAuthor.destroy = function (authorId) {\n  for (let isbn of Object.keys(Book.instances))\
