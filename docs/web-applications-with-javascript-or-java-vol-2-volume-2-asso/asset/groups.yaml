    \n# 9.2 编写模型\n\n可以直接编写 Java 实体模型类，以获取我们 Java 后端应用的模型层代码。\n\n## 9.2.1 新问题\n\n与之前讨论的单向关联应用相比，我们必须处理许多新的技术问题：\n\
    \n- 1. 在模型代码中，你现在需要通过维护构成派生反向引用属性值的派生（集合）反向引用，来维护派生反向引用属性。具体而言：\n  - 每当通过 setter\
    \ 初始化或更新单值主引用属性的值时（例如将 `Publisher` 实例 `p` 的引用赋值给 `Book` 实例 `b.publisher`），必须向派生反向引用属性的相应值分配或添加反向引用（例如将\
    \ `b` 添加到 `p.publishedBooks`）；当主引用属性的值更新且派生反向引用属性为多值时，必须删除指向单值主引用属性旧值的过时反向引用；\n\
    \  - 每当可选的单值主引用属性的值取消设置时（例如通过为 `Book` 实例的 `b.publisher` 赋值 `null`），必须从派生反向引用属性的相应值中移除反向引用（例如从\
    \ `p.publishedBooks` 中移除 `b`）；如果派生反向引用属性是多值，否则必须设置或更新派生反向引用属性的相应值；\n  - 每当通过 add\
    \ 方法向多值主引用属性的值添加引用时（例如为 `Book` 实例的 `b.authors` 添加 `Author` 引用），必须向派生引用属性的相应值分配或添加反向引用（例如将\
    \ `b` 添加到 `a.authoredBooks`）；\n  - 每当通过 remove 方法从多值主引用属性的值移除引用时（例如从 `Book` 实例\
    \ `b` 的 `b.authors` 中移除 `Author` 实例的引用），必须从派生反向引用属性的相应值中移除反向引用（例如从 `a.authoredBooks`\
    \ 中移除 `b`），如果派生反向引用属性是多值，\n    否则必须设置或更新派生反向引用属性的相应值；\n  - 每当具有单引用或多个主引用属性值引用的对象被销毁时（例如一个具有单引用\
    \ `b.publisher` 指向 `Publisher` 实例 `p` 的 `Book` 实例被销毁），必须首先移除派生反向引用（例如从 `publishedBooks`\
    \ 中移除 `p`）。注意，当创建一个带有单引用或多引用值的值的对象时（例如一个带有单引用 `b.publisher` 的新 `Book`），其 setter\
