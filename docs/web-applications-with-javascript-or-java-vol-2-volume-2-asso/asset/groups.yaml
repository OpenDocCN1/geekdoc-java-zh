    \n标准的 DBMS 将信息（对象）存储在表的行中，这些行在关系型数据库系统中被构想为集合关系。关系型数据库语言 SQL 用于定义、填充、更新和查询此类数据库。但也有更简单的存储技术允许以表行的形式存储数据，特别是键值存储系统，例如\
