    \ facesContext = FacesContext.getCurrentInstance();\n    facesContext.getExternalContext().getRequestMap().remove(\"\
    book\");\n    Book book = new Book(isbn, title, year, publisher);\n    em.persist(book);\n\
    \    ut.commit();\n  } catch (EntityException e) {\n    ut.rollback();\n  } catch\
    \ (Exception e) {\n    e.printStackTrace();\n  }\n  return \"create\";\n}\n```\n\
    \n它仅仅在 `books` 表中创建了一个新行。更新用例的代码非常相似，区别在于添加了选择元素（即 `h:selectOneMenu`）来选择书籍：\n\n\
    ```xml\n<ui:composition template=\"/WEB-INF/templates/page.xhtml\">\n<ui:define\
    \ name=\"content\">\n<h:form id=\"updateBookForm\" styleClass=\"pure-form pure-form-aligned\"\
    >\n<h:panelGrid columns=\"3\">\n\n<h:outputLabel for=\"selectBook\" value=\"Select\
    \ book: \" />\n<h:selectOneMenu id=\"selectBook\" value=\"#{book.isbn}\">\n<f:selectItem\
    \ value=\"\" itemLabel=\"-\" />\n<f:selectItems value=\"#{bookCtrl.books}\" var=\"\
    b\"\n  itemLabel=\"#{b.title}\" />\n<f:ajax listener=\"#{bookCtrl.refreshObject(book)}\"\
    \n  render=\"isbn publisher\"/>\n</h:selectOneMenu>\n\n<h:message for=\"selectBook\"\
    \ />\n</h:panelGrid>\n<h:commandButton value=\"Update\"\naction=\"#{bookCtrl.update(book.isbn,\
    \ book.title, book.year, book.publisher.name)}\" />\n</h:form>\n</ui:define>\n\
    </ui:composition>\n```\n\n## 5 使用 Java EE 实现单向功能性关联\n\n单向功能性关联是一一对多或多对多的关联。在两种情况下，这种关联都通过多值引用属性来表示。\n\
    \n在本章中，我们将展示：\n\n- 1. 如何从具有多值引用属性的 OO 类模型导出 Java 实体模型，\n- 2. 如何以实体类的形式编写 Java\
    \ 实体模型（实现模型类），\n- 3. 基于模型编写视图和控制器代码。\n\n## 5 在 Java 中实现多值引用属性\n\n多值引用属性如 `Book::authors`\
    \ 允许存储某些类型的内部引用集合，例如对 `Author` 对象的引用。创建 `Book` 类型的对象时，构造函数需要一个参数来为该属性提供适当的值。通常，值可以是内部对象引用或\
    \ ID 引用。使用 JPA 时我们使用对象引用：\n\n```java\n@Entity @Table (name=\"books\")\n@ManagedBean\
    \ (name=\"book\")\n@ViewScoped\npublic class Book {\n\n    private Set<Author>\
    \ authors;\n\n    public Book() { // JPA @Entity 注解需要！\n    public Book( String\
    \ isbn, String title, Integer year,\n            Publisher publisher, Set<Author>\
    \ authors) { . . . }\n\n    public Set<Author> getAuthors() { return this.authors;\
    \ }\n    public void setAuthors( Set<Author> authors) { this.authors = authors;\
    \ }\n}\n```\n\n"
