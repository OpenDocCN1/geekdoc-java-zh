  mdcn: "\n\n## 14.3 案例研究 2：使用连接表继承实现类层次结构\n\n我们案例研究的起点是图 12.8 所示的设计模型。在接下来的章节中，我们将展示如何使用**类层次结构合并**设计模式消除\
