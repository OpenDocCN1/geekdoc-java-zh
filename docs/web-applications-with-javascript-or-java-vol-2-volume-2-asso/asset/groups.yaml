    \ {\n    console.log(`${e.constructor.name} while deserializing ${key}: ${e.message}`);\n\
    \  }\n}\n```\n\n# 13.3.4.3 在保存子表时保存主表\n\n由于应用数据在运行期间一直保存在主内存中（只要浏览器中的应用网页保持开启），因此在应用退出时（例如关闭浏览器标签页），必须将数据保存到持久化存储中。当我们在\
