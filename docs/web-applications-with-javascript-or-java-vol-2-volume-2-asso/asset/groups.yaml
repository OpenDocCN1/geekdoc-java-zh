    \ and Biography are subclasses of Book, so we define them with extends Book. For\
    \ each subclass, we add a @DiscriminatorValue annotation with a value from the\
    \ BookCategoryEL enumeration.\n\n# 14.2.4 STI Database Schema\n\nAs a result of\
    \ the annotation\n\n```\n@Inheritance(strategy=InheritanceType.SINGLE_TABLE)\n\
    ```"
