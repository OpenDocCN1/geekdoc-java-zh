    | * | |

    | 0.1 | | |

    | Publisher | Book authored Books |

    | name: String (id) address : String | isbn: String (id) title: String year :
    Integer |

    | 0.1 | * | * |

    | managed Publisher 0.1 | (disjoint) |

    | | TextBook | | |

    | | subjectArea : String about : String |

    | Manager | |


    Figure 12.4: An information model with two class hierarchies.


    We have the following duality: while all features of a supertype are included
    in the intentions, or feature sets, of its subtypes (intensional inclusion), all
    instances of a subtype are included in the extensions, or instance sets, of its
    supertypes (extensional inclusion). This formal structure has been investigated
    in formal concept analysis.


    Due to the intention/extension duality we can specialize a given type in two different
    ways:


    - **By extending the type’s intention** through adding features to the new subtype
    (such as adding the attribute subjectArea to the subtype TextBook).

    - **By restricting the type’s extension** through adding a constraint (such as
    defining a subtype MathTextBook as a TextBook where the attribute subjectArea
    has the specific value “Mathematics”).


    Typical OO programming languages, such as Java and C#, only support the first
    possibility (specializing a given type by extending its intention), while XML
    Schema and SQL99 also support the second possibility (specializing a given type
    by restricting its extension).


    ## 12.4 Type Hierarchies


    A *type hierarchy* (or class hierarchy) consists of two or more types, one of
    them being the *root* (or *top-level*) type, and all others having at least one
    direct supertype.


    ## 12.4 Type Hierarchies 127


    When all non-root types have a unique direct supertype, the type hierarchy is
    a **single-inheritance hierarchy**, otherwise it''s a **multiple-inheritance hierarchy**.
    For instance, in Figure 12.5 below, the class Vehicle is the root of a single-inheritance
    hierarchy, while Figure 12.6 shows an example of multiple-inheritance hierarchy,
    having two direct superclasses.


    **Figure 12.5:** A class hierarchy.


    **Figure 12.6:** A multiple-inheritance hierarchy.


    The simplest case of a hierarchy, which has only one level of subtyping, is called
    *generalization* in UML, but may be more naturally called **segmentation**. A
    segmentation is *complete*, if the union of all subclasses is equal to the extent
    of the superclass. A segmentation is *disjoint*, if in other words no instance
    of superclass instantiates more than one subclass. Otherwise, it is called *overlapping*.


    In a class diagram, we can express these constraints by annotating the generalization
    arrow with *complete* and *disjoint* in braces. For instance, the annotation of
    a segmentation with {complete, disjoint} indicates that it is a partition. By
    default, whenever a segmentation does not have any annotation, like the segmentation
    of Vehicle into LandVehicle and WaterVehicle in Figure 12.4, it is (incomplete,
    overlapping).


    An information model may contain any number of class hierarchies.


    ## 12.5 Kinds and Roles


    In order to better understand the different categories of object types and subtypes
    in natural language statements about sortal and non-sortal, and between rigid
    and non-rigid, we can distinguish between sortal and non-rigid as presented by
    Giancarlo Guizzardi in his theory of object types.


    An object type is sortal if it has a uniform identity for its instances. Such
    a condition defines the property (or set of properties) that no two instances
    have without being the same object. An example of sortal object is Person since
    all its instances (people) are identifiable by a set of properties related to
    their birth (born when, and to whom). Book is an example of a non-sortal object
    type because it contains instances (e.g., textbooks and self-published novels)
    that are identified in different ways.


    An object type is rigid if its instances cannot cease to be of that type existing.
    Person is an example of a rigid object type, while Employee is not rigid. A segmentation
    is called rigid if all subclasses are rigid.


    A kind is a rigid sortal object type. Examples of kinds are Textbook and Person.
    A role is a sortal object type classifying instances of a class K that participate
    in a relationship (of a certain type A) with an instance of an object type O.
    Notice that R is a non-rigid subtype of K since its instances do not cease to
    exist when they happen to ceaseantiating because they no longer participate in
    a relationship of type A with an instance of type O.


    For instance, Employee is an example of a role since it is a sortal object type
    classifying instances of Person that participate in an employment relationship
    with an instance of type Enterprise.


