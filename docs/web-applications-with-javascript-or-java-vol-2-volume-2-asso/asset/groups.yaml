    The category cannot be changed!\");\n  } else {\n    validationResult = Book.checkCategory(c);\n\
    \  }\n  if (validationResult instanceof NoConstraintViolation) {\n    this._category\
    \ = parseInt(c);\n  } else {\n    throw validationResult;\n  }\n}\n```\n\n虽然段属性的\
    \ getter（在本例中：`subjectArea` 和 `about`）遵循标准模式，但它们的检查和 setter 必须确保该属性适用于被检查实例的类别。这通过\n\
    \n150 13 使用原生 JS 实现子类型\n\n通过检查属性值和类别的组合来实现，如下例所示：\n\n```javascript\nstatic checkSubjectArea(sa,\
    \ c) {\nif (c === BookCategoryEL.TEXTBOOK && !sa) {\n  return new MandatoryConstraintViolation(\n\
    \    \"A subject area must be provided for a textbook!\");\n} else if (c === BookCategoryEL.TEXTBOOK\
    \ && sa) {\n  return new ConstraintViolation(\"A subject area must not be provided\
    \ if the book is not a textbook!\");\n} else if (sa && typeof(sa) !== \"String\"\
    \ || sa.trim() === \"\") {\n  return new RangeConstraintViolation(\n    \"The\
    \ subject area must be a non-empty string!\");\n else {\n  return new ConstraintViolation();\n\
    }\n```\n\n在 `toString` 函数中，我们使用 `switch` 语句序列化 `category` 属性和段属性：\n\n```javascript\n\
    toString() {\n  var bookStr = \"Book(ISBN:\" + this.isbn + \", title:\" +\n  \
    \  this.title + \", year:\" + this.year;\n  switch (this.category) {\n    case\
    \ BookCategoryEL.TEXTBOOK:\n      bookStr += \" , subject area:\" + this.subjectArea;\n\
    \      break;\n    case BookCategoryEL.BIOGRAPHY:\n      bookStr += \" , about:\"\
    \ + this.about;\n      break;\n  }\n  return bookStr + \")\";\n}\n```\n\n在模型类的\
    \ `update` 方法中，只有当属性被更新时（即存在一个与旧属性值不同的更新参数），我们才设置它。对于 `category` 属性的 `FrozenConstraint`\
    \ 特殊情况，我们需要确保它在尚未赋值时可以随段属性一起被更新。那么，在 `update` 方法中，如果 `book.category === undefined`\
    \ 对于\n\n13.2 案例研究 1：消除类层级结构 151\n\n我们以更标准的方式处理段属性 `subjectArea` 的更新：\n\n```javascript\n\
    Book.update = function ({isbn, title, year, category, subjectArea, about}) {\n\
    \  const book = Book.instances[isbn];\n  objectBeforeUpdate = util.clone(book);\n\
    \  var noConstraintViolated=true, updatedProperties=[];\n  try {\n    if (category\
    \ && book.category !== category) {\n      book.category = category;\n      updatedProperties.push(\"\
    category\");\n    } else if (category === \"\" && \"category\" in book) {\n  \
    \    throw new FrozenConstraintViolation(\"The category cannot be unset!\");\n\
    \    }\n    if (subjectArea && book.subjectArea !== subjectArea) {\n      book.subjectArea\
    \ = subjectArea;\n      updatedProperties.push(\"subjectArea\");\n    }\n    if\
    \ (about && book.about !== about) {\n      book.about = about;\n      updatedProperties.push(\"\
    about\");\n    }\n  } catch (e) {\n    // ...\n  }\n};\n```\n\n13.2.4 编写 View\
    \ 和 Controller\n\n应用程序的用户界面 (UI) 包含一个允许导航到数据管理页面（在示例中为 `books.html`）。此类数据管理页面包含：管理书籍、列出所有、创建书籍、更新书籍和删除书籍，且每次只显示其中一个（通过设置\
    \ `display:none`）。\n\n13.2.4.1 总结\n\n我们需要通过以下方式处理“列出所有”用例以及“创建书籍”和“更新书籍”用例中的 `category`\
    \ 属性和段属性 `subjectArea`：\n\n- 1. 在 `books.html` 的“列出所有”用例显示表中添加段信息列（标题为“Category”）。\n\
    - 2. 在 `books.html` 的“创建书籍”和“更新书籍”用例表单中添加“Category”选择字段以及所有段属性的输入字段。段属性字段仅在选择了相应的类别。\n\
    \n13.2.4.2 在检索/列出所有中添加段列\n\n我们在 `books.html` 的“列出所有书籍”用例显示表中添加一个“Special”类别：\n\
    \n```html\n<table id=\"books\">\n  <head>\n    <tr>\n      <th>ISBN</th>\n   \
    \   <th>Title</th>\n      <th>Year</th>\n      <th>Category</th>\n    </tr>\n\
    \  </head>\n  <tbody></tbody>\n</table>\n```\n\n没有特殊类别的书籍在该列中将有一个空单元格；对于其他书籍，它们的类别将在该列显示并带有特定类别信息。这需要在\
    \ `view/books.js`文件的 `pl.v.books.retrieveAndAll.setupInterface` 中对应相应的 `switch`\
    \ 语句：\n\n```javascript\nif (book.category) {\n  switch (book.category) {\n   \
    \ case BookCategoryEL.TEXTBOOK:\n      row.insertCell(-1).textContent = book.subjectArea\
    \ + \" textbook\";\n      break;\n    case BookCategoryEL.BIOGRAPHY:\n      row.insertCell(-1).textContent\
    \ = \"Biography about \" + book.about;\n      break;\n  }\n}\n```\n\n13.2.4.3\
    \ 在创建和更新中添加类别选择字段\n\n在这两种情况下，我们需要通过选择字段允许选择特殊的书籍类别（'textbook' 或 'biography'），如下\
    \ HTML 片段所示：\n\n```html\n<div class=\"field\">\n  <label>Category: <select name=\"\
    category\"></select></label>\n</div>\n<div class=\"field Textbook\"> <!-- 条件字段\
    \ -->\n  <label>Subject area: <input type=\"text\" name=\"subjectArea\" /></label>\n\
    </div>\n<div class=\"field Biography\"> <!-- 条件字段 -->\n  <label>About: <input\
    \ type=\"text\" name=\"about\" /></label>\n</div>\n```\n\n注意，我们将 \"Textbook\"\
    \ 和 \"Biography\" 作为段字段容器元素的 `class` 属性值。这支持根据 `category` 属性的值对 \"Textbook\" 和\
    \ \"Biography\" 字段进行渲染和取消渲染。\n\n在 `handleCategorySelectEventHandler` 中，只有在选择了相应的类别时，才会通过\
    \ `pl.v.app.displaySegmentFields` 显示段属性字段。\n\n"
