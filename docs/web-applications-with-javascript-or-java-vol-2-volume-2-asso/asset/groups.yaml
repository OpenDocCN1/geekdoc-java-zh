    \      delete book.authors[authorId];\n    }\n  }\n  console.log(\"Author \" +\
    \ authorId + \" deleted.\");\n};\n```\n\n## 3.4.4 Serialization and Object-to-Storage\n\
    \nWe need a serialization function to toString() and an object-to-storage function\
