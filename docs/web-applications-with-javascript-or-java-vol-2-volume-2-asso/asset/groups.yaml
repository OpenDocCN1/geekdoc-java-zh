    ```\n\n## 10 关联特殊主题\n\n### 10.1 部分-整体关联 (Part-Whole Associations)\n\n部分-整体关联表示部分类型与整体类型之间的关系。实例是两个对象之间的部分-整体关系，其中一个是另一个（整体）的部分。UML\
    \ 将部分-整体关联分为两种：聚合（aggregation）和组合（composition）。虽然这两个术语在 UML 中的定义相当精确，尽管并不尽人意，但许多软件开发者遵循\
    \ C++ 编程社区的术语传统，有不同的解释：与“聚合”的部分不同，“组合”的部分不能脱离引用它们的组合对象而独立存在。\n\n我们遵循 UML 并通过引入两种组合之间的区别来改进对组合的定义：具有可分离部分的组合和不可分割部分的组合。\n\
    \n#### 10.1.1 聚合 (Aggregation)\n\n聚合是部分-整体关联的一种特殊形式，其中整体的部分可以与其他整体共享。例如，我们可以对\
    \ `DegreeProgram`（学位计划）类和 `Course`（课程）类之间的聚合进行建模，如图所示，因为课程是学位计划的一部分，且一门课程可以在两个或多个学位计划之间共享（例如，工程学学位可以与计算机科学学位共享一门\
    \ C 语言课程）。\n\n| DegreeProgram | Course |\n| :--- | :--- |\n| name : String | id\
    \ : String |\n| * | name : String |\n\n然而，具有共享部分的聚合概念实际上并没有太大意义，因此对如何编写关联代码没有产生任何影响，许多开发者倾向于不在他们的类图中使用空心菱形，但\
    \ UML 规定：“共享聚合的精确语义取决于应用领域和建模者”。\n\n聚合关联在整体侧的多重性（multiplicity）可以是任意数字 (*)，因为一个部分可能属于或共享于任意整体。\n\
    \n## 10 关联特殊主题\n\n#### 10.1.2 组合 (Composition)\n\n在部分-整体关联概念中，聚合和组合之间的区别竟然存在如此多的困惑，这令人惊讶。其主要问题在于广泛的误解（即使在专家软件开发者和\
    \ UML 作者中也是如此），认为组合的概念意味着整体与其部分之间存在生命周期依赖，即部分离开整体就无法存在。但这种观点忽略了事实：即也存在具有非共享部分的部分-整体关联，在这种情况下，部分可以从整体中脱离并在整体销毁后继续存活。\n\
    \n在 UML 规范文件中，“组合”一词的定义一直暗示了不可共享的部分，但并没有明确“组合”的定义性特征是什么，哪些仅仅是可选的特征。即使在 UML 2.5\
    \ 版本（截至 2015 年），在尝试提供“组合”术语的定义后，它仍然模糊，并且没有为如何建模不可共享部分的部分-整体关联提供指导——即部分可以从整体中脱离并在销毁后存活的情况，而不是无法脱离并随整体一起销毁的情况。它们说：\n\
    \n如果一个组合对象被删除，它的所有部分都是与其一起被删除的对象。\n\n但同时他们又说：\n\n> 一个对象可以在组合对象被删除之前从组合对象中移除，因此不会作为组合对象的一部分被删除。\n\
    \n这指向了 UML 定义的不完全性，它没有考虑到组件和组合对象之间的生命周期依赖。因此，理解如何增强 UML 定义非常重要，例如通过引入 UML 刻型（stereotype）来刻画“不可分割”的组合，或者通过引入约束关键字\
    \ `separable` 来刻画组件侧的关联端。\n\nMartin Fowler 解释说，刻画组合关系的主要问题是“一个对象只能是一个组合关系的一部分”。G.\
    \ Bellelekens 在博客文章《UML Composition with Aggregation as Association》中也解释了这一点。除了定义组合的这种特征（拥有独有的或非共享的部分）外，组合还可能伴随着组合对象与其组件之间的生命周期依赖。事实上，此类依赖有两种类型：\n\
    \n- 1. 每当一个组件必须附加到另一个组合对象上（或者说，当它具有强制性组合时，如组合线组合侧的“恰有一个”多重性所表示），那么当它当前的组合对象被销毁时，它必须被重新使用（内部或重新附加到另一个组合对象）或被销毁。Person（人）和\
