    error\" />\n</h:panelGrid>\n```\n\n在选择控件中，引用了三个备用面板：\n\n- 1. \"standardBookPanel\"\
    \n```xml\n<h:panelGroup id=\"standardBookPanel\" rendered=\"#{viewScope.bookType\
    \ == null}\">\n  <h:commandButton value=\"Create\" action=\"#{bookController.create(book.isbn)}\"\
    \ />\n</h:panelGroup>\n```\n\n- 2. \"textBookPanel\"\n```xml\n<h:panelGroup id=\"\
    textBookPanel\" rendered=\"#{viewScope.bookType == 'textbook'}\" columns=\"3\"\
    >\n  <h:outputText value=\"Subject: \" />\n  <h:inputText id=\"subjectArea\" value=\"\
    #{book.subjectArea}\" />\n  <h:message for=\"subjectArea\" errorClass=\"error\"\
    \ />\n  <h:commandButton value=\"Create\" action=\"#{bookController.create(book.isbn)}\"\
    \ />\n</h:panelGroup>\n```\n\n- 3. \"biographyBookPanel\"\n```xml\n<h:panelGroup\
    \ id=\"biographyBookPanel\" rendered=\"#{viewScope.bookType == 'biography'}\"\
    \ columns=\"3\">\n  <h:outputText value=\"About: \" />\n  <h:inputText id=\"about\"\
    \ value=\"#{book.about}\" />\n  <h:message for=\"about\" errorClass=\"error\"\
    \ />\n  <h:commandButton value=\"Create\" action=\"#{bookController.create(book.isbn)}\"\
    \ />\n</h:panelGroup>\n```\n\n"
