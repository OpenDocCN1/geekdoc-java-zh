    # # 10 Special Topics on Associations


    # ## 10.1 Part-Whole Associations


    A part-whole association represents a relationship between a part type and a whole
    type. Instances are part-whole relationships between two objects where one of
    them is a part of the other (the whole). The UML makes a distinction between two
    kinds of part-whole associations: aggregation and composition. While these two
    terms are defined in a pretty precise, albeit unsatisfactory, way in the UML,
    many software developers have a different interpretation following a terminological
    tradition of the C++ programming community, unlike the parts of an ‘aggregation’,
    the parts of a ‘composition’ cannot exist independently of the composite references
    them.


    We follow the UML and improve their definition of composition by introducing a
    distinction between two kinds of compositions: those with separable parts and
    those with inseparable parts.


    # ### 10.1.1 Aggregation


    An aggregation is a special form of a part-whole association, where the parts
    of a whole can be shared with other wholes. For instance, we can model an aggregation
    between the classes DegreeProgram and Course, as shown in the following diagram,
    since a course is part of a degree program and a course can be shared among two
    or more degree programs (e.g. an engineering degree could share a C programming
    course with a computer science degree).


    | DegreeProgram | Course |

    | :--- | :--- |

    | name : String | id : String |

    | * | name : String |


    However, the concept of an aggregation with shareable parts doesn’t mean much,
    really, so does not have any implications on how to code the association and many
    developers therefore prefer not to use the white diamond in their class graphs,
    but the UML says: “Precise semantics of shared aggregation varies by application
    area and modeler”.


    The multiplicity of an aggregation’s association end at the whole side may be
    any number (*) because a part may belong to, or shared among, any number of wholes.'
