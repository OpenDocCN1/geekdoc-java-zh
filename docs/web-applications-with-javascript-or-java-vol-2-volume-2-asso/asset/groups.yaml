    以下哪些说法是正确的？选择一个或多个：


    - 所有 Cde 实例都有属性 a1。

    - Cde 的标识符是 a1。

    - 所有 Cde 实例引用 Bcd 对象。

    - Abc 的实例具有 c 值。

    - 对于任何 Abc 实例，a3 的值必须大于 a2。

    - 对于任何 Cde 实例，a3 的值必须大于 a2。

    - Cde 的标识符是 c。


