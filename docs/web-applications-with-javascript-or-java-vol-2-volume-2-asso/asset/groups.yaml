  - "[PAGE 88]\n\n# 5.4 Write the Model Code 73\n\nviolation exception is raised,\
    \ and the author cannot be deleted. We have two possibilities for dealing with\
    \ this situation:\n\n+   1. delete all books (co-)authored by the deleted author;\n\
    2. drop from all books (co-)authored by the deleted author reference to the deleted\
    \ author.\n\nWe go for the second option. This is shown in the following code\
    \ of the Author-delete method:\n\n```\npublic static void delete(EntityManager\
    \ em, UserTransaction ut,\nInteger personId) throws Exception {\nut.begin();\n\
    Author author = em.find(Author.class, personId);\n// Find all books of this author\n\
    Query query = em.createQuery(\"SELECT DISTINCT b FROM Book b \" + \n\"INNER JOIN\
    \ b.authors a WHERE a.id = :personId\");\nquery.setParameter(\"personId\", personId);\n\
    List<Book> books = query.getResultList();\n// Remove the author reference from\
    \ the books'\nfor (Book b : books) {\n  b.getAuthors().remove(author);\n}\n//\
    \ Delete the author record (table row)\nem.remove(author);\nut.commit();\n```\n\
    \nEssentially, the delete operation consists of three steps:\n\n+   1. Create\
    \ a JPQL query which selects all books of this author (since the books of an author\
    \ are not directly accessible from author).\n2. For every found book referencing\
    \ this author, we have to remove the author reference from its authors list.\n\
    3. Finally, delete the author record.\n\n# 5.4.4 Serialization and De-Serialization\n\
    \nIn Java EE, the serialization from objects to corresponding database records\
    \ as well as the de-serialization from database records to objects are performed\
    \ automatically by the Java EE execution environment based on JPA annotations\
    \ and converter classes for custom conversions."
- md: "\n## 5.5 Write the User Interface Code\n\n### 5.5.1 Show Information About\
    \ Associated Objects in Retrieve/List All\n\nFor showing information about the\
    \ authors of a book in the `retrieve/list all` books case, the corresponding cell\
