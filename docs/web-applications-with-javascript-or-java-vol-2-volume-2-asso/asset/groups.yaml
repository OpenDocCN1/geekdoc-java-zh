- md: "\n## 13.3 Case Study 2: Implementing a Class Hierarchy\n\nWhenever a class\
    \ hierarchy is more complex, we cannot simply eliminate it, but have to implement\
    \ it (1) in the app's model code, (2) in the underlying database and (3) in its\
    \ user interface.\n\nThe starting point for our case study is the design model\
    \ shown in Figure 12.8 above. In the following sections, we derive a JS class\
    \ model and a JS entity model from the design model. The entity table model is\
    \ used as a design for the object-to-storage mapping that we use for storing the\
    \ objects of our app with the browsers' Local Storage technology.\n\n### 13.3.1\
    \ Make a JS Class Model\n\nWe define the model classes of our example app with\
    \ the help of a JS class model that we derive from the design model by essentially\
    \ leaving the generalization rows as they are just adding get/set methods and\
    \ static check functions to each class. However, in the case of our example app,\
    \ it is natural to apply the Class Hierarchy Merge design pattern (discussed in\
    \ Section 12.6) to the single-subclass segment of Employee for simplifying the\
    \ class model by eliminating the Manager subclass. This leads to the model shown\
    \ in Figure 13.2. Notice that a Person may be an Employee or an Author or both.\n\
    \n| Person |\n| :--- |\n| «get/set» personid : Integer (id) |\n| «get/set» name\
    \ : String |\n| checkPersonid(in string) : ConstraintViolation |\n| checkPersonAsid(in\
    \ id : string, in type) : ConstraintViolation |\n| checkName(in n : string) :\
    \ ConstraintViolation |\n\n| Author |\n| :--- |\n| «get/set» biography : string\
    \ |\n| checkBiography(in b : string) : ConstraintViolation |\n\n| Employee |\n\
    | :--- |\n| «get/set» empno[1] : number (unique) |\n| «get/set» category[0..1]\
    \ : EmployeeCategoryEL |\n| «get/set» department(in n : string) : string |\n|\
    \ checkEmpno(in n : number) : ConstraintViolation |\n| checkCategory(in c : number)\
    \ : ConstraintViolation |\n| checkDepartment(in d : string) : ConstraintViolation\
    \ |\n\n| «enumeration» |\n| :--- |\n| EmployeeCategoryEL |\n| MANAGER |\n\nFigure\
    \ 13.2: The JS class model of the Person roles class hierarchy.\n\n### 13.3.2\
    \ Make a JS Entity Table Model\n\nSince we use the browsers' Local Storage as\
    \ the persistent storage technology for our example app, we have to deal with\
    \ simple key-value storage. For each design model class with a singular (capitalized)\
    \ name Entity, we use its pluralized lowercase name entities as the corresponding\
    \ table name and as a key that its associated string value is obtained by serializing\
    \ the object collection Entity instances with the help of the JSON.stringify method.\n\
    \nWe design a set of suitable JS entity tables in the form of a JS entity table\
    \ that we derive from the information design model. We have to make certain choices\
    \ how to organize our data store and how to derive a corresponding entity table\
    \ model.\n\nThe first choice to make concerns is using the Single Table Inheritance\
    \ (STI), the Table per Class Inheritance (TCI) or the Joined Tables Inheritance\
    \ (JTI) approach, which are introduced in Section 12.7.4. In the STI approach,\
    \ a segmentation (or an entire hierarchy) is represented with a single table,\
    \ containing columns for all attributes of all classes involved, as shown in the\
    \ example model of Figure 13.3.\n\n| « entity table » | category: |\n| :--- |\
    \ :--- |\n| personid[1]: number (pkey) | 1 = Author |\n| name[1]: string | 2 =\
    \ Employee |\n| categories[?]: number (1,2,3) | 3 = Employee & Manager |\n| biography[0]:\
    \ string | |\n| empno[0]: number (unique) | |\n| department[0]: string | |\n\n\
    **Figure 13.3:** An STI model of the Person roles class hierarchy.\n\nSince the\
    \ given segmentation is non-disjoint, a multi-valued enumeration attribute categories\
    \ is used for representing the information to which subclasses instance belongs.\n\
    \nUsing the STI approach is feasible for the given example, the role hierarchy\
    \ does not have many levels and the segment subclasses do not add any attributes.\
    \ But, in a more realistic example, we would have more attributes in the segment\
    \ subclasses of the given role hierarchy. The STI approach is not really an option\
    \ for representing a multi-level role hierarchy Manager-is-subclass-of-Employee.\n\
    \nFor simplicity, and because the browsers' Local Storage does not support foreign\
    \ keys as required by JTI, we choose the TCI approach, where we obtain a separate\
    \ table for each class of the Person segmentation, but without foreign keys. Our\
    \ choices result in the model shown in Figure 13.4 below, which has been derived\
    \ from the design model shown in Figure 12.8:\n\n1. Merging the Manager subclass\
    \ into its superclass Employee, according to the Class Hierarchy Merge design\
    \ pattern described in Section 12.6.\n2. Replacing the standard ID property modifier\
    \ <id> of the personId attribute of Person, Author and Employee with <pkey> for\
    \ indicating that the attribute is a primary key.\n3. Replacing the singular (capitalized)\
    \ class names (Person, Author and Employee) with pluralized lowercase table names\
    \ (people, authors and employees).\n4. Adding the <JS entity table> stereotype\
    \ to all class rectangles (people, authors and employees).\n5. Replacing the platform-independent\
    \ datatype with JS datetime names.\n6. Dropping all generalization/inheritance\
    \ arrows and adding all attributes of supertables (personId and name) to subtables.\n\
    \n| JS entity table |\n| :--- |\n| people |\n| personid : number (pkey) |\n| name\
    \ : string |\n| JS entity table |\n| authors |\n| personid : number (pkey) |\n\
    | name : string |\n| biography : string |\n| JS entity table |\n| employees |\n\
    | personid[1] : number (pkey) |\n| name[1] : string |\n| empno[1] : number (unique)\
    \ |\n| category[0..1] : number |\n| department[0..1] : string |\n\nFigure 13.4:\
    \ A TCI of the Person roles.\n\nIn the case of JTI approach, in addition to the\
    \ steps 1–5 above, we would:\n\n1. Copy the primary key column (personId) of root\
