- md: "\n## 13 Subtyping with Plain JS\n\nIn this chapter, we first explain the general\
    \ approach to constructor-based subtyping in JavaScript before presenting two\
    \ case studies based on fragments of the information model of our running example,\
    \ the Public Library app, shown above.\n\nIn the first case study, we consider\
    \ the single-level class hierarchy with root Book shown in Figure 12.1, which\
    \ is an incomplete rigid segmentation. We use the Class Hierarchy Merge design\
    \ pattern for refactoring this simple class hierarchy to a single class that can\
    \ be mapped to a persistent database table.\n\nIn the second case study, we consider\
    \ the multi-level class hierarchy consisting of the Person roles Employee, Manager\
    \ and Author, shown in Figure 12.8. The segmentation of Person into Employee and\
    \ Author does not have any constraints, which means it is complete, overlapping\
    \ (non-disjoint) and non-rigid.\n\nWe use the Hierarchy Merge design pattern for\
    \ the simple Manager-is-Employee sub-hierarchy, and the Joined Inheritance approach\
    \ for mapping the Employee-and-Author-is-a-Person class hierarchy to a set of\
    \ three database tables that are related with each other via foreign key dependencies.\n\
    \nIn both case studies we show:\n\n- 1. how to derive a JS class model, and a\
    \ corresponding entity table model,\n- 2. how to code the JS class model in the\
    \ form of JS model classes,\n- 3. how to write the view and controller code based\
    \ on the model code.\n\n## 13.1 Subtyping with Constructor-Based Classes\n\nBefore\
    \ the version ES2015, JavaScript did not have an explicit class concept and subtyping\
    \ was not directly supported, it had to be implemented with the help of certain\
    \ code patterns providing two inheritance mechanisms: (1) inheritance of properties\
    \ and (2) inheritance of methods.\n\nAs we explained in Chapter 1 of Volume 1,\
    \ classes can be defined in two alternative ways: constructor-based and factory-based.\
    \ Both approaches have their own way of implementing inheritance.\n\nWe summarize\
    \ the ES2015 code pattern for defining a superclass and a subclass in a constructor-based\
    \ single-inheritance class hierarchy with the help of the following example:\n\
    \n| Person |\n| --- |\n| firstName : String |\n| lastName : String |\n\n| Student\
    \ |\n| --- |\n| studNo : Integer |\n\nFirst, we define a base class, Person, with\
    \ two properties, firstName and lastName, defined with getters and setters:\n\n\
    ```javascript\nclass Person {\n  constructor ({first, last}) {\n    // assign\
    \ properties by invoking their setters\n    this.firstName = first;\n    this.lastName\
    \ = last;\n  }\n\n  getFirstName () {return this._firstName};\n  setFirstName\
    \ (f) {\n    . . . check constraints\n    this._firstName = f;\n  }\n\n  getLastName\
    \ () {return this._lastName};\n  setLastName (l) {\n    . . . check constraints\n\
    \    this._lastName = 1;\n  }\n}\n```\n\nThen, we define a subclass, Student,\
    \ with one additional property, studNo:\n\n```javascript\nclass Student extends\
    \ Person {\n  constructor ({first, last, studNo}) {\n    // invoke constructor\
    \ of superclass\n    super({first, last});\n    // assign additional properties\n\
    \    this.studNo = studNo;\n  }\n\n  get studNo () {return this._studNo;}\n  set\
    \ studNo (sn) {\n    // check constraints\n    .. this._studNo = sn;\n  }\n}\n\
    ```\n\n## 13.2 Case Study 1: Eliminating a Class Hierarchy\n\nSimple class hierarchies\
    \ can be eliminated by applying the Class Hierarchy Merge design pattern. The\
    \ starting point for our case study is the simple class hierarchy shown in the\
    \ information design model of Figure 12.1 representing a disjoint (but incomplete)\
    \ rigid segmentation of Book into TextBook and Biography. This model is first\
    \ simplified by applying the Class Hierarchy Merge design pattern, resulting in\
    \ the following model:\n\n| isbn[1] : String (id) | <<enumeration> |\n|---|---|\n\
    | title[1] : String | BookTypeEL |\n| year[1] : Integer | TextBook |\n| category[0..1]\
    \ : BookTypeEL (frozen) | Biography |\n| subjectArea[0..1] : String | |\n| about[0..1]\
    \ : String | |\n\n![](img/26c953d1023457333859f69258a99556_160_0.png)\n\nWe now\
    \ derive a JS class model from this design model.\n\n### 13.2.1 Make the JS Class\
    \ Model\n\nWe make the JS class model in 3 steps:\n\n- Replace the platform-independent\
    \ datatypes (used as the ranges of attributes and parameters) with JS datatypes.\
    \ This includes the case of enumeration-valued attributes, such as category, which\
    \ are turned into number-valued attributes restricted to the enumeration integers\
    \ of the underlying enumeration type.\n- 2. Decorate all properties with a «get/set»\
    \ stereotype for indicating that they have implicit getters and setters.\n- 3.\
    \ Add property check functions, as described in Chapter 8 of Volume 1. The checkCategory\
    \ function, as well as the checks of the segment properties need special consideration\
    \ according to their implied semantics. In particular, a segment check function\
    \ must ensure that the property can only be assigned if the category attribute\
    \ has a value representing the corresponding segment. We explain this validation\
    \ semantics in more detail below when we discuss how the JS class model is coded.\n\
    \nThis leads to the JS class model:\n\n| Book | «enumeration» |\n| --- | --- |\n\
    | <get/set> isbn[1] : String | BookTypeEL |\n| <get/set> title[1] : String | TEXTBOOK\
    \ |\n| <get/set> year[1] : Integer | Text | |\n| <get/set> category[0..1] : BookTypeEL\
    \ (frozen) | BIOGRAPHY |\n| <get/set> subjectArea[0..1] : String | |\n| <get/set>\
    \ about[0..1] : String | |\n\nFigure 13.1: The JS class model of the merged class\
    \ hierarchy.\n\n### 13.2.2 New Issues\n\nComparison to the enumeration discussed\
    \ in Chapter 11 of Volume 1, we have to deal with a number of issues:\n\n- 1.\
    \ In the model code we have to take care of\n    1. Adding the constraint violation\
    \ FrozenValueConstraint in errorTypes.js.\n    2. Coding the enumeration type\
    \ to be used as the range of the category attribute BookCategoryEL in our example.\n\
    \    3. Coding the checkCategory function for the category attribute. In our example\
    \ this attribute is optional, due to the fact that Book segmentation is incomplete.\
    \ If the segmentation, to which Class Hierarchy Merge pattern is applied, is complete,\
    \ then the category attribute is mandatory.\n- 4. Coding the check functions for\
    \ all segment properties such that they take the category as a second parameter\
    \ for being able to test the segment concerned.\n- 5. Refining the serialization\
    \ function toString() by adding a category distinction (switch) statement for\
    \ serializing only the segment properties that apply to the given category.\n\
    - 6. Implementing the Frozen Value Constraint for the category attribute in Book.update\
    \ by updating the category of a book only if it has not yet been defined. This\
    \ means it cannot be updated anymore as soon as it has been defined.\n- 2. In\
    \ the UI code we have to of\n    1. Adding a \"Special type\" (or \"Category\"\
    ) column to display table of the \"List all books\" use case in books.html. A\
    \ book without a special category will have an empty table cell, while for all\
    \ other books their category will be shown in this cell. This requires a corresponding\
    \ switch statement in v.books.retrieveAndListAll.setupInterface in books.js code\
    \ file.\n    2. Adding a \"Special type\" choice widget (typically, a selection\
    \ list), and responding form fields for all segment properties, in the forms of\
    \ the \"Create book\" and \"Update book\" use cases in books.html. Segment property\
    \ form fields are only displayed when a corresponding book category has been selected.\
    \ Such an approach of rendering specific form fields only on certain conditions\
    \ is sometimes called dynamic forms.\n\n### 13.2.3 Code the Model Classes of the\
    \ Class Model\n\nThe JS class model can be directly coded for getting the code\
    \ of the model classes of our JS front-end app.\n\n#### 13.2.3.1 Summary\n\n-\
    \ 1. Code the enumeration type BookCategoryEL to be used as the range of the category\
    \ attribute with the help of the meta-class Enumeration, as explained in Chapter\
    \ 11 of Volume 1.\n- 2. Code the model class Book in the form of a JS class definition\
    \ with get and set methods as well as static check functions.\n\nThese steps are\
    \ discussed in more detail in the following sections.\n"
  mdcn: "\n\n## 13 使用原生 JS 进行子类化\n\n在本章中，我们首先将解释 JavaScript 中基于构造函数的子类化通用方法，然后根据我们运行示例——即上面所示的公共图书馆（Public\
    \ Library）应用程序的信息模型片段，展示两个案例研究。\n\n在第一个案例研究中，我们考虑了图 12.1 所示的以 `Book` 为根的单级类层次结构，这是一个不完全的刚性划分。我们使用“类层次结构合并”（Class\
    \ Hierarchy Merge）设计模式将这个简单的类层次结构重构为一个可以映射到持久化数据库映射的单一类。\n\n在第二个案例研究中，我们考虑了图 12.8\
    \ 所示的由 `Employee`（员工）、`Manager`（经理）和 `Author`（作者）角色组成的多级类层次结构。将 `Person` 划分为 `Employee`\
    \ 和 `Author` 没有任何约束，这意味着它是完全的、重叠的（非不交）且非刚性的。\n\n对于简单的“经理是员工”（Manager-is-Employee）子层次结构，我们使用层次结构结构合并设计模式；对于将“员工和作者都是人员”（Employee-and-Author-is-a-Person）类层次结构映射到一组通过外键依赖关联的三个数据库表，我们使用“连接继承”（Joined\
    \ Inheritance）方法。\n\n在两个案例研究中，我们都展示了：\n\n- 1. 如何推导出 JS 类模型以及相应的实体表模型，\n- 2. 如何以\
    \ JS 模型类的形式编写 JS 类模型，\n- 3. 如何基于模型代码编写视图（view）和控制器代码。\n\n## 13.1 基于构造函数的类的子类化\n\
    \n在 ES2015 版本之前，JavaScript 没有显式的类概念，也不直接支持子类化，它必须在某些代码模式的帮助下实现，提供两种继承机制：(1) 属性继承和\
    \ (2) 方法继承。\n\n正如我们在第一卷第 1 章中解释所过的那样，类可以通过两种替代方式定义：基于构造的和基于工厂的。这两种方法都有各自实现继承的方式。\n\
    \n我们通过以下示例总结了使用 ES2015 代码模式，在基于构造函数的单继承类层次结构中定义父类和子类：\n\n| Person |\n| --- |\n\
    | firstName : String |\n| lastName : String |\n\n| Student |\n| --- |\n| studNo\
    \ : Integer |\n\n首先，我们定义一个基类 `Person`，带有两个属性 `firstName` 和 `lastName`，通过 getters\
    \ 和 setters 定义：\n\n```javascript\nclass Person {\n  constructor ({first, last})\
