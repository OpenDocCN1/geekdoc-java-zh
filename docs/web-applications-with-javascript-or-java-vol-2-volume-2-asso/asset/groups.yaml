    ## Foreword


    This two-volume book shows how to design and implement web applications with a
    model-based approach, using the two most relevant platforms for web development:
    JavaScript and Java. Web apps are designed with the help of UML diagrams and implemented
    as:


    - 1. JavaScript front-end apps, using one of the two local storage technologies
    offered by browsers;

    - 2. Java back-end apps, using Java Server Faces (JSF) for object-to-storage mapping,
    and MySQL/MariaDB database management system.


    The focus of the book is general concepts and techniques concerning the fundamental
    management issues of integrity constraints and data validation, enumerations and
    unidirectional associations between object types, and subtyping in class hierarchies.


    In addition, we assume the reader is already familiar with HTML and JavaScript,
    and is interested to learn more about programming with JavaScript or Java. The
    book can be used


    - 1. in web development courses for students of Computer Science or related disciplines;

    - 2. by JavaScript developers for learning Java;

    - 3. by Java developers for learning JavaScript;

    - 4. by JavaScript and Java (and PHP/C#) developers for learning object-oriented
    (OO) programming with JavaScript or Java, how to implement basic information management
    concepts and build complete apps with plain JavaScript or Java. The book comes
    with the complete source code of six example apps that you can run or download


