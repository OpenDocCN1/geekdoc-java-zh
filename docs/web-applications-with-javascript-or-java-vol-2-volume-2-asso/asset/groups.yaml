    \ DBMS PostgreSQL 中。因此，为了设计可以使用各种 SQL DBMS 框架（包括 MySQL 和 SQLite 等较弱的技术）实现的模型，我们无法使用\
    \ SQL99 的子类型化功能，而必须在数据库设计模型中通过普通表和外键依赖来建模继承层次结构。这种从类层次结构到关系型表（以及反之）的映射是对象关系映射（ORM）框架的工作，例如\
