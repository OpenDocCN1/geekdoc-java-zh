  - "[PAGE 121]\n\n# 106 9 Implementing Bidirectional Associations with Java EE\n\n\
    For instance, for the multi-valued reference property Book::authors that is coupled\
    \ to the derived inverse reference property Author::authoredBooks for implementing\
    \ the bidirectional association between Book and Author, the addAuthor method\
    \ is coded in the following way:\n\n```\npublic class Book {\n  ..\n  public void\
