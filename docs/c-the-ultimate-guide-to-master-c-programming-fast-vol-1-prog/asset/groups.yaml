    # 引言


    许多 C++ 的应用涉及复杂的软件组件，包括图形和科学计算。这并不是说 Java 或其他语言缺乏处理这些问题的能力。C++ 在这些领域拥有其祖先 C 语言的历史。最好的理解方式是
    C++ 增加了一些面向对象的原则（OOP），使其更加现代化。


    更具体地说，C++ 拥有与 C 极其相同的语法，但共享了 Java 使用的一些 OOP 概念，包括类、封装、继承等许多其他概念。核心在于 C++ 为新手和老手提供了一个易于理解的平台。本指南并不打算让你陷入术语的海洋。一旦你学会了任何编程语言，接下来的学习将变得更容易，只要它们属于同一个家族。选择编程语言的最佳方法可能是编写像
    QBASIC 这样的语句，或者像 Ook 一样编程。在这种情况下，我们需要一种既能轻松介绍编程初始方面，又对高级主题足够灵活的语言。


    现在我们开始设置编程环境的初步目标。这将包括一个编辑器、一个编译器和一个目录结构。编辑器是你实际编写代码的地方。编译器将把你的代码转换为在你的计算机上运行的可执行程序。目录结构的唯一目的是减少你在编码时文件保存位置的混乱。我们开始吗？


    # 第一章：安装 Cygwin：类 Linux 开发环境


    第一步是获取编译器。原因是这将对程序的编译过程施加某些限制。例如，有一些特定的编译器宏，如 `gcc` 编译器将添加一些你不需要添加的额外指令。除了编译器概念外，使用不同编译器的其他问题也会导致你在查找代码问题时产生不必要的混乱。使用
    Cygwin 包的另一个优点是它遵循与 Linux 编译器类似的格式。我们将从 Cygwin 包使用的特定编译器是 `g++` 编译器，它有一些特性，但它将帮助你熟悉像其他集成开发环境（IDE）那样的获取可执行代码的方法。


    关于编译器已经有了大量的研究。这些概念应用于形式语言、自动化和其他高级主题。如果你对编译器的内部工作原理感兴趣，网上有大量的资源，以及对最流行的编译器的易懂的解释。


    [点击此链接获取 Cygwin。]


    一旦安装完成，还有其他你可以做的事情。Linux 操作系统使用 bash 脚本语言而 Windows 使用 batch。bash 和 batch 之间的差异有很多，但它们共享一些通用功能。提到这一点，Cygwin
    实际上添加了 bash 的一些命令，但 Windows 让其变得稍微复杂了一些。**pwd** 命令稍后很有用，因为它将打印命令提示符或终端正在作为执行场所的工作目录。


    # 第二章：安装 Notepad++：从文本到代码


    我们需要下载的下一个是代码编辑器。代码编辑器和简单文本编辑器之间的区别主要在于前者提供了一些实用的语法高亮等功能。


    语言的语法涵盖关键字、语法结构、空白解析以及其他部分。编码中语法的目的与普通到语言中的语法非常相似。它提供了一种约定的语句形式。


    语言的关键字是编程中特有的特殊单词。这些包括循环结构，如 `for`、`while` 和 `do-while`；数据类型也包括 `float`、`double`、`string`
    等。


    编码中重要的语法结构主要是分隔符的放置。更具体地说，语言要求我们如何构建函数、调用什么作为入口函数，以及语句是否需要终止符。后者的一个例子是在 C++ 和其他语言中使用分号作为句号。


    最后提到的是一种名为 Python 的语言。它使用制表符（tabs）作为下一行是否属于函数、循环或类块的指示器。它与 C++ 的风格可能不同，在我们掌握了需要涵盖的基本编程思想之后，可能值得一看。


    [点击此链接获取 Notepad++]。


    最好的部分是，这个代码编辑器不仅能高亮 C++，还能高亮许多其他语言。Linux 也使用一种名为 gedit 的混合文本和代码编辑器，这是 Notepad++
    的另一个酷点。有趣的是，我们基本上只是在尝试让 Windows 更像 Linux 以便我们编程，对吧？


    # 第三章：设置工作空间：文件结构是关键


    最后的设置步骤在这里。这一步某些人认为是可选的；然而，考虑一下这个快速的场景。假设有一个非常大的项目被指派你协助开发。你和其他程序员待在一起。每个人都有自己的做事方式，这在早期就可能导致一些问题。其中一人请求你对某个软件文件夹提供一些帮助。这里有一个接口，那里有一个实现，以及他那部分的一些工具。他试图快速解释，但当你试图进入这里的文件夹另一个文件夹时，你已经迷失了。看到问题了吗？


    现在。这个简单的例子似乎违背了需要严格目录结构的目的，但在最后一章中，你将向程序添加一些代码片段，以验证这种结构的必要性。


    '
