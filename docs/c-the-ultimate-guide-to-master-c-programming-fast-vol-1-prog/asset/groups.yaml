    # Conclusion


    We''ve successfully made a running program. Not only that, but we''ve even made
    a good dent into some introductory concepts inside of++ which will also help you
    jumpstart your programming knowledge. The best part of learning about coding is
    that any point of entry will help to increase your momentum into the field as
    a whole.


    Before getting a motivational twinge, let''s step back and realize that we didn''t
    even get into virtual functions, friend classes, and so many other cool concepts.
    Coding is definitely my own personal hobby. The funny thing is that I''m also
    trying to make a career of it as well. The best way I can explain it is that just
    banging out some programs is a nice thing to do for a hobby, but when it comes
    to making a career out of it, it''s entirely different animal. The amount of information
    available is only expanding, so people in the software industry are having to
    learn constantly.


    As for the solution to the statement mentioned earlier, on the next page should
    it up as a whole. Of course, there are plenty of other methods, such as using
    a switch statement or a ternary operator, that could''ve just as easily been implemented.
    Again, it''s all subjective. Interpretation is a big thing of how to write software,
    though the compiler will tell what''s right from wrong.


    Again, some important factors to notice are the fact that the result variable
    was used to check the result. If we wanted to use the direct return method, then
    conditional checking becomes a little less the fun and not a bit more difficult.
    Programming is always a malleable piece of equipment.'
