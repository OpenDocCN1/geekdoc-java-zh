  mdcn: "\n编译成功后立即运行程序。被绿色圈出的部分是实际输出。\n\n![](img/35438157c964cd6add78d50335bfad5f_20_0.png)\n\
    \n编译器能够理解我们何时需要去另一个文件来获取某些函数定义，这样一来我们只需要向编译器传递那一个文件名即可。既然我们已经确认了程序运行运行（获得了绿灯），让我们继续，并顺便多加一点内容。\n\
    \n# 第 6 章：复杂化：变量与函数\n\n接下来的几个概念被作为一组奖励课程包含进来，以便学习。本质上，接下来的几个重要步骤是使用变量和调用一些函数。这些都是开始编程时的基础内容。\n\
    \n让我们花点时间谈谈变量命名。如果你有变量，目前我们可以把它们都放在 `main` 函数内部。目前代码一个明显的问题是字符串“Hello World”和“Program\
    \ Output”重复得相当频繁。让我们把这两个字符串放在一些较小的可重用变量中。我们将它们命名为 `hello` 和 `prog_out`。\n\n让我花点时间谈谈变量命名。如果你有三个代表三维坐标系的变量，它们可以是\
    \ `x`、`y` 和 `z`，这在情况下可能是没问题的；然而，在图形引擎中可能涉及多个系统，模型、相机和坐标系都需要它们各自的变量版本。这里的问题是，你将如何命名每一组变量。一种方法是用每个所需系统的首字母对其进行标记，例如\
    \ `x_m` 表示模型的 x 坐标。这样做的问题的问题是，如果你在长时间没有处理这段代码后回来，你可能会忘记“m”代表什么，因为它可以代表模型（model）也可能代表主视图（main\
    \ view）。命名这种变量的最好（有时也是最长）的方法是直接在后面加上完整的单词，如 `x_model`。这样读起来会非常方便。\n\n现在我们已经过了关于命名的部分，可以把变量应用到我们当前的代码中了。下面的图片在某种程度上总结了这些，但如果你需要文字说明，我稍后也会进行解释。\n\
    \n```\n#include <stdio.h>\n#include <iostream>\n#include <string>\n\nusing namespace\
    \ std;\n\nint main() {\n    string hello = \"Hello, World!\";\n    string prog_out\
    \ = \"Program Output\";\n\n    printf(\"Begin %s:\\n\\n\", prog_out);\n\n    printf(\"\
    %s\\n\", hello);\n    cout << hello << \" from a stream!\" << endl;\n\n    printf(\"\
    End %s\\n\", prog_out);\n}\n```\n\n首先容易注意到的是顶部的 `include` 语句。这把字符串数据类型引入到我们的程序中，以便在函数中使用。接下来是函数定义之外的\
    \ `using namespace` 部分。这类似于使用变量名来编写更短的代码，因为现在我声明正在使用 `std` 命名空间，所有与它相关的变量都自动引入到了我们的程序中。\n\
    \n函数中接下来的两行是新的，是实际的变量声明。string 是一个特殊情况，它们本质上只是理解 `char*` 数据类型的一种更简单的方法，它本质上表示该变量指向一个字符。\n\
    \n指针是 C/C++ 中一个非常关键的概念，实际上在我们当前的代码中已经出现了。出现在函数调用中的变量前的 `&` 符号基本上告诉函数不要使用变量本身，而是使用该变量所引的值。接下来的图片应该消除大多数初学者在最初难以理解的某些困惑。\n\
    \n![](img/35438157c964cd6add78d50335bfad5f_22_0.png)\n\n核心点在于，如果你有一个指向任何特定数据类型的变量，你可以使用前面的星号\
    \ `*` 将指针转换为值，或者使用前面的取地址符 `&` 获取变量的地址并将其传递给其他函数等。这只是对指针非常简化的介绍，供你参考。\n\n现在，回到代码。我们在函数中提到的变量前面应该有取地址符，因为它们需要的是字符串的指针而不是值。这使得函数能够传递正确的字符串并打印出与上次相同的输出。\n\
    \n我们要向当前程序中添加的下一个内容是编写多个函数的想法。这对于我们的简单示例来说可能不是必要的，让我们添加一些计算来展示函数的威力。想法是将两个数字相加并返回它们的和。作为一个挑战，请尝试添加一个\
    \ `if` 语句来检查值是否为负，如果是，则返回零。解决方案将在结论中。\n\n至于我们要添加的函数，让我们取程序的中间部分并将其替换为想要添加的函数。为了简单起见，我们将其命名为\
    \ `calc_sum`。\n\n下面的图片显示了如何添加它。其核心思想是，当我们添加新功能时，想要尽可能保留旧程序的内容。我们只需说程序员喜欢节省时间。不同之处在于该函数是否负责将其输出打印到屏幕上。这也会影响它的返回值，是\
    \ `void` 还是 `int`。截图之后提供了代码的简要说明。\n\n![](img/35438157c964cd6add78d50335bfad5f_23_0.png)\n\
