  md: '# Chapter 2: Installing Notepad++: Going from Text to Code


    The next thing we''ll need to download is the code editor. The difference between
    a code editor and a simple text editor is primarily apparent in the fact that
    the former will provide some helpful syntax highlighting, among other features.


    Syntax of a language encompasses the keywords, grammatical structure, and whitespace
    parsing pas as well as other pieces. The purpose of syntax in coding is fairly
    identical to syntax applied to language in general. It provides an agreed upon
    structure of the form of a statement.


    The keywords of a language are special words which are unique to programming.
    These include loop structures such as for, while, and do-while; data types are
    also included as float, double, string, and so on.


    The grammatical structure important in coding is primarily the placement of separators.
    More specifically, the way that a language would want us to form functions, what
    to call the entry function, and whether or not a statement requires a terminator.
    An example of the latter is using semicolon as a period in C++ and other languages.


    The last mention was for a language called Python. It uses tabs as an indicator
    for whether or not the next line is part of a function, loop, or class block.
    It''s got a likely different flavor than C++ and might be worth a look into after
    wrapping our heads around the basic programming ideas we need to cover.


    [Click this link to grab Notepad++.](.)


    The best part is that this code editor will highlight not just C++, but plenty
    of other languages as well. Linux also uses a hybrid text and code editor called
    gedit, which is another cool point about Notepad++. Funny that we''re basically
    just trying to make Windows more like Linux so we can program, eh?'
