  md: '# Chapter 1: Installing Cygwin: Linux-Like Development


    The first step is to get the compiler. The reason is that this will force some
    constraints on how your program will run after the compiler process it. An example
    of this is that there are some compiler specific macros, such as __sync_synchronize
    from the gcc compiler that will add some extra instructions that you don''t have
    to add yourself.


    Compiler concepts aside, there are some other issues with using different compilers
    with the same program. Compiler warnings will also cause some unneeded confusion
    whenever you''re trying to find problems with your code. The selection of a compiler
    can also be limited because of consensus over one particular compiler causing
    a stagnation of further research.


    Another perk to use the Cygwin package is that it follows a similar format to
    the default Linux compiler. The specific compiler we''ll be using from the Cygwin
    package is the g++ compiler which will have a few quirks about it, but it''ll
    help to get intimate with the code enough that we don''t just hit a magic button
    to get executable code, like some other integrated development environments (IDE).


    There''s plenty of research being done about compilers in general. Concepts that
    are applied inside formal languages, automata, and other more advanced topics.
    If you have further interest as to how compilers work under the hood, there are
    plenty of resources available online as well as some easy to understand explanations
    of the most popular compilers.


    [Click this link to grab Cygwin.]


    Once that''s installed, there are few other things that you can do. The Linux
    operating system uses the bash different scripting language whereas Windows uses
    batch. The difference between bash and batch are fairly numerous, but both share
    some general functionality. Mentioning this, Cygwin actually adds in some of the
    commands that bash has, but Windows makes a little more complex.'
