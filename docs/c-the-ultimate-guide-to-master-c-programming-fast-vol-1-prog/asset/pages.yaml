  md: '# Chapter 6: Getting complex: Variables and Functions


    The next few concepts are included as a bit of a set of bonus lessons in order
    to facilitate learning. Essentially, the next few important steps are using variables
    and call some functions. These are staple items when starting out programming.


    Let''s tackle a second to talk about variable naming. If you have variables which
    we can keep everything inside of main for now. A noticeable problem with the code
    currently is that the strings “Hello World” and “Program Output” repeat fairly
    often. Let''s put these two strings inside of some smaller reusable variables.
    Let''s call them hello and prog_out.


    Let me take a second to talk about variable naming. If you have three variables
    which stand for a three-dimensional coordinate system they could be x, y, and
    z which might be fine in this case; however, could be multiple systems involved
    in a graphics engine with the model, camera, and coordinate systems requiring
    their versions of each variable. The question here is how you would name each
    set of variables. One way is to tag it with the first letter of each system that
    needs to be made like x_m for the model''s x-coordinate. The problem with that
    is if you came back after a long time of not dealing with the code, then you may
    forget what the “m” means, since it could be model or main view. The best , sometimes
    longest, method to name a variable this is to just put the ever word afterwards
    like x_model. This would make for some easy reading then.


    Now that we''ve gotten through the bit about naming, we can put variables to work
    for our current code. The picture below will somewhat sum things up, but in case
    you need it in words I explain it afterwards as well.'
