  \ Doug Lea, Simon Ritter, Yoshiki Shibata 和 Christian Uboom。\n\n我使用 HTML 和 CSS 编写了本书，并使用\
  \ Prince (`https://princexml.com`) 将其转换为 PDF——我非常推荐这种工作流。\n\n*Cay Horstmann*\n\n\
  *德国杜塞尔多夫*\n\n*2024 年 8 月*\n\n# 第一章：基础编程结构\n\n在本章中，你将学习 Java 语言的基本数据类型和控制结构。假设你是其他某种语言的经验丰富的程序员，并且熟悉变量、循环、函数调用和数组等概念，但语法可能不同。本章将帮助你上手\
  \ Java 风格。\n\n本章的关键点是：\n\n1.  在 Java 中，所有方法都声明在类中。你通过方法所属的类的对象来调用非静态方法。\n\n2.  静态方法不通过对象调用。程序执行从静态\
  \ `main` 方法开始。\n\n\n\n\n\n3. Java 有八种基本类型：四种符号整型类型、两种浮点类型、`char` 和 `boolean`。\n\n\
  4. Java 的运算符和控制结构与 C 或 JavaScript 非常相似。\n\n5. `switch` 有四种形式：带有和不带穿透（fall-through）的\
  \ `switch`表达式和语句。\n\n6. `Math` 类提供了常用的数学函数。\n\n7. `String` 对象是字符序列，或者更准确地说，是 `UTF-16`\
  \ 编码中的 Unicode 代码点。\n\n8. 使用“文本块”（text box）语法来声明多行字符串字面量。\n\n9. 通过 `System.out`\
  \ 对象，你可以在终端窗口中输出。绑定到 `System.in` 的 `Scanner` 可以让你读取终端输入。\n\n10. 数组和集合可以收集相同类型的元素。\n\
  \n## 1.1 我们的第一个程序\n\n在学习任何新编程语言时，传统做法是从一个显示“Hello, World!”消息的程序开始。这就是我们在接下来的章节中要做的。\n\
  \n### 1.1.1 剖析“Hello, World”程序\n\n话说直接，这里是 Java 的“Hello, World”程序：\n\n```\npackage\
  \ ch01.sec01;\n\n// 我们的第一个 Java 程序\n\npublic class HelloWorld {\n    public static\
  \ void main(String[] args) {\n        System.out.println(\"Hello, World!\");\n \
  \   }\n}\n```\n\n让我们检查这个程序：\n\n* Java 是一种面向对象的语言。在你的程序中，你通过让对象执行工作来（主要）操作对象。你操作的每个对象都属于特定的\
  \ `class`（类），我们称该对象是该类的 `instance`（实例）。`class` 定义了对象的状态是什么以及它可以做什么。在 Java 中，所有代码都定义在类内部。我们将在\
  \ 2 中详细介绍对象和类。这个程序由单个类 `HelloWorld` 组成。\n\n* `main` 是一个方法，即在类内部定义的函数。`main` 方法是程序运行时第一个调用的方法。它被声明为\
  \ `static`，表示该方法不作用于任何对象。（当 `main` 被调用时，只有少数预定义的对象，且其中没有一个是 `HelloWorld` 类的实例。）该方法被声明为\
  \ `void`，表示它不返回任何值。参见 Section 1.8.8 关于参数声明 `String[] args` 的含义。\n\n* 在 Java 中，你可以将许多特性声明为\
  \ `public` 或 `private`，还有其他可见性级别。在这里，我们将 `HelloWorld` 类和 `main` 方法声明为 `public`，这是类和方法最常见的安排。\n\
  \n* 包（package）是一组相关的类。将每个类放在一个包中是一个好主意，这样你就可以将相关的类组合，并避免多个类具有相同名称时发生冲突。在本书中，我们将章节号和节号作为包名。我们的类的全名是\
  \ `ch01.sec01.HelloWorld`。2 对包和包命名规范有更多介绍。\n\n* 以 `//` 开头的行是注释。`//` 到行尾之间的字符都会被编译器忽略，它们仅供人类读者阅读。\n\
  \n* 最后，我们来到 `main` 方法的主体。在我们的示例中，它由单行命令组成，用于向 `System.out` 打印消息，`System.out` 是代表\
  \ Java 程序“标准输出”的对象。\n\n正如你所看到的，Java 并不是一种可以快速编写几条命令的脚本语言。它的明确目标是作为一种受益于组织成类、包和模块的大程序的语言。（模块在\
  \ 12 中引入。）\n\nJava 也非常简单且统一。某些语言拥有全局变量和函数，以及类内部的变量和方法。在 Java 中，一切都声明在类内部。这种统一性可能会导致代码有些冗长，但它使得程序的含义容易理解。\n\
  \n你刚刚看到了一个延伸到行尾的 `//` 注释。你也可以在 `/*` 和 `*/` 分隔符之间使用多行注释，例如：\n\n```\n/*\n    这是《给急躁读者的\
  \ Core Java》中的第一个示例程序。\n    该程序显示传统的问候 \"Hello, World!\".\n*/\n```\n\n还有第三种注释样式，称为文档注释，使用\
  \ `/**` 和 `*/` 作为分隔符，你将在下一章看到它。\n\n### 1.1.2 编译和运行 Java 程序\n\n要编译并运行此程序，你需要安装 Java\
  \ 开发工具包（JDK），以及可选的集成开发环境（IDE）。你还应该下载示例代码，你可以在本书的配套网站 http://horstmann.com/javaimpatient\
  \ 找到它们。由于安装软件的说明并不没有意思，我把它们也放在了配套网站上。\n\n一旦安装了 JDK，打开终端窗口，切换到包含 `ch01` 目录的目录，并运行命令：\n\
  \n```\njavac ch01/sec01/HelloWorld.java\njava ch01.sec01.HelloWorld\n```\n\n熟悉的问候将出现在终端窗口中（请参见\
  \ Figure 1.1）。\n\n注意，执行该程序涉及两个步骤。`javac` 将 Java 源代码编译成中间的、机器无关的表示，称为 `byte codes`（字节码），并将其保存为\
  \ `class` 文件。`java` 虚拟机启动器加载 `class` 文件并执行 `byte codes`，无论是在你的桌面电脑上还是在遥远星系的设备上。\n\
  \n如果你的程序只包含一个源文件，你可以跳过编译步骤，并使用命令运行它：\n\n```\njava ch01/sec01/HelloWorld.java\n```\n\
  \n在 Unix 类的操作系统上，你可以通过以下步骤将 Java 文件转换为可执行程序：\n\n1. 重命名文件使其不包含 `.java` 后缀：\n\n  \
  \ ```\n   mv HelloWorld.java hello\n   ```\n\n2. 给文件可执行权限：\n\n   ```\n   chmod +x\
  \ hello\n   ```\n\n3. 在文件顶部添加一条“shebang”行：\n\n   ```\n   #!/path/to/jdk/bin/java\
  \ --source 21\n   ```\n\n现在你可以像这样运行程序了：\n\n```\n./hello\n```\n\n由于这些功能仍处于预览阶段，我不会在此版本中使用它们，但在未来，第一个示例程序将会更加简单。\n\
  \n\n\n\n\n在 IDE 中运行 `HelloWorld` 程序，你首先需要创建一个项目，这正如安装说明中所述。然后，选择 `HelloWorld` 类并告诉\
  \ IDE 运行它。图 1.2 显示了这在 Eclipse 中对应的界面。Eclipse 是一个流行的开源 IDE，但也有许多出色的选择。随着你对 Java 编程越来越熟练，你应该尝试几个并挑选一个你喜欢的。\n\
  \n![](img/hello-eclipse.jpg)图 1.2：在 Eclipse IDE 中运行 Java 程序\n\n恭喜你！你刚刚遵循了在 Java\
  \ 中运行“Hello, World!”程序这一久久传统的仪式。现在，我们准备好检查 Java 语言的基础知识了。\n\n在 http://horstmann.com/javaimpatient，你可以下载本书所有章节的示例代码，这些代码在上下文中展示了书代码片段。代码的组织方式让你能够包含所有示例程序的单一项目。我鼓励你在学习书籍内容的同时，下载、运行并学习这些代码。\n\
  \n### 1.1.3 对象实例与方法调用\n\n让我们仔细观察一下 `main` 方法中的单条语句：\n\n```\nSystem.out.println(\"\
  Hello, World!\");\n```\n\n`System.out` 是一个对象。它是名为 `PrintStream` 的类的 `instance`（实例）。`PrintStream`\
  \ 类拥有 `println`、`print` 等方法。这些方法被称为 `instance methods`（实例方法），因为它们是在类的对象（或实例）上进行操作的。\n\
  \n要在对象上调用实例方法，你使用 `dot notation`（点符号表示）：\n\n```\nobject.methodName(arguments)\n\
  ```\n\n在这种情况下，只有一个参数，即字符串 `\"Hello, World!\"`。\n\n让我们用另一个例子试试。像 `\"Hello, World!\"\
  ` 这样的字符串是 `String` 类的实例。`String` 类有一个方法 `length`，用于返回 `String` 对象的长度。要调用该方法，再次使用点符号表示：\n\
  \n```\n\"Hello, World!\".length()\n```\n\n`length` 方法是在对象 `\"Hello, World!\"` 上被调用的，并且它没有参数。与\
  \ `println` 方法不同，`length` 方法返回一个结果。使用该结果的一种方法是打印它：\n\n```\nSystem.out.println(\"\
  Hello, World!\".length());\n```\n\n试一试。编写带有这条语句的 Java 程序并运行它，看看字符串有多长。\n\n在 Java\
  \ 中，你需要 `construct`（构造）大多数对象（与 `System.out` 和 `\"Hello, World!\"` 对象不同，它们已经存在并供你使用）。这是一个简单的示例。\n\
  \n`Random` 类的对象可以生成随机数。你使用 `new` 运算符构造一个 `Random` 对象：\n\n```\nnew Random()\n```\n\
  \n类名之后是构造参数列表，在这个例子中它是空的。\n\n你可以对构造出的对象调用方法。该调用\n\n```\nnew Random().nextInt()\n\
  ```\n\n产生新构造的随机数生成器所提供的下一个整数。\n\n你刚刚看到了 `new` 运算符是如何构造对象实例的。`Factory methods`（工厂方法）提供了产生对象的另一种替代方式。例如，在这里我们通过工厂方法产生另一个随机数生成器：\n\
  \n```\nRandomGenerator generator = RandomGenerator.getDefault();\n```\n\n在现代 Java\
  \ 中，这是获取随机数生成器的优方法。工厂方法产生的生成器比旧的 `Random` 类具有更好的特性。\n\n在这个示例中，对象存储在变量中（参见第 1.3 节），以便可以被多次访问。在这里我们打印了两个随机数：\n\
  \n```\nSystem.out.println(generator.nextInt());\nSystem.out.println(generator.nextInt());\n\
  ```\n\n`RandomGenerator` 类型声明在 `java.util.random` 包中。要在你的程序中使用它，请添加 `import` 语句，如下所示：\n\
  \n```\npackage ch01.sec01;\n\nimport java.util.random.RandomGenerator;\n\npublic\
  \ class MethodDemo {\n    ...\n}\n```\n\n我们将在第 2 章中详细查看包和 `import` 语句。\n\n### 1.1.4\
  \ JShell\n\n在第 1.1.2 节中，你看到了如何编译和运行 Java 程序。JShell 程序提供了一个“读取-求值-打印循环”（REPL），允许你在不编译和运行程序的情况下尝试\
  \ Java 代码。当你输入一个 Java 表达式时，JShell 会求值你的输入，打印结果并等待你的下一次输入。要启动 JShell，只需在终端窗口中输入 `jshell`（图\
  \ 1.3）。\n\n![](img/jshell.jpg)图 1.3：运行 JShell\n\nJShell 启动时带有欢迎语，随后是提示符：\n\n```\n\
  |  Welcome to JShell -- Version 21\n|  For an introduction type: /help intro\n\n\
  jshell>\n```\n\n现在输入任何 Java 表达式，例如\n\n```\n\"Hello, World!\".length()\n```\n\nJShell\
  \ 响应结果和另一个提示符。\n\n```\n$1 ==> 13\n\njshell>\n```\n\n注意，你*不需要*输入 `System.out.println`。JShell\
  \ 会自动打印你输入的每个表达式的值。\n\n输出中的 `$1` 表示该结果可以用于进一步计算。例如，如果你输入\n\n```\n3 * $1 + 3\n```\n\
  \n响应是\n\n```\n$2 ==> 42\n```\n\n如果你需要多次使用一个变量，可以给它一个更易记忆的名字。你必须遵循 Java 语法并同时指定类型和名称（参见第\
  \ 1.3 节）。例如，\n\n```\njshell> int answer = 42\nanswer ==> 42\n```\n\n你可以让 JShell\
  \ 为你自动填充类型。输入一个表达式，不要按 Enter 键，而是按 Shift+Tab 然后按 V 键。例如，当你输入\n\n```\nnew Random()\n\
  ```\n\n接着按 Shift+Tab 和 V 键，你得到\n\n```\njshell> Random  = new Random()\n```\n\n光标恰好位于\
  \ `=` 符号之前。现在输入一个变量名并按回车：\n\n```\njshell> Random generator = new Random()\ngenerator\
  \ ==> java.util.Random@3fee9989\n```\n\n另一个实用的功能是 Tab 补全。输入\n\n```\ngenerator.\n\
  ```\n\n然后按 Tab 键。你会得到 `generator` 变量上可以调用的方法列表：\n\n```\njshell> generator.\ndoubles(\
  \            equals(             getClass()\nhashCode()          ints(         \
  \      isDeprecated()      \nlongs(              nextBoolean()       nextBytes(\
  \          \nnextDouble()         notifyAll()\n```\n\n现在输入 `ne` 并再次按 Tab。方法名被补全为\
  \ `next`，你会得到一个更短的列表：\n\n```\njshell> generator.next\nnextBoolean()       nextBytes(\
  \          \nnextDouble()         \nnextExponential()   nextFloat(          \nnextInt()\
  \            nextLong(         \n```\n\n输入 D 并再次按 Tab，现在填充了 `nextDouble(`。再次按 Tab，你会看到三种选择：\n\
  \n```\nSignatures:\ndouble java.util.random.RandomGenerator.nextDouble(double bound)\n\
  double java.util.random.RandomGenerator.nextDouble(double origin, double bound)\n\
  double Random.nextDouble()\n\n<press tab again to see documentation>\n```\n\n输入\
  \ ) 来选择第三种版本：\n\n```\njshell> generator.nextDouble()\n$3 ==> 0.95608\n```\n\n在自动补全列表中，可能需要参数的方法只跟着一个左括号，例如\
  \ `nextDouble(`，而没有参数的方法带有双括号，例如 `nextBoolean()`。\n\n要重复命令，按 ↑ 键直到看到想要重新发布或编辑的行。你可以使用\
  \ ← 和 → 键移动行内光标并添加或删除字符。完成后按 Enter。例如，按 ↑ 将 `Double` 替换为 `Int`，然后按 Enter：\n\n```\n\
  jshell> generator.nextInt()\n$4 ==> -352355569\n```\n\n默认情况下，JShell 导入以下包：\n\n```\n\
  java.io\njava.math\njava.net\njava.nio.file\njava.util\njava.util.concurrent\njava.util.function\n\
  java.util.prefs\njava.util.regex\njava.util.stream\n```\n\n\n\n\n这就是为什么你可以在 JShell\
  \ 中直接使用 `Random` 类而无需任何 import 导入语句。如果你需要导入另一个类，可以在 JShell 提示符下输入 import 语句。或者更方便地，你可以通过按\
  \ Shift+Tab 和 `I` 键让 JShell 为你搜索它。例如，输入 `Duration`，然后按 Shift+Tab 和 `I` 键。你会得到一个可能操作的列表：\n\
  \n```\njshell> Duration\n0: Do nothing\n1: import: java.time.Duration\n2: import:\
  \ javafx.util.Duration\n3: import: javax.xml.datatype.Duration\nChoice:\n```\n\n\
  输入 `1`，你将收到确认：\n\n```\nImported: java.time.Duration\n```\n\n随后会出现：\n\n```\njshell>\
  \ Duration\n```\n\n这样你就可以从上次停止的地方继续，而且已经完成了导入。\n\n这些命令足够你开始使用 JShell 了。如需帮助，输入 `/help`\
  \ 并按回车。如需退出，输入 `/exit` 并按回车，或直接按 Ctrl+D。\n\nJShell 让你能够轻松有趣地学习 Java 语言和库，而无需启动沉重的开发环境，也不必费心处理\
  \ `public static void main`。\n\n## 1.2. 基本数据类型\n\n尽管 Java 是一种面向对象的编程语言，但并不是所有的 Java\
  \ 值都是对象。相反，某些值属于`基本类型`（primitive types）。其中四种类型是有符号整数类型，两种是浮点数类型，一种用于字符串编码的字符类型 `char`，以及一种用于布尔值的\
  \ `boolean` 类型。我们将在接下来的章节中介绍这些类型。\n\n### 1.2.1. 有符号整数类型\n\n有符号整数类型用于不带小数部分的数字。允许负值。Java\
  \ 提供了表 1.1](#index.xhtml_integer-types）所示的四种有符号整数类型。\n\n表 1.1：Java 有符号整数\n\n| 类型\
  \ | 存储要求 | 范围（包含边界） |\n| --- | --- | --- |\n| `byte` | 1 字节 | –128 到 127 |\n| `short`\
  \ | 2 字节 | –32,768 到 32,767 |\n| `int` | 4 字节 | –2,147,483,648 到 2,147,483,647（略超过\
  \ 20 亿） |\n| `long` | 8 字节 | –9,223,372,036,854,775,808 到 9,223,372,036,854,775,807\
  \ |\n\n常量 `Integer.MIN_VALUE` 和 `Integer.MAX_VALUE` 是最小和最大的 `int` 值。`Long`、`Short`\
  \ 和 `Byte` 类也拥有 `MIN_VALUE` 和 `MAX_VALUE` 常量。\n\n在大多数情况下，`int` 类型是最实用的。如果你想表示地球上的人口，将需要求助于\
  \ `long`。`byte` 和 `short` 类型主要用于特殊应用程序，例如低级文件处理，或者在存储空间紧张时用于大型数组。\n\n如果 `long` 类型不够用，请使用\
  \ `BigInteger` 类。详情请参阅章节 1.4.6。\n\n在 Java 中，整数类型的范围不取决于你运行程序的机器。毕竟，Java 被设计为一种“编写一次，处运行”的语言。相比之下，C\
  \ 和 C++ 程序中的整数类型取决于编译程序时的处理器。\n\n你书写 `long` 整数字面量时要带有后缀 `L`（例如，`4000000000L`）。`byte`\
  \ 或 `short` 类型字面量没有对应的语法。请使用强制转换表示法（参见章节 1.4.4），例如，`(byte) 127`。\n\n十六进制字面量有前缀 `0x`（例如，`0xCAFEBABE`）。二进制值有前缀\
  \ `0b`。例如，`0b1001` 是 `9`。\n\n八进制数有前缀 `0`。例如，`011` 是 `9`。这可能会引起混惑，因此最好避开八进制字面量和前导零。\n\
  \n你可以在数字字面量中添加下划线，例如 `1_000_000`（或 `0b1111_0100_0010_0100_0000`）来表示百万。下划线仅供人类视觉，Java\
  \ 编译器会简单地移除它们。\n\n如果你处理的是永远为负数的整数值，并且确实需要额外的位，你可以在小心的情况下将有符号整数值解释为无符号。例如，`byte`\
  \ 值 `b` 代表从 –128 到 127 的范围。如果你想要 0 到 255 的范围，你仍然可以存储在 `byte` 中。由于二进制运算的性质，加、减、乘法都能正常工作，只要它们不溢出。对于其他操作，调用\
  \ `Byte.toUnsignedInt(b)` 获取 0 到 255 之间的 `int` 值，然后处理该整数值，最后将结果强制转换回 `byte`。`Integer`\
  \ 和 `Long` 类具有无符号除法和取余的方法。\n\n### 1.2.2. 浮点数类型\n\n浮点数类型用于带有小数部分的数字。浮点类型见表 1.2](#index.xhtml_floating-types)。\n\
  \n表 1.2：浮点数\n\n| 类型 | 存储要求 | 范围 |\n| --- | --- | --- |\n| `float` | 4 字节 | 约±3.4E38\
  \ |\n| `double` | 8 字节 | 约±1.7976931348623157E308 |\n\n在 Java 中，整数类型的范围不取决于你运行程序的机器。毕竟，Java\
