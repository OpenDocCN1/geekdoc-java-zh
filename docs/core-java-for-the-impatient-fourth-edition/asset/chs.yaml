  15. 编译 `Network` 类。注意内部类文件名为 `Network$Member.class`。使用 `javap` 程序查看生成的代码。命令\n\n\
  ```\njavap -private Classname\n```\n\n显示方法和实例变量。在哪里看到对外部类的引用？（在 Linux/Mac OS 上，运行\
  \ `javap` 时需要在 `$` 符号前加 `\\`。）\n\n16. 完全实现 2.7.1 中的 `Invoice` 类。提供一个打印发票的方法和一个构造并打印示例发票的演示程序。\n\
  \n17. 实现一个类 `Queue`，字符串无界队列。提供方法 `add`（在尾部添加）和 `remove`（从头部移除）。使用链表存储元素。将 `Node`\
  \ 实现为嵌套类。它是静态的吗？\n\n\n\n\n\n在面向对象编程出现很久以前就已经有了函数式编程语言，例如 `Lisp`，在这些语言中，函数是主要的结构化机制。最近，函数式编程的重要性日益增加，因为它非常适合并发和事件驱动（或“响应式”）编程。`Java`\
  \ 支持函数表达式，这在面向对象编程和函数式编程之间提供了一个方便的桥梁。在本章中，你将学习接口和 lambda 表达式。\n\n本章的关键点如下：\n\n1.\
  \ `interface` 指定了实现类必须提供的 set 方法。\n2. `interface` 是任何实现它的类的超类型。因此，可以将类的实例赋值给接口类型的变量。\n\
  3. `interface` 可以包含静态方法。接口的所有变量自动为 `public`、`static` 且 `final`。\n4. `interface`\
  \ 可以包含默认方法，实现类可以继承或覆盖这些方法。\n5. `interface` 可以包含私有方法，实现类无法调用或覆盖这些方法。\n6. `Comparable`\
  \ 和 `Comparator` 接口用于比较对象。\n7. 如果需要测试对象是否符合某个子类型，请使用 `instanceof` 运算符，优先使用其“模式匹配”形式。\n\
  8. `functional interface`（函数式接口）是一个只有一个抽象方法的接口。\n9. `lambda expression`（lambda 表达式）表示可以在以后时间点执行的代码块。\n\
  10. Lambda 表达式转换为函数式接口。\n11. 方法和构造函数引用指向方法或构造函数，而不调用它们。\n12. Lambda 表达式和局部类可以访问闭包作用域中的有效\
  \ final（effectively final）变量。\n\n## 3.1. 接口\n\n`interface` 是一种阐明双方之间合同的机制：服务的提供者以及希望其对象能够用于该服务的类。在接下来的章节中，你将看到如何在\
  \ `Java` 中定义和使用接口。\n\n### 3.1.1 使用接口\n\n在 1 中，我使用了 `Random` 类来说明如何调用构造函数。当 `Random`\
  \ 类在 `Java` 1.0 中最初设计时，它反映了当时的最高水平。如今，已经知道了更多产生伪随机数的算法。`java.util.random` 包提供了具有各种权权衡的强算法实现。根据你的需求，你可能需要在\
  \ `L64X128MixRandom`、`Xoroshiro128PlusPlus` 或另一个具有类似名称的算法之间选择。（该包的 API 文档提供了关于选择哪个算法的有用建议。）有趣的是，API\
  \ 没有为每个算法暴露单独类。这是一个好事。当你从一种算法切换到另一种算法时，修改程序将很麻烦。而且这是没必要的——所有的生成器都具有相同的方法集：`nextInt`、`nextDouble`\
  \ 等。\n\n相反，这些方法属于接口 `RandomGenerator`。接口定义了支持的方法——在这里是 `nextInt`、`nextDouble` 等。一旦你有了实现此接口的类的实例，就可以调用这些方法：\n\
  \n```\nRandomGenerator generator = RandomGenerator.getDefault();\nint dieToss =\
  \ 1 + generator.nextInt(6);\ndouble randomPercentage = 100 * generator.nextDouble();\n\
  ```\n\n静态方法 `RandomGenerator.getDefault` 获取某个类的对象，调用者对该类的具体性质是未知的。已知的是该类拥有 `RandomGenerator`\
  \ 接口的所有方法。有了这些知识，你可以高效地使用该对象。\n\n### 3.1.2 声明接口\n\n在本节中，你将学习如何声明你自己的接口。让我们考虑一种可能是随机也可能不随机的序列。这些序列只产生整数，并且可能是有限的或无限的。\n\
  \n此类序列可以有许多形式。以下是一些示例：\n\n* 由用户提供的整数序列\n* 随机整数序列\n* 质数序列\n* 整数数组中的元素序列\n* 字符串中代码点的序列\n\
  * 数字中的数字序列\n\n我们想要实现一种处理所有这些类型序列的单一机制。\n\n首先，让我们阐明整数序列之间的共同点。至少，处理一个序列需要两个方法：\n\n\
  * 测试是否存在下一个元素\n* 获取下一个元素\n\n要声明一个接口，你提供方法头，如下所示：\n\n```\npublic interface IntSequence\
  \ {\n    boolean hasNext();\n    int next();\n}\n```\n\n你不需要实现这些方法，但如果你愿意，也可以可以提供默认实现——参见第\
  \ 3.2.2 节。如果没有提供实现，我们称该方法为 `abstract`（抽象）。\n\n接口的所有方法自动为 `public`。因此，没有必要将 `hasNext`\
  \ 和 `next` 声明为 `public`。某些程序员为了更清晰仍然会这样做。\n\n一旦你有了接口声明，就可以实现实用的服务。这里有一个例子，报告前 `n`\
  \ 个值的平均值：\n\n```\npublic static double average(IntSequence seq, int n) {\n    int\
  \ count = 0;\n    double sum = 0;\n    while (seq.hasNext() && count < n) {\n  \
  \      count++;\n        sum += seq.next();\n    }\n    return count == 0 ? 0 :\
  \ sum / count;\n}\n```\n\n注意，该方法不知道也不需要知道 `hasNext` 和 `next` 方法是如何执行工作的。然而，编译器必须知道这些方法存在。\n\
  \n### 3.1.3 实现接口\n\n现在让我们来看硬币的另一面：希望可以使用 `average` 方法的类。它们需要实现 `IntSequence` 接口。这里有这样一个类：\n\
  \n```\npublic class SquareSequence implements IntSequence {\n    private int i;\n\
  \n    public boolean hasNext() {\n        return true;\n    }\n\n    public int\
  \ next() {\n        i++;\n        return i * i;\n    }\n}\n```\n\n有无限多个平方数，该类的对象会一个接一个交付它们。（为了保持示例简单，我们忽略了整数溢出——参见练习\
  \ 12。）\n\n`implements` 关键字表示 `SquareSequence` 类打算符合 `IntSequence` 接口。\n\n实现类必须将接口的方法声明为\
  \ `public`。否则，它们将默认为包私有访问（package access）。由于接口要求公共访问，编译器将报告错误。\n\n这段代码获取前 100 个平方数的平均值：\n\
  \n```\nvar squares = new SquareSequence();\ndouble avg = average(squares, 100);\n\
  ```\n\n有很多类可以实现 `IntSequence` 接口。例如，这个类产生一个有限序列，即从最低有效位开始的正整数的数字：\n\n```\npublic\
  \ class DigitSequence implements IntSequence {\n    private int number;\n\n    public\
  \ DigitSequence(int n) {\n        number = n;\n    }\n\n    public boolean hasNext()\
  \ {\n        // 此方法和后续方法在接口中定义\n        return number != 0;\n    }\n\n    public\
  \ int next() {\n        int result = number % 10;\n        number /= 10;\n     \
  \   return result;\n    }\n\n    public int rest() {\n        // 此方法未在接口中定义\n  \
  \      return number;\n    }\n}\n```\n\n对象 `new DigitSequence(1729)` 在 `hasNext`\
  \ 返回 `false` 之前交付数字 `9 2 7 1`。\n\n`SquareSequence` 和 `DigitSequence` 类实现了 `IntSequence`\
  \ 接口的所有方法。如果一个类只实现了部分方法，则它必须声明为 `abstract` 修饰符。关于抽象类的更多信息，请参见 4。\n\n### 3.1.4 转换为接口类型\n\
  \n此代码片段计算数字序列值的平均值：\n\n\n\n\n\n```\nIntSequence digits = new DigitSequence(1729);\n\
  double avg = average(digits, 100);\n// 将只查看序列的前四个值\n```\n\n观察 `digits` 变量。它的类型是\
  \ `IntSequence`，而不是 `DigitSequence`。类型为 `IntSequence` 的变量引用某个实现了 `IntSequence` 接口的类的对象。你始终可以将对象赋值给类型为已实现接口的变量，或将其传递给期望此类接口的方法。\n\
  \n这里有一些实用的术语。当子类型的任何值都可以在不经过转换的情况下赋值给超类型的变量时，类型 `S` 就是类型 `T`（**子类型**，subtype）的**超类型**（supertype）。例如，`IntSequence`\
  \ 接口是 `DigitSequence` 类的超类型。\n\n虽然可以声明接口类型的变量，但你永远无法拥有一个类型为接口的对象。所有对象都是类的实例。\n\n\
  ### 3.1.5. 强制转换与 `instanceof` 运算符\n\n有时，你需要相反的转换——从超类型到子类型。这时你就要使用**强制转换**（cast）。例如，如果你恰好知道存储在\
  \ `IntSequence` 中的对象实际上是 `DigitSequence`，你可以像这样转换类型：\n\n```\nIntSequence sequence\
  \ = ...;\nDigitSequence digits = (DigitSequence) sequence;\nSystem.out.println(digits.rest());\n\
  ```\n\n在这种情况下，强制转换是必要的，因为 `rest` 是 `DigitSequence` 的方法，而不是 `IntSequence` 的。\n\n\
  请查看练习 4 获取一个更具说服力的示例。\n\n你只能将对象强制转换为其实际类或其超类型之一。如果你弄错了，将发生编译时错误或类转换异常（class cast\
  \ exception）：\n\n```\nString digitString = (String) sequence;\n// 不可能成功——IntSequence\
  \ 不是 String 的超类型\nSquareSequence squares = (SquareSequence) sequence;\n// 可能成功，如果不符合则会抛出类转换异常\n\
  ```\n\n为了避免异常，你可以先使用 `instanceof` 运算符测试对象是否为目标类型。该表达式：\n\n```\nobject instanceof\
  \ Type\n```\n\n如果 `object` 是具有 `Type` 作为超类型的类的实例，则该表达式返回 `true`。在使用强制转换之前进行此类检查是一个好主意。\n\
  \n```\nif (sequence instanceof DigitSequence) {\n    DigitSequence digits = (DigitSequence)\
  \ sequence;\n    ...\n}\n```\n\n`instanceof` 运算符是 `null`-安全的：如果 `obj` 为 `null`，则表达式\
  \ `obj instanceof Type` 为 `false`。毕竟，`null` 不可能指向任何给定类型对象的引用。\n\n### 3.1.6. `instanceof`\
  \ 的“模式匹配”形式\n\n由于“`instanceof` 和强制转换”这种惯用法非常常见，因此有一个方便的快捷方式，称为 `instanceof` 模式匹配：\n\
  \n```\nif (sequence instanceof DigitSequence digits) {\n    // 在这里，你可以使用 digits\
  \ 变量\n    ...\n}\n```\n\n在这个示例中，`digits` 变量包含了 `sequence` 引用，并强制转换为 `DigitSequence`。然而，如果\
  \ `sequence` 不是 `DigitSequence` 的实例，则不会声明变量，且不会执行 `if` 体。\n\n无用的 `instanceof` 模式是一个错误：\n\
  \n```\nDigitSequence digits = ...;\nif (digits instanceof IntSequence seq) ... //\
  \ 错误——它显然是 IntSequence\n```\n\n同样无用的\n\n```\nif (digits instanceof IntSequence)\
  \ ... \n```\n\n是允许的，以为了与 Java 1.0 的向后兼容。\n\n当 `instanceof` 模式引入变量时，你可以立即在同一个表达式中使用它：\n\
  \n```\nIntSequence sequence = ...;\nif (sequence instanceof DigitSequence digits\
  \ && digits.rest() >= 100) ...\n```\n\n这之所以有效，是因为 `&&` 表达式的右侧只有在左侧为 `true` 时才会被求值。如果评估了右侧，则\
  \ `digits` 已经绑定了一个 `DigitSequence` 实例。\n\n然而，以下是一个编译时错误：\n\n```\nif (sequence instanceof\
  \ DigitSequence digits || digits.rest() >= 100) ... // 错误\n```\n\n`||` 的右侧在左侧为 `false`\
  \ 时执行，此时没有内容绑定到变量 `digits`。\n\n这里是另一个使用条件运算符的示例：\n\n```\ndouble rest = sequence\
  \ instanceof DigitSequence digits ? digits.rest() : 0;\n```\n\n变量 `digits` 在 `?`\
  \ 之后的子表达式中定义，但在 `:` 之后的子表达式中未定义。\n\n这种声明变量的 `instanceof` 形式被称为“模式匹配”，因为它与 `switch`\
  \ 中的类型模式相似，后者是 Java 17 的一项“预览”（preview）功能。我不会详细讨论预览功能，但这里有一个语法的示例：\n\n```\nString\
  \ description = switch (sequence) {\n    case DigitSequence digits ->\n        \"\
  A digit sequence with rest \" + digits.rest();\n    case SquareSequence squares\
  \ -> \"A square sequence\";\n    default -> \"Some other sequence\";\n}\n```\n\n\
  与 `instanceof` 模式一样，每个 `case` 都声明了一个变量。\n\n### 3.1.7. 扩展接口\n\n接口可以 `extend`（扩展）另一个接口，在原始方法的基础上要求或提供额外的方法。例如，`Closeable`\
  \ 是一个带有单一方法的接口。\n\n正如你在 5 中看到的，这是一个在发生异常时关闭资源的重要接口。\n\n`Channel` 接口扩展了这个接口：\n\n\
  ```\npublic interface Channel extends Closeable {\n    boolean isOpen();\n}\n```\n\
  \n`Channel` 必须提供这两个方法。\n\n### 3.1.8. 实现多个接口\n\n一个类可以实现多个接口。例如，一个从文件读取整数的 `FileSequence`\
  \ 类除了 `IntSequence` 之外还实现了 `Closeable` 接口：\n\n```\npublic class FileSequence implements\
  \ IntSequence, Closeable {\n    ...\n}\n```\n\n然后 `FileSequence` 类拥有 `IntSequence`\
  \ 和 `Closeable` 超类型。\n\n### 3.1.9. 常量\n\n接口中定义的任何变量自动为 `public static final`。\n\n\
  例如，`SwingConstants` 接口定义了方向的常量：\n\n```\npublic interface SwingConstants {\n    int\
  \ NORTH = 1;\n    int NORTH_EAST = 2;\n    int EAST = 3;\n    ...\n}\n```\n\n你可以通过限定名\
  \ `SwingConstants.NORTH` 来引用它们。如果你的类实现了 `SwingConstants` 接口，你可以省略 `SwingConstants`\
  \ 限定符，直接写 `NORTH`。然而，这并不是常见的惯用法。对于常量集，使用枚举要更好；参见 4。\n\n接口不能拥有实例变量。接口规范的是行为，而不是对象状态。\n\
  \n## 3.2. 静态、默认与私有方法\n\n在之前的早期版本中，接口的所有方法都必须抽象的——也就是说没有方法体。现在你可以添加三种具有具体实现的方法：静态、默认和私有方法。接下来的章节将描述这些方法。\n\
  \n### 3.2.1. 静态方法\n\n技术上从未规定接口不能拥有静态方法，但它们并不符合接口作为抽象规范的观点。这种想法现在已经演变了。特别是工厂方法在接口中非常有意义。例如，`IntSequence`\
  \ 接口可以有一个静态方法 `digitsOf`，用于生成给定整数的数字序列：\n\n```\nIntSequence digits = IntSequence.digitsOf(1729);\n\
  ```\n\n该方法产生一个实现了 `IntSequence` 接口的类实例，但调用者无需关心是哪一个。\n\n```\npublic interface IntSequence\
  \ {\n    ...\n    static IntSequence digitsOf(int n) {\n        return new DigitSequence(n);\n\
  \    }\n}\n```\n\n在过去，将静态方法放在辅助类中是常见的。你在 Java API 中发现接口和工具类的成对，例如 `Collection`/`Collections`\
  \ 或 `Path`/`Paths`。这种拆分不再必要。\n\n### 3.2.2. 默认方法\n\n\n\n\n\n你可以为任何接口方法提供一个 `default`\
  \ 实现。你必须使用 `default` 修饰符来标记此类方法。\n\n```java\npublic interface IntSequence {\n  \
  \  default boolean hasNext() { return true; }\n        // 默认情况下，序列是无限的\n    int\
  \ next();\n}\n```\n\n实现此接口的类可以选择重写 `hasNext` 方法，也可以继承默认实现。\n\n默认方法终结了一种经典模式，即提供一个接口和一个伴类，该伴类实现接口的大部分或全部方法，例如\
  \ Java API 中的 `Collection`/`AbstractCollection` 或 `WindowListener`/`WindowAdapter`。现在，你只需要在接口中实现方法即可。\n\
  \n默认方法的一个重要用途是*接口演化*。以在 Java 中存在了多年的 `Collection` 接口为例。假设在很久早以前，你提供提供了一个类：\n\n```java\n\
  public class Bag implements Collection\n```\n\n在后来的 Java 8 中，接口中添加了一个 `stream` 方法。\n\
  \n假设 `stream` 方法不是默认方法。那么 `Bag` 类将无法编译，因为它没有实现新方法。在接口中添加非默认方法不是*源兼容的*。\n\n但假设你没有重新编译类，而只是使用包含该类的旧\
  \ JAR 文件。即使缺少该方法，类仍然可以加载。程序仍然可以创建 `Bag` 实例，且不会发生任何坏事。（向接口中添加方法是*二进制兼容的*。）然而，如果程序在\
  \ `Bag` 实例上调用 `stream` 方法，就会抛出 `AbstractMethodError`。\n\n将方法设为 `default` 方法解决了这两个问题。`Bag`\
  \ 类将能够再次编译。如果类在没有重新编译的情况下被加载，并在 `Bag` 实例上调用了 `stream` 方法，则会调用 `Collection.stream`\
  \ 方法。\n\n## 3.2.3 解决默认方法冲突\n\n如果一个类实现了两个接口，其中一个接口具有默认方法，另一个接口具有相同名称和参数类型的方法（默认或非默认），那么你必须解决这种冲突。这种情况并不常见，而且通常处理起来比较容易。\n\
  \n让我们来看一个例子。假设我们有一个带有 `getId` 方法的接口 `Person`：\n\n```java\npublic interface Person\
  \ {\n    String getName();\n    default int getId() { return 0; }\n}\n```\n\n假设还有一个具有相同方法的接口\
  \ `Identified`。\n\n```java\npublic interface Identified {\n    default int getId()\
  \ { return Math.abs(hashCode()); } \n}\n```\n\n你可以在 4 中看到 `hashCode` 方法的作用。目前，重要的是它返回一个源自对象的整数。\n\
  \n如果你形成一个实现这两个接口的类，会发生什么？\n\n```java\npublic class Employee implements Person, Identified\
  \ {\n    ...\n}\n```\n\n该类继承了由 `Person` 和 `Identified` 接口提供的两个 `getId` 方法。Java 编译器无法在两者之间选择。编译器会报告错误，并由你来解决这种歧义。在\
  \ `Employee` 类中提供一个 `getId` 方法，并实现你自己的 ID 方案，或者委托给冲突方法之一，如下所示：\n\n```java\npublic\
  \ class Employee implements Person, Identified {\n    public int getId() { return\
  \ Identified.super.getId(); }\n    ...\n}\n```\n\n`super` 关键字允许你调用超类型方法。在这种情况下，我们需要指定想要哪哪个超类型。这种语法看起来有点奇怪，但它与你在\
  \ 4 中看到的调用父类方法的语法是一致的。\n\n现在假设 `Identified` 接口没有为 `getId` 提供默认实现：\n\n```java\ninterface\
  \ Identified {\n    int getId();\n}\n```\n\n`Employee` 类可以继承来自 `Person` 接口的默认方法吗？乍一看，这似乎是合理的。但编译器如何知道\
  \ `Person.getId` 方法是否执行了 `Identified.getId` 预期操作呢？毕竟，它返回的是人的弗洛伊德 id 水平，而不是 ID 数字。\n\
  \nJava 的设计者选择了安全和统一。两个接口之间如何发生冲突并不重要；只要至少有一个接口提供了实现，编译器就会报告错误，并由程序员来解决这种歧义。\n\n\
  如果两个接口都没有为共享方法提供默认实现，则不存在冲突。实现类有两个选择：实现该方法，或者留空未实现并将类声明为 `abstract`（抽象）。\n\n如果一个类扩展了一个父类（参见\
  \ 4）并实现了一个接口，从两者都继承了相同的方法，规则就会更简单。在这种情况下，只有父类方法起作用，接口中的任何默认方法都被简单忽略。这实际上比接口冲突更常见。详情请参见\
  \ 4。\n\n## 3.2.4 私有方法\n\n接口中的方法可以是私有的。私有方法可以是 `static`（静态）或实例方法，但不能是 `default` 方法，因为它可以被重写。由于私有方法只能在接口本身的方法中使用，它们的使用仅限于作为接口其他方法的辅助方法。\n\
  \n例如，假设 `IntSequence` 类提供了方法：\n\n```java\nstatic IntSequence of(int a)\nstatic IntSequence\
  \ of(int a, int b)\nstatic IntSequence of(int a, int b, int c)\n```\n\n那么这些方法中的每一个都可以调用辅助方法：\n\
  \n```java\nprivate static makeSequence(int... values) { }\n```\n\n## 3.3 接口示例\n\n\
  乍一看，接口似乎不大。接口只是类承诺实现的方法集。为了让接口的重要性更加具体，以下章节将为你展示 Java API 中四个常用的接口示例。\n\n### 3.3.1\
  \ `Comparable` 接口\n\n假设你要对对象数组进行排序。排序算法反复比较元素并在顺序不对时重新排列它们。当然，比较的规则对于每个类都是不同的，而排序算法应该调用类提供的方法。这就是接口的用场。\n\
  \n如果一个类想要为其对象启用排序，它应该实现 `Comparable` 接口。关于这个接口有一个技术点。我们想要对比字符串、员工，类此类等等。因此，`Comparable`\
  \ 接口有一个类型参数。\n\n```java\npublic interface Comparable<T> {\n    int compareTo(T other);\n\
  }\n```\n\n例如，`String` 类实现了 `Comparable<``String``>`，使其 `compareTo` 方法具有签名：\n\n```java\n\
  int compareTo(String other)\n```\n\n带有类型参数的类型（如 `Comparable` 或 `ArrayList`）是*泛型*。你将在\
  \ 6 中学习关于泛型的所有知识。\n\n调用 `x.compareTo(y)` 时，`compareTo` 方法返回一个整数来指示 x 或 y 应该在前。正（不一定是\
  \ `1`）表示 `x` 应该在 `y` 之后。负整数（不一定是 `-1`）表示 `x` 应该在 `y` 之前。如果 `x` 和 `y` 被认为相等，则返回值为\
  \ `0`。\n\n注意，返回值可以是任何整数。这种灵活性是有用的，因为它允许你返回整数的差值。只要差值不会产生整数溢出，这种做法非常方便。\n\n```java\n\
  public class Employee implements Comparable<Employee> {\n    ...\n    public int\
  \ compareTo(Employee other) {\n        return getId() - other.getId(); // 如果 ID\
  \ 始终 ≥ 0 则安全\n    }\n}\n```\n\n\n\n\n返回整数的差值并不总是有效的。对于符号相反的大型操作数，差值可能会溢出。在这种情况下，请使用\
  \ `Integer.compare` 方法，它对所有整数都能正常工作。然而，如果你知道整数是非负的，或者它们的绝对值小于 `Integer.MAX_VALUE\
  \ / 2`，那么使用差值就是好的。\n\n在比较浮点值时，你不能直接返回差值。相反，请使用静态方法 `Double.compare`。它能够正确处理，即使对于\
  \ ±∞ 和 NaN。\n\n以下是 `Employee` 类如何实现 `Comparable` 接口，按工资对员工进行排序：\n\n```\npublic class\
  \ Employee implements Comparable<Employee> {\n    ...\n    public int compareTo(Employee\
  \ other) {\n        return Double.compare(salary, other.salary);\n    }\n}\n```\n\
  \n`compare` 方法访问 `other.salary` 是完全合法的。在 Java 中，方法可以访问该类任何对象的私有属性。\n\n`String` 类以及\
  \ Java 库中的其他百多个类都实现了 `Comparable` 接口。你可以使用 `Arrays.sort` 方法来对 `Comparable` 对象的数组进行排序：\n\
  \n```\nString[] names = { \"Peter\", \"Paul\", \"Mary\" };\nArrays.sort(names);\
  \ // names is now [\"Mary\", \"Paul\", \"Peter\"]\n```\n\n奇怪的是，`Arrays.sort` 方法在编译时并不检查参数是否为\
  \ `Comparable` 对象的数组。相反，如果它遇到没有实现 `Comparable` 接口的类元素，它会抛出异常。\n\n### 3.3.2. `Comparator`\
  \ 接口\n\n现在假设我们想按长度递增对字符串排序，而不是按字典顺序。我们无法让 `String` 类以两种方式实现 `compareTo` 方法——而且无论如何，`String`\
  \ 类也不是由我们来修改的。\n\n为了处理这种情况，`Arrays.sort` 方法有第二个版本，其参数是一个数组和一个比较器——比较器是一个实现了 `Comparator<T>`\
  \ 接口的类实例，该接口包含以下抽象方法：\n\n```\nint compare(T first, T second);\n```\n\n要按长度比较字符串，请定义实现\
  \ `Comparator<String>` 的类：\n\n```\nclass LengthComparator implements Comparator<String>\
  \ {\n    public int compare(String first, String second) {\n        return first.length()\
  \ - second.length();\n    }\n}\n```\n\n要实际执行比较，你需要创建一个实例：\n\n```\nComparator<String>\
  \ comp = new LengthComparator();\nif (comp.compare(names[i], names[j]) > 0) ...\n\
  ```\n\n将此调用与 `names[i].compareTo(names[j])` 进行对比。`compare` 方法是在比较器对象上调用的，而不是在字符串本身。\n\
  \n即使 `LengthComparator` 对象没有状态，你仍然需要创建一个实例。你需要这个实例来调用 `compare` 方法——它不是一个静态方法。\n\
  \n要对数组排序，将 `LengthComparator` 对象传递给 `Arrays.sort` 方法：\n\n```\nString[] names = {\
  \ \"Peter\", \"Paul\", \"Mary\" };\nArrays.sort(names, new LengthComparator());\
  \ \n```\n\n现在数组的结果是 `[\"Paul\", \"Mary\", \"Peter\"]` 或 `[\"Mary\", \"Paul\", \"\
  Peter\"]`。\n\n你将在第 3.4.2 节中看到如何使用 lambda 表达式更轻松地使用 `Comparator`。\n\n### 3.3.3. `Runnable`\
  \ 接口\n\n在几乎每个处理器都拥有多个核心的时代，你想让这些核心忙起来。你可能想在单独线程中运行某些任务，或者将它们交给线程池执行。要定义任务，你需要实现\
  \ `Runnable` 接口。该接口只有一个方法。\n\n```\nclass HelloTask implements Runnable {\n    public\
  \ void run() {\n        for (int i = 0; i < 1000; i++) {\n            System.out.println(\"\
  Hello, World!\");\n        }\n    }\n}\n```\n\n如果你想在一个新线程中执行此任务，请从 `Runnable` 创建线程并启动它。\n\
  \n```\nRunnable task = new HelloTask();\nThread thread = new Thread(task);\nthread.start();\n\
  ```\n\n现在 `run` 方法在单独线程中执行，当前线程可以继续进行其他工作。\n\n在第 10 章中，你将看到执行 `Runnable` 的其他方法。\n\
  \n还有一个 `Callable<T>` 接口，用于返回类型为 `T` 结果的任务。\n\n### 3.3.4. 用户界面回调\n\n在图形用户界面中，你必须指定当用户点击按钮、选择菜单选项、拖动滑块时要执行的操作。这些操作通常被称为回调（callbacks），因为当用户操作发生时，某些代码会被回调回来。\n\
  \n在基于 Java 的 GUI 库中，接口用于回调。例如，在 Swing 库中，以下接口用于报告事件：\n\n```\npublic interface ActionListener\
  \ {\n    void actionPerformed(ActionEvent event);\n}\n```\n\n要指定操作，请实现该接口：\n\n```\n\
  class ClickAction implements ActionListener {\n    public void actionPerformed(ActionEvent\
  \ event) {\n        System.out.println(\"Thanks for clicking!\");\n    }\n}\n```\n\
  \n然后，创建该类的对象并将其添加到按钮中：\n\n```\nvar button = new JButton(\"Click me!\");\nbutton.addActionListener(new\
  \ ClickAction());\n```\n\n## 3.4. Lambda 表达式\n\n*lambda 表达式*（lambda expression）是一段可以传递的代码块，以便稍后执行，可以执行一次或多次执行。在前面的章节中，你已经看到了许多指定此类代码很有用的情况：\n\
  \n*   向 `Arrays.sort` 传递比较方法\n*   在单独线程中运行任务\n*   当按钮被点击时指定操作\n\n然而，Java 是一种面向对象的语言，其中（几乎）一切都是对象。Java\
  \ 中没有函数类型。相反，函数被表示为对象，即类的实例。lambda 表达式为创建此类实例提供了简便的语法。\n\n### 3.4.1. Lambda 表达式的语法\n\
  \n再次考虑第 3.3.2 节中的排序示例。我们传递了一段代码来检查一个字符串是否比另一个字符串短。我们计算：\n\n```\nfirst.length() -\
  \ second.length()\n```\n\n`first` 和 `second` 是什么？它们都是字符串。Java 是一种强类型语言，我们必须也指定这一点：\n\
  \n```\n(String first, String second) -> first.length() - second.length()\n```\n\n\
  你刚刚看到了你的第一个 lambda 表达式。这种表达式仅仅是一个代码块，加上对必须传递给代码的变量的指定。\n\n为什么叫这个名字？许多年前，在计算机出现之前，逻辑学家阿隆佐·丘奇（Alonzo\
  \ Church）想要将数学函数可有效计算的定义形式化。（奇的是，已知某些函数存在，但没人知道如何计算它们的值。）他使用希腊字母 lambda (λ) 来标记参数，类似于：\n\
  \n```\n λfirst.\n      λsecond. first.length() - second.length()\n```\n\n为什么用字母\
  \ λ？是因为丘奇的字母表用完了吗？实际上，尊崇的《数学原理》（Principia Mathematica，参见 http://plato.stanford.edu/entries/principia-mathematica）使用了\
  \ ^ 变符号来表示函数参数，这启发了丘奇使用大写的 lambda Λ。但最后，他切换到了小写版本。从那时起带有参数变量的表达式就被称为 lambda 表达式。\n\
  \n\n\n如果 lambda 表达式的主体执行了不符合单个表达式的计算，请完全按照你编写方法的方式编写它：封装在 `{}` 中，并使用显式的 `return`\
  \ 语句。例如：\n\n```\n(String first, String second) -> {\n   int difference = first.length()\
  \ < second.length();\n   if (difference < 0) return -1;\n   else if (difference\
  \ > 0) return 1;\n   else return 0;\n}\n```\n\n如果 lambda 表达式没有参数，请提供空括号，就像无参数方法一样：\n\
  \n```\nRunnable task = () -> { for (int i = 0; i < 1000; i++) doWork(); }\n```\n\
  \n如果 lambda 表达式的参数类型可以被推断，你就可以省略它们。例如：\n\n```\nComparator<String> comp\n    = (first,\
  \ second) -> first.length() - second.length();\n    // 等同于 (String first, String\
  \ second)\n```\n\n在这里，编译器可以推断出 `first` 和 `second` 必须是字符串，因为该 lambda 表达式被赋值给一个字符串比较器。（我们将在下一节中详细讨论这一赋值。）\n\
  \n如果一个方法只有一个类型可推断的参数，你甚至可以省略括号：\n\n```\nActionListener listener = event ->\n   \
  \ System.out.println(\"Thanks for clicking!\");\n        // 代替 (event) -> 或 (ActionEvent\
  \ event) ->\n```\n\n你永远不需要指定 lambda 表达式的返回类型。然而，编译器会从主体中推断出来，并检查它是否与预期类型匹配。例如，表达式\n\
  \n```\n(String first, String second) -> first.length() - second.length()\n```\n\n\
  可以使用在期望 `int` 类型结果的上下文（或兼容的类型，如 `Integer`、`long` 或 `double`）。\n\n### 3.4.2. 函数式接口\n\
  \n正如你所见到的，Java 中有许多表示动作的接口，例如 `Runnable` 或 `Comparator`。lambda 表达式与这些接口是兼容的。\n\n\
  当期望一个具有单个抽象方法的接口对象时，你可以提供一个 lambda 表达式。这样的接口被称为函数式接口。\n\n为了演示转换为函数式接口，请考虑 `Arrays.sort`\
  \ 方法。它的第二个参数需要 `Comparator` 实例，这是一个具有单个方法的接口。只需提供一个 lambda 即可：\n\n```\nArrays.sort(names,\n\
  \    (first, second) -> first.length() - second.length());\n```\n\n在底层，`Arrays.sort`\
  \ 方法的第二个参数变量接收了一个实现了 `Comparator<String>` 的某个类的对象。在该对象上调用 `compare` 方法会执行 lambda\
  \ 表达式的主体。这些对象和类的管理完全取决于实现并经过了高度优化。\n\n在大多数支持函数字面量的编程语言中，你可以声明如 `(String, String)\
  \ -> int` 的函数类型，声明这些类型的变量，将函数放入这些变量并调用它们。在 Java 中，你对 lambda 表达式只能做一件事：将其放入一个类型为函数式接口的变量中，以便将其转换为该接口的实例。\n\
  \n你不能将 lambda 表达式赋值给 `Object` 类型的变量，它是 Java 中所有类的公共超类（参见 4）。`Object` 是一个类，而不是函数式接口。\n\
  \nJava API 提供了大量的函数式接口（参见第 3.6.2 节）。其中之一是\n\n```\npublic interface Predicate<T>\
  \ {\n    boolean test(T t);\n    // 额外的默认和静态方法\n}\n```\n\n`ArrayList` 类有一个 `removeIf`\
  \ 方法，其参数是 `Predicate`。它专门设计设计用于接收 lambda 表达式。例如，以下语句会从数组列表中删除所有 `null` 值：\n\n```\n\
  list.removeIf(e -> e == null);\n```\n\n### 3.5. 方法引用和构造器引用\n\n有时，已经有一个方法执行了你想传递给其他代码的完全相同的动作。方法引用有一种特殊的语法，甚至比调用该方法的\
  \ lambda 表达式更短。构造函数也有类似的快捷方式。你将在接下来的章节中看到这两种。\n\n### 3.5.1. 方法引用\n\n假设你想忽略大小写对字符串进行排序。你可以调用：\n\
  \n```\nArrays.sort(strings, (x, y) -> x.compareToIgnoreCase(y));\n```\n\n相反，你可以传递这个方法表达式：\n\
  \n```\nArrays.sort(strings, String::compareToIgnoreCase);\n```\n\n表达式 `String::compareToIgnoreCase`\
  \ 是方法引用，等同于 lambda 表达式 `(x, y) -> x.compareToIgnoreCase(y)`。\n\n这是另一个例子。`Objects`\
  \ 类定义了一个方法 `isNull`。调用 `Objects.isNull(x)` 仅仅返回 `x == null` 的值。这似乎并没必要为这种情况专门设置一个方法，但它被设计用来作为方法表达式传递。调用\n\
  \n```\nlist.removeIf(Objects::isNull);\n```\n\n会从列表中删除所有 `null` 的值。\n\n作为另一个例子，假设你想打印列表的所有元素。`ArrayList`\
  \ 类有一个 `forEach` 方法，它可以将函数应用到每个元素上。你可以调用：\n\n```\nlist.forEach(x -> System.out.println(x));\n\
  ```\n\n然而，如果能直接将 `println` 方法传递给 `forEach` 方法就更好了。操作方法如下：\n\n```\nlist.forEach(System.out::println);\n\
  ```\n\n从这些示例可以看出，`::` 运算符将方法名与类或对象分开。表 3.1：方法引用\n\n| 参数 | 方法表达式 | Lambda 表达式 |\n\
  | :--- | :--- | :--- |\n| `Class::staticMethod` | 1 | `Math::abs` | `x -> Math.abs(x)`\
  \ |\n| | 2 | `Math::pow` | `(x, y) -> Math.pow(x, y)` |\n| `Class::instanceMethod`\
  \ | 1 | `String::length` | `x -> x.length()` |\n| | 2 | `String::compareTo` | `(x,\
  \ y) -> x.compareTo(y)` |\n| `object::instanceMethod` | 1 | `System.out::println`\
  \ | `x -> System.out.println(x)` |\n| | 2 | `comp::compare` | `(x, y) -> comp.compare(x,\
  \ y)` |\n\n当存在同名的重载方法时，编译器将根据上下文尝试查找。例如，存在多个版本的 `println` 方法。当传递给 `ArrayList<String>`\
  \ 的 `forEach` 方法时，选择了 `println(String)`。\n\n你可以在方法引用中使用 `this` 参数。例如，`this::equals`\
  \ 等于 `x -> this.equals(x)`。\n\n并不是所有简单调用的 lambda 表达式都可以重写为方法表达式。例如，考虑\n\n```\nx\
  \ -> x.substring(k)\n```\n\n在这里，你运气不佳。三种变体中没有匹配。\n\n### 3.5.2. 构造器引用\n\n构造器引用与方法引用相似，但方法名是\
  \ `new`。例如，`Employee::new` 是对 `Employee` 构造器的引用。如果类有多个构造器，则取决于上下文选择哪一个。\n\n这是一个使用这种构造器引用的示例。假设你有一个字符串列表\n\
  \n```\nList<String> names = ...;\n```\n\n你想得到一个员工列表，每个名字对应一个。正如你在 8 中看到的，你可以使用流这样做而无需循环：将列表转换为流，然后调用\
  \ `map` 方法。它应用函数并收集所有结果。\n\n```\nStream<Employee> stream = names.stream().map(Employee::new);\n\
  ```\n\n由于 `names.stream()` 包含 `String` 对象，编译器知道 `Employee::new` 指向 `Employee(String)`\
  \ 构造器。\n\n你可以用数组类型形成构造器引用。例如，`int[]::new` 是一个带参数的构造器引用，参数是数组的长度。它等同于 lambda 表达式\
  \ `n -> new int[n]`。\n\n\n\n数组构造函数引用对于克服 Java 的一个局限性非常有用：无法构造泛型类型的数组。（详情参见 `6`）。由于这个原因，`Stream.toArray`\
  \ 等方法返回的是 `Object` 数组，而不是元素类型的数组：\n\n```\nObject[] employees = stream.toArray();\n\
  ```\n\n但这并不尽如人意。用户想要的是 `employees` 数组，而不是对象数组。为了解决这个问题，另一个版本的 `toArray` 接受构造函数引用：\n\
  \n```\nEmployee[] staff = stream.toArray(Employee[]::new);\n```\n\n`toArray` 方法调用此构造函数来获取正确类型的数组。然后它填充并返回该数组。\n\
  \n## 3.6. 处理 Lambda 表达式\n\n到目前为止，你已经了解了如何产生 lambda 表达式并将其传递给期望函数式接口的方法。在接下来的章节中，你将看到如何编写自己的可以消耗\
  \ lambda 表达式的方法。\n\n### 3.6.1. 实现延迟执行\n\n使用 lambda 的点在于*延迟执行*。毕竟，如果你想现在就执行某些代码，你会直接执行，而不会将其封装在\
  \ lambda 之中。稍后执行代码有许多原因，例如：\n\n*   在单独线程中运行代码\n*   多次运行代码\n*   在算法的正确点运行代码（例如排序中的比较操作）\n\
  *   当某些事件发生时运行代码（按钮被点击、数据到达等）\n*   仅在需要时运行代码\n\n让我们来看一个简单的例子。假设你想重复执行某个操作 `n` 次。该操作和计数被传递给\
  \ `repeat` 方法：\n\n```\nrepeat(10, () -> System.out.println(\"Hello, World!\"));\n\
  ```\n\n为了接受该 lambda，我们需要选择（或在少数情况下提供）一个函数式接口。在这种情况下，我们可以直接使用 `Runnable`：\n\n```\n\
  public static void repeat(int n, Runnable action) {\n    for (int i = 0; i < n;\
  \ i++) action.run(); \n}\n```\n\n这里是来自 Java API 的另一个例子。静态方法 `Arrays.setAll` 将一个\
  \ `IntFunction` 应用到数组的所有元素上，并将每个元素设置为结果：\n\n```\nvar squares = new int[10];\nArrays.setAll(squares,\
  \ index -> index * index)\n    // 将 squares 设置为 { 0, 1, 4, ..., 81 }\n```\n\n注意，lambda\
  \ 表达式的体在调用 `action.run()` 时执行。\n\n现在让我们让这个例子变得稍微复杂一点。我们想告诉操作它是在哪一次迭代中发生的。为此，我们需要选择一个具有带有\
  \ `int` 参数和 `void` 返回值的函数式接口。与其自己实现，我强烈建议你使用下一节中描述的标准接口之一。处理 `int` 值的标准接口是：\n\n\
  ``````\npublic interface IntConsumer {\n    void accept(int value);\n}\n```````\n\
  \n这是改进后的 `repeat` 方法：\n\n```\npublic static void repeat(int n, IntConsumer action)\
  \ {\n    for (int i = 0; i < n; i++) action.accept(i); \n}\n```\n\n以下是调用它的方式：\n\n\
  ```\nrepeat(10, i -> System.out.println(\"Countdown: \" + (9 - i)));\n```\n\n###\
  \ 3.6.2. 选择函数式接口\n\n在大多数函数式编程语言中，函数类型是*结构化*的。要指定一个将两个字符串映射到整数的函数，你会使用类似于 `Function2<String,\
  \ String, Integer>` 或 `(String, String) -> int` 的类型。在 Java 中，你而是使用函数式接口（如 `Comparator<String>`）来声明函数的意图。在编程语言理论中，这被称为*名义类型*。\n\
  \n当然，在许多情况下，你想接受没有特定语义的“任何函数”。有很多泛型函数类型用于此目的（参见 `Table 3.2`），在可以的情况下使用其中一个是一个非常好的主意。\n\
  \n表 3.2：常见函数式接口\n\n| 函数式接口 | 参数类型 | 返回类型 | 抽象方法名 | 描述 | 其他方法 |\n| --- | --- | ---\
  \ | --- | --- | --- |\n| `Runnable` | 无 | `void` | `run` | 执行不带参数或返回值的操作。 | |\n\
  | `Supplier<T>` | 无 | `T` | `get` | 提供类型为 `T` 的值。 | |\n| `Consumer<T>` | `T` | `void`\
  \ | `accept` | 消耗类型为 `T` 的值。 | `andThen` |\n| `BiConsumer<T, U>` | `T`, `U` | `void`\
  \ | `accept` | 消耗类型为 `T` 和 `U` 的值。 | `andThen` |\n| `Function<T, R>` | `T` | `R`\
  \ | `apply` | 具有类型为 `T` 参数的函数。 | `compose`, `andThen`, `identity` |\n| `BiFunction<T,\
  \ U, R>` | `T`, `U` | `R` | `apply` | 具有类型为 `T` 和 `U` 参数的函数。 | `andThen` |\n| `UnaryOperator<T>`\
  \ | `T` | `T` | `apply` | 对 `T` 的一元操作符。 | |\n| `BinaryOperator<T>` | `T`, `T` |\
  \ `T` | `apply` | 对 `T` 的二元操作符。 | |\n| `Predicate<T>` | `T` | `boolean` | `test`\
  \ | 对 `T` 的谓词。 | |\n\n### 3.6.3. 实现你自己的函数式接口\n\n经常，你可能会处于没有任何标准函数式接口都适用于你的情况。这时你就需要自己实现。\n\
  \n假设你想用颜色图案填充图像，用户提供一个产生每个像素颜色的函数。对于映射 `(int, int) -> Color`，目前没有标准类型。你可以使用 `BiFunction<Integer,\
  \ Integer, Color>`，但这涉及自动装箱。\n\n在这种情况下，定义一个新接口是有意义的：\n\n```\n@FunctionalInterface\n\
  public interface PixelFunction {\n    Color apply(int x, int y);\n}\n```\n\n用 `@FunctionalInterface`\
  \ 注解标记函数式接口是一个好主意。这有两个优势：第一，编译器会检查带注解的实体是否为具有单个抽象方法的接口。第二，javadoc 页面将包含一条声明，说明你的接口是一个函数式接口。\n\
  \n\n\n\n现在你已经准备好实现一个方法：\n\n```\nBufferedImage createImage(int width, int height,\
  \ PixelFunction f) {\n    var image = new BufferedImage(width, height, BufferedImage.TYPE_INT_RGB);\n\
  \n    for (int x = 0; x < width; x++)\n        for (int y = 0; y < height; y++)\
  \ {\n            Color color = f.apply(x, y);\n            image.setRGB(x, y, color.getRGB());\n\
  \        }\n    return image;\n}\n```\n\n要调用它，请提供一个根据两个整数返回颜色值的 lambda 表达式：\n\n\
  ```\nBufferedImage frenchFlag = createImage(150, 100,\n    (x, y) -> x < 50 ? Color.BLUE\
  \ : x < 100 ? Color.WHITE : Color.RED);\n```\n\n## 3.7. 表达式与变量作用域\n\n在后续章节中，你将学习变量在\
  \ lambda 表达式内部是如何工作的。这些信息具有一定的技术性，但对于操作 lambda 表达式至关重要。\n\n### 3.7.1. Lambda 表达式的作用域\n\
  \nlambda 表达式的主体具有`与嵌套块相同的作用域`。名称冲突和遮蔽（shadowing）的规则同样适用。在 lambda 表达式中声明与局部变量同名的参数或局部变量是非法的。\n\
  \n```\nint first = 0;\nComparator<String> comp = (first, second) -> first.length()\
  \ - second.length();\n    // 错误：变量 first 已定义\n```\n\n在方法内部，你不能有两个同名的局部变量，因此你也不能在\
  \ lambda 表达式中引入此类变量。\n\n作为“相同作用域”规则的另一个结果，lambda 表达式中的 `this` 关键字表示创建该 lambda 的方法的\
  \ `this` 参数。例如，考虑\n\n```\npublic class Application() {\n    public void doWork()\
  \ {      \n        Runnable runner = () -> { ...; System.out.println(this.toString());\
  \ ... };\n        ...\n    }\n}\n```\n\n表达式 `this.toString()` 调用的是 `Application`\
  \ 对象的 `toString` 方法，而不是 `Runnable` 实例。lambda 表达式中使用 `this` 没有什么特殊之处。lambda 表达式的作用域嵌套在\
  \ `doWork` 方法内部，`this` 在该方法的任何地方都具有相同的含义。\n\n### 3.7.2. 从闭包作用域访问变量\n\n通常，你想在 lambda\
  \ 表达式中访问闭包方法或类的变量。考虑这个示例：\n\n```\npublic static void repeatMessage(String text,\
  \ int count) {\n    Runnable r = () -> {\n        for (int i = 0; i < count; i++)\
  \ {\n            System.out.println(text);\n        }\n    };\n    new Thread(r).start();\
  \                  \n}\n```\n\n注意，lambda 表达式访问的是闭包作用域中定义的参数变量，而不是 lambda 表达式本身的。\n\
  \n考虑一个调用\n\n```\nrepeatMessage(\"Hello\", 1000); // 在单独线程中打印 1000 次 Hello\n```\n\
  \n现在看 lambda 表达式内部的变量 `count` 和 `text`。如果你仔细思考，这里正在发生一些并不显而易见的事情。lambda 表达式的代码可能在\
  \ `repeatMessage` 调用返回且参数变量消失很久之后仍在运行。当 lambda 表达式准备好执行时，`text` 和 `count` 变量是如何留存的？\n\
  \n为了理解发生了什么，我们需要完善对 lambda 表达式的理解。lambda 表达式包含三个要素：\n\n1. 一块代码\n2. 参数\n3. 自由变量的值——即既不是参数也没有在代码内部定义的变量\n\
  \n在我们的示例中，lambda 表达式有两个自由变量，`text` 和 `count`。表示 lambda 表达式的数据结构必须存储这些变量的值——在我们的例子中，为\
  \ `\"Hello\"` 和 `1000`。我们说这些值被 lambda 表达式*捕获*（captured）了。（如何实现这一点的是实现细节。例如，可以将 lambda\
  \ 表达式转换为一个只有一个方法的对象，这样自由变量的值就会复制到该对象的实例变量中。）\n\n代码块连同自由变量值的组合的专业术语是`闭包`（closure）。在\
  \ Java 中，lambda 表达式就是闭包。\n\n正如你所看到的，lambda 表达式可以捕获闭包作用域中变量的值。为了确保捕获的值是有良好定义的，有一个重要的限制。在\
  \ lambda 表达式中，你只能引用值不会改变的变量。这有时被描述为 lambda 表达式捕获的是值而不是变量。例如，以下是编译时错误：\n\n```\nfor\
  \ (int i = 0; i < n; i++) {\n    new Thread(() -> System.out.println(i)).start();\n\
  \        // 错误—无法捕获 i\n}\n```\n\nlambda 表达式试图捕获 `i`，但这是不法的，因为 `i` 会发生变化。没有单一的值可以捕获。规则是，lambda\
  \ 表达式只能访问闭包作用域中是*有效最终*（effectively final）的局部变量。有效最终变量从未被修改过——它要么是或者可以声明为 `final`。\n\
  \n同样的规则适用于被局部类捕获的变量（参见第 3.9 节）。过去，规则更加严格，要求被捕获的变量必须实际声明为 `final`。现在不再如此。\n\n增强 `for`\
  \ 循环的变量是有效最终的，因为它的作用域是单次迭代。以下是完全合法的：\n\n```\nfor (String arg : args) {\n    new\
  \ Thread(() -> System.out.println(arg)).start();\n        // 捕获 arg 是安全的\n}\n```\n\
  \n变量 `arg` 在每次迭代中创建并赋值为 `args` 数组的下一个值。相比之下，之前的示例中 `i` 的作用域是整个循环。\n\n作为“有效最终”规则的结果，lambda\
  \ 表达式不能修改任何被捕获的变量。例如，\n\n```\npublic static void repeatMessage(String text, int\
  \ count, int threads) {\n    Runnable r = () -> {\n        while (count > 0) {\n\
  \            count--; // 错误：无法修改捕获的变量\n            System.out.println(text);\n \
  \       }\n    };\n    for (int i = 0; i < threads; i++) new Thread(r).start();\n\
  }\n```\n\n这实际上是件好事。正如你在 10 中看到的，如果两个线程同时更新 `count`，其值是未定义的。\n\n不要依赖编译器来捕捉所有的并发访问错误。修改限制仅适用于局部变量。如果\
  \ `count` 是类的实例变量或静态变量，则不会报告错误。\n\n可以使用长度为 1 的数组来规避这种不当修改的检查：\n\n```\nint[] counter\
  \ = new int[1];\nbutton.addActionListener(event -> counter[0]++);\n```\n\n`counter`\
  \ 变量是有效最终的——因为它始终引用同一个数组，因此你可以在 lambda 表达式中访问它。\n\n## 3.8. 高阶函数\n\n在函数式编程语言中，函数是一等公民。就像你可以将数字传递给方法并拥有产生数字的方法一样，你也可以拥有函数的参数和返回值。处理或返回函数的被称为高阶函数。这听起来很抽象，但在实践中非常有用。Java\
  \ 并不是函数式语言，因为它使用函数式接口，但原理是相同的。在后续章节中，我们将查看一些示例并检查 `Comparator` 接口中的高阶函数。\n\n###\
  \ 3.8.1. 返回函数的方法\n\n假设我们有时想按升序排序字符串数组，有时按降序排序。我们可以编写一个产生正确比较器的方法：\n\n\n\n\n\n```\n\
  public static Comparator<String> compareInDirecton(int direction) {\n    return\
  \ (x, y) -> direction * x.compareTo(y);\n}\n```\n\n调用 `compareInDirection(1)` 返回一个升序比较器，而调用\
  \ `compareInDirection(-1)` 则返回一个降序比较器。\n\n该结果可以传递给其他期望此类接口（例如 `Arrays.sort`）。\n\n\
  ```\nArrays.sort(names, compareInDirection(-1));\n```\n\n通常情况下，不要回避编写产生函数的方法（或者从技术上说，实现函数式接口的类实例）。这对于生成自定义函数并将其传递给带有函数式接口的方法非常有用。\n\
  \n### 3.8.2. 修改函数的方法\n\n在节一节中，你看到过一个产生递增或递减字符串比较器的方法。我们可以通过反转任何比较器来泛化这一思想：\n\n```\n\
  public static Comparator<String> reverse(Comparator<String> comp) {\n    return\
  \ (x, y) -> comp.compare(y, x);\n}\n```\n\n该方法对函数的操作。它接收一个函数并返回一个修改后的函数。要获取不区分大小写的降序排序，请使用\n\
  \n```\nreverse(String::compareToIgnoreCase)\n```\n\n`Comparator` 接口有一个默认方法 `reversed`，它正通过这种方式产生给定比较器的反转结果。\n\
  \n### 3.8.3. Comparator 方法\n\n`Comparator` 接口有许多实用的静态方法，这些方法是生成比较器的高阶函数。\n\n`comparing`\
  \ 方法接收一个“键提取器”函数，该函数将类型 `T` 映射到可比较的类型（如 `String`）。该函数被应用于要比较的对象，然后对返回的键进行比较。例如，假设\
  \ `Person` 类有一个方法 `getLastName`。那么你可以像下面一样按姓氏对 `Person` 对象数组进行排序：\n\n```\nArrays.sort(people,\
  \ Comparator.comparing(Person::getLastName));\n```\n\n你可以使用 `thenComparing` 方法链用比较器来处理平局。例如，先按姓氏对人员数组排序，对于姓相同的人，再使用名字：\n\
  \n```\nArrays.sort(people, Comparator\n    .comparing(Person::getLastName)\n   \
  \ .thenComparing(Person::getFirstName));\n```\n\n这些方法有几种变体。你可以指定一个比较器，用于 `comparing`\
  \ 和 `thenComparing` 方法提取的键。例如，在这里我们按名字的长度对人员排序：\n\n```\nArrays.sort(people, Comparator.comparing(Person::getLastName,\n\
  \    (s, t) -> s.length() - t.length()));\n```\n\n此外，`comparing` 和 `thenComparing`\
  \ 方法都有变体，可以避免 `int`、`long` 或 `double` 值的装箱。按名字长度排序的更简单方法是：\n\n```\nArrays.sort(people,\
  \ Comparator.comparingInt(p -> p.getLastName().length()));\n```\n\n如果你的键函数可以返回 `null`，你可能会喜欢\
  \ `nullsFirst` 和 `nullsLast` 适配器。这些静态方法接收一个现有的比较器并对其修改，使其在遇到 `null` 值时不会抛出异常，而是将其排为比普通值小或大。例如，假设当人没有中间名时\
  \ `getMiddleName` 返回 `null`。那么你可以使用 `Comparator.comparing(Person::getMiddleName,\
  \ Comparator.nullsFirst(...))`。\n\n`nullsFirst` 方法需要一个比较器——在这种情况下，是一个比较两个字符串的比较器。`naturalOrder`\
  \ 方法为任何实现 `Comparable` 的类创建一个比较器。这里是按可能为空的中间名排序的完整调用。我使用了 `java.util.Comparator.*`\
  \ 的静态导入来使表达式更具读性。注意 `naturalOrder` 的类型是推断出来的。\n\n```\nArrays.sort(people, comparing(Person::getMiddleName,\n\
  \    nullsFirst(naturalOrder())));\n```\n\n静态方法 `reverseOrder` 提供了自然顺序的反转。\n\n##\
  \ 3.9. 局部类和匿名类\n\n在 Lambda 表达式出现很久以前，Java 就有一种机制可以简洁地定义实现接口（无论是否是函数式的）类。对于函数式接口，你应该使用\
  \ Lambda 表达式，但偶尔你可能想为非函数式接口提供简洁的形式。你还会在遗留代码中遇到经典的结构。\n\n### 3.9.1. 局部类\n\n你可以在方法内部定义一个类。这种类被称为\
  \ `局部类`（local class）。你对仅具有战术意义的类这样做。这种情况经常发生在类实现了一个接口，而方法的调用者只关心接口而不关心该类时。\n\n例如，考虑一个方法\n\
  \n```\npublic static IntSequence randomInts(int low, int high)\n```\n\n它生成一个具有给定边界的无限随机整数序列。\n\
  \n由于 `IntSequence` 是一个接口，该方法必须返回一个实现该接口的某个类的对象。调用者并不关心该类，因此可以将其声明在方法内部：\n\n```java\n\
  private static RandomGenerator generator = RandomGenerator.getDefault();\n\npublic\
  \ static IntSequence randomInts(int low, int high) {\n    class RandomSequence implements\
  \ IntSequence {\n        public int next() { return low + generator.nextInt(high\
  \ - low + 1); }\n        public boolean hasNext() { return true; }\n    }\n\n  \
  \  return new RandomSequence();\n}\n```\n\n局部类不声明为 `public` 或 `private`，因为在方法外部永远无法访问。\n\
  \n将类变为局部类有两个优点。首先，它的名称在作用域是隐藏的。其次，类的方法可以访问封装作用域的变量，就像 Lambda 表达式一样。\n\n在我们的示例中，`next`\
  \ 方法捕获了三个变量：`low`、`high` 和 `generator`。如果你将 `RandomSequence` 变成嵌套类，你就必须提供一个显式的构造函数来接收这些值并存储在实例变量中。\n\
  \n### 3.9.2. 匿名类\n\n在节节的示例中，`RandomSequence` 只使用了一次：用于构造返回值。在这种情况下，你可以让类变为`匿名`的：\n\
  \n```\npublic static IntSequence randomInts(int low, int high) {\n    return new\
  \ IntSequence() {\n        public int next() { return low + generator.nextInt(high\
  \ - low + 1); }\n        public boolean hasNext() { return true; }\n    }\n}\n```\n\
  \n表达式 `new Interface() { methods }` 表示：定义一个具有给定方法的接口类，并构造该类的对象。\n\n`new` 表达式中的 `()`\
  \ 表示构造参数。匿名类的默认构造函数会被调用。\n\n在有 Lambda 表达式之前，匿名内部类是提供 Runnable、比较器和其他函数对象的最简洁的语法。你经常会在遗留代码中看到它们。\n\
  \n如今，只有当你需要提供两个或多个方法时（如前面的示例所示），匿名内部类才是必要的。如果 `IntSequence` 接口有一个默认的 `hasNext` 方法（如\
  \ 3.2.2 节），你可以简单地使用 Lambda 表达式：\n\n```\npublic static IntSequence randomInts(int\
  \ low, int high) {\n    return () -> low + generator.nextInt(high - low + 1);\n\
  }\n```\n\n## 练习\n\n1.  提供一个接口 `Measurable`，其中包含一个以某种方式测量对象的 `getMeasure()` 方法。让\
