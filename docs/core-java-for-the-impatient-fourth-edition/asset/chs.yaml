  \ `n! = 1 × 2 × ... × n`。计算 1000 的阶乘。\n7. 编写一个程序，读取两个 0 到 429496795 之间的整数，将它们存储在\
  \ `int` 变量中，并计算显示它们的和、差、商和余数。不要将它们转换为 `long`。\n8. 编写一个程序，读取一个字符串并打印其所有的非空子字符串。\n\
