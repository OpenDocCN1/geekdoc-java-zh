  \ 继承与反射\n\n前面的章节向你介绍了类和接口。在本章中，你将学习面向对象编程的另一个基本概念：继承。继承是基于现有类创建新类的过程。当你继承一个现有类时，你重用了（或继承了）它的方法，并可以添加新的方法和字段。\n\
  \n实例变量和静态变量统称为 `fields`（字段）。类内部的字段、方法和嵌套类/接口统称为 `members`（成员）。\n\n本章还涵盖了反射，即在运行程序中发现更多关于类及其成员信息的能力。反射是一个强大的特性，但不可否认地复杂。由于反射对工具构建者比对应用程序程序员更有意义，你可能第一次阅读时可以略过该章的这部分，稍后再回来。\n\
  \n本章的要点是：\n\n1. 子类可以继承或重写父类的方法，只要这些方法不是 `private` 的。\n\n2. 使用 `super` 关键字调用父类方法或构造函数。\n\
  \n3. `final` 方法不能被重写；`final` 类不能被扩展。\n\n4. `abstract` 方法没有实现；`abstract` 类不能被实例化。\n\
  \n5. 父类的 `protected` 成员在子类方法中是可以访问的，但仅当应用于相同子类的对象时有效。它在所属包中也是可访问的。\n\n6. 每个类都是 `Object`\
  \ 的子类，`Object` 提供了 `toString`、`equals`、`hashCode` 和 `clone` 方法。\n\n7. 每个枚举类型都是 `Enum`\
  \ 的子类，`Enum` 提供了实例方法 `toString` 和 `compareTo` 以及一个静态方法 `valueOf`。\n\n8. `sealed`（密封）类型指定了可以在其他文件中声明的子类型。\n\
  \n9. 模式匹配根据对象的类型和属性选择操作。它在密封类型层次结构中特别有用。\n\n10. `Class` 类提供了关于 Java 类型的信息，类型可以是类、数组、接口、原始类型或\
  \ `void`。\n\n11. 你可以使用 `Class` 对象加载类文件资源。\n\n12. 使用类加载器从类路径以外的位置加载类。\n\n13. `ServiceLoader`\
  \ 类提供了定位和选择实现的机制。\n\n14. 反射库允许程序发现对象的成员、访问变量并调用方法。\n\n15. 代理对象动态实现接口，并将方法调用路由到处理器。\n\
  \n## 4.1 扩展类\n\n回到我们在 2 中过的 `Employee` 类。假设（不幸）你在一家对经理对待方式不同的公司工作。经理在很多方面与员工一样。员工和经理都领取薪水。然而，员工被要求完成分配的任务以换取薪水，而经理如果实现了目标就能获得奖金。这就是可以用继承建模的情况。\n\
  \n### 4.1.1 父类与子类\n\n让我们定义一个新类 `Manager`，保留 `Employee` 类的一些功能，并指定经理的不同之处。\n\n```\n\
  public class Manager extends Employee {\n    新增字段\n    新增或重写方法\n}\n```\n\n`extends`\
  \ 关键字表示你正在创建一个派自现有类的新类。现有类被称为*父类*（superclass），新类被称为*子类*（subclass）。在示例中，`Employee`\
  \ 类是父类，`Manager` 类是子类。注意，父类并不优于子类。事实恰相反：子类比父类功能更多。\n\n### 4.1.2 定义和继承子类方法\n\n我们的\
  \ `Manager` 类有一个新的实例变量来存储奖金，还有一个新方法来设置它：\n\n\n\n\n\n```java\npublic class Manager\
  \ extends Employee {\n    private double bonus;\n    ...\n    public void setBonus(double\
  \ bonus) {\n        this.bonus = bonus;\n    }\n}\n```\n\n当你有一个 `Manager` 对象时，你当然可以调用\
  \ `setBonus` 方法，以及 `Employee` 类中的非私有方法。这些方法是*继承*的。\n\n```java\nManager boss = new\
  \ Manager(...);\nboss.setBonus(10000); // 定义在子类中\nboss.raiseSalary(5); // 继承自父类\n\
  ```\n\n### 4.1.3. 方法重写 (Method Overriding)\n\n有时，需要在子类中修改父类方法。例如，假设 `getSalary`\
  \ 方法预期报告员工的总薪资。那么，继承的方法对于 `Manager` 类来说是不够的。相反，你需要*重写*该方法，使其返回基本工资和奖金之和。\n\n```java\n\
  public class Manager extends Employee {\n    ...\n    public double getSalary()\
  \ { // 重写父类方法\n        return super.getSalary() + bonus;\n    }\n}\n```\n\n该方法调用了父类方法来获取基本工资，并加上奖金。注意，子类方法无法直接访问父类的私有实例变量。这就是为什么\
  \ `Manager.getSalary` 方法调用了公有的 `Employee.getSalary` 方法。`super` 关键字用于调用父类方法。\n\n\
  与 `this` 不同，`super` 不是对对象的引用，而是一个跳过动态方法查找（参见第 4.1.5 节）并调用特定方法的指令。\n\n重写方法并不要求调用父类方法，但这是常见的做法。\n\
  \n当你重写一个方法时，必须小心精确匹配参数类型。例如，假设 `Employee` 类有一个方法：\n\n```java\npublic boolean worksFor(Employee\
  \ supervisor) \n```\n\n如果你在 `Manager` 类中重写此方法，你不能更改参数类型，尽管显然没有经理会向一个普通的员工汇报工作。假设你定义了一个方法：\n\
  \n```java\npublic class Manager extends Employee {\n    ...\n    public boolean\
  \ worksFor(Manager supervisor) {\n        ...\n    }\n}\n```\n\n这仅仅是一个新方法，现在 `Manager`\
  \ 有了两个独立的 `worksFor` 方法。你可以通过为意图重写父类方法的方法标记 `@Override` 注解来防止此类错误的发生：\n\n```java\n\
  @Override public boolean worksFor(Employee supervisor) \n```\n\n如果你犯了错误并正在定义一个新方法，编译器会报告错误。\n\
  \n在重写方法时，可以将返回类型更改为子类型。（在术术中，*协变返回类型*是允许的。）例如，如果 `Employee` 类有一个方法：\n\n```java\n\
  public Employee getSupervisor()\n```\n\n那么 `Manager` 类可以使用以下方法重写它：\n\n```java\n\
  @Override public Manager getSupervisor()\n```\n\n当重写方法时，子类方法的访问权限必须*至少不低于*父类方法。特别是，如果父类方法是\
  \ `public`，那么子类方法也必须声明为 `public`。无意遗漏子类方法的 `public` 修饰符是一个常见错误。编译器会由于访问权限过弱而报错。\n\
  \n### 4.1.4. 子类构造 (Subclass Construction)\n\n让我们为 `Manager` 类提供一个构造函数。由于 `Manager`\
  \ 构造函数无法访问 `Employee` 类的私有实例变量，它必须通过父类构造函数来初始化它们。\n\n```java\npublic Manager(String\
  \ name, double salary) {\n    super(name, salary);\n    bonus = 0;\n}\n```\n\n在这里，`super`\
  \ 关键字表示调用父类 `Employee` 的构造函数并将 `name` 和 `salary` 作为参数。父类构造函数的调用必须是子类构造函数的*第一语句*。\n\
  \n如果子类没有显式调用任何父类构造函数，则父类必须有一个被隐式调用的无参构造函数。\n\n### 4.1.5. 父类赋值 (Superclass Assignments)\n\
  \n将子类对象赋值给类型为父类的变量是合法的，例如：\n\n```java\nManager boss = new Manager(...);\nEmployee\
  \ empl = boss; // 赋值给父类变量是安全的\n```\n\n现在考虑在父类变量上调用方法会发生什么。\n\n```java\ndouble salary\
  \ = empl.getSalary();\n```\n\n尽管 `empl` 的类型是 `Employee`，但调用的是 `Manager.getSalary`\
  \ 方法。在调用方法时，虚拟机会查看对象的实际类并找到其方法版本。这个过程被称为*动态方法查找*。\n\n为什么你想将 `Manager` 对象赋值给 `Employee`\
  \ 变量？这允许你编写适用于*所有*员工的代码，无论他们是经理、清洁员还是另一个 `Employee` 子类的实例。\n\n```java\nEmployee[]\
  \ staff = new Employee[...];\nstaff[0] = new Employee(...);\nstaff[1] = new Manager(...);\
  \ // 赋值给父类变量是安全的\nstaff[2] = new Janitor(...); \n...\ndouble sum = 0;\nfor (Employee\
  \ empl : staff)\n    sum += empl.getSalary();\n```\n\n得益于动态方法查找，`empl.getSalary()`\
  \ 调用的是属于 `empl` 所引对象的 `getSalary` 方法，这可能是 `Employee.getSalary`、`Manager.getSalary`\
  \ 等。\n\n### 4.1.6. 强制转换 (Casts)\n\n在前面的节中，你看到一个类型为 `Employee` 的变量可以引用类为 `Employee`、`Manager`\
  \ 或另一个 `Employee` 子类的对象。这对于处理多个类的代码非常有用。但它有一个缺点：你只能调用属于父类的方法。考虑以下示例：\n\n```java\n\
  Employee empl = new Manager(...);\nempl.setBonus(10000); // 编译错误\n```\n\n即使此调用在运行时可以成功，也是编译错误。编译器检查你只调用接收者类型存在的方法。在这里，`empl`\
  \ 类型为 `Employee`，该类没有 `setBonus` 方法。\n\n与接口一样，你可以使用 `instanceof` 运算符和强制转换将父类引用转换为子类引用。\n\
  \n```java\nif (empl instanceof Manager mgr) {\n    mgr.setBonus(10000);\n}\n```\n\
  \n### 4.1.7. 匿名子类 (Anonymous Subclasses)\n\n就像你可以创建一个实现接口的匿名类，也可以创建一个扩展父类的匿名类。这对于调试非常有帮助：\n\
  \n```java\nvar names = new ArrayList<String>(100) {\n    public void add(int index,\
  \ String element) {\n        super.add(index, element);\n        System.out.printf(\"\
  Adding %s at %d\\n\", element, index);\n    }\n};\n```\n\n父类名后括号中的参数将传递给父类构造函数。在这里，我们构造了一个\
  \ `ArrayList<String>` 的匿名子类，并重写了 `add` 方法。该实例的初始容量为 100。\n\n被称为*双大括号初始化*的技巧以一种非常奇的方式使用了内部类语法。假设你想构造一个列表并将其传递给方法：\n\
  \n```java\nvar friends = new ArrayList<String>();\nfriends.add(\"Harry\");\nfriends.add(\"\
  Sally\");\ninvite(friends);\n```\n\n\n\n\n\n如果你再也不需要这个数组列表（array list），将其匿名化会很好。但这样的话你该如何添加元素呢？方法如下：\n\
  \n```\ninvite(new ArrayList<String>() {{ add(\"Harry\"); add(\"Sally\"); }});\n\
  ```\n\n注意双大括号。外层大括号使得 `ArrayList<String>` 的匿名子类。内层大括号是一个初始化块（参见 2）。\n\n我不建议你在 Java\
  \ 趣味性竞赛之外使用这种技巧。它是低效的。取决于 `equals` 方法的实现方式，构造出的对象在相等性测试中的行为可能是不一致的。\n\n如果 `invite`\
  \ 方法的参数类型为 `List`，可以直接如下所示调用：\n\n```\ninvite(List.of(\"Harry\", \"Sally\"));\n```\n\
  \n### 4.1.8 带有 `super` 的方法表达式\n\n回想 3 { \n        for (int i = 0; i < 100; i++)\
  \ System.out.println(\"Working\"); \n    }\n}\n\npublic class ConcurrentWorker extends\
  \ Worker {\n    public void work() { \n        var t = new Thread(super::work);\n\
  \        t.start();\n    }\n}\n```\n\n线程线程构造时使用了一个 `Runnable`，其 `run` 方法调用了父类的 `work`\
  \ 方法。\n\n## 4.2 继承层次结构\n\n你刚刚看到了如何扩展一个类。显然，你可以再次扩展子类并重复该过程，形成一个类的层次结构。在接下来的章节中，你将学习\
  \ Java 语言提供的用于控制此类继承层次结构中可以操作内容的构造。\n\n### 4.2.1 Final 方法和类\n\n当你将一个方法声明为 `final`\
  \ 时，任何子类都不能重写它。\n\n```\npublic class Employee {\n    ...\n    public final String\
  \ getName() {\n        return name;\n    }\n}\n```\n\nJava API 中 `final` 方法的一个很好的例子是\
  \ `Object` 类的 `getClass` 方法，你将在第 4.6.1 节中看到。允许对象对其所属的类撒谎似乎是不明智的，因此该方法永远无法被更改。\n\n\
  一些程序员认为 `final` 关键字有利于提高效率。这在 Java 早期可能是真的，但现在不再是了。现代虚拟机会推测性地“内联”（inline）简单方法，例如上面的\
  \ `getName` 方法，即使它们没有被声明为 `final`。在加载了重写了此类方法的子类的稀有情况下，内联会被取消。\n\n有些程序员认为，一个类的大多数方法都应该声明为\
  \ `final`，只有专门设计为可被重写的方法才不应该如此。另一些人则认为这种做法过于严苛，因为这阻止了即使无害的重写（例如为了日志记录或调试目的）。\n\n\
  有时，你可能希望防止别人从你的某个类中创建子类。在类定义中使用 `final` 修饰符来指示这一点。例如，这里是防止他人扩展 `Executive` 类的方法：\n\
  \n```\npublic final class Executive extends Manager {\n    ...\n}\n```\n\nJava API\
  \ 中有许多 `final` 类，例如 `String`、`LocalTime` 和 `URL`。\n\n### 4.2.2 抽象方法和类\n\n类可以定义一个没有实现的方法，强迫子类去实现它。这样的方法以及包含它的类被称为*抽象*（abstract），并且必须标记有\
  \ `abstract` 修饰符。这通常用于非常通用的类，例如：\n\n```java\npublic abstract class Person {\n  \
  \  private String name;\n\n    public Person(String name) { this.name = name; }\n\
  \    public final String getName() { return name; }\n\n    public abstract int getId();\n\
  }\n```\n\n任何扩展 `Person` 的类必须提供 `getId` 方法的实现，或者自身被声明为 `abstract`。\n\n注意，抽象类可以拥有非抽象方法，例如上一个例子中的\
  \ `getName` 方法。\n\n与接口不同，抽象类可以拥有实例变量和构造函数。\n\n无法构造抽象类的实例。例如，以下调用\n\n```\nPerson\
  \ p = new Person(\"Fred\"); // 错误\n```\n\n将是一个编译时错误。\n\n然而，你可以拥有一个类型为抽象类的变量，只要它包含一个指向具体子类对象的引用。假设类\
  \ `Student` 声明如下：\n\n```\npublic class Student extends Person {\n    private int\
  \ id;\n\n    public Student(String name, int id) { super(name); this.id = id; }\n\
  \    public int getId() { return id; }\n}\n```\n\n那么你就可以构造一个 `Student` 并将其赋值给 `Person`\
  \ 变量。\n\n```\nPerson p = new Student(\"Fred\", 1729); // OK，具体的子类\n```\n\n### 4.2.3\
  \ Protected 访问\n\n有时你希望将一个方法限制为仅子类可见，或者较少地允许子类方法访问父类的实例变量。为此，将类特性声明为 `protected`。\n\
  \n例如，假设父类 `Employee` 将实例变量 `salary` 声明为 `protected` 而不是 `private`。\n\n```java\n\
  package hormann.employees;\n\npublic class Employee {\n    protected double salary;\n\
  \    ...\n}\n```\n\n与 `Employee` 同包的所有类都可以访问此字段。现在考虑来自不同包的子类：\n\n```java\npackage\
  \ hormann.managers;\n\nimport hormann.employees.Employee;\n\npublic class Manager\
  \ extends Employee {\n    ...\n    public double getSalary() {\n        return salary;\
  \ // 允许访问\n    }\n}\n```\n\n`Manager` 类的方法只能查看 `Manager` 对象的 `salary`。这种限制是为了防止你通过创建子类来滥用保护机制。\n\
  \n当然，`protected` 字段应该谨慎使用。一旦提供，你就无法在不破坏使用它们的类的情况下撤回它们。\n\n保护方法和构造函数更为常见。例如，`Object`\
  \ 类的 `clone` 方法就是保护的，因为使用起来有些复杂（参见第 4.3.4 节）。\n\n在 Java 中，`protected` 授予包级访问，它只保护来自其他包的访问。\n\
  \n### 4.2.4 Sealed 类型\n\n除非类被声明为 final，否则都可以都可以它的子类。如果你想要更多控制呢？例如，假设你需要编写自己的 JSON\
  \ 库，因为现有的没有完全符合你的需求。\n\nJSON 标准规定，JSON 值可以是数组、数字、字符串、布尔值、对象或空。一种明显的方法是使用扩展抽象类 `JSONValue`\
  \ 的 `JSONArray`、`JSONNumber` 等类来对其建模：\n\n```java\npublic abstract class JSONValue\
  \ {\n    // 适用于所有 JSON 值的方法\n}\n\npublic final class JSONArray extends JSONValue\
  \ {\n    ...\n}\n\npublic final class JSONNumber extends JSONValue {\n    ...\n\
  }\n```\n\n通过将 `JSONArray`、`JSONNumber` 等类声明为 `final`，我们可以确保没有人形成子类。但我们无法阻止任何人形成\
  \ `JSONValue` 的另一个子类。\n\n我们为什么可能需要那种控制？考虑这段代码，它使用了带有模式匹配的 `switch` 表达式（参见第 4.5 节）：\n\
  \n```\npublic String type() {\n    return switch (this) {\n        case JSONArray\
  \ j -> \"array\";\n        case JSONNumber j -> \"number\";\n        case JSONString\
  \ j -> \"string\";\n        case JSONBoolean j -> \"boolean\";\n        case JSONObject\
  \ j -> \"object\"; \n        case JSONNull j -> \"null\";\n        // 这里不需要 default\n\
  \    };\n}\n```\n\n\n\n编译器可以检查出不需要 `default` 子句，因为 `JSONValue` 的所有直接子类都已作为分支出现过。\n\
  \n前面的 `type` 方法看起来并不像面向对象。更符合面向对象编程（OOP）精神的做法让六个类中的每一个类都提供自己的 `type` 方法，依赖多态而不是\
  \ `switch`。对于开放的层级结构，这是一个很好的方法。但当类集合是固定的时，将所有备选项放在一个方法中通常更方便。\n\n我们希望编译器知道 `JSONValue`\
  \ 的所有直接子类。这不是一个开放的层级结构。JSON 标准不会改变——即使改变了，我们这些库的实现者也会添加第七个子类。我们不希望其他人扰乱这个类层次结构。\n\
  \n在 Java 中，`sealed`（密封）类控制了哪些类可以扩展它。`sealed`（密封）接口控制了哪些类可以实现它。\n\n以下是如何将 `JSONValue`\
  \ 类声明为密封类的：\n\n```\npublic abstract sealed class JSONValue\n    permits JSONArray,\
  \ JSONNumber, JSONString, JSONBoolean, JSONObject, JSONNull {\n    ...\n}\n```\n\
  \n定义一个未许可的子类是错误的：\n\n```\npublic class JSONComment extends JSONValue { ... } //\
  \ 错误\n```\n\n这正好，因为 JSON 不允许注释。如你所见，密封类型允许对领域约束进行精确建模。\n\n密封类型的所有直接子类型必须在同一个包中。然而，如果你使用了模块（参见\
  \ 12），那么它们必须在同一个模块中。\n\n密封类型可以在不带 `permits` 子句的情况下声明。这时它的所有直接子类型必须声明在同一个文件中。没有该文件访问权限的程序员无法创建子类型。\n\
  \n初看之下，密封类的子类似乎必须是 `final` 的。但对于穷尽性测试，我们只需要知道所有的直接子类。如果这些类有进一步的子类，那并不是问题。例如，我们可以重组织\
  \ JSON 层次结构，如图图 4.1 图 4.1：表示 JSON 值的完整类层次结构\n\n在这个层级结构中，`JSONValue` 允许三个子类：\n\n\
  ```\npublic abstract sealed class JSONValue permits JSONObject, JSONArray, JSONPrimitive\
  \ {\n    ...\n}\n```\n\n`JSONPrimitive` 类也是密封的：\n\n```\npublic abstract sealed class\
  \ JSONPrimitive extends JSONValue\n        permits JSONString, JSONNumber, JSONBoolean,\
  \ JSONNull {\n    ...\n}\n```\n\n密封类的子类必须指定自己是 `sealed`、`final` 还是允许子类的 `open`。在后一种情况下，它必须被声明为\
  \ `non-sealed`（非密封）。\n\n由于 `sealed` 关键字比 Java 语言年轻得多，因此它是“上下文相关的”。它只有在作为类型修饰符使用时才具有意义。你可以声明名为\
  \ `sealed` 的变量或方法：\n\n```\nint sealed = 1; // 将上下文关键字作为标识符可以使用\n```\n\n当然，由于连字符的存在，你不能将\
  \ `non-sealed` 作为标识符。唯一的歧义出现在减法中：\n\n```\nint non = 0;\nnon = non-sealed; // 减法，而不是关键字\n\
  ```\n\n你为什么想要一个 `non-sealed` 子类呢？考虑一个具有六个直接子类的 XML 节点类：\n\n```\npublic abstract\
  \ sealed class Node permits Element, Text, Comment,\n        CDATASection, EntityReference,\
  \ ProcessingInstruction {\n    ...\n}\n```\n\n然而，接下来的 `Element` 类不是密封的，并且允许任意子类：\n\
  \n```\npublic non-sealed class Element extends Node { ... }\npublic class HTMLDivElement\
  \ extends Element { ... }\npublic class HTMLImgElement extends Element { ... }\n\
  ...\n```\n\n本节的示例展示了如何使用密封类。接口也可以是密封的。Record 和枚举不能被扩展，因此不能被密封。但它们可以扩展密封接口。\n\n###\
  \ 4.2.5 继承和默认方法\n\n假设一个类扩展另一个类并实现了一个接口，两者恰好有一个同名的方法。\n\n```\npublic interface Named\
  \ {\n    default String getName() { return \"\"; }\n}\n\npublic class Person {\n\
  \    ...\n    public String getName() { return name; }\n}\n\npublic class Student\
  \ extends Person implements Named {\n    ...\n}\n```\n\n在这种情况下，父类的实现总是优于接口实现。子类不需要解决冲突。\n\
  \n相比之下，正如你在 3 中看到的，当从两个接口继承相同的默认方法时，你必须解决冲突。\n\n“类胜出”规则确保了兼容性。如果你向接口添加了默认方法，它对在没有默认方法之前就能运行的代码没有影响。\n\
  \n## 4.3 Object：宇宙基类\n\nJava 中的每个类都直接或间接地扩展 `Object` 类。当一个类没有显式的父类时，它隐式地扩展 `Object`。例如，\n\
  \n```\npublic class Employee { ... }\n```\n\n等同于\n\n```\npublic class Employee extends\
  \ Object { ... }\n```\n\n`Object` 类定义了适用于任何 Java 对象的方法（参见表 4.1）。我们将在接下来的章节中详细检查其中的几个方法。\n\
  \n数组是类。因此，将数组（即使是基本类型数组）转换为 `Object` 引用是合法的。\n\n表 4.1：`java.lang.Object` 类的方法\n\n\
  | 方法 | 说明 |\n| --- | --- |\n| `String toString()` | 返回对象的字符串表示，默认是类的名称。 |\n| `boolean\
  \ equals(Object other)` | 如果此对象被认为与 `other` 相等，则返回 `true`；如果 `other` 为 `null` 或不同于\
  \ `other`，则返回 `false`。 |\n| `int hashCode()` | 获取对象的哈希码。除非重写，否则哈希码由虚拟机分配。 |\n| `Class<?>\
  \ getClass()` | 返回描述所属类的 `Class` 对象。 |\n| `protected Object clone()` | 创建此对象的拷贝。默认情况下，拷贝是浅的。\
  \ |\n| `protected void finalize()` | 当此对象被垃圾回收器回收时调用。不要重写它。 |\n| `wait`, `notify`,\
  \ `notifyAll` | 参见 10。 |\n\n### 4.3.1 toString 方法\n\n`Object` 类中的一个重要方法是 `toString`\
  \ 方法，它返回对象的字符串描述。例如，`Point` 类的 `toString` 方法返回如下字符串：\n\n```\njava.awt.Point[x=10,y=20]\n\
  ```\n\n许多 `toString` 方法遵循这种格式：类名，后面跟着方括号内的实例变量。以下是 `Employee` 类 `toString` 方法的此类实现：\n\
  \n```\npublic String toString() {\n    return getClass().getName() + \"[name=\"\
  \ + name + \",salary=\" + salary \"]\";\n}\n```\n\n通过调用 `getClass().getName()` 而不是硬编码字符串\
  \ `\"Employee\"`，该方法对于子类也是正确的。\n\n在子类中，调用 `super.toString()` 并添加子类的实例变量，放在单独的一对括号中：\n\
  \n```\npublic class Manager extends Employee {\n    ...\n    public String toString()\
  \ {\n        return super.toString() + \"[bonus=\" + bonus + \"]\";\n    }\n}\n\
  ```\n\n每当对象与字符串连接在一起时，Java 编译器会自动调用该对象的 `toString` 方法。例如：\n\n```\nvar pos = new\
  \ Point(10, 20);\nString message = \"The current position is \" + pos;\n    // 与\
  \ pos.toString() 拼接\n```\n\n与其写 `x.toString()`，你也可以写 `\"\" + x`。即使 `x` 是 `null`\
  \ 或基本类型值，该表达式也有效。\n\n\n\n\n\n`Object` 类定义了 `toString` 方法用于打印类名和哈希码（参见第 4.3.3 节）。例如，调用\n\
  \n```\nSystem.out.println(System.out)\n```\n\n会产生类似于 `java.io.PrintStream@2f6684`\
  \ 的输出，因为 `PrintStream` 类的实现者没有费心重写 `toString` 方法。\n\n数组从 `Object` 继承了 `toString`\
  \ 方法，不同之处在于数组类型是以一种过时的格式打印的。例如，如果你有如下数组：\n\n```\nint[] primes = { 2, 3, 5, 7, 11,\
  \ 13 };\n```\n\n那么 `primes.toString()` 会产生类似 `\"[I@1a46e30\"` 的字符串。前缀 `[I` 表示这是一个整数数组。\n\
  \n补救办法是调用 `Arrays.toString(primes)`，这将产生字符串 `\"[2, 3, 5, 7, 11, 13]\"`。要正确打印多维数组（即数组的数组），请使用\
  \ `Arrays.deepToString`。\n\n### 4.3.2. `equals` 方法\n\n`equals` 方法测试一个对象是否被认为与另一个相等。在\
  \ `Object` 类中实现的 `equals` 方法判断两个对象引用是否相同（identity）。这是一个非常合理的默认值——如果两个对象是相同的，那么它们一定是相等的。对于许多类来说，不需要进行其他操作。例如，比较两个\
  \ `Scanner` 对象的相等性并没有意义。\n\n仅在基于状态的相等性测试时才重写 `equals` 方法，即当两个对象具有相同内容时，认为它们是相等。例如，`String`\
  \ 类重写了 `equals` 来检查两个字符串是否由相同的字符组成。\n\n每当你重写 `equals` 方法时，必须提供一个兼容的 `hashCode` 方法——参见第\
  \ 4.3.3 节。\n\n假设我们认为如果两个 `Item` 类的对象的描述和价格匹配，则它们是相等的。以下是你可以实现 `equals` 方法的方法：\n\n\
  ```\npublic class Item {\n    private String description;\n    private double price;\n\
  \    ...\n    public boolean equals(Object otherObject) {\n        // 如果参数为 null，必须返回\
  \ false\n        if (otherObject == null) return false;\n        // 检查 otherObject\
  \ 是否为 Item\n        if (getClass() != otherObject.getClass()) return false;\n  \
  \      // 测试实例变量是否具有相同的值\n        var other = (Item) otherObject;\n        return\
  \ Objects.equals(description, other.description)\n            && price == other.price;\n\
  \    }\n\n    public int hashCode() { ... } // 参见第 4.3.3 节\n}\n```\n\n在 `equals`\
  \ 方法中你需要经过一些常规步骤：\n\n1. 相等的对象通常是相同的，而这种测试的开销很小。\n2. 每个 `equals` 方法在与 `null` 比较时必须返回\
  \ `false`。\n3. 由于 `equals` 方法重写了 `Object.equals`，其参数类型为 `Object`，你需要将其强制转换为实际类型，以便查看其实例变量。在此之前，请进行类型检查，可以使用\
  \ `getClass` 方法或 `instanceof` 操作符。\n4. 最后，比较实例变量。对于基本类型使用 `==`。然而，对于 `double` 值，如果你担心\
  \ ±∞ 或 NaN，请使用 `Double.equals`。对于对象，使用 `Objects.equals`，这是 `equals` 方法的一个空安全版本。`Objects.equals(x,\
  \ y)` 在 `x` 为 `null` 时返回 `false`，而 `x.equals(y)` 会抛出异常。\n\n如果你的实例变量是数组，请使用静态方法 `Arrays.equals`\
  \ 来检查数组长度相等以及相应的数组元素是否相等。\n\n在过去，在每个 `equals` 方法的开头添加一个“快速测试”被认为是良好的做法：\n\n```\n\
  if (this == otherObject) return true;\n```\n\n然而，在现代 CPU 上，分支行为的性能可能比简单比较实例变量要低得多。\n\
  \n当你为子类定义 `equals` 方法时，先调用父类的 `equals`。如果该测试没有通过，则这些对象就不可能相等。如果父类的实例变量相等，那么你就可以比较子类的实例变量了。\n\
  \n```\npublic class DiscountedItem extends Item {\n    private double discount;\n\
  \    ...\n    public boolean equals(Object otherObject) {\n        if (!super.equals(otherObject))\
  \ return false;\n        var other = (DiscountedItem) otherObject;\n        return\
  \ discount == other.discount;\n    }\n\n    public int hashCode() { ... }\n}\n```\n\
  \n注意，如果 `otherObject` 不是 `DiscountedItem`，父类中的 `getClass` 测试将失败。\n\n当比较属于不同类的值时，`equals`\
  \ 方法应该如何表现？这是一个存在争议的领域。在前面的示例中，如果类不完全匹配，`equals` 方法将返回 `false`。但许多程序员使用 `instanceof`\
  \ 测试来代替：\n\n```\nif (!(otherObject instanceof Item)) return false;\n```\n\n这留下了\
  \ `otherObject` 可能属于子类的可能性。例如，你可以比较一个 `Item` 和一个 `DiscountedItem`。\n\n然而，`hashCode`\
  \ 和 `equals` 方法必须兼容：如果 `x.equals(y)`，则必须 `x.hashCode() == y.hashCode()`。\n\n###\
  \ 4.3.3. `hashCode` 方法\n\n*哈希码*（hash code）是一个派自对象的整数。哈希码应该是随机分布的——如果 `x` 和 `y` 是两个不等的对象，那么\
  \ `x.hashCode()` 和 `y.hashCode()` 有很大概率不同。例如，`\"Mary\".hashCode()` 是 2390779，而 `\"\
  Myra\".hashCode()` 是 2413819。\n\n`String` 类使用以下算法计算哈希码：\n\n```\nint hash = 0;\n\
  for (int i = 0; i < length(); i++)\n    hash = 31 * hash + charAt(i);\n```\n\n`hashCode`\
  \ 和 `equals` 方法必须兼容：如果 `x.equals(y)`，则必须 `x.hashCode() == y.hashCode()`。正如你所看到的，`String`\
  \ 类确实如此，因为字符相同的字符串产生相同的哈希码。\n\n`Object.hashCode` 方法以依赖实现的方式派生哈希码。它可以派自对象的内存位置，或者与对象一起缓存的数字（顺序或伪随机的），或者是两者的结合。由于\
  \ `Object.equals` 测试的是相同对象，唯一重要的是相同的对象必须具有相同的哈希码。\n\n如果你重定义了 `equals` 方法，你还需要重定义\
  \ `hashCode` 方法以与 `equals` 兼容。如果你这样做，并且用户将类对象插入哈希集合或哈希映射，他们可能会迷路！\n\n\n\n\n\n在你的\
  \ `hashCode` 方法中，只需将实例变量的哈希值组合起来。例如，这里是 `Item` 类的 `hashCode` 方法：\n\n```\nclass Item\
  \ {\n    ...\n    public int hashCode() {\n        return Objects.hash(description,\
  \ price);\n    }\n}\n```\n\n`Objects.hash` 变长参数方法计算参数的哈希值并将它们组合。该方法是空安全的。\n\n如果你的类实例变量是数组，请先使用静态\
  \ `Arrays.hashCode` 方法计算它们的哈希值，并将结果传递给 `Objects.hash`。\n\n在接口中，你无法重写 `Object` 类的默认方法（`toString`、`equals`\
  \ 或 `hashCode`）。根据“类胜出”规则（参见 4.2），这种方法永远不会。\n\n### 4.3.4. 克隆 (Cloning)\n\n你刚刚看到了\
  \ `Object` 类中经常被重写的“三大”方法：`toString`、`equals` 和 `hashCode`。在本节中，你将学习如何重写 `clone`\
  \ 方法。正如你所看到的，这是复杂的，而且 `hashCode` 也很少必要。除非你有充分的理由，否则低于 5%的类会实现 `clone`。\n\n`clone`\
  \ 方法的目的是创建对象的克隆——创建一个与原始对象状态相同的对象。如果你修改了其中一个对象，另一个保持不变。\n\n```\nEmployee cloneOfFred\
  \ = fred.clone();\ncloneOfFred.raiseSalary(10); // unchanged\n```\n\n`clone` 方法在\
  \ `Object` 类中声明为 `protected`，所以如果你希望类的用户能够进行克隆，就必须重写它。\n\n`Object.clone` 方法执行浅拷贝。它只是将所有实例变量复制到克隆对象中。如果变量是原始类型或不可变的，那是可以。但如果不是，原始对象和克隆对象将共享状态，这可能会导致问题。\n\
  \n考虑一个拥有 `recipients` 列表的类：\n\n```java\nfinal class Message {\n    private String\
  \ sender;\n    private ArrayList<String> recipients;\n    private String text;\n\
  \    ...\n    public void addRecipient(String recipient) { ... };\n}\n```\n\n如果你对\
  \ `Message` 对象进行浅拷贝，原始对象和克隆对象将共享 `recipients` 列表（参见图 4.2）：\n\n```\nMessage specialOffer\
  \ = ...;\nMessage cloneOfSpecialOffer = specialOffer.clone();\n```\n\n对象的对象的浅拷贝\n\
  \n如果一个对象更改了列表，更改将反映在另一个对象上。因此，`Message` 类需要重写 `clone` 方法来执行深拷贝。\n\n克隆可能不可能或不值得尝试。例如，克隆一个\
  \ `Scanner` 对象非常有挑战性。\n\n通常，在实现类时，你需要决定：\n\n1. 你不想提供 `clone` 方法；\n2. 继承自 `clone`\
  \ 方法是可以的；\n3. `clone` 方法应该执行深拷贝。\n\n对于第一个选项，只需什么都不做。你的类将继承 `clone` 方法，但类的用户无法调用它，因为它是\
  \ `protected`。\n\n要选择第二个选项，你的类必须实现 `Cloneable` 接口。这是一个没有任何方法的接口，被称为标记接口（marker interface）（记住\
  \ `clone` 方法定义在 `Object` 类中）。`Object.clone` 方法在执行浅拷贝之前会检查该接口是否已实现，否则将抛出 `CloneNotSupportedException`。\n\
  \n你还会想要将 `clone` 的范围从 `protected` 提升到 `public` 并更改返回类型。\n\n最后，你需要处理 `CloneNotSupportedException`。这是一个检查异常，正如你在\
  \ 5 中看到的，你必须声明它或捕获它。如果你的类是 `final` 的，你可以捕获它。否则，声明该异常，因为子类可能再次想要抛出它。\n\n```java\n\
  public class Employee implements Cloneable {\n    ...\n    public Employee clone()\
  \ throws CloneSupportedException {\n        return (Employee) super.clone();\n \
  \   }\n}\n```\n\n转换 `(Employee)` 是必要的，因为 `Object.clone` 的返回类型是 `Object`。\n\n实现 `clone`\
  \ 方法的第三种选项即类需要执行深拷贝是最复杂的情况。你完全不需要使用 `Object.clone` 方法。这里是 `Message.clone` 的简单实现：\n\
  \n```java\npublic Message clone() {\n    var cloned = new Message(sender, text);\n\
  \    cloned.recipients = new ArrayList<>(recipients);\n    return cloned;\n}\n```\n\
  \n或者，你可以对父类和可变的实例变量调用 `clone`。\n\n`ArrayList` 类实现了 `clone` 方法，产生浅拷贝。也就是说，原始列表和克隆列表共享元素引用。在我们的案例中是可以的，因为元素是字符串。如果不是，我们必须也克隆每个元素。\n\
  \n然而，由于历史原因，`ArrayList.clone` 方法的返回类型是 `Object`。你需要使用转换。\n\n```java\ncloned.recipients\
  \ = (ArrayList<String>) recipients.clone(); // Warning\n```\n\n遗憾的是，正如你在 6 中看到的，该转换无法在编译时完全检查，你会得到一个警告。你可以使用注解来抑制警告，但该注解只能附加在声明上（参见\
  \ 11).这里是完整的实现：\n\n```java\npublic Message clone() {\n    try {\n        Message\
  \ cloned = (Message) super.clone();\n        @SuppressWarnings(\"unchecked\") var\
  \ clonedRecipients \n            = (ArrayList<String>) recipients.clone();\n   \
  \     cloned.recipients = clonedRecipients;\n        return cloned;\n    } catch\
  \ (CloneNotSupportedException ex) {\n        return null; // Can’t happen\n    }\n\
  }\n```\n\n在这种情况下，`CloneNotSupportedException` 不会发生，因为 `Message` 类是 `Cloneable` 且\
  \ `final`，`ArrayList.clone` 不抛出该异常。\n\n数组有公共的 `clone` 方法，其返回类型与数组类型相同。例如，如果 `recipients`\
  \ 是数组而不是列表，你可以这样克隆它：\n\n```\ncloned.recipients = recipients.clone(); // 不需要转换\n\
  ```\n\n## 4.4. 枚举 (Enumerations)\n\n你在 1 中见过如何定义枚举。这里有一个典型的示例，定义了四个实例：\n\n```\n\
  public enum Size { SMALL, MEDIUM, LARGE, EXTRA_LARGE };\n```\n\n在接下来的章节中，你将学习如何使用枚举。\n\
  \n### 4.4.1. 枚举的方法\n\n由于枚举类型的每个实例都是唯一的，你永远不需要为枚举值使用 `equals` 方法。只需使用 `==` 来比较它们。（如果你喜欢，也可以调用\
  \ `equals` 来代替 `==` 测试。）\n\n你也不需要提供 `toString` 方法。系统会自动提供该方法以获取枚举对象的名称——在我们的例子中，为\
  \ `\"SMALL\"`、`\"MEDIUM\"` 等。\n\n`toString` 的反操作是静态 `valueOf` 方法，它是为每个枚举类型生成的。例如，语句：\n\
  \n```\nSize notMySize = Size.valueOf(\"SMALL\");\n```\n\n如果没有同名的实例，`valueOf` 方法将抛出异常。\n\
  \n每个枚举类型都有一个静态 `values` 方法，返回包含所有实例的数组，按照它们声明的顺序排列。调用\n\n```\nSize[] allValues =\
  \ Size.values();\n```\n\n返回一个包含 `Size.SMALL`、`Size.MEDIUM` 等元素的数组。\n\n\n\n\n使用此方法可以在增强\
  \ `for` 循环中遍历枚举类型的所有实例：\n\n```java\nfor (Size s : Size.values()) { System.out.println(s);\
  \ }\n```\n\n`ordinal()` 方法返回实例在 `enum` 声明中的位置，从零开始计数。例如，`Size.MEDIUM.ordinal()`\
  \ 返回 `1`。当然，使用此方法时需要小心。如果插入了新的常量，值将会发生偏移。\n\n每个枚举类型 `E` 都会自动实现 `Comparable<E>`，允许仅与其自身的对象进行比较。比较是通过序数（ordinal）值进行的。\n\
  \n技术上讲，枚举类型 `E` 继承自 `Enum<E>` 类，并继承了 `compareTo` 方法以及本节描述的其他方法。表 4.2 显示了 `Enum`\
  \ 类的方法。\n\n#### 表 4.2：`java.lang.Enum<E>` 类的方法\n\n| 方法 | 描述 |\n| --- | --- |\n|\
  \ `String toString()` `String name()` | 此实例的名称，如在 `enum` 声明中提供的提供的。`name` 方法是 `final`\
  \ 的。 |\n| `int ordinal()` | 此实例在 `enum` 声明中的位置。 |\n| `int compareTo(Enum<E> other)`\
  \ | 通过序数值将此实例与 `other` 进行比较。 |\n| `static T valueOf(Class<T> type, String name)`\
  \ | 返回给定名称的实例。考虑使用枚举类型生成的 `valueOf` 或 `values` 方法。 |\n| `Class<E> getDeclaringClass()`\
  \ | 获取定义实例的类。（如果实例有方法体，则与 `getClass()` 不同。） |\n| `int hashCode()` | 调用相应的 `Object`\
  \ 方法。 |\n| `protected Object clone()` | 抛出 `CloneNotSupportedException`。 |\n\n###\
  \ 4.4.2. 构造方法、方法和字段\n\n如果你愿意，可以为枚举类型添加构造方法、方法和字段。这是一个示例：\n\n```java\npublic enum\
  \ Size {\n    SMALL(\"S\"), MEDIUM(\"M\"), LARGE(\"L\"), EXTRA_LARGE(\"XL\");\n\n\
  \    private String abbreviation;\n\n    Size(String abbreviation) {\n        this.abbreviation\
  \ = abbreviation;\n    }\n\n    public String getAbbreviation() { return abbreviation;\
  \ }\n}\n```\n\n枚举的每个实例都保证只被构造一次。\n\n枚举的构造方法始终是私有的（private）。你可以像前面的示例一样省略 `private`\
  \ 修饰符。将枚举构造方法声明为 `public` 或 `protected` 是语法错误。\n\n### 4.4.3. 实例体\n\n你可以为每个单独的 `enum`\
  \ 实例添加方法，但它们必须覆盖在枚举中定义的方法。例如，为了实现一个计算器，你可以这样做：\n\n```java\npublic enum Operation\
  \ {\n    ADD {\n        public int eval(int arg1, int arg2) { return arg1 + arg2;\
  \ }\n    },\n    SUBTRACT {\n        public int eval(int arg1, int arg2) { return\
  \ arg1 - arg2; }\n    },\n    MULTIPLY {\n        public int eval(int arg1, int\
  \ arg2) { return arg1 * arg2; }\n    },\n    DIVIDE {\n        public int eval(int\
  \ arg1, int arg2) { return arg1 / arg2; }\n    };\n\n    public abstract int eval(int\
  \ arg1, int arg2);\n}\n```\n\n在计算器程序的循环中，人们会根据用户输入将变量设置为这些值之一，然后调用 `eval`：\n\n```java\n\
  Operation op = ...;\nint result = op.eval(first, second);\n```\n\n技术上讲，这些常量中的每一个都属于\
  \ `Operation` 的匿名子类。任何你可以放入匿名子类体的内容，也可以添加到成员的体中。\n\n### 4.4.4. 静态成员\n\n枚举拥有静态成员是合法的。但是，你必须小心构造顺序。枚举常量是在静态成员*之前*构造的，因此不能在枚举构造方法中引用任何静态成员。例如，以下代码是非合法的：\n\
  \n```java\npublic enum Modifier {\n    PUBLIC, PRIVATE, PROTECTED, STATIC, FINAL,\
  \ ABSTRACT;\n    private static int maskBit = 1;\n    private int mask;\n    Modifier()\
  \ {\n        mask = maskBit; // 错误—无法在构造方法中访问静态变量\n        maskBit *= 2; \n    }\n\
  \    ...\n}\n```\n\n解决办法是在静态初始化器中进行初始化：\n\n```java\npublic enum Modifier {\n   \
  \ PUBLIC, PRIVATE, PROTECTED, STATIC, FINAL, ABSTRACT;\n    private int mask;\n\n\
  \    static {\n        int maskBit = 1;\n        for (Modifier m : Modifier.values())\
  \ {\n            m.mask = maskBit;\n            maskBit *= 2; \n        }\n    }\n\
  \    ...\n}\n```\n\n一旦常量构造完成，静态变量初始化和静态初始化器将按照通常从上到下的方式运行。\n\n枚举可以嵌套在类内部。这种嵌套枚举是隐式的静态嵌套类——也就是说，它们的方法不能引用外部类的实例变量。\n\
  \n### 4.4.5. 对枚举进行 switch 操作\n\n你可以在 `switch` 表达式或语句中使用枚举常量。\n\n```java\nenum Operation\
  \ { ADD, SUBTRACT, MULTIPLY, DIVIDE };\n\npublic static int eval(Operation op, int\
  \ arg1, int arg2) {\n    return switch (op) {\n        case ADD -> arg1 + arg2;\n\
  \        case SUBTRACT -> arg1 - arg2;\n        case MULTIPLY -> arg1 * arg2;\n\
  \        case DIVIDE -> arg1 / arg2;\n    };\n}\n```\n\n注意，如果你为枚举的所有实例提供了分支，则不需要\
  \ `default` 情况。\n\n枚举类型可以嵌套在类内部。这种嵌套枚举是隐式的静态嵌套类——也就是说，它们的方法不能引用外部类的实例变量。\n\n你可以在\
  \ `switch` 表达式或语句中使用枚举常量。\n\n```java\nenum Operation { ADD, SUBTRACT, MULTIPLY,\
  \ DIVIDE };\n\npublic static int eval(Operation op, int arg1, int arg2) {\n    return\
  \ switch (op) {\n        case ADD -> arg1 + arg2;\n        case SUBTRACT -> arg1\
  \ - arg2;\n        case MULTIPLY -> arg1 * arg2;\n        case DIVIDE -> arg1 /\
  \ arg2;\n    };\n}\n```\n\n如果你想在 `switch` 语句中使用简单名称代替 `Size.SMALL`，可以使用静态导入。例如，使用\n\
  \n```java\nimport static comhorstmann.corejava.Size.*;\n\nSize s = ...;\nint = switch\
  \ (s) {\n    case SMALL -> 1;\n    case MEDIUM -> 2;\n    case LARGE -> 3;\n   \
  \ case EXTRA_LARGE -> 4;\n}\n```\n\n注意，如果你为枚举的所有实例提供了分支，则不需要 `default` 情况。\n\n##\
  \ 4.5. 模式匹配\n\n你已经看到如何使用 `instanceof` 运算符检查对象是否具有特定类型。“模式匹配”形式的 `instanceof` 会声明一个匹配类型的变量：\n\
  \n```java\nEmployee e = ...;\nString description;\nif (e instanceof Executive exec)\n\
  \    description = \"An executive with a title of \" + exec.getTitle();\nelse if\
  \ (e instanceof Manager mgr)\n    description = \"A manager with a bonus of \" +\
  \ mgr.getBonus();\nelse\n    description = \"A lowly employee with a salary of \"\
  \ + e.getSalary();\n```\n\n`switch` 使用 *类型模式* 简化了这段代码：\n\n```java\nEmployee e =\
  \ ...;\nString description = switch (e) {\n    case Executive exec -> \"An executive\
  \ with a title of \" + exec.getTitle();\n    case Manager mgr -> \"A manager with\
  \ a bonus of \" + mgr.getBonus();\n    default -> \"A lowly employee with a salary\
  \ of \" + e.getSalary();\n};\n```\n\n注意，每个类型模式都声明了一个匹配类型的变量。你使用这些变量来访问类方法（例如示例中的\
  \ `getTitle`）。\n\n你必须在类型名称后有一个变量，即使你不需要它。作为 Java 21 的一项预览功能，在这种情况下可以使用下划线作为*未命名变量*：\n\
  \n```java\ncase Employee _\n```\n\n如果你不想依赖预览功能，只需使用两个下划线：\n\n```java\ncase Employee\
  \ __\n```\n\n使用 `switch` 表达式形式比链式 `if` 语句简单。`switch` 表达式产生一个值并赋值给 `description`\
  \ 变量。相比之下，使用 `instanceof` 时，每个条件分支必须单独设置 `description` 值。\n\n你可以在 `switch` 语句和穿透（fallthrough）形式中使用类型模式。但不带穿透的表达式形式通常是更自然的选择。\n\
  \n### 4.5.1. 记录模式\n\n前面的示例展示了*类型模式*。如果类型匹配，对象将绑定到该类型的变量上。当类型是 `record` 时，你可以做得更好，声明绑定到组件的变量。这被称为\
  \ *记录模式*：\n\n\n\n\n\n```\nrecord Point(double x, double y) {}\nPoint p = ...;\n\
  double slope = switch (p) {\n    case Point(var a, var b) -> b / a;\n};\n```\n\n\
  现在 `a` 和 `b` 被绑定到了 `p` 的 `x` 和 `y` 组件。当然，你也可以调用 `p.x()` 和 `p.y()`，但记录模式可以更加简洁。\n\
  \n为了增加清晰度，你还可以为引入的变量指定显式类型：\n\n```\ncase Point(double a, double b)\n```\n\n记录模式是可以嵌套的：\n\
  \n```\nrecord Circle(Point center, double radius) {}\nCircle c = ...;\nswitch (c)\
  \ {\n    case Circle(Point(var a, var b), var r) -> ...\n}\n```\n\n### 4.5.2. 守卫\
  \ (Guards)\n\n你可以为模式添加一个条件，称为*守卫*，通过使用受限的 `when` 关键字。\n\n```\ncase Executive exec\
  \ when exec.getTitle().getLength() >= 20 ->\n   \"An executive with an impressive\
  \ title\";\n```\n\n在守卫表达式中，你可以使用模式引入的变量。\n\n如果守卫表达式未满足，则该 case 不会被选中，并测试下一个 case。\n\
  \n如果在 `when` 子句中发生异常，`switch` 将抛出该异常。\n\n守卫在记录模式中特别有用：\n\n```\nPoint p = ...;\n\
  String description = switch (p) {\n    case Point(var x, var y) when x == 0 && y\
  \ == 0 -> \"origin\";\n    case Point(var x, var __) when x == 0 -> \"on x-axis\"\
  ;\n    case Point(var __, var y) when y == 0 -> \"on y-axis\";\n    default -> \"\
  not on either axis\";\n};\n```\n\n记录模式会调用组件访问器。在其中一个访问器抛出异常的罕情况下，`switch` 将抛出 `MatchException`。这只发生在自定义访问器上。\n\
  \n### 4.5.3. 空值处理 (Null Handling)\n\n经典的 `switch` 语句是对 `null` 敌的。如果选择器表达式为 `null`，`switch`\
  \ 将抛出 `NullPointerException`。你可以通过添加一个 `case null` 来避免这种情况：\n\n```\nString description\
  \ = switch (e) {\n    case Executive exec -> \"An executive with a title of \" +\
  \ exec.getTitle();\n    case Manager mgr -> \"A manager with a bonus of \" + mgr.getBonus();\n\
  \    case null -> \"No employee\";\n    default -> \"A lowly employee with a salary\
  \ of \" + e.getSalary();\n};\n```\n\n你可以将 `case null` 与 `default` ，但不能与其他任何 case\
  \ ：\n\n```\ncase null, default -> \"No free parking\";\n```\n\n### 4.5.4. 穷尽性 (Exhaustiveness)\n\
  \n任何 `switch` *表达式*必须是*穷尽的*：对于每个可能的选择器值都必须有一个 case。这是一个显而易见的要求，因为表达式必须产生一个值。\n\n\
  `switch` 达到穷尽有几种方法：\n\n*   针对 `enum` 的每个实例的 case\n*   覆盖密封类型（sealed type）所有子类型的无守卫类型模式\n\
  *   选择器类型的无守卫类型模式\n*   `default` 子句\n\n守卫模式不能用于穷尽性检查，因为编译器无法评估它们。例如，\n\n```\ncase\
  \ Executive exec when exec.getTitle().getLength() >= 20 -> ...\ncase Executive exec\
  \ when exec.getTitle().getLength() < 20 -> ...\n```\n\n不是穷尽的。你需要将第二个子句重写为\n\n```\n\
  case Executive exec -> ...\n```\n\n或者\n\n```\ndefault -> ...\n```\n\n当密封类型层次结构或枚举类被修改时，之前穷尽的\
  \ `switch` 可能会变成非穷尽的。如果没有 case 匹配，`switch` 将抛出 `MatchException`。\n\n经典的 `switch`\
  \ *语句*不需要是穷尽的。如果没有 case 匹配，则不执行任何操作。但为了更高的清晰，所有*增强型* `switch` 语句必须是穷尽的。如果 `switch`\
  \ 语句具有模式、`case null`、`case null` 或不是 `char`、`byte`、`short`、`int`、`Character`、`Byte`、`Short`、`Integer`、`String`\
  \ 或枚举的选择类型，就是增强型的。\n\n如果你不想在没有匹配时什么都不做，请添加\n\n```\ndefault -> {} // No fallthrough\n\
  ```\n\n或者\n\n```\ndefault: break; // Fallthrough\n```\n\n测试选择器值是否为 `null` 对于穷尽性不是强制要求的。你可以有一个没有\
  \ `case null` 的穷尽 `switch`。当用 `null` 选择器调用时，它会抛出 `NullPointerException`。\n\n对于嵌套记录，缺乏针对穷尽性的\
  \ `null` 检查是有问题的。考虑\n\n```\nrecord Box<T>(T contents) { }\n\nBox<Box<String>> doubleBoxed\
  \ = ...;\nString unboxed = switch (doubleBoxed) {\n    case Box(Box(String s)) ->\
  \ s;\n};\n```\n\n如果 `doubleBoxed` 是 `null`，`switch` 将抛出 `NullPointerException`。相反，如果\
  \ `doubleBoxed` 是 `new Box<>(new Box<>(null))`，则表达式的结果为 `null`。\n\n然而，如果 `doubleBoxed`\
  \ 使用 `new Box<>(null)` 初始化，就会发生 `MatchException`。本应该有一个这样的 case\n\n```\ncase Box(b)\
  \ where b == null\n```\n\n但穷尽性检查器忽略了 `null`。\n\n### 4.5.5. 优势性 (Dominance)\n\n针对穷尽性的缺乏\
  \ `null` 检查对于嵌套记录是有问题的。考虑\n\n```\nrecord Box<T>(T contents) { }\n\nBox<Box<String>>\
  \ doubleBoxed = ...;\nString unboxed = switch (doubleBoxed) {\n    case Box(Box(String\
  \ s)) -> s;\n};\n```\n\n如果 `doubleBoxed` 是 `null`，`switch` 将抛出 `NullPointerException`。相反，如果\
  \ `doubleBoxed` 是 `new Box<>(new Box<>(null))`，则表达式的结果为 `null`。\n\n然而，如果 `doubleBoxed`\
  \ 使用 `new Box<>(null)` 初始化，就会发生 `MatchException`。穷尽性检查器忽略了 `null`。\n\n### 4.5.6.\
  \ 模式与常量\n\n不能在记录模式中匹配常量。例如，\n\n```\ncase Point(0, y) // ERROR\n```\n\n是错误的。使用守卫：\n\
  \n```\ncase Point(x, y) when x == 0 // Ok\n```\n\n数值常量模式仅允许选择类型为 `int`、`short`、`char`\
  \ 或 `byte` 以及它们的包装类型时。字符串常量模式仅允许用于 `String` 类型。例如，以下是不合法的：\n\n```\nObject obj =\
  \ ...;\nString description = switch (obj) {\n    case 0 -> \"zero\"; // ERROR\n\
  \    case \"\" -> \"empty string\"; // ERROR\n    case null -> \"null\";\n    default\
  \ -> obj.toString();\n};\n```\n\n由于选择类型是 `Object`，`switch` 不能具有数值或字符串常量模式。补救措施是\n\
  \n```\ncase Integer i when i == 0\ncase String s when s.equals(\"null\")\n```\n\n\
  对于 `enum` 常量的规则不同。选择类型只需要是枚举类型的超类型；即 `Object`、`Enum` 或接口：\n\n```\nObject obj = ...;\n\
  String description = switch (obj) {\n    case DayOfWeek.FRIDAY -> \"TGIF\"; // Ok\n\
  \    ...\n};\n```\n\n### 4.6. 运行时类型信息和资源\n\n在 Java 中，你可以在运行时确定对象属于哪个类。这有时很有用，例如在实现\
  \ `equals` 和 `toString` 方法时。此外，你还可以发现类是如何加载的，并加载与之相关的数据，称为*资源*。\n\n### 4.6.1. `Class`\
  \ 类\n\n假设你有一个 `Object` 类型的变量，填充了某些对象引用，你想知道更多关于该对象的信息，例如它属于哪个类。\n\n`getClass` 方法产生一个意料之中的名为\
  \ `Class` 类的对象。\n\n```\nObject obj = ...;\nClass<?> cl = obj.getClass();\n```\n\n\
  \n\n请参见 6 获取关于 `<?>` 后缀的解释。目前，只需忽略它即可。但不要省略它。如果你省略了它，不仅你的 IDE 会给出一个难看的警告，还会关闭涉及该变量的表达式中的有用类型检查。\n\
  \n一旦你有了一个 `Class` 对象，就可以获取类名：\n\n```java\nSystem.out.println(\"This object is an\
  \ instance of \" + cl.getName());\n```\n\n或者，你也可以使用静态方法 `Class.forName` 来获取 `Class`\
  \ 对象：\n\n```java\nString className = \"java.util.Scanner\";\nClass<?> cl = Class.forName(className);\n\
  // 一个描述 java.util.Scanner 类的对象\n```\n\n`Class.forName` 方法以及许多其他用于反射的方法在出现问题时会抛出受检异常（checked\
  \ exceptions）（例如，当没有指定名称类时）。目前，请在调用方法上标记 `throws ReflectiveOperationException`。你将在\
  \ 5 中看到如何处理该异常。\n\n`Class.forName` 方法用于为编译时可能未知的类构造 `Class` 对象。如果你预先知道想要哪个类，请使用*类字面量*（class\
  \ literal）：\n\n```java\nClass<?> cl = java.util.Scanner.class;\n```\n\n`.class`\
  \ 后缀也可以用于获取其他类型的信息：\n\n```java\nClass<?> cl2 = String[].class; // 描述数组类型 String[]\n\
  Class<?> cl3 = Runnable.class; // 描述 Runnable 接口 \nClass<?> cl4 = int.class; //\
  \ 描述 int 类型\nClass<?> cl5 = void.class; // 描述 void 类型\n```\n\n数组在 Java 中是类，但接口、基本数据类型和\
  \ `void` 不是。`Class` 这个名字有点不太幸运——用 `Type` 会更准确。\n\n`getName` 方法为数组类型返回了奇异的名字：\n\n\
  *   `String[].class.getName()` 返回 `\"[Ljava.lang.String;\"`\n*   `int[].class.getName()`\
  \ 返回 `\"[I\"`\n\n这种表示法自虚拟机远古时代起一直使用。请使用 `getCanonicalName` 来获取如 `\"java.lang.String[]\"\
  ` 和 `\"int[]\"` 之类的名称。如果你想为数组生成 `Class` 对象，则需要在使用 `Class.forName` 方法时使用这种表示法。\n\n\
  虚拟机为每个类型管理一个唯一的 `Class` 对象。因此，你可以使用 `==` 运算符来比较类对象。例如：\n\n```java\nif (other.getClass()\
  \ == Employee.class) ...\n```\n\n你已经在 第 4.3.2 节 中见过这种类对象的用法。\n\n在接下来的章节中，你将看到对 `Class`\
  \ 对象可以的操作。请参见 表 4.3 获取有用方法的总结。\n\n#### 表 4.3：`java.lang.Class<T>`类的有用方法\n\n| 方法\
  \ | 描述 |\n| --- | --- |\n| `static Class<?> forName(String className)` | 获取描述 `className`\
  \ 的 `Class` 对象。 |\n| `String getCanonicalName()` `String getSimpleName()` `String\
  \ getTypeName()` `String getName()` `String toString()` `String toGenericString()`\
  \ | 获取此类的名称，对于数组、内部类、泛型类和修饰符有特殊之处（参见 练习 20）。 |\n| `Class<? super T> getSuperclass()`\
  \ `Class<?>[] getInterfaces()` `Package getPackage()` `int getModifiers()` | 获取此类的超类、实现的接口、包和修饰符。表\
  \ 4.4 显示了如何分析 `getModifiers` 返回的值。 |\n| `boolean isPrimitive()` `boolean isArray()`\
  \ `boolean isEnum()` `boolean isAnnotation()` `boolean isMemberClass()` `boolean\
  \ isLocalClass()` `boolean isAnonymousClass()` `boolean isRecord()` `boolean isSealed()`\
  \ `boolean isSynthetic()` | 测试表示的类型是否是基本类型或 `void`、数组、枚举、注解（参见 11）、嵌套在另一个类中的、方法或构造函数的局部的、匿的、记录（record）、密封的或合成的（参见\
  \ 第 4.7.7 节）。 |\n| `Class<?> getComponentType()` `Class<?>[] getPermittedSubclasses()`\
  \ `Class<?> getDeclaringClass()` `Class<?> getEnclosingClass()` `Constructor getEnclosingConstructor()`\
  \ `Method getEnclosingMethod()` | 获取数组的组件类型、密封类允许的子类、声明嵌套类的类，以及声明局部类的类和构造函数或方法。\
  \ |\n| `boolean isAssignableFrom(Class<?> cls)` `boolean isInstance(Object obj)`\
  \ | 测试类型 `cls` 或 `obj` 的类是否为此类型的子类型。 |\n| `String getPackageName()` | 获取类的完全限定包名，或者如果它不是顶层类，则获取其包含类。\
  \ |\n| `ClassLoader getClassLoader()` | 获取加载此类的类加载器（参见 第 4.6.3 节）。 |\n| `InputStream\
  \ getResourceAsStream(String path)` `URL getResource(String path)` | 从加载此类的相同位置加载请求的资源。\
  \ |\n| `Field[] getFields()` `Method[] getMethods()` `Field getField(String name)`\
  \ `Method getMethod(String name, Class<?>... types)` | 获取类的字段、方法，或指定的字段或方法。 |\n\
  | `Field[] getDeclaredFields()` `Method[] getDeclaredMethods()` `Field getDeclaredField(String\
  \ name)` `Method getDeclaredMethod(String name, Class<?>... types)` | 获取类的声明字段、方法，或声明的字段或方法。\
  \ |\n| `Constructor[] getConstructors()` `Constructor[] getDeclaredConstructors()`\
  \ `Constructor getConstructor(Class<?>... types)` `Constructor getDeclaredConstructor(String\
  \ name, Class<?>... types)` | 获取类的公共构造函数、构造函数，或指定的构造函数。 |\n| `RecordComponent[]\
  \ getRecordComponents()` | 获取记录的组件。 |\n\n#### 表 4.4：`java.lang.reflect.Modifier`类的方法\n\
  \n| 方法 | 描述 |\n| --- | --- |\n| `static String toString(int modifiers)` | 返回与 `modifiers`\
  \ 设置的修饰符对应的字符串。 |\n| `static boolean is(`Abstract`|Interface`|Native`|Private`|Protected`|Public`|Static`|Strict`|Synchronized`|Volatile`))(int\
  \ modifiers)` | 测试参数中与方法修饰符对应的位。 |\n\n\n\n虚拟机按需加载类文件，从要调用的带有 `main` 方法的类开始。该类将依赖其他类，例如\
  \ `java.lang.System` 和 `java.util.Scanner`，这些类将与它们依赖的类一起加载。\n\n执行 Java 程序时，至少涉及三个类加载器。\n\
  \n- `bootstrap class loader`（启动类加载器加载最基础的 Java 类类。它是虚拟机的一部分。\n- `platform class\
  \ loader`（平台类加载器加载其他库类。与启动类加载器加载的类不同，平台类的权限可以通过安全策略进行配置。\n- `system class loader`（系统类加载器加载应用类。它在类路径和模块路径上的目录和\
  \ JAR 文件中查找类。\n\n在之前的 Oracle JDK 版本中，平台和系统类加载器是 `URLClassLoader` 实例。现在不再如此。某些程序员使用\
  \ `URLClassLoader` 的 `getURLs` 方法来查找类路径。请改用 `System.getProperty(\"java.class.path\"\
  )`。\n\n你可以通过创建自己的 `URLClassLoader` 实例，从不在类路径上的目录或 JAR 文件加载类。这通常用于加载插件。\n\n```\n\
  URL[] urls = {\n    URI.create(\"file:///path/to/directory/\").toURL(),\n    URI.create(\"\
  file:///path/to/jarfile.jar\").toURL()\n};\nString className = \"com.mycompany.plugins.Entry\"\
  ;\ntry (var loader = new URLClassLoader(urls)) {\n    Class<?> cl = Class.forName(className,\
  \ true, loader);\n    // 现在构造 cl 的实例——参见第 4.7.4 \n    ...\n}\n```\n\n`Class.forName(className,\
  \ true, loader)` 调用中的第二个参数确保类的静态初始化在加载后发生。你肯定希望这种情况发生。\n\n不要使用 `ClassLoader.loadClass`\
  \ 方法。它不会运行静态初始化器器。\n\n`URLClassLoader` 从文件系统加载类。如果你想从其他地方加载类，你需要编写自己的类加载器。你只需要实现的方法是\
  \ `findClass`，如下所示：\n\n```java\npublic class MyClassLoader extends ClassLoader {\n\
  \    ...\n    @Override public Class<?> findClass(String name)\n            throws\
  \ ClassNotFoundException {\n        byte[] bytes = the bytes of the class file\n\
  \        return defineClass(name, bytes, 0, bytes.length);                \n   \
  \ }\n}\n```\n\n### 4.6.4. 上文类加载器\n\n大多数情况下，你不需要担心类加载过程。类会在被其他类需要时透明地加载。然而，如果一个方法动态加载类，且该方法是从一个本身由另一个类加载器加载的类中调用的，那么可能会出现问题。这是一个具体的例子。\n\
  \n1. 你提供了一个由系统类加载器加载的工具类，它包含一个方法：\n\n```java\npublic class Util {\n    Object createInstance(String\
  \ className) {\n        Class<?> cl = Class.forName(className);\n        ...\n \
  \   }\n    ...\n}\n```\n\n2. 你用另一个类加载器加载插件，该加载器从插件 JAR 中读取类。\n\n3. 插件调用 `Util.createInstance(\"\
  com.mycompany.plugins.MyClass\")` 来实例化插件 JAR 中的一个类。\n\n插件的作者期望该类被加载。然而，`Util.createInstance`\
  \ 使用它自己的类加载器来执行 `Class.forName`，而该加载器不会查找插件 JAR。这种现象被称为`类加载器反转*。\n\n一种解决方法是将类加载器传递给工具方法，然后传递给\
  \ `forName` 方法。\n\n```java\npublic class Util {\n    public Object createInstance(String\
  \ className, ClassLoader loader) {\n        Class<?> cl = Class.forName(className,\
  \ true, loader);\n        ...\n    }\n    ...\n}\n```\n\n另一种策略是使用当前线程的`context class\
  \ loader`（上下文类加载器）。主线程的上下文类加载器是系统类加载器。当创建新线程时，它的上下文类加载器设置为创建线程的上下文类加载器。因此，如果你什么都不做，所有线程的上下文类加载器都将设置为系统类加载器。然而，你可以通过调用设置任何类加载器：\n\
  \n```java\nThread t = Thread.currentThread();\nt.setContextClassLoader(loader);\n\
  ```\n\n工具方法随后可以获取上下文类加载器：\n\n```java\npublic class Util {\n    public Object createInstance(String\
  \ className) {\n        Thread t = Thread.currentThread();\n        ClassLoader\
  \ loader = t.getContextClassLoader();\n        Class<?> cl = Class.forName(className,\
  \ true, loader);\n        ...\n    }\n    ...\n}\n```\n\n在调用插件类的方法时，应用程序应该将上下文类加载器设置为插件类加载器。之后，它应该恢复之前的设置。\n\
  \n如果你写了一个通过名称加载类的方法，不要简单地使用方法所在类的加载器。为调用者提供显式传递类加载器和使用上下文类加载器之间的选择是一个好主意。\n\n###\
  \ 4.6.5. ServiceLoader\n\n某些服务在程序组装或部署时需要是配置的。实现这一点的方法是提供服务的不同实现，并让程序在它们之间选择最的一个。`ServiceLoader`\
  \ 类方便地加载符合通用接口的服务实现。\n\n定义一个接口（或者如果你愿意，定义超类），包含每个服务实例应该提供的方法。例如，假设你的服务提供加密。\n\n\
  ```java\npackage corejava.crypt;\n\npublic interface Cipher {\n    byte[] encrypt(byte[]\
  \ source, byte[] key);\n    byte[] decrypt(byte[] source, byte[] key);\n    int\
  \ strength();\n}\n```\n\n服务提供者提供一个多个实现该服务的类，例如：\n\n```java\npackage corejava.crypt.impl;\n\
  \npublic class CaesarCipher implements Cipher {\n    public byte[] encrypt(byte[]\
  \ source, byte[] key) {\n        var result = new byte[source.length];\n       \
  \ for (int i = 0; i < source.length; i++)\n            result[i] = (byte)(source[i]\
  \ + key[0]);\n        return result;\n    }\n    public byte[] decrypt(byte[] source,\
  \ byte[] key) {\n        return encrypt(source, new byte[] { (byte) -key[0] });\n\
  \    }\n    public int strength() { return 1; }\n}\n```\n\n实现类可以在任何包中，不一定与服务接口在同一个包。它们每个必须有一个无参构造函数。\n\
  \n现在将提供者类的名称添加到 `META-INF/services`目录下的文本文件中。文件名是接口的全限定名。在我们的示例中，`META-INF/services/corejava.crypt.Cipher`\
  \ 文件包含：\n\n```\ncorejava.crypt.impl.CaesarCipher\n```\n\n完成这些准备工作后，程序如下初始化服务加载器：\n\
  \n```\npublic static ServiceLoader<Cipher> cipherLoader = ServiceLoader.load(Cipher.class);\n\
  ```\n\n这应该在程序中只执行一次。\n\n`ServiceLoader` 的 `iterator` 方法提供一个遍历所有提供的实现的迭代器。（有关迭代器的更多信息请参见\
  \ 7。）最简单的方法是使用增强 `for` 循环遍历它们。在循环中，选择一个合适的对象来执行服务。\n\n```\npublic static Cipher\
  \ getCipher(int minStrength) {\n    for (Cipher cipher : cipherLoader) // 隐式调用 iterator\n\
  \        if (cipher.strength() >= minStrength) return cipher;\n    return null;\n\
  }\n```\n\n\n\n另一种，你也可以使用流（参见 8）来定位所需的服务。`stream` 方法产生一个包含 `ServiceLoader.Provider`\
  \ 实例的流。该接口拥有 `type` 和 `get` 方法，用于获取提供者类和提供者实例。如果你按类型选择提供者，只需调用 `type` 即可，这样就不会产生不需要的服务实例。在我们的示例中，我们需要获取提供者，因为我们要对流进行过滤，筛选出具有所需强度的加密算法：\n\
  \n```\npublic static Optional<Cipher> getCipher2(int minStrength) {\n    return\
  \ cipherLoader.stream()\n        .map(ServiceLoader.Provider::get)\n        .filter(c\
  \ -> c.strength() >= minStrength)\n        .findFirst();\n}\n```\n\n如果你接受任何实现，只需调用\
  \ `findFirst`：\n\n```\nOptional<Cipher> cipher = cipherLoader.findFirst();\n```\n\
  \n`Optional` 类在 8 中有所解释。\n\n## 4.7. 反射\n\n反射允许程序在运行时检查对象的内容，并在对象上调用任意方法。这种能力对于实现如对象关系映射器（ORM）或\
  \ GUI 构建器等工具非常有用。\n\n由于反射主要对工具构建者感兴趣，应用程序程序员可以安全地跳过本节，并在需要时返回。\n\n### 4.7.1. 枚举类成员\n\
  \n`java.lang.reflect` 包中的 `Field`、`Method` 和 `Constructor` 三个类描述了类的字段、方法和构造函数。这三个类都有一个名为\
  \ `getName` 的方法，该方法返回成员的名称。`Field` 类有一个 `getType` 方法，它返回一个对象（同样是 `Class` 类型），用于描述字段类型。`Method`\
  \ 和 `Constructor` 类有方法可以报告参数类型，而 `Method` 类还报告返回类型。\n\n这三个类还有一个名为 `getModifiers`\
  \ 的方法，该方法返回一个整数，其中不同的位位被开启或关闭，用于描述所使用的修饰符（如 `public` 或 `static`）。你可以使用 `Modifier.isPublic`\
  \ 和 `Modifier.isStatic` 等静态方法来分析 `getModifiers` 返回的整数。`Modifier.toString` 返回包含所有修饰符的字符串。\n\
  \n`Class` 类的 `getFields`、`getMethods` 和 `getConstructors` 方法返回该类支持的公共字段、方法和构造函数的数组；这包括公共的继承成员。`getDeclaredFields`、`getDeclaredMethods`\
  \ 和 `getDeclaredConstructors` 方法返回由类中声明的所有字段、方法和构造函数组成的数组。这包括私有的、包私有的保护保护成员，但不包括父类的成员。\n\
  \n`Executable` 类（`Method` 和 `Constructor` 的公共父类）的 `getParameters` 方法返回一个描述方法参数的\
  \ `Parameter` 对象数组。\n\n只有当类在编译时使用了 `-parameters` 标志，参数名称才在运行时可用。\n\n例如，以下是打印类所有方法的方法：\n\
  \n```\nClass<?> cl = Class.forName(className);\nwhile (cl != null) {\n    for (Method\
  \ m : cl.getDeclaredMethods()) { \n        System.out.println(\n            Modifier.toString(m.getModifiers())\
  \ + \" \" +\n            m.getReturnType().getCanonicalName() + \" \" +\n      \
  \      m.getName() +\n            Arrays.toString(m.getParameters()));\n    }\n\
  \    cl = cl.getSuperclass();\n}\n```\n\n这段代码的非凡之处在于，它可以分析 Java 虚拟机可以加载的任何类——而不仅仅是编译时可用的类。\n\
  \n正如你在 12 中看到的，Java 平台模块系统对反射访问实施了严格限制。默认情况下，只有同一模块中的类可以通过反射进行分析。如果你不声明模块，你所有的类都属于一个单一模块，它们都可以通过反射访问。然而，Java\
  \ 库类属于不同的模块，对它们非公共成员的反射访问是被限制的。\n\n### 4.7.2. 检查对象\n\n正如你在上一节中看到的，你可以获取描述对象字段类型和名称的\
  \ `Field` 对象。这些 `Field` 对象可以做更多事情：它们可以访问具有给定字段的对象中的字段值。\n\n例如，以下是枚举对象所有字段内容的方法：\n\
  \n```\nObject obj = ...;\nfor (Field f : obj.getClass().getDeclaredFields()) {\n\
  \    f.setAccessible(true);\n    Object value = f.get(obj);\n    System.out.println(f.getName()\
  \ + \":\" + value);\n}\n```\n\n关键在于读取字段值的 `get` 方法。如果字段值是基本类型值，则会返回一个包装对象；在这种情况下，你也可以调用\
  \ `getInt`、`getDouble` 等方法之一。\n\n在使用私有的 `Field` 和 `Method` 对象之前，必须让它们变为“可访问”。调用\
  \ `setAccessible(true)` 可以为反射解锁字段或方法。然而，模块系统或安全管理器可能会阻止请求并保护对象不被这种方式访问。在这种情况下，`setAccessible`\
  \ 方法会抛出 `InaccessibleObjectException` 或 `SecurityException`。或者，你可以调用 `trySetAccessible`\
  \ 方法，如果字段或方法不可访问，它只会返回 `false`。\n\n正如你在 12 中看到的，Java 平台包包含在模块中，其类受反射保护。例如，如果你调用\n\
  \n```\nField f = String.class.getDeclaredField(\"value\");\nf.setAccessible(true);\n\
  ```\n\n会抛出 `InaccessibleObjectException`。一旦字段可访问，你也可以设置它。无论它属于哪个类，只要它有一个 `double`\
  \ 类型的 `salary` 字段，就会抛给 `obj`。\n\n```\nField f = obj.getClass().getDeclaredField(\"\
  salary\");\nf.setAccessible(true);\ndouble value = f.getDouble(obj);\nf.setDouble(obj,\
  \ value * 1.1);\n```\n\n### 4.7.3. 调用方法\n\n就像 `Field` 对象可以读取和写入字段一样，`Method` 对象可以调用对象上的指定方法。\n\
  \n```\nMethod m = ...;\nObject result = m.invoke(obj, arg1, arg2);\n```\n\n如果方法是静态的，为初始参数提供\
  \ `null`。\n\n要获取方法，你可以遍历 `getMethods` 或 `getDeclaredMethods` 返回的数组（你在 4.7.1 中看到的）。或者你可以调用\
  \ `getMethod` 并提供参数类型。例如，获取 `Person` 上的 `setName(String)` 方法：\n\n```\nPerson p =\
  \ ...;\nMethod m = p.getClass().getMethod(\"setName\", String.class);\nm.invoke(obj,\
  \ \"********\");\n```\n\n尽管 `clone` 是所有数组类型的公共方法，但在描述数组的 `Class` 对象上调用 `getMethod`\
  \ 时，它不会被报告。\n\n### 4.7.4. 对象\n\n要构造对象，首先找到 `Constructor` 对象，然后调用它的 `newInstance`\
  \ 方法。例如，假设你知道某个类有一个参数为 `int` 的公共构造函数。你可以这样构造新实例：\n\n```\nConstructor constr = cl.getConstructor(int.class);\n\
  Object obj = constr.newInstance(42);\n```\n\n`Class` 类有一个 `newInstance` 方法用于使用无参数构造函数构造给定类的对象。该方法现在已过时，因为它有一个奇怪的缺陷。如果无参数构造函数抛出检查异常，`newInstance`\
  \ 方法会重新抛出它，即使它没有声明，从而完全破坏了对检查异常的编译检查。相反，你应该调用 `cl.getConstructor().newInstance()`。这时任何异常都被包装在\
  \ `InvocationTargetException` 中。\n\n表 4.5 总结了处理 `Field`、`Method` 和 `Constructor`\
  \ 对象的最重要方法。\n\n表 4.5：`java.lang.reflect` 包中的类类和方法\n\n\n\n\n| Class | Method | Notes\
  \ |\n| --- | --- | --- |\n| `AccessibleObject` | \n```\nvoid setAccessible(boolean\
  \ flag)\nstatic void setAccessible(\n    AccessibleObject[]\n    array, boolean\
  \ flag)\n``` | `AccessibleObject` 是 `Field`、`Method` 和 `Constructor` 的超类。`setAccessible`\
  \ 方法设置此成员或给定成员的访问权限。 |\n| `Field` | `String getName()` `int getModifiers()` `Object\
  \ get(Object obj)` `p getP(Object obj)` `void set(Object obj, Object newValue)`\
  \ `void setP(Object obj, newValue)` | 每个基本数据类型 `p` 都有对应的 `get` 和 `set` 方法。 |\n|\
  \ `Method` | \n```\nObject invoke(Object obj, \n    Object... args)\n``` | 调用由此对象描述的方法，传递给定的参数并返回方法产生的值。对于静态方法，为\
  \ `obj` 传递 `null`。基本类型参数和返回值会被包装。 |\n| `Constructor` | `Object newInstance(Object...\
  \ args)` | 调用由此对象描述的构造函数，传递给定的参数并返回构造的对象。 |\n| `Executable` | `String getName()`\
  \ `int getModifiers()` `Parameters[] getParameters()` | `Executable` 是 `Method`\
  \ 和 `Constructor` 的超类。 |\n| `Parameter` | `boolean isNamePresent()` `String getName()`\
  \ `Class<?> getType()` | `getName` 方法获取名称；如果名称不存在，则获取一个如 `arg0` 类的合成名称。 |\n\n###\
  \ 4.7.5. JavaBeans\n\n许多面向对象的编程语言都支持属性，将表达式 `object.propertyName` 映射到对 getter 或\
  \ setter 方法的调用，取决于该属性是可读还是可写的。Java 没有这种语法，但它有一种约定，即属性与 getter/setter 方法对对应。`JavaBean`\
  \ 是一个具有无参数构造函数、getter/setter 对以及任意数量其他方法的类。\n\ngetter 和 setter 必须遵循特定的模式\n\n```java\n\
  public Type getProperty()\npublic void setProperty(Type newValue)\n```\n\n通过省略 setter\
  \ 或 getter，可以实现只读或只写属性。\n\n属性名称是 `get`/`set` 后缀的去驼化后的形式。例如，`getSalary`/`setSalary`\
  \ 对产生一个名为 `salary` 的属性。然而，如果后缀的前两个字母是大写字母，则按原样提取。例如，`getURL` 产生一个名为 `URL` 的只读属性。\n\
  \n对于布尔类型属性，可以使用 `getProperty` 或 `isProperty` 作为 getter，且推荐使用后者。\n\nJavaBeans 源于\
  \ GUI 生成器，JavaBeans 规范有一系列处理属性编辑器、属性更改事件和自定义属性发现的晦涩规则。这些特性在如今很少使用。\n\n当需要处理任意属性时，使用标准类支持\
  \ JavaBeans 支持是一个好主意。给定一个类，可以通过如下方式获取 `BeanInfo` 对象：\n\n```java\nClass<?> cl = ...;\n\
  BeanInfo info = Introspector.getBeanInfo(cl);\nPropertyDescriptor[] props = info.getPropertyDescriptors();\n\
  ```\n\n对于给定的 `PropertyDescriptor`，调用 `getName` 和 `getPropertyType` 获取属性的名称和类型。`getReadMethod`\
  \ 和 `getWriteMethod` 返回 getter 和 setter 的 `Method` 对象。\n\n遗憾的是，没有方法根据给定的属性名称获取描述符，因此你必须遍历描述符数组：\n\
  \n```java\nString propertyName = ...;\nObject propertyValue = null;\nfor (PropertyDescriptor\
  \ prop : props) {\n    if (prop.getName().equals(propertyName))\n        propertyValue\
  \ = prop.getReadMethod().invoke(obj);\n}\n```\n\n### 4.7.6. 数组操作\n\n`isArray` 方法检查给定的\
  \ `Class` 对象是否表示数组。如果是，`getComponentType` 方法将返回描述数组元素类型的 `Class`。为了进一步的分析或动态创建数组，请使用\
  \ `java.lang.reflect` 包中的 `Array` 类。请参阅表 4.6。\n\n作为一项练习，让我们在 `Arrays` 类中实现 `copyOf`\
  \ 方法。回想此方法如何用于扩展已满的数组。\n\n```java\nvar friends = new Person[100];\n...\n// 数组已满\n\
  friends = Arrays.copyOf(friends, 2 * friends.length);\n```\n\n如何编写这样一个泛型方法呢？这里是第一次尝试：\n\
  \n```java\npublic static Object[] badCopyOf(Object[] array, int newLength) { //\
  \ 无用\n    var newArray = new Object[newLength];\n    for (int i = 0; i < Math.min(array.length,\
  \ newLength); i++)\n        newArray[i] = array[i];\n    return newArray;\n}\n```\n\
  \n然而，在实际使用结果数组时存在问题。此方法返回的数组类型是 `Object[]`。对象数组无法强制转换为 `Person[]` 数组。点在于，正如我们之前提到的，Java\
  \ 数组会记住其元素的类型——即在 `new` 表达式中使用的类型。将 `Person[]` 数组临时转换为 `Object[]` 数组是合法的\n\n####\
  \ 表 4.6：java.lang.reflect.Array 类的方法\n\n| 方法 | 说明 |\n| --- | --- |\n| `static Object\
  \ get(Object array, int index)` `static p getP(Object array, int index)` `static\
  \ void set(Object array, int index, Object newValue)` `static void setP(Object array,\
  \ int index, newValue)` | 获取或设置数组指定索引元素，`p` 为基本类型。 |\n| `static int getLength(Object\
  \ array)` | 获取数组的长度。 |\n| `static Object newInstance(Class<?> componentType, int\
  \ length)` `static Object newInstance(Class<?> componentType, int[] lengths)` |\
  \ 返回具有给定维度、给定组件类型的新数组。 |\n\n### 4.7.7. 代理\n\n`Proxy` 类可以在运行时创建实现给定接口或一组接口的新类。这种代理只有在在编译时不知道需要实现哪些接口时才是必要的。\n\
  \n代理类拥有所有指定接口所需的方法，以及在 `Object` 类中定义的所有方法（`toString`、`equals` 等）。然而，由于你无法在运行时为这些方法定义新代码，你需要提供一个*调用处理器*（invocation\
  \ handler），即实现 `InvocationHandler` 接口的对象。该接口有一个方法：\n\n```java\nObject invoke(Object\
  \ proxy, Method method, Object[] args)\n```\n\n当在代理对象上调用方法时，调用处理器的 `invoke` 方法会被调用，并传入原始调用的\
  \ `Method` 对象和参数。调用处理器必须如何处理该调用。调用处理器可以采取许多可能的操作，例如路由调用到远程服务器或为了调试目的跟踪调用。\n\n要创建代理对象，请使用\
  \ `Proxy` 类的 `newProxyInstance` 方法。该方法有三个参数：\n\n\n\n\n\n*   一个类加载器（参见 Section 4.6.3），或使用\
  \ `null` 以使用默认类加载器\n\n*   一个 `Class` 对象的数组，每个每个待实现的接口对应一个对象\n\n*   调用处理器（invocation\
  \ handler）\n\n为了展示代理的机制，这里有一个示例，数组中填充了 `Integer` 对象的代理，它们在打印跟踪消息后将调用转发给原始对象：\n\n\
  ```\nvar values = new Object[1000];\n\nfor (int i = 0; i < values.length; i++) {\n\
  \    var value = Integer.valueOf(i);\n    values[i] = Proxy.newProxyInstance(\n\
  \        null,\n        value.getClass().getInterfaces(),\n        // 调用处理器的 Lambda\
  \ 表达式\n        (Object proxy, Method m, Object[] margs) -> {\n            System.out.println(value\
  \ + \".\" + m.getName() + Arrays.toString(margs));\n            return m.invoke(value,\
  \ margs);\n        });\n}\n```\n\n当调用\n\n```\nArrays.binarySearch(values, Integer.valueOf(500));\n\
  ```\n\n时，产生以下输出：\n\n```\n499.compareTo[500]\n749.compareTo[500]\n624.compareTo[500]\n\
  561.compareTo[500]\n530.compareTo[500]\n514.compareTo[500]\n506.compareTo[500]\n\
  502.compareTo[500]\n500.compareTo[500]\n```\n\n你可以看到二分搜索算法是如何通过每一步搜索范围减半来锁定键的。\n\
  \n这一点在于，`compareTo` 方法是通过代理调用的，尽管代码中并没有显式提到这一点。`Integer` 实现的所有接口中的所有方法都经过了代理。\n\n\
  当使用没有参数的方法调用调用调用处理器时，参数数组为 `null`，而不是长度为 `0` 的 `Object[]` 数组。这是完全不可理喻的，你不应该在自己的代码中这样做。\n\
  \n## 练习题\n\n1.  定义类 `Point`，包含一个构造函数 `public Point(double x, double y)` 和访问器方法 `getX`,\
  \ `getY`。定义一个子类 `LabeledPoint`，包含构造函数 `public LabeledPoint(String label, double\
  \ x, double y)` 和访问器方法 `getLabel`。\n\n2.  为上一个练习中的类定义 `toString`、`equals` 和 `hashCode`\
  \ 方法。\n\n3.  将 Exercise 2 中 `Point` 类的实例变量 `x` 和 `y` 改为 `protected`。证明 `LabeledPoint`\
  \ 类只能在 `LabeledPoint` 实例中访问这些变量。\n\n4.  定义抽象类 `Shape`，包含一个 `Point` 类型的实例变量、一个构造函数、一个按指定量移动点的具体方法\
  \ `public void moveBy(double dx, double dy)` 以及一个抽象方法 `public Point getCenter()`。具体的子类\
  \ `Circle`、`Rectangle`、`Line`，并带有构造函数 `public Circle(Point center, double radius)`、`public\
  \ Rectangle(Point topLeft, double width, double height)` 和 `public Line(Point from,\
  \ Point to)`。\n\n5.  为上一个练习中的类定义 `clone` 方法。\n\n6.  假设在 Section 4.3.2 中，`Item.equals`\
  \ 方法使用了 `instanceof` 测试。实现 `DiscountedItem.equals`，使得当 `otherObject` 是 `Item` 时只比较父类，但如果它是\
  \ `DiscountedItem` 则也包含折扣信息。证明该方法保持了对称性，但无法满足*传递性*——即：找到一组项目和打折项目，使得 `x.equals(y)`\
  \ 和 `y.equals(z)` 真，但 `x.equals(z)` 。\n\n7.  定义方法 `Object add(Object first, Object\
  \ second)`。如果参数是 `Number` 的实例，则相加值。如果它们是 `Boolean` 实例，如果其中一个为真则返回 `Boolean.TRUE`。否则，将它们拼接为字符串。使用带有模式匹配的\
  \ `instanceof` 运算符。\n\n8.  为原色的种组合 `BLACK`、`RED`、`BLUE`、`GREEN`、`CYAN`、`MAGENTA`、`YELLOW`、`WHITE`\
  \ 定义一个枚举类型，并带有方法 `getRed`、`getGreen` 和 `getBlue`。\n\n9.  从概念上说，列表要么为空，要么它有一个头部元素和一个尾部（尾部也是列表）。使用密封类（sealed\
  \ classes）来建模字符串列表。提供一个包含恰两个子类 `EmptyStringList` 和 `NonEmptyStringList` 的 `StringList`\
  \ 接口。使用穷尽模式匹配实现方法 `size` 和 `append`。\n\n10. `Class` 类有六个产生由 Class 对象所表示类型的字符串表示的方法。它们在应用于数组、泛型类型、内部类和基本类型时有何不同？\n\
  \n11. 编写一个“通用的” `toString` 方法，利用反射生成一个包含对象所有实例变量的字符串。如果能处理循环引用，将获得额外积分。\n\n12. 使用\
  \ Section 4.7.1 中的 `MethodPrinter` 程序列出 `int[]` 类的所有方法。如果能识别出本章中讨论过的那个被描述错误的方法，将获得额外积分。\n\
  \n13. 编写“Hello, World”程序，使用反射进行查找和调用。\n\n14. 测量普通方法调用与通过反射的方法调用之间的性能差异。\n\n15. 编写一个打印\
  \ `Math.sqrt` 和 `Double.toHexString` 表格的方法。对比两种方法在安全性、效率和便利性方面的差异。\n\n\n\n\n\nJava\
  \ 并不是让错误代码在方法调用链中层层传递，而是支持*异常处理*，方法可以通过“抛出”（throwing）异常来信号严重问题。调用链中的某个方法（但不一定是直接调用者）负责通过“捕获”（catching）该异常来处理它。异常处理的根本优势是将检测错误和处理错误的过程解耦。在接下来的章节中，你将看到如何在\
  \ Java 中处理异常。\n\n#### 5.1.1. 抛出异常\n\n方法可能会发现自己处于无法执行当前任务的情况。也许是缺少所需的资源，或者调用时传入的参数不一致。在这种情况下，最好的办法是抛出一个异常。\n\
  \n假设你实现了一个产生两个边界之间随机整数的方法：\n\n```\npublic static int randInt(int low, int high)\
  \ {\n    return low + (int) (Math.random() * (high - low + 1));\n}\n```\n\n如果有人调用\
  \ `randInt(10, 5)`，会发生什么？尝试修复这个问题可能不是个好主意，因为调用者可能在多个方面产生了困惑。相反，应该抛出一个适当的异常：\n\n\
  ```java\nif (low > high)\n    throw new IllegalArgumentException(\n        \"low\
  \ should be <= high but low is %d and high is %d\".formatted(low, high));\n```\n\
  \n如所示，`throw` 语句用于“抛出”一个类的对象——在这里是 `IllegalArgumentException`。该对象是带有调试消息构造的。你将在下一节中看到如何选择合适的异常类。\n\
  \n当执行 `throw` 语句时，正常的执行流会立即中断。`randInt` 方法停止执行，并且不向调用者返回值。相反，控制权将转移给处理器，正如你将在第 5.1.4\
  \ 节中看到的。\n\n#### 5.1.2. 异常层次结构\n\n图 5.1 显示了 Java 异常的层次结构。所有异常都是 `Throwable` 类的子类。`Error`\
  \ 的子类是在发生程序无法预期处理的异常情况时抛出的异常，例如内存耗尽。对于错误，你所做的除了给用户提供一条消息告诉他们发生了非常严重的问题之外，没有别的事情可做的。\n\
  \n![](img/exception-hierarchy.jpg)图 5.1：异常层次结构\n\n程序员报告的异常是 `Exception` 类的子类。这些异常分为两类：\n\
  \n- *未检查*（Unchecked）异常是 `RuntimeException` 的子类。\n- 所有其他异常都是*已检查*（checked）异常。\n\n\
  正如你将在下一节看到的，程序员要么捕获已检查异常，要么在方法头中声明它们。编译器会检查这些异常是否被妥善处理。\n\n`RuntimeException` 这个名字并不理想。当然，所有异常都发生在运行时。然而，`RuntimeException`\
  \ 子类的异常在编译期间是不被检查的。\n\n已检查异常用于应该预料到会失败的情况。失败的一个常见原因是输入和输出。文件可能会损坏，网络连接可能会失败。许多异常类扩展了\
  \ `IOException`，你应该使用适当的异常来报告你遇到的任何错误。例如，当一个本该存在的文件实际上不存在时，抛出 `FileNotFoundException`。\n\
  \n未检查异常表示由程序员引起的逻辑错误，而不是由不可避免的外部风险引起。例如，`NullPointerException` 是不被检查的。几乎任何方法都可能抛出它，程序员不应该花时间去捕获它们。相反，他们应该确保从根本上不对\
  \ `null` 解引用。\n\n有时，实现者需要根据自己的判断来区分已检查异常和未检查异常。考虑调用 `Integer.parseInt(str)`。当 `str`\
  \ 不包含有效整数时，它会抛出一个未检查的 `NumberFormatException`。另一方面，当 `str` 不包含有效的类名时，`Class.forName(str)`\
  \ 会抛出一个已检查的 `ClassNotFoundException`。\n\n为什么会有这种区别？原因在于，在调用 `Integer.parseInt` 之前，可以检查一个字符串是否为有效整数，但在实际尝试加载类之前，是不知道一个类是否可以被加载的。\n\
  \nJava API 提供了许多异常类，例如 `IOException`、`IllegalArgumentException` 等。你应该在适当的时候使用它们。但是，如果没有一个标准异常类类适用于你的需求，你可以通过扩展\
  \ `Exception`、`RuntimeException` 或另一个现有的异常类来创建自己的异常。\n\n当你这样做时，同时提供一个无参数构造函数和一个带消息字符串的构造函数是一个好主意。例如：\n\
  \n```java\npublic class FileFormatException extends IOException {\n    public FileFormatException()\
  \ {}\n    public FileFormatException(String message) {\n        super(message);\n\
  \    }\n    // 还要为链式异常添加构造函数——参见第 5.1.7 节\n}\n```\n\n#### 5.1.3. 声明已检查异常\n\n任何可能产生已检查异常的方法必须在方法头中使用\
  \ `throws` 子句声明：\n\n```java\npublic void write(Object obj, String filename)\n  \
  \  throws IOException, ReflectiveOperationException\n```\n\n列出方法可能抛出的异常，可能是因为 `throw`\
  \ 语句，也可能是因为调用了另一个带有 `throws` 子句的方法。\n\n在 `throws` 子句中，你可以将异常合并到一个公共超类中。这是否是一个好主意取决于具体的异常。例如，如果一个方法可以抛出多个\
  \ `IOException` 的子类，那么在 `throws IOException` 子句中涵盖它们是有意义的。但如果异常彼此无关，不要将它们合并为 `throws\
  \ Exception`——那会违背异常检查的初衷。\n\n有些程序员认为方法可能会抛出异常是可耻的。难道直接处理它更好吗？实际上恰恰相反。你应该让每个异常找到它的处理器。异常的黄金法是：“尽早抛出，推迟捕获。”\n\
  \n当你重写方法时，抛出的已检查异常不能多于父类方法声明的异常。例如，如果你扩展了本节头的 `write` 方法，重写方法可以抛出更少的异常：\n\n```java\n\
  public void write(Object obj, String filename)\n    throws FileNotFoundException\n\
  ```\n\n但如果方法尝试抛出一个无关的已检查异常，如 `InterruptedException`，它将无法编译。\n\n如果父类方法没有 `throws`\
  \ 子句，那么重写方法不能抛出已检查异常。\n\n你可以使用 javadoc `@throws` 记录方法何时抛出（已检查或未检查）异常。大多数程序员只在有意义的情况下这样做。例如，在输入输出出现问题时告知\
  \ `IOException` 价值不大。但像这样的注释是有意义的：\n\n@throws NullPointerException 如果 filename 为\
  \ null\n@throws FileNotFoundException 如果不存在名为 filename 的文件\n\n你从不指定 lambda 表达式的异常类型。然而，如果\
  \ lambda 表达式可以抛出已检查异常，你只能将其传递给声明了该异常的函数式接口。例如，调用\n\n```java\nlist.forEach(obj ->\
  \ write(obj, \"output.dat\"));\n```\n\n是一个错误。`forEach` 方法的参数类型是函数式接口\n\n```java\n\
  public interface Consumer<T> {\n    void accept(T t);\n}\n```\n\n`accept` 方法没有声明抛出任何已检查异常。\n\
  \n#### 5.1.4. 捕获异常\n\n要捕获异常，请设置 `try` 块。在最简单的形式下，它如下：\n\n```\ntry {\n    statements\n\
  } catch (ExceptionClass ex) {\n    handler\n}\n```\n\n\n\n\n当执行 `try` 块中的语句时发生了给定类类的异常，控制权将转移到处理程序。异常变量（示例中为\
  \ `ex`）引用异常对象，处理程序可以根据需要对该对象进行检查。\n\n你可以对这个基本结构进行两处修改。你可以为不同的异常类设置多个处理器：\n\n```\n\
  try {\n    statements\n} catch (ExceptionClass1 ex) {\n    handler1\n} catch (ExceptionClass2\
  \ ex) {\n    handler2\n} catch (ExceptionClass3 ex) {\n    handler3\n}\n```\n\n\
  `catch` 子句是从上到下进行匹配的，因此最具体的异常类必须放在前面。\n\n或者，你可以在多个异常类之间共享一个处理器：\n\n```java\ntry\
  \ {\n    statements\n} catch (ExceptionClass1 | ExceptionClass2 | ExceptionClass3\
  \ ex) {\n    handler\n}\n```\n\n在这种情况下，处理器只能在异常变量上调用那些属于所有异常类的方法。\n\n#### 5.1.5.\
  \ 带资源的 try 语句 (Try-with-Resources Statement)\n\n异常处理的一个问题是资源管理。假设你向一个文件写入内容并在完成后关闭它：\n\
  \n```\nArrayList<String> lines = ...;\nvar out = new PrintWriter(\"output.txt\"\
  );\nfor (String line : lines) {\n    out.println(line.toLowerCase());\n}\nout.close();\n\
  ```\n\n这段代码有一个隐藏的危险。如果任何方法抛出了异常，`out.close()` 的调用将永远不会发生。这是糟糕的。输出可能会丢失，或者如果触发多次异常，系统可能会耗尽文件句柄。\n\
  \n`try` 语句的一种特殊形式可以解决这个问题。你可以在 `try` 语句的头部中指定 `resources`。资源必须属于一个实现了 `AutoCloseable`\
  \ 接口的类。你可以在 `try` 块的头部声明变量：\n\n```java\nArrayList<String> lines = ...;\ntry (var\
  \ out = new PrintWriter(\"output.txt\")) { // 变量声明\n    for (String line : lines)\n\
  \        out.println(line.toLowerCase());\n}\n```\n\n或者，你可以在头部提供之前声明的有效最终变量（effectively\
  \ final variables）变量：\n\n```java\nvar out = new PrintWriter(\"output.txt\");\ntry\
  \ (out) { // 有效最终变量\n```\n    for (String line : lines)\n        out.println(line.toLowerCase());\n\
  }\n```\n\n`AutoCloseable` 接口有一个方法：\n\n```\npublic void close() throws Exception\n\
  ```\n\n还有一个 `Closeable` 接口。它是 `AutoCloseable` 的子接口，同样有一个 `close` 方法。然而，该方法被声明为抛出\
  \ `IOException`。\n\n当 `try` 块退出时（无论是正常结束还是因为抛出了异常），资源对象的 `close` 方法都会被调用。例如：\n\n\
  ```java\ntry (var out = new PrintWriter(\"output.txt\")) {\n    for (String line\
  \ : lines) {\n        out.println(line.toLowerCase());\n    }\n} // 在此处调用 out.close()\n\
  ```\n\n你可以声明多个资源，用分号分隔。这里有一个有两个资源声明的示例：\n\n```java\ntry (var in = new Scanner(Path.of(\"\
  /usr/share/dict/words\"));\n        var out = new PrintWriter(\"output.txt\")) {\n\
  \    while (in.hasNext())\n        out.println(in.next().toLowerCase());\n}\n```\n\
  \n资源按照它们初始化的反序关闭——也就是说，在调用 `in.close()` 之前会调用 `out.close()`。\n\n假设 `PrintWriter`\
  \ 构造函数抛出了异常。此时 `in` 已经初始化但 `out`尚未。`try` 语句执行了正确的操作：调用 `in.close()` 并传播异常。\n\n某些\
  \ `close` 方法可能会抛出异常。如果这在 `try` 块正常完成时发生，该异常将抛给调用者。然而，如果已经抛出了另一个异常，导致资源的 `close`\
  \ 方法被调用，并且其中一个方法抛出了异常，那么该异常的重要性可能低于原始异常。\n\n在这种情况下，原始异常会被重新抛出，而调用 `close` 产生的异常会被捕获并作为“被抑制”（suppressed）异常附加上。这是一个非常有用的机制，如果手动实现将会非常繁琐（参见练习\
  \ 10）。当你捕获到主异常时，可以通过调用 `getSuppressed` 方法获取次要异常：\n\n```java\ntry {\n    ...\n} catch\
  \ (IOException ex) {\n    Throwable[] secondaryExceptions = ex.getSuppressed();\n\
  \    ...\n}\n```\n\n如果你想在（希望是罕见的）无法使用带资源的 try 语句的情况下，自己实现这种机制，请调用 `ex.addSuppressed(secondaryException)`。\n\
  \n带资源的 try 语句可以可选包含 `catch` 子句，用于捕获该语句中的任何异常。\n\n#### 5.1.6. finally 子句\n\n正如你所看到的，带资源的\
  \ try 语句无论是否发生异常都会自动关闭资源。有时，你需要清理不是 `AutoCloseable` 的东西。在这种情况下，使用 `finally` 子句：\n\
  \n```java\ntry {\n    执行工作\n} finally {\n    清理工作\n}\n```\n\n当 `try` 块结束时（无论是正常结束还是由于异常），都会执行\
  \ `finally` 子句。\n\n每当你需要获取和释放锁、增加和递减计数器，或者在栈上推入某个内容并在完成后将其弹出时，就会出现这种模式。你希望确保这些操作无论发生什么都会执行。\n\
  \n你应该避免在 `finally` 子句中抛出异常。如果 `try` 块体由于异常终止，该异常会被 `finally` 子句中的异常所掩盖。`finally`\
  \ 子句体旨在清理资源。不要在 `finally` 子句内部放入改变控制流的语句（`return`、`throw`、`break`、`continue`）。\n\
  \n可以形成带有 `catch` 子句以及后续 `finally` 子句的 `try` 语句。但你必须小心 `finally` 子句中的异常。例如，看看这个节自在线教程的块：\n\
  \n```\nBufferedReader in = null;\ntry {\n    in = Files.newBufferedReader(path);\n\
  \    从 in 读取\n} catch (IOException ex) {\n    System.err.println(\"捕到 IOException:\
  \ \" + ex.getMessage());\n} finally {\n    if (in != null) {\n        in.close();\
  \ // 注意——可能会抛出异常\n    }\n}\n```\n\n程序员显然考虑了 `Files.newBufferedReader` 方法抛出异常的情况。这段代码似乎能够捕获并打印所有的\
  \ IO 异常，但它实际上漏掉了一个：`in.close()` 可能抛出的异常。通常，将复杂的 `try`/`catch`/`finally` 语句重写为带资源的\
  \ try 语句，或者通过在 `try`/`catch` 语句中嵌套 `try`/`finally` 语句会更好——参见练习 12。\n\n#### 5.1.7.\
  \ 异常的重新抛出与链式\n\n当异常发生时，你可能不知道如何处理，但你可能想要记录这次失败。在这种情况下，重新抛出异常，以便让胜任的处理器处理它：\n\n```java\n\
  try {\n    执行工作\n}\ncatch (Exception ex) {\n    logger.log(level, message, ex);\n\
  \    throw ex;\n}\n```\n\n\n\n当这段代码位于一个可能会抛出受检异常（checked exception）的方法内部时，会发生一些微妙的变化。假设包含它的方法声明如下：\n\
  \n```java\npublic void read(String filename) throws IOException\n```\n\n初看之下，似乎需要将\
  \ `throws` 子句改为 `throws Exception`。然而，Java 编译器会仔细地跟踪执行流，并意识到 `ex` 只能是由 `try` 块中的某条语句抛出的异常，而不是一个任意的\
  \ `Exception`。\n\n有时，你想要更改抛出异常的类型。例如，你可能需要用一个对子系统用户有意义的异常类来报告子系统的失败。假设你在 servlet\
  \ 中遇到了数据库错误。执行该 servlet 的代码可能不想知道发生了什么细节，但它确实想知道 servlet 出了问题。在这种情况下，捕获原始异常并将其链链到更高层级的异常上：\n\
  \n```java\ntry {\n    Access the database\n}\ncatch (SQLException ex) {\n    throw\
  \ new ServletException(\"database error\", ex);\n}\n```\n\n当捕获到 `ServletException`\
  \ 时，可以通过以下方式获取原始异常：\n\n```java\nThrowable cause = ex.getCause();\n```\n\n`ServletException`\
  \ 类有一个构造函数，可以将异常的因作为参数传入。并不是所有的异常类都这样做。在这种情况下，你必须调用 `initCause` 方法，如下：\n\n```java\n\
  try {\n    Access the database\n}\ncatch (SQLException ex) {\n    var ex2 = new\
  \ CruftyOldException(\"database error\");\n    ex2.initCause(ex);\n    throw ex2;\n\
  }\n```\n\n如果你提供了了自己的异常类，除了 第 5.1.2 节 中描述的两个构造函数外，还应该提供以下构造函数：\n\n```java\npublic\
  \ class FileFormatException extends IOException {\n    ...\n    public FileFormatException(Throwable\
  \ cause) { initCause(cause); }\n    public FileFormatException(String message, Throwable\
  \ cause) {\n        super(message);\n        initCause(cause);\n    }\n}\n```\n\n\
  如果在一个不允许抛出受检异常的方法中发生了受检异常，链链技术同样有用。你可以捕获该受检异常并将其链到一个未检异常（unchecked exception）中。\n\
  \n### 5.1.8. 未捕获异常与堆栈轨迹\n\n如果异常在任何地方都没有被捕获，就会显示 `stack trace`（堆栈轨迹）——异常抛出处所有等待执行的方法调用列表。堆栈轨迹会被发送到\
  \ `System.err`，即错误消息的流。\n\n如果你想将异常保存到其他地方，以便你的技术支持人员检查，可以设置默认的未捕获异常处理器：\n\n```java\n\
  Thread.setDefaultUncaughtExceptionHandler((thread, ex) -> {\n    Record the exception\n\
  });\n```\n\n未捕获的异常会终止发生它的线程。如果你的应用程序只有一个线程（你到目前看到的程序都是如此），那么程序在调用未捕获异常处理器后将会退出。\n\
  \n有时，你被迫捕获一个异常，但并真的不知道该如何处理它。例如，`Class.forName` 方法抛出了一个你需要处理的受检异常。与其忽略该异常，至少应该打印堆栈轨迹：\n\
  \n```java\ntry {\n    Class<?> cl = Class.forName(className);\n    ...\n} catch\
  \ (ClassNotFoundException ex) {\n    ex.printStackTrace();\n}\n```\n\n如果你想存储异常的堆栈轨迹，可以如下将其放入字符串中：\n\
  \n```java\nvar out = new ByteArrayOutputStream();\nex.printStackTrace(new PrintWriter(out));\n\
  String description = out.toString();\n```\n\n如果你需要更详细地处理堆栈轨迹，请使用 `StackWalker` 类。例如，以下代码会打印所有的栈帧：\n\
  \n```java\nStackWalker walker = StackWalker.getInstance();\nwalker.forEach(frame\
  \ -> System.err.println(\"Frame: \" + frame));\n```\n\n你也可以详细分析 `StackWalker.StackFrame`\
  \ 实例。详情请参 API 文档。\n\n### 5.1.9. 用于抛出异常的 API 方法\n\n`Objects` 类有一个方法可以方便参数进行空检查。这里有一个示例用法：\n\
  \n```java\npublic void process(String direction) {\n    this.direction = Objects.requireNonNull(direction);\n\
  \    ...\n}\n```\n\n如果 `direction` 为 `null`，则会抛出一个 `NullPointerException`。初看之下，这似乎有点没意义，因为在使用该值时最终也会抛出\
  \ `NullPointerException`。但考虑从堆栈轨迹回溯：当你看到 `requireNonNull` 的调用是罪魁祸首时，你立刻知道自己哪里错了。\n\
  \n你也可以为异常提供一个消息字符串：\n\n```java\nthis.direction = Objects.requireNonNull(direction,\
  \ \"direction must not be null\");\n```\n\n该方法的变体允许你提供一个备用值而不是抛出异常：\n\n```java\n\
  this.direction = Objects.requireNonNullElse(direction, \"North\");\n```\n\n仅在需要时计算备用值，请使用以下变体：\n\
  \n```java\nthis.directory = Objects.requireNonNullElseGet(directory,\n    () ->\
  \ System.getProperty(\"user.dir\"));\n```\n\nLambda 表达式在 `directory` 为 `null` 时才会被求值。\n\
  \n还有一个用于进行范围检查的方法：\n\n```java\nthis.index = Objects.checkIndex(index, length);\n\
  ```\n\n如果索引在 0 到 `length - 1` 之间，该方法返回该索引；否则抛出 `IndexOutOfBoundsException`。\n\n\
  ## 5.2. 断言 (Assertions)\n\n断言是一种常用的防御性编程习惯。假设你确信某个属性已满足，并在代码中依赖该属性。例如，你确信 `x` 不是负数。此时，你可能正在计算\n\
  \n```java\ndouble y = Math.sqrt(x);\n```\n\n你确信 `x` 不是负数。然而，你想要进行检查，而不是让“负数”浮点值进入你的计算。你当然可以抛出一个异常：\n\
  \n```java\nif (x < 0) throw new IllegalStateException(x + \" < 0\");\n```\n\n但这种条件在测试完成后仍然留在程序中，会减慢运行速度。断言机制允许你在测试期间放置检查，并在生产代码中自动移除它们。\n\
  \n在 Java 中，断言旨在作为验证内部假设的辅助，而不是强制约的机制。例如，如果你想报告公共方法的参数不当，不要使用断言，而是抛出 `IllegalArgumentException`。\n\
  \n### 5.2.1. 使用断言\n\nJava 中断言语句有两种形式：\n\n```java\nassert condition;\nassert condition\
  \ : expression;\n```\n\n`assert` 语句评估条件，如果为假，则抛出 `AssertionError`。在第二种形式中，表达式会被转换为字符串作为错误对象的消息。\n\
  \n如果表达式是 `Throwable`，它也会被设置为断言错误的原因（参见 第 5.1.7 节）。\n\n例如，为了断言 `x` 为非负，你可以直接使用语句\n\
  \n```java\nassert x >= 0;\n```\n\n或者你可以将 `x` 的实际值传入 `AssertionError` 对象，以便后续显示：\n\
  \n```java\nassert x >= 0 : x;\n```\n\n### 5.2.2. 启用和禁用断言\n\n默认情况下，断言是禁用的。在运行程序时通过\
  \ `-enableassertions` 或 `-ea` 选项启用它们：\n\n```bash\njava -ea MainClass\n```\n\n你不需要重新编译程序，因为启用或禁用断言是由类加载器处理的。禁用断言时，类加载器会移除断言代码，这样就不会影响执行速度。你甚至可以针对类或整个包启用断言，例如：\n\
  \n```bash\njava -ea:MyClass -ea:com.mycompany.mylib... MainClass\n```\n\n此命令开启了\
  \ `MyClass` 类以及 `com.mycompany.mylib` 包及其子包的断言。`-ea...` 开启了默认包中所有类的断言。\n\n\n\n\n\
  \n你也可以使用 `-disableassertions` 或 `-da` 选项禁用某些类和包中的断言：\n\n```\njava -ea:... -da:MyClass\
  \ MainClass\n```\n\n当你使用 `-ea` 和 `-da` 来启用或禁用所有断言（而不仅仅是特定的类或包）时，它们不会应用于未通过类加载器加载的“系统类”。使用\
  \ `-enablesystemassertions`/`-esa` 来启用系统类中的断言。\n\n你也可以通过以下方法程序地控制类加载器的断言状态：\n\n\
  ```\nvoid ClassLoader.setDefaultAssertionStatus(boolean enabled);\nvoid ClassLoader.setClassAssertionStatus(String\
  \ className, boolean enabled);\nvoid ClassLoader.setPackageAssertionStatus(String\
  \ packageName, boolean enabled);\n```\n\n与 `-enableassertions` 命令行选项一样，`setPackageAssertionStatus`\
  \ 方法会设置给定包及其子包的断言状态。\n\n## 5.3. 日志 (Logging)\n\n每个 Java 程序员都熟悉在疑问题代码中插入 `System.out.println`\
  \ 调用的过程，以了解程序的行为。当然，一旦你找到了问题的原因，就会移除这些打印语句——只会在下一个问题出现时再次把它们放回来。日志框架的设计旨在解决这个问题。\n\
  \n### 5.3.1. 你应该使用 Java 日志框架吗？\n\nJava 有一个标准的日志框架，通常以其包名 `java.util.logging` 命名，有时缩写为\
  \ `j.u.l`。然而，其他日志框架具有更多功能且被广泛，例如 Log4j (https://logging.apache.org/log4j/2.x) 和\
  \ Logback (https://logback.qos.ch)。\n\n如果你想让你的代码的用户选择日志框架，那么你应该使用一个“面层”（façade）库，将日志消息发送到首选的框架。一个常用且\
  \ API 良好的面层是 SLF4J (https://www.slf4j.org)。另一个面层是“平台日志 API”（也称为 JEP 246）。它非常基础，但是\
  \ JDK 的一部分。该面层有时被称为 `frontend`（前端）。它提供了程序员用于记录消息的 API。`backend`（后端）负责过滤和格式化消息，并将其放置在某处。后端需要部署者进行配置，通常是通过编辑配置文件来实现。\n\
  \n在接下来的章节中，我将向你展示如何使用平台日志 API 作为前端并将 `java.util.logging` 作为后端。如果你发现前端 API 足够用，那么这是一个合理的选择，因为你可以随时更换后端。\n\
  \n`java.util.logging` 后端的功能比它更流行的替代方案少，但它适用于许多用例。由于它的简单性，它不容易受到攻击。相比之下，Log4j 的某些晦涩功能允许黑客构建程序输入，这些输入在被记录时会导致恶意代码执行。\n\
  \n无论你最终是否使用它们，学习平台日志 API 和 `java.util.logging` 后端都能为你提供关于日志框架能力的一个良好基础。\n\n### 5.3.2.\
  \ 日志入门 (Logging 101)\n\n平台日志器实现了 `System.Logger` 接口。每个日志器都有一个名称。该名称可以是任意的，但它通常是生成日志消息的类的包名。你可以这样获取一个平台日志器：\n\
  \n```\nSystem.Logger logger = System.getLogger(\"com.mycompany.myapp\");\n```\n\n\
  当你第一次请求具有给定名称的日志器时，它会被创建。对相同名称的后续调用将产生相同的日志器对象。\n\n现在你已经准备好记录日志了：\n\n```\nlogger.log(System.Logger.Level.INFO,\
  \ \"Opening file \" + filename);\n```\n\n记录打印出来如下：\n\n```\nAug 04, 2022 09:53:34\
  \ AM com.mycompany.myapp read\nINFO: Opening file data.txt\n```\n\n注意，时间以及调用类和方法名会自动包含在内。\n\
  \n在程序部署时关闭这些信息消息，你可以配置后端。对于 `java.util.logging` 后端，请准备一个包含以下内容的 `logging.properties`\
  \ 文件：\n\n```\nhandlers=java.util.logging.ConsoleHandler\ncom.mycompany.myapp.level=WARNING\n\
  ```\n\n然后这样启动应用程序：\n\n```\njava -Djava.util.logging.config.file=logging.properties\
  \ com.mycompany.myapp.Main\n```\n\n由于 `INFO` 级别低于 `WARNING` 级别，该消息不再显示。\n\n获取日志器和记录消息的\
  \ API 是前端的一部分——在本例中，是平台日志 API。如果你使用不同的前端，API 将是不同的。\n\n消息的目的地、格式化和过滤以及配置机制是后端的一部分——在这里是\
  \ `java.util.logging`。如果你使用不同的后端，请遵循其说明进行配置。\n\n### 5.3.3. 平台日志 API (The Platform\
  \ Logging API)\n\n正如你在上一节中看到的，每条记录的消息都有一个级别。枚举 `System.Logger.Level` 有以下值，按严重程度递减：`ERROR`、`WARNING`、`INFO`、`DEBUG`\
  \ 和 `TRACE`。\n\n通过导入语句\n\n```\nimport static java.lang.System.Logger.Level.*;\n\
  ```\n\n你可以简短级别：\n\n```\nlogger.log(INFO, \"Opening file \" + filename);\n    //\
  \ 代替 System.Logger.Level.INFO\n```\n\n在上面的示例中，即使消息被抑制，字符串 `\"Opening file \" + filename`\
  \ 会被创建。如果你担心创建字符串的成本，可以使用 lambda 表达式：\n\n```\nlogger.log(INFO, () -> \"Opening file\
  \ \" + filename);\n```\n\n这样消息只在实际被记录时才会计算。\n\n记录异常是常见操作：\n\n```\ncatch (IOException\
  \ ex) {\n    logger.log(WARNING, \"Cannot open file \" + filename, ex);\n}\n```\n\
  \n你可以使用模式格式化消息：\n\n```\nlogger.log(WARNING, \"Cannot open file {0}\", filename);\n\
  ```\n\n这*不是* `printf` 风格的模式。该模式是由用于本地化的 `MessageFormat` 类处理的。\n\n\n\n\n\n| 如果此日志器按指定的级别处理日志，则调用提供者并记录结果和可抛出的异常。\
  \ |\n\n```\nvoid log(System.Logger.Level level,\n    String format, Object... params)\n\
  ```\n\n| 使用给定的参数记录格式化消息。 |\n\n```java\nvoid log(System.Logger.Level level,\n   \
  \ ResourceBundle bundle, String msg,\n    Throwable thrown)\n```\n\n| 记录 bundle\
  \ 中键为 `msg` 的消息（如果 `bundle` 为 `null`，则使用 `msg` 本身）以及可抛出的异常。 |\n\n```java\nvoid log(System.Logger.Level\
  \ level,\n    ResourceBundle bundle, String format,\n    Object... params)\n```\n\
  \n| 在 bundle 中查找键为 `format` 的格式（如果 `bundle` 为 `null`，则使用 `format` 本身），并使用给定的参数记录格式化消息。\
  \ |\n\n### 5.3.4. 配置配置\n\n让我们转向后端。正如前面提到的，平台日志 API 的默认后端是 `java.util.logging`。后续章节中的信息适用于该后端。\n\
  \n你可以通过编辑配置文件来更改后端的各种属性。默认配置文件位于 JDK 中的 `conf/logging.properties`。要使用另一个文件，请在启动应用程序时通过将\
  \ `java.util.logging.config.file` 属性设置为文件位置：\n\n```\njava -Djava.util.logging.config.file=configFile\
  \ MainClass\n```\n\n在 `main` 方法中调用 `System.setProperty(\"java.util.logging.config.file\"\
  , configFile)` 是无效的，因为日志管理器是在 VM 启动期间初始化的，早于 `main` 的执行。\n\n你可以通过添加如下的行来为你自己的日志器指定日志级别：\n\
  \n```\ncom.mycompany.myapp.level=WARNING\n```\n\n即，在日志器名称后附加 `.level` 后缀。\n\n日志配置中的属性不是系统属性。你不能通过\
  \ `-D` 命令行选项设置它们。相反，请将日志属性存放在一个文件中，并通过 `-Djava.util.logging.config.file=configFile`\
  \ 指定该文件。\n\n你还可以指定根级别：\n\n```\n.level=WARNING\n```\n\n由于历史原因，某些级别在平台日志 API 和 `java.util.logging`\
  \ 框架中的名称不同。表 5.2 显示了对应关系。\n\n表 5.2：平台日志与 Java 日志框架的对应级别\n\n| 平台日志 | `java.util.logging`\
  \ |\n| --- | --- |\n| `ERROR` | `SEVERE` |\n| `WARNING` | `WARNING` |\n| `INFO`\
  \ | `INFO` |\n| `DEBUG` | `FINE` |\n| `TRACE` | `FINER` |\n\n与包名类似，日志器名称是层次级的。事实上，它们比包更具层次性。包和它的父包之间没有语义关系，但日志器的父子日志器共享某些属性。例如，如果你关闭了发送\
  \ `\"com.mycompany\"` 日志器的消息，那么它的子日志器也会被禁用。\n\n正如你将在下一节中看到的，日志器实际上并没有将消息发送到控制台——那是处理器（handlers）的工作。处理器也有级别。若要在控制台上看到\
  \ `DEBUG`/`FINE` 消息，你还需要设置：\n\n```\njava.util.logging.ConsoleHandler.level=FINE\n\
  ```\n\n日志管理器配置中的设置不是系统属性。使用 `-Dcom.mycompany.myapp.level=FINE` 启动程序对日志器没有任何影响。\n\
  \n还可以通过使用 `jconsole` 程序在运行中的程序中更改日志级别。详情请见 www.oracle.com/technetwork/articles/java/jconsole-1564139.xhtml#LoggingControl。\n\
  \n### 5.3.5. 日志处理器\n\n`java.util.logging` API 的后端基于 `handlers`。最简单的处理器是 `ConsoleHandler`，它将日志记录打印到\
  \ `System.err` 流。\n\n每个处理器都有一个父处理器。默认情况下，处理器只是将每个记录发送给父处理器。标准日志配置默认使用 `ConsoleHandler`。它的默认日志级别是\
  \ `INFO`。\n\n要将日志记录发送到其他地方，请添加另一个处理器。`java.util.logging` API 为此提供了两个处理器：`FileHandler`\
  \ 和 `SocketHandler`。`SocketHandler` 将记录发送到指定的主机和端口。更有趣是在文件中收集记录的 `FileHandler`。\n\
  \n要添加文件处理器，请在日志属性中提供此条目：\n\n```\nhandlers=java.util.logging.ConsoleHandler,java.util.logging.FileHandler\n\
  ```\n\n记录被发送到用户目录下的文件 `java.log`，其中 `n` 是一个使文件唯一的数字。默认情况下，记录是以 XML 格式格式化的。典型的日志记录的形式如下：\n\
  \n```\n<record>\n    <date>2014-08-04T09:53:34</date>\n    <millis>1407146014072</millis>\n\
  \    <sequence>1</sequence>\n    <logger>com.mycompany.myapp</logger>\n    <level>INFO</level>\n\
  \    <class>com.horstmann.corejava.Employee</class>\n    <method>read</method>\n\
  \    <thread>10</thread>\n    <message>Opening file staff.txt</message>\n</record>\n\
  ```\n\n你可以通过在日志配置中设置各种参数来修改处理器的默认行为。记录被发送到用户目录下的文件 `java.log`，其中 `n` 是一个使文件唯一的数字。默认情况下，记录是以\
