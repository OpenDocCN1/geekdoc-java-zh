  \ 编写一个 `switch` 语句，当给定指南针方向 `\"N\"`、`\"S\"`、`\"E\"` 或 `\"W\"` 的字符串时，调整变量 `x` 和 `y`。例如，`\"\
  W\"` 应让 `x` 减 1。\n14. 你可以在 `switch` 语句在使用 `break` 而不产生贯穿（fall-through）吗？在 `switch`\
  \ 表达式中呢？为什么或为什么不？\n15. 想出一个用的场景，其中贯穿行为对 `switch` 表达式或语句是有益的。大多数网络搜索结果产生的示例对 C 或\
  \ C++ 有意义，在这些语言中，执行会从没有任何操作的 `case A` 到 `case B`。在 Java 中，这并不显著，因为你可以使用 `case A,\
  \ B`。\n16. “Quine”是一个在不读取任何输入或文件的情况下打印自身源代码的程序。使用 Java 中的文本块（text block）编写这样一个程序。\n\
