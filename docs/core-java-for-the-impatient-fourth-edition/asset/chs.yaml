  ISBN-13: 978-0-13-540454-6\n\n致 Chi——我生命中最有耐心的人。\n\n# 目录\n\n# 前言\n\n自 1996 年最初发布以来，Java\
  \ 经历了许多变化。经典著作《核心 Java》详尽地涵盖了不仅是语言本身，还有所有核心库以及版本之间的众多变化，跨越两卷，超过 2000 页。然而，如果你只想在现代\
  \ Java 中提高效率，那么学习这种语言和核心库有一条更快、更简单的路径。在本书中，我不会追溯历史，也不纠结于过去版本的特性。我向你展示今天 Java 的优点，以便你能够快速将知识付诸实践。与我之前的“急躁者”系列书籍一样，我直切主题，向你展示解决编程问题需要的知识，而不是对某一种范式优于另一种范式进行说教。我还将信息分成若干小块进行组织，以便你在需要时可以快速检索。\n\
  \n假设你精通其他某种编程语言，例如 `Python`、`C++`、`JavaScript`、`Swift`、`PHP` 或 `Ruby`，通过这本书将学习如何成为一名胜任的\
  \ Java 程序员。我涵盖了开发者今天需要的所有 Java 方面，包括 lambda 表达式和流等强大概念，以及如 `records` 和模式匹配等现代结构。\n\
  \n本书已完全更新至 `Java 21`。它使用了现代特性，不再纠结于历史或过时的结构。未来可能进入语言的预览特性也未涵盖。\n\n使用 Java 的关键原因之一是处理并发编程。随着\
  \ Java 库中现有的并行算法和线程安全数据结构，应用程序程序员处理并发编程的方式已经完全改变。我提供了全新的涵盖，向你展示如何使用强大的库功能，而不是易错的底层结构。\n\
  \n传统上，Java 书籍侧重于用户界面编程，但现在很少有开发者在桌面计算机上制作用户界面。你将能够有效地使用这本书，而不会被冗长的 `GUI` 代码分散注意力。\n\
  \n最后，本书是为应用程序程序员写的，而不是为了大学课程，也不是为了系统架构师。书中涵盖了应用程序程序员需要斗争的问题，例如日志记录和文件操作，但你不会学习如何手动实现链表或如何编写\
  \ Web 服务器。\n\n我希望你喜欢这段对现代 Java 的快速介绍，希望它能让你的工作高效。\n\n如果你发现错误或有改进建议，请访问 `http://horstmann.com/javaimpatient`，进入错误页面并留言。请务必访问该网站以下载可运行的代码示例。\n\
