  static CompletableFuture<Void>\n    CompletableFuture.allOf(CompletableFuture<?>...\
  \ cfs)\n```\n\n并不产生参数的结果，这使得使用起来有些不方便。实现一个合并相同类型完成未来的的方法：\n\n```java\nstatic <T>\
  \ CompletableFuture<List<T>>\n    allOf(List<CompletableFuture<T>> cfs)\n```\n\n\
  注意此方法有一个 `List<T>` 参数，因为不能对泛型类型使用变长参数。\n\n\n\n\n```java\nstatic CompletableFuture<Object>\
  \ \n    CompletableFuture.anyOf(CompletableFuture<?>... cfs)\n```\n\n当参数中的任何一个完成（无论是正常完成还是异常）时，它就会返回。这与\
  \ `ExecutorService.invokeAny` 有显著不同，后者会持续执行直到其中一个任务成功完成，这导致该方法无法用于并发搜索。实现一个方法：\n\
  \n```java\nstatic CompletableFuture<T>\n    anyOf(List<Supplier<T>> actions, Executor\
  \ exec)\n```\n\n该方法返回第一个实际结果，或者如果所有操作都带异常完成，则抛出 `NoSuchElementException`。\n\n32.\
  \ 实现 `sleep sort`（睡眠排序），这是人类已知最糟糕的排序算法之一。给定一个正整数数组，为每个值 `v` 启动一个线程，该线程睡眠 `v` 秒，然后将该值添加到阻塞队列中。当所有元素都添加后，打印队列。\n\
  \n# 第 11 章 ▪ 注解 (Annotations)\n\n注解是你插入到源代码中的标签，以便某些工具能够对其进行处理。这些工具可以在源码级别进行操作，也可以处理编译器已在类文件中放置注解的类文件。\n\
  \n注解不会改变程序的编译方式。无论是否带有注解，Java 编译器都会生成相同的虚拟机指令。\n\n要从注解中获益，你需要先选择一个处理工具，并使用该处理工具理解的注解，然后将该工具应用到你的代码中。\n\
  \n注解有广泛用途。例如，JUnit（可在 [`junit.org`](https://junit.org)）使用注解来标记执行测试的方法，并指定如何运行测试。Jakarta\
  \ Persistence ([`jakarta.ee/specifications/persistence/`](https://jakarta.ee/specifications/persistence/))\
  \ 使用注解来定义类与数据库表之间的映射，以便对象无需编写 SQL 查询即可自动持久化。\n\n在本章中，你将学习注解语法的细节、如何定义自己的注解，以及如何编写在源码级别或运行时运行的注解处理器。\n\
  \n为了了解注解的引人用途，请查看 `JCommander` ([`jcommander.org`](https://jcommander.org)) 和 picocli\
  \ ([`picocli.info`](https://picocli.info))。这些库使用注解来处理命令行参数。\n\n本章的要点是：\n\n1. 你可以像使用\
  \ `public` 或 `static` 等修饰符一样对声明进行注解。\n2. 你还可以对声明、类型转换、`instanceof` 检查或方法引用的类型进行注解。\n\
  3. 注解以 `@` 符号开始，并可能包含称为元素（elements）的键值对。\n4. 注解值必须是编译时常量：原始类型、`enum` 常量、`Class`\
  \ 字面量、其他注解或它们的数组。\n5. 一个项目可以有重复的注解或不同类型的注解。\n6. 要定义注解，请指定一个注解接口，其方法与注解元素对应。\n7.\
  \ Java 库定义了十多个注解，注解在 Java 企业版（Java Enterprise Edition）中被广泛使用。\n8. 在运行的 Java 程序中处理注解，可以使用反射并查询反射项的注解。\n\
  9. 注解处理器在编译期间处理源文件，使用 Java 语言模型 API 来位定带注解的项。\n\n## 11.1. 使用注解\n\n这是一个简单注解的示例：\n\
  \n```java\nclass CacheTest {\n    ...\n    @Test public void checkRandomInsertions()\n\
  }\n```\n\n注解 `@Test` 标注了 `checkRandomInsertions` 方法。在 Java 中，注解用法类似于修饰符（如 `public`\
  \ 或 `static`）。每个注解的之前都有一个 `@` 符号。\n\n`@Test` 注解本身什么都不做。它需要一个工具才有用。当运行 JUnit 时，它会找到用\
  \ `@Test` 标记的方法并调用它们。\n\n### 11.1.1. 注解元素\n\n注解可以拥有称为元素的键值对，例如：\n\n```java\n@RepeatedTest(value=10,\
  \ failureThreshold=3)\n```\n\n允许的元素名称和类型由每个注解定义（参见 第 11.2 节）。元素可以由读取注解的工具进行处理。\n\
  \n注解元素是以下类型之一：\n\n* 原始类型值\n* `String`\n* `Class` 对象\n* `enum` 实例\n* 另一个注解\n* 前述类型的数组（但不是数组的数组）\n\
  \n为了说明这些可能性，这里有一个 `@BugReport` 注解，并非来自实际库：\n\n```java\n@BugReport(showStopper=true,\n\
  \    assignedTo=\"Harry\",\n    testCase=CacheTest.class,\n    status=BugReport.Status.CONFIRMED,\n\
  \    ref=@Reference(id=11235811),\n    reportedBy={\"Harry\", \"Fred\"})\n```\n\n\
  由于注解是由编译器处理的，所有元素值必须是编译时常量。\n\n注解元素永远不能为 `null` 值。\n\n如果元素值是一个只有一个元素的数组，你可以省略大括号：\n\
  \n```java\n@BugReport(reportedBy=\"Harry\") // 等于 reportedBy={\"Harry\"}\n```\n\n\
  元素可以有默认值。例如，JUnit `@RepeatedTest` 注解的 `failureThreshold` 元素默认值为 `Integer.MAX_VALUE`。因此，注解\
  \ `@RepeatedTest(value=10)` 等同于 `@RepeatedTest(value=10, failureThreshold=Integer.MAX_VALUE)`。\n\
  \n如果元素名称是 `value` 且这是你指定的唯一元素，你可以省略 `value=`。例如，`@RepeatedTest(10)` 等同于 `@RepeatedTest(value=10)`。\n\
  \n### 11.1.2. 重复注解\n\n一个项目可以有多个注解：\n\n```java\n@Test\n@Tag(\"localized\")\nvoid\
  \ testHello()\n```\n\n如果注解的作者将其声明为可重复，你可以多次重复同一个注解：\n\n```java\n@Tag(\"localized\"\
  )\n@Tag(\"showstopper\")\nvoid testHello()\n```\n\n### 11.1.3. 注解声明\n\n到为止，你已经看到了应用于方法声明的注解。注解在许多其他地方也可以出现。它们分为两类：声明和类型使用。声明注解可以出现在\n\
  \n* 类（包括 `enum`）和接口（包括注解接口）的声明\n* 方法\n* 构造函数\n* 实例变量（包括 `enum` 常量）\n* 局部变量（包括在 `for`\
  \ 和 try-resources 语句中声明的变量）\n* catch 子句参数\n* 类型参数\n* 包\n\n对于类、接口和模块，将注解放在 `class`、`interface`\
  \ 或 `module` 关键字以及任何修饰符之前：\n\n```java\n@Entity public class User { ... }\n```\n\n\
  对于变量，将它们放在类型之前：\n\n```java\n@SuppressWarnings(\"unchecked\") List<User> users =\
  \ ...;\npublic User getUser(@Param(\"id\") String userId)\n```\n\n这同样适用于记录组件：\n\n\
  ```java\npublic record Rectangle(@ToString(includeName=false) Point topLeft,\n \
  \  int width, int height) {}\n```\n\n泛型类或方法中的类型参数可以这样注解：\n\n```java\npublic class\
  \ Cache<@NonNullV> { ... }\n```\n\n包在 `package-info.java` 文件中注解，该文件仅包含由注解之前的包语句。\n\
  \n```java\n/**\n    包级文档\n*/\n@Generated(\"com.horstmann.generator\")\npackage com.horstmann.corejava.generated;\n\
  import javax.annotation.processing.Generated;\n```\n\n注意注解的 `import` 语句在 `package`\
  \ 声明之后。\n\n局部变量和包的注解在编译时会被丢弃。因此，它们只能在源码级别进行处理。\n\n### 11.1.4. 注解类型使用\n\n声明注解提供了有关被声明项的一些信息。例如，在以下声明中\n\
  \n\n\n\n\n```java\npublic User getUser(@NonNull String userId)\n```\n\n此处断言 `userId`\
  \ 参数非 `null`。\n\n`@NonNull` 注解是 Checker Framework (http://types.cs.washington.edu/checker-framework)\
  \ 的一部分。该框架允许你可以在程序中包含断言，例如某个参数为非 `null`，或者某个 `String` 已经过本地化——即已根据用户的本地语言和习惯进行了适配。然后，静态分析工具会检查这些断言在给定的源代码体中是否有效。\n\
  \n现在假设我们有一个类型为 `List<String>` 的参数，想要表示所有的字符串都非 `null`。这正是类型使用注解（type use annotations）大显身场。将注解放在类型参数之前：`List<@NonNull\
  \ String>`。\n\n类型使用注解可以出现在以下位置：\n\n*   泛型类型参数中：`List<@NonNull String>`, `Comparator.<@NonNull\
  \ String> reverseOrder()`。\n*   数组的任何位置：`@NonNull String[][] words` (`words[i][j]`\
  \ 不是 `null`），`String @NonNull [][] words` (`words` 不是 `null`），`String[] @NonNull\
  \ [] words` (`words[i]` 不是 `null`)。\n*   父类和实现的接口中：`class Warning extends @Localized\
  \ Message`。\n*   构造器调用中：`new @Localized String(...)` 。\n*   嵌套类型中：`Map.@Localized\
  \ Entry`。\n*   强制类型转换和 `instanceof` 检查中：`(@Localized String) text`, `if (text instanceof\
  \ @Localized String)`。（这些注解仅供外部工具使用。它们对强制类型转换或 `instanceof` 检查的行为没有影响。）\n*   异常规范中：`public\
  \ String read() throws @Localized IOException`。\n*   通配符和类型边界中：`List<@Localized\
  \ ? extends Message>`, `List<? extends @Localized Message>`。\n*   方法和构造器引用中：`@Localized\
  \ Message::getText`。\n\n有几个类型位置是无法被注解的：\n\n```\n@NonNull String.class // 错误—不能注解类字面量\n\
  import java.@NonNull String; // 错误—不能注解导入语句\n```\n\n你可以将注解放在 `private` 和 `static`\
  \ 等其他修饰符之前或之后。按照惯例（但不是强制），会将类型使用注解放在其他修饰符之后，并将声明放在其他修饰符之前。例如：\n\n```java\nprivate\
  \ @NonNull String text; // 注解类型\n@Id private String; // 注解变量\n```\n\n正如你将在第 11.2\
  \ 节中看到的，注解作者需要指定特定注解可以出现的位置。如果一个注解既可以用于变量也可以用于类型使用，并且在声明中使用它，那么该变量和该类型使用都会被注解。例如，考虑\n\
  \n```java\npublic User(@NonNull String userId)\n```\n\n如果 `@NonNull` 均可应用于参数和类型使用，那么\
  \ `userId` 参数会被注解，且参数类型为 `@NonNull String`。\n\n### 11.1.5 让接收者显式化 (Making Receivers\
  \ Explicit)\n\n假设你想对未被方法修改的参数进行注解。\n\n```java\npublic class Point {\n    public\
  \ boolean equals(@Nullable Object other) { ... }\n}\n```\n\n那么，处理此注解的工具在看到调用 `p.equals(q)`\
  \ 时，知道 `q` 没有变化。但 `p` 呢？\n\n当方法被调用时，接收者变量 `this` 被绑定到 `p`，但 `this` 从未被声明，因此你无法对其进行注解。实际上，你可以通过一种很少使用的变体来声明它，以便添加注解：\n\
  \n```java\npublic class Point {\n    public boolean equals(@NonNull Point this,\
  \ @Nullable Object other) { ... }\n}\n```\n\n第一个参数被称为接收者参数（receiver parameter）。它必须命名为\
  \ `this`。它的类型是正在构造的类。你只能为方法提供接收者参数，不能为构造器提供。从概念上讲，在构造器完成之前，`this` 引用并不是给定类型的对象。相反，放置在构造器上的注解描述的是所构造对象的属性。\n\
  \n一个隐藏参数会被传递给内部类的构造器，即外部类的引用。你也可以让这个参数显式化：\n\n```java\nstatic class Sequence {\n\
  \    private int from;\n    private int to;\n\n    class Iterator implements java.util.Iterator<Integer>\
  \ {\n        private int current;\n\n        public Iterator(@NonNull Sequence this)\
  \ {\n            this.current = Sequence.from;\n        }\n    }\n}\n```\n\n该参数的命名必须与你引用它时一致（`EnclosingClass.this`），且其类型是外部类。\n\
  \n## 11.2 定义注解 (Defining Annotations)\n\n每个注解都必须由注解接口声明，使用 `@interface` 语法。接口的方法对应于注解的元素。例如，`RepeatedTest`\
  \ 注解由以下接口定义：\n\n```java\n@Target(ElementType.METHOD)\n@Retention(RetentionPolicy.RUNTIME)\n\
  public @interface RepeatedTest {\n    int failureThreshold();\n}\n```\n\n`@interface`\
  \ 声明创建了一个真正的 Java 接口。处理注解的工具接收到实现该注解接口的对象。当 JUnit 运行器获取一个实现 `Test` 接口的对象时，它简单地调用\
  \ `failureThreshold` 方法来获取特定 `RepeatedTest` 注解的失败阈值。\n\n注解接口中的元素声明实际上是方法声明。注解接口的方法不能有参数，不能有\
  \ `throws` 子句，并且不能是泛型的。\n\n`@Target` 和 `@Retention` 注解是元注解（meta-annotations）。它们注解了\
  \ `RepeatedTest` 注解，指示了该注解可以出现的位置。\n\n`@Target` 注解的值是 `ElementType` 对象的数组，指定了注解可以应用的项。你可以指定任意数量的元素类型并用大括号包裹。例如：\n\
  \n```java\n@Target({ElementType.FIELD, ElementType.RECORD_COMPONENT, ElementType.TYPE})\n\
  public @interface ToString\n```\n\n表 11.1 显示了所有可能的目标。编译器会检查你是否在允许的地方使用注解。例如，如果将\
  \ `@ToString` 应用于方法，会导致编译错误。\n\n没有 `@Target` 限制的注解可以用于任何声明，但不能用于类型参数和类型使用。（这些是在支持注解的第一个\
  \ Java 版本中唯一的可能目标。）\n\n表 11.1：@Target 注解的元素类型\n\n| 元素类型 | 应用于 |\n| --- | --- |\n\
  | `ANNOTATION_TYPE` | 注解类型声明 |\n| `PACKAGE` | 包 |\n| `MODULE` | 模块 |\n| `TYPE` |\
  \ 类（包括枚举）、接口（包括注解类型） |\n| `METHOD` | 方法 |\n| `CONSTRUCTOR` | 构造器 |\n| `FIELD` |\
  \ 实例（包括枚举常量） |\n| `PARAMETER` | 方法或构造器参数 |\n| `RECORD_COMPONENT` | 记录组件 |\n| `LOCAL_VARIABLE`\
  \ | 局部变量 |\n| `TYPE_PARAMETER` | 类型参数 |\n| `TYPE_USE` | 类型的使用 |\n\n当你对记录组件进行注解时，该注解会被应用于该组件产生的字段和方法，前提是该注解在字段或方法上是被允许的。例如，在注解中\n\
  \n```java\npublic record Rectangle(@ToString(includeName=false) Point topLeft,\n\
  \   int width, int height) {}\n```\n\n如果目标类型包含 `ElementType.FIELD`，则 `topLeft` 字段将接收该注解。\n\
  \n`@Retention` 元注解指定了注解何时可以被访问。三种选择：\n\n1.  `RetentionPolicy.SOURCE`：注解对源处理器可用，但不包含在类文件中。\n\
  \n\n\n\n\n2. `RetentionPolicy.CLASS`: 该注解被包含在类文件中，但虚拟机不会加载它们。这是默认值。\n\n3. `RetentionPolicy.RUNTIME`:\
  \ 该注解在运行时可用，并且可以通过反射 API 进行访问。\n\n你将在本章的后半部分看到所有三种场景的示例。\n\n还有其他几种元注解（meta-annotations）——完整列表请参阅第\
  \ 11.3 节。\n\n要为元素指定默认值，请在定义该元素的方法之后添加 `default` 子句。例如：\n\n```java\npublic @interface\
  \ RepeatedTest {\n    int failureThreshold() default Integer.MAX_VALUE;\n    ...\n\
  }\n```\n\n此示例展示了如何标记一个空数组的默认值以及一个注解的默认值：\n\n```java\npublic @interface BugReport\
  \ {\n    String[] reportedBy() default {};\n        // 默认是一个空数组\n    Reference ref()\
  \ default @Reference(id=0);\n        // 注解的默认值    \n    ...\n}\n```\n\n默认值并不存储在注解中；而是被动态计算的。如果你更改了默认值并重新编译注解类，所有被注解的元素都将使用新的默认值，即使是在默认值更改之前已经编译过的类文件中也是如此。\n\
  \n所有注解接口都隐式地扩展了 `java.lang.annotation.Annotation` 接口。该接口是一个普通接口，**不是**注解接口。\n\n\
  你不能扩展注解接口，也永远无法提供实现注解接口的类。相反，源码处理工具和虚拟机会在需要时生成代理类和对象。\n\n## 11.3. Java API 中的注解\n\
  \nJava API 在 `java.lang`、`java.lang.annotation` 和 `javax.annotation` 包中定义了许多注解接口。其中四个是元注解，用于描述注解接口的行为。其他的都是普通注解，你用它们来标记源码中的项目。表\
  \ 11.2 显示了这些注解。我将在接下来的两个节中详细讨论它们。\n\n表 11.2：Java API 中的注解\n\n| 注解接口 | 适用范围 | 目的\
  \ |\n| --- | --- | --- |\n| `Override` | 方法 | 检查该方法是否真的重写了父类方法。\n| `Serial` | 方法\
  \ | 检查该方法是否为正确的序列化方法。 |\n| `Deprecated` | 所有声明 | 将项目标记为已用。 |\n| `SuppressWarnings`\
  \ | 包以外的所有声明 | 抑制特定类型的警告。 |\n| `SafeVarargs` | 方法和构造函数 | 断言变长参数的使用是安全的。 |\n| `FunctionalInterface`\
  \ | 接口 | 标记接口为函数式接口（具有单个抽象方法）。 |\n| `Generated` | 所有声明 | 标记项目为由工具生成的源码。 |\n| `Target`\
  \ | 注解 | 指定该注解可以应用的位置。 |\n| `Retention` | 注解 | 指定该注解可以使用的地方。 |\n| `Documented` |\
  \ 注解 | 指定该注解应该包含在被注解项目的文档中。 |\n| `Inherited` | 注解 | 指定该注解会被子类继承。 |\n| `Repeatable`\
  \ | 注解 | 指定该注解可以多次应用于同一个项目上。 |\n\n### 11.3.1. 用于编译的注解\n\n`@Deprecated` 注解可以附加到任何不再被推荐使用的项目上。当你使用已用项目时，编译器会发出警告。该注解的作用与\
  \ `@deprecated` JavaDoc 标签相同。\n\nJDK 的一部分 `jdeprscan` 工具可以扫描一组 JAR 文件以查找已用元素。\n\n\
  `@Override` 注解让编译器检查被注解的方法是否真的重写了父类中的方法。例如，如果你声明了：\n\n```java\npublic class Point\
  \ {\n    @Override public boolean equals(Point other) { ... }\n    ...\n}\n```\n\
  \n那么编译器将会报错，因为 `equals` 方法没有重写 `Object` 类的 `equals` 方法。\n\n`@Serial` 注解检查方法用于序列化。\n\
  \n`@SuppressWarnings` 注解对包以外的所有声明抑制特定类型的警告，例如：\n\n```java\n@SuppressWarnings(\"\
  unchecked\")\nT[] result = (T[]) Array.newInstance(...)\n```\n\n`@SafeVarargs` 注解断言变长参数的使用是安全的。\n\
  \n`@Generated` 注解旨在供工具。它标记项目为由工具生成的源码，参见第 6 节。该注解包含一个唯一的标识，ISO 8601 格式是可选的。例如：\n\
  \n```java\n@Generated(value=\"horstmann\", date=\"2015-01-04T12:08:56\");\n```\n\
  \n你已经看到 `FunctionalInterface` 注解在第 3 节 中。它用于标记具有单个抽象方法的接口，如 `AutoCloseable`。例如：\n\
  \n```java\n@FunctionalInterface\ninterface IntFunction<R> {\n    R apply(int value);\n\
  }\n```\n\n### 11.3.2. 元注解\n\n你已经在第 11.2 节 中见过 `@Target` 和 `@Retention` 元注解。\n\n\
  `@Documented` 元注解为 JavaDoc 等文档工具提供了提示。文档化注解应该像其他修饰符（如 `private` 或 `static`）一样被处理。相反，其他注解不应该包含在文档中。\n\
  \n例如，`@SuppressWarnings` 注解不是文档。如果方法或字段有该注解，它是 JavaDoc 读者不感兴趣的实现细节。另一方面，`@FunctionalInterface`\
  \ 注解是文档，因为程序员需要知道该接口旨在描述一个函数。图 11.1 显示了文档。\n\n![文档化注解](img/documented.jpg)\n图 11.1：文档化注解\n\
  \n`@Inherited` 元注解仅适用于类的注解。当一个类具有继承注解时，它的所有子类都自动拥有相同的注解。这使得创建类似于标记接口（如 `Serializable`\
  \ 接口）的注解变得简单。\n\n假设定义了一个继承注解 `@Persistent` 表示类的对象可以保存到数据库中。那么持久化类的子类会自动标记为持久化。\n\
  \n```java\n@Inherited @interface Persistent { }\n\n@Persistent class Employee {\
  \ ... }\nclass Manager extends Employee { ... } // 也是 @Persistent\n```\n\n`@Repeatable`\
  \ 元注解允许多次应用同一个注解。例如，JUnit 的 `@Tag` 注解是可以重复的。如下如下：\n\n```java\n@Tag(\"localized\"\
  )\n@Tag(\"showstopper\")\nvoid testHello() { ... }\n```\n\n出于历史原因，重复注解的实现者需要提供一个“容器注解”，将重复的注解存储在数组中。\n\
  \n以下是定义 `@Tag` 注解及其容器的方法：\n\n```java\n@Repeatable(Tag.class)\n@interface Tag\n{\n\
  \   String value();\n}\n\n@interface Tags\n{\n   Tag[] value();\n}\n```\n\n\n\n\n\
  当用户提供两个或多个 `@Tag` 注解时，它们会被自动封装进 `@Tags` 注解中。这增加了处理注解的复杂性，正如你将在下一节中看到的。\n\n## 11.4\
  \ 在运行时处理注解\n\n到为止，你已经了解了如何向源文件添加注解，以及如何定义注解类型。现在是时候看看这些操作能产生什么成果了。\n\n在本节中，我将为你展示一个简单的示例，使用你已经在\
  \ 4 中见过的反射 API 在运行时处理注解。假设我们想减少实现 `toString` 方法的繁琐工作。当然，人们可以使用反射编写一个通用的 `toString`\
  \ 方法，简单地包含所有实例变量的名称和值。但是，假设我们想自定义这个过程。我们可能不想包含所有的实例变量，或者可能想跳过类名和变量名。例如，对于 `Point`\
  \ 类，我们可能更倾向于输出 `[5,10]` 而不是 `Point[x=5,y=10]`。当然，任何数量的其他增强都是可能的，但让我们保持简单。重点是演示注解处理器可以做什么。\n\
  \n使用 `@ToString` 注解标记所有希望从此服务受益类。此外，所有应该包含的实例变量也需要被注解。该注解定义如下：\n\n```\n@Target({ElementType.FIELD,\
  \ ElementType.TYPE})\n@Retention(RetentionPolicy.RUNTIME)\npublic @interface ToString\
  \ {\n    boolean includeName() default true;    \n}\n```\n\n以下是带注解的 `Point` 和 `Rectangle`\
  \ 类：\n\n```\n@ToString(includeName=false)\npublic class Point {\n    @ToString(includeName=false)\
  \ private int x;\n    @ToString(includeName=false) private int y;\n    ...\n}\n\n\
  @ToString\npublic record Rectangle(\n   @ToString(includeName=false) Point topLeft,\n\
  \   @ToString int width,\n   @ToString int height) {\n}\n```\n\n意图是让矩形表示为字符串 `Rectangle[[5,\
  \ 10],width=20,height=30]`。\n\n在运行时，我们无法修改给定类 `toString` 方法的实现。相反，让我们提供一个可以格式化任何对象的方法，如果存在\
  \ `ToString` 注解则发现并使用它们。\n\n关键是 `AnnotatedElement` 接口中的方法：\n\n```\nT getAnnotation(Class<T>)\n\
  T getDeclaredAnnotation(Class<T>)\nT[] getAnnotationsByType(Class<T>)\nT[] getDeclaredAnnotationsByType(Class<T>)\
  \    \nAnnotation[] getAnnotations()\nAnnotation[] getDeclaredAnnotations()\nboolean\
  \ isAnnotationPresent(Class<? extends Annotation> annotationClass)\n```\n\n反射类 `Class`、`Field`、`Parameter`、`Method`、`Constructor`\
  \ 和 `Package` 都实现了该接口。\n\n与其他反射方法一样，名称带有 `Declared` 的方法产生类本身的注解，而其他方法则包含继承的注解。在注解的上下文中，这意味着该注解是\
  \ `@Inherited` 并且应用于超类的。\n\n如果一个注解不是可重复的，调用 `getAnnotation` 来定位它。例如：\n\n```\nClass<?>\
  \ cl = obj.getClass();\nToString ts = cl.getAnnotation(ToString.class);\nif (ts\
  \ != null && ts.includeName()) ...\n```\n\n注意，你传递的是注解的类对象（这里是 `ToString.class`），你返回的是某个实现了\
  \ `ToString` 接口的代理类对象。然后你可以调用接口方法来获取注解元素的值。如果注解不存在，`getAnnotation` 方法返回 `null`。\n\
  \n如果注解是重复的，情况就会变得有点复杂。如果你调用 `getAnnotation` 来查找可重复注解，而该注解实际上是重复的，那么你也会得到 `null`。这是因为重复的注解被封装在容器注解内部。\n\
  \n在这种情况下，你应该调用 `getAnnotationsByType`。该调用会“透视”容器并给你一个包含重复注解的数组。如果只有一个注解，你将得到一个长度为\
  \ 1 的数组。通过这种方法，你不需要担心容器注解的问题。\n\n`getAnnotations` 方法获取与项目被标记的所有注解（无论什么类型），其中重复的注解被封装在容器中。\n\
  \n以下是感知注解的 `toString` 方法的实现：\n\n```\npublic class ToStrings {\n    public static\
  \ String toString(Object obj) {\n        if (obj == null) return \"null\";\n   \
  \     Class<?> cl = obj.getClass();\n        ToString ts = cl.getAnnotation(ToString.class);\n\
  \        if (ts == null) return obj.toString();\n        var result = new StringBuilder();\n\
  \        if (ts.includeName()) result.append(cl.getName());\n        result.append(\"\
  [\");\n        boolean first = true;\n        for (Field f : cl.getDeclaredFields())\
  \ {\n            ts = f.getAnnotation(ToString.class);\n            if (ts != null)\
  \ {\n                if (first) first = false; else result.append(\",\");\n    \
  \            f.setAccessible(true);\n\n                if (ts.includeName()) {\n\
  \                    result.append(f.getName());\n                    result.append(\"\
  =\");\n                }\n                try {\n                    result.append(ToStrings.toString(f.get(obj)));\n\
  \                } catch (ReflectiveOperationException ex) {\n                 \
  \   ex.printStackTrace();\n                }\n            }\n        }\n       \
  \ result.append(\"]\");\n        return result.toString();\n    }\n}\n```\n\n当一个类被注解为\
  \ `ToString` 时，该方法遍历其字段并打印那些也被注解的字段。如果 `includeName` 元素为 `true`，则类名或字段名将包含在字符串中。\n\
  \n注意该方法会递归调用自己。当对象属于一个没有注解的类时，将使用其普通的 `toString` 方法并且递归停止。\n\n这是运行时注解 API 的一个简单但典型的用法。使用反射查找类、字段等；在可能带有注解的元素上调用\
  \ `getAnnotation` 或 `getAnnotationsByType` 来检索注解；然后调用注解接口的方法来获取元素值。\n\n## 11.5 源码级注解处理\n\
  \n在上一节中，你了解了如何分析运行程序中的注解。注解的另一个用途是对源文件进行自动处理，以产生更多的源代码、配置文件、脚本或其他任何可能想要生成的内容。\n\n\
  为了向你展示机制，我将重复生成 `toString` 方法的示例。但这一次，我们在 Java 源码中生成它们。这样这些方法将与程序的其余部分一起编译，并以全速度运行，而不是使用反射。\n\
  \n### 11.5.1 注解处理器\n\n注解处理集成在 Java 编译器中。在编译期间，你可以通过运行以下命令*调用注解处理器*：\n\n```\njavac\
  \ -processor ProcessorClassName1,ProcessorClassName2,... sourceFiles\n```\n\n编译器定位源文件的注解。每个注解处理器按顺序执行，并获得它感兴趣的注解。如果注解处理器创建了新的源文件，则重复该过程。一旦一轮处理没有产生更多的源文件，所有源文件将被编译。\n\
  \n注解处理器只能生成新的源文件。它不能修改现有的源文件。\n\n注解处理器实现 `Processor` 接口，通常通过扩展 `AbstractProcessor`\
  \ 类。你需要指定你的处理器支持哪些注解。在我们的案例中：\n\n```\n@SupportedAnnotationTypes(\"com.horstmann.annotations.ToString\"\
  )\n@SupportedSourceVersion(SourceVersion.RELEASE_8)\npublic class ToStringAnnotationProcessor\
  \ extends AbstractProcessor {\n    public boolean process(Set<? extends TypeElement>\
  \ annotations,\n            RoundEnvironment currentRound) {\n        ...\n    }\n\
  }\n```\n\n\n\n\n处理器可以声称特定的注解类型、通配符如 `\"com.horstmann.*\"`（`com.horstmann` 包或任何子包中的所有注解），甚至是\
  \ `\"*\"`（所有注解）。\n\n`process` 方法在每一轮次中会被调用一次，其参数是该轮次期间在任何文件中找到的所有注解集合，以及一个包含当前处理轮次信息的\
  \ `RoundEnvironment` 引用。\n\n### 11.5.2 语言模型 API (The Language Model API)\n\n你使用\
  \ `language model` API 来分析源码级注解。与反射 API 不同不同（反射 API 提供的是类和方法的虚拟机表示），`language model`\
  \ API 允许你根据 Java 语言的规则来分析 Java 程序。\n\n编译器会生成一棵树，其节点是实现了 `javax.lang.model.element.Element`\
  \ 接口及其子接口 `TypeElement`、`VariableElement`、`ExecutableElement` 等类的实例。这些是 `Class`、`Field`/`Parameter`、`Method`/`Constructor`\
  \ 反射类在编译时的对应物。\n\n我不想详细介绍该 API，但这里有你在处理注解时需要了解的重点。\n\n*   `RoundEnvironment` 通过调用以下方法之一，为你提供被特定注解标记的元素集合：\n\
  \n    ```\n    Set<? extends Element> getElementsAnnotatedWith(Class<? extends Annotation>\
  \ a)\n    Set<? extends Element> getElementsAnnotatedWithAny(\n        Set<Class<?\
  \ extends Annotation>> annotations) \n    ```\n    第二个方法适用于重复注解。\n\n*   `AnnotatedElement`\
  \ 接口的源码级等价物是 `AnnotatedConstruct`。你使用以下方法：\n\n    ```\n    A getAnnotation(Class<A>\
  \ annotationType)\n    A[] getAnnotationsByType(Class<A> annotationType)\n    ```\n\
  \    来获取给定注解类的某个注解或重复注解。\n\n*   `TypeElement` 代表一个类或接口。`getEnclosedElements` 方法产生其字段和方法的列表。\n\
  \n*   在 `Element` 上调用 `getSimpleName` 或在 `TypeElement` 上调用 `getQualifiedName` 会产生一个\
  \ `Name` 对象，该对象可以通过 `toString` 转换为字符串。\n\n### 11.5.3 使用注解生成源代码 (Using Annotations\
  \ to Generate Source Code)\n\n让我们回到自动生成 `toString` 方法的任务。我们不能将这些方法放入原始类中——注解处理器只能产生新类，不能修改现有的类。\n\
  \n因此，我们将所有方法添加到一个工具类 `ToStrings` 中：\n\n```\npublic class ToStrings {\n    public\
  \ static String toString(Point obj) {\n        Generated code\n    }\n    public\
  \ static String toString(Rectangle obj) {\n        Generated code\n    }\n    ...\n\
  \    public static String toString(Object obj) {\n        return Objects.toString(obj);\n\
  \    }\n}\n```\n\n由于我们不想使用反射，因此我们注解访问器方法而不是字段：\n\n```java\n@ToString\npublic class\
  \ Rectangle {\n    ...\n    @ToString(includeName=false) public Point getTopLeft()\
  \ { return topLeft; }\n    @ToString public int getWidth() { return width; }\n \
  \   @ToString public int getHeight() { return height; }\n}\n```\n\n注解处理器随后应该生成以下源代码：\n\
  \n```java\npublic static String toString(Rectangle obj) {\n    var result = new\
  \ StringBuilder();\n    result.append(\"Rectangle\");\n    result.append(\"[\");\n\
  \    result.append(toString(obj.getTopLeft()));\n    result.append(\",\");\n   \
  \ result.append(\"width=\");\n    result.append(toString(obj.getWidth()));\n   \
  \ result.append(\",\");\n    result.append(\"height=\");\n    result.append(toString(obj.getHeight()));\n\
  \    result.append(\"]\");\n    return result.toString();\n}\n```\n\n“样板”代码部分是灰色的。以下是为具有给定\
  \ `TypeElement` 的类生成 `toString` 方法的方法大纲：\n\n```java\nprivate void writeToStringMethod(PrintWriter\
  \ out, TypeElement te) {\n    String className = te.getQualifiedName().toString();\n\
  \    // 打印 string builder 的头部和声明\n    ToString ann = te.getAnnotation(ToString.class);\n\
  \    if (ann.includeName()) // 输出添加类名的代码\n    for (Element c : te.getEnclosedElements())\
  \ {\n        ann = c.getAnnotation(ToString.class);\n        if (ann != null) {\
  \             \n            if (ann.includeName()) // 输出添加字段名的代码\n            //\
  \ 打印追加 toString(obj.methodName()) 的代码\n        }\n    }\n    // 打印返回字符串的代码\n}\n\
  ```\n\n这里是注解处理器 `process` 方法的大纲。它为辅助类创建一个源文件，并为每个被注解的类写入类头部和一个方法。\n\n```java\npublic\
  \ boolean process(Set<? extends TypeElement> annotations,\n        RoundEnvironment\
  \ currentRound) {\n    if (annotations.size() == 0) return true;\n    try {\n  \
  \      JavaFileObject sourceFile = processingEnv.getFiler().createSourceFile(\n\
  \            \"com.horstmann.annotations.ToStrings\");\n        try (var out = new\
  \ PrintWriter(sourceFile.openWriter())) {\n            // 输出包和类的代码\n           \
  \ for (Element e : currentRound.getElementsAnnotatedWith(ToString.class)) {\n  \
  \              if (e instanceof TypeElement te) {\n                    writeToStringMethod(out,\
  \ te);\n                }\n            }\n            // 输出 toString(Object) 的代码\n\
  \        } \n    } catch (IOException ex) {\n        processingEnv.getMessager().printMessage(Kind.ERROR,\
  \ ex.getMessage());\n    }\n    return true;\n}\n```\n\n对于细节，请检查书中的配套代码。\n\n`process`\
  \ 方法注意到在随后的轮次中调用时注解列表为空。它随后立即返回，因此不会重复创建源文件。要查看轮次，请带有 `-XprintRounds` 参数运行 `javac`\
  \ 命令：\n\n```\nRound 1:\n  input files: {ch11.sec05.Point,ch11.sec05.Rectangle,ch11.sec05.SourceAnnotationDemo}\n\
  \  annotations: [com.horstmann.annotations.ToString]\n  last round: false\nRound\
  \ 2:\n  input files: {com.horstmann.annotations.ToStrings}\n  annotations: []\n\
  \  last round: false\nRound 3:\n  input files: {}\n  annotations: []\n  last round:\
  \ true\n```\n\n这个示例演示了工具如何收集源文件注解以产生其他文件。生成的文件并不一定是源文件。\n\n你现在已经了解了如何在源文件和运行程序中处理注解。第三种可能性是在类文件中处理注解，通常在将其加载到虚拟机时进行。你需要诸如\
  \ ASM (http://asm.ow2.org) 的工具来定位和评估注解，并重写字节码。\n\n## 练习题\n\n1. 如何修改 `Object.clone`\
  \ 以使用 `@Cloneable` 注解而不是 `Cloneable` 标记接口。\n\n2. 如果注解在 Java 早期版本中存在，那么 `Serializable`\
  \ 接口无疑是一个注解。实现一个 `@Serializable` 注解。选择一种文本或二进制格式用于持久。提供流或读写类，通过保存和恢复所有原始值或自身可序列化的字段来持久对象的状态。现在不要担心循环引用。\n\
  \n3. 在你的序列化机制中添加一个 `@Transient` 注解，其作用类似于 `transient` 修饰符。\n\n4. 定义一个注解 `@Todo`，包含需要完成的任务的消息。定义一个注解处理器，从源文件生成提醒列表。包含被注解项的描述和\
  \ todo 消息。\n\n6. 将上一个练习的注解转换为重复注解。\n\n\n\n\n\n7. 如果 Java 早期版本中存在注解，它们可能会承担 JavaDoc\
  \ 的角色。定义如 `@Param`、`@Return` 等注解，并使用注解处理器从它们生成基础 HTML 文档。\n\n8. 实现 `@TestCase` 注解，生成一个源文件，其文件名为该注解所在的类名，并在后面加上\
  \ `Test`。例如，如果 `MyMath.java` 包含：\n\n```\n@TestCase(args=\"4\", expected=\"24\")\n\
  @TestCase(args=\"0\", expected=\"1\")\npublic static long factorial(int n) { ...\
  \ }\n```\n\n则生成一个文件 `MyMathTest.java`，其中包含以下语句：\n\n```\nassert(MyMath.factorial(4)\
  \ == 24);\nassert(MyMath.factorial(0) == 1);\n```\n\n你可以假设测试方法是静态的，且 `args` 包含一个正确类型的逗号分隔的参数列表。\n\
  \n9. 将 `@TestCase` 注解实现为运行时注解，并提供一个检查它的工具。同样，假设测试方法是静态的，并限制在注解元素中可以用字符串描述的合理参数和返回类型范围内。\n\
  \n00. 为 `@Resource` 注解实现一个处理器，它接受某个类的对象，并寻找带有 `@Resource(name=\"URL\")` 标记的 `String`\
  \ 类型字段。然后使用反射加载 URL 并将其内容“注入”到字符串变量。\n\n# 第 12 章 ▪ Java 平台模块系统\n\n面向对象编程的一个重要特性是封装。一个类的声明由一个公共接口和一个私有实现组成。类可以通过更改实现来演进，而不会影响其用户。模块系统为大规模编程提供了同样的优势。模块可以选择性地使类和包变得可用，从而控制其演进。\n\
  \n现有的几个 Java 模块系统依赖于类加载器来隔离类。然而，Java 9 引入了一个新系统，称为 Java 平台模块系统（Java Platform Module\
  \ System），它由 Java 编译器和虚拟机支持。旨在将 Java 平台的庞代码库模块化。如果你愿意，可以使用该系统将自己的应用程序模块化。\n\n无论你在自己的应用程序中使用未使用\
  \ Java 平台模块，都可能受到模块化 Java 平台的影响。本章将向你展示如何声明和使用 Java 平台模块。你还将学习如何迁移应用程序以与模块化的 Java\
  \ 平台以及第三方模块协作。\n\n本章的要点是：\n\n1. Java 平台模块系统旨在将 Java 平台模块化。\n2. 你可以使用 Java 平台模块系统将应用程序和库模块化。\n\
  3. 模块是包的集合。\n4. 模块的属性定义在 `module-info.java` 中。\n5. 模块声明它依赖哪些其他模块。\n6. 模块提供了封装。可访问的包必须显式导出（export）。\n\
  7. 模块可以通过打开包或整个模块允许对私有特性进行反射访问。\n8. 模块系统提供了 `ServiceLoader`set 的支持。\n9. 模块化 JAR\
  \ 是一个包含 `module-info.class` 文件并放在模块路径上的 JAR。\n10. 通过将普通 JAR 放在模块路径上，它将变成一个自动模块，导出并打开其所有包。\n\
  11. 类路径上的所有包形成未命名模块（unnamed module）。\n12. 为了迁移现有应用程序，你可能需要使用命令行选项覆盖访问限制。\n13. `jdeps`\
  \ 工具分析给定 JAR 文件的依赖关系。`jlink` 工具生成具有最少依赖的应用程序\n\n## 12.1 模块概念\n\n在面向对象编程中，基本的构建块是类。类提供了封装。私有特性只能通过具有显式权限的代码访问，即类的方法。这使得推断访问变得可能。如果一个私有变量发生了变化，你可以列出所有可能的“罪魁祸首”。如果你需要修改私有表示，你知道哪些方法受了影响。\n\
  \n在 Java 中，包（package）提供了更大的组织分组。包是类的集合。包也提供了一层封装。任何具有包访问级访问权限（既不是公共不是私有）的特性只能从同一包中的方法访问。\n\
  \n然而，在大型系统中，这种程度的访问控制是不够的。任何公共特性（即可以在包之外访问的特性）在任何地方都可以访问。假设你想修改或删除一个很少使用的特性。一旦它是公共的，就没有办法可以推断该更改产生的影响。\n\
  \n这就是 Java 平台设计者所面临的情况。二十多年来，JDK 飞速增长，但显然某些特性本质上已经过时了。大家最喜欢的例子是 CORBA。你上一次使用它是什么时候？然而，`org.omg.corba`\
  \ 包随每个 JDK 一起发布。事实上，将所有 CORBA 放入一个 JAR 文件中以供少数仍需要它的人使用并不困难。\n\n那么 `java.awt` 呢？它在服务端应用程序中不应该是被需要的，对吧？除非\
  \ `java.awt.DataFlavor` 类在 SOAP（一种基于 XML 的 Web 服务协议）的实现中使用了。\n\nJava 平台设计者面对巨大的代码团，决定他们需要一种提供更多控制的结构化机制。他们查看了现有的模块系统（如\
  \ OSGi），发现它们不适合他们的问题。相反，他们设计了一个新系统，称为 Java 平台模块系统，它现在是 Java 语言和虚拟机的一部分。该系统已成功用于将\
  \ Java API 模块化，如果你愿意，可以将它应用于自己的应用程序。\n\n一个 Java 平台模块由：\n* 包的集合\n* 可选的资源文件和其他文件（如原生库）\n\
  * 可访问包的列表\n* 模块依赖的所有模块列表\n\nJava 平台在编译时间和虚拟机中强制封装和依赖。\n\n为什么你应该考虑使用模块系统编写自己的程序，而不是遵循在类路径使用\
  \ JAR 文件的传统方法？有两个：\n\n1. 强封装：你可以控制哪些包是可访问的，而不必担心维护你不打算供公开的代码。\n2. 可靠的配置：避免了常见的类路径问题，如类重复或缺失。\n\
  \n有一些 Java 平台模块系统没有解决的问题，例如模块的版本控制。不支持指定所需的模块版本，也不支持在同一个程序中使用多个版本的模块。这些可能是理想的特性，但如果你需要它们，必须使用\
  \ 模块系统以外的机制。\n\n## 12.2 模块命名\n\n模块是包的集合。模块中的包名不需要相关。例如，`java.sql` 模块包含 `java.sql`、`javax.sql`\
  \ 和 `javax.transaction.xa` 包。此外，正如从这个例子所示，模块名与包名相同完全是可以的。\n\n就像包名一样，模块名由字母、数字、下划线和点组成。同样，就像包名，模块之间没有层级关系。如果你有一个\
  \ `com.horstmann` 模块和另一个 `com.horstmann.corejava` 模块，从模块系统的角度来看它们是无关的。\n\n\n\n\n\
  在创建一个供他人使用的模块时，确保其名称在全局范围内唯一是非常重要的。预计大多数模块名称将遵循“反向域名”约定，就像包名一样。\n\n最简单的方法是以该模块提供的顶层包来命名模块。例如，SLF4J\
  \ 日志外接口有一个名为 `org.slf4j` 的模块，其中包含 `org.slf4j`、`org.slf4j.spi`、`org.slf4j.event`\
  \ 和 `org.slf4j.helpers` 等包。\n\n这种约定可以防止模块之间的包名冲突。任何给定的包只能存放在一个模块中。如果你的模块名称是唯一的，且你的包名以模块名开头，那么你的包名也将是唯一的。\n\
  \n对于不打算供其他程序员使用的模块（例如包含应用程序的模块），你可以使用较短的模块名称。为了说明这种做法是可行的，我将在本章中这样做。可能可能是库代码的模块将具有如\
  \ `com.horstmann.util` 类的名称，而包含程序（带有 `main` 方法的类）的模块将具有如 `ch12.sec03` 这样易记的名称。\n\
  \n你只在模块声明中使用模块名。在你的 Java 类的源文件中，你永远不会引用模块名。相反，你像往常一样使用包名。\n\n## 12.3. 模块化的“Hello,\
  \ World!”程序\n\n让我们把传统的“Hello, World!”程序放入一个模块中。首先，我们需要将类放入一个包中——“未命名包”不能包含在模块中。这里是代码：\n\
  \n```\npackage com.horstmann.hello;\n\npublic class HelloWorld {\n    public static\
  \ void main(String[] args) {\n        System.out.println(\"Hello, Modular World!\"\
  );\n    }\n}\n```\n\n到目前为止，什么都没有改变。要创建一个包含该包的 `ch12.sec03` 模块，你需要添加一个模块声明。你将其放在一个名为\
  \ `module-info.java` 的文件中，位于根目录下（即包含 `com` 目录的相同目录）。根据约定，根目录的名称与模块名称相同。\n\n```\n\
  ch12.sec03/\n└ module-info.java\n  com/\n  └ horstmann/\n    └ hello/\n      └ HelloWorld.java\
  \ \n```\n\n`module-info.java` 文件包含了模块声明：\n\n```\nmodule ch12.sec03 {\n}\n```\n\n\
  这个模块声明是空的，因为该模块没有向任何人提供任何东西，也不需要任何东西。\n\n现在像平时一样编译：\n\n```\njavac ch12.sec03/module-info.java\
  \ ch12.sec03/com/horstmann/hello/HelloWorld.java\n```\n\n`module-info.java` 文件看起来不像\
  \ Java 源文件，而且当然它不可能有一个名为 `module-info` 的类，因为类名不能包含连字符。`module` 关键字，以及你将在后续章节中看到的\
  \ `requires`、`exports` 等关键字，都是“受限关键字”，它们仅在模块声明中具有特殊含义。该文件被编译成一个类文件 `module-info.class`，其中以二进制形式包含了模块定义。\n\
  \n要作为模块化应用程序来运行此程序，你需要指定模块路径（module path），它类似于类路径（class path），但它包含了模块。你还以 `modulename`/`classname`\
  \ 的格式指定主类：\n\n```\njava --module-path ch12.sec03 --module ch12.sec03/com.horstmann.hello.HelloWorld\n\
  ```\n\n你可以使用单字母选项 `-p` 和 `-m` 来代替 `--module-path` 和 `--module`：\n\n```\njava -p\
  \ ch12.sec03 -m ch12.sec03/com.horstmann.hello.HelloWorld\n```\n\n无论哪种方式，都会出现 `\"\
  Hello, Modular World!\"` 问候，证明你已成功地模块化你的第一个应用程序。\n\n当你编译此模块时，会得到两个警告：\n\n```\nwarning:\
  \ [module] module name component sec03 should avoid terminal digits\nwarning: [module]\
  \ module name component ch12 should avoid terminal digits\n```\n\n这些警告旨在劝阻程序员在模块名称中添加版本号。你可以忽略它们，或者使用注解来抑制它们：\n\
  \n```java\n@SuppressWarnings(\"module\")\nmodule ch12.sec03 {\n}\n```\n\n在这一点上，`module`\
  \ 声明与类声明一样：你可以对它进行注解。（注解类型的目标必须是 `ElementType.MODULE`。）\n\n## 12.4. 需要模块\n\n让我们创建一个新模块\
  \ `ch12.sec04`，在其中程序使用 `JOptionPane` 来显示“Hello, Modular World!”消息：\n\n```java\n\
  package com.horstmann.hello;\n\nimport javax.swing.JOptionPane;\n\npublic class\
  \ HelloWorld {\n    public static void main(String[] args) {\n        JOptionPane.showMessageDialog(null,\
  \ \"Hello, Modular World!\");\n    }\n}\n```\n\n现在编译失败，并显示此消息：\n\n```\nerror: package\
  \ javax.swing is not visible\n  (package javax.swing is declared in module java.desktop,\n\
  \    but module ch12.sec04 does not read it)\n```\n\nJDK 已经模块化，`javax.swing` 包现在包含在\
  \ `java.desktop` 模块中。我们的模块需要声明它依赖于它：\n\n```java\nmodule ch12.sec04 {\n    requires\
  \ java.desktop;\n}\n```\n\n在前一节中，并没有出现显式需求，因为我们只使用了 `java.lang` 包。该包包含在 `java.base`\
  \ 模块中，而该模块是默认需要的。注意，我们的 `ch12.sec04` 模块只列出了模块需求。它需要 `java.desktop` 模块以便于使用 `javax.swing`\
  \ 包。`java.desktop` 模块本身声明它需要三个模块，即 `java.datatransfer`、`java.prefs` 和 `java.xml`。\n\
  \n模块图显示节点是模块。图的边（即连接节点的箭头）要么是声明的需求，要么在没有声明需求时是 `java.base` 的隐式需求。\n\n模块图中不能有循环。也就是说，一个模块不能直接或间接地引用它自己。\n\
  \n模块不会自动将访问权限传递给其他模块。在我们的示例中，`java.desktop` 模块声明它需要 `java.prefs`，而 `java.prefs`\
  \ 模块声明它需要 `java.xml`。这并没有赋予 `java.desktop` 使用 `java.xml` 模块包的权利。它需要显式地声明该需求。从数学术语来说，`requires`\
  \ 关系不是“传递性的”。通常这种行为是理想的，因为它使需求变得显式，但正如你在第 12.11 节中看到的，在某些情况下你可以放松它。\n\n在本节开始的错误消息显示我们的\
  \ `ch12.sec04` 模块没有“读取” `java.desktop` 模块。在 Java 模块系统的术中，模块 `M` 在以下情况下*读取*模块 `N`：\n\
  \n1. `M` 需要 `N`。\n2. `M` 需要一个传递需要 `N` 的模块。\n3. `N` 是 `M` 或 `java.base`。\n\n## 12.5.\
  \ 包\n\n在前一节中，你看到模块想要使用另一个模块的包，必须需要该模块。然而，这并不会让所需模块中的所有包可用。模块使用 `exports` 关键字声明哪些包是可访问的。例如，这里是\
  \ `java.xml` 模块声明的一部分：\n\n```java\nmodule java.xml {\n    exports javax.xml;\n \
  \   exports javax.xml.catalog;\n    exports javax.xml.datatype;\n    exports javax.xml.namespace;\n\
  \    exports javax.xml.parsers;\n    ...\n}\n```\n\n该模块开放了许多包，但通过不导出它们隐藏了其他包（如 `jdk.xml.internal`）。\n\
  \n\n\n\n当一个包被导出时，它的 `public` 和 `protected` 类和接口，以及它们的 `public` 和 `protected` 成员在模块外部是可的。（与既往一样，`protected`\
  \ 类型和成员仅在子类和同一个包中可访问。）\n\n然而，未导出的包在其自己的模块外部是不可见的。这与模块化之前的 Java 有很大不同。在过去，你可以使用任何包中的公共类，即使它不是公共\
  \ API 的一部分。例如，当公共 API 未提供适当的功能时，通常建议使用 `sun.misc.BASE64Encoder` 或 `com.sun.rowset.CachedRowSetImpl`\
  \ 等类。\n\n如今，你无法再访问 Java 平台 API 中未导出的包，因为它们都包含在模块内部。结果是某些程序将无法在现代 Java 版本上运行。当然，没有人承诺过保持非公开\
  \ API 的可用，所以这不应该让你感到意外。\n\n让我们在一个简单的场景中使用导出（exports）功能。我们将准备一个名为 `com.horstmann.greet`\
  \ 的模块，它导出一个也叫 `com.horstmann.greet` 的包，遵循这一约定：为他人提供代码的模块应以其内部的顶层包命名。还有一个名为 `com.horstmann.greet.internal`\
  \ 的包，我们没有导出它。\n\n第一个包中有一个公共的 `Greeter` 接口。\n\n```\npackage com.horstmann.greet;\n\
  \npublic interface Greeter {\n    static Greeter newInstance() {\n        return\
  \ new com.horstmann.greet.internal.GreeterImpl();\n    }\n\n    String greet(String\
  \ subject);\n}\n```\n\n第二个包中有一个实现接口的类。由于该类在第一个包中被访问，它是公的。\n\n```java\npackage com.horstmann.greet.internal;\n\
  \nimport com.horstmann.greet.Greeter;\n\npublic class GreeterImpl implements Greeter\
  \ {\n    public String greet(String subject) {\n        return \"Hello, \" + subject\
  \ + \"!\";\n    }\n}\n```\n\n`com.horstmann.greet` 模块包含了两个包，但只导出第一个：\n\n```\nmodule\
  \ com.horstmann.greet {\n    exports com.horstmann.greet;\n}\n```\n\n第二个包在模块外部是不可访问的。\n\
  \n我们将应用程序放入第二个模块中，它将需要第一个模块：\n\n```\nmodule ch12.sec05 {\n    requires com.horstmann.greet;\n\
  }\n```\n\n`exports` 语句后面跟着一个包名，而 `requires` 后面跟着一个模块名。\n\n我们的应用程序现在使用 `Greeter`\
  \ 来获取问候：\n\n```java\npackage com.horstmann.hello;\n\nimport com.horstmann.greet.Greeter;\n\
  \npublic class HelloWorld {\n    public static void main(String[] args) {\n    \
  \    Greeter greeter = Greeter.newInstance();\n        System.out.println(greeter.greet(\"\
  Modular World\"));\n    }\n}\n```\n\n这是这两个模块的源文件结构：\n\n```\ncom.horstmann.greet\n\
  ├ module-info.java\n└ com\n  └ horstmann\n    └ greet\n      ├ Greeter.java\n  \
  \    └ internal\n        └ GreeterImpl.java\nch12.sec05\n├ module-info.java\n└ com\n\
  \  └ horstmann\n    └ hello\n      └ HelloWorld.java\n```\n\n要构建此应用程序，首先编译 `com.horstmann.greet`\
  \ 模块：\n\n```\njavac com.horstmann.greet/module-info.java \\\n    com.horstmann.greet/com/horstmann/greet/Greeter.java\
  \ \\\n    com.horstmann.greet/com/horstmann/greet/internal/GreeterImpl.java\n```\n\
  \n然后，将第一个模块放在模块路径上，编译应用程序模块：\n\n```\njavac -p com.horstmann.greet ch12.sec05/module-info.java\
  \ \\\n    ch12.sec05/com/horstmann/hello/HelloWorld.java\n```\n\n最后，将两个模块都放在模块路径上并运行程序：\n\
  \n```\njava -p ch12.sec05:com.horstmann.greet \\\n    -m ch12.sec05/com.horstmann.hello.HelloWorld\n\
  ```\n\n这个示例演示了如何在模块中隐藏实现。实现类在模块外部是不可访问的。客户端使用接口和工厂方法，而不是实例化实现类。\n\n在 Windows 的 `cmd`\
  \ 终端中，你必须将 `ch12.sec05:com.horstmann.greet` 括在引号内，因为冒号字符具有特殊含义。你还需要使用 `^` 代替 `\\\
  ` 来进行多行命令。\n\n你现在已经看到了构成 Java 平台模块系统骨干的 `requires` 和 `exports` 语句。如你所见，模块系统在概念上是简单的。模块指定了它们需要的哪些模块，以及它们向其他模块提供哪些包。第\
  \ 12.12 节 显示了 `exports` 语句的一种细微变化。\n\n模块并不提供作用域。你不能在不同的模块中拥有同名的包。即使对于隐藏包（即未被导出的包）也是如此。\n\
  \n## 12.6 模块与反射式访问\n\n在节一节中，你看到模块系统强制执行封装。模块只能访问来自另一个模块的显式导出的包。在过去，总是可以通过反射来克服烦人的访问限制。正如你在\
  \ 4 章 中看到的，反射可以访问私有成员。\n\n然而，在模块化世界中，情况不再如此。如果一个类位于模块内部，`setAccessible(true)` 将失败。具体来说，回想我们是如何访问私有字段的：\n\
  \n```\nField f = obj.getClass().getDeclaredField(\"salary\");\nf.setAccessible(true);\n\
  double value = f.getDouble(obj);\n```\n\n除非安全管理器允许，否则 `f.setAccessible(true)` 调用是成功的。然而，通常不会带安全管理器运行\
  \ Java 程序，而且许多库使用了反射。典型的例子是自动持久对象的 JPA。为了演示这个问题，我将使用 JSON-B 的实现。这是一个演示该机制的简单类：\n\
  \n```java\npackage com.horstmann.places;\n\npublic class Country {\n    public Country()\
  \ {}\n\n    public Country(String name, double area) {\n        this.name = name;\n\
  \        this.area = area;\n    }\n    // ...\n}\n```\n\n这是一个演示如何将对象转换为 JSON 的短程序：\n\
  \n```java\npackage com.horstmann.places;\n\nimport jakarta.json.bind.*;\nimport\
  \ jakarta.json.bind.config.*;\nimport java.lang.reflect.*;\n\npublic class Demo\
  \ {\n    public static void main(String[] args) throws JAXBException {\n       \
  \ var belgium = new Country(\"Belgium\", 30510);\n\n        var config = new JsonbConfig()\n\
  \            .withPropertyVisibilityStrategy(\n                new PropertyVisibilityStrategy()\
  \ {\n                    public boolean isVisible(Field field) { return true; }\n\
  \                    public boolean isVisible(Method method) { return false; }\n\
  \                });\n        Jsonb jsonb = JsonbBuilder.create(config);\n     \
  \   String json = jsonb.toJson(belgium);\n        System.out.println(json);\n  \
  \  }\n}\n```\n\n当你运行程序时，它输出：\n\n```\n{\"area\":30510.0,\"name\":\"Belgium\"}\n```\n\
  \n如你所见，程序员不需要任何操作来实现这一切。通过反射，JSON-B 库确定了字段的名字和值。\n\n现在将 `Country` 和 `Demo` 类放入模块中。当你这样做时，`Demo`\
  \ 程序将异常异常：\n\n```\nException in thread \"main\" java.lang.reflect.InaccessibleObjectException:\n\
  \    Unable to make field\nprivate java.lang.String com.horstmann.places.Country.name\
  \ accessible:\nmodule v2ch09.openpkg2 does not \"opens com.horstmann.places\"\n\
  \    to module org.eclipse.yasson\n```\n\n当然，在纯粹理论上，违反封装并窥探对象的私有成员是错误的。但诸如 XML 绑定或对象关系映射等机制非常常见，模块系统必须适应它们。\n\
  \n\n\n\n使用 `opens` 关键字，模块可以 `open` 一个包，这使得能够对给定包中的所有类实例进行反射访问。以下是我们的模块需要做的：\n\n\
  ```\nmodule ch12.sec06 {\n    requires jakarta.json.bind;\n    opens com.horstmann.places;\n\
  }\n```\n\n通过此更改，JSON-B 将能够正常工作。\n\n一个模块可以被声明为 `open`，例如：\n\n```\nopen module ch12.sec06\
  \ {\n    requires jakarta.json.bind;\n}\n```\n\n开放模块授予了其所有包的运行时访问权限，就好像所有包都已声明了\
  \ `exports` 和 `opens` 一样。然而，只有显式导出的包在编译时是可访问的。开放模块将模块系统的编译时安全性与经典的松散运行时行为结合在一起。\n\
  \nJAR 文件除了类文件和清单文件外，还可以包含 `file resources`，这些资源可以使用 `Class.getResourceAsStream`\
  \ 方法加载，现在也可以通过 `Module.getResourceAsStream` 加载。如果资源存储在与模块中的包匹配的目录中，则该包必须对调用者开放。其他目录中的资源，以及类文件和清单文件，可以被任何人读取。\n\
  \n未来的库可能会使用 `variable handles` 而不是反射来读取和写入字段。`VarHandle`类似于 `Field`。你可以使用它来读取或写入特定类的任何实例的特定字段。然而，为了获取\
  \ `VarHandle`，库代码需要一个 `Lookup` 对象：\n\n```\npublic Object getFieldValue(Object obj,\
  \ String fieldName, Lookup lookup)\n        throws NoSuchFieldException, IllegalAccessException\
  \ {\n    Class<?> cl = obj.getClass();\n    Field field = cl.getDeclaredField(fieldName);\n\
  \    VarHandle handle = MethodHandles.privateLookupIn​(cl, lookup)\n        .unreflectVarHandle(field);\n\
  \    return handle.get(obj);\n}\n```\n\n只要 `Lookup` 对象是在具有访问字段权限的模块中生成的，这种方法就是有效的。模块中的某些方法只需调用\
  \ `MethodHandles.lookup()`，就会产生一个封装了调用者访问权的对象。通过这种方式，一个模块可以授予另一个模块访问私有成员的权限。实际的问题是如何以最小的麻烦赋予这些权限。\n\
  \n## 12.7. 模块化 JAR\n\n到目前为止，我们只是简单地将模块编译到源码目录树中。显然，这对于部署是不够的。相反，可以通过将所有类放在一个 JAR\
  \ 文件中来部署模块，并在根目录下包含一个 `module-info.class`。这样的 JAR 文件被称为 `modular`（模块化）JAR。\n\n要创建一个模块化\
  \ JAR 文件，你可以像通常一样使用 `jar` 工具。如果你有多个包，最好使用 `-d` 选项进行编译，这会将类文件存于单独的目录中。如果目录不存在，则会创建。然后使用\
  \ `jar` 命令的 `-C` 选项在收集文件时切换到该目录。\n\n```\njavac -d modules/com.horstmann.greet \\\
  \n    com.horstmann.greet/module-info.java \\\n    com.horstmann.greet/com/horstmann/greet/internal/GreeterImpl.java\
  \ \\\n    com.horstmann.greet/com/horstmann/greet/Greeter.java\njar -cvf com.horstmann.greet.jar\
  \ -C modules/com.horstmann.greet .\n```\n\n如果你使用 `Maven`、`Ant` 或 `Gradle` 等构建工具，只需像往常一样构建你的\
  \ JAR 文件即可。只要包含了 `module-info.class`，你就能获得模块化 JAR。\n\n然后你可以将模块化 JAR 包含在模块路径（module\
  \ path）中，模块将被加载。\n\n在过去，一个包的类有时分布在多个 JAR 文件中。（这种包被称为“拆分包”）。这可能从来不是一个好主意，而且在模块系统中是不可能实现的。\n\
  \n与普通 JAR 文件一样，你可以在模块化 JAR 中指定一个主类：\n\n```\njavac -p com.horstmann.greet.jar -d\
  \ modules/ch12.sec05 \\\n    ch12.sec05/module-info.java \\\n    ch12.sec05/com/horstmann/hello/HelloWorld.java\n\
  jar -c -v -f ch12.sec05.jar -e com.horstmann.hello.HelloWorld -C modules/ch12.sec05\
  \ .\n```\n\n当启动程序时，你需要指定包含主类的模块：\n\n```\njava -p com.horstmann.greet.jar:ch12.sec05.jar\
  \ -m ch12.sec05\n```\n\n在创建 JAR 文件时，你可以可选地指定版本号。使用 `--module-version` 参数并将版本号用于\
  \ JAR 文件名：\n\n```\njar -c -v -f com.horstmann.greet-1.0.jar --module-version 1.0\
  \ -C com.horstmann.greet .\n```\n\n正如已经讨论过的，Java 平台模块系统并并不使用版本号来解析模块，但它可以被其他工具和框架查询。\n\
  \n你可以通过反射 API 获取版本号。在我们的示例中：\n\n```\nOptional<String> version\n    = Greeter.class.getModule().getDescriptor().rawVersion();\n\
  ```\n\n将产生一个包含版本字符串 `\"1.0\"` 的 `Optional`。\n\n对应于类加载器的模块是 `layer`（层）。Java 平台模块系统将\
  \ JDK 模块和应用模块加载到 `boot layer`（启动层）中。程序可以使用 layer API（本书未涵盖）加载其他模块。预计 Java EE 服务器的开发者可以使用层\
  \ API。如果你想将模块加载到 JShell，请将其放在模块路径并使用 `--add-modules` 选项：\n\n```\njshell --module-path\
  \ com.horstmann\n    --add-modules comhorstmann\n```\n\n## 12.8. 自动模块\n\n你现在知道如何使用\
  \ Java 平台模块系统了。如果你从一个编写所有代码的新项目开始，你可以设计模块、声明模块依赖并将应用程序打包成模块化 JAR 文件。\n\n然而，这是一种极少见的场景。几乎所有项目都依赖第三方库。当然，你可以等待库提供者将其转换为模块，然后再对自己的代码进行模块化。\n\
  \n但如果你不想等待呢？Java 平台模块系统提供了两种机制来跨越非模块世界与完全模块化应用之间的鸿沟：自动模块和未命名模块。\n\n为了迁移目的，你只需将任何\
  \ JAR 文件放在模块路径而不是类路径，即可将其转换为模块。在模块路径上没有 `module-info.class` 的 JAR 文件被称为 `automatic\
  \ module`（自动模块）。自动模块具有以下属性：\n\n1. 该模块隐含包含对所有其他模块的 `requires` 子句。\n2. 其所有包都被导出并开放。\n\
  3. 如果 JAR 文件的清单 `META-INF/MANIFEST.MF` 中存在键为 `Automatic-Module-Name` 的条目，则该值成为模块名称。\n\
  4. 否则，模块名称从 JAR 文件名获取，删除任何末尾的版本号，并将非字母数字字符序列替换为点。\n\n前两个规则意味着自动模块中的包表现就像它们在类路径上一样。使用模块路径的原因是为了其他模块的利益，允许它们对该模块表示依赖关系。\n\
  \n例如，假设你正在实现一个处理 CSV 文件的模块并使用了 Apache Commons CSV 库。你想在你的 `module-info.java` 文件中表示你的模块依赖于\
  \ Apache Commons CSV。\n\n如果你将 `commons-csv-1.9.0.jar` 添加到模块路径，那么你的模块就可以引用该模块。它的名称是\
  \ `commons.csv`，因为末尾的版本号 `-1.9.0` 被删除了，且非字母数字字符 `-` 被替换成了点。\n\n\n\n\n这个名称可能是一个可以接受的模块名称，因为\
  \ Commons CSV 是广为人知的，不太可能有其他人尝试为不同的模块使用相同的名称。但如果该 JAR 文件的维护者能够快速同意预留一个反向 DNS 名称，最好将顶层包名\
  \ `org.apache.commons.csv` 作为模块名，这样会更好。他们只需要在 JAR 内部的 `META-INF/MANIFEST.MF` 文件中添加一行：\n\
  \n```\nAutomatic-Module-Name: org.apache.commons.csv\n```\n\n最终，希望他们能通过添加带有预留模块名称的\
  \ `module-info.java` 将 JAR 文件转换为真正的模块，这样所有其他通过该名称引用 CSV 模块的模块都将继续运行。\n\n迁移到模块的计划是一个伟大的社会实验，没有人知道它是否会有一个好的结局。在你将第三方\
  \ JAR 放置到模块路径之前，请检查它们是否是模块化的；如果不是，再检查它们的清单文件（manifest）是否包含模块名称。如果没有，你仍然可以将 JAR 转换为自动模块，但要准备好以后更新模块名称。\n\
  \n## 12.9. 未命名模块 (The Unnamed Module)\n\n任何不在模块路径上的类都是 `unnamed module` 的。从技术上讲，可能多个未命名模块，但它们共同作用的效果就像一个单一模块，被称为\
  \ `the unnamed module`。与自动模块一样，未命名模块可以访问所有其他模块，并且它的所有包都被导出（exported）和开放（opened）。\n\
  \n然而，任何 `explicit module`（显式模块）都无法访问未命名模块。（显式模块既不是自动模块也不是未命名模块——即在模块路径上带有 `module-info.class`\
  \ 的模块。）换句话说，显式模块始终免受“类路径地狱”。\n\n例如，假设你将 `commons-csv-1.9.0.jar` 放在类路径而不是模块路径上。那么上一节的示例程序将无法启动：\n\
  \n```\nError occurred during initialization of boot layer\njava.lang.module.FindException:\
  \ Module commons.csv not found, required by ch12.sec09\n```\n\n因此，迁移到 Java 平台模块系统必然是一个自底而上的过程：\n\
  \n1. Java 平台本身被模块化。\n2. 接下来，库被模块化，方法是使用自动模块或将其转换为显式模块。\n3. 一旦你的应用程序使用的库都已模块化，你就可以将你的应用程序代码转换为模块。\n\
  \n自动模块可以读取未命名模块，因此它们的依赖可以放在类路径上。\n\n## 12.10. 迁移的命令行标记\n\n即使你的程序没有使用模块，在运行 Java\
  \ 9 及更高版本时，你也无法逃避模块化世界。即使应用程序代码位于未命名模块的类路径上，并且所有包都已导出和开放，它仍然与已模块化的 Java 平台交互。\n\n\
  从 Java 11 开始，编译时封装被严格执行。然而，在 Java 16 之前，允许运行时访问。默认行为是在每次违规行为第一次发生时在控制台上显示警告。从 Java\
  \ 16 开始，运行时的反射访问也被强制执行。为了让你有时间准备应对变化，Java 9 到 16 的 `java` 启动器有一个 `--illegal-access`\
  \ 标记，具有四种可能的设置：\n\n1. `--illegal-access=permit` 是 Java 9 的默认行为，在第一次非法访问时打印消息。\n\
  2. `--illegal-access=warn` 在每次非法访问时打印消息。\n3. `--illegal-access=debug` 在每次非法访问时打印消息和堆栈跟踪。\n\
  4. `--illegal-access=deny` 是 Java 16 的默认行为，拒绝所有非法访问。\n\n从 Java 17 开始，`--illegal-access`\
  \ 标记不再可用。\n\n`--add-exports` 和 `--add-opens` 标记允许你调整旧留应用程序。考虑一个使用不再可访问的内部 API 的应用程序，例如\
  \ `com.sun.rowset.CachedRowSetImpl`。最好的补救措施是更改实现。（从 Java 7 开始，你可以从 `RowSetProvider`\
  \ 获取缓存行集。）但假设你无法访问源代码。\n\n在这种情况下，使用 `--add-exports` 标记启动应用程序。指定你想要导出的模块和包，以及你想要将该包导出到哪个模块（在我们的案例中，是未命名模块）。\n\
  \n```\njava --illegal-access=deny --add-exports java.sql.rowset/com.sun.rowset=ALL_UNNAMED\
  \ \\\n    -jar MyApp.jar\n```\n\n现在假设你的应用程序使用反射来访问私有字段或方法。未命名模块内部的反射是可以的，但不再能够通过反射访问\
  \ Java 平台类的非公共成员了。例如，某些动态生成 Java 类的库通过反射调用受保护的 `ClassLoader.defineClass` 方法。如果应用程序使用此类库，请添加标记：\n\
  \n```\n--add-opens java.base/java.lang=ALL-UNNAMED\n```\n\n在为了让旧应用程序运行而添加所有这些命令行选项时，你最终可能会得到一个“来自地狱的命令行”。为了更好地管理大量选项，你可以将选项放在一个或多个文件中，并使用\
  \ `@` 前缀指定这些文件。例如：\n\n```\njava @options1 @options2 -jar MyProg.java\n```\n\n其中文件\
  \ `options1` 和 `options2` 包含 `java` 命令的选项。\n\n选项文件有一些语法规则：\n\n*   使用空格、制表符或换行符分隔选项。\n\
  *   对包含空格的参数使用双引号，例如 `\"Program Files\"`。\n*   以 `\\` 结尾的行与下一行合并。\n*   反斜杠必须转义，例如\
  \ `C:\\\\Users\\\\Fred`。\n*   注释行以 `#` 开头。\n\n## 12.11. 传递性与静态需求\n\n在之前的章节中，你已经看到了\
  \ `requires` 语句的基本形式。在本节中，你将看到两种偶尔有变体。\n\n在某些情况下，对于给定模块的用户来说，声明所有所需的模块可能是麻烦的。例如\
  \ `java.desktop` 模块。它需要三个模块：`java.prefs`、`java.datatransfer` 和 `java.xml`。`java.prefs`\
  \ 仅在内部使用。然而，来自 `java.datatransfer` 和 `java.xml` 的类出现在公共 API 中，方法如下：\n\n```\njava.awt.datatransfer.Clipboard\
  \ java.awt.Toolkit.getSystemClipboard()\njava.beans.XMLDecoder(org.xml.sax.InputSource\
  \ is)\n```\n\n这不是 `java.desktop` 模块的用户应该需要考虑的事情。由于这个原因，`java.desktop` 模块使用 `transitive`\
  \ 修饰符声明该需求：\n\n```\nmodule java.desktop\n{\n    requires java.prefs;\n    requires\
  \ transitive java.datatransfer;\n    requires transitive java.xml;\n    ...\n}\n\
  ```\n\n任何声明对 `java.desktop` 有要求的模块现在都要求这两个模块。\n\n一些程序员建议，当另一个模块中的包在公共 API 中时，应该始终使用\
  \ `requires transitive`。但这不是 Java 语言的规则。例如，`java.sql` 模块：\n\n```\nmodule java.sql\
  \ {\n    requires transitive java.logging;\n    ...\n}\n```\n\n在整个 `java.sql` API\
  \ 中，只有一次使用了来自 `java.logging` 模块的包，即返回 `java.util.logging.Logger` 的 `java.sql.Driver.parentLogger`\
  \ 方法。不将此模块需求声明为传递性也是完全可以的。那么那些模块——且仅那些实际使用该方法的——才需要声明它们需要 `java.logging`。\n\n`requires\
  \ transitive` 语句的一个非常有吸引力的用途是*聚合器*（aggregator）模块——即一个不包含包且只有传递性需求的模块。这样一个模块就是 `java.se`\
  \ 模块，其声明如下：\n\n\n\n\n\n```\nmodule java.se {\n    requires transitive java.compiler;\n\
  \    requires transitive java.datatransfer;\n    requires transitive java.desktop;\n\
  \    ...\n    requires transitive java.sql;\n    requires transitive java.sql.rowset;\n\
  \    requires transitive java.xml;\n    requires transitive java.xml.crypto;\n}\n\
  ```\n\n一个对细粒度模块依赖感兴趣的程序员可以简单地要求 `java.se` 并获取 Java SE 平台的所有模块。\n\n最后，还有一种不常见的 `requires\
  \ static` 变体，它声明模块在编译时必须存在但在运行时是可选的。它有两个用例：\n\n1.  访问一个在编译时处理并声明在不同模块中的注解。\n2. \
  \ 如果可用，则使用另一个模块中的类，否则则执行其他操作，例如：\n\n```\ntry {\n    new oracle.jdbc.driver.OracleDriver();\n\
  \    ...\n} catch (NoClassDefFoundError er) {\n    // 执行其他操作\n}\n```\n\n## 12.12.\
  \ 限定限定导出与打开 (Qualified Exporting and Opening)\n\n在本节中，你将看到 `exports` 和 `opens` 语句的变体，将其范围缩小到指定的模块集合。例如，`java.base`\
  \ 模块包含如下语句：\n\n```\nexports sun.net to\n  java.net.http,\n  jdk.naming.dns;\n```\n\
  \n这样的语句被称为**限定导出**（qualified export）。列出的模块可以访问导出的包，但其他模块不能。\n\n过度使用限定导出可能表明模块结构不佳。尽管如此，在对现有代码库进行模块化时可能会出现这种情况。在这里，`sun.net`\
  \ 包被放置在 `java.base` 模块中，因为那里大部分需要。然而，其他几个模块也使用了该包。Java 平台设计者不想让 `java.base` 变得更大，也不想让内部的\
  \ `sun.net` 包全局可用。在绿地项目中，人们可以设计一个更具模块化的 API。\n\n同样，你可以限制 `opens` 语句到特定的模块。例如，在第\
  \ 12.6 节中，我们可以使用如下所示的限定 `opens` 语句：\n\n```\nmodule ch12.sec06 {\n    requires jakarta.json.bind;\n\
  \    opens com.horstmann.places to org.eclipse.yasson;\n}\n```\n\n现在，`com.horstmann.places`\
  \ 包仅对 `org.eclipse.yasson` 模块开放。\n\n诚然，将对特定持久化机制的依赖放在模块描述符中似乎相当脆弱。相反，你可以将所有需要持久化的类放在单独的包中并向所有模块打开该包，以便任何持久化机制都可以访问它。\n\
  \n## 12.13. 服务加载 (Service Loading)\n\n`ServiceLoader` 类提供了一种匹配服务接口与实现的轻量级机制。Java\
  \ 平台模块系统使得使用这种机制变得更容易。\n\n这里是对服务加载的快速回顾。服务有一个接口和一个或多个可能的实现。这是一个简单接口的示例：\n\n```\n\
  public interface GreeterService {\n    String greet(String subject);\n    Locale\
  \ getLocale();\n}\n```\n\n一个或多个模块提供实现，例如：\n\n```java\npublic class FrenchGreeter\
  \ implements GreeterService {\n    public String greet(String subject) { return\
  \ \"Bonjour \" + subject; }\n    public Locale getLocale() { return Locale.FRENCH;\
  \ }\n}\n```\n\n服务消费者必须根据其认为合适的任何标准，在所有提供的实现中选择一个。\n\n```\nServiceLoader<GreeterService>\
  \ greeterLoader = ServiceLoader.load(GreeterService.class);\nGreeterService chosenGreeter;\n\
  for (GreeterService greeter : greeterLoader) {\n    if (...) {\n        chosenGreeter\
  \ = greeter;\n    }\n}\n```\n\n在过去，实现是通过在包含实现类的 JAR 文件的 `META-INF/services` 目录中放置文本文件提供的。模块系统提供了更好的方法。不再使用文本文件，而是向模块描述符中添加语句。\n\
  \n提供服务实现的模块添加一个 `provides` 语句，列出服务接口（可能定义在任何模块中）和实现类（必须是该模块的一部分）。这是一个来自 `jdk.security.auth`\
  \ 模块的示例：\n\n```\nmodule jdk.security.auth {\n    ...\n    provides javax.security.auth.spi.LoginModule\
  \ with\n        com.sun.security.auth.module.Krb5LoginModule,\n        com.sun.security.auth.module.UnixLoginModule,\n\
  \        com.sun.security.auth.module.JndiLoginModule,\n        com.sun.security.auth.module.KeyStoreLoginModule,\n\
  \        com.sun.security.auth.module.LdapLoginModule,\n        com.sun.security.auth.module.NTLoginModule;\n\
  }\n```\n\n消费模块包含一个 `uses` 语句。\n\n```\nmodule java.base {\n    ...\n    uses javax.security.auth.spi.LoginModule;\n\
  }\n```\n\n当消费模块中的代码调用 `ServiceLoader.load(serviceInterface.class)` 时，匹配的提供类将被加载，即使它们可能不在可访问的包中。\n\
  \n## 12.14. 模块工具 (Tools for Working with Modules)\n\n`jdeps` 工具分析一组 JAR 文件的依赖关系。例如，你想将\
  \ JUnit 4 模块化。运行：\n\n```\njdeps -s junit-4.12.jar hamcrest-core-1.3.jar \n```\n\n\
  `-s` 标志生成摘要输出：\n\n```\nhamcrest-core-1.3.jar -> java.base\njunit-4.12.jar -> hamcrest-core-1.3.jar\n\
  junit-4.12.jar -> java.base\njunit-4.12.jar -> java.management\n```\n\n这告诉你模块图：\n\
  \n![.png](img/module-graph2.jpg)\n\n如果你省略了 `-s` 标志，你会得到模块摘要，然后是包到所需的包和模块的映射。如果你添加了\
  \ `-v` 标志，列表将类映射到所需的包和模块。\n\n`--generate-module-info` 选项为每个分析的模块生成 `module-info`\
  \ 文件：\n\n```\njdeps --generate-module-info /tmp/junit junit-4.12.jar hamcrest-core-1.3.jar\n\
  ```\n\n还有一个选项可以生成“dot”语言的图形输出。假设你已经安装了 dot 工具，运行这些命令：\n\n```\njdeps -s -dotoutput\
  \ /tmp/junit junit-4.12.jar hamcrest-core-1.3.jar\ndot -Tpng /tmp/junit/summary.dot\
  \ > /tmp/junit/summary.png\n```\n\n然后你得到了这个 `summary.png` 图片：\n\n![.png](img/summary.jpg)\n\
  \n你使用 `jlink` 工具产生一个不需要单独运行时的应用程序。你指定要包含的模块和输出目录。\n\n```\njlink --module-path com.horstmann.greet.jar:ch12.sec05.jar:$JAVA_HOME/jmods\
  \ \\\n--output /tmp/hello\n```\n\n输出目录有一个 `bin` 子目录，其中包含 `java` 执行文件。如果你运行：\n\n\
  ```\nbin/java -m ch12.sec05\n```\n\n就会调用模块类的 `main` 方法。\n\n`jlink` 的意义在于它封装了运行应用程序所需的最小模块集。你可以列出它们：\n\
  \n```\nbin/java --list-modules\n```\n\n在这个示例中，输出是：\n\n```\nch12.sec05\ncom.horstmann.greet\n\
  java.base@21\n```\n\n所有模块都包含*运行时镜像*文件 `lib/modules` 中。在我的计算机上，该文件为 29MB，而所有模块的运行时镜像占用\
  \ 133MB。整个应用程序占用 55MB，仅是 JDK 的一小部分。\n\n这可以作为一个有用工具的基础。你仍然需要为多个平台产生文件集以及应用程序的启动脚本。\n\
  \n你可以使用 `jimage` 命令检查运行时镜像。然而，该格式是 JVM 内部的，运行时镜像并不是供其他工具生成或使用的。\n\n\n\n\n与 JAR 文件一样，这些文件包含类文件。此外，它们还可以包含原生代码库、命令、头文件、配置文件和法律公告。JMOD\
  \ 文件使用 ZIP 格式。你可以使用任何 ZIP 工具检查其内容。\n\n与 JAR 文件不同，JMOD 文件仅对链接有用；也就是说，它们用于生成运行时镜像。除非你还想将原生代码库等二进制文件封装到你的模块中，否则你不需要生成\
  \ JMOD 文件。\n\n## 练习\n\n1. “受限关键字” `module`、`exports`、`requires`、`uses`、`to` 等在模块声明中具有特定含义。你可以将它们作为类、包或*模块*的名称吗？特别地，你可以创建一个名为\
