  \n*重新开始正确翻译部分：*\n\n[content]\n要添加文件处理器，请在日志属性中提供此条目：\n\n```\nhandlers=java.util.logging.ConsoleHandler,java.util.logging.FileHandler\n\
  ```\n\n（此处为后续的翻译内容）\n\n如果多个应用程序（或同一程序的副本）使用同一个日志文件，你应该开启 `append` 标志。或者，在文件名中使用\
  \ `%u` 以便每个应用程序创建一个日志文件。日志文件以旋转序列存在，例如 `myapp.log.0`、`myapp.log.1`、`myapp.log.2`\
  \ 等。当一个文件超过大小限制时，旧的日志将被删除，其他文件重命名，并创建一个编号为 `0` 的新文件。\n\n表 5.3：文件处理器配置\n\n| 配置属性\
  \ | 描述 | 默认值 |\n| --- | --- | --- |\n| `java.util.logging.FileHandler.level` | 处理器级别。\
  \ | `Level.ALL` |\n| `java.util.logging.FileHandler.append` | 为 `true` 时将日志追加到现有文件；否则，每次运行都会打开新文件。\
  \ | `false` |\n| `java.util.logging.FileHandler.limit` | 打开另一个文件之前写入文件的近似最大字节数（`0`\
  \ 为无限制）。 | `50000`（FileHandler 类） |\n| `java.util.logging.FileHandler.pattern` |\
  \ 文件名模式（见 表 5.4）。 | `%h/%u.log` |\n| `java.util.logging.FileHandler.count` | 旋转序列中的日志数量。\
  \ | `1`（不旋转） |\n| `java.util.logging.FileHandler.filter` | 用于过滤日志记录的过滤器（见 5.3.6)）。\
  \ | 无 |\n| `java.util.logging.FileHandler.encoding` | 字符编码。 | 平台字符编码 |\n| `java.util.logging.FileHandler.formatter`\
  \ | 每个日志记录的格式化器。 | `java.util.logging.XMLFormatter` |\n\n表 5.4：日志模式变量\n\n| 变量 |\
  \ 描述 |\n| --- | --- |\n| `%h` | 用户目录（`user.home` 属性）。 |\n| `%t` | 系统的临时目录。 |\n|\
  \ `%u` | 唯一数字。 |\n| `%g` | 旋转日志的代数。如果指定了旋转且模式不包含 `%g`，则使用 `.%g` 后缀。 |\n| `%%` |\
  \ 百分字符。 |\n\n### 5.3.6. 过滤器和格式化器\n\n除了按日志级别过滤，每个处理器还可以有一个实现 `Filter` 接口的过滤器，这是一个功能接口，包含一个方法：\n\
  \n```\nboolean isLoggable(LogRecord record)\n```\n\n要向处理器安装过滤器，请在日志配置中添加如下条目：\n\n\
  ```\njava.util.logging.ConsoleHandler.filter=com.mycompany.myapp.MyFilter\n```\n\
  \n\n\n\n`ConsoleHandler` 和 `FileHandler` 类以文本和 XML 格式输出日志记录。然而，你也可以定义自己的格式。扩展 `java.util.logging.Formatter`\
  \ 类并重写该方法：\n\n```\nString format(LogRecord record)\n```\n\n以你喜欢的方式格式化记录并返回生成的字符串。在\
  \ `format` 方法中，你可以通过调用 表 5.5 中的任意方法来获取有关 `LogRecord` 的信息。\n\n在 `format` 方法中，你可能想要调用该方法：\n\
  \n```\nString formatMessage(LogRecord record)\n```\n\n该方法格式化记录的消息部分，它会在资源包中查找消息键并替换消息格式参数。\n\
  \n许多文件格式（如 XML）需要围绕格式化记录的头部和尾。为了实现这一点，请重写以下方法：\n\n```\nString getHead(Handler h)\n\
  String getTail(Handler h)\n```\n\n最后，在日志配置中设置格式化器：\n\n```\njava.util.logging.FileHandler.formatter=com.mycompany.myapp.MyFormatter\n\
  ```\n\n### 表 5.5：`LogRecord` 属性 get 器\n\n| 方法 | 属性 |\n| --- | --- |\n| `Level getLevel()`\
  \ | 此记录的日志级别。 |\n| `String getLoggerName()` | 记录此记录的记录器名称。 |\n| `ResourceBundle\
  \ getResourceBundle()` `String getResourceBundleName()` | 用于本地化消息的资源包或名称，如果没有提供则返回\
  \ `null`。 |\n| `String getMessage()` | 本地化或格式化之前的“原始”消息。 |\n| `Object[] getParameters()`\
  \ | 参数对象，如果没有提供则返回 `null`。 |\n| `Throwable getThrown()` | 抛出的对象，如果没有提供则返回 `null`。\
  \ |\n| `String getSourceClassName()` `String getSourceMethodName()` | 记录此记录的代码位置。此信息可能由日志代码提供，也可以从运行时堆栈中自动推断。如果日志代码提供了错误的值或者运行代码经过优化导致无法推断出精确位置，则可能是不准确的。\
  \ |\n| `Instant getInstant()` | 创建时间。 |\n| `long getSequenceNumber()` | 此记录的唯一序列号。\
  \ |\n| `long getLongThreadID()` | 创建此记录的线程的唯一 ID。这些 ID 由 `LogRecord` 类分配，与其他线程 ID\
  \ 无关系。 |\n\n## 练习题\n\n1. 编写一个方法 `public ArrayList<Double> readValues(String filename)\
  \ throws ...`，用于读取一个包含浮点数的文件。如果无法打开文件或某些输入不是浮点数，则抛出相应的异常。\n\n2. 编写一个方法 `public double\
  \ sumOfValues(String filename) throws ...`，调用上一个方法并返回文件中值的总和。将任何异常传递给调用者。\n\n3.\
  \ 编写一个程序调用上一个方法并打印结果。捕获异常并向用户提供任何错误情况的反馈。\n\n4. 重复之前的练习，但不要使用异常。相反，让 `readValues`\
  \ 和 `sumOfValues` 返回某种错误代码。\n\n5. 重复之前的练习，但不要使用异常。相反，让 `readValues` 和 `sumOfValues`\
  \ 返回某种错误代码。\n\n6. 重复之前的练习，但不要使用异常。相反，让 `readValues` 和 `sumOfValues` 返回某种错误代码。\n\n\
  7. 重复之前的练习，但不要使用异常。相反，让 `readValues` 和 `sumOfValues` 返回某种错误代码。\n\n8. 重复之前的练习，但不要使用异常。相反，让\
  \ `readValues` 和 `sumOfValues` 返回某种错误代码。\n\n9. 构建（但不要抛出）任意类型的异常对象并获取其堆栈轨迹。你需要考虑以下情况：\n\
  \    - `Scanner` 构造函数抛出异常。\n    - `PrintWriter` 构造函数抛出异常。\n    - `hasNext`、`next`\
  \ 或 `println` 抛出异常。\n    - `close()` 抛出异常。\n    - `close()` 抛出异常。\n\n10. `Scanner`\
  \ 和 `PrintWriter` 的方法不抛出检查异常以便于使用。你如何发现读取或写入过程中发生了错误？\n\n11. 编写一个递归的 `factorial`\
  \ 方法，并打印所有的栈帧。构建（但不要抛出）任意类型的异常对象并获取其堆栈轨迹，如 第 5.1 节 所示。\n\n12. 比较 `Objects.requireNonNull(obj)`\
  \ 和 `assert obj != null` 的用法。为每种用法提供一个引人的理由。\n\n13. 编写一个方法 `int min(int[] values)`，在返回最小值之前，断言它确实是数组中的所有值。使用私有辅助方法，或者如果你已经查看过\
  \ [8]，则使用 `Stream.allMatch`。在一个大型数组上反复调用该方法，并测量在启用、禁用和移除断言时的运行时间。\n\n14. 实现并测试一个日志记录过滤器，过滤掉包含如\
  \ sex、drugs 和 C++ 等坏词汇的日志记录。\n\n15. 实现并测试一个生成 JSON 文件的日志记录格式化器。\n\n\n\n\n在 Java\
  \ 中，泛型编程可能比本该有的要复杂，因为泛型是在 Java 出现了一段时间后才引入的，并且它们的设计初衷是保持向后兼容性。因此，存在许多遗憾的限制，其中一些影响着每位\
  \ Java 程序员。另一些只对泛型类的实现者感兴趣。详情请参见第 6.5 节和第 6.6 节。最后一节涵盖了泛型和反射，如果你在程序中没有使用反射，可以安全地跳过它。\n\
  \n本章的要点是：\n\n1. 泛型类带有一个或多个类型参数的类。\n2. 泛型方法是带有类型参数的方法。\n3. 你可以要求类型参数是一个或多个类型的子类。\n\
  4. 泛型类型是不变的：当 `S` 是 `T` 的子类时，`G<S>` 和 `G<T>` 之间没有关系。\n5. 通过使用通配符 `G<? extends T>`\
  \ 或 `G<? super T>`，你可以指定一个方法可以接受泛型类型 `G` 的 `T` 的子类或超类的实例化。\n6. 泛型类和方法在编译时，类型参数会被擦除。\n\
  7. 擦除对泛型类型施加了许多限制。特别是，你不能实例化泛型类或数组，不能转换为泛型类型，也不能抛出泛型类型的对象。\n8. `Class<T>` 类是泛型的，这很有用，因为\
  \ `cast` 等方法被声明产生类型为 `T` 的值。\n9. 尽管泛型类和方法在虚拟机中被擦除，你可以在运行时发现它们是如何声明的。\n\n## 6.1.\
  \ 泛型类\n\n`generic class`（泛型类）带有一个或多个 `type parameters`（类型参数）的类。作为一个简单的例子，考虑这个用于存储键值对的类：\n\
  \n```\npublic class Entry<K, V> {\n    private K key;\n    private V value;\n\n\
  \    public Entry(K key, V value) {\n        this.key = key;\n        this.value\
  \ = value;\n    }\n\n    public K getKey() { return key; }\n    public V getValue()\
  \ { return value; }\n}\n```\n\n你可以看到，类型参数 `K` 和 `V` 被指定在类名后的尖括号内。在类成员的定义中，它们被用作实例变量、方法参数和返回值的类型。\n\
  \n你通过为类型变量替换类型来 `instantiate`（实例化）泛型类。例如，`Entry<String, Integer>` 是一个普通的类，拥有方法 `String\
  \ getKey()` 和 `Integer getValue()`。\n\n类型参数不能用基本数据类型实例化。例如，在 Java 中 `Entry<String,\
  \ int>` 是无效的。\n\n当你 `construct`（构造）一个泛型类的对象时，可以可以从构造函数中省略类型参数。例如：\n\n```\nEntry<String,\
  \ Integer> entry = new Entry<>(\"Fred\", 42);\n    // 等于 new Entry<String, Integer>(\"\
  Fred\", 42)\n```\n\n注意，在构造参数之前仍然需要提供一对空的尖括号。有些人将这对空括号对称为 `diamond`（菱形）。当你使用菱形语法时，构造函数的类型参数会被推断出来。\n\
  \n## 6.2. 泛型方法\n\n就像泛型类是带有类型参数的类一样，`generic method`（泛型方法）是带有类型参数的方法。泛型方法可以是普通类的方法，也可以泛型类的方法。以下是一个非泛型类中泛型方法的示例：\n\
  \n```\npublic class Arrays {\n    public static <T> void swap(T[] array, int i,\
  \ int j) {\n        T temp = array[i];\n        array[i] = array[j];\n        array[j]\
  \ = temp;\n    }\n}\n```\n\n这个 `swap` 方法可以用于交换任意数组中的元素，只要数组元素类型不是基本数据类型。\n\n```\n\
  String[] friends = ...;\nArrays.swap(friends, 0, 1);\n```\n\n当声明泛型方法时，类型参数放在修饰符（如\
  \ `public` 和 `static`）之后、返回类型之前：\n\n```\npublic static <T> void swap(T[] array,\
  \ int i, int j)\n```\n\n在调用泛型方法时，你不需要指定类型参数。它是根据方法参数和返回类型推断出来的。例如，在调用 `Arrays.swap(friends,\
  \ 0, 1)` 时，`friends` 的类型是 `String[]`，编译器可以推断出 `T` 应该是 `String`。\n\n如果你喜欢，可以在方法名之前显式提供类型，如下：\n\
  \n```\nArrays.<String>swap(friends, 0, 1);\n```\n\n你可能想这样做的原因之一是在出现问题时获得更好的错误信息——参见练习题\
  \ 10。\n\n在进入后续章节中技术细节的泥潭之前，值得思考一下 `Entry` 类和 `swap` 方法的示例，并欣赏泛型类型是多么有用且自然。在 `Entry`\
  \ 类中，键和值的类型可以是任意的。在 `swap` 方法中，数组类型可以是任意的。这通过类型变量清晰地表达出来。\n\n## 6.3. 类型边界\n\n有时，泛型类或方法的类型参数需要满足某些要求。你可以指定一个\
  \ `type bound`（类型边界）来要求类型扩展某些类或接口。\n\n例如，你有一个实现 `Closeable` 接口的对象的 `ArrayList`，你想关闭所有它们：\n\
  \n```\npublic static <T extends Closeable> void closeAll(ArrayList<T> elems)\n \
  \       throws Exception {\n    for (T elem : elems) elem.close();\n}\n```\n\n类型边界\
  \ `extends Closeable` 确保元素类型是 `Closeable` 的子类。因此，调用 `elem.close()` 是有效的。你可以向此方法传递\
  \ `ArrayList<PrintStream>`，但不能传递 `ArrayList<String>`。练习题 28 有这种方法的更有趣变体。\n\n在这个例子中，我们需要是因为参数是\
  \ `ArrayList`。如果方法接受数组，你就不需要泛型方法了。你可以简单地使用普通方法：\n\n```\npublic static void closeAll(Closeable[]\
  \ elems) throws Exception\n```\n\n这可行，因为像 `PrintStream[]` 这样的数组类型是 `Closeable[]`\
  \ 的子类。然而，正如你在下一节中看到的，`ArrayList<PrintStream>` 不是 `ArrayList<Closeable>` 的子类。使用边界类型参数解决了这个问题。\n\
  \n类型参数可以有多个边界，例如：\n\n```\nT extends Runnable & Closeable\n```\n\n这种语法与捕获多个异常的语法相似，唯一的区别在于类型是用“与”运算符组合的，而多个异常是用“或”运算符组合的。\n\
  \n你可以有任意数量的接口边界，但边界最多可以有一个类。如果你有一个类作为边界，它必须是边界列表中的第一个。\n\n## 6.4. 类型变型与通配符\n\n假设你需要实现一个处理\
  \ `Employee` 类子类对象的数组的方法。你只需将参数声明为 `Employee[]` 类型即可：\n\n```\npublic static void\
  \ process(Employee[] staff) { ... }\n```\n\n如果 `Manager` 是 `Employee` 的子类，你可以向该方法传递一个\
  \ `Manager[]` 数组，因为 `Manager[]` 是 `Employee[]` 的子类。这种行为被称为 `covariance*`（协变）。数组的变化方式与元素类型相同。\n\
  \n现在，假设你想处理数组列表而不是数组。然而，这里有一个问题：`ArrayList<Manager>` 类型不是 `ArrayList<Employee>`\
  \ 的子类。\n\n这种限制是有原因的。如果允许将 `ArrayList<Manager>` 赋值给类型为 `ArrayList<Employee>` 的变量，你可能会通过存储非经理员工来破坏该数组列表：\n\
  \n\n\n\n\n```\nArrayList<Manager> bosses = new ArrayList<>();\nArrayList<Employee>\
  \ empls = bosses; // 不合法，但假设它可以可以...\nempls.add(new Employee(...)); // bosses 中出现了一个非经理！\n\
  ```\n\n由于不允许从 `ArrayList<Manager>` 转换为 `ArrayList<Employee>`，因此这种错误不会发生。\n\n你是否可以在数组上生成相同的错误，在数组中从\
  \ `Manager[]` 到 `Employee[]` 的转换是允许的？可以，正如你在 4 中看到的。Java 数组是协变的（covariant），这很方便但不类型安全。当你向\
  \ `Manager[]` 数组中存储一个简单的 `Employee` 时，会抛出 `ArrayStoreException`。相比之下，Java 中所有的泛型类型都是不变的（invariant）。\n\
  \n在 Java 中，你使用通配符（wildcards）来指定方法参数和返回类型应该允许的变化方式。这种机制有时被称为“使用点变型”（use-site variance）。你将在后续章节中看到细节。\n\
  \n### 6.4.1. 子类型通配符\n\n在许多情况下，在不同的列表之间进行转换是完全安全的。假设一个方法永远不写入该列表，因此它不会损坏其参数。使用通配符来表达这一事实：\n\
  \n```\npublic static void printNames(ArrayList<? extends Employee> staff) {\n  \
  \  for (int i = 0; i < staff.size(); i++) {\n        Employee e = staff.get(i);\n\
  \        System.out.println(e.getName());\n    }\n}\n```\n\n通配符类型 `? extends Employee`\
  \ 表示 `Employee` 的某个未知子类型。你可以使用 `ArrayList<Employee>` 或子类型的列表（例如 `ArrayList<Manager>`）调用此方法。\n\
  \n类 `ArrayList<? extends Employee>` 的 `get` 方法的返回类型为 `? extends Employee`。语句\n\n\
  ```\nEmployee e = staff.get(i);\n```\n\n是完全合法的。无论 `?` 代表什么类型，它都是 `Employee` 的子类型，`staff.get(i)`\
  \ 的结果可以赋值给变量 `Employee e`。（（我在这个示例中没有使用增强型 `for` 循环是为了准确展示元素是如何从列表中获取的。）\n\n如果尝试向\
  \ `ArrayList<? extends Employee>` 存储元素会发生什么？那是行不通的。考虑如下调用\n\n```\nstaff.add(x);\n\
  ```\n\n`add` 方法的参数类型是 `? extends Employee`，**没有对象**可以传递给这个方法。如果你传递了一个例如 `Manager`\
  \ 对象，编译器将拒绝。毕竟，`?` 可能指向**任何子类**，也许 `Janitor`（清洁工），而你不能向 `ArrayList<Janitor>` 中添加\
  \ `Manager`。\n\n你当然可以传递 `null`，但那不是一个对象。\n\n总结来说，你可以从 `? extends Employee` 转换为 `Employee`，但你永远无法将任何内容转换为\
  \ `? extends Employee`。这解释了为什么你可以从 `ArrayList<? extends Employee>` 读取但不能从中写入。\n\n\
  ### 6.4.2. 上类型通配符\n\n通配符类型 `? extends Employee` 表示 `Employee` 的任意子类型。相反，通配符类型 `?\
  \ super Employee` 表示 `Employee` 的上类型。这些通配符作为函数对象的参数时通常非常有用。这里有一个典型的例子。`Predicate`\
  \ 接口有一个方法用于测试类型为 `T` 的对象是否具有特定属性：\n\n```\npublic interface Predicate<T> {\n    boolean\
  \ test(T arg);\n    ...\n}\n```\n\n此方法打印所有具有给定属性的员工名称：\n\n```\npublic static void\
  \ printAll(Employee[] staff, Predicate<Employee> filter) {\n    for (Employee e\
  \ : staff) \n        if (filter.test(e))\n            System.out.println(e.getName());\n\
  }\n```\n\n你可以使用类型为 `Predicate<Employee>` 的对象调用此方法。由于这是一个函数式接口，你也可以传递 lambda 表达式：\n\
  \n```\nprintAll(employees, e -> e.getSalary() > 100000);\n```\n\n现在假设你想使用 `Predicate<Object>`，例如：\n\
  \n```java\nPredicate<Object> evenLength = e -> e.toString().length() % 2 == 0;\n\
  printAll(employees, evenLength);\n```\n\n这不应该没问题。毕竟，每个 `Employee` 都是一个带有 `toString`\
  \ 方法的 `Object`。然而，和所有的泛型类型一样，`Predicate` 接口是不变的，`Predicate<Employee>` 和 `Predicate<Object>`\
  \ 之间没有关系。\n\n解决办法是允许任何 `Predicate<? super Employee>`：\n\n```java\npublic static\
  \ void printAll(Employee[] staff, Predicate<? super Employee> filter) {\n    for\
  \ (Employee e : staff) \n        if (filter.test(e))\n            System.out.println(e.getName());\n\
  }\n```\n\n仔细观察调用 `filter.test(e)`。由于 `test` 的参数类型是 `Employee` 的某个上类型，因此传递 `Employee`\
  \ 对象是安全的。\n\n这种情况很典型。函数在它们的参数类型上自然是**逆变**（contravariant）。例如，当期望一个可以处理员工的函数时，给一个愿意处理任意对象的函数是可以的。\n\
  \n通常，当你指定泛型函数式接口作为方法参数时，你应该使用 `super` 通配符。\n\n有些程序员喜欢用通配符的“PECS”助记法：生产者（producer）用\
  \ `extends`，消费者（consumer）用 `super`。从中读取值的 `ArrayList` 是生产者，所以你使用 `extends` 通配符。你提供值进行测试的\
  \ `Predicate` 是消费者，使用 `super`。\n\n### 6.4.3. 带类型变量的通配符\n\n考虑前一节方法的泛化，它打印满足条件的元素：\n\
  \n```\npublic static <T> printAll(T[] elements, Predicate<T> filter) {\n    for\
  \ (T e : elements)\n        if (filter.test(e))\n            System.out.println(e.toString());\n\
  }\n```\n\n这是一个适用于任意类型数组的泛型方法。类型参数是传入数组的类型。然而，它存在你在上一节看到的局限性。`Predicate` 的类型参数必须与方法的类型参数匹配。\n\
  \n解决方案与之前相同——但这次通配符的边界是一个类型变量：\n\n```\npublic static <T> printAll(T[] elements,\
  \ Predicate<? super T> filter)\n```\n\n此方法接收 `T` 类型或其上类型的过滤器。\n\n这里是另一个例子。`Collection<E>`\
  \ 接口将在后续章节详细介绍，它描述了类型元素的集合。它有一个方法\n\n```\npublic boolean addAll(Collection<? extends\
  \ E> c)\n```\n\n你可以从另一个元素类型也是 `E` 或其子类型的集合中添加所有元素。通过此方法，你可以将经理集合添加到员工集合中，但反之则不行。\n\
  \n为了看到类型声明可以变得多么复杂，考虑 `Collections.sort` 方法的定义\n\n```\npublic static <T extends\
  \ Comparable<? super T>> sort(List<T> list)\n```\n\n`List` 接口将在下一节详细介绍，描述了一个序列，如链表或\
  \ `ArrayList`。`sort` 方法愿意排序任何 `List<T>`，只要 `T` 是 `Comparable` 的子类型。但 `Comparable`\
  \ 接口再次是泛型的：\n\n```\npublic interface Comparable<T> {\n    int compareTo(T other);\n\
  }\n```\n\n它的类型参数指定了 `compareTo` 方法的参数类型。因此，似乎 `Collections.sort` 可以声明为：\n\n```\n\
  public static <T extends Comparable<T>> void sort(List<T> list)\n```\n\n但这太严格了。假设\
  \ `Employee` 类实现了 `Comparable<Employee>`，按薪水比较员工。假设 `Manager` 类继承 `Employee`。注意它实现了\
  \ `Comparable<Employee>`，而**不是** `Comparable<Manager>`。因此，`Manager` **不是** `Comparable<Manager>`\
  \ 的子类型，但它是 `Comparable<? super Manager>` 的子类型。\n\n\n\n\n\n在某些编程语言（如 `C#` 和 `Scala`）中，你可以声明类型参数为协变（covariant）或逆变（contravariant）。例如，通过将\
  \ `Comparable` 的类型参数声明为逆变，就不需要为每个 `Comparable` 参数使用通配符。这种“声明处变性”（declaration-site\
  \ variance）非常方便，但它不如 Java 通配符的“使用处变性”（use-site variance）。\n\n### 6.4.4. 无界通配符\n\n\
  对于只执行非常通用操作的情况，可以使用无界通配符。例如，这里有一个检查 `ArrayList` 是否包含任何 `null`元素的方法：\n\n```java\n\
  public static boolean hasNulls(ArrayList<?> elements) {\n    for (Object e : elements)\
  \ {\n        if (e == null) return true;\n    }\n    return false;\n}\n```\n\n由于\
  \ `ArrayList` 的类型参数并不重要，因此使用 `ArrayList<?>` 是合理的。同样，可以将 `hasNulls` 写成一个泛型方法：\n\n\
  ```java\npublic static <T> boolean hasNulls(ArrayList<T> elements)\n```\n\n但通配符易于理解，因此这是首选方法。\n\
  \n### 6.4.5. 通配符捕获\n\n让我们尝试使用通配符定义一个 `swap` 方法：\n\n```java\npublic static void swap(ArrayList<?>\
  \ elements, int i, int j) {\n    ? temp = elements.get(i); // 无法工作\n    elements.set(i,\
  \ elements.get(j));\n    elements.set(j, temp);\n}\n```\n\n这是行不通。你可以将 `?` 作为类型参数，但不能作为类型。\n\
  \n然而，有一个变通方法。添加这样一个辅助方法：\n\n```java\npublic static void swap(ArrayList<?> elements,\
  \ int i, int j) {\n    swapHelper(elements, i, j);\n}\n\nprivate static <T> void\
  \ swapHelper(ArrayList<T> elements, int i, int j) {\n    T temp = elements.get(i);\n\
  \    elements.set(i, elements.get(j));\n    elements.set(j, temp);\n}\n```\n\n对\
  \ `swapHelper` 的调用是有效的，是因为有一个被称为“通配符捕获”（wildcard capture）的特殊规则。编译器不知道 `?` 是什么，但它代表某种类型，因此调用泛型方法是可以的。`swapHelper`\
  \ 的类型参数 `T` “捕获”了通配符类型。由于 `swapHelper` 是一个泛型方法，而不是参数中带有通配符的方法，它可以利用类型变量 `T` 来声明变量。\n\
  \n我们获得了什么？API 的用户看到的是一个易于理解的 `ArrayList<?>`，而不是一个泛型方法。\n\n## 6.5. Java 虚拟机中的泛型\n\
  \n当泛型类型和方法被 Java 时，Java 的设计者希望类的泛型形式能与先前的版本兼容。例如，应该能够将 `ArrayList<String>` 传递给泛型出现之前编写的、接收\
  \ `ArrayList` 类的方法（该类收集 `Object` 类型的元素）。语言设计者决定采用一种在虚拟机中“擦除”（erases）类型的实现方案。这在当时非常流行，因为它让\
  \ Java 用户能够逐渐迁移到使用泛型。正如你可以想象的，这种方案是有缺陷的，而且正如为了兼容性而做出的妥协经常发生，在迁移成功完成很久之后，缺点依然存在。\n\
  \n在本节中，你将看到虚拟机内部发生了什么，下一节将探讨其后果。\n\n### 6.5.1. 类型擦除\n\n当你定义一个泛型类型时，它会被编译为原始类型（raw\
  \ type）。例如，第 6.1 节 中的 `Entry<K, V>` 类会变成：\n\n```java\npublic class Entry {\n   \
  \ private Object key;\n    private Object value;\n\n    public Entry(Object key,\
  \ Object value) {\n        this.key = key;\n        this.value = value;\n    }\n\
  \n    public Object getKey() { return key; }\n    public Object getValue() { return\
  \ value; }\n}\n```\n\n每一个 `K` 和 `V` 都被替换为 `Object`。\n\n如果类型变量有边界，它会被替换为第一个边界。假设我们声明\
  \ `Entry` 类为：\n\n```java\npublic class Entry<K extends Comparable<? super K> & Serializable,\
  \ \n                   V extends Serializable>\n```\n\n那么它会被擦除为类：\n\n```java\npublic\
  \ class Entry {\n    private Comparable key;\n    private Serializable value;\n\
  \    ...\n}\n```\n\n### 6.5.2. 转换插入\n\n擦除听起来有些危险，但实际上是完全安全的。例如，假设你使用一个 `Entry<String,\
  \ Integer>` 对象。当你构造对象时，必须提供一个 `String` 类型的键和一个 `Integer` 类型（或可转换为 Integer 类型）的值。否则，你的程序甚至无法编译。因此，你可以保证\
  \ `getKey` 方法返回一个 `String`。\n\n然而，假设你的程序在带有“未经检查”（unchecked）警告的情况下编译通过，可能是因为你使用了强制转换或混合了泛型和原始\
  \ `Entry` 类型。在这种情况下，`Entry<String, Integer>` 可能会有一个不同类型的键。\n\n因此，在运行时进行安全检查也是必要的。每当从一个具有被擦除类型的表达式中读取内容时，编译器就会插入一个强制转换。例如：\n\
  \n```java\nEntry<String, Integer> entry = ...;\nString key = entry.getKey();\n```\n\
  \n由于被擦除的 `getKey` 方法返回 `Object`，编译器会生成类似：\n\n```java\nString key = (String) entry.getKey();\n\
  ```\n\n### 6.5.3. 桥接方法\n\n在前面的节中，你已经看到了擦除做了什么。它是简单且安全的。好吧，几乎简单。在擦除参数类型时，有时需要“桥接方法”（bridge\
  \ methods）。除非你想了解 Java 泛型的某些晦涩限制（参见第 6.6 节）。\n\n考虑这个例子：\n\n```java\npublic class\
  \ WordList extends ArrayList<String> {\n    // 假设这里定义了某些方法\n}\n```\n\n现在考虑这段代码：\n\
  \n```java\nWordList words = ...;\nArrayList<String> strings = words;\nstrings.add(\"\
  C++\");\n```\n\n最后的调用调用的是 `ArrayList` 的 `add(Object)` 方法。为了让这工作，编译器在 `WordList`\
  \ 类中合成了一个桥接方法：\n\n```java\npublic boolean add(Object e) {\n    return add((String)\
  \ e);\n}\n```\n\n在调用 `strings.add(\"C++\")` 时，调用的是 `add(Object)` 方法，它调用 `WordList`\
  \ 的 `add(String)` 方法。\n\n桥接方法也用于返回类型变化的情况。考虑这个方法：\n\n```java\npublic class WordList\
  \ extends ArrayList<String> {\n    public String get(int i) {\n        return super.get(i).toLowerCase();\n\
  \    }\n    ...\n}\n```\n\n在 `WordList` 类中，有两个 `get` 方法：\n\n```java\nString get(int\
  \ i) // 定义在 WordList 中\nObject get(int i) // 重写 ArrayList 中的方法\n```\n\n第二个方法是编译器合成的，它调用第一个方法。这再次是为了让动态方法查找工作。\n\
  \n这些方法具有相同的参数类型但不同的返回类型。在 Java 语言中，你无法实现这样的方法对。但在虚拟机中，方法是通过其名称、参数类型和返回类型来指定的，这允许编译器生成这种方法对。\n\
  \n\n\n\n桥接方法（bridge method）再次为了实现动态方法查找而生成，它调用了第一个方法。\n\n## 6.6. 泛型的限制\n\n在 Java\
  \ 中使用泛型类型和方法时存在若干限制——有些仅仅令人惊讶，另一些则确实非常不便。大部分限制都是类型擦除（type erasure）的结果。接下来的章节将向你展示实践中最可能遇到的那些限制。\n\
  \n### 6.6.1. 不能使用基本类型参数\n\n类型参数永远不能是基本类型。例如，你不能创建一个 `ArrayList<int>`。正如你所看到的，在虚拟机中只有一种类型，即存储\
  \ `Object` 类型元素的原始 `ArrayList`。`int` 不是一个对象。\n\n在泛型刚引入时，这并不被认为是大问题。毕竟，人们可以创建一个 `ArrayList<Integer>`\
  \ 并依赖自动装箱（autoboxing）。然而，随着泛型的使用越来越广泛，这种痛苦正在增加。存在大量的函数式接口，如 `IntFunction`、`LongFunction`、`DoubleFunction`、`ToIntFunction`、`ToLongFunction`、`ToDoubleFunction`——这只处理了一元函数八种基本类型中的三种。\n\
  \n### 6.6.2. 运行时所有类型都是原始类型\n\n在虚拟机中，只有原始类型（raw types）。例如，你不能在运行时查询 `ArrayList` 是否包含\
  \ `String` 对象。如下的条件：\n\n```\nif (a instanceof ArrayList<String>)\n```\n\n是一个编译错误，因为这种检查永远无法被执行。\n\
  \n对泛型类型的实例化进行强制转换同样无效，但它是合法的。\n\n```\nObject result = ...;\nArrayList<String> list\
  \ = (ArrayList<String>) result;\n// 警告—这只检查 result 是否为原始 ArrayList\n```\n\n这种强制转换是允许的，因为有时无法避免它。如果\
  \ `result` 是一个非常通用过程的结果（例如通过反射调用方法，见 4），且编译器不知道它的确切类型，程序员必须使用强制转换。仅转换为 `ArrayList`\
  \ 或 `ArrayList<?>` 是不够的。\n\n为了消除警告，可以像这样对变量进行注解：\n\n```\n@SuppressWarnings(\"unchecked\"\
  ) ArrayList<String> list\n    = (ArrayList<String>) result;\n```\n\n滥用 `@SuppressWarnings`\
  \ 注解会导致堆污染（heap pollution）——即本应属于某个特定泛型类型实例但实际上属于另一个实例的对象。例如，你可以将一个 `ArrayList<Employee>`\
  \ 赋值给 `ArrayList<String>` 引用。后果是当获取错误类型的元素时会抛出 `ClassCastException`。\n\n堆污染的麻烦在于，报告的运行时错误远离问题的根源——即插入错误元素。如果你需要调试此类问题，可以使用“检查视图”（checked\
  \ view）。在你构建（例如）`ArrayList<String>` 的地方，改用：\n\n```\nList<String> strings\n    =\
  \ Collections.checkedList(new ArrayList<>(), String.class);\n```\n\n该视图会监控向列表的所有插入操作，并在添加错误类型的对象时抛出异常。\n\
  \n`getClass` 方法始终返回一个原始类型。例如，如果 `list` 是 `ArrayList<String>`，那么 `list.getClass()`\
  \ 返回 `ArrayList.class`。事实上，并没有 `ArrayList<String>.class`——这样的类字面量是语法错误。\n\n此外，你不能在类字面量使用类型变量。没有\
  \ `T.class`、`T[]].class` 或 `ArrayList<T>.class`。\n\n### 6.6.3. 你不能实例化类型变量\n\n你不能在\
  \ `new T(...)` 或 `new T[...]` 等表达式中使用类型变量。这些形式是被禁止的，因为当 `T` 被擦除时，它们无法实现程序员的预期。\n\
  \n如果你想创建一个泛型实例或数组，必须付出更多努力。假设你想提供一个 `repeat` 方法，使得 `Arrays.repeat(n, obj)` 创建一个包含\
  \ `n` 个 `obj` 拷贝的数组。当然，你希望数组的元素类型与 `obj` 的类型相同。这种尝试行不通：\n\n```java\npublic static\
  \ <T> T[] repeat(int n, T obj) {\n    T[] result = new T[n]; // 错误无法构造数组 new T[...]\n\
  \    for (int i = 0; i < n; i++) result[i] = obj;\n    return result;\n}\n```\n\n\
  为了解决这个问题，让调用者提供方法引用作为数组构造函数：\n\n```java\nString[] greetings = Arrays.repeat(10,\
  \ \"Hi\", String[]::new);\n```\n\n该方法的实现如下：\n\n```java\npublic static <T> T[] repeat(int\
  \ n, T obj, IntFunction<T[]> constr) {\n    T[] result = constr.apply(n); \n   \
  \ for (int i = 0; i < n; i++) result[i] = obj;\n    return result;\n}\n```\n\n或者，你可以要求用户提供一个类对象并使用反射。\n\
  \n```java\npublic static <T> T[] repeat(int n, T obj, Class<T> cl) {\n    @SuppressWarnings(\"\
  unchecked\") T[] result\n        = (T[]) java.lang.reflect.Array.newInstance(cl,\
  \ n); \n    for (int i = 0; i < n; i++) result[i] = obj;\n    return result;\n}\n\
  ```\n\n该方法的调用方式如下：\n\n```java\nString[] greetings = Arrays.repeat(10, \"Hi\", String.class);\n\
  ```\n\n另一种方案是让调用者提供数组并使用反射。\n\n```java\npublic static <T> T[] repeat(int n, T obj,\
  \ T[] array) {\n    T[] result;\n    if (array != null) {\n        @SuppressWarnings(\"\
  unchecked\") T[] newArray\n            = (T[]) java.lang.reflect.Array.newInstance(array.getClass().getComponentType(),\
  \ n);\n        result = newArray;\n    }\n    // ... 剩余逻辑\n}\n```（注：此处原文截断不完整）\n\
  \n### 6.6.4. 你不能构造参数化类型的数组\n\n假设你想创建一个 `Entry` 对象的数组：\n\n```java\nvar entries =\
  \ new Entry<String, Integer>[100]; // 错误—无法构造泛型组件数组\n```\n\n这是一个语法错误。这种构造是被禁止的，因为擦除后，数组构造函数会创建一个原始\
  \ `Entry` 数组。此时你可能添加任何类型的 `Entry` 对象（例如 `Entry<Employee, Manager>`）。注意，`Entry<String,\
  \ Integer>[]` 这种类型是合法的。你可以声明该类型的变量。如果你真的想初始化它，可以这样做：\n\n```java\n@SuppressWarnings(\"\
  unchecked\") Entry<String, Integer>[] entries\n    = (Entry<String, Integer>[])\
  \ Entry<?, ?>[100];\n```\n\n但使用列表更简单：\n\n```java\nvar entries = new ArrayList<Entry<String,\
  \ Integer>>(100);\n```\n\n记住，变长参数（varargs）伪装成数组。如果这种参数是泛型的，你可以绕过对泛型数组创建的限制。考虑这个方法：\n\
  \n```java\npublic static <T> ArrayList<T> asList(T... elements) {\n    var result\
  \ = new ArrayList<T>();\n    for (T e : elements) result.add(e);\n    return result;\n\
  }\n```\n\n现在考虑这个调用：\n\n```java\nEntry<String, Integer> entry1 = ...;\nEntry<String,\
  \ Integer> entry2 = ...;\nArrayList<Entry<String, Integer>> entries = Lists.asList(entry1,\
  \ entry2);\n```\n\n\n\n`T` 的推断类型为泛型类型 `Entry<String, Integer>`，因此 `elements` 是类型为\
  \ `Entry<String, Integer>` 的数组。这正是你无法自己创建的数组类型！\n\n在这种情况下，编译器报告的是警告而不是错误。如果你的方法只从参数数组中读取元素，则应该使用\
  \ `@SafeVarargs` 注解来抑制警告：\n\n```\n@SafeVarargs public static <T> ArrayList<T> asList(T...\
  \ elements) \n```\n\n此注解可以应用于 `static`、`final` 或 `private` 方法，也可以构造函数。任何其他方法都可能被重写，因此不符合该注解。\n\
  \n### 6.6.5. 类类型变量在静态上下文中无效\n\n考虑一个带有类型变量的泛型类，例如 `Entry<K, V>`。你不能在静态变量或静态方法中使用类型变量\
  \ `K` 和 `V`。例如，以下代码不起作用：\n\n```\npublic class Entry<K, V> {\n    private static\
  \ V defaultValue;\n        // Error—V in static context\n    public static void\
  \ setDefault(V value) { defaultValue = value; }\n        // Error—V in static context\n\
  \    ...\n }\n```\n\n毕竟，类型擦除意味着在擦除后的 `Entry` 类中只有一个这样的变量或方法，而不是为每个 `K` 和 `V` 都对应一个。\n\
  \n### 6.6.6. 方法在擦除后可能发生冲突\n\n你不能声明在擦除后会引起冲突的方法。例如，以下代码将是错误：\n\n```\npublic interface\
  \ Ordered<T> extends Comparable<T> {\n    public default boolean equals(T value)\
  \ { \n        // Error—erasure clashes with Object.equals\n        return compareTo(value)\
  \ == 0;\n    }\n    ...\n}\n```\n\n`equals(T value)` 方法擦除为 `equals(Object value)`，这与来自\
  \ `Object` 的相同方法冲突。\n\n有时冲突的原因更为微妙。这里有一个棘手的情况：\n\n```\npublic class Employee implements\
  \ Comparable<Employee> {\n    ...\n    public int compareTo(Employee other) {\n\
  \        return name.compareTo(other.name);\n    }\n}\n\npublic class Manager extends\
  \ Employee implements Comparable<Manager> {\n    // Error—cannot have two instantiations\
  \ of Comparable as supertypes\n    ...\n    public int compareTo(Manager other)\
  \ {\n        return Double.compare(salary, other.salary);\n    }\n}\n```\n\n`Manager`\
  \ 类自 `Employee`，因此获取了父类型 `Comparable<Employee>`。自然地，经理们想要根据工资互相比较，而不是根据姓名。为什么不呢？这里没有擦除。只是两个方法：\n\
  \n```\npublic int compareTo(Employee other)\npublic int compareTo(Manager other)\n\
  ```\n\n问题在于桥接方法（bridge methods）发生了冲突。回想 6.5.3 节，这两个方法都会产生一个桥接方法\n\n```\npublic int\
  \ compareTo(Object other)\n```\n\n### 6.6.7. 异常与泛型\n\n你不能抛出或捕获泛型类的对象。事实上，你甚至无法形成\
  \ `Throwable` 的泛型子类：\n\n```\npublic class Problem<T> extends Exception\n    // Error—a\
  \ generic class can’t be a subtype of Throwable\n```\n\n你不能在 `catch` 子句中使用类型变量：\n\
  \n```java\npublic static <T extends Throwable> void doWork(Runnable r, Class<T>\
  \ cl) {\n    try {\n        r.run();\n    } catch (T ex) { // Error—can’t catch\
  \ type variable\n        Logger.getGlobal().log(..., ..., ex);\n    }\n}\n```\n\n\
  然而，你*可以*在 `throws` 声明中使用类型变量：\n\n```java\npublic static <V, T extends Throwable>\
  \ V doWork(Callable<V> c, T ex) throws T {\n    try {\n        return c.call();\n\
  \    } catch (Throwable realEx) { \n        ex.initCause(realEx);\n        throw\
  \ ex;\n    }\n}\n```\n\n你可以使用泛型消除检查异常和未检查异常之间的区别。关键在于这对对方法：\n\n```\npublic class\
  \ Exceptions {\n    @SuppressWarnings(\"unchecked\")\n    private static <T extends\
  \ Throwable> \n            void throwAs(Throwable e) throws T {\n        throw (T)\
  \ e; // 强制转换被擦除为 (Throwable) e\n    }\n    public static <V> V doWork(Callable<V>\
  \ c) {\n        try {\n            return c.call();\n        } catch (Throwable\
  \ ex) { \n            Exceptions.<RuntimeException>throwAs(ex);\n            return\
  \ null;\n        }\n    }\n}\n```\n\n现在考虑这个方法：\n\n```java\npublic static String[]\
  \ readWords(Path path) {\n    return doWork(() -> Files.readString(path).split(\"\
  \\\\s+\")); \n}\n```\n\n尽管 `Files.readString` 在路径未找到时会抛出检查异常，但该异常在 `readWords` 方法中既没有声明也没有捕获！\n\
  \n## 6.7. 反映与泛型\n\n在接下来的章节中，你将看到可以使用反射包中的泛型类完成什么，以及你如何在虚拟机中找到擦除过程后保留的少量泛型类型信息。\n\
  \n### 6.7.1. `Class<T>` 类\n\n`Class` 类有一个类型参数，即 `Class` 对象所描述的类。\n\n\n\n\n\n3. `WildcardType`\
  \ 接口，描述通配符（例如 `? super T`）\n\n4. `ParameterizedType` 接口，描述泛型类或接口类型（例如 `Comparable<?\
  \ super T>`）\n\n5. `GenericArrayType` 接口，描述泛型数组（例如 `T[]`）\n\n注意，最后四个子类型都是接口——虚拟机会实例化实现这些接口的相应类。\n\
  \n类和方法都可以拥有类型变量。从技术上讲，构造函数不是方法，它们在反射库中由单独的类表示。它们也可以是泛型的。要确定一个 `Class`、`Method` 或\
  \ `Constructor` 对象是否来自泛型声明，请调用 `getTypeParameters` 方法。你将得到一个 `TypeVariable` 实例的数组，声明中的每个类型变量都对应一个实例；如果该声明不是泛型的，则返回一个长度为\
  \ 0 的数组。\n\n`TypeVariable<D>` 接口是泛型的。类型参数是 `Class<T>`、`Method` 或 `Constructor<T>`，取决于类型变量声明的位置。例如，这里是获取\
  \ `ArrayList` 类类型变量的方法：\n\n```\nTypeVariable<Class<ArrayList>>[] vars = ArrayList.class.getTypeParameters();\n\
  String name = vars[0].getName(); // \"E\"\n```\n\n这里是 `Collections.sort` 方法的类型变量：\n\
  \n```\nMethod m = Collections.class.getMethod(\"sort\", List.class);\nTypeVariable<Method>[]\
  \ vars = m.getTypeParameters();\nString name = vars[0].getName(); // \"T\"\n```\n\
  \n后者变量有一个边界（bound），你可以这样处理它：\n\n```\nType[] bounds = vars[0].getBounds();\nif (bounds[0]\
  \ instanceof ParameterizedType p) { // Comparable<? super T>\n    Type[] typeArguments\
  \ = p.getActualTypeArguments();\n    if (typeArguments[0] instanceof WildcardType\
  \ t) { // ? super T\n        Type[] upper = t.getUpperBounds(); // ? extends ...\
  \ & ...\n        Type[] lower = t.getLowerBounds(); // ? super ... & ...\n     \
  \   if (lower.length > 0) {        \n            String description = lower[0].getTypeName();\
  \ // \"T\"\n            ...\n        }\n    }\n}\n```\n\n这让你了解了如何分析泛型声明。我不会在此纠结细节，因为这在实践中并不常见。关键点在于，泛型类和方法的声明并没有被擦除，你可以通过反射访问它们。\n\
  \n## 练习\n\n1. 实现一个类 `Stack<E>`，用于管理一个类型为 `E` 的元素数组列表。提供 `push`、`pop` 和 `isEmpty`\
  \ 方法。\n\n2. 重新实现 `Stack<E>` 类，使用数组来存储元素。如有必要，在 `push` 方法中扩展数组。提供两种解决方案，一种使用 `E[]`\
  \ 数组，另一种使用 `Object[]` 数组。两种解决方案都应该在无警告的情况下编译。你更倾向于哪一种？为什么？\n\n3. 实现一个类 `Table<K,\
  \ V>`，用于管理一个 `Entry<K, V>` 元素的数组列表。提供获取与键关联的值、为键存入值以及删除键的方法。\n\n4. 在上一个练习中，将 `Entry`\
  \ 改为嵌套类。该类应该是泛型的吗？\n\n5. 考虑这个 `swap` 方法的变体，其中数组可以提供变长参数（varargs）：\n\n```\npublic\
  \ static <T> T[] swap(int i, int j, T... values) {\n    T temp = values[i];\n  \
  \  values[i] = values[j];\n    values[j] = temp;\n    return values;\n}\n```\n\n\
  现在看这个调用：\n\n```\nDouble[] result = Arrays.swap(0, 1, 1.5, 2, 3);\n```\n\n你得到了什么错误信息？现在调用\n\
  \n```\nDouble[] result = Arrays.<Double>swap(0, 1, 1.5, 2, 3);\n```\n\n错误信息是否有所改进？你该如何修复这个问题？\n\
  \n6. 实现一个泛型方法，将一个数组列表的所有元素附加到另一个数组列表中。对其中一个类型参数使用通配符。提供两种等效的解决方案，一个使用 `? extends\
