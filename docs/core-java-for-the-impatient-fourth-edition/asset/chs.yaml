  \ 的不同示例。\n10. 编写一个程序，通过生成一个随机 `long` 值并以 36 进制打印，产生一个字母和数字的随机字符串。\n11. 编写一个程序，读取一行文本并打印所有非\
  \ ASCII 字符及其 Unicode 值。\n12. 编写一个 `switch` 表达式，当给定指南针方向 `\"N\"`、`\"S\"`、`\"E\"`\
