    作为下一个示例，我将查看数组排序，更具体地说，我将查看如何按升序对包含 `N` 个元素的数组进行排序。这是一个非常经典的问题，有很多算法可以解决这个问题。在下一章中，我将专门介绍排序算法，而这里我只想展示一个名为“冒泡排序”的示例。该算法非常简单。你遍历数组并成对比较元素（每个元素与其后继元素）。如果你遇到两个顺序错误的元素——一个元素比它的后继元素大——你就交换它们。这个过程一直重复，直到你完成一次迭代且没有元素大于其后继元素。此时算法可以写如下：


