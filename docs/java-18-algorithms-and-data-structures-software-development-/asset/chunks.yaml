    如前所述，数据结构只是集合类（collection class）的另一种名称。除了算法之外，这里的目的是解释经典的集合类，并将它们实现为用 Java 编写完成类。你可能会问，既然这些类已经作为完成且经过测试的类存在，为什么还要这样做呢？这有两个原因。首先，了解类是如何构建的是非常重要的，这样你就能知道类的方法在原理上是如何工作的，并具备文档中所描述的特性。只有掌握了这些知识，你在实践中才能做出正确的选择，并选择最适合所写算法的集合类。关于实现经典集合类的另一个原因，我还要提到，学习这些实现可以引入一些对实际编程至关重要的技术和方法。因此，需要强调的是，编写新的集合
    API 和集合类的**目标并不是为了替换 Java 自带的类**，而是为了解释这些类在原理上是如何实现的，并借此应用一些专业软件开发者必须掌握的有用/必要的技术。


    由于许多数据结构以及说明算法和数据结构应用的示例非常多，因此我在书中只包含了部分代码。因此，为了发挥其最大价值，正如本系列中的其他书籍一样，你还需要学习那些完整的程序，特别是数据结构在
    Java 中是如何实现的。最重要的算法和数据结构被添加到一个名为 `palib` 的类库中，该库被书中的示例使用。


    书通常分为两部分，第一部分处理算法，另一部分处理数据结构，但由于数据结构的实现本质上就是算法，人们也可以把本书看作一本关于算法的书。


    第一部分算法（接下来的 4 章）的目标是提供一些经典算法的示例，包括搜索和排序的特殊算法。此外，还介绍了如何确保算法正确并给出正确的结果，以及如何评估算法之间的有效性。


    书的第二部分包含 5 章，涉及数据结构和集合类，其中最重要的列表和树的实现以及相关的各种算法。一些数据结构的实现既复杂又全面，书中主要描述原理，而代码必须在书源文件中查找。


    源代码与其他书籍一样，包含了许多示例，但大部分是收集在 `palib` 类库中的算法和数据结构实现，大多数示例和任务都使用了这个库。


    # 2 算法的概念


    算法是一种描述如何通过固定数量步骤解决问题的方法，因此算法是一种（通常从输入开始）解决特定问题的解决方案。算法在算法语言中表述，以便以简短且准确的方式表达。编程语言是算法语言的一个例子，但通常使用更简单的语言会更容易，从而不受编程语言中许多细节的影响。此外，许多算法具有共同性质，可以从一个通用模板描述一类算法。除了
    `Java` 编程语言外，本书没有使用正式的算法语言，而是有时在通用语言和 Java 程序代码之间的中间状态非正式地描述算法。在接下来，我通常会用通用语言非正式地描述算法，随后以
    `Java` 完成算法的形式呈现。


    作为算法的示例，我将查看一个计算数字 `n` 的 `p` 次方的算法——即计算 ![](img/nn_sup_pp___1.jpg)。这个任务（算法）可以描述如下：


    ```

    ![](img/Java_18_-_Algorithms_and_data_structures_29-10-18_For_code_11.jpg)

    ```


    上面是非正式版本，其中算法部分用 `Java` 编写，但我并没有完全遵守该语言的语法。其目的是描述解决方案，而无需处理编程语言的许多细节，如果你稍微一点编程和
    `Java`，很容易理解上述算法在做什么。


    对于所有算法，你必须回答两个问题：


    *   它是否解决了该任务——算法是否正确？

    *   该算法性能如何？


    第一个当然是基本要求，而另一个是质量问题。


    如果 `p` 是负数，算法给出结果 1（循环将不会执行），这是错误的。如果 `p` 为 0，结果也是 1，这是正确的。如果 `p` 为正数，则执行循环，每次迭代
    `p` 减 1，循环将恰好重复 `p` 次。对于每次重复，`u` 乘以 `n`，由于 `u` 初始值为 1，当循环停止时 `u` 的值就是 `n` 自乘 `p`
    次的结果，其值为 ![](img/nn_sup_pp___1.jpg)。这意味着在 `p` 不为负的情况下，算法给出了正确的结果。我们称 ![](img/text18__2.jpg)
    是一个前提条件。


    关于算法的质量，一个目标是算法应该尽可能少使用资源：


    *   它能最小化内存消耗，从而不使用不必要的变量

    *   它能最小化处理器的消耗，从而不执行不必要的语句


    在这种情况下，除了输入参数 `n` 和 `p`（算法应用的值）之外，算法还使用了一个变量来存储结果，重要的是内存需求是恒定的，且不依赖于两个输入参数。关于算法对处理器的消耗，指令数量由循环重复的次数决定。也就是说，指令数随输入参数
    `p` 增长，因此对于较大的 `p` 值计算需要更多指令。在这种情况下并没有问题——它是一个相当有效的算法，因为它限制了在溢发生前 `p` 可以有多大。


    算法的表述方式独立于数据类型，但很容易将算法转换为 `Java`，使其适用于特定类型。这是一个非常简单的算法，但它表达了一种方法，只要 `p` 是非负整数且
    `n` 是定义了乘法的类型（数字）即可。因此，算法部分独立于特定的数据类型。例如，如果你在 `Java` 中实现它，可以写成：


    ```

    ![](img/Java_18_-_Algorithms_and_data_structures_29-10-18_For_code_13.jpg)

    ```


    在这里，利用了特定语言中的不同构造允许以更简单的方式表达算法，我们当然应该使用它们。


