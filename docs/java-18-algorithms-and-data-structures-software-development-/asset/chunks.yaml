    # 4 Sorting


    In this chapter I will mention a family of algorithms that are used to sort a
    collection of objects, and as an example of a collection I will use an array everywhere.
    I will look at the following algorithms:


    *   Bubble sort ![](image/text18__56.jpg)


    *   Selection sort ![](image/text18__56.jpg)


    *   Insertion sort ![](image/text18__56.jpg)


    *   Shell sort ![](image/text18__57.jpg)


    *   Merge sort ![](image/text18__58.jpg)


    *   Quick sort ![](image/text18__58.jpg)


    and as you can see from their time complexities, they differ a lot in terms of
    efficiency. In practice, the last two are the most widely used.


    ## 4.1 Bubble sort


    I’ve already mentioned this algorithm above, so the following is a bit of a repeat,
    but first a little bit about how bubble sort works (and can be implemented). If
    you have an array


    ![](image/Image2801.jpg)


    then you run over the array from the back to the start. For each pass, you perform
    an inner loop that runs from start to the place where the arrow points. If you
    meet an item greater than its successor in this iteration, they are replaced.
    That is change 11 with 5, 19 change with 3, and then with 13, then with 2, 7 and
    finally with 17:


    ![](image/Image2808.jpg)


    It is a step in the right direction, and 19 is now in place. Therefore, in the
    next iteration you should only look at the first 7 places and the result is after
    the second pass:


    ![](image/Image2816.jpg)


    Now, the two major elements are with certainty in place and the process continues
    until the arrow reaches the last place – or until you have made a pass without
    exchanges – this is due to the fact that the array is sorted and the algorithm
    can stop. The algorithm is simple to implement and can be written in Java as follows:


    ![](image/Java_18_-_Algorithms_and_data_structures_29-10-18_For_code_74.jpg)![](image/Java_18_-_Algorithms_and_data_structures_29-10-18_For_code_75.jpg)


    Note, first, that if the algorithm stops, an iteration has been made without exchanges.
    That is that you have not met two items that were wrong placed. Thus, the array
    must be sorted. The algorithm can stop in two ways. Either because an iteration
    has been made without exchanges or because the outer loop stops (and in the last
    pass there are no exchanges), but in any case, it stops and thus the algorithm
    is correct.


    The next question is how effective the algorithm is. Assuming that the array is
    sorted from the start, there are no exchanges in the first pass and the algorithm
    stops. It provides a best time complexity that is *O(N)*. In the general case,
    an element incorrect relative to its successor will be moved one step to the right
    and repeat that until a major successor arrives. The largest element must therefore
    be in place after the first pass, after the next pass (which is 1 shorter), the
    second largest element will be in place and after all the other passes, all other
    elements will be replaced. The worst situation is where the smallest element from
    the start is at the last place. In this situation, the array requires *n* passes
    (the inner loop must be performed *n* times), which gives a complexity ![](image/text18__59.jpg):
    The inner loop becomes one shorter each time (the first time there are *n-1* operations)
    and the number of operations is therefore:


    ![](image/text18__60.jpg)


    It corresponds exactly to a square time complexity. In the middle the least element
    must be moved *n/2* places that give the same complexity. The algorithm therefore
    has an average time complexity on ![](image/text18__59.jpg). In return, the algorithm
    only uses memory for some simple variables, so its memory complexity is *O(1)*.


    The algorithm is good if you have to sort a few elements and it is especially
    good if the array is almost sorted so that the smallest elements not are the last,
    but if it is a large array, it becomes slow and ultimately unusable. It is, on
    the other hand, simple to implement and, as mentioned, it does not use much memory.


