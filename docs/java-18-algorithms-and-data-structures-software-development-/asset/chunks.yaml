    最老的算法之一是欧几里得算法（Euclid''s algorithm），用于确定两个正整数的最大公约数。这是一个非常简单的算法。如果 `n` 和 `m` 是正整数，我用
    `gcd(m, n)` 来表示它们的最大公约数。例如，考虑数字 30 和 42，它们的最大公约数是 6。即，`gcd(30, 42) = 6`。


    该算法的思路是：


    ![](img/Java_18_-_Algorithms_and_data_structures_29-10-18_For_code_30.jpg)


    在这种情况下，这个算法并不容易理解。首先，它并不清楚算法是否会停止；其次，很难看出它是否给了正确的结果。


    如果你观察循环的单次迭代，有两种情况：


    1. 两个数相同，你已经完成了（两个相同数的最大公约数显然是它们本身）

    2. 两个数其中一个比之前小了，但不为 0


    最后一种情况不能无限重复下去，早晚这两个数会变得相同。也就是说算法停止了。


    为了证明算法是正确的，假设 `n >= m`。如果 `d` 是同时是 `n` 和 `m` 的约数，那么存在正数 `a` 和 `b` 使得 `n = ad`  `m
    = bd`，因此 `n – m = (a – b)d`。也就是说，`d` 同时是 `m` 和 `n – m` 的约数。假设 `d` 同时是 `m` 和 `n
    – m` 的约数。那么存在正数 `a` 和 `b` 使得 `n – m = ad` 和 `m = bd`，因此 `n = (n – m) + m = (a
    + b)d`。也就是说，`d` 同时是 `m` 和 `n` 的约数。你可以得出结论


    ![](img/Java_18_-_Algorithms_and_data_structures_29-10-18_For_code_31.jpg)


    由此可以得出，上述算法中的循环没有改变 `n` 和 `m` 的最大公约数，并且由于算法会停止，因此它是正确的。


    能够确定两个整数的最大公约数是非常有趣的，尽管上述形式的欧几里得算法并不是最直观的选择（由于效率问题），但该算法作为解决非平凡问题的算法仍然是有有趣的，而且作为一个非常简单的算法，以及一个无法直观看出解决了问题的算法示例。下面我展示了用
    Java 编写的算法：


    ![](img/Java_18_-_Algorithms_and_data_structures_29-10-18_For_code_311.jpg)


    上面，我提到参数应该是正数。如果 `a > 0`，则 `a` 同时是 `a` 和 0 的约数，因此 `gcd(a, 0) = a`。也就是说，在参数为 0
    的情况下，最大公约数也有意义。因此，算法从一个特殊情况开始，其前提条件是两个参数都不应为负。


    上述算法的问题是迭代可能过多。如果其中一个数很大（max int），而另一个数很小（1），你必须减去很多次，算法将花费很长时间，但你可以做得更好。


    再次假设 `n >= m` 并假设 `d` 同时是 `n` 和 `m` 的约数。也就是说，对于某些正数 `a` 和 `b`，`n = ad` 和 `m =
    bd`。如果 `r = n % m`，那么 `n = qm + r`，其中 `q` 是除法 `n / m` 的商。由此得出 `r = n – qm = ad
    – qbd = (a – qb)d`，因此 `d` 是 `r` 的约数。假设 `n = qm + r` 其中 `r = n % m`，且假设 `d` 同时是
    `m` 和 `r` 的约数。那么存在数字 `a` 和 `b` 使得 `m = ad` 和 `r = bd`，因此 `n = (qa + b)d`，且 `d`
    同时是 `m` 和 `n` 的约数。因此可以得出


    `d` 是 `n` 和 `m` 的约数，当且仅当 `d` 是 `m` 和 `n % m` 的约数


    因此再次得出


    ![](img/Java_18_-_Algorithms_and_data_structures_29-10-18_For_code_32.jpg)


    当 `n >= m` 时，你可以写一个改进版本的欧几里得算法如下：


    ![](img/Java_18_-_Algorithms_and_data_structures_29-10-18_For_code_321.jpg)


    这里，最后一个方法是一个私有辅助方法。它假设第一个参数大于或等于最后一个参数。这是一个递归方法，由于 `n % m` 始终小于 `m`，`m` 早晚会变为
    0，因此该方法将停止。对应上述论证，它将以 `m` 和 `n` 的最大公约数精确停止，因此方法给出了正确的结果。第一个方法 – `gcd()` – 是被调的方法。你可以发现
    `gcd()` 并不比其他方法，但它是一个关于最大公约数的算法示例，你看到的是一个关于最大公约数的算法，测试方法是 `test06()`。


