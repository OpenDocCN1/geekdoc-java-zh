    # 10 集合 (Sets)


    从数学上，你了解集合（set）的概念，这是一个定义良好的对象容器。换句话说，它是一个集合。在集合中，你可以执行以下操作：


    1. 询问某个元素是否在集合中

    2. 创建两个集合的交集（intersection），包含两个集合共同的元素

    3. 创建两个集合的并集（union），包含其中一个集合中的元素

    4. 创建两个集合的差集（difference），包含其中一个集合中但不在另一个集合中的元素

    5. 创建一个子集（subset），它是另一个集合的子集


    然而，通常还有其他操作，你可以如下所示定义一个集合：


    ![](img/Java_18_-_Algorithms_and_data_structures_29-10-18_For_code_190.jpg)


    其中每个方法的含义应该是自言易懂的。集合并不保证元素的顺序，如果你遍历集合中的所有元素，你无法知道它们的处理顺序。因此，使用哈希来实现集合是显而易见的，而
    `HashSet<T>` 类只是 `Hash<T>` 的一个包装。


    假设 `insert()`、`remove()` 和 `contains()` 方法具有常数复杂度，那么 `HashSet<T>` 中的相同方法也可以常数复杂度实现，而
    `union()`、`intersection()` 和 `difference()` 则可以用线性复杂度实现。`HashSet<T>` 类对应 Java
    中同名的类。


    在实践中，人们可能对 `ISet<T>` 元素的排列感兴趣，相反，你可以使用二叉树来实现 `ISet<T>`。`TreeSet<T>` 类实现了 `ISet<T>`，但使用的是
    `AVLTree<T>`。这无疑意味着复杂度发生了变化，常数复杂度变为对数级复杂度，而 `union()`、`intersection()` 和 `difference()`
    的复杂度不再是线性的，但在实践中这种差异并不大，因为部分开销与 `Hash<T>` 类有关。


