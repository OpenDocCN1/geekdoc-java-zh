    ![](img/Java_18_-_Algorithms_and_data_structures_29-10-18_For_code_113.jpg)![](img/Image3216.jpg)


    为了访问单个元素，列表必须包含一个指向第一个元素的引用 `start`，以及一个可能指向最后一个元素的引用 `end`：


    ![](img/Image3224.jpg)


    元素的插入和删除在原则上与单链表相同，但现在有几个引用需要被跟踪。例如，`insertAfter()` 方法可以描述如下：


    1. 找到节点 `current`，新元素必须跟在其后面

    2. 创建一个新节点，该节点指向 `current` 并指向 `current` 的后继节点

    3. `current` 的后继节点必须指向新节点

    4. `current` 应该向前指向新节点


    你还应该考虑如果元素插入在最后一个元素之后，该实现是否仍然有效，这通常是一个特殊情况。同样地，你可以描述一个 `insertBefore()` 方法。删除节点的方法是最复杂的，可以描述为如下内容：


    1. 找到包含要删除项目的节点 `current`

    2. `current` 的后继节点必须指向 `current` 的前驱节点

    3. `current` 的前驱节点必须指向 `current` 的后继节点


    当删除比插入复杂时，是因为删除第一个元素和最后一个元素通常是特殊情况。此外，应该注意的是，删除一个元素可能会导致列表为空。


