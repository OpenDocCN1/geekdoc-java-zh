    我之前描述过数据结构 `Stack` 是一种后进先出（LIFO）结构，这种数据结构基本上有两个操作 `push()` 和 `pop()`。这是一个非常简单的数据结构，但非常有用，实现起来同样简单。唯一重要的决定是它应该具有固定大小，还是你可以在可以在不考虑内存的情况下向栈中放入元素。在这里我将查看最后一种栈，即一种可以定义如下的数据结构：


