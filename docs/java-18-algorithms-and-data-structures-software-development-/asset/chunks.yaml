    ## 3.4 复杂度的定义


    在本节中，我想更正式地定义复杂度这个概念。


    假设给定一个算法，其执行时间取决于一个正整数 `N`，且执行时间可以用函数 `T(N)` 来描述。如果 `F(N)` 也是 `N` 的函数，那么如果存在一个常数
    `c` 和一个正整数使得


    则该算法的时间复杂度为 `O (F(N))`，


    ![](img/text18_37.jpg)


    这表示对于大值 `N` 值，其执行时间不差于常数乘以 `F(N)`。换句话说，函数 `F(N)` 定义了其可能出现错误的上限。


    应该补充的是，除了“大 O”符号之外，还有其他的复杂度衡量标准，但我认为已经很满意了，因为这是你在实践中主要遇到的一个。


    对于函数 `F(N)` 没有特殊要求，但在实践中，它通常是以下函数之一，其中对数函数（通常）是以 2 为底的对数，描述在大 `N` 值下函数增长速度的序列：


    *   ![](img/text18__24.jpg) 图形为水平线的常数

    *   ![](img/text18__25.jpg) 图形为平滑曲线的对数函数

    *   ![](img/text18__26.jpg) 对数函数的平方

    *   ![](img/text18__27.jpg) 平方根函数

    *   ![](img/NNN__28.jpg) 线性函数，其图形为增长的直线

    *   ![](img/NNN__29.jpg) `N` 乘以对数函数，其图形增长远小于 ![](img/NN_sup_22__18.jpg)

    *   ![](img/NN_sup_22__18.jpg) 平方函数，其图形是一个比喻

    *   ![](img/NNN_sup_333__30.jpg) 三次函数，其图形是一个增长极快的函数

    *   ![](img/222_sup_NNN__31.jpg) 指数函数


    上述函数是典型的，但可能还有其他的。


    上面我到处描述的都是单变量函数的复杂度，但算法及其时间复杂度当然可以取决于多个参数。这不会显著改变定义，只需认为 `N` 可以由几个值组成。


    在实践中，推导和论证算法的复杂度可能是非常困难的，通常需要大量的数学知识。然而，有一些指南可以提供帮助。


    1. 如果一个算法不包含循环，它的执行时间通常与算法的参数无关，其复杂度是常数。这是一个 ![](img/text18__32.jpg) 算法。但你必须小心，因为算法可能会调用没有常数时间复杂度的方法。在许多情况下，常数时间复杂度的算法被认为是最优的。

    2. 如果算法包含循环，其执行时间与迭代次数成正比。如果循环嵌套，复杂度将是每个循环次数的乘积。

    3. 如果算法包含单个循环，其复杂度相对于输入是线性的。

    4. 如果算法使用二分查找，其复杂度将是对数级的。


    这些规则为估计算法效率提供了基准。


    ## 3.5 合并


    给定两个数组 `table1` 和 `table2`且都按升序排序，通过 `merge` 将这两个数组合并为一个包含它们所有元素的数组。


    如果 `table1` 有 `M` 个元素，`table2` 有 `N` 个元素，你可以编写如下算法：


    ```

    ![](img/Java_18_-_Algorithms_and_data_structures_29-10-18_For_code_57.jpg)image/Java_18_-_Algorithms_and_data_structures_29-10-18_For_code_58.jpg)

    ```


    原理是你可以有一个指针 `i` 指向 `table1` 中下一个移动到结果数组的元素，一个指针 `j` 指向 `table2` 中下一个移动到结果数组的元素，一个指针
    `k` 指向结果数组中要放置下一个元素的位置。只要指针 `i` 和 `j` 都指向某个值，就移动它们指向的元素中较小的一个。这一直持续，直到其中一个指针不再为空——即一个数组中的所有元素都被移动，并且它们在结果数组中按升序排列。然后，必须移动两个数组的剩余元素，但此时只有一个数组还存在元素，所以最后两个循环中只有一个在执行。算法的一个步骤可以如下所示，其中下一个要移动的元素是
    8：


