    by induction, but in other contexts, a more informal argumentation can explain
    the correctness of the algorithm. The same goes for analyzes of the algorithms
    efficiency. In the following, I will show both approaches, but I would primarily
    focus on informal reasoning because it provides a practical approach to the problems
    and better is a tool that can be used in the daily but also because a formal mathematical
    argumentation easily can become complex. However, it should be noted that there
    is a significant risk that the informal reasoning leads to incorrect results.


    An analysis of the complexity of an algorithm relates to the algorithm’s consumption
    of the machine’s resources, and generally the goal is to minimizing resource consumption.
    It’s basically about CPU time and memory, which are two resources that are always
    limited. In principle, you can equip the machine with a faster CPU and increase
    the machine’s memory, but whatever can not solve the problem of an inefficient
    algorithm. However, modern machines today have so much memory that too little
    memory is rarely a problem (at least as long as you talk about a regular PC),
    and often you perceive the CPU as a more restrictive resource. As for algorithms,
    the focus is primarily on writing algorithms that utilize the CPU as well as possible,
    that is the same that the algorithm and the program being executed as quickly
    as possible. It is said that the algorithm must have optimal *time*  *complexity*.


    If you have written a program you can of course measure its time complexity with
    a clock and thus find out how long it takes to perform an algorithm and it certainly
    has interest in practice and if nothing else so in connection with test. However,
    one should always be aware that such a timing depends on the machine that performs
    the algorithm and in many contexts it is more interesting to assess the overall
    nature of the algorithm and associate a functional expression with an algorithm
