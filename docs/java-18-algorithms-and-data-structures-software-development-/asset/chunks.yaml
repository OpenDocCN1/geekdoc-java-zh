    ## 3.4 Definition of complexities


    In this section, I would like to define the concept of complexity a little more
    formally.


    Let an algorithm be given where the execution time depends on a positive integer
    `N` and so that the execution time can be described by a function `T(N)`. If also
    `F(N)` is a function of `N`, it is said that the algorithm’s time complexity is
    `O (F(N))` if there is a constant `c` and a positive integer so


    ![](image/text18_37.jpg)


    It expresses that for large values of `N`, the execution time is not worse than
    a constant times `F(N)`. Saying a bit differently, the function `F(N)` defines
    an upper limit for how wrong it may be.


    It should be added that there are other complexity measures than “big o”, but
    I will be happy with that, as it is primarily the one you encounter in practice.


    There are no specific requirements for the function `F(N)`, but in practice it
    will typically be one of the following functions, where the logarithm function
    (usually) is the 2-number logarithm and the sequence describing how fast the functions
    grows for large values of `N`:


    *   ![](image/text18__24.jpg) Constant whose graph is a horizontal line

    *   ![](image/text18__25.jpg) The logarithm function whose graph is flat curve

    *   ![](image/text18__26.jpg) The square of the logarithm function

    *   ![](image/text18__27.jpg) The square root function

    *   ![](image/NNN__28.jpg) A linear function, whose graph is a growing straight
    line

    *   ![](image/NNN__29.jpg) `N` times the logarithm function whose graph grows
    much smaller than ![](image/NN_sup_22__18.jpg)

    *   ![](image/NN_sup_22__18.jpg) Square function whose graph is a parable

    *   ![](image/NNN_sup_333__30.jpg) The cubic function whose graph is a very fast
    growing function

    *   ![](image/222_sup_NNN__31.jpg) The eksponential function


    The above functions are typical, but there may be others.


    Above I have everywhere described complexities of functions in 1 variable, but
    an algorithm and its time complexity can of course depend on several parameters.
    It does not significantly change the definitions, but just think that `N` can
    consist of several values.


    In practice, it can be quite difficult to deduce and argue for the complexity
    of an algorithm, and it will often require a lot of mathematics. However, there
    are some guidelines that can help.


    1.  If an algorithm does not contain loops, its execution time will usually be
    independent of the parameters of the algorithm and its complexity is constant.
    It is a ![](image/text18__32.jpg) algorithm. You must be careful, however, because
    the algorithm can call a method that does not have constant time complexity. Algorithms
    with constant time complexity are considered to be optimal in many contexts.

    2.  If the algorithm contains loops, its execution time will be proportional to
    the number of iterations. If the loops are nested, the complexity will be the
    product of the number of iterations of each loop.

    3.  If the algorithm contains a single loop, the complexity will be linear in
    terms of the input.

    4.  If the algorithm uses a binary search, the complexity will be logarithmic.


    These rules provide a baseline for estimating the efficiency of algorithms.


