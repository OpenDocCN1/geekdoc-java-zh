    ## Problem 3: A circular list


    A double linked list can be implemented in several ways, and one of the options
    is like a circular list, where the last node points to the first, while the first
    points back to the last one:


    ![](image/Image3231.jpg)


    There is no longer any first and last element, and you refer to the list’s elements
    using an internal reference, which refers to a current node. A class that implements
    such a data structure must therefore have methods that can move this internal
    reference and insertion in the list occurs before or after the node where `current`
    points. Similarly, deletion means that the node where `current` currently should
    be removed.


    It is your task to implement such a list. In fact, it is not quite easy, but you
    can make it easier to introduce a dummy node, which is a node that is always there
    and does not contain data:


    ![](image/Image3239.jpg)


    This means that an empty list has the form:


    ![](image/Image3246.jpg)


    and in the case of an empty list, there is a node to insert before or after. The
    task is to write a class that implements the following interface as a circular
    double-ended list:


    ![](image/Java_18_-_Algorithms_and_data_structures_29-10-18_For_code_119.jpg)![](image/Java_18_-_Algorithms_and_data_structures_29-10-18_For_code_120.jpg)


    To write the class, use the class `DoubleNode`. It gives a problem as it is in
    another package. To resolve this issue, take a copy of the class and add it to
    your project. My project is called `AnotherList`.


    Remember to write a test program.


    ## 6.3 An ordered lists


    Both a single linked list and a double linked list can be implemented as an ordered
    list, which simply means that the elements are sorted according to a particular
    arrangement. For example, looking at an ordered double-linked list, the only difference
    compared to a general double-linked list is that insertion of elements should
    occur in another way. A class should only have one `insert()` method that inserts
    an element corresponding to the current arrangements, while the other methods
    for insertion no longer make sense. Apart from inserting elements, all other methods
    must be implemented in exactly the same way as in the class `DoubleList<T>`.


    The class `SortedList<T expands Comparable<T>>` implements an ordered double-linked
    list and is defined by the interface:


    ![](image/Java_18_-_Algorithms_and_data_structures_29-10-18_For_code_121.jpg)


    Aside from the methods for insert of elements is the same interface as `IDoubleList`
    – and that the data type `T` this time must implement `Comparable`. Therefore,
    the class `SortedList<T extends comparable<T>>` can basically be implemented in
    the same way as `DoubleList<T>`. Just are the four methods to insert elements
    been removed and replaced by one new method. When the elements need to be `Comparable`,
    it does not make sense to insert an element at the beginning of the list, at the
    end of the list or after or before a particular node. Each time you insert an
    element, is it necessary with a search and find where the element should be inserted.


