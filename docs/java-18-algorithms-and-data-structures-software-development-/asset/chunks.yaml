  raw: 'An algorithm is correct if its method part used with correct pre-conditions
    gives the desired result with correct post-conditions. In addition, an algorithm
    must always stop after a final number of steps. The latter can only be a problem
    if the algorithm contains an iteration and, in general, argumentation for the
    correctness of algorithms is only interesting if the algorithm contains iterations.
    In the examples that I’ve seen so far, it’s fairly easy to figure out that the
    algorithms are correct – maybe apart from Euclid’s algorithm. To more formally
    prove that algorithms are correct, you can associate statements (also called *assertions*)
    to specific locations in the algorithm. They express statements that must be *true*
    at those places and can as such be used to argue for the correctness of an algorithm.
    Assertions can in principle occurs anywhere in the algorithm, but they are typically
    used in selections and iterations where they are most interested, and they are
