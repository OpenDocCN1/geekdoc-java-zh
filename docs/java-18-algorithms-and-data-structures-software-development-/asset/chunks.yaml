    Basically, a `Matrix` is a rather simple data structure and is not much more than
    an encapsulation of a 2-dimensional array, but several of the operations are difficult
    to implement with satisfactory time complexity, especially for the methods in
    the class `SquareMatrix`. I want to start with the class `Matrix`, but first some
    comments regarding exceptions. Generally, the classes’ methods do not test for
    index errors, and here I let the runtime system take care of the error handling.
    In situations where the classes’ methods test for errors, they can raise a `MathException`,
    which is also a `RuntimeException`, and it is often due to an operation on vectors/matrices
    that are incompatible. Thus, the methods of the classes do not require a try/catch.


    The class `matrix` can be defined as follows:


    ![](image/Java_18_-_Algorithms_and_data_structures_29-10-18_For_code_198.jpg)


    and should basically have methods for addition and subtraction of matrices and
    multiplication of a matrix with a constant. Additionally, there are also added
    methods that respectively add a constant to and subtract a constant from a matrix
    (although it is not classic matrix operations). Finally, there are multiplication
    of two matrices, which have always been the challenge, as for matrices of approximately
    the same size, they get a complexity that is ![](image/text18__76.jpg). There
    are actually algorithms that do better, and one of them is the `Strassen algorithm`
    that has a complexity around ![](image/text18__77.jpg). Firstly, the algorithm
    is not quite simple to implement, and secondly, it only works for square matrices,
    and thirdly, for performance is gaining attention, you needs to work with very
    large matrices, before consider implementing the algorithm, maybe just like an
    override in the class `SquareMatrix` and might even be used for big matrices.
    I only implemented matrix multiplication in its classic form so there is room
    for improvements. There are also other algorithms for matrix multiplication, which
    have even better time complexity, but they primarily have theoretical interest.


    Similar to the above, the implementation of the class `Matrix` is quite simple
    and only uses simple algorithms. The same applies to the two classes `RowVector`
    and `ColVector`, which do not need further comments here.


    Back there is class `SquareMatrix`, and it is immediately more complex. The reason
    for the class is that particular matrix operations only make sense for square
    matrices, and it is primarily about calculating the determinant of a matrix, as
    well as determining the inverse of a matrix. Both of these operations are complex,
    which is also is reflected by the code. There are several ways to implement these
    operations, but overall, the basic definitions provide solutions with poor performance,
    especially because the definition of the determinant is recursive. Another way
    is to use LU decomposition and although I do not want to describe the algorithm
    here, the procedure is as follows:


    If you have a square matrix, you have to switch to two rows without affecting
    the determinant, but where you have to multiplying the result with ![](image/text18__78.jpg)
    where `n` is the number of exchanges. It is also allowed to subtract a multiple
    of one row from another row, thus reducing a square matrix `A` to an upper triangle
    matrix `U` and thus a matrix where all coordinates below the diagonal are 0\.
    The determinant can then be determined as the product of all coordinates in the
    diagonal, but multiplied by the above sign. This results in many calculations
    and will therefore introduce significant uncertainties to the results, and it
    can be partially corrected by all the time make coordinates in the row with the
    highest value 0\. This corresponds to the fact that during the process, a permutation
    of the rows corresponding to implicit substitutions is determined. When subtracting
    a multiple of a different row from a row, use a scale that is determined by the
    number of subtracts from being assigned to 0 at a particular space and all these
    scales can be collected in a lower triangle matrix `L`, which has 0 in diagonal.
    For the two matrices `L` and `U`, then `A = L * U`. The two matrices are assembled
    in a common matrix `LU = L + U`. The process is called LU decomposition and is
    a relatively complex process with a time complexity that is ![](image/text18__76.jpg).


    If you first performs a LU decomposition, it is simple to determine the determinant,
    as it is just the product of the coordinates in the diagonal. In fact, an LU decomposition
    consists of solving `n` equations with `n` variables and thus to solve a matrix
    equation `Ax = b`, where `x` and `b` are column vectors. The class `SquareMatrix`
    therefore also has a method `solve()` that can be used to solve such an equation
    system. In fact, it is not so much for solving equations, as because the method
    can immediately be used to determine the inverse matrix. If `v(i)` denotes a column
    vector, with a 1 on the `i`th place and the rest of the coordinates 0, you can
    determine the `i`th column in the inverse matrix as the solution to `A * x = v(i)`
    and thus using the method `solve()`.


    The class `SquareMatrix` is defined as follows:


    ![](image/Java_18_-_Algorithms_and_data_structures_29-10-18_For_code_200.jpg)


    The meaning of the three variables is that if you first has performed a LU decomposition,
    it is not necessary to do it every time you determine the inverse, solve a linear
    equation or determine the determinant. Remember to invalidate the LU matrix if
    the current matrix is changed, what the class `SquareMatrix` also does.


    ## 12.1 A test program


    After I have written the above classes I have written a test program called `Matrices`
    which can be used to test some of the above classes. If you run the program, you
    will see the window below, where a single square 3×3 matrix has been created.
    To the left there is a `ListView` that shows an overview of the matrices that
    have been created and double-clicking on a matrix, opens a `TableView` that displays
    the matrix’s values. You can also edit the values so that you can get a matrix
    with certain values. At the top of the `ListView` component there is an entry
    field and a few buttons. The input field is used to enter a matrix expression,
    such as `A + B`, and clicking `OK` will insert the expression into the `ListView`
    component, and you can see the result by double-clicking the expression (if the
    result is a matrix). Note that if you opens multiple matrices, they appear in
    a long horizontal row. Under the `ListView` component there are three buttons
    and a combo box. The last one is used to indicate how many decimals are to be
    used to display the results. If you edit values in an array (you can only edit
    the matrices created by clicking the `Create` button), the value of a formula
    may be incorrect and that is the goal of the button `Recalc` that recalculates
    the formula that is selected. You can use the button `Remove` to delete the formula
    for the matrix that is selected.


    ![](image/Image3732.jpg)


    Finally, the button `Create` and clicking on it you will get the following window:


    ![](image/Image3740.jpg)


    where you can create a new matrix. If the `Real numbers` or `Integers` radio button
    is clicked, the function will create a matrix of random numbers within the selected
    range. If you have clicked the bottom radio button get a 0 matrix and clicked
    on `Identity` (only available if `Square` matrix is selected), you get an identity
    matrix with 1 in the diagonal.


    In terms of expressions, the program is relatively limited, but you can enter
    names of existing matrices and numerical constants. You can use +, –, and * operators
    as well as parentheses. Additionally, you can use the functions:


    - `DET(A)` which determines the determinant of `A`

    - `INV(A)` which determines the inverse matrix for `A`

    - `NORM(A)` which determines the norm of `A`

    - `CON(A)` which determines the condition number for `A`

