    In in-order traversing, you start to go as far left as possible, and the class
    has a constructor where you go left as long as you can and put all the nodes you
    meet on a stack. The method `hasNext()` only has to test if the stack is empty.
    The method `next()` pops the stack, and the element at the top of the stack is
    the element that the iterator should return. Before you go to the node’s right
    sub-tree, where you again pushes nodes on the stack as long as you can go left.
    The other two traversing iterators are, in principle, implemented in the same
    way, however, post-order require an extra effort, as you put the same node on
    the stack several times and therefore there is a need to count how many times
    a node has been placed on the stack. The problem is solved with a wrapper that
    encapsulates a node with the counter.


    The interface `IBaseTree` defines two methods for finding a node in a binary tree
    and deleting an element, respectively:


    ![](image/Java_18_-_Algorithms_and_data_structures_29-10-18_For_code_135.jpg)


    The method `remove()` must be implemented to delete the hole sub-tree that has
    a particular element as root. The class `BinTree<T>` inherits `ABinTree<T>` and
    implements the interface `IBaseTree<T>`. Therefore, the class must also implement
    the method `contains()`, but for the general binary tree, it gets linear complexity,
    since you can do nothing but has to traverse all nodes and search for the element.
    The interface does not define methods for inserting elements into the tree, but
    the class `BinTree<T>` has a `static` method `merge()` that performs a merge of
    two binary trees (left and right sub-trees) about a new element that becomes root
    in a new binary tree. The method `merge()` can be used to build a binary tree.
    The class `BinTree<T>` has no particular practical interest, and its main application
    is the test of the traversing methods in the class `ABinTree<T>`, and then give
    an example of a concrete binary tree.


    The class `BinTree<T>` also overrides `toString()`, which, using a static method
    in the class `TreePrinter`, which returns a text that visually illustrates the
