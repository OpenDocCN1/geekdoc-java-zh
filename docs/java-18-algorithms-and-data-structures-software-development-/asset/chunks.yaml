    该算法可以很容易在 Java 中实现如下：


    ![](img/Java_18_-_Algorithms_and_data_structures_29-10-18_For_code_59.jpg)


    这不过是将算法翻译成 Java 版本而已。该方法实现在 `palib` 包中的 `Tools` 类中。下面是一个测试方法：


    ![](img/Java_18_-_Algorithms_and_data_structures_29-10-18_For_code_591.jpg)


    在这里你需要特别注意，由于类型推断，`merge()` 方法返回的是一个 `Comparable[]` 类型的数组。


    ## 3.6 实践中的时间复杂度


    复杂度计算似乎是理论性的，但它们在实践中实际上起着举性作用。你经常听到用户抱怨程序运行缓慢。这可能有几个原因，但最常见的原因实际上是使用了时间复杂度不佳的糟糕糟糕算法。因此，能够从时间使用的角度评估算法，并使用时间复杂度作为衡量算法效率的标准以及比较算法和做出正确选择的工具，是非常重要的。


    在实践中，确定算法的时间复杂度可能是困难的（全面的），但只要你熟悉上述非正式指南并经过大量练习，就能胜任。因此，在编写算法时，依赖其时间复杂度是固定不变的一部分。


    如前所述，确定时间复杂度并不总是容易的，特别是当你依赖非正式的论证时，可能会出错。因此，也有理由去关注计时（timing），它简单地测量一个算法花费了多少时间。时间测量非常适合用来验证所达到的理论时间复杂度现在是否也合理。此外，时间测量作为文档也很重要，因为你可以确定解决不同规模问题所花费的时间。


    ## 练习 4：计算质数


    在上一章中，我查看了一个判断整数是否为质数的算法。该算法基本上由一个循环组成，如果算法执行参数 `N` 是质数，则必须遍历整个循环。也就是说，循环应该迭代
    ![](img/text18__27.jpg) 次，因此它的复杂度是 ![](img/text18__38.jpg)。


    编写一个程序调用 `Primes` 并从 `Functions` 类中复制 `isPrime()` 方法到新项目中。你必须测试上述时间复杂度是否正确：


    ![](img/Java_18_-_Algorithms_and_data_structures_29-10-18_For_code_60.jpg)


    如果是这种情况，最后一个商的值必须独立于 `p` 的值 ![](img/Java_18_-_Algorithms_and_data_structures_29-10-18_For_code_61.jpg)。下面是一个结果，其中
    `p = 1000000000000L` 且 `n = 10`：


    ![](img/Java_18_-_Algorithms_and_data_structures_29-10-18_For_code_61.jpg)


    ## 3.7 内存复杂度


    上面我专门专注于算法的时间复杂度，但内存的使用显然也起了作用。在这里使用相同的符号，可以说算法的内存复杂度是 ![](img/text18__39.jpg)。这意味着它的消耗随输入参数
    `N` 线性增加，一个很好的例子是算法创建一个数组。同样，如果算法的内存复杂度是 ![](img/text18__40.jpg)，可能是因为算法创建了一个
    `M` 行 `N` 列的二维数组。


    内存复杂度很少与时间复杂度具有相同的关注度，部分是因为它通常更容易理解，部分是因为它不像时间复杂度那样关键，但相反，算法显然不需要比更多的内存，在最坏的情况下，过大的消耗会导致程序崩溃。


    正如多次提到的，你的目标是寻求时间复杂度良好的算法，但通常你会发现其内存复杂度很糟糕。尽管这并非规律，但通常存在一种联系。


    ## 3.8 中位数


    给定一个数组


    19 47 43 23 37 7 11 29 5 41 17 2 13


    （在本例中有 15 个元素），你通过中位数理解中间元素，在这种情况下它是排序数组中索引为 7 的元素。因此，中位数是 19，因为有 7 个数字


    3 7 11 5 17 2 13 小于 19，且 7 个数字大于 19：


    47 43 23 37 29 41 31


    只要数字的数量是奇数就可以的，但如果数量相等，则需要一个定义。假设现在有 16 个数字而不是


    53 19 47 43 23 37 7 11 29 5 41 17 2 31 13


    那么有 7 个数字小于 19，有 7 个数字较大。在实践中，如果元素数量相等，你通常会选择平均值，但如果你想确定中位数，你必须从中选择一个。


    我现在将查看一个可以确定整数数组中位数的算法。事实上，这并不简单。但有一个非常直接的解决方案，你只需要对数组进行排序：


    ![](img/Java_18_-_Algorithms_and_data_structures_29-10-18_For_code_62.jpg)


    该算法基于排序，正如在下一章所示，可以写出一个时间复杂度为 O(N log N) 的排序算法。然而，该算法还有另一个问题，因为它会改变数组。在很多情况下，你并不在乎这一点，然后可以通过让算法在副本上运行来解决问题：


    ![](img/Java_18_-_Algorithms_and_data_structures_29-10-18_For_code_63.jpg)


    它解决了问题，但现在算法有一个内存复杂度，即 ![](img/text18__391.jpg)。


    你也可以使用更直接的路径。确定中位数实际上是一个更通用问题的特例，该问题由在于确定数组中的第 `k` 小的数字，即一种确定最小数字、第二小数字、第三小数字以此类推的方法。如果你有一个有
    15 或 16 个元素的数组，并且想确定中位数，那么在两种情况下都必须确定第 7 小的数字。我想从一个将数组元素分为两部分的方法开始，其中左侧的所有元素都小于分割点，而右侧的所有元素都大于分割点。结果是数组的划分，其中低索引为
    `a`，高索引为 `b`。分割点由索引 `k` 决定：


    ![](img/Java_18_-_Algorithms_and_data_structures_29-10-18_For_code_64.jpg)


    该算法非常简单，但工作原理如下：


    1. 分割元素保存在变量 `t` 中，然后用最后一个位置的值进行替换。

    2. 将索引 `j` 设置为指向左部分的末尾（从开始是空的）——即小于分割元素的元素。

    3. 然后遍历子数组。如果你发现一个小于分割元素的元素，则将该元素添加到左部分。

    4. 最后将分割元素放入位置。


