    # 6 链表


    链表是一个集合，与 `ArrayList` 一样，它可以包含按特定顺序组织的任意对象。它是一种顺序结构，新元素通过直接或间接地指定新元素的前驱或后继者来放置，你可以遍历列表并按照元素插入的顺序处理对象。例如，你可以从头到尾浏览列表。链表是数组或
    `ArrayList` 的替代方案。数组（以及 `ArrayList`）是机器内存中的一个连续数据结构：


    ![](img/Java_18_-_Algorithms_and_data_structures_29-10-18_For_code_105.jpg)![](img/Image3137.jpg)


    它的特点是通过索引直接访问其元素，也就是说，你可以通过 `t[i]` 引用第 `i` 个元素。因此，数组提供了对单个元素的直接访问，这意味着它是一个非常高效的数据结构。对于链表，情况恰恰相反。链表由一个指向列表开头的引用组成，列表中的每个元素都有一个指向下一个元素的引用：


    ![](img/Java_18_-_Algorithms_and_data_structures_29-10-18_For_code_1051.jpg)![](img/Image3145.jpg)


    你可以随时向列表添加新项或删除现有项，因此列表可以根据需要增长或缩小。另一方面，要引用列表中的特定项，你必须从 `start` 开始并搜索列表，直到找到该元素。你必须注意，与数组（以及
    `ArrayList`）不同，链表不是一个连续结构，相对于数组来说，这既是它的优点也是缺点。


    在实践中，列表可以用许多不同的方式组织，下面将讨论更多结构化列表的方法以及使用的相关算法。上面插示的列表是*单链表*的一个示例。


    ## 6.1 单链表


    你可以拥有的最简单的列表是单向无序链表。它的特点是列表由元素（也称为节点）组成，这些元素包含一个数据对象和一个指向下一个元素/节点的引用：


    ![](img/Java_18_-_Algorithms_and_data_structures_29-10-18_For_code_106.jpg)![](img/Image3152.jpg)


    而列表仅仅是对应于上图图中列表中第一个节点的元素的引用。基本上，需要以下操作：


    1. 在列表开头插入新元素

    2. 在现有元素之后插入新元素

    3. 返回列表中的元素数量

    4. 检查列表是否为空

    5. 遍历列表，以便列表中的所有元素都得到处理

    6. 删除列表中的第一个元素

    7. 删除列表中的特定元素


    在列表开头插入元素的操作是简单的。如果列表为空，除了创建一个新节点外，什么都不会发生，并将 `start`（或 `first`）指向此节点：


    ![](img/Image3160.jpg)


    如果列表不为空，应该创建一个新节点，指向之前是开头的节点：


    ![](img/Image3167.jpg)


    之后将 `start` 指向新节点：


    ![](img/Image3175.jpg)


    插入的另一种选择是在列表内部插入元素，例如，将一个元素作为现有元素的后继插入。该函数的算法将包含一个搜索，以找到元素 `current`，因为新节点必须紧随其后：


    ![](img/Image3184.jpg)


    然后你可以像下面所示插入新元素，其中新元素指向 `current` 的后继，而 `current` 应该指向新元素：


    ![](img/Image3195.jpg)


    也就是说，找到元素 `current` 后，可以通过创建一个新节点并设置两个指针来插入新元素，从而具有常数时间复杂度。


    如果你想从列表中删除元素，你必须在搜索中找到要删除的元素，之后该元素的前驱应该指向（被删除元素）：


    ![](img/Image3209.jpg)


    之后不再有对要删除元素的引用，垃圾回收器会处理剩余部分。然而，应该注意，删除第一个元素是一个特殊情况，此时 `start` 指向后继。最后，注意删除元素后列表可能会为空。


    `SingleList` 类实现了上述的单链表，但扩展之处是它还有一个指向列表最后一个元素的引用，这在实践中可能很有用。在 Java 中实现列表，你必须表示一个节点：


    ![](img/Java_18_-_Algorithms_and_data_structures_29-10_18_For_code_108.jpg)![](img/Java_18_-_Algorithms_and_data_structures_29-10-18_For_code_109.jpg)![](img/Java_18_-_Algorithms_and_data_structures_29-10-18_For_code_110.jpg)


    该类非常简单，只是变量的封装，但你必须注意构造函数和 `setNext()` 方法是以包可见性定义的。然后列表可以如下定义：


    ![](img/Java_18_-_Algorithms_and_data_structures_29-10-18_For_code_1101.jpg)


    再次，对应上述单链表讨论的方法应该是自而易见的。该接口由类 `SingleList` 实现。


