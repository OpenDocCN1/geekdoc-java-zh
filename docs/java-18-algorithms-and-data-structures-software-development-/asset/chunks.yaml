- fmt: '

    The first one is using an overlay area. To the data structure, a list of the objects
    that resulted in a collision is linked. This solution means that you can still
    insert objects into the data structure with constant time complexity, whether
    collision or not. If you add a new object and the result is a collision, then
    the object is added to the overlay area, and since both operations have constant
    time complexity, the time of the total operation is constant. The disadvantage
    is of course a growth in an access of an element in the data structure. Basically,
    the location is calculated, and if you do not find the object with the correct
    key, you must search the overlay area. If there are many collisions, the number
    of objects in the overlay area can be large, and the access time for an element
    will then have linear time complexity. It is simple to solve the collision problem
    using an overlay area, but conversely the access time can be long. However, it
    is worth paying attention to the technique, as it is actually a modified form
    that you typically use in practice.


    Another simple way is to use the next available space, a method that is also called
    linear probing. If an object is to be inserted and the result is a collision,
    you check the next position and if this position are available, place the element
    there. If it is not available, try the next again and continue until you find
    a free space. If you in the above table with zip codes want to insert


    `7900, Nykøbing`


    you get the result:


    ![](image/Image3717.jpg)


    If you further add


    `6000, Kolding`


    it must also be placed in place 6 with collision as a consequence. Then try to
    place 7, then place 8 and until you find a free space in place 9. The advantage
    of linear probing is partly that the principle is easy to implement and that there
    is no need for any extra data structure for the overlay area. On the other hand,
    there are also some significant disadvantages. If the array is almost filled up,
    a collision can lead to many searches before finding a free space, and the same
    is true of access a particular element. Another problem is that it is difficult
    to delete an object in the data structure as it creates holes in the collision
    chains. Deletion must therefore be implemented by mark an object that has been
    deleted but without physically removing the element and releasing the space. It
    must then be combined with a form of rehashing, and reorganizing the data structure
    and thus also releasing the places used for deleted objects.


    Studies of linear probing have also shown that the method tends to form clusters,
    where the keys refer to groups of indices while there are other groups of indices
    rarely used. It’s unfortunate as it means to increase the number of collisions.
    However, one can improve the method by using square probing instead. The principle
    is the same as linear probing, where objects resulting in collisions are stored
    in the same array as the primary objects. The difference is that the places are
    not chosen by constantly taking the next one, but by taking the indexes from the
    following sequence:


    ![](image/text18__75.jpg)


    where `h` is the primary hash index (the hash function’s value in the key) and
    `n` is the array size. That is, if there is a collision (space `h` is busy), try
    `h + 1`, then place `h + 4`, then space `h + 9` and so on. Studies shows that
    square probing is better than linear probing and does not lead to too many collisions,
    but it is not obvious that the above indices finds a free space, even if the array
    is not full and does not go into a ring. One can show that if the array size is
    a prime number, and if the fill rate (the proportion of array places used) does
    not exceed 50%, quadratic probing will always provide a solution. Quadratic probing
    is much better than linear probing, but conversely, the problems are also the
    same, and especially the issues of remove elements can cause holes in the collision
    chains. Finally, quadratic probing is not quite simple to implement.


    As mentioned above, you can solve the collision problem using an overlay area.
    A very natural improvement is to tie an overlay area to each place in the array.
    In this way, each element has its own collision chain, which naturally becomes
    shorter, and if you have a good hash function that distributes the objects evenly,
    all collision chains in the middle will be equal. Immediately, it may sound like
    an expensive solution, since each space in the array must be associated with a
    list (or similar structure) and it is true, and compared to square probing, for
    example, this solution requires extra memory, but it is offset by that the solution
    is simple to implement. In Java, you have collection classes like `HashSet<T>`
    and `HashMap<K, T>`, that are based on hashing. They solve the collision problem
    just because each place has its own collision chain.


    A hashed structure is internally an array and therefore it also has a capacity.
    If you save more objects than there is capacity for, the result will inevitably
    be collisions. Conversely, it is also clear that if almost all the places in the
    array are available, the likelihood of collision is very small. The question is,
    therefore, how full the array must be before collisions become a problem, and
    in other words, how much the fill rate must be. Regardless of what, it is necessary
    to extend the capacity of the array if the fill rate exceeds a given value. Here,
    as I have looked at in connection with an `ArrayList`, you can use array doubling
    so that if the fill rate exceeds the maximum set, you can double the array’s capacity.
    However, it is not just a matter of creating a new array and copying the old one
    as a rehashing of all objects is required, as the size of the array is included
    in the index calculation. It also means that in the case of hashed structures,
    you can never assume anything about the physical position of individual objects.


    ## 9.1 The class Hashing


    I want to start with a data structure that stores objects in an array using hashing.
    It’s a simple data structure where you basically can do three things:


    1. you can add (save) an object

    2. you can remove an object

    3. you can ask if an object exists in the data structure


    The class is defined as follows:


    ![](image/Java_18_-_Algorithms_and_data_structures_29-10-18_For_code_183.jpg)[](image/Java_18_-_Algorithms_and_data_structures_29-10-18_For_code_184.jpg)


    and here the methods should be self explanatory, perhaps not the last two, which
    respectively read and change the fill rate as a value between 0 and 1. The interface
    is implemented by the class `Hashing`:


    ![](image/Java_18_-_Algorithms_and_data_structures_29-10-18_For_code_184.jpg)


    The first constant indicates the size of the internal array. Here it is set to
    11, but for practical use, it is reasonable to choose a larger starting value.
    The next variable is the fill rate, which is set to 0.5 corresponding to a fill
    rate of 50%. It is set low to reduce the number of collisions, and in practice
    I often choose the value to 0.8. Properties are attached to the variable so it
    can be changed if you want to experiment with the fill rate. Next, it follows
    the internal array, which is an array of lists. It is a little expensive with
    a list for each entry in the array, especially if there is a low fill rate, and
    there are few collisions, and therefore only a list should be linked to the entries
    where there is an element. The last variable is a simple counter that keeps track
    of the number of elements in the data structure.


    As example, I will show the method `insert()` that adds an object to the data
    structure:


    ![](image/Java_18_-_Algorithms_and_data_structures_29-10-18_For_code_185.jpg)


    It uses a help method `index()`, which returns the object’s place in the array.

