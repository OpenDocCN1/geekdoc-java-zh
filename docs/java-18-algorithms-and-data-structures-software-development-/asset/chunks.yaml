    *   ![](image/text18__26.jpg) The square of the logarithm function


    *   ![](image/text18__27.jpg) The square root function


    *   ![](image/NNN__28.jpg) A linear function, whose graph is a growing straight
    line


    *   ![](image/NNN__29.jpg) *N* times the logarithm function whose graph grows
    much smaller than ![](image/NN_sup_22__18.jpg)


    *   ![](image/NN_sup_22__18.jpg) Square function whose graph is a parable


    *   ![](image/NNN_sup_333__30.jpg) The cubic function whose graph is a very fast
    growing function


    *   ![](image/222_sup_NNN__31.jpg) The eksponential function


    The above functions are typical, but there may be others.


    Above I have everywhere described complexities of functions in 1 variable, but
    an algorithm and its time complexity can of course depend on several parameters.
    It does not significantly change the definitions, but just think that *N* can
    consist of several values.


    In practice, it can be quite difficult to deduce and argue for the complexity
    of an algorithm, and it will often require a lot of mathematics. However, there
    are some guidelines that can help.


    1.  If an algorithm does not contain loops, its execution time will usually be
    independent of the parameters of the algorithm and its complexity is constant.
    It is a ![](image/text18__32.jpg) algorithm. You must be careful, however, because
    the algorithm can call a method that does not have constant time complexity. Algorithms
    with constant time complexity are considered to be optimal in many contexts.


    2.  If the algorithm contains a single loop and consists of a single pass of this
    loop, then its complexity will be ![](image/text18__33.jpg). There are many algorithms
    that have this complexity and in many contexts they will be considered as good
    algorithms.


    3.  If an algorithm has two loops inside each other and if one loop is repeated
    *N* times and the other repeats *M* times, the complexity will typically be *O(MN)*.
    If specifically *M = N* (what is often the case) the complexity will be ![](image/text18__34.jpg).


    4.  Another common situation is (think of binary search) that you has a loop and
    for each pass of the loop the length of the loop is halved. If so, time complexity
    will be ![](image/text18__35.jpg).


    You should be careful about the above rules as they can easily give a false picture,
    primarily because methods/algorithms call/use other methods that have a time complexity
    that is not constant, but conversely, the rules may be useful for quickly assessing
    a complexity of an algorithm. For example, think of an algorithm that has three
    nested loops, all of which are equal long. Such an algorithm will have the complexity
    ![](image/text18__36.jpg), and in the vast majority of cases it will be a complexity
    that makes the algorithm unavailable for practical purposes.


    ## 3.5 Merge


    Given two arrays *table1* and *table2*, both of which are sorted in ascending
    order, one understands by *merge* the two arrays combined to an array that contains
    all elements in both *table1* and *table2* sorted in ascending order.


    If *table1* has *M* elements and *table2* has *N* elements, you can write an algorithm
    as follows:


    ![](image/Java_18_-_Algorithms_and_data_structures_29-10-18_For_code_57.jpg)![](image/Java_18_-_Algorithms_and_data_structures_29-10-18_For_code_58.jpg)


    The principle is that you have a pointer *i* pointing to the next element of *table1*
    that has to be moved to the result array, a pointer *j* pointing to the next element
    in *table2* to be moved to the result array and a pointer *k* as points to the
    place in the result array where the next element is to be placed. As long as the
    two pointers *i* and *j* point to something, you move the least of the two elements
    that the pointers point to. This continues until one of the two pointers does
    not point to anything – that is, all elements in one array are moved and they
    will in the result array be placed in ascending order. Then, the remaining elements
    of the two arrays must be moved, but there is only one of the two arrays where
    there are elements left, so only one of the last two loops is performing. A step
    in the algorithm can be illustrated as follows, where the next element to move
    is 8:


    ![](image/Image2792.jpg)


    If you look at the complexity, the time consuming to move an element is the same,
    no matter what loop it is: A comparison, an assignment, and a ++ operations. A
    repeat of one of the three loops will always move exactly one element, and as
    all elements are moved, there are *M + N* moves. That is that the complexity of
    the algorithm is ![](image/text18__37.jpg)*.*'
