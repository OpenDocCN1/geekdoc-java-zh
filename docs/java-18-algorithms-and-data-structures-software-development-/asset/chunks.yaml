    后者只是一个内部类属性，它的基本意图是用户不应该（不需要）感知到它。用户需要知道单个方法的复杂度，但无论发生什么，都由实现该类的代码来处理。


    到为止，我提到了两种存储对象的方法。它们既可以通过数组来实现，也可以通过引用或指针将元素连接在一起来实现。这两种方法各有优劣，选择取决于你希望该集合具有什么种特征。事实上，存储对象的方法只有这两种，但在两种情况下，都可能恰当地地组织对象，这对于类的方法至关重要。例如，`ArrayList`
    将对象存储在数组中，但其组织方式是让它们从第一个元素开始存储，直到最后一个元素。`ArrayList` 有一个内部计数器，用于跟踪最后一个元素的位置。


    数组作为容器的特征是，每个对象都位于特定的索引上，有了这个索引，你就可以以常数复杂度直接访问元素。数组是一个高效的容器，但由用户（即集合类）决定使用哪个索引来查找特定元素。它的问题在于，在很多场景下（大多数情况下），通过直接对应物理位置的数值索引来引用特定对象是不合适的，最好根据例如名称（键）来查找对象，但在没有键的情况下，应该以搜索的形式进行。该问题的解决方案可能是哈希（hashing）。


    从技术上讲，哈希结构是一个对象数组，它使用键而不是索引来标识单个对象。其思想是将键转换为索引，该索引指示对象在数组中的位置。这种转换就被称为`hashing`。也就是说，当在数组中查找对象时，并不是通过搜索实现的，而是通过计算对象所在的位置，通过一种具有常数时间复杂度的操作来实现。


    为了说明这一原理，我将看一个例子，我想在数组中保存丹麦的邮政编码。对象的示例是


    ![](img/Java_18_-_Algorithms_and_data_structures_29-10-18_For_code_176.jpg)


    假设起点是一个长度为 10 的数组（见下文）。如上所述，我将使用邮政编码作为键，第一个任务是将邮政编码转换为索引。我将使用以下函数：


    ![](img/Java_18_-_Algorithms_and_data_structures_29-10-18_For_code_177.jpg)


    其中 `digetsum()` 是一个确定邮政编码数字之和的函数。10 来自于数组的大小，因此索引的值将始终是 0, 1, 2, …, 9 之一，从而是一个合法的索引。`digetsum()`
    方法就是所谓的哈希函数（hash function），你应该注意，在 Java 中无论代码类型是 `String` 还是 `int`，实现这个函数都是很容易的。


    ![](img/Image3695.jpg)


    如果键是 `7800`，则邮政编码对象必须放在位置


    ![](img/Java_18_-_Algorithms_and_data_structures_29-10-18_For_code_1771.jpg)


    下面我展示了插入 `7800, Skive` 之后的数组：


    ![](img/Image3702.jpg)


    下面我展示了添加另外三个对象后的表：


    * `8800, Viborg`

    * `7950, Erslev`

    * `8000, Aarhus C`


    重要的是要注意，每次找到对象的位置都是通过计算而不是搜索的：


    ![](img/Image3710.jpg)


    假设你想进一步插入对象


    * `7900, Nykøbing`


    该元素应该被放在位置 6，但那里被占用了，我们正在谈论的是冲突（collision）。有两个对象具有不同的键，它们通过哈希函数确定了表中的相同位置。因此，你可以得出，实现数组哈希面临两个基本挑战：


    1. 哈希函数的定义方式必须能够将键均匀地分布在整个数组上。

    2. 必须有一个解决冲突问题的方案。


    在哈希函数方面，原则上这是一个关于你是否有一个给定大小为 `n` 的数组和一组各种类型的对象的问题。如果你有一个对象 `obj`，哈希函数 `f` 必须从对象
    `obj` 计算出一个 `int f(obj)`，该值被称为哈希值（hash value）或哈希码（hash code）。然后你可以确定对象在数组中的索引为
    `i = f (obj) mod n`，这只是指定了数组范围内的一个值。


    函数 `f` 必须是有效的，但其他最重要的特征是索引均匀地分布在数组中。如果不是这样，对象将聚集在数组中的一个或多个位置，这意味着数组的部分将不会被使用，且冲突的风险将会增加。


    针对数字和字符串定义了许多良好的哈希函数示例，它们通常通过像上面邮政编码示例那样查看单个字符，并通过某种形式的计算处理数值来工作。通常键是字符串，或者键中包含字符串。因此，适用于字符串的哈希函数需要将字符串转换为整数，这通常通过使用字符编码来实现。对于字符串，这种计算可能如下：让
    `n` 表示字符串的字符数，让 image/text73.jpg) 是位置 `i` 字符的代码。那么 ![](img/text74.jpg) 是一个计算字符串哈希值的示例。如果对给定字符串对数组长度取模，字符串就被转换为数组索引。上面的哈希函数很容易实现（31
    是因为它是质数），并且它是 Java 中使用的函数。我在这里展示了这个函数。


    众周知，`Object` 类有一个 `hashCode()` 方法，它返回对象的哈希值。它返回对象引用，这通常没有太大用（通常我们需要具有值语义的代码），但该方法可以被重写。该方法通常与
    `equals()` 一起重写，唯一的要求是如果两个对象是 `equal()` 的，它们也必须具有相同的哈希码。相反，并不是要求的，你可能拥有两个哈希码相同但并不
    `equal()`的对象。


    `hashCode()` 是一个哈希函数，结果是 Java 中的每个类型都有自己的哈希函数，但对于自定义类型，留给程序员实现该函数以获得具有值语义的哈希函数。对于大多数
    Java 类，包括 `String` 类，这已经完成了，不需要进一步操作。例如，`Integer` 的 `hashCode()` 直接返回数字本身，而 `Long`
    的 `hashCode()` 返回高 32 位与低 32 位的异或结果。如果 `n` 是 `Long` 的值，哈希码确定为：


    ![](img/Java_18_-_Algorithms_and_data_structures_29-10-18_For_code_180.jpg)


    然后就是冲突问题。通常，可能的键的数量总是比包含这些对象的数组位置多。因此，冲突在实践中总是会发生的。哈希的核心思想是根据键以常数复杂度找到对象的位置。要取得成功，必须有少的冲突和短短的冲突链。因此，在使用哈希实现集合时，解决冲突问题也是其的一部分。我想提到四种方法。

