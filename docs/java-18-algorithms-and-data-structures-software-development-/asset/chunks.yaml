    `BinTree<T>` 有一个 `static` 方法 `merge()`，它可以执行两个二叉树（左子树和右子树）的合并，并将新元素作为新二叉树的根。`merge()`
    方法可以用于构建二叉树。`BinTree<T>` 类没有特殊的实际意义它的主要应用是测试 `ABinTree<T>` 类中的遍历方法，并提供一个具体二叉树的示例。


    `BinTree<T>` 类还重写了 `toString()`，该方法使用 `TreePrinter` 类中的静态方法，返回一个在视觉上展示树的文本。此方法仅用于调试和测试，不应作为二叉树完整实现的一部分。此外，`TreePrinter`
    类通常可以用于文本展示二叉树。


    ## 练习 13：通用二叉树


    你必须编写一个名为 `BinTreeTester` 的程序。该程序应该使用 `merge()` 方法来构建本节开头所示的二叉树：


    ![](img/Java_18_-_Algorithms_and_data_structures_29-10-18_For_code_1351.jpg)[](image/Java_18_-_Algorithms_and_data_structures_29-10-18_For_code_136.jpg)


    ## 7.2 二叉搜索树


    二叉搜索树是一种带有附加条件的二叉树：对于任意节点，其元素都大于左子树中的所有元素，且小于右子树中的所有元素。如果你考虑上述二叉树的示例（第 8.1 节开头），它实际上是一个二叉搜索树。为了在二叉搜索树中放置元素，元素必须是可以排序的，在
    Java 术语中，它们应该是可比较的（comparable）。我假设二叉搜索树中的所有元素必须是不同的，事实上我在定义中也要求了这一点。这并非必须，你也可以按照如下方式定义树：对于任意节点，其元素大于或等于左子树中的所有元素，且小于右子树中的所有元素（或者：对于任意节点，其元素大于左子树中的所有元素且小于或等于右子树中的所有元素），实现上主要是在某些地方使用“小于或等于”代替“小于”。然而，在大多数实际应用中，你感兴趣的是元素可能只出现一次搜索树。


    二叉搜索树的定义如下：


    ![](img/Java_18_-_Algorithms_and_data_structures_29-10-18_For_code_137.jpg)


    一个二叉树是*平衡的*，如果它的左和右子树的高度几乎相同。任务是编写一个 `SearchTree<T>` 类，它继承自 `ABinTree<T>` 并实现了上述方法，其中
    `contains()` 方法可以使用对数复杂度实现，这正是二叉树的目标。确保二叉搜索树正确平衡是另一个问题，也是下一节的主题，但如果你认为元素是随机添加的，二叉搜索树通常会是良好的。


    再次考虑二叉树：


    ![](img/Image3306.jpg)


    假设你想搜索 `G`。你从根开始，由于 `G` 小于 `K`，你必须查看 `K` 的左子树。由于 `G` 大于 `D`，你应该查看 `D` 的右子树。由于
    `G` 小于 `H`，你需要查看 `H` 的左子树。此之后找到了元素。因此，原理是从根开始，如果是你要找的元素，就完成了。否则，在左或右子树中重复搜索。直到找到元素或到达空树。与二分一样，原理是每次搜索元素数量减半，所以它是
    `O(log N)` 算法。


    插入新元素的方法类似。从根开始，判断新元素是要插入到左子树还是右子树。如果你到达空子树，就可以将元素作为新节点插入。否则，重复该过程。再次，你向下查找树直到找到新节点必须成为后继的节点，因此插入也可以实现为
    `O(log N)` 算法。例如，如果你必须在上面的树中插入 `J`，你会得到下面的树。步骤是：


    1.  从 K 开始

    2.  去 D

    3.  去 H

    4.  将 J 作为 H 的右孩子插入


    最后的操作对应于 `H` 的右子树是空的，为什么新元素作为新的叶子节点插入到 `H`。


    ![](img/Image3313.jpg)


    接下来你想插入 `I`，你必须：


    1.  从 K 开始

    2.  去 D

    3.  去 H

    4.  去 J

    5.  将 I 作为 J 的节点插入![](img/Image3321.jpg)


    因此实现 `insert()` 方法相对简单，最重要的是注意的是该方法可以用对数时间复杂度来实现。


