    ## 3.6 Time complexity in practice


    Complexity calculations may seem theoretical, but they actually play a major role
    in practice. You often hear about programs where users complain that they are
    running slow. There may be several reasons, but the most frequent is actually
    unfortunate algorithms with poor time complexity. It is therefore important to
    be able to evaluate its algorithms with regard to the use of time and use time
    complexities as a measure of the algorithm’s efficiency and as a tool for comparing
    algorithms and making the right choices.


    In practice, it can be difficult (comprehensive) to determine the time complexity
    of algorithms, but you get well with the above informal guidelines and then a
    good deal of practice. Thus, it is a fixed part of writing an algorithm that you
    also relies on its time complexity.


    As mentioned, it is not necessarily easy to determine a time complexity, and especially
    if you rely on informal arguments you can make mistakes. Therefore, there is also
    reasons to be interested in timing, which simply measures how much time an algorithm
    takes. Time measurements are especially well under test to validate if the theoretical
    time complexities that have been reached are now also sensible. In addition, time
    measurements can be important as documentation, where you can determine the length
    of time that has been addressed to solve the problem for different sizes of a
    problem.


    ## Exercise 4: Calculating primes


