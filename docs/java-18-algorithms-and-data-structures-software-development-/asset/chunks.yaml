    If that is the case, the value of the last quotient must be independent of the
    value of `p`. Below is a result where `p = 1000000000000001L` and `n = 10`:


    ![](image/Java_18_-_Algorithms_and_data_structures_29-10-18_For_code_611.jpg)


    ## 3.7 Memory complexity


    Above, I have focused exclusively on the algorithm’s time complexity, but algorithm’s
    usage of memory obviously also plays a part. Here you use the same notation, and
    you can say that the algorithm’s memory complexity is ![](image/text18__39.jpg).
    This means that its space consumption increases linearly depending on an input
    parameter `N`, and a good example is where the algorithm creates an array or list.
    Similarly, if an algorithm has a memory complexity that is ![](image/text18__40.jpg),
    it could be because the algorithm creates a 2-dimensional array of `M` rows and
    `N` columns.


    Memory complexity rarely has the same focus as time complexity, partly because
    the complexity is typically easier to understand, and partly because it is rarely
    as critical as time complexity, but conversely, the algorithm obviously does not
    need more memory than is necessary and, at worst, a too big consumption for memory
    can results in that the program going down.


    As mentioned many times, you aim for an algorithm with a good time complexity,
    but often you will find that the price is a poor memory complexity. Although it
    is by no means a law, there is often a connection.


    ## 3.8 The median


    Given an array


    19 47 43 3 23 37 7 11 29 5 41 17 2 31 13


    (as in this case has 15 elements), you understand by the median the middle element,
    and in this case it is element with index 7 in a corresponding sorted array. The
    median is therefore 19, since there are 7 numbers


    3 7 11 5 17 2 13


    which is less than 19 and 7 numbers greater than 19:


    47 43 23 37 29 41 31


    So long as the number of numbers is uneven, it’s fine, but if the numbers is equal,
    a definition is required. Suppose there are 16 numbers instead


    53 19 47 43 3 23 37 7 11 29 5 41 17 2 31 13


    Then there are seven numbers that are less than 19 and 23, and there are seven
    numbers that are larger. In practice, you will often choose the average if the
    number of elements is equal, but if you want to determine the median, you must
    choose one of the two.


    I will now look at an algorithm that can determine the median of an array with
    integers. In fact, it is not necessarily simple. However, there is a very direct
    solution where you simply start sorting the array:


    ![](image/Java_18_-_Algorithms_and_data_structures_29-10-18_For_code_62.jpg)


    The algorithm is based on sorting, and as will be seen in the next chapter, it
    is possible to write a sorting algorithm with O(N log N) time complexity. However,
    the algorithm has another problem as it alters the array. In many contexts, you
    are not interested in that and you can then solve the problem by letting the algorithm
    work on a copy:


    ![](image/Java_18_-_Algorithms_and_data_structures_29-10-18_For_code_63.jpg)


    It solves the problem, but now the algorithm has a memory complexity, which is
    ![](image/text18__391.jpg).


    You can also use a more direct route. Determining the median is actually a special
    case of a more general problem, which consists in determining the `k`th least
    number in an array, that is, a method that determines the least number, the second
    smallest number, the third smallest number and so on. If you have an array of
    15 or 16 elements, and if you want to determine the median, you must determine
    the 7th smallest number in both cases. I want to start with a method that divides
    the elements of an array into two parts, where all elements on the left are less
    than a dividing point, while all elements to the right are greater than the dividing
    point. The result is a partition of an array where the lower index is `a` while
    the right index is `b`. The dividing point is determined by the index `k`:


    ![](image/Java_18_-_Algorithms_and_data_structures_29-10-18_For_code_64.jpg)


    The algorithm is simple, but it works as follows:


    1. The partition element is saved in a variable `t`, and it is then replaced with
    the value in the last place.

    2. The index `j` is set to point after the end of the left part (that from the
    beginning is empty) – the elements that are smaller than the partition element.

    3. Then the sub array is passed through. If you find an element that is smaller
    than the partition element, this element is added to the left part.

    4. The last the partition element is put into place.

