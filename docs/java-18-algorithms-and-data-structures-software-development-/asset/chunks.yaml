    comparable<T>>` 基本上可以按照 `DoubleList<T>` 的相同方式实现。四个插入方法被移除并替换为一个新方法。当元素需要可比较时，在列表头部、末尾或特定节点前后插入元素是没有意义的。每次插入元素都需要通过搜索来找到插入的位置。


