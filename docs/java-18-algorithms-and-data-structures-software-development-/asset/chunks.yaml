    ## 5.2 ArrayList


    在实践中，最常用的集合类是 `ArrayList`，在本节中，我将展示该类是如何实现的，以及为什么它是非常高效的。


    在内部，，ArrayList` 是一个可以存放给定数量元素的数组，因此元素存储在从索引 0 开始的位置中。因此，`ArrayList` 根据元素的位置或数量/索引定义了元素的排列方式。`ArrayList`
    不能有空隙。也就是说，如果列表在位置 `n` 处有一个元素，那么在位置 0, 1, 2, …, n-1 处也存在元素。如果 `ArrayList` 完全不包含任何元素，则可以是空的。你可以将
    `ArrayList` 视为一种数据结构，即元素的数组，以及一个指向第一个可用空位置的内部指针：


    ![](img/Image3115.jpg)


    这里有空间存放 20 个元素，而当前有 8 个。因此索引 `n` 的值为 8，作为下一个元素必须放置的位置。


    `ArrayList` 与其他数据结构类似，其特征在于其属性和方法，且 `ArrayList` 基本上提供了以下操作：


    1. `add()`：在列表末尾添加元素

    2. `insert()`：在列表的特定位置插入元素

    3. `remove()`：删除指定索引的元素

    4. `get()`：返回指定索引的元素

    5. `getSize()`：返回列表中的元素数量


    有三个操作——`insert()`、`remove()` 和 `add()`——需要更详细的解释。如果你在位置 `n` 处插入元素，所有后续元素必须向右移动一位，以便为新元素留出空间。例如，如果你在索引为
    4 的位置插入项目 13，结果如下：


    ![](img/Image122.jpg)


    如果你删除第 `n` 个元素，所有后续元素必须向左移动一位。如果你删除索引为 7 的元素，结果如下：


    ![](img/Image130.jpg)


    观察这两个操作，这意味着列表必须移动，如果列表包含 `N` 个元素，平均必须移动 `N/2` 个元素。也就是说，这两个操作的时间复杂度都是 `O(N)`。


    然后是 `add()` 方法，用于在箭头指向的地方插入元素，然后将箭头向右移动一位。因此，操作不依赖于元素的数量，因此具有常数时间复杂度，而且甚至是一个简单的操作。只要有空间，这至少是真实的，但如果列表满了，就有更多工作要做了。策略是创建一个容量翻倍的新数组，然后将旧数组复制到新数组，之后将旧数组留给垃圾回收器。


    扩展包括创建一个新数组并将旧数组的内容复制到新数组中。这种复制具有线性时间复杂度，因为它对数组进行了循环并且数组有 `N` 个元素，因此复制大约需要 `N`
    次操作。假设一个数组恰好包含 `N` 个元素。如果你随后执行以下操作：


    ![](img/Java_18_-_Algorithms_and_data_structures_29-10-18_For_code_102.jpg)


    那么第一次赋值将由于数组的扩展而需要 `N` 次操作，而接下来的 `N-1` 次操作都具有常数时间复杂度，因为它们不需要扩展数组。这 `N` 次操作的平均复杂度则为


    ![](img/text18__72.jpg)


    也就是说，`add()` 操作的平均具有常数时间复杂度，这就是 `ArrayList` 的核心思想，即在列表末尾添加元素是非常高效的，列表会自动扩展而无需涉及用户。然而，代价是内存的使用。


    上面我描述了 `ArrayList` 如何通过双倍数组来扩展，但这不是强制要求的，几种实现使用了另一个因素。然而，结果是 `add()` 方法的常数时间复杂度，这种选择是性能与内存消耗之间的权衡。


