    最后一个操作与上述操作并列，首先对根节点的右子节点进行右旋转，然后对根节点进行左旋转。假设树如下所示，你想围绕根节点 `B` 执行一次右-左旋转：


    ![](img/Image3460.jpg)


    你首先对 `F` 进行右旋转，然后对 `B` 进行左旋转：


    ![](img/Image3469.jpg)![](img/Image3480.jpg)


    在执行了上述操作后，我就可以开始实现平衡二叉搜索树了。它被称为 AVL 树，它使用上述操作来确保树是平衡的。AVL 树是一种二叉搜索树，其额外要求是：对于任意节点，其左子树的高度与右子树的高度之差不超过
    1。


    例如，下图所示是一个 AVL 树，但你应该注意，它不是一个平衡树，因此 AVL 树的要求比平衡树的要求稍微弱一些。


    ![](img/Image3493.jpg)


    如果你向上述树中插入元素 `A`，你会得到：


    ![](img/Image3500.jpg)


    但它不是 AVL 树，因为根据 AVL 树的要求，`G` 和 `E` 存在不平衡，但如果你对 `E` 执行右旋转，AVL 的不平衡就会消除：


    ![](img/Image3508.jpg)


    这展示了旋转的目的是什么：恢复不平衡树的平衡。因此，你可以像普通二叉搜索树中那样实现元素的插入，但在返回时，你需要测试通往新节点路径上的每个节点是否满足 AVL
    条件，如果不满足，则执行旋转。这听起来很简单，在原则上也是如此，但情况比上述示例暗示的要多，这正是其他旋转派上用场的地方。


    ### 算法如下：


    1. 你以与通用二叉搜索树相同的方式插入新元素。

    2. 你在树中回溯，直到到达根节点。

    3. 如果你遇到不平衡点，则使用旋转恢复平衡。


    最初，你应该注意，插入操作自然会产生一棵二叉搜索树。一旦你进入了新节点，只有在其路径上的节点可能会出现不平衡，因为只有它们的子树高度发生了变化。


    对于节点 `X` 出现不平衡有四种情况：


    1. 插入到 `X` 的左子节点的左子树

    2. 插入到 `X` 的左子节点的右子树

    3. 插入到 `X` 的右子节点的左子树

    4. 插入到 `X` 的右子节点的右子树


    观察上面的示例，在 `A` 插入到 `E` 的左子节点 `C` 的左子树后，`E` 出现了不平衡：该问题通过对 `E` 进行右旋转解决。


    也就是说，左-左不平衡通过对检测到不平衡的节点进行右旋转来解决。考虑下面的树，数字表示相应子树的高度：


    ![](img/Image3515.jpg)


    这是一棵 AVL 树。假设插入 `B`，它被插入为 `C` 的左子节点的右子树。结果是有一棵在 `C` 处存在不平衡的树。


    ![](img/Image3523.jpg)


    你遇到了左-右不平衡，这通过左-右旋转来解决：确定 `C` 存在不平衡，对 `C` 的左子节点进行左旋转，对 `C` 进行右旋转。对 `A` 进行左旋转：


    ![](img/Image3530.jpg)


    然后对 `C` 进行右旋转：


    ![](img/Image3538.jpg)


    平衡恢复了。接下来的树也是一棵 AVL 树：


    ![](img/Image3545.jpg)


    如果你插入 `G`，你会得到一棵在 `F` 处存在不平衡的二叉搜索树：


    ![](img/Image3553.jpg)


    因此这是右-左不平衡的树。这次问题通过对 `F` 执行右-左旋转解决。首先，对 `H` 进行右旋转：


    ![](img/Image3562.jpg)


    然后对 `F` 进行左旋转：


    ![](img/Image3573.jpg)


    也就是说，右-左不平衡通过右-左旋转来解决：确定 `F` 的不平衡，对 `F` 的右子节点右旋转，对 `F` 进行左旋转。


    最后一种情况是右-右不平衡，即插入到右节点的右子树中。如果检测到 `X` 的不平衡，通过对 `X` 进行左旋转来解决问题。


    再次考虑这棵树：


    ![](img/Image3587.jpg)


    如果你插入 `I`，你会得到 `F` 处出现不平衡：


    ![](img/Image3594.jpg)


    如果你现在对 `F` 执行左旋转，树再次恢复了平衡：


    ![](img/Image3602.jpg)


    上述内容说明了在 AVL 树中实现插入所需的步骤。你按照通常插入元素，之后回溯检查新节点插入的子树的父节点是否存在不平衡，如果是，则执行四种旋转之一，此过程持续到到达根节点。与通用搜索树相比，AVL
    树的插入要复杂一些，但有了这个类，原则上是可以实现的。`insert()` 和 `remove()` 两个方法需要编写大量的代码，并且要确保引用是正确的。然后是删除，问题是一样的，删除元素后可能会产生不平衡，需要恢复平衡，但删除实现较困难。对于
    `insert()` 和 `remove()`，对于每个节点都可以判断是否存在不平衡，因为 `SearchTree<T>` 类有一个 `getHeight()`
    方法返回子树的高度。然而，问题在于它具有线性时间复杂度，如果你对路径上的每个节点都测试高度，最终算法将是 `O(N)`，这非常遗憾。


    现在不再需要这样做，相反，你可以在每个节点上附加一个因子，然后在向下遍历树时对其调整。`DoubleNode<T>` 类没有这样的因子，因此需要扩展。当你回溯恢复平衡时，你需要控制父节点，这个问题可以通过将单个节点放在栈中来解决，但另一种更简单的方法是每个节点关联一个父指针。这需要额外的空间，但会让插入和删除变得容易，而且你不需要每次插入或删除都保存节点。为了这一点，`AVLTree<T>`
    类具有以下内部类：


    ```

    ![](img/Java_18_-_Algorithms_and_data_structures_29-10-18_For_code_160.jpg)[](image/Java_18_-_Algorithms_and_data_structures_29-10-18_For_code_1611.jpg)

    ```


    该类有一个因子 `height`，在这里你会注意到 `getBalance()` 方法，它返回左右子树的权重差。如果这个差值数值大于 1，则表示存在不平衡。`updateHeight()`
    方法将该因子更新为左右子树的最大因子加 1，分别对应于发生变化的的子树。


