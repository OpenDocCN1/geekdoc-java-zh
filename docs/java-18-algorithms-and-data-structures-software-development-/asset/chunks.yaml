    划分元素也被称为基准点（pivot point），在方法完成后，基准点 `t` 将位于正确的位置，`t` 左侧的所有元素都小于 `t`，而 `t` 右侧的所有元素都大于（或等于）`t`。注意，该方法返回的是基准点的索引。同样请注意，索引
    `k` 必须落在 `a` 和 `b` 之间的范围内。最后，请注意该算法通过遍历子数组来工作，因此它的线性复杂度取决于子数组的长度。你应该牢记住这个方法，因为我将在下一章关于排序的章节中再次应用它。


    在使用该方法时，你感兴趣的是将数组分为两个等等的部分。这取决于你选择基准点时的运气。理想情况下，你应该选择中位数，但这并不容易决定——这就是我正在尝试解决的问题。如果你对数组一无所知（元素是随机排列的），那么没有理由认为某一个基准点比另一个好，此时你可以选择最后一个（或第一个）。这对应于在上述方法中，索引
    `k`是可以省略的，而且在实践中你经常使用这种策略。然而，如果例如数组已经排序（或几乎排序），那么这将是最糟糕的选择（因为数组没有被显著划分）。一种更好的策略是选择端点和子数组中间点的中位数：


    ![](img/Java_18_-_Algorithms_and_data_structures_29-10-18_For_code_65.jpg)


    当然，无法保证它会产生更好的结果，但研究表明，在绝大多数情况下这是一个很好的策略，特别是因为它解决了数组已经排序的问题，而且尽管上述方法 `pivot()`
    看起来很复杂，但它只是一个简单的比较。


    通过 `partition()` 方法，很容易写出一个算法来确定数组中第 `k` 小的元素：


    ![](img/Java_18_-_Algorithms_and_data_structures_29-10-18_For_code_651.jpg)![](img/Java_18_-_Algorithms_and_data_structures_29-10-18_For_code_66.jpg)


    `partition()` 会交换数组中的元素，由于数组在方法完成后应保持不变，因此该方法从开始创建一个副本。因此，它具有线性内存复杂度。该方法通过对分区进行操作（从开始是全部）来工作。然后，使用
    `pivot()` 方法选择基准索引，并使用 `partition()` 方法划分数组。接下来，确定基准点的位置 `p`，如果等于 `k`，则基准点就是解。如果
    `p` 大于 `k`，则必须在区间的左部分找到，只需移动子数组的右端点。否则，移动左端点，并将 `k` 减去 `p`，对应于在右子数组中搜索第 `(k-p)`
    小的数。


    有了这个方法，可以如下确定中位数：


    ![](img/Java_18_-_Algorithms_and_data_structures_29-10-18_For_code_661.jpg)


    如果你查看 `leastOf()`，它（在最坏的情况下）会迭代到从 `a` 到 `b` 的子区间长度为 1 为止。如果你划分运气很好（且子区间每次都平分），那么循环在
    ![](img/text18__41.jpg) 次后就会停止。在每次迭代中，你必须划分数组，这包括对要划分的子区间进行扫描，随着该区间长度每次减半，它对应的操作次数大致类似于：


    ![](img/text18__42.jpg)


    其中 ![](img/text18__43.jpg)。也就是说，`leastOf()` 的时间复杂度优于线性。上面的计算并不准确，但它暗示了时间复杂度的数量级，并且与时间测量一致。


    `Tools` 类通过 `leastOf()` 和 `median()` 两个方法扩展，`Algorithms` 类有一个测试方法 `test17()`。


