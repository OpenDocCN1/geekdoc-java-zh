    You should note that an algorithm has input parameters, which are the values on
    which the algorithm works. To the extent there are preconditions attached to these
    parameters, I indicate it as a comment in front of the algorithm. Instead, you
    could let the method raise an exception if the preconditions have not been met
    and it’s a matter of choice whether where you do the one or the other. If you
    just post a comment, it’s a contract that you ask the user to adhere to and if
    the user do it, the one who has written the algorithm guarantees that it gives
    the right result while the programmer guarantees nothing if the algorithm is used
    with incorrect preconditions. You are talking about contract programming, and
    it is the user of the method that is responsible for compliance with the preconditions.
    Contract programming simplifies the code, while the use of exception handling
    helps the user always to performs the method with the right preconditions, but
    in return, the algorithm must test whether the preconditions is met.


    The above algorithm is implemented to work for values of the type `long` (the
    parameter `n`). If the algorithm also has to be implemented for values of the
    type `double`, one will often write an overridden version of the method, and where
    I this time have let the method tests the precondition:


    ![](image/Java_18_-_Algorithms_and_data_structures_29-10-18_For_code_131.jpg)!(image/Java_18_-_Algorithms_and_data_structures_29-10-18_For_code_14.jpg)


    When writing algorithms whose input parameters are simple types, it is very common
    that you override the algorithm’s method for different types, and it is up to
    the programmer who writes the algorithm to ensure the necessary overrides. In
    this case, it is an algorithm that works on numbers, and you typically have to
    write overrides for the different number types, but in other contexts there will
    be algorithms that work on class types, and here I will often write the algorithms
    as generic methods. Please note that this practice is widely used in Java.


    In the review of algorithms, like the above, I will focus on both the algorithm
    and thus the how to solve the problem, but also how the algorithm can be implemented
    in Java.


    ## 2.1 Examples of algorithms


    The following continues the discussion of what an algorithm is, and also how to
    formulate algorithms using an informal language. In addition, I will give examples
    of classic algorithms.


    With regard to writing an algorithm in an informal language or using a programming
    language, the choice is not clear. Modern programming languages such as Java is
    so self-documenting that you often can formulate an algorithm as clearly and easily
    in the language itself as using an informal pseudo language. In fact, there is
    even a tendency for algorithms formulated in an informally language to be longer
    than the corresponding algorithm written in a programming language, and if so,
    of course it does not make sense to describe algorithms informally. If you are
    proficient in your language, you think and formulate equally well using the terms
    of the language, and many therefore avoid descriptions of algorithms informally.
    In this book, however, I would like to make some use of an informal language,
    because I think that at least in complex algorithms it is worth paying off the
    details of the programming language to better focus on the the most important
    steps in the algorithm. On the other hand, you should avoid making the informal
    algorithms too detailed and straightforward to use an informal language as a technique
    for problem decomposition. You should avoid writing informal algorithms, that
    in fact is the program written in English.


    Basically, an algorithm contains four things:


    *   sequences that is a series of orders/instructions that are performed in the
    order in which they are written in the algorithm

    *   conditions where the execution of one or more operations are performed depending
    on a condition

    *   loops where one or more operations are performed as long as a condition is
    met

    *   performing a sub algorithm where the current algorithm starts another algorithm


    ### Difference series


    By a difference series you should understand a series of number


    ![](image/text18__3.jpg)


    with the characteristic that you all the time go one step forward in the row by
    adding the same number, for example


    4, 7, 10, 13, 16, 19, …


    where you each time adds 3. It can also be expressed that the difference between
    a number and the previous number is constant (hence the name):


    ![](image/text18__4.jpg)


    If so, you say that you have a difference series with the difference `d`. As other
    examples of difference series are:


    5, 8, 11, 14, 17, 20, 23, …, 2 + 3n, ….


    2, 4, 6, 8, 10, 12, …, 2n, ….


    1, 2, 3, 4, 5, 6, …, n, ….


    where the first has difference 3, the second difference 2 and the last difference
    1.


    The goal is now to write an algorithm that can determine the sum of the numbers
    in a difference series. To do that, you must know three things:


    *   the first number `a` (where the series starts)

    *   the difference `d` (how much you have to step forward to get to the next number)

    *   how many numbers `n`, that should be included in the sum


    The algorithm can then be written as follows:


    ![](image/Java_18_-_Algorithms_and_data_structures_29-10-18_For_code_16.jpg)


    Again, it’s a simple algorithm, and it’s easy to figure out that it gives the
    correct result: For each repeat, the sum is increased by the next number in the
    difference series, and `a` is then changed to the next number. It’s easy to write
    the algorithm as a `static` method in Java:


    ![](image/Java_18_-_Algorithms_and_data_structures_29-10-18_For_code_16.jpg)


    Note that the method uses the above algorithm. The algorithm basically consists
    of a loop which is repeated `n` times that is the algorithm determines the sum
    of the `n` first numbers. Thus, the complexity of the algorithm, regarding the
    number of statements (operations), is determined by `n`, and for large values
    of `n`, the algorithm requires many operations. On the other hand, its space consumption
    is independent of `n`, since it only uses a single additional variable (the variable
    in the loop) regardless of the size of `n`.


    If you consider the above method, you will decide in the last iteration of the
    loop the variable `a` is assigned a value which is not used. This can be easily
    overcome by changing the statements:


    ![](image/Java_18_-_Algorithms_and_data_structures_29-10-18_For_code_17.jpg)


    There is no big difference, but in the last version, the loop is performed once
    fewer, and the algorithm is therefore more efficient. However, the difference
    is hardly measurable, but it shows that, after writing an algorithm, you can often
    improve/optimize by critically referring to how it is written. However, I would
    like to warn some kind of optimizations, and be aware that they do not go beyond
    readability. This is not the case here, but it is important that an algorithm
    is easy to read and understand.


    In one way or another, the above is the natural algorithm to determine the sum
    of a difference series as it directly depends on the definition, but there are
    other options, and the question is whether you can do it better – and you can.
    If you have a difference series


    ![](image/text18__5.jpg)


    with difference `d`, you can determine the sum of the `n` numbers based on the
    formula


    ![](image/text18__6.jpg)


    that is as the sum of the first and the last number and times the number of numbers
    divided by 2. It is a mathematical formula which is not particularly difficult
    to prove. You can therefore also write the algorithm as follows:


    ![](image/Java_18_-_Algorithms_and_data_structures_29-10-18_For_code_18.jpg)

