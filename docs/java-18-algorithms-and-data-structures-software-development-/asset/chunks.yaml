    for a single linked list, but there are now several references to keep track of.
    For example, a method *insertAfter()* can be described as follows:


    1.  Find the node *current*, which the new element must follow


    2.  create a new node that points back to *current* and forward on *current*’s
    successor


    3.  *current*’s successor must point back to the new node


    4.  *current* should point forward to the new node


    You should also consider whether the implementation also work if the element is
    inserted after the last element, which will often be a special case. Similarly,
    you can describe a method *insertBefore()*. A method to delete a node is the most
    complex and can be described as something like the following:


    1.  Find the node *current*, which contains the item to be deleted


    2.  The successor to *current* must point back to the predecessor to *current*


    3.  The predecessor to *current* must point forward on the successor to *current*


    When deletion is more complex than insertion, it is because deletion of both the
    first and the last element will usually be a special cases. In addition, it should
    be noted that deleting an element may result in an empty list.


    To implement a double-linked list, start with a node:


    ![](image/Java_18_-_Algorithms_and_data_structures_29-10-18_For_code_114.jpg)![](image/Java_18_-_Algorithms_and_data_structures_29-10-18_For_code_115.jpg)


    The class looks like *SingleNode* simply expanded with an additional reference,
    and in fact the class could be written as a specialization of *SingleNode*. The
    benefits would be limited, and in some places it might be necessary to have a
    lot of typecasts. With this class available, you can define a double-linked list
    as follows:


    ![](image/Java_18_-_Algorithms_and_data_structures_29-10-18_For_code_1151.jpg)![](image/Java_18_-_Algorithms_and_data_structures_29-10-18_For_code_116.jpg)


    Java has a class *LinkedList*, and it is a double linked list corresponding to
    the above description. It is relatively simple to implement a double linked list,
    but unlike a single list, there are several references to keep track of. The class
    *DoubleList* implements the above interface.


    ## Exercise 9: Test DoubleList


    You must write a program that can test the class *DoubleList*:


    ![](image/Java_18_-_Algorithms_and_data_structures_29-10-18_For_code_1161.jpg)![](image/Java_18_-_Algorithms_and_data_structures_29-10-18_For_code_117.jpg)


    ## Problem 3: A circular list


    A double linked list can be implemented in several ways, and one of the options
    is like a circular list, where the last node points to the first, while the first
    points back to the last one:


    ![](image/Image3231.jpg)


    There is no longer any first and last element, and you refer to the list’s elements
    using an internal reference, which refers to a current node. A class that implements
    such a data structure must therefore have methods that can move this internal
    reference and insertion in the list occurs before or after the node where *current*
    points. Similarly, deletion means that the node where *current* currently should
    be removed.


    It is your task to implement such a list. In fact, it is not quite easy, but you
    can make it easier to introduce a dummy node, which is a node that is always there
    and does not contain data:


    ![](image/Image3239.jpg)


    This means that an empty list has the form:


    ![](image/Image3246.jpg)


    and in the case of an empty list, there is a node to insert before or after. The
    task is to write a class that implements the following interface as a circular
    double-ended list:


    ![](image/Java_18_-_Algorithms_and_data_structures_29-10-18_For_code_119.jpg)![](image/Java_18_-_Algorithms_and_data_structures_29-10-18_For_code_120.jpg)


    To write the class, use the class *DoubleNode*. It gives a problem as it is in
    another package. To resolve this issue, take a copy of the class and add it to
    your own project. My project is called *AnotherList*.


    Remember to write a test program.


    ## 6.3 An ordered linked lists


    Both a single linked list and a double linked list can be implemented as an ordered
    list, which simply means that the elements are sorted according to a particular
    arrangement criterion. For example, if looking at an ordered double-linked list,
    the only difference compared to a general double-linked list is that insertion
    of elements should occur in another way. A class should now only have one *insert()*
    method that inserts an element corresponding to the current arrangements, while
    the other methods for insertion no longer make sense. Apart from inserting elements,
    all other methods must be implemented in exactly the same way as in the class
    *DoubleList<T>*.


    The class *SortedList<T expands Comparable<T>>* implements an ordered double-linked
    list and is defined by the interface:


    ![](image/Java_18_-_Algorithms_and_data_structures_29-10-18_For_code_121.jpg)


    Aside from the methods for insert of elements is the same interface as *IDoubleList*
    – and that the data type *T* this time must implement *Comparable*. Therefore,
    the class *SortedList<T extends comparable<T>>* can basically be implemented in
    the same way as *DoubleList<T>*. Just are the four methods to insert elements
    been removed and replaced by one new method. When the elements need to be *Comparable*,
    it does not make sense to insert an element at the beginning of the list, at the
    end of the list or after or before a particular node. Each time you insert an
    element, is it necessary with a search and find where the element should be inserted.


