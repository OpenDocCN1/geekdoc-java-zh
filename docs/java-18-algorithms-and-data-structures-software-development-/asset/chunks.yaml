    现在问题简化为确定最后一个数。如果一个等差数列以数字 `a` 开始，且你想确定第 `n` 个数，你必须向前移动 `n-1` 步，因此你可以这样计算第 `n`
    个数：


    ![](img/text18__7.jpg)


    这就是基于初始值和差值计算的第 `n` 个数，因此上述算法可以直接实现为：


    ![](img/Java_18_-_Algorithms_and_data_structures_29-10-18_For_code_181.jpg)


    注意，它也适用于 `n` 为 0 的特殊情况。最后一个算法是最好的。第一个版本使用循环解决问题，如果 `n` 很大，它将导致很多操作（每次循环重复可能需要执行更多、也许简单的操作）。相比之下，最后一个算法仅通过两次计算就能解决问题，效率高得多，而且，该算法独立于问题的大小——它不取决于
    `n` 的大小。可以说最后一个算法具有常数时间复杂度。


    注意，在 `a` = 1 且 `d` = 1 的情况下，该算法确定的是和：


    ![](img/Java_18_-_Algorithms_and_data_structures_29-10-18_For_code_19.jpg)


    在这种情况下，只有当 `n` 很大时，两种算法之间的差异才是可衡量的，但示例说明了首先，问题通常可以通过不同的算法来解决；其次，不同的算法对机器资源的利用效率并不对等。我们的目标是编写尽可能有效的算法，即能够最小化资源消耗的算法。


    ## 练习 1：等差数列


    你必须编写一个类来表示 `double` 类型数字的等差数列，其中构造函数必须初始化第一个数和差值。此外，该类必须实现两个方法，分别返回第 `n` 个数和前
    `n` 个数的：


    ![](img/Java_18_-_Algorithms_and_data_structures_29-10-18_For_code_191.jpg)


    ## 2.2 递归


    在数学等其他领域，递归地定义公式和概念是非常常见的，即公式由自身来表示。例如，你可以如下定义一个差值为 `d` 的等差数列：


    ![](img/text18__8.jpg)


    另一个例子是阶乘公式：


    ![](img/text18__9.jpg)


    其中项仅由自身表示：如果你知道 `(n-1)!`，你是否也能确定 `n!`？当知道 `0!` 时，人们可以确定 `1!`，然后你可以确定 `2!`，接着是
    `3!` 等，依此类推。


    如果你想写一个一个可以确定 `n!` 的算法，你可以立即应用上述公式：


    ![](img/Java_18_-_Algorithms_and_data_structures_29-10-18_For_code_20.jpg)


    注意，该算法是数学定义的直接重写，关键点在于算法是自编写的——算法调用它自己，而调用自身的算法被称为递归算法。


    在 Java 中，算法被写成方法，而方法可以例如调用另一个方法，特别是调用它自己。因此，Java 支持递归，算法可以直接实现如下：


    ![](img/Java_18_-_Algorithms_and_data_structures_29-10-18_For_code_201.jpg)


    递归算法通常比解决相同问题的对应非递归算法（也称为迭代算法）更简单，但要发现递归算法何时正确通常更困难。然而，在这种情况下它是很容易的，因为算法仅仅是数学定义的拷贝。


    也可以（容易地）不使用递归来实现确定阶乘的算法——即作为一种迭代算法：


    ![](img/Java_18_-_Algorithms_and_data_structures_29-10-18_For_code_21.jpg)


    在这里也很容易认为该算法可以正常工作并给出正确结果。在这种情况下，差异并不明显，但实际上最后一个比第一个更有效，因为它使用的内存更少：当算法每次调用自己时，都需要传递参数，这会消耗内存和时间。下面说明了如果你使用递归版本的
    `factorial()` 来确定 5 的阶乘会发生什么。方框或说明了栈上的激活块（activation blocks），只有当你到达底部并确定 `0!`
    的最后一个值时，调用才开始返回并释放激活块。


    ![](img/Image1851.jpg)


    在绝大多数情况下，这并不重要，但通常，迭代算法使用的内存会比递归算法少。


    总有理由意识到递归的含义，下面我将展示一个递归看似是自然选择的例子，但它绝对是错误的选择，导致最终得到的算法效率极低，对于大的输入值完全无法使用。


    递归的优势很少在于效率，而在于让算法写得更短，有时也更具可读性。事实上，我稍将展示一些难以写成迭代的算法，但递归解决方案既短又易于理解。


    最后说明一点，许多人发现递归很难，编写和阅读都很困难。你必须写一个以字符串作为参数的方法，该方法应该返回反转顺序的字符串。也就是说，如果调用方法时参数为 `ABCD`，它应该返回
    `DCBA`。这个问题当然可以通过一个从字符串末尾向前遍历的循环通过迭代来解决，但你也可以递归地编写解决方案：


    ![](img/Java_18_-_Algorithms_and_data_structures_29-10-18_For_code_23.jpg)


    再次，这是一个递归没有优势的例子，但这个示例展示了算法典型的样子。算法由两部分组成，第一部分是简单的，可以立即解决问题（在这里是字符串为空）。另一部分是通用情况，使用算法本身解决问题，但应用于比原始问题更小的问题——在本例中是
    `swap()`。


    测试字符串是否为回文的方法必须写成一个递归方法：


    *   如果你有一个简单且平凡的情况，字符串为空或仅包含单个字符，它就是回文。

    *   否则，如果忽略第一个字符，则测试剩余字符是否为回文。

    *   否则，如果忽略最后一个字符，则测试其余字符是否为回文。

    *   否则，如果首尾字符相同，则测试字符串的剩余部分是否为回文。


    ## 练习 2：回文


    你应该编写一个程序，其中包含一个方法来测试字符串是否为回文。回文是在忽略空格和特殊字符时，从正反读读都相同的字符串，且不区分大小写。回文的示例包括：


    *   `Otto`

    *   [A tin mug for a jar of gum, Nita.](https://www.palindromelist.net/A-tin-mug-for-a-jar-of-gum-Nita/)

    *   [A nut for a jar of tuna](https://www.palindromelist.net/A-nut-for-a-jar-of-tuna/)

    *   [A man, a plan, a cat, a ham, a yak, a yam, a hat, a canal-Panama!](https://www.palindromelist.net/A-man-a-plan-a-cat-a-ham-a-yak-a-yam-a-hat-a-canal-Panama/)


