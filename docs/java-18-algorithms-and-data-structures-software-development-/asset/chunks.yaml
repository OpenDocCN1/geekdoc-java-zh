    `insert()` 方法相对复杂——至少如果你考虑到重哈的话是这样。尽管重哈操作很复杂且具有线性复杂度，但它应该偶尔执行，并且与 `ArrayList`
    一一样，结果是 `insert()` 的平均时间复杂度是常数。然而，其前提条件是列表中的元素较少，这等同于冲突较少。


