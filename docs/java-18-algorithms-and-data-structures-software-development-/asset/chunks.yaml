    `ABinTree<T>` 实现，但它是一个抽象类，因为它没有实现 `contains()` 方法。另一方面，它可以实现三个迭代器，这三个迭代器是该类的全部目的，因为它们的实现方式是相同的（使用栈
    `stack`），且不依赖于当前的树结构。为了实现这三个迭代器，该类为每个迭代器都定义了内部类，下面展示了中序遍历类的类示例：


