    The above single linked list has its uses and is characterized by that it has
    a simple implementation, but often you choose to implement a double linked list,
    where each node not only keeps track of the successor, but also the predecessor.
    By giving the individual nodes a reference to the predecessor, you will also be
    able to search backward, for example, to start at the end of the list and traverse
    the list in the opposite direction. It is advantageous for many tasks, and some
    methods can actually be implemented more easily, but the price is that the individual
    nodes must contain an additional reference:


    ![](image/Java_18_-_Algorithms_and_data_structures_29-10-18_For_code_113.jpg)![](image/Image3216.jpg)


    In order to access the individual elements, the list must consist of a reference
    `start` that can point to the first element, as well as a reference `end` than
    may point to the last element:


    ![](image/Image3224.jpg)


    Insertion and deletion of elements takes place in principle in the same way as
    for a single linked list, but there are now several references to keep track of.
    For example, a method `insertAfter()` can be described as follows:


    1. Find the node `current`, which the new element must follow

    2. create a new node that points back to `current` and forward on `current`’s
    successor

    3. `current`’s successor must point back to the new node

    4. `current` should point forward to the new node


    You should also consider whether the implementation also work if the element is
    inserted after the last element, which will often be a special case. Similarly,
    you can describe a method `insertBefore()`. A method to delete a node is the most
    complex and can be described as something like the following:


    1. Find the node `current`, which contains the item to be deleted

    2. The successor to `current` must point back to the predecessor to `current`

    3. The predecessor to `current` must point forward on the successor to `current`


    When deletion is more complex than insertion, it is because deletion of both the
    first and the last element will usually be a special cases. In addition, it should
    be noted that deleting an element may result in an empty list.


    To implement a double-linked list, start with a node:


    ![](image/Java_18_-_Algorithms_and_data_structures_29-10-18_For_code_114.jpg)![](image/Java_18_-_Algorithms_and_data_structures_29-10-18_For_code_115.jpg)


    The class looks like `SingleNode` simply expanded with an additional reference,
    and in fact the class could be written as a specialization of `SingleNode`. The
    benefits would be limited, and in some places it might be necessary to have a
    lot of typecasts. With this class available, you can define a double-linked list
    as follows:


    ![](image/Java_18_-_Algorithms_and_data_structures_29-10-18_For_code_1151.jpg)![](image/Java_18_-_Algorithms_and_data_structures_29-10-18_For_code_116.jpg)


    Java has a class `LinkedList`, and it is a double linked list corresponding to
    the above description. It is relatively simple to implement a double linked list,
    but unlike a single list, there are several references to keep track of. The class
    `DoubleList` implements the above interface.


