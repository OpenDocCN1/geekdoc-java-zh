    A heap is a completely binary tree. You can now place the root in place 1 and
    the root’s children in places 2 and 3. Then you can place the root’s grandchildren
    in places 4, 5, 6 and 7 and the next level (where there are 8 nodes) can then
    be placed on places 8, 9, 10, 11, 12, 13, 14 and 15. That is, that the elements
    of the tree are placed in the tree arranged by level, and since it is a complete
    tree, it means that the tree has no holes. Put a little differently, you can calculates
    the indices the tree’s nodes from the following formulas:


    ![](image/Image3667.jpg)


    Consider, for example, the following complete binary tree:


    ![](image/Image3680.jpg)


    In fact, it’s a heap. There are four levels where only the three are filled out
    and if you implement this tree as an array you get the result:


    ![](image/Image3687.jpg)


    The idea is that, based on the above formulas, you can directly calculate where
    an element’s parent and children are. For example:


    1.  The right child to 3 is on place `2 * 2 + 1 = 5`

    2.  The left child to 5 is on place `2 * 3 = 6`

    3.  Parent to 13 is on place `11 ⁄ 2 = 5`


    By implementing a complete binary tree this way, it is easy to implement a heap.
    It is done in the class `Heap`.


    Looking at the above figures and the class `Heap`, you can see that I do not use
    the first place in the array. The reason is that both the implementation and indexing
    in the array will be simpler thus resulting in a more efficient implementation.
    Of course, you can do that and instead start with the root in place 0, but it
    gives more complex index calculations and, in principle, a less effective code.


    ## 8.2 Heap sort


    If you inserts the elements in an array in a heap and subsequently empty the heap,
    the result will be that the array has be sorted. You can therefore write a sorting
    algorithm as follows:


    ![](image/Java_18_-_Algorithms_and_data_structures_29-10-18_For_code_171.jpg)


    The method is implemented in the class `Tools`.


    Since both insertion and deletion in a heap have logarithmic complexity, the complexity
    of the algorithm is `O(N log (N))` and thus the same as for example quick sort.
    The method, however, has primarily theoretical interest. Firstly, time measurements
    will show that the method in most cases is less efficient than quick sort and
    then it should be noted that the memory complexity is not good as it is based
    on a heap and thus a copy of the array, that is on the same way as merge sort.


