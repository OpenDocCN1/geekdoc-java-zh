    The latter is only an internal class property, and it is basically the intention
    that users should not (need to) be aware of it. Users need to know the complexity
    of the individual methods, but whatever else happens, it is left to who implements
    the class to take care of.


    Until this place I have mentioned two ways to store objects. It happens either
    by means of an array or by linking the elements together with references or pointers.
    Both ways have their pros and cons, and the choice will depend on the characteristics
    you want that collection to have. In fact, it is the only two ways you have to
    store objects, but in both cases it is possible to organize the objects appropriately,
    which is important for class’s methods. For example, an `ArrayList` stores the
    objects in an array, but is organized in such a way that they are stored from
    the start and then to a last element. The `ArrayList` has an internal counter
    which it uses to keep track of where the last element is.


    What characterizes an array as a container is that each object is located on a
    particular index, and with this index in hand you have direct access to the element
    with constant time complexity. An array is a highly efficient container, but it
    is up to the user (the collection class) to decide which index to use to find
    a particular element. The problem with it is that in many contexts (most) it is
    not very appropriate to refer to a particular object via a numerical index that
    directly corresponds to the physical location, but it would be better to find
    an object based on for example, a name (a key), but without it should be in the
    form of a search. The solution to that problem may be `hashing`.


    Technically, a hashed structure is an array of objects that identify the individual
    objects using a key rather than an index. The idea is that the key is converted
    to an index, which indicates where in the array the object is located. It is this
    conversion that is called `hashing`. That is, when finding an object in the array,
    it does not happen with searching, but by calculating where the object is and
    thus by an operation that has constant time complexity.


    To illustrate the principle, I will look at an example where I want to save Danish
    zip codes in an array. An example of an object is


    ![](image/Java_18_-_Algorithms_and_data_structures_29-10-18_For_code_176.jpg)


    Suppose that the starting point is an array of 10 places (see below). As mentioned
    above, I will use the zip code as a key, and the first task is to convert the
    zip code to an index. I will use the following function:


    ![](image/Java_18_-_Algorithms_and_data_structures_29-10-18_For_code_177.jpg)


    where `digetsum()` is a function that determines the sum of the digits in a zip
    code. The 10’s come from the array size, and the value of index will therefore
    always be one of the numbers 0, 1, 2, …, 9 and thus a legal index. The method
    `digetsum()` is what is called a hash function and you should note that it is
    easy to implement this function in java regardless of whether the type of code
    is a `String` or an `int`.


    ![](image/Image3695.jpg)


    If the key is `7800`, the zip code object must be placed in place


    ![](image/Java_18_-_Algorithms_and_data_structures_29-10-18_For_code_1771.jpg)


    and below I have shown the array after `7800, Skive` is inserted:


    ![](image/Image3702.jpg)


    Below I have shown the table after I have added another three objects:


    * `8800, Viborg`

    * `7950, Erslev`

    * `8000, Aarhus C`


    and the important thing is to note that each time the object’s place is found
    using a calculation and not a search:


    ![](image/Image3710.jpg)


    Suppose you want to further insert the object


    * `7900, Nykøbing`


    The element should be placed in place 6, but it is busy and we are talking about
    a collision. There are two objects with different keys, which by the hash function
    determines the same location in the table. You can therefore conclude that there
    are two basic challenges to implement hashing of an array:


    1. A hash function must be defined in a way that distributes the keys evenly across
    the array.

    2. There must be a solution to the collision problem.


    In terms of the hash function, it is in principle a question about that you have
    an array of a given size `n` and a collection of objects of one kind or another.
    If you have an object `obj`, the hash function `f` must from the object `obj`
    calculate an `int f(obj)` which is called the hash value or the hash code. You
    can then determine the object’s index in the array as `i = f (obj) mod n`, which
    just specifies a value within the array boundaries.


    The function `f` must of course be effective, but otherwise the most important
    feature is that the indexes are evenly distributed across the array. If this is
    not the case, the objects will clump into one or more locations in the array,
    which means that parts of the array will not be used and that the risk of collisions
    will increase.


    There are many examples of good hash functions defined for numbers and strings,
    and they will typically work by looking at the individual characters as above
    with the zip code example and for numerical values by some form of calculation.
    Often the key is a string, or strings are included in the key. A hash function
    that works on a string therefore needs to convert a string to an integer, which
    typically takes place using the numerical codes for the individual characters.
    The calculation could, for example, take place as follows:


    Let `n` denotes the number of characters in the string and let ![](image/text18__73.jpg)
    be the character code for the character on position `i`. Then


    ![](image/text18__74.jpg)


    is an example of a hash function that calculates the hash code for a string. If,
    for a given string, modulus is taken with the array length, the string is converted
    to an array index. The above hash function is simple to implement (and understand
    – the 31 are because it is a prime) and it is the function used in Java. I have
    shown the function here as an example, and that it’s easy to write a hash function
    that works on strings.


    As is known, the class `Object` has a method `hashCode()`, which returns a hash
    value for an object. It returns the object reference which can not be used to
    much (usually you need a code with value semantics), but the method can be overridden.
    The method is usually override together with `equals()`, and the only requirement
    is that if two objects are `equal()`, they must also have the hash code. Conversely,
    the reverse is not a requirement, and you may have two objects that have the same
    hash code but are not `equal()`.


    `hashCode()` is a hash function, and the result is that each type in Java has
    its hash function, but for custom types it is left to the programmer to implement
    the function so that you get a good hash function with value semantics. For most
    Java classes, including the class `String`, it is done, and it is not necessary
    to do any further. For example, `hashCode()` for an `Integer` just returns the
    number itself, while `hashCode()` of a `Long` returns a XOR of the top 32 bits
    with the last 32 bits. If `n` is the value a `Long`, the hash code is determined
    as:


    ![](image/Java_18_-_Algorithms_and_data_structures_29-10-18_For_code_180.jpg)


    Then there is the collision problem. In general, there will always be more possible
    keys than there are places in the array that will contain the objects. Therefore,
    collision will always occur in practice. The whole idea of hashing is that from
    the key you can find the location of an object with constant time complexity.
    To succeed, there must be few collisions and short collision chains. It is therefore
    a part of implementing a collection using hashing also to solve the collision
    problem. I want to mention four ways.

