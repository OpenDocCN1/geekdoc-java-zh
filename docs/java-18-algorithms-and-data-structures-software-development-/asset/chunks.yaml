    如果你不知道数组包含哪些元素，你应该预期要搜索数组的一半——你无法知道你正在查找的元素是在开头还是末尾——如果你有一个包含 `N` 个元素的数组，你必须预期要执行
    `½N` 次操作。这仍然是数组大小的线性函数（只是增长率较小），因此该算法的平均时间复杂度为 `O(N)`。


    上述是对算法时间复杂度的分析，得出了三种复杂度：


    * 优情况时间复杂度：`O(1)`

    * 平均时间复杂度：`O(N)`

    * 最坏时间复杂度：`O(N)`


    需要注意的是，复杂度衡量标准并没有规定算法执行时间的具体数值，也没有规定执行相应程序需要多长时间，它只是告诉你是算法如何作为一个或多个输入参数（这里是数组大小）的函数而变化的。复杂度衡量可以用于比较算法，并确定解决某个问题的算法是否优于另一种算法。


    算法的执行时间自然取决于上述分析之外的其它因素。例如，时间被用于传输参数和创建变量，但所有这些消耗都是恒定的时间，且不取决于数组的大小。它不会改变算法对于不同规模输入参数的行为总体原理。还存在影响执行时间的环境条件，这些条件由执行算法的计算机决定。例如，有
    CPU、总线和内存芯片，但这些都是非常具体的的关系，与当前算法无关，也不是可以用于比较算法的关系。


    具体来说，上述分析表明，并不意外，在大数组中搜索比在小数组中搜索成本更高，分析也表明成本是随线性函数增长的。


    在分析中，我确定了三个复杂度标准，它们通常与算法时间复杂度的分析相关。这三个标准可能都不同，也可能都相同，但通常你只对平均复杂度感兴趣，而且你通常只陈述算法时间复杂度的一个标准，即平均复杂度。


