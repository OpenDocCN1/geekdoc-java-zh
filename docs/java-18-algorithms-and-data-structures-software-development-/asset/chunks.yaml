    方法从栈中弹出元素，栈顶的元素就是迭代器应该返回的元素。在进入节点的右子树之前，你再次尽可能向左走，并将相应的节点推入栈中。另外两个遍历迭代器在原理上的实现方式相同，然而，后序遍历需要额外的努力，因为你需要将同一个节点多次放入栈中，因此需要统计一个节点被放入栈的次数。这个问题通过一个封装了带有计数器的节点的包装器来解决。


