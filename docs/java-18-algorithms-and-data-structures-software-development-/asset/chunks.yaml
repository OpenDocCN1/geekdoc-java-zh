    # Java 18: 算法与数据结构


    ## 软件开发


    ### Poul Klausen

    Java 18: 算法与数据结构：软件开发

    第一版

    © 2018 Poul Klausen & [bookboon.com](http://bookboon.com)

    ISBN 978-87-403-2616-1

    Ove Thomsen, EA Dania 同行评审


    ## 前言


    本书是 Java 软件开发系列丛书中的第十八本。本书要求读者具备 Java 和系统开发的基础知识，特别是需要掌握在 `Java 3` 和 `Java 4`
    书中介绍的面向对象编程原理。本书重点关注算法，并介绍了若干经典算法，但结合算法，首要目标是介绍算法分析，从而让读者能够比较和评估各种算法的复杂度。此外，本书还处理了列表和树等经典数据结构，并展示了如何在
    `Java` 中实现这些数据结构。在展示许多经典数据结构的实现并讨论相关算法之外，本书还介绍了一些对于作为专业软件开发人员有用或必须的编程技术。


    正如标题所示，这一系列书籍涉及软件开发，目标是教导读者如何在 `Java` 中开发应用程序。可以通过阅读相关主题和学习完整的示例程序来掌握，但最重要的是通过亲身实践并从零开始编写自己的程序。因此，书中的重要部分是练习和问题，读者必须编写出与书中处理内容对应的程序。该系列中的所有书籍都围绕同一个骨架构建，由正文、示例、练习和问题组成，这些内容被自然地安排在正文中。练习（exercises）与问题（problems）的区别在于，练习很大程度上侧重于文中内容的重复，并且对要做什么描述得相对准确；而问题的描述则较为松散，通常规模大一些，且很少有明确的完美解。这些书应该是从头到尾通读的，但其中大量的代码示例（包括练习和问题）起着核心作用，读者详细研究许多示例代码，并解决练习和问题，或者只是研究推荐的解决方案是至关重要的。


    所有书籍都以一两个较大的示例程序结束，重点主要关注过程以及对程序是如何编写的解释。另一方面，代码只在有限范围内出现——如果出现的话——读者应该通过在测试程序时来学习完成的程序代码。除了展示比其他示例更大的程序开发过程外，结尾示例的目的还在于展示来自不同应用领域的程序示例。


    大多数书籍还以一个附录结束，处理书中未涉及的主题。这可能是关于软件安装问题或其他计算机技术中的主题，这些主题不属于软件开发，但是是必要的介绍性知识。如果读者已经熟悉该主题，可以跳过当前的附录。


    编程语言如前所述是 `Java`，此外，书中还使用了以下产品：


    1. `NetBeans` 作为应用程序开发的 IDE

    2. `MySQL`，在需要数据库服务器时使用（从 `Java 6` 书及开始）

    3. `GlassFish` 作为 Web 服务器和应用服务器（从 `Java 11` 及及开始）

    4. `Android Studio`，一个用于开发移动手机 App 的工具


    这些产品都是免费且可免费安装的，书中甚至提到了有些产品的安装可以全自动完成，而不需要费大的精力和挑战。此外，网上还提供了针对这三个所有产品的详细安装说明。这些产品可以在
    Windows 和 Linux 上运行，因此无论你使用 Linux 还是 Windows，都不会产生特殊影响。


    所有示例程序均在运行 `Linux` 的机器上开发和测试。事实上，这并不起主要作用，因为无论平台是哪一个，`Java` 和其他产品的工作方式都是完全相同的。书中某些地方可能会看到平台是
    `Linux`，这主要适用于涉及文件系统的命令。其他情况下，程序在 `Linux` 机器上开发对读者来说没有意义，它们也可以立即在 Windows 下运行，除非程序引用了文件系统且在那种情况下需要更改文件名。


    最后，简要说明一下这些书不是什么。它们不是 `Java` 的“如何编写”指南，或者说不是参考手册，而是正如标题所示，是关于软件开发的书籍。我希望读者在阅读这些书籍并通过许多示例，可以找到关于编写良好程序的灵感，同时将其作为资源集，其中包含许多解决你作为软件开发人员经常面对的具体日常编程问题的示例。


    ## 1 引言


    ADT 代表`抽象数据类型`（你也可以将其理解为通用集合），本书主要处理如何在 `java` 中实现列表、映射（maps）等经典集合。在书中，我更想谈论`数据结构`而非集合。数据结构必须通过实现才能发挥作用，因此算法起着重要作用，接下来的内容将同时关注数据结构和算法。


    你经常听说编程很难学，这确实没错。至少有很多人放弃了，但更多是因为许多人没有发现编程非常有趣，而不是因为困难，事实上，它已经比以前更简单了。随着新编程语言的出现，它变得更容易了，因为你需要写的代码更少，并在某种程度上导致了更健壮的程序，因为语言提供了比以前更丰富的工具箱。相反，创建程序的要求也随之增长，而对于程序员来说，挑战实际上是相同的，即能够编写良好的算法来解决特定问题。


    事实上，我应该从算法开始我的编程历史，因为这才是核心所在。一个人应该擅长算法才能成为优秀的程序员，但光靠此是不够的，另一个重要的因素是动力，包括对编程和软件开发的渴望。


