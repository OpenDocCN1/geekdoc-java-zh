    the nodes references `prev` and `next` instead of `left` and `right`. Since these
    names do not lead to significant problems regarding understanding, I will not
    introduce a new node type and also use `DoubleNode<T>` in conjunction with binary
    trees.


    The interface `IBinTree<T>` defines a binary tree with the basic methods and properties
    and hence properties that all binary trees must have:

