    ## 7.3 Balanced binary trees


    All uses of binary trees build in practice on a binary search tree (or a tree
    derived from a binary search tree). The tree has two very important features:


    1.  The search time for an element is (as mentioned) logarithmic.


    2.  An in-order traversing of the tree passes through the elements in ascending
    order.


    Here, however, the first one is not necessarily correct. Suppose, for example,
    you inserts the elements


    A B C D E F


    in this order. The result is still a binary search tree, but it is a degenerated
    tree that has the same characteristic as a list:


    ![](image/Image3352.jpg)


    It is said that the tree is totally unbalanced. The result is for example, that
    *contains()* gets linear complexity, and the whole idea of a binary tree is thus
    lost. Therefore, it is necessary to make a few changes that ensure that the tree
    does not work out as illustrated above. The tree must be balanced and therefore
    insertion and deletion must be done in such a way that the tree after the operation
    is balanced. I want to show two approaches that define a specialized search tree,
    which is called an AVL tree, a red-black tree, where I first (in space consideration)
    will treat a red-black tree in the next book. But first a few more definitions.
    A binary tree, where all levels are filled up, is called a *full binary tree*:


    ![](image/Image3359.jpg)


    If all levels near the bottom are filled up and the bottom is filled up from the
    left, one talks about a *complete binary tree*:


    ![](image/Image3367.jpg)


    A binary tree is called balanced if it applies to any node that the difference
    between the number of nodes in the left sub-tree and the number of nodes in the
    right-sub tree is at most 1:


    ![](image/Image3376.jpg)


    In order for the operations on a binary search tree to have logarithmic complexity,
    the tree must be balanced or at least fairly balanced, and in the next section
    I would like to show a balanced binary tree. The idea is to insert (and delete)
    elements as described by the binary search tree. The result may then be a binary
    tree that is not balanced, and the task is to restore the balance using special
    operations, called rotations.


    ## 7.4 An AVL tree


