    Note that it also applies to the special case where `n` is 0. The last algorithm
    is the best. The first version solves the problem using a loop, and if `n` is
    large, it will lead to many operations (more, maybe simple operations has to be
    performed for each repeat of the loop). In contrast, the last algorithm can solve
    the problem by only two calculations, which is far more efficient, and in addition,
    the algorithm is independent of the size of the problem – it does not depend on
    the size of `n`. It is said that the last algorithm has constant time complexity.


    Note, in the case where `a` = 1 and `d` = 1, the algorithm determines the sum


    ![](image/Java_18_-_Algorithms_and_data_structures_29-10-18_For_code_19.jpg)


    In this case, the difference between the two algorithms will only be measurable
    if `n` is large, but the example shows first that a problem can often be solved
    with very different algorithms and secondly that different algorithms are not
    equally beneficial for using the machine’s resources. It is a goal to write algorithms
    that are as effective as possible, and that is, algorithms that minimize the resource
    consumption.


