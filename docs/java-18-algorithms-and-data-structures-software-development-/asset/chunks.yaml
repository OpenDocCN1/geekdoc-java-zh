    implemented in Java. The most important algorithms and data structures have been
    added to a class library called *palib*, and this library is used by the book’s
    examples.


    The book is generally divided into two parts, the first part deals with algorithms,
    while the other part deals with data structures, but since the implementation
    of data structures is just about algorithms, one can also think of the entire
    book as a book on algorithms.


    The goal of the first part about algorithms (the next 4 chapters) is to provide
    examples of some classic algorithms, including special algorithms for search and
    sorting. In addition, an introduction is given to how to ensure that an algorithm
    is correct and gives the right result, as well as an introduction to how to evaluate
    the effectiveness of algorithms in relation to each other.


    The second part of the book comprises 5 chapters and deals with data structures
    and collection classes, the most important of which is the implementation of lists
    and trees and in connection therewith a variety of algorithms. The implementation
    of some of these data structures is both complex and comprehensive, and the book
    primarily describes the principles, while the code must be searched in the book’s
    source files.


    The source code, like the other books, contains a number of examples, but the
    largest part is implementations of algorithms and data structures collected in
    the class library called *palib*, and most of the examples use this library. The
    same goes for most of the book’s exercises and tasks.


    # 2 The concept of algorithms


    An algorithm is a method that describes how to solve a problem through a final
    number of steps, and an algorithm is thus a solution that – usually from an input
    – solves a specific problem. Algorithms are formulated in an algorithm language
    where they can be expressed in a short and accurate way. A programming language
    is an example of an algorithm language, but it may often be easier to use a simpler
    language to be free from the many details of the programming language. In addition,
    many algorithms have a common nature in which a whole family of algorithms can
    be described from a common template. In addition to the programming language Java,
    this book does not use a formal algorithm language, but instead algorithms are
    sometimes described informally in a middle between common language and Java program
    code. In the following, I will typically describe algorithms informally using
    a common language and subsequently as finished algorithms in Java.


    As an example of an algorithm, I will look at an algorithm that raises a number
    *n* in the power of *p* – thus calculating ![](image/nn_sup_pp___1.jpg). This
    task (algorithm) can be described as follows:


    ![](image/Java_18_-_Algorithms_and_data_structures_29-10-18_For_code_11.jpg)


    The above is the informal version where the algorithm partially is written in
    Java, but I have not fully complied with the syntax of the language. The aim is
    to describe the solution method, but without having to deal with the many details
    of the programming language, and if you know a little about programming and Java,
    it is easy to understand what the above algorithm is doing.


    For all algorithms, you has to answer two questions:


    *   do it solve that task – is the algorithm correct?


    *   how good is the algorithm?


    The first is of course a requirement, while the other is a matter of quality.


    If *p* is negative, the algorithm gives result 1 (the loop will not be executed),
    which is incorrect. If *p* is 0, the result is also 1, which is correct. If *p*
    positive, the loop is performed, and for every iteration *p* is decremented with
    1 and the loop will exactly be repeated *p* times. For each repeat, *u* is multiplied
    with *n* and since *u* from start is 1, the value of *u* – when the loop stops
    – is *n* multiplied by itself *p* times and thus has the value ![](image/nn_sup_pp___1.jpg).
    That is that the algorithm gives the correct result, assuming that *p* is not
    negative. Wee say that ![](image/text18__2.jpg) is a precondition.


    With regard to the quality of the algorithm, it is a goal that the algorithm should
    use as few resources as possible:


    *   that it minimizes the consumption of memory and thus does not use more variables
    than necessary


    *   that it minimizes the consumption of the processor and thus does not perform
    more statements than necessary


    In this case, in addition to the input parameters *n* and *p* (the values the
    algorithm should be applied to), the algorithm uses a single variable for the
    result, and the important thing is that the requirement for memory is constant
    and independent of the two input parameters. Regarding the algorithm’s consumption
    of the processor, the number of instructions is determined by the number of times
    the loop repeats. That is, the number of instructions grows with the input parameter
    *p* so that the calculation for large values of *p* requires more instructions.
    In this case there is no problem in it – it is a quite effective algorithm, as
    it is limited how big *p* can be before an overflow occurs.


    The algorithm is formulated so that it is independent of the data type, but it
    is easy to convert the algorithm to Java, so it works on a specific type. It is
    a very simple algorithm, but it expresses a method that can be used when just
    p is a non negative integer and n is a type (a number) for which multiplication
    is defined. Thus, the algorithm is partially formulated independently of a specific
    data type. For example, if you would realize it in Java for integers, it could
    be written as:


    ![](image/Java_18_-_Algorithms_and_data_structures_29-10-18_For_code_13.jpg)


    Here, it is utilized that different constructions in the specific language allow
    for the expression of the algorithm in a simpler way, which one should of course
    use.'
