    this way and each time the size of the problem is halved. You are done when the
    element is found or the problem is trivial. Binary search is an example of a general
    problem solving technique, commonly called `divide and conquer`:


    Given a problem `P` is the technique: `P` is divided into a number of sub-problems
    ![](image/text18__68.jpg), each of which is simpler than the original problem
