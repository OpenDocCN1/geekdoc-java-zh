    Another sorting method is called selection sort. Here the array is traversed and
    the index is found on the smallest element. Once that has happened, the first
    element is replaced. The array is then traversed again, but only the last `n-1`
    elements are passed – the first one is put into place – and the index is found
    on the smallest element among the last `n-1` elements and it is replaced with
    the second element. Now the first two have been put in place. How to proceed.
    Each time you find the index on the smallest element that has not been put in
    place and it is placed. Each time the array to be passed becomes one element smaller.
    If the array is as above, you will find in the first pass the index for the number
    2:


    ![](image/Image2824.jpg)


    Then 11 and 2 are replaced:


    ![](image/Image2831.jpg)


    and now 2 are in place. You then repeat the operation, but only on the last 7
    elements, and you find the index for 3:


    ![](image/Image2841.jpg)


    Then 5 and 3 must be replaced:


    ![](image/Image2848.jpg)


    and the first two elements are in place. If you continue the process, you end
    after `n-1` repeats with a sorted array. The algorithm can be written in Java
    as follows:


    ![](image/Java_18_-_Algorithms_and_data_structures_29-10-18_For_code_77.jpg)


    It is easy to see that the algorithm is correct, and because it consists of two
    nested loops, it is similar to bubble sort an ![](image/text18__591.jpg) algorithm.
    The algorithm generally has the same advantages and disadvantages as bubble sort
    – both in terms of time and memory – and if I should mention an advantage, selection
    sort is, if possible, even easier to implement. If you make time measurements
    on the two algorithms, you will find that they behave in the same way (are both
    bad for large arrays), but bubble sort takes about twice as long as selection
    sort. The reason is that bubble sort tends to make too many exchanges.


    ## 4.3 Insertion sort


    A variant of the above is called `insertion sort`. Assume that the array is divided
    into a left part, which is sorted and a right part that is not sorted. You then
    take the first element in the right part and swap with the elements in the left
    part until the new element is in place – and the left part will still be sorted.
    Continue until you are finish. From the start it is assumed that a left part,
    which consists only of an element, is always sorted. If the example is as above:


    ![](image/Image2855.jpg)


    then you start with a left part, which contains only the element 11 and thus is
    sorted. You must put 5 in place in the left part:


    ![](image/Image2863.jpg)


    Now the left part consists of two elements, and the left part is sorted. As the
    next step, 19 must be put in place:


    ![](image/Image2870.jpg)


    but it’s simple for nothing should should happen. Now 3 has to be put into place
    in the left array, and in return, it requires that all elements in the left array
    must be moved:


    ![](image/Image2878.jpg)


    Next time, 13 will be in place, and it requires only a single exchange:


    ![](image/Image2885.jpg)


    If you continue, you end up with a sorted array. The algorithm can be implemented
    as:


    ![](image/Java_18_-_Algorithms_and_data_structures_29-10-18_For_code_78.jpg)![](image/Java_18_-_Algorithms_and_data_structures_29-10-18_For_code_79.jpg)


    The algorithm is not much other than a variation of selection sort and it is clear
    that it has the same characteristics. However, insertion sort is fast for arrays
    that are almost sorted as an item falls into place after a few exchanges.


    The above sorting algorithms primarily have theoretical interest and are good
    to get a grasp of how sorting is going on and how to write sorting algorithms.
    In the following, I will show three other sorting methods that are far more effective
    (and, on the other hand, much more complex) and thus have greater practical interest,
    but all sorting algorithms have a common nature that is about to loop over the
    array and all about to exchange the elements. The difference is primarily how
    clever you do it.


    The above algorithms all have an average time complexity that is ![](image/text18__591.jpg),
    and for large values of `n` (large arrays), the algorithms are too ineffective
    if not useless. However, you should not completely reject the algorithms in practice,
    as they as mentioned are simple to implement and are actually quite effective
    applied to small arrays.


    ## 4.4 Shell sort


    The next algorithm is called `shell sort`. It is characterized by being far more
    effective than the above algorithms, having constant memory complexity, but also
    being more difficult both to implement and to review.


    The idea is to divide the array into a number of sub-arrays called segments. Each
    of these segments is then sorted by one of the above methods, utilizing their
    effectiveness on small arrays. Once that is done, the process is repeated, but
    this time with fewer and larger segments, and here, utilizing that a method like
    insertion sort is effective if the array is already almost sorted. The process
    repeats until there is only one segment. The first problem is to select the number
    of segments that are determined by the following sequence:


    ![](image/text18__61.jpg)


    ![](image/text18__62.jpg)


    ![](image/text18__63.jpg)


