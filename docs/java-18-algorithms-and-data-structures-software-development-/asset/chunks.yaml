    # 4 排序


    在本章中，我将提到一组用于排序集合的算法，作为集合的示例，我将到处使用数组。我将查看以下算法：


    *   冒泡排序 ![](img/text18__56.jpg)

    *   选择排序 ![](img/text18__56.jpg)

    *   插入排序 ![](img/text18__56.jpg)

    *   壳排序 ![](img/text18__57.jpg)

    *   合并排序 ![](img/text18__58.jpg)

    *   快速排序 ![](img/text18__58.jpg)


    从它们的时间复杂度可以看出，它们在效率上差异很大。在实践中，最后两种使用最广泛。


    ## 4.1 冒泡排序


    我在上面已经提到了这个算法，所以接下来的有些重复，但首先简单介绍一下冒泡排序是如何工作的（以及如何实现）。如果你有一个数组


    ![](img/Image2801.jpg)


    那么你从后到前遍历数组。对于每一轮，你执行一个从开始到箭头指向位置的内部循环。如果你在这次迭代中遇到一个比其后继项大的项，就交换它们。也就是说，将 11 变为
    5，将 19 交换为 3，然后是 13，然后是 2、7，最后是 17：


    ![](img/text18__47.jpg)

