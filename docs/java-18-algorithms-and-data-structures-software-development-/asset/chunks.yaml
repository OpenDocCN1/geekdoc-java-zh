  trans: '


    一个经典问题是在数组中搜索元素。如果你对数组元素的排序方式一无所知，那么你所能做的最多就是进行线性搜索，即从开始处，从头到尾遍历数组，并将每个元素与要搜索的内容进行比较。该过程可以用以下算法表示，其中你在数组
    `arr` 中搜索元素 `elem`：


    ![](img/Java_18_-_Algorithms_and_data_structures_29-10-18_For_code_24.jpg)


    注意该算法是如何通过搜索整个数组来工作的。如果你找到了该元素，任务就完成了，算法可以带上“找到元素”的消息终止。如果你运行完了循环，说明该元素不存在，你可以以“元素不存在”的消息结束。在最坏的情况下，你必须访问所有元素才能确定某个元素不可用。


    在 `Java` 中实现线性搜索非常简单。下面是一个通用的搜索方法，用于在数组中搜索元素。如果元素存在，该方法返回该元素在数组中的索引。如果未找到元素，该方法返回
    -1（这不一定是一个索引）作为未找到元素的指示。


    ![](img/Java_18_-_Algorithms_and_data_structures_29-10-18_For_code_25.jpg)


    你应该注意，参数类型 `T` 的唯一要求是该类型实现了具有值语义的 `equals()`。还需要注意，如果多次找到同一个元素，该方法返回第一个元素（索引最小的元素）的索引。


    `linSearch()` 方法定义为类 `Tools` 中的 `static` 方法，而 `Tools` 是名为 `palib` 的类库中的类。这个类库将包含本书（以及下一本书）中介绍的更多方法和类，目标是编写一些工具类，作为
    `java.util` 包中相应实现方法和类的替代品。


    线性搜索是一种广泛使用的搜索算法，当数组较小或你对数组中的元素一无所知时，通常会使用它。然而，如果你知道要搜索的数组已经排序，你可以使用 `binary search`（二分查找）做得更好。该算法如下：


    ![](img/Java_18_-_Algorithms_and_data_structures_29-10-18_For_code_251.jpg)


    该算法的思想是：对于每次重复，你将待搜索的元素数量减半，这样你就能快速完成。实现该算法的主要问题在于控制搜索的数组子集。这个问题可以使用两个索引 `a` 和
    `b` 来解决，它们分别引用子集的左端和右端点：


    ![](img/Java_18_-_Algorithms_and_data_structures_29-10-18_For_code_26.jpg)


    在这里你应该注意以下几点：


    *   该方法是一个泛型方法，由于数组元素是可以排序的，因此参数类型实现了 `Comparable` 接口。

    *   二分查找只有在所搜索的数组已排序的情况下才有效，因此二分查找不能作为通用的搜索策略。

    *   从开始的 `a` 指向数组的第一个元素，`b` 指向最后一个元素，以及在未找到元素时，每次迭代中这些变量之一是如何变化的。

    *   该方法与相应的线性搜索方法类似，如果元素存在则返回元素的索引，否则返回 -1。如果找到多个元素，返回的是你遇到的第一个找到元素的索引。


    那么问题是，二分查找与线性搜索相比效果如何。二分查找不仅更好，而且是好得多，我稍后会在讨论算法复杂度时再次回到它的含义。现在并不是说你不使用线性搜索，在较小的数组中效率差异并不显著，但在大数组中，这种差异可能是巨大的。


    如果你观察二分查找算法，可以对其进行稍微重构：


    ![](img/Java_18_-_Algorithms_and_data_structures_29-10-18_For_code_261.jpg)


    该算法是递归的，你可以如下所示在 `Java` 中将二分查找写为递归方法：


    ![](img/Java_18_-_Algorithms_and_data_structures_29-10-18_For_code_27.jpg)


    递归方法需要两个额外的参数来定义搜索范围。但除此之外，没有什么需要解释的，它只是用 `Java` 编写的上述算法。


    为了获得与原始算法相同的接口，编写了一个只调用递归版本的方法版本。这意味着算法的使用方式是相同的，用户无法看到它是递归版本还是非递归版本。递归版本是 `private`
    的，因此它是一个私有辅助方法，单独引入该方法是为了给公有方法提供正确的参数。意识到这一点是有充分理由的，因为这种技术你将在后续中多次看到。这两个方法的公共版本被称为存根（stub）。


    如果你观察二分查找是如何通过每次迭代减半待搜索元素数量来工作的，只需重复相同的操作，但间隔是长度的一半，显然可以考虑递归实现。在这种情况下，递归解决方案没有优势。*Algorithms*
    项目有三个使用上述搜索算法的测试方法


    ## 2.4 斐波那契数


    第一个斐波那契数是 0，下一个是 1。然后下一个斐波那契数由前两个数之和生成。也就是说，它是一个数字序列：


    ![](img/Java_18_-_Algorithms_and_data_structures_29-10-18_For_code_28.jpg)


    形式上，你可以这样定义斐波那契数：


    ![](img/text18__10.jpg)


    因此这是一个递归定义。如果你想写一个返回第 `n` 个斐波那契数的方法，尝试使用递归方法是显而易见的，因为它是正式定义的直接复制：


    ![](img/Java_18_-_Algorithms_and_data_structures_29-10-18_For_code_281.jpg)


    注意该方法简单且易于理解。如果你尝试该方法，一切看起来立即良好，但如果你对输入参数 `n` 的大值尝试该方法，你会发现该方法变得非常慢并最终完全停止。原因是递归调的数量爆炸了，因为每个调用都会导致
    2 个新调用，而每个新调用再次产生两个新调用，以此此类推。


    问题并不是递归有什么问题，简单地在这种情况下递归不是解决方案，它也是一个例子，说明你应该始终考虑递归方法，因为很难发现其后果。如果你编写上述方法，它应该是迭代的，这同样简单，而且当你测试算法时，两种算法之间的效率差异非常明显。


    ![](img/Java_18_-_Algorithms_and_data_structures_29-10-18_For_code_29.jpg)


    *Algorithms 项目有两个测试方法——`test04()` 和 `test05()`——用于测试上述斐波那契数的算法。


    因此，斐波那契数是另一个例子，说明算法可以用多种方式编写，而且显而易见的往往最好的。顺便提一下，上一个迭代解决方案中使用的方法被称为动态规划，这是我将在本系列的下一书中讨论的主题。


