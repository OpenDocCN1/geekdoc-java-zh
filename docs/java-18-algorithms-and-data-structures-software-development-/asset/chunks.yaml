    `insert()` 方法用于根据当前排列插入元素，而其他插入方法不再适用。除了插入元素外，所有其他方法必须与 `DoubleList<T>` 类中的完全相同。


    `SortedList<T extends Comparable<T>>` 类实现了有序双链表，并由如下接口定义：


    ![](img/Java_18_-_Algorithms_and_data_structures_29-10-18_For_code_121.jpg)


