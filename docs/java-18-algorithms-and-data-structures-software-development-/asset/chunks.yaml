    # 3 算法分析


    一旦你写好了算法，会有两个突出的问题：


    1. 证明算法是正确的并解决当前任务

    2. 根据资源消耗评估算法的效率


    这两者都可以以多或少正式的方式进行。例如，在算法的正确性方面，通常可以使用归纳法证明的形式作为数学证据，但在其他语境下，更非正式的论证也可以解释算法的正确性。算法效率的分析也是如此。在接下来，我将展示这两种方法，但我想强调选择通常取决于语境。


    算法效率的分析涉及到资源的消耗，通常是时间和内存。目标是最小化这些资源。然而，人们应该始终意识到，这种计时取决于机器，在许多语境下，评估算法的整体性质更有意义。


    ## 3.1 线性搜索的复杂度


    为了展示算法分析的意义，我将查看上面讨论过的线性搜索。在最好的情况下，搜索的元素在第一次比较时就被找到。如果是这样，执行时间（也称为时间复杂度）就独立于数组的大小。可以说算法的最佳时间复杂度是常数。最佳时间复杂度不取决于搜索哪个数组，且每次都是相同的。我们写作最佳时间复杂度为
    `O(1)`。


    在最坏的情况下，你必须比较数组中的所有元素，如果数组有 `N` 个元素，你必须执行 `N` 次操作，其中操作包括将搜索的元素与数组特定位置的元素进行比较。在这种情况下，执行时间取决于数组的大小，因此执行时间随线性函数增长（因此得出了算法的名称）。可以说最坏时间复杂度与数组的大小呈线性关系，表示为
    `O(N)`。


