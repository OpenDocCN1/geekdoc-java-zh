    ## 2.2 Recursion


    Among other things, within mathematics, it is very common to define formulas and
    definitions recursively, where a formula is expressed by itself. For example you
    can define a difference series with difference `d` as follows:


    ![](image/text18__8.jpg)


    Another example is the formula for a factorial


    ![](image/text18__9.jpg)


    where the term is just expressed by itself: If you know `(n-1)!` can you also
    decide `n!`, and when `0!` is known, one can decide `1!` and then you can decide
    `2!` and then again `3!` etc.


    If you want to write an algorithm that can determine `n!`, You can immediately
    apply the above formula:


    ![](image/Java_18_-_Algorithms_and_data_structures_29-10-18_For_code_20.jpg)


    Note that the algorithm is a direct rewriting of the mathematical definition,
    and the crucial thing is that the algorithm is written by itself – the algorithm
    calls itself, and an algorithm that calls itself is called recursive algorithm.


    In Java, an algorithm is written as a method, and a method can, for example, call
    another method, and especially itself. Thus, Java supports recursion, and the
    algorithm can therefore be implemented directly as follows:


    ![](image/Java_18_-_Algorithms_and_data_structures_29-10-18_For_code_201.jpg)


    Recursive algorithms are often simpler than a corresponding non-recursive algorithm
    (also called an iterative algorithm) solving the same problem, but it is often
    more difficult to find out where a recursive algorithm is correct. In this case,
    however, it is easy because the algorithm is merely a copy of the mathematical
    definition.


    It is also possible (easy) to implement the algorithm to determine the factorial
    without the use of recursion – thus as an iterative algorithm:


    ![](image/Java_18_-_Algorithms_and_data_structures_29-10-18_For_code_21.jpg)


    and also here it is easy to consider that the algorithm works and gives the correct
    result. In this case, the difference is not very clear, but actually the last
    one is more effective than the first one, as it uses less memory: Each time an
    algorithm calls itself, parameters need to be transferred and it takes memory
    and it takes time. Below is illustrated what happens if you use the recursive
    version of `factorial()` to determine the factorial of 5. The boxes are or illustrate
    activation blocks on the stack, and only when you reach the bottom and determine
    the last value for `0!`, the calls begin to return and thus release the activation
    blocks.


    ![](image/Image1851.jpg)


    In the vast majority of cases, it does not matter, but generally, an iterative
    algorithm will use less memory than a recursive.


    There is always reason to be aware of what recursion means and below I will show
    an example where recursion is immediately the natural choice but where it’s definitely
    the wrong choice and one ends with an algorithm that’s so ineffective that it
    is unusable for large input values.


    The advantage of recursion is rarely about ever efficiency, but instead of writing
    the algorithm shorter and sometimes also more readable. In fact, I will later
    show examples of algorithms that are difficult to write iterative, but where recursive
    solutions are both short and easy to understand.


    As a last remark, there are many who find that recursion is difficult and that
    it is difficult to write and read. You have to write a method that has a string
    as parameter and the method should returns the string with reverse order. That
    is, if the method is called with the string `ABCD` as parameter, it should return
    `DCBA`. The problem can of course be solved iterative with a loop that iterates
    from behind the string, but you can also write the solution recursively as:


    ![](image/Java_18_-_Algorithms_and_data_structures_29-10-18_For_code_23.jpg)


    Again, it is an example of an algorithm where recursion has no advantage, but
    the example shows shows how algorithms typically look. The algorithm consists
    of two parts, the first one being simple and can be immediately solve the problem
    (here it is the case if the string is empty). The other is the general case where
    the problem is solved using the algorithm itself, but applied to a smaller problem
    than the original – in this case `swap()`.


    The method that tests if a string is a palindrome must be written as a recursive
    method:


    *   If you have the simple and trivial case where the string is empty or simply
    consists of a single character, it is a palindrome.

    *   Otherwise, if the first character should be ignored, then the remaining characters
    should be tested for a palindrome.

    *   Otherwise, if the last character should be ignored, almost the other characters
    should be tested for a palindrome.

    *   Else, if the first and last characters are the same, then the rest of the
    string is tested for a palindrome.


