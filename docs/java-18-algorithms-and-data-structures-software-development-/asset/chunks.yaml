    If you do not know what elements the array contains, you should expect to search
    halfway through the array – you can not know if the element you are looking for
    is to be searched at the beginning or end – and if you have an array with `N`
    elements, you must expect to perform `½N` operations. It is still a linear function
    of the array size (just with a smaller increase), and the algorithm therefore
    also has an average time complexity that is `O(N)`.


    The above is an analysis of the algorithm’s time complexity, which has resulted
    in three complexities:


    * best time complexity: `O(1)`

    * average time complexity: `O(N)`

    * worst time complexity: `O(N)`


    It is important to note that complexity measures do not specify specific numbers
    regarding the execution time of an algorithm and how long it takes to perform
    a corresponding program but only tell you how an algorithm behaves as a function
    of one or more input parameters – here the array size. Complexity measures can
    be used to compare algorithms and to determine if one algorithm for solving a
    problem is better than another.


    The execution time of an algorithm naturally depends on other factors than what
    appears from the above analysis. For example, time is used to transfer parameters
    and create variables, but all this is something that has a constant amount of
    time and does not depend on the size of the array. It does not change the overall
    principle of how the algorithm behaves for different sizes of input parameters.
    There are also environmental conditions that affect the execution time and are
    determined by the computer that performs the algorithm. Here, for example, there
    are CPU, bus and memory chips, but it’s all very specific relationships that do
    not have anything to do with the current algorithm, and not relationships that
    can be used to compare algorithms.


    Specifically, the above analysis says that it is, not surprising, more costly
    to search in a large array than a smaller, and the analysis also says that the
    price grows as a linear function.


    In the analysis, I have determined three complexity measures, which are often
    associated with an analysis of an algorithm’s time complexity. The three measures
    can all be different, or they may all be the same, but often you are only interested
    in the average complexity, and you often only state one measure of an algorithm’s
    time complexity, and that’s the average complexity.


    ## 3.2 The complexity of binary search


    An algorithm is a solution to a problem, and there are often more algorithms that
    solve the same problem. If you look at the above problem to search an element
    in an array and if you do not know in advance what elements the array contains,
    you can not do much more than apply linear search, but if, for example, you know
    that the array is already sorted, you can do better with binary search.


    Suppose you have the following array:


    ![](image/Image1858.jpg)


    there is a sorted array and suppose you will search for the number 13 Instead
