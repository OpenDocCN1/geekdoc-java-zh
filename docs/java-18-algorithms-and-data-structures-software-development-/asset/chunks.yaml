    ## 4.4 Shell sort


    The next algorithm is called shell sort. It is characterized by being far more
    effective than the above algorithms, having constant memory complexity, but also
    being more difficult both to implement and to review.


    The idea is to divide the array into a number of sub-arrays called segments. Each
    of these segments is then sorted by one of the above methods, utilizing their
    effectiveness on small arrays. Once that is done, the process is repeated, but
    this time with fewer and larger segments, and here, utilizing that a method like
    insertion sort is effective if the array is already almost sorted. The process
    repeats until there is only one segment. The first problem is to select the number
    of segments that are determined by the following sequence:


    ![](image/text18__61.jpg)


    that is 1, 3, 7, 15, 31, 63, 127,…. Note that


    ![](image/text18__62.jpg)


    and thus it is easy to determine the number of segments for the next iteration.
    Also note that the sequence is essentially doubling, and thus it is a sequence
    that grows fast.


    If there are *n* elements to be sorted, the number of segments is the largest
    value from the sequence that is less than or equal to *n*. For example, if there
    are *a* segments, the segments are defined as follows:


    0th segment: t[0], t[a], t[2a], t[3a],….


    1th segment: t[1], t[a+1], t[2a+1], t[3a+1], ….


    ……..


    *i*th segment: t[i ], t[a+i], t[2a+i], t[3a+i], ……


    ………


    (*a-1*)th segment: t[a-1], t[2a-1], t[3a-1], t[4a-1], ….


    If there are k elements in the *i*th segment, then


    ![](image/text18__63.jpg)


    The above segments are sorted for example with insertion sort. In practice, it
    may be a bit complex, as the segment does not consist of continuous elements,
    so you need to control the indexing. In the next repeat, the number of segments
    is set to *(a* – *1) / 2*, which is the previous item in the above sequence, and
    the repeat continues until the number of segments is 0.


    Suppose that the following array is given:


    ![](image/Image2893.jpg)


    Since there are *n* = 14 elements, there are 7 segments (the next number in the
    sequence is 15, which is greater than *n*). The contents of the segments are:


    0\. segment: arr[0], arr[7] 41, 17


    1\. segment: arr[1], arr[8] 11, 31


    2\. segment: arr[2], arr[9] 29, 5


    3\. segment: arr[3], arr[10] 3, 19


    4\. segment: arr[4], arr[11] 37, 43


    5\. segment: arr[5], arr[12] 2, 13


    6\. segment: arr[6], arr[13] 7, 23


    Now, each segment is sorted, which is easy, since each segment (in this case)
    has only 2 elements:


    ![](image/Image2902.jpg)


    Note that there are actually only two places that have been replaced. Also note
