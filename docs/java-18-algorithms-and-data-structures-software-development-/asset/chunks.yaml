    # 8 堆 (Heap)


    堆（Heap）是一种在某种程度上类似于栈和队列的数据结构，因此你基本上可以执行两种操作：


    1. `add()`：将元素添加到数据结构中

    2. `remove()`：返回并移除数据结构中的最小元素


    由此可以立即推导出，堆是一个有序的数据结构，以便其元素可以进行比较。


    堆可以组织为满足以下两个额外特征的二叉树：


    1. 它是一棵完全二叉树。

    2. 任意节点都小于或等于它的子节点。


    例如，以下数据被组织为一个堆：


    ![](img/Image3609.jpg)


    特别注意，对于所有节点，它的子节点要么为空（null），要么其值大于（父）节点。它也是一棵完全二叉树，因为第 1 层填满了，而第 2 层从左侧开始填充。例如，如果
    47 是 31 的右孩子，它将不是一棵完全二叉树。


    由于堆以这种方式像二叉树一样组织元素，有时也称之为二叉堆（binary heap）。


    如果你想向堆中插入一个新元素，可以通过一个新节点扩展树：


    ![](img/Image3617.jpg)


    注意它仍然是一棵完全树。你现在从名为 `current` 的新节点开始并在树中向上移动。每一步，你都查看父节点。如果它大于要插入的新元素，则交换父节点与 `current`
    的值，即 `current` 向上移动一级。当父节点的值小于或等于新值时，过程停止，并将新值存储在 `current` 指向的地方。例如，假设新元素是 19。在移动元素并把
    19 插入 `current` 后，如下图所示：


    ![](img/Image3624.jpg)


    下面是如果你也插入元素 7 时，堆的样子：


    ![](img/Image3632.jpg)


    当然，注意较低的一层可能会被填满，此时你就有一棵满二叉树了。如果是这种情况，且如果你想插入另一个元素，树将增加另一层，但由于它仍然必须是一棵完全二叉树，你必须从左侧开始，为上一层最左侧的节点创建一个新的左孩子。还要注意，在插入新节点后，你必须向上查找树以找到新元素必须放置的节点。在最坏的情况下，你必须回到根节点，但如果你到达那里，新元素必须小于根节点，因此小于根节点的节点，该元素因此作为新根插入。这意味着最坏情况下你需要回到根节点，这意味着插入新元素的时间复杂度为
    `O(log (N))`。


    向堆中插入元素的结果如所示，最小元素始终位于根节点，因此实现 `remove()` 非常简单，因为它只需返回根节点的值。然而，问题在于确保移除根节点后树仍然是堆，这需要一个类似于插入的过程。


    在上面的示例中，`remove()` 返回 7，值为 59 的节点将消失。你从根节点开始并到最小孩子，这里是 13。由于它小于 59，它移动到根节点。你现在重复这个过程并到
    13 的最小孩子，即 17。由于它小于 59，17 向上移动一个位置（父节点指向的位置）：


    ![](img/Image3639.jpg)


    由于 `current`（值为 17 的节点）没有孩子，59 被放入此处：


    ![](img/Image3647.jpg)


    结果是一个堆：它是一棵完全二叉树，且每个节点的值小于或等于它的孩子（如果它们存在）。再次删除时，13 消失了，此时 31 被放入此处，结果是一个堆。删除时，你从根节点开始向下移动直到找到必须插入值的位置。最坏的情况下，你需要到达树的底部，因此时间复杂度为
    `O(log (N))`。除了 `add()` 和 `remove()`，堆还有其他操作，典型的示例包括：


    1. `peek()`：返回最小元素（但不移除它）

    2. `clear()`：删除堆的所有内容

    3. `getSize()`：返回堆中元素的数量


    你还可以实现一个迭代器以便遍历堆，这可以像通用二叉树一样通过多种方式完成，但层序遍历可能是最自然的选择。相应地，我将堆定义如下所示：


    ![](img/Java_18_-_Algorithms_and_data_structures_29-10-18_For_code_168.jpg)


    除了最后一个方法外，其他方法应该是自明易懂的。上面我定义的堆是每个节点小于或等于其孩子的树。这种堆有时被称为最小堆（minimum heap）。你当然也可以定义最大堆（maximum
    heap），即每个节点都大于或等于它的孩子，并且上述接口中的最后一个方法应指示应用于堆元素的顺序。


