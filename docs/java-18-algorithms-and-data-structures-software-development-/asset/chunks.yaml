    一个算法是正确的，如果它的方法部分在正确的先置条件下使用，并在正确的后置条件下给出预期的结果。此外，算法必须在有限的步骤后总是停止。后者只有在算法包含迭代时才会成为问题，而且通常，对算法正确性的论证仅在算法包含迭代时才有意义。在我目前为止看到的例子中，很容易判断出这些算法是正确的——也许除了欧几里得算法之外。为了更正式地证明算法的正确性，你可以将语句（也称为
    `assertions`，断言）与算法中的特定位置相关。它们表达了在这些地方必须为 `true` 的陈述，因此可以用来论证算法的正确性。断言原则上可以出现在算法的任何地方，但它们通常用于最感兴趣的选择和迭代中，在这种语境下它们被称为
    `invariants`（不变式）。观察幂算法，你可以引入以下 `invariant`（不变式）：


    ![](img/Java_18_-_Algorithms_and_data_structures_29-10-18_For_code_71.jpg)


