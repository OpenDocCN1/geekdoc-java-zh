    It uses `hashCode()`, and it is therefore a requirement that the parameter type
    `T` implements `hashCode()` with value semantics and thus also `equals()`. Also
    note that I’m using the absolute value because you can not be sure that the value
    of `hashCode()` is non-negative. Finally, note that the method returns modulus
    of the hash code, so the result is an index within the array boundaries. After
    the method `insert()` has determined the index, it tests whether the data structure
    already contains the object, and if so, the operation is ignored and the method
    returns false. If this is not the case, the fill rate is tested and if the insertion
    results in the fill rate exceeding the selected max, a rehashing is performed.
    It expands the array by doubling in the same way that I have previously seen in
    connection with an `ArrayList`. Finally, the element is added to the list in the
    array that the index indicates. In case of a collision, it means that the list
    will contain more elements, and the goal is to run with such a low fill rate that
    the number of elements in the lists is few and preferably only 1.


    The method `insert()` is relatively complex – at least if you also account for
    rehashing. Although the rehashing operation is complex and has linear complexity,
    it should only be performed occasionally, and in the same way with an `ArrayList`,
    the result is that `insert()` in the mean has a time complexity that is constant.
    That is, however, the condition that it is true that the lists have few elements,
    which are the same as few collisions.


