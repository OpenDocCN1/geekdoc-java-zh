    2\. segment: 5, 2, 31, 43


    Note that these segments are partially sorted. They are now sorted and the result
    is as follows:


    ![](image/Image2913.jpg)


    Next time there is only one segment and it is sorted:


    ![](image/Image2928.jpg)


