    ## Problem 5: Radix-sort


    *Radix-sort* is a sorting method that can be used to sort strings of the same
    length (think of the sorting of keys) and which in principle has linear time complexity.
    Suppose, for example, that you have 3-character keys that consist of digits, and
    an example might be the following:


    ![](image/Java_18_-_Algorithms_and_data_structures_29-10-18_For_code_1732.jpg)


    The idea is now to create a queue for each character that can occur, and in this
    case it is 10\. Next, you pass the array so that you place the numbers in the
    queues after the last digit, after which the numbers are moved back to the array
    by removing all elements from the queues. Then you repeat the process, but this
    time you place the numbers in the queues after the next last digit and continue
    until all digit positions are used. Then the array is sorted. With the above example,
    3 iterations must be used (the key length is 3) and after the 1\. iteration is
    the result:


    ![](image/Java_18_-_Algorithms_and_data_structures_29-10-18_For_code_1733.jpg)![](image/Java_18_-_Algorithms_and_data_structures_29-10-18_For_code_174.jpg)


    Next, the process is repeated, but where the numbers are placed in the queues
    after the middle digit:


    ![](image/Java_18_-_Algorithms_and_data_structures_29-10-18_For_code_1741.jpg)


    The last iteration places the numbers in the queues after the first digit:


    ![](image/Java_18_-_Algorithms_and_data_structures_29-10-18_For_code_1742.jpg)


    after which the array is sorted. You should note that the method assumes that
    the keys have the same length and that the method basically only works for strings,
    but the result is that you can sort an array using a number of queues – or by
    using a priority queue. Each iteration consists of a pass of the array, where
    the elements are distributed on the queues, which can be performed in linear time.
    The number of iterations is determined by the key length, and if it is the M and
    if there are N elements in the array, the method can be implemented as an *O(MN)*
    algorithm. Since M is constant and in practice is small, one can therefore perceive
    the algorithm as a linear time algorithm.


    You must write a program that you can call *RadixProgram*, which should sort an
    array of strings that represents fixed-length keys and where the individual characters
    are digits. The program must sort the array using radix-sort when using the class
    *PriorityQueue<String>*.


    When you tests the program, try comparing with, for example, quick sort and measure
    how long it takes to sort an array. Although quick sort has a poorer time complexity
    a radix-sort, you’ll probably find that quick sort wins. The reason is that radix-sort
    simply moves too much around the numbers.


