    ## 7.2 Binary search trees


    A binary search tree is a binary tree with an additional condition: For any node,
    its element is larger than all elements in the left sub-tree and less than all
    elements in the right sub-tree. If you consider the above example (beginning of
    section 8.1) of a binary tree, it is actually a binary search tree. In order to
    place elements in a binary search tree, the elements must be able to be arranged,
    and with Java terms, they should be comparable. I would assume that all elements
    in a binary search tree must be different, and in fact I have also requested it
    in the definition. It is not necessary and you can instead define the tree as
    follows: For any node, its element is greater than or equal to all elements in
    the left sub tree and less than all elements in the right sub tree (or: for any
    node its element is larger than all elements in the left sub tree and less than
    or equal to all elements in the right sub tree) and the implementation is primarily
    a matter on some places to use less than or equal to in instead of less than.
    However, in most practical applications, you are interested in search trees where
    an element may only occur once.


    The binary search tree is defined as follows:


    ![](image/Java_18_-_Algorithms_and_data_structures_29-10-18_For_code_137.jpg)


    A binary tree is *balanced* if it applies to any node that the left and right
    sub-tree “almost” has the same height. The task is to write a class `SearchTree<T>`,
    which inherits `ABinTree<T>` and implements the above methods, including the abstract
    method `contains()` from the base class. If the tree is reasonably balanced, all
    of these methods can be implemented with logarithmic time complexity, and that
    is exactly the goal of a binary tree. How to ensure that binary search tree is
    properly balanced is another question and is the subject of the next section,
    but if you think that the elements are added in random order, a binary search
    tree will often be quite well-balanced.


    Consider the binary tree again:


    ![](image/Image3306.jpg)


    Suppose you want to search for `G`. You starts in the root, and since `G` is smaller
    than `K`, you must look in the left sub-tree to K. Since `G` is larger than `D`,
    you should look in the right sub-tree to D. Since `G` is smaller than `H`, you
    has to look for the left sub-tree to H. Hereafter, the element has been found.
    The principle is, therefore, that you start in the root, and is that the element
    you are looking for, you are done. Otherwise, repeat the search, but either in
    the left or right sub-tree. This continues until you find the element or reach
    an empty tree. As with binary search, the principle is that the number of elements
    to be searched is halved every time, so it is an `O(log N)` algorithm – assuming
    that the tree is reasonably balanced.


    Inserting a new element goes a bit the same way. You start at the root and find
    out if the new element is to be inserted into the left or right sub-tree. If you
    have reached an empty sub-tree, you caninsert the element as a new node. Otherwise,
    repeat the process. Again, you look down in the tree until you find the node that
    the new node has to be a successor to, and insertion can therefore also be implemented
    as an `O(log N)` algorithm. For example, if you must insert `J` in the above tree,
    you get the tree below. The procedure is


    1.  start in K


    2.  go to D


    3.  go to H


    4.  insert J as a right child to H


    and the last operation corresponds to that the right sub-tree to `H` is empty,
    why the new element is inserted as a new leaf node to `H`.


    ![](image/Image3313.jpg)


    If you next want to insert `I` you must:


    1.  start at K


    2.  go to D


    3.  go to H


    4.  go to J


    5.  insert I as a child to J![](image/Image3321.jpg)


    It is thus relatively simple to implement the method `insert()` and the most important
    thing is to note that the method can be implemented with logarithmic time complexity.

