    nodes（子节点），人们说 `I` 和 `J` 是 `siblings`（兄弟节点）。同样地，`root` `A` 有 4 个子节点（`B`、`C`、`D`、`E`），它们都是兄弟节点。某些节点没有子节点，例如
    `H` 和 `K`。这类节点被称为 `leaf`（叶子）节点。每个节点还关联一个 `degree`（度），定义为孩子的数量。因此，`root` `A` 的度为
    4，而 `D` 的度为 1。注意，叶子节点的特征是度为 0。树的度应该理解为树中所有节点的最大度。因此，上述树的度为 4。每个节点还有一个高度（height），即从树的
    `root` 到该节点的路径长度。也就是说，`B` 的高度为 1，而 `K` 的高度为 3。树的高度应该理解为树中所有叶子节点的最大高度，上述树的深度为 3。有时你会用
    depth（深度）代替 level（层级），并说相同深度的节点在同一层。特别，人们说空树的高度为 -1，而只包含 `root` 的树高度为 0。树有几个简单的规则，例如，如果节点
    `N` 有父节点 `P`，那么：


    ```

    Depth(N) = Depth(P) + 1

    ```


    有时人们说从一个节点到其后继节点的线条是 edge（边）。由于每个节点（`root` 除外）都有唯一的前驱节点（从父节点到节点有一条唯一的线），你可以观察到，具有
    `n` 个节点的树的边数为 `n-1`。


    树在实践中出现在许多场景中，作为最广为人知的例子，可以考虑硬盘上的文件系统，其中文件存储在组织成树的文件夹中。其他例子包括零件列表，例如，XML 文档的元素也被组织成树。那么问题在于如何将树实现为一个集合类（collection
    class），这并不容易。要实现一个上文描述的通用树实际上非常困难，这将在下一书中首先处理。然而，有几种特殊的树，被称为 binary trees（二叉树），这是本章的主题，包括描述它们的主要特征，以及演示如何在
    Java 中实现它们。


    ## 7.1 Binary trees（二叉树）


    二叉树是棵度不超过 2 的树。这意味着对于一个给定的节点，子节点的数量不能超过 2。例如，下面展示了一个具有 10 个节点的二叉树：


    ![](img/Image3292.jpg)


    二叉树的特征是：它要么为空，要么由一个 `root` 和两个分别称为左子树和右子树的子树组成，其中每个子树都是二叉树（特别地可以是空的）。例如，`S` 是一个子树的
    `root`，`V` 也是如此。注意，该树有 4 个叶子节点，树的高度为 4（从 `K` 到 `X` 的路径是 4）。上述树的画法好像其元素有一个顺序，但在通用的二叉树中并非如此。


    在通用二叉树上执行的操作是有限的，事实上，除了作为具有更多结构的其他二叉树的基类外，你可以用通用二叉树的用途也是有限的。有些操作可以在通用二叉树上执行，实际上，有几种适用于二叉树的操作，其中一种是是确定树的高度。这里将二叉树的高度定义为树中所有叶子节点的最大深度，因此上述树的高度为
    4。具体来说，空树的高度计算为 -1，你可以通过以下方式确定二叉树的高度：


    ![](img/Java_18_-_Algorithms_and_data_structures_29-10-18_For_code_131.jpg)


    因此，树的高度可以通过 `degree` 算法来确定。注意，如果树只有一个节点，则结果为 0。其他几种操作涉及二叉树的遍历。经典上有三种方式，被称为 `in-order`（中序）、`pre-order`（前序）和
    `post-order`（后序）。`in-order` 遍历如下：你从根开始，然后按照以下模式递归：


    1. 遍历左子树（如果非空）

    2. 对根节点执行操作

    3. 遍历右子树（如果非空）


    这意味着在上述树中按以下顺序处理元素：


    B D G H K S


    `pre-order` 遍历使用相同的递归方法，但按照以下模式：


    1. 对根节点执行操作

    2. 遍历左子树（如果非空）

    3. 遍历右子树（如果非空）


    K D B H G S


    最后是 `post-order`：


    1. 遍历左子树（如果非空）

    2. 遍历右子树（如果非空）

    3. 对根节点执行操作


    B G H D P X


    也可以定义其他的遍历序列，但上述是最常用的。例如，你有时会遇到层序遍历（level order），即从左到右处理同一层的元素：


    K D S B H P V G X


    如所述，实现通用二叉树并不容易（可能也不有趣），但我想展示两个实现二叉树的接口和类。二叉树是以链式结构实现的，与链表的方式相同，其中节点必须包含数据元素以及对左、右子树的引用，起点可以是以下类型：


    ![](img/Java_18_-_Algorithms_and_data_structures_29-10-18_For_code_132.jpg)


    然而，它与 `DoubleNode<T>` 类型相同，只是该类型使用的节点引用 `prev` 和 `next` 代替了 `left` 和 `right`。由于这些名称在理解上没有引起显著问题，我不会引入新的节点类型，并将结合
    `DoubleNode<T>` 使用二叉树。


    `IBinTree<T>` 接口定义了二叉树的基本方法和属性，因此所有二叉树必须具备的属性如下：


