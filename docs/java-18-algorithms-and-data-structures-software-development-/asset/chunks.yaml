    另一种排序方法被称为选择排序。在这里，遍历数组并找到最小元素的索引。一旦完成此操作，第一个元素就会被替换。然后再次遍历数组，但只处理最后 `n-1` 个元素——第一个元素已经就位了——在最后
    `n-1` 个元素中找到最小元素的索引，并用它来替换第二个元素。现在，前两个元素已经就位了。如何继续呢？每次找到未就位元素最小元素的索引并将其放置。每次需要处理的数组都会少一个元素。如果数组如上所示，你将在第一次扫描中找到数字
    2 的索引：


    ![](img/Image2824.jpg)


    然后 11 和 2 将被替换：


    ![](img/Image2831.jpg)


    现在 2 已经就位。你随后重复该操作，但只对最后 7 个元素进行操作，你找到了 3 的索引：


    ![](img/Image2841.jpg)


    然后必须对 5 和 3 进行替换：


    ![](img/Image2848.jpg)


    前两个元素已经就位了。如果你继续这个过程，在重复 `n-1` 次后将得到一个排序后的数组。该算法可以用 Java 编写如下：


    ![](img/Java_18_-_Algorithms_and_data_structures_29-10-18_For_code_77.jpg)


    很容易看出该算法是正确的，而且因为它由两个嵌套循环组成，它与冒泡排序 ![](img/text18__591.jpg) 算法相似。该算法在时间和内存方面通常与冒泡排序具有相同的优缺点——如果非要提到一个优点，那么选择排序可能甚至比冒泡排序更容易实现。如果你对这两个算法进行时间测量，你会发现它们的行为相同（对大数组来说都很糟糕），但冒泡排序花费的时间大约是选择排序的两倍。原因是冒泡排序倾向于进行过多的交换。


    ## 4.3 插入排序


    上述方法的变体被称为 `插入排序`。假设数组被分为一个已排序的左部分和一个未排序的右部分。然后你取右部分的第一个元素，并将其与左部分的元素进行交换，直到新元素就位——此时左部分仍然保持排序。继续此操作直到完成。从开始假设，仅由一个元素的左部分始终是排序的。如果示例如上所示：


    ![](img/Image2855.jpg)


    那么你从一个仅包含元素 11 的左部分开始，因此它是排序的。你必须将 5 放入左部分：


    ![](img/Image2863.jpg)


    现在左部分包含两个元素，且左部分是排序的。作为下一步，必须将 19 放入：


    ![](img/Image2870.jpg)


    但很简单什么都不应该发生。现在必须将 3 放入左数组中，反过来，这意味着左数组中的所有元素都必须移动：


    ![](img/Image2878.jpg)


    下一次，13 将就位，只需要一次交换：


    ![](img/Image2885.jpg)


    如果你继续操作，将得到一个排序后的数组。该算法可以实现为：


    ![](img/Java_18_-_Algorithms_and_data_structures_29-10-18_For_code_78.jpg)![](img/Java_18_-_Algorithms_and_data_structures_29-10-18_For_code_79.jpg)


    该算法除了是选择排序的一种变体外没有太大区别，很显然它具有相同的特性。然而，插入排序对于几乎已经排序的数组非常快，因为元素在几次交换后就会就位。


    上述排序算法主要具有理论意义，有助于理解排序是如何运行的以及如何编写排序算法。在接下来，我将展示另外三种有效得多（另一方面也复杂得多）因此具有更大实际价值的排序方法，但所有排序算法都有一个共同点，即关于遍历数组和交换元素。区别主要在于你实现得有多巧妙。


    上述算法的平均时间复杂度都是 ![](img/text18__591.jpg)，对于较大的 `n` 值（大数组），这些算法的效率太低了，甚至可以说是毫无用处。然而，在实践中你不应该完全拒绝这些算法，因为正如提到的，它们易于实现，并且应用于小数组时实际上非常有效。


    ## 4.4 希排序


    下一种算法被称为 `希排序`。它的特点是比上述算法有效得多，具有常数内存复杂度，但在实现和审查上都更困难。


    其思想是将数组分成若干个称为段（segments）的子数组。这些段中的每一个段都使用上述方法之一进行排序，利用它们在小数组上的有效性。一旦完成，重复该过程，但这次使用更少且更大的段，这里利用了像插入排序这样的方法在数组已经几乎排序时是有效的特性。该过程重复直到只剩下一个段。第一个问题是选择段的数量，它由以下序列决定：


