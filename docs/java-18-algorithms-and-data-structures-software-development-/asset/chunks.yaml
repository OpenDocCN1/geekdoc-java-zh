    第一种是使用覆盖区域（overlay area）。对于数据结构来说，产生冲突的对象列表是以链表形式的。这种解决方案意味着无论是否发生冲突，你都可以以常数时间复杂度将对象插入数据结构中。如果你添加一个新对象并导致了冲突，那么该对象会被添加到覆盖区域中，由于两个操作都是常数时间复杂度，因此总操作的时间是常数。缺点无疑是数据结构中元素访问的开销会增加。基本上，是先计算位置，如果你没有通过正确的键找到该对象，就必须搜索覆盖区域。如果冲突很多，覆盖区域中的对象数量可能会很大，此时对元素的访问时间将具有线性时间复杂度。使用覆盖区域解决冲突问题是简单的，但反之访问时间可能会很长。然而，这种技术值得关注，因为它实际上是你在实践中通常使用的一种变体。


    另一种简单的方法是使用下一个可用空间，这种方法也称为线性探测（linear probing）。如果要插入一个对象且结果发生冲突，你就检查下一个位置，如果该位置可用，则将元素放置在那里。如果不可用，则再次尝试下一个，一直直到找到一个空闲为止。如果你在上面的邮政编码表中想要插入


    `7900, Nykøbing`


    你会得到结果：


    ![](img/Image3717.jpg)


    如果你进一步添加


    `6000, Kolding`


    它也必须放置在第 6 位，并导致冲突。然后尝试放在第 7 位，然后第 8 位，直到你在第 9 位找到一个空闲空间。线性探测的优点在于其原理易于实现，且不需要为覆盖区域准备任何额外的数据结构。另一方面，它一些显著的缺点。如果数组几乎填满，冲突会导致在找到空闲空间之前进行多次搜索，访问特定元素也是如此。另一个问题是很难在数据结构中删除一个对象，因为这会在冲突链中产生“空洞”。因此，删除必须通过标记一个已删除的对象来实现，而不是在物理上移除元素并释放空间。这必须结合某种形式的重新哈希（rehashing），并重新组织数据结构，从而释放被删除对象占的位置。


    对线性探测的研究还表明，该方法倾向于形成簇（clusters），即键指向一组索引，而另一些索引组则很少被使用。这很遗憾，因为这意味着冲突数量的增加。然而，可以通过使用平方探测（square
    probing）来改进该方法。其原理与线性探测相同，产生冲突的对象存储在与主对象相同的数组中。区别在于，位置不是通过不断取下一个来选择的，而是通过从以下序列获取索引：


    ![](img/text18__75.jpg)


    其中 `h` 是主哈希索引（键的哈希函数值），`n` 是数组大小。也就是说，如果发生冲突（空间 `h` 被占用），则尝试 `h + 1`，然后是 `h +
    4`，然后是空间 `h + 9`，依此类推。研究表明，平方探测比线性探测更好，且不会导致过多的冲突，但并不显而易见上述索引是否总能能找到一个空闲空间，即使数组没有满且没有进入循环。可以证明，如果数组大小是一个质数，且填充率（数组使用位置的比例）不超过
    50%，平方探测将始终提供解决方案。平方探测比线性探测好得多，但反过来，问题也是一样的，特别是移除元素的问题可能会在冲突链中产生空洞。最后，平方探测的实现并不十分简单。


    如上所述，你可以使用覆盖区域解决冲突问题。一种非常自然的改进是将覆盖区域绑定到数组中的每个位置。这样，每个元素都有它自己的冲突链，冲突链自然会变得更短，如果你有一个良好的哈希函数来均匀地分布对象，那么中间所有的冲突链将是相等的。这听起来可能像是一个昂贵的解决方案，因为数组中的每个空间都必须与列表（或类似结构）关联，事实确实如此，而且与平方探测相比，这种解决方案需要额外的内存，但可以通过其实现简单来抵消。在
    Java 中，你拥有像 `HashSet<T>` 和 `HashMap<K, T>` 这样基于哈希的集合类。它们之所以解决冲突问题，仅仅是因为每个位置都有它自己的冲突链。


    哈希结构内部是一个数组，因此它也有一个容量。如果你保存的对象超过了容量，结果将不可避免地产生冲突。相反，显而易见的是如果数组中的几乎所有位置都是可用的，冲突的概率非常小。因此，问题在于，在冲突变成问题之前，数组必须有多满，换句话说，填充率必须是多少。无论如何，如果填充率超过给定值，就有必要扩展数组的容量。正如我在结合
    `ArrayList` 时观察的那样，你可以使用数组翻倍的方法，这样如果填充率超过设置的最大值，你就可以增加数组容量。然而，这不仅仅是创建一个新数组并复制旧数组的问题，因为需要对所有对象进行重新哈希，由于数组的大小包含在索引计算中。这意味着在哈希结构中，你永远无法对单个对象的物理位置做出任何假设。


    ## 9.1 Hashing 类


    我想从一种使用哈希在数组中存储对象的数据结构开始。这是一个简单的数据结构，你基本上可以做其中的三件事：


    1. 你可以添加（保存）一个对象

    2. 你可以移除一个对象

    3. 你可以询问数据结构是否存在某个对象


    该类的定义如下：


    ![](img/Java_18_-_Algorithms_and_data_structures_29-10-18_For_code_183.jpg)[](image/Java_18_-_Algorithms_and_data_structures_29-10-18_For_code_184.jpg)


    这里的方法应该是自而易懂的，可能最后两个不是，它们分别读取和更改位于 0 到 1 之间的填充率值。接口由 `Hashing` 类实现：


    ![](img/Java_18_-_Algorithms_and_data_structures_29-10-18_For_code_184.jpg)


    第一个常量表示内部数组的大小。这里被设置为 11，但为了实际使用，选择一个较大的起始值是合理的。下一个变量是填充率，设置为 0.5，对应 50% 的填充率。设置得较低是为了减少冲突次数，在实践中我经常选择
    0.8。该变量上绑定了属性，这样如果你想实验填充率，就可以更改它。接下来是内部数组，它是一个列表数组。对于数组中的每个条目使用列表是有点昂贵的，特别是当填充率较低且冲突很少时，因此只对有元素的条目链接一个列表。最后一个变量是一个简单的计数器，用于跟踪数据结构中的元素数量。


    例如，我将展示 `insert()` 方法，它向数据结构中添加一个对象：


    ![](img/Java_18_-_Algorithms_and_data_structures_29-10-18_For_code_185.jpg)


    它使用一个辅助方法 `index()`，该方法返回对象在数组中的位置。

