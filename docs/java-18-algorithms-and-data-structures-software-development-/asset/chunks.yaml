    ## 5.2 ArrayList


    In practice, the most commonly used collection class is an `ArrayList` and in
    this section I will show how this class is implemented and why it is highly effective.


    Internally, an `ArrayList` is an array with place for a given number of elements,
    and the elements are thus stored in places from index 0 and forward. An `ArrayList`
    thus defines an arrangement of the elements based on their location or number/index.
    An `ArrayList` can not have holes. That is, if the list contains an element at
    place `n`, there are also elements at the places 0, 1, 2, …, n-1. An `ArrayList`
    may be empty if it contains no elements at all. You can think of an `ArrayList`
    as a data structure, that is an array of elements, and an internal pointer referring
    to the first available empty place:


    ![](image/Image3115.jpg)


    Here, there is room for 20 elements, while there currently are 8. The index `n`
    has thus the value 8, as where the next element has to be placed.


    An `ArrayList` is similar to other data structures characterized by its properties
    in terms of properties and methods, and an `ArrayList` basically provides the
    following operations:


    1. `add()` that adds an element to the end of the list

    2. `insert()` that inserts an element at a specific position in the list

    3. `remove()` that deletes an element with a specific index

    4. `get()` that returns an element with a specific index

    5. `getSize()` that returns the number of elements in the list


    There are three of the operations – `insert()`, `remove()` and `add()` – that
    require a more detailed explanation. If you insert an element in place `n`, all
    subsequent elements must be moved a place to the right so that there is room for
    the new element. For example, if you insert item 13 into the place with index
    4, the result will be the following:


    ![](image/Image122.jpg)


    If you delete the `n`th element, all subsequent elements must be moved a place
    to the left. If you delete the element with index 7, the result will be the following:


    ![](image/Image130.jpg)


    Looking at these two operations, they mean that the list must be moved and contains
    the list `N` elements, on average, `N/2` elements must be moved. That is, both
    operations have a time complexity that is `O(N)`.


    Then there is the method `add()` used to insert an element where the arrow points,
    and then move the arrow a position to the right. Thus, the operation does not
    depend on the number of elements and thus has constant time complexity, and it
    is even a simple operation. It’s at least true, as long as there is room, but
    if the list is filled up, there’s more to do. The strategy is to create a new
    array with double capacity and then copy the old array to the new, after which
    the old is left to the garbage collector.


    An extension consists of creating a new array and copying the content of the old
    array to the new array. This copy has linear time complexity, since it consists
    of a loop over an array and has the array `N` elements, the copy thus requires
    approximate `N` operations. Suppose an array contains exactly `N` elements. If
    you then perform the following operations:


    ![](image/Java_18_-_Algorithms_and_data_structures_29-10-18_For_code_102.jpg)


    then the first assignment will require `N` operations as the array is expanded,
    while each of the next `N-1` operations has constant time complexity as they do
    not require the array to be expanded. The average complexity of these `N` operations
    is then


    ![](image/text18__72.jpg)


    That is, that the `add()` operation in the average has constant time complexity
    and it is the whole idea of an `ArrayList`, that it is highly effective to add
    elements to the end of the list and the list automatically is expanded without
    involving the user. However, the price is use of memory.


    Above I have described how an `ArrayList` is expanded by doubling the array, but
    it is not a requirement, and several implementations use another factor. The result,
    however, is that constant time complexity of the method `add()`, and the choice
    is a weighing of performance in relation to memory consumption.


