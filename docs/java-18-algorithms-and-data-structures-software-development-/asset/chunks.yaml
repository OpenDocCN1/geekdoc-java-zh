    ## 6.4 A stack


    I have previously described the data structure a `Stack` as a LIFO structure,
    a data structure that basically have two operations `push()` and `pop()`. It’s
    a pretty simple data structure, but useful, and it’s similarly simple to implement.
    The only important decision is whether it should have a fixed size, or you should
    be able to put on the stack without thinking about the memory. Here I will look
    at a stack of the last kind and hence a data structure that can be defined as
    follows:


    ![](image/Java_18_-_Algorithms_and_data_structures_29-10-18_For_code_123.jpg)[](image/Java_18_-_Algorithms_and_data_structures_29-10-18_For_code_124.jpg)


    Such a stack can be immediately implemented as an enclosure of an `ArrayList`,
    and the class `ArrayStack<T>` is an example.


    ### Exercise 11: A stack of fixed size


    You must implement a stack with a fixed size. The interface must be as above except
    that there must now also be a method `isFull()` and the method `push()` can now
    raise an exception. You can implement the stack using a simple array, but this
    time there must be a constructor that specifies size.


    Once you have written the stack, you must create a stack for integers and room
    for 10 numbers in a test program. You must then iterate a loop where you push
    numbers on the stack until it is full. Next, you should similarly iterate a loop
    where you pop the stack and print the values until the stack is empty.


    ## 6.5 A queue


    A stack is a data structure or abstract data type that can be manipulated by two
    operations `push()` and `pop()`. It is a LIFO structure (Last In First Out), as
    the element removed from the stack with `pop()` is the last element put on the
    stack. A data structure that is very similar to a stack is a queue, but it is
    a FIFO structure (First In First Out). You can think of a queue as a sequence
    of objects with two references


    ![](image/Image3261.jpg)


    where `head` indicates the start of the queue while `tail` indicates the end of
    the queue. This is exactly the same as what I above have called a buffer and a
    class like `Buffer<T>` is a queue, and the difference is, among other things,
    that the operations are called something else:


    1. `enqueue()` that inserts an element at the end of the queue – after the element
    that `tail` points to

    2. `dequeue()` that removes the first or oldest element in the queue – the element
    that `head` points to


    As mentioned, a queue can be implemented as a `Buffer<T>`. Doing so, the queue
    has a capacity, by setting the size of the buffer when it is created. It is not
    always advisable or desirable that the queue has a fixed size, and if not, it
    is difficult to implement the queue using an array, such that the above operations
    get constant time complexity. However, you can implement the queue using a linked
    list, allowing you to expand the queue as needed, such that both insertion and
    deletion have constant time complexity. A queue can be defined as follows:


    ![](image/Java_18_-_Algorithms_and_data_structures_29-10-18_For_code_125.jpg)


    Note that the interface does not define the iterator pattern, for which there
    is no particular reason, but you can say that the basically it not the idea that
    you should be able to traverse the elements in a queue. Thus, it is a matter of
    choice whether it should be possible and Java’s implementation makes it possible.


    If you look at the class `SingleList<T>`, it has methods to delete the first element
    and to insert an element at the end of the list, and both with constant time complexity.
    You can therefore implement a queue as a class that wrapper a `SingleList`, what
    the class `Queue<T>` does.


    A priority queue is a queue where you can insert elements corresponding to a given
    priority, which means that you do not necessarily have to insert at the end of
    the queue. For example, if having the queue as shown above, it should be possible
    to insert an element between 5 and 7. All other operations should work as for
    a regular queue. I do not want to implement a priority queue here, as I can do
    better after I have presented another data structure, but in the following exercise
    you must write a class that seems like a priority queue, but not with the desired
    time complexity.


