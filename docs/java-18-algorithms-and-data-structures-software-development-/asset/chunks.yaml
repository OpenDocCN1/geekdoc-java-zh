  trans: '

    基本上来说，`Matrix` 是一个相当简单的数据结构，无多只是一个二维数组的封装，但其中一些操作很难以令人满意的复杂度实现，特别是 `SquareMatrix`
    类中的方法。我想从 `Matrix` 类开始，但首先对异常做一些说明。通常情况下，类的方法不会检查索引错误（index errors），在这里我让运行时系统（runtime
    system）处理错误。在类的方法检查错误的情况下，它们会抛出一个 `MathException`（这也是一种 `RuntimeException`），这通常由于对向量/矩阵进行了不兼容的操作引起的。因此，类的方法不需要
    `try/catch`。


    `matrix` 类可以定义如下：


    ![](img/Java_18_-_Algorithms_and_data_structures_29-10-18_For_code_198.jpg)


    并且基本上应该具有矩阵加法、减法以及矩阵与常数相乘的方法。此外，还添加了方法，分别用于向矩阵加上或减去一个常数（尽管这不是经典的矩阵操作）。最后，是两个矩阵的乘法，这一直是一个挑战，因为对于大小相近的矩阵，它们的复杂度为
    ![](img/text18__76.jpg)。实际上存在性能更好的算法，其中之一是 `Strassen algorithm`，它的复杂度约为 ![](img/text18__77.jpg)。首先，该算法的实现并不十分简单；其次，它只适用于方阵；第三，为了性能考虑，当你处理非常大的矩阵时才需要它。在考虑实现该算法之前，也许只需要像在
    `SquareMatrix` 类中进行重写（override）那样，甚至可以用于大矩阵。我只实现了经典形式的矩阵乘法，所以还有改进空间。其他其他矩阵乘法算法，它们具有更优的时间复杂度，但它们主要具有理论意义。


    与上述类似，`Matrix` 类的实现非常简单，只使用了简单的算法。`RowVector` 和 `ColVector` 两个类也是如此，这里不再需要进一步说明。


    然后是 `SquareMatrix` 类，它立即变得复杂起来。该类的存在是因为特定的矩阵操作只对方阵有意义，它主要关于计算矩阵的行列式以及确定矩阵的逆。这两个操作都是复杂的，这在代码中也有体现。实现这些操作有多种方法，但总体来说，基础定义提供的解决方案性能较差，因为行列式的定义是递归的。另一种方法是使用
    LU 分解，尽管我不想在这里描述该算法，但其步骤如下：


    如果你有一个方阵，你必须交换两行且不影响行列式，但你必须将结果乘以 ![](img/text18__78.jpg)，其中 `n` 是交换次数。允许将一行的倍数减去另一行，从而将方阵
    `A` 还原为三角矩阵 `U`，得到一个对角线下方所有坐标均为 0 的矩阵。行列式可以确定为对角线上所有坐标的乘积，乘以上述符号。这会导致许多计算，因此会给结果引入显著的不确定性，可以通过始终将行中最大值的坐标设为
    0 来部分修正。这对应于在过程中确定了对应隐式替换的行置换。当从某行减去另一行的倍数时，使用由特定位置赋值为 0 的减法次数决定的比例，所有这些比例可以收集在一个下三角矩阵
    `L` 中，其对角线为 0。对于两个矩阵 `L` 和 `U`，则 `A = L * U`。这两个矩阵被组合在一个公共矩阵 `LU = L + U` 中。该过程称为
    LU 分解，是一个相对复杂的过程，时间复杂度为 ![](img/text18__76.jpg)。


    如果你先执行 LU 分解，确定行列式就很简单，因为它只是对角线坐标的乘积。事实上，LU 分解由求解含有 `n` 个变量的 `n` 个方程组成，即求解矩阵方程
    `Ax = b`，其中 `x` 和 `b` 是列向量。因此，`SquareMatrix` 类还有一个 `solve()` 方法，可以用于此类方程组。事实上，它与其说是为了解方程，不如说是该方法可以立即用于确定逆矩阵。如果
    `v(i)` 表示一个在第 `i` 位上为 1 其余坐标为 0 的列向量，你可以将逆矩阵的第 `i` 列确定为 `A * x = v(i)` 的解，从而使用
    `solve()` 方法。


    `SquareMatrix` 类定义如下：


    ![](img/Java_18_-_Algorithms_and_data_structures_29-10-18_For_code_200.jpg)


    这三个变量的含义是，如果你已经执行了 LU 分解，那么在每次确定逆矩阵、求解线性方程或确定行列式时不需要都重新执行。当当前矩阵更改时，要失效 LU 矩阵，`SquareMatrix`
    类也是这样做的。


    ## 12.1 一个测试程序


    在我写完上述类之后，我写了一个名为 `Matrices` 的测试程序，可以用于测试上述的一些类。如果你运行该程序，将看到下面的窗口，其中创建了一个单个 3×3
    方阵。左侧有一个 `ListView` 显示已创建的矩阵概览，双击矩阵会打开一个显示矩阵值的 `TableView`。你也可以编辑这些值以获得具有特定值的矩阵。在
    `ListView` 组件顶部有一个输入字段和几个按钮。输入字段用于输入矩阵表达式，例如 `A + B`，点击 `OK` 将将表达式插入 `ListView`
    组件中，你可以通过双击表达式来查看结果（如果结果是矩阵）。注意，如果你打开多个矩阵，它们将出现在一个长行中。`ListView` 组件下方有三个按钮和一个组合框。最后一个用于指示显示结果时的小数。如果你编辑数组中的值（你只能编辑通过
    `Create` 按钮创建的矩阵），公式的值可能是错误的，这就是 `Recalc` 按钮的目标，它可以重新计算选中的公式。你可以使用 `Remove` 按钮删除所选矩阵的公式。


    ![](img/Image3732.jpg)


    最后，点击 `Create` 按钮你将得到以下窗口：


    ![](img/Image3740.jpg)


    你可以在其中创建一个新矩阵。如果点击 `Real numbers` 或 `Integers` 单选按钮，函数将在选定范围内创建一个随机矩阵。如果你点击底部的单选按钮获取零矩阵并点击
    `Identity`（仅在选择 `Square` 矩阵时可用），将得到对角线为 1 的单位矩阵。


    在表达式方面，该程序相对有限，但你可以输入现有矩阵名称和数值常数。你可以使用 +, –, 和 * 运算符以及括号。此外，你可以使用以下函数：


    - `DET(A)`：确定 `A` 的行列式

    - `INV(A)`：确定 `A` 的逆矩阵

    - `NORM(A)`：确定 `A` 的范数

    - `CON(A)`：确定 `A` 的条件数

    '
