    作为本书中的最后一种数据结构，我想介绍（并实现）一种映射（map）。它是一个包含键/值对（key/value pair）的集合，其中值（值属性）通过键来识别，因此类似于数据库中的表。映射可以定义如下：


    ![](img/Java_18_-_Algorithms_and_data_structures_29-10-18_For_code_193.jpg)


