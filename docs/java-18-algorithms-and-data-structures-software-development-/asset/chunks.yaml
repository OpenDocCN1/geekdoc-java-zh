    堆是一个完全二叉树。你现在可以将根节点放在位置 1，将根节点的子节点放在位置 2 和 3。然后你可以将根节点的孙子节点放在位置 4, 5, 6 和 7，接的一层（有
    8 个节点）可以被放在位置 8, 9, 10, 11, 12, 13, 14 和 15 上。也就是说，树的元素是按层排列在树中的，由于它是一棵完全树，这意味着树没有空隙。换句话说，你可以通过以下公式计算树节点的索引：


    ![](img/Image3667.jpg)


    例如，考虑以下完全二叉树：


    ![](img/Image3680.jpg)


    事实上，它是一个堆。它有四层，其中三层是满的，如果你用数组实现这棵树，你会得到如下结果：


    ![](img/Image3687.jpg)


    其核心思想是基于上述公式，你可以直接计算元素的父节点和子节点的位置。例如：


    1.  3 的右孩子在位置 `2 * 2 + 1 = 5`

    2.  5 的左孩子在位置 `2 * 3 = 6`

    3.  13 的父节点在位置 `11 ⁄ 2 = 5`


    通过这种方式实现完全二叉树，可以很容易实现堆。这在 `Heap` 类中完成。


    查看上面的图和 `Heap` 类，你可以发现我没有使用数组的第一个位置。原因是数组的实现和索引将变得更简单，从而产生更高效的实现。当然，你也可以这样做并从位置
    0 开始放置根节点，但这会导致索引计算变得更复杂，而且在原则上，代码效率更低。


    ## 8.2 堆排序


    如果你将数组中的元素插入到一个堆中，然后清空堆，结果将是数组被排序了。因此，你可以如下所示编写排序算法：


    ![](img/Java_18_-_Algorithms_and_data_structures_29-10-18_For_code_171.jpg)


    该方法在 `Tools` 类中实现。


    由于堆的插入和删除操作复杂度都是对数级的，因此算法的复杂度为 `O(N log (N))`，这与快速排序相同。然而，该方法主要具有理论意义。首先，时间测量将显示，在大多数情况下，该方法的效率低于快速排序；其次需要注意的是，它的内存复杂度并不理想，因为它基于堆，即数组的副本，这与归并排序的方式类似。


    ## 8.3 优先级队列


    作为堆的最后一个用途，我想提到优先级队列。我之前提到过队列的实现，并与之相关的，在关于优先级队列的问题实现中，也将其实现为队列的数组，其中队列的数量之前被定义为构造函数的参数。如果你考虑一个元素顺序由优先级决定的堆，那么从堆中移除元素将始终获得优先级最高的元素（优先级值最小的元素）。结果就是你得到了优先级队列。因此，你可以非常容易地将堆作为薄层封装来实现优先级队列。一个例子是
    `PriorityQueue<T>` 类，它实现了以下接口：


    ![](img/Java_18_-_Algorithms_and_data_structures_29-10-18_For_code_172.jpg)


    ## 练习 17：测试 Heap 类


    你必须编写一个名为 `HeapTester` 的程序，该程序有三个测试方法，可以测试 `Heap<T>` 类。


    第一个方法必须创建一个堆，并在其中随机插入 A 到 Z 的大写字母。接下来，该方法必须使用迭代器打印堆的内容，之后从堆中删除所有元素并再次打印内容。结果可能是：


    ![](img/Java_18_-_Algorithms_and_data_structures_29-10-18_For_code_1721.jpg)


    下一个方法必须创建一个包含 `N` 个元素的整数数组，并用随机整数初始化数组。接下来，该方法必须创建该数组的副本，然后必须测量使用 Java 的 `sort`
    方法和 `heapSort()` 分别排序这两个数组的时间。以毫秒为单位测量时间，结果可能是：


    ![](img/Java_18_-_Algorithms_and_data_structures_29-10-18_For_code_173.jpg)


    最后一个方法应该测试 `PriorityQueue<T>` 类。该方法首先必须向优先级队列中放入 10 个随机的三位数整数，此时优先级必须是数字的各位之和。接下来，该方法向队列中插入数字
    2, 3, 5 和 7，但不指定优先级。然后再次添加 10 个随机的三位数，其优先级仍然是各位之和。最后，该方法应该从队列中移除所有数字并打印结果，结果：


    ![](img/Java_18_-_Algorithms_and_data_structures_29-10-18_For_code_1731.jpg)


    ## 问题 5：基数排序


    `radix-sort` 是一种用于对相同长度字符串进行排序的方法，在原则上具有线性时间复杂度。假设例如你拥有数字字符串，一个例子如下：


    ![](img/Java_18_-_Algorithms_and_data_structures_29-10-18_For_code_174.jpg)


    该思想是为每个可能出现的字符创建一个队列，在这种情况下是 10 个。每次迭代遍历数组，将元素分到队列中，这可以在线性时间内完成。迭代次数由键长度决定，如果长度为
    M 且数组中有 N 个元素，该方法可以实现为 `O(MN)` 算法。由于 M 是常数且在实践中很小，结果如下：


    ![](img/Java_18_-_Algorithms_and_data_structures_29-10-18_For_code_1733.jpg)


    接下来重复该过程，但将数字移回数组，结果如下：


    ![](img/Java_18_-_Algorithms_and_data_structures_29-10-18_For_code_1741.jpg)


    最后一次迭代在第一位数字后将数字放入队列，结果如下：


    ![](img/Java_18_-_Algorithms_and_data_structures_29-10-18_For_code_1742.jpg)


    你必须编写一个名为 `RadixProgram` 的程序，它应该对一个代表固定长度键的字符串数组进行排序，其中单个字符为数字。程序在使用 `PriorityQueue<String>`
    时必须使用基数排序排序数组。当你测试程序时，尝试与快速排序进行比较并测量排序数组所需的时间。


    # 9 哈希


    集合类是对象的容器，主要有两个点区分不同的集合类：


    1.  该类提供的服务，以及用户可以使用该类做什么

    2.  对象在内部是如何存储和组织的

