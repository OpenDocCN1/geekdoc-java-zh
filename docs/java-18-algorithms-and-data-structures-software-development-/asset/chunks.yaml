    编写一个可以调用 `AVLProgram` 的程序，它应该使用 3 个测试方法来测试 `AVLTree<T>` 类。第一个测试方法必须随机顺序将 A 到 Z
    的字母插入 `AVLTree<Character>` 中，然后使用 `TreePrinter` 类的方法在屏幕上打印该树。

