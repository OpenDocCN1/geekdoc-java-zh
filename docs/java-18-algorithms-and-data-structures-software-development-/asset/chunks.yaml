    ## 6.5 队列 (Queue)


    栈是一种可以通过 `push()` 和 `pop()` 操作处理的数据结构或抽象数据类型。它是 LIFO 结构（后进先出），因为通过 `pop()` 从栈中移除的是最后一个放入栈的元素。与栈非常相似的数据结构是队列，但它是
    FIFO 结构（先进先出）。你可以将队列想象为一个具有两个引用的对象序列


    ![](img/Image3261.jpg)


    其中 `head` 指向队列的开始，而 `tail` 指向队列的结束。这与我上面说的缓冲区（buffer）完全相同，像 `Buffer<T>` 这样的类就是一个队列，区别在于（其他方面）操作名称不同：


    1. `enqueue()`：在队列末尾插入一个元素——在 `tail` 指向的元素之后

    2. `dequeue()`：移除队列中的第一个或最旧的元素——`head` 指向的元素


    如所述，队列可以实现为 `Buffer<T>`。这样做，队列就具有了容量，通过在创建时设置缓冲区的大小来实现。队列并不总是建议或期望具有固定大小，如果不是这样，那么很难使用数组来实现队列以使得上述操作具有常数时间复杂度。然而，你可以使用链表来实现队列，允许根据需要扩展队列，使得插入和删除都具有常数时间复杂度。队列可以定义如下：


