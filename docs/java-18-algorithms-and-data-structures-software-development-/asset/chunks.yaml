    # 6 Linked lists


    A linked list is a collection that, like an `ArrayList`, can contain any number
    of objects organized in a particular order. It is a sequential structure where
    new elements are placed by directly or indirectly specifying the new element’s
    predecessor or successor, and where you can traverse the list and process the
    objects in the order they are inserted. For example, you can browse the list from
    start to finish. A linked list is an alternative to an array or an `ArrayList`.
    An array (and also an `ArrayList`) is a coherent data structure in the machine’s
    memory:


    ![](image/Java_18_-_Algorithms_and_data_structures_29-10-18_For_code_105.jpg)![](image/Image3137.jpg)


    and it is characterized by direct access to its elements via an index, that is,
    you can refer to the `i`th element as `t[i]`. An array thus gives direct access
    to the individual elements, which means that it is a very efficient data structure.
    For a linked list, the conditions are opposite. A linked list consists of a reference
    that refers to the list’s start and each element in the list has a reference to
    the next element:


    ![](image/Java_18_-_Algorithms_and_data_structures_29-10-18_For_code_1051.jpg)![](image/Image3145.jpg)


    You can add new items to the list at any time or remove an existing item, so the
    list can grow or decrease as needed. On the other hand, to refer to a specific
    item in the list, you must start at `start` and search the list until you find
    the element. You must note that unlike an array (and an `ArrayList`), a linked
    list is not a coherent structure, and relative to an array, it’s exactly both
    its pros and cons.


    Lists can be organized in practice in many different ways, and below are discussed
    more methods of structuring lists and the associated algorithms that are used.
    The list illustrated above is an example of a *single linked list*.


    ## 6.1 Single linked lists


    The simplest list you can have is a single none ordered linked list. It is characterized
    by the list consisting of elements (also called nodes) that contains a data object
    and a reference to the next element/node:


    ![](image/Java_18_-_Algorithms_and_data_structures_29-10-18_For_code_106.jpg)![](image/Image3152.jpg)


    and a list is merely a reference to the element that is the first node in the
    list corresponding to the figure above. Basically, the following operations are
    required:


    1. Insert a new element at the start of the list

    2. Insert a new element after an existing element

    3. Returns the number of elements in the list

    4. Check if the list is empty

    5. Traverse the list, so all elements in the list are processed

    6. Remove the first element in the list

    7. Remove a specific element in the list


    An operation to insert an element at the start of the list is simple. If the list
    is empty, it should not happen other than creating a new node, and `start` (or
    `first`) is set to refer to this node:


    ![](image/Image3160.jpg)


    If the list is not empty, a new node should be created that refers to the node
    that before was the start:


    ![](image/Image3167.jpg)


