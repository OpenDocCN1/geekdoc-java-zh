    # 3 Algorithm analysis


    Once you have written an algorithm, there are two outstanding issues:


    1.  to argue that the algorithm is correct and solve the current task

    2.  to evaluate the efficiency of the algorithm with regard to resource consumption


    Both can be done more or less formally. For example, with regard to the correctness
    of algorithms, mathematical evidence can often be used in the form of a proof
    by induction, but in other contexts, a more informal argumentation can explain
    the correctness of the algorithm. The same goes for analyzes of the algorithms
    efficiency. In the following, I will show both approaches, but I would like to
    emphasize that the choice often depends on the context.


    An analysis of an algorithm''s efficiency relates to its consumption of resources,
    which are typically time and memory. The goal is to minimize these resources.
    However, one should always be aware that such a timing depends on the machine
    and in many contexts it is more interesting to assess the overall nature of the
    algorithm with its complexity.


    ## 3.1 The complexity of linear search


    To show what algorithm analysis is about, I will look at linear search, as an
    algorithm discussed above. At best, the element that is searched for is found
    at the first comparison. If so, the execution time – also called its time complexity
    – is independent of the size of the array. It is said that the algorithm has a
    best time complexity that is constant. The best time complexity does not depend
    on which array is searched and is the same every time. One writes that the best
    time complexity is `O(1)`.


    At the worst case, you must compare with all elements in the array, and if the
    array has `N` elements, you must perform `N` operations where an operation consists
    in comparing the element that is searched for with the element in a particular
    place in the array. In this case, the execution time depends on the array size,
    so that the execution time grows as a linear function (and hence the algorithm’s
    name). It is said that the worst time complexity depends linearly on the array
    size, which is indicated as `O(N)`.

