    # Java 18: Algorithms and data structures


    ## Software Development


    ### Poul Klausen

    Java 18: Algorithms and data structures: Software Development

    1st edition

    © 2018 Poul Klausen & [bookboon.com](http://bookboon.com)

    ISBN 978-87-403-2616-1

    Peer review by Ove Thomsen, EA Dania


    ## Foreword


    The current book is the eighteenth in this series of books on software development
    in Java. The book requires basic knowledge about Java and system development and
    here especially knowledge of the principles of object oriented programming as
    presented in the books `Java 3` and `Java 4`. The book focuses on algorithms and
    presents several classic algorithms, but in conjunction with algorithms, the primary
    goal is to introduce algorithm analysis, and then allowing the reader to be able
    to compare and evaluate the complexity of algorithms with each other. In addition,
    the book treats the classic data structures such as lists and trees and shows
    how these data structures can be implemented in `Java`. In addition to shows the
    implementation of many of the classic data structures and discussing the applied
    algorithms, the book introduces several programming techniques that are useful/necessary
    to work as a professional software developer.


    As the title says this series of books deals with software development, and the
    goal is to teach the reader how to develop applications in `Java`. It can be learned
    by reading about the subject and by studying complete sample programs, but most
    importantly by yourself to do it and write your own programs from scratch. Therefore,
    an important part of the books is exercises and problems, where the reader has
    to write programs that correspond to the substance being treated in the books.
    All books in the series is built around the same skeleton and will consist of
    text and examples and exercises and problems that are placed in the text where
    they naturally belongs. The difference between exercises and problems is that
    the exercises largely deals with repetitions of the substance that is presented
    in the text, and furthermore it is relatively accurately described what to do.
    Problems are in turn more loosely described, and are typically a little bigger
    and there is rarely any clear best solution. These are books to be read from start
    to finish, but the many code examples, including exercises and problems plays
    a central role, and it is important that the reader predict in detail studying
    the code to the many examples and also solves the exercises and problems or possibly
    just studying the recommended solutions.


    All books ends with one or two larger sample programs, which focus primarily is
    on process and an explanation of how the program is written. On the other hand
    appears the code only to a limited extent – if at all – and the reader should
    instead study the finished program code perhaps while testing the program. In
    addition to show the development of programs that are larger than the examples,
    which otherwise is presented, the aim of the concluding examples also is to show
    program examples from varying fields of application.


    Most books also ends with an appendix dealing with a subject that would not be
    treated in the books. It may be issues on the installation of software or other
    topics in computer technology, which are not about software development, but where
    it is necessary to have an introductory knowledge. If the reader already is familiar
    with the subject, the current appendix can be skipped.


    The programming language is, as mentioned `Java`, and besides the books use the
    following products:


    1. `NetBeans` as IDE for application development

    2. `MySQL` to the extent there is a need for a database server (from the book
    `Java 6` onwards)

    3. `GlassFish` as a web server and application server (from the book `Java 11`
    onwards)

    4. `Android Studio`, that is a tool to development of apps to mobil phones


    It is products that are free of charge and free to install, and there is even
    talk about products, where the installation is progressing all by itself and without
    major efforts and challenges. In addition, there are on the web detailed installation
    instructions for all the three products. The products are available on Windows
    and Linux, and it therefore plays no special role if you use Linux or Windows.


    All sample programs are developed and tested on machines running `Linux`. In fact,
    it plays no major role, as both `Java` and other products work in exactly the
    same way whether the platform is one or the other. Some places will be in the
    books where you could see that the platform is `Linux`, and this applies primarily
    commands that concerning the file system. Otherwise it has no meaning to the reader
    that the programs are developed on a `Linux` machine, and they can immediately
    also run under Windows unless a program refers to the file system where it may
    be necessary to change the name of a file.


    Finally a little about what the books are not. It is not “how to write” or for
    that matter reference manuals in `Java`, but it is as the title says books on
    software development. It is my hope that the reader when reading the books and
    through the many examples can find inspiration for how to write good programs,
    but also can be used as a source collection with a number of examples of solutions
    to concrete everyday programming problems that you regularly face as a software
    developer.


    ## 1 Introduction


    ADT stands for `abstract data types` (as you can also think of as generic collections),
    and this book primarily deals with how classical collections such as lists, maps,
    etc. can be implemented in `java`. Instead of collections, I would like in this
    book to talk about `data structures`. Data structures must be implemented to be
    effective and therefore algorithms plays an important role, and the following
    will therefore focus on both data structures and algorithms.


    You often hear that programming is difficult to learn, which is also correct.
    At least there are many who give up, but it is more because many not finds that
    programming is very exciting than because it is difficult, and in fact it has
    even become easier than it has been. It has become easier with the emergence of
    new programming languages, which can ease the work as you have to write less,
    and partly results in more robust programs, because the languages provide a much
    larger toolbox available than was previously the case. Conversely, the requirements
    for the programs to be created have grown correspondingly, and from the programmers,
    the challenges are really the same, to be able to write a good algorithm to solve
    a specific problem.


    In fact, I should have started my history of programming with algorithms, as that
    is what it’s all about. One should be good at algorithms to be a good programmer,
    but it does not work alone and another important thing is motivation, including
    the desire to work with programming and software development. You can learn about
    algorithms and methods, but you can not write finished programs that can run on
    a machine without having a programming language. Therefore, most entries to the
    programming and software development start with the language, as you quickly get
    ready to write completed programs.

    '
