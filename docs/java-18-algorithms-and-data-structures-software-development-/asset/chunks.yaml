    # 12 最后一个示例


    在数学中，向量是一个元素（通常为实数）数组，你可以执行不同的操作，例如两个向量相，这简单意味着对应元素相加。你还可以确定两个向量的内积，结果是一个实数。类似的术语是矩阵，它本质上是一个二维数组，其元素和向量一样都是实数。对于矩阵，也适用许多规则，例如矩阵的加，并且在某些条件下你可以乘两个矩阵，结果再次是一个矩阵。编程中的经典任务之一是编写表示向量和矩阵的类以及对这些数据结构的常用操作，目前有许多库形式的解决方案。也许这与其说是是为了解决这个问题，而不是实际应用。算法在其中起着至关重要的作用。解决方案将扩展
    palib 库，该库包含一个 `dk.data.torus.math` 包，其中包含了实现简单矩阵代数的类。


    具体来说，我将实现以下类：


    ![](img/Image3725.jpg)


    查看上面的类图，`Matrix` 表示 `m x n` 矩阵，具有 `m` 行 `n` 列，但 `SquareMatrix` 类是行数和列数相同的方阵。`RowVector`
    是 `1 x n` 矩阵，而 `ColVector` 是 `m x 1` 矩阵。最后是 `Vector` 类，它表示一个具有 `n` 个坐标的向量。

