    ## 7.3 平衡二叉树


    实践中所有二叉树的使用都建立在二叉搜索树（或派自二叉搜索树的树）的基础上。树有两个非常重要的特征：


    1. 元素的搜索时间（如所述）是对对数的。

    2. 树的中序遍历会按升顺序通过元素。


    然而，第一点并不一定正确。例如，假设你按顺序插入元素：


    A B C D E F


    结果仍然是一个二叉搜索树，但它是一个退化树，具有与列表相同的特性：


    ![](img/Image3352.jpg)


    这被称为树是不平衡的。因此有必要修改插入和删除元素的方法。这些方法必须确保在操作完成后树是平衡的。这是通过被称为旋转的特殊操作实现的。


    ## 7.4 AVL 树


    如果你如上所述向二叉搜索树中插入元素，结果并不一定是平衡树，在最坏的情况下甚至像一个列表。因此，有必要使用旋转。


    ### 右旋转


    考虑以下二叉树（或子树）：


    ![](img/Image3387.jpg)


    在 D 处进行右旋转，可以理解为 B 变为根的操作（你需要更改两个指针）：


    ![](img/Image3400.jpg)


    这里是红色的箭头、被更改的指针，如果操作完成后绘制树，结果为：


