    你应该注意，算法具有输入参数，这些是算法依据的值。如果这些参数带有前置条件（preconditions），我会在算法前面以注释的形式标出。相反，你也可以让方法在未满足前置条件时抛出异常，选择采用哪种方法取决于个人考虑。如果你只是写了一条注释，它就是一份你要求用户遵守的契约；如果用户遵守了，编写算法的人保证它给出正确的结果，而如果在使用错误的前置条件的情况下，程序员则不保证任何结果。你所说的是契约编程（contract
    programming），方法的用户负责遵守前置条件。契约编程简化了代码，而异常处理有助于用户始终以正确的前置条件执行方法，作为作为，算法必须测试是否满足前置条件。


    上述算法是针对 `long` 类型的值（参数 `n`）实现的。如果算法还需要针对 `double` 类型的值实现，通常会写一个方法的重写版本，这一次我让方法来测试前置条件：


    ![](img/Java_18_-_Algorithms_and_data_structures_29-10-18_For_code_131.jpg)!(image/Java_18_-_Algorithms_and_data_structures_29-10-18_For_code_14.jpg)


    在编写输入参数为简单类型的算法时，非常常见的是为不同类型重写算法方法，这由编写算法的程序员来确保必要的重写。在这种情况下，它是一个处理数字的算法，你通常需要为不同的数字类型编写重写；但在其他语境下，会有处理类类型的算法，在这里我经常会将算法写为泛型方法（generic
    methods）。请注意，这种做法在 Java 中被广泛使用。


    在回顾上述算法时，我将不仅关注算法本身（即如何解决问题），还会关注算法如何在 Java 中实现。


    ## 2.1 算法示例


    下文将继续讨论什么是算法，以及如何使用非正式语言来制定算法。此外，我将给出经典算法的示例。


    关于使用非正式语言或编程语言来编写算法，选择并不明确。像 Java 这样的现代编程语言具有良好的自解释文档性，你通常可以在语言本身中制定算法，且像使用非正式伪代码一样清晰和容易。事实上，用非正式语言编写的算法往往比用编程语言编写的相应算法更长，如果是这样，那么非正式地描述算法显然没有意义。如果你精通你使用的语言，你使用该语言的术语进行思考和制定的效果同样很好，因此许多人避免了非正式地描述算法。然而，在书中，我想利用一些非正式语言，因为我认为至少在复杂算法中，舍弃编程语言的细节是值得的，以便能更好地关注算法中最重要的步骤。另一方面，你应该避免将非正式算法写得过于详细和直白，不要将非正式语言仅仅作为一种问题分解的技术。你应该避免编写非正式算法，因为那实际上是用英语编写的程序。


    基本上，一个算法包含四种内容：


    *   序列（sequences）：按照在算法中编写的顺序执行的一系列命令/指令。

    *   条件（conditions）：根据某个条件执行一个或多个操作。

    *   循环（loops）：只要满足某个条件，一直执行一个或多个操作。

    *   执行子算法（performing a sub algorithm）：当前算法启动另一个算法。


    ### 等差数列


    通过等差数列（difference series），你应该理解一组数字


    ![](img/text18__3.jpg)


    其特征是，你始终通过加上相同的数字向行向前移动一位，例如：


    4, 7, 10, 13, 16, 19, …


    其中每次加上 3。它也可以表示为：一个数字与前一个数字之间的差是常数（因此得名为差）：


    ![](img/text18__4.jpg)


    如果是这样，你就说你有一个差值为 `d` 的等差数列。等差数列的其他示例还有：


    5, 8, 11, 14, 17, 20, 23, …, 2 + 3n, ….


    2, 4, 6, 8, 10, 12, …, 2n, ….


    1, 2, 3, 4, 5, 6, …, n, ….


    其中第一个差为 3，第二个差为 2，最后一个差为 1。


    现在的目标是写一个可以确定等差数列数字之和的算法。为了做到，你必须知道三件事：


    *   第一个数字 `a`（数列开始的地方）

    *   差值 `d`（为了得到下一个数字需要向前走几步）

    *   应该包含在和中的数字个数 `n`


    该算法可以写如下：


    ![](img/Java_18_-_Algorithms_and_data_structures_29-10-18_For_code_16.jpg)


    再次，这是一个简单的算法，很容易发现它给出了正确的结果：对于每次重复，和加上等差数列中的下一个数字，然后将 `a` 变为下一个数字。很容易在 Java 中将其写成一个
    `static` 方法：


    ![](img/Java_18_-_Algorithms_and_data_structures_29-10-18_For_code_16.jpg)


    注意，该方法使用了上述算法。算法基本上由一个重复 `n` 次的循环组成，确定前 `n` 个数字的和。因此，算法的复杂度（关于操作数）由 `n` ，对于较大的
    `n` 值，算法需要很多操作。另一方面，它的空间消耗与 `n` 无关，因为无论 `n` 大小只使用一个额外的变量（循环中的变量）。


    如果你考虑上述方法，你会发现在循环的最后一次迭代中，变量 `a` 被赋了一个未被使用的值。这可以通过修改语句轻松解决：


    ![](img/Java_18_-_Algorithms_and_data_structures_29-10-18_For_code_17.jpg)


    没有很大区别，但在最后一个版本中，循环少执行一次，因此算法更高效。然而，这种差异几乎不可察觉，但它表明在编写算法后，你通常可以通过批判性地参考编写方式来改进/优化。不过，我想警告某些优化方法，要注意它们不会牺牲可读性。在这里情况并非如此，但算法易于阅读和理解很重要。


    无论通过何种方式，上述都是确定等差数列和的自然算法，因为它直接取决于定义，但也有其他选择，问题在于你是否可以做得更好——你是可以的。如果你有一个差值为 `d`
    的等差数列


    ![](img/text18__5.jpg)


    你可以根据以下公式确定 `n` 个数字的和：


    ![](img/text18__6.jpg)


    即公式为第一个数字和最后一个数字之和乘以数字个数除以 2。这是一个数学公式，证明并不特别困难。因此你也可以这样写算法：


    ![](img/Java_18_-_Algorithms_and_data_structures_29-10-18_For_code_18.jpg)


