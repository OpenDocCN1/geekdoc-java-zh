    # 8 Heap


    A heap is a data structure that in some way resembles a stack and a queue so that
    you can basically perform two operations:


    1. `add()`, which adds an element to the data structure

    2. `remove()`, which returns and removes the smallest element in the data structure


    From this it follows immediately that a heap is an ordered data structure so that
    its elements can be compared.


    A heap can be organized as a binary tree that meets two additional features:


    1. It is a complete binary tree.

    2. Any node is less than or equal to its child nodes.


    For example, the following data is organized as a heap:


    ![](image/Image3609.jpg)


    Note in particular that for all nodes, its children are either empty (null) or
    they have a greater value than the (parent) node. It is also a completely binary
    tree, as level 1 is filled, while level 2 is filled out from the left. For example,
    if 47 had been a right child to 31, it would not be a complete binary tree.


    As a heap in that way organizes the elements like a binary tree, you sometimes
    also talk about a binary heap.


    If you want to insert a new element into a heap, you expand the tree with a new
    node:


    ![](image/Image3617.jpg)


    Note that it is still a complete tree. You start now in the new node called `current`
    and go up in the tree. For each step you look at parent. If it is larger than
    the new element to be inserted, the value of parent to `current` is exchanged,
    that is that `current` move one level up. When the value of parent is less than
    or equal to the new value, the process stops and the new value is stored where
    `current` points. For example, assume that the new element is 19. After the elements
    are moved and 19 are inserted into `current`, the picture is as follows:


    ![](image/Image3624.jpg)


    Below is how the heap looks like if you also inserts the element 7:


    ![](image/Image3632.jpg)


    Note that, of course, the lower level may be filled up and you have a full binary
    tree. If that is the case, and if you want to insert another element, the tree
    will get another level, but as it still has to be a complete binary tree, you
    must start from the left with a new left child to the node at the far left of
    the previous level. Also note that after inserting a new node, you have to look
    up the tree to find the node where the new element must be placed. In the worst
    case, you have to go back to the root, but if you get it, the new element must
    be less than the root, and thus less than the children of the root, and the element
    can thus be inserted as a new root. This means that at worst you have to go back
    to the root, which means that the time complexity for inserting a new element
    is `O(log (N))`.


    The result of inserting elements into a heap is, as shown above, that the smallest
    element is always in root, and it is therefore simple to implement `remove()`
    as it simply returns the value of the root. However, the problem is to ensure
    that the tree after removing the root is still a heap and it requires a process
    resembling insertion.


    In the example above, `remove()` returns 7, and the node with 59 will be gone.
    You start at the root and go to the least child, here’s 13. Since it’s less than
    59, it moves to the root. You are now repeating the process and going to the least
    child to 13, which is 17. Since it is less than 59, 17 moves a place up (where
    the parent points):


    ![](image/Image3639.jpg)


    Since there are no children for `current` (the node with the value 17) 59 are
    put in that place:


    ![](image/Image3647.jpg)


    The result is still a heap: It is a completely binary tree, and the value of each
    node is less than or equal to the value of the children (if they are not null).
    If you delete again, 13 are disappearing and this time it is 31 to be put in place:


    ![](image/Image3656.jpg)


    and the result is again a heap. When deleting, you start in the root and move
    down until you find the place where the value to be deleted must be inserted.
    At worst, you have to go to the bottom of the tree, and the time complexity is
    therefore `O(log (N))`.


    A heap also has operations other than `add()` and `remove()`, and as typical examples
    include:


    1. `peek()`, which returns the smallest element (without removing it)

    2. `clear()` which deletes all the content of the heap

    3. `getSize()`, which returns the number of elements on the heap


    You can also implement an iterator so you can traverse the heap, and it can be
    done in several ways as for the general binary tree, but a level order traverse
    is probably the natural choice. Correspondingly, I will define a heap as follows:


    ![](image/Java_18_-_Algorithms_and_data_structures_29-10-18_For_code_168.jpg)


    The methods should be self explanatory except the last. Above I have defined a
    heap like a binary tree with the property that every node is less than or equal
    to its children. Such a heap is sometimes called a *minimum heap*. You can of
    course also define a *maximum heap* as a heap where each node is larger than or
    equal to its children, and the last method in the above interface should indicate
    which order of the elements to apply to the heap.


