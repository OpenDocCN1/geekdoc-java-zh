    ## Problem 5: Radix-sort


    `radix-sort` is a sorting method that can be used to sort strings of the same
    length and which in principle has linear time. Suppose, for example, that you
    have strings of digits and an example might be:


    ![](image/Java_18_-_Algorithms_and_data_structures_29-10-18_For_code_174.jpg)


    The idea is to create a queue for each character that can occur, and in this case
    is 10. Each iteration consists of a pass of the array, where the elements are
    distributed on the queues, which can be performed in linear time. The number of
    iterations is determined by the key length, and if it is the M and if there are
    N elements in the array, the method can be implemented as an `O(MN)` algorithm.
    Since M is constant and in practice is small the result is:


