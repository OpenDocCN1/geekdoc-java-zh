    如果你想实现一个映射，有几种选择，但基本上你可以将其实现为 `HashMap`，这原则上意味着键是使用哈希（hashing）保存的。如果你选择这种解决方案，意味着通过遍历键，你找到对象的顺序是不可预测的，这与遍历
    `HashSet<K>` 对应。或者，你可以将映射实现为 `TreeMap`，这对应于键存储在二叉搜索树中。这种解决方案意味着在遍历时对象根据键进行排序，但另一方面，该类的方法性能略低。


