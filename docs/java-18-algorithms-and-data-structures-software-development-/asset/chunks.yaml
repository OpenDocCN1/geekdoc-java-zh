    # 10 Sets


    From mathematics you know the concept of a set, which is a well-defined container
    of objects. In other words, it is a collection. In a set, you can basically perform
    the following operations:


    1. Ask if an element is included in the set

    2. Create an intersection that creates a new set from two other sets, consisting
    of the elements that are included in both the other sets

    3. Create a union that creates a new set from two other sets, consisting of the
    elements that are included in one of the two other sets and possibly both

    4. Create a difference that creates a new set from two other sets, consisting
    of the elements that are included in the first of the two other sets but not in
    the last

    5. Create a subset that creates a new set from another set, consisting of the
    elements from the other set which meets a condition


    However, there will usually also be other operations, and you can, for example,
    define a set as follows:


    ![](image/Java_18_-_Algorithms_and_data_structures_29-10-18_For_code_190.jpg)


    where the meaning of the individual methods should be self explanatory. A set
    does not mathematically guarantee anything about the order of the elements, and
    if you pass through all the elements of the set, you can not know the order in
    which they are processed. It is therefore obvious to implement a set as a collection
    using hashing, and the class `HashSet<T>` is not more than a wrapper for `Hash<T>`.
    Assuming that the methods `insert()`, `remove()` and `contains()` have constant
    time complexity, the same methods in `HashSet<T>` can be implemented with constant
    time complexity, while the methods `union()`, `intersection()` and `difference()`
    can be implemented with linear time complexity. The class `HashSet<T>` corresponds
    to Java’s class with the same name.


    In practice, however, one may be interested in how the elements of a `ISet<T>`
    being arranged, and instead, you can implement an `ISet<T>` using a binary tree.
    The class `TreeSet<T>` implements the interface `ISet<T>`, but using an `AVLTree<T>`.
    This, of course, means something about complexities as a constant time complexity
    is changed to logarithmic time complexity, and the complexity of `union()`, `intersection()`
    and `difference()` are no longer linear, but in practice the difference is not
    so great as a part of overhead is connected with the class `Hash<T>`.


