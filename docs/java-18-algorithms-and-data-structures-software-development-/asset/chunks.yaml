    * 否则，如果该元素的左子树为空，则该元素必须被右子树替换（例如上面树中的元素 `V`）。

    * 否则，如果该元素既有左子树又有右子树，则它被右子树中最小的元素替换，然后必须删除该节点（例如上面树中的 `H`）。


    同样，该算法是在树中向下搜索，因此可以用对数级复杂度来实现。以下是删除 `V` 后的树：


    ![](img/Image3328.jpg)


    如果你也删除了 `H`，就会得到：


    ![](img/Image3337.jpg)


    需要注意的是，二叉树中的删除保留了二叉搜索树的特性。


    如接口所示，二叉搜索树还有其他服务：返回最小和最大的元素。然而，这些方法的实现非常简单，主要由尽可能地向左遍历或尽可能地向右遍历组成。当你学习 `SearchTree<T>`
