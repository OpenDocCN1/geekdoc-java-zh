    ### Sorting


    As the next example, I will look at sorting an array, and more precisely, I will
    look at the sorting of the elements in an array of `N` elements in ascending order.
    It is a very classic problem and there are many algorithms to solve the problem.
    In the next chapter, I will especially look at sorting algorithms, while I here
    just want to show an example called `bubble sort`. The algorithm is very simple.
    You pass through the array and compare the elements in pairs (each element with
    its successor). If you meet two elements that are incorrectly arranged – one element
    is larger than its successor – then you swap them. This process is repeated until
    you have completed an iteration without interchange. At that time, the array is
    sorted – then there are no element that are larger than the successor.


    The algorithm can be written as follows:


    ```

    ![](image/Java_18_-_Algorithms_and_data_structures_29-10-18_For_code_51.jpg)

    ```


    The algorithm consists of two loops inside each. The length of the inner loop
    is always `N-1`, and it thus performs `N-1` operations. The question is how many
    times the outermost loop is performed.


    If the array has already been sorted, the inner loop does not change, and the
    outer loop is only executed once. The algorithm will therefore perform `N-1 +
    1 = N` operations, and therefore it has the best time complexity, which is `O(N)`,
    that is, a time complexity.


    When the inner loop is passed, the elements are compared in pairs, and in a comparison
    where the left-hand element is larger than the right, the largest moves a place
    to the right, and the smallest of the two elements a place the left. The smallest
    element will therefore move to the left for each pass unless it is in the first
    place. It will thus be in place after no more than `N-1` iterations. The next
    smallest element also moves a place to the left unless it already is in place
    or the smallest element is to the left of it, but it only happens once, so after
    `N-1` iterations is also the next element in place. It also applies to the third
    least, which also moves a place to the left unless it is in place, or the smallest
