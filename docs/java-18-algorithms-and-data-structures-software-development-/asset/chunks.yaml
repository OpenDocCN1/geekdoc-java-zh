    ## 4.5 合并排序


    我之前提到过合并以及如何合并两个有序数组。这里应该注意，如果合并两个有序数组，结果是排序的：


    ![](img/Image2935.jpg)


    合并可以用于排序数组。如果你要排序的数组只只有一个元素，那么任务就是平凡的。如果有两个元素，你可以将数组视为两个各有一个元素的子数组：


    ![](img/Image2943.jpg)


    现在合并这两个数组（一个包含 1 个元素，另一个包含 1 个元素），结果将是排序。如果有三个元素，你可以考虑前两个元素作为一个子数组，另一个包含 1 个元素。然后合并这些子数组，整个数组即排序：


    ![](img/Image2950.jpg)


    如果有四个元素，你将其分成两个两个元素的子数组。每个子数组通过合并进行排序。然后合并这些子数组，整个数组即排序：


    ![](img/Image2958.jpg)


    这种策略持续进行。数组被划分为子数组，直到长度为 1，此时所有子数组都自动排序。之后，合并所有子数组直到它们重新组合成一个排序后的数组。这种方法被称为合并排序。


    算法可以写如下：


    ![](img/Java_18-_Algorithms_and_data_structures_29-10-18_For_code_84.jpg)[](image/Java_18-_Algorithms_and_data_structures_29-10-18_For_code_85.jpg)[](image/Java_18-_Algorithms_and_data_structures_29-10-18_For_code_86.jpg)


    该算法与其他排序方法的原型相同，但通过递归版本工作。作为参数，它有一个额外的数组用于合并结果——发送给 `merge()` 方法以免每次创建数组。最复杂的是
    `merge()` 方法，但原理上与我处理的方法相同，不同之处在于跟踪子数组。


    每次递归调用将数组长度减半，每次都传递整个数组。它得到的复杂度 ![](img/text18__67.jpg)，并且实际上比希尔排序快。另一方面，该方法需要数组的副本，因此其内存复杂度为
    `O(n)`，这是处理大数组时的缺点。即你付出了空间来换取高效率。事实上，Java（`Arrays` 和 `Collections` 类）使用合并排序（具体称为
    `TimSort` 的变体）作为排序算法。


    ## 4.6 快速排序


    上面我看了二分查找。其思想是查看中间元素。这允许你判断要查找的元素是在左半还是右部分。也就是说问题规模缩小了一半。你继续这种方法，每次问题规模都减半。当找到元素或问题变得平凡时即可完成。二分查找是一种通用的问题解决技术，通常称为分治：


    给定一个问题 `P`，该技术是：将 `P` 分分为若干个子问题 ![](img/text18__68.jpg)，每个子问题都比原始问题 `P` 简单。然后解决子问题并获得若干解决方案。最后，组合部分解决方案解决原始问题。


    结合二分查找，问题是在 n 元素中搜索元素 `x`。这个问题被划分为三个子问题，每个都比原始问题简单（即搜索元素）：


    1. 将 `x` 与中间元素进行比较

    2. 在中间元素的左侧搜索 `x`

    3. 在中间元素的右侧搜索 `x`


