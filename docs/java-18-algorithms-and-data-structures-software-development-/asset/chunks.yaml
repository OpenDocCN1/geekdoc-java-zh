- fmt: '

    A classic issue is searching an element in an array. If you do not know anything
    about how the array’s elements are sorted, you can not do much more than search
    linearly, that is, start from the beginning and pass through the array from start
    to finish and compare each element with what is searched for. The process can
    be expressed in the following algorithm where you search in an array `arr` after
    an element `elem`:


    ![](image/Java_18_-_Algorithms_and_data_structures_29-10-18_For_code_24.jpg)


    Note how the algorithm works by searching the entire array. If you find the element,
    you are done and the algorithm can terminate with a message that the element is
    found. If you get through the loop, it’s because the element is not there and
    you can end up with a message that it does not exist. In the worst case, you must
    visit all elements to find out that an element is not available.


    It is easy to implement linear search in `Java`. Below is a generic search method
    that searches for an element in an array. If the element exists, the method returns
    the index of the element’s position in the array. If the element is not found,
    the method returns -1 (it may not be an index) as an indication that the element
    was not found.


    ![](image/Java_18_-_Algorithms_and_data_structures_29-10-18_For_code_25.jpg)


    You should note that the only requirement for parameter type `T` is that the type
    implements `equals()` with value semantics. Also note that if the same element
    is found multiple times, the method returns the index on the first element (the
    element with the smallest index).


    The method `linSearch()` is defined as a `static` method in a class `Tools`, which
    is a class in a class library called `palib`. This class library will contain
    more methods and classes presented in this (and the next) book, and the goal is
    to write some utility classes that could be used as alternatives to corresponding
    methods and classes implemented in the package `java.util`.


    Linear search is a widespread search algorithm, that you typically use, when the
    array is small or you do not know anything about the elements in the array. However,
    if you know that the array searched is already sorted, you can do it better using
    `binary search`. The algorithm is:


    ![](image/Java_18_-_Algorithms_and_data_structures_29-10-18_For_code_251.jpg)


    The idea in this algorithm is that, for each repeat, you halve the number of elements
    to be searched, and in that way you get done quickly. The main problem with implementing
    the algorithm is to control what it is for a subset of the array to be searched.
    The problem can be solved using two indices `a` and `b`, which refer to the subset’s
    left end and right end points respectively:


    ![](image/Java_18_-_Algorithms_and_data_structures_29-10-18_For_code_26.jpg)


    Here you should note the following:


    *   The method is a generic method, and since it is a requirement that the array’s
    elements can be arranged, the parameter type implements the interface `Comparable`.

    *   That binary search only works if the array searched is sorted and then binary
    search can not be used as a general search strategy.

    *   That `a` from the beginning points to the first element and `b` on the last
    element in the array, and how one of these variables is changed for each iteration
    – if the element is not found.

    *   That the method, similar to the corresponding linear search method, returns
    the element’s index if it exists and otherwise -1. If the element is found multiple
    times, it is the index of the first element found you will you encounter.


    The question is then, how good binary search is compared to linear search. Binary
    search is not only better, it is simply much better, and I will later returns
    to what it means, under the mention of algorithm complexity. Now it is not the
    case that you do not have to apply linear search, and in smaller arrays the difference
    in efficiency is not pronounced, but in large arrays the difference can be significant.


    If you look at the binary search algorithm, you can reformulate it a bit:


    ![](image/Java_18_-_Algorithms_and_data_structures_29-10-18_For_code_261.jpg)


    The algorithm is now recursive, and you can write binary search as a recursive
    method in `Java` as follows:


    ![](image/Java_18_-_Algorithms_and_data_structures_29-10-18_For_code_27.jpg)


    A recursive method requires two additional parameters that define the range to
    be searched for. But otherwise, there is not much to explain and it is just the
    above algorithm written in `Java`.


    In order to get the same interface as the original algorithm, a version of the
    method is written that only calls the recursive version. This means that the algorithm
    is used in the same way, and that the user can not see if it is the recursive
    or non-recursive version. The recursive version is `private` and thus a private
    helper method, which is introduced alone to give the method the correct parameters.
    There is good reason for to be aware of that, as it is a technique that you will
    see used many times in the following. The public version of the two methods is
    referred to as a stub.


    If you look at how binary search works by halving the number of elements to be
    searched in each iteration, just repeating the same operation, but at an interval
    that is half the length, it’s obvious to consider a recursive implementation.
    In this case, the recursive solution has no advantages. The project *Algorithms*
    has three test methods that uses the above search algorithms.


    ## 2.4 Fibonacci numbers


    The first Fibonacci number is 0 and the next is 1. Then the next Fibonacci number
    is generated as the sum of the two previous ones. That is, it’s the number series:


    ![](image/Java_18_-_Algorithms_and_data_structures_29-10-18_For_code_28.jpg)


    Formally, you can define the Fibonacci numbers as follows:


    ![](image/text18__10.jpg)


    and thus it is a recursive definition. If you want to write a method that returns
    the `n`th Fibonacci number, it is therefore obvious to try using a recursive method
    as it is a direct copy of the formal definition:


    ![](image/Java_18_-_Algorithms_and_data_structures_29-10-18_For_code_281.jpg)


    Note that the method is simple and easy to understand. If you try out the method,
    everything looks immediately fine, but if you try the method for large values
    of the input parameter `n` you will find that the method becomes slow for finally
    to stop completely. The reason is that the number of recursive calls explodes,
    as each call leads to 2 new calls, and each of them again to two new calls and
    so on.


    The problem is not that there is anything wrong with recursion, but simply that
    recursion is not the solution in this case, and it is also an example, that you
    should always think about recursive methods, as it can be difficult to spot the
    consequences. Should you write the above method, it should therefore be iterative,
    which is also easy, and the difference between the efficiency of the two algorithms
    is very clear when you tests the algorithms.


    ![](image/Java_18_-_Algorithms_and_data_structures_29-10-18_For_code_29.jpg)


    The project *Algorithms* has two test methods – `test04()` and `test05()` – which
    tests the above algorithms for the Fibonacci numbers.


    Thus, the Fibonacci numbers are another example of the fact that algorithms can
    be written in several ways and it is far from certain that the most obvious is
    the best. Incidentally, the method used in the last iterative solution is referred
    to as dynamic programming, and it is a topic that I will return to in the next
    book in this series.


    ## 2.5 Euclid’s algorithm

