    ## 7.1 Binary trees


    A binary tree is a tree of no more than degree 2. That means that for a given
    node, the number of child nodes can not exceed 2. As an example, below is shown
    a binary tree with 10 nodes:


    ![](image/Image3292.jpg)


    A binary tree is characterized in that it is either empty or consists of a `root`
    and two sub-trees called the left and right sub-tree respectively, and where each
    sub-tree is a binary tree (and may in particular be empty). For example, `S` is
    `root` in a sub-tree, and the same applies to `V`. Note that the tree has 4 leaf
    nodes and that the height of the tree is 4 (the path from `K` to `X` is 4). Above
    the tree is drawn as if there is an order of its elements, but in a generally
    binary tree it is not the case.


    It is limited which operations can be performed on a generally binary tree, indeed,
    it is limited what you can use a general binary tree for in addition to being
    used as the base class for other binary trees with more structure. I will mention
    four operations that are assigned to a generally binary tree. The first is an
    operation that determines the height of the tree. Above, I have defined the height
    of the tree as the largest depth of all tree leaf nodes, and correspondingly,
    the above binary tree has the height 4. Specifically, the height of an empty binary
    tree is calculated as -1 and you can then determine the height as follows


    ![](image/Java_18_-_Algorithms_and_data_structures_29-10-18_For_code_131.jpg)


    Thus, the height of the tree can be determined by means of a recursive algorithm.
    Note that the algorithm gives the correct result 0 – if the tree consists of a
    single node. The other three operations concerns the traversing of a binary tree,
    which is an operation through which all the elements of the tree are traversed
    (processed) in one order or another. Classically there are three ways called `in-order`,
    `pre-order` and `post-order`. An `in-order` traverse works as follows. You start
    in the root and then you proceed recursively to the following pattern:


    1. traverses the left sub-tree (as long as it is not empty)

    2. perform the operation on the root

    3. traverses the right sub-tree (as long as it is not empty)


    This means that in the above tree you handle the elements in the following order:


    B D G H K P S V X Y


    A `pre-order` traverse uses the same recursive approach, but according to the
    following pattern:


    1. perform the operation on the root

    2. traverses the left sub-tree (as long as it is not empty)

    3. traverses the right sub-tree (as long as it is not empty)


    K D B H G S P V X


    Finally there is `post-order`:


    1. traverses the left sub-tree (as long as it is not empty)

    2. traverses the right sub-tree (as long as it is not empty)

    3. perform the operation on the root


    B G H D P X V S K


    It is also possible to define other traverse sequences, but the above are the
    most commonly used. As an example, you can sometimes meet level order traversing,
    where you treat the elements on the same level from left to right:


    K D S B H P V G X


    As mentioned, it is not easy (and also perhaps not interesting) to implement a
    generally binary tree, but I want to show two interfaces and two classes that
    implement a binary tree. A binary tree is implemented as a linked structure in
    the same way as the linked list, where a node must contain the data element and
    a reference to the left and right sub-tree respectively, and the starting point
    could be the following type:


    ![](image/Java_18_-_Algorithms_and_data_structures_29-10-18_For_code_132.jpg)


