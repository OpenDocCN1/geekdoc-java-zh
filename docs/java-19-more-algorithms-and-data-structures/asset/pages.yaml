    It is a tree, and such a tree is called for a spanning tree, as there is a path
    from the root to any other vertex — all vertices are included. In this case the
    graph is weighted and we can then determine the least spanning tree which is a
    spanning tree so the distance from the root to the vertices is minimal.


    There are several algorithms to determine the least spanning tree for a non-oriented
    weighted graph, and I will show a very simple algorithm called Prim''s algorithm.
    The procedure is:


    +   1. By choosing a start vertex and add it to the least spanning tree.

    2. Repeat as all vertices are not added to the tree: Find the smallest edge from
    the tree to a vertex that has not already been added and add it to the tree.


    If you use the above tree as an example and starts in A, it is added to the tree
    as root, and at the same time you mark the successors as candidates:


