    Given a number of cities and roads with road length between the cities, the task
    is

    determine a route from a particular city and back so that the route visits each
    city

    exactly once and so that the total route length is minimal.


    Similar to the previous chapter, the task can be formulated as finding the shortest
    path

    through an oriented weighted graph when the road must be a cycle that almost start
