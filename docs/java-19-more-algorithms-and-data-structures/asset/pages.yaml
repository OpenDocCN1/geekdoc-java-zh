    If there are n points, then there are $n(n-1)/2$ distances, and a simple solution
    would then be to determine all distances between pairs of points and choose the
    least one. Such an algorithm is simple (and simple to implement), but it is clear
    that it has square time complexity. It is therefore obvious to seek a better algorithm.


    Suppose you have an array containing the points and suppose the array is sorted
    by the points x-coordinates. You can then immediately split the points into two
    halves


    ![](img/943e62ea3705f1e2f8a9e0682925e139_32_0.png)


    There are now three options:


    +   1. The two points closest to each other are in the left half

    2. The two points closest to each other are in the right half

    3. The two points closest to each other are in each half and thus on each side
    of the line


    One can determine the solution by choosing the best (measured by the distance
    of the points) of the three solutions for the three sub-problems. Here the first
    two sub-problems are simple to solve as they are solved by repeating the above
    breakdown on each of the two sub-problems and thus by recursion. The problem is
    therefore to solve the third problem, and if you do it with linear time complexity,
    it is similar to what I have shown for merge sort, that the algorithm can be implemented
    with a time complexity that is $O(Nlog(N))$. The solution consists of dividing
    the problem into two recursive sub-problems and a third, that is to solved iterated.
    It is, a divide and conquer algorithm.


