    that are less than or equal to the square root of n. The algorithm’s time complexity
    is thus O($\sqrt{N}$).


    Within the number theory, Fermat''s Lesser Theorem is says:


    If $p$ is a prime goes for all $n=1,2,3,...,p-1$ that $a^{p-1} \equiv 1 \mod(p)$


    This result can be used to determine if a number is a prime, for if $a^{n-1}$
    is not equivalent to 1 modulo $n$, then is $n$ necessarily a composite number,
    but if $a^{n-1} \equiv 1 \mod(n)$ is $n$ possibly a prime number. Indeed, there
    are actually natural numbers such that $a^{n-1} \equiv 1 \mod(n)$ and so $n$ is
    not a prime. As a step towards an algorithm that tests whether $n$ is a prime
    you can start with


    ```

    select a random number a, 1 < a < n-1

    if (^n-1) % n == 1) n is probably a prime

    else n is not a prime

    ```


