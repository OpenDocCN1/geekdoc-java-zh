    Let $(y_k, \dots, y_n)$ be an optimal solution to $P_{k-1}(d)$ with the value
    $f_{k-1}(d)$. That is


    ```

    $f_{k-1}(d) = \sum_{i=k}^{n} p_i y_i$

    ```


    According to the above $(y_{k+1}, \dots, y_n)$ an optimal solution to $P_k(d -
    w_k y_k)$, and then


    ```

    $f_k(d - w_k y_k) = \sum_{i=k+1}^{n} p_i y_i$

    ```


    That is


    ```

    $f_{k-1}(d) = \sum_{i=k}^{n} p_i y_i = \sum_{i=k+1}^{n} p_i y_i + p_k y_k = f_k(d
    - w_k y_k) + p_k y_k\n=\max(f_k(d), f_k(d - w_k) + p_k)$

    ```


    where the last identity follows from $y_k$ being either 0 or 1. That is, that
    one can decide

    f_{k-1}$ from $f_k$. This is where the dynamic comes in, because $f_n$ is trivial
    unless one can successively

    dide $f_k$ and as the last $f_0$. The formula is that


    +   1. $f_n(d) = 0$ for all $d > 0$

    2. $f_k(0) = 0$ for all $k$

    3. $f_k(d) = -\infty$ for all $d < 0$

    4. $f_{k-1}(d) = \max(f_k(d), f_k(d - w_k) + p_k) k = n, n-1, \dots, 0$


