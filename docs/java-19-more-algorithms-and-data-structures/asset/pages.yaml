    If you have to exchange an amount amount, the strategy is to determine the minimum
    number of coins that will be used to exchange all amounts


    +   1, 2, 3, ..., amount


    You start by deciding how many coins to exchange 1, which is 1. Then you iterates
    all amounts from 1 through amount. For each value $a$, you iterates over all coins
    $c$ (denoted as $c1, ..., cn$), all coins whose value is smaller or equal to $a$,
    and you determines


    ```

    m = min { exchange(a - c1), ..., exchange(a - cn) }

    ```


    Then the minimum number of coins to be used to exchange $a$ equals $m + 1$. A
    little more formally, the method can be described as:


    ```

    amount = the amount to be exchanged

    values[1..amount] coins to exchange

    loop a from 1 to amount

    {

    min = a

    loop c for all coins

    {

    if (c.value() <= a

    {

    min = coins to exchange a - c.value() + 1

    }

    values[a] = min

    }

    return values[amount]

    ```


    You should note that it is precisely an algorithm based on dynamic programming
    by determining the result for all values less than or equal to the desired amount,
    and constantly applying solutions to minor problems that have already been solved.


