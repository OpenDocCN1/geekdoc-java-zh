    and end vertex contains all vertices exactly once. You should note that it is
    an oriented

    graph and that usually between two vertices there be an edge in both directions,
    but

    it does not have to be the case, nor is it necessary that the two roads in both
    directions

    have the same length.


    The problem, of course, has practical interest (even in many different situations).
    The problem

    has been formulated in the early ''30s and has been of great theoretical interest,
