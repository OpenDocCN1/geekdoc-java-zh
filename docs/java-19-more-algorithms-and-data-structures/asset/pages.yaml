    One way to implement a graph is using a 2-dimensional array. Consider again the
    graph:


    ![](img/943e62ea3705f1e2f8a9e0682925e139_135_0.png)


    If you use a 2-dimensional array, which indexes are the vertices of the graph
    and you in

    elements in the array, writes the weights of the edges, you can represent the
    graph as follows:


    | A | B | C | D | E | F | G | H |

    |---|---|---|---|---|---|---||}{

    | A | 2 | 7 | 3 | | | | |

    | B | | 1 | | 3 | | | |

    | C | | | | 1 | | 4 | 1 |

    | D | | | | | | | 2 |

    | E | | | | | | 5 | |

    | F | | | | | | 6 | |

    | G | | | | | | | | |

    | H | | | | | 3 | | |


    The empty cells indicates that there is no edge between the two vertices. For
    example, there

    is an edge from A to B with weight 2, but there is no edge from B to A.


    Implementing a graph in this way is somewhat natural, but the way has some major

    disadvantages. The first way is if the graph is dense (has many edges), as the
    matrix

    will get many empty elements and thus a large amount of unused space, but the
    biggest

    problem is that it is difficult to implement graph algorithms effectively as many
    of the

    alorithms result in searches, and as another problem, it is difficult to expand
    the graph

    with new vertices, and even worse to delete vertices. For these reasons and because
    most

    graph are sparse in practice, usually another implementation is used, where the
    graph

    implemented as a list where each node connects the vertex as well as a list of
    edges from

    that vertex.'
