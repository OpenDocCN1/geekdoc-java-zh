    # 8.4 SHORTEST PATH


    It''s a whole family of algorithms, all of which aim to find a path from one vertex
    to

    another vertex, but that it is the shortest path. Usually, the algorithms are
    implemented

    so from a starting vertex they finds the shortest path to all other vertices in
    the graph,

    where there is a path. In order for the algorithms to make sense, one has to measure
    something

    and it is the weights get into the picture. By the shortest path from one vertex
    to\another vertex is meant a path so the sum of the edges that are part of the

    path is minimal. For example, if considering the graph, is the shortest path from
    A

    to I is (A, C, G, I), which has the length (or cost) 9. It is easy to figure out
    in this case,

    but with a more complex graph it is nevertheless easy. I described the problem
    as finding

    t shortest path, but of course you can also look at the problem finding the longest
    path,

    an the difference will be primarily to reverse the inequalities. In the following,
    I will only

    focus on the shortest paths.


    ![](img/943e62ea3705f1e2f8a9e0682925e139_155_0.png)


    # MinPath


    Shortest path algorithms are naturally defined for weighted graphs. However, I
    want to start

    sewhere else and look at a non-weighted graph where the shortest path should measure

    the number of edges, and the task is to find a path from a starting vertex to
    any other

    vertex, but that the path has as few edges as possible. The algorithm can be described

    as follows:


    ```

    Set C = the start vertex

    Set the distance to C to 0

    Enqueue C in a queue

    repeat as long the queue is not empty

    C = Dequeue the queue

    repeat for all edges from C

    if there not already found a shortest path to E

    Set distance to E to distance to C + 1

    Note the predecessor to E as C

    Enqueue E in the queue

    ```


