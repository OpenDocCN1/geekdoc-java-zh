    \n# 8.5 TOPOLOGICAL SORT\n\nI will now look at an algorithm that performs a so-called\
    \ topological sorting. It is an algorithm that relates to oriented graphs without\
    \ cycles – also called acyclic graphs. A topological sorting arranges the vertices\
    \ in an oriented acyclic graph in such a way that there is a path from U to V\
    \ then V appears U.\n\nNote first that the requirement for an acyclic graph is\
    \ necessary, for else if two vertices U and V are vertices of a cycle, there will\
    \ be a path both from U to V and from V to U:\n\n![](img/943e62ea3705f1e2f8a9e0682925e139_173_0.png)\n\
    \nas [U, W, V] and [V, U]. Note not that a topological sorting makes sense for\
