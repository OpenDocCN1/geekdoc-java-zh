  md: '# JAVA 19: MORE ALGORITHMS AND DATA

    STRUCTURES: SOFTWARE DEVELOPMENT

    GREEDY ALGORITHMS


    If this problem is to be solved using a greedy algorithm, the method is


    +   - Set all variables $x_i$ to 0

    - Set the solution to empty

    - If all containers are selected, you are done

    - Select the container among those that are not already loaded with the least
    weight

    - If the weight of that container plus the weight of solution is greater than
    the capacity, you have finished

    - Add the selected container to the solution (set $x_i$ to 1).

    - Go to step 3


    This means that every time you load the container with the least weight if there
    is room for it. Firstly, you should consider whether the above provides a solution,
    but it is apparent from 3 and 5: You are done when there are no more containers
    or if the weight exceeds the capacity. Secondly, one should consider whether it
    is an optimal solution, by replacing one of the containers in the solution with
    another will increase the weight of the solution, thus not making room for more.
    In each step, the most promising candidate is chosen and added to the solution
    without regard to other circumstances. Therefore, the method is greedy.


