    Back there is the class Mazes which fills a part, but the most important is the
    implementation

    of the above two algorithms.


    To create a new maze, start creating the cells and placing them in a GridPane.
    From start

    all walls exist and the user interface only shows a number of squares:


    ![](img/943e62ea3705f1e2f8a9e0682925e139_69_0.png)


    and the task is now random to remove walls until the maze is made. Now you can
    just

    remove walls by random, because the maze must be detachable, so there''s a way
    through

    it. Here is where you can use the class DisjointSet. If the maze as above 10 rows
    and

    20 columns, there are 200 cells, and if you arrange these cells in an array and
    using

    DisjointSet there is a path through the maze when the first and the latter belong
    to the

    same equivalence class. The algorithm should therefore work as follows:


    ```

    select random cell

    select a neighbour cell

    if (these cells do not belong to the same equivalence class) {

    break down walls between the two cells

    repeat the above until the first and last cell belong to the same

    eivalence class

    ```


    In principle, the algorithm is quite simple and works, but it has a problem as
    it can

    provide groups of cells that are closed and to where you cannot move the red square.
    There

    blem can be solved by changing the last statement in the algorithm to:


    ```

    repeat the above until all cells belongs to the same equivalence class

    ```


    The algorithm will then break down more walls, and the red square can be moved
    to all

    cells. That''s what I called a difficulty, because it basically gives a maze,
    which is harder to

    find through, as there are more options to go in the wrong direction. The downside
    is that

    the algorithm has a poor time complexity, as you can observed by a large maze.'
