  md: "# JAVA 19: MORE ALGORITHMS AND DATA\nSTRUCTURES: SOFTWARE DEVELOPMENT\n\nThis\
    \ is of course not a safe algorithm, but it can be improved by using the following\
    \ theorem, which originates originates from number theory:\n\nIf $p$ is a prime\
    \ the equation $x^2 \\equiv 1 \\pmod{p}$ only has the solutions $1$ and $p-1$\
    \ within the\nset $\\{1,2,...,p-1\\}$.\n\nTo implement a correcting algorithm,\
    \ you can start by noticing the following method\nat raises $x$ to the power of\
    \ n:\n\n```\npublic static long pow(long x, long n)\n{\n    if(n == 0) return\
    \ 1;\n    if(n == 1) return x;\n    if(n % 2 == 0) return pow(x * x, n / 2);\n\
    \    else return pow(x * x, n / 2) * x;\n}\n```\n\nIf you use that you can calculate\
    \ modulus $n$ in each iteration, and use that $n$ from the\nbeginning is uneven\
    \ and add an additional parameter $k$, which from the beginning is\n$n-1$ and\
    \ use one of the last above methods, test for prime can be written in the\nmanner:\n\
    \n```\nprivate static long fermat(long a, long k, long n)\n{\n    if (k == 0)\
    \ return 1;\n    long x = fermat(a, k / 2, n);\n    if (x == 0) return 0;\n  \
    \  long y = (x * x) % n;\n    if (y == 1 && x != n - 1) return 0;\n    if (k %\
    \ 2 != 0) y = (a * y) % n;\n    return y;\n```\n\nYou can now write a method that\
    \ is parallel to isPrime() and tests if an integer is a prime\nnumber:\n\n```\n\
    public static boolean isPrime(long n, int t)\n{\n    if (n == 2 || n == 3 || n\
    \ == 5 || n == 7) return true;\n    if (n < 11 || n % 2 == 0) return false;\n\
    \    for(int i = 0; i < t; i++) {\n        if (fermat(random(2, n - 2), n - 1)\
    \ != 1) return false;\n    }\n    return true;\n```\n\nDownload free eBooks at\
    \ bookboom.com"
