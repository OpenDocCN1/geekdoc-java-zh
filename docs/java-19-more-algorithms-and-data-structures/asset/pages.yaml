    GREEDY ALGORITHMS


    # #2 GREEDY ALGORITHMS


    There is a family of algorithms known as greedy algorithms, which try to construct
    an optimal solution to a problem through a number of steps. In each step, based
    on given criteria, a decision is chosen to be deemed the best choice towards a
    final solution to the problem.


    A greedy algorithm is performed in phases or steps, which performs in each phase,
    what seems to be the best, but without interfering with future consequences. This
    means that you always find a local best solution and then use a “what you can
    get now” strategy and hence the name of algorithms. When the algorithm stops,
    one hopes that the local best solution is close to the optimal solution. If so,
    the algorithm is correct, but otherwise it is a sub-optimal solution.


    Immediately, it is not obvious which such algorithms can be used, but typically
    its algorithms are easy to implement and also effective, and in situations where
    one does not necessarily need an optimal solution, a greedy algorithm can be quite
    reasonable.


    A little abstract, you can formulate the solution of a greedy algorithm as follows:


    +   - C: a collection of candidates for a solution

    - S: the collection of selected candidates

    - solution(): checks whether a candidate of candidates is a solution

    - feasible(): which checks whether a collection of candidates can lead to a solution

    - select(): which returns the best candidate for a solution


    One of the classics of a greedy algorithm is the so-called repayment problem (or
    coin problem), where you have to exchange an amount in few coins (money units)
    as possible. One can think of the problem in relation to a vending machine where
    a person throws in more money than costs and the vending machine will then return
    the excess amount, but with as few coins as possible. To describe the solution
    of this problem by using a greedy algorithm, $b$ is the amount to be returned,
    it could be something like the following:


    +   - C: the holding of coins

    - S: the coins to be thrown back

    - solution(): the value of $S$ is equal $b$

    - feasible(): if the machine contains the coin and it can be used

    - select(): the largest coin that can be used


