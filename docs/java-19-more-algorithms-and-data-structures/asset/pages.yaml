    # 7.2 RED-BLACK TRESS


    As mentioned above, you do not directly implement a 2-3-4 tree, among other things
    because there are several kinds of nodes, and both insertion and deletion results
    in many special cases. However, you can easily convert a 2-3-4 tree to a binary
    tree, which is called a red-black tree, and the result becomes a reasonably balanced
    tree. The idea is that all links between two nodes are assigned a color that is
    either red or black. It is said that a node is black if its parent''s link is
    white while a node is red if its parent link is red. A 2-3-4 tree can be transformed
    into a binary tree as follows:


