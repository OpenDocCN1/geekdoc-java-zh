  md: '# JAVA 19: MORE ALGORITHMS AND DATA

    STRUCTURES: SOFTWARE DEVELOPMENT


    # BACKTRACKING


    Then there is the last algorithm where it is the machine that has to find through
    the maze:


    ![](img/943e62ea3705f1e2f8a9e0682925e139_70_0.png)


    Here the program will try to find through the maze. The program uses a strategy
    where it tries to go to the right if possible and if it is a place where it has
    not already been. If it is not possible then it try next to the same guidelines
    to go down, then left on finally up. If it cannot reach any of the places, it
    must backtrack until it comes back to a cell from which it can go on. In principle,
    it is simple (but not particularly effective) and the only challenge is to keep
    track of which cell to go in backtracking. It can be solved simple with a stack.


    ![](img/943e62ea3705f1e2f8a9e0682925e139_70_1.png)


