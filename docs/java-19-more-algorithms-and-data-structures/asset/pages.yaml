    GRAPHS


    Not only is the implementation of Bellman Ford more difficult to understand, it
    also has a poorer time complexity than Dijkstra. Dijkstra basically consists of
    an iteration over the vertices, and what must happen for each vertex depends on
    the number of direct successors. If the graph is thin (few edges), it means the
    complexity of Dijkstra with good approximation is as shown above. In Bellman Ford
    you must at worst compare all paths with edges (every time you try with an edge,
    you must at worst check what it means for all paths) and the result therefore
    has the worst complexity that is O(EV) where E is the number of edges and V is
    the number of vertices.


