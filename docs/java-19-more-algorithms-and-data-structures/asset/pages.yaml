  md: "# # OTHER ALGORITHMS\n\nAbove I mentioned 4 different algorithm templates that\
    \ are well known, and if you want to write an algorithm and the solution is not\
    \ obvious, you can consider whether one of the above paradigms can be used. If\
    \ so, it can provide guidelines for the problem's solution as well as an indication\
    \ of the complexity of the solution. Now, however, not all algorithms be characterized\
    \ by these descriptions, and in this chapter I will give a few examples of algorithms\
    \ that can not.\n\n# ## 6.1 BRUTE FORCE ALGORITHMS\n\nI have previously mentioned\
    \ brute force algorithms, which are simply solving a problem by trying all the\
    \ possibilities. In principle, there is nothing wrong with these kinds of algorithms,\
    \ and you often can not do anything else. As an example, below is shown an algorithm\
    \ that determines the divisors in a negative integer:\n\n```\npublic class BruteForce\
    \ {\n    private static final Random rand = new Random();\n    private static\
    \ final long N = 100000;\n\n    public static void main(String[] args) {\n   \
    \     for (int i = 0; i < 10; i++) {\n            List<Long> list = divisors(Math.abs(rand.nextLong())\
    \ % N);\n            if (list.size() < 100) {\n                for (Long t : list)\
    \ System.out.print(t + \" \");\n                System.out.println();\n      \
    \      } else System.out.println(\"Number of divisors: \" + list.size());\n  \
    \      }\n    }\n\n    private static List<Long> divisors(long t) {\n        List<Long>\
    \ list = new ArrayList<>();\n        for (long d = 1; d <= t; ++d) if (t % d ==\
    \ 0) list.add(d);\n        return list;\n    }\n}\n```"
