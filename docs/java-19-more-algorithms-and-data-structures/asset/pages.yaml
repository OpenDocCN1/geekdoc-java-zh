    \ Dijkstra's algorithm can not be used immediately. The problem is that once you\
    \ have found a shortest path to a vertex – the current vertex – a successor with\
    \ a negative weight can lead to a shorter path to one of the vertices you have\
    \ already determined the shortest path. Another problem is that if a negative\
    \ weight is included in a cycle, the cycle can lead to a shorter and shorter distance,\
