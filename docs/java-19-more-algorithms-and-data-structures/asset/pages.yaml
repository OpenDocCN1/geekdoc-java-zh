    To save an activity, it is decided for each activity to save only the name of
    the activity, its duration and successors. All variables relating to calculations
    are not saved, and it is the same for the critical paths and the total duration
    of the project. The reason is to make it simple to save an activity plan, but
    then you need to recalculate the plan for each load. An activity plan is saved
    as a simple single text file with one line for each activity, and the above example
    is saved as:


    ```

    A;1;C

    C;3;F

    B;2;D

    D;4;F

    E;4;G

    F;2;H

    G;2;H

    H;1;

    ```


    The method calc() must calculate the earliest and most recent times as described
    during the analysis. First, the activities must be sorted as in the shown diagrams.
    An activity plan can be perceived as an oriented graph, where each activity is
    a vertex, and a successor represents an edge. You can therefore arrange the activities
    by creating a corresponding graph and performing a topological sorting. Then the
    calculations corresponding to what is shown during the analysis can be done


    +   1. Calculate the earliest times at an iteration from start to finish

    2. Calculate the latest times in an iteration in the opposite direction

    3. Calculate the total slack and the free slack in an iteration from start to
    finish

    4. Determine the critical paths starting with activities where the earliest start
    is 0 and the total slack is 0 and determine the critical paths using backtracking'
