  md: "# JAVA 19: MORE ALGORITHMS AND DATA\n\n# SOFTWARE DEVELOPMENT: OTHER ALGORITHMS\n\
    \nIs the number called N the algorithm simply try to divide with all natural numbers\
    \ that are less than or equal to N. Typically, brute algorithms are simple (as\
    \ is the case here too), but the problem is the complexity and above it is O(N)\
    \ and there is, of course, nothing wrong with that, if N is large, the algorithm\
    \ slows down.\n\nAs mentioned, it is not always possible to do much than a brute\
    \ force algorithm (think of linear search), but if you have a brute force algorithm\
    \ to solve a problem, there is reason to consider whether there is a better algorithm.\n\
    \n# 6.2 RANDOMIZED ALGORITHMS\n\nAs another kind of algorithms, I would like to\
    \ mention algorithms whose complexity depends on randomly chosen values. These\
    \ are algorithms where it can be difficult to specify the time complexity and\
    \ where one can only specify the complexity with one or other probability, but\
    \ it can also be algorithms that determine the correct result with a given probability.\
    \ Perhaps it may be difficult to imagine the use of algorithms where one can not\
    \ be sure of the result, but if an algorithm is very complex and takes very long\
    \ time, a result that is likely to be correct, but better than numbers at all.\n\
    \nIn the previous book, I have treated Quick sort as an O(Nlog(N)) sorting algorithm,\
    \ in least average, but at worst, the complexity can be square, which occurs if\
    \ the array is already sorted or almost sorted. The complexity depends on how\
    \ lucky you are with the choice of pivot point and there are several techniques\
    \ for solving this problem. When I examined quick sort I argued for choosing the\
    \ median as the pivot point, but another option is to choose the pivot point,\
    \ which also provides a good solution.\n\nAs another example of how random values\
    \ can be included in algorithms, I will again look at the prime algorithm where\
    \ the classic is:\n\n```\npublic static boolean isPrime(long n)\n{\n  if (n ==\
    \ 2 || n == 3 || n == 5 || n == 7) return true;\n  if (n < 11 || n % 2 == 0) return\
    \ false;\n  for (long t = 3, m = (long)Math.sqrt(n) + 1; t <= m; t += 2)\n   \
    \ if (n % t == 0) return false;\n  return true;\n}\n```\n\nIn fact, it is nothing\
    \ but an improved brute force algorithm, where it has been found that it is enough\
    \ to divide with all odd numbers and it is enough to try with all numbers"
