    cycle and, for example, I would like to mention one. If a graph has $n$ vertices,
    where $n$ is greater than or equal to 3, and if


    $\forall v \in V: \deg(v) \geq \frac{n}{2}$


    the graph has a Hamiltonian cycle. The statement is proved in the field of graph
    theory.


    # 9.2 MORE ON COMPLEXITIES


    If you consider a Hamiltonian cycle in a complete graph with $n$ vertices and
    a start vertex, then you from the start vertex can go to $n-1$ other vertices.
    From there are $n-2$ options to go to the next vertex and next there are $n-3$
    options, and that there are $(n-1)!$ options to go all the way around. Since there
    are opportunities for the starting vertex, the graph contains $n!$ Hamiltonian
    cycles. Now it''s not so wrong, because each cycle has an opposite cycle, where
    the difference is only if you go the way or the other. One can conclude that for
    a given start vertex, the maximum number of Hamiltonian cycles is


    $((n-1)!)$


    which corresponds to a permutation of the vertices. One can then solve TSP with
    a brute force algorithm, that for a given graph and at a given start vertex, determine
    all Hamiltonian cycles and then determine the one with the smallest path length.
    The problem is simply that the factorial grows incredibly fast, and therefore
    a just larger TSP problems require another approach. The idea is to divide a TSP
    problem into sub-problems and hope that they are of a simpler complexity class.


    A complexity class covers a family of problems that has a complexity that resembles
    each other. If a problem can be solved with a time complexity expressed by means
    of a polynomial, it is said that the problem''s complexity is P, and that it applies
    to most of the problems I''ve shown in this and the previous book, as linear algorithms,
    square algorithms, and more.


    A decision problem is whose solution is either a yes or no. A family of problems
    that can be solved by a deterministic algorithm is said to be in the complexity
    class NP. TSP is such a problem the problem can be formulated as:


    Given an non-directed graph and the distances between all vertices, does there
    exist a Hamiltonian cycle whose distance is less than $c$, for some given total
    distance $c$?


    This is a yes or no question, and thus it is a NP problem.'
