    # 5 BACKTRACKING


    Often the algorithm to solve a problem is obvious, but in other contexts it may
    be difficult to find an algorithm, and in particular it may be difficult to choose
    the correct algorithm. In this chapter, I will look at a family of algorithms,
    known as backtracking, and it is best characterized as a systematic way to search
    for a solution to a problem by reviewing all possible solutions. As an example,
    I will look at the so-called Eight Queens Problem:


    A chessboard consists of 64 fields organized in a square with 8 rows and 8 columns.
    In a chess game, the queen can be moved horizontally in a row, vertically and
    diagonally, thus striking another piece on one of the places to which the queen
    can be moved. The problem now is to place 8 queens on a chessboard none of them
    can strike each other.


    One solution to the problem could be to let a computer systematically review all
    of the options until a solution is found. A chessboard consists of choosing 8
    out of 64 fields and the number of ways to do it is the binomial coefficient ,
    which is the number 4426165368 so that even on a fast computer it is not a particularly
    passable road. However, the problem can be reduced by observing that each row
    can contain no more than one queen, and the same applies to each column. It significantly
    reduce the problem. For each of these options, check that none of the queens can
    hit each other diagonally. The method can be further improved by proceeding systematically.
    You start by placing a queen in the first column of the top row. Next, place a
    queen in the second column by starting at the top of the column and continuing
    until you find a place where it can not strike the queen in the first column.
    Now continue with the third column where you start at the top and go down until
    you find a place where it cannot strike one of the first queens. You then continue
    as long as possible. When placing a queen in the sixth column, it goes wrong.
    Whichever row you try, it will be able to strike one of the five queens that are
    located.


