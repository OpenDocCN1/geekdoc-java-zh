    \ continue searching\nuntil you to a leaf that contains the element's successor\
    \ (it may be either\nt largest element that is smaller than the element to be\
    \ deleted), or it may be\nthe smallest element larger than the element to be deleted).\
    \ The easiest way is to\nadjust the top tree, as described below, such that the\
    \ leaf node you reach is\not a 2-node. If that is the case, the element in the\
    \ node marked (the element to\nde deleted) can immediately be replaced by the\
    \ successor in the leaf node.\n- If the element to be deleted is in a leaf node\
    \ and it is not a 2-node, the element\nbe deleted immediately.\n- If the element\
    \ to be deleted is in a leaf node and it is a 2-node, the tree must be\nadjust\
    \ as described below.\n- Perform the following adjustments of the tree if on the\
    \ road from the root to the\nabove node you meet a 2-node (but not for the root,\
    \ which is specially treated):\n  1. If parent is a 2-node and the sibling nodes\
    \ is also 2-node, all three nodes\narecombinedto to a new 4 node. The parent's\
    \ current node will never be\na 2-node.\n  2. If there is a sibling on one of\
