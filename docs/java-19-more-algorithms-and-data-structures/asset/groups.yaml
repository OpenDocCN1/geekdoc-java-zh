    # 8.3 TRAVERSING A GRAPH


    As the above graph is implemented, it immediately supports traversing the graph
    and returnsnan iterator that can be used to iterate over all vertices. The problem
    with this iterator, however,

    is that it does not guarantee anything in which order you reach the individual
    vertices.

    Typically, you are interested in starting in a certain vertex and then moving
    forward

    the edges of the graph according to one or another rule. Two ways are called respectively


    +   1. dept first traversing

    2. breadth first traversing


    For both ways, you begin from a start vertex.


    # Depth first


    At depth first, you will then go to the start vertex, and them followed by a successor
    to that

    vertex (if there is one that you have not already visited). This continues until
    you can not

    are any vertices (you have reached deep in the graph as you). Then backtrack

    until you reach a vertex where you go to a successor where you have not been.

    Finally, you cannot go any further either because you visited all vertices or
    because

    there is a vertex for which there are no paths from the start vertex. Looking
    at the above

    graph, the result of a first depth traverse start in A could be:


    A B E I G F C D H


    Note that there are other sequences, because the algorithm does not tell you what
    to do

    if there are more options, that is if you are in a vertex, and there are more
    successors that

    you have not visited.


    The procedure can be described a little more precisely as follows:


    ```

    Set C = the start vertex

    Print C and mark it as handled

    Push C on a stack

    Repeat as long as the stack is not empty

    C = Peek the stack

    E = a none marked successor to C

    If E is null

    Pop the stack

    Else

    Print E and mark it as handled

    Push E on the stack

    ```


