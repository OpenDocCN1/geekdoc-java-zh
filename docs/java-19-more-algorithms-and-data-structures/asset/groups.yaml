    # TRAVELING SALESMAN PROBLEM


    This and the previous book have provided algorithms and data structures, and I
    will end

    with a chapter that presents a problem, the literature referred to as The Traveling
    Salesman

    Problem or short TSP. The problem is formulated as follows:


    Given a number of cities and roads with road length between the cities, the task
    is

    determine a route from a particular city and back so that the route visits each
    city

    exactly once and so that the total route length is minimal.


    Similar to the previous chapter, the task can be formulated as finding the shortest
    path

    through an oriented weighted graph when the road must be a cycle that almost start
    the

    and end vertex contains all vertices exactly once. You should note that it is
    an oriented

    graph and that usually between two vertices there be an edge in both directions,
    but

    it does not have to be the case, nor is it necessary that the two roads in both
    directions

    have the same length.


    The problem, of course, has practical interest (even in many different situations).
    The problem

    has been formulated in the early ''30s and has been of great theoretical interest,
    but

    when I want to mention the problem here, it is partly as an example of a very
    complex

    problem, and partly as an example of a problem in which not a solution is known
    - at least

    ot a general solution. However, there are algorithms that find local solutions
    for TSP, and

    in the following I will mention an example. It should be added that both the theory
    and

    t number of algorithms are extensive and the following does not go much further
    than a

    short presentation, but it may be a good practice to investigate what you can
    find online,

    including the many examples of algorithms.


    # 9.1 MORE ON GRAPHS


