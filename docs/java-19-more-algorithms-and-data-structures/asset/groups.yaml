    B 树的特点是大扇出——或者说此就是全部：大扇出和低深度。对于所有叶子节点，这意味着它们包含了许多指向子树的指针（这些指针始终为空），为了避免这种情况，你通常会实现\
    \ B 树的一种变体，称为 B+ 树。B+ 树具有两种节点：\n\n- 内部节点\n- 叶子节点\n\n内部节点的格式与通用搜索树中的节点相同：\n\n![](img/943e62ea3705f1e2f8a9e0682925e139_124_0.png)\n\
    ![](img/943e62ea3705f1e2f8a9e0682925e139_124_1.png)\n\n但没有数据指针，只有搜索值和指向子树的指针。通常情况下，内部节点必须符合与\
    \ B 树相同的标准，但关于子树有以下要求：\n\n- 如果 $P$ 是第一个指针，则子树 $P$ 中的所有值 $X$ 都满足 $X < K_1$\n- 如果\
    \ $P$ 是最后一个指针，则子树 $P$ 中的所有值 $X$ 都满足 $X \\ge K_{m-1}$\n- 如果 $P$ 是第 $i$ 个指针且 $i\
    \ < m$，则子树 $P$ 中的所有值 $X$ 满足 $K_{i-1} \\le X \\le K_i$。即叶子节点包含搜索值 $K$\n\n![](img/943e62ea3705f1e2f8a9e0682925e139_125_0.png)\n\
    \n其中 $Q$ 指针是数据块的指针，它们根据键进行排序。$BTree$ 类实现了 B+ 树，但其实现与 $BTree$ 类不同，此时节点类型被定义为内部类：\n\
    \n```java\nprivate abstract class Node {\n    List<K> keys;\n}\n```\n\n而具体的节点定义如下：\n\
    \n```java\nprivate class InnerNode extends Node {\n    List<Node> children;\n\n\
    \    private class LeafNode extends Node {\n        List<V> values;\n        LeafNode\
    \ next = null;\n    }\n}\n```\n\n该类定义为：\n\n```java\npublic class BTree<K extends\
    \ Comparable<K>, V> implements Iterable<V> {\n    private Node root = null; //\
    \ 树的根\n    private int count = 0; // 树中的元素数量\n    private int order = 0; // 树的阶数\n\
    }\n```\n\n代码主要由两个节点类组成，但为了方便工作，`Tools` 类扩展了一个二分搜索方法：\n\n```java\npublic static\
    \ <T extends Comparable<T>> int binSearch(List<T> list, T element) {\n    int\
    \ a = 0, b = list.size() - 1;\n    while (a <= b) {\n        int m = (a + b) /\
    \ 2;\n        if (list.get(m).equals(element)) return m; else (list.get(m).compareTo(element)\
    \ < 0) a = m + 1; else b = m - 1;\n    }\n    return -(a + 1);\n}\n```\n\n该方法在数组内部列表中进行搜索，但重要的是未找到元素时的返回值，即元素应该所在的索引但带有负号。Java\
    \ 的集合类以相同的方式实现二分搜索。`BTree2` 在单个节点内部使用二分搜索，上述实现使得向下搜索树变得容易。\n\n此外，`ArrayList` 类（以及\
    \ `List` 接口）已更改，以便该类扩展了一个删除区间内所有元素的新方法：\n\n"
