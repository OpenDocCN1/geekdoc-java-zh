    ![](img/943e62ea3705f1e2f8a9e0682925e139_70_3.png)\n\n# OTHER ALGORITHMS\n\nAbove\
    \ I mentioned different algorithms that are well known, and if you want to write\
    \ an algorithm and the solution is not obvious, you can consider whether one of\
    \ the above paradigms can be used. Now however, not all algorithms be characterized\
    \ by these descriptions and in this chapter I will give a few examples of algorithms\
    \ that can.\n\n## 6.1 BRUTE FORCE ALGORITHMS\n\nI have previously mentioned brute\
    \ force algorithms, which simply solve a problem by trying all possibilities.\
    \ In principle, there is nothing wrong with these kinds of algorithms, and you\
    \ often can do anything else. As an example, below is shown an algorithm that\
    \ determines divisors of a random integer:\n\n```java\npublic class BruteForce\
    \ {\n    private static final Random rand = new Random();\n    private static\
    \ final long N = 10000;\n\n    public static void main(String[] args) {\n    \
    \    for (int i = 0; i < 10; i++) {\n            List<Long> list = divisors(Math.abs(rand.nextLong())\
    \ % N);\n            if (list.size() < 100) {\n                for (Long t : list)\
    \ System.out.print(t + \" \");\n                System.out.println();\n      \
    \      } else \n                System.out.println(\"Number of divisors: \" +\
    \ list.size());\n            }\n    }\n\n    private static List<Long> divisors(long\
    \ t) {\n        List<Long> list = new ArrayList<>();\n        for (long d = 1;\
    \ d <= t; ++d) \n            if (t % d == 0) list.add(d);\n        return list;\n\
    \    }\n}\n```\n\n# JAVA 19: MORE ALGORITHMS AND DATA STRUCTURES: SOFTWARE DEVELOPMENT:\
    \ OTHER ALGORITHMS\n\nFor the number called N the algorithm simply tries to divide\
    \ with all natural numbers that are less or equal to N. Typically, brute algorithms\
    \ are simple (as is the case here too), but the problem is the complexity and\
    \ it is O(N) and there is, of course, nothing wrong with that if N is large, the\
    \ algorithm slows down. As mentioned, it is not always possible to do much better\
    \ than a brute force algorithm (think of linear search), but if you have a brute\
    \ force algorithm to solve a problem, there is reason to consider whether there\
    \ is a better algorithm.\n\n## 6.2 RANDOMIZED ALGORITHMS\n\nAs another kind of\
    \ algorithms, I would like to mention algorithms whose complexity depends on randomly\
    \ chosen values. These are algorithms where it can be difficult to specify the\
    \ time complexity and where one can only specify the complexity with some other\
    \ probability, but it can also be algorithms that determine the correct result\
    \ with a given probability. Perhaps it may be difficult to imagine the use of\
    \ algorithms where one cannot be sure of the result, but if an algorithm is very\
    \ complex and takes very long time, a result that is likely to be correct is better\
    \ than none.\n\nIn the previous book, I have treated Quick sort as an O(N log\
    \ N) sorting algorithm, in least average, but at worst, the complexity can be\
    \ square, which occurs if the array is already sorted or almost sorted. The complexity\
    \ depends on how lucky you are with the choice of pivot point and there are several\
    \ techniques for solving this problem. When I examined quick sort I argued for\
    \ choosing the median as the pivot point, but another option is to choose a random\
    \ pivot point, which also provides a good solution.\n\nAs another example of how\
    \ random values can be included in algorithms, I will again look at the prime\
    \ algorithm where the classic is:\n\n```java\npublic static boolean isPrime(long\
    \ n)\n{\n  if (n == 2 || n == 3 || n == 5 || n == 7) return true;\n  if (n < 11\
    \ || n % 2 == 0) return false;\n  for (long t = 3, m = (long)Math.sqrt(n) + 1;\
    \ t <= m; t += 2)\n    if (n % t == 0) return false;\n  return true;\n}\n```\n"
