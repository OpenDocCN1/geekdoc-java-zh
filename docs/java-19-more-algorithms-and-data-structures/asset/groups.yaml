    \ `HuffmanTree`（即叶子节点）放入优先级队列中，优先级就是频率。接下来的 `while` 循环多次合并树：队列中的前两棵树被合并，并将结果放入优先级队列中。最后，队列中只剩一棵树，通过这段代码，两个\
