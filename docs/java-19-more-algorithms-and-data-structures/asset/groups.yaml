    )\n\n删除删除删除删除删除：\n\n![](img/943e62ea3705f1e2f8a9e0682925e139_95.png)\n\n## 7.2\
    \ 红黑树\n\n如上所述，你直接实现 2-3-4 树是为了其他目的，因为删除有多种情况。但是，你可以将 2-3-4 树转换为二叉树，这种树被称为红黑树。在这种情况下，所有的链接被分配为红色或黑色。如果一个节点是黑色的，那么它是平衡的。2-3-4\
    \ 树可以如下转换为二叉树：\n\n- 2 节点映射到二叉节点，两个子节点都是黑色的：\n\n![](img/943e62ea3705f1e2f8a9e0682925e139_95_1.png)\n\
