    # # DYNAMIC PROGRAMMING


    As illustrated several times in the previous, many problems can be described using
    a recursive algorithm, perhaps because the problem is recursive by nature. Implementing
    recursive algorithms is easy, but as mentioned, it can lead to algorithms that
    are highly ineffective because the number of recursive calls explodes. The classic
    example of such an algorithm is a recursive method to determining the Fibonacci
    numbers, and here the solution was to write an iterative method. It is an example
    of dynamic programming. The idea is to state with a simple case that can be solved.
    You now save the solutions and proceed, but so that the next solution is determined
    by the solutions already decided. The iterative algorithm to determine the Fibonacci
    numbers starts by determining the first two (which is 0 and 1). Then you continue,
    but so that you always decide the next number as the sum of the two previous ones.
    That is, starting with the simple case and gradually moving forward. It is opposite
    recursion, starting with the complex case and breaking up in minor problems until
    one reaches a simple case.


