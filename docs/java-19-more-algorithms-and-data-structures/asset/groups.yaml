    # 3 DIVIDE AND CONQUER


    Another family of algorithms is *divide and conquer*, and it is algorithms that
    are recursive, but not all recursive algorithms are divide and conquer algorithms.
    A divide and conquer algorithm consists of two parts:


    +   1. *Divide*: The problem is divided into two or more disjunctive or simpler
    problems, which are resolved recursively if the basic case is not reached.

    2. *Conquer*: The solution to the original problem is found by combining the solutions
    of the sub-problems.


    Classic examples of divide and conquer problems are merge sort and quick sort,
    but also to find the *kth* smallest element in a collection and thus the median
    is solved with a divide and conquer algorithm.


    Therefore, in order to use a divide and conquer algorithm, a problem must be divided
    into smaller sub-problems, each of which is solved recursively according to the
    same template. Here it is important to note that the division should result in
    sub-problems that are simpler than the original problem. It is also important
    to note that the division should result


    ![](img/943e62ea3705f1e2f8a9e0682925e139_30_0.png)


