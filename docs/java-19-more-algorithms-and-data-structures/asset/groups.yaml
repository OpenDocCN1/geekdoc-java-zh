    \n## 9.1 关于图的更多内容\n\n为了 TSP（旅行商问题），我想对图添加一些额外的定义/备注，$G = (V, E)$ 指代图。\n\n如果两个顶点之间存在边，则称这两个顶点是相邻的。顶点\
