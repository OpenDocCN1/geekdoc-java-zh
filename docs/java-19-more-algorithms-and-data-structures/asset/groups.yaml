- md: "\n# JAVA 19: MORE ALGORITHMS AND DATA STRUCTURES: SOFTWARE DEVELOPMENT\n\n\
    ## MORE ABOUT TREES\n\nAs an example, I have shown below what happens if you construct\
    \ a 2-3-4 tree consisting of the elements A, T, B, N, C, L, G, J, I and inserted\
    \ in this order:\n\n![](img/943e62ea3705f1e2f8a9e0682925e139_90_0.png)\n\nSuppose\
    \ that you then have to insert K. The insertion must take place in a 4-node, and\
    \ it is therefore necessary to split again:\n\n![](img/943e62ea3705f1e2f8a9e0682925e139_91_0.png)\n\
    \nwhere then J bubbles up in the tree. Since J must also be inserted in a 4-node,\
    \ it is necessary to split again:\n\n![](img/943e62ea3705f1e2f8a9e0682925e139_91_1.png)\n\
    \nThe result is that G becomes a new root, as shown below. Interestingly, the\
    \ result is a balanced-tree. In this case it is a tree with 10 elements and the\
    \ height 2.\n\n![](img/943e62ea3705f1e2f8a9e0682925e139_92_0.png)\n\nDeleting\
    \ an element is more difficult (there are several cases), and it is based on rotations\
    \ and fusions of nodes (it merges 2-nodes together to a single 4 node). Deleting\
    \ an element can be described as follows:\n\n- Find the element to be deleted.\n\
    - If the element is not a leaf node, you mark the position and continue searching\
    \ until you reach a leaf that contains the element's successor (it may be either\
    \ the largest element that is smaller than the element to be deleted, or it may\
    \ be the smallest element larger than the element to be deleted). The easiest\
    \ way is to adjust the tree tree, as described below, such that the leaf node\
    \ you reach is not a 2-node. If that is the case, the element in the node marked\
    \ (the element to be deleted) can immediately be replaced by the successor in\
    \ the leaf node.\n- If the element to be deleted is in a leaf node and it is not\
    \ a 2-node, the element can be deleted immediately.\n- If the element to be deleted\
    \ is in a leaf node and it is a 2-node, the tree must be adjusted as described\
    \ below.\n- Perform the following adjustments of the tree if on the road from\
    \ the root to the above node you meet a 2-node (but not for the root, which is\
    \ specially treated):\n  1. If parent is a 2-node and the sibling nodes is also\
    \ 2-node, all three nodes are combined to a new 4 node. The parent's current node\
    \ will never be a 2-node.\n  2. If there is a sibling on one of the sides that\
    \ is not a 2-node, a rotation with this sibling is performed. As a result, elements\
    \ from the sibling are moved to parent, while an element from parent moves to\
    \ the current node, which is then a 3-node.\n  3. If there is no sibling with\
    \ more than one value, a fusion is performed with the parent and a sibling. The\
    \ result is a new 4-node.\n\nThe procedure can be illustrated by a few examples.\
    \ Suppose that in the above tree you want to delete I. On the way to I, you will\
    \ not meet 2-nodes (except for the root), so no adjustments will be made to the\
    \ tree. You are in a 2-node and have a sibling that is not a 2-node. Therefore,\
    \ a rotation must be performed where K moves up one level while J moves down to\
    \ the same node as I, which can then be deleted. The result is as shown below:\n\
    \n![](img/943e62ea3705f1e2f8a9e0682925e139_93_0.png)\n\nSuppose then you want\
    \ to delete J. On the way down to J there are no 2-nodes, so there is no adjustment\
    \ of the tree. J is a 2-node, and its sibling is also a 2-node, and therefore\
    \ there must be fusion of the two nodes containing J and the element K from the\
    \ parent. The result is a 4 node from which J can be deleted:\n\n![](img/943e62ea3705f1e2f8a9e0682925e139_93_1.png)\n\
    \nFinally, suppose you also want to delete K. When searching for K, you come to\
    \ N, there is a 2-node, and since its sibling is also a 2-node, there must be\
    \ fusion:\n\n![](img/943e62ea3705f1e2f8a9e0682925e139_93_2.png)\n\nThen the search\
    \ can continue and you get to the node containing K and the element can immediately\
    \ be deleted, since it is not a 2-node:\n\n![](img/943e62ea3705f1e2f8a9e0682925e139_93_3.png)\n\
    \nAssume as the last example that you want to delete G. You mark the node containing\
    \ G and continue searching to the successor:\n\n![](img/943e62ea3705f1e2f8a9e0682925e139_94_0.png)\n\
    \nL's siblings are 2-node so there must be a fusion with one of them, for example\
    \ T:\n\n![](img/943e62ea3705f1e2f8a9e0682925e139_94_1.png)\n\n![](img/943e62ea3705f1e2f8a9e0682925e139_94_2.png)\n\
    \nAfter that, L must replace G in the selected node:\n\n![](img/943e62ea3705f1e2f8a9e0682925e139_95_0.png)\n\
    \n## 7.2 RED-BLACK TREES\n\nAs mentioned above, you do not directly implement\
    \ 2-3-4 tree, among other things because there are several kinds of nodes, and\
    \ both insertion and deletion results in many special cases. However, you can\
    \ easily convert a 2-3-4 tree to a binary tree, which is called a red-black tree,\
    \ and the result becomes a reasonably balanced tree. The idea is that all links\
    \ between nodes are assigned a color that is either red or black. It is said that\
    \ a node is black if its parent's link is white while a node is red if its parent\
    \ link is red. A 2-3-4 tree can be transformed into a binary tree as follows:\n\
    \n- A 2-node is transformed into a binary node with two black children (which\
    \ may be empty):\n\n![](img/943e62ea3705f1e2f8a9e0682925e139_95_1.png)\n\n- A\
    \ 3-node is mapped to two binary nodes, one being red (there are two options):\n\
    \n![](img/943e62ea3705f1e2f8a9e0682925e139_95_2.png)\n\n- Finally, a 4-node is\
    \ mapped to three binary nodes, where both children are red:\n\n![](img/943e62ea3705f1e2f8a9e0682925e139_96_0.png)\n\
    \nThe result of this transformation is as follows, and is then the definition\
    \ of a red-black tree:\n\n1. There cannot be two red nodes next to each other\
    \ (in the above figures, links whose successors are not all black).\n2. As the\
    \ black depth of a node, you understand the number of black links from the root\
    \ to the appropriate node. In a red-black tree, all leaf nodes have the same black\
    \ depth. This is because all red links correspond to 3-nodes and 4-nodes and therefore\
    \ do not contribute to the height of the resulting 2-3-4 tree.\n3. There is no\
    \ link to the root, and it is assumed that it means that the root is black.\n\n\
    Consider as example the 2-3-4 tree shown:\n\n![](img/943e62ea3705f1e2f8a9e0682925e139_96_1.png)\n\
    \nIf you convert it into a red-black tree, the result is:\n\n![](img/943e62ea3705f1e2f8a9e0682925e139_96_2.png)\n\
    \nHere you should note that there are not two red nodes that are successors, and\
    \ that all leaf nodes have the same black depth. A red-black tree is not balanced,\
    \ but if you are counting black links it is. A red-black tree is especially a\
    \ binary search tree and therefore, all that has been said in the previous book\
    \ about binary search trees, including balanced search trees, are still validly\
    \ understood that it is possible to implement insertion and deletion so that the\
    \ requirements for a red-black tree is maintained. It is possible, but it's not\
    \ simple.\n\nI will start with insertion. Above I described insertion into a 2-3-4\
    \ tree as a search down the tree to find where the new element is to be inserted\
    \ and followed by a return to split any 4-nodes that are filled up. That is, there\
    \ was both a top-down pass and a bottom-up pass (similar to the AVL tree). It\
    \ is possible to perform this in a top-down pass by ensuring that the new element\
    \ is not inserted into a full 4-node. This can be done by searching down the tree\
    \ and split all the 4 nodes encountered in two 2-nodes.\n"
  mdcn: "\n\n# JAVA 19：更多算法与数据结构：软件开发\n\n## 关于树的更多内容\n\n作为一个示例，我在下方展示了如果你构建一个包含元素\
    \ A, T, B, N, C, L, G, J, I 的 2-3-4 树，并按照此顺序插入它们，会发生什么：\n\n![](img/943e62ea3705f1e2f8a9e0682925e139_90_0.png)\n\
    \n假设你需要插入 K。插入必须在一个 4 节点中进行，因此需要再次进行分裂：\n\n![](img/943e62ea3705f1e2f8a9e0682925e139_91_0.png)\n\
    \n此时 J 在树中向上浮动。由于 J 也必须插入在一个 4 节点中，因此需要再次进行分裂：\n\n![](img/943e62ea3705f1e2f8a9e0682925e139_91_1.png)\n\
    \n结果是 G 变成了新的根节点，如下。有趣的是，结果是一棵平衡树。在这种情况下，它是一个具有 10 个元素且高度为 2 的树。\n\n![](img/943e62ea3705f1e2f8a9e0682925e139_92_0.png)\n\
    \n删除元素要困难得多（有几种情况），它是基于节点的旋转和融合的（它将两个 2 节点合并为一个单个 4 节点）。删除元素的操作可以描述如下：\n\n- 找到要删除的元素。\n\
    - 如果该元素不是叶子节点，你标记该位置并继续搜索，直到到达包含该元素后继节点的叶子节点（该后继可能是小于要删除元素的最大元素，也可能是大于要删除元素的最小元素）。最简单的方法是按照下文所示调整树，使得你到达的叶子节点不是\
    \ 2 节点。如果是这种情况，被标记节点中的元素（要删除的元素）可以立即被叶子节点中的后继节点替换。\n- 如果要删除的元素在叶子节点中且该节点不是 2 节点，可以直接删除该元素。\n\
    - 如果要删除的元素在叶子节点中且该节点是 2 节点，则必须按照下文调整树。\n- 如果在从根节点到上述节点的路径上遇到 2 节点（根节点经过特殊处理），请执行以下树调整：\n\
    \  1. 如果父节点是 2 节点且兄弟节点也是 2 节点，则所有三个节点合并为一个新的 4 节点。父节点的当前节点永远不会是 2 节点。\n  2. 如果一侧有一个不是\
    \ 2 节点的兄弟，则与该兄弟进行旋转。结果是将兄弟节点中的元素移动到父节点，同时将父节点的一个元素移动到当前节点，该节点随后变为 3 节点。\n  3.\
    \ 如果没有具有多个值的兄弟节点，则与父节点和兄弟进行融合。结果是一个新的 4 节点。\n\n该过程可以通过几个示例来说明。假设在上面的树中你想删除 I。在通往\
