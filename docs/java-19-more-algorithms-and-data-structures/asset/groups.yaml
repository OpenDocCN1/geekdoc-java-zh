    3. 将最小圆盘移动到左杆\n\n# JAVA 19: 算法与数据结构：软件开发\n动态规划\n\n# 动态规划\n\n正如前几次所示，许多问题可以使用递归算法来描述，也许是因为问题本质上是递归的。实现递归算法很容易，但正如提到的，它可能导致效率极低。这种算法的经典例子是确定斐波那契数的递归方法，而这里的解决方案是编写迭代方法。这种思想是从可以解决的简单情况开始。你现在保存解决方案并继续，使得下一个解决方案由已经确定的决定。确定斐波那契数的迭代算法从确定前两个数（0\
