    完全图是指任意不同顶点都相邻的图：\n\n![](img/943e62ea3705f1e2f8a9e0682925e139_191_0.png)\n\n在上一章中，我将两个顶点之间的路径定义为连接这两个顶点的边序列。那时允许同一个顶点出现多次，但在本章中，我希望路径除了第一个和最后一个顶点外，由不同的顶点组成。特别是，环路没有重复。\n\
