    # 8.6 MINIMUM SPANNING TREE


    A tree can be perceived as a graph with a starting element, because a tree consists
    of nodes (vertices) and each node has a unique parent (edge). Since each node
    has exactly one parent, it is an acyclic graph. Generally, a graph is not a tree,
    but given an non-oriented weighted graph, for example


