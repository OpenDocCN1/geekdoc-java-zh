    That is a "nicely" balanced search tree of the order $n$ is the depth $\log_n(t)$
    where $t$ is the number of elements, and you can at worst find an element by searching
    in $\log_n(t)$ nodes. Note that you can use binary search in the individual nodes.
    Suppose that you have a search tree of the order 100 and 100000000 elements. In
    the worst case, you to search in


    ```

    $\log_{100}(10000000) = \frac{\log_{10}(10^7)}{\log_{10}(100)} \sim 4$

    ```


    nodes. The example tells us that a balanced search tree has a very small depth,
    and that is the exact goal, search trees are usually used for data stored on disk.
    One loads disk block at a time, and reading a disk block takes a long time compared
    to memory operations, it is important to have few disk operations — afterwards
    you have to search the individual disk blocks, but it happens in memory.


    It is possible to implement a search tree, as described above, but it does not
    have the great interest, as its efficiency is completely dependent on the tree
    is balanced, and since it should also be so that the individual nodes are not
    nearly empty. I would like to describe a variant that accommodates these two conditions.
    It is thus a data structure that implements a generally tree that is reasonably
    balanced and ensures a good search complexity, but as mentioned, it is a data
    structure that primarily has interest for objects that are permanently stored
    on disk as the time to search the individual nodes can be significant.


    # 7.5 B TREES


    A B tree of the order $n$ is a search tree of the order $n$, but where the data
    elements inserted are a pair of the form $[K, Q]$, where $K$ is the key and $Q$
    is the pointer to the place where the data of the key $K$ is stored. Could be
    for example (and in practice it will) the address of a disk block. Similarly,
    a B tree can be illustrated as:


    | P1 | K1 | Q1 | P2 | K2 | Q2 | P3 | K3 | Q3 | ... | Pm-1 | Km-1 | Qm-1 | Pm |


