    graph is weighted and we can then determine the least spanning tree which is a
    spanning tree so the distance from the root to the vertices is minimal.


    There are several algorithms to determine the least spanning tree for a non-oriented
    weighted graph, and I will show a very simple algorithm called Prim''s algorithm.
    The procedure is:


