    MORE ABOUT TREES


    # 7 MORE ABOUT TREES


    In the previous book I have treated binary trees, and especially binary search
    trees. As an example of a balanced binary search tree, I have shown an AVL tree.
    In this chapter I will look a bit more on trees, where I will partly show the
    implementation of another balanced binary search tree, called a red-black tree,
    and I will also give an introduction to general search trees.


    # 7.1 2-3-4 TRESS


    Before looking at the implementation of a red-black tree, I will look at a tree,
    which is called a 2-3-4 tree, which is a tree of degree 4 and hence a tree where
    a node can have more than 4 children. I do not want to implement the tree, but
    it can be used to explain another method of balancing binary trees.


