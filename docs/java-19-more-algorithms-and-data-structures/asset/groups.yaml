    \ for all $j$ from 1 to $n$\n4. Else backtrack until you find one that can be\
    \ used. Of course, you should be careful that during the placement of a number\
    \ do not try the same number several times. It can be formulated in the following\
    \ algorithm:\n\n```\npackage permutations;\n\nimport java.util.*;\n\npublic class\
    \ Permutation {\n    private int[] arr = null;\n\n    private Permutation(int\
