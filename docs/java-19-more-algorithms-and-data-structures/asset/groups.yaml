    | update(...) | freeSlack: int |

    | calc() | successors: IList<Activity> |


    Here is the class Activity, a rather simple model class that has variables for
    the attributes associated with an activity. The Activities class is in principle
    a list of Activity objects. In addition, there is a list of critical paths and
    a variable that indicates the duration of the entire project. Otherwise, the class''s
    methods will allow you to save and open activity charts. In addition, there are
    methods for maintaining the plan, and finally there is a method that calculates
    the times.'
