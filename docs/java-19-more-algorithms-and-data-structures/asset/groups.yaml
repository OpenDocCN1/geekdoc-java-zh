    - 如果该集箱的重量加上解的重量超过了容量，则任务完成\n- 将所选的集箱添加到解中（将 $x_i$ 设置为 1）。\n- 回到第 3 步\n\n这意味着每当有空间时，都会装载重量最小的集箱。首先，你应该考虑上述方法是否提供了解决方案，但从步骤\
