    \     * 修改边 [from, to] 的权重，或者如果没有权重则分配新权重。\n     * @param weight 新权重\n     * @param\
    \ from 起点\n     * @param to 终点\n     * @throws PaException 如果边不存在\n     */\n \
    \   void setWeight(double weight, T from, T to);\n\n    /**\n     * 添加一个顶点。\n\
    \     * @param elem 顶点的元素\n     * @throws PaException 如果图中已存在该元素的顶点\n     */\n\
    \    void add(T elem) throws PaException;\n\n    /**\n     * 向图中添加边 [from, to]。如果图中已存在边\
