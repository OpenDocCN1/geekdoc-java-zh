    # JAVA 19: MORE ALGORITHMS AND DATA STRUCTURE: SOFTWARE DEVELOPMENT


    # MORE ABOUT TREES


    ![](img/943e62ea3705f1e2f8a9e0682925e139_113_0.png)


    If you want to search for a particular element in such a tree, you search recursively
    through the tree until you either find the element or find that the element is
    not there. Assume that, for example, you will search for the number 89 in the
    tree:


    - 1. by searching in the root you can find that if the number is in the tree it
    must be in the right sub-tree

    - 2. by searching in the root of this sub-tree you can deduce if 89 is found in
    the tree it must be in the left sub-tree

    - 3. by searching in the root of this sub-tree you can once again find that the
    number is in the left sub-tree

    - 4. and searching in the root of this sub-tree (which is a leaf node) the number
    is found


    It was therefore necessary to visit 4 nodes. Assume, as another example, that
    you want to find the number 47:


    - 1. when searching in the root you can find if the number is in the tree it must
    be in the sub-tree as the pointer to 23 and 71 points to

    - 2. by searching in the root of this sub-tree you will find that the number be
    in the sub-tree to the right of 43, but it is empty, and thus 47 are not found


    The tree thus has in many ways the same characteristics as a binary search tree.


    At worst, you have to go down to the lower level to determine if an element exists
    or does not exist (just in the same as in a binary search tree). Suppose the tree
    that is “nicely” balanced. If you start searching in the root, it corresponds
    to selecting a sub-tree of $t/n$. Repeating the search here, you select next sub-tree
    with $t/n^2$ elements. After repeating the operation $k$ times, you have a sub-tree
    with $t/n^k$ elements. In the worst case, you have finished the search


    ```

    $n^t = 1 \Rightarrow t = n^k \Rightarrow \log_n(t) = k$

    ```


    That is a "nicely" balanced search tree of the order $n$ is the depth $\log_n(t)$
    where $t$ is the number of elements, and you can at worst find an element by searching
    in $\log_n(t)$ nodes. Note that you can use binary search in the individual nodes.
    Suppose that you have a search tree of the order 100 and 10000000 elements. In
    the worst case, you to search in


    ```

    $\log_{100}(10000000) = \frac{\log_{10}(10^7)}{\log_{10}(100)} \sim 4$

    ```


    nodes. The example tells us that a balanced search tree has a very small depth,
    and that is the exact goal, search trees are usually used for data stored on disk.
    One loads disk block at a time, and reading a disk block takes a long time compared
    to memory operations, it is important to have few disk operations — afterwards
    you have to search the individual disk blocks, but it happens in memory.


    It is possible to implement a search tree, as described above, but it does not
    have the great interest, as its efficiency is completely dependent on the tree
    is balanced, and since it should also be so that the individual nodes are not
    nearly empty. I would like to describe a variant that accommodates these two conditions.
    It is thus a data structure that implements a generally tree that is reasonably
    balanced and ensures a good search complexity, but as mentioned, it is a data
    structure that primarily has interest for objects that are permanently stored
    on disk as the time to search the individual nodes can be significant.


    # 7.5 B TREES


    A B tree of the order $n$ is a search tree of the order $n$, but where the data
    elements inserted are a pair of the form $[K, Q]$, where $K$ is the key and $Q$
    is the pointer to the place where the data of the key $K$ is stored. Could be
    for example (and in practice it will) the address of a disk block. Similarly,
    a B tree can be illustrated as:


    | P1 | K1 | Q1 | P2 | K2 | Q2 | P3 | K3 | Q3 | ... | Pm-1 | Km-1 | Qm-1 | Pm |


    where the P pointers are as in the ordinary search tree, while the Q pointers
    point to that blocks. In addition, the tree must meet:


    - All nodes except the root and leaf nodes have at least $[n/2]$ P pointers (that
    is at least $[n/2]$ sub-trees).

    - The root has at least two P pointers unless the root is the only node in the
    tree.

    - All leaf nodes are on the same level, and a leaf node is characterized by all
    P pointer zero.


    For example, a B tree of the order 4 is shown below (note that I have not shown
    the Q pointers):


    ![](img/943e62ea3705f1e2f8a9e0682925e139_115_0.png)


    ![](img/943e62ea3705f1e2f8a9e0682925e139_115_1.png)


    These requirements ensure that the tree is reasonably balanced and the challenges
    are to implement insertion and deletion of elements in such a way that the above
    requirements are always respected. Inserting an element in B tree can be described
    as follows:


    A B tree starts with a single root node, and elements are insert as long as space
    is available. When the root is filled up add the next element, the root is split
    into two node at level 1. The middle element will stay in the root while the remaining
    elements are split between the two new nodes. If an element is inserted into a
    filled node the root is split into two nodes at the same level and the middle
    element is moved to the parent node. If it then filled, the process is repeated,
    and it eventually ends with the creation of a new root.


    Below is the result of inserting the following elements into the above tree: 2,
    3, 5, 7, 41, 53, 29, 31, 37, 63, 59 the order shown. When you split a node, there
    are 4 elements where the middle must be moved to the parent node, while the others
    to distributed over two child nodes. For technical reasons, I do not want to show
    room for the pointers in the individual nodes, and the starting point is thus
    the following tree:


    ![](img/943e62ea3705f1e2f8a9e0682925e139_116_0.png)


    Below is what happens to the tree as the 11 numbers are inserted. Here 2 has been
    inserted:


    ![](img/943e62ea3705f1e2f8a9e0682925e139_116_1.png)


    After 3 is inserted:


    ![](img/943e62ea3705f1e2f8a9e0682925e139_117_0.png)


    After 5 is inserted:


