    \ 30% 或更多），出现的字符越少，程序的压缩效果就越好。\n\n# JAVA 19: 更多算法与数据结构：软件开发\n\n分治法\n\n## 3 分治法\n\
    \n另一类算法是*分治法*，它们是递归算法，但并非所有的递归算法都是分治算法。分治算法由两部分组成：\n\n- *划分 (Divide)*：将问题划分为两个或多个互斥或更简单的问题，如果还没有达到基本情况，则递归地解决这些问题。\n\
    - *解决 (Conquer)*：通过组合子问题的解决方案来找到原始问题的解决方案。\n\n分治问题的经典例子是合并排序和快速排序，此外，寻找集合中第 *k*\
    \ 小的元素（从而找到中位数）也是通过分治算法解决的。\n\n因此，为了使用分治算法，重要的是划分产生的子问题应该比原始问题更简单。\n\nimg/943e62ea3705f1e2f8a9e0682925130\n\
    \n# JAVA 19: 更多算法与数据结构：软件开发\n分治法\n\n## 3.1 最近点\n\n作为分治算法的一个例子，我将考虑所谓的最近点问题。在坐标系中给定\
    \ n 个点，问题变为确定点之间的最短距离。可以通过如下进行说明：\n\nimg/943e62ea3705f1e2f8a9e0682925131\n\n#\
    \ JAVA 19: 算法与数据结构：软件开发\n分治法\n\n如果是 n 个点，那么就有 $n(n-1)/2$ 个距离，一个简单的解决方案是确定所有对的距离并选择最小的一个。这种算法简单且易于实现，但显然它具有平方复杂度。因此，寻找更好的算法是显而易见的。\n\
    \n假设你有一个点数组，并且数组按 x 坐标排序。你可以立即将点分成两半：\n\nimg/943e62ea3705f1e2f8a9e0682925132\n\
    \n现在有三种选择：\n\n- 最近的点在左半部分\n- 最近的点在右半部分\n- 最近的点分别在两个部分，即位于直线的两侧\n\n可以通过选择这三个子问题解决方案中最好的（通过点距离衡量）来确定结果。这里前两个子问题很容易解决，因为它们通过对每个子问题重复上述拆分并递归来解决。因此，问题在于解决第三个问题，如果你以线性时间复杂度解决它，它类似于我为合并排序所展示的，该算法的时间复杂度可以为\
    \ $O(NlogN)$。\n\n为了分析中间的问题，$\\delta_L$ 和 $\\delta_R$ 分别表示左、右子问题的解（点之间的最小距离），并设置\
    \ $\\delta = min\\{\\delta_L, \\delta_R\\}$。令 $\\delta_C$ 表示第三个子问题的解。现在只有当 $\\\
    delta_C$ 小于 $\\delta$ 且点落在分割线附近的带状区域时，才有意义：\n\n"
