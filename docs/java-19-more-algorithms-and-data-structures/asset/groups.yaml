    # JAVA 19: 更多算法与数据结构：软件开发回溯


    # 5 回溯


    通常解决问题的算法是显而易见的，但在其他语境下，可能很难找到算法，特别是很难选择正确的算法。在本章中，我将介绍一组被称为回溯的算法，它最好的特征是：通过检查所有可能的解决方案来系统地搜索问题的解。例如，我将介绍所谓的“八皇后问题”：


    棋盘由 64 个方格组成，排列成 8 行 8 列的正方形。在象棋中，皇后可以在水平、垂直和对角线方向移动，从而攻击皇后可以移动的位置上的另一个棋子。现在的问题是在棋盘上放置
    8 个皇后，使得它们之间都不能互相攻击。


    解决这个问题的一种方法是让计算机系统地检查所有选项，直到找到解决方案。一个棋盘涉及从 64 个方格中选择 8 个，方法数为二项系数 $\binom{64}{8}$，即数字
    4426165368，因此即使在快速计算机上也不是一条特别易行的路。然而，通过观察到每行最多包含一个皇后，每列也是如此，可以简化问题。这显著减少了问题规模。对于这些选项中的每一个，检查没有两个皇后会在对角线上互相攻击。可以通过系统地进行进一步改进该方法。你首先在第一行的第一列放置一个皇后。接下来，从顶部开始在第二列放置一个皇后，直到你找到一个不会攻击第一列的位置。现在继续第三列，从顶部开始向下移动，直到你找到一个不会攻击其中一个皇子的位置。


    '
