    After 59 is inserted:


    ![](img/943e62ea3705f1e2f8a9e0682925e139_119_3.png)


    In this case, the number of elements in a full node is odd. If the number is even,
    it is necessary to choose a strategy for which element to move up level – there
    are two options. It does not matter if you choose one or the other.


    When you delete in a B tree, a node may become less than half full, and then a
    node must be combined with a neighbor. You must merge two nodes and it is an operation
    that can propagate up the tree and can result in a tree with a smaller depth.
    In fact, it is not easy to implement deletion. The strategy is roughly as follows.


    You start by finding the node that contains the element to be deleted. Next, as
    in the 2-3-4 tree, the node that contains the element’s successor, is a leaf node,
    should be found. The element to be deleted is replaced with its successor, and
    the successor is deleted in the leaf node. After that it may happen that the leaf
    node is no longer half full, and the result is no longer a B tree, you must now
    adjust the tree. If the node has a direct sibling, which is more than half full,
    the problem can be solved with a rotation, moving an element from this sibling
    to the parent, while moving an element from parent to the leaf where an element
    was deleted. If this is not the case, the leaf node where an element is deleted
    is merged with a neighbor sibling and an element from parent.


    After 2 is deleted. A left rotation has been performed:


