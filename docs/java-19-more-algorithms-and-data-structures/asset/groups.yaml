- md: "\n# JAVA 19: ALGORITHMS AND DATA STRUCTURES: SOFTWARE DEVELOPMENT\n\nThe idea\
    \ is that if you first found the shortest path (like the number of edges) to a\
    \ vertex, you can not do better by going any further. If you consider the graph\
    \ (and all weights) and if you start in A, it is clear that the shortest paths\
    \ to the direct followers B and C are 1 and you can not do it. If you continue\
    \ with B (by taking it from the queue), you have already found a path to its successor\
    \ C, and of course it is not better to count one edge further. Conversely, no\
    \ path has been found to E, and the shortest path becomes the path to B plus 1\
    \ and thus 2. To continue, next time, C will be taken from the queue.\n\nA method\
