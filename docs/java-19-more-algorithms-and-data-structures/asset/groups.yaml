    # JAVA 19：更多算法与数据结构：软件开发


    ## 贪心算法


    在最后一步之前，将权重为 0.30 和 0.28 的两个子树合并：


    ![](img/943e62ea3705f1e2f8a9e0682925e139_22_0.png)


    那里只有最后两个子树的组合：


    ![](img/943e62ea3705f1e2f8a9e0682925e139_22_1.png)


    现在你可以像上面一样，从根节点开始每个字符，每向左一次加 0，每向右一次加 1，从而确定编码：


    | A | 000 | 0.04 | 00000 |

    | :--- | :--- | :--- | :--- |

    | B | 001 | 0.28 | 01 |

    | C | 010 | 0.12 | 100 |

    | D | 011 | 0.08 | 0001 |

    | E | 100 | 0.11 | 101 |

    | F | 101 | 0.19 | 11 |

    | G | 110 | 0.02 | 00001 |

    | H | 111 | 0.16 | 001 |


    # JAVA 19：更多算法与数据结构：软件开发


    这种编码被称为哈夫曼编码（Huffman coding）。例如，如果你有一个 100 字符的文件（在可能的 8 个字符中），并且它们分布在上述表格频率中，在经过第
    2 列编码后，文件将占用 300 位，而在经过第 4 列编码后，文件将：


    ```

    4*5 + 28*2 + 12*3 + 8*4 + 11*3 + 19*2 + 2*5 + 16*3 = 273

    ```


    因此节省了 9%。这听起来并不多，但如果频率差异比上面的例子大，节省的可能会更大。


    上面的编码表示为一棵树，有时被称为代码树（code tree）。它的特点是只有叶节点代表字符，这导致了从位模式可以无歧义地确定该模式代表哪种字符（如果它代表字符的话）。重要的一点是，任何字符的位模式都不可能是另一个字符的前缀。假设你有一个位模式
    0110101100111000101010110001。你现在从根节点开始，沿着树移动直到到达叶节点，这时你就确定有了一个字符。然后再次从根节点开始，沿着树移动直到确定下一个字符，并一直持续直到确定所有字符：


    ![](img/943e62ea3705f1e2f8a9e0682925e139_23_0.png)


