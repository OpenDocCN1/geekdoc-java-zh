    The duration of the project is the largest earliest end time. The calculated project
    duration

    is considered as the most recent recent acceptable end time of the activities
    that constitute the

    completion of the project, that is all activities that have no successors.


    The duration of the project is applied to all activities without successors as
    the last

    time, after which the last start time for these activities can be calculated by
    subtracting the

    duration of the activity from the last end time (Ls = Le-D).


    Most recent start and end times for the other activities can be now calculated
    by scanning

    al activities from right to left. The last end of an activity is determined by
    transferring the

    most recent direct successor (Le = Min (Ls, Ls, ... | all successors).

    The last start time of the other activities is found by subtracting the duration
    of the activity

    from the activity''s latest end time.


    # Critical activities, critical roads and slacks


    After the calculation of the most recent times, the diagram shows which activities
    can be

    temporarily postponed and what activities are fixed. The last category of activities
    that can

    be recognized by the fact that the earliest and most recent end times for each
    activity are

    tame, and they are also called critical activities that constitute one or more
    critical

    paths through the network from start to finish. It is characteristic of a critical
    path that


    +   1. It is measured by the longest way in the network

    2. if the duration of one or more of the activities on a critical path is extended,
    the

    duration of the project will be extended accordingly


    The maximum displacement option for each activity is called the total slack. All
    activities

    on a critical path therefore have a total slack = 0.


    The total slack is calculated on condition that all predecessors are completed
    as early

    possible and all successors begin as soon as possible. The calculation of the
    total slack for an

    activity is done by subtracting the earliest end time from the latest end time
    (Ti = Le - Er).


    A delay in a critical network activity causes a corresponding extension of the
    project''s

    duration, unless the duration of one or more of the subsequent critical activities
    is reduced

    correspondingly to their planned duration. Activities with a small total slack
    must therefore

    be monitored particularly carefully during the project time.


