    ## JAVA 19: ALGORITHMS AND DATA STRUCTURES: SOFTWARE DEVELOPMENT ## FINAL EXAMPLE:
    ACTIVITY PLANNER


    The duration of the project is the largest earliest end time. The calculated project
    duration

    is considered as the most recent recent acceptable end time of the activities
    that constitute the

    completion of the project, that is all activities that have no successors.


    The duration of the project is applied to all activities without successors as
    the last

    time, after which the last start time for these activities can be calculated by
    subtracting the

    duration of the activity from the last end time (Ls = Le-D).


    Most recent start and end times for the other activities can be now calculated
    by scanning

    all activities from right to left. The last end of an activity is determined by
    transferring the

    most recent direct successor (Le = Min (Ls, Ls, ... | all successors)).

    The last start time of the other activities is found by subtracting the duration
    of the activity

    from the activity''s latest end time.


    # Critical activities, critical roads and slacks


    After the calculation of the most recent times, the diagram shows which activities
    can be

    temporarily postponed and what activities are fixed. The last category of activities
    that can

    be recognized by the fact that the earliest and most recent end times for each
    activity are

    the same, and they are also called critical activities that constitute one or
    more critical

    paths through the network from start to finish. It is characteristic of a critical
    path that


    - 1. It is measured by the longest way in the network

    - 2. if the duration of one or more of the activities on a critical path is extended,
    the

    duration of the project will be extended accordingly


    The maximum displacement option for each activity is called the total slack. All
    activities

    on a critical path therefore have a total slack = 0.


    The total slack is calculated on condition that all predecessors are completed
    as early

    possible and all successors begin as soon as possible. The calculation of the
    total slack for an

    activity is done by subtracting the earliest end time from the latest end time
    (Ti = Le - Er).


    A delay in a critical network activity causes a corresponding extension of the
    project''s

    duration, unless the duration of one or more of the subsequent critical activities
    is reduced

    correspondingly to their planned duration. Activities with a small total slack
    must therefore

    be monitored particularly carefully during the project time.


    ## JAVA 19: ALGORITHMS AND DATA STRUCTURES: SOFTWARE DEVELOPMENT FINAL EXAMPLE:
    ACTIVITY PLANNER


    In the same way as it is possible to calculate the displacement option of an activity,
    assuming that all predecessors are completed as early as possible and all successors
    begin as soon as possible, it is also possible to calculate the displacement option
    of an activity, provided that all successors begin as early as possible. This
    displacement is called the free slack. The calculation of the free slack for an
    activity is done by subtracting the activity''s earliest end time from the earliest
    starting time of the activity direct successor:


    ```

    $Fs = Min(Es, Es, ... | (all successors)) - E.

    ```


    The free slack is used in the monitoring of the project. As you usually use the
    earliest and end times when completing a project, it may be nice to know which
    displacement options the activities also have under these assumptions.


    ![](img/943e62ea3705f1e2f8a9e0682925e139_205_0.png)


    # 10.1 TASK DESCRIPTION


    The task is now to write a program that can be used as a tool for calculating
    and printing information about a project and its activities. That is, for each
    activity


    - 1. name

    - 2. duration

    - 3. earliest start

    - 4. earliest end

    - 5. latest start

    - 6. latest end

    - 7. total slack

    - 8. free slack

    - 9. the activity''s direct successors


    and for the whole project


    - 1. the project''s duration

    - 2. the critical roads


    Calculation of times and time reserves can only be done if there is no cycle in
    the schedule. If that is the case, a message must be printed.


    # 10.2 ANALYSIS


    I will start with using simple examples of activity charts and how to perform
    the above calculations. The first chart consists solely of four activities where
    there is a single start activity:


