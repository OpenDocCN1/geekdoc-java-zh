    FOREWORD


    # FOREWORD


    The current book is the nineteenth in this series of books on software development
    in Java, and it is a continuation of the previous book. The book provides examples
    of algorithm paradigms including classic algorithms. In addition, several data
    structures are described, including the implementation of a red-black binary tree.
    General trees are also treated in the form of a B-tree and a B+ tree and are implemented
    as Java classes. A large part of the book is deals with graphs, including how
    a graph can be implemented as a class in Java. In addition, classic graph algorithms
    are described and implemented such as Dijkstra''s algorithm and Prim''s algorithm.
    The book ends with a chapter that introduces the traveling salesman problem, primarily
    as an example of an algorithm, where one does not know any solution that can be
    used in practice.


    As the title says this series of books deals with software development, and the
    goal is to teach the reader how to develop applications in Java. It can be learned
    by reading about the subject and by studying complete programs, but most importantly
    by yourself to do it and write your own programs from scratch. Therefore, an important
    part of the books is exercises and problems, where the reader has to write programs
    that correspond to the substance being treated in the books. All books in the
    series is built around the same skeleton and will consist of text and exercises
    and problems that are placed in the text where they naturally belongs. The difference
    is that the exercises largely deals with repetitions of the substance that is
    presented in the text, and furthermore it is accurately described what to do.
    Problems are in more loosely described, and are typically a little bigger and
    there is rarely any best solution. These books are to be read from start to finish,
    but the many code examples, including exercises and problems plays a central role,
    and it is important that the reader predict in detailing the code to the many
    examples and also solves the exercises and problems or just study the recommended
    solutions.


