    \ 算法是图论中非常著名的算法。该算法相对有效，你可以将其时间复杂度确定为如下所示：\n\n> O(Elog(V))\n\n其中 E 是边的数量，而 V 是顶点的数量。\n\
    \n# Bellman-Ford 算法\n\nDijkstra 算法的一个要求是所有权重都为非负。尽管这种情况并不常见，但并没有规定图不能包含负权重。如果是这样，人们仍然对最短路径感兴趣，但很难确定最短路径，且不能立即使用\
    \ Dijkstra 算法。问题在于，一旦你找到了某个顶点（当前顶点）的最短路径，一个带有负权重的后继节点可能会导致指向已确定最短路径的某个顶点的更短路径。另一个问题是，如果循环中包含负权重，该循环会导致距离越来越短，你将无法确定最短路径。这增加了算法实现的复杂性，我们鼓励你学习相关代码。\n\
    \n# JAVA 19：算法与数据结构：软件开发图\n\nBellman Ford 的实现不仅更难理解，而且时间复杂度也比 Dijkstra 差。Dijkstra\
    \ 基本上由对顶点点的迭代组成，每个顶点必须发生的情况取决于直接后继的数量。如果图是稀疏的（边很少），这意味着具有良好近似效果的 Dijkstra 复杂度如所示。在\
    \ Bellman Ford 中，你最坏必须将所有路径与边进行比较（每当你尝试一条边时，你最坏必须检查它对所有路径意味着什么），因此结果具有最坏复杂度 O(EV)，其中\
    \ E 是边的数量，V 是顶点的数量。\n\n# 练习 10：最短路径\n\n在此练习中，你应该编写一个可以测试三种最短路径算法的程序。从一个名为 GraphTester4\
    \ 的项目开始。首先添加一个方法\n\n```java\nprivate static IGraph<Character> build1()\n```\n\n\
    该方法构建并返回以下图：\n\n![](img/943e62ea3705f1e2f8a9e0682925e139_171_0.png)\n\n你必须写一个方法\
    \ `test1(IGraph<Character> graph)`，该方法对图使用 `minPath()`、`Dijkstra()` 和 `bellmanFord()`\
    \ 方法确定并打印最短路径。使用使用 `build1()` 创建的图测试该方法。\n\n编写一个对应的方法 `test2(IGraph<Character>\
    \ graph)` 执行相同的操作，但仅使用 `bellmanFord()`。编写方法 `build2()` 方法创建一个与上面相同的图，区别在于从 G 到\
    \ H 的边权重为 -6。使用由 `build2()` 创建的图测试 `test2()` 方法。\n\n编写方法 `build3(int n)`，它返回一个\
    \ `IGraph<Integer>`，当按随机添加顶点时，它具有从 1 到 n 的 n 个顶点。该方法还必须添加 20n 条随机边，每条边的权重必须是 0\
    \ 到 1 之间的随机双精度。然后尝试以下测试方法：\n\n# 图\n\n```java\nprivate static void test3() {\n\
    \  StopWatch sw = new StopWatch();\n  for (int n = 1000; n <= 3000; n += 1000)\
    \ {\n    try {\n      IGraph<Integer> graph = build3(n);\n      sw.start();\n\
    \      GraphTools.dijkstra(graph, 1);\n      sw.stop();\n      long t1 = sw.nanoTime();\n\
    \      double z1 = (double) graph.getCount();\n      System.out.printf(\"Dijkstra:\
    \ %d %.6f\\n\", graph.getSize(), t1 / z1);\n      sw.start();\n      GraphTools.bellmanFord(graph,\
    \ 1);\n      sw.stop();\n      long t2 = sw.nanoTime();\n      double z2 = (double)\
    \ graph.getCount();\n      System.out.printf(\"Bellman-Ford: %d %.6f\\n\", graph.getSize(),\
    \ t2 / z2);\n    } catch (Exception ex) {\n      System.out.println(ex);\n   \
    \ }\n  }\n}\n```\n\n你可以用它来测试上述假设是否合理。\n\n# 8.5 拓扑排序\n\n我们现在来看一个执行拓扑排序的算法。它是一种针对有向图算法，也称为无环图。拓扑排序以这种方式排列无环图中的顶点，存在\
    \ U 到 V 的路径。首先注意无环图的要求是必要的，否则如果存在循环，那么 U 到 V 和 V 到 U：\n\n![](img/943e62ea3705f1e2f8a9e0682925e139_173_0.png)\n\
    \n作为 [U, V] 和 [V, U]。注意拓扑排序对于无权图是有意义的。最后，拓扑排序通常有多个解。实现拓扑排序相对简单，最好通过示例来解释。考虑以下图：\n\
    \n![](img/943e62ea3705f1e2f8a9e0682925e139_173_1.png)\n\n并且很容易确定它是无环图。顶点的入度是指前驱节点的数量。入度为\
    \ 0 的顶点没有前驱。这适用于顶点 A，例如 D 的入度为 3。现在的方法是为每个顶点标记入度：\n\n![](img/943e62ea3705f1e2f8a9e0682925e139_174_0.png)\n\
    \n你现在从入度为 0 的顶点开始（如果有多个则选择一个）。这将是拓扑排序中的第一个顶点（所示）。同时，减少所有直接后继顶点的入度。在这种情况下，有 B、C\
    \ 和 D。这些顶点中至少有一个入度变为 0，否则图存在循环。算法现在在每次迭代中选择一个入度为 0 的顶点（如果有多个，选择哪一个都不重要），并将其添加到拓扑排序顶点列表中。此外，将所有直接后继顶点的入度减\
    \ 1。持续到所有节点（可能）都被添加到拓扑排序列表中。下面是第一次迭代的结果：\n\n![](img/943e62ea3705f1e2f8a9e0682925e139_174_1.png)\n\
    \n作为下一步，B 应该被添加到列表中：\n\n![](img/943e62ea3705f1e2f8a9e0682925e139_174_2.png)\n\n"
