    \ [B, G] 位于桥下方：\n\n![](img/943e62ea3705f1e2f8a9e0682925e139_191_1.png)\n\n如果你有一个完全图，显然存在哈密顿回路，因为每对顶点之间都有边，但如果图不是完全的，你就无法确定这一点。例如，如果一个图有一条桥，则不存在哈密顿回路，因为如果起始顶点在桥的一侧，如果不通过桥就无法跨到另一侧，而且在不再次访问同一个顶点的情况下无法返回。\n\
