    \ \\dots, y_n)$ 为 $P_{k-1}(d)$ 的最优解，值为 $f_{k-1}(d)$。即：\n\n```\n$f_{k-1}(d) = \\\
    sum_{i=k}^{n} p_i y_i$\n```\n\n根据上述 $(y_{k+1}, \\dots, y_n)$ 是 $P_k(d - w_k y_k)$\
    \ 的最优解，那么\n\n```\n$f_k(d - w_k y_k) = \\sum_{i=k+1}^{n} p_i y_i$\n```\n\n即\n\n\
    ```\n$f_{k-1}(d) = \\sum_{i=k}^{n} p_i y_i = \\sum_{i=k+1}^{n} p_i y_i + p_k y_k\
    \ = f_k(d - w_k y_k) + p_k y_k\\n=\\max(f_k(d), f_k(d - w_k y_k) + p_k y_k)$\n\
    ```\n\n其中最后一个等式由于 $y_k$ 是 0 或 1 而得出。这意味着可以从 $f_k$ 确定 $f_{k-1}$。这就是动态派上用场的地方，因为除非逐继确定\
    \ $f_k$ 直到最后的 $f_0$，否则 $f_n$ 是平凡的。\n\n"
