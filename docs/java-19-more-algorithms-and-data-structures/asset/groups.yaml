    \n## 9.1 MORE ON GRAPHS\n\nFor the sake of TSP, I would like to add some additional\
    \ definitions/remarks to graphs, and G = (V, E) refers to a graph.\n\nTwo vertices\
    \ are said to be adjacent if there is an edge between the vertices. At the degree\
    \ of a vertex v you understand the number of vertices adjacent to v, and one often\
    \ use the notation deg(v). If the graph has n vertices, the degree of a vertex\
    \ can therefore be max n-1 (if the vertex does not have an edge to itself).\n\n\
    By a complete graph one understands a graph where two different vertices are adjacent:\n\
    \n![](img/943e62ea3705f1e2f8a9e0682925e139_191_0.png)\n\nIn the previous chapter,\
    \ I have defined a path between two vertices as a sequence of edges that connect\
    \ the two vertices. At that point it was allowed that the same vertex could occur\
    \ several times, but in this chapter I would like a path to consist of different\
    \ vertices apart from the first and the last vertex. In particular, a cycle has\
    \ no repetitions for a closed path.\n\nA path that encompasses all vertices in\
    \ the graph is a Hamiltonian path, and in particular, you are talking about a\
    \ Hamiltonian cycle.\n\nIn chapter 7 I have mentioned connected graphs (what all\
    \ the examples shown above have been), exactly one can say that a graph is connected\
    \ if there is a path from A to B for each pair of vertices A and B. If a graph\
    \ is not connected, it means that it consists of several sub-graphs, and here\
    \ each sub-graph is called a component. If you have a connected graph and you\
    \ have an edge where the result of removing the edge is a non-connected graph,\
    \ the edge is called a bridge. For example, the edge [B, G] is below a bridge:\n\
    \n![](img/943e62ea3705f1e2f8a9e0682925e139_191_1.png)\n\nIf you have a complete\
    \ graph, it is clear that there is a Hamiltonian cycle, because there is an edge\
    \ between all pair of vertices, but if the graph is non-complete you can not be\
    \ sure about that. For example, if a graph has a bridge, there is not a Hamiltonian\
    \ cycle, because if the start vertex is on the one side of the bridge, one can\
    \ not cross to the other side without passing the bridge and you can not get back\
    \ again without visiting the same vertex.\n"
