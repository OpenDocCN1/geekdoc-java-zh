  md: '# Silius Italicus Punica, Book 3 69


    People believe—and it is a trustworthy tradition—that the temple’s timbers have
    lasted since it was first built and only known the hands of the men who put them
    in place. Thus people are happy to believe that the god himself sits in the temple
    and wards off decay from his shrine. Those who are allowed and granted the honour
    of entry into the inner sanctum of the temple forbid women from coming into the
    shrine and rebuke swine from crossing the threshold. Before the altar everyone
    wears the same clothes: they cover their bodies in linen, and their heads are
    distinctively adorned with a band of Pelusian flax. It is their custom to offer
    incense in flowing robes and, following the tradition of their ancestors, to distinguish
    their sacrificial robe with a broad stripe. Their feet are bare, their hair is
    shorn, and they keep their bed chaste; on the hearths flames keep alight the altar
    fires. But the absence of an effigy of the god or statues with familiar features
    imbues the place with authority and the awe of sanctity.


    On the doors of the temple there were depicted the labours of Alcides: the Lernean
    Hydra was lying dead, her snaky heads cut off. The strangled head of the lion
    of Cleonae was carved there with its jaws gaping wide.'
