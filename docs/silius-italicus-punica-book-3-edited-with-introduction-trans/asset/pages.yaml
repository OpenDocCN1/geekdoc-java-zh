  md: '# 148 Commentary, line 1


    uota exsoluit nouisque se obligat ut, si cetera prospera euenius. Polybius omits
    the trip to Gades (33) but instead repeats Hannibal winters in Carthage. Moreover,
    the poet may have also in mind the visit by Vespasian to the temple of Serapsis
    in Alexandria, as reported by Tacitus (Hist. 4.82) ut reper rebis conseleret,
    a story that clearly refers back to the Alexander tradition and early Roman history.


    The temple of Melkart (see Map 1) a Punic foundation, but Silius’ depiction is
    a fusion of both the Greco-Roman and Punic traditions (c. Quinn [2018] 117 on
    Epit. 44.5.1–4 where it is explained ‘how the foundation of a colony led to the
    imposition of Carthaginian rule on local kingdoms’). The description of the temple
    of Hercules is found only in Silius whose inspiration derives from Virgil’s description
    of the temple of Juno (A. 1.41–93), Ovid’s temple of Sol (Met. 2.1–18); and Valerius’
    temple of Sol in Colchis (5.41–54); by all these examples, see Bonnet (1988) 216–19
    and Woski (2006) with discussion of Silius at 200–35. Hannibal’s volatile nature
    and superhuman courage leads him, like Hercules, to transgress boundaries that
    separate men from the divine and the mortal (Hardie (1986) 110–19, Feeney (1991)
    158–61). He is cast like a protagonist in a tragedy, with all the traits of a
    Euripean or Senecan hero. Seneca’s choral ode of Ag. 829–62 offers an important
    text exploited by Silius for the description of the Herculean labours, including
    the lion, the mares, and Cerberus. This has underscored the complex relationship
    between Hercules and Hannibal from the very beginning of the poem (see Introduction
    2.1 with Asso (2010), Tipping (2010) 71–3, Stocks (2014) 218–21, and Augustakos
    (2016). At Gades the Carthaginian leader is exposed directly to the cult of Hercules
    and his labours, significantly, openly with death and decapitation and continue
    through pain and suffering to their conclusion on Mount Oeta.


    Of particular importance for Silius is the ekphrasis on the doors of the Herakileion
    in Spain, where the demigod is reported as stone:  ἢ ὁ δῆος, ἐν ἢ τὸ ἱερό, ἐν
