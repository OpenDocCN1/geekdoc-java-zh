    # 61–157. HANNIBAL AND IMILCE


    61–157. Hannibal ensures the safe return home of his wife and child before launching
    his expedition. Hannibal and Imlice address each other and share their thoughts
    and anxieties before parting from each other’s embrace. Hannibal promises eternal
    hatred against the Romans and a magnificent expedition to follow where he intends
    to cross the Alps and penetrate Rome. Castalian Imlice expresses her fears regarding
    her husband’s character and bloodthirstness, while Imlice reassures her that he
    will be victorious.


    Imlice, Hannibal’s wife, follows in the literary footsteps of other women, such
    as Andromache in Homer (II. 6.369–502) or Marcia and Cornelia in Luc (2.326–91
    and 5.722–815), or Tacitus Agriina (Ann. 144). Hannibal returns as a character
    in the following book (4.763–807) to defend her son from being sacrificed, to
    the demands of the Carthaginian city. Julius organizes the episode around a tripartite
    structure, allotting forty-seven lines of speech to Hannibal in two fairly lengthy
    lines (69–96, 133–51), whereas Imlice speaks for nineteen lines (113–27). On Imlice’s
