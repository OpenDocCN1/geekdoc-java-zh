  md: '# Introduction


    witness, on 17 December, the diplomatic negotiations with Vespasian''s generals
    and his brother, Flavius Sabinus, to facilitate a smooth transition of power after
    Vitellus''s abdication.⁸ proved this fruitful. Before Vespasian''s accession could
    be ratified on 21 December, fighting and bloodshed erupted in the streets during
    which both Vitellus and Sabinus were murdered. The blazing spectacle of Jupiter''s
    Capitoline temple, indelently printed on the poet''s imagination, would become
    a recurrent image in *Punica.*⁹


    Following the restoration of order under Vespasian, Silius was appointed proconsular
    of Asia during the mid-sevententies.¹⁰ returning to Rome in 78 after an exemplary
    tenure of office. Now regarded as one of Rome''s leading senators, like his own
    Fabius Maximus (16–603–7), he had no further ambition for power.¹¹ Circumstances
    had set Silius at the head of turbulent Roman politics from his consul Nero to
    the destiny of a senior senator under Vespasian. Not long after his return from
    Asia, perhaps c.80–1 ce, he began to devote his time to composing a Roman historical
    epic which may have been in his mind for some years. His tendency to interweave
    his epic narrative with epigrammatic reflections showed that he saw as a repository
    of wisdom accumulated across a remarkable career. This devotion met Pliny''s description
    of a constant stream of callers eager to spend time in his salon engaged in literary
    or philosophical discussion, when their host was not occupied in painstaking composition.¹²
    His willingness to accept criticism by exposing his work at public readings indicates
    confidence and literary humility.¹³ as the dedication praised by Martial (7.63)
    who gives the impression, in a poem dated c.92 ce, that Silius had devoted much
    of the previous decade to his *Punica.*¹⁴ Although Pliny implies that Silius withdrew
    permanently from Rome shortly before his death, namesake.¹⁵ it is likely that
    by the time Domitian was murdered in 96 and replaced by Nerva, who was already
    spending much of his time in


