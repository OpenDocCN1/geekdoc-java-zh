    Punica describes the journey of an epic hero. The epic topos has its origins in
    the myth of the wandering hero, a cultural construct which emerges from myths
    of colonization, foundation, and ancient conquests. Such journey exposes the epic
    hero to cosmic danger and moral challenges which test his personal valour and
    integrity at time when, separated from family and country, he must rely on his
    own strength and judgement. It is also a test of leadership and respect for the
    gods: the epic hero should guide his companions wisely, scouring places along
    the way and seeking guidance from dreams and oracles. Since Punica belongs to
    the tradition of Roman history, the epic poet cannot change the purpose or the
    direction of Hannibal''s journey. Nevertheless, as we see Hannibal crosses the
    River Rhône (3.44–65), Silius manages the historiographic narrative to create
    the moral dimensions of an epic hero''s formative traversals, assigning motives
    for the transgressive behaviour through intertextual allusions and counter-narratives.


    The anomaly of the journey described in Punica 3 lies in Hannibal''s heroism:
    he is not (and should not be) the epic hero; he is rather a tragic hero. That
    role is reserved for a multiplicity of Roman heroes, but primarily Scipio, who
    are distinguished by their devotion to pietas and fides. In a fictitious confrontation
    with Hannibal at Cannae, Scipio is said to excel the Carthaginian in value to
    surpass his pietate (9.437). This distinction is crucial for appreciating Hannibal''s
    divergence from the initial uncertainty and growing wisdom and understanding of
