  md: '# Silius Italicus Punica, Book 3


    After the Carthaginians had broken the treaty and—with a lack of support from
    the father of the gods—sacked the walls of blameless Saguntum, Hannibal, victorious,
    immediately approached the people living at the limit of the world’s end, especially
    Gades, a city bonded to the Carthaginians by their shared origins. And he also
    decided to consult the wisdom of prophets and their foresight regarding world
    dominion. Bostar was commanded quickly to set sail across the sea and get to know
    the destiny of the enterprise. From long ago people had put their trust in the
    shrine of Hammon, where the horned god is enthroned on high among the thirsty
    Garamantes, competing in reputation with the caves of Cirrhra, and from his prophetic
    grove reveals what is coming in the future. From here Hannibal was seeking an
    omen for the campaign he had begun, both to know the outcome in advance and discover
    the changing fortunes of the war.


    Then he came to venerate the altar of the club-bearing god with gifts he had captured,
    half-burned, from the citadel of smoking Saguntum after his victory.'
