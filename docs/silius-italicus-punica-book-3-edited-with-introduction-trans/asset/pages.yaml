    Already the time is approaching when Rome will be greater through her misfortunes
    rule the world. Then war suffering will raise names worthy of my heavenly realm:
    Paulus, Fabius, and Marcellus, who has pleased me through winning the supreme
    spoils. By their wounds these men will win for Latium an empire so great that
    their descendants will not be able to destroy it through luxury nor decadence.
    And already a man is born who will drive the Carthinian out of Latium and recall
    him to his father; he will strip Hannibal of his arms before the walls of his
    own Carthage. From then on, Cytherea, your descendants will rule for a long period.
    After that, godlike valour will ascend to the stars from Cures: a warlike race,
    born and bred in the olive-bearing Sabine land, will exalt the name of the sacred
    Julii. Of those, the father will live to conquer Thule and will be the first to
