    # 442–76. HANNIBAL CROSSES THE RIVERS RHONE AND DURATION


    Silius’ native narrative of Hannibal’s Rhône crossing shows a striking divergence
    from the historiographic accounts of Polybius (3.42–51) and Livy (21.26–32), who
    prioritize reactions to Hannibal’s arrival at the Rhine over the neighbouring
    Gauls and Scipio’s Roman army, newly dismarked at Massia. An inescapable element
    in the historiographic narrative is Hannibal’s decision to march north from the
    sea and Italy by land. With variance this, the sea has a destiny-changing role
    in the epic journeys of, for example, Odysseus, Aeneas, and Jason. Silius responds
    to this literary lacuna by leading the Carthaginian army through wild and uninhabited
    subalpine landscape, escalating his poetic register to heights of sublimity as
    Hannibal exults in his conquest of the Alpine peaks.


    In no way does the poet engage with the Carthaginians’ encounters and skirmishes
    with hostile Gallic tribes, which figure prominently in the historic accounts
