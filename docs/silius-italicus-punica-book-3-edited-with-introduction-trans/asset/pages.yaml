    | sibila (1.95–6). The phrase stare… ante oculos (or ora) usually occurs in the
    context of a spectral apparition when ancestral values are threatened (cf. Stat.
    Teb. 12:1: stant utere ora metus). In this case Hannibal defines these as quae
    horrida sacra. The Roman poet loses no opportunity to allure to barbaric rituals
    practised by the Carthaginian enemy. Spaltenstein doubts that horrida sacra could
    refer to human sacrifice, since this is only a reference to Hannibal’s oath. Nevertheless,
    the junction of child Hannibal with horrida sacra anticipates the threat of child
    which hangs Hannibal’s infant son in book 4. They form a poetic expression of
    Roman anxiety and revulsion in the face of barbaric Carthaginian custom. This
    line of thought leads naturally into the sentiment of life’s brevity, which is
    frequently linked to military exploits; Hannibal encapsulates the Latin carpe
    diem (cf. 4.732: breuis est magni fortuna favorios). The epithet mutabilis is
    commonly applied to the fickleness of fate and the brevity of life; see Tll vii.1715.30.
