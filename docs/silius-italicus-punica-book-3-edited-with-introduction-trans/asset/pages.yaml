  md: '# General Introduction


    +   1. THE POLITICAL LIFE AND LITERARY FORMATION OF SILIUS ITALICUS


    Campbell (1936), McDermott and Orentzel (1977), Pomeroy (1989) and (2016a), Mezanotte
    (2016), RipSoll (1998) 112–32, Marks (2005) 286–8, Augoustakis (2010b) 5–8, Dominik
    (2010) 428–31, Littlewood xv–xix xii–xv, Bernstein (2017) xiii–xv


    Ti. Catius Asconius Silius Italicus was born c.26 CE (between 25 and 29), possibly
    near Patavium in northern Italy. He navigated his forensic and, later, political
    career through a sequence of cataclysmic upheavals, which spanned the disorderly
    demise of Nero in 68, the year of the four emperors in 69, the eruption of Vesvius
    in 79, and the assassination of Domitian in 96. Pliny’s allusion to the only stain
    on an otherwise blameless reputation, activity as a delator under Nero may have
    its roots in the belief that past informers should be punished on the accession
    of a new emperor. According to Martial, whose patron Silius may have been, the
    poet won respect and admiration in the centumviral courts, as well as the lasting
    gratitude of clients.


    Passed the conventional age of 42, Silius became one of the last under Nero in
    68. Amid the turmoil of 69, he is said to have shown tact and discretion in his
    friendship with Vitellius that was trusted to


