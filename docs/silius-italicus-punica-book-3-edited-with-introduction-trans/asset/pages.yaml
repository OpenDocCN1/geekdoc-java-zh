    The spondaic making matur iam prepares for the transformation of the snow-white
    Alpine landscape from the bloodshed, with an important caesura in the fourth foot
    and diaeraesis,²¹⁷ with a repetition in the following line as well (with an anepalisis
    of hic), marking the word niudes iere. As the horses press, on the dactyls dumque
    premi sunt- strive to pick up the pace, only to slow down again in spondences
    since the horses'' hooves are stuck in the snow, followed by the holospondaic
    nec lapsus simplex ab-. The other holospopaedic line emensi noctes optato ends
    in diaresesis, emphasizing both the fulfilment of the Carthaginian wish to cross
    the mountains finally reaching the hoped-for peak (optato), the stern rhythm clearly
    expresses the struggle of this slow process.


