    334. armiger Eoi feon Memnonis Astyr: Silius is the only poet to link Astyr with
    Memnon, by way of phonic similarity, with the Spanish tribe of the Astrians. His
    choice of chariot for Astyr''s military role may have been influenced by Virgil,
    according to Silius, connected his Astyr with the Astrians'' legendary skill as
    horsemen (10.81: Astyr equo). The Astrians were also famous for their skill in
    gold mining, as Silius notes in 1.231–3, and hunting (seeing also on 338–9). The
    mellifluous triyllabic adjective East, eastern, is frequently used by Silius,
    as it is here, in combination with contrasting needless; see also 1.428: et Salaminaccius
    Equois troisque pacreas (cf. 7.636). The opening vowel e may be short in the final
    clausa, as it is in Virgil, A. 2.417: laetius Eoi., Sil. 4.41: ab aoquare Eoo,
    6.2, 9.180, 11.515, 15.223, but otherwise, here it is long: armiger Eoi (cf. also
    2.49, 3.615, 7.636, 13.355, 17.595). The chaotic armiger Eoi... Memnonis Astyr
    punctuated by the emphasized phon in the middle between the caesura.


    335–7. his parus sonipes nec Marti natus, at idem | aut inconcus glomerat uestigia
    dosro, at molti maca caler esseda cello: The ponies'' military potential (their
    speed, stamina, and manoeuvability) is best illustrated by the Astrian pony Panchates,
    who leads his chariot team to victory against Scipio'' funeral games (16.346–444).
    Small, the Astrians are not bred for war, especially not the volatile cavalry
    charges carried by the Carthaginians, for instance, at the beginning of the Battle
    of Cannae (Plb. 31.5.2–4, Liv. 22.41–2). In meantime, the Astrians used their
    small, swift ponies for transporting wagons particularly for food or goods (pacata...
    esseda). The verb glomer is used to describe the ponies'' rapid succession of
    hoofbeats, uestigia s.v. glomero 4, see Virg, G. 3.117: gressus superare boobos),
    which enable them to keep steady (inconcus) the load they carry on their back.
    Silius'' brief summary, which suggests the ponies'' suitability for carrying equipment
    during the march to Italy, is reinforced by a more detailed description of the
    ponies in Pliny (at. 8.42): in eadem Hispania Gallica gens et Astrica equino equinis
