    from the gods out of the oracle, echoing his opening lines: *nec ut mentes agitare
    praescia corda*; cessatum super imperio (5–6). The oracle given to Hannibal provides
    only enough information to assure the Punic leader of military success against
    the Romans through the Battle of Cannae but not yet.¹²


    Bostar''s visit to the temple and oracle (Ammoneion) of Jupiter/Hammon in Libya
    is Silius''s own invention,¹³ inspired by Alexander''s visit to Siwah (Pl. Al.
