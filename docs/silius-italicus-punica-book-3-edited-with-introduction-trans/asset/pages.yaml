    At the beginning of Silius'' Flavian panegyric, the poet highlights the theme
    of apotheosis, which is not inappropriate since the Punica was composed after
    the deaths of two emperors, Vespasian (on 24 July 79) and Titus (on 13 September
    81). Vespasian, already at 60 at the time of his accession, had addressed the
    issue of dynastic success without hesitation Titus to a position near parity with
    his own imperium, using the titles Augustus had once used for himself and Tiberius.
    Vespasian famously claimed that no one his son would succeed him.¹¹⁹ When Silius''
    Jupiter asserts that the Flavian dynasty will ascend, sacer aget haben nomen Iulis
    (595), he is prophesing a steady continuation, an almost smooth transition, from
    the Julio-Claudians to the current regime, exemplified by images of a strong and
