    plunged eagerly; some protect their weapons on heads and shoulders held high,
    while others in rivalry cut through the water with strong arms. The horses were
    fastened and led by river boats; and the Libyan beasts did not delay the crossing
    through fear. For the soldiers discovered how they could span the water with rafts,
    cover the planks tied together by flinging earth on them, and take the rafts into
    deep water by slowly loosening the cables from elephants, the heights of the bank.
