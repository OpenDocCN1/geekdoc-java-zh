    The Marmaridae, healing folk, arrived in uproar. Snakes respond to their incantations,
    forgetting their venom; horned serpents are soothed by their touch. Then came
    the Baniurae, tough young men; since they lack iron, they are content to harden
    their spear points in their meagre fire. Excitedly they punctuate the barbaric
    murmur of their speech with harsh exclamations. Likewise, the Autololes joined
    the army, a fiery race with swift feet; they run so fast at speed they outstrip
    a warhorse or a river in spate. They compete with birds; when they cover the plain
    with flying feet, you would search in vain for their footprints. Among the troops
    were seen also the people whom the sacred tree nourishes with its juice and sweet
