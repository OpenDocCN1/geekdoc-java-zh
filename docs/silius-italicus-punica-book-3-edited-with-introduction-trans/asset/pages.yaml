  md: '# 326 Commentary, lines 701–2


    than Hannibal''s vision of Mercury and the serpent, it specifies Hannibal''s victory
    at Cannae, the glory Hannibal will win from this expedition, the lasting terror
    he will inspire in the Romans. But yet again there is no mention of his ultimate
    conquest of Rome. The omission would arouse suspicion in a more cautious leader,
    but Hannibal is blinded by the force of his ancestral hatred and angry vengeance.
    When he consults oracles on his journey to Italy, he seeks no understanding beyond
    a confirmation of the onset of bitter fighting and destruction, which he assumes
    will win in his own victory. Hannibal''s superficial interpretation of the oracles
    on his journey (24–13) differs from Virgil''s Aeneas. In this unique apostle of
    all the Carthaginians in the voice, the priest summarizes the expedition''s key
    purpose: to bring upon Latium and Rome, the offspring of Trojan Sarassacus. Silius
    echoes the beginning of this closure prophecy, specifically lines 5–6 with the
    infinitive negate: nec uatum metens agitare et praescia corda | cessatum sum imperio;
    Hannibal does cease asking about the future through the oracle, which now says
    that the Carthaginians are just beginning to disrupt Roman affairs. The opening
    phrase tenditis in echoes Virgil, A. 1.205: tendimus in Latium (2007) 25, Walter
    (2014) 304. Onassacus, also see on 565–6.


