  md: '# Commentary, lines 226–7


    226–7. ausa sibi Libye rerum deposcere frenos ; etstris mutare iugum Already in
    the proem (1.6–8), Silius has established the Second Punic War as a struggle for
    world dominion. This is now revised in programmatic language, as the catalogue
    of Hannibal''s troops marks the beginning of Hannibal''s campaign. By alluding
    to what is at stake with the expression terris mutare iugum, Silius implies in
    exaggeration that before the Carthaginians crossed the Alps, Rome was the dominant
    power. It is her dominance, that Hannibal intends to change. Silius frequently
    uses, in evocative variations, the metaphor of chariot race or control, frenos
    rerum; see 114, 2.292, 6.611, 7.222–3 and 384, 10.282, 11.50, 17.175. Cf. Virg.
    A. 12.568 and Or Carm. 14.15–9. Varro''s full rein to meet at Cannae (8.280: totas
    effudit habenas) and habena) and Cato to attack Hades impersonated by Tunger (7.696:
    effusa larung habena); Hannibal is summoned home to ineffective rule in Carthage
    (17.175: qui rerum agitatar habens). Silius uses the Greek Libye and the Latinized
    Libya interchangeably (e.g., in the year 1.23: Libyes; 2.50);


    227–8. nona lac nec umquam | sauerit trucibus tempus acta procelles: Epic poems
    traditionally introduce catalogues by in what way the present conflict surpassed
    all others. Describing the countless rulers who contributed to Pompey''s monumental
    army, Lucan maintains that before such huge forces have been brought together:
    quantum in proelia numquam (7.361). The double negative which in line 227 emphasizes
    the unalled ferocity of the Second Punic War, which was the distinguishing mark
    of the war with Hannibal. Lucretius describes the violent clash of two civilizations
    as shock waves on a cosmic scale (3.832–7): et utleante nihil tempus sempersimus
    aegri; ad configendum uenenibit undique Poenos; omnia cum trepidco cum tumultu
    | horria contrare sub altis aetheris, in dubioque utrum ad regna cadendum | omnibus
    humanis human est terraque marine (Introduction 4.2). The priestiest in Dido''s
    temple prophecies in terms of a violent tempest immediately after the boy Hannibal
    has his oath to defeat Troy a second time (1.134–5: he quaenam subitis rescorcit
    tribida minimis (tempestas). tempestas is the word used to describe the progress
    of Bellona at the Tiscanus (4.440–12), the Romans at Metaurus (15.712–15) and
    warfare (14.364, 16.214). Silius repeats the expression used here, tempestas acta
    procelles, to describe the force of Hannibal across the battlefield at Lake Trasimene
    (5.538). See also the foreshadowing of tempest at 206 above in Mercury''s interpretation
    of the scale. Silius’ metaphor of a raging storm, saueior tempus, has affinities
    with Homeric similes which describe the master and clash of troops in terms of
    the power of cosmic forces in conflict: cf. 4.422–6 and 452–5 (with Kirk’s note
    loc al.), the images of thunderous waves beating on the shore and the clash of
    two swollen rivers and a rising storm at sea (Vir. A. 7.28–30, Theb. 7.625–31);
    see Lovitt (2017). Note the near-golden line 228.'
