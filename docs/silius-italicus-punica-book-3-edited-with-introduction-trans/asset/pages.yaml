  md: '# OXFORD COMMENTARIES ON FLAVIAN POETRY


    The Oxford Commentaries on Flavian Poetry series makes available authoritative
    yet accessible scholarly editions of Flavian literature, including the works of
    such authors as Statius, Valerius Flaccusus, Silius Italicus, and Martial. Through
    publishing traditional philological commentaries on individual poetic books it
    aims to promote and stimulate further scholarship on this key epoch in the history
    of Roman literature.'
