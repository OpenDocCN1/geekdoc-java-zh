  md: '# Commentary


    1–60. HANNIBAL VISITS GADES


    **1–44.** After the destruction of Saguntum, Hannibal sends Bostar to consult
    the oracle of Hammon in Africa, while he pays a visit to the temple of Hercules/Melqart
    in Gades. Silius provides the details of the history of this old temple and of
    the ritual invoked in the god''s worship. On the doors of the temple, Hannibal
    gazes at the various labours of the hero, culminating in his apotheosis on Mount
    Oeta.


    Punica is booked by Bostar to the oracle of Gades (Greek Γάδεῖρα, modern Cádiz;
    Bleichen (1928) 81–90, Bona (1998) 51–7 to seek patronage from Hercules/Melqart,
    as Bostar seeks a prophecy concerning the future of the campaign). Hannibal is
    named Hannibal in Livy (22.22.9). The name Bostar appears on several occasions
    in the historiographic accounts. Polybius (7.9; cf. 23.33–4) mentions a Bostar
    in southern Italy who plays a part, with Mago and Gisgo, in 21 BCE (after Cannae)
    in making an alliance with Philip V of Macedon from Briscoe and Hornblower on
    Liv. 22.22.9 concerning the possible identification in Livy and other Carthaginians
    with that name; cf. also Plb. 3.98.5 for a Bostar who tried to prevent the Romans
    from crossing the Ebro and who retreated to Saguntum). Possibly the same Bostar
    is in charge, this time jointly with Hanno, of Carthaginian forces inside Capua
    when the Romans lay siege to Capua in 221.


    Hannibal''s visit to the temple of Hercules/Melqart continues the exploration
    of the identification of the Carthaginian general with the Greek/Phoenician deity
    (see Introduction 2.1 on Hercules, the conflation with Melqart, and the significance
    of the cult for the Carthaginians/Phoenicians as well as for the Romans under
    the empire). Caesar''s visit to the temple (Suet. 7.1) provides the template which
    Silius follows to depict Hannibal as a possible second Hercules and successor
    to Alexander the Great: quaostteri Hispania obueniet, unimadversa apud Herculis
    temple Magni Alexandri imagine inimiz et qui pertaeus ignuanam quam, quod nihil
    dum a memorable rectum actum est aetate, qua iam Alexander orbem terrarum subregegis,
    missmission continuo efflaguitit ad captandas quam primius maiororum occasione
    in urbe. Silius evokes the literary depictions of Alexander and Caesar (who postdates
    Hannibal but antates the Silitian character). In Liv. 22.21.9, Hannibal cum recensuisit
    omnium gentium auxilia, Gades profectus Herculi Wei'
