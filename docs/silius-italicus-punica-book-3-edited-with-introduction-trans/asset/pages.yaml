  md: '# 4 Introduction


    taking a break from to indulge in love and wine in Capua in Punica 11.¹23 Martial''s
    cycle of seven poems addressed to Silius (4.14, 7.63, 8.66, 9.86, 11.48 and 50,
    12.67) reflect his respect for an older poet whose status inter princes ciuitatis
    might otherwise distance him from younger literary figures with the Flavian era.¹24


    As a poet, Silius shows influence from both Neronian and Flavian Rome. In associating
    Silius with the age of Nero, Pliny''s viewpoint appears to be the poet''s interaction
    with his political or forensic contemporaries. At the same time, Silius shows
    a strong literary affinity with the Neronian poets, Seneca and Lucan,²⁵ above
    all, in the powerful impact of Lucan''s Bell Cilio in the Punica. The theme of
