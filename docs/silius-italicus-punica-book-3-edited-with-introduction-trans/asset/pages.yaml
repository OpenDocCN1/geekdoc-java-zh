  md: '# Commentary, line 222


    An important part of the epic narrative in Silius'' predecessors, the catalogue
    of troops allows the epic poet to introduce the various actors in the subsequent
    books and their ethnic and geographic/ethnographic background. The tradition is
    long and goes back to Homer''s catalogue of ships in Il. 2.484–877; in Latin epic,
    Virg. A. 7.641–817 and 10.163–214, Luc. 1.392–465, 3,169–297, V. Fl. 6.33–181,
    Stat. Theb. 4.32–308, 12.61–338. Silius'' catalogue in Punica 3 is divided into
    two, roughly equal parts: the list of African allies (231–324) and the list of
    Iberian allies (325–405), introduced by an invocation of the Muse in nine lines
    (222–320) and concluded with Hannibal''s pleasure at viewing his troops and an
    epic same, again in nine lines (46–64). As a counterpart to his catalogue of Hannibalic
    forces, Silius will recount the Italian forces at 8.356–621 (on which Arriemma
    commences and Venini (1978)). On the significance of the catalogue and the clear
    division between the two states, Africa and Libya, extensively introduce ethnography
