    caelum continuum (21.30.6–7) shows this echo of Hannibal''s merciless leadership
    in the following passage, in which Hannibal deviates sharply from the model of
    a journeying epic, like Virgil’s Aeneas, conscious of his responsibility for his
    companions and of divine and cosmic nature.


