    It is a significant lyrical coincidence that, when the Aeneid and the Punica begin,
    the mindset of both Aene and Hannibal has been formed by a recent terrible defeat:
    the Fall of Troy and the First Public War. The impact of this catastrophe is heightened
    by the powerful influence of their two fathers, Anchises and Hannibal. From the
    point where each took control of his own destiny, there is immediate divergence:
    Aeneas seeks to follow the will of the gods in founding a new city for the surviving
    Trojans. Hannibal’s aim, fueled by a passion of hatred and vengeance, is to destroy
    that and with it the Capitoline temple of the god who ordained its foundation.
    The contrasting personalities are evident in a scene where each finds himself
    to face with visual images of his country’s recent defeat. When Aeneas revisits
    the Fall of Troy depicted in frescoes on the walls of Juno at Carthage, the dominant
    emotions are sorrow and regret; haec lacrimae rerum et memoria tangent (A. 162).
    Silius sees this scene in Punica 6 as his model when he describes Hannibal’s fury
    on seeing the temple frescoes at Liternum defeating the Carthaginians in the First
    Public War. As his anger rises, he orders that they should be instantly obliterated
    and replaced with his recent victories, culminating in Rome in flames and Jupiter’s
