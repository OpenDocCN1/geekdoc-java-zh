  md: 'Then came the cities of Vaga and Hippo, a city loved by kings of old, and Raspina,
    who distances herself from unfriendly tides. Zama also came and Tapsus, enriched
    now by Rutulian blood. Leading all these people were Antaeus, huge in body and
    weapons, maintaining the reputation of his ancestor, Hercules, in name and deeds.
    His head towered above his troops.


    The Ethiopians came, a race well known to the Nile. They alone possess the gift
    of extracting ore from nearby rocks without using tools. Next to them came the
    sun-baked Nubians, their bodies bearing witness to the impact of an unrelenting
    sun. They do not wear a bronze helmet, nor is their breastplate toughened with
    iron; they bend no bows. Their custom is to shield their foreheads with folded
    linen, to protect their bodies with linen, and to hurl spears dipped in deadly
    juice, dishonouring weapons of war with poison. Then for the first time the Macae
