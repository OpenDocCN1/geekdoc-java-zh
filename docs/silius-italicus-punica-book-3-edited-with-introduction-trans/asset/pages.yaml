  md: '# Preface


    We first conceived the idea of a full-scale edition and commentary on Silius Italicus’
    Punica 3 in 2014 during a conversation regarding the poem’s structure. We both
    believe that the third book of the longest poem in Latin literature is really
    the beginning of the poet’s work on the Second Punic War, since the first two
    books set the stage with the siege and sack of Saguntum, Hannibal’s first step
    in expedition against Rome. The magisterial third book takes us on a journey,
    as we follow Hannibal through the Pyrenees and the Alps, a masterful voyage across
    the empire of Silius Italicus’ time at the end of the first century CE: we are
    exposed to the empire''s geography through a trip into the past, as we move over
    the catalogue of Carthaginian forces from North Africa and Spain and as we travel
    with Hannibal over rivers and mountains to reach the Italian border at the end.
    At the same time, we are treated with a self-contained book, clearly marked by
    beginnings and endings, as we trace Boscar’s Africa to consult Hannibal’s oracle:
    the prophecy received only provides an ominous foreshadowing through the Battle
    of Cannae but not beyond. Hannibal’s doomed expedition and daring in his crossing
    of the inaccessible mountain-tops is fully explained to us in the central prophecy
    pronounced by Jupiter to Venus regarding Roman affairs: the Carthaginians will
    lose, Rome will learn a hard lesson, and the future of the empire under the Flavians
    will be illustrious. These aspects of Punica 3 have us convinced that it is truly
    a remarkable book in the poem that deserves a full-scale English commentary, and
    the scholarly omission here was glaring. We had many conversations over the years
    on both sides of the Atlantic after 2014, when we were both consumed with finishing
    other projects: Joy was completing her commentary on Punica 10, and Antony was
    finishing his commentary on Status Thebaid 8. More work followed over the years,
    most notably in the spring of 2018 when we were both consumed time at Oxford and
    in Dorchester-upon-Thames’ my idyllic house to draft the third iteration of the
    commentary and plan the introduction.


    In the meantime, the creation of the Flavian Poetry'' series by Oxford University
    Press provided a natural home for our work, for which we are grateful: we would
    like to express our sincere thanks to Stephen Harrison, Charlotte Loveridge, Karen
    Raith, Georgina Leighton, and the rest of the team at OUP for support over the
    years, as well as our colleagues on the Editorial Board (Federica Bessone, Christopher
    Henri, Geese Manuwald, Ruth Parkes, and Christiane Reitz).


    Our work was presented (sometimes co-presented) at various conferences and seminars,
    and we are grateful for the feedback we received there (at Corpus Christi, Oxford
    (which provided hospitality and library access as well), FSU,'
