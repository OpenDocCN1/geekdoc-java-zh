- md: "\n[content]\n## Java Servlets\n\nvery similar to how applets are debugged.\
    \ The difference is that with applets, the actual program being debugged is sun.applet.AppletViewer.\n\
    \nMost debuggers hide this detail by automatically knowing how to debug applets.\
    \ Until they do the same for servlets, you have to help your debugger by doing\
    \ the following:\n\n- Set your debugger's classpath so that it can find sun.servlet.Http-Server\
    \ and associated classes.\n- Set your debugger's classpath so it can also find\
    \ your servlets and support classes, typically server_root/servlets and server_root/classes.\n\
    \nYou normally wouldn't want server_root/servlets in your build because it disables\
    \ reloading. This inclusion, however, is useful for debugging. It allows you to\
    \ debug breakpoints in a servlet before the custom servlet loader in HttpServlet\
    \ loads the servlet.\n\nOnce you have set the proper classpath, start debugging\
    \ sun.servlet.http.Server. You can set breakpoints in whatever servlet you're\
    \ interested in debugging, then use a web browser to make a request to the HttpServlet\
    \ for the given servlet (http://localhost:8080/servlet/WebServletDebug). You should\
    \ see execution being stopped at your breakpoints.\n\n## Using Comments\n\nComments\
    \ in your code can change the debugging process in various ways. Comments can\
    \ be used in other ways in the debugging process.\n\nThe Servlet uses Java comments\
    \ and single line (// ... ) and multiple line (/* ... */) can be used to temporarily\
    \ remove parts of your Java code. If the bug disappears, take a closer look at\
    \ the code you just commented and find the problem.\n\n## Client and Server Headers\n\
    \nSometimes a servlet doesn't behave as expected, it's useful to look at the raw\
    \ HTTP request and response. If you're familiar with the structure of HTTP, you\
    \ can read the request and see exactly what is going on with those headers.\n\n\
    ## Important Debugging Tips\n\nHere is a list of some debugging tips on servlet\
    \ debugging:\n\n- Remember that server_root/classes doesn't reload and that server_root/servlets\
    \ probably does.\n- Ask a browser to show the raw content of the page it is displaying.\
    \ This can help identify formatting problems. It's usually an option under the\
    \ View menu.\n- Make sure your browser isn't caching a request's output by forcing\
    \ a full reload of the page. With Netscape Navigator, use Shift-Reload; with Internet\
    \ Explorer use Shift-Refresh.\n\n![](img/d35069288ea1c8c6f3ed55795768f9dc_115_0.png)\n\
    \n- Verify that your servlet's init() method takes a ServletConfig parameter and\
    \ calls super.init(config) right away.\n\n## 22. Servlets – Internationalization\n\
    \nBefore we proceed, let me explain (i18n) three important terms:\n\n- Internationalization\
    \ (i18n): This means enabling a web site to provide different versions of content\
    \ translated into the visitor's language or nationality.\n- Localization (l10n):\
    \ This means adding resources to a web site to adapt to a particular geographical\
    \ or cultural region.\n- Locale: This is a particular cultural or geographical\
    \ region. It is usually referred to as a language followed by a country symbol\
    \ which is separated by an underscore. For example \"en_US\" represents English\
    \ locale for US.\n\nThere are number of items which should be taken care of while\
    \ building up a global website. This tutorial would not give complete detail on\
    \ this but would give you a good example on how you can offer your web page in\
    \ different languages to internet community i.e. locale.\n\nA servlet can pick\
    \ up appropriate version of the site based on the requester's locale and provide\
    \ appropriate site version according to the local language, culture and requirements.\
    \ Following is the method of request object which returns Locale object.\n\n```java\n\
    java.util.Locale request.getLocale()\n```\n\n## Detecting Locale\n\nFollowing\
    \ are the important locale methods which you can use to detect requester's location,\
    \ language and of course locale. All the below methods display country name and\
    \ language set in requester's browser.\n\n| S.N. | Method & Description |\n|---|---|\n\
    | 1 | String getCountry() <br>This method returns the country/region code in case\
    \ for this locale in ISO 3166 2-letter format. |\n| 2 | String getDisplayName()\
    \ <br>This method returns a name for the locale's country that is appropriate\
    \ for display to the user. |\n| 3 | String getLanguage() <br>This method returns\
    \ the language code in lower case for this locale in ISO 639 format. |\n| 4 |\
    \ String getDisplayNameLanguage() <br>This method returns a name for the locale's\
    \ language that is appropriate for display to the user. |\n| 5 | String getISO3Country()\
    \ <br>This method returns a three-letter abbreviation for this locale's country.\
    \ |\n| 6 | String getISO3Language() <br>This method returns a three-letter abbreviation\
    \ for this locale's language. |\n\n![](img/d35069288ea1c8c6f3ed55795768f9dc_117_0.png)\n\
    \n## Java Servlets\n\n## Example\n\nThis example shows how you display a language\
    \ and associated country for a request:\n\n```java\nimport java.io.*;\nimport\
    \ javax.servlet.*;\nimport javax.servlet.http.*;\nimport java.util.Locale;\n\n\
    public class GLC extends HttpServlet {\n\n    public void doGet(HttpServletRequest\
    \ request,\n        HttpServletResponse response) throws ServletException, IOException\
    \ {\n\n        // Get the client's Locale\n        Locale locale = request.getLocale();\n\
    \        String language = locale.getLanguage();\n        String country = locale.getCountry();\n\
    \n        // Set response content\n        response.setContentType(\"text/html\"\
    );\n        PrintWriter out = response.getWriter();\n\n        String title =\
    \ \"Detecting Locale\";\n        String docType = \"<!doctype html \\\"-//W3//DTD\
    \ HTML 4.0\\\">\";\n\n        out.println(docType +\n            \"<head><title>\"\
    \ + title + \"</title></head>\" +\n            \"<body bgcolor=\\\"f0f0f0\\\"\
    >\" +\n            \"<h1 align=\\\"center\\\">\" + language + \"</h1>\" +\n  \
    \          \"<h2 align=\\\"center\\\">\" + country + \"</h2>\" +\n           \
    \ \"</body></html>\");\n    }\n}\n```\n\n![](img/d35069288ea1c8c6f3ed55795768f9dc_118_0.png)\n\
    \n## Java Servlets\n\nA servlet can output a page written in Western European\
    \ language such as English, Spanish, German, French, Italian, Dutch. Here it is\
    \ important to set Content-Language header to display all characters properly.\
    \ Second point is to display all special characters using HTML entities. For example,\
    \ &#241; represents \"n\", and &#161; represents \"i\" as follows:\n\n```java\n\
    import java.io.*;\nimport javax.servlet.*;\nimport java.util.Locale;\n\npublic\
    \ class DisplaySpanish extends HttpServlet {\n\n    public void doGet(HttpServletRequest\
    \ request,\n        HttpServletResponse response) throws ServletException, IOException\
    \ {\n\n        // Set response content type\n        response.setContentType(\"\
    text/html\");\n        PrintWriter out = response.getWriter();\n        // ...\
    \ implementation\n    }\n}\n```\n\n## Locale Dates\n\nYou can use the java.text.DateFormat\
    \ class and its static getDateTimeInstance() method to format date and time specific\
    \ to locale. Following is the example which shows how to format dates specific\
    \ to given locale:\n\n```java\nimport java.io.*;\nimport javax.servlet.*;\nimport\
    \ javax.servlet.http.*;\nimport java.util.Locale;\nimport java.text.DateFormat;\n\
    import java.util.Date;\n\npublic class LocaleDates extends HttpServlet {\n\n \
    \   public void doGet(HttpServletRequest request,\n        HttpServletResponse\
    \ response) throws ServletException, IOException {\n\n        // Set response\
    \ content type\n        response.setContentType(\"text/html\");\n        PrintWriter\
    \ out = response.getWriter();\n        // Get the client's Locale\n        Locale\
    \ locale = request.getLocale();\n        DateFormat df = DateFormat.getTimeInstance(locale);\n\
    \        String date = df.format(new Date());\n\n        String title = \"Locale\
    \ Dates\";\n        String docType = \"<!doctype html \\\"-//W3//DTD HTML 4.0\\\
    \">\";\n\n        out.println(docType +\n            \"<head><title>\" + title\
    \ + \"</title></head>\" +\n            \"<body bgcolor=\\\"f0f0f0\\\">\" +\n \
    \           \"<h1 align=\\\"center\\\">\" + date + \"</h1>\" +\n            \"\
    </body></html>\");\n    }\n}\n```\n\n## Locale Currency\n\nYou can use the java.text.NumberFormat\
    \ class and its static getCurrencyInstance() method to format a number, such as\
    \ a long or double type, in a locale specific currency. Following is the example\
    \ which shows how to format currency specific to given locale:\n\n```java\nimport\
    \ java.io.*;\nimport javax.servlet.*;\nimport javax.servlet.http.*;\nimport java.util.Locale;\n\
    import java.text.NumberFormat;\n\npublic class LocaleCurrency extends HttpServlet\
    \ {\n\n    public void doGet(HttpServletRequest request,\n        HttpServletResponse\
    \ response) throws ServletException, IOException {\n\n        // Set response\
    \ content type\n        response.setContentType(\"text/html\");\n        PrintWriter\
    \ out = response.getWriter();\n        // Get the client's Locale\n        Locale\
    \ locale = request.getLocale();\n        NumberFormat nft = NumberFormat.getCurrencyInstance(locale);\n\
    \        String formattedCurr = nft.format(1000000);\n\n        String title =\
    \ \"Locale Currency\";\n        String docType = \"<!doctype html \\\"-//W3//DTD\
    \ HTML 4.0\\\">\";\n\n        out.println(docType +\n            \"<head><title>\"\
    \ + title + \"</title></head>\" +\n            \"<body bgcolor=\\\"f0f0f0\\\"\
    >\" +\n            \"<h1 align=\\\"center\\\">\" + formattedCurr + \"</h1>\" +\n\
    \            \"</body></html>\");\n    }\n}\n```\n"
  mdcn: "\n[content]\n## Java Servlets\n\n这与调试 applet 的方式非常。区别在于，对于 applet，实际调试的程序是\
    \ `sun.applet.AppletViewer`。\n\n大多数调试器通过自动知道如何调试 applet 来隐藏这一细节。在它们对 servlet 执行相同操作之前，你必须通过以下操作帮助你的调试器：\n\
    \n- 设置调试器的类路径（classpath），使其能够找到 `sun.servlet.Http-Server` 和相关类。\n- 设置调试器的类路径，使其也能找到你的\
    \ servlet 和支持类，通常位于 `server_root/servlets` 和 `server_root/classes`。\n\n你通常不希望将\
    \ `server_root/servlets` 包含在构建路径中，因为这会禁用重载。然而，这种包含对于调试是有用的。它允许你在 `HttpServlet`\
    \ 中的自定义 servlet 加载器加载 servlet 之前，调试 servlet 中的断点。\n\n一旦你设置了正确的类路径，就开始调试 `sun.servlet.http.Server`。你可以在任何感兴趣调试的\
    \ servlet 中设置断点，然后使用网络浏览器向给定 servlet 的 HttpServlet 发送请求（http://localhost:8080/servlet/WebServletDebug）。你应该能看到执行在你的断点停止。\n\
    \n## 使用注释\n\n代码中的注释可以以各种方式改变调试过程。注释在调试过程中还可以用于其他方式。\n\nServlet 使用 Java 注释，单行（`//\
    \ ...`）和多行（`/* ... */`）可以临时移除你的 Java 代码部分。如果 bug 消失了，仔细查看你刚刚注释的代码并找到问题。\n\n##\
    \ 客户端和服务器标头\n\n有时 servlet 的行为不符合预期，查看原始的 HTTP 请求和响应是有用的。如果你熟悉 HTTP 的结构，你可以读取请求并确切看到这些标头中发生了什么。\n\
    \n## 重要调试提示\n\n这里是关于 servlet 调试的一些调试提示列表：\n\n- 记住 `server_root/classes` 不重载，而\
    \ `server_root/servlets` 可能会重载。\n- 请求浏览器显示其正在显示的页面的原始内容。这有助于识别格式问题。它通常是“视图”（View）菜单下的一个选项。\n\
    - 确保你的浏览器没有通过强制重新刷新页面来缓存请求输出。对于 Netscape Navigator，使用 Shift-Reload；对于 Internet\
    \ Explorer，使用 Shift-Refresh。\n\n![](img/d35069288ea1c8c6f3ed55795768f9dc_115_0.png)\n\
    \n- 验证你的 servlet 的 `init()` 方法接收一个 `ServletConfig` 参数并立即调用了 `super.init(config)`。\n\
    \n## 22. Servlets – 国际化\n\n在我们继续之前，让我解释一下三个重要的术语（i18n）：\n\n- 国际化 (i18n)：这意味着允许网站提供翻译成访问者语言或国籍的多个版本的内容。\n\
    - 本地化 (l10n)：这意味着为网站添加资源以适应特定的地理或文化区域。\n- 区域 (Locale)：这是一个特定的文化或地理区域。它通常表示为一种语言，后跟一个国家符号，两者之间用下划线分隔。例如，“en_US”代表美国的英语区域。\n\
    \n在构建全球网站时，有许多项目需要处理。本教程不会提供这方面的完整细节，但将为你提供一个很好的示例，说明你如何向互联网社区提供不同语言（即区域）的网页。\n\
    \nServlet 可以根据请求者的区域选择网站的适当版本，并根据当地语言、文化和要求提供适当的站点版本。以下是返回 `Locale` 对象的请求方法。\n\
    \n```java\njava.util.Locale request.getLocale()\n```\n\n## 检测区域\n\n以下是你可以用于检测请求者位置、语言，当然还有区域的重要区域方法。下述所有方法都会显示请求者浏览器中设置的国家名称和语言。\n\
    \n| S.N. | 方法 & 描述 |\n|---|---|\n| 1 | String getCountry() <br>此方法返回该区域在 ISO 3166\
    \ 2 位字母格式下的国家/区域代码。 |\n| 2 | String getDisplayName() <br>此方法返回一个适用于显示给用户的、该区域所属国家的名称。\
    \ |\n| 3 | String getLanguage() <br>此方法返回该区域在 ISO 639 格式下的小写语言代码。 |\n| 4 | String\
    \ getDisplayNameLanguage() <br>此方法返回一个适用于显示给用户的、该区域语言的名称。 |\n| 5 | String getISO3Country()\
    \ <br>此方法返回该区域国家的三字母缩写。 |\n| 6 | String getISO3Language() <br>此方法返回该区域语言的三字母缩写。\
    \ |\n\n![](img/d35069288ea1c8c6f3ed55795768f9dc_117_0.png)\n\n## Java Servlets\n\
    \n## 示例\n\n此示例展示了如何为请求显示语言和相关的国家：\n\n```java\nimport java.io.*;\nimport javax.servlet.*;\n\
    import javax.servlet.http.*;\nimport java.util.Locale;\n\npublic class GLC extends\
    \ HttpServlet {\n\n    public void doGet(HttpServletRequest request,\n       \
    \ HttpServletResponse response) throws ServletException, IOException {\n\n   \
    \     // 获取客户端的 Locale\n        Locale locale = request.getLocale();\n       \
    \ String language = locale.getLanguage();\n        String country = locale.getCountry();\n\
    \n        // 设置响应内容\n        response.setContentType(\"text/html\");\n       \
    \ PrintWriter out = response.getWriter();\n\n        String title = \"Detecting\
    \ Locale\";\n        String docType = \"<!doctype html \\\"-//W3//DTD HTML 4.0\\\
    \">\";\n\n        out.println(docType +\n            \"<head><title>\" + title\
    \ + \"</title></head>\" +\n            \"<body bgcolor=\\\"f0f0f0\\\">\" +\n \
    \           \"<h1 align=\\\"center\\\">\" + language + \"</h1>\" +\n         \
    \   \"<h2 align=\\\"center\\\">\" + country + \"</h2>\" +\n            \"</body></html>\"\
    );\n    }\n}\n```\n\n![](img/d35069288ea1c8c6f3ed55795768f9dc_118_0.png)\n\n##\
    \ Java Servlets\n\nServlet 可以输出用西欧语言（如英语、西班牙语、德语、法语、意大利语、荷兰语）编写的页面。在这里，设置 Content-Language\
    \ 标头以正确显示所有字符非常重要。第二点是使用 HTML 实体显示所有特殊字符。例如，&#241; 如下：\n\n```java\nimport java.io.*;\n\
    import javax.servlet.*;\nimport javax.servlet.http.*;\nimport java.util.Locale;\n\
