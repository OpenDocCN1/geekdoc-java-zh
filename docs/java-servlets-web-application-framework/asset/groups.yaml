    The log files give you an indication of new bugs or the frequency of problems.\
    \ For that reason it's good to use the log() function in the catch clause of exceptions\
    \ which should normally occur.\n\n# Using JDB Debugger\n\nYou can debug servlets\
    \ with the same jdb commands you use to debug an applet or application.\nTo debug\
    \ a servlet, we debug sun.servlet.http.HttpServer and carefully watch as HttpServer\
