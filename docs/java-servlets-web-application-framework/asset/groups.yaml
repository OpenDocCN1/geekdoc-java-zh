    \    response.setContentType(\"text/html\");\n\n    PrintWriter out = response.getWriter();\n\
    \    String title = \"Auto Refresh\";\n    String doctype = \"<!doctype html \\\
    -//www.w3.org//DTD HTML 4.0 \" + \n    \"//transitional/EN//\\n\";\n\n    out.println(doctype\
    \ + \n    \"<html>\\n\" + \n    \"<title>\" + title + \"</title><head>\\n\" +\
    \ \n    \"<body bgcolor=\\\"#f0f0f0\\\">\\n\" + \n    \"<h1 align=\\\"center\\\
    \">\" + title + \"</h1>\\n\" + \n    \"<p>Current Time is: \" + CT + \"</p>\\\
    n\" +\n    \"</body></html>\\n\");\n}\n\n    // 处理 GET 请求\n    public void doGet(ServletRequest\
