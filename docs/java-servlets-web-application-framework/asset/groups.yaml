    # 1. Servlets – Overview


    ## What are Servlets?


    Java Servlets are programs that run on a Web or Application server and act as
    a middle layer between a requests coming from a Web browser or other HTTP client
    and databases or applications on the HTTP server.


    Using Servlets, you can collect input from users through web pages, present records
    from a database or another source, and create web pages dynamically.


    Java Servlets often serve the same purpose as programs implemented using the Common
    Gateway Interface (CGI). But Servlets offer several advantages in comparison with
    CGI.


    - Performance is significantly better.

    - Servlets execute within the address space of a Web server. It is not necessary
    to create a separate process to handle each client request.

    - Servlets are platform-independent because they are written in Java.

    - Java security manager on the server enforces a set of restrictions to protect
    the resources on a server machine. So Servlets are trusted.

    - The full functionality of the Java class libraries is available to a servlet.
    It can communicate with applets, databases, or other software via the sockets
    and RMI mechanisms that you have seen already.


    ## Servlets Architecture


    The following diagram shows the position of Servlets in a Web Application.


    ![](img/d35069288ea1c8c6f3ed55795768f9dc_7_0.png)


    # Java Servlets


    ## Servlets Tasks


    Servlets perform the following:


    - Read the request from the client.

    - Process the request data.

    - Generate the response and send it to the client.

    - Handle multiple requests concurrently using threads.

    - Manage session information.


    ## Servlets Packages


    Servlets can be created and compiled within packages. This helps in organizing
    the code and promoting reusability. Common packages include `javax.servlet` and
    `javax.servlet.http`. These packages provide the necessary classes and interfaces
    for servlet servlet and handling web-based communication.


    # What is Next?


    I would take you step by step to set up your environment to start with Servlets.
    I''m sure you are going to enjoy this tutorial.


    ![](img/d35069288ea1c8c6f3ed55795768f9dc_8_0.png)


    # 2. Servlets – Environment Setup


    A development environment is where you would develop, test and finally run them.
    Like any other Java program, this development environment setup involves the following
    steps:


    ## Setting up Java Development Kit


    This step involves downloading an implementation of the Java Development Kit (SDK)
    and setting up PATH environment appropriately.


    You can download SDK from Oracle''s site: Java SE Downloads.


    Once you download your Java implementation, follow the given instructions to install
    and configure the setup. Finally set PATH and JAVA_HOME environment variables
    to refer to the directory that contains Java and javac, typically the bin directory
    respectively.


    If you are running Windows and installed the SDK in C:\jdk1.8.0_65, you would
    put the following line in your batch file:


    ```batch

    set PATH=C:\jdk1.8.0_65\bin;%PATH%

    set JAVA_HOME=C:\jdk1.8.0_65

    ```


    Alternatively, on Windows NT/2000/XP, you could also right-click on My Computer,
    select Properties, then Advanced, Environment Variables. Then, you would update
    the PATH value and press the OK button.


    On Unix (Solaris, Linux, etc.), if the SDK is installed in /usr/local/jdk1.8.0_65
    and you use the C shell, you would put the following into your file:


    ```bash

    setenv PATH /usr/local/jdk1.8.0_65:$PATH

    setenv JAVA_HOME /usr/local/jdk1.8.0_65

    ```


    Alternatively, if you use an Integrated Development Environment (IDE) like Borland
    JBuilder, Eclipse, IntelliJ IDEA, or Sun One Studio, compile and run a simple
    program to confirm that the IDE knows where you installed Java.


    ## Setting Web Server: Tomcat


    A number of Web Servers that support servlets are available in the market. Some
    web servers are freely downloadable and Tomcat is one of them.

