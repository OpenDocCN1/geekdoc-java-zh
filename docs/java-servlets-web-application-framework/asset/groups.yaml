- md: "\n[content]\n\nThis method returns the comment describing the purpose of this\
    \ cookie, or null if the cookie has no comment.\n\n# Setting Cookies with Servlet\n\
    \nSetting cookies with servlet involves three steps:\n\n- (1) Creating a Cookie\
    \ object: You call the Cookie constructor with a cookie name and a cookie value,\
    \ both of which are strings.\n\n```\nCookie cookie = new Cookie(\"key\", \"value\"\
    );\n```\n\nKeep in mind, neither the name nor the value should contain white space\
    \ or any of the following characters:\n\n```\n[ ] ( ) = \" / ? @ ;\n```\n\n- (2)\
    \ Setting the maximum age: Use setMaxAge to specify how long (in seconds) the\
    \ cookie should be valid. Following would set up a cookie for 24 hours.\n\n```\n\
    cookie.setMaxAge(60*60*24);\n```\n\n- (3) Sending the Cookie into the HTTP response\
    \ headers: You use response.addCookie to add cookies in the HTTP response header\
    \ as follows:\n\n```\nresponse.addCookie(cookie);\n```\n\n# Example\n\nLet us\
    \ modify our Form Example to set the cookies for first and last name.\n\n```java\n\
    // Import required java libraries\nimport java.io.*;\nimport javax.servlet.*;\n\
    import javax.servlet.http.*;\n\n// Extend HttpServlet class\npublic class HelloForm\
    \ extends HttpServlet {\n\n    public void doGet(HttpServletRequest request, HttpServletResponse\
    \ response)\n        throws ServletException, IOException\n{\n        // Create\
    \ cookies for first and last names.\n        Cookie firstName = new Cookie(\"\
    first_name\");\n```\n\n![](img/d35069288ea1c8c6f3ed55795768f9dc_60_0.png)\n\n\
    # Java Servlets\n\n```java\n// Set expiry date after 24 Hrs for both the cookies.\n\
    firstName.setMaxAge(60*60*24);\nlastName.setMaxAge(60*60*24);\n```\n\n```java\n\
    // Add both the cookies in the response header.\nresponse.addCookie(firstName);\n\
    response.addCookie(lastName);\n```\n\n```java\n// Set response content type\n\
    PrintWriter out = response.getWriter();\nresponse.setContentType(\"text/html\"\
    );\n```\n\n```java\n}\n}\n```\n\nCompile the above servlet HelloForm and create\
    \ appropriate entry in web.xml file and finally following HTML page to call servlet.\n\
    \n55\n\n![](img/d35069288ea1c8c6f3ed55795768f9dc_61_0.png)\n\n# Java Servlets\n\
    \n```html\n<html>\n<body>\n<form action=\"HelloForm\" method=\"GET\">\nFirst Name:\
    \ <input type=\"text\" name=\"first_name\">\n<br />\nLast Name: <input type=\"\
    text\" name=\"last_name\" />\n<input type=\"submit\" value=\"Submit\" />\n</form>\n\
    </body>\n</html>\n```\n\nKeep above HTML content in a file Hello.htm and put it\
    \ in `<Tomcat-installation-directory>/ROOT` directory. When you would access `http://localhost:8080/Hello.htm`,\
    \ here is the actual output of the form.\n\nFirst Name:\nLast Name:\n\nTry enter\
    \ First Name and Last Name and click submit button. This would display first name\
    \ and last name on your screen and same time it sets two cookies firstName and\
    \ lastName which would be passed back to the server next time you would press\
    \ Submit button.\n\nNext section would explain how you would access these cookies\
    \ back in your web application.\n\n# Reading Cookies with Servlet\n\nTo read cookies,\
    \ you need to create an array of `javax.servlet.Cookie` objects by calling the\
    \ `getCookies()` method of `HttpServletRequest`. Then cycle through the array,\
    \ and use `getName()` and `getValue()` methods to access each cookie and value.\n\
    \n# Example\n\nLet us read cookies which we have set in previous example:\n\n\
    ```java\n// Import required java libraries\nimport java.io.*;\nimport javax.servlet.*;\n\
    import javax.servlet.http.*;\n\n// Extend HttpServlet class\n```\n\n![](img/d35069288ea1c8c6f3ed55795768f9dc_62_0.png)\n\
    \n```java\npublic class ReadCookies extends HttpServlet {\n\n    public void doGet(HttpServletRequest\
    \ request,\n            HttpServletResponse response)\n            throws ServletException,\
    \ IOException {\n        Cookie cookie = null;\n        Cookie[] cookies = null;\n\
    \        // Get an array of Cookies associated with this domain\n        cookies\
    \ = request.getCookies();\n\n        // Set response content type\n        response.setContentType(\"\
    text/html\");\n\n        PrintWriter out = response.getWriter();\n        String\
    \ title = \"Reading Cookies Example\";\n        String docType = \n          \
    \  \"<!doctype html //-//www.w3.org/HTML/4.0 \" + \\\n            \"//transitional/en//\"\
