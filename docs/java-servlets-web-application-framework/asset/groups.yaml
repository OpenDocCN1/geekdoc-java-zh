    \ \"<head><title>\" + title + \"</title></head>\\n\" +\n            \"<body bgcolor=\\\
    \"#f0f0f0\\\"\\n\");\n\n        if (cookies != null) {\n            out.println(\"\
    <h2> Found Cookies Name and Value</h2>\");\n            for (int i = 0; i < cookies.length;\
    \ i++){\n                cookie = cookies[i];\n                out.print(\"Name\
    \ : \" + cookie.getName() + \" , \");\n                out.print(\"Value: \" +\
    \ cookie.getValue() + \"<br/>\");\n            }\n        }else {\n          \
    \  out.println(\"<h2>No cookies found</h2>\");\n        }\n        out.println(\"\
    </body>\\n\");\n        out.println(\"</html>\\n\");\n    }\n}\n```\n\n![](img/d35069288ea1c8c6f3ed55795768f9dc_63_0.png)\n\
    \n# Java Servlets\n\nCompile above servlet ReadCookies and create appropriate\
    \ entry in web.xml file. If you would set first_name cookie as \"John\" and last_name\
    \ cookie as \"Player\" then running `http://localhost:8080/ReadCookies` would\
    \ display the following result:\n\n```\nFound Cookies Name and Value\n\nName :\
    \ first_name, Value: John\n\nName : last_name, Value: Player\n```\n\n# Delete\
    \ Cookies with Servlet\n\nTo delete cookies is very simple. If you want to delete\
    \ a cookie then you simply need to follow up following three steps:\n\n- Read\
    \ an existing cookie and store it in Cookie object.\n- Set cookie age as zero\
    \ using `setMaxAge()` method to delete an existing cookie.\n- Add this cookie\
    \ back into response header.\n\n# Example\n\nThe following would delete first_name:\n\
    \n```java\n// Import required java libraries\nimport java.io.*;\nimport javax.servlet.*;\n\
    import javax.servlet.http.*;\n\n// Extend HttpServlet class\npublic class DeleteCookies\
    \ extends HttpServlet {\n\n    public void doGet(HttpServletRequest request, HttpServletResponse\
    \ response)\n            throws ServletException, IOException {\n        Cookie\
    \ cookie = null;\n        Cookie[] cookies = request.getCookies();\n\n       \
    \ if (cookies != null) {\n            for (int i = 0; i < cookies.length; i++)\
    \ {\n                cookie = cookies[i];\n                if (cookie.getName().equals(\"\
    first_name\")) {\n                    cookie.setMaxAge(0);\n                 \
    \   response.addCookie(cookie);\n                }\n            }\n        }\n\
    \    }\n}\n```\n\n![](img/d35069288ea1c8c6f3ed55795768f9dc_64_0.png)\n\n# 12.\
    \ Servlets – Session Tracking\n\nHTTP is a \"stateless\" protocol which means\
    \ each time a client retrieves a Web page, the client opens a separate connection\
    \ and the server automatically does keep any record of previous request.\n\nStill\
    \ there are following three ways to maintain session between web client and server:\n\
    \n### Cookies\n\nA webserver can assign a unique session ID as a cookie to each\
    \ web client and subsequent requests from client can be recognized by the received\
    \ cookie.\n\nThis may not be an effective way because time browser does not support\
    \ cookies, so I would not recommend using this procedure to maintain the sessions.\n\
    \n### Hidden Form Fields\n\nA web server can send a \"hidden\" HTML form field\
    \ along with a unique session ID follows:\n\n```html\n<input type=\"hidden\" name=\"\
    sessionid\" value=\"12345\">\n```\n\nThis entry may, when the form is submitted,\
    \ the specified name and value are automatically included in the GET or POST data.\
    \ Each time when web browser sends back, session_id value can be used to keep\
    \ the track of different browsers.\n\nThis could be an effective way of keeping\
    \ track of the session by clicking on a regular (<A HREF>) hyperlink link does\
    \ not result in a form submission, so hidden form fields cannot support general\
    \ session tracking.\n\n### URL Rewriting\n\nYou can append some extra data on\
    \ the end of each URL that identifies the session, and the server can associate\
