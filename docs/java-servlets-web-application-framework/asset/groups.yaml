    \nSo far, you have learnt how Servlet uses the deployment descriptor (web.xml\
    \ file) for deploying your application into a web server. Servlet API 3.0 has\
    \ introduced a new package called javax.servlet.annotation. It provides annotation\
    \ types which can be used for annotating a servlet class. If you use annotation,\
    \ the deployment descriptor (web.xml) is not required. But you should use tomcat7\
    \ or any later version of tomcat.\n\nAnnotations can replace equivalent XML configuration\
    \ in the web deployor file (web.xml) such as servlet declaration and servlet mapping.\
    \ Servlet containers will process the annotated classes at deployment time.\n\n\
    The annotation types introduced in Servlet 3.0 are:\n\n| Annotation | Description\
    \ |\n| --- | --- |\n| @WebServlet | To declare a servlet. |\n| @InitParam | To\
    \ specify an initialization parameter. |\n| @WebFilter | To declare a servlet\
    \ filter. |\n| @EventListener | To declare a WebListener. |\n| @HandlesTypes |\
    \ To declare the class types that a ServletContainerInitializer can handle. This\
    \ annotation is used within the ServletSecurity annotation to represent the security\
    \ constraints to be applied to all HTTP protocol methods for which corresponding\
    \ HttpMethodConstraint element does not occur within the ServletSecurity annotation.\
    \ This annotation is used within |\n| @HttpMethodConstraint | the ServletSecurity\
    \ annotation to represent security constraints on specific HTTP protocol messages.\
    \ Annotation that may be used on a Servlet class, indicating instances of the\
    \ Servlet expect requests that conform to the multipart/form-data MIME type. This\
    \ annotation is used on a Servlet implementation class to specify security constraints\
    \ to be enforced by a Servlet container on HTTP protocol messages. |\n| @ServletSecurity\
    \ | (empty description in table or part of previous context) |\n\nHere we have\
    \ discussed some of the Annotations in detail.\n\n# @WebServlet\n\nThe @WebServlet\
    \ is used to declare the configuration of a Servlet with a container. The following\
    \ table contains the list of attributes used for WebServlet annotation.\n\n| Attribute\
    \ Name | Description |\n| --- | --- |\n| String name | Name of the Servlet |\n\
    | String[] value | Array of URL patterns |\n| String[] urlPatterns | Array of\
    \ URL patterns to which this Filter applies |\n| Int onLoad | The integer value\
    \ gives you the startup ordering hint |\n| WebInitParam[] initParams | Array of\
    \ initialization parameters for this Servlet |\n| Boolean asyncSupported | Asynchronous\
    \ operation supported by this Servlet |\n| String smallIcon | Small icon for this\
    \ Servlet, if present |\n| String largeIcon | Large icon for this Servlet, if\
    \ present |\n| String description | Description of this Servlet, if present |\n\
    | String displayName | Display name of this Servlet, if present |\n\nAt least\
    \ one URL pattern MUST be declared in either the value or urlPattern attribute\
    \ of the annotation, but not both.\n\nThe value attribute is recommended for use\
    \ when the url pattern is the only attribute being set, otherwise the urlPattern\
    \ attribute should be used.\n\n# Example\n\nThe following example describes how\
    \ to use @WebServlet annotation. It is a simple servlet that displays the text\
    \ Hello Servlet.\n\n```java\nimport java.io.IOException;\nimport java.io.PrintWriter;\n\
    import javax.servlet.ServletExceptionException;\nimport javax.servlet.annotation.WebInitParam;\n\
    import javax.servlet.annotation.WebServlet;\nimport javax.servlet.http.HttpServlet;\n\
    import javax.servlet.http.HttpServletRequest;\nimport javax.servlet.http.HttpServletResponse;\n\
    ```\n\n![](img/d35069288ea1c8c6f3ed55795768f9dc_126_0.png)\n\n```java\n@WebServlet(value\
    \ = \"/Simple\")\npublic class Simple extends HttpServlet {\n\n    private static\
    \ final long serialVersionUID = 1L;\n\n    protected void doGet(HttpServletRequest\
    \ request, HttpServletResponse\n    response) throws ServletException, IOException\
    \ {\n\n    response.setContentType(\"text/html\");\n    PrintWriter out=response.getWriter();\n\
    \    out.print(\"<body>\");\n    out.print(\"<h3>Hello Servlet</h3>\");\n    out.print(\"\
    </body></html>\\n}\n}\n```\n\nCompile Simple.java in the usual way and put your\
    \ class file in <Tomcat-installation-directory>/webapps/ROOT/WEB-INF/classes.\n\
    \nNow try to call any servlet by just running http://localhost:8080/Simple. You\
    \ will see the following output on the web page.\n\nHello servlet\n\n# @WebServletParam\n\
    \nThe @WebInitParam annotation is used for specifying an initialization parameter\
    \ for a Filter. It is used within a WebFilter or WebServlet annotations. The following\
    \ table contains the list of attributes for WebInitParam annotation.\n\n| Attribute\
    \ Name | Description |\n| - | - |\n| String name | Name of the parameter |\n|\
    \ String value | Value of the parameter |\n| String description | Description\
    \ of the parameter |\n\n# Example\n\nThe following example describes how to use\
    \ @WebServlet annotation. It is a simple servlet that displays the value of In-param\
    \ test-param and the current time timestamp on the console. It means, the filter\
    \ works like an interface layer between the request and the response. We use \"\
    /*\" for urlPattern. It means, this filter is applicable for all servlets.\n\n\
    ```java\nimport java.io.IOException;\nimport javax.servlet.annotation.WebFilter;\n\
    import javax.servlet.annotation.WebInitParam;\nimport javax.servlet.*;\nimport\
    \ java.util.*;\n\n// Implements Filter class\n```\n\n```java\n@WebServlet(value\
    \ = \"/Simple\", initParams = {\n    @WebInitParam(name=\"test-param\", value=\"\
    Hello World!\")\n})\npublic class Simple extends HttpServlet {\n\n    private\
    \ static final long serialVersionUID = 1L;\n\n    protected void doGet(HttpServletRequest\
    \ request, HttpServletResponse\n    response) throws ServletException, IOException\
    \ {\n\n    response.setContentType(\"text/html\");\n    PrintWriter out=response.getWriter();\n\
    \    out.print(\"<body>\");\n    out.print(\"<h3>Hello Servlet</h3>\");\n    out.print(\"\
    </body></html>\\n}\n}\n```\n\n# @WebFilter\n\nThe @WebFilter annotation is used\
    \ to declare a servlet filter. It is processed by the container deployment time,\
    \ and the corresponding filter applied to the specified URL patterns, servlets,\
    \ and dispatcher types.\n\nThe @WebFilter annotation defines a filter in a web\
    \ application. This annotation is specified on a class and contains metadata about\
    \ the filter being declared. The annotated filter must specify at least one URL\
    \ pattern. The following table lists the attributes for @WebFilter.\n\n| Attribute\
    \ Name | Description |\n| --- | --- |\n| String filterName | Name of the filter\
    \ |\n| String[] value | Provides array of values or urlPatterns to which the filter\
    \ applies |\n| String[] dispatcherType[] | Specifies the types of dispatcher (Request/Response)\
    \ to which the filter applies |\n| String[] servletNames | Provides an array of\
    \ servlet names |\n| String description | Description of the filter |\n| WebInitParam[]\
