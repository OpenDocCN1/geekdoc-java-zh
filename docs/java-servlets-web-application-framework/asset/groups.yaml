    # 21. Servlets – Debugging


    It is always difficult to testing/debugging servlets. Servlets tend to involve
    a large amount of client/server interaction, making errors likely but hard to
    reproduce.


    Here are a few hints and suggestions that may aid you in your debugging.


    # System.out.println()


    System.out.println() is easy to use as a marker to test whether a certain piece
    of code is being executed or not. We can print variable values as well. Additionally:


    +   * Since the System object is part of the core Java objects, it can be used
    everywhere without the need to install any extra classes. This includes Servlets,
    JSP, RMI, EJB''s, ordinary Beans and standalone applications.

    * Stopping at breakpoints technique stops the normal execution takes more time.
    Whereas writing to System.out doesn''t interfere with the normal execution flow
    of the application, which makes it very valuable when timing is crucial.


    Following the syntax to use System.out.println():


    ```

    System.out.println("Debugging message");

    ```


    All the messages generated by above syntax would be logged in web server log file.


    # Message Logging


    It is always great to use proper logging method to log all the debug, and error
    messages using a standard logging method. Use log[4] to log all the messages.


    The Servlet API also provides a way of outputting information by using the log()
    as follows:


    ```

    // Import required java libraries

    import java.io.*;

    import javax.servlet.*;

    import javax.servlet.http.*;


    public class ContextLog extends HttpServlet {

    public void doGet(HttpServletRequest request,

    HttpServletResponse response) throws ServletException,

    java.io.IOException {

    ```


