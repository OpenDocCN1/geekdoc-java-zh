- md: "\n# The HttpSession Object\n\nApart from the above mentioned three ways, servlet\
    \ provides HttpSession Interface which provides a way to identify user across\
    \ more than one page request or visit to a Web site and to store information about\
    \ that user.\n\nThe servlet container uses this interface to create a session\
    \ between an HTTP client and an HTTP server. The session persists for a specified\
    \ time period, across more than one connection or page request from the user.\n\
    \nYou would get HttpSession object by calling the public method getSession() of\
    \ HttpServletRequest, as below:\n\n```\nHttpSession session = request.getSession();\n\
    ```\n\nYou need to call request.getSession() before you send any document content\
    \ to the client. Here is a summary of the important methods available through\
    \ HttpSession object:\n\n| S.N. | Method & Description |\n|---|---|\n| 1 | **public\
    \ Object getAttribute(String name)**<br>This method returns the object bound with\
    \ the specified name in this session, or null if no object is bound under the\
    \ name. |\n| 2 | **public Enumeration getAttributeNames()**<br>This method returns\
    \ an Enumeration of String objects containing the names of all the objects bound\
    \ to this session. |\n| 3 | **public long getCreationTime()**<br>This method returns\
    \ the time when this session was created, measured in milliseconds since midnight\
    \ January 1, 1970 GMT. |\n| 4 | **public String getId()**<br>This method returns\
    \ a string containing the unique identifier assigned to this session.<br>**public\
    \ long getLastAccessed()**<br>This method returns the last accessed time of the\
    \ session, in the format of milliseconds since midnight January 1, 1970 GMT.<br>**public\
    \ int getMaxInactiveInterval()** |\n| 6 | This method returns the maximum time\
    \ interval (seconds), that the servlet container will keep the session open between\
    \ client accesses.<br>**public void invalidate()** |\n| 7 | This method invalidates\
    \ the session and unbinds any objects bound to it.<br>**public boolean isNew()**\
    \ |\n| 8 | This method returns true if the client does not know about the session\
    \ or if the client chooses not to join the session |\n\n![](img/d35069288ea1c8c6f3ed55795768f9dc_69_0.png)\n\
