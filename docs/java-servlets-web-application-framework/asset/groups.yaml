    # JAVA SERVLETS

    web application framework


    # tutorialspoint

    SIMPLY EASY LEARNING


    # About the Tutorial


    Servlets provide a component-based, platform-independent method for building Web-based
    applications, without the performance limitations of CGI programs. Servlets have
    access to the entire family of Java APIs, including the JDBC API to access enterprise
    databases.


    This tutorial will teach you how to use Java Servlets to develop your web based
    applications in simple and easy steps.


    # Audience


    This tutorial is designed for Java programmers with a need to understand the Java
    Servlets framework and its APIs. After completing this tutorial you will find
    yourself at a moderate level of expertise in using Java Servlets from where you
    can take yourself to next levels.


    # Prerequisites


    We assume you have good understanding of the Java programming language. It will
    be great if you have a basic understanding of web application and how internet
    works.


