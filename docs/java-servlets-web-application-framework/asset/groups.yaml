    \ new IllegalStateException(\"Missing parameter\"));\n} else {\n    context.log(\"\
    Here is the visitor's message: \" + par);\n\n    response.setContentType(\"text/html\"\
    );\n    java.io.PrintWriter out = response.getWriter();\n    String title = \"\
