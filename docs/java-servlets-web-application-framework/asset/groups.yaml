    # Java Servlets


    very similar to how applets are debugged. The difference is that with applets,
    the actual program being debugged is sun.applet.AppletViewer.


    Most debuggers hide this detail by automatically knowing how to debug applets.
    Until they do the same for servlets, you have to help your debugger by doing the
    following:


    +   - Set your debugger''s classpath so that it can find sun.servlet.Http-Server
    and associated classes.


    +   - Set your debugger''s classpath so it can also find your servlets and support
    classes, typically server_root/servlets and server_root/classes.


    You normally wouldn''t want server_root/servlets in your प्रार because it disables
    reloading. This inclusion, however, is useful for debugging. It allows you to
    debug breakpoints in a servlet before the custom servlet loader in HttpServlet
    loads the servlet.


    Once you have set the proper classpath, start debugging sun.servlet.http.Server.
    You can set breakpoints in whatever servlet you''re interested in debugging, then
    use a web browser to make a request to the HttpServlet for the given servlet (http://localhost:8080/servlet/WebServletDebug).
    You should see execution being stopped at your breakpoints.


    # Using Comments


    Comments in your code can change the debugging process in various ways. Comments
    can be used in other ways in the debugging process.


    The Servlet uses Java comments and single line (// ... ) and multiple line (/*
    ... */) can be used to temporarily remove parts of your Java code. If the bug
    disappears, take a closer look at the code you just commented and find the problem.


    # Client and Server Headers


    Sometimes a servlet doesn''t behave as expected, it''s useful to look at the raw
    HTTP request and response. If you''re familiar with the structure of HTTP, you
    can read the request and see exactly what is going on with those headers.


    # Important Debugging Tips


    Here is a list of some debugging tips on servlet debugging:


    +   - Remember that server_root/classes doesn''t reload and that server_root/servlets
    probably does.


    +   - Ask a browser to show the raw content of the page it is displaying. This
    can help identify formatting problems. It''s usually an option under the View
    menu.


    +   - Make sure your browser isn''t caching a request''s output by forcing a full
    reload of the page. With Netscape Navigator, use Shift-Reload; with Internet Explorer
    use Shift-Refresh.


