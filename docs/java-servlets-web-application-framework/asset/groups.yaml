    # Methods to Set HTTP Response Header


    There are following methods which can be used to set HTTP response header in your
    servlet program. These methods are available with HttpServletResponse object.


    | S.N. | Method & Description |

    |---|---|

    | 1 | String encodeRedirectURL(String url) encodes the returned URL for use in
    the sendRedirect method, or if encoding is not needed, returns the URL unchanged.
    |

    | 2 | String encodeURL(String url) encodes the specified URL by using the session
    ID in, or, if encoding is not needed, returns the URL unchanged. |

    | 3 | boolean containsHeader(String name) returns a Boolean indicating whether
    the named response header has already been set. |

    | 4 | boolean isCommitted() returns a Boolean indicating if the response has been
    committed. |

    | 5 | void addCookie(Cookie cookie) adds the specified cookie to the response.
    |

    | 6 | void addDate(String name, long date) adds a response with the given name
    and date-value. |

    | 7 | void addHeader(String name, String value) adds a response with the given
    name and value. |

    | 8 | void addIntHeader(String name, int value) adds a response with the given
    name and integer value. |

    | 9 | void flushBuffer() forces any content in the buffer to be written to the
    client. |

    | 10 | void reset() clears any data that exists in the buffer as well as the status
    code and headers. |

    | 11 | void resetBuffer() clears the content of the underlying buffer in the response
    without clearing headers or status code. |

    | 12 | void sendError(int sc) sends an error response to the client using the
    specified status code and clearing the buffer. |

    | 13 | void sendError(int sc, String msg) sends an error response to the client
    using the specified status. |

    | 14 | void sendRedirect(String location) sends a temporary redirect to the client
    using the specified redirect URL. |

    | 15 | void setBufferSize(int size) sets the preferred buffer size for the body
    of the response. |

    | 16 | void setCharacterEncoding(String charset) |


