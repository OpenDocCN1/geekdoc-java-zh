    public void setIntHeader(String header, int header)\n```\n\nThis method sends\
    \ back header \"Refresh\" to browser along with integer value which indicates\
    \ interval in seconds.\n\n# Auto Page Refresh Example\n\nThis example shows how\
    \ servlet performs auto refresh using setIntHeader() method.\n\n```java\n// Import\
