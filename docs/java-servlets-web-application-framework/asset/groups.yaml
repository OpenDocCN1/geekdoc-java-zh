    ![](img/d35069288ea1c8c6f3ed55795768f9dc_97_0.png)\n\n# 18. Servlets – 页面自动刷新\n\
    \n考虑一个显示实时游戏比分、股市状况或货币汇率率的网页。对于所有此类页面，你可能需要使用浏览器的刷新或重新加载按钮定期刷新你的网页。\n\nJava Servlet\
