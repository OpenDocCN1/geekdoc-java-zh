- md: "\n# Methods to Set HTTP Status Code\n\nThe following methods can be used to\
    \ set HTTP Status Code in your servlet program. These methods are available with\
    \ HttpServletResponse object.\n\n| S.N. | Method & Description |\n|---|---|\n\
    | 1 | **public void setStatus( int statusCode )**<br>This method sets an arbitrary\
    \ status code. If your response includes a status code and a document, be sure\
    \ call setStatus before actually returning any of the content with the `PrintWriter`.<br>**public\
    \ void sendRedirect(String url)** |\n| 2 | This method generates a 302 response\
    \ along with a `Location` header giving the URL of the new document.<br>**public\
    \ void sendError(int code, String message)** |\n| 3 | This method sends a status\
    \ code (404) along with a short message that is automatically formatted inside\
    \ an HTML document and sent to the client. |\n\n# HTTP Status Code Example\n\n\
    Following is the example which would send a 407 error code to the client browser\
    \ and browser would show you \"Need authentication!\" message.\n\n```java\n//\
    \ Import required java libraries\nimport java.io.*;\nimport javax.servlet.*;\n\
    import javax.servlet.http.*;\nimport java.util.*;\n\n// Extend HttpServlet class\n\
    public class showError extends HttpServlet {\n\n// Method to handle GET request.\n\
    public void doGet(HttpServletRequest request\npublic void doPost(HttpServletRequest\
    \ request,\n    HttpServletResponse response)\n    throws ServletException, IOException\
    \ {\n    doGet(request, response);\n}\n```\n\nNow calling the above servlet would\
    \ display the following result:\n\n| HTTP Status 407 - Need authentication!!!\
    \ |\n|---|---|\n| Type | Status report |\n| message | Need authentication!!! |\n\
    | description | The client must first authenticate itself with the proxy (Need\
    \ authentication!!!). |\n\nApache Tomcat/5.5.29\n\n# 9. Servlets – Writing Filters\n\
    \nServlet Filters are Java classes that can be used in Servlet Programming for\
    \ the following purposes:\n\n- To intercept requests from a client before they\
    \ access a resource at back end.\n- To manipulate responses from server before\
    \ they are sent back to the client.\n\nThere are various types of filters suggested\
    \ by the specifications:\n\n- Authentication Filters\n- Data compression Filters\n\
    - Encryption Filters\n- Filters that trigger resource access events\n- Image Conversion\
    \ Filters\n- Logging and Auditing Filters\n- MIME-TYPE Chain Filters\n- Tokenizing\
    \ Filters\n- XSL/T Filters That Transform XML Content\n\nFilters are deployed\
    \ in the deployment descriptor file web.xml and then map to servlet names or URL\
    \ patterns in your application's deployment descriptor.\n\nWhen the web container\
    \ starts up your web application, it creates an instance of each filter that you\
    \ have declared in the deployment descriptor. The filters execute in the order\
    \ that they are declared in the deployment descriptor.\n\n# Servlet Filter Methods\n\
    \nA filter is a Java class that implements the javax.servlet.Filter interface.\
    \ The javax.servlet.Filter interface defines three methods:\n\n| S.N. | Method\
    \ & Description |\n|---|---|\n| 1 | **public void doFilter(HTTPRequestRequest,\
    \ HttpServletResponse, FilterChain)** This method is called by the chain every\
    \ time request/response pair passed through the chain due to a client request\
    \ for a resource at the end of the chain. |\n| 2 | **public void init(FilterConfig\
    \ filterConfig)** This method is called by the web container to indicate to a\
    \ filter that it is being placed into service. |\n| 3 | **public void destroy()**\
    \ This method is called by the web container to indicate to a filter that it is\
    \ being taken out of service. |\n\n![](img/d35069288ea1c8c6f3ed55795768f9dc_47_0.png)\n\
    \n# Servlet Filter – Example\n\nFollowing is the Servlet Filter Example that would\
    \ print the clients IP address and current date time. This example would give\
    \ you basic understanding of Servlet Filter, but you can write more sophisticated\
    \ filter applications using the same concept:\n\n```java\n// Import required java\
    \ libraries\nimport java.io.*;\nimport javax.servlet.*;\nimport javax.servlet.http.*;\n\
    import java.util.*;\n\n// Implements Filter class\npublic class LogFilter implements\
    \ Filter {\n    public void init(FilterConfig config) \n        throws ServletException\
    \ {\n\n        // Get init parameter\n        String testParam = config.getInitParameter(\"\
    test-param\");\n\n        // Print the init parameter\n        System.out.println(\"\
    Test Param: \" + testParam);\n    }\n\n    public void doFilter(ServletRequest\
    \ request,\n        ServletResponse response,\n        FilterChain chain) throws\
    \ java.io.IOException, ServletException {\n\n        // Get the IP address of\
    \ client machine.\n        String ipAddress = request.getRemoteAddr();\n\n   \
    \     // Log the IP address and current timestamp.\n        System.out.println(\"\
    IP \" + ipAddress + \" \", Time \" + new Date().toString());\n\n        // Pass\
    \ request back down the filter chain\n        chain.doFilter(request,response);\n\
    \    }\n\n    public void destroy() {}\n}\n\n/* Called before the Filter instance\
    \ is removed\nfrom service by the web container*/\n}\n```\n\nCompile **LogFilter.java**\
    \ in usual way and put your class file in <Tomcat-installation-directory>/webapp/ROOT/WEB-INF/classes.\n\
    \n## Filter Mapping in Web.xml\n\nFilters are defined and mapped to a URL or Servlet,\
    \ in much the same way as Servlet is defined and mapped to a URL pattern. Create\
    \ the following entry for filter tag in the deployment descriptor **web.xml**\n\
    \n```xml\n<filter>\n  <filter-name>LogFilter</filter-name>\n  <init-class>LogFilter</init-class>\n\
    \  <init-param>\n    <param-name>test-param</param-name>\n    <param-value>Initialization\
    \ Paramter</param-value>\n  </init-param>\n</filter>\n<filter-mapping>\n  <filter-name>LogFilter</filter-name>\n\
    \  <url-pattern>/*</url-pattern>\n</filter-mapping>\n```\n\nThe above filter would\
    \ apply to all servlets because we specified /* in our configuration. You can\
    \ specity a particular servlet path if you want to apply filter on few servlets\
    \ only.\n\nNow try to call any servlet in usual way and you would see generated\
    \ log in your web server log. Use Log4J logger to log above log in a separate\
    \ file.\n\n## Using Multiple Filters\n\nYour web application may define several\
    \ different filters with a specific purpose. Consider, you define two filters\
    \ **AuthenFilter** and **LogFilter**. Rest of the process will remain as explained\
    \ above except you need to create a different mapping as mentioned below:\n\n\
    ```xml\n<filter>\n  <filter-name>LogFilter</filter-name>\n  <filter-class>LogFilter</filter-class>\n\
    \  <init-param>\n    <param-name>test-param</param-name>\n    <param-value>Initialization\
    \ Paramter</param-value>\n  </init-param>\n</filter>\n\n<filter>\n  <filter-name>AuthenFilter</filter-name>\n\
    \  <filter-class>AuthenFilter</filter-class>\n  <init-param>\n    <param-name>test-param</param-name>\n\
    \    <param-value>Initialization Paramter</param-value>\n  </init-param>\n</filter>\n\
    \n<filter-mapping>\n  <filter-name>LogFilter</filter-name>\n  <url-pattern>/*</url-pattern>\n\
    </filter-mapping>\n\n<filter-mapping>\n  <filter-name>AuthenFilter</filter-name>\n\
    \  <url-pattern>/*</url-pattern>\n</filter-mapping>\n```\n\n# Filters Application\
    \ Order\n\nThe order of filter-mapping elements in web.xml determines the order\
    \ in which the web container applies the filter to the servlet. To reverse the\
    \ order of the filter, you just need to reverse the filter-mapping elements in\
    \ the.xml.\n\nFor example, above example would apply LogFilter first and then\
    \ it would apply AuthenFilter to any servlet but the following example would reverse\
    \ the order:\n\n```xml\n<filter-mapping>\n  <filter-name>AuthenFilter</filter-name>\n\
    \  <url-pattern>/*</url-pattern>\n</filter-mapping>\n```\n\n![](img/d35069288ea1c8c6f3ed55795768f9dc_50_0.png)\n\
    \n```xml\n<filter-mapping>\n  <filter-name>LogFilter</filter-name>\n  <url-pattern>/*</url-pattern>\n\
    </filter-mapping>\n```\n\n# 10. Servlets – Exception Handling\n\nWhen a servlet\
    \ throws an exception, the web container searches the configurations in **web.xml**\
    \ that use the exception-type-element for a match with the thrown exception type.\n\
    \nYou would have to use the **error-page** element in web.xml to specify the invocation\
    \ of servlets in response to certain **exceptions** or HTTP **status codes.**\n\
    \n# web.xml Configuration\n\nConsider, you have an ErrorHandler servlet which\
    \ would be called whenever there is any defined exception or error. Following\
    \ would be the entry created in web.xml.\n\n```xml\n<!-- servlet definition -->\n\
    <servlet>\n  <servlet-name>ErrorHandler</servlet-name>\n  <servlet-class>ErrorHandler</servlet-class>\n\
    </servlet>\n\n<!-- servlet mappings -->\n<servlet-mapping>\n  <servlet-name>ErrorHandler</servlet-name>\n\
    \  <url-pattern>/ErrorHandler/url-pattern>\n</servlet-mapping>\n\n<!-- error-code\
    \ related error pages ---->\n<error-page>\n  <error-code>404</error-code>\n  <location>ErrorHandler</location>\n\
    </error-page>\n\n<error-page>\n  <error-code>403</error-code>\n  <location>ErrorHandler</location>\n\
    </error-page>\n\n<!-- exception-type related error pages ---->\n<error-page>\n\
    \  <exception-type>\n```\n"
  mdcn: "\n\n# 设置 HTTP 状态码的方法\n\n以下方法可用于在 Servlet 程序中设置 HTTP 状态码。这些方法可以通过 `HttpServletResponse`\
    \ 对象使用。\n\n| 序号 | 方法与描述 |\n|---|---|\n| 1 | **public void setStatus( int statusCode\
    \ )**<br>此方法设置一个任意状态码。如果你的响应包含状态码和文档，请务必在使用 `PrintWriter` 实际返回任何内容之前调用 `setStatus`。<br>**public\
    \ void sendRedirect(String url)** |\n| 2 | 此方法会生成一个 302 响应，并带有一个 `Location` 头部，其中包含新文档的\
    \ URL。<br>**public void sendError(int code, String message)** |\n| 3 | 此方法会发送状态码\
    \ (404) 以及一条短消息，该消息会在 HTML 文档中被自动格式化并发送给客户端。 |\n\n# HTTP 状态码示例\n\n以下示例将向客户端浏览器发送\
    \ 407 错误码，浏览器将向你显示“Need authentication!”消息。\n\n```java\n// Import required java\
    \ libraries\nimport java.io.*;\nimport javax.servlet.*;\nimport javax.servlet.http.*;\n\
    import java.util.*;\n\n// Extend HttpServlet class\npublic class showError extends\
    \ HttpServlet {\n\n// Method to handle GET request.\npublic void doGet(HttpServletRequest\
    \ request\npublic void doPost(HttpServletRequest request,\n    HttpServletResponse\
    \ response)\n    throws ServletException, IOException {\n    doGet(request, response);\n\
    }\n```\n\n现在调用上述 Servlet 将显示以下结果：\n\n| HTTP Status 407 - Need authentication!!!\
    \ |\n|---|---|\n| Type | Status report |\n| message | Need authentication!!! |\n\
    | description | The client must first authenticate itself with the proxy (Need\
    \ authentication!!!). |\n\nApache Tomcat/5.5.29\n\n# 9. Servlet 过滤器 – 编写过滤器\n\n\
    Servlet 过滤器（Filters）是 Java 类，在 Servlet 编程中可用于以下目的：\n\n- 在客户端访问后端资源之前拦截其请求。\n-\
    \ 在从服务器向客户端发送响应之前，对其进行处理。\n\n规范建议了多种类型的过滤器：\n\n- 身份验证过滤器 (Authentication Filters)\n\
    - 数据压缩过滤器 (Data compression Filters)\n- 加密过滤器 (Encryption Filters)\n- 触发资源访问事件的过滤器\n\
    - 图像转换过滤器 (Image Conversion Filters)\n- 日志与审计过滤器 (Logging and Auditing Filters)\n\
    - MIME-TYPE 链过滤器 (MIME-TYPE Chain Filters)\n- 分词过滤器 (Tokenizing Filters)\n- 转换\
    \ XML 内容 XSL/T 过滤器\n\n过滤器部署在部署描述符文件 `web.xml` 中，然后映射到应用程序部署描述符中的 Servlet 名称或 URL\
    \ 模式。\n\n当 Web 容器启动你的 Web 应用时，它会为你部署描述符中声明的每个过滤器创建一个实例。过滤器按照在部署描述符中的声明顺序执行。\n\n\
    # Servlet 过滤器方法\n\n过滤器是实现 `javax.servlet.Filter` 接口的 Java 类。`javax.servlet.Filter`\
    \ 接口定义了三个方法：\n\n| 序号 | 方法与描述 |\n|---|---|\n| 1 | **public void doFilter(HTTPRequestRequest,\
    \ HttpServletResponse, FilterChain)** 每当由于客户端请求链末端的资源导致请求/响应对通过链时，链就会调用此方法。 |\n\
    | 2 | **public void init(FilterConfig filterConfig)** 此方法由 Web 容器调用，指示过滤器它正被投入使用。\
    \ |\n| 3 | **public void destroy()** 此方法由 Web 容器调用，指示过滤器它正被移除服务。 |\n\n![](img/d35069288ea1c8c6f3ed55795768f9dc_47_0.png)\n\
    \n# Servlet 过滤器 – 示例\n\n以下是 Servlet 过滤器示例，它将打印客户端的 IP 地址和当前日期。此示例将让你对 Servlet\
    \ 过滤器有一个基本的了解，但你可以使用相同的概念编写更复杂的过滤器应用：\n\n```java\n// Import required java libraries\n\
    import java.io.*;\nimport javax.servlet.*;\nimport javax.servlet.http.*;\nimport\
    \ java.util.*;\n\n// Implements Filter class\npublic class LogFilter implements\
    \ Filter {\n    public void init(FilterConfig config) \n        throws ServletException\
    \ {\n\n        // Get init parameter\n        String testParam = config.getInitParameter(\"\
    test-param\");\n\n        // Print the init parameter\n        System.out.println(\"\
    Test Param: \" + testParam);\n    }\n\n    public void doFilter(ServletRequest\
    \ request,\n        ServletResponse response,\n        FilterChain chain) throws\
    \ java.io.IOException, ServletException {\n\n        // Get the IP address of\
    \ client machine.\n        String ipAddress = request.getRemoteAddr();\n\n   \
    \     // Log the IP address and current timestamp.\n        System.out.println(\"\
    IP \" + ipAddress + \" \", Time \" + new Date().toString());\n\n        // Pass\
    \ request back down the filter chain\n        chain.doFilter(request,response);\n\
    \    }\n\n    public void destroy() {}\n}\n\n/* Called before the Filter instance\
    \ is removed\nfrom service by the web container*/\n}\n```\n\n通常方式编译 **LogFilter.java**，并将你的类文件放在\
    \ `<Tomcat-installation-directory>/webapp/ROOT/WEB-INF/classes` 中。\n\n## Web.xml\
    \ 中的过滤器映射\n\n过滤器的定义和映射到 URL 或 Servlet 的方式与 Servlet 定义并映射到 URL 模式的方式相似。在部署描述符 **web.xml**\
    \ 中为 filter 标签创建以下条：\n\n```xml\n<filter>\n  <filter-name>LogFilter</filter-name>\n\
    \  <init-class>LogFilter</init-class>\n  <init-param>\n    <param-name>test-param</param-name>\n\
    \    <param-value>Initialization Paramter</param-value>\n  </init-param>\n</filter>\n\
    <filter-mapping>\n  <filter-name>LogFilter</filter-name>\n  <url-pattern>/*</url-pattern>\n\
    </filter-mapping>\n```\n\n上述过滤器将适用于所有 Servlet，因为我们在配置中指定了 `/*`。如果你只想在少数 Servlet\
    \ 上应用过滤器，可以指定特定的 Servlet 路径。\n\n现在尝试以通常方式调用任何 Servlet，你将在你的 Web 服务器日志中看到生成的日志。使用\
    \ Log4J 日志器将上述日志记录到单独的文件。\n\n## 使用多个过滤器\n\n你的 Web 应用可以定义多个具有特定目的的不同过滤器。假设你定义了两个过滤器\
    \ **AuthenFilter** 和 **LogFilter**。其余过程将如上文所示，但你需要按照文所述创建不同的映射：\n\n```xml\n<filter>\n\
    \  <filter-name>LogFilter</filter-name>\n  <filter-class>LogFilter</filter-class>\n\
    \  <init-param>\n    <param-name>test-param</param-name>\n    <param-value>Initialization\
    \ Paramter</param-value>\n  </init-param>\n</filter>\n<filter>\n  <filter-name>AuthenFilter</filter-name>\n\
    \  <filter-class>AuthenFilter</filter-class>\n  <init-param>\n    <param-name>test-param</param-name>\n\
    \    <param-value>Initialization Paramter</param-value>\n  </init-param>\n</filter>\n\
    <filter-mapping>\n  <filter-name>LogFilter</filter-name>\n  <url-pattern>/*</url-pattern>\n\
    </filter-mapping>\n<filter-mapping>\n  <filter-name>AuthenFilter</filter-name>\n\
    \  <url-pattern>/*</url-pattern>\n</filter-mapping>\n```\n\n# 过滤器的顺序\n\n`web.xml`\
    \ 中 `filter-mapping` 元素的顺序决定了 Web 容器应用过滤器到 Servlet 的顺序。例如，上述示例首先应用 `LogFilter`，然后对\
    \ Servlet 应用 `AuthenFilter`，但以下示例将反转顺序：\n\n```xml\n<filter-mapping>\n  <filter-name>AuthenFilter</filter-name>\n\
    \  <url-pattern>/*</url-pattern>\n</filter-mapping>\n\n<filter-mapping>\n  <filter-name>LogFilter</filter-name>\n\
    \  <url-pattern>/*</url-pattern>\n</filter-mapping>\n```\n\n![](img/d35069288ea1c8c6f3ed55795768f9dc_50.png)\n\
    \n# 10. Servlet – 异常处理\n\n当 Servlet 抛出异常时，Web 容器会搜索 **web.xml** 中使用 `exception-type`\
    \ 元素匹配抛出异常类型的配置。\n\n你必须在 `web.xml` 中使用 `error-page` 元素来指定响应特定**异常**或 HTTP **状态码**\
    \ 的 Servlet。\n\n# web.xml 配置\n\n假设有一个 ErrorHandler Servlet，当发生任何定义的异常或错误时都会被调用。以下是在\
    \ `web.xml` 中创建的条目：\n\n```xml\n<!-- servlet definition -->\n<servlet>\n  <servlet-name>ErrorHandler</servlet-name>\n\
    \  <servlet-class>ErrorHandler</servlet-class>\n</servlet>\n\n<!-- servlet mappings\
    \ -->\n<servlet-mapping>\n  <servlet-name>ErrorHandler</servlet-name>\n  <url-pattern>/ErrorHandler/url-pattern>\n\
    </servlet-mapping>\n\n<!-- error-code related error pages ---->\n<error-page>\n\
    \  <error-code>404</error-code>\n  <location>ErrorHandler</location>\n</error-page>\n\
    \n<error-page>\n  <error-code>403</error-code>\n  <location>ErrorHandler</location>\n\
    </error-page>\n\n<!-- exception-type related error pages ---->\n<error-page>\n\
    \  <exception-type>java.lang.Throwable</exception-type>\n  <location>ErrorHandler</location>\n\
    </error-page>\n```\n\n"
