    # 12. Servlets – Session Tracking


    HTTP is a "stateless" protocol which means each time a client retrieves a Web
    page, the

    client opens a separate connection to the Web server and the server automatically
    does

    keep any record of previous client request.


    Still there are following three ways to maintain session between web client and
    web

    server:


    # Cookies


    A webserver can assign a unique session ID as a cookie to each web client and

    subsequent requests from the client they can be recognized by the recieved cookie.


    This may not be an effective way because time browser does not support a cookie,

    so I would not recommend using this procedure to maintain the sessions.


    # Hidden Form Fields


    A web server can send a "hidden" HTML form field along with a unique session ID

    follows:


    ```

    <input type="hidden" name="sessionid" value="12345">

    ```


    This entry may, when the form is submitted, the specified name and value are

    automatically included in the GET or POST data. Each time when web browser sends

    back, session_id value can be used to keep the track of different web

    browsers.


    This could be an effective way of keeping track of the session by clicking on
    a regular

    (<A HREF..>) hyperlink link does not result in a form submission, so hidden form
    fields

    also cannot support general session tracking.


    # URL Rewriting


    You can append some extra data on the end of each URL that identifies the session,
    and

    the server can associate session identifier with data it has stored about that
    session.


    For example, with http://tutorialspoint.com/file.htm;session=12345, the session

    identifier is attached as sessionid=12345 which can be accessed at the web server
    to

    identify the client.


    URL rewriting is a better way to maintain sessions and it works when browsers

    don''t support cookies. The drawback of URL re-writing is that you would have
    to

    gerate every URL dynamically to assign a session ID, even in case of a simple
    static

    HTML page.


