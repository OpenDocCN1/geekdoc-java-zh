    </servlet-mapping>\n```\n\n上述条目应在 `web.xml` 文件中的 `<web-app>...</web-app>` 标签内部。该表中可能已经存在各种条目，但没关系。\n\
    \n你几乎已经完成了，现在使用 `<Tomcat-installation-directory>/bin/startup.bat`（Windows 上）或\
    \ `<Tomcat-installation-directory>/bin/startup.sh`（Linux/Solaris 等）启动 Tomcat 服务器，最后在浏览器的地址栏中输入\
    \ `http://localhost:8080/MyServlet`。如果一切顺利，你将得到以下结果：\n\n| Hello World |\n\n![](img/d35069288ea1c8c6f3ed55795768f9dc_112_0.png)\n\
    \n# 21. Servlets – 调试\n\n调试 Servlet 总是很困难。使用 `System.out.println()` 的语法如下：\n\n\
    ```java\nSystem.out.println(\"Debugging\");\n```\n\nServletContext 将其消息记录到容器的日志文件中。在\
    \ Tomcat 中，这些日志位于 `[Tomcat-installation-directory]/logs`。\n\n日志文件可以告诉你新的 Bug 或问题的出现频率。因此，在通常发生异常的\
    \ `catch` 子句中使用 `log()` 函数是好的。\n\n# 日志\n\nServlet API 还提供了如下使用 `log()` 输出信息的方法：\n\
    \n```java\n// 导入所需的 java 库\nimport java.io.*;\nimport javax.servlet.*;\nimport\
    \ javax.servlet.http.*;\n\npublic class ContextLog extends HttpServlet {\npublic\
    \ void doGet(HttpServletRequest request,\nHttpServletResponse response) throws\
    \ ServletException,\njava.io.IOException {\n```\n\n![](img/d35069288ea1c8c6f3ed55795768f9dc_113_0.png)\n\
    \n```java\nString par = request.getParameter(\"par\");\n// 调用两个 ServletContext\
