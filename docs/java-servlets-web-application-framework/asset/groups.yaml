- md: "\n# Methods to Set HTTP Response Header\n\nThere are following methods which\
    \ can be used to set HTTP response header in your servlet program. These methods\
    \ are available with HttpServletResponse object.\n\n| S.N. | Method & Description\
    \ |\n|---|---|\n| 1 | String encodeRedirectURL(String url) encodes the returned\
    \ URL for use in the sendRedirect method, or if encoding is not needed, returns\
    \ the URL unchanged. |\n| 2 | String encodeURL(String url) encodes the specified\
    \ URL by using the session ID in, or, if encoding is not needed, returns the URL\
    \ unchanged. |\n| 3 | boolean containsHeader(String name) returns a Boolean indicating\
    \ whether the named response header has already been set. |\n| 4 | boolean isCommitted()\
    \ returns a Boolean indicating if the response has been committed. |\n| 5 | void\
    \ addCookie(Cookie cookie) adds the specified cookie to the response. |\n| 6 |\
    \ void addDate(String name, long date) adds a response with the given name and\
    \ date-value. |\n| 7 | void addHeader(String name, String value) adds a response\
    \ with the given name and value. |\n| 8 | void addIntHeader(String name, int value)\
    \ adds a response with the given name and integer value. |\n| 9 | void flushBuffer()\
    \ forces any content in the buffer to be written to the client. |\n| 10 | void\
    \ reset() clears any data that exists in the buffer as well as the status code\
    \ and headers. |\n| 11 | void resetBuffer() clears the content of the underlying\
    \ buffer in the response without clearing headers or status code. |\n| 12 | void\
    \ sendError(int sc) sends an error response to the client using the specified\
    \ status code and clearing the buffer. |\n| 13 | void sendError(int sc, String\
    \ msg) sends an error response to the client using the specified status. |\n|\
    \ 14 | void sendRedirect(String location) sends a temporary redirect to the client\
    \ using the specified redirect URL. |\n| 15 | void setBufferSize(int size) sets\
    \ the preferred buffer size for the body of the response. |\n| 16 | void setCharacterEncoding(String\
    \ charset) Sets the character encoding (MIME charset) of the response being sent\
    \ to the client, for example, to UTF-8. |\n| 17 | void setContentLength(int len)\
    \ Sets the length of the content body in the response in HTTP servlets method\
    \ sets the HTTP Content-Length header. |\n| 18 | void setContentType(String type)\
    \ Sets the type of the response being sent to the client, if the response has\
    \ not been committed. |\n| 19 | void setHeader(String name, long date) Sets a\
    \ response header with the given name and date-value. |\n| 20 | void setHeader(String\
    \ name, String value) Sets a response header with the given name and value. |\n\
    | 21 | void setIntHeader(String name, int value) Sets a response header with the\
    \ given name and integer value. |\n| 22 | void setLocale(Locale locale) Sets the\
    \ locale of the response, if the response has not been committed. |\n| 23 | void\
    \ setStatus(int sc) Sets the status code for this response. |\n\n![](img/d35069288ea1c8c6f3ed55795768f9dc_38_0.png)\n\
    \n# HTTP Header – Example\n\nYou already have seen setContentType() method working\
    \ in previous examples and following example would also use same method, additionally\
    \ we would use setHeader() method to set Refresh header.\n\n```java\n// Import\
    \ required java libraries\nimport java.io.*;\nimport javax.servlet.*;\nimport\
    \ java.util.*;\n\n// Extend HttpServlet class\npublic class Refresh extends HttpServlet\
    \ {\n\n    // Method to handle GET method request.\n    public void doGet(HttpServletRequest\
    \ request,\n        HttpServletResponse response)\n        throws ServletException,\
    \ IOException\n{\n        // Set refresh, autoread time as 5 seconds\n       \
    \ response.setHeader(\"Refresh\", 5);\n\n        // Set response content type\n\
    \        response.setContentType(\"text/html\");\n}\n}\n```\n\n```java\n// Get\
    \ current time\nCalendar calendar = new GregorianCalendar();\nString am_pm;\n\
    int hour = calendar.get(Calendar.HOUR);\nint minute = calendar.get(Calendar.MINUTE);\n\
    int second = calendar.get(Calendar.SECOND);\nif(calendar.get(Calendar.AM_PM) ==\
    \ 0) {\n    am_pm = \"AM\";\n} else {\n    am_pm = \"PM\";\n}\n```\n\n```java\n\
    String CT = hour+\":\"+ minute+\":\"+ second+\":\"+ am_pm;\n\nPrintWriter out\
    \ = response.getWriter();\nString title = \"Auto Refresh Header Setting\";\nString\
    \ docType = \"<!doctype html public \"-//W3C//DTD HTML 4.0 //\" + \"//transitional/EN//\\\
    n\";\nout.println(docType + \"\\n<html>\\n\" + \"<head><title>\" + title + \"\
    </title></head>\\n\" + \"<body bgcolor='#f0f0f0\\\">\\n\" + \"<h1 align='center'>\"\
    \ + title + \"</h1>\\n\" + \"<p>Current time is: \" + CT + \"</p>\\n\" + \"</html>\\\
    n\");\n```\n\n```java\n// Method to handle POST method request.\npublic void doPost(HttpServletRequest\
    \ request,\n    HttpServletResponse response)\n    throws ServletException, IOException\
    \ {\n\n    doGet(request, response);\n}\n```\n\nNow calling the above servlet\
    \ would display current system time after 5 seconds. Just run the servlet and\
    \ wait to see the result:\n\n# Auto Refresh Setting\nCurrent Time is: 9:44:50\
    \ PM\n\n# 8. Servlets – Status Codes\n\nThe format of the HTTP request and HTTP\
    \ response are similar and will have following structure:\n\n- An initial status\
    \ line + CRLF (Carriage Return + Line Feed)\n- Zero or more header lines + CRLF\n\
    - A blank line\n- An optional message body like query data or output\n\nFor example,\
    \ a server response looks as follows:\n\n```\nHTTP/1.1 200 OK\nContent-Type: text/html\n\
    Header: ...\n...\n<!doctype><html><head></head><body></html>\n```\n\nThe status\
    \ line consists of the HTTP version (HTTP/1.1 in the example), a status code (200\
    \ in the example), and a very short message corresponding to the status code.\
    \ Following is a list of status codes and associated messages that might be returned\
    \ from the Web Server:\n\n| Code | Description |\n|---|---|\n| 100 | Continue\
    \ - Only a part of the request has been received by the server, but as long as\
    \ it has not been rejected, the client should continue with the request |\n| 101\
    \ | Switching Protocols - The server switches protocol. |\n| 200 | OK - The request\
    \ is OK. |\n| 201 | Created - The request is complete, and a new resource is created.\
    \ |\n| 202 | Accepted - The request is accepted for processing, but the processing\
    \ is not complete. |\n| 203 | Non-authoritative Information | |\n| 204 | No Content\
    \ | |\n| 206 | Partial Content | |\n| 300 | Multiple Choices - The user can select\
    \ a link and go to that location. |\n| 301 | Moved Permanently - The requested\
    \ page has moved to a new url |\n| 302 | Found - The requested page has moved\
    \ temporarily to a new url |\n| 303 | See Other - The requested page can be found\
    \ under a different url |\n| 304 | Not Modified | |\n| 305 | Use Proxy | |\n|\
    \ 306 | Unused - This code was used in a previous version. It is no longer used,\
    \ but the code is reserved. |\n| 307 | Temporary Redirect - The requested page\
    \ has moved temporarily to a new url. |\n| 400 | Bad Request - The server did\
    \ not understand the request |\n| 401 | Unauthorized - The requested page needs\
    \ a username and password |\n| 402 | Payment Required - You cannot use this code\
    \ |\n| 403 | Forbidden - Access is forbidden to the requested page |\n| 404 |\
    \ Not Found - The server cannot find the requested page. |\n| 405 | Method Not\
    \ Allowed - The method specified in the request is not allowed. |\n| 406 | Not\
    \ Acceptable - The server can only generate a response that is not accepted by\
    \ the client. |\n| 407 | Proxy Authentication Required - You must authenticate\
    \ with a proxy server before this request can be served. |\n| 408 | Request Timeout\
    \ - The request took longer than the server was prepared to wait. |\n| 409 | Conflict\
    \ - The request could not be completed because of a conflict. |\n| 410 | Gone\
    \ - The requested page is no longer available. |\n| 411 | Length Required - The\
    \ \"Content-Length\" is not defined. The server will not accept the request without\
    \ it. |\n| 412 | Precondition Failed - The precondition given in the request evaluated\
    \ to false by the server. |\n| 413 | Request Entity Too Large - The server will\
    \ not accept the request, because the request entity is too large. |\n| 414 |\
    \ Request-url Too Long - The server will not accept the request, because the url\
    \ is too long. Occurs when you convert a \"post\" request to a \"get\" request\
    \ with a long query information. |\n| 415 | Unsupported Media Type - The server\
    \ will not accept the request, because the media type is not supported. |\n| 417\
    \ | Expectation Failed | |\n| 500 | Internal Server Error - The request was not\
    \ completed. The server met an unexpected condition |\n| 501 | Not Implemented\
    \ - The request was not completed. The server did not support the functionality\
    \ required. |\n| 502 | Bad Gateway - The request was not completed. The server\
    \ received an invalid response from the upstream server |\n| 503 | Service Unavailable\
    \ - The request was not completed. The server is temporarily overloading or down.\
    \ |\n| 504 | Gateway Timeout - The gateway has timed out. |\n| 505 | HTTP Version\
    \ Not Supported - The server does not support the \"http protocol\" version. |\n\
    \n![](img/d35069288ea1c8c6f3ed55795768f9dc_42_0.png)\n"
  mdcn: "\n\n# 设置 HTTP 响应头的方法\n\n以下是可以在你的 Servlet 程序中用于设置 HTTP 响应头的方法。这些方法由 `HttpServletResponse`\
    \ 对象提供。\n\n| 序号 | 方法及描述 |\n|---|---|\n| 1 | String encodeRedirectURL(String url)\
    \ 对返回的 URL 进行编码，以供 `sendRedirect` 方法使用；或者如果不需要编码，则返回原封未变的 URL。 |\n| 2 | String\
    \ encodeURL(String url) 使用 session ID 对指定的 URL 进行编码；如果不需要编码，则返回原封未变的 URL。 |\n\
    | 3 | boolean containsHeader(String name) 返回一个布尔值，表示命名的响应头是否已经设置。 |\n| 4 | boolean\
    \ isCommitted() 返回一个布尔值，表示响应是否提交。 |\n| 5 | void addCookie(Cookie cookie) 将指定的\
    \ cookie 添加到响应中。 |\n| 6 | void addDate(String name, long date) 添加带有给定名称和日期值的响应。\
    \ |\n| 7 | void addHeader(String name, String value) 添加带有给定名称和值的响应。 |\n| 8 | void\
    \ addIntHeader(String name, int value) 添加带有给定名称和整数值的响应。 |\n| 9 | void flushBuffer()\
    \ 强制将缓冲区中的任何内容写入客户端。 |\n| 10 | void reset() 清除缓冲区中存在的任何数据，以及状态码和响应头。 |\n| 11 |\
    \ void resetBuffer() 清除响应中底层缓冲区的内容，但不清除响应头或状态码。 |\n| 12 | void sendError(int sc)\
    \ 使用指定的状态码向客户端发送错误响应并清空缓冲区。 |\n| 13 | void sendError(int sc, String msg) 使用指定的状态向客户端发送错误响应。\
    \ |\n| 14 | void sendRedirect(String location) 使用指定的重定向 URL 向客户端发送临时重定向。 |\n|\
    \ 15 | void setBufferSize(int size) 为响应体设置首选缓冲区大小。 |\n| 16 | void setCharacterEncoding(String\
    \ charset) 设置发送到客户端的响应的字符编码（MIME 字符集），例如 UTF-8。 |\n| 17 | void setContentLength(int\
    \ len) 设置响应中内容体的长度，在 HTTP servlet 方法中设置 HTTP Content-Length 头部。 |\n| 18 | void\
    \ setContentType(String type) 如果响应尚未提交，则设置发送到客户端的响应类型。 |\n| 19 | void setHeader(String\
    \ name, long date) 设置带有给定名称和日期值的响应头。 |\n| 20 | void setHeader(String name, String\
    \ value) 设置带有给定名称和值的响应头。 |\n| 21 | void setIntHeader(String name, int value) 设置带有给定名称和整数值的响应头。\
    \ |\n| 22 | void setLocale(Locale locale) 如果响应尚未提交，则设置响应的语言区域。 |\n| 23 | void\
    \ setStatus(int sc) 设置此响应的状态码。 |\n\n![](img/d35069288ea1c8c6f3ed55795768f9dc_38_0.png)\n\
    \n# HTTP 头部 – 示例\n\n你已经在之前的示例中看到了 `setContentType()` 方法的作用，接下来的示例也将使用相同的方法，此外我们还将使用\
    \ `setHeader()` 方法来设置 Refresh 响应头。\n\n```java\n//导入所需的 java 库\nimport java.io.*;\n\
    import javax.servlet.*;\nimport java.util.*;\n\n// 扩展 HttpServlet 类\npublic class\
    \ Refresh extends HttpServlet {\n\n    // 处理 GET 请求的方法。\n    public void doGet(HttpServletRequest\
    \ request,\n        HttpServletResponse response)\n        throws ServletException,\
    \ IOException\n{\n        // 设置刷新、自动读取时间为 5 秒\n        response.setHeader(\"Refresh\"\
    , 5);\n\n        // 设置响应内容类型\n        response.setContentType(\"text/html\");\n\
    }\n}\n```\n\n```java\n// 获取当前时间\nCalendar calendar = new GregorianCalendar();\n\
    String am_pm;\nint hour = calendar.get(Calendar.HOUR);\nint minute = calendar.get(Calendar.MINUTE);\n\
    int second = calendar.get(Calendar.SECOND);\nif(calendar.get(Calendar.AM_PM) ==\
    \ 0) {\n    am_pm = \"AM\";\n} else {\n    am_pm = \"PM\";\n}\n```\n\n```java\n\
    String CT = hour+\":\"+ minute+\":\"+ second+\":\"+ am_pm;\n\nPrintWriter out\
    \ = response.getWriter();\nString title = \"Auto Refresh Header Setting\";\nString\
    \ docType = \"<!doctype html public \"-//W3C//DTD HTML 4.0 //\" + \"//transitional/EN//\\\
    n\";\nout.println(docType + \"\\n<html>\\n\" + \"<head><title>\" + title + \"\
    </title></head>\\n\" + \"<body bgcolor='#f0f0f0\\\">\\n\" + \"<h1 align='center'>\"\
    \ + title + \"</h1>\\n\" + \"<p>Current time is: \" + CT + \"</p>\\n\" + \"</html>\\\
    n\");\n```\n\n```java\n// 处理 POST 请求的方法。\npublic void doPost(HttpServletRequest\
    \ request,\n    HttpServletResponse response)\n    throws ServletException, IOException\
    \ {\n\n    doGet(request, response);\n}\n```\n\n现在调用上面的 servlet 将在 5 秒后显示当前系统时间。只需运行该\
    \ servlet 并等待结果：\n\n# 自动刷新设置\n当前时间为：9:44\n\n# 8. Servlet – 状态码\n\nServlet 的请求和响应格式如下：\n\
    \n请求包含状态行、CRLF（回车换行）\n响应包含状态行、CRLF、头部、CRLF、一个可选的主体\n\n请求格式如下：\n\n```\nHTTP/1.1\
    \ 状态码\n```\n\n响应格式如下：\n\n```\nHTTP/1.1 状态码\nContent-Type: ...\n<!doctype html><head><body>\n\
    ```\n\n服务器可能返回以下状态码：\n\n| 状态码 | 描述 |\n|---|---|\n| 100 | 持续 - 服务器已收到请求头部 |\n|\
    \ 101 | 切换协议 - 服务器正在切换协议 |\n| 200 | OK - 请求已成功处理 |\n| 201 | 创建 - 请求已成功创建 |\n|\
    \ 202 | 接受 - 请求已接受，但尚未处理完成 |\n| 203 | 非授权信息 - 服务器返回的响应格式特殊 |\n| 204 | 无内容 - 请求成功但无内容\
    \ |\n| 300 | 多重重定向 - 请求可以访问后续请求的地址 |\n| 301 | 永久重定向 - 页面已移动 |\n| 302 | 临时重定向 -\
    \ 页面临时移动 |\n| 303 | 其他 - 响应应重定向到另一个 URL |\n| 304 | 未修改 - 资源未更改 |\n| 305 | 不使用\
    \ - 不使用此版本 |\n| 307 | 临时重定向 - 请求的页面已临时移动 |\n| 400 | 错误请求 - 服务器无法理解请求 |\n| 401\
    \ | 未授权 - 需要用户名和密码 |\n| 402 | 需要付款 - 预留 |\n| 403 | 禁止 - 拒绝访问请求的页面 |\n| 404 | 未找到\
    \ - 服务器找不到请求的页面 |\n| 405 | 方法不允许 - 请求的方法不被允许 |\n| 406 | 不接受 - 服务器无法生成客户端接受的响应\
    \ |\n| 407 | 代理身份验证 - 在处理请求前需要向代理服务器身份验证 |\n| 408 | 请求超时 - 请求时间超过了服务器的等待时间 |\n\
    | 409 | 冲突 - 请求由于冲突无法完成 |\n| 410 | 消失 - 请求的页面不再可用 |\n| 411 | 长度要求 - 未定义 Content-Length。服务器不会接受该请求\
    \ |\n| 412 | 前提条件失败 - 请求中的前提条件被服务器评估为假 |\n| 413 | 请求实体过大 - 服务器不会接受请求，因为实体过大 |\n\
    | 414 | 请求 URL 过长 - 服务器不会接受请求，因为 URL 过长。发生在将带有长查询信息的 \"post\" 请求转换为 \"get\" 请求时\
    \ |\n| 415 | 不支持媒体类型 - 服务器不会接受请求，因为媒体类型不支持 |\n| 417 | 期望失败 | |\n| 500 | 内部服务器错误\
    \ - 请求未完成，服务器遇到了意外状况 |\n| 501 | 未实现 - 服务器未实现所需的功能 |\n| 502 | 坏网关 - 服务器从上游服务器收到了无效响应\
    \ |\n| 503 | 服务不可用 - 服务器临时过载或停机 |\n| 504 | 网关超时 - 网关超时 |\n| 505 | HTTP 版本不支持 -\
    \ 服务器不支持的 \"http 协议\" 版本 |\n\n```"
