    \n# 6. Servlets – Client HTTP Request\n\nWhen a browser requests for a web page,\
    \ it sends lot of information to the web server which cannot be read directly\
    \ because this information travel as a part of header of request. You can check\
    \ HTTP Protocol for more information on this.\n\nFollowing the important header\
    \ information which comes from browser side and you would use very frequently\
    \ in web programming:\n\n| Header | Description |\n| --- | --- |\n| Accept | This\
    \ header specifies the MIME types that the browser or other clients can handle.\
    \ Values of **image/jpeg** or **png** are the most common possibilities. |\n|\
    \ Accept-Charset | This header specifies the character sets the browser can use\
    \ to display the information. For example ISO-8859-1. |\n| Accept-Encoding | This\
    \ header specifies the types of encodings that the browser knows how to handle.\
    \ Values of **gzip** or **compress** are the most common possibilities. |\n| Accept-Language\
    \ | This header specifies the client's preferred languages in which the servlet\
    \ can produce results in more than one language. For example, en-us, ru, etc.\
    \ |\n| Authorization | This header is used by clients to identify themselves when\
    \ accessing password-protected Web pages. |\n| Connection | This header indicates\
    \ whether the client can handle persistent HTTP connections. Persistent connections\
    \ permit the client or other browser to retrieve multiple files with a single\
    \ request. A value of **Keep-Alive** means that persistent connections should\
    \ be used. |\n| Content-Length | This header is applicable only to POST requests\
    \ and gives the size of the POST data in bytes. |\n| Cookie | This header returns\
    \ cookies to servers that have previously sent them to the browser. |\n| Host\
    \ | This header specifies the host and port as given in the original URL. |\n\
    | If-Modified-Since | This header indicates that the client wants the page only\
    \ if it has been changed after the specified date. The server sends a code, 304\
    \ which means **Not Modified** header if no newer result is available. |\n"
