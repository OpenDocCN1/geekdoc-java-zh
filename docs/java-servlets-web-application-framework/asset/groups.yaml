- md: "\n# Java Servlets\n\n```\n<error-page>\n<exception-type>javax.servlet.ServletExceptionException</exception-type>\n\
    <location>ErrorHandler</location>\n</error-page>\n\n<error-page>\n<exception-type>java.io.IOException</exception-type>\n\
    <location>ErrorHandler</location>\n</error-page>\n```\n\nIf you want to have a\
    \ generic Error Handler for all the exceptions then you should define following\
    \ error-page instead of defining separate error-page elements for every exception:\n\
    \n```\n<error-page>\n<exception-type>java.lang.Throwable</exception-type>\n<location>ErrorHandler</location>\n\
    </error-page>\n```\n\nFollowing are the points to be noted about web.xml for Exception\
    \ Handling:\n\n- The servlet ErrorHandler defined in usual way as any other servlet\
    \ configured in web.xml.\n- If there is any error with status code either 404\
    \ (Not Found) or 403 (Forbidden), then the ErrorHandler servlet will be called.\n\
    - If the web application throws either ServletException or IOException, then the\
    \ web container invokes the /ErrorHandler servlet.\n- You can define different\
    \ Error Handlers to handle different type of errors or exceptions. Above example\
    \ is very generic and it serves the purpose to explain you the basic concept.\n\
    \n# Request Attributes – Errors/Exceptions\n\nFollowing is the list of request\
    \ that an error-handling servlet can access to analyze the nature of error/exception.\n\
    \n| S.N. | Attribute & Description |\n|---|---|\n| 1 | **javax.servlet.error.status_code**:\
    \ This attribute give status code which can be stored and analyzed after storing\
    \ in a java.lang.Integer data type.<br>**javax.servlet.error.exception_type**:\
    \ This gives information about exception type which can be stored and analysed\
    \ after storing in a java.lang.Class data type. |\n| 3 | **javax.servlet.error.message**:\
    \ This attribute gives information exact error message which can be stored and\
    \ analyzed after storing in a java.lang.String data type. |\n| 4 | `javax.servlet.error.request_uri`:\
    \ This attribute gives information about URL calling the servlet and it can be\
    \ stored and analysed after storing in a java.lang.String data type. |\n| 5 |\
    \ `javax.servlet.error.exception`: This attribute gives information about the\
    \ exception raised, which can be stored and analysed. |\n| 6 | `javax.servlet.error.servlet_name`:\
    \ This attribute gives servlet name which can be stored and analyzed after storing\
    \ in a java.lang.String data type. |\n\n![](img/d35069288ea1c8c6f3ed55795768f9dc_53_0.png)\n\
    \n# Error Handler Servlet – Example\n\nThis example will give you basic understanding\
    \ of Exception Handling in Servlet, but you can write more sophisticated filter\
    \ applications using the same concept:\n\n```java\n// Import required java libraries\n\
    import java.io.*;\nimport javax.servlet.*;\nimport javax.servlet.http.*;\nimport\
    \ java.util.*;\n\n// Extend HttpServlet class\npublic class ErrorHandler extends\
    \ HttpServlet {\n\n// Method to handle GET method request.\npublic void doGet(HttpServletRequest\
    \ request,\nHttpServletResponse response)\nthrows ServletException, IOException\
    \ {\n\n// Analyze the servlet exception\nThrowable throwable = (Throwable)\nrequest.getAttribute(\"\
    javax.servlet.error.exception\");\nInteger statusCode = (Integer)\nrequest.getAttribute(\"\
    javax.servlet.error.status_code\");\nString servletName = (String)\nrequest.getAttribute(\"\
    javax.servlet.error.servlet_name\");\nif (servletName == null){\n    servletName\
    \ = \"Unknown\";\n}\nString requestUri = (String)\nrequest.getAttribute(\"javax.servlet.error.request_uri\"\
    );\nif (requestUri == null){\n    requestUri = \"Unknown\";\n}\n```\n\n```java\n\
    // Set response content type\nresponse.setContentType(\"text/html\");\n```\n\n\
    ```java\nPrintWriter out = response.getWriter();\nString title = \"Error/Exception\
    \ Information\";\nString docType = \\\n\"<!DOCTYPE html //W3C//DTD HTML 4.0\"\
    \ + \\\n\"//transitional/EN>\\n\";\nout.println(docType + \\\n\"<html>\" +\n\"\
    <head><title>\" + title + \"</head>\\n\" +\n\"<body bgcolor=\\\"f0f0f0\\\">\n\
    ```\n\n```java\nif (throwable == null && statusCode == null) {\n    out.println(\"\
    <h2>Error information is missing</h2>\" + \"\\n\");\n    out.println(\"Please\
    \ return to the <a href=\\\"\");\n```\n\n![](img/d35069288ea1c8c6f3ed55795768f9dc_55_0.png)\n\
    \n```java\nout.println(\"The exception message: \" +\nthrowable.getMessage());\n\
    }\nout.println(\"</body>\");\nout.println(\"</html>\");\n\n// Method to handle\
    \ POST request.\npublic void doPost(HttpServletRequest request,\nHttpServletResponse\
    \ response)\nthrows ServletException, IOException {\n    doGet(request, response);\n\
    }\n```\n\nCompile **ErrorHandler.java** in usual and put your class in <tomcat-directory>/webapps/ROOT/WEB-INF/classes.\
    \ Let us add the following in web.xml to handle exceptions:\n\n```xml\n<servlet>\n\
    \  <servlet-name>ErrorHandler</servlet-name>\n  <class>ErrorHandler</class>\n\
    </servlet>\n<!-- servlet-mappings -->\n<servlet-mapping>\n  <servlet-name>ErrorHandler</servlet-name>\n\
    \  <url-pattern>/ErrorHandler</url-pattern>\n</servlet-mapping>\n<error-page>\n\
    \  <error-code>404</error-code>\n  <location>ErrorHandler</location>\n</error-page>\n\
    <error-page>\n  <exception-type>java.lang.Throwable</exception-type>\n  <location>ErrorHandler</location>\n\
    </error-page>\n```\n\nNow try to use a servlet which raise any exception or type\
    \ a wrong URL, this would trigger Web Container to call all **ErrorHandler** servlet\
    \ and display an appropriate message as programmed.\n\n![](img/d35069288ea1c8c6f3ed55795768f9dc_56_0.png)\n\
    \n```\nThe status code : 404\n```\n\nThe above code may not work with some browsers.\
    \ So try with Mozilla and Safari and it should work.\n\n# 11. Servlets – Cookies\
    \ Handling\n\nCookies are text files stored on the client computer and they are\
    \ kept for various information purpose. Java Servlets transparently supports HTTP\
    \ cookies. There are three steps in identifying users:\n\n- Server script sends\
    \ a set of cookies to the browser. For example, age, or identification number\
    \ etc.\n- Browser stores this information on local machine for future use.\n-\
    \ When next time browser sends any request to web server it sends those cookies\
    \ information to the server and uses that information to identify the user.\n\n\
    This chapter will teach you how to set or reset cookies, how to access them and\
    \ how to delete them.\n\n# The Anatomy of a Cookie\n\nCookies are usually set\
    \ in an HTTP header (although JavaScript can also set a cookie directly on browser).\
    \ A servlet that sets a cookie might have headers that look like this:\n\n```\n\
    HTTP/1.1 200 OK\nDate: Fri, 04 Feb 2000 21:03:38 GMT\nServer: Apache/1.3.9 (UNIX)\
    \ PHP/4.0\nSet-Cookie: name=xyz; expires=Friday, 04-Feb-2007 22:03:38 GMT;\npath=/;\
    \ domain=tutorialpoint.com\nConnection: close\nContent-Type: text/html\n```\n\n\
    As you can see, the Set-Cookie header contains a name value pair, a GMT date,\
    \ a path and a domain. The name and value will be URL encoded. The expires field\
    \ is an instruction to the browser to \"Forget\" the cookie after the given time\
    \ and date.\n\nIf the browser is configured to store cookies, it will keep this\
    \ information until the expiry date. If the user uses the browser at any page\
    \ that matches the path and domain of the cookie, it will resend the cookie to\
    \ the server. The browser’s headers might look something like this:\n\n```\nGET\
    \ / HTTP/1.0\nConnection: Keep-Alive\nUser-Agent: Mozilla/4.6 (X11; I; Linux 2.2.6-15-apm)\n\
    Host: zink.demon.co.uk:1126\nAccept: image/gif, /*\nAccept-Encoding: gzip\nAccept-Language:\
    \ en\nAccept-Charset: iso-8859-1,*utf-8\nCookie: name=xyz\n```\n\nA servlet will\
    \ then have access to the cookie through the request method request.Cookies()\
    \ which returns an array of Cookie objects.\n\n# Servlet Cookies Methods\n\nFollowing\
    \ is the list of useful methods which you can use while manipulating cookies in\
    \ servlet.\n\n| S.N. | Method & Description |\n|---|---|\n| 1 | public void setDomain(String\
    \ pattern) This method sets the domain to which cookie applies, for example tutorialspoint.com.\
    \ |\n| 2 | public String getDomain() This method gets the domain to which cookie\
    \ applies, for example tutorialspoint.com. |\n| 3 | public void setMaxAge(int\
    \ expiry) This method sets how much time (in seconds) should elapse the cookie.\
    \ If you don't set it, the cookie will last only for the current session. |\n\
    | 4 | public int getMax() This method returns the maximum age of the cookie, specified\
    \ in seconds, By default -1 indicating the cookie will persist until browser shutdown.\
    \ |\n| 5 | public String getName() This method returns the name of the cookie.\
    \ The name cannot be changed after creation. |\n| 6 | public void setValue(String\
    \ newValue) This method sets the value associated with the cookie. |\n| 7 | public\
    \ String getValue() This method gets the value associated with the cookie. |\n\
    | 8 | public void setPath(String uri) This method sets the path to which this\
    \ cookie applies. If you don't specify a path, the cookie is returned for all\
    \ URLs in the current page as well as subdirectories. |\n| 9 | public String getPath()\
