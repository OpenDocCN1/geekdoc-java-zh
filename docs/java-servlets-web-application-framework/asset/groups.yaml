    # 2. Servlets – Environment Setup


    A development environment is where you would develop your Servlet, test them and
    finally run them.


    Like any other Java program


    This development environment setup involves the following steps:


    # Setting up Java Development Kit


    This step involves downloading an implementation of the Java Software Development
    Kit (SDK) and setting up PATH environment variable appropriately.


    You can download SDK from Oracle''s Java site: Java SE Downloads.


    Once you download your Java implementation, follow the given instructions to install
    and configure the setup. Finally set PATH and JAVA_HOME environment variables
    to refer to the directory that contains Java and javac, typically java_install_dir/bin
    and java_install_dir_respectively.


    If you are running Windows and installed the SDK in C:\jdk1.8.0_65, you would
    put the following line in your C:\autocec.bat file.


    ```

    set PATH=C:\jdk1.8.0_65\bin;%PATH%

    set JAVA_HOME=C:\jdk1.8.0_65

    ```


    Alternatively, on Windows NT/2000/XP, you could also right-click on My Computer,
    select Properties, then Advanced, Environment Variables. Then, you would update
    the PATH value and press the OK button.


    On Unix (Solaris, Linux, etc.), if the SDK is installed in /usr/local/jdk1.8.0_65
    and you use the C shell, you would put the following into your .shrc file.


    ```

    setenv PATH /usr/local/jdk1.8.0_65:$PATH

    setenv JAVA_HOME /usr/local/jdk1.8.0_65

    ```


    Alternatively, if you use an Integrated Development Environment (IDE) like Borland
    JBuilder, Eclipse, IntelliJ IDEA, or Sun One Studio, compile and run a simple
    program to confirm that the IDE knows where you installed Java.


    # Setting Web Server: Tomcat


    A number of Web Servers that support servlets are available in the market. Some
    web servers are freely downloadable and Tomcat is one of them.


