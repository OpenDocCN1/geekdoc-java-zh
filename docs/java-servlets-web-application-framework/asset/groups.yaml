    \n# 12. Servlets – 会话跟踪\n\nHTTP 是一种无状态协议，这意味着每次客户端检索 Web 页面时，客户端都会打开一个新的连接，服务器不会自动保留之前的请求记录。\n\
    \n仍然有以下三种方法可以在 web 客户端和服务器之间维护会话：\n\n### Cookies\n\n服务器为每个 web 客户端分配一个唯一的 Session\
    \ ID 作为 cookie，后续的请求可以通过收到的 cookie 进行识别。\n\n这可能不是一种有效的方法，因为浏览器不支持 cookies，因此我不建议使用此过程来维护会话。\n\
    \n### 隐藏表单字段\n\nWeb 服务器可以同唯一的 Session ID 一起发送“隐藏”HTML 表单字段，如下：\n\n```html\n<input\
    \ type=\"hidden\" name=\"sessionid\" value=\"12345\">\n```\n\n此条目在表单提交时，指定的名称和值会自动包含在\
    \ GET 或 POST 数据中。每当 web 浏览器返回时，可以使用 session_id 值跟踪不同的浏览器。\n\n### URL 重写\n\n你可以在每个\
    \ URL 的末尾附加标识会话的额外数据，并将会将话标识符与其存储的关于该会话的数据关联。\n\n例如，通过 `http://tutorialspoint.com/file.htm;session=12345`，会话标识符被附加为\
    \ `sessionid=12345`，可以在 Web 服务器访问以识别客户端。\n\nURL 重写是维护会话更好的方法，并且在浏览器不支持 cookies\
    \ 的情况下有效。URL 重写的缺点是，你需要动态生成每个 URL 以分配 Session ID，即使对于简单的静态 HTML 页面也是如此。\n\n\n"
