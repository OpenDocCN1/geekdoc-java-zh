    \   int hour = calendar.get(HOUR);\n    int minute = calendar.get(MINUTE);\n \
    \   int second = calendar.get(SECOND);\n    String am_pm;\n    if(calendar.get(Calendar.AM_PM)\
    \ == 0) {\n        am_pm = \"AM\";\n    else\n        am_pm = \"PM\";\n\n    String\
    \ CT = hour+\":\" + minute+\":\" + second + \" \" + am_pm;\n\n    PrintWriter\
    \ out = response.getWriter();\n    String title = \"Auto Refresh using Servlet\"\
    ;\n    String doctype = \"<!doctype html \\-//www.w3.org//DTD HTML 4.0 \" + +\
    \ \n    \"//transitional/EN//\\n\";\n\n    out.println(doctype + \n    \"<html>\\\
    n\" + \n    \"<title>\" + title + \"</title><head>\\n\" + \n    \"<body bgcolor=\\\
    \"#f0f0f0\\\">\\n\" + \n    \"<h1 align=\\\"center\\\">\" + title + \"</h1>\\\
    n\" + \n    \"<p>Current Time is: \" + CT + \"</p>\\n\" +\n    \"</body></html>\\\
    n\");\n}\n\n// Method to handle GET request.\npublic void doGet(HttpServletRequest\
    \ request,\n    HttpServletResponse response)\n    throws ServletException, IOException\
    \ {\n    response.setIntHeader(\"Refresh\", 5);\n}\n\n// Method to handle POST\
    \ request.\npublic void doPost(HttpServletRequest request,\nHttpServletResponse\
