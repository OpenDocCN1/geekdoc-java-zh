    # @WebFilter


    This is the annotation used to declare a servlet filter. It is processed by the
    container deployment time, and the corresponding filter applied to the specified
    URL patterns, servlets, and dispatcher types.


    The @WebFilter annotation defines a filter in a web application. This annotation
    is specified on a class and contains metadata about the filter being declared.
    The annotated filter must specify at least one URL pattern. The following table
    lists the attributes used for @WebFilter annotation.


    | Attribute Name | Description |

    | --- | --- |

    | String filterName | Name of the filter |

    | String[] value | Provides array of values or urlPatterns to which the filter
    applies |

    | String[] urlPatterns dispatcherType[] | Specifies the types of dispatcher (Request/Response)
    to which the filter applies |

    | String[] servletNames | Provides an array of servlet names |

    | String description | Description of the filter |

    | WebInitParam[] initParams | Array of initialization parameters for this filter
    |

    | Boolean asyncSupported | Asynchronous operation supported by this filter |

    | String smallIcon | Small icon for this filter, if present |

    | String largeIcon | Large icon for this filter, if present |


    # Example


    The following example describes how to use @WebFilter annotation. It is a simple
    LogFilter that displays the value of In-param test-param and the current time
    timestamp on the console. It means, the filter works like an interface layer between
    the request and the response. We use "/*" for urlPattern. It means, this filter
    is applicable for all servlets.


    ```

    import java.io.IOException;

    import javax.servlet.annotation.WebFilter;

    import javax.servlet.annotation.WebInitParam;

    import javax.servlet.*;

    import java.util.*;


    // Implements Filter class

    ```


