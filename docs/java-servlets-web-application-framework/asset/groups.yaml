    # 8. Servlets – Http Status Codes


    The format of the HTTP request and HTTP response messages are similar and will
    have following structure:


    +   - An initial status line + CRLF (Carriage Return + Line Feed i.e. New Line)

    - Zero or more header lines + CRLF

    - A blank line, i.e., a CRLF

    - An optional message body like file, query data or query output.


    For example, a server response header looks as follows:


    ```

    HTTP/1.1 200 OK

    Content-Type: text/html

    Header2: ...

    ...

    BrN: ...

    (Blank Line)

    <!doctype ...>

    <html>

    <head>...</head>

    <body>

    ...

    </body>

    </html>

    ```


    The status line consists of the HTTP version (HTTP/1.1 in the example), a status
    code (200 in the example), and a very short message corresponding to the status
    status code (OK in the example).


    Following is a list of HTTP status codes and associated messages that might be
    returned from the Web Server:


    | Code | Description |

    |---|---||

    | 100 | Continue | Only a part of the request has been received by the server,
    but as long as it has not been rejected, the client should continue with the request
    |

    | 101 | Switching Protocols | The server switches protocol. |


    ![](img/d35069288ea1c8c6f3ed55795768f9dc_42_0.png)'
