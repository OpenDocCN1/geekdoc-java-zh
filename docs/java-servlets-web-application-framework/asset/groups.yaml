    # 11. Servlets – Cookies Handling


    Cookies are text files stored on the client computer and they are kept for various
    information tracking purpose. Java Servlets transparently supports HTTP cookies.


    There are three steps in identifying returning users:


    +   * Server script sends a set of cookies to the browser. For example, age, or
    identification number etc.

    * Browser stores this information on local machine for future use.

    * When next time browser sends any request to web server then it sends those cookies
    information to the server and uses that information to identify the user.


    This chapter will teach you how to set or reset cookies, how to access them and
    how to delete them.


    # The Anatomy of a Cookie


    Cookies are usually set in an HTTP header (although JavaScript can also set a
    cookie directly on a browser). A servlet that sets a cookie might have headers
    that look like this:


    ```

    HTTP/1.1 200 OK

    Date: Fri, 04 Feb 2000 21:03:38 GMT

    Server: Apache/1.3.9 (UNIX) PHP/4.0b3

    Set-Cookie: name=xyz; expires=Friday, 04-Feb-07 22:03:38 GMT;

    path=/; domain=tutorialpoint.com

    nConnection: close

    Content-Type: text/html

    ```


    As you can see, the Set-Cookie header contains a name value pair, a GMT date,
    a path and a domain. The name and value will be URL encoded. The expires field
    is an instruction to the browser to "Forget" the cookie after the given time and
    date.


    If the browser is configured to store cookies, it will keep this information until
    the expiry date. If the user uses the browser at any page that matches the path
    and domain of the cookie, it will resend the cookie to the server. The browser’s
    headers might look something like this:


    ```

    GET / HTTP/1.0

    Connection: Keep-Alive

    User-Agent: Mozilla/4.6 (X11; I; Linux 2.2.6-15apmac ppc)

    ```


