    # @WebServlet


    The @WebServlet is used to declare the configuration of a Servlet with a container.
    The following table contains the list of attributes used for WebServlet annotation.


    | Attribute Name | Description |

    | --- | --- |

    | String name | Name of the Servlet |

    | String[] value | Array of URL patterns |

    | String[] urlPatterns | Array of URL patterns to which this Filter applies |

    | Int onLoad | The integer value gives you the startup ordering hint |

    | WebInitParam[] initParams | Array of initialization parameters for this Servlet
    |

    | Boolean asyncSupported | Asynchronous operation supported by this Servlet |

    | String smallIcon | Small icon for this Servlet, if present |

    | String largeIcon | Large icon for this Servlet, if present |

    | String description | Description of this Servlet, if present |

    | String displayName | Display name of this Servlet, if present |


    At least one URL pattern MUST be declared in either the value or urlPattern attribute
    of the annotation, but not both.


    The value attribute is recommended for use when the url pattern is the only attribute
    being set, otherwise the urlPattern attribute should be used.


    # Example


    The following example describes how to use @WebServlet annotation. It is a simple
    servlet that displays the text Hello Servlet.


    ```

    import java.io.IOException;

    import java.io.PrintWriter;

    import javax.servlet.ServletExceptionException;

    import javax.servlet.annotation.WebInitParam;

    import javax.servlet.annotation.WebServlet;

    import javax.servlet.http.HttpServlet;

    import javax.servlet.http.HttpServletRequest;

    import javax.servlet.http.HttpServletResponse;

    ```


