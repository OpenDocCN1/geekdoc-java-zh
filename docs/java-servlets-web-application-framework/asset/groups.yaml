    # JAVA SERVLETS

    Web 应用框架


    # tutorialspoint

    简单易学


    # 关于教程


    Servlets 提供了一种基于组件的、平台无关的方法，用于构建 Web 应用程序，且不受限于 CGI 程序的性能限制。Servlets 可以访问整个 Java
    API 家族，包括用于访问企业级数据库的 JDBC API。


    本教程将教你如何通过简单易的步骤使用 Java Servlets 开发你的 Web 应用程序。


    # 目标读者


    本教程专为需要理解 Java Servlets 框架及其 API 的 Java 程序员设计。完成本教程后，你将发现自己在使用 Java Servlets 方面达到了中等水平，并可以在此基础上更高水平迈进。


    # 前提条件


    我们假设你对 Java 编程语言有良好的理解。如果你对 Web 应用以及互联网的工作原理有了解，将更好。


