    # 15. Servlet – Handling Date


    One of the most important advantages of using Servlet is that you can use most
    of the methods available in core Java. This tutorial would take you through Java
    provided Date class which is available in java.util package, this class encapsulates
    the current date and time.


    The Class supports two constructors. The first constructor initializes the object
    with the current date and time.


    ```

    Date()

    ```


    The following constructor accepts one argument that equals the number of milliseconds
    that have elapsed since midnight, January 1, 1970


    ```

    Date(long millisec)

    ```


    Once you have a Date object available, you can call any of the following support
    methods to play with dates:


    | SN | Methods with Description |

    | 1 | boolean after(Date date) Returns true if the invoking Date object contains
    a date that is later than the one specified by date, otherwise, it returns false.
    |

    | 2 | boolean before(Date date) Returns true if the invoking Date object contains
    a date that is earlier than the one specified by date, otherwise, it returns false.
    |

    | 3 | Object clone() Duplicates the invoking Date object. int compareTo(Date date)
    Compares the value of the invoking object with that of date. Returns 0 if the
    values are equal. Returns a negative value if the invoking object is earlier than
    date. int compareTo(Object obj) Operates identically to compareTo(Date) if obj
    is of class Date. Otherwise, it throws a ClassException. boolean equals(Object
    date) Returns true if the invoking Date object contains the same date and time
    as the one specified by date, otherwise, it returns false. |

    | 7 | long getTime() Returns the number of milliseconds that have elapsed since
    January 1, 1970. |

    | 8 | int hashCode() Returns a hash code for the invoking object. |

    | 9 | void setTime(long time) Sets the date and time as specified by time, which
    represents an elapsed time in milliseconds from midnight, January 1, 1970. |

    | 10 | String toString() Converts the invoking Date object into a string and returns
    the result. |


    ![](img/d35069288ea1c8c6f3ed55795768f9dc_86_0.png)'
- md: "\n# Getting Current Date & Time\n\nThis is very easy to get current date and\
    \ time in Java Servlet. You can use a simple Date object with toString() method\
    \ to print current date and time as follows:\n\n```java\n// Import required java\
    \ libraries\nimport java.io.*;\nimport java.util.Date;\nimport javax.servlet.*;\n\
    import javax.servlet.http.*;\n\n// Extend HttpServlet class\npublic class CurrentDate\
    \ extends HttpServlet {\n\n    public void doGet(HttpServletRequest request, HttpServletResponse\
    \ response)\n            throws ServletException, IOException {\n\n        //\
    \ Set response content type\n        response.setContentType(\"text/html\");\n\
    \n        PrintWriter out = response.getWriter();\n        String title = \"Display\
    \ Current Date & Time\";\n        Date date = new Date();\n        String docType\
    \ = \"<!DOCTYPE html PUBLIC-//W3C//DTD HTML 4.0//transitional//EN\\\">\";\n  \
    \      out.println(docType +\n            \"<html>\" +\n            \"<head><title>\"\
    \ + title + \"</title></head>\" +\n            \"<body bgcolor=\\\"f0f0f0\\\"\
    >\" +\n            \"<h1 align=\\\"center\\\">\" + title + \"</h1>\" +\n     \
    \       \"<h2 align=\\\"center\\\">\" + date.toString() + \"</h2>\" +\n      \
    \      \"</body></html>\");\n\n    }\n}\n```\n\n# Java Servlets\n\nNow let us\
    \ compile above servlet and create appropriate entries in web.xml and then call\
    \ this servlet using URL http://localhost:8080/CurrentDate. This would produce\
    \ following result:\n\n# Display Current Date & Time\n\nMon Jun 21 21:46:49 GMT+04:00\
    \ 2010\n\nTry to refresh URL http://localhost:8080/CurrentDate and you would find\
    \ difference in seconds every time you refresh.\n\n# Date Comparison\n\nAs mentioned\
    \ above you can use all the available Java methods in your Servlet. You need to\
    \ compare two dates, following are the methods:\n\n- You can use getTime() to\
    \ obtain the number of milliseconds that have elapsed since midnight, January\
    \ 1, 1970, for both objects and then compare these values.\n- You can use the\
    \ before(), after(), and equals(). Because the 12th of the month comes before\
    \ the 18th, for example, new Date(99, 2, 12).before(new Date(99, 2, 18)) returns\
    \ true.\n- You can use the compareTo() method, which is defined by the Comparable\
    \ interface and implemented by Date.\n\n# Date Formatting using SimpleDateFormat\n\
    \nSimpleDateFormat is a concrete class for formatting and parsing dates in a locale-sensitive\
    \ manner. SimpleDateFormat allows you to start by choosing any user-defined patterns\
    \ for date-time formatting.\n\nLet us might example as follows:\n\n```java\n//\
    \ Import required java libraries\nimport java.io.*;\nimport java.text.*;\nimport\
    \ java.util.Date;\nimport javax.servlet.*;\n\n// Extend HttpServlet class\npublic\
    \ class CurrentDate extends HttpServlet {\n```\n\n![](img/d35069288ea1c8c6f3ed55795768f9dc_88_0.png)\n\
    \n# Java Servlets\n\n```java\npublic void doGet(HttpServletRequest request,\n\
    \    HttpServletResponse response\n    throws ServletException, IOException\n\
    {\n    // Set response content type\n    response.setContentType(\"text/html\"\
    );\n\n    PrintWriter out = response.getWriter();\n    String title = \"Display\
    \ Current Date & Time\";\n    Date dNow = new Date();\n    SimpleDateFormat dateFormat\
    \ = new SimpleDateFormat(\" yyyy.MM.dd 'at' hh:mm:ss a zzz\");\n    String doctype\
    \ = \n        \"<!DOCTYPE html PUBLIC \\\"-//W3C//DTD HTML 4.0\\\" + \n      \
    \  \"//transitional/EN\\\">\" + \n    out.println(doctype + \n        \"<html>\\\
    n\" + \n        \"<head><title>\" + title + \"</title></head>\\n\" + \n      \
    \  \"<body bgcolor=\\\"f0f0f0\\\">\\n\" + \n        \"<h1 align=\\\"center\\\"\
    >\" + title + \"</h1>\\n\" + \n        \"<h2 align=\\\"center\\\">\" + dateFormat.format(dNow)\
    \ + \"</h2>\\n\" + \n        \"</body></html>\");\n}\n```\n\nCompile above servlet\
    \ once again and then call this servlet using URL http://localhost:8080/CurrentDate.\
    \ This would produce following result:\n\n# Display Current Date & Time\n\nMon\
    \ 2010.06.21 at 10:06:44 PM GMT+04:00\n\n# SimpleDateFormat Format Codes\n\nTo\
    \ specify the time use a pattern string. In this pattern, all ASCII letters are\
    \ reserved as pattern letters, which are defined as following:\n\n![](img/d35069288ea1c8c6f3ed55795768f9dc_89_0.png)\n\
    \n| Character | Description | Example |\n| :--- | :--- | :--- |\n| G | Era designator\
    \ | AD |\n| y | Year in four digits | 2010 |\n| M | Month in year | July |\n|\
    \ d | Day in month | 10 |\n| h | Hour in A.M./P.M. (1-12) | 12 |\n| H | Hour in\
    \ day (0-23) | 22 |\n| m | Minute in hour | 30 |\n| s | Second in minute | 55\
    \ |\n| S | Millisecond | 234 |\n| E | Day in week | Tuesday |\n| D | Day of year\
    \ | 360 |\n| F | Day of week in month | 2 (second in July) |\n| w | Week in year\
    \ | 40 |\n| W | Week in month | 1 |\n| a | A.M./P.M. marker | PM |\n| k | Hour\
    \ in day (0-23) | 24 |\n| K | Hour in A.M./P.M. (0-11) | 10 |\n| z | Time zone\
    \ | Eastern Standard Time |\n| ' | Escape for text | ' |\n| \" | Single quote\
    \ | \" |\n\nFor a complete list of constants available to manipulate date, refer\
    \ to standard Java documentation.\n\n# 16. Servlets – Redirection\n\nPage redirection\
    \ is a technique where the client is sent to a new location than requested. Page\
    \ redirection is generally used when a document moves to a new location or because\
    \ of load balancing.\n\nThe simplest way of redirecting a request to another page\
    \ is using sendRedirect() of response object. Following is the signature of this\
    \ method:\n\n```java\npublic void HttpServletResponse.sendRedirect(String location)\
    \ throws IOException\n```\n\nThis method sends back the response to browser along\
    \ with the status code and new page location. You can also use setStatus() and\
    \ setHeader() methods together to achieve this:\n\n```java\n...\nString site =\
    \ \"http://www.newpage.com\";\nresponse.setStatus(response.SC_MOVED_TEMP);\nresponse.setHeader(\"\
    Location\", site);\n...\n```\n\n# Example\n\nThis example shows how a servlet\
    \ performs page redirection to another location:\n\n```java\nimport java.io.*;\n\
    import java.sql.Date;\nimport java.util.*;\nimport javax.servlet.*;\nimport javax.servlet.http.*;\n\
    \npublic class PageRedirect extends HttpServlet{\n\npublic void doGet(HttpServletRequest\
    \ request,\n      HttpServletResponse response)\n      throws ServletException,\
    \ IOException\n{\n  // Set response content type\n  response.setContentType(\"\
    text/html\");\n```\n\n![](img/d35069288ea1c8c6f3ed55795768f9dc_91_0.png)\n\n#\
    \ Java Servlets\n\n```java\n// New location to be redirected\nString site = new\
    \ String(\"http://www.google.com\");\n\nresponse.setStatus(response.SC_MOVED_TEMP);\n\
    response.setHeader(\"Location\", site);\n```\n\nLet us compile above servlet and\
    \ create following entries in web.xml:\n\n```xml\n...\n<servlet>\n  <servlet-name>PageRedirect</servlet-name>\n\
    \  <servlet-class>PageRedirect</servlet-class>\n</servlet>\n\n<servlet-mapping>\n\
    \  <servlet-name>PageRedirect</servlet-name>\n  <url-pattern>PageRedirect</url-pattern>\n\
    </servlet-mapping>\n...\n```\n\nNow call this servlet using URL http://localhost:8080/PageRedirect.\
    \ This would redirect you to URL http://www.google.com.\n\n![](img/d35069288ea1c8c6f3ed55795768f9dc_92_0.png)\n\
    \n# 17. Servlets – Hits Counter\n\n# Hit Counter for a Web Page\n\nMany times\
    \ you would be interested in knowing total number of hits on a particular page\
    \ of your website. It is very simple to count these hits using a servlet because\
    \ the life cycle of a servlet is controlled by the container in which it runs.\n\
    \nFollowing are the steps to be taken to implement a simple page hit counter which\
    \ is based on Servlet Life Cycle:\n\n- Initialize a global variable in init()\
    \ method.\n- Increase global variable every time either doGet() or doPost() method\
    \ is called.\n- If you require, you can use a database table to store the value\
    \ of global variable in destroy() method. This value can be read inside init()\
    \ when servlet would be initialized next time. This step is optional.\n- If you\
    \ want to count unique page hits in a session you can use isNew() method to check\
    \ if same page already have been hit within that session. This step is optional.\n\
    - You can display value of the global counter to show total number of hits on\
    \ your web site. This step is also optional.\n\nHere I'm assuming that the web\
    \ container will not be restarted. If it is restarted or servlet destroyed, the\
    \ hit counter will be reset.\n\n# Example\n\nThis example shows how to implement\
    \ a simple page hit counter:\n\n```java\nimport java.io.*;\nimport java.sql.Date;\n\
    import java.util.*;\nimport javax.servlet.*;\nimport javax.servlet.http.*;\n\n\
    public class PageHitCounter extends HttpServlet{\n\nprivate int hitCount;\n\n\
    public void init()\n```\n"
  mdcn: "\n\n# 获取当前日期与时间\n\n在 Java Servlet 中获取当前日期和时间非常简单。你可以使用简单的 `Date` 对象配合 `toString()`\
    \ 方法按照如下所示打印当前日期和时间：\n\n```java\n// Import required java libraries\nimport java.io.*;\n\
    import java.util.Date;\nimport javax.servlet.*;\nimport javax.servlet.http.*;\n\
    \n// Extend HttpServlet class\npublic class CurrentDate extends HttpServlet {\n\
    \n    public void doGet(HttpServletRequest request, HttpServletResponse response)\n\
    \            throws ServletException, IOException {\n\n        // Set response\
    \ content type\n        response.setContentType(\"text/html\");\n\n        PrintWriter\
    \ out = response.getWriter();\n        String title = \"Display Current Date &\
    \ Time\";\n        Date date = new Date();\n        String docType = \"<!DOCTYPE\
    \ html PUBLIC-//W3C//DTD HTML 4.0//transitional//EN\\\">\";\n        out.println(docType\
    \ +\n            \"<html>\" +\n            \"<head><title>\" + title + \"</title></head>\"\
    \ +\n            \"<body bgcolor=\\\"f0f0f0\\\">\" +\n            \"<h1 align=\\\
    \"center\\\">\" + title + \"</h1>\" +\n            \"<h2 align=\\\"center\\\"\
    >\" + date.toString() + \"</h2>\" +\n            \"</body></html>\");\n\n    }\n\
    }\n```\n\n# Java Servlets\n\n现在让我们编译上面的 servlet 并在 `web.xml` 中创建相应的条目，然后使用 URL\
    \ `http://localhost:8080/CurrentDate` 调用此 servlet。这将产生如下结果：\n\n# 显示当前日期与时间\n\n\
    Mon Jun 21 21:46:49 GMT+04:00 2010\n\n尝试刷新 URL `http://localhost:8080/CurrentDate`，你会发现每次刷新时秒数都有变化。\n\
    \n# 日期比较\n\n如上所述，你可以在 Servlet 中使用所有可用的 Java 方法。你需要比较两个日期，以下是相关方法：\n\n- 你可以使用 `getTime()`\
    \ 来获取两个对象自 1970 年 1 月 1 日午夜以来经过的毫秒数，然后比较这些值。\n- 你可以使用 `before()`、`after()` 和 `equals()`。例如，因为某月的\
    \ 12 号在 18 号之前，所以 `new Date(99, 2, 12).before(new Date(99, 2, 18))` 返回 `true`。\n\
    - 你可以使用 `compareTo()` 方法，该方法由 `Comparable` 接口定义并由 `Date` 实现。\n\n# 使用 SimpleDateFormat\
    \ 日期格式\n\n`SimpleDateFormat` 是一个具体的类，用于以敏感区域的方式格式化和解析日期。`SimpleDateFormat` 允许你从选择任何用户定义的日期-时间格式模式开始。\n\
    \n让我们看如下面的示例：\n\n```java\n// Import required java libraries\nimport java.io.*;\n\
    import java.text.*;\nimport java.util.Date;\nimport javax.servlet.*;\n\n// Extend\
    \ HttpServlet class\npublic class CurrentDate extends HttpServlet {\n```\n\n![](img/d35069288ea1c8c6f3ed55795768f9dc_88_0.png)\n\
    \n# Java Servlets\n\n```java\npublic void doGet(HttpServletRequest request,\n\
    \    HttpServletResponse response\n    throws ServletException, IOException\n\
    {\n    // Set response content type\n    response.setContentType(\"text/html\"\
    );\n\n    PrintWriter out = response.getWriter();\n    String title = \"Display\
    \ Current Date & Time\";\n    Date dNow = new Date();\n    SimpleDateFormat dateFormat\
    \ = new SimpleDateFormat(\" yyyy.MM.dd 'at' hh:mm:ss a zzz\");\n    String doctype\
    \ = \n        \"<!DOCTYPE html PUBLIC \\\"-//W3C//DTD HTML 4.0\\\" + \n      \
    \  \"//transitional/EN\\\">\" + \n    out.println(doctype + \n        \"<html>\\\
    n\" + \n        \"<head><title>\" + title + \"</title></head>\\n\" + \n      \
    \  \"<body bgcolor=\\\"f0f0f0\\\">\\n\" + \n        \"<h1 align=\\\"center\\\"\
    >\" + title + \"</h1>\\n\" + \n        \"<h2 align=\\\"center\\\">\" + dateFormat.format(dNow)\
    \ + \"</h2>\\n\" + \n        \"</body></html>\");\n}\n```\n\n再次编译上面的 servlet，然后使用\
    \ URL `http://localhost:8080/CurrentDate` 调用此 servlet。这将产生如下结果：\n\n# 显示当前日期与时间\n\
    \nMon 2010.06.21 at 10:06:44 PM GMT+04:00\n\n# SimpleDateFormat 格式代码\n\n使用模式字符串来指定时间。在这些模式中，所有\
    \ ASCII 字母都被留作模式字母，其定义如下：\n\n![](img/d35069288ea1c8c6f3ed55795768f9dc_89_0.png)\n\
    \n| 字符 | 说明 | 示例 |\n| :--- | :--- | :--- |\n| G | 时代标识符 | AD |\n| y | 四位年份 | 2010\
    \ |\n| M | 年中的月份 | July |\n| d | 月中的日期 | 10 |\n| h | A.M./P.M. 内的小时 (1-12) | 12\
    \ |\n| H | 天中的小时 (0-23) | 22 |\n| m | 小时内的分钟 | 30 |\n| s | 分钟内的秒 | 55 |\n| S |\
    \ 毫秒 | 234 |\n| E | 周中的几几 | Tuesday |\n| D | 年中的第 | 360 |\n| F | 月中的周几 | 2 (7\
    \ 月的第二个星期) |\n| w | 年中的几周 | 40 |\n| W | 月中的几周 | 1 |\n| a | A.M./P.M. 标记 | PM |\n\
    | k | 天中的小时 (0-23) | 24 |\n| K | A.M./P.M. 内的小时 (0-11) | 10 |\n| z | 时区 | Eastern\
    \ Standard Time |\n| ' | 文本转义 | ' |\n| \" | 单引号 | \" |\n\n有关可用于操作日期的完整常量列表，请参考标准的\
    \ Java 文档。\n\n# 16. Servlets – 重定向\n\n页面重定向是一种技术，将客户端发送到比请求的新的位置。页面重定向通常用于文档移动到新位置或由于负载均衡。\n\
    \n将请求重定向到另一个页面的最简单方法是使用 `response` 对象的 `sendRedirect()`。以下是该方法的签名：\n\n```java\n\
    public void HttpServletResponse.sendRedirect(String location) throws IOException\n\
    ```\n\n此方法将响应发回浏览器。你可以结合 `setStatus()` 和 `setHeader()` 方法来实现带有状态码和新页面位置的响应：\n\n\
    ```java\nresponse.setStatus(HttpServletResponse.SC_MOVED_PERMANENTLY);\nresponse.setHeader(\"\
    Location\", site);\n```\n\n# 示例\n\n此示例显示 servlet 重定向到另一个位置：\n\n```java\nimport\
    \ java.io.*;\nimport java.text.*;\nimport java.util.*;\nimport javax.servlet.*;\n\
    import javax.servlet.http.*;\n\npublic class PageRedirect extends HttpServlet{\n\
    \npublic void doGet(HttpServletRequest request,\n      HttpServletResponse response\n\
    \      throws ServletException, IOException\n{\n  // Set response content type\n\
    \  response.setContentType(\"text/html\");\n```\n\n![](img/d35069288ea1c8c6f3ed55795768f9dc_91_0.png)\n\
    \n# Java Servlets\n\n```java\n// 重重定向\nStringString = \"http://www..com\n\n```\n\
    \n.......__ENT\n\n\n\n.......\n\n\n\n\n\n\n\n```\n\n在 web.xml 中创建以下条目：\n\n```xml\n\
    ...\n<servlet>\n  <servlet-name>PageRedirect</servlet-name>\n  <servlet-class>PageRedirect</servlet-class>\n\
    </servlet>\n\n<servlet-mapping>\n  <servlet-name>PageRedirect</servlet-name>\n\
    \  <url-pattern>PageRedirect</url-pattern>\n</servlet-mapping>\n...\n```\n\n```java\n\
    response.setStatus(SC_MOVED_\nresponse.setHeader(\"Location\", site);\n```\n\n\
