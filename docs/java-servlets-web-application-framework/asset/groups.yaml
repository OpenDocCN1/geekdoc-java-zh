    ![](img/d35069288ea1c8c6f3ed55795768f9dc_29_0.png)\n\n# 6. Servlets – 客户端 HTTP\
    \ 请求\n\n当浏览器请求网页时，它会向服务器发送大量信息，这些信息无法直接读取，因为它们是请求头的一部分。你可以检查 HTTP 协议获取更多信息。\n\n\
    以下是来自浏览器并在 Web 开发中经常使用的重要头部信息：\n\n| 头部 | 描述 |\n| --- | --- |\n| Accept | 此头部指定浏览器或其他客户端可以处理的\
    \ MIME 类型。**image/jpeg** 或 **png** 是常见的值。 |\n| Accept-Charset | 此头部指定浏览器用于显示信息的字符集。例如\
    \ ISO-8859-1。 |\n| Accept-Encoding | 此头部指定浏览器知道如何处理的类型。**gzip** 或 **compress**\
    \ 是常见的值。 |\n| Accept-Language | 此头部指定客户端偏好的语言，Servlet 可以产生多种语言的结果。例如 en-us, ru\
    \ 等。 |\n| Authorization | 此头部用于客户端在访问受密码保护的网页时识别自己的身份。 |\n| Connection | 此头部指示客户端是否可以处理持久\
    \ HTTP 连接。持久连接允许客户端或其他浏览器通过单个请求检索多个文件。**Keep-Alive** 值意味着应该使用持久连接。 |\n| Content-Length\
    \ | 此头部仅适用于 POST 请求，并给出 POST 数据的大小（字节）。 |\n| Cookie | 此头部将 Cookie 返回给之前发送给浏览器的服务器。\
    \ |\n| Host | 此头部指定原始 URL 中的主机名和端口。 |\n| If-Modified-Since | 此头部指示客户端仅在网页在指定日期之后发生更改时请求页面。如果没有更新结果，服务器将返回\
    \ 304 状态码，表示**未修改** 头部。 |\n\n"
