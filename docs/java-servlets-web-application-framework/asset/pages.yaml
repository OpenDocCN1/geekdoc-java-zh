  md: '# Java Servlets


    | If-Unmodified-Since | This header is the reverse of If-Modified-Since; it specifies
    that the operation should succeed if only the document is older than the specified
    date. |

    | Referrer | This header indicates the URL of the referring Web page. For example,
    if you are at Web page 1 and click on a link to Web page 2, the URL of Web page
    1 is included in the Referrer header when the browser requests Web page 2. |

    | User-Agent | This header identifies the browser or other client making the request
    and can be used to return different content to different types of browsers. |


    # Methods to read HTTP Header


    There are following methods which can be used to read HTTP header in your servlet
    program. These methods are available with HttpServletRequest object.


    | S.N. | Method & Description |

    | 1 | Cookie[] getCookies() Returns an array containing all the Cookie objects
    the client sent with this request. |

    | 2 | Enumeration getAttributeNames() Returns an enumeration containing the names
    of the attributes available to this request. |

    | 3 | Enumeration getHeaderNames() Returns an enumeration of all the header names
    this request contains. |

    | 4 | Enumeration getParameterNames() Returns an Enumeration of String objects
    containing the names of the parameters contained in this request. |

    | 5 | HttpSession getSession() Returns the current session associated with this
    request, or if the request does not have a session, creates one. |

    | 6 | HttpSession getSession(boolean create) Returns the current HttpSession associated
    with this request or, if there is no current session and value of create is true,
    returns a new session. |

    | 7 | Locale getLocale() Returns the preferred Locale that the client will accept
    content in, based on the Accept-Language header. |'
