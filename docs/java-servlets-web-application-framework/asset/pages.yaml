  md: "# 3. Servlets – Life Cycle\n\nA servlet life cycle can be defined as the entire\
    \ process from its creation till the destruction. The following are the paths\
    \ followed by a servlet\n\n+   - The servlet is initialized by calling the init()\
    \ method.\n- The servlet calls service() method to process a client's request.\n\
    - The servlet is terminated by calling the destroy() method.\n- Finally, servlet\
    \ is garbage collected by the garbage collector of the JVM.\n\nNow us discuss\
    \ the life cycle methods in detail.\n\n# The init() Method\n\nThe init method\
    \ is called only once. It is called only when the servlet is created, and not\
    \ called for any user requests afterwards. So, it is used for one-time initializations,\
    \ just as with the init method of applets.\n\nThe servlet is normally created\
    \ when a user first invokes a URL corresponding to the servlet, but you can also\
    \ see that the servlet be created when the server is started.\n\nWhen a user invokes\
    \ a servlet, a single instance of servlet gets created, with each user request\
    \ requesting a new thread that is handed off to doGet or doPost as appropriate.\
    \ The init() method simply creates or loads some data that will be used throughout\
    \ the life of the servlet.\n\nThe init method void init() throws ServletException\
    \ like this:\n\n```\npublic void init() throws ServletException {\n    // Initialization\
    \ code...\n}\n```\n\n# The service() Method\n\nThe service() is the main method\
    \ to perform the actual task. The servlet container (i.e. web server) calls the\
    \ service() method to handle requests coming from the client (browsers) and to\
    \ write the formatted response back to the client.\n\nEach time the server receives\
    \ a request for a servlet, the server spawns a new thread and calls service. The\
    \ service() method checks the HTTP request type (GET, POST, PUT, DELETE, etc.)\
    \ and calls doGet, doPost, doPut, doDelete, etc. methods as appropriate.\n\n![](img/d35069288ea1c8c6f3ed55795768f9dc_13_0.png)"
  merge: -1
  pgno: 13
- img_proc: true
  md: "# Java Servlets\n\nHere is the signature of this method:\n\n```\npublic void\
    \ service(ServletRequest request,\n    ServletResponse response\nthrows ServletException,\
    \ IOException(\n)\n```\n\nThe service ( ) method is called by the container and\
    \ service method invokes doGe,\ndoPost, doPut, doDelete, etc. methods as appropriate.\
    \ So you have nothing to do with\nservice() method but you should override doGet()\
    \ or doPost() depending on what type of\nrequest you receive from the client.\n\
