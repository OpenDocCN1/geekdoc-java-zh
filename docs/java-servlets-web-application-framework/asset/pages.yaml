  md: '# 17. Servlets – Hits Counter


    # Hit Counter for a Web Page


    Many times you would be interested in knowing total number of hits on a particular
    page of your website. It is very simple to count these hits using a servlet because
    the life cycle of a servlet is controlled by the container in which it runs.


    Following are the steps to be taken to implement a simple page hit counter which
    is based on Servlet Life Cycle:


    +   - Initialize a global variable in init() method.


    +   - Increase global variable every time either doGet() or doPost() method is
    called.


    +   - If you require, you can use a database table to store the value of global
    variable in destroy() method. This value can be read inside init() when servlet
    would be initialized next time. This step is optional.


    +   - If you want to count unique page hits-in a session you can use isNew() method
    to check if same page already have been hit with-in that session. This step is
    optional.


    +   - You can display value of the global counter to show total number of hits
    on your web site. This step is also optional.


    Here I''m assuming that the web container will not be restarted. If it is restarted
    or servlet destroyed, the hit counter will be reset.


    # Example


    This example shows how to implement a simple page hit counter:


    ```

    import java.io.*;

    import java.sql.Date;\nimport java.util.*;

    import javax.servlet.*;

    import javax.servlet.http.*;


    public class PageHitCounter extends HttpServlet{


    private int hitCount;


    public void init()

    ```


