    \ has\nno METHOD specified and it should be handled by doGet() method.\n\n```\n\
    public void doGet(HttpServletRequest,\n    HttpServletResponse response\nthrows\
    \ ServletException, IOException {\n    // Servlet code\n```\n\n# The doPost()\
