    \ Given a top-level directory name of myapp. Here is how this directory structure\
    \ looks:\n\n```\n/myapp\n/images\n/WEB-INF\n/classes\n/lib\n```\n\nThe WEB-INF\
    \ subdirectory contains the application's deployment descriptor, named web.xml.\
    \ The HTML files should be kept in the top-level directory which is myapp. For\
    \ admin user, you will find ROOT directory as parent directory.\n\n# Creating\
    \ Servlets in Packages\n\nThe WEB-INF/classes contains all the servlet classes\
    \ and other class files, in a structure that matches their package name. For example,\
    \ If you have a fully qualified class name of com.myorg.MyServlet, then this servlet\
    \ class must be located in the following directory:\n\n```\n/myapp/WEB-INF/classes/com/myorg/MyServlet.class\n\
    ```\n\nFollowing is the example to create MyServlet class with a package name\
    \ com.myorg\n\n```\n// Name your package\npackage com.myorg;\n\n// Import required\
    \ java libraries\nimport java.io.*;\nimport javax.servlet.*;\nimport javax.servlet.http.*;\n\
    \npublic class MyServlet extends HttpServlet {\n\n    private String message;\n\
    \n    public void init() throws ServletException\n\n```\n\n![](img/d35069288ea1c8c6f3ed55795768f9dc_110_0.png)"
