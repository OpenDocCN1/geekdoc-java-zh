  md: '# 15. Servlet – Handling Date


    One of the most important advantages of using Servlet is that you can use most
    of the methods available in core Java. This tutorial would take you through Java
    provided Date class which is available in java.util package, this class encapsulates
    the current date and time.


    The Class supports two constructors. The first constructor initializes the object
    with the current date and time.


    ```

    Date()

    ```


    The following constructor accepts one argument that equals the number of milliseconds
    that have elapsed since midnight, January 1, 1970


    ```

    Date(long millisec)

    ```


    Once you have a Date object available, you can call any of the following support
    methods to play with dates:


    | SN | Methods with Description |

    | 1 | boolean after(Date date) Returns true if the invoking Date object contains
    a date that is later than the one specified by date, otherwise, it returns false.
    |

    | 2 | boolean before(Date date) Returns true if the invoking Date object contains
    a date that is earlier than the one specified by date, otherwise, it returns false.
    |

    | 3 | Object clone() Duplicates the invoking Date object. int compareTo(Date date)
    Compares the value of the invoking object with that of date. Returns 0 if the
    values are equal. Returns a negative value if the invoking object is earlier than
    date. int compareTo(Object obj) Operates identically to compareTo(Date) if obj
    is of class Date. Otherwise, it throws a ClassException. boolean equals(Object
    date) Returns true if the invoking Date object contains the same date and time
    as the one specified by date, otherwise, it returns false. |

    | 7 | long getTime() Returns the number of milliseconds that have elapsed since
    January 1, 1970. |

    | 8 | int hashCode() Returns a hash code for the invoking object. |

    | 9 | void setTime(long time) Sets the date and time as specified by time, which
    represents an elapsed time in milliseconds from midnight, January 1, 1970. |

    | 10 | String toString() Converts the invoking Date object into a string and returns
    the result. |


    ![](img/d35069288ea1c8c6f3ed55795768f9dc_86_0.png)'
