  md: '# 7. Servlets – Server HTTP Response


    As discussed in the previous chapter, when a Web server responds to an HTTP request,
    the response typically consists of a status line, some response headers, a blank
    line, and the document. A typical response looks like this:


    ```

    HTTP/1.1 200 OK

    Content-Type: text/html

    Header2: ...

    ...

    HeaderN: ...

    (Blank Line)

    <!doctype ...>

    <html>

    <head>...</head>

    <body>

    ...

    </body>

    </html>

    ```


    The status line consists of the HTTP version (HTTP/1.1 in the example), a status
    code (200 in the example), and a very short message corresponding to the status
    code (OK in the example).


    Following is a summary of the most useful HTTP response headers which go back
