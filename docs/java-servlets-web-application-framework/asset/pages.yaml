  md: "# 4. Servlets – Examples\n\nServlets are Java classes which service HTTP requests\
    \ and implement the javax.servlet.Servlet interface. Web application developers\
    \ typically write servlets extend javax.servlet.http.HttpServlet, an abstract\
    \ class that implements the Servlet interface and is specially designed to handle\
    \ HTTP requests.\n\n# Sample Code\n\nFollowing is the sample source code structure\
    \ of a servlet example to show Hello World:\n\n```\n// Import required Java libraries\n\
    import java.io.*;\nimport javax.servlet.*;\nimport javax.servlet.http.*;\n\n//\
    \ Extend HttpServlet\npublic class HelloWorld extends HttpServlet {\n\n    private\
    \ String message;\n\n    public void init() throws ServletException\n{\n     \
    \   // Do required initialization\n        message = \"Hello World\";\n    }\n\
    \n    public void doGet(HttpServletRequest request, HttpServletResponse response)\n\
    \    throws ServletException, IOException\n{\n        // Set response content\
    \ type\n        response.setContentType(\"text/html\");\n\n        // Actual logic\
    \ goes here.\n        PrintWriter out = response.getWriter();\n    }\n```\n\n\
