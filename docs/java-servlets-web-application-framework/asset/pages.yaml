    If you want to have a generic Error Handler for all the exceptions then you should
    define following error-page instead of defining separate error-page elements for
    every exception:


    ```

    <error-page>

    <exception-type>java.lang.Throwable</exception-type>

    <location>ErrorHandler</location>

    </error-page>

    ```


    Following are the points to be noted about web.xml for Exception Handling:


    +   * The servlet ErrorHandler defined in usual way as any other servlet configured
    in web.xml.

    * If there is any error with status code either 404 (Not Found) or 403 (Forbidden
    ), then the ErrorHandler servlet will be called.

    * If the web application throws either ServletException or IOException, then the
    web container invokes the /ErrorHandler servlet.

    * You can define different Error Handlers to handle different type of errors or
    exceptions. Above example is very generic and it serves the purpose to explain
    you the basic concept.


