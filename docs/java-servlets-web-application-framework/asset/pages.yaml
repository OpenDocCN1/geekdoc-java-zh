  md: "# 18. Servlets – Auto Page Refresh\n\nConsider a webpage which is displaying\
    \ live game score or stock market status or currency exchange ration. For all\
    \ such type of pages, you would need to refresh your web page regularly using\
    \ refresh or reload button with your browser.\n\nJava Servlet makes this job easy\
    \ by providing you a mechanism which you can make a webpage in a way that it would\
    \ refresh automatically after a given interval.\n\nThe simplest way of refreshing\
    \ a web page is using setIntHeader() of response object. Following is the signature\
    \ of this method:\n\n```\npublic void setIntHeader(String header, int headerValue)\n\
    ```\n\nThis method sends back header \"Refresh\" to the browser along with an\
    \ integer value which indicates time interval in seconds.\n\n# Auto Page Refresh\
    \ Example\n\nThis example shows how a servlet performs auto page refresh using\
    \ setIntHeader() method to set Refresh header.\n\n```\n// Import required java\
    \ libraries\nimport java.io.*;\nimport javax.servlet.*;\nimport javax.servlet.http.*;\n\
    import java.util.*;\n\n// Extend HttpServlet class\npublic class Refresh extends\
    \ HttpServlet {\n\n    // Method to handle GET method request.\npublic void doGet(HttpServletRequest\
    \ request, HttpServletResponse response)\n    throws ServletException, IOException\n\
    {\n    // Set refresh, autoload time as 5 seconds\n    response.setIntHeader(\"\
    Refresh\", 5);\n\n    // Set response content type\n```\n\n![](img/d35069288ea1c8c6f3ed55795768f9dc_98_0.png)"
