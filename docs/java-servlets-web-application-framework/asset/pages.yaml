  md: '# 23.Servlet – Annotations


    So far, you have learnt how Servlet uses the deployment descriptor (web.xml file)
    for deploying your application into a web server. Servlet API 3.0 has introduced
    a new package called javax.servlet.annotation. It provides annotation types which
    can be used for annotating a servlet class. If you use annotation, the deployment
    descriptor (web.xml) is not required. But you should use tomcat7 or any later
    version of tomcat.


    Annotations can replace equivalent XML configuration in the web deployor file
    (web.xml) such as servlet declaration and servlet mapping. Servlet containers
    will process the annotated classes at deployment time.


    The annotation types introduced in Servlet 3.0 are:


    | Annotation | Description |

    | --- | --- |

    | @WebServlet | To declare a servlet. |

    | @InitParam | To specify an initialization parameter. |

    | @WebFilter | To declare a servlet filter. |

    | @EventListener | To declare a WebListener. |

    | @HandlesTypes | To declare the class types that a ServletContainerInitializer
    can handle. This annotation is used within the ServletSecurity annotation to represent
    the security constraints to be applied to all HTTP protocol methods for which
    corresponding HttpMethodConstraint element does not occur within the ServletSecurity
    annotation. This annotation is used within |

    | @HttpMethodConstraint | the ServletSecurity annotation to represent security
    constraints on specific HTTP protocol messages. Annotation that may be used on
    a Servlet class, indicating instances of the Servlet expect requests that conform
    to the multipart/form-data MIME type. This annotation is used on a Servlet implementation
    class to specify security constraints to be enforced by a Servlet container on
    HTTP protocol messages. |

    | @ServletSecurity | (empty description in table or part of previous context)
    |


    Here we have discussed some of the Annotations in detail.'
