  md: '# Java Servlets


    # Servlets Tasks


    Servlets perform the following major tasks:


    +   - Read the explicit data sent by the clients (browsers). This includes an
    HTML format on a Web page or it could also come from an applet or a custom HTTP
    client program.

    - Read the implicit HTTP request data sent by the clients (browsers). This includes
    cookies, media types and compression schemes the browser understands, and so forth.

    - Process the data and generate the results. This process may require talking
    to a database, executing an RMI or CORBA call, invoking a Web service, or computing
    the response directly.

    - Send the explicit data (i.e., the document) to the clients (browsers). This
    document can be sent in a variety of formats, including text (HTML or XML), binary
    (GIF images), Excel, etc.

    - Send the implicit HTTP response to the clients (browsers). This includes telling
    the browsers or other clients what type of document is being returned (e.g., HTML),
    setting cookies and caching parameters, and other tasks.


    # Servlets Packages


    Java Servlets are Java classes run by a web server that has an interpreter that
    supports the Java Servlet specification.


    Servlets can be created using the **javax.servlet** and **javax.servlet.http**
    packages, which are a standard part of the Java''s enterprise edition, an expanded
    version of the Java class library that supports large-scale development projects.


    These classes implement the Java Servlet and JSP specifications. At the time of
    writing this tutorial, the versions are Java Servlet 2.5 and JSP 2.1.


    Java servlets have been created and compiled like any other Java class. After
    you install the servlet packages and add them to your computer''s Classpath, you
    can compile servlets with the JDK''s Java compiler or any other current compiler.


