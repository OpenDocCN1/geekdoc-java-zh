  md: "# 16. Servlets – Page Redirection\n\nPage redirection is a technique where\
    \ the client is sent to a new location other than requested. Page redirection\
    \ is generally used when a document moves to a new location or may be because\
    \ of load balancing.\n\nThe simplest way of redirecting a request to another page\
    \ is using method sendRedirect() of response object. Following is the signature\
    \ of this method:\n\n```\npublic void HttpServletResponse.sendRedirect(String\
    \ location)\nthrows IOException\n```\n\nThis method sends back the response to\
    \ browser along with the status code and new page location. You can also use setStatus()\
    \ and setHeader() methods together to achieve the scheme:\n\n```\n...\nString\
    \ site = \"http://www.newpage.com\";nresponse.setStatus(response.SC_MOVED_TEMPORARILY);\n\
    response.setHeader(\"Location\", site);\n...\n```\n\n# Example\n\nThis example\
    \ shows how a servlet performs page redirection to another location:*\n\n```\n\
