  md: '# 14. Servlets – File Uploading


    A Servlet can be used with an HTML form tag to allow users to upload files to
    the server. An uploaded file could be a text file or image file or any document.


    # Creating a File Upload Form


    The following HTML code below creates an uploader form. Following are the important
    points to be noted down:


    +   - The method attribute should be set to POST method and GET method can not
    be used.

    - The enctype attribute should be set to multipart/form-data.

    - The form action should be set to a servlet file which would handle file uploading
    at backend server. Following example is UploadServlet to upload file.

    - To upload a single file you should use a single <input .../> tag with attribute
    type="file". To allow multiple files, more than one input tags with different
    values for the name attribute. The browser associates a Browse button with each
    of them.


    ```

    <html>

    <head>

    <title>File Uploading Form</title>

    </head>

    <body>

    <h3>File Upload: <br /></h3>

    Select a file to upload: <br />

    <form action="UploadServlet" method="post"

    nctype="multipart/form-data">

    <input type="file" name="file" size="50" />

    <br />

    <input type="submit" value="Upload File" />

    </form>

    </body>

    </html>

    ```


    This will display result which would allow to to select a file from local PC and
    when user would click on "Upload File", form would be submitted along with the
    selected file:'
