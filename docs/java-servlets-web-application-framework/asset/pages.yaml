  md: '# 22. Servlets – Internationalization


    Before we proceed, let me explain (i18n) three important terms:


    +   - Internationalization (i18n): This means enabling a web site to provide different
    versions of content translated into the visitor''s language or nationality.


    +   - Localization (l10n): This means adding resources to a web site to adapt
    to a particular geographical or cultural region.


    +   - Locale: This is a particular cultural or geographical region. It is usually
    referred to as a language followed by a country symbol which is separated by an
    underscore. For example "en_US" represents English locale for US.


    There are number of items which should be taken care while building up a global
    website. This tutorial would not give complete detail on this but would give you
    a good example on how you can offer your web page in different languages to internet
    community i.e. locale.


    A servlet can pickup appropriate version of the site based on the requester''s
    locale and provide appropriate site version according to the local language, culture
    and requirements. Following is the method of request object which returns Locale
    object.


    ```

    java.util.Locale request.getLocale()

    ```


    # Detecting Locale


    Following are the important locale methods which you can use to detect requester''s
    location, language and of course locale. All the below methods display country
    name and language set in requester''s browser.


    | S.N. | Method & Description |

    |---||

    | 1 | String getCountry() <br>This method returns the country/region code in case
    for this locale in ISO 3166 2-letter format. |

    | 2 | String getDisplayName() <br>This method returns a name for the locale''s
    country that is appropriate for display to the user. |

    | 3 | String getLanguage() <br>This method returns the language code in lower
    case for this locale in ISO 639 format. |

    | 4 | String getDisplayNameLanguage() <br>This method returns a name for the locale''s
    language that is appropriate for display to the user. |

    | 5 | String getISO3Country() <br>This method returns a three-letter abbreviation
    for this locale''s country. |

    | 6 | String getISO3Language() <br>This method returns a three-letter abbreviation
    for this locale''s language. |


    ![](img/d35069288ea1c8c6f3ed55795768f9dc_117_0.png)


