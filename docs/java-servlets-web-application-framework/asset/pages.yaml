  md: '# 5. Servlets – Form Data


    You must have come across many situations when you need to pass some information
    from your browser to web server and ultimately to your backend program. The browser
    uses two methods to pass this information to web server. These methods are GET
    Method and POST Method.


    # GET Method


    The GET method sends the encoded user information appended to the page request.
    The page and encoded information are separated by the ? (question mark) symbol
    as follows:


    ```

    http://www.test.com/hello?key1=value1&key2=value2

    ```


    The GET method is the default method to pass information from browser to web server
    and produces a long string that appears in your browser''s Location:box. Never
    use the GET method if you have password or other sensitive information to pass
    to the server. The GET method has size limitation: only 1024 characters can be
    used in a request string.


    This information is passed using QUERY_STRING header and will be accessible through
    QUERY_STRING environment variable and Servlet handles this type of requests **doGet()**.


    # POST Method


    A generally more reliable method of passing information to a backend program is
    the POST method. This packages the information in exactly the same way as GET
    method, but instead of sending it as a text string after a ? (question mark) in
    the URL it sends as a separate method. This message comes to the backend program
    in the form of the standard input which you can parse and use for your processing.
    Servlet handles this type of requests using **doPost()** method.


    # Reading Form Data using Servlet


    Servlet handles form data parsing automatically using the following methods depending
    on the situation:


    +   - **getParameter():** Call request.getParameter() method to get the value
    of a form parameter.

    - **getParameterValues():** Call this method if the parameter appears more than
    once and returns multiple values, for example checkbox.

    - **getParameterNames():** Call this method if you want a complete list of all
    parameters in the current request.


    ![](img/d35069288ea1c8c6f3ed55795768f9dc_19_0.png)'
