    \nBy default, a servlet application is located at the path <Tomcat-installation-directory>/webapps/ROOT\
    \ and the class file would reside in <Tomcat-installation-directory>/ROOT/WEB-INF/classes.\n\
    \nIf you have a fully qualified name of com.myorg.MyServlet, this servlet class\
