- fmt: "\nThe SQL statements that read data from a database query, return the data\
    \ in a result set. The `SELECT` statement is the standard way to select rows from\
    \ a database and view them in a result set. The `java.sql.ResultSet` interface\
    \ represents the result set of a database query.\n\nA `ResultSet` object maintains\
    \ a cursor that points to the current row in the result set. The term \"result\
    \ set\" refers to the row and column data contained in a `ResultSet` object.\n\
    \nThe methods of the `ResultSet` interface can be broken down into three categories\
    \ −\n\n- **Navigational methods** − Used to move the cursor around.\n- **Get methods**\
    \ − Used to view the data in the columns of the current row being pointed by the\
    \ cursor.\n- **Update methods** − Used to update the data in the columns of the\
    \ current row. The updates can then be updated in the underlying database as well.\n\
    \nThe cursor is movable based on the properties of the `ResultSet`. These properties\
    \ are designated when the corresponding `Statement` that generates the `ResultSet`\
    \ is created.\n\nJDBC provides the following connection methods to create statements\
    \ with desired `ResultSet` −\n\n- `createStatement(int RSType, int RSConcurrency);`\n\
    - `prepareStatement(String SQL, int RSType, int RSConcurrency);`\n- `prepareCall(String\
    \ sql, int RSType, int RSConcurrency);`\n\nThe first argument indicates the type\
    \ of a `ResultSet` object and the second argument is one of two `ResultSet` constants\
    \ for specifying whether a result set is read-only or updatable.\n\n## Type of\
    \ ResultSet\n\nThe possible `RSType` are given below. If you do not specify any\
    \ `ResultSet` type, you will automatically get one that is `TYPE_FORWARD_ONLY`.\n\
    \n| Type | Description |\n| :--- | :--- |\n| `ResultSet.TYPE_FORWARD_ONLY` | The\
    \ cursor can only move forward in the result set. |\n| `ResultSet.TYPE_SCROLL_INSENSITIVE`\
    \ | The cursor can scroll forward and backward, and the result set is not sensitive\
    \ to changes made by others to the database that occur after the result set was\
    \ created. |\n| `ResultSet.TYPE_SCROLL_SENSITIVE` | The cursor can scroll forward\
    \ and backward, and the result set is sensitive to changes made by others to the\
    \ database that occur after the result set was created. |\n\n## Concurrency of\
    \ ResultSet\n\nThe possible `RSConcurrency` are given below. If you do not specify\
    \ any Concurrency type, you will automatically get one that is `CONCUR_READ_ONLY`.\n\
    \n| Concurrency | Description |\n| :--- | :--- |\n| `ResultSet.CONCUR_READ_ONLY`\
    \ | Creates a read-only result set. This is the default |\n| `ResultSet.CONCUR_UPDATABLE`\
    \ | Creates an updateable result set. |\n\nAll our examples written so far can\
    \ be written as follows, which initializes a `Statement` object to create a forward-only,\
    \ read only `ResultSet` object −\n\n```java\ntry(\n    Statement stmt = conn.createStatement(\n\
    \        ResultSet.TYPE_FORWARD_ONLY,\n        ResultSet.CONCUR_READ_ONLY);)\n\
    } catch(Exception ex) {\n    ....\n} finally {\n    ....\n}\n```\n\n# Navigating\
    \ a Result Set\n\nThere are several methods in the `ResultSet` interface that\
    \ involve moving the cursor, including −\n\n| S.N. | Methods & Description |\n\
    | :--- | :--- |\n| 1 | `public void beforeFirst() throws SQLException` Moves the\
    \ cursor just before the first row. |\n| 2 | `public void afterLast() throws SQLException`\
    \ Moves the cursor just after the last row. |\n| 3 | `public boolean first() throws\
    \ SQLException` Moves the cursor to the first row. |\n| 4 | `public void last()\
    \ throws SQLException` Moves the cursor to the last row. |\n| 5 | `public boolean\
    \ absolute(int row) throws SQLException` Moves the cursor to the specified row.\
    \ |\n| 6 | `public boolean relative(int row) throws SQLException` Moves the cursor\
    \ the given number of rows forward or backward, from where it is currently pointing.\
    \ |\n| 7 | `public boolean previous() throws SQLException` Moves the cursor to\
    \ the previous row. This method returns false if the previous row is off the result\
    \ set. |\n| 8 | `public boolean next() throws SQLException` Moves the cursor to\
    \ the next row. This method returns false if there are no more rows in the result\
    \ set. |\n| 9 | `public int getRow() throws SQLException` Returns the row number\
    \ that the cursor is pointing to. |\n| 10 | `public void moveToInsertRow() throws\
    \ SQLException` Moves the cursor to a special row in the result set that can be\
    \ used to insert a new row into the database. The current cursor location is remembered.\
    \ |\n| 11 | `public void moveToCurrentRow() throws SQLException` Moves the cursor\
    \ back to the current row if the cursor is currently at the insert row; otherwise,\
    \ this method does nothing |\n\nFollowing is the example which makes use of few\
    \ navigation methods described.\n\nThis sample code has been written based on\
    \ the environment and database setup done in the previous chapters.\n\nCopy and\
    \ paste the following example in `TestApplication.java`, compile and run as follows\
    \ −\n\n```java\nimport java.sql.Connection;\nimport java.sql.DriverManager;\n\
    import java.sql.ResultSet;\nimport java.sql.SQLException;\nimport java.sql.Statement;\n\
    \npublic class TestApplication {\n    static final String DB_URL = \"jdbc:mysql://localhost/TUTORIALSPOINT\"\
    ;\n    static final String USER = \"guest\";\n    static final String PASS = \"\
    guest123\";\n    static final String QUERY = \"SELECT id, first, last, age FROM\
    \ Employees\";\n\n    public static void main(String[] args) {\n        // Open\
    \ a connection\n        try(\n            Connection conn = DriverManager.getConnection(DB_URL,\
    \ USER, PASS);\n            Statement stmt = conn.createStatement(\n         \
    \       ResultSet.TYPE_SCROLL_INSENSITIVE,\n                ResultSet.CONCUR_READ_ONLY);\n\
    \            ResultSet rs = stmt.executeQuery(QUERY);\n        ) {\n         \
    \   // Move cursor to the last row.\n            System.out.println(\"Moving cursor\
    \ to the last...\");\n            rs.last();\n            // Extract data from\
    \ result set\n            System.out.println(\"Displaying record...\");\n    \
    \        // Retrieve by column name\n            int id = rs.getInt(\"id\");\n\
    \            int age = rs.getInt(\"age\");\n            String first = rs.getString(\"\
    first\");\n            String last = rs.getString(\"last\");\n            // Display\
    \ values\n            System.out.print(\"ID: \" + id);\n            System.out.print(\"\
    , Age: \" + age);\n            System.out.print(\", First: \" + first);\n    \
    \        System.out.println(\", Last: \" + last);\n\n            // Move cursor\
    \ to the first row.\n            System.out.println(\"Moving cursor to the first\
    \ row...\");\n            rs.first();\n            // Extract data from result\
    \ set\n            System.out.println(\"Displaying record...\");\n           \
    \ // Retrieve by column name\n            id = rs.getInt(\"id\");\n          \
    \  age = rs.getInt(\"age\");\n            first = rs.getString(\"first\");\n \
    \           last = rs.getString(\"last\");\n            // Display values\n  \
    \          System.out.print(\"ID: \" + id);\n            System.out.print(\",\
    \ Age: \" + age);\n            System.out.print(\", First: \" + first);\n    \
    \        System.out.println(\", Last: \" + last);\n\n            // Move cursor\
    \ to the next row.\n            System.out.println(\"Moving cursor to the next\
    \ row...\");\n            rs.next();\n            // Extract data from result\
    \ set\n            System.out.println(\"Displaying record...\");\n           \
    \ // Retrieve by column name\n            id = rs.getInt(\"id\");\n          \
    \  age = rs.getInt(\"age\");\n            first = rs.getString(\"first\");\n \
    \           last = rs.getString(\"last\");\n            // Display values\n  \
    \          System.out.print(\"ID: \" + id);\n            System.out.print(\",\
    \ Age: \" + age);\n            System.out.print(\", First: \" + first);\n    \
    \        System.out.println(\", Last: \" + last);\n        } catch (SQLException\
    \ e) {\n            e.printStackTrace();\n        }\n    }\n}\n```\n\nNow let\
    \ us compile the above example as follows −\n\n```bash\nC:\\>javac TestApplication.java\n\
    C:\\>\n```\n\nWhen you run **TestApplication**, it produces the following result\
    \ −\n\n```\nC:\\>java TestApplication\nMoving cursor to the last...\nDisplaying\
    \ record...\nID: 103, Age: 30, First: Sumit, Last: Mittal\nMoving cursor to the\
    \ first row...\nDisplaying record...\nID: 100, Age: 18, First: Zara, Last: Ali\n\
    Moving cursor to the next row...\nDisplaying record...\nID: 101, Age: 25, First:\
    \ Mehnaz, Last: Fatma\nC:\\>\n```\n\n## Viewing a Result Set\n\nThe `ResultSet`\
    \ interface contains dozens of methods for getting the data of the current row.\n\
    \nThere is a get method for each of the possible data types, and each get method\
    \ has two versions −\n\n- One that takes in a column name.\n- One that takes in\
    \ a column index.\n\nFor example, if the column you are interested in viewing\
    \ contains an int, you need to use one of the `getInt()` methods of `ResultSet`\
    \ −\n"
  raw: 'The SQL statements that read data from a database query, return the data in
    a result set. The SELECT statement is the standard way to select rows from a database
    and view them in a result set. The *java.sql.ResultSet* interface represents the
    result set of a database query.


    A ResultSet object maintains a cursor that points to the current row in the result
    set. The term "result set" refers to the row and column data contained in a ResultSet
    object.


    The methods of the ResultSet interface can be broken down into three categories
    −


    *   **Navigational methods** − Used to move the cursor around.


    *   **Get methods** − Used to view the data in the columns of the current row
    being pointed by the cursor.


    *   **Update methods** − Used to update the data in the columns of the current
    row. The updates can then be updated in the underlying database as well.


    The cursor is movable based on the properties of the ResultSet. These properties
    are designated when the corresponding Statement that generates the ResultSet is
    created.


    JDBC provides the following connection methods to create statements with desired
    ResultSet −


    *   **createStatement(int RSType, int RSConcurrency);**


    *   **prepareStatement(String SQL, int RSType, int RSConcurrency);**


    *   **prepareCall(String sql, int RSType, int RSConcurrency);**


    The first argument indicates the type of a ResultSet object and the second argument
    is one of two ResultSet constants for specifying whether a result set is read-only
    or updatable.


    ## Type of ResultSet


    The possible RSType are given below. If you do not specify any ResultSet type,
    you will automatically get one that is TYPE_FORWARD_ONLY.


    | Type | Description |


    | ResultSet.TYPE_FORWARD_ONLY | The cursor can only move forward in the result
    set. |


    | ResultSet.TYPE_SCROLL_INSENSITIVE | The cursor can scroll forward and backward,
    and the result set is not sensitive to changes made by others to the database
    that occur after the result set was created. |


    | ResultSet.TYPE_SCROLL_SENSITIVE. | The cursor can scroll forward and backward,
    and the result set is sensitive to changes made by others to the database that
    occur after the result set was created. |


    ## Concurrency of ResultSet


    The possible RSConcurrency are given below. If you do not specify any Concurrency
    type, you will automatically get one that is CONCUR_READ_ONLY.


    | Concurrency | Description |


    | ResultSet.CONCUR_READ_ONLY | Creates a read-only result set. This is the default
    |


    | ResultSet.CONCUR_UPDATABLE | Creates an updateable result set. |


    All our examples written so far can be written as follows, which initializes a
    Statement object to create a forward-only, read only ResultSet object −


    try(


    Statement stmt = conn.createStatement(


    ResultSet.TYPE_FORWARD_ONLY,


    ResultSet.CONCUR_READ_ONLY);)


    }


    catch(Exception ex)  {


    ....


    }


    finally  {


    ....


    }


    # Navigating a Result Set


    There are several methods in the ResultSet interface that involve moving the cursor,
    including −


    | S.N. | Methods & Description |


    | 1 | public void beforeFirst() throws SQLExceptionMoves the cursor just before
    the first row. |


    | 2 | public void afterLast() throws SQLExceptionMoves the cursor just after the
    last row. |


    | 3 | public boolean first() throws SQLExceptionMoves the cursor to the first
    row. |


    | 4 | public void last() throws SQLExceptionMoves the cursor to the last row.
    |


    | 5 | public boolean absolute(int row) throws SQLExceptionMoves the cursor to
    the specified row. |


    | 6 | public boolean relative(int row) throws SQLExceptionMoves the cursor the
    given number of rows forward or backward, from where it is currently pointing.
    |


    | 7 | public boolean previous() throws SQLExceptionMoves the cursor to the previous
    row. This method returns false if the previous row is off the result set. |


    | 8 | public boolean next() throws SQLExceptionMoves the cursor to the next row.
    This method returns false if there are no more rows in the result set. |


    | 9 | public int getRow() throws SQLExceptionReturns the row number that the cursor
    is pointing to. |


    | 10 | public void moveToInsertRow() throws SQLExceptionMoves the cursor to a
    special row in the result set that can be used to insert a new row into the database.
    The current cursor location is remembered. |


    | 11 | public void moveToCurrentRow() throws SQLExceptionMoves the cursor back
    to the current row if the cursor is currently at the insert row; otherwise, this
    method does nothing |


    Following is the example which makes use of few navigation methods described.


    This sample code has been written based on the environment and database setup
    done in the previous chapters.


    Copy and paste the following example in TestApplication.java, compile and run
    as follows −


    import java.sql.Connection;


    import java.sql.DriverManager;


    import java.sql.ResultSet;


    import java.sql.SQLException;


    import java.sql.Statement;


    public  class  TestApplication  {


    static  final  String DB_URL =  "jdbc:mysql://localhost/TUTORIALSPOINT";


    static  final  String USER =  "guest";


    static  final  String PASS =  "guest123";


    static  final  String QUERY =  "SELECT id, first, last, age FROM Employees";


    public  static  void main(String[] args)  {


    // Open a connection


    try(Connection conn =  DriverManager.getConnection(DB_URL, USER, PASS);


    Statement stmt = conn.createStatement(


    ResultSet.TYPE_SCROLL_INSENSITIVE,


    ResultSet.CONCUR_READ_ONLY);


    ResultSet rs = stmt.executeQuery(QUERY);


    )  {            


    // Move cursor to the last row.


    System.out.println("Moving cursor to the last...");


    rs.last();


    // Extract data from result set


    System.out.println("Displaying record...");


    //Retrieve by column name


    int id = rs.getInt("id");


    int age = rs.getInt("age");


    String first = rs.getString("first");


    String  last  = rs.getString("last");


    // Display values


    System.out.print("ID: "  + id);


    System.out.print(", Age: "  + age);


    System.out.print(", First: "  + first);


    System.out.println(", Last: "  +  last);


    // Move cursor to the first row.


    System.out.println("Moving cursor to the first row...");


    rs.first();


    // Extract data from result set


    System.out.println("Displaying record...");


    // Retrieve by column name


    id = rs.getInt("id");


    age = rs.getInt("age");


    first = rs.getString("first");


    last  = rs.getString("last");


    // Display values


    System.out.print("ID: "  + id);


    System.out.print(", Age: "  + age);


    System.out.print(", First: "  + first);


    System.out.println(", Last: "  +  last);


    // Move cursor to the first row.


    System.out.println("Moving cursor to the next row...");


    rs.next();


    // Extract data from result set


    System.out.println("Displaying record...");


    id = rs.getInt("id");


    age = rs.getInt("age");


    first = rs.getString("first");


    last  = rs.getString("last");


    // Display values


    System.out.print("ID: "  + id);


    System.out.print(", Age: "  + age);


    System.out.print(", First: "  + first);


    System.out.println(", Last: "  +  last);            


    }  catch  (SQLException e)  {


    e.printStackTrace();


    }


    }


    }


    Now let us compile the above example as follows −


    C:\>javac TestApplication.java


    C:\>


    When you run **TestApplication**, it produces the following result −


    C:\>java TestApplication


    Moving cursor to the last...


    Displaying record...


    ID: 103, Age: 30, First: Sumit, Last: Mittal


    Moving cursor to the first row...


    Displaying record...


    ID: 100, Age: 18, First: Zara, Last: Ali


    Moving cursor to the next row...


    Displaying record...


    ID: 101, Age: 25, First: Mehnaz, Last: Fatma


    C:\>


    # Viewing a Result Set


    The ResultSet interface contains dozens of methods for getting the data of the
    current row.


    There is a get method for each of the possible data types, and each get method
    has two versions −


    *   One that takes in a column name.


    *   One that takes in a column index.


    For example, if the column you are interested in viewing contains an int, you
    need to use one of the getInt() methods of ResultSet −


    | S.N. | Methods & Description |'
