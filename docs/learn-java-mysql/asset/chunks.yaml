    access but in general, JDBC Architecture consists of two layers:


    * **JDBC API**: Provides the interface for the application.

    * **JDBC Driver**: Handles the communication with the specific database.


    The JDBC API supports both two-tier and three-tier processing models for database
    access but in general, JDBC Architecture consists of two layers:


    * **JDBC API**: Provides the interface for the application.

    * **JDBC Driver**: Handles the communication with the specific database.


    The JDBC API supports both two-tier and three-tier processing models for database
    access but in general, JDBC Architecture consists of two layers:


    * **JDBC API**: Provides the interface for the application.

    * **JDBC Driver**: Handles the communication with the specific database.


    The JDBC API supports both two-tier and three-tier processing models for database
    access but in general, JDBC Architecture consists of two layers:


    * **JDBC API**: Provides the interface for the application.

    * **JDBC Driver**: Handles the communication with the specific database.


    ## Common Components


    The JDBC API provides the following interfaces:


    * `DriverManager`: Manages a list of database drivers.

    * `Driver`: The interface that drivers use to connect to a particular data store.

    * `Connection`: Represents a session with a database.

    * `Statement`: Used to submit SQL queries to the database.

    * `ResultSet`: Holds data retrieved from a query.

    * `SQLException`: Handles errors that occur in database access.


    ## The JDBC 4.0 Packages


    The `java.sql` and `javax.sql` are the primary packages for JDBC 4.0. This is
    the latest version at the time of writing. New features in these packages include:


    * Automatic database driver loading.

    * Exception handling improvements.

    * Enhanced BLOB/CLOB functionality.

    * Connection and statement interface enhancements.

    * National character set support.

    * SQL ROWID access.

    * SQL 2003 XML data type support.

    * Annotations.


    # Environment Setup


    To start developing with JDBC, you setup your JDBC environment by following the
    steps below. We assume that you are working on a Windows platform.


    ## Install Java


    Java SE is available for download for free. To download [click here](https://www.oracle.com/technetwork/java/downloads/jdk9-downloads-3848520.html),
    please download a version compatible with your operating system.


    Follow the instructions to download Java, and run the `.exe` to install Java on
    your machine. Once you have installed Java on your machine, you would need to
    set environment variables to point to installation directories.


    ### Setting Up the Path for Windows 2000/XP


    Assuming you have installed Java in `C:\Program Files\java\jdk` directory:


    * Right-click on ''My Computer'' and select ''Properties''.

    * Click on the ''Environment variables'' button under the ''Advanced'' tab.

    * Now, edit the `Path` variable and add the path to the Java executable directory
    at the end of it. For example, if the path is currently set to `C:\Windows\System32`,
    then edit it this way:


    `C:\Windows\System32;C:\Program Files\java\jdk\bin`


    ### Setting Up the Path for Windows 95/98/ME


    Assuming you have installed Java in `C:\Program Files\java\jdk` directory:


    * Edit the `C:\autoexec.bat` file and add the following line at the end:


    `SET PATH = %PATH%;C:\Program Files\java\jdk\bin`


    ### Setting Up the Path for Linux, UNIX, Solaris, FreeBSD


    Environment variable `PATH` should be set to point to where the Java binaries
    have been installed. Refer to your shell documentation if you have trouble doing
    this.

