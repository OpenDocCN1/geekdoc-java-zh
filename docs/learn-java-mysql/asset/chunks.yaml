    \ execute(String SQL)` — 如果可以检索到 `ResultSet` 对象，则返回布尔值 true；否则，返回 false。使用此方法执行\
    \ SQL DDL 语句，或当你需要使用真正的动态 SQL 时。\n*   `int executeUpdate(String SQL)` — 返回执行 SQL\
