    # Sorting Data Example


    This chapter provides an example on how to sort records from a table using JDBC
    application. This would use **asc** and **desc** keywords to sort records in ascending
    or descending order. Before executing the following example, make sure you have
    the following in place −


    *   To execute the following example you can replace the *username* and *password* with
    your actual user name and password.


    *   Your MySQL database you are using, is up and running.


    ## Required Steps


    The following steps are required to create a new Database using JDBC application
    −


    *   **Import the packages** − Requires that you include the packages containing
    the JDBC classes needed for database programming. Most often, using *import java.sql.** will
    suffice.


    *   **Open a connection** − Requires using the *DriverManager.getConnection()* method
    to create a Connection object, which represents a physical connection with a database
    server.


    *   **Execute a query** − Requires using an object of type Statement for building
    and submitting an SQL statement to sort records from a table. These Queries make
    use of **asc** and **desc** clauses to sort data in ascending and descening orders.


    *   **Clean up the environment** − try with resources automatically closes the
    resources.


    ## Sample Code


    Copy and paste the following example in TestApplication.java, compile and run
    as follows −


    import java.sql.Connection;


    import java.sql.DriverManager;


    import java.sql.ResultSet;


    import java.sql.SQLException;


    import java.sql.Statement;


    public  class  TestApplication  {


    static  final  String DB_URL =  "jdbc:mysql://localhost/TUTORIALSPOINT";


    static  final  String USER =  "guest";


    static  final  String PASS =  "guest123";


    static  final  String QUERY =  "SELECT id, first, last, age FROM Registration";


    public  static  void main(String[] args)  {


    // Open a connection


    try(Connection conn =  DriverManager.getConnection(DB_URL, USER, PASS);


    Statement stmt = conn.createStatement();)  {            


    System.out.println("Fetching records in ascending order...");


    ResultSet rs = stmt.executeQuery(QUERY +  " ORDER BY first ASC");


    while(rs.next()){


    //Display values


    System.out.print("ID: "  + rs.getInt("id"));


    System.out.print(", Age: "  + rs.getInt("age"));


    System.out.print(", First: "  + rs.getString("first"));


    System.out.println(", Last: "  + rs.getString("last"));


    }


    System.out.println("Fetching records in descending order...");


    rs = stmt.executeQuery(QUERY +  " ORDER BY first DESC");


    while(rs.next()){


    //Display values


    System.out.print("ID: "  + rs.getInt("id"));


    System.out.print(", Age: "  + rs.getInt("age"));


    System.out.print(", First: "  + rs.getString("first"));


    System.out.println(", Last: "  + rs.getString("last"));


    }


    rs.close();


    }  catch  (SQLException e)  {


    e.printStackTrace();


    }


    }


    }


    Now let us compile the above example as follows −


    C:\>javac TestApplication.java


