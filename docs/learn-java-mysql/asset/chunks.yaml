    line at the end of your **.bashrc** −


    export PATH = /path/to/java:$PATH''


    You automatically get both JDBC packages **java.sql** and **javax.sql,** when
    you install J2SE Development Kit.


    ## Install Database


    The most important thing you will need, of course is an actual running database
    with a table that you can query and modify.


    Install a database that is most suitable for you. You can have plenty of choices
    and most common are −


    *   MySQL DB − MySQL is an open source database. You can download it from [MySQL
    Official Site](https://dev.mysql.com/downloads/mysql). We recommend downloading
    the full Windows installation.


    *   In addition, download and install [MySQL Administrator](https://dev.mysql.com/downloads/gui-tools/) as
    well as [MySQL Query Browser.](https://dev.mysql.com/downloads/gui-tools/) These
    are GUI based tools that will make your development much easier.


    *   Finally, download and unzip [MySQL Connector/J](https://dev.mysql.com/downloads/connector/j/3.1.html) (the
    MySQL JDBC driver) in a convenient directory. For the purpose of this tutorial
    we will assume that you have installed the driver at C:\Program Files\MySQL\mysql-connector-java-5.1.8.


    *   Accordingly, set CLASSPATH variable to C:\Program Files\MySQL\mysql-connector-java-5.1.8\mysql-connector-java-5.1.8-bin.jar.
    Your driver version may vary based on your installation.


    ## Set Database Credential


    When we install MySQL database, its administrator ID is set to **root** and it
    gives provision to set a password of your choice.


    Using root ID and password you can either create another user ID and password,
    or you can use root ID and password for your JDBC application.


    There are various database operations like database creation and deletion, which
    would need administrator ID and password.


    For rest of the JDBC tutorial, we would use MySQL Database with **guest** as ID
    and **guest123** as password.


    If you do not have sufficient privilege to create new users, then you can ask
    your Database Administrator (DBA) to create a user ID and password for you.


    ## Create Database


    To create the **TUTORIALSPOINT** database, use the following steps −


    ## Step 1


    Open a **Command Prompt** and change to the installation directory as follows
    −


    C:\>


    C:\>cd Program Files\MySQL\bin


    C:\Program Files\MySQL\bin>


    **Note** − The path to **mysqld.exe** may vary depending on the install location
    of MySQL on your system. You can also check documentation on how to start and
    stop your database server.


    ## Step 2


    Start the database server by executing the following command, if it is already
    not running.


    C:\Program Files\MySQL\bin>mysqld


    C:\Program Files\MySQL\bin>


    ## Step 3


    Create the **TUTORIALSPOINT** database by executing the following command −


    C:\Program Files\MySQL\bin> mysqladmin create TUTORIALSPOINT -u guest -p


    Enter password: ********


    C:\Program Files\MySQL\bin>


    ## Create Table


    To create the **Employees** table in TUTORIALSPOINT database, use the following
    steps −


    ## Step 1


    Open a **Command Prompt** and change to the installation directory as follows
    −


    C:\>


    C:\>cd Program Files\MySQL\bin


    C:\Program Files\MySQL\bin>


    ## Step 2


    Login to the database as follows −


    C:\Program Files\MySQL\bin>mysql -u guest -p


    Enter password: ********


    mysql>


    ## Step 3


    Create the table **Employees** as follows −


    mysql>  use TUTORIALSPOINT;


    mysql> create table Employees


    ->  (


    -> id int  not  null,


    -> age int  not  null,


    -> first varchar (255),


    ->  last varchar (255)


    ->  );


    Query OK,  0 rows affected (0.08 sec)


    mysql>


    ## Create Data Records


    Finally you create few records in Employee table as follows −


    mysql> INSERT INTO Employees VALUES (100,  18,  ''Zara'',  ''Ali'');


    Query OK,  1 row affected (0.05 sec)


    mysql> INSERT INTO Employees VALUES (101,  25,  ''Mahnaz'',  ''Fatma'');


    Query OK,  1 row affected (0.00 sec)


    mysql> INSERT INTO Employees VALUES (102,  30,  ''Zaid'',  ''Khan'');


    Query OK,  1 row affected (0.00 sec)


    mysql> INSERT INTO Employees VALUES (103,  28,  ''Sumit'',  ''Mittal'');


    Query OK,  1 row affected (0.00 sec)


    mysql>


    For a complete understanding on MySQL database, study the [MySQL Tutorial](https://www.tutorialspoint.com/mysql/index.htm
    "MySQL Tutorial").


    Now you are ready to start experimenting with JDBC. Next chapter gives you a sample
    example on JDBC Programming.


    # Sample Code


    This chapter provides an example of how to create a simple java based application
    to access MySQL database. This will show you how to open a database connection,
    execute a SQL query, and display the results.


    All the steps mentioned in this template example, would be explained in subsequent
    chapters of this tutorial.


    ## Creating JDBC Application


    There are following six steps involved in building a JDBC application −


    *   **Import the packages** − Requires that you include the packages containing
    the JDBC classes needed for database programming. Most often, using *import java.sql.** will
    suffice.


    *   **Open a connection** − Requires using the *DriverManager.getConnection()* method
    to create a Connection object, which represents a physical connection with the
    database.


    *   **Execute a query** − Requires using an object of type Statement for building
    and submitting an SQL statement to the database.


    *   **Extract data from result set** − Requires that you use the appropriate *ResultSet.getXXX()* method
    to retrieve the data from the result set.


    *   **Clean up the environment** − Requires explicitly closing all database resources
    versus relying on the JVM''s garbage collection.


    ## Sample Code


    This sample example can serve as a **template** when you need to create your own
    JDBC application in the future.


    This sample code has been written based on the environment and database setup
    done in the previous chapter.


    Copy and paste the following example in TestApplication.java, compile and run
    as follows −


    import java.sql.*;


    public  class  TestApplication  {


    static  final  String DB_URL =  "jdbc:mysql://localhost/TUTORIALSPOINT";


    static  final  String USER =  "guest";


    static  final  String PASS =  "guest123";


    static  final  String QUERY =  "SELECT id, first, last, age FROM Employees";


    public  static  void main(String[] args)  {


    // Open a connection


    try(Connection conn =  DriverManager.getConnection(DB_URL, USER, PASS);


    Statement stmt = conn.createStatement();


    ResultSet rs = stmt.executeQuery(QUERY);)  {


    // Extract data from result set


    while  (rs.next())  {


    // Retrieve by column name


    System.out.print("ID: "  + rs.getInt("id"));


    System.out.print(", Age: "  + rs.getInt("age"));


    System.out.print(", First: "  + rs.getString("first"));


    System.out.println(", Last: "  + rs.getString("last"));


    }


    }  catch  (SQLException e)  {


    e.printStackTrace();


    }


    }


    }


    Now let us compile the above example as follows −


    C:\>javac TestApplication.java


    C:\>


    When you run **TestApplication**, it produces the following result −


    C:\>java TestApplication


    ID: 100, Age: 18, First: Zara, Last: Ali


    ID: 101, Age: 25, First: Mahnaz, Last: Fatma


    ID: 102, Age: 30, First: Zaid, Last: Khan


    ID: 103, Age: 28, First: Sumit, Last: Mittal


    C:\>


    # Connections


    After you''ve installed the appropriate driver, it is time to establish a database
    connection using JDBC.


    The programming involved to establish a JDBC connection is fairly simple. Here
    are these simple three steps −


    *   **Import JDBC Packages** − Add **import** statements to your Java program
    to import required classes in your Java code.


    *   **Database URL Formulation** − This is to create a properly formatted address
    that points to the database to which you wish to connect.


    *   **Create Connection Object** − Finally, code a call to the *DriverManager* object''s *getConnection(
    )* method to establish actual database connection.


