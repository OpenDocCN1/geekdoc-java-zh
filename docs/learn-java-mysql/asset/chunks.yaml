    This chapter provides an example on how to select a Database using JDBC application.
    Before executing the following example, make sure you have the following in place
    −


    *   To execute the following example you need to replace the *username* and *password* with
    your actual user name and password.


    *   Your MySQL database you are using, is up and running.


    ## Required Steps


    The following steps are required to create a new Database using JDBC application
