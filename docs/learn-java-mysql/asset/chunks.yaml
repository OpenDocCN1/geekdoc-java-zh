    # Prepared Statement


    The *PreparedStatement* interface extends the Statement interface, which gives
    you added functionality with a couple of advantages over a generic Statement object.


    This statement gives you the flexibility of supplying arguments dynamically.


    ## Creating PreparedStatement Object


    PreparedStatement pstmt =  null;


    try  {


    String SQL =  "Update Employees SET age = ? WHERE id = ?";


    pstmt = conn.prepareStatement(SQL);


    .  .  .


    }


    catch  (SQLException e)  {


    .  .  .


    }


    finally  {


    .  .  .


    }


    All parameters in JDBC are represented by the **?** symbol, which is known as
    the parameter marker. You must supply values for every parameter before executing
    the SQL statement.


    The **setXXX()** methods bind values to the parameters, where **XXX** represents
    the Java data type of the value you wish to bind to the input parameter. If you
    forget to supply the values, you will receive an SQLException.


    Each parameter marker is referred by its ordinal position. The first marker represents
    position 1, the next position 2, and so forth. This method differs from that of
    Java array indices, which starts at 0.


    All of the **Statement object''s** methods for interacting with the database (a)
    execute(), (b) executeQuery(), and (c) executeUpdate() also work with the PreparedStatement
    object. However, the methods are modified to use SQL statements that can input
    the parameters.


    ## Closing PreparedStatement Object


    Just as you close a Statement object, for the same reason you should also close
    the PreparedStatement object.


    A simple call to the close() method will do the job. If you close the Connection
    object first, it will close the PreparedStatement object as well. However, you
    should always explicitly close the PreparedStatement object to ensure proper cleanup.


    PreparedStatement pstmt =  null;


    try  {


    String SQL =  "Update Employees SET age = ? WHERE id = ?";


    pstmt = conn.prepareStatement(SQL);


    .  .  .


    }


    catch  (SQLException e)  {


    .  .  .


    }


    finally  {


    pstmt.close();


    }


