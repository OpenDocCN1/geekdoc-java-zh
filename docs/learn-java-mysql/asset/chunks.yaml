    要在 TUTORIALSPOINT 数据库中创建 `Employees` 表，请使用以下步骤——\n\n## 第 1 步\n打开`命令提示符` 并如下切换到安装目录——\n\
    \n```cmd\nC:\\>\nC:\\>cd Program Files\\MySQL\\bin\nC:\\Program Files\\MySQL\\\
    bin>\n```\n\n## 第 2 步\n如下所示登录数据库——\n\n```cmd\nC:\\Program Files\\MySQL\\bin>mysql\
    \ -u guest -p\nEnter password: ********\nmysql>\n```\n\n## 第 3 步\n如下所示创建表 `Employees`——\n\
