    \ 时，它会产生以下结果 −\n\n```bash\nC:\\>java TestApplication\n正在连接数据库...\n创建语句...\n正在插入一行....\n\
    在此提交数据....\n列出结果集以参考....\nID: 1, Age: 23, First: Zara, Last: Ali\nID: 2, Age:\
    \ 30, First: Mahnaz, Last: Fatma\nID: 3, Age: 35, First: Zaid, Last: Khan\nID:\
    \ 4, Age: 33, First: Sumit, Last: Mittal\nID: 5, Age: 40, First: John, Last: Paul\n\
    ID: 6, Age: 20, First: Rita, Last: Tez\nID: 7, Age: 20, First: Sita, Last: Singh\n\
    C:\\>\n```\n\n# 保存点 (Save Point)\n\n新的 JDBC 3.0 `Savepoint` 接口为你提供了额外的事务控制。大多数现代\
    \ DBMS 都在其环境中支持保存点，例如 Oracle 的 PL/SQL。\n\n当你设置一个保存点时，你是在事务内部定义了一个逻辑回滚点。如果在保存点之后发生错误，你可以使用\
    \ `rollback` 方法撤销所有更改，或仅撤销保存点之后所做的更改。\n\n`Connection` 对象有两个新方法可以帮助你管理保存点 −\n\n\
    * `setSavepoint(String savepointName)` − 定义一个新的保存点。它还会返回一个 `Savepoint` 对象。\n*\
    \ `releaseSavepoint(Savepoint savepointName)` − 删除一个保存点。注意，它需要一个 `Savepoint` 对象作为参数。该对象通常是由\
    \ `setSavepoint()` 方法生成的保存点。\n\n有一个 `rollback (String savepointName)` 方法，它可以将工作回滚到指定的保存点。\n\
    \n下面的示例说明了 `Savepoint` 对象的用法 −\n\n```java\ntry {\n    // 假设有一个有效的连接对象 conn\n \
    \   conn.setAutoCommit(false);\n    Statement stmt = conn.createStatement();\n\
    \    // 设置一个保存点\n    Savepoint savepoint1 = conn.setSavepoint(\"Savepoint1\");\n\
    \    String SQL =  \"INSERT INTO Employees \"  +\n\"VALUES (106, 20, 'Rita', 'Tez')\"\
    ;\n    stmt.executeUpdate(SQL);\n    // 提交一个格式错误的 SQL 语句\n    String SQL =  \"\
    INSERTED IN Employees \"  +\n\"VALUES (107, 22, 'Sita', 'Tez')\";\n    stmt.executeUpdate(SQL);\n\
    \    // 如果没有错误，提交更改。\n    conn.commit();\n} catch(SQLException se) {\n    // 如果发生任何错误。\n\
    \    conn.rollback(savepoint1);\n}\n```\n\n在这种情况下，上述任何 `INSERT` 语句都无法成功，所有内容都将回滚。\n\
    \n以下是使用了上述的 `setSavepoint` 和 `rollback` 的示例。\n\n此示例代码是根据前面章节完成的环境和数据库设置编写的。\n\n\
