    \ 数据库时，其管理员 ID 被设置为 `root`，并允许设置自定义的密码。\n\n使用 `root` ID 和密码，你可以创建另一个用户 ID 和密码，也可以在你的\
    \ JDBC 应用中使用 `root` ID 和密码。\n\n有许多数据库操作（如创建和删除数据库都需要管理员 ID 和密码。\n\n在 JDBC 教程的剩余部分，我们将使用\
