    - 删除记录示例\n- WHERE 子句示例\n- LIKE 子句示例\n- 数据排序示例\n\n# 概述\n\nJDBC 代表 Java Database\
    \ Connectivity（Java 连接），它是一种标准的 Java API，用于 Java 编程语言与各种数据库之间与数据库无关的连接。\n\nJDBC\
