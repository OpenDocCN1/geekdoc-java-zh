    -> id int  not  null,\n-> age int  not  null,\n-> first varchar (255),\n->  last\
    \ varchar (255)\n->  );\nQuery OK,  0 rows affected (0.08 sec)\nmysql>\n```\n\n\
    # 创建数据记录\n最后，你如下所示在 Employee 表中创建几条记录——\n\n```sql\nmysql> INSERT INTO Employees\
    \ VALUES (100,  18,  'Zara',  'Ali');\nQuery OK,  1 row affected (0.05 sec)\n\
    mysql> INSERT INTO Employees VALUES (101,  25,  'Mahnaz',  'Fatma');\nQuery OK,\
    \  1 row affected (0.00 sec)\nmysql> INSERT INTO Employees VALUES (102,  30, \
    \ 'Zaid',  'Khan');\nQuery OK,  1 row affected (0.00 sec)\nmysql> INSERT INTO\
    \ Employees VALUES (103,  28,  'Sumit',  'Mittal');\nQuery OK,  1 row affected\
    \ (0.00 sec)\nmysql>\n```\n\n为了全面了解 MySQL 数据库，请学习 [MySQL 教程](https://www.tutorialspoint.com/mysql/index.htm\
    \ \"MySQL Tutorial\")。\n\n现在你已经准备好开始尝试 JDBC 了。下一章将为你提供一个 JDBC 编程的示例。\n\n# 示例代码\n\
    本章提供了如何创建一个 JDBC 应用的示例。\n\n## 创建 JDBC 应用\n建立 JDBC 连接涉及的编程非常简单。以下是简单的步骤：\n\n* \
    \  **导入 JDBC 包** — 在你的 Java 程序中添加 `import` 语句导入所需的类。\n*   **数据库 URL 格式** — 这是为了创建一个格式正确的地址，指向你想要连接的数据库。\n\
    *   **创建连接对象** — 最后，调用 `DriverManager` 对象的 `getConnection()` 方法建立实际的数据库连接。\n\n\
    ## 示例代码\n当你需要创建自己的应用时，此示例代码可以模板。将以下示例粘贴到 `TestApplication.java`，编译并运行：\n\n```java\n\
    import java.sql.*;\n\npublic class TestApplication {\n    static final String\
    \ DB_URL = \"jdbc:mysql://localhost/TUTORIALSPOINT\";\n    static final String\
    \ USER = \"guest\";\n    static final String PASS = \"guest123\";\n    static\
    \ final String QUERY = \"SELECT id, first, last, age FROM Employees\";\n\n   \
    \ public static void main(String[] args) {\n        // 打开连接\n        try(Connection\
    \ conn = DriverManager.getConnection(DB_URL, USER, PASS);\n             Statement\
    \ stmt = conn.createStatement();\n             ResultSet rs = stmt.executeQuery(QUERY))\
    \ {\n\n            // 从结果集中提取数据\n            while (rs.next()) {\n           \
    \     // 按列名检索\n                System.out.print(\"ID: \" + rs.getInt(\"id\"));\n\
    \                System.out.print(\", Age: \" + rs.getInt(\"age\"));\n       \
    \         System.out.print(\", First: \" + rs.getString(\"first\"));\n       \
    \         System.out.println(\", Last: \" + rs.getString(\"last\"));\n       \
    \     }\n        } catch (SQLException e) {\n            e.printStackTrace();\n\
    \        }\n    }\n}\n```\n\n现在让我们如下编译上述示例：\n\n```cmd\nC:\\>javac TestApplication.java\n\
    C:\\>java TestApplication\n```\n\n当你运行 `TestApplication` 时，它产生以下结果：\n\n```text\n\
    ID: 100, Age: 18, First: Zara, Last: Ali\nID: 101, Age: 25, First: Mahnaz, Last:\
    \ Fatma\nID: 102, Age: 30, First: Zaid, Last: Khan\nID: 103, Age: 28, First: Sumit,\
    \ Last: Mittal\n```\n\n"
- fmt: "\nThe `Import` statements tell the Java compiler where to find the classes\
    \ you reference in your code and are placed at the very beginning of your source\
    \ code.\n\nTo use the standard JDBC package, which allows you to select, insert,\
    \ update, and delete data in SQL tables, add the following `imports` to your source\
    \ code −\n\n```java\nimport java.sql.* ; // for standard JDBC programs\nimport\
    \ java.math.* ; // for BigDecimal and BigInteger support\n```\n\n## Register JDBC\
    \ Driver\n\nYou must have the required JDBC driver in the classpath. In current\
    \ case, you set `CLASSPATH` variable to `C:\\Program Files\\MySQL\\mysql-connector-java-5.1.8\\\
    mysql-connector-java-5.1.8-bin.jar`. Your driver version may vary based on your\
    \ installation.\n\n## Database URL Formulation\n\nAfter you've loaded the driver,\
    \ you can establish a connection using the `DriverManager.getConnection()` method.\
    \ For easy reference, let me list the three overloaded `DriverManager.getConnection()`\
    \ method −\n\n* `getConnection(String url)`\n* `getConnection(String url, Properties\
    \ prop)`\n* `getConnection(String url, String user, String password)`\n\nHere\
    \ each form requires a database `URL`. A database URL is an address that points\
    \ to your database.\n\nFormulating a database URL is where most of the problems\
    \ associated with establishing a connection occurs.\n\nFollowing table lists down\
    \ the MySQL JDBC driver name and database URL.\n\n| RDBMS | JDBC driver name |\
    \ URL format |\n| :--- | :--- | :--- |\n| MySQL | `com.mysql.jdbc.Driver` | `jdbc:mysql://hostname/\
    \ databaseName` |\n\nAll the highlighted part in URL format is static and you\
    \ need to change only the remaining part as per your database setup.\n\n## Create\
    \ Connection Object\n\nWe have listed down three forms of `DriverManager.getConnection()`\
    \ method to create a connection object.\n\n## Using a Database URL with a username\
    \ and password\n\nThe most commonly used form of `getConnection()` requires you\
    \ to pass a database URL, a `username`, and a `password` −\n\nAs you are using\
    \ MySQL driver, you'll specify a `host:port:databaseName` value for the database\
    \ portion of the URL.\n\nIf you have a host at TCP/IP address `192.0.0.1` with\
    \ a host name of `localhost`, and your MySQL listener is configured to listen\
    \ on port `3306` as default, and your database name is `TUTORIALSPOINT`, then\
    \ complete database URL would be −\n\n`jdbc:mysql://localhost/TUTORIALSPOINT`\n\
    \nNow you have to call `getConnection()` method with appropriate username and\
    \ password to get a `Connection` object as follows −\n\n```java\nString URL =\
    \  \"jdbc:mysql://localhost/TUTORIALSPOINT\";\nString USER =  \"guest\";\nString\
    \ PASS =  \"password\";\nConnection conn =  DriverManager.getConnection(URL, USER,\
    \ PASS);\n```\n\n## Using a Database URL and a Properties Object\n\nA third form\
    \ of the `DriverManager.getConnection( ) method requires a database URL and a\
    \ `Properties` object −\n\n```java\nDriverManager.getConnection(String url, Properties\
    \ info);\n```\n\nA `Properties` object holds a set of keyword-value pairs. It\
    \ is used to pass driver properties to the driver during a call to the `getConnection()`\
    \ method.\n\nTo make the same connection made by the previous examples, use the\
    \ following code −\n\n```java\nimport java.util.*;\nString URL =  \"jdbc:mysql://localhost/TUTORIALSPOINT\"\
    ;\nProperties info =  new  Properties(  );\ninfo.put(  \"user\",  \"guest\"  );\n\
    info.put(  \"password\",  \"guest123\"  );\nConnection conn =  DriverManager.getConnection(URL,\
    \ info);\n```\n\nFor a better understanding, we suggest you to study our [Java\
    \ & MySQL - Sample Code tutorial](https://www.tutorialspoint.com/java_mysql/java_mysql_sample_code.htm).\n\
    \nNow let us compile the above example as follows −\n\n```cmd\nC:\\>javac FirstExample.java\n\
    C:\\>\n```\n\nWhen you run `FirstExample`, it produces the following result −\n\
    \n```\nC:\\>java FirstExample\nID: 100, Age: 18, First: Zara, Last: Ali\nID: 101,\
    \ Age: 25, First: Mahnaz, Last: Fatma\nID: 102, Age: 30, First: Zaid, Last: Khan\n\
    ID: 103, Age: 28, First: Sumit, Last: Mittal\nC:\\>\n```\n\n# Exceptions Handling\n\
    \nException handling allows you to handle exceptional conditions such as program-defined\
    \ errors in a controlled fashion.\n\nWhen an exception condition occurs, an exception\
    \ is thrown. The term `thrown` means that current program execution stops, and\
    \ the control is redirected to the nearest applicable `catch` clause. If no applicable\
    \ catch clause exists, then the program's execution ends.\n\nJDBC Exception handling\
    \ is very similar to the Java Exception handling but for JDBC, the most common\
    \ exception you'll deal with is `java.sql.SQLException`.\n\n## SQLException Methods\n\
    \nAn `SQLException` can occur both in the driver and the database. When such an\
    \ exception occurs, an object of type `SQLException` will be passed to the `catch`\
    \ clause.\n\nThe passed `SQLException` object has the following methods available\
    \ for retrieving additional information about the exception −\n\n| Method | Description\
    \ |\n| :--- | :--- |\n| `getErrorCode()` ) | Gets the error number associated\
    \ with the exception. |\n| `getMessage()` ) | Gets the JDBC driver's error message\
    \ for an error, handled by the driver or gets the Oracle error number and message\
    \ for a database error. |\n| `getSQLState()` ) | Gets the XOPEN SQLstate string.\
    \ For a JDBC driver error, no useful information is returned from this method.\
    \ For a database error, the five-digit XOPEN SQLstate is returned. |\n| `getNextException()`\
    \ ) | Gets the next Exception object in the exception chain. |\n| `printStackTrace()`\
    \ ) | Prints the current exception, or throwable, to standard error. |\n| `printStackTrace(PrintStream\
    \ s)` | Prints this throwable to a print stream. |\n| `printStackTrace(PrintWriter\
    \ w)` | Prints this throwable and to the print writer you specify. |\n\nBy utilizing\
    \ the information available from the Exception object, you can catch an exception\
    \ and continue your program appropriately. Here is the general form of a `try`\
    \ block −\n\n```java\ntry {\n    // Your risky code goes between these curly braces\n\
    } catch(Exception ex) {\n    // Your exception handling code goes between these\
    \ braces\n} finally {\n    // Your must-always-executed code goes between these\
    \ braces. Like closing database connection.\n}\n```\n\n## Example\n\nStudy the\
    \ following example code to understand the usage of `try...catch...finally` blocks.\
    \ This code has been written based on the environment and database setup done\
    \ in the previous chapter.\n\n```java\nimport java.sql.CallableStatement;\nimport\
    \ java.sql.Connection;\nimport java.sql.DriverManager;\nimport java.sql.SQLException;\n\
    \npublic class TestApplication {\n    static final String DB_URL = \"jdbc:mysql://localhost/TUTORIALSPOINT\"\
    ;\n    static final String USER = \"guest\";\n    static final String PASS = \"\
    guest123\";\n    static final String QUERY = \"{call getEmpName (?, ?)}\";\n\n\
    \    public static void main(String[] args) {\n        // Open a connection\n\
    \        try (Connection conn = DriverManager.getConnection(DB_URL, USER, PASS);\n\
    \             CallableStatement stmt = conn.prepareCall(QUERY)) {\n\n        \
    \    // Bind values into the parameters.\n            stmt.setInt(1, 1); // This\
    \ would set ID\n            // Because second parameter is OUT so register it\n\
    \            stmt.registerOutParameter(2, java.sql.Types.VARCHAR);\n\n       \
    \     //Use execute method to run stored procedure.\n            System.out.println(\"\
    Executing stored procedure...\");\n            stmt.execute();\n\n           \
    \ //Retrieve employee name with getXXX method\n            String empName = stmt.getString(2);\n\
    \            System.out.println(\"Emp Name with ID: 1 is \" + empName);\n\n  \
    \      } catch (SQLException e) {\n            e.printStackTrace();\n        }\n\
    \    }\n}\n```\n\nNow let us compile the above example as follows −\n\n```cmd\n\
    C:\\>javac TestApplication.java\nC:\\>\n```\n\nWhen you run `TestApplication`,\
    \ it produces the following result if there is no problem, otherwise the corresponding\
    \ error would be caught and displayed −\n\n```\nC:\\>java TestApplication\nExecuting\
    \ stored procedure...\nEmp Name with ID: 1 is Zara\n```\n"
  raw: 'The **Import** statements tell the Java compiler where to find the classes
    you reference in your code and are placed at the very beginning of your source
    code.


    To use the standard JDBC package, which allows you to select, insert, update,
    and delete data in SQL tables, add the following *imports* to your source code
    −


    import java.sql.* ; // for standard JDBC programs


    import java.math.* ; // for BigDecimal and BigInteger support


    ## Register JDBC Driver


    You must have the required JDBC driver in the classpath. In current case, you
    set CLASSPATH variable to C:\Program Files\MySQL\mysql-connector-java-5.1.8\mysql-connector-java-5.1.8-bin.jar.
    Your driver version may vary based on your installation.


    ## Database URL Formulation


    After you''ve loaded the driver, you can establish a connection using the **DriverManager.getConnection()** method.
    For easy reference, let me list the three overloaded DriverManager.getConnection()
    methods −


    *   getConnection(String url)


    *   getConnection(String url, Properties prop)


    *   getConnection(String url, String user, String password)


    Here each form requires a database **URL**. A database URL is an address that
    points to your database.


    Formulating a database URL is where most of the problems associated with establishing
    a connection occurs.


    Following table lists down the MySQL JDBC driver name and database URL.


    | RDBMS | JDBC driver name | URL format |


    | MySQL | com.mysql.jdbc.Driver | **jdbc:mysql://**hostname/ databaseName |


    All the highlighted part in URL format is static and you need to change only the
    remaining part as per your database setup.


    ## Create Connection Object


    We have listed down three forms of **DriverManager.getConnection()** method to
    create a connection object.


    ## Using a Database URL with a username and password


    The most commonly used form of getConnection() requires you to pass a database
    URL, a *username*, and a *password* −


    As you are using MySQL driver, you''ll specify a host:port:databaseName value
    for the database portion of the URL.


    If you have a host at TCP/IP address 192.0.0.1 with a host name of localhost,
    and your MySQL listener is configured to listen on port 3306 as default, and your
    database name is TUTORIALSPOINT, then complete database URL would be −


    jdbc:mysql://localhost/TUTORIALSPOINT


    Now you have to call getConnection() method with appropriate username and password
    to get a **Connection** object as follows −


    String URL =  "jdbc:mysql://localhost/TUTORIALSPOINT";


    String USER =  "guest";


    String PASS =  "password"


    Connection conn =  DriverManager.getConnection(URL, USER, PASS);


    ## Using a Database URL and a Properties Object


    A third form of the DriverManager.getConnection( ) method requires a database
    URL and a Properties object −


    DriverManager.getConnection(String url, Properties info);


    A Properties object holds a set of keyword-value pairs. It is used to pass driver
    properties to the driver during a call to the getConnection() method.


    To make the same connection made by the previous examples, use the following code
    −


    import java.util.*;


    String URL =  "jdbc:mysql://localhost/TUTORIALSPOINT";


    Properties info =  new  Properties(  );


    info.put(  "user",  "guest"  );


    info.put(  "password",  "guest123"  );


    Connection conn =  DriverManager.getConnection(URL, info);


    For a better understanding, we suggest you to study our [Java & MySQL - Sample
    Code tutorial](https://www.tutorialspoint.com/java_mysql/java_mysql_sample_code.htm).


    Now let us compile the above example as follows −


    C:\>javac FirstExample.java


    C:\>


    When you run **FirstExample**, it produces the following result −


    C:\>java FirstExample


    ID: 100, Age: 18, First: Zara, Last: Ali


    ID: 101, Age: 25, First: Mahnaz, Last: Fatma


    ID: 102, Age: 30, First: Zaid, Last: Khan


    ID: 103, Age: 28, First: Sumit, Last: Mittal


    C:\>


    # Exceptions Handling


    Exception handling allows you to handle exceptional conditions such as program-defined
    errors in a controlled fashion.


    When an exception condition occurs, an exception is thrown. The term thrown means
    that current program execution stops, and the control is redirected to the nearest
    applicable catch clause. If no applicable catch clause exists, then the program''s
    execution ends.


    JDBC Exception handling is very similar to the Java Exception handling but for
    JDBC, the most common exception you''ll deal with is **java.sql.SQLException.**


    ## SQLException Methods


    An SQLException can occur both in the driver and the database. When such an exception
    occurs, an object of type SQLException will be passed to the catch clause.


    The passed SQLException object has the following methods available for retrieving
    additional information about the exception −


    | Method | Description |


    | getErrorCode( ) | Gets the error number associated with the exception. |


    | getMessage( ) | Gets the JDBC driver''s error message for an error, handled
    by the driver or gets the Oracle error number and message for a database error.
    |


    | getSQLState( ) | Gets the XOPEN SQLstate string. For a JDBC driver error, no
    useful information is returned from this method. For a database error, the five-digit
    XOPEN SQLstate code is returned. This method can return null. |


    | getNextException( ) | Gets the next Exception object in the exception chain.
    |


    | printStackTrace( ) | Prints the current exception, or throwable, and it''s backtrace
    to a standard error stream. |


    | printStackTrace(PrintStream s) | Prints this throwable and its backtrace to
    the print stream you specify. |


    | printStackTrace(PrintWriter w) | Prints this throwable and it''s backtrace to
    the print writer you specify. |


    By utilizing the information available from the Exception object, you can catch
    an exception and continue your program appropriately. Here is the general form
    of a try block −


    try  {


    // Your risky code goes between these curly braces!!!


    }


    catch(Exception ex)  {


    // Your exception handling code goes between these


    // curly braces


    }


    finally  {


    // Your must-always-be-executed code goes between these


    // curly braces. Like closing database connection.


    }


    ## Example


    Study the following example code to understand the usage of **try....catch...finally** blocks.


    This code has been written based on the environment and database setup done in
    the previous chapter.


    import java.sql.CallableStatement;


    import java.sql.Connection;


    import java.sql.DriverManager;


    import java.sql.SQLException;


    public  class  TestApplication  {


    static  final  String DB_URL =  "jdbc:mysql://localhost/TUTORIALSPOINT";


    static  final  String USER =  "guest";


    static  final  String PASS =  "guest123";


    static  final  String QUERY =  "{call getEmpName (?, ?)}";


    public  static  void main(String[] args)  {


    // Open a connection


    try(Connection conn =  DriverManager.getConnection(DB_URL, USER, PASS);


    CallableStatement stmt = conn.prepareCall(QUERY);


    )  {            


    // Bind values into the parameters.


    stmt.setInt(1,  1);  // This would set ID


    // Because second parameter is OUT so register it


    stmt.registerOutParameter(2, java.sql.Types.VARCHAR);


    //Use execute method to run stored procedure.


    System.out.println("Executing stored procedure..."  );


    stmt.execute();


    //Retrieve employee name with getXXX method


    String empName = stmt.getString(2);


    System.out.println("Emp Name with ID: 1 is "  + empName);


    }  catch  (SQLException e)  {


    e.printStackTrace();


    }


    }


    }


    Now let us compile the above example as follows −


    C:\>javac TestApplication.java


    C:\>


    When you run **TestApplication**, it produces the following result if there is
    no problem, otherwise the corresponding error would be caught and error message
    would be displayed −


    C:\>java TestApplication


    Executing stored procedure...


    Emp Name with ID: 1 is Zara


    C:\>


