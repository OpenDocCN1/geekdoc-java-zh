    # Drop Database Example


    This chapter provides an example on how to drop an existing Database using JDBC
    application. Before executing the following example, make sure you have the following
    in place −


    *   To execute the following example you need to replace the *username* and *password* with
    your actual user name and password.


    *   Your MySQL is up and running.


    **NOTE** − This is a serious operation and you have to make a firm decision before
    proceeding to delete a database because everything you have in your database would
    be lost.


    ## Required Steps


    The following steps are required to create a new Database using JDBC application
    −


    *   **Import the packages** − Requires that you include the packages containing
    the JDBC classes needed for database programming. Most often, using *import java.sql.** will
    suffice.


    *   **Open a connection** − Requires using the *DriverManager.getConnection()* method
    to create a Connection object, which represents a physical connection with a database
    server.


    *   Deleting a database does not require database name to be in your database
    URL. Following example would delete **STUDENTS** database.


    *   **Execute a query** − Requires using an object of type Statement for building
    and submitting an SQL statement to delete the database.


    *   **Clean up the environment** − try with resources automatically closes the
    resources.


    ## Sample Code


    Copy and paste the following example in TestApplication.java, compile and run
    as follows −


    import java.sql.Connection;


    import java.sql.DriverManager;


    import java.sql.SQLException;


    import java.sql.Statement;


    public  class  TestApplication  {


    static  final  String DB_URL =  "jdbc:mysql://localhost/";


    static  final  String USER =  "guest";


    static  final  String PASS =  "guest123";


    public  static  void main(String[] args)  {


    // Open a connection


    try(Connection conn =  DriverManager.getConnection(DB_URL, USER, PASS);


    Statement stmt = conn.createStatement();


    )  {            


    String sql =  "DROP DATABASE STUDENTS";


    stmt.executeUpdate(sql);


    System.out.println("Database dropped successfully...");        


    }  catch  (SQLException e)  {


    e.printStackTrace();


    }


    }


    }


    Now let us compile the above example as follows −


    C:\>javac TestApplication.java


    C:\>


    When you run **TestApplication**, it produces the following result −


    C:\>java TestApplication


    Database dropped successfully...


    C:\>


