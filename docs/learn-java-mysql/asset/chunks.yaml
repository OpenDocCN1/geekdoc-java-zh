    \ is in `auto-commit` mode, which it is by default, then every SQL statement is\
    \ committed to the database upon its completion.\n\nThat may be fine for simple\
    \ applications, but there are three reasons why you may want to turn off the auto-commit\
    \ and manage your own transactions −\n\n*   To increase performance.\n*   To maintain\
    \ the integrity of business processes.\n*   To use distributed transactions.\n\
    \nTransactions enable you to control if, and when, changes are applied to the\
    \ database. It treats a single SQL statement or a group of SQL statements as one\
    \ logical unit, and if any statement fails, the whole transaction fails.\n\nTo\
    \ enable manual- transaction support instead of the `auto-commit` mode that the\
    \ JDBC driver uses by default, use the `Connection` object's `setAutoCommit()`\
    \ method. If you pass a boolean `false` to `setAutoCommit()`, you turn off auto-commit.\
