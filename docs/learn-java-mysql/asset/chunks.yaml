    \ 数据库已运行。\n\n## 必要的步骤\n\n使用 JDBC 应用程序创建新数据库需要以下步骤 —\n\n- **导入包** — 需要包含包含数据库编程所需的\
    \ JDBC 类的包。通常情况下，使用 `import java.sql.*` 即可。\n- **打开连接** — 需要使用 `DriverManager.getConnection()`\
    \ 方法创建一个 `Connection` 对象，该对象代表与数据库服务器的物理连接。\n- **执行查询** — 需要使用 `Statement` 类型的对象来构建并提交\
    \ SQL 语句，以便对表记录进行排序。这些查询利用 `asc` 和 `desc` 子句按升序和降序排列数据。\n- **清理环境** — 使用 try-with-resources\
    \ 自动关闭资源。\n\n## 示例代码\n\n将以下示例复制并粘贴到 `TestApplication.java` 中，按照如下方式进行编译和运行 —\n\
    \n```java\nimport java.sql.Connection;\nimport java.sql.DriverManager;\nimport\
    \ java.sql.ResultSet;\nimport java.sql.SQLException;\nimport java.sql.Statement;\n\
    \npublic class TestApplication {\n    static final String DB_URL = \"jdbc:mysql://localhost/TUTORIALSPOINT\"\
    ;\n    static final String USER = \"guest\";\n    static final String PASS = \"\
    guest123\";\n    static final String QUERY = \"SELECT id, first, last, age FROM\
    \ Registration\";\n\n    public static void main(String[] args) {\n        //\
    \ 打开连接\n        try (Connection conn = DriverManager.getConnection(DB_URL, USER,\
    \ PASS);\n             Statement stmt = conn.createStatement()) {\n          \
    \  System.out.println(\"正在按升序获取记录...\");\n            ResultSet rs = stmt.executeQuery(QUERY\
    \ + \" ORDER BY ASC\");\n            while (rs.next()) {\n                // 显示值\n\
    \                System.out.print(\"ID: \" + rs.getInt(\"id\"));\n           \
    \     System.out.print(\", Age: \" + rs.getInt(\"age\"));\n                System.out.print(\"\
    , First: \" + rs.getString(\"first\"));\n                System.out.println(\"\
    , Last: \" + rs.getString(\"last\"));\n            }\n\n            System.out.println(\"\
    正在按降序获取记录...\");\n            rs = stmt.executeQuery(QUERY + \" ORDER BY DESC\"\
    );\n            while (rs.next()) {\n                // 显示值\n                System.out.print(\"\
    ID: \" + rs.getInt(\"id\"));\n                System.out.print(\", Age: \" + rs.getInt(\"\
    age\"));\n                System.out.print(\", First: \" + rs.getString(\"first\"\
    ));\n                System.out.println(\", Last: \" + rs.getString(\"last\"));\n\
    \            }\n            rs.close();\n        } catch (SQLException e) {\n\
    \            e.printStackTrace();\n        }\n    }\n}\n```\n\n"
