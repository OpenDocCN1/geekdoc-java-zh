    , First: \"  + rs.getString(\"first\"));\n        System.out.println(\", Last:\
    \ \"  + rs.getString(\"last\"));\n    }\n    System.out.println();\n}\n\npublic\
    \  static  void main(String[] args) {\n    // 打开连接\n    try(Connection conn =\
    \  DriverManager.getConnection(DB_URL, USER, PASS);\n    Statement stmt = conn.createStatement(\n\
