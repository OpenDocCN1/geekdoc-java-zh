    # Overview


    JDBC stands for **J**ava **D**ata**b**ase **C**onnectivity, which is a standard
    Java API for database-independent connectivity between the Java programming language
    and a wide range of databases.


    The JDBC library includes APIs for each of the tasks mentioned below that are
    commonly associated with database usage.


    *   Making a connection to a database.


    *   Creating SQL or MySQL statements.


    *   Executing SQL or MySQL queries in the database.


    *   Viewing & Modifying the resulting records.


    Fundamentally, JDBC is a specification that provides a complete set of interfaces
    that allows for portable access to an underlying database. Java can be used to
    write different types of executables, such as −


    *   Java Applications


    *   Java Applets


    *   Java Servlets


    *   Java ServerPages (JSPs)


    *   Enterprise JavaBeans (EJBs).


    All of these different executables are able to use a JDBC driver to access a database,
    and take advantage of the stored data.


    JDBC provides the same capabilities as ODBC, allowing Java programs to contain
    database-independent code.


    ## Pre-Requisite


    Before moving further, you need to have a good understanding of the following
    two subjects −


    *   [Core JAVA Programming](https://www.tutorialspoint.com/java/index.htm)


    *   [SQL or MySQL Database](https://www.tutorialspoint.com/mysql/index.htm)


    ## JDBC Architecture


    The JDBC API supports both two-tier and three-tier processing models for database
    access but in general, JDBC Architecture consists of two layers −


    *   **JDBC API** − This provides the application-to-JDBC Manager connection.


    *   **JDBC Driver API** − This supports the JDBC Manager-to-Driver Connection.


    The JDBC API uses a driver manager and database-specific drivers to provide transparent
    connectivity to heterogeneous databases.


    The JDBC driver manager ensures that the correct driver is used to access each
    data source. The driver manager is capable of supporting multiple concurrent drivers
    connected to multiple heterogeneous databases.


    Following is the architectural diagram, which shows the location of the driver
    manager with respect to the JDBC drivers and the Java application −


    ![Image](Images/image00183.jpeg)


    ## Common JDBC Components


    The JDBC API provides the following interfaces and classes −


    *   **DriverManager** − This class manages a list of database drivers. Matches
    connection requests from the java application with the proper database driver
    using communication sub protocol. The first driver that recognizes a certain subprotocol
    under JDBC will be used to establish a database Connection.


    *   **Driver** − This interface handles the communications with the database server.
    You will interact directly with Driver objects very rarely. Instead, you use DriverManager
    objects, which manages objects of this type. It also abstracts the details associated
    with working with Driver objects.


    *   **Connection** − This interface with all methods for contacting a database.
    The connection object represents communication context, i.e., all communication
    with database is through connection object only.


    *   **Statement** − You use objects created from this interface to submit the
    SQL statements to the database. Some derived interfaces accept parameters in addition
    to executing stored procedures.


    *   **ResultSet** − These objects hold data retrieved from a database after you
    execute an SQL query using Statement objects. It acts as an iterator to allow
    you to move through its data.


    *   **SQLException** − This class handles any errors that occur in a database
    application.


    ## The JDBC 4.0 Packages


    The java.sql and javax.sql are the primary packages for JDBC 4.0. This is the
    latest JDBC version at the time of writing this tutorial. It offers the main classes
    for interacting with your data sources.


    The new features in these packages include changes in the following areas −


    *   Automatic database driver loading.


    *   Exception handling improvements.


    *   Enhanced BLOB/CLOB functionality.


    *   Connection and statement interface enhancements.


    *   National character set support.


    *   SQL ROWID access.


    *   SQL 2003 XML data type support.


    *   Annotations.


    # Environment Setup


    To start developing with JDBC, you should setup your JDBC environment by following
    the steps shown below. We assume that you are working on a Windows platform.


    ## Install Java


    Java SE is available for download for free. To download [click here](https://www.oracle.com/technetwork/java/javase/downloads/jdk9-downloads-3848520.html),
    please download a version compatible with your operating system.


    Follow the instructions to download Java, and run the **.exe** to install Java
    on your machine. Once you have installed Java on your machine, you would need
    to set environment variables to point to correct installation directories.


    ### Setting Up the Path for Windows 2000/XP


    Assuming you have installed Java in c:\Program Files\java\jdk directory −


    *   Right-click on ''My Computer'' and select ''Properties''.


    *   Click on the ''Environment variables'' button under the ''Advanced'' tab.


    *   Now, edit the ''Path'' variable and add the path to the Java executable directory
    at the end of it. For example, if the path is currently set to C:\Windows\System32,
    then edit it the following way


    C:\Windows\System32;c:\Program Files\java\jdk\bin


    ### Setting Up the Path for Windows 95/98/ME


    Assuming you have installed Java in c:\Program Files\java\jdk directory −


    *   Edit the ''C:\autoexec.bat'' file and add the following line at the end −


    SET PATH = %PATH%;C:\Program Files\java\jdk\bin


    ### Setting Up the Path for Linux, UNIX, Solaris, FreeBSD


    Environment variable PATH should be set to point to where the Java binaries have
    been installed. Refer to your shell documentation if you have trouble doing this.'
