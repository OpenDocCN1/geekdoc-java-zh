    \ 或 MySQL 查询。\n* 查看和修改结果记录。\n\n从根本上说，JDBC 是一种规范，它提供了一套完整的接口，允许对底层数据库进行可移植访问。Java\
    \ 可编写不同类型的可执行文件，例如：\n\n* Java \n* Java Applets\n* Java Servlets\n* Java ServerPages\
    \ (JSPs)\n* 企业级 JavaBeans (EJBs)。\n\n所有这些不同的可执行文件都能使用 JDBC 驱动程序访问数据库并利用存储的数据。JDBC\
    \ 提供了与 ODBC 相同的功能，允许 Java 程序包含与数据库无关的代码。\n\n## 先决条件\n\n在继续之前，您需要对以下两个主题有良好的理解：\n\
    \n* [Java 核心编程](https://www.tutorialspoint.com/java/index.htm)\n* [SQL 或 MySQL\
    \ 数据库](https://www.tutorialspoint.com/mysql/index.htm)\n\n## JDBC 架构\n\nJDBC API\
    \ 支持数据库访问的双层和三层处理模型，但通常情况下，JDBC 架构由两层组成：\n\n* **JDBC API**: 为应用程序提供接口。\n* **JDBC\
    \ 驱动程序**: 处理与数据库的通信。\n\nJDBC API 支持数据库访问的双层和三层处理模型，但通常情况下，JDBC 架构由两层组成：\n\n* **JDBC\
    \ API**: 为应用程序提供接口。\n* **JDBC 驱动程序**: 处理与数据库的通信。\n\nJDBC API 支持数据库访问的双层和三层处理模型，但通常情况下，JDBC\
    \ 架构由两层组成：\n\n* **JDBC API**: 为应用程序提供接口。\n* **JDBC 驱动程序**: 处理与数据库的通信。\n\nJDBC\
    \ API 支持数据库访问的双层和三层处理模型，但通常情况下，JDBC 架构由两层组成：\n\n* **JDBC API**: 为应用程序提供接口。\n*\
    \ **JDBC 驱动程序**: 处理与数据库的通信。\n\nJDBC API 支持数据库访问的双层和三层处理模型，但通常情况下，JDBC 架构由两层组成：\n\
    \n* **JDBC API**: 为应用程序提供接口。\n* **JDBC 驱动程序**: 处理与数据库的通信。\n\nJDBC API 支持数据库访问的双层和三层处理模型，但通常情况下，JDBC\
    \ 架构由两层组成：\n\n* **JDBC API**: 为应用程序提供接口。\n* **JDBC 驱动程序**: 处理与数据库的通信。\n\nJDBC\
    \ API 支持数据库访问的双层和三层处理模型，但通常情况下，JDBC 架构由两层组成：\n\n* **JDBC API**: 为应用程序提供接口。\n*\
    \ **JDBC 驱动程序。\n\n## 通用组件\n\nJDBC API 提供了以下接口：\n\n* `DriverManager`: 管理驱动程序列表。\n\
    * `Driver`: 驱动程序连接到特定数据存储的接口。\n* `Connection`: 表示数据库会话。\n* `Statement`: 用于向数据库提交查询。\n\
    * `ResultSet`: 存储从查询检索的数据。\n* `SQLException`: 处理数据库访问过程中发生的错误。\n\n## JDBC 4.0\
    \ 包\n\n`java.sql` 和 `javax.sql` 是 JDBC 4.0 的主要包。这是编写时的最新版本。这些包的功能包括：\n\n* 自动驱动加载。\n\
    * 异常处理改进。\n* 增强的 BLOB/CLOB 功能。\n* 连接和语句接口增强。\n* 国家字符集支持。\n* SQLID 访问。\n* SQL 2003\
    \ 数据类型支持。\n* 注解。\n\n# 环境搭建\n\n要开始使用 JDBC，请按照以下步骤设置 JDBC 环境。我们假设你在 Windows 平台上。\n\
    \n## 安装 Java\n\nJava SE 可免费下载。要下载，请[点击此处](https://www.oracle.com/technetwork/java/downloads/jdk9-downloads-3848520.html)，下载与操作系统兼容的版本。\n\
    \n按照说明下载 Java 并运行 `.exe` 在你的机器上安装 Java。安装 Java 后，你需要设置环境变量指向安装目录。\n\n### 为 Windows\
    \ 2000/XP 设置路径\n\n假设你将 Java 安装在 `C:\\Program Files\\java\\jdk` 目录：\n\n* 右键点击“计算机”，选择“属性”。\n\
    * 点击“高级”选项卡下的“环境变量”按钮。\n* 现在，编辑 `Path` 变量并将 Java 可执行目录路径添加到末尾。例如，如果当前设置为 `C:\\\
    Windows\\System32`，则按如下编辑：\n\n`C:\\Windows\\System32;C:\\Program Files\\java\\\
    jdk\\bin`\n\n### 为 Windows 95/98/ME 设置路径\n\n假设你将 Java 安装在 `C:\\Program Files\\\
    java\\jdk` 目录：\n\n* 编辑 `C:\\autoexec.bat` 文件，在末尾添加以下行：\n\n`SET PATH = %PATH%;C:\\\
    Program Files\\java\\jdk\\bin`\n\n### 为 Linux, UNIX, Solaris, FreeBSD 设置路径\n\n\
    环境变量 `PATH` 应该设置为 Java 二进制文件安装位置。如果你在执行此操作遇到困难，请参考你的 shell 文档。\n\n"
- fmt: "\nFor example, if you use `bash` as your shell, then you would add the following\
    \ line at the end of your `.bashrc` −\n\n```bash\nexport PATH = /path/to/java:$PATH'\n\
    ```\n\nYou automatically get both JDBC packages `java.sql` and `javax.sql,` when\
    \ you install J2SE Development Kit.\n\n# Install Database\nThe most important\
    \ thing you will need, of course is an actual running database with a table that\
    \ you can query and modify.\n\nInstall a database that is most suitable for you.\
    \ You can have plenty of choices and most common are −\n\n*   `MySQL DB` — `MySQL`\
    \ is an open source database. You can download it from [MySQL Official Site](https://dev.mysql.com/downloads/mysql).\
    \ We recommend downloading the full Windows installation.\n*   In addition, download\
    \ and install [MySQL Administrator](https://dev.mysql.com/downloads/gui-tools/)\
    \ as well as [MySQL Query Browser.](https://dev.mysql.com/downloads/gui-tools/)\
    \ These are GUI based tools that will make your development much easier.\n*  \
    \ Finally, download and unzip [MySQL Connector/J](https://dev.mysql.com/downloads/connector/j/3.1.html)\
    \ (the MySQL JDBC driver) in a convenient directory. For the purpose of this tutorial\
    \ we will assume that you have installed the driver at `C:\\Program Files\\MySQL\\\
    mysql-connector-java-5.1.8`.\n*   Accordingly, set `CLASSPATH` variable to `C:\\\
    Program Files\\MySQL\\mysql-connector-java-5.1.8\\mysql-connector-java-5.1.8-bin.jar`.\
    \ Your driver version may vary based on your installation.\n\n# Set Database Credential\n\
    When we install MySQL database, its administrator ID is set to `root` and it gives\
    \ provision to set a password of your choice.\n\nUsing `root` ID and password\
    \ you can either create another user ID and password, or you can use `root` ID\
    \ and password for your JDBC application.\n\nThere are various database operations\
    \ like database creation and deletion, which would need administrator ID and password.\n\
    \nFor rest of the JDBC tutorial, we would use MySQL Database with `guest` as ID\
    \ and `guest123` as password.\n\nIf you do not have sufficient privilege to create\
    \ new users, then you can ask your Database Administrator (DBA) to create a user\
    \ ID and password for you.\n\n# Create Database\nTo create the `TUTORIALSPOINT`\
    \ database, use the following steps −\n\n## Step 1\nOpen a `Command Prompt` and\
    \ change to the installation directory as follows −\n\n```cmd\nC:\\>\nC:\\>cd\
    \ Program Files\\MySQL\\bin\nC:\\Program Files\\MySQL\\bin>\n```\n**Note** — The\
    \ path to `mysqld.exe` may vary depending on the install location of MySQL on\
    \ your system. You can also check documentation on how to start and stop your\
    \ database server.\n\n## Step 2\nStart the database server by executing the following\
    \ command, if it is already not running.\n\n```cmd\nC:\\Program Files\\MySQL\\\
    bin>mysqld\nC:\\Program Files\\MySQL\\bin>\n```\n\n## Step 3\nCreate the `TUTORIALSPOINT`\
    \ database by executing the following command −\n\n```cmd\nC:\\Program Files\\\
    MySQL\\bin> mysqladmin create TUTORIALSPOINT -u guest -p\nEnter password: ********\n\
    C:\\Program Files\\MySQL\\bin>\n```\n\n# Create Table\nTo create the `Employees`\
    \ table in TUTORIALSPOINT database, use the following steps −\n\n## Step 1\nOpen\
    \ a `Command Prompt` and change to the installation directory as follows −\n\n\
    ```cmd\nC:\\>\nC:\\>cd Program Files\\MySQL\\bin\nC:\\Program Files\\MySQL\\bin>\n\
    ```\n\n## Step 2\nLogin to the database as follows −\n\n```cmd\nC:\\Program Files\\\
    MySQL\\bin>mysql -u guest -p\nEnter password: ********\nmysql>\n```\n\n## Step\
    \ 3\nCreate the table `Employees` as follows −\n\n```sql\nmysql>  use TUTORIALSPOINT;\n\
    mysql> create table Employees\n->  (\n-> id int  not  null,\n-> age int  not \
    \ null,\n-> first varchar (255),\n->  last varchar (255)\n->  );\nQuery OK,  0\
    \ rows affected (0.08 sec)\nmysql>\n```\n\n# Create Data Records\nFinally you\
    \ create few records in Employee table as follows −\n\n```sql\nmysql> INSERT INTO\
    \ Employees VALUES (100,  18,  'Zara',  'Ali');\nQuery OK,  1 row affected (0.05\
    \ sec)\nmysql> INSERT INTO Employees VALUES (101,  25,  'Mahnaz',  'Fatma');\n\
    Query OK,  1 row affected (0.00 sec)\nmysql> INSERT INTO Employees VALUES (102,\
    \  30,  'Zaid',  'Khan');\nQuery OK,  1 row affected (0.00 sec)\nmysql> INSERT\
    \ INTO Employees VALUES (103,  28,  'Sumit',  'Mittal');\nQuery OK,  1 row affected\
    \ (0.00 sec)\nmysql>\n```\n\nFor a complete understanding on MySQL database, study\
    \ the [MySQL Tutorial](https://www.tutorialspoint.com/mysql/index.htm \"MySQL\
    \ Tutorial\").\n\nNow you are ready to start experimenting with JDBC. Next chapter\
    \ gives you a sample example on JDBC Programming.\n\n# Sample Code\nThis chapter\
    \ provides an example of how to create a JDBC application.\n\n## Creating JDBC\
    \ Application\nThe programming involved to establish a JDBC connection is fairly\
    \ simple. Here are these simple steps:\n\n*   **Import JDBC Packages** — Add `import`\
    \ statements to your Java program to import required classes in your Java code.\n\
    *   **Database URL Formulation** — This is to create a properly formatted address\
    \ that points to the database to which you wish to connect.\n*   **Create Connection\
    \ Object** — Finally, code a call to the `DriverManager` object's `getConnection(\
    \ )` method to establish actual database connection.\n\n## Sample Code\nThis sample\
    \ code can serve as a template when you need to create your own application. Copy\
    \ and paste the following example in `TestApplication.java`, compile and run:\n\
    \n```java\nimport java.sql.*;\n\npublic class TestApplication {\n    static final\
    \ String DB_URL = \"jdbc:mysql://localhost/TUTORIALSPOINT\";\n    static final\
    \ String USER = \"guest\";\n    static final String PASS = \"guest123\";\n   \
    \ static final String QUERY = \"SELECT id, first, last, age FROM Employees\";\n\
    \n    public static void main(String[] args) {\n        // Open a connection\n\
    \        try(Connection conn = DriverManager.getConnection(DB_URL, USER, PASS);\n\
    \             Statement stmt = conn.createStatement();\n             ResultSet\
    \ rs = stmt.executeQuery(QUERY)) {\n\n            // Extract data from result\
    \ set\n            while (rs.next()) {\n                // Retrieve by column\
    \ name\n                System.out.print(\"ID: \" + rs.getInt(\"id\"));\n    \
    \            System.out.print(\", Age: \" + rs.getInt(\"age\"));\n           \
    \     System.out.print(\", First: \" + rs.getString(\"first\"));\n           \
    \     System.out.println(\", Last: \" + rs.getString(\"last\"));\n           \
    \ }\n        } catch (SQLException e) {\n            e.printStackTrace();\n  \
    \      }\n    }\n}\n```\n\nNow let us compile the above example as follows:\n\n\
    ```cmd\nC:\\>javac TestApplication.java\nC:\\>java TestApplication\n```\n\nWhen\
    \ you run `TestApplication`, it produces the following result:\n\n```text\nID:\
    \ 100, Age: 18, First: Zara, Last: Ali\nID: 101, Age: 25, First: Mahnaz, Last:\
    \ Fatma\nID: 102, Age: 30, First: Zaid, Last: Khan\nID: 103, Age: 28, First: Sumit,\
    \ Last: Mittal\n```\n"
