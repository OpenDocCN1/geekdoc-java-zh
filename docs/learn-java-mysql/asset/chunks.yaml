    export PATH = /path/to/java:$PATH'\n```\n\n当你安装 J2SE 开发工具包时，会自动获得两个 JDBC 软件包 `java.sql`\
    \ 和 `javax.sql,`。\n\n# 安装数据库\n当然，你需要的最重要的东西是一个实际运行的数据库，并且其中包含一个你可以进行查询和修改的表。\n\
    \n安装一个最适合你的数据库。你有很多选择，最常见的有——\n\n*   `MySQL DB` — `MySQL` 是一个开源数据库。你可以从 [MySQL\
    \ 官方网站](https://dev.mysql.com/downloads/mysql) 下载它。我们建议下载完整的 Windows 安装包。\n* \
