    the first column of a row is 1, the second column of a row is 2, and so on. |


    Similarly, there are get methods in the ResultSet interface for each of the eight
    Java primitive types, as well as common types such as java.lang.String, java.lang.Object,
    and java.net.URL.


    There are also methods for getting SQL data types java.sql.Date, java.sql.Time,
    java.sql.TimeStamp, java.sql.Clob, and java.sql.Blob. Check the documentation
    for more information about using these SQL data types.


    Following is the example which makes use of few viewing methods described.


    This sample code has been written based on the environment and database setup
    done in the previous chapters.


    Copy and paste the following example in TestApplication.java, compile and run
    as follows −


