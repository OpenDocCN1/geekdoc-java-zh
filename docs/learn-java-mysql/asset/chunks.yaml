    \ 对象执行 SQL 语句之前，你首先需要使用 `Connection` 对象的 `createStatement()` 方法创建一个对象，如下例所示：\n\
    \n```java\nStatement stmt = null;\n\ntry {\n    stmt = conn.createStatement();\n\
