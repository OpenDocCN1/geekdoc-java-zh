  trans: "\n从数据库查询中读取数据的 SQL 语句会将数据返回到结果集中。`SELECT` 语句是从数据库中选择行并在结果集中查看它们的标准方法。`java.sql.ResultSet`\
    \ 接口表示数据库查询的结果集。\n\n`ResultSet` 对象维护一个指向结果集中当前行的游标。“结果集”（result set）一术语指的是包含在\
    \ `ResultSet` 对象中的行数据和列数据。\n\n`ResultSet` 接口的方法可以分为三类 −\n\n- **导航方法 (Navigational\
    \ methods)** − 用于移动游标。\n- **获取方法 (Get methods)** − 用于查看游标所指向的当前行列中的数据。\n- **更新方法\
    \ (Update methods)** − 用于更新当前行列中的数据。这些更新也可以同步到底层数据库中。\n\n游标可以根据 `ResultSet` 的属性进行移动。这些属性在创建生成\
    \ `ResultSet` 的相应 `Statement` 时指定。\n\nJDBC 提供了以下连接方法来创建带有所需 `ResultSet` 的语句 −\n\
    \n- `createStatement(int RSType, int RSConcurrency);`\n- `prepareStatement(String\
    \ SQL, int RSType, int RSConcurrency);`\n- `prepareCall(String sql, int RSType,\
    \ int RSConcurrency);`\n\n第一个参数表示 `ResultSet` 对象的类型，第二个参数是两个 `ResultSet` 常量之一，用于指定结果集是只读的还是可更新的。\n\
    \n## ResultSet 的类型\n\n可能的 `RSType` 如下所示。如果你不指定任何 `ResultSet` 类型，将自动获得一个为 `TYPE_FORWARD_ONLY`\
    \ 的类型。\n\n| 类型 | 描述 |\n| :--- | :--- |\n| `ResultSet.TYPE_FORWARD_ONLY` | 游标只能在结果集中向前移动。\
    \ |\n| `ResultSet.TYPE_SCROLL_INSENSITIVE` | 游标可以向前向后滚动，且结果集对结果集创建后其他人对数据库所做的更改不敏感。\
    \ |\n| `ResultSet.TYPE_SCROLL_SENSITIVE` | 游标可以向前向后滚动，且结果集对结果集创建后其他人对数据库所做的更改敏感。\
    \ |\n\n## ResultSet 的并发性\n\n可能的 `RSConcurrency` 如下所示。如果你不指定任何并发类型，将自动获得一个为 `CONCUR_READ_ONLY`\
    \ 的类型。\n\n| 并发性 | 描述 |\n| :--- | :--- |\n| `ResultSet.CONCUR_READ_ONLY` | 创建只读的结果集。这是默认值。\
    \ |\n| `ResultSet.CONCUR_UPDATABLE` | 创建可更新的结果集。 |\n\n我们目前为止编写的所有示例都可以写如下所示，它初始化了一个\
    \ `Statement` 对象来创建一个单向的、只读的 `ResultSet` 对象 −\n\n```java\ntry(\n    Statement\
    \ stmt = conn.createStatement(\n        ResultSet.TYPE_FORWARD_ONLY,\n       \
    \ ResultSet.CONCUR_READ_ONLY);)\n} catch(Exception ex) {\n    ....\n} finally\
    \ {\n    ....\n}\n```\n\n# 导航结果集\n\n`ResultSet` 接口中有几个方法涉及移动游标，包括 −\n\n| 序号 |\
    \ 方法与描述 |\n| :--- | :--- |\n| 1 | `public void beforeFirst() throws SQLException`\
    \ 将游标移动到第一行之前。 |\n| 2 | `public void afterLast() throws SQLException` 将游标移动到最后一行之后。\
    \ |\n| 3 | `public boolean first() throws SQLException` 将游标移动到第一行。 |\n| 4 | `public\
    \ void last() throws SQLException` 将游标移动到最后一行。 |\n| 5 | `public boolean absolute(int\
    \ row) throws SQLException` 将游标移动到指定的行。 |\n| 6 | `public boolean relative(int\
    \ row) throws SQLException` 将游标从当前指向的位置向前或向后移动指定的行数。 |\n| 7 | `public boolean\
    \ previous() throws SQLException` 将游标移动到上一行。如果上一行不在结果集中，则返回 false。 |\n| 8 | `public\
    \ boolean next() throws SQLException` 将游标移动到下一行。如果结果集中没有更多行，则返回 false。 |\n| 9\
    \ | `public int getRow() throws SQLException` 返回游标所指向的行号。 |\n| 10 | `public void\
    \ moveToInsertRow() throws SQLException` 将游标移动到结果集中的一个特殊行，该行可用于向数据库插入新行。会记住当前的游标位置。\
    \ |\n| 11 | `public void moveToCurrentRow() throws SQLException` 如果游标当前位于插入行，则将游标移回当前行；否则，此方法不执行任何操作\
    \ |\n\n下面是使用了上述几个导航方法的示例。\n\n此示例代码是根据之前章节中完成的环境和数据库设置编写的。\n\n将以下示例复制并粘贴到 `TestApplication.java`\
    \ 中，并如下方式编译和运行 −\n\n```java\nimport java.sql.Connection;\nimport java.sql.DriverManager;\n\
    import java.sql.ResultSet;\nimport java.sql.SQLException;\nimport java.sql.Statement;\n\
    \npublic class TestApplication {\n    static final String DB_URL = \"jdbc:mysql://localhost/TUTORIALSPOINT\"\
    ;\n    static final String USER = \"guest\";\n    static final String PASS = \"\
    guest123\";\n    static final String QUERY = \"SELECT id, first, last, age FROM\
    \ Employees\";\n\n    public static void main(String[] args) {\n        // 打开连接\n\
    \        try(\n            Connection conn = DriverManager.getConnection(DB_URL,\
    \ USER, PASS);\n            Statement stmt = conn.createStatement(\n         \
    \       ResultSet.TYPE_FORWARD_ONLY,\n                ResultSet.CONCUR_READ_ONLY);\n\
    \            ResultSet rs = stmt.executeQuery(QUERY);\n        ) {\n         \
    \   // 将游标移动到最后一行\n            System.out.println(\"Moving cursor to the last...\"\
    );\n            rs.last();\n            // 提取结果集\n            System.out.println(\"\
    Displaying record...\");\n            // 获取列名\n            int id = rs.getInt(\"\
    id\");\n            int age = rs.getInt(\"age\");\n            String first =\
    \ rs.getString(\"first\");\n            String last = rs.getString(\"last\");\n\
    \            // 显示结果\n            System.out.println(\"ID: \" + id + \", Age:\
    \ \" + age + \", First: \" + first + \", Last: \" + last);\n\n            // 将游标移动到第一行\n\
    \            System.out.println(\"Moving cursor to the first row...\");\n    \
    \        rs.first();\n            // 提取结果集\n            System.out.println(\"\
    Displaying record...\");\n            // 获取列名\n            id = rs.getInt(\"id\"\
    );\n            age = rs.getInt(\"age\");\n            first = rs.getString(\"\
    first\");\n            last = rs.getString(\"last\");\n            // 显示结果\n \
    \           System.out.println(\"ID: \" + id + \", Age: \" + age + \", First:\
    \ \" + first + \", Last: \" + last);\n\n            // 将游标移动到下一行\n           \
    \ System.out.println(\"Moving cursor to the next row...\");\n            rs.next();\n\
    \            // 提取结果集\n            System.out.println(\"Displaying record...\"\
    );\n            // 获取列名\n            id = rs.getInt(\"id\");\n            age\
    \ = rs.getInt(\"age\");\n            first = rs.getString(\"first\");\n      \
    \      last = rs.getString(\"last\");\n            // 显示结果\n            System.out.println(\"\
    ID: \" + id + \", Age: \" + age + \", First: \" + first + \", Last: \" + last);\n\
    \        } catch (SQLException e) {\n            e.printStackTrace();\n      \
    \  }\n    }\n}\n```\n\n现在，如下所示编译上述示例 −\n\n```bash\nC:\\>javac TestApplication.java\n\
    C:\\>\n```\n\n当运行 **TestApplication** 时，会产生以下结果 −\n\n```\nC:\\>java TestApplication\n\
    Moving cursor to the last...\nDisplaying record...\nID: 103, Age: 30, First: Sumit,\
    \ Last: Mittal\nMoving cursor to the first row...\nDisplaying record...\nID: 100,\
    \ Age: 18, First: Zara, Last: Ali\nMoving cursor to the next row...\nDisplaying\
    \ record...\nID: 101, Age: 25, First: Mehnaz, Last: Fatma\nC:\\>\n```\n\n## 查看结果集\n\
    \n`ResultSet` 接口包含许多用于获取当前行数据的方法。\n\n对于每种可能的数据类型都有对应的 get 方法，并且每个 get 方法有两个版本\
    \ −\n\n- 一个接收列名的版本。\n- 一个接收列索引的版本。\n\n例如，如果你感兴趣要查看的列包含 int 类型，则需要使用 `ResultSet`\
    \ 的一个 `getInt()` 方法之一 −\n\n"
- fmt: "\n| 1 | `public int getInt(String columnName) throws SQLException` Returns\
    \ the int in the current row in the column named `columnName`. |\n| 2 | `public\
    \ int getInt(int columnIndex) throws SQLException` Returns the int in the current\
    \ row in the specified column index. The column index starts at 1, meaning the\
    \ first column of a row is 1, the second column of a row is 2, and so on. |\n\n\
    Similarly, there are `get` methods in the `ResultSet` interface for each of the\
    \ eight Java primitive types, as well as common types such as `java.lang.String`,\
    \ `java.lang.Object`, and `java.net.URL`.\n\nThere are also methods for getting\
    \ SQL data types `java.sql.Date`, `java.sql.Time`, `java.sql.TimeStamp`, `java.sql.Clob`,\
    \ and `java.sql.Blob`. Check the documentation for more information about using\
    \ these SQL data types.\n\nFollowing is the example which makes use of few viewing\
    \ methods described.\n\nThis sample code has been written based on the environment\
    \ and database setup done in the previous chapters.\n\nCopy and paste the following\
    \ example in `TestApplication.java`, compile and run as follows −\n\n```java\n\
    import java.sql.Connection;\nimport java.sql.DriverManager;\nimport java.sql.ResultSet;\n\
    import java.sql.SQLException;\nimport java.sql.Statement;\n\npublic  class  TestApplication\
    \  {\n\nstatic  final  String DB_URL =  \"jdbc:mysql://localhost/TUTORIALSPOINT\"\
    ;\n\nstatic  final  String USER =  \"guest\";\n\nstatic  final  String PASS =\
    \  \"guest123\";\n\nstatic  final  String QUERY =  \"SELECT id, first, last, age\
    \ FROM Employees\";\n\npublic  static  void main(String[] args)  {\n\n// Open\
    \ a connection\n\ntry(Connection conn =  DriverManager.getConnection(DB_URL, USER,\
    \ PASS);\n\nStatement stmt = conn.createStatement(\n\nResultSet.TYPE_SCROLL_INSENSITIVE,\n\
    \nResultSet.CONCUR_READ_ONLY);\n\nResultSet rs = stmt.executeQuery(QUERY);\n\n\
    )  {             \n\n// Move cursor to the last row.\nSystem.out.println(\"Moving\
    \ cursor to the last...\");\nrs.last();\n\n// Extract data from result set\nSystem.out.println(\"\
    Displaying record...\");\n//Retrieve by column name\nint id = rs.getInt(\"id\"\
    );\nint age = rs.getInt(\"age\");\nString first = rs.getString(\"first\");\nString\
    \  last  = rs.getString(\"last\");\n\n// Display values\nSystem.out.print(\"ID:\
    \ \"  + id);\nSystem.out.print(\", Age: \"  + age);\nSystem.out.print(\", First:\
    \ \"  + first);\nSystem.out.println(\", Last: \"  +  last);\n\n// Move cursor\
    \ to the first row.\nSystem.out.println(\"Moving cursor to the first row...\"\
    );\nrs.first();\n\n// Extract data from result set\nSystem.out.println(\"Displaying\
    \ record...\");\n// Retrieve by column name\nid = rs.getInt(\"id\");\nage = rs.getInt(\"\
    age\");\nfirst = rs.getString(\"first\");\nlast  = rs.getString(\"last\");\n\n\
    // Display values\nSystem.out.print(\"ID: \"  + id);\nSystem.out.print(\", Age:\
    \ \"  + age);\nSystem.out.print(\", First: \"  + first);\nSystem.out.println(\"\
    , Last: \"  +  last);\n\n// Move cursor to the first row.\nSystem.out.println(\"\
    Moving cursor to the next row...\");\nrs.next();\n\n// Extract data from result\
    \ set\nSystem.out.println(\"Displaying record...\");\nid = rs.getInt(\"id\");\n\
    age = rs.getInt(\"age\");\nfirst = rs.getString(\"first\");\nlast  = rs.getString(\"\
    last\");\n\n// Display values\nSystem.out.print(\"ID: \"  + id);\nSystem.out.print(\"\
    , Age: \"  + age);\nSystem.out.print(\", First: \"  + first);\nSystem.out.println(\"\
    , Last: \"  +  last);             \n\n}  catch  (SQLException e)  {\n\ne.printStackTrace();\n\
    }\n\n}\n}\n```\n\nNow let us compile the above example as follows −\n\n```\nC:\\\
    >javac TestApplication.java\nC:\\>\n```\n\nWhen you run `TestApplication`, it\
    \ produces the following result −\n\n```\nC:\\>java TestApplication\nMoving cursor\
    \ to the last...\nDisplaying record...\nID: 103, Age: 30, First: Sumit, Last:\
    \ Mittal\nMoving cursor to the first row...\nDisplaying record...\nID: 100, Age:\
    \ 18, First: Zara, Last: Ali\nMoving cursor to the next row...\nDisplaying record...\n\
    ID: 101, Age: 25, First: Mehnaz, Last: Fatma\nC:\\>\n```\n\n# Updating a Result\
    \ Set\n\nThe `ResultSet` interface contains a collection of update methods for\
    \ updating the data of a result set.\n\nAs with the get methods, there are two\
    \ update methods for each data type −\n\n- One that takes in a column name.\n\
    - One that takes in a column index.\n\nFor example, to update a String column\
    \ of the current row of a result set, you would use one of the following `updateString()`\
    \ methods −\n\n| S.N. | Methods & Description |\n| :--- | :--- |\n| 1 | `public\
    \ void updateString(int columnIndex, String s) throws SQLException` Changes the\
    \ String in the specified column. |\n| 2 | `public void updateString(String columnName,\
    \ String s) throws SQLException` Similar to the previous method, except the column\
    \ is specified by name instead of its index. |\n\nThere are `update` methods for\
    \ the eight primitive types, as well as `String`, `Object`, and `URL` in the `ResultSet`\
    \ package. To update a row in the result set, you need to invoke one of the following\
    \ methods:\n\n| S.N. | Methods & Description |\n| :--- | :--- |\n| 1 | `public\
    \ void updateRow()` Updates the current row in the database. |\n| 2 | `public\
    \ void deleteRow()` Deletes the current row from the database |\n| 3 | `public\
    \ void refreshRow()` Refreshes the data in the result set to reflect any changes.\
    \ |\n| 4 | `public void cancelRow()` Cancels any updates made on the current row.\
    \ |\n| 5 | `public void insertRow()` Inserts a row into the database. This method\
    \ can only be invoked when the cursor is pointing to a row. |\n\n# Create Data\n\
    \nFinally you create few records in Employee table as −\n\n```\nmysql> use TUTORIALSPOINT;\n\
    mysql> drop table Employees;\nQuery OK, 0 rows affected (0.08 sec)\nmysql> create\
    \ table Employees (\n-> id int primary key auto_increment,\n-> age int not null,\n\
    -> first varchar (255),\n-> last varchar (255)\n-> );\nQuery OK, 0 rows affected\
    \ (0.08 sec)\nmysql> INSERT INTO Employees(AGE, FIRST, LAST) VALUES (18, 'Zara',\
    \ 'Ali');\nQuery OK, 1 row affected (0.05 sec)\nmysql> INSERT INTO Employees(AGE,\
    \ FIRST, LAST) VALUES (25, 'Mahnaz', 'Fatma');\nQuery OK, 1 row affected (0.00\
    \ sec)\nmysql> INSERT INTO Employees(AGE, FIRST, LAST) VALUES (30, 'Zaid', 'Khan');\n\
    Query OK, 1 row affected (0.00 sec)\nmysql> INSERT INTO Employees(AGE, FIRST,\
    \ LAST) VALUES (28, 'Sumit', 'Mittal');\nQuery OK, 1 row affected (0.00 sec)\n\
    ```\n"
