- fmt: "\n## Batching with PrepareStatement Object\n\nHere is a typical sequence of\
    \ steps to use Batch Processing with PrepareStatement Object:\n\n- Create SQL\
    \ statements with placeholders.\n- Create `PreparedStatement` object using either\
    \ `prepareStatement()` methods.\n- Set auto-commit to false using `setAutoCommit()`.\n\
    - Add as many as SQL statements you like into batch using `addBatch()` method\
    \ on created statement object.\n- Execute all the SQL statements using `executeBatch()`\
    \ method on created statement object.\n- Finally, commit all the changes using\
    \ `commit()` method.\n\nThe following code snippet provides an example of a batch\
    \ update using `PreparedStatement` object:\n\n```java\n// Create SQL statement\n\
    String SQL = \"INSERT INTO Employees (id, first, last, age) VALUES(?, ?, ?, ?)\"\
    ;\n\n// Create PrepareStatement object\nPreparedStatement pstmt = conn.prepareStatement(SQL);\n\
    \n// Set auto-commit to false\nconn.setAutoCommit(false);\n\n// Set the variables\n\
    pstmt.setInt(1, 400);\npstmt.setString(2, \"Pappu\");\npstmt.setString(3, \"Singh\"\
    );\npstmt.setInt(4, 33);\n// Add it to the batch\npstmt.addBatch();\n\n// Set\
    \ the variables\npstmt.setInt(1, 401);\npstmt.setString(2, \"Pawan\");\npstmt.setString(3,\
    \ \"Singh\");\npstmt.setInt(4, 31);\n// Add it to the batch\npstmt.addBatch();\n\
    \n// Create an int[] to hold returned values\nint[] count = stmt.executeBatch();\n\
    \n// Explicitly commit statements to apply changes\nconn.commit();\n```\n\n##\
