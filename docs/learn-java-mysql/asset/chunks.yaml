  trans: "\n\n`Import` 语句告诉 Java 编译器在何处查找代码中引用的类，它们被放置在源代码的最开始。\n\n要使用标准的 JDBC 程序包（它允许你对\
    \ SQL 表进行选择、插入、更新和删除数据操作），请在你的源代码中添加以下 `imports` ——\n\n```java\nimport java.sql.*\
    \ ; // 用于标准的 JDBC 程序\nimport java.math.* ; // 用于对 BigDecimal 和 BigInteger 的支持\n\
    ```\n\n## 注册 JDBC 驱动程序\n\n你必须在 classpath 中拥有所需的 JDBC 驱动程序。在当前情况下，你将 `CLASSPATH`\
    \ 变量设置为 `C:\\Program Files\\MySQL\\mysql-connector-java-5.1.8\\mysql-connector-java-5.1.8-bin.jar`。你的驱动版本可能会根据你的安装情况而异。\n\
    \n## 数据库 URL 的构建\n\n在加载驱动程序后，你可以使用 `DriverManager.getConnection()` 方法建立连接。为了方便参考，让我列出三个重载的\
    \ `DriverManager.getConnection()` 方法 ：\n\n* `getConnection(String url)`\n* `getConnection(String\
    \ url, Properties prop)`\n* `getConnection(String url, String user, String password)`\n\
    \n这里的每个形式都需要一个数据库 `URL`。数据库 URL 是指向你数据库的地址。\n\n构建数据库 URL 是大多数与连接相关问题发生的地方。\n\n\
    下表列出了 MySQL JDBC 驱动程序名称和数据库 URL。\n\n| RDBMS | JDBC 驱动名称 | URL 格式 |\n| :--- | :---\
    \ | :--- |\n| MySQL | `com.mysql.jdbc.Driver` | `jdbc:mysql://hostname/ databaseName`\
    \ |\n\nURL 格式中所有高亮部分都是静态的，你只需要根据数据库设置更改剩余部分。\n\n## 创建连接对象\n\n我们已经列出了创建连接对象的 `DriverManager.getConnection()`\
    \ 方法的三种形式。\n\n## 使用带有用户名和密码的数据库 URL\n\n`getConnection()` 最常用的形式需要你传递数据库 URL、一个用户名\
    \ 和密码 ：\n\n由于你正在使用 MySQL 驱动程序，你将为 URL 的数据库部分指定 `host:port:databaseName` 值。\n\n\
    如果你有一个 TCP/IP 地址为 `192.0.0.1`、主机名为 `localhost` 的主机，且你的 MySQL 监听器配置为默认监听端口 `3306`，而你的数据库名称为\
    \ `TUTORIALSPOINT`，那么完整的数据库 URL 将是 ：\n\n`jdbc:mysql://localhost/TUTORIALSPOINT`\n\
    \n现在你必须使用相应的用户名和密码调用 `getConnection()` 方法来获取 `Connection` 对象，如下 ：\n\n```java\n\
    String URL =  \"jdbc:mysql://localhost/TUTORIALSPOINT\";\nString USER =  \"guest\"\
    ;\nString PASS =  \"password\";\nConnection conn =  DriverManager.getConnection(URL,\
    \ USER, PASS);\n```\n\n## 使用数据库 URL 和 Properties 对象\n\n第三种形式的 `DriverManager.getConnection(\
    \ )` 方法需要数据库 URL 和一个 `Properties` 对象 ：\n\n```java\nDriverManager.getConnection(String\
    \ url, Properties info);\n```\n\n`Properties` 对象持有一组键值对。它用于在调用 `getConnection()`\
    \ 方法期间将驱动属性传递给驱动程序。\n\n要建立与之前示例相同的连接，请使用以下代码 ：\n\n```java\nimport java.util.*;\n\
    String URL =  \"jdbc:mysql://localhost/TUTORIALSPOINT\";\nProperties info =  new\
    \  Properties(  );\ninfo.put(  \"user\",  \"guest\"  );\ninfo.put(  \"password\"\
    ,  \"guest123\"  );\nConnection conn =  DriverManager.getConnection(URL, info);\n\
    ```\n\n为了更好地理解，我们建议你学习我们的 [Java & MySQL - 代码教程](https://www.tutorialspoint.com/java_mysql/java_mysql_sample_code.htm)。\n\
    \n现在让我们按照如下方式编译上面的示例 ：\n\n```cmd\nC:\\>javac FirstExample.java\nC:\\>\n```\n\n\
    当你运行 `FirstExample` 时，它产生以下结果 ：\n\n```\nC:\\>java FirstExample\nID: 100, Age:\
    \ 18, First: Zara, Last: Ali\nID: 101, Age: 25, First: Mahnaz, Last: Fatma\nID:\
    \ 102, Age: 30, First: Zaid, Last: Khan\nID: 103, Age: 28, First: Sumit, Last:\
    \ Mittal\nC:\\>\n```\n\n# 异常处理\n\n异常处理允许你以受控的方式处理异常情况，如程序定义的错误。\n\n当异常情况发生时，会抛出一个异常。`thrown`（抛出）一词意味着当前程序的执行停止，控制被重定向到最近的可用\
    \ `catch` 子句。如果没有可用的 catch 子句，则程序的执行将结束。\n\nJDBC 异常处理与 Java 异常处理非常相似，但对于 JDBC\
    \ 来说，你处理的最常见异常是 `java.sql.SQLException`。\n\n## SQLException 方法\n\n`SQLException`\
    \ 可能同时发生在驱动程序和数据库中。当发生此类异常时，一个类型为 `SQLException` 的对象将传递给 `catch` 子句。\n\n传递的 `SQLException`\
    \ 对象具有以下方法用于获取有关异常的附加信息 ：\n\n| 方法 | 说明 |\n| :--- | :--- |\n| `getErrorCode()`\
    \ ) | 获取与异常相关的错误代码。 |\n| `getMessage()` ) | 获取 JDBC 驱动程序的错误消息（由驱动程序处理），或获取数据库错误对应的\
    \ Oracle 错误代码和消息。 |\n| `getSQLState()` ) | 获取 SQLState 字符串。 |\n| `getNextException()`\
    \ ) | 获取异常链中的下一个异常。 |\n| `printStackTrace()` ) | 将当前异常打印到标准错误。 |\n| `printStackTrace(PrintStream\
    \ s)` | 将此异常打印到指定的打印流。 |\n| `printStackTrace(PrintWriter w)` | 将此异常打印到指定的写入器。\
    \ |\n\n通过利用异常对象提供的可用信息，你可以捕获异常并适当继续程序。这里是 `try` 块的通用形式\n\n```java\ntry {\n   \
    \ // 风险代码在大括号之间\n} catch(Exception ex) {\n    // 异常处理代码在大括号之间\n} finally {\n \
    \   // 必须执行的代码在大括号之间。例如关闭数据库连接。\n}\n```\n\n## 示例\n\n学习以下代码以理解 `try...catch...finally`\
    \ 块的使用。此代码根据之前章节的环境和数据库设置编写。\n\n```java\nimport java.sql.CallableStatement;\n\
    import java.sql.Connection;\nimport java.sql.DriverManager;\nimport java.sql.SQLException;\n\
    \npublic class TestApplication {\n    static final String DB_URL = \"jdbc:mysql://localhost/TUTORIALSPOINT\"\
    ;\n    static final String USER = \"guest\";\n    static final String PASS = \"\
    guest123\";\n    static final String QUERY = \"{call getEmpName (?, ?)}\";\n\n\
    \    public static void main(String[] args) {\n        // 打开连接\n        try (Connection\
    \ conn = DriverManager.getConnection(DB_URL, USER, PASS);\n             CallableStatement\
    \ stmt = conn.prepareCall(QUERY)) {\n\n            // 将值绑定到参数上\n            stmt.setInt(1,\
    \ 1); // 这将设置 ID\n            // 因为第二个参数是 OUT，所以注册它\n            stmt.registerOutParameter(2,\
    \ java.sql.Types.VARCHAR);\n\n            // 使用 execute 方法运行存储过程\n           \
    \ System.out.println(\"Executing stored procedure...\");\n            stmt.execute();\n\
    \n            // 使用 getXXX 方法检索员工姓名\n            String empName = stmt.getString(2);\n\
    \            System.out.println(\"Emp Name with ID: 1 is \" + empName);\n\n  \
    \      } catch (SQLException e) {\n            e.printStackTrace();\n        }\n\
    \    }\n}\n```\n"
- fmt: "\nJDBC `Statement` interface defines the methods and properties to enable\
    \ send SQL commands to MySQL database and retrieve data from the database. `Statement`\
    \ is used for general-purpose access to your database. It is useful when you are\
    \ using static SQL statements at runtime. The `Statement` interface cannot accept\
    \ parameters.\n\nBefore you can use a `Statement` object to execute a SQL statement,\
    \ you need to create one using the `Connection` object's `createStatement()` method,\
    \ as in the following example:\n\n```java\nStatement stmt = null;\n\ntry {\n \
    \   stmt = conn.createStatement();\n    .  .  .\n} catch (SQLException e) {\n\
    \    .  .  .\n} finally {\n    .  .  .\n}\n```\n\nOnce you've created a `Statement`\
    \ object, you can then use it to execute an SQL statement with one of its three\
    \ execute methods.\n\n*   `boolean execute(String SQL)` — Returns a boolean value\
    \ of true if a `ResultSet` object can be retrieved; otherwise, it returns false.\
    \ Use this method to execute SQL DDL statements or when you need to use truly\
    \ dynamic SQL.\n*   `int executeUpdate(String SQL)` — Returns the number of rows\
    \ affected by the execution of the SQL statement. Use this method to execute SQL\
    \ statements for which you expect to get a number of rows affected - for example,\
    \ an `INSERT`, `UPDATE`, or `DELETE` statement.\n*   `ResultSet executeQuery(String\
    \ SQL)` — Returns a `ResultSet` object. Use this method when you expect to get\
    \ a result set, as you would with a `SELECT` statement.\n\n## Closing Statement\
    \ Object\n\nJust as you close a `Connection` object to save database resources,\
    \ for the same reason you should also close the `Statement` object.\n\nA simple\
    \ call to the `close()` method will do the job. If you close the `Connection`\
    \ object first, it will close the `Statement` object as well. However, you should\
    \ always explicitly close the `Statement` object to ensure proper cleanup.\n\n\
    ```java\nStatement stmt = null;\n\ntry {\n    stmt = conn.createStatement();\n\
    \    .  .  .\n} catch (SQLException e) {\n    .  .  .\n} finally {\n    stmt.close();\n\
    }\n```\n\nWe're using try with resources which handles the resource closure automatically.\
    \ Following example demonstrates all of the above said concepts.\n\nThis code\
    \ has been written based on the environment and database setup done in the previous\
    \ chapter.\n\nCopy and paste the following example in `TestApplication.java`,\
    \ compile and run as follows:\n\n```java\nimport java.sql.Connection;\nimport\
    \ java.sql.DriverManager;\nimport java.sql.ResultSet;\nimport java.sql.SQLException;\n\
    import java.sql.Statement;\n\npublic class TestApplication {\n    static final\
