    \ example as follows −\n\n```C:\\>javac TestApplication.java\nC:\\>\n```\n\nWhen\
    \ you run `TestApplication`, it produces the following result −\n\n```\nC:\\>java\
    \ TestApplication\nReturn value is : false\nRows impacted : 1\nID: 100, Age: 18,\
    \ First: Zara, Last: Ali\nID: 101, Age: 25, First: Mehnaz, Last: Fatma\nID: 102,\
    \ Age: 35, First: Zaid, Last: Khan\nID: 103, Age: 30, First: Sumit, Last: Mittal\n\
    C:\\>\n```\n\n# Callable Statement\n\nThe `CallableStatement` interface is used\
    \ to execute a call to a database stored procedure.\n\nSuppose, you need to execute\
    \ the following stored procedure in `TUTORIALSPOINT` database −\n\n```sql\nDELIMITER\
    \ $$\nDROP PROCEDURE IF EXISTS `TUTORIALSPOINT`.`getEmpName` $$\nCREATE PROCEDURE\
    \ `TUTORIALSPOINT`.`getEmpName`\n(IN EMP_ID INT, OUT EMP_FIRST VARCHAR(255))\n\
    BEGIN\nSELECT first INTO EMP_FIRST\nFROM Employees\nWHERE ID = EMP_ID;\nEND $$\n\
    DELIMITER ;\n```\n\nThree types of parameters exist − IN, OUT, and INOUT. The\
    \ `PreparedStatement` object only uses the `IN` parameter. The `CallableStatement`\
    \ object can use all the three.\n\nHere are the definitions of each −\n\n| Parameter\
    \ | Description |\n| :--- | :--- |\n| IN | A parameter whose value is unknown\
    \ when the SQL statement is created. You bind values to IN parameters with the\
    \ `setXXX()` methods. |\n| OUT | A parameter whose value is supplied by the SQL\
    \ statement it returns. You retrieve values from the `OUT` parameters with the\
    \ `getXXX()` methods. |\n| INOUT | A parameter that provides both input and output\
    \ values. You bind variables with the `setXXX()` methods and retrieve values with\
    \ the `getXXX()` methods. |\n\nThe following code snippet shows how to employ\
    \ the `Connection.prepareCall()` method to instantiate a `CallableStatement` object\
    \ based on the preceding stored procedure −\n\n```java\nCallableStatement cstmt\
    \ = null;\ntry {\n    String SQL = \"{call getEmpName (?, ?)}\";\n    cstmt =\
    \ conn.prepareCall(SQL);\n    // . . .\n} catch (SQLException e) {\n    // . .\
    \ .\n} finally {\n    // . . .\n}\n```\n\nThe `String` variable `SQL`, represents\
    \ the stored procedure, with parameter placeholders.\n\nUsing the `CallableStatement`\
    \ objects is much like using the `PreparedStatement` objects. You must bind values\
    \ to all the parameters before executing the statement, or you will receive an\
    \ `SQLException`.\n\nIf you have `IN` parameters, just follow the same rules and\
    \ techniques that apply to a `PreparedStatement` object; use the `setXXX()` method\
    \ that corresponds to the Java data type you are binding.\n\nWhen you use `OUT`\
    \ and `INOUT` parameters you must employ an additional `CallableStatement` method,\
    \ `registerOutParameter()`. The `registerOutParameter()` method binds the JDBC\
    \ data type, to the data type that the stored procedure is expected to return.\n\
    \nOnce you call your stored procedure, you retrieve the value from the `OUT` parameter\
    \ with the appropriate `getXXX()` method. This method casts the retrieved value\
    \ of SQL type to a Java data type.\n\n## Closing CallableStatement Object\n\n\
    Just as you close other `Statement` object, for the same reason you should also\
    \ close the `CallableStatement` object.\n\nA simple call to the `close()` method\
