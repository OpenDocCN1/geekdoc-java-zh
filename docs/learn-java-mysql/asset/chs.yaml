  \ SQL 语句在执行完成后都会提交到数据库。\n\n这对于简单的应用程序可能没问题，但有三个原因使你可能想要关闭自动提交并管理自己的事务 −\n\n*   为了提高性能。\n\
  *   为了维护业务流程的完整性。\n*   为了使用分布式事务。\n\n事务允许你控制何时以及何时何时应用到数据库。它将单个 SQL 语句或一组 SQL 语句视为一个逻辑单元，如果任何语句失败，整个事务都将失败。\n\
  \n要启用手动事务支持而不是使用 JDBC 驱动程序默认的自动提交模式，请使用 `Connection` 对象的 `setAutoCommit()` 方法。 如果你向\
  \ `setAutoCommit()` 传递布尔值 `false`，则关闭自动提交。你可以传递布尔值 `true` 来重新开启。\n\n例如，如果你有一个名为\
  \ `conn` 的 `Connection` 对象，编写以下代码来关闭自动提交 −\n\n```java\nconn.setAutoCommit(false);\n\
  ```\n\n### 提交与回滚 (Commit & Rollback)\n\n一旦你完成了更改并想要提交这些更改，请如下所示在连接对象上调用 `commit()`\
  \ 方法 −\n\n```java\nconn.commit();\n```\n\n否则，要回滚使用名为 `conn` 的连接对数据库进行的更新，请使用以下代码\
  \ −\n\n```java\nconn.rollback();\n```\n\n### 使用保存点 (Using Savepoints)\n\n新的 JDBC\
  \ 3.0 `Savepoint` 接口为你提供了额外的事务控制。\n\n当你设置一个保存点时，你在事务内部定义了一个逻辑回滚点。如果从保存点之后发生错误，你可以使用\
  \ `rollback` 方法撤销所有更改，或仅撤销在该保存点之后的更改。\n\n`Connection` 对象有两个新方法可以帮助你管理保存点 −\n\n*\
  \   `setSavepoint(String savepointName)` − 定义一个新的保存点。它还会返回一个 `Savepoint` 对象。\n*\
  \   `releaseSavepoint(Savepoint savepointName)` — 删除一个保存点。注意它需要一个 `Savepoint` 对象作为参数。该对象通常是由\
  \ `setSavepoint()` 方法生成的保存点。\n\n有一个 `rollback(String savepointName)` 方法，它可以回滚到指定的保存点。\n\
  \n\n\n\n\n```java\ne.printStackTrace();\n} finally {\n    // finally 块用于关闭资源\n \
  \   try {\n        if (stmt != null)\n            stmt.close();\n    } catch (SQLException\
  \ se2) {\n        se2.printStackTrace();\n    }\n    try {\n        if (conn !=\
  \ null)\n            conn.close();\n    } catch (SQLException se) {\n        se.printStackTrace();\n\
  \    }\n}\n}\n```\n\n现在让我们按照如下方式编译上面的示例 −\n\n```bash\nC:\\>javac TestApplication.java\n\
  C:\\>\n```\n\n当你运行 `TestApplication` 时，它会产生以下结果 −\n\n```bash\nC:\\>java TestApplication\n\
  正在连接数据库...\n创建语句...\n正在插入一行....\n在此提交数据....\n列出结果集以参考....\nID: 1, Age: 23, First:\
