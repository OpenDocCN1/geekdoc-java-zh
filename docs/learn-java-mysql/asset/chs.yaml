  \ 方法中包含冗余/碎片逻辑；我保留了源文本提供的核心结构。）*\n\n\n\n\n\n### 使用 PrepareStatement 对象进行批量处理\n\n\
  以下是使用 PrepareStatement 对象进行批量处理的典型步骤：\n\n- 创建带有占位符的 SQL 语句。\n- 使用 `prepareStatement()`\
  \ 方法创建 `PreparedStatement` 对象。\n- 使用 `setAutoCommit()` 将自动提交设置为 `false`。\n- 使用创建的语句对象上的\
  \ `addBatch()` 方法将任意数量的 SQL 语句添加到批处理中。\n- 使用创建的语句对象上的 `executeBatch()` 方法执行所有 SQL\
  \ 语句。\n- 最后，使用 `commit()` 方法提交所有更改。\n\n下面的代码段提供了一个使用 `PreparedStatement` 对象进行批量更新的示例：\n\
  \n```java\n// Create SQL statement\nString SQL = \"INSERT INTO Employees (id, first,\
  \ last, age) VALUES(?, ?, ?, ?)\";\n\n// Create PrepareStatement object\nPreparedStatement\
  \ pstmt = conn.prepareStatement(SQL);\n\n// Set auto-commit to false\nconn.setAutoCommit(false);\n\
  \n// Set the variables\npstmt.setInt(1, 400);\npstmt.setString(2, \"Pappu\");\n\
  pstmt.setString(3, \"Singh\");\npstmt.setInt(4, 33);\n// Add it to the batch\npstmt.addBatch();\n\
  \n// Set the variables\npstmt.setInt(1, 401);\npstmt.setString(2, \"Pawan\");\n\
  pstmt.setString(3, \"Singh\");\npstmt.setInt(4, 31);\n// Add it to the batch\npstmt.addBatch();\n\
  \n// Create an int[] to hold returned values\nint[] count = stmt.executeBatch();\n\
  \n// Explicitly commit statements to apply changes\nconn.commit();\n```\n\n### 使用\
  \ Statement 对象进行批量处理\n\n以下是使用 Statement 对象进行批量处理的典型步骤：\n\n- 使用 `createStatement()`\
  \ 方法创建 `Statement` 对象。\n- 使用 `setAutoCommit()` 将自动提交设置为 `false`。\n- 使用创建的语句对象上的\
  \ `addBatch()` 方法将任意数量的 SQL 语句添加到批处理中。\n- 使用创建的语句对象上的 `executeBatch()` 方法执行所有 SQL\
  \ 语句。\n- 最后，使用 `commit()` 方法提交所有更改。\n\n此示例代码是根据前面章节中完成的环境和数据库设置编写的。将以下示例复制并粘贴到 `TestApplication.java`\
  \ 中，按照如下方式编译并运行：\n\n```java\nimport java.sql.Connection;\nimport java.sql.DriverManager;\n\
