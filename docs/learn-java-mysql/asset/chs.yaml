  \ + rs.getInt(\"id\"));\n                System.out.print(\", Age: \" + rs.getInt(\"\
  age\"));\n                System.out.print(\", First: \" + rs.getString(\"first\"\
  ));\n                System.out.println(\", Last: \" + rs.getString(\"last\"));\n\
  \            }\n            rs.close();\n        } catch (SQLException e) {\n  \
  \          e.printStackTrace();\n        }\n    }\n}\n```\n\n现在让我们按照如下方式编译示例 −\n\
  \n```bash\nC:\\>javac TestApplication.java\nC:\\>\n```\n\n当运行 `TestApplication`\
  \ 时，它产生如下结果 −\n\n```bash\nC:\\>java TestApplication\nID: 100, Age: 30, First: Zara,\
  \ Last: Ali\nID: 102, Age: 30, First: Zaid, Last: Khan\nID: 103, Age: 28, First:\
  \ Sumit, Last: Mittal\nC:\\>\n```\n\n## WHERE 子句示例\n\n本章提供了一个使用 JDBC 应用程序从表中选择记录的示例。这将在从表中选择记录时使用\
  \ `WHERE` 子句添加额外的条件。在执行以下示例之前，请确保你已具备以下条件 −\n\n- 在执行以下示例时，你可以将 `username` 和 `password`\
  \ 替换为你实际的用户名和密码。\n- 你正在使用的 MySQL 数据库已运行。\n\n## 必要的步骤\n\n使用 JDBC 应用程序创建新数据库需要执行以下步骤\
  \ −\n\n- **导入包** — 需要包含包含数据库编程所需的 JDBC 类的包。通常情况下，使用 `import java.sql.*` 即可。\n- **注册\
  \ JDBC 驱动程序** — 需要初始化驱动程序，以便你能够与数据库建立通信通道。\n- **打开连接** — 需要使用 `DriverManager.getConnection()`\
  \ 方法来创建一个 `Connection` 对象，该对象代表与数据库服务器的物理连接。\n- **执行查询** — 需要使用类型为 `Statement` 的对象来构建并提交\
  \ SQL 语句，以删除表中的记录。\n- **清理环境** — try-with-resources 会自动关闭资源。\n\n\n\n\n\n- **执行查询**\
  \ — 需要使用 `Statement` 类型的对象来构建并提交 SQL 语句，以便从表中获取符合给定条件的记录。此查询利用 `LIKE` 子句来选择所有名字以\
  \ \"za\" 开头的学生。\n- **清理环境** — 使用 try-with-resources 自动关闭资源。\n\n## 示例代码\n\n将以下示例复制并粘贴到\
  \ `TestApplication.java` 中，按照如下 own 进行编译和运行 —\n\n```java\nimport java.sql.Connection;\n\
  import java.sql.DriverManager;\nimport java.sql.ResultSet;\nimport java.sql.SQLException;\n\
  import java.sql.Statement;\n\npublic class TestApplication {\n    static final String\
  \ DB_URL = \"jdbc:mysql://localhost/TUTORIALSPOINT\";\n    static final String USER\
  \ = \"guest\";\n    static final String PASS = \"guest123\";\n    static final String\
  \ QUERY = \"SELECT id, first, last, age FROM Registration\";\n\n    public static\
  \ void main(String[] args) {\n        // 打开连接\n        try (Connection conn = DriverManager.getConnection(DB_URL,\
  \ USER, PASS);\n             Statement stmt = conn.createStatement()) {\n      \
  \      System.out.println(\"正在获取无条件的记录...\");\n            ResultSet rs = stmt.executeQuery(QUERY);\n\
  \            while (rs.next()) {\n                // 显示值\n                System.out.print(\"\
  ID: \" + rs.getInt(\"id\"));\n                System.out.print(\", Age: \" + rs.getInt(\"\
  age\"));\n                System.out.print(\", First: \" + rs.getString(\"first\"\
  ));\n                System.out.println(\", Last: \" + rs.getString(\"last\"));\n\
  \            }\n\n            // 选择 ID 等于或大于 101 的所有记录\n            System.out.println(\"\
  正在获取带条件的记录...\");\n            String sql = \"SELECT id, first, last, age FROM Registration\"\
  \ + \" WHERE first LIKE '%za%'\";\n            rs = stmt.executeQuery(sql);\n  \
  \          while (rs.next()) {\n                // 显示值\n                System.out.print(\"\
  ID: \" + rs.getInt(\"id\"));\n                System.out.print(\", Age: \" + rs.getInt(\"\
  age\"));\n                System.out.print(\", First: \" + rs.getString(\"first\"\
  ));\n                System.out.println(\", Last: \" + rs.getString(\"last\"));\n\
  \            }\n            rs.close();\n        } catch (SQLException e) {\n  \
  \          e.printStackTrace();\n        }\n    }\n}\n```\n\n现在让我们按照如下方式编译上述示例 —\n\
  \n```bash\nC:\\>javac TestApplication.java\nC:\\>\n```\n\n当运行 `TestApplication`\
  \ 时，会产生以下结果 —\n\n```bash\nC:\\>java TestApplication\n正在获取无条件的记录...\nID: 100, Age:\
  \ 30, First: Zara, Last: Ali\nID: 102, Age: 30, First: Zaid, Last: Khan\nID: 103,\
  \ Age: 28, First: Sumit, Last: Mittal\n正在获取带条件的记录...\nID: 100, Age: 30, First: Zara,\
  \ Last: Ali\nID: 102, Age: 30, First: Zaid, Last: Khan\nC:\\>\n```\n\n## 数据排序示例\n\
  \n本章提供了如何使用 JDBC 应用程序对表记录进行排序的示例。这将使用 `asc` 和 `desc` 关键字按升序或降序对记录进行排序。在执行以下示例之前，请确保已完成以下工作\
  \ —\n\n- 为了执行后续示例，你可以将 `username` 和 `password` 替换为你真实的用户名和密码。\n- 你正在使用的 MySQL 数据库已运行。\n\
  \n## 必要的步骤\n\n使用 JDBC 应用程序创建新数据库需要以下步骤 —\n\n- **导入包** — 需要包含包含数据库编程所需的 JDBC 类的包。通常情况下，使用\
  \ `import java.sql.*` 即可。\n- **打开连接** — 需要使用 `DriverManager.getConnection()` 方法创建一个\
  \ `Connection` 对象，该对象代表与数据库服务器的物理连接。\n- **执行查询** — 需要使用 `Statement` 类型的对象来构建并提交\
  \ SQL 语句，以便对表记录进行排序。这些查询利用 `asc` 和 `desc` 子句按升序和降序排列数据。\n- **清理环境** — 使用 try-with-resources\
  \ 自动关闭资源。\n\n## 示例代码\n\n将以下示例复制并粘贴到 `TestApplication.java` 中，按照如下方式进行编译和运行 —\n\n\
  ```java\nimport java.sql.Connection;\nimport java.sql.DriverManager;\nimport java.sql.ResultSet;\n\
  import java.sql.SQLException;\nimport java.sql.Statement;\n\npublic class TestApplication\
  \ {\n    static final String DB_URL = \"jdbc:mysql://localhost/TUTORIALSPOINT\"\
  ;\n    static final String USER = \"guest\";\n    static final String PASS = \"\
  guest123\";\n    static final String QUERY = \"SELECT id, first, last, age FROM\
  \ Registration\";\n\n    public static void main(String[] args) {\n        // 打开连接\n\
  \        try (Connection conn = DriverManager.getConnection(DB_URL, USER, PASS);\n\
  \             Statement stmt = conn.createStatement()) {\n            System.out.println(\"\
  正在按升序获取记录...\");\n            ResultSet rs = stmt.executeQuery(QUERY + \" ORDER\
  \ BY ASC\");\n            while (rs.next()) {\n                // 显示值\n        \
  \        System.out.print(\"ID: \" + rs.getInt(\"id\"));\n                System.out.print(\"\
  , Age: \" + rs.getInt(\"age\"));\n                System.out.print(\", First: \"\
  \ + rs.getString(\"first\"));\n                System.out.println(\", Last: \" +\
  \ rs.getString(\"last\"));\n            }\n\n            System.out.println(\"正在按降序获取记录...\"\
  );\n            rs = stmt.executeQuery(QUERY + \" ORDER BY DESC\");\n          \
  \  while (rs.next()) {\n                // 显示值\n                System.out.print(\"\
  ID: \" + rs.getInt(\"id\"));\n                System.out.print(\", Age: \" + rs.getInt(\"\
  age\"));\n                System.out.print(\", First: \" + rs.getString(\"first\"\
  ));\n                System.out.println(\", Last: \" + rs.getString(\"last\"));\n\
  \            }\n            rs.close();\n        } catch (SQLException e) {\n  \
  \          e.printStackTrace();\n        }\n    }\n}\n```\n\n"
