  \ Employees\";\n    static final String UPDATE_QUERY = \"UPDATE Employees set age=?\
  \ WHERE id=?\";\n\n    public static void main(String[] args) {\n        // 打开连接\n\
  \        try(Connection conn = DriverManager.getConnection(DB_URL, USER, PASS);\n\
  \             PreparedStatement stmt = conn.prepareStatement(UPDATE_QUERY);\n  \
  \      ) {\n            // 将值绑定到参数中。\n            stmt.setInt(1, 35); // 这设置年龄\n\
  \            stmt.setInt(2, 102); // 这设置 ID\n\n            // 让我们更新 ID = 102 的记录的年龄；\n\
  \            int rows = stmt.executeUpdate();\n            System.out.println(\"\
  Rows impacted : \" + rows);\n\n            // 让我们选择所有记录并显示。\n            ResultSet\
  \ rs = stmt.executeQuery(QUERY);\n\n            // 从结果集中提取数据\n            while\
  \ (rs.next()) {\n                // 通过列名检索\n                System.out.print(\"\
  ID: \" + rs.getInt(\"id\"));\n                System.out.print(\", Age: \" + rs.getInt(\"\
  age\"));\n                System.out.print(\", First: \" + rs.getString(\"first\"\
  ));\n                System.out.println(\", Last: \" + rs.getString(\"last\"));\n\
  \            }\n            rs.close();\n        } catch (SQLException e) {\n  \
  \          e.printStackTrace();\n        }\n    }\n}\n```\n\n\n\n\n\n```java\ne.printStackTrace();\n\
  }\n\n}\n```\n\n现在让我们按照如下方式编译上述示例 −\n\n```C:\\>javac TestApplication.java\nC:\\>\n\
  ```\n\n当你运行 `TestApplication` 时，它会产生以下结果 −\n\n```\nC:\\>java TestApplication\nReturn\
  \ value is : false\nRows impacted : 1\nID: 100, Age: 18, First: Zara, Last: Ali\n\
  ID: 101, Age: 25, First: Mehnaz, Last: Fatma\nID: 102, Age: 35, First: Zaid, Last:\
  \ Khan\nID: 103, Age: 30, First: Sumit, Last: Mittal\nC:\\>\n```\n\n## Callable\
  \ Statement\n\n`CallableStatement` 接口用于执行对数据库存储过程的调用。\n\n假设你需要在 `TUTORIALSPOINT`\
  \ 数据库中执行以下存储过程 −\n\n```sql\nDELIMITER $$\nDROP PROCEDURE IF EXISTS `TUTORIALSPOINT`.`getEmpName`\
  \ $$\nCREATE PROCEDURE `TUTORIALSPOINT`.`getEmpName`\n(IN EMP_ID INT, OUT EMP_FIRST\
  \ VARCHAR(255))\nBEGIN\nSELECT first INTO EMP_FIRST\nFROM Employees\nWHERE ID =\
  \ EMP_ID;\nEND $$\nDELIMITER ;\n```\n\n存在三种类型的参数：IN、OUT 和 INOUT。`PreparedStatement`\
  \ 对象只使用 `IN` 参数。而 `CallableStatement` 对象可以使用所有三种。\n\n以下是它们的定义 −\n\n\n\n| 参数 | 描述\
  \ |\n| :--- | :--- |\n| IN | 在创建 SQL 语句时值未知的参数。使用 `setXXX()` 方法将值绑定到 IN 参数。 |\n\
  | OUT | 值由其返回的 SQL 语句提供的参数。使用 `getXXX()` 方法从 `OUT` 参数中检索值。 |\n| INOUT | 同时提供输入和输出值的参数。使用\
  \ `setXXX()` 方法绑定变量并使用 `getXXX()` 方法检索值。 |\n\n接下来的代码段显示了如何使用 `Connection.prepareCall()`\
  \ 方法根据前述存储过程实例化 `CallableStatement` 对象 −\n\n```java\nCallableStatement cstmt = null;\n\
  try {\n    String SQL = \"{call getEmpName (?, ?)}\";\n    cstmt = conn.prepareCall(SQL);\n\
  \    // . . .\n} catch (SQLException e) {\n    // . . .\n} finally {\n    // . .\
  \ .\n}\n```\n\n`String` 变量 `SQL` 代表带有参数占位符的存储过程。\n\n使用 `CallableStatement` 对象与使用\
  \ `PreparedStatement` 对象非常相似。你必须在执行语句之前为所有参数绑定值，否则你将收到 `SQLException`。\n\n如果你有 `IN`\
  \ 参数，只需遵循适用于 `PreparedStatement` 对象的规则和技术；使用与你正在绑定的 Java 数据类型对应的 `setXXX()` 方法。\n\
  \n当你使用 `OUT` 和 `INOUT` 参数时，必须使用额外的 `CallableStatement` 方法 `registerOutParameter()`。`registerOutParameter()`\
  \ 方法将 JDBC 数据类型绑定到存储过程预期返回的数据类型。\n\n一旦你调用了存储过程，就可以使用适当的 `getXXX()` 方法从 `OUT` 参数中检索值。该方法将检索到的\
  \ SQL 类型值转换为 Java 数据类型。\n\n## 关闭 CallableStatement 对象\n\n就像关闭其他 `Statement` 对象一样，出于相同的原因，你也应该关闭\
  \ `CallableStatement` 对象。\n\n只需调用 `close()` 方法即可完成工作。如果你先关闭 `Connection` 对象，它也会关闭\
  \ `CallableStatement` 对象。然而，你应该始终显式关闭 `CallableStatement` 对象以确保适当的清理。\n\n```java\n\
  CallableStatement cstmt = null;\ntry {\n    String SQL = \"{call getEmpName (?,\
  \ ?)}\";\n    cstmt = conn.prepareCall(SQL);\n    // . . .\n} catch (SQLException\
  \ e) {\n    // . . .\n} finally {\n    cstmt.close();\n}\n```\n\n我们正在使用 try-with-resources，它会自动处理资源的关闭。下面的示例演示了上述所有的概念。\n\
  \n这段代码是根据上一章中完成的环境和数据库设置编写的。\n\n将以下示例复制并粘贴到 `TestApplication.java` 中，并如下方式编译和运行\
  \ −\n\n```java\nimport java.sql.CallableStatement;\nimport java.sql.Connection;\n\
  import java.sql.DriverManager;\nimport java.sql.SQLException;\n\npublic class TestApplication\
  \ {\n    static final String DB_URL = \"jdbc:mysql://localhost/TUTORIALSPOINT\"\
  ;\n    static final String USER = \"guest\";\n    static final String PASS = \"\
  guest123\";\n    static final String QUERY = \"{call getEmpName (?, ?)}\";\n\n \
  \   public static void main(String[] args) {\n        // 打开一个连接\n        try (Connection\
  \ conn = DriverManager.getConnection(DB_URL, USER, PASS);\n             CallableStatement\
  \ stmt = conn.prepareCall(QUERY)\n        ) {\n            // 将值绑定到参数。\n       \
  \     stmt.setInt(1, 102); // 这将设置 ID\n            // 因为第二个参数是 OUT，所以注册它\n     \
  \       stmt.registerOutParameter(2, java.sql.Types.VARCHAR);\n            // 使用\
  \ execute 方法运行存储过程。\n            System.out.println(\"Executing stored procedure...\"\
  );\n            stmt.execute();\n            // 使用 getXXX 方法检索员工姓名\n           \
  \ String empName = stmt.getString(2);\n            System.out.println(\"Emp Name\
  \ with ID: 102 is \" + empName);\n        } catch (SQLException e) {\n         \
  \   e.printStackTrace();\n        }\n    }\n}\n```\n\n\n\n\n从数据库查询中读取数据的 SQL 语句会将数据返回到结果集中。`SELECT`\
  \ 语句是从数据库中选择行并在结果集中查看它们的标准方法。`java.sql.ResultSet` 接口表示数据库查询的结果集。\n\n`ResultSet`\
  \ 对象维护一个指向结果集中当前行的游标。“结果集”（result set）一术语指的是包含在 `ResultSet` 对象中的行数据和列数据。\n\n`ResultSet`\
  \ 接口的方法可以分为三类 −\n\n- **导航方法 (Navigational methods)** − 用于移动游标。\n- **获取方法 (Get methods)**\
  \ − 用于查看游标所指向的当前行列中的数据。\n- **更新方法 (Update methods)** − 用于更新当前行列中的数据。这些更新也可以同步到底层数据库中。\n\
  \n游标可以根据 `ResultSet` 的属性进行移动。这些属性在创建生成 `ResultSet` 的相应 `Statement` 时指定。\n\nJDBC\
  \ 提供了以下连接方法来创建带有所需 `ResultSet` 的语句 −\n\n- `createStatement(int RSType, int RSConcurrency);`\n\
  - `prepareStatement(String SQL, int RSType, int RSConcurrency);`\n- `prepareCall(String\
  \ sql, int RSType, int RSConcurrency);`\n\n第一个参数表示 `ResultSet` 对象的类型，第二个参数是两个 `ResultSet`\
  \ 常量之一，用于指定结果集是只读的还是可更新的。\n\n## ResultSet 的类型\n\n可能的 `RSType` 如下所示。如果你不指定任何 `ResultSet`\
  \ 类型，将自动获得一个为 `TYPE_FORWARD_ONLY` 的类型。\n\n| 类型 | 描述 |\n| :--- | :--- |\n| `ResultSet.TYPE_FORWARD_ONLY`\
  \ | 游标只能在结果集中向前移动。 |\n| `ResultSet.TYPE_SCROLL_INSENSITIVE` | 游标可以向前向后滚动，且结果集对结果集创建后其他人对数据库所做的更改不敏感。\
  \ |\n| `ResultSet.TYPE_SCROLL_SENSITIVE` | 游标可以向前向后滚动，且结果集对结果集创建后其他人对数据库所做的更改敏感。\
  \ |\n\n## ResultSet 的并发性\n\n可能的 `RSConcurrency` 如下所示。如果你不指定任何并发类型，将自动获得一个为 `CONCUR_READ_ONLY`\
  \ 的类型。\n\n| 并发性 | 描述 |\n| :--- | :--- |\n| `ResultSet.CONCUR_READ_ONLY` | 创建只读的结果集。这是默认值。\
  \ |\n| `ResultSet.CONCUR_UPDATABLE` | 创建可更新的结果集。 |\n\n我们目前为止编写的所有示例都可以写如下所示，它初始化了一个\
  \ `Statement` 对象来创建一个单向的、只读的 `ResultSet` 对象 −\n\n```java\ntry(\n    Statement stmt\
  \ = conn.createStatement(\n        ResultSet.TYPE_FORWARD_ONLY,\n        ResultSet.CONCUR_READ_ONLY);)\n\
  } catch(Exception ex) {\n    ....\n} finally {\n    ....\n}\n```\n\n## 导航结果集\n\n\
  `ResultSet` 接口中有几个方法涉及移动游标，包括 −\n\n| 序号 | 方法与描述 |\n| :--- | :--- |\n| 1 | `public\
  \ void beforeFirst() throws SQLException` 将游标移动到第一行之前。 |\n| 2 | `public void afterLast()\
  \ throws SQLException` 将游标移动到最后一行之后。 |\n| 3 | `public boolean first() throws SQLException`\
  \ 将游标移动到第一行。 |\n| 4 | `public void last() throws SQLException` 将游标移动到最后一行。 |\n|\
  \ 5 | `public boolean absolute(int row) throws SQLException` 将游标移动到指定的行。 |\n| 6\
  \ | `public boolean relative(int row) throws SQLException` 将游标从当前指向的位置向前或向后移动指定的行数。\
  \ |\n| 7 | `public boolean previous() throws SQLException` 将游标移动到上一行。如果上一行不在结果集中，则返回\
  \ false。 |\n| 8 | `public boolean next() throws SQLException` 将游标移动到下一行。如果结果集中没有更多行，则返回\
  \ false。 |\n| 9 | `public int getRow() throws SQLException` 返回游标所指向的行号。 |\n| 10\
  \ | `public void moveToInsertRow() throws SQLException` 将游标移动到结果集中的一个特殊行，该行可用于向数据库插入新行。会记住当前的游标位置。\
  \ |\n| 11 | `public void moveToCurrentRow() throws SQLException` 如果游标当前位于插入行，则将游标移回当前行；否则，此方法不执行任何操作\
  \ |\n\n下面是使用了上述几个导航方法的示例。\n\n此示例代码是根据之前章节中完成的环境和数据库设置编写的。\n\n将以下示例复制并粘贴到 `TestApplication.java`\
  \ 中，并如下方式编译和运行 −\n\n```java\nimport java.sql.Connection;\nimport java.sql.DriverManager;\n\
  import java.sql.ResultSet;\nimport java.sql.SQLException;\nimport java.sql.Statement;\n\
