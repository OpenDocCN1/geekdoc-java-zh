  \ Statement\n\n`PreparedStatement` 接口扩展了 `Statement` 接口，这为你提供了额外的功能，并且与通用 `Statement`\
  \ 对象相比有一些优势。\n\n该语句提供了动态提供参数的灵活性。\n\n## 创建 PreparedStatement 对象\n\n```java\nPreparedStatement\
  \ pstmt = null;\n\ntry {\n    String SQL = \"Update Employees SET age = ? WHERE\
  \ id = ?\";\n    pstmt = conn.prepareStatement(SQL);\n    .  .  .\n} catch (SQLException\
  \ e) {\n    .  .  .\n} finally {\n    .  .  .\n}\n```\n\n所有的 `PreparedStatement`\
  \ 都由 `?` 符号表示。如果你在执行语句之前忘记提供值将会收到 `SQLException`。每个参数通过其顺序位置进行引用。第一个标记从 1 开始，下一个是\
  \ 2，依此类推。`PreparedStatement` 方法与 `Statement` 对象的方法不同，(a) `execute()`、(b) `executeQuery()`\
  \ 和 (c) `executeUpdate()` 也适用于 `PreparedStatement`。但是，这些方法被修改为使用 SQL 语句。\n\n```java\n\
  import java.sql.Connection;\nimport java.sql.DriverManager;\nimport java.sql.PreparedStatement;\n\
  import java.sql.ResultSet;\nimport java.sql.SQLException;\n\npublic class TestApplication\
  \ {\n    static final String DB_URL = \"jdbc:mysql://localhost/TUTORIALSPOINT\"\
  ;\n    static final String USER = \"guest\";\n    static final String PASS = \"\
