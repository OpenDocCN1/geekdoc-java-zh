- "# Java MySQL 入门指南\n\n\n\n![](img/cover00184.jpeg)\n\n版权所有 版权所有\n\n未经出版者明确书面许可，本书的任何部分不得复制、存储在检索系统中，或以任何形式或通过任何电子、机械、复印、录制或其他方式进行传输。\n\
  \n我想将此书献给将使用它的学生们。祝愿你们未来事业成功，希望你们永不停止学习。\n\n# 目录\n\n- 概述\n- 环境搭建\n- 示例代码\n- 连接\n\
  - 异常处理\n- 语句\n- 预编译语句\n- 可调用语句\n- 结果集\n- 结果结果集\n- 查看结果集\n- 更新结果集\n- 事务\n- 提交与回滚\n\
  - 保存点\n- 批量处理\n- 使用 Statement 对象进行批量处理\n- 使用 Prepare Statement 对象进行批量处理\n- 数据流传输\n\
  - 创建数据库示例\n- 选择数据库示例\n- 删除数据库示例\n- 创建表示例\n- 删除表示例\n- 插入记录示例\n- 查询记录示例\n- 更新记录示例\n\
  - 删除记录示例\n- WHERE 子句示例\n- LIKE 子句示例\n- 数据排序示例\n\n# 概述\n\nJDBC 代表 Java Database Connectivity（Java\
  \ 连接），它是一种标准的 Java API，用于 Java 编程语言与各种数据库之间与数据库无关的连接。\n\nJDBC 库包含了用于下述与数据库使用相关的常见任务的\
  \ API：\n\n* 建立数据库连接。\n* 创建 SQL 或 MySQL 语句。\n* 在数据库中执行 SQL 或 MySQL 查询。\n* 查看和修改结果记录。\n\
  \n从根本上说，JDBC 是一种规范，它提供了一套完整的接口，允许对底层数据库进行可移植访问。Java 可编写不同类型的可执行文件，例如：\n\n* Java\
  \ \n* Java Applets\n* Java Servlets\n* Java ServerPages (JSPs)\n* 企业级 JavaBeans\
  \ (EJBs)。\n\n所有这些不同的可执行文件都能使用 JDBC 驱动程序访问数据库并利用存储的数据。JDBC 提供了与 ODBC 相同的功能，允许 Java\
  \ 程序包含与数据库无关的代码。\n\n## 先决条件\n\n在继续之前，您需要对以下两个主题有良好的理解：\n\n* [Java 核心编程](https://www.tutorialspoint.com/java/index.htm)\n\
  * [SQL 或 MySQL 数据库](https://www.tutorialspoint.com/mysql/index.htm)\n\n## JDBC 架构\n\
  \nJDBC API 支持数据库访问的双层和三层处理模型，但通常情况下，JDBC 架构由两层组成：\n\n* **JDBC API**: 为应用程序提供接口。\n\
  * **JDBC 驱动程序**: 处理与数据库的通信。\n\nJDBC API 支持数据库访问的双层和三层处理模型，但通常情况下，JDBC 架构由两层组成：\n\
  \n* **JDBC API**: 为应用程序提供接口。\n* **JDBC 驱动程序**: 处理与数据库的通信。\n\nJDBC API 支持数据库访问的双层和三层处理模型，但通常情况下，JDBC\
  \ 架构由两层组成：\n\n* **JDBC API**: 为应用程序提供接口。\n* **JDBC 驱动程序**: 处理与数据库的通信。\n\nJDBC API\
  \ 支持数据库访问的双层和三层处理模型，但通常情况下，JDBC 架构由两层组成：\n\n* **JDBC API**: 为应用程序提供接口。\n* **JDBC\
  \ 驱动程序**: 处理与数据库的通信。\n\nJDBC API 支持数据库访问的双层和三层处理模型，但通常情况下，JDBC 架构由两层组成：\n\n* **JDBC\
  \ API**: 为应用程序提供接口。\n* **JDBC 驱动程序**: 处理与数据库的通信。\n\nJDBC API 支持数据库访问的双层和三层处理模型，但通常情况下，JDBC\
  \ 架构由两层组成：\n\n* **JDBC API**: 为应用程序提供接口。\n* **JDBC 驱动程序**: 处理与数据库的通信。\n\nJDBC API\
  \ 支持数据库访问的双层和三层处理模型，但通常情况下，JDBC 架构由两层组成：\n\n* **JDBC API**: 为应用程序提供接口。\n* **JDBC\
  \ 驱动程序。\n\n## 通用组件\n\nJDBC API 提供了以下接口：\n\n* `DriverManager`: 管理驱动程序列表。\n* `Driver`:\
  \ 驱动程序连接到特定数据存储的接口。\n* `Connection`: 表示数据库会话。\n* `Statement`: 用于向数据库提交查询。\n* `ResultSet`:\
  \ 存储从查询检索的数据。\n* `SQLException`: 处理数据库访问过程中发生的错误。\n\n## JDBC 4.0 包\n\n`java.sql`\
  \ 和 `javax.sql` 是 JDBC 4.0 的主要包。这是编写时的最新版本。这些包的功能包括：\n\n* 自动驱动加载。\n* 异常处理改进。\n*\
  \ 增强的 BLOB/CLOB 功能。\n* 连接和语句接口增强。\n* 国家字符集支持。\n* SQLID 访问。\n* SQL 2003 数据类型支持。\n\
  * 注解。\n\n# 环境搭建\n\n要开始使用 JDBC，请按照以下步骤设置 JDBC 环境。我们假设你在 Windows 平台上。\n\n## 安装 Java\n\
  \nJava SE 可免费下载。要下载，请[点击此处](https://www.oracle.com/technetwork/java/downloads/jdk9-downloads-3848520.html)，下载与操作系统兼容的版本。\n\
  \n按照说明下载 Java 并运行 `.exe` 在你的机器上安装 Java。安装 Java 后，你需要设置环境变量指向安装目录。\n\n### 为 Windows\
  \ 2000/XP 设置路径\n\n假设你将 Java 安装在 `C:\\Program Files\\java\\jdk` 目录：\n\n* 右键点击“计算机”，选择“属性”。\n\
  * 点击“高级”选项卡下的“环境变量”按钮。\n* 现在，编辑 `Path` 变量并将 Java 可执行目录路径添加到末尾。例如，如果当前设置为 `C:\\Windows\\\
  System32`，则按如下编辑：\n\n`C:\\Windows\\System32;C:\\Program Files\\java\\jdk\\bin`\n\
  \n### 为 Windows 95/98/ME 设置路径\n\n假设你将 Java 安装在 `C:\\Program Files\\java\\jdk` 目录：\n\
  \n* 编辑 `C:\\autoexec.bat` 文件，在末尾添加以下行：\n\n`SET PATH = %PATH%;C:\\Program Files\\\
  java\\jdk\\bin`\n\n### 为 Linux, UNIX, Solaris, FreeBSD 设置路径\n\n环境变量 `PATH` 应该设置为\
  \ Java 二进制文件安装位置。如果你在执行此操作遇到困难，请参考你的 shell 文档。\n\n\n\n\n\n例如，如果你使用 `bash` 作为你的 shell，那么你需要在\
  \ `.bashrc` 文件的末尾添加以下行——\n\n```bash\nexport PATH = /path/to/java:$PATH'\n```\n\n\
  当你安装 J2SE 开发工具包时，会自动获得两个 JDBC 软件包 `java.sql` 和 `javax.sql,`。\n\n## 安装数据库\n当然，你需要的最重要的东西是一个实际运行的数据库，并且其中包含一个你可以进行查询和修改的表。\n\
  \n安装一个最适合你的数据库。你有很多选择，最常见的有——\n\n*   `MySQL DB` — `MySQL` 是一个开源数据库。你可以从 [MySQL 官方网站](https://dev.mysql.com/downloads/mysql)\
  \ 下载它。我们建议下载完整的 Windows 安装包。\n*   此外，请下载并安装 [MySQL Administrator](https://dev.mysql.com/downloads/gui-tools/)\
  \ 以及 [MySQL Query Browser.](https://dev.mysql.com/downloads/gui-tools/)。这些是基于图形界面的工具，会让你的开发变得简单得多。\n\
  *   最后，在方便的目录下下载并解压 [MySQL Connector/J](https://dev.mysql.com/downloads/connector/j/3.1.html)（MySQL\
  \ JDBC 驱动程序）。为了本教程，我们假设你已将驱动安装在 `C:\\Program Files\\MySQL\\mysql-connector-java-5.1.8`。\n\
  *   相应地，将 `CLASSPATH` 变量设置为 `C:\\Program Files\\MySQL\\mysql-connector-java-5.1.8\\\
  mysql-connector-java-5.1.8-bin.jar`。你的驱动版本可能会根据安装情况而异。\n\n## 设置数据库凭\n当我们安装 MySQL\
  \ 数据库时，其管理员 ID 被设置为 `root`，并允许设置自定义的密码。\n\n使用 `root` ID 和密码，你可以创建另一个用户 ID 和密码，也可以在你的\
  \ JDBC 应用中使用 `root` ID 和密码。\n\n有许多数据库操作（如创建和删除数据库都需要管理员 ID 和密码。\n\n在 JDBC 教程的剩余部分，我们将使用\
  \ ID 为 `guest`、`guest123` 为密码的 MySQL 数据库。\n\n如果你没有足够的权限创建新用户，可以请求你的数据库管理员 (DBA)\
  \ 为你创建一个用户 ID 和密码。\n\n## 创建数据库\n要创建 `TUTORIALSPOINT` 数据库，请使用以下步骤——\n\n### 第 1 步\n\
  打开`命令提示符` 并如下如下切换到安装目录——\n\n```cmd\nC:\\>\nC:\\>cd Program Files\\MySQL\\bin\nC:\\\
  Program Files\\MySQL\\bin>\n```\n**注意** — `mysqld.exe` 的路径可能会根据 MySQL 在系统上的安装位置而不同。你也可以查看关于如何启动和停止数据库服务器的文档。\n\
  \n### 第 2 步\n如果数据库尚未运行，执行以下命令启动服务器。\n\n```cmd\nC:\\Program Files\\MySQL\\bin>mysqld\n\
  C:\\Program Files\\MySQL\\bin>\n```\n\n### 第 3 步\n执行以下命令创建 `TUTORIALSPOINT` 数据库——\n\
  \n```cmd\nC:\\Program Files\\MySQL\\bin> mysqladmin create TUTORIALSPOINT -u guest\
  \ -p\nEnter password: ********\nC:\\Program Files\\MySQL\\bin>\n```\n\n## 创建表\n\
  要在 TUTORIALSPOINT 数据库中创建 `Employees` 表，请使用以下步骤——\n\n### 第 1 步\n打开`命令提示符` 并如下切换到安装目录——\n\
  \n```cmd\nC:\\>\nC:\\>cd Program Files\\MySQL\\bin\nC:\\Program Files\\MySQL\\bin>\n\
  ```\n\n### 第 2 步\n如下所示登录数据库——\n\n```cmd\nC:\\Program Files\\MySQL\\bin>mysql -u\
  \ guest -p\nEnter password: ********\nmysql>\n```\n\n### 第 3 步\n如下所示创建表 `Employees`——\n\
  \n```sql\nmysql>  use TUTORIALSPOINT;\nmysql> create table Employees\n->  (\n->\
  \ id int  not  null,\n-> age int  not  null,\n-> first varchar (255),\n->  last\
  \ varchar (255)\n->  );\nQuery OK,  0 rows affected (0.08 sec)\nmysql>\n```\n\n\
  ## 创建数据记录\n最后，你如下所示在 Employee 表中创建几条记录——\n\n```sql\nmysql> INSERT INTO Employees\
  \ VALUES (100,  18,  'Zara',  'Ali');\nQuery OK,  1 row affected (0.05 sec)\nmysql>\
  \ INSERT INTO Employees VALUES (101,  25,  'Mahnaz',  'Fatma');\nQuery OK,  1 row\
  \ affected (0.00 sec)\nmysql> INSERT INTO Employees VALUES (102,  30,  'Zaid', \
  \ 'Khan');\nQuery OK,  1 row affected (0.00 sec)\nmysql> INSERT INTO Employees VALUES\
  \ (103,  28,  'Sumit',  'Mittal');\nQuery OK,  1 row affected (0.00 sec)\nmysql>\n\
  ```\n\n为了全面了解 MySQL 数据库，请学习 [MySQL 教程](https://www.tutorialspoint.com/mysql/index.htm\
  \ \"MySQL Tutorial\")。\n\n现在你已经准备好开始尝试 JDBC 了。下一章将为你提供一个 JDBC 编程的示例。\n\n## 示例代码\n\
  本章提供了如何创建一个 JDBC 应用的示例。\n\n## 创建 JDBC 应用\n建立 JDBC 连接涉及的编程非常简单。以下是简单的步骤：\n\n*   **导入\
  \ JDBC 包** — 在你的 Java 程序中添加 `import` 语句导入所需的类。\n*   **数据库 URL 格式** — 这是为了创建一个格式正确的地址，指向你想要连接的数据库。\n\
  *   **创建连接对象** — 最后，调用 `DriverManager` 对象的 `getConnection()` 方法建立实际的数据库连接。\n\n##\
  \ 示例代码\n当你需要创建自己的应用时，此示例代码可以模板。将以下示例粘贴到 `TestApplication.java`，编译并运行：\n\n```java\n\
  import java.sql.*;\n\npublic class TestApplication {\n    static final String DB_URL\
  \ = \"jdbc:mysql://localhost/TUTORIALSPOINT\";\n    static final String USER = \"\
  guest\";\n    static final String PASS = \"guest123\";\n    static final String\
  \ QUERY = \"SELECT id, first, last, age FROM Employees\";\n\n    public static void\
  \ main(String[] args) {\n        // 打开连接\n        try(Connection conn = DriverManager.getConnection(DB_URL,\
  \ USER, PASS);\n             Statement stmt = conn.createStatement();\n        \
  \     ResultSet rs = stmt.executeQuery(QUERY)) {\n\n            // 从结果集中提取数据\n \
  \           while (rs.next()) {\n                // 按列名检索\n                System.out.print(\"\
  ID: \" + rs.getInt(\"id\"));\n                System.out.print(\", Age: \" + rs.getInt(\"\
  age\"));\n                System.out.print(\", First: \" + rs.getString(\"first\"\
  ));\n                System.out.println(\", Last: \" + rs.getString(\"last\"));\n\
  \            }\n        } catch (SQLException e) {\n            e.printStackTrace();\n\
  \        }\n    }\n}\n```\n\n现在让我们如下编译上述示例：\n\n```cmd\nC:\\>javac TestApplication.java\n\
  C:\\>java TestApplication\n```\n\n当你运行 `TestApplication` 时，它产生以下结果：\n\n```text\n\
  ID: 100, Age: 18, First: Zara, Last: Ali\nID: 101, Age: 25, First: Mahnaz, Last:\
  \ Fatma\nID: 102, Age: 30, First: Zaid, Last: Khan\nID: 103, Age: 28, First: Sumit,\
  \ Last: Mittal\n```\n\n\n\n\n\n`Import` 语句告诉 Java 编译器在何处查找代码中引用的类，它们被放置在源代码的最开始。\n\
  \n要使用标准的 JDBC 程序包（它允许你对 SQL 表进行选择、插入、更新和删除数据操作），请在你的源代码中添加以下 `imports` ——\n\n```java\n\
  import java.sql.* ; // 用于标准的 JDBC 程序\nimport java.math.* ; // 用于对 BigDecimal 和 BigInteger\
  \ 的支持\n```\n\n## 注册 JDBC 驱动程序\n\n你必须在 classpath 中拥有所需的 JDBC 驱动程序。在当前情况下，你将 `CLASSPATH`\
  \ 变量设置为 `C:\\Program Files\\MySQL\\mysql-connector-java-5.1.8\\mysql-connector-java-5.1.8-bin.jar`。你的驱动版本可能会根据你的安装情况而异。\n\
  \n## 数据库 URL 的构建\n\n在加载驱动程序后，你可以使用 `DriverManager.getConnection()` 方法建立连接。为了方便参考，让我列出三个重载的\
  \ `DriverManager.getConnection()` 方法 ：\n\n* `getConnection(String url)`\n* `getConnection(String\
  \ url, Properties prop)`\n* `getConnection(String url, String user, String password)`\n\
  \n这里的每个形式都需要一个数据库 `URL`。数据库 URL 是指向你数据库的地址。\n\n构建数据库 URL 是大多数与连接相关问题发生的地方。\n\n下表列出了\
  \ MySQL JDBC 驱动程序名称和数据库 URL。\n\n| RDBMS | JDBC 驱动名称 | URL 格式 |\n| :--- | :--- |\
  \ :--- |\n| MySQL | `com.mysql.jdbc.Driver` | `jdbc:mysql://hostname/ databaseName`\
  \ |\n\nURL 格式中所有高亮部分都是静态的，你只需要根据数据库设置更改剩余部分。\n\n## 创建连接对象\n\n我们已经列出了创建连接对象的 `DriverManager.getConnection()`\
  \ 方法的三种形式。\n\n## 使用带有用户名和密码的数据库 URL\n\n`getConnection()` 最常用的形式需要你传递数据库 URL、一个用户名\
  \ 和密码 ：\n\n由于你正在使用 MySQL 驱动程序，你将为 URL 的数据库部分指定 `host:port:databaseName` 值。\n\n如果你有一个\
  \ TCP/IP 地址为 `192.0.0.1`、主机名为 `localhost` 的主机，且你的 MySQL 监听器配置为默认监听端口 `3306`，而你的数据库名称为\
  \ `TUTORIALSPOINT`，那么完整的数据库 URL 将是 ：\n\n`jdbc:mysql://localhost/TUTORIALSPOINT`\n\
  \n现在你必须使用相应的用户名和密码调用 `getConnection()` 方法来获取 `Connection` 对象，如下 ：\n\n```java\nString\
  \ URL =  \"jdbc:mysql://localhost/TUTORIALSPOINT\";\nString USER =  \"guest\";\n\
  String PASS =  \"password\";\nConnection conn =  DriverManager.getConnection(URL,\
  \ USER, PASS);\n```\n\n## 使用数据库 URL 和 Properties 对象\n\n第三种形式的 `DriverManager.getConnection(\
  \ )` 方法需要数据库 URL 和一个 `Properties` 对象 ：\n\n```java\nDriverManager.getConnection(String\
  \ url, Properties info);\n```\n\n`Properties` 对象持有一组键值对。它用于在调用 `getConnection()`\
  \ 方法期间将驱动属性传递给驱动程序。\n\n要建立与之前示例相同的连接，请使用以下代码 ：\n\n```java\nimport java.util.*;\n\
  String URL =  \"jdbc:mysql://localhost/TUTORIALSPOINT\";\nProperties info =  new\
  \  Properties(  );\ninfo.put(  \"user\",  \"guest\"  );\ninfo.put(  \"password\"\
  ,  \"guest123\"  );\nConnection conn =  DriverManager.getConnection(URL, info);\n\
  ```\n\n为了更好地理解，我们建议你学习我们的 [Java & MySQL - 代码教程](https://www.tutorialspoint.com/java_mysql/java_mysql_sample_code.htm)。\n\
  \n现在让我们按照如下方式编译上面的示例 ：\n\n```cmd\nC:\\>javac FirstExample.java\nC:\\>\n```\n\n当你运行\
  \ `FirstExample` 时，它产生以下结果 ：\n\n```\nC:\\>java FirstExample\nID: 100, Age: 18, First:\
  \ Zara, Last: Ali\nID: 101, Age: 25, First: Mahnaz, Last: Fatma\nID: 102, Age: 30,\
  \ First: Zaid, Last: Khan\nID: 103, Age: 28, First: Sumit, Last: Mittal\nC:\\>\n\
  ```\n\n# 异常处理\n\n异常处理允许你以受控的方式处理异常情况，如程序定义的错误。\n\n当异常情况发生时，会抛出一个异常。`thrown`（抛出）一词意味着当前程序的执行停止，控制被重定向到最近的可用\
  \ `catch` 子句。如果没有可用的 catch 子句，则程序的执行将结束。\n\nJDBC 异常处理与 Java 异常处理非常相似，但对于 JDBC 来说，你处理的最常见异常是\
  \ `java.sql.SQLException`。\n\n## SQLException 方法\n\n`SQLException` 可能同时发生在驱动程序和数据库中。当发生此类异常时，一个类型为\
  \ `SQLException` 的对象将传递给 `catch` 子句。\n\n传递的 `SQLException` 对象具有以下方法用于获取有关异常的附加信息\
  \ ：\n\n| 方法 | 说明 |\n| :--- | :--- |\n| `getErrorCode()` ) | 获取与异常相关的错误代码。 |\n| `getMessage()`\
  \ ) | 获取 JDBC 驱动程序的错误消息（由驱动程序处理），或获取数据库错误对应的 Oracle 错误代码和消息。 |\n| `getSQLState()`\
  \ ) | 获取 SQLState 字符串。 |\n| `getNextException()` ) | 获取异常链中的下一个异常。 |\n| `printStackTrace()`\
  \ ) | 将当前异常打印到标准错误。 |\n| `printStackTrace(PrintStream s)` | 将此异常打印到指定的打印流。 |\n|\
  \ `printStackTrace(PrintWriter w)` | 将此异常打印到指定的写入器。 |\n\n通过利用异常对象提供的可用信息，你可以捕获异常并适当继续程序。这里是\
  \ `try` 块的通用形式\n\n```java\ntry {\n    // 风险代码在大括号之间\n} catch(Exception ex) {\n \
  \   // 异常处理代码在大括号之间\n} finally {\n    // 必须执行的代码在大括号之间。例如关闭数据库连接。\n}\n```\n\n##\
  \ 示例\n\n学习以下代码以理解 `try...catch...finally` 块的使用。此代码根据之前章节的环境和数据库设置编写。\n\n```java\n\
  import java.sql.CallableStatement;\nimport java.sql.Connection;\nimport java.sql.DriverManager;\n\
  import java.sql.SQLException;\n\npublic class TestApplication {\n    static final\
  \ String DB_URL = \"jdbc:mysql://localhost/TUTORIALSPOINT\";\n    static final String\
  \ USER = \"guest\";\n    static final String PASS = \"guest123\";\n    static final\
  \ String QUERY = \"{call getEmpName (?, ?)}\";\n\n    public static void main(String[]\
  \ args) {\n        // 打开连接\n        try (Connection conn = DriverManager.getConnection(DB_URL,\
  \ USER, PASS);\n             CallableStatement stmt = conn.prepareCall(QUERY)) {\n\
  \n            // 将值绑定到参数上\n            stmt.setInt(1, 1); // 这将设置 ID\n         \
  \   // 因为第二个参数是 OUT，所以注册它\n            stmt.registerOutParameter(2, java.sql.Types.VARCHAR);\n\
  \n            // 使用 execute 方法运行存储过程\n            System.out.println(\"Executing\
  \ stored procedure...\");\n            stmt.execute();\n\n            // 使用 getXXX\
  \ 方法检索员工姓名\n            String empName = stmt.getString(2);\n            System.out.println(\"\
  Emp Name with ID: 1 is \" + empName);\n\n        } catch (SQLException e) {\n  \
  \          e.printStackTrace();\n        }\n    }\n}\n```\n\n\n\n\nJDBC `Statement`\
  \ 接口定义了用于向 MySQL 数据库发送 SQL 命令并从数据库中检索数据的方法和属性。`Statement` 用于对数据库进行通用访问。当你在运行时使用静态\
  \ SQL 语句时，它非常有用。`Statement` 接口不接受参数。\n\n在使用 `Statement` 对象执行 SQL 语句之前，你首先需要使用 `Connection`\
  \ 对象的 `createStatement()` 方法创建一个对象，如下例所示：\n\n```java\nStatement stmt = null;\n\n\
  try {\n    stmt = conn.createStatement();\n    .  .  .\n} catch (SQLException e)\
  \ {\n    .  .  .\n} finally {\n    .  .  .\n}\n```\n\n一旦你创建了 `Statement` 对象，就可以使用它的三个执行方法之一来执行\
  \ SQL 语句。\n\n*   `boolean execute(String SQL)` — 如果可以检索到 `ResultSet` 对象，则返回布尔值 true；否则，返回\
  \ false。使用此方法执行 SQL DDL 语句，或当你需要使用真正的动态 SQL 时。\n*   `int executeUpdate(String SQL)`\
  \ — 返回执行 SQL 语句后影响的行数。使用此方法执行你预期会获得影响行数的 SQL 语句——例如 `INSERT`、`UPDATE` 或 `DELETE`\
  \ 语句。\n*   `ResultSet executeQuery(String SQL)` — 返回一个 `ResultSet` 对象。当你预期获取结果集时（如使用\
  \ `SELECT` 语句时），使用此方法。\n\n## 关闭 Statement 对象\n\n正如关闭 `Connection` 对象是为了节省数据库资源，出于相同的原因，你也应该关闭\
  \ `Statement` 对象。\n\n只需调用 `close()` 方法即可完成工作。如果你先关闭 `Connection` 对象，它也会关闭 `Statement`\
  \ 对象。但是，你应该始终显式关闭 `Statement` 对象以确保正确的清理。\n\n```java\nStatement stmt = null;\n\n\
  try {\n    stmt = conn.createStatement();\n    .  .  .\n} catch (SQLException e)\
  \ {\n    .  .  .\n} finally {\n    stmt.close();\n}\n```\n\n我们正在使用 `try with resources`，它可以自动处理资源的关闭。下面的示例演示了上述所有的概念。\n\
