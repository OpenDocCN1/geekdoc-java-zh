  );\n            rs.next();\n            // 提取结果集\n            System.out.println(\"\
  Displaying record...\");\n            // 获取列名\n            id = rs.getInt(\"id\"\
  );\n            age = rs.getInt(\"age\");\n            first = rs.getString(\"first\"\
