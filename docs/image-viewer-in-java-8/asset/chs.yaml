  \n      ...\n  }\n```\n\n### 3.1.2 设置 `imageName` 属性的值\n\n用于在状态栏中显示图像名称的 `Text`\
  \ 节点的 `text` 属性绑定了在 `ImageViewer` 类中定义的 `imageName` 属性。每当打开新的图像文件并将其显示在图像渲染区域时，都会从\
  \ `File` 对象中获取图像名称，并将其设置为 `imageName` 属性的值。以下是实现这些操作的代码片段：\n\n```java\n File file\
  \ = fileChooser.showOpenDialog(stage);\nString url = file.toURI().toString();\n\
  imageName.set(url.substring(url.lastIndexOf(\"/\")+1).replaceAll(\"%20\", \" \"\
