  /\")+1).replaceAll(\"%20\", \" \"));\n```\n\n被插入到 `Load` 菜单项的操作处理器中，以及 `Next` 和\
  \ `Previous` 按钮的鼠标点击事件处理器中。由于 `statusText`（一个 `Text` 对象）的 `text` 属性绑定了 `imageName`\
  \ 属性，每当 `imageName` 属性的值改变，状态栏上渲染的文本将随之改变。\n\n### 列表 3-2. `Load` 菜单项的操作处理器如下\n\n\
