  \n在本节中，我们将演示如何调整图像的显示大小以适应应用程序窗口。`ImageView` 被创建为 `StackPane` 的子节点，根据 `StackPane`\
  \ 的默认布局策略，图像会被放置在 `StackPane` 的中心；因此，如果图像尺寸大于当前可用显示空间（该空间取决于 `Scene` 的大小），图像的外围部分将被遮挡，导致用户无法查看整个图像。\n\
  \n在上一节中，我们创建了一个包含三个显示选项的 `Option` 菜单：`适应宽度 (Fit Width)`、`适应高度 (Fit Height)` 和 `原始尺寸\
  \ (Original Size)`。图像根据当前选择的选项进行渲染，初始设置为`原始尺寸`。默认情况下，我们在执行缩放时希望保留图像的原始宽高比例。为了实现这一点，我们如下所示将\
  \ `preserveRatio` 属性的值设置为 `true`：\n\n列表 1-11. 将 `preserveRatio` 属性的值设置为 `true`：\n\
  \n```\n final ImageView imageView = new ImageView();\nimageView.setPreserveRatio(true);\n\
  ```\n\n现在，让我们探索两种根据当前选择的选项渲染图像的方法。\n\n### 1.4.1 方法一：分别将 `ImageView` 的 `fitWidth`/`fitHeight`\
  \ 属性绑定到 `Scene` 的 `width`/`height` 属性\n\n我们使用 `Property` 接口中定义的 `bind` 和 `unbind`\
  \ 方法来实现“适应宽度”、“适应高度”和“原始尺寸”显示选项。\n\n这里的吸引人之处在于，一旦绑定生效，每当 `Scene` 的宽度和/或高度动态发生变化时，图像的显示宽度和/或高度就会随之发生变化。\n\
  \n#### 1.4.1.1 实现“适应宽度”显示选项\n\n如果用户选择“适应宽度”作为显示选项，我们将 `ImageView` 的 `fitWidth` 属性绑定到\
  \ `Scene` 的 `width` 属性上，并解绑 `fitHeight` 属性。代码如下：\n\n列表 1-12. 将 `ImageView` 对象的 `fitWidth`\
  \ 属性绑定到 `Scene` 的 `width` 属性：\n\n```\n imageView.fitWidthProperty().bind(scene.widthProperty());\n\
  imageView.fitHeightProperty().unbind();\n// 除了解绑，还必须将适应高度设置为 0\nimageView.setFitHeight(0);\n\
  ```\n\n#### 1.4.1.2 实现“适应高度”显示选项\n\n如果选择“适应高度”作为显示选项，我们将 `ImageView` 的 `fitHeight`\
  \ 属性绑定到 `Scene` 的 `height` 属性（减去菜单栏的高度），并解绑 `fitHeight` 属性。\n\n我们正在使用 `subtract`\
  \ 方法来计算图像的可用显示高度。`DoubleProperty` 类继承自 `DoubleExpression` 类的 `subtract(double other)`\
  \ 方法返回一个新的 `NumberBinding` 对象，该对象用于计算此 `NumberExpression` 与给定常量值之间的差。代码如下：\n\n列表\
  \ 1-13. 将 `ImageView` 的 `fitHeight` 属性绑定到 `scene` 的 `height` 属性，减去菜单栏的高度：\n\n```\n\
  \ // 渲染图像的可用高度是\n// 从场景高度中减去菜单栏的高度\nimageView.fitHeightProperty().bind(\n   scene.heightProperty().subtract(menuBar.getHeight()));\n\
  imageView.fitWidthProperty().unbind();\n// 除了解绑，还必须将适应宽度设置为 0 \nimageView.setFitWidth(0);\
  \ \n```\n\n#### 1.4.1.3 实现“原始尺寸”显示选项\n\n如果选择“原始尺寸”作为显示选项，我们将解绑 `ImageView` 对象的 `fitWeight`\
  \ 属性以及 `fitHeight` 属性。代码如下：\n\n列表 1-14. 解绑 `ImageView` 对象的 `fitWidth` 属性以及 `fitHeight`\
  \ 属性：\n\n```\nimageView.fitWidthProperty().unbind();\nimageView.fitHeightProperty().unbind();\n\
  // 除了解绑，还必须将宽度/高度设置为 0\nimageView.setFitWidth(0);\nimageView.setFitHeight(0);\n\
  ```\n\n请注意，更改 `ImageView` 对象的 `fitWidth`/`fitHeight` 属性的值不会影响底层 `Image` 对象的 `width`/`height`\
  \ 属性。`Image` 对象的属性（如 `width` 和 `height`）保持不变，而与 `ImageView` 显示选项相关的属性则由用户进行动态更改。\n\
  \n方法一的优点是，你不需要注册事件处理程序来响应 `Scene` 的调整大小事件。当应用程序窗口动态调整大时，`Scene` 随之调整大小，`ImageView`\
  \ 的相应属性也随之改变，图像渲染区域（一个 `StackPane` 对象）的大小会自动重新计算。\n\n以下代码片段展示了方法一的实现。\n\n列表 1-15.\
  \ 监听选择的变化，并使用 `bind` 和 `unbind` 方法调整图像视图的 `fitWidth` 和 `fitHeight`：\n\n```\n final\
  \ StackPane imageArea = new StackPane();\n\n   ...\n\nfinal Scene scene = new Scene(rootPane,\
  \ 600, 400); \n\n   ...\n\nfinal MenuBar menuBar = new MenuBar();\n\n   ...\n\n\
  // 创建切换组\nfinal ToggleGroup groupOption = new ToggleGroup();\n\n// 创建单选菜单并添加到切换组\n\
  final RadioMenuItem fitWidth = new RadioMenuItem(\"Fit Width\");\nfitWidth.setToggleGroup(groupOption);\n\
  final RadioMenuItem fitHeight = new RadioMenuItem(\"Fit Height\");\nfitHeight.setToggleGroup(groupOption);\n\
  final RadioMenuItem original = new RadioMenuItem(\"Original Size\");\noriginal.setToggleGroup(groupOption);\n\
  \ngroupOption.selectedToggleProperty().addListener(new ChangeListener<Toggle>()\
  \ {\n  public void changed(ObservableValue<? extends Toggle> ov,\n          Toggle\
  \ old_toggle, Toggle new_toggle) {\n    if (groupOption.getSelectedToggle() != null)\
  \ {\n      RadioMenuItem choiceItem = (RadioMenuItem) groupOption.getSelectedToggle();\n\
  \      if (choiceItem == fitWidth) {\n        System.out.println(\"fitwidth\");\n\
  \        imageView.fitWidthProperty().bind(scene.widthProperty());\n        imageView.fitHeightProperty().unbind();\n\
  \        // 除了解绑，还必须将适应高度设置为 0\n        imageView.setFitHeight(0);\n      } else\
  \ if (choiceItem == fitHeight) {\n        System.out.println(\"fitheight\");\n \
  \       // 渲染图像的可用高度是\n        // 从场景高度中减去菜单栏的高度\n        imageView.fitHeightProperty().bind(\n\
  \          scene.heightProperty().subtract(menuBar.getHeight()));\n        imageView.fitWidthProperty().unbind();\n\
  \        // 除了解绑，还必须将适应宽度设置为 0 \n        imageView.setFitWidth(0); \n      } else\
  \ {\n        System.out.println(\"original size\");\n        imageView.fitWidthProperty().unbind();\n\
  \        imageView.fitHeightProperty().unbind();\n        // 除了解绑，还必须将宽度/高度设置为 0\n\
  \        imageView.setFitWidth(0);\n        imageView.setFitHeight(0);\n      }\n\
  \    } \n  }\n});\n```\n\n#### 1.4.1.4 `ImageViewer` 类的完整源代码\n\n方法一的 `ImageViewer`\
