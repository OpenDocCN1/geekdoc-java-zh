  \ Windows 8.1 上使用 jdk1.8.0_66 的截图）\n\n## 2.2 在 `StackPane` 中调整 `Next` 按钮的默认位置\n\n\
  在本节中，我们将演示如何将 `StackPane` 的子节点放置在所需的位置。\n\n`StackPane` 将所有子节点堆叠在一起，并以中心作为默认对齐方式。这意味着默认情况下，StackPane\
  \ 的子会在面板中心相互重叠。\n\n在我们的应用程序中，将 `Next` 按钮放在 `StackPane` 的中心是不行的。幸运的是，`StackPane`\
  \ 提供了静态方法：\n\n```\n public static void setAlignment(Node child, Pos value)\npublic\
  \ static void setMargin(Node child, Insets value)\n```\n\n允许我们调整单个子节点的位置。`Next`\
  \ 按钮的最佳位置是窗口的右侧，位于场景的可视范围内。接下来的代码片段调整了下一个按钮的默认位置。\n\n导入语句：\n\n```\n import javafx.geometry.Insets;\n\
  import javafx.geometry.Pos;\n```\n\n列表 2-6. 使用 `StackPane` 的静态方法 `setAlignment`\
  \ 和 `setMargin` 调整 `Next` 按钮的默认位置：\n\n```\n StackPane.setAlignment(nextButton, Pos.CENTER_RIGHT);\n\
  \  StackPane.setMargin(nextButton, new Insets(8));\n```\n\n接下来的截图显示了位于应用程序窗口右侧的\
  \ `Next` 按钮。\n\n图 2-6. 位于窗口右侧的 `Next` 按钮截图，位于场景的可视范围内。\n\n![next_button_right.jpg](img/image00143.jpeg\
  \ \"next_button_right.gif\")\n\n请记住，我们将 `StakePane` 的最小尺寸设置为 (0, 0)，以避免其因子节点 `ImageView`\
  \ 而自动更改大小。如果不这样做，每当加载并显示大于 `StackPane` 可视边界的图像时，`Next` 按钮的位置可能会出现复杂的情况。该设置简化了调整\
  \ `Next` 按钮位置的解决方案。\n\n下一张截图显示了按原始尺寸显示的大尺寸图像，图像超出 `StakePane` 边界的部分是不可见的。如果我们没有为\
  \ `StakePane` 设置最小尺寸，它的尺寸将随其内容而扩大，导致 `Next` 按钮将掉到可视边界之外。\n\n图 2-7. 在动态调整应用程序窗口大小后，位于窗口右侧的\
