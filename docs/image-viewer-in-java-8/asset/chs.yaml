  \ }\n    });\n\n    // 鼠标释放处理器\n    // 当鼠标释放时更改按钮的外观\n    buttonGroup.setOnMouseReleased(new\
  \ EventHandler<MouseEvent>() {\n      @Override\n      public void handle(MouseEvent\
  \ me) {\n        System.out.println(\"Mouse released\");\n        rect.setFill(bg);\n\
  \      }\n    });\n\n    // 鼠标离开处理器\n    // 当鼠标离开时更改按钮的外观\n    buttonGroup.setOnMouseExited(new\
  \ EventHandler<MouseEvent>() {\n      @Override\n      public void handle(MouseEvent\
  \ me) {\n        System.out.println(\"Mouse exited\");\n        rect.setFill(bg);\n\
  \      }\n    });\n  }\n\n  // 此处原文本已截断，缺少完整的 configureSlideshow 方法和类结束括号\n  //\
  \ 根据逻辑推断，后续应为：\n  void configureSlideshow() {\n    // ... 逻辑在上方翻译中\n  }\n}\n```\n\
