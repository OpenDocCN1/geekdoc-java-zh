  import javafx.scene.event.EventHandler;\nimport javafx.scene.event.MouseEvent;\n\
  ```\n\n\n\n\n`Tooltip` 类位于 `javafx.scene.control` 包中，并继承自 `javafx.scene.control.PopupControl`\
  \ 类，它是用于在鼠标悬停在节点上时显示该节点帮助信息的基础 UI 组件之一。\n\n如果节点是如 `Button` 等 UI 控件，你可以为该节点设置在 `javafx.scene.control.Control`\
  \ 类中定义的 `tooltip` 属性值。这里是 `setTooltip` 方法：\n\n```\n public final void setTooltip(Tooltip\
  \ value) \n```\n\n由于 `Next` 按钮是一个类似于按钮的自定义节点，并没有派自 `javafx.scene.control.Control`\
  \ 类，因此我们将使用 `Tooltip` 类提供的 `install` 方法来将 `Tooltip` 与 `Next` 按钮关联。这里是 `install`\
  \ 方法：\n\n```\n public static void install(Node node, Tooltip t) \n```\n\n接下来的代码片段展示了通过调用\
  \ `createNextButton()` 方法创建 `Next` 节点、为该节点安装 `Tooltip`，并将其添加到 `StackPane`（即图像渲染区域）的子列表中。\n\
  \n导入语句：\n\n```\n import javafx.scene.control.Tooltip;\n```\n\n列表 2-5. 创建 `Next`\
