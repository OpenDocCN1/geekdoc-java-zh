  - `Group` 类，位于 `javafx.scene.Group` 包，是 `javafx.scene.Parent` 的子类。（参见“将 `Group`\
  \ 作为容器”章节）\n- `Shape` 类，位于 `javafx.scene.shape` 包，提供了渲染 2D 原形（如矩形、多边形等）的功能。（参见“使用\
  \ `Shape` 渲染 2D 原形”章节）\n- `Rectangle` 类，位于 `javafx.scene.shape` 包，是 `javafx.scene.shape.Shape`\
  \ 的直接子类。它提供了根据属性（如 `x`、`y`、`width`、`height` 等）绘制矩形的功能。（参见“使用 `Shape` 渲染 2D 原形”和“将\
  \ `Rectangle` 作为边界框”章节）\n- `Polygon`，位于 `javafx.scene.shape` 包，是 `javafx.scene.shape.Shape`\
  \ 的直接子类。使用 `getPoints()` 方法获取 `ObservableList<Double>` 类型，然后使用 `Collection` 接口定义的内置工具，将一系列存储在\
  \ `Double` 数组中的 `x` 和 `y` 坐标添加到列表中，这些坐标代表 `Polygon` 的点。（参见“使用 `Shape` 渲染 2D 原形”和“使用\
  \ `Polygon` 作为视觉图标”章节）\n- `LinearGradient` 和 `Color`，位于 `javafx.scene.paint` 包，是\
  \ `Paint` 类的两个直接子类。（参见“`Shape` 的背景和边界”章节）\n- `CycleMethod` 和 `Stop`，位于 `javafx.scene.paint`\
  \ 包，与 `LinearGradient` 和 `RadialGradient` 类配合使用的类：\n    - `CycleMethod`：枚举类型，定义了常量：`CycleMethod.NO_CYCLE`、`CycleMethod.REFLECT`\
  \ 和 `CycleMethod.REPEAT`。\n    - `Stop`：定义了应用于颜色渐变的偏移量和颜色。（参见“将 `Rectangle` 作为边界框”和“`Shape`\
  \ 的背景和边界”章节）\n- `arcHeight` 和 `arcWidth` 是 `Rectangle` 类中定义的属性，用于渲染圆角矩形。（参见“设置 `arcHeight`\
  \ 和 `arcWidth` 属性渲染圆角矩形”章节）\n- `Cursor` 类，位于 `javafx.scene` 包并继承 `java.lang.Object`，以\
  \ `Cursor` 类型的静态字段定义了一些实用的鼠标光标，如 `CLOSED_HAND`、`CROSSHAIR`、`HAND`、`OPEN_HAND`、`TEXT`、`WAIT`\
  \ 等。（参见“为 Node 设置 `Cursor` 属性”章节）\n- `EventHandler<T extends Event>`，继承 `java.util.EventListener`\
  \ 的接口，定义了在指定事件发生时调用的 `handle(T event)` 方法。（参见“使用便利方法注册事件处理器以处理鼠标事件”章节）\n- `MouseEvent`，位于\
  \ `javafx.scene.input` 包，是 `javafx.scene.input.InputEvent` 的子类。它定义了事件类型，如 `MOUSE_CLICKED`、`MOUSE_DRAGGED`、`MOUSE_ENTERED`、`MOUSE_EXITED`、`MOUSE_MOVED`、`MOUSE_PRESSED`、`MOUSE_RELEASED`\
  \ 等，并提供了 `getX()`、`getY()` 等方法用于获取事件发生时鼠标的位置。（参见“使用便利方法注册事件处理器以处理鼠标事件”章节）\n- `Node`\
  \ 类提供的某些便利方法，用于注册 `EventHandler` 以处理鼠标事件：\n    ```\n    public final void setOnMouseClicked(EventHandler<?\
  \ super MouseEvent> value)\n    public final void setOnMouseEntered(EventHandler<?\
  \ super MouseEvent> value)\n    public final void setOnMouseExited(EventHandler<?\
  \ super MouseEvent> value)\n    ```\n    （参见“使用便利方法注册事件处理器以处理鼠标事件”章节）\n- `Tooltip`\
  \ 类（位于 `javafx.scene.control` 包并继承 `javafx.scene.control.PopupControl`）提供的 `static\
  \ void install(Node node, Tooltip t)` 方法，用于鼠标悬停在给定 `Node` 上显示帮助帮助。（参见“为 Node 安装\
  \ `Tooltip`”章节）\n- `StackPane` 静态方法，用于自定义指定子节点的布局约束：\n    ```\n    static void setAlignment(Node\
  \ child, Pos value)\n    static void setMargin(Node child, Insets value)\n    ```\n\
  \    （参见“在 StackPane 中调整 `Next` 按钮的默认位置”和“在 StackPane 中添加 `Previous` 按钮并调整其位置”章节）\n\
  - `Pos`，位于 `javafx.geometry` 包，是一个定义位置和对齐常量的枚举类型，如 `CENTER`、`CENTER_RIGHT`、`TOP_RIGHT`\
  \ 等。（参见“在 StackPane 中调整 `Next` 按钮的默认位置”和“在 StackPane 中添加 `Previous` 按钮并调整其位置”章节）\n\
  - `Insets` 类，位于 `javafx.geometry` 包，通常用于 `setMargin` 方法或 `setPadding` 方法，指定矩形区域四边（上、右、下、左）的偏移量。（参见“在\
  \ StackPane 中调整 `Next` 按钮的默认位置”和 prev-button-set-margin-codes）\n- `FileChooser.ExtensionFilter`\
  \ 是 `FileChooser` 类中定义的嵌套类，用于定义过滤器以仅显示扩展匹配给定过滤器的文件。（参见“配置 `FileChooser`”章节）\n- 位于\
  \ `javafx.beans.property` 包的一些类：\n    - `ObjectProperty<T>`：抽象类，派自 `javafx.beans.binding.ObjectExpression<T>`\
  \ 类，实现 `Property<T>` 和 `WritableObjectValue<T>`。\n    - `SimpleObjectProperty<T>`：派自\
  \ `ObjectProperty<T>` 类。\n    - `StringProperty`\n\n\n\n\n\n`is` 是一个抽象类，继承自 `javafx.beans.binding.StringExpression`\
  \ 类，实现了 `Property<java.lang.String>` 和 `WritableStringValue`。\n\n`WritableStringValue`\
  \ 继承自 `WritableObjectValue<java.lang.String>`。\n\n`SimpleStringProperty` 继承自 `StringProperty`\
  \ 类。\n\n（参见节章节 在 `ImageViewer` 类中定义属性）\n\n*   `Property<T>` 接口，位于 `javafx.beans.property`\
  \ 包中，定义了所有属性通用的方法，如下：\n\n    ```\nvoid bind(ObservableValue<? extends T> observable)\n\
  \    ```\n\n    将此属性单向绑定到给定的 `ObservableValue`。\n\n    ```\nvoid unbind()\n```\n\
  \n    取消此属性的绑定。\n\n（参见节章节 在 `ImageViewer` 类中定义属性）\n\n*   `WritableObjectValue<T>`\
  \ 接口，位于 `javafx.beans.value` 包中并继承自 `WritableValue<T>`，定义了以下方法：\n\n    ```\nT get()\n\
  \    ```\n\n    获取封装的值。\n\n    ```\n    void set(T value)\n    ```\n\n    设置封装的值。\n\
  \n（参见 此处）\n\n# 第 3 章\n\n具有幻灯片功能的增强图像查看器\n\n--开发图像查看器 V1.2\n\n# 前言\n\n在这一阶段，`ImageViewer`\
  \ 已经具备了作为高效图像查看工具足够的能力。基于目前构建的基础结构，可以容易地逐步开发更多功能。\n\n本章重点介绍幻灯片功能的实现以及对 GUI 整体外观和效果的微调。我们将演示如何使用位于\
  \ `javafx.concurrent` 包中的并发类开发多线程 JavaFX 应用程序。\n\n`ImageViewer` 的版本号升级到了 1.2。通过从\
  \ ImageViewer V1.2 中摘取的详细描述和文档良好的示例代码段，你将熟悉 总结 节中所述的 JavaFX 库的基本功能。\n\nImageViewer\
  \ V1.2 的完整开发过程具有以下步骤的特点：\n\n*   3.1 在 `BorderPane` 底部添加状态栏\n    *   3.1.1 创建 `HBox`\
  \ 布局作为状态栏和 `Text` 节点显示图像名称\n    *   3.1.2 设置 `imageName` 属性的值\n*   3.2 改进按钮的响应 Aspect\n\
  \    *   3.2.1 禁用按钮表示没有更多图片可以打开\n    *   3.2.2 鼠标按下时改变按钮外观\n*   3.3 添加幻灯片功能\n  \
  \  *   3.3.1 添加“开始幻灯片”和“停止幻灯片”菜单项\n        *   3.3.1.1 绑定菜单项的禁用属性\n    *   3.3.2\
  \ 在另一个线程上执行幻灯片\n        *   3.3.2.1 创建继承自 `Service` 类的 `SlideshowService` 类\n  \
  \      *   3.3.2.2 配置幻灯片服务对象\n        *   3.3.2.3 为“开始幻灯片”和“停止幻灯片”菜单项实现动作事件事件处理器\n\
  \    *   3.3.3 ImageViewer 应用程序完整的 `start(Stage stage)` 方法\n    *   3.3.4 与 `Load`\
  \ 菜单项和 `Previous` 按钮的事件处理器协调\n*   3.4 在幻灯片之间添加淡入切换效果\n    *   3.4.1 `SlideshowService`\
  \ 类的源代码\n*   3.5 图像查看器 V1.2 的完整源代码\n*   3.6 总结\n\n## 3.1 在 `BorderPane` 底部添加状态栏\n\
  \n在实现幻灯片功能之前，我们将在根面板（一个 `BorderPane`）的底部添加一个状态栏。状态栏用于显示图像名称，即当前图像的文件名。\n\n### 3.1.1\
  \ 创建 `HBox` 布局作为状态栏和 `Text` 节点显示图像名称\n\n创建一个 `HBox`（内置布局面板之一，它将其子元素水平排列在行中）作为状态栏。并创建一个\
  \ `Text` 节点来显示图像名称。创建一个 `HBox` 作为状态栏，代码段如下：\n\n```\nBorderPane rootPane = new BorderPane();\n\
  HBox statusBar = new HBox();\nText statusText = new Text(\"\");\nstatusBar.getChildren().add(statusText);\n\
  rootPane.setBottom(statusBar);\n```\n\n\n\n\n在之前的章节中，我们已经演示了 `Properties` 和 `Binding`\
  \ 在各种情况下的用法。这里有另一个案例。`Text` 节点的 `text` 属性绑定了 `imageName`，`imageName` 是在 `ImageViewer`\
  \ 类中定义的类型为 `StringProperty` 的字段。以下是实现这些操作的代码片段：\n\n```java\n StringProperty imageName\
  \ = new SimpleStringProperty();\n    Text statusText = new Text(\"\");\n    statusText.textProperty().bind(imageName);\n\
  ```\n\n何时设置 `imageName` 属性的值将在下一节中描述。\n\n到目前为止，`ImageViewer` 类中进行的所有更改在下面的代码片段中以**粗体**显示：\n\
  \n### 导入语句\n\n```java\n import javafx.scene.layout.HBox;\nimport javafx.scene.text.Font;\n\
  import javafx.scene.text.FontWeight;\nimport javafx.scene.text.Text;\n```\n\n###\
  \ 列表 3-1. 添加一个 `HBox` 状态栏，其中包含一个显示图像名称的 `Text` 节点，为 `Scene` 指定背景颜色，并修改绑定 `fitHeight`\
