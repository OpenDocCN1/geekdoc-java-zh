  图 1-5. 在中心显示大尺寸图像的截图\n\n## 1.3 创建 Option 菜单和 View 子菜单\n\n我们需要一个 `Option` 菜单允许用户选择首选的视图标准。`Option`\
  \ 菜单包含一个 `View` 子菜单，包含三个互斥的选择，如下：\n\n`Fit Width`：通过调整 `ImageView` 的 `fitWidth` 属性来渲染图像，在保持原始宽比的同时，适应当前可用视图区域的宽度。\n\
  \n`Fit Height`：通过调整 `ImageView` 的 `fitHeight` 属性来渲染图像，在保持原始宽比的同时，适应当前可用视图区域的高度。\n\
  \n`Original Size`：按原始尺寸渲染图像，超出当前可用视图区域边界的图像外部部分将被隐藏。这被设置为初始视图选项。\n\n请注意，可用视图空间是由应用程序窗口（称为\
  \ `Stage`）的当前宽度和高度决定的，这取决于 `Scene`（场景的容器）的当前尺寸。初始场景设置为 600 像素 x 400 像素，因此图像渲染区域的尺寸将与场景相同。在我们在\
  \ `BorderPane` 顶部添加了菜单栏后，可用渲染区域的高度变为场景高度减去菜单栏的高度，而宽度保持不变。\n\n### 1.3.1 创建 ToggleGroup、单选框菜单项并为\
  \ `selectedToggle` 属性添加监听器\n\n\n\n\n\n要在菜单中实现互斥选择，我们需要创建 `RadioMenuItem` 对象和单个 `ToggleGroup`\
  \ 对象，然后将每个 `RadioMenuItem` 关联到同一个 `ToggleGroup`。\n\n为了监听选中的单选菜单项的变化，我们使用：\n\n```\n\
  \ void addListener(ChangeListener<? super T> listener) \n```\n\n来为 `ToggleGroup`\
  \ 对象的 `selectedToggle` 属性注册一个 `ChangeListener`。\n\n下面的代码段展示了如何完成这些任务。\n\n### 导入语句：\n\
  \n```\n import javafx.scene.control.RadioMenuItem;\nimport javafx.scene.control.Toggle;\n\
  import javafx.scene.control.ToggleGroup;\n```\n\n### 列表 1-9. 创建 `Option` 菜单、`ToggleGroup`、`RadioMenuItem`s、`View`\
  \ 子菜单并为 `ToggleGroup` 的 `selectedToggle` 属性添加监听器：\n\n```\n // 创建 Option 菜单\nMenu\
  \ menuOption = new Menu(\"Option\");\n\n// 创建切换组\nfinal ToggleGroup groupOption\
  \ = new ToggleGroup();\n\n// 创建单选菜单项\nfinal RadioMenuItem fitWidth = new RadioMenuItem(\"\
  Fit Width\");\nfitWidth.setToggleGroup(groupOption);\nfinal RadioMenuItem fitHeight\
  \ = new RadioMenuItem(\"Fit Height\");\nfitHeight.setToggleGroup(groupOption);\n\
  final RadioMenuItem original = new RadioMenuItem(\"Original Size\");\noriginal.setToggleGroup(groupOption);\n\
  \n// 为切换组添加监听器\ngroupOption.selectedToggleProperty().addListener(new ChangeListener<Toggle>()\
  \ {\n  public void changed(ObservableValue<? extends Toggle> ov,\n             \
  \         Toggle old_toggle, Toggle new_toggle) {\n    if (groupOption.getSelectedToggle()\
  \ != null) {\n      RadioMenuItem choiceItem = (RadioMenuItem) groupOption.getSelectedToggle();\n\
  \      if (choiceItem == fitWidth) {\n        System.out.println(\"fitwidth\");\n\
  \      } else if (choiceItem == fitHeight) {\n        System.out.println(\"fitheight\"\
  );\n      } else {\n        System.out.println(\"original size\");\n      }\n  \
  \  } \n  }\n});\n\n// 为 Option 菜单创建 View 子菜单\nMenu menuView = new Menu(\"View\"\
  );\nmenuView.getItems().addAll(fitWidth, fitHeight, original);\n\n// 设置 Original\
  \ Size 为默认选择\noriginal.setSelected(true);\n\n// 将 option 添加到菜单栏\nmenuOption.getItems().add(menuView);\n\
  menuBar.getMenus().add(menuOption);\n```\n\n### 列表 1-10. `ImageViewer` 类的完整源码如下：\n\
