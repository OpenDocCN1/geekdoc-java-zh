  Mouse exited/released\nStop Slideshow...\n```\n\n## 3.6 总结\n\n本章介绍了 JavaFX 库的以下关键方面，按它们在章节中出现的顺序列出：\n\
  \n*   `HBox` 类是内置的 JavaFX 布局面板之一，位于 `javafx.scene.layout` 包中，是 `javafx.scene.layout.Pane`\
  \ 的直接子类，将其子节点水平地排列在一行中。（参见章节 在 BorderPane 底部添加状态栏）\n*   `Text` 类位于 `javafx.scene.text`\
  \ 包中，是 `javafx.scene.shape.Shape` 类的直接子类之一，负责处理渲染几何图形状的常见需求。（参见章节 在 BorderPane 底部添加状态栏）\n\
  *   `void setPadding(Insets value)` 方法由 `Region` 类提供，定义了区域的上、右、下、左内边距。（参见此处）\n*\
  \   `void setSpacing(double value)` 方法由 `HBox` 类提供，指定 HBox 面板中子节点之间的水平间距。（参见此处）\n\
  *   `void setStyle(String value)` 方法由 `Node` 类提供，指定此节点的 CSS 样式。（参见此处）\n*   `static\
  \ Font font(java.lang.String family, FontWeight weight, double size)` 方法位于 `javafx.scene.text.Font`\
  \ 类，用于获取渲染文本的字体。（参见此处）\n*   `Scene(Parent root, double width, double height, Paint\
  \ fill)` 是 `Scene` 类的构造函数之一，用于创建一个具有指定背景色的 `Scene`。（参见此处）\n*   某些类位于 `javafx.beans.property`\
  \ 包中：\n    *   `StringProperty` 是一个抽象类，派自 `javafx.beans.binding.StringExpression`\
  \ 类，实现了 `Property<java.lang.String>` 和 `WritableStringValue`。\n    *   `WritableStringValue`\
  \ 扩展了 `WritableObjectValue<java.lang.String>`。\n    *   `SimpleStringProperty` 派自\
  \ `StringProperty` 类。（参见此处）\n*   `void bind(ObservableValue<? extends T> observable)`\
  \ 方法定义在 `Property` 接口中，位于 `javafx.beans.property` 包中，将此属性单向绑定到给定的 `ObservableValue`。（参见此处\
  \ | 此处 | 此处）\n*   `DoubleBinding subtract(double other)` 方法定义在 `javafx.beans.binding.DoubleExpression`\
  \ 类中，计算此 `NumberExpression` 与给定常量之间的差。（参见此处）\n*   `void setDisable(boolean value)`\
  \ 方法由 `Node` 类提供，指定此节点的 `disable` 。（参见章节 禁用按钮以表示无图像可打开 和 此处）\n*   `void setOpacity(double\
  \ value)` 方法由 `Node` 类提供，指定节点的透明度。（参见此处）\n*   `MouseEvent` 位于 `javafx.scene.input`\
  \ 包中，是 `javafx.scene.input.InputEvent` 的子类。它定义了如 `MOUSE_CLICKED`、`MOUSE_DRAGGED`、`MOUSE_ENTERED`、`MOUSE_EXITED`、`MOUSE_MOVED`、`MOUSE_PRESSED`、`MOUSE_RELEASED`\
  \ 等事件类型，并提供了如 `getX()`、`getY()` 等获取鼠标事件位置的方法。（参见章节 鼠标按下时更改外观）\n*   `void setOnMousePressed(EventHandler<?\
  \ super MouseEvent> value)` 是 `Node` 类提供的便利方法，注册处理 `MouseEvent` `MOUSE_PRESSED`\
  \ 类型的 `EventHandler`。（参见章节 鼠标按下时更改外观）\n*   `MenuBar`、`Menu` 和 `MenuItem` 是基础 JavaFX\
  \ UI 组件，位于 `javafx.scene.control` 包中，用于使用更少的空间设计紧凑视觉的用户界面。（参见章节 添加幻灯片和停止幻灯片菜单）\n\
  *   来自 `javafx.beans.property` 包的一些类：\n    *   `BooleanProperty` 是一个抽象类，派自 `javafx.beans.binding.BooleanExpression`\
  \ 类，实现了 `Property<java.lang.Boolean>` 和 `WritableBooleanValue`。\n    *   `WritableBooleanValue`\
  \ 扩展了 `WritableValue<java.lang.Boolean>`。\n    *   `SimpleBooleanProperty` 派自 `BooleanProperty`\
  \ 类。（参见章节 添加幻灯片和停止幻灯片菜单 和 此处）\n*   `BooleanBinding` 类是位于 `javafx.beans.binding`\
  \ 包中的抽象类，它扩展了 `BooleanExpression` 类并实现了 `Binding<java.lang.Boolean>`。（参见此处）\n\n\n\
  \n\n\n- `BooleanExpression` 类位于 `javafx.beans.binding` 包中，是一个实现 `ObservableBooleanValue`\
  \ 的抽象类，`ObservableBooleanValue` 是扩展 `ObservableValue<java.lang.Boolean>` 的接口。`BooleanExpression`\
  \ 类提供了执行 AND、OR 和 NOT 等逻辑操作的便利方法。\n（参见此处）\n\n- `BooleanExpression` 类中的一些便利方法：\n\n\
  \  `BooleanBinding not()`\n  对此 `BooleanExpression` 执行逻辑 NOT 操作，并返回一个 `BooleanBinding`\
  \ 类型的对象，该对象是 `BooleanExpression` 的直接子类。\n\n  `BooleanBinding or(ObservableBooleanValue\
  \ other)`\n  对此 `BooleanExpression` 和给定的 `ObservableBooleanValue` 执行逻辑 OR 操作，并返回一个\
  \ `BooleanBinding` 类型的对象，该对象是 `BooleanExpression` 的直接子类。\n  （参见此处）\n\n- `Worker<V>`\
  \ 是位于 `javafx.concurrent` 包中的接口，它为并发实现定义了通用 API。\n（参见章节在线程上执行幻灯片）\n\n- 位于 `javafx.concurrent`\
  \ 包中的并发类：\n\n  `Task`\n  实现 `Worker<V>` 接口的抽象类，是一个一次性的 `Worker` 对象。\n\n  `Service`\n\
  \  实现 `Worker<V>` 接口的抽象类，是一个可重用的 `Worker` 对象。\n\n  `ScheduledService`\n  `Service`\
  \ 类的直接子类，允许指定启动和自动重启服务的延迟时长。\n\n  `WorkerStateEvent`\n  `javafx.event.Event` 的子类，定义了事件类型的静态字段，如\
  \ `WORKER_STATE_CANCELLED`、`WORKER_STATE_FAILED`、`WORKER_STATE_READY`、`WORKER_STATE_RUNNING`、`WORKER_STATE_SUCCEEDED`\
  \ 等。当 `Worker` 的状态发生转换时，会触发 `WorkerStateEvent`。\n  （参见章节在线程上执行幻灯片）\n\n- `protected\
  \ abstract V call()` 方法定义在 `Task` 类中，必须重写，并在任务执行时被调用。（参见此处 | 此处 | 此处）\n\n- `protected\
  \ abstract Task<V> createTask()` 方法定义在 `Service` 类中，必须重写，并在服务启动时被调用。（参见此处 | 此处 |\
  \ 此处）\n\n- `Service` 类提供的某些用于注册 `EventHandler` 以处理 Worker 状态事件的便利方法：\n\n  `public\
  \ final void setOnRunning(EventHandler<WorkerStateEvent> value)`\n  `public final\
  \ void setOnSucceeded(EventHandler<WorkerStateEvent> value)`\n  `public final void\
  \ setOnFailed(EventHandler<WorkerStateEvent> value)`\n  `public final void setOnCancelled(EventHandler<WorkerStateEvent>\
  \ value)`\n  （参见章节配置幻灯片服务对象）\n\n- `Worker.State` 是 `javafx.concurrent.Worker` 接口的嵌套类，是一个定义\
  \ `Worker` 状态常量的枚举类型，它们是：`CANCELLED`、`FAILED`、`READY`、`RUNNING`、`SCHEDULED` 和 `SUCCEEDED`。\n\
  \  （参见此处 和 此处）\n\n- `javafx.concurrent` 包中 `Service` 类提供的某些方法：\n\n  `public void\
  \ start()`\n  启动此服务；只有当服务处于 `READY` 状态时才能成功启动。\n\n  `public void reset()`\n  重置此服务；结果服务的状态将转换为\
  \ `READY` 状态。\n\n  `Worker.State getState()`\n  定义在 `Worker` 接口中，获取 `state` 属性的值，该值代表\
  \ `Worker` 的当前状态。\n\n  `public boolean cancel()`\n  定义在 `Worker` 接口中，取消此服务，如果服务取消成功则返回\
  \ `true`。\n  （参见章节为“开始幻灯片”和“停止幻灯片”菜单项实现动作事件的处理程序）\n\n- `javafx.animation` 包中用于在幻灯片之间并行执行淡入淡出效果过渡动画的类：\n\
  \n  `Animation`\n  `Transition`\n  `FadeTransition`\n  `ParallelTransition`\n  （参见章节在幻灯片之间添加淡入过渡）\n\
  \n- `javafx.util.Duration` 类实现了 `java.lang.Comparable<Duration>`，持续时间。（参见此处）\n\n\
  - `public void playFromStart()` 方法由 `Animation` 类提供，从起始位置播放动画。（参见此处）\n\n# 结语\n\n\
