  \    buttonGroup.setOnMouseEntered(new EventHandler<MouseEvent>() {\n      @Override\n\
  \      public void handle(MouseEvent me) {\n        System.out.println(\"Mouse entered\"\
  );\n        // 检查左鼠标键是否按下\n        rect.setFill(me.isPrimaryButtonDown() ? pressed\
  \ : entered);\n      }\n    });\n\n    // 鼠标按下处理器\n    // 当鼠标按下时更改按钮的外观\n    buttonGroup.setOnMousePressed(new\
