  ### 1.2.2 从打开对话框选择图像文件并在 StackPane 中显示\n\n为了导航文件系统，我们使用 `FileChooser` 类，它提供了一个方便的方法\
  \ `showOpenDialog(Window owner)` 用于选择打开的文件。\n\n`Load` 菜单的动作是浏览本地文件系统、选择图像文件并显示在图像区域。\n\
  \n`setOnAction(EventHandler<ActionEvent> value)` 方法由 `MenuItem` 类提供，用于添加事件处理器来处理\
  \ `Load` 菜单的 `ActionEvent`。\n\n为了加载并显示图像，我们结合使用 `ImageView` 类和 `Image` 类。`Image`\
  \ 类根据字符串类型的 URL 加载图像，而 `ImageView` 类在图像区域显示图像。\n\n首先，我们创建一个 `ImageView` 并作为 `StackPane`\
  \ 的子节点。随后，当获取图像文件时，我们将创建一个 `Image` 对象来加载文件，并调用 `ImageView` 类提供的 `setImage(Image\
  \ value)` 方法查看图像。\n\n详细说明如下：当执行 `FileChooser` 的 `showOpenDialog` 方法时，会弹出文件打开对话框。当用户选择文件并点击对话框中的“打开”按钮时，`showOpenDialog`\
  \ 方法会将所选的文件（类型为 `File`）返回给调用者，调用者将其转换为字符串表示的 URL，并根据该 URL 创建 `Image` 对象；此时，图像已加载到内存中，但尚未显示在屏幕上。\n\
  \n\n\n\n以下代码片段实现了这些任务：\n\n### 导入语句\n\n```java\n import java.io.File;\nimport javafx.scene.image.Image;\n\
  import javafx.scene.image.ImageView;\nimport javafx.stage.FileChooser;\n```\n\n\
  ### 列表 1-7. 创建 `FileChooser` 对象、`ImageView` 对象并为 `Load` 菜单项添加 `EventHandler` 以加载图像：\n\
