  \n### 1.4.2 方法二：更改 `fitWidth` 属性和 `fitHeight` 属性的值\n\n`ImageView` 类提供了两个属性，允许我们缩放图像查看尺寸：\n\
  \n*   `fitWidth`\n\n*   `fitHeight`\n\n要更改这两个属性的值，我们我们使用 `setFitWidth` 方法和 `setFitHeight`\
  \ 方法。\n\n如果选择了 `Fit Width` 查看选项，查看宽度将根据当前场景宽度进行设置。以下是代码片段：\n\n列表 1-17. 调用 `setFitWidth`\
  \ 方法使图像查看宽度与场景宽度相同：\n\n\n\n\n\n```\nimageView.setFitWidth(scene.getWidth());\n//\
  \ Besides setFitWidth, must also set fit height to 0\nimageView.setFitHeight(0);\n\
  ```\n\n如果选择了 `Fit Height`（适应高度）查看选项，则查看高度将根据当前场景（scene）的高度减去菜单栏的高度来设置。以下是代码片段：\n\
  \nListing 1-18. 调用 `setFitHeight` 方法将图像查看高度设置为场景高度减去菜单栏的高度：\n\n```\n imageView.setFitHeight(scene.getHeight()\
  \ - menuBar.getHeight());\n// Besides setFitHeight, must also set fit width to 0\
  \ \nimageView.setFitWidth(0); \n```\n\n如果选择了 `Original Size`（原始尺寸）选项，我们需要通过将 `fitWidth`\
  \ 属性和 `fitHeight` 属性均赋值为 `0` 来清除之前设置的值。以下是代码片段：\n\nListing 1-19. 调用 `setFitHeight`\
  \ 和 `setFitHeight` 方法，并传入 `0` 作为值：\n\n```\n // Clear previous set value\nimageView.setFitWidth(0);\n\
  imageView.setFitHeight(0);\n```\n\n以下代码展示了目前方案二的实现情况。\n\nListing 1-20. 监听切换组（toggle\
  \ group）中单选菜单项的变化，调整图像视图 `fitWidth` 和 `fitHeight` 属性的值：\n\n```\n // Listen to the\
  \ change of selection in the toggle group\ngroupOption.selectedToggleProperty().addListener(new\
  \ ChangeListener<Toggle>() {\n  public void changed(ObservableValue<? extends Toggle>\
  \ ov,\n          Toggle old_toggle, Toggle new_toggle) {\n    if (groupOption.getSelectedToggle()\
  \ != null) {\n      RadioMenuItem choiceItem = (RadioMenuItem) groupOption.getSelectedToggle();\n\
  \      if (choiceItem == fitWidth) {\n        imageView.setFitWidth(scene.getWidth());\n\
  \        // Besides setFitWidth, must also set fit height to 0\n        imageView.setFitHeight(0);\n\
  \      } else if (choiceItem == fitHeight) {\n        imageView.setFitHeight(scene.getHeight()\
  \ - menuBar.getHeight());\n        // Besides setFitHeight, must also set fit width\
  \ to 0 \n        imageView.setFitWidth(0); \n      } else {\n        // Clear previous\
  \ set value\n        imageView.setFitWidth(0);\n        imageView.setFitHeight(0);\n\
  \      }\n    } \n  }\n}); \n```\n\n### 1.4.2.1 捕获场景缩放事件以调整图像查看尺寸\n\n为了完成方案二，还有一个问题需要解决：图像的查看大小取决于场景的大小，初始设置为\
  \ 600 像素乘以 400 像素，这可能会发生动态变化。当用户拖动应用程序窗口的边缘或角时，场景会被调整大小。我们需要捕获此缩放事件以相应调整图像的查看大小。也就是说，如果当前选查看选项是\
  \ `Fit Width`（适应宽度），则场景的新宽度将作为图像视图对象 `fitWidth` 属性的值。如果选的是 `Fit Height`，则场景的新高度减去菜单栏的高度将作为\
  \ `fitHeight` 属性的值。\n\n为了响应场景大小的变化，我们分别为 `width` 属性和 `height` 属性添加了监听器，以捕获场景的缩放事件。\n\
  \n以下代码片段完成了这些任务：\n\nListing 1-21. 监听场景 `width` 和 `height` 的变化，调整图像视图的 `fitWidth`\
  \ 和 `fitHeight`：\n\n```\n // Listen to the width change of scene and adjust fitWidth\
  \ of image view\nscene.widthProperty().addListener(new ChangeListener<Object>()\
  \ {\n  public void changed(ObservableValue o, Object oldVal, Object newVal) {\n\
  \    if (fitWidth.isSelected()) {\n      imageView.setFitWidth((double)newVal);\n\
  \    }\n  }\n});\n// Listen to the height change of scene and adjust fitHeight of\
  \ image view   \nscene.heightProperty().addListener(new ChangeListener<Object>()\
  \ {\n  public void changed(ObservableValue o, Object oldVal, Object newVal) {\n\
  \    if (fitHeight.isSelected()) {\n      imageView.setFitHeight((double) newVal\
  \ - menuBar.getHeight());\n    }\n  }\n});\n```\n\n### 1.4.2.2 `ImageViewer` 类的完整源代码\n\
  \n方案二的 `ImageViewer` 类的完整源代码如下：\n\nListing 1-22. `ImageViewer` 的完整源代码如下：\n\n\n\n\
  \n\n```java\npackage imageviewer;\n\nimport java.io.File;\nimport javafx.application.Application;\n\
  import javafx.application.Platform; \nimport javafx.beans.value.ChangeListener;\n\
  import javafx.beans.value.ObservableValue;\nimport javafx.event.ActionEvent;\nimport\
  \ javafx.event.EventHandler;\nimport javafx.scene.Scene;\nimport javafx.scene.control.Menu;\n\
  import javafx.scene.control.MenuBar;\nimport javafx.scene.control.MenuItem;\nimport\
