  )\n\n## 2.4 实现鼠标点击事件处理器\n\n在第使用简便方法注册事件处理器来处理鼠标事件 节中，我们已经演示了如何为鼠标点击事件注册事件处理器。在本节中，我们将注册事件处理器并实现当鼠标点击按钮时被调用的\
  \ `handle` 方法。如果点击了 `Next` 按钮，将加载当前加载文件的下一张图像文件；如果点击了 `Previous` 按钮，将加载当前加载文件之前的图像文件。\n\
  \n在妥善地执行这些任务之前，我们将配置一个 `FileChooser`，仅显示扩展名匹配指定过滤器的文件，并建立一个存在当前目录的文件列表，该列表每当从 `FileChooser`\
  \ 的文件打开对话框打开图像文件时都会创建一次。\n\n### 2.4.1 配置 `FileChooser`\n\n要配置 `FileChooser`，我们使用\
  \ `FileChooser.ExtensionFilter` 类来定义文件扩展名过滤器，以显示具有以下扩展名的文件：“*.bmp”、“*.gif”、“*.jpeg”、“*.jpg”、“*.png”。\n\
  \n调用 `FileChooser` 类提供的 `getExtensionFilters` 方法来获取类型为 `ObservableList<FileChooser.ExtensionFilter>`\
  \ 的列表，然后使用 `addAll` 方法添加所需数量的过滤器。我们定义了一个 `FileUtils` 类来解决这个问题。代码如下：\n\n列表 2-9. 定义\
  \ `FileUtils` 类，提供一个静态方法 `configure` 为给定的 `FileChooser` 添加文件扩展名过滤器：\n\n```\n package\
  \ imageviewer;\n\nimport javafx.stage.FileChooser;\n\n/**\n * File Name: FileUtils.java\n\
  \ * (位于目录: ImageViewer1.1/src/example4/imageviewer/)\n *\n * @author Shufen Kuo\n\
  \ */\n\npublic class FileUtils {\n\n  /**\n   * 定义文件扩展名过滤器以过滤支持的图像文件，\n   * 匹配扩展名为文件：\n\
  \   * .bmp, .gif, .jpeg, .jpg 和 .png\n   * @param fileChooser \n   */\n  static\
  \ void configure(FileChooser fileChooser) {\n    fileChooser.getExtensionFilters().addAll(\n\
  \        new FileChooser.ExtensionFilter(\"All Images\",\n          \"*.bmp\", \"\
  *.gif\", \"*.jpeg\", \"*.jpg\", \"*.png\"),\n        new FileChooser.ExtensionFilter(\"\
  All Files\", \"*.*\"),\n        new FileChooser.ExtensionFilter(\"BMP\", \"*.bmp\"\
  ),\n        new FileChooser.ExtensionFilter(\"GIF\", \"*.gif\"),\n        new FileChooser.ExtensionFilter(\"\
  JPEG\", \"*.jpeg\"),\n        new FileChooser.ExtensionFilter(\"JPG\", \"*.jpg\"\
  ),\n        new FileChooser.ExtensionFilter(\"PNG\", \"*.png\"));    \n    // 将\
  \ \".\" 设置为默认目录\n    fileChooser.setInitialDirectory(new File(\".\"));\n  }  \n\
  }\n```\n\n我们在上述代码使用的 `FileChooser.ExtensionFilter` 构造函数接受两个参数，第一个是弹出文件打开对话框时显示在\
  \ `\"Files of types:\"` 字段中的描述，第二个是变长参数 `String` 类型，每个参数都指定一个符合正则表达式语法的字符串。\n\n\
  在 `FileUtils.configure` 方法内部，除了添加文件扩展名过滤器外，我们还将当前目录设置为初始目录：\n\n`fileChooser.setInitialDirectory(new\
  \ File(\".\"));`\n\n从这里调用了在 `FileUtils` 类中定义的静态方法 `configure`：\n\n```\n // 创建文件选择器\n\
  \    final FileChooser fileChooser = new FileChooser();\n    fileChooser.setTitle(\"\
  Open an Image File\");\n    FileUtils.configure(fileChooser);\n```\n\n`FileChooser`\
  \ 的功能和外观取决于操作系统。图 2-9 显示了 Windows XP 中的 `FileChooser`，图 2-10 显示了 Windows 8.1 中的\
  \ `FileChooser`。\n\n图 2-9. 文件打开对话框（Windows XP 中）快照，扩展名过滤器列表中添加的第一个过滤器 `\"All Images\"\
  ` 在点击组合框时显示在 `\"Files of types:\"` 字段中。\n\n![](img/image00146.jpeg \"file_chooser_filter.jpg\"\
  )\n\n图 2-10. 文件打开对话框（Windows 8.1 中）快照，代码中与正则表达式 \"*.gif\" 关联的名称 `\"GIF\"` 显示在字段中。\n\
  \n![](img/image00146.jpeg \"file_chooser_filter.jpg\")\n\n通常应用程序希望 `FileChooser`\
  \ 记住其访问过的目录。这里是这样做的方法：\n\n列表 2-10. 在事件处理器的 `handle` 方法中设置 `FileChooser` 的访问目录：\n\
  \n```\n // 为菜单项添加动作\n    load.setOnAction(new EventHandler<ActionEvent>() {\n  \
  \    @Override\n      public void handle(ActionEvent e) {\n        // 打开文件选择器\n\
  \        File file = fileChooser.showOpenDialog(stage);\n        if (file != null)\
  \ {\n          // 设置访问目录\n          File lastDir = file.getParentFile();\n     \
  \     fileChooser.setInitialDirectory(lastDir);\n          String url = file.toURI().toString();\n\
  \          Image image = new Image(url);\n          imageView.setImage(image);\n\
  \        }\n      }\n    });\n```\n\n### 2.4.2 创建迭代器遍历当前目录的文件\n\n为了从 `FileChooser`\
  \ 的文件对话框打开图像文件时建立当前目录的文件列表，我们将使用 JDK 7 引入的 `java.nio.file` 包提供的 API。\n\n`Files`\
  \ 类提供的以下静态方法\n\n```\nstatic DirectoryStream<Path> newDirectoryStream(Path dir, String\
  \ glob)\n```\n\n打开指定的目录并返回 `DirectoryStream<Path>`。`DirectoryStream` 类型实现了 `Iterable`，因此可以使用\
  \ for-each 语法遍历目录中的文件。\n\n以下是读取目录并逐个将文件列表的代码片段：\n\n```\n List<Path> list = new ArrayList<>();\n\
  \n    try (DirectoryStream<Path> stream = Files.newDirectoryStream(dir,\n      \
  \  \"*.{bmp,gif,jpeg,jpg,png}\")) {\n      for (Path entry : stream) {\n       \
  \ // 忽略目录内的子目录\n        if (Files.isDirectory(entry, LinkOption.NOFOLLOW_LINKS))\n\
  \          continue;\n        list.add(entry);\n      }\n    } catch (DirectoryIteratorException\
  \ de) {\n      throw de.getCause();\n    }\n```\n\n以下是静态方法 `listIterator` 的完整代码，它读取目录、逐个将文件添加到\
  \ `List`、按字母排序并返回一个指向下一个可用文件的 `ListIterator`。该方法定义在 `FileUtils` 类中。\n\n导入语句：\n\n\
  ```\n import java.io.IOException;\nimport java.nio.file.DirectoryIteratorException;\n\
  import java.nio.file.DirectoryStream;\nimport java.nio.file.Files;\nimport java.nio.file.LinkOption;\n\
  import java.nio.file.Path;\nimport java.util.ArrayList;\nimport java.util.Collections;\n\
  import java.util.Comparator;\nimport java.util.List;\nimport java.util.ListIterator;\n\
  import javafx.stage.FileChooser;\n```\n\n\n\n\n列表 2-11. 在 `FileUtils` 类中定义的静态方法\
  \ `listIterator`，它读取目录，将文件逐个添加到列表中，对列表进行排序，并返回 `ListIterator` 实例：\n\n```java\n /**\n\
  \   * 使用 Files.newDirectoryStream(Path, String) 读取目录，\n   * 将文件添加到列表，返回指向参数中指定\n\
  \   * 文件的 listIteratior，即第一次调用 next()\n   * 时返回指定的文件，\n   * 文件列表按字母顺序排序，\n   * newDirectoryStream\
  \ 方法的第二个参数是\n   * 用于过滤匹配模式的文件的 glob 模式：\n   *   \"*.{bmp,gif,jpeg,jpg,png}\",\n\
  \   * 我们只对后缀为以下的文件感兴趣：\n   *  .bmp, .gif, .jpeg, .jpg 和 .png。\n   * \n   * @param\
  \ file\n   * @return\n   * @throws IOException \n   */\n  static ListIterator<Path>\
  \ listIterator(Path file) throws IOException {\n    Path dir = file.getParent();\n\
  \    List<Path> list = new ArrayList<>();\n\n    try (DirectoryStream<Path> stream\
  \ = Files.newDirectoryStream(dir,\n        \"*.{bmp,gif,jpeg,jpg,png}\")) {\n  \
  \    for (Path entry : stream) {\n        // 忽略 dir 内部的子目录\n        if (Files.isDirectory(entry,\
  \ LinkOption.NOFOLLOW_LINKS))\n          continue;\n        list.add(entry);\n \
  \     }\n    } catch (DirectoryIteratorException de) {\n      throw de.getCause();\n\
  \    }\n\n    // Path 中的 compareTo 方法按顺序比较两个抽象路径。\n    Collections.sort(list, new\
  \ Comparator<Path>() {\n      public int compare(Path o1, Path o2) {\n        return\
  \ o1.getFileName().compareTo(o2.getFileName());\n      }\n    });\n\n    int index\
  \ = 0; // 当前文件在列表中的索引\n    // 查找选择文件的索引\n    for (Path entry : list) {\n       if\
  \ (entry.equals(file)) break;\n       index++;\n    }\n    if (index == list.size())\
  \ {\n      // 文件不在列表中\n      index = 0;\n    } \n    return list.listIterator(index);\
  \ \n  }\n```\n\n我们将在下一节描述 `FileUtils.listIterator(Path file)` 方法的使用。\n\n### 2.4.3\
  \ 在 `ImageViewer` 类中定义属性\n\n在本节中，我们将演示如何在类中定义属性。在应用程序的入口点 `ImageViewer` 类中，我们定义了以下三个属性：\n\
  \n`listIterator`\n\n类型为 `ObjectProperty<ListIterator<Path>>`。`listIterator(Path\
  \ file)` 方法是 `FileUtils` 类中定义的静态方法，通过 `Load` 菜单项的操作处理器调用，以获取 `ListIterator` 实例并设置为该属性的值。\n\
