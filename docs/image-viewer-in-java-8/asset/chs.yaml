  \ 类的源代码\n\n## 2.6 总结\n\n## 2.1 添加 `Next` 按钮\n\n我们没有使用内置 JavaFX 控件中的 `Button` 类，而是通过使用以下类来实现自定义工具类，从而设计一个自定义按钮：\n\
  \n* `Group`\n  作为父级容器。\n\n* `Shape`\n    * `Rectangle`\n      作为边界框。\n    * `Polygon`\n\
  \      作为 `Next` 图标的视觉标识。\n\n* `LinearGradient` 和 `Color`\n  用于填充背景和描绘边框。\n\n* `EventHandler`\
  \ 和 `MouseEvent`\n  用于处理鼠标进入、点击和离开事件。\n\n### 2.1.1 使用 `Group` 作为父级容器\n\n`Group`\
  \ 类位于 `javafx.scene` 包中，是 `javafx.scene.Parent` 的子类。`Group` 的功能非常直观。它允许你将各种节点组合在一起而不施加自动布局。下面的代码段显示了如何向\
  \ `Group` 添加节点：\n\n```\nGroup buttonGroup = new Group();\nRectangle rect = new Rectangle(0,\
  \ 0, 25, 35);\nPolygon polygon = new Polygon();\nbuttonGroup.getChildren().addAll(rect,\
  \ polygon);\n```\n\n关于 `Group` 特性的更多信息，请参阅卷Ⅱ：开发交互式形状绘制工具，第 1 章 线路绘制器，第 1.1.1 节在\
  \ BorderPane 中心添加 Pane 作为绘板。\n\n### 2.1.2 使用 `Shape` 类渲染 2D 几何基元\n\nJavaFX 提供了一个非常有吸引力的类\
  \ `Shape` 用于渲染 2D 几何基元。它是一个继承自 `javafx.scene.Node` 类的抽象类，作为某些基础 2D 几何形状的基类。它的直接子类有：`Arc`、`Circle`、`CubicCurve`、`Ellipse`、`Line`、`Path`、`Polygon`、`Polyline`、`QuadCurve`、`Rectangle`、`SVGPath`、`Text`。`Shape`\
  \ 类定义了 2D 几何基元的通用属性，如 `fill`、`stroke`、`strokeType`、`strokeWidth` 等。\n\n为形状分别设置 `fill`\
  \ 和 `stroke` 属性的值是非常常见的。使用 `setFill` 方法指定渲染背景的颜色，使用 `setStroke` 方法指定渲染边框的颜色。请注意，Line、Polyline\
  \ 和 Path 的 `fill` 属性的默认值为 `null`，而其他形状为 `Color.BLACK`；Line、Polyline 和 Path 的 `stroke`\
  \ 属性的默认值为 `Color.BLACK`，而其他形状为 `null`。\n\n现在我们将展示你如何利用 `Shape` 的功能来实现自定义的 `Next`\
  \ 按钮。\n\n### 2.1.3 使用 `Rectangle` 形状作为自定义按钮的边界框\n\n以下是完成这些操作的代码：使用带有参数 x, y, width\
  \ 和 height 的构造函数创建一个 Rectangle，并为每个所需的属性设置适当的值。\n\n列表 2-1。创建一个 `Rectangle` 并设置这些属性的值：`fill`、`stroke`、`arcHeight`、`arcWidth`：\n\
  \n```\nRectangle rect = new Rectangle(0, 0, 25, 35);\nrect.arcHeight = 10;\nrect.arcWidth\
  \ = 10;\nrect.setFill(Color.GRAY);\nrect.setStroke(Color.LIGHTGRAY);\n```\n\n###\
  \ 2.1.4 绘制背景和边框\n\n`LinearGradient` 和 `Color` 位于 `javafx.scene.paint` 包中，是 `Paint`\
  \ 的两个子类，用于绘制背景和边框。\n\n`LinearGradient` 和 `Color` 位于 `javafx.scene.paint` 包中，是 `Paint`\
  \ 的两个子类，用于绘制背景和边框。\n\n`LinearGradient` 和 `Color` 位于 `javafx.scene.paint` 包中，是 `Paint`\
  \ 的两个子类，用于绘制背景和边框。\n\n### 2.1.5 设置 `arcHeight` 和 `arcWidth` 属性渲染圆矩形\n\n`arcHeight`\
  \ 和 `arcWidth` 是 `Rectangle` 类中定义的属性，用于指定矩形形状四个角弧的高度和宽度直径。它们的默认值为 `0.0`。\n\n接下来的图展示了如何为\
  \ `arcHeight` 和 `arcWidth` 属性设置正确的值以渲染圆矩形。与圆矩形角弧重叠的圆和椭圆是为了方便比较。\n\n\n\n\n\n我们没有使用图像作为\
  \ `Next` 按钮的视觉标识，而是实例化了一个箭头形状的 `Polygon`。使用 `getPoints()` 方法获取一个类型为 `ObservableList<Double>`\
  \ 的列表，然后使用 `Collection` 接口中定义的内置工具类来操作列表内容。存储在 `Double` 类型值数组中的一系列 x 和 y 坐标被添加到列表中，代表\
  \ `Polygon` 的顶点。\n\n`Color.WHITE` 是 `Color` 类中定义的许多 `Color` 类型的静态字段之一，我们选择它作为填充\
  \ `Polygon` 背景的颜色，并使用静态方法 `Color.web` 创建了一种深蓝色的颜色，用以绘制 `Polygon` 的边框颜色。\n\n以下是完成这些任务的代码段：\n\
  \nListing 2-2. 创建一个 `Polygon` 并为属性 `fill` 和 `stroke` 赋值：\n\n```\n Polygon polygon\
  \ = new Polygon();\nDouble[] dArray = {\n      5.0, 2.0,\n      22.0, 17.0,\n  \
  \    5.0, 32.0,\n      5.0, 25.0,\n      14.0, 17.0,\n      5.0, 9.0};\npolygon.getPoints().addAll(dArray);\n\
  polygon.setFill(Color.WHITE);\npolygon.setStroke(Color.web(\"#436B8B\"));\n```\n\
  \n下面的快照显示了上述代码渲染的 `Polygon`：\n\n图 2-3. 作为 `Next` 图标的多边形快照。\n\n![](img/image00140.jpeg\
  \ \"next_polygon.jpg\")\n\n### 2.1.7 为 `Node` 设置 `Cursor` 属性值\n\n`Node` 类定义的 `cursor`\
  \ 允许你更改此节点及其所有后代节点的鼠标指针。`Cursor` 类位于 `javafx.scene` 包中并继承自 `java.lang.Object`，它通过\
  \ `Cursor` 类型的静态字段定义了一些可选鼠标指针，例如 `CLOSED_HAND`、`CROSSHAIR`、`DEFAULT`、`HAND`、`OPEN_HAND`、`TEXT`、`WAIT`\
  \ 等。如果没有显式设置 `cursor` 属性的值，则使用默认的鼠标指针（箭头形状）。\n\n我们使用 `Cursor.OPEN_HAND` 作为 `Next`\
  \ 按钮的鼠标指针。以下是代码段：\n\n```\n Group buttonGroup = new Group();\nbuttonGroup.setCursor(Cursor.OPEN_HAND);\n\
  ```\n\n### 2.1.8 使用便利方法注册事件处理器以处理鼠标事件\n\n`EventHandler<T extends Event>` 是继承自 `java.util.EventListener`\
  \ 的接口，它定义了 `handle(`T` 事件) 方法，用于在指定事件发生时被调用。\n\n我们将使用 `Node` 类提供的便利方法来注册事件处理器，以处理鼠标事件类型，如\
  \ `MOUSE_CLICKED`、`MOUSE_ENTERED` 和 `MOUSE_EXITED`，这些是 `MouseEvent` 类（`javafx.scene.input.InputEvent`\
  \ 的子类）中定义的 `EventType` 静态字段。\n\n以下是用于为上述事件注册事件处理器的便利方法：\n\n* `public final void\
  \ setOnMouseClicked(EventHandler<? super MouseEvent> value)`\n    设置 `Node` 类中定义的\
  \ `OnMouseClicked` 属性的值，提供 `handle` 方法的实现，该方法在鼠标点击此节点时被调用。\n\n* `public final void\
  \ setOnMouseEntered(EventHandler<? super MouseEvent> value)`\n    设置 `Node` 类中定义的\
  \ `OnMouseEntered` 属性的值，提供 `handle` 方法的实现，该方法在鼠标进入此节点时被调用。\n\n* `public final void\
  \ setOnMouseExited(EventHandler<? super MouseEvent> value)`\n    设置 `Node` 类中定义的\
  \ `OnMouseExited` 属性的值。提供 `handle` 方法的实现，该方法在鼠标离开此节点时被调用。\n\n以下是显示这些便利方法用的代码段：\n\
  \nListing 2-3. 使用便利方法注册事件处理器：\n\n```\n // 注册鼠标点击事件处理器\n    buttonGroup.setOnMouseClicked(new\
  \ EventHandler<MouseEvent>() {\n      @Override\n      public void handle(MouseEvent\
  \ me) {\n        System.out.println(\"Mouse clicked\");\n      }\n    });\n\n  \
  \  // 注册鼠标进入事件处理器\n    // 当鼠标进入时改变按钮的外观\n    buttonGroup.setOnMouseEntered(new EventHandler<MouseEvent>()\
  \ {\n      @Override\n      public void handle(MouseEvent me) {\n        System.out.println(\"\
  Mouse entered\");\n        rect.setFill(lgEntered);\n        polygon.setFill(Color.web(\"\
  #436B8B\"));\n        polygon.setStroke(Color.WHITE);\n      }\n    });\n\n    //\
  \ 注册鼠标离开事件处理器\n    // 当鼠标离开时恢复原始外观\n    buttonGroup.setOnMouseExited(new EventHandler<MouseEvent>()\
  \ {\n      @Override\n      public void handle(MouseEvent me) {\n        System.out.println(\"\
  Mouse exited\");\n        rect.setFill(lg);\n        polygon.setFill(Color.WHITE);\n\
  \        polygon.setStroke(Color.web(\"#436B8B\"));\n      }\n    }); \n```\n\n\
  ### 2.1.9 `createNextButton()` 方法的完整源代码\n\n导入语句：\n\n```\n import javafx.scene.Cursor;\n\
