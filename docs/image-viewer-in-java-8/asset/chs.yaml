  *   启动幻灯片。\n*   在幻灯片运行时，执行以下操作：\n    *   来回选择不同的 `View` 选项。\n    *   点击 `Previous`\
  \ 按钮或 `Next` 按钮。\n    *   从 `FileChooser` 的文件打开对话框在不同的图像目录中加载另一个图像文件。\n\n图 3-11.\
