  \ \"next_button_pressed.jpg\")\n\n## 3.3 添加幻灯片功能\n\n一旦从 `FileChooser` 的文件打开对话框打开图像文件，应用程序将获取当前目录下的图像文件列表。一个实用的功能是允许用户逐个浏览这些图像，而无需手动点击\
  \ `Next` 按钮。实现幻灯片机制的步骤所示。\n\n### 3.3.1 添加“开始幻灯片”和“停止幻灯片”菜单项\n\n这里使用的最简单 GUI 是 `MenuItem`。在菜单栏的\
  \ `Option` 菜单中添加了两个菜单项：`Start Slideshow` 和 `Stop Slideshow`，它们初始状态都是禁用的。为了区分是否正在运行幻灯片，在\
  \ `ImageViewer` 类中定义了一个作为类字段、类型为 `BooleanProperty` 的变量 `isSlideshowOn`，并初始化为 `false`。以下代码段展示了如何实现这些功能：\n\
  \n导入语句：\n\n```\n import javafx.beans.property.BooleanProperty;\nimport javafx.beans.property.SimpleBooleanProperty;\n\
  ```\n\n列表 3-14. 添加 `Start Slideshow` 和 `Stop Slideshow` 菜单项：\n\n```\n public class\
  \ ImageViewer extends Application {\n\n    ...\n\n  final BooleanProperty isSlideshowOn\
  \ = new SimpleBooleanProperty(false);\n\n    ...\n\n  @Override\n  public void start(final\
  \ Stage stage) {\n\n    ...\n\n    // 创建开始/停止幻灯片的菜单项\n    final MenuItem startSlide\
  \ = new MenuItem(\"Start Slideshow\");\n    final MenuItem stopSlide = new MenuItem(\"\
  Stop Slideshow\");\n\n    startSlide.disableProperty().bind(isSlideshowOn.or(\n\
  \        nextButton.disableProperty()));\n    stopSlide.disableProperty().bind(isSlideshowOn.not().or(\n\
  \        nextButton.disableProperty()));\n\n    // 为开始幻灯片菜单项添加事件处理器\n    startSlide.setOnAction(new\
  \ EventHandler<ActionEvent>() {\n      @Override\n      public void handle(ActionEvent\
  \ ae) {\n        System.out.println(\"Start Slideshow...\");\n      }\n    });\n\
  \n    // 为停止幻灯片菜单项添加事件处理器\n    stopSlide.setOnAction(new EventHandler<ActionEvent>()\
  \ {\n      @Override\n      public void handle(ActionEvent ae) {\n        System.out.println(\"\
  Stop Slideshow...\");\n      }\n    });    \n\n    // 将选项菜单添加到菜单栏\n    menuOption.getItems().addAll(menuView,\
  \ startSlide, stopSlide);\n\n      ... \n```\n\n#### 3.3.1.1 绑定菜单项的禁用属性\n\n由于以下\
  \ `bind` 语句，初始时 `startSlide` 和 `stopSlide` 菜单项是禁用的：\n\n```\n startSlide.disableProperty().bind(isSlideshowOn.or(\n\
  \        nextButton.disableProperty()));\n    stopSlide.disableProperty().bind(isSlideshowOn.not().or(\n\
  \        nextButton.disableProperty())); \n```\n\n在上述绑定语句中，使用了两个逻辑操作——`or` 和 `not`——来计算禁用属性的值。`javafx.beans.binding.BooleanExpression`\
  \ 类是一个实现 `ObservableBooleanValue` 的抽象类，它提供了这些方法：\n\n`public BooleanBinding not()`\
  \ 方法\n\n该方法对此 `BooleanExpression` 执行逻辑非（NOT）操作，并返回一个 `BooleanBinding` 类型的对象，该对象是\
  \ `BooleanExpression` 的直接子类。\n\n`public BooleanBinding or(ObservableBooleanValue\
  \ other)` 方法\n\n该方法对此 `BooleanExpression` 和给定的 `ObservableBooleanValue` 执行逻辑或（OR）操作，并返回一个\
  \ `BooleanBinding` 类型的对象，该对象是 `BooleanExpression` 的直接子类。\n\n如果当前正在运行幻灯片或 `Next`\
  \ 按钮禁用，则 `Start Slideshow` 菜单项被禁用。同样，如果幻灯片未运行或 `Next` 按钮禁用，则 `Stop Slideshow` 菜单项被禁用。记住，当没有后续图像可以查看时，`Next`\
  \ 按钮是禁用的。\n\n图 3-9 初始 `Option` 菜单外观的截图，`Start Slideshow` 和 `Stop Slideshow` 菜单项均为禁用状态。\n\
  \n![](img/image00157.jpeg \"start_stop_disabled.jpg\")\n\n图 3-10 加载图像文件后 `Option`\
  \ 菜单外观的截图，`Start Slideshow` 菜单项启用，因为没有开启幻灯片且至少有一个后续文件可以查看；而 `Stop Slideshow` 菜单项被禁用，因为没有开启幻灯片。\n\
  \n![](img/image00158.jpeg \"start_slideshow_enabled.jpg\")\n\n### 3.3.2 在另一个线程上执行幻灯片\n\
  \n将耗时任务委托给另一个线程是一种良好的编程习惯，这样 UI 线程（也称为 Java FX 线程）始终对用户的操作做出响应。\n\n`javafx.concurrent`\
  \ 包提供了 `Task` 和 `Service` 两个类，它们都实现了 `Worker` 接口，用于方便开发多线程 JavaFX 应用程序。\n\n以下是位于\
  \ `javafx.concurrent` 包中的并发相关类：\n\n`Task`\n\n一个扩展 `java.util.concurrent.FutureTask`\
  \ 并实现 `Worker<V>` 接口的抽象类，它是一个一次性的 `Worker` 对象，不可复用。由于其父类 `FutureTask` 实现了 `Runnable`\
  \ 接口，它也是一个 `Runnable` 对象。\n\n要开始执行 `Task`，你可以使用 `java.lang.Thread` 类的 API 或派自 `Executor`\
  \ 和 `ExecutorService` 接口的 API，它们都位于 `java.util.concurrent` 包中。\n\n`Service`\n\n\
  一个扩展 `java.lang.Object` 并实现 `Worker<V>` 接口的抽象类，是一个可复用的 `Worker` 对象。`Service` 类提供了\
  \ `start()`、`cancel()`、`reset()` 和 `restart()` 等方法来操作此服务。\n\n`ScheduledService`\n\
  \n`Service` 的直接子类，允许指定自动启动和重启服务的延迟。\n\n`WorkerStateEvent`\n\n`javafx.event.Event`\
  \ 的子类，定义了 `EventType` 的静态字段，如 `WORKER_STATE_CANCELLED`、`WORKER_STATE_FAILED`、`WORKER_STATE_READY`、`WORKER_STATE_RUNNING`、`WORKER_STATE_SUCCEEDED`\
  \ 等。当 `Worker` 的状态发生变化时会触发 `WorkerStateEvent`。\n\n考虑我们的情况：首次加载文件时创建文件列表，假设列表包含一个或多个后续文件，此时\
  \ `Start Slideshow` 菜单项启用，用户可以启动幻灯片，在幻灯片运行时取消它，稍后再次重启。为了满足这种场景，我们倾向于使用可复用的 `Service`\
  \ 对象而不是一次性的 `Task` 对象。\n\n#### 3.3.2.1 创建扩展 `Service` 类的 `SlideshowService` 类\n\n\
  我们需要创建一个扩展 `Service<V>` 的类。当 `Service` 启动时，它会执行一个 `Task`。需要重写下面的 `createTask` 方法：\n\
  \n```\nprotected abstract Task<V> createTask()\n```\n\n在 `createTask()` 方法中，通过重写\
  \ `call()` 方法并创建一个 `Task` 对象返回给调用者。\n\n`Task` 中的 `call()` 方法承担幻灯片的任务，基本上包含一个 `while`\
  \ 循环，逐个加载图像，直到满足以下条件之一：文件列表中没有更多后续图像，或者幻灯片被用户取消。\n\n以下列表演示了如何创建一个可复用的 `SlideshowService`（`Service`\
  \ 类的子类），以执行幻灯片任务。\n\n列表 3-15. 创建 `SlideshowService` 类：\n\n\n\n\n\n```java\n package\
  \ imageviewer;\n\nimport java.nio.file.Path;\nimport java.util.ListIterator;\nimport\
  \ javafx.beans.property.ObjectProperty;\nimport javafx.beans.property.SimpleObjectProperty;\n\
  import javafx.beans.property.SimpleStringProperty;\nimport javafx.beans.property.StringProperty;\n\
  import javafx.beans.value.ChangeListener;\nimport javafx.beans.value.ObservableValue;\n\
  import javafx.concurrent.Service;\nimport javafx.concurrent.Task;\nimport javafx.scene.image.Image;\n\
  \n/**\n * File Name: SlideshowService.java\n * (in directory: ImageViewer1.2/src/example4/imageviewer/)\n\
  \ *\n * @author Shufen Kuo\n */\n\npublic class SlideshowService extends Service<Void>\
  \ {\n  private ObjectProperty<Image> image;\n  private ObjectProperty<ListIterator<Path>>\
  \ iterator;\n  private StringProperty imageName;\n  private ListIterator<Path> it;\n\
  \n  public SlideshowService() {\n    this(new SimpleObjectProperty<ListIterator<Path>>(),\n\
  \        new SimpleObjectProperty<Image>(),\n        new SimpleStringProperty());\n\
  \  }\n\n  public SlideshowService(ObjectProperty<ListIterator<Path>> iterator,\n\
  \      ObjectProperty<Image> image, StringProperty imageName) {\n    this.image\
  \ = image;\n    this.imageName = imageName;\n    this.iterator = iterator;\n   \
  \ iterator.addListener(new ChangeListener<ListIterator<Path>>() {\n      @Override\n\
  \      public void changed(ObservableValue<? extends ListIterator<Path>> o,\n  \
  \        ListIterator<Path> oldVal, ListIterator<Path> newVal) {\n        it = newVal;\n\
  \      }\n    });    \n  }\n\n  public Image getImage() {\n    return image.get();\n\
  \  }\n\n  public void setImage(Image value) {\n    image.set(value);\n  }\n\n  public\
  \ ObjectProperty<Image> imageProperty() {\n    return image;\n  }\n\n  public ListIterator<Path>\
  \ getIterator() {\n    return iterator.get();\n  }\n\n  public void setListIterator(ListIterator<Path>\
  \ value) {\n    iterator.set(value);\n  }\n\n  public ObjectProperty<ListIterator<Path>>\
  \ iteratorProperty() {\n    return iterator;\n  }\n\n  public String getImageName()\
  \ {\n    return imageName.get();\n  }\n\n  public void setImageName(String value)\
  \ {\n    imageName.set(value);\n  }\n\n  public StringProperty imageNameProperty()\
  \ {\n    return imageName;\n  }\n\n  @Override\n  protected Task<Void> createTask()\
  \ {\n    return new Task<Void>() {\n      @Override\n      protected Void call()\
  \ {\n        if (it == null) return null;\n        while (it.hasNext()) {\n    \
  \      if (isCancelled()) {\n            updateMessage(\"Cancelled\");\n       \
  \     break;\n          }\n          String url = it.next().toUri().toString();\n\
  \          setImage(new Image(url));\n          setImageName(url.substring(\n  \
  \            url.lastIndexOf(\"/\") + 1).replaceAll(\"%20\", \" \"));\n        \
  \  // Pause for 3000 ms\n          try {\n            Thread.sleep(3000);\n    \
  \      } catch (InterruptedException ex) {\n            if (isCancelled()) {\n \
  \             updateMessage(\"Cancelled\");\n              break;\n            }\n\
  \          }\n        }\n        return null;\n      }\n    };    }  \n}\n```\n\n\
  以下语句创建了一个 `SlideshowService` 对象。\n\n```java\n // 创建一个可用的 Worker 对象\n  final SlideshowService\
  \ service = new SlideshowService(listIterator,\n      curImage, imageName);\n```\n\
  \n向 `SlideshowService` 类的构造函数传递了三个参数：\n\n`listIterator`\n\n类型为 `ObjectProperty<ListIterator<Path>>`，指定一个\
  \ `ListIterator`，用于遍历文件列表。该列表是在从文件选择器的文件打开对话框打开图像文件时创建的。\n\n`curImage`\n\n类型为 `ObjectProperty<Image>`，与\
  \ `ImageView` 对象的 `image` 属性绑定。\n\n`imageName`\n\n类型为 `StringProperty`，与文本对象 `statusText`\
  \ 的 `text` 属性绑定，用于在状态栏中显示图片名称。\n\n### 3.3.2.2 配置幻灯片服务对象\n\n我们定义了一个 `configureSlideshow`\
  \ 方法来执行配置。一旦创建了服务对象，就会调用该方法执行这些工作：\n\n2. 将 `ImageViewer` 类中定义的 `isSlideshowOn` 属性与\
  \ `service` 的 `running` 属性绑定。当且仅当服务正在运行时，`isSlideshowOn` 属性的值为 `true`。\n\n```java\n\
  BooleanProperty isSlideshowOn = new SimpleBooleanProperty(false);\nSlideshowService\
  \ service = new SlideshowService(listIterator,\n  curImage, imageName);\nisSlideshowOn.bind(service.runningProperty());\n\
  ```\n\n3. 注册事件处理器来处理以下事件类型的 `WorkerStateEvent`：`WORKER_STATE_RUNNING`、`WORKER_STATE_SUCCEEDED`、`WORKER_STATE_FAILED`\
  \ 和 `WORKER_STATE_CANCELLED`。\n\n以下是 `Service` 类定义的便利方法，用于为上述事件类型注册事件处理器：\n\n* `public\
  \ final void setOnRunning(EventHandler<WorkerStateEvent> value)`\n  设置 `onRunning`\
  \ 属性的值，提供 `handle` 方法的实现，当 `Worker` 的状态转换到 `RUNNING` 时会调用该方法。\n\n* `public final\
  \ void setOnSucceeded(EventHandler<WorkerStateEvent> value)`\n  设置 `onSucceeded`\
  \ 属性的值，提供 `handle` 方法的实现，当 `Worker` 的状态转换到 `SUCCEEDED` 时会调用该方法。\n\n* `public final\
  \ void setOnFailed(EventHandler<WorkerStateEvent> value)`\n  设置 `onFailed` 属性的值，提供\
  \ `handle` 方法的实现，当 `Worker` 的状态转换到 `FAILED` 时会调用该方法。\n\n* `public final void setOnCancelled(EventHandler<WorkerStateEvent>\
  \ value)`\n  设置 `onCancelled` 属性的值，提供 `handle` 方法的实现，当 `Worker` 的状态转换到 `CANCELLED`\
  \ 时会调用该方法。\n\n`Worker.State` 是 `javafx.concurrent.Worker` 的一个内部类，是一个枚举类型，定义了 `Worker`\
  \ 的状态常量：`CANCELLED`、`FAILED`、`READY`、`RUNNING`、`SCHEDULED` 和 `SUCCEEDED`。\n\n`Worker`\
  \ 对象初始处于 `READY` 状态。当 `Worker` 开始执行任务时，转换到 `SCHEDULED` 状态，不久后进入 `RUNNING` 状态，并一直保持\
  \ `RUNNING` 状态，直到发生以下情况之一：\n\n任务成功完成：\n`Worker` 转换到 `SUCCEEDED` 状态。\n\n抛出异常：\n`Worker`\
  \ 转换到 `FAILED` 状态。\n\n任务被取消：\n`Worker` 转换到 `CANCELLED` 状态。可以通过调用 `Worker` 接口定义的\
  \ `cancel()` 方法来取消 `Worker`。如果取消成功，则返回 `true`。\n\n处理 `WORKER_STATE_RUNNING` 事件类型的事件处理器中执行的任务非常简单：\n\
  \n1. 将 `lastClickedButton` 属性的值设置为 `NEXT`，因为幻灯片正在运行意味着 `Next` 按钮正在自动连续点击。\n2. 检查\
  \ `Previous` 按钮是否禁用，如果是，则启用它。\n\n并且创建一个单一的 `EventHandler` 来处理多种类型的事件。注册用于处理 `WORKER_STATE_SUCCEEDED`\
  \ 的事件处理器也注册用于处理 `WORKER_STATE_FAILED` 和 `WORKER_STATE_CANCELLED`。当 `Worker` 的状态转换到\
  \ `SUCCEEDED`、`FAILED` 或 `CANCELLED` 时，要执行的任务为：\n\n1. 如果列表迭代器中没有下一个文件，则禁用 `Next`\
  \ 按钮；否则启用它。\n2. 如果 `Previous` 按钮是禁用的，则启用它。\n\n以下是 `configureSlideshow` 方法的实现：\n\n\
  导入语句：\n\n```java\nimport javafx.concurrent.WorkerStateEvent;\n```\n\n列表 3-16. `configureSlideshow`\
  \ 方法：\n\n\n\n\n\n```java\n/**\n   * \n   */\n  void configureSlideshow() {\n   \
  \ // 如果服务正在运行，那么 isSlideshowOn 的值值为 true，\n    // 否则，它为 false \n    isSlideshowOn.bind(service.runningProperty());\n\
  \n    service.setOnRunning(new EventHandler<WorkerStateEvent>() {\n      @Override\n\
  \      public void handle(WorkerStateEvent we) {\n        System.out.println(\"\
  Service is transited to running status\");\n        lastClickedButton.set(NEXT);\n\
  \        if (prevButton.isDisable()) {\n          disableButton(prevButton, false);\n\
  \        }\n      }\n    });\n\n    EventHandler<WorkerStateEvent> taskDone = new\
  \ EventHandler<WorkerStateEvent>() {\n      @Override\n      public void handle(WorkerStateEvent\
  \ we) {\n        disableButton(nextButton, !listIterator.get().hasNext());\n   \
  \     if (prevButton.isDisable()) {\n          disableButton(prevButton, false);\n\
  \        }\n      }\n    };\n\n    service.setOnSucceeded(taskDone);\n    service.setOnFailed(taskDone);\n\
  \    service.setOnCancelled(taskDone);    \n  }\n```\n\n### 3.3.2.3 为 `Start Slideshow`\
  \ 和 `Stop Slideshow` 菜单项实现动作事件的事件处理器\n\n执行 `Start Slideshow` 操作的场景如下：当用户点击 `Start\
  \ Slideshow` 菜单项时，服务被启动，其状态从 `READY` 变为 `SCHEDULED`，再变为 `RUNNING`。一旦状态切换到 `RUNNING`，`isSlideshowOn`\
  \ 属性的值就会更改为 `true`（参见此处），并且结果是 `Stop Slideshow` 菜单项的禁用状态被更改为 `false`（参见此处）。\n\n\
  我们使用 `Service` 类中提供的 `void start()` 方法来启动服务。该方法是从处理 `Start Slideshow` 菜单项动作事件的事件处理器中调用的。在调用\
  \ `start()` 方法之前检查服务的状态是非常重要的，以确保服务处于 `READY` 状态。\n\n在 `javafx.concurrent.Worker`\
  \ 接口中定义的 `Worker.State getState()` 方法用于检查服务的状态。只有当服务处于 `READY` 状态时，才能成功启动服务。如果它未就绪，请先重置，然后启动服务。\n\
  \n以下是执行这些操作的代码片段：\n\n```java\n startSlide.setOnAction(new EventHandler<ActionEvent>()\
  \ {\n      @Override\n      public void handle(ActionEvent ae) {\n        System.out.println(\"\
  Start Slideshow...\");\n        if (service.getState() != Worker.State.READY)\n\
  \          service.reset(); // transit to READY\n        service.start();\n    \
  \  }\n    });\n```\n\n用户可以在幻灯片服务运行时运行时取消幻灯片。`boolean cancel()` 方法是从处理 `Stop Slideshow`\
  \ 菜单项动作事件的事件处理器中调用的。\n\n以下代码演示了如何为 `Start Slideshow` 和 `Stop Slideshow` 菜单项实现动作事件的事件处理器。\n\
  \n导入语句：\n\n```java\n import javafx.concurrent.Worker;\n```\n\n列表 3-17. 为 `Start\
  \ Slideshow` 和 `Stop Slideshow` 菜单项实现动作事件的事件处理器：\n\n```java\n startSlide.setOnAction(new\
  \ EventHandler<ActionEvent>() {\n      @Override\n      public void handle(ActionEvent\
  \ ae) {\n        System.out.println(\"Start Slideshow...\");\n        if (service.getState()\
  \ != Worker.State.READY)\n          service.reset(); // transit to READY\n     \
  \   // 如果最后点击的按钮是上一个按钮，\n        // 则下一个图像是当前图像，\n        // 必须在启动服务之前将光标向前移动一步\n\
  \        if (lastClickedButton.get().equals(PREVIOUS) &&\n            listIterator.get().hasNext())\
  \ {\n          listIterator.get().next();\n        }\n        service.start();\n\
  \      }\n    });\n    stopSlide.setOnAction(new EventHandler<ActionEvent>() {\n\
  \      @Override\n      public void handle(ActionEvent ae) {\n        System.out.println(\"\
  Stop Slideshow...\");\n        service.cancel();\n      }\n    }); \n```\n\n###\
  \ 3.3.3 ImageViewer 应用程序完整的 `start(Stage stage)` 方法\n\n接的列表显示了此阶段 `ImageViewer`\
  \ V1.2 完整的 `start` 方法，更改部分已用**粗体**字体标记。\n\n列表 3-18. `ImageViewer` V1.2 的 `start`\
  \ 方法如下：\n\n\n\n\n```java\npublic class ImageViewer extends Application {\n\n  ...\n\
  \n  final BooleanProperty isSlideshowOn = new SimpleBooleanProperty(false);\n  //\
  \ Create a reusable Worker object\n  final SlideshowService service = new SlideshowService(listIterator,\n\
  \      curImage, imageName);\n\n  @Override\n  public void start(final Stage stage)\
  \ {\n    BorderPane rootPane = new BorderPane();\n    final StackPane imageArea\
  \ = new StackPane();\n    // Set min size for StackPane to avoid resizing\n    //\
  \ when loading large size image\n    imageArea.setMinSize(0, 0);\n    rootPane.setCenter(imageArea);\n\
  \n    // Add status bar and status text\n    final HBox statusBar = new HBox();\n\
  \    statusBar.setPadding(new Insets(4, 12, 4, 12));\n    statusBar.setSpacing(4);\n\
  \    statusBar.setStyle(\n        \"-fx-background-color: linear-gradient(#F0FFFF,\
  \ #708090)\");\n    final Text statusText = new Text(\"\");\n    statusText.textProperty().bind(imageName);\n\
  \    statusText.setFont(Font.font(\"Verdana\", FontWeight.BOLD, 12));\n    statusText.setFill(Color.DARKSLATEBLUE);\n\
  \n    statusBar.getChildren().add(statusText);\n    rootPane.setBottom(statusBar);\n\
  \n    // Create image view, add to image area\n    final ImageView imageView = new\
  \ ImageView();\n    imageView.imageProperty().bind(curImage);\n    imageView.setPreserveRatio(true);\n\
  \    imageArea.getChildren().add(imageView);\n\n    // Since JavaFX 8, to see through\
  \ background color of scene,\n    // must set root pane's background to transparent\n\
