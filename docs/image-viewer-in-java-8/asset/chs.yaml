  \n## 本书的组织结构\n\n本书是 `Coding in JavaFX Step by Step Build Graphics Toolkit` 系列书的第一卷（`VOLUME\
  \ Ⅰ`）。由于内容非常丰富，无法整合在一本书中管理，因此章节被组织在不同的卷册中：\n\n### 1. 第一卷：开发图像查看组件\n* **第 1 章**：基础图像查看器\n\
  * **第 2 章**：带有浏览按钮的增强图像查看器\n* **第 3 章**：具有幻灯片功能的增强图像查看器\n\n### 2. 第二卷：开发交互式形状绘制工具\n\
  * **第 1 章**：线条绘制器\n  根据绘板上的鼠标事件绘制线条。\n* **第 2 章**：折线绘制器\n  根据绘板上的鼠标事件绘制折线。\n* **第\
  \ 3 章**：多边形绘制器\n  根据绘板上的鼠标事件绘制多边形。\n* **第 4 章**：路径绘制器\n  根据绘板上的鼠标事件绘制路径。\n* **第\
  \ 5 章**：二次贝塞尔曲线绘制器\n*  根据绘板上的鼠标事件绘制由二次贝塞尔曲线组成的路径。\n* **第 6 章**：基础绘制工具\n  在名为 `drawtool`\
  \ 的包中创建集成类，以方便各种形状绘制器的开发——矩形绘制器、圆形绘制器和椭圆绘制器。\n* **第 7 章**：带有预定义绘制器的增强绘制工具\n  增强\
  \ `drawtool` 包并实现多种绘制器，位于 `drawtool.drawer` 包中，包含这些预定义的形状绘制器——`LineDrawer`、`PolylineDrawer`、`PolygonDrawer`、`PathDrawer`、`BazierCurveDrawer`、`RectangleDrawer`、`CircleDrawer`、`EllipseDrawer`\
  \ 和 `ShapeMover`——它们都是 `ShapeDrawer` 的子类。\n* **第 8 章**：初始 `JFXDrawTools` \n  通过集成所有预定义的形状绘制器并利用增强的形状绘制\
  \ API，开发 `JFXDrawTools` 的初始版本。\n\n### 3. 第三卷：开发交互式正多边形绘制工具\n* **第 1 章**：具有正多边形形状能力的增强绘制工具\n\
  \  引入 `RegularPolygon` 类。\n* **第 2 章**：带有正多边形的增强绘制工具\n  引入 `RegularPolygonDrawer`，它是\
  \ `ShapeDrawer` 的子类，位于 `drawtool.drawer`。\n* **第 3 章**：带有正多边形绘制器的 JFXDrawTools\n\
  \  将正多边形绘制器集成到 JFXDrawTools。\n\n### 4. 第四卷：草稿保存与加载\n* **第 1 章**：带有写入器的增强绘制工具\n \
