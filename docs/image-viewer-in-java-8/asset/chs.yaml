  # 第 2 章：带有浏览按钮的增强图像查看器\n\n## 开发 ImageViewer V1.1\n\n### 引言\n\n在之前的章节中，我们演示了 JavaFX\
  \ 应用程序 `ImageViewer V1.0` 的迭代开发。到为止，它包含了基本功能，但是一个实用的方便工具。更多功能将在本章和下一章中逐步添加。\n\n\
  本章是动作的实现以及两个按钮 `Next` 和 `Previous` 的正确放置，用于打开下一个或上一个图像。\n\n版本升级为 1.1。通过从 `ImageViewer`\
  \ V1.1 提取的详细描述和良好的代码，你将熟悉总结节中提到的 JavaFX 基础功能。\n\n`ImageViewer` V1.1 的完整开发过程具有以下步骤的特征：\n\
