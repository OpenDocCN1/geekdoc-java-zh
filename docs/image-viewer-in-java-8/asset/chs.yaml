  \ 注册鼠标点击事件处理器\n    buttonGroup.setOnMouseClicked(new EventHandler<MouseEvent>()\
  \ {\n      @Override\n      public void handle(MouseEvent me) {\n        if (me.getButton()\
  \ != MouseButton.PRIMARY)\n          return;\n        // 获取迭代器\n        ListIterator<java.nio.file.Path>\
