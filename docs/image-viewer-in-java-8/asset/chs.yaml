  \ 中添加 `Previous` 按钮并调整其位置\n\n## 2.4 实现鼠标点击事件处理器\n\n### 2.4.1 配置 `FileChooser` \n\
  \n### 2.4.2 创建列表迭代器以遍历当前目录下的现有文件\n\n### 2.4.3 在 `ImageViewer` 类中定义属性\n\n## 2.5 完善\
