  \ 菜单项和 `Previous` 按钮的事件处理器进行协调\n\n由于幻灯片在独立的线程上运行，应用程序仍然对用户的操作保持响应，例如鼠标点击 `Load`\
  \ 菜单项或 `Previous` 按钮。\n\n为了让幻灯片运行得流畅，我们将完善 `Load` 菜单项的动作处理程序以及 `Previous` 按钮的鼠标点击事件处理器。也就是说，只有在幻灯片未运行时，我们才会继续加载当前选择的文件或上一个文件。后续列表中的更改以**粗体**显示。\n\
  \n请注意，如果用户在幻灯片运行时点击 `Next` 按钮，图像渲染的整体流程看起来并不突兀，因此我们没有对其进行额外的处理。\n\n列表 3-19. `loadFile`\
  \ 方法变为如下：\n\n```java\n /**\n   * \n   * @param file \n   */\n  void loadFile(File\
