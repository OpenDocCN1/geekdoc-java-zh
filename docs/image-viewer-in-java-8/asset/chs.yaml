  \ \"image_viewer_1.jpg\")\n\n## 为什么选择这本书\n\n本书适用于兴趣使用 JavaFX 库开发丰富客户端应用程序的 GUI 的软件开发者。\n\
  \n书中通过分步开发真实的 Java 应用程序，展示了 JavaFX 中的重要功能。\n\n书中使用了说明性图表来帮助读者立即掌握抽象概念。每章中使用的所有图表都是使用本系列书中开发的图形工具创建的。\n\
  \n如果你属于以下情况，这本书就适合你：\n\n*   Java GUI 程序员（无论是新手还是专业人士），刚开始接触 JavaFX。\n*   具备 JavaFX\
  \ 基础知识并想学习如何开发交互式工具的 Java 程序员。\n*   对面向对象的 JavaFX 图形工具和实际应用感兴趣，并希望获得完整且文档良好的源代码的专业软件工程师。\n\
  \n## 本书所需\n\n如果你想编译和运行书中包含的应用程序，你需要下载并安装 `JDK 8`。这里是下载最新版本 `JDK 8` 的网站。要从此 Kindle\
  \ 电子书中复制完整源代码，建议如下：\n\n1. 在你的电脑上安装 `Calibre`（一个免费开源软件）。\n2. 使用 `Calibre` 中的“添加书籍”功能添加\
  \ `Calibre` 的 .mobi 文件。\n3. 从 `Calibre` 中打开书籍并将源代码复制到 Java 文件中。\n\n### 引言\n\n本系列书籍是一份针对软件开发者使用\
  \ JavaFX 构建 Java 应用程序 GUI 的教程，JavaFX 已成为 Java SE 开发工具包 (JDK 8) 的一部分。系列书籍的主要目标是提供一份全面的手册，介绍\
  \ JavaFX 的常用功能和精髓。通过分步开发复杂的工具包，展示了 JavaFX 提供的 API 的用法。系列书中包含了图形工具包的完整源代码、一组可重用的类以及可嵌入的\
  \ JavaFX 应用程序。\n\n## JavaFX 历史\n\n现在让我们浏览 JavaFX 演进的时间线，并领略 JavaFX 的前身：\n\nSeeBeyond\
  \ Technology Corporation 的 Chris Oliver 开发了一项名为 `F3` 的脚本，它是“形式跟随功能”（Form Follows\
  \ Function）的缩写；它允许开发者访问 Swing 类并为快速开发丰富的互联网应用程序创建用户界面 (GUI)。\n\nSun Microsystems\
  \ 在 2005 年 9 月收购了 SeeBeyond，`F3` 在 2007 年 5 月更名为 JavaFX Script。\n\n2008 年 12 月，JavaFX\
  \ 1.0 发布，开发者一直依赖 JavaFX Script 开发 JavaFX 应用程序，直到三年后 JavaFX 2.0 发布。\n\n2010 年 1 月，Oracle\
  \ 完成了对 Sun Microsystems 的收购并继续维护 JavaFX。\n\n2010 年 9 月的 JavaOne 大上，Oracle 宣布 JavaFX\
  \ Script 将停止使用。\n\n2011 年 10 月，JavaFX 2.0 发布，开发者开始使用标准 Java 语言而非 JavaFX Script 来访问\
  \ JavaFX 库的 API。然而，除了 Java SE JDK 和 JavaFX Runtime 之外，开发和运行使用 JavaFX 2.0 编译的应用程序还需要安装\
  \ JavaFX SDK。\n\n2013 年 2 月，JavaFX 2.2.7 发布，JDK7 包含了 JavaFX SDK 和 JavaFX Runtime。JavaFX\
  \ 与 JDK 的集成为 JavaFX 开发者带来了极大的便利。使用 JDK 7 及更高版本编译的 JavaFX 应用程序不需要额外的安装。\n\n2014 年\
  \ 3 月 18 日，JavaFX 8 作为 Java SE 开发工具包 (JDK 8) 的一部分发布。\n\n截至本书 2016 年 3 月出版时，最新的 JDK\
  \ 版本为：2015 年 10 月 20 日的 JDK 866 以及 2016 年 1 月的 JDK 872。\n\nJDK 9 的发布（GA）计划于 2017\
  \ 年 3 月 23 日。\n\n## 前提\n\n书中介绍的 JavaFX 应用程序使用 JavaFX 包提供的 API 构建 GUI。不需要熟悉 Swing\
  \ 包，但读者必须熟悉 Java 编程语言的基础。如果你是 Java 新手，请访问此网站 `http://docs.oracle.com/javase/tutorial/index.html`\
  \ 获取 Java 技术的初步知识。按以下顺序阅读 Oracle 在线文档：\n\n1. 简单的 Java 应用程序“Hello World!”与安装：\n \
  \   访问 `http://docs.oracle.com/javase/tutorial/getStarted/index.html`\n2. Java 语言的概念和特性：\n\
  \    访问 `http://docs.oracle.com/javase/tutorial/java/index.html`\n3. Java 集合框架：\n\
  \    访问 `http://docs.oracle.com/javase/tutorial/collections/index.html`\n4. 核心 Java\
  \ 类：\n    访问 `http://docs.oracle.com/javase/tutorial/essential/index.html`\n\n##\
  \ JavaFX 应用程序简介\n\n以下示例旨在让新接触 JavaFX 的读者快速预览如何创建 JavaFX 应用程序。\n\n要开始学习，你需要创建一个继承自\
  \ `javafx.application.Application` 的类（这是 JavaFX 应用程序的入口），并重写必须覆盖的抽象 `start` 方法。一个典型的\
  \ `start` 方法如下：\n\n\n\n\n\n```java\npackage imageviewer;\n\nimport javafx.application.Application;\n\
  import javafx.scene.Scene;\nimport javafx.scene.layout.BorderPane;\nimport javafx.scene.layout.StackPane;\n\
  import javafx.stage.Stage;\n\n/**\n * File Name: ImageViewer.java\n *\n * @author\
  \ Shufen Kuo\n */\n\npublic class ImageViewer extends Application {\n\n  @Override\n\
  \  public void start(Stage stage) {\n    BorderPane rootPane = new BorderPane();\n\
  \    StackPane imageArea = new StackPane();\n    rootPane.getChildren().add(imageArea);\n\
  \n    Scene scene = new Scene(rootPane, 600, 400); \n    stage.setTitle(\"ImageViewer\
  \ V1.0\");\n    stage.setScene(scene);\n    stage.show();\n  }\n\n  public static\
  \ void main(String[] args) {\n    launch(args);\n  }\n}\n```\n\n### Scene 和 Stage\n\
  \n在 `start` 方法中出现了两个重要的类 `Scene` 和 `Stage`。通常情况下，主要任务是创建在名为场景图（scene graph）的分层次树结构中管理的图形用户界面（GUI），将场景图的根节点关联到\
  \ `Scene` 对象，然后将场景放置在 `Stage` 对象上。`Stage` 代表 JavaFX 应用程序顶层容器，作为场景图的窗口与用户进行交互。\n\n\
  接下来的快照让你对 JavaFX 应用程序的 GUI 外观有一个初步了解：图 1. JavaFX 应用程序快照。（Images/image00123.jpeg\
  \ javafx_app_guis）\n\n### 节点\n\nJavaFX 引入了一个基础类 `javafx.scene.Node`，它继承自 `java.lang.Object`\
  \ 并提供了对所有用户界面都有用的常用属性和方法。我们经常使用节点（nodes）一词来引用 GUI。\n\n场景图可能包含各种节点。节点可以是父节点（带有子节点的节点）或叶子节点（没有子节点的节点）；每个节点只能有一个父节点，而根节点没有。场景图中的所有节点都派自\
  \ `javafx.scene.Node`。为了快速识别场景图中基本的节点类型，我们根据是否具有添加子节点的能力来区分它们。\n\n*   你可能向这些节点添加子节点：\n\
  \    以下类被频繁用作父节点：`Group`、`Pane` 以及内置的布局面板（它们是 `Pane` 的直接子类）。通常你调用 `getChildren()`\
  \ 方法来获取类型为 `ObservableList<Node>` 的列表（它是 `java.util.List` 的子接口），然后使用开发者熟悉的 `Collection`\
  \ 中定义的各种实用程序来操作列表的内容。\n\n*   你可能无法向这些节点添加子节点：\n    以下类始终被用作叶子节点：`Canvas`、`ImageView`、`MediaView`\
  \ 以及 `Shape` 的所有直接子类，例如 `Rectangle`、`Ellipse` 等。\n\n### JavaFX 和 Swing\n\n现在，有一个有趣的问题。多年来开发者一直使用\
  \ Swing API 构建 Java 应用程序的 GUI，这些是 Java Foundation Classes（JFC）的 GUI 组件。为什么除了 Swing\
  \ 之外我们还需要 JavaFX？\n\n如果你拥有大量用 Swing 编写遗留代码，并希望将 JavaFX 特性整合到 Swing 代码中，JDK 8 提供了机制；反之，你可以在\
  \ JavaFX 应用程序中包含 Swing 组件。\n\nJavaFX-Swing 互操作性主题在本书中未介绍。如果你对这个主题感兴趣，请在此访问 Oracle\
  \ 在线文档“JavaFX: Interoperability -- Java-Swing Interoperability”：[`docs.oracle.com/javase/8/javafx/interoperability-tutorial/fx_swing.htm`](http://docs.oracle.com/javase/8/javafx/interoperability-tutorial/fx_swing.htm)\n\
  \nJavaFX 是下一代 Java GUI。为了说明使用 JavaFX 能力的优势，除了 JavaFX 和 Swing 之间的互操作性外，我们在下面的章节介绍了\
  \ JavaFX 的重要特性。\n\n### JavaFX 的精髓\n\nJavaFX 不仅允许你快速创建具有视觉用户界面的应用程序，还包含了诱人且独特的能力。它们列举如下：\n\
  \n#### 内置布局面板\n\nJavaFX 的布局面板（layout panes）是容器，能够自动对节点执行各种类型的摆放操作。你可以在布局面板中放置任意数量的节点，布局面板本身也是一个节点，因此也可以嵌套在另一个布局面板中。使用布局面板的主要优势是避免手动指定每个节点的大小和位置的繁琐。由于场景图中的这些节点是以树结构管理的，布局算法会根据其布局类型和指定的布局属性递归地计算每个节点的大小和位置，并且当窗口大小调整事件发生时，会触发动态重新计算。\n\
  \n有 8 种内置布局面板，位于 `javafx.scene.layout` 包中：\n\n*   `BorderPane`：`BorderPane` 将节点分别放置在五个位置，以创建经典窗口的外观，通常顶部区域用于菜单栏或工具栏，底部区域用于状态栏，左右侧区域用于导航面板，中心区域用于工作区域。\n\
  *   `HBox`：`HBox` 将节点放置在一行（水平方向）。\n*   `VBox`：`VBox` 将节点放置在一列（垂直方向）。\n*   `GridPane`：`GridPane`\
  \ 将节点放置在具有多行多列的网格中。这是一个显示一系列键值对属性的实用用用户界面。\n*   `StackPane`：`StackPane` 将所有节点堆叠在一起，默认以居中对齐。所有子节点在容器中心相互重叠，后创建的节点位于先上方。但你可以使用静态方法\
  \ `StackPane.setAlignment(Node child, Pos value)` 和 `StackPane.setMargin(Node child,\
  \ Insets value)` 来调整节点的强制位置。\n*   `FlowPane`：`你可以可以指定 `FlowPane` 的方向属性。对于水平 `FlowPane`，节点从左到右排列，在容器宽度边界处换行。对于垂直\
  \ `FlowPane`，节点从上到下排列，在容器高度边界处换列。\n*   `TilePane`：`TilePane` 与 `FlowPane` 类似，不同之处\
  \ `TilePane` 网格中的每个单元具有相同的大小。\n*   `AnchorPane`：`AnchorPane` 相对于指定的锚点放置节点，共有四个点：`topAnchor`、`rightAnchor`、`bottomAnchor`\
  \ 和 `leftAnchor`。\n\n#### 参考 Oracle 在线文档“Working with Layouts in JavaFX”：\n\n[`docs.oracle.com/javase/8/javafx/layout-tutorial/index.html`](http://docs.oracle.com/javase/8/javafx/layout-tutorial/index.html)\n\
  \n### 使用 CSS 进行自定义\n\nJavaFX 允许使用 CSS（层叠样式表）来描述应用程序用户界面的样式。通过 CSS 定义如颜色、字体、外边距、内边距、宽度、高度、线条、背景图像等演示属性，并与应用程序代码分离，在许多方面显示了巨大的便利性：\n\
  \n*   从软件提供者的角度自定义：从同一组代码编译的应用程序可以呈现各种样式，每种样式符合不同的客户需求。\n*   从应用程序用户的角度自定义：即使在软件发布后，如果应用程序用户对\
  \ UI 的外观有偏好，也可以在客户现场修改 CSS 文件定义的演示属性。\n*   对样式设计者的利益：应用程序代码与样式定义的分离提高了代码的可读性，并通让图形设计师专注于处理\
  \ CSS，从而简化了任务。\n*   对软件开发者的利益：\n\n\n\n\n\n在测试过程中，开发者可能会频繁更改 CSS 文件中定义的样式属性，以评估 GUI（图形用户界面）的不同外观。如果每次更改都需要退出并重启应用程序，那将是一项非常麻烦的任务。为了方便这一评估过程，最佳策略是设计一个临时的\
  \ `Load` 按钮，当任何样式属性发生变化时，只需点击该按钮重新加载 CSS，而无需退出并重启应用程序，从而节省大量的测试时间。\n\n## JavaFX\
  \ 中的 CSS 与 HTML CSS 的相似性\n\nJavaFX 中 CSS 的语法与 HTML 中的 CSS 相同，因此任何具有浏览器 CSS 经验的设计师都可以花费极少的学习成本为\
  \ JavaFX 应用程序的 UI 设计样式。\n\n### 参考 Oracle 在线文档“Skinning JavaFX Applications with\
  \ CSS”：\n\n[`docs.oracle.com/javase/8/javafx/user-interface-tutorial/css_tutorial.htm`](http://docs.oracle.com/javase/8/javafx/user-interface-tutorial/css_tutorial.htm)\n\
  \n## 使用 FXML 创建用户界面\n\nFXML 是一种符合 XML（可扩展标记语言）格式的标记语言，具有额外的规则，用于创建 JavaFX 应用程序的用户界面。考虑到手动编写\
  \ FXML 容易出错，一种可行的方法是通过 GUI 构建器生成 FXML 代码。\n\n在本系列书籍中，我们介绍了一个实用的应用程序 `JFXDrawTools`，它是一种专门用于创建自\
  \ `Shape` 子类实例的 GUI 构建器。用户可以交互式地创建草图（无论是 `Shape` 还是 `ImageView`），操作其属性并将编辑结果保存为\
  \ FXML 格式的文件，这些文件稍后可以加载回以继续编辑过程，或者被其他 JavaFX 应用程序动态加载。\n\n将应用程序的 GUI（视图 View）与其业务逻辑（模型\
  \ Model）分离被认为是一种良好的编程实践。FXML 文件表示视图，而控制器（controller）是一个在视图和模型之间传递信息的 Java 类。使用 FXML\
  \ 构建 GUI 使得应用程序开发者能够有效地采用 MVC（模型-视图-控制器）架构。\n\n### 参考 Oracle 在线文档“JavaFX: Mastering\
  \ FXML”：\n\n[`docs.oracle.com/javase/8/javafx/fxml-tutorial/index.html`](http://docs.oracle.com/javase/8/javafx/fxml-tutorial/index.html)\n\
  \n## 属性与绑定的强大能力\n\nJavaFX 特有的属性（Properties）概念遵循了 JavaBeans 组件中引入的设计规范，它通常与绑定（Binding）机制结合使用，整体上为各种编程需求提供了强大、精炼且简洁的解决方案。\n\
  \n在本系列书籍介绍的 `JFXDrawTools` 应用程序中，我们详尽地演示了属性和绑定的用法。在属性窗口（Properties Window）的实现中，使用了合适的\
  \ UI 控件（如文本字段、选择框、组合框等）来查看相关对象的属性。绑定机制被用于 UI 控件与其对应的对象属性进行双向链接，这种关系在属性窗口即将显示时建立。当用户更改\
  \ UI 控件中显示的数据时，更改会立即反映到相关对象的相应属性。\n\n### 参考 Oracle 在线文档“JavaFX: Properties and Binding\
  \ Tutorial”：\n\n[`docs.oracle.com/javase/8/javafx/properties-binding-tutorial/index.html`](http://docs.oracle.com/javase/8/javafx/properties-binding-tutorial/index.html)\n\
  \n## 变换与过渡的复杂机制\n\nJavaFX 内置的节点变换（transformations）能力对于开发图形编辑器、绘图工具、图像查看器、GUI 构建器等图形软件包非常方便。\n\
  \n这里是处理变换的类：`Translate`、`Rotate`、`Scale` 和 `Shear`。它们都派自 `Transform` 类，并位于 `javafx.scene.transform`\
  \ 包。\n\nJavaFX 过渡（transitions）为创建动画提供了简洁的方法。有许多需要动画功能的应用，这里是一些案例：在警报情况下引起注意、在删除操作期间将对象投入回收站、在数据加载期间指示中间状态等……\n\
  \n在本系列书籍介绍的 `ImageViewer` 应用程序中，我们在幻灯片功能中对图像对象应用了 `FadeTransition` 和 `ParallelTransition`，以同时使新图像淡入并将旧图像淡出。\n\
  \n这里是处理过渡的类：`FadeTransition`、`RotateTransition`、`ScaleTransition`、`TranslateTransition`、`FillTransition`、`StrokeTransition`、`PathTransition`、`ParallelTransition`、`SequentialTransition`、`PauseTransition`。它们都派自\
  \ `Transition` 类（这是一个定义动画基本功能的抽象类），并位于 `javafx.animation` 包。\n\n### 参考 Oracle 在线文档“JavaFX:\
  \ Transformations, Animations, and Visual Effects”：\n\n[`docs.oracle.com/javase/8/javafx/visual-effects-tutorial/index.htm`](http://docs.oracle.com/javase/8/javafx/visual-effects-tutorial/index.html)\n\
  \n## 2D 几何原语与文本都是 JavaFX 节点\n\nJavaFX 提供了一个 `Shape` 类，它继承自 `javafx.scene.Node` 类，是\
  \ 2D 几何基本形式的超类。应用于几何原语的面向对象概念促进了图形应用程序的。\n\n这里是派自 `Shape` 的类：`Arc`、`Circle`、`CubicCurve`、`Ellipse`、`Line`、`Path`、`Polygon`、`Polyline`、`QuadCurve`、`Rectangle`、`SVGPath`、`Text`。除了\
  \ `Text` 类外，其余位于 `javafx.scene.shape` 包。\n\n请注意位于 `javafx.scene.text` 包的 `Text`\
  \ 类也被视为形状，它为文本绘制工具的发展提供了支持。所有 JavaFX 节点的功能适用于文本对象。你可以像处理任何几何形状一样处理它。文本对象可以放置在布局面板中以利用自动布局能力、应用变换和过渡，以及使用\
  \ CSS 自定义样式等。\n\n### 参考 Oracle 在线文档“Using Text in JavaFX”：\n\n[`docs.oracle.com/javase/8/javafx/user-interface-tutorial/text-settings.htm`](http://docs.oracle.com/javase/8/javafx/user-interface-tutorial/text-settings.htm)\n\
  \n## 其他处理许多复杂问题以短开发时间的显著功能\n\n* `ImageView` 类用于加载和显示图像\n\n  `ImageView` 类继承自 `javafx.scene.Node`，配合\
  \ `Image` 类用于加载和显示图像。JavaFX 还提供了对位图图像进行操作的 API，`PixelReader` 定义了从 `Image` 对象读取像素的方法，而\
  \ `PixelWriter` 定义了向 `Image` 对象写入像素的方法。所有这些都位于 `javafx.scene.image` 包。\n\n  ###\
  \ 参考 Oracle 在线文档“Using the Image Ops API”：\n\n  [`docs.oracle.com/javase/8/javafx/graphics-tutorial/image_ops.htm`](http://docs.oracle.com/javase/8/javafx/graphics-tutorial/image_ops.htm)\n\
  \n* `WebView` 类用于管理网页\n\n\n\n\n\nJavaFX 架构中嵌入了一个 Web 引擎组件，它位于 `javafx.scene.web`\
  \ 包中提供一组 API，用于开发具有 浏览器功能的应用程序。要查看网页，首先需要创建一个扩展 `javafx.scene.Parent` 的 `WebView`\
  \ 对象（该对象继承了节点（node）的所有特性），然后获取与之关联的 `WebEngine`。`WebEngine` 提供了与操作网页相关的方法，例如：加载/显示网页（通过提供给定的\
  \ URL 或页面内容）、访问由 `WebEngine` 为加载的网页创建的文档对象模型（DOM）、处理由 JavaScript 触发的各种事件等。\n\n###\
  \ 参考 Oracle 在线文档“JavaFX: Adding HTML Content to JavaFX Applications”：\n\n[`docs.oracle.com/javase/8/javafx/embedded-browser-tutorial/index.html`](http://docs.oracle.com/javase/8/javafx/embedded-browser-tutorial/index.html)\n\
  \n### 用于编辑 HTML 页面的 HTMLEditor 类\n\n对对 HTML 编辑能力的完整支持来自 `HTMLEditor` 类，该类扩展自 `javafx.scene.control.Control`\
  \ 并位于 `javafx.scene.web` 包中。要在 JavaFX 应用程序中嵌入 HTML 编辑器，你只需创建 `HTMLEditor` 的实例，将其添加到场景图（scene\
  \ graph）中，它就可以与用户交互了。以下两个方法对于获取和设置编辑器的 HTML 内容有用：`getHtmlText()` 和 `setHtmlText(java.lang.String\
  \ htmlText)`。\n\n与处理多行纯文本的类似控件 `TextArea` 不同，`HTMLEditor` 格式化符合 HTML 语法的文本。\n\n\
  HTML 编辑器的用法广泛应用于软件各个领域，例如：博主撰写发布的文章（内容管理系统）、邮件系统用户撰写消息（消息系统）、在线卖家为上架准备产品描述（电子商务管理系统）等。\n\
  \n### 参考 Oracle 在线文档“JavaFX: Working with JavaFX UI Components -- HTML Editor”：\n\
  \n[`docs.oracle.com/javase/8/javafx/user-interface-tutorial/editor.htm`](http://docs.oracle.com/javase/8/javafx/user-interface-tutorial/editor.htm)\n\
  \n### 用于渲染数据的图表组件\n\n以下类位于 `javafx.scene.chart` 包中，用于绘制各种类型的图表：\n\n* `AreaChart`,\
  \ `StackedAreaChart`\n* `BarChart`, `StackedBarChart`\n* `BubbleChart`\n* `LineChart`\n\
  * `PieChart`\n* `ScatterChart`\n\n`Chart` 类是所有图表组件的基类，扩展自 `javafx.scene.layout.Region`\
  \ 类，因此继承了 `javafx.scene.Node` 类的所有适用特性。\n\n### 参考 Oracle 在线文档“JavaFX: Working with\
  \ JavaFX UI Components -- Working with JavaFX Charts”：\n\n[`docs.oracle.com/javase/8/javafx/user-interface-tutorial/charts.htm`](http://docs.oracle.com/javase/8/javafx/user-interface-tutorial/charts.htm)\n\
  \n### 用于播放媒体的 MediaView 类\n\n扩展 `javafx.scene.Node` 的 `MediaView` 类与 `MediaPlayer`\
  \ 和 `Media` 类一起使用，在 JavaFX 应用程序中播放媒体。所有与媒体相关的类都位于 `javafx.scene.media` 包。\n\n###\
  \ 参考 Oracle 在线文档“JavaFX: Incorporating Media Assets Into JavaFX Applications”：\n\
  \n[`docs.oracle.com/javase/8/javafx/media-tutorial/`](http://docs.oracle.com/javase/8/javafx/media-tutorial/)\n\
  \n# JavaFX 基础 UI 组件\n\n除了上述的 JavaFX 核心外，JavaFX 还提供了基础 UI 组件，它们位于 `javafx.scene.control`\
  \ 包中并派自 `javafx.scene.control.Control` 类；它们通常被称为 UI 控件。\n\n以下是可用的 UI 控件，未标记星号 (\\\
  *) 的控件在 Swing 中有对应的控件：\n\n* `Label`, `Button`, `RadioButton`, `ToggleButton`,\n\
  * `CheckBox`, `ChoiceBox`,\n* `ComboBox`, `ListView`, `TableView`,\n* `TextField`,\
  \ `TextArea`, `PasswordField`, `HTMLEditor`\n* `ScrollBar`, `ScrollPane`, `Slider`,\
  \ `ProgressBar`, `ProgressIndicator`, `ToolBar`,\n* `MenuBar`, `MenuButton`, `SplitMenuButton`,\n\
  * `ColorPicker`, `DatePicker`, `Separator`, `Pagination`, `SplitPane`, `TabPane`,\
  \ `TitledPane`, `Accordion`, `TreeView`, `TreeTableView`, `Hyperlink`。\n\n以下 UI\
  \ 组件通常与上述 UI 控件归为同一类。\n\n* `Tooltip` 位于 `javafx.scene.control` 包中，但派自 `javafx.scene.control.PopupControl`\
  \ 类。\n* `MenuItem`, `Menu`, `CheckMenuItem`, `RadioMenuItem` 位于 `javafx.scene.control`\
  \ 包中。扩展 `java.lang.Object` 的 `MenuItem` 是另外三个类的基类。\n* `FileChooser` 位于 `javafx.stage`\
  \ 包并扩展自 `java.lang.Object`。\n\n### 参考 Oracle 在线文档“JavaFX: Working with JavaFX UI\
  \ Components”：\n\n[`docs.oracle.com/javase/8/javafx/user-interface-tutorial/editor.htm`](http://docs.oracle.com/javase/8/javafx/user-interface-tutorial/editor.htm)\n\
  \n\n\n\n\nJavaFX 程序的图形用户界面是通过层次树结构管理的，这种结构被称为场景图（scene graph）。在 `ImageViewer` 应用中，我们使用\
  \ `BorderPane` 作为场景图的根节点，并将 `StackPane` 放在 `BorderPane` 的中心作为图像渲染区域。`BorderPane`\
  \ 和 `StackPane` 都是内置的布局面板，位于 `javafx.scene.layout` 包中，并且是 `javafx.scene.layout.Pane`\
  \ 类的直接子类。\n\n`BorderPane` 类允许你创建具有经典主窗口外观的图形用户界面。在下一节中，你将看到在 `BorderPane` 顶部添加了一个菜单栏，在随后的章节中，会在底部添加一个状态栏。\n\
  \n`StackPane` 类将其子节点按堆叠方式布局，将后创建的子节点置在前一个节点之上。在 `ImageViewer` 应用中，由于一次只查看一张图像，因此\
  \ `StackPane` 只有一个节点。如果图像的大小小于 `StackPane` 的大小，图像将放置在 `StackPane` 的中心。如果图像的大小大于\
  \ `StackPane`，`StackPane` 将自动扩展以容纳整个图像；如果应用程序窗口中的视图空间不够大，默认情况下只能看到图像的中心部分。在稍后的章节中，我们将演示如何避免\
  \ `StackPane` 被其内容重置大小，请参见此处。\n\n`Scene` 对象作为场景图的容器被创建，并接收一个根节点作为参数。在 `ImageViewer`\
  \ 应用中，根节点是 `BorderPane`，`Scene` 对象的初始宽度和高度设置为 600 像素和 400 像素。`BorderPane` 和 `StackPane`\
  \ 都是可调整大小的布局面板；因此，如果用户动态调整应用程序窗口的大小，场景将调整大小，并将调整大小事件传递给其根节点，从而重新计算图像渲染区域的大小。\n\n\
  你使用 `Stage` 类中定义的 `setScene` 方法将场景放置在 `Stage` 上使其运行。`Stage` 是 `javafx.stage.Window`\
  \ 的直接子类；它是 JavaFX 应用的顶层窗口。\n\nJavaFX 系统会创建一个 `Stage` 对象（称为主阶段，primary stage），并将其传递给\
  \ `start` 方法，`start` 是 `Application` 类中定义的一个抽象方法。开发者可以根据需要为应用程序构建额外的 `Stage` 对象。\n\
  \n以下代码演示了如何创建一个作为 `Application` 直接子类的 `ImageViewer` 类，并重写 `start` 方法。代码如下：\n\n列表\
  \ 1-1. 创建扩展 `Application` 类的 `ImageViewer` 类，重写 `start` 方法，创建 `BorderPane` 作为场景的根节点，并将\
  \ `StackPane` 放在 `BorderPane` 的中心作为图像渲染区域：\n\n```\n package imageviewer;\n\nimport\
  \ javafx.application.Application;\nimport javafx.scene.Scene;\nimport javafx.scene.layout.BorderPane;\n\
  import javafx.scene.layout.StackPane;\nimport javafx.stage.Stage;\n\n/**\n * FileName:ImageViewer.java\n\
  \ *\n * 此应用创建一个 BorderPane 作为场景的根节点，\n * 并在 BorderPane 的中心添加一个 StackPane\n * 场景的初始大小设置为\
  \ 600x400\n * StackPane 的大小将自动设置以适应场景的大小。\n * 当用户调整窗口大时，StackPane 将会被调整大小。\n */\n\
  \npublic class ImageViewer extends Application {\n\n  @Override\n  public void start(Stage\
  \ stage) {\n    BorderPane rootPane = new BorderPane();\n    StackPane imageArea\
  \ = new StackPane();\n    rootPane.setCenter(imageArea);\n\n    Scene scene = new\
  \ Scene(rootPane, 600, 400); \n    stage.setTitle(\"ImageViewer V1.0\");\n    stage.setScene(scene);\n\
  \    stage.show();\n  }\n\n  public static void main(String[] args) {\n    launch(args);\n\
  \  }\n}\n```\n\n### 1.1.1 JavaFX 线程与 Java 启动线程\n\n`Application` 类是 JavaFX 应用的入口点。它定义了以下重要方法：\n\
  \n`public void init() throws Exception`\n\n`public abstract void start(Stage primaryStage)\
  \ throws Exception`\n\n`public void stop() throws Exception`\n\n`init` 方法不执行任何操作，从\
  \ Java 启动线程中调用。而 `start` 方法是一个抽象方法且必须被重写，它在 `init` 方法返回后从 JavaFX 线程中调用。如果你需要在 `start`\
  \ 方法之前执行一些初始工作，可以通过重写 `init` 方法来实现；但至关重要是，作为活跃场景成员的节点必须从 JavaFX 线程访问。同样，`Scene`\
  \ 对象或 `Stage` 对象的构造也必须从 JavaFX 线程访问。\n\n### 1.1.2 捕获图像渲染区域的调整事件\n\n出于调试和测试目的，在此处注册了一个\
  \ `ChangeListener`，它提供了一个 `changed` 方法，以便在图像渲染区域的宽度或高度变化时收到通知。当用户调整应用程序窗口大时，图像渲染区域的宽度或高度就会发生变化。\n\
  \n为了观察属性值注册监听器，我们使用此方法：\n\n```\n void addListener(ChangeListener<? super T> listener)\
  \ \n```\n\n该方法定义在 `javafx.beans.value.ObservableValue` 接口中，提供了 `changed(ObservableValue<?\
  \ extends T> observable, T oldValue, T newValue)` 方法的实现，当属性值更改时调用。\n\n同一个 `ChangeListener`\
  \ 允许注册到多个 `ObservableValue` 上。为了避免内存泄漏问题，当不再需要观察值时，使用 `removeListener(ChangeListener<?\
  \ super T> listener)` 方法取消监听器是一种良好的编程习惯，该方法会移除可观测值与监听器之间的链接。\n\n`StackPane` 类从 `javafx.scene.layout.Region`\
  \ 类继承 `width` 和 `height` 属性。这两个属性的类型都是 `ReadOnlyDoubleProperty`，它是实现 `ObservableValue`\
  \ 接口的抽象类。正如名称所示，`ObservableValue` 持有一个可观测的值，你可以监听值的变化并采取必要的行动。\n\n以下代码演示了如何监控放置在\
  \ `BorderPane` 中心 `StackPane` 图像渲染区域的调整大小事件。\n\n导入语句：\n\n```\n import javafx.beans.value.ChangeListener;\n\
  import javafx.beans.value.ObservableValue;\n```\n\n列表 1-2. 为图像渲染区域的宽度和高度属性添加监听器：\n\
  \n```\n imageArea.widthProperty().addListener(new ChangeListener<Object>() {\n \
  \ public void changed(ObservableValue o, Object oldVal, Object newVal) {\n    System.out.format(\"\
  imageArea width changed from %.1f to %.1f%n\",\n      oldVal, newVal);\n  }\n});\n\
  imageArea.heightProperty().addListener(new ChangeListener<Object>() {\n  public\
  \ void changed(ObservableValue o, Object oldVal, Object newVal) {\n    System.out.format(\"\
  imageArea height changed from %.1f to %.1f%n\",\n      oldVal, newVal);\n  }\n});\n\
  ```\n\n列表 1-3. `ImageViewer` 类的完整源代码如下：\n\n\n\n\n\n```java\n package imageviewer;\n\
  \nimport javafx.application.Application;\nimport javafx.beans.value.ChangeListener;\n\
  import javafx.beans.value.ObservableValue;\nimport javafx.scene.Scene;\nimport javafx.scene.layout.BorderPane;\n\
  import javafx.scene.layout.StackPane;\nimport javafx.stage.Stage;\n\n/**\n * File\
  \ Name: ImageViewer.java\n * (in directory: ImageViewer1.0/src/example1/imageviewer/)\n\
