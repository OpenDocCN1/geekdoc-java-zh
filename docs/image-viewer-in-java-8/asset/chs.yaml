  \ height changed from 384.0 to 448.0\n```\n\n## 1.2 创建菜单栏\n\n在本节中，我们正在创建一个 `MenuBar`，并将其添加到\
  \ `BorderPane` 的顶部，`BorderPane` 是场景图的根节点。\n\n通常，一个 `MenuBar` 对象包含多个水平排列的 `Menu`，而每个\
  \ `Menu` 又包含多个 `MenuItem`。由于 `Menu` 类继承自 `MenuItem` 类，你可以在一个 `Menu` 内部放置另一个 `Menu`，这种嵌套的称为子菜单。由于\
  \ `MenuBar` 渲染在窗口上，用户看到的只是菜单名称，只有当鼠标左键点击菜单名称，或者按下定义为菜单快捷键的内存助记键组合时，每个菜单的内容才会显示。\n\
  \n采用菜单用户界面的优点包括以下点：\n\n*   **占用空间更少**\n    当用户不需要菜单时，它仅占用其名称所需的空间。\n*   **可组织性**\n\
  \    为了方便访问，你可以根据功能将菜单项组织成树形结构，将相似的菜单项分组在同一个菜单中，通过子菜单避免单个菜单过于拥挤，并将请求频繁的菜单项放置在较高层。通常最重要的项被放在树的顶层。\n\
  *   **单按键调用动作**\n    你可以使用助记键机制导航 `MenuBar` 内的菜单，并定义快捷键使使用户可以通过一个按键调用 `MenuItem`\
  \ 的动作。例如，同时按下 Alt 和 F 键显示文件菜单，同时按下 Ctrl 和 S 键执行保存文件操作。\n\n要向 `MenuBar` 添加一个 `Menu`，我们首先调用\
  \ `getMenus()` 方法，该方法返回一个包含 `Menu` 的 `ObservableList`。`ObservableList` 是 `java.util.List`\
  \ 的子接口，因此我们可以使用 `add` 方法（Java `Collection` 接口中定义的内置工具方法之一）将菜单附加到列表中。代码如下：\n\n```java\n\
  MenuBar menuBar = new MenuBar();\nMenu menuFile = new Menu(\"File\");\nmenuBar.getMenus().add(menuFile);\n\
  ```\n（注：此处原文中存在大量重复的说明和代码，已根据要求进行处理，保留核心逻辑与翻译）\n\n### 1.2.1 将文件添加到菜单\n\n在此应用程序中，`MenuBar`\
