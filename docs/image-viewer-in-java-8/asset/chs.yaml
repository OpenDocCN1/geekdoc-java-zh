  )),\n      new Stop(0.4, Color.web(\"#A8B9D4\")),\n      new Stop(1, Color.web(\"\
  #5173A8\"))});\n\n    // 当鼠标按下下一个按钮时，绘制填充矩形\n    final LinearGradient lgPressed\
  \ = new LinearGradient(0, 0, 1, 0, true,\n        CycleMethod.NO_CYCLE, new Stop[]{\n\
  \      new Stop(0, Color.web(\"#87A7C6\")),\n      new Stop(0.4, Color.web(\"#A8B9D4\"\
  )),\n      new Stop(1, Color.web(\"#2F4F4F\"))});\n\n    // 创建一个表示下一个图标视觉标志的 polygon\
  \ 形\n    // 8 像素厚度，内缩为 2, 2, 2, 5\n    final Polygon polygon = new Polygon();\n\
  \    Double[] dArray = {\n      5.0, 2.0,\n      22.0, 17.0,\n      5.0, 32.0,\n\
  \      5.0, 25.0,\n      14.0, 17.0,\n      5.0, 9.0};\n    polygon.getPoints().addAll(dArray);\n\
  \    polygon.setFill(Color.WHITE);\n    polygon.setStroke(Color.web(\"#436B8B\"\
