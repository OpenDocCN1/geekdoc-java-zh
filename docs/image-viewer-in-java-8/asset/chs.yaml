  \ 的尺寸被扩大为 1280 x 960；然而，可见部分仍为 600 x 375。\n\n为 `StackPane` 设置最小尺寸可以确保每当打开新图像时，都不会发生尺寸变化事件，同时也简化了后续章节中要开发的代码。\n\
