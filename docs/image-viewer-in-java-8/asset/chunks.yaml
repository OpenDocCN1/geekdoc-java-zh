    \n## 1.4 Implement Fit Width, Fit Height and Original Size Viewing Options\n\n\
    In this section, we demonstrate how to adjust viewing size of an image to fit\
    \ the application window. The `ImageView` is created as a child of a `StackPane`,\
    \ and according to `StackPane` default layout strategy, an image is positioned\
    \ in the center of `StackPane`; therefore, if the size of an image is larger than\
    \ the current available viewing space, which is subject to the size of a scene,\
    \ outer portion of the image will be blocked, thus a user won't be able to view\
    \ the whole image.\n\nIn last section, we created an `Option` menu containing\
    \ three viewing choices: `Fit Width`, `Fit Height`, and `Original Size`. An image\
    \ is rendered based on the viewing option currently selected, initially it is\
    \ set to `Original Size`. By default, we'd like to preserve the original width\
    \ to height ratio of an image when scaling is in action. To do so, we set value\
    \ of `preserveRatio` property to `true` as follows:\n\nListing 1-11. Set value\
    \ of `preserveRatio` property to `true`:\n\n```\n final ImageView imageView =\
    \ new ImageView();\nimageView.setPreserveRatio(true);\n```\n\nNow, let's explore\
    \ two approaches to render image according to the viewing option currently selected.\n\
    \n### 1.4.1 Approach One: Bind `ImageView`'s `fitWidth`/`fitHeight` Properties\
    \ to Scene's `width`/`height` Properties Respectively\n\nWe use `bind` and `unbind`\
    \ methods defined in `Property` interface to implement `Fit Width`, `Fit Height`,\
    \ and `Original Size` viewing options.\n\nWhat enticing here is that, once the\
    \ binding becomes effective, an image's viewing width and/or height will be changed\
    \ accordingly whenever width and/or height of `Scene` is changed dynamically.\n\
    \n#### 1.4.1.1 Implement Fit Width Viewing Option\n\nIf a user selects `Fit Width`\
    \ as viewing option, we'll have `fitWidth` property of `ImageView` bind with `width`\
    \ property of `Scene`, and unbind `fitHeight` property. Here are codes:\n\nListing\
    \ 1-12. Bind `fitWidth` property of `ImageView` object with `width` property of\
    \ `Scene`:\n\n```\n imageView.fitWidthProperty().bind(scene.widthProperty());\n\
    imageView.fitHeightProperty().unbind();\n// Besides unbind, must also set fit\
    \ height to 0\nimageView.setFitHeight(0);\n```\n\n#### 1.4.1.2 Implement Fit Height\
    \ Viewing Option\n\nIf `Fit Height` is selected as viewing option, we'll have\
    \ `fitHeight` property of `ImageView` bind with `height` property of `Scene`,\
    \ subtracting height of menu bar, and unbind `fitHeight` property.\n\nWe are using\
    \ `subtract` method to calculate the available viewing height for an image. The\
    \ `subtract(`double other`)` method, which inherited from `DoubleExpression` class\
    \ by `DoubleProperty` class, returns a new `NumberBinding` object that calculates\
    \ the difference of this `NumberExpression` and the given constant value. Here\
    \ are codes:\n\nListing 1-13. Bind `fitHeight` property of `ImageView` with `height`\
    \ Property of scene, subtracting height of menu bar:\n\n```\n // Available height\
    \ for rendering image is\n// subtract menubar's height from scene height\nimageView.fitHeightProperty().bind(\n\
    \   scene.heightProperty().subtract(menuBar.getHeight()));\nimageView.fitWidthProperty().unbind();\n\
    // Besides unbind, must also set fit width to 0 \nimageView.setFitWidth(0); \n\
    ```\n\n#### 1.4.1.3 Implement Original Size Viewing Option\n\nIf `Original Size`\
    \ is selected as viewing option, we'll have `fitWeight` property as well as `fitHeight`\
    \ property of the `ImageView` object unbind. Here are codes:\n\nListing 1-14.\
    \ Unbind `fitWidth` property as well as `fitHeight` property of the `ImageView`\
    \ object:\n\n```\nimageView.fitWidthProperty().unbind();\nimageView.fitHeightProperty().unbind();\n\
    // Besides unbind, must also set fit height/height to 0\nimageView.setFitWidth(0);\n\
    imageView.setFitHeight(0);\n```\n\nPlease note that, changing values of `fitWidth`/`fitHeight`\
    \ properties of an `ImageView` object doesn't affect `width`/`height` properties\
    \ of the underlying `Image` object. Properties of the `Image` object, such as\
    \ `width` and `height`, are staying intact while properties relevant to viewing\
    \ options of the `ImageView` are altering dynamically by a user.\n\nThe advantage\
    \ of approach one is that you don't need to register an event handler to response\
    \ to resizing event of a `Scene`. When the application window is resized dynamically,\
    \ the `Scene` is resized, accordingly the corresponding properties of the `ImageView`\
    \ is changed, and the size of image rendering area, a `StackPane` object, will\
    \ be re-computed automatically.\n\nThe following snippets of codes show the implementation\
    \ of approach one.\n\nListing 1-15. Listen to the change of selection for radio\
    \ items and use `bind` and `unbind` methods to adjust `fitWidth` and `fitHeight`\
    \ of an image view.\n\n```\n final StackPane imageArea = new StackPane();\n\n\
    \   ...\n\nfinal Scene scene = new Scene(rootPane, 600, 400); \n\n   ...\n\nfinal\
    \ MenuBar menuBar = new MenuBar();\n\n   ...\n\n// Create toggle group\nfinal\
    \ ToggleGroup groupOption = new ToggleGroup();\n\n// Create radio menu items and\
    \ add to the toggle group\nfinal RadioMenuItem fitWidth = new RadioMenuItem(\"\
    Fit Width\");\nfitWidth.setToggleGroup(groupOption);\nfinal RadioMenuItem fitHeight\
    \ = new RadioMenuItem(\"Fit Height\");\nfitHeight.setToggleGroup(groupOption);\n\
    final RadioMenuItem original = new RadioMenuItem(\"Original Size\");\noriginal.setToggleGroup(groupOption);\n\
    \ngroupOption.selectedToggleProperty().addListener(new ChangeListener<Toggle>()\
    \ {\n  public void changed(ObservableValue<? extends Toggle> ov,\n          Toggle\
    \ old_toggle, Toggle new_toggle) {\n    if (groupOption.getSelectedToggle() !=\
    \ null) {\n      RadioMenuItem choiceItem = (RadioMenuItem) groupOption.getSelectedToggle();\n\
    \      if (choiceItem == fitWidth) {\n        System.out.println(\"fitwidth\"\
    );\n        imageView.fitWidthProperty().bind(scene.widthProperty());\n      \
    \  imageView.fitHeightProperty().unbind();\n        // Besides unbind, must also\
    \ set fit height to 0\n        imageView.setFitHeight(0);\n      } else if (choiceItem\
    \ == fitHeight) {\n        System.out.println(\"fitheight\");\n        // Available\
    \ height for rendering image is\n        // subtract menubar's height from scene\
    \ height\n        imageView.fitHeightProperty().bind(\n          scene.heightProperty().subtract(menuBar.getHeight()));\n\
    \        imageView.fitWidthProperty().unbind();\n        // Besides unbind, must\
    \ also set fit width to 0 \n        imageView.setFitWidth(0); \n      } else {\n\
    \        System.out.println(\"original size\");\n        imageView.fitWidthProperty().unbind();\n\
    \        imageView.fitHeightProperty().unbind();\n        // Besides unbind, must\
    \ also set fit height/height to 0\n        imageView.setFitWidth(0);\n       \
    \ imageView.setFitHeight(0);\n      }\n    } \n  }\n});\n```\n\n#### 1.4.1.4 Complete\
    \ Source Codes of `ImageViewer` Class\n\nComplete source codes of `ImageViewer`\
    \ class for Approach One become these:\n\nListing 1-16. Complete source codes\
    \ of ImageViewer class become like this:\n"
