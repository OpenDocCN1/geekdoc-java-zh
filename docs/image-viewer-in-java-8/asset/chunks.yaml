  trans: "\n\n## 2.1.8 使用便利方法注册事件处理器以处理鼠标事件\n\n## 2.1.9 完善 `createNextButton()` 方法的源代码\n\
    \n## 2.1.10 为 `Node` 安装 `Tooltip`\n\n## 2.2 在 `StackPane` 中调整 `Next` 按钮的默认位置\n\
    \n## 2.3 在 `StackPane` 中添加 `Previous` 按钮并调整其位置\n\n## 2.4 实现鼠标点击事件处理器\n\n### 2.4.1\
    \ 配置 `FileChooser` \n\n### 2.4.2 创建列表迭代器以遍历当前目录下的现有文件\n\n### 2.4.3 在 `ImageViewer`\
    \ 类中定义属性\n\n## 2.5 完善 `Image Viewer V1.1` 的源代码\n\n### 2.5.1 完善 `FileUtils` 类的源代码\n\
    \n### 2.5.2 完善 `ImageViewer` 类的源代码\n\n## 2.6 总结\n\n## 2.1 添加 `Next` 按钮\n\n我们没有使用内置\
    \ JavaFX 控件中的 `Button` 类，而是通过使用以下类来实现自定义工具类，从而设计一个自定义按钮：\n\n* `Group`\n  作为父级容器。\n\
    \n* `Shape`\n    * `Rectangle`\n      作为边界框。\n    * `Polygon`\n      作为 `Next`\
    \ 图标的视觉标识。\n\n* `LinearGradient` 和 `Color`\n  用于填充背景和描绘边框。\n\n* `EventHandler`\
    \ 和 `MouseEvent`\n  用于处理鼠标进入、点击和离开事件。\n\n### 2.1.1 使用 `Group` 作为父级容器\n\n`Group`\
    \ 类位于 `javafx.scene` 包中，是 `javafx.scene.Parent` 的子类。`Group` 的功能非常直观。它允许你将各种节点组合在一起而不施加自动布局。下面的代码段显示了如何向\
    \ `Group` 添加节点：\n\n```\nGroup buttonGroup = new Group();\nRectangle rect = new\
    \ Rectangle(0, 0, 25, 35);\nPolygon polygon = new Polygon();\nbuttonGroup.getChildren().addAll(rect,\
    \ polygon);\n```\n\n关于 `Group` 特性的更多信息，请参阅卷Ⅱ：开发交互式形状绘制工具，第 1 章 线路绘制器，第 1.1.1 节在\
    \ BorderPane 中心添加 Pane 作为绘板。\n\n### 2.1.2 使用 `Shape` 类渲染 2D 几何基元\n\nJavaFX 提供了一个非常有吸引力的类\
    \ `Shape` 用于渲染 2D 几何基元。它是一个继承自 `javafx.scene.Node` 类的抽象类，作为某些基础 2D 几何形状的基类。它的直接子类有：`Arc`、`Circle`、`CubicCurve`、`Ellipse`、`Line`、`Path`、`Polygon`、`Polyline`、`QuadCurve`、`Rectangle`、`SVGPath`、`Text`。`Shape`\
    \ 类定义了 2D 几何基元的通用属性，如 `fill`、`stroke`、`strokeType`、`strokeWidth` 等。\n\n为形状分别设置\
    \ `fill` 和 `stroke` 属性的值是非常常见的。使用 `setFill` 方法指定渲染背景的颜色，使用 `setStroke` 方法指定渲染边框的颜色。请注意，Line、Polyline\
    \ 和 Path 的 `fill` 属性的默认值为 `null`，而其他形状为 `Color.BLACK`；Line、Polyline 和 Path 的 `stroke`\
    \ 属性的默认值为 `Color.BLACK`，而其他形状为 `null`。\n\n现在我们将展示你如何利用 `Shape` 的功能来实现自定义的 `Next`\
    \ 按钮。\n\n### 2.1.3 使用 `Rectangle` 形状作为自定义按钮的边界框\n\n以下是完成这些操作的代码：使用带有参数 x, y, width\
    \ 和 height 的构造函数创建一个 Rectangle，并为每个所需的属性设置适当的值。\n\n列表 2-1。创建一个 `Rectangle` 并设置这些属性的值：`fill`、`stroke`、`arcHeight`、`arcWidth`：\n\
    \n```\nRectangle rect = new Rectangle(0, 0, 25, 35);\nrect.arcHeight = 10;\nrect.arcWidth\
    \ = 10;\nrect.setFill(Color.GRAY);\nrect.setStroke(Color.LIGHTGRAY);\n```\n\n\
    ### 2.1.4 绘制背景和边框\n\n`LinearGradient` 和 `Color` 位于 `javafx.scene.paint` 包中，是 `Paint`\
    \ 的两个子类，用于绘制背景和边框。\n\n`LinearGradient` 和 `Color` 位于 `javafx.scene.paint` 包中，是\
    \ `Paint` 的两个子类，用于绘制背景和边框。\n\n`LinearGradient` 和 `Color` 位于 `javafx.scene.paint`\
    \ 包中，是 `Paint` 的两个子类，用于绘制背景和边框。\n\n### 2.1.5 设置 `arcHeight` 和 `arcWidth` 属性渲染圆矩形\n\
    \n`arcHeight` 和 `arcWidth` 是 `Rectangle` 类中定义的属性，用于指定矩形形状四个角弧的高度和宽度直径。它们的默认值为\
    \ `0.0`。\n\n接下来的图展示了如何为 `arcHeight` 和 `arcWidth` 属性设置正确的值以渲染圆矩形。与圆矩形角弧重叠的圆和椭圆是为了方便比较。\n\
    \n"
- fmt: "\nInstead of using image as visual sign of `Next` button, a `Polygon` of arrow\
    \ shape is instantiated. The `getPoints()` method is used to obtain a list which\
    \ is type of `ObservableList<Double>`, then the basic utilities, defined in `Collection`\
    \ interface, is used to manipulate the content of the list. A series of x and\
    \ y coordinates, stored in an array of `Double` value, are added to the list,\
