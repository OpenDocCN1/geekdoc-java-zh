    \ [JavaFX Application Thread vs. Java Launcher Thread](#part0007.xhtml_thread))\n\
    \n*   `void addListener(ChangeListener<? super T> listener`)` method, defined\
    \ in `javafx.beans.value.ObservableValue` interface, adds a `ChangeListener` by\
    \ providing `changed(ObservableValue<? extends T> observable`, T` oldValue`, T`\
    \ newValue`)` method, to be invoked when this property's value is changed.\n \
    \   (See sections: [Catch Resize Event of Image Rendering Area](#part0007.xhtml_image-area-resize),\
    \ and [Catch Resize Event of Scene to Adjust Viewing Size of Image](#part0007.xhtml_scene-resize))\n\
    \n*   `MenuBar`, `Menu`, and `MenuItem` are among fundamental JavaFX UI components,\
    \ reside in `javafx.scene.control` package, for designing compact look-and-feel\
    \ graphical user interfaces using less space.\n    (See section [Create Menu Bar](#part0007.xhtml_add-menu-bar))\n\
    \n*   `java.io.File showOpenDialog(Window ownerWindow`)` method, a convenient\
    \ method provided in `javafx.stage.FileChooser` class, shows a file open dialog\
    \ for navigating a local file system.\n    (See section [Select Image File from\
    \ File Open Dialog and Display Image on `StackPane`](#part0007.xhtml_file-chooser))\n\
    \n*   `void setOnAction(EventHandler<ActionEvent> value`)` method, provided in\
    \ `MenuItem` class, registers an `EventHandler` to be notified when an `ActionEvent`\
    \ occurs.\n    (See section [Select Image File from File Open Dialog and Display\
    \ Image on `StackPane`](#part0007.xhtml_file-chooser))\n\n*   `ImageView` and\
    \ `Image` are classes, reside in `javafx.scene.image`, for loading and viewing\
    \ images.\n    (See [here](#part0007.xhtml_image))\n\n*   `RadioMenuItem` and\
    \ `ToggleGroup`, reside in `javafx.scene.control` package, for creating mutually\
    \ exclusive choices.\n    (See section [Create Menu Bar](#part0007.xhtml_add-menu-bar))\n\
    \n*   `void bind(Value<? extends T> observable)` and `void unbind()` are methods\
    \ in `Property` interface, reside in `javafx.beans`, to create/remove a binding.\n\
    \    (See [here](#part0007.xhtml_image))\n\n*   `DoubleBinding subtract(double\
    \ other`)` method, defined in `javafx.beans.binding.DoubleExpression` class, calculates\
    \ the difference of this `NumberExpression` and the given constant.\n    (See\
    \ [here](#part0007.xhtml_image))\n\n*   `fitWidth` and `fitHeight` are properties\
    \ defined in `ImageView` class, for adjusting the image size.\n    (See [here](#part0007.xhtml_image))\n\
    \n# Chapter 2: Enhanced Image Viewer with Browsing Buttons\n\n## Developing Image\
    \ Viewer V1.1\n\n### Preface\n\nIn previous chapter, we have demonstrated the\
    \ incremental development of a JavaFX application, `ImageViewer V1.0`. So far\
    \ it contains minimum capabilities, nevertheless is a ready-to-use and convenient\
    \ accessory, easily be bundled with a variety of software. Additional functions\
    \ will be added gradually throughout this chapter and the next.\n\nThis chapter\
    \ features the implementation of actions as well as proper placement for two buttons,\
    \ `Next` and `Previous`, two custom-made buttons to open the next or previous\
    \ image.\n\nThe version number is upgraded to 1.1. From detailed descriptions\
    \ and well-documented example codes excerpted from `ImageViewer` V1.1, you will\
    \ become familiar with fundamental capabilities of JavaFX library recounted in\
    \ the [Summary](#part0008.xhtml_summary) section.\n\nThe complete development\
    \ process of `ImageViewer` V1.1 is characterized by the following steps:\n\n*\
    \   2.1 Add `Next` Button](#part0008.xhtml_add_next)\n    *   2.1.1 Use `Group`\
    \ as Parent Container](#part0008.xhtml_group-as-container)\n    *   2.1.2 Use\
    \ `Shape` Class for Rendering 2D Geometric Primitives](#part0008.xhtml_shape-class)\n\
    \    *   2.1.3 Use `Rectangle` Shape as Bounding Box of Custom-Made Button](#part0008.xhtml_rectangle-as-bounding-box)\n\
    \    *   2.1.4 Paint Background and Border of `Shape`](#part0008.xhtml_paint-shape)\n\
    \    *   2.1.5 Set Value of `arcHeight` and `arcWidth` Properties to Render Rounded\
    \ Rectangle](#part0008.xhtml_arc-height-arc-width)\n    *   2.1.6 Use `Polygon`\
    \ Shape as Visual Sign of `Next` Icon](#part0008.xhtml_polygon-as-icon)\n    *\
    \   2.1.7 Set Value of `Cursor` Property for `Node`](#part0008.xhtml_mouse-cursor)\n"
