    \ of submenus, and placing the more frequently requested menu items in upper levels.\
    \ Usually the most important ones are placed on the top level of the tree.\n\n\
    *   Invoke action by one keystroke\n\n    You can use mnemonic mechanism to navigate\
    \ menus within a `MenuBar` and define shortcut keys to enable users to invoke\
    \ the action of a `MenuItem` by one keystroke. For example, press Alt and F keys\
    \ at the same time to show File menu and press Ctrl and S keys at the same time\
    \ to perform save file action.\n\nTo add a `Menu` to a `MenuBar`, first we call\
    \ the `getMenus()` method, which returns an `ObservableList` of `Menu`s. The `ObservableList`\
    \ is a subinterface of `java.util.List`, thus we can use the `add` method, one\
    \ of the basic utilities defined in Java `Collection` interface, to append a menu\
    \ to the list. The codes are as follows:\n\nListing 1-4. Add a `Menu` to a `MenuBar`:\n\
    \n```\n MenuBar menuBar = new MenuBar();\nMenu menuFile = new Menu(\"File\");\n\
    menuBar.getMenus().add(menuFile);\n```\n\nTo add a `MenuItem` to a `Menu`, we\
    \ use `getItems()` method, which returns an `ObservableList` of `MenuItem`s. The\
    \ rest of circumstances are similar to what we have described above. The codes\
    \ are as follows:\n\nListing 1-5. Add a `MenuItem` to a `Menu`:\n\n```\n MenuItem\
    \ load = new MenuItem(\"Load\");\nMenuItem exit = new MenuItem(\"Exit\");\nmenuFile.getItems().addAll(load,\
    \ exit);\n```\n\n### 1.2.1 Add File Menu to Menu Bar\n\nIn this application at\
    \ this point, `MenuBar` contains a `File` menu. The `File` menu contains two menu\
    \ items: `Load` and `Exit`. The following snippets of codes show how to accomplish\
    \ these tasks.\n\nImport Statements:\n\n```\n import javafx.application.Platform;\
    \ \nimport javafx.scene.control.Menu;\nimport javafx.scene.control.MenuBar;\n\
    import javafx.scene.control.MenuItem;\nimport javafx.event.ActionEvent;\nimport\
    \ javafx.event.EventHandler;\n```\n\nListing 1-6. Add a menu bar to `ImageViewer`\
    \ application, place it at the top of root node which is a `BorderPane`:\n\n```\n\
    \ // Add menu bar\nMenuBar menuBar = new MenuBar();\nMenu menuFile = new Menu(\"\
    File\");\nMenuItem load = new MenuItem(\"Load\");\nMenuItem exit = new MenuItem(\"\
    Exit\");\nmenuFile.getItems().addAll(load, exit);\nmenuBar.getMenus().add(menuFile);\n\
    rootPane.setTop(menuBar);\n\n// Add action for exit menu item\nexit.setOnAction(new\
    \ EventHandler<ActionEvent>() {\n  @Override\n  public void handle(ActionEvent\
    \ e) {\n    Platform.exit();\n  }\n});\n```\n\n### 1.2.2 Select Image File from\
    \ File Open Dialog and Display Image on `StackPane`\n\nTo navigate a file system,\
    \ we use `FileChooser` class which provides a convenient method, `showOpenDialog(Window`\
    \ ownerWindow`)` for choosing a file to open.\n\nThe action of `Load` menu item\
    \ is to browse a local file system, select an image file and display the image\
    \ on image rendering area.\n\nThe `setOnAction(EventHandler<ActionEvent>` value`)`\
    \ method, provided in `MenuItem` class, is used to add an event handler to handle\
    \ `ActionEvent` of `Load` menu item.\n\nIn order to load and display images, we\
    \ use `ImageView` class in association with `Image` class. `Image` class loads\
    \ an image given a url in type of `String`, and `ImageView` class displays the\
    \ image on an image rendering area.\n\nFirst, we create an `ImageView` added as\
    \ a child of a `StackPane`. Later, when an image file is obtained, we'll create\
    \ an `Image` object to load the image file and call the `setImage(Image` value`)`\
    \ method provided in `ImageView` class to view the image.\n\nThe situation is\
    \ elaborated as follows: When the `showOpenDialog` method of a `FileChooser` is\
    \ executed, a file open dialog is popped up. When a user selects a file and clicks\
    \ `Open` button in the file open dialog, the `showOpenDialog` method returns the\
    \ selected file, type of `File`, to caller, it is converted to a url of `String`\
    \ representation, and an `Image` object is created given the url as parameter,\
    \ at this point, the image is loaded into memory, yet not showing on screen, the\
    \ selected image is shown as soon as the `setImage` method of an `ImageView` is\
    \ executed. For the sake of efficiency, we create `ImageView` object only once,\
    \ and update its `Image` property each time a new image file is selected and opened."
