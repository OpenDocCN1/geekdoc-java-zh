    )\n\n请记住，我们将 `StakePane` 的最小尺寸设置为 (0, 0)，以避免其因子节点 `ImageView` 而自动更改大小。如果不这样做，每当加载并显示大于\
    \ `StackPane` 可视边界的图像时，`Next` 按钮的位置可能会出现复杂的情况。该设置简化了调整 `Next` 按钮位置的解决方案。\n\n下一张截图显示了按原始尺寸显示的大尺寸图像，图像超出\
    \ `StakePane` 边界的部分是不可见的。如果我们没有为 `StakePane` 设置最小尺寸，它的尺寸将随其内容而扩大，导致 `Next` 按钮将掉到可视边界之外。\n\
