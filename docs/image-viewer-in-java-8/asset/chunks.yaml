    \ super MouseEvent>` value`)`\n\n    (See section [Use Convenience Methods to\
    \ Register Event Handlers to Handle Mouse Events](#part0008.xhtml_event-handler))\n\
    \n*   `static void install(Node` node`, Tooltip` t`)` method, provided in `Tooltip`\
