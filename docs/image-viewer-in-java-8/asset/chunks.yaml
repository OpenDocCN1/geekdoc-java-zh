    \ `ObservableValue`。\n\n    ```\nvoid unbind()\n```\n\n    取消此属性的绑定。\n\n（参见节章节\
    \ 在 `ImageViewer` 类中定义属性）\n\n*   `WritableObjectValue<T>` 接口，位于 `javafx.beans.value`\
    \ 包中并继承自 `WritableValue<T>`，定义了以下方法：\n\n    ```\nT get()\n    ```\n\n    获取封装的值。\n\
    \n    ```\n    void set(T value)\n    ```\n\n    设置封装的值。\n\n（参见 此处）\n\n# 第 3 章\n\
    \n具有幻灯片功能的增强图像查看器\n\n--开发图像查看器 V1.2\n\n## 前言\n\n在这一阶段，`ImageViewer` 已经具备了作为高效图像查看工具足够的能力。基于目前构建的基础结构，可以容易地逐步开发更多功能。\n\
    \n本章重点介绍幻灯片功能的实现以及对 GUI 整体外观和效果的微调。我们将演示如何使用位于 `javafx.concurrent` 包中的并发类开发多线程\
    \ JavaFX 应用程序。\n\n`ImageViewer` 的版本号升级到了 1.2。通过从 ImageViewer V1.2 中摘取的详细描述和文档良好的示例代码段，你将熟悉\
    \ 总结 节中所述的 JavaFX 库的基本功能。\n\nImageViewer V1.2 的完整开发过程具有以下步骤的特点：\n\n*   3.1 在 `BorderPane`\
    \ 底部添加状态栏\n    *   3.1.1 创建 `HBox` 布局作为状态栏和 `Text` 节点显示图像名称\n    *   3.1.2 设置\
    \ `imageName` 属性的值\n*   3.2 改进按钮的响应 Aspect\n    *   3.2.1 禁用按钮表示没有更多图片可以打开\n \
    \   *   3.2.2 鼠标按下时改变按钮外观\n*   3.3 添加幻灯片功能\n    *   3.3.1 添加“开始幻灯片”和“停止幻灯片”菜单项\n\
    \        *   3.3.1.1 绑定菜单项的禁用属性\n    *   3.3.2 在另一个线程上执行幻灯片\n        *   3.3.2.1\
    \ 创建继承自 `Service` 类的 `SlideshowService` 类\n        *   3.3.2.2 配置幻灯片服务对象\n   \
    \     *   3.3.2.3 为“开始幻灯片”和“停止幻灯片”菜单项实现动作事件事件处理器\n    *   3.3.3 ImageViewer 应用程序完整的\
    \ `start(Stage stage)` 方法\n    *   3.3.4 与 `Load` 菜单项和 `Previous` 按钮的事件处理器协调\n\
    *   3.4 在幻灯片之间添加淡入切换效果\n    *   3.4.1 `SlideshowService` 类的源代码\n*   3.5 图像查看器\
    \ V1.2 的完整源代码\n*   3.6 总结\n\n## 3.1 在 `BorderPane` 底部添加状态栏\n\n在实现幻灯片功能之前，我们将在根面板（一个\
    \ `BorderPane`）的底部添加一个状态栏。状态栏用于显示图像名称，即当前图像的文件名。\n\n### 3.1.1 创建 `HBox` 布局作为状态栏和\
    \ `Text` 节点显示图像名称\n\n创建一个 `HBox`（内置布局面板之一，它将其子元素水平排列在行中）作为状态栏。并创建一个 `Text` 节点来显示图像名称。创建一个\
    \ `HBox` 作为状态栏，代码段如下：\n\n```\nBorderPane rootPane = new BorderPane();\nHBox statusBar\
    \ = new HBox();\nText statusText = new Text(\"\");\nstatusBar.getChildren().add(statusText);\n\
    rootPane.setBottom(statusBar);\n```\n\n"
