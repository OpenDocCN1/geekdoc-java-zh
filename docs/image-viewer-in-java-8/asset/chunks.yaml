    \n* `public final void setOnFailed(EventHandler<WorkerStateEvent> value)`\n  设置\
    \ `onFailed` 属性的值，提供 `handle` 方法的实现，当 `Worker` 的状态转换到 `FAILED` 时会调用该方法。\n\n* `public\
