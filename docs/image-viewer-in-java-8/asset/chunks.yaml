    \ class, implements `Property<java.lang.String>` and `WritableStringValue`.\n\n\
    `WritableStringValue` extends `WritableObjectValue<java.lang.String>`.\n\n`SimpleStringProperty`\
    \ derived from `StringProperty` class.\n\n(See section [Define Properties in `ImageViewer`\
    \ Class](#part0008.xhtml_properties))\n\n*   `Property<T>` interface, resides\
    \ in `javafx.beans.property` package, defines methods which are common to all\
    \ properties such as the followings:\n\n    ```\nvoid bind(ObservableValue<? extends\
    \ T> observable)\n    ```\n\n    Bind this property unidirectional to the given\
    \ `ObservableValue`.\n\n    ```\nvoid unbind()\n```\n\n    Unbind for this property.\n\
    \n(See section [Define Properties in `ImageViewer` Class](#part0008.xhtml_properties))\n\
    \n*   `WritableObjectValue<T>` interface, resides in `javafx.beans.value` package\
    \ and extends `WritableValue<T>`, defines the following methods:\n\n    ```\n\
    T get()\n    ```\n\n    Get the wrapped value.\n\n    ```\nvoid set(T value)\n\
    \    ```\n\n    Set the wrapped value.\n\n(See [here](#part0008.xhtml_property-set-method))\n\
    \n# Chapter 3\n\nEnhanced Image Viewer with Slide Show Capacity\n\n--Developing\
    \ Image Viewer V1.2\n\n## Preface\n\nAt this stage, the `ImageViewer` application\
    \ has contained adequate abilities as an effective image viewing tool. Based on\
    \ the fundamental structure built so far, more functionality may be incrementally\
    \ developed with ease.\n\nThis chapter features the implementation of slide show\
    \ capabilities as well as fine-tuning overall look and feel of GUIs. We'll demonstrate\
    \ how to develop a multi-threaded JavaFX application using classes for concurrency,\
    \ reside in `javafx.concurrent` package.\n\nThe version number of `ImageViewer`\
    \ is upgraded to 1.2. From detailed descriptions and well-documented example codes\
    \ excerpted from ImageViewer V1.2, you will become familiar with fundamental capabilities\
    \ of JavaFX library recounted in the [Summary](#part0009.xhtml_summary) section.\n\
    \nThe complete development process of ImageViewer V1.2 is characterized by the\
    \ following steps:\n\n*   [3.1 Add Status Bar at the Bottom of `BorderPane`](#part0009.xhtml_add-footer)\n\
    \    *   [3.1.1 Create `HBox` Pane as Status Bar and `Text` Node to Show Image\
    \ Name](#part0009.xhtml_create-hbox-text)\n    *   [3.1.2 Set Value of `imageName`\
    \ Property](#part0009.xhtml_set-value-image-name)\n*   [3.2 Improve Button's Reaction\
    \ Aspect](#part0009.xhtml_improve-button)\n    *   [3.2.1 Disable Button to Indicate\
    \ No More Image to Open](#part0009.xhtml_disable-button)\n    *   [3.2.2 Change\
    \ Button Appearance When Mouse Is Pressed](#part0009.xhtml_pressed-button)\n*\
    \   [3.3 Add Slide Show Capabilities](#part0009.xhtml_add-slideshow)\n    *  \
    \ [3.3.1 Add `Start Slideshow` and `Stop Slideshow` Menu Items](#part0009.xhtml_add-slideshow-menu-item)\n\
    \        *   [3.3.1.1 Bind Disable Property of Menu Item](#part0009.xhtml_slideshow-disable-bind)\n\
    \    *   [3.3.2 Execute Slide Show on Another Thread](#part0009.xhtml_slideshow-thread)\n\
    \        *   [3.3.2.1 Create `SlideshowService` Class that Extends `Service` Class](#part0009.xhtml_slideshow-service)\n\
    \        *   [3.3.2.2 Configure Slide Show Service Object](#part0009.xhtml_configure-slideshow)\n\
    \        *   [3.3.2.3 Implement Event Handlers of Action Events for `Start Slideshow`\
    \ and `Stop Slideshow` Menu Items](#part0009.xhtml_slideshow-action)\n    *  \
    \ [3.3.3 The Complete `start(Stage stage)`` Method of `ImageViewer` Application](#part0009.xhtml_complete-start)\n\
    \    *   [3.3.4 Coordinate with Event Handlers of `Load` Menu Item and `Previous`\
    \ Button](#part0009.xhtml_coordinate)\n*   [3.4 Add Fade Transition between Slides](#part0009.xhtml_fade-transition)\n\
    \    *   [3.4.1 Complete Source Codes of `SlideshowService` Class](#part0009.xhtml_complete-slide-show-service)\n\
    *   [3.5 Complete Source Codes of `Image Viewer V1.2`](#part0009.xhtml_complete-source-codes)\n\
    *   [3.6 Summary](#part0009.xhtml_summary)\n\n## 3.1 Add Status Bar at the Bottom\
    \ of `BorderPane`\n\nPrior to the implementation of slide show feature, we'll\
    \ add a status bar at the bottom of the root pane which is a `BorderPane`. The\
    \ status bar is for displaying image name, the file name of the current image.\n\
    \n### 3.1.1 Create `HBox` Pane as Status Bar and `Text` Node to Show Image Name\n\
    \nAn `HBox`, one of build-in layout panes, placing its children in one row horizontally,\
    \ is created as status bar. And a `Text` node is created to display image name.\
    \ Here's the snippet of codes to do these:\n\n```\nBorderPane rootPane = new BorderPane();\n\
    \    HBox statusBar = new HBox();\n    Text statusText = new Text(\"\");\n   \
    \ statusBar.getChildren().add(statusText);\n    rootPane.setBottom(statusBar);\n\
    ```\n\nPlease notice that `Text` class derives from `Node` class, and is one of\
    \ direct subclasses of `Shape` class that carries out common needs for rendering\
    \ geometric primitives.\n\nA `Text` being considered a `Node` as well as a `Shape`\
    \ comes with significant benefits. All features common to JavaFX nodes can be\
    \ applied to `Text` objects. They can be placed in a layout pane utilizing the\
    \ automatic placement capabilities, applying transformations and transitions,\
    \ customizing the presentation style using CSS, etc. Also they possess common\
    \ properties defined in `Shape` class such as `fill`, `stroke`, `strokeType`,\
    \ `strokeWidth`, etc.\n\nWe'd like to set preferred value of properties as below\
    \ for the `HBox` created as a status bar:\n\n`padding`\n\nThe `padding` property,\
    \ inherited from `Region` class, defines padding of top, right, bottom and left\
    \ for a region. `void setPadding(Insets value)` method is called to set value\
    \ for this property.\n\n`spacing`\n\nThe `spacing` property, defined in `HBox`\
    \ class, specifies the horizontal space between children in `HBox` pane. `void\
    \ setSpacing(double value)` method is called to set value for this property.\n\
    \n`style`\n\nThe `style` property, defined in `Node` class, specifies CSS style\
    \ for this node. The value of this property is a string complying with the `style`\
    \ attribute of HTML element. `void setStyle(String value)` method is called to\
    \ set the background color of status bar, specifying a property-value pair in\
    \ a string with format like:\n\n```\n\"-fx-background-color: linear-gradient(#F0FFFF,\
    \ #70800)\"\n```\n\nHere's the snippet of codes to do these:\n\n```\nHBox statusBar\
    \ = new HBox();\n    statusBar.setPadding(new Insets(4, 12, 4, 12));\n    statusBar.setSpacing(4);\n\
    \    statusBar.setStyle(\n        \"-fx-background-color: linear-gradient(#F0FFFF,\
    \ #70800)\");\n```\n\nAs for the `Text` object, values for `font` property and\
    \ `fill` property are set. Here's the snippet of codes to do these:\n\n```\nText\
    \ statusText = new Text(\"\");\n    statusText.setFont(Font.font(\"Verdana\",\
    \ FontWeight.BOLD, 12));\n    statusText.setFill(Color.DARKSLATEBLUE);\n```\n\n\
    To make a scene in vivid contrast against an image rendered in a `StackPane`,\
    \ we prefer the background of the scene be `Color.BLACK`. The constructor that\
    \ allows specifying color is employed:\n\n```\nScene scene = new Scene(rootPane,\
    \ 600, 400, Color.BLACK);\n```\n\nPlease notice that, there's an unusual aspect\
    \ in JavaFX 8 (JDK 8u66 running on Windows 8.1), regarding background of a `Scene`;\
    \ to see through the background color of a `Scene`, we need set root pane's background\
    \ color to transparent. Here's the line of code:\n\n```\nrootPane.setStyle(\"\
    -fx-background-color: transparent;\");\n```\n\nThe status bar, a region added\
    \ at the bottom of the root pane, affects the height of image rendering area,\
    \ a `StackPane`. Thus the line of code which binds `fitHeight` property of an\
    \ `ImageView` with `height` property of a `Scene` need be changed to this:\n\n\
    ```\nimageView.fitHeightProperty().bind(\n                scene.heightProperty().subtract(\n\
    \                  menuBar.getHeight() + statusBar.getHeight()));\n```\n"
