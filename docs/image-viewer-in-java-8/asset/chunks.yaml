    \ a user selects a file and clicks `Open` button in the file open dialog, the\
    \ `showOpenDialog` method returns the selected file, type of `File`, to caller,\
    \ it is converted to a url of `String` representation, and an `Image` object is\
    \ created given the url as parameter, at this point, the image is loaded into\
    \ memory, yet not showing on screen.\n"
