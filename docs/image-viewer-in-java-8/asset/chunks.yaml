    *   `Application` class, resides in `javafx.application` package, is the entry\
    \ point of a JavaFX applications.\n    (See section [Create `ImageViewer` Class\
    \ as Subclass of `Application`](#part0007.xhtml_create-image-viewer))\n\n*   `void\
    \ start(Stage stage)` method, an abstract method in `Application` class, must\
