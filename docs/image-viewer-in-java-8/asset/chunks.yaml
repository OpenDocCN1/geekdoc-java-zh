    \n![](img/image00122.jpeg \"image_viewer_1.jpg\")\n\n## 为什么选择这本书\n\n本书适用于兴趣使用\
    \ JavaFX 库开发丰富客户端应用程序的 GUI 的软件开发者。\n\n书中通过分步开发真实的 Java 应用程序，展示了 JavaFX 中的重要功能。\n\
    \n书中使用了说明性图表来帮助读者立即掌握抽象概念。每章中使用的所有图表都是使用本系列书中开发的图形工具创建的。\n\n如果你属于以下情况，这本书就适合你：\n\
    \n*   Java GUI 程序员（无论是新手还是专业人士），刚开始接触 JavaFX。\n*   具备 JavaFX 基础知识并想学习如何开发交互式工具的\
    \ Java 程序员。\n*   对面向对象的 JavaFX 图形工具和实际应用感兴趣，并希望获得完整且文档良好的源代码的专业软件工程师。\n\n## 本书所需\n\
    \n如果你想编译和运行书中包含的应用程序，你需要下载并安装 `JDK 8`。这里是下载最新版本 `JDK 8` 的网站。要从此 Kindle 电子书中复制完整源代码，建议如下：\n\
    \n1. 在你的电脑上安装 `Calibre`（一个免费开源软件）。\n2. 使用 `Calibre` 中的“添加书籍”功能添加 `Calibre` 的 .mobi\
    \ 文件。\n3. 从 `Calibre` 中打开书籍并将源代码复制到 Java 文件中。\n\n# 引言\n\n本系列书籍是一份针对软件开发者使用 JavaFX\
    \ 构建 Java 应用程序 GUI 的教程，JavaFX 已成为 Java SE 开发工具包 (JDK 8) 的一部分。系列书籍的主要目标是提供一份全面的手册，介绍\
    \ JavaFX 的常用功能和精髓。通过分步开发复杂的工具包，展示了 JavaFX 提供的 API 的用法。系列书中包含了图形工具包的完整源代码、一组可重用的类以及可嵌入的\
    \ JavaFX 应用程序。\n\n## JavaFX 历史\n\n现在让我们浏览 JavaFX 演进的时间线，并领略 JavaFX 的前身：\n\nSeeBeyond\
    \ Technology Corporation 的 Chris Oliver 开发了一项名为 `F3` 的脚本，它是“形式跟随功能”（Form Follows\
    \ Function）的缩写；它允许开发者访问 Swing 类并为快速开发丰富的互联网应用程序创建用户界面 (GUI)。\n\nSun Microsystems\
    \ 在 2005 年 9 月收购了 SeeBeyond，`F3` 在 2007 年 5 月更名为 JavaFX Script。\n\n2008 年 12 月，JavaFX\
    \ 1.0 发布，开发者一直依赖 JavaFX Script 开发 JavaFX 应用程序，直到三年后 JavaFX 2.0 发布。\n\n2010 年 1\
    \ 月，Oracle 完成了对 Sun Microsystems 的收购并继续维护 JavaFX。\n\n2010 年 9 月的 JavaOne 大上，Oracle\
    \ 宣布 JavaFX Script 将停止使用。\n\n2011 年 10 月，JavaFX 2.0 发布，开发者开始使用标准 Java 语言而非 JavaFX\
    \ Script 来访问 JavaFX 库的 API。然而，除了 Java SE JDK 和 JavaFX Runtime 之外，开发和运行使用 JavaFX\
    \ 2.0 编译的应用程序还需要安装 JavaFX SDK。\n\n2013 年 2 月，JavaFX 2.2.7 发布，JDK7 包含了 JavaFX SDK\
    \ 和 JavaFX Runtime。JavaFX 与 JDK 的集成为 JavaFX 开发者带来了极大的便利。使用 JDK 7 及更高版本编译的 JavaFX\
    \ 应用程序不需要额外的安装。\n\n2014 年 3 月 18 日，JavaFX 8 作为 Java SE 开发工具包 (JDK 8) 的一部分发布。\n\
    \n截至本书 2016 年 3 月出版时，最新的 JDK 版本为：2015 年 10 月 20 日的 JDK 866 以及 2016 年 1 月的 JDK\
    \ 872。\n\nJDK 9 的发布（GA）计划于 2017 年 3 月 23 日。\n\n## 前提\n\n书中介绍的 JavaFX 应用程序使用 JavaFX\
    \ 包提供的 API 构建 GUI。不需要熟悉 Swing 包，但读者必须熟悉 Java 编程语言的基础。如果你是 Java 新手，请访问此网站 `http://docs.oracle.com/javase/tutorial/index.html`\
    \ 获取 Java 技术的初步知识。按以下顺序阅读 Oracle 在线文档：\n\n1. 简单的 Java 应用程序“Hello World!”与安装：\n\
    \    访问 `http://docs.oracle.com/javase/tutorial/getStarted/index.html`\n2. Java\
    \ 语言的概念和特性：\n    访问 `http://docs.oracle.com/javase/tutorial/java/index.html`\n\
    3. Java 集合框架：\n    访问 `http://docs.oracle.com/javase/tutorial/collections/index.html`\n\
    4. 核心 Java 类：\n    访问 `http://docs.oracle.com/javase/tutorial/essential/index.html`\n\
    \n## JavaFX 应用程序简介\n\n以下示例旨在让新接触 JavaFX 的读者快速预览如何创建 JavaFX 应用程序。\n\n要开始学习，你需要创建一个继承自\
    \ `javafx.application.Application` 的类（这是 JavaFX 应用程序的入口），并重写必须覆盖的抽象 `start` 方法。一个典型的\
    \ `start` 方法如下：\n\n"
- fmt: "\n```java\npackage imageviewer;\n\nimport javafx.application.Application;\n\
    import javafx.scene.Scene;\nimport javafx.scene.layout.BorderPane;\nimport javafx.scene.layout.StackPane;\n\
    import javafx.stage.Stage;\n\n/**\n * File Name: ImageViewer.java\n *\n * @author\
    \ Shufen Kuo\n */\n\npublic class ImageViewer extends Application {\n\n  @Override\n\
    \  public void start(Stage stage) {\n    BorderPane rootPane = new BorderPane();\n\
    \    StackPane imageArea = new StackPane();\n    rootPane.getChildren().add(imageArea);\n\
    \n    Scene scene = new Scene(rootPane, 600, 400); \n    stage.setTitle(\"ImageViewer\
    \ V1.0\");\n    stage.setScene(scene);\n    stage.show();\n  }\n\n  public static\
    \ void main(String[] args) {\n    launch(args);\n  }\n}\n```\n\n### Scene and\
    \ Stage\n\nThere are two important classes `Scene` and `Stage`, appearing within\
    \ the `start` method. In general, the main task is to create graphical user interfaces\
    \ (GUIs) managed in a hierarchical tree structure called a scene graph, associate\
    \ the root node of the scene graph to a `Scene` object, then place the scene on\
    \ a `Stage` object which stands for the top-level container of JavaFX application,\
    \ acting as the window of the scene graph to interact with users.\n\nFollowing\
    \ snapshot gives you an initial idea of how the GUIs of JavaFX application looks\
    \ like: Figure 1. Snapshot of JavaFX application.(Images/image00123.jpeg javafx_app_guis)\n\
    \n### Nodes\n\nJavaFX introduces a basic class `javafx.scene.Node` which extends\
    \ `java.lang.Object` and provides common properties and methods useful to all\
    \ user interfaces. Often we use the term nodes to reference GUIs.\n\nA scene graph\
    \ may contain nodes of sorts. A node is either a parent (a node with children)\
    \ or a leaf (a node without children); each node can have only one parent, and\
    \ the root node has none. All nodes in scene graph are derived from `javafx.scene.Node`.\
    \ To quickly catch the essential types of nodes in scene graph, we differentiate\
    \ them by the ability to add children or not.\n\n*   You may add children to these\
    \ nodes:\n    The following classes are frequently employed as parent nodes: `Group`,\
    \ `Pane`, and build-in layout panes (they are direct subclasses of `Pane`). Typically\
    \ you call the `getChildren()` method to obtain a list of type `ObservableList<Node>`\
    \ (it is a subinterface of `java.util.List`), then use the basic utilities defined\
    \ in `Collection` which developers are familiar with, to manipulate the content\
    \ of the list.\n\n*   You may not add children to these nodes:\n    The following\
    \ classes are always employed as leaf nodes: `Canvas`, `ImageView`, `MediaView`,\
    \ and all direct subclasses of `Shape` such as `Rectangle`, `Ellipse`, etc.\n\n\
    ### JavaFX and Swing\n\nNow, here is an intriguing issue. For years developers\
    \ have been building GUIs of Java applications using Swing APIs, which are the\
    \ GUI Components of Java Foundation Classes (JFC). Why do we need JavaFX in addition\
    \ to Swing?\n\nIf you possess multitudes of legacy codes written in Swing and\
    \ would like to incorporate JavaFX features into Swing codes, JDK 8 provides the\
    \ mechanism to do so, and vice versa, you can include Swing components in JavaFX\
    \ applications.\n\nThe topic of JavaFX-Swing Interoperability is not covered in\
    \ this book. If you are interested in this topic, visit Oracle Online Documentation\
    \ \"JavaFX: Interoperability -- Java-Swing Interoperability\" here: [http://docs.oracle.com/javase/8/javafx/interoperability-tutorial/fx_swing.htm](http://docs.oracle.com/javase/8/javafx/interoperability-tutorial/fx_swing.htm)\n\
    \nJavaFX is the next generation of Java GUIs. To account for the benefits of employing\
    \ JavaFX capabilities, besides the interoperability between JavaFX and Swing,\
    \ we present the significant features of JavaFX in the section below.\n\n### Essence\
    \ of JavaFX\n\nJavaFX not only allows you to create applications with visual user\
    \ interfaces rapidly but also contains enticing and distinctive abilities. They\
    \ are enumerated as follows:\n\n#### Build-in Layout Panes\n\nJavaFX's layout\
    \ panes are containers that automatically perform various types of placement on\
    \ nodes. You can place any number of nodes in a layout pane, which is a node itself\
    \ and thus can be nested in another layout pane as well. The major advantage of\
    \ using layout panes is to avoid the tediousness of manually specifying size and\
    \ location of each node. As these nodes in a scene graph are managed in a tree\
    \ structure, the layout algorithm recursively computes size and location of each\
    \ node based on its layout type and specified layout properties, and the re-calculation\
    \ is set off dynamically as the window's resize event happens.\n\nThere are 8\
    \ types of built-in layout panes, located in `javafx.scene.layout` package:\n\n\
    *   `BorderPane`: A `BorderPane` places nodes in five locations respectively to\
    \ create a classic look-and-feel of main windows, typically the top region for\
    \ a menu bar or a toolbar, the bottom region for a status bar, left and right\
    \ regions for navigation panels, and the center region for a working area.\n*\
    \   `HBox`: An `HBox` places nodes in one row (horizontally).\n*   `VBox`: A `VBox`\
    \ places nodes in one column (vertically).\n*   `GridPane`: A `GridPane` places\
    \ nodes in a grid with multiple rows and columns. This is a handy user interface\
    \ for displaying a series of name-value pair properties.\n*   `StackPane`: A `StackPane`\
    \ places all nodes in a stack with center as default alignment. All children overlap\
    \ each other in the center of the container, with the later created node placed\
    \ on the top of previous ones. But you can use static methods, `StackPane.setAlignment(Node\
    \ child, Pos value)` and `StackPane.setMargin(Node child, Insets value)`, to adjust\
    \ the mandatory position of each node.\n*   `FlowPane`: You can specify the orientation\
    \ property of a `FlowPane`. For a horizontal `FlowPane`, nodes are placed in rows,\
    \ from left to right, wrapping at the boundary of its container's width. For a\
    \ vertical `FlowPane`, nodes are placed in columns, from top to bottom, wrapping\
    \ at the boundary of its container's height.\n*   `TilePane`: A `TilePane` is\
    \ similar to a `FlowPane` except each cell in the grid of `TilePane` has the same\
    \ size.\n*   `AnchorPane`: An `AnchorPane` places nodes relative to their specified\
    \ anchor points, there are four of them: `topAnchor`, `rightAnchor`, `bottomAnchor`\
    \ and `leftAnchor`.\n\n#### Reference to Oracle Online Documentation \"Working\
    \ with Layouts in JavaFX\":\n\n[http://docs.oracle.com/javase/8/javafx/layout-tutorial/index.html](http://docs.oracle.com/javase/8/javafx/layout-tutorial/index.html)\n\
    \n### Customization using CSS\n\nJavaFX allows the usage of CSS (Cascading Style\
    \ Sheet) to describe the presentation styles of application' user interfaces.\
    \ Defining the presentation attributes--such as color, font, margins, padding,\
    \ width, height, lines, background images, etc., using CSS, separated from application\
    \ codes, reveals significant conveniency in many ways:\n\n*   Customization from\
    \ software provider's side: Applications compiled from the same set of codes can\
    \ bear a variety of presentation styles, each of them complying with different\
    \ customer' requirements.\n*   Customization from application user's side: Even\
    \ after the software has been released, in case application users have preferences\
    \ for the look of UIs, it is also applicable to modify the presentation attributes,\
    \ defined in CSS files, at customer site.\n*   Benefits for designers of presentation\
    \ styles: The separation of application codes from definitions of presentation\
    \ styles improves readability of codes and simplifies the tasks for graphics designers\
    \ by focusing on dealing with CSS only.\n*   Benefits for software developers:\n"
