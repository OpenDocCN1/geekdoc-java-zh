    import javafx.beans.value.ChangeListener;\nimport javafx.beans.value.ObservableValue;\n\
    import javafx.scene.Scene;\nimport javafx.scene.layout.BorderPane;\nimport javafx.scene.layout.StackPane;\n\
    import javafx.stage.Stage;\n\n/**\n * File Name: ImageViewer.java\n * (in directory:\
    \ ImageViewer1.0/src/example1/imageviewer/)\n * 此应用程序创建了一个 BorderPane 作为场景的根节点，\n\
    \ * 并且在 BorderPane 的中心添加了一个 StackPane。\n * 场景的初始大小设置为 600 x 400。\n * StackPane\
    \ 的大小将自动设置，以适应场景的大小。\n * 当用户调整窗口大时，StackPane 会随之调整大小。\n *\n * @author Shufen Kuo\n\
    \ */\n\npublic class ImageViewer extends Application {\n\n  @Override\n  public\
    \ void start(Stage stage) {\n    BorderPane rootPane = new BorderPane();\n   \
    \ StackPane imageArea = new StackPane();\n    rootPane.setCenter(imageArea);\n\
    \n    Scene scene = new Scene(rootPane, 600, 400);\n\n    imageArea.widthProperty().addListener(new\
    \ ChangeListener<Object>() {\n      public void changed(ObservableValue o, Object\
    \ oldVal,\n        Object newVal) {\n        System.out.format(\"imageArea width\
    \ changed from %.1f to %.1f%n\",\n          oldVal, newVal);\n      }\n    });\n\
    \    imageArea.heightProperty().addListener(new ChangeListener<Object>() {\n \
    \     public void changed(ObservableValue o, Object oldVal,\n        Object newVal)\
    \ {\n        System.out.format(\"imageArea height changed from %.1f to %.1f%n\"\
    ,\n          oldVal, newVal);\n     }\n    });\n\n    stage.setTitle(\"ImageViewer\
    \ V1.0\");\n    stage.setScene(scene);\n    stage.show();\n  }\n\n  public static\
    \ void main(String[] args) {\n    launch(args);\n  }\n}\n```\n\n图 1-1. `ImageViewer\
    \ V1.0` 初始外观截图。\n\n![](img/image00124.gif \"first.gif\")\n\n编译并运行该应用程序。\n\n在命令行中编译和运行\
    \ ImageViewer 的输出：\n\n```\n Microsoft Windows [Version 6.3.9600]\n(c) 2013 Microsoft\
    \ Corporation. All rights reserved.\n\nF:\\My Documents\\DocRoot\\SHUFEN_JAVA\\\
    MyBookJFX\\VolumeOne\\ImageViewer1.0\\src\\example1>\njavac -encoding utf-8 -Xlint:unchecked\
    \ imageviewer\\*.java\n\njar cf imageviewer.jar imageviewer\n\njava -cp imageviewer.jar\
    \ imageviewer.ImageViewer\nimageArea width changed from 0.0 to 600.0\nimageArea\
    \ height changed from 0.0 to 400.0\n```\n\n现在，通过拖动应用程序窗口的边缘或角落更改场景的大小，你将看到类似的输出：\n\
    \n```\n imageArea width changed from 600.0 to 437.0\nimageArea height changed\
    \ from 400.0 to 263.0\nimageArea width changed from 437.0 to 636.0\nimageArea\
    \ height changed from 263.0 to 384.0\nimageArea width changed from 636.0 to 587.0\n\
    imageArea height changed from 384.0 to 448.0\n```\n\n## 1.2 创建菜单栏\n\n在本节中，我们正在创建一个\
    \ `MenuBar`，并将其添加到 `BorderPane` 的顶部，`BorderPane` 是场景图的根节点。\n\n通常，一个 `MenuBar`\
    \ 对象包含多个水平排列的 `Menu`，而每个 `Menu` 又包含多个 `MenuItem`。由于 `Menu` 类继承自 `MenuItem` 类，你可以在一个\
    \ `Menu` 内部放置另一个 `Menu`，这种嵌套的称为子菜单。由于 `MenuBar` 渲染在窗口上，用户看到的只是菜单名称，只有当鼠标左键点击菜单名称，或者按下定义为菜单快捷键的内存助记键组合时，每个菜单的内容才会显示。\n\
    \n采用菜单用户界面的优点包括以下点：\n\n*   **占用空间更少**\n    当用户不需要菜单时，它仅占用其名称所需的空间。\n*   **可组织性**\n\
    \    为了方便访问，你可以根据功能将菜单项组织成树形结构，将相似的菜单项分组在同一个菜单中，通过子菜单避免单个菜单过于拥挤，并将请求频繁的菜单项放置在较高层。通常最重要的项被放在树的顶层。\n\
    *   **单按键调用动作**\n    你可以使用助记键机制导航 `MenuBar` 内的菜单，并定义快捷键使使用户可以通过一个按键调用 `MenuItem`\
    \ 的动作。例如，同时按下 Alt 和 F 键显示文件菜单，同时按下 Ctrl 和 S 键执行保存文件操作。\n\n要向 `MenuBar` 添加一个 `Menu`，我们首先调用\
    \ `getMenus()` 方法，该方法返回一个包含 `Menu` 的 `ObservableList`。`ObservableList` 是 `java.util.List`\
    \ 的子接口，因此我们可以使用 `add` 方法（Java `Collection` 接口中定义的内置工具方法之一）将菜单附加到列表中。代码如下：\n\n\
    ```java\nMenuBar menuBar = new MenuBar();\nMenu menuFile = new Menu(\"File\");\n\
    menuBar.getMenus().add(menuFile);\n```\n（注：此处原文中存在大量重复的说明和代码，已根据要求进行处理，保留核心逻辑与翻译）\n\
    \n### 1.2.1 将文件添加到菜单\n\n在此应用程序中，`MenuBar` 包含 `File` 菜单。以下代码显示了如何完成这些任务。导入语句：\n\
    \n```java\nimport javafx.application.Platform;\nimport javafx.scene.control.Menu;\n\
    import javafx.scene.control.MenuBar;\nimport javafx.scene.control.MenuItem;\n\
    import javafx.event.ActionEvent;\nimport javafx.event.EventHandler;\n```\n\n列表\
    \ 1-6. 为 `ImageViewer` 应用程序添加菜单栏，将其放置在 `BorderPane` 的顶部：\n\n```java\n // 添加菜单栏\n\
    MenuBar menuBar = new MenuBar();\nMenu menuFile = new Menu(\"File\");\nMenuItem\
    \ load = new MenuItem(\"Load\");\nMenuItem exit = new MenuItem(\"Exit\");\nmenuFile.getItems().addAll(load,\
    \ exit);\nmenuBar.getMenus().add(menuFile);\nrootPane.setTop(menuBar);\n\n// 为退出菜单项添加动作\n\
    exit.setOnAction(new EventHandler<ActionEvent>() {\n  @Override\n  public void\
    \ handle(ActionEvent e) {\n    Platform.exit();\n  }\n});\n```\n\n### 1.2.2 从打开对话框选择图像文件并在\
    \ StackPane 中显示\n\n为了导航文件系统，我们使用 `FileChooser` 类，它提供了一个方便的方法 `showOpenDialog(Window\
    \ owner)` 用于选择打开的文件。\n\n`Load` 菜单的动作是浏览本地文件系统、选择图像文件并显示在图像区域。\n\n`setOnAction(EventHandler<ActionEvent>\
    \ value)` 方法由 `MenuItem` 类提供，用于添加事件处理器来处理 `Load` 菜单的 `ActionEvent`。\n\n为了加载并显示图像，我们结合使用\
    \ `ImageView` 类和 `Image` 类。`Image` 类根据字符串类型的 URL 加载图像，而 `ImageView` 类在图像区域显示图像。\n\
    \n首先，我们创建一个 `ImageView` 并作为 `StackPane` 的子节点。随后，当获取图像文件时，我们将创建一个 `Image` 对象来加载文件，并调用\
    \ `ImageView` 类提供的 `setImage(Image value)` 方法查看图像。\n\n详细说明如下：当执行 `FileChooser`\
    \ 的 `showOpenDialog` 方法时，会弹出文件打开对话框。当用户选择文件并点击对话框中的“打开”按钮时，`showOpenDialog` 方法会将所选的文件（类型为\
    \ `File`）返回给调用者，调用者将其转换为字符串表示的 URL，并根据该 URL 创建 `Image` 对象；此时，图像已加载到内存中，但尚未显示在屏幕上。\n\
    \n"
