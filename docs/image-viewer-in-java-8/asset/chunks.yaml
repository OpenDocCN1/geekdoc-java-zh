    \ 状态，不久后进入 `RUNNING` 状态，并一直保持 `RUNNING` 状态，直到发生以下情况之一：\n\n任务成功完成：\n`Worker` 转换到\
    \ `SUCCEEDED` 状态。\n\n抛出异常：\n`Worker` 转换到 `FAILED` 状态。\n\n任务被取消：\n`Worker` 转换到\
