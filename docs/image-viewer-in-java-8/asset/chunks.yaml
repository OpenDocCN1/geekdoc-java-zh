  trans: "\n\n```java\npackage imageviewer;\n\nimport javafx.application.Application;\n\
    import javafx.scene.Scene;\nimport javafx.scene.layout.BorderPane;\nimport javafx.scene.layout.StackPane;\n\
    import javafx.stage.Stage;\n\n/**\n * File Name: ImageViewer.java\n *\n * @author\
    \ Shufen Kuo\n */\n\npublic class ImageViewer extends Application {\n\n  @Override\n\
    \  public void start(Stage stage) {\n    BorderPane rootPane = new BorderPane();\n\
    \    StackPane imageArea = new StackPane();\n    rootPane.getChildren().add(imageArea);\n\
    \n    Scene scene = new Scene(rootPane, 600, 400); \n    stage.setTitle(\"ImageViewer\
    \ V1.0\");\n    stage.setScene(scene);\n    stage.show();\n  }\n\n  public static\
    \ void main(String[] args) {\n    launch(args);\n  }\n}\n```\n\n### Scene 和 Stage\n\
    \n在 `start` 方法中出现了两个重要的类 `Scene` 和 `Stage`。通常情况下，主要任务是创建在名为场景图（scene graph）的分层次树结构中管理的图形用户界面（GUI），将场景图的根节点关联到\
    \ `Scene` 对象，然后将场景放置在 `Stage` 对象上。`Stage` 代表 JavaFX 应用程序顶层容器，作为场景图的窗口与用户进行交互。\n\
    \n接下来的快照让你对 JavaFX 应用程序的 GUI 外观有一个初步了解：图 1. JavaFX 应用程序快照。（Images/image00123.jpeg\
    \ javafx_app_guis）\n\n### 节点\n\nJavaFX 引入了一个基础类 `javafx.scene.Node`，它继承自 `java.lang.Object`\
    \ 并提供了对所有用户界面都有用的常用属性和方法。我们经常使用节点（nodes）一词来引用 GUI。\n\n场景图可能包含各种节点。节点可以是父节点（带有子节点的节点）或叶子节点（没有子节点的节点）；每个节点只能有一个父节点，而根节点没有。场景图中的所有节点都派自\
    \ `javafx.scene.Node`。为了快速识别场景图中基本的节点类型，我们根据是否具有添加子节点的能力来区分它们。\n\n*   你可能向这些节点添加子节点：\n\
    \    以下类被频繁用作父节点：`Group`、`Pane` 以及内置的布局面板（它们是 `Pane` 的直接子类）。通常你调用 `getChildren()`\
    \ 方法来获取类型为 `ObservableList<Node>` 的列表（它是 `java.util.List` 的子接口），然后使用开发者熟悉的 `Collection`\
    \ 中定义的各种实用程序来操作列表的内容。\n\n*   你可能无法向这些节点添加子节点：\n    以下类始终被用作叶子节点：`Canvas`、`ImageView`、`MediaView`\
    \ 以及 `Shape` 的所有直接子类，例如 `Rectangle`、`Ellipse` 等。\n\n### JavaFX 和 Swing\n\n现在，有一个有趣的问题。多年来开发者一直使用\
    \ Swing API 构建 Java 应用程序的 GUI，这些是 Java Foundation Classes（JFC）的 GUI 组件。为什么除了 Swing\
    \ 之外我们还需要 JavaFX？\n\n如果你拥有大量用 Swing 编写遗留代码，并希望将 JavaFX 特性整合到 Swing 代码中，JDK 8 提供了机制；反之，你可以在\
    \ JavaFX 应用程序中包含 Swing 组件。\n\nJavaFX-Swing 互操作性主题在本书中未介绍。如果你对这个主题感兴趣，请在此访问 Oracle\
    \ 在线文档“JavaFX: Interoperability -- Java-Swing Interoperability”：[`docs.oracle.com/javase/8/javafx/interoperability-tutorial/fx_swing.htm`](http://docs.oracle.com/javase/8/javafx/interoperability-tutorial/fx_swing.htm)\n\
    \nJavaFX 是下一代 Java GUI。为了说明使用 JavaFX 能力的优势，除了 JavaFX 和 Swing 之间的互操作性外，我们在下面的章节介绍了\
    \ JavaFX 的重要特性。\n\n### JavaFX 的精髓\n\nJavaFX 不仅允许你快速创建具有视觉用户界面的应用程序，还包含了诱人且独特的能力。它们列举如下：\n\
    \n#### 内置布局面板\n\nJavaFX 的布局面板（layout panes）是容器，能够自动对节点执行各种类型的摆放操作。你可以在布局面板中放置任意数量的节点，布局面板本身也是一个节点，因此也可以嵌套在另一个布局面板中。使用布局面板的主要优势是避免手动指定每个节点的大小和位置的繁琐。由于场景图中的这些节点是以树结构管理的，布局算法会根据其布局类型和指定的布局属性递归地计算每个节点的大小和位置，并且当窗口大小调整事件发生时，会触发动态重新计算。\n\
    \n有 8 种内置布局面板，位于 `javafx.scene.layout` 包中：\n\n*   `BorderPane`：`BorderPane` 将节点分别放置在五个位置，以创建经典窗口的外观，通常顶部区域用于菜单栏或工具栏，底部区域用于状态栏，左右侧区域用于导航面板，中心区域用于工作区域。\n\
    *   `HBox`：`HBox` 将节点放置在一行（水平方向）。\n*   `VBox`：`VBox` 将节点放置在一列（垂直方向）。\n*   `GridPane`：`GridPane`\
    \ 将节点放置在具有多行多列的网格中。这是一个显示一系列键值对属性的实用用用户界面。\n*   `StackPane`：`StackPane` 将所有节点堆叠在一起，默认以居中对齐。所有子节点在容器中心相互重叠，后创建的节点位于先上方。但你可以使用静态方法\
    \ `StackPane.setAlignment(Node child, Pos value)` 和 `StackPane.setMargin(Node\
    \ child, Insets value)` 来调整节点的强制位置。\n*   `FlowPane`：`你可以可以指定 `FlowPane` 的方向属性。对于水平\
    \ `FlowPane`，节点从左到右排列，在容器宽度边界处换行。对于垂直 `FlowPane`，节点从上到下排列，在容器高度边界处换列。\n*   `TilePane`：`TilePane`\
    \ 与 `FlowPane` 类似，不同之处 `TilePane` 网格中的每个单元具有相同的大小。\n*   `AnchorPane`：`AnchorPane`\
    \ 相对于指定的锚点放置节点，共有四个点：`topAnchor`、`rightAnchor`、`bottomAnchor` 和 `leftAnchor`。\n\
    \n#### 参考 Oracle 在线文档“Working with Layouts in JavaFX”：\n\n[`docs.oracle.com/javase/8/javafx/layout-tutorial/index.html`](http://docs.oracle.com/javase/8/javafx/layout-tutorial/index.html)\n\
    \n### 使用 CSS 进行自定义\n\nJavaFX 允许使用 CSS（层叠样式表）来描述应用程序用户界面的样式。通过 CSS 定义如颜色、字体、外边距、内边距、宽度、高度、线条、背景图像等演示属性，并与应用程序代码分离，在许多方面显示了巨大的便利性：\n\
    \n*   从软件提供者的角度自定义：从同一组代码编译的应用程序可以呈现各种样式，每种样式符合不同的客户需求。\n*   从应用程序用户的角度自定义：即使在软件发布后，如果应用程序用户对\
    \ UI 的外观有偏好，也可以在客户现场修改 CSS 文件定义的演示属性。\n*   对样式设计者的利益：应用程序代码与样式定义的分离提高了代码的可读性，并通让图形设计师专注于处理\
    \ CSS，从而简化了任务。\n*   对软件开发者的利益：\n\n"
- fmt: "\nDuring the course of testing, developers may frequently change style attributes\
    \ defined in CSS file in order to evaluate the variety looks of GUIs. If the application\
    \ has to quit and restart again for each change, it is a very tiresome task. To\
    \ facilitate this evaluation process, the best strategy is to design a makeshift\
    \ `Load` button, and whenever any style attribute is changed, simply click on\
    \ the button to re-load the CSS, there is no need to quit the application and\
    \ restart it, thus saving tremendous time spending on testing.\n\n## Similarity\
    \ between CSS in JavaFX and CSS in HTML\n\nThe syntax of CSS in JavaFX is same\
    \ as that of CSS in HTML, thus any designer has experience on CSS for browsers\
    \ can do the styling for JavaFX application's UIs with little learning effort.\n\
    \n### Reference to Oracle Online Documentation \"Skinning JavaFX Applications\
    \ with CSS\":\n\n[http://docs.oracle.com/javase/8/javafx/user-interface-tutorial/css_tutorial.htm](http://docs.oracle.com/javase/8/javafx/user-interface-tutorial/css_tutorial.htm)\n\
    \n## Creating User Interfaces using FXML\n\nFXML is a markup language which complies\
    \ with the XML (Extensible Markup Language) format, with additional rules, for\
    \ creating user interfaces of JavaFX applications. Considering hand coding FXML\
    \ is error prone, a feasible approach is to generate FXML codes by means of GUI\
    \ builders.\n\nIn this book series, we present a useful application `JFXDrawTools`,\
    \ it's sort of a GUI builder specifically for creating instances of subclasses\
    \ derived from `Shape`. Users can interactively create a sketch, either a `Shape`\
    \ or an `ImageView`, manipulate its properties and save the editing results to\
    \ files in FXML format, the files can later be loaded back to continue the editing\
    \ process, or be loaded by other JavaFX applications dynamically.\n\nIt is considered\
    \ a good programming practice to separate application's GUIs (the View) from its\
    \ business logic (the Model). The FXML file represents the view, while controller\
    \ is a java class which passes information between view and model. Constructing\
    \ GUIs using FXML enables application developers to adopt the MVC (Model-View-Controller)\
    \ architecture effectively.\n\n### Reference to Oracle Online Documentation \"\
    JavaFX: Mastering FXML\":\n\n[http://docs.oracle.com/javase/8/javafx/fxml-tutorial/index.html](http://docs.oracle.com/javase/8/javafx/fxml-tutorial/index.html)\n\
    \n## Appealing Capacities of Properties and Binding\n\nThe concept of Properties\
    \ featured in JavaFX follows the design conventions introduced in the JavaBeans\
    \ component, it usually works in connection with Binding mechanism, as a whole\
    \ providing powerful yet sleek and succinct solutions to a variety of programming\
    \ needs.\n\nIn the `JFXDrawTools` application presented in this book series, we\
    \ demonstrate the usage of Properties and Binding considerably. In the implementation\
    \ of Properties Window, suitable UI controls, such as text field, choice box,\
    \ combo box, etc., are used for viewing the properties of a concerned object.\
    \ Binding mechanism is employed to bi-directionally link the UI controls to their\
    \ respective properties of the object, the relationship is set up as the Properties\
    \ Window is about to show. When users changed data displayed in UI controls, the\
    \ changes instantly reflect to the corresponding properties of the related object.\n\
    \n### Reference to Oracle Online Documentation \"JavaFX: Properties and Binding\
    \ Tutorial\":\n\n[http://docs.oracle.com/javase/8/javafx/properties-binding-tutorial/index.html](http://docs.oracle.com/javase/8/javafx/properties-binding-tutorial/index.html)\n\
    \n## Sophisticated Mechanism of Transformations and Transitions\n\nThe JavaFX\
    \ build-in capacity of transformations for nodes are so convenient for developing\
    \ graphics packages such as graphics editors, drawing tools, image viewing applications,\
    \ GUI builders, etc.\n\nHere are the classes that have dealings with transformations:\
    \ `Translate`, `Rotate`, `Scale` and `Shear`. They are all derived from `Transform`\
    \ class and located in `javafx.scene.transform` package.\n\nThe JavaFX transitions\
    \ provide concise approaches for creating animations. There are a host of applications\
    \ in need of animation features, here are some cases: to draw attention in an\
    \ alert situation, to throw objects into recycle bin during the removing operation,\
    \ to indicate intermediate state during a data loading,...\n\nIn the `ImageViewer`\
    \ application presented in this book series, we apply `FadeTransition` and `ParallelTransition`\
    \ onto image objects in a slideshow function to fade in the new image and fade\
    \ out the old image simultaneously.\n\nHere are the classes that have dealings\
    \ with transitions: `FadeTransition`, `RotateTransition`, `ScaleTransition`, `TranslateTransition`,\
    \ `FillTransition`, `StrokeTransition`, `PathTransition`, `ParallelTransition`,\
    \ `SequentialTransition`, `PauseTransition`. They are all derived from `Transition`\
    \ class, an abstract class defines basic functionality of animations, and located\
    \ in `javafx.animation` package.\n\n### Reference to Oracle Online Documentation\
    \ \"JavaFX: Transformations, Animations, and Visual Effects\":\n\n[http://docs.oracle.com/javase/8/javafx/visual-effects-tutorial/index.html](http://docs.oracle.com/javase/8/javafx/visual-effects-tutorial/index.html)\n\
    \n## 2D Geometric Primitives and Text Are JavaFX Nodes\n\nJavaFX provides a `Shape`\
    \ class which extends `javafx.scene.Node` class and is the superclass of basic\
    \ forms of 2D geometry. The object-oriented concept imposed on the geometric primitives\
    \ facilitates the development of graphics applications.\n\nHere are classes derived\
    \ from `Shape` class: `Arc`, `Circle`, `CubicCurve`, `Ellipse`, `Line`, `Path`,\
    \ `Polygon`, `Polyline`, `QuadCurve`, `Rectangle`, `SVGPath`, `Text`. Except the\
    \ `Text` class, all the others are located in `javafx.scene.shape` package.\n\n\
    Please note that `Text` class, located in `javafx.scene.text` package, considered\
    \ a shape as well, powers the development of text drawing tools. All features\
    \ common to JavaFX nodes can be applied to text objects. You handle it just like\
    \ any geometric form. Text objects can be placed in a layout pane to utilize the\
    \ automatic placement abilities, applying transformations and transitions, as\
    \ well as customizing the presentation style using CSS, etc.\n\n### Reference\
    \ to Oracle Online Documentation \"Using Text in JavaFX\":\n\n[http://docs.oracle.com/javase/8/javafx/user-interface-tutorial/text-settings.htm](http://docs.oracle.com/javase/8/javafx/user-interface-tutorial/text-settings.htm)\n\
    \n## Other Prominent Capabilities That Carry Out Many Complex Issues to Shorten\
    \ Development Time\n\n* `ImageView` Class for Loading and Displaying Images\n\n\
    \  The `ImageView` class which extends `javafx.scene.Node` is used along with\
    \ `Image` class to load and display images. JavaFX also provides APIs for performing\
    \ operations over bitmap images, `PixelReader` is the interface defines methods\
    \ to read pixels from an `Image` object, while `PixelWriter` defines methods to\
    \ write pixels to an `Image` object. All of these are located in `javafx.scene.image`\
    \ package.\n\n  ### Reference to Oracle Online Documentation \"Using the Image\
    \ Ops API\":\n\n  [http://docs.oracle.com/javase/8/javafx/graphics-tutorial/image_ops.htm](http://docs.oracle.com/javase/8/javafx/graphics-tutorial/image_ops.htm)\n\
    \n* `WebView` Class for Managing Web Pages\n"
  raw: "    During the course of testing, developers may frequently change style attributes\
    \ defined in CSS file in order to evaluate the variety looks of GUIs. If the application\
    \ has to quit and restart again for each change, it is a very tiresome task. To\
    \ facilitate this evaluation process, the best strategy is to design a makeshift\
    \ `Load` button, and whenever any style attribute is changed, simply click on\
    \ the button to re-load the CSS, there is no need to quit the application and\
    \ restart it, thus saving tremendous time spending on testing.\n\n*   Similarity\
    \ between CSS in JavaFX and CSS in HTML:\n\n    The syntax of CSS in JavaFX is\
    \ same as that of CSS in HTML, thus any designer has experience on CSS for browsers\
    \ can do the styling for JavaFX application's UIs with little learning effort.\n\
    \n#### Reference to Oracle Online Documentation \"Skinning JavaFX Applications\
    \ with CSS\":\n\n[http://docs.oracle.com/javase/8/javafx/user-interface-tutorial/css_tutorial.htm](http://docs.oracle.com/javase/8/javafx/user-interface-tutorial/css_tutorial.htm)\n\
    \n### Creating User Interfaces using FXML\n\nFXML is a markup language which complies\
    \ with the XML (Extensible Markup Language) format, with additional rules, for\
    \ creating user interfaces of JavaFX applications. Considering hand coding FXML\
    \ is error prone, a feasible approach is to generate FXML codes by means of GUI\
    \ builders.\n\nIn this book series, we present a useful application `JFXDrawTools`,\
    \ it's sort of a GUI builder specifically for creating instances of subclasses\
    \ derived from `Shape`. Users can interactively create a sketch, either a `Shape`\
    \ or an `ImageView`, manipulate its properties and save the editing results to\
    \ files in FXML format, the files can later be loaded back to continue the editing\
    \ process, or be loaded by other JavaFX applications dynamically.\n\nIt is considered\
    \ a good programming practice to separate application's GUIs (the View) from its\
    \ business logic (the Model). The FXML file represents the view, while controller\
    \ is a java class which passes information between view and model. Constructing\
    \ GUIs using FXML enables application developers to adopt the MVC (Model-View-Controller)\
    \ architecture effectively.\n\n#### Reference to Oracle Online Documentation \"\
    JavaFX: Mastering FXML\":\n\n[http://docs.oracle.com/javase/8/javafx/fxml-tutorial/index.html](http://docs.oracle.com/javase/8/javafx/fxml-tutorial/index.html)\n\
    \n### Appealing Capacities of Properties and Binding\n\nThe concept of Properties\
    \ featured in JavaFX follows the design conventions introduced in the JavaBeans\
    \ component, it usually works in connection with Binding mechanism, as a whole\
    \ providing powerful yet sleek and succinct solutions to a variety of programming\
    \ needs.\n\nIn the `JFXDrawTools` application presented in this book series, we\
    \ demonstrate the usage of Properties and Binding considerably. In the implementation\
    \ of Properties Window, suitable UI controls, such as text field, choice box,\
    \ combo box, etc., are used for viewing the properties of a concerned object.\
    \ Binding mechanism is employed to bi-directionally link the UI controls to their\
    \ respective properties of the object, the relationship is set up as the Properties\
    \ Window is about to show. When users changed data displayed in UI controls, the\
    \ changes instantly reflect to the corresponding properties of the related object.\n\
    \n#### Reference to Oracle Online Documentation \"JavaFX: Properties and Binding\
    \ Tutorial\":\n\n[http://docs.oracle.com/javase/8/javafx/properties-binding-tutorial/index.html](http://docs.oracle.com/javase/8/javafx/properties-binding-tutorial/index.html)\n\
    \n### Sophisticated Mechanism of Transformations and Transitions\n\nThe JavaFX\
    \ build-in capacity of transformations for nodes are so convenient for developing\
    \ graphics packages such as graphics editors, drawing tools, image viewing applications,\
    \ GUI builders, etc.\n\nHere are the classes that have dealings with transformations:\
    \ `Translate`, `Rotate`, `Scale` and `Shear`. They are all derived from `Transform`\
    \ class and located in `javafx.scene.transform` package.\n\nThe JavaFX transitions\
    \ provide concise approaches for creating animations. There are a host of applications\
    \ in need of animation features, here are some cases: to draw attention in an\
    \ alert situation, to throw objects into recycle bin during the removing operation,\
    \ to indicate intermediate state during a data loading,...\n\nIn the `ImageViewer`\
    \ application presented in this book series, we apply `FadeTransition` and `ParallelTransition`\
    \ onto image objects in a slideshow function to fade in the new image and fade\
    \ out the old image simultaneously.\n\nHere are the classes that have dealings\
    \ with transitions: `FadeTransition`, `RotateTransition`, `ScaleTransition`, `TranslateTransition`,\
    \ `FillTransition`, `StrokeTransition`, `PathTransition`, `ParallelTransition`,\
    \ `SequentialTransition`, `PauseTransition`. They are all derived from `Transition`\
    \ class, an abstract class defines basic functionality of animations, and located\
    \ in `javafx.animation` package.\n\n#### Reference to Oracle Online Documentation\
    \ \"JavaFX: Transformations, Animations, and Visual Effects\":\n\n[http://docs.oracle.com/javase/8/javafx/visual-effects-tutorial/index.html](http://docs.oracle.com/javase/8/javafx/visual-effects-tutorial/index.html)\n\
    \n### 2D Geometric Primitives and Text Are JavaFX Nodes\n\nJavaFX provides a `Shape`\
    \ class which extends `javafx.scene.Node` class and is the superclass of basic\
    \ forms of 2D geometry. The object-oriented concept imposed on the geometric primitives\
    \ facilitates the development of graphics applications.\n\nHere are classes derived\
    \ from `Shape` class: `Arc`, `Circle`, `CubicCurve`, `Ellipse`, `Line`, `Path`,\
    \ `Polygon`, `Polyline`, `QuadCurve`, `Rectangle`, `SVGPath`, `Text`. Except the\
    \ `Text` class, all the others are located in `javafx.scene.shape` package.\n\n\
    Please note that `Text` class, located in `javafx.scene.text` package, considered\
    \ a shape as well, powers the development of text drawing tools. All features\
    \ common to JavaFX nodes can be applied to text objects. You handle it just like\
    \ any geometric form. Text objects can be placed in a layout pane to utilize the\
    \ automatic placement abilities, applying transformations and transitions, as\
    \ well as customizing the presentation style using CSS, etc.\n\n#### Reference\
    \ to Oracle Online Documentation \"Using Text in JavaFX\":\n\n[http://docs.oracle.com/javase/8/javafx/user-interface-tutorial/text-settings.htm](http://docs.oracle.com/javase/8/javafx/user-interface-tutorial/text-settings.htm)\n\
    \n### Other Prominent Capabilities That Carry Out Many Complex Issues to Shorten\
    \ Development Time\n\n*   `ImageView` Class for Loading and Displaying Images\n\
    \n    The `ImageView` class which extends `javafx.scene.Node` is used along with\
    \ `Image` class to load and display images. JavaFX also provides APIs for performing\
    \ operations over bitmap images, `PixelReader` is the interface defines methods\
    \ to read pixels from an `Image` object, while `PixelWriter` defines methods to\
    \ write pixels to an `Image` object. All of these are located in `javafx.scene.image`\
    \ package.\n\n    #### Reference to Oracle Online Documentation \"Using the Image\
    \ Ops API\":\n\n    [http://docs.oracle.com/javase/8/javafx/graphics-tutorial/image_ops.htm](http://docs.oracle.com/javase/8/javafx/graphics-tutorial/image_ops.htm)\n\
    \n*   `WebView` Class for Managing Web Pages"
