- fmt: "\nThe graphical user interfaces of a JavaFX application are managed in hierarchical\
    \ tree structure, called a scene graph. In `ImageViewer` application, we employ\
    \ a `BorderPane` as the root node of a scene graph, and place a `StackPane` in\
    \ the center of `BorderPane` as image rendering area. Both `BorderPane` and `StackPane`\
    \ are among build-in layout panes, reside in `javafx.scene.layout` package and\
    \ are direct subclasses of `javafx.scene.layout.Pane` class.\n\n`BorderPane` class\
    \ allows you to create graphical user interfaces featuring classic look-and-feel\
    \ of main windows. In the next section you'll see a menu bar added at the top\
    \ of `BorderPane`, and in the later chapter a status bar added at the bottom.\n\
    \n`StackPane` class lays out its children in a stack, placing the later created\
    \ child at the top of previous one. In `ImageViewer` application, since only one\
    \ image is viewed at one time, the `StackPane` has only one child. If the size\
    \ of an image is smaller than the size of `StackPane`, the image is placed in\
    \ the center of `StackPane`. If the size of an image is larger than that of `StackPane`,\
    \ `StackPane` is expanded automatically to accommodate the whole image, and if\
    \ the viewing space in the application window is not larger enough, only center\
    \ portion of the image is visible by default. In later section, we'll demonstrate\
    \ how to avoid a `StackPane` being resized by its content, see [here](#part0007.xhtml_set-min-size).\n\
    \nA `Scene` object is created as the container of a scene graph, given a root\
    \ node as parameter. In `ImageViewer` application, the root node is a `BorderPane`,\
    \ and initial width and height of the `Scene` object is set to 600 pixels and\
    \ 400 pixels. Both `BorderPane` and `StackPane` are resizable layout panes; therefore,\
    \ if the application window is dynamically resized by a user, the scene is resized\
    \ and a resize event is passed on to its root node, resulting in re-calculation\
    \ of the size of image rendering area accordingly.\n\nYou place a scene on a `Stage`\
    \ to make it alive, using the `setScene` method defined in `Stage` class. `Stage`\
    \ is a direct subclass of `javafx.stage.Window`; it is the top-level window of\
    \ a JavaFX application.\n\nJavaFX system creates a `Stage` object, referred as\
    \ primary stage, and passed to the `start` method, an abstract method defined\
    \ in `Application` class. Developers can construct additional `Stage` objects\
    \ as needed for their applications.\n\nThe following codes demonstrate how to\
    \ create `ImageViewer` class as a direct subclass of `Application`, and override\
    \ the `start` method. Here are codes:\n\nListing 1-1. Create `ImageViewer` class\
    \ which extends `Application` class, override `start` method, create `BorderPane`\
    \ as the root node of a scene, and place `StackPane` in the center of `BorderPane`\
    \ as image rendering area:\n\n```\n package imageviewer;\n\nimport javafx.application.Application;\n\
    import javafx.scene.Scene;\nimport javafx.scene.layout.BorderPane;\nimport javafx.scene.layout.StackPane;\n\
    import javafx.stage.Stage;\n\n/**\n * File Name: ImageViewer.java\n *\n * This\
    \ application creates a BorderPane as root node of a scene, and\n * add a StackPane\
    \ in the center of BorderPane\n * The initial size of the scene is set to 600\
    \ by 400\n * The size of StackPane will be automatically set to fit the size of\
    \ scene.\n * StackPane will be resized when window size is adjusted by a user\n\
    \ */\n\npublic class ImageViewer extends Application {\n\n  @Override\n  public\
    \ void start(Stage stage) {\n    BorderPane rootPane = new BorderPane();\n   \
    \ StackPane imageArea = new StackPane();\n    rootPane.setCenter(imageArea);\n\
    \n    Scene scene = new Scene(rootPane, 600, 400); \n    stage.setTitle(\"ImageViewer\
    \ V1.0\");\n    stage.setScene(scene);\n    stage.show();\n  }\n\n  public static\
    \ void main(String[] args) {\n    launch(args);\n  }\n}\n```\n\n### 1.1.1 JavaFX\
    \ Application Thread vs. Java Launcher Thread\n\n`Application` class is the entry\
    \ point of a JavaFX application. It defines the following significant methods:\n\
    \n`public void init() throws Exception`\n\n`public abstract void start(Stage primaryStage)\
    \ throws Exception`\n\n`public void stop() throws Exception`\n\nThe `init` method,\
    \ which does nothing, is called from Java launcher thread. While the `start` method,\
    \ an abstract and must be overridden, is called from JavaFX Application Thread\
    \ after `init` method has returned. If you need do some initial works before `start`\
    \ method, you can do that by overriding `init` method; however it is crucial to\
    \ notice that nodes that are members of a live scene must be accessed from JavaFX\
    \ Application Thread. And the construction of a `Scene` object or a `Stage` object\
    \ must be accessed from JavaFX Application Thread as well.\n\n### 1.1.2 Catch\
    \ Resize Event of Image Rendering Area\n\nFor debugging and testing purpose at\
    \ this point, we register a `ChangeListener` providing a `changed` method to be\
    \ notified whenever width or height of image rendering area is changed. Width\
    \ or height of image rendering area is changed when a user resizes the application\
    \ window.\n\nTo register a `ChangeListener` to observe change of value for a property,\
    \ we use this method:\n\n```\n void addListener(ChangeListener<? super T> listener)\
    \ \n```\n\ndefined in `javafx.beans.value.ObservableValue` interface, providing\
    \ implementation of `changed(ObservableValue<? extends T> observable, T oldValue,\
    \ T newValue)` method, to be invoked when this property's value is changed.\n\n\
    The same `ChangeListener` is allowed to be registered to multiple `ObservableValue`s.\
    \ To avoid memory leak problem, it is a good programming practice to un-register\
    \ a listener whenever the value longer need be observed, using `removeListener(ChangeListener<?\
    \ super T> listener)` method, which removes the link between an observable value\
    \ and a listener.\n\n`StackPane` class inherits `width` and `height` properties\
    \ from `javafx.scene.layout.Region` class. Both properties are type of `ReadOnlyDoubleProperty`,\
    \ an abstract class that implements `ObservableValue` interface. As the name reveals,\
    \ an `ObservableValue` holds a value that are observable, you can listen to the\
    \ change of value and take actions as necessary.\n\nThe following codes demonstrate\
    \ how to watch the resize event of image rendering area, a `StackPane` placed\
    \ in the center of a `BorderPane`.\n\nImport Statements:\n\n```\n import javafx.beans.value.ChangeListener;\n\
    import javafx.beans.value.ObservableValue;\n```\n\nListing 1-2. Add listeners\
    \ to width property and height property of image rendering area:\n\n```\n imageArea.widthProperty().addListener(new\
    \ ChangeListener<Object>() {\n  public void changed(ObservableValue o, Object\
    \ oldVal, Object newVal) {\n    System.out.format(\"imageArea width changed from\
    \ %.1f to %.1f%n\",\n      oldVal, newVal);\n  }\n});\nimageArea.heightProperty().addListener(new\
    \ ChangeListener<Object>() {\n  public void changed(ObservableValue o, Object\
    \ oldVal, Object newVal) {\n    System.out.format(\"imageArea height changed from\
    \ %.1f to %.1f%n\",\n      oldVal, newVal);\n  }\n});\n```\n\nListing 1-3. Complete\
    \ source codes of `ImageViewer` class become like this:\n"
