  trans: "\n\n- `BooleanExpression` 类位于 `javafx.beans.binding` 包中，是一个实现 `ObservableBooleanValue`\
    \ 的抽象类，`ObservableBooleanValue` 是扩展 `ObservableValue<java.lang.Boolean>` 的接口。`BooleanExpression`\
    \ 类提供了执行 AND、OR 和 NOT 等逻辑操作的便利方法。\n（参见此处）\n\n- `BooleanExpression` 类中的一些便利方法：\n\
    \n  `BooleanBinding not()`\n  对此 `BooleanExpression` 执行逻辑 NOT 操作，并返回一个 `BooleanBinding`\
    \ 类型的对象，该对象是 `BooleanExpression` 的直接子类。\n\n  `BooleanBinding or(ObservableBooleanValue\
    \ other)`\n  对此 `BooleanExpression` 和给定的 `ObservableBooleanValue` 执行逻辑 OR 操作，并返回一个\
    \ `BooleanBinding` 类型的对象，该对象是 `BooleanExpression` 的直接子类。\n  （参见此处）\n\n- `Worker<V>`\
    \ 是位于 `javafx.concurrent` 包中的接口，它为并发实现定义了通用 API。\n（参见章节在线程上执行幻灯片）\n\n- 位于 `javafx.concurrent`\
    \ 包中的并发类：\n\n  `Task`\n  实现 `Worker<V>` 接口的抽象类，是一个一次性的 `Worker` 对象。\n\n  `Service`\n\
    \  实现 `Worker<V>` 接口的抽象类，是一个可重用的 `Worker` 对象。\n\n  `ScheduledService`\n  `Service`\
    \ 类的直接子类，允许指定启动和自动重启服务的延迟时长。\n\n  `WorkerStateEvent`\n  `javafx.event.Event` 的子类，定义了事件类型的静态字段，如\
    \ `WORKER_STATE_CANCELLED`、`WORKER_STATE_FAILED`、`WORKER_STATE_READY`、`WORKER_STATE_RUNNING`、`WORKER_STATE_SUCCEEDED`\
    \ 等。当 `Worker` 的状态发生转换时，会触发 `WorkerStateEvent`。\n  （参见章节在线程上执行幻灯片）\n\n- `protected\
    \ abstract V call()` 方法定义在 `Task` 类中，必须重写，并在任务执行时被调用。（参见此处 | 此处 | 此处）\n\n- `protected\
    \ abstract Task<V> createTask()` 方法定义在 `Service` 类中，必须重写，并在服务启动时被调用。（参见此处 | 此处\
    \ | 此处）\n\n- `Service` 类提供的某些用于注册 `EventHandler` 以处理 Worker 状态事件的便利方法：\n\n  `public\
    \ final void setOnRunning(EventHandler<WorkerStateEvent> value)`\n  `public final\
    \ void setOnSucceeded(EventHandler<WorkerStateEvent> value)`\n  `public final\
    \ void setOnFailed(EventHandler<WorkerStateEvent> value)`\n  `public final void\
    \ setOnCancelled(EventHandler<WorkerStateEvent> value)`\n  （参见章节配置幻灯片服务对象）\n\n\
    - `Worker.State` 是 `javafx.concurrent.Worker` 接口的嵌套类，是一个定义 `Worker` 状态常量的枚举类型，它们是：`CANCELLED`、`FAILED`、`READY`、`RUNNING`、`SCHEDULED`\
    \ 和 `SUCCEEDED`。\n  （参见此处 和 此处）\n\n- `javafx.concurrent` 包中 `Service` 类提供的某些方法：\n\
    \n  `public void start()`\n  启动此服务；只有当服务处于 `READY` 状态时才能成功启动。\n\n  `public void\
    \ reset()`\n  重置此服务；结果服务的状态将转换为 `READY` 状态。\n\n  `Worker.State getState()`\n \
    \ 定义在 `Worker` 接口中，获取 `state` 属性的值，该值代表 `Worker` 的当前状态。\n\n  `public boolean cancel()`\n\
    \  定义在 `Worker` 接口中，取消此服务，如果服务取消成功则返回 `true`。\n  （参见章节为“开始幻灯片”和“停止幻灯片”菜单项实现动作事件的处理程序）\n\
    \n- `javafx.animation` 包中用于在幻灯片之间并行执行淡入淡出效果过渡动画的类：\n\n  `Animation`\n  `Transition`\n\
    \  `FadeTransition`\n  `ParallelTransition`\n  （参见章节在幻灯片之间添加淡入过渡）\n\n- `javafx.util.Duration`\
    \ 类实现了 `java.lang.Comparable<Duration>`，持续时间。（参见此处）\n\n- `public void playFromStart()`\
    \ 方法由 `Animation` 类提供，从起始位置播放动画。（参见此处）\n\n# 结语\n\n作者正在编写该系列书籍的其他卷，并将陆续发布。让我们在序言部分揭示的功能之外，预览一下即将推出的特性：\n\
    \n*   更多交互式绘图工具：自由手绘制工具、橡皮带绘制工具、文本写入、颜色渐变、圆弧绘制、光标移动工具等。\n*   调色板工具\n*   图像裁剪工具\n\
    *   路径过渡动画器\n*   动态上下文菜单控制器\n*   以及更多……\n\n祝猴年快乐、健康、万事如意。\n\n"
