- fmt: "\n### 3.3.4 Coordinate with Event Handlers of `Load` Menu Item and `Previous`\
    \ Button\n\nSince a slide show is running on its own thread, the application remains\
    \ responsive to user's actions such as mouse clicked on `Load` menu item or `Previous`\
    \ button.\n\nTo make a slide show running smoothly, we'll refine the action handler\
    \ of `Load` menu item as well as the mouse clicked event handler of `Previous`\
    \ button. That is, we'll proceed to the loading of current selected file or previous\
    \ file only if a slide show is not running. Changes are shown in bold type face\
    \ in the following listings.\n\nPlease note that if a user clicks the `Next` button\
    \ while a slide show is running, the overall flow of image rendering doesn't look\
    \ too awkward, therefore no extra care is imposed on it.\n\nListing 3-19. `loadFile`\
    \ method becomes like this:\n\n```java\n /**\n   * \n   * @param file \n   */\n\
    \  void loadFile(File file) {\n    // Create iterator\n    try {\n      ListIterator<java.nio.file.Path>\
    \ it =\n        FileUtils.listIterator(file.toPath());\n\n      // Update value\
    \ of listIterator property\n      listIterator.set(it);\n\n      // If slideshow\
    \ is not on, load the file\n      // otherwise, do nothing here,\n      // because\
    \ slideshow service will do the task\n      if (!isSlideshowOn.get()) {\n    \
    \    // Disable prevButton if there's no previous file,\n        // check hasPrevious()\
    \ before next() is called\n        disableButton(prevButton, !it.hasPrevious());\n\
    \n        file = it.next().toFile();\n        String url = file.toURI().toString();\n\
    \        curImage.set(new Image(url));\n        imageName.set(url.substring(\n\
    \            url.lastIndexOf(\"/\") + 1).replaceAll(\"%20\", \" \"));\n\n    \
    \    // Check hasNext, disable nextButton if there's no next file\n        disableButton(nextButton,\
    \ !it.hasNext());\n\n        lastClickedButton.setValue(NEXT);\n      }\n    }\
    \ catch (IOException ex) {\n    }\n  }\n```\n\nThe following snippet of codes\
    \ is excerpted from the `createPrevButton` method.\n\nListing 3-20. Mouse clicked\
    \ event handler of `Previous` button becomes this:\n\n```java\n // Register mouse\
    \ clicked event handler for previous button\n    buttonGroup.setOnMouseClicked(new\
    \ EventHandler<MouseEvent>() {\n      @Override\n      public void handle(MouseEvent\
    \ me) {\n        if (me.getButton() != MouseButton.PRIMARY)\n          return;\n\
    \        ListIterator<java.nio.file.Path> iterator = (ListIterator)listIterator.get();\n\
    \        if (iterator != null && iterator.hasPrevious()) {\n          java.nio.file.Path\
    \ path = iterator.previous();\n          if (lastClickedButton.get().equals(NEXT))\
    \ {\n            // If the last clicked button is nextButton\n            // the\
    \ first call of previous() is the current image,\n            // must move cursor\
    \ one step backward\n            if (iterator.hasPrevious())\n              path\
    \ = iterator.previous();\n            else {\n              // There is no previous\
    \ image, disable prevButton\n              disableButton(prevButton, true);\n\
    \              return;\n            }\n          }\n          System.out.format(\"\
    Prev button clicked: %s%n\", path.getFileName());\n          // if slideshow is\
    \ not on, load file here\n          // otherwise, do nothing here,\n         \
    \ // because slideshow service will do the task,\n          if (!isSlideshowOn.get())\
    \ {\n            String url = path.toUri().toString();\n            curImage.set(new\
    \ Image(url));\n            imageName.set(url.substring(\n              url.lastIndexOf(\"\
    /\")+1).replaceAll(\"%20\", \" \"));\n\n            lastClickedButton.set(PREVIOUS);\n\
    \            disableButton(prevButton, !iterator.hasPrevious());\n           \
    \ if (nextButton.isDisabled()) \n              disableButton(nextButton, false);\n\
    \          }\n        }    \n      }\n    });\n```\n\nCompile and run the program,\
    \ testing the followings to apprehend how the application deals with concurrency\
    \ of events:\n\n*   Load an image file in an image directory from a `FileChooser`'s\
    \ File Open Dialog.\n*   Start slide show.\n*   While a slide show is running,\
    \ do below actions:\n    *   Select different `View` options back and forth.\n\
    \    *   Click `Previous` button or `Next` button.\n    *   Load another image\
    \ file in different image directory from a `FileChooser`'s File Open Dialog.\n\
    \nFigure 3-11. Snapshot of `Option` menu's appearance when a slide show is running,\
    \ `Start Slideshow` menu item is disabled and `Stop Slideshow` menu item is enabled.\n\
    \n![](Images/image00159.jpeg \"slideshow_on.jpg\")\n\n## 3.4 Add Fade Transition\
    \ between Slides\n\nTo accent the movement of a slide show, we'll add fade transition\
    \ between slides. Here are classes from `javafx.animation` package for animations\
    \ of fade transitions:\n\n*   `Animation`\n    An abstract class extends `java.lang.Object`,\
    \ provides common properties and methods required among animations.\n*   `Transition`\n\
    \    An abstract class extends `Animation`, provides common properties and methods\
    \ required among transition animations. Here are available transitions: `FadeTransition`,\
    \ `FillTransition`, `ParallelTransition`, `PathTransition`, `PauseTransition`,\
    \ `RotateTransition`, `ScaleTransition`, `SequentialTransition`, `StrokeTransition`,\
    \ `TranslateTransition`.\n*   `FadeTransition`\n    A direct subclass of `Transition`,\
    \ changes the opacity of the.\n*   `ParallelTransition`\n    A direct subclass\
    \ of `Transition`, conducts transitions over a list of `Animation` objects. This\
    \ is the constructor we'll use to create `FadeTransition` objects:\n\n```java\n\
    public FadeTransition(Duration duration, Node node)\n```\n\n`Duration` class,\
    \ resides in `javafx.util`, provides several factory methods for creating duration\
    \ objects. Here's the one employed:\n\n```java\npublic static Duration millis(double\
    \ ms)\n```\n\nThe above method creates a `Duration` of given milliseconds for\
    \ a `FadeTransition`. properties:\n\n*   `duration`\n    Type of `ObjectProperty<Duration>`,\
    \ holds the duration of transiting the opacity from `fromValue` to `toValue`.\
    \ The value of this property is specified as the first argument of the constructor.\n\
    *   `node`\n    Type of `ObjectProperty<Node>`, holds the target node conducted\
    \ for this transition. The value of this property is specified as the second argument\
    \ of the constructor.\n*   `fromValue`\n    Type of `DoubleProperty`, holds the\
    \ starting value of opacity for this fade transition.\n*   `toValue`\n    Type\
    \ of `DoubleProperty`, holds the end value of opacity for this fade transition.\n\
    \nHere's the snippet of codes to create a `FadeTransition` for an image to fade\
    \ in, the value of opacity for this image is changing from 0 to 1 through the\
    \ duration of 2000 milliseconds:\n\n```java\nFadeTransition fadein = new FadeTransition(Duration.millis(2000),\
    \ inView);\n        fadein.setFromValue(0.0);\n        fadein.setToValue(1.0);\n\
    ```\n\nSimilarly, here's the snippet of codes to create a `FadeTransition` for\
    \ an image to fade out, the value of opacity for this image is changing from 1\
    \ to 0 through the duration of 2000 milliseconds:\n\n```java\nFadeTransition fadeout\
    \ = new FadeTransition(Duration.millis(2000), outView);\n        fadeout.setFromValue(1.0);\n\
    \        fadeout.setToValue(0.0);\n```\n\nNow, we have two `FadeTransition` objects,\
    \ one for performing fade in transition, another for performing fade out transition,\
    \ we prefer both transitions to process in parallel. Since each transition has\
    \ its own target node, the following constructor of `ParallelTransition` is employed:\n\
    \n```java\npublic ParallelTransition(Animation... children)\n```\n\nHere's the\
    \ snippet of codes to create a `ParallelTransition` and start the animation using\
    \ the `playFromStart()` method provided in `Animation` class:\n\n```java\nTransition\
    \ animate = new ParallelTransition(fadein, fadeout);\n        animate.playFromStart();\n\
    ```\n"
