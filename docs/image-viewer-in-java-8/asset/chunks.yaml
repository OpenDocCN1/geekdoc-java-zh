    JavaFX 架构中嵌入了一个 Web 引擎组件，它位于 `javafx.scene.web` 包中提供一组 API，用于开发具有 浏览器功能的应用程序。要查看网页，首先需要创建一个扩展
    `javafx.scene.Parent` 的 `WebView` 对象（该对象继承了节点（node）的所有特性），然后获取与之关联的 `WebEngine`。`WebEngine`
    提供了与操作网页相关的方法，例如：加载/显示网页（通过提供给定的 URL 或页面内容）、访问由 `WebEngine` 为加载的网页创建的文档对象模型（DOM）、处理由
    JavaScript 触发的各种事件等。


    ### 参考 Oracle 在线文档“JavaFX: Adding HTML Content to JavaFX Applications”：


    [`docs.oracle.com/javase/8/javafx/embedded-browser-tutorial/index.html`](http://docs.oracle.com/javase/8/javafx/embedded-browser-tutorial/index.html)


    ### 用于编辑 HTML 页面的 HTMLEditor 类


    对对 HTML 编辑能力的完整支持来自 `HTMLEditor` 类，该类扩展自 `javafx.scene.control.Control` 并位于 `javafx.scene.web`
    包中。要在 JavaFX 应用程序中嵌入 HTML 编辑器，你只需创建 `HTMLEditor` 的实例，将其添加到场景图（scene graph）中，它就可以与用户交互了。以下两个方法对于获取和设置编辑器的
    HTML 内容有用：`getHtmlText()` 和 `setHtmlText(java.lang.String htmlText)`。


    与处理多行纯文本的类似控件 `TextArea` 不同，`HTMLEditor` 格式化符合 HTML 语法的文本。


    HTML 编辑器的用法广泛应用于软件各个领域，例如：博主撰写发布的文章（内容管理系统）、邮件系统用户撰写消息（消息系统）、在线卖家为上架准备产品描述（电子商务管理系统）等。


    ### 参考 Oracle 在线文档“JavaFX: Working with JavaFX UI Components -- HTML Editor”：


    [`docs.oracle.com/javase/8/javafx/user-interface-tutorial/editor.htm`](http://docs.oracle.com/javase/8/javafx/user-interface-tutorial/editor.htm)


    ### 用于渲染数据的图表组件


    以下类位于 `javafx.scene.chart` 包中，用于绘制各种类型的图表：


    * `AreaChart`, `StackedAreaChart`

    * `BarChart`, `StackedBarChart`

    * `BubbleChart`

    * `LineChart`

    * `PieChart`

    * `ScatterChart`


    `Chart` 类是所有图表组件的基类，扩展自 `javafx.scene.layout.Region` 类，因此继承了 `javafx.scene.Node`
    类的所有适用特性。


    ### 参考 Oracle 在线文档“JavaFX: Working with JavaFX UI Components -- Working with JavaFX
    Charts”：


    [`docs.oracle.com/javase/8/javafx/user-interface-tutorial/charts.htm`](http://docs.oracle.com/javase/8/javafx/user-interface-tutorial/charts.htm)


    ### 用于播放媒体的 MediaView 类


    扩展 `javafx.scene.Node` 的 `MediaView` 类与 `MediaPlayer` 和 `Media` 类一起使用，在 JavaFX
    应用程序中播放媒体。所有与媒体相关的类都位于 `javafx.scene.media` 包。


    ### 参考 Oracle 在线文档“JavaFX: Incorporating Media Assets Into JavaFX Applications”：


    [`docs.oracle.com/javase/8/javafx/media-tutorial/`](http://docs.oracle.com/javase/8/javafx/media-tutorial/)


    # JavaFX 基础 UI 组件


    除了上述的 JavaFX 核心外，JavaFX 还提供了基础 UI 组件，它们位于 `javafx.scene.control` 包中并派自 `javafx.scene.control.Control`
    类；它们通常被称为 UI 控件。


    以下是可用的 UI 控件，未标记星号 (\*) 的控件在 Swing 中有对应的控件：


    * `Label`, `Button`, `RadioButton`, `ToggleButton`,

    * `CheckBox`, `ChoiceBox`,

    * `ComboBox`, `ListView`, `TableView`,

    * `TextField`, `TextArea`, `PasswordField`, `HTMLEditor`

    * `ScrollBar`, `ScrollPane`, `Slider`, `ProgressBar`, `ProgressIndicator`, `ToolBar`,

    * `MenuBar`, `MenuButton`, `SplitMenuButton`,

    * `ColorPicker`, `DatePicker`, `Separator`, `Pagination`, `SplitPane`, `TabPane`,
    `TitledPane`, `Accordion`, `TreeView`, `TreeTableView`, `Hyperlink`。


    以下 UI 组件通常与上述 UI 控件归为同一类。


    * `Tooltip` 位于 `javafx.scene.control` 包中，但派自 `javafx.scene.control.PopupControl`
    类。

    * `MenuItem`, `Menu`, `CheckMenuItem`, `RadioMenuItem` 位于 `javafx.scene.control`
    包中。扩展 `java.lang.Object` 的 `MenuItem` 是另外三个类的基类。

    * `FileChooser` 位于 `javafx.stage` 包并扩展自 `java.lang.Object`。


    ### 参考 Oracle 在线文档“JavaFX: Working with JavaFX UI Components”：


    [`docs.oracle.com/javase/8/javafx/user-interface-tutorial/editor.htm`](http://docs.oracle.com/javase/8/javafx/user-interface-tutorial/editor.htm)


