  trans: "\n郭淑芬（Shufen Kuo）于 1988 年夏天搬往旧金湾区，之后一直担任软件工程师。她在各种平台上拥有丰富的实战经验，从 PC DOS\
    \ 到许多 Unix/Linux 工作站，再从 PC Linux 到 PC Windows。\n\n她从 2001 年开始编写 Java 程序。多年来，她一直使用\
    \ `Abstract Windowing Toolkit` (`AWT`) 和 `Swing`（`Java Foundation Classes` (`JFC`)\
    \ 的 GUI 组件）来为她的 Java 项目开发图形界面。从 2012 年起，她沉浸在 `JavaFX` 世界中；对其本质的探索激发了她编写书籍来推广 `JavaFX`\
    \ 的强大之处。\n\n在开发 Java 应用程序之前，她在运行 X Window 系统的 UNIX/Linux/Solaris 上拥有超过 12 年的 `C/C++`\
    \ 应用程序开发经验。\n\n郭淑芬于 1987 年从华盛顿州立大学获得计算机科学（Computer Science）硕士学位。\n\n目前，她正在使用 `JavaFX`\
    \ 开发具有丰富 GUI 的 Java 应用程序，并编写关于 `JavaFX` 编码的教程，利用她在设计和开发面向对象图形工具方面的专业知识。\n\n她的出版物包括：\n\
    \n* “两步字符串匹配程序，”`Pattern Recognition`，24(7), 711-716, 1991。\n* “一种寻找两个字符串最长公共子序列长度的改进算法，”`ACM\
    \ SIGIR Forum`，1989 年春夏季，第 23 卷，第 3-4 期，89-99 页。\n\n### 黄超（Bing-Chao Huang）\n\n\
    黄超博士于 1987 年从华盛顿州立大学获得计算机科学博士学位。他于 1984 年从斯坦福大学获得计算机科学硕士学位。\n\n他的出版物包括：\n\n* D.E.\
    \ Knuth 著作的《计算机程序设计艺术》第 1 卷：基础算法，第三版（1997 年），第 116-177 页中的 `Algorithm I`。\n* “恒定额外空间下的快速稳定合并与排序，”`The\
    \ Computer Journal` 35(1992), 643-650\n* “最优时间和空间下的稳定集合与多集合操作，”`Information Processing\
    \ Letters` 16(1991), 131-136\n* “最优时间和空间界限下的稳定重复键提取，”`Acta Informatica` 26(1989),\
    \ 473-484\n* “实用的原地合并，”`CACM` 31(1988), 348-352\n* “最优时间和空间下的稳定集合与多集合操作，”第七届 ACM\
    \ SIGACT-SIGMOD-SIGART 数据库原理研讨会（1988）\n* “实用的原地合并，”ACM-IEEE/CS 秋季联合计算机会议（1987）\n\
    * “一种单向无栈快速排序算法，”`BIT` 26(1986), 127-130，与 D.E. Knuth 合著\n* “一种反转排列的算法，”`Information\
    \ Processing Letters` 12(1981), 237-238\n\n# 致谢\n\n| 特别感谢：Tan 博士及其家人，我的姐妹 Jacob\
    \ Chung 博士，我的姐姐 Shuching Chung 博士，以及我的两只猫 Mimi 和 Maomao。 |\n| -- 郭淑芬 |\n\n# 前言\n\
    \n## 本书的组织结构\n\n本书是 `Coding in JavaFX Step by Step Build Graphics Toolkit` 系列书的第一卷（`VOLUME\
    \ Ⅰ`）。由于内容非常丰富，无法整合在一本书中管理，因此章节被组织在不同的卷册中：\n\n### 1. 第一卷：开发图像查看组件\n* **第 1 章**：基础图像查看器\n\
    * **第 2 章**：带有浏览按钮的增强图像查看器\n* **第 3 章**：具有幻灯片功能的增强图像查看器\n\n### 2. 第二卷：开发交互式形状绘制工具\n\
    * **第 1 章**：线条绘制器\n  根据绘板上的鼠标事件绘制线条。\n* **第 2 章**：折线绘制器\n  根据绘板上的鼠标事件绘制折线。\n*\
    \ **第 3 章**：多边形绘制器\n  根据绘板上的鼠标事件绘制多边形。\n* **第 4 章**：路径绘制器\n  根据绘板上的鼠标事件绘制路径。\n\
    * **第 5 章**：二次贝塞尔曲线绘制器\n*  根据绘板上的鼠标事件绘制由二次贝塞尔曲线组成的路径。\n* **第 6 章**：基础绘制工具\n  在名为\
    \ `drawtool` 的包中创建集成类，以方便各种形状绘制器的开发——矩形绘制器、圆形绘制器和椭圆绘制器。\n* **第 7 章**：带有预定义绘制器的增强绘制工具\n\
    \  增强 `drawtool` 包并实现多种绘制器，位于 `drawtool.drawer` 包中，包含这些预定义的形状绘制器——`LineDrawer`、`PolylineDrawer`、`PolygonDrawer`、`PathDrawer`、`BazierCurveDrawer`、`RectangleDrawer`、`CircleDrawer`、`EllipseDrawer`\
    \ 和 `ShapeMover`——它们都是 `ShapeDrawer` 的子类。\n* **第 8 章**：初始 `JFXDrawTools` \n  通过集成所有预定义的形状绘制器并利用增强的形状绘制\
    \ API，开发 `JFXDrawTools` 的初始版本。\n\n### 3. 第三卷：开发交互式正多边形绘制工具\n* **第 1 章**：具有正多边形形状能力的增强绘制工具\n\
    \  引入 `RegularPolygon` 类。\n* **第 2 章**：带有正多边形的增强绘制工具\n  引入 `RegularPolygonDrawer`，它是\
    \ `ShapeDrawer` 的子类，位于 `drawtool.drawer`。\n* **第 3 章**：带有正多边形绘制器的 JFXDrawTools\n\
    \  将正多边形绘制器集成到 JFXDrawTools。\n\n### 4. 第四卷：草稿保存与加载\n* **第 1 章**：带有写入器的增强绘制工具\n\
    \  引入 `DrawWriter` 类，位于 `drawtool.io`。\n* **第 2 章**：带有加载器的增强绘制工具\n  引入 `DrawLoader`\
    \ 类，位于 `drawtool.io`。\n* **第 3 章**：带有写入器和加载器的 JFXDrawTools\n  将草稿保存和加载功能集成到 JFXDrawTools。\n\
    \n### 5. 其他\n每章末都有一个总结部分，列出了该章节涉及的 JavaFX 库的关键方面。这里是一些核心内容：\n* `javafx.scene.shape`\
    \ 包中的 `Shape` 类，用于几何图形。\n* `FXML`，一种符合 `XML` 的标记语言，用于构建 GUI。\n* 属性和绑定机制。\n* 用于加载和显示图像的\
    \ `Image` 类和 `ImageView` 类。\n* `javafx.concurrent` 包中的并发能力。\n* 应用于幻灯片对象的 `FadeTransition`\
    \ 和 `ParallelTransition`。\n* `javafx.scene.layout` 包中的内置布局面板。\n"
