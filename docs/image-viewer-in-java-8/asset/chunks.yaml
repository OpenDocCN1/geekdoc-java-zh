    \ clicked button\n  final StringProperty lastClickedButton = new SimpleStringProperty();\n\
    \n  final ObjectProperty<Image> curImage = new SimpleObjectProperty<>();\n```\n\
    \nProperties usually work in connection with binding mechanism. This is the `bind`\
    \ method defined in `Property<T>` interface,\n\n```\n void bind(ObservableValue<?\
    \ extends T> observable)\n```\n\nto create a unidirectional binding for this property.\
    \ The parameter `observable` is type of `ObservableValue`. Both `ObjectProperty`\
    \ and `StringProperty` implement `Property`, a subinterface of `ObservableValue`.\n\
    \nHere's the snippet of codes to create a binding for `image` property of an `ImageView`\
    \ using the `bind` method:\n\nListing 2-13. Bind `image` property of an `ImageView`\
    \ to `curImage` property:\n\n```\n final ImageView imageView = new ImageView();\n\
    \    imageView.imageProperty().bind(curImage);\n```\n\nOnce the binding is created,\
    \ then whenever the value of `curImage` property is changed, the value of `image`\
    \ property in `ImageView` is changed as well.\n\nThe `set` method or the `setValue`\
    \ method can be used to set value for properties. Here's the snippet of codes\
    \ excerpted from the `handle` method within an event handler registered to handle\
    \ `ActionEvent` of `Load` menu item:\n\nListing 2-14. Set values to `listIterator`\
    \ property, `curImage` property and `lastClickedButton` property :\n\n```\n ListIterator<java.nio.file.Path>\
