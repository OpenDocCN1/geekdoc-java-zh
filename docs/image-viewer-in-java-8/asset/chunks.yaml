    \ of codes to create a `FadeTransition` for an image to fade in, the value of\
    \ opacity for this image is changing from 0 to 1 through the duration of 2000\
    \ milliseconds:\n\n    ```\n     FadeTransition fadein = new FadeTransition(Duration.millis(2000),\
    \ inView);\n              fadein.setFromValue(0.0);\n              fadein.setToValue(1.0);\n\
    \    ```\n\n    Similarly, here's the snippet of codes to create a `FadeTransition`\
    \ for an image to fade out, the value of opacity for this image is changing from\
    \ 1 to 0 through the duration of 2000 milliseconds:\n\n    ```\n     FadeTransition\
    \ fadeout = new FadeTransition(Duration.millis(2000), outView);\n            \
    \  fadeout.setFromValue(1.0);\n              fadeout.setToValue(0.0);\n    ```\n\
    \n    Now, we have two `FadeTransition` objects, one for performing fade in transition,\
    \ another for performing fade out transition, we prefer both transitions to process\
    \ in parallel. Since each transition has its own target node, the following constructor\
    \ of `ParallelTransition` is employed:\n\n    ```\n     public ParallelTransition(Animation...\
    \ children) \n    ```\n\n    Here's the snippet of codes to create a `ParallelTransition`\
    \ and start the animation using the `playFromStart()` method provided in `Animation`\
    \ class:\n\n    ```\n     Transition animate = new ParallelTransition(fadein,\
    \ fadeout);\n              animate.playFromStart(); \n    ```"
