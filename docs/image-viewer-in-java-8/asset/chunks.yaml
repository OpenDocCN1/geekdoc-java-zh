  trans: "\n\n当 `Previous` 按钮发生鼠标点击事件时，将加载上一张可用图像并将其显示在图像渲染区域。与此同时，我们需要检查是否没有更多以前的图像可以加载。以下是代码片段，更改部分已用粗体显示：\n\
    \n### 列表 3-10. 在鼠标点击事件处理器中更新 `Previous` 按钮的禁用状态：\n\n```\n Node createPrevButton()\
    \ {\n\n    ...\n\n     // 为 prevButton 注册鼠标点击事件处理器\n    buttonGroup.setOnMouseClicked(new\
    \ EventHandler<MouseEvent>() {\n      @Override\n      public void handle(MouseEvent\
    \ me) {\n        // 获取迭代器\n        ListIterator<java.nio.file.Path> iterator =\
    \ listIterator.get();\n        if (iterator != null && iterator.hasPrevious())\
    \ {\n          java.nio.file.Path path = iterator.previous();\n          if (lastClickedButton.get().equals(NEXT))\
    \ {\n            // 如果上次点击的按钮是 nextButton\n            // 第一次 previous() 是当前图像，\n\
    \            // 必须将光标后移一步\n            if (iterator.hasPrevious())\n         \
    \     path = iterator.previous();\n            else {\n              // 没有以前的图像，禁用\
    \ prevButton\n              disableButton(prevButton, true);\n              return;\n\
    \            }\n          }\n          System.out.format(\"Prev button clicked:\
    \ %s%n\", path.getFileName());\n          String url = path.toUri().toString();\n\
    \          imageName.set(url.substring(\n            url.lastIndexOf(\"/\")+1).replaceAll(\"\
    %20\", \" \"));  \n          curImage.set(new Image(url));\n          lastClickedButton.set(PREVIOUS);\n\
    \          // 当没有之前的图像时禁用之前的按钮\n          disableButton(prevButton, !iterator.hasPrevious());\n\
    \          if (nextButton.isDisabled()) \n            disableButton(nextButton,\
    \ false); \n        }\n      }\n    });\n\n    ...\n  }\n```\n\n图 3-3. 当没有之前的文件可以打开时\
    \ `Previous` 按钮禁用的截图。\n\n![](img/image00151.jpeg \"button_disable.jpg\")\n\n图\
    \ 3-4. 当没有下一个文件可以打开时 `Next` 按钮禁用的截图。\n\n![](img/image00152.jpeg \"next_button_disable.jpg\"\
    )\n\n### 3.2.2 当鼠标按下时更改按钮的外观\n\n现在，我们将当按钮上发生鼠标按下事件时更改按钮的背景绘制颜色。与此同时，创建 `Next`\
    \ 按钮和 `Previous` 按钮的代码通过模块化的鼠标事件处理代码进行了整理。定义了 `registerButtonEvent` 方法用于为以下 `EventType`\
    \ 注册事件处理器：`MOUSE_ENTERED`、`MOUSE_PRESSED`、`MOUSE_RELEASED` 和 `MOUSE_EXITED`。\n\
    \n当鼠标按下按钮上时，填充矩形的绘制颜色会发生变化，填充多边形的绘制颜色与鼠标进入时相同。当鼠标释放或离开按钮时，填充颜色和描边将恢复到原始值。\n\n\
    #### 导入语句：\n\n```\n import javafx.scene.paint.Paint;\nimport javafx.scene.shape.Shape;\n\
    ```\n\n### 列表 3-11. 定义 `registerButtonEvent` 方法：\n\n```\n /**\n   * 此方法为按钮注册鼠标进入/按下/释放/离开事件，\n\
    \   * 改变按钮的外观以区分不同的事件类型。\n   * \n   * @param buttonGroup\n   * @param rect\n \
    \  * @param polygon\n   * @param bg\n   * @param entered\n   * @param pressed\
    \ \n   */\n  void registerButtonEvent(Node buttonGroup,\n    final Shape rect,\
    \ final Shape polygon,\n    final Paint bg, final Paint entered, final Paint pressed)\
    \ {\n\n    // 注册鼠标进入事件处理器\n    // 当鼠标进入时改变按钮的外观\n    buttonGroup.setOnMouseEntered(new\
    \ EventHandler<MouseEvent>() {\n      @Override\n      public void handle(MouseEvent\
    \ me) {\n        System.out.println(\"Mouse entered\");\n        // 检查左鼠标键是否按下\n\
    \        rect.setFill(me.isPrimaryButtonDown()? pressed : entered);\n        polygon.setFill(Color.web(\"\
    #436B8B\"));\n        polygon.setStroke(Color.WHITE);\n      }\n    });\n\n  \
    \  // 注册鼠标按下事件处理器\n    // 当鼠标进入时改变按钮的外观（注：此处原文可能有误，应为按下）\n    buttonGroup.setOnMousePressed(new\
    \ EventHandler<MouseEvent>() {\n      @Override\n      public void handle(MouseEvent\
    \ me) {\n        System.out.println(\"Mouse pressed\");\n        if (me.isPrimaryButtonDown())\
    \ {\n          rect.setFill(pressed);\n          polygon.setFill(Color.web(\"\
    #436B8B\"));\n          polygon.setStroke(Color.WHITE);\n        }\n      }\n\
    \    });\n\n    // 鼠标离开事件处理器\n    // 当鼠标离开时恢复到原始外观\n    EventHandler<MouseEvent>\
    \ exited = new EventHandler<MouseEvent>() {\n      @Override\n      public void\
    \ handle(MouseEvent me) {\n        System.out.println(\"Mouse exited/released\"\
    );\n        rect.setFill(bg);\n        polygon.setFill(Color.WHITE);\n       \
    \ polygon.setStroke(Color.web(\"#436B8B\"));\n      }\n    };\n\n    buttonGroup.setOnMouseExited(exited);\n\
    \n    // 注册鼠标释放事件处理器\n    // 当鼠标释放时恢复到原始外观\n    // 外观与鼠标离开时相同\n    buttonGroup.setOnMouseReleased(exited);\n\
    \  }\n```\n\n### 列表 3-12. `createNextButton` 方法变得如下：\n\n"
- fmt: "\n```java\n /**\n   * Create next button using a Rectangle as background,\n\
    \   * a Polygon as icon, a Group as container,\n   * size of Rectangle is 25 by\
    \ 35,\n   * thickness of polygon is 8 pixels,\n   * padding of polygon is (2,\
    \ 2, 2, 5),\n   * change button appearance when mouse entered/pressed/released/exited.\n\
    \   *\n   * @return\n   */\n  Node createNextButton() {\n\n    // Create a group\
    \ as button\n    Group buttonGroup = new Group();\n\n    // Create a rectangle\
    \ shape as background\n    final Rectangle rect = new Rectangle(0, 0, 25, 35);\n\
    \n    // Use linear gradient to fill the rectangle of next button\n    final LinearGradient\
    \ lg = new LinearGradient(0, 0, 1, 0, true,\n        CycleMethod.NO_CYCLE, new\
    \ Stop[]{\n      new Stop(0, Color.web(\"#5173A8\")),\n      new Stop(0.6, Color.web(\"\
    #A8B9D4\")),\n      new Stop(1, Color.web(\"#87A7C6\"))});\n    rect.setFill(lg);\n\
    \    rect.setStroke(Color.web(\"#ACD7FF\"));\n    rect.setArcHeight(6.5);\n  \
    \  rect.setArcWidth(6.5);\n\n    // Paint to fill rectangle when mouse entered\
    \ the next button\n    final LinearGradient lgEntered = new LinearGradient(0,\
    \ 0, 1, 0, true,\n        CycleMethod.NO_CYCLE, new Stop[]{\n      new Stop(0,\
    \ Color.web(\"#87A7C6\")),\n      new Stop(0.4, Color.web(\"#A8B9D4\")),\n   \
    \   new Stop(1, Color.web(\"#5173A8\"))});\n\n    // Paint to fill rectangle when\
    \ mouse pressed on the next button\n    final LinearGradient lgPressed = new LinearGradient(0,\
    \ 0, 1, 0, true,\n        CycleMethod.NO_CYCLE, new Stop[]{\n      new Stop(0,\
    \ Color.web(\"#87A7C6\")),\n      new Stop(0.4, Color.web(\"#A8B9D4\")),\n   \
    \   new Stop(1, Color.web(\"#2F4F4F\"))});\n\n    // Create a polygon shape representing\
    \ visual sign of Next icon\n    // 8 pixel thickness, insets is 2, 2, 2, 5\n \
    \   final Polygon polygon = new Polygon();\n    Double[] dArray = {\n      5.0,\
