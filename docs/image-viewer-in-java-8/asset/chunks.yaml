    \ {\n      public void changed(ObservableValue o, Object oldVal,\n          Object\
    \ newVal) {\n        System.out.format(\"imageArea width changed from %.1f to\
    \ %.1f%n\",\n            oldVal, newVal);\n      }\n    });\n    imageArea.heightProperty().addListener(new\
    \ ChangeListener<Object>() {\n      public void changed(ObservableValue o, Object\
    \ oldVal,\n          Object newVal) {\n        System.out.format(\"imageArea height\
    \ changed from %.1f to %.1f%n\",\n            oldVal, newVal);\n      }\n    });\n\
    \n    // 添加菜单栏\n    final MenuBar menuBar = new MenuBar();\n    Menu menuFile\
    \ = new Menu(\"File\");\n    MenuItem load = new MenuItem(\"Load\");\n    MenuItem\
    \ exit = new MenuItem(\"Exit\");\n    menuFile.getItems().addAll(load, exit);\n\
    \    menuBar.getMenus().add(menuFile);\n    rootPane.setTop(menuBar);\n\n    //\
    \ 为退出菜单项添加动作\n    exit.setOnAction(new EventHandler<ActionEvent>() {\n      @Override\n\
    \      public void handle(ActionEvent e) {\n        Platform.exit();\n      }\n\
    \    });\n\n    // 创建文件选择器\n    final FileChooser fileChooser = new FileChooser();\n\
    \    fileChooser.setTitle(\"Open an Image File\");\n\n    // 为 Load 菜单项添加动作\n\
    \    load.setOnAction(new EventHandler<ActionEvent>() {\n      @Override\n   \
    \   public void handle(ActionEvent e) {\n        // 打开 FileChooser 对话框\n     \
    \   File file = fileChooser.showOpenDialog(stage);\n        if (file != null)\
    \ {\n          String url = file.toURI().toString();\n          Image image =\
    \ new Image(url);\n          imageView.setImage(image);\n        }\n      }\n\
    \    });\n\n    // 创建 Option 菜单\n    Menu menuOption = new Menu(\"Option\");\n\
    \n    // 创建切换组\n    final ToggleGroup groupOption = new ToggleGroup();\n\n   \
    \ // 创建单选菜单项\n    final RadioMenuItem fitWidth = new RadioMenuItem(\"Fit Width\"\
    );\n    fitWidth.setToggleGroup(groupOption);\n    final RadioMenuItem fitHeight\
    \ = new RadioMenuItem(\"Fit Height\");\n    fitHeight.setToggleGroup(groupOption);\n\
    \    final RadioMenuItem original = new RadioMenuItem(\"Original Size\");\n  \
    \  original.setToggleGroup(groupOption);\n\n    // 监听切换组中选择的变化\n    groupOption.selectedToggleProperty().addListener(new\
    \ ChangeListener<Toggle>() {\n      public void changed(ObservableValue<? extends\
    \ Toggle> ov,\n          Toggle old_toggle, Toggle new_toggle) {\n        if (groupOption.getSelectedToggle()\
    \ != null) {\n          RadioMenuItem choiceItem = (RadioMenuItem) groupOption.getSelectedToggle();\n\
    \          if (choiceItem == fitWidth) {\n            System.out.println(\"fitwidth\"\
