  trans: "\n\n以下快照显示了淡入/淡出过渡。由于我们使用了 `ParallelTransition` 而不是 `SequentialTransition`，你会看到淡出的图像与淡入图像混合在一起。\n\
    \n### 图 3-12. 要淡出的图像快照\n\n![](img/image00160.jpeg \"fadeout.jpg\")\n\n### 图 3-13.\
    \ 以并行方式执行的淡入和淡出过渡的快照。\n\n![](img/image00161.jpeg \"fade_transition.jpg\")\n\n\
    ### 图 3-14. 正在淡入的图像快照。\n\n![](img/image00162.jpeg \"fadein.jpg\")\n\n编译并运行应用程序。尝试以下步骤进行测试：\n\
    \n*   从 `FileChooser` 的文件打开对话框在图像目录中加载图像文件。\n*   开始幻灯片。\n*   在幻灯片运行时，执行以下操作：\n\
    \    *   反复选择不同的 `View` 选项。\n    *   点击 `Previous`（上一个）或 `Next`（下一个）按钮。\n    *\
    \   从 `FileChooser` 的文件打开对话框在另一个图像目录中加载另一个图像文件。\n*   停止幻灯片。\n\n在命令行中编译和运行 ImageViewer\
    \ 的输出：\n\n```\n     Microsoft Windows [Version 6.3.9600]\n(c) 2013 Microsoft Corporation.\
    \ All rights reserved.\n\nF:\\My Documents\\DocRoot\\SHUFEN_JAVA\\MyBookJFX\\\
    VolumeOne\\ImageViewer1.2\\src\\example5>\njavac  -encoding utf-8 -Xlint:unchecked\
    \ imageviewer\\*.java\n\njar cf imageviewer.jar imageviewer\n\njava -cp imageviewer.jar\
    \ imageviewer.ImageViewer\noriginal size\nimageArea width changed from 0.0 to\
    \ 600.0\nimageArea height changed from 0.0 to 352.0\nStart Slideshow...\nService\
    \ is transited to running status\nMouse entered\nMouse exited/released\nfitwidth\n\
    fitheight\noriginal size\nMouse entered\nMouse pressed\nMouse exited/released\n\
    Next button clicked: Shufen2010_05 1091.jpg\nMouse pressed\nMouse exited/released\n\
    Next button clicked: Shufen2010_05 1166.jpg\nMouse exited/released\nMouse entered\n\
    Mouse pressed\nMouse exited/released\nPrev button clicked: Shufen2010_05 1166.jpg\n\
    Mouse pressed\nMouse exited/released\nPrev button clicked: Shufen2010_05 1166.jpg\n\
    Mouse pressed\nMouse exited/released\nPrev button clicked: Shufen2010_05 1142.jpg\n\
    Mouse exited/released\nMouse entered\nMouse exited/released\nMouse entered\nMouse\
    \ pressed\nMouse exited/released\nNext button clicked: jasmin.gif\nMouse pressed\n\
    Mouse exited/released\nNext button clicked: Jasmin_1.jpg\nMouse exited/released\n\
    Mouse entered\nMouse exited/released\nMouse entered\nMouse pressed\nMouse exited/released\n\
    Prev button clicked: Jasmin_1_320x363.jpg\nMouse exited/released\nStop Slideshow...\n\
    ```\n\n## 3.6 总结\n\n本章介绍了 JavaFX 库的以下关键方面，按它们在章节中出现的顺序列出：\n\n*   `HBox` 类是内置的\
    \ JavaFX 布局面板之一，位于 `javafx.scene.layout` 包中，是 `javafx.scene.layout.Pane` 的直接子类，将其子节点水平地排列在一行中。（参见章节\
    \ 在 BorderPane 底部添加状态栏）\n*   `Text` 类位于 `javafx.scene.text` 包中，是 `javafx.scene.shape.Shape`\
    \ 类的直接子类之一，负责处理渲染几何图形状的常见需求。（参见章节 在 BorderPane 底部添加状态栏）\n*   `void setPadding(Insets\
    \ value)` 方法由 `Region` 类提供，定义了区域的上、右、下、左内边距。（参见此处）\n*   `void setSpacing(double\
    \ value)` 方法由 `HBox` 类提供，指定 HBox 面板中子节点之间的水平间距。（参见此处）\n*   `void setStyle(String\
    \ value)` 方法由 `Node` 类提供，指定此节点的 CSS 样式。（参见此处）\n*   `static Font font(java.lang.String\
    \ family, FontWeight weight, double size)` 方法位于 `javafx.scene.text.Font` 类，用于获取渲染文本的字体。（参见此处）\n\
    *   `Scene(Parent root, double width, double height, Paint fill)` 是 `Scene` 类的构造函数之一，用于创建一个具有指定背景色的\
    \ `Scene`。（参见此处）\n*   某些类位于 `javafx.beans.property` 包中：\n    *   `StringProperty`\
    \ 是一个抽象类，派自 `javafx.beans.binding.StringExpression` 类，实现了 `Property<java.lang.String>`\
    \ 和 `WritableStringValue`。\n    *   `WritableStringValue` 扩展了 `WritableObjectValue<java.lang.String>`。\n\
    \    *   `SimpleStringProperty` 派自 `StringProperty` 类。（参见此处）\n*   `void bind(ObservableValue<?\
    \ extends T> observable)` 方法定义在 `Property` 接口中，位于 `javafx.beans.property` 包中，将此属性单向绑定到给定的\
    \ `ObservableValue`。（参见此处 | 此处 | 此处）\n*   `DoubleBinding subtract(double other)`\
    \ 方法定义在 `javafx.beans.binding.DoubleExpression` 类中，计算此 `NumberExpression` 与给定常量之间的差。（参见此处）\n\
    *   `void setDisable(boolean value)` 方法由 `Node` 类提供，指定此节点的 `disable` 。（参见章节 禁用按钮以表示无图像可打开\
    \ 和 此处）\n*   `void setOpacity(double value)` 方法由 `Node` 类提供，指定节点的透明度。（参见此处）\n\
    *   `MouseEvent` 位于 `javafx.scene.input` 包中，是 `javafx.scene.input.InputEvent`\
    \ 的子类。它定义了如 `MOUSE_CLICKED`、`MOUSE_DRAGGED`、`MOUSE_ENTERED`、`MOUSE_EXITED`、`MOUSE_MOVED`、`MOUSE_PRESSED`、`MOUSE_RELEASED`\
    \ 等事件类型，并提供了如 `getX()`、`getY()` 等获取鼠标事件位置的方法。（参见章节 鼠标按下时更改外观）\n*   `void setOnMousePressed(EventHandler<?\
    \ super MouseEvent> value)` 是 `Node` 类提供的便利方法，注册处理 `MouseEvent` `MOUSE_PRESSED`\
    \ 类型的 `EventHandler`。（参见章节 鼠标按下时更改外观）\n*   `MenuBar`、`Menu` 和 `MenuItem` 是基础 JavaFX\
    \ UI 组件，位于 `javafx.scene.control` 包中，用于使用更少的空间设计紧凑视觉的用户界面。（参见章节 添加幻灯片和停止幻灯片菜单）\n\
    *   来自 `javafx.beans.property` 包的一些类：\n    *   `BooleanProperty` 是一个抽象类，派自 `javafx.beans.binding.BooleanExpression`\
    \ 类，实现了 `Property<java.lang.Boolean>` 和 `WritableBooleanValue`。\n    *   `WritableBooleanValue`\
    \ 扩展了 `WritableValue<java.lang.Boolean>`。\n    *   `SimpleBooleanProperty` 派自\
    \ `BooleanProperty` 类。（参见章节 添加幻灯片和停止幻灯片菜单 和 此处）\n*   `BooleanBinding` 类是位于 `javafx.beans.binding`\
    \ 包中的抽象类，它扩展了 `BooleanExpression` 类并实现了 `Binding<java.lang.Boolean>`。（参见此处）\n\n"
- fmt: "\n- `BooleanExpression` class, resides in `javafx.beans.binding` package,\
    \ is an abstract class that implements `ObservableBooleanValue`, an interface\
    \ that extends `ObservableValue<java.lang.Boolean>`. Convenience methods that\
    \ performs logical operations like AND, OR, and NOT are provided in `BooleanExpression`\
    \ class.\n(See [here](#part0009.xhtml_slideshow-not-or))\n\n- Some convenience\
    \ methods from `BooleanExpression` class:\n\n  `BooleanBinding not()`\n  performs\
    \ the logical NOT operation on this `BooleanExpression`, and returns an object\
    \ of type `BooleanBinding` which is a direct subclass of `BooleanExpression`\n\
    \n  `BooleanBinding or(ObservableBooleanValue other)`\n  performs the logical\
    \ OR operation on this `BooleanExpression` and the given `ObservableBooleanValue`,\
    \ and returns an object of type `BooleanBinding` which is a direct subclass of\
    \ `BooleanExpression`\n  (See [here](#part0009.xhtml_slideshow-not-or))\n\n- `Worker<V>`\
    \ is an interface resides in `javafx.concurrent` package, it defines common APIs\
    \ for implementation of concurrency.\n(See section [Execute Slide Show on Thread](#part0009.xhtml_slideshow-thread))\n\
    \n- Classes for concurrency, reside in `javafx.concurrent` package:\n\n  `Task`\n\
    \  An abstract class implements `Worker<V>` interface, is a one-time `Worker`\
    \ object.\n\n  `Service`\n  An abstract class implements `Worker<V>` interface,\
    \ is a reusable `Worker` object.\n\n  `ScheduledService`\n  A direct subclass\
    \ of `Service` class, allows specifying the duration of delay to start and restart\
    \ a service automatically.\n\n  `WorkerStateEvent`\n  A subclass of `javafx.event.Event`,\
    \ defines static fields of event types such as `WORKER_STATE_CANCELLED`, `WORKER_STATE_FAILED`,\
    \ `WORKER_STATE_READY`, `WORKER_STATE_RUNNING`, `WORKER_STATE_SUCCEEDED`, etc.\
    \ A `WorkerStateEvent` occurs when the state of a `Worker` is transited.\n  (See\
    \ section [Execute Slide Show on Thread](#part0009.xhtml_slideshow-thread))\n\n\
    - `protected abstract V call()` method, defined in `Task` class, must be overridden,\
    \ is invoked when the task is executed. (See [here](#part0009.xhtml_call-method-in-task)\
    \ | [here](#part0009.xhtml_call-method-in-create-task) | [here](#part0009.xhtml_call-method-codes))\n\
    \n- `protected abstract Task<V> createTask()` method, defined in `Service` class,\
    \ must be overridden, is invoked when the service is started. (See [here](#part0009.xhtml_create-task-in-service)\
    \ | [here](#part0009.xhtml_create-task-method) | [here](#part0009.xhtml_create-task-codes))\n\
    \n- Some of convenience methods provided in `Service` class to register `EventHandler`s\
    \ to handle Worker State Events:\n\n  `public final void setOnRunning(EventHandler<WorkerStateEvent>\
    \ value)`\n  `public final void setOnSucceeded(EventHandler<WorkerStateEvent>\
    \ value)`\n  `public final void setOnFailed(EventHandler<WorkerStateEvent> value)`\n\
    \  `public final void setOnCancelled(EventHandler<WorkerStateEvent> value)`\n\
    \  (See section [Configure Slide Show Service Object](#part0009.xhtml_configure-slideshow))\n\
    \n- `Worker.State`, nested class from `javafx.concurrent.Worker` interface, is\
    \ an enumerated type defines constants for states of a `Worker`, they are: `CANCELLED`,\
    \ `FAILED`, `READY`, `RUNNING`, `SCHEDULED`, and `SUCCEEDED`.\n  (See [here](#part0009.xhtml_register-worker-state-event)\
    \ and [here](#part0009.xhtml_worker-state))\n\n- Some of methods provided in `Service`\
    \ class, reside in `javafx.concurrent` package:\n\n  `public void start()`\n \
    \ Start this service; a service can only be started successfully if it is in `READY`\
    \ state.\n\n  `public void reset()`\n  Reset this service; the state of service\
    \ is transited to `READY` state as a result.\n\n  `Worker.State getState()`\n\
    \  Defined in `Worker` interface, get the value of `state` property which represents\
    \ the current state of the `Worker`.\n\n  `public boolean cancel()`\n  Defined\
    \ in `Worker` interface, cancel this service, return `true` if the service is\
    \ canceled successfully.\n  (See section [Implement Event Handlers of Action Events\
    \ for `Start Slideshow` and `Stop Slideshow` Menu Items](#part0009.xhtml_slideshow-action))\n\
    \n- Some of classes from `javafx.animation` package for conducting transition\
    \ animations of fade in and fade out effects between slides in parallel:\n\n \
    \ `Animation`\n  `Transition`\n  `FadeTransition`\n  `ParallelTransition`\n  (See\
    \ section [Add Fade Transition between Slides](#part0009.xhtml_fade-transition))\n\
    \n- `javafx.util.Duration` class, implements `java.lang.Comparable<Duration>`,\
    \ holds the duration of time. (See [here](#part0009.xhtml_fade-transition-duration))\n\
    \n- `public void playFromStart()` method, provided in `Animation` class, plays\
    \ an animation from the starting position. (See [here](#part0009.xhtml_play-from-start-animation))\n\
    \n# EPILOGUE\n\nThe authors are working on the rest of volumes of this book series,\
    \ to be released one by one soon. Let's have a sneak peek of coming features besides\
    \ others revealed in the PREFACE section:\n\n*   More interactive sketching tools:\
    \ Free Hand Drawer, Rubber Band Drawer, Text Writer, Color Gradienter, Arc Drawer,\
    \ Cursor Key Mover, etc.\n*   Color palette tools\n*   Image clipping tools\n\
    *   Path transition animater\n*   Dynamic context menu controller\n*   And more...\n\
    \nWish you a happy, healthy, and prosperous year of the Monkey.\n"
