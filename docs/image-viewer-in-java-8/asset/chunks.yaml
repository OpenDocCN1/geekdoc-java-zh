    \ `ListIterator` 实例：\n\n```java\n /**\n   * 使用 Files.newDirectoryStream(Path,\
    \ String) 读取目录，\n   * 将文件添加到列表，返回指向参数中指定\n   * 文件的 listIteratior，即第一次调用 next()\n\
    \   * 时返回指定的文件，\n   * 文件列表按字母顺序排序，\n   * newDirectoryStream 方法的第二个参数是\n   * 用于过滤匹配模式的文件的\
    \ glob 模式：\n   *   \"*.{bmp,gif,jpeg,jpg,png}\",\n   * 我们只对后缀为以下的文件感兴趣：\n   *\
    \  .bmp, .gif, .jpeg, .jpg 和 .png。\n   * \n   * @param file\n   * @return\n  \
    \ * @throws IOException \n   */\n  static ListIterator<Path> listIterator(Path\
    \ file) throws IOException {\n    Path dir = file.getParent();\n    List<Path>\
    \ list = new ArrayList<>();\n\n    try (DirectoryStream<Path> stream = Files.newDirectoryStream(dir,\n\
    \        \"*.{bmp,gif,jpeg,jpg,png}\")) {\n      for (Path entry : stream) {\n\
    \        // 忽略 dir 内部的子目录\n        if (Files.isDirectory(entry, LinkOption.NOFOLLOW_LINKS))\n\
    \          continue;\n        list.add(entry);\n      }\n    } catch (DirectoryIteratorException\
    \ de) {\n      throw de.getCause();\n    }\n\n    // Path 中的 compareTo 方法按顺序比较两个抽象路径。\n\
    \    Collections.sort(list, new Comparator<Path>() {\n      public int compare(Path\
    \ o1, Path o2) {\n        return o1.getFileName().compareTo(o2.getFileName());\n\
    \      }\n    });\n\n    int index = 0; // 当前文件在列表中的索引\n    // 查找选择文件的索引\n   \
    \ for (Path entry : list) {\n       if (entry.equals(file)) break;\n       index++;\n\
    \    }\n    if (index == list.size()) {\n      // 文件不在列表中\n      index = 0;\n\
    \    } \n    return list.listIterator(index); \n  }\n```\n\n我们将在下一节描述 `FileUtils.listIterator(Path\
