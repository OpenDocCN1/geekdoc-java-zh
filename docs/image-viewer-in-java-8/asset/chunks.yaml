    There is a web engine component embedded in JavaFX architecture and providing
    a set of APIs, located in `javafx.scene.web` package, for developing applications
    with functionality of a web browser. To view a web page, first you create a `WebView`
    object which extends `javafx.scene.Parent` and inherits all the features of a
    node, then obtain the `WebEngine` that associates with it. The `WebEngine` provides
    methods relevant to manipulating a web page, such as: loading/displaying the web
    page, either by given a url or content of the page, accessing the Document Object
    Model (DOM) created by `WebEngine` for the loaded web page, handling a variety
    of events initiated from JavaScript,...etc.


    ### Reference to Oracle Online Documentation "JavaFX: Adding HTML Content to JavaFX
    Applications":


    [http://docs.oracle.com/javase/8/javafx/embedded-browser-tutorial/index.html](http://docs.oracle.com/javase/8/javafx/embedded-browser-tutorial/index.html)


    ### HTMLEditor Class for Editing HTML Pages


    The full support of HTML editing ability comes from `HTMLEditor` class, extends
    `javafx.scene.control.Control`, resides in `javafx.scene.web` package. To embed
    a HTML editor into your JavaFX application, you simply create an instance of `HTMLEditor`,
    add it to a scene graph, then it is ready to interact with users. The following
    two methods are useful to get and set the HTML content of the editor: `getHtmlText()`,
    `setHtmlText(java.lang.String htmlText)`.


    Unlike the similar control `TextArea` that handles multiple lines of plain text,
    the `HTMLEditor` formats text that complies with HTML syntax.


    The usage of the HTML editor are widely required in various fields of software,
    For example, bloggers writing articles to post (content management system), users
    of an Email System composing messages (messaging system), online sellers preparing
    product descriptions for listing (e-commence management system),...etc.


    ### Reference to Oracle Online Documentation "JavaFX: Working with JavaFX UI Components
    -- HTML Editor":


    [http://docs.oracle.com/javase/8/javafx/user-interface-tutorial/editor.htm](http://docs.oracle.com/javase/8/javafx/user-interface-tutorial/editor.htm)


    ### Chart Components for Rendering Data


    The following classes are located in `javafx.scene.chart` packages for drawing
    various types of charts:


    * `AreaChart`, `StackedAreaChart`

    * `BarChart`, `StackedBarChart`

    * `BubbleChart`

    * `LineChart`

    * `PieChart`

    * `ScatterChart`


    `Chart` class, the base class for all chart components, extends `javafx.scene.layout.Region`
    class, and thus inherits all applicable features from `javafx.scene.Node` class.


    ### Reference to Oracle Online Documentation "JavaFX: Working with JavaFX UI Components
    -- Working with JavaFX Charts":


    [http://docs.oracle.com/javase/8/javafx/user-interface-tutorial/charts.htm](http://docs.oracle.com/javase/8/javafx/user-interface-tutorial/charts.htm)


    ### MediaView Class for Playing Media


    The `MediaView` class which extends `javafx.scene.Node` is used along with `MediaPlayer`
    and `Media` classes to play media in your JavaFX applications. All media related
    classes are resides in `javafx.scene.media` package.


    ### Reference to Oracle Online Documentation "JavaFX: Incorporating Media Assets
    Into JavaFX Applications":


    [http://docs.oracle.com/javase/8/javafx/media-tutorial/](http://docs.oracle.com/javase/8/javafx/media-tutorial/)


    # JavaFX Fundamental UI Components


    In addition to the Essence of JavaFX described above, JavaFX provides fundamental
    UI components, reside in `javafx.scene.control` package, and are derived from
    `javafx.scene.control.Control` class; they are called UI controls often.


    Here are available UI controls, the ones that are not marked with asterisk (*)
    have their resemblant counterparts in Swing:


    * `Label`, `Button`, `RadioButton`, `ToggleButton`,

    * `CheckBox`, `ChoiceBox`,

    * `ComboBox`, `ListView`, `TableView`,

    * `TextField`, `TextArea`, `PasswordField`, `HTMLEditor`

    * `ScrollBar`, `ScrollPane`, `Slider`, `ProgressBar`, `ProgressIndicator`, `ToolBar`,

    * `MenuBar`, `MenuButton`, `SplitMenuButton`,

    * `ColorPicker`, `DatePicker`, `Separator`, `Pagination`, `SplitPane`, `TabPane`,
    `TitledPane`, `Accordion`, `TreeView`, `TreeTableView`, `Hyperlink`.


    The following UI components are usually described in the same category with the
    above UI controls.


    * `Tooltip` resides in `javafx.scene.control` package, but is derived from `javafx.scene.control.PopupControl`
    class.

    * `MenuItem`, `Menu`, `CheckMenuItem`, `RadioMenuItem` resides in `javafx.scene.control`
    package. The `MenuItem` which extends `java.lang.Object` is the base class of
    the rest three.

    * `FileChooser` resides in `javafx.stage` package and extends `java.lang.Object`.


    ### Reference to Oracle Online Documentation "JavaFX: Working with JavaFX UI Components":


    [http://docs.oracle.com/javase/8/javafx/user-interface-tutorial/editor.htm](http://docs.oracle.com/javase/8/javafx/user-interface-tutorial/editor.htm)

