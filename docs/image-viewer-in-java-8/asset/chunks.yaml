- fmt: "\nFigure 2-11. Snapshot of `Image Viewer V1.1`, mouse hovers over `Previous`\
    \ button.\n\n![](Images/image00148.jpeg \"next_prev_finish.jpg\")\n\nCompile and\
    \ run the program from command line, testing the program by loading both large\
    \ size and smaller size images from `FileChooser`'s File Open Dialog, selecting\
    \ different view options, resizing the application window dynamically, clicking\
    \ on `Next` button to load next image, clicking on `Previous` button to load previous\
    \ image, ..., etc. The output is similar as follows:\n\nOutput from Compiling\
    \ and Running ImageViewer in command line:\n\n```\n Microsoft Windows [Version\
    \ 6.3.9600]\n(c) 2013 Microsoft Corporation. All rights reserved.\n\nF:\\My Documents\\\
    DocRoot\\SHUFEN_JAVA\\MyBookJFX\\VolumeOne\\ImageViewer1.1\\src\\example4>\njavac\
    \  -encoding utf-8 -Xlint:unchecked imageviewer\\*.java\n\njar cf imageviewer.jar\
    \ imageviewer\n\njava -cp imageviewer.jar imageviewer.ImageViewer\noriginal size\n\
    imageArea width changed from 0.0 to 600.0\nimageArea height changed from 0.0 to\
    \ 375.0\nfitwidth\nfitheight\noriginal size\nMouse entered\nNext button clicked:\
    \ jasmin.bmp\nMouse exited\nMouse entered\nNext button clicked: Shufen2009_11\
    \ 306.jpg\nMouse exited\nMouse entered\nPrev button clicked: Shufen2009_11 305.jpg\n\
    Mouse exited\nScene height changed from 400.0 to 501.0\nimageArea height changed\
    \ from 375.0 to 476.0\nScene width changed from 600.0 to 691.0\nimageArea width\
    \ changed from 600.0 to 691.0\nMouse entered\nNext button clicked: Shufen2010_01\
    \ 420.jpg\nMouse exited\n```\n\n## 2.6 Summary\n\nThis chapter features the following\
    \ key aspects of JavaFX library, listing in the order of their appearance:\n\n\
    - `Group` class, resides in `javafx.scene.Group` package, is a subclass of `javafx.scene.Parent`.\
    \ (See section Use `Group` as Container)\n- `Shape` class, resides in `javafx.scene.shape`\
    \ package, provides functionality for rendering 2D primitives such as rectangle,\
    \ polygon, etc. (See section Use `Shape` for Rendering 2D Primitives)\n- `Rectangle`\
    \ class, resides in `javafx.scene.shape` package, is a direct subclass of `javafx.scene.shape.Shape`.\
    \ It provides functionality to draw rectangle shapes with specified properties,\
    \ such as `x`, `y`, `width`, `height`, etc. (See sections Use `Shape` for Rendering\
    \ 2D Primitives, and Use `Rectangle` as Bounding Box)\n- `Polygon`, resides in\
    \ `javafx.scene.shape` package, is a direct subclass of `javafx.scene.shape.Shape`.\
    \ Use the `getPoints()` method to obtain a list which type `ObservableList<Double>`,\
    \ then use the basic utilities, defined in `Collection` interface, to add a series\
    \ of `x` and `y` coordinates, stored in array of `Double`, to the list, representing\
    \ points of `Polygon`. (See sections Use `Shape` for Rendering 2D Primitives,\
    \ and Use `Polygon` as Visual Icon)\n- `LinearGradient` and `Color`, reside in\
    \ `javafx.scene.paint` package, are two direct subclasses of `Paint` class. (See\
    \ section Paint Background and Border of `Shape`)\n- `CycleMethod` and `Stop`,\
    \ reside in `javafx.scene.paint` package, are classes used along with `LinearGradient`\
    \ and `RadialGradient` classes:\n    - `CycleMethod`: An enumerated type which\
    \ defines constants: `CycleMethod.NO_CYCLE`, `CycleMethod.REFLECT`, and `CycleMethod.REPEAT`.\n\
    \    - `Stop`: Define an offset and a color to be applied to color gradient. (See\
    \ sections Use `Rectangle` as Bounding Box, and Paint Background and Border of\
    \ `Shape`)\n- `arcHeight` and `arcWidth` are properties defined in `Rectangle`\
    \ class, for rendering rounded rectangles. (See section Set Value of `arcHeight`\
    \ and `arcWidth` Properties to Render Rounded Rectangle)\n- `Cursor` class, resides\
    \ in `javafx.scene` package and extends `java.lang.Object`, defines some useful\
    \ mouse cursors as static fields of `Cursor` type as as `CLOSED_HAND`, `CROSSHAIR`,\
    \ `HAND`, `OPEN_HAND`, `TEXT`, `WAIT`, etc. (See section Set Value of `Cursor`\
    \ Property for `Node`)\n- `EventHandler<T extends Event>`, an interface which\
    \ extends `java.util.EventListener`, defines a `handle(T event)` method to be\
    \ invoked when the specified event happens. (See section Use Convenience Methods\
    \ to Register Event Handlers to Handle Mouse Events)\n- `MouseEvent`, resides\
    \ in `javafx.scene.input` package, is a subclass of `javafx.scene.input.InputEvent`.\
    \ It defines event types such as `MOUSE_CLICKED`, `MOUSE_DRAGGED`, `MOUSE_ENTERED`,\
    \ `MOUSE_EXITED`, `MOUSE_MOVED`, `MOUSE_PRESSED`, `MOUSE_RELEASED`, etc., and\
    \ provides methods such as `getX()`, `getY()`, etc., to get position of mouse\
    \ cursor while event occurs. (See section Use Convenience Methods to Register\
    \ Event Handlers to Handle Mouse Events)\n- Some of convenience methods provided\
    \ in `Node` class to register `EventHandler`s to handle mouse events:\n    ```\n\
    \    public final void setOnMouseClicked(EventHandler<? super MouseEvent> value)\n\
    \    public final void setOnMouseEntered(EventHandler<? super MouseEvent> value)\n\
    \    public final void setOnMouseExited(EventHandler<? super MouseEvent> value)\n\
    \    ```\n    (See section Use Convenience Methods to Register Event Handlers\
    \ to Handle Mouse Events)\n- `static void install(Node node, Tooltip t)` method,\
    \ provided in `Tooltip` class which resides in `javafx.scene.control` package\
    \ and extends `javafx.scene.control.PopupControl`, shows help information when\
    \ mouse hovers on the given `Node`. (See section Install `Tooltip` for `Node`)\n\
    - Static methods, provided in `StackPane`, for customizing layout constraints\
    \ on the specified child:\n    ```\n    static void setAlignment(Node child, Pos\
    \ value)\n    static void setMargin(Node child, Insets value)\n    ```\n    (See\
    \ sections Adjust `Next` Button's Default Position in `StackPane`, and Add `Previous`\
    \ Button and Adjust Its Position in `StackPane`)\n- `Pos`, resides in `javafx.geometry`\
    \ package, is an enumerated type defines constants for position and alignment\
    \ such as `CENTER`, `CENTER_RIGHT`, `TOP_RIGHT`, etc. (See sections Adjust `Next`\
    \ Button's Default Position in `StackPane`, and Add `Previous` Button and Adjust\
    \ Its Position in `StackPane`)\n- `Insets` class, resides in `javafx.geometry`\
    \ package, is often used in the `setMargin` method or in the `setPadding` method\
    \ for specifying offset of 4 sides: top, right, bottom and left of a rectangle\
    \ area. (See sections Adjust `Next` Button's Default Position in `StackPane`,\
    \ and prev-button-set-margin-codes)\n- `FileChooser.ExtensionFilter` is the nested\
    \ class defined in the `FileChooser` class, for defining filters to show only\
    \ files whose extensions matching the given filters. (See section Configure `FileChooser`)\n\
    - Some of Classes reside in `javafx.beans.property` package:\n    - `ObjectProperty<T>`:\
    \ is an abstract class, derived from `javafx.beans.binding.ObjectExpression<T>`\
    \ class, implements `Property<T>` and `WritableObjectValue<T>`.\n    - `SimpleObjectProperty<T>`:\
    \ derived from `ObjectProperty<T>` class.\n    - `StringProperty`\n"
