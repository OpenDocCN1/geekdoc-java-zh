  trans: "\n\n# 9. 通过鼠标拖动窗口边缘调整场景宽度和高度，并分别测试三种查看选项。\n\n在后续章节中将采用方法一（V1.01）来继续开发 `ImageViewer`\
    \ V1.1。\n\n图 1-10. 以原始尺寸（1280 像素乘 960 像素）查看图像的快照，图像的外部部分被遮挡。\n\n![](img/image00133.jpeg\
    \ \"mao_original.jpg\")\n\n图 1-11. 图像缩放以适应场景宽度的快照，图像顶部和底部的小部分被遮挡。\n\n![](img/image00134.jpeg\
    \ \"mao_fit_width.jpg\")\n\n图 1-12. 图像缩放以适应场景窗口中可用高度的快照。\n\n![](img/image00135.jpeg\
    \ \"mao_fit_height.jpg\")\n\n图 1-13. 图像缩放以适应宽度，同时场景高度动态增加的快照。\n\n![](img/image00136.jpeg\
    \ \"mao_fit_width_resize_height.jpg\")\n\n图 1-14. 图像缩放以适应高度，同时场景尺寸动态变化的快照。\n\n\
    ![](img/image00137.jpeg \"mao_fit_height_resize_both.jpg\")\n\n在命令行中编译并运行 ImageViewer\
    \ 的输出：\n\n```\n Microsoft Windows [Version 6.3.9600]\n(c) 2013 Microsoft Corporation.\
    \ All rights reserved.\n\nF:\\My Documents\\DocRoot\\SHUFEN_JAVA\\MyBookJFX\\\
    VolumeOne\\ImageViewer1.0\\src\\example5>\njavac -encoding utf-8 -Xlint:unchecked\
    \ imageviewer\\*.java\n\njar cf imageviewer.jar imageviewer\n\njava -cp imageviewer.jar\
    \ imageviewer.ImageViewer\noriginal size\nimageArea width changed from 0.0 to\
    \ 600.0\nimageArea height changed from 0.0 to 375.0\nfitwidth\nfitheight\noriginal\
    \ size\nfitwidth\nfitheight\noriginal size\nimageArea height changed from 375.0\
    \ to 439.0\nimageArea width changed from 600.0 to 615.0\nimageArea width changed\
    \ from 615.0 to 380.0\nimageArea height changed from 439.0 to 527.0\n```\n\n##\
    \ 1.5 总结\n\n本章介绍了 JavaFX 库的以下关键方面，按它们在章节中出现的顺序列出：\n\n*   内置的 JavaFX 布局面板，位于 `javafx.scene.layout`\
    \ 包中：\n    *   `BorderPane`\n    *   `StackPane`\n    （参见节 创建 `ImageViewer` 类作为\
    \ `Application` 子类）\n\n*   `Scene` 类，位于 `javafx.scene` 包中，是场景图的容器。\n    （参见此处，节\
    \ 方法一：分别将 `ImageView` 的 `fitWidth`/`fitHeight` 属性绑定到场景的 `width`/`height` 属性， 以及节\
    \ 捕获场景缩放事件以调整图像查看大小）\n\n*   `Stage` 类，位于 `javafx.stage` 包中，是 JavaFX 应用程序的顶层容器。\n\
    \    （参见此处）\n\n*   `Application` 类，位于 `javafx.application` 包中，是 JavaFX 应用程序的入口点。\n\
    \    （参见节 创建 `ImageViewer` 类作为 `Application` 子类）\n\n*   `void start(Stage stage)`\
    \ 方法，`Application` 类中的抽象方法，必须重写。\n    （参见列表 1-1.， 以及节 JavaFX 应用程序线程与 Java 启动器线程）\n\
    \n*   `void addListener(ChangeListener<? super T> listener)` 方法，定义在 `javafx.beans.value.ObservableValue`\
    \ 接口中，通过提供 `changed(ObservableValue<? extends T> observable`, T`oldValue`, T`\
    \ newValue` 方法来添加 `ChangeListener`，该方法在该属性值更改时被调用。\n    （参见节：捕获图像渲染区域的缩放事件， 以及捕获场景缩放事件以调整图像查看大小](#part0007.xhtml_scene-resize)）\n\
    \n*   `MenuBar`、`Menu` 和 `MenuItem` 是基础 JavaFX UI 组件，位于 `javafx.scene.control`\
    \ 包中，用于设计占用更少空间的紧凑外观的图形用户界面。\n    （参见节 创建菜单栏）\n\n*   `java.io.File showOpenDialog(Window\
    \ ownerWindow`)` 方法，是 `javafx.stage.FileChooser` 类提供的方便方法，用于显示文件打开对话框以浏览本地文件系统。\n\
    \    （参见节 从文件打开对话框选择图像文件并在 `StackPane` 上显示图像）\n\n*   `void setOnAction(EventHandler<ActionEvent>\
    \ value)` 方法，由 `MenuItem` 类提供，用于在 `ActionEvent` 发生时注册 `EventHandler`。\n    （参见节\
    \ 从文件打开对话框选择图像并在 `StackPane` 上显示图像）\n\n*   `ImageView` 和 `Image` 是类，位于 `javafx.scene.image`，用于加载和查看图像。\n\
    \    （参见此处）\n\n*   `RadioMenuItem` 和 `ToggleGroup` 位于 `javafx.scene.control`，用于创建互斥选择。\n\
    \    （参见节 创建菜单栏）\n\n*   `void bind(Value<? extends T> observable)` 和 `void unbind()`\
    \ 是 `Property` 接口中的方法，用于创建/移除绑定。\n    （参见此处）\n\n*   `DoubleBinding subtract(double\
    \ other`)` 方法定义在 `DoubleExpression` 类中，计算此 `NumberExpression` 与给定常量之间的差。\n   \
    \ （参见此处）\n\n*   `fitWidth` 和 `fitHeight` 是定义在 `ImageView` 类中的属性，用于调整图像大小。\n  \
    \  （参见此处）\n\n# 第 2 章：带有浏览按钮的增强图像查看器\n\n## 开发 ImageViewer V1.1\n\n### 引言\n\n在之前的章节中，我们演示了\
    \ JavaFX 应用程序 `ImageViewer V1.0` 的迭代开发。到为止，它包含了基本功能，但是一个实用的方便工具。更多功能将在本章和下一章中逐步添加。\n\
    \n本章是动作的实现以及两个按钮 `Next` 和 `Previous` 的正确放置，用于打开下一个或上一个图像。\n\n版本升级为 1.1。通过从 `ImageViewer`\
    \ V1.1 提取的详细描述和良好的代码，你将熟悉总结节中提到的 JavaFX 基础功能。\n\n`ImageViewer` V1.1 的完整开发过程具有以下步骤的特征：\n\
    \n*   2.1 添加 `Next` 按钮](#part0008.xhtml_add_next)\n    *   2.1.1 使用 `Group` 作为父容器](#part0008.xhtml_group-as-container)\n\
    \    *   2.1.2 使用 `Shape` 类渲染 2D 几何图形](#part0008.xhtml_shape-class)\n    *   2.1.3\
    \ 使用 `Rectangle` 形状作为自定义按钮的边界框](#part0008.xhtml_rectangle-as-bounding-box)\n \
    \   *   2.1.4 绘制 `Shape` 的背景和边界`](part0008.xhtml_paint-shape)\n    *   2.1.5 设置\
    \ `arcHeight` 和 `arcWidth` 属性的值以渲染圆矩形](#part0008.xhtml_arc-height-arc-width)\n\
    \    *   2.1.6 使用 `Polygon` 形状作为 `Next` 图标的视觉符号](#part0008.xhtml_polygon-as-icon)\n\
    \    *   2.1.7 为 `Node` 设置 `Cursor` 属性的值](#part0008.xhtml_mouse-cursor)\n\n"
- fmt: "\n## 2.1.8 Use Convenience Methods to Register Event Handlers to Handle Mouse\
    \ Events\n\n## 2.1.9 Complete Source Codes of `createNextButton()` Method\n\n\
    ## 2.1.10 Install `Tooltip` for `Node`\n\n## 2.2 Adjust `Next` Button's Default\
    \ Position in `StackPane`\n\n## 2.3 Add `Previous` Button and Adjust Its Position\
    \ in `StackPane`\n\n## 2.4 Implement On Mouse Clicked Event Handlers\n\n### 2.4.1\
    \ Configure `FileChooser`\n\n### 2.4.2 Create List Iterator to Iterate Existing\
    \ Files in the Current Directory\n\n### 2.4.3 Define Properties in `ImageViewer`\
    \ Class\n\n## 2.5 Complete Source Codes of `Image Viewer V1.1`\n\n### 2.5.1 Complete\
    \ Source Codes of `FileUtils` Class\n\n### 2.5.2 Complete Source Codes of `ImageViewer`\
    \ Class\n\n## 2.6 Summary\n\n## 2.1 Add `Next` Button\n\nInstead of using `Button`\
    \ class from built-in JavaFX UI controls, we implement our own utilities to design\
    \ a custom-made button by employing the below classes:\n\n* `Group`\n  Served\
    \ as the parent container.\n\n* `Shape`\n    * `Rectangle`\n      Served as the\
    \ bounding box.\n    * `Polygon`\n      Served as the visual sign of `Next` icon.\n\
    \n* `LinearGradient` and `Color`\n  Paints to fill background and to stroke border.\n\
    \n* `EventHandler` and `MouseEvent`\n  Used for handling mouse entering, clicking,\
    \ and exiting events.\n\n### 2.1.1 Use `Group` as Parent Container\n\n`Group`\
    \ class, resides in `javafx.scene` package, is a subclass of `javafx.scene.Parent`.\
    \ The capability of `Group` is straightforward. It allows you to group various\
    \ nodes together without imposing automatic layout. The following snippet of codes\
    \ shows how to add nodes to a `Group`:\n\n```\nGroup buttonGroup = new Group();\n\
    Rectangle rect = new Rectangle(0, 0, 25, 35);\nPolygon polygon = new Polygon();\n\
    buttonGroup.getChildren().addAll(rect, polygon);\n```\n\nLearn more about the\
    \ characteristics of `Group` in Volume Ⅱ: DEVELOPING INTERACTIVE SHAPE DRAWING\
    \ TOOLS Chapter 1 Line Drawer Section 1.1.1 Add Pane as Drawing Board in the Center\
    \ of BorderPane.\n\n### 2.1.2 Use `Shape` Class for Rendering 2D Geometric Primitives\n\
    \nJavaFX provides a very enticing class, `Shape`, for rendering 2D geometric primitives.\
    \ It is an abstract class which extends `javafx.scene.Node` class and serves as\
    \ the base class of some of basic forms of 2D geometry. Here are its direct subclasses:\
    \ `Arc`, `Circle`, `CubicCurve`, `Ellipse`, `Line`, `Path`, `Polygon`, `Polyline`,\
    \ `QuadCurve`, `Rectangle`, `SVGPath`, `Text`. The `Shape` class defines common\
    \ properties of 2D geometric primitives, such as `fill`, `stroke`, `strokeType`,\
    \ `strokeWidth`, etc.\n\nIt is very common to set value of `fill` and `stroke`\
    \ properties respectively for a shape. The `setFill` method is used to specify\
    \ a color to render the background of a shape, and `setStroke` method is used\
    \ to specify a color to render the border of a shape. Please notice that the default\
    \ value of `fill` property is `null` for `Line`, `Polyline`, and `Path`, while\
    \ `Color.BLACK` for the others; and default value of `stroke` property is `Color.BLACK`\
    \ for `Line`, `Polyline`, and `Path`, while `null` for the others.\n\nNow we'll\
    \ show you how to exploit capacities of `Shape` to implement our custom-made `Next`\
    \ button.\n\n### 2.1.3 Use `Rectangle` Shape as Bounding Box of Custom-Made Button\n\
    \nHere are codes to accomplish these: a `Rectangle` is created using the constructor\
    \ with parameters: x, y, width and height, and proper value is set for each desired\
    \ property.\n\nListing 2-1. Create a `Rectangle` and set value of these properties:\
    \ `fill`, `stroke`, `arcHeight`, `arcWidth`:\n\n```\nRectangle rect = new Rectangle(0,\
    \ 0, 25, 35);\nrect.arcHeight = 10;\nrect.arcWidth = 10;\nrect.setFill(Color.GRAY);\n\
    rect.setStroke(Color.LIGHTGRAY);\n```\n\n### 2.1.4 Paint Background and Border\n\
    \n`LinearGradient` and `Color`, reside in `javafx.scene.paint` package, are two\
    \ subclasses of `Paint`, for painting background and border.\n\n`LinearGradient`\
    \ and `Color`, reside in `javafx.scene.paint` package, are two subclasses of `Paint`,\
    \ for painting background and border.\n\n`LinearGradient` and `Color`, reside\
    \ in `javafx.scene.paint` package, are two subclasses of `Paint`, for painting\
    \ background and border.\n\n### 2.1.5 Set `arcHeight` and `arcWidth` Properties\
    \ to Render Rounded Rectangle\n\n`arcHeight` and `arcWidth` are properties defined\
    \ in `Rectangle` class, for specifying height and width diameters of arcs at four\
    \ corners of a rectangle shape. Their default value is `0.0`.\n\nThe following\
    \ figure illustrates how to set correct value for `arcHeight` and `arcWidth` properties\
    \ for rendering a rounded rectangles. The circles and ellipses, overlapping with\
    \ the arcs at the corner of rounded rectangles, are for easy comparison.\n"
