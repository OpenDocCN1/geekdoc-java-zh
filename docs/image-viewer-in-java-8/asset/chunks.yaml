    \        imageView.fitWidthProperty().unbind();\n            imageView.fitHeightProperty().unbind();\n\
    \          }\n\n        }\n      }\n    });\n\n    //为 菜单创建 View 子菜单\n    Menu\
    \ menuView = new Menu(\"View\");\n    menuView.getItems().addAll(fitWidth, fitHeight,\
    \ original);\n\n    // 设置原始大小为默认\n    original.setSelected(true);\n\n    // 将\
