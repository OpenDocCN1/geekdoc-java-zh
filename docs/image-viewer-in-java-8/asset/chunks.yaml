    \ %.1f%n\",\n          oldVal, newVal);\n      }\n    });\n\n    // 添加菜单栏\n  \
    \  MenuBar menuBar = new MenuBar();\n    Menu menuFile = new Menu(\"File\");\n\
    \    MenuItem load = new MenuItem(\"Load\");\n    MenuItem exit = new MenuItem(\"\
    Exit\");\n    menuFile.getItems().addAll(load, exit);\n    menuBar.getMenus().add(menuFile);\n\
    \    rootPane.setTop(menuBar);\n\n    // 为 exit 菜单项添加动作\n    exit.setOnAction(new\
    \ EventHandler<ActionEvent>() {\n      @Override\n      public void handle(ActionEvent\
    \ e) {\n        Platform.exit();\n      }\n    });\n\n    // 创建文件选择器\n    final\
    \ FileChooser fileChooser = new FileChooser();\n    fileChooser.setTitle(\"Open\
    \ an Image File\");\n\n    // 创建视图，添加到图像区域\n    final ImageView imageView = new\
    \ ImageView();\n    imageArea.getChildren().add(imageView);\n\n    // 为 Load 菜单项添加动作\n\
    \    load.setOnAction(new EventHandler<ActionEvent>() {\n      @Override\n   \
    \   public void handle(ActionEvent e) {\n        // 打开 FileChooser 对话框\n     \
    \   File file = fileChooser.showOpenDialog(stage);\n        if (file != null)\
    \ {\n          String url = file.toURI().toString();\n          Image image =\
    \ new Image(url);\n          imageView.setImage(image);\n        }\n      }\n\
    \    });\n\n    stage.setTitle(\"ImageViewer V1.0\");\n    stage.setScene(scene);\n\
    \    stage.show();\n  }\n\n  public static void main(String[] args) {\n    launch(args);\n\
    \  }\n}\n```\n\n编译并运行应用程序。点击 `File` 菜单中的 `Load` 菜单，导航到包含图像文件的目录，选择一个图像文件，点击 `FileChooser`\
    \ 对话框中的 `Open` 按钮，图像将被加载并显示在窗口中心。\n\n图 1-2. 菜单栏带有 `File` 时的截图\n\n图 1-3. 从文件选择器中选择图像文件的截图\n\
    \n图 1-4. 在中心显示小尺寸图像的截图\n\n图 1-5. 在中心显示大尺寸图像的截图\n\n## 1.3 创建 Option 菜单和 View 子菜单\n\
    \n我们需要一个 `Option` 菜单允许用户选择首选的视图标准。`Option` 菜单包含一个 `View` 子菜单，包含三个互斥的选择，如下：\n\n\
    `Fit Width`：通过调整 `ImageView` 的 `fitWidth` 属性来渲染图像，在保持原始宽比的同时，适应当前可用视图区域的宽度。\n\n\
    `Fit Height`：通过调整 `ImageView` 的 `fitHeight` 属性来渲染图像，在保持原始宽比的同时，适应当前可用视图区域的高度。\n\
    \n`Original Size`：按原始尺寸渲染图像，超出当前可用视图区域边界的图像外部部分将被隐藏。这被设置为初始视图选项。\n\n请注意，可用视图空间是由应用程序窗口（称为\
    \ `Stage`）的当前宽度和高度决定的，这取决于 `Scene`（场景的容器）的当前尺寸。初始场景设置为 600 像素 x 400 像素，因此图像渲染区域的尺寸将与场景相同。在我们在\
    \ `BorderPane` 顶部添加了菜单栏后，可用渲染区域的高度变为场景高度减去菜单栏的高度，而宽度保持不变。\n\n### 1.3.1 创建 ToggleGroup、单选框菜单项并为\
    \ `selectedToggle` 属性添加监听器\n\n"
- fmt: "\nTo implement mutually exclusive choices in a menu, we create `RadioMenuItem`\
    \ objects and a single `ToggleGroup` object, then associate each `RadioMenuItem`\
    \ to the same `ToggleGroup`.\n\nTo watch the change of selected radio menu item,\
    \ we use:\n\n```\n void addListener(ChangeListener<? super T> listener) \n```\n\
    \nto register a `ChangeListener` for `selectedToggle` property of `ToggleGroup`\
    \ object.\n\nThe following snippets of codes show how to accomplish these tasks.\n\
