    ## 2.4 Implement On Mouse Clicked Event Handlers\n\nIn section [Use Convenience\
    \ Methods to Register Event Handlers to Handle Mouse Events](#part0008.xhtml_convenience-methods-mouse-event),\
    \ we have demonstrated how to register an event handler for mouse clicked events.\
    \ In this section, we'll register the event handlers and implement the `handle`\
    \ methods which are invoked when mouse clicked on the buttons. If `Next` button\
    \ is clicked, the image file next to the current loaded file will be loaded, and\
    \ if `Previous` button is clicked, the image file before the current loaded file\
    \ will be loaded.\n\nBefore we proceed these tasks properly, we'll configure a\
    \ `FileChooser` to show only files whose extensions matching the specified filters,\
    \ and establish a list of files existing in the current directory, the list is\
    \ created whenever an image file is opened from the File Open Dialog of a `FileChooser`.\n\
    \n### 2.4.1 Configure `FileChooser`\n\nTo configure a `FileChooser`, we use `FileChooser.ExtensionFilter`\
    \ class to define file extension filters to show files with the following extensions:\
    \ \"*.bmp\", \"*.gif\", \"*.jpeg\", \"*.jpg\", \"*.png\".\n\nThe `getExtensionFilters`\
    \ method provided in `FileChooser` class is called to obtain a list of type `ObservableList<FileChooser.ExtensionFilter>`,\
    \ then using the `addAll` method to add as many filters as needed. We define a\
    \ `FileUtils` class to tackle the problem. Codes are as follows:\n\nListing 2-9.\
    \ Define `FileUtils` class, providing a static method `configure` to add file\
    \ extension filters for a given `FileChooser`:\n\n```\n package imageviewer;\n\
    \nimport javafx.stage.FileChooser;\n\n/**\n * File Name: FileUtils.java\n * (in\
    \ directory: ImageViewer1.1/src/example4/imageviewer/)\n *\n * @author Shufen\
    \ Kuo\n */\n\npublic class FileUtils {\n\n  /**\n   * Define file extension filters\
    \ to filtering supported image files,\n   * matching files whose extensions are:\n\
    \   * .bmp, .gif, .jpeg, .jpg and .png\n   * @param fileChooser \n   */\n  static\
    \ void configure(FileChooser fileChooser) {\n    fileChooser.getExtensionFilters().addAll(\n\
    \        new FileChooser.ExtensionFilter(\"All Images\",\n          \"*.bmp\"\
    , \"*.gif\", \"*.jpeg\", \"*.jpg\", \"*.png\"),\n        new FileChooser.ExtensionFilter(\"\
    All Files\", \"*.*\"),\n        new FileChooser.ExtensionFilter(\"BMP\", \"*.bmp\"\
    ),\n        new FileChooser.ExtensionFilter(\"GIF\", \"*.gif\"),\n        new\
    \ FileChooser.ExtensionFilter(\"JPEG\", \"*.jpeg\"),\n        new FileChooser.ExtensionFilter(\"\
    JPG\", \"*.jpg\"),\n        new FileChooser.ExtensionFilter(\"PNG\", \"*.png\"\
    ));    \n    // Set \".\" as default dir\n    fileChooser.setInitialDirectory(new\
    \ File(\".\"));\n  }  \n}\n```\n\nThe constructor of `FileChooser.ExtensionFilter`\
    \ we use in above codes takes two parameters, the first one is the description\
    \ to be shown in the field `\"Files of types:\"` when a File Open Dialog is popped\
    \ up, the second one is a variable length parameter of `String` type, each specified\
    \ a string in compliance with syntax of regular expressions.\n\nInside the `FileUtils.configure`\
    \ method, besides adding file extension filters, we also set current directory\
    \ as initial directory:\n\nfileChooser.setInitialDirectory(new File(\".\"));\n\
    \nThe `configure` method, a static method defined in the `FileUtils` class, is\
    \ called from here:\n\n```\n // Create a file chooser\n    final FileChooser fileChooser\
    \ = new FileChooser();\n    fileChooser.setTitle(\"Open an Image File\");\n  \
    \  FileUtils.configure(fileChooser);\n```\n\nThe functionality of a `FileChooser`\
    \ and its appearance depend on the operation system. Figure 2-9 shows a `FileChooser`\
    \ in Windows XP, and Figure 2-10 shows a `FileChooser` in Windows 8.1.\n\nFigure\
    \ 2-9. Snapshot of a File Open Dialog (in Windows XP), the first filter added\
    \ in the list of extension filters, `\"All Images\"`, is shown in the field `\"\
    Files of types:\"` when the ComboBox is clicked.\n\n![](Images/image00146.jpeg\
    \ \"file_chooser_filter.jpg\")\n\nFigure 2-10. Snapshot of a File Open Dialog\
    \ (in Windows 8.1), the name `\"GIF\"`, which is associated with regular expression\
    \ \"*.gif\" in the codes, is shown in the field follows the file name when the\
    \ item is clicked.\n\n![](Images/image00147.gif \"file_chooser_filter_win81.gif\"\
    )\n\nGenerally, the application's users would appreciate a `FileChooser` remembers\
    \ its last visited directory. Here's how to do this:\n\nListing 2-10. Set last\
    \ visited directory as initial directory of `FileChooser` inside the `handle`\
    \ method of event handler registered for `Load` menu item:\n\n```\n // Add action\
    \ for menu item Load\n    load.setOnAction(new EventHandler<ActionEvent>() {\n\
    \      @Override\n      public void handle(ActionEvent e) {\n        // Open FileChooser\
    \ dialog\n        File file = fileChooser.showOpenDialog(stage);\n        if (file\
    \ != null) {\n          // Set last visited dir as initial directory\n       \
    \  File lastDir = file.getParentFile();\n         fileChooser.setInitialDirectory(lastDir);\n\
    \          String url = file.toURI().toString();\n          Image image = new\
    \ Image(url);\n          imageView.setImage(image);\n        }\n      }\n    });\n\
    ```\n\n### 2.4.2 Create List Iterator to Iterate Existing Files in the Current\
    \ Directory\n\nTo establish a list of files exists in the current directory whenever\
    \ an image file is opened from a File Open Dialog, we'll use API's provided in\
    \ `java.nio.file` package which is introduced in the JDK 7 release.\n\nThe following\
    \ static method provided in `java.nio.file.Files` class,\n\n```\nstatic DirectoryStream<Path>\
    \ newDirectoryStream(Path dir, String glob) \n```\n\nopens a given directory,\
    \ returning a `DirectoryStream<Path>`. The type `DirectoryStream` is an interface\
    \ which extends `iterable`, thus can be applied with the for-each syntax to iterate\
    \ files in a directory.\n\nHere's the snippet of codes to read a directory and\
    \ add file one by one to a list:\n\n```\n List<Path> list = new ArrayList<>();\n\
    \n    try (DirectoryStream<Path> stream = Files.newDirectoryStream(dir,\n    \
    \    \"*.{bmp,gif,jpeg,jpg,png}\")) {\n      for (Path entry : stream) {\n   \
    \     // ignore subdir inside dir\n        if (Files.isDirectory(entry, LinkOption.NOFOLLOW_LINKS))\n\
    \          continue;\n        list.add(entry);\n      }\n    } catch (DirectoryIteratorException\
    \ de) {\n      throw de.getCause();\n    }\n```\n\nThe followings are the complete\
    \ codes of the static method `listIterator` which reads a directory, adds file\
    \ one by one to a `List`, sort files in alphabetical order, and return a `ListIterator`\
    \ that points to the next available file in the directory. The method is defined\
    \ in `FileUtils` class.\n\nImport Statements:\n\n```\n import java.io.IOException;\n\
    import java.nio.file.DirectoryIteratorException;\nimport java.nio.file.DirectoryStream;\n\
    import java.nio.file.Files;\nimport java.nio.file.LinkOption;\nimport java.nio.file.Path;\n\
    import java.util.ArrayList;\nimport java.util.Collections;\nimport java.util.Comparator;\n\
    import java.util.List;\nimport java.util.ListIterator;\nimport javafx.stage.FileChooser;\n\
    ```"
