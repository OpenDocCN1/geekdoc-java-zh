    \n图 3-1. 显示在场景窗口底部状态栏上的当前图像文件名的快照。\n\n![](img/image00149.jpeg \"status_bar.jpg\"\
    )\n\n## 3.2 改进按钮的响应 Aspect\n\n在本节中，我们将花一点精力微调按钮的外观和感受，同时也增强用户友好性。\n\n### 3.2.1\
    \ 禁用按钮以指示没有更多图像可以打开\n\n首先，当没有下一张或上一张图像可以打开时，我们将按钮的禁用状态设置为 `true`。一旦按钮被禁用，它将不会接收任何鼠标或键盘事件。按钮在创建后立即，其禁用状态被初始化为\
    \ `false`。\n\n列表 3-5. 初始化按钮的禁用状态：\n\n```java\n public class ImageViewer extends\
    \ Application {\n  final Node nextButton = createNextButton();\n  final Node prevButton\
    \ = createPrevButton();\n  {\n    disableButton(nextButton, true);\n    disableButton(prevButton,\
    \ true);\n  }\n\n    ...\n\n}\n```\n\n`Node` 类中定义的 `disable` 属性类型为 `BooleanProperty`，它指定了该节点的禁用状态。将此节点的\
    \ `disable` 属性设置为 `true`，会导致该节点的 `disabled` 属性以及其所有后代的 `disabled` 属性都变为 `true`。请注意，可能一个节点的\
    \ `disabled` 属性为 `true`，但其 `disable` 属性并不为 `true`。\n\n`Node` 类中定义的 `opacity` 属性类型为\
    \ `DoubleProperty`，指定了该节点的透明程度。其值范围 $\\≧ 0$ 且 $\\≦ 1$。不透明度值为 0 的节点意味着它是完全透明的。\n\
    \n以下代码演示了如何利用节点的 `opacity` 属性来渲染一个处于禁用状态的按钮。\n\n列表 3-6. 定义 `disableButton` 方法：\n\
    \n```java\n /**\n   * 此方法利用节点的 opacity 属性来\n   * 区分禁用状态， \n   * 如果被禁用，则将透明度值设置为\
    \ 0.4。\n   * \n   * @param button\n   * @param isDisable \n   */\n  void disableButton(Node\
    \ button, boolean isDisable) {\n    // 如果没有更多图像可以打开，将透明度值改为 0.4\n    double opacity\
    \ = (isDisable) ? 0.4 : 1;\n    button.setOpacity(opacity);\n    button.setDisable(isDisable);\n\
    \  }\n```\n\n现在，初始屏幕看起来如下。\n\n图 3-2. 初始应用程序窗口的快照，按钮已禁用。\n\n![](img/image00150.jpeg\
    \ \"initial_scene.jpg\")\n\n为了确定是否有下一张图像或上一张图像，会在以下时机调用 `ListIterator` 接口中定义的\
