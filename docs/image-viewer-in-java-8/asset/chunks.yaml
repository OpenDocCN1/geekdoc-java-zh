    \n    Scene scene = new Scene(rootPane, 600, 400);\n\n    imageArea.widthProperty().addListener(new\
    \ ChangeListener<Object>() {\n      public void changed(ObservableValue o, Object\
    \ oldVal,\n          Object newVal) {\n        System.out.format(\"imageArea width\
