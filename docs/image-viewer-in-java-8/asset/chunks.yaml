    \ `javafx.scene.control.Control` 类中定义的 `tooltip` 属性值。这里是 `setTooltip` 方法：\n\n\
    ```\n public final void setTooltip(Tooltip value) \n```\n\n由于 `Next` 按钮是一个类似于按钮的自定义节点，并没有派自\
    \ `javafx.scene.control.Control` 类，因此我们将使用 `Tooltip` 类提供的 `install` 方法来将 `Tooltip`\
    \ 与 `Next` 按钮关联。这里是 `install` 方法：\n\n```\n public static void install(Node node,\
