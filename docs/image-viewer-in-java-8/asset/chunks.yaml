    \ `SlideshowService` 类的完整源代码\n\n下面的列表显示了此阶段 `SlideshowService` 类的完整源代码，其中更改已用粗体字体显示。\n\
    \nListing 3-22. `SlideshowService` 类如下：\n\n```java\n package imageviewer;\n\n\
    import java.nio.file.Path;\nimport java.util.ListIterator;\nimport javafx.animation.FadeTransition;\n\
    import javafx.animation.ParallelTransition;\nimport javafx.animation.Transition;\n\
    import javafx.beans.property.ObjectProperty;\nimport javafx.beans.property.SimpleObjectProperty;\n\
    import javafx.beans.property.SimpleStringProperty;\nimport javafx.beans.property.StringProperty;\n\
    import javafx.beans.value.ChangeListener;\nimport javafx.beans.value.ObservableValue;\n\
    import javafx.concurrent.Service;\nimport javafx.concurrent.Task;\nimport javafx.scene.image.Image;\n\
    import javafx.scene.image.ImageView;\nimport javafx.util.Duration;\n\n/**\n *\
    \ 文件名: SlideshowService.java\n * (位于目录: ImageViewer1.2/src/example5/imageviewer/)\n\
    \ *\n * 在幻灯片之间添加淡入过渡\n *\n * @author Shufen Kuo\n */\n\npublic class SlideshowService\
    \ extends Service<Void> {\n  private ObjectProperty<ImageView> imageView = new\
    \ SimpleObjectProperty<>();\n  private ObjectProperty<ImageView> fadeOutIV = new\
    \ SimpleObjectProperty<>();\n  private ObjectProperty<Image> image;\n  private\
    \ ObjectProperty<ListIterator<Path>> iterator;\n  private StringProperty imageName;\n\
    \  private ListIterator<Path> it;\n\n  public SlideshowService() {\n    this(new\
    \ SimpleObjectProperty<ListIterator<Path>>(),\n        new SimpleObjectProperty<Image>(),\n\
    \        new SimpleStringProperty());\n  }\n\n  public SlideshowService(ObjectProperty<ListIterator<Path>>\
    \ iterator,\n      ObjectProperty<Image> image, StringProperty imageName) {\n\
    \    this.image = image;\n    this.imageName = imageName;\n    this.iterator =\
    \ iterator;\n    iterator.addListener(new ChangeListener<ListIterator<Path>>()\
    \ {\n      @Override\n      public void changed(ObservableValue<? extends ListIterator<Path>>\
    \ o,\n          ListIterator<Path> oldVal, ListIterator<Path> newVal) {\n    \
    \    it = newVal;\n      }\n    });    \n  }\n\n  public ImageView getImageView()\
    \ {\n    return imageView.get();\n  }\n\n  public void setImageView(ImageView\
    \ value) {\n    imageView.set(value);\n  }\n\n  public ObjectProperty<ImageView>\
    \ imageViewProperty() {\n    return imageView;\n  }\n\n  public ImageView getFadeOutImageView()\
    \ {\n    return fadeOutIV.get();\n  }\n\n  public void setFadeOutImageView(ImageView\
    \ value) {\n    fadeOutIV.set(value);\n  }\n\n  public ObjectProperty<ImageView>\
    \ fadeOutImageViewProperty() {\n    return fadeOutIV;\n  }\n\n  public Image getImage()\
    \ {\n    return image.get();\n  }\n\n  public void setImage(Image value) {\n \
    \   image.set(value);\n  }\n\n  public ObjectProperty<Image> imageProperty() {\n\
    \    return image;\n  }\n\n  public ListIterator<Path> getIterator() {\n    return\
    \ iterator.get();\n  }\n\n  public void setListIterator(ListIterator<Path> value)\
    \ {\n    iterator.set(value);\n  }\n\n  public ObjectProperty<ListIterator<Path>>\
    \ iteratorProperty() {\n    return iterator;\n  }\n\n  public String getImageName()\
    \ {\n    return imageName.get();\n  }\n\n  public void setImageName(String value)\
    \ {\n    imageName.set(value);\n  }\n\n  public StringProperty imageNameProperty()\
    \ {\n    return imageName;\n  }\n\n  @Override\n  protected Task<Void> createTask()\
    \ {\n    return new Task<Void>() {\n      @Override\n      protected Void call()\
    \ {\n        if (it == null) return null;\n\n        Transition animate = null;\n\
    \        ImageView inView = imageView.get();\n        ImageView outView = fadeOutIV.get();\n\
    \        if (inView != null && outView != null) {\n          FadeTransition fadein\
    \ = new FadeTransition(Duration.millis(2000), inView);\n          fadein.setFromValue(0.0);\n\
    \          fadein.setToValue(1.0);\n\n          FadeTransition fadeout = new FadeTransition(Duration.millis(2000),\
    \ outView);\n          fadeout.setFromValue(1.0);\n          fadeout.setToValue(0.0);\n\
    \n          animate = new ParallelTransition(fadein, fadeout);\n        }\n\n\
    \        while (it.hasNext()) {\n          if (isCancelled()) {\n            updateMessage(\"\
    Cancelled\");\n            break;\n          }\n\n          if (inView != null\
    \ && outView != null) {\n            Image prevImage = getImage();\n         \
    \   outView.setImage(prevImage);\n            // Must reset opacity's from value\
    \ for outView\n            outView.setOpacity(1); \n            // Must reset\
    \ opacity's from value for inView\n            inView.setOpacity(0);         \
    \   \n          }        \n\n          String url = it.next().toUri().toString();\n\
    \          setImage(new Image(url));\n          setImageName(url.substring(\n\
    \              url.lastIndexOf(\"/\") + 1).replaceAll(\"%20\", \" \"));\n\n  \
    \        // 在暂停前启动淡入淡出动画\n          if (animate != null) \n            animate.playFromStart();\n\
    \n          // 暂停 3000 毫秒\n          try {\n            Thread.sleep(3000);\n\
    \          } catch (InterruptedException ex) {\n            if (isCancelled())\
    \ {\n              updateMessage(\"Cancelled\");\n              break;\n     \
    \       }\n          }\n        }\n\n        // 返回前重置 outView\n        if (outView\
    \ != null) {\n          outView.setImage(null);\n        }\n\n        return null;\n\
    \      }\n    };\n  }\n}\n```\n\n## 3.5 `Image Viewer V1.2` 的完整源代码\n\nListing\
