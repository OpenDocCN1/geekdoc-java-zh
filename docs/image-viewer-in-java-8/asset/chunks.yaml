    \  *   `AreaChart`, `StackedAreaChart`\n\n    *   `BarChart`, `StackedBarChart`\n\
    \n    *   `BubbleChart`\n\n    *   `LineChart`\n\n    *   `PieChart`\n\n    *\
    \   `ScatterChart`\n\n    `Chart` class, the base class for all chart components,\
    \ extends `javafx.scene.layout.Region` class, and thus inherits all applicable\
    \ features from `javafx.scene.Node` class.\n\n    #### Reference to Oracle Online\
    \ Documentation \"JavaFX: Working with JavaFX UI Components -- Working with JavaFX\
    \ Charts\":\n\n    [http://docs.oracle.com/javase/8/javafx/user-interface-tutorial/charts.htm](http://docs.oracle.com/javase/8/javafx/user-interface-tutorial/charts.htm)\n\
    \n*   `MediaView` Class for Playing Media\n\n    The `MediaView` class which extends\
    \ `javafx.scene.Node` is used along with `MediaPlayer` and `Media` classes to\
    \ play media in your JavaFX applications. All media related classes are resides\
    \ in `javafx.scene.media` package.\n\n    #### Reference to Oracle Online Documentation\
    \ \"JavaFX: Incorporating Media Assets Into JavaFX Applications\":\n\n    [http://docs.oracle.com/javase/8/javafx/media-tutorial/](http://docs.oracle.com/javase/8/javafx/media-tutorial/)\n\
    \n## JavaFX Fundamental UI Components\n\nIn addition to the Essence of JavaFx\
    \ described above, JavaFX provides fundamental UI components, reside in `javafx.scene.control`\
    \ package, and are derived from `javafx.scene.control.Control` class; they are\
    \ called UI controls often.\n\nHere are available UI controls, the ones that are\
    \ not marked with asterisk (*) have their resemblant counterparts in Swing:\n\n\
    *   `Label`, `Button`, `RadioButton`, `ToggleButton`,\n\n*   `CheckBox`, `ChoiceBox`,\n\
    \n*   `ComboBox`, `ListView`, `TableView`,\n\n*   `TextField`, `TextArea`, `PasswordField`,\
    \ `HTMLEditor`(*)\n\n*   `ScrollBar`, `ScrollPane`, `Slider`, `ProgressBar`, `ProgressIndicator`(*),\
    \ `ToolBar`,\n\n*   `MenuBar`, `MenuButton`, `SplitMenuButton`(*),\n\n*   `ColorPicker`,\
    \ `DatePicker`(*), `Separator`, `Pagination`(*), `SplitPane`, `TabPane`, `TitledPane`(*),\
    \ `Accordion`(*), `TreeView`, `TreeTableView`(*), `Hyperlink`(*).\n\nThe following\
    \ UI components are usually described in the same category with the above UI controls.\n\
    \n*   `Tooltip`\n\n    resides in `javafx.scene.control` package, but is derived\
    \ from `javafx.scene.control.PopupControl` class.\n\n*   `MenuItem`, `Menu`, `CheckMenuItem`,\
    \ `RadioMenuItem`\n\n    resides in `javafx.scene.control` package. The `MenuItem`\
    \ which extends `java.lang.Object` is the base class of the rest three.\n\n* \
    \  `FileChooser`\n\n    resides in `javafx.stage` package and extends `java.lang.Object`.\n\
    \n#### Reference to Oracle Online Documentation \"JavaFX: Working with JavaFX\
    \ UI Components\":\n\n[http://docs.oracle.com/javase/8/javafx/user-interface-tutorial/ui_controls.htm](http://docs.oracle.com/javase/8/javafx/user-interface-tutorial/ui_controls.htm)\n\
    \n# Chapter 1\n\nBasic Image Viewer\n\n--Developing Image Viewer V1.0\n\n## Preface\n\
    \nIn this chapter, we'll illustrate usages of JavaFX APIs by means of step-by-step\
    \ development of an image viewing application, `ImageViewer V1.0`. From detailed\
    \ descriptions and well-documented example codes excerpted from ImageViewer V1.0x,\
    \ you will become familiar with fundamental capabilities of JavaFX library recounted\
    \ in the [Summary](#part0007.xhtml_summary) section.\n\nThe complete development\
    \ process of `ImageViewer V1.0` is characterized by the following steps:\n\n*\
    \   [1.1 Create `ImageViewer` Class as Subclass of `Application`](#part0007.xhtml_create-image-viewer)\n\
    \n    *   [1.1.1 JavaFX Application Thread vs. Java Launcher Thread](#part0007.xhtml_thread)\n\
    \n    *   [1.1.2 Catch Resize Event of Image Rendering Area](#part0007.xhtml_image-area-resize)\n\
    \n*   [1.2 Create Menu Bar](#part0007.xhtml_add-menu-bar)\n\n    *   [1.2.1 Add\
    \ File Menu to Menu Bar](#part0007.xhtml_add-file-menu)\n\n    *   [1.2.2 Select\
    \ Image File from File Open Dialog and Display Image on `StackPane`](#part0007.xhtml_file-chooser)\n\
    \n*   [1.3 Create Option Menu and View Submenu](#part0007.xhtml_add-option-menu)\n\
    \n    *   [1.3.1 Create Toggle Group, Radio Menu Items and Add Listener for `selectedToggle`\
    \ Property](#part0007.xhtml_toggle-group)\n\n*   [1.4 Implement Fit Width, Fit\
    \ Height and Original Size Viewing Options](#part0007.xhtml_view-option)\n\n \
    \   *   [1.4.1 Approach One: Bind `ImageView`'s `fitWidth`/`fitHeight` Properties\
    \ to `Scene`'s `width`/`height` Properties Respectively](#part0007.xhtml_bind-unbind)\n\
    \n        *   [1.4.1.1 Implement Fit Width Viewing Option](#part0007.xhtml_bind-fit-width)\n\
    \n        *   [1.4.1.2 Implement Fit Height Viewing Option](#part0007.xhtml_bind-fit-height)\n\
    \n        *   [1.4.1.3 Implement Original Size Viewing Option](#part0007.xhtml_bind-original-size)\n\
    \n        *   [1.4.1.4 Complete Source Codes of `ImageViewer` Class](#part0007.xhtml_complete-source-codes-1)\n\
    \n    *   [1.4.2 Approach Two: Change Values for `fitWidth` Property and `fitHeight`\
    \ property](#part0007.xhtml_set-fit-w-h-value)\n\n        *   [1.4.2.1 Catch Resize\
    \ Event of Scene to Adjust Viewing Size of Image](#part0007.xhtml_scene-resize)\n\
    \n        *   [1.4.2.2 Complete Source Codes of `ImageViewer` Class](#part0007.xhtml_complete-source-codes-2)\n\
    \n*   [1.5 Summary](#part0007.xhtml_summary)\n\n## 1.1 Create `ImageViewer` Class\
    \ as Subclass of `Application`"
