    import javafx.scene.control.Toggle;\nimport javafx.scene.control.ToggleGroup;\n\
    ```\n\n### Listing 1-9. Create `Option` menu, `ToggleGroup`, `RadioMenuItem`s,\
    \ `View` submenu and add a listener for `selectedToggle` property of the `ToggleGroup`:\n\
    \n```\n // Create Option menu\nMenu menuOption = new Menu(\"Option\");\n\n// Create\
    \ toggle group\nfinal ToggleGroup groupOption = new ToggleGroup();\n\n// Create\
    \ radio menu items\nfinal RadioMenuItem fitWidth = new RadioMenuItem(\"Fit Width\"\
    );\nfitWidth.setToggleGroup(groupOption);\nfinal RadioMenuItem fitHeight = new\
    \ RadioMenuItem(\"Fit Height\");\nfitHeight.setToggleGroup(groupOption);\nfinal\
    \ RadioMenuItem original = new RadioMenuItem(\"Original Size\");\noriginal.setToggleGroup(groupOption);\n\
    \n// Add listener for toggle group\ngroupOption.selectedToggleProperty().addListener(new\
    \ ChangeListener<Toggle>() {\n  public void changed(ObservableValue<? extends\
    \ Toggle> ov,\n                      Toggle old_toggle, Toggle new_toggle) {\n\
    \    if (groupOption.getSelectedToggle() != null) {\n      RadioMenuItem choiceItem\
    \ = (RadioMenuItem) groupOption.getSelectedToggle();\n      if (choiceItem ==\
    \ fitWidth) {\n        System.out.println(\"fitwidth\");\n      } else if (choiceItem\
    \ == fitHeight) {\n        System.out.println(\"fitheight\");\n      } else {\n\
    \        System.out.println(\"original size\");\n      }\n    } \n  }\n});\n\n\
    // Create View submenu for Option menu\nMenu menuView = new Menu(\"View\");\n\
    menuView.getItems().addAll(fitWidth, fitHeight, original);\n\n// Set Original\
    \ Size as default choice\noriginal.setSelected(true);\n\n// Add option menu to\
    \ menu bar\nmenuOption.getItems().add(menuView);\nmenuBar.getMenus().add(menuOption);\n\
