    \ pressed\nMouse exited/released\nNext button clicked: jasmin.gif\nMouse pressed\n\
    Mouse exited/released\nNext button clicked: Jasmin_1.jpg\nMouse exited/released\n\
    Mouse entered\nMouse exited/released\nMouse entered\nMouse pressed\nMouse exited/released\n\
    Prev button clicked: Jasmin_1_320x363.jpg\nMouse exited/released\nStop Slideshow...\n\
    ```\n\n## 3.6 Summary\n\nThis chapter features the following key aspects of JavaFX\
    \ library, listing in the order of their appearance in the chapter:\n\n*   `HBox`\
    \ class, one of built-in JavaFX layout panes, resides in `javafx.scene.layout`\
    \ package, is a direct subclass of `javafx.scene.layout.Pane`, placing its children\
    \ in one row horizonally. (See section [Add Status Bar at the Bottom of `BorderPane`](#part0009.xhtml_add-footer))\n\
    *   `Text` class, resides in `javafx.scene.text` package, is one of direct subclasses\
    \ of `javafx.scene.shape.Shape` class which takes care of common needs for rendering\
    \ geometric primitives. (See section [Add Status Bar at the Bottom of `BorderPane`](#part0009.xhtml_add-footer))\n\
    *   `void setPadding(Insets value)` method, provided in `Region` class, defines\
    \ the top, right, bottom, left padding for a region. (See [here](#part0009.xhtml_set-padding))\n\
    *   `void setSpacing(double value)` method, provided in `HBox` class, specifies\
    \ the horizontal space between children in an HBox pane. (See [here](#part0009.xhtml_set-spacing))\n\
    *   `void setStyle(String value)` method, provided in `Node` class, specifies\
    \ CSS style for this node. (See [here](#part0009.xhtml_set-style))\n*   `static\
    \ Font font(java.lang.String family, FontWeight weight, double size)` method is\
    \ provided in `javafx.scene.text.Font` class, for obtaining a font to render text.\
    \ (See [here](#part0009.xhtml_set-font))\n*   `Scene(Parent root, double width,\
    \ double height, Paint fill)` is one of constructors of `Scene` class for creating\
    \ a `Scene` with the specified background color. (See [here](#part0009.xhtml_create-scene-with-color))\n\
    *   Some of Classes reside in `javafx.beans.property` package:\n    *   `StringProperty`\
    \ is an abstract class, derived from `javafx.beans.binding.StringExpression` class,\
    \ implements `Property<java.lang.String>` and `WritableStringValue`.\n    *  \
    \ `WritableStringValue` extends `WritableObjectValue<java.lang.String>`.\n   \
    \ *   `SimpleStringProperty` is derived from `StringProperty` class. (See [here](#part0009.xhtml_properties-binding1))\n\
    *   `void bind(ObservableValue<? extends T> observable)` method defined in `Property`\
    \ interface, resides in `javafx.beans.property` package, to bind this property\
    \ unidirectional to the given `ObservableValue`. (See [here](#part0009.xhtml_fit-height-bind)\
    \ | [here](#part0009.xhtml_slideshow-disable-bind) | [here](#part0009.xhtml_is-slideshow-on-bind))\n\
    *   `DoubleBinding subtract(double other)` method, defined in `javafx.beans.binding.DoubleExpression`\
    \ class, calculates the difference of this `NumberExpression` and the given constant.\
    \ (See [here](#part0009.xhtml_subtract))\n*   `void setDisable(boolean value)`\
    \ method, provided in `Node` class, specifies the `disable` status of this node.\
    \ (See section [Disable Button to Indicate No Image to Open](#part0009.xhtml_disable-button)\
    \ and [here](#part0009.xhtml_disable-property))\n*   `void setOpacity(double value)`\
    \ method, provided in `Node` class, specifies the extent of transparency of this\
    \ node. (See [here](#part0009.xhtml_opacity))\n*   `MouseEvent`, resides in `javafx.scene.input`\
    \ package, is a subclass of `javafx.scene.input.InputEvent`. It defines event\
    \ types such as `MOUSE_CLICKED`, `MOUSE_DRAGGED`, `MOUSE_ENTERED`, `MOUSE_EXITED`,\
    \ `MOUSE_MOVED`, `MOUSE_PRESSED`, `MOUSE_RELEASED`, etc., and provides methods\
    \ such as `getX()`, `getY()`, etc., to get position of mouse event. (See section\
    \ [Change Button Appearance When Mouse Is Pressed](#part0009.xhtml_pressed-button))\n\
    *   `void setOnMousePressed(EventHandler<? super MouseEvent> value)`, a convenience\
    \ method provided in `Node` class, registers an `EventHandler` to handle `MOUSE_PRESSED`\
    \ event type of `MouseEvent`. (See section [Change Button Appearance When Mouse\
    \ Is Pressed](#part0009.xhtml_pressed-button))\n*   `MenuBar`, `Menu`, and `MenuItem`\
    \ are among fundamental JavaFX UI components, reside in `javafx.scene.control`\
    \ package, for designing compact look-and-feel graphical user interfaces using\
    \ less space. (See section [Add Start Slideshow and Stop Slideshow Menu Items](#part0009.xhtml_add-slideshow-menu-item))\n\
    *   Some classes from `javafx.beans.property` package:\n    *   `BooleanProperty`\
    \ is an abstract class, derived from `javafx.beans.binding.BooleanExpression`\
    \ class, implements `Property<java.lang.Boolean>` and `WritableBooleanValue`.\n\
    \    *   `WritableBooleanValue` extends `WritableValue<java.lang.Boolean>`.\n\
    \    *   `SimpleBooleanProperty` derived from `BooleanProperty` class. (See section\
    \ [Add Start Slideshow and Stop Slideshow Menu Items](#part0009.xhtml_add-slideshow-menu-item)\
    \ and [here](#part0009.xhtml_is-slideshow-on-bind))\n*   `BooleanBinding` class\
    \ is an abstract class resides in `javafx.beans.binding` package, it extends `BooleanExpression`\
    \ class and implements `Binding<java.lang.Boolean>`. (See [here](#part0009.xhtml_slideshow-not-or))\n"
