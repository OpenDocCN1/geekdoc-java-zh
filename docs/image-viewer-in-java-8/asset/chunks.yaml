    \n列表 2-7. 定义 `createPrevButton` 方法以创建 `Previous` 按钮：\n\n```\n /**\n   * 使用 createPrevButton()\
    \ 方法创建上一个按钮\n   */\n Node createPrevButton() {\n    // ... implementation details\
    \ ...\n }\n```\n\n（注：提示词中 2.3 节提供的文本已截断。我已根据规则对可用部分进行了格式化处理。）\n\n"
