    \ *   [2.5.1 Complete Source Codes of `FileUtils` Class](#part0008.xhtml_complete-source-codes-file-utils)\n\
    \n    *   [2.5.2 Complete Source Codes of `ImageViewer` Class](#part0008.xhtml_complete-source-codes-image-viewer)\n\
    \n*   [2.6 Summary](#part0008.xhtml_summary)\n\n## 2.1 Add `Next` Button\n\nInstead\
    \ of using `Button` class from built-in JavaFX UI controls, we implement our own\
    \ utilities to design a custom-made button by employing the below classes:\n\n\
    *   [`Group`](#part0008.xhtml_group-as-container)\n\n    Served as the parent\
    \ container.\n\n*   [`Shape`](#part0008.xhtml_shape-class)\n\n    *   [`Rectangle`](#part0008.xhtml_rectangle-as-bounding-box)\n\
    \n        Served as the bounding box.\n\n    *   [`Polygon`](#part0008.xhtml_polygon-as-icon)\n\
    \n        Served as the visual sign of `Next` icon.\n\n*   [`LinearGradient` and\
    \ `Color`](#part0008.xhtml_paint-shape)\n\n    Paints to fill background and to\
    \ stroke border.\n\n*   [`EventHandler` and `MouseEvent`](#part0008.xhtml_event-handler)\n\
    \n    Used for handling mouse entering, clicking, and exiting events.\n\n### 2.1.1\
    \ Use `Group` as Parent Container\n\n`Group` class, resides in `javafx.scene`\
    \ package, is a subclass of `javafx.scene.Parent`. The capability of `Group` is\
    \ straightforward. It allows you to group various nodes together without imposing\
    \ automatic layout. The following snippet of codes shows how to add nodes to a\
    \ `Group`:\n\n```\n Group buttonGroup = new Group();\nRectangle rect = new Rectangle(0,\
    \ 0, 25, 35);\nPolygon polygon = new Polygon();\nbuttonGroup.getChildren().addAll(rect,\
    \ polygon);\n```\n\nLearn more about the characteristics of `Group` in Volume\
    \ Ⅱ: DEVELOPING INTERACTIVE SHAPE DRAWING TOOLS Chapter 1 Line Drawer Section\
    \ 1.1.1 Add Pane as Drawing Board in the Center of BorderPane.\n\n### 2.1.2 Use\
    \ `Shape` Class for Rendering 2D Geometric Primitives\n\nJavaFX provides a very\
    \ enticing class, `Shape`, for rendering 2D geometric primitives. It is an abstract\
    \ class which extends `javafx.scene.Node` class and serves as the base class of\
    \ some of basic forms of 2D geometry. Here are its direct subclasses: `Arc`, `Circle`,\
    \ `CubicCurve`, `Ellipse`, `Line`, `Path`, `Polygon`, `Polyline`, `QuadCurve`,\
    \ `Rectangle`, `SVGPath`, `Text`. The `Shape` class defines common properties\
    \ of 2D geometric primitives, such as `fill`, `stroke`, `strokeType`, `strokeWidth`,\
    \ etc.\n\nIt is very common to set value of `fill` and `stroke` properties respectively\
    \ for a shape. The `setFill` method is used to specify a color to render the background\
    \ of a shape, and `setStroke` method is used to specify a color to render the\
    \ border of a shape. Please notice that the default value of `fill` property is\
    \ `null` for `Line`, `Polyline`, and `Path`, while `Color.BLACK` for the others;\
    \ and default value of `stroke` property is `Color.BLACK` for `Line`, `Polyline`,\
    \ and `Path`, while `null` for the others.\n\nNow we'll show you how to exploit\
    \ capacities of `Shape` to implement our custom-made `Next` button.\n\n### 2.1.3\
    \ Use `Rectangle` Shape as Bounding Box of Custom-Made Button\n\nHere are codes\
    \ to accomplish these: a `Rectangle` is created using the constructor with parameters:\
    \ x, y, width and height, and proper value is set for each desired property.\n\
    \nListing 2-1. Create a `Rectangle` and set value of these properties: `fill`,\
    \ `stroke`, `arcHeight`, `arcWidth`:\n\n```\n Rectangle rect = new Rectangle(0,\
    \ 0, 25, 35);\n\nLinearGradient lg = new LinearGradient(0, 0, 1, 0, true,\n  \
    \      CycleMethod.NO_CYCLE, new Stop[] { \n        new Stop(0, Color.web(\"#5173A8\"\
    )),\n        new Stop(0.6, Color.web(\"#A8B9D4\")),\n        new Stop(1, Color.web(\"\
    #87A7C6\"))});\nrect.setFill(lg);\nrect.setStroke(Color.web(\"#ACD7FF\"));\nrect.setArcHeight(6.5);\n\
    rect.setArcWidth(6.5);\n```\n\nThe following snapshot shows the rendering of a\
    \ `Rectangle` from the above codes:\n\nFigure 2-1. Snapshot of a rounded rectangle\
    \ filled with `LinearGradient` color.\n\n![](Images/image00138.gif \"rounded_rectangle\"\
    )\n\n### 2.1.4 Paint Background and Border of `Shape`\n\n`LinearGradient` and\
    \ `Color`, reside in `javafx.scene.paint` package, are two of direct subclasses\
    \ of `Paint` class, the base class of colors and gradients, for painting background\
    \ and border of a `Shape` or a `Region`.\n\nIn Listing 2-1. we use `LinearGradient`\
    \ to fill the background of a `Rectangle`. The first 4 parameters in the constructor\
    \ of `LinearGradient` specify coordinates of start point and end point for processing\
    \ color gradient. The given value: 0, 0, 1, 0 means the direction of gradient\
    \ is horizontal, starting from (0,0) to (1,0) relative to the top left corner\
    \ of the bounding box of a node. The last parameter is an array of `Stop` objects,\
    \ providing a series of colors. A `Stop` object is instantiated by given an offset\
    \ value and a `Color` object. We pick 3 colors from the extent of blue hues ﹘\
    \ darker blue, bluish white and lighter blue ﹘ to render a gradient.\n\nThere\
    \ are various ways to construct a `Color` object, besides the constructor below:\n\
    \n```\n public Color(double red, double green, double blue, double opacity) \n\
    ```\n\nIn Listing 2-1. we use `Color.web(\"#ACD7FF\")` to paint the border of\
    \ a `Rectangle`. The static method,\n\n```\n public static Color web(java.lang.String\
    \ colorString) \n```\n\nis one of many static methods provided in `Color` class\
    \ for easily creating `Color` objects. These are examples of some of the supported\
    \ format for the colorString parameter, they all create the same color:\n\n```\n\
    \ \"#5173A8\"\n   \"0x5173A8\"\n   \"rgb(81,115,168)\"\n```\n\nThe color string\
    \ \"#5173A8\", or \"0x5173A8\" is the hex representation of RGB value (81, 115,168).\n\
    \nA `Color` has a default alpha value, 1.0, representing completely opaque. You\
    \ can explicitly specify alpha value, in the range of 0.0 to 1.0, when constructing\
    \ a `Color`. An alpha value of 0.0 means the color is completely transparent.\
    \ Here are many ways to create the same color with alpha value 0.5:\n\n```\n Color\
    \ color = Color.rgb(81, 115, 168, 0.5);\nColor color = Color.web(\"#5173A8\",\
    \ 0.5);\nColor color = Color.web(\"rgba(81, 115, 168, 0.5)\");\n```\n\nLearn more\
    \ about the topic of color in later volumes of this book series.\n\n### 2.1.5\
    \ Set Value of `arcHeight` and `arcWidth` Properties to Render Rounded Rectangle\n\
    \n`arcHeight` and `arcWidth` are properties defined in `Rectangle` class, for\
    \ specifying height and width diameters of arcs at four corners of a rectangle\
    \ shape. Their default value is `0.0`.\n\nThe following figure illustrates how\
    \ to set correct value for `arcHeight` and `arcWidth` properties for rendering\
    \ a rounded rectangles. The circles and ellipses, overlapping with the arcs at\
    \ the corner of rounded rectangles, are for easy comparison.\n\nFigure 2-2. Snapshot\
    \ of illustrations of rounded rectangles with circles and ellipses placed at the\
    \ corner of rectangles.\n\n![](Images/image00139.jpeg \"rectangle_examples.jpg\"\
    )\n\n### 2.1.6 Use `Polygon` Shape as Visual Sign of `Next` Icon"
