    \ button clicked: Shufen2009_11 305.jpg\nMouse exited\nScene height changed from\
    \ 400.0 to 501.0\nimageArea height changed from 375.0 to 476.0\nScene width changed\
    \ from 600.0 to 691.0\nimageArea width changed from 600.0 to 691.0\nMouse entered\n\
    Next button clicked: Shufen2010_01 420.jpg\nMouse exited\n```\n\n## 2.6 总结\n\n\
    本章介绍了 JavaFX 库的以下关键方面，按出现顺序列出：\n\n- `Group` 类，位于 `javafx.scene.Group` 包，是 `javafx.scene.Parent`\
    \ 的子类。（参见“将 `Group` 作为容器”章节）\n- `Shape` 类，位于 `javafx.scene.shape` 包，提供了渲染 2D 原形（如矩形、多边形等）的功能。（参见“使用\
    \ `Shape` 渲染 2D 原形”章节）\n- `Rectangle` 类，位于 `javafx.scene.shape` 包，是 `javafx.scene.shape.Shape`\
    \ 的直接子类。它提供了根据属性（如 `x`、`y`、`width`、`height` 等）绘制矩形的功能。（参见“使用 `Shape` 渲染 2D 原形”和“将\
    \ `Rectangle` 作为边界框”章节）\n- `Polygon`，位于 `javafx.scene.shape` 包，是 `javafx.scene.shape.Shape`\
    \ 的直接子类。使用 `getPoints()` 方法获取 `ObservableList<Double>` 类型，然后使用 `Collection` 接口定义的内置工具，将一系列存储在\
    \ `Double` 数组中的 `x` 和 `y` 坐标添加到列表中，这些坐标代表 `Polygon` 的点。（参见“使用 `Shape` 渲染 2D 原形”和“使用\
    \ `Polygon` 作为视觉图标”章节）\n- `LinearGradient` 和 `Color`，位于 `javafx.scene.paint` 包，是\
    \ `Paint` 类的两个直接子类。（参见“`Shape` 的背景和边界”章节）\n- `CycleMethod` 和 `Stop`，位于 `javafx.scene.paint`\
    \ 包，与 `LinearGradient` 和 `RadialGradient` 类配合使用的类：\n    - `CycleMethod`：枚举类型，定义了常量：`CycleMethod.NO_CYCLE`、`CycleMethod.REFLECT`\
    \ 和 `CycleMethod.REPEAT`。\n    - `Stop`：定义了应用于颜色渐变的偏移量和颜色。（参见“将 `Rectangle` 作为边界框”和“`Shape`\
    \ 的背景和边界”章节）\n- `arcHeight` 和 `arcWidth` 是 `Rectangle` 类中定义的属性，用于渲染圆角矩形。（参见“设置\
    \ `arcHeight` 和 `arcWidth` 属性渲染圆角矩形”章节）\n- `Cursor` 类，位于 `javafx.scene` 包并继承 `java.lang.Object`，以\
    \ `Cursor` 类型的静态字段定义了一些实用的鼠标光标，如 `CLOSED_HAND`、`CROSSHAIR`、`HAND`、`OPEN_HAND`、`TEXT`、`WAIT`\
    \ 等。（参见“为 Node 设置 `Cursor` 属性”章节）\n- `EventHandler<T extends Event>`，继承 `java.util.EventListener`\
    \ 的接口，定义了在指定事件发生时调用的 `handle(T event)` 方法。（参见“使用便利方法注册事件处理器以处理鼠标事件”章节）\n- `MouseEvent`，位于\
    \ `javafx.scene.input` 包，是 `javafx.scene.input.InputEvent` 的子类。它定义了事件类型，如 `MOUSE_CLICKED`、`MOUSE_DRAGGED`、`MOUSE_ENTERED`、`MOUSE_EXITED`、`MOUSE_MOVED`、`MOUSE_PRESSED`、`MOUSE_RELEASED`\
    \ 等，并提供了 `getX()`、`getY()` 等方法用于获取事件发生时鼠标的位置。（参见“使用便利方法注册事件处理器以处理鼠标事件”章节）\n- `Node`\
    \ 类提供的某些便利方法，用于注册 `EventHandler` 以处理鼠标事件：\n    ```\n    public final void setOnMouseClicked(EventHandler<?\
    \ super MouseEvent> value)\n    public final void setOnMouseEntered(EventHandler<?\
    \ super MouseEvent> value)\n    public final void setOnMouseExited(EventHandler<?\
    \ super MouseEvent> value)\n    ```\n    （参见“使用便利方法注册事件处理器以处理鼠标事件”章节）\n- `Tooltip`\
    \ 类（位于 `javafx.scene.control` 包并继承 `javafx.scene.control.PopupControl`）提供的 `static\
    \ void install(Node node, Tooltip t)` 方法，用于鼠标悬停在给定 `Node` 上显示帮助帮助。（参见“为 Node 安装\
    \ `Tooltip`”章节）\n- `StackPane` 静态方法，用于自定义指定子节点的布局约束：\n    ```\n    static void\
    \ setAlignment(Node child, Pos value)\n    static void setMargin(Node child, Insets\
    \ value)\n    ```\n    （参见“在 StackPane 中调整 `Next` 按钮的默认位置”和“在 StackPane 中添加 `Previous`\
    \ 按钮并调整其位置”章节）\n- `Pos`，位于 `javafx.geometry` 包，是一个定义位置和对齐常量的枚举类型，如 `CENTER`、`CENTER_RIGHT`、`TOP_RIGHT`\
    \ 等。（参见“在 StackPane 中调整 `Next` 按钮的默认位置”和“在 StackPane 中添加 `Previous` 按钮并调整其位置”章节）\n\
    - `Insets` 类，位于 `javafx.geometry` 包，通常用于 `setMargin` 方法或 `setPadding` 方法，指定矩形区域四边（上、右、下、左）的偏移量。（参见“在\
    \ StackPane 中调整 `Next` 按钮的默认位置”和 prev-button-set-margin-codes）\n- `FileChooser.ExtensionFilter`\
    \ 是 `FileChooser` 类中定义的嵌套类，用于定义过滤器以仅显示扩展匹配给定过滤器的文件。（参见“配置 `FileChooser`”章节）\n\
    - 位于 `javafx.beans.property` 包的一些类：\n    - `ObjectProperty<T>`：抽象类，派自 `javafx.beans.binding.ObjectExpression<T>`\
    \ 类，实现 `Property<T>` 和 `WritableObjectValue<T>`。\n    - `SimpleObjectProperty<T>`：派自\
    \ `ObjectProperty<T>` 类。\n    - `StringProperty`\n\n"
