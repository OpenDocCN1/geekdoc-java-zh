    \ a `MenuBar`, adding it at the top of `BorderPane` which is the root node of\
    \ a scene graph.\n\nGenerally a `MenuBar` object contains multiple `Menu`s laying\
    \ out horizontally, and each `Menu` contains multiple `MenuItem`s. Since `Menu`\
    \ class extends `MenuItem` class, you can place a `Menu` within a `Menu`, the\
    \ nested one is called a submenu. As a `MenuBar` is rendered on a window, what\
    \ a user sees is names of menus only, the content of each menu is hidden until\
    \ the mouse's left button clicked on a menu name, or the mnemonic key combination\
    \ which defined as shortcut keys for the menu is hit.\n\nThe benefits for employing\
    \ menu user interface include the followings:\n\n*   **Require less space**\n\
    \    A menu only occupies the space for its name when it is not in need by a user.\n\
    *   **Organizable capability**\n    To facilitate the accessibility, you organize\
    \ menu items in a tree structure according to functionality, grouping the menu\
    \ items that are alike in a same menu, avoiding overcrowding one menu by means\
    \ of submenus, and placing the more frequently requested menu items in upper levels.\
    \ Usually the most important ones are placed on the top level of the tree.\n*\
    \   **Invoke action by one keystroke**\n    You can use mnemonic mechanism to\
    \ navigate menus within a `MenuBar` and define shortcut keys to enable users to\
    \ invoke the action of a `MenuItem` by one keystroke. For example, press Alt and\
    \ F keys at the same time to show File menu and press Ctrl and S keys at the same\
    \ time to perform save file action.\n\nTo add a `Menu` to a `MenuBar`, first we\
