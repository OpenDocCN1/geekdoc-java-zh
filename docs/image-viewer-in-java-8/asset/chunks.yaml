    \n## 目录\n\n* 关于作者\n* 致谢\n* 前言\n    * 本书的结构\n    * 为什么选择本书\n    * 本书本书准备\n* 引言\n\
    * 第一卷：开发图像查看组件\n    * 第 1 章：基础图像查看器\n        * 1.1 作为 `Application` 的子类创建 `ImageViewer`\
    \ 类\n            * 1.1.1 JavaFX 应用程序线程 vs. Java 启动线程\n            * 1.1.2 捕获图像渲染区域的缩放事件\n\
    \        * 1.2 创建菜单栏\n            * 1.2.1 为菜单栏添加文件菜单\n            * 1.2.2 从文件打开对话框选择图像文件并在\
    \ `StackPane` 上显示图像\n        * 1.3 创建选项菜单和视图子菜单\n            * 1.3.1 创建切换组、单选菜单项并为\
    \ `selectedToggle` 属性添加监听器\n        * 1.4 实现适应宽度、适应高度和原始尺寸查看选项\n            *\
    \ 1.4.1 方法一：分别将 `ImageView` 的 `fitWidth`/`fitHeight` 属性绑定到 `Scene` 的 `width`/`height`\
    \ 属性\n                * 1.4.1.1 实现适应宽度查看选项\n                * 1.4.1.2 实现适应高度查看选项\n\
    \                * 1.4.1.3 实现原始尺寸查看选项\n                * 1.4.1.4 `ImageViewer`\
    \ 类的完整源代码\n            * 1.4.2 方法二：更改 `fitWidth` 属性和 `fitHeight` 属性的值\n      \
    \          * 1.4.2.1 捕获 Scene 的缩放事件以调整图像查看大小\n                * 1.4.2.2 `ImageViewer`\
    \ 类的完整源代码\n        * 1.5 总结\n    * 第 2 章：带有浏览按钮的增强型图像查看器\n        * 2.1 添加“下一页”按钮\n\
    \            * 2.1.1 使用 `Group` 作为父容器\n            * 2.1.2 使用 `Shape` 类渲染 2D 几何原形\n\
    \            * 2.1.3 使用 `Rectangle` 形状作为自定义按钮的边界框\n            * 2.1.4 绘制 `Shape`\
    \ 的背景和边框\n            * 2.1.5 设置 `arcHeight` 和 `arcWidth` 属性值为圆矩形\n          \
    \  * 2.1.6 使用 `Polygon` 形状作为“下一页”图标\n            * 2.1.7 为 `Node` 设置 `Cursor`\
    \ 的值\n            * 2.1.8 注册事件处理器\n            * 2.1.9 完成 `createButton()` 方法\n\
    \            * 2.1.10 为 `Node` 安装 `Tooltip`\n        * 2.2 在 `StackPane` 中调整“下一页”按钮的位置\n\
    \        * 2.3 添加“上一页”按钮并调整其在 `StackPane` 中的位置\n        * 2.4 实现点击事件\n       \
    \     * 2.4.1 配置 `FileChooser`\n            * 2.4.2 使用迭代器遍历目录\n            * 2.4.3\
    \ 在 `ImageViewer` 中定义属性\n        * 2.5 图像查看器 V1.1 的完整源代码\n            * 2.5.1\
    \ `FileUtils` 的完整源代码\n            * 2.5.2 `ImageViewer` 的完整源代码\n        * 2.6\
    \ 总结\n    * 第 3 章：带有幻灯片的增强型图像查看器\n        * 3.1 在 `BorderPane` 底部状态栏\n       \
    \     * 3.1.1 创建作为状态栏的 `HBox` 和显示图像名的 `Text` 节点\n            * 3.1.2 设置 `imageName`\
    \ 属性值\n        * 3.2 改进按钮\n            * 3.2.1 在无图像时禁用按钮\n            * 3.2.2\
    \ 鼠标按下时改变按钮外观\n        * 3.3 添加幻灯片功能\n            * 3.3.1 添加“开始幻灯片”和“停止幻灯片”菜单项\n\
    \                * 3.3.1.2 绑定菜单项的禁用属性\n            * 3.3.2 在另一个线程上执行幻灯片\n    \
    \            * 3.3.2.1 创建自 `Service` 类的 `SlideshowService`\n                *\
    \ 3.3.2.2 配置幻灯片服务对象\n                * 3.3.2.3 为“开始幻灯片”和“停止幻灯片”菜单项实现动作事件处理器\n\
    \            * 3.3.3 `ImageViewer` 应用程序完整的 `start(Stage stage)` 方法\n         \
    \   * 3.3.4 与“加载”菜单项和“上一页”按钮的事件处理器协调\n        * 3.4 在幻灯片间添加淡入切换\n            *\
    \ 3.4.1 `SlideshowService` 类的完整源代码\n        * 3.5 图像查看器 V1.2 的完整源代码\n        *\
    \ 3.6 总结\n* 结语\n\n"
- fmt: "\nShufen Kuo relocated to San Francisco Bay Area in summer of 1988, and has\
    \ been a software engineer ever since. She has extensive hands-on experience with\
    \ various platforms, from PC DOS to numerous Unix/Linux workstations, and from\
    \ PC Linux to PC Windows.\n\nShe started writing Java programs in 2001. She has\
    \ been using `Abstract Windowing Toolkit` (`AWT`) and `Swing`, the GUI Components\
    \ of `Java Foundation Classes` (`JFC`), to develop GUIs for her Java projects\
    \ for years. And since 2012, she has immersed herself in `JavaFX`; exploring its\
    \ essence inspires her to write books publicizing the strength of `JavaFX`.\n\n\
    Before developing Java applications, she had more than 12 years experience in\
    \ the development of `C/C++` applications on UNIX/Linux/Solaris running X Window\
    \ system.\n\nShufen Kuo got her `M.S.` in `Computer Science` from Washington State\
    \ University in 1987.\n\nCurrently, she is developing Java applications with rich\
    \ GUIs using `JavaFX`, as well as writing tutorials about coding in `JavaFX`,\
    \ utilizing her expertise on designing and developing object oriented graphics\
    \ tools.\n\nHer publications include:\n\n* \"A Two-Step String Matching Procedure,\"\
    \ `Pattern Recognition`, 24(7), 711-716, 1991.\n* \"An Improved Algorithm to Find\
    \ the Length of the Longest Common Subsequence of Two Strings,\" `ACM SIGIR Forum`,\
    \ Spring/Summer 1989, Volume 23, Numbers 3-4, 89-99.\n\n### Bing-Chao Huang\n\n\
    Dr. Bing-Chao Huang received his `Ph.D.` in `Computer Science` from Washington\
    \ State University in 1987. He completed an `M.S.` degree in `Computer Science`\
    \ from Stanford University in 1984.\n\nHis publications include:\n\n* `Algorithm\
    \ I` in `D.E. Knuth`'s book \"The Art of Computer Programming,\" Volume 1 Fundamental\
    \ Algorithms, Third Edition (1997), 176-177\n* \"Fast Stable Merging and Sorting\
    \ in Constant Extra Space,\" `The Computer Journal` 35(1992), 643-650\n* \"Stable\
    \ Set and Multiset Operations in Optimal Time and Space,\" `Information Processing\
    \ Letters` 16(1991), 131-136\n* \"Stable Duplicate-Key Extraction with Optimal\
    \ Time and Space Bounds,\" `Acta Informatica` 26(1989), 473-484\n* \"Practical\
    \ In-Place Merging,\" `CACM` 31(1988), 348-352\n* \"Stable Set and Multiset Operations\
    \ in Optimal Time and Space,\" Seventh ACM SIGACT-SIGMOD-SIGART Symposium on Principles\
    \ of Database Systems (1988)\n* \"Practical In-Place Merging,\" `ACM-IEEE/CS Fall\
    \ Joint Computer Conference` (1987)\n* \"A One-Way, Stackless Quicksort Algorithm,\"\
    \ `BIT` 26(1986), 127-130, with `D.E. Knuth`\n* \"An Algorithm for Inverting A\
    \ Permutation,\" `Information Processing Letters` 12(1981), 237-238\n\n# ACKNOWLEDGMENT\n\
    \n| Special thanks to: Dr. Tan and his family, my brother-in-law Dr. Jacob Chung,\
    \ my sister Dr. Shuching Chung, my two cats Mimi & Maomao. |\n| --Shufen Kuo |\n\
    \n# PREFACE\n\n## How this book is organized\n\nThis book is `VOLUME Ⅰ` of the\
    \ book series, `Coding in JavaFX Step by Step Build Graphics Toolkit`. Since contents\
    \ are abundant and unfeasible to be managed into one book, chapters are organized\
    \ among volumes:\n\n### 1. VOLUME Ⅰ: DEVELOPING IMAGE VIEWING COMPONENTS\n* **Chapter\
    \ 1**: Basic Image Viewer\n* **Chapter 2**: Enhanced Image Viewer with Browsing\
    \ Buttons\n* **Chapter 3**: Enhanced Image Viewer with Slide Show Capacity\n\n\
    ### 2. VOLUME Ⅱ: DEVELOPING INTERACTIVE SHAPE DRAWING TOOLS\n* **Chapter 1**:\
    \ Line Drawer\n  Draw lines from mouse events on a drawing board.\n* **Chapter\
    \ 2**: Polyline Drawer\n  Draw polylines from mouse events on a drawing board.\n\
    * **Chapter 3**: Polygon Drawer\n  Draw polygons from mouse events on a drawing\
    \ board.\n* **Chapter 4**: Path Drawer\n  Draw paths from mouse events on a drawing\
    \ board.\n* **Chapter 5**: Quadratic Bézier Curve Drawer\n  Draw paths composed\
    \ of quadratic Bézier curves from mouse events on a drawing board.\n* **Chapter\
    \ 6**: Basic Draw Tool\n  Create integral classes in a package named `drawtool`\
    \ to facilitate developments of various shape drawers -- Rectangle Drawer, Circle\
    \ Drawer and Ellipse Drawer.\n* **Chapter 7**: Enhanced Draw Tool with Predefined\
    \ Drawers\n  Enhance `drawtool` package and implement a variety of drawers, reside\
    \ in `drawtool.drawer` package, containing these predefined shape drawers -- `LineDrawer`,\
    \ `PolylineDrawer`, `PolygonDrawer`, `PathDrawer`, `BazierCurveDrawer`, `RectangleDrawer`,\
    \ `CircleDrawer`, `EllipseDrawer`, and `ShapeMover` -- which are subclasses of\
    \ `ShapeDrawer`.\n* **Chapter 8**: Initial `JFXDrawTools` Application\n  Develop\
    \ initial version of `JFXDrawTools` by integrating with all predefined shape drawers\
    \ as well as utilizing enhanced shape drawing APIs.\n\n### 3. VOLUME Ⅲ: DEVELOPING\
    \ INTERACTIVE REGULAR POLYGON DRAWING TOOLS\n* **Chapter 1**: Enhanced Draw Tool\
    \ with `Regular Polygon` Shape Capacity\n  Introduce `RegularPolygon` class.\n\
    * **Chapter 2**: Enhanced Draw Tool with `Regular Polygon`\n  Introduce `RegularPolygonDrawer`,\
    \ a subclass of `ShapeDrawer`, resides in `drawtool.drawer`.\n* **Chapter 3**:\
    \ Enhanced JFXDrawTools with `Regular Polygon Drawer`\n  Integrate regular polygon\
    \ drawer into `JFXDrawTools`.\n\n### 4. VOLUME Ⅳ: DEVELOPING SKETCH SAVING AND\
    \ LOADING\n* **Chapter 1**: Enhanced Draw Tool with `Draw Writer`\n  Introduce\
    \ `DrawWriter` class, resides in `drawtool.io`.\n* **Chapter 2**: Enhanced Draw\
    \ Tool with `Draw Loader`\n  Introduce `DrawLoader` class, which resides in `drawtool.io`.\n\
    * **Chapter 3**: Enhanced JFXDrawTools with `Draw Writer` and `Draw Loader`\n\
    \  Integrate sketch saving and loading capabilities into `JFXDrawTools`.\n\n###\
    \ 5. AND THE OTHERS\nA **Summary** section is available at the end of each chapter;\
    \ it lists all the key aspects of JavaFX library featured in the chapter. Here\
    \ are some of essentials:\n* `Shape` class in `javafx.scene.shape` for 2D geometric\
    \ primitives.\n* `FXML`, a markup language which complies with `XML` format, to\
    \ build GUIs.\n* Properties and binding mechanism.\n* `Image` class and `ImageView`\
    \ class to load and display images.\n* Concurrency capacity in `javafx.concurrent`\
    \ package.\n* `FadeTransition` and `ParallelTransition` applied onto image objects\
    \ in a slideshow function.\n* Build-in layout panes in `javafx.scene.layout` package.\n\
    \n## Reusable Classes with Applications and Complete Source Codes\n\nComplete\
    \ source codes of a set of packages with reusable classes as well as embeddable\
    \ Java applications are included in the book series.\n\nThe following tables list\
    \ all the source codes offered in the prior four volumes:\n\n### Drawing Tools\n\
    \n| Package Name | Source Code File Name |\n| --- | --- |\n| drawtool | `ShapeDrawer.java`,\
    \ `DrawPane.java` |\n| drawtool.drawer | `BezierCurveDrawer.java`, `CircleDrawer.java`,\
    \ `EllipseDrawer.java`, `LineDrawer.java`, `PathDrawer.java`, `PolygonDrawer.java`,\
    \ `PolylineDrawer.java`, `RectangleDrawer.java`, `RegularPolygonDrawer.java`,\
    \ `RubberBander.java`, `ShapeMover.java` |\n| drawtool.shape | `RegularPolygon.java`\
    \ |\n| drawtool.io | `DrawClipper.java`, `DrawLoader.java`, `DrawWriter.java`\
    \ |\n\n### Graphics Applications\n\n| Package Name | Source Code File Name |\n\
    | --- | --- |\n| imageviewer | `FileUtils.java`, `ImageViewer.java`, `SlideshowService.java`\
    \ |\n"
