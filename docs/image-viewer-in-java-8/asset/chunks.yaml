    \n    stage.setTitle(\"ImageViewer V1.01\");\n    stage.setScene(scene);\n   \
    \ stage.show();\n  }\n\n  public static void main(String[] args) {\n    launch(args);\n\
    \  }\n}\n```\n\n请注意，方法一将版本号从 V1.0 升级到了 V1.01。\n\n编译并运行应用程序。按照如下方式测试查看选项：首先，加载一个小图像，反复选择所有查看选项，同时使用鼠标拖动窗口边缘或角来动态调整窗口大小。然后，加载较大的图像再次测试所有可能的标准。\n\
    \n图 1-7。原始大小的图像渲染（320 像素 x 363 像素）。\n(Images/image00130.jpeg)\n\n图 1-8。缩放以适应场景宽度的图像。\n\
    (Images/image00131.jpeg)\n\n图 1-9。缩放以适应场景高度可用查看空间的图像。\n(Images/image00132.jpeg)\n\
    \n### 1.4.2 方法二：更改 `fitWidth` 属性和 `fitHeight` 属性的值\n\n`ImageView` 类提供了两个属性，允许我们缩放图像查看尺寸：\n\
    \n*   `fitWidth`\n\n*   `fitHeight`\n\n要更改这两个属性的值，我们我们使用 `setFitWidth` 方法和 `setFitHeight`\
    \ 方法。\n\n如果选择了 `Fit Width` 查看选项，查看宽度将根据当前场景宽度进行设置。以下是代码片段：\n\n列表 1-17. 调用 `setFitWidth`\
    \ 方法使图像查看宽度与场景宽度相同：\n\n"
- fmt: "\n```\nimageView.setFitWidth(scene.getWidth());\n// Besides setFitWidth, must\
    \ also set fit height to 0\nimageView.setFitHeight(0);\n```\n\nIf `Fit Height`\
    \ viewing option is selected, the viewing height will be set in accordance with\
    \ the current height of scene, subtracting the height of menu bar. Here's snippet\
    \ of code:\n\nListing 1-18. Call `setFitHeight` method to set the image viewing\
    \ height same as the height of scene minus the height of menu bar:\n\n```\n imageView.setFitHeight(scene.getHeight()\
    \ - menuBar.getHeight());\n// Besides setFitHeight, must also set fit width to\
    \ 0 \nimageView.setFitWidth(0); \n```\n\nIf `Original Size` option is selected,\
    \ we need to clear values set previously by giving `0` as value to both `fitWidth`\
    \ property and `fitHeight` property. Here's the snippet of codes:\n\nListing 1-19.\
    \ Call `setFitHeight` and `setFitHeight` methods, given `0` as the value:\n\n\
    ```\n // Clear previous set value\nimageView.setFitWidth(0);\nimageView.setFitHeight(0);\n\
    ```\n\nThe following codes show the implementation of approach two so far.\n\n\
    Listing 1-20. Listen to the change of selection for radio menu items in toggle\
    \ group, adjust values for `fitWidth` and `fitHeight` properties of image view:\n\
    \n```\n // Listen to the change of selection in the toggle group\ngroupOption.selectedToggleProperty().addListener(new\
    \ ChangeListener<Toggle>() {\n  public void changed(ObservableValue<? extends\
    \ Toggle> ov,\n          Toggle old_toggle, Toggle new_toggle) {\n    if (groupOption.getSelectedToggle()\
    \ != null) {\n      RadioMenuItem choiceItem = (RadioMenuItem) groupOption.getSelectedToggle();\n\
    \      if (choiceItem == fitWidth) {\n        imageView.setFitWidth(scene.getWidth());\n\
    \        // Besides setFitWidth, must also set fit height to 0\n        imageView.setFitHeight(0);\n\
    \      } else if (choiceItem == fitHeight) {\n        imageView.setFitHeight(scene.getHeight()\
    \ - menuBar.getHeight());\n        // Besides setFitHeight, must also set fit\
    \ width to 0 \n        imageView.setFitWidth(0); \n      } else {\n        //\
    \ Clear previous set value\n        imageView.setFitWidth(0);\n        imageView.setFitHeight(0);\n\
    \      }\n    } \n  }\n}); \n```\n\n### 1.4.2.1 Catch Resize Event of Scene to\
    \ Adjust Viewing Size of Image\n\nTo complete approach two, there is one more\
    \ issue to be resolved: the viewing size of image is subject to the size of scene,\
    \ initially set to 600 pixels by 400 pixels, which might be changed dynamically.\
    \ When a user drags the edge or corner of the application window, the scene is\
    \ resized. We need to catch this resize event to adjust the viewing size of an\
    \ image accordingly. That is, if current selected viewing option is `Fit Width`,\
    \ the new width of scene will be adopted as the value of `fitWidth` property of\
    \ the image view object. And, if `Fit Height` is the selected one, the new height\
    \ of scene minus height of menu bar will be adopted as the value of `fitHeight`\
    \ property.\n\nTo response to the change of scene's size, we add a listener for\
    \ `width` property and `height` property respectively to catch the resize event\
    \ of scene.\n\nThe following snippets of codes accomplish these tasks:\n\nListing\
    \ 1-21. Listen to the change of scene's `width` and `height`, adjust `fitWidth`\
    \ and `fitHeight` of an image view:\n\n```\n // Listen to the width change of\
    \ scene and adjust fitWidth of image view\nscene.widthProperty().addListener(new\
    \ ChangeListener<Object>() {\n  public void changed(ObservableValue o, Object\
    \ oldVal, Object newVal) {\n    if (fitWidth.isSelected()) {\n      imageView.setFitWidth((double)newVal);\n\
    \    }\n  }\n});\n// Listen to the height change of scene and adjust fitHeight\
    \ of image view   \nscene.heightProperty().addListener(new ChangeListener<Object>()\
    \ {\n  public void changed(ObservableValue o, Object oldVal, Object newVal) {\n\
    \    if (fitHeight.isSelected()) {\n      imageView.setFitHeight((double) newVal\
    \ - menuBar.getHeight());\n    }\n  }\n});\n```\n\n### 1.4.2.2 Complete Source\
    \ Codes of `ImageViewer` Class\n\nComplete source codes of `ImageViewer` class\
    \ for Approach Two become these:\n\nListing 1-22. Complete source codes of `ImageViewer`\
    \ become as follows:\n"
