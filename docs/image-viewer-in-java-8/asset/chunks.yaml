    \ * 选择图像文件，在图像渲染区域加载并显示图像。\n * \n * 创建选项（Option）菜单，包含一个视图（View）子菜单，让用户选择图像查看\n\
    \ * 标准：适应宽度（Fit Width）、适应高度（Fit Height）或默认选项原始大小（Original Size）。\n *\n * 使用 bind\
