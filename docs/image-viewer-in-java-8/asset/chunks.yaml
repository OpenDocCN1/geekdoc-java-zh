    \ Open Dialog and Display Image on StackPane\n\nTo navigate a file system, we\
    \ use `FileChooser` class which provides a convenient method, `showOpenDialog(Window\
    \ owner)` for choosing a file to open.\n\nThe action of `Load` menu item is to\
    \ browse the local file system, select an image file and display the image on\
    \ image area.\n\nThe `setOnAction(EventHandler<ActionEvent> value)` method, provided\
    \ in `MenuItem` class, is used to add an event handler to handle `ActionEvent`\
    \ of `Load` menu item. \n\nIn order to load and display images, we use `ImageView`\
    \ class in association with `Image` class. `Image` class loads an image given\
    \ a url in type of `String`, and `ImageView` class displays the image on an image\
