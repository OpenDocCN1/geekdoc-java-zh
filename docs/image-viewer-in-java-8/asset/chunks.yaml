    \    final FileChooser fileChooser = new FileChooser();\n    fileChooser.setTitle(\"\
    Open an Image File\");\n\n    // Create image view, add to image area\n    final\
    \ ImageView imageView = new ImageView();\n    imageArea.getChildren().add(imageView);\n\
    \n    // Add action for menu item Load\n    load.setOnAction(new EventHandler<ActionEvent>()\
    \ {\n      @Override\n      public void handle(ActionEvent e) {\n        // Open\
    \ FileChooser dialog\n        File file = fileChooser.showOpenDialog(stage);\n\
    \        if (file != null) {\n          String url = file.toURI().toString();\n\
    \          Image image = new Image(url);\n          imageView.setImage(image);\n\
    \        }\n      }\n    });\n\n    stage.setTitle(\"ImageViewer V1.0\");\n  \
    \  stage.setScene(scene);\n    stage.show();\n  }\n\n  public static void main(String[]\
    \ args) {\n    launch(args);\n  }\n}\n```\n\nCompile and run the application.\
    \ Click `Load` menu item in `File` menu, navigate to a directory that contains\
    \ image files, select an image file, click `Open` button in `FileChooser`'s Open\
    \ Dialog, the image file will be loaded and displayed in the center of application\
    \ window.\n\nFigure 1-2. Snapshot of menu bar with `File` menu when it is clicked\n\
    \nFigure 1-3. Snapshot of selecting an image file from file chooser\n\nFigure\
    \ 1-4. Snapshot of displaying a small size image in the center\n\nFigure 1-5.\
    \ Snapshot of displaying a large size image in the center\n\n## 1.3 Create Option\
    \ Menu and View Submenu\n\nWe need an `Option` menu allowing a user to choose\
    \ preferred viewing criteria. The `Option` Menu contains a `View` submenu which\
    \ contains three mutually exclusive choices, they are as follows:\n\n`Fit Width`:\
    \ Render an image on an area by scaling `fitWidth` property of an `ImageView`,\
    \ while preserving original width/height ratio, to fit the width of current available\
    \ image viewing space.\n\n`Fit Height`: Render an image on an area by scaling\
    \ `fitHeight` property of an `ImageView`, while preserving original width/height\
    \ ratio, to fit the height of current available image viewing space.\n\n`Original\
    \ Size`: Render an image in its original size, the outer portion of image that\
    \ exceeds the boundary of current available viewing space will be blocked. This\
    \ is set as the initial viewing option.\n\nPlease note that the available image\
    \ viewing space is determined by current width and height of the application window,\
    \ called a `Stage`, which subsequently is subject to the current size of a `Scene`,\
    \ the container of a scene graph. Initially the scene is set to 600 pixels by\
    \ 400 pixels, thus, the size of available image rendering space will be same as\
    \ the size of the scene. After we added a menu bar at the top of `BorderPane`,\
    \ which is the root node of the scene, the height of available image rendering\
    \ space becomes height of scene minus height of menu bar, while the width remains\
    \ the same.\n\n### 1.3.1 Create Toggle Group, Radio Menu Items and Add Listener\
    \ for `selectedToggle` Property\n"
