  trans: "\n\n我们没有使用图像作为 `Next` 按钮的视觉标识，而是实例化了一个箭头形状的 `Polygon`。使用 `getPoints()` 方法获取一个类型为\
    \ `ObservableList<Double>` 的列表，然后使用 `Collection` 接口中定义的内置工具类来操作列表内容。存储在 `Double`\
    \ 类型值数组中的一系列 x 和 y 坐标被添加到列表中，代表 `Polygon` 的顶点。\n\n`Color.WHITE` 是 `Color` 类中定义的许多\
    \ `Color` 类型的静态字段之一，我们选择它作为填充 `Polygon` 背景的颜色，并使用静态方法 `Color.web` 创建了一种深蓝色的颜色，用以绘制\
    \ `Polygon` 的边框颜色。\n\n以下是完成这些任务的代码段：\n\nListing 2-2. 创建一个 `Polygon` 并为属性 `fill`\
    \ 和 `stroke` 赋值：\n\n```\n Polygon polygon = new Polygon();\nDouble[] dArray =\
    \ {\n      5.0, 2.0,\n      22.0, 17.0,\n      5.0, 32.0,\n      5.0, 25.0,\n\
    \      14.0, 17.0,\n      5.0, 9.0};\npolygon.getPoints().addAll(dArray);\npolygon.setFill(Color.WHITE);\n\
    polygon.setStroke(Color.web(\"#436B8B\"));\n```\n\n下面的快照显示了上述代码渲染的 `Polygon`：\n\
    \n图 2-3. 作为 `Next` 图标的多边形快照。\n\n![](img/image00140.jpeg \"next_polygon.jpg\")\n\
    \n### 2.1.7 为 `Node` 设置 `Cursor` 属性值\n\n`Node` 类定义的 `cursor` 允许你更改此节点及其所有后代节点的鼠标指针。`Cursor`\
    \ 类位于 `javafx.scene` 包中并继承自 `java.lang.Object`，它通过 `Cursor` 类型的静态字段定义了一些可选鼠标指针，例如\
    \ `CLOSED_HAND`、`CROSSHAIR`、`DEFAULT`、`HAND`、`OPEN_HAND`、`TEXT`、`WAIT` 等。如果没有显式设置\
    \ `cursor` 属性的值，则使用默认的鼠标指针（箭头形状）。\n\n我们使用 `Cursor.OPEN_HAND` 作为 `Next` 按钮的鼠标指针。以下是代码段：\n\
    \n```\n Group buttonGroup = new Group();\nbuttonGroup.setCursor(Cursor.OPEN_HAND);\n\
    ```\n\n### 2.1.8 使用便利方法注册事件处理器以处理鼠标事件\n\n`EventHandler<T extends Event>` 是继承自\
    \ `java.util.EventListener` 的接口，它定义了 `handle(`T` 事件) 方法，用于在指定事件发生时被调用。\n\n我们将使用\
    \ `Node` 类提供的便利方法来注册事件处理器，以处理鼠标事件类型，如 `MOUSE_CLICKED`、`MOUSE_ENTERED` 和 `MOUSE_EXITED`，这些是\
    \ `MouseEvent` 类（`javafx.scene.input.InputEvent` 的子类）中定义的 `EventType` 静态字段。\n\n\
    以下是用于为上述事件注册事件处理器的便利方法：\n\n* `public final void setOnMouseClicked(EventHandler<?\
    \ super MouseEvent> value)`\n    设置 `Node` 类中定义的 `OnMouseClicked` 属性的值，提供 `handle`\
    \ 方法的实现，该方法在鼠标点击此节点时被调用。\n\n* `public final void setOnMouseEntered(EventHandler<?\
    \ super MouseEvent> value)`\n    设置 `Node` 类中定义的 `OnMouseEntered` 属性的值，提供 `handle`\
    \ 方法的实现，该方法在鼠标进入此节点时被调用。\n\n* `public final void setOnMouseExited(EventHandler<?\
    \ super MouseEvent> value)`\n    设置 `Node` 类中定义的 `OnMouseExited` 属性的值。提供 `handle`\
    \ 方法的实现，该方法在鼠标离开此节点时被调用。\n\n以下是显示这些便利方法用的代码段：\n\nListing 2-3. 使用便利方法注册事件处理器：\n\
    \n```\n // 注册鼠标点击事件处理器\n    buttonGroup.setOnMouseClicked(new EventHandler<MouseEvent>()\
    \ {\n      @Override\n      public void handle(MouseEvent me) {\n        System.out.println(\"\
    Mouse clicked\");\n      }\n    });\n\n    // 注册鼠标进入事件处理器\n    // 当鼠标进入时改变按钮的外观\n\
    \    buttonGroup.setOnMouseEntered(new EventHandler<MouseEvent>() {\n      @Override\n\
    \      public void handle(MouseEvent me) {\n        System.out.println(\"Mouse\
    \ entered\");\n        rect.setFill(lgEntered);\n        polygon.setFill(Color.web(\"\
    #436B8B\"));\n        polygon.setStroke(Color.WHITE);\n      }\n    });\n\n  \
    \  // 注册鼠标离开事件处理器\n    // 当鼠标离开时恢复原始外观\n    buttonGroup.setOnMouseExited(new EventHandler<MouseEvent>()\
    \ {\n      @Override\n      public void handle(MouseEvent me) {\n        System.out.println(\"\
    Mouse exited\");\n        rect.setFill(lg);\n        polygon.setFill(Color.WHITE);\n\
    \        polygon.setStroke(Color.web(\"#436B8B\"));\n      }\n    }); \n```\n\n\
    ### 2.1.9 `createNextButton()` 方法的完整源代码\n\n导入语句：\n\n```\n import javafx.scene.Cursor;\n\
    import javafx.scene.Group;\nimport javafx.scene.Node;\nimport javafx.scene.control.Tooltip;\n\
    import javafx.scene.input.MouseEvent;\nimport javafx.scene.color.Color;\nimport\
    \ javafx.scene.shape.Polygon;\nimport javafx.scene.shape.Rectangle;\nimport javafx.scene.layout.Group;\n\
    import javafx.scene.event.EventHandler;\nimport javafx.scene.event.MouseEvent;\n\
    ```\n\n"
- fmt: "\n`Tooltip` class, resides in `javafx.scene.control` package and extends `javafx.scene.control.PopupControl`\
    \ class, is one of fundamental UI components for showing help information about\
    \ a node when mouse hovers on it.\n\nIf a node is one of UI controls such as a\
    \ `Button`, then you can set value of `tooltip` property, defined in `javafx.scene.control.Control`\
    \ class, for the node. Here's the `setTooltip` method:\n\n```\n public final void\
    \ setTooltip(Tooltip value) \n```\n\nSince the `Next` button is a custom-made\
    \ node acting like a button, not derived from `javafx.scene.control.Control` class,\
    \ we'll use `install` method, provided in `Tooltip` class, to associate a `Tooltip`\
    \ with the `Next` button. Here's the `install` method:\n\n```\n public static\
    \ void install(Node node, Tooltip t) \n```\n\nThe following snippets of codes\
    \ show the creation of a `Next` node by calling `createNextButton()` method, install\
    \ a `Tooltip` for the node, and add it to the children list of a `StackPane` which\
    \ is the image rendering area.\n\nImport Statement:\n\n```\n import javafx.scene.control.Tooltip;\n\
    ```\n\nListing 2-5. Create a `Next` button, install a `Tooltip` and add the node\
    \ to image rendering area:\n\n```\n final Node nextButton = createNextButton();\n\
    \n...\n\n// Install tooltip\nTooltip t = new Tooltip(\"Next Image\");\nTooltip.install(nextButton,\
    \ t);\n// Add next button to stack pane\nimageArea.getChildren().add(nextButton);\n\
    ```\n\nThe following snapshots show a `Next` button laid out in its default location,\
    \ the center of a `StackPane`.\n\nFigure 2-4. Snapshot of a `Next` button placed\
    \ in the default position.\n\n![](Images/image00141.gif \"next_button_center1.gif\"\
    )\n\nFigure 2-5. Snapshot of a `Next` button placed in the default position, it\
    \ is taken as mouse entered the button, the filled color gradient of a rectangle\
    \ is changed and the installed tooltip is popped up.\n\n![](Images/image00142.gif\
    \ \"next_button_center2.gif\")\n\n(Figures 2-1 to 2-5 are snapshots of applications\
    \ using jdk1.7.0_25 in Windows XP; the rest are using jdk1.8.0_66 in Windows 8.1)\n\
    \n## 2.2 Adjust `Next` Button's Default Position in `StackPane`\n\nIn this section,\
    \ we will demonstrate how to place a child node of a `StackPane` in the desired\
    \ location.\n\nA `StackPane` places all its children in a stack with the center\
    \ as default alignment. That is, by default StackPane's children overlap each\
    \ other in the center of the pane.\n\nPlacing a `Next` button in the center of\
    \ a `StackPane` is not feasible in our application. Fortunately, `StackPane` provides\
    \ two static methods:\n\n```\n public static void setAlignment(Node child, Pos\
    \ value)\npublic static void setMargin(Node child, Insets value)\n```\n\nallowing\
    \ us to adjust individual child node's position. The preferred position of a `Next`\
    \ button is on the right side of the window, within the visible boundary of a\
    \ scene. The following snippets of codes adjust the default location of a next\
    \ button.\n\nImport Statement:\n\n```\n import javafx.geometry.Insets;\nimport\
    \ javafx.geometry.Pos;\n```\n\nListing 2-6. Use `StackPane`'s static Methods `setAlignment`\
    \ and `setMargin` to adjust the default position of a `Next` button:\n\n```\n\
    \ StackPane.setAlignment(nextButton, Pos.CENTER_RIGHT);\n  StackPane.setMargin(nextButton,\
    \ new Insets(8));\n```\n\nThe following snapshot shows a `Next` button positioned\
    \ on the right side of application window.\n\nFigure 2-6. Snapshot of a `Next`\
    \ button on the right side of window, within the visible boundary of a scene.\n\
    \n![next_button_right.jpg](Images/image00143.jpeg \"next_button_right.gif\")\n\
    \nRemember that, we set minimum size of `StakePane` to (0, 0) to avoid the automatic\
    \ changing of its size, by its child node `ImageView`. Failure to do so may lead\
    \ to complex situation regarding the position of `Next` button whenever an image\
