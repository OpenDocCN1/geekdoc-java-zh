    \ 和 `Stop Slideshow` 菜单项实现动作事件的事件处理器\n\n执行 `Start Slideshow` 操作的场景如下：当用户点击 `Start\
    \ Slideshow` 菜单项时，服务被启动，其状态从 `READY` 变为 `SCHEDULED`，再变为 `RUNNING`。一旦状态切换到 `RUNNING`，`isSlideshowOn`\
    \ 属性的值就会更改为 `true`（参见此处），并且结果是 `Stop Slideshow` 菜单项的禁用状态被更改为 `false`（参见此处）。\n\n\
    我们使用 `Service` 类中提供的 `void start()` 方法来启动服务。该方法是从处理 `Start Slideshow` 菜单项动作事件的事件处理器中调用的。在调用\
    \ `start()` 方法之前检查服务的状态是非常重要的，以确保服务处于 `READY` 状态。\n\n在 `javafx.concurrent.Worker`\
    \ 接口中定义的 `Worker.State getState()` 方法用于检查服务的状态。只有当服务处于 `READY` 状态时，才能成功启动服务。如果它未就绪，请先重置，然后启动服务。\n\
    \n以下是执行这些操作的代码片段：\n\n```java\n startSlide.setOnAction(new EventHandler<ActionEvent>()\
    \ {\n      @Override\n      public void handle(ActionEvent ae) {\n        System.out.println(\"\
    Start Slideshow...\");\n        if (service.getState() != Worker.State.READY)\n\
    \          service.reset(); // transit to READY\n        service.start();\n  \
    \    }\n    });\n```\n\n用户可以在幻灯片服务运行时运行时取消幻灯片。`boolean cancel()` 方法是从处理 `Stop\
    \ Slideshow` 菜单项动作事件的事件处理器中调用的。\n\n以下代码演示了如何为 `Start Slideshow` 和 `Stop Slideshow`\
    \ 菜单项实现动作事件的事件处理器。\n\n导入语句：\n\n```java\n import javafx.concurrent.Worker;\n```\n\
    \n列表 3-17. 为 `Start Slideshow` 和 `Stop Slideshow` 菜单项实现动作事件的事件处理器：\n\n```java\n\
    \ startSlide.setOnAction(new EventHandler<ActionEvent>() {\n      @Override\n\
    \      public void handle(ActionEvent ae) {\n        System.out.println(\"Start\
    \ Slideshow...\");\n        if (service.getState() != Worker.State.READY)\n  \
    \        service.reset(); // transit to READY\n        // 如果最后点击的按钮是上一个按钮，\n \
    \       // 则下一个图像是当前图像，\n        // 必须在启动服务之前将光标向前移动一步\n        if (lastClickedButton.get().equals(PREVIOUS)\
    \ &&\n            listIterator.get().hasNext()) {\n          listIterator.get().next();\n\
    \        }\n        service.start();\n      }\n    });\n    stopSlide.setOnAction(new\
    \ EventHandler<ActionEvent>() {\n      @Override\n      public void handle(ActionEvent\
    \ ae) {\n        System.out.println(\"Stop Slideshow...\");\n        service.cancel();\n\
    \      }\n    }); \n```\n\n### 3.3.3 ImageViewer 应用程序完整的 `start(Stage stage)`\
    \ 方法\n\n接的列表显示了此阶段 `ImageViewer` V1.2 完整的 `start` 方法，更改部分已用**粗体**字体标记。\n\n列表 3-18.\
    \ `ImageViewer` V1.2 的 `start` 方法如下：\n\n"
