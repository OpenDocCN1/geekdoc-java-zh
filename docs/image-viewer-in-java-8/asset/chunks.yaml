    \ nodes of sorts. A node is either a parent (a node with children) or a leaf (a\
    \ node without children); each node can have only one parent, and the root node\
    \ has no parent. All nodes in a scene graph are derived from `javafx.scene.Node`\
    \ class.\n\nFor quickly catch the essential about the types of nodes in a scene\
    \ graph, we'll differentiate them by the ability to add children or not.\n\n*\
    \   You may add children to these nodes:\n\n    The following classes are frequently\
