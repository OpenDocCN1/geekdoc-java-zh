    \            // 必须将光标向后移动一步\n            if (iterator.hasPrevious())\n       \
    \       path = iterator.previous();\n            else{\n              // 有上一个图像，禁用上一个按钮\n\
    \              disableButton(prevButton, true);\n              return;\n     \
    \       }\n          }\n          System.out.format(\"Prev button clicked: %s%n\"\
    , path.getFileName());\n          String url = path.toUri().toString();\n    \
    \      curImage.set(new Image(url));\n          imageName.set(url.substring(\n\
    \              url.lastIndexOf(\"/\")+1).replaceAll(\"%20\", \" \"));\n\n    \
    \      lastClickedButton.set(PREVIOUS);\n          // 当没有上一个图像时禁用上一个按钮\n     \
    \     disableButton(prevButton, !iterator.hasPrevious());\n          if (nextButton.isDisabled())\
    \ \n            disableButton(nextButton, false); \n        }\n      }\n    });\n\
    \n    registerButtonEvent(buttonGroup, rect, polygon, lg, lgEntered, lgPressed);\n\
    \n    buttonGroup.getChildren().addAll(rect, polygon);\n    return buttonGroup;\n\
    \  }\n```\n"
- fmt: "\n![](Images/image00156.jpeg \"next_button_pressed.jpg\")\n\n## 3.3 Add Slide\
    \ Show Capabilities\n\nOnce an image file is opened from a `FileChooser`'s File\
    \ Open Dialog, the application obtains a list of image files that exist in the\
    \ current directory. One favorable feature is to allow users to browse over these\
    \ images one by one without manually clicking the `Next` button. The steps to\
    \ implement slide show mechanism are illustrated as follows.\n\n### 3.3.1 Add\
    \ `Start Slideshow` and `Stop Slideshow` Menu Items\n\nThe simplest GUI employed\
    \ here is `MenuItem`. Two menu items, `Start Slideshow` and `Stop Slideshow`,\
    \ are added to `Option` menu of a menu bar, initially they are both disabled.\
    \ To distinguish if there is a slide show running or not, a variable `isSlideshowOn`\
    \ of type `BooleanProperty` is defined as class field of `ImageViewer` class and\
    \ is initialized to `false`. The following snippets of codes show how to accomplish\
    \ these:\n\nImport Statements:\n\n```\n import javafx.beans.property.BooleanProperty;\n\
    import javafx.beans.property.SimpleBooleanProperty;\n```\n\nListing 3-14. Add\
    \ `Start Slideshow` and `Stop Slideshow` menu items:\n\n```\n public class ImageViewer\
    \ extends Application {\n\n    ...\n\n  final BooleanProperty isSlideshowOn =\
    \ new SimpleBooleanProperty(false);\n\n    ...\n\n  @Override\n  public void start(final\
    \ Stage stage) {\n\n    ...\n\n    // Create start/stop slideshow menu items\n\
    \    final MenuItem startSlide = new MenuItem(\"Start Slideshow\");\n    final\
    \ MenuItem stopSlide = new MenuItem(\"Stop Slideshow\");\n\n    startSlide.disableProperty().bind(isSlideshowOn.or(\n\
    \        nextButton.disableProperty()));\n    stopSlide.disableProperty().bind(isSlideshowOn.not().or(\n\
    \        nextButton.disableProperty()));\n\n    // Add action handler for Start\
    \ Slideshow menu item\n    startSlide.setOnAction(new EventHandler<ActionEvent>()\
    \ {\n      @Override\n      public void handle(ActionEvent ae) {\n        System.out.println(\"\
    Start Slideshow...\");\n      }\n    });\n\n    // Add action handler for Stop\
    \ Slideshow menu item\n    stopSlide.setOnAction(new EventHandler<ActionEvent>()\
    \ {\n      @Override\n      public void handle(ActionEvent ae) {\n        System.out.println(\"\
    Stop Slideshow...\");\n      }\n    });    \n\n    // Add option menu to menu\
    \ bar\n    menuOption.getItems().addAll(menuView, startSlide, stopSlide);\n\n\
    \      ... \n```\n\n#### 3.3.1.1 Bind Disable Property of Menu Item\n\nInitially\
    \ `startSlide` and `stopSlide` menu items are disabled because of the following\
    \ `bind` statements:\n\n```\n startSlide.disableProperty().bind(isSlideshowOn.or(\n\
    \        nextButton.disableProperty()));\n    stopSlide.disableProperty().bind(isSlideshowOn.not().or(\n\
    \        nextButton.disableProperty())); \n```\n\nIn above binding statements,\
    \ two logical operations--`or` and `not`--are used to compute value for disable\
    \ property. The `javafx.beans.binding.BooleanExpression` class, an abstract class\
    \ that implements `ObservableBooleanValue`, provides these methods:\n\n`public\
    \ BooleanBinding not()` method\n\nperforms a logical NOT operation on this `BooleanExpression`,\
    \ and returns an object of type `BooleanBinding` which is a direct subclass of\
    \ `BooleanExpression`.\n\n`public BooleanBinding or(ObservableBooleanValue other)`\
    \ method\n\nperforms a logical OR operation on this `BooleanExpression` and a\
    \ given `ObservableBooleanValue`, and returns an object of type `BooleanBinding`\
    \ which is a direct subclass of `BooleanExpression`.\n\nThe `Start Slideshow`\
    \ menu item is disabled if either a slide show is currently running or the `Next`\
    \ button is disabled. Similarly, the `Stop Slideshow` menu item is disabled if\
    \ either a slide show is not running or the `Next` button is disabled. Remember\
    \ that the `Next` button is disabled when there is no next image to view.\n\n\
    Figure 3-9. Snapshot of initial `Option` menu's appearance, both `Start Slideshow`\
    \ and `Stop Slideshow` menu items are disabled.\n\n![](Images/image00157.jpeg\
    \ \"start_stop_disabled.jpg\")\n\nFigure 3-10. Snapshot of `Option` menu's appearance\
    \ after an image file is loaded, `Start Slideshow` menu item is enabled because\
    \ a slide show is not on and there is at least one next file to view, and `Stop\
    \ Slideshow` menu item is disabled because a slide show is not on.\n\n![](Images/image00158.jpeg\
    \ \"start_slideshow_enabled.jpg\")\n\n### 3.3.2 Execute Slide Show on Another\
    \ Thread\n\nIt's a good programming practice to delegate a long-running task to\
    \ another thread so that the UI thread (also called Java FX Application thread)\
    \ is always responsive to user's actions.\n\n`javafx.concurrent` package provides\
    \ classes, `Task` and `Service` both of which implement `Worker` interface, for\
    \ developing multi-threaded JavaFX applications with ease.\n\nHere are classes\
    \ for concurrency, reside in `javafx.concurrent` package:\n\n`Task`\n\nAn abstract\
    \ class that extends `java.util.concurrent.FutureTask` and implements `Worker<V>`\
    \ interface, is a one-time `Worker` object, cannot be reused. It's also a `Runnable`\
    \ object since its superclass `FutureTask` implements `Runnable` interface.\n\n\
    To start executing a `Task`, you use either APIs from `java.lang.Thread` class\
    \ or APIs that are derived from `Executor` and `ExecutorService` interfaces, both\
    \ reside in `java.util.concurrent` package.\n\n`Service`\n\nAn abstract class\
    \ that extends `java.lang.Object` and implements `Worker<V>` interface, is a reusable\
    \ `Worker` object. The `Service` class provides methods such as `start()`, `cancel()`,\
    \ `reset()`, and `restart()` to manipulate this service when needed.\n\n`ScheduledService`\n\
    \nA direct subclass of `Service`, allows specifying the duration of delay to start\
    \ and restart a service automatically.\n\n`WorkerStateEvent`\n\nA subclass of\
    \ `javafx.event.Event`, defines static fields of `EventType`s such as `WORKER_STATE_CANCELLED`,\
    \ `WORKER_STATE_FAILED`, `WORKER_STATE_READY`, `WORKER_STATE_RUNNING`, `WORKER_STATE_SUCCEEDED`,\
    \ etc. A `WorkerStateEvent` occurs when the state of a `Worker` is changed.\n\n\
    Consider our situation: a file list is created when a file is first loaded, suppose\
    \ the file list contains one or more next file(s) to view, then the `Start Slideshow`\
    \ menu item is enabled, a user can start a slide show, cancel it while the slide\
    \ show is on, and later restart it again. To fulfill this scenario, we prefer\
    \ a reusable `Service` object to a one-time `Task` object.\n\n#### 3.3.2.1 Create\
    \ `SlideshowService` Class that Extends `Service` Class\n\nWe need to create a\
    \ class that extends `Service<V>` class. When a `Service` is started, it executes\
    \ a `Task`. The `createTask` method below need be overridden:\n\n```\nprotected\
    \ abstract Task<V> createTask()\n```\n\nIn the `createTask()` method, the `call()`\
    \ method is overridden while a `Task` object is created to be returned to the\
    \ caller.\n\nThe `call()` method in a `Task`, undertakes the task of a slide show,\
    \ basically contains a `while` loop that loads images one by one until either\
    \ one of the following conditions becomes true: there's no more next image in\
    \ the file list, or the slide show is canceled by a user.\n\nThe following listing\
    \ demonstrates how to create a reusable `SlideshowService`, a subclass of `Service`\
    \ class, to carry on a slide show task.\n\nListing 3-15. Create `SlideshowService`\
    \ class:\n"
