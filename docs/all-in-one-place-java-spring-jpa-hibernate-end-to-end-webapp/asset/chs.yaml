  步骤 5: ![](img/image_rsrcFR3.jpg)\n步骤 6: ![](img/image_rsrcFR4.jpg)\n\n### 第 2 章：简介\
  \ - 实验 - 1 - HelloWorld - XML\nSpring Framework 为出现复杂性的地方提供了一个简单的解决方案。客户端只需获取和使用就绪的对象。Spring\
  \ Framework 提供了 `Spring Container`，它负责加载类、初始化资源、将依赖资源注入到调用父对象中。`Spring Container`\
  \ 将准备好就绪的对象。\n\n### 所有实验：\n![](img/image_rsrcFPR.jpg)\n实验 - 1 - HelloWorld - XML:\
  \ ![](img/image_rsrcFR5.jpg)\n\n**HelloWorld.java**\n```java\npackage com.abd.spring3;\n\
  public class HelloWorld {\n    private String name;\n    public void setName(String\
  \ name) {\n        this.name = name;\n    }\n    public void printHello() {\n  \
  \      System.out.println(\" Hello ! \" + name);\n    }\n}\n```\n\n**SpringBeans.xml**\n\
  ```xml\n<beans xmlns=\"http://www.springframework.org/schema/beans\"\n        xmlns:xsi=\"\
  http://www.w3.org/2001/XMLSchema-instance\" \n        xsi:schemaLocation=\"http://www.springframework.org/schema/beans\
  \ http://www.springframework.org/schema/beans/spring-beans-3.0.xsd\">\n    <bean\
  \ id=\"helloBean\" class=\"com.abd.spring3.HelloWorld\">\n        <property name=\"\
  name\" value=\"Welcome\" />\n    </bean>\n</beans>\n```\n![](img/image_rsrcFR6.jpg)\n\
  \n**Client.java**\n```java\npackage com.abd.spring3;\nimport org.springframework.context.ApplicationContext;\n\
  import org.springframework.context.support.ClassXmlApplicationContext;\npublic class\
  \ Client {\n    public static void main(String[] args) {\n        ApplicationContext\
  \ context = new ClassXmlApplicationContext(\"SpringBeans.xml\");\n        HelloWorld\
  \ obj = (HelloWorld) context.getBean(\"helloBean\");\n        obj.printHello();\n\
  \    }\n}\n```\n\n客户端请求流：会发生什么，客户端将做什么，客户端处理时有哪些步骤？你将学习分步详细解释。\n步骤 1: ![](img/image_rsrcFR7.jpg)\n\
