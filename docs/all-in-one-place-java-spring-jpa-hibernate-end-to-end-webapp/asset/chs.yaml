  \n## 第 5 章：Spring Bean 作用域\n\n### 注入（将对象注入父对象中）\n\n### 实验 - 7 - Bean 作用域 – XML\n\
  ### 实验 - 8 - Bean 作用域 – XML\n### 实验 - 9 - Bean 作用域注解\n\n当 Bean 被标记为单例 (Singleton)\
  \ 或原型 (Prototype) 时，意味着什么：\n- 给 Spring 容器的指令\n- 对此 Bean 需要特殊处理\n- 我们将详细介绍这些概念\n\n\
  #### 作用域 = \"Singleton\"\n- 当 Bean 被标记为 `Singleton` 时\n Spring 容器仅会在启动时创建一个实例\n\n\
  #### 作用域 = \"Prototype\"\n- 当 Bean 被标记为 `Prototype` 时\n Spring 容器在每次请求时都会创建一个新实例\n\
