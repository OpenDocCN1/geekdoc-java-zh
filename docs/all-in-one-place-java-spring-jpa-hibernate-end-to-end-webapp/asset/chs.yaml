  import java.util.Arrays;\nimport org.aopalliance.intercept.MethodInterceptor;\n\
  import org.aopalliance.intercept.MethodInvocation;\n\npublic class AOPAroundMethod\
  \ implements MethodInterceptor {\n    @Override\n    public Object invoke(MethodInvocation\
  \ methodInvocation) throws Throwable {\n        System.out.println(\"Method name\
  \ : \" + methodInvocation.getMethod().getName());\n        System.out.println(\"\
  Method arguments : \" + Arrays.toString(methodInvocation.getArguments()));\n   \
  \     System.out.println(\"Before method!\");\n        try {\n            // 继续执行原始方法调用\n\
  \            Object result = methodInvocation.proceed();\n            // 与 AfterReturningAdvice\
  \ 相同\n            System.out.println(\"after method!\");\n            return result;\n\
  \        } catch (IllegalArgumentException e) {\n            // 与 ThrowsAdvice 相同\n\
  \            System.out.println(\"Throw exception aop!\");\n            throw e;\n\
  \        }\n    }\n}\n```\n\n### CustomerService.java\n\n```java\npackage com.abd.spring3;\n\
