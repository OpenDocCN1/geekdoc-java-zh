  \n\n\n\n\n## Page Structure Description\n\n### 1. Query doctor (Page)\nThis page\
  \ is used for querying doctor information, containing the following form items:\n\
  \n#### Form Configuration\nThe form is submitted to `/hospital/allAction.do?method=patientQueryMessage`\
  \ using the `POST` method.\n\n#### Form Fields and Logic\n- **Departments**: Dropdown\
  \ `section`. Options are iterated via `c:forEach` over the `${sections}` collection.\n\
  - **Job title**: Dropdown `level`. Options are iterated via `c:forEach` over the\
  \ `${levels}` collection.\n- **Good at**: Dropdown `spe`. Options are iterated via\
  \ `c:forEach` over the `${es}` collection.\n- **Time**: Dropdown `day`. Options\
  \ include:\n  - `1`: Monday\n  - `2`: Tuesday\n  - `3`: Wednesday\n  - `4`: Thursday\n\
  \  - `5`: Friday\n  - `6`: Saturday\n  - `0`: Sunday\n- **Time Period**: Dropdown\
  \ `ap`. Options include:\n  - `3`: select\n  - `0`: Morning\n  - `1`: In the afternoon\n\
  - **Submit Button**: `input type=\"submit\"`, value is `Confirm`.\n\n### 2. register.jsp\
  \ (Page)\nThis page is used for patient registration.\n\n#### Logic Processing\n\
  - If `${patient}` is not empty, display: **Congratulations! Register success**.\n\
  - If `${patient}` is empty, display the registration form.\n\n#### Form Fields\n\
  The form is submitted to `/hospital/allAction.do?method=regsterPatient` using the\
  \ `POST` method.\n- **Use Family Name**: Input field `username`.\n- **Close Code**:\
  \ Input field `password` (type: password).\n- **Last name Name**: Input field `name`.\n\
  - **Year Age**: Input field `age`.\n- **Sex**: Input field `sex`, length 4, max\
  \ length 1. Description: `0Male`, `1Female`.\n- **Contact Address**: Input field\
  \ `address`, minimum length 5.\n- **Tel**: Input field `phone`.\n- **Submit Button**:\
  \ `input type=\"submit\"`, background image `images/land.gif`, value is `Registration`.\n\
  \n### 3. Configuration File Path\n- Directory: `WebContent\\WEB-INF`\n- Configuration\
  \ File: `springweb-servlet.xml`\n\n\n\n\n\n```xml\n<?xml version=\"1.0\" encoding=\"\
