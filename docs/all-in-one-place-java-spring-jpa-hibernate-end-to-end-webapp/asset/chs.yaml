  2. 在所有实验中请记住这些概念。\n3. 剩余实验将会很快。\n\n### 第 3 章：注入（将依赖对象注入到调用对象（父对象））\n实验 - 2 - Setter\
  \ 注入 - XML\n实验 - 3 - 构造函数注入 - XML\n\nSpring Framework 提供了松耦合架构。有两种类型的架构：\n- **紧耦合架构**：你被强制调用特定的依赖对象。\n\
  - **松耦合架构**：你可以根据需求使用任何依赖对象来调用特定对象。\n\n**注意：** 在接接的实验中，我们将看到如何实现松耦合架构。`Spring Container`\
  \ 负责为我们（开发者）完成任务。开发者通过 XML 文件向 `Spring Container` 提供指令要做什么以及如何做。这些文件可以是 `ApplicationContext.xml`\
  \ 或 `SpringBeans.xml`。\n\n\n\n\n\n# 通过（Setter、构造函数或其他任何方式）调用对象（父对象）\n\n## 实验 - 2\
  \ - Setter 注入 – XML\n\nSpring 容器 → 通过 `Java Class` 的 `Setter()` 方法注入依赖对象\n\n| ![](img/image_rsrcFRH.jpg)\
  \ |\n\n在本实验中，我们将尝试通过 `Interface`（接口）实现松耦合架构。关于如何实现，请详细查看 `Request Flow`（请求流程）。\n\
  \n### Printer.java\n```java\npackage com.abd.spring3;\npublic interface Printer{\n\
  \    public void print();}\n}\n```\n\n### CSVPrinter.java\n```java\npackage com.abd.spring3;\n\
  public class CSVPrinter implements Printer{\n    public void print() {\n       \
  \ System.out.println(\"Csv Output Printer\");\n    }\n}\n```\n\n### JSONPrinter.java\n\
  ```java\npackage com.abd.spring3;\npublic class JSONPrinter implements Printer{\n\
  \    public void print() {\n        System.out.println(\"Json Output Printer\");\n\
  \    }\n}\n```\n\n### OutputHelper.java\n```java\npackage com.abd.spring3;\npublic\
  \ class OutputHelper{\n    Printer outputGenerator;\n    public void print(){\n\
  \        outputGenerator.print();\n    }\n    public void setOutputGenerator(Printer\
  \ outputGenerator){\n        this.outputGenerator = outputGenerator;\n    }\n}\n\
  ```\n\n### SpringBeans.xml\n```xml\n<beans xmlns=\"http://www.springframework.org/schema/beans\"\
  \ xmlns:xsi=\"http://www.w3.org/2001/XMLSchema-instance\" xsi:schemaLocation=\"\
  http://www.springframework.org/schema/beans http://www.springframework.org/schema/beans/spring-beans-2.5.xsd\"\
  >\n    <bean id=\"outputHelper\" class=\"com.abd.spring3.OutputHelper\">\n     \
  \   <property name=\"outputGenerator\" ref=\"csvPrinter\" />\n    </bean>\n    <bean\
  \ id=\"csvPrinter\" class=\"com.abd.spring3.CSVPrinter\" />\n    <bean id=\"jsonPrinter\"\
  \ class=\"com.abd.spring3.JSONPrinter\" />\n</beans>\n```\n\n### 客户端完整请求流程 (Client.java)\n\
  \n### Client.java\n```java\npackage com.abd.spring3;\nimport org.springframework.context.ApplicationContext;\n\
