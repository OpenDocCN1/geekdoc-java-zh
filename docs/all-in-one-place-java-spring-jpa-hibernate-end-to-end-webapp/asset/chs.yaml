  \n![](img/image_rsrcFTR.jpg)\n\n在这里你将学习如何进行多对一映射。\n\n以下代码展示了如何实现多对一映射。\n\n它创建了两个实体，`Person`\
  \ 和 `Department`。一个 `Department` 可以拥有许多 `Person`。\n\n在 `Person` 类的 `department`\
  \ 字段中，使用 `@ManyToOne` 注解标记 `Department`。\n\n```java\n@Entity\npublic class Person\
  \ {\n\t@Id\n\t@GeneratedValue(strategy=GenerationType.IDENTITY)\n\tprivate long\
  \ id;\n\tprivate String name;\n\t@ManyToOne (cascade=CascadeType.ALL)\n\tprivate\
  \ Department department;\n}\n```\n\nPerson.java\n```java\npackage com.abd.jpa;\n\
