  \ |\n\n## 医院系统（流程）\n- **步骤 1**: `患者` → `所需医生` → `预约`\n- **步骤 2**: `医生` → `医生查看预约`\
  \ → `治疗`\n- **步骤 3**: `患者` → `查看治疗`\n- **步骤 4**: `医生` → `医生更新治疗开始/结束时间`\n- **步骤\
  \ 5**: `患者` → `查看治疗状态`\n\n## 医院系统设计文档\n\n### 1. 医院门诊转诊系统功能\n### 1.1 系统整体功能\n- 操作员权限级别具有清晰分类，当系统进行身份验证时。\n\
  - 个人患者隐私保护：只有在医生治疗期间患者本人可以访问其医疗记录，其他任何人（包括管理员在内）无权访问。\n\n### 1.2 患者角色\n- 注册用户，设置你的登录名和密码。\n\
  - 自定义查询医生姓名。\n- 根据查询结果进行预约，如果指定的日期医生预约量已满，则预约失败。结果随机返回给患者。\n- 你可以拥有、查看或撤销预约。\n-\
  \ 进行预约时，你可以查询医生信息和医疗信息。\n\n### 1.3 医生角色\n- 你可以查看患者的预约。\n- 你可以查询患者记录。\n- 你可以创建患者记录。\n\
  - 修改患者记录。\n\n### 1.4 管理员角色\n- 你可以添加和删除医生账号。\n\n### 2. 设计过程\n从需求分析开始，进行实体分离。\n**主要实体：**\n\
  - 医生 (`doctor`)\n- 患者 (`patient`)\n- 医疗记录 (`history`)\n- 预约记录 (`pinqueue`)\n- 管理员\
  \ (`administrator`)\n- 医生可最大预约数 (`appointment`)\n- 医生当前可用预约数 (`currappointment`)\n\
