  \ context = new ClassPathXmlApplicationContext(\"SpringBeans.xml\");\n        OutputHelper\
  \ output = (OutputHelper)context.getBean(\"outputHelper\");\n        output.print();\n\
  \    }\n}\n```\n\n| ![](img/image_rsrcFRJ.jpg) |\n| ![](img/image_rsrcFRK.jpg) |\n\
