  \t@GeneratedValue(strategy=GenerationType.IDENTITY)\n\tprivate long id;\n\tprivate\
  \ String name;\n\t@ManyToOne (cascade=CascadeType.ALL)\n\tprivate Department department;\n\
  \n\tpublic Person() {}\n\tpublic Person(String name) {\n\t\tthis.name = name;\n\t\
