    \ in a drag-and-drop manner.\n- 6.4.2 The event allows the mouse to “steer” the\
    \ camera.\n\n### Lesson 5.6 – Audio\n\nThe age of silent movies has long passed.\
    \ To make movies really interesting we need to add sound. Alice makes productions\
    \ for sound but very few objects have any sounds included. You can identify objects\
    \ with sound when you place them on the screen by looking at the description in\
    \ dialog box that pops up when you select the object.\n\n![](img/d2ba71a3d11a1090959dcfb8fe9d6290_81_0.png)\n\
    \nFigure 6.5.1\n\nNote right above the Cancel button is an entry that is titled\
    \ sounds and includes “MonkeyScreech”. This is the only sound available as part\
    \ of this object.\n\nThe good news is that you can add your own sounds with two\
    \ other choices when you place the object in your movie. In the properties tab\
    \ there are choices to import sound or record sound for many Alice objects, including\
    \ those that already have sounds.\n\nYou can import .wav or .mp3 into your movie.\
    \ When you select import you will get a dialog box that will allow you to browse\
    \ to your sound and import it. This can be done in the properties tab or when\
    \ you drag the \"play sound\" command to the editor.\n\nRecording a sound can\
    \ be done if your computer has a microphone. Select record sound from the properties\
    \ tab or when you drag the play sound to the editor. A dialog box appears that\
    \ allows you to record your sound. A counter will remind you how long the sound\
    \ clip will be.\n\n![](img/d2ba71a3d11a1090959dcfb8fe9d6290_82_0.png)\n\nFigure\
    \ 6.5.2\n\n![](img/d2ba71a3d11a1090959dcfb8fe9d6290_83_0.png)\n\nWhen you see\
    \ in Figure 6.5.2, we have dragged \"monkey play sound\" to the event editor and\
    \ it asks, do we want to play the screech, import a sound or record a sound.\n\
    \nWhen the screech sound was selected the instruction appears as shown in Figure\
    \ 6.5.3.\n\nIn Review\n\n- 6.5.1 To make movies really interesting we need to\
    \ add sound.\n- 6.5.2 You can identify objects with sound.\n- 6.5.3 You can add\
    \ your own sounds in different ways.\n- 6.5.4 You can import a .wav or .mp3 into\
    \ your movie.\n\n### Lesson 6.6 – Wait\n\nThe Wait instruction is designed to\
    \ make the program do nothing for a specified amount of time. The tile is located\
    \ at the bottom of the event editor. It takes one argument, the number of seconds\
    \ to wait. The program will pause and do nothing for that number of seconds.\n\
    \nIn Review\n\n- 6.6.1 The Wait instruction has argument(s).\n\n### Lesson 6.7\
    \ - Try This\n\nThis exercise creates a space scene that uses the mouse to move\
    \ objects, arrow keys to move the lunarLander and when the user hits the \"Q\"\
    \ key the lunarLander blasts off.\n\n1. Select the Space World\n2. Place the lunarLander\
    \ object in the world\n3. Place the astronaut object in the world\n4. world.myFirstWorld\
    \ method\n   a. world set fogFarDistance to 75 meters\n5. In Event Window Click:\
    \ Create New Event\n   a. Let the mouse move <objects>\n6. In Event Window Click:\
    \ Create New Event\n   a. let Arrow keys moves <subject>\n   b. Select lunar Methods\
    \ Tab: Create New Method\n7. In the World Methods Tab: Create New Method\n   a.\
    \ Name the method blastoff\n   b. In the method Loop 15 times\n   c. In the method\
    \ under Loop: lunarLander move up 0.5 meters\n   d. duration = 0.25 seconds\n\
    8. In Event Window Click: Create New Event\n   a. When a key is typed\n   b. Change\
    \ \"anykey\" to \"Q\"\n   c. Change \"nothing\" to blastoff\n\nPLAY and experiment\
    \ with moving objects with the mouse, use the arrow keys to move the lunarLander.\
