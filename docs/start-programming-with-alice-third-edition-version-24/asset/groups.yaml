    # Tutorial 3 – Repetition


    Overview:


    +   - Explain repetition.

    - Use a counter loop.

    - Use a while loop.

    - Describe when to use each type of loop


    # Lesson 3.0 – Overview of Repetition


    The last structure to be examined is the "Repetition" structure. This is the real
    power of a program, the ability to repeat a series of instructions. Perhaps something
    so simple in Alice Worlds as making an object jump up and down three times or
    move towards another object until you are 1 meter from the other object. These
    activities require using "loops" or the repetition structure.


    The repetition structure tests a condition and if the condition evaluates to true,
    allows the program to repeat one or more times, until the condition changes and
    evaluates to false. However, there must be something in the loop changes the condition
    to avoid the "dread infinite loop". This is a loop that never ends because the
    condition to exit the loop is never met.


    There are two types of loops in Alice. First, there is the LOOP structure. This
    structure is used when a loop is to be executed a number of times. It may be a
    specific number or it may use the contents of a variable. The benefit of this
    loop is that it uses a built in counter structure that ensures the loop will be
    exited at some point. The second structure is the WHILE loop. This loop executes
    while a condition is true, false or is a compound loop selected by choosing the
    logic choice which then continues to asks construct a compound loop condition.
    See Figure 3.0.1.


    ![](img/d2ba71a3d11a1090959dcfb8fe9d6290_46_0.png)


    Figure 3.0.1'
