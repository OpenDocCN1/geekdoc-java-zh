    ## 第 1-6课：伪代码


    另一种确保你的电影不偏离轨道的方法是在所谓的“伪代码”中概述你的故事线。伪代码无非是一个大纲。它是一系列语句列表，逐步告诉如何构建你的电影。当你转换到另一种编程语言时，这可能也是你组织思路的首选方法。回顾我们的分镜示例，伪代码仅仅就是示例脚本：


    PSEUDOCODE:


    1. 在屏幕上放置 3个角色

    2. 第一个角色上下跳跃三次

    3. 第二个角色旋转五次

    4. 第三个角色向前移动一米，然后向后移动一米。


    虽然没有电影分镜那样有效，但伪代码是次优选择。无论如何，你都需要规划你的电影以保持它不偏离轨道。当你开始制作具有多个场景、新增的方法和事件的复杂电影时，这一点尤为重要。当剧情变得复杂时，必须使用某种规划方法，否则你的电影将偏离初衷。


    ## 复习：


    - 1.6.1 伪代码仅仅是一个 _____________

    - 1.6.2 当 _____________ 时，你也可以使用伪代码

    - 1.6.3 或 ____________ 可用于规划你的电影。


    ## 第 1-7课总结


    我们在本章中涵盖了大量内容。首先，我们识别了 Alice IDE 的各种窗口。接下来，查看了教程。每个教程都展示了创建 Alice 电影的一个重要方面。然后讨论了对象的属性（Properties）、方法（Methods）和函数（Functions）。四分视图（Quad
    View）有助于在舞台上定位对象。布局控制可以移动对象，并在需要时创建副本。本章还介绍了其他帮助你在屏幕上移动对象的工具。


    最后，我们查看了分镜的概念。这是一个帮助程序员按正确顺序执行所有动作的规划工具。这在 Alice 以及其他任何编程语言中都是重要的。“不计划计划就是失败的计划”这句话在编程中和生活中一样重要。


    ## 教程 2 - Alice 编程


    ### 目标


    - 使用 3D 对象

    - 描述如何创建和使用变量

    - 如何使用所有数据类型

    - 描述对象属性、方法和函数

    - 使用决策结构

    - 使用看板（billboard）对象

    - 创建 3D 文本


