    # WORD PROBLEMS FOR ADDITIONAL EXERCISES


    ## Exercise 1:


    Create an Alice world where a person is in a rowboat yelling "Help!" while two
    sharks circle the boat. Be sure to make the sharks circle the boat at the same
    time. Also, be sure to change some of the default settings to control how fast
    the sharks swim around the boat.


    ## Exercise 2:


    Create a world that contains any object that contains a turn method. When the
    world first begins, ask the user for the number of times they want the object
    to spin. If that number is less than 10, then use the turn method to spin the
    object number of times. If the number is 10 or more, the object should say "Spinning
    more than 10 times makes me sick!"


    ## Exercise 3:


    Create an amusement park that has several rides. Activate those rides to spin
    or turn and have a number of people objects and other amusement activities the
    scene. Let the mouse move the camera to show the entire park from different perspectives.
    Use the billboard object to create signs around the park.


    ## Exercise 4:


    Create a sea world with an island and a fish. The fish should swim around the
    island. (Part of the fish''s body should be above the water''s surface, so you
    can see it swimming.) The program should ask the user for the number of fish from
    1 to 6 and that many fish should swim around the island ten (10) times.


