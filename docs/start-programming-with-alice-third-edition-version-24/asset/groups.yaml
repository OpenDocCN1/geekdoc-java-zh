    characters forward and backward 2 times. A random number is generated between
    0 and 3 and the result is stored in the variable "whichPerson". The print statement
    is used to display the random number being generated at the bottom of the screen.
    The Print command is found in a tile at the bottom of the editor. When the movie
    is played, it will display values or messages at the bottom of the screen. This
    is a debugging tool and should be removed after the results have been confirmed
    working. Then there is a nested statement to decide which character should move,
    0, 1 or 2.


    Random numbers are especially important when writing games or when the movie requires
    objects moving or acting in a random manner.


