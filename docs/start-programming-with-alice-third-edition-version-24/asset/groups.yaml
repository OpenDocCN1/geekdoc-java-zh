    # Lesson 6.0 – Overview of Events


    An event is an action that takes place while the Alice world is playing. Alice
    worlds are capable of recognizing certain events and responding to them. This
    is also important to understand for other languages that implement "Event Driven"
    programming, like Visual Basic.NET and other "Visual" languages


    The "Event Editor" is in the top right portion of the screen. When Alice world
    is first opened, one event will be listed in this area. When the movie starts,
    do "world.my method " is the method invoked by default.


    Events Alice Detect:


    - When the world starts

    - When a key is typed

    - When the mouse is clicked on something

    - While something is true

    - When a variable changes

    - Let the mouse move <object>

    - Let the arrow keys move <subject>

    - Let the mouse move the camera

    - Let the mouse orient the camera


    "Create New Event" button allows the user to choose these events.


    ![](img/d2ba71a3d11a1090959dcfb8fe9d6290_77_0.png)


    Figure 6.0.1


    Using these events allows the programmer to build user interaction into the movie.
    An object can move as directed by the keyboard or objects can be positioned by
    the mouse. In addition, certain changes in the program like a variable change
    or something becomes true or false can be used to control what is happening on
    the stage.


