    # Lesson 1-6 Pseudocode


    Another method of making sure you stay on track with your movie is to outline
    your storyline in what is called pseudocode. Pseudocode is nothing more than an
    outline. A list of statements that tell you, step-by-Step how to construct your
    movie. This may also be your preferred method of organizing your thoughts when
    you move to another programming language. Looking back at our storyboard example
    the pseudocode is nothing more than the sample script:


    PSEUDOCODE:


    +   1. Place 3 characters on the screen

    2. First character jumps up and down three times

    3. Second character turns around five times

    4. Third character moves forward one meter then back one meter.


    While not as effective as storyboarding your movie, pseudocode is second best.
    In any case, you need to plan your movie to keep it on track. This is especially
    important when you begin to produce more complex movies with several scenes, added
    methods and events. When the story line gets complex, some method of planning
    must be used or your movie will fall short of its original intent.


    In Review:


    +   1.6.1 Pseudocode is nothing more than an _____________

    1.6.2 You may also use pseudocode when _____________

    1.6.3 or ____________ may be used to plan your movie.


    # Lesson 1-7 Summary


    We covered a lot of material in this chapter. First, we identified the various
    windows of the Alice IDE. Next, a look at the tutorials. Each one shows important
    aspect of creating an Alice movie. Then a discussion of Properties, Methods and
    Functions of objects. Quad View helps in positioning objects on the stage. The
    layout controls move the objects, as well as make copies of them, if needed. The
    chapter also introduces some other tools to assist in making your objects about
    the screen.


    Lastly, we took a look at the concept of a storyboard. A planning tool to help
    the programmer get all the action in the correct order. This is important in Alice
    and every other programming language. The saying “Failing to Plan is a Plan to
    Fail” is as important in programming as it is in life.'
