    # Lesson 4.4 – Passing Arguments to Methods


    Sometimes it is necessary for the calling program to pass information (or values)
    to the called method. This is called passing an argument to a method.


    If a method is to accept an argument when it is called, it is necessary to create
    a parameter in the method. A parameter is simply a variable that can hold the
    value of the argument when it is passed.


    To create a parameter in a method, there is a "Create New Parameter" button in
    the method editor for creating a parameter variable to hold the argument passed
    from the calling method. Clicking on this opens a dialog box identical to the
    one opened for a new variable. Enter a name, select a type and create a parameter
    variable.


    Once this has been done, an argument will be required each time the method is
    called.


