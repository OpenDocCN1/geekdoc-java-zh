    ## Lesson 2.5 - Do Together / Do In Order


    When it is necessary that two or more objects move at the same time the "Do Together"
    structure is used. The Do Together structure makes all of the instructions contained
    within the structure execute at the same time. This allows the programmer to make
    several things happen simultaneously.


    A good example of using Do Together is shown below. The car and the driver are
    two objects that need to move at the same time, same rate, same distance and same
    distance.


    ![](img/d2ba71a3d11a1090959dcfb8fe9d6290_36_0.png)


    Figure 2.5.1


    The car object and the randomGuy object move forward simultaneously, the same
    distance at the same speed. If those instructions were not in the Do Together
    structure, the car would move then the driver would move and this would not look
    like the guy was driving the car.


    The Do in Order structure is a way to group instructions that should happen in
    a specific order. This is used when the programmer needs to insure that a group
    of instructions are processed in an exact order. The Do in Order structure is
    implied in a program but there are situations where this structure needs to be
    nested in another structure to achieve the desired actions.


