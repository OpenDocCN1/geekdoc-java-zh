    ## Lesson 2.2 – Using Primitive Methods to Position Objects


    Another way to position objects when in Add Object Mode, is to use the primitive
    methods. If the object is selected in the "Object Tree" you can "right click"
    on the object name and a drop down list of primitive methods will appear and a
    method can then be selected to position the object.


