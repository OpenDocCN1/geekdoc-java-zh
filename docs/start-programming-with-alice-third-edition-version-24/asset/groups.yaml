    8. 现在点击左上角的“播放 (PLAY)”按钮播放你的第一个电影。

    9. 你现在是一个 Alice 程序员了。


    ## 课程 1.4 四视图 (Quad View)


    当多个对象被放置在世界时，很难让它们排列在正确的起始位置，让它们面向不同的对象，等等。当对象被添加到世界时，在屏幕顶部可以使用对象的“画库 (Gallery)”。到画库末尾并选择名为“3D
