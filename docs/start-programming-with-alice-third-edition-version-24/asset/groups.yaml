    Alice is a fairly new concept in learning programming. It puts the user into a
    world of 3D programming but removes many of the pitfalls that discourage beginner
    programmers.


    Free to download, easy to use and best of all FUN! Developed by Carnegie Mellon
    to interest younger students, young women in particular, in programming as a career.
    Used in K-12 and at the College/University level to introduce students to programming.


    In Alice, the programmer creates a world and then populates the world with various
    objects. If the movie takes place in the city, it would be a world of buildings,
    streets, signs, people, vehicles, etc.. The programmer animates objects and they
    perform various actions as they would be done by a similar object in the “real
    world”. For example: a girl walks, a skater skates, jumps and twirls, a car moves
    along a road.


    Why study Alice? Alice is not a programming language used in business for practical
    applications. The real purpose is to teach the principles of programming while
    having fun. Results may not be like Halo or Hollywood, but with a little effort,
    the beginner can produce some dramatic movies quickly.


    Learn to use Alice by telling a story. Compose a short story and then tell this
    story Alice. Teachers use Alice to illustrate their courses. Alice can be used
    to teach a new language, teach a math problem, teach science, and many other courses.
    The possibilities are endless. For some examples of how Alice has been used, there
    are numerous YouTube videos and on other Alice related web sites.

