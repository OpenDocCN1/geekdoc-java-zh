    # Lesson 2.6 - Decisions


    The Decision Structure programmatically evaluates expressions and based on the
    outcome, decide which code to execute. The expression evaluated must evaluate
    to a "Boolean" value or in simpler terms an expression that evaluates to either
    "True" or "False".'
  - '[PAGE 38]


    At the bottom of the Method Editor there is a group of tiles and one of these
    tiles is titled "If/Else. To use the decision structure drag this tile to the
    appropriate place in the Method editor of the program. This will result in a If
    Else structure placed in your program. The line after the If statement, is a box
    for the true statements, next line is the Else and the fourth line is for the
    False statements. The statement or statements to be executed in True side for
    those to be executed if the evaluation of the expression results in true. Put
    the statements to be executed if the expression is evaluated as false in the else
    statement. If the false side does not contain any instructions this is a single
    sided structure that executes alternate instructions if the expression evaluates
    to true.


    Constructing a "Boolean" Expression for Evaluation


    There are six (6) relational operators:


    +   1. == Equal to

    2. != Not Equal to

    3. > Greater than or equal to

    4. <= Less than or equal to

    5. > Greater than

    6. < Less than


    Use this to compare two values or the contents of two variables or the content
    of a variable and a value. Based on the comparison of the two, the relational
    operator selected gives a result of True or False. This determines which code
    gets executed. When the appropriate code completes, the program continues with
    the next instruction after the decision structure.


    ![](img/d2ba71a3d11a1090959dcfb8fe9d6290_38_0.png)


    Figure 2.6.1'
  - '[PAGE 39]


    This example shows a few concepts in Alice programming. First, a new variable
    has been created "movetruck" which is set to a value of 1. The first instruction
    sets the value stored in movetruck to a value entered by the user. In the World
    object there is a function "ask user for a number" this is dragged to replace
    the value of 1 and a value of "Move truck 1 or 2?" as the prompt for the user
    to enter a number.


    Then comes the IF statement. The value in movetruck is tested and if it is equal
    to a 1, the first dump is moved forward 10 meters. Any other value will cause
    the second dumptruck to move forward 10 meters.


    Also, decision structures can be "nested". Simply, this means that if there is
    an If/Else structure, there may be another if/Else structure in either or both
    the false statements. Nesting can be as many levels of nesting as required to
    complete the task required by the program.


    Let use nesting the previous example of the If statement. If the user enters some
    other value than a 1, the movetruck variable is again tested to determine if it
    is NOT equal to a 2. If this evaluates to a true, the camera moves back 10 meters
    and (displays on screen), "The directions were 1 or 2....DUMMY!" If the expression
    evaluates to false (2 was entered) the truck moves forward 10 meters. This limits
    the user to entering only a 1 or a 2 to the appropriate truck.


    Example 2.42 illustrates this use of nested statements. You may nest as many as
    necessary to achieve the desired action.


    ![](img/d2ba71a3d11a1090959dcfb8fe9d6290_39_0.png)


    Figure 2.6.2'
  - '[PAGE 40]


    There are three(3) logical operators. These are used when we need to evaluate
    several expressions and based on the aggregate boolean evaluation the program
    makes a decision to do the true statements or the false statements


    # Logical Operators


    +   not a reverses the truth of expression a

    both a and b if both expressions evaluate to it returns true any other combination
    of results in a return of false


    Example: 5 == 5 and 7 > 3 - both are true so the entire expression is true


    5 > 9 and 7 > 3 - only one is true so the entire expression is false


    5 > 9 and 3 > 7 - both are false so the entire expression is false


    +   either a or b, or both if the expressions return true or if either one is
    true the evaluation results in a return of true. If both are false it returns
    false


    Example: 5 == 5 or 7 > 3 - both are true so the entire expression is true


    5 > 9 or 7 > 3 - only one is true so the entire expression is false


    5 > 9 or 3 > 7 - both are false so the entire expression is false


    ![](img/d2ba71a3d11a1090959dcfb8fe9d6290_40_0.png)


    Figure 2.6.3'
  - '[PAGE 41]


    Use logical operators when there are several conditions to be evaluated before
    the program can decide what code to execute. In the example if the user selects
    truck 1 and selects right turn, the truck one will move forward 10 meters, turn
    to the right, move forward 5 meters and dump its load. If truck 1 and turn left
    are selected, it will move forward 10 meters, turn left and move forward 5 meters
    and dump the load. If truck two is selected, the same options and actions are
    executed.


    In Review:


    +   - 2.6.1 Use operators when there are several conditions to be evaluated

    - 2.6.2 Use operators to compare two values or the content of two variables and
    the content of a value and a value.

    - 2.6.3 There are logical operators.

    - 2.6.4 There are expression evaluates to either true or false.


    # Lesson 2.7 – Billboard


    The billboard allows you to get a picture or a title into your Alice movie. Select
    a picture, modify or create one using a product like Microsoft Paint, Gimp, Photoshop
    or Paint.NET. I use Paint.NET to create or modify the 2D graphics in my Alice
    movie. It is a free download and easy to use.


    There are several common formats for pictures. GIF, PNG, JPG (or JPEG), and BMP
    are some of the most popular formats. Each of these has unique characteristics
    that you should consider before selecting one for your Alice movie.


    +   - GIF - Graphics Interchange Format – Used for clip or text. Supports transparent
    background and is a compressed format which makes an image that has less bytes
    for your movie. This should help keep your movie smaller in size and load faster.
    GIF supports animation.

    - PNG - Portable Network Graphics – Similar to GIF. Supports transparency, animation
    and is a compressed format. I recommend this format for use with billboards.

    - JPG or (JPEG) – Joint Photographers Graphics – This is an uncompressed format
    that is for high quality pictures. If you need sharp pictures with lots of colors
    and GIF or PNG just not support your picture justice, choose JPG. It does not
    support transparency or animation.

    - BMP - Bit Mapped Pictures – An uncompressed format and is usually larger than
    any of the other choices. Use this sparingly and preferably never.


    You put the billboard on your movie set by selecting the File Menu and clicking
    on the Make Billboard selection. This brings up a dialog box where you choose
    your picture and add it to your movie. Once on the movie set, you can position
    the billboard as required.'
