  mdcn: "\n\nIceSkater 由 30 多个对象组成。`IceSkater` 对象继承了所有其他对象的能力（函数、方法、属性）。`foot` 对象可以执行的所有操作，它在右腿或左腿的末端执行。这些都由\
    \ `IceSkater` 对象继承。\n\n查看在 IceSkater 中组成 `upperBody` 对象的所有对象。`head` 对象可以执行的所有操作都继承自组成\
    \ `head` 的所有对象。通过操作属性、方法和函数，可以为 `IceSkater` 对象赋予栩栩如生的动作。\n\n检查画廊中的其他对象，你会发现所有这些对象都是由其他对象组成的。组成主对象的每个对象的每个属性、方法和函数，都会被你放置在世界中的那个对象所继承。\n\
    \n所以，当你向一个对象添加一个函数或方法并为该对象构建一个新类时，该对象未来的所有实例都将继承这个新函数或方法。\n\n## 复习\n\n7. 7.2.1\
    \ 当我们观察对象的所有组件时，发现它是由 ________ 组成的。\n\n7. 7.2.2 通过操作 ________ 和 ________，可以将其他动作赋予不同的对象。\n\
    \n7. 7.2.3 当你向一个对象添加一个函数或方法并为该对象构建一个新类时，该对象未来的所有实例都会继承这个新函数或方法。（正确 / 错误）\n\n##\
    \ 第 7.3  – 类级方法\n\n使用冰滑运动员，创建一个新方法来模拟更复杂的动作，为在池塘上滑冰的动作增加真实感。这比那些让 Pixar 电影看起来真实的动画更复杂。滑冰动作的步骤组合在一个动作序列中，必须编写到类级方法（Class-Level\
    \ Method）中。以下是要包含在该新方法中的步骤。\n\n- 滑冰 (Skate)\n  - 同时进行 (Do together)\n    - 让冰滑者向前移动\
    \ 2 米\n    - 顺序执行 (Do in order)\n      - 用左腿滑\n      - 顺序执行\n        - 抬起右腿并将上半身向前转\n\
    \        - 放下右腿并将上半身向后转\n- 用右腿滑 (slide on right leg)\n  - 顺序执行\n    - 抬起左腿并将上半身向前转\n\
    \    - 放下左腿并将上半身向后转\n\n现在是时候将计划代码化了。为了保持这些新方法简洁，有必要先创建一个 `slideLeft` 方法和一个 `slideRight`\
    \ 方法。然后将它们整合到整体的 `skim` 方法中。\n\n## 第 7.4 - 使用参数创建新方法\n\n现在，让我们来点花样，添加一个 `spin`\
    \ 方法来以真实的方式旋转冰滑者。`spin` 方法需要一个参数来告诉冰滑者要旋转几次。\n\n- 1. 旋转 (Spin)\n  - 参数：旋转次数\n\
    \  - 顺序执行\n    - 准备 (prepare to)\n      - 同时进行\n        - 抬手臂\n        - 抬起并转动左腿\n\
    \    - 旋转冰滑者（次数）\n    - 完成旋转\n      - 同时进行\n        - 降低手臂\n        - 放下并转动左腿\n\
    \n现在编写此操作，就创建了一个具有比原始类更多功能的类新实例。它拥有所有旧的属性、方法和函数，并加上了一些新的属性，使冰滑者更加真实。现在是时候看看这些方法如何传递给该类的新实例了。\n\
    \n## 第 7.5 - 创建新类\n\n冰滑者被赋予了一些新能力，应该捕捉这些能力供其他冰滑者使用。这涉及创建一个新的对象类，应命名为“realSkater”。这是一个步骤步骤。\n\
    \n1. 重命名 `iceSkater`。这是最重要的一步！用不同的名称保存 `iceSkater` 对象，这样它就不会将方法写入原始类中。在对象树中右键点击对象的名称，并选择“重命名”（rename）。在弹出窗口中选择“重命名”，然后在框中输入“realSkater”。\n\
    2. 保存。\n\n"
