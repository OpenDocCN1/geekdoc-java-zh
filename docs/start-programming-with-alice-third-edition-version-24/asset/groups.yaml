    Now, we have a method named "march" and we can use this method just as we would
    use any other method for class. This may look like a lot of code and it is, that
    is why we code these routines once and reuse whenever possible.


    # Lesson 4.3 Using the Method


    With the new method ready to go, return to the "world.my first method" and use
    the method just like it was - one of the methods that were programmed into the
    toySoldier class.


    To keep things simple, will loop through executing the method ten times. This
    simply requires dragging the "Loop" structure from the bottom of the methods editor
    and selecting 10 times. Then simply drag and drop the "march" function created
    beneath the Loop structure and the toy soldier is ready to march across the screen.
    Hit the PLAY button and if it is correct, your soldier marches across the screen.


