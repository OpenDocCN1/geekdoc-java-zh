    areas.


    ![](img/d2ba71a3d11a1090959dcfb8fe9d6290_15_0.png)


    > Figure 0.1.1 – Alice.org web site


    Each area of the Alice can be defined as follows:


    - Toolbar: Contains a Play Button that plays a virtual world. An Undo Button which
    undo the previous operation. A Redo Button that returns the last. A trash can
    for deleted objects. It can also contain one or more clipboards to store objects.

    - World View: Shows a view of a virtual world. Each virtual world has a camera
    and the window can move and rotate. The controls are at the bottom of the window.

    - Object Tree: Contains a list of all the objects. Each object has a name and
    it is listed on the object tree. Use this panel to select the object when the
    details panel is used.

    - Details Panel: Shows information about an object that has been selected. There
    are three (3) tabs in this panel. The Properties tab contains the attributes that
    describe the object. The Methods tab contains the things the object can do. The
    functions tab contains the subprograms associated with the object.

    - Method Editor: This is where the programmer creates methods which are simply
    a set of instructions that cause some action to take place.

    - Events Editor: Events happen as the world plays. It may be a key pressed or
    a mouse button clicked or a number of other predetermined events. Alice responds
    to these events by triggering a program sequence.


