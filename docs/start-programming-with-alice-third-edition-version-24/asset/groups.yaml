    ## 1.0 环境


    当 Alice 环境启动时，有必要熟悉这些区域。


    ![](img/d2ba71a3d11a1090959dcfb8fe9d6290_15_0.png)


    > 图 0.1.1 – Alice.org 网站


    Alice 的每个区域定义如下：


    - 工具栏（Toolbar）：包含一个播放虚拟世界的按钮。一个撤销（Undo）按钮。一个重做（Redo）按钮。一个删除对象的垃圾桶。它还可以包含一个或多个剪贴板。

    - 世界视图（World View）：显示虚拟世界。每个虚拟世界都有摄像头，窗口可以移动和旋转。

    - 对象树（Object Tree）：包含所有对象的列表。每个对象都有名称并列在树中。在使用详情面板时通过此面板选择对象。

    - 详情面板（Details Panel）：显示选中对象的信息。面板有三个标签。属性（Properties）标签包含对象的特征。方法（Methods）标签包含对象可以执行的操作。函数（functions）标签包含与对象相关的子程序。

    - 方法编辑器（Method Editor）：这是程序员创建方法的地方，方法仅仅是导致某些动作发生的指令集。

    - 事件编辑器（Events Editor）：事件在世界播放时发生。它可能是按下按键、点击鼠标按钮或其他预定义的事件。Alice 通过触发程序序列来响应这些事件。


    ## Alice 教程


    Alice 带有四个优秀的教程来帮助程序员入门。在首次加载 Alice 时，教程对话框应该出现。如果没有出现，请前往菜单栏并选择 Help，然后 Tutorials。完成这些教程将使用户熟悉
    Alice 编程的基础知识。


    在此处，我建议在进入下一步之前完成两个教程。如果对教程有问题，请重复它们，直到对内容达到熟悉程度。完成所有教程很重要，但仔细学习这两个教程将有助于入门。理解这些教程中的概念将有助于未来课程中的练习。


