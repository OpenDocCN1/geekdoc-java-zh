    # Lesson 2-4 - Alice Properties, Methods and Functions.


    When using Alice, the mouse is used to select commands. Then watch what happens
    on the screen. If the skater ends up in the wrong place or skates in the wrong
    direction, go back and change the command. Alice is mainly a drag and drop programming
    language. One of the major benefits is that the beginner programmer does not have
    to be concerned with syntax errors. No matter what instructions are used, the
    syntax will not cause compile errors. The program may do weird things but it will
    run. It supports all three programming structures: sequence, decision and repetition.


    Working with Alice, the user will not experience the most difficult part of writing
    computer programs – writing all of the detailed instructions, in precisely the
    correct language and syntax, for every little thing that is going to happen on
    the screen. This is the big "turn-off" for beginner programmers. They often are
    frustrated in trying to figure out what they did so wrong to cause the program
    not to run as expected.


    The programmer can change the values of variables and of properties of objects
    as the program is running. The previous lesson established how to set the value
    of a variable. Now, review the steps to change the value of a property of an object:


    +   Select the object with the property tile from the Details Panel to the Methods
    Editor.


    +   Drag the property''s tile, a menu will appear allowing selection of a value
    for the property.


    Using Functions


    A function is a special type of method that completes a task with the given parameters
    (if any required) and returns a result to the program that called the function.


    +   Select the object


    +   Select the functions tab in the Details Panel to display a list of tiles that
    represent the object''s functions'
