    # Lesson 1-5 Storyboarding


    First, there must be an idea for a story. The next step is to put that story on
    paper and get it in a logical order. It could be viewed as a map to lead the programmer
    through the story to ensure steps are not missed. This is called “storyboarding”
    the movie. The concept comes from advertising agencies where it is used for developing
    scripts for TV advertisements, Learning to use this tool will help make better
    movies and cut down on development time.


    A storyboard can be elaborate or just a group of sketch drawings of the movie
    in development. It is not necessary for it to be a work of art. Stick figures,
    shapes, lines are ok, it needs to assist in the organization of ideas and the
    flow of the movie. It usually includes the script for the movie if there is interaction,
    talking and/or music included.


    The first step in developing a storyboard is to develop a script for the movie.
    A written plan for the entire movie. The objects to be used and what part the
    object will play in the movie. Then, take this script and draw a rough series
    of pictures showing what the stage will look like at various points in the movie,
    this is the storyboard.


    Then, review the storyboard to insure all of the main elements have been included
    and pay special attention to the order of activities. This is where the order
    of events are reviewed closely to make sure the movie flows correctly from beginning
    to end. It is uncommon to make significant changes later. Remember “Weeks of programming
    can save hours of planning”.


    Yes, the movie could be developed without taking the time to do this step, however,
    that only works for short clips and they are usually well organized and often
    a disappointment to the developer once they are finished. Then the developer is
    left with the decision to live with it or spend more time in fixing the movie.
    Just like any other programming project, an Alice project should be carefully
    planned. The storyboard does not have to be fancy. My example is just stick figures
    and comments to illustrate what is to be done in the movie and in what sequence.'
