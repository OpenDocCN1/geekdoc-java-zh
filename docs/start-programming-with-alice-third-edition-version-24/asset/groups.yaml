    ## 课程 0.0 - Alice 概述


    Alice 2.2、2.3 和 Alice 2.4 版本是 Alice 编程软件的不同版本，它们将带你进入 3D 动画的世界。令人惊讶的是，人们可以很快掌握创作动画电影或
    3D 游戏的艺术。该软件由卡内基梅梅隆大学的教师 Randy Pausch、Wanda Dann 和 Steven Cooper 开发。它以刘易斯·卡罗尔的书《爱丽丝仙游记》命名，反映了卡罗尔先生的数学背景。


    等一下，让我重新读一遍

    终于有一种简单且最重要的是**有趣**的编程语言！Alice 是为初学者设计的。Alice 同时用于高中和大学水平。它的设计目的是培养对编程特别感兴趣的年轻女性。它也是掌握
    3D 编程技能的绝佳起点，未来可以从事虚拟现实、动画电影、电影特效和其他热门电脑游戏。


    为什么要学习 Alice？Alice 不是一种“现实世界”编程语言。应用程序不会永远永远用 Alice 编写。那么，Alice 的目的是什么？Alice 的设计是为了教授编程原理，而没有语法错误的负担。此外，它的设计是具有趣味性的，而学习本就应该是有趣的。结果可能不像《光环》或好莱坞那样，但只要稍加努力，新手就能展示出非常惊叹的
    3D 虚拟世界。


    在 Alice 中，程序员创建一个世界，然后用各种对象填充这个世界。如果电影发生在城市，人们就会在世界中填充建筑、街道、标志牌等。程序员可以对这些许多对象进行动画处理，并执行与“现实世界”中类似对象执行的各种动作。例如：让士兵行军、让滑冰者滑过池塘并进行旋转和跳跃、让汽车在公路上移动、让飞船起飞以及各种对象的其他动作。


    通过讲述故事来学习使用 Alice。编写一个短故事，然后用 Alice 讲述这个故事。有老师使用 Alice 来演示课程的示例。Alice 可用于教学语言、教授数学问题，也可用于科学和物理。潜力是无限的。关于
