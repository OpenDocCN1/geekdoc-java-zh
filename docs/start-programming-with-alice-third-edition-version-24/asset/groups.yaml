    # 教程 5 – 函数 (Functions)


    学习目标


    - 区分函数 (Function) 和方法 (Method)

    - 创建一个使用函数的电影

    - 在计算中使用函数


    ## 课程 5.0 – 函数概述


    “函数”（Functions Tab）选项卡将函数定义为：“函数是对象可以关于自身或世界回答的问题。”


    ![](img/d2ba71a3d11a1090959dcfb8fe9d6290_67_0.png)


    函数与方法的区别在于，方法会执行某些任务或操作，而函数则返回关于世界或其对象的某些信息。这些函数提问并返回一个值，该值可以是数字、对象、布尔值（true 或
    false）或其他其他对象类型。


    函数可以可选地以参数（arguments 或 parameters）的形式接收值。然后使用所需的 `return` 语句返回某些值作为输出。每个对象都有内置函数，同时也具备创建新函数的能力。例如，某些函数可以计算一个对象另一个对象之间的距离。另一个示例是返回随机数的函数。第三个示例是计算一个值并将其返回给调用程序的函数。


    ## 复习


    - 5.0.1 函数返回关于世界或其对象的信息。

    - 5.0.2 方法执行某些任务或操作。

    - 5.0.3 使用语句向调用语句返回一个值。


    ## 课程 5.1 – 内置函数 – 世界 (World)


    如果我们查看“世界”（World）对象，可以看到一组通用函数。这些函数与我们在其他对象看到的函数不同。这些函数涉及类别：布尔逻辑、数学、随机数、字符串、询问用户（ask
    user）、鼠标、时间、高级数学和其他。世界函数通常用于可能涉及多个不同对象、用户界面和数学函数的值。图 5.1.1 显示了世界函数的部分列表。


    ![](img/d2ba71a3d11a1090959dcfb8fe9d6290_68_0.png)


    如你所见，有适用于许多不同情况的函数。生成随机数、询问用户数字或字符串、将数字转换为字符串等只是世界函数的几个例子。这些函数适用于许多不同的情况，而且你只能在这里找到这些函数。


    世界函数的一个流行用途是生成随机数。在许多情况下，需要为对象生成随机数。随机数函数**仅**存在于世界函数中。代码示例显示每次执行命令时，汽车向前移动随机的距离（单位为米）。传递给随机函数的参数是最小值
    5，最大值 50，并且仅返回整数值。


    ![](img/d2ba71a3d11a1090959dcfb8fe9d6290_69_0.png)


    随着你对 Alice 的进一步了解，你将发现这些世界函数的更多用途。


    复习


    - 5.1.1 随机数函数仅在函数列表中。

    - 5.1.2 世界函数用于界面。


    ## 课程 5.2 - 其他对象中的内置函数


    大多数其他对象的函数具有相同或相似的函数。这些函数的类别有：接近性（proximity）、尺寸（size）、空间关系、视角和其他。它们回答诸如“这个对象离另一个对象有多？”、“这个对象在另一个对象的左侧还是右侧？”以及关于对象与环境关系的其他类似的问题。


    在代码示例中，我们将警长（sheriff）移动到距离牛仔（cowboy）1 米以内。记住，距离是从警长的中心点到牛仔的中心点的距离。


    ![](img/d2ba71a3d11a1090959dcfb8fe9d6290_70_0.png)


    函数“sheriff distance to cowboy”返回警长点与牛仔中心点之间的距离。因此，在函数结束时，从返回的值中减去 1 米。


    每个对象都有许多函数，以下是包含大多数对象函数的典型部分列表。


    | 函数 | 描述 |

    | --- | --- |

    | sheriff distance | 返回警长与牛仔中心点之间的距离 |

    | sheriff distance | 返回警长与牛仔中心点之间的距离 |

    | sheriff distance | 返回警长与对象左侧之间的距离 |

    | sheriff distance | 返回警长与对象右侧之间的距离 |

    | sheriff distance | 返回警长与对象正面之间的距离 |

    | sheriff distance | 返回警长与对象后部之间的距离 |

    | sheriff distance | 返回警长与对象中心点之间的距离 |

    | sheriff distance | 返回警长与对象中心点之间的距离 |

    | sheriff distance | 返回警长与对象左侧之间的距离 |

    | sheriff distance | 返回警长与对象右侧之间的距离 |

    | sheriff distance | 返回警长与对象正面之间的距离 |

    | sheriff distance | 返回警长与对象后部之间的距离 |

    | sheriff distance | 返回警长与对象中心点之间的距离 |

    | sheriff distance | 返回警长与对象中心点之间的距离 |


    图 5.2.2 - 对象函数


    这些函数在大多数对象中是相同的。记住，函数总是返回一个值。


    复习


    - 5.2.1 世界函数用于界面。

    - 5.2.2 函数回答关于对象的问题。


    ## 课程 5.3 – 创建新函数


    方法方法，你可以为对象创建一个新函数。在某些情况下，某个对象没有你频繁使用的函数，这时就需要创建一个新函数。我们的示例将根据给定的重量（盎司）计算容器中有多少糖果。


    舞台是一个草地世界，带有 People Gallery 的 PJ、Kitchen Gallery 的 GumDrop（糖果），以及 Shapes Gallery
    的包（属性值改为棕色）。


    该游戏的伪代码如下：


    1. Pj 宣布游戏

    2. 询问用户重量（盎司）。

    3. 将重量传递给世界函数 calcDrops

    4. 显示返回的答案


    ![](img/d2ba71a3d11a1090959dcfb8fe9d6290_72_0.png)


    计算糖果数量的世界函数简单地将盎司重量除以糖果的重量。该函数看起来如下：


    ![](img/d2ba71a3d11a1090959dcfb8fe9d6290_72_1.png)


    这是一个简单的函数，但它说明了使用函数进行计算。函数返回传递的参数的内容除以数字字面量 0.05（一个糖果的重量）。


    复习


    - 5.3.1 函数总是返回一个值。

    - 5.3.2 参数是传递给函数的值。


    '
