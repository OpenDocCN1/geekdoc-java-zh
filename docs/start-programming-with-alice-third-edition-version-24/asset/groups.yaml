    ## 2.1 - 放置对象


    向世界中添加对象有两种方法。第一种方法是拖放。


    - 2.0.1 如果选择了一个对象，应该有一个名为 `move` 的方法。如果将其拖动到编辑器区域并释放到文字上，你就可以使用它。

    - 2.0.2 如果选择了一个对象，应该有一个名为 `move` 的方法。如果将其拖动到编辑器区域并释放到文字上，你就可以使用它。

