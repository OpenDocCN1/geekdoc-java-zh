    ## 2.5 - Moving Objects


    Once you have placed your objects, you need to move, turn, and scale them. These
    actions are done using methods.


    - move: moves the object a certain distance.

    - turn: rotates the object around an axis.

    - scale: changes the size of the object.


    ## 2.6 - Using Properties


    Properties are characteristics that describe an object. For example, an object''s
    color, size, and position. You can change these properties using the Properties
    tab.


    - color: changes the color of the object.

    - size: changes the size of the object.

    - position: changes the position of the object.


    ## 2.7 - Using Animations


    Animations are sequences of movements that an object performs over time. You can
    create animations by stringing together methods.


    - addAnimation: adds a new animation to the object.

    - removeAnimation: removes an animation from the object.

    - playAnimation: starts the animation.


    ## 2.8 - Using 3D Text


    Alice allows you to add 3D text to your movie. This is useful for creating titles
    and signs.


    - text: creates a 3D text object.

    - font: changes the font of the 3D text.

    - size: changes the size of the 3D text.

    - color: changes the color of the 3D text.

