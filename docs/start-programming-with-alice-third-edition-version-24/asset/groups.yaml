    ## 示例脚本：


    - 在屏幕上放置 3 个角色

    - 第一个角色上下跳跃三次

    - 第二个角色旋转五次

    - 第三个角色向前移动一米，然后向后移动一米。


    ## 示例分镜：


    ![](img/d2ba71a3d11a1090959dcfb8fe9d6290_23_0.png)


    这只是一个简单电影分镜的快速、粗略示例。没有华丽的艺术性。对于这种短电影来说这并不是必要的，但对于长电影来说是一个非常好的规划工具。记住，我们在电视上看到的所有优秀广告都是从分镜开始的。


