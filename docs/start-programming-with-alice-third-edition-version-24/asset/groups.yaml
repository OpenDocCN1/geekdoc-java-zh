    \ There are some oriental figures and buildings. Use them to create a world of\
    \ ninjas and other objects from the far east.\n\n**City Scene:** Several buildings,\
    \ cars, streets exist in the gallery. Use these to create a city street scene.\n\
    \n**Airport Scene:** Use the airport buildings, runways and airplanes to build\
