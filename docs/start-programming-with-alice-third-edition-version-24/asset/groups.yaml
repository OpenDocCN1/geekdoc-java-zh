    # Lesson 1.1 Alice Tutorials


    Alice comes with four(4) excellent tutorials to help the programmer get started.
    The first time Alice is loaded, the tutorial dialog box should appear. If it does
    not appear to go the menu bar and select Help, then Tutorials. Completing these
    tutorials will familiarize the user with the basics of Alice programming.


    At this point, I recommend the first two tutorials are completed moving to the
    next step. If there are problems with the tutorials repeat them until a comfort
    level with their content has bee achieved. Going through all of the tutorials
    is important, but going through these two tutorials carefully will get the user
    started. Understanding the concepts in these tutorials will help do the exercises
    in future lessons.'
