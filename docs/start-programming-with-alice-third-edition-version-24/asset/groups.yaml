    四个标准教程包括：


    - 溜滑手 (Skater)

    - 守护午睡 (Defending Naptime)

    - 企鹅 (Penguins)

    - 空间 (Space)


    教程 1 - “溜滑手”介绍了 IDE 的基础知识。然后进入如何创建一个基础的 Alice 动画。这个以及其他教程通过引导你完成按键操作和鼠标点击来创建项目，让你练习使用
    Alice。


    教程 2 - “守护午睡”讲述了一个短故事。它演示了对话气泡、声音以及如何创建一个新方法。


    教程 3 - “企鹅”演示了如何让 Alice 响应鼠标点击和按键按下。


    教程 4 - “空间世界”展示了如何创建场景、选择世界以及添加新对象。


    ![](img/d2ba71a3d11a1090959dcfb8fe9d6290_17_0.png)


    图 1.1.1 - Alice 教程对话框


    完成所有这些教程将帮助用户理解 Alice 语言的力量。这些不仅仅是无聊的电影。它们在一个有趣、易用的编程环境中包含了所有编程语言的原理，这在很大程度上防止了新程序员犯许多编程错误。


    回顾：


    1.1.1 Alice 自带了教程。


    1.1.2 你可以通过点击菜单然后来访问教程。


    1.1.3 教程的设计仅演示高级的 Alice 命令。

    ( 正确 / 错误 )


    ## 课程 1.2 对象的属性与方法


    每个对象都有关联的属性、方法和函数。要查看这些内容，请选择要操作的对象。在“对象树”中进行选择。注意，还有“世界 (World)”、“相机 (Camera)”和“光
    (Light)”的选择。这些也是在代码中可以操纵的对象。有些对象旁边有一个 + 号。这意味着该对象是由几个其他对象的组合，这些对象也可以被单独操纵。


    ![](img/d2ba71a3d11a1090959dcfb8fe9d6290_18_0.png)


    Alice 世界中的每个对象都有属性。这些仅仅是描述对象特征的数值。当对象被放置在 Alice 世界中时，它的属性是可以改变的。例如，可以改变对象的颜色。当程序执行时，对象的属性值可能会发生变化。


    ![](img/d2ba71a3d11a1090959dcfb8fe9d6290_19_0.png)


    对象能够执行任务。对象能做的事情被称为方法。其中一种方法是“说 (say)”事情。某些方法可以移动对象上、下、左、右。这些方法通常是对象在现实生活中可以做的事情。企鹅对象可以移动和行走，飞机对象可以移动，但如果设计师赋予它行走的能力。方法与对象在现实世界中的能力保持一致。


    对象经常变得非常复杂，通常对象是由其他对象或对象组构成的。当用户学习 Alice 时，他们会操纵一个对象并发现该对象拆分开了。一个例子可能是人物对象之一。这些是复合对象。头部可以移动，手臂可以移动，腿可以移动，并且必须操纵这些对象的方法，协调对象的每个部分，以便该对象在电影过程中需要进行的模拟活动是真实的。


    重要的是要认识到 Alice 画库 (Gallery) **不是**对象的库。它是**类 (Classes)** 的库。区别在哪里？查看类最好的方法是将其比作一个食谱。它是一个创建一个对象的食谱。这个食谱可能会收集几个对象并将它们作为一个虚拟世界中的一个对象呈现出来。因此，当多个相同的对象被放置在世界中使用时，创建该类的食谱被用于创建同类的多个实例。每个实例都是一个完全独立的对象。


    回顾：


    - 1.2.1 每个对象都有关联的 ________ 和 ________。

    - 1.2.2 对象能做的事情被称为 ________

    - 1.2.3 ________ 是描述对象特征的数值。

    - 1.2.4 查看类最好的方法是将其比作 ________

    - 1.2.5 经常，________是由其他 ________ 构成的


    ## 课程 1.3 尝试这个


    现在是时候从零创建一个 Alice 动画了：


    1. 选择文件 (File) > 新世界 (New World)。

    2. 选择“水 (Water)”世界。

    3. 点击世界区域的“添加对象 (Add Objects)”按钮。

