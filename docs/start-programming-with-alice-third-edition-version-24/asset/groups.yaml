    | Loop | index from 0 | up to (but not including) 10 times | incrementing by 2
    |

    |---|---|---|---||

    | aliceidal | move up | 1 meter | more... | |

    | aliceidal | move down | 1 meter | more... |


    Figure 3.1.3


    The user could substitute a variable for any of the values and use the contents
    of the variable to control the starting point, the ending point or the value.


    In Review


    3.1.1 The repetition structure may be used when an object is to do something a
    certain number of times.


    3.1.2 The user could substitute a for any of the values and use the contents of
    the variable to control the starting point, the ending point or the value.


    3.1.3 Changing the incrementing by value to a causes the index to count from a
    larger number to a smaller number.


    # Lesson 3.2 Coding Counter Loops


    +   1. Select a Grass World

    2. Select the Socrates object from the People Gallery

    3. Click on Done

    4. Drag the Loop icon to the Method Editor

    5. Choose "Infinity Times"

    6. Now, Move Socrates forward 1 meter.

    7. Move Socrates backward 1 meter.

    8. After the loop structure add the command to turn Socrates 1 revolution.

    9. PLAY

