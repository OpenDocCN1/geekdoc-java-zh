    # Lesson 4.2 Create a Custom Class-Level Method


    Create "Sand World" and place the ToySoldier Class from the People Gallery on
    the sand. Now, click on Done and begin a method that will make the soldier March
    across the sand. If the forward method was used alone, the soldier would kind
    of float across the sand and would not look like he is marching. This method will
    add some reality to this simple little movie.


    Now, select the ToySoldier object and click on the methods tab in the Details
    Panel. Click on the button to create a new method, the new method "march". Look
    in the object tree at the ToySoldier object and note the plus sign (+) to the
    left of the name of the class. This indicates that class is made up of several
    other classes. If the plus sign is selected, these classes will be displayed.
    Each of these sub classes also have properties, methods and functions attached
    to them. It is necessary to use several of the sub classes of the ToySoldier,
    leftLeg, rightLeg, leftArm and rightArm.


    The contents of the method are four "Do Together" sequences. In each sequence
    the soldier will move forward .25 meters, move his leftLeg, rightLeg, leftArm
    and rightArm in an appropriate distance. The legs and arms will "turn" .1 (note
    it is point 1) revolutions in each instruction over a duration of .5 (note it
    is point 5) seconds. Let''s examine the code that makes this all happen.


