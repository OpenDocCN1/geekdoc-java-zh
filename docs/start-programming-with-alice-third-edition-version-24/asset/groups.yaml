    # PROGRAMMING WITH ALICE\n\n# INTRODUCTION\n\nI am a programmer who turned teacher.\
    \ I see a need in my own classroom for a text with lots of examples that take\
    \ a student through creating Alice movies, step by step. Hands on is the way to\
    \ learn programming and this text is designed to facilitate the students hands\
    \ on experience.\n\n# FOR THE INSTRUCTOR\n\nI began this work with Alice. Alice\
    \ is a great environment for teaching programming because it is visual and interactive.\
    \ However, it can be overwhelming for beginners. I have designed this book to\
    \ help you guide your students through the process.\n\nIf you use this book in\
    \ your class, I recommend following the lessons in order. However, you may also\
    \ skip ahead or use the step-by-step exercises to meet your students' needs.\n\
    \n# FOR THE STUDENT\n\nProgramming can be difficult at first, but don't be discouraged.\
    \ This book will help you learn the basics of Alice. Follow the lessons, complete\
    \ the exercises, and don't be afraid to make mistakes. The more you practice,\
    \ the better you will get.\n\n# SUPPLEMENTS\n\nIt is my intention to supplement\
    \ this book with a web page. This way I can provide updates to the material on\
    \ moments notice. We are teaching in a field where change is good, frequent and\
    \ when printed copy does not stand the test of time. Test banks will nice, often\
    \ leave the instructor explaining why a question was wrong. Sometimes I have found\
    \ that I agree with the student and have no rationale as why the test bank had\
    \ a different answer. So, don't expect fancy test banks. Perhaps some questions\
    \ that I use in my classes but in a format the instructor can modify their own\
    \ satisfaction. Programming Exercises as I come up with new material would be\
    \ included in a supplemental web page.\n\n# SUMMARY\n\nI am a programmer who turned\
    \ teacher. I see a need in my own classroom for a text with lots of examples that\
    \ take a student through creating Alice movies, step by step. Hands on is the\
    \ way to learn programming and this text is designed to facilitate the students\
    \ hands on experience. This text gives the theory in text for reference or reading,\
    \ then examples written to lead a student through practicing the theory with step\
    \ by step examples. So, here is my attempt to teach Alice Programming, Step-by-step.\n"
