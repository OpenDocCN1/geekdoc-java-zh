    - 2.0.5 如果选择了一个对象，应该有一个名为 `move` 的方法。如果将其拖动到编辑器区域并释放到文字上，你就可以使用它。


    ## 2.2 - 单对象视图


    当你选择一个对象时，可以在单视图中查看它。该视图显示对象的前面。


    ![](img/d2ba71a3d11a1090959dcfb8fe9d6290_25_0.png)


    ## 2.3 - 四分视图


    四分视图允许你同时从四个角度查看对象。对于在世界中定位对象非常有帮助。


    ![](img/d2ba71a3d11a1090959dcfb8fe9d6290_27_0.png)


    ## 2.4 - 摄像头视图


    摄像头视图从摄像头的视角向你展示世界。这对于规划电影的效果非常有用。


    ![](img/d2ba71a3d11a1090959dcfb8fe9d6290_27_0.png)


    ## 2.5 - 移动对象


    放置对象后，你需要移动、旋转和缩它们。这些操作是通过方法完成的。


    - move：移动对象一段距离。

    - turn：绕轴旋转对象。

    - scale：改变对象的大小。


    ## 2.6 - 使用属性


    属性是描述对象的特征。例如，对象的颜色、大小和位置。你可以通过属性选项卡更改这些属性。


    - color：改变对象的颜色。

    - size：改变对象的大小。

    - position：改变对象的位置。


    ## 2.7 - 使用动画


    动画是对象随时间执行的一系列动作。你可以通过组合方法来创建动画。


    - addAnimation：为对象添加新动画。

    - removeAnimation：从对象中移除动画。

    - playAnimation：开始动画。


    ## 2.8 - 使用 3D 文本


    Alice 允许向你的电影添加 3D 文本。这对于创建标题和标牌有用。


    - text：创建一个 3D 文本对象。

    - font：更改 3D 文本的字体。

    - size：改变 3D 文本的大小。

    - color：改变 3D 文本的颜色。

