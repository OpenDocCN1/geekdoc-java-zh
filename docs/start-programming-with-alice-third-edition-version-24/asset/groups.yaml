    # Lesson 3.6 – Lists


    Alice has the ability to create a variable as a list. List variables have the
    ability to store multiple items of the same data type. The list can then be used
    to step through the items one at a time, having that item perform some task. One
    rule is that your list can contain any objects. They do not need to be all the
    same. Another is that all items in the list be of the the same data type.


    Our example for this lesson is to build a water world for three boats.


    ![](img/d2ba71a3d11a1090959dcfb8fe9d6290_53_0.png)'
- md: "\nLine up three sailboats facing the camera. The first boat is on the left,\
    \ the second in the middle and the third on the right. The objective of the movie\
    \ is to have each sailboat turn right one quarter turn and sail off the screen.\
    \ Instead of instructions to do this, we set up a list of boats and each sails\
    \ off in turn.\n\nTo set up the list variable we need to create a new variable.\
    \ Because it may be used throughout the movie, we need to set up a variable under\
    \ the world object. Select the object in the object tree and then go to the properties.\
    \ Click on “create a new variable” and get the dialog box in Figure 3.6.2. Name\
    \ the variable, select the object radio button, click on the checkbox to the left\
    \ of “make a” and make sure the list contains “List”. Then click on the “new item”\
    \ button three times. Then for item0’s None, click on the drop-down arrow and\
    \ select the first sailboat. Then repeat for the second and third sailboats. When\
    \ complete, your dialog box should look like Figure 3.6.2. If all is ok, click\
    \ on OK.\n\n![](img/d2ba71a3d11a1090959dcfb8fe9d6290_54_0.png)\n\nNow we can use\
    \ the variable in our code. The “For all in order” structure executes the commands\
    \ for all items in the list in sequence. All the commands for the first item,\
    \ all the commands for the next item, and continues until the list is finished.\
    \ Grab the tile “For all in order” from the bottom of the event panel. Select\
    \ the boat list by selecting the boat.boatList. Now, we have a loop structure\
    \ to carry our commands to be done by each member of the list.\n\nNote there is\
    \ no object in the object tree, so where do we get the method to move our sailboats?\
    \ Easy, look in the code line that begins with “For all...”. There is an object\
    \ variable named item_from_boatList. Drag this down one line to the “Do Nothing...”\
    \ area. Select turn, right and 0.25 revolutions. Repeat this process using the\
    \ move method, forward and 100 meters.\n\n## world.my first method\n\nworld.my\
    \ first method (No parameters)\n\nSA variables:\n- For all world.boat.list, one\
    \ one Item_from_boat.List at a time\n- item_from_boat.list turn right 0.25 revolutions\
    \ more...\n- item_from_boat.list move forward 100 meters more...\n\nFigure 3.6.3\n\
    \nPlay the movie and watch your boats turn to their right and sail off the screen.\n\
    \n![](img/d2ba71a3d11a1090959dcfb8fe9d6290_55_0.png)\n\nFigure 3.6.4\n\nIf the\
    \ boats don't sail in the correct order, you can fix the order in the list variable.\
    \ The other command for list processing is the \"For All Together...\" command.\
    \ This is used when all members of the list should act at the same time. Our example\
    \ for this is a simple \"Chicken Dance.\"\n\n![](img/d2ba71a3d11a1090959dcfb8fe9d6290_55_1.png)\n\
    \nFigure 3.6.5\n\nWe have three chickens in a row. The code begins with selecting\
    \ the tile \"For All Together...\" from the tiles across the bottom. Using the\
    \ same procedure as was used for \"For all in order...\", build the movements\
    \ for the dance.\n\n## world.my first method\n\nworld.my first method (No parameters)\n\
    \nNo variables:\n\n```\nFor all world.chix every Item_from_chix together\n  Do\
    \ together\n    item_from_chix turn right 0.25 revolutions more...\n  Do together\n\
    \    item_from_chix turn left 0.25 revolutions more...\n  Do together\n    item_from_chix\
    \ turn to face camera more...\n  Do together\n    item_from_chix set color to\
    \ more...\n```\n\nFigure 3.6.6\n\nJust some simple movements to illustrate the\
    \ dance may begin. Turning yellow at the end was just added to illustrate property\
    \ changes for all items in the list.\n\n## In Review\n\n3.6.1 Variables have the\
    \ ability to store multiple items.\n\n3.6.2 The structure executes the commands\
    \ for all items in the list in sequence.\n\n3.6.3 The structure is used when all\
    \ members of the list should act at the same time.\n\n## Lesson 3.7 – Arrays\n\
    \nAn array is like a list. It is used to hold a group of like items. It has a\
    \ fixed size and once it has been filled you can't add any new items. An array\
    \ is composed of a group of elements. An element is a storage place for each item\
    \ in the array.\n\nWhen you insert an item into an array, it does not shift in\
    \ position in a list. In an array, you insert the value into a specific element\
    \ where it remains until changed, or deleted.\n\nThe first element in an array\
    \ is item0, the second, item1, the third item and so on. To create an array, click\
    \ on \"create new variable\" button in the object or method where you want to\
    \ create the array. Name the variable, select the type of item you want to store\
    \ in the array. Then click on the \"make a\" option and select Array in the drop-down\
    \ list. The dialog box will expand to allow you to Add New Items. Add as many\
    \ items as you need to put in the array.\n\n![](img/d2ba71a3d11a1090959dcfb8fe9d6290_57_0.png)\n\
    \nFigure 3.7.1\n\nThe array is listed in the object or method where it was created.\
    \ The next to it indicates it is an array.\n\n![](img/d2ba71a3d11a1090959dcfb8fe9d6290_58_0.png)\n\
    \nFigure 3.7.2\n\n## In Review\n\n- 3.7.1 Array is like a list. It is used to\
    \ hold a group of like items.\n- 3.7.2 An array is composed of a group of elements.\n\
    - 3.7.3 An element is a storage place for each item in the array.\n- 3.7.4 When\
    \ you insert an item into an array, it does not shift in position.\n- 3.7.5 An\
    \ array has a fixed size and once it has been filled you can't add any new items.\n"
  mdcn: "\n将三只帆船面向摄像头对齐。第一只船在左侧，第二只在中间，第三只在右侧。这段动画的目标是让每艘帆船向右转四分之一圈并驶出屏幕。我们没有使用指令来操作，而是设置了一个船只列表，让它们逐一离开。\n\
    \n要设置列表变量，我们需要创建一个新变量。因为可能在整个动画中使用它，我们需要在世界对象（world object）下设置变量。在对象树中选择该对象，然后进入属性（properties）。点击“创建一个新变量”（create\
    \ a new variable），弹出图3.6.2所示的对话框。命名变量，选择对象单选按钮，点击“制作”（make a）左侧的复选框，并确保列表包含“List”。然后点击三次“新建项目”（new\
    \ item）按钮。然后对于 item0 的 None，点击下拉箭头并选择第一只帆船。对第二只和第三只帆船重复此操作。完成后，你的对话框应该看起来像图3.6.2。如果一切无正常，点击确定。\n\
    \n![](img/d2ba71a3d11a1090959dcfb8fe9d6290_54_0.png)\n\n现在我们可以在代码中使用该变量了。“按顺序全部”（For\
    \ all in order）结构会按顺序执行列表中所有项的命令。第一个项目的所有命令、下一个项目的所有命令，依此类推，直到列表结束。从事件面板底部抓取“按顺序全部”瓷块。通过选择\
    \ `boat.boatList` 来选择船只列表。现在，我们有了一个循环结构来承载列表每个成员要执行的命令。\n\n注意，对象树中没有对应的特定对象，那么我们从哪里获取移动帆船的方法呢？很简单，看以“For\
    \ all...”开头的代码行。有一个名为 `item_from_boatList` 的对象变量。将其向下拖动一行到“无操作...”（Do Nothing...）区域。选择旋转（turn）、右（right）和0.25圈。重复此过程，使用移动方法（move）、向前100米。\n\
    \n## world.my first method\n\nworld.my first method（无参数）\n\nSA 变量：\n- 对于所有 world.boat.list，一次处理一个\
    \ Item_from_boat.List\n- item_from_boat.list 向右旋转 0.25 圈...\n- item_from_boat.list\
    \ 向前移动 100 米...\n\n图3.6.3\n\n播放动画，观察你的船向右转动并驶出屏幕。\n\n![](img/d2ba71a3d11a1090959dcfb8fe9d6290_55_0.png)\n\
    \n图 3.6.4\n\n如果船没有按照正确的顺序航行，你可以在列表变量中修复顺序。处理列表的另一个命令是“全部一起...”（For All Together...）命令。这用于列表中的所有成员应该同时行动的情况。我们的这个示例是一个简单的“小鸡舞”。\n\
    \n![](img/d2ba71a3d11a1090959dcfb8fe9d6290_55_1.png)\n\n图 3.6.5\n\n我们有一排三只小鸡。代码从底部横排瓷块中选择“全部一起...”瓷块开始。使用与处理“按顺序全部...”相同的步骤，构建舞蹈动作。\n\
    \n## world.my first method\n\nworld.my first method（无参数）\n\n无变量：\n\n```\nFor all\
    \ world.chix every Item_from_chix together\n  Do together\n    item_from_chix\
    \ turn right 0.25 revolutions more...\n  Do together\n    item_from_chix turn\
    \ left 0.25 revolutions more...\n  Do together\n    item_from_chix turn to face\
    \ camera more...\n  Do together\n    item_from_chix set color to more...\n```\n\
    \n图 3.6.6\n\n这只是一些简单的动作，用来说说明舞蹈可以开始。最后变成黄色只是为了说明列表中所有项的属性变化。\n\n## 回顾\n\n3.6.1\
    \ 变量具有存储多个项的能力。\n\n3.6.2 该结构按顺序执行列表中所有项的命令。\n\n3.6.3 当列表中的所有成员应该同时行动时使用该结构。\n\n\
    ## 课程 3.7 – 数组 (Arrays)\n\n数组就像列表。它用于存储一组同类型的项目。它具有固定的大小，一旦填充，你就不能再添加任何新项。数组由一组元素组成。元素是数组中每个项的存储位置。\n\
    \n当你向数组插入一个项时，它的位置不会像列表中那样发生移动。在数组中，你将值插入到特定的元素中，它将保持在那里直到被更改或删除。\n\n数组中的第一个元素是\
    \ item0，第二个是 item1，第三个依此类推。要创建一个数组，请在想要创建数组的对象或方法中点击“创建新变量”按钮。命名变量，选择你想存储在数组中的项类型。然后点击“制作”（make\
    \ a）选项并在下拉列表中选择“数组”（Array）。对话框将展开，允许你“添加新项目”。根据需要向数组添加尽可能多的项。\n\n![](img/d2ba71a3d11a1090959dcfb8fe9d6290_57_0.png)\n\
    \n图 3.7.1\n\n数组列在创建它的对象或方法中。旁边的标识表明这是一个数组。\n\n![](img/d2ba71a3d11a1090959dcfb8fe9d6290_58_0.png)\n\
    \n图 3.7.2\n\n## 回顾\n\n- 3.7.1 数组就像列表。它用于存储一组同类型的项目。\n- 3.7.2 数组由一组元素组成。\n- 3.7.3\
    \ 元素是数组中每个项的存储位置。\n- 3.7.4 当向数组插入一个项时，它的位置不会发生移动。\n- 3.7.5 数组具有固定的大小，一旦填充，你就不能再添加任何新项。\n"
