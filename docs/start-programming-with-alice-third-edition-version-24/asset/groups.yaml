    # 额外练习应用题


    ## 练习 1：


    创建一个 Alice 世界，其中一个人坐在独划舟上大喊“救命！”，同时两只鲨鱼绕着船游动。确保两只鲨鱼同时绕船游动。此外，确保更改一些默认设置以控制鲨鱼绕船游动的速度的速度。


    ## 练习 2：


    创建一个包含任何具有 `turn` 方法对象的的世界。当世界首次开始时，询问用户他们想要该对象旋转的次数。如果该数字小于 10，则使用 `turn` 方法让对象旋转相应的次数。如果数字为
    10 或更多，对象应该说“旋转超过 10 次让我感到不舒服！”


    ## 练习 3：


    创建一个拥有若干游乐设施的游乐公园。激活这些设施进行旋转或转向，并在场景中加入若干个人对象和其他游乐活动。让鼠标移动相机以从不同的视角展示整个公园。使用 `billboard`（告示板）对象在公园周围创建标牌。


    ## 练习 4：


    创建一个包含岛屿和一条鱼的海洋世界。鱼应该绕着岛屿游动（鱼身体的一部分应该在水面以上，这样你可以看到它在游动）。程序应该询问用户 1 到 6 之间的鱼的数量，相应的鱼应该绕着岛屿游动十（10）圈。


    ## 练习 5：


    创建一个带有 `Lake` 类实例（来自环境集合）和 `IceSkater` 类实例（来自人物集合）的世界。编写 `IceSkater` 程序让她在湖面上绕圈滑冰。当程序启动时，它应该询问用户她应该绕湖几圈，以及是否在每次完成一圈后进行跳跃。滑冰者应该按照输入的次数绕圈，并在每圈结束时跳跃。


    ## 练习 6：


    编写包含以下元素的自定义故事：


