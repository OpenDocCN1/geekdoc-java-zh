    # Alice 2.3/2.4 Programming Language


    ## Alice Overview


    Objectives:


    - Describe the concept of the Alice Programming Language

    - Explain how to obtain and install Alice

    - Use the Alice Tutorials


    ## Lesson 0.0 - Overview of Alice


    Alice Versions 2.2, 2.3 and Alice 2.4, versions of Alice programming software
    that will put you into the world of 3-D animation. The surprise is how quickly
    one can master the art of creating animated movies or 3-D games. Developed by
    Carnegie Mellon University by faculty Randy Pausch, Wanda Dann and Steven Cooper.
    It was named after Lewis Carroll''s book, "Alice in Wonderland" and reflects Mr.
    Carroll''s mathematical background.


    Wait, let me re-read

    Finally, a programming language that is simple and above all FUN! Alice was developed
    for the beginning programmer. Alice is used at both the high school and university
    level. It was designed to generate young women, particularly interested in programming.
    It is also a great way to start to master the skills of 3-D programming for a
    future in creating virtual reality, animated movies, special effects in movies
    and other popular computer games.


    Why study Alice? Alice is not a "real world" programming language. Applications
    are not and never will be written in Alice. Then, what is the purpose of Alice?
    Alice was designed to teach the principles of programming without the encumbrance
    of syntax error. Plus, it was designed to be fun and learning is always supposed
    to be fun. Results may not be as as Halo or Hollywood, but with a little effort
    the beginner can show off pretty amazing 3-D virtual worlds.


    In Alice, the programmer creates a world and then populates the world with various
    objects. If the movie takes place in the city, one would populate the world with
    buildings, streets, signs, etc. The programmer can animate many of these objects
    and make various actions that would be done by a similar object in the ''real
    world''. For example: make a soldier march, a skater skate across the pond and
    twirl and jump, a car move the highway, a space ship take off and many other actions
    for various objects.


    Learn to use Alice by telling a story. Compose a short story and then tell this
    story using Alice. There are examples of teachers using Alice to illustrate their
    courses. Alice can be used to teach a language, teach a math problem, used in
    science and physics. The potential is endless. For some examples of how Alice
    has been used there are some programs on YouTube and on other related web sites.


    ## Lesson 0.1 – How To Get Alice


    Another great feature of Alice is that it is FREE. Yes, it can be downloaded from
    www.alice.org at no cost. Once the Alice zip file is downloaded, it must be unzipped.
    It will create an Alice folder with a sub folder named “Required” and executable
