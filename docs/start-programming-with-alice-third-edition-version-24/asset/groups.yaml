    ## 第 2.3 节 - 变量


    变量是每种编程语言中至关重要的元素。它是可以用于存储一段信息的内存区域。在程序中，创建一个变量来存储某些信息，并对其命名，以便程序员可以在各种处理指令中使用该数据。变量的内容可以在各种程序指令中用于计算、显示或更改。因此，变量是数字、字符串、对象等其他内容的存储位置。它存储这些对象，以便它们可以在程序的处理中被使用。


    与其他其它编程语言一样，变量分为四类：


    - **局部变量**（Local Variables）：它们属于一个特定的方法，并且只能由属于该方法的指令使用。

    - **参数变量**（Parameter Variables）：用于保存在调用方法时传递给该方法的参数。

    - **类级变量**（Class-Level Variables）：类似于属于特定对象和该对象实例的属性。

    - **世界级变量**（World-Level Variables）：类似于属于世界的属性。


    每个变量都必须使用以下规则创建一个一个名称：


    - 在其作用域内（局部、世界、类、参数）必须是唯一的。

    - 名称应具有意义。

    - 使用驼峰命名命名法（camelCase）。


    变量的类型包括：


    - **数字**（Number）：存储数字，任何数字。

    - **布尔值**（Boolean）：存储真或假。

    - **对象**（Object）：存储一个对象。

    - **其他**（Other）：更具体的类型，如：字符串、声音、颜色等。


    一旦创建了变量，就必须建立一个初始值。

    创建变量的步骤：


    1. 在方法编辑器（Method Editor）中，点击 **create new variable**（新建变量）按钮。

    2. 在 **Create New Local Variable**（新建局部变量）对话框中，输入变量名称。

    3. 选择数据类型。

    4. 输入初始值。

    5. 点击 **OK** 按钮。

    6. 变量瓦块应该出现在方法编辑器的变量区域。


