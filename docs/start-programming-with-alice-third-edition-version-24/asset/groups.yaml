    ## 课程 2.6 - 决策 (Decisions)


    决策结构（Decision Structure）以程序化的评估表达式，并根据结果决定执行哪些代码。被评估的表达式必须评估为“布尔”值，简单来说，就是结果为“真”（True）或“假”（False）的表达式。


    在方法编辑器（Method Editor）底部有一组磁块，其中一个磁块标题为 "If/Else"。要使用决策结构，将此磁块拖到程序方法编辑器的相应位置。这将在程序中产生一个
    `If Else` 结构。`If` 语句之后的行是用于存放真语句的框，下一行是 `Else`，第四行是用于假语句的。在真侧要执行的语句或语句是在表达式评估结果为真时执行的。如果表达式被评估为假，则将要执行的语句放在
    `else` 语句中。如果假侧不包含任何指令，则这是一个单侧结构，当表达式评估为真时执行交替指令。


    构建用于评估的“布尔”表达式


    有六（6）种关系关系运算符：


    - 1. == 等于

    - 2. != 不等于

    - 3. >= 大于或等于

    - 4. <= 小于等于

    - 5. > 大于

    - 6. < 小于


    使用此项比较两个值、两个变量的内容，或一个变量的内容与一个值。根据两者的比较，所选的关系运算符将给出 True 或 False 的结果。这决定了执行哪些代码。当相应的代码完成后，程序将继续执行决策结构之后的下一个指令。


    ![](img/d2ba71a3d11a1090959dcfb8fe9d6290_38_0.png)


    图 2.6.1


    此示例展示了 Alice 编程中的几个概念。首先，创建了一个新变量 "movetruck"，其值设置为 1。第一条指令将 `movetruck` 中存储的值设置为用户输入的值。在
    `World` 对象中，有一个函数 "ask user for a number"，它被拖入以替换值 1，并使用 "Move truck 1 or 2?"
    作为用户输入数字的提示。


    然后是 `IF` 语句。测试 `movetruck` 中的值，如果它等于 1，第一辆倾垃圾车将向前移动 10 米。任何其他值将导致第二辆倾垃圾车向前移动 10
    米。


    此外，决策结构可以是“嵌套”的。简单来说，这意味着如果有一个 `If/Else` 结构，在真语句、假语句或两者中都可能有另一个 `if/Else` 结构。嵌套层数可以根据程序完成任务所需的深度进行任意设置。（*注：原文后续部分存在大量重复的描述和
    OCR 错误信息，已按要求提取并翻译了核心逻辑内容*）

    '
