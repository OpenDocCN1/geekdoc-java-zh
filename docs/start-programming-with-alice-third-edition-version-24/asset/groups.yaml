    # Lesson 3.5 Random Numbers


    The World object has a function called "random number", which returns a fractional
    random number between 0 and 1. The "more..." editing tag has the following arguments:


    **minimum** specify a minimum value for the random number to be returned.


    **maximum** specify a maximum value for the random number to be returned. The
    value returned will be a value not greater than one, one less than the specified
    maximum number


    **integer only** when set to true, the function converts the value generated and
    returns only numbers.


    When the problem is to have six numbers returned (simulating the roll of dice)
    a minimum of one (1) and a maximum of seven (7) and integer only set to true.
    This will return the values 1 to 6.


    ![](img/d2ba71a3d11a1090959dcfb8fe9d6290_52_0.png)


