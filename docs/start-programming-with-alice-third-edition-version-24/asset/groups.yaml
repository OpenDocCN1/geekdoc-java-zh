    instructions are to be repeated. This builds a counter controlled loop. Generally
    this is written as a “For” loop in most programming languages


    This type of loop may be used when an object is to do something a certain number
    of times. For Example: when programming an ice skating scene and the skater is
    to turn around three times. Either write three turn statements or simplify by
