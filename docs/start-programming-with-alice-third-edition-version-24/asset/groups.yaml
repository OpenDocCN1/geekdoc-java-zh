    # 第 6.0 节 – 事件概述


    事件是 Alice 世界播放时发生的动作。Alice 世界能够识别某些事件并对其做出响应。这对于其他实现“事件驱动”编程的语言（如 Visual Basic.NET
    和其他“视觉”语言）来说也同样重要。


    “事件编辑器”（Event Editor）位于屏幕的右上角。当 Alice 世界首次打开时，此区域将列出一个事件。当电影开始时，“world.my method”是默认调用的方法。


    Alice 检测到的事件：


    - 当世界开始时

    - 按键

    - 点击某个对象

    - 当条件为真时

    - 变量变化

    - 让 <object> 移动

