    ## 课程 2.5 - 共同执行 (Do Together) / 按顺序执行 (Do In Order)


    当需要两个或多个对象同时移动时，就会使用 `Do Together` 结构。`Do Together` 结构使得结构内包含的所有指令同时执行。这允许程序员让几件事同时发生。


    下面展示了一个使用 `Do Together` 的良好示例。汽车和司机是两个需要同时以相同速率、相同距离移动的对象。


    ![](img/d2ba71a3d11a1090959dcfb8fe9d6290_36_0.png)


    图 2.5.1


    汽车对象和 `randomGuy` 对象同时向前移动，距离和速度相同。如果这些指令不在 `Do Together` 结构中，汽车将先移动，然后司机移动，这看起来就不像某人在开车。


    `Do in Order` 结构是将按特定顺序发生的指令进行分组的方法。当程序员需要确保一组指令按照精确顺序处理时，就会使用它。`Do in Order`
    结构在程序中是隐含的，但在某些情况下，需要将此结构嵌套在另一个结构中以实现所需的动作。


    ![](img/d2ba71a3d11a1090959dcfb8fe9d6290_37_0.png)


    图 5.2


    在我们的示例中，两个男孩一起绕着灯塔跑，但两个僵尸尽管在 `Do Together` 结构内部，仍逐个出现在屏幕上。


