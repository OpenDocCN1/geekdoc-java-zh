    # Alice Step-By-Step 13\n\nExercise Uses:\n\n- Select a world\n- Select Objects\n\
    - Single View / Quad View\n- Methods\n  - play sound\n  - turn\n\n**Open Alice**\
    \ and click on **Templates tab**.\nSelect Sand and click Open\nFrom the Old West\
    \ Gallery Select:\nSaloon\nCowboy\n\n![](img/d2ba71a3d11a1090959dcfb8fe9d6290_118_0.png)\n\
    \nYou will need your favorite cowboy song in .mp3 format. The cowboy will sing\
    \ your song and move his arms. The movement is not very sophisticated but you\
    \ can improve on this as you improve your Alice skills.\n\nCODE:\n\n![](img/d2ba71a3d11a1090959dcfb8fe9d6290_119_0.png)\n\
    \nYou will need to coordinate the timing and duration of the cowboy's movements\
    \ to go with the length of the song. This is perhaps the most difficult part of\
    \ creating the movie. Note that in the code, the duration of the movie is displayed.\n\
    \n# Alice Step-By-Step 14\n\nExercise Uses:\n\n- Select a world\n- Select Objects\n\
    - Single View / Quad View\n- Methods\n  - move\n  - turn\n\nOpen Alice and click\
    \ on Templates tab.\nSelect Grass World and click Open\nFrom the City Gallery\
    \ Select:\nBuildingCluster1\nBuildingCluster2\nBuildingCluster3\nBuildingCluster4\n\
    BuildingCluster5\nChurch\n\nFrom the Vehicles Gallery Select:\nAny car, I selected\
    \ Wagon for my movie.\n\n![](img/d2ba71a3d11a1090959dcfb8fe9d6290_120_0.png)\n\
    \nArrange the BuildingCluster1-5 in a row with the Church at the end. They need\
    \ to be in a straight line so you will need the quad view to line them up properly.\
    \ My example moves the car from right to left so I put the car at the right end\
    \ of the line of buildings and adjusted the camera. Now, experiment to move the\
    \ car along the front of the buildings moving the camera to keep the movement\
    \ in the screen. This takes some experimentation to make the whole movie run smoothly.\n\
    \n![](img/d2ba71a3d11a1090959dcfb8fe9d6290_121_0.png)\n\n![](img/d2ba71a3d11a1090959dcfb8fe9d6290_121_1.png)\n\
    \n![](img/d2ba71a3d11a1090959dcfb8fe9d6290_121_2.png)\n\nAfter you master this\
    \ you can also add the city landscape with streets, etc. to make it more realistic.\
    \ It is useful just to play with something like this to learn how camera movement\
    \ and object movement need to be coordinated.\n\n![](img/d2ba71a3d11a1090959dcfb8fe9d6290_122_0.png)\n\
    \nIn the Object Tree Select the World Object.\nUnder properties select \"New Variable\"\
    \nName: DragonDance\nCheck \"make a\" and select LIST from the dropdown.\nAdd\
    \ each dragon to the list\nClick on OK\n\nSelect tab for World Methods\nClick\
    \ on “Create Method”\n\nName the new method “dance”\nDrag For all in Order to\
    \ the methods editor.\nSelect expression...\nSelect world.Dragon.Dance\nDrag the\
    \ item_from_DragonDance down to the “Do Nothing”\nSelect turn left 1 revolution.This\
    \ makes the dragons turn around one revolution, one at a time\n\nNow, have the\
    \ Dragons move backward 5 meters, one at a time.\n\nThe next two steps use the\
    \ For all Together tile.\nHave the dragons move up and down 1 meter, all at the\
    \ same time.\nHave the dragons turn forward one complete revolution, all at the\
    \ same time.\n\nNow drag the new method to the event editor “When the World starts\
    \ do” to replace “My First Method” with the new “dance” method.\n\nMost of our\
    \ movies have begun with “My first method” and then called other methods. This\
    \ movie demonstrates that you can begin your movie with another method as well.\
    \ This gives the producer more flexibility in running the movie.\n\nSee the code\
    \ example below to check your code before running the movie.\n\n![](img/d2ba71a3d11a1090959dcfb8fe9d6290_124_0.png)\n\
    \nPLAY the Movie and when it starts, the dance should begin.\n\n# OTHER IDEAS\
    \ FOR PROJECTS\n\nAlice Exercise Topics\n\nIf you can't think of something for\
    \ an Alice movie, here are some ideas:\n\n**Favorite Movie:** Create a scene from\
