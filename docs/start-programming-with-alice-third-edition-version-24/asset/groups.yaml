    \ Functions\n- Single View / Quad View\n- Methods\n\nmove toward\nmove down\n\
    move forward\n\nThis exercise creates a movie where a spider object moves to a\
    \ space ship object. The code moves parts of the legs in the proper sequence to\
    \ simulate life-like movement of the legs.\n\n# Spider Jr.\n\n![](img/d2ba71a3d11a1090959dcfb8fe9d6290_106_0.png)\n\
    \n- Line up Spider and Lunar lander as shown in picture 1\n- Picture 2 shows the\
    \ result\n- Using the code provided, recreate this scene.\n- The spider moves\
    \ towards the lunar lander, I looped 8 times, you may have to adjust this for\
    \ your spacing of the two objects.\n- You may need to experiment some but this\
    \ simulates leg movement.\n\nThis is the code for Spider Jr.\n\n```\nworld.my\
    \ first method ()\nNo variables\nspiderRobot turn to face lunarLander\nLoop 8\
    \ times times\nDo together\n  spiderRobot move amount = 1 meter target = lunarLander\
    \ duration = 0.5 seconds style = abruptly\n  Do in order\n    spiderRobot.body.backLeftLegBase.upperJoint\
    \ turn forward 0.1 revolutions duration = 0.5 seconds\n    spiderRobot.body.backLeftLegBase.upperJoint\
    \ turn backward 0.1 revolutions duration = 0.5 seconds\n  Do in order\n    spiderRobot.body.frontRightLegBase.upperJoint\
