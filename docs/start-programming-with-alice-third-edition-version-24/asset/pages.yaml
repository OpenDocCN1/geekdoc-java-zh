  md: '# OTHER IDEAS FOR PROJECTS


    Alice Exercise Topics


    If you can''t think of something for an Alice movie, here are some ideas:


    **Favorite Movie:** Create a scene from your favorite movie.


    **How To:** Using Alice objects illustrate how to do something.


    **Lesson:** Teach a short lesson using Alice.


    **Moon World:** The Space collection in the Web Gallery provide several space
    related classes. Create your own moon world with a moon surface, astronauts, lunar
    lander, etc.


    **Medieval Scene:** In the Gallery there is a Medieval Collection of classes.
    Create a world of dragons, knights, princesses and castles.


    **Oriental Scene:** There are some oriental figures and buildings. Use them to
    create a world of ninjas and other objects from the far east.


    **City Scene:** Several buildings, cars, streets exist in the gallery. Use these
    to create a city street scene.


    **Airport Scene:** Use the airport buildings, runways and airplanes to build an
    airport.


    **School Scene:** There are a lot of school objects in Alice 2.2. Use them to
    create a scene at school or in the gym.


    **Underwater World:** create an underwater world of fishes and scuba divers.


    **Arctic World:** Create a snow world with classes that is filled with classes
    appropriate for this venue.


    **Holiday Scene:** There are a number of holiday objects, create a scene for your
    favorite holiday.'
