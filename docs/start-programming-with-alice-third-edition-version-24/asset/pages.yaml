    # Lesson 4.0 - Overview of Methods


    While the various classes include many methods (things they can do), there are
    other things that could be included as methods that would streamline our programming.
    So, if a class does not have a method to perform a certain task, and the task
    will be done repeatedly in the program or perhaps in other programs, the programmer
    needs to create a new method. Alice allows the programmer to create custom methods
    for a class.


    This lesson is to learn how to create class-level methods in Alice. The penguin
    object has a walk method. This method, when invoked, simulates the penguin walking
    across the stage. Other objects do not have a similar method. So, when Aliceiddel
    moves, her legs remain stationary and she looks like she is floating forward.
    This detracts from the realism of the movie.


    This is an opportunity to create a method for an object to "teach" to walk. This
    is where code becomes complicated.


    In Lesson 4.2 code is generated to make the Toy Soldier to "March" across the
    screen. This involves moving the arms and the legs appropriately to make them
    look like his arms and legs are moving in a realistic manner. To keep it simple,
    and reduce the number of instructions, the arms and legs move as one and the bends
    at the knee and elbow have not been considered. However, with a little practice
    and patience the movement can be made even more realistic.


    # In Review


    +   4.0.1 Alice allows the programmer to create custom for a class.

    4.0.2 The object is an example of an object with a walk method.


    # Lesson 4.1 - Creating Custom Class-Level Methods


    Methods that are part of a class are referred to as class-level methods. If there
    is some action that requires writing lots of code to do repeatedly, it would be
    beneficial to create a new class to do that action and then call that method each
    time the object needs to perform those steps. An example of this might be to write
    classes to move the soldier''s legs to make him march across the screen.'
