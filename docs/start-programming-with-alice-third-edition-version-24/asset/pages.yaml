  md: '# START PROGRAMMING WITH ALICE


    # INTRODUCTION


    After several years of using Alice to introduce programming in a college level
    first course in programming, I decided to put my notes on paper in a form that
    would serve as a text for the first six lessons of the course.


    I have never attempted a writing of this magnitude since writing my Masters Thesis
    the years made me loose sight of the scope of this undertaking. However, I stuck
    with it and this is my result. I hope all who use this in their classes or for
    their own self study, find it worthwhile.


    As a user and proponent of Open Source Software, this book was written in its
    entirety using OpenOffice. I used Writer to convert it to a PDF for distribution.


    # FOR THE INSTRUCTOR:


    One of the most frustrating parts of teaching computer related subjects is the
    books. There are many good books on many subjects. However, I find that for courses
    I don''t need 24 chapters on a topic that force my instruction into that chapter
    pattern or sequence. Often I would like a few chapters or even sections from a
    book, arranged in my way, and supplemented by my notes to create a lesson or part
    of a course.


    Alice textbooks available were few but the most quite good. But, I just needed
    a few basics to allow me to introduce Computer Studies majors to the basic concepts
    of programming and objects before moving to Visual Basic. Also I am fighting the
    tendency to teach the way I learned, with long laborious lectures on theory. I
    find that today''s student suffers from what I call "The Sesame Street Syndrome".
    That is learning in 5 to 10 minute segments in an entertaining way. So, now we
    must adjust to the new paradigm of teaching and learning. I began this work in
    an attempt to match this learning pattern. Small segments of lessons with lots
    of activities.


    # FOR THE STUDENT:


    I teach at a small community college that has keep tuition. We serve a rural community
    and most of our students, as in other community colleges are on some type of financial
    aid. One day in the bookstore totaled up the cost of two books for a course I
    was teaching and that the books cost more than the tuition. No wonder I students
    that shared a book or worse yet, did not purchase the book. Those books were not
    good that they were worth more than thirteen weeks of instruction. Weeks, Yes,
    they had a test bank (often with mistakes), they had the usual tiresome PowerPoint
    slides (often with mistakes), an instructor manual that, somehow, never fit the
    way I teach the course and some data files that went with the lab exercises (most
    I never used). All packed in the book and a CD.'
  merge: -1
  pgno: 8
- img_proc: true
  md: 'The intent of this book is to be affordable for the student. Perhaps it is
    an inexpensive book in color, some instructor copies of selected pages in black
    and white or perhaps an online copy that costs only the internet access. For the
    student with internet access already, that means FREE. Then, no excuse for not
    being prepared for class.


    # SUPPLEMENTS:


    It is my intention to supplement this book with a web page. This way I can provide
    updates to the material on a moments notice. We are teaching in a field where
    change is good, frequent and when printed copy does not stand the test of time.
    Test banks will nice, often leave the instructor explaining why a question was
    wrong. Sometimes I have found that I agree with the student and have no rationale
    as to why the test bank had a different answer. So, don''t expect fancy test banks.
    Perhaps some questions that I use in my classes but in a format the instructor
    can modify their own satisfaction. Programming Exercises as I come up with new
    material would be included in a supplemental web page. Once again, use what you
    like or make your own. PowerPoint slides, why? Students usually sleep through
    them and then want to print them out. If you really need them, make your own as
    you prepare your lesson. Better yet, use CamStudio or Jing (free) to create a
    short lesson. Use YouTube and make an Alice movie and post it to a point.


    # SUMMARY


    I am a programmer who turned teacher. I see a need in my own classroom for a text
    with lots of examples that take a student through creating Alice movies, step
    by step. Hands on is the way to learn programming and this text is designed to
    facilitate the students hands on experience. This text gives the theory in text
    for reference or reading, then examples written to lead a student through practicing
    the theory with step by step examples. So, here is my attempt to teach Alice Programming,
    Step-by-step.'
  merge: -1
