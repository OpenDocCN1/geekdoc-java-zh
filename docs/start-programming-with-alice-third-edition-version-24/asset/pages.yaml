  md: 'At the bottom of the Method Editor there is a group of tiles and one of these
    tiles is titled "If/Else. To use the decision structure drag this tile to the
    appropriate place in the Method editor of the program. This will result in a If
    Else structure placed in your program. The line after the If statement, is a box
    for the true statements, next line is the Else and the fourth line is for the
    False statements. The statement or statements to be executed in True side for
    those to be executed if the evaluation of the expression results in true. Put
    the statements to be executed if the expression is evaluated as false in the else
    statement. If the false side does not contain any instructions this is a single
    sided structure that executes alternate instructions if the expression evaluates
    to true.


    Constructing a "Boolean" Expression for Evaluation


    There are six (6) relational operators:


    +   1. == Equal to

    2. != Not Equal to

    3. > Greater than or equal to

    4. <= Less than or equal to

    5. > Greater than

    6. < Less than


    Use this to compare two values or the contents of two variables or the content
    of a variable and a value. Based on the comparison of the two, the relational
    operator selected gives a result of True or False. This determines which code
    gets executed. When the appropriate code completes, the program continues with
    the next instruction after the decision structure.


    ![](img/d2ba71a3d11a1090959dcfb8fe9d6290_38_0.png)


    Figure 2.6.1'
