  md: '# Tutorial 7 - Classes


    Objectives


    +   - Explain the concept of objects and inheritance.

    - Create a new method that requires a parameter.

    - Create a new method for a class.

    - Create a new class from an existing class.


    # Lesson 7.0 - Overview of Classes


    A class defines a particular kind of object. The Alice programming language has
    classes that are predefined. These are the 3D classes found in the gallery. There
    are classes stored in groups like Animals, People, Environment, Buildings, etc

    A class is like a recipe. It is the procedure that is used to create a new instance
    of that class. It contains all the properties, methods and functions that have
    been assigned to class. When one of these are placed on the Alice world the program
    is simply building object according to the rules of class. As many of the class
    can be built as needed. Just like the recipe example, one can make many pies out
    of a pie recipe as they can make.

    A class may be made up of several classes. When we look in the Object Tree, we
    see a plus sign (+) next to most of the objects. Clicking on this plus will expose
    all of those classes that make up the new class of object. Just like a pie consists
    of a recipe for crust and another for the filling and it takes both objects to
    create the new object, most of the Alice objects are made up of several classes.


    In Review


    +   7.0.1 A is a recipe.

    7.0.2 A class may be made up of several other

    7.0.3 Clicking on that next to the object name in the object tree will expose
    all of those classes that make up the new class of object.

    7.0.4 A is a procedure that is used to create a new instance of that class.


    # Lesson 7.1 - Objects


    When adding an instance of a class to the Alice world it already knows how to
    do things like move, turn, say, roll, etc.. A previous lesson covered how to write
    new methods for a class to make it do that the original methods it came with.
    Like the soldier in Lesson 4, we gave object a march method that simulated the
    toy soldier marching across the screen. If additional toy soldiers were created
    on the screen, he would be the only one with the ability to march unless all were
    given the same march method. Since usability is the key in object oriented programming,
    Alice has a fix for this. Just like new instances are created of'
  merge: -1
  pgno: 85
- img_proc: true
  md: 'each class, each inherits all of the properties, methods and functions of the
    original class. If a method is created for a new instance of the class, instance
    may be saved as a new class and the new class will "inherit" all of the parameters,
    methods and functions of the original class as well as the new methods, parameters
    and functions just created for the new class.


    The skater has used in some of the previous exercises and when she skates, kind
    of moves across the ice without simulating all of the leg and arm movements generally
    associated with a skating motion. Most objects have a move that simply moves the
    object. The penguin is an exception since he has a walk method that moves his
    legs and arms as he moves. A prior lesson gave the toy soldier a march method.
    If there is a car or a truck it looks better moving than an animated object like
    people and animals but still, the wheels should turn as the vehicle moves. The
    biplane moves forward but would be more realistic if the propeller moved also.


    The next lesson will teach an object to do a new complex action, save it as a
    new object so it can pass this complex action on subsequent instances of this
    new class.


