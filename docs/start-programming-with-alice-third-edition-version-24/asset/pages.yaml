    # Lesson 1.2 Properties & Methods of Objects


    Each object has associated properties, methods and functions. To view these, select
    the object to be worked with. Make the selection in the "Object Tree". Note that
    there are selections for the "World", the "Camera" and "Light". These are also
    objects that can be manipulated in the code. Some objects have a + sign next to
    them. This means the object is a composition of several other objects that can
    also be manipulated separately.


    ![](img/d2ba71a3d11a1090959dcfb8fe9d6290_18_0.png)


    Each object in an Alice world has properties. These are simply values that describe
    the object''s characteristics. As an object is placed in the Alice world, its
    properties can be changed. The object''s color may be changed, for instance. The
    object''s property values may be changed as the program executes.'
  merge: -1
  pgno: 18
- img_proc: true
  md: '![](img/d2ba71a3d11a1090959dcfb8fe9d6290_19_0.png)


    Objects are capable of doing things. The things an object can do are called methods.
    One of the methods is the "say" things. Some methods can move the object up, down,
    left, right. The methods often are things that object can do in real life. The
    penguin object can move and walk, a plane object can move but I if the designer
    gives it the ability to walk. Methods are consistent with the object''s capabilities
    in the real world.


    Objects can become very complicated, quite often, objects are made from other
    objects or groups of objects. As the user learns to Alice they will manipulate
    an object and find the object coming apart. An example may be one of the people
    objects. These are composite objects. The head can move, the arms can move, the
    legs can move and it is necessary to manipulate the methods of these objects,
    coordinate each part of the object so simulated activities that that object needs
    to do in the course of the movie realistic.


    It is important to recognize that the Alice Gallery is NOT a gallery of objects.
    It is a gallery of classes. What is the difference? The best way to look at a
    class is to compare it to a recipe. It is a recipe to create what is an object.
    This recipe may gather several objects to present them as an object in a virtual
    world. So, when several of the same object are placed in the world in use, the
    recipe to create the class is used to create multiple instances of the same class.
    Each instance is a completely separate object.


