    # Lesson 1.0 The Alice Environment


    When the Alice programming environment is started, it is necessary to be familiar
    with the different areas of the screen, the purpose of these areas and how we
    will refer to each of them.


    ![](img/d2ba71a3d11a1090959dcfb8fe9d6290_15_0.png)


    Figure 1.0.1


    Each area of the Alice Environment can be defined as follows:


    Toolbar(1): Contains a Play Button that plays a virtual world. An Undo Button
    which will undo the previous operation. A Redo Button that returns the last Undo.
    A trash can for deleted objects. It can also contain one or more clipboards to
    temporarily store objects.


    World View Window(2): Shows a view of a virtual world. Each virtual world has
    a camera and the window acts as the viewfinder for this camera. It has three'
  merge: -1
  pgno: 15
- img_proc: true
  md: 'controls that allows the camera to move and rotate, the controls are at the
    bottom of the window.


    **Object Tree(3):** Contains a list of all of the object for the virtual world.
    Each object has a name and it is listed on the object tree. Use this panel to
    select the appropriate object when the details panel is used.


    **Details Panel(4):** Shows detailed information about an object that has been
    selected in the World View window or in the Object Tree. There are three (3) tabs
    in this panel. The Properties tab contains the attributes that describe the object
    selected. The Methods tab contains the methods or things that the object can do.
    The functions tab contains the functions (subprograms) associated with the object
    selected.


    **Method Editor(5):** This is where the programmer creates methods which are simply,
    a set of instructions that cause some action to take place.


    **Events Editor(6):** Events happen as the world plays. It may be a key pressed
    or a mouse button clicked or a number of other predetermined events. Alice responds
    to these events by triggering a program sequence.


    In Review:


    +   1.0.1 The ________ is where the programmer creates methods.

    1.0.2 There are three tabs in the Details Panel:

    (1) ________ (2) ________ (3) ________

    1.0.3 Each virtual world has a camera and the ________ acts as the viewfinder
    for this camera.

    1.0.4 You may have more than one clipboard to temporarily store objects. ( True
    / False )

    1.0.5 Alice responds to ________ by triggering a program sequence.


    # Lesson 1.1 Alice Tutorials


    Alice comes with four(4) excellent tutorials to help the programmer get started.
    The first time Alice is loaded, the tutorial dialog box should appear. If it does
    not appear to go the menu bar and select Help, then Tutorials. Completing these
    tutorials will familiarize the user with the basics of Alice programming.


    At this point, I recommend the first two tutorials are completed moving to the
    next step. If there are problems with the tutorials repeat them until a comfort
    level with their content has bee achieved. Going through all of the tutorials
    is important, but going through these two tutorials carefully will get the user
    started. Understanding the concepts in these tutorials will help do the exercises
    in future lessons.'
  merge: -1
  pgno: 16
- img_proc: true
  md: 'The four standard tutorials are:


    +   * Skater

    * Defending Naptime

    * Penguins

    * Space


    Tutorial 1 - Skater covers the basics of the IDE. Then it goes into creating a
    basic Alice movie. This, and the other tutorials allow you to practice using Alice
    by leading you through the keystrokes and mouse clicks to create a project.


    Tutorial 2 - Defending Naptime tells a short story. It demonstrates dialog bubbles,
    sound and how to create a new method.


    Tutorial 3 - Penguins demonstrates how to make an Alice respond to mouse clicks
    and key presses.


    Tutorial 4 - Space World show how to create scenes, select worlds and add new
    objects.


    ![](img/d2ba71a3d11a1090959dcfb8fe9d6290_17_0.png)


    Figure 1.1.1 - Alice Tutorials Dialog Box


    Doing all of these tutorials will help the user gain an understanding of the power
    of the Alice Programming Language. These are more than silly movies. They encompass
    all of the principles of all programming languages in a fun, easy to use programming
    environment that does much to prevent the new programmer from many programming
    errors.'
  merge: -1
