  md: 'Next, the Layout Tools found in the upper right corner of the screen. There
    is a description of each tool that can be seen by moving the mouse pointer over
    the tool. There are 7 different tools and the best way to learn what they do is
    to place an object on a world and experiment with each of these tools.


    The seven tools are:


    +   - Move objects freely

    - Move objects up and down

    - Turn objects left and right with mouse

    - Turn objects forward and backwards with mouse

    - Tumble objects with the mouse

    - Resize objects with the mouse

    - Copy objects with the mouse


    Using single view and quad view these tools help position and size objects on
    the stage. Then, as the mouse progresses, the objects will perform correctly on
    the screen.


    There is also a button labeled "more controls" in this area. This contains some
    advanced functions not covered by this text. Pressing the button reveals six additional
    controls:


    +   - Aspect Ratio: width versus height of windows. Default is 4/3, selected from
    a drop down.

    - Lens Angle slider control: Moves the camera lens

    - Drop dummy at camera: Create a new dummy object at the current position of the
    camera.

    - Drop dummy at selected object: Creates a new dummy object at the current selected
    object.

    - Move dummy to dummy

    - Fewer Controls: Hides the advanced controls.


    There are two additional buttons, Scroll View and Zoom. These are used to assist
    you in positioning the objects when you are in quad view. Below the right two
    panels of quad view have been enlarged using the zoom feature. The Zoom and the
    Scroll View are mouse controls.


    ![](img/d2ba71a3d11a1090959dcfb8fe9d6290_21_0.png)


    Figure 1.4.3'
