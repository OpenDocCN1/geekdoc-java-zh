    # ## Lesson 6.2 Program Generated Events


    +   * When the world starts

    * While something is true

    * When a variable changes


    **When the world starts** - is the event that is generated when Alice first opens
    a new world. This event is triggered when the play button is pressed. This is
    the default event for every program.


    **While something is true** - While some condition is true, perform the action(s)
    in the called method. This will allow an event to continue as long as a condition
    is true which gives the same effect as a loop.


    **When a variable changes** - This event allows for calling a method every time
    the contents of a variable changes. Monitors a variable and when it changes the
    method for this event is triggered.'
