    of these functions are: proximity, size, spatial relations, point of view, and
    other. They answer questions like "how far is this object from another object?",
    "is this object to the left or right of another object?", and other similar questions
    about the object''s relationship to the environment.


    In the code example we move the sheriff to within 1 meter of the cowboy. Remember,
    the distance is measured from the center point of the sheriff to the center point
    of the cowboy.'
