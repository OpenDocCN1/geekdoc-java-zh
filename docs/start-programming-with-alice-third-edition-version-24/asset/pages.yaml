  md: '# Tutorial 5 – Functions


    Objectives


    +   - Differentiate a function from a method

    - Create a movie that uses functions

    - Use functions in calculations.


    # Lesson 5.0 – Overview of Functions


    The Functions Tab defines functions as "Functions are the things that an object
    can answer about themselves or the world."


    ![](img/d2ba71a3d11a1090959dcfb8fe9d6290_67_0.png)


    Functions differ from Methods in that methods do some task or operation while
    a function returns some information about the world or its objects. These functions
    ask a question and return a value which can be a number, and object, a Boolean
    (true or false), or some other object type.


    Functions can optionally accept values in the form of arguments (or parameters).
    Then return some value as output using the required return statement. There are
    built-in functions for every object as well as the capability to create new functions.
    Some functions for example, calculate the distance between one object and another
    object. Another example is a function that returns a random number. A third example
    is a function that calculates a value and returns it to the calling program.


    # In Review


    +   5.0.1 A returns some information about the world or its objects.

    5.0.2 A does some task or operation.

    5.0.3 A value is returned to the calling statement using the statement.


    66'
