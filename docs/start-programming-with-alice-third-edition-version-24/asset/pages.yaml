    differ from functions we see for other objects. These functions have to do with
    the categories: boolean logic, math, random numbers, strings, ask user, mouse,
    time, advanced math, and other. World functions are generally used for values
    that may pertain to several different objects, user interface, and math functions.
    The Figure 5.1.1 shows a partial list of the world functions.


