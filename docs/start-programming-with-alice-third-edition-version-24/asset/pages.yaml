    # Lesson 3.3 - Repetition (While Loops)


    Sometimes it is necessary to perform a series of instructions based on some "boolean"
    condition testing "True". An example is: "Repeat these instructions until the
    contents of expression A are greater than the contents of expression B"; Another
    example would be to repeat some instructions until one object is less than one
    meter from a second object


    The "While" loop is the tool to use for this problem. The "While" loop is a Pretest
    loop. This means that the condition for doing the loop is evaluated before any
    instructions are executed. Therefore the instructions in the loop may never be
    executed


    The tile for the while instruction is at the bottom of the Method Editor. Just
    as the loop instruction was implemented, drag the tile to the appropriate place
    in the code. Then supply a boolean expression to be evaluated in the input box
    with the initial value of "true". Then follow with the instructions to be executed
    within the loop


