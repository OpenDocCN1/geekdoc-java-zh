  md: '# Lesson 1.3 Try This


    Now it is time to create an Alice movie from scratch:


    +   1. Select File > New World from top menu bar.

    2. Select the "Water" world.

    3. Click on the GREEN "Add Objects" button in the world area.

    4. Now, at the top of the screen there is the "Gallery" of objects that can be
    used in the world. Go to the end of the gallery icon bar and select the one titled
    3-D Text

    5. There is a dialog box that contains a text box with "The quick brown fox" in
    the box. Change this text to Your first and last names

    6. Click on the OK button at the bottom of the dialog box.

    7. Click on the Done button. A GREEN button on the right side just above the gallery.

    8. Now Click on the "PLAY" button (upper left) to play your first movie.

    9. You are now an Alice programmer


    # Lesson 1.4 Quad View


    As multiple objects are placed on the world, it is often difficult to get them
    lined up in proper starting positions, orient them to various objects on the stage,
    etc.. As objects are added to the world, in the upper right corner of the screen
    there are radio buttons for single view and quad view. Quad view will allow a
    view of the 3-D objects from the top, front and side.


    ![](img/d2ba71a3d11a1090959dcfb8fe9d6290_20_0.png)


    ![](img/d2ba71a3d11a1090959dcfb8fe9d6290_20_1.png)'
