    # Lesson 2.3 - Variables


    Variables are vital elements in every programming language. A portion of memory
    that can be used to store a piece of information. In a program a variable is created
    to store some information and is given a name so the programmer can use the data
    in various processing instructions. The contents of the variable can be used in
    calculations, used for display, changed, by various program instructions. So,
    a variable is a storage place for numbers, strings, objects and others. It stores
    these objects so they can be used in the processing of the program.'
  merge: -1
  pgno: 31
- img_proc: true
  md: 'As in other programming languages there are four categories of variables:


    **Local Variables** This belongs to a specific Method and can only be used by
    instructions that pertain to that method.


    **Parameter Variables** Used to hold an argument that is passed to a method when
    it is called.


    **Class-Level Variables** Like a property that belongs to a specific object and
    instances of that object.


    **World-Level Variables** Like a property that belongs to the world.


    Each variable must have a name created using the following rules:


    +   - Must be unique within its scope (local, world, class, parameter).

    - Name should be meaningful.

    - Use the camelCase convention.


    Types of variables includes:


    **Number** Holds numbers, any number.

    **Boolean** Holds either True or False

    **Object** Holds an object

    **Other** More specific types like: strings, sound, color and others.


    Once a variable, has been created an initial value must be established.

    Steps to create a variable:


    +   1. In the Method Editor, click on the **create new variable** button.

    2. In the **Create New Local Variable** dialog box, enter the name of the variable.

    3. Select a data type.

    4. Enter an initial value.

    5. Click on **OK** button.

    6. A tile for the variable should appear in the Method Editor''s variable area.'
