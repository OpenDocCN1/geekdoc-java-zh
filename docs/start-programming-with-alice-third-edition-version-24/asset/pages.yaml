    6.2.2 The event is triggered when the play button is pressed.


    6.2.3 In this event the action is performed as long as the condition evaluates
    to true.


    # Lesson 6.3 - Keyboard Events


    +   - When a key is typed


    +   - Let the arrow keys move <subject>


    **When a key is typed** - This allows for a method to be called in response to
    the user pressing one of the keys on the keyboard.


    This event is valuable to allow the user to initiate some action by pressing a
    key. Perhaps a response to a on screen prompt or cause the start of some portion
    of the movie. The old "press any key to continue" routine.


    **Let the arrow keys move <subject>** - This event should be used with caution.
    An object moves under control of the arrow keys. An object may be lost while moving
    it with the arrow keys and miss the animations that are currently running.


    Many programs allow the user to control movement from the arrow keys. This has
    been the prime keyboard control since the early DOS "Alien Attack" games. The
    caution to use these keys carefully is that this is a 3D world. There are many
    ways an object can be lost in the 3D environment. The down arrow could allow the
    object to move below the ground and when an object disappears, the user, effectively,
    loses control. So, the caution is that these arrows are used, it is a good idea
    to provide a way for the user to reset or find lost objects.


    # In Review


    6.3.1 The event allows for a method to be called in response to the user pressing
    one of the keys on the keyboard.


    6.3.2 The event should be used with caution.


