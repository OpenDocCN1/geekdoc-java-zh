    3.0.5 There are also two versions of the While structure. ( True / False )


    # ## Lesson 3.1 Repetition (Counter Loops)


    At the bottom of the Method Editor is a tile labeled “loop”. Drag this to the
    location in the Method Editor where the loop belong and drop it. Then, enter the
    number of times (iterations) the loop is to be repeated. Under that the appropriate
    instructions are to be repeated. This builds a counter controlled loop. Generally
    this is written as a “For” loop in most programming languages


    This type of loop may be used when an object is to do something a certain number
    of times. For Example: when programming an ice skating scene and the skater is
    to turn around three times. Either write three turn statements or simplify by
    writing a loop that turns the skater three times.


    Perhaps this is not the best example but consider the skater is to turn the number
    of times contained in a variable. When the program is being written. The value
    will be supplied when the program runs. Here is where the loop statement shines
    shines.


    Consider a situation where the programmer wants the Alice character to jump up
    1 meter and back down again and do this ten times. Since the number of times the
    loop is executed, the LOOP structure should be selected. Could this operation
    be done without a loop structure? Certainly, just repeat the move up and move
    down instructions ten times each, but this results in twenty instructions and
    that is messy code. Imagine the code that would have to be written to have Alice
    up and down a thousand times. By using the LOOP structure, only three lines of
    code are written, no matter how many times she needs to jump. Here is the code
    for jumping ten times:'
