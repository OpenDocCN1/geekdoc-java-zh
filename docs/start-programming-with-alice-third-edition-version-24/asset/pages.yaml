  md: '# Lesson 0.1 – How To Get Alice


    Another great feature of Alice is that it is FREE. Yes, it can be downloaded from
    www.alice.org at no cost. Once the Alice zip file is downloaded, it must be unzipped.
    It will create an Alice folder with a sub folder named “Required” and executable
    files, Alice.exe and SlowSteadyAlice.exe.


    To execute Alice, first try the Alice.exe and if that works on the computer in
    use, stick with that one. It may take a while to load since there are a lot of
    graphics to load. It is time to run on an older computer, try SlowSteadyAlice.exe.


    To download and install Alice:


    +   Go to the Alice website http://www.alice.org and download Alice 2.4, (or one
    of the older versions like 2.3 or Alice 2.2) to the computer. Unzip the file and
    it will put two files and a sub folder on the computer.


    +   Alice.exe


    +   SlowSteadyAlice.exe


    +   A sub folder named “Required”


    +   Click on the Alice.exe to execute the Alice program


    ![](img/d2ba71a3d11a1090959dcfb8fe9d6290_11_0.png)


    > Figure 0.1.1 – Alice.org web site


    A tip for those who work on many different machines. Since Alice does not place
    any code in the operating system or make any registry changes, it is completely
    standalone. Once it has been unzipped, the files can be moved from computer to
    computer without any installation. Alice can be loaded to a “Flash Drive”, USB
    Drive”, “Memory Stick”, “SD”, etc.. It does take quite a bit of room to make sure
    there is enough room to install. This way there is access to Alice wherever it
    is needed. NOTE: The “Required” folder and all of its contents must be in the
    same folder as .exe file for Alice.


    It is worthy to note that Alice is available for Windows, Linux and Mac OS operating
    systems.'
  merge: -1
  pgno: 11
- img_proc: true
  md: 'Alice is under continuous development. Currently there are two versions available.
    Alice 2.4, and Alice 3.0. There are also downloads for "Older Versions". We will
    cover the 2.3 and 2.4 versions in this book.


    ![](img/d2ba71a3d11a1090959dcfb8fe9d6290_12_0.png)


    # Lesson 0.2 – Welcome to Alice! Dialog Box


    The Welcome to Alice 2.4 dialog box contains six tabs. This lesson gives a brief
    explanation of each tab. This dialog box appears when Alice first opens. If you
    need to bring this dialog box after it has closed, there are several ways. First,
    from the File menu you can select either "New World" or "Open World". Then, from
    the Help menu you can select "Tutorials" or "Example Worlds". Any of these four
    selections will open the dialog box. The Tutorials give an excellent overview
    of capabilities of Alice and is recommended as a starting place for all students.


    The Examples are another great place for a student to see the capabilities of
    Alice and a good reference for seeing code or animations to assist in completing
    original worlds.'
