  class InfixToPostfix {\n    static int COUNT;\n    public static String convert(String\
  \ str) {\n        String ans = \"\";\n        char[] stack = new char[str.length()];\n\
  \        for (int i = 0; i < str.length(); i++) {\n            char c = str.charAt(i);\n\
  \            if (priority(c) > 0) {\n                while (isEmpty(stack) == false\
