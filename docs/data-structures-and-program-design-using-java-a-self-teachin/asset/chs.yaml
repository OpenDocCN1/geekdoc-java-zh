  \ (b) 列表结束\n   (c) 以上都不是\n\n# 第 5 章\n# 队列\n\n## 5.1 引言\n\n队列是一种重要的数据结构，广泛应用于许多计算机应用中。可以通过我们日常生活中已经熟悉的许多例子来直观地理解队列。队列的一个非常简单的例子是电影院外排队入场的人。排队中的第一个人将首先进入电影院。同样，在日常生活中也有许多例子可以看到队列的实现。因此，我们观察到，每当我们谈论队列时，第一个位置的元素会被首先处理。因此，队列可以被描述为\
  \ FIFO（先进先出）数据结构；也就是说先插入的元素将是第一个被取出的元素。现在，让我们详细讨论队列。\n\n## 5.2 队列的定义\n\n队列是数据元素的线性集合，其中先插入的元素将是先被取出的元素（即队列是一个\
  \ FIFO 数据结构）。队列是一种抽象数据结构，与栈相似。与栈不同，队列在两端都是开放的。队列是一种线性数据结构，第一个元素插入在称为 `REAR`（也称为尾部）的一端，而元素的删除发生在另一个称为\
  \ `FRONT`（也称为头部）的端。一端始终用于插入数据，另一端用于移除数据。\n\n队列可以用数组或链表来实现。我们将在本节中讨论使用数组和链表实现队列。\n\
  \n### 实际应用\n\n* 队列的一个现实生活例子是人在扶电梯上移动。先上扶电梯的人将先走下来。\n* 队列的另一个例子是站在公交站等公交车的人群。因此，排队中的第一个人将先上车。\n\
  \n## 5.3 队列的实现\n\n队列可以用两种数据结构表示：\n1. 使用数组表示队列。\n2. 使用链表表示队列。\n\n现在，让我们详细讨论这两种方法。\n\
  \n### 5.3.1 使用数组实现队列\n\n队列可以使用数组轻松实现。初始时，队列的头部端和尾部端都指向数组的第一个位置。当我们向队列插入新元素时，尾部不断增加，指向下一个插入的位置，而头部保持不变。使用数组表示队列所示：\n\
  \n![image](img/5.1.jpg)\n图 5.1 队列的数组表示。\n\n### 5.3.2 使用链表实现队列\n\n我们已经学习了如何使用数组实现队列。现在讨论使用链表实现。我们已经知道在链表中会发生动态内存分配；也就是说，内存是在运行时分配的。但在数组的情况下，内存是在开始时分配的。我们在链表章节中讨论过。如果我们预先知道队列的最大尺寸，那么使用数组实现队列将是高效。但如果预未知大小，我们将使用链表的概念，其中会动态内存分配。众所周知，链表有两个部分，第一部分包含节点的信息，第二部分存储链表中下一个元素的地址。同样，我们也可以实现链队列。链表的\
  \ `START` 节点成为链队列的 `FRONT` 节点，队列的末尾由 `REAR` 表示。所有的插入操作只在尾部进行。同样，所有的删除操作只在头部进行。\n\
  \n![image](img/5.2.jpg)\n图 5.2 链队列。\n\n### 5.3.2.1 链队列的插入\n\n插入向现有队列添加新元素的过程。队列中的新元素总是从尾部插入。最初，我们检查\
  \ `FRONT = NULL`。如果条件为真，则队列为空；否则，为新节点分配新内存。我们将通过算法进一步理解：\n\n**在链队列中插入新元素的算法**\n\n\
  ```\n步骤 1: 开始\n步骤 2: 设置 NEW NODE.INFO = VAL\n    IF FRONT = NULL\n        设置 FRONT\
  \ = REAR = NEW NODE\n        设置 FRONT.NEXT = REAR.NEXT = NEW NODE\n    ELSE\n  \
  \      设置 REAR.NEXT = NEW NODE\n        设置 NEW NODE.NEXT = NULL\n        设置 REAR\
  \ = NEW NODE\n步骤 3: 退出\n```\n\n\n\n\n在在上一个算法中，我们首先为新节点分配内存。然后，我们用要存储的信息对其进行初始化。接下来，我们检查新节点是否为队列的第一个节点。如果新节点是队列的第一个节点，则在它的节点的地址部分存储\
  \ `NULL`。在这种情况下，新节点同时被标记为 `FRONT`（队头）和 `REAR`（队尾）。然而，如果新节点不是队列第一个节点，那么它将被插入到队列的\
  \ `REAR` 尾。\n\n例如：考虑一个包含五个元素的链式队列；要在队列中插入一个新元素。\n\n![image](img/5.3.jpg)\n图 5.3\
  \ 插入前的链式队列。\n\n在队列中插入新元素后，更新后的队列所示：\n\n![image](img/5.4.jpg)\n图 5.4 插入后的链式队列。\n\n\
  #### 5.3.2.2 **链式队列中的删除**\n\n删除是从已存在的队列中移除元素的过程。队列中的元素始终从前端删除。起初，我们将检查下溢条件，即 `FRONT`\
  \ = `NULL`。如果该条件为真，则队列为空，这意味着我们无法从其中删除任何元素。因此，在这种情况下，屏幕上会显示下溢错误消息。我们将通过算法来进一步理解它：\n\
  \n**从队列中删除元素的算法**\n\n**步骤 1:** 开始\n**步骤 2:** 如果 `FRONT` = `NULL` 打印 UNDERFLOW ERROR\
  \ [If 结束]\n**步骤 3:** 设置 `TEMP` = `FRONT`\n**步骤 4:** 设置 `FRONT` = `FRONT.NEXT`\n\
  **步骤 5:** 退出\n\n在上一个算法中，我们首先检查下溢条件，即队列是否为空。如果该条件为真，则将显示下溢错误消息；否则，我们将使用一个节点变量 `TEMP`，它将指向\
  \ `FRONT`。在下一步中，`FRONT` 现在指向队列中的第二个节点。最后，第一个节点从队列中被删除。\n\n例如：考虑一个包含五个元素的链式队列；要从队列中删除一个元素。\n\
  \n![image](img/5.5.jpg)\n图 5.5 删除前的链式队列。\n\n从队列中删除一个元素后，更新后的队列所示：\n\n![image](img/5.6.jpg)\n\
  图 5.6 删除后的链式队列。\n\n```java\n// 写一个菜单驱动的程序，实现链式队列的插入和删除操作。\n\npublic class Queue\
  \ {\n    private class Node {\n        int data;\n        Node next;\n    }\n  \
  \  private Node front;\n    private Node rear;\n\n    public void insertion(int\
  \ item) {\n        Node node = new Node();\n        node.data = item;\n        node.next\
  \ = null;\n        if (front == null) {\n            front = rear = node;\n    \
  \    } else {\n            rear.next = node;\n            rear = node;\n       \
  \ }\n    }\n\n    public int deletion() throws Exception {\n        if (front ==\
  \ null) {\n            throw new Exception(\"Queue is Empty\");\n        }\n   \
  \     int temp = front.data;\n        front = front.next;\n        return temp;\n\
  \    }\n\n    public void display() throws Exception {\n        if (front == null)\
  \ {\n            throw new Exception(\"Queue is Empty\");\n        }\n        Node\
  \ temp = front;\n        while (temp != null) {\n            System.out.print(temp.data\
  \ + \"->\");\n            temp = temp.next;\n        }\n        System.out.print(\"\
  NULL \");\n    }\n}\n\nimport java.util.Scanner;\n\npublic class Client {\n    public\
  \ static void main(String[] args) {\n        Scanner scn = new Scanner(System.in);\n\
  \        Queue q = new Queue();\n        boolean flag = true;\n        try {\n \
  \           while (flag) {\n                System.out.println(\"\\n***MENU***\n\
  \                System.out.println(\"1. Insertion\");\n                System.out.println(\"\
  2. Deletion\");\n                System.out.println(\"3. Display\");\n         \
  \       System.out.println(\"4. Exit\");\n                System.out.println(\"\
  Enter your choice: \");\n                int choice = scn.nextInt();\n         \
  \       int item = 0;\n                switch (choice) {\n                    case\
  \ 1:\n                        System.out.println(\"Enter value of node: \");\n \
  \                       item = scn.nextInt();\n                        q.insertion(item);\n\
  \                        System.out.println(item + \" inserted successfully\");\n\
  \                        break;\n                    case 2:\n                 \
  \       System.out.println(q.deletion() + \" deleted successfully\");\n        \
  \                break;\n                    case 3:\n                        q.display();\n\
  \                        break;\n                    case 4:\n                 \
  \       flag = false;\n                        System.out.println(\"Terminated.....\"\
  );\n                        break;\n                    default:\n             \
  \           System.out.println(\"Wrong choice\");\n                        break;\n\
  \                }\n            }\n        } catch (Exception e) {\n           \
  \ System.out.println(e.getMessage());\n        }\n    }\n}\n```\n\n程序的输出所示：\n\n\
  ![image](img/185-01.jpg)\n![image](img/185-02.jpg)\n![image](img/images186-01.jpg)\n\
  \n### 常见问题\n\n**1. 定义队列；队列可以通过什么方式实现？**\n\n**答：** 队列是一种线性数据结构，其中元素从一端（称为 `REAR`\
  \ 端或队尾）插入，从另一端（称为 `FRONT` 端或队头）删除。每种队列可以通过两种方式实现：\n* 数组表示（静态表示）\n* 链表表示（动态表示）\n\n\
  ## 5.4 队列操作\n\n可以在队列上执行的两种基本操作如下：\n\n### 5.4.1 插入\n\n插入是在队列中添加新元素的过程。然而，在队列中插入任何新元素之前，我们必须检查溢出条件，这发生在尝试向已满队列插入元素时。溢出可以通过可以通过检查：如果\
  \ `REAR` = `MAX` - 1，其中 `MAX` 是队列的大小。因此，如果溢出条件为真，则屏幕上会显示溢出消息；否则，元素插入队列。插入始终在后端进行。插入被称为入队（en-queue）。\n\
  \n例如：假设有一个包含五个元素的队列。假设我们要在其插入另一个元素 50；那么 `REAR` 将增加 1。因此，新元素被插入到 `REAR` 指向的位置。现在，让我们通过下图查看插入是如何进行的：\n\
  \n![image](img/187-01.jpg)\n在其插入 50 后，新队列将变为：\n\n![image](img/5.7.jpg)\n图 5.7 插入新元素后的队列。\n\
  \n**向队列中插入新元素的算法**\n\n**步骤 1:** 开始\n**步骤 2:** 如果 `REAR` = `MAX` - 1 打印 OVERFLOW\
  \ ERROR [If 结束]\n**步骤 3:** 如果 `FRONT` = -1 且 `REAR` = -1 设置 `FRONT` = 0 设置 `REAR`\
  \ = 0 ELSE `REAR` = `REAR` + 1 [If 结束]\n**步骤 4:** 设置 `QUE[REAR]` = `ITEM`\n**步骤\
  \ 5:** 退出\n\n\n\n删除是从队列中移除元素的过程。然而，在从队列中删除任何元素之前，我们必须始终检查上溢（underflow）条件，当尝试从一个空队列中删除元素时，就会发生上溢条件。可以通过以下方式检查上溢条件：如果\
  \ `FRONT > REAR` 或 `FRONT = -1`。因此，如果上溢条件成立，则屏幕上将显示上溢信息；否则，从队列中删除该元素。删除始终在队端进行。删除也被称为出队（de-queue）。\n\
  \n#### 示例：\n让我们取包含五个元素的队列。假设我们想从队列中删除元素 7；那么 `FRONT` 将加 1。因此，新元素将从 `FRONT` 指向的位置被删除。现在，让我们看看下图中队列是如何执行删除操作的：\n\
  \n![image](img/188-01.jpg)\n\n在删除 7 之后，新队列将是：\n\n![image](img/5.8.jpg)\n\n图 5.8.\n\
  删除元素后的队列。\n\n#### 从队列中删除元素的算法\n\n**步骤 1:** 开始 (START)\n**步骤 2:** 如果 `FRONT > REAR`\
  \ 或 `FRONT = -1` 打印 UNDERFLOW ERROR [If 结束]\n**步骤 3:** 设置 `ITEM = QUE[FRONT]`\n\
  **步骤 4:** 设置 `FRONT = FRONT + 1`\n**步骤 5:** 退出 (EXIT)\n\n在上述算法中，我们首先检查上溢条件，即检查队列是否为空。如果队列为空，则不进行删除；否则，`FRONT`\
  \ 增加到队列中的下一个位置。最后，从队列中删除元素。\n\n```java\n// Write a menu-driven program for a linear\
  \ queue, performing insertion and deletion operations.\n\npublic class SQueue {\n\
  \    static int MAX = 50;\n    private int[] data;\n    private int front;\n   \
  \ private int rear;\n\n    public void insertion(int item) throws Exception {\n\
  \        if (rear == MAX - 1) {\n            throw new Exception(\"Queue is full\"\
  );\n        } else {\n            data[rear++] = item;\n        }\n    }\n\n   \
  \ public int deletion() throws Exception {\n        if (front == rear) {\n     \
  \       throw new Exception(\"Queue is Empty\");\n        }\n        int temp =\
  \ data[front];\n        front++;\n        return temp;\n    }\n\n    public void\
  \ display() throws Exception {\n        if (front == rear) {\n            throw\
  \ new Exception(\"Queue is Empty\");\n        }\n        for (int i = front; i <\
  \ rear; i++) {\n            System.out.print(data[i] + \" \");\n        }\n    }\n\
  }\n\n// CLIENT CLASS\nimport java.util.Scanner;\n\npublic class SQClient {\n   \
  \ public static void main(String[] args) {\n        Scanner scn = new Scanner(System.in);\n\
  \        SQueue q = new SQueue();\n        boolean flag = true;\n        try {\n\
  \            while (flag) {\n                System.out.println(\"\\n***MENU***\"\
  );\n                System.out.println(\"1. Insertion\");\n                System.out.println(\"\
  2. Deletion\");\n                System.out.println(\"3. Display\");\n         \
  \       System.out.println(\"4. Exit\");\n                System.out.println(\"\
  Enter choice: \");\n                int choice = scn.nextInt();\n              \
  \  int item = 0;\n                switch (choice) {\n                    case 1:\n\
  \                        System.out.println(\"Enter value of node: \");\n      \
  \                  item = scn.nextInt();\n                        q.insertion(item);\n\
  \                        System.out.println(item + \" inserted successfully\");\n\
  \                        break;\n                    case 2:\n                 \
  \       System.out.println(q.deletion() + \" deleted successfully\");\n        \
  \                break;\n                    case 3:\n                        q.display();\n\
  \                        break;\n                    case 4:\n                 \
  \       flag = false;\n                        System.out.println(\"Terminated.....\"\
  );\n                        break;\n                    default:\n             \
  \   }\n            }\n        } catch (Exception e) {\n            // Handle exceptions\n\
  \        }\n    }\n}\n```\n\n\n\n\n# 插入\n在现有队列中插入新元素时，我们首先要检查溢出（overflow）条件。如之前所述，当我们尝试向已满的队列插入元素时，就会发生溢出。新插入元素的位置可以使用以下公式计算：\n\
  \n`REAR = (REAR + 1) % MAX`，其中 `MAX` 等于队列的大小。\n\n**示例：** 让我们考虑一个包含三个元素的循环队列。假设我们向其中插入一个元素\
  \ `56`。让我们看看循环队列中是如何进行插入的。\n\n**步骤 1：** 初始状态队列包含三个元素。`FRONT` 表示循环队列的开头，`REAR` 表示循环队列的末尾。\n\
  \n![image](img/5.10.jpg)\n图 5.10 插入元素前的初始循环队列。\n\n**步骤 2：** 现在，要在队列中插入新元素。因此，`REAR\
  \ = REAR + 1`；即 `REAR` 将加 1，以便它指向队列中的下一个位置。\n\n![image](img/5.11.jpg)\n图 5.11 `REAR`\
  \ 加 1 以便指向下一个位置。\n\n**步骤 3：** 最后，在这一步中，新元素被插入 `REAR` 指向的位置。因此，插入后的队列所示所示：\n\n![image](img/5.12.jpg)\n\
  图 5.12 插入新元素后的最终队列。\n\n## 在循环队列中插入元素的算法\n\n这里 `QUEUE` 是一个包含 `N` 个元素的数组。`FRONT` 和\
  \ `REAR` 分别指向队列的头部和尾部元素。`ITEM` 是要插入的值。\n\n**步骤 1：** START（开始）\n**步骤 2：** IF (`FRONT\
  \ = 0 && REAR = MAX – 1`) OR (`FRONT = REAR + 1`) 打印 `OVERFLOW ERROR`（溢出错误）\n**步骤\
  \ 3：** ELSE（否则）\n    IF (`FRONT = -1`) 设置 `FRONT = 0`\n    设置 `REAR = 0`\n**步骤 4：**\
  \ ELSE（否则）\n    IF (`REAR = MAX - 1`) 设置 `REAR = 0`\n    ELSE `REAR = REAR + 1`\n\
  \    [If 结束]\n    [If 结束]\n**步骤 5：** 设置 `CQUEUE[REAR] = ITEM`\n**步骤 6：** EXIT（退出）\n\
  \n在之前的算法中，我们首先检查溢出条件。其次，我们检查队列是否为空。如果队列为空，则将 `FRONT` 和 `REAR` 设置为零。在步骤 4 中，如果 `REAR`\
  \ 达到了容量上限，我们设置 `REAR = 0`；否则，`REAR` 加 1，使其指向要插入新元素的下一个位置。最后，将元素插入队列中。\n\n### 5.5.1.3\
  \ 从循环队列中删除元素\n\n在从现有队列中删除元素时，我们首先要检查下溢（underflow）条件。当我们尝试从空队列中删除元素时，就会发生下溢。从循环队列中删除元素后，`FRONT`\
  \ 端的位置可以通过以下公式计算：\n\n`FRONT = (FRONT + 1) % MAX`，其中 `MAX` 等于队列的大小。\n\n**示例：** 让我们考虑一个包含七个元素的循环队列。假设我们要从中删除元素\
  \ `45`。让我们看看循环队列中是如何进行删除的。\n\n**步骤 1：** 初始队列包含七个元素。`FRONT` 表示循环队列的开头，`REAR` 表示循环队列的末尾。\n\
  \n![image](img/5.13.jpg)\n图 5.13 删除元素前的初始循环队列。\n\n**步骤 2：** 现在，要从队列中删除元素。因此，`FRONT\
  \ = FRONT + 1`，即 `FRONT` 将加 1，指向队列中的下一个位置。同时，值从队列中删除。因此，删除后的队列所示：\n\n![image](img/5.14.jpg)\n\
  图 5.14 删除元素后的最终队列。\n\n## 从循环队列中删除元素的算法\n\n这里 `CQUEUE` 是一个包含 `N` 个元素的数组。`FRONT` 和\
  \ `REAR` 指向队列的头部和尾部元素。`ITEM` 是要删除的值。\n\n**步骤 1：** START（开始）\n**步骤 2：** IF (`FRONT\
  \ = -1`) 打印 `UNDERFLOW ERROR`（下溢错误）\n**步骤 3：** ELSE（否则）\n    设置 `ITEM = CQUEUE[FRONT]`\n\
  **步骤 4：** IF (`FRONT = REAR`) 设置 `FRONT = -1`\n    设置 `REAR = -1`\n**步骤 5：** ELSE\
  \ IF (`FRONT = MAX – 1`) 设置 `FRONT = 0`\nELSE `FRONT = FRONT + 1`\n[If 结束][If 结束]\n\
  **步骤 6：** EXIT（退出）\n\n在之前的算法中，我们首先检查下溢条件。其次，我们将要删除的元素存储在 `ITEM` 中。第三，我们检查删除后队列是否为空。此外，如果\
  \ `FRONT` 达到了最大容量，我们设置 `FRONT = 0`；否则，`FRONT` 加 1，使其指向下一个位置。最后，元素从队列中删除。\n\n\n\n\
  \n优先队列（priority queue）是队列的另一种变，根据分配的优先级对元素进行处理。优先队列中的每个元素都被分配了一个称为“优先级”的特殊值。优先队列中的元素根据以下规则进行处理：\n\
  \n1. 优先处理优先级较高的元素，然后处理优先级较低的元素。\n2. 如果两个元素的优先级相同，则按照先来后（First Come First Served）的原则进行处理。元素的优先级通过其值选择，称为隐式优先级（implicit\
  \ priority），而每个元素赋予的优先级称为显式优先级（explicit priority）。\n\n优先队列类似于修改过的队列或栈数据结构，但额外为每个元素关联了一个“优先级”。在优先队列中，插入和删除操作也是根据分配的优先级完成的。如果我们想从优先队列中删除一个元素，则首先处理并删除优先级最高的元素。插入的情况也是如此。队列中元素的优先级基于基于几个因素。优先队列常用于操作系统，以优先执行高优先级进程。分配给这些进程的优先级可能基于\
  \ CPU 完全执行这些进程所需的时间。\n\n## 实际应用\n\n在操作系统中，如果有四个进程需要执行，其中第一个进程需要 3ns 完成，第二个进程需要 5ns\
  \ 完成，第三个进程需要 9ns 完成，第四个进程需要 8ns 完成，那么第一个进程将获得最高优先级，并成为所有进程中第一个执行的。\n\n现在优先队列进一步分为两种类型：\n\
  \n1. **升序优先队列（Ascending Priority Queue）：** 在这种优先队列中，元素可以任意顺序插入，但在从队列删除元素时，会首先查找并删除最小元素。\n\
  2. **降序优先队列（Descending Priority Queue）：** 在这种优先队列中，元素可以任意顺序插入。但在从队列删除元素时，会首先查找并删除最大的元素。例如：操作系统、路由。\n\
  \n## 常见问题解答\n\n### 3. 定义优先队列。\n\n答：优先队列是一个元素集合，其中每个元素都被分配了一个优先级，且元素的删除和处理顺序遵循以下规则：\n\
  \n(a) 高优先级的元素在任何低优先级元素之前被处理。\n(b) 两个优先级相同的元素按照它们被加入队列的顺序进行处理。\n\n优先队列中的数组元素可以具有以下结构：\n\
  \n```\nprivate class Node {\n    int priority;\n    int data;\n    Node next;\n\
  }\n```\n\n## 5.5.2.1. 优先队列的实现\n\n优先队列可以通过两种方式实现：\n\n1. 优先队列的数组表示\n2. 优先队列的链表表示\n\
  \n现在我们来详细讨论这两种实现方式。\n\n### 1. 使用数组实现优先队列\n\n在使用数组实现优先队列时，必须考虑以下点：\n\n* 为每个优先级级别或优先级编号维护一个单独的队列。\n\
  * 每个队列将出现在自己的环形数组中，并且必须有自己的节点对，即头部（FRONT）和尾部（REAR）。\n* 如果为每个队列分配相同数量的内存，可以使用二维数组代替线性数组。\n\
  \n**例如：** `FRONT [K]` 和 `REAR [K]` 是包含队列第“K”行头部和尾部值的节点，其中 `K` 是优先级编号。如果我们想插入一个优先级为\
  \ `K` 的元素，我们将在第 `K` 行的 `REAR` 端添加该元素；`K` 既是该元素的行号，也是它的优先级编号。如果我们添加优先级编号为 4 的 `F`，则队列所示所示：\n\
  \n![image](img/5.15.jpg)\n\n图 5.15 插入新元素后的优先队列。\n\n### 2. 使用链表实现优先队列\n\n优先队列可以使用链表实现。在使用链表实现优先队列时，每个节点将包含三个部分：\n\
  \n(a) 信息部分\n(b) 元素的优先级编号\n(c) 下一个元素的地址\n\n高优先级的元素将位于低优先级元素之前。此外，优先级编号和优先级之间是相反的；即，优先级编号越小的元素意味着其优先级越高。例如，如果有优先级编号分别为\
  \ 2 和 7 的两个元素 `X` 和 `Y`，则将先处理 `X`，因为它的优先级更高。\n\n![image](img/5.16.jpg)\n\n图 5.16\
  \ 链式优先队列。\n\n## 5.5.2.2. 链式优先队列的插入\n\n在链式优先队列中插入新元素时，我们首先遍历整个队列，直到找到一个优先级比新元素低的节点。因此，新元素被插入在优先级较低的元素之前。此外，如果队列中与新元素优先级相同的元素，则在这种情况下，新元素将插入在该元素之后。\n\
  \n**例如：** 考虑一个具有所示四个元素的优先队列：\n\n![image](img/5.17.jpg)\n\n图 5.17 插入前的链式优先队列。\n\n\
  现在要插入一个信息为 `A` 优先级编号为 3 的新元素；因此，该元素将插入在优先级为 4 的元素 `R` 之前，其优先级较低。插入新元素后的优先队列所示：\n\
  \n![image](img/5.18.jpg)\n\n图 5.18 插入新元素后的链式优先队列。\n\n## 5.5.2.3. 链式优先队列的删除\n\n从链式优先队列中删除元素是一个简单的过程。在这种情况下，删除优先队列中的第一个节点并首先处理该节点的信息。\n\
  \n**例如：** 考虑一个具有所示五个元素的优先队列：\n\n![image](img/5.19.jpg)\n\n图 5.19 删除前的链式优先队列。\n\n\
  现在删除队列第一个节点。因此，删除后的优先队列所示：\n\n![image](img/5.20.jpg)\n\n图 5.20 删除第一个节点后的链式优先队列。\n\
  \n```\n// 编写一个菜单驱动的优先队列程序，执行插入和删除操作。\n```\n\n\n\n```java\npublic class PriorityQueue\
  \ {\n  private class Node {\n    int priority;\n    int data;\n    Node next;\n\
  \  }\n  private Node front;\n\n  public void insertion(int item, int prior) {\n\
  \    Node node = new Node();\n    node.data = item;\n    node.priority = prior;\n\
  \    node.next = null;\n    if (front == null || prior <= front.priority) {\n  \
  \    node.next = front;\n      front = node;\n    } else {\n      Node temp = front;\n\
  \      while (temp.next != null && (temp.next).priority <= prior) {\n        temp\
  \ = temp.next;\n      }\n      node.next = temp.next;\n      temp.next = node;\n\
  \    }\n  }\n\n  public int deletion() throws Exception {\n    if (front == null)\
  \ {\n      throw new Exception(\"Queue is Empty\");\n    }\n    int temp = front.data;\n\
  \    front = front.next;\n    return temp;\n  }\n\n  public void display() throws\
