  \ 7.6.4 后缀表达式求值\n\n借助栈的帮助，可以很容易地计算任何后缀表达式。后缀表达式中的每个字符都从左到右扫描。求后缀表达式的步骤在算法中给出。\n\n\
  **求后缀表达式的算法**\n\n**步骤 1：** 开始\n**步骤 2：** 如果遇到操作数，将其入栈。\n**步骤 3：** 如果遇到运算符 `op1`，则执行以下步骤：\n\
  (a) 从栈中弹出两个顶部元素，其中 `X` 是栈顶元素，`Y` 是 `X` 下方的下一个元素。\n(b) 计算 `X op1 Y`。\n(c) 将结果入栈。\n\
  **步骤 4：** 将结果设置为栈顶元素元素。\n**步骤 5：** 退出\n\n**示例：** 求值以下后缀表达式。\n\n(a) `2 3 4 + 5 6\
  \ 7 8 + * +`\n(b) `T F T F F AND T XOR AND OR`\n\n**解**\n\n(a)\n![image](img/282-02.jpg)\n\
  (b)\n![image](img/283-01.jpg)\n(b)\n![image](img/284-01.jpg)\n\n// 写一个用于后缀表达式求值的程序。\n\
  \n```java\nimport java.util.Scanner;\npublic class PostfixEvaluation {\n    static\
  \ int COUNT;\n\n    static evaluate(String exp) {\n        int[] stack = new int[exp.length()];\n\
  \        for (int i = 0; i < exp.length(); i++) {\n            char c = exp.charAt(i);\n\
  \            if (Character.isDigit(c))\n                push(stack, c - '0');\n\
  \            else {\n                int val1 = pop(stack);\n                int\
  \ val2 = pop(stack);\n                switch (c) {\n                    case '+':\n\
  \                        push(stack, val2 + val1);\n                        break;\n\
  \                    case '-':\n                        push(stack, val2 - val1);\n\
  \                        break;\n                    case '/':\n               \
  \         push(stack, val2 / val1);\n                        break;\n          \
  \          case '*':\n                        push(stack, val2 * val1);\n      \
  \                  break;\n                }\n            }\n        }\n    }\n\
  \    // ... 其他方法 size, push, pop, peek, isEmpty ...\n}\n```\n\n\n\n\n\n```java\n\
