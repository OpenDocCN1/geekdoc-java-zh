  \         if (item <= parent.data)\n                    parent.left = node.left;\n\
  \                else\n                    parent.right = node.left;\n         \
  \   } else if (node.left == null && node.right != null) { // 情况 3\n            \
  \    if (item <= parent.data)\n                    parent.left = node.right;\n \
  \               else\n                    parent.right = node.right;\n         \
  \   } else { // 情况 4\n                int max = max(node.left);\n              \
  \  delete(node.left, node, max);\n                node.data = max;\n           \
  \ }\n        }\n  }\n\n  public void min() {\n    System.out.println(\"树中的最小元素是:\
  \ \" + min(root));\n  }\n\n  private int min(Node node) {\n        if (node.left\
  \ == null) {\n            return node.data;\n        }\n        return min(node.left);\n\
  \  }\n\n  public void max() {\n    System.out.println(\"树中的最大元素是: \" + max(root));\n\
  \  }\n\n  private int max(Node node) {\n        if (node.right == null) {\n    \
  \        return node.data;\n        }\n        return max(node.right);\n  }\n\n\
