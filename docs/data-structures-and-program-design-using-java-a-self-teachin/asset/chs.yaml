  \n![image](img/383-03.jpg)\n\n![image](img/383-04.jpg)\n\n# 线性探测法的优缺点\n\n线性探测法是一种非常好的技术，该算法通过良好的地址局部性提供了优异内存缓存。但该方法的主要缺点会导致聚类（clustering）。由于聚类，发生冲突的风险更高。此外，搜索所需的时间随着簇的大小增大而增加。现在我们可以说，冲突次数越高，找到空闲位置所需的探测次数就越多，性能也就越低。这被称为一级聚类。我们可以通过二次探测和双重哈法等技术来避免这种聚类。\n\
  \n# 二次探测\n\n二次探测是解决冲突问题的另一种方法。在这种方法中，如果键已经存储在哈希函数 `h(k)` 生成的位置上，可以通过以下哈希函数解决：`h'(k)\
  \ = (h(k) + c1*i + c2*i²) mod m`，其中 `h(k) = k mod m`，`i = 0, 1, 2, 3...`，`c1`、`c2`\
  \ 不等于零。二次探测法比线性探测更好，因为它由于其搜索速度终止了一级聚类现象；也就是说，对于给定的键 `k`，第一次探测由 `(h(k) + 0 + 0) mod\
  \ m` 生成的位置 `i = 0`。如果生成的位置是空闲的，则将键存储其中。否则，后续位置的偏移量取决于探测次数 `i`。二次探测法的效果比线性探测好，但 `m`、`c1`\
  \ 和 `c2` 的值受到限制。\n\n# 常见问题解答\n\n### 给定键 `k = 25, 13, 14` 和 `35`，使用二次探测 `c1 = 1`\
  \ 和 `c2 = 3` 将这些键映射到大小为 `m = 5` 的哈希表中。\n\n**答：** 初始哈希表如下：\n\n![image](img/384-01.jpg)\n\
  \n**步骤 1：** `i = 0`, `c1 = 1`, `c2 = 3`。\n要插入的键 = `25`。\n`h'(k) = (k mod m + c1*i\
  \ + c2*i²) mod m`\n`h'(25) = (25 % 5 + 1*0 + 3*0²) % 5`\n`h'(25) = (0 + 0) % 5`\n\
  由于位置 `T[0]` 是空闲的，`25` 插入到 `T[0]`。\n\n![image](img/385-01.jpg)\n\n**步骤 2：** `i =\
  \ 0`, `c1 = 1`, `c2 = 3`。\n要插入的键 = `13`。\n`h'(13) = (13 % 5 + 1*0 + 3*0²) % 5`\n\
  `h'(13) = (3 + 0) % 5`\n由于位置 `T[3]` 是空闲的，`13` 插入到 `T[3]`。\n\n![image](img/385-02.jpg)\n\
  \n**步骤 3：** `i = 0`, `c1 = 1`, `c2 = 3`。\n要插入的键 = `14`。\n`h'(14) = (14 % 5 + 1*0\
  \ + 3*0²) % 5`\n`h'(14) = (4 + 0) % 5`\n由于位置 `T[4]` 是空闲的，`14` 插入到 `T[4]`。\n\n![image](img/385-03.jpg)\n\
  \n**步骤 4：** `i = 0`, `c1 = 1`, `c2 = 3`。\n要插入的键 = `35`。\n`h'(35) = (35 % 5 + 1*0\
  \ + 3*0²) % 5`\n`h'(35) = (0 + 0) % 5 = 0`\n由于位置 `T[0]` 不空闲，下一个探测序列为 `i = 1`：\n\
  `i = 1`, `c1 = 1`, `c2 = 3`。\n`h'(35) = (35 % 5 + 1*1 + 3*1²) % 5`\n`h'(35) = (0\
  \ + 1 + 3) % 5 = 4`\n由于位置 `T[4]` 不空闲，下一个探测序列为 `i = 2`：\n`i = 2`, `c1 = 1`, `c2 =\
  \ 3`。\n`h'(35) = (35 % 5 + 1*2 + 3*2²) % 5`\n`h'(35) = (0 + 2 + 12) % 5 = 4`\n由于位置\
  \ `T[2]` 是空闲的，`35` 插入到 `T[2]`。\n\n\n\n\n\n```java\nimport java.util.Scanner;\npublic\
  \ class QuadraticProbing {\n    static int SIZE = 10;\n    static int[] arr = new\
  \ int[SIZE];\n    public static void main(String[] args) {\n        Scanner scn\
  \ = new Scanner(System.in);\n        boolean flag = true;\n        for (int i =\
  \ 0; i < SIZE; i++) {\n            arr[i] = 0;\n            while (flag == true)\
  \ {\n                System.out.println(\"\\nMENU\");\n                System.out.println(\"\
  1\\. Insert Keys\");\n                System.out.println(\"2\\. Search Keys\");\n\
