  (d) 以上均不是\n\n# 第 6 章\n# 搜索与排序\n\n## 6.1 搜索引论\n\n众所周知，计算机系统通常用于存储大量数据。我们需要一些搜索机制来从计算机系统存储的海量数据中检索特定的记录。搜索意味着查找某个特定数据项是否存在于数组/列表中。*在列表或数组中寻找特定值的过程被称为搜索。*\
  \ 如果该特定值存在于数组中，则称搜索成功，搜索过程会返回该特定值的位置。然而，如果该值不存在，则称搜索失败。这里有很多不同的搜索算法，但三种流行的搜索技术如下：\n\
  \n* 线性搜索或顺序搜索\n* 二分查找\n* 插值查找\n\n在这里在这里，我们将详细讨论所有这些方法。\n\n## 6.2 线性搜索或顺序搜索\n\n线性搜索也称为顺序搜索。这是一种用于在数组中搜索特定值的非常简单的技术。*线性搜索的工作原理是将待搜索的键值与数组中的每个元素按线性顺序进行比较，直到找到匹配项为止*。如果读取了所有数据元素但未找到所需的元素，则搜索将失败。以下是一些重要要点：\n\
  \n* 这是在列表中搜索元素最简单的方法。\n* 无论数组是有序还是无序的，它都会顺序搜索数据元素。\n\n**例如：** 让我们取一个包含十个元素的数组，声明如下：\n\
  \n```java\nint array[10] = {87, 25, 14, 39, 74, 1, 99, 12, 30, 67};\n```\n\n在数组中要搜索的值为\
  \ `VALUE = 74`，然后搜索 74 是否存在于数组中。如果值存在，则返回其位置。这里 `VAL = 74` 的位置是 `POS = 4`（索引从 0\
  \ 开始），如下图所示：\n\n**第 1 轮：** 将 87 与 74 进行比较。由于 87 不等于 74，我们将移动到下一轮。\n\n![image](img/218-01.jpg)\n\
  \n**第 2 轮：** 将 25 与 74 进行比较。由于 25 不等于 74，我们将移动到下一轮。\n\n![image](img/218-02.jpg)\n\
  \n**第 3 轮：** 将 14 与 74 进行比较。由于 14 不等于 74，我们将移动到下一轮。\n\n![image](img/218-03.jpg)\n\
  \n**第 4 轮：** 将 39 与 74 进行比较。由于 39 不等于 74，我们将移动到下一轮。\n\n![image](img/218-04.jpg)\n\
  \n**第 5 轮：** 将 74 与 74 进行比较。由于 74 等于 74，我们将返回 74 所在的位置，在这种情况下位置为 4。\n\n![image](img/6.1.jpg)\n\
  \n图 6.1 线性搜索的工作原理。\n\n通过这种方式，线性搜索被用于在数组中搜索特定值。现在，让我们通过算法进一步理解它。\n\n**实际应用**\n\n\
  线性搜索的一个简单且现实的例子是人在电话簿中查找另一个人的电话号码。所以，如果这个人不知道对方的确切姓名，但知道名字以 A 开头，那么他/她将从电话簿开始开始搜索。\n\
  \n**线性搜索算法**\n\n设 `ARR` 为一个包含 `n` 个元素的数组，`ARR[1]`、`ARR[2]`、`ARR[3]`， . . `ARR[n]`，其中\
  \ `VAL` 是要搜索的元素。那么算法将找到 `VAL` 在 `ARR` 中的位置 `POS`。\n\n**步骤 1：** 开始\n**步骤 2：** 设置\
  \ `I = 0`，`POS = -1`\n**步骤 3：** 重复直到 `I < N`\n`IF (ARR[I] == VAL)`\n  `POS = I`\n\
  \  `PRINT POS`\n  `跳转到步骤 5`\n`[End IF]`\n`[End Loop]`\n**步骤 4：** `IF (POS == -1)`\n\
  \  `PRINT \"未找到\"`\n`[End IF]`\n**步骤 5：** 退出\n\n**线性搜索的复杂度**\n\n*线性搜索的执行时间表示为线性函数*，其中\
  \ `n` 是数组中元素的数量。线性搜索的最佳情况是数据元素等于数组中的第一个元素。显然，最坏情况是当数据元素位于数组的末尾时，需要进行 `n` 次比较。\n\n\
  \n\n\n答：假设 `ARR` 是一个具有 `N` 个元素的数组。`ITEM` 是要搜索的值。那么我们有以下几种情况：\n\n*情况 1：无序列表*：将 `ITEM`\
  \ 与数组的每一个元素进行比较。如果找到了该元素，则不需要再进行进一步的比较。如果比较并检查了所有元素，则未找到 `ITEM`。\n\n*情况 2：有序列表*：如果\
  \ `ITEM` 大于列表的第一个元素且小于最后一个元素，则通过将列表中的每个元素与 `ITEM` 比较来执行搜索；否则，报告 `ITEM` 为“未找到”。\n\
  \n## 6.3 二分查找\n\n与线性查找相比，二分查找是一种极高效率的搜索算法。*二分查找仅在数组/列表已经排序时才有效。*在二分查找中，我们首先将值 `VAL`\
  \ 与数组中间位置的数据元素进行比较。如果找到了匹配项，则返回该元素的位置 `POS`；否则，如果该值小于中间元素，我们从数组的下半部分开始搜索，反之亦然。因此，我们在数组的下半部分和上半部分重复此过程。\n\
  \n### 6.3.1 二分查找算法\n\n让我们现在理解这种二分查找算法在数组中是如何工作的。\n\n1. 找到数组的中间元素，即 `n/2` 是包含 `n`\
  \ 个元素的数组的中间元素。\n2. 现在，将数组的中间元素与要搜索的数据元素进行比较。\n    (a) 如果中间元素是目标元素，则搜索成功。\n    (b)\
  \ 如果要搜索的数据元素小于数组的中间元素，则只搜索数组的下半部分，即中间元素左侧的元素。\n    (c) 如果要搜索的数据元素大于数组的中间元素，则只搜索数组的上半部分，即中间元素右侧的元素。\n\
  \n重复这些步骤，直到找到匹配项为止。\n\n#### 实际应用\n\n二分查找的一个现实应用是，当我们在字典中查找特定单词时，我们首先从中间部分的某处打开字典。现在我们将目标单词与该页上的第一个单词进行比较。如果目标单词在打开页的第一个单词之后，我们将在字典的后半部分查找；否则，将在前半查找。现在，我们再次在后半部分打开一页，并将目标单词与该页上的第一个单词进行比较，重复相同的过程，直到找到目标单词为止。\n\
  \n#### 二分查找算法\n\n`Binary_Search(ARR, Lower_bound, Upper_bound, VAL)`\n\n**步骤 1：**\
  \ START\n**步骤 2：** 设置 `BEG = lower_bound`，`END = upper_bound`，`POS = -1`\n**步骤 3：**\
  \ 当 `BEG <= END` 时重复步骤 4 和 5\n**步骤 4：** 设置 `MID = (BEG+END)/2`\n**步骤 5：** IF (`ARR[MID]\
  \ = VAL`) `POS = MID`, `PRINT POS`，跳转到步骤 7；ELSE IF (`ARR[MID] > VAL)` 设置 `END =\
  \ MID – 1`；ELSE 设置 `BEG = MID + 1` [If 结束] [循环结束]\n**步骤 6：** IF (`POS = -1`) `PRINT\
  \ \"VALUE NOT FOUND, SEARCH UNSUCCESSFUL\"` [IF 结束]\n**步骤 7：** EXIT\n\n在算法的步骤 2\
  \ 中，我们正在初始化 `BEG`、`END` 和 `POS` 的值。在步骤 3 中执行一个 while 循环。在步骤 3 中，计算出 `MID` 的值。在步骤\
  \ 4 中，我们将检查要搜索的值是否等于数组 `MID` 处的值。如果找到匹配项，则打印该元素的位置。如果未找到匹配项，且要搜索的值小于数组 `MID` 处的值，则修改\
  \ `END`；否则，如果要搜索的值大于数组 `MID` 处的值，则修改 `BEG`。在最后一步中，如果所有元素都已比较过且没有找到匹配项，则说明搜索失败了；也就是说，该值不在数组中。\n\
  \n#### 示例：\n\n让我们现在考虑一个在有序数组中搜索特定值的示例。\n\n考虑一个声明为十个元素的数组：\n`int array[10] = {0,\
  \ 10, 20, 30, 40, 50, 60, 80, 90, 100};`\n\n且要搜索的值为 `VAL = 20`。那么算法将按如下方式进行：\n\n\
  **解法：**\n**第 1 轮：**\n`BEG = 0`, `END = 10`\n`MID = (BEG + END)/2` = (0 + 10)/2 =\
  \ 5\n现在 `VAL = 20` 且 `ARR[5] = 50`。\n由于 `ARR[5] = 50 > VAL`，我们现在将在数组的下半部分搜索该值。因此\
  \ `END` 和 `MID` 的值被修改，我们移动到下一轮。\n\n**第 2 轮：**\n`END = MID – 1 = 4`\n`MID = (0 +\
  \ 4)/2 = 2`\n现在 `VAL = 20` 且 `ARR[2] = 20`。\n因此搜索成功，位于位置 2。\n\n\n\n\n插值搜索（Interpolation\
  \ search），也称为外推搜索（extrapolation search），是一种在有序数组中查找特定值的技术。如果数组中的元素是有序的，这种搜索技术会比二分查找更高效。插值搜索的技术类似于我们在电话簿中查找“Abbey”这个名字；我们不会从中间开始，因为我们知道它会靠近最左侧，所以我们从开头开始并从那里着手。这就是插值搜索的核心思想；即我们不是将列表平分为固定的两部分，而是根据一个最可能成功的量进行切分。\n\
  \n## 实际应用\n\n如果我们想在目录中查找“Adda”，那么我们始终会在目录的最左侧进行搜索。\n\n### 6.4.1 插值搜索算法的工作原理\n\n\
  在这一搜索技术的每一步中，都会计算待搜索值的剩余搜索区域。计算是基于搜索区域边界处的值以及待搜索的值完成的。因此，在该位置找到的值现在将与待搜索的值进行比较。如果两个值相等，则认为搜索成功。如果两个值不相等，则根据比较的结果，剩余搜索区域将缩小为初始位置之前或之后的部分。\n\
  \n考虑一个包含 `n` 个元素的数组 `ARR`，其中元素按有序排列。初始时，`low` 设置为 0，`high` 设置为 `n-1`。现在我们要在 `ARR`\
  \ 中 `ARR[LOW]` 和 `ARR[HIGH]` 之间查找一个值 `VAL`。在这种情况下，`MID` 将通过以下公式计算：\n\n`MID = LOW\
  \ + (HIGH - LOW) X ((VAL – ARR[LOW] / (ARR[HIGH] – ARR[LOW]))`\n\n如果在 `MID` 处找到了值\
  \ `VAL`，则搜索完成；否则，如果该值小于 `ARR[MID]`，则重置 `HIGH = MID – 1`；如果值大于 `ARR[MID]`，则重置 `LOW\
  \ = MID + 1`。重复这些步骤直到找到该值。\n\n因此，我们可以说插值搜索与二分查找技术非常相似。这些技术之间的主要区别在于，在二分查找中，选定的值总是列表的中间值，并且根据待搜索值与估计位置找到的值之间的比较来丢弃一半的值。让我们通过一个算法来理解插值搜索：\n\
  \n**插值搜索算法**\n\n`INTERPOLATION_SEARCH(ARR, Lower_bound, Upper_bound, VAL)`\n\n**步骤\
  \ 1:** 开始\n**步骤 2:** 设置 `LOW = lower_bound`, `HIGH = upper_bound`, `POS = -1`\n\
  **步骤 3:** 当 `LOW<= HIGH` 时，重复步骤 4 和 5\n**步骤 4:** 设置 `MID = LOW + (HIGH - LOW) X\
  \ ((VAL – ARR[LOW] / (ARR[HIGH] – ARR[LOW]))`\n**步骤 5:** IF (`ARR[MID] = VAL`)\n\
  `POS = MID`\n`打印 POS`\n跳转到步骤 7\n`ELSE IF (`ARR[MID] > VAL)`\n设置 `HIGH = MID – 1`\n\
  `ELSE`\n设置 `LOW = MID + 1`\n[结束 IF]\n[结束循环]\n**步骤 6:** IF (`POS = -1`)\n`打印 \"未找到值，失败\"\
  `\n[结束 IF]\n**步骤 7:** 退出\n\n例如：考虑一个声明为如下的七个数字的数组：`int array[] = {5, 16, 23, 34,\
  \ 45, 56}`，要查找的值为 45。\n\n**解决方案**\n**第 1 轮:**\n`LOW = 0`, `HIGH = 7 - 1 = 6`, `VAL\
  \ = 45`\n`ARR[LOW] = ARR[0] = 5`, `ARR[HIGH] = ARR[6] = 65`\n现在，`MID = LOW + (HIGH\
  \ - LOW) × ((VAL – ARR[LOW]) / (ARR[HIGH] – ARR[LOW]))`\n`= 0 + (6 – 0) × ((45 –\
  \ 5)/(65 – 5))`\n`= 0 + 6 × (40/60) = 4`\n如果(`VAL == ARR[MID]`) 即 `45 == ARR[4]\
  \ = 45`，`45 = 45`\n\n![image](img/6.3.jpg)\n图 6.3 插值搜索的工作原理。因此，找到了该值。\n\n### 6.4.2\
  \ 插值搜索算法的复杂度\n\n当列表中有 `n` 个元素且元素均匀分布时，插值搜索大约进行 `log(log(n))` 次比较。显然，当元素数量呈指数增加时，会发生最坏情况；在这种情况下，算法可能需要高达\
  \ `O(n)` 次比较。\n\n编写一个程序使用插值搜索技术在数组中查找元素。\n\n```java\nimport java.util.Scanner;\n\
  public class InterpolationSearchDemo {\n    static Scanner scn = new Scanner(System.in);\n\
  \    public static void main(String[] args) {\n        int[] array = takeInput();\n\
  \        System.out.print(\"\\nEnter value to search:\");\n        int val = scn.nextInt();\n\
  \        int pos = interpolation_search(array, val);\n        if (pos < 0) {\n \
  \           System.out.print(\"\\n\" + val + \" not found\");\n        } else {\n\
  \            System.out.print(\"\\n\" + val + \" fount at position \" + (pos + 1));\n\
  \        }\n    }\n    public static int interpolation_search(int[] array, int value)\
  \ {\n        int low = 0, high = array.length - 1;\n        while (low <= high)\
  \ {\n            int mid = low + ((high - low) * (value - array[low])) / (array[high]\
  \ - array[low]);\n            if (array[mid] == value) {\n                return\
  \ mid;\n            } else if (array[mid] < value) {\n                low = mid\
  \ + 1;\n            } else {\n                high = mid - 1;\n            }\n \
  \       }\n        return -1;\n    }\n    public static int[] takeInput() {\n  \
  \      // Implementation not provided in snippet\n        return new int[0];\n \
  \   }\n}\n```\n\n\n\n\n选择排序是一种排序技术，它通过找到数组中的最小值并将其放在第一个位置来工作。之后，它会找到第二个最小值，并将其放在第二个位置。这个过程不断重复，直到整个数组排序完成。因此，选择排序的工作原理是找到整个数组中剩余的未排序最小元素，然后将其与下一个填充位置的元素交换。这是一种非常简单的技术，实现起来也比其他排序技术更容易。选择排序用于排序具有大记录的文件。\n\
  \n## 选择排序技术\n\n假设我们有一个包含 `N` 个元素的数组 `ARR`。现在，选择排序技术的操作如下：\n\n首先，我们将在整个数组中找到最小值，并将该值放在数组的第一个位置。然后，我们将在数组中找到第二个最小值，并将其放在数组的第二个位置。现在，我们将重复这个过程，直到整个数组排序完成。\n\
  \n- **第一轮通过**：在包含 `N` 个元素的数组中找到最小值的位置 `POS`，并将 `ARR[POS]` 与 `ARR[0]` 交换。因此，`ARR[0]`\
  \ 已排序。\n- **第二轮通过**：在包含 `N-1` 个元素的数组中找到最小值的位置 `POS`，并将 `ARR[POS]` 与 `A[1]` 交换。因此，`A[1]`\
  \ 已排序。\n- **第 N-1 轮通过**：找到 `ARR[N-2]` 和 `ARR[N-1]` 元素中较小元素的位置 `POS`，并将 `ARR[POS]`\
  \ 与 `ARR[N-2]` 交换。因此，`ARR[0]`、`ARR[1]`、…… `ARR[N-1]` 已排序。\n\n让我们通过详细的算法来讨论。\n\n\
  ## 选择排序算法\n\n考虑一个从 `ARR[0]` 到 `ARR[N-1]` 有 `N` 个元素的数组 `ARR`。`I` 和 `J` 是循环变量，`POS`\
  \ 是交换变量。\n\n```\nSELECTION SORT(ARR, N)\n\nStep 1: START\nStep 2: Repeat Steps 3\
  \ & 4 for I = 1 to N - 1\nStep 3: Call MIN(ARR, I, N, POS)\nStep 4: Swap ARR[I]\
  \ with ARR[POS] [End of Loop]\nStep 5: EXIT\n\nMIN(ARR, I, N, POS)\nStep 1: Set\
  \ SMALLEST = ARR[I]\nStep 2: Set POS = I\nStep 3: Repeat Step 4 for J = I + 1 to\
  \ N – 1\nStep 4: IF (ARR[J] < SMALLEST)\n    Set SMALLEST = ARR[J]\n    Set POS\
  \ = J\n[End of IF]\n[End of Loop]\nStep 5: Return POS\n```\n\n## 示例：使用选择排序对给定数组。\n\
