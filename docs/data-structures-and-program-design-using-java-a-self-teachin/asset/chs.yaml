  \n## 7.6 栈的应用\n\n在本节中，我们将讨论栈的各种应用。本节将涵盖以下主题：\n\n*   波兰表示法与逆波兰表示法\n*   中缀表达式转后缀表达式\n\
  *   中缀表达式转前缀表达式\n*   后缀表达式的求值\n*   前缀表达式的求值\n*   括号匹配\n\n现在，让我们详细了解每一个主题。\n\n###\
  \ 7.6.1 波兰表示法与逆波兰表示法\n\n#### (a) 波兰表示法（Polish Notations）\n\n波兰表示法是指将运算符放在操作数之前的表示法。波兰表示法是以波兰数学家扬·卢卡斯耶维奇（Jan\
  \ Lukasiewicz）命名的。我们也可以说将表达式转换格式称为波兰表示法。代数表达式可以用三种形式表示。所有这些形式都涉及到运算符相对于操作数的相对位置。\n\
  \n1. **前缀形式（Prefix Form）**：表达式中，如果运算符放在操作数之前，即 `+XY`，则被称为前缀形式。\n2. **中缀形式（Infix\
  \ Form）**：表达式中，如果运算符放在操作数之间，即 `X + Y`，则被称为中缀形式。\n3. **后缀形式（Postfix Form）**：表达式中，如果运算符放在操作数之后，即\
  \ `XY+`，则被称为后缀形式。\n\n#### (b) 逆波兰表示法（Reverse Polish Notation）\n\n这种表示法通常指后缀表示法或后缀符号。它是将运算符放在两个操作数之后的表示法，即\
  \ `XY + AF BC`。\n\n#### (c) 波兰表示法与逆波兰表示法的性\n\n计算机系统求值波兰表示法相对容易；系统不需要检查各种运算符的执行优先级（例如\
  \ `BODMAS` 括号、除、乘、加、减规则），因为前缀或后缀表达式中的所有运算符都会按照它们的优先级顺序出现。\n\n### 7.6.2 中缀表达式转后缀表达式\n\
  \n在任何表达式中，我们观察到存在两类型的组合部分/组件。它们是操作数和运算符。运算符指示要执行的操作，而操作数是运算符作用的对象。运算符有它们的执行优先级。为了算法的简单，我们将仅使用加（+）、减（-）、取模（%）、乘（*）和除（/）运算符。这些运算符的优先级如下：\n\
  \n\n\n\n\n`*`, `^`, `/`, `%` (高优先级) `+`, `-` (低优先级)\n\n这些运算符的计算顺序可以通过括号来改变。例如，表达式\
  \ `X * Y + Z` 可以被求解，首先执行 `X * Y`，然后将结果与 `Z` 相加。但如果用括号将相同表达式写成 `X * (Y + Z)`，现在先计算\
  \ `Y + Z`，然后将结果与 `X` 相乘。\n\n我们可以使用栈将中缀表达式（infix expression）转换为后缀表达式（postfix expression）。首先，我们从左到右扫描表达式。在表达式中，可能包含一些运算符、操作数和括号。因此，我们必须记住一些基本规则，如下所示：\n\
  \n- 每当我们遇到一个操作数时，将其直接添加到后缀表达式中。\n- 每当我们获取一个运算符时，我们应该始终检查栈顶以确定运算符的优先级。\n- 如果栈顶运算符的优先级高于或等于当前运算符的优先级，则将其反复从栈中弹出并添加到后缀表达式中。否则，将其推入栈。\n\
  - 每当我们遇到左括号时，直接将其推入栈中；同样，如果遇到右括号，我们将反复从栈中弹出它并将运算符添加到后缀表达式中。同时，将左括号从栈中删除。\n\n现在，让我们通过一个算法来理解它，该算法的第一步是将左括号推入栈中，并在中缀表达式的末尾添加一个右括号。重复该算法，直到栈为空。\n\
  \n### 将中缀表达式转换为后缀表达式的算法\n\n**步骤 1:** 开始\n**步骤 2:** 在中缀表达式的末尾添加 `)` 括号。\n**步骤 3:**\
  \ 将 `(` 括号推入栈。\n**步骤 4:** 重复上述步骤直到中缀表达式中的每个字符都被扫描完毕：\n- (a) 如果发现 `(` 括号，将其推入栈中。\n\
  - (b) 如果遇到操作数，将其添加到后缀表达式中。\n- (c) 如果发现 `)` 括号，遵循以下步骤：\n    - 持续从栈中弹出并添加到后缀表达式中，直到遇到\
  \ `(` 括号。\n    - 消除 `(` 括号。\n- (d) 如果发现运算符，遵循以下步骤：\n    - 持续从栈中弹出优先级与当前运算符优先级相同或更高的运算符到后缀表达式中。\n\
  \    - 将当前运算符推入栈。\n**步骤 5:** 持续从栈中弹出到后缀表达式中，直到栈为空。\n**步骤 6:** 退出\n\n#### 例如：将以下中缀表达式转换为后缀表达式。\n\
  \n(a) `(A + B) * C / D`\n\n(b) `[((A +B) * (C – D)) + (F – G)]`\n\n**解：**\n\n![image](img/274-01.jpg)\n\
