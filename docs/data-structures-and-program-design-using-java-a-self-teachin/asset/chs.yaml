  \n图的邻接矩阵为：\n\n**示例 3：** 现在，考虑给定的加权图并找到它的邻接矩阵。\n\n![image](img/12.18.jpg)\n\n图 12.18。\n\
  \n有向加权图。\n\n图的邻接矩阵为：\n\n**示例 4：** 考虑给定的无向多图并找到它的邻接矩阵。\n\n![image](img/12.19.jpg)\n\
  \n图 12.19。\n\n无向多图。\n\n图的邻接矩阵为：\n\n从前面的示例中，我们可以得出结论：\n\n* 使用邻接矩阵表示图所需的内存空间为 `n²`\
  \ 位。\n\n\n\n\n\n* 无向图的邻接矩阵始终是对称的。\n* 有向图的邻接矩阵不需要是对称的。\n* 无自环或并边的简单图的邻接矩阵在对角线上将始终包含\
  \ 0。\n* 加权图的邻接矩阵始终包含连接节点的边权重，而不是 0 和 1。\n* 无向多图的邻接矩阵包含连接顶点的边数，而不是 1。\n\n### 12.3.2\
  \ 邻接列表表示\n\n邻接矩阵表示存在一些主要的缺点。首先，在图中插入或删除节点非常困难，因为需要相应地改变矩阵的大小，这是一个非常耗时的过程。此外，矩阵有时包含许多零（稀疏矩阵）。因此，它不是一种健康的表示方式。因此，在内存中表示稀疏图时，优先使用邻接列表表示。在这种表示中，每个节点都连接到所有其他相邻节点的列表中。邻接列表表示使得添加或删除节点变得更容易。此外，它还能显示特定节点的相邻节点。现在，让我们举例来更清楚地讨论和理解它。\n\
