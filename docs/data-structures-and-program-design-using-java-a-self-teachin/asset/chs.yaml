  \ 父节点\n    (b) 子节点\n    (c) 根节点\n    (d) 关键节点\n\n# 第 9 章：多叉搜索树\n\n## 9.1 引言\n\n\
  我们已经学习了二叉搜索树，并讨论了二叉搜索树中的每个节点包含三个部分，即信息部分以及左孩子和右孩子，它们存储了指向左右子树的地址。相同的概念也用于多叉搜索树。*多叉搜索树是一种每个节点包含\
  \ (M – 1) 个值的树*。它也有 M 个子树。在多叉搜索树中，M 被称为节点的度。当多叉搜索树不为空时，每个节点具有以下属性：\n\n   ![image](img/355-01.jpg)\n\
  \n   其中 P[0], P[1], P[2], . . . P[n] 是节点的子树，而 K[0], K[1], K[2], . . . K[n] 是存储在节点中的键值。\n\
  \n\n\n\n2. 节点中的键值按升序存储，即 `K[i] < K[i+1]`，其中 `i = 0, 1, 2, . . . n-2`。\n\n3. 左子树中存储的所有键值始终小于根节点。\n\
  \n4. 右子树中存储的所有键值始终大于根节点。\n\n5. 对于 `i = 0, 1, 2, . . . n`，`P[i]` 指向的子树也是多路搜索树。\n\n\
  ![image](img/9.1.jpg)\n\n图 9.1。\n\n4 阶的多路搜索树。\n\n## 9.2 B 树 (B-Trees)\n\nB 树是一种特殊的多路树，广泛用于磁盘访问。B\
  \ 树由 Rudolf Bayer 和 Ed McCreight 于 1970 年开发。在 B 树中，每个节点可能包含大量的键。B 树的设计是为了在单个节点中存储大量键，从而保持高度相对较小。阶为\
  \ `m` 的 B 树具有多路搜索树的所有属性。此外，它还具有以下属性：\n\n1. 所有叶节点都位于底部或同一层。\n\n2. B 树中的每个节点最多有 `m`\
  \ 个子节点。\n\n3. 如果根节点不是叶节点，则它至少有两个子节点；如果它是叶节点，则显然可以没有子节点。\n\n4. B 树中的除根节点和叶节点外，每个节点至少有\
  \ `(m/2)` 个子节点。\n\n5. 每个叶节点必须至少包含 `ceil [(m/2) – 1]` 个键。\n\n例如：5 阶 B 树至少可以有 `ceil\
  \ [5/2] = 3` 个子节点和 `ceil [(5/2) – 1] = 2` 个键。显然，一个节点可以拥有的最大子节点数为 5。每个叶节点必须包含至少 2\
  \ 个键。\n\n![image](img/9.2.jpg)\n\n图 9.2。\n\n4 阶 B 树。\n\n### 实际应用\n\n在数据库程序中，数据量太大，无法放入内存；因此，它们被存储在辅助存储设备中，即磁带或磁盘。\n\
  \n## 9.3 B 树的操作\n\nB 树存储已排序的数据，我们可以对其执行以下操作：\n\n* 在 B 树中插入新元素\n* 从 B 树中删除元素\n\n\
  因此，让我们详细讨论这两个操作。\n\n### 9.3.1 在 B 树中插入\n\n首先，B 树的插入是在叶节点层完成的。在 B 树中插入元素的步骤如下：\n\n\
  **步骤 1**：在步骤 1 中，我们将搜索 B 树以找到要插入新键的叶节点。\n\n**步骤 2**：现在，如果该叶节点已满（即它已经包含了 `(m – 1)`\
  \ 个键），则按照以下步骤操作：\n\ni. 按顺序将新键插入到现有的键集中。\n\nii. 现在，节点被分成两半。\n\niii. 最后，将中间元素（中位数）向上推到其父节点。同样，如果父节点也满了，则按照这些步骤拆分父节点。\n\
  \n**步骤 3**：如果叶节点未满（即它包含 `(m – 1)` 个键），则将新键插入节点中，保持节点元素有序。（注：原文此处逻辑应为 m-1 且未满时直接插入）\n\
  \n### 常见问题\n\n**1. 构建一个 5 阶 B 树并向插入以下值：**\n\n**待插入的值 – B, N, G, A, H, E, J, Q, M,\
  \ D, V, L, T, Z**\n\n**答：**\n\n*1. 由于阶数 = 5，我们可以在单个节点中至少存储 3 个值，最多存储 4 个值。因此，我们将按顺序将\
  \ B, N, G, A 插入 B 树中。*\n\n![image](img/9.3a.jpg)\n\n图 9.3(a)\n\n*2. 现在要在 G 和 N 之间插入\
  \ H，所以现在的顺序将是 A B G H N，这是可能的，因为单个节点最多只能容纳 4 个值。因此现在我们将拆分节点，中间元素 G 将成为根节点。*\n\n\
  ![image](img/9.3b.jpg)\n\n图 9.3(b)\n\n*3. 现在我们向 B 树中插入 E J 和 Q。*!![image](img/9.3c.jpg)\n\
  \n图 9.3(c)\n\n*4. M 要插入到右子树中。但节点最多只能存储 4 个值，所以现在我们将中间元素（即 M）推入根节点。因此，节点被分成两半。*\n\
  \n![image](img/9.3d.jpg)\n\n图 9.3(d)\n\n*5. 现在我们向树中插入 D V L T。*\n\n![image](img/9.3e.jpg)\n\
  \n图 9.3(e)\n\n*6. 最后，要插入 Z。它将被插入。*\n\n![image](img/9.3f.jpg)\n\n图 9.3(f)\n\n\n\n\
  `A B+ tree` 是 `B-tree` 的变体，它像 `B-tree` 一样也存储有序数据。`B-tree` 的结构是数据库系统中索引的标准组织形式。`B+\
  \ tree` 实现了多级索引；即叶子节点构成一个密密索引，而非叶子节点构成一个稀疏索引。`B+ tree` 是一种略有不同的数据结构，它允许对数据进行顺序处理，并将所有数据存储在树的最低层。`B-tree`\
  \ 可以在其内部节点中同时存储记录和键，而 `B+ tree` 在其叶子节点中存储所有记录，在内部节点中存储键。在 `B+ tree` 中，叶子节点通过链表的形式相互连接。`B+\
  \ tree` 通常用于存储无法存在内存中的大量数据。因此，在 `B+ tree` 中，叶子节点存储在辅助存储中，而内部节点存储在内存中。\n\n在 `B+ tree`\
  \ 中，所有的内部节点被称为 `index nodes`，因为它们存储了索引值。同样，所有的外部节点都被称为 `data nodes`，因为它们存储了键。`B+\
  \ tree` 始终保持平衡，并且对于数据查找非常高效，因为所有数据都存储在叶子节点中。`B+ tree` 的各种优点如下：\n\n(a) `B+ tree`\
  \ 总是平衡的，与其它树结构相比，树的高度始终保持较小。\n\n(b) 所有的叶子节点相互连接，这使其非常高效。\n\n(c) 叶子节点也与上层节点连接；因此，它可以轻松地用于广泛的搜索查询。\n\
  \n(d) 记录可以在等量的磁盘访问次数被获取。\n\n(e) 记录可以按顺序或随机方式进行访问。\n\n(f) 数据搜索变得非常简单，因为所有信息只存储在叶子节点中。\n\
  \n(g) 同样，删除操作也非常简单，因为它只会发生在叶子节点中。\n\n![image](img/9.7.jpg)\n\n图 9.7。\n\n阶为 3 的 `B+\
  \ tree`。\n\n## 9.6 总结\n\n*   `M-way search tree` 每个节点有 `M – 1` 个值和 `M` 个子树。`M` 被称为节点的度。\n\
  *   `B-tree` 是一种专门的多路查找树，广泛用于磁盘访问。`B-tree` 由 Rudolf Bayer 和 Ed McCreight 于 1970\
  \ 年开发。\n*   阶为 `m` 的 `B-tree` 具有多路查找树的所有属性。\n*   `B-tree` 的主要应用是将大量数据或巨大的记录集组织成文件结构。\n\
  *   `B+ tree` 是 `B-tree` 的一种变体，它像 `B-tree` 一样也存储有序数据。`B-tree` 的结构是数据库系统中索引的标准组织形式。`B+\
  \ tree` 是一种略有不同的数据结构，它允许对数据进行顺序处理，并将所有数据存储在树的最低层。\n\n## 9.7 练习题\n\n### 9.7.1 复习题\n\
