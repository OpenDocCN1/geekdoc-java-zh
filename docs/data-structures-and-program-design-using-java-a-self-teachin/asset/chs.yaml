  );\n    }\n    Node temp = front;\n    System.out.println(\"Priority \\t\\t Value\"\
  );\n    while (temp != null) {\n      System.out.println(temp.priority + \" \\t\\\
  t\\t \" + temp.data);\n      temp = temp.next;\n    }\n  }\n}\n```\n\n// 客户端类\n\
