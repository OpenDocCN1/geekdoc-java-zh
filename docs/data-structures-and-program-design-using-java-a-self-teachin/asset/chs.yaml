  \ 多态\n   (b) 抽象\n   (c) 继承\n   (d) 封装\n\n# 第 3 章\n# 数组\n\n## 3.1 引言\n\n在上一章中，我们学习了数据结构和\
  \ Java 中的编程基础，其中我们的目标是设计良好的程序。在这里，良好的程序是指通过占用较少内存空间运行正确且高效，并且运行和执行时间更短的程序。无疑，当一个程序以较少的内存空间和最短的时间执行时，它被说成是高效的。在这一章中，我们将学习数组的概念。数组是一种用户定义的数据类型，将相关信息存储在一起。接下来的章节将详细讨论数组。\n\
  \n\n数组是连续内存中同构（相同）类型数据元素的集合。数组是一种线性数据结构，因为数组的所有元素按线性顺序存储。让我们来看一个例子，假设级上有十个学生，我们要求存储这十个学生的成绩；那么我们需要名为数组的数据结构。\n\
  \n![image](img/3.1.jpg)\n\n图 3.1. 十个元素数组的表示。\n\n在前面的示例中，数据元素存储在连续的内存位置，并通过索引号（也称为下标）标识，即\
  \ `A^i` 或 `A[i]`。下标是一个用于标识数组元素的序数。数组的元素具有相同的数据类型，数组中的每个元素都可以使用相同的名称访问。\n\n### 常见问题\n\
  \n**1. 什么是数组？我们如何标识数组中的元素？**\n\n答：数组是连续内存中同构（相同）类型数据元素的集合。数组中的元素可以通过其索引号来标识，这也称为下标。\n\
  \n## 3.3 数组的声明\n\n我们知道，所有变量在程序中使用之前都必须声明。因此，相同的概念也适用于数组变量。数组在使用之前必须先声明。在声明数组期间，必须指定数组的大小。\n\
  \n- **数据类型**：数据类型意味着它可以存储的值的种类。数据类型可以是 `int`、`float`、`char` 或任何其他。\n- **数组名称**：名称是指用于标识数组的名称。\n\
  - **大小**：数组的大小是指数组可以包含的最大值数量。\n\n**语法：** `data_type [] array_name = new data_type[size]`\n\
  \n示例：`int [] salary = new int[10]``上面的示例声明 `salary` 为具有十个元素的数组。在 Java 中，索引从零开始。数组的第一个元素将存储在\
  \ `salary[0]`，第二个元素将存储在 `salary[1]`，依此类推。同样，最后一个元素将存储在 `salary[9]`。\n\n![image](img/3.2.jpg)\n\
  \n图 3.2. 数组的内存表示。这里方括号中的 0, 1, 2 ... 9 表示我们标识特定元素的下标。\n\n\n数组的初始化可以通过以下方式进行：\n\n\
  1. **编译时初始化**：在编译时对数组元素进行初始化是在声明时初始化普通变量相同的方法。当初始化数组时，需要为数组中的每个元素提供一个特定值。\n\n初始化数组的通用形式为：`data_type\
  \ [] array_name = {值列表}`\n\n在初始化数组时，我们可以省略数组的大小。例如：`int [] age = {20, 25, 23, 28,\
  \ 30};`\n\n在前面的示例中，编译器将为所有初始化的数组元素分配内存。如果提供的值少于大小，则此类元素将取零作为赋值值。例如：\n\n```java\n\
  int [] marks;\nmarks = new int [] {56, 69, 40, 99, 82, 96, 72};\n```\n\n这里数组的大小为\
  \ 10，但只有七个元素；因此，剩余元素将被视为零。\n\n2. **运行时初始化**：在运行时对数组元素进行初始化是从键盘输入值的方法。在这种方法中，采用 `while`、`do-while`\
