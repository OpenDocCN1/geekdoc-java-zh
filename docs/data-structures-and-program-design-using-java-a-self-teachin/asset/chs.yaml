  \ 博士**\n\n2020 年 2 月\n\n# 第 1 章\n\n\n## 1.1 引言\n\n数据结构是在计算机内存中存储和组织数据元素的一种高效方法。数据意味着一个值或一组值的集合。结构指的是组织数据的方法。数据在内存中的数学或逻辑表示法称为数据结构。数据结构的目标是高效地存储、检索和更新数据。数据结构可以被视为归类在一个名称下的元素。这些数据元素被称为成员，它们可以是不同的类型。数据结构几乎应用于每一个程序和软件系统。有各种类型的数据结构适用于不同类型的应用。数据结构是程序的基石。为了让程序高效运行，程序员必须选择合适的数据结构。数据结构是数据管理至关重要的部分。正如名称所示，数据管理是一项包含了数据收集、将数据组织成结构等不同活动的任务。使用数据结构的示例包括栈、队列、数组、二叉树、链表、哈表等。\n\
  \n数据结构帮助我们理解一个元素与另一个元素之间的关系并在内存中对其组织。它是内存中数据的数学或逻辑表示或组织。数据结构广泛应用于以下领域：\n\n*   编译器设计\n\
  *   数据库管理系统 (DBMS)\n*   人工智能\n*   网络与数值分析\n*   统计分析软件包\n*   图形学\n*   操作系统 (OS)\n\
  *   仿真\n\n正如我们在上一个列表中看到的，许多应用都使用了不同的数据结构来执行操作。某些数据结构为了内存的高效利用而牺牲速度，而另一些则牺牲内存利用率以获得更快的速度。\n\
  \n\n\n\n线性数据结构是指数据元素按照线性或顺序方式存储的结构；也就是说，数据存储在连续的内存位置中。线性数据结构可以通过两种方式表示：通过利用连续的内存位置建立各种元素之间的线性关系来表示（例如数组），或者通过从一个元素到另一个元素的链接建立元素之间的线性关系来表示（例如链表）。线性数据结构的示例包括数组、链表、栈、队列等。\n\
  \n非线性数据结构是指数据不以任何顺序或连续的内存位置存储的结构。这种结构中的数据元素以层级顺序表示。非线性数据结构的示例包括图、树等。\n\n\n静态数据结构是内存中的一组数据，其大小是固定的，且在运行时不能更改。必须提前知道其大小，因为在程序后期无法重新分配内存。一个例子是\
  \ `array`（数组）。\n\n动态数据结构是内存中的一组数据，在程序执行期间可以重新分配内存。程序员可以根据需要添加或删除元素。示例包括链表、图、树等。\n\
  \n## 1.2.3 同质与非同质数据结构\n\n同质数据结构包含相同类型的数据元素，例如数组。\n\n非同质数据结构包含不同类型的数据元素，例如结构（struct）。\n\
  \n## 1.2.4 基础与非基础数据结构\n\n基础数据结构是编程语言支持的基础预定义数据结构。基础结构类型的示例有 `int`、`float`、`char`\
  \ 等。\n\n非基础数据结构是使用基础结构创建的相对复杂的数据结构。非基础数据结构的示例有数组、链表、栈、队列等。\n\n不同数据结构的分类如图 1.1 所示。\n\
  \n![image](img/1.1.jpg)\n*图 1.1. 不同数据结构的分类。*\n\n我们知道 `Java` 支持各种数据结构。因此，现在我们将介绍这些数据结构，并在接后的章节中进行详细讨论。\n\
  \n## 常见问题\n### 2. 请写出基础数据结构与非基础数据结构之间的区别。\n\n**答：** 基础数据结构：通常由机器级指令操作的数据结构，如 `int`、`float`、`char`\
  \ 等，被称为基础结构。\n\n非基础数据结构：不属于基础的数据结构被称为非基础数据结构。\n\n### 3. 请解释线性与非线性数据结构之间的区别。\n\n\
  **答：** 线性与非线性数据结构的主要区别在于数据元素的组织方式。在线性数据结构中，元素按顺序组织，因此在计算机内存中易于实现。在非线性数据结构中，一个数据元素可以连接到多个其他元素，以表示它们之间存在的特定关系。\n\
  \n### 1.2.5 数组\n\n数组是连续内存中同质（相似）类型数据元素的集合。数组是一种线性结构，因为数组的所有元素都是按线性顺序存储的。数组的各种元素通过其索引值（也称为下标）引用。在\
  \ `Java` 中，使用以下语法声明数组：\n\n**语法** – `<Data type> array name [size];`\n\n元素存储在数组中的情况如图\
  \ 1.2 所示。\n\n![image](img/1.2.jpg)\n*图 1.2. 数组的内存表示。*\n\n数组用于存储大量类型的数据。它们具有各种优点和局限性。\n\
  \n**使用数组的优点：**\n1. 元素存储在相邻的内存位置；因此，速度非常快，可以轻松访问任何元素。\n2. 数组不支持动态内存分配，因此所有内存管理都由编译器完成。\n\
  \n1. 数组元素的插入和删除非常复杂且极其耗时，因为需要移动元素。\n2. 数组是静态的；因此必须提前知道大小。\n3. 数组中的元素存储在连续的内存位置，这些位置可能可用也可能不可。\n\
  \n### 1.2.6 队列\n\n队列是数据元素的线性集合，其中第一个插入的元素是第一个出来的元素；也就是说，队列是一种 FIFO（先进先出）数据结构。队列是一种常用的线性数据结构，第一个元素从一个称为\
  \ `REAR`（也称为尾部）的端插入，而元素的删除在另一个称为 `FRONT`（也称为头部）的端进行。\n\n**实际应用**\n为了简单地说明队列，设想有一排人站在公交站等车。因此，排在队里的第一个人将先上车。\n\
  \n在计算机内存中，队列可以使用数组或链表实现。图 1.3 显示了队列的数组实现。每个队列都有 `FRONT` 和 `REAR` 变量，分别指向删除和插入的位置。\n\
  \n![image](img/1.3.jpg)\n*图 1.3. 队列的内存表示。*\n\n### 1.2.7 栈\n\n栈是数据元素的线性集合，其中插入和删除只在栈顶进行。栈是一种\
  \ LIFO（后进先出）数据结构，因为最后一个推入栈的元素将是第一个被删除的元素。在栈上执行的操作包括 `PUSH`、`POP` 和 `PEEP`。`PUSH`\
  \ 操作将元素输入到栈顶，而 `POP` 操作从栈中删除元素。`PEEP` 操作返回栈顶元素的值但不删除它。\n\n**实际应用**\n栈的一个现实例子是桌子上堆的一叠盘子。人会从栈顶取走第一个盘子。\n\
  \n在计算机内存中，栈可以使用数组或链表实现。图 1.4 显示了栈的数组实现。\n\n![image](img/1.4.jpg)\n\n每个栈都有一个与其相关的\
  \ `TOP` 变量。`TOP` 节点存储栈顶元素的地址。`TOP` 是插入和删除的位置。\n\n### 1.2.8 链表\n\n数组的主要局限是必须提前知道大小或元素数量。因此，这一局限产生了链表的新概念。链表是数据元素的线性集合。这些数据元素被称为节点，每个节点存储下一个节点的地址。链表是节点的序列，每个节点包含一个或多个数据字段和一个存储下一个节点地址的地址字段。此外，链表是动态的；也就是说，内存根据需要进行分配。\n\
  \n![image](img/1.5.jpg)\n*图 1.5. 链表的内存表示。*\n\n在之前的图中，我们制作了一个链表，其中每个节点被分为两个槽：\n1.\
  \ 第一个槽包含信息/数据。\n\n\n\n\n2. 第二个槽包含下一个节点的地址。\n\n## 实际应用\n\n一个简单的现实生活例子是火车；在这里，每节车厢都与其前节和下一节车厢连接（第一节和最后一节车厢除外）。\n\
  \n最后一个节点的地址部分存储一个名为 `NULL` 的特殊值，表示链表的结束。链表相比于数组的优势是现在插入和删除数据元素更加容易，因为我们不需要每次都进行移动。然而，搜索一个元素变得困难了。此外，搜索一个元素需要更多的时间，而且需要较大的内存空间。因此，当需要一组数据元素但事先不知道集合中数据元素的数量时，就会使用链表。\n\
  \n\n### 4. 定义“链表”术语。\n\n**答：** 链表或单向列表是一种称为“节点”的数据元素的线性集合，它们给出一个线性顺序。它是一种流行的动态数据结构。链表中的节点并不存储在连续的内存位置中。链表中节点中的每个数据项都有一个关联的地址字段，该字段给出链表中下一个节点的地址位置。\n\
  \n### 1.2.9 树\n\n树是一种流行的非线性数据结构，其中数据元素或节点以分层顺序表示。在这里，其中一个节点被显示为树的根节点，其余节点被分为两个不相交的集合，使得每个集合都是子树的一部分。树使得搜索过程非常简单，其递归编程使得程序经过优化且易于理解。\n\
  \n二叉树是树的最简单形式。二叉树由一个根节点和两个子树称为左子树和右子树组成，这两个子树也是二叉树。树中的每个节点由三部分组成，即最左部分存储左子树的地址，中间部分包含数据元素，最右部分存储右子树的地址。根是树的最顶端元素。当树中没有节点时，即\
  \ `ROOT = NULL`，它被称为空树。\n\n例如，考虑一个二叉树，其中 `R` 是树的根节点。`LEFT` 和 `RIGHT` 分别是 `R` 的左子树和右子树。节点\
  \ `A` 指定为树的根节点。节点 `B` 和 `C` 分别是 `A` 的左孩子和右孩子。节点 `B`、`D`、`E` 和 `G` 构成根节点的左子树。同样，节点\
  \ `C`、`F`、`H` 和 `I` 构成根节点的右子树。\n\n![image](img/1.6.jpg)\n\n图 1.6。\n\n二叉树。\n\n###\
  \ 树的优点\n\n1. 树中的搜索过程非常快。\n2. 与其他数据结构相比，元素的插入和删除变得更加容易。\n\n\n### 5. 定义“二叉树”术语。\n\n\
  **答：** 二叉树是一种分层数据结构，其中每个节点最多有两个孩子，即左孩子和右孩子。在二叉树中，每个节点的度数最多为二。二叉树用于实现二叉搜索树，用于高效的搜索和排序。`BST`\
  \ 的变体是 `AVL 树`，其左、右子树的高度差为一。二叉树是 `k 叉树` 的流行子类型，其中 `k` 为 2。\n\n### 1.2.10 图\n\n图是一种没有父子关系的通用树。它是一种非线性数据结构，由顶点（也称为节点）和连接这些顶点的边组成。在图中，可以存在任何复杂的关系。图\
  \ `G` 可以定义为顶点 `V` 集合和边 `E` 的有限集。因此，`G = (V, E)`，其中 `V` 是顶点集，`E` 是边集。图用于数学和计算机科学的各种应用。与树的根节点不同，图没有根节点；节点可以连接到图中的任何节点。当两个节点通过边连接时，称为相邻节点。\n\
  \n## 实际应用\n\n图的现实生活例子可以是工作站，几台计算机通过网络连接在一起。\n\n例如，考虑一个具有六个顶点和八条边的图 `G`。在这里，`Q` 和\
  \ `Z` 是 `P` 的邻居。同样，`R` 和 `T` 是 `S` 的邻居。\n\n![image](img/1.7.jpg)\n\n图 1.7。\n\n图。\n\
  \n## 1.3 数据结构的操作\n\n在这里我们将讨论在数据结构上执行的各种操作。\n\n* **创建：** 创建数据结构的过程。在这里完成数据结构的声明和初始化。这是第一个操作。\n\
  * **删除：** 从给定的数据元素集合中移除特定数据元素的过程，例如移除离开公司的员工的名字。\n* **更新：** 修改数据结构数据元素的过程。例如，如果学生的地址发生了变化，则应该进行更新。\n\
  * **搜索：** 用于根据给定的键找到特定数据元素或所有数据元素的位置，例如，查找住在纽约的人。\n* **排序：** 将数据元素按某种顺序排列的过程。例如，按字母顺序排列名字。\n\
  * **合并：** 将两个不同列表的数据元素合并以形成单一列表的过程。\n* **遍历：** 访问每个数据元素一次的过程，以便进行处理。例如，打印所有学生的名字。\n\
  * **销毁：** 删除整个数据结构的过程。这是数据结构中的最后一个操作。\n\n## 1.4 算法\n\n算法是解决复杂问题的系统指令集。它是一系列有限的指令序列，每条指令都有明确的含义并可以在有限时间内以最少的努力执行。通常情况下，算法是编写程序的蓝图。一旦我们有了解决方案的蓝图，就可以在任何\
  \ `C`、`C++`、`Java` 等高级语言中实现它。它将问题分解为有限的步骤。用编程语言编写的算法被称为程序。计算机是没有大脑或智能的机器。因此，必须指示计算机以无歧的步骤执行给定任务。因此，程序员必须用英文算法的形式定义他的问题。这样的算法应该具有以下特征：\n\
  \n1. 算法应该是简单简洁的。\n2. 它应该是高效有效的。\n3. 它应该没有歧义；即逻辑必须清晰。\n\n同样，算法必须具有以下特点：\n\n* **输入：**\
  \ 读取给定问题的数据。\n* **输出：** 必须产生预期的结果。\n* **过程/确定性：** 每一步或指令必须是无歧的。\n* **有效性：** 每一步都应该是准确简洁的。预期结果应在有限时间内产生。\n\
  * **有限性：** 步骤数应该是有限的。\n\n### 1.4.1 开发算法\n\n开发算法建议采取步骤：\n1. 定义或理解问题。\n2. 识别问题的结果或输出。\n\
  3. 识别问题所需的输入并选择最佳输入。\n4. 从给定的输入设计逻辑以获得预期输出。\n\n\n\n\n\n5. 对不同的输入进行算法测试。\n6. 重复上述步骤，直到对所有输入都产生预期的结果。\n\
  \n## 1.5 算法设计方法\n\n复杂的算法被划分为较小的单元，称为模块。然后这些模块进一步划分为子模块。通过这种方式，复杂的算法可以很容易地解决。将算法划分为模块的过程称为模块化。设计算法有两种流行的方法：\n\
  \n* 自顶向下法 (Top-Down Approach)\n* 自底向上法 (Bottom-Up Approach)\n\n现在让我们来理解这两种方法。\n\n\
  1. **自顶向下法：** 自顶向下法指出，复杂/困难的问题或算法应该被分为更小的模块。这些较小的模块进一步划分为子模块。重复这个分解过程，直到我们达到模块复杂度的预期输出。自顶向下法从顶层模块开始，相应地增加模块，直到达到不再需要子模块的级别，即达到了所需的复杂度水平。\n\
  \n   ![image](img/1.8.jpg)\n   图 1.8。\n   自顶向下法。\n\n2. **自底向上法：** 自底向上的算法设计方法是自顶向下法的反面。在这种方法中，我们首先从设计基础模块开始，进一步向设计高级模块进。将子模块组合形成一个更高层次的模块。同样，将所有高级模块组合形成更高级的模块。因此，重复这种组合子模块的过程，直到我们获得算法的预期输出。\n\
  \n![image](img/1.9.jpg)\n图 1.9。\n\n## 1.6 算法分析\n\n算法可以从两个因素进行分析，即空间和时间。我们的目标是开发一种能够充分利用这两种资源的算法。分析算法是为了衡量算法的效率。算法的效率通过速度和时间复杂度来衡量。算法的复杂度是一个根据输入规模衡量算法所用空间时间的函数。\n\
  \n**时间复杂度：** 算法的时间复杂度是算法完全运行程序所需的时间。它是程序的运行时间。算法的时间复杂度取决于输入的大小。时间复杂度通常用大 O 表示表示。例如，线性搜索的时间复杂度为\
  \ `O(n)`。\n\n**空间复杂度：** 算法的空间复杂度是完全运行程序所需的内存空间。算法的空间复杂度取决于输入的大小。\n\n时间复杂度分为三类：\n\
  \n1. **最坏情况运行时间 (Best-Case Running Time)：** 算法的性能在最优条件下是最好的。例如，二分查找的最优情况发生在目标元素是列表的中间元素时。另一个例子可以是排序；即，如果元素已经在列表中排好序，那么算法将以最佳时间执行。\n\
  2. **平均情况运行时间 (Average-Case Running Time)：** 它表示当输入从给定的集合或分布中随机抽取时算法的行为。它是对“平均”输入运行时间的估计。通常假设给定规模的所有输入都可能以相等的概率出现。\n\
  3. **最坏情况运行时间 (Worst-Case Running Time)：** 在这种情况下，算法的行为涉及输入实例的最坏可能情况。算法的最坏情况运行时间是任何输入运行时间的上界。例如，线性搜索的最坏情况发生在目标元素是列表中的最后一个元素，或者该元素不在列表中时。\n\
  \n### 常见问题\n\n**6. 定义时间复杂度**\n\n**答：** 时间复杂度是一种衡量标准，它通过作为输入规模的函数来评估给定算法所执行的操作计数。它是执行算法所需步骤数量的近似值。它通常用渐近记法表示，即\
  \ `O(g)` 表示法，也称为大 O 表示法，其中 `g` 是输入数据规模的函数。\n\n## 1.6.1 时间空间权衡\n\n在计算机科学中，时间空间权衡是用更少的时间更多的内存空间或用更多的时间更少的内存空间来解决特定问题。但从实际角度来看，设计一种既能节省空间又能节省时间的算法是一项挑战性任务。因此，我们可以使用多个算法来解决问题。其中一个可能需要少的时间，而另一个可能需要更少的内存空间来执行。因此，我们为了另一个牺牲另一个。因此，算法之间存在时间空间或内存权衡。这种时间空间权衡从知情的角度为程序员提供了一个理性的选择。如果时间对程序员来说很重要，那么他可能会选择一个执行时间短或最短的程序。另一方面，如果空间是程序员的首要考虑，那么在这种情况下，他可能会选择一个以更多时间为代价使用更少内存程序。\n\
  \n\n抽象数据类型 (ADT) 是数据对象的流行数学模型，它定义了数据类型以及在这些对象上操作的各种。为了理解抽象数据类型的含义，我们将简单地将该词分为两个部分，即“数据类型”和“抽象”。变量的数据类型是变量可以取值的值的集合。Java\
  \ 中有各种数据类型，包括 `integer`、`float`、`character`、`long`、`double` 等。当我们在数据结构的背景下讨论“抽象”一词时，它的意味着详细的规范。它可以被视为对带有操作列表的结构描述。因此，抽象数据类型是数据类型的规范，指定了数据的数学和逻辑模型。例如，当我们使用\
  \ `stacks` 和 `queues` 时，在那个点我们主要关注的是数据类型和对其的操作。我们不担心数据如何存储在内存中。同样，我们也不关心 `push()`\
  \ 和 `pop()` 是如何工作的。\n\n\n\n复杂度为 `O*(log[2]*n*)` 的算法被认为是最好的算法之一，而复杂度为 `O*(2^(*n*))`\
  \ 的算法被认为是最差的算法。各种类型函数中所需的计算复杂度或迭代次数可以比较如下：\n\n`O*(log[2]*n*) < O*(n*) < O*(n log[2]*n*)\
  \ < O*(n²)< O*(n³) < O*(2^(*n*))`\n\n# 1.9 总结 \n\n*   数据结构决定了在计算机内存中存储和组织数据元素的方法。数据意味着一个值或一组值的集合。结构指的是组织数据的方法。内存中数据的数学或逻辑表示称为数据结构。\n\
  *   数据结构分为若干类型，包括线性数据结构和非线性数据结构、基本数据结构和非基本数据结构、静态和动态数据结构以及同构和异构数据结构。\n*   线性数据结构是指数据元素按线性或顺序存储的结构；即数据存储在连续的内存位置中。非线性数据结构是指数据不以任何顺序或连续内存位置存储的结构。\n\
  *   静态数据结构是内存中大小固定且在运行期间不能更改的数据集合。动态数据结构是在程序执行期间可以重新分配内存的数据集合。\n*   基本数据结构是编程语言支持的基础型数据结构或预定义数据结构。非基本数据结构是使用基本数据结构创建的相对复杂的数据结构。\n\
  *   同构数据结构包含所有相同类型的数据元素。异构数据结构包含不同类型的数据元素。\n*   数组是存储在连续内存中的同构（相同）类型数据元素的集合。\n*\
  \   队列是数据元素的线性集合，其中先插入的元素将先取出，即先进先出（FIFO）数据结构。队列是一种线性数据结构，元素从一个称为 `REAR`（尾部）的端插入，删除发生在另一个称为\
  \ `FRONT`（头部）的端。\n*   链表是节点序列，每个节点包含一个或多个数据字段以及一个存储下一个节点地址的地址字段。\n*   栈是数据元素的线性集合，插入和删除只发生在称为\
  \ `TOP`（栈顶）的一端。栈是一种后进先出（LIFO）数据结构，因为最后添加到栈顶的元素将是第一个从栈顶删除的元素。\n*   树是一种非线性数据结构，数据元素或节点按层次顺序表示。在这里，初始节点被指定为树的根节点，其余节点被分为两个不相交的集合，每个集合都是一个子树的一部分。\n\
  *   二叉树是树的最简单形式。二叉树由一个根节点两个称为左树和右树的子树组成，这两个子树也是二叉树。\n*   图是没有父子关系的通用树。它是一种非线性数据结构，由顶点（节点）和连接这些顶点的边组成。\n\
  *   算法是用于解决复杂问题的系统指令集。它是一系列逐步步进的指令序列，每条指令都有明确的含义，并可以在有限时间内以最少的精力执行。\n*   将算法划分为模块的过程称为模块化。\n\
  *   算法的时间复杂度描述为算法完全运行程序所需的时间量。它是程序的运行时间。\n*   ADT（抽象数据类型）是数据对象的数学模型，它定义了数据类型以及用于操作这些对象的函数。\n\
  *   大 O 符号法是最流行的分析表征方案之一，因为它提供了算法复杂度的上界。\n\n# 1.10 练习\n\n## 1.10.1 理论题\n\n1. 如何定义一个好的程序？\n\
