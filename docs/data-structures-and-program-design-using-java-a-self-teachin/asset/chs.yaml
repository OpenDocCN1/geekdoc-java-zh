  \ int item) {\n        if (node == null) {\n            return;\n        }\n   \
  \     if (item > node.data) {\n            delete(node.right, node, item);\n   \
  \     } else if (item < node.data) {\n            delete(node.left, node, item);\n\
  \        } else {\n            if (node.left == null && node.right == null) { //\
