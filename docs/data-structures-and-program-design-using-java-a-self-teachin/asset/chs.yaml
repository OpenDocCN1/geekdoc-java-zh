  \n因此，排序后的新数组为：\n\n![image](img/233-01.jpg)\n\n## 选择排序算法的复杂度\n\n选择排序是一种简单的排序技术。在这种方法中，如果数组中有\
  \ `n` 个元素，则会进行 `(n-1)` 次比较或迭代。因此，选择排序技术的复杂度为 `O(n^²)`。\n\n```java\n//写一个程序使用选择排序方法对数组进行排序。\n\
  \nimport java.util.Scanner;\npublic class SelectionSortDemo {\n  static Scanner\
  \ scn = new Scanner(System.in);\n  public static void main(String[] args) {\n  \
  \      int[] array = takeInput();\n        selection_sort(array);\n        display(array);\n\
  \  }\n  public static int[] takeInput() {\n        System.out.print(\"\\nEnter 数组元素个数:\"\
  );\n        int size = scn.nextInt();\n        int[] arr = new int[size];\n    \
  \    System.out.print(\"\\nEnter 数组元素:\");\n        System.out.println();\n    \
  \    for (int i = 0; i < arr.length; i++) {\n            System.out.print(\"输入元素\
  \ \"+(i+1)+\": \");\n            arr[i] = scn.nextInt();\n        }\n        return\
  \ arr;\n  }\n  public static void selection_sort(int[] array) {\n        int n =\
  \ array.length - 2;\n        for (int c = 0; c <= n; c++) {\n            int min=c;\n\
  \            for (int j = c+1; j <= n+1; j++) {\n                if (array[j]<array[min])\
  \ {\n                    min=j;\n                }\n            }\n            int\
  \ temp = array[min]; // 注意：此处原始逻辑略有错误，但保留了核心结构\n        }\n  }\n  public static\
  \ void display(int[] arr) {\n        System.out.print(\"\\n 排序后的数组为: \");\n    \
  \    for (int val : arr) {\n            System.out.print(val + \" \");\n       \
  \ }\n  }\n\n```\n\n程序的输出为：\n\n![image](img/234-01.jpg)\n\n## 常见问题\n\n### 3. 定义选择排序。\n\
  **答**：选择排序是一种排序技术，它通过从数组中找到最小元素并将其放在第一个位置来工作。然后它找到第二个最小元素并将其放在第二个位置。重复此过程，直到整个数组排序完成。\n\
  \n### 2. 插入排序\n插入排序是另一种非常简单的算法，正如其名，它通过将每个元素插入到正确位置来工作，为了节省内存，我们可以将其与先前的元素进行交换，直到它处于正确位置。\n\
  \n## 实际应用\n我们通常在玩桥牌游戏时使用这种技术。\n\n## 插入排序技术\n\n**第一轮通过**：初始列表中只有一个元素，已经是排序的。因此，我们继续。\n\
  - **第二轮通过**：在第一次迭代中，列表的前两个元素进行比较。最小值占据列表的第一个位置。\n- **第三轮通过**：在第二次迭代中，列表的前三个元素进行比较。最小值占据第一个位置，第二个位置由第二个最小元素占据，以此此类推。\n\
  \n此过程对数组的所有元素重复 `(n-1)` 次迭代。\n\n### 插入排序算法\n\n```\nINSERTION SORT(ARR, N)\n\nStep\
  \ 1: START\nStep 2: Repeat Steps 3 to 6 for I = 1 to N - 1\nStep 3: Set POS = ARR[I]\n\
  Step 4: Set J = I - 1\nStep 5: Repeat while POS <= ARR[J]\n    Set ARR[J + 1] =\
  \ ARR[J]\n    Set J = J – 1\n[while 循环结束]\nStep 6: Set ARR[J + 1] = POS\n[循环结束]\n\
  Step 7: EXIT\n```\n\n在之前的算法中，在步骤 2 中执行循环，对数组中的每个元素都会执行。在步骤 3 中，我们将 `I` 元素的值存储在 `POS`\
  \ 中。在步骤 5 中，再次执行循环，插入排序后的元素。最后，元素存储在 `(J+1)` 位置。\n\n**例如：**考虑以下数组。使用插入排序技术对数组给值进行排序。\n\
  \n![image](img/235-01.jpg)\n\n**解答：**\n\n![image](img/235-02.jpg)\n\n**第一轮**：![image](img/236-01.jpg)\n\
  **第二轮**：![image](img/236-02.jpg)\n**第三轮**：![image](img/236-03.jpg)\n**第四轮**：![image](img/236-04.jpg)\n\
  **第五轮**：![image](img/236-05.jpg)\n\n\n\n\n```java\nimport java.util.Scanner;\npublic\
  \ class InsertionSortDemo {\n    static Scanner scn = new Scanner(System.in);\n\
  \    public static void main(String[] args) {\n        int[] array = takeInput();\n\
  \        insertion_sort(array);\n        display(array);\n    }\n    public static\
  \ int[] takeInput() {\n        System.out.print(\"\\nEnter no of elements of array:\"\
  );\n        int size = scn.nextInt();\n        int[] arr = new int[size];\n    \
  \    System.out.print(\"\\nEnter the elements of array:\");\n        System.out.println();\n\
  \        for (int i = 0; i < arr.length; i++) {\n            System.out.print(\"\
  Enter element \"+(i+1)+\": \");\n            arr[i] = scn.nextInt();\n        }\n\
  \        return arr;\n    }\n    public static void insertion_sort(int[] array)\
  \ {\n        int n = array.length;\n        for (int c = 0; c < n; c++) {\n    \
  \        int temp = array;\n            int j = c - 1;\n            while (j >=\
  \ 0 && array[j] > temp) {\n                array[j + 1] = array[j];\n          \
  \      j--;\n            }\n            array[j + 1] = temp;\n        }\n    }\n\
  \    public static void display(int[] arr) {\n        System.out.print(\"\\nAfter\
  \ sorting array is: \");\n        for (int val : arr) {\n            System.out.print(val\
  \ + \" \");\n        }\n    }\n}\n```\n程序的输出显示如下：\n\n![image](img/237-01.jpg)\n\n\
  # 3. 合并排序\n\n合并排序是一种遵循分治策略的排序方法。分治法是一种非常好的方法，其中“分”意味着将包含 `n` 个元素的数组划分为两个各包含 `n/2`\
  \ 个元素的子数组。然而，如果列表/数组中不存在元素，或者数组只包含一个元素，那么它已经是排序过的了。但是，如果数组有更多元素，则它会被划分为两个包含相等数量元素的子数组。“治”是指使用合并排序递归地对两个子数组进行排序的过程。最后，两个子数组被合并为一个单一的排序数组。\n\
  \n## 合并排序技术\n\n1. 如果数组中只有零或一个元素，则不需要对该数组进行排序，因为它已经是排序过的。\n2. 否则，如果数组中有更多元素，则将数组分为两个包含相同数量元素的子数组。\n\
  3. 现在每个子数组都使用合并排序递归地排序。\n4. 最后，将两个子数组合并为一个单一的排序数组。\n\n## 合并排序算法\n\n`MERGE SORT(ARR,\
  \ BEG, END)`\n\n步骤 1: 开始\n步骤 2: 如果 (`BEG < END`)\n步骤 3: 设置 `MID = (BEG + END)/2`\n\
  调用 `MERGE SORT (ARR, BEG, MID)`\n调用 `MERGE SORT (ARR, MID + 1, END)`\n调用 `MERGE\
  \ (ARR, BEG, MID, END)`\n[结束 如果]\n步骤 4: 退出\n\n`MERGE(ARR, BEG, MID, END)`\n步骤 1:\
  \ 开始\n步骤 2: 设置 `I = BEG`, `J = MID + 1`, `K = 0`\n步骤 3: 重复直到 (`I <= MID && J <=\
  \ END`)\n如果 (`ARR[I] > ARR[J]`)\n设置 `TEMP[K] = ARR[J]`\n设置 `J = J + 1`\n设置 `K =\
  \ K + 1`\n其他如果 (`ARR[J] > ARR[I]`)\n设置 `TEMP[K] = ARR[I]`\n设置 `I = I + 1`\n设置 `K\
  \ = K + 1`\n否则\n设置 `TEMP[K] = ARR[J]`\n设置 `J = J + 1`\n设置 `K = K + 1`\n设置 `TEMP[K]\
  \ = ARR[I]`\n设置 `I = I + 1`\n设置 `K = K + 1`\n[结束 如果]\n[结束循环]\n步骤 4: （复制左数组的剩余元素，如果有）\n\
  重复直到 (`I <= MID`)\n设置 `TEMP[K] = ARR[I]`\n设置 `I = I + 1`\n设置 `K = K + 1`\n[结束循环]\n\
  步骤 5: （复制右数组的剩余元素，如果有）\n重复直到 (`J <= END`)\n设置 `TEMP[K] = ARR[J]`\n设置 `J = J + 1`\n\
  设置 `K = K + 1`\n[结束循环]\n步骤 6: 设置 `IND = 0`\n步骤 7: 重复直到 (`IND < K`)\n设置 `ARR[IND]\
  \ = TEMP[IND]`\n设置 `IND = IND + 1`\n[结束循环]\n步骤 8: 退出\n\n**例如：** 使用合并排序排序以下数组。\n\
  `int array[] = { 40, 10, 86, 44, 93, 26, 17 }`\n\n**解：**\n\n![image](img/6.6.jpg)\n\
  图 6.6. 合并排序的工作原理。\n\n从上一个示例中，我们可以看到合并排序算法是如何工作的。首先，合并排序算法递归地将数组划分为更小的子数组。在将数组划分为更小的子数组后，我们将这些子数组合并成单一的排序数组。合并排序的运行时间在平均和最坏情况下都是\
  \ `O(n log n)`，而在最好情况下可以达到 `O(n)`（如果数组已经是排序好的）。\n\n\n\n\n第三轮遍历：在第三次迭代中，数组中第三大的值被放置在倒数第三个的位置，依此类推。\n\
  \n重复此过程，直到数组中的所有元素都被扫描并放置在它们正确的位置，这意味着数组已经排序完成。\n\n## 泡排序算法\n\n```\nBUBBLE SORT(ARR,\
  \ N)\nStep 1: START\nStep 2: Repeat Step 3 for I = 0 to N - 1\nStep 3: Repeat for\
  \ J = 0 to N - 1\nStep 4: IF (ARR[J] > ARR[J+1])\n          INTERCHANGE ARR[J] &\
  \ ARR[J + 1]\n        [End of Inner Loop]\n      [End of Outer Loop]\nStep 5: EXIT\n\
  ```\n\n**例如：** 考虑以下数组。使用泡排序技术对数组中的给定的值进行排序。\n\n![image](img/243-01.jpg)\n\n**解：**\
  \ 在给定的数组中，元素数量为 5，因此迭代次数为 `(n – 1) = 4`。\n\n**第一轮：**\n\n![image](img/243-02.jpg)\n\
  \n(a) 比较 40 和 50。由于 `40 < 50`，不进行交换。\n\n![image](img/243-03.jpg)\n\n(b) 比较 50 和\
  \ 20。由于 `50 > 20`，将进行交换。\n\n![image](img/243-04.jpg)\n\n(c) 比较 50 和 90。由于 `50 <\
  \ 90`，不进行交换。\n\n![image](img/243-05.jpg)\n\n(d) 比较 90 和 30。由于 `90 > 30`，进行交换。\n\n\
  ![image](img/243-06.jpg)\n\n第一轮结束后，数组中最大的元素被放置在数组的最高位置，但所有其他元素仍然未排序。现在让我们进入第二轮。\n\
  \n**第二轮：**\n\n![image](img/243-07.jpg)\n\n(a) 比较 40 和 20。由于 `40 > 20`，进行交换。\n\n\
  ![image](img/244-01.jpg)\n\n(b) 比较 40 和 50。由于 `40 < 50`，不进行交换。\n\n![image](img/244-02.jpg)\n\
  \n(c) 比较 50 和 30。由于 `50 > 30`，进行交换。\n\n![image](img/244-03.jpg)\n\n第二轮结束后，数组中第二大的元素被放置在数组的倒数位置，但所有其他元素仍然未排序。现在让我们进入第三轮。\n\
  \n**第三轮：**\n\n![image](img/244-04.jpg)\n\n(a) 比较 20 和 40。由于 `20 < 40`，不进行交换。\n\n\
  ![image](img/244-05.jpg)\n\n(b) 比较 40 和 30。由于 `40 > 30`，进行交换。\n\n![image](img/244-06.jpg)\n\
  \n第三轮结束后，数组中第三大的元素被放置在数组的第三大位置上，但所有其他元素仍然未排序。现在让我们进入第四轮。\n\n**第四轮：**\n\n![image](img/244-07.jpg)\n\
  \n(a) 比较 20 和 40。由于 `20 < 40`，不进行交换。\n\n第四轮结束后，我们可以看到列表中的所有元素都已排序。因此，排序后新数组将是：\n\
  \n![image](img/6.7.jpg)\n\n图 6.7。\n\n泡排序的工作原理。\n\n## 泡排序的复杂度\n\n在最好的情况下，泡排序的运行时间为\
  \ `O(n)`，即数组已经排序完毕。否则，它在平均和最坏情况下的复杂度级别为 `O(n²)`。\n\n```java\n//编写一个程序使用泡排序方法对数组进行排序。\n\
  \nimport java.util.Scanner;\npublic class BubbleSortDemo {\n  static Scanner scn\
  \ = new Scanner(System.in);\n  public static void main(String[] args) {\n    int[]\
  \ array = takeInput();\n    bubble_sort(array);\n    display(array);\n  }\n  public\
  \ static int[] takeInput() {\n    System.out.print(\"\\nEnter 数组的元素个数:\");\n   \
  \ int size = scn.nextInt();\n    int[] arr = new int[size];\n    System.out.print(\"\
  \\nEnter 数组的元素:\");\n    System.out.println();\n    for (int i = 0; i < arr.length;\
  \ i++) {\n      System.out.print(\"输入元素 \"+(i+1)+\": \");\n      arr[i] = scn.nextInt();\n\
  \    }\n    return arr;\n  } \n  public static void bubble_sort(int[] array) {\n\
  \    int n = array.length - 2;\n    for (int c = 0; c <= n; c++) {\n      for (int\
  \ j = 0; j <= n - c; j++) {\n        if (array[j] > array[j + 1]) {\n          int\
  \ temp = array[j];\n          array[j] = array[j + 1];\n          array[j + 1] =\
  \ temp;\n        }\n      }\n    }\n  } \n  public static void display(int[] arr)\
  \ {\n    System.out.print(\"\\n 排序后的数组为: \");\n    for (int val : arr) {\n     \
  \ System.out.print(val + \" \");\n    }\n  }\n}\n```\n\n程序的输出显示所示：\n\n![image](img/246-01.jpg)\n\
  \n## 5. 快速排序\n\n`Quick sort`（快速排序），也称为 `partition exchange sort` 分交换排序，由 C. A. R.\
  \ Hoare 开发，是一种广泛使用的排序算法，它也使用了分治法，正如我们在归并排序中讨论过的那样。在这里，我们也将把一个未排序的数组划分为两个较小的子数组。分治方法意味着将较大的问题分为两个较小的问题，然后将那两个较小的问题分为更小的问题。\n\
  \n\n\n\n## 步骤 1: 开始\n\n## 步骤 2: 设置 `LEFT = BEG`, `RIGHT = END`, `POS = BEG`, `TEMP\
  \ = 0`\n\n## 步骤 3: 当 `TEMP = 0` 时，重复步骤 4 到 7\n\n## 步骤 4: 当 `ARR[RIGHT] >= ARR[POS]\
  \ && POS != RIGHT` 时循环\n`设置 RIGHT = RIGHT - 1`\n`[循环结束]`\n\n## 步骤 5: IF `(POS =\
  \ RIGHT)`\n`设置 TEMP = 1`\n`ELSE IF (ARR[POS] > ARR[RIGHT])`\n交换 `ARR[POS]` 与 `ARR[RIGHT]`\n\
  `设置 POS = RIGHT`\n`[If 结束]`\n\n## 步骤 6: IF `TEMP = 0`\n`当 `ARR[POS] >= ARR[LEFT]\
  \ && POS != LEFT` 时循环\n`设置 LEFT = LEFT + 1`\n`[循环结束]`\n\n## 步骤 7: IF `(POS = LEFT)`\n\
  `设置 TEMP = 1`\n`ELSE IF (ARR[LEFT] > ARR[POS])`\n`交换 ARR[POS]` 与 `ARR[LEFT]`\n`设置\
  \ POS = LEFT`\n`[If 结束]`\n`[If 结束]`\n`[循环结束]`\n\n## 步骤 8: 退出\n\n### 例如：使用快速排序算法对给定数组中的值进行排序。\n\
  \n![image](img/248-01.jpg)\n\n### 解：\n\n### 步骤 1：选择第一个元素作为基准。现在设置 `POS = 0`, `LEFT\
  \ = 0`, `RIGHT = 5`。\n\n![image](img/248-02.jpg)\n\n`POS`, `LEFT` `RIGHT`\n\n###\
  \ 步骤 2：从右到左遍历列表。由于 `ARR[POS] < ARR[RIGHT]`，即 `25 < 52`，`RIGHT = RIGHT – 1 = 4`。\n\
  \n![image](img/248-03.jpg)\n\n`POS`, `LEFT` `RIGHT`\n\n### 步骤 3：由于 `ARR[POS] < ARR[RIGHT]`，即\
  \ `25 < 30`，`RIGHT = RIGHT – 1 = 3`。\n\n![image](img/248-04.jpg)\n\n`POS`, `LEFT`\
  \ `RIGHT`\n\n### 步骤 4：由于 `ARR[POS] > ARR[RIGHT]`，即 `25 > 17`，我们将交换这两个值并设置 `POS =\
  \ RIGHT`。\n\n![image](img/249-01.jpg)\n\n`LEFT`, `RIGHT`, `POS`\n\n### 步骤 5：从左到右遍历列表。由于\
  \ `ARR[POS] > ARR[LEFT]`，即 `25 > 17`，`LEFT = LEFT + 1`。\n\n![image](img/249-02.jpg)\n\
  \n`LEFT` `RIGHT`, `POS`\n\n### 步骤 6：由于 `ARR[POS] > ARR[LEFT]`，即 `25 > 7`，`LEFT =\
  \ LEFT + 1`。\n\n![image](img/249-03.jpg)\n\n`LEFT` `RIGHT`, `POS`\n\n### 步骤 7：由于\
  \ `ARR[POS] < ARR[LEFT]`，即 `25 < 39`，我们将交换值并设置 `POS = LEFT`。\n\n![image](img/249-04.jpg)\n\
  \n`LEFT`, `POS`\n\n### 步骤 8：从右到左遍历列表。由于 `ARR[POS] < ARR[LEFT]`，`RIGHT = RIGHT -\
  \ 1`。\n\n![image](img/249-05.jpg)\n\n`LEFT`, `POS`, `RIGHT`\n\n现在，`RIGHT = POS`，因此过程结束，数组的基准元素（即\
  \ `25`）被放置在正确的位置。因此，所有小于 `25` 的元素都放置在它之前，所有大于 `25` 的元素都放在它之后。因此，17 和 7 是左子数组中的元素，39\
  \ 和 52 是右子数组中的元素，两者都已排序。\n\n图 6.8 快速排序的工作原理。\n\n### 排序\n\n快速排序在平均和最好情况下的运行时间为 `O(n\
  \ log n)`。然而，如果数组已经排序且选择最左侧元素作为基准，就会发生最坏情况。在最坏的情况下，它的效率为 `O(n²)`。\n\n### 写一个程序，使用快速排序方法对数组进行排序。\n\
  \n```java\nimport java.util.Scanner;\nclass QuickSortDemo {\n    static Scanner\
  \ scn = new Scanner(System.in);\n    public static void main(String[] args) {\n\
  \        int[] array = takeInput();\n        quick_sort(array, 0, array.length -\
  \ 1);\n        display(array);\n    }\n    public static int[] takeInput() {\n \
  \       System.out.print(\"\\nEnter 数组元素个数:\");\n        int size = scn.nextInt();\n\
  \        int[] arr = new int[size];\n        System.out.print(\"\\nEnter 数组的元素:\"\
  );\n        System.out.println();\n        for (int i = 0; i < arr.length; i++)\
  \ {\n            System.out.print(\"输入元素 \" + (i + 1) + \": \");\n            arr[i]\
  \ = scn.nextInt();\n        }\n        return arr;\n    }\n    public static void\
  \ quick_sort(int[] arr, int lo, int hi) {\n        if (lo >= hi) {\n           \
  \ return;\n        }\n        int mid = (lo + hi) / 2;\n        int pivot = arr[mid];\n\
  \        int left = lo;\n        int right = hi;\n        while (left <= right)\
  \ {\n            while (arr[left] < pivot) {\n                left++;\n        \
  \    }\n            while (arr[right] > pivot) {\n                right--;\n   \
  \         }\n            if (left <= right) {\n                int temp = arr[left];\n\
  \                arr[left] = arr[right];\n                arr[right] = temp;\n \
  \               left++;\n                right--;\n            }\n        }\n  \
  \      if (lo < right) quick_sort(arr, lo, right);\n        if (left < hi) quick_sort(arr,\
  \ left, hi);\n    }\n    public static void display(int[] arr) {\n        System.out.print(\"\
  排序后的数组:\");\n        for (int i : arr) {\n            System.out.print(i + \" \"\
  );\n        }\n        System.out.println();\n    }\n}\n```\n\n\n\n\n\n- 归并排序是一种遵循分治法的排序方法。划分是指将包含\
  \ `n` 个元素的数组划分为两个各包含 `n/2` 个元素的子数组。解决是指使用归并排序递归地对两个子数组进行排序。最后，将两个子数组合并为一个单一的排序数组。\n\
  - 冒泡排序，也称为交换排序，是一种非常简单的排序方法。它通过不断将最大元素移动到数组的高位来工作。\n- 快速排序是一种算法，它选择一个基准元素并对值进行重新排列，使得所有小于基准元素的元素都出现在它之前，所有大于基准元素的元素都出现在它之后。\n\
  - 外部排序是一种在数据量巨大时使用的的排序技术。\n\n## 6.8 练习题\n\n### 6.8.1 理论题\n\n1. 定义排序。写出排序的重要性。\n\
