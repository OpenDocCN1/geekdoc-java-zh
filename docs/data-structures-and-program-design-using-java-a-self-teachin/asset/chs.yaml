  ![image](img/138-02.jpg)\n![image](img/138-03.jpg)\n\n在讨论了单链表后，我们现在学习另一种类型的链表，即循环链表。\n\
  \n### 4.4.3 循环链表\n\n循环链表是单链表的一种类型，其中最后一个节点的地址部分将存储第一个节点的地址，这与单链表最后一个节点的地址部分存储一个唯一值\
  \ `NULL` 不同。在遍历循环链表时，我们可以从任何节点开始并向任何方向进行遍历，因为循环链表没有固定的头或尾节点。表示循环链表的内存声明与线性链表相同。\n\
  \n![image](img/4.10.jpg)\n\n图 4.10. 循环链表。\n\n### 4.4.4 循环链表的操作\n\n在循环链表上可以执行各种操作，包括：\n\
  \n(a) 在循环链表中插入新节点\n\n(b) 从循环链表中删除节点\n\n让我们现在详细讨论一下这两种情况。\n\n#### (a) 在循环链表中插入新节点\n\
  \n在这里，我们将学习如何向现有的链表中插入新节点。在插入过程中，我们将讨论两种主要情况，包括：\n\n1.  在循环链表的头部插入新节点。\n\n2.  在循环链表的末尾插入新节点。\n\
  \n3.  在给定节点之后插入新节点（与单链表相同）。\n\n\n\n在向循环链表头部插入新节点时，我们首先会检查溢出条件，即是否有可用内存为新节点分配。如果内存不可用，则打印溢出信息；否则，则为新节点分配内存。现在我们将初始化该节点并设置其信息部分（info），其地址部分将包含链表第一个节点的地址，即\
  \ `START` 节点。因此，新节点作为链表的第一个节点被添加，且 `START` 节点将指向链表的第一个节点。现在让我们来看一个例子。考虑如如下所示的具有四个节点的链表；现在要向该循环链表的头部插入一个新节点。\n\
  \n![image](img/4.11.jpg)\n\n图 4.11。\n\n在循环链表头部插入新节点。\n\n现在，让我们通过算法来理解上述情况。\n\n###\
  \ 在循环链表头部插入新节点的算法\n\n```\nStep 1: START\nStep 2: IF NEW NODE = NULL\n    Print OVERFLOW\n\
  \    [End Of If]\nStep 3: Repeat while TEMP.NEXT != START\n    Set TEMP = TEMP.NEXT\n\
  \    [End of Loop]\nStep 4: Set NEW NODE.INFO = VAL\nStep 5: Set NEW NODE.NEXT =\
  \ START\nStep 6: Set TEMP.NEXT = NEW NODE\nStep 7: Set START = NEW NODE\nStep 8:\
  \ EXIT\n```\n\n### 2. 在循环链表尾部插入新节点\n\n在这种情况下，我们首先会检查溢出条件，即是否有可用内存为新节点分配。如果内存不可用，则打印溢出信息；否则，则为新节点分配内存。然后创建一个\
  \ `NODE` 变量，它初始指向 `START`，该 `NODE` 变量将用于遍历链表，直到到达最后一个节点。当到达最后一个节点时，最后一个节点的 `NEXT`\
  \ 部分将存储新节点的地址，而 `NEW NODE` 的 `NEXT` 部分将包含链表第一个节点的地址，通常用 `START` 表示。让我们通过算法来理解它：\n\
  \n### 在循环链表尾部插入新节点的算法\n\n```\nStep 1: START\nStep 2: IF NEW NODE = NULL\n    Print\
  \ OVERFLOW\n    [End Of If]\nStep 3: Repeat while TEMP.NEXT != START\n    Set TEMP\
  \ = TEMP.NEXT\n    [End of Loop]\nStep 4: Set NEW NODE.INFO = VAL\nStep 5: Set NEW\
  \ NODE.NEXT = START\nStep 6: Set TEMP.NEXT = NEW NODE\nStep 7: EXIT\n```\n\n让我们举一个例子来理解它。考虑如下所示的具有四个节点的链表；现在要向该循环链表的尾部插入一个新节点。\n\
  \n![image](img/4.12.jpg)\n\n图 4.12。\n\n在循环链表尾部插入新节点。\n\n### (b) 从循环链表中删除节点\n\n在本节中，我们将学习如何从一个已存在的循环链表中删除节点。我们将讨论删除过程中的两种情况，包括以下内容：\n\
  \n1. 从循环链表的头部删除节点。\n2. 从循环链表的尾部删除节点。\n3. 在给定节点之后删除节点（与单链链表相同）。\n\n### 1. 从循环链表头部删除节点\n\
  \n在从链表头部删除节点的情况下，我们首先会检查上溢条件（underflow condition），即当我们尝试从一个空链表中删除节点时发生的情况。这种情况在\
  \ `START` 节点等于 `NULL` 时存在。因此，如果条件为真，则显示上溢信息；否则，则从链表中删除该节点。考虑如下所示的具有四个节点的链表；第一个节点将从链表中删除。\n\
  \n![image](img/4.13.jpg)\n\n图 4.13。\n\n从循环链表头部删除节点。\n\n从上一个例子中可以清楚地看到如何从一个已存在的链表中删除节点。现在让我们理解它的算法：\n\
  \n### 从循环链表头部删除节点的算法\n\n```\nStep 1: START\nStep 2: IF START = NULL\n    Print UNDERFLOW\n\
  \    [End Of If]\nStep 3: Repeat while TEMP.NEXT != START\n    Set TEMP = TEMP.NEXT\n\
  \    [End of Loop]\nStep 4: Set TEMP.NEXT = START.NEXT\nStep 5: Set START = START.NEXT\n\
  Step 6: EXIT\n```\n\n上一个算法展示了如何从链表头部删除节点。首先，我们检查上溢条件。现在使用一个节点变量 `NODE`，它将遍历整个链表，直到到达链表的最后一个节点。现在，我们修改\
  \ `NODE` 的下一个部分，以存储链表第二个节点的地址。因此，占据第一个节点的内存被释放了。最后，第二个节点现在变成了链表的第一个节点。\n\n### 2.\
  \ 从循环链表尾部删除节点\n\n在这种情况下，我们首先会检查上溢条件，即当我们尝试从一个空链表中删除节点时发生的情况。这种情况在 `START` 节点等于 `NULL`\
  \ 时发生。因此，如果条件为真，则打印上溢信息；否则，则从链表中删除节点。考虑如下所示的具有四个节点的链表；最后一个节点将从链表中删除。\n\n![image](img/4.14.jpg)\n\
  \n图 4.14。\n\n从循环链表尾部删除节点。\n\n现在让我们理解它的算法：\n\n### 从循环链表尾部删除节点的算法\n\n```\nStep 1:\
  \ START\nStep 2: IF START = NULL\n    Print UNDERFLOW\n    [End Of If]\nStep 3:\
  \ Set TEMP = START\nStep 4: Repeat while TEMP.NEXT != START\n    Set PREV = TEMP\n\
  \    Set TEMP = TEMP.NEXT\n    [End of Loop]\nStep 5: Set PREV.NEXT = TEMP.NEXT\n\
  Step 6: EXIT\n```\n\n上一个算法展示了如何从链表尾部删除节点。首先，我们检查上溢条件。现在使用一个节点变量 `NODE` 遍历整个链表，直到到达链表的最后一个节点。在循环中，我们将使用另一个节点变量\
  \ `PREV`，它始终指向 `NODE` 的前驱。当我们到达最后一个节点及其前驱（即倒数第二个节点）时，现在修改 `PREV` 的下一个部分以存储 `START`\
  \ 的地址。因此，占据最后一个节点的内存被释放了。最后，倒数第二个节点现在变成了链表的最后一个节点。通过这种方式，就可以完成循环链表的删除节点。\n\n编写一个循环链表的菜单驱动程序，执行所有情况的插入和删除。\n\
  \n\n\n\n```java\npublic class CircularLinkedList {\n  private class Node {\n   \
  \ int data;\n    Node next;\n  }\n  private Node start;\n  private Node end;\n \
  \ private int size;\n\n  private Node create_new_node(int item) throws Exception\
  \ {\n    Node node = new Node();\n    if (node == null) {\n      throw new Exception(\"\
  Memory not allocated\");\n    } else {\n      node.data = item;\n      node.next\
  \ = null;\n      return node;\n    }\n  }\n\n  public void insertion(int item, int\
  \ idx) throws Exception {\n    if (idx < 0 || idx > size) {\n      throw new Exception(\"\
