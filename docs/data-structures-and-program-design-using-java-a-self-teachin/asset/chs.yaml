  \ 以上都不是\n\n# 第 4 章\n\n# 链表\n\n## 4.1 引言\n\n我们已经学习过数组是存储在连续内存位置的数据元素集合。此外，我们学习过数组是静态的；也就是说，在声明数组时必须指定数组的大小，这限制了数组中可以存储的元素数量。例如，如果我们声明一个数组为\
  \ `int[] array = new int[15]`，那么该数组最多包含十五个元素，不能更多。这种内存分配方法对于……的。\n\n## 4.2 链表的定义\n\
  \n链表是存储在连续内存位置的数据元素集合（注：此处原文逻辑描述似乎与数组混淆）。……在声明数组时必须指定数组的大小，这限制了数组中可以存储的元素数量。\n\n\
  \n\n链表的过程或概念支持动态内存分配。现在，动态内存分配是指什么？这个简单问题的答案是：在程序执行过程中分配内存的过程，或者在运行时为变量分配内存的过程被称为动态内存分配。到目前为止，我们学习了数组，在初始化时声明了数组的大小，例如\
  \ `array[50]`。该语句在执行后会为五十个整数分配内存。但如果我们只使用了 30% 的内存，而剩余的分配内存被浪费，就会出现问题。因此，为了克服内存空间浪费的问题，或者说，为了高效利用内存，使用了动态内存分配，它允许我们分配/预留实际所需的内存。因此，它将克服数组情况下出现的内存空间浪费问题。当我们无法预知内存需求时，动态内存分配是最佳选择。\n\
  \n## 4.4 链表的类型\n\n本节将讨论不同类型的链表。这些包括：\n\n1. 单链表\n2. 循环链表\n3. 双链表\n4. 头节点链表\n\n现在我们将详细讨论所有类型。\n\
  \n### 4.4.1 单链表\n\n单链表是最简单的一种链表，其中每个节点包含某些信息/数据，并且仅有一个指向链表中下一个节点的节点。单链表中数据元素的遍历只能以一种方式进行。\n\
  \n![image](img/4.2.jpg)\n\n图 4.2。\n\n单链表。\n\n### 4.4.2 单链表上的操作\n\n单链表上可以执行各种操作，包括：\n\
  \n* 遍历链表\n* 在链表中查找给定值\n* 在链表中插入新节点\n* 从链表中删除节点\n* 对链表进行排序\n* 反转链表\n\n现在让我们详细详细讨论所有这些操作。\n\
  \n#### (a) 遍历链表\n\n遍历链表意味着精确地访问一次链表中的所有节点。链表始终包含一个 `START` 节点，它存储链表第一个节点的地址，并代表链表的开始；以及一个\
  \ `NULL` 节点，它代表链表的末尾。为了遍历链表，我们将使用另一个节点变量 `node`，它将指向当前正在访问的节点。遍历链表的算法所示：\n\n**遍历链表的算法**\n\
  \n**步骤 1:** 设置 `NODE = START`\n**步骤 2:** 当 `NODE != NULL` 时，重复步骤 3 和 4\n**步骤 3:**\
  \ 打印 `NODE.INFO`\n**步骤 4:** 设置 `NODE = NODE.NEXT` [循环结束]\n**步骤 5:** 退出\n\n#### (b)\
  \ 在链表中查找给定值\n\n在链表中查找一个值意味着在链表中找到一个特定的元素/值。正如我们之前讨论的，链表中的节点包含两个部分：一部分是信息部分，另一部分是地址部分。因此，搜索是指查找给定值是否存在于任何节点的信息部分的过程。如果该值存在，则返回该特定值的地址并认为搜索成功；否则，搜索失败。链表始终包含一个\
  \ `START` 节点，它存储链表第一个节点的地址并代表链表的开始；以及一个 `NULL` 节点，它代表链表的末尾。还有另一个变量 `NODE`，它将指向当前正在访问的节点。`SEARCH_VAL`\
  \ 是要在链表中查找的值，而 `POS` 是找到该值的节点的位置/地址。在链表中查找一个值的算法如下：\n\n**在链表中查找一个值的算法**\n\n**步骤\
  \ 1:** 设置 `NODE = START`\n**步骤 2:** 当 `NODE != NULL` 时，重复步骤 3\n**步骤 3:** IF `SEARCH_VAL\
  \ = NODE.INFO` 设置 `POS = NODE`，打印“搜索成功！”，跳转到步骤 5 [If 结束] ELSE 设置 `NODE = NODE.NEXT`\
  \ [循环结束]\n**步骤 4:** 打印“搜索失败！”\n**步骤 5:** 退出\n\n例如，如果我们有一个链表并且我们要在列表中查找 15，那么步骤所示：\n\
  \n\n图 4.3。\n\n查找链表的示例。\n\n#### (c) 在链表中插入新节点\n\n在这里，我们将学习如何在现有的链表中插入新节点。我们将讨论插入过程，这些过程包括：\n\
  \n1. 在头部插入新节点。\n2. 在尾部插入新节点。\n3. 在给定节点之后插入新节点。\n\n**1. 在头部插入新节点**\n\n在向链表头部插入新节点的情况的情况下，我们首先会检查溢出条件，即内存是否可用。如果内存不可用，则显示溢出信息；否则，为新节点分配内存。然后我们将初始化信息部分，其地址部分将包含第一个节点的地址。现在为了更好地理解，让我们来看一个例子。考虑如下所示所示的具有五个节点的链表；新节点将插入在头部。\n\
  \n![image](img/4.4.jpg)\n\n图 4.4。\n\n在头部插入新节点。\n\n通过上一个例子，我们清楚了如何在现有链表中插入新节点。现在让我们理解它的算法：\n\
  \n**在头部插入新节点的算法**\n\n**步骤 1:** `START`\n**步骤 2:** IF `NODE = NULL` 打印溢出，跳转到步骤 8\
  \ [If 结束]\n**步骤 3:** 设置 `NEWNODE = NODE`\n**步骤 4:** 设置 `NODE = NODE.NEXT`\n**步骤\
  \ 6:** 设置 `NEWNODE.NEXT = START`\n**步骤 7:** 设置 `START = NEW NODE`\n**步骤 8:** 退出\n\
  \n**2. 在尾部插入新节点**\n\n要在链表尾部插入新节点，我们首先会检查溢出条件，即内存是否可用。如果内存不可用，则显示溢出信息；否则，为新节点分配内存。然后创建一个\
  \ `NODE` 变量，它初始指向 `START` 并用于遍历链表直到到达最后一个节点。当到达最后一个节点时，最后一个节点的 `NEXT` 部分将存储新节点的地址，而\
  \ `NEW NODE` 的 `NEXT` 部分将包含 `NULL`，这代表链表的结束。\n\n**在尾部插入新节点的算法**\n\n**步骤 1:** `START`\n\
  **步骤 2:** IF `NEWNODE = NULL` 打印溢出，跳转到步骤 8 [If 结束]\n**步骤 3:** 设置 `NEWNODE.INFO =\
  \ VALUE`\n**步骤 4:** 设置 `NEWNODE.NEXT = NULL`\n**步骤 5:** 设置 `TEMP = START`\n**步骤\
  \ 6:** 当 `TEMP.NEXT != NULL` 时，重复步骤 6 设置 `TEMP = TEMP.NEXT` [循环结束]\n**步骤 7:** 设置\
  \ `TEMP.NEXT = NEW NODE`\n**步骤 8:** 退出\n\n通过上一个算法我们理解了如何在现有链表尾部插入新节点。现在我们将通过一个示例进一步学习。考虑如下所示的具有四个节点的链表；新节点将插入在链表的尾部：\n\
  \n![image](img/4.5.jpg)\n\n图 4.5。\n\n在链表尾部插入新节点。\n\n\n\n\n\n\n在这种情况下，新节点被插入到链表中给定的节点之后。与其他其他情况一样，我们将再次检查溢出条件。如果新节点的内存可用，则对其进行分配；否则，将打印溢出信息。然后创建一个\
  \ `NODE` 变量，其初始指向 `START`，并使用该 `NODE` 变量遍历链表，直到到达要插入新节点之前的那个值/节点。当到达该节点/值时，则该节点的\
  \ `NEXT` 部分将存储新节点的地址，而 `NEW NODE`（新节点）的 `NEXT` 部分将存储其在链表中后继结的地址。让我们通过一个例子来理解这一点。考虑一个包含四个节点的链表，要在给定的节点后插入一个新节点：\n\
  \n![image](img/4.6.jpg)\n\n图 4.6。\n\n在链表的指定节点后插入新节点。\n\n从上一个例子中，我们学习了如何在给定的节点后插入节点。现在我们将通过算法来理解这一点。\n\
  \n## 在链表的指定节点后插入新节点的算法\n\n**步骤 1:** START\n**步骤 2:** IF `NEW NODE = NULL` 打印 `OVERFLOW`\
  \ [If 结束]\n**步骤 3:** 设置 `NEW NODE.INFO = VALUE`\n**步骤 4:** 设置 `NEW NODE.NEXT = NULL`\n\
  **步骤 5:** 设置 `PREV = NODE`\n**步骤 6:** 重复步骤 6 直到 `PREV.INFO != GIVEN_VAL` 设置 `PREV\
  \ = PREV.NEXT` [循环结束]\n**步骤 9:** 设置 `NEW NODE.NEXT = PREV`\n**步骤 10:** 设置 `PREV.NEXT\
  \ = NEW NODE`\n**步骤 11:** EXIT\n\n# (d) 从链表中删除节点\n\n在本节中，我们将学习如何从已存在的链表中删除节点。我们将在删除过程中讨论三种情况，包括：\n\
  \n1. 从链表的头部删除节点。\n2. 从链表的末尾删除节点。\n3. 从链表的给定节点之后删除节点。\n\n\n## 1. 从链表头部删除节点\n\n在从链表头部删除节点的情况下，我们将首先检查上空条件，该条件发生在我们尝试从一个空的链表中删除节点时。当\
  \ `START` 节点等于 `NULL` 时存在此情况。如果条件为真，则在屏幕上打印上空信息；否则，从链表中删除该节点。考虑如下所示具有五个节点的链表；该节点将从链表的头部删除。\n\
  \n![image](img/4.7.jpg)\n\n图 4.7。\n\n从链表头部删除节点。\n\n从上一个例子中，可以清楚地看到如何从已存在的链表中删除节点。现在让我们来理解它的算法：\n\
  \n## 从链表头部删除节点的算法\n\n**步骤 1:** START\n**步骤 2:** IF `START = NULL` 打印 `UNDERFLOW`\
  \ [If 结束]\n**步骤 3:** 设置 `START = START.NEXT`\n**步骤 4:** EXIT\n\n在以前的算法中，我们首先检查上空条件，即链表中是否存在节点。如果没有节点，则将打印上空信息；否则，我们移动到步骤\
  \ 3，在步骤 3 中我们将 `NODE` 初始化为 `START`；也就是说，`NODE` 现在将存储第一个节点的地址。在下一步中，`START` 移动到第二个节点，因为现在\
  \ `START` 将存储第二个节点的地址。因此，第一个节点被删除了，`NODE` 占据的内存（初始为链表的第一个节点）被释放了。\n\n## 2. 从链表末尾删除节点\n\
  \n在从链表末尾删除节点的情况下，我们将首先检查上空条件。当 `START` 节点等于 `NULL` 时存在此情况。因此，如果条件为真，则在屏幕上打印上空信息；否则，从链表中删除该节点。考虑如下所示具有五个节点的链表；该节点将从链表的末尾删除。\n\
  \n![image](img/4.8.jpg)\n\n图 4.8。\n\n从链表末尾删除节点。\n\n现在让我们理解从链表末尾删除节点的算法。\n\n## 从链表末尾删除节点的算法\n\
  \n**步骤 1:** START\n**步骤 2:** IF `START = NULL` 打印 `UNDERFLOW` [If 结束]\n**步骤 3:**\
  \ 设置 `PREV = START`\n**步骤 4:** 重复步骤 4 直到 `TEMP.NEXT != NULL` 设置 `PREV = TEMP`, 设置\
  \ `TEMP = TEMP.NEXT` [循环结束]\n**步骤 5:** 设置 `PREV.NEXT = NULL`\n**步骤 6:** EXIT\n\n\
  （注：提供的原始文本在该算法的步骤编号上存在逻辑不一致；我已根据文中提供的逻辑清理了流程)。\n\n在以前的算法中，我们首先检查上空条件。如果没有节点，则将打印上空信息；否则，我们移动到步骤\
  \ 3，在步骤 3 中我们将 `PREV` 初始化为 `START`。\n\n## 3. 从链表的给定节点之后删除节点\n\n在从链表的给定节点之后删除节点的情况下，我们将再次检查上空条件。当\
  \ `START` 节点等于 `NULL` 时存在此情况。如果条件为真，则打印上空信息；否则，从链表中删除该节点。考虑如下所示具有五个节点的链表；该节点将在给定节点后删除。\n\
  \n![image](img/4.9.jpg)\n\n图 4.9。\n\n在给定节点后删除节点。\n\n## 在链表的给定节点后删除节点的算法\n\n**步骤\
  \ 1:** START\n**步骤 2:** IF `START = NULL` 打印 `UNDERFLOW` [If 结束]\n**步骤 3:** 设置 `TEMP\
  \ = START`\n**步骤 4:** 设置 `PREV = START`\n**步骤 5:** 重复步骤 5 直到 `PREV.INFO != GIVEN_VAL`\
  \ 设置 `PREV = TEMP`, 设置 `TEMP = TEMP.NEXT` [循环结束]\n**步骤 6:** 设置 `PREV.NEXT = TEMP.NEXT`\n\
  **步骤 7:** EXIT\n\n# (e) 两个链表的合并\n\n合并链表是通过将两个不同大小的链表合并为一个链表的过程。让我们通过函数来理解合并的概念：\n\
  \n```\npublic void concatenate(Node node1, Node node2) {\n    Node temp = new Node();\n\
  \    temp = node1;\n    while (temp.next != null) {\n        temp = temp.next;\n\
  \    }\n    temp.next = node2;\n}\n```\n\n# (f) 链表排序\n\n排序是将数据元素按顺序排列的过程，无论是升序还是降序。在此处，我们对链表的信息按顺序排列。\n\
  \n# (g) 反转链表\n\n\n\n\n在反转线性链表的过程中，我们将使用三个节点变量，即 `PREV`、`NODE` 和 `NEW`，它们将分别存储链表中前驱节点、当前节点和后继节点的地址。我们将从第一个节点的地址开始，该地址存储在另一个节点变量\
  \ `START` 中并赋值给 `NODE`，而 `PREV` 被赋值为 `NULL`。现在，让我们通过函数来理解它：\n\n```java\npublic void\
  \ reverse_list() {\n    Node = start;\n    Node prev = null;\n    while (node !=\
  \ null) {\n        Node newnode = node.next;\n        node.next = prev;\n      \
  \  prev = node;\n        node = newnode;\n    }\n}\n```\n\n// 为单链表编写一个菜单驱动程序，实现所有情况的插入和删除。\n\
