  \n### 7.6. 括号平衡\n\n栈可以用于检查任何算术或代数表达式中括号的有效性。我们已经知道，在有效表达式中，括号或中括号成对出现；也就是说，如果出现了一个左括号，它在表达式中必须有一个对应的右括号。例如，`(X\
  \ + Y – Z` 是无效的。但 `(X + Y – Z)` 看起来像是一个有效的表达式。因此，有一些关键点需要记住：\n\n*   每当遇到 `(` 时，都应该将其压入栈中。\n\
  *   每当遇到 `)` 时，都会检查栈。\n*   如果栈已经是空的，那么 `)` 就没有对应的 `(`，因此该表达式是无效的。\n*   如果栈不空，我们将栈元素元素，并检查弹出的元素是否与\
  \ `)` 匹配。\n*   当我们到达栈的末尾，栈必须是空的。否则，有一个或多个 `(` 没有对应的 `)`，因此表达式将变为无效。\n\n**例如：** 检查以下给定的表达式是否有效。\n\
  \n(a) `((A – B) * Y`\n(b) `[(A + B) – {X + Y} * [C – D]]`\n\n**解决方案：**\n\n![image](img/291-01.jpg)\n\
  **答案：** 由于栈不空，因此表达式是无效的。\n\n![image](img/291-01.jpg)\n**答案：** 由于栈为空，该表达式是有效的。编写一个程序来实现括号平衡。\n\
  \n```java\nimport java.util.Scanner;\n\npublic class Parenthesis {\n    static class\
  \ stack {\n        int top = -1;\n        char arr[] = new char[30];\n\n       \
  \ public void push(char x) {\n            if (top == arr.length - 1) {\n       \
  \         System.out.println(\"Stack full\");\n            } else\n            \
  \    arr[++top] = x;\n        }\n\n        public char pop() {\n            if (top\
  \ == -1) {\n                System.out.println(\"Stack underflow\");\n         \
  \       return 0;\n            } else\n                return arr[top--];\n    \
  \    }\n\n        public boolean isEmpty() {\n            if (top == -1)\n     \
  \           return true;\n            } else\n                return false;\n  \
  \      }\n    }\n\n    static boolean isPair(char c1, char c2) {\n        if (c1\
  \ == '(' && c2 == ')')\n            return true;\n        else if (c1 == '{' &&\
  \ c2 == '}')\n            return true;\n        else if (c1 == '[' && c2 == ']')\n\
  \            return true;\n        else\n            return false;\n    }\n\n  \
  \  static boolean isBalanced(char exp[]) {\n        stack s = new stack();\n   \
  \     for (int i = 0; i < exp.length; i++) {\n            if (exp[i] == '(' || exp[i]\
  \ == '{' || exp[i] == '[') {\n                s.push(exp[i]);\n            } else\
  \ if (exp[i] == ')' || exp[i] == '}' || exp[i] == ']') {\n                if (s.isEmpty())\
  \ {\n                    return false;\n                } else {\n             \
  \       if (!isPair(s.pop(), exp[i])) {\n                        return false;\n\
  \                    }\n                }\n            }\n        }\n        if\
  \ (s.isEmpty())\n            return true;\n        } else\n            return false;\n\
  \    }\n\n    public static void main(String[] args) {\n        Scanner scn = new\
  \ Scanner(System.in);\n        System.out.println(\"Enter the expression:\");\n\
  \        String input = scn.next();\n        char[] exp = new char[input.length()];\n\
  \        for (int i = 0; i < input.length(); i++) {\n            exp[i] = input.charAt(i);\n\
  \        }\n        if (isBalanced(exp)) {\n            System.out.println(\"Balanced\"\
  );\n        } else {\n            System.out.println(\"Not Balanced\");\n      \
  \  }\n    }\n}\n```\n\n## 7.7 总结\n\n*   栈是一种线性集合，其中后进入的元素先取出（LIFO）。\n*   在内存中，栈可以使用数组或链表实现。\n\
  *   当尝试向栈中插入元素但栈已满时，发生栈溢。\n*   当尝试从栈中删除元素但栈为空时，发生栈下溢。\n*   在栈上执行的基本操作有 `push`、`pop`\
  \ 和 `peek`。\n*   `push` 操作是在栈中添加新元素的过程。\n*   `pop` 操作是从栈中移除元素的过程。\n*   `peek` 操作是返回栈顶元素的值。\n\
  * 波兰表示是将运算符放在操作数之前。\n* 中缀、前缀和后缀表示是表示表达式的三种等价方式。\n\n### 7.8 习题\n\n### 7.8.1 理论题\n\
