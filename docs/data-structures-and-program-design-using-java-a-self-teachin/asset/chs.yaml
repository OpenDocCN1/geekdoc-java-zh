  \                }\n                push(stack, c);\n            } else if (c ==\
  \ ')') {\n                char x = pop(stack);\n                while (x != '(')\
  \ {\n                    ans += x;\n                    x = pop(stack);\n      \
  \          }\n            } else if (c == '(') {\n                push(stack, c);\n\
  \            } else {\n                ans += c;\n            }\n        }\n   \
