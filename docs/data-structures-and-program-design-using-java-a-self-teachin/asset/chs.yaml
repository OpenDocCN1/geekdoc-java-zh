  \ searched at: \" + position);\n        else\n            System.out.println(\"\
  Unsuccessfull search\");\n    }\n    public static void display(int arr[]) {\n \
  \       int i;\n        System.out.println(\" List of keys :\\n\");\n        for\
  \ (i = 0; i < SIZE; i++) {\n            System.out.println(\"\\t\" + arr[i]);\n\
  \        }\n    }\n}\n```\n\n程序的输出如所示：\n\n![image](img/389-01.jpg)\n![image](img/389-02.jpg)\n\
  ![image](img/389-03.jpg)\n![image](img/389-04.jpg)\n\n### 二次探测法的优缺点\n\n如之前讨论的，二次探测法的最大优点之一是它消除了**初聚集**（primary\
  \ clustering）现象。然而，该方法的一个主要缺点是，连续探测序列可能只覆盖哈希表的一个部分，而且这部分可能非常小。因此，如果发生这种情况，尽管哈希表并未满，我们也很难在哈希表中找到空位置。因此，二次探测遇到了被称为**次级聚集**（secondary\
  \ clustering）的问题。在这种方法中，随着哈希表逐渐变满，多次冲突的概率会增加。这种情况可以通过**双哈法**来克服。\n\n### 双哈法\n\n\
  双哈法是开放定址法中最好的方法之一。顾如其名，该方法使用两个哈希函数进行操作，而不是单个哈希函数。哈希函数如下：`h'(k) = (h1(k) + i*2(k))\
  \ mod m`，其中 `h1(k) = k mod m` 且 `h2(k) = k mod m'`，`m` 是哈希表的大小，`m'` 小于 `m`（可以是 `m\
  \ – 1` 或 `m – 2`），`i` 是从 `0` 到 `m – 1` 的探测次数。\n\n现在，让我们理解这项技术的工作原理。对于给定的键 `k`，首先探测由\
  \ `h1(k) mod m` 生成的第一个，因为第一次 `i = 0`。如果生成的位置是空闲的，则将键存储其中。否则，后续的探测生成的位置距离上一个位置具有\
  \ `h2(k) mod m` 的偏移量。此外，偏移量可能会随每次探测而变化，取决于第二个哈希函数生成的值，即 `h2(k) mod m`。结果是，双哈法的性能非常接近“理想”均匀哈散（uniform\
  \ hashing）方案的性能。\n\n### 常见问题\n\n**8\\. 给定键 k = 71, 29, 38, 61 和 100，使用双哈法将这些键映射到大小为\
  \ m = 5 的哈希表中。取 `h1(k) = (k mod 5)` 且 `h2(k) = (k mod 4)`。**\n\n**答：**\n\n初始哈希表给所示：\n\
  \n![image](img/390-01.jpg)\n\n**第 1 步：**\n\n`i = 0`\n要插入的键 = `71`\n`h'(k) = (h1(k)\
  \ + i*2(k)) mod m`\n`h'(k) = (k mod m + i*(k mod m')) mod m`\n`h'(71) = (71 % 5\
  \ + (0 * 71 % 4)) % 5`\n`h'(71) = (1 + (0 * 3)) % 5`\n`h'(71) = 1 % 5 = 1`\n现在，由于位置\
  \ `T[1]` 是空闲的，将 71 插入到 `T[1]`。\n\n![image](img/391-01.jpg)\n\n**第 2 步：**\n\n`i =\
  \ 0`\n要插入的键 = `29`\n`h'(k) = (h1(k) + i*2(k)) mod m`\n`h'(k) = (k mod m + i*(k mod\
  \ m')) mod m`\n`h'(29) = (29 % 5 + (0 * 29 % 4)) % 5`\n`h'(29) = (4 + (0 * 1)) %\
  \ 5`\n`h'(29) = 4 % 5 = 4`\n现在，由于位置 `T[4]` 是空闲的，将 29 插入到 `T[4]`。\n\n![image](img/391-02.jpg)\n\
  \n**第 3 步：**\n\n`i = 0`\n要插入的键 = `38`\n`h'(k) = (h1(k) + i*2(k)) mod m`\n`h'(k)\
  \ = (k mod m + i*(k mod m')) mod m`\n`h'(38) = (38 % 5 + (0 * 38 % 4)) % 5`\n`h'(38)\
  \ = (3 + (0 * 2)) % 5`\n`h'(38) = 3 % 5 = 3`\n现在，由于位置 `T[3]` 是空闲的，将 38 插入到 `T[3]`。\n\
  \n![image](img/391-03.jpg)\n\n**第 4 步：**\n\n`i = 0`\n要插入的键 = `61`\n`h'(k) = (h1(k)\
  \ + i*2(k)) mod m`\n`h'(k) = (k mod m + i*(k mod m')) mod m`\n`h'(61) = (61 % 5\
  \ + (0 * 61 % 4)) % 5`\n`h'(61) = (1 + (0 * 1)) % 5`\n`h'(61) = 2 % 5 = 2`\n现在，由于位置\
  \ `T[2]` 是空闲的，将 61 插入到 `T[2]`。\n\n\n\n\n\n- 在折叠法中，我们将键拆分为若干部分，使得每个部分（最后一段外）具有相同的位数，最后一段的位数可能比其他部分少。现在，将这些各个部分相加，从而形成哈希值。\n\
  \n- 冲突（Collision）是指哈希函数将两个不同的键映射到哈希表中的同一个/相同位置的情况。\n\n- 使用冲突解决技术来克服哈希中的冲突问题。有两种用于解决冲突的流行方法，即：链地址法（chaining\
  \ method）和开放地址法（open addressing method）。\n\n- 在链地址法中，维护一个具有相同哈希地址的元素链。哈希表中的每个位置都存储一个指向链表的地址，该链表包含所有哈希到该位置的键元素。这种方法的缺点是由于键元素存储在链表中，因此浪费了存储空间；此外，每个元素都需要地址才能访问，这反过来消耗了更多空间。\n\
  \n- 在开放地址法中，所有元素都存储在哈希表本身。这种方法不需要提供地址，这是该方法最大的优势。一旦发生冲突，开放地址法会使用探测序列（probe sequence）计算新位置，并将下一个元素或下一个记录存储在该位置。\n\
  \n- 探测（Probing）是检查哈希表中内存位置的过程。\n\n- 线性探测（Linear probing）是解决哈希冲突问题最简单的方法。在这种方法中，如果一个键已经存储在哈希函数\
  \ `h(k)` 生成的位置上，则可以通过以下哈希函数解决冲突：\n\n```\nh’(k) = (h(k) + i) mod m\n```\n\n- 二次探测（Quadratic\
  \ probing）是另一种解决哈希冲突问题的方法。在这种方法中，如果一个键已经存储在哈希函数 `h(k)` 生成的位置上，则可以通过以下哈希函数解决冲突：\n\
  \n```\nh’(k) = (h(k) + c[1]i + c[2]i²) mod m\n```\n\n- 双重哈希（Double hashing）是开放地址法中最好的方法之一。如名所示，该方法使用两个哈希函数进行操作，而不是单个哈希函数。哈希函数给出：\n\
  \n```\nh’(k) = (h1 + ih2) mod m\n```\n\n## 10.3 练习\n\n### 10.3.1 复习题\n\n1. 什么是哈希表？\n\
