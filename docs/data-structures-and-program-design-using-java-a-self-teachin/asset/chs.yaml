  \n## 12.4 图遍历技术\n\n在本节中，我们将讨论用于遍历图的各种类型的技术。众所周知，图是节点和边的集合。因此，遍历图是以某种系统方法访问每个节点和边的过程。因此，有两种标准的图遍历技术，它们是：\n\
  \n1. 广度优先搜索 (BFS)\n2. 深度优先搜索 (DFS)\n\n现在我们将详细讨论这两种技术。\n\n### 12.4.1 广度优先搜索\n\n广度优先搜索是一种遍历技术，它使用队列作为辅助数据结构来遍历图的所有成员节点。在这种技术中，我们首先在图中选择任意节点作为起始节点，然后获取所有与起始节点相邻的节点。对于所有其他节点，我们将保持相同的方法。此外，我们将在队列中维护所有已遍历/访问节点的状态，以便节点不再重复遍历。现在，让我们取一个图并应用\
  \ BFS 来遍历该图。\n\n![image](img/12.23.jpg)\n图 12.23。\n一个示例图。\n\n现在，我们将以上一个示例中的节点 A\
  \ 为起始节点开始遍历图。然后，我们将遍历所有与起始节点 A 相的节点。可以看到，B、C 和 E 是 A 的相邻节点。因此，我们将以任何顺序遍历这些节点，例如\
  \ E、C、B。所以，遍历顺序为：\n\nA, E, C, B\n\n现在，我们将遍历所有与 E 相的节点。节点 C 与节点 E 相邻。但节点 C 已经被遍历过了，所以我们将忽略它并移动到下一步。现在，我们将遍历所有与节点\
  \ C 相的节点。可以看到，D 是 C 的相邻节点。因此，我们将遍历节点 D，遍历顺序为：\n\nA, E, C, B, D\n\n现在我们可以看到所有节点都已经被遍历，因此这就是以节点\
  \ A 为起始节点的广度优先搜索遍历。\n\n现在，我们将借助队列来实现广度优先搜索遍历技术。在此过程中，我们将维护一个数组，用于存储所考虑的节点的所有相邻且未访问的邻居节点。初始时，队头和队尾设置为\
  \ `-1`。我们还用一个布尔数组维护已访问节点的状态，如果节点已访问则值为 1，如果未访问则值为 0。\n\n* 首先，我们将起始节点入队/插入队列中。\n\
  * 第二，从队列中删除第一个节点/元素，并将所有相邻且未访问的节点插入队列。重复此过程，直到队列为空。\n\n**例如：** 考虑以下示例图并使用广度优先搜索技术遍历图。\n\
  \n![image](img/12.24.jpg)\n图 12.24。\n一个示例图。\n\n图的适当邻接列表表示如下：\n\n| 节点 | 邻接列表 |\n\
  | --- | --- |\n| A | B, C |\n| B | C |\n| C | D |\n| D | B |\n\n在这个示例中，我们取 A 作为起始节点。\n\
  \n**步骤 1：** 首先，将节点 A 插入队列。\n\n![image](img/420-01.jpg)\n\n**步骤 2：** 从队列中删除节点 A 并队头加\
  \ `1`。现在，将所有与 A 相的节点（B 和 C）增加队尾。此外，节点 A 已经被遍历。\n\n![image](img/420-02.jpg)\n\n**步骤\
  \ 3：** 同样，从队列中删除节点 B 并队头加 `1`。现在，将所有与 B 相的节点（节点 C）增加队尾。但 C 已经插入队列了。所以现在在这种情况下，节点\
  \ C 同样通过队头加 `1` 被删除，与 C 相的节点（即 D）被插入队列。因此，节点 A、B 和 C 已经被遍历。\n\n![image](img/420-03.jpg)\n\
  \n**步骤 4：** 现在我们再次从队列中删除队头元素 D。我们将插入 D 的相邻节点，即 B。但它已经被遍历过了。最后，当我们删除队头元素 D 时，我们注意到\
  \ `FRONT > REAR`，这是不可能的。因此，我们已经遍历了图中所有的节点。\n\n![image](img/420-04.jpg)\n\n因此，图的广度优先搜索遍历为：\n\
  \nA, B, C, D\n\n现在，让我们看看广度优先搜索遍历的函数。\n\n```\n//编写一个广度优先搜索遍历的程序\n```\n\n\n\n\n\n\
  ```java\nimport java.util.HashMap;\nimport java.util.LinkedList;\n\npublic class\
  \ Graph {\n    private int numV;\n    private boolean[][] matrix;\n\n    public\
  \ Graph(int v) {\n        numV = v;\n        matrix = new boolean[numV + 1][numV\
  \ + 1];\n    }\n\n    public void addEdge(int u, int v) {\n        matrix[u][v]\
  \ = true;\n        matrix[v][u] = true;\n    }\n\n    public boolean BFS(int source,\
  \ int destination) {\n        //Using predefined HashMap and LinkedList\n      \
  \  HashMap<Integer, Boolean> visited = new HashMap<>();\n        LinkedList<Integer>\
  \ queue = new LinkedList<>();\n        queue.addLast(source);\n        while (!queue.isEmpty())\
  \ {\n            int r = queue.removeFirst();\n            if (visited.containsKey(r))\
  \ {\n                continue;\n            }\n            visited.put(r, true);\n\
  \            if (r == destination) {\n                return true;\n           \
  \ }\n            for (int i = 1; i < matrix[0].length; i++) {\n                if\
  \ (matrix[r][i] && !visited.containsKey(i)) {\n                    int n = i;\n\
  \                    queue.addLast(n);\n                }\n            }\n     \
  \   }\n        return false;\n    }\n}\n\n// CLIENT CLASS\nimport java.util.Scanner;\n\
  \npublic class GraphClient {\n    public static void main(String[] args) {\n   \
  \     Scanner scn = new Scanner(System.in);\n        Graph g = new Graph(7);\n \
  \       g.addEdge(1, 2);\n        g.addEdge(1, 4);\n        g.addEdge(2, 3);\n \
  \       g.addEdge(3, 4);\n        g.addEdge(4, 5);\n        g.addEdge(5, 6);\n \
  \       g.addEdge(6, 7);\n        g.addEdge(5, 7);\n        int v1, v2;\n      \
  \  System.out.println(\"Enter the pair to be searched:\");\n        v1 = scn.nextInt();\n\
  \        v2 = scn.nextInt();\n        if (g.BFS(v1, v2)) {\n            System.out.println(\"\
  Pair found\");\n        } else {\n            System.out.println(\"Pair not found\"\
  );\n        }\n    }\n}\n```\n\n程序的输出显示所示：\n![image](img/422-01.jpg)\n\n### 12.4.2\
  \ 深度优先搜索\n\n深度优先搜索是另一种遍历技术，它使用栈作为辅助数据结构来遍历图的所有成员节点。在这一技术中，我们首先选择图中的任意节点作为起始节点，然后沿着从起始节点开始的路径进行旅行。我们将访问起始节点的相邻节点，再次访问上一个节点的相邻节点，以此此类推。我们对所有节点都保持这种方法。现在，让我们取一个图并应用\
  \ DFS 来遍历该图。\n\n![image](img/1225.jpg)\n\n一个示例图。现在我们将以节点 `A` 为起始节点开始遍历图。然后我们将遍历与起始节点相邻的任意节点。我们可以看到，`B`、`C`\
  \ 和 `E` 都是 `A` 的相邻节点。如果我们遍历节点 `E`，我们将遍历 `E` 的相邻节点，即 `C`。在遍历 `C` 后，我们将遍历 `C` 的相邻节点，即\
  \ `D`。现在，`D` 没有相邻节点；因此，我们到达了死胡同。因此，到为止的遍历顺序为：`A`、`E`、`C`、`D`。\n\n由于死胡同，我们将回退。现在到达节点\
  \ `C`。我们将检查 `C` 是否还有其他相邻节点。没有这样的节点，因此我们再次回退。现在我们到达 `E`。我们将检查 `E` 是否还有其他相邻节点。没有这样的节点，因此我们再次回退。现在我们到达\
  \ `A`。我们将检查 `A` 是否还有其他相邻节点。有两个节点 `B` 和 `C` 与 `A` 相邻。由于 `C` 已经被过，它将被忽略。现在我们将遍历节点\
  \ `B`。在遍历 `B` 后，我们将遍历 `B` 的相邻节点，即 `D`，但 `D` 已经被遍历过了。我们无法向前或向前移动。因此，我们完成了遍历。最终的遍历结果为：`A`、`E`、`C`、`D`、`B`。\n\
  \n现在我们将借助栈来实现深度优先搜索技术。在此过程中，我们将维护一个数组，用于存储给定节点的所有未访问的相邻节点。初始时，栈顶被设置为 `-1`。我们还将用一个布尔数组维护已访问节点的状态，如果节点被访问，则值为\
  \ `1`，如果未被访问，则为 `0`。\n\n*   首先，我们将起始节点推入栈中。\n*   其次，从栈中弹出顶部的节点/元素并进行遍历。如果它已经遍历过，则忽略它。\n\
  *   第三，将弹出节点/元素的所有相邻未访问节点推入栈中。重复此过程，直到栈为空。\n\n例如：考虑以下示例图，并使用广度优先搜索技术遍历图。\n\n![image](img/1226.jpg)\n\
  \n一个示例图。在这个例中，我们以 `A` 为起始节点。\n\n**第一步**：将 `A` 推入栈。\n**第二步**：从栈中弹出 `A` 并遍历。\n**第三步**：将\
  \ `A` 的所有相邻节点 `B`、`C`、`E` 推入栈。\n**第四步**：从栈中弹出 `E` 并遍历。\n**第五步**：将 `E` 的所有未访问相邻节点\
  \ `C` 推入栈。\n**第六步**：从栈中弹出 `C` 并遍历。\n**第七步**：将 `C` 的所有未访问相邻节点 `D` 推入栈。\n**第八步**：从栈中弹出\
  \ `D` 并遍历。由于 `D` 没有未访问的相邻节点，回退。\n**第九步**：从栈中弹出 `C`，由于 `C` 已访问，跳过。\n**第十步**：从栈中弹出\
  \ `E`，由于 `E` 已访问，跳过。\n**第十十步**：从栈中弹出 `B`，跳过。\n**第十二步**：从栈中弹出 `B` 并遍历。\n**第十三步**：将\
  \ `B` 的所有未访问相邻节点 `D` 推入栈（但 `D` 已访问）。\n\n遍历顺序为 `A`、`E`、`C`、`D`、`B`。\n\n**记忆辅助**\n\
  \n为了记忆实现广度优先搜索和深度优先搜索时使用哪些数据结构，可以使用这种记忆方法。广度优先搜索使用队列（Queue）实现，而深度优先搜索使用栈（Stack）实现，这可以通过字母顺序来记忆：B\
  \ (Breadth First Search) 和 Q (Queue) 在 D (Depth First Search) 和 S (Stack) 之前。\n\n\
  \n\n\n拓扑排序是一种确定有向无环图（也称为 DAG）节点线性排序的过程，使得图中每一条从节点 `a` 到节点 `b` 的有边在排序中 `a` 都在 `b`\
  \ 之前。这种排序的核心思想是：如果图中存在某个节点的入度为 0，那么该节点应该被选为顺序中的第一个元素。拓扑排序仅适用于有向无环图。它被广泛应用于任务调度等领域。现在，让我们来看拓扑排序的算法。\n\
  \n# 拓扑排序算法\n\n- **步骤 1:** 开始\n- **步骤 2:** 找到所有节点的入度。\n- **步骤 3:** 将所有入度为 0 的节点插入队列。\n\
  - **步骤 4:** 重复步骤 5 和 6，直到队列为空。\n- **步骤 5:** 从队列头部删除一个节点并将 `FRONT` 增 1。\n- **步骤 6:**\
  \ 对于节点 `P` 的每个邻居 `M`：\n    - (a) 删除从 `P` 到 `M` 的边，并将 `M` 的入度减 1。\n    - (b) 如果 `M`\
  \ 的入度为 0，则将 `M` 加入队列尾部。\n- **步骤 7:** 结束\n\n## 示例：考虑一个给定的有向无环图并找到它的拓扑排序。\n\n![image](img/12.27.jpg)\n\
  图 12.27。有向无环图。之前的图邻接列表表示如下：\n\n| 节点 | 邻接列表 |\n| --- | --- |\n| A | B, C |\n| B |\
  \ E |\n| C | B, D |\n| D | - |\n| E | - |\n\n### 步骤 1: 所有节点的入度：\n\n入度 (A) – 0\n\
  入度 (B) – 2\n入度 (C) – 1\n入度 (D) – 1\n入度 (E) – 1\n\n现在有一个入度为 0 的节点 `A`；因此 `A` 将加入队列。\n\
  \n### 步骤 2: 现在，将节点 `A` 插入队列。\n\n`FRONT = 1`, `REAR = 1`, `QUEUE = A`\n\n### 步骤 3:\
  \ 现在，从队列中删除节点 `A`。同时删除从 `A` 出发的所有边。\n\n`FRONT = 0`, `REAR = 0`, `拓扑排序 = A`\n\n因此，图变为：\n\
  \n![image](img/428-01.jpg)\n\n现在所有节点的入度：\n\n入度 (B) – 1\n入度 (C) – 0\n入度 (D) – 1\n\
  入度 (E) – 1\n\n现在有一个入度为 0 的节点 `C`；因此 `C` 将加入队列。\n\n### 步骤 4: 现在，将节点 `C` 插入队列。\n\n\
  `FRONT = 1`, `REAR = 1`, `QUEUE = C`\n\n### 步骤 5: 现在，从队列中删除节点 `C`。同时删除从 `C` 出发的所有边。\n\
  \n`FRONT = 0`, `REAR = 0`, `拓扑排序 = A, C`\n\n因此，图变为：\n\n![image](img/429-01.jpg)\n\
  \n现在所有节点的入度：\n\n入度 (B) – 0\n入度 (D) – 0\n入度 (E) – 1\n\n现在有两个入度为 0 的节点 `B` 和 `D`；因此\
  \ `B` 和 `D` 将加入队列。\n\n### 步骤 6: 现在，将节点 `B` 和 `D` 插入队列。\n\n`FRONT = 1`, `REAR = 2`,\
  \ `QUEUE = B, D`\n\n### 步骤 7: 现在，从队列中删除节点 `B`。同时删除从 `B` 出发的所有边。节点的入度不会发生变化。\n\n\
  `FRONT = 1`, `REAR = 1`, `拓扑排序 = A, C, B`, `QUEUE = D`\n\n### 步骤 8: 现在，从队列中删除节点\
  \ `D`。同时删除从 `D` 出发的所有边。\n\n`FRONT = 0`, `REAR = 0`, `拓扑排序 = A, C, B, D`\n\n因此，图变为：\n\
  \n![image](img/429-02.jpg)\n\n现在所有节点的入度：\n\n入度 (E) – 0\n\n现在有一个入度为 0 的节点 `E`；因此\
  \ `E` 将加入队列。\n\n### 步骤 9: 现在，将节点 `E` 插入队列。\n\n`FRONT = 1`, `REAR = 1`, `QUEUE =\
  \ E`\n\n### 步骤 10: 现在，从队列中删除节点 `E`。同时删除从 `E` 出发的所有边。\n\n`FRONT = 0`, `REAR = 0`,\
  \ `拓扑排序 = A, C, B, D, E`\n\n现在图中没有剩余节点。因此，该图的拓扑排序为 `A, C, B, D, E`。\n\n## 最小生成树\n\
  \n生成树是连通无向图的一个子图，它包含了图中所有的顶点且没有环。最小生成树（MST）是边权最小的生成树。有两种流行的算法可以寻找最小生成树：\n\n### 1.\
  \ Prim 算法\n\nPrim 算法是一种贪心算法，它一次一个顶点地构建生成树。它从一个任意顶点开始，添加连接树内顶点与树外顶点的最廉边。\n\n### 2.\
  \ Kruskal 算法\n\nKruskal 算法也是一种贪心算法，它通过对图的所有边进行排序并逐个添加（只要不形成环）来寻找 MST。\n\n## 总结\n\
  \n*   图是顶点（节点）和连接这些顶点的边的集合。\n*   节点的度是连接到该特定节点的边的总数。\n*   当图 `G (V, E)` 中的每个节点都与另一个节点连接，且任何节点上都没有自环时，该图被称为且仅被称为完全图。\n\
  *   邻接矩阵通常用于表示相互相邻节点的信息。邻接矩阵也称为位矩阵或布尔矩阵，因为它只包含 0 和 1。\n\n\n\n\n# 图形概念\n* 在邻接表表示法中，每个节点都连接到所有与其相邻的节点组成的列表。\n\
  * 遍历图是以某种系统化的方法访问每个节点和每条边的过程。\n* 广度优先搜索（BFS）是一种遍历技术，它使用 `queue`（队列）作为辅助数据结构来遍历图的所有成员节点。在这种技术中，我们首先选择图中的任意节点作为起始节点，然后获取与起始节点相邻的所有节点。我们将对所有其他节点保持相同的方法。\n\
  * 深度优先搜索（DFS）是另一种遍历技术，它使用 `stack`（栈）作为辅助数据结构来遍历图的所有成员节点。同样，我们首先选择图中的任意节点作为起始节点，然后沿着从起始节点开始的路径进行旅行。我们将访问起始节点的相邻节点，再次访问上一个节点的相邻节点，依此类推。\n\
  * 拓扑排序（Topological sort）是一种确定无环有向图（也称为 `DAG`）节点线性排序的过程，其中每个节点都位于所有前驱为零的节点之前。\n*\
  \ 最小生成树（`MST`）定义为一种与边相关的权重/成本的生成树，使得生成树的总权重/成本最小。\n\n## 12.8 习题\n\n### 12.8.1 理论题\n\
