  \    }\n        arr[position] = k;\n    }\n    public static void qprob(int k, int\
  \ arr[]) {\n        int position;\n        position = k % SIZE;\n        while ((arr[position]\
  \ != k) && (arr[position] != -1)) {\n            position = ++position % SIZE;\n\
