  \ for 循环中进行了数组的遍历。\n\n### 2. 在数组中插入元素\n\n*在数组中插入元素是指向数组添加一个元素的操作。*在这种情况下，我们假设数组有足够的空间。例如，如果一个数组可以容纳\
  \ 15 个元素，而它只包含了 15 个元素，那么我们就有空间容纳。数组的插入可以通过三种方式完成：\n\n(a) 在开头插入\n(b) 在指定位置插入\n(c)\
  \ 在末尾插入\n\n#### (a) 在开头插入\n\n在这种情况下，要插入的新元素被插入在开头。例如，如果一个数组被声明为容纳 10 个元素，而它只包含了\
  \ 7 个元素，并且给定新元素要插入在开头，如下：\n\n\n移动元素并将新元素插入到第一个位置，新数组将是：\n\n![image](img/83-02.jpg)\n\
  \n**开头插入的算法**\n\n我们假设 `ARR` 是一个具有 `N` 个元素的数组。数组中可以存储的最大元素由 `SIZE` 定义。我们应该首先检查数组是否有空位来存储元素，然后进行插入操作。\n\
  \nSTART\nIF `N = SIZE`\n    Print OVERFLOW\nELSE\n    `N = N + 1`\n    `I = N`\n\
  \    WHILE `I >= 0`\n        `ARR[I+1] = ARR[I]`\n`ARR[0] = New_Element`\nEND\n\n\
  #### (b) 在指定位置插入\n\n在这种情况下，要插入的新元素插入在用户指定的的位置。例如，如果一个数组被声明为容纳 10 个元素，而它只包含了 8 个元素，并且给定新元素要插入在数组的第五位置，如下：\n\
  \n![image](img/84-01.jpg)\n\n移动中间的元素并将新元素插入到中间，新数组将是：\n\n![image](img/84-02.jpg)\n\
  \n**指定位置插入的算法**\n我们假设 `ARR` 是一个具有 `N` 个元素的数组。数组中存储的最大元素由 `SIZE` 定义。让 `POS` 定义要插入新元素的位置。我们应该首先检查数组是否有可用空间来存储元素，然后进行该过程。\n\
  \nSTART\nIF `N = SIZE`\n    Print OVERFLOW\nELSE\n    `N = N + 1`\n    `I = N`\n\
  \    WHILE `I >= POS`\n        `ARR[I+1] = ARR[I]`\n`ARR[POS] = New_Element`\nEND\n\
  \n#### (c) 在末尾插入\n\n在这种情况下，要插入的新元素被插入在数组的末尾。因此，在这种情况下不需要交换元素。我们只需要检查数组是否有足够的空间。例如，如果一个数组被声明为容纳\
  \ 10 个元素，而它只包含了 9 个元素，那么插入就可以发生。\n\n![image](img/85-01.jpg)\n\n\n\n\n现在最后一个元素将被插入到最后一个位置，即\
  \ `arr [9]`，该位置是空的。因此，插入后的新数组将是：\n\n![image](img/85-02.jpg)\n\n## 实际应用\n\n这就像普通的排队，一个人来到并加入队伍末尾；因此，在这个过程中不需要任何元素移动。\n\
  \n## 在末尾插入的算法\n假设 `ARR` 是一个包含 `N` 个元素的数组。数组可以存储的最大元素数量由 `SIZE` 定义。我们应该首先检查数组是否有可用空间来存储新元素，然后进行插入过程。\n\
  \n- **步骤 1:** `START`\n- **步骤 2:** `IF N = SIZE`，打印 `OVERFLOW`；`ELSE` `N = N + 1`\n\
