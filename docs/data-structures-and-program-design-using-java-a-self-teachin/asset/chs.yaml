  \    (a) 数据 & 时间\n    (b) 数据 & 空间\n    (c) 时间 & 空间\n    (d) 时间 & 复杂度\n\n15. 下列哪种情况在复杂度理论中不存在/不发生？\n\
  \    (a) 平均情况\n\n\n\n\n- (b) 最坏情况\n- (c) 最优情况\n- (d) 最小情况\n# 第 2 章：Java 语言简介\n\n\
  ## 2.1 引言\nJava 是一种广泛使用的编程语言，由 James Gosling、Mike Sheridan、Chris Warth、Ed Frank\
  \ 和 Patrick Naughton 于 1991 年于 Sun Microsystems 公司创建。Sun Microsystems 于 1996 年发布了\
  \ Java 1.0 的第一个公共实现。开发 Java 的主要动机是需要一种平台无关的语言，用于创建可以嵌入到不同电子设备（如洗衣机、遥控器、电视机等）中的软件。目前有多种类型的\
  \ CPU 可作为控制器，它们主要被设计为通过 C、C++、Java 和其他编程语言针对特定目标进行编译。但一个局限性是创建编译器的过程非常耗时；此外，编译器的成本昂高。因此，为了克服这一限制并找到一种更简单、更具效益的解决方案，James\
  \ Gosling 与他的同事开始研究一种可移植且平台无关的语言，这种语言可以生成能够在不同环境下各种 CPU 上运行的代码，这最终导致了 Java 语言的诞生。创建\
  \ Java 语言主要有三个核心目标，如下：\n\n* 它必须是简单的、面向对象的且熟悉的语言。\n* 它必须是可移植的、分布式的且平台无关的。\n* 它必须是健壮的、安全的且可靠的。\n\
  \n## 2.2 Java 及其特性\n尽管 Java 的许多特性源自 C 和 C++，但它并不是 C++ 的增强版本。它使用了 C 语言的语法，并体现了 C++\
  \ 语言的面向对象特性。Java 是一种非常强大的语言，被称为专业程序员的语言。Java 编程语言有几个不同的特性，以下如下：\n\n* Java 是一种非常简单的语言，非常易学习，其语法简单易于理解。\n\
  * Java 是一种面向对象的编程语言。Java 中的一切皆都是对象。\n* Java 以其安全性闻名。由于 Java 中的所有内容都被视为对象，这增加了它的安全性。此外，Java\
  \ 是安全的，因为它不使用显式指针，并且 Java 程序运行在虚拟机沙箱内部。\n* Java 是一种健壮的语言，因为它使用了强内存管理概念并包含了自动垃圾回收机制。所有这些特性都使\
  \ Java 变得健壮。\n* Java 是可移植的，因为 Java 代码可以运行在任何平台上。它不需要任何额外的实现。\n* Java 比其他传统的解释型编程语言快，因为\
  \ Java 字节码非常“接近”原生代码，因此提供了高性能。\n* Java 是一种分布式的、多线程的动态语言。\n\n## 2.3 Java 概述\n在 Java\
  \ 中，最初所有的源代码都写在以 `.java`（dot java）扩展结尾的纯文本文件中。然后，所有源文件由 `javac` 编译器编译成 `.class`\
  \ 文件。`.class` 文件不包含适用于处理器的原生代码；相反，它包含字节码，这是 Java 虚拟机（JVM）的机器语言。最后，`java` 启动工具通过\
  \ `JVM` 实例运行应用程序。由于 `JVM` 可用于不同的操作系统，相同的 `.class` 文件能够在 Windows、macOS、Linux 等不同的操作系统上运行。\n\
  \n![image](img/2.1.jpg)\n\n图 2.1.\nJava SE 流程的概览。\n## 2.4 编译 Java 程序\nJava 中的每个文件都使用\
  \ `.java` 文件扩展名。此外，在 Java 中，所有代码必须位于类（class）内部。最重要的任务是，按照约定，类的名称应与持有程序的文件的名称匹配。\n\
  \n要编译程序，请在系统中打开命令提示符。在以下命令提示符上运行编译器 `javac`（Java 编译器），指定源文件：\n\n![image](img/39-01.jpg)\n\
  \n源文件被编译器编译成 `.class` 文件。现在，将创建一个 `Filename.class` 文件，其中包含程序的字节码。要运行程序，请使用称为 `java`\
  \ 的 Java 启动工具。\n\n![image](img/39-02.jpg)\n\n最后，当程序执行时，输出显示：\n\n![image](img/40-01.jpg)\n\
  \n## 2.5 面向对象编程\n面向对象编程是 Java 编程语言的核心。面向对象编程（OOP）对于 Java 来说是性的，因此最好理解它的基本原理。OOP\
  \ 围绕数据以及一组对数据良好定义的接口来组织程序。以下是面向对象编程的各种特性或特点：\n\n* **对象（Objects）：** 对象是一个容器，数据以变量、方法和数据结构的组合存储在其中。对象是程序中与其他部分/片段交互的组件。对象是程序的基本运行时实体。\n\
  * **类（Classes）：** Java 通向面向对象编程的构建模块是类。类实际上是一个用户定义的数据类型，持有它自己的数据成员和成员方法。它是将数据成员和方法结合在一起。可以通过创建该类的对象来访问该类。类提供了一种方便的方法，将一组相关的数据项和方法打包在一起。\n\
  * **封装（Encapsulation）：** 封装是将数据成员和方法封装成单个单元的过程。它是保护代码和数据免受外部干扰的机制。它意味着没有授予直接访问；即它是隐藏的。这意味着为了访问数据，我们与负责该数据的对象交互。这被称为数据隐藏。\n\
  \n### 实际应用\n封装最常见的例子是胶囊。在胶囊中，所有的药物都封装在一个胶囊内。\n\n![image](img/41-01.jpg)\n\n\n  1.\
  \ **单继承（Single Inheritance）：** 从单个基类派生的类被称为单继承。\n     ![image](img/41-02.jpg)\n\
  \  2. **多级继承（Multilevel Inheritance）：** 从已派生的类派生的类被称为多级继承。\n     ![image](img/41-03.jpg)\n\
  \  3. **多重继承（Multiple Inheritance）：** 从多个基类派生的类被称为多重继承。这在 Java 中不通过类直接实现。它是通过接口实现的，接口将在将在后的章节中介绍。\n\
  \n![image](img/42-01.jpg)\n\n### 常见问题\n**1. 基类和派生类有什么区别？**\n\n\n\n\n\n### 继承\n在创建类时，程序员不需要编写完全新的数据成员和成员方法，而是可以指定新类继承现有类的成员。这个现有的类被称为基类（base\
  \ class/parent class），而新类被称为派生类（derived class）。一个类可以派生自多个类，这意味着它可以从多个基类继承数据和方法。\n\
  \n#### 实际应用\n继承最常见的现实例子是你的家庭，其中爷爷是家的一顶柱（基类/父类），父亲是爷爷的孩子（派生类），而你是父亲的孩子（派生类）。\n\n\
  ![image](img/42.jpg)\n\n### 多态\n`polymorphism` 一词源于单词 `poly`（意为“多”）和 `morph`（意为“形式”）。因此，以超过一种形式存在的事物都被称为多态。因此，多态意味着产生多种形式的能力。多态通常发生在存在类层级结构且类之间通过继承关系相关联时。多态被认为是面向对象编程最重要的特性之一。多态有两种类型：\n\
  \n1. **编译时多态（静态多态）：** 通过 `method overloading`（方法重载）实现。\n\n#### 实际应用\n一个人在不同的情况下表现出不同的角色；即：他/她是父亲的孩子，是老师的学生，是朋友的朋，以此此类推。\n\
  \n### 抽象\n抽象的过程与隐藏非本质数据的思想有些相似。抽象是指只显示本质特征，并隐藏演示所需的背景细节和解释。这也被数据抽象。抽象是 Java 语言提供的关键特性之一。在\
  \ Java 中，抽象通过 `abstract classes`（抽象类）和 `interfaces`（接口）实现。\n\n#### 实际应用\n考虑一个正在开公交车的男人。这个人只知道加速加速会增加增加的速度，刹车会降低速度。因此，他并不内部机制。\n\
  \n### 常见问题\n\n**2. 解释抽象和封装之间的区别。**\n\n**答：** 数据抽象是指向外部世界提供本质信息并隐藏背景细节，即在程序中表示所需的信息而不展示所有细节。另一方面，封装是一种面向对象编程的概念，将数据和操作数据的方法结合在一起，使其不受外部世界的影响。\n\
  \n### 消息传递\n消息传递是对象之间通信的过程。面向对象的程序由对象组成，对象通过相互发送和接收信息进行通信。发送对象的消息是对执行过程的请求，因此它将调用接收对象中的方法以生成所需的结果。消息传递涉及三点：对象的名称、方法的名称和发送的数据。\n\
  \n### 动态绑定\n动态绑定是指给定的过程调用需要执行的代码在运行时而非编译时已知的过程。它也被称为 `dynamic dispatch`（动态分发）。这是一个面向对象编程的概念，与继承和多态有关。\n\
  \n![image](img/2.2.jpg)\n图 2.2 面向对象编程的特性。\n\n## 2.6 Java 使用的字符集\nJava 允许的字符集由以下字符组成：\n\
  \n* **字母表：** 包括英语的大写和小写字母，即 `{A, B, C... ., Z}` 和 `{a, b, c... ., z}`。\n* **空白字符：**\
  \ 包括空格、回车和制表符。\n* **特殊字符：** 由特殊符号组成，包括 `{ !, ?, #, <, >, (, ), %, &, ^, *, <<, >>,\
  \ [, ], +, =, /, -, _, :, ;, }`。\n\n## 2.7 Java 标记\nJava 标记帮助我们编写 Java 程序。Java 支持多种类型的标记：\n\
  \n* 关键字\n* 标识符\n* 常量\n* 变量\n\n![image](img/2.3.jpg)\n图 2.3 各种 Java 标记。\n\n现在，让我们讨论所有的标记。\n\
  \n### 关键字\nJava 中的关键字是具有特殊含义的保留字。它们以小写形式。关键字不能作为标识符使用。示例有 `auto`, `int`, `float`,\
  \ `char`, `break`, `continue`, `double`, `long`, `short`, `while`, `for`, `else`,\
  \ `new`, `void` 等。\n\n### 标识符\n标识符是赋予常量、变量、方法或数组的名字。定义标识符的规则如下：\n\n1. 标识符可以包含字母、数字或下划线。\n\
  2. 它不能以数字开头。\n3. 它可以下划线或字母开头。\n4. 标识符不能包含特殊符号或空格。\n5. 关键字不能用作标识符。\n\n**例如：**\n![image](img/45-01.jpg)\n\
  ### 常量\n常量是 Java 中永远不能改变固定值。常量也被称为字面量。例如，`pi` 的值是固定的。常量可以是任何数据类型。Java 有两种类型的常量，如下：\n\
  \n* **数值常量：** 仅分配整数值的常量。它由整数常量、浮点常量或实数常量组成。\n* **字符常量：** 仅分配字符值的常量。\n\n### 变量\n\
  变量是用于引用内存位置的名字。在处理变量时，我们指的是存储数据的内存地址。Java 支持两种类型的变量，包括字符变量和数值变量。\n\n* **数值变量：**\
  \ 用于存储整数或浮点类型的值。\n* **字符变量：** 在这种变量中，单字符被包含在单引号内。\n\n## 2.8 Java 数据类型\n数据类型是定义数据类型以及变量持有数据量的特殊关键字。Java\
  \ 中五种基本数据类型，如下：\n\n* **整数 (int)：** 即 23, -98, +786 等。\n* **字符 (char)：** 即 ‘A’, ‘x’,\
  \ ‘u’ 等。\n* **布尔 (boolean)：** 即 true/false 或 1/0。\n* **浮点型 (float)：** 即 1.7, -4.6,\
  \ +9.6 等。\n* **双精度浮点型 (double)：** 即 -87.55653, +9867.3467 等。\n\n有各种修饰符用于改变基本数据类型的含义，`void`\
  \ 除外。这些修饰符是符号、无、短和长。所有修饰符都可以应用于整数。然而，只有符号和无应用于字符。\n\n## 2.9 Java 程序结构\n与 C 和 C++\
  \ 不同，Java 程序需要类来执行。在 C 和 C++ 中，可执行代码或结构可能包含不包含类。但在 Java 中，一切都限制在类中。\n\n现在，让我们通过一个简单的程序来看。\n\
  \n\n\n\n```java\nclass Example {/*创建一个包含数据成员和成员方法的类*/ {\n    private int a, b, sum;\
  \ /*a, b & sum 是该类的私有数据成员*/\n    public void sum()/*sum() 方法被声明为公共*/ {\n       \
  \ a = 10, b = 20;\n        sum = a + b;\n        System.out.println(\"Sum\" + sum);\
  \ /*在屏幕上打印输出*/\n    }\n    public static void main(String[] args) /*主方法*/ {\n  \
  \      Example obj = new Example(); /*obj 是 Example 类的对象*/\n        obj.sum();\n\
  \    }\n}\n```\n\n### 常见问题\n\n#### 3. Java 中是如何获取输入以及如何显示输出的？请解释。\n\n**答：** 在 Java\
  \ 中，使用 `Scanner` 类来获取输入。它是一个预定义类，可以通过创建它的对象来访问。输出使用 `System.out.println();` 语句进行显示。\n\
  \n示例：\n```java\nimport java.util.Scanner; /*导入 Scanner 类*/\npublic class ABC{\n\
  \    public static void main(String[]args){\n        Scanner obj=new Scanner(System.in);\n\
  \        System.out.println(\"Enter a value:\");\n        System.out.println(x);\n\
  \    }\n}\n```\n\n## 2.10 Java 中的运算符\n\nJava 中的运算符用于在不同的变量和常量之间执行特定的操作。Java 支持多种运算符，如下所示：\n\
  \n*   算术运算符\n*   逻辑运算符\n*   赋值运算符\n*   关系运算符/ 比较运算符\n*   条件运算符/ 三元运算符\n*   位运算符\n\
  *   一元运算符\n\n现在，让我们讨论所有这些运算符。\n\n### 算术运算符\n\n算术运算符是用于数学计算或运算的运算符。Java 中有效的算术运算符如表所示。\n\
  \n假设 `x` 和 `y` 是两个变量。\n\n![image](img/49-01.jpg)\n\n### 逻辑运算符\n\nJava 支持三种逻辑运算符，如下所示：\n\
  ![image](img/49-02.jpg)\n\n**逻辑非 (Logical NOT):** 它是一个一元运算符。该运算符接收单个表达式，并反转结果，使得\
  \ `true` 变为 `false`，反之亦然。逻辑非的真值表如下：\n\n![image](img/49-03.jpg)\n\n**逻辑与 (Logical\
  \ AND):** 它是一个二运算符。因此，它接收两个输入或表达式。如果两个输入都是 `true`，则整个表达式为 `true`。如果两个输入中的任何一个为 `false`，则整个表达式将为\
  \ `false`。逻辑与的真值表如下：\n\n![image](img/49-04.jpg)\n\n**逻辑或 (Logical OR):** 它也是一个二运算符；也就是说，它也接收两个表达式。如果两个输入都是\
  \ `false`，则输出为 `false`。如果一个或两个输入都是 `true`，则输出为 `true`。逻辑或的真值表如下：\n\n![image](img/50-01.jpg)\n\
  \n### 赋值运算符\n\n赋值运算符负责为变量赋值。这些运算符总是从右到左求值。Java 支持多种赋值运算符，如下所示：\n\n![image](img/50-02.jpg)\n\
  \n### 关系运算符\n\n关系运算符用于两个值或表达式之间的比较。它们也被称为比较运算符。这些运算符总是从左到右求值。Java 中使用的各种关系运算符如下：\n\
  \n![image](img/50-03.jpg)\n\n### 条件运算符\n\n条件运算符就输入而言也称为三元运算符；它接受三个操作数。该运算符的语法如下：\n\
  \n\n其中，`expression 1` 首先被求值。如果 `expression 1` 为 `true`，则求值 `expression 2`，`expression\
  \ 2` 将是整个表达式的答案；否则求值 `expression 3`，`expression 3` 将是整个表达式的答案。条件运算符可以找到两个数中的较大者。\n\
  \n`Greatest = (x > y)? X: y;`\n\n在这里，如果 `x > y` 为 `true`，则 `x` 大于 `y`；即 `(greatest\
  \ = x)`；否则 `y` 大于 `x`，即 `(greatest = y)`。\n\n### 位运算符\n\n位运算符是在用于位位上执行操作的特殊运算符。Java\
  \ 支持多种位运算符，包括：\n\n![image](img/51-01.jpg)\n\n### 一元运算符\n\n一元运算符是指需要单个操作数即可工作的。Java\
  \ 支持两种运算符：增 (`++`) 和减 (`--`)。两种变体是后置和前置。在后置表达式中，运算符应用于操作数之后。相反，在前置表达式中，运算符应用于操作数之前。\n\
  \n![image](img/51-02.jpg)\n\n## 2.11 Java 中的决策语句\n\n当我们谈论用 Java 编写的程序时，我们知道程序总是按顺序执行，即逐行执行。最初，执行第一行。然后执行第二行，依此类推。控制语句是允许程序员执行代码块并指定执行顺序的语句。它们决定了控制流。因此，它们也被称为决策语句。Java\
  \ 使用以下方式执行控制语句：\n\n*   IF 语句\n*   IF-ELSE 语句\n*   嵌套 IF-ELSE 语句\n*   Switch Case\n\
  \n现在，让我们讨论所有的。\n\n\nIF 语句是一种双向控制语句，用于测试条件并采取可能的行动之一。它是简单的决策控制语句，被频繁用于决策。IF 语句的一般语法如下：\n\
  \n```\nif (condition){\n    Statement Block of if; //如果条件为真，执行 if 的语句\n}\n```\n\
  ![image](img/2.jpg)\n\nIF 语句将检查条件，如果条件为真，则只执行 IF 块内的语句。然而，IF 块外的语句将独立于条件始终执行。IF\
  \ 块可以包含包含在大括号内的一个或多个语句。此外，简单 IF 语句中的 ELSE 是可选的，因为如果条件为假，控制直接跳转到下一个语句。记住，条件后面没有分号，因为条件和语句应该作为一个整体语句使用。\n\
  \n例如：\n\n编写一个显示使用 IF 语句的程序。\n\n```java\nimport java.util.*;\npublic class If{\n\
  \    public static void main(String[]args){\n        Scanner src=new Scanner(System.in);\n\
  \        System.out.println(\"Enter two values:\");\n        int x=src.nextInt();\n\
  \        int y=src.nextInt();\n        if(y>x){\n            System.out.println(\"\
  Y is greater:\"+y);\n        }\n        System.out.println(\"End of the program\"\
  );\n    }\n}\n\n程序的输出显示所示：\n\n![image](img/54-01.jpg)\n\n**IF-ELSE 语句**\n\n\n\n\n\
  \n在讨论了 `IF` 语句的使用后，我们了解到当条件为假时，`IF` 语句不会执行任何操作。它只是将控制权交给 `IF` 块之外的下一个语句。`IF-ELSE`\
  \ 语句处理了这一问题。`IF-ELSE` 语句的一般语法如下：\n\n```java\nif (condition){\n  Statements X; //如果条件为真，执行语句\
  \ X\n}else{\n  Statements Y; //如果条件为假，执行语句 Y\n}\n```\n![image](img/2.5.jpg)\n\n\
  图 2.5。\n\nIF-ELSE 语句流程图。\n\n`IF-ELSE` 语句会检查条件。如果条件为真，则执行语句集 `X`，并且不执行 `ELSE` 块。否则，如果条件为假，则执行语句集\
  \ `Y`，并且不执行 `IF` 块。`IF` 或 `ELSE` 块可以包含一个或多个语句。\n\n例如：\n```java\n//Write a program\
  \ to show the use of IF-ELSE.\n\nimport java.util.*;\npublic class IfElse{\n   \
  \ public static void main(String[] args) {\n      Scanner src = new Scanner(System.in);\n\
  \      System.out.println(\"Enter two values:\");\n      int x = src.nextInt();\n\
  \      int y = src.nextInt();\n      if(y>x) {\n        System.out.println(\"Y is\
  \ greater:\" +y);\n      }\n      else {\n        System.out.println(\"X is greater:\"\
  \ +x);\n      }\n      System.out.println(\"End of the program\");\n    }\n}\n```\n\
  \n程序的输出所示：\n\n![image](img/56-01.jpg)\n\n### 嵌套 IF-ELSE 语句\n\n嵌套的 `IF-ELSE` 语句也称为\
  \ `IF-ELSE-IF 梯形`。`IF-ELSE-IF` 语句的工作方式与普通 `IF` 语句相同。嵌套 `IF-ELSE` 语句的一般语法如下：\n\n\
  ```java\n    Statements 1; //如果条件 1 为真，执行 If 的语句.}else if (condition 2){\n    Statements\
  \ 2; //如果条件 2 为真，执行 else if 的语句;}else{\n    Statements 3; //如果条件 2 为假，执行 else 的语句。\
  \ \n}\n```\n![image](img/2.6.jpg)\n\n图 2.6。\n\n嵌套 IF-ELSE 语句流程图。\n\n`IF-ELSE-IF`\
  \ 梯形的工作方式如下：首先，检查 `IF` 条件。如果条件为真，则执行语句集 `1`。如果条件为假，则检查 `ELSE-IF` 条件。如果 `ELSE-IF`\
  \ 条件为真，则执行语句集 `2`。否则，执行语句集 `3`。记住，在第一个 `IF` 表达式之后，我们可以根据需要测试的表达式数量设置任意的 `ELSE-IF`\
  \ 分支。\n\n**例如：**\n\n```java\n// Write a program to show the use of Nested IF-ELSE.\n\
  \nimport java.util.*;\npublic class IfElse{\n    public static void main(String[]\
  \ args) {\n      Scanner src = new Scanner(System.in);\n      System.out.println(\"\
  Enter three values:\");\n      int x = src.nextInt();\n      int y = src.nextInt();\n\
  \      int z = src.nextInt();\n      if(x > y && x > z) {\n        System.out.println(\"\
  X is greatest:\" +x);\n      }\n        System.out.println(\"Y is greatest:\" +y);\n\
  \      }\n      else {\n        System.out.println(\"Z is greatest:\" +z);\n   \
  \   }\n      System.out.println(\"End of the program\");\n    }\n}\n```\n\n程序的输出所示：\n\
  \n![image](img/58-01.jpg)\n\n### SWITCH 语句\n\n众所周知，`IF` 语句用于检查给定条件并根据条件的真假选择一个选项。但如果我们有多个选项可供选择，那么对每个选项都使用\
  \ `if` 语句将不是一个好主意，因为会变得非常复杂。因此，为了避免这种问题，使用了 `switch` 语句。`switch` 语句是一种多向的控制语句。它是\
  \ `IF-ELSE-IF` 语句的简化版本。它从我们提供的多个选项中选择一个。因此，它也被选择语句。它的执行速度比 `IF-ELSE-IF` 结构快。此外，`switch`\
  \ 语句相对容易理解和调试。`switch` 语句的一般语法如下：\n\n```java\nswitch (choice){\n  case constant\
  \ 1: Statements 1 ;break ;\n  case constant 2: Statements 2 ;break ;\n  case constant\
  \ 3: Statements 3 ;break ;\n  ...\n  case constant n: Statements n ;break ;\n  default:\
  \ Statements D ;\n}\n```\n![image](img/2.7.jpg)\n\n图 2.7。\nSwitch 语句流程图。\n\n**switch\
  \ 语句的工作原理如下：**\n\n*   最初，将表达式的值与 `switch` 结构中的 `case` 常量进行比较。\n*   如果表达式的值与 `switch`\
  \ 语句匹配，则执行相应的块，直到遇到 `break`。一旦遇到 `break`，控制就会退出 `switch` 语句。\n*   如果 `switch` 语句中没有匹配项，则执行\
  \ `default` 的语句集。\n*   所有 `case` 常量的值必须是唯一的。\n*   整个 `switch` 语句中只能有一个 `default`\
  \ 语句。`default` 语句是可选的；如果不存在且与任何 `case` 常量都不匹配，则不会操作发生。控制直接跳出 `switch` 语句。\n\n**例如：**\n\
  \n```java\n//Write a program to demonstrate the switch case.\n\nimport java.util.*;\n\
  public class Switch{\n    public static void main(String[] args) {\n      Scanner\
  \ src = new Scanner(System.in);\n      System.out.println(\"Enter your choice:\"\
  );\n      int choice = src.nextInt();\n      switch(choice) {\n        case 1:\n\
  \          System.out.println(\"Inside First Case\");\n          break;\n      \
  \  case 2:\n          System.out.println(\"Inside Second Case\");\n          break;\n\
  \        case 3:\n          System.out.println(\"Inside Third Case\");\n       \
  \   break;\n          System.out.println(\"Wrong Choice\");\n      }\n      System.out.println(\"\
  End of the program\");\n    }\n}\n```\n\n\n\n\n\n```\nwhile (condition){  block\
  \ of statements/ body of loop ;  increment/ decrement ;}\n```\n![image](img/2.8.jpg)\n\
  \n图 2.8。\n\nwhile 循环流程图。\n\nwhile 循环的执行如下：\n\n1. 测试条件。\n2. 如果条件为真，则执行语句并重复步骤 1。\n\
  3. 如果条件为假，则终止循环，控制权跳出循环以执行程序的剩余部分。\n\n例如：\n\n```java\n// 写一个执行 while 循环的程序。\npublic\
  \ class While{\n        int i = 1;\n        while(i< 10) {\n            System.out.println(i);\n\
  \            i = i + 1;\n        }\n    }\n}\n```\n\n程序的输出所示：\n\n![image](img/63-01.jpg)\n\
  \n在在上例中，`i` 被初始化为 1，且 1 小于 10，因此条件为真。因此，打印 `i` 的值并将其加 1。当 `i` 变为 10 时，条件将变为假，因此在该条件下，循环将结束。\n\
  \n### DO-WHILE 循环\n\ndo-while 循环与 while 循环相似。唯一的区别在于，与 while 循环在循环开始时检查条件不同，do-while\
  \ 循环在循环结束时检查条件。因此，它也被称为退出控制循环。这意味着在 do-while 循环中，语句至少执行一次，即使条件为假也是，因为条件是在循环结束时检查的。do-while\
  \ 循环的通用语法如下：\n\n```java\nDo{  block of statements/ body of loop ;  increment/ decrement\
  \ ;} while (condition);\n```\n![image](img/2.9.jpg)\n\n图 2.9。\n\ndo-while 循环流程图。\n\
  \ndo-while 循环持续执行，直到条件求值为假为止。do-while 循环通常用于我们需要程序至少执行一次的情况，例如在菜单驱动的程序中。使用 do-while\
  \ 循环的一个主要缺点是，即使条件为假，do-while 循环也会至少执行一次。因此，如果用户输入了某些无关数据，它仍然会执行。\n\n例如：\n```java\n\
  // 写一个程序说明 do-while 循环。\npublic class dowhile{\n    public static void main(String[]\
  \ args) {\n        int i = 0;\n        do {\n            System.out.println(i);\n\
  \            i = i + 1;\n        }while(i< 10);\n    }\n}\n```\n\n程序的输出所示：\n\n![image](img/65-01.jpg)\n\
  \n在之前的代码中，`i` 被初始化为 0，因此打印 `i` 的值并将其加 1。执行一次循环后，现在将检查条件。现在 `i = 1` 且条件为真。因此，循环将执行。当\
  \ `i` 等于 10 时，条件将变为假。在这种情况下，循环将终止。\n\n### FOR 循环\n\nfor 循环是一种预确定次数的循环；也就是说，它是由计数控制的循环，程序员提前知道\
  \ for 循环将执行多少次。在 for 循环中，循环变量始终只初始化一次。for 循环的通用语法如下：\n\n```java\nfor (initialization;\
  \ condition; increment/decrement){  block of statements/ body of loop ;}\n```\n\
  ![image](img/2.10.jpg)\n\n\nfor 循环流程图。\n\n在 for 循环中，条件始终在循环顶部检查。此外，在循环的每次迭代中，都会检查变量和条件。如果条件为真，则执行在\
  \ for 循环内部的语句；否则，控制权移出循环，for 循环终止。正如我们在语法中所看到的，初始化意味着最初为变量分配一个特定值。其次，条件指定了循环是继续执行还是终止。条件在循环的每次迭代中都会被检查。迭代意味着通过增加或减少变量的值来更新该值。此外，for\
  \ 循环中的每个部分都用分号隔开。因此，其中一个部分可能是空的。for 循环广泛用于执行有限次数的特定语句 set。\n\n例如：\n\n```java\n//\
  \ 写一个程序演示 for 循环。\npublic class For{\n    public static void main(String[] args)\
  \ {\n        for(int i = 1 ; i<=10 ; i++) {\n            System.out.println(i);\n\
  \        }\n    }\n}\n```\n\n程序的输出所示：\n\n![image](img/67-01.jpg)\n\n在在上例中，`i` 是一个初始化为\
  \ 1 的计数变量。现在检查条件，因为 1 小于 10。因此，条件为真，所以打印 `i` 的值。在每次迭代后，`i` 的值加 1，并检查条件。当 `i` 变为\
  \ 11 时，条件将变为假，因此此时 for 循环将终止，控制权将离开循环。\n\n### 2.13 Break 和 Continue 语句\n\n在 Java\
  \ 中，break 语句用于循环和 switch 语句。它们用于终止循环的执行。break 语句会导致从语句所在的循环中途退出。我们已经在 switch 语句中见过它的用法，它被用于退出\
  \ switch 语句。当遇到 `break` 时，控制权会跳出循环。break 语句通常用于发生某些错误或我们不想执行循环剩余部分的情况。它的语法非常简单：\n\
  \n语法 – `break;`\n\n```java\n// 写一个程序说明 break 语句的使用。\npublic class Break{\n    public\
  \ static void main(String[] args) {\n        int num = 0;\n        while(num< 5)\
  \ {\n            if(num == 2) {\n                System.out.println(\"Hello!!\"\
  );\n                break;\n            }\n            System.out.println(\"Number\
  \ = \" +num);\n            num = num + 1;\n        }\n    }\n}\n```\n\n程序的输出所示：\n\
  \n![image](img/68-01.jpg)\n\n在之前的代码中，当 `num` 的值等于 2 时，执行 break 语句，控制权跳出 while 循环来到后面的语句。因此，break\
  \ 语句用于从任意一点退出循环。\n\n正如我们看到 break 语句用于退出特定的循环，而 continue 语句用于执行循环的下次迭代。continue 语句也用于循环。与\
  \ break 语句不同，遇到 continue 语句时循环不会终止。continue 语句跳过剩余语句，并将控制权转移到循环的延续部分。因此，循环的执行将从下一次迭代恢复。continue\
  \ 语句的语法如下：\n\n语法 – `continue;`\n\n例如：\n```java\n// 写一个程序说明 continue 语句的使用。\npublic\
  \ class Continue{\n    public static void main(String[] args) {\n        int n;\n\
  \        for(n = 0 ; n <= 8 ; n++) {\n            if(n == 4)\n                continue;\n\
  \            System.out.println(n);\n        }\n    }\n}\n```\n\n程序的输出所示：\n\n![image](img/69-01.jpg)\n\
  \n在之前的代码中，一旦 `n` 的值等于 4，就会执行 continue 语句，并跳过 `System.out.println(n)` 语句。控制权转移到表达式，该表达式增加了\
  \ `n` 的值。因此，控制语句是 break 语句的反面面。\n\n\n\n\n\n作为 Java 程序员，我们经常会遇到程序变得过大且复杂性也随之增加。因此，此时对于程序员来说，阅读整个代码并检查其中的任何错误是非常困难的。为了解决这个问题，Java\
  \ 语言允许我们将整个程序拆分为较少的模块或段。这些模块或段被称为“方法（methods）”。因此，方法是一个用于执行特定任务的预定义代码块。方法用于提高程序的效率。方法可以减少冗余并帮助代码易于理解。每个方法都设计用于执行一个特定的任务。方法分为两类：\n\
  \n1. **库方法（Library Methods）：** 库方法是那些预定义的方法。\n2. **用户定义方法（User-Defined Methods）：**\
  \ 与预定义的库方法不同，这些方法由程序员或用户定义。我们可以轻松地创建这类方法。用户定义方法的通用形式如下：\n\n[return type] <Method\
  \ name> (parameters/ arguments){     Statements;     return;}\n```\n\n其中：\n\n(a)\
  \ **返回类型（Return Type）：** 返回类型用于标识方法将返回什么种类的值。返回类型即数据类型。如果一个方法不返回任何值，则返回类型为 `void`。\n\
  (b) **方法名（Method Name）：** 它标识方法的名称。方法名不应是 Java 库中的保留字。\n(c) **参数（Parameters/Arguments）：**\
  \ 这些是带有其数据类型传递给方法执行各种操作的变量或值。\n(d) **语句（Statements）：** 语句是方法执行的特定步骤。\n\n## 2.15\
  \ 总结\n\n* Java 语言由 James Gosling、Patrick Naughton、Chris Warth、Ed Frank 和 Mike Sheridan\
  \ 于 1991 年在 Sun Microsystems, Inc. 公司创建并开发。\n* Java 语言支持 C 语言的所有特性、灵活性属性。它还引入了各种支持面向对象编程的新功能。Java\
  \ 最初以“带类的 C（C with Classes）”这一新名称为人。因此，Java 是 C 的面向对象版本。\n* `object`（对象）是一个容器，数据以变量、方法和数据结构的组合形式存储其中。\n\
  * `class`（类）基本上是一种用户定义的数据类型，它持有自己的数据成员和成员方法。它是将数据成员及其方法结合在一起的一种。可以通过创建该类的对象来访问该类。\n\
  * `Encapsulation`（封装）是将数据成员和成员方法封装成单个单元的过程。它是保护代码和数据免受外部干扰安全的机制。\n* `Inheritance`（继承）是从现有类派生新类的过程。现有类被称为“基类”、“父类”或“超类”。新类被称为“派生类”、“子类”或“子类”。\n\
  * `polymorphism`（多态）一词源于单词 `poly`（意思是“多”）和单词 `morph`（意思是“形式”）。多态意味着产生多种形式的能力。\n\
  * 多态有两种类型：编译时多态和运行时多态。\n* `Abstraction`（抽象）指的是只显示基本特征，并隐藏演示不需要的背景细节和解释的行为。这也被称为数据抽象。\n\
  * Java 中的关键字（Keywords）是具有特殊含义的保留字。它们采用小写字母。关键字不能用作标识符。标识符是赋予常量、变量、方法或数组的名字。\n* Java\
  \ 中的数据类型是定义变量所持的数据类型和数据量的特殊关键字。\n* Java 中使用的四种基本数据类型是 `int`、`char`、`float` 和 `boolean`。\n\
  * Java 中的运算符（Operators）用于在不同的变量和常量之间执行某些操作。\n* 算术运算符（Arithmetic operators）是用于数学计算的运算符。\n\
  * 赋值运算符（Assignment operators）用于给变量赋值。这些运算符总是从右向左求值。\n* 关系运算符（Relational operators）用于两个值或表达式之间的比较。它们也被称为比较运算符。\n\
  * 条件运算符（Conditional operator）也称为三元运算符，因为它接受三个操作数。\n* 位运算符（Bitwise operators）是用于在位位上执行操作的特殊运算符。\n\
  * 一元运算符（Unary operator）是只需要单个操作数即可工作的运算符。Java 支持两种一元运算符：增运算符（`++`）和减运算符（`--`）。这些运算符分别用于增加或减少变量的值。\n\
  * 控制语句（Control statements）是允许程序员执行特定代码块的语句，并指定程序中各种指令需要执行的顺序。它们决定了控制流。\n* `IF` 语句是一种双向控制语句，用于测试条件并采取可能的行动之一。\n\
  * 嵌套的 `IF-ELSE` 语句也称为 `IF-ELSE-IF` 阶。\n* `switch` 语句是一种多向条件控制语句。它是 `IF-ELSE-IF`\
  \ 语句的简化版本。\n* 循环语句（Looping statements）也称为迭代语句，是一组重复执行的指令，直到某个条件或表达式变为假。\n* `while`\
  \ 循环是一种循环，用于重复一组一个或多个指令/语句，直到特定条件变为假。\n* `do-while` 循环与 `while` 循环类似。唯一的区别是，与 `while`\
  \ 循环在开始时检查条件不同，`do-while` 循环在结束时检查条件。\n* `for` 循环是一种预定的循环；也就是说，它是一种计数循环，程序预先知道要执行多少次。\n\
  * `break` 语句会导致从其所在的循环中途退出。`continue` 语句跳过剩余的语句，并将控制转移到循环开头。\n\n## 2.16 练习\n\n###\
