  \  }\n\n  private int height(Node node) {\n        if (node == null) {\n       \
  \     return -1;\n        }\n        int ht = 0;\n        int lh = height(node.left);\n\
  \        int rh = height(node.right);\n        if (lh > rh) {\n            ht +=\
  \ lh;\n        } else {\n            ht += rh;\n        }\n        return ht + 1;\n\
  \  }\n\n  public void preorder() {\n    preorder(root);\n    System.out.println();\n\
  \  }\n\n  private void preorder(Node node) {\n        if (node == null) {\n    \
  \        return;\n        }\n        System.out.print(node.data + \" \");\n    \
  \    preorder(node.left);\n        preorder(node.right);\n  }\n\n  public void postorder()\
  \ {\n    postorder(root);\n    System.out.println();\n  }\n\n  private void postorder(Node\
  \ node) {\n        if (node == null) {\n            return;\n        }\n       \
  \ postorder(node.left);\n        postorder(node.right);\n        System.out.print(node.data\
  \ + \" \");\n  }\n\n  public void inorder() {\n    inorder(root);\n    System.out.println();\n\
  \  }\n\n  private void inorder(Node node) {\n        if (node == null) {\n     \
  \       return;\n        }\n        inorder(node.left);\n        System.out.print(node.data\
  \ + \" \");\n        inorder(node.right);\n  }\n\n  public void display() {\n  \
  \  inorder();\n  }\n}\n```\n\n### 二叉搜索树\n\n上述代码展示了二叉搜索树的 Java 代码实现。\n\n```java\n\
