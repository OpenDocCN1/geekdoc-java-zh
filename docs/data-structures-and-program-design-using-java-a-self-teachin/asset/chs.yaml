  \    } else if (idx == size) {\n      insertion_at_end(item);\n    } else {\n  \
  \    Node node = create_new_node(item);\n      Node prev = getNodeAt(idx - 1);\n\
  \      node.next = prev.next;\n      prev.next = node;\n      end.next = start;\n\
  \      size++;\n    }\n  }\n\n  private void insertion_at_beginning(int item) throws\
  \ Exception {\n    Node node = create_new_node(item);\n    if (size == 0) {\n  \
  \    start = end = node;\n    } else {\n      node.next = start;\n      start =\
  \ node;\n    }\n    end.next = start;\n    size++;\n  }\n\n  private void insertion_at_end(int\
  \ item) throws Exception {\n    Node node = create_new_node(item);\n    if (size\
  \ > 0) {\n      end.next = node;\n      end = node;\n    }\n    if (size == 0) {\n\
  \      start = end = node;\n    }\n    end.next = start;\n    size++;\n  }\n\n \
  \ public void deletion(int pos) throws Exception {\n    if (pos < 0 || pos == size)\
  \ {\n      throw new Exception(\"Invalid Index\");\n    }\n    if (size == 0) {\n\
  \      throw new Exception(\"Linked List is Empty\");\n    }\n    if (pos == 0)\
  \ {\n      deletion_at_beginning(pos);\n    } else if (pos == size - 1) {\n    \
  \  deletion_at_end(pos);\n    } else {\n      Node prev = getNodeAt(pos - 1);\n\
  \      Node next = getNodeAt(pos + 1);\n      prev.next = next;\n    }\n    size--;\n\
  \  }\n\n  private void deletion_at_beginning(int pos) {\n    end.next = start.next;\n\
  \    start = start.next;\n  }\n\n  private void deletion_at_end(int pos) throws\
  \ Exception {\n    Node prev = getNodeAt(pos - 1);\n    prev.next = start;\n   \
  \ end = prev;\n  }\n\n  public void display() throws Exception {\n    if (size ==\
  \ 0) {\n      throw new Exception(\"Linked List is Empty\");\n    }\n    Node temp\
  \ = start;\n    while (temp != end) {\n      System.out.print(temp.data + \"->\"\
  );\n      temp = temp.next;\n    }\n    System.out.print(end.data + \"->\");\n \
  \   System.out.print(\"NULL \");\n  }\n\n  public Node getNodeAt(int idx) throws\
  \ Exception {\n    if (size == 0) {\n      throw new Exception(\"Linked List is\
  \ Empty\");\n    }\n    if (idx < 0 || idx >= size) {\n      throw new Exception(\"\
  Invalid Index\");\n    }\n    Node temp = start;\n    for (int i = 0; i < idx; i++)\
  \ {\n      temp = temp.next;\n    }\n    return temp;\n  }\n}\n\n// 类\nimport java.util.Scanner;\n\
  public class CLLClient {\n  public static void main(String[] args) {\n    Scanner\
  \ scn = new Scanner(System.in);\n    CircularLinkedList list = new CircularLinkedList();\n\
  \    boolean flag = true;\n    try {\n      while (flag) {\n        System.out.println(\"\
  \\n ***MENU***\");\n        System.out.println(\"1. Insertion\");\n        System.out.println(\"\
  2. Deletion\");\n        System.out.println(\"3. Display\");\n        System.out.println(\"\
  4. Exit\");\n        System.out.println(\"Enter your choice: \");\n        int choice\
  \ = scn.nextInt();\n        int item = 0, pos = 0;\n        switch (choice) {\n\
  \          case 1:\n            System.out.println(\"Enter value of node: \");\n\
  \            item = scn.nextInt();\n            System.out.println(\"Enter position\
  \ of node:\");\n            pos = scn.nextInt();\n            list.insertion(item,\
  \ pos - 1);\n            System.out.println(item + \" inserted successfully at \"\
  \ + pos);\n            break;\n          case 2:\n            System.out.println(\"\
  Enter position of node:\");\n            pos = scn.nextInt();\n            list.deletion(pos\
  \ - 1);\n            System.out.println(\"Item deleted successfully\");\n      \
  \      break;\n          case 3:\n            list.display();\n            break;\n\
  \          case 4:\n            flag = false;\n            System.out.println(\"\
  Terminated.....\");\n            break;\n          default:\n            System.out.println(\"\
  Wrong choice\");\n            break;\n        }\n      }\n    } catch (Exception\
  \ e) {\n      System.out.println(e.getMessage());\n    }\n  }\n}\n```\n\n程序的输出显示所示：\n\
  \n![image](img/148-01.jpg)\n\n![image](img/148-02.jpg)\n\n\n\n\n从上一个例子中可以清楚地看到如何在已存在的双向链表中插入新节点。现在让我们来理解它的算法：\n\
  \n**在双向链表头部插入新节点的算法**\n\n**Step 1:** START\n**Step 2:** IF `NEW NODE` = `NULL` Print\
  \ `OVERFLOW` [End of If]\n**Step 3:** Set `NEW NODE.INFO = VALUE`\n**Step 4:** Set\
  \ `NEW NODE.PREV = NULL`\n**Step 5:** Set `NEW NODE.NEXT = START`\n**Step 7:** Set\
  \ `START.PREV = NEW NODE`\n**Step 8:** Set `START = NEW NODE`\n**Step 9:** EXIT\n\
  \n**2. 在双向链表的末尾插入新节点**\n\n在向链表末尾插入新节点的情况下，我们首先会检查溢出条件，即是否有足够的内存用于新节点。如果内存不可用，则打印溢出信息；否则，则为新节点分配内存。然后创建一个\
  \ `NODE` 变量，它初始指向 `START`，并使用该 `NODE` 变量遍历链表直到到达最后一个节点。当到达最后一个节点时，最后一个节点的 `NEXT`\
  \ 部分将存储新节点的地址，而 `NEW NODE` 的 `NEXT` 部分将包含 `NULL`，这表示链表的结束。`NEW NODE` 的 `PREV` 部分将存储由\
  \ `NODE` 变量所指向的节点地址。让我们通过算法来理解它：\n\n**在链表末尾插入新节点的算法**\n\n**Step 1:** START\n**Step\
  \ 2:** IF `NODE` = `NULL` Print `OVERFLOW` [End of If]\n**Step 3:** Set `NEW NODE.INFO\
  \ = VALUE`\n**Step 4:** Set `NEW NODE.NEXT = NULL`\n**Step 5:** Set `NEW NODE.NEXT\
  \ = NULL`\n**Step 6:** Set `TEMP = START`\n**Step 8:** Repeat while `TEMP.NEXT !=\
  \ NULL` Set `TEMP = TEMP.NEXT` [End of Loop]\n**Step 9:** Set `TEMP.NEXT = NEW NODE`\n\
  **Step 10:** Set `NEW NODE.PREV = TEMP`\n**Step 11:** EXIT\n\n通过上一个算法我们理解了如何在双向链表的末尾插入新节点。现在，我们将通过一个示例来进一步研究。考虑如下所示具有四个节点的链表；新节点将插入到双向链表的末尾：\n\
