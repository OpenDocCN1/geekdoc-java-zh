  \ 16 和 30，会发生多少冲突？\n    (a) 1\n    (b) 2\n    (c) 3\n    (d) 4\n9. ________ 是将键映射到哈希表中适当位置的过程。\n\
  \    (a) 探测\n    (b) 哈希\n    (c) 冲突\n    (d) 寻址\n\n\n\n\n\n1. **文件创建 (File Creation)**：如果文件尚未创建，这是对文件执行的第一项操作。通过指定名称和模式来创建文件。通过写入模式打开文件，并将记录插入到文件中。一旦所有记录都插入到文件中，该文件就可以用于未来的读写操作。例如，我们创建一个名为\
  \ `EMPLOYEE` 的新文件。\n\n(a) **更新文件 (Updating a File)**：意味着更改文件的内容。通常通过以下方式实现：\n\n\
  (b) **向文件中插入 (Inserting into a File)**：将新记录插入文件中。例如，如果有一个新员工加入组织，其/她的记录将被插入到 `EMPLOYEE`\
  \ 文件。\n\n(c) **修改文件 (Modifying a File)**：修改文件中现有记录。例如，如果员工的地址发生变化，则必须在 `EMPLOYEE`\
  \ 文件中修改新地址。\n\n(d) **从文件中删除 (Deleting from a File)**：从文件中删除现有记录。例如，如果某个员工离职，其/她的记录将从\
  \ `EMPLOYEE` 文件中删除。\n\n2. **从文件中检索 (Retrieving from a File)**：指的是从文件中提取某些有用数据的过程。通常通过以下方式实现：\n\
  \n(a) **查询 (Enquiring)**：从文件中检索少量数据。\n\n(b) **生成报告 (Generating a Report)**：从文件中检索大量数据。\n\
  \n![image](img/11.1.jpg)\n\n图 11.1。\n\n文件上的操作。\n\n## 11.4 文件分类 (File Classification)\n\
  \n文件被分为两类，如下：\n\n1. **文本文件 (Text Files)**：文本文件，通常称为扁平文件（flat file），是使用其相应的 `ASCII`\
  \ 值存储所有数值或非数值数据的文件。数据可以是字母、数字或特殊符号的字符串。因此，它也被 `ASCII` 文件。通常，文本文件有一个被称为“文件结束标记”的特殊标记，表示文件的结束。\n\
  \n2. **二进制文件 (Binary Files)**：二进制文件是包含 1 和 0 的二进制形式所有数据的文件。它以与主内存相同的形式存储数据。因此，人类无法读取二进制文件。二进制文件由计算机程序读取，由程序将二进制文件解码为有意义的内容。数据在二进制文件中被高效地存储。\n\
  \n## 11.5 C vs C++ vs Java 文件处理\n\n文件处理是一个重要的过程，无论使用哪种语言，都必须意识到文件处理过程。但当涉及到 C、C++\
  \ 和 Java 文件处理时，理解文件上的操作和过程会变得有点困难，因为这些语言拥有许多相似的函数/操作符。因此，在处理文件时有一些需要记住的要点，讨论如下：\n\
  \n| C | C++ | Java |\n| --- | --- | --- |\n| 在 C 中，直接调用 `fopen`、`fclose`、`fwrite`、`fread`、`fseek`、`fprint`、`fscanf`\
  \ 以及其他函数，不需要对象。 | 在 C++ 中，通过对象的帮助调用 `open`、`close` 和其他函数，例如 `fstream f`。在这里，`f`\
  \ 是流类的对象，所有函数将通过像 `f.open`、`f.close`、`f.read`、`f.write` 等对象来调用。 | 在 Java 中，导入包 `java.io`\
  \ 并创建类 `File`、`FileReader` 或 `FileWriter` 的类的对象。类对象通过对象访问类的内置构造函数和/或方法。 |\n| 在 C\
  \ 中，模式为 `r`（读）、`w`（写）和 `a`（追加），这些可以直接使用。 | 在 C++ 中，模式为 `in`、`out`、`bin` 等，这些通过作用域解析运算符（如\
  \ `ios::in`、`ios::out` 等）的帮助使用。 | Java 使用 `Stream`（流）的概念，即数据序列。 |\n\n## 11.6 文件组织\
  \ (File Organization)\n\n文件组织是指记录在存储设备上的物理排列方式。此外，它可能与单个键或多个键相关。因此，根据其物理存储和用于访问记录的键，文件被分为顺序文件、相对文件、索引顺序文件和倒排文件。在选择特定的文件组织类型时，应该考虑各种因素，包括：\n\
  \n1. 记录检索的易用性。\n2. 存储经济性。\n3. 可靠性，即文件组织是否可靠。\n4. 安全性，即文件组织是否安全。\n\n现在，我们将讨论一些常用于文件组织的技术。\n\
  \n## 11.7 顺序文件组织 (Sequence File Organization)\n\n顺序文件组织是组织文件中一组记录的最基本方法。顺序文件组织是指在创建文件时，记录按顺序一个接一个写入，并且当文件用于输入时，只能按照写入的顺序进行访问。所有记录都从\
  \ 0 开始编号。因此，如果文件中有 `N` 条记录，那么第一条记录编号为 0，最后一条编号为 `N-1`。在某些情况下，顺序文件的记录按每个记录中某些字段的值进行排序。用于对记录排序的字段被称为排序键（sort\
  \ key）。如果文件按排序键排序，那么当记录 `i` 的键字段值小于或等于记录 `j` 的键字段值时，记录 `i` 排在记录 `j` 之前。文件也可以按一个或多个字段的排序键升序或降序排列。由于顺序文件只能按顺序访问，这些文件在批处理中比在交互处理中更常用。例如，顺序文件用于生成按姓名排序的电话黄页。\n\
  \n![image](img/11.2.jpg)\n\n图 11.2。\n\n顺序文件组织的结构。\n\n**顺序组织的优点**\n1. 易于处理。\n2. 不涉及额外开销。\n\
  3. 在这种组织中记录可以具有不同长度。\n4. 它可以存储在磁磁盘和磁带上。\n\n**顺序组织的缺点**\n1. 记录只能按顺序访问。\n2. 不支持文件之间的更新操作。\n\
  3. 不支持交互式应用程序。\n\n## 11.8 索引顺序文件组织 (Indexed Sequential File Organization)\n\n索引顺序文件组织是在需要按键值进行顺序访问以及按相同键值进行单独访问时的一种高效记录组织方式。它提供了顺序文件或相对文件支持的访问类型组合。索引被结构化为二叉搜索树。该索引用于请求访问特定记录，而顺序数据文件本身用于支持对整个集合的顺序访问。由于其支持顺序和直接访问的能力，索引顺序文件组织用于支持同时需要批处理和交互处理的应用。\n\
  \n**索引顺序组织的优点**\n1. 记录可以顺序和随机访问。\n2. 支持批处理以及交互式应用程序。\n3. 支持文件中记录之间的更新操作。\n\n**索引顺序文件组织的缺点**\n\
  1. 在这种组织中，文件只能存储在磁磁盘上。\n2. 在维护方面涉及额外开销。\n3. 记录只能是固定长度，因为我们像维护链表一样维护每个节点的结构。\n\n\
  ![image](img/11.3.jpg)\n\n图 11.3。\n\n使用二叉搜索树和顺序文件提供索引顺序访问。\n\n## 11.9 相对文件组织 (Relative\
  \ File Organization)\n\n\n\n\n\n相对文件组织提供了一种直接访问单个记录的有效方法。在相对文件组织中，键与记录在文件中的位置之间存在一种可预测的关系。记录并不一定按照其键的顺序在物理上出现。那么，如何找到给定的记录呢？将指定一种用于在键值与物理地址之间进行转换的关系，例如\
  \ `R(Key value -> address)`。当要把一个记录写入相对文件时，使用映射函数 `R` 将记录的键转换为地址，该地址指示了记录要存储的位置。用于映射函数\
  \ `R` 的基本技术是目录查找和地址计算（哈希）。\n\n*   **目录查找技术：** 这是实现映射函数 `R` 最简单的技术。该技术的基本思想是维护一个“键值：地址”对的目录。要在相对文件中找到某条记录，首先在目录中定位其键值，然后使用指示的地址在存储设备上找到该记录。目录可以以二叉搜索树的形式进行组织。\n\
  *   **地址计算技术：** 实现映射函数 `R` 的另一种常用技术是对键值进行计算（哈希），使得结果为相对地址。\n\n### 相对文件组织的优点\n\n\
  1.  记录可以按非顺序访问。\n2.  它非常适合交互式应用程序。\n3.  它支持文件之间的更新操作。\n\n### 相对文件组织的缺点\n\n1.  它只能存储在磁磁盘上。\n\
  2.  它还涉及维护索引形式的额外开销。\n\n## 11.10 倒排文件组织\n\n提供索引与文件之间链接的一种基本方法称为倒排（inversion）。键的倒排索引包含该键在文件记录中所拥的所有值。倒排索引中的每个键值条目都指向所有具有相应值的数据记录。那么，该文件在该键上就是倒排的。提供多键访问的倒排方法已成为商用关系型\
  \ DBMS（如 `Oracle`、`DB2` 等）中物理数据结构的基础。这些系统设计用于通过设计者感兴趣的尽可能多的倒排键来快速访问记录。它们拥有用户友好、类自然语言的查询语言来帮助用户制定查询。一个完整的倒排文件对每个数据字段都有倒排索引。如果一个文件没有完全倒排，但至少有一个倒排索引，则被称为部分倒排文件。\n\
  \n### 倒排文件组织的优点\n\n1.  布尔查询对于每条满足查询的记录只需要一次访问，外加上一些处理索引的访问。\n2.  记录可以以任何方式存储，例如按主键顺序排序、按主键随机链接顺序排序等。\n\
  3.  与其它文件结构相比，它还能节省空间。\n\n### 倒排文件组织的缺点\n\n由于索引条目是变长的，索引的维护变得更加复杂。\n\n## 11.11 总结\n\
  \n*   文件是记录的集合。它通常存储在次级存储设备上。\n*   数据在文件中按层次结构组织。这种层次结构包括记录、字段等项。\n*   如果文件尚未创建，则文件创建是对文件执行的首要操作。通过指定其名称和模式来创建文件。\n\
  *   文件分为两类：文本文件和二进制文件。\n*   文本文件（通常称为扁平文件，flat file）是使用其相应的 `ASCII` 值存储所有数值或非数值数据的文件。数据可以是字母、数字或特殊符号的字符串。\n\
  *   二进制文件是以 1 和 0 的二进制形式包含所有数据的文件。它以与主内存相同的形式存储数据。\n*   文件组织是指记录在存储设备上的组织方式。顺序文件组织是按键值顺序排列的记录集合。\n\
  \n## 11.12 练习\n\n### 11.12.1 复习题\n\n1.  什么是文件？\n2.  为什么需要以这种方式存储数据？\n3.  你了解记录和字段吗？\n\
  4.  讨论对文件执行的各种操作。\n5.  区分文本文件和二进制文件。\n6.  关于属性写一个简短。\n7.  你了解文件组织吗？讨论。\n8.  解释顺序文件组织。\n\
  9.  什么是倒排文件？讨论。\n10. 解释索引顺序文件组织。\n11. 索引顺序文件组织的优缺点。\n12. 什么是相对文件组织？讨论其优缺点。\n\n###\
  \ 11.12.2 单选题\n\n1.  相关字段的集合被称为：\n    (a) 数据\n    (b) 记录\n    (c) 字段\n    (d) 文件\n\
  2.  标记为只读的文件不能被修改或删除。\n    (a) 隐藏\n    (b) 只读\n    (c) 归档\n    (d) 以上均非\n3.  哪一个通常被称为扁平文件？\n\
  \    (a) 二进制文件\n    (b) 文本文件\n    (c) 字符串文件\n    (d) 以上均非\n4.  ________ 是以某种方式组织的、便于更新、检索等操作的数据集合。\n\
  \    (a) 记录\n    (b) 数据字\n    (c) 字段\n    (d) 文件\n5.  相对文件可以用于随机访问也可以用于顺序访问吗？\n\
  \    (a) 对\n    (b) 错\n    (c) 无法判断\n6.  标记为隐藏的文件不在目录中显示。\n    (a) 只读\n    (b) 归档\n\
  \    (c) 隐藏\n    (d) 以上均非\n7.  数据字段的特征是：\n    (a) 类型\n    (b) 大小\n    (c) 模式\n \
  \   (d) (a) 和 (b)\n8.  _______ 用于存储文件的集合。\n    (a) 记录\n    (b) 字典\n    (c) 目录\n\
  \    (d) 系统\n\n\n\n到目前，我们已经学习了各种类型的线性数据结构，它们被广泛应用于各种场景。但到目前为止我们学习过的唯一非线性数据结构是树。在树中，我们讨论了父子关系，即一个父节点可以有多个孩子。但在图中，这种父子关系的限制较少，也就是说，可以存在任何复杂的关系。因此，树可以泛化为一种特殊的图。因此，图是一种具有广泛现实应用的非线性数据结构。图是由若干顶点（节点）和连接这些顶点的边组成的。图\
  \ 12.1 展示了一个图。\n\n![image](img/12.1.jpg)\n\n图 12.1。\n\n图。\n\n因此，图 `G` 可以定义为顶点和边的有序集合\
  \ `(V, E)`，其中 `V(G)` 代表顶点集合，`E(G)` 代表连接这些顶点的边集合。在之前的图中，`V(G) = {A, B, C, D, P, Q}`\
  \ 代表顶点集，而 `E(G) = {(A, B), (B, D), (D, C), (C, A), (C, Q), (Q, D), (A, P), (P, C)}`\
  \ 代表边集。\n\n## 实际应用\n\n图的一个简单说明是，当我们在社交媒体（例如 Facebook）上与朋友建立联系时，每个用户都是一个顶点，两个用户之间相互连接就形成了一条边。\n\
  \n图有两种类型：\n\n1. **无向图（Undirected Graph）：** 在无向图中，边没有与其关联的任何方向。如图所示，节点 `A` 和 `B`\
  \ 可以沿着两个方向进行遍历，即既可以从 `A` 到 `B`，也可以从 `B` 到 `A`。因此，无向图不提供任何关于方向的信息。\n\n   ![image](img/12.2.jpg)\n\
  \n   图 12.2。\n\n   无向图。\n\n2. **有向图（Directed Graph）：** 在有向图中，边具有与其关联的方向。如图所示，节点\
  \ `A` 和 `B` 只能沿着一个方向进行遍历，即只能从 `A` 到 `B`，而不能从 `B` 到 `A`。因此，在边 `(A, B)` 中，节点 `A` 被称为起始节点，节点\
  \ `B` 被称为终点节点。\n\n   ![image](img/12.3.jpg)\n\n   图 12.3。\n\n   有向图。\n\n## 12.2\
  \ 定义\n\n* **顶点/节点度（Degree of a vertex/node）：** 节点的度是与该特定节点的边总数。在这里，节点 `B` 的度为三，因为有三条边与节点\
  \ `B` 相连。\n\n   ![image](img/12.4.jpg)\n\n   图 12.4。\n\n   显示节点 `B` 度的图。\n\n* **入度（In-degree\
  \ of a node）：** 节点的入度等于到达该特定节点的边数。\n\n* **出度（Out-degree of a node）：** 出度等于离开该特定节点的边数。\n\
  \n   ![image](img/12.5.jpg)\n\n   图 12.5。\n\n   显示节点 `C` 入、出度的图。\n\n* **孤立节点/顶点（Isolated\
  \ Node/Vertex）：** 具有零条边的节点被称为孤立节点。此类节点的度为零。\n\n   ![image](img/12.6.jpg)\n\n   图\
  \ 12.6。\n\n   两个孤立节点 `X` 和 `Y`。\n\n* **悬挂节点/顶点（Pendant Node/Vertex）：** 具有一条边的节点被称为悬挂节点。此类节点的度为一。\n\
  \n   ![image](img/12.7.jpg)\n\n   图 12.7。\n\n   两个悬挂节点 `X` 和 `Y`。\n\n* **相邻节点（Adjacent\
  \ Nodes）：** 对于每一个连接节点 `A` 和 `B` 的边 `e = (A, B)`，节点 `A` 和 `B` 称为相邻节点。\n\n* **平行边（Parallel\
  \ Edges）：** 如果同一对节点之间存在多条边，那么它们被称为平行边。\n\n   ![image](img/12.8.jpg)\n\n   图 12.8。\n\
  \n   `A` 和 `B` 之间的平行边。\n\n* **自环（Loop）：** 如果一条边的起点和终点是同一个节点，即 `e = (A, A)`，则它被称为自环。\n\
  \n   ![image](img/12.9.jpg)\n\n   图 12.9。\n\n   一个自环。\n\n* **简单图（Simple Graph）：**\
  \ 如果图 `G(V, E)` 不包含任何自环或平行边，则被称为被称为简单图。\n\n* **完全图（Complete Graph）：** 图 `G(V, E)`\
  \ 且且仅当图中的每个节点都与其他节点连接，且任何节点上都没有自环时，才被称为完全图。\n\n   ![image](img/12.10.jpg)\n\n  \
  \ 图 12.10。\n\n   完全图。\n\n* **正则图（Regular Graph）：** 正则图是指每个节点的度相同的图。如果每个节点的度都是 `r`，则该图称为度为\
  \ `r` 的正则图。在给出的图中，所有节点的度相同，即为 2；因此，它被称为 2-正则图。\n\n   ![image](img/12.11.jpg)\n\n\
  \   图 12.11。\n\n   2-正则图。\n\n* **多图（Multi-graph）：** 如果图 `G(V, E)` 包含自环、平行边或两者兼有，则被称为多图。\n\
  \n   ![image](img/12.12.jpg)\n\n   图 12.12。\n\n   多图。\n\n* **环（Cycle）：** 它是一个包含一条或多条边的路径，从特定节点开始并终止于同一个节点。\n\
  \n* **环图（Cyclic Graph）：** 包含环图被称为环图。\n\n* **无环图（Acyclic Graph）：** 不包含任何环图被称为无环图。\n\
  \n* **连通图（Connected Graph）：** 如果从图中任何节点到图中另一个节点都存在路径，使得对于每一对不同的节点都必须存在路径，则图 `G(V,\
  \ E)` 称为连通图。\n\n   ![image](img/12.13.jpg)\n\n   图 12.13。\n\n   连通图。\n\n* **强连通图（Strongly\
  \ Connected Graph）：** 如果有向图中从每个节点到每个其他节点都有路径，则被称为强连通图。\n\n* **图的大小（Size of a Graph）：**\
  \ 图的大小等于图中存在的边总数。\n\n* **加权图（Weighted Graph）：** 如果图 `G(V, E)` 中的所有边都分配了数据，则被称为加权图。\n\
  \n## 12.3 图的表示\n\n图可以在计算机内存中通过以下方式表示：\n\n1. 使用邻接矩阵的顺序表示法\n2. 使用邻接链的链表示法\n\n现在，让我们详细讨论这两种。\n\
  \n### 12.3.1 邻接表示\n\n邻接矩阵用于表示节点之间的信息。只有当两个节点之间存在边时，这两个节点才是相邻的。对于具有 `n` 个节点的图，邻接矩阵的维度为\
  \ `(n x n)`。设图 `G(V, E)` 有顶点 `V = {V[1], V[2], V[3]...V[n]}`，那么邻接矩阵表示 `(n x n)`\
  \ 如下：\n\n![image](img/12.14.jpg)\n\n邻接矩阵也被称为位矩阵或布尔矩阵，因为它只包含 0 和 1。现在，让我们通过例子更清楚地讨论并理解它。\n\
