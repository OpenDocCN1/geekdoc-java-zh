  \ `/ 2 a c * + b 10 *`\n**(c)** `2 b – a 10 + * c 8 * /`\n**(d)** `10 a + * 2 b\
  \ - / c 8 *`\n\n# 第 8 章：树\n\n## 8.1 引言\n\n在之前的章节中，我们学习了各种数据结构，如数组、链表、栈和队列。所有这些数据结构都是线性数据结构。虽然线性数据结构具有灵活性，但要用它们将数据组织成层次表示是非常困难的。因此，为了克服这个问题或局限性，我们创建了一种名为“树”的新数据结构。树被定义为一个或多个节点组成的集合，它允许我们建立父子关系。在树中，一个节点被指定为根节点或父节点，所有其余节点可以被划分为非空集合，每个集合都是根的一个子树。与自然树不同，树数据结构是倒置的，根在顶部，叶子在底部。此外，根节点没有父节点。根节点只能有子节点。相反，叶节点或叶子是指没有节点的节点。当树中没有节点时，树被称为空树（null\
  \ tree）。树广泛应用于各种日常应用中。此外，树的递归编程使得程序经过优化且易于理解。树也用于表示数学公式的结构。图 8.1](#ch08.xhtml_fig8.1)\
  \ 表示了一棵树。在下面的树中，A 是树的根节点。X、Y 和 Z 是根节点 A 的子节点。它们也形成了树的子树。此外，B、C、Y、D 和 E 是树的叶节点，因为它们没有孩子。\n\
  \n![image](img/8.1.jpg)\n\n图 8.1. 一棵树。\n\n### 实际应用\n\n1. 家庭成员可以可视化为一棵树，其中根节点可以可视化为祖父。他的两个孩子可以可视化为子节点。孙子们则形成了树的子树。\n\
  2. 树用于数据库系统中组织信息，并用于表示编译器中源程序的语法结构。\n\n## 8.2 定义\n\n* **节点**：节点是树数据结构的主要组件。它存储数据以及指向其他节点的链接。\n\
  \n![image](img/8.2.jpg)\n\n图 8.2. 节点的结构。\n\n* **根**：根是树顶部的节点。它没有父节点。如果根为空，则树为空。\n\
  * **父节点**：父节点是节点的先驱。在图中，X 是 Y 的父节点。\n* **子节点**：子节点是节点的后继节点。位于左侧的是左孩子，同样，位于右侧的是右孩子。\n\
  * **叶节点**：没有孩子的节点。\n* **子树**：B、X 和 Y 根的左子树。同样，C 和 Z 是 A 的右子树。\n* **路径**：从给定源到达目的地所需的连续边的唯一序列。从根节点\
  \ A 到 Y 的路径为 A-B-Y。\n* **深度**：树中的每个节点都分配了一个深度。根位于深度 0，根的孩子位于深度 1，依此类推。\n* **高度**：树的高度是节点的最大深度加\
  \ 1。包含单个节点的树的高度为 1。同样，空树的高度为 0。\n* **祖先节点**：节点的祖先是根到目的地路径上的任何先驱节点。根节点没有祖先。A 和 B\
  \ 是 X 的祖先。\n* **后代节点**：节点的后代是给定源到叶节点路径上的任何后继节点。叶节点没有后代。这里，B、X 和 Y 是节点 A 的后代。\n*\
  \ **兄弟节点**：给定父节点的子节点被称为兄弟节点。在图 8.8 中，X 和 Y 是 B 的兄弟。\n\n## 8.3 **二叉树**\n\n\n\n\n\n\
  二叉树是节点集合，每个节点包含三个部分，即左子节点地址、右子节点地址和数据项。左子节点地址存储左子树根节点的内存位置，右子节点地址存储右子树根节点的内存位置。二叉树最顶部的元素被称为根节点。根节点存储根节点的内存位置。正如其名所示，二叉树最多有两个孩子，也就是说一个父节点可以有零个、一个或最多两个孩子。此外，如果\
  \ `root = NULL`，则意味着树是空的。图 8.9 表示了一个二叉树。\n\n在接下来的图中，A 代表树的根节点。B 和 C 是根节点 A 的孩子。节点\
  \ B、D、E、F 和 G 构成了左子树。同样，节点 C、H、I 和 J 构成了右子树。现在，节点 G、E、F、I 和 J 是二叉树的终端节点/叶子节点，因为它们没有孩子。因此，节点\
  \ A 有两个后继 B 和 C。节点 B 有两个后继 D 和 G。同样，节点 D 也有两个后继 E 和 F。节点 G 没有后继。节点 C 只有一个后继 H。节点\
  \ H 有两个后继 I 和 J。由于节点 E、F、G、I 和 J 没有后继，它们被认为具有空子树。\n\n![image](img/8.9.jpg)\n\n图\
  \ 8.9。\n\n二叉树。\n\n### 8.3.1 二叉树的类型\n\n二叉树有两种类型：\n\n1. **完全二叉树（Complete Binary Trees）：**\
  \ 完全二叉树是一种满足以下两个属性的二叉树：\n\n    (a) 首先，完全二叉树中除最后一层外，每一层都必须完全满。\n    (b) 第二地，完全二叉树中的所有节点尽可能向左出现出现。\n\
  \n    在完全二叉树中，第 `n` 层的节点数量为 `2^n` 个。此外，深度为 `d` 的完全二叉树的节点总数等于 0 到 `d` 之间每层节点数之和。\n\
  \n    ![image](img/8.10.jpg)\n\n    图 8.10。\n\n    完全二叉树。\n\n2. **扩展二叉树（Extended\
  \ Binary Trees）：** 扩展二叉树也被称为 2T 树。一个二叉树被认为是扩展二叉树，当且仅当树中的每个节点要么没有零孩子，要么有两个孩子。在扩展二叉树中，拥有两个孩子的节点被称为内部节点。相反，没有种子的节点被称为外部节点。在接下来的图中，内部节点用\
  \ `I` 表示，外部节点用 `E` 表示。\n\n    ![image](img/8.11.jpg)\n\n    图 8.11。\n\n    扩展二叉树。\n\
  \n### 8.3.2 二叉树的内存表示\n\n二叉树可以用以下任一种方式在计算机内存中表示：\n\n1. 二叉树的数组表示\n2. 二叉树的链表表示\n\n\
  现在，让我们详细讨论一下这两种方式。\n\n#### 二叉树的数组表示\n\n二叉树使用计算机内存中的数组来表示。它也被称为顺序表示。二叉树的顺序表示是使用一维（1-D）数组完成的。这种表示法是静态的，因此效率低下，因为必须预先知道大小，从而需要大量的内存空间。使用以下规则来决定内存中每个节点的位置：\n\
  \n(a) 树的根节点存储在第一个位置。\n(b) 如果父节点位于位置 `k`，则左孩子存储在位置 `2k`，右孩子存储在位置 `(2k + 1)`。\n  \
  \  (c) 数组的最大大小为 `2^h - 1`，其中 `h` 是树的高度。\n\n**例如：** 二叉树如下所示。数组表示在内存中。\n\n![image](img/8.12.jpg)\n\
  \n![image](img/30.jpg)\n\n图 12。\n\n二叉树及其数组表示。\n\n#### 二叉树的链表表示\n\n二叉树也可以使用链表在计算机内存中表示。这种表示法是动态的，因为在需要时动态分配内存，从而避免了内存的浪费。在链表表示中，每个节点有三个部分：\n\
  \n1. 第一部分是左孩子，包含左子树的地址。\n2. 第二部分是数据部分，包含节点的信息。\n3. 第三部分是右孩子，包含右子树的地址。\n\n节点的类定义如下：\n\
  \n```java\nprivate class Node {\n    int data;\n    Node left;\n    Node right;\n\
  }\n```\n\n当节点没有孩子时，相应的字段为 `NULL`。\n\n**例如：** 二叉树如下所示。链表表示在内存中。\n\n![image](img/8.13.jpg)\n\
  \n图 13。\n\n二叉树及其链表表示。\n\n## 8.4 二叉搜索树\n\n二叉搜索树（BST）是二叉树的一种变。二叉搜索树的特殊属性是左子树中的所有节点都小于根节点。同样，右子树中的所有节点都大于根节点。因此，二叉搜索树被称为有序二叉树，因为二叉搜索树中的所有节点都是有序的。此外，左右子树也是二叉搜索树，因此相同的属性适用于每个子树。图\
  \ 8.14 表示了一个二叉搜索树，其中所有的键都是有序的。\n\n![image](img/8.14.jpg)\n\n图 14。\n\n二叉搜索树。\n\n\
  在之前的图中，根节点是 `50`。根的左子树由节点 19、7、32、25 和 43 组成。我们可以看到这些节点的值都比根节点小，因此构成了左子树。同样，根节点的右子树由节点\
  \ 75、87、80 和 99 组成。在这里我们同样看到所有这些节点的值都比根节点大，因此构成了右子树。\n\n### 8.4.1 二叉搜索树的操作\n\n在本节中，我们将讨论在二叉搜索树上进行的各种操作，包括：\n\
  \n* 在二叉搜索树中查找节点/键\n* 在二叉搜索树中插入节点/键\n* 从二叉搜索树中删除节点/键\n* 删除整个二叉搜索树\n* 查找二叉搜索树的镜像\n\
  * 查找二叉搜索树中最小节点\n* 查找二叉搜索树中最大的节点\n* 确定二叉搜索树的高度\n\n现在，让我们详细讨论所有这些操作。\n\n\n\n\n\n#\
  \ 1. 在二叉搜索树中查找节点/键\n\n搜索操作是二叉搜索树中执行的最常见操作之一。该操作用于查找给定的键是否存在于树中。搜索从根节点开始。首先，它会检查树是否为空。如果树为空，则说明我们要查找的节点/键不在树中，算法在此时终止并显示相应的消息。如果树不为空且树中存在节点，则搜索函数将检查要查找的节点/值，并将其与当前节点的键值进行比较。如果要查找的节点/键小于当前节点的键值，那么在这种情况下，我们将递归地调用左子节点。相反，如果要查找的节点/键大于当前节点的键值，我们将递归地调用右子节点。现在，让我们来看在二叉搜索树中查找键的算法。\n\
  \n## 在二叉搜索树中查找节点/键的算法\n\n```\nSEARCH(ROOT, VALUE)\nStep 1: START\nStep 2: IF(ROOT\
  \ == NULL)\n            Return NULL\n            Print \"Empty Tree\"\n        ELSE\
  \ IF(ROOT.INFO == VALUE)\n            Return ROOT\n        ELSE IF(ROOT.INFO > VALUE)\n\
  \            SEARCH(ROOT.LCHILD, VALUE)\n        ELSE IF(ROOT.INFO < VALUE)\n  \
  \          SEARCH(ROOT.RCHILD, VALUE)\n        ELSE\n            Print \"Value not\
  \ found\"\n        [End of IF]\n      [End of IF]\n  [End of IF] [End of IF]\nStep\
  \ 3: END\n```\n\n在上述算法中，我们首先检查树是否为空。如果树为空，则我们返回 `NULL`。如果树不为空，我们则检查当前节点（`ROOT`）中存储的值是否等于我们要查找的节点/键。如果\
  \ `ROOT` 节点的值等于要查找的键值，则我们返回树的当前节点，即 `ROOT`节点。否则，如果要查找的键值小于当前节点存储的值，我们递归地调用左子树。如果要查找的键值大于当前节点存储的值，则我们递归地调用右子树。最后，如果未找到该值，则会在屏幕上打印一条相应的消息。\n\
  \n**例如：** 我们被给出一个二叉搜索树。现在，在二叉搜索树中查找值为 20 的节点。\n\n最初，给出的二叉搜索树如下：\n\n![image](img/8.15a.jpg)\n\
  图 8.15(a)\n\n**步骤 1：** 首先，检查根节点，即 41。\n\n![image](img/8.15b.jpg)\n图 8.15(b)\n\n\
  **步骤 2：** 第二，由于根节点中存储的值不等于我们要查找的值，但我们知道 20 < 41，因此我们将遍历左子树。\n\n![image](img/8.15c.jpg)\n\
  图 8.15(c)\n\n**步骤 3：** 我们知道 10 不是要查找的值，但 20 > 10；因此，我们现在针对 10 遍历右子树。\n\n![image](img/8.15d.jpg)\n\
  图 8.15(d)\n\n**步骤 4：** 再次 25 不是要查找的值，但 20 < 25；因此我们现在针对 25 遍历左子树。\n\n![image](img/8.15e.jpg)\n\
  图 8.15.\n在二叉搜索树中查找值为 20 的节点。\n\n最后，在二叉搜索树中成功找到了值为 20 的节点。\n\n# 2. 在二叉搜索树中插入节点/键\n\
  \n插入操作用于在二叉搜索树中插入一个具有给定值的新节点。新节点将按照二叉搜索树的约束插入在正确的位置。它不应违反二叉搜索树的属性。插入操作同样从根节点开始。首先，它会检查树是否为空。如果树为空，我们将为新节点分配内存。如果树不为空，我们将待插入的键值与存储在当前节点中的的值进行比较。如果要插入的节点/键小于当前节点的键值，则将新节点插入左子树。相反，如果要插入的节点/键大于当前节点的键值，则将新节点插入右子树。现在，让我们讨论在二叉搜索树中插入节点的算法。\n\
  \n## 在二叉搜索树中插入节点/键的算法\n\n```\nINSERT(ROOT, VALUE)\nStep 1: START\nStep 2: IF(ROOT\
  \ == NULL)\n            Allocate memory for ROOT\n            Set ROOT.INFO = VALUE\n\
  \            Set ROOT.LCHILD = ROOT.RCHILD = NULL\n        [End of IF]\nStep 3:\
  \ IF(ROOT.INFO < VALUE)\n            INSERT(ROOT.LCHILD, VALUE)\n        ELSE\n\
  \            INSERT(ROOT.RCHILD, VALUE)\n        [End of IF]\nStep 4: END\n```\n\
  \n在上述算法中，我们首先检查树是否为空。如果树为空，我们将为 `ROOT` 分配内存。如果树不为空，我们将待插入的键值与当前节点存储的键值进行比较（*注：此处原文逻辑似乎与代码描述相反，代码中\
  \ `ROOT.INFO < VALUE` 时调用 `LCHILD`，此处按代码描述逻辑翻译*）。如果待插入的键值小于当前节点存储的值，则我们递归地调用左子树。否则，我们将递归地调用右子树。对于\
  \ `ROOT`。\n\n**例如：** 我们被给出一个二叉搜索树。现在，在二叉搜索树中插入一个值为 7 的新节点。\n\n最初，给出的二叉搜索树如下：\n\n\
  首先，我们检查树是否为空。如果为空，我们将分配内存。如果树不为空，我们将待插入的键值与当前节点存储的值进行比较。如果待插入的键值小于当前节点存储的值，则我们递归地调用左子树。否则，我们将右子树。`ROOT`。\n\
  \n# 3. 从二叉搜索树中删除节点/键\n\n从二叉搜索树中删除节点/键是最关键的过程。在执行删除操作时必须小心；删除节点时，我们必须确保不违反二叉搜索树的属性，以免在此过程中丢失必要的节点。删除操作分为以下三种：\n\
  \n## 情况 1：删除没有子节点的节点\n\n这是最简单的删除情况，因为可以直接移除或删除没有子节点的节点。查看图 8.17 所示的二叉搜索树，看看在这种情况下是如何删除的。\n\
  \n**例如：** 我们被给出一个二叉搜索树。现在，从二叉搜索树中删除值为 61 的节点。\n\n首先，我们检查根节点。由于根节点不为空，我们将开始删除操作。\n\
  \n第二，由于根节点存在，我们将待删除的值与当前节点存储的值进行比较。由于 61 > 24，我们将递归地遍历右子树。\n\n第三，再次，我们知道 61 > 42，我们将递归地遍历右子树。\n\
  \n最后，值为 61 的节点从二叉搜索树中被删除。\n\n## 情况 2：删除有一个子节点的节点\n\n\n\n\n\n在这种删除情况下，要删除的节点（即父节点）简单地被其子节点替换。查看图\
  \ 8.18 所示的二叉搜索树，看看在这种情况下是如何执行删除的。\n\n### 例如：我们给出一个二叉搜索树。现在，从二叉搜索树中删除值为 `10` 的节点。\n\
  \n初始的二叉搜索树如下：\n\n![image](img/8.18a.jpg)\n图 8.18(a)\n\n#### 步骤 1：首先，我们通过检查根节点来检查树是否为空。\n\
  \n![image](img/8.18b.jpg)\n图 8.18(b)\n\n#### 步骤 2：其次，由于根节点存在，我们将待删除的值与当前节点存储的值进行比较。由于\
  \ `10 < 24`，我们将递归地遍历左子树。\n\n![image](img/8.18c.jpg)\n图 8.18(c)\n\n#### 步骤 3：现在，由于找到了待删除节点且它只有一个孩子，该待删除节点现在被其子节点替换，并且实际节点被删除。\n\
  \n![image](img/8.18n.jpg)\n图 8.18。\n从二叉搜索树中删除值为 `10` 的节点。\n\n### 情况 3：删除具有两个孩子的节点\n\
  \n在这种情况下，要删除的节点简单地被其中序前驱（即左子树中的最大值）或其中序后继（即右子树中的最小值）替换。此外，可以使用上述两种情况中的任何一种来删除中序前驱或中序后继。现在，查看图\
  \ 8.19 所示的二叉搜索树，看看在这种情况下删除是如何发生的。\n\n让我们讨论一下从二叉搜索树中删除节点的算法。\n\n### 例如：我们给出一个二叉搜索树。现在，从二叉搜索树中删除值为\
  \ `42` 的节点。\n\n初始的二叉搜索树如下：\n\n![image](img/8.19a.jpg)\n图 8.19(a)\n\n#### 步骤 1：首先，我们通过检查根节点来检查树是否为空。\n\
  \n![image](img/8.19b.jpg)\n图 8.19(b)\n\n#### 步骤 2：其次，由于根节点存在，我们将待删除的值与当前节点存储的值进行比较。由于\
  \ `42 > 24`，我们将递归地遍历右子树。\n\n![image](img/8.19c.jpg)\n图 8.19(c)\n\n#### 步骤 3：由于找到了待删除节点且它有两个孩子，现在我们找到找到当前节点（`42`）的中序前驱，并用其中序前驱替换当前节点，以便删除实际的节点\
  \ `42`。\n\n![image](img/8.19.jpg)\n图 8.19。\n从二叉搜索树中删除值为 `42` 的节点。\n\n### 从二叉搜索树中删除节点/键的算法\n\
  \n```\nDELETE_NODE(ROOT, VALUE)\nStep 1: START\nStep 2: IF(ROOT == NULL)\n     \
  \       Print \"Error\"\n        [End of IF]\nStep 3: IF(ROOT.INFO > VALUE)\n  \
  \          DELETE_NODE(ROOT.LCHILD, VALUE)\n        ELSE IF(ROOT.INFO < VALUE)\n\
  \            DELETE_NODE(ROOT.RCHILD, VALUE)\n        ELSE IF(ROOT.LCHILD = NULL\
  \ & ROOT.RCHILD = NULL)\n            ROOT = NULL\n        ELSE\n            IF(ROOT.LCHILD\
  \ & ROOT.RCHILD)\n            TEMP = FIND_LARGEST(ROOT.LCHILD)\n            OR\n\
  \            TEMP = FIND_SMALLEST(ROOT.RCHILD)\n            Set ROOT.INFO = TEMP.INFO\n\
  \        ELSE\n            IF(ROOT.LCHILD != NULL)\n            Set TEMP = ROOT.LCHILD\n\
  \            Set ROOT.INFO = TEMP.INFO\n        ELSE\n            Set TEMP = ROOT.RCHILD\n\
  \            Set ROOT.INFO = TEMP.INFO\n        [End of IF]\n   [End of IF]\n  \
  \    [End of IF]\nStep 4: END\n```\n\n在之前的算法中，我们首先检查树是否为空。如果树为空，则不存在待删除的节点。否则，如果树为空，我们将检查待删除的节点/值是否小于当前节点存储的值。如果待删除的值较小，我们将递归地调用左子树。如果待删除的值大于当前节点存储的值，我们将递归地调用右子树。如果待删除的节点有两个孩子（即左右孩子都存在），我们将使用\
  \ `FIND_LARGEST(ROOT.LCHILD)` 找到中序前驱，或使用 `FIND_SMALLEST(ROOT.RCHILD)` 找到中序后继，并用该值替换当前节点存储的值。最后，如果待删除的节点只有一个孩子，则当前节点的值被其孩子替换。\n\
  \n### 删除整个搜索树\n\n删除二叉搜索树非常简单。首先，我们将删除左子树中存在的所有节点，然后删除右子树中的节点。最后，删除根节点。\n\n**删除整个搜索树的算法**\n\
  \n```\nDELETE_BST(ROOT)\nStep 1: START\nStep 2: IF(ROOT != NULL)\n            DELETE_BST(ROOT.LCHILD)\n\
  \            DELETE_BST(ROOT.RCHILD)\n            ROOT = NULL\n        [End of IF]\n\
  Step 3: END\n```\n\n### 查找镜像\n\n树的镜像意味着交换每个节点的左右子树。\n\n**查找镜像的算法**\n\n```\nMIRROR_IMAGE(ROOT)\n\
  Step 1: START\nStep 2: IF(ROOT != NULL)\n            MIRROR_IMAGE(ROOT.LCHILD)\n\
  \            MIRROR_IMAGE(ROOT.RCHILD)\n            Set TEMP = ROOT.LEFT\n     \
  \       Set ROOT.LEFT = ROOT.RCHILD\n            Set ROOT.RIGHT = TEMP\n       \
  \ [End of IF]\nStep 3: END\n```\n\n### 查找二叉搜索树中的最小值\n\n我们知道二叉搜索树的一个特性是，最小值出现在左子树的最左侧。如果没有左子树，根节点的值就是最小的。\n\
  \n**查找最小值的算法**\n\n```\nSMALLEST_VALUE(ROOT)\nStep 1: START\nStep 2: IF(ROOT.LCHILD\
  \ != NULL)\n            Return SMALLEST_VALUE(ROOT.LCHILD)\n        ELSE\n     \
  \       Return ROOT.INFO\nStep 3: END\n```\n\n### 查找二叉搜索树中的最大值\n\n我们知道二叉搜索树的一个特性是，最大值出现在右子树的最右侧。如果没有右子树，根节点的值就是最大的。\n\
  \n**查找最大值的算法**\n\n```\nLARGEST_VALUE(ROOT)\nStep 1: START\nStep 2: IF(ROOT.RCHILD\
  \ != NULL)\n            Return LARGEST_VALUE(ROOT.RCHILD)\n        ELSE\n      \
  \      Return ROOT.INFO\nStep 3: END\n```\n\n\n\n\n\n`CALCULATE_HEIGHT(ROOT)`\n\
  **步骤 1:** 开始\n**步骤 2:** IF `ROOT = NULL`\n打印 \"Can't find height of the tree.\"\n\
  ELSE\n设置 `LHEIGHT = CALCULATE_HEIGHT(ROOT.LCHILD)`\n设置 `RHEIGHT = CALCULATE_HEIGHT(ROOT.RCHILD)`\n\
  IF `(LHEIGHT < RHEIGHT)`\n返回 `(RHEIGHT) + 1`\nELSE\n返回 `(LHEIGHT) + 1`\n[结束 IF]\n\
  [结束 IF]\n**步骤 3:** 结束\n\n### 8.4.2 二叉树遍历方法\n\n遍历是指按照特定顺序访问树中每个节点的过程。我们都知道树是一种非线性数据结构，因此树可以用多种方式进行遍历。共有三种类型的遍历，它们是：\n\
  \n- 沿序遍历 (Pre-Order Traversal)\n- 中序遍历 (In-Order Traversal)\n- 后序遍历 (Post-Order\
  \ Traversal)\n\n现在，我们将详细讨论所有这些遍历方法。\n\n#### 先序遍历\n\n在先序遍历中，每个节点上都会递归地执行以下操作：\n\n\
  1. 访问根节点。\n2. 遍历左子树。\n3. 遍历右子树。\n\n先序中的“先（pre）”字决定了根节点在访问树中任何其他节点之前被访问。因此，它也被 DLR\
  \ 遍历，即 数据-左-右（Data Left Right）。因此，在 DLR 遍历中，首先访问根节点，然后是左子树和右子树。现在，让我们来看先序遍历的例子。\n\
  \n**例如：** 找到给定单词 EDUCATION 的二叉树的先序遍历。\n\n![image](img/322-01.jpg)\n\n上一个二叉树的先序遍历是：\n\
  \nE D C A U T I O N\n\n现在，让我们来看先序遍历的函数。\n\n**先序遍历函数**\n\n```java\npublic void preorder()\
  \ {\n    preorder(root);\n    System.out.println();}\n}private void preorder(Node\
  \ node) {\n    if (node == null)\n        return;\n    System.out.print(node.data\
  \ + \" \");\n    preorder(node.left);\n    preorder(node.right);\n}\n```\n\n####\
  \ 中序遍历\n\n在中序遍历中，每个节点上都会递归地执行以下操作：\n\n1. 遍历左子树。\n2. 访问根节点。\n3. 遍历右子树。\n\n中序中的“中（in）”字决定了根节点在左子树和右子树之间被访问。因此，它也被\
  \ LDR 遍历，即 左-数据-右（Left Data Right）。因此，在 LDR 遍历中，首先遍历左子树，然后是根节点和右子树。现在，让我们来看中序遍历的例子。\n\
  \n**例如：** 找到给定单词 EDUCATION 的二叉树的中序遍历。\n\n![image](img/323-01.jpg)\n\n上一个二叉树的中序遍历是：\n\
  \nA C D E I N O T U\n\n现在，让我们来看中序遍历的函数。\n\n**中序遍历函数**\n\n```java\npublic void inorder()\
  \ {\n    inorder(root);\n    System.out.println();}\n}private void inorder(Node\
  \ node) {\n    if (node == null)\n        return;\n    inorder(node.left);\n   \
  \ System.out.print(node.data + \" \");\n    inorder(node.right);\n}\n```\n\n####\
  \ 后序遍历\n\n在后序遍历中，每个节点上都会递归地执行以下操作：\n\n1. 遍历左子树。\n2. 遍历右子树。\n3. 访问根节点。\n\n后序中的“后（post）”字决定了根节点左子树和右子树之后最后被访问。因此，它也被\
  \ LRD 遍历，即 左-右-数据（Left Right Data）。因此，在 LRD 遍历中，首先遍历左子树，然后是右子树和根节点。现在，让我们来看后序遍历的例子。\n\
  \n**例如：** 找到给定单词 EDUCATION 的二叉树的后序遍历。\n\n![image](img/325-01.jpg)\n\n上一个二叉树的后序遍历是：\n\
  \nA C D N O I T U E\n\n现在，让我们来看后序遍历的函数。\n\n**后序遍历函数**\n\n```java\npublic void postorder()\
  \ {\n    postorder(root);\n    System.out.println();}\n}private void postorder(Node\
  \ node) {\n    if (node == null)\n        return;\n    postorder(node.left);\n \
  \   postorder(node.right);\n    System.out.print(node.data + \" \");\n}\n```\n\n\
  ```java\n//写一个程序创建一个二叉搜索树并对其进行不同的操作。\n```\n\n\n\n\n\n```java\npublic class BinarySearchTree\
