  \n## 3.5 计算数组元素的地址\n\n一维数组中元素的地址可以非常容易地计算出来，因为数组在连续的内存位置存储其所有数据元素，并存储了基地址（数组第一个元素的地址）。因此，利用基地址可以轻松地计算出其他数据元素的地址。找到一维数组中元素地址的公式如下：\n\
  \n`数据元素地址，A[i] = 基地址 (BA) + w (i – 下界)*`\n\n其中 `A` 是数组，`i` 是要计算地址的元素的索引，`BA` 是数组\
  \ `A` 的基地址，`w` 是每个元素的大小（例如，`int` 的大小为 2 字节，`char` 的大小为 1 字节，等）。\n\n### 常见问题\n\n\
  **2. 给定一个数组 int marks [6] = {34, 53, 87, 100, 98, 65}；如果基地址为 3000，计算 marks [3] 的地址。**\n\
  \n**答：已知数组的基地址为 3000，我们知道整数的大小为 2 字节。因此，我们可以很容易地找到 `marks[3]` 的地址。**\n\n![image](img/80-01.jpg)\n\
  \n\n*marks[3] 的地址 = 3000 + 2 (3 – 1)*\n\n= *3000 + 2 (2)*\n\n*marks[3] 的地址 = 3004*\n\
  \n## 3.6 数组操作\n\n本节讨论了可以在数组上执行的各种操作。这些操作包括：\n\n*   遍历数组\n*   在数组中插入元素\n*   在数组中删除元素\n\
  *   在数组中查找元素\n*   合并两个数组\n*   对数组排序\n\n### 1. 遍历数组\n\n*遍历数组意味着准确地访问数组中的每个元素，以便对其进行处理*。示例包括统计所有数据元素、对这些元素执行任何处理等。由于数组的线性结构（所有元素都存储在连续的内存位置中），遍历数组元素是一个非常简单的过程。\n\
