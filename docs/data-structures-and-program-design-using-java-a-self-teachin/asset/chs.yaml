  \  (b) 错误\n   (c) 不可能\n\n# 第 7 章 栈\n\n## 7.1 引言\n\n栈是一种重要数据结构，广泛应用于许多场景。栈可以通过日常生活中许多熟悉的例子来视觉化。栈的一个非常简单的插图是一叠书，其中一本书放在另一本书上面。当我们想取某本书时，我们先取上面的那本。因此，我们只能在一个位置（即顶部位置）添加或删除元素（即书）。在日常生活中还有许多其他例子可以让我们看到栈是如何实现的。我们观察到，每当我们谈论栈时，最后位置的元素会被先处理。因此，栈可以描述为一种\
  \ `LIFO`（后进先出）数据结构；也就是说最后插入的元素将是第一个被取出的。现在，让我们详细讨论栈。\n\n![](img/7.1)\n图 7.1. 书堆。\n\
  \n## 7.2 栈的定义\n\n栈是数据元素的线性集合，其中最后插入的元素将是第一个取出的元素（即栈是 `LIFO` 数据结构）。栈是一种抽象数据结构，与队列相似。与队列不同，栈只在一个端开放。栈是一种线性数据结构，插入和删除只在称为\
  \ `TOP` 的端进行。一端总是关闭的，另一端用于插入和删除。\n\n栈可以使用数组或链表来实现。在本节中我们将讨论使用数组和链表来实现栈。\n\n![](img/7.2)\n\
  图 7.2. 栈的表示。\n\n### 实际应用\n\n1. 栈的一个生活实例是一叠书，其中一本书放在另一本书上面。当我们想取某本书时，我们先取上面的那本。\n\
  2. 栈的另一个生活实例是一叠碟子，其中一片碟子放在另一片碟子上面。当我们想取某片碟子时，我们先取上面的那片。\n\n## 7.3 栈的溢出与上溢\n\n让我们详细讨论栈的溢出和上溢：\n\
  \n1. **栈溢出**：当我们尝试向已经满的栈插入元素时发生溢出情况。在向栈中插入任何新元素之前，我们必须始终检查溢出情况，即栈已经满时的插入尝试。可以通过以下公式进行检查，如果\
  \ `TOP = MAX – 1`，其中 `MAX` 是栈的大小。\n2. **栈上溢**：当我们尝试从栈中移除元素但栈已经空时，就会发生上溢情况。如果尝试从已经空的栈中删除值，将打印上溢消息。可以通过以下公式进行检查：\n\
  \   `TOP = NULL`，其中 `MAX` 是栈的大小。\n\n### 常见问题\n\n**1. 定义栈并列出对栈的操作。**\n\n**答：栈是一种线性数据结构，其插入和删除只在称为\
  \ `TOP` 的端进行。它在性质上是 `LIFO`（即后进先出）。对栈执行的不同操作有：**\n(a) Push 操作\n(b) Pop 操作\n(c) Peek\
  \ 操作\n\n## 7.4 栈的操作\n\n可以在栈上执行的三个基本操作：\n\n**1. 入栈 (PUSH)**\n\n`push` 操作是向栈中添加新元素的过程。然而，在栈中插入任何新元素之前，我们必须始终检查溢出情况，即当我们尝试向已经满的栈插入元素时发生的情况。可以通过以下方式检查溢出条件，如果\
  \ `TOP = MAX – 1`，其中 `MAX` 是栈的大小。因此，如果溢出条件为真，则在屏幕上显示溢出消息；否则将元素插入到栈中。\n\n\n\n\n\n\
  例如：假设我们有一个包含五个元素的栈。假设我们想向栈中插入另一个元素 10；那么 `TOP` 将增加 1。因此，新元素被插入到 `TOP` 指向的位置。现在，让我们通过下面的图看看栈中是如何发生推（push）操作的：\n\
  \n![image](img/259-01.jpg)\n\n在插入 10 后，新栈将变为：\n\n![image](img/7.3.jpg)\n\n图 7.3。\n\
  \n插入新元素后的栈。\n\n#### 栈推操作的算法\n\n```\nStep 1: START\nStep 2: IF TOP = MAX – 1    \
  \         Print OVERFLOW ERROR             Go to Step 5             [End of If]\n\
  Step 3: Set TOP = TOP + 1\nStep 4: Set STACK[TOP] = ITEM\nStep 5: EXIT\n```\n\n\
  在上述算法中，我们首先检查溢出条件。在步骤 3 中，`TOP` 增加以便使其指向下一个位置。最后，新元素被插入到栈中 `TOP` 指向的位置。\n\n## 2.\
  \ POP\n\n弹出（pop）操作是从从栈中移除元素的过程。然而，在从栈中删除元素之前，我们必须始终检查下空（underflow）条件，当尝试从已经为空的栈中删除元素时就会发生下空。可以通过如下方式检查下空：如果\
  \ `TOP = NULL`。因此，如果下空条件为真，则屏幕上将显示下空信息；否则，从栈中删除该元素。\n\n例如：假设我们有一个包含五个元素的栈。假设我们想从栈中删除一个元素\
  \ 35；那么 `TOP` 将减少 1。因此，元素从 `TOP` 指向的位置被删除。现在，让我们通过下面的图看看栈中是如何发生弹出（pop）操作的：\n\n在删除\
  \ 35 后，新栈将变为：\n\n![image](img/7.4.jpg)\n\n图 7.4。\n\n删除元素后的栈。\n\n#### 栈弹出操作的算法\n\n\
  ```\nStep 1: START\nStep 2: IF TOP = NULL             Print UNDERFLOW ERROR    \
  \         Go to Step 5             [End of If]\nStep 3: Set ITEM = STACK[TOP]\n\
  Step 4: Set TOP = TOP - 1\nStep 5: EXIT\n```\n\n在上述算法中，我们首先检查下空条件，即栈是否为空。如果栈为空，则不进行删除操作；否则，`TOP`\
  \ 减到栈中的上一个位置。最后，元素从栈中删除。\n\n## 3. PEEK\n\n查看（peek）是一个返回栈顶元素值的操作。它在不删除数组栈顶元素的情况下完成。然而，查看操作首先检查下空条件。可以通过如下方式检查下空：如果\
  \ `TOP = NULL`。因此，如果下空条件为真，则屏幕上将显示下空信息；否则，返回元素的值。\n\n![image](img/7.5.jpg)\n\n图\
  \ 7.5。\n\n返回栈顶值的栈。\n\n#### 栈查看操作的算法\n\n```\nStep 1: START\nStep 2: IF TOP = NULL\
  \             Print UNDERFLOW ERROR             Go to Step 4             [End of\
  \ If]\nStep 3: Return STACK[TOP]\nStep 4: EXIT\n```\n\n// 为栈编写一个菜单驱动程序，执行所有操作。\n\
  \n```java\npublic class Stack {\n  static int MAX = 10;\n  private int[] data =\
  \ new int[MAX];\n  private int top;\n  public void push(int item) throws Exception\
  \ {\n        if (top == MAX) {\n            throw new Exception(\"Stack is Full\"\
  );\n        }\n        top++;\n        data[top] = item;\n  }\n\n  public int pop()\
  \ throws Exception {\n        if (top == 0) {\n            throw new Exception(\"\
  Stack is Empty\");\n        }\n        int temp = peek();\n        data[top] = 0;\n\
  \        top--;\n        return temp;\n  }\n\n  public int peek() throws Exception\
  \ {\n        if (top == 0) {\n            throw new Exception(\"Stack is Empty\"\
  );\n        }\n        return data[top];\n  }\n\n  public void display() throws\
  \ Exception {\n        if (top == 0) {\n            throw new Exception(\"Stack\
  \ is Empty\");\n        }\n        for (int i = top; i > 0; i--) {\n           \
  \ System.out.print(data[i] + \"->\");\n        }\n        System.out.println(\"\
  NULL\");\n  }\n}\n\n// CLIENT\nimport java.util.Scanner;\npublic class StackClient\
  \ {\n  public static void main(String[] args) {\n    Scanner scn = new Scanner(System.in);\n\
  \    Stack s = new Stack();\n    boolean flag = true;\n    try {\n      while (flag)\
  \ {\n        System.out.println(\"\\n***MENU***\");\n        System.out.println(\"\
  1. Push\");\n        System.out.println(\"2. Pop\");\n        System.out.println(\"\
  3. Display\");\n        System.out.println(\"4. Exit\");\n        System.out.println(\"\
  Enter your choice: \");\n        int choice = scn.nextInt();\n        int item =\
  \ 0;\n        switch (choice) {\n          case 1:\n            System.out.println(\"\
  Enter value of node: \");\n            item = scn.nextInt();\n            s.push(item);\n\
  \            System.out.println(item + \" inserted successfully\");\n          \
  \  break;\n          case 2:\n            System.out.println(s.pop() + \" deleted\
  \ successfully\");\n            break;\n          case 3:\n            s.display();\n\
  \            break;\n          case 4:\n            flag = false;\n            System.out.println(\"\
  Terminated.....\");\n            break;\n          default:\n            System.out.println(\"\
  Wrong choice\");\n            break;\n        }\n      }\n    } catch (Exception\
  \ e) {\n      System.out.println(e.getMessage());\n    }\n  }\n}\n```\n\n程序的输出如下：\n\
