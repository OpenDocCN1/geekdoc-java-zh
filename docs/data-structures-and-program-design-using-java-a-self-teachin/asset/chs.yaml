  \n## RL 旋转\n\nRL 旋转也称为右左旋转（Right-Left rotation），因为新节点插入在关键节点的右子树的左子树中。它是双重旋转。让我们来看一个例子并在其中执行\
  \ RL 旋转。\n\n### 例如：\n\n初始 AVL 树如下：\n\n![image](img/8.28a.jpg)\n图 8.28(a)\n\n在 AVL\
