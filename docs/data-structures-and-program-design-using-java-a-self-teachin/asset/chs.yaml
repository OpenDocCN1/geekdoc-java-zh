  \n### 常见问题\n\n#### 1. 根据给定的遍历序列创建二叉树。\n\n**中序 – d b e a f c g**\n\n**前序 – a b d\
  \ e c f g**\n\n**答案：**\n\n**步骤 1**：`a` 是二叉树的根节点。\n\n![image](img/334-02.jpg)\n\n\
  **步骤 2**：在中序序列中，`d`、`b` 和 `e` 位于节点 `a` 的左侧。因此，`d`、`b` 和 `e` 是根节点 `a` 的左子树。同样，`d`\
  \ 是 `b` 的左子树，`e` 是 `b` 的右子树。\n\n![image](img/334-03.jpg)\n\n**步骤 3**：在中序序列中，`f`、`c`\
  \ 和 `g` 位于根节点 `a` 的右侧。因此，`f`、`c` 和 `g` 是根节点 `a` 的右子树。同样，`f` 是 `c` 的左子树，`g` 是 `c`\
  \ 的右子树。\n\n![image](img/335-01.jpg)\n\n## 8.5 AVL 树\n\nAVL 树由 Adelson-Velski 和 Landis\
  \ 于 1962 年发明，并以发明者的名字命名。AVL 树是第一个平衡二叉搜索树。它是一种自平衡二叉搜索树。由于节点两个子树的高度之差最多为 1，AVL 树也被称为高度平衡树。AVL\
  \ 树在执行查找、插入和删除操作方面非常高效，因为执行所有这些操作需要`O(log n)` 时间。\n\n### 8.5.1 高度平衡树的必要性\n\nAVL\
  \ 树与二叉搜索树非常相似，但有一个细微的区别。AVL 树关联有一个名为“平衡因子”的特殊变量。AVL 树中的每个节点都关联一个平衡因子。平衡因子通过左子树的高度减去右子树的高度来确定。因此，平衡因子为\
  \ `-1`、`0` 或 `1` 的节点被称为高度平衡树节点。高度平衡树的主要需求是搜索过程变得非常快。这种平衡条件还确保了树的深度为`O(log n)`。平衡因子的计算公式如下：\n\
  \n`Balance Factor = Height(Left subtree) – Height(Right subtree)`\n\n* 如果树的平衡因子为\
  \ `-1`，则意味着该节点右子树的高度比左子树的高度高 1。\n* 如果树的平衡因子为 `0`，则意味着节点左子树和右子树的高度相等。\n* 如果树的平衡因子为\
  \ `1`，则意味着该节点左子树的高度比右子树的高度高 1。\n\n因此，高度平衡树的整体优势有助于快速查找。\n\n![image](img/8.21.jpg)\n\
  \n图 8.21 平衡的 AVL 树。\n\n### 8.5.2 AVL 树上的操作\n\n在本节中，我们将讨论在 AVL 树上进行的各种操作。这些操作包括：\n\
  \n* 在 AVL 树中查找节点\n* 在 AVL 树中插入新节点\n\n现在，让我们详细讨论这两项。\n\n1. **在 AVL 树中查找节点**\n在 AVL\
  \ 树中查找节点的过程与二叉搜索树相同。\n\n2. **在 AVL 树中插入新节点**\n在 AVL 树中插入新节点的过程与二叉搜索树非常相似。新节点总是作为终端节点/叶子节点插入到\
  \ AVL 树中。但插入新节点可能会破坏 AVL 树的平衡，因为平衡因子可能会受到干扰。因此，为了保持树的平衡，可能需要旋转。\n\n#### AVL 旋转\n\
  \n（注：根据提供的文本上下文，旋转描述和示例如下。）\n\n![image](img/332-03.jpg)\n![image](img/332-04.jpg)\n\
  ![image](img/333-01.jpg)\n![image](img/333-02.jpg)\n![image](img/334-01.jpg)\n![image](img/334-02.jpg)\n\
  ![image](img/334-03.jpg)\n![image](img/335-01.jpg)\n![image](img/8.21.jpg)\n![image](img/8.22.jpg)\n\
  ![image](img/8.23.jpg)\n![image](img/8.24.jpg)\n![image](img/8.25.jpg)\n![image](img/8.26a.jpg)\n\
  \n\n\n\n\n在 AVL 树中插入新节点 5。\n\n![image](img/8.26b.jpg)\n图 8.26(b)\n\n在 AVL 树中插入 5\
  \ 后，节点 25 的平衡因子被破坏。因此，25 是关键节点。于是，我们将应用 LL 旋转来恢复树的平衡因子。旋转后，节点 12 成为根节点，节点 5 和节点\
  \ 25 分别成为树的左孩子和右孩子。\n\n![image](img/8.26c.jpg)\n图 8.26。\nAVL 树中的 LL 旋转。\n\n因此，执行了\
  \ LL 旋转，每个节点的平衡因子也得到了恢复。\n\n## RR 旋转\n\nRR 旋转也称为右旋转（Right-Right rotation），因为新节点插入在关键节点的右子树的右子树中。它也是单旋转。让我们来看一个例子并在其中执行\
  \ RR 旋转。\n\n### 例如：\n\n初始 AVL 树如下：\n\n![image](img/8.27a.jpg)\n图 8.27(a)\n\n在 AVL\
  \ 树中插入新节点 25。\n\n![image](img/8.27b.jpg)\n图 8.27(b)\n\n在 AVL 树中插入 25 后，节点 5 的平衡因子被破坏。因此，5\
  \ 是关键节点。于是，这里我们将应用 RR 旋转来恢复树的平衡因子。旋转后，节点 12 成为根节点，节点 5 和节点 25 分别成为树的左孩子和右孩子。\n\n\
