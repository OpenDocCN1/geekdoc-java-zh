  \n### 10.1.1 哈希与直接寻址法的区别\n\n在直接寻址法中，我们将键存储在与键值相同的地址上，如图图 10.3\n\n图 10.3。\n\n使用直接寻址法对键进行映射。\n\
  \n### 10.1.2 哈希表\n\n哈希表是一种支持高效搜索技术（即哈希）的数据结构。哈希表是一个数组，通过名为 `key` 的特殊索引来访问数据。在哈希表中，键通过哈希函数映射到数组位置。哈希函数是一个函数或数学公式，当应用于\
  \ `key` 时，它会产生一个整数，该整数用作索引在哈希表中查找键。因此，在哈希函数的帮助下，可以在 `O(1)` 时间内搜索存储在哈希表的值。哈希表的核心思想是建立键与数组索引之间的直接映射。\n\
  \n![image](img/10.4.jpg)\n\n图 10.4。\n\n使用哈希法将键映射到哈希表。\n\n### 10.1.3 哈希函数\n\n哈希函数是一个数学公式，当它应用于\
  \ `key` 时，它会产生一个整数，该整数用作索引在哈希表中查找键。\n\n#### 哈希函数的特征\n\n哈希函数有四个主要特征，如下所示：\n\n1. 哈希函数使用了所有的输入数据。\n\
  2. 哈希函数必须能够生成不同的哈希值。\n3. 哈希值完全由被哈希的数据决定。\n4. 哈希函数必须将键均匀地分布在整个哈希表中。\n\n#### 不同类型的哈希函数\n\
  \n在本节中，我们将讨论一些常见的哈希函数：\n\n1. **除法法（Division Method）：** 在除法法中，通过取 `k` 除以 `m` 的余数将键\
  \ `k` 映射到 `m` 个槽中的一个。简单来说，我们可以说这种方法将一个整数（例如 `x`）除以 `m` 然后使用得到的余数。这是简单的哈希方法。哈希函数为：\n\
  \n   ![image](img/372-01.jpg)\n\n   例如，如果 `m = 5` 且键 `k = 10`，那么 `h(k) = 2`。因此，除法法运行非常快，因为只需要一次除法操作。虽然这种方法对于任何\
  \ `m` 值都是有效的，但请考虑如果 `m` 是偶数，那么当 `k` 的值为偶数时，`h(k)` 为偶数；同样，当 `k` 的值为奇数时，`h(k)` 为奇数。因此，如果偶键和奇键几乎相等，则没有问题。但如果偶键较多，那么除法法就不是理想的，因为它不会在哈希表中均匀地分布键。此外，我们还要避免某些特定的\
  \ `m` 值；即 `m` 不应该是 2 的幂，因为如果 `h(k) = k mod 2^x`，那么 `h(k)` 将提取 `k` 的低 `x` 位。除法法的主要缺点是许多键会映射到连续的哈希值，这会影响性能。\n\
  \n   ##### 常见问题\n\n   **2. 给定一个具有 50 个位置的哈希表，使用除法法计算键 10 和 75 的哈希值。**\n\n   答：`m\
  \ = 50, k1 = 10, k2 = 75` 哈希值的计算如下：\n\n   `h(10) = 10 % 50 = 10`\n\n   `h(75) =\
  \ 75 % 50 = 25`\n\n2. **平方位法（Mid Square Method）：** 在平方位法中，我们将给定键的平方。得到数字后，从数字中间提取一些数字作为地址。\n\
  \n   例如，如果键 `k = 5025`，那么 `k² = 25250625`。因此，`h(5025) = 50`。\n\n   这种方法效果非常好，因为键的所有数字对输出都有贡献；即所有数字都贡献了中间数字的产生。此外，这种方法必须从所有键中选择相同的\
  \ `r` 位。\n\n   ##### 常见问题\n\n   **3. 给定一个具有 100 个位置的哈希表，使用平方位法计算键 2045 和 1357 的哈希值。**\n\
  \n   答：现在有 100 个内存位置，索引从 0 到 99。因此，取两位来映射键。所以，`h(2045) = 05`，`h(1357) = 35`。\n\n\
  3. **折叠法（Folding Method）：** 在折叠法中，我们将键分成若干部分并将它们相加。\n\n   ##### 常见问题\n\n   **4.\
  \ 给定一个具有 100 个位置的哈希表，使用折叠法计算键 2486 和 179 的哈希值。**\n\n   答：`h(2486) = 10`，`h(179)\
  \ = 26`。\n\n\n\n\n\n## 2. 从链法哈希表中删除元素\n从链法哈希表中删除元素的过程与我们在单链表中使用的方法相同。首先，我们将执行搜索操作，然后像单链表的情况一样执行删除操作。从链法哈希表中删除元素的运行时间复杂度为\
  \ `O(m)`，其中 `m` 是该位置链表中存在的元素个数。\n\n## 3. 在链法哈希表中查找\n在链法哈希表中查找元素的过程也非常简单。首先，我们通过哈希表中的哈希函数获取键的哈希值。然后我们在链表中查找该元素。在链法哈希表中查找元素的运行时间复杂度为\
  \ `O(m)`，其中 `m` 是该位置链表中存在的元素个数。\n\n### 常见问题\n\n### 5. 在具有 10 个内存位置的链法哈希表中插入键 4,\
  \ 9, 20, 35 和 49。使用哈希函数 `h(k) = k mod m`。\n\n**答：初始给定的哈希表如下：**\n\n![image](img/376-01.jpg)\n\
  \n现在，我们将向哈希表插入 4。\n\n**第 1 步：**\n要插入的键 = 4\n`h(4) = 4 mod 10`\n`h(4) = 4`\n现在，为位置\
  \ 4 创建一个链表，并将键元素 4 存储其中。\n\n![image](img/376-02.jpg)\n\n**第 2 步：**\n要插入的键 = 9\n\
  `h(9) = 9 mod 10`\n`h(9) = 9`\n现在，为位置 9 创建一个链表，并将键元素 9 存储其中。\n\n![image](img/377-01.jpg)\n\
  \n**第 3 步：**\n要插入的键 = 20\n`h(20) = 20 mod 10`\n`h(2) = 2`\n现在，为位置 2 创建一个链表，并将键元素\
  \ 20 存储其中。\n\n![image](img/377-02.jpg)\n\n**第 4 步：**\n要插入的键 = 35\n`h(35) = 35 mod\
  \ 10`\n`h(35) = 5`\n现在，为位置 5 创建一个链表，并将键元素 35 存储其中。\n\n![image](img/378-01.jpg)\n\
  \n**第 5 步：**\n要插入的键 = 49\n`h(49) = 49 mod 10`\n`h(9) = 9`\n现在，我们将 49 插入到位置 9 链表的末尾。\n\
  \n![image](img/378-02.jpg)\n\n### 链法的优缺点\n该方法的主要优点是完全解决了冲突问题。即使要存储在哈希表中的键元素多于哈希表的位置数，它仍然有效。然而，显而易见，随着键元素数量的增加，该方法的性能将会下降。\n\
  \n该方法的缺点是存储空间的浪费，因为键元素存储在链表中；此外，每个元素都需要引用来访问，这反过来消耗了更多空间。\n\n### 10.1.5.2 开放定址法\n\
  在开放定址法中，所有元素都存储在哈希表本身。一旦发生冲突，开放定址法将使用探测序列计算新位置，并将下一个元素或下一个记录存储在该位置。探测是检查哈希表在内存位置的过程。当我们在开放定址法中执行插入操作时，我们首先连续探测/检查哈希表，直到找到一个可以插入新键的空槽位。开放定址法可以使用以下方法实现：\n\
  * 线性探测\n* 二次探测\n* 双重哈希\n\n现在，让我们详细讨论所有方法。\n\n#### 线性探测\n线性探测是解决哈希中冲突问题最简单的方法。在该方法中，如果键已经存储在由哈希函数\
  \ `h(k)` 生成的位置，则可以通过以下哈希函数解决该情况：\n`h(k) = (h(k) + i) = mod m`\n其中 `h(k) = k mod\
  \ m`\n`i` = 探测次数 = 0, 1, 2, 3(m - 1)`\n`m` = 槽位数\n\n现在，让我们理解这项技术的工作原理。对于给定的键 `k`，首先探测由\
  \ `(h(k) + 0) mod m` 生成的位置，因为第一次探测 `i = 0`。如果生成的位置是空闲，则将键存储其中。否则，将由哈希函数 `(h(k) +\
  \ 1) mod m` 生成 `i = 1` 的第二次探测。同样，如果生成的位置是空闲，则将键存储其中；否则，将生成后续的探测，如 `(h(k) + 2) mod\
  \ m`、`(h(k) + 3) mod m` 等，直到我们找到一个空位置。\n\n#### 常见问题\n**给定 k = 13, 25, 14, 35，使用线性探测将这些键映射到大小为\
  \ m = 5 的哈希表中。**\n\n**答：初始给定的哈希表如下：**\n\n![image](img/380-01.jpg)\n\n**第 1 步：**\n\
  `i = 0`\n要插入的键 = 13\n`h(13) = 13 mod 5`\n`h(13) = 3`\n现在，由于位置 `T[3]` 是空闲，将 13 插入到\
  \ `T[3]`。\n\n**第 2 步：**\n`i = 0`\n要插入的键 = 25\n`h(25) = 25 mod 5`\n`h(25) = 0`\n\
  现在，由于位置 `T[0]` 是空闲，将 25 插入到 `T[0]`。\n\n**第 3 步：**\n`i = 0`\n要插入的键 = 14\n`h(14) =\
  \ 14 mod 5`\n`h(14) = 4`\n现在，由于位置 `T[4]` 是空闲，将 14 插入到 `T[4]`。\n\n**第 4 步：**\n`i\
  \ = 0`\n要插入的键 = 35\n`h(35) = 35 mod 5`\n`h(35) = 0`\n现在，由于位置 `T[0]` 不空闲，则计算下一个探测序列，即\
  \ `i = 1`：\n`i = 1`\n`h(35) = (35 % 5 + 1) % 5`\n`h(35) = (0 + 1) % 5`\n`h(35) =\
  \ 1 % 5 = 1`\n现在，由于位置 `T[1]` 是空闲，将 35 插入到 `T[1]`。\n\n因此，最终的哈希表所示：\n\n![image](img/381-01.jpg)\n\
