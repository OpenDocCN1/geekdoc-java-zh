  \ 树如下：\n![image](img/346-02.jpg)\n\n## 8.6 总结\n\n-   树被定义为节点的集合，其中每个节点的左子树和右子树的高度之差不超过\
  \ 1。根节点是树的顶部。叶节点没有孩子。\n-   路径是到达目的地的唯一序列。\n-   节点的度等于它所拥有的子节点数。\n-   二叉树由三部分组成：左孩子、右孩子和数据项。二叉树的每个节点可以有\
  \ 0、1 或 2 个孩子。\n-   二叉树有两种类型：完全二叉树和扩展二叉树。\n-   在完全二叉树中，除了最后层外，每一层都必须填满。此外，节点尽可能靠左排列。\n\
  -   当且仅当二叉树中的每个节点都有 0 或 2 个孩子时，它是扩展二叉树（称为 2T 树）。\n-   二叉树可以在内存中用两种方式表示：数组表示和链表表示。数组表示（也称为顺序表示）使用一维数组完成。\n\
  -   二叉搜索树（BST）是二叉树的一种变体，其中左子树的所有节点都小于根节点的值。同样，右子树的所有节点都大于根节点的值。它称为有序二叉树。\n-   搜索操作是二叉树中最常用的操作之一。该操作用于查找树中是否存在特定的键。\n\
  -   插入操作用于在二叉搜索树中插入给定值的新节点。\n-   二叉树的镜像意味着每个节点的左右子树。\n-   遍历是按照特定顺序访问树中每个节点的过程。树可以通过多种方式进行遍历，如前序遍历、中序遍历和后序遍历。\n\
  -   前序遍历中的“pre”意味着在访问树中的任何其他节点之前访问根节点。因此，它也称为 DLR 遍历，即数据左右。\n-   中序遍历中的“in”意味着在左孩子和右子树之间访问根节点。因此，它也称为\
  \ LDR 遍历，即左数据右。\n-   后序遍历中的“post”意味着在访问左孩子和右子树之后访问根节点。因此，它也称为 LRD 遍历，即左右数据。\n\n\n\
  \n\n\n- 如果我们至少给出两个遍历结果，就可以构造出一棵二叉树，前提是其中一种遍历必须是中序遍历，而另一种可以是前序遍历或后序遍历。\n- AVL 是一种自平衡二叉搜索树。AVL\
  \ 树中的每个节点都关联着一个平衡因子。平衡因子的计算方法是用左子树的高度减去右子树的高度。因此，平衡因子为 -1、0 或 1 的节点被称为高度平衡树。\n\n\
