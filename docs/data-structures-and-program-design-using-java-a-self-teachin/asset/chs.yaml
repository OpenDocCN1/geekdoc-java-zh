  \n## 3.13 稀疏矩阵\n稀疏矩阵是指零元素比例较高的矩阵。稀疏矩阵能够高效地利用内存空间。在矩阵中存储空元素会浪费内存，因此我们采用了一种技术只在稀疏矩阵中存储非空元素。\n\
  \n例如：\n\n![image](img/3.7.jpg)\n图 3.7。\n稀疏矩阵的表示。\n\n## 3.14 稀疏矩阵的类型\n\n稀疏矩阵有三种类型分别为：\n\
  \n1. **下三角矩阵：** 在这类稀疏矩阵中，主对角线以上的所有元素必须为零，或者换句话说，我们可以说主对角线以下的所有元素只包含非零元素。这种矩阵被称为下三角矩阵。\n\
  \n   ![image](img/3.8.jpg)\n   图 3.8。\n   下三角矩阵。\n\n2. **上三角矩阵：** 在这类稀疏矩阵中，主对角线以上的所有元素只包含非零元素，或者换句话说，我们可以说主对角线以下的所有元素必须为零。这种矩阵被称为上三角矩阵。\n\
  \n   ![image](img/3.9.jpg)\n   图 3.9。\n   上三角矩阵。\n\n3. **三对角矩阵：** 在这种类型中，非零元素只能出现在对角线上或相邻对角线的位置。这种矩阵被称为三对角矩阵。\n\
  \n   ![image](img/3.10.jpg)\n   图 3.10。\n   三对角矩阵。\n\n## 3.15 稀疏矩阵的表示\n稀疏矩阵有两种表示方式，如下：\n\
  \n1. **数组表示/三元组表示：** 这种表示包含三行，第一行表示稀疏矩阵的行数、列数和非零元素/值的数量其他其他元素提供了非零元素的位置和值的信息。\n\n\
  \   例如，让我们考虑一个稀疏矩阵。\n\n   ![image](img/111-01.jpg)\n   上述稀疏矩阵的数组表示将是：\n\n   ![image](img/111-02.jpg)\n\
  \n2. **链表表示：** 稀疏矩阵也可以用链表形式表示。在这种表示中，我们在单个节点中存储行数、列数和非零元素数量，并有一个地址字段存储下一个位置。让我们通过一个例子来更清楚地理解。\n\
  \n   让我们考虑一个稀疏矩阵：\n\n   ![image](img/111-03.jpg)\n   上述稀疏矩阵的链表表示如下：\n\n   ![image](img/3.12.jpg)\n\
  \   图 3.12。\n   稀疏矩阵的链表表示。\n\n### 常见问题\n\n**6. 解释稀疏矩阵。**\n\n**答：零元素数量远大于非零元素数量的矩阵被称为稀疏矩阵。用二维数组在内存中表示矩阵的自然方法可能不适用于稀疏矩阵。可以通过只存储非零元素来节省空间。我们可以使用三元组存储法来表示稀疏矩阵：**\n\
  \n* 行优先法\n* 列优先法\n\n\n* 数组是连续内存中同质类型（相似）类型数据元素的集合。数组是一种线性数据结构，因为数组的所有元素都是按线性顺序存储的。\n\
  * 数组在使用之前必须声明。\n* 编译时对数组元素的初始化方式与在声明时初始化普通或常规变量的方式相同。\n* 运行时数组元素的初始化指的是从键盘输入值的方法。\n\
  * 1-D 数组中元素的地址可以很容易地计算，因为数组将其所有数据元素存储在连续的内存位置，并存储了基地址。\n* 遍历数组意味着准确地访问数组中的每一个元素，以便对其进行处理。\n\
  * 在数组中插入元素是指向数组中添加元素的操作。这可以通过三种方式完成。\n* 从数组中删除元素是指从数组中移除元素的操作。删除也通过三种方式完成。\n* 在数组中搜索元素意味着查找某个特定值是否存在于数组中。如果找到了该特定值，则认为搜索成功，并返回该特定值的位置/索引。如果未找到该值，则被认为搜索失败。\n\
  * 线性搜索是一种用于在数组中搜索特定值的非常简单的技术。\n* 合并两个数组意味着将第一个和第二个数组的元素复制到第三个数组中。\n* 排序数组意味着按照指定的顺序（升序或降序）排列数据结构中的数据元素。\n\
  * 选择排序是一种排序技术，它通过找到数组中的最小值并将其放在第一个位置来工作。之后，它再次找到数组中的第二个较小值。\n* 与一维数组不同，2-D 数组组织在网格或表格中。\n\
  * 对于声明二维数组，我们必须知道数组的名称和元素的大小。\n* 多维数组也称为 n 维数组。它是数组的集合。\n* 稀疏矩阵是指零元素比例较高的矩阵。稀疏矩阵能够高效地利用内存空间。\n\
