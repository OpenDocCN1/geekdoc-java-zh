  \n![image](img/265-01.jpg)\n\n## 7.5 栈的实现\n\n栈可以用两种数据结构表示：\n\n1. 使用数组表示栈。\n2. 使用链表表示栈。\n\
  \n现在，让我们详细讨论这两种。\n\n### 7.5.1 使用数组实现栈\n\n栈可以使用数组轻松实现。最初，栈的 `TOP` 指向数组的位置位置。当我们向栈中插入新元素时，`TOP`\
  \ 会不断增加，始终指向将插入下一个元素的位置。使用数组表示栈的情况所示：\n\n![image](img/7.6.jpg)\n\n图 7.6。\n\n栈的数组表示。\n\
  \n### 7.5.2 使用链表实现栈\n\n我们已经学习了如何使用数组实现栈。现在让我们使用链表实现相同的功能。我们已经知道在链表中会发生动态内存分配；即在运行时分配内存。而在数组的情况下，内存是在程序开始时分配的。如果我们预先知道栈的最大尺寸，那么使用数组实现栈是有效的。但如果预未知大小，我们就会使用链表的概念，链表允许动态内存分配。正如大家所知，链表有两个部分；第一部分包含节点的信息，第二部分存储下一个元素的地址。同样，我们可以实现链栈。现在，链表的\
  \ `START` 将成为栈的 `TOP`。所有的插入和删除操作都在 `TOP` 指向的节点上进行。\n\n### 7.5.2.1 链栈中的推操作\n\n\n\n\
  \npush 操作（入操作）是向现有栈中添加新元素的过程。栈中的新元素始终插入在栈的最顶位置。最初，我们将检查 `TOP = NULL` 是否成立。如果该条件为真，则栈为空；否则，为新节点分配新内存。我们将通过算法来进一步理解它：\n\
  \n### 链式栈中插入新元素的算法\n\n**第 1 步:** 开始\n**第 2 步:** 设置 `NEW_NODE.INFO = VAL`\nIF `TOP\
  \ = NULL`\n    设置 `NEW_NODE.NEXT = NULL`\n    设置 `TOP = NEW_NODE`\nELSE\n    设置\
  \ `NEW_NODE.NEXT = TOP`\n    设置 `TOP = NEW_NODE`\n[If 结束]\n**第 3 步:** 退出\n\n####\
  \ 示例：考虑一个包含四个元素的链式栈；需要向栈中插入一个新元素。\n\n![image](img/7.8.jpg)\n图 7.8 插入前的链式栈。\n\n在栈中插入新元素后，更新后的栈如图所示：\n\
  \n![image](img/7.9.jpg)\n图 7.9 插入新节点后的链式栈。\n\n### 7.5.2.2 链式栈中的 Pop 操作\n\npop 操作（出操作）是从现有栈中移除元素的过程。栈中的元素始终从\
  \ `TOP` 指向的节点删除。最初，我们将检查 `TOP = NULL` 是否成立。如果该条件为真，则栈为空，这意味着我们无法从中删除任何元素。因此，在这种情况下，屏幕上会显示上溢错误（underflow）错误信息。我们将通过算法来进一步理解它：\n\
  \n### 从链式栈中删除元素的算法\n\n**第 1 步:** 开始\n**第 2 步:** IF `TOP = NULL`\n    打印 UNDERFLOW\
  \ ERROR\n[If 结束]\n**第 3 步:** 设置 `TEMP = TOP`\n**第 4 步:** 设置 `TOP = TOP.NEXT`\n**第\
  \ 5 步:** 退出\n\n#### 示例：考虑一个包含五个元素的链式栈；需要从栈中删除一个元素。\n\n![image](img/7.10.jpg)\n图\
  \ 7.10 删除前的链式栈。\n\n从栈中删除一个元素后，更新后的栈如图所示：\n\n![image](img/7.11.jpg)\n图 7.11 删除顶端节点/元素后的链式栈。\n\
  \n```java\n// 写一个菜单驱动的程序，实现执行 push 和 pop 操作的链式栈。\n\npublic class StackUsingLinkedList\
  \ {\n    private class Node {\n        int data;\n        Node next;\n    }\n  \
  \  Node top;\n    int size;\n\n    private Node create_new_node(int item) throws\
  \ Exception {\n        Node node = new Node();\n        if (node == null) {\n  \
  \          throw new Exception(\"Memory not allocated\");\n        } else {\n  \
  \          node.data = item;\n            node.next = null;\n            return\
  \ node;\n        }\n    }\n\n    public void push(int item) throws Exception {\n\
  \        Node nn = create_new_node(item);\n        if (size == 0) {\n          \
  \  top = nn;\n        } else {\n            nn.next = top;\n            top = nn;\n\
  \        }\n        size++;\n    }\n\n    public int pop() throws Exception {\n\
  \        if (size == 0) {\n            throw new Exception(\"Stack is Empty\");\n\
  \        }\n        int val = peek();\n        top = top.next;\n        return val;\n\
  \    }\n\n    public int peek() throws Exception {\n        if (size == 0) {\n \
  \           throw new Exception(\"Stack is Empty\");\n        }\n        return\
  \ top.data;\n    }\n\n    public void display() throws Exception {\n        if (size\
  \ == 0) {\n            throw new Exception(\"Stack is Empty\");\n        }\n   \
  \     Node temp = top;\n        while (temp != null) {\n            System.out.print(temp.data\
  \ + \" -> \");\n            temp = temp.next;\n        }\n        System.out.println(\"\
  NULL\");\n    }\n}\n\n// CLIENT\nimport java.util.Scanner;\npublic class StackLLClient\
  \ {\n    public static void main(String[] args) {\n        Scanner scn = new Scanner(System.in);\n\
  \        StackUsingLinkedList s = new StackUsingLinkedList();\n        boolean flag\
  \ = true;\n        try {\n            while (flag) {\n                System.out.println(\"\
  \\n***MENU***\");\n                System.out.println(\"1. Push\");\n          \
  \      System.out.println(\"2. Pop\");\n                System.out.println(\"3.\
  \ Display\");\n                System.out.println(\"4. Exit\");\n              \
  \  System.out.println(\"Enter your choice: \");\n                int choice = scn.nextInt();\n\
  \                int item = 0;\n                switch (choice) {\n            \
  \        case 1:\n                        System.out.println(\"Enter value of node:\
  \ \");\n                        item = scn.nextInt();\n                        s.push(item);\n\
  \                        System.out.println(item + \" inserted successfully\");\n\
  \                        break;\n                    case 2:\n                 \
  \       System.out.println(s.pop() + \" deleted successfully\");\n             \
  \           break;\n                    case 3:\n                        s.display();\n\
  \                        break;\n                    case 4:\n                 \
  \       flag = false;\n                        System.out.println(\"Terminated...\"\
  );\n                        break;\n                    default:\n             \
  \           System.out.println(\"Wrong choice\");\n                        break;\n\
  \                }\n            }\n        } catch (Exception e) {\n           \
  \ System.out.println(e.getMessage());\n        }\n    }\n}\n```\n\n程序的输出所示：\n\n\
