    No good systematic estimates of surviving elephants are available before 1970,
    and continent-wide estimates indicate steady declines during the closing decades
    of the 20th century. The Great Elephant Census, a project funded by the late Microsoft
    cofounder Paul G. Allen, relied on aerial surveys of about 80 percent of the savanna’s
    range. When it was completed in 2016, its final count of 352,271 elephants was
    30 percent lower than the best estimate in the mid-1980s.'
