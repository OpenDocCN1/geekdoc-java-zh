  md: '# Moore’s Curse: Why technical progress takes longer than you think


    In 1965, Gordon Moore—at that time the director of R&D at Fairchild Semiconductor—noted
    that “the complexity for minimum component costs has increased at a rate of roughly
    a factor of two per year ... Certainly over the short term this rate can be expected
    to continue, if not to increase.” Over the longer term, the doubling rate settled
    at about two years, or an exponential growth rate of 35 percent per year. This
    is Moore’s Law.


    As components have gotten smaller, denser, faster, and cheaper, they have increased
    the power and cut the costs of many products and services, notably computers and
    mobile phones. The result has been a revolution in electronics.


    But this revolution has been both a blessing and a curse, for it has had the unintended
    effect of raising expectations for technical progress. We are assured that rapid
    progress will soon bring self-driving cars, individually tailored cancer cures,
    and instant 3D printing of hearts and kidneys. We are even told it will pave the
    way for the world’s transition from fossil fuels to renewable energies.


    But the doubling time for transistor density is no guide to technical progress
    generally. Modern life depends on many processes that improve rather slowly, not
    least the production of food and energy and the transportation of people and goods—and
    such slow rates prevail not only for pre-1950 advances but also for essential
    improvements and innovation coinciding with the development of transistors (their
    first commercial application was in hearing aids in 1952).'
  merge: -1
  img_proc: true
- pgno: 117
  md: '![](img/1055ff7c5aac304ec60cbf00b398a085_117_0.png)


    Corn, America''s leading crop, has seen its average yield rising by 2 percent
    a year since 1950. Yields of rice, China''s largest staple, have been going up
    by about 1.6 percent during the past 50 years. The efficiency with which steam
    turbogenerators convert thermal power to electricity generation rose annually
    by about 1.5 percent during the 20th century; if you instead compare the steam
    turbogenerators of 1900 with the combined-cycle power plants of 2000 (which make
    gas turbines to steam boilers), that annual rate increases to 1.8 percent. Advances
    in lighting have been more impressive than in any other sector of electricity
    conversion, but between 1881 and 2014 light efficacy (lumens per watt) rose by
    just 2.6 percent a'
  merge: -1
  img_proc: true
- pgno: 118
  md: 'year for indoor lights, and 3.1 percent for outdoor lighting (see WHY SUNLIGHT
    IS STILL BEST, p. 158).


    The speed of intercontinental travel rose from about 35 kilometers per hour for
    large ocean liners in 1900 to 885 km/h for the Boeing 707 in 1958, an average
    rise of 5.6 percent a year. But speed of jetliners has remained essentially constant
    ever since—the Boeing 787 cruises just a few percent faster than the 707. Between
    1973 and 2014, the fuel-conversion efficiency of new US passenger cars (even after
    excluding monstrous SUVs and pickups) rose at an annual rate of just 2.5 percent,
    from 13.5 to 37 miles per gallon (that’s 17.4 to 6.4 liters per 100 kilometers).
    And finally, the energy cost of steel (coke, natural gas, and electricity), our
    civilization’s most essential metal, was reduced from about 50 gigajoules per
    ton to less than 20 between 1950 and 2010—that is, an annual rate of about −1.7
    percent.


    Energy, material, and transportation fundamentals that enable the functioning
    of modern civilization and that circumscribe its scope of action are improving
    steadily but slowly. Gains in performance mostly range from 1.5 to 3 percent a
    year, as do the declines in cost.


    And so, outside the microchip-dominated world, innovation simply does not obey
    Moore’s Law, proceeding at rates that are lower by an order of magnitude.'
