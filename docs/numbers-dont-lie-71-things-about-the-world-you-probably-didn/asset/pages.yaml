  md: '# Inventing integrated circuits


    In 1958, 11 years after Bell Labs reinvented the transistor, it became clear that
    semiconductors would be able to conquer the electronics market only if they could
    be greatly miniaturized. There wasn’t much progress to be made by hand-soldering
    separate components into circuits, but as is often the case, the solution came
    just when it was needed.


    In July 1958, Jack S. Kilby of Texas Instruments came up with the monolithic idea.
    His patent application described it as “a novel miniaturized electronic circuit
    fabricated from a body of semiconductor material containing a diffused p-n junction
    wherein all components of the electronic circuit are completely integrated into
    the body of semiconductor material.” And Kilby stressed that “there is no limit
    upon the complexity or configuration of circuits which can be made in this manner.


    The idea was perfect, but its execution—as depicted in Kilby’s February 1959 patent
    application—was unusable, because it had the wire connections raising, arch-like,
    above the wafer’s surface, hardly the way to make a planar component. Kilby knew
    that this wouldn’t work, and that is why he added a note about connections to
    be made in other ways. As an example, he mentioned gold deposited on the thin
    silicon oxide layer on the wafer’s surface.'
  merge: -1
  img_proc: true
- pgno: 114
  md: '![](img/1055ff7c5aac304ec60cbf00b398a085_114_0.png)


    Integrated circuit: Kilby’s “flying widgets” patent


    Unbeknown to him, in January 1959, Robert Noyce, then the director of research
    at Fairchild Semiconductor Corporation, was to jot down in his lab notebook an
    improved version of the very same idea. “It would be desirable to make multiple
    devices on a single piece of silicon, in order to be able to make interconnections
    between devices as part of the manufacturing process, and then reduce size, weight,
    as well as cost per active element,” Noyce wrote. Moreover, the drawing accompanying
    Noyce’s 1959 patent application contained no flying wires; instead, it clearly
    depicted a planar transistor and “leads in the form of vacuum-deposited or otherwise
    metal strips extending over and adherent to the insulating layer for making electrical
    connections to and between various regions of the semiconductor body without shorting
    the junctions.


    Noyce’s patent was granted in April 1961; Kilby’s in July 1964. The litigation
    went all the way to the Supreme Court, which in 1970 refused to hear the case,
    upholding a lower court’s ruling of Noyce’s priority. That decision had no practical
    difference, because in 1966 the two companies had agreed to share their production
    licenses, and the origins of the integrated circuit became yet another outstanding
    example of concurrent independent inventions. The basic conceptual idea was identical;
    both inventors received the National Medal of Science, and both were inducted
    into the National Inventors Hall of Fame. Noyce lived only to 62, but Kilby survived
    to share a Nobel Prize in Physics in 2000 at the age of 77, five years before
    his death.


    Texas Instruments called the new designs “Micrologic elements.” They were chosen
    to control intercontinental ballistic missiles and to help land men on the Moon.'
  merge: -1
  img_proc: true
- pgno: 115
  md: '![](img/1055ff7c5aac304ec60cbf00b398a085_115_0.png)


    FIG. 3 Integrated circuit: Noyes''s planar patent


    Their subsequent progress, captured by the still-enduring Moore''s Law (see MOORE''S
    CURSE: WHY TECHNICAL PROGRESS TAKES LONGER THAN YOU THINK, p. 125), has been one
    of the defining developments of our time. 1971, basic integrated circuits had
    matured into simple microprocessors with thousands of components, which then advanced
    to designs that made personal computing affordable, starting in the mid-1980s.
    By 2003, the component total had surpassed 100 million, and by 2015 it reached
    10 billion transistors. That represents an aggregate growth of eight orders of
    magnitude since 1965, averaging about 37 percent a year, with the number of components
    on a given area doubling about every every two years. This means that in comparison
    with the latest capabilities, the equivalent performance during the mid-1960s
    would have required components 100 million times larger. As physicist Richard
    Feynman famously said, there''s plenty of room at the bottom.'
