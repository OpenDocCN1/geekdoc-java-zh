- pgno: 239
  md: '# Concrete facts


    Ancient Romans invented concrete, a mixture of aggregate (sand, crushed stone),
    water, and a bonding agent. They called it opus cementitium, and this widely used
    construction material did not contain modern cement (of lime, clay, and metallic
    oxides fired in rotating kilns at a high temperature and then ground into fine
    powder) rather a mixture of gypsum and quickline—and its best variety was made
    with volcanic sand from Puteoli near Mount Vesuvius. Its addition produced an
    outstanding material fit for massive vaults (Rome’s Pantheon, 118–126 CE, remains
    the world’s largest non-reinforced concrete dome) as well as for underwater construction
    in many ports around the Mediterranean, including ancient Caesarea (located in
    today’s Israel).


    Production of modern cement began in 1824, when Joseph Aspdin patented his firing
    of limestone and clay at high temperatures. Transformation of alumina and silica
    materials into a non-crystalline amorphous solid (vitrification, the same kind
    of process that is used to make glass) produces small nodules or lumps of a glassy
    clinker that is ground to make cement. Cement is then mixed with water (10–15
    percent of the final mass) and aggregates (sand and gravel, making up 60–75 percent
    of the total mass) to produce concrete, a deformable material that is strong under
    compression but weak in tension.'
  merge: -1
  img_proc: true
- pgno: 240
  md: '![](img/1055ff7c5aac304ec60cbf00b398a085_240_0.png)


    Weakness in tension can be reduced by the reinforcement with steel. The first
    attempts to do that took place in France in the early 1860s, but the technique
    only took off during the 1880s. The 20th century was the era of reinforced concrete.
    In 1903, Cincinnati''s Ingalls Building became the world''s first reinforced-steel
    skyscraper; during the 1930s, structural engineers began to use pre-stressed concrete
    (with tensioned steel wires or bars); and since 1950 the material has been used
    for buildings of all heights and functions—the Burj Khalifa tower in Dubai is
    the world''s tallest, while Jorn Utzon''s sail-like Sydney Opera House is perhaps
    the material''s visually most impressive application. Reinforced concrete made
    it possible to build massive hydroelectric dams: the world''s largest, China''s
    Three Gorges dam, contains three times as much as it Grand Coulee, America''s
    largest. Concrete bridges are also common: Beipan River Bridge is now the world''s
    longest concrete arch bridge, spanning the 445-meter gorge between two Chinese
    provinces. But mostly, concrete is deployed in'
  merge: -1
  img_proc: true
- pgno: 241
  md: 'visually unremarkable ways, in the form of billions of railroad sleepers, paved
    roads, freeways, parking lots, ports, and airport runways and taxiways.


    Between 1900 and 1928, the US consumption of cement rose tenfold to 30 million
    tons, and the postwar economic expansion (including the construction of the Interstate
    Highway System, which requires about 10,000 tons of concrete per kilometer) raised
    it to the peak of about 128 million tons by 2005, with the latest rates less than
    100 million tons a year.


    China became the world''s largest producer in 1986, and its output of cement—more
    than 2.3 billion tons in 2018—now accounts for nearly 60 percent of the global
    total. The most impressive illustration of China''s unprecedented construction
    effort is that in the last two years the country employed more cement (about 4.7
    billion tons) than the US cumulatively throughout the entire 20th century (about
    4.6 billion tons)!


    But concrete is not an everlasting material, and the Pantheon''s extraordinary
    longevity is a rare exception. Concrete deteriorates in all climates, and the
    process is accelerated by factors ranging from acid deposition to vibration, and
    from structural overloading to salt-induced de-icing and corrosion; and in warm
    and humid environments, algal growth blackens the exposed surfaces. As a result,
    the post-1950 planet-wide concretization has produced tens of billions of tons
    of material that will have to be either replaced or destroyed (or simply abandoned)
    in the coming decades.


    The material''s environmental impact is another worry. Air pollution (fine dust)
    from cement production can be captured by filter bags, but the industry (burning
    inferior fuels as low-quality coal and petroleum coke) remains a significant source
    of carbon dioxide, emitting roughly a ton of the gas per ton of cement. For comparison,
    producing a ton of steel is associated with emissions of about 1.8 tons of CO$_2$.


    Production of cement now accounts for about 5 percent of global CO$_2$ emissions
    from fossil fuels, but its carbon footprint can be lowered by a variety of measures.
    Old concrete can be recycled, and the crushed material can be reused in construction.
    Blast furnace slag or fly ash captured in coal-fire power plants can replace some
    of the cement in mixing concrete. There are also several new low-carbon or no-carbon
    cement-making processes, but these alternatives will be making only small annual
    dents in a global output that is now surpassing 4 billion tons.'
  merge: -1
  img_proc: true
- pgno: 242
  md: '# What’s worse for the environment—your car or your phone?


    Statistics on the production of energy are fairly reliable; accurate statistics
    on the consumption of energy by major sectors are harder to come by; and data
    on the energy consumed in the production of specific goods are even less reliable.
    Such energy embodied in products is part of the environmental price we pay for
    everything we own and use.


    The estimation of the embodied energy of finished goods relies not only on indisputable
    facts—so much steel in a car, so many microchips in a computer—but also on the
    inevitable simplifications and assumptions that must be made to derive overall
    rates. Which model of car? Which computer or phone? The challenge is to select
    reasonable, representative rates; the reward is to get a new perspective on the
    man-made world.


    Let’s focus on mobile devices and cars. Mobile devices, because they are the primary
    enablers of instant communication and boundless information; cars, because people
    still want to move in the real world.


    Obviously, a car weighing 1.4 tons (about as much as a Honda Accord LX) embodies
    more energy than the 140 grams of a smartphone (say, a Samsung Galaxy). But the
    energy gap is nowhere near so great as that 10,000-fold difference in mass.'
  merge: -1
  img_proc: true
