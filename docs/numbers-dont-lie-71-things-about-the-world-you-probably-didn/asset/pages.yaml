  md: '# Shrinking the journey across the Atlantic


    Commercial sailing ships had long taken three—sometimes four—weeks to make the
    eastbound crossing of the Atlantic; the westbound route, against the wind, usually
    took six weeks. The first meant to make the eastward crossing was in 1833, when
    the Quebec-built SS Royal William went to England after stopping to take coal
    in Nova Scotia. It was only in April 1838 that steamships pioneered the westward
    route. And it happened in an unexpectedly dramatic way.


    Isambard Kingdom Brunel, one of the great 19th-century British engineers, built
    the SS Great Western for the Great Western Steamship Company’s planned Bristol–New
    York run. The ship was ready on March 31, 1838, but a fire onboard delayed the
    scheduled departure until April 8.


    Meanwhile, the British and American Steam Navigation Company tried to steal a
    march by chartering the SS Sirius, a small wooden paddle-wheel vessel built for
    the Irish (London–Cork) service. The Sirius left Cobh, Ireland, on April 4, 1838,
    its boilers operating under 33 kilopascals for a peak engine power of 370 kilowatts
    (for comparison, a 2019 Ford Mustang is rated at 342 kilowatts). With 460 tons
    of coal onboard, the ship could travel nearly 5,400 kilometers (2,916 nautical
    miles)—almost, but not quite, all the way to New York Harbor.'
  merge: -1
  img_proc: true
- pgno: 162
  md: 'Brunel''s Great Western: the paddle-wheel, steam-engine-powered ship still
    had the rigging for sails


    In contrast, the Great Western was the world''s largest passenger ship, with 128
    beds in first class. The ship''s boilers also worked at 34 kilopascals but its
    engines could deliver about 560 kilowatts (the power of today''s industrial diesel
    generators), and on its first transatlantic journey it averaged 16.04 kilometers
    per hour (slower than today''s best marathon runners, who average just over 21
    km/h). Even with its four-day head start, the Sirius (averaging 14.87 km/h) barely
    beat the larger and faster ship, arriving in New York on April 22, 1838—after
    18 days, 14 hours, and 22 minutes.


    Later stories dramatized the final dash by claiming that the Sirius ran out of
    coal and had to burn furniture and even its spars to reach the port. Not true,
    but it did have to burn several drums of resin. When the Great Western arrived
    the next day, after 15 days and 12 hours, even after burning 655 tons of coal
    it still had 200 tons to spare.


    Steam more than halved the transatlantic travel time, and new records kept coming.
    By 1848, Cunard''s SS Europa crossed in 8 days and 23 hours. By 1888, a crossing
    took barely 6 days; and in 1907, the steam


    ![](img/1055ff7c5aac304ec60cbf00b398a085_162_0.png)'
  merge: -1
  img_proc: true
- pgno: 163
  md: 'turbine-powered RMS Lusitania won the Blue Riband (the trophy for the fastest
    Atlantic crossing) with a time of 4 days, 19 hours, and 52 minutes. The final
    record-holder, SS United States, made it in 3 days, 10 hours, and 40 minutes,
    in 1952.


    The next era, in which commercial piston-engine aircraft crossed in 14 or more
    hours, was by 1958 America''s first commercial turbojet, the Boeing 707, making
    regularly scheduled flights from London to New York in less than 8 hours (see
    WHEN DID THE JET AGE BEGIN?, p. 204). Cruising speeds have not changed much: the
    Boeing 787 Dreamliner cruises at 913 km/h, and London–New York flights still last
    about 7.5 hours.


    The expensive, noisy, and ill-fated supersonic Concorde could do it in 3.5 hours,
    but that bird will never fly again. Several companies are now developing supersonic
    transport planes, and Airbus has patented a hypersonic concept with a cruising
    speed of 4.5 times the speed of sound. Such a plane would arrive at JFK International
    just one hour after leaving Heathrow.


    But do we really need such speed at a much higher energy cost? Compared with the
    Sirius''s time in 1838, we have cut the crossing time by more than 98 percent.
    The time aloft is just right for reading a substantial novel—or even this book,
    perhaps.'
