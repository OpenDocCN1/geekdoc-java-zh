  md: '# What happens when we have fewer children?


    Total fertility rate (TFR) is the number of children born per woman during her
    lifetime. The most obvious physical constraint on this is the length of the fertile
    period (from menarche to menopause). The age of first menstruation (has been decreasing
    from about 17 years in preindustrial societies to less than 13 years in today''s
    Western world, while the average onset of menopause has advanced slightly, to
    just above 50, resulting in a typical fertile span of some 38 years compared to
    about 30 years in traditional societies.


    There are 300–400 ovulations during the fertile lifespan. As every pregnancy precludes
    10 ovulations and because an additional 5–6 ovulations have to be subtracted for
    each pregnancy, due to the reduced chance of conception during the traditionally
    prolonged breastfeeding period, the maximum fertility rate is about two dozen
    pregnancies. With multiple births the total can be in excess of 24 live births,
    confirmed by historical records of women having more than 30 children.


    But have always been much lower than this, due to the combination of pregnancy
    loss, still births, infertility, and premature maternal mortality. These realities
    reduce maximum population-wide fertilities to 7–8; indeed, such rates were common
    on all continents into the 19th century, and in parts of Asia until two generations
    ago, and they can still be found in SubSaharan Africa, with Niger at 7.5 (which
    is well below the preferred family size: when asked, the average number of children
    that Nigerian women would prefer is 9.1!). But even in that region, the TFR—although
    still high—has declined (to 5–6 in most of those countries), and the rest of the
    world lives with moderate, low, and extremely low fertilities.'
  merge: -1
  img_proc: true
