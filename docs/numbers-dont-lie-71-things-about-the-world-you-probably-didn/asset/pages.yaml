- pgno: 123
  md: '# Being realistic about innovation


    Modern societies are obsessed with innovation. At the end of 2019, Google searches
    returned 3.21 billion hits for “innovation,” easily beating “terrorism” (481 million),
    “economic growth” (about 1 billion), and “global warming”. We are to believe that
    innovation will open every conceivable door: to life expectancies far beyond 100
    years, to the merging of human and machine consciousness, to essentially free
    solar energy.


    This uncritical genuflection before the altar of innovation is wrong on two counts:
    It ignores those big, fundamental quests that have failed after spending huge
    sums on research. And it has little to say why we often stick to an inferior practice
    even when we know there’s a superior course of action.


    The fast breeder reactor, so called because it produces more nuclear fuel than
    it consumes, is one of the most remarkable examples of a prolonged and costly
    innovation failure. In 1974, General Electric predicted that by 2000 90 percent
    of the United States’ electricity would come from fast breeders. GE was merely
    reflecting a widespread expectation: during the 1970s, the governments of France,
    Japan, the Soviet Union, the United Kingdom, and the United States were all investing
    heavily in the development of breeders. By high costs, technical problems, and
    environmental concerns led to shutdowns of British, French, Japanese, American
    (and also smaller German and Italian) programs, while China, India, Japan, and
    Russia are still operating experimental reactors. After the world as a whole spent
    well above $100 billion in today’s money over some six decades of effort, there
    has been no real payoff.'
  merge: -1
  img_proc: true
- pgno: 124
  md: '![](img/1055ff7c5aac304ec60cbf00b398a085_124_0.png)


    Other promised fundamental innovations that are still not commercial concerns
    include hydrogen (fuel cell) powered cars, magnetic levitation (maglev) trains,
    and thermonuclear energy. The last one is perhaps the most notorious example of
    an ever-receding innovative achievement.


    The second category of failed innovations—things we keep on doing even though
    we know we shouldn’t—range from quotidian practices to theoretical concepts.


    Two annoying examples are daylight saving time and boarding airplanes. Why do
    we keep imposing “daylight saving time” changes semiannually (energy savings a
    justification of (the switch) when we know they don’t really save anything? And
    commercial flights now take longer to board during the 1970s depite the fact that
    we know a number of methods that are faster than the current inefficient favorites.
    For example, we might be seating people in a reverse pyramid, alternately boarding
    them at the back and at the front simultaneously (spreading things out to minimize
    bottlenecks), or simply by abolishing assigned seating.'
  merge: -1
  img_proc: true
- pgno: 125
  md: 'And why do we measure the progress of economies by gross domestic product?
    GDP is simply the total annual value of all goods and services transacted in a
    country. It rises not only when lives get better and economies progress but also
    when bad things happen to people or to the environment. Higher alcohol sales,
    more driving under the influence, more accidents, more emergency-room admissions,
    more injuries, more people in jail—GDP goes up. More illegal logging in the tropics,
    more deforestation and biodiversity loss, higher timber sales—again, GDP goes
    up. We know better, but we still worship high annual GDP growth rate, regardless
    of where it comes from.


    Human minds have many irrational preferences: we love to speculate about wild
    and crazy innovations but cannot be bothered to fix common challenges by relying
    on practical innovation waiting to be implemented. Why do we not improve the boarding
    of planes rather than delude ourselves with visions of hyperloop trains and eternal
    life?'
  merge: -1
