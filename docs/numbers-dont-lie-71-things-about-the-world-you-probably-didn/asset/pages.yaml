- pgno: 253
  md: 'And my progress through a succession of fuels and efficiencies has been replicated
    by tens of millions of people in the northern hemisphere. Thanks to North America''s
    cheap natural gas and to the combination of (more expensive but readily available)
    Dutch, North Sea, and Russian gas in Europe—the cleanest of all fossil fuels—is
    what most of the people in northern climates have come to rely on, in place of
    wood, coal, and fuel oil. In Canada, the production of mid-efficiency (78 to 84
    percent) furnaces ended in 2009, and all new houses are now mandated to have high-efficiency
    (at least 90 percent) furnaces. The same will soon be true elsewhere in the West,
    while rising gas imports are already causing China to shift its heating from coal
    to gas.


    Future efficiency gains will have to come from somewhere else. Better insulation
    of the outer-facing part of the house (especially better windows) is the obvious
    (albeit often expensive) first step. Air-source heat pumps, transferring heat
    via a heat exchanger, have become popular in many places and are effective as
    long as temperatures do not dip below freezing; in cold regions they still need
    winter backup. Solar heating is possible, too, but in cold climates, it doesn’t
    work very well where and when it’s needed most—in very cold climates, during prolonged
    spells of cold but overcast weather, blizzards, and with the solar modules under
    heavy snow cover.


    Will the long-term need to limit global warming eventually lead to something unthinkable?
    I am referring to the most economically sensible choice, and the one that would
    make the greatest, longest-lasting contribution to reducing the carbon burden
    of heating: limiting the size of houses. We could do away with McMansions—mass-built
    houses with masses of floor space—in North America. Doing away with similar houses
    in the tropics would save on the opposite expense—energy currently wasted on air
    conditioning. Who’s up for that?'
