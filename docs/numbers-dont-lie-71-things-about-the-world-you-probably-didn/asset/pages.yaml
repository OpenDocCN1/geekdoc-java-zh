- pgno: 59
  md: 'Excusing that very poor rating by saying that the European countries have homogeneous
    populations does not work: modern France and Germany are full of recent immigrants
    (just spend some time in Marseille or Düsseldorf). What matters more is parental
    knowledge, good nutrition, the extent of economic inequality, and access to universal
    healthcare, the United States being (notoriously) the only modern affluent country
    without the latter.


    And looking at the journey’s end gives an almost identically poor result: recent
    US life expectancy (nearly 79 years for both sexes) does not even rank among the
    top dozen countries worldwide, and is—again—behind Greece (about 81), as well
    as South Korea (nearly 83). Canadians live more than three years longer on average
    and Japanese (about 84) nearly six years longer as compared to their US counterparts.


    Educational achievements of US students (or a lack thereof) are scrutinized with
    every new edition of the Organisation for Economic Co-operation and Development’s
    Program for International Student Assessment, or PISA. The latest results (2018)
    for 15-year-olds show that, in math, the United States ranks just below Russia,
    Slovakia, and Spain, but far lower than Canada, Germany, and Japan. In science,
    US schoolchildren place just below the mean PISA score (497 versus 501); in reading,
    they are barely above it (498 versus 496)—and they are far below the populous,
    affluent Western nations. PISA, like any study, has its weaknesses, and large
    differences in relative rankings are clear: there is no remote indication of any
    exceptional US educational achievements.


    American readers might find these facts disconcerting, but there is nothing quite
    aboutable. In the United States, babies are more likely to die and high schoolchildren
    are less likely to learn than their counterparts in other affluent countries.
    Politicians may look far and wide for evidence of American exceptionalism, but
    they won’t find it in the numbers, where it matters.'
