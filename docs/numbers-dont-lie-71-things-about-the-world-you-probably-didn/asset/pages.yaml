    aging population, and also in the United States, thanks to the increasing use
    of natural gas instead of coal. However, all these gains were outbalanced by Chinese
    carbon emissions, which rose from about 1 billion to about 3 billion tons—enough
    to increase the worldwide total by nearly 45 percent, to 10.1 billion tons.


    By burning huge stocks of carbon that fossilized ages, human beings have pushed
    carbon dioxide concentrations to levels not seen for about 3 million years. Through
    drilling deep into glaciers covering Antarctica and Greenland, we can recover
    slender tubes of ice that contain tiny bubbles, and as we drill deeper, increasingly
    older ice. By sampling the air locked in those tiny bubbles, we have been able
    to reconstruct the history of carbon dioxide concentrations going back 800,000
    years. Back then, the atmospheric levels of the gas fluctuated between 180 and
    280 parts per million (that is, from 0.018 to 0.028 percent). During the past
    millennium,'
  merge: -1
  img_proc: true
- pgno: 256
  md: 'the concentrations remained fairly stable, ranging from 275 ppm in the early
    1600s to about 285 ppm before the end of the 19th century.

    Continuous measurements of the gas began near the top of Mauna Loa in Hawaii,
    in 1958: the 1959 mean was 316 ppm, the 2015 average reached 400 ppm, and 415
    ppm was first recorded in May 2019.


    Emissions will continue to decline in affluent countries, and the rate at which
    they grow in China has begun to slow down. However, it is speeding up in India
    and Africa, and here it is unlikely that we will see any substantial global declines
    anytime soon

    .


    The Paris Agreement of 2015 was lauded as the first accord containing national
    commitments to reduce future emissions. Actually, only a small number of countries
    made specific promises, there is no binding enforcement mechanism, and even if
    all targets were met by 2030, carbon emissions would still rise to nearly 50 percent
    above the 2017 level. According to the 2018 study by the Intergovernmental Panel
    for Climate Change, the only way to keep the average world temperature rise to
    no more than 1.5°C would be to put emissions almost immediately into a decline
    enough to bring them to zero by 2050


    That is not impossible—but it is very unlikely. Reaching that goal would require
    nothing short of a fundamental transformation of the global economy on scales
    and at a speed unprecedented in human history, a task that would be impossible
    to do without major economic and social dislocations. The greatest challenge would
    be how to lift billions from poverty without relying on fossil carbon. The affluent
    world has used billions of tons of it to create its high quality of life, but
    right now we do not have any affordable non-carbon alternatives that could be
    rapidly deployed on mass scales in order to energize the production of enormous
    quantities of what I have called the four pillars of modern civilization—ammonia,
    steel, cement, and plastics—which will be needed in Africa and Asia in the decades
    to come. The contrasts between the expressed concerns about global warming, the
    continued release of record volumes of carbon, and our capabilities to change
    that in the near term could not be starker.'
