  md: '# Capturing motion—from horses to electrons


    Eadweard Muybridge (1830–1904), an English photographer, established his American
    fame in 1867 by taking a mobile studio to Yosemite Valley and producing large
    silver prints of its stunning vistas. Five years later he was hired by Leland
    Stanford, then the president of the Central Pacific Railroad, formerly the governor
    of California, and latterly the founder of the eponymous university in Palo Alto.
    Stanford—who was also a horse breeder—challenged Muybridge to settle the old dispute:
    whether all four of a horse’s legs are off the ground when running.'
  merge: -1
  img_proc: true
- pgno: 108
  md: '![](img/1055ff7c5aac304ec60cbf00b398a085_108_0.png)


    Muybridge''s galloping horse


    Muybridge found it difficult to prove the point. In 1872 he took (and then lost)
    a single image of a trotting horse with all hooves aloft. But he persevered, and
    his eventual solution was to capture moving objects with cameras capable of a
    shutter speed as brief as 1/1,000 of a second.


    The conclusive experiment took place on June 19, 1978, at Stanford’s Palo Alto
    farm. Muybridge lined up-triggered glass-plate cameras along the track, used a
    white-sheet background for the best contrast, and copied the resulting images
    as a sequence of still photographs (silhouettes) on the disc of a simple circular
    device he called a zoopraxiscope, in which a rapid series of rotating stills conveyed
    motion.


    Sallie Gardner, the horse Stanford had provided for the test, clearly did all
    four hooves off the ground at the gallop. But the airborne moment did not take
    place as portrayed in famous paintings, perhaps most notably Théodore Géricault’s
    The 1821 Derby at Epsom, now hanging in the Louvre, which shows the animal’s legs
    extended away from its body.'
  merge: -1
  img_proc: true
- pgno: 109
  md: 'Instead, it occurred when the horse''s legs were beneath its body, just prior
    to the moment the horse pushed off with its hind legs.


    This work led to Muybridge''s *magnum opus*, which he prepared for the University
    of Pennsylvania. Starting in 1883, he began an extensive series depicting animal
    and human locomotion. Its creation relied on 24 cameras fixed in parallel to a
    36-meter-long track with two portable sets of 12 batteries at each end. The track
    had a marked background, and animals or people activated shutters by breaking
    stretched strings.


    The final product was a book with 781 plates, published in 1887. This compendium
    showed not only domestic animals (dogs and cats, cows and pigs) but also a bison,
    a deer, an elephant, and a tiger, as well as a running ostrich and a flying parrot.
    Human sequences depicted running, and also ascents, descents, lifts, thrusts,
    wrestling, a child crawling, and a woman pouring a bucket of water over another
    woman.


    Muybridge''s 1,000 frames a second became 10,000. By 1940, the patented design
    of a rotating mirror camera raised the rate to 1 million per second. In 1999,
    Ahmed Zewail won the Nobel Prize in Chemistry for developing a spectograph that
    could capture the transition states of chemical reactions on a scale of femtoseconds—that
    is, $10^{-15}$ seconds, or one-millionth of one-billionth of a second.


    Today, we can use intense, ultrafast laser pulses to capture events separated
    by mere attoseconds, or $10^{-18}$ seconds. This time resolution makes it possible
    to see what has until recently hidden from any direct experimental access: the
    motions of electrons on the atomic scale.


    Many examples can be given to illustrate the extraordinary scientific and engineering
    progress we have made since the decades of the 19th century, and several impressive
    cases—including the luminous efficacy of light (see WHY SUNLIGHT IS STILL BEST,
    p. 158) and the income-performance-adjusted cost of electricity (see THE REAL
    COST OF ELECTRICITY, p. 170)—are detailed in this book, but the contrast between
    the discoveries of Eadward Muybridge and Ahmed Zewail is as impressive as any
    other advance I can think of: from settling the dispute about airborne horse hooves
    to observing fleetinging electrons.'
  merge: -1
  img_proc: true
