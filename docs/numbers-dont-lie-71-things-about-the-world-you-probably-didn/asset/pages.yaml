- pgno: 164
  md: '# Engines are older than bicycles!


    Some technical advances are delayed by either a failure of imagination or a concatenation
    of obstructive circumstances. I can think of no better example of both of these
    than the bicycle.


    Over two centuries ago in Mannheim, on June 12, 1817, Karl Drais, a forester in
    Germany’s grand duchy of Baden, demonstrated for the first time his Laufmaschine
    (“running machine”), later also known as a “draisine” or hobby-horse. With the
    seat in the middle, front-wheel steering, and wheels of the same diameter, it
    was the archetype of all later vehicles that required constant balancing. However,
    it was propelled not by pedaling but by pushing one’s feet against the ground,
    Fred Flintstone fashion.


    Drais covered nearly 16 kilometers in little than an hour on his heavy wooden
    bicycle, faster than the typical horse-drawn carriage. But it’s obvious, today
    at least, that the design was clumsy and there weren’t yet enough suitable hard-top
    roads. Why in the decades after 1820 that abounded with such inventions as locomotives,
    steamships, and manufacturing techniques, did it take so long to come up with
    a means of propulsion that could make the bicycle a practical machine, able to
    be ridden by anybody but infants?'
  merge: -1
  img_proc: true
- pgno: 165
  md: '![](img/1055ff7c5aac304ec60cbf00b398a085_165_0.png)


    # John Kemp Starley''s Rover safety bicycle


    Several answers are obvious. Wooden bicycles were heavy and clumsy, and the cheap
    steel parts (frame, rims, spokes) required to design durable machines were not
    yet available. Unpaved roads offered only uncomfortable rides. Pneumatic tires
    were not invented until the late 1880s (see the next chapter). And urban incomes
    had to rise first in order for a larger-scale adoption of what was essentially
    a leisure machine.


    Only in 1866 did Pierre Lallement get his US patent for a bicycle propelled by
    pedals attached to a slightly larger front wheel. And starting in 1868, Pierre
    Michaux made this vélocipède design popular in France. The Michaudine did not
    become the precursor of modern bicycles; it was an ephemeral novelty. The entire
    1870s and the early 1880s were dominated by high-wheelers (also known as “ordinary”
    or penny-farthing bicycles), their pedals attached directly to the axles of front
    wheels with diameters of up to 1.5 meters to provide a longer distance per pedal
    revolution. These clumsy machines could be fast, but they were also'
  merge: -1
  img_proc: true
- pgno: 166
  md: 'difficult to mount and tricky to steer; their use called for dexterity, stamina,
    and a tolerance for dangerous falls.


    It wasn''t until 1885 that two British inventors, John Kemp Starley and William
    Sutton, began to offer their Rover safety bicycles with equally sized wheels,
    direct steering, a chain and sprocket drive, and a tubular steel frame. Although
    it was not quite yet in the classic diamond shape, it was a truly modern bicycle
    design, ready for mass-adoption. The trend accelerated in 1888, with the introduction
    of John Dunlop''s pneumatic tires.


    So, a simple balancing machine consisting of two equally sized wheels, a minimal
    metal frame, and a short drive chain emerged more than a century after Watt''s
    improved steam engines (1765), more than half a century after the introduction
    of mechanically far more complex locomotives (1829), years after the first commercial
    generation of electricity (1882)—but concurrently with the first designs of automobiles.
    The first light internal combustion engines were mounted on three- or four-wheel
    carriages by Karl Benz, Gottlieb Daimler, and Wilhelm Maybach in 1886.


    And although cars changed enormously between 1886 and 1976, bicycle design remained
    remarkably conservative. The first purpose-built mountain bikes came only in 1977.
    Widespread adoption of such novelties as expensive alloys, composite materials,
    strange-looking frames, solid wheels, and upturned handlebars began only during
    the 1980s.'
  merge: -1
  img_proc: true
- pgno: 167
  md: '# The surprising story of inflatable tires


    Famous inventions are few, and they generally carry the name of a person or institution.
    Edison’s lightbulb and Bell Labs’ transistor are perhaps the most notable examples
    in this very small category, although Edison did not invent the lightbulb (just
    its more durable version), and Bell Labs merely reinvented the transistor (the
    solid-state device was patented in 1925 by Julius Edgar Lilienfeld).


    At the other end of the recognition spectrum is the much larger category of epoch-making
    inventions whose origins are obscure. There is no better example of this than
    the inflatable tire, invented by one John Boyd Dunlop, a Scotsman living in Ireland.
    His British patent dates back over 130 years, to December 7, 1888.


    Before Dunlop, the best bet was the solid rubber tire, which had been available
    ever since Charles Goodyear’s vulcanization process (heating rubber with sulfur
    to increase its elasticity, patented in 1844) made it possible to produce durable
    rubber. Although such tires were a major improvement on solid wooden wheels or
    spoked wheels with iron rims, they still gave a jarring ride.


    Dunlop devised his prototype, in 1887, to smooth the bumpy ride of his son’s tricycle.
    It was a primitive product—simply an inflated tube that was tied off, wrapped
    in linen, and fastened to a solid wooden tricycle wheel by nails.'
