  md: '# # The slow rise of photovoltaics


    In March 1958, a rocket lifted off from Cape Canaveral bearing the Vanguard 1
    satellite: a small, 1.46-kilogram aluminum sphere that was the first to use photovoltaic
    (PV) cells in orbit.


    As a safeguard, the satellite’s two transmitters drew power from mercury batteries,
    but they failed after just three months. The photoelectric effect, the six small
    monocrystalline silicon cells—absorbing light (photons) at the atomic level and
    releasing electrons—could deliver a total of 1 watt, and it kept powering a beacon
    transmitter until May 1964.


    It happened because, in space, cost was no object. In the mid-1950s, PV cells
    ran about $300 per watt. The cost fell to about $80/W in the mid-1970s, to $10/W
    by the late 1980s, to $1/W by 2011, and by late 2019 PV cells were selling for
    just 8–12 cents per watt, with further declines certain to come (of course, the
    cost of installing PV panels and associated equipment in order to generate electricity
    is substantially higher, depending on the scale of a project: they now range from
    tiny roof installations to large solar fields in deserts).


    This is good news, because PV cells have a higher power density than any other
    form of renewable energy conversion. Even as an annual average they already reach
    10 watts per square meter in sunny places, more than an order of magnitude higher
    than biofuels can manage. And with rising conversion efficiencies and better tracking,
    it should be possible to increase the annual capacity factors by 20–40 percent.'
  merge: -1
  img_proc: true
