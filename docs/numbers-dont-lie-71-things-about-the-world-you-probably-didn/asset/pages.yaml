- pgno: 15
  md: 'The transition toward this new world began at different times, not only among
    different regions but also within regions: France was far ahead of Italy, Japan
    far ahead of China—and Communist China eventually took the drastic step of restricting
    families to a single child. That aside, desire for fewer children has been driven
    by an often highly synergistic combination of gradually rising standards of living,
    the mechanization of agricultural work, the displacement of animals and people
    by machines, mass-scale industrialization and urbanization, increasing numbers
    of females in the urban labor force, advancing universal education, better healthcare,
    a higher survival rate of newborns, and government-guaranteed pensions.


    A historic pursuit of quantity turned, sometimes rapidly, into the quest for quality:
    the benefits of high fertility (ensuring survival amid high infant mortality;
    supplying additional labor force; providing old-age insurance) began to weaken
    and then to disappear, and smaller families invested more in their children and
    in raising their quality of life, usually starting with better nutrition (more
    meat and fresh fruit; more eating out) and ending with SUVs and flights to distant
    tropical beaches.


    As is often the case in both social and technical transitions, the pathbreakers
    took a long time to accomplish the change, while some adopters completed the process
    in just two generations. The shift from high fertility took about two centuries
    in Denmark and over 170 years in Sweden. In contrast, South Korean fertility fell
    from more than 6 TFR to below the replacement level in just 30 years, and even
    before the introduction of the one-child policy, Chinese fertility plummeted from
    1962 to 2.6 in 1980. The unlikely record holder is Iran. In 1979, when the monarchy
    was overthrown and Ayatollah Khomeini returned from exile to establish a theocracy,
    Iran''s fertility averaged 6.5, but by the year 2000 it was down to the replacement
    level and it has continued to fall.


    The replacement level of fertility is that maintains a population at a stable
    level. It is about 2.1, with the additional fraction needed to make up for girls
    who will not survive into fertility age. No country has been able to stop the
    fertility decline at the replacement level and achieve a stationary population.
    An increasing share of humanity lives in societies with below-'
  merge: -1
  img_proc: true
- pgno: 16
  md: 'replacement fertility levels. In 1950, 40 percent of humanity lived in countries
    with fertilities above 6 and the mean rate was about 5; by the year 2000, just
    5 percent of the global population was in countries with fertilities above 6,
    and the mean (2.6) was close to the replacement level. By 2050, nearly three-quarters
    of humanity will reside in countries with below-replacement fertility.


    This global shift has had enormous demographic, economic, and strategic implications.
    European importance has diminished (in 1900 the continent had about 18 percent
    of the world’s population; in 2020 it has had only 9.5 percent) and Asia has ascended
    (60 percent of the world total in 2020), but regional high fertilities guarantee
    that nearly 75 percent of all births between 2020 and 2070 will be in Africa.


    And what does the future hold for countries whose fertility has fallen below the
    replacement level? (no lower than 1.7; France and Sweden were at 1.8 in 2019),
    then there is a good chance of possible future rebounds. Once they slip below
    1.5, such reversals appear increasingly unlikely; in 2019, there were record lows
    of 1.3 in Spain, Italy, and Romania, and 1.4 in Japan, Ukraine, Greece, and Croatia.
    Gradual population decline (with all of its social, economic, and strategic implications)
    seems to be the future of Japan and of many European countries. So far, no pro-natalist
    government policies have brought any major reversal, and the only obvious option
    to prevent depopulation is to open the gates for immigration—but that looks unlikely
    to happen.'
  merge: -1
