  md: '# # What makes people happy?


    To answer that question, it would be very helpful to know which societies actually
    consider themselves significantly happier than others—and, since 2012, this is
    as easy as consulting the latest edition of the World Happiness Report, now published
    annually in New York by the United Nations Sustainable Development Network. In
    2019 (summing up data and surveys from 2016-18), Finland was the world''s happiest
    country for the second time in a row, followed by Denmark, Norway, and Iceland;
    the Netherlands and Switzerland came just after Sweden, which means that the Nordic
    nations took five of the seven spots. The top 10 rounded out by New Zealand, Canada,
    and Austria. The second group of 10 started with Australia and ended with the
    Czech Republic: the UK was number 15, Germany number 17, and the US squeezed in
    at number 19.


    This is what gets reported in the media, admiring the ever-happy Nordics and pointing
    out how America’s (badly distributed) riches cannot buy happiness. What rarely
    gets reported is what actually goes into constructing these national scores: GDP
    per capita, social support (determined by asking if, when in trouble, people have
    relatives or friends to count on), healthy life expectancy (taken from the World
    Health Organization’s assessment of 100 different health factors), freedom to
    make life choices (scored by answering the question “Are you satisfied or dissatisfied
    with your freedom to choose what you do with your life?”), generosity (“Have you
    donated money to a charity in the past month?”), and perceptions of corruption
    (\u201out the government and within business).'
  merge: -1
  img_proc: true
