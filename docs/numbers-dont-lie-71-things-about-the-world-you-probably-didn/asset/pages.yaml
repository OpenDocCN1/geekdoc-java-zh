    But this tilt toward a significantly more plant-based diet is less important than
    the share of food energy coming from fats (lipids, be they of plant or animal
    origin) and sugar and other sweeteners. In both the US and France, dietary fat
    provides almost twice (1.8 to be exact) more food energy than in Japan, while
    Americans have at their daily disposal 2.5 times more sugar and sweeteners (dominated
    in the US by high-fructose corn syrup) than the Japanese, with the multiple about
    1.5 for France. Always keeping in mind that these are just broad statistical associations,
    not causal links, we might conclude that through elimination of likely nutritional
    factors, we view lower fat and sugar intakes as possibly important co-determinants
    of longevity.


    But these two relatively low intakes are a part of what I see as by far the most
    important explanatory factor, as Japan’s true exceptionalism: the country’s remarkably
    moderate average per capita food supply. While food balance sheets of virtually
    all affluent Western nations show a daily availability of 3,400–4,000 kilocalories
    per capita, the Japanese rate is now below 2,700 kilocalories, roughly 25 percent
    lower. Of course, actual average consumption cannot be at a 3,500-kilocalorie-per-day
    level (only hard-working, big-stature men might need that much), but even after
    an indefensibly high share of food waste, this high supply translates into excessive
    eating (and obesity).


