  md: 'Cold-weather countries have had a long time to learn about insulation. Not
    so in the warmer places, which need it now that air conditioning is becoming widespread.
    Most notably, in rural China and rural India single panes are still the norm.
    Of course, the temperature differential for-weather cooling is not as large as
    in higher latitudes for heating. For instance, at my home in Manitoba, Canada,
