    get a clear picture of how bad it was. Only then will we be able to do the actual
    counts—or, because we may never know the total number of infected people nationally
    and globally, simply offer our best estimates—and compare the resulting case fatality
    risks, which may differ no less than the numbers for the 2009 pandemic.


