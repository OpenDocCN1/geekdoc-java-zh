  md: '# Why you shouldn’t write diesel off just yet


    On February 17, 1897, Moritz Schröter, a professor of theoretical engineering
    at Technische Universität Munich, conducted the official certification test of
    Rudolf Diesel’s new engine. The goal of the test was to verify the machine’s efficiency
    and hence to demonstrate its suitability for commercial development.


    The 4.5-metric-ton engine performed impressively: at its full power of 13.4 kilowatts
    (18 horsepower, equal to a modern small motorcycle), its net efficiency reached
    26 percent, much better than any contemporary gasoline engine. With obvious pride,
    Diesel wrote to his wife, “Nobody’s engine design has achieved what mine has done,
    and so I can have the proud awareness of being the first one in my specialty.”
    Later in that year the engine’s net efficiency reached 30 percent, making the
    machine twice as efficient as the gasoline-fueled Otto engines of the day.


    Over time, that efficiency gap has narrowed, but today’s diesel engines remain
    at 15 to 20 percent more efficient than their diesel-fueled rivals. Dies have
    several advantages: they use fuel of a higher energy density (it contains nearly
    12 percent more energy than the same volume of gasoline, and hence a vehicle can
    go further with the same tank volume); their self-ignition involves compression
    ratios as high as those in gasoline engines (resulting in a more complete combustion
    and in cooler exhaust gas); they can burn lower-quality, and hence cheaper, fuel;
    and modern electronic injection systems can spray the fuel into their cylinders
    at high pressures resulting in higher efficiencies and in cleaner exhaust.'
  merge: -1
  img_proc: true
