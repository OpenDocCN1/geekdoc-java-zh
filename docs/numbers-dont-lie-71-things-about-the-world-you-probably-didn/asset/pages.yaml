  img_proc: true
- pgno: 90
  md: 'During the Cold War years, the empire looked mighty to NATO planners and Washington
    policymakers, but from the inside (I lived it until my 26th year) looked less
    formidable. Even so, it was a surprise that, eventually, it dissolved easily;
    it lasted from the first week of November 1917 to the last week of December 1991—74
    years and a month, an average European male lifetime.


    Japanese and German aggressions were, fortunately, even morelived. Japanese troops
    began occupying Manchuria in September 1931; starting in 1937 the army took over
    several provinces in eastern China; starting in 1940 it took over Vietnam, Cambodia,
    Thailand, Burma, and all a small part of what is today’s Indonesia; and in June
    1942 it occupied Att (the westernmost island of Alaska’s Aleutian chain) and Kiska
    island, about 300 kilometers to the west. These two westernmost outposts lost
    just 13 months later, and the capitulation of Japan was signed on September 2,
    1945; the imperial expansion thus lasted almost exactly 14 years.


    Meanwhile, Germany’s Third Reich, which meant to last for a thousand years, was
    gone 12 years and 3 months after Hitler became Reichskanzler on January 30, 1933.


    And the American “empire”? If we were to believe in its actual existence and time
    its beginning in 1898 (the Spanish–American war and the takeover of the Philippines,
    Puerto Rico, and Guam), should we believe that it is still strong? The Second
    World War was the last major conflict with a decisive US victory; the rest (Korean
    War, Vietnam War, Afghanistan War, Iraq War) were hard-to-classify mixtures of
    (costly) defeats and mutual exhaustion. The brief Gulf War of 1990–91 was no obvious
    win, as it led directly (12 years later) to the invasion and the stalemate of
    bloody years (2003–2011) in Iraq. And the country’s share of the global economic
    power has been declining steadily since its unnatural peak in 1945 (when all other
    major economies were either destroyed or exhausted by war), and too many countries
    in the suspected American imperial orbit have shown little inclination to consent
    and follow. Clearly not an “empire whose duration could be timed.


    And who should pay the closest attention to these lessons of imperial demise?
    Whose obvious Chinese Communist Party that is trying to suppress Tibet and Xinjiang,
    whose policies have not earned it genuine friends along the country’s long borders
    and have led to overreaching into the South China Sea, whose decision to invest
    heavily (Silk Road–style) in'
