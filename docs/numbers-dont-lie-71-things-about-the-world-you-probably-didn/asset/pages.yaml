  md: '# # Receding empires: Nothing new under the sun


    Keeping an empire, be it a real one (with an emperor or an empress) or de facto
    one (defined by economic and military might and sustained by the projection of
    power and by shifting alliances), has never been easy. Comparing the longevity
    of empires is difficult, due to their different degrees of centralization and
    actual exercise of effective territorial, political, and economic control. But
    one finding stands out: despite the increasing military, technical, and economic
    capabilities of major nations, keeping large empires for extended periods of time
    have become more difficult.


    # Longevity of recent empires and "empires"


    | Years | | |

    |---|---||

    | Spanish 318 | 1492–1810 |

    | British 342 | 1605–1947 |

    | Qing 267 | 1644–1911 |

    | American 77 | 1898–1975 |

    | Soviet 74 | 1917–1991 |

    | Japanese 14 | 1931–1945 |

    | Nazi 12 | 1933–1945 |

    | Chinese Communist ? | 1949–? |'
