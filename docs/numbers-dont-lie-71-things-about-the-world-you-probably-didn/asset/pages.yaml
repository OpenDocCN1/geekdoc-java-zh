    # Insulating a wall


    The insulating value, or thermal resistance, is measured in terms of R-value.
    It depends not only on the composition, thickness, and density of the insulation,
    but also on the outdoor temperature and moisture. A framed wall from 1960 had
    roughly the following R-values: aluminum siding (0.6), thin plywood (0.5), air
    space (0.9), and drywall (0.5). All that adds up to 2.5. But standard brick (0.8)
    plastered on both sides offered no more than 1.0. Even a flimsy, mass-built North
    American wall insulated at least twice as well as Europe’s plastered brick.


    Once prices began to rise and more rational building codes came into effect in
    North America, it became compulsory to incorporate plastic barriers and fiberglass
    baths—pillow-rolls that can be packed between the wooden frames or studs. Higher
    overall R-values were easily achieved by using wider studs (two-by-six) or better
    yet, by double-studding, which involves building a sandwich from two frames, each
    filled with'
