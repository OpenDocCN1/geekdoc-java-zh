- pgno: 133
  md: 'The “failure” part has to do with unmet expectations. The claim that nuclear
    electricity would be “too cheap to meter” is not apocryphal: that’s Lewis L. Strauss,
    chairman of the United States Atomic Energy Commission in 1954, told the National
    Association of Science Writers in New York in September of that year. And equally
    audacious claims were still to come. In 1971, Glenn Seaborg, a Nobelist and the
    then-chairman of the Atomic Energy Commission, predicted that nuclear reactors
    would generate nearly all the world''s electricity by 2000. Seaborg envisioned
    giant coastal desalinating sea water; geostationary satellites powered by compact
    nuclear reactors for broadcasting TV programs; nuclear-powered tanks; and nuclear
    explosives that would alter the flow of rivers and excavate underground cities.
    Meanwhile, nuclear propulsion would carry men to Mars.


    But the project to generate electricity from fission stalled during the 1980s,
    as demand for electricity in affluent economies fell and problems with nuclear
    power plants multiplied. And three failures were worrisome: accidents at Three
    Mile Island in Pennsylvania in 1979, at Chernobyl in Ukraine in 1986, and at Fukushima
    in Japan in 2011 provided further evidence for those opposed to fission under
    any circumstances.


    Meanwhile, there have been overruns in the construction of nuclear plants and
    a frustrating inability to come up with an acceptable way for permanent storage
    of the spent nuclear fuel (currently temporarily stored in containers at power
    plant sites). Nor has there been much success in switching to reactors that might
    be safer and less expensive than the dominant design of pressurized water reactors,
    which are essentially breached versions of US Navy submarine designs from the
    1950s.


    As a result, the Western world remains unconvinced, electricity-generating companies
    are wary, Germany and Sweden are on course to shutting down their entire industries,
    and even France plan to cut back. The reactors that are now under construction
    worldwide will not be able to make up for the capacity that will be lost as aging
    reactors are shut down in coming years.'
  merge: -1
  img_proc: true
- pgno: 134
  md: 'The only leading economies with major expansion plans are in Asia, led by China
    and India, but even they can''t do much to reverse the decline in the share of
    nuclear power in worldwide electricity generation. That share peaked at nearly
    18 percent in 1996, fell to 10 percent in 2018, and is expected to bump up to
    just 12 percent by 2040, according to the International Energy Agency.


    There are many things we could do—above all, use better reactor designs and act
    resolutely on waste storage—to generate a significant share of electricity from
    nuclear fission and so limit carbon emissions. But that would require an unbiased
    examination of the facts, and a truly long-range approach to global energy policy.
    I see no real signs of either.'
