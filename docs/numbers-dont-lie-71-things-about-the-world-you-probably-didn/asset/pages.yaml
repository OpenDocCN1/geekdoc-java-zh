  md: '# When did the age of the car begin?


    In 1908, Henry Ford had been working in the auto business for more than a decade,
    and the Ford Motor Company, five years old and already profitable, had so far
    followed its peers by catering to the well-to-do. Its Model K, introduced in 1906,
    was priced at around $2,800, and the smaller Model N, introduced the same year,
    sold for $500—about what the average person earned in a year.


    Then, on August 12, 1908, the age of the automobile began, because on that day
    the first Ford Model T was assembled at Detroit’s Piquette Avenue Plant. It went
    on sale on October 1.


    Ford made his goals: “I will build a car for the great multitude. It will be large
    enough for the family, but small enough for the individual to run and care for.
    It will be constructed of the best materials ... after the simplest designs that
    modern engineering can devise. But it will be so low in price that no man making
    a good salary will be unable to own one.” He met those goals, thanks to his vision
    and the talent he was able to recruit, notably the designers Childe Harold Wills,
    Joseph A. Galamb, Eugene Farkas, Henry Love, C.J. Smith, Gus Degner, and Peter
    E. Martin.'
  merge: -1
  img_proc: true
- pgno: 171
  md: '![](img/1055ff7c5aac304ec60cbf00b398a085_171_0.png)


    # Ford Model T


    The four-cylinder water-cooled engine put out 15 kilowatts (today’s small cars
    are commonly eight times more powerful), the top speed was 72 kilometers per hour,
    and the price was low. The Runabout, the most popular model, sold for $825 in
    1909, but continuous design and manufacturing improvements let Ford lower the
    price to $260 by 1925. That represented about two and a half months’ wages for
    the average worker at the time. Today, the average new-car price in the United
    States is $34,000, or about 10 months’ median salary. In the UK, popular small
    car models average about £15,000 (about $20,000).


    Introduction of a moving assembly line at Detroit’s Highland Park factory in 1913
    brought substantial economies of scale: by 1914 the plant was already turning
    out 1,000 automobiles a day. And Ford’s decision to pay unprecedented wages for
    unskilled assembly labor assured uninterrupted production. In 1914 the rate was
    more than doubled, $5 to a day, and the working day was reduced to eight hours.'
  merge: -1
  img_proc: true
- pgno: 172
  md: 'The outcome was impressive. The Ford Motor Company produced 15 percent of all
    US cars in 1908, 48 percent in 1914, and 57 percent in 1923. By May 1927, when
    the production run ended, the company had sold 15 million Model Ts.


    Ford stood at the very beginning of manufacturing globalization, using standardized
    procedures and dispersing car assembly around the world. Foreign assembly began
    in Canada and then fanned out to the United Kingdom, Germany, France, Spain, Belgium,
    and Norway, as well as to Mexico, Brazil, and Japan.


    But even though Ford staked much on this one car, it didn’t become the bestselling
    vehicle in history. That primacy belongs to the “people’s car” of Germany—the
    Volkswagen. Soon after he came to power, Adolf Hitler decreed its specifications,
    insisted on its distinctive beetle-like appearance, and ordered Ferdinand Porsche
    to design it.


    By the time it was ready for production, in 1938, Hitler had other plans, and
    the car’s assembly didn’t begin until 1945, in the British-occupied zone. German
    production ended in 1977, but the original VW Beetle continued to be assembled
    in Brazil until 1996 and in Mexico until 2003. The last car, made in Puebla, was
    number 21,529,464.


    But in many ways the Beetle was just an updated emulation of the Model T. There
    can never be any dispute over who mass-produced the first affordable passenger
    car.'
