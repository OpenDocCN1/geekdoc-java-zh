  md: '# Dairy products—the counter-trends


    Nearly all newborns produce enough lactase, the enzyme needed to digest lactose—the
    sugar (a disaccharide composed of glucose and galactose) in their mothers'' milk.
    Only a tiny share of babies have congenital lactase deficiency (that is, lactose
    intolerance). But after infancy, the ability to digest milk diverges. In societies
    that were originally pastoral or kept domesticated dairy animals, the capacity
    to digest lactose persists; while in those societies that never kept milking animals,
    it weakens and even disappears. Typically, this loss translates only into abdominal
    discomfort after drinking a small amount of milk, but it can cause nausea and
    even vomiting.

    Evolution has produced complex patterns of these traits, with lactose-deficient
    populations surrounded by milk-drinking Mongolians (such as the horse milk-drinking
    Mongolians and yak milk-drinking Tibetans north and west of the non-milk-drinking
    Chinese), or even with the two societies intermingled (cattle pastoralists and
    slash-and-burn farmers or hunters of sub-Saharan Africa).


    Given these realities, it is remarkable that economic modernization has produced
    two counterintuitive outcomes: dairy strengths have seen prolonged declines of
    average per capita milk consumption; while in several traditionally non-milk-drinking
    societies, demand for liquid milk and dairy products has risen from nothing to
    appreciable quantities. At the beginning of the 20th century, annual US consumption
    of fresh milk (including cream) was almost 140 liters per capita (80 per cent
    of as whole milk); it peaked at about 150 liters in 1945, but the subsequent decline
    cut it by more than 55 percent, to about 66 liters by 2018. The concurrent decrease
    of demand for all dairy products has been slower, in large part because of the
    still still rising consumption of mozzarella via American pizza.'
