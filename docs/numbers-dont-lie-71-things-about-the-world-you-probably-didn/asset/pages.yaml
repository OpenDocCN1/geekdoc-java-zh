- pgno: 64
  md: '# Brexit: Realities that matter most will not change


    What will really be different in the post-Brexit UK? Of course, much has already
    changed during the unexpectedly protracted run-up to the event, and what has taken
    place can be best described by using the words the English language gained thanks
    to the last successful invasion of those is: the country has been through a disorient
    period of accusations, acrimony, condemnations, delusions, falsifications, illusions,
    recriminations, and tested civility.


    But what will really change five or ten years down the road, as far as the fundamental
    determinants of the nation''s life are concerned? First things we all have to
    eat, and modern societies have been extraordinarily successful in supplying an
    unprecedented variety of foodstuffs at a generally affordable cost. We have to
    energize our buildings, our industries, and our transport by incessant flows of
    fuel and electricity. We have to produce—and renew—the material foundations of
    our societies by manufacturing, building, and maintenance. And we need adequate
    infrastructures (schools, health, and elderly care) to educate people and to care
    for them in sickness and old age. Everything else is secondary.


    On all of these scores the accounts are clear. The UK has not been sufficient
    in food production for a few centuries, and its dependency on imports has doubled
    from about 20 percent in the early 1980s to 40 percent in recent years, and in
    the short term nothing short of draconian food rationing (and no fresh produce
    in winter) can significantly reduce this import dependence. Three-quarters of
    British food imports come from the EU, but Spanish vegetable growers and Danish
    bacon producers will remain as eager to ship their products as the British consumers
    will be to buy them, and hence there will be no demand-destroying stores or pricing.'
