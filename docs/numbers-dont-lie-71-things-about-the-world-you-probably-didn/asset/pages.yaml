  md: '# Why electric cars aren’t as great as we think (yet)


    Let me begin with a disclaimer: I am neither promoting electric vehicles (EVs)
    nor denigrating them. I simply observe that the rational case for accepting them
    has been undermined by unrealistic market forecasts and a disregard for the environmental
    effects involved in producing and operating vehicles.


    Unrealistic forecasts have been, and continue to be, the norm. In 2010, Deutsche
    Bank predicted that EVs would claim 11 percent of the global market by 2020—in
    reality, they will be less than 4 percent. And this triumph of hope over experience
    continues. Recent forecasts for 2030 have EVs adding up to as much as 20 percent
    of the global car fleet, or as little as 2 percent. Bloomberg New Energy Finance
    sees 548 million EVs on roads by 2040; Exxon only 162 million.


    EV enthusiasts have also neglected to note the environmental consequences of mass-scale
    conversion to electric drive. If EVs are to reduce carbon emissions (and thus
    minimize the extent of global warming), their batteries must not be charged with
    electricity generated from the combustion of fossil fuels. But in 2020, just over
    60 percent of global electricity will originate from fossil fuels; about 12 percent
    will come from wind and solar; and the rest from hydro energy and nuclear fission.'
  merge: -1
  img_proc: true
- pgno: 177
  md: '![](img/1055ff7c5aac304ec60cbf00b398a085_177_0.png)


    As a global mean, more than three-fifths of the electricity for an EV still comes
    from fossil carbon, but that fraction varies widely among countries and within
    them. EVs in my home province of Manitoba, Canada (where more than 99 percent
    of all electricity comes from large hydro stations) are clean hydro cars. Quebec,
    Canada (about 97 percent hydro) and Norway come close to that. French EVs are
    largely nuclear-fission cars (the country gets 75 percent of its electricity from
    fission). But in most of India (particularly Uttar Pradesh), China (particularly
    Shaanxi province), and Poland, EVs are overwhelmingly coal cars. The last thing
    we need is to push for the rapid introduction of a source of demand that would
    summon even more fossil fuel–based electricity generation.


    And even if EVs all ran on renewable sources of electricity, greenhouse gases
    would still be emitted during the production of cement and steel for hydroelectric
    dams, wind turbines, and photovoltaic panels, and of course during the manufacture
    of the cars themselves (see WHAT''S WORSE FOR THE ENVIRONMENT—YOUR CAR OR YOUR
    PHONE?, p. 287).


    EV production will have other environmental impacts, too. The Arthur D. Little
    management consultancy estimates that—based on a vehicle life of'
  merge: -1
  img_proc: true
- pgno: 178
  md: '20 years—the manufacture of an EV creates three times as much toxicity as that
    of a conventional vehicle. This is mostly due to the greater use of heavy metals.
    Similarly, a detailed comparative life-cycle analysis, published in the Journal
    of Industrial Ecology, found the production of EVs to involve substantially higher
    toxicity, both to human beings and to freshwater ecosystems.


    I am not suggesting that these are arguments against the adoption of EVs. I am
    merely pointing out that the implications of the new technology must be appraised
    and understood before we accept any radical claims in its favor. We cannot simply
    imagine ideal, pollution-free machines and then will them into existence.'
