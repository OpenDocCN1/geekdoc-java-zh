  md: '# Rational meat-eating


    Eating meat in general (and beef in particular) has now joined a list of highly
    undesirable habits, as the long-extant concerns about meat''s drawbacks—ranging
    from supposedly deleterious health effects to extraordinarily high land use and
    the large water footprint required to grow animal feed—have been joined by near-apocalyptic
    warnings about methane from cattle as a key driver of global climate change. Realities
    are far less inflammatory as we—like chimpanzees, our closest primate ancestors
    whose males are hunters of smaller animals such as monkeys and young wild pigs—an
    omnivorous species, and meat has always been an important part of our normal diet.
    Meat (together with milk and eggs) is an excellent source of complete dietary
    protein required for growth; it contains important vitamins (above all, those
    of B-complex) and minerals (iron, zinc, magnesium); and it is a satisfying source
    of dietary lipids (fats providing the feeling of satiety, and hence highly prized
    by all traditional societies).


    Inevitably, animals, particularly cattle, are inefficient converters of feed into
    meat (see CHICKEN RULES, p. 243), and affluent countries have expanded their meat
    production to such extent that the principal task of agriculture has not become
    to grow crops for people but feed for animals. In North America and Europe, but
    about 60 percent of the total crop harvest is now destined for feeding—not directly
    for food. This, of course, has major environmental consequences, particularly
    due to the need for nitrogen fertilizers and water. At the same time, citing the
    large volumes of water needed to produce feed for cattle is quite misleading.
    The minimum water requirement per kilogram of boneless beef is, indeed, high,
    on the order of 15,000 liters, but only about half a liter of that ends up incorporated
    in the meat, with more than 99 percent being needed for the growth of feed'
