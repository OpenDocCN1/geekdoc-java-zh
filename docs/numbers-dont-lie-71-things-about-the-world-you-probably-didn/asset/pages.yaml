  img_proc: true
- pgno: 39
  md: '# Why unemployment figures do not tell

    t whole story


    Many economic statistics are notoriously unreliable, and the reason often

    has to do with what is included in the measurement and what is left out.

    Gross domestic product offers a good example of a measure that leaves out

    key environmental externalities such as air and water pollution, soil erosion,

    bydiversity loss, and the effects of climate change.'
  merge: -1
  img_proc: true
- pgno: 40
  md: '![](img/1055ff7c5aac304ec60cbf00b398a085_40_0.png)


    Unemployed men lining up for food during the Great Depression


    Measuring unemployment is also an exercise in exclusion, and the choices are perhaps
    best illustrated with detailed data from the United States. Casual consumers of
    US news will be familiar only with the official figure, which put the country’s
    total unemployment at 3.5 percent in December 2019. But that is just one of six
    different methods used by the Bureau of Labor Statistics to quantify “labor underutilization.”


    Here they are, in ascending order (with rates, again, for December 2019). People
    unemployed 15 weeks or longer as a share of the civilian labor force: 1.2 percent.
    People who lost jobs and completed temporary jobs: 1.6 percent. Total unemployment
    as a share of the civilian labor force (the official rate): 3.5 percent. Total
    unemployed plus discouraged workers (those no longer looking for a job), as a
    share of the civilian labor force and discouraged workers: 3.7 percent. The previous
    category enlarged by all people only “marginally attached” (doing temporary or
    occasional work) to'
  merge: -1
  img_proc: true
- pgno: 41
  md: 'the labor force. 4.2 percent. And finally, the last category plus those who
    work only part-time for economic reasons (that is, they would prefer to work full-time):
    6.7 percent. These six measures present quite a spread of values—the official
    unemployment rate (U-3) was only about half of the most encompassing rate (U-6),
    which was more than five times as high as the narrowest measure (U-1).


    If you lose your job, you are counted as unemployed only if you keep looking for
    a new one; otherwise, you never get counted again. That is why, trying to get
    close to the “real” unemployment rate, you must look at the labor force participation
    rate (the number of people available for work as a percentage of the total population),
    which has recently been in decline. In 1950 the US rate was only about 59 percent,
    and after mostly rising for half a century peaked at 67.3 percent during the spring
    of 2000; the subsequent decline brought it to 62.5 percent by the fall of 2005,
    and was followed by a slow rise to 63.2 percent by the end of 2019. There are,
    of course, substantial differences among age groups: the highest rate is about
    90 percent, for between 35 and 44 years of age.


    And European unemployment figures how difficult it is to relate to a country’s
    social fabric or to its inhabitants'' personal satisfaction. The lowest rate,
    just above 2 percent, is in the Czech Republic; Spain has endured years of high
    unemployment—more than 26 percent in 2013 and more than 14 percent in 2019 for
    the entire population, and even after declining a bit, still about 33 percent
    for Spanish youth in 2019 (the latter figure clearly a depressing reality for
    anybody entering the labor force). Yet the Czech happiness score (see the following
    chapter) is only 8 percent ahead of the Spanish one, and the Czech suicide rate
    is, just over 8 per 100,000, three times as high as in Spain. True, robberies
    are more common in Barcelona than in Prague, but the Spanish mean is only slightly
    higher than the British mean—and British unemployment is only a quarter of the
    Spanish rate.


    Obviously, complex realities of (un)employment can never be caught by an aggregate
    number. Many people who have been formally unemployed have cop thanks to family
    support and informal labor arrangements. Many who are fully employed are unhappy
    with their lot but cannot change jobs easily or at all, because of their skills
    or family circumstances. Numbers may not lie, but individual perceptions of them
    differ.'
  merge: -1
  img_proc: true
