  md: '# # The First World War’s extended tragedies


    Few recent 100-year anniversaries resonated so loudly as November 2018’s marking
    of the end of the world’s first truly global armed conflict. The war’s enormous
    carnage scarred the memory of a generation, but its most tragic legacy was the
    resulting Communist rule in Russia (1917), Fascist rule in Italy (1922), and Nazi
    rule in Germany (1933). Those developments led to the Second World War, which
    killed even more people and left direct and indirect legacies—including NATO vs.
    Russia, and a divided Korea—that still trouble our lives.'
  merge: -1
  img_proc: true
- pgno: 54
  md: '![](img/1055ff7c5aac304ec60cbf00b398a085_54_0.png)


    Even though the Second World War was deadlier, a case can be made that the first
    war constituted the critical disaster, as it gave rise to so much of what followed.
    True, the second war deployed far greater advances in destructive power, including
    the fastest fighter planes ever powered by reciprocating engines; enormous four-engine
    bombers (the B-17); missiles (the German V-1 and V-2); and, at the war''s very
    end, the nuclear bombs that destroyed Hiroshima and Nagasaki.


    In comparison, the First World War, with its entrenched and barely shifting fronts,
    was a decidedly less dynamic conflict. But a closer look shows that purely technical
    advances were indeed critical for for lengthening its duration and adding to its
    death toll.


    Leaving aside the use of poisonous gases in combat (never repeated on such a scale),
    several key modes of modern warfare were developed and even perfected during the
    earlier conflict. The first diesel-powered submarines were used on long forays
    to attack convoys of merchant ships. The first tanks were deployed in combat.
    The first bombing raids, using'
  merge: -1
  img_proc: true
- pgno: 55
  md: 'both dirigibles and airplanes, were mounted. The first battle-ready aircraft
    carrier was launched in 1914. The French successfully tested portable transmitters
    enabling voice communication from the air to the ground in 1916, and from air
    to air in 1917, beginning the long road toward ever-smaller, ever-more-usable
    electronic components.


    But amid these developments, we must single out the momentous innovation that
    allowed a blockaded Germany to endure its two-front war for four years: the synthesis
    of ammonia. When the war began, the British navy cut Germany off imports of Chilean
    nitrates needed to produce explosives. But thanks to a remarkable coincidence,
    Germany could instead supply itself with homemade nitrates. In 1909, Fritz Haber,
    a professor at the University of Karlsruhe, had ended the long-running quest for
    synthesizing ammonia from its elements. Nitrogen and hydrogen were combined under
    high pressure and in the presence of a catalyst, to make ammonia (NH$_3$).


    By October 1913, BASF—then the world’s leading chemical conglomerate, under the
    leadership of Carl Bosch—had commercialized the process at the world’s first ammonia
    plant, in Oppau in Germany. This synthetic ammonia was to be used in the production
    of such fertilizers as sodium or ammonium nitrate (see THE WORLD WITHOUT SYNTHETIC
    AMMONIA, p. 221).


    But the war began less than a year later, and instead of converting ammonia into
    fertilizer, BASF began to mass-produce the compound for conversion into nitric
    acid to be used in the synthesis of wartime explosives. A larger ammonia plant
    was completed by April 1917 in most, west of Leipzig, and the combined production
    of the two plants to support Germany’s manufacture of explosives until the war’s
    end.


    The new capability of industry to find ways around every shortage helped draw
    out the First World War, adding millions of casualties. This terrifyingly modern
    development believes the war’s primitive image, framed as it often is by prolonged
    stalemates in muddy trenches—and paved the way to even greater carnage a generation
    later.'
  merge: -1
  img_proc: true
- pgno: 56
  md: '# # Is the US really exceptional?


    Belief in “American exceptionalism”—that unique blend of ideals, ideas, and love
    of liberty made so powerful by great technical and economic accomplishments—is
    alive and well. Even former President Obama, the man known for his unemotional
    approach to governing and hence a reluctant endorser to begin with, has come around.
    Early in his presidency (in April 2009), he affirmed his belief by essentially
    denying it: “I believe in American exceptionalism, just as I suspect the Brits
    believe in British exceptionalism and the Greeks believe in Greek exceptionalism.”
    By of 2014, he relented: “I believe in American exceptionalism with every fiber
    of my being.


    But such proclamations mean nothing if they cannot stand up to the facts. And
    here, what really matters is not the size of a country’s gross domestic product
    or the number of warheads or patents it may possess, but the variables that truly
    capture its citizens’ physical and intellectual well-being. These variables are
    simple life, death, and knowledge.


    Infant mortality is an excellent proxy for a wide range of conditions, including
    income, quality of housing, nutrition, education, and investment in healthcare.
    Very few babies die in these affluent countries where people live in good housing
    and where well-educated parents (themselves nourished) feed their children properly
    and have access to medical care (see THE BEST INDICATOR OF QUALITY OF LIFE? INFANT
    MORTALITY, p. 8). So how does the United States rank among the world’s roughly
    200 nations? The latest available comparison shows that 6 of every 1,000 live-born
    babies dying in the first year of life, the US does not figure among the top 25
    nations. Its infant mortality is far higher than in France (4), Germany (3), and
    Japan (2). And the US rate is 50 percent higher than in Greece (4), a country
    portrayed as an utter basket case ever since the

    financial crisis.'
