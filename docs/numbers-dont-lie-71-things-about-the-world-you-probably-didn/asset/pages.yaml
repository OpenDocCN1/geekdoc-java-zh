- pgno: 63
  md: 'The EU has just over 500 million people, less than 7 percent of the global
    population, but it generates nearly 24 percent of the world’s economic output,
    as against 22 percent for the United States. It accounts for nearly 16 percent
    of global exports of goods—a third more than the United States—including cars,
    airlines, pharmaceuticals, and luxury goods. Moreover, half of its 27 members
    are among the top 30 countries in terms of quality of life, as measured by the
    Nations’ Human Development Index.


    And yet, today, the EU is witnessing mounting worries and affection. The bonds
    of union are loosening, and the UK has left outright.


    Within Europe, the commentariat offers endless explanations of this new centrifugal
    temper: the excessive bureaucratic control exercised from Brussels; the reassertion
    of national sovereignty; and poor economic and political choices, notably the
    adoption of a common currency without common fiscal responsibility.


    I must confess that I am puzzled. As somebody who was born during Nazi occupation,
    who grew up on the wrong side of the Iron Curtain, and whose family history is
    typical of Europe’s often-complicated national and linguistic origins, I see today’s
    Europe—shortcomings and all—as a staggering outcome, too good to be believed.
    Surely these achievements are worthy of redoubled efforts at compromises to reunite
    it.


    Instead, decades of peace and prosperity have been taken for granted, lapses and
    difficulties (some inevitable, some unpardable) have served to reignite old biases
    and animosities. My wish for Europe: make it work. The failure to do so cannot
    be contemplated lightly.'
