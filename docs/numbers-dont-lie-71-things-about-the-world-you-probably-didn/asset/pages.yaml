  md: '# Why kerosene is king


    Eliminating kerosene-based jet fuel will be one of the greatest challenges in
    creating a world without carbon emissions. Aviation accounts for only about 2
    percent of the global volume of such emissions and some 12 percent of the total
    released by the transportation sector, but converting to electric drive is much
    harder for airplanes than for cars and trains.


    Today''s jet fuel—the most common formulation of which is called Jet A1—has a
    number of advantages. It has a very high energy density, as it packs 42.8 megajoules
    into each kilogram (that is slightly less than gasoline but it can stay liquid
    down to −47°C), and it beats gasoline on cost, evaporative losses at high altitude,
    and risk of fire during handling. No real rivals yet exist. Batteries capacious
    enough for intercontinental flights carrying hundreds of people are still the
    stuff of science fiction, and we will not see wide-bodied planes fueled by liquid
    hydrogen anytime soon.


    What we need is a fuel equivalent to kerosene that is derived from plant matter
    or organic waste. Such a biojet fuel would release no more CO during combustion
    than plants sequester during growth. The proof of principle has been demonstrated:
    since 2007, test flights using blends of Jet A-1 and biojet proved suitable as
    drop-in alternatives for modern aircraft.'
  merge: -1
