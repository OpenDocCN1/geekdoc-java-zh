  md: '# The real cost of electricity


    In many affluent countries, the new century brought a shift in the long-term trajectory
    of electricity prices: they have increased not only in the monies of the day but
    even after adjustments for inflation. Even so, electricity remains an admirable
    bargain—though, as expected, a bargain with many national peculiarities, resulting
    not only from specific contribution by different sources but also from persistent
    governmental regulation.


    Historical perspective shows the trajectory of an extraordinary value, and that
    explains electricity''s ubiquity in the modern world. When adjusted for inflation
    (and expressed in constant 2019 monies), the average price of US residential electricity
    fell from $4.81 per kilowatt-hour in 1902 (the first year for which the national
    mean is available) to 30.5 cents in 1950, then to 12.2 cents in 2000; and in early
    2019 it was just marginally higher, at 12.7 cents/KWh. This represents a relative
    decline of more than 97 percent—or, stated in reverse, a dollar now buys nearly
    38 times more electricity than it did in 1902. But, during that period, average
    (again, inflation-adjusted) manufacturing wages nearly sextupled, which means
    that in a blue-collar household, electricity is now more than 200 times more affordable
    (effective earning-adjusted cost is less than 0.5 percent of the 1902 rate) than
    it was almost 120 years ago.'
