  md: '# Why Europe should be more pleased with itself


    On January 1, 1958, Belgium, France, Italy, Luxembourg, the Netherlands, and the
    Federal Republic of Germany jointly formed the European Economic Community (EEC)
    with the aim of economic integration and free trade within a customs union.


    Although the immediate goals were explicitly economic, the EEC’s aspirations were
    always far higher. In the Treaty of Rome, the member states declared their determination
    “to lay the foundations of an ever-closer union among the peoples of Europe” and
    “to ensure the economic and social progress of their countries by common action
    to eliminate the barriers which divide Europe.” At that time, these goals seemed
    to be quite unrealistic: Europe was divided not only by national prejudices and
    economic inequalities also, most fundamentally, by the Iron Curtain, which ran
    from the Baltic to the Black Sea, with Moscow controlling the nations to the east
    of it.


    That Soviet control was reasserted after the failure of the Prague Spring in 1968
    (the attempted Czechoslovak reforms in the Soviet invasion of the country), while
    the EEC continued to accept new members: the United Kingdom, Ireland, and Denmark
    in 1973; Greece in 1981; Spain and Portugal in 1986. And then, after the USSR
    collapsed in 1991, the way was open to pan-European integration. In 1993, the
    Maastricht Treaty established the European Union; in 1999, a common currency,
    the euro, was created; and 27 nations now belong to the Union.'
