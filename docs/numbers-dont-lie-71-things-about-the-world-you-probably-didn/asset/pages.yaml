  md: '![](img/1055ff7c5aac304ec60cbf00b398a085_168_0.png)


    John Boyd Dunlop riding on his invention


    An improved version found immediate use among the growing numbers of enthusiastic
    bicycle riders, and a company was set up to manufacture the tires. However, as
    with so many other inventions, Dunlop''s patent was eventually invalidated because
    it turned out that another Scotsman, Robert William Thomson, had previously patented
    the idea, even though he never made a practical product.


    Still, Dunlop''s invention stimulated work on larger tires for the newly invented
    automobile. In 1885, Karl Benz''s first three-wheeled Patent Motorwagen had solid
    rubber tires. Six years later, the Michelin brothers, André and Édouard, introduced
    their version of detachable rubber tires for bicycles, and in 1895 their two-seater,
    L’Éclair, became the first automobile with inflatable rubber tires to enter the
    1,200-kilometer Paris–Bordeaux–Paris race. Because its tires needed changing every
    150 kilometers, L’Éclair ended up in ninth place.


    It was a temporary setback. Sales did well, and Bibendum, the bulging-tire man,
    became Michelin’s symbol in 1898. One year later the company’s tires shod the
    torpedo-shaped La Jamais Contente (“The Never Satisfied”),'
  merge: -1
