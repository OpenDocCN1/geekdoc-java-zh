  md: '# Modern cars have a terrible weight-to-payload ratio


    A century ago, the bestselling car in the United States, Ford''s Model T, wrung
    a watt from every 12 grams of its internal combustion engine. Now, engines in
    bestselling American cars are getting a watt per gram—a 92 percent improvement.
    That is the one bit of happy news I am going to impart in this chapter.


    Now for the bad news: the US data show that during the past 100 years, average
    engine power has increased more than 11-fold, to about 170 kilowatts. This means
    that despite a huge drop of mass/power density, today''s typical car engine is
    become much lighter than it was a century ago—and the average car itself has become
    much heavier: its mass has roughly tripled, reaching more than 1,800 kilograms
    (the average for all light-duty vehicles, nearly half of which are pickups, SUVs,
    and minivans.


    # Weight-to-payload ratio

    (assuming 70 kg adult)


    ![](img/1055ff7c5aac304ec60cbf00b398a085_173_0.png)'
  merge: -1
  img_proc: true
- pgno: 174
  md: 'And because nearly three-quarters of US commuters drive alone, you get the
    worst possible ratio of vehicle-to-passenger weight.


    That ratio is what matters. Because, for all the auto industry’s talk about “lightweighting”—using
    aluminum, magnesium, and even carbon fiber—reinforced polymers to reduce total
    weight—this ratio ultimately limits the energy efficiency.


    Here, in ascending order, are a few of the weight ratios that a 70-kilogram passenger
    can achieve:


    +   • 0.1 for a 7-kilogram bicycle

    • 1.6 for Italy’s 110-kilogram Vespa scooter

    • 5 or less for a modern bus, and that’s just if you count sitting passengers

    • 7.3 for France’s 510-kilogram Citroën 2CV (deux chevaux), or “two horses”),
    back in the 1950s

    • 7.7 for the Ford Model F-150 introduced in 1908 and also for Japan’s shinkansen
    rapid train that began to run in October 1964 (the train’s frugal ratio also comes
    as much to design as it does to a high ridership rate)

    • 12 for a Smart car, 16 for a Mini Cooper, or for my own Honda Civic LX, and
    change for the Toyota Camry

    • 26 for the average American light-duty vehicle in 2013

    • 28 for the BMW 740i

    • 32 for the Ford F-150, the bestselling American vehicle

    • 39 for the Cadillac Escalade EXT.


    Of course, you can get spectacular ratios by pairing the right car with the right
    driver. I regularly see a woman driving a Hummer H2 that easily weighs 50 times
    as much as she does. That’s going after a fly with a steam shovel.


    To put it in perspective, consider that the latest Boeing, the 787-10, does better
    than a Citroën. Its maximum takeoff weight is 254 tons; with 330 passengers weighing
    23 tons and another 25 tons of cargo, the overall weight-to-payload ratio comes
    to just 5.3.


    Cars got heavy because part of the world got rich and drivers got codled. Light-duty
    vehicles are larger, and they came equipped with more features, including automatic
    transmissions, air conditioning, entertainment and communication systems, and
    an increasing number of servomotors powering windows, mirrors, and adjustable
    seats. And new battery-heavy'
  merge: -1
  img_proc: true
- pgno: 175
  md: 'hybrid drives and electric cars will not be lighter: the small all-electric
    Ford Focus weighs 1.7 tons, General Motors’ Volt is more than 1.7 tons, and the
    Tesla is just above 2.1 tons.


    Lighter designs would help, but obviously nothing could halve (or quarter) the
    ratio as easily as having two or four people in a car. And yet in the United States,
    that is the hardest thing to enforce. The 2019 State of the American Commute reported
    that nearly three-quarters of commuters drive alone to work. Car commutes are
    much less common in Europe (36 percent in the UK), and even rarer in urban Japan
    (just 14 percent)—but average car sizes have been increasing both in the EU and
    in Japan.


    And so the outlook is for ever-better engines or electric motors in heavy vehicles
    used in a way that results in the worst weight-to-payload ratios at any mechanized
    means of personal transportation in history.


    These cars may be, by some definition, smart—but they are not wise.'
