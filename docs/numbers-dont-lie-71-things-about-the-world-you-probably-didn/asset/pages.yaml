  md: '# Why electric container ships are a hard sail


    Just about everything you wear or use around the house once sat in steel boxes
    on ships whose diesel engines propelled them from Asia, emitting particles and
    carbon dioxide. Surely, you would think, we can do better.


    After all, we''ve had electric locomotives for more than a century and high-speed
    electric trains for more than half a century, and recently we have been expanding
    the global fleet of electric cars. Why not get electric container ships?


    Actually, the first one is scheduled to operate in 2020: the Yara Birkeld, built
    by Marin Teknikk in Norway, is not only the world''s first electric-powered, zero-emissions
    container ship, but also the first autonomous commercial vessel.


    But don''t write off giant diesel-powered container ships and their critical role
    in a globalized economy just yet. Here is a back-of-the-envelope calculation that
    explains why ...


    Containers come in different sizes, but most are the standard twenty-foot equivalent
    units (TEU)—rectangular prisms 6.1 meters (20 feet) long and 2.4 meters wide.
    The first small container ships of the 1960s carried hundreds of TEUs; four ships
    launched in 2019 and belonging to MSC Switzerland (*Gülsln, Samar, Leni and Mia*)
    hold the record, at 23,756 TEUs each. When they travel very slowly (16 knots,
    in order to save fuel) these ships can make the journey from Hong Kong to Hamburg
    (via the Suez Canal)—more than 21,000 kilometers—in 30 days.'
  merge: -1
  img_proc: true
- pgno: 152
  md: '![](img/1055ff7c5aac304ec60cbf00b398a085_152_0.png)


    Now consider the Yara Birkeland. It will carry just 120 TEUs, its service speed
    will be 6 knots, and its longest intended operation will be 30 nautical miles—between
    Heroya and Larvik, in Norway. Today’s state-of-the-art diesel container vessels
    thus carry nearly 200 times as many boxes over distances almost 400 times long,
    at speeds three to four times as fast as the pioneering electric ship can handle.


    What would it take to make an electric ship that can carry up to 18,000 TEUs,
    now a common intercontinental load? In a 31-day trip, most of today’s efficient
    diesel vessels burn 4,650 tons of fuel (low-quality residual oil or diesel), with
    each ton packing 42 gigajoules. That’s an energy density of about 11,700 watt-hours
    per kilogram, versus 300 Wh/kg for today’s lithium-ion batteries—a nearly 40-fold
    difference.


    The total fuel demand for the trip is about 195 terajoules, or 54 gigawatt-hours.
    Large diesel engines (and those installed in container ships are the'
  merge: -1
  img_proc: true
- pgno: 153
  md: 'largest we have) are about 50 percent efficient, which means that the energy
    actually used for propulsion is half the total fuel demand, or about 27 gigawatt-hours.
    To match that demand, large electric motors operating at 90 percent efficiency
    would need about 30 gigawatt-hours of electricity.


    Load the ship with today''s best commercial Li-ion batteries (300 Wh/kg), and
    still it would have to carry about 100,000 tons of them to go nonstop from Asia
    to Europe in a month (for comparison, electric cars contain about 500 kilograms,
    or 0.5 tons, of Li-ion batteries). Those batteries alone would take up about 40
    percent of maximum cargo capacity—an economically ruinous proposition, never mind
    the difficulties involved in charging and operating the ship. And even if we push
    batteries to an energy density of 500 Wh/kg sooner than might be expected, an
    18,000-TEU vessel would still need nearly 60,000 tons of them for a long intercontinental
    voyage at a relatively slow speed.


    The conclusion is obvious. To have an electric ship whose batteries and motors
    weighed no more than the fuel (about 5,000 tons) and the diesel engine (about
    2,000 tons) in today''s large container vessels, we would need batteries with
    an energy density more than 10 times as high as today''s best Li-ion units.


    But that''s a tall order indeed: in the past 70 years, the energy density of the
    best commercial batteries hasn''t even quadrupled.'
