    During the past 50 years, the Italian diet has become more Mediterranean diet
    only for fruit, the consumption of which went up by nearly 50 percent. Meanwhile,
    consumption of animal fats and meat trebled. Olive oil now supplies less than
    half of all dietary fats and —incredible!—the consumption of pasta is down and
    of wine is way down, in a drop of about 75 percent. Italians now buy as much beer
    as they do rosso and bianco.


    The Spanish retreat from the Mediterranean diet has been even faster and even
    more complete. Spaniards still like their seafood, the consumption of which has
    increased, but they''ve moved away from grains, vegetables, and legumes. Olive
    oil now provides less than half of all the country''s fats. And, remarkably, Spaniards
    on average now drink only around 20 liters of wine per year—which is less than
    half the beer they consume. That''s comparable to what you see in Germany and
    the Netherlands!'
