  md: 'contract with a biofuel supplier will provide only 2 percent of the airline’s
    annual fuel consumption. True, today’s airliners are increasingly frugal: they
    are now burning about 50 percent less fuel per passenger-kilometer than they did
    in 1960. Those savings have been swamped by the continuing expansion of aviation,
    which has raised annual consumption of jet fuel to more than 250 million tons
    worldwide.


    To meet this demand largely with biofuel, we would have to go beyond organic crops
    and tap oil-rich (corn, soybeans, rapeseed) or perennial (palm) oil crops, whose
    cultivation would require large areas and create environmental problems. Temperate-climate
    oil crops have relatively low yields: with an average yield of 0.4 tons of biofuel
    per hectare of soybeans, the United States would need to put 125 million hectares—an
    bigger than Texas, California, and Pennsylvania combined, slightly larger than
    South Africa—under the plow to supply its own jet fuel needs. That is four times
    the 31 hectares that the country devoted to soybeans in 2019. Even the highest-yielding
    option—oil palm, which averages 4 tons of biofuel per hectare—would still require
    more than 60 million hectares of tropical forest to supply the world’s aviation
    fuel. That would necessitate quadrupling the area devoted to palm cultivation,
    leading to the release of carbon accumulated in natural growth.


    But why take huge tracts of land when we can derive biofuels from oil-rich algae?
    Intensive, large-scale cultivation of algae would require relatively little space
    and offer very high productivity. However, Exxon Mobil’s experience shows how
    demanding it would be to scale up to tens of millions of tons of biofuel every
    year. Exxon, working with Craig Venter’s Synthetic Genomics, began to pursue this
    option in 2009, but by 2013, after spending more than $100 million, concluded
    that the challenges were too great and decided to refocus on long-term basic research.


    As, the task of energy substitutions would be made easier if wasted less, by flying
    less. But forecasts are for further substantial growth of air traffic, particularly
    in Asia. Get used to the unmistakable smell of aviation kerosene—it’ll be here
    for a long time to come, and moreover, it fuels the machines that (as we will
    see in the next chapter) are extraordinarily safe to fly.'
