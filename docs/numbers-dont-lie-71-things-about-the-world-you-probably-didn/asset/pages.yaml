  md: '# Why chicken rules


    For generations, beef was the United States’ dominant meat meat, followed by pork.
    When annual beef consumption peaked in 1976 at about 40 kilograms (boneless weight)
    per capita, it accounted for nearly half of all meat; chicken had just a 20 percent
    share. But chicken caught up by 2010, and in 2018 chicken share came to 36 percent
    of the total, nearly 20 percentage points higher than beef. The average American
    now eats 30 kilograms of boneless chicken every year, bought overwhelmingly now
    as cut-up or processed parts (from boneless breasts to Chicken McNuggets).


    The constant obsession with diet in the United States—in this case the fear of
    dietary cholesterol and saturated fat in red meat—has been a factor in the shift.
    The differences, however, are not striking: 100 grams of lean beef has 1.5 grams
    of saturated fat, compared with 1 gram of skinless chicken breast (which actually
    has more cholesterol). But the main reason for chicken’s ascendance has been its
    lower price, which reflects its metabolic-advantage: no other domesticated land
    animal can convert feed to meat as efficiently as broilers, as chickens bred and
    raised specifically for meat production are known. Modern advances have a lot
    to do with this efficiency.'
