- pgno: 199
  md: '# # The inexcusable magnitude of global food waste


    The world is wasting food on a scale that must be described as excessive, inexcusable,
    and, given all of our other concerns at about the state of the global environment
    and quality of human life, outright incomprehensible. The UN’s Food and Agricultural
    Organization puts the annual global losses at 40–50 percent for root crops, fruits,
    and vegetables, 35 percent for fish, 30 percent for cereals, and 20 percent for
    oilseeds, meat, and dairy products. This means that, globally, at least one-third
    of all harvested food is wasted.


    Reasons for wasting food differ. In the poorest countries it is most often because
    of poor storage (as rodents, insects, and fungi feast on improperly stored seeds,
    vegetables, and fruits) or lack of refrigeration (causing rapid spoilage of meat,
    fish, and dairy products). That is why in sub-Saharan Africa, most waste takes
    place even before the food reaches consumers. In the affluent world, however,
    the main cause is simply the gap between excessive production and actual consumption:
    despite their high frequency of overeating, most high-income nations provide their
    citizens with a food supply that would be, on average, adequate for hard-working
    lumberacks or coal miners, not for largely sedentary and aging populations.'
  merge: -1
  img_proc: true
- pgno: 200
  md: '# The percentage of food waste across the supply chain


    ![](img/1055ff7c5aac304ec60cbf00b398a085_200_0.png)


    Not surprisingly, the United States is a leading offender, and we have plenty
    of information to quantify the excess. Average daily food supply in the US comes
    to be about 3,600 kilocalories per person. That''s supply, not consumption—and
    a good thing, too.


    Consider if you omit babies and housebound octogenarians, whose daily requirements
    are less than 1,500 kilocalories, that would leave for adults: Americans eat too
    much, but they could not eat that much every day. The United States Department
    of Agriculture (USDA) adjusts these figures for “spoilage and other waste,” and
    puts the actual average available for consumption at 2,600 kilocalories per person.
    But even that isn''t quite right. Both surveys of self-reported food consumption
    (carried out by the National Health and Nutrition Examination Survey) and calculations
    based on expected metabolic requirements indicate that the actual daily intake
    in the United States comes to about 2,100 kilocalories per person. Subtract 2,100
    kcal/capita of intake from 3,600 kcal/capita of supply and you get a loss of 1,500
    kcal/capita, which means about 40 percent of American food goes to waste.'
  merge: -1
  img_proc: true
- pgno: 201
  md: 'This was not always the case. In the early 1970s, the USDA put the average
    food availability per capita (adjusted for pre-retail waste) at less than 2,100
    kilocalories per day, nearly 25 percent less than it is now. The National Institute
    of Diabetes and Kidney Diseases estimates that the United States’ per capita food
    waste increased by 50 percent between 1974 and 2005, and that the problem has
    gotten worse since then.


    But even if the US daily loss had remained at 1,500 kilocalories per capita, a
    simple calculation shows that in 2020 (with about 333 million people) this wasted
    food could have provided adequate nutrition (2,200 kilocalories per capita) to
    about 230 million people, slightly more than the entire population of Brazil,
    Latin America’s largest nation and the world’s sixth-most populous country.


    Yet as we waste food, Americans are still eating far more than is good for them.
    The prevalence of obesity—defined as a body mass index of 30 or greater—more than
    doubled between 1962 and 2010, rising from 13.4 to 35.7 percent among adults over
    age 20. To add to this the merely overweight (a BMI between 25 and 30) and you
    find that, among adults, 74 percent of males and 64 percent of females have an
    excessively heavy weight. Most worrisome, as obesity is usually a lifelong condition,
    that proportion is now above 50 percent for children above the age of six as well.


    The UK’s Waste and Resources Action Programme (WRAP) provides different perspectives
    by tracing the phenomenon in unusual detail. In Britain, total food waste amounts
    to about 10 million tons a year and is worth about £15 billion (nearly $20 billion),
    but inedible parts (skins, peelings, bones) make up only 30 percent of that—so
    70 percent of wasted food could have been eaten! WRAP also documented the whys
    of the process: nearly 30 percent of the waste is due to “not being in time,”
    a third because of the expiry of “best before” dates, about 15 percent because
    too much was cooked or served, and the rest is due to other reasons, including
    personal preferences, fussy eating, and accidents.


    Food loss goes beyond the wasted nutrition, however—it inevitably entails a significant
    amount of labor and energy used directly to operate field machinery and irrigation
    pumps, and indirectly to produce the steel, aluminum, and plastics needed to make
    those mechanical inputs and to synthesize fertilizers and pesticides. The extra
    agricultural effort also ends hurting the environment by causing soil erosion,
    nitrate leaching, and the'
  merge: -1
  img_proc: true
- pgno: 202
  md: 'loss of biodiversity, and the growth of antibiotic-resistant bacteria; and
    the production of wasted food may be responsible for as much as 10 percent of
    global greenhouse gas emissions.

    Affluent countries need to produce considerably less food and consume it with
    considerably less waste. And yet the mantra of higher food production is chanted
    as loudly as ever. Its most recent permutation is to produce more food waste by
    eventually flooding the markets with fake meat made from altered legume proteins.
    Instead, why not try to find clever ways to reduce food waste to a more acceptable
    level of loss? Cutting food waste in half would lead the way to a more rational
    use of food worldwide, and the benefits could be huge: WRAP estimates that a dollar
    invested in food waste prevention has a 14-fold return in associated benefits.
    Is this not persuasive enough?'
