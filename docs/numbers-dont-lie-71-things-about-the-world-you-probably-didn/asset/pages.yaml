- pgno: 275
  md: '# # Acknowledgments


    For many years, as I kept publishing interdisciplinary books, I thought that it
    might be an interesting challenge to have a regular opportunity to comment on
    some noteworthy topics, to straighten some common misconceptions, and to explain
    some fascinating realities of the modern world. I also thought the likelihood
    of ever doing that was fairly low, because in order to be worth doing, an offer
    from a publisher would have had to meet several Goldilocks criteria.


    The interval between the contributions would be neither too short (weekly would
    be a chore) nor sporadic. The word quota not too long, but long enough to allow
    for more than a few shallow paragraphs. The pitch neither too specialized nor
    superficial, in order to permit an informed examination. Choice of topics not
    unlimited (I had no intention of writing about obscure matters or exceedingly
    specialized themes) but definitely wide-ranging. And a tolerance of numbers: not
    too many, but enough to make a convincing case. The last point was particularly
    important to me, because over the decades I had noticed how the discussion of
    important matters that demand some clear quantitative understanding was becoming
    increasingly qualitative and have progressively unmoored from complex realities.


    Unlikely happen—and in 2014 I was asked to write a monthly essay for IEEE Spectrum,
    the magazine of the Institute of Electrical and Electronics Engineers, which is
    headquartered in New York. Philip Ross, a senior editor-at-Spectrum, proposed
    my name, and Susan Hassler, the editor-in-chief, readily concurred. Spectrum is
    the flagship magazine (and website) of the world’s largest professional organization
    devoted to engineering and the applied sciences, and its members have been at
    the forefront of transforming a modern world dependent on the incessant,'
  merge: -1
  img_proc: true
- pgno: 276
  md: 'affordable, reliable supply of electricity and on the adoption of a growing
    array of new electronic devices and computerized solutions.


    In an email to Phil in October 2014, I outlined the topics intended for the first
    year. They ranged from cars that weighed too much to triple windows and from Moore''s
    Curse to the Anthropocene. Nearly the entire original line-up was eventually written
    and printed, starting in January 2015, with the first monthly column on ever-heavier
    cars. Spectrum became the perfect home for my essays. With its more than 400,000
    IEEE provides a large, highly educated and critical readership, I have been given
    freedom to select the topics, and Phil has been an exemplary editor, particularly
    relentless in his fact-checking pursuits.


    As the essays accumulated, I thought they might make an interesting collection
    but, again, I did not see much of seeing them in a book form. And then in late
    October 2019, almost exactly five years after I outlined the first year''s line-up
    of essays to Phil, another unexpected email from Daniel Crewe, Publisher at Viking
    (Penguin Random House) in London, Daniel was wondering if I had considered turning
    my columns into a book. Everything moved very quickly. Daniel secured permissions
    from Susan, we chose three sorts of published for the collection (leaving out
    a few highly technical columns), and I wrote new dozen in order to round out the
    seven topical chapters (especially on food and people). Connor Brown did the first
    major edit, and we selected appropriate graphics and photographs.


    Thanks to Phil and Susan and to the readers of Spectrum for the support and for
    the opportunity to write about anything that captures my curiosity, and to Daniel
    and Connor for giving these quantitative minutes the second life.


