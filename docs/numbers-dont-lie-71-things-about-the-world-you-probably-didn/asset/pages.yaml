- pgno: 188
  md: 'In any case, it''s better to personalize the problem by putting it in terms
    of the risk per passenger per hour of flight. The necessary data are in the annual
    safety report by the International Civil Aviation Organization, which covers large
    jetliners as well as smaller commuter planes.


    In 2017, so far the safest year in commercial flying, domestic and international
    flights carried 4.1 billion people and logged 7.69 trillion passenger-kilometers
    with only 50 fatalities. With the mean flight time at about 2.2 hours, this implies
    roughly 9 billion passenger-hours, and 5.6 × 10⁻⁹ fatalities per person per hour
    in the air. But how low is this risk?


    The obvious measuring stick is general mortality—the average death rate per 1,000.
    In affluent nations that now ranges between 7 and 11; I will use 9 as the mean.
    The year has 8,760 hours, this average mortality rises to 0.00001 or 1 × 10⁻⁶
    deaths per person per hour of living. This means that the average additional chance
    of dying while flying is just 5/1,000th of the risk of simply being alive. Smoking
    risks are 100 times as high; ditto for driving in a car. In short, flying has
    never been safer.


    Obviously, age-specific mortality for older people is much higher. For individuals
    of my age group (over 75) it is about 35 per 1,000 or 4 × 10⁻⁶ per hour (that
    means, of a million of us, four will die every hour). In 2017, I flew more than
    100,000 kilometers, spending more than 100 hours aloft in large jets whose last
    fatal accidents were, respectively, in 1983, 1993, 1997, and 2000. In every hour
    aloft the probability of my demise wasn''t even 1 percent higher than it would
    have had I stayed on the ground.


    Of course, I''ve had white-knuckle moments. The most recent one was in October
    2014, when my Air Canada Boeing 767 headed into the turbulent fringes of a mega-typhoon
    that was crossing over Japan.


    But never forget that quiet hospital rooms are what should really be avoided.
    Although the latest assessment of preventable medical errors has greatly reduced
    the previously exaggerated claims of risk, hospitalizations remain associated
    with increased exposure to bacteria and viruses, elevating the risks of hospital-acquired
    infections, particularly among the elderly. Keep on flying, and avoid hospitals!'
  merge: -1
  img_proc: true
