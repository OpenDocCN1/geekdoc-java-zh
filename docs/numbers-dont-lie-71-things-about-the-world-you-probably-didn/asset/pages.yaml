  md: '# Multiplying wheat yields


    What is the average wheat yield in central France, eastern Kansas, or in southern
    Hebei province? Few people besides the farmers, those who sell them machines and
    chemicals, the agronomists who counsel them, and the scientists who develop new
    crop varieties have the answers ready. This is because all a tiny share of the
    population in modern societies has become almost completely detached from anything
    to do with crop cultivation. Except, of course, for eating the products: every
    crunchy baguette and every croissant, every hamburger bun and every pizza, every
    bun (mantou) and every strand of twisted and stretched lamian noodles starts with
    wheat.


    But even those people who consider themselves well educated and widely informed,
    and who could point out the improved performance of cars or the rising capabilities
    of computers or cellphones, would have no idea if the average 20th-century staple
    grain crops had tripled, quintupled, or risen by an order of magnitude. And yet
    it is these multiples—not those of mobile phone capability or cloud storage—that
    have made it possible to nearly quintuple the global population between 1900 and
    2020 ... so what happened to the yields of wheat, the world’s dominant staple?'
  merge: -1
  img_proc: true
- pgno: 197
  md: '![](img/1055ff7c5aac304ec60cbf00b398a085_197_0.png)


    Its traditional yields were both low and highly variable, but reconstructions
    of long-term trends remain arguably. this even with a relatively well-documented
    (for nearly a millennium) history of English wheat yields, which were usually
    expressed as returns on planted seed. Following a poor harvest, up to 30 percent
    of the yield had to be saved for the next year''s seed, and the share was commonly
    no less than 25 percent. Early medieval harvests were often as low as 500–600
    kilograms per hectare (that is as low as 0.5 ton). Yields up to 1 ton per hectare
    became common only by the 16th century, and by 1850 the mean was about 1.7 t/ha—roughly
    a tripling since 1300. Then a combination of measures (crop rotation tripling
    including nitrogen-fixing legumes, field drainage, more intensive manuring, and
    new crop varieties) lifted the yields above 2 t/ha at a time when French yields
    were still only 1.3 t/ha and America''s extensive Great Plains fields produced
    only about 1 t/ha (and that was the worldwide mean even as late as 1950!).


    Decisive improvement came, after centuries of slow incremental advances, only
    with the introduction of short-stalked wheats. Traditional'
  merge: -1
  img_proc: true
- pgno: 198
  md: 'plants were tall (nearly tall as Bruegel''s peasants cutting them with scythes),
    producing three to five times more straw than grain. The first modern short-stalked
    wheat (based on East Asian plants) was released in Japan in 1935. After the Second
    World War it was brought to the US and given to Norman Borlaug at CIMMYT (the
    International Maize and Wheat Improvement Center in Mexico), and his team produced
    two high-yielding semi-dwarf varieties (yielding as much grain as straw) in 1962.
    Borlaug won the Nobel Prize; the world got unprecedented harvests.


    Between 1965 and 2017, the average global wheat yield almost tripled, from 1.2
    to 3.5 t/ha; the Asian average more than quintupled (from 1 to 3.3 t/ha), the
    Chinese mean, already extraordinarily high two generations ago, doubled from 4.4
    to 9.1 t/ha. In that time, the global wheat harvest nearly tripled to almost 775
    million tons, while the population increased 2.3-fold, raising the average per
    capita supply by about 25 percent and keeping the world comfortably supplied with
    wheat flour for crusty German Bauernbrot (made with wheat and rye flour), Japanese
    udon noodles (wheat flour, a little salt, water) and classic French mille-feuille
    (the puff pastry needed for the sheets is just flour and butter and a bit of water).


    But there are concerns. Average wheat yields have been leveling off not only in
    the EU countries with the highest productivity, but also in China, India, Pakistan,
    and Egypt, where they remain well below the EU mean.

    The reasons range from environmentally driven restrictions on the use of nitrogen
    fertilizers to water shortages in some regions. At the same time, wheat yields
    would be benefiting from higher atmospheric CO2 levels, and agronomic improvements
    should close some of the yield gaps (differences between a region''s yield potential
    and actual productivity). But, in any case, we would need substantially less wheat
    if we were to be able—finally—to reduce our indefensively high food waste.'
