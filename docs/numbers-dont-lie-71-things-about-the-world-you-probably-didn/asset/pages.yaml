  md: '# Growing taller


    Like many other inquiries into the human condition, studies of human height have
    heated their belated origins in 18th-century France, where between 1759 and 1777
    Philibert Gueneau de Montbeillard measured his son every six months—from birth
    to his 18th birthday—and the Comte de Buffon published the table of the 1777 supplement
    to his famous Histoire Naturelle. But Montbeillard''s son was tall for his time
    (as a young adult he matched today''s Dutchman), and we didn''t see systematic
    large-scale data on human height and the growth of children and adolescents until
    the 1830s, courtesy of Edouard Mallet and Adolphe Quetelet.


    Since we have studied all aspects of human height, ranging from its expected progress
    with age and its relation to weight, to its nutritional and genetic determinants
    and gender differences in growth spurts. As a result, we know—with high accuracy—expected
    heights (and weights) at different ages. If a young American mother comes to her
    pediatrician with a two-year-old boy measuring 93 centimeters, she will be told
    that her son is taller than 90 percent of children in his cohort.


    For those interested in long-term measures of progress, as well as revealing international
    comparisons, one of the best outcomes of modern systematic studies of growth has
    the well-documented history of rising average heights. Although stunting (inadequate
    growth that produces less height for age in young children) remains common in
    many poor countries, its global prevalence has declined—mostly thanks to rapid
    improvement in China—from about 40 percent in 1990 to about 22 percent in 2020,
    and growing taller was a global trend of the 20th century.'
  merge: -1
  img_proc: true
- pgno: 28
  md: '![](img/1055ff7c5aac304ec60cbf00b398a085_28_0.png)


    Better health and better nutrition—above all, greater intakes of high-quality
    animal protein (milk, dairy products, meat, and eggs)—have driven the shift, and
    being taller is associated with a surprisingly large number of benefits. These
    do not include generally higher life expectancy, but a lower risk of cardiovascular
    diseases, and also higher cognitive ability, higher'
  merge: -1
  img_proc: true
- pgno: 29
  md: 'lifetime earnings, and higher social status. Correlation between height and
    earnings was first documented in 1915 and has since been confirmed repeatedly,
    for groups ranging from Indian coal miners to Swedish CEOs. Moreover, the latter
    study showed that the CEOs were taller in firms with larger assets!


    Long-term population-wide findings are equally fascinating. Average male heights
    in preindustrial Europe were between 169 and 171 centimeters, and the global mean
    was about 167 centimeters. Abundant anthropometric data available for 200 countries
    show an average gain over the 20th century of 8.3 centimeters for adult women
    and 8.8 for men. The South Korean women recorded the century’s largest average
    female gains (20.2 centimeters) and Iranian men topped the male sequence with
    16.5 centimeters. Detailed Japanese data, recorded since 1900 for both sexes at
    12 different ages between 5 and 24, show how growth responds to nutritional constraints
    and improvements: between 1900 and 1940 the average height of 10-year-old boys
    rose by 0.15 cm/year, but wartime shortages cut it by 0.6 cm/year; the annual
    increase resumed only in 1949, and during the second half of the century it averaged
    0.25 cm/year. Similarly, the Chinese gains were interrupted by the world’s largest
    famine (1959-61), but males in major cities stood an average of 1.3 cm/year during
    the second half of the 20th century. In contrast, measurements for the second
    half of the 20th century show minimal gains in India and Nigeria, none in Ethiopia,
    and a slight decline in Bangladesh.


    And which nation has the tallest citizens? For males the record holders are the
    Netherlands, Belgium, Estonia, Latvia, and Denmark; for females it is Latvia,
    the Netherlands, Estonia, the Czech Republic, and Serbia; and the tallest cohort
    (whose average surpasses 182.5 centimeters) is that of the Dutchmen born during
    the last quarter of the 20th century. Milk has been a key growth factor, be it
    in Japan or in the Netherlands. Before the Second World War, Dutch males were
    smaller than American men, but post-1950 US milk consumption declined while in
    the Netherlands it rose until the 1960s—and it remains higher than in the US.
    The lesson is obvious: the easiest way to improve a child’s chances of growing
    taller is for them to drink more milk.'
  merge: -1
  img_proc: true
