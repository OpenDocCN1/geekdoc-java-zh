  md: '# Why manufacturing remains important


    Manufacturing has become both bigger and smaller. Between 2000 and 2017, the worldwide
    value of manufactured products has more than doubled, from $6.1 trillion to $13.2
    trillion. Meanwhile, the relative importance of manufacturing is dropping fast,
    retracing the earlier retreat of agriculture (now 4 percent of the world’s economic
    product). Based on the United Nations’ uniform national statistics, the manufacturing
    sector’s contribution to global economic product declined from 25 percent in 1970
    to less than 16 percent by 2017.


    The decline has registered in the stock market, which values many service companies
    above the largest manufacturing firms. At the end of 2019, Facebook—that purveyor
    of constant selfies—had a market capitalization of almost $575 billion, nearly
    three times more than Toyota, the world’s largest maker of passenger cars. And
    SAP, Europe’s largest software provider, was worth about 60 percent more than
    Airbus, Europe’s largest maker of jetliners.


    And yet manufacturing is still important for the health of a country’s economy,
    because no other sector can generate nearly as many well-paying jobs. Take Facebook,
    which at the end of 2019 had about 43,000 employees versus the 370,000 or so that
    Toyota had during the 2019 fiscal year. Making things still matters.'
