    In 2013, GS Yuasa''s unreliable lithium-ion batteries caused problems for the
    new Boeing 787. Add to this frequently changing governments, the March 2011 tsunami
    followed by the Fukushima disaster, constant concerns about an unpredictable North
    Korea, and worsening relations with China and South Korea, and you get a worrisome
    picture indeed.


    And there is an even more fundamental problem. In the long run, the fortunes of
    nations are determined by population trends. Japan is not only the world''s fastest-aging
    major economy (already every fourth person is older than 65, and by 2050 will
    be nearly 40 percent), but the population is also declining. Today''s 127 million
    will shrink to 97 million by 2050, and forecasts show shortages of the young labor
    force needed in construction and healthcare. Who will maintain Japan''s extensive
    and admirably efficient transportation infrastructures? Who will take care of
    the millions of old people? By 2050, people above the age of 80 will outnumber
    the children.


    Fortunes of all nations have followed specific trajectories of rise and retreat,
    but perhaps the greatest difference in their paths has been the time they spent
    at the top of their performance: some had a relatively prolonged plateau followed
    by steady decline (both the British empire and the 20th-century United States
    fit this pattern); others had a swift rise to a brief peak, followed by a more
    or less rapid decline. Japan is clearly in the latter category. Its swift post-Second
    World ascent ended in the late 1980s, and has downhill ever since: in a single
