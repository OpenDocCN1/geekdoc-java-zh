- pgno: 89
  md: 'When in 2011 Samuel Arbesman, at that time at the Institute for Quantitative
    Social Science at Harvard University, analyzed the lifespans of 41 ancient empires
    that existed between 3000 BCE and 60 CE, he found that their mean duration was
    220 years, but that the distribution of imperial lifespans was highly skewed,
    by those empires enduring at least 200 years being roughly six times as common
    as those surviving for eight centuries. Moreover, the three most durable empires—Mesopotamian
    Elam, lasting ten centuries; and Egypt''s Old and New Kingdoms, each surviving
    for five centuries—reached their maturity before 1000 BCE (Elam about 1600 BCE;
    the Egyptian kingdoms, 2800 and 1500 BCE).


    There has been no shortage of empires post 600 CE, but a closer look reveals no
    gains in longevity. China continued to have some of imperial rule until 1911,
    but that included a different dynasties—including those set up by foreign invaders,
    the short-lived Mongolian Yuan (1279–1368) and the Manchu Qing (1644–1911)—that
    exercised various degrees of control over shrinking and expanding territories,
    often with tenuous claims on the northern and western regions beyond the Han core.


    The timing of the Spanish and British empires is highly arguably. Taking 1492
    as the beginning of the Spanish empire and 1810 as its de facto end, means just
    over three centuries of rule from Madrid (or, after 1584, from El Escorial). And
    should we time the British empire since 1497 (John Cabot''s voyage to North America)
    or 1604 (the Treaty of London, concluding the Anglo-Spanish War)—and its end (leaving
    aside the micro-possessions of overseas territories, ranging from Anguilla to
    Turks and Caicos) as being in 1947 (the loss of India) or 1960 (when Nigeria,
    Africa''s most popular nation, became independent)? The later dates would give
    us 356 years.


    And there was no empire to last throughout the entire 200th century. The last
    Chinese dynasty, Qing, ended in 1911 after 267 years of rule, and the new Communist
    empire was set up in 1949. The Soviet empire, the successor of the Romanovs, eventually
    regained control of most of the territory ruled by the tsars (Finland and parts
    of Poland being the major exceptions), and after the Second World War it extended
    its control over the countries of eastern and central Europe as the Iron Curtain
    descended from the Baltic to the Black Sea.'
