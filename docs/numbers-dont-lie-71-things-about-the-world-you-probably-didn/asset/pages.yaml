    The miraculous 1880s


    Add to the feats of Benz, Maybach, and Daimler, whose success with gasoline-fueled
    engines inspired Rudolf Diesel to come up with a more efficient alternative just
    a decade later (see WHY YOU SHOULD''T DIE OFF JUST YET, p. 109). By the end of
    the 19th century we also had conceptual designs of the most efficient of all internal
    combustion engines: the gas turbine. And it was in the 1880s when Heinrich Hertz''
    experiments proved the existence of electromagnetic waves (produced by oscillation
    of electric and magnetic fields), whose wavelengths increase from very short'
  merge: -1
  img_proc: true
- pgno: 95
  md: 'cosmic rays to X-rays, ultraviolet, visible, and infrared radiation, to microwaves
    and radio waves. Their existence had been predicted by James Clerk Maxwell earlier,
    but Hertz made the practical opening onto our wireless world.


    The 1880s are also embedded in our lives in many smaller ways. A decade ago, in
    Creating the Twentieth Century, I traced several daily American experiences through
    mundane artifacts and actions that stem from that miraculous decade. A woman wakes
    up today in an American city and makes a cup of Maxwell House coffee (launched
    in 1886). She considers eating her favorite Aunt Jemima pancakes (sold since 1889)
    but goes for packaged Quaker Oats (available since 1884). She touches her blouse
    with an electric iron (patented in 1882), applies antiperspirant (available since
    1888), but cannot pack her lunch because she has run out of brown paper bags (the
    process to make strong kraft paper was commercialized in the 1880s).


    She commutes on the light rail system (descended directly from the electric streetcars
    that began using US cities in the 1880s), is nearly run by a bicycle (the modern
    version of which—with equal-sized wheels and a chain drive—was another creation
    of the 1880s: engines ARE OLDER THAN bicycle, p. 185), then goes through a revolving
    door (introduced in a Philadelphia building in 1888) into a multistory steel-skeleton
    skyscraper (the first one finished in Chicago in 1885). She stops at a newsstand
    on the first floor, buys a copy of the Wall Street Journal (published since 1889)
    from a man who rings it up on his cash register (patented in 1883). Then she goes
    up to the 10th floor in an elevator (the first electric one was installed in a
    New York City building in 1889), stops at a vending machine (introduced, in its
    modern form, 1883), and buys a cup of Coca-Cola (formulated in 1886). Before she
    starts her work she j down reminders with her ballpoint pen (patented in 1888).


    The 1880s were miraculous; they gave us such disparate contributions as antipersants,
    inexpensive lights, reliable elevators, and the theory of electromagnetism—although
    most people lost in their ephemeral tweets and Facebook gossip—are not even aware
    of the true scope of this cotidian debt.'
