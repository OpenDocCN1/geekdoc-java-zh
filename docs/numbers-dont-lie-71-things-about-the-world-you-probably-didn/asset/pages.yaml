  md: '# Triple-glazed windows: A see-through energy solution


    The quest for untested technical fixes is the curse of energy policy. Take your
    pick: self-driving solar-powered cars, inherently safe nuclear minireactors, or
    genetically enhanced photosynthesis.


    But why not start with what is proven? Why not simply reduce the demand for energy,
    beginning with residential and commercial buildings?


    Both in the United States and the European Union, buildings account for about
    40 percent of total primary energy consumption (transportation comes second, at
    28 percent in the US and about 22 percent in the EU). Heating and air conditioning
    account for half of residential consumption, which is why the single best thing
    we could do for the energy budget is to keep the heat in (or out) with better
    insulation.


    The most rewarding place to do is in windows, where the energy loss is the highest.
    That is to say, it has the highest thermal transmittance, measured in watts passing
    through a square meter of material, divided by the difference in temperature in
    kelvins on either side. A single pane has a heat transfer coefficient of 5.7-6
    watts per square meter per degree of kelvin; a double pane separated by 6 millimeters
    (air is a poor conductor of heat) has a coefficient of 3.3. Applying coatings
    to minimize the passage of ultraviolet and infrared radiation lowers it to 1.8
    and 2.2, and filling the space between the panes with argon (in order to slow
    down heat transfer) chops it down to 1.1. Do that with triple-glazed windows and
    you drop between 0.6 and 0.7. Substitute krypton for argon and you can get it
    down to 0.5.'
  merge: -1
  img_proc: true
- pgno: 249
  md: '![](img/1055ff7c5aac304ec60cbf00b398a085_249_0.png)


    double- or triple-glazed and gas-filled with low-e coatings


    minimal metal reinforcement


    warm edge spacer


    non-metal frame and sash


    compression seals


    foam insulation


    Insulating a window


    That’s a loss reduction of up to 90 percent compared to a single pane. In the
    world of energy savings, there are no other opportunities of magnitude applicable
    on a scale of billions of units. Bonus point: it would actually work.


    And there is also a comfort factor. With the outdoor temperature at -18°C (common
    January overnight lows in Edmonton, Alberta, or daily highs in Russia''s Novosibirsk)
    and the indoor temperature at 21°C, the surface temperature of a single-pane window
    is around 1°C, an older double-pane window will register 11°C, and the best triple-glazed
    window 18°C. At that temperature, you can sit right next to it.


    And triple-pane windows have the added advantage of reducing condensation on the
    interior glass by raising its temperature above the dew point. Such windows are
    already common in Sweden and Norway, but in Canada (with its low-cost natural
    gas) they may not be mandated before 2030, and as in many cold-weather jurisdictions,
    the required standard is still equivalent to just a double-glazed window with
    one low-emissivity coating.'
