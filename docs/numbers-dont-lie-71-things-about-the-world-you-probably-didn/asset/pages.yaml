  md: '# # The world without synthetic ammonia


    By the end of the 19th century, advances in chemistry and plant physiology made
    it clear that nitrogen is the most important macronutrient (element needed in
    relatively large amounts) in crop cultivation. Plants also require phosphorus
    and potassium (the other two macronutrients) and various micronutrients (elements
    ranging from iron to zinc, all needed in small amounts). A good harvest of Dutch
    wheat (9 tons per hectare) will contain about 10 percent protein or 140 kilograms
    of nitrogen, but only about 35 kilograms each of phosphorus and potassium.


    Traditional farmers supplied the needed nitrogen in two ways: by recycling any
    available organic materials (straw, stalks, leaves, human and animal waste) and
    by rotating grain or oil crops with legumes plants (cover crops such as alfalfa,
    clovers, and vetches; and food crops such as soybeans, beans, peas, and lentils).
    These plants are able to supply their own nitrogen because bacteria attached to
    their roots can “fix” nitrogen (convert from the inert molecule in the air to
    ammonia that is available to growing plants) and they leave some of it behind
    for the following grain or oil crop.


    The first option was laborious, especially the collection of human and animal
    waste and its fermentation and application to fields, by manures and night soil
    had relatively high nitrogen content (commonly 1–2 percent) compared to the less
    0.5 percent nitrogen in straw or stalks. The second option required crop rotation
    and prevented continuous cultivation of staple grains, be it rice or wheat. As
    the demand for staple grains grew with an expanding (and urbanizing) population,
    it became clear that farmers would not be able to meet future food needs without
    new, synthetic sources of “fixed” nitrogen—that is, nitrogen available in forms
    that can be tapped by growing crops.'
  merge: -1
  img_proc: true
- pgno: 194
  md: '![](img/1055ff7c5aac304ec60cbf00b398a085_194_0.png)


    The quest to do so succeeded by 1909, when Fritz Haber, professor of chemistry
    at Karlsruhe University, demonstrated how ammonia (NH3) could be made under high
    pressure and high temperature in the presence of a metal catalyst. The First World
    War and the economic crisis of the 1930s slowed the worldwide adoption of the
    Haber-Bosch process, but the food needs of the growing global population (from
    2.5 billion in 1950 to 7.75 billion in 2020) ensured its massive expansion, from
    less than 5 million tons in 1950 to about 150 million in recent years. Without
    this critical input it would have been impossible to multiply staple grain yields
    (see MULTIPLYING WHEAT YELDS, p. 226) and feed today''s global population.


    Synthetic nitrogenous fertilizers derived from Haber-Bosch ammonia (solid urea
    is the most common product) provide roughly half of all nitrogen required by the
    world''s crops, with the rest supplied by leguminous crops, organic recycling
    (manures and crop residues), and atmospheric deposition. Because crops now supply
    up to 85 percent of all food protein (with the rest coming from grazing and aquatic
    foods), this means that without synthetic nitrogen fertilizers, we could not secure
    enough food for the prevailing diets of over 3 billion people—more than the combined
    population of China (where synthetic nitrogen already provides in excess of 60
    percent of all inputs) and India. And with'
  merge: -1
  img_proc: true
- pgno: 195
  md: 'the growing populations in parts of Asia and in all of Africa, the shares of
    humanity dependent on synthetic nitrogen will soon rise to 50 percent.


    China stills some ammonia by using coal as the feedstock, but elsewhere the Haber-Bosch
    process is based on taking nitrogen from the air and hydrogen from natural gas
    (mostly CH4), and also using the gas to supply the high energy requirements of
    the synthesis. As a result, worldwide synthesis of ammonia and the subsequent
    production, distribution, and application of solid and liquid nitrogen fertilizers
    are now responsible for about 1 percent of global greenhouse emissions—and we
    do not have any commercial non-carbon alternative that could be deployed soon
    on the required mass scale of making nearly 150 million tons of NH4 a year.


    Immediately more worrisome are large nitrogen losses (volatilization, leaching,
    and denitrification) resulting from fertilizer use. Nitrates contaminate fresh
    waters and coastal seas (causing the expansion of dead zones); the atmospheric
    deposition of nitrates acidifies natural ecosystems, and nitrous oxide (N2O) is
    now the third-most important greenhouse gas following CO2, and CH4. A recent global
    assessment concluded that the nitrogen utilization efficiency has actually declined
    since the early 1960s to around 47 percent—more than half of the applied fertilizer
    is lost rather than incorporated into harvested crops.


    Demand for synthetic nitrogen is saturating in affluent countries, but large increases
    will be needed to feed 2 billion people to be born during the next 50 years in
    Africa. In order to cut future nitrogen losses, we should do everything possible
    to improve the efficiency of fertilization, reduce food waste (the INEXUSABLE
    MAGNITUDE OF GLOBAL FOOD WASTE, p. 230), and adopt moderate meat consumption (see
    RATIONAL MEAT-EATING, p. 251). And even that will not eliminate all nitrogen losses—but
    that is the price we pay for having gone from 1.6 billion people in 1900 toward
    10 billion by 2100.'
  merge: -1
  img_proc: true
