  md: '# # Why you need fossil fuels to get electricity from wind


    Wind turbines are the most visible symbols of the quest for renewable electricity
    generation. And yet, although they exploit the wind, which is as free and green
    as energy can be, the machines themselves are pure embodiments of fossil fuels.


    Large trucks bring steel and other raw materials to the site, earth-moving equipment
    beats a path to otherwise-inaccessible high ground, large cranes erect the structures—and
    all these machines burn diesel fuel. So do the freight trains and cargo ships
    that convey the materials needed for the production of cement, steel, and plastics.
    For a 5-megawatt turbine, the steel alone averages 150 tons for the reinforced
    concrete foundations, 250 tons and 500 tons for the rotor hubs and nacelles (which
    house the gearbox and generator),


    If wind-generated electricity were to supply 25 percent of global demand by 2030,
    even with a high average capacity factor of 35 percent the aggregate installed
    wind power of about 2.5 terawatts would require roughly 450 million tons of steel.
    And that''s without counting the metal for towers, wires, and transformers for
    the new high-voltage transmission links that would be needed to connect it all
    to the grid.'
  merge: -1
  img_proc: true
- pgno: 136
  md: '![](img/1055ff7c5aac304ec60cbf00b398a085_136_0.png)


    Large plastic blade of a modern wind turbine: difficult to make, more difficult
    to transport, even more difficult to recycle


    A lot of energy goes into making steel. Sintered or pelletized iron ore is smelted
    in blast furnaces, charged with coke made from coal, and receives infusions of
    powdered coal and natural gas. Pig iron (iron made in blast furnaces) is decarbonized
    in basic oxygen furnaces. Steel goes through continuous casting processes (which
    turn molten steel directly into the rough shape of the final product). Steel used
    in turbine construction typically embodies about 35 gigajoules per ton.


    To make the steel required for wind turbines that might operate by 2030, you’d
    need fossil fuels equivalent to more than 600 million tons of coal.


    A 5-megawatt turbine has three roughly 60-meter-long airfoils, weighing about
    15 tons. They have light balsa or foam cores and outer laminations made mostly
    from glass-fiber-reinforced epoxy or polyester resins. The glass is made by melting
    silicon dioxide and other mineral oxides in furnaces by natural gas. The resins
    begin with ethylene derived from light hydrocarbons—most commonly the products
    of naphtha cracking, liquefied petroleum gas, or the ethane in natural gas.


    The final fiber-reinforced composite embodies on the order of 170 gigajoules per
    ton. Therefore, to get 2.5 terawatts of installed wind power by 2030, we would
    need an aggregate rotor mass of about 23 million tons,'
  merge: -1
  img_proc: true
- pgno: 137
  md: 'incorporating the equivalent of about 90 million tons of crude oil. And when
    all is in place, the entire structure must be waterproofed with resins whose synthesis
    starts with ethylene. Yet another required oil product is lubricant, for the turbine
    gearboxes, which has to be changed periodically during the machine’s two-decade
    lifetime.


    Undoubtedly, in less than a year a well-suited and well-built wind turbine will
    generate as much energy as it took to produce it. However, all of it will be in
    the form of intermittent electricity—while its production, installation, and maintenance
    remain critically dependent on specific fossil energies. Moreover, for most of
    these energies—coke for iron-ore smelting; coal and petroleum coke to fuel cement
    kilns; naphtha and natural gas as feedstock and fuel for the synthesis of plastics
    and the making of fiberglass; diesel fuel for ships, trucks, and construction
    machinery; lubricant for gearboxes—we have no non-fossil substitutes that would
    be readily available on the requisite large commercial scales.


    For a long time to come—until all energies used to produce wind turbines and photovoltaic
    cells come from renewable energy sources—modern civilization will remain fundamentally
    dependent on fossil fuels.'
  merge: -1
