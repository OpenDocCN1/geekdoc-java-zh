- pgno: 169
  md: 'a Belgian electric car that topped 100 kilometers per hour. In 1913, Michelin
    introduced the removable steel wheel and hence the convenience of having a spare
    wheel in the trunk—a setup that has endured to this day.

    John Dunlop finally entered the Automotive Hall of Fame in 2005, and the Dunlop
    brand is still around, now owned by the Goodyear Tire and Rubber Company, the
    world''s third-largest maker of tires. Japan''s Bridgestone is the leader, Michelin
    is a close second—the rare example of a company that has stayed near the top of
    its industry for more than a century.


    Tires are quintessential products of the industrial age—heavy, bulky, polluting,
    still extremely difficult to dispose of—but even in our information era they are
    still needed in ever-higher numbers. Tire companies must meet the worldwide demand
    for nearly 100 million new road vehicles every year, and for replacements for
    the global fleet of more than 1.2 billion.


    Dunlop would be astounded by what he began. So much for the much-hyped dematerialization
    of our world that artificial intelligence is supposed to have started.'
