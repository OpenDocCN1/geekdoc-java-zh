- pgno: 235
  md: 'Other news is deeply discouraging: the number of elephants in Mozambique was
    halved between 2009 and 2014, to 10,000, and during the same five years more than
    85,000 Tanzanian elephants were killed, their total dropping from nearly 110,000
    to just 43,000 (the difference is accounted for by an annual 5 percent birth rate).
    New DNA analyses of large ivory seizures made between 1996 and 2014 have traced
    some 85 percent of the illegal killing to East Africa, above all in the Selous
    Game Reserve in southeastern Tanzania, the Niassa Reserve in northern Mozambique,
    and more recently also in central Tanzania.


    Most of the blame has rested with China’s continuing demand for ivory, of which
    much gets turned into elaborately kitschy carvings including statuettes of Mao
    Zedong, the man responsible for the greatest famine in human history. Recently
    international pressure finally worked, and China’s State Council banned all ivory
    trade and processing activities as of the end of 2017. This has had some positive
    effects, but Chinese tourists continue to buy ivory objects when they travel to
    neighboring countries.


    And if the slaughter were to stop, some African regions might face a new problem,
    evident for years in parts of South Africa: a surplus of elephants. It is no easy
    matter to manage expanding numbers of large and potentially destructive animals,
    especially those living in proximity to farmers and herders.'
