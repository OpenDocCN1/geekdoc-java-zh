    [content]

    # Planet of the cows


    For years I have tried to imagine how Earth would appear to a comprehensive and
    discerning probe dispatched by sapient extraterrials. Of course, the probe would
    immediately conclude, after counting all organisms, that most individuals are
    either microscopic (bacteria, archaea, protists, fungi, algae) or very small (insects),
    but also that their aggregate weight dominates the planetary biomass. That would
    not really be surprising. What these tiny creatures lack in size, they more than
    make up in numbers. Microbes occupy every conceivable niche of the biosphere,
    including many extreme environments. Bacteria account for about 90 percent of
    the human body''s living cells, and as much as 3 percent of its total weight.
    What would be surprising, however, is the picture the probe would paint of the
    macroscopic forms of animal life—cattle (Bos taurus) and humans (Homo sapiens),
    in order.


    Unlike the extraterrestrial scientists, we do not get an instant readout. Even
    so, we can quantify cattle biomass and human biomass (anthropomass) with a fair
    degree of accuracy. The numbers of large, domesticated ruminants in all high-income
    countries are known, and they can be reasonably estimated for all low-income and
    even pastoral societies. The UN’s Food and Agricultural Organization puts the
    global cattle count at about 1.5 billion in 2020.

