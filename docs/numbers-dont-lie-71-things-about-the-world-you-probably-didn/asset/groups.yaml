    多布罗沃尔斯基（Dobrovolsky）是一位担任德国 AEG 公司首席电气工程师的俄罗斯工程师，他在1889年制造了第一台三相感应电机。


    ![](img/1055ff7c5aac304ec60cbf00b398a085_98_0.png)


    年轻时的特斯拉


    如今，每年售出约120亿台小型非工业电机，其中包括约20亿个微型（直径仅4毫米）用于手机振动提醒的直流设备，其功率需求仅为瓦特的一小部分。而在光谱的另一端，6.5至12.2兆瓦的电机为法国高铁（TGV）提供动力，而用于动力压缩机、风扇和输送机最大的静式电机容量超过60兆瓦。这种无处不在与功率范围的结合表明，电机确实是现代文明不可或缺的能量来源。


    ## 变压器——无名的沉默、被动式器件


    我一直不喜欢对科学技术即将突破的夸大言论，例如廉价的核聚变、廉价的超音速旅行以及对其他行星的地球化。但我喜欢那些为现代文明承担了大量基础性工作的简单设备，特别是那些以如此谦逊——甚至隐于无形的方式完成工作的设备。


    没有任何设备比变压器更符合这一描述了。非工程师人员可能模糊地意识到这类设备的存在，但他们不知道它们是如何运作的，也不知道它们对于日常生活是多么不可或缺。


    ![](img/1055ff7c5aac304ec60cbf00b398a085_100_0.png)


    世界上最大的变压器：西门子中国制造


    理论基础奠于19世纪30年代初，由迈克尔·法拉第（Michael Faraday）和约瑟夫·亨利（Joseph Henry）独立发现了电磁感应。他们证明了变化的磁场可以感应出产生得较高电压的电流（被称为“升压”）或较低电压的电流（被称为“降压”）。又过了半个世纪，卢西恩·高拉德（Lucien
    Gaulard）、约翰·迪克斯森·吉布斯（John Dixon Gibbs）、查尔斯·布什（Charles Brush）和塞巴斯蒂安·齐亚尼·德费兰蒂（Sebastian
    Ziani de Ferranti）才设计出第一批实用的变压器原型。接下来，三个匈牙利工程师——奥托·布拉（Ottó Bláthy）、米克萨·德里（Miksa
    Déri）和卡卡洛·齐珀诺夫斯基（Károly Zipernowsky）通过建造环形（甜甜圈形）变压器改进了设计，并在1885年展示了它们。


    第二年，三位为乔治·威斯登豪斯（George Westinghouse）工作的美国工程师——威廉·斯坦利（William Stanley）、阿尔伯特·施密德（Albert
    Schmid）和奥利弗·B·沙伦伯格（Oliver B. Shallenberger）引入了更好的设计。该设备很快采用了自那时保留的经典斯坦利变压器形式：一个由薄硅钢叠片制成的中心铁芯，一部分呈“E”型，另一部分呈“I”型，以便于将预绕好的铜线圈滑到位。


    在1912年对美国电气学会的演讲中，斯坦利正确地赞叹该设备如何为一个困难的问题提供了“如此完整且简单的解决方案。它让所有的机械调节尝试显得相形见��。它以轻松、确定和经济的方式处理即时提供或从其获取的巨大能量负载。它是如此可靠、强劲和确定。在这些钢铜的混合物中，非凡的力量平衡得如此完美，以至于几乎无人能察觉。”


    这种持久设计的最大现代形态使得跨远距离输电成为可能。2018年，西门子交付了七台打破纪录的1100千伏变压器中的第一台，这些变压器将使几个中国省份的电力连接到一条长近3300公里的高压直流线上。


    得益于需要充电的便携电子设备的爆炸式增长，变压器的数量远远超过了斯坦利的设想。2016年，仅智能手机的全球产量就超过了18亿台，每台手机都由一个带有微型变压器的充电器支持。你不需要拆开手机充电器就能看到那个小设备的核心：网上发布了一份完整的iPhone充电器拆解图，变压器是其最大的组件之一。


    但许多充电器还包含更小的变压器。这些是非斯坦利式的（即不是线绕的）器件，它们利用了压电效应——受压晶体产生电流的能力，以及电流使晶体受压或变形的能力。冲击这种晶体的声波可以产生电流，流过这种晶体的电流可以产生电压。


    最新的创新是固态变压器，它们比传统变压器更小、更轻，特别是对于将可再生能源整合到电网中。


    ## 为什么你不应该完全放弃柴油


    1897年2月17日，慕尼黑工业大学的电气工程教授莫里茨·施罗特（Moritz Schröter）对迪塞尔（Diesel）的新发动机进行了正式测试。但令人失望的是，1897年这项创纪录的测试并没有带来快速的商业化部署。迪塞尔认为他拥有一台“完全具有市场价值的机器”，“其他部分将会自动发展”，这个结论是错误的。直到1911年，丹麦的Selandia号船才成为第一艘采用柴油发动机的货轮，发动机在第一次大战后才开始主了航运。重型铁路运输是它们的首次陆地征服，随后是重型道路运输、越野车辆以及建筑和农业机械。第一辆柴油汽车——梅赛德斯-奔驰260
    D于1936年问世。如今，在欧盟约40%的乘用车是柴油车，但在美国（汽油更便宜），柴油仅占3%。


