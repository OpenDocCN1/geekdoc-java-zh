    ![](img/1055ff7c5aac304ec60cbf00b398a085_103_4.png)


    迪塞尔对其内燃机的美国专利


    鲁道夫·迪塞尔最初希望发动机主要由小型独立生产者使用，作为工业去中心化的工具，但在120多年后，事实恰恰相反。柴油机是大规模中心化工业生产无可争疑的推动者，也是全球化不可替代的动力源。它们驱动着几乎所有的集装箱船，以及车辆、石油、液化天然气、矿石、水泥、肥料和谷物的载体运输工具。它们还驱动着几乎所有的卡车和货运火车。


    本书的大多数读者所食用或穿着的物品，至少有一次（通常是多次）是通过柴油驱动机器从其他大陆运输的：来自孟加拉的的衣服、南非的橙子、中东的原油、来自牙买的铝土、来自日本的汽车、来自中国的电脑。如果没有柴油机的低运行成本、高效率、高可靠性和卓越耐用性，无法实现如今定义现代经济的全球化程度。


    在了一个多世纪的使用中，柴油机在容量和效率上不断提高。现在航运最大的发动机额定功率超过81兆瓦（109000马力），其最高净效率略高于50%——优于气轮机的约40%效率（见“为什么气轮机是最佳选择”，第139页）。


