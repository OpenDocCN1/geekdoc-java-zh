    Michaux）让法国这种双脚踏车（vélocipède）设计流行起来。米肖的设计并没有成为现代自行车的雏形；它只是一个转瞬即逝的新奇物。整个19世纪70年代和80年代初由高头车（也被称为“普通”自行车或“大脚车”）主导，它们的踏板直接连接在直径高达1.5米的前轮轴上，以提供更长的单次行程。


    只有在1885年，约翰·坎普·斯特利（John Kemp Starley）和威廉·萨顿（William Sutton）发明的“罗孚”（Rover）安全自行车才出现，这种设计使用了等尺寸的轮子、链条驱动。虽然这种设计是笨拙的，但它在当时是极其先进的。直到1888年，约翰·邓禄（John
