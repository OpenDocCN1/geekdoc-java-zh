    植物曾长得很高（几乎像布鲁格画中用镰刀割作物的农民那么高），产生的秸秆产量是谷物的三到五倍。第一种现代短秆小麦（基于东亚植物）于1935年在日本上市。二战后，它被引入美国并交给了位于墨西哥的玉米和小麦改良中心（CIMMYT）的诺曼·博尔格（Norman
    Borlaug），他的团队在1962年培育出两个高产半矮品种（谷物产量与秸秆一样多）。博尔格获得了诺贝尔奖；世界获得了前所未有的丰收。


    从1965年至2017年，全球小麦平均产量增长了近三倍，从1.2吨/公顷增加到3.5吨/公顷；亚洲平均水平增加了五倍以上（从1吨/公顷增加到3.3吨/公顷），两代前就已经异常高的中国平均水平翻了一番，从4.4吨/公顷增加到9.1吨/公顷。在此期间，全球小麦收产量几乎增加了三倍，达到近7.75亿吨，而人口增长了2.3倍，使人均平均供应增加了约25%，并让世界拥有充足的面粉供应，用于制作酥脆的德国农民面包（Bauenbrot，由小麦粉和黑麦面粉制成）、日本乌冬面（小麦粉、少量盐、水）以及经典的法式千层酥（mille-feuille，所需的酥皮只需粉、黄油和少量水）。


    但担忧依然存在。小麦产量不仅在生产率最高的欧盟国家趋平缓，在中国、印度、巴基斯坦和埃及也是如此，这些国家的产量仍远低于欧盟平均水平。

    原因多样，从环境驱动驱动的氮肥使用限制到某些地区的缺水不等。与此同时，小麦产量将从大气二氧化碳水平的提高中获益，农艺改进也本可以缩小产量差距（即地区产量潜力与实际生产力之间的差异）。但无论如何，如果我们最终能够减少我们那毫无防御的高额食物浪费，我们需要的小麦将少得多。


    ## 全球食物浪费不可原谅的规模


    世界浪费食物的规模必须被描述为过度的、不可原谅的，而且考虑到我们对全球环境状况和人类生活质量的其他担忧，这种现象是完全无法理解的。联合国粮农组织（FAO）估计，全球根根作物、水果和蔬菜的年度损失率为40–50%，鱼类为35%，谷物为30%，油籽、肉类和乳制品为20%。这意味着在全球范围内至少三分之一的收获食物被浪费了。


    浪费食物的原因各不相同。在最贫穷的国家，通常是因为储存不善（啮齿动物、昆虫和真菌取食储存不当的种子、蔬菜和水果）或缺乏冷藏（导致肉类、鱼和乳制品迅速腐烂）。这就是为什么在撒哈拉以南非洲，大多数浪费发生在食物到达消费者之前。然而，在富裕世界，主要原因纯粹是过度生产与实际消费之间的差距：尽管高收入国家频繁过食，但大多数高收入国家为其公民提供的食物供应平均而言足以满足勤劳的伐木工人或煤矿工人，而不是对于大部分久坐和老龄的人口。


    ## 整个供应链中的食物浪费百分比


    ![](img/1055ff7c5aac304ec60cbf00b398a085_200_0.png)


    并不意外，美国是领先的浪费者，我们有充足的信息来量化这种过度。美国的平均每日食物供应量约为每人3,600千路里。这是供应量而非消费量——这也是好事。


    考虑一下如果你排除婴儿和卧在家中的八十旬老人（他们的每日需求少于1,500千路里），留给成年人的就是：美国人吃得太多，但他们不可能每天都吃那么多。美国农业部（USDA）根据“腐烂和其他浪费”对这些数字进行了调整，将实际平均可用食用量定为每人2,600千路里。但也不完全准确。根据国家健康和营养调查（NHANES）对自我报告食物消费的调查，以及基于预期代谢需求的计算均表明，美国的实际每日摄入量约为每人2,100千路里。从每人3,600千路里的供应量减去每人2,100千路里的摄入量，得到每人1,500千路里的损失，这意味着美国约40%的食物被浪费了。


    情况并非一直如此。在20世纪70年代初，美国农业部的人均平均食物供应量（经过零售前浪费调整）每天少于2,100千路里，比现在少了近25%。国家糖尿病和肾脏疾病估计，美国的人均食物浪费在1974年至2005年间增加了50%，而且从那时起变得更糟了。


    但即使美国的每日损失保持在每人1,500千路里，一个简单的计算显示，在2020年（人口约3.33亿），这些被浪费的食物可以为约2.3亿人提供足够的营养（每人2,200千路里），略多于巴西（这一拉丁美洲最大、人口最多的国家）的总人口。


    然而，当我们浪费食物时，美国人的摄入量远超健康水平。肥胖率（定义为体质量指数30或以上）在1962年至2010年间增加了一倍多，成年人中从13.4%上升到35.7%。再加上超重（BMI在25到30之间）的比例，你会发现成年人中74%的男性和64%的女性体重异常。最令人担忧的是，肥胖通常是一个终身状况，六岁以上儿童的这一比例现在已超过50%。


    英国的废物与资源行动计划（WRAP）通过对该现象的详细追踪提供了不同的视角。在英国，每年食物浪费总量高达1000万吨，价值150英镑（约200亿美元），但不可食用部分（皮屑、骨头）仅占其中的30%——这意味着70%的浪费食物本是可以吃的！WRAP还记录了这一过程中的原因：近30%的浪费是因为“不及时”，三分之一是因为“最佳日期”过期，约15%是因为烹饪或供应过多，其余的由于其他原因，包括个人偏好、挑食和意外。


    然而，食物损失不仅意味着浪费了营养——它不可避免地消耗了大量直接操作农机械和灌溉泵的劳动力能量，以及间接生产这些机械设备以及合成肥料和农药所需的钢、铝和塑料。额外的农业投入还通过导致土壤侵蚀、硝酸盐流失、生物多样性丧失和抗药生素细菌的产生来损害环境；而且浪费食物的生产可能占全球温室气体排放量的10%。富裕国家需要生产少得食物，并以更少的浪费进行消费。然而，提高产量的口号依然响亮如初。它最新的变体是最终向市场充斥由改良豆类蛋白制成的假肉，从而产生更多的食物浪费。相反，为什么不尝试寻找聪明的方法，将食物浪费减少到更可以接受的损失水平呢？减少一半食物浪费将为全球食物的合理利用铺平道路，收益可能是巨大的：WRAP估计，在食物浪费预防上投入1美元即可获得14倍的关联收益。这难道不够说服力吗？


    '
