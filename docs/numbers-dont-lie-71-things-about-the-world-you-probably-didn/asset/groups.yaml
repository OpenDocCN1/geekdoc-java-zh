    # # Why you need fossil fuels to get electricity from wind


    Wind turbines are the most visible symbols of the quest for renewable electricity
    generation. And yet, although they exploit the wind, which is as free and green
    as energy can be, the machines themselves are pure embodiments of fossil fuels.


    Large trucks bring steel and other raw materials to the site, earth-moving equipment
    beats a path to otherwise-inaccessible high ground, large cranes erect the structures—and
    all these machines burn diesel fuel. So do the freight trains and cargo ships
    that convey the materials needed for the production of cement, steel, and plastics.
    For a 5-megawatt turbine, the steel alone averages 150 tons for the reinforced
    concrete foundations, 250 tons and 500 tons for the rotor hubs and nacelles (which
    house the gearbox and generator),


    If wind-generated electricity were to supply 25 percent of global demand by 2030,
    even with a high average capacity factor of 35 percent the aggregate installed
    wind power of about 2.5 terawatts would require roughly 450 million tons of steel.
    And that''s without counting the metal for towers, wires, and transformers for
    the new high-voltage transmission links that would be needed to connect it all
    to the grid.'
  - '[PAGE 136]


    ![](img/1055ff7c5aac304ec60cbf00b398a085_136_0.png)


    Large plastic blade of a modern wind turbine: difficult to make, more difficult
    to transport, even more difficult to recycle


    A lot of energy goes into making steel. Sintered or pelletized iron ore is smelted
    in blast furnaces, charged with coke made from coal, and receives infusions of
    powdered coal and natural gas. Pig iron (iron made in blast furnaces) is decarbonized
    in basic oxygen furnaces. Steel goes through continuous casting processes (which
    turn molten steel directly into the rough shape of the final product). Steel used
    in turbine construction typically embodies about 35 gigajoules per ton.


    To make the steel required for wind turbines that might operate by 2030, you’d
    need fossil fuels equivalent to more than 600 million tons of coal.


    A 5-megawatt turbine has three roughly 60-meter-long airfoils, weighing about
    15 tons. They have light balsa or foam cores and outer laminations made mostly
    from glass-fiber-reinforced epoxy or polyester resins. The glass is made by melting
    silicon dioxide and other mineral oxides in furnaces by natural gas. The resins
    begin with ethylene derived from light hydrocarbons—most commonly the products
    of naphtha cracking, liquefied petroleum gas, or the ethane in natural gas.


    The final fiber-reinforced composite embodies on the order of 170 gigajoules per
    ton. Therefore, to get 2.5 terawatts of installed wind power by 2030, we would
    need an aggregate rotor mass of about 23 million tons,'
  - '[PAGE 137]


    incorporating the equivalent of about 90 million tons of crude oil. And when all
    is in place, the entire structure must be waterproofed with resins whose synthesis
    starts with ethylene. Yet another required oil product is lubricant, for the turbine
    gearboxes, which has to be changed periodically during the machine’s two-decade
    lifetime.


    Undoubtedly, in less than a year a well-suited and well-built wind turbine will
    generate as much energy as it took to produce it. However, all of it will be in
    the form of intermittent electricity—while its production, installation, and maintenance
    remain critically dependent on specific fossil energies. Moreover, for most of
    these energies—coke for iron-ore smelting; coal and petroleum coke to fuel cement
    kilns; naphtha and natural gas as feedstock and fuel for the synthesis of plastics
    and the making of fiberglass; diesel fuel for ships, trucks, and construction
    machinery; lubricant for gearboxes—we have no non-fossil substitutes that would
    be readily available on the requisite large commercial scales.


    For a long time to come—until all energies used to produce wind turbines and photovoltaic
    cells come from renewable energy sources—modern civilization will remain fundamentally
    dependent on fossil fuels.'
  - '[PAGE 138]


    # How big can a wind turbine be?


    Wind turbines have certainly grown up. When the Danish firm Vestas began the trend
    toward gigantism in 1981, its three-blade machines were capable of a mere 55 kilowatts.
    That figure rose to 500 kilowatts in 1995, reached 2 megawatts in 1999, and today
    stands at 5.6 megawatts. In 2021, MHI Vestas Offshore Wind''s V164 will stand
    105 meters high at the hub, swing 80-meter blades, and generate up to 10 megawatts,
    making it the first commercially available double-digit turbine ever. Not to be
    left behind, GE Renewable Energy is developing a 12-megawatt machine with a 260-meter
    tower and 107-meter blades, also rolling out by 2021.


    ![](img/1055ff7c5aac304ec60cbf00b398a085_138_0.png)


    Comparisons of wind turbine heights and blade diameters


    That is clearly pushing the envelope, although it must be noted that still-larger
    designs have been considered. In 2011, the UpWind project released what it called
    a “predesign” of a 20-megawatt offshore machine with a rotor'
  - '[PAGE 139]


    diameter of 252 meters (three times the wingspan of an Airbus A380) and a hub
    diameter of 6 meters. So far, the limit of the largest conceptual designs stands
    at 50 megawatts, with a height exceeding 300 meters and 200-meter blades that
    could flex in furious winds.


    To imply, as an enthusiastic promoter did, that building such a structure would
    pose no fundamental technical problems because it stands no higher than the Eiffel
    Tower, built over 130 years ago, is to choose an inappropriate comparison. If
    the constructible height of an artifact were the determinant of wind turbine design,
    we might as well refer to the Burj Khalifa in Dubai, a skyscraper that towers
    to 800 meters in 2010, or to the Jeddah Tower, which will reach 1,000 meters in
    2021. Erecting a tall tower is no great problem; it''s quite another proposition,
    to engineer a tall tower that can support a massive nacelle and rotating blades
    for many years of safe operation.


    Larger turbines must face the inescapable effects of scaling. Turbine power increases
    with the square of the radius swept by its blades: a turbine with blades twice
    as long would, theoretically, be four times as powerful. But the expansion of
    the surface swept by the rotor puts a greater strain on the entire assembly, and
    because blade mass (at first glance) increase as a cube of blade length, larger
    designs should be extraordinarily heavy. In reality, designs using lightweight
    synthetic materials and balsa can keep the actual exponent to little as 2.3.


    Even so, the mass (and hence the cost) adds up. Each of the three blades of Vestas''
    10-megawatt machine will weigh 35 tons, and the nacelle to nearly 400 tons (for
    the latter mass, think of lifting six Abrams main battle tanks a few hundred meters
    aloft). GE''s record-breaking design will have blades of 55 tons, a nacelle of
    600 tons, and a tower of 2,550 tons. Merely transporting such long and massive
    blades is an unusual challenge, although it could be made easier by using a segmented
    design.


    Exploring limits of commercial capacity is more useful than forecasting specific
    maxima for given dates. Available wind turbine power is equal to half the density
    of the air (which is 1.23 kilograms per cubic meter) times the area swept by the
    blades (pi times the radius squared) times the cube of velocity. Assuming a wind
    velocity of 12 meters per second and an energy conversion coefficient of 0.4,
    then a 100-megawatt turbine would require rotors nearly 550 meters in diameter.'
  - '[PAGE 140]


    To predict when we''ll get such a machine, just answer this question: When will
    we be able to produce 275-meter blades of plastic composites and balsa, figure
    out their transport and their coupling to nacelles hanging 300 meters above the
    ground, ensure their survival in cyclonic winds, and guarantee their reliable
    operation for at least 15 or 20 years? Not soon.'
  - '[PAGE 141]


    # # The slow rise of photovoltaics


    In March 1958, a rocket lifted off from Cape Canaveral bearing the Vanguard 1
    satellite: a small, 1.46-kilogram aluminum sphere that was the first to use photovoltaic
    (PV) cells in orbit.


    As a safeguard, the satellite’s two transmitters drew power from mercury batteries,
    but they failed after just three months. The photoelectric effect, the six small
    monocrystalline silicon cells—absorbing light (photons) at the atomic level and
    releasing electrons—could deliver a total of 1 watt, and it kept powering a beacon
    transmitter until May 1964.


    It happened because, in space, cost was no object. In the mid-1950s, PV cells
    ran about $300 per watt. The cost fell to about $80/W in the mid-1970s, to $10/W
    by the late 1980s, to $1/W by 2011, and by late 2019 PV cells were selling for
    just 8–12 cents per watt, with further declines certain to come (of course, the
    cost of installing PV panels and associated equipment in order to generate electricity
    is substantially higher, depending on the scale of a project: they now range from
    tiny roof installations to large solar fields in deserts).


    This is good news, because PV cells have a higher power density than any other
    form of renewable energy conversion. Even as an annual average they already reach
    10 watts per square meter in sunny places, more than an order of magnitude higher
    than biofuels can manage. And with rising conversion efficiencies and better tracking,
    it should be possible to increase the annual capacity factors by 20–40 percent.'
