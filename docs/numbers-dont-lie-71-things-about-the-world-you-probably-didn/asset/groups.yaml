    - 涡轮驱动的“兰西塔尼亚”号（RMS Lusitania）赢得了“蓝丝带奖”（最快跨越大西洋航行的奖项），成绩为4天19小时52分钟的成绩。最后的纪录保持者“美国总统”号（SS
    United States）在1952年用3天10小时40分钟完成了航程。


    下一个时代是商业用活塞发动机飞机需要14小时或更长时间才能跨越，但到了1958年，美国第一架商业涡轮喷气飞机波音707开始执行从伦敦到纽约的定期航班，耗时不到8小时（见《喷气机时代何时开始？》，第204页）。巡航速度并没有太大变化：波音787梦想客机的巡航速度为913
    km/h，伦敦到纽约的飞行仍需约7.5小时。


    昂贵、嘈闹且不幸的超音速“协和号”（Concorde）可以在3.5小时内完成，但那只鸟再也不会飞翔了。现在有几家公司正在开发超音速运输机，空中客车已获得了一种巡航速度为音速4.5倍的高音速概念专利。这种飞机从希思罗机场出发仅一小时即可到达JFK国际机场。


    但我们真的在更高的能量成本下需要这样的速度吗？与1838年“天狼星”号（Sirius）的用时相比，我们将跨越时间缩短了98%以上。飞行时间刚好够读一本厚实的小说——也许甚至是读这本书。


    ## 动机比自行车还要老！


    某些技术进步之所以是因为想象力的匮乏或一系列阻碍因素的出现而推迟的。我找不到比自行车更能同时说明这两点的例子了。


    两个多世纪前的1817年6月12日，在曼海姆，德国巴尔登大公国的一名林业员卡尔·德莱斯（Karl Drais）首次展示了他的“奔跑机器”（Laufmaschine），后来也被称为“德莱斯式自行车”（draisine）或“独轮马”。由于座椅位于中间，前轮转向，且车轮直径相同，它是所有后来需要不断平衡的车辆的雏形。然而，它的动力不是来自踏板，而是像弗莱德·弗林斯通（Fred
    Flintstone）那样用脚蹬地面。


    德莱斯骑着沉重的木制自行车在不到一小时内走了近16公里，比典型的马车快。但显而易见，至少在今天，这种设计是笨拙的，而且还没有足够的硬路。在1820年后的几十年里，尽管充满了机车、汽轮和制造技术等发明，为什么花了这么久才发明出一种让自行车成为实用机器、让婴儿以外任何人都能骑的动力装置？


