    by US technical superiority even before it started. Japan had already lost in
    material terms when it attacked Pearl Harbor—in 1940, the United States produced
    roughly 10 times as much steel as Japan did, and during the war the difference
    grew further.


    ## Japanese population over time


    ![](img/1055ff7c5aac304ec60cbf00b398a085_68_0.png)


    The devastated Japanese economy did not surpass its prewar peak until 1953. But,
    by then, the foundations had been laid for the country’s spectacular rise. Soon
