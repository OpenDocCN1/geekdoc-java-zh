    # The rise of megacities


    Modernity means many things—rising affluence and mobility; inexpensive and instant
    communication; an abundance of affordable food; longer life expectancy—but an
    extraterrestrial observer sending periodic reconnaissance probes to Earth would
    be impressed by a shift easily observable from space: the increasing pace of urbanization
    as cities keep encroaching, amoeba-like, on the surrounding countryside, creating
    massive blobs of intense light-like throughout the night.


    In 1800, less than 2 percent of the world''s population lived in cities; by 1900
    the share was still only 5 percent. By 1950 it had reached 30 percent, and 2007
    became the first year when more than half of humanity lived in cities. By 2016,
    the United Nations'' comprehensive survey found 512 cities with a population greater
    than 1 million, with 45 of them larger than 5 million and 31 surpassing 10 million.
    This largest group has a special name: “megacities.”


    This continued concentration of humanity in ever-larger cities has been driven
    by advantages arising from the agglomeration of people, knowledge, and activities,
    often due to collocation of kindred companies: on the global level, think of London
    and New York, the financial capitals, and of Shenzhen in China''s Guangdong province,
    the capital of electronics. Economies of scale bring many savings; interactions
    between producers, suppliers, and consumers are easier to handle; businesses have
    access to large pools of labor and diverse expertise; and (despite their environmental
    problems) the quality of life in large cities attracts talent, now often from
    all over the world. Cities are places of countless synergies and investment opportunities,
    and they offer superior educations and rewarding careers. This is why many smaller
    cities—like the surrounding countryside—are losing population, but megacities
    keep growing.'
  - '[PAGE 48]


    Ranking them by size is not straightforward, because assorted administrative boundaries
    yield different numbers than when the megacities are considered as functional
    units. Tokyo, the world’s largest megacity, has eight jurisdictional or statistical
    definitions, with the 23 wards of the old city, with fewer than 10 million people,
    to the National Capital Region area with nearly 45 million. The used by the city
    administration is the Tokyo Major Metropolitan Region (Tōkyō daitōshiken), which
    is defined by commuting access within 70 kilometers of the city’s massive twin-tower
    Metropolitan Government Building (Tōkyō tochchō) in Shinjuku: the region now has
    some 39 million people.


    The growth of megacities offers a perfect illustration of receding Western influence
    and the rise of Asia. In 1900, 9 of the world’s 10 largest cities were in Europe
    and the United States. In 1950 New York and Tokyo were the only megacities, and
    the third, Mexico City, was added in 1975. But by the century’s end list had grown
    to 18 megacities, and by 2020 it reached 35 with a total of more than half a billion
    inhabitants. Tokyo (with more people than Canada, and generating economic product
    equal to about half of the German total) remains at the top, and 20 out of the
    35 megacities (nearly 60 percent) are in Asia. There are six in Latin America,
    two in Europe (Moscow and Paris), three in Africa (Cairo, Lagos, Kinshasa), and
    two in North America (New York and Los Angeles).'
