    # Shrinking the journey across the Atlantic


    Commercial sailing ships had long taken three—sometimes four—weeks to make the
    eastbound crossing of the Atlantic; the westbound route, against the wind, usually
    took six weeks. The first meant to make the eastward crossing was in 1833, when
    the Quebec-built SS Royal William went to England after stopping to take coal
    in Nova Scotia. It was only in April 1838 that steamships pioneered the westward
    route. And it happened in an unexpectedly dramatic way.


    Isambard Kingdom Brunel, one of the great 19th-century British engineers, built
    the SS Great Western for the Great Western Steamship Company’s planned Bristol–New
    York run. The ship was ready on March 31, 1838, but a fire onboard delayed the
    scheduled departure until April 8.


    Meanwhile, the British and American Steam Navigation Company tried to steal a
    march by chartering the SS Sirius, a small wooden paddle-wheel vessel built for
    the Irish (London–Cork) service. The Sirius left Cobh, Ireland, on April 4, 1838,
    its boilers operating under 33 kilopascals for a peak engine power of 370 kilowatts
    (for comparison, a 2019 Ford Mustang is rated at 342 kilowatts). With 460 tons
    of coal onboard, the ship could travel nearly 5,400 kilometers (2,916 nautical
    miles)—almost, but not quite, all the way to New York Harbor.'
