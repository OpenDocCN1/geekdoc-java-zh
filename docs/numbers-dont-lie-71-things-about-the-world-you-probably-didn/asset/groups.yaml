    but perhaps the greatest difference in their paths has been the time they spent
    at the top of their performance: some had a relatively prolonged plateau followed
    by steady decline (both the British empire and the 20th-century United States
    fit this pattern); others had a swift rise to a brief peak, followed by a more
    or less rapid decline. Japan is clearly in the latter category. Its swift post-Second
    World ascent ended in the late 1980s, and has downhill ever since: in a single
    lifetime, from misery to an admired and feared—economic superpower, then on to
