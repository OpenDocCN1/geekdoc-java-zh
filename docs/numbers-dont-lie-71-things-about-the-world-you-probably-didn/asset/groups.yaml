    ## 对日本未来的担忧


    1945年9月2日，日本政府代表在停泊于东京湾的“密苏里号”战舰甲板上签署了投降书。这场可能是现代战争中最疯狂的一场战争就此结束，其结果在战争开始之前就已经由美国的技术优势所注定。当日本在1940年袭击珍珠港时，它在物质上已经处于失败——1940年，美国的钢铁产量大约是日本的10倍，在战争期间这一差距进一步扩大。


    ## 随时间变化的日本人口


    ![](imgimg/1055ff7c5aac304ec60cbf00b398a085_68_0.png)


    遭受创破坏的日本经济直到1953年才超过其战前巅峰。但到那时，该国壮丽的崛起已经奠定了基础。很快，其畅销的出口产品涵盖了从第一台晶体管收音机（索尼）到第一艘巨型原油轮船（住友）。第一辆本田思域于1973年进入美国，到1980年，日本汽车占了美国市场的30%。1973-74年，完全依赖原油进口的日本受到石油出口国组织（OPEC）将石油出口价格提高五倍的打击，但该国通过追求能源效率迅速完成了调整，并在1978年成为仅于美国的第二大经济体。到1985年，日元如此强劲，美国因受到日本进口产品的威胁而迫使货币贬值。但即便如此，经济依然飙升：在1985年1月之后的五年里，日经指数上涨了三倍多。


    这好得令人难以相信；事实上，这种成功反映了由通胀股票和房地产驱动的巨大泡沫经济的运作。2000年1月，在巅峰10年后，日经指数仅为1990年价值的一半，最近才升回这一低点。


    索尼、东芝和日立等标志性的消费电子制造商现在正挣于盈利。丰田和本田这两个曾以无与伦比的可靠性闻名的全球汽车品牌，正在召回数百万辆汽车。自2014年以来，德世（Takata）的缺陷气囊导致了最大的零件召回。2013年，雅科电池不可靠的锂离子电池为新的波音787带来了问题。再加上频繁更迭的政府、2011年3月的海啸以及随之而来的福岛灾难、对不可预测的朝鲜的持续担忧，以及与中国和韩国日益恶化的关系，这确实构筑了一幅令人担忧的图景。


    而且还有一个更根本的问题。从长远来看，国家的命运取决于人口趋势。日本不仅是世界上老龄化最快的主要的经济体（目前每四个人中就有一人年龄在65岁以上，到2050年这一比例将接近40%），而且人口还在减少。今天的1.27亿到2050年将萎缩至9700万，预测显示建筑和医疗保健领域所需的年轻劳动力将短缺。谁来维护日本广阔且令人赞叹的高效交通基础设施？谁来照顾数百万老年老人？到2050年，80岁以上的人数将超过儿童。


    所有国家的命运都遵循着特定的崛起和衰退轨迹，但其道路上最大的区别可能是处于表现巅峰的时间长短：有些国家经历了较长的平台期，然后是稳步的衰退（英国帝国和20世纪的美国都符合这一模式）；另一些国家则是迅速崛起达到短暂的巅峰，随后是或多或少的快速衰退。日本显然属于后者。它二战后快速的上升在20世纪80年代末结束，从那以后一路下坡：在短短的一生中，从贫困变成受人敬仰和恐惧的——一个仍然无法找到出路、正处于衰退的老龄化社会。


    ## 中国能走多远？


    许多文章预测中国将超越美国成为世界最大的经济体，这取决于我们使用购买平价（PPP）来消除汇率波动的影响。根据国际货币基金组织（IMF）的数据，2019年中国购买平价调整后的GDP比美国高出32%。


    ## 老年率，中国-美国


    | 年份 | 中国 | 美国 |

    |---|---|---|

    | 1950 | 8.5 | 14.2 |

    | 1975 | 8.8 | 19.7 |

    | 2000 | 11.3 | 20.9 |

    | 2020 | 18.5 | 38.4 |

    | 2050 | 47.5 | 40.4 |

    | 2070 | 58.2 | 48.3 |

    | 2100 | 83.9 | 76.5 |


    如果你依赖的是人民币兑美元汇率，美国在2019年高出约50%（21.4万亿对比14.1万亿）。但尽管近期中国GDP增长放缓——从双位数下降到每年6%至7%，而实际上低于这一数字——但仍远高于美国。因此，在物质意义上，中国成为第一只是时间问题。


    中国通往第一的道路始于1978年，当时该国拥抱了经济现代化，结束了三十年的管理不善。几十年来，中国一直是世界上粮食、煤炭和水泥最大的生产国，也是制造业（尤其是消费电子产品）的领先出口国。这并不意外：中国的人口是世界上最多的（2016年为14亿），其现代经济需要相应巨大的产出。


    但从相对角度来看，中国并不富裕：世界银行乐观计算的购买平价显示，2019年中国的人均GDP为19,504美元，在全球排名中位列第73位，在黑山和根之后，仅领先多米尼共和国、加蓬隆和巴哈马斯——这并不是一个令人惊讶的位置。大家都知道那些在温哥华和伦敦购买房产、在巴黎老佛马龙百货商场购买镶钻手表的中国富豪，但他们只占极少数人。


    GDP和新富的数量是衡量中国实际生活质量的误导性指标。环境仍在持续恶化。中国城市的空气污染极其糟糕：根据世界卫生组织的标准，直径大于2.5纳米的颗粒物最高接受水平为每立方米25微克，但许多中国城市反复超过500微克。2015年，北京的平均水平为80微克，而纽约则少于10微克。这种极高水平的污染增加了呼吸道疾病和心脏病的发病率，并缩短了寿命。


    水污染也无处不在。中国农村地区近一半的人缺乏现代卫生设施。


    '
