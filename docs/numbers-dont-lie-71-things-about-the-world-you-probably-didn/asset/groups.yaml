    | :--- | :--- |

    | 81 | 15th |

    | 82 | 24th |

    | 82 | 36th |


    The last time the UK was a net exporter of energy (oil and gas from the North
    Sea) was in 2003, and in recent years the country has been importing 30–40 percent
    of its primary energy—natural gas above all. Again, major shifts will take place
    in the near future, and the well-supplied global energy market will assure the
    continuation of affordable import prices.


    The UK—once the unrivaled inventor and pioneer of modern science-based manufacturing
    (it is the country of Michael Faraday, Isambard Kingdom Brunel, James Clerk Maxwell
    and Charles Algernon Parsons, after all)—is already deindustrialized by Canada,
    historically the least industrialized Western nation. In 2018, manufacturing accounted
    for 9 percent of the British GDP, compared to 10 percent in Canada, 11 percent
    in the US, and relatively, 19, 21, and 27 percent in remaining manufacturing superpowers
    such as Japan, Germany, and South Korea ... and 32 percent in Ireland, whose share
    beats even China’s 29 percent. Yet, again, no overnight shift in political arrangements
    can turn this historic tide.


    Much as the rest of Europe, the UK’s modern education provision has put excessive
    stress on quality, its healthcare system labors under many-studied constraints
    (easily illustrated by a stream of reports about overwhelmed National Health Service
    employees and overburdened hospitals), and its aging population will require more
    resources. The country’s old-age dependency ratio (number of people 65 and older
    as a share of all active people 20–64 years of age), standing at 32 percent in
    2020—still slightly lower than in France or Germany—will increase to 47 percent
    by the year 2050. No governmental intervention and no declaration of regained
    sovereignty and severance from the bureaucrats of Brussels will have any effect
    on this inexorable process.


    Given these fundamental realities, a rational observer must wonder what tangible
    differences could be gained by reassertion of British insularity. False claims
    can be painted on buses, extravagant promises are easy to make, feelings of pride
    or satisfaction may become fleetingly convincing—but none of those change what
    the UK has become: an aging nation; a deindustrialized and worn-out country whose
    capita GDP is now just over half of the Irish mean (something that Swift, Gladstone,
    or Churchill would find utterly unfathomable); another has-been power whose claim
    to uniqueness rests on having too many troubled princes and on exporting costumed
    TV series sets in fading country mansions staffed with too many servants.

