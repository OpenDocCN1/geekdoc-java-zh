  mdcn: '


    ## 印度 VS 中国


    印度会第一吗？这在计划之中：印度将很快取代中国，成为世界上人口最多的国家。问题是，印度是否也会崛起并对中国的经济大国地位发起挑战。


    至少自罗马帝国崩溃以来，中国历代王朝统治的人口一直多于任何其他政府。1912年帝国制统治结束时，中国有约4.28亿人口；1949年共产党执政时为5.42亿；到2000年达到12.7亿；到2019年底约为14亿。增长率的放缓是1979年采用、2015年结束的“独生政策”的直接结果（见前一章）。与此同时，印度的人口从1950年的3.56亿扩大到2000年的10.5亿，并到2019年底达到13.7亿。


    中国的优势正在迅速萎缩——鉴于短期人口预测的可靠性，目前似乎很明确，根据联合国最新的中位数预测，印度最晚于2025年将超过中国的总人口，甚至可能早至2023年。


    与此同时，比较这两个十亿级国家也是非常有趣的。两国都选择性地终止了许多女孩胎，导致出生性别比异常。正常比例是每1名女性对应1.06名男性，但印度为1.12，中国为1.15。


    ![](img/1055ff7c5aac304ec60cbf00b398a085_76_0.png)


    这两个国家都充斥着腐败：透明国际发布的最新《腐败感知指数》将印度和中国排在180个受访国家中的第80位（丹麦最廉洁，索马里最腐败）。在这两个国家，用基尼指数衡量的经济不平等程度都非常高——印度约为48，中国为51（相比之下，丹麦为25，英国为31，美国为38）。在两国，富裕阶层都在挥霍性消费中进行竞争，收集昂贵的汽车和华丽的住宅。信实工业有限公司主席穆凯·安巴尼（Mukesh
    Ambani）拥有世界上最昂贵的私人住宅；他的“安提利亚”（Antilia）是一座于2012年完成的27层摩天大楼，可以俯瞰孟买的贫民窟。


    但也存在本质区别。1980年以来的快速经济增长使中国成为两国中富得多的国家，名义GDP（根据国际货币基金组织2019年的估算）几乎是印度的五倍（14.1万亿美元对比2.9亿美元）。2019年，按购买力平价衡量，中国的人均平均收入（根据IMF数据）是印度的两倍以上（20,980美元对9,030美元）。


    另一方面，中国是由七个老人组成的政治局管理的严控一党制国家，而印度则继续作为一个极不完美但不可否认的民主政体。2019年，自由之家在其自由指数上给印度75分，而中国仅得111分（英国为93分，加拿大为99分）。


    另一个比较同样具有启发性：中国的高科技成就之一是对互联网实施严厉审查和高度侵入性的监控，作为新型、无处不在的社会信用体系的一部分；而印度大的高科技成就之一是其在国内外的科技企业领导层中提供了不成比例的贡献。许多印度移民已升至硅谷的领导岗位：最著名的包括苏达尔·查猜（Sundar
    Pichai）、微软的萨提·纳德拉（Satya Nadella）、Adobe的尚塔努·纳拉扬（Shantanu Narayan）以及GlobalFoundries的前首席执行官桑杰·杰（Sanjay
    Jay）。


    观察印度能在多大程度上复制中国的经济成功是非常有趣的。而中国必须应对人口红利的流失：自2012年以来，其依赖率——劳动年龄人口与太年轻或太老无法工作人口之比一直在上升（现在已略超过40%）。问题是这个国家是否会在真正富裕之前先老化。两国都面临巨大的环境问题，并且都面临养活人口的挑战——但印度的耕地多出约50%。


    最后一个复杂因素是：这两个核国家尚未签署具有约束力的条约来结束他们在喜马拉雅山的领土争议。他们曾发生过冲突，最著名的是1962年。当新兴力量对峙争议边境时，局势可能会变得紧张。


    然而，这种冲突并不是印度面临的最紧迫挑战。更紧迫的需求是尽可能地进一步降低其生育率（在其他条件相同的情况下，这将提高人均收入）、维持基本粮食自给自足的挑战，以及找到解决办法。


