  - '[PAGE 227]


    # Animals vs. artifacts—which are more diverse?


    Our count of living species remains incomplete. In the 250-plus years since Carl
    Linnaeus set up the modern taxonomic system, we have classified around 1.25 million
    species, about three-quarters of them animals. Another 17 percent are plants,
    and the remainder are fungi and microbes. And that''s the official count—the number
    of still-unrecognized species could be several times higher.


    The diversity of man-made objects is easily as rich. Although my comparisons involve
    not just those proverbial apples and oranges but apples and automobiles, they
    still reveal what we have wrought.


    I will construct my taxonomy of all man-made objects by creating a classification
    analogical to that of living organisms. The domain of all human designs is equivalent
    to the Eukarya (all living organisms that have nuclei in their cells), which contains
    the three large kingdoms of fungi, plants, and animals. I posit that the domain
    of all man-made objects contains a kingdom of complex, multicomponent designs,
    equivalent to the kingdom of animals. Within that kingdom we have the phylum of
    designs powered by electricity, equivalent to the Chordata, with a dorsal nerve
    cord. Within that phylum is a major class of portable designs, equivalent to mammals.
    Within that class is the order of communications artifacts, equivalent to Cetacea,
    the class of whales, dolphins, and porpoises, and it contains the family of phones,
    equivalent to Delphinidae, and the oceanic dolphins.'
