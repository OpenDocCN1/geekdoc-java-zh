    # # How safe is flying?


    ![](img/1055ff7c5aac304ec60cbf00b398a085_187_0.png)'
  - '[PAGE 188]


    In any case, it''s better to personalize the problem by putting it in terms of
    the risk per passenger per hour of flight. The necessary data are in the annual
    safety report by the International Civil Aviation Organization, which covers large
    jetliners as well as smaller commuter planes.


    In 2017, so far the safest year in commercial flying, domestic and international
    flights carried 4.1 billion people and logged 7.69 trillion passenger-kilometers
    with only 50 fatalities. With the mean flight time at about 2.2 hours, this implies
    roughly 9 billion passenger-hours, and 5.6 × 10⁻⁹ fatalities per person per hour
    in the air. But how low is this risk?


    The obvious measuring stick is general mortality—the average death rate per 1,000.
    In affluent nations that now ranges between 7 and 11; I will use 9 as the mean.
    The year has 8,760 hours, this average mortality rises to 0.00001 or 1 × 10⁻⁶
    deaths per person per hour of living. This means that the average additional chance
    of dying while flying is just 5/1,000th of the risk of simply being alive. Smoking
    risks are 100 times as high; ditto for driving in a car. In short, flying has
    never been safer.


    Obviously, age-specific mortality for older people is much higher. For individuals
    of my age group (over 75) it is about 35 per 1,000 or 4 × 10⁻⁶ per hour (that
    means, of a million of us, four will die every hour). In 2017, I flew more than
    100,000 kilometers, spending more than 100 hours aloft in large jets whose last
    fatal accidents were, respectively, in 1983, 1993, 1997, and 2000. In every hour
    aloft the probability of my demise wasn''t even 1 percent higher than it would
    have had I stayed on the ground.


    Of course, I''ve had white-knuckle moments. The most recent one was in October
    2014, when my Air Canada Boeing 767 headed into the turbulent fringes of a mega-typhoon
    that was crossing over Japan.


    But never forget that quiet hospital rooms are what should really be avoided.
    Although the latest assessment of preventable medical errors has greatly reduced
    the previously exaggerated claims of risk, hospitalizations remain associated
    with increased exposure to bacteria and viruses, elevating the risks of hospital-acquired
    infections, particularly among the elderly. Keep on flying, and avoid hospitals!'
  - '[PAGE 189]


    # # Which is more energy efficient—planes, trains, or automobiles?


    I have no animosity toward cars and planes. For decades I have depended for local
    travel on a succession of reliable Honda Civics, and for years I have flown intercontinentally
    at least 100,000 kilometers annually. At the two extremes—a drive to an Italian
    food store; a flight from Winnipeg to Tokyo—cars and planes rule.


    Energy intensity is the key. When one passenger in my Civic, it requires 2 megajoules
    per passenger-kilometer for city driving. Add another passenger and that figure
    drops to 1 MJ/pkm, comparable to a half-empty bus. Jet airliners are surprisingly
    efficient, commonly requiring around 2 MJ/pkm. With full flights and the latest
    airplane designs, they can do it at less than 1.5 MJ/pkm. Of course, public-transit
    trains are far superior: at high passenger loads, the best subways need less than
    0.1 MJ/pkm. But even in Tokyo, which has a dense network of lines, the nearest
    station may be more than a kilometer away, too far for many less-mobile people.


    But none of these modes of transportation can equal the energy intensity of intercity
    high-speed trains. These are typically on routes of 150–600 kilometers. Older
    models of Japan’s pioneering bullet train, the shinkansen (meaning “new main line”),
    had an energy intensity around 0.35 MJ/pkm; more recent fast-train designs—the
    French TGV and German ICE—typically need just 0.2 MJ/pkm. That’s an order of magnitude
    less than airplanes.'
  - '[PAGE 190]


    # Energy intensity of travel


    No less important, high-speed trains are indeed fast. The Lyon–Marseille TGV covers
    280 kilometers in 100 minutes, downtown to downtown. In contrast, the scheduled
    commercial flight time for about the same distance—300 kilometers from New York’s
    LaGuardia Airport to Boston’s Logan Airport—is 70 minutes. Then you must add another
    45 minutes for checking in, 45 minutes for the ride from Manhattan to LaGuardia,
    and 15 minutes for the ride from Logan to downtown Boston. That raises the total
    to 175 minutes.


    In a rational world—one that valued convenience, time energy intensity, and low
    carbon conversions—the high-speed electric train would always be the first choice
    for such distances. Europe is natural train country, and it has already made that
    decision. Yet even though the United States and Canada lack the population density
    to justify dense networks of these connections, they do have many city pairs that
    are suited for fast trains. Not'
