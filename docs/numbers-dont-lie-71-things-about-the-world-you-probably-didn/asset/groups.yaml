    ![](img/1055ff7c5aac304ec60cbf00b398a085_100_0.png)


    The world’s largest transformer: Siemens for China


    The theoretical foundation was laid in the early 1830s, with the independent discovery
    of electromagnetic induction by Michael Faraday and Joseph Henry. They showed
    that a changing magnetic field can induce a current of a higher voltage (known
    as “stepping up”) or a lower one (“stepping down”). It took another half-century
    before Lucien Gaulard, John Dixon Gibbs, Charles Brush, and Sebastian Ziani de
    Ferranti could design the first useful transformer prototypes. Next, a trio of
    Hungarian engineers—Ottó Bláthy, Miksa Déri, and Károly Zipernowsky—improved the
    design by building a toroidal (donut-shaped) transformer, which they exhibited
    in 1885.


    The very next year, a better design was introduced by a trio of American engineers—William
    Stanley, Albert Schmid, and Oliver B. Shallenberger, who were working for George
    Westinghouse. The device soon assumed the form of the classic Stanley transformer
    that has been retained since ever: a central iron core of thin silicon steel laminations,
    one part shaped like “E” and the other shaped like an “I” to make it easy to slide
    pre-wound copper coils into place.'
  - '[PAGE 101]


    In his address to the American Institute of Electrical Engineers in 1912, Stanley
    rightly marveled at how the device provided “such a complete and simple solution
    for a difficult problem. It puts to shame all mechanical attempts at regulation.
    It handles with such ease, certainty, and economy vast loads of energy that are
    instantly given to or taken from it. It is so reliable, strong, and certain. In
    this mingled steel and copper, extraordinary forces are so nicely balanced as
    to be almost unsuspected.


    The biggest modern incarnations of this enduring design have made possible to
    deliver electricity across great distances. In 2018, Siemens delivered the first
    of seven record-breaking 1,100-kilovolt transformers that will enable electricity
    supply to several Chinese provinces linked to a nearly 3,300-kilometer-long, high-voltage
    DC line.


    The sheer number of transformers has risen above anything Stanley could have imagined,
    thanks to the explosion of portable electronic devices that have to be charged.
    In 2016, the global output of smartphones alone was in excess of 1.8 billion units,
    each supported by a charger housing a tiny transformer. You don''t have to take
    your phone charger apart to see the heart of that small device: a complete iPhone
    charger teardown is posted on the Internet, with the transformer as one of its
    largest components.


    But many chargers contain even tinier transformers. These are non-Stanley (that
    is, not wire-wound) devices that take advantage of the piezoelectric effect—the
    ability of a strained crystal to produce a current, and of a current to strain
    or deform a crystal. Sound waves impinging on such a crystal can produce a current,
    and a current flowing through such a crystal can produce sound. One current can
    in in this way be used to create another current of a very different voltage.


    And the latest innovation is electronic transformers. They are much reduced in
    volume and mass compared with traditional units, and they will become particularly
    important for integrating intermittent sources of electricity—wind and solar—into
    the grid and for enabling DC microgrids.'
