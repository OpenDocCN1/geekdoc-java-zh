    ## 动机比自行车还要老！


    某些技术进步之所以是因为想象力的匮乏或一系列阻碍因素的出现而推迟的。我找不到比自行车更能同时说明这两点的例子了。


    两个多世纪前的1817年6月12日，在曼海姆，德国巴尔登大公国的一名林业员卡尔·德莱斯（Karl Drais）首次展示了他的“奔跑机器”（Laufmaschine），后来也被称为“德莱斯式自行车”（draisine）或“独轮马”。它的座椅位于中间，前轮转向，车轮直径相同，是所有后来需要不断平衡的车辆的雏形。然而，它的动力不是来自踏板，而是像弗莱德·弗林斯通（Fred
    Flintstone）那样用脚蹬地面。


    德莱斯骑着沉重的木制自行车在不到一小时内走了近16公里，比典型的马车快。但显而易见，至少在今天，这种设计是笨拙的，而且还没有足够的硬路。在1820年后的几十年里，尽管充满了机车、汽轮和制造技术等发明，为什么花了这么久才发明出一种让自行车成为实用机器、让婴儿以外任何人都能骑的动力装置？


