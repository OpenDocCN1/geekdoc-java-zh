  mdcn: '

    2000年，当该国启动大规模且耗资的可再生能源发电扩张计划（能源转型）时，德国居民用电价格处于低位且不断下降——在2000年触底时，每千瓦低于0.14欧元。


    到2015年，德国接近84吉瓦的太阳能和风能总容量已超过化石燃料发电厂的总装机容量；到2019年3月，超过20%的电力来自新型再生能源——但电价在18年内翻了一倍多，达到每千瓦0.29欧元。因此，欧盟最大的经济体拥有全大陆第二高电价：仅在高度依赖风能的丹麦（2018年，其41%的发电来自风能）价格更高，为每千瓦0.31欧元。美国也有类似的对比。在加州，随着新型再生能源占比的增加，电价上涨比全国平均水平快五倍，现在比全国平均高近60%。


    ## 无法避免的缓慢能源转型


    1800年，只有英国以及欧洲和北中国的少数地区燃烧煤炭产生热量——世界98%的初能源来自生物质燃料，主要是木材和木炭；在森林枯伐地区，能量还来自稻草和干燥的动物粪便。到1900年，随着煤炭开采的扩大以及北美和俄罗斯石油气的生产开始，生物质提供了世界一半的初能源；到1950年，这一比例仍接近30%，到21世纪初下降到12%，尽管在许多撒哈拉以南国家，这一比例仍保持在80%以上。显然，从“新碳”（植物组织中的碳）向煤炭、原油和天然气中的“旧碳”（化石碳）转型花费了很长时间。


    我们现在正处于一个更具挑战性的转型的早期：为了避免全球变暖最严重的后果，需要对全球能源供应进行脱碳。与普遍印象相反，这种转型的进展并不类似于手机的普及速度。从绝对意义上，世界正奔向碳——而非远离碳（参见第303页“奔向碳”），从相对意义来看，我们的收益仍保持在个位数。


    ## 全球能源转型


    ![](img/1055ff7c5aac304ec60cbf00b398a085_158_0.png)


    第一届联合国气候变化框架公约于1992年举行。那一年，化石燃料（将燃料和电力转换为BP在其年度统计报告中青睐的共同分母）提供了世界86.6%的初能源。到2017年，它们的占比为85.1%，在25年间仅减少了1.5%。


    这一衡量全球能源转型速度的指标，也许是对世界对化石碳持续根本性依赖最有说服力的提醒。一个世纪中1.5%的微小波动，是否能在之后的25至30年内，通过非碳替代方案取代世界80%的能源，从而在2057年实现化石碳零排放？按部常班我们无法到达那里，唯一可能的方案要么是全球经济崩溃，要么以远超我们目前能力的速度和规模采用新能源。


    新闻的业余读者会被风能和太阳能发电所谓的进展所误导。事实上，这些可再生能源确实一直在稳健且令人印象深刻地进步：1992年它们仅提供世界0.5%的电力，而2017年贡献了4.5%。但这意味着，在这25年间，电力发电的脱碳更多是归功于水电发电的扩张，而非太阳能和风能设施的总和。而且世界最终能源消耗中只有约27%是电力，这些进展转化到整体减排的份额要小得多。


    但太阳能和风能发电现在已是成熟行业，可以快速增加新容量——加速电力供应的脱碳速度。相比之下，几个部门仍然严重依赖化石燃料。热能、工业和运输部门是最难脱碳的领域，因为它们需要化石燃料目前提供的高级热或高能量密度。


    尽管太阳能和风能正在增长，全球能源总需求也在增加，这意味着碳排放量的下降速度并没有再生能源占比所显示的那么快。挑战不仅在于建设新设施，更在于替换全球经济现有的整个基础设施。


    ![](img/1055ff7c5aac304ec60cbf00b398a085_160_0.png)


    ## 我们如何实现


    ### 缩小大西洋


    1800年，帆船横跨大西洋需要三周——有时需要四周。蒸汽机让跨大旅行时间减少了一半以上，新记录不断。到1848年，昆纳德公司的“欧罗巴号”用8天23小时横跨。到1888年，一次横跨仅需6天；到1907年，蒸汽船在4天13小时内到达目的地。


    1838年，“大西部号”是第一艘横跨大西洋的蒸汽船。19世纪的工程师之一伊桑巴德·金基德·布鲁内尔为大西部蒸汽公司建造了“大西部号”。它于1838年3月31日从布斯托尔出发，于4月15日抵达纽约——耗时15天12小时12分钟。


    由英美蒸汽航运公司建造的“天狼号”是第一位竞争者。它于1838年4月4日从爱尔兰的科布出发，于4月22日抵达纽约——耗时18天14小时22分钟。尽管领先了四天，“天狼号”（平均速度14.87公里/小时）仍勉强胜过那艘更大、更快的船。


    “大西部号”：这艘轮桨蒸汽动力船仍保留了帆索。相比之下，“大西部号”曾是世界最大的客轮，一等舱有128张床。船的锅炉工作压力也为34千卡，但其引擎可输出约560千瓦（今天工业柴油发电机的功率），在首次航行中，平均速度为每小时16.04公里（慢于现在的顶级马拉松运动员，后者的平均速度超过21公里/小时）。船上携带460吨煤炭可以行驶近5400公里（2916海里）——几乎，但并未完全能到达纽约港。


    ![](img/1055ff7c5aac304ec60cbf00b398a085_162_0.png)

