    # India vs. China


    India as No. 1? It''s on the cards: India will soon supplant China as the world’s
    most populous country. The question is whether India will also rise to challenge
    China as an economic powerhouse.


    At least since the unraveling of the Roman empire, successive Chinese dynasties
    have ruled over more people than any other government. China had about 428 million
    people in 1912, when imperial rule ended; 542 million in 1949, when the Communists
    took power; 1.27 billion by the year 2000; and about 1.4 billion by the end of
    2019. The slowing growth rate is the direct result of the one-child policy, adopted
    in 1979 and ended in 2015 (see the previous chapter). Meanwhile, India’s population
    expanded from 356 million in 1950 to 1.05 billion in 2000, and to 1.37 billion
    by the end of 2019.


    China’s edge has been shrinking fast—and, given the reliability of short-term
    demographic forecasts, it seems clear that India will surpass China’s total no
    later than 2025 (according to the latest UN median forecast), and perhaps as early
    as 2023.


    Meanwhile, it is fascinating to compare the two giga-states. Both countries selectively
    abort many girls, creating abnormal sex ratios at birth. The normal ratio is 1.06
    males per one female, but India stands at 1.12 and China at 1.15.'
  - '[PAGE 75]


    <!-- no content -->'
  - '[PAGE 76]


    ![](img/1055ff7c5aac304ec60cbf00b398a085_76_0.png)'
  - '[PAGE 77]


    Both countries are riddled with corruption: the latest Corruption Perceptions
    Index, from Transparency International, puts India and China at 80th among the
    180 included countries (Denmark is the least corrupt and Somalia (the most). In
    both countries, economic inequality as measured by the Gini index is very high—about
    48 in India and 51 in China (compared to 25 in Denmark, 31 in the UK, and 38 in
    the US). And in both countries the moneyed classes compete in ostentatious consumption,
    collecting expensive cars and palatial residences. Mukesh Ambani, chairman of
    Reliance Industries Limited, owns the world''s most expensive private residence;
    his Antilia, a 27-story skyscraper completed in 2012, has a perfect view of Mumbai’s
    slums.


    But there are also fundamental differences. Rapid economic growth since 1980 has
    made China by far the richer of the two, with a nominal GDP (per the IMF estimate
    for 2019) nearly five times that of India ($14.1 trillion) versus $2.9 trillion).
    In 2019, China’s per capita average, measured in terms of purchasing power parity,
    was (according to the IMF) more than twice as high as India’s ($20,980 versus
    $9,030).


    On the other hand, China is a tightly controlled one-party state run by a politburo
    of seven aged men, while India continues as a highly imperfect but undeniably
    democratic polity. In 2019, Freedom House assigned India 75 points on its freedom
    index, compared with a measely 11 points for China (the UK 93 and Canada 99).


    Another comparison is equally revealing: one of China’s high-tech achievements
    is employing ferocious censorship of the Internet and highly intrusive monitoring
    as part of the new, pervasive Social Credit System; one of India’s great high-tech
    achievements is its disproportionate contribution to high-tech corporate leadership
    at home and abroad. Many Indian emigrants have risen to leadership in Silicon
    Valley: Sundar Pichai, Satya Nadella at Microsoft, Shantanu Narayan at Adobe,
    and Sanjay Jay, the former CEO of GlobalFoundries, to name the most prominent
    ones.


    It will be fascinating to see to what extent India can replicate China’s economic
    success. And China, for its part, must cope with its loss of the'
  - '[PAGE 78]


    demographic dividend: since 2012, its dependency ratio—the number of people working
    age divided by the number of those who are too young or too old to work—has been
    rising (it is now just over 40 percent). The question is whether the country will
    become old before it becomes truly rich. Both countries have enormous environmental
    problems and both will be challenged to feed their populations—but India has about
    50 percent more farmland.


    One last complication: these two nuclear powers have yet to sign a binding treaty
    to end their territorial disagreement in the Himalayas. They''ve come to blows
    over the matter, most notably in 1962. Things can get touch when rising powers
    sit athwart a disputed border.


    And yet this conflict is not India''s greatest immediate challenge. More pressing
    are the need to further lower its fertility rate as rapidly as possible (everything
    else being equal, that raises per capita income), the challenges of maintaining
    basic food self-sufficiency (a country of more than 1.4 billion is too large to
    rely on imports), and finding a way out of the deteriorating relations between
    the country''s Hindus and Muslims.'
