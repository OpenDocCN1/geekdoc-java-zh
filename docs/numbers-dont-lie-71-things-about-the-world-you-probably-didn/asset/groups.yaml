    # What’s worse for the environment—your car or your phone?


    Statistics on the production of energy are fairly reliable; accurate statistics
    on the consumption of energy by major sectors are harder to come by; and data
    on the energy consumed in the production of specific goods are even less reliable.
    Such energy embodied in products is part of the environmental price we pay for
    everything we own and use.


    The estimation of the embodied energy of finished goods relies not only on indisputable
    facts—so much steel in a car, so many microchips in a computer—but also on the
    inevitable simplifications and assumptions that must be made to derive overall
    rates. Which model of car? Which computer or phone? The challenge is to select
    reasonable, representative rates; the reward is to get a new perspective on the
    man-made world.


    Let’s focus on mobile devices and cars. Mobile devices, because they are the primary
    enablers of instant communication and boundless information; cars, because people
    still want to move in the real world.


    Obviously, a car weighing 1.4 tons (about as much as a Honda Accord LX) embodies
    more energy than the 140 grams of a smartphone (say, a Samsung Galaxy). But the
    energy gap is nowhere near so great as that 10,000-fold difference in mass.'
