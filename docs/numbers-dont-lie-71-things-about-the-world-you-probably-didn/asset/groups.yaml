    # When did the age of the car begin?


    In 1908, Henry Ford had been working in the auto business for more than a decade,
    and the Ford Motor Company, five years old and already profitable, had so far
    followed its peers by catering to the well-to-do. Its Model K, introduced in 1906,
    was priced at around $2,800, and the smaller Model N, introduced the same year,
    sold for $500—about what the average person earned in a year.


    Then, on August 12, 1908, the age of the automobile began, because on that day
    the first Ford Model T was assembled at Detroit’s Piquette Avenue Plant. It went
    on sale on October 1.


    Ford made his goals: “I will build a car for the great multitude. It will be large
    enough for the family, but small enough for the individual to run and care for.
    It will be constructed of the best materials ... after the simplest designs that
    modern engineering can devise. But it will be so low in price that no man making
    a good salary will be unable to own one.” He met those goals, thanks to his vision
    and the talent he was able to recruit, notably the designers Childe Harold Wills,
    Joseph A. Galamb, Eugene Farkas, Henry Love, C.J. Smith, Gus Degner, and Peter
    E. Martin.


    ![](img/1055ff7c5aac304ec60cbf00b398a085_171_0.png)


    # Ford Model T


    The four-cylinder water-cooled engine put out 15 kilowatts (today’s small cars
    are commonly eight times more powerful), the top speed was 72 kilometers per hour,
    and the price was low. The Runabout, the most popular model, sold for $825 in
    1909, but continuous design and manufacturing improvements let Ford lower the
    price to $260 by 1925. That represented about two and a half months’ wages for
    the average worker at the time. Today, the average new-car price in the United
    States is $34,000, or about 10 months’ median salary. In the UK, popular small
    car models average about £15,000 (about $20,000).


    Introduction of a moving assembly line at Detroit’s Highland Park factory in 1913
    brought substantial economies of scale: by 1914 the plant was already turning
    out 1,000 automobiles a day. And Ford’s decision to pay unprecedented wages for
    unskilled assembly labor assured uninterrupted production. In 1914 the rate was
    more than doubled, $5 to a day, and the working day was reduced to eight hours.


    The outcome was impressive. The Ford Motor Company produced 15 percent of all
    US cars in 1908, 48 percent in 1914, and 57 percent in 1923. By May 1927, when
    the production run ended, the company had sold 15 million Model Ts.


    Ford stood at the very beginning of manufacturing globalization, using standardized
    procedures and dispersing car assembly around the world. Foreign assembly began
    in Canada and then fanned out to the United Kingdom, Germany, France, Spain, Belgium,
    and Norway, as well as to Mexico, Brazil, and Japan.


    But even though Ford staked much on this one car, it didn’t become the bestselling
    vehicle in history. That primacy belongs to the “people’s car” of Germany—the
    Volkswagen. Soon after he came to power, Adolf Hitler decreed its specifications,
    insisted on its distinctive beetle-like appearance, and ordered Ferdinand Porsche
    to design it.


    By the time it was ready for production, in 1938, Hitler had other plans, and
    the car’s assembly didn’t begin until 1945, in the British-occupied zone. German
    production ended in 1977, but the original VW Beetle continued to be assembled
    in Brazil until 1996 and in Mexico until 2003. The last car, made in Puebla, was
    number 21,529,464.


    But in many ways the Beetle was just an updated emulation of the Model T. There
    can never be any dispute over who mass-produced the first affordable passenger
    car.


    # Modern cars have a terrible weight-to-payload ratio


    A century ago, the bestselling car in the United States, Ford''s Model T, wrung
    a watt from every 12 grams of its internal combustion engine. Now, bestselling
    American cars are getting a watt per gram—a 92 percent improvement. That is the
    one bit of happy news I am going to impart.


    Now for the bad news: US data show that during the past 100 years, average power
    has increased more than 11-fold, to about 170 kilowatts. This means that despite
    a huge drop of mass/power density, today''s typical car is much heavier than it
    was a century ago—and the average car itself has roughly tripled, reaching more
    than 1,800 kilograms for all light-duty vehicles, nearly half of which are pickups,
    SUVs, and minivans.


    # Weight-to-payload ratio (assuming 70 kg adult)


    ![](img/1055ff7c5aac304ec60cbf00b398a085_173_0.png)


    And because nearly three-quarters of US commuters drive alone, you get the worst
    possible ratio of vehicle-to-passenger weight. Because the auto industry is talking
    about “lightweighting”—using aluminum, magnesium, and even carbon fiber-reinforced
    polymers to reduce total weight—here, in ascending order, are a few weight ratios
    that can achieve:


    - 0.1 for a 70 kg bicycle

    - 1.6 for a 110 kg Vespa scooter

    - 5.3 or less for a modern bus

    - 7.3 for France’s 510 kg Citroën (deux chevaux, or “two horses”), back in the
    1950s

    - 7.7 for the Ford F-150 introduced in 1964 and also for Japan’s shinkansen rapid
    train

    - 12 for a Smart car, 16 for a Mini Cooper, or my own Honda Civic

    - 26 for the average light-duty vehicle in 2013

    - 28 for the BMW 740i

    - 32 for the Ford F-150, the bestselling American vehicle

    - 39 for the Cadillacade


    Of course, you can get spectacular ratios by pairing the right car with the right
    driver. I regularly see a woman driving a Hummer H2 that easily weighs 50 times
    as much as she does. That’s without a steam shovel. To put it in perspective,
    consider that the latest Boeing 787-10 does better than a Citroën. Its maximum
    takeoff weight is 254 tons; with 330 passengers and another 25 tons of cargo,
    the overall weight-to-payload ratio comes to just 5.3.


    Cars got heavy because part of the world got rich and drivers got codled. Light-duty
    vehicles are larger, and they come equipped with more features, including automatic
    transmissions, air conditioning, entertainment and communication systems, and
    an increasing number of servomotors powering windows, mirrors, and adjustable
    seats. And new battery-heavy hybrid drives and electric cars will not be lighter:
    the all-electric Ford Focus weighs 1.7 tons, General Motors’ Volt is more than
    1.7 tons, and the Tesla is just above 2.1 tons.


    Lighter designs would help, but obviously nothing could halve (or quarter) the
    ratio as easily as having two or four people in a car. And yet in the United States,
    that is the hardest thing to enforce. The 2019 State of American Commute reported
    that nearly three-quarters of commuters drive alone. Car commutes are much less
    common in Europe (36 percent in the UK), and even rarer in urban Japan (just 14
    percent)—but average car sizes have been increasing both in the EU and in Japan.


    And so the outlook is for ever-better engines or electric motors in heavy vehicles
    used in a way that results in the worst weight-to-payload ratios at any mechanized
    means of personal transportation in history.


    These cars may be, by some definition, smart—but they are not wise.


    # Why electric cars aren’t as great as we think (yet)


    Let me begin with a disclaimer: I am neither promoting electric vehicles (EVs)
    nor denigrating them. I simply observe that the rational case for accepting them
    has been undermined by unrealistic market forecasts and a disregard for the environmental
    effects involved in producing and operating vehicles.


    Unrealistic forecasts have been, and continue to be, the norm. In 2010, Deutsche
    Bank predicted that EVs would claim 11 percent of the global market by 2020—in
    reality, they will be less than 4 percent. And this triumph of hope over experience
    continues. Recent forecasts for 2030 have EVs adding up to as much as 20 percent
    of the global car fleet, or as little as 2 percent. Bloomberg New Energy Finance
    sees 548 million EVs on roads by 2040; Exxon only 162 million.


    EV enthusiasts have also neglected to note the environmental consequences of mass-scale
    conversion to electric drive. If EVs are to reduce carbon emissions (and thus
    minimize the extent of global warming), their batteries must not be charged with
    electricity generated from the combustion of fossil fuels. But in 2020, just over
    60 percent of global electricity will originate from fossil fuels; about 12 percent
    will come from wind and solar; and the rest from hydro energy and nuclear fission.

