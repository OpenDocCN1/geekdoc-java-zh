    And the prospects are not good. A new pattern of eating has become the norm among
    the young people, who also buy less fresh food than their parents did. Spain,
    for example, has no shortage of McDonald’s, KFCs, Taco Bells, and Dunkin’ Donuts—or
    Dunkin’ Coffee, as it’s called there. The global reach of meaty, fatty, salty,
    and sugary fast food is doing away not just with an ancient culinary heritage,
    but also with one of the few advantages the ancient world had over the modern
    one.


    Reasons for this shift have been universal. Higher incomes allow higher meat,
    fat, and sugar intakes. Traditional families have been replaced by two-income
    and single-person households that cook less at home and buy more ready-to-eat
    meals. And busier lifestyles promote snacking and convenience food. It’s no wonder
    that obesity rates have been increasing in Spain and Italy, as well as in France.'
