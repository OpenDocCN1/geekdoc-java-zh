    the price of oil exports, but the country adjusted rapidly by pursuing energy
    efficiency, and in 1978 it became the world’s second-largest economy after the
    US. By 1985, the yen was so strong that the United States, feeling threatened
    by Japanese imports, forced the currency’s devaluation. But even afterward the
    economy soared: in the five years following January 1985, the Nikkei index rose
    more than threefold.


