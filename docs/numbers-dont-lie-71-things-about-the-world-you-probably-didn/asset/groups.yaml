    conventional gas turbines and onshore wind—but less than $30/MWh for CCGTs.


    Gas turbines are also used around the world for the combined production of electricity
    and heat. Steam and hot water are required in many industries, and are used to
    energize central heating systems that are particularly common in many large European
    cities. These turbines have even been used to heat and light extensive Dutch greenhouses,
    which additionally benefit from the carbon dioxide that is generated—as it speeds
    up the growth of vegetables. Gas turbines also run compressors in many industrial
    enterprises and in the pumping stations of long-distance pipelines.


    The verdict is clear: no other combustion machines combine so many advantages
    as do modern gas turbines. They''re compact, easy to transport and install, and
    relatively silent, affordable, and efficient, offering nearly instant output and
    able to operate without water cooling. All this makes them the unrivaled machine
    to supply both mechanical energy and heat.


    And their longevity? The Neuchâtel turbine was decommissioned in 2002, after 63
    years of operation—not due to any failure in the machine but because of a damaged
    generator.


    ## Nuclear electricity—an unfulfilled promise


    The age of commercial nuclear electricity generation began on October 17, 1956,
    when Queen Elizabeth II switched on Calder Hall, on the northwest coast of England.
    Sixty years is long enough to judge the technology, and I still cannot improve
    on my evaluation from a decade ago: “successful failure.”


    The success part is well-documented. After a slow start, reactor construction
    began to accelerate during the late 1960s, and by 1977 more than 10 percent of
    US electricity came from fission, rising to 20 percent by 1991. That was a faster
    penetration of the market than photovoltaics and wind turbines have managed since
    the 1990s.


    In late 2019, the world had 449 operating reactors (and 53 under construction),
    many with capacity factors of better than 90 percent. That’s the share of the
    reactors’ potential output that they averaged year-round, producing more than
    twice as much electricity as photovoltaic cells and wind turbines combined. In
    2018, nuclear power provided the highest share of electricity in France (about
    72 percent), 50 percent in Hungary, Swiss reactors contributed 38 percent, and
    in South Korea it was 24 percent, while the share in the US was just below 20
    percent.


    ![](img/1055ff7c5aac304ec60cbf00b398a085_132_0.png)


    ## Nuclear electricity production


    ![](img/1055ff7c5aac304ec60cbf00b398a085_132_1.png)


    The “failure” part has to do with unmet expectations. The claim that nuclear electricity
    would be “too cheap to meter” is not apocryphal: that Lewis L. Strauss, chairman
    of United States Atomic Energy Commission in 1954, told the National Association
    of Science Writers in New York in September of that year. And equally audacious
    claims were still to come. In 1971, Glenn Seaborg, a Nobelist and the then-chairman
    of Atomic Energy Commission, predicted that nuclear would generate nearly all
    electricity by 2000. Seaborg envisioned giant coastal desalinating sea water;
    geostationary satellites powered by compact reactors for broadcasting TV programs;
    nuclear-powered tanks; and nuclear explosives that would alter the flow of rivers.
    Meanwhile, nuclear propulsion would carry men to Mars.


    But the project to generate electricity from fission stalled during the 1980s,
    as demand for electricity in affluent economies fell and problems with nuclear
    plants multiplied. And three failures were worrisome: accidents at Three Mile
    Island in Pennsylvania in 1979, at Chernobyl in Ukraine in 1986, and at Fukushima
    in Japan in 2011 provided further evidence for those opposed to fission under
    any circumstances.


    Meanwhile, there have been overruns in the construction of nuclear plants and
    a frustrating inability to come up with an acceptable way for permanent storage
    of the spent fuel (currently temporarily stored in containers at power plant sites).
    Nor has there been much success in switching to reactors that might be safer and
    less expensive than the dominant design of pressurized water reactors, which are
    essentially versions of US Navy designs from the 1950s.


    As a result, the Western world remains unconvinced, electricity-generating companies
    are wary, Germany and Sweden are on course to shutting down their entire industries,
    and even France plan to cut back. The reactors that are now under construction
    worldwide will not be able to make up for the capacity that will be lost as aging
    reactors are shut down in coming years.


    The only leading economies with major expansion plans are in Asia, led by China
    and India, but even they can''t do much to reverse the decline in the share of
    nuclear power in worldwide electricity generation. That share peaked at nearly
    18 percent in 1996, fell to 10 percent in 2018, and is expected to bump up to
    just 12 percent by 2040, according to the International Energy Agency.

