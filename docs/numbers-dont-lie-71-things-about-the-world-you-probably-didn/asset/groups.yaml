    # The rise of data: Too much too fast


    Once upon a time, information was deposited only inside human brains, and ancient
    birds could spend hours retelling stories of conflicts and conquests. Then external
    data storage was invented.


    Small clay cylinders and tablets, invented in Sumer Mesopotamia some 5,000 years
    ago, often contained just a dozen cuneiform characters in that ancient language,
    equivalent to a few hundred (or 10²) bytes. The Oresteia, a trilogy of Greek tragedies
    written by Aeschylus in the fifth century BCE, amounts to about 300,000 (or 10⁶)
    bytes. Some rich senators in imperial Rome had libraries hundreds of scrolls,
    with one large collection holding at least 100 megabytes (10⁸ bytes).


    A radical shift came with Johannes Gutenberg’s printing press, using movable type.
    By 1500, less than half a century after its introduction, European printers released
    more than 11,000 new book editions. This extraordinary rise was joined by advances
    in other forms of stored information. First came engraved and engraved music scores,
    illustrations, and maps. Then, in the 19th century, woodcuts, sound recordings,
    and movies. New information storage modes added during the 20th century included
    magnetic tapes and long-playing records, and beginning in the 1960s, computers
    expanded the scope of digitization to modern imaging (a digital mapping 50 megabytes),
    animated movies (2–3 gigabytes), intercontinental financial transfers, and eventually
    the mass emailing of spam (more than 100 million messages sent every minute).
    This digitally stored information rapidly surpassed all printed materials. Shakespeare’s
    plays and poems in their entirety amount to 5 megabytes, the equivalent of just
    a single high-resolution photograph, or of 30 seconds of high-fidelity sound,
    or of 8 seconds of streamed high-definition video.'
