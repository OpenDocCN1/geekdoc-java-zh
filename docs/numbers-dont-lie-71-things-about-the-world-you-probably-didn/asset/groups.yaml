    Documented cases of such long-distance chases come from three continents and include
    some of the fastest quadrupeds. In North America, the Tarahumara of northwestern
    Mexico could outrun deer. Further north, Paiutes and Navajos could exhaust pronghorns.
    In South Africa, Kalahari Basarwa ran down a variety of antelopes and even wildebeasts
    and zebras during the dry season. In Australia, some Aborigines would outrun kangaroos.


    These runners would even have had an advantage over the modern runners using expensive
    athletic shoes; their barefoot running not only reduced their energy costs by
    about 4 percent (a nontrivial advantage on long runs), it also exposed them to
    fewer acute ankle and lower-leg injuries.


    In the race of life, humans are neither the fastest nor the most efficient. But
    thanks to our sweating capability, we are certainly the most persistent.


    ## How many people did it take to build the Great Pyramid?


    Given the time elapsed since the completion of Khufu’s Great Pyramid (nearly 4,600
    years), the structure—albeit stripped of the smooth white limestone cladding that
    made it shine from afar—stands remarkably intact, and hence there is no argument
    about its exact shape (a polyhedron with regular polygon base), its original height
    (146.6 meters including the lost pyramididion or capstone), and volume (about
    2.6 million cubic meters). However, we may never know how it was built, because
    every common explanation is problematic. A single long ramp would have required
    an enormous amount of material to construct, and moving stones up shorter, wraparound
    ramps would have been tricky—as would lifting and jacking up more than 2 million
    stones into position. But just because we do not know how it was erected does
    not mean that we cannot say with some confidence how many people were required
    to build it.


    ![](img/1055ff7c5aac304ec60cbf00b398a085_37_0.png)


    ## The great pyramids of Giza


    We must start with the time constraint of two decades, the length of Khufu’s reign
    (he died around 2530 BCE). Herodotus, writing more than 21 centuries after the
    pyramid’s completion, was told during his visit to Egypt that labor gangs totaling
    100,000 men at a time worked in three-month spells to finish the structure. In
    1974, Kurt Mendelssohn, a German-born British physicist, put the labor force at
    70,000 seasonal workers and up to 10,000 permanent masons. But these are large
    underestimates, and we can come close to the real number by resorting to inescapable
    physics.


    The Great Pyramid’s potential energy (what is required to lift the mass above
    ground level) is about 2.4 trillion joules. Calculating this is fairly easy: it
    is simply the product of the acceleration due to gravity, the pyramid’s mass,
    and its center of mass (a quarter of its height). Though the specific densities
    of the Tura limestone and mortar used to build the structure cannot be pinpointed
    I am assuming mean of 2.6 tons per cubic meter and hence a total mass of about
    6.75 million tons.


    People are able to convert about 20 percent of food energy into useful work, and
    for hard-working men that amounts to about 440 kilojoules a day. Lifting the stones
    would thus require about 5.5 million labor days (2.4 trillion divided by 440,000),
    or about 275,000 days a year during the 20-year period, and about 900 people could
    deliver that by working 10 hours a day for 300 days a year. A similar number of
    workers might be needed to replace the stones in the rising structure and smooth
    the cladding blocks (in fact, many interior blocks were just rough-cut). And in
    order to cut 2.3 million cubic meters of stone in 20 years, the project would
    have required about 1,500 quarrymen working 300 days per year and producing 0.25
    cubic meters of stone per capita using copper chisels and dolerite mallets. The
    grand total of the construction labor would then be some 3,300 workers. Even if
    we were able to account for designers, organizers, and overseers, and for the
    labor needed for transport, repair of tools, the building and maintaining of on-site
    housing, cooking and clothes-washing, the total would still be fewer than 7,000
    workers.


    During the time of the pyramid''s construction, the total population of Egypt
    was 1.5–1.6 million people, and hence the deployed force of less than 10,000 would
    not have amounted to any extraordinary imposition on the country''s economy. The
    challenge would have been to organize the labor; to plan an uninterrupted supply
    of building stones, including the granite for internal structures (particularly
    the central chamber and the massive corbelled grand gallery) that had to be delivered
    by boats from southern Egypt some 800 kilometers from Giza; and to provide housing,
    clothing, and food for labor on-site.


