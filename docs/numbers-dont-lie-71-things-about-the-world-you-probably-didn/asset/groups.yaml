    | 0 - 500 - 1,000 km |


    Where African elephants still live


    The latter mass translates into the slaughter of at least 12 million elephants.
    No good systematic estimates of surviving elephants are available before 1970,
    and continent-wide estimates indicate steady declines during the closing decades
    of the 20th century. The Great Elephant Census, a project funded by the late Microsoft
    cofounder Paul G. Allen, relied on aerial surveys of about 80 percent of the savanna’s
    range. When it was completed in 2016, its final count of 352,271 elephants was
    30 percent lower than the best estimate in the mid-1980s.'
  - '[PAGE 235]


    Other news is deeply discouraging: the number of elephants in Mozambique was halved
    between 2009 and 2014, to 10,000, and during the same five years more than 85,000
    Tanzanian elephants were killed, their total dropping from nearly 110,000 to just
    43,000 (the difference is accounted for by an annual 5 percent birth rate). New
    DNA analyses of large ivory seizures made between 1996 and 2014 have traced some
    85 percent of the illegal killing to East Africa, above all in the Selous Game
    Reserve in southeastern Tanzania, the Niassa Reserve in northern Mozambique, and
    more recently also in central Tanzania.


    Most of the blame has rested with China’s continuing demand for ivory, of which
    much gets turned into elaborately kitschy carvings including statuettes of Mao
    Zedong, the man responsible for the greatest famine in human history. Recently
    international pressure finally worked, and China’s State Council banned all ivory
    trade and processing activities as of the end of 2017. This has had some positive
    effects, but Chinese tourists continue to buy ivory objects when they travel to
    neighboring countries.


    And if the slaughter were to stop, some African regions might face a new problem,
    evident for years in parts of South Africa: a surplus of elephants. It is no easy
    matter to manage expanding numbers of large and potentially destructive animals,
    especially those living in proximity to farmers and herders.'
  - '[PAGE 236]


    # Why calls for the Anthropocene era may be premature


    Many historians and scientists argue that we are living in the Anthropocene, a
    new epoch characterized by human control of the biosphere. In May 2019, the Anthropocene
    Working Group formally voted to recognize this new geologic epoch, and its proposal
    will be considered by the International Commission on Stratigraphy that governs
    epoch-naming.


    My reaction, quite clear, is no doubt echoing the Romans: Festina lente. Make
    haste slowly. To be quite no doubt about the pervasiveness of our interference
    in global biogeochemical cycles and the loss of biodiversity attributable to human
    actions: the mass dumping of wastes; the large-scale deforestation and accelerated
    erosion of soils; the global extent of pollution generated by farming, cities,
    industries, and transportation. In combination, these man-made impacts are unprecedented,
    and of a scale that may well imperil the future of our species.


    But is our control of the planet’s fate really so complete? There is plenty of
    counterevidence. Fundamental variables that make life on Earth possible—the thermonuclear
    reactions that power the sun, suffocation the planet with radiation; the planet’s
    shape, rotation, tilt, the eccentricity of its orbital path (the “pacemaker” of
    the ice ages), and the circulation of its atmosphere—are all beyond any human
    interference. Can we ever hope to control the enormous terraforming processes—the
    Earth’s plate tectonics, driven by internal heat and resulting in slow but constant
    creation of new ocean floor; forming, reshaping, and elevating landmasses whose
    distributions and altitudes are key determinants of climate variability and habitability.'
  - '[PAGE 237]


    ![](img/1055ff7c5aac304ec60cbf00b398a085_237_0.png)


    Geologic eras and the Anthropocene


    Similarly, we are mere bystanders watching volcanic eruptions, earthquakes, and
    tsunamis, the three most violent consequences of plate tectonics. We can live
    with their frequent, moderate displays, but the very survival of some of the world''s
    largest cities—notably Tokyo, Los Angeles, and Beijing—depends on the absence
    of mega-earthquakes, and the very existence of modern civilization could be cut
    by mega volcanic eruptions. Even when measuring time not in geological but in
    civilational terms, we also face from-negligible threats from Earth-bursting asteroids
    whose path we might be able to predict but not to alter.


    In any given year, these events have very low probabilities, but because of their
    enormous destructivity their effects are outside the historic human'
