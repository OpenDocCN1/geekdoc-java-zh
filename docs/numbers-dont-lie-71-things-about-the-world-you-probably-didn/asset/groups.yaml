    | Chicken (skinless breast) | Chicken |


    | Units of feed per unit of live weight | Units of feed per unit of edible meat
    |

    |---|---|n| Beef | Beef |

    | Chicken | Chicken |


    Average feed-to-meat conversion efficiencies


    ![](img/1055ff7c5aac304ec60cbf00b398a085_211_0.png)'
  - '[PAGE 212]


    During the 1930s, the average feeding efficiency for broilers (at about 5 units
    of feed per unit of live weight) was no better than for pigs. That feeding rate
    was halved by the mid-1980s, and the latest US Department of Agriculture’s feed-to-meat
    ratios show that it now takes only about 1.7 units of feed (standardized in terms
    of feed corn) to produce a unit of broiler weight (before slaughter), compared
    with nearly 5 units of feed for hogs and almost 12 units for cattle.


    Because edible meat as the share of live weight differs substantially among the
    leading species (it is about 60 percent for chicken, 53 percent for pork, and
    only about 40 percent for beef), recalculations in terms of feeding efficiencies
    per unit of edible meat are even more revealing. Recent ratios have 3–4 units
    of feed per unit of edible meat for broilers, 9–10 for pork, and 20–30 for beef.
    These numbers correspond to average feed-to-meat conversion efficiencies of, respectively,
    15, and 10, and 4 percent.


    In addition, broilers have been bred to mature faster and to put on an unprecedented
    amount of meat. Traditional free-running birds were slaughtered at the age of
    one, when they weighed only about 1 kilogram. The average weight of American broilers
    rose from 1.1 kilograms in 1925 to nearly 2.7 in 2018, while the typical feeding
    span was cut from 112 days in 1925 to 47 days in 2018.


    Consumers benefit the birds suffer. They gain weight so rapidly because they can
    eat as much as they want while kept in darkness and strict confinement. Because
    consumers prefer lean breast meat, the selection for excessively large breast
    shifts the bird’s center of gravity forward, impairs its natural movement, and
    puts stress on its legs and heart. But the bird cannot move away; according to
    the National Chicken Council, a broiler is allotted just 560–650 square centimeters,
    an area only slightly larger than a sheet of standard A4 letter paper. As long
    periods of darkness improve growth, broilers mature under light intensities resembling
    twilight. This condition disrupts their normal circadian and behavioral rhythms.


    On one side, you have shortened lives (less than seven weeks for a bird whose
    normal lifespan is up to eight years) and malformed bodies in dark'
  - '[PAGE 213]


    confinement; on the other, in late 2019 you got retail prices of about $2.94 per
    pound ($6.47/kg) for boneless breast, compared with $4.98/lb for round beef roast
    and $8.22/lb for choice sirloin steak.


    But chicken''s rule hasn''t yet gone global; thanks to its dominance in China
    and in Europe, pork is still about 10 percent ahead worldwide, while beef is the
    leading meat in most countries in South America. Still, broilers mass-produced
    in confinement will, almost certainly, come out on top worldwide within a decade
    or two. Given this reality, consumers should be willing to pay a bit more in order
    for the producers to make the short lives of broilers less stressful.'
  - '[PAGE 214]


    # (Not) drinking wine


    France and wine, what an iconic link—and, for centuries, how immutable! Introduced
    by Greeks long before the Romans conquered Gallia, greatly expanded during the
    Middle Ages, and eventually becoming a symbol of quality (Bordeaux, Bourgogne,
    Champagne) at home and abroad, French viticulture, wine-drinking, and wine exports
    have been long established as one of the key signifies of national identity. The
    country always produced and drank copiously, with farmers and villagers in wine
    regions consuming their own vintages, and towns and cities enjoying a wide selection
    of tastes and prices.


    Regular statistics of annual French per capita consumption of wine begin in 1850
    with a high mean of 121 liters a year—nearly two medium glasses (175 milliliters)
    a day. By 1890, phyloxera infestation (it began in 1863) cut the country’s grape
    harvest by nearly 70 percent compared to the peak in 1875, and French vineyards
    had to be reconstituted by grafting on resistant (mostly American) rootstocks.
    As a result, annual consumption of wine fluctuated, but rising imports (in 1887
    they were as high as half of the domestic output) prevented any steep decline
    in the total supply, and eventual vineyard recovery brought the pre–First World
    War per capita peak to 125 liters a year in 1909. That rate was equaled and surpassed
    during the next two years, setting the 1924 the all-time capita record of 136
    liters a year in 1926, and by 1950 the rate was only slightly lower, at about
    124 liters.'
  - '[PAGE 215]


    # French per capita wine consumption


    ![](img/1055ff7c5aac304ec60cbf00b398a085_215_0.png)


    Postwar French living standards remained surprisingly low: according to the 1954
    census only 25 percent of homes had an indoor toilet, and only 10 percent had
    a bathtub, shower, or central heating. But all of that changed rapidly during
    the 1960s, and the rising affluence also brought some notable dietary shifts—and
    the decline of wine-drinking. By 1980 the per capita annual mean was down to about
    95 liters a year, by 1990 it sank to 71 liters, and by the year 2000 it had fallen
    to just 58 liters, cut by half over the course of the 20th century. The current
    century has seen further declines, and the latest available data show the mean
    at just 40 liters a year, 70 percent cent below the 1926 record. The wine consumption
    survey of 2015 (to be repeated in 2020) details deeper gender and generational
    divides to explain the falling trend.


    Forty years ago, more than half of French adults were drinking wine nearly every
    day, but the share of all adults who drink wine regularly is now just 16 percent.
    More specifically, the share is 23 percent among men and 11 percent among women,
    and only 1 percent among those aged 15–24 years and 5 percent for 25– to 34-year-olds,
    compared to 38 percent for people above 65 years of age. Obviously, this gender
    and generational divide does not hold any promise of rising consumption in the
    future, and it'
  - '[PAGE 216]


    applies to all alcoholic drinks: beer, liquors and cider have also seen gradual
    consumption declines, while the beverages with highest average per capita gains
    include mineral and spring waters (roughly doubling since 1990), fruit juices,
    and carbonated soft drinks.


    As wine-drinking changed from a regular habit to an occasional indulgence, France
    also lost its historical wine-consumption primacy to Slovenia and Croatia (both
    at nearly 45 liters a year per capita). But while no other traditional wine-drinking
    country has greater declines—in both absolute and relative terms—than France,
    Italy have come close, and wine consumption has also decreased in Spain and Greece.


    There has been one positive trend, however, as France’s wine exports remain strong,
    with a new record (at about $11 billion) set in 2018. Premium prices commanded
    by French products are attested to by the fact that they account for 15 percent
    of the global trade in wines and spirits but 30 percent of the total value. Americans
    (whose average per capita consumption of wine has been up by more than 50 percent
    during the past 20 years) have been the largest importers of French wines, and
    the demand by by newly rich Chinese has claimed a growing share of sales.


    But in the country that gave the world countless vins ordinaires as well as exorbitantly
    priced Grands Crus Classés, the sound of clinking stemmed glasses and wishes of
    santé have become an endangered habit.'
  - '[PAGE 217]


    # Rational meat-eating


    Eating meat in general (and beef in particular) has now joined a list of highly
    undesirable habits, as the long-extant concerns about meat''s drawbacks—ranging
    from supposedly deleterious health effects to extraordinarily high land use and
    the large water footprint required to grow animal feed—have been joined by near-apocalyptic
    warnings about methane from cattle as a key driver of global climate change. Realities
    are far less inflammatory as we—like chimpanzees, our closest primate ancestors
    whose males are hunters of smaller animals such as monkeys and young wild pigs—an
    omnivorous species, and meat has always been an important part of our normal diet.
    Meat (together with milk and eggs) is an excellent source of complete dietary
    protein required for growth; it contains important vitamins (above all, those
    of B-complex) and minerals (iron, zinc, magnesium); and it is a satisfying source
    of dietary lipids (fats providing the feeling of satiety, and hence highly prized
    by all traditional societies).


    Inevitably, animals, particularly cattle, are inefficient converters of feed into
    meat (see CHICKEN RULES, p. 243), and affluent countries have expanded their meat
    production to such extent that the principal task of agriculture has not become
    to grow crops for people but feed for animals. In North America and Europe, but
    about 60 percent of the total crop harvest is now destined for feeding—not directly
    for food. This, of course, has major environmental consequences, particularly
    due to the need for nitrogen fertilizers and water. At the same time, citing the
    large volumes of water needed to produce feed for cattle is quite misleading.
    The minimum water requirement per kilogram of boneless beef is, indeed, high,
    on the order of 15,000 liters, but only about half a liter of that ends up incorporated
    in the meat, with more than 99 percent being needed for the growth of feed'
