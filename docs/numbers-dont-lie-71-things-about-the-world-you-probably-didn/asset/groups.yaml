    昂贵、嘈闹且不幸的超音速“协和号”（Concorde）可以在3.5小时内完成，但那只鸟再也不会飞翔了。现在有几家公司正在开发超音速运输机，空中客车已获得了一种巡航速度为音速4.5倍的高音速概念专利。这种飞机从希思罗机场出发仅一小时即可到达JFK国际机场。


