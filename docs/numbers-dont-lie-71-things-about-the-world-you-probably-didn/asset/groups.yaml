    # # What makes people happy?


    To answer that question, it would be very helpful to know which societies actually
    consider themselves significantly happier than others—and, since 2012, this is
    as easy as consulting the latest edition of the World Happiness Report, now published
    annually in New York by the United Nations Sustainable Development Network. In
    2019 (summing up data and surveys from 2016-18), Finland was the world''s happiest
    country for the second time in a row, followed by Denmark, Norway, and Iceland;
