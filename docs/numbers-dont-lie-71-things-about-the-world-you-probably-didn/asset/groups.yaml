  mdcn: '

    (10¹⁸ 焦耳) 的原生能源——这大致等于新西兰或匈牙利的年度总能源消耗量。2020 年销售的 7500 万辆汽车每辆消耗略低于 100 吉焦耳，其蕴含能量约为
    7 艾焦耳（略高于意大利的年能源消耗量），重量约 1 亿吨。新汽车的重量是所有便携电子设备总和的 180 倍，但制造所需的能量仅为后者的 7 倍。


    尽管这已经令人惊讶，但我们还可以进行一个更惊人的比较。便携电子设备的使用寿命不长——平均仅两年，因此全球这些设备的年产量每年使用的能源消耗量约为 0.5 艾焦耳。由于轿车的使用寿命通常至少十年，全球年产量每年使用的能源消耗量约为
    0.7 艾焦耳——这仅比便携电子设备多出 40%！我必须补充的是，这些必然是高度近似的计算——但即使这些粗略的汇总在相反的方向上误差（即如果汽车制造的蕴含能量高于计算值，而电子产品生产的需求更少），全球总和仍然惊人地相似，最可能的差异不超过两倍。展望未来，这两个汇总数据将变得更加接近：汽车和移动设备的年销售量近期都在放缓，但内燃机的前景看起来不那么乐观了。


    当然，这两类高能耗设备的运行能源成本大不相同。一辆美国紧凑型轿车在十年的使用期内会消耗约 500 吉焦耳汽油，是其蕴含能量成本的五倍。智能手机每年仅消耗 4
    千瓦时，在两年的使用期内消耗的电小于 3000 万焦耳——如果电力来自风力涡轮机或光伏电池，则这一比例仅为蕴含能量成本的 3%。如果能源来自燃煤燃烧（一种效率较低的过程），该比例将上升到
    8%。


    但如果没有网络，智能手机将毫无用处，而网络电气化的成本高昂且不断上升。对于未来的增长率（或通过创新设计可能实现的稳定），预测意见不一，但无论如何，那些微小的手机在能源预算和环境中都留下了相当大的累计足迹。


    ## 谁的隔热效果更好？


    第一印象往往会导致错误的结论。我清楚地记得在渥太华的一位欧洲大使家中受到了友好的欢迎，紧下一句话就被告诉我，这栋房子非常适合抵御加拿大的冬天，因为它是由真正的砖块和石头制成的——不像那些带有中空墙的薄弱北美木质建筑。我的房主随后很快转向其他话题，无论如何，我也没有心思去贬低他们华丽房屋的隔热性能。


    这种错误很容易理解，但质量和密度是衡量坚固性的指标，而非隔热能力的指标。砖墙显然比用窄木条架框架并覆盖隔热材料的墙看起来更厚实、更有保护性。


    几十年前，当能源廉价时，许多欧洲房屋几乎没有隔热层。然而，如今能源成本导致了隔热标准的大幅提高。在许多情况下，墙的厚度现在是原来的两倍或三倍，隔热性能通过其
    R 值来衡量。


    ### 隔热方向


    - R 值（热阻）

    - U 值（热渗透系数）

    - 双层隔热 vs. 三层隔热

    - 气密性和隔气层

    - 框架中的热桥


    R 值是衡量热流阻力的度量；R 值越高，隔热效果越好。U 值是 R值的倒数；U 值越低，隔热效果越好。例如，单层窗的 R 值可能为 1，而现代三层窗的 R
    值可以达到 6 或更高。


