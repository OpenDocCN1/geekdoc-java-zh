    ## 为什么在大流行发生期间很难预测其严重程度


    我是在 2020 年 3 月底写下这些，当时 COVID-19 大流行正于整个欧洲和北美呈指数级增长。我并没有决定提供另一个估值或预测（这会让本章节立即过时），而是决定解释在这些压力巨大的情况下，总是使我们的判断和对统计数据的解释变得复杂的不确定性。


    病毒大流行引发的恐惧源于相对较高的死亡率，但在感染扩散期间，无法精确确定这些比率——即使在大流行结束后，这样做也很困难。最常见的流行病学方法是计算病例死亡率：即病例数。分子（注明死亡原因的死亡证明）是显而易见的，且在大多数国家这个数字是非常可靠的。但将与病毒相关的确认死亡人数除以病例数引入了许多不确定性。是哪种“病例”？仅指实验室确认的感染、所有症状病例（包括未接受检测但表现出预期症状的人），还是包括无症状病例在内的感染总数？检测病例准确率很高，但感染总数必须通过大流行后的人口血清学研究（在血液中寻找抗体）、使用各种增长方程对大流行的过去传播进行建模，或假设最可能的倍数（每实际死亡
    y 人，则有 x 人被感染）来估算。


    ## 2009 年流感大流行期间每 10 万病例死亡人数的差异，取决于分母的大小


    | | | | | | | | | |

    |---|---|---|---|---|---|---|---|

    | | | | 基于实验室确认病例 | | | | |

    | | | | | | | | |

    | | | 基于症状病例 | | | | |

    | 基于估算感染（血清学方法） | | | | | | | |

    | 1 | 5 | 10 | 50 | 100 | 500 1,000 | 5,000 10,000 |

    | 每 10 万病例的死亡人数（对数刻度） | | | | | | | |


    对 2009 年流感大流行病例死亡率的详细研究——该流行始于 2009 年 1 月的美国，在某些地方持续到 2010 年 8 月，并由具有独特流感基因组合的新型
    H1N1 病毒引起——说明了所产生的不确定性范围。确认死亡人数始终是分子，但分母有三类不同的病例定义：实验室确认病例、估算的症状病例和估算的感染（基于血清学或对无症状感染范围的假设）。产生的差异非常大，从每
    10 万人少于 1 人到每 10 万人超过 10,000 人不等。


    预计，实验室确认方法得出的风险最高（大多在 100 到 5,000 人之间），而症状方法的风险范围是 5–50 人，而分母中的估算感染所产生的风险为每 10
    万人 1–10 人：第一种方法的死亡率最高高出后一种的 500 倍！


    2020 年，随着 COVID-19（由冠状病毒 SARS-CoV-2 引起）的传播，我们面临同样的不确定性。例如，到 2020 年 3 月 30 日，中国官方统计数据显示武汉（大流行的中心，那里糟糕的情况似乎已经结束）有
    50,006 例病例，2,547 人死亡。这些疑似总数没有独立的确认：4 月 17 日，中国将死亡人数增加了 50%，达到 3,869 人，但病例总数仅增加了
    325 例。在第一种情况下，病例死亡率为 5%；第二种情况下为 7.7%——而且最可能的，我们永远无法得知真实数字。无论如何，分母仅包含检测过的（或检测且有症状的）病例：武汉是一个拥有
    1110 万人口的城市，50,000 例病例意味着不到 0.5% 的居民被感染，与每年流感影响的人数相比，这一比例低得惊。


    在不知道感染总数的情况下，我们可以通过转向死亡率的人口统计方法获得更好的见解，表现为每 1,000 人特定病例的死亡人数，并与年度流感造成的损失进行比较。假设武汉
    2020 年 COVID-19 最糟糕的情况已经结束（且官方总数反映了现实），约 3,900 人死亡意味着大流行特定死亡率为每 1,000 人 0.35。疾病控制与预防中心（CDC）估计，美国
    2019–2020 赛季的流感将影响 3800 万至 5400 万人（在 3.3 亿人口中），并将至少有 23,000 人最多 59,000 人死亡。取这些范围的平均值——4600
    万感染者和 41,000 人死亡——意味着约 14% 的美国人会感染，且约 0.09% 的感染者会死亡（病例率），而 2020 年 4 月中旬武汉每 1,000
    人 0.35，COVID-19 的死亡率将是流感的三倍。


    ## 长高


    与其他许多对人类状况的调查一样，对身高的研究延迟起源于 18 世纪的法国，在 1759 年至 1777 年间，Philibert Gueneau de Montbeillard
    从出生到 18 岁每六个月测量一次他的儿子，而布封伯爵则在其著名的《自然史》中发表了补充。但 Montbeillard 的儿子在当时算很高（成年后达到了现在的水平），而直到
    1830 年代我们才看到系统的身高数据，这归功 Edouard Mallet 和 Adolphe Qulet。


    由于我们研究了身高的各个方面，从随年龄增长及其与体重的关系，到营养和遗传决定因素以及生长高峰的性别差异。因此，我们准确地知道不同年龄的预期身高（和体重）。如果一位美国母亲带着一个身高
    93 厘米的两岁男孩来看，医生会告诉她她的儿子高于同组中 90% 的孩子。


    对于对进步的长期衡量以及揭示国际比较感兴趣的人来说，现代身高身高研究的最佳成果之一是记录详尽的平均身高增长史。尽管矮小（生长不良导致儿童身高偏小）在许多贫穷国家仍然普遍，但其全球发病率已经下降——主要得益于中国的快速改善——从
    1990 年的约 40% 下降到 2020 年的约 22%，长高是 20 世纪的全球趋势。


    更好的健康和更好的营养——尤其是摄入更多优质动物蛋白（牛奶、乳制品、肉类和蛋）驱动了这一转变，而且高大与许多益处相关。这些益处不仅包括通常的寿命延长，还包括心血管疾病风险降低，以及更高的认知能力。


    '
