    # The best indicator of quality of life? Try infant mortality


    When looking for the most revealing measures of human quality of life, economists—ever
    ready to reduce everything to money—prefer to rely on per capita values of gross
    domestic product (GDP) or disposable income. Both measures are obviously questionable.
    GDP goes up in a society where increasing violence requires more policing, higher
    investment in security measures, and more frequent admissions to hospitals; and
    average disposable income tells us nothing the degree of economic inequality or
    about the social net available to disadvantaged families. Even so, these measures
    give a pretty good overall ranking of countries. Not too many people would prefer
    to live in Iraq (2018 nominal GDP of about $6,000) than in Denmark (2018 nominal
    GDP of about $60,000). And average quality of life is undoubtedly higher in Denmark
    than in Romania: both belong to the EU, but the disposable income is 75 percent
    higher in the former.


    Since 1990, the most common alternative has been to use the Human Development
    Index (HDI), a multivariable measure constructed in order to provide a better
    yardstick. It combines life expectancy at birth and educational achievements (mean
    and expected years of schooling) with the gross national income per capita—but
    (not surprisingly) it correlates highly with the average per capita GDP, making
    the latter variable about as good a measure of the quality of life as the more
    elaborate index.


    ![](img/1055ff7c5aac304ec60cbf00b398a085_18_0.png)


    My own choice of a single-variable measure for rapid and revealing comparisons
    of quality of life is infant mortality: the number of deaths during the first
    year of life that take place per 1,000 live births.


    Infant mortality is such a powerful indicator because low rates are impossible
    to achieve without having a combination of several critical conditions that define
    good quality of life—good healthcare in general, and appropriate prenatal, perinatal,
    and neonatal care in particular; proper maternal and infant nutrition; adequate
    and sanitary living conditions; and access to social support for disadvantaged
    families—and that are also predicated on relevant government and private spending,
    and on infrastructures and incomes that can maintain usage and access. A single
    variable thus captures a number of prerequisites for the near-universal survival
    of the most critical period of life: the first year.


    Infant mortalities in preindustrial societies were uniformly and cruelly high:
    even by 1850 the rates in western Europe and in the United States were as high
    as 200–300 (that is, fifth to every third child did not survive the first 365
    days). By 1950, the Western mean was reduced to 35–65 (typically one out of 20
    newborns died within its first year), and now the lowest rates in affluent countries
    are below 5 (with one among hundred not seeing its first birthday). After leaving
    minuscule—from Andorra and Anguilla to Monaco and San Marino—this group with infant
    mortities lower than 5 per 1,000 includes about 35 countries ranging from Japan
    (at 2) to Serbia (at just 5), and its frontrunners show why the measure cannot
    be used for simplistic ranking without reference to wider demographic conditions.


    Countries with the lowest infant mortalities are mostly small (with populations
    less than 10 million and usually less than 5 million), they include the world’s
    most homogeneous societies (Japan and South Korea in Asia; Iceland, Finland, and
    Norway in Europe), and most of them have very low birth rates. Obviously, it is
    more challenging to reach and maintain very low infant mortalities in larger,
    heterogeneous societies with high rates of immigration from affluent countries,
    and in countries with higher birth rates. As a result, it would be difficult to
    replicate the Icelandic rate (3) in Canada (infant mortality at 5), a country
    whose population is more than 100 times larger and that welcomes annually as as
    many newcomers (from scores of countries, and mostly from low-income societies
    in Asia) as there are total people living in Iceland. The same realities affect
    the United States, but the country''s relatively high infant mortality (6) is
    undoubtedly influenced (as is, to a lesser degree, the Canadian rate) by higher
    economic inequality.


    In this sense, infant mortality is a more discerning indicator of quality of life
    than the income average or the Human Development Index, but it still needs qualifications:
    no single measure is a fully satisfactory proxy for gauging a nation’s quality
    of life. What is not in doubt that infant mortalities remain unacceptably high
    in a dozen of sub-Saharan nations. Their rates (above 60 per 1,000) are equal
    to those in western Europe some 100 years ago, a timespan that evokes the developmental
    gap those nations have to close in order to catch up with affluent economies.


    # The best return on investment: Vaccination


    Death due to infectious diseases in infancy and childhood remains perhaps the
    cruelest fate in the modern world, and one of the most preventable. Measures to
    minimize this untimely mortality cannot be ranked as to their importance: clean
    drinking water and adequate nutrition are as vital as disease prevention and proper
    sanitation. But if you judge them by their benefit-cost ratios, vaccination is
    the clear winner.


    Modern vaccination dates back to the 18th century, when Edward Jenner introduced
    it against smallpox. Vaccines against cholera and plague were created before the
    First World War, and others against tuberculosis, tetanus, and diphtheria before
    the Second. The great postwar breakthroughs included routine vaccinations against
    pertussis (whooping cough) and polio. Today, the standard practice everywhere
    is to inoculate children with a pentavalent vaccine that prevents diphtheria,
    tetanus, pertussis, and polio, as well as meningitis, otitis, and pneumonia, three
    infections caused by Haem influenzae type. The first dose comes 6 weeks after
    birth; the other two follow at 10 and 14 weeks. Each pentavalent vaccine costs
    less than $1, and every additional child reduces the chances of infection among
    unvaccinated peers.


    # Number of future deaths averted by vaccination: 2011–2020


    ![](img/1055ff7c5aac304ec60cbf00b398a085_21_0.png)


    Given these realities, it has always been clear that vaccination has an extraordinarily
    high benefit-cost ratio, though one that is not easy to quantify. But thanks to
    a 2016 study supported by the Bill & Melinda Foundation and conducted by US healthcare
    professionals in Baltimore, Boston, and Seattle, we can finally measure the payoff.
    The study’s focus was on the return on investment associated with projected coverage
    levels in nearly 100 low- and middle-income countries during the second decade
    of this century—the decade of vaccines.


    Benefit-cost ranges were based on costs of vaccines and of their supply and delivery
    chains on one hand, and on estimates of the averted costs of morbidity and mortality
    on the other. For every dollar invested in vaccination, $16 is expected to be
    saved in healthcare costs and lost wages and lost productivity caused by illness
    and death.


    And when the analysis went beyond the restricted cost-of-illness approach and
    looked at broader economic benefits, it found the net benefit-cost ratio was more
    than twice as high—reaching 44 times, with an uncertainty range of 27 to 67. The
    highest rewards were for averting measles: a 58-fold return.


    The Gates Foundation released the finding of the 44-fold benefit in the form of
    a letter to Warren Buffett, the foundation’s largest outside donor. Even he must
    be impressed with such a return on investment!


    There is still some way to go. After generations of progress, the basic vaccination
    coverage in high-income countries is now nearly universal, at around 96 percent,
    and great advances have been made in low-income nations, where the coverage has
    risen from only 50 percent in the year 2000 to 80 percent in 2016.


    The hardest part might be to eliminate the threat of infectious diseases entirely.
    Polio is perhaps the best illustration of this challenge: the worldwide infection
    rate dropped from some 400,000 cases in 1985 to fewer than 100 by the year 2000,
    but in 2016 there were still 37 cases in violence-beset regions of northern Nigeria,
    Afghanistan, and Pakistan. And, as illustrated recently by the Ebola, Zika, and
    COVID-19 viruses, new infection risks will arise. Vaccines remain the best way
    to control them.

