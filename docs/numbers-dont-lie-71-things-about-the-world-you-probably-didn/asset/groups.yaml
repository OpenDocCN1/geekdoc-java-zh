    will have passed since Vanguard1''s small cells began to power its beacon transmitter,
    and some 150 years since the photovoltaic effect was first discovered in a solid.
    Energy transitions on a global scale take time.


    # Why sunlight is still best


    You can roughly track the advance of civilization by the state of its lighting—above
    all, its power, cost, and luminous efficacy. That last measure refers to the ability
    of a light source to produce a meaningful response in the eye, and it is the total
    luminous flux (in lumens) divided by the rated power (in watts).


    Under photopic conditions (that is, under bright light, which allows color perception),
    the luminous efficacy of visible light peaks at 683 lm/W at a wavelength of 555
    nanometers. That''s in the green part of the spectrum—the color that seems, at
    any given level of power, to be the brightest.


    For millennia, our sources of artificial light lagged three orders of magnitude
    behind this theoretical peak. Candles had a luminous efficacy of just 0.2 to 0.3
    lm/W; coal gas lights (common in European cities during the 19th century) did
    five or six times as well; and the carbon filaments of Edison''s early bulbs hardly
    did better than that. Efficacies took a leap with metal filaments, first with
    osmium in 1898 to 5.5 lm/W, then after 1901 with tantalum to 7 lm/W, and a decade
    or so later tungsten radiating in a vacuum got up to 10 lm/W. Putting a tungsten
    filament in a mixture of nitrogen and argon raised the efficacy of household lamps
    to 12 lm/W, and coiling the filaments, beginning in 1934, helped to bring incandescent
    efficacies to more than 15 lm/W for 100-watt lamps, which were the standard source
    of bright light during the first two post–Second World War decades.


    # Lumens per watt


    | Type | Value |

    | :--- | :--- |

    | Candles, maximum | 0.3 |

    | Metal filaments | 5.5 |

    | Tantalum | 7 |

    | Tungsten | 10 |

    | Coiled filaments | 15 |

    | Fluorescent lights | 100 |

    | Direct sunlight, maximum | 105 |

    | Global mean | 105 |

    | Large storage | 130 |

    | LED | 172 |

    | Sodium lamps | 200 |

    | Theoretical limit | 300 |


    # Why we need bigger batteries


    It would be a lot easier to expand our use of solar and wind energy if we had
    better ways to store the large quantities we need.


    Even in sunny Los Angeles, a typical house roofed with enough photovoltaic panels
    to meet its needs would still face gaps of up to 80 percent. Even a small national
    grid—one handling 10 to 30 gigawatts—could rely entirely on intermittent sources
    if it had gigawatt-scale storage.


    Since 2007, more than half of humanity has lived in urban areas, and by 2050 more
    than 6.3 billion people will live in cities, accounting for two-thirds of the
    global population, with a rising share in megacities of more than 10 million.
    Most of those people will live in high-rises, so there will be a limited possibility
    of local generation, but they''ll need an unasing supply of electricity to power
    their homes, services, industries, and transportation.


    # Storage and demand


    | Power | Discharge | Release |

    | :--- | :--- | :--- |

    | 2,172 MW | 9 hours | 19,548 MWh |

    | 100 MW | 4 hours | 400 MWh |


    Think about an Asian megacity hit by a typhoon for a day or two. Even long-distance
    lines could supply more than half of the city''s demand, it would still need many
    gigawatt-hours from storage to tide it over until intermittent generation could
    be restored (or use fossil fuel backup—the very thing we''re trying to get away
    from).


    Lithium (Li-ion) batteries are today''s workhorses in both stationary and mobile
    applications. They deploy a lithium compound for their positive electrode and
    graphite for the negative electrode (common-acid car batteries use oxide and lead
    for their electrodes). But despite having much higher energy density than lead-acid
    batteries, Li-ion batteries are still inadequate to meet large-scale long-term
    storage needs. The largest storage system, comprising more than 18,000 Li-ion
    batteries, is being built in Long Beach for Southern California Edison by AES
    Corp.

    '
