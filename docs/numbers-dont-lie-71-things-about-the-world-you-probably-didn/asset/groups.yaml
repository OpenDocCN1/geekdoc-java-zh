    # Why electric cars aren’t as great as we think (yet)


    Let me begin with a disclaimer: I am neither promoting electric vehicles (EVs)
    nor denigrating them. I simply observe that the rational case for accepting them
    has been undermined by unrealistic market forecasts and a disregard for the environmental
    effects involved in producing and operating vehicles.


    Unrealistic forecasts have been, and continue to be, the norm. In 2010, Deutsche
    Bank predicted that EVs would claim 11 percent of the global market by 2020—in
    reality, they will be less than 4 percent. And this triumph of hope over experience
    continues. Recent forecasts for 2030 have EVs adding up to as much as 20 percent
    of the global car fleet, or as little as 2 percent. Bloomberg New Energy Finance
    sees 548 million EVs on roads by 2040; Exxon only 162 million.


