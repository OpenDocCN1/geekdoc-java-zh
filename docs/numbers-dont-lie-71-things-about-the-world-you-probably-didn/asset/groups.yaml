    # # How safe is flying?


    You might have thought that 2014 was a bad year for flying. There were four highly
    publicized accidents: the still-mysterious disappearance of Malaysia Airlines
    Flight 370 in March; the shooting-down of Malaysia Airlines Flight 17 over Ukraine
    in July; the Air Algérie Flight 5017 crash in Mali, with a total of 815 dead;
    and finally, AirAsia Flight QZ8501 falling into the Java Sea in December.


    But according to Ascend, the consulting branch of FlightGlobal that monitors aircraft
    accidents, 2014 in fact had the best accident rate in history: one fatality per
    2.38 million flights. True, Ascend did not count the downing of MH Flight 17—which
    was an act of war, not an accident. Including that incident, as the International
    Civil Aviation Organization does in its statistics, raises the rate to 3.0—still
    much lower than between 2009 and 2011.


    And the subsequent years were safer still: fatalities declined to 158 in 2015,
    291 in 2016, and to just 50 in 2017. There was a reversal in 2018, with 10 fatal
    accidents and 515 deaths (still lower than in 2014), including the Lion Air Boeing
    737 Max falling into the sea off Jakarta in October. And in 2019, despite another
    Boeing 737 Max crash—this time in Ethiopia—the total number of fatalities was
    half of those in 2018.'
