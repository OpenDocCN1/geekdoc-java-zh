    pumps, and indirectly to produce the steel, aluminum, and plastics needed to make
    those mechanical inputs and to synthesize fertilizers and pesticides. The extra
    agricultural effort also ends hurting the environment by causing soil erosion,
    nitrate leaching, the loss of biodiversity, and the growth of antibiotic-resistant
    bacteria; and the production of wasted food may be responsible for as much as
    10 percent of global greenhouse gas emissions. Affluent countries need to produce
    considerably less food and consume it with considerably less waste. And yet the
    mantra of higher food production is chanted as loudly as ever. Its most recent
    permutation is to produce more food waste by eventually flooding the markets with
    fake meat made from altered legume proteins. Instead, why not try to find clever
    ways to reduce food waste to a more acceptable level of loss? Cutting food waste
    in half would lead the way to a more rational use of food worldwide, and the benefits
    could be huge: WRAP estimates that a dollar invested in food waste prevention
    has a 14-fold return in associated benefits. Is this not persuasive enough?

