  - '[PAGE 105]


    But, disappointingly, in 1897 the record-setting test was not followed by rapid
    commercial deployment. Diesel’s conclusion that he had “a thoroughly marketable
    machine” and that “the rest will develop automatically on its own worth” was wrong.
    Not until 1911 did the Danish vessel Selandia the first ongoing freighter by a
    diesel engine, and engines dominated shipping only after the First World War.
    Heavy railroad transport was their first land conquest, followed by heavy road
    transport, off-road vehicles, and construction and agricultural machinery. The
    first diesel car, the Mercedes-Benz 260 D, came in 1936. Today, in the European
    Union, about 40 percent of all passenger cars are diesels but in the US (which
    has cheaper gasoline) diesel accounts for just 3 percent.


    Rudolf Diesel’s initial hope was to see engines used primarily by small, independent
    producers as tools of industrial decentralization, but more than 120 years later,
    the very opposite is true. Diesel are the uncontested enables of massively centralized
    industrial production and the irreplaceable prime movers of globalization. Dies
    power virtually all container ships and all carriers of vehicles and bulk commodities
    such as oil, liquefied natural gas, ores, cement, fertilizers, and grain. They
    also power nearly all trucks and freight trains.


    Most of the readers of this book eat or wear are transported least once, and usually
    many times, by diesel-powered machines, from other continents: clothes from Bangladesh,
    oranges from South Africa, crude oil from the Middle East, bauxite from Jamaica,
    cars from Japan, computers from China. Without the low operating costs, high efficiency,
    high reliability, and great durability of diesel engines, it would have been impossible
    to reach the extent of globalization that now defines the modern economy.


    Over more than a century of use, diesel engines have increased both in capacity
    and efficiency. The largest machines in shipping are now rated at more than 81
    megawatts (109,000 horsepower), and their top net efficiency is just above 50
    percent—better than of gas turbines, which are at about 40 percent (see WHY GAS
    TURBINES ARE THE BEST CHOICE, p. 139).'
