  - '[PAGE 144]


    But it has taken quite a while to get to this point. Edmond Becquerel first described
    the photovoltaic effect in a solution in 1839, and William Adams and Richard Day
    discovered it in selenium in 1876. Commercial opportunities opened up only when
    the silicon cell was invented at Bell Telephone Laboratories in 1954. Even then,
    the cost per watt remained around $300 (more than $2,300 in 2020 money), and except
    for use in a few toys, PVs were just not practical.


    It was Hans Ziegler, an electronics engineer with the US Army, who overcame the
    US Navy''s initial decision to use only batteries on the Vanguard. During the
    1960s, PV cells made it possible to power much larger satellites that revolutionized
    telecommunications, spying from space, weather forecasting, and the monitoring
    of ecosystems. As costs declined, applications multiplied, and PV cells began
    to power lights in lighthouses, offshore oil and gas drilling rigs, and railway
    crossings.


    I bought my first solar calculator—the Texas Instruments TI-35 Galaxy Solar—when
    it was introduced in 1985. Its cells (each one about 170 square millimeters) still
    serve me, more than 30 years later.


    But serious PV electricity generation had to wait for further module price declines.
    By 2000, global PV generation supplied less than 0.01 percent of global electricity;
    a decade later, the share rose by an order of magnitude to 0.16 percent; and by
    2018 it stood at 2.2 percent, still a small fraction compared to the share of
    electricity produced by the world''s hydro stations (nearly 16 percent in 2018).
    In some sunny regions, solar generation is now making a discernible difference,
    but in global terms it still has a way to go before it rivals nature.


    Not even the most optimistic forecast—that of the International Renewable Energy
    Agency—expects PV output to close that gap by 2030. But PV cells might be generating
    10 percent of the world''s electricity by 2030. By that time, several decades
    will have passed since Vanguard1''s small cells began to power its beacon transmitter,
    and some 150 years since the photovoltaic effect was first discovered in a solid.
    Energy transitions on a global scale take time.'
  - '[PAGE 145]


    # Why sunlight is still best


    You can roughly track the advance of civilization by the state of its lighting—above
    all, its power, cost, and luminous efficacy. That last measure refers to the ability
    of a light source to produce a meaningful response in the eye, and it is the total
    luminous flux (in lumens) divided by the rated power (in watts).


    Under photopic conditions (that is, under bright light, which allows color perception),
    the luminous efficacy of visible light peaks at 683 lm/W at a wavelength of 555
    nanometers. That''s in the green part of the spectrum—the color that seems, at
    any given level of power, to be the brightest.


    For millennia, our sources of artificial light lagged three orders of magnitude
    behind this theoretical peak. Candles had a luminous efficacy of just 0.2 to 0.3
    lm/W; coal gas lights (common in European cities during the 19th century) did
    five or six times as well; and the carbon filaments of Edison''s early bulbs hardly
    did better than that. Efficacies took a leap with metal filaments, first with
    osmium in 1898 to 5.5 lm/W, then after 1901 with tantalum to 7 lm/W, and a decade
    or so later tungsten radiating in a vacuum got up to 10 lm/W. Putting a tungsten
    filament in a mixture of nitrogen and argon raised the efficacy of household lamps
    to 12 lm/W, and coiling the filaments, beginning in 1934, helped to bring incandescent
    efficacies to more than 15 lm/W for 100-watt lamps, which were the standard source
    of bright light during the first two post–Second World War decades.'
  - '[PAGE 146]


    # Lumens per watt


    | Candles, maximum | 0.3 |

    | Metal filaments | 5.5 |

    | Tantalum filaments | 7 |

    | Tungsten filaments | 10 |

    | Coiled tungsten | 15 |

    | Fluorescent lights | 100 |

    | Direct sunlight, maximum | 105 |

    | Global mean rate | 105 |

    | Diffuse skylight, maximum | 130 |

    | Philips LED tube | 172 |

    | Low-pressure sodium lamps | 200 |

    | Bright white LED (theoretical limit) | 300 |


    Lights based on different principles—low-pressure sodium lamps and low-pressure
    mercury vapor lamps (fluorescent lights)—were introduced during the 1930s, but
    they only came to widespread use in the 1950s. Today''s best fluorescent lights
    with electronic ballasts can produce about 100 lm/W; high-pressure sodium lamps
    put out up to 150 lm/W; and low-pressure sodium lamps can reach 200 lm/W. However,
    the low-pressure'
  - '[PAGE 147]


    lamps produce only monochromatic yellow light at 589 nanometers, which is why
    they aren''t used in homes but rather street illumination.


    Our best hope now rests on light-emitting diodes (LEDs). The first ones were invented
    in 1962 and provided only red light; a decade later came green and, during the
    1990s, high-intensity blue. By coating such blue LEDs with fluorescent phosphors,
    engineers were able to convert some of the blue light into warmer colors and thus
    produce white light suitable for indoor illumination. The theoretical limit for
    bright white LEDs is about 300 lm/W, but commercially available lamps are still
    a long way from achieving that rate. Philips sells LEDs in the United States—which
    has a 120-volt standard—that offer a luminous efficiency of 89 lm/W, for 18-watt
    soft white, and dimmable bulbs (replacing 100-watt incandescent lights). In Europe,
    where the voltage ranges from 220 to 240 volts, the company sells a 172 lm/W LED
    tube (replacing the 1.5-meter-long European fluorescent tubes).


    High-efficacy LEDs are already delivering significant electricity savings worldwide—it
    also helps that they can provide light for three hours a day for 20 years, and
    if you forget to switch them off you will hardly notice on your next electricity
    bill. But, much like all other sources of artificial light, they still cannot
    match natural light''s spectrum. Incandescent lights gave out too little blue
    light, and fluorescent lights had hardly any red; LEDs have too little intensity
    in the red part of the spectrum and too much in the blue part. They don''t quite
    please the eye.


    Light efficacies of artificial sources have improved by two orders of magnitude
    since 1880—but replicating sunlight indoors still remains beyond our reach.'
  - '[PAGE 148]


    # Why we need bigger batteries


    It would be a lot easier to expand our use of solar and wind energy if we had
    better ways to store the large quantities of electricity we''d need to cover gaps
    in the flow of that energy.


    Even in sunny Los Angeles, a typical house roofed with enough photovoltaic panels
    to meet its needs would still face dailyfalls of up to 80 percent of the demand
    in January and daily surpluses of up to 65 percent in May. You can take such a
    house off the grid only by installing a voluminous and expensive assembly of lithium-ion
    batteries. And even a small national grid—one handling 10 to 30 gigawatts—could
    rely entirely on intermittent sources only if it had gigawatt-scale storage capable
    of working for many hours.


    Since 2007, more than half of humanity has lived in urban areas, and by 2050 more
    than 6.3 billion people will live in cities, accounting for twothirds of the global
    population, with a rising share in megacities of more than 10 million people (see
    THE RISE OF MEGACITIES, p. 44). Most of those people will live in high-rises,
    so there will be only a limited possibility of local generation, but they''ll
    need an unasing supply of electricity to power their homes, services, industries,
    and transportation.'
  - '[PAGE 149]


    # Storage and demand


    | Power | Discharge | Release |

    | --- | --- | --- |

    | 2,172 MW | 9 hours | 19,548 MWh |

    | 100 MW | 4 hours | 400 MWh |

    | Largest Li-ion battery storage Ludington pumped hydro storage plant (Michigan)
    | Largest Li-ion battery storage Ludington pumped hydro storage plant (Michigan)
    | Largest Li-ion battery storage Ludington pumped hydro storage plant (Michigan)
    |


    Think about an Asian megacity hit by a typhoon for a day or two. Even long-distance
    lines could supply more than half of the city''s demand, it would still need many
    gigawatt-hours from storage to tide it over until intermittent generation could
    be restored (or use fossil fuel backup—the very thing we''re trying to get away
    from).

    Lithium (Li-ion) batteries are today''s workhorses in both stationary and mobile
    applications. They deploy a lithium compound for their positive electrode and
    graphite for the negative electrode (common-acid car batteries use oxide and lead
    for their electrodes). But despite having much higher energy density than lead-acid
    batteries, Li-ion batteries are still inadequate to meet large-scale long-term
    storage needs. The largest storage system, comprising more than 18,000 Li-ion
    batteries, is being built in Long Beach for Southern California Edison by AES
    Corp.'
