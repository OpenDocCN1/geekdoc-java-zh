    a watt from every 12 grams of its internal combustion engine. Now, engines in
    bestselling American cars are getting a watt per gram—a 92 percent improvement.
    That is the one bit of happy news I am going to impart in this chapter.


    Now for the bad news: the US data show that during the past 100 years, average
    engine power has increased more than 11-fold, to about 170 kilowatts. This means
    that despite a huge drop of mass/power density, today''s typical car engine is
    become much lighter than it was a century ago—and the average car itself has become
    much heavier: its mass has roughly tripled, reaching more than 1,800 kilograms
    (the average for all light-duty vehicles, nearly half of which are pickups, SUVs,
