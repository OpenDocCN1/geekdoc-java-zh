    Instead, it occurred when the horse''s legs were beneath its body, just prior
    to the moment the horse pushed off with its hind legs.


    This work led to Muybridge''s *magnum opus*, which he prepared for the University
    of Pennsylvania. Starting in 1883, he began an extensive series depicting animal
    and human locomotion. Its creation relied on 24 cameras fixed in parallel to a
    36-meter-long track with two portable sets of 12 batteries at each end. The track
    had a marked background, and animals or people activated shutters by breaking
    stretched strings.


    The final product was a book with 781 plates, published in 1887. This compendium
    showed not only domestic animals (dogs and cats, cows and pigs) but also a bison,
    a deer, an elephant, and a tiger, as well as a running ostrich and a flying parrot.
    Human sequences depicted running, and also ascents, descents, lifts, thrusts,
    wrestling, a child crawling, and a woman pouring a bucket of water over another
    woman.


    Muybridge''s 1,000 frames a second became 10,000. By 1940, the patented design
    of a rotating mirror camera raised the rate to 1 million per second. In 1999,
    Ahmed Zewail won the Nobel Prize in Chemistry for developing a spectograph that
    could capture the transition states of chemical reactions on a scale of femtoseconds—that
    is, $10^{-15}$ seconds, or one-millionth of one-billionth of a second.


    Today, we can use intense, ultrafast laser pulses to capture events separated
    by mere attoseconds, or $10^{-18}$ seconds. This time resolution makes it possible
    to see what has until recently hidden from any direct experimental access: the
    motions of electrons on the atomic scale.


    Many examples can be given to illustrate the extraordinary scientific and engineering
    progress we have made since the decades of the 19th century, and several impressive
    cases—including the luminous efficacy of light (see WHY SUNLIGHT IS STILL BEST,
    p. 158) and the income-performance-adjusted cost of electricity (see THE REAL
    COST OF ELECTRICITY, p. 170)—are detailed in this book, but the contrast between
