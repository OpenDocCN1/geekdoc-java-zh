    replacement fertility levels. In 1950, 40 percent of humanity lived in countries
    with fertilities above 6 and the mean rate was about 5; by the year 2000, just
    5 percent of the global population was in countries with fertilities above 6,
    and the mean (2.6) was close to the replacement level. By 2050, nearly three-quarters
    of humanity will reside in countries with below-replacement fertility.


    This global shift has had enormous demographic, economic, and strategic implications.
    European importance has diminished (in 1900 the continent had about 18 percent
    of the world’s population; in 2020 it has had only 9.5 percent) and Asia has ascended
    (60 percent of the world total in 2020), but regional high fertilities guarantee
    that nearly 75 percent of all births between 2020 and 2070 will be in Africa.


