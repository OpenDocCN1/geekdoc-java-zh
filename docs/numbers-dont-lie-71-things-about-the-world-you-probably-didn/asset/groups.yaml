    billion tons) than the US cumulatively throughout the entire 20th century (about
    4.6 billion tons)!


    But concrete is not an everlasting material, and the Pantheon''s extraordinary
    longevity is a rare exception. Concrete deteriorates in all climates, and the
    process is accelerated by factors ranging from acid deposition to vibration, and
    from structural overloading to salt-induced de-icing and corrosion; and in warm
    and humid environments, algal growth blackens the exposed surfaces. As a result,
    the post-1950 planet-wide concretization has produced tens of billions of tons
    of material that will have to be either replaced or destroyed (or simply abandoned)
    in the coming decades.


    The material''s environmental impact is another worry. Air pollution (fine dust)
    from production can be captured by filter, but the carbon footprint of cement
    is associated with about 1.8 tons of CO2 per ton. Production of cement accounts
    for about 5 percent of global emissions.


    ## What’s worse for the environment—your car or your phone?


    Statistics on the production of energy are fairly reliable; accurate statistics
    on the consumption of energy by major sectors are harder to come by; and data
    on the energy of specific goods are even less reliable. The estimation of the
    embodied energy of finished goods relies not only on indisputable facts—so much
    steel in a car, so many microchips in a computer—but also on the inevitable simplifications
    and assumptions that must be made to derive overall rates. Which model of car?
    Which computer or phone? The challenge is to select reasonable rates; the reward
    is to get a new perspective on the manmade world.


    Let’s focus on mobile devices and cars. Mobile devices, because they are the primary
    enablers of instant communication and boundless information; cars, because people
    still want to move in the real world.


    Obviously, a car weighing 1.4 tons (about as much as a Honda Accord) embodies
    more energy than the 140 grams of a smartphone (say, a Samsung Galaxy). But the
    energy gap is nowhere so great as that 10,000-fold difference in mass.


    ## 2020 annual production: primary energy vs. weight


    | Portable electronics (mobile devices, laptops, tablets) | Automobiles |

    | :--- | :--- |

    | ![](img/1055ff7c5aac304ec60cbf00b398a085_243_0.png) | ![](img/1055ff7c5aac304ec60cbf00b398a085_243_1.png)
    |

    | ![](img/1055ff7c5aac304ec60cbf00b398a085_243_2.png) | ![](img/1055ff7c5aac304ec60cbf00b398a085_243_3.png)
    |


    In 2020, worldwide sales of cellphones should be about 1.75 billion, and those
    of portable computing devices (laptops, notebooks, tablets) should be on the order
    of 250 million. The aggregate weight of these devices comes to about 550,000 tons.
    Assuming, conservatively, an average embodied rate of 0.25 gigajoules per phone,
    4.5 gigajoules per laptop, and 1 gigajoule for a tablet, the annual production
    of these devices requires about 1 exajoule.

    '
  mdcn: '

    经验。我们没有好的办法来处理它们，但我们不能假装从长远来看，它们的相关性并不低于森林物种的灭绝或化石燃料的燃烧。


    此外，为什么要急于将自己提升为新地质时代的创造者，而不是等一等看看人类（Homo sapiens）进行的实验能持续多久呢？从新生世至今已经过的六个纪元——从6600万年前的古新世开始到11,700年前的全新世开始——每个纪元都持续了至少250万年，这包括之前的两个纪元（上新世和更新冰世），而我们现在进入全新世还还不到12,000年。如果实际上确实存在一个“人类世”，它的起源最远可能追溯到8,000年前（从定居农业开始计算起）或150年前（从化石燃料燃烧爆发计算起）。


    如果我们能成功再生存10,000年——这对科幻小说读者来说是一段不足道的时光，但对于现代高能文明来说是一个永恒——我们应该通过为由我们行为塑造的时代命名来庆祝自己。但在此期间，让我们在判定我们在地球上的痕迹不仅仅是地质记录中一个微不足道的微层之前，先等一等。


    ## 具体事实


    古罗马人发明了混凝土，这是一种由骨料（沙子、碎石）、水和胶结剂的混合物。他们将其称为 *opus cementitium*，这种被广泛使用的建筑材料并不含有现代水泥（在旋转窑炉中高温烧制的石灰、粘土和金属氧化物，然后磨成细粉的物质），而是石膏和生石灰的混合物——其最好的品种是用维苏火山火山附近的普特奥利（Puteoli）的火山沙制成的。它的加入产生了一种卓越材料，适用于巨大的拱顶（罗马万神殿，公元118–126年，是世界上最大的无筋混凝土圆顶）以及地中海许多港口的水下建筑，包括古代凯撒亚（位于现今以色列）。


    现代水泥的生产始于1824年，当时约瑟夫·阿斯丁（Joseph Aspdin）申请了他的高温烧制石灰岩和粘土的专利。铝和硅材料转化为非晶态无形固体（玻璃化，与制造玻璃的相同过程）会产生细小的玻璃态结核或团块，然后将其磨成制造水泥。接着将水泥与水（占最终质量的10–15%）和骨料（沙子和碎石，占总质量的60–75%）混合产生混凝土，这是一种可变形的材料，抗压强度高，但抗拉强度弱。


    ![](img/1055ff7c5aac304ec60cbf00b398a085_240_0.png)


    通过钢筋增强可以减少抗拉强度的问题。第一次尝试发生在19世纪60年代初的法国，但这项技术直到19世纪80年代才兴起。20世纪是钢筋混凝土的时代。1903年，辛辛那提的英格尔斯大（Ingalls
    Building）成为世界上座钢筋摩天大楼；在20世纪30年代，结构工程师开始使用预应力混凝土（带有拉力的钢丝或钢筋）；自1950以来，这种材料已用于各种高度和功能的建筑——迪拜的哈利法塔是世界上最高的，而约恩·乌特松（Jorn
    Utzon）设计的如帆般的悉尼歌剧院可能是该材料在视觉上最令人印象的应用。钢筋混凝土使得建造巨大的水水电坝成为可能：世界上最大的坝是中国三峡坝，其混凝土量是美国最大的库利坝（Grand
    Coulee）的三倍。混凝土桥也很常见：北盘大桥现在是世界上长的混凝土拱桥，跨越中国两个省份之间445米的峡谷。但大多数时候，混凝土是以视觉上并不显著的方式部署的，以数十亿个道枕、铺设道路、高速公路、停车场、港口以及机场跑道和滑道的形式存在。


    1900年至1928年间，美国的水泥消耗量增长十倍达到3000万吨，战后经济扩张（包括州际公路系统的建设，每公里需要约10,000吨混凝土）使其在2005年达到约1.28亿吨的峰值，最新的产量每年低于1亿吨。


    中国在1986年成为世界最大的生产国，其水泥产量——2018年超过23亿吨——现在占了全球总量的近60%。中国前所未有的建设努力最令人深刻的说明是，在过去的两年里，该国使用的水泥量（约47亿吨）超过了美国整个20世纪的累计总量（约46亿吨）！


    但混凝土不是一种永恒的材料，万神殿非凡的寿命是一个罕的例外。混凝土在所有气候下都会退化，而且这一过程受到从酸沉到振动、从结构过载到盐诱发的除冰和腐蚀等因素的影响；在温暖潮湿的环境中，藻类生长会使暴露的表面变黑。因此，1950年以后全球范围的混凝土化产生了数百亿吨材料，这些材料在未来几十年内将不得不被替换或破坏（或简单地遗弃）。


    材料对环境的影响是另一个担忧。生产产生的空气污染（细粉尘）可以通过过滤器捕捉，但水泥的碳足迹每吨水泥对应约1.8吨二氧化碳。水泥生产占全球排放的约5%。


    ## 什么对环境危害更大——你的汽车还是手机？


    生产能量的统计数据相当可靠，但主要部门能源消耗的准确统计较难获得，而特定产品的能量数据更不可靠。制品的隐含能量估计不仅依赖于不可争疑的事实（汽车中的钢铁、计算机中的微芯片），还依赖于得出总体率时必须做的简化和假设。哪种型号的汽车？什么样的电脑或手机？让我们关注移动设备和汽车。移动设备是因为即时通信和无限信息的主要媒介；汽车是因为人们仍然需要在现实世界中移动。


    显然，一辆重1.4吨的汽车（如雅田Accord）含有的能量远大于140克的智能手机（如三星Galaxy）。但能量差距远没有质量上的万倍差异那么大。


    ## 2020年年度产量：主要能源对比重量


    | 便携式电子设备（移动设备、笔记本电脑、平板电脑） | 汽车 |

    | :--- | :--- |

    | ![](img/1055ff7c5aac304ec60cbf00b398a085_243_0.png) | ![](img/1055ff7c5aac304ec60cbf00b398a085_243_1.png)
    |

    | ![](img/1055ff7c5aac304ec60cbf00b398a085_243_2.png) | ![](img/1055ff7c5aac304ec60cbf00b398a085_243_3.png)
    |


    2020年，全球手机销量应约为17.亿部，便携式计算设备（笔记本电脑、平板电脑）的销量应在2.5亿台左右。这些设备的总重量约为55万吨。保守估计，每部手机平均0.25吉焦，每台笔记本电脑4.5吉焦，每台平板电脑1吉焦，这些设备的年度生产大约需要1艾瓦。

