  - '[PAGE 17]


    # The best indicator of quality of life? Try infant mortality


    When looking for the most revealing measures of human quality of life, economists—ever
    ready to reduce everything to money—prefer to rely on per capita values of gross
    domestic product (GDP) or disposable income. Both measures are obviously questionable.
    GDP goes up in a society where increasing violence requires more policing, higher
    investment in security measures, and more frequent admissions to hospitals; and
    average disposable income tells us nothing the degree of economic inequality or
    about the social net available to disadvantaged families. Even so, these measures
    give a pretty good overall ranking of countries. Not too many people would prefer
    to live in Iraq (2018 nominal GDP of about $6,000) than in Denmark (2018 nominal
    GDP of about $60,000). And average quality of life is undoubtedly higher in Denmark
    than in Romania: both belong to the EU, but the disposable income is 75 percent
    higher in the former.


    Since 1990, the most common alternative has been to use the Human Development
    Index (HDI), a multivariable measure constructed in order to provide a better
    yardstick. It combines life expectancy at birth and educational achievements (mean
    and expected years of schooling) with the gross national income per capita—but
    (not surprisingly) it correlates highly with the average per capita GDP, making
    the latter variable about as good a measure of the quality of life as the more
    elaborate index.'
  - '[PAGE 18]


    ![](img/1055ff7c5aac304ec60cbf00b398a085_18_0.png)


    My own choice of a single-variable measure for rapid and revealing comparisons
    of quality of life is infant mortality: the number of deaths during the first
    year of life that take place per 1,000 live births.


    Infant mortality is such a powerful indicator because low rates are impossible
    to achieve without having a combination of several critical conditions that define
    good quality of life—good healthcare in general, and appropriate prenatal, perinatal,
    and neonatal care in particular; proper maternal and infant nutrition; adequate
    and sanitary living conditions; and access to social support for disadvantaged
    families—and that are also predicated on relevant government and private spending,
    and on infrastructures and incomes that can maintain usage and access. A single
    variable thus captures a number of prerequisites for the near-universal survival
    of the most critical period of life: the first year.'
  - '[PAGE 19]


    Infant mortalities in preindustrial societies were uniformly and cruelly high:
    even by 1850 the rates in western Europe and in the United States were as high
    as 200–300 (that is, fifth to every third child did not survive the first 365
    days). By 1950, the Western mean was reduced to 35–65 (typically one out of 20
    newborns died within its first year), and now the lowest rates in affluent countries
    are below 5 (with one among hundred not seeing its first birthday). After leaving
    minuscule—from Andorra and Anguilla to Monaco and San Marino—this group with infant
    mortities lower than 5 per 1,000 includes about 35 countries ranging from Japan
    (at 2) to Serbia (at just 5), and its frontrunners show why the measure cannot
    be used for simplistic ranking without reference to wider demographic conditions.


    Countries with the lowest infant mortalities are mostly small (with populations
    less than 10 million and usually less than 5 million), they include the world’s
    most homogeneous societies (Japan and South Korea in Asia; Iceland, Finland, and
    Norway in Europe), and most of them have very low birth rates. Obviously, it is
    more challenging to reach and maintain very low infant mortalities in larger,
    heterogeneous societies with high rates of immigration from affluent countries,
    and in countries with higher birth rates. As a result, it would be difficult to
