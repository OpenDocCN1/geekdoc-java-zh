    highly approximate calculations—but even if these rough aggregates were to err
    in opposite directions (that is, if car-making actually embodies more energy than
    calculated, and electronic production needs less), the global totals would still
    be surprisingly similar, with the most likely difference no greater than twofold.
    Looking ahead, these two aggregates get even closer: annual sales of both cars
    and mobile devices have been recently slowing, but the future looks less promising
    for internal combustion engines.


    Of course, operating energy costs of the two classes of these highly energy-intensive
    devices are vastly different. A compact American passenger car consumes about
    500 gigajoules of gasoline during a decade of its service, five times its embodied
    energy cost. A smartphone consumes just 4 kilowatt-hours of electricity annually
    and less than 30 megajoules during its two years of service—or just 3 percent
    of its embodied energy cost if the electricity comes from a wind turbine or from
    a photovoltaic cell. That fraction rises to 8 percent if the energy comes from
    burning coal, a less efficient process.


    But a smartphone is nothing without a network, and the cost of electrifying the
    net is high and rising. Forecasts disagree about the coming rate of increase (or
    about possible stabilization by using innovative designs), but, in any case, those
    tiny phones leave quite an aggregate footprint in the energy budget—and the environment.'
