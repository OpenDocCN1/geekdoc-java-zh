    visually unremarkable ways, in the form of billions of railroad sleepers, paved
    roads, freeways, parking lots, ports, and airport runways and taxiways.


    Between 1900 and 1928, the US consumption of cement rose tenfold to 30 million
    tons, and the postwar economic expansion (including the construction of the Interstate
    Highway System, which requires about 10,000 tons of concrete per kilometer) raised
    it to the peak of about 128 million tons by 2005, with the latest rates less than
    100 million tons a year.


    China became the world''s largest producer in 1986, and its output of cement—more
    than 2.3 billion tons in 2018—now accounts for nearly 60 percent of the global
    total. The most impressive illustration of China''s unprecedented construction
    effort is that in the last two years the country employed more cement (about 4.7
    billion tons) than the US cumulatively throughout the entire 20th century (about
    4.6 billion tons)!


    But concrete is not an everlasting material, and the Pantheon''s extraordinary
    longevity is a rare exception. Concrete deteriorates in all climates, and the
    process is accelerated by factors ranging from acid deposition to vibration, and
    from structural overloading to salt-induced de-icing and corrosion; and in warm
    and humid environments, algal growth blackens the exposed surfaces. As a result,
    the post-1950 planet-wide concretization has produced tens of billions of tons
    of material that will have to be either replaced or destroyed (or simply abandoned)
    in the coming decades.


    The material''s environmental impact is another worry. Air pollution (fine dust)
    from cement production can be captured by filter bags, but the industry (burning
    inferior fuels as low-quality coal and petroleum coke) remains a significant source
    of carbon dioxide, emitting roughly a ton of the gas per ton of cement. For comparison,
    producing a ton of steel is associated with emissions of about 1.8 tons of CO$_2$.


    Production of cement now accounts for about 5 percent of global CO$_2$ emissions
    from fossil fuels, but its carbon footprint can be lowered by a variety of measures.
    Old concrete can be recycled, and the crushed material can be reused in construction.
    Blast furnace slag or fly ash captured in coal-fire power plants can replace some
    of the cement in mixing concrete. There are also several new low-carbon or no-carbon
    cement-making processes, but these alternatives will be making only small annual
    dents in a global output that is now surpassing 4 billion tons.'
