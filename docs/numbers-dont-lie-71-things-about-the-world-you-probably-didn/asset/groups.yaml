    | Year | China | US |

    |---|---|--|

    | 1950 | 8.5 | 14.2 |

    | 1975 | 8.8 | 19.7 |

    | 2000 | 11.3 | 20.9 |

    | 2020 | 18.5 | 38.4 |

    | 2050 | 47.5 | 40.4 |

    | 2070 | 58.2 | 48.3 |

    | 2100 | 83.9 | 76.5 |


    If you rely instead on the yuan-to-US-dollar exchange rate, the United States
    is well ahead: about 50 percent higher in 2019 ($21.4 trillion versus $14.1 trillion).
    But even with the recent slowdown in Chinese GDP growth—from double digits to
    an official rate of between 6 and 7 percent a year, and, in reality, less than
    that—it still considerably higher than growth in the United States. It is thus
    only a matter of time before China becomes No. 1, in minimal terms.


    The path to No. 1 status began in 1978, when the country embraced economic modernization,
    leaving behind three decades of gross mismanagement. For decades China has been
    the world’s largest producer of grain, coal, and cement, and for years the leading
    exporter of manufactured goods in general and consumer electronics in particular.
    There’s nothing surprising about this: China’s population is the world’s largest
    (1.4 billion in 2016), and its new, modernized economy requires commensately large
    outputs.


    But in relative terms, China is hardly rich: the World Bank’s generously calculated
    PPP put the country’s per capita GDP at $19,504 in 2019, or 73rd'
  - '[PAGE 73]


    in the global ranking, behind Montenegro and Argentina and just ahead of the Dominican
    Republic, Gabon, and Barbados—hardly a stunning placement. Everyone knows of the
    rich Chinese who buy real estate in Vancouver and London and diamond-encrusted
    watches at Galleries Lafayette in Paris, but they constitute a tiny minority.


    The GDP and the number of nouveaux riches are misleading measures of the actual
    quality of life in China. The environment has kept on deteriorating. Air pollution
    in the country''s cities is incredibly bad: according to the World Health Organization,
    the maximum acceptable level of particulates with diameters over 2.5 nanometers
    is 25 micrograms per cubic meter of air, but many Chinese cities have repeatedly
    exceeded 500 µg/m³. Some cities have even seen maximums over 1,000. In 2015, Beijing
    averaged 80 µg/m³, compared with less than 10 for New York City. Such extremely
    high levels of pollution increase the incidence of respiratory and heart diseases,
    and shorten lifespans.


    Water pollution is also endemic. Nearly half of those living in rural areas in
    China lacks modern sanitation. The country has less land per capita than India,
    and unlike the smaller Japan, it could never rely largely on imports. China''s
    oil and gas resources are inferior to the US accounting for more than 60 percent
    of total consumption, while the US is now only a minor importer. And it is better
    not to think about a Fukushima-like disaster in a country where so many new nuclear
    reactors have quickly been built in densely populated coastal provinces, or about
    another pandemic starting in one of the popular markets.


    Finally, the country''s population is aging rapidly—that''s why the Communist
    Party abandoned its one-child-policy in 2015—and, as a result, its demographic
    advantage is already receding. The ratio of economically active to economically
    dependent people peaked in 2010, and as the ratio declines, so will China''s industrial
    dynamism.


    We''ve seen it all before. Compare the Japan of 1990, whose rise appeared to challenge
    the entire Western world, with the Japan of 2020, after 30 years of economic stagnation
    (see CONCERNS ABOUT JAPAN''S FUTURE, p. 69). This is perhaps the best insight
    into the likely contrast between the China of 2020 and that of 2050.'
