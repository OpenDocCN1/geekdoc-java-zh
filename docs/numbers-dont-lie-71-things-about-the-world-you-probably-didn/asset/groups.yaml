    has the continent''s second-highest electricity prices: only in heavily wind-dependent
    Denmark (in 2018, 41 percent of its generation was from wind) is the price higher,
    at €0.31/kWh. A similar contrast can be seen in the US. In California, with its
    increasing share of new renewables, electricity prices have been rising five times
    faster than the national mean, and are now nearly 60 percent higher than the countrywide
    average.


    ## The inevitably slow pace of energy transitions


    In 1800, only the UK and a few localities in Europe and North China burned coal
    to generate heat—98 percent of the world’s primary energy came from biomass fuels,
    mostly from wood and charcoal; in deforested regions energy also came from straw
    and from dried animal dung. By 1900, as coal mining expanded and oil and gas production
    began in North America and Russia, biomass supplied half of the world’s primary
    energy; by 1950 it was still nearly 30 percent, and at the beginning of the 21st
    century it had declined to 12 percent, though in many sub-Saharan countries it
    remains above 80 percent. Clearly, it has taken a while to accomplish the transition
    from new carbon (in plant tissues) to old (fossil) carbon in coal, crude oil,
    and natural gas.


    We are now in the earliest stages of a much more challenging transition: the decarbonization
    of the global energy supply which is needed in order to avoid the worst consequences
    of global warming. Contrary to a common impression, this transition has not been
    proceeding at a pace resembling the adoption of cellphones. In absolute terms,
    the world has been running into—not away from—carbon (see RUNNING INTO CARBON,
    p. 303), and in relative terms our gains remain in single digits.


    ## Global energy transitions


    ![](img/1055ff7c5aac304ec60cbf00b398a085_158_0.png)


    The first United Nations Framework Convention on Climate Change was held in 1992.
    In that year, fossil fuels (using the conversion of fuels and electricity to a
    common denominator favored by BP in its annual statistical report) provided 86.6
    percent of the world’s primary energy. By 2017, they supplied 85.1 percent, a
    reduction of a mere 1.5 percent in 25 years.


    This indicator of the global energy transition pace is perhaps the most convincing
    reminder of the world’s continued fundamental dependence on fossil carbon. Can
    a marginal slip of 1.5 percent in a quarter-century be followed in the 25–30 years
    with the substitution of 80 percent of the world’s primary energy for non-carbon
    alternatives, in order to come to zero fossil carbon by 2057? Business as usual
    will not get us there, and the only plausible scenarios to do so are either a
    collapse of the global economy or the adoption of new energy sources at a pace
    and on a scale far beyond our immediate capabilities.


    Casual readers of the news get misled by the claimed advances of wind and solar
    electricity generation. Indeed, these renewable sources have been advancing steadily
    and impressively: in 1992 they supplied only 0.5 percent of the world’s electricity,
    and by 2017 they contributed 4.5 percent. But this means, during those 25 years,
    more decarbonization of electricity generation was due to expanded hydroelectricity
    generation than to combined solar and wind installations. And because only about
    27 percent of the world’s final energy consumption is electricity, these advances
    translate to a much smaller share of overall carbon reduction.


    But solar and wind electricity generation are now mature industries, and new capacities
    can be added quickly—increasing the pace of decarbonizing the electricity supply.
    In contrast, several sectors remain heavily reliant on fossil fuels. The sectors
    of heat, industry, and transport are among the most difficult to decarbonize because
    they require high-grade heat or high energy density that fossil fuels currently
    provide.


    While solar and wind are growing, the total global demand for energy is also increasing,
    which means the absolute amount of carbon emissions is not falling as quickly
    as the share of renewables suggests. The challenge is not just to build new capacity,
    but to replace the entire existing infrastructure of the global economy.


    ![](img/1055ff7c5aac304ec60cbf00b398a085_160_0.png)


    ## HOW WE GET A


    ### Shrinking the Atlantic


    In 1800, sailing ships had taken three—sometimes four—weeks to cross the Atlantic.
    Steam more than halved the transatlantic travel time, and new records kept coming.
    By 1848, Cunard''s SS Europa crossed in 8 days and 23 hours. By 1888, a crossing
    took barely 6 days; and in 1907, the steam-powered ship reached the destination
    in 4 days and 13 hours.


    In 1838, the Great Western was the first steam-powered ship to make the Atlantic
    crossing. Isambard Kingdom Brunel, one of 19th-century engineers, built the Great
    Western for the Great Western Steam Company. It left Bristol on March 31, 1838,
    and arrived in New York on April 15—after 15 days, 12 hours, and 12 minutes.


    The Sirius, built by the British and American Steam Navigation Company, was the
    first to compete. It left Cobh, Ireland, on April 4, 1838, and arrived in New
    York on April 22—after 18 days, 14 hours, and 22 minutes. Even with its four-day
    head start, the Sirius (averaging 14.87 km/h) barely beat the larger and faster
    ship.


    The Great Western: the paddle-wheel, steam-engine-powered ship still had rigging
    for sails. In contrast, the Great Western was the world''s largest passenger ship,
    with 128 beds in first class. The ship''s boilers also worked at 34 kilascals
    but its engines could deliver about 560 kilowatts (the power of today''s industrial
    diesel generators), and on its first journey it averaged 16.04 kilometers per
    hour (slower than today''s best marathon runners, who average just over 21 km/h).
    With 460 tons of coal onboard, the ship could travel nearly 5,400 kilometers (2,916
    nautical miles)—almost, but not quite, all the way to New York Harbor.


