    based on objective and revealing variables (healthy life expectancy). This mélange
    indicates that there should be a great deal of skepticism regarding any precise
    ranking—and this feeling is mightily reinforced when one looks closely at what
    never reported in the media: the actual country scores (accurate to the third
    decimal digit!). By coincidence, in 2019 I lectured in all of the world''s three
    happiest countries—but, I was not able to notice that the Finns (7.769) are 2.2
    percent happier than the Danes (7.600), who are in 0.6 percent happier than the
    Norwegians. The absurdity of all of this is obvious. Even ninth-place Canada has
    a combined score that is just 6.3 percent lower than Finland''s. Given all the
    inherent uncertainties regarding the constituent variables and their simplistic,
    unweighted addition, it would not be more accurate, more honest (and, of course,
    less worthy of media attention), to at least the scores to the nearest unit—or,
    better yet, do no individual ranking and just say which 10 or 20 countries make
    up the top group?


    And then there is remarkable lack of correlation between happiness and suicide—plotting
    the two variables for all European countries shows a complete absence of a relationship.
    Indeed, some of the happiest countries have relatively high suicide rates, and
    some rather unhappy places have a very low frequency of suicide.


    But what, besides Nordic and rich, makes people happy? Fascinating classes are
    provided by countries whose ranking appears out of place. That Afghanistan, the
    Central African Republic, and South Sudan are the three least happy countries
    of the 156 ranked nations, sadly, quite expected (civil wars have been destroying
    them for far too long). By 23rd-place Mexico (a narco state with an extraordinarily
    high rate of violence and murder) ahead of France? Guatemala ahead of Saudi Arabia?
    Panama ahead of Italy? Colombia ahead of Kuwait? Argentina ahead of Japan? And
    Ecuador ahead of South Korea? Clearly, these pairs form a remarkable pattern:
    their second members are richer (often vastly so), more stable, less violent,
    and offer a considerably easier life than the first countries of every pair, whose
    commonalities are obvious—they may be relatively poor, troubled, and even violent,
    but they are all former Spanish colonies and hence overwhelmingly Catholic. And
    all of them are in the top 50 (Ecuador is in the 50th spot), well ahead of Japan
    (58) and far ahead of China (93), the country that has been seen by naive Westerners
    as a veritable economic paradise full of happy shoppers. But while Louis Vuitton
    may be making a bundle in China, neither the massive malls nor the leadership
    of the all-knowing party make the Chinese happy; even the citizens of dysfunctional
    and much poorer Nigeria (85) feel happier.


    The lessons are clear: if you cannot fit into the top 10 (not being Nordic, Dutch,
    Swiss, Kiwi, or Canadian), convert to Catholicism and start learning castellano.
    ¡Buena suerte con eso!


    ## The rise of megacities


    Modernity means many things—rising affluence and mobility; inexpensive and instant
    communication; an abundance of affordable food; longer life expectancy—but an
    extraterrestrial observer sending periodic reconnaissance probes to Earth would
    be impressed by a shift easily observable from space: the increasing pace of urbanization
    as cities keep encroaching, amoeba-like, on the surrounding countryside, creating
    massive blobs of intense light-like throughout the night.


    In 1800, less than 2 percent of the world''s population lived in cities; by 1900
    the share was still only 5 percent. By 1950 it had reached 30 percent, and 2007
    became the first year when more than half of humanity lived in cities. By 2016,
    the United Nations'' comprehensive survey found 512 cities with a population greater
    than 1 million, with 45 of them larger than 5 million and 31 surpassing 10 million.
    This largest group has a special name: “megacities.”


    This continued concentration of humanity in ever-larger cities has been driven
    by advantages arising from the agglomeration of people, knowledge, and activities,
    often due to collocation of kindred companies: on the global level, think of London
    and New York, the financial capitals, and of Shenzhen in China''s Guangdong province,
    the capital of electronics. Economies of scale bring many savings; interactions
    between producers, suppliers, and consumers are easier to handle; businesses have
    access to large pools of labor and diverse expertise; and (despite their environmental
    problems) the quality of life in large cities attracts talent, now often from
    all over the world. Cities are places of countless synergies and investment opportunities,
    and they offer superior educations and rewarding careers. This is why many smaller
    cities—like the surrounding countryside—are losing population, but megacities
    keep growing.


    Ranking them by size is not straightforward, because assorted administrative boundaries
    yield different numbers than when the megacities are considered as functional
    units. Tokyo, the world’s largest megacity, has eight jurisdictional or statistical
    definitions, with the 23 wards of the old city, with fewer than 10 million people,
    to the National Capital area with nearly 45 million. The used by the city administration
    is the Tokyo Metropolitan Region (Tōkyō daitoshiken), which is defined by commuting
    access within 70 kilometers of the city’s massive twin-tower Metropolitan Government
    Building (Tōkyō tochchō) in Shinjuku: the region now has some 39 million people.


    The growth of megacities offers a perfect illustration of receding Western influence
    and the rise of Asia. In 1900, 9 of the world’s 10 largest cities were in Europe
    and the United States. In 1950 New York and Tokyo were the only megacities, and
    the third, Mexico City, was added in 1975. But by the century’s end list had grown
    to 18 megacities, and by 2020 it reached 35 with a total of more than half a billion
    inhabitants. Tokyo (with more people than Canada, and generating economic product
    equal to about half of the German total) remains at the top, and 20 out of the
    35 megacities (nearly 60 percent) are in Asia. There are six in Latin America,
    two in Europe (Moscow and Paris), three in Africa (Cairo, Lagos, Kinshasa), and
    two in North America (New York and Los Angeles).

