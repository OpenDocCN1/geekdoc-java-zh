    When it is completed in 2021, it will be capable of running at 100 megawatts for
    four hours. But that energy total of 400 megawatt-hours is still two orders of
    magnitude lower than what a large Asian city would need if deprived of its intermittent
    supply.


    So we have to scale storage, but how? Sodium-sulfur batteries have higher energy
    density than Li-ion,, but liquid metal is a most inconvenient electrolyte. Flow
    batteries, which store energy directly in the electrolyte, are still in an early
    stage of deployment. Supercapacitors can’t provide electricity over a long enough
    time. And compressed air and flywheels, the perennial favorites of popular journalism,
    have made it into only a dozen or so or small midday installations. Perhaps the
    best long-term hope is to utilize cheap solar electricity to decompose water by
    electrolysis and use the produced hydrogen as a multipurpose fuel, but such a
    hydrogen-based economy is not imminent.


    And when, going big, we must still rely on a technology introduced in the 1890s:
    pumped storage. You build one reservoir high, link it with pipes to another one
    down, and use cheaper, nighttime electricity to pump water uphill so that it can
    turn turbines during times of peak demand. Pumped storage accounts for more than
    99 percent of the world’s storage capacity, but inevitably it entails energy loss
    on the order of 25 percent. Many installations have short-term capacities in excess
    of 1 gigawatt—the largest one is about 3 gigawatts—and more than one would be
    needed for a megacity completely dependent on solar and wind generation.


    But most megacities are nowhere near the steep escarpments or deepcut mountain
    valleys you’d need for pumped storage. Many—including Shanghai, Kolkata, and Karachi—are
    on coastal plains. They could rely on pumped storage only if it were produced
    through long-distance transmission.


    The need for more compact, more flexible, larger-scale, less costly electricity
    storage is self-evident. But the miracle has been slow in coming.'
