  - '[PAGE 219]


    At the same time, the Japanese diet (in fact, the East Asian diet in general)
    shows there is no additional health or longevity benefit from the high consumption
    of meat, and that is why I strongly advocate rational consumption based on moderate
    intakes of meat produced with greatly reduced environmental impact. The key components
    of this global adoption would be to adjust the shares of the three dominant meats.
    For pork, chicken and beef respectively were 40, 37, and 23 percent of the global
    output of about 350 million tons in 2018; by shifting the split to 40, 50, and
    10 percent, we could (thanks to grain feed saved by reducing inefficient beef
    production) produce easily 30 percent more chicken meat and 20 percent more pork,
    while mere halving beef’s environmental burden—and still supplying at least 10
    percent more meat.


    The new meat total would be close to 350 million tons, and it would prorate to
    about 45 kilograms of carcass weight or 25–30 kilograms of edible meat (no bones)
    for every one of 7.75 billion people inhabiting the planet in early 2020!


    This is similar to what an average person has recently consuming, but also how
    much a significant share of the population in France—that meat-eating nation per
    excellence—now prefers to eat: a recent French study showed that nearly 30 percent
    of French adults have become *petits consommateurs*, with intakes (edible meat)
    averaging just 80 grams per day or about 29 kilograms a year.


    In nutritional terms, the annual intake of 25–30 kilograms of edible meat would
    (assuming a 25 percent protein content) supply close to 20 grams of complete protein
    per day: 20 percent more than the recent mean, yet produced with greatly reduced
    environmental impact and providing all the health and longevity benefits of moderate
    carnivory.


    So why not follow both the longest-living population and a French smart set in
    their habits? As in so many other matters, moderation could go a long way...'
  - '[PAGE 220]


    # The Japanese diet


    Modern Japan: rich on paper, but with cramped housing, long and crowded commutes,
    working hours stretching into the evenings, short holidays, still too many people
    smoking, and enormous pressure to conform in a traditionally hierarchical society.
    There is also the ever-present risk of major earthquakes and (in large parts of
    the country) volcanic eruptions, and the seasonal threat of massive typhoons and
    heat waves (not to mention living next to North Korea ..). And yet, Japanese life
    expectancy at birth is higher than in any other nation. The latest numbers (females/males,
    for 2015–20, in years) are 87.5/81.3 for Japan, 86.1/80.6 for Spain, 85.4/79.4
    for France, 82.9/79.4 for the UK, and 81.3/76.3 for the US. Even more remarkably,
    at age 80 a Japanese woman can now expect to live an additional 12 years, compared
    to 10 years in the US and 9.6 years in the UK.


    Could unique genetics explain this? Most unlikely, as the islands had to be settled
    by the neighboring continent—and a recent study of fine-scale genetic structure
    and the evolution of the Japanese population confirms that the expected components
    of the ancestry profile come all from the Korean and also from Han Chinese and
    Southeast Asian clusters.'
  - '[PAGE 221]


    # # Japan vs. US


    ![](img/1055ff7c5aac304ec60cbf00b398a085_221_0.png)


    Maybe it is down to widespread and intense religious convictions—to mind over
    matter? But spirituality rather than religiosity might better describe the Japanese
    mindset, and there are no indications that such traditional beliefs are held more
    deeply than in other populous nations with old cultural heritage.


    Diet, then, should be the best explanation, but which part of it? Focusing on
    well-known national favorites is hardly helpful. Soy sauce (shoyu) is shared with
    a large part of continental Asia, from Myanmar to the Philippines, as is bean
    curd (tofu) and, to a lesser extent, even natto (another soybean-based, fermented,
    foodstuff). Shades of color may differ, but Japanese green tea—ryokucha or simply
    ocha—, the less processed leaves of *Camellia sinensis*—came from China, which
    still produces and drinks most of it (although less in per capita terms). But
    balance sheets (accounts of supply available at retail level and excluding food
    waste) show important differences in the macronutrient composition of the average'
  - '[PAGE 222]


    Japanese, French, and American diets. Foods of animal origin supply 35 percent
    of all dietary energy in France and 27 percent in the US, but only 20 percent
    in Japan.


    But this tilt toward a significantly more plant-based diet is less important than
    the share of food energy coming from fats (lipids, be they of plant or animal
    origin) and sugar and other sweeteners. In both the US and France, dietary fat
    provides almost twice (1.8 to be exact) more food energy than in Japan, while
    Americans have at their daily disposal 2.5 times more sugar and sweeteners (dominated
    in the US by high-fructose corn syrup) than the Japanese, with the multiple about
    1.5 for France. Always keeping in mind that these are just broad statistical associations,
    not causal links, we might conclude that through elimination of likely nutritional
    factors, we view lower fat and sugar intakes as possibly important co-determinants
    of longevity.


    But these two relatively low intakes are a part of what I see as by far the most
    important explanatory factor, as Japan’s true exceptionalism: the country’s remarkably
    moderate average per capita food supply. While food balance sheets of virtually
    all affluent Western nations show a daily availability of 3,400–4,000 kilocalories
    per capita, the Japanese rate is now below 2,700 kilocalories, roughly 25 percent
    lower. Of course, actual average consumption cannot be at a 3,500-kilocalorie-per-day
    level (only hard-working, big-stature men might need that much), but even after
    an indefensibly high share of food waste, this high supply translates into excessive
    eating (and obesity).


    In contrast, studies of actual food takes show that the Japanese daily mean is
    now below 1,900 kilocalories, commensurate with age distribution and physical
    activity of the aging Japanese population. This means that perhaps the simple
    most important explanation of Japan’s longevity primacy is quite simple: moderate
    overall food consumption, the habit expressed in just four kanji characters, 腹八分目（hara
    hachi bun, “belly eight parts in ten full”)—an ancient Confucian precept, and
    hence yet another import from China. But the Japanese, unlike the banqueting and
    food-wasting Chinese, actually do practice it.'
  - '[PAGE 223]


    # Dairy products—the counter-trends


    Nearly all newborns produce enough lactase, the enzyme needed to digest lactose—the
    sugar (a disaccharide composed of glucose and galactose) in their mothers'' milk.
    Only a tiny share of babies have congenital lactase deficiency (that is, lactose
    intolerance). But after infancy, the ability to digest milk diverges. In societies
    that were originally pastoral or kept domesticated dairy animals, the capacity
    to digest lactose persists; while in those societies that never kept milking animals,
    it weakens and even disappears. Typically, this loss translates only into abdominal
    discomfort after drinking a small amount of milk, but it can cause nausea and
    even vomiting.

    Evolution has produced complex patterns of these traits, with lactose-deficient
    populations surrounded by milk-drinking Mongolians (such as the horse milk-drinking
    Mongolians and yak milk-drinking Tibetans north and west of the non-milk-drinking
    Chinese), or even with the two societies intermingled (cattle pastoralists and
    slash-and-burn farmers or hunters of sub-Saharan Africa).


    Given these realities, it is remarkable that economic modernization has produced
    two counterintuitive outcomes: dairy strengths have seen prolonged declines of
    average per capita milk consumption; while in several traditionally non-milk-drinking
    societies, demand for liquid milk and dairy products has risen from nothing to
    appreciable quantities. At the beginning of the 20th century, annual US consumption
    of fresh milk (including cream) was almost 140 liters per capita (80 per cent
    of as whole milk); it peaked at about 150 liters in 1945, but the subsequent decline
    cut it by more than 55 percent, to about 66 liters by 2018. The concurrent decrease
    of demand for all dairy products has been slower, in large part because of the
    still still rising consumption of mozzarella via American pizza.'
