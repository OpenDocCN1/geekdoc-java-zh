    \ zoomass. By 2050 there will be 9 billion people and, most likely, 2 billion\
    \ cattle, together augmenting their already crushing dominance of Earth.\n\n#\
    \ The deaths of elephants\n\nAfrican elephants are the world's largest terrestrial\
    \ mammals: adult males can weigh more than 6,000 kilograms, females average about\
    \ half as much, and newborns are at about 100 kilograms. They are sociable, intelligent,\
    \ proverbially capacious in memory, and eerily aware of death, as they show in\
    \ their remarkable behavior when they encounter the bones of their ancestors,\
    \ lingering at such sites and touching the remnants. Although their bones have\
    \ remained in Africa, their tusks have often ended up in piano keys or in the\
    \ ivory bric-a-brac you still sometimes see on mantelpieces.\n\nAncient Egyptians\
    \ hunted elephants, and Carthaginians used them in wars with Rome until finally\
    \ they became extinct in North Africa, remaining abundant only south of the Sahara.\
    \ The best available estimate of the continent's maximum capacity (including smaller-size\
    \ forest elephants) was about 27 million animals at the beginning of the 19th\
    \ century; their actual number might have been closer to 20 million. Today, though,\
    \ there well under a million.\n\nReconstructions of the past ivory trade indicate\
    \ a fairly steady flow of around 100 tons per year until about 1860, and then\
    \ a fivefold rise just after 1900. The trade plunged during the First World War,\
    \ then rose briefly before another war-induced plunge, after which it resumed\
    \ its rise, peaking at more than 900 tons a year by the late 1980s. I have integrated\
    \ these fluctuating harvests and come up with aggregate removals of 55,000 tons\
    \ of ivory during the 19th century, and at least 40,000 tons during the 20th century.\n\
    \n![](img/1055ff7c5aac304ec60cbf00b398a085_234_0.png)\n\n| Elephant population\
    \ | Range |\n| :--- | :--- |\n| | 0 - 500 |\n\nWhere elephants still live\n\n\
    The best estimate of the population is based on a survey conducted in 2016 by\
    \ the Elephant Population Survey, which found 419,000 elephants remaining in Africa.\
    \ This is a significant decline from the 600,000 estimated in 1970. The decline\
    \ is most severe in West and Central Africa, where the population has plummeted\
    \ by more than 80 percent. In Southern Africa, the population is more stable,\
    \ though it still faces threats from illegal poaching and habitat loss.\n\nThe\
    \ primary threat to elephants is poaching for the ivory trade. Despite international\
    \ bans, the demand for ivory remains high, particularly in parts of Asia. Poachers\
    \ use sophisticated weapons to kill elephants for profit, leading to devastating\
    \ losses in numbers. Efforts to protect elephants include increased patrolling,\
    \ anti-poaching units, and community-based programs that encourage local conservation.\n\
    \nHabitat loss is also a major factor. As human populations expand, agriculture\
    \ and infrastructure development enc encroach on elephant habitats. This fragmentation\
    \ limits the ability of elephants to find food and water and leads to conflict\
    \ with humans. Conservation efforts must focus on protecting protected areas and\
    \ creating corridors where elephants can move between habitats.\n\nThe future\
    \ of elephants is uncertain. If current trends continue, the 419,000 elephants\
    \ may continue to decline. Saving the species requires a global effort to combat\
    \ poaching, restore habitats, and promote peaceful coexistence between humans\
    \ and elephants.\n\n![](img/1055ff7c5aac304ec60cbf00b398a085_235_0.png)\n\n# Why\
    \ calls for the Anthropocene era may be premature\n\nMany historians and scientists\
    \ argue that we are living in the Anthropocene, a new epoch characterized by human\
    \ control of the biosphere. In 2019, the Anthropocene Working Group formally voted\
    \ to recognize this new epoch, and its proposal will be considered by the International\
    \ Commission on Stratigraphy.\n\nMy reaction, quite clear, is no doubt echoing\
    \ the Romans: Festina lente. Make haste slowly. To be no doubt about the pervasiveness\
    \ of our interference in biogeochemical cycles and the loss of biodiversity attributable\
    \ to human actions: the mass dumping of wastes; the large-scale deforestation\
    \ and accelerated erosion of soils; the global extent of pollution generated by\
    \ farming, cities, and transportation. In combination, these man-made impacts\
    \ are unprecedented, and of a scale that may imperil the future of our.\n\nBut\
    \ is our control of the planet’s fate really so complete? There is plenty of counterevidence.\
    \ Fundamental variables that make life on Earth possible—the thermonuclear reactions\
    \ that power the sun, suffocation the planet with radiation; the planet’s shape,\
    \ rotation, tilt, the eccentricity of its orbital path (the “pacemaker” of the\
    \ ice ages), and the circulation of its atmosphere—are all beyond any human interference.\
    \ Can we ever hope to control the enormous terraforming processes—the Earth’s\
