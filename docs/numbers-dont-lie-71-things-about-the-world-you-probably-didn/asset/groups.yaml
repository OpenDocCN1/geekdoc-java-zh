  - '[PAGE 122]


    Printed materials have thus been reduced to a marginal component of overall global
    information storage. By the year 2000, all books in the Library of Congress held
    more than 10¹¹³ bytes (more than 10 terabytes), but that was less than 1 percent
    of the total collection (10¹¹⁵ bytes, or about 3 petabytes) once all photographs,
    maps, movies, and audio recordings were added.


    And in the 21st century, information is being generated ever faster. In its latest
    survey of data generated per minute in 2018, Domo, a cloud service, listed more
    than 97,000 hours of video streamed by Netflix forecast, nearly 4.5 million videos
    watched on YouTube, over 18 million forecast requests on the Weather Channel,
    and more than 3 quadrillion bytes (3.1 petabytes) of other Internet data generated
    in the United States alone. By 2016, the annual global data-creation rate surpassed
    16 zettabytes (1 ZB is 10²¹ bytes), and by 2025 it is expected to rise by another
    order of magnitude—that is, to be about 160 zettabytes (10²³ bytes). And according
    to Domo, in 2020, 1.7 megabytes of data is generated every second for every one
    of the world’s nearly 8 billion people.


    These quantities lead to some obvious questions. Which part should that be? Challenges
    of data storage are obvious even if less than 1 percent of this flow gets preserved.
    And for whatever we decide to store, not how long the data should be preserved.
    No storage will last forever, but what is the optimal span?


    The highest prefix in the international system of units (in which thousand is
    k = 10³, and million is M = 10⁶ is yotta-(Y = 10²⁴, or a trillion trillions).
    We’ll have many bytes within a decade, and it will be increasingly difficult to
    evaluate it—even if those tasks are increasingly left to machines. And once we
    start creating more than 50 trillion bytes of information per person per year,
    will there be real chance of making effective use of it? After all, there are
    fundamental differences between accumulated data, useful information, and insightful
    knowledge.'
  - '[PAGE 123]


    # Being realistic about innovation


    Modern societies are obsessed with innovation. At the end of 2019, Google searches
    returned 3.21 billion hits for “innovation,” easily beating “terrorism” (481 million),
    “economic growth” (about 1 billion), and “global warming”. We are to believe that
    innovation will open every conceivable door: to life expectancies far beyond 100
    years, to the merging of human and machine consciousness, to essentially free
    solar energy.


    This uncritical genuflection before the altar of innovation is wrong on two counts:
    It ignores those big, fundamental quests that have failed after spending huge
    sums on research. And it has little to say why we often stick to an inferior practice
    even when we know there’s a superior course of action.


    The fast breeder reactor, so called because it produces more nuclear fuel than
    it consumes, is one of the most remarkable examples of a prolonged and costly
    innovation failure. In 1974, General Electric predicted that by 2000 90 percent
    of the United States’ electricity would come from fast breeders. GE was merely
    reflecting a widespread expectation: during the 1970s, the governments of France,
    Japan, the Soviet Union, the United Kingdom, and the United States were all investing
    heavily in the development of breeders. By high costs, technical problems, and
    environmental concerns led to shutdowns of British, French, Japanese, American
    (and also smaller German and Italian) programs, while China, India, Japan, and
    Russia are still operating experimental reactors. After the world as a whole spent
    well above $100 billion in today’s money over some six decades of effort, there
    has been no real payoff.'
  - '[PAGE 124]


