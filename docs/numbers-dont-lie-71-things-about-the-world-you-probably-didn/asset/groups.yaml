    当它于2021年完工时，将以100兆瓦的功率运行四小时。但这400兆瓦时的能量总量仍然比一个大型亚洲城市在失去间歇性供应时的需求低出两个数量级。


    因此，我们必须扩大储能规模，但如何做呢？钠电池的能量密度高于锂离子电池，但液态金属是一种极不方便的电解质。直接在电解质中储存能量的流体电池仍处于部署早期。超级电容器无法提供足够长时间的电力。而压缩空气和飞轮作为大众媒体报道的常青宠，目前仅落位了十个左右的小型午间辅助设施。或许最好的长期希望是利用廉价的太阳能电通过电解分解水，并将产生的氢气作为多用途燃料，但这种基于氢的经济尚未迫在眉睫。


    而且在进行大规模建设时，我们仍必须依赖一种引入于19世纪90年代的技术：抽水蓄能。你在高处建造一个水库，通过管道连接低处的另一个水库，并利用廉价的夜间电力将水抽上山上，以便在用电高峰期驱动涡轮机。抽水蓄能占了全球储能能力的99%以上，但不可避免地会产生25%的能量损失。许多设施的短期容量超过1吉瓦——最大的约为3吉瓦——而对于一个完全依赖太阳能和风能发电的大城市来说，需要多个这样的设施。


    但大多数大城市远没有抽水蓄能所需的陡峭悬崖或深切的山谷。许多城市——包括上海、加尔各答和卡拉奇——位于沿海平原。只有通过通过远距离输电产生电力，它们才能依靠抽水蓄能。


    对更紧凑、更灵活、更大规模、更成本电力储能的需求是显而易见的。但这一奇迹的到来一直缓慢。


    ## 为什么电动集装箱船难以实现


    你穿的或在家里使用的几乎所有东西，都曾放在船上的钢制箱子里，由柴油发动机驱动它们从亚洲出发，并排放颗粒物和二氧化碳。你理会认为，我们可以做得更好。


    毕竟，我们已经拥有一个世纪的电力机和半个多世纪的高速电力火车，最近我们还在扩大全球电动车队。为什么不采用电动集装箱船呢？


    实际上，第一艘船计划于2020年运营：由挪威Marin Teknikk建造的Yara Birkeland，不仅是世界上第一艘电力驱动、零排放集装箱船，还是第一艘自主商用船。


    但不要现在就否定巨型柴油集装箱船及其在全球化经济中的关键作用。这里有一个粗略的计算，解释了原因……


    集装箱有不同的尺寸，但大多数是标准的20英尺等值单元（TEU）——长6.1米（20英尺）、宽2.4米的矩形。20世纪60年代的首批小型集装箱船载有数百个TEU；2019年下水的四艘属于瑞士MSC的船只（*Gülsln,
    Samar, Leni and Mia*）保持了记录，每艘23,756个TEU。当它们以非常慢的速度（为了节省燃料为16节）行驶时，这些船可以在30天内完成从香港到汉堡（经苏伊士运河）超过21,000公里的航程。


    ![](img/1055ff7c5aac304ec60cbf00b398a085_152_0.png)


    现在考虑Yara Birkeland。它将仅携带120个TEU，其服务速度为6节，最长预定运行航程为30海里——位于挪威的Heroya和Larvik之间。因此，如今最先进的柴油集装箱船运输的箱子数量是它的200倍，距离几乎是其400倍，速度是先驱电动船所能承受的三到四倍。


    要制造一艘能够装载18,000个TEU（目前常见的跨洲载货量）的电动船需要什么？在为期31天的行程中，今天大多数高效的柴油船会消耗4,650吨燃料（低硫燃料油约为45
    MJ/kg，而锂离子电池的能量密度约为0.5 MJ/kg）。为了匹配柴油的能量密度，我们需要一种能量密度高100倍的电池，这在目前的化学体系中物理上是不可能的。


    即使我们能制造出这样的电池，其重量也将令人望而却步。为了跨洋运输18,000个TEU，一艘船需要约15,000吨燃料。按照目前0.5 MJ/kg的能量密度，这将需要300,000吨电池——是船重的十倍。


    基础设施问题也是令人生畏的。要在合理的时间内为这种电池充电需要巨大的功率。如果我们想在24小时内为1,000,000兆瓦时充电，我们需要42吉瓦的持续功率供应。这相当于几座大型核电站的输出，仅为了给一艘船充电。


    电力的真实成本


    在许多富国家，电价在过去一个世纪里下降了。经通胀调整后，美国住宅电价从1902年的每千瓦时4.81下降到1950年的30.5美分，然后是2000年的12.2美分；2019年初略高，为12.7美分。这代表了超过97%的下降。在此期间，平均制造业工资几乎增加了六倍，这意味着对于蓝领家庭来说，现在的电力支出负担能力比120年前高出200倍。


    | 国家 | 支付100 kWh所需的劳动分钟 |

    |---|---|

    | 德国 | 60 |

    | 意大利 | 60 |

    | 英国 | 47 |

    | 丹麦 | 46 |

    | 法国 | 33 |

    | 加拿大 | 24 |


    国际视角显示了一些惊人的差异。除了加拿大和挪威，美国的住宅电价比任何富裕国家都便宜，这两个是水电发电占比最高的高收入国家（分别为59%和95%）。在使用现行汇率时，美国住宅电价约为欧盟平均水平的55%，日本平均水平的一半，低于德国费率的40%。印度、墨西哥、土耳其和南非的电价按汇率换算低于美国，但使用购买力平价计算时则高得多：是印度的两倍以上；几乎是土耳其的三倍。


    当阅读关于光伏电池成本大幅下降的报告（参见光伏的缓慢崛起）以及风力涡轮极具竞争力的定价时，天真的观察者可能会得出结论：新型可再生能源（太阳能和风能）份额的上升将开启一个电价下降的时代。但事实上，事实恰恰相反。

