    Cold-weather countries have had a long time to learn about insulation. Not so
    in the warmer places, which need it now that air conditioning is becoming widespread.
    Most notably, in rural China and rural India single panes are still the norm.
    Of course, the temperature differential for-weather cooling is not as large as
    in higher latitudes for heating. For instance, at my home in Manitoba, Canada,
    the average overnight lows in January are –25°C, enough to make a difference of
    40°C even when the thermostat is turned down for the night. On the other hand,
    air conditioning in many hot and humid regions runs for much longer periods than
    heating in Canada or Sweden.


    Physics is indisputable, but economics rules. Although triple-glazed windows may
    cost just 15 percent more than double panes, their payback times are obviously
    longer, and it is commonly claimed that the step from double to triple design
    is not justified. That may be so if you ignore improved comfort and reduced window
    condensation—and, above all, the fact that triple panes will keep reducing energy
    use for decades to come.


    Why, then, do visionaries want to pour money into arcane conversion technologies
    that may not even work and which, even if they did, would likely have side effects
    on the environment? What’s wrong with simple insulation?'
