    # 食物


    ## 为我们提供能量


    ## 没有合成氨的世界


    到 19 世纪末，化学和植物生理学的进展清楚地表明，氮是作物栽培中最重要的宏量元素（需要相对较大数量的元素）。植物还需要磷和钾（另外两种宏量元素）以及各种微量元素（从铁到锌的元素，需求量较小）。荷兰小麦的丰收（每公顷
    9 吨）含有约 10% 的蛋白质，即 140 公克的氮，但磷和钾各仅约 35 公斤。


    传统农民通过两种方式提供所需的氮：回收任何可用的有机材料（秸秆、茎、叶、人类和动物废弃物），以及将谷物或油料作物与豆类植物轮作（覆盖作物如苜蓿、三草和草根；以及食用作物如大豆、蚕豆、豌豆和小豆）。这些植物能够自给氮，因为附着在根部的细菌可以“固定”氮（将空气中的惰性分子转化为生长植物可利用的氨），并留下一部分氮给下一季的谷物或油料作物。


    第一种方案非常费力，尤其是人类和动物废弃物的收集、发酵以及通过粪肥和夜肥施入农田；与秸秆或茎秆中低于 0.5% 的氮含量相比，后者的氮含量相对较高（通常为
    1–2%）。第二种方案需要作物轮作，并防止主食粮食（无论是米还是小麦）的连续耕作。随着人口扩张（和城市化）对主食粮食的需求增长，显而易见，如果没有新的合成“固定”氮源——即可以被生长作物利用的形式的氮——农民将无法满足未来的粮食需求。


    ![](img/1055ff7c5aac304ec60cbf00b398a085_194_0.png)


    这种探索在 1909 年取得了成功，当时卡尔斯鲁厄大学的化学教授弗里茨·哈伯（Fritz Haber）证明了在金属催化剂存在下，如何在高压高温下合成氨（NH3）。第一次世界大战和
    20 世纪 30 年代的经济危机减缓了哈伯-博世法在全球的采用，但全球增长人口的粮食需求（从 1950 年的 25 亿到 2020 年的 77  亿）确保了它的大规模扩张，从
    1950 年的不足 500 万吨到近年的约 1.5 亿吨。没有这种关键投入，就不可能增加主食粮食的产量（见 MULTIPLY GRAIN yields）并养活全球人口。


    来自空气的合成氮肥（见 MULTIPLY YELDS, p. 22）提供了全球所需氮的大约一半，另一部分来自有机循环（有机肥和作物残留物）以及大气沉降。因为没有合成氮，我们无法保障
    10 亿人口的粮食；在富裕国家，合成氮的需求已经达到饱和，即便如此，也无法养活 60 亿人口。


    在亚洲、印度和非洲，合成氮已经超过了 50% 的比例。利用煤炭作为原料的合成，以及随后的生产、分发和施用，合成氮肥导致了全球约 1.5 亿吨的温室气体排放——由于化肥的使用，大量的氮挥发、淋失和反硝化作用令人担忧。氧化亚氮（N2O）现在是仅次于二氧化碳的第三重要的温室气体。这意味着如果没有合成氮，我们无法养活现在的
    100 亿人口。


    ## 倍增小麦产量


    法国中部、堪萨斯州东部或中国南部的平均小麦产量是多少？除了除了农民、销售机器的人、提供建议的农艺学家以及开发新品的科学家之外，几乎没有人能给出答案。这是因为现代社会的一小部分人已经与栽培完全脱节了。


    但即使是那些自认为受过良好教育且知识渊广的人，他们能指出汽车性能的提升或计算机能力的增强，也无法判断 20 世纪的主食作物是翻了三倍、五倍还是呈数量级的增长。然而，正是这些倍数增长——而不是手机或云存储的增长——使得
    1900 年到 2020 年间的人口几乎增加了五倍。那么，作为世界主食的小麦产量发生了什么呢？


    ![](img/1055ff7c5aac304ec60cbf00b398a085_197_0.png)


    其传统产量既低又波动很大，但由于英国小麦产量的历史相对详尽（持续了近千年），重建其长期趋势是可能的，这种产量通常以播种种子的回报来表示。在歉收后，必须留出高达
    30% 的产量作为来年的种子，这一比例通常不低于 25%。中世纪早期的收获往往低至每公顷 500–600 公斤（即0.5 吨）。到 16 世纪，每公顷 1
    吨的产量变得常见，到 1850 年，平均值为每公顷 1.7 吨——自 1300 年以来大约增长了一倍。一系列措施（包括固氮豆类的作物轮作、土地排水、更密集的施肥和新品）将产量提高到每公顷
    2 吨以上，而当时法国的产量仅为 1.3 吨，美国广阔的大平原地区产量仅为约 1 吨（这在 1950 年仍是全球平均水平！）。在经历了几个世纪缓慢的渐进式进步后，引入矮秆小麦才带来了决定性的改进。传统的


