    # Why manufacturing remains important


    Manufacturing has become both bigger and smaller. Between 2000 and 2017, the worldwide
    value of manufactured products has more than doubled, from $6.1 trillion to $13.2
    trillion. Meanwhile, the relative importance of manufacturing is dropping fast,
    retracing the earlier retreat of agriculture (now 4 percent of the world’s economic
    product). Based on the United Nations’ uniform national statistics, the manufacturing
    sector’s contribution to global economic product declined from 25 percent in 1970
    to less than 16 percent by 2017.


    The decline has registered in the stock market, which values many service companies
    above the largest manufacturing firms. At the end of 2019, Facebook—that purveyor
    of constant selfies—had a market capitalization of almost $575 billion, nearly
    three times more than Toyota, the world’s largest maker of passenger cars. And
    SAP, Europe’s largest software provider, was worth about 60 percent more than
    Airbus, Europe’s largest maker of jetliners.


    And yet manufacturing is still important for the health of a country’s economy,
    because no other sector can generate nearly as many well-paying jobs. Take Facebook,
    which at the end of 2019 had about 43,000 employees versus the 370,000 or so that
    Toyota had during the 2019 fiscal year. Making things still matters.'
  - '[PAGE 80]


    <!-- no content -->'
  - '[PAGE 81]


    # Manufacturing creates jobs: only 2 out of the top 10 manufacturing countries
    have recent unemployment above 5%


    ![](img/1055ff7c5aac304ec60cbf00b398a085_81_0.png)


    ![](img/1055ff7c5aac304ec60cbf00b398a085_81_1.png)'
  - '[PAGE 82]


    The top four economies remain the top four manufacturing powers, and accounted
    for about 60 percent of the world’s manufacturing output in 2018. China was at
    the top of the list with about 30 percent, followed by the United States (about
    17 percent), Japan, and Germany. But these countries differ markedly in the relative
    importance of manufacturing to each of their economies. The sector contributed
    more than 29 percent of China''s GDP in 2018—in the same year, manufacturing''s
    share came to about 21 percent in Japan and Germany, and only 12 percent in the
    United States.


    If you rank countries by capita manufacturing value, then Germany, with about
    $10,200 in 2018, came out on top among the big four, followed by Japan with about
    $7,900, the United States with $6,800, and China with only $2,900. But the global
    leader is Ireland, the country that until it joined the EU (then known as the
    EEC) in 1973 had only a small manufacturing sector. Its low corporate tax (12.5
    percent) has attracted scores of multinationals, who now produce 90 percent of
    the country''s manufactured exports, and the country''s manufacturing value per
    capita has surpassed $25,000 a year, ahead of Switzerland''s $15,000. When you
    think Swiss manufacturing, you think about such famous domestic firms like Novartis
    and Roche (pharmaceuticals) or the Swatch Group (watches, including Longines,
    Omega, Tissot, and other brands). When you think of Irish manufacturing, you think
    about Apple, Johnson & Johnson, or Pfizer—foreigners all.


    Countries where manufactured goods account for more than 90 percent of total merchandise
    trade include not only China and Ireland, but also Bangladesh, the Czech Republic,
    Ireland, and South Korea. Germany is close to 90 percent; the US share is below
    70 percent.


    The net balance of international trade involves two things: the extent to which
    a nation can satisfy its own needs for products; and the demand for its products
    abroad. As expected, Switzerland, Germany, and South Korea have large surpluses,
    while the United States had another record goods deficit in 2018 at $891 billion,
    or some $2,700 per capita—the price to pay for importing electronics, clothes,
    shoes, furniture, and kitchen gadgets from Asia.'
