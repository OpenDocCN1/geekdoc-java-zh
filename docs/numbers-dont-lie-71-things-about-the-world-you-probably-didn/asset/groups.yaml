    # 生活质量的最佳指标？尝试看看婴儿死亡率


    在寻找最能反映人类生活质量的衡量时，经济学家们——他们总是准备好将一切简化为金钱——倾向于依赖人均国内生产总值（GDP）或可支配收入。这两个指标显然都是值得怀疑的。在一个暴力活动增加导致更多警力投入、更高安全措施投入以及更频繁住院率的社会中，GDP反而会上升；而平均可支配收入无法告诉我们经济不平等的程度，也无法反映弱势家庭享有的社会安全网。尽管如此，这些指标仍然对比国家提供了相当不错的总体排名。没有多少人宁愿生活在伊拉克（2018年名义GDP约6,000美元），而不是丹麦（2018年名义GDP约60,000美元）。而且，丹麦的平均生活质量无疑高于罗马尼亚：两者都属于欧盟，但后者的可支配收入高出75%。


    自1990年以来，最常见的替代方案是使用人类发展指数（HDI），这是一种为了提供更好衡量标准而构建的多变量指标。它将出生预期寿命和教育成就（平均受教育年限和预期教育年限）与人均国民总相结合——但（并不意外的是）它与人均GDP高度相关，使得后者在衡量生活质量方面的表现与更复杂的指数大相上下。


    ![](img/1055ff7caac304ec60cbf00398a085_18_0.png)


    我个人选择用于快速比较和揭示生活质量的单一变量是婴儿死亡率：即出生后一年内每1000名活产的死亡人数。


    婴儿死亡率是一个如此有力的指标，因为如果没有以下定义良好生活质量的若干关键条件，就不可能实现低死亡率：良好的医疗保健，特别是适当的产前、围产和新生儿护理；适当的母亲和婴儿营养；充足的卫生条件；以及为弱势家庭提供的社会支持——而且这些也取决于相关的政府和私人支出，以及能够维持这些服务的基础设施和收入。因此，单一变量捕捉到了生命中最关键时期（第一年）存活的先决条件。


    前工业社会的婴儿死亡率普遍且严酷地高：即使到1850年，西欧和美国的死亡率也高达200–300（即每三分之一的孩子没有活过第一年）。到1950年，西方的平均水平下降到35–65（通常每百人中有一个在第一年内去世），而现在富裕国家的最低率在5以下。除了——从安道拉和安圭拉拉到摩纳哥和圣马力诺——婴儿死亡率每1000人低于5人的群体包含了约35个国家，从日本到塞尔维亚，领先者展示了为什么在不参考更广泛人口的情况下的情况下无法使用该指标进行简单排名。


    婴儿死亡率最低的国家大多规模较小（人口少于100万），其中包括世界上同质性最高的社会（亚洲的韩国；欧洲的冰兰和挪威），且它们大多数具有很低的出生率。显然，在规模更大、移民率较高且异质化的社会中，达到和维持极低婴儿死亡率更具挑战性。结果是，很难复制冰岛的水平——在一个人口是其100倍且每年接收的新移民与数十个国家（大多来自亚洲低收入社会）总人数一样多的加拿大（婴儿死亡率为5），同样的情况也影响了美国，但该国较高的婴儿死亡率无疑受到了更高经济不平等的的影响。


    从这个意义上说，婴儿死亡率是一个比平均收入或人类发展指数更敏锐的生活质量指标，但它仍然需要限定：没有任何单一指标是衡量国家生活质量的完美替代方案。毫无疑问的是，撒哈拉以南十几个国家的婴儿死亡率仍然高得令人接受。它们的水平（每1000人以上60人）相当于100年前的西欧水平，这一时间跨度引发了这些国家追赶的发展差距。


    # 最好的投资回报：接种


    婴儿和儿童时期死于传染病仍可能是现代世界最残酷的命运，也是最可以预防的命运之一。减少这种过早死亡的措施无法按重要性排序：清洁饮用水和充足的营养与疾病预防和适当卫生同样重要。但如果你根据效益比来衡量它们，接种是明显的赢家。


    现代接种可以追溯到18世纪，当时爱德华·詹纳引入了天花疫苗。第一次大战之前发现了霍乱和鼠疫疫苗，第二次世界大战之前发现了抗结核、破伤风和白热病的疫苗。战后的重大突破包括针对百日咳和脊灰热的常规接种。如今，各地的标准做法是为儿童注射五价疫苗，预防白热病、破伤风、百日咳、脊灰热，以及脑膜炎、中炎和肺炎（由流感血杆菌引起的三种感染）。第一剂在出生后6周注射；另外两剂分别在10周和14周进行。每剂五价疫苗成本低于1美元，每增加一个孩子就会减少未接种同伴的感染几率。


    # 接种避免的未来死亡人数：2011–2020


    ![](img/1055ff7caac304ec60cbf00398a085_21_0.png)


    考虑到这些现实，一直很清楚接种具有极高的效益比，尽管这并不容易量化。但得益于比尔和梅琳达·盖茨基金会支持、巴尔摩、波士顿和西雅图美国医疗专业人员进行的2016年研究，我们终于可以衡量回报。该研究的重点是本世纪第二个十年（疫苗十年）近100个中低收入国家预计覆盖率相关的投资回报。


    效益成本比范围一方面基于疫苗及其供应和交付链的成本，另一方面基于对所避免的患病和死亡成本的估算。在接种上每投入1美元，预计可以在医疗保健成本以及因疾病和死亡导致的工资损失和生产力损失上节省16美元。


    当分析超越了局限的疾病成本方法并审视更广泛的经济效益时，发现净效益比高出两倍以上——达到44倍，不确定性范围在27到67之间。回报最高的是预防麻疹：58倍回报。


    盖茨基金会对信给其最大外部捐赠者沃伦·巴菲特的形式发布了这44倍效益的发现。即使是他也会对这样的投资回报大为震惊吧！


    还有一段路要走。在几几人的进步后，高收入国家的基础接种覆盖率现在已几乎普及，达到96%，低收入国家也取得了巨大进展，其覆盖率从2000年的50%上升到2016年的80%。


    最困难的部分可能是完全消除传染病的威胁。脊灰热可能是这一挑战的最好说明：全球感染率从1985年的约40万例下降到2000年的不足100例，但在2016年，尼日利亚北部、阿富汗和巴基斯坦动荡地区仍有7例。而且，正如埃博拉、寨尔卡和新冠病毒所所示的那样，新的感染风险将会出现。疫苗仍然控制它们最好的方法。


