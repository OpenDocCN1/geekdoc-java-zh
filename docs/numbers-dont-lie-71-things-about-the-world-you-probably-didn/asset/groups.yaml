    # 结语


    数字可能不会撒谎，但它们传达的是什么真相呢？在本书书中，我试图说明我们往往必须看得更深、更远。即使是相当可靠——事实上，甚至是*完美无缺*的数字，也需要放在更广泛的背景下来观察。对绝对值的知情判断需要一些相对的、比较视角。


    基于微小差异的硬性排名只会误导而非提供信息。舍入和近似优于毫无根据且不必要的精确。怀疑、谨慎和不断的提问是必不可少的——但坚持对现代世界的复杂现实进行量化同样重要。如果我们想要理解许多变无常的现实，如果我们根据根据可用信息做出决策，那么这种追求是不可替代的。


