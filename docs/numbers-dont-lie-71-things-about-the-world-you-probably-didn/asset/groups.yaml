    # How the 1880s created our modern world


    According to the worshippers of the e-world, the late 20th century and the two
    opening decades of the 21st century brought us an unprecedented number of profound
    inventions. But that is a categorical misunderstanding, as most recent advances
    have been variations on two older fundamental discoveries (see INVENTING INTEGRATED
    CIRCUITS, p. 121) and exploiting radio waves, part of the electromagnetic spectrum.
    More powerful and more specialized microchips are now running everything from
    industrial robots and the autopilots of jetliners to ranges and digital cameras,
    and the most popular global brand for mobile communications has been using ultra
    high-frequency radio waves.


    In fact, perhaps the most inventive time in human history was the 1880s. Have
    any two sets of primary inventions and epochal discoveries shaped the modern world
    more than electricity and internal combustion engines?


    Electricity alone, without microchips, is enough to make a sophisticated and affluent
    world (we had had one in the 1960s). Yet a microchip-governed e-world is utterly
    dependent on an electricity supply whose fundamental design remains beholden to
    thermal- and hydropower-generation systems, both of which reached the commercial
    market in 1882 and still provide more than 80 percent of the world’s electricity.
    And we aspire to make it available at least 99.9999 percent of the time, so that
    it can serve as the cornerstone of everything electronic.'
