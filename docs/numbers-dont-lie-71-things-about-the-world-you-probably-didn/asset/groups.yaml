    # # Is the US really exceptional?


    Belief in “American exceptionalism”—that unique blend of ideals, ideas, and love
    of liberty made so powerful by great technical and economic accomplishments—is
    alive and well. Even former President Obama, the man known for his unemotional
    approach to governing and hence a reluctant endorser to begin with, has come around.
    Early in his presidency (in April 2009), he affirmed his belief by essentially
    denying it: “I believe in American exceptionalism, just as I suspect the Brits
    believe in British exceptionalism and the Greeks believe in Greek exceptionalism.”
    By of 2014, he relented: “I believe in American exceptionalism with every fiber
    of my being.


    But such proclamations mean nothing if they cannot stand up to the facts. And
    here, what really matters is not the size of a country’s gross domestic product
    or the number of warheads or patents it may possess, but the variables that truly
    capture its citizens’ physical and intellectual well-being. These variables are
    simple life, death, and knowledge.


    Infant mortality is an excellent proxy for a wide range of conditions, including
    income, quality of housing, nutrition, education, and investment in healthcare.
    Very few babies die in these affluent countries where people live in good housing
    and where well-educated parents (themselves nourished) feed their children properly
    and have access to medical care (see THE BEST INDICATOR OF QUALITY OF LIFE? INFANT
    MORTALITY, p. 8). So how does the United States rank among the world’s roughly
    200 nations? The latest available comparison shows that 6 of every 1,000 live-born
    babies dying in the first year of life, the US does not figure among the top 25
    nations. Its infant mortality is far higher than in France (4), Germany (3), and
    Japan (2). And the US rate is 50 percent higher than in Greece (4), a country
    portrayed as an utter basket case ever since the

    financial crisis.'
