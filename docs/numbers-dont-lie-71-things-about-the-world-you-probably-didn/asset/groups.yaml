    ## About the Author


    Vaclav Smil is Distinguished Professor Emeritus at the University of Manitoba.
    He is the author of over forty books on topics including energy, environmental
    and population change, food production and nutrition, technical innovation, risk
    assessment and public policy. He is a Fellow of the Royal Society of Canada and
    a Member of the Order of Canada.


    ## Introduction


    *Numbers Don''t Lie* is an eclectic book, with topics ranging from people, populations,
    and countries, through to energy use, technical innovation, and the machines and
    devices that define our modern world. My goal is to provide a clear view of the
    current state of affairs, using data to illuminate the world we live in. We live
    in an age of information, but that information is often deconstructed or ignored.
    Numbers, in themselves, don''t lie, but the way they are presented can be very
    misleading.


    *Numbers Don''t Lie* is an eclectic book, with topics ranging from people, populations,
    and countries, through to energy use, technical innovation, and the machines and
    devices that define our modern world. My goal is to provide a clear view of the
    current state of affairs, using data to illuminate the world we live in. We live
    in an age of information, but that information is often deconstructed or ignored.
    Numbers, in themselves, don''t lie, but the way they are presented can be very
    misleading.


    To understand the world we live in, we must look at the facts. We must look at
    the trends, the scales, and the rates of change that define our era. Because,
    in a world that is increasingly polarized, the facts are the only common ground
    we have left to stand on. This book is an attempt to provide those facts, and
    to make sense of what they mean for us. It is not an easy task, and in many cases,
    the facts themselves may be uncomfortable or even frightening. But they are the
    only way to truly understand the world.


    We begin with people. The global population is growing, but in many places, the
    rate of growth is declining. The demographic map of the world is shifting, and
    the results will be profound. We are becoming an older species, and the challenges
    of aging populations will be immense. We are also seeing the rise of megacities,
    as people move to cities at an unprecedented rate.


    Next, we look at the countries. The world is more interconnected than ever before,
    but it is also more divided. The forces of globalization have brought prosperity
    to some, but they have also led to inequality and conflict. The rise of China
    and India is changing the global power balance, and the old powers are struggling
    to adapt to the new reality.


    Then we look at the machines, designs, and devices that have shaped our modern
    world. The inventions of the 1880s created the world we live in today, but we
    are now in the midst of another great revolution. The digital revolution, the
    biotechnology revolution, and the rise of artificial intelligence are changing
    the way we live, work, and interact. These technologies are not all good, but
    they also present new challenges that we must be prepared to overcome.


    Finally, we look at fuels and electricity. Our world is still powered by fossil
    fuels, but the cost of this is becoming clear. The transition to renewable energy
    is inevitable, but it is moving slower than we need. We must find a way to energize
    our societies without destroying the planet.


    This is the world we live in. It is a world of incredible complexity, but also
    of incredible opportunity and hope. By looking at the numbers, we can begin to
    understand the challenges we face, and we can begin to work toward a better future.

