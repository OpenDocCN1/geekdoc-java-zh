    # 致谢


    多年来，当我不断出版跨学科书籍，我一直认为有机会定期评论某些关注的话题、纠正某些误解并解释现代世界的一些迷人的现实，可能是一个有趣的挑战。我也认为实现这一点的可能性较低，因为为了有所意义，出版商的报价必须符合几项“金发姑娘”标准：


    文章之间的间隔既不能太短（每周一次将是一项负担），也不能断断续续。字数额度不能太长，但要足够容纳几个浅的段落。语调既不能太专业也不能太肤浅，以便进行深入的探讨。主题选择并非无限（我无打算写晦涩的问题或极度专门的主题），但涵盖范围广泛。以及对数字的包容：不要太多，但足以提出有说服力的论点。最后一点对我来说尤为重要，因为几十年来，我注意到对需要清晰定量理解的重要问题的讨论正变得日益定性化，并逐渐脱离了复杂的现实。


    事实如此——2014年，我受邀为 *IEEE Spectrum* 杂志撰写每月专栏，该杂志由总部位于纽约的电气电子工程师学会出版。*Spectrum* 的高级编辑
    Philip Ross 提议了我的名字，主编辑 Susan Hassler 随之同意。*Spectrum* 是全球致力于工程和应用科学的最大专业机构的旗舰杂志（及网站），其成员一直处于转型一个依赖持续、廉价且可靠的电力供应以及采用日益增长的新电子设备和计算机解决方案的现代世界的前沿。


    在2014年10月给 Phil 的一封邮件中，我概述了第一年的计划主题。它们涵盖了从重量过大的汽车到三层玻璃窗，从摩尔定律的诅咒到人类世。几乎整个原始名单最终都编写并打印了，从2015年1月开始，第一篇关于日益沉重的汽车的月专栏。*Spectrum*
    成了我文章的完美家园。凭借超过40,000名读者，IEEE 提供了一个庞大的、高学历且具有批判性的读者群体，我被赋予了选择主题的自由，而 Phil是一个出色的编辑，在追求事实核查方面异常执着。


    感谢 Phil、Susan 以及 *Spectrum* 读者的支持，让我有机会写作任何引起我好奇的话题，并感谢 Daniel 和 Connor 让这些定量化的分钟获得了第二次生命。


