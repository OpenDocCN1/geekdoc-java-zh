  - '[PAGE 125]


    And why do we measure the progress of economies by gross domestic product? GDP
    is simply the total annual value of all goods and services transacted in a country.
    It rises not only when lives get better and economies progress but also when bad
    things happen to people or to the environment. Higher alcohol sales, more driving
    under the influence, more accidents, more emergency-room admissions, more injuries,
    more people in jail—GDP goes up. More illegal logging in the tropics, more deforestation
    and biodiversity loss, higher timber sales—again, GDP goes up. We know better,
    but we still worship high annual GDP growth rate, regardless of where it comes
    from.


    Human minds have many irrational preferences: we love to speculate about wild
    and crazy innovations but cannot be bothered to fix common challenges by relying
    on practical innovation waiting to be implemented. Why do we not improve the boarding
    of planes rather than delude ourselves with visions of hyperloop trains and eternal
    life?'
