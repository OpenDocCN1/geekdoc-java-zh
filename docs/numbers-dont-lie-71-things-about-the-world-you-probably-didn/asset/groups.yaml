    ## Why it’s difficult to predict how bad a pandemic will be while it is happening


    I wrote this at the end of March 2020, just as the COVID-19 pandemic was going
    through its exponential rise throughout Europe and in North America. Rather than
    offering another estimate or prediction (and hence making the chapter instantly
    obsolete), I decided I would explain the uncertainties that always complicate
    our judgment and our interpretation of statistics in these stressful situations.


    Fears engendered by a viral pandemic are due to relatively high mortalities, but
    it is impossible to pinpoint those rates while the infection is spreading—and
    it is difficult to do so even after a pandemic ends. The most common epidemiological
    approach is to calculate the case fatality risk: cases. The numerator (death certificates
    stating the cause of mortality) is obvious and in most countries that count is
    quite reliable. But the choice of confirmed deaths associated with a virus are
    divided by the number of cases introduces many uncertainties. Which “cases”? Only
    laboratory-confirmed infections, all symptomatic cases (including people who were
    not tested but displayed expected symptoms), or the total number of infections
    including asymptomatic cases? Tested cases are known with high accuracy, but the
    total number of infections must be estimated either by relying on post-pandemic
    population serological studies (finding antibodies in blood), by using various
    growth equations to model the past spread of a pandemic, or by assuming the most
    likely multipliers (x people infected for y people who actually died).


    ## Differences in deaths per 100,000 cases during the 2009 influenza pandemic
    depending on the size of the denominator


    | | | | | | | | |

    |---|---|---|---|---|---|---|

    | | | | Based on laboratory-confirmed cases | | | |

    | | | | | | | |

    | | | Based on symptomatic cases | | | |

    | Based on estimated infections (serological method) | | | | | | |

    | 1 | 5 | 10 | 50 | 100 | 500 1,000 | 5,000 10,000 |

    | Deaths per 100,000 cases (logarithmic scale) | | | | | | | |


    Detailed study of case fatalities of the 2009 influenza pandemic—which began in
    the US in January 2009, lingered in some places until August 2010, and was caused
    by a new H1N1 virus with a unique combination of influenza genes—illustrates the
    range of resulting uncertainties. Confirmed deaths were always in the numerator,
    but for the denominator were three different categories of case definition: laboratory-confirmed
    cases, estimated symptomatic cases, and estimated infections (based on serology
    or assumptions regarding the extent of asymptomatic infections). Resulting differences
    were very large, from less than 1 to more than 10,000 deaths per 100,000 people.


    As expected, the laboratory-confirmed approach yielded the highest risk (mostly
    between 100 and 5,000 deaths), while the symptomatic approach had the range of
    5–50 deaths, and the estimated infections in the denominator yielded risks of
    1–10 deaths per 100,000 people: the first approach showed fatalities up to 500
    times higher than the last one did!


    In 2020, with the spread of COVID-19 (caused by a coronavirus, SARS-CoV-2), we
    face the same uncertainties. For example, by March 30, 2020, official Chinese
    statistics listed 50,006 cases in Wuhan, the pandemic’s epicenter where the worst
    seemed to be over, and 2,547 deaths. There was no independent confirmation of
    these suspect totals: on April 17 the Chinese raised the death toll by 50 percent
    to 3,869 but the total number of cases by just 325. In the first instance the
    case fatality is 5 percent; the second instance it is 7.7 percent—and, most likely,
    we will never know the real number. In any case, the denominators include only
    tested (or tested and symptomatic) cases: Wuhan is a city of 11.1 million people
    and 50,000 cases would mean that less than 0.5 percent of its inhabitants were
    infected, an incredibly low share compared to the numbers of people affected by
    annual flu.


    Without knowing the total infections, we might get a better insight by turning
    to the demographic approach to mortality, expressed as death from specific cases
    per 1,000 people, and the toll exerted by annual influenza for comparison. Assuming
    that the worst of Wuhan’s 2020 COVID-19 is over (and that the officials total
    reflect realities), deaths of about 3,900 people would imply pandemic-specific
    mortality of 0.35/1,000. The Centers for Disease Control and Prevention (CDC)
    estimate that in the US 2019–2020 season flu will hit 38–54 million people (out
    of a population of 330 million), and that there will be at least 23,000 and up
    to 59,000 deaths. Taking the means of these ranges—46 million infected people
    and 41,000 deaths—means that about 14 percent of all Americans would get infected,
    and that about 0.09 percent of infected people would die (case fatality rate);
    the overall influenza-specific mortality would be 0.12/1,000 (that is, about 1
    out of every 10,000 would die), compared to 0.35/1,000 for Wuhan by mid-April
    2020. COVID-19 mortality would thus be about three times high as 2019 flu.


    ## Growing taller


    Like many other inquiries into the human condition, studies of human height have
    their belated origins in 18th-century France, where between 1759 and 1777 Philibert
    Gueneau de Montbeillard measured his son every six months—from birth to his 18th
    birthday—and the Comte de Buffon published the 1777 supplement to his famous Histoire
    Naturelle. But Montbeillard''s son was tall for his time (as a young adult he
    matched today''s), and we didn''t see systematic large-scale data on human height
    until the 1830s, courtesy of Edouard Mallet and Adolphe Qulet.


    Since we have studied all aspects of human height, ranging from its expected progress
    with age and its relation to weight, to its nutritional and genetic determinants
    and gender differences in growth spurts. As a result, we know—with high accuracy—expected
    heights (and weights) at different ages. If a young American mother comes to her
    pediatrician with a two-year-old boy measuring 93 centimeters, she will be told
    that her son is taller than 90 percent of children in his cohort.


    For those interested in long-term measures of progress, as well as revealing international
    comparisons, one of the best outcomes of modern systematic studies of growth has
    the well-documented history of rising average heights. Although stunting (inadequate
    growth that produces less height for age in young children) remains common in
    many poor countries, its global prevalence has declined—mostly thanks to rapid
    improvement in China—from about 40 percent in 1990 to about 22 percent in 2020,
    and growing taller was a global trend of the 20th century.


    Better health and better nutrition—above all, greater intakes of high-quality
    animal protein (milk, dairy products, meat, and eggs)—have driven the shift, and
    being taller is associated with a surprisingly large number of benefits. These
    do not include generally higher life expectancy, but a lower risk of cardiovascular
    diseases, and also higher cognitive ability, higher

