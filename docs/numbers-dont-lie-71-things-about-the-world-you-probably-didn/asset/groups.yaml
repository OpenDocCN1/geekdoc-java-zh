  - '[PAGE 232]


    To convert these numbers into living ruminant zoomass requires adjustments for
    age and sex distribution. Large bulls weigh more than 1,000 kilograms; American
    beef cows are slaughtered when they reach nearly 600 kilograms, but Brazilian
    cattle breed go to market at less than 230 kilograms; and India''s famous Gir
    milk breed weighs less than 350 kilograms when mature. A good approximation is
    to assume an average sex- and age-weighted body mass of 400 kilograms; that implies
    a total cattle zoomass of some 600 million tons.


    Similarly, when calculating the total mass of humanity it is necessary to consider
    the age and body weights of populations. Low-income countries have much higher
    shares of children than affluent nations (in 2020, about 40 percent in Africa
    compared to about 15 percent in Europe). At the same time, the rates of overweight
    and obese people range from the negligible (in Africa) to 70 percent of the adult
    population (United States). That is why I am using specific means for different
    continents, derived from available population age and sex structures well as from
    anthropometric studies and growth curves for representative countries. That complex
    adjustment produces a weighted mean of about 50 kilograms per capita—which, given
    a total of 7.75 billion people, implies a global anthropomass of nearly 390 million
    tons in 2020.


    This means that the cattle zoomass is now more than 50 percent larger than the
    anthropomass, and that the live weight of the two species together is very close
    to a billion tons. Even the largest wild mammals add up to only a small fraction
    of those masses: the 350,000 elephants in Africa, with an average body weight
    of 2,800 kilograms, have an aggregate zoomass of less than 1 million tons, which
    is less than 0.2 percent of the cattle zoomass. By 2050 there will be 9 billion
    people and, most likely, 2 billion cattle, together augmenting their already crushing
    dominance of Earth.'
  - '[PAGE 233]


    # # The deaths of elephants


    African elephants are the world''s largest terrestrial mammals: adult males can
    weigh more than 6,000 kilograms, females average about half as much, and newborns
    are at about 100 kilograms. They are sociable, intelligent, proverbially capacious
    in memory, and eerily aware of death, as they show in their remarkable behavior
    when they encounter the bones of their ancestors, lingering at such sites and
    touching the remnants. Although their bones have remained in Africa, their tusks
    have often ended up in piano keys or in the ivory bric-a-brac you still sometimes
    see on mantelpieces.


    Ancient Egyptians hunted elephants, and Carthaginians used them in wars with Rome
    until finally they became extinct in North Africa, remaining abundant only south
    of the Sahara. The best available estimate of the continent''s maximum capacity
    (including smaller-size forest elephants) was about 27 million animals at the
    beginning of the 19th century; their actual number might have been closer to 20
    million. Today, though, there well under a million.


    Reconstructions of the past ivory trade indicate a fairly steady flow of around
    100 tons per year until about 1860, and then a fivefold rise just after 1900.
    The trade plunged during the First World War, then rose briefly before another
    war-induced plunge, after which it resumed its rise, peaking at more than 900
    tons a year by the late 1980s. I have integrated these fluctuating harvests and
    come up with aggregate removals of 55,000 tons of ivory during the 19th century,
    and at least 40,000 tons during the 20th century.'
  - '[PAGE 234]


    ![](img/1055ff7c5aac304ec60cbf00b398a085_234_0.png)


    | Elephant population |

