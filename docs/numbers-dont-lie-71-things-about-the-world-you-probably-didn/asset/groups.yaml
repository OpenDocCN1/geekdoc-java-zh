    # Is life expectancy finally topping out?


    Ray Kurzweil, Google’s chief futurist, says that if you can just hang on until
    2029, medical advances will start to “add one additional year, every year, to
    your life expectancy. By that I don’t mean life expectancy based on your birthdate,
    but rather your remaining life expectancy.\” Curious readers can calculate what
    this trend would do to the growth of the global population, but I will limit myself
    here to a brief review of survival realities.


    In 1850, the combined life expectancies of men and women stood at around 40 years
    in the United States, Canada, Japan, and much of Europe. Since then, the values
    have followed an impressive and almost perfectly linear increase that saw them
    nearly double. Women live longer in all societies, with the current maximum at
    just above 87 years in Japan.'
  - '[PAGE 31]


    ![](img/1055ff7c5aac304ec60cbf00b398a085_31_0.png)


    The trend may well continue for a few decades, given that from 1950 to 2000 the
    life expectancies of elderly people in affluent countries rose at about 34 days
    per year. But without fundamental discoveries that change the way we age, this
    trend to longer life must weaken and finally end. The long-term trajectory of
    Japanese life expectancy—which increased from 81.91 years in 1990 to 87.26 years
    in 2017—fits a logistic curve that is already close to its asymptote of about
    90 years. The trajectories for other affluent countries also show the approaching
    ceiling. Records available for the 20th century show two distinct periods of rising
    longevity: faster linear gains (about 20 years in half a century) prevailed until
    1950, followed by slower gains.


    If we are still far from the limit to the human lifespan, the largest survival
    gains should be recorded among the oldest people, i.e., 80–85 year olds should
    be gaining more than those who are 70–75 years old. This was indeed the case for
    studies conducted in France, Japan, the United States, and the United Kingdom
    from the 1970s to the early 1990s. Since then, however, the gains have leveled
    off.


    There may be no specific genetically programmed limit to lifespan—much as there
    is no genetic program that limits us to a specific running'
  - '[PAGE 32]


    speed (see SWEATING IMPROVED HUNTING, p. 28). But lifespan is a bodily characteristic
    that arises from the interaction of genes with the environment. Genes may themselves
    introduce biophysical limits, and so can environmental effects such as smoking.


    The world record lifespan is the 122 years claimed for Jeanne Calment, a Frenchwoman
    who died in 1997. Strangely, after than two decades, she still remains the oldest
    survivor ever, and by a substantial margin (Indeed, the margin is so big as to
    be suspicious; her age and even her identity are in question.) The second-oldest
    supercentenarian died at 119, in 1999, and since that time there have been no
    survivors beyond the 117th year.


    And if you think that you have a high chance to make it to 100 because some of
    your ancestors lived long, you should know that the estimated heritability of
    lifespan is modest, between 15 and 30 percent. Given that people tend to marry
    others like themselves—a phenomenon known as assortative mating—the true heritability
    of human longevity is probably lower than that.


    Of course, as with all complex matters, there is always room for different interpretations
    of published statistical analyses. Kurzweil hopes that dietary interventions and
    other tricks will extend his own life until scientific advances can preserve him
    forever. It is true that there are ideas on how such preservation might be achieved,
    among them the rejuvenation of human cells by extending their telomeres (the nucleotide
    sequences at the ends of a chromosome that fray with age). If it works, maybe
    it can lift the realistic maximum to well above 125 years.


    But for now, the best advice I can give to all but a few remarkably precocious
    readers is to plan ahead—though perhaps not as far ahead as the 22nd century.'
  - '[PAGE 33]


    # How sweating improved hunting


    The first advantage is in how we breathe. A quadruped can take only a single breath
    per locomotive cycle, because its chest must absorb the impact on the front limbs.
    We, however, can choose other ratios, and that lets us use energy more flexibly.
    The second (and greater) advantage is in our extraordinary ability to regulate
    our body temperature, which allows us to do what lions cannot: run long and hard
    in the noonday sun.'
  - '[PAGE 34]


    ![](img/1055ff7c5aac304ec60cbf00b398a085_34_0.png)


    Microscopic section of human eccrine glands


    It all comes down to sweating. The two large animals we have mainly used for transport
    perspire profusely compared to other quadrupeds: in one hour, a horse can lose
    about 100 grams of water per square meter of skin, and a camel can lose up to
    250 g/m². However, a human being can easily shed 500 g/m², enough to remove between
    550 and 600 watts'' worth of heat. Peak hourly sweating rates can surpass 2 kilograms
    per square meter, and the highest reported short-term sweating rate is twice that
    high.


    We are the superstars of sweating, and we need to be. An amateur running the marathon
    at a slow pace will consume energy at a rate of 700–800 watts, and an experienced
    marathoner who covers the 42.2 kilometers in 2.5 hours will metabolize at a rate
    of about 1,300 watts.


    And we have another advantage when we lose water: we don''t have to make up the
    deficit instantly. Humans can tolerate temporary dehydration providing that we
    rehydrate in a day or so. In fact, the best marathon runners drink only about
    200 milliliters per hour during a race.


    Together, these advantages allowed our ancestors to become unrivaled as a diurnal,
    high-temperature predator. They could not outprint an antelope,'
