    combined solar and wind installations. And because only about 27 percent of the
    world’s final energy consumption is electricity, these advances translate to a
    much smaller share of overall carbon reduction.


    But solar and wind electricity generation are now mature industries, and new capacities
    can be added quickly—increasing the pace of decarbonizing the electricity supply.
    In contrast, several key economic sectors depend heavily on fossil fuels and we
    do not have any non-carbon alternatives that could replace them rapidly and on
    the requisite massive scales. These sectors include long-distance transportation
    (now almost totally reliant on aviation kerosene for jetliners, bulk, bunker fuel,
    and liquified natural gas for carbon, and tanker vessels); the production of more
    than a billion tons of primary iron (requiring coke made from coal for smelting
    iron ores in blast furnaces) and more than 4 billion tons of cement (made in massive
    rotating kilns fired by low-quality fossil fuels); the synthesis of nearly 200
    million tons of ammonia and some 300 million tons of plastics (starting with compounds
    derived from natural gas and crude oil); and space heating (now dominated by natural
    gas).


    These realities, rather than any wishful thinking, must guide our understanding
    of primary transitions. Displacing 10 billion tons of fossil carbon is a fundamentally
    different challenge than ramping up the sales of small portable electronic devices
    to more than a billion units a year; the latter feat was achieved in a matter
    of years, the former one is a task for many decades.'
