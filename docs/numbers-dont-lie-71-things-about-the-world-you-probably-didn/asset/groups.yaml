    # Who has better insulation?


    First impressions often lead to wrong conclusions. I well remember receiving a
    friendly welcome at the residence of a European ambassador in Ottawa, and in the
    very next sentence being told that this house was perfect to withstand Canadian
    winters because it was made of real brick and stone—not like those flimsy North
    American wooden things with hollow walls. My hosts then swiftly moved to other
    matters, and, in any case, I did not have the heart to belittle the insulating
    qualities of their handsome home.


    The error is easy to understand, but mass and density are better indicators of
    sturdiness than of insulating capability. A brick wall obviously looks more substantial
    and protective than a wall framed with narrow wooden studs and covered on the
    outside with thin plywood and aluminum siding and on the inside with vulnerable
    gypsum drywall. European men do not make holes in brick walls.


    Decades ago, when oil sold for $2 a barrel, most pre-1960 North American houses
    usually had nothing to keep out the cold than the air space between the plywood
    and drywall. Sometimes the space was filled with wood shavings or shredded paper.
    Yet, remarkably, even that feeble combination provided a bit more insulation than
    solid brick.'
