    Screwdriver heads: everyday example of diversity in design


    Families contain genus, as Delphinus (common dolphin), Orcinus (orcas), and Tursiops
    (bottleneck dolphins). And, according to GSM Arena, which monitors the mobile
    phone industry, in early 2019 there were more than 110 cellphone genera (brands).
    Some genera contain a single species—for instance, Orcinus contains only Orcinus
    orca, the killer whale. Other genera are species-rich. In the cephalopod realm,
    none is richer than Samsung, which now includes 1,200 devices. It is followed
    by LG, with more than 600, and Motorola and Nokia, each with almost 500 designs.
    Altogether, in early 2019 there were some 9,500 different mobile “species”—and
    that total is considerably larger than the known diversity of mammals (fewer than
    5,500 species).


    Even if we were to concede that cells are varieties of a single species (like
    the Bengal, Siberian, and Sumatran tigers), there are many others that illustrate
    how species-rich our designs are. The World Steel Association lists about 3,500
    grades of steel, more than all known species of rodents. Screws are another super-category:
    add up the combinations based on screw materials (aluminum to titanium), screw
    types (from cap to drywall, from machine to sheet metal), screw heads (from washer-faced
    to countersunk), screw drives (from slot to hex, from Phillips'
  - '[PAGE 229]


    to Robertson), screw shanks and tips (from die point to cone point), and screw
    dimensions (in metric and other units), and you end up with many millions of possible
    screw “species.”


    Taking a different tack, we have also surpassed nature in the range of mass. The
    smallest mammal, the Etruscan shrew, weighs as little as 1.3 grams, whereas the
    largest, the African elephant, averages about 5 tons. That''s a range of six orders
    of magnitude. Mass-produced cellphone vibrator motors match the shrew''s weight,
    while the largest centrifugal compressors driven by electric motors weigh around
    50 tons, for a range of seven orders of magnitude.


    The smallest bird, the bee hummingbird, weighs about 2 grams, whereas the largest
    flying bird, the Andean condor, can reach 15 kilograms, for a range of nearly
    four orders of magnitude. Today''s miniature drones weigh as little as 5 grams,
    versus a fully loaded Airbus 380 which weighs 570 tons—a difference of eight orders
    of magnitude.


    And our designs have a key functional advantage: they can work and survive pretty
    much on their own, unlike our bodies (and those of all animals), which depend
    on a well-functioning microbiome—there are at least as many bacterial cells in
    our guts as there are cells in our organs. That''s life for you.'
  - '[PAGE 230]


    # Planet of the cows


    For years I have tried to imagine how Earth would appear to a comprehensive and
    discerning probe dispatched by wonderfully sapient extraterrials. Of course, the
    probe would immediately conclude, after counting all organisms, that most individuals
    are either microscopic (bacteria, archaea, protists, fungi, algae) or very small
    (insects), but also that their aggregate weight dominates the planetary biomass.


    That would not really be surprising. What these tiny creatures lack in size, they
    more than make up in numbers. Microbes occupy every conceivable niche of the biosphere,
    including many extreme environments. Bacteria account for about 90 percent of
    the human body''s living cells, and as much as 3 percent of its total weight.
    What would be surprising, however, is the picture the probe would paint of the
    macroscopic forms of animal life—cattle (Bos taurus) and humans (Homo sapiens),
    in order.


    Unlike the extraterrestrial scientists, we do not get an instant readout. Even
    so, we can quantify cattle biomass and human biomass (anthropomass) with a fair
    degree of accuracy. The numbers of large, domesticated ruminants in all high-income
    countries are known, and they can be reasonably estimated for all low-income and
    even pastoral societies. The UN’s Food and Agricultural Organization puts the
    global cattle count at about 1.5 billion in 2020.'
