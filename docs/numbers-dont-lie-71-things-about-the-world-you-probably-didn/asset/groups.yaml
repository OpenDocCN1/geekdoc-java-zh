    ![](img/1055ff7c5aac304ec60cbf00b398a085_224_0.png)


    The key factors behind the decline have included higher consumption of meat and
    fat (supplying protein and fat formerly derived from milk) and decades of warnings
    about the deleterious effect of consuming saturated dairy fat. That conclusion
    has been disproved, and the latest findings claim that dairy fat may actually
    lower the frequency of coronary heart disease and stroke mortality—but these findings
    come too late for the declining industry. A similar retreat took place among Europe’s
    leading dairy consumers, where traditionally high levels of milk drinking were
    accompanied by daily eating of cheeses. Most notably, the French annual per capita
    milk consumption was about 100 liters in the mid-1950s, but by 2018 the rate was
    down to 45 liters.'
  - '[PAGE 225]


    Japan offers the best example of dairy’s rise in a non-milk-drinking society.
    Annual per capita supply averaged less than 1 liter in 1906, and 5.4 liters by
    1941. The latter total prorated to 15 milliliters (or a tablespoon) day: in reality,
    this meant that by the time American Forces occupied the country in 1945, none
    but a few large-city dwellers ever drink milk or yogurt and cheese. Milk was introduced
    through the National School Lunch Program in order to eliminate urban/rural discrepancy
    in childhood growth, and the per capita rates rose to 25 liters per year in 1980
    and 33 liters per year by the 2000, when the total dairy consumption (including
    cheeses and yogurt) was equivalent to more than 80 liters per year!


    Given the country’s size, Chinese dairy adoption was necessarily slower, but the
    average rates rose from negligible minima during the 1950s to 3 liters annually
    per capita during the 1970s (before the start of China’s rapid modernization),
    and are now more than 30 liters—higher than in South Korea, another traditionally
    non-milk-drinking culture that consumes milk, cheese, and yogurt. Diversification
    of dairy foods in modern urban societies, smaller family size, and higher shares
    of working women in cities have been the main factors of this Chinese transition,
    which was supported by the government’s elevation of milk to the status of healthy,
    prestige food, though it has been marred by poor quality and even outright adulteration:
    in 2008, some 300,000 babies and children were affected by drinking milk dosed
    with melamine, an industrial chemical added in order to increase milk’s nitrogen
    and its apparent protein content.


    But how were lactose-deficient societies able to undergo this shift? Because lactose
    intolerance is not universal, and because it is relative rather than absolute.
    Four-fifths of Japanese have no problems drinking up to a cup of milk a day, and
    that would translate to annual consumption of more than 70 liters—more than the
    recent American mean!


    And fermentation removes progressively more lactose, with fresh cheeses (such
    as ricotta) retaining less than a third of the lactose present in milk, and hard
    varieties (such as Cheddar or Parmigiano) having just a trace. And while yogurt
    retains nearly all of the original lactose, its bacterial enzymes facilitate the
    digestion. Milk, an ideal food for babies, is thus also, in moderation, an excellent
    food for anybody ... except for those with overt lactose intolerance.'
