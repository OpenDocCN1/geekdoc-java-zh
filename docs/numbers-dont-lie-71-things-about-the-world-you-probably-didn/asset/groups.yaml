    记录在案的这类远程追逐案例来自三大洲，其中包括一些最快的四足动物。在北美，墨西哥西北部的塔拉胡马拉人（Tarahumara）跑得比鹿快。再往北，派尤特人（Paiutes）和纳瓦霍人（Navajos）能耗尽叉羊。在非洲南部，卡拉哈里巴萨瓦（Kalahari
