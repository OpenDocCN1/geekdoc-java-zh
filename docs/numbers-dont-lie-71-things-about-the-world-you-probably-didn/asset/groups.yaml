    # The slow addio to the Mediterranean diet


    The benefits of the Mediterranean diet became widely known after 1970, when Ancel
    Keys published the first installment in his long-term study of nutrition and health
    in Italy, Greece, and five other countries, and found it was associated with a
    low incidence of heart disease.


    The key traits of the diet are a high intake of carbohydrates bread, pasta, and
    rice complemented by pulses (beans, peas, chickpeas) and nuts, dairy products
    (mostly cheese and yogurt), fruits and vegetables, seafood, and lightly processed
    seasonal foods, generally cooked with olive oil. It also includes much more modest
    quantities of sugar and meat. Best of all, plenty of wine is taken with the food.
    The latter habit is not one that is now recommended by dieteticians, but it is
    clear that the Mediterranean diet reduces the risk of cardiovascular problems,
    cuts the risk of certain cancers by about 10 percent, and offers some protection
    against type 2 diabetes. There is little doubt that if Western countries had followed
    it en masse, they’d never have reached the levels of obesity prevalent today.
    In 2013, UNESCO inscribed the diet on the list of the Intangible Cultural Heritage
    of Humanity, with Croatia, Cyprus, Greece, Italy, Morocco, Portugal, and Spain
    as the designated countries.'
