    # Improving the efficiency of household heating


    If our climate models are correct, and if we must indeed limit the increase in
    global warming to 2°C (and preferably to just 1.5°) in order to avoid the serious
    consequences associated with a planet-wide temperature rise, then we will have
    to take many unprecedented steps to reduce carbon emissions. Attention commonly
    focuses on new techniques that result in higher efficiencies—like light-emitting
    diodes—or that introduce entirely new modes of energy conversion, such as electric
    cars. Conservation is in principle a more practical solution, but unfortunately
    (besides, as we have seen, triple-glazed windows) there are few ways to extend
    it to what has long been the single biggest energy hog in the colder parts of
    the world: house heating.


    About 1.2 billion people need to heat their houses: about 400 million people living
    in the EU, Ukraine and Russia; another 400 million people in North America living
    outside the US South and Southwest; 400 million Chinese in the northeastern, northern,
    and western regions. Almost everywhere you look, the best available techniques
    are already efficient as is practically possible.


    It is striking just rapid the diffusion of efficient systems has been. During
    the 1950s, my family heated our house near the Czech–German border with wood burned
    in heavy cast-iron stoves. The efficiency of this process is no higher than 35
    percent; the rest of the heat escapes through a chimney. During my studies in
    Prague in the early 1960s, the city was energized by brown coal—a low-quality
    lignite—and the stove I stoked had an efficiency of 45 to 50 percent. In the late
    1960s, we lived in Pennsylvania on the upper floor of a small suburban house whose
    furnace burned oil with about 55 to 60 percent efficiency. In 1973, our first
    Canadian house had a natural gas furnace rated at 65 percent, and 17 years'
  - '[PAGE 252]


    ![](img/1055ff7c5aac304ec60cbf00b398a085_252_0.png)


    Inside of a household natural gas furnace'
  - '[PAGE 253]


    And my progress through a succession of fuels and efficiencies has been replicated
    by tens of millions of people in the northern hemisphere. Thanks to North America''s
    cheap natural gas and to the combination of (more expensive but readily available)
    Dutch, North Sea, and Russian gas in Europe—the cleanest of all fossil fuels—is
    what most of the people in northern climates have come to rely on, in place of
    wood, coal, and fuel oil. In Canada, the production of mid-efficiency (78 to 84
    percent) furnaces ended in 2009, and all new houses are now mandated to have high-efficiency
    (at least 90 percent) furnaces. The same will soon be true elsewhere in the West,
    while rising gas imports are already causing China to shift its heating from coal
    to gas.


    Future efficiency gains will have to come from somewhere else. Better insulation
    of the outer-facing part of the house (especially better windows) is the obvious
    (albeit often expensive) first step. Air-source heat pumps, transferring heat
    via a heat exchanger, have become popular in many places and are effective as
    long as temperatures do not dip below freezing; in cold regions they still need
    winter backup. Solar heating is possible, too, but in cold climates, it doesn’t
    work very well where and when it’s needed most—in very cold climates, during prolonged
    spells of cold but overcast weather, blizzards, and with the solar modules under
    heavy snow cover.


    Will the long-term need to limit global warming eventually lead to something unthinkable?
    I am referring to the most economically sensible choice, and the one that would
    make the greatest, longest-lasting contribution to reducing the carbon burden
    of heating: limiting the size of houses. We could do away with McMansions—mass-built
    houses with masses of floor space—in North America. Doing away with similar houses
    in the tropics would save on the opposite expense—energy currently wasted on air
    conditioning. Who’s up for that?'
  - '[PAGE 254]


    # Running into carbon


    In 1896, Svante Arrhenius, of Sweden, became the first scientist to quantify the
    effects of man-made carbon dioxide on global temperatures. He calculated that
    doubling the atmospheric level of the gas from its concentration in his time would
    raise the average midlatitude temperature by 5 to 6°C. That''s not too far from
    the latest results, obtained by computer models running more than 200,000 lines
    of code.


    The United Nations held its first Framework Convention on Climate Change in 1992,
    and this was followed by a series of meetings and climate treaties. But the global
    emissions of carbon dioxide have been rising steadily just the same.


    At the beginning of the 19th century, when the United Kingdom was the only major
    coal producer, global emissions of carbon from fossil fuel combustion were minuscule,
    at less than 10 million tons a year (to express them in terms of carbon dioxide,
    just multiply by 3.66). By century''s end, emissions surpassed half a billion
    tons of carbon. By 1950, they had topped 1.5 billion tons. The postwar economic
    expansion in Europe, North America, the USSR, and Japan—along with the post-1980
    economic rise of China—quadrupled emissions thereafter, to about 7 billion tons
    of carbon by the year 2000. In the two centuries between 1800 and 2000, the transfer
    of carbon from fossil fuels to the atmosphere increased 650-fold while the population
    had increased only sixfold!'
  - '[PAGE 255]


    ![](img/1055ff7c5aac304ec60cbf00b398a085_255_0.png)


    The new century has seen a significant divergence. By 2017, emissions had declined
    by about 15 percent in the European Union, with its slower economic growth and
    aging population, and also in the United States, thanks to the increasing use
    of natural gas instead of coal. However, all these gains were outbalanced by Chinese
    carbon emissions, which rose from about 1 billion to about 3 billion tons—enough
    to increase the worldwide total by nearly 45 percent, to 10.1 billion tons.


    By burning huge stocks of carbon that fossilized ages, human beings have pushed
    carbon dioxide concentrations to levels not seen for about 3 million years. Through
    drilling deep into glaciers covering Antarctica and Greenland, we can recover
    slender tubes of ice that contain tiny bubbles, and as we drill deeper, increasingly
    older ice. By sampling the air locked in those tiny bubbles, we have been able
    to reconstruct the history of carbon dioxide concentrations going back 800,000
    years. Back then, the atmospheric levels of the gas fluctuated between 180 and
    280 parts per million (that is, from 0.018 to 0.028 percent). During the past
    millennium,'
  - '[PAGE 256]


    the concentrations remained fairly stable, ranging from 275 ppm in the early 1600s
    to about 285 ppm before the end of the 19th century.

    Continuous measurements of the gas began near the top of Mauna Loa in Hawaii,
    in 1958: the 1959 mean was 316 ppm, the 2015 average reached 400 ppm, and 415
    ppm was first recorded in May 2019.


    Emissions will continue to decline in affluent countries, and the rate at which
    they grow in China has begun to slow down. However, it is speeding up in India
    and Africa, and here it is unlikely that we will see any substantial global declines
    anytime soon

    .


    The Paris Agreement of 2015 was lauded as the first accord containing national
    commitments to reduce future emissions. Actually, only a small number of countries
    made specific promises, there is no binding enforcement mechanism, and even if
    all targets were met by 2030, carbon emissions would still rise to nearly 50 percent
    above the 2017 level. According to the 2018 study by the Intergovernmental Panel
    for Climate Change, the only way to keep the average world temperature rise to
    no more than 1.5°C would be to put emissions almost immediately into a decline
    enough to bring them to zero by 2050


    That is not impossible—but it is very unlikely. Reaching that goal would require
    nothing short of a fundamental transformation of the global economy on scales
    and at a speed unprecedented in human history, a task that would be impossible
    to do without major economic and social dislocations. The greatest challenge would
    be how to lift billions from poverty without relying on fossil carbon. The affluent
    world has used billions of tons of it to create its high quality of life, but
    right now we do not have any affordable non-carbon alternatives that could be
    rapidly deployed on mass scales in order to energize the production of enormous
    quantities of what I have called the four pillars of modern civilization—ammonia,
    steel, cement, and plastics—which will be needed in Africa and Asia in the decades
    to come. The contrasts between the expressed concerns about global warming, the
    continued release of record volumes of carbon, and our capabilities to change
    that in the near term could not be starker.'
