    in confinement will, almost certainly, come out on top worldwide within a decade
    or two. Given this reality, consumers should be willing to pay a bit more in order
    for the producers to make the short lives of broilers less stressful.


    # (Not) drinking wine


    France and wine, what an iconic link—and, for centuries, how immutable! Introduced
    by Greeks long before the Romans conquered Gallia, greatly expanded during the
    Middle Ages, and eventually becoming a symbol of quality (Bordeaux, Bourgogne,
    Champagne) at home and abroad, French viticulture, wine-drinking, and wine exports
