    # Concrete facts


    Ancient Romans invented concrete, a mixture of aggregate (sand, crushed stone),
    water, and a bonding agent. They called it opus cementitium, and this widely used
    construction material did not contain modern cement (of lime, clay, and metallic
    oxides fired in rotating kilns at a high temperature and then ground into fine
    powder) rather a mixture of gypsum and quickline—and its best variety was made
    with volcanic sand from Puteoli near Mount Vesuvius. Its addition produced an
    outstanding material fit for massive vaults (Rome’s Pantheon, 118–126 CE, remains
    the world’s largest non-reinforced concrete dome) as well as for underwater construction
    in many ports around the Mediterranean, including ancient Caesarea (located in
    today’s Israel).


    Production of modern cement began in 1824, when Joseph Aspdin patented his firing
    of limestone and clay at high temperatures. Transformation of alumina and silica
    materials into a non-crystalline amorphous solid (vitrification, the same kind
    of process that is used to make glass) produces small nodules or lumps of a glassy
    clinker that is ground to make cement. Cement is then mixed with water (10–15
    percent of the final mass) and aggregates (sand and gravel, making up 60–75 percent
    of the total mass) to produce concrete, a deformable material that is strong under
    compression but weak in tension.'
