  `win32reg/Win32RegKeyTest.java`\n\n```java\nimport java.util.*;\n\n/**\n   @version\
  \ 1.04 2021-05-30\n   @author Cay Horstmann\n*/\npublic class Win32RegKeyTest\n\
  {  \n   public static void main(String[] args)\n   {  \n      var key = new Win32RegKey(\n\
  \         Win32RegKey.HKEY_CURRENT_USER, \"Software\\\\JavaSoft\\\\Java Runtime\
  \ Environment\");\n\n      key.setValue(\"Default user\", \"Harry Hacker\");\n \
  \     key.setValue(\"Lucky number\", Integer.valueOf(13));\n      key.setValue(\"\
  Small primes\", new byte[] { 2, 3, 5, 7, 11 });\n\n      Enumeration<String> e =\
  \ key.names();\n\n      while (e.hasMoreElements())\n      {  \n         String\
  \ name = e.nextElement();\n         System.out.print(name + \"=\");\n\n        \
  \ Object value = key.getValue(name);\n\n         if (value instanceof byte[] bytes)\n\
  \            for (byte b : bytes) System.out.print((b & 0xFF) + \" \");\n      \
  \   else \n            System.out.print(value);\n\n         System.out.println();\n\
  \      }\n   }\n}\n```\n\n### 类型查询函数\n\n*   `jboolean IsAssignableFrom(JNIEnv *env,\
  \ jclass cl1, jclass cl2)`\n    如果第一个类的对象可以赋值给第二个类的对象，则返回 `JNI_TRUE`，否则返回 `JNI_FALSE`。此函数用于测试类是否相同，或者\
  \ `cl1` 是否是 `cl2` 的子类，或者 `cl2` 是否是 `cl1` 或其任父类实现的接口。\n\n*   `jclass GetSuperclass(JNIEnv\
  \ *env, jclass cl)`\n    返回类的超类。如果 `cl` 代表 `Object` 类或接口，则返回 `NULL`。\n\n## 外部函数：展望未来\n\
  \n当使用 JNI 时，你必须编写 C 代码来访问 Java 数据结构、调用所需的 C 函数，并将结果转换回 Java。然后，你还必须将 C 代码链接到特定平台的库中。一种代号为“Project\
  \ Panama”的 API 允许你用 Java 编写这些代码，用于访问“外部”函数和内存。\n\n在 Java 21 中，该 API 是一个预览功能，其细节在最终发布之前可能会发生。列表\
  \ 13.24 中的程序是对该预览 API 的简单演示。\n\n该程序简单地调用了 `printf` 函数。不需要额外的 C 代码。该函数通过 Java `MethodHandle`\
  \ 被调用，而句柄通常用于调用 Java 函数。\n\n要访问 C 函数，你首先需要创建一个 `Linker` 对象。给定 C 函数的地址和类型描述，`Linker`\
  \ 可以为该函数生成 Java 方法句柄。\n\n该 API 提供了方法，可以将 Java 对象转换为内存块，并将这些内存块传递给 C 函数。在演示中，你需要提供一个包含来自\
  \ Java `String` 字符的 `char*`。\n\n内存是在 `Arena` 中分配的，以便管理其释放。在这里，我们使用了一个*受限的*（confined）\
  \ arena。它是自动关闭的，`close` 方法会释放所有分配的内存。\n\n如你所见，这个 API 比 JNI 要简单且方便得多。这个演示仅触及了 API\
  \ 的一角。有许多方法用于读取、写入和管理内存块。你还可以将 Java 函数作为回调传递给 C 函数。\n\n编译演示程序，请使用以下选项：\n\n```bash\n\
  javac --enable-preview --source 21 panama/PanamaDemo.java\n```\n\n外部函数和内存 API 本质上是不安全的，因为它提供了对未托管内存的访问。你使用运行时标志来允许模块使用该\
  \ API。通常，人们会将 Java API 和 C 库之间的桥接代码放在单独的模块中。但在演示中，原生访问发生在未命名模块中。以下是运行它的命令行：\n\n\
  ```bash\njava --enable-preview --enable-native-access=ALL-UNNAMED panama.PanamaDemo\n\
  ```\n\n作为一个更真实的例子，配套代码包含另一个演示程序，该程序调用了实现 Argon 2 密码哈希算法的外部库，该库目前不是 JDK 的一部分。\n\n\
  目前你仍然需要使用 JNI 作为与原生代码交互的稳定 API。随着外部函数和内存 API 的成熟，它将成为 JNI 的优替代方案。\n\n`panama/PanamaDemo.java`\n\
  \n```java\npackage panama;\n\nimport java.lang.invoke.*;\nimport java.lang.foreign.*;\n\
  \n/*\n\njavac --enable-preview --source 21 panama/PanamaDemo.java \n\njava --enable-preview\
  \ --enable-native-access=ALL-UNNAMED panama.PanamaDemo\n\n*/\n\npublic class PanamaDemo\n\
  {\n   public static void main(String[] args) throws Throwable\n   {\n      Linker\
  \ linker = Linker.nativeLinker();\n      MethodHandle printf = linker.downcallHandle(\n\
  \         linker.defaultLookup().find(\"printf\").get(),\n         FunctionDescriptor.of(ValueLayout.JAVA_INT,\
  \ ValueLayout.ADDRESS));\n\n      try (Arena arena = Arena.ofConfined())\n     \
  \ {\n         MemorySegment str = arena.allocateUtf8String(\"Hello, World!\\n\"\
  );\n         int result = (int) printf.invoke(str);\n         System.out.printf(\"\
  Printed %d characters.%n\", result);\n      }\n   }\n}\n```\n\n你现在已经到达了《Core Java》第二卷的末尾，完成了一段接触了许多高级\
  \ API 的长程之旅。我从每个 Java 程序员都需要的主题开始：流、XML、网络、数据库和国际化。我以安全、注解处理、高级图形和原生方法等技术性很强的章节作为结束。我希望你喜欢这次在\
  \ Java API 广阔世界中的之旅，并能够将新学到的知识应用到你的项目中。\n"
