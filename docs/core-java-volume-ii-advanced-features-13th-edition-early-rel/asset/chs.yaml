  \ options)` 7\n  打开给定路径的文件通道。默认情况下，通道是可读的。\n\n* `MappedByteBuffer map(FileChannel.MapMode\
  \ mode, long position, long size)`\n  将文件映射到内存。参数 `mode` 是 `READ_ONLY`、`READ_WRITE`\
  \ 或 `PRIVATE`（`FileChannel.MapMode` 枚举）。\n\n`java.nio.Buffer` 1.4\n\n* `boolean\
  \ hasRemaining()`\n  如果缓冲区位置尚未到达限制，则返回 `true`。\n\n* `int limit()`\n  返回限制——即不再有可用字节的位置。\n\
