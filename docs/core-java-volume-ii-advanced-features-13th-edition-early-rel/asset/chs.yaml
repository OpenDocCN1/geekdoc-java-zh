  \n\n\n\n\n# 不同强度的排序（英语语言区域）\n\n| 优先（Primary） | 次次级（Secondary） | 三级（Tertiary） |\n\
  | --- | --- | --- |\n| Angstrom = Ångström | Angstrom ≠ Ångström | Angstrom ≠ Ångström\
  \ |\n| Able = able | Able = able | Able ≠ able |\n\n当强度被设置为 `Collator.IDENTICAL`\
  \ 时，不允许有任何差异。此设置主要与一个相当技术性的排序器设置结合使用，即 `decomposition mode`（分解模式），我们将在接下来介绍它。\n\n\
  某些情况下，一个字符或一组字符序列在 Unicode 中可以用多种方式进行描述。例如，“Å”可以是 Unicode 字符 `U+00C5`，也可以表示为普通的“A”（`U+0065`）后跟一个“°”（`组合上圆圈符号`；`U+030A`）。可能更令人惊讶的是，字母序列“ffi”可以使用单个字符“Latin\
  \ 小写字母连字 ffi”来描述，其代码为 `U+FB03`。（人们可以认为这是一个显示问题，不应该导致不同的 Unicode 字符，但规则不是我们定的。）\n\
  \nUnicode 标准为字符串定义了四种 `normalization forms`（`D`、`KD`、`C` 和 `KC`）。详情请参阅 [`www.unicode.org/unicode/reports/tr15/tr15-23.html`](https://www.unicode.org/unicode/reports/tr15/tr15-23.html)。在规范化形式\
  \ `C` 中，带变音的字符总是组合的。例如，“A”和组合上圆圈符号“°”的序列被组合成单个字符“Å”。在形式 `D` 中，带变音的字符总是分解为它们的基字母和组合变音：“Å”被转换为“A”后跟“°”。`KC`\
  \ 和 `KD` 形式也会分解连字或商标符号等字符。\n\n你可以选择排序器使用的规范化程度。值 `Collator.NO_DECOMPOSITION` 不对字符串进行任何规范化。此选项更快，但可能不适用于以多种形式表示字符的文本。默认的\
  \ `Collator.CANONICAL_DECOMPOSITION` 使用规范化形式 `D`。这对于包含变音符号但不包含连字的文本很有用。最后，“完全分解”使用规范化形式\
  \ `KD`。示例请参见表 7.9。\n\n### 分解模式之间的差异\n\n| 无分解 | 规范化分解 (Canonical Decomposition) |\
  \ 完全分解 (Full Decomposition) |\n| --- | --- | --- |\n| Å ≠ A° | Å = A° | Å = A° |\n\
  | ™ ≠ TM | ™ ≠ TM | ™ = TM |\n\n让排序器多次分解一个字符串是浪费的。如果一个字符串与其他字符串进行多次比较，你可以将分解结果保存在\
  \ `collation` 键对象中。`getCollationKey` 方法返回一个 `CollationKey` 对象，你可以将其用于进一步、更快的比较。这是一个示例：\n\
  \n```\nString a = . . .\nCollationKey aKey = coll.getCollationKey(a);\nif(aKey.compareTo(coll.getCollationKey(b))\
  \ == 0) // fast 比较\n   . . .\n```\n\n最后，即使你不进行排序，可能也想将字符串转换为它们的规范化形式——例如，将字符串存储在数据库中或与其他程序通信。`java.text.Normalizer`\
  \ 类执行规范化过程。这是一个示例：\n\n```\nString name = \"Ångström\";\nString normalized = Normalizer.normalize(name,\
  \ Normalizer.Form.NFD);\n   // 使用规范化形式 D\n```\n\n规范化后的字符串包含十个字符。“Å”和“ö”被“A°”和“o¨”序列取代。\n\
  \n然而，这通常不是存储和传输的最佳形式。规范化形式 `C` 首先应用分解，然后按照标准顺序将变音符号组合回去。根据 W3C 的规定，这是在互联网上传输数据的推荐模式。\n\
  \nListing 7.3 中的程序允许你实验排序顺序。书的配套代码还有一个 GUI 版本。在文本字段中输入一个单词并点击 Add 按钮将其添加到单词列表中。每当你添加另一个单词，或者更改语言区域、强度或分解模式时，单词列表都会重新排序。`=`\
  \ 符号表示被视为相同的单词（参见图 7.3）。\n\n![Figure](img/fig05-03.jpg) `CollationTest` 程序\n\n语言区域名称以排序顺序显示，使用默认语言区域的排序器。如果你用美国英语语言区域运行此程序，请注意“Norwegian\
  \ (Norway,Nynorsk)”在“Norwegian (Norway)”之前，尽管逗号字符的 Unicode 值大于右括号字符的 Unicode 值。\n\
