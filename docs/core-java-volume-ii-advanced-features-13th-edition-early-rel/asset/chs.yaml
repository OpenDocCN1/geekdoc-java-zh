  # Preferences API\n\n在本章的最后，我们将对 `java.util.prefs` API 进行讨论。在桌面程序中，你通常希望存储用户偏好，例如用户处理过的最后一个文件、上一个窗口位置等。\n\
  \n正如你在第一卷第 9 章中所所示，`Properties` 类使得加载和保存程序的配置信息变得简单。然而，使用属性文件有以下缺点：\n\n*   某些操作系统没有“主主目录”的概念，这使得很难为配置文件找到一个统一的位置。\n\
  *   配置文件的命名没有标准规范，当用户安装多个 Java 应用时，增加了名称冲突的概率。\n\n某些操作系统拥有一个配置信息的中央存储库。最为人知的例子是\
  \ Microsoft Windows 中的注册表。`Preferences` 类以跨平台的方式提供了这样一个中央存储库。在 Windows 中，`Preferences`\
  \ 类使用注册表进行存储；而在 Linux 上，信息则存储在本地文件系统中。当然，对于使用 `Preferences` 类的程序员来说，仓库的实现是透明的。\n\
  \n`Preferences` 仓库具有树形结构，具有如 `/com/mycompany/myapp.` 的节点路径名称。与包名一样，只要程序员以反向域名开头路径，就可以避免名称冲突。事实上，API\
  \ 的设计者建议配置节点路径与你程序中的包名相匹配。\n\n仓库中的每个节点都有一个独立的键值对表，你可以用它来存储数字、字符串或字节数组。该 API 并未提供存储序列化对象的规定。API\
  \ 设计者认为，序列化格式对于长期存储来说太脆弱了。当然，如果你不同意，可以将序列化对象保存在字节数组中。\n\n为了增加额外的灵活性，存在多个并行的树。每个程序用户都有一棵树；还有一个被称为“系统树”的额外树，适用于所有用户通用的设置。`Preferences`\
  \ 类使用操作系统的“当前用户”概念来访问相应的用户树。\n\n要访问树中的节点，从用户根或系统根开始：\n\n```java\nPreferences root\
  \ = Preferences.userRoot();\n```\n\n或\n\n```java\nPreferences root = Preferences.systemRoot();\n\
  ```\n\n然后访问该节点。你可以直接提供节点路径名称：\n\n```java\nPreferences node = root.node(\"/com/mycompany/myapp\"\
  );\n```\n\n有一个方便的快捷方式可以获取路径名称等于类包名的节点。只需获取该类的一个对象并调用\n\n```java\nPreferences node\
  \ = Preferences.userNodeForPackage(obj.getClass());\n```\n\n或\n\n```java\nPreferences\
  \ node = Preferences.systemNodeForPackage(obj.getClass());\n```\n\n通常，`obj` 将是 `this`\
  \ 引用。\n\n一旦你有了节点，就可以通过方法访问键值对表：\n\n```java\nString get(String key, String def)\n\
  int getInt(String key, int def)\nlong getLong(String key, long def)\nfloat getFloat(String\
  \ key, float def)\ndouble getDouble(String key, double def)\nboolean getBoolean(String\
  \ key, boolean def)\nbyte[] getByteArray(String key, byte[] def)\n```\n\n注意，在读取信息时必须指定默认值，以防仓库数据不可用。需要默认值有几个原因：数据可能因为用户从未指定过偏好而缺失；某些资源受的平台可能没有仓库；移动设备可能会临时与仓库断开。\n\
  \n相反，你可以使用 `put` 方法向仓库写入数据，例如：\n\n```java\nput(String key, String value)\nputInt(String\
  \ key, int value)\n```\n\n以此类推。\n\n你可以使用方法枚举节点中存储的所有键：\n\n```java\nString[] keys()\n\
  ```\n\n目前没有办法可以特定键的值类型。\n\n节点名称和键限制为 80 个字符，字符串值限制为 8,192 个字符。\n\nWindows 注册表等中央存储库传统上面临两个问题：\n\
  \n*   它们会变成充满过期信息的“垃圾场”。\n*   配置数据纠缠在仓库中，使得将偏好迁移到新平台变得困难。\n\n`Preferences` 类为第二个问题提供了解决方案。你可以通过调用方法导出子树（或较少见的单个节点）的偏好：\n\
  \n```java\nvoid exportSubtree(OutputStream out)\nvoid exportNode(OutputStream out)\n\
  ```\n\n数据以 XML 格式保存。你可以通过调用以下方法将其导入到另一个仓库：\n\n```java\nvoid importPreferences(InputStream\
  \ in)\n```\n\n这是一个示例文件：\n\n```xml\n<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n\
  <!DOCTYPE preferences SYSTEM \"http://java.sun.com/dtd/preferences.dtd\">\n<preferences\
  \ EXTERNAL_XML_VERSION=\"1.0\">\n   <root type=\"user\">\n      <map/>\n      <node\
  \ name=\"com\">\n         <map/>\n         <node name=\"horstmann\">\n         \
  \   <map/>\n            <node name=\"corejava\">\n               <map>\n       \
  \     <entry key=\"height\" value=\"200.0\"/>\n            <entry key=\"left\" value=\"\
  1027.0\"/>\n            <entry key=\"filename\" value=\"/home/cay/books/cj11/code/v1ch11/raven.html\"\
  />\n            <entry key=\"top\" value=\"380.0\"/>\n            <entry key=\"\
  width\" value=\"300.0\"/>\n               </map>\n            </node>\n        </node>\n\
  \      </node>\n   </root>\n</preferences>\n```\n\n如果你的程序使用了偏好，你应该给用户导出和导入它们的机会，这样他们就可以轻松地将设置从一台计算机迁移到另一台。列表\
  \ 10.8 中的程序演示了这种技术。程序只需保存窗口位置和最后加载的文件。调整窗口大小，然后导出偏好，移动窗口，退出并重新启动应用程序。窗口将像你退出时一模一样。导入偏好，窗口将恢复到之前的位置。\n\
  \n```java\npreferences/ImageViewer.java\n```\n\n\n\n\n\n```java\npackage preferences;\n\
  \nimport java.awt.EventQueue;\nimport java.awt.event.*;\nimport java.io.*;\nimport\
  \ java.util.prefs.*;\nimport javax.swing.*;\n\n/**\n * 一个测试偏好设置的程序。该程序会记录\n * 帧的位置、大小和最后选择的文件。\n\
  \ * @version 1.10 2018-04-10\n * @author Cay Horstmann\n */\npublic class ImageViewer\n\
  {\n   public static void main(String[] args)\n   {\n      EventQueue.invokeLater(()\
  \ ->\n         {\n            var frame = new ImageViewerFrame();\n            frame.setTitle(\"\
  ImageViewer\");\n            frame.setDefaultCloseOperation(JFrame.EXIT_ON_CLOSE);\n\
  \            frame.setVisible(true);\n         });\n   }\n}\n\n/**\n * 一个图像查看器，它可以从用户偏好中恢复位置、大小和图像，\n\
  \ *并在退出时更新偏好。\n */\nclass ImageViewerFrame extends JFrame\n{\n   private static\
  \ final int DEFAULT_WIDTH = 300;\n   private static final int DEFAULT_HEIGHT = 200;\n\
  \   private String image;\n\n   public ImageViewerFrame()\n   {\n      Preferences\
  \ root = Preferences.userRoot();\n      Preferences node = root.node(\"/com/horstmann/corejava/ImageViewer\"\
  );\n      // 从属性中获取位置、大小、标题\n      int left = node.getInt(\"left\", 0);\n      int\
  \ top = node.getInt(\"top\", 0);\n      int width = node.getInt(\"width\", DEFAULT_WIDTH);\n\
  \      int height = node.getInt(\"height\", DEFAULT_HEIGHT);\n      setBounds(left,\
  \ top, width, height);\n      image = node.get(\"image\", null);\n      var label\
  \ = new JLabel();\n      if (image != null) label.setIcon(new ImageIcon(image));\n\
  \n      addWindowListener(new WindowAdapter()\n      {\n         public void windowClosing(WindowEvent\
  \ event)\n         {\n            node.putInt(\"left\", getX());\n            node.putInt(\"\
  top\", getY());\n            node.putInt(\"width\", getWidth());\n            node.putInt(\"\
  height\", getHeight());\n            if (image != null) node.put(\"image\", image);\
  \      \n         }\n      });\n\n      // 使用标签显示图像\n      add(label);\n\n     \
  \ // 设置文件选择器\n      var chooser = new JFileChooser();\n      chooser.setCurrentDirectory(new\
  \ File(\".\"));\n\n      // 设置菜单栏\n      var menuBar = new JMenuBar();\n      setJMenuBar(menuBar);\n\
  \n      var menu = new JMenu(\"File\");\n      menuBar.add(menu);\n\n      var openItem\
  \ = new JMenuItem(\"Open\");\n      menu.add(openItem);\n      openItem.addActionListener(event\
  \ ->\n         {\n            // 显示文件选择器对话框\n            int result = chooser.showOpenDialog(null);\n\
  \n            // 如果选择了文件，则将其设为标签的图标\n            if (result == JFileChooser.APPROVE_OPTION)\n\
  \            {\n               image = chooser.getSelectedFile().getPath();\n  \
  \             label.setIcon(new ImageIcon(image));\n            }\n         });\n\
  \n      var exitItem = new JMenuItem(\"Exit\");\n      menu.add(exitItem);\n   \
  \   exitItem.addActionListener(event -> System.exit(0));\n   }\n}\n```\n\n`java.util.prefs.Preferences`\
  \ 1.4\n\n*   `Preferences userRoot()`\n    返回调用程序的用户的偏好根节点。\n\n*   `Preferences\
  \ systemRoot()`\n    返回系统范围的根偏好节点。\n\n*   `Preferences node(String path)`\n    返回可以通过给定路径从当前节点到达的节点。如果\
  \ `path` 是绝对路径（即以 `/` 开头），则该节点从包含此偏好节点的树根开始查找。如果不存在给定路径的节点，则创建一个。\n\n*   `Preferences\
  \ userNodeForPackage(Class cl)`\n\n*   `Preferences systemNodeForPackage(Class cl)`\n\
  \    返回当前用户树或系统树中的一个节点，其绝对节点路径与类 `cl` 的包名对应。\n\n*   `String[] keys()`\n    返回属于此节点的所有键。\n\
  \n*   `String get(String key, String def)`\n\n*   `int getInt(String key, int def)`\n\
  \n*   `long getLong(String key, long def)`\n\n*   `float getFloat(String key, float\
  \ def)`\n*   `double getDouble(String key, double def)`\n*   `boolean getBoolean(String\
  \ key, boolean def)`\n\n*   `byte[] getByteArray(String key, byte[] def)`\n    返回与给定键关联的值——如果没有与键关联的值、关联的值的类型不正确或偏好存储器不可用，则返回提供的默认值。\n\
  \n*   `void put(String key, String value)`\n*   `void putInt(String key, int value)`\n\
  *   `void putLong(String key, long value)`\n*   `void putFloat(String key, float\
  \ value)`\n*   `void putDouble(String key, double value)`\n*   `void putBoolean(String\
  \ key, boolean value)`\n*   `void putByteArray(String key, byte[] value)`\n    在此节点上存储键/值对。\n\
  \n*   `void exportSubtree(OutputStream out)`\n    将此节点及其子节点的偏好写入指定的流中。\n\n*   `void\
  \ exportNode(OutputStream out)`\n    将此节点及其子节点的偏好写入指定的流中。\n\n*   `void importPreferences(InputStream\
  \ in)`\n    导入流中包含的偏好。\n\n## 使用 Swing 的界面组件\n\n上一章主要是为了向你展示如何使用 Java 中的事件模型。在此过程中，你迈向学习如何构建\
  \ GUI 的第一步。本章将向你展示最常用的组件。\n\n## Swing 和模型-视图-控制器\n\n让我们停下来，思考一下构成如按钮、复选框、文本字段或树控件等用户界面组件的部分。每个组件都有三个特征：\n\
  \n*   它的*内容*，例如按钮的状态（按下或未按下），或文本字段中的文本\n*   它的*视觉外观*（颜色、大小等）\n*   它的*行为*（对事件的反应）\n\
  \n即使是像按钮这样简单的组件，这些特征之间也表现出中等复杂的交互。显然，按钮的视觉外观取决于外观和（look-and-feel）。Metal 按钮看起来与 Windows\
  \ 按钮或 Motif 按钮不同。此外，外观取决于按钮状态；当按钮被按下时，它需要重绘以显示不同的外观。状态则取决于按钮接收到的事件。\n\n当然，当你程序中使用按钮时，你只是简单地将其视为一个*按钮*；你不会过多考虑内部工作原理。这毕竟是实现按钮的程序员的工作。然而，实现按钮及所有其他用户界面组件的程序员有动力对它们进行更深层次的思考，以便无论启用何种外观，它们都能良好工作。\n\
  \n为了做到这一点，Swing 的设计者转向了一个已知的设计模式：*模型-视图-控制器 (MVC)* 模式。这种设计模式告诉我们提供三个独立的对象：\n\n*\
  \   *模型*（model），存储内容\n*   *视图*（view），负责显示内容\n*   *控制器*（controller），处理用户输入\n\n\n\n\
  \n该模式精确地规定了这三个对象是如何相互作用的。模型存储内容且`没有用户界面`。对于按钮来说，内容非常简单——只是一组小的标记位，用于指示按钮当前是按下还是弹起状态、是激活还是非激活状态等。对于文本字段来说，内容就稍微有趣一点。它是一个持有当前文本的字符串对象。这与内容的视图`不是一回事`——如果内容大于文本字段的范围，用户只能看到显示的部分文本（参阅图\
  \ 11.1）。\n\n![Figure](img/09_02.jpg)文本字段的模型和视图\n\n模型必须实现更改内容以及发现内容是什么的方法。例如，文本模型拥有在当前文本中添加或删除字符的方法，以及将当前文本作为字符串返回的方法。再次强调，请记住，模型是完全非视觉的。绘制存储在模型中的数据是视图的工作。\n\
  \n“模型（model）”这个词可能并不十分恰切，因为我们通常认为模型是某个抽象概念的表示。汽车和飞机设计人员制作模型来模拟真实的汽车和飞机。但当你考虑模型-视图-控制器模式时，这种类比实际上会误导你。在这个设计模式中，模型存储完整的内容，而视图提供了内容的（完整或不完整的）视觉表示。一个更好的类比也许是为艺术家摆姿的模特。观察模特并创建视图是艺术家的工作。取决于艺术家，那个视图可能是一幅正式肖像、一幅印象派绘画，或者是一幅肢体奇异扭曲的立方主义画。\n\
  \n模型-视图-控制器模式的优势之一是一个模型可以有多个视图，每个视图显示完整内容的不同部分或方面。例如，HTML 编辑器可以为同一内容提供两个`同时`视图：一个所见即所得（WYSIWYG）视图和一个“原始标签”视图（参阅图\
  \ 11.2）。当模型通过其中一个视图的控制器进行更新时，它会通知所有已附加的视图关于该变化的信息。当视图收到通知时，它们会自动刷新自己。当然，对于像按钮这样简单的用户界面组件，你不会为同一个模型拥有多个视图。\n\
  \n![Figure](img/09_03.jpg)同一个模型的两个独立视图\n\n控制器处理用户输入事件，例如鼠标点击和按键触发。它然后决定是否将这些事件转换为模型或视图的更改。例如，如果用户在文本框中按下字符键，控制器会调用模型的“插入字符”命令。然后模型告诉视图更新自己。视图永远不知道文本为什么改变。但如果用户按下光标键，控制器可能会视图滚动。滚动视图对底层文本没有影响，因此模型永远不知道该事件发生了。\n\
  \n图 11.3 显示了模型、视图和控制器对象之间的交互。\n\n![Figure](img/09_04.jpg)模型、视图和控制器对象之间的交互\n\n对于大多数\
  \ Swing 组件，模型类实现了一个以 `Model` 结尾的接口；在这种情况下，接口被称为 `ButtonModel`。实现该接口的类可以定义各种按钮的状态。实际上，按钮并没有那么复杂，Swing\
  \ 库包含一个名为 `DefaultButtonModel`的类，它实现了该接口。\n\n你可以通过查看 `ButtonModel` 接口的属性来了解按钮模型维护的数据类型——参阅表\
  \ 11.1。\n\n`ButtonModel` 接口属性\n\n| 属性名称 | 值 |\n| --- | --- |\n| `actionCommand`\
  \ | 与此按钮关联的操作命令字符串 |\n| `mnemonic` | 此按钮的键盘快捷键 |\n| `armed` | 如果按钮被按下且鼠标仍悬停在按钮上，则为\
  \ `true` |\n| `enabled` | 如果按钮可选，则为 `true` |\n| `pressed` | 如果按钮被按下但鼠标按钮尚未释放，则为\
  \ `true` |\n| `rollover` | 如果鼠标悬停在按钮上，则为 `true` |\n| `selected` | 如果按钮已切换（用于复选框和单选按钮），则为\
  \ `true` |\n\n每个 `JButton` 对象都存储了一个你可以从中的的按钮模型对象。\n\n```\nvar button = new JButton(\"\
  Blue\");\nButtonModel model = button.getModel();\n```\n\n在实践中，你并不关心这些——按钮状态的细微细节只对绘制它的视图感兴趣。所有重要信息——例如按钮是否启用——都可以从\
  \ `JButton` 类获取。（当然，`JButton` 然后会请求它的模型来获取那些信息。）\n\n再看一遍 `ButtonModel` 接口，看看什么`不在`那里。模型`并不`存储按钮标签或图标。仅仅通过查看模型，无法发现按钮表面上有什么。（实际上，正如你将在第\
  \ 11.4.2 节中看到的，这种设计的纯洁性是程序员某些苦恼的来源。）\n\n值得注意的是，`同一个`模型（即 `DefaultButtonModel`）被用于推送按钮、单选按钮、复选框甚至菜单项。\n\
  \n所以，在阅读了这段关于按钮内部构造简要介绍后，你可能会想：`JButton` 到底是什么？它只是继承自 `JComponent` 的包装类，持有 `DefaultButtonModel`\
  \ 对象、一些视图数据（如标签和图标）以及一个负责视图的 `BasicUI` 对象。\n\n\n\n\n\n遗憾的是，继承层次结构在两个方面有些不规范。首先，顶层窗口（如\
  \ `JFrame`）是 `Container` 的子类，因此也是 `Component`，但它们不能放在其他容器内部。此外，`JComponent` 是 `Container`\
  \ 的子类，而不是 `Component`。因此，你可以将其他组件添加到 `JButton` 中。（然而，这些组件将不会被显示。）\n\n每个容器都有一个默认的布局管理器，但你始终可以设置自己的布局管理器。例如，以下语句：\n\
  \n```\npanel.setLayout(new GridLayout(4, 4));\n```\n\n使用了 `GridLayout` 类将组件以四行四列的形式布局。当你将组件添加到容器中时，容器的\
  \ `add` 方法会将组件和任何位置方向传递给布局管理器。\n\n`java.awt.Container` 1.0\n\n*   `void setLayout(LayoutManager\
  \ m)`\n    为此容器设置布局管理器。\n*   `Component add(Component c)`\n*   `Component add(Component\
  \ c, Object constraints)` 1.1\n    向此容器添加一个组件并返回该组件的引用。\n\n`java.awt.FlowLayout`\
  \ 1.0\n\n*   `FlowLayout()`\n*   `FlowLayout(int align)`\n*   `FlowLayout(int align,\
  \ int hgap, int vgap)`\n    构造一个新的 `FlowLayout`。`align` 参数是 `LEFT`、`CENTER` 或 `RIGHT`\
  \ 之一。\n\n### 边界布局 (Border Layout)\n\n边界布局管理器是每个 `JFrame` 内容面板的默认布局管理器。与完全控制每个组件位置的流布局不同，边界布局允许让你选择放置每个组件的位置。你可以选择将组件放置在内容面板的中心、北、南、东或西（参见图\
  \ 11.7）。\n\n![Figure](img/09_09.jpg)\n边界布局\n\n例如：\n\n```\nframe.add(component, BorderLayout.SOUTH);\n\
  ```\n\n边缘组件首先布局，剩余的可用空间由中心占据。当容器调整大小时，边缘组件的尺寸保持不变，但中心组件会改变大小。通过指定 `BorderLayout`\
  \ 类的常量 `CENTER`、`NORTH`、`SOUTH`、`EAST` 或 `WEST` 来添加组件。并不是所有位置都需要被占据。如果你不提供任何值，则认为\
  \ `CENTER`。\n\n`BorderLayout` 常量定义为字符串。例如，`BorderLayout.SOUTH` 被定义为字符串 `\"South\"\
  `。这比使用字符串更安全。如果你不小心拼写错了字符串，例如 `frame.add(component, \"south\")`，编译器无法捕捉该错误。\n\n\
  与流布局不同，边界布局会扩展所有组件以填充可用空间。（流布局让每个组件保持其首选尺寸。）当你添加一个按钮时，会出现问题：\n\n```\nframe.add(yellowButton,\
  \ BorderLayout.SOUTH); // 不要这样做\n```\n\n图 11.8 显示了使用上述代码段时发生的情况。按钮已经增大并填充了框架的整个南部区域。而且，如果你在南部区域添加另一个按钮，它只会挤掉第一个按钮。\n\
  \n![Figure](img/buttontest4.jpg)\n由边界布局管理的单个按钮\n\n为了解决这个问题，请使用额外的面板。例如，查看图 11.9。屏幕底部的三个按钮都包含在一个面板中。该面板被放入内容面板的南部区域。\n\
  \n![Figure](img/buttontest5.jpg)\n放置在框架南部区域的面板\n\n要实现这种配置，首先创建一个新的 `JPanel` 对象，然后将各个按钮添加到面板中。面板的默认布局管理器是\
  \ `FlowLayout`，这对于这种情况是一个很好的选择。使用你之前见过的 `add` 方法将各个按钮添加到面板。按钮的位置和大小由 `FlowLayout`\
  \ 管理器控制。这意味着按钮保持在面板居中，而不会扩展以填充整个面板区域。最后，将面板添加到框架的内容面板。\n\n```\nvar panel = new JPanel();\n\
  panel.add(yellowButton);\npanel.add(blueButton);\npanel.add(redButton);\nframe.add(panel,\
  \ BorderLayout.SOUTH);\n```\n\n边界布局扩展了面板的大小以填充整个南部区域。\n\n`java.awt.BorderLayout`\
  \ 1.0\n\n*   `BorderLayout()`\n*   `BorderLayout(int hgap, int vgap)`\n    构造一个新的\
  \ `BorderLayout`。\n\n### 网格布局 (Grid Layout)\n\n网格布局像电子表格一样按所有组件行和列排列组件。所有组件都具有相同的尺寸。图\
  \ 11.10 中的计算器程序使用网格布局来安排计算器按钮。当重新调整窗口大小时，按钮会增大或缩小，但所有按钮具有相同的尺寸。\n\n![Figure](img/calculator.jpg)\n\
  计算器\n\n在网格布局对象的构造函数中，你指定所需的行和列数。\n\n```\npanel.setLayout(new GridLayout(4, 4));\n\
  ```\n\n添加组件，从第一行的第一个项目开始，然后是第一行的第二个项目，依此类推。\n\n```\npanel.add(new JButton(\"1\"\
  ));\npanel.add(new JButton(\"2\"));\n```\n\n当然，很少有应用程序的布局像计算器界面那样固定。在实践中，较小的网格（通常只有一行或一列）对于组织窗口的局部区域非常有用。例如，如果你想有一行大小完全相同的按钮，可以将按钮放在一个由单行网格布局控制的面板中。\n\
  \n`java.awt.GridLayout` 1.0\n\n*   `GridLayout(int rows, int columns)`\n*   `GridLayout(int\
  \ rows, int columns, int hgap, int vgap)`\n    构造一个新的 `GridLayout`。`rows` 和 `columns`\
  \ 之一（但不是两个）可以为零，表示每行或每列任意数量的组件。\n\n## 文本输入\n\n我们终于准备好引入 Swing 用户界面组件了。让我们从允许输入和编辑文本的组件开始。你可以使用\
  \ `JTextField` 和 `JTextArea` 组件进行文本输入。文本字段只能接受一行文本；文本区域可以接受多行文本。`JPasswordField`\
  \ 接受一行文本但不显示内容。\n\n这三个类都继承自一个名为 `JTextComponent` 的类。你无法自己构造 `JTextComponent`，因为它是一个抽象类。另一方面，正如\
  \ Java 中常见的情况一样，当你查询 API 文档时，你可能会发现你正在寻找的方法实际上在父类 `JTextComponent` 中而不是派生类中。例如，获取或设置文本字段或文本区域文本的方法实际上在\
  \ `JTextComponent` 中。\n\n`javax.swing.text.JTextComponent` 1.2\n\n*   `String getText()`\n\
  *   `void setText(String text)`\n    获取或设置此文本组件的文本。\n*   `boolean isEditable()`\n\
  *   `void setEditable(boolean b)`\n    获取或设置 `editable` 属性，该属性决定用户是否可以编辑此文本组件的内容。\n\
  \n### 文本字段 (Text Fields)\n\n将文本字段添加到窗口的标准方法是将其添加到面板或其他容器——就像你添加按钮一样：\n\n```\nvar\
  \ panel = new JPanel();\nvar textField = new JTextField(\"Default input\", 20);\n\
  panel.add(textField);\n```\n\n\n\n\n这段代码添加了一个文本字段，并通过在内部放入字符串 `\"Default input\"\
  ` 来对其进行初始化。该构造函数的第二个参数设置了宽度。在这种情况下，宽度为 20 个“列”。遗憾的是，“列”是一个相当不精确的测量。一列是指你用于文本的字体中一个字符的预期宽度。其理念是，如果你预计输入少于或等于\
  \ `n` 个字符，就应该指定 `n` 为列宽。在实践中，这种测量方法并不十分理想，为了安全起见，你应该在最大输入长度上加上 1 或 2。此外，请记住，列数只是给\
  \ AWT 的一个提示，用于提供 `preferred`（优先）尺寸。如果布局管理器需要扩大或缩小文本字段，它可以调整大小。你在 `JTextField` 构造函数中设置的列宽并不是用户输入字符数量的上限。用户仍然可以输入长的字符串，但当文本超过字段长度时，输入会滚动。用户倾向于认为滚动文本字段很烦人，因此你应该给字段尺寸留得宽裕一些。如果你需要在运行时重置列数，可以使用\
  \ `setColumns` 方法。\n\n在使用 `setColumns` 方法更改文本框的大小后，调用周围容器的 `revalidate` 方法。\n\n\
  ```\ntextField.setColumns(10);\npanel.revalidate();\n```\n\n`revalidate` 方法会重新计算容器中所有组件的尺寸和布局。在你使用\
  \ `revalidate` 方法之后，布局管理器会调整容器的大小，文本字段改变后的尺寸将变得可见。\n\n`revalidate` 方法属于 `JComponent`\
  \ 类。它不会立即调整组件的大小，而仅仅将其标记为需要调整大小。当多个组件请求调整大时，这种方法避免了重复计算。然而，如果你想重新计算 `JFrame` 内部所有组件的尺寸，你必须调用\
  \ `validate` 方法——`JFrame` 并没有继承 `JComponent`。\n\n通常情况下，用户会在文本字段中添加文本（或编辑现有的文本）。这些文本字段经常是空白的。要创建一个空白文本字段，只需不要为\
  \ `JTextField` 构造函数提供字符串参数即可：\n\n```\nvar textField = new JTextField(20);\n```\n\
  \n你可以通过使用上一节提到的 `JTextComponent` 父类的 `setText` 方法随时更改文本字段的内容。例如：\n\n```\ntextField.setText(\"\
  Hello!\");\n```\n\n而且，正如上一节提到的，你可以通过调用 `getText` 方法来获取用户输入了什么。该方法返回用户输入的精确文本。要去除文本字段数据中任何多余的前导和尾空格，应对\
  \ `getText` 的返回值应用 `strip` 方法：\n\n```\nString text = textField.getText().strip();\n\
  ```\n\n要更改用户文本显示的字体，请使用 `setFont` 方法。\n\n### `javax.swing.JTextField` 1.2\n\n* `JTextField(int\
  \ columns)`\n    构造一个具有指定列数的空 `JTextField`。\n* `JTextField(String text, int columns)`\n\
  \    构造一个具有初始字符串和指定列数的新 `JTextField`。\n* `int getColumns()`\n* `void setColumns(int\
  \ columns)`\n    获取或设置此文本字段应使用的列数。\n\n#### `javax.swing.JComponent` 1.2\n\n* `void\
  \ revalidate()`\n    导致组件的位置和尺寸被重新计算。\n* `void setFont(Font f)`\n    设置此组件的字体。\n\
  \n### `java.awt.Component` 1.0\n\n* `void validate()`\n    重新计算组件的位置和尺寸。如果该组件是一个容器，则其内部组件的位置和尺寸也会重新计算。\n\
  * `Font getFont()`\n    获取此组件的字体。\n\n### 标签与标记组件\n\n标签（Labels）是持有文本的组件。它们没有装饰（例如没有边界）。它们也不会响应用户输入。你可以使用标签来标识组件。例如，与按钮不同，文本字段没有标签来标识它们。要标记一个本身不带标识符的组件：\n\
  \n1. 构造一个带有正确文本的 `JLabel` 组件。\n2. 将其放置在想要标识的组件足够近的位置，以便用户能够看到该标签标识的是正确的组件。\n\n`JLabel`\
  \ 的构造函数允许你指定初始文本或图标，以及可选的内容的对齐方式。使用来自 `SwingConstants` 接口的常量来指定对齐。该接口定义了一些有用的常量，如\
  \ `LEFT`、`RIGHT`、`CENTER`、`NORTH`、`EAST` 等。`JLabel` 类是实现此接口的多个 Swing 类之一。因此，你可以通过以下方式指定右对齐的标签：\n\
  \n```\nvar label = new JLabel(\"User name: \", SwingConstants.RIGHT);\n```\n\n或者\n\
  \n```\nvar label = new JLabel(\"User name: \", JLabel.RIGHT);\n```\n\n`setText`\
  \ 和 `setIcon` 方法允许你在运行时设置标签的文本和图标。\n\n你可以在按钮、标签和菜单项中使用纯文本和 HTML 文本。我不建议在按钮中使用 HTML——它会干扰外观效果（look-and-feel）。但在标签中使用\
  \ HTML 可以非常有效。只需将标签字符串封装在 `<html>. . .</html>` 中，如下：\n\n```\nlabel = new JLabel(\"\
  <html><b>Required</b> entry:</html>\");\n```\n\n注意，第一个带有 HTML 标签的组件可能需要一些时间显示，因为必须加载复杂的\
  \ HTML 渲染代码。\n\n标签可以与其他组件一样放置在容器中。这意味着你可以使用之前过的技术来放置标签。\n\n### `javax.swing.JLabel`\
  \ 1.2\n\n* `JLabel(String text)`\n* `JLabel(Icon icon)`\n* `JLabel(String text,\
  \ int align)`\n* `JLabel(String text, Icon icon, int align)`\n    构造标签。`align` 参数是\
  \ `SwingConstants` 常量之一：`LEFT`（默认）、`CENTER` 或 `RIGHT`。\n* `String getText()`\n*\
  \ `void setText(String text)`\n    获取或设置此标签的文本。\n* `Icon getIcon()`\n* `void setIcon(Icon\
  \ icon)`\n    获取或设置此标签的图标。\n\n### 密码字段\n\n密码字段是一种特殊的文本字段。为了防止旁观者看到密码，用户输入的字符实际上不会被显示。相反，每个输入的字符都由一个回显字符表示，如点（•）。Swing\
  \ 提供了一个 `JPasswordField` 类来实现这种文本字段。\n\n密码字段是模型-视图-控制器模式的另一个例子。密码字段使用与文本字段相同的模型来存储数据，但其视图已更改为显示所有回显字符。\n\
  \n### `javax.swing.JPasswordField` 1.2\n\n* `JPasswordField(String text, int columns)`\n\
  \    构造一个新的密码字段。\n* `void setEchoChar(char echo)`\n    设置此密码字段的回显字符。这是建议性的；特定的外观效果可能会坚持使用自己的回显字符。值\
  \ `0` 将回显字符重置为默认值。\n* `char[] getPassword()`\n    返回此密码字段包含的文本。为了更高的安全，你应该在使用后覆盖返回数组的内容。（密码不以\
  \ `String` 形式返回，因为字符串将留在虚拟机中直到被垃圾回收。）\n\n### 文本区域\n\n有时，你需要收集超过一行的用户输入。如之前提到的，你可以使用\
  \ `JTextArea` 组件来实现。当你程序中放置一个文本区域组件时，用户可以输入任意数量行的文本，使用回车键将它们分开。每行以 `'\\n'` 结尾（即使在\
  \ Windows 上也是如此）。图 11.11 显示了文本区域的工作情况。\n\n![Figure](img/textcomponenttest.jpg)文本组件\n\
  \n\n\n\n在 `JTextArea` 组件的构造函数中，指定文本区域的行数和列数。例如\n\n```\ntextArea = new JTextArea(8,\
  \ 40); // 8 行，每行 40 列\n```\n\n其中 `columns` 参数的作用与之前相同——为了安全起见，你仍然需要额外添加几列。同样，与之前一样，用户不受行数和列数的限制；当用户输入内容过多时，文本会自动滚动。你还可以使用\
  \ `setColumns` 方法更改列数，使用 `setRows` 方法更改行数。这些数字仅表示首选大小——布局管理器仍然可以放大或缩小文本区域。\n\n如果文本多于文本区域可以显示的内容，剩余文本将会被裁剪。你可以通过开启自动换行（line\
  \ wrapping）来避免长行被裁剪：\n\n```\ntextArea.setLineWrap(true); // 长行将换行\n```\n\n这种换行仅是视觉效果；文档中的文本不会改变——不会在文本中自动插入\
  \ `'\\n'` 字符。\n\n### 滚动面板 (Scroll Panes)\n\n在 Swing 中，文本区域没有滚动条。如果你需要滚动条，必须将文本区域放置在`滚动面板（scroll\
  \ pane）` 中。\n\n```\ntextArea = new JTextArea(8, 40);\nvar scrollPane = new JScrollPane(textArea);\n\
  ```\n\n滚动面板现在管理文本区域的视图。如果文本多于文本区域可以显示的内容，滚动条会自动出现；如果文本被删除且剩余文本适合区域内，滚动条将再次消失。滚动由滚动面板内部处理——你的程序不需要处理滚动事件。\n\
  \n这是一个适用于任何组件的通用机制，而不只是文本区域。要为组件添加滚动条，请将其放入滚动面板中。\n\n列表 11.1 展示了各种文本组件。该程序显示了一个文本字段、一个密码字段和一个带滚动条的文本区域。文本字段和密码字段均有标签。点击“插入（Insert）”将字段内容插入到文本区域中。\n\
  \n`JTextArea` 组件仅显示纯文本，不带特殊字体或格式。要显示格式化文本（如 HTML），可以使用第 12 章中讨论的 `JEditorPane` 类。\n\
  \ntext/TextComponentFrame.java\n\n```java\npackage text;\n\nimport java.awt.BorderLayout;\n\
  import java.awt.GridLayout;\n\nimport javax.swing.JButton;\nimport javax.swing.JFrame;\n\
  import javax.swing.JLabel;\nimport javax.swing.JPanel;\nimport javax.swing.JPasswordField;\n\
  import javax.swing.JScrollPane;\nimport javax.swing.JTextArea;\nimport javax.swing.JTextField;\n\
  import javax.swing.SwingConstants;\n\n/**\n * 一个带有示例文本组件的框架。\n */\npublic class\
  \ TextComponentFrame extends JFrame\n{\n   private static final int TEXTAREA_ROWS\
  \ = 8;\n   private static final int TEXTAREA_COLUMNS = 20;\n\n   public TextComponentFrame()\n\
  \   {\n      var textField = new JTextField();\n      var passwordField = new JPasswordField();\n\
  \n      var northPanel = new JPanel();\n      northPanel.setLayout(new GridLayout(2,\
  \ 2));\n      northPanel.add(new JLabel(\"User name: \", SwingConstants.RIGHT));\n\
  \      northPanel.add(textField);\n      northPanel.add(new JLabel(\"Password: \"\
  , SwingConstants.RIGHT));\n      northPanel.add(passwordField);\n\n      add(northPanel,\
  \ BorderLayout.NORTH);\n\n      var textArea = new JTextArea(TEXTAREA_ROWS, TEXTAREA_COLUMNS);\n\
  \      var scrollPane = new JScrollPane(textArea);\n\n      add(scrollPane, BorderLayout.CENTER);\n\
  \n      // 添加按钮将文本追加到文本区域\n\n      var southPanel = new JPanel();\n\n      var insertButton\
  \ = new JButton(\"Insert\");\n      southPanel.add(insertButton);\n      insertButton.addActionListener(event\
  \ ->\n         textArea.append(\"User name: \" + textField.getText() + \" Password:\
  \ \"\n            + new String(passwordField.getPassword()) + \"\\n\"));\n\n   \
  \   add(southPanel, BorderLayout.SOUTH);\n      pack();\n   }\n}\n```\n\n`javax.swing.JTextArea`\
  \ 1.2\n\n*   `JTextArea()`\n\n*   `JTextArea(int rows, int columns)`\n\n*   `JTextArea(String\
  \ text, int rows, int columns)`\n    构造一个新的文本区域。\n\n*   `void setColumns(int columns)`\n\
  \    告诉文本区域它应该使用的首选列数。\n\n*   `void setRows(int rows)`\n    告诉文本区域它应该使用的首选行数。\n\n\
  *   `void append(String newText)`\n    将给定文本追加到文本区域现有文本的末尾。\n\n*   `void setLineWrap(boolean\
  \ wrap)`\n    开启或关闭自动换行。\n\n*   `void setWrapStyleWord(boolean word)`\n    如果 `word`\
  \ 为 `true`，则长行在单词边界换行。如果为 `false`，则长行在不考虑单词边界的情况下被折断。\n\n*   `void setTabSize(int\
  \ c)`\n    设置每 `c` 列一个制表位。注意，制表符不会被转换为空格，而是导致与下一个制表位对齐。\n\n`javax.swing.JScrollPane`\
  \ 1.2\n\n*   `JScrollPane(Component c)`\n    创建一个显示指定组件内容的滚动面板。当组件大于视图时，会提供滚动条。\n\
  \n## 选择组件 (Choice Components)\n\n你现在已经了解了如何收集输入，但在很多情况下，你更倾向于给用户提供一组有限的选项，而不是让他们输入数据。在本节中，你将学习如何编写复选框、单选按钮、列表和滑块。\n\
  \n### 复选框 (Checkboxes)\n\n如果你只想收集“是”或“否”输入，请使用复选框组件。复选框自动带有标识其自身的标签。用户可以通过点击内部来勾选框，通过再次点击内部来取消勾选。当焦点在复选框上时，按下空格键也可以切换勾选状态。\n\
  \n图 11.12 显示了一个带有两个复选框的简单程序，一个用于开启或关闭字体的*斜体*属性，另一个用于加粗。注意第二个复选框拥有焦点，如标签周围的矩形所示。用户每点击其中一个复选框，屏幕就会使用新字体进行刷新。\n\
  \n![图](img/checkboest.jpg)复选框\n\n复选框旁边需要一个标签来用以识别其用途。在构造函数中提供标签文本：\n\n```java\n\
  bold = new JCheckBox(\"Bold\");\n```\n\n使用 `setSelected` 方法开启或关闭复选框。例如：\n\n```java\n\
  bold.setSelected(true);\n```\n\n然后使用 `isSelected` 方法获取每个复选框当前的状态。未勾选时为 `false`，勾选时为\
  \ `true`。\n\n当用户点击复选框时，会触发动作事件。按照惯，为复选框附加一个监听器。在我们的程序中，两个复选框共享同一个监听器。\n\n```java\n\
  ActionListener listener = . . .;\nbold.addActionListener(listener);\nitalic.addActionListener(listener);\n\
  ```\n\n监听器查询 `bold` 和 `italic` 复选框的状态，并将面板字体设置为普通、加粗、斜体或同时加粗和斜体。\n\n```java\nActionListener\
  \ listener = event ->\n   {\n      int mode = 0;\n      if (bold.isSelected()) mode\
  \ += Font.BOLD;\n      if (italic.isSelected()) mode += Font.ITALIC;\n      label.setFont(new\
  \ Font(Font.SERIF, mode, FONTSIZE));\n   };\n```\n\n列表 11.2 是复选框示例的程序列表。\n\ncheckBox/CheckBoxFrame.java\n\
  \n\n\n\n```java\npackage checkBox;\n\nimport java.awt.*;\nimport java.awt.event.*;\n\
  import javax.swing.*;\n\n/**\n * 一个包含示例文本标签和用于选择字体\n * 属性的复选框框\n */\npublic class\
  \ CheckBoxFrame extends JFrame\n{\n   private JLabel label;\n   private JCheckBox\
  \ bold;\n   private JCheckBox italic;\n   private static final int FONTSIZE = 24;\n\
  \n   public CheckBoxFrame()\n   {\n      // 添加示例文本标签\n\n      label = new JLabel(\"\
  The quick brown fox jumps over the lazy dog.\");\n      label.setFont(new Font(\"\
  Serif\", Font.BOLD, FONTSIZE));\n      add(label, BorderLayout.CENTER);\n\n    \
  \  // 此监听器根据复选框的状态\n      // 设置标签的字体属性\n\n      ActionListener listener = event\
  \ ->\n         {\n            int mode = 0;\n            if (bold.isSelected())\
  \ mode += Font.BOLD;\n            if (italic.isSelected()) mode += Font.ITALIC;\n\
  \            label.setFont(new Font(\"Serif\", mode, FONTSIZE));\n         };\n\n\
  \      // 添加复选框\n      var buttonPanel = new JPanel();\n\n      bold = new JCheckBox(\"\
  Bold\");\n      bold.addActionListener(listener);\n      bold.setSelected(true);\n\
  \      buttonPanel.add(bold);\n\n      italic = new JCheckBox(\"Italic\");\n   \
  \   italic.addActionListener(listener);\n      buttonPanel.add(italic);\n\n    \
  \  add(buttonPanel, BorderLayout.SOUTH);\n      pack();\n   }\n}\n```\n\n`javax.swing.JCheckBox`\
  \ 1.2\n\n*   `JCheckBox(String label)`\n\n*   `JCheckBox(String label, Icon icon)`\n\
  \n    构造一个初始为未选中的复选框。\n\n*   `JCheckBox(String label, boolean state)`\n\n    构造一个给定标签和初始状态的复选框。\n\
  \n*   `boolean isSelected()`\n\n*   `void setSelected(boolean state)`\n\n    获取或设置复选框的选中状态。\n\
  \n## 单选按钮\n\n在在上一个示例中，用户可以选中两个复选框中的一个、两个或都不选。在许多情况下，我们希望用户只勾选多个框中的一个。当另一个框被选中时，之前的框会自动取消选中。这样一组框通常被称为单选按钮组（radio\
  \ button group），因为这些按钮就像收音机上的电台选择按钮一样。图 11.13 显示了一个典型的示例。我们允许用户从备选项（小、中、大或特大）中选择字体大小——但当然，我们允许一次只选择一种大小。\n\
  \n![Figure](img/radiobuttontest.jpg)单选按钮组\n\n在 Swing 中实现单选按钮组非常简单。你为每组按钮构造一个 `ButtonGroup`\
  \ 类型的对象。然后，将 `JRadioButton` 类型的对象添加到按钮组中。按钮组对象负责在点击新按钮时关闭之前设置的按钮。\n\n```\nvar group\
  \ = new ButtonGroup();\n\nvar smallButton = new JRadioButton(\"Small\", false);\n\
  group.add(smallButton);\n\nvar mediumButton = new JRadioButton(\"Medium\", true);\n\
  group.add(mediumButton);\n. . .\n```\n\n构造函数的第二个参数对于应初始被选中的按钮为 `true`，而对所有所有按钮为\
  \ `false`。请注意，按钮组只控制按钮的*行为*；如果你想为了布局目的对按钮分组，你还需要将它们添加到容器中，例如 `JPanel`。\n\n如果你再次查看\
  \ 图 11.12，你会注意到单选按钮的外观与 图 11.13 中的复选框不同。复选框是正方形的，选中时包含一个标记。单选按钮是圆形的，选中时包含一个圆点。\n\
  \n单选按钮的事件通知机制与其他任何按钮相同。当用户选中单选按钮时，该按钮产生一个动作事件。在我们的示例程序中，我们定义了一个监听器将字体大小设置为特定的值：\n\
  \n```\nActionListener listener = event -> \n   label.setFont(new Font(\"Serif\"\
  , Font.PLAIN, size));\n```\n\n将此监听器设置与复选框示例进行比较。每个单选按钮都有一个不同的监听器对象。每个监听器对象确切需要做什么——将字体大小设置为特定的值。对于复选框，我们使用了不同的方法：两个复选框使用同一个动作监听器，该监听器调用一个方法查看两个复选框的当前状态。\n\
  \n我们可以在这里采用相同的方法吗？我们可以有一个单一监听器按如下方式计算大小：\n\n```\nif (smallButton.isSelected()) size\
  \ = 8;\nelse if (mediumButton.isSelected()) size = 12;\n. . .\n```\n\n然而，我们倾向于使用单独的动作监听器对象，因为它们将大小值与按钮结合得更好。\n\
  \n如果你有一组单选按钮，你知道其中只有一个是被选中的。如果能够快速找到是哪一个，而不需要查询组中的所有按钮，那就太好了。`ButtonGroup` 对象控制所有按钮，如果这个对象能为我们提供选中按钮的引用，将非常方便。事实上，`ButtonGroup`\
  \ 类有一个 `getSelection` 方法，但该方法并不返回被选中的单选按钮。相反，它返回一个与其绑定的 `ButtonModel` 引用。\n\n\n\n\
  \n返回所选按钮的模型。\n\n`javax.swing.ButtonModel` 1.2\n\n* `String getActionCommand()`\n\
  \  返回此按钮模型的动作命令。\n\n`javax.swing.AbstractButton` 1.2\n\n* `void setActionCommand(String\
  \ s)`\n  设置此按钮及其模型的动作命令。\n\n### 边框\n\n如果你在窗口中有多组单选按钮，你可能希望在视觉上指示哪些按钮是分组的。Swing 提供了一组实用的\
  \ `borders` 来实现此目的。你可以对任何扩展 `JComponent` 的组件应用边框。最常见的用法是在面板周围放置边框，并在面板中填充其他用户界面元素，例如单选按钮。\n\
  \n你可以选择许多边框，但对所有边框你都需要遵循相同的步骤。\n\n1. 调用 `BorderFactory` 的静态方法来创建边框。你可以从以下样式中选择（参见图\
  \ 11.14）：\n\n    * 凹斜角 (Lowered bevel)\n    * 凸起斜角 (Raised bevel)\n    * 刻蚀 (Etched)\n\
  \    * 线条 (Line)\n    * 哑光 (Matte)\n    * 空白（仅在组件周围留出一些空白）\n      ![Figure](img/bordertest.jpg)测试边框类型\n\
  \n2. 如果需要，可以通过将边框传递给 `BorderFactory.createTitledBorder` 为你的边框添加标题。\n\n3. 如果你真的想做得到位，可以通过调用\
  \ `BorderFactory.createCompoundBorder` 将多个边框组合。\n\n4. 通过调用 `JComponent` 类的 `setBorder`\
  \ 方法将生成的边框添加到你的组件中。\n\n例如，以下是如何向面板添加带有标题的刻蚀边框的：\n\n```\nBorder etched = BorderFactory.createEtchedBorder();\n\
  Border titled = BorderFactory.createTitledBorder(etched, \"A Title\");\npanel.setBorder(titled);\n\
  ```\n\n不同的边框具有设置边框宽度和颜色的不同选项；详情见 API 注释。真正的边框爱好者会发现，还有一个 `SoftBevelBorder` 类用于具有软圆角的斜角边框，并且\
  \ `LineBorder` 也可以具有圆角。你只能通过使用其中一个类的构造函数来构建这些边框——没有为它们对应的 `BorderFactory` 方法。\n\n\
  `javax.swing.BorderFactory` 1.2\n\n* `static Border createLineBorder(Color color)`\n\
  * `static Border createLineBorder(Color color, int thickness)`\n  创建一个简单的线边框。\n\
  * `static MatteBorder createMatteBorder(int top, int left, int bottom, int right,\
  \ Color color)`\n* `static MatteBorder createMatteBorder(int top, int left, int\
  \ bottom, int right, Icon tileIcon)`\n  创建一个填充颜色或重复图标的厚边框。\n* `static Border createEmptyBorder()`\n\
  * `static Border createEmptyBorder(int top, int left, int bottom, int right)`\n\
  \  创建一个空边框。\n* `static Border createEtchedBorder()`\n* `static Border createEtchedBorder(Color\
  \ highlight, Color shadow)`\n* `static Border createEtchedBorder(int type)`\n* `static\
  \ Border createEtchedBorder(int type, Color highlight, Color shadow)`\n  创建一个具有\
  \ 3D 效果的线边框。`type` 参数是 `EtchedBorder.RAISED` 或 `EtchedBorder.LOWERED` 之一。\n* `static\
  \ Border createBevelBorder(int type)`\n* `static Border createBevelBorder(int type,\
  \ Color highlight, Color shadow)`\n* `static Border createLoweredBevelBorder()`\n\
  * `static Border createRaisedBevelBorder()`\n  创建一个具有凹陷或凸起表面效果的边框。`type` 参数是 `BevelBorder.RAISED`\
  \ 或 `BevelBorder.LOWERED` 之一。\n* `static TitledBorder createTitledBorder(String\
  \ title)`\n* `static TitledBorder createTitledBorder(Border border)`\n* `static\
  \ TitledBorder createTitledBorder(Border border, String title)`\n* `static TitledBorder\
  \ createTitledBorder(Border border, String title, int justification, int position)`\n\
  * `static TitledBorder createTitledBorder(Border border, String title, int justification,\
  \ int position, Font font)`\n* `static TitledBorder createTitledBorder(Border border,\
  \ String title, int justification, int position, Font font, Color color)`\n  创建一个带有指定属性的标题边框。`justification`\
  \ 参数是 `TitledBorder` 常量 `LEFT`、`CENTER`、`RIGHT`、`LEADING`、`TRAILING` 或 `DEFAULT_JUSTIFICATION`（左）之一，而\
  \ `position` 是 `ABOVE_TOP`、`TOP`、`BELOW_TOP`、`ABOVE_BOTTOM`、`BOTTOM`、`BELOW_BOTTOM`\
  \ 或 `DEFAULT_POSITION`（顶）之一。\n* `static CompoundBorder createCompoundBorder(Border\
  \ outsideBorder, Border insideBorder)`\n  将两个边框组合为一个新边框。\n\n`javax.swing.border.SoftBevelBorder`\
  \ 1.2\n\n* `SoftBevelBorder(int type)`\n* `SoftBevelBorder(int type, Color highlight,\
  \ Color shadow)`\n  创建一个具有软圆角的斜角边框。`type` 参数是 `SoftBevelBorder.RAISED` 或 `SoftBevelBorder.LOWERED`\
  \ 之一。\n\n`javax.swing.border.LineBorder` 1.2\n\n* `public LineBorder(Color color,\
  \ int thickness, boolean roundedCorners)`\n  使用给定颜色和厚度创建一个线边框。如果 `roundedCorners`\
  \ 为 true，则它具有圆角。\n\n`javax.swing.JComponent` 1.2\n\n* `void setBorder(Border border)`\n\
  \  设置此组件的边框。\n\n### 组合框 (Combo Boxes)\n\n如果你有许多备选项，单选按钮不是很好的选择，因为它们占用了太多空间。相反，可以使用组合框——它将文本字段的活性与一组预定义的选项结合。\n\
  \n`javax.swing.JComboBox` 1.2\n\n* `public JComboBox()`\n  创建一个空组合框。\n* `public\
  \ JComboBox(Object[] items)`\n  创建一个带有指定数组的组合框。\n* `public JComboBox(Vector items)`\n\
  \  创建一个带有指定 vector 的组合框。\n* `public void addItem(Object item)`\n  向列表添加添加项。在我们的程序中，`addItem`\
  \ 只在构造函数中调用，但你可以随时调用它。\n\n```\nvar faceCombo = new JComboBox<String>();\nfaceCombo.addItem(\"\
  Serif\");\nfaceCombo.addItem(\"SansSerif\");\n```\n\n此方法将字符串添加到列表末尾。你可以通过 `insertItemAt`\
  \ 方法在列表的任何位置添加新项：\n\n```java\nfaceCombo.insertItemAt(\"Monospaced\", 0); // 在开头添加\n\
  ```\n\n你可以添加任何类型的项——组合框调用每个项的 `toString` 方法来显示它。\n\n如果你需要在运行时删除项，使用 `removeItem`\
  \ 或 `removeItemAt` 方法，取决于你提供要删除的项还是位置。\n\n```java\nfaceCombo.removeItem(\"Monospaced\"\
  );\nfaceCombo.removeItemAt(0); // 删除第一个项\n```\n\n`removeAllItems` 方法一次性移除所有项。\n\n\
  如果你需要向组合框添加大量项，`addItem` 方法性能会很差。相反，构造一个 `DefaultComboBoxModel`，通过 `addElement`\
  \ 填充它，然后调用 `JComboBox` 类的 `setModel` 方法。\n\n\n\n\n当用户从组合框中选择一个项时，组合框会产生一个动作事件。要确定选择了哪个项，请在事件参数上调用\
  \ `getSource` 以获取发送事件的组合框引用。然后，调用 `getSelectedItem` 方法检索当前选中的项。你需要将返回的值转换为适当类型，通常是\
  \ `String`。\n\n```java\nActionListener listener = event -> \n   label.setFont(new\
  \ Font(\n      faceCombo.getItemAt(faceCombo.getSelectedIndex()),\n      Font.PLAIN,\n\
  \      DEFAULT_SIZE));\n```\n\nListing 11.4 显示了完整的程序。\n\ncomboBox/ComboBoxFrame.java\n\
  \n```java\npackage comboBox;\n\nimport java.awt.BorderLayout;\nimport java.awt.Font;\n\
  \nimport javax.swing.JComboBox;\nimport javax.swing.JFrame;\nimport javax.swing.JLabel;\n\
  import javax.swing.JPanel;\n\n/**\n * 一个带有示例文本标签和用于选择字体的组合框的框架。\n */\npublic class\
  \ ComboBoxFrame extends JFrame\n{\n   private JComboBox<String> faceCombo;\n   private\
  \ JLabel label;\n   private static final int DEFAULT_SIZE = 24;\n\n   public ComboBoxFrame()\n\
  \   {\n      // 添加示例文本标签\n\n      label = new JLabel(\"The quick brown fox jumps\
  \ over the lazy dog.\");\n      label.setFont(new Font(\"Serif\", Font.PLAIN, DEFAULT_SIZE));\n\
  \      add(label, BorderLayout.CENTER);\n\n      // 创建一个组合框并添加字体名称\n\n      faceCombo\
  \ = new JComboBox<>();\n      faceCombo.addItem(\"Serif\");\n      faceCombo.addItem(\"\
  SansSerif\");\n      faceCombo.addItem(\"Monospaced\");\n      faceCombo.addItem(\"\
  Dialog\");\n      faceCombo.addItem(\"DialogInput\");\n\n      // 组合框监听器将标签字体更改为选定的字体名称\n\
  \n      faceCombo.addActionListener(event ->\n         label.setFont(\n        \
  \    new Font(faceCombo.getItemAt(faceCombo.getSelectedIndex()), \n            \
  \   Font.PLAIN, DEFAULT_SIZE)));\n\n      // 将组合添加到框架南边界的面板中\n\n      var comboPanel\
  \ = new JPanel();\n      comboPanel.add(faceCombo);\n      add(comboPanel, BorderLayout.SOUTH);\n\
  \      pack();\n   }\n}\n```\n\n`javax.swing.JComboBox` 1.2\n\n*   `boolean isEditable()`\n\
  *   `void setEditable(boolean b)`\n    获取或设置此组合框的 `editable` 属性。\n*   `void addItem(Object\
  \ item)`\n    向项列表添加一个项。\n*   `void insertItemAt(Object item, int index)`\n    在指定的索引处向项列表插入一个项。\n\
  *   `void removeItem(Object item)`\n    从项列表中移除一个项。\n*   `void removeItemAt(int\
  \ index)`\n    移除索引处的项。\n*   `void removeAllItems()`\n    从项列表中移除所有项。\n*   `Object\
  \ getSelectedItem()`\n    返回当前选中的项。\n\n### 滑块 (Sliders)\n\n组合框允许用户从一组离散的值中进行选择。滑块提供了从连续数值中选择——例如，1\
  \ 到 100 之间的任何数字。\n\n构建滑块最常见方式如下：\n\n```java\nvar slider = new JSlider(min, max,\
  \ initialValue);\n```\n\n如果你省略了最小值、最大值和初始值，它们将分别初始化为 `0`、`100` 和 `50`。\n\n或者如果你想让滑块变为垂直，请使用以下构造函数调用：\n\
  \n```java\nvar slider = new JSlider(SwingConstants.VERTICAL, min, max, initialValue);\n\
  ```\n\n这些构造函数创建普通的滑块，例如图 11.16 顶部的滑块。你现在将看到如何为滑块添加装饰。\n\n![Figure](img/slidertest.jpg)滑块\n\
  \n当用户滑动滑块条时，滑块的 `value` 在最小值和最大值之间移动。当值发生变化时，`ChangeEvent` 会发送给所有更改监听器。要通知更改，请调用\
  \ `addChangeListener` 方法并安装一个实现 `ChangeListener` 功能接口的对象。在回调中，获取滑块值：\n\n```java\n\
  ChangeListener listener = event ->\n   {\n      JSlider slider = (JSlider) event.getSource();\n\
  \      int value = slider.getValue();\n      . . .\n   };\n```\n\n你可以通过显示 `ticks`（刻度）来装饰滑块。例如，在示例程序中，第二个滑块使用了以下设置：\n\
  \n```java\nslider.setMajorTickSpacing(20);\nslider.setMinorTickSpacing(5);\n```\n\
  \n滑块每隔 20 个单位有一个大刻度线，每隔 5 个单位有一个小刻度线。单位指的是滑块的值，而不是像素。\n\n这些指令仅设置了刻度的单位。要让刻度线实际出现，请调用\n\
  \n```java\nslider.setPaintTicks(true);\n```\n\n主刻度和小刻度是相互独立的。例如，你可以设置每隔 20 个单位一个主刻度，每隔\
  \ 7 个单位一个小刻度，但这将给你一个非常混乱的刻度。\n\n你可以强制滑块“吸附到刻度”（snap to ticks)。当用户在吸附模式下完成拖动滑块时，它立即移动到最近的刻度。你通过调用激活此模式：\n\
  \n```java\nslider.setSnapToTicks(true);\n```\n\n“吸附到刻度”的行为并不如你想象的那样完美。在滑块实际吸附之前，更改监听器报告的值与刻度并不对应。而且如果你点击滑块旁边——这种操作通常会推进滑块——带有“吸附到刻度”的滑块不会移动到下一个刻度。\n\
  \n你可以通过调用以下方法显示主刻度的 `刻度标签`：\n\n```java\nslider.setPaintLabels(true);\n```\n\n例如，对于一个范围从\
  \ 0 到 100 主刻度间距为 20 的滑块，刻度标记为 0、20、40、60、80 和 100。\n\n你还可以提供其他刻度标签，例如字符串或图标（见图 11.16）。这个过程有点复杂。你需要填充一个键为\
  \ `Integer` 值为 `Component` 的哈希表。然后调用 `setLabelTable` 方法。组件被放置在刻度下方。通常使用 `JLabel`\
  \ 对象。这里是如何标记为 A、B、C、D、E 和 F：\n\n```java\nvar labelTable = new Hashtable<Integer,\
  \ Component>();\nlabelTable.put(0, new JLabel(\"A\"));\nlabelTable.put(20, new JLabel(\"\
  B\"));\n. . .\nlabelTable.put(100, new JLabel(\"F\"));\nslider.setLabelTable(labelTable);\n\
  ```\n\nListing 11.5 还显示了一个带有图标刻度标签的滑块。\n\n如果你的刻度标签没有显示，请双检是否调用了 `setPaintTicks(true)`\
  \ 和 `setPaintLabels(true)`。\n\n图 11.16 中的第四个滑块没有轨道。要抑制滑块移动的“轨道”，调用\n\n```java\n\
  slider.setPaintTrack(false);\n```\n\n第五个滑块通过调用以下方法反转方向：\n\n```java\nslider.setInverted(true);\n\
  ```\n\nListing 11.5 中的示例程序通过一组滑块展示了所有视觉效果。每个滑块都安装了一个更改事件监听器，将当前滑块值放入框架底部的文本字段中。\n\
