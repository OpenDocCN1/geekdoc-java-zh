  \ columnIndex)`\n\n    获取该列值的类类型。此信息用于排序和渲染。\n\n`javax.swing.JTable` 1.2\n\n*  \
  \ `TableColumnModel getColumnModel()`\n\n    获取描述表格列排列列模型。\n\n*   `void setAutoResizeMode(int\
  \ mode)`\n\n    设置表格列自动调整大小的模式。`mode` 参数为 `AUTO_RESIZE_OFF`、`AUTO_RESIZE_NEXT_COLUMN`、`AUTO_RESIZE_SUBSEQUENT_COLUMNS`、`AUTO_RESIZE_LAST_COLUMN`\
  \ 和 `AUTO_RESIZE_ALL_COLUMNS` 之一。\n\n*   `int getRowMargin()`\n\n*   `void setRowMargin(int\
  \ margin)`\n\n    获取或设置相邻行单元之间的空隙。\n\n*   `int getRowHeight()`\n\n*   `void setRowHeight(int\
  \ height)`\n\n    获取或设置表格所有行的默认高度。\n\n\n\n\n\n## 单元格的渲染与编辑\n\n正如你在第 12.2 节所示，列类型决定了单元格的渲染方式。`Boolean`\
  \ 和 `Icon` 类型有默认渲染器，用于渲染复选框或图标。对于所有其他类型，你需要安装自定义的渲染器。\n\n### 渲染单元格\n\n表格单元格渲染器与你之前看到的列表渲染器类似。它们实现了\
  \ `TableCellRenderer` 接口，该接口包含一个单一方法：\n\n```\nComponent getTableCellComponent(JTable\
  \ table, Object value,\n      isSelected, boolean hasFocus, int row, int column)\n\
  ```\n\n当表格需要绘制单元格时会调用该方法。你返回一个组件，随后其 `paint` 方法将被调用以填充单元格区域。\n\n图 12.8 中的表格包含 `Color`\
  \ 类型的单元格。渲染器简单地返回一个面板，其背景颜色为单元格中存储的颜色。该颜色作为 `value` 参数传递。\n\n```\nclass ColorTableCellRenderer\
  \ extends JPanel implements TableCellRenderer\n{\n   public Component getTableCellComponent(JTable\
  \ table, Object value,\n         boolean isSelected, boolean hasFocus, int row,\
  \ int column)\n   {\n      setBackground((Color) value);\n      if (hasFocus)\n\
  \         setBorder(UIManager.getBorder(\"Table.focusCellBorder\"));\n      else\n\
  \         setBorder(null);\n   return this;\n   }\n}\n```\n\n![Figure](img/fig06-12.jpg)一个带有单元格渲染器的表格\n\
  \n如你所见，当单元格获得焦点时，渲染器会绘制边框。（我们向 `UIManager` 请求正确的边框。为了找到查找键，我们查阅了 `DefaultTableCellRenderer`\
  \ 类的源代码。）\n\n如果你的渲染器仅仅绘制文本字符串或图标，你可以扩展 `DefaultTableCellRenderer` 类。它会为你处理焦点和选中状态的渲染。你需要告诉表格对所有\
  \ `Color` 类型的对象使用此渲染器。`JTable` 类的 `setDefaultRenderer` 方法允许你建立这种关联。提供一个 `Class`\
  \ 对象和该渲染器：\n\n```\ntable.setDefaultRenderer(Color.class, new ColorTableCellRenderer());\n\
  ```\n\n该渲染器现在将用于此表格中所有给定类型的对象。\n\n如果你想根据其他标准选择渲染器，你需要派生 `JTable` 类并重写 `getCellRenderer`\
  \ 方法。\n\n### 渲染表头\n\n要在表头中显示图标，请设置表头值：\n\n---\n\n## API 参考\n\n* `int getRowHeight(int\
  \ row)`\n* `void setRowHeight(int row, int height)`\n  获取或设置表格指定行的高度。\n* `ListSelectionModel\
  \ getSelectionModel()`\n  返回列表选择模型。你需要该模型在行、列选择和单元格选择之间进行切换。\n* `boolean getRowSelectionAllowed()`\n\
  * `void setRowSelectionAllowed(boolean b)`\n  获取或设置 `rowSelectionAllowed` 属性。如果为\
  \ `true`，当用户点击单元格时，将选中行。\n* `boolean getColumnSelectionAllowed()`\n* `void setColumnSelectionAllowed(boolean\
  \ b)`\n  获取或设置 `columnSelectionAllowed` 属性。如果为 `true`，当用户点击单元格时，将选中列。\n* `boolean\
  \ getCellSelectionEnabled()`\n  如果 `rowSelectionAllowed` 和 `columnSelectionAllowed`\
  \ 均为 `true`，则返回 `true`。\n* `void setCellSelectionEnabled(boolean b)`\n  将 `rowSelectionAllowed`\
  \ 和 `columnSelectionAllowed` 都设置为 `b`。\n* `void addColumn(TableColumn column)`\n\
  \  将列作为表格视图的最后一列添加。\n* `void moveColumn(int from, int to)`\n  移动表格索引为 `from` 的列，使其索引变为\
  \ `to`。仅影响视图。\n* `void removeColumn(TableColumn column)`\n  从视图中移除指定的列。\n* `int\
  \ convertRowIndexToModel(int index)` 6\n* `int convertColumnIndexToModel(int index)`\n\
  \  返回具有给定索引的行或列的模型索引。当行被排序或过滤，或者当列被移动或删除时，此值与 `index` 不同。\n* `void setRowSorter(RowSorter<?\
  \ extends TableModel> sorter)`\n  设置行排序器。\n\n### javax.swing.table.TableColumnModel\
  \ 1.2\n* `TableColumn getColumn(int index)`\n  获取描述给定视图索引列的表格列对象。\n\n### javax.swing.table.TableColumn\
  \ 1.2\n* `TableColumn(int modelColumnIndex)`\n  为查看给定索引的模型列构造一个表格列。\n* `void setPreferredWidth(int\
  \ width)`\n* `void setMinWidth(int width)`\n* `void setMaxWidth(int width)`\n  将此表格列的首选宽度、最小和最大宽度设置为\
  \ `width`。\n* `void setWidth(int width)`\n  将此列的实际宽度设置为 `width`。\n* `void setResizable(boolean\
  \ b)`\n  如果 `b` 为 `true`，则该列是可以调整大小的。\n\n### javax.swing.ListSelectionModel 1.2\n\
  * `void setSelectionMode(int mode)`\n  将选择模式设置为 `SINGLE_SELECTION`、`SINGLE_INTERVAL_SELECTION`\
  \ 和 `MULTIPLE_INTERVAL_SELECTION` 之一。\n\n### javax.swing.DefaultRowSorter<M, I>\
  \ 6\n* `void setComparator(int column, Comparator<?> comparator)`\n  设置用于给定列的比较器。\n\
  * `void setSortable(int column, boolean enabled)`\n  启用或禁用给定列的排序。\n* `void setRowFilter(RowFilter<?\
  \ super M,? super I> filter)`\n  设置行筛选器。\n\n### javax.swing.table.TableRowSorter<M\
  \ extends TableModel> 6\n* `void setStringConverter(TableStringConverter stringConverter)`\n\
  \  设置用于排序和过滤的字符串转换器。\n\n### javax.swing.table.TableStringConverter 6\n* `abstract\
  \ String toString(TableModel model, int row, int column)`\n  将给定位置的模型值转换为字符串；你可以重写此方法。\n\
  \n### javax.swing.RowFilter<M, I> 6\n* `boolean include(RowFilter.Entry<? extends\
  \ M,? extends I> entry)`\n  指定要保留的行；你可以重写此方法。\n* `static <M,I> RowFilter<M,I> numberFilter(RowFilter.ComparisonType\
  \ type, Number number, int... indices)`\n* `static <M,I> RowFilter<M,I> dateFilter(RowFilter.ComparisonType\
  \ type, Date date, int... indices)`\n  返回一个过滤器，该过滤器包含包含与给定数字或日期匹配的值的行。比较类型为 `EQUAL`、`NOT_EQUAL`、`AFTER`\
  \ 或 `BEFORE` 之一。如果给定了列模型索引，则只搜索这些列；否则搜索所有列。对于数字过滤器，单元格值的类必须与 `number` 的类匹配。\n* `static\
  \ <M,I> RowFilter<M,I> regexFilter(String regex, int... indices)`\n  返回一个过滤器，该过滤器包含具有匹配给定正则表达式字符串值的行。如果给定了列模型索引，则只搜索这些列；否则搜索所有列。注意，匹配的是\
  \ `RowFilter.Entry` 的 `getStringValue` 方法返回的字符串。\n* `static <M,I> RowFilter<M,I>\
  \ andFilter(Iterable<? extends RowFilter<? super M,? super I>> filters)`\n* `static\
  \ <M,I> RowFilter<M,I> orFilter(Iterable<? extends RowFilter<? super M,? super I>>\
  \ filters)`\n  返回一个包含所有过滤器包含的条目或至少一个过滤器条目的过滤器。\n* `static <M,I> RowFilter<M,I> notFilter(RowFilter<?\
  \ super M,? super I> filter)`\n  返回一个包含不匹配给定过滤器的条目的过滤器。\n\n### javax.swing.RowFilter.Entry<?\
  \ extends M,? extends I> 6\n* `I getIdentifier()`\n  返回此条目的标识符。\n* `M getModel()`\n\
  \  返回此条目的模型。\n* `Object getValue(int index)`\n  返回给定索引处的值。\n* `int getValueCount()`\n\
  \  返回值的数量。\n* `String getStringValue(int index)`\n  返回给定索引处值的字符串表示。\n\n\n\n\n\n\
  ```\nmoonColumn.setHeaderValue(new ImageIcon(\"Moons.gif\"));\n```\n\n然而，表格头并不足够智能，无法为表头值选择合适的渲染器。你必须手动安装渲染器。例如，要在列头中显示图像图标，请调用：\n\
  \n```\nmoonColumn.setHeaderRenderer(table.getDefaultRenderer(ImageIcon.class));\n\
  ```\n\n### 编辑单元格\n\n要启用单元格编辑，表格模型必须通过定义 `isCellEditable` 方法来指示哪些单元格是可编辑的。通常情况下，你会希望某些列是可编辑的。在示例程序中，我们允许四列进行编辑。\n\
  \n```java\npublic boolean isCellEditable(int r, int c)\n{\n   return c == PLANET_COLUMN\
  \ || c == MOONS_COLUMN || c == GASEOUS_COLUMN \n      || c == COLOR_COLUMN;\n}\n\
  ```\n\n`AbstractTableModel` 定义的 `isCellEditable` 方法始终返回 `false`。`DefaultTableModel`\
  \ 重写了该方法使其始终返回 `true`。\n\n如果你运行本节末尾的示例程序，请注意你可以点击气态（Gaseous）列中的复选框，并开启或关闭勾选。如果你点击卫星（Moons）列中的单元格，会弹出一个组合框（参见图\
  \ 12.9）。你很快就会看到如何安装这样一个组合框作为单元格编辑器。\n\n![Figure](img/fig06-13.jpg)单元格编辑器\n\n最后，点击第一列中的单元格。该单元格获得焦点。你可以开始输入，单元格内容会发生变化。\n\
  \n你刚刚看到的演示是 `DefaultCellEditor` 类的三种变体。`DefaultCellEditor` 可以用 `JTextField`、`JCheckBox`\
  \ 或 `JComboBox` 构建。`JTable` 类会自动为 `Boolean` 单元格安装复选框编辑器，并为所有未提供自定义渲染器的可编辑单元格安装文本字段编辑器。文本字段允许用户编辑通过对表格模型\
  \ `getValueAt` 方法的返回值应用 `toString` 得到的字符串。\n\n编辑完成后，通过调用编辑器的 `getCellEditorValue`\
  \ 方法来获取编辑后的值。该方法应该返回一个正确类型的值（即由模型的 `getColumnType` 方法返回的类型）。\n\n要获取组合框编辑器，请手动设置单元格编辑器——`JTable`\
  \ 组件并不知道特定类型可能适用哪些值。对于卫星（Moons）列，我们希望用户能够选择 0 到 20 之间的任何值。以下是初始化组合框的代码：\n\n```java\n\
  var moonCombo = new JComboBox();\nfor (int i = 0; i <= 20; i++)\n   moonCombo.addItem(i);\n\
  ```\n\n要构建 `DefaultCellEditor`，在构造函数中提供组合框：\n\n```java\nvar moonEditor = new DefaultCellEditor(moonCombo);\n\
  ```\n\n接下来，我们需要安装编辑器。与颜色单元格渲染器不同，此编辑器并不于对象类型——我们并不一定想将其用于所有 `Integer` 类型的对象。相反，我们需要将其安装到特定的列中：\n\
  \n```java\nmoonColumn.setCellEditor(moonEditor);\n```\n\n### 自定义编辑器\n\n再次运行示例程序并点击颜色。弹出的颜色选择器允许你为行星选择新颜色。选择一种颜色并点击确定。单元格颜色将得到更新（参见图\
  \ 12.10）。\n\n![Figure](img/fig06-14.jpg)使用颜色选择器编辑单元格颜色\n\n颜色单元格编辑器不是标准的表格单元格编辑器，而是自定义实现。要创建自定义单元格编辑器，请实现\
  \ `TableCellEditor` 接口。该接口有点麻烦，因此提供了 `AbstractCellEditor` 类来处理事件处理细节。\n\n`TableCellEditor`\
  \ 接口的 `getTableCellEditorComponent` 方法请求一个渲染单元格的组件。它与 `TableCellRenderer` 接口的 `getTableCellRendererComponent`\
  \ 方法完全相同，除了没有 `focus` 参数。当单元单元格时，假设它拥有焦点。在编辑进行期间，编辑器组件临时替换渲染器。在我们的示例中，我们返回了一个没有颜色的空白面板。这向用户指示该单元格正在被编辑。\n\
  \n接下来，你希望在用户点击单元格时弹出你的编辑器。\n\n`JTable` 类会带入事件（如鼠标点击）调用你的编辑器，以确定该事件是否可以启动编辑过程。`AbstractCellEditor`\
  \ 类定义了接受所有事件的方法。\n\n```java\npublic boolean isCellEditable(EventObject anEvent)\n\
  {\n   return true;\n}\n```\n\n然而，如果你重写此方法并返回 `false`，表格将不会费力插入编辑器组件。\n\n一旦安装了编辑器组件，就会调用\
  \ `shouldSelectCell` 方法，假设传入的是同一个事件。你应该在该方法中启动编辑——例如通过弹出一个外部编辑对话框。\n\n```java\n\
  public boolean shouldSelectCell(EventObject anEvent)\n{\n   colorDialog.setVisible(true);\n\
  \   return true;\n}\n```\n\n如果用户取消编辑，表格会调用 `cancelCellEditing` 方法。如果用户点击了另一个表格单元格，表格会调用\
  \ `stopCellEditing` 方法。在两种情况下，你都应该隐藏对话框。\n\n当你的 `stopCellEditing` 方法被调用时，表格将使用编辑后的值。你应该在值有效时返回\
  \ `true`。在颜色选择器中，任何值都是有效的。但如果你编辑其他数据，可以确保只从编辑器获取有效数据。\n\n在调用 `cancelCellEditing`\
  \ 方法时，你需要调用父类方法，否则编辑将正确取消。\n\n```java\npublic void cancelCellEditing()\n{\n   colorDialog.setVisible(false);\n\
  \   super.cancelCellEditing();\n}\n```\n\n最后，你需要一个产生用户提供的值的方法：\n\n```java\npublic\
  \ Object getCellEditorValue()\n{\n   return colorChooser.getColor();\n}\n```\n\n\
  总结，你的自定义编辑器应该执行以下操作：\n\n1. 扩展 `AbstractCellEditor` 类并实现 `TableCellEditor` 接口。\n\
  2. 定义 `getTableCellEditorComponent` 方法提供组件。这可以是虚拟组件（如果你弹出对话框），也可以是用于编辑的组合框或文本字段。\n\
  3. 定义 `shouldSelectCell`、`stopCellEditing` 和 `cancelCellEditing` 方法来处理编辑过程的启动、完成和取消。`stopCellEditing`\
  \ 和 `cancelCellEditing` 方法应调用父类方法以通知监听器。\n4. 定义 `getCellEditorValue` 方法返回编辑过程的结果。\n\
  \n最后，通过调用 `stopCellEditing` 和 `cancelCellEditing` 方法指示用户完成编辑。构建颜色对话框时，我们安装了触发这些事件的回调。\n\
  \n```java\ncolorDialog = JColorChooser.createDialog(null, \"Planet Color\", false,\
  \ colorChooser,\n   EventHandler.create(ActionListener.class, this, \"stopCellEditing\"\
  ),\n   EventHandler.create(ActionListener.class, this, \"cancelCellEditing\"));\n\
  ```\n\n这完成了自定义编辑器的实现。\n\n你现在知道如何让单元格变得可编辑以及如何安装编辑器。还剩一个问题——如何用用户编辑后的值更新模型。编辑完成后，`JTable`\
  \ 类会调用表格模型的以下方法：\n\n```\nvoid setValueAt(Object value, int r, int c)\n```\n\n\n\n\
  \n\n你需要重写该方法来存储新值。`value` 参数是由单元格编辑器返回的对象。如果你实现了单元格编辑器，那么你已经知道从 `getCellEditorValue`\
  \ 方法返回的对象的类型。在 `DefaultCellEditor` 的情况下，该值有三种可能：如果单元格编辑器是复选框，则它是一个 `Boolean`；如果是文本字段，则它是一个字符串；如果值来自组合框（combo\
  \ box），则它是用户选择的对象。\n\n如果 `value` 对象没有相应的类型，你需要对其进行转换。这种情况最常见于在文本字段中编辑数字。在我们的示例中，我们用\
  \ `Integer` 对象填充了组合框，因此不需要任何转换。\n\n### tableCellRender/TableCellRenderFrame.java\n\
  \n```java\npackage tableCellRender;\n\nimport java.awt.*;\nimport javax.swing.*;\n\
  import javax.swing.table.*;\n\n/**\n * 此框架类包含一个显示行星数据的表格。\n */\npublic class TableCellRenderFrame\
  \ extends JFrame\n{\n   private static final int DEFAULT_WIDTH = 600;\n   private\
  \ static final int DEFAULT_HEIGHT = 400;\n\n   public TableCellRenderFrame()\n \
  \  {\n      setSize(DEFAULT_WIDTH, DEFAULT_HEIGHT);\n\n      var model = new PlanetTableModel();\n\
  \      var table = new JTable(model);\n      table.setRowSelectionAllowed(false);\n\
  \n      // 设置渲染器和编辑器\n\n      table.setDefaultRenderer(Color.class, new ColorTableCellRenderer());\n\
  \      table.setDefaultEditor(Color.class, new ColorTableCellEditor());\n\n    \
  \  var moonCombo = new JComboBox<Integer>();\n      for (int i = 0; i <= 20; i++)\n\
  \         moonCombo.addItem(i);\n\n      TableColumnModel columnModel = table.getColumnModel();\n\
  \      TableColumn moonColumn = columnModel.getColumn(PlanetTableModel.MOONS_COLUMN);\n\
  \      moonColumn.setCellEditor(new DefaultCellEditor(moonCombo));\n      moonColumn.setHeaderRenderer(table.getDefaultRenderer(ImageIcon.class));\n\
  \      moonColumn.setHeaderValue(new ImageIcon(getClass().getResource(\"Moons.gif\"\
  )));\n\n      // 显示表格\n\n      table.setRowHeight(100);\n      add(new JScrollPane(table),\
  \ BorderLayout.CENTER);\n   }\n}\n```\n\n### tableCellRender/PlanetTableModel.java\n\
  \n```java\npackage tableCellRender;\n\nimport java.awt.*;\nimport javax.swing.*;\n\
  import javax.swing.table.*;\n\n/**\n * 行星表格模型指定了行星数据的值、渲染和编辑属性。\n */\npublic class\
  \ PlanetTableModel extends AbstractTableModel\n{\n   public static final int PLANET_COLUMN\
  \ = 0;\n   public static final int MOONS_COLUMN = 2;\n   public static final int\
  \ GASEOUS_COLUMN = 3;\n   public static final int COLOR_COLUMN = 4;\n\n   private\
  \ Object[][] cells = \n   {\n      { \"Mercury\", 2440.0, 0, false, Color.YELLOW,\
  \ \n         new ImageIcon(getClass().getResource(\"Mercury.gif\")) },\n      {\
  \ \"Venus\", 6052.0, 0, false, Color.YELLOW, \n         new ImageIcon(getClass().getResource(\"\
  Venus.gif\")) },\n      { \"Earth\", 6378.0, 1, false, Color.BLUE, \n         new\
  \ ImageIcon(getClass().getResource(\"Earth.gif\")) },\n      { \"Mars\", 3397.0,\
  \ 2, false, Color.RED, \n         new ImageIcon(getClass().getResource(\"Mars.gif\"\
  )) },\n      { \"Jupiter\", 71492.0, 16, true, Color.ORANGE, \n         new ImageIcon(getClass().getResource(\"\
  Jupiter.gif\")) },\n      { \"Saturn\", 60268.0, 18, true, Color.ORANGE, \n    \
  \     new ImageIcon(getClass().getResource(\"Saturn.gif\")) },\n      { \"Uranus\"\
  , 25559.0, 17, true, Color.BLUE, \n         new ImageIcon(getClass().getResource(\"\
  Uranus.gif\")) },\n      { \"Neptune\", 24766.0, 8, true, Color.BLUE, \n       \
  \  new ImageIcon(getClass().getResource(\"Neptune.gif\")) },\n      { \"Pluto\"\
  , 1137.0, 1, false, Color.BLACK, \n         new ImageIcon(getClass().getResource(\"\
  Pluto.gif\")) } \n   };\n\n   private String[] columnNames = { \"Planet\", \"Radius\"\
  , \"Moons\", \"Gaseous\", \n         \"Color\", \"Image\" };\n\n   public String\
  \ getColumnName(int c)\n   {\n      return columnNames[c];\n   }\n\n   public Class<?>\
  \ getColumnClass(int c)\n   {\n      return cells[0][c].getClass();\n   }\n\n  \
  \ public int getColumnCount()\n   {\n      return cells[0].length;\n   }\n\n   public\
  \ int getRowCount()\n   {\n      return cells.length;\n   }\n\n   public Object\
  \ getValueAt(int r, int c)\n   {\n      return cells[r][c];\n   }\n\n   public void\
  \ setValueAt(Object obj, int r, int c)\n   {\n      cells[r][c] = obj;\n   }\n\n\
  \   public boolean isCellEditable(int r, int c)\n   {\n      return c == PLANET_COLUMN\
  \ || c == MOONS_COLUMN || c == GASEOUS_COLUMN \n            || c == COLOR_COLUMN;\n\
  \   }\n}\n```\n\n### tableCellRender/ColorTableCellRenderer.java\n\n```java\npackage\
  \ tableCellRender;\n\nimport java.awt.*;\nimport javax.swing.*;\nimport javax.swing.table.*;\n\
  \n/**\n * 此渲染器将颜色值渲染为带有给定颜色的面板。\n */\npublic class ColorTableCellRenderer extends\
  \ JPanel implements TableCellRenderer\n{\n   public Component getTableCellRendererComponent(JTable\
  \ table, Object value, \n         boolean isSelected, boolean hasFocus, int row,\
  \ int column)\n   {\n      setBackground((Color) value);\n      if (hasFocus) setBorder(UIManager.getBorder(\"\
  Table.focusCellHighlightBorder\"));\n      else setBorder(null);\n      return this;\n\
  \   }\n}\n```\n\n### tableCellRender/ColorTableCellEditor.java\n\n```java\npackage\
  \ tableCellRender;\n\nimport java.awt.*;\nimport java.awt.event.*;\nimport java.beans.*;\n\
  import java.util.*;\nimport javax.swing.*;\nimport javax.swing.table.*;\n\n/**\n\
  \ * 此编辑器弹出颜色对话框以编辑单元格值。\n */\npublic class ColorTableCellEditor extends AbstractCellEditor\n\
  {\n   private JColorChooser colorChooser;\n   private JDialog colorDialog;\n   private\
  \ JPanel panel;\n\n   public ColorTableCellEditor()\n   {\n      panel = new JPanel();\n\
  \      // 准备颜色对话框\n\n      colorChooser = new JColorChooser();\n      colorDialog\
  \ = JDialog(null, \"Planet Color\", false, colorChooser);\n   }\n\n   public Component\
  \ getTableCellEditorComponent(JTable table, Object value,\n         boolean isSelected,\
  \ int row, int column)\n   {\n      // 在此处获取当前颜色值。将其存储在对话框中，以防用户开始编辑\n      colorChooser.setColor((Color)\
  \ value);\n      return panel;\n   }\n\n   public boolean shouldSelectCell(EventObject\
  \ anEvent)\n   {\n      // 开始编辑\n      colorDialog.setVisible(true);\n\n      //\
  \ 告诉可以选择此单元格\n      return true;\n   }\n\n   public void cancelCellEditing()\n \
  \  {\n      // 编辑取消--隐藏对话框\n      colorDialog.setVisible(false);\n      super.cancelCellEditing();\n\
  \   }\n\n   public boolean stopCellEditing()\n   {\n      // 编辑完成--隐藏对话框\n     \
  \ colorDialog.setVisible(false);\n      super.stopCellEditing();\n\n      // 告诉可以使用颜色值\n\
  \      return true;\n   }\n\n   public Object getCellEditorValue()\n   {\n     \
  \ return colorChooser.getColor();\n   }\n}\n```\n\n\n\n\n构建一个用于选择单元格值的组合框的单元格编辑器。\n\
  \n`javax.swing.table.TableCellEditor` 1.2\n\n*   `Component getTableCellEditorComponent(JTable\
  \ table, Object value, boolean selected, int row, int column)`\n    返回一个其 `paint`\
  \ 方法渲染表格单元格的组件。\n\n`javax.swing.CellEditor` 1.2\n\n*   `boolean isCellEditable(EventObject\
  \ event)`\n    如果事件适用于启动此单元格的编辑过程，则返回 `true`。\n\n*   `boolean shouldSelectCell(EventObject\
  \ anEvent)`\n    开始编辑过程。如果被编辑的单元格应该被`selected`（选中），则返回 `true`。通常你希望返回 `true`，但如果你不想让编辑过程改变单元格的选择，可以返回\
  \ `false`。\n\n*   `void cancelCellEditing()`\n    取消编辑过程。你可以放弃部分编辑。\n\n*   `boolean\
  \ stopCellEditing()`\n    停止编辑过程，并意图使用结果。如果编辑后的值处于可检索的 get，则返回 `true`。\n\n*   `Object\
  \ getCellEditorValue()`\n    返回编辑后的结果。\n\n*   `void addCellEditorListener(CellEditorListener\
  \ l)`\n*   `void removeCellEditorListener(CellEditorListener l)`\n    添加或移除强制单元格编辑器监听器。\n\
  \n## 树 (Trees)\n\n每个使用过分层文件系统的计算机用户都见过树形显示。理当然，目录和文件只是许多树形组织示例中的其中之一。日常生活中存在许多树结构，例如\
  \ 图 12.11 所示的国家、州和城市的层级结构。\n\n![Figure](img/fig06-15.jpg)国家、州和城市的层级结构\n\n作为程序员，我们经常需要显示树结构。幸运的是，Swing\
  \ 库有一个 `JTree` 类用于此目的。`JTree` 类（连同它的辅助类）负责树的布局以及处理用户展开和折叠节点的请求。在本节中，你将学习如何使用 `JTree`\
  \ 类。\n\n与其它复杂的 Swing 组件一样，我们必须关注常见且实用的情况，无法涵盖每一个细节。如果你想实现某些特殊的功能，我们建议咨询 David M.\
  \ Geary 编写的 *Graphic Java™, Third Edition* 或 Kim Topley 编写的 *Core Swing*。\n\n在继续之前之前，让我们先确定一些术语（参见\
  \ 图 12.12）。一个 `tree`（树）由 `nodes`（节点）组成。每个节点要么是 `leaf`（叶节点），要么拥有 `child nodes`（子节点）。除了根节点外，每个节点恰好有一个\
  \ `parent`（父节点）。树只有一个根节点。有时你有一组树，每个树都有自己的根节点。这样的集合被称为 `forest`（森林）。\n\n![Figure](img/fig06-16.jpg)树术语\n\
  \n### 简单树 (Simple Trees)\n\n在我们的第一个示例程序中，我们将简单显示一个带有几个节点的树（参见 图 12.14）。与许多其他 Swing\
  \ 组件一样，你需要提供一个数据模型，由组件为你显示它。要构造一个 `JTree`，请在构造函数中提供树模型：\n\n```\nTreeModel model\
  \ = . . .;\nvar tree = new JTree(model);\n```\n\n还有一些构造函数可以从元素集合构造树：\n\n```\nJTree(Object[]\
  \ nodes)\nJTree(Vector<?> nodes)\nJTree(Hashtable<?, ?> nodes) // 值变为节点\n```\n\n\
  这些构造函数并没有很有用。它们仅仅构建了一个树的森林，每个树只有一个节点。第三个构造函数看起来特别没用，因为节点按照键的哈希值（hash codes）决定的看似随机的顺序出现。\n\
  \n如何获取树模型？你可以创建一个实现 `TreeModel` 接口的类来构造你自己的模型。你将在本章稍后的部分看到如何这样做。现在，我们将坚持使用 Swing\
  \ 库提供的 `DefaultTreeModel`。\n\n要构造默认树模型，你必须提供一个根节点。\n\n```\nTreeNode root = . . .;\n\
  var model = new DefaultTreeModel(root);\n```\n\n`TreeNode` 是另一个接口。用任何实现该接口的类的对象填充默认树模型。现在，我们将使用\
  \ Swing 提供的具体节点类——即 `DefaultMutableTreeNode`。该类实现了 `MutableTreeNode` 接口，它是 `TreeNode`\
  \ 的一个子接口（参见 图 12.13）。\n\n![Figure](img/fig06-17.jpg)树类\n\n默认可变树节点持有一个对象——`user object`（用户对象）。树渲染所有节点的用户对象。除非指定了渲染器（renderer），否则树将显示\
  \ `toString` 方法的结果字符串。\n\n在我们的第一个示例中，我们使用字符串作为用户对象。在实践中，你通常会用更有表现力的用户对象填充树。例如，在显示目录树时，使用\
  \ `File` 对象作为节点是有意义的。\n\n你可以在构造函数中指定用户对象，也可以稍后用 `setUserObject` 方法设置。\n\n```\nvar\
  \ node = new DefaultMutableTreeNode(\"Texas\");\n. . .\nnode.setUserObject(\"California\"\
  );\n```\n\n接下来，你需要建立节点之间的父子关系。从根节点开始并使用 `add` 方法添加子节点：\n\n```\nvar root = new DefaultMutableTreeNode(\"\
  World\");\nvar country = new DefaultMutableTreeNode(\"USA\");\nroot.add(country);\n\
  var state = new DefaultMutableTreeNode(\"California\");\ncountry.add(state);\n```\n\
  \n图 12.14 展示了树的样子。\n\n以这种方式连接所有节点。然后，使用根节点构造 `DefaultTreeModel`。最后，使用树模型构造 `JTree`。\n\
  \n```\nvar treeModel = new DefaultTreeModel(root);\nvar tree = new JTree(treeModel);\n\
  ```\n\n或者，作为快捷方式，你可以直接将根节点传递给 `JTree` 构造函数。树会自动构造默认树模型：\n\n```\nvar tree = new JTree(root);\n\
  ```\n\n列表 12.8 包含了完整的代码。\n\ntree/SimpleTreeFrame.java\n\n```\npackage tree;\n\n\
  import javax.swing.*;\nimport javax.swing.tree.*;\n\n/**\n * 包含一个手动树模型的简单树。\n */\n\
  public class SimpleTreeFrame extends JFrame\n{\n   private static final int DEFAULT_WIDTH\
  \ = 300;\n   private static final int DEFAULT_HEIGHT = 200;\n\n   public SimpleTreeFrame()\n\
  \   {\n      setSize(DEFAULT_WIDTH, DEFAULT_HEIGHT);\n\n      // 设置树模型\n\n     \
  \ var root = new DefaultMutableTreeNode(\"World\");\n      var country = new DefaultMutableTreeNode(\"\
  USA\");\n      root.add(country);\n      var state = new DefaultMutableTreeNode(\"\
  California\");\n      country.add(state);\n      var city = new DefaultMutableTreeNode(\"\
  San Jose\");\n      state.add(city);\n      city = new DefaultMutableTreeNode(\"\
  Cupertino\");\n      state.add(city);\n      state = new DefaultMutableTreeNode(\"\
  Michigan\");\n      country.add(state);\n      city = new DefaultMutableTreeNode(\"\
  Ann Arbor\");\n      state.add(city);\n      country = new DefaultMutableTreeNode(\"\
  Germany\");\n      root.add(country);\n      state = new DefaultMutableTreeNode(\"\
  Schleswig-Holstein\");\n      country.add(state);\n      city = new DefaultMutableTreeNode(\"\
  Kiel\");\n      state.add(city);\n\n      // 构造树并将其放入滚动条\n\n      var tree = new\
  \ JTree(root);\n      add(new JScrollPane(tree));\n   }\n}\n```\n\n当你运行程序时，树首先看起来如\
  \ 图 12.15 所示。只有根节点及其子节点可见。点击圆形图标（`handles`）来展开子树。从柄图标伸出的线在子树折叠时指向右侧，在子树展开时指向下方（参见\
  \ 图 12.16）。我们不知道 Metal 皮肤的设计者在想什么，但我们把该图标看作一个门把手。你按下把手来打开子树。\n\n\n\n\n\n![Figure](img/fig06-19.jpg)初始树显示！！![Figure](img/fig06-20.jpg)折叠和展开的子树\n\
  \n当然，树的显示取决于所选的外观（look-and-feel）。我们刚刚描述了 Metal 外观。在 Windows 外观中，句柄具有更熟悉的样式——一个方框内的“`–`”或“`+`”（参见图\
  \ 12.17](#）。\n\n![Figure](img/fig06-21.jpg)带有 Windows 外观的树\n\n你可以使用以下这段“魔法咒语”来关闭连接父节点和子节点的线条（参见图\
  \ 12.18](#）：\n\n```\ntree.putClientProperty(\"JTree.lineStyle\", \"None\");\n```\n\
  \n![Figure](img/fig06-22.jpg)没有连接线的树\n\n相反，要确保显示线条，请使用\n\n```\ntree.putClientProperty(\"\
  JTree.lineStyle\", \"Angled\");\n```\n\n另一种线条样式 `\"Horizontal\"` 显示在图 12.19](#)中。树显示时，仅用水平线分隔根节点的子节点。我不太确定这有什么用处。\n\
  \n![Figure](img/fig06-23.jpg)带有水平线条样式的树\n\n默认情况下，没有用于折叠树根节点的句柄。如果你愿意，可以通过调用以下方法添加一个：\n\
  \n```\ntree.setShowsRootHandles(true);\n```\n\n图 12.20)显示了结果。现在你可以将整棵树折叠到根节点中。\n\
  \n![Figure](img/fig06-24.jpg)带有根句柄的树\n\n相反，你可以完全隐藏根节点。这将使你显示一个*森林*——一组树，每棵树都有自己的根节点。你仍然必须将森林中的所有树连接到一个公共根节点；然后使用指令隐藏根节点：\n\
  \n```\ntree.setRootVisible(false);\n```\n\n查看图 12.21](#)。似乎有两个根节点，标记为“USA”和“Germany”。连接这两个节点的实际根节点被设不可见。\n\
  \n![Figure](img/fig06-25.jpg)森林\n\n让我们从根节点转向树的叶节点。注意，叶子节点的图标与其他节点不同（参见图 12.22](#）。\n\
  \n![Figure](img/fig06-26.jpg)叶子和文件夹图标\n\n当显示树时，每个节点都带有一个绘制图标。实际上有三种类型的图标：叶子图标、打开的非叶节点图标和关闭的非叶节点图标。为了简单起见，我们将后两种称为文件夹图标。\n\
  \n节点渲染器需要知道为每个节点使用哪个图标。默认情况下，决策过程如下：如果一个节点的 `isLeaf` 方法返回 `true`，则使用叶子图标；否则，使用文件夹图标。\n\
  \n`DefaultMutableTreeNode` 类的 `isLeaf` 方法在节点没有子节点时返回 `true`。因此，有子节点的节点获得文件夹图标，而没有子节点的节点获得叶子图标。\n\
  \n有时，这种行为并不恰当。假设我们在示例树中添加了一个“Montana（蒙大拿州）”节点，但我们不知道应该添加哪些城市。我们不希望状态节点获得叶子图标，因为从概念上讲，只有城市才是叶节点。\n\
  \n`JTree` 类并不知道哪些节点应该是叶节点。它询问树模型。如果一个没有子节点的节点自动不是概念上的叶节点，你可以要求树模型使用不同的标准来判断是否为叶节点——即查询“允许\
  \ children”（allows children）节点属性。对于那些不应该有子节点的节点，调用\n\n```\nnode.setAllowsChildren(false);\n\
  ```\n\n然后，告诉树模型通过查询“allows children”属性的值来确定一个节点是否应该以叶子图标显示。使用 `DefaultTreeModel`\
  \ 类的 `setAsksAllowsChildren` 方法来设置这种行为：\n\n```\nmodel.setAsksAllowsChildren(true);\n\
  ```\n\n通过这种决策标准，允许子节点的节点获得文件夹图标，而不允许子节点的节点获得叶子图标。\n\n或者，如果你从根节点构造树，可以在构造函数中提供“asks\
  \ allows children”属性的设置。\n\n```\nvar tree = new JTree(root, true); // 不允许子节点的节点获得叶子图标\n\
  ```\n\n### `javax.swing.JTree` 1.2\n\n*   `JTree(TreeModel model)`\n    从树模型构造树。\n\
  *   `JTree(TreeNode root)`\n*   `JTree(TreeNode root, boolean asksAllowChildren)`\n\
  \    使用默认树模型构造树，该模型显示根及其子节点。\n*   `void setShowsRootHandles(boolean b)`\n    如果\
  \ `b` 为 `true`，则根节点有一个用于折叠或展开其子节点的句柄。\n*   `void setRootVisible(boolean b)`\n  \
  \  如果 `b` 为 `true`，则显示根节点。否则，将其隐藏。\n\n### `javax.swing.TreeNode` 1.2\n\n*   `boolean\
  \ isLeaf()`\n    如果节点是叶节点，则返回 `true`。\n*   `boolean allowsChildren()`\n    如果节点可以子节点，则返回\
  \ `true`。\n\n### `javax.swing.tree.MutableTreeNode` 1.2\n\n*   `DefaultMutableTreeNode(Object\
  \ userObject)`\n    使用给的用户对象构造可变树节点。\n*   `void add(MutableTreeNode child)`\n  \
  \  将节点作为子节点添加。\n*   `void setAllowsChildren(boolean b)`\n    如果 `b` 为 `true`，则可以添加子节点。\n\
  \n### `javax.swing.tree.TreeModel` 1.2\n\n*   `boolean isLeaf(Object node)`\n  \
  \  如果 `node` 应该显示为叶节点，则返回 `true`。\n*   `void setUserObject(Object userObject)`\n\
  \    设置树使用的“用户对象”。\n\n### `javax.swing.tree.DefaultTreeModel` 1.2\n\n*   `void setAsksAllowsChildren(boolean\
  \ b)`\n    如果 `b` 为 `true`，节点显示为叶节点。否则，将其隐藏。\n\n#### `javax.swing.JComponent` 1.2\n\
  \n*   `void putClientProperty(Object key, Object value)`\n    向组件管理的键值表中添加键值对。\n\
  \n### 编辑树与树路径\n\n在接下来的示例程序中，你将看到如何编辑树。图 12.23](#显示了用户界面。如果你点击“添加兄弟节点”或“添加子节点”按钮，程序将向树添加一个新节点（标题为\
  \ New）。如果你点击“删除”按钮，程序将删除当前选中的节点。\n\n为了实现这种行为，你需要找到当前选中的节点。`JTree` 类识别节点的方式非常独特。它处理的不是树节点，而是对象的路径，称为*树路径*。树路径从根节点开始，由一系列子节点组成（参见图\
  \ 12.24](#）。\n\n\n\n\n\n`TreePath` 类管理一组 `Object`（注意不是 `TreeNode`！）引用。许多 `JTree`\
  \ 方法会返回 `TreePath` 对象。当你有一个树路径（tree path）时，你通常只需要知道末端节点，这可以通过 `getLastPathComponent`\
  \ 方法获取。例如，要找到树中当前选中的节点，请使用 `JTree` 类的 `getSelectionPath` 方法。你将获得一个 `TreePath` 对象，并从中检索实际节点。\n\
  \n```\nTreePath selectionPath = tree.getSelectionPath();\nvar selectedNode = (DefaultMutableTreeNode)\
  \ selectionPath.getLastPathComponent();\n```\n\n实际上，由于这种特定查询非常常见，有一个便利方法可以直接获取选中的节点：\n\
  \n```\nvar selectedNode = (DefaultMutableTreeNode) tree.getLastSelectedPathComponent();\n\
  ```\n\n该方法没有命名为 `getSelectedNode`，因为树并不知道它包含节点——它的树模型（tree model）只处理对象的路径。\n\n 树路径\
  \ (Tree Paths)\n\n树路径是 `JTree` 类描述节点的两种方式之一。相当多的 `JTree` 方法接收或返回整数索引——*行位置*（row\
  \ position）。行位置仅仅是节点在树显示中的行号（从 0 开始）。只有可见节点才有行号，而且如果该节点之前的节点被展开、折叠或修改，该节点的行号就会改变。出于因此，你应该避免使用行位置。所有使用行位置的\
  \ `JTree` 方法都有使用树路径的对应方法。\n\n## 编辑节点 (Editing Nodes)\n\n一旦你有了选中的节点，就可以对其进行编辑。但是，不要简单地向树节点添加子节点：\n\
  \n```\nselectedNode.add(newNode); // 不要！\n```\n\n如果你更改了节点的结构，你更改了模型，但相关的视图（view）不会收到通知。你可以自己发送通知，但如果你使用\
  \ `DefaultTreeModel` 类的 `insertNodeInto` 方法，模型类会处理该问题。例如，以下调用将新节点作为选中节点的最后一个子节点，并通知树视图：\n\
  \n```\nmodel.insertNodeInto(newNode, selectedNode, selectedNode.getChildCount());\n\
  ```\n\n类似的调用 `removeNodeFromParent` 会移除一个节点并通知视图：\n\n```\nmodel.removeNodeFromParent(selectedNode);\n\
  ```\n\n如果你保持节点结构不变但更改了用户对象（user object），则应该调用以下方法：\n\n```\nmodel.nodeChanged(changedNode);\n\
  ```\n\n自动通知是使用 `DefaultTreeModel` 的主要优势。如果你提供自己的树模型，则必须手动实现自动通知。（详情参见 Kim Topley\
  \ 编写的 *Core Swing*。）\n\n`DefaultTreeModel` 类有一个 `reload` 方法，可以重新加载整个模型。然而，不要仅仅在进行少量更改后调用\
  \ `reload` 来更新树。当树重新生成时，根节点之后的所有节点将再次折叠。如果用户在每次更改后都必须反复展开树，这对他们来说将非常困扰。\n\n## 使节点可见\
  \ (Making Nodes Visible)\n\n当视图收到节点结构的变化时，它会更新显示，但不会自动展开节点以显示新添加的子节点。特别是如果我们示例程序中的用户为一个当前处于折叠状态的节点添加新子节点，新节点将静默地添加到折叠的子树中。这让用户无法获得命令已实际执行的反馈。在这种情况下，你应该特意展开所有父节点，以便新添加的节点变得可见。使用\
  \ `JTree` 类的 `makeVisible` 方法来实现此目的。`makeVisible` 方法期望一个通向应变为可见的节点的树路径。\n\n因此，你需要构建从根节点到新插入节点的树路径。要获取树路径，首先调用\
  \ `DefaultTreeModel` 类的 `getPathToRoot` 方法。它返回一个包含从节点到根节点的所有节点的 `TreeNode[]` 数组。将该数组传递给\
  \ `TreePath` 构造函数。\n\n例如，以下是让新节点可见的方法：\n\n```\nTreeNode[] nodes = model.getPathToRoot(newNode);\n\
  var path = new TreePath(nodes);\ntree.makeVisible(path);\n```\n\n有趣的是，`DefaultTreeModel`\
  \ 类几乎完全忽略 `TreePath` 类，尽管它的工作是与 `JTree` 通信。`JTree` 类频繁使用树路径，而且从不使用节点对象的数组。\n\n现在，假设你的树位于滚动面板（scroll\
  \ pane）内部。在树节点展开后，新节点可能仍然不可，因为它位于视口之外。为了解决这个问题，请调用\n\n```\ntree.scrollPathToVisible(path);\n\
  ```\n\n而不是调用 `makeVisible`。此调用会展开路径上的所有节点，并告诉周围的滚动面板将路径末端的节点滚动到视图中（参见图 12.25）。\n\
  \n![Figure](img/fig06-29.jpg)滚动面板滚动以显示新节点。\n\n默认情况下，树节点是不可编辑的。然而，如果你调用\n\n```\n\
  tree.setEditable(true);\n```\n\n用户只需通过双击、编辑字符串并按回车键即可编辑节点。双击会调用*默认单元格编辑器*（default\
  \ cell editor），它由 `DefaultCellEditor` 类实现（参见图 12.26）。可以使用与我们在讨论表格单元格编辑器时看到的相同过程来安装其他单元格编辑器。\n\
  \n![Figure](img/fig06-30.jpg)默认单元格编辑器\n\n列表 12.9 显示了树编辑程序的完整源代码。运行程序，添加几个节点，并通过双击对它们进行编辑。观察折叠节点如何展开以显示添加的节点，以及滚动面板如何保持添加的节点在视口内。\n\
  \n```\ntreeEdit/TreeEditFrame.java\n```\n\n\n\n\n\n```java\npackage treeEdit;\n\n\
  import java.awt.*;\nimport javax.swing.*;\nimport javax.swing.tree.*;\n\n/**\n *\
  \ 一个包含树和用于编辑树按钮的框架。\n */\npublic class TreeEditFrame extends JFrame\n{\n   private\
  \ static final int DEFAULT_WIDTH = 400;\n   private static final int DEFAULT_HEIGHT\
  \ = 200;\n\n   private DefaultTreeModel model;\n   private JTree tree;\n\n   public\
  \ TreeEditFrame()\n   {\n      setSize(DEFAULT_WIDTH, DEFAULT_HEIGHT);\n\n     \
  \ // 构建树\n\n      TreeNode root = makeSampleTree();\n      model = new DefaultTreeModel(root);\n\
  \      tree = new JTree(model);\n      tree.setEditable(true);\n\n      // 添加带树的滚动面板\n\
  \n      var scrollPane = new JScrollPane(tree);\n      add(scrollPane, BorderLayout.CENTER);\n\
  \n      makeButtons();\n   }\n\n   public TreeNode makeSampleTree()\n   {\n    \
  \  var root = new DefaultMutableTreeNode(\"World\");\n      var country = new DefaultMutableTreeNode(\"\
  USA\");\n      root.add(country);\n      var state = new DefaultMutableTreeNode(\"\
  California\");\n      country.add(state);\n      var city = new DefaultMutableTreeNode(\"\
  San Jose\");\n      state.add(city);\n      city = new DefaultMutableTreeNode(\"\
  San Diego\");\n      state.add(city);\n      state = new DefaultMutableTreeNode(\"\
  Michigan\");\n      country.add(state);\n      city = new DefaultMutableTreeNode(\"\
  Ann Arbor\");\n      state.add(city);\n      country = new DefaultMutableTreeNode(\"\
  Germany\");\n      root.add(country);\n      state = new DefaultMutableTreeNode(\"\
  Schleswig-Holstein\");\n      country.add(state);\n      city = new DefaultMutableTreeNode(\"\
  Kiel\");\n      state.add(city);\n      return root;\n   }\n\n   /**\n    * 创建用于添加兄弟节点、添加子节点和删除节点的按钮。\n\
  \    */\n   public void makeButtons()\n   {\n      var panel = new JPanel();\n \
  \     var addSiblingButton = new JButton(\"Add Sibling\");\n      addSiblingButton.addActionListener(event\
  \ ->\n         {\n            var selectedNode = (DefaultMutableTreeNode) tree.getLastSelectedPathComponent();\n\
  \n            if (selectedNode == null) return;\n\n            var parent = (DefaultMutableTreeNode)\
  \ selectedNode.getParent();\n\n            if (parent == null) return;\n\n     \
  \       var newNode = new DefaultMutableTreeNode(\"New\");\n\n            int selectedIndex\
  \ = parent.getIndex(selectedNode);\n            model.insertNodeInto(newNode, parent,\
  \ selectedIndex + 1);\n\n            // 现在显示新节点\n\n            TreeNode[] nodes\
  \ = model.getPathToRoot(newNode);\n            var path = new TreePath(nodes);\n\
  \            tree.scrollPathToVisible(path);\n         });\n      panel.add(addSiblingButton);\n\
  \n      var addChildButton = new JButton(\"Add Child\");\n      addChildButton.addActionListener(event\
  \ ->\n         {\n            var selectedNode = (DefaultMutableTreeNode) tree.getLastSelectedPathComponent();\n\
  \n            if (selectedNode == null) return;\n\n            var newNode = new\
  \ DefaultMutableTreeNode(\"New\");\n            model.insertNodeInto(newNode, selectedNode,\
  \ selectedNode.getChildCount());\n\n            // 现在显示新节点\n\n            TreeNode[]\
  \ nodes = model.getPathToRoot(newNode);\n            var path = new TreePath(nodes);\n\
  \            tree.scrollPathToVisible(path);\n         });\n      panel.add(addChildButton);\n\
  \n      var deleteButton = new JButton(\"Delete\");\n      deleteButton.addActionListener(event\
  \ ->\n         {\n            var selectedNode = (DefaultMutableTreeNode) tree.getLastSelectedPathComponent();\n\
  \n            if (selectedNode != null && selectedNode.getParent() != null) model\n\
  \                  .removeNodeFromParent(selectedNode);\n         });\n      panel.add(deleteButton);\n\
  \      add(panel, BorderLayout.SOUTH);\n   }\n}\n```\n\n### `javax.swing.JTree`\
  \ 1.2\n\n- `TreePath getSelectionPath()`\n  获取当前选中节点的路径，或者如果选择了多个节点，则获取第一个选中节点的路径。如果没有选中任何节点，则返回\
  \ `null`。\n\n- `Object getLastSelectedPathComponent()`\n  获取代表当前选中节点的节点对象，或者如果选择了多个节点，则获取第一个节点。如果没有选中任何节点，则返回\
  \ `null`。\n\n- `void makeVisible(TreePath path)`\n  展开路径上的所有节点。\n\n- `void scrollPathToVisible(TreePath\
  \ path)`\n  展开路径上的所有节点，如果树包含在滚动面板中，则会滚动以确保路径上的最后一个节点可见的。\n\n### `javax.swing.tree.TreePath`\
  \ 1.2\n\n- `Object getLastPathComponent()`\n  获取此路径上的最后一个对象——即该路径所代表的节点对象。\n\n###\
  \ `javax.swing.tree.TreeNode` 1.2\n\n- `TreeNode getParent()`\n  返回该节点的父节点。\n\n\
  - `TreeNode getChildAt(int index)`\n  查找给定索引处的子节点。索引必须在 0 到 `getChildCount()` -\
  \ 1 之间。\n\n- `int getChildCount()`\n  返回该节点的子节点数量。\n\n- `Enumeration children()`\n\
  \  返回一个迭代该节点所有子节点的枚举对象。\n\n### `javax.swing.tree.DefaultTreeModel` 1.2\n\n- `void\
  \ insertNodeInto(MutableTreeNode newChild, MutableTreeNode parent, int index)`\n\
  \  在指定的索引处将 `newChild` 作为 `parent` 的新子节点插入，并通知树。\n\n- `void removeNodeFromParent(MutableTreeNode\
  \ node)`\n  从父节点中移除 `node`。\n\n- `void nodeChanged(TreeNode node)`\n  通知 `node`\
  \ 发生了变化。\n\n- `void nodesChanged(TreeNode parent, int[] childIndexes)`\n  通知 `parent`\
  \ 的指定索引的节点发生了变化。\n\n- `void reload()`\n  重新加载模型中的节点。这是一个剧烈操作，只有当节点完全由于外部影响时才使用。\n\
  \n### 节点枚举 (Node Enumeration)\n\n有时你需要从根节点开始访问所有子节点并在树中查找节点。`DefaultMutableTreeNode`\
  \ 类提供了遍历节点的便利方法。\n\n`breadthFirstEnumeration` 和 `depthFirstEnumeration` 返回枚举对象，这些对象使用广度优先或深度优先遍历访问当前节点的节点。图\
  \ 12.27 显示了示例树的遍历情况——节点标签指示了遍历顺序。\n\n![Figure](img/fig06-31.jpg)树遍历顺序\n\n广度优先枚举容易理解。树按层遍历。首先访问根节点，然后是它的子节点，然后是孙节点，以此类推。\n\
  \n为了可视化深度优先枚举，想象一只被困在树形迷宫中的鼠。它沿着第一条路径冲，直到遇到叶子节点。然后，它回溯并转向另一条路径。\n\n计算机科学家也将这种方法称为后序遍历*，因为搜索过程在访问父节点之前访问了子节点。`postOrderEnumeration`\
  \ 方法是 `depthFirstEnumeration` 的同义词。为了完整起见，还有 `preOrderEnumeration`，这是一种在访问子之前访问父节点的深度搜索。\n\
  \n这是典型的用法：\n\n```java\nEnumeration breadthFirst = node.breadthFirstEnumeration();\n\
  while (breadthFirst.hasMoreElements())\n   do something with breadthFirst.nextElement();\n\
  ```\n\n最后，相关方法 `pathFromAncestorEnumeration` 找到从祖先到给定节点的路径，并枚举该路径上的节点。这没什么——它只是一直调用\
  \ `getParent` 直到找到祖先，然后反向呈现路径。\n\n在下一个示例程序中，我们将节点枚举派上用场。程序显示类的继承树。在框架底部的文本框输入类的名称。该类及其所有的父类都被添加到树中（参见图\
  \ 12.28）。\n\n![Figure](img/fig06-32.jpg)继承树\n\n\n\n\n在这个示例中，我们利用了树节点的用户对象（user objects）可以是任意类型的特性。由于我们的节点描述的是类，因此我们在节点中存储了\
  \ `Class` 对象。\n\n我们不希望重复添加同一个类对象，因此需要检查类是否已经存在于树中。以下方法可以在指定的用户对象存在于树中时，找到它对应的节点：\n\
  \n```\npublic DefaultMutableTreeNode findUserObject(Object obj)\n{\n   Enumeration\
  \ e = root.breadthFirstEnumeration();\n   while (e.hasMoreElements())\n   {\n  \
  \    DefaultMutableTreeNode node = (DefaultMutableTreeNode) e.nextElement();\n \
  \     if (node.getUserObject().equals(obj))\n         return node;\n   }\n   return\
  \ null;\n}\n```\n\n### 渲染节点\n\n在应用程序中，你经常需要更改树组件绘制节点的方式。最常见的更改是为节点和叶节点选择不同的图标。其他更改可能涉及更改节点标签的字体或在节点处绘制图像。通过向树中安装新的\
  \ `tree cell renderer`（树单元渲染器），可以实现所有更改。默认情况下，`JTree` 类使用 `DefaultTreeCellRenderer`\
  \ 对象来绘制每个节点。`DefaultTreeCellRenderer` 类继承自 `JLabel` 类。标签包含节点图标和节点标签。\n\n单元渲染器不绘制用于展开和折叠子树的“句柄”（handles）。句柄是外观（look-and-feel）的一部分，建议不要更改它们。\n\
  \n你可以通过三种方式自定义显示：\n\n*   你可以更改 `DefaultTreeCellRenderer` 使用的图标、字体和背景颜色。这些设置适用于树中的所有节点。\n\
  *   你可以安装一个扩展 `DefaultTreeCellRenderer` 类的渲染器，并为每个设置不同的图标、字体和背景颜色。\n*   你可以安装一个实现\
  \ `TreeCellRenderer` 接口的渲染器，为每个节点绘制自定义图像。\n\n让我们逐一查看这些可能性。最简单的自定义是构造一个 `DefaultTreeCellRenderer`\
  \ 对象，更改图标并将其安装到树中：\n\n```\nvar renderer = new DefaultTreeCellRenderer();\nrenderer.setLeafIcon(new\
  \ ImageIcon(\"blue-ball.gif\")); // 用于叶节点\nrenderer.setClosedIcon(new ImageIcon(\"\
  red-ball.gif\")); // 用于折叠的节点\nrenderer.setOpenIcon(new ImageIcon(\"yellow-ball.gif\"\
  )); // 用于展开的节点\ntree.setCellRenderer(renderer);\n```\n\n你可以在图 12.28 中看到效果。我们只是使用“球”图标作为占位符——get\
  \ 你的用户界面设计师会为你提供适用于应用程序的适当图标。\n\n我们不建议更改整棵树的字体或背景颜色——这实际上是外观（look-and-feel）的工作。\n\
  \n然而，更改树中某些节点的字体以突出显示可能是很有用的。如果你仔细观察图 12.28，你会发现 `abstract` 类被设置为了斜体。\n\n要更改单个节点的外观，请安装树单元渲染器。树单元渲染器与我们在本节较早讨论的列表单元渲染器非常相似。`TreeCellRenderer`\
  \ 接口有一个方法：\n\n```\nComponent getTreeCellRendererComponent(JTree tree, Object value,\
  \ boolean selected,\n      boolean expanded, boolean leaf, int row, boolean hasFocus)\n\
  ```\n\n`DefaultTreeCellRenderer` 类的 `getTreeCellRendererComponent` 方法返回 `this`——也就是说，返回一个标签。（`DefaultTreeCellRenderer`\
  \ 类继承自 `JLabel` 类。）要自定义该组件，请扩展 `DefaultTreeCellRenderer` 类。重写 `getTreeCellRendererComponent`\
  \ 方法如下：调用父类方法以便其准备标签数据，自定义标签属性，并最后返回 `this`。\n\n```\nclass MyTreeCellRenderer extends\
  \ DefaultTreeCellRenderer\n{\n   public Component getTreeCellRendererComponent(JTree\
  \ tree, Object value, boolean selected,\n         boolean expanded, boolean leaf,\
  \ int row, boolean hasFocus)\n   {\n      Component comp = super.getTreeCellRendererComponent(tree,\
  \ value, selected, \n            expanded, leaf, row, hasFocus);\n      DefaultMutableTreeNode\
  \ node = (DefaultMutableTreeNode) value;\n      look at node.getUserObject();\n\
  \      Font font = appropriate font;\n      comp.setFont(font);\n      return comp;\n\
  \   }\n}\n```\n\n`getTreeCellRendererComponent` 方法的 `value` 参数是 `node` 对象，*而不是*用户对象！记住，用户对象是\
  \ `DefaultMutableTreeNode` 的特性，且 `JTree` 可以包含任意类型的节点。如果你的树使用 `DefaultMutableTreeNode`\
  \ 节点，你必须在第二步中获取用户对象，就像我们在前面的代码示例中所做一样。\n\n`DefaultTreeCellRenderer` 为所有节点使用`同一个`标签对象，仅更改每个节点的标签文本。如果你更改了特定节点的字体，必须在再次调用该方法时将其恢复为默认值。否则，所有后续节点都将使用更改后的字体绘制！查看代码列表\
  \ 12.10 中的代码，了解如何将字体恢复为默认。\n\n代码列表 12.10 中的 `ClassNameTreeCellRenderer` 以普通字体或斜体字体设置类名。我们需要保留原始字体，并在下一次调用\
  \ `getTreeCellRenderer` 方法时恢复它。\n\n### 监听树事件\n\n通常情况下，树组件会与其他组件配对。当用户选择树节点时，某些信息会在另一个窗口中显示。参见图\
  \ 12.29 示例。当用户选择一个类时，该类的实例和静态变量将显示在右侧的文本区域中。\n\n![Figure](img/fig06-33.jpg)类浏览器\n\
  \n要获得这种行为，你需要安装一个 `tree selection listener`（树选择监听器）。该监听器必须实现 `TreeSelectionListener`\
  \ 接口——该接口有一个方法：\n\n```\nvoid valueChanged(TreeSelectionEvent event)\n```\n\n每当用户选择或取消选择树节点时，该方法就会被调用。\n\
  \n以普通方式将监听器添加到树中：\n\n```\ntree.addTreeSelectionListener(listener);\n```\n\n\n\n\
  你可以指定用户是否允许选择单个节点、连续的节点范围或任意的、可能不连续的节点集合。`JTree` 类使用 `TreeSelectionModel` 来管理节点选择。你需要获取该模型，并将选择状态设置为\
  \ `SINGLE_TREE_SELECTION`、`CONTIGUOUS_TREE_SELECTION` 或 `DISCONTIGUOUS_TREE_SELECTION`\
  \ 之一。（不连续选择模式为默认设置）。例如，在我们的类浏览器中，我们希望仅允许选择单个类：\n\n```\nint mode = TreeSelectionModel.SINGLE_TREE_SELECTION;\n\
  tree.getSelectionModel().setSelectionMode(mode);\n```\n\n除了设置选择模式外，你不需要担心树选择模型。\n\
  \n用户如何选择多个项目取决于外观（look-and-feel）。在 Metal 外观中，在按住 `Ctrl` 键的同时点击某个项目可以将其添加到选择中，或者如果该项目当前已被选中，则将其移除。按住\
  \ `Shift` 键的同时点击某个项目可以选择一个项目范围，该范围从上一个选中的项目扩展到新项目。\n\n要查找当前选择，请使用 `getSelectionPaths`\
  \ 方法查询树：\n\n```\nTreePath[] selectedPaths = tree.getSelectionPaths();\n```\n\n如果你将用户限制为单项选择，可以使用方便方法\
  \ `getSelectionPath`，它返回第一个选中的路径，或者在没有选择路径时返回 `null`。\n\n`TreeSelectionEvent` 类有一个\
  \ `getPaths` 方法，返回一个 `TreePath` 对象数组，但该数组描述的是选择的变化，而不是当前的选择。\n\nListing 12.10 显示了类程序的框架类。该程序显示继承层次结构并自定义了显示，用*斜体*显示抽象类。（单元格渲染器请参见\
  \ Listing 12.11）。你可以在框架底部的文本框中输入任何类的名称。按下 `Enter` 键或点击 Add 按钮将该类及其父类添加到树中。你必须输入完整的包名，例如\
  \ `java.util.ArrayList`。\n\n这个程序有点复杂，因为它使用反射来构建类树。这项工作是在 `addClass` 方法内部完成的。（细节并不重要。我们在这个示例中使用类树是因为继承可以了一个无需费力编码的良好的树源。当你在应用程序中显示树时，你将会有自己的层次结构数据源。）该方法使用广度优先搜索算法，通过调用我们在上一节中实现的\
  \ `findUserObject` 方法来查找当前类是否已经在树中。如果该类不在树中，我们将父类添加到树中，然后将新类节点设置为子节点并使节点可见。\n\n\
  当你选择一个树节点时，右侧的文本区域将填充所选类的字段。在框架构造函数中，我们将用户限制为单项选择并添加了一个树选择监听器。当 `valueChanged` 方法被调用时，我们忽略它的事件参数，直接向树请求当前选择路径。一常地，我们需要获取路径的最后一个节点并查找其用户对象。然后我们调用\
  \ `getFieldDescription` 方法，该方法使用反射组合出一个包含所选类所有字段的字符串。\n\n```\ntreeRender/ClassTreeFrame.java\n\
  ```\n\n\n\n\n```java\npackage treeRender;\n\nimport java.awt.*;\nimport java.awt.event.*;\n\
  import java.lang.reflect.*;\nimport java.util.*;\n\nimport javax.swing.*;\nimport\
  \ javax.swing.tree.*;\n\n/**\n * 此框架显示了类树、一个文本字段以及一个用于添加”按钮，\n * 用于向树中添加更多类。\n */\n\
  public class ClassTreeFrame extends JFrame\n{\n   private static final int DEFAULT_WIDTH\
  \ = 400;\n   private static final int DEFAULT_HEIGHT = 300;\n\n   private DefaultMutableTreeNode\
  \ root;\n   private DefaultTreeModel model;\n   private JTree tree;\n   private\
  \ JTextField textField;\n   private JTextArea textArea;\n\n   public ClassTreeFrame()\n\
  \   {\n      setSize(DEFAULT_WIDTH, DEFAULT_HEIGHT);\n\n      // 类树的根节点是 Object\n\
  \      root = new DefaultMutableTreeNode(java.lang.Object.class);\n      model =\
  \ new DefaultTreeModel(root);\n      tree = new JTree(model);\n\n      //添加当前类以向树填充一些数据\n\
  \      addClass(getClass());\n\n      // 设置节点图标\n      var renderer = new ClassNameTreeCellRenderer();\n\
  \      renderer.setClosedIcon(new ImageIcon(getClass().getResource(\"red-ball.gif\"\
  )));\n      renderer.setOpenIcon(new ImageIcon(getClass().getResource(\"yellow-ball.gif\"\
  )));\n      renderer.setLeafIcon(new ImageIcon(getClass().getResource(\"blue-ball.gif\"\
  )));\n      tree.setCellRenderer(renderer);\n\n      // 设置选择模式\n      tree.addTreeSelectionListener(event\
  \ ->\n         {\n            // 用户选择了不同的节点--更新描述\n            TreePath path = tree.getSelectionPath();\n\
  \            if (path == null) return;\n            var selectedNode = (DefaultMutableTreeNode)\
  \ path.getLastPathComponent();\n            Class<?> c = (Class<?>) selectedNode.getUserObject();\n\
  \            String description = getFieldDescription(c);\n            textArea.setText(description);\n\
  \         });\n      int mode = TreeSelectionModel.SINGLE_TREE_SELECTION;\n    \
  \  tree.getSelectionModel().setSelectionMode(mode);\n\n      // 此文本区域持有类描述\n   \
  \   textArea = new JTextArea();\n\n      // 添加树和文本区域\n      var panel = new JPanel();\n\
  \      panel.setLayout(new GridLayout(1, 2));\n      panel.add(new JScrollPane(tree));\n\
  \      panel.add(new JScrollPane(textArea));\n\n      add(panel, BorderLayout.CENTER);\n\
  \n      addTextField();\n   }\n\n   /**\n    * 添加文本字段和“添加”按钮以添加新类。\n    */\n   public\
  \ void addTextField()\n   {\n      var panel = new JPanel();\n\n      ActionListener\
  \ addListener = event ->\n         {\n            // 添加文本字段中名称对应的类\n           \
  \ try\n            {\n               String text = textField.getText();\n      \
  \         addClass(Class.forName(text)); // 清空文本字段表示成功\n               textField.setText(\"\
  \");\n            }\n            catch (ClassNotFoundException e)\n            {\n\
  \               JOptionPane.showMessageDialog(null, \"未找到类\");\n            }\n\
  \         };\n\n      // 新的类名输入到此文本字段\n      textField = new JTextField(20);\n \
  \     textField.addActionListener(addListener);\n      panel.add(textField);\n\n\
  \      var addButton = new JButton(\"Add\");\n      addButton.addActionListener(addListener);\n\
  \      panel.add(addButton);\n\n      add(panel, BorderLayout.SOUTH);\n   }\n\n\
  \   /**\n    * 在树中查找对象。\n    * @param obj 要查找的对象\n    * @return 包含该对象的节点，如果对象不在树中则返回\
  \ null\n    */\n   public DefaultMutableTreeNode findUserObject(Object obj)\n  \
  \ {\n      // 查找包含用户对象的节点\n      var e = (Enumeration<TreeNode>) root.breadthFirstEnumeration();\n\
  \      while (e.hasMoreElements())\n      {\n         var node = (DefaultMutableTreeNode)\
  \ e.nextElement();\n         if (node.getUserObject().equals(obj)) return node;\n\
  \      }\n      return null;\n   }\n\n   /**\n    * 添加一个新类以及任何尚未加入树的父类。\n    * @param\
  \ c 要添加的类\n    * @return 新添加的节点\n    */\n   public DefaultMutableTreeNode addClass(Class<?>\
  \ c)\n   {\n      // 向树中添加新类\n\n      // 跳过非类类型\n      if (c.isInterface() || c.isPrimitive())\
  \ return null;\n\n      // 如果类已经在树中，则返回其节点\n      DefaultMutableTreeNode node =\
  \ findUserObject(c);\n      if (node != null) return node;\n\n      // 类不存在--首先递归添加类的父类\n\
  \n      Class<?> s = c.getSuperclass();\n\n      DefaultMutableTreeNode parent;\n\
  \      if (s == null) parent = root;\n      else parent = addClass(s);\n\n     \
  \ // 将类作为子节点添加到父节点\n      var newNode = new DefaultMutableTreeNode(c);\n      model.insertNodeInto(newNode,\
  \ parent, parent.getChildCount());\n\n      // 使节点可见\n      var path = new TreePath(model.getPathToRoot(newNode));\n\
  \      tree.makeVisible(path);\n\n      return newNode;\n   }\n\n   /**\n    * 返回类的字段描述。\n\
  \    * @param c 要描述的类\n    * @return 包含所有字段类型和名称的字符串\n    */\n   public String getFieldDescription(Class<?>\
  \ c)\n   {\n      // 使用反射查找类型和名称\n      StringBuilder r = new StringBuilder();\n\
  \      Field[] fields = c.getDeclaredFields();\n      for (int i = 0; i < fields.length;\
  \ i++)\n      {\n         Field f = fields[i];\n         if (Modifier.isStatic(f.getModifiers()))\
  \ r.append(\"static \");\n         r.append(f.getType().getName());\n         r.append(\"\
  \ \");\n         r.append(f.getName());\n         r.append(\"\\n\");\n      }\n\
  \      return r.toString();\n   }\n}\n```\n\n```java\npackage treeRender;\n\nimport\
  \ java.awt.*;\nimport java.lang.reflect.*;\nimport javax.swing.*;\nimport javax.swing.tree.*;\n\
  \n/**\n * 此类渲染类名为普通或斜体。抽象类为斜体。\n */\npublic class ClassNameRenderer extends DefaultTreeCellRenderer\n\
  {\n   private Font plainFont = null;\n   private Font italicFont = null;\n\n   public\
  \ Component getTreeComponent(JTree tree, Object value, boolean selected,\n     \
  \    boolean expanded, int row, boolean hasFocus)\n   {\n      super.getTreeComponent(tree,\
  \ value, selected, expanded, row, hasFocus);\n      // 获取用户对象\n      var node =\
  \ (DefaultMutableTreeNode) value;\n      Class<?> c = (Class<?>) node.getUserObject();\n\
  \n      // 第一次调用时，从普通字体派生斜体字体\n      if (plainFont == null)\n      {\n         plainFont\
  \ = getFont();\n         // 单元渲染器有时被调用时字体为空\n         if (plainFont != null) italicFont\
  \ = plainFont.deriveFont(Font.ITALIC);\n      }\n\n      // 如果类是抽象的，设置字体为斜体，否则为普通\n\
  \      if (Modifier.isAbstract(c.getModifiers())) setFont(italicFont);\n      else\
  \ setFont(plainFont);\n      return this;\n   }\n}\n```\n\n`javax.swing.JTree` 1.2\n\
  \n*   `TreePath getSelectionPath()`\n\n*   `TreePath[] getSelectionPaths()`\n\n\
  \    返回第一个选中路径，或所有选中节点的路径数组。如果没有路径被，两个方法都返回 `null`。\n\n`javax.swing.event.TreeSelectionListener`\
  \ 1.2\n\n*   `void valueChanged(TreeSelectionEvent event)`\n\n    当节点被选中或取消选择时会被调用。\n\
  \n`javax.swing.event.TreeSelectionEvent` 1.2\n\n*   `TreePath getPath()`\n\n*  \
  \ `TreePath[] getPaths()`\n\n    获取在此选择事件中发生*变化*的第一个或所有路径。如果你想知道当前选择而不是选择变化，请调用\
  \ `JTree.getSelectionPaths`。\n\n### 自定义树模型\n\n在最后一个示例中，我们实现了一个检查对象内容的程序，就像调试器所做的那样（参见图\
  \ 12.30）。\n\n![图](img/fig06-34.jpg)对象检查树\n\n\n\n\n在继续之前，请编译并运行该示例程序。每个节点对应一个实例字段。如果该字段是一个对象，请展开它以查看其实例字段。程序会检查帧窗口（frame\
  \ window）的内容。如果你尝试查看几个实例字段，你应该能找到一些熟悉的类。你也会对 Swing 用户界面组件在底层的复杂性产生某种敬意。\n\n该程序的非凡之处在于，这棵树并没有使用\
  \ `DefaultTreeModel`。如果你已经有了按层次组织的数据，你可能不想构建一个重复的树，并担心保持两棵树的同步。这正是我们这种情况的情况——被检查的对象已经通过对象引用相互链接，因此没有必要复制这种链接结构。\n\
  \n`TreeModel` 接口只有几个方法。第一组方法允许 `JTree` 通过首先获取根节点，然后获取子节点来查找树节点。`JTree` 类仅在用户实际展开一个节点时才会调用这些方法。\n\
  \n```\nObject getRoot()\nint getChildCount(Object parent)\nObject getChild(Object\
  \ parent, int index)\n```\n\n这个示例展示了为什么 `TreeModel` 接口（同 `JTree` 类本身）不需要显式的节点概念。根节点及其子节点可以是任何对象。`TreeModel`\
  \ 负责告诉 `JTree` 它们是如何连接的。\n\n`TreeModel` 接口的下一个方法是 `getChild` 的反向：\n\n```\nint getIndexOfChild(Object\
  \ parent, Object child)\n```\n\n实际上，这个方法可以通过前三个方法来实现——参见 Listing 12.12 中的代码。\n\n\
  树模型告诉 `JTree` 哪些节点应该作为叶节点显示：\n\n```\nboolean isLeaf(Object node)\n```\n\n如果你的代码更改了树模型，需要通知树以便它可以重绘自己。树会将作为\
  \ `TreeModelListener` 添加到模型。因此，模型必须支持常用的监听器管理方法：\n\n```\nvoid addTreeModelListener(TreeModelListener\
  \ l)\nvoid removeTreeModelListener(TreeModelListener l)\n```\n\n你可以在 Listing 12.13\
  \ 中看到这些方法的实现。\n\n当模型修改树的内容时，它会调用 `TreeModelListener` 接口的四个方法之一：\n\n```\nvoid treeNodesChanged(TreeModelEvent\
  \ e)\nvoid treeNodesInserted(TreeModelEvent e)\nvoid treeNodesRemoved(TreeModelEvent\
  \ e)\nvoid treeStructureChanged(TreeModelEvent e)\n```\n\n`TreeModelEvent` 对象描述了更改的位置。组装描述插入或删除事件的树模型事件细节非常技术。只有当你的树确实可以添加和删除节点时，你才需要担心触发这些事件。在\
  \ Listing 12.12 中，我们展示了如何通过用新对象替换根节点来触发事件。\n\n为了简化事件触发的代码，请使用收集监听器的 `javax.swing.EventListenerList`\
  \ 便利类。Listing 12.13 的最后三个方法展示了如何使用该类。\n\n最后，如果用户编辑了树节点，你的模型将带有更改内容被调用：\n\n```\n\
  void valueForPathChanged(TreePath path, Object newValue)\n```\n\n如果你不允许编辑，此方法将永远不会被调用。\n\
  \n如果你不需要支持编辑，构建树模型是非常简单的。只需实现这三个方法：\n\n```\nObject getRoot()\nint getChildCount(Object\
  \ parent)\nObject getChild(Object parent, int index)\n```\n\n这些方法描述了树的结构。像 Listing\
  \ 12.12 中那样提供其他五个方法的例行实现。然后你就可以准备好显示你的树了。\n\n现在让我们转向示例程序的实现。我们的树将包含 `Variable` 类型的对象。\n\
  \n如果我们使用了 `DefaultTreeModel`，我们的节点将是 `DefaultMutableTreeNode` 类型的对象，其用户对象为 `Variable`\
  \ 类型。\n\n例如，假设你检查变量\n\n```\nEmployee joe;\n```\n\n该变量的类型为 `Employee.class`，名为 `\"\
  joe\"`，并且有一个值——对象引用 `joe` 的值。在 Listing 12.14 中，我们定义了一个 `Variable` 类来描述程序中的变量：\n\n\
  ```\nvar v = new Variable(Employee.class, \"joe\", joe);\n```\n\n如果变量的类型是基本类型，你必须为值使用对象包装器。\n\
  \n```\nnew Variable(double.class, \"salary\", Double.valueOf(salary));\n```\n\n\
  如果变量的类型是一个类，则该变量拥有字段。使用反射，我们枚举所有字段并将它们收集在 `ArrayList` 中。由于 `Class` 类的 `getFields`\
  \ 方法不返回父类的字段，我们需要对所有父类也调用 `getFields`。你可以在 `Variable` 构造函数中找到这些代码。我们 `Variable`\
  \ 类的 `getFields` 方法返回字段数组。最后`Variable` 类的 `toString` 方法格式化节点标签。标签始终包含变量类型和名称。如果变量不是类，标签也包含变量类型和名称。如果类型是数组，标签包含数组的元素。\n\
  \n让我们继续查看模型。前两个方法是简单的：\n\n```java\nObject getRoot()\n{\n   return root;\n}\n\nint\
  \ getChildCount(Object parent)\n{\n   return ((Variable) parent).getFields().size();\n\
  }\n```\n\n`getChild` 方法返回一个新的 `Variable` 对象，用于描述具有给定索引的字段。Listing 12.12 中的这些方法向\
  \ `JTree` 组件揭示了树的结构。其余方法都是例行的——参见 Listing 12.13 中的源码。`getType` 和 `getName` 方法产生字段类型和名称。该方法可能会抛出\
  \ `IllegalAccessException`。这里是 `getChild` 方法完整代码：\n\n```java\npublic Object getChild(Object\
  \ parent, int index)\n{\n   ArrayList fields = ((Variable) parent).getFields();\n\
  \   var f = (Field) fields.get(index);\n   Object parentValue = ((Variable) parent).getValue();\n\
  \   try\n   {\n      return new Variable(f.getType(), f.getName(), f.get(parentValue));\n\
  \   }\n   catch (IllegalAccessException e)\n   {\n      return null;\n   }\n}\n\
  ```\n\n关于这个树模型有一个非凡的事实：它实际上描述了一棵无限树。你可以通过追踪一个 `WeakReference` 对象来验证这一点。点击名为 `referent`\
  \ 的变量。它将直接带你回到原始对象。你得到了一个相同的子树，并且可以再次打开它的 `WeakReference` 对象，无限循环。当然，你不能存储无限节点集；树模型仅在用户展开父节点时按需生成节点。Listing\
  \ 12.12 展示了示例程序的帧类。\n\ntreeModel/ObjectInspectorFrame.java\n\n```java\npackage treeModel;\n\
  \nimport java.awt.*;\nimport javax.swing.*;\n\n/**\n * 此帧持有对象树。\n */\npublic class\
  \ ObjectInspectorFrame extends JFrame\n{\n   private JTree tree;\n   private static\
  \ final int DEFAULT_WIDTH = 400;\n   private static final int DEFAULT_HEIGHT = 300;\n\
  \n   public ObjectInspectorFrame()\n   {\n      setSize(DEFAULT_WIDTH, DEFAULT_HEIGHT);\n\
  \n      // 我们检查此帧对象\n\n      var v = new Variable(getClass(), \"this\", this);\n\
  \      var model = new ObjectTreeModel();\n      model.setRoot(v);\n\n      // 构建并显示树\n\
  \n      tree = new JTree(model);\n      add(new JScrollPane(tree), BorderLayout.CENTER);\n\
  \   }\n}\n```\n\ntreeModel/ObjectTreeModel.java\n\n\n\n\n\n```java\npackage treeModel;\n\
  \nimport java.lang.reflect.*;\nimport java.util.*;\nimport javax.swing.event.*;\n\
  import javax.swing.tree.*;\n\n/**\n * 此树模型描述了 Java 对象的树结构。子节点是存储在 * 实例变量中的对象。\n\
  \ */\npublic class ObjectTreeModel implements TreeModel\n{\n   private Variable\
  \ root;\n   private EventListenerList listenerList = new EventListenerList();\n\n\
  \   /**\n    * 构建一个空树。\n    */\n   public ObjectTreeModel()\n   {\n      root =\
  \ null;\n   }\n\n   /**\n    * 将根设置为给定的变量。\n    * @param v 被此树描述的变量\n    */\n  \
  \ public void setRoot(Variable v)\n   {\n      Variable oldRoot = v;\n      root\
  \ = v;\n      fireTreeStructureChanged(oldRoot);\n   }\n\n   public Object getRoot()\n\
  \   {\n      return root;\n   }\n\n   public int getChildCount(Object parent)\n\
  \   {\n      return ((Variable) parent).getFields().size();\n   }\n\n   public Object\
  \ getChild(Object parent, int index)\n   {\n      ArrayList<Field> fields = ((Variable)\
  \ parent).getFields();\n      var f = (Field) fields.get(index);\n      Object parentValue\
  \ = ((Variable) parent).getValue();\n      try\n      {\n         return new Variable(f.getType(),\
  \ f.getName(), f.get(parentValue));\n      }\n      catch (IllegalAccessException\
  \ e)\n      {\n         return null;\n      }\n   }\n\n   public int getIndexOfChild(Object\
  \ parent, Object child)\n   {\n      int n = getChildCount(parent);\n      for (int\
  \ i = 0; i < n; i++)\n         if (getChild(parent, i).equals(child)) return i;\n\
  \      return -1;\n   }\n\n   public boolean isLeaf(Object node)\n   {\n      return\
  \ getChildCount(node) == 0;\n   }\n\n   public void valueForPathChanged(TreePath\
  \ path, Object newValue)\n   {\n   }\n\n   public void addTreeModelListener(TreeModelListener\
  \ l)\n   {\n      listenerList.add(TreeModelListener.class, l);\n   }\n\n   public\
  \ void removeTreeModelListener(TreeModelListener l)\n   {\n      listenerList.remove(TreeModelListener.class,\
  \ l);\n   }\n\n   protected void fireTreeStructureChanged(Object oldRoot)\n   {\n\
  \      var event = new TreeModelEvent(this, new Object[] { oldRoot });\n      for\
  \ (TreeModelListener l : listenerList.getListeners(TreeModelListener.class))\n \
  \        l.treeStructureChanged(event);\n   }\n}\n```\n\n`treeModel/Variable.java`\n\
  \n```java\npackage treeModel;\n\nimport java.lang.reflect.*;\nimport java.util.*;\n\
  \n/**\n * 具有类型、名称和取值的变量。\n */\npublic class Variable\n{\n   private Class<?> type;\n\
  \   private String name;\n   private Object value;\n   private ArrayList<Field>\
  \ fields;\n\n   /**\n    * 构建一个变量。\n    * @param aType 类型\n    * @param aName 名字\n\
  \    * @param aValue 值\n    */\n   public Variable(Class<?> aType, String aName,\
  \ Object aValue)\n   {\n      type = aType;\n      name = aName;\n      value =\
  \ aValue;\n      fields = new ArrayList<>();\n\n      // 如果我们有类类型，则查找所有字段，但我们不展开字符串\n\
  \      // 和空值\n\n      if (!type.isPrimitive() && !type.isArray() && !type.equals(String.class)\
  \ \n            && value != null)\n      {\n         // 从类及其所有父类中获取字段\n        \
  \ for (Class<?> c = value.getClass(); c != null; c = c.getSuperclass())\n      \
  \   {\n            Field[] fs = c.getDeclaredFields();\n            AccessibleObject.setAccessible(fs,\
  \ true);\n\n            // 获取所有非静态字段\n            for (Field f : fs)\n         \
  \      if (!Modifier.isStatic(f.getModifiers())) fields.add(f);\n         }\n  \
  \    }\n   }\n\n   /**\n    * 获取此变量的值。\n    * @return 值\n    */\n   public Object\
  \ getValue()\n   {\n      return value;\n   }\n\n   /**\n    * 获取此变量的所有非静态字段。\n\
  \    * @return 描述字段的变量列表\n    */\n   public ArrayList<Field> getFields()\n   {\n\
  \      return fields;\n   }\n\n   public String toString()\n   {\n      String r\
  \ = type + \" \" + name;\n      if (type.isPrimitive()) r += \"=\" + value;\n  \
  \    else if (type.equals(String.class)) r += \"=\" + value;\n      else if (value\
  \ == null) r += \"=null\";\n      return r;\n   }\n}\n```\n\n### Advanced AWT\n\n\
  原始 JDK 1.0 有一种非常简单的绘制机制。你选择颜色和绘制模式，并调用 `Graphics` 类的方法如 `drawRect` 或 `fillOval`。2D\
  \ API 是一个更复杂的类，你可以用它完全控制外观。\n\n- 你可以轻松产生各种形状。\n- 你对边界（stroke）有控制权。\n- 你可以使用固色、变化的色调或重复图案来填充形状。\n\
  - 你可以使用变换来移动、缩放、旋转或拉伸形状。\n- 你可以对任意区域进行裁剪。\n- 你可以使用组合规则将新形状与现有像素结合。\n\n要绘制形状，请遵循以下步骤：\n\
  \n1. 获取 `Graphics2D` 类的对象。该类是 `Graphics` 类的子类。自从 1.2 以来，`paint` 和 `paintComponent`\
  \ 方法会自动接收 `Graphics2D` 对象。只需进行转换：\n\n```java\npublic void paintComponent(Graphics\
  \ g)\n{\n   var g2 = (Graphics2D) g;\n   // ...\n}\n```\n\n2. 使用 `setRenderingHints`\
  \ 方法设置 *渲染提示*——速度与绘制质量之间的权衡。\n\n```java\nRenderingHints hints = . . .;\ng2.setRenderingHints(hints);\n\
  ```\n\n3. 使用 `setStroke` 方法设置 *笔触*。笔触绘制轮廓。你可以选择粗细并在实线和虚线之间切换。\n\n```java\nStroke\
  \ stroke = . . .;\ng2.setStroke(stroke);\n```\n\n4. 使用 `setPaint` 方法设置 *填充*。漆料填充笔触或形状内部。你可以创建单色漆料、色调变化的漆料或平铺填充图案。\n\
  \n```java\nPaint paint = . . .;\ng2.setPaint(paint);\n```\n\n5. 使用 `clip` 方法设置 *裁剪区域*。\n\
  \n```java\nShape clip = . . .;\ng2.clip(clip);\n```\n\n\n\n\n6. 使用 `transform` 方法设置从用户空间到设备空间的\
  \ `transformation`（变换）。如果你在自定义坐标系中定义形状比使用像素坐标更方便，请使用变换。\n\n```\nAffineTransform\
  \ transform = . . .;\ng2.transform(transform);\n```\n\n7. 使用 `setComposite` 方法设置\
  \ `composition rule`（组合规则），描述如何将新像素与现有像素结合。\n\n```\nComposite composite = . . .;\n\
  g2.setComposite(composite);\n```\n\n8. 创建一个形状。Java 2D API 提供了许多形状对象和用于组合形状的方法。\n\
  \n```\nShape shape = . . .;\n```\n\n9. 绘制或填充形状。如果你绘制该形状，它的轮廓将被描边；如果你填充该形状，它的内部将会被涂色。\n\
  \n```\ng2.draw(shape);\ng2.fill(shape);\n```\n\n当然，在许多实际情况下，你并不需要所有的步骤。2D 图形上下文的设置有合理的默认值；只有在你想要偏离默认值时，才更改设置。\n\
  \n在接下来的章节中，你将看到如何描述形状、描边、涂色、变换和组合规则。\n\n各种 `set` 方法仅仅是设置 2D 图形上下文的状态。它们不会引起任何绘制操作。同样，当你构造\
  \ `Shape` 对象时，不会发生绘制操作。只有当你调用 `draw` 或 `fill` 时，形状才会被渲染。此时，形状将在 `rendering pipeline`（渲染流水线）中计算（参见图\
  \ 12.31）。\n\n![Figure](img/fig07-01.jpg)渲染流水线\n\n在渲染流水线，渲染形状会执行以下步骤：\n\n1. 对形状的路径进行描边。\n\
  2. 对形状进行变换。\n3. 对形状进行裁剪。如果形状与裁剪区域没有交集，则停止处理。\n4. 填充裁剪后剩余的形状。\n5. 将填充形状的像素与现有像素组合。（在图\
  \ 12.31 中，圆形是现有像素的一部分，而杯形形状叠加在其上。）\n\n在下一节中，你将看到如何定义形状。然后，我们将转向 2D 图形上下文的设置。\n\n\
  ### `java.awt.Graphics2D` 1.2\n\n* `void draw(Shape s)`\n  使用当前的涂色绘制给定形状的轮廓。\n*\
  \ `void fill(Shape s)`\n  使用当前的涂色填充给定形状的内部。\n\n### `Shape` 类层级结构\n\n以下是 `Graphics`\
  \ 类中用于绘制形状的一些方法：\n\n```\ndrawLine\ndrawRectangle\ndrawRoundRect\ndraw3DRect\ndrawPolygon\n\
  drawPolyline\ndrawOval\ndrawArc\n```\n\n还有对应的 `fill` 方法。这些方法自 JDK 1.0 以来一直存在于 `Graphics`\
  \ 类中。Java 2D API 使用了完全不同的面向对象的方法。它不是方法，而是类：\n\n```\nLine2D\nRectangle2D\nRoundRectangle2D\n\
  Ellipse2D\nArc2D\nQuadCurve2D\nCubicCurve2D\nGeneralPath\n```\n\n这些类都实现了 `Shape`\
  \ 接口，我们将在接下来的章节中检查它。\n\n`Line2D`、`Rectangle2D`、`RoundRectangle2D`、`Ellipse2D` 和\
  \ `Arc2D` 类分别对应 `drawLine`、`drawRectangle`、`drawRoundRect`、`drawOval` 和 `drawArc`\
  \ 方法。（“3D 矩形”的概念已经死得其宜——没有与 `draw3DRect` 方法对应的类了。）Java 2D API 提供了两个额外的类——二次曲线和三次曲线，我们将在本节中讨论。没有\
  \ `Polygon2D` 类；相反，`GeneralPath` 类描述由直线、二次曲线和三次曲线组成的路径。你可以使用 `GeneralPath` 来描述多边形，我们将在本节后面展示如何操作。\n\
  \n要绘制形状，首先创建一个实现 `Shape` 接口的类对象，然后调用 `Graphics2D` 类的 `draw` 方法。\n\n这些类：\n\n```\n\
  Rectangle2D\nRoundRectangle2D\nEllipse2D\nArc2D\n```\n\n都继承自一个公共父类 `RectangularShape`。诚然，椭圆弧不是矩形的，但它们有\
  \ `bounding rectangle`（边界矩）（参见图 12.32）。\n\n![Figure](img/fig07-02.jpg)椭圆和弧的边界矩形\n\
  \n每个以“2D”结尾的类都有两个子类，用于指定坐标为 `float` 或 `double`。在第一卷中，你已经遇到过 `Rectangle2D.Float`\
  \ 和 `Rectangle2D.Double`。\n\n相同的方案也适用于其他类，例如 `Arc2D.Float` 和 `Arc2D.Double`。\n\n\
  内部，所有图形类都使用 `float` 坐标，因为 `float` 数字占用的空间较小，且对于几何计算精度足够。然而，Java 语言让处理 `float` 数字变得有些繁琐。因此，图形类的大多数方法使用\
  \ `double` 参数和返回值。只有在构造 `Rectangle2D.Float` 或 `Rectangle2D.Double` 时，你需要在 `float`\
  \ 和 `double` 之间进行选择。例如：\n\n```\nvar floatRect = new Rectangle2D.Float(5F, 10F, 7.5F,\
  \ 15F);\nvar doubleRect = new Rectangle2D.Double(5.0, 10.0, 7.5, 15.0);\n```\n\n\
  `Graphics2D` 类还提供了使用两种类型绘制形状的方法。例如：\n\n```\ng2.draw(floatRect);\ng2.draw(doubleRect);\n\
  ```\n\n`Graphics2D` 类还提供了使用两种类型填充形状的方法。例如：\n\n```\ng2.fill(floatRect);\ng2.fill(doubleRect);\n\
  ```\n\n`Graphics2D` 类还提供了使用两种类型裁剪形状的方法。例如：\n\n```\ng2.clip(floatRect);\ng2.clip(doubleRect);\n\
  ```\n\n`Graphics2D` 类还提供了使用两种类型变换形状的方法。例如：\n\n```\ng2.transform(floatRect);\ng2.transform(doubleRect);\n\
  ```\n\n`Graphics2D` 类还提供了使用两种类型描边形状的方法。例如：\n\n```\ng2.stroke(floatRect);\ng2.stroke(doubleRect);\n\
  ```\n\n`Graphics2D` 类还提供了使用两种类型组合形状的方法。例如：\n\n```\ng2.composite(floatRect);\ng2.composite(doubleRect);\n\
  ```\n\n`Graphics2D` 类还提供了使用两种类型设置形状组合的方法。例如：\n\n```\ng2.setComposite(floatRect);\n\
  g2.setComposite(doubleRect);\n```\n\n`Graphics2D` 类还提供了使用两种类型设置形状变换的方法。例如：\n\n```\n\
  g2.setTransform(floatRect);\ng2.setTransform(doubleRect);\n```\n\n`Graphics2D` 类还提供了使用两种类型设置形状裁剪的方法。例如：\n\
  \n```\ng2.setClip(floatRect);\ng2.setClip(doubleRect);\n```\n\n`Graphics2D` 类还提供了使用两种类型设置形状涂色的方法。例如：\n\
  \n```\ng2.setPaint(floatRect);\ng2.setPaint(doubleRect);\n```\n\n`Graphics2D` 类还提供了使用两种类型设置形状描边的方法。例如：\n\
  \n```\ng2.setStroke(floatRect);\ng2.setStroke(doubleRect);\n```\n\n（注：由于原文中存在大量重复的段落，翻译已根据要求去除了重复内容，仅保留核心逻辑与结构描述。）\n\
  \n内部，所有图形类都使用 `float` 坐标，因为 `float` 数字占用的空间较小，且对于几何计算精度足够。然而，Java 语言让处理 `float`\
  \ 数字变得有些繁琐。因此，图形类的大多数方法使用 `double` 参数和返回值。只有在构造 `Rectangle2D.Float` 或 `Rectangle2D.Double`\
  \ 时，你需要在 `float` 和 `double` 之间进行选择。\n\n\n\n\n```\nskewedAngle = Math.toDegrees(Math.atan2(-y\
  \ * height, x * width));\n```\n\n结果是一个于 `-180` 和 `180` 之间的值。通过这种方式计算偏移的起始角度和结束角度。然后，计算这两个偏移角度之间的差。如果起始角度或差值为负数，则给起始角度加上\
  \ `360`。最后，将起始角度和差传递给弧构造函数。\n\n如果你运行本节末尾的示例程序，可以直观地检查此计算是否弧构造函数产生了正确的值（参见图 12.39）。\n\
  \nJava 2D API 支持二次（`quadratic`）和三次（`cubic`）曲线。在本章中，我们并不探讨这些曲线的数学原理。你可以通过运行列表 12.15\
  \ 中的程序来感受这些曲线的外观。二次曲线由两个`end points`和一个`control point`指定（参见图 12.37）。三次曲线（图 12.38）则有两个控制点。移动控制点会改变曲线的形状。\n\
  \n![Figure](img/fig07-07.jpg)二次曲线![Figure](img/fig07-08.jpg)三次曲线\n\n要构造二次和三次曲线，需要提供端点控制点的坐标。例如：\n\
  \n```\nvar q = new QuadCurve2D.Double(startX, startY, controlX, controlY, endX,\
  \ endY);\nvar c = new CubicCurve2D.Double(startX, startY, control1X, control1Y,\n\
  \   control2X, control2Y, endX, endY);\n```\n\n二次曲线并不灵活，在实践中并不常用。然而，三次曲线（如由 `CubicCurve2D`\
  \ 类绘制的贝塞尔曲线）是非常常见的。通过组合许多三次曲线并使连接点处的斜率匹配，你可以创建出复杂且平滑的弯曲形状。欲需更多信息，请参阅 John F. Hughes\
  \ 等人的著作 *Computer Graphics: Principles and Practice, Third Edition*。\n\n你可以构建任意序列的线段、二次曲线和三次曲线，并将它们存储在一个\
  \ `GeneralPath` 对象中。使用 `moveTo` 方法指定路径的第一个坐标，例如：\n\n```\nvar path = new GeneralPath();\n\
  path.moveTo(10, 20);\n```\n\n然后你可以调用 `lineTo`、`quadTo` 或 `curveTo` 方法之一来扩展路径。这些方法分别通过直线、二次曲线或三次曲线来扩展路径。在调用\
  \ `lineTo` 时，提供端点。对于两个曲线方法，先提供控制点，然后提供端点。例如：\n\n```\npath.lineTo(20, 30);\npath.curveTo(control1X,\
  \ control1Y, control2X, control2Y, endX, endY);\n```\n\n调用 `closePath` 方法关闭路径。它会绘制一条返回路径起点的直线。\n\
  \n要制作一个多边形，只需调用 `moveTo` 到第一个角点点，然后重复调用 `lineTo` 访问其他角点点。最后，调用 `closePath` 关闭多边形。列表\
  \ 12.15 中的程序详细地展示了这一点。\n\n通用路径不需要是连接的。你可以随时调用 `moveTo` 来开始一个新的路径段。\n\n最后，你可以使用 `append`\
  \ 方法将任意 `Shape` 对象添加到通用路径中。形状的轮廓被添加到路径末尾。`append` 方法的第二个参数为 `true`，则新形状应与路径上的上一点连接；否则为\
  \ `false`。例如，调用：\n\n```\nRectangle2D r = . . .;\npath.append(r, false);\n```\n\n\
  会将矩形的轮廓添加到路径中，但不与现有路径连接。但是：\n\n```\npath.append(r, true);\n```\n\n会添加一条从路径端点到矩形起点的直线，然后将矩形轮廓添加到路径中。\n\
  \n列表 12.15 中的程序允许你创建示例路径。从组合框中选择一个形状生成器。程序包含以下形状的生成器：\n\n- 直线\n- 矩形、圆矩形和椭圆\n- 弧（除了弧本身外，还显示边界矩形以及起始和结束角度的线）\n\
  - 多边形（使用 `GeneralPath`）\n- 二次和三次曲线\n\n使用鼠标调整控制点。当你移动它们时，形状会不断重绘。\n\n该程序有点复杂，因为它处理了多种形状并支持拖动控制点。\n\
  \n抽象超类 `ShapeMaker` 封装了形状生成器类的共性。每个形状都有固定数量的用户可以移动的控制点。`getPointCount` 方法返回该值。抽象方法\n\
  \n```\nShape makeShape(Point2D[] points)\n```\n\n根据控制点的当前位置计算实际的形状。`toString` 方法返回类名，以便\
  \ `ShapeMaker` 对象可以简单地放入 `JComboBox` 中。\n\n为了启用控制点的拖拽，`ShapePanel` 类处理了鼠标事件和鼠标移动事件。如果鼠标在矩形上被按下，随后的鼠标拖动将移动矩形。\n\
  \n大多数形状生成器类都是简单的——它们的 `makeShape` 方法只需构造并返回请求的形状。然而，`ArcMaker` 类需要计算偏移的起始和结束角度。此外，为了证明计算确实正确，返回的形状是一个\
  \ `GeneralPath`，其中包含弧本身、边界矩形以及从弧中心到角度控制点的线（参见图 12.39）。\n\n![Figure](img/fig07-09.jpg)`ShapeTest`程序\
  \ shape/ShapeTest.java\n\n\n\n\n\n```java\npackage shape;\n\nimport java.awt.*;\n\
