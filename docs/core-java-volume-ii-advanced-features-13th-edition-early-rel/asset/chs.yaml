  \ Zavgren（Oracle）。\n\nCay Horstmann\n\n德国杜塞尔多夫夫\n\n2023 年 10 月\n\n# Streams\n\n\
  与集合相比，流提供了一种数据视图，允许你在更高的概念层面指定计算任务。通过流，你指定你想做什么，而不是如何做。你将操作的调度交给实现层。例如，假设你想计算某个属性的平均值。你指定数据源和该属性，然后流库就可以优化计算，例如使用多个线程计算总和和计数并合并结果。\n\
  \n在本章中，你将学习如何使用 Java 流库，它允许你以“做什么，而不是怎么做”的风格处理值序列。\n\n## 从迭代到流操作\n\n当你处理集合时，通常会遍历它的元素并对每个元素执行某些操作。例如，假设我们想统计一书中所有的长单词。首先，让我们它们放入一个列表：\n\
  \n```\nString contents = Files.readString(Path.of(\"alice.txt\")); // 读取文件到字符串\n\
  List<String> words = List.of(contents.split(\"\\\\PL+\"));\n   // 分割成单词；非字母字符是分隔符\n\
  ```\n\n现在我们准备好迭代了：\n\n```\nint count = 0;\nfor (String w : words)\n{\n   if (w.length()\
  \ > 12) count++;  \n}\n```\n\n使用流，相同的操作看起来如下：\n\n```\nlong count = words.stream()\n\
  \   .filter(w -> w.length() > 12)\n   .count();\n```\n\n现在，你不需要扫描循环来寻找过滤和计数的证据了。方法名会立即告诉你代码的意图。此外，循环以详尽细节规定了操作顺序，而流能够以它任何想要的方式调度操作，只要结果正确即可。\n\
  \n只需将 `stream` 改为 `parallelStream`，即可允许流库并行执行过滤和计数。\n\n```\nlong count = words.parallelStream()\n\
  \   .filter(w -> w.length() > 12)\n   .count();\n```\n\n流遵循“做什么，而不是怎么做”的原则。在我们的流示例中，我们描述了需要做什么：获取长单词并计数。我们没有指定应该以什么顺序或在哪个线程中执行。相反，本节开头的循环精确地指定了计算应该如何工作，从而放弃了任何优化机会。\n\
  \n流在表面上与集合相似，允许你转换和检索数据。但它们之间存在显著差异：\n\n1. 流不存储其元素。元素可能存储在底层集合中或按需生成。\n\n2. 流操作不会改变其源。例如，`filter`\
  \ 方法不会从流中删除元素，而是产生一个不包含这些元素的新流。\n\n3. 流操作在可能的情况下是*惰性的*（lazy）。这意味着在结果被需要之前，它们不会执行。\n\
  \n\n\n\n你已经看到，可以通过 `Collection` 接口的 `stream` 方法将任何集合转换为流。如果你有一个数组，请改用静态的 `Stream.of`\
  \ 方法。\n\n```\nStream<String> words = Stream.of(contents.split(\"\\\\PL+\"));\n \
  \  // split 返回一个 String[] 数组\n```\n\n`of` 方法有一个可变长度参数，因此你可以从任意数量的参数构造流：\n\n```\n\
  Stream<String> song = Stream.of(\"gently\", \"down\", \"the\", \"stream\");\n```\n\
  \n使用 `Arrays.stream(array, from, to)` 从数组的局部创建一个流。\n\n要创建一个不任何元素的流，请使用静态的 `Stream.empty`\
  \ 方法：\n\n```\nStream<String> silence = Stream.empty();\n   // 泛型类型 <String> 被自动推断；等同于\
  \ Stream.<String>empty()\n```\n\n`Stream` 接口有两个静态方法用于创建无限流。`generate` 方法接收一个无参数的函数（或者从技术上讲，是一个\
  \ `Supplier<T>` 接口的对象）。每当需要流的值时，就会调用该函数来产生一个值。你可以获取一个常量值流：\n\n```\nStream<String>\
  \ echos = Stream.generate(() -> \"Echo\");\n```\n\n或者获取一个随机数流：\n\n```\nStream<Double>\
  \ randoms = Stream.generate(Math::random);\n```\n\n要产生诸如 `0 1 2 3 . . .` 的序列，请改用\
  \ `iterate` 方法。它接收一个“种子”值和一个函数（技术上讲，是一个 `UnaryOperator<T>`），并重复将该函数应用于上一个结果。例如：\n\
  \n```\nStream<BigInteger> integers\n   = Stream.iterate(BigInteger.ZERO, n -> n.add(BigInteger.ONE));\n\
  ```\n\n序列中的第一个元素是种子 `BigInteger.ZERO`。第二个元素是 `f(seed)`，它产生 `1`（作为一个大整数）。下一个元素是 `f(f(seed))`，它产生\
  \ `2`，依此类推。\n\n要产生一个有限流，请添加一个谓词来指定迭代何时何结束：\n\n```\nvar limit = new BigInteger(\"\
  10000000\");\nStream<BigInteger> integers\n   = Stream.iterate(BigInteger.ZERO,\n\
  \      n -> n.compareTo(limit) < 0,\n      n -> n.add(BigInteger.ONE));\n```\n\n\
  一旦谓词拒绝了迭代生成的值，流就会结束。\n\n最后，`Stream.ofNullable` 方法可以根据对象创建一个非常短的流。如果对象为 `null`，流的长度为\
  \ 0；否则长度为 1，且包含该对象。这在与 `flatMap` 配合时非常有用——参见第 1.7.7 节 的示例。\n\nJava API 中的许多方法都会产生流。例如，`String`\
  \ 类有一个 `lines` 方法，产生包含字符串中行的流：\n\n```\nStream<String> greetings = \"Hello\\nGuten\
  \ Tag\\nBonjour\".lines();\n```\n\n`Pattern` 类有一个方法 `splitAsStream`，它可以使用正则表达式拆分\
  \ `CharSequence`。你可以使用以下语句将字符串拆分为单词：\n\n```\nStream<String> words = Pattern.compile(\"\
  \\\\PL+\").splitAsStream(contents);\n```\n\n`Scanner.tokens` 方法产生一个扫描器的标记流。从字符串获取单词流的另一种方法是：\n\
  \n```\nStream<String> words = new Scanner(contents).tokens();\n```\n\n静态方法 `Files.lines`\
  \ 返回一个文件中所有行的 `Stream`：\n\n```\ntry (Stream<String> lines = Files.lines(path))\n\
  { \n   Process lines \n}\n```\n\n注意，`try`-with-resources 块对于关闭文件是必要的。\n\n在 Java\
  \ API 中以流的形式提供数据越来越常见。例如，Java 21 添加了一个静态的 `availableLocales` 方法，产生一个 `Locale` 对象的流。\n\
  \n要产生一个有限流，你始终可以将元素添加到列表中，然后将其转换为流。`Stream.Builder` 接口在此目的上效率略高：\n\n```\nStream<Integer>\
  \ digits(int n)\n{\n   Stream.Builder<Integer> builder = Stream.builder();\n   while\
  \ (n != 0)\n   {\n      builder.add(n % 10);\n      n = n / 10;\n   }\n   return\
  \ builder.build();\n}\n```\n\n要查看本节引入的流之一的内容，请使用 `toList` 方法，它会将流的元素收集到一个列表中。像 `count`\
  \ 一样，`toList` 是一个终端操作。如果流是无限的，请先用 `limit` 方法对其截断：\n\n```\nSystem.out.println(Stream.generate(Math::random).limit(10).toList());\n\
  ```\n\n为了将 `Iterator` 或不是集合的通用 `Iterable` 转换为流，你需要使用针对 `spliterators` 的辅助方法。`spliterator`\
  \ 类似于 `iterator`，但它可以被拆分，使得每个生成的 `spliterator` 产生部分元素。这种拆分用于并行处理元素——参见第 1.14 节。\n\
  \n如果你有一个 `Iterator` 并想要其结果的流，请使用：\n\n```\nStreamSupport.stream(Spliterators.spliteratorUnknownSize(\n\
  \   iterator, Spliterator.ORDERED), false);\n```\n\n如果你有一个不是集合的 `Iterable`，可以通过调用以下方法将其转换为流：\n\
  \n```\nStreamSupport.stream(iterable.spliterator(), false);\n```\n\n在执行流操作时，不要修改流的集合是非常重要的。记住，流并不收集数据——数据始终在独立的集合中。如果你修改了该集合，流操作的结果将变得未知。JDK\
  \ 文档将这一要求称为 `noninterference`（非干扰）。\n\n准确来说，由于中间流操作是惰性的，因此在终端操作执行之前可能修改集合。例如，以下代码虽然不推荐，但可以运行：\n\
  \n```\nList<String> wordList = . . .;\nStream<String> words = wordList.stream();\n\
  wordList.add(\"END\");\nlong n = words.distinct().count();\n```\n\n但这段代码是错误的：\n\n\
  ```\nStream<String> words = wordList.stream();\nwords.forEach(s -> {if (s.length()\
  \ < 12) wordList.remove(s);});\n   // ERROR--interference\n```\n\n列表 1.2 中的示例程序展示了创建流的各种方法。\n\
  \n```java\nstreams/CreatingStreams.java\n```\n\n\n\n\n```java\npackage streams;\n\
  \nimport java.io.*;\nimport java.math.*;\nimport java.nio.file.*;\nimport java.util.*;\n\
  import java.util.regex.Pattern;\nimport java.util.stream.*;\n\n/**\n * @version\
  \ 1.03 2021-09-06\n * @author Cay Horstmann\n */\npublic class CreatingStreams\n\
  {\n   public static <T> void show(String title, Stream<T> stream)\n   {\n      final\
  \ int SIZE = 10;\n      List<T> firstElements = stream\n         .limit(SIZE + 1)\n\
  \         .toList();\n      System.out.print(title + \": \");\n      for (int i\
  \ = 0; i < firstElements.size(); i++)\n      {\n         if (i > 0) System.out.print(\"\
  , \");\n         if (i < SIZE) System.out.print(firstElements.get(i));\n       \
  \  else System.out.print(\"...\");\n      }\n      System.out.println();\n   }\n\
  \n   public static void main(String[] args) throws IOException\n   {\n      Path\
  \ path = Path.of(\"../gutenberg/alice30.txt\");\n      String contents = Files.readString(path);\
  \      \n      Stream<String> words = Stream.of(contents.split(\"\\\\PL+\"));\n\n\
  \      show(\"words\", words);\n      Stream<String> song = Stream.of(\"gently\"\
  , \"down\", \"the\", \"stream\");\n      show(\"song\", song);\n      Stream<String>\
  \ silence = Stream.empty();\n      show(\"silence\", silence);\n\n      Stream<String>\
  \ echos = Stream.generate(() -> \"Echo\");\n      show(\"echos\", echos);\n\n  \
  \    Stream<Double> randoms = Stream.generate(Math::random);\n      show(\"randoms\"\
  , randoms);\n\n      Stream<BigInteger> integers = Stream.iterate(BigInteger.ONE,\n\
  \         n -> n.add(BigInteger.ONE));\n      show(\"integers\", integers);\n\n\
  \      Stream<String> greetings = \"Hello\\nGuten Tag\\nBonjour\".lines();\n   \
  \   show(\"greetings\", greetings);\n\n      Stream<String> wordsAnotherWay = Pattern.compile(\"\
  \\\\PL+\").splitAsStream(contents);\n      show(\"wordsAnotherWay\", wordsAnotherWay);\n\
  \n      try (Stream<String> lines = Files.lines(path))\n      {\n         show(\"\
  lines\", lines);\n      }\n\n      Iterable<Path> iterable = FileSystems.getDefault().getRootDirectories();\n\
  \      Stream<Path> rootDirectories = StreamSupport.stream(iterable.spliterator(),\
  \ false);\n      show(\"rootDirectories\", rootDirectories);\n\n      Iterator<Path>\
  \ iterator = Path.of(\"/usr/share/dict/words\").iterator();\n      Stream<Path>\
  \ pathComponents = StreamSupport.stream(Spliterators.spliteratorUnknownSize(\n \
  \        iterator, Spliterator.ORDERED), false);  \n      show(\"pathComponents\"\
  , pathComponents);\n   }\n}\n```\n\n### java.util.stream.Stream 8\n\n* `static <T>\
  \ Stream<T> of(T... values)`\n  产生一个元素为给定值的流。\n\n* `static <T> Stream<T> empty()`\n\
  \  产生一个没有元素的流。\n\n* `static <T> Stream<T> generate(Supplier<T> s)`\n  产生一个无限流，其元素通过重复调用函数\
  \ `s` 构建。\n\n* `static <T> Stream<T> iterate(T seed, UnaryOperator<T> f)`\n\n* `static\
  \ <T> Stream<T> iterate(T seed, Predicate<? super T> hasNext, UnaryOperator<T> f)`\n\
  \  产生一个流，其元素为 `seed`、对 `seed` 调用 `f`、对前一个元素调用 `f` 等以此类推。第一种方法产生一个无限流。第二种方法的流在第一个不满足\
  \ `hasNext` 谓词的元素之前结束。\n\n* `static <T> Stream<T> ofNullable(T t)`\n  如果 `t` 为 `null`\
  \ 则返回一个空流，否则返回包含 `t` 的流。\n\n### java.util.Spliterators 8\n\n* `static <T> Spliterator<T>\
  \ spliteratorUnknownSize(Iterator<? extends T> iterator, int characteristics)`\n\
  \  将迭代器转换为未知大小的可拆分迭代器，并具有给定的特征（一个包含 `Spliterator.ORDERED` 等常量的位模式）。\n\n### java.util.Arrays\
  \ 1.2\n\n* `static <T> Stream<T> stream(T[] array, int startInclusive, int endExclusive)`\n\
  \  产生一个元素为数组指定范围的流。\n\n### java.lang.String\n\n* `static Stream<String> lines()`\n\
  \  产生一个其元素为该字符串各行的流。\n\n### java.util.regex.Pattern 1.4\n\n* `Stream<String> splitAsStream(CharSequence\
  \ input)`\n  产生一个流，其元素为由此模式分隔的输入部分。\n\n### java.nio.file.Files 7\n\n* `static Stream<String>\
  \ lines(Path path)`\n\n* `static Stream<String> lines(Path path, Charset cs)`\n\
  \  产生一个流，其元素为指定文件的行，使用 UTF-8 字符集指定的字符集。\n\n### java.util.stream.StreamSupport 8\n\
  \n* `static <T> Stream<T> stream(Spliterator<T> spliterator, boolean parallel)`\n\
  \  从给定的拆分器产生流。\n\n### java.lang.Iterable\n\n* `Spliterator<T> spliterator()`\n \
  \ 返回一个支持此 Iterable 元素的拆分器。\n\n### java.util.Iterator\n\n* `boolean hasNext()`\n\
  \  如果迭代器还有更多元素则返回 true。\n\n* `T next()`\n  返回下一个元素。\n\n### java.util.Spliterators\n\
  \n* `static <T> Spliterator<T> spliteratorUnknownSize(Iterator<? extends T> iterator,\
  \ int characteristics)`\n  将迭代器转换为未知大小的拆分器。\n\n### java.util.stream.Spliterator\n\
  \n* `int ORDERED`\n  指示元素具有定义顺序常量。\n\n### java.util.function.Supplier\n\n* `T get()`\n\
  \  返回由提供者操作的结果。\n\n### java.util.function.UnaryOperator\n\n* `T apply(T t)`\n  接受一个输入参数并返回结果的函数。\n\
  \n### java.util.function.Predicate\n\n* `boolean test(T t)`\n  如果给定参数匹配该谓词表示则返回\
  \ true。\n\n### java.util.function.Consumer\n\n* `void accept(T t)`\n  对给定参数执行操作。\n\
  \n### java.util.Scanner\n\n* `String next()`\n  返回输入的下一个标记。\n\n* `void useDelimiter(String\
  \ pattern)`\n  设置用于分隔标记的模式。\n\n### `filter`、`map` 和 `flatMap` 方法\n\n#### `filter`\n\
  偶尔，当使用 `filter` 时，会对每个元素应用一个函数，结果是一个符合条件的新流。我们已经见过 `filter` 转换。例如，考虑一个长单词流：\n\n\
  ```java\nStream<String> longWords = words.stream().filter(w -> w.length() > 1);\n\
  ```\n\n#### `map`\n通常，你想要转换值。使用 `map` 方法。例如，你可以将所有单词转换为小写：\n\n```java\nStream<String>\
  \ lowercaseWords = words.stream().map(String::toLowerCase);\n```\n\n在这里，我们使用方法引用使用了\
  \ `map`。通常，你会使用 Lambda 表达式：\n\n```java\nStream<Character> firstCodeUnits = words.stream().map(s\
  \ -> s.charAt(0));\n```\n\n结果流包含每个单词的第一个字符。\n\n#### `flatMap`\n当你使用 `map` 时，函数返回一个流。现在让我们在字符串流上映射这样的\
  \ `graphemeClusters` 方法：\n\n```java\nStream<Stream<String>> result = words.stream().map(w\
  \ -> graphemeClusters(w));\n```\n\n你会得到一个流的流。要将其展平为单个流 `[. . \"y\", \"o\", \"u\"\
  , \"r\", \"b\", \"o\", \"a\", \"t\", . .]`，请使用 `flatMap` 方法代替 `map`：\n\n```java\n\
  Stream<String> flatResult = words.stream().flatMap(w -> graphemeClusters(w));\n\
  // 对每个单词调用 graphemeClusters 并展平结果\n```\n\n\n\n\n让我们通过示例来完成。以下循环会生成字符串 `s` 的字符簇（grapheme\
  \ clusters）：\n\n```\nBreakIterator iter = BreakIterator.getCharacterInstance();\n\
  . . .\niter.setText(s);\nint start = iter.first();\nint end = iter.next();\nwhile\
  \ (end != BreakIterator.DONE) {\n   String gc = s.substring(start, end);\n   start\
  \ = end;\n   end = iter.next();\n   // 对 gc 进行某些操作\n}\n```\n\n调用 `mapMulti` 时，你提供一个函数，该函数会被流流元素和收集器（collector）调用。在你的函数中，将结果传递给收集器。\n\
  \n```\nStream<String> result = words.stream().mapMulti((s, collector) ->\n   {\n\
  \      iter.setText(s);\n      int start = iter.first();\n      int end = iter.next();\n\
  \      while (end != BreakIterator.DONE)\n      {\n         String gc = s.substring(start,\
  \ end);\n         start = end;\n         end = iter.next();\n         collector.accept(gc);\n\
  \      }\n   });\n```\n\njava.util.stream.Stream 8\n\n*   `Stream<T> filter(Predicate<?\
  \ super T> predicate)`\n    产生一个包含此流中满足谓词的元素的流。\n\n*   `<R> Stream<R> map(Function<?\
  \ super T,? extends R> mapper)`\n    产生一个包含对此流中的元素应用 `mapper` 结果的流。\n\n*   `<R>\
  \ Stream<R> flatMap(Function<? super T,? extends Stream<? extends R>> mapper)`\n\
  \    产生一个通过连接对此流中的元素应用 `mapper` 的结果而得到的流。（注意每个 `mapper` 结果都是一个流。）\n\n*   `<R> Stream<R>\
  \ mapMulti(BiConsumer<? super T,? super Consumer<R>> mapper)` 16\n    对于每个流元素，都会调用\
  \ `mapper`，并在调用期间传递给 `Consumer` 的所有元素都会被添加到结果流中。\n\n## 提取子流和合并流\n\n调用 `stream.limit(n)`\
  \ 返回一个新的新流，该流在 `n` 个元素之后结束（或者如果原始流较短，则在原始流结束时结束）。该方法对于将无限流截断为特定大小特别有用。例如，\n\n```\n\
  Stream<Double> randoms = Stream.generate(Math::random).limit(100);\n```\n产生一个包含\
  \ 100 个随机数的流。\n\n调用 `stream.skip(n)` 的操作完全相反。它丢弃前 `n` 个元素。这在我们的书籍阅读示例中非常有用，由于 `split`\
  \ 方法的工作方式，第一个元素是一个不需要的空字符串。我们可以通过调用 `skip` 来让它消失：\n\n```\nStream<String> words =\
  \ Stream.of(contents.split(\"\\\\PL+\")).skip(1);\n```\n\n`stream.takeWhile(predicate)`\
  \ 调用在谓词为 `true` 时获取流中的所有元素，然后停止。\n\n例如，假设我们使用前一节的 `graphemeClusters` 方法将字符串拆分为字符，并且我们想要收集所有的初始数字。`takeWhile`\
  \ 方法可以做到这一点：\n\n```\nStream<String> initialDigits = graphemeClusters(str).takeWhile(\n\
  \   s -> \"0123456789\".contains(s));\n```\n\n`dropWhile` 方法执行相反的操作，在条件为 `true`\
  \ 时丢弃元素，并产生一个从第一个条件为 `false` 的元素开始的所有元素的流。例如，\n\n```\nStream<String> withoutInitialWhiteSpace\
  \ = graphemeClusters(str).dropWhile(\n   s -> s.strip().length() == 0);\n```\n\n\
  你可以使用 `Stream` 类的静态方法 `concat` 合并两个流：\n\n```\nStream<String> combined = Stream.concat(\n\
  \   graphemeClusters(\"Hello\"), graphemeClusters(\"World\"));\n   // 产生流 [\"H\"\
  , \"e\", \"l\", \"l\", \"o\", \"W\", \"o\", \"r\", \"l\", \"d\"]\n```\n当然，第一个流不应该是无限的——否则第二个流永远没有机会。\n\
  \njava.util.stream.Stream 8\n\n*   `Stream<T> limit(long maxSize)`\n    产生一个包含此流中最多\
  \ `maxSize` 个初始元素的流。\n\n*   `Stream<T> skip(long n)`\n    产生一个流，其元素是此流除初始 `n` 个元素以外的所有元素。\n\
  \n*   `Stream<T> takeWhile(Predicate<? super T> predicate)` 9\n    产生一个流，其元素是此流中满足谓词的初始元素。\n\
  \n*   `Stream<T> dropWhile(Predicate<? super T> predicate)` 9\n    产生一个流，其元素是此流除满足谓词的初始元素以外的所有元素。\n\
  \n*   `static <T> Stream<T> concat(Stream<? extends T> a, Stream<? extends T> b)`\n\
  \    产生一个流，其元素是 `a` 的元素后跟 `b` 的元素。\n\n## 其他流转换\n\n`distinct` 方法返回一个流，产生产生原始流中的元素，顺序保持相同，但抑制了重复项。重复项不需要相邻相邻。\n\
  \n```\nStream<String> uniqueWords\n   = Stream.of(\"merrily\", \"merrily\", \"merrily\"\
  , \"gently\").distinct();\n```\n对流进行排序，有 `sorted` 的几种变体。一种适用于 `Comparable`，另一个接受\
  \ `Comparator`。第一种要求元素是 `Comparable` 实例。第二种允许你指定排序逻辑：\n\n```\nStream<String> longestFirst\n\
  \   = words.stream().sorted(Comparator.comparing(String::length).reversed());\n\
  ```\n与所有转换一样，`peek` 方法返回一个新的流。这对于调试很有用。如果你只想知道流中某一点发生了什么，添加\n\n```\n.peek(x -> {\n\
  \      return;\n})\n```\n并在第二行设置断点。\n\njava.util.stream.Stream 8\n\n*   `Stream<T>\
  \ distinct()`\n    产生此流的去重元素的流。\n\n*   `Stream<T> sorted()`\n\n*   `Stream<T> sorted(Comparator<?\
  \ super T> comparator)`\n    产生一个元素按排序顺序的流。\n\n*   `Stream<T> peek()`\n    产生一个与此流元素相同的流，在消费每个元素时将其传递给\
  \ `action`。\n\n## 归约\n\n现在你已经知道了如何创建和转换流，我们终于到了最重要的部分——从流数据中获取答案。本节涵盖的方法被称为“归约”（reductions）。归约是终端操作。它们将流归约为非流值，该值可以在你的程序中使用。\n\
  \n你已经见过一个简单的归约：返回流元素数量的 `count` 方法。\n\n其他简单的归约是 `max` 和 `min`，它们返回最大或最小值。有一个转折——这些方法返回一个\
  \ `Optional<T>` 值，该值封装了答案，或者表示没有（因为流恰好是空的）。在过去，在这种情况下通常会返回 `null`。但 `Optional` 类型是指示缺失返回值的更好方式。我们将在下一节中详细讨论\
  \ `Optional` 类型。以下是你可以获取流的最大值：\n\n```\nOptional<String> largest = words.max(String::compareToIgnoreCase);\n\
  System.out.println(\"largest: \" + largest.orElse(\"\"));\n```\n\n\n\n`findFirst`\
  \ 返回非空集合中的第一个值。它在与 `filter` 结合使用时非常有用。例如，在这里我们找到第一个以字母 Q 开头的单词，如果存在的话：\n\n```\n\
  Optional<String> startsWithQ\n   = words.filter(s -> s.startsWith(\"Q\")).findFirst();\n\
  ```\n\n如果你可以接受任何匹配项，而不仅仅是第一个，请使用 `findAny` 方法。在对流（stream）进行并行处理时这种方法非常有效，因为流可以报告它找到的任何匹配项，而不是受限于第一个。\n\
  \n```\nOptional<String> startsWithQ\n   = words.parallel().filter(s -> s.startsWith(\"\
  Q\")).findAny();\n```\n\n如果你只想知道是否存在匹配项，请使用终端操作 `anyMatch`：\n\n```\nboolean aWordStartsWithQ\n\
  \   = words.parallel().anyMatch(s -> s.startsWith(\"Q\"));\n```\n\n还有 `allMatch`\
  \ 和 `noneMatch` 方法在所有元素或没有元素匹配谓词时返回 `true`。这些方法同样在并行运行时也能获益。\n\n`java.util.stream.Stream`\
  \ 8\n\n- `Optional<T> max(Comparator<? super T> comparator)`\n  使用给定的比较器返回此流中的最大元素，如果流为空，则返回一个空的\
  \ `Optional`。\n- `Optional<T> min(Comparator<? super T> comparator)`\n  使用给定的比较器返回此流中的最小元素，如果流为空，则返回一个空的\
  \ `Optional`。\n- `Optional<T> findFirst()`\n  返回流中的第一个元素，如果流为空，则返回一个空的 `Optional`。\n\
  - `Optional<T> findAny()`\n  返回流中的任意元素，如果流为空，则返回一个空的 `Optional`。\n- `boolean anyMatch(Predicate<?\
  \ super T> predicate)`\n  如果有任何元素匹配谓词，则返回 `true`。\n- `boolean allMatch(Predicate<?\
  \ super T> predicate)`\n  如果所有元素都匹配谓词，则返回 `true`。\n- `boolean noneMatch(Predicate<?\
  \ super T> predicate)`\n  如果没有元素匹配谓词，则返回 `true`。\n\n## Optional 类型\n\n`Optional<T>`\
  \ 对象是对 `T` 类型对象或无对象的包装。在前者的情况下，我们说值是呈现的。`Optional<T>` 类型设计用于作为 `T` 类型引用的 `null`\
  \ 更安全的替代方案。但只有当你正确使用它时才是安全的。接下来的章节将展示。\n\n### 获取 Optional 值\n\n有效使用 `Optional` 的关键在于值不存在时使用一个替代方案。在本节中，我们查看第一种策略。通常，当没有匹配时，你会使用一个默认值：\n\
  \n```\nString result = optionalString.orElse(\"\");\n// 返回包装的字符串，如果为空\n```\n\n你也可以调用代码来计算默认值：\n\
  \n```\nString result = optionalString.orElseGet(() -> System.getProperty(\"myapp.default\"\
  ));\n// 只有在需要时才调用函数\n```\n\n或者，如果没有值，你可以抛出一个异常：\n\n```\nString result = optionalString.orElseThrow(IllegalStateException::new);\n\
  // 返回异常对象\n```\n\n`java.util.Optional` 8\n\n- `T orElse(T other)`\n  返回此 `Optional`\
  \ 的值，如果此 `Optional` 为空，则返回 `other`。\n- `T orElseGet(Supplier<? extends T> other)`\n\
  \  返回此 `Optional` 的值，如果此 `Optional` 为空，则返回调用 `other` 的结果。\n- `<X extends Throwable>\
  \ T orElseThrow(Supplier<? extends X> exceptionSupplier)`\n  返回此 `Optional` 的值，如果此\
  \ `Optional` 为空，则抛出调用 `exceptionSupplier` 的结果。\n\n### 消费 Optional 值在前节中，你了解了在值不存在时产生替代方案。处理可选值的另一种策略是仅在值存在时消费它。`ifPresent`\
  \ 方法接受一个函数。如果可选值存在，则将其传递给该函数。否则，什么都不会发生。\n\n```\noptionalValue.ifPresent(v -> Process\
  \ v);\n```\n\n例如，如果值存在，你想将值添加到集合中，调用：\n\n```\noptionalValue.ifPresent(v -> results.add(v));\n\
  ```\n\n或者简单地：\n\n```java\noptionalValue.ifPresent(results::add);\n```\n\n如果你想在 `Optional`\
  \ 有值时执行一个操作，在没有值时执行另一个操作，使用 `ifPresentOrElse`：\n\n```java\noptionalValue.ifPresentOrElse(\n\
  \   v -> System.out.println(\"Found \" + v),\n   () -> logger.warning(\"No match\"\
  ));\n```\n\n`java.util.Optional` 8\n\n- `void ifPresent(Consumer<? super T> action)`\n\
  \  如果此 `Optional` 不为空，则将其值传递给 `action`。\n- `void ifPresentOrElse(Consumer<? super\
  \ T> action, Runnable emptyAction)` 9\n  如果此 `Optional` 不为空，则将其值传递给 `action`，否则调用\
  \ `emptyAction`。\n\n### Optional 管道处理\n\n在前面的节中，你了解了如何从 `Optional` 对象中获取值。另一个有效的策略是保持\
  \ `Optional` 完整。你可以通过 `map` 方法转换 `Optional` 内部的值：\n\n```\nOptional<Path> transformed\
  \ = optionalString.map(Path::of);\n```\n\n如果 `optionalString` 是空的，`transformed`\
  \ 也是空的。同样，你可以使用 `flatMap` 来展平嵌套的 `Optional` 值：\n\n```\nOptional<Path> transformed\
  \ = optionalString.flatMap(path -> Optional.of(path.getParent()));\n```\n\n你还可以使用\
  \ `filter` 仅考虑符合某个属性的 `Optional` 值。\n\n```\nOptional<String> result = optionalString.filter(s\
  \ -> s.endsWith(\".txt\"));\n```\n\n`or` 方法在 `Optional` 为空时提供一个替代方案。如果不为空，则求值 lambda\
  \ 表达式。\n\n`java.util.Optional` 8\n\n- `<U> Optional<U> map(Function<? super T,?\
  \ extends U> mapper)`\n  产生一个 `Optional`，其值通过将给定的函数应用于此 `Optional` 的值来获得，否则返回一个空的\
  \ `Optional`。\n- `Optional<T> filter(Predicate<? super T> predicate)`\n  如果此 `Optional`\
  \ 满足谓词，则返回包含该值的 `Optional`，否则返回一个空的 `Optional`。\n- `Optional<T> or(Supplier<? extends\
  \ Optional<? T>> supplier)` 9\n  如果此 `Optional` 不为空，则返回它，否则返回由 `supplier` 产生的那个。\n\
  \n## 如何处理 Optional 值\n\n如果你不正确使用 `Optional` 值，那么它比过去的“某些或 `null`”方法没有用处。\n\n`get`\
  \ 方法在 `Optional` 值存在时获取其包装的元素，如果不存在则抛出 `NoSuchElementException`。因此：\n\n```\nOptional<T>\
  \ optionalValue = . . .;\noptionalValue.get().someMethod()\n```\n\n并不如下面安全：\n\n\
  ```\nT value = . . .;\nvalue.someMethod();\n```\n\n`isPresent` 和 `isEmpty` 方法报告\
  \ `Optional<T>` 对象是否有值。但是：\n\n```\nif (optionalValue.isPresent()) optionalValue.get().someMethod();\n\
  ```\n\n并不比下面更容易编写。\n\n如果你发现自己正在使用 `get`、`isPresent` 或 `isEmpty` 方法，尝试重新思考你的方法，并使用前面两个节的策略。\n\
  \n`orElseThrow` 方法是 `get` 方法一个听起来更可怕的同义词。当你调用 `optionalValue.orElseThrow().someMethod()`\
  \ 时，它明确了如果 `optionalValue` 为空，将会发生异常。希望程序员只有在绝对确定不会发生这种情况时才使用 `orElseThrow`。\n\n\
  这里更多关于正确使用 `Optional` 类型的建议：\n\n*   `Optional` 类型的变量*绝不*应该是 `null`。\n\n\n\n\n\n\
  - 不要使用 `Optional` 类型的字段。这会产生额外的对象代价。在类内部，如果字段缺失请使用 `null`。为了不鼓励使用 `Optional` 字段，该类被设置为不可序列化。\n\
  - `Optional` 类型的方法参数是值得商榷的。在请求的值存在的常见情况下，它们会让调用变得不愉快。相反，可以考虑为方法提供两个重载版本：一个带参数，一个不带参数。（另一方面，返回一个\
  \ `Optional` 是可以的。它是指示函数可能没有结果的正确方式。）\n- 不要将 `Optional` 对象放入集合（set）中，也不要将其作为映射（map）的键。相反，直接收集这些值。\n\
  \n#### `java.util.Optional` 8\n\n- `T get()`\n- `T orElseThrow()` 10\n  返回此 `Optional`\
  \ 的值，如果为空，则抛出 `NoSuchElementException`。\n- `boolean isEmpty()` 11\n- `boolean isPresent()`\n\
  \  如果此 `Optional` 为空或不为空，则返回 `true`。\n\n### 创建 Optional 值\n\n到为止，我们讨论了如何使用他人创建的\
  \ `Optional` 对象。如果你想编写一个创建 `Optional` 对象的方法，有几个静态方法用于此目的，包括 `Optional.of(result)`\
  \ 和 `Optional.empty()`。例如：\n\n```\npublic static Optional<Double> inverse(Double\
  \ x) \n{\n   return x == 0 ? Optional.empty() : Optional.of(1 / x);\n}\n```\n\n\
  `ofNullable` 方法旨在作为从可能为 `null` 的值到可选值转换的桥梁。如果 `obj` 不是 `null`，则 `Optional.ofNullable(obj)`\
  \ 返回 `Optional.of(obj)`，否则返回 `Optional.empty()`。\n\n#### `java.util.Optional` 8\n\
  \n- `static <T> Optional<T> of(T value)`\n- `static <T> Optional<T> ofNullable(T\
  \ value)`\n  产生一个带有给定值的 `Optional`。如果 `value` 为 `null`，第一个方法抛出 `NullPointerException`，第二个方法产生一个空的\
  \ `Optional`。\n- `static <T> Optional<T> empty()`\n  产生一个空的 `Optional`。\n\n### 使用\
  \ flatMap 组合 Optional 值函数\n\n假设你有一个产生 `Optional<T>` 的方法 `f`，目标类型 `T` 有一个产生 `Optional<U>`\
  \ 的方法 `g`。如果它们是普通方法，你可以通过调用 `s.f().g()` 将它们组合。但这种组合不起作用，因为 `s.f()` 的类型是 `Optional<T>`\
  \ 而不是 `T`。相反，调用：\n\n```\nOptional<U> result = s.f().flatMap(T::g);\n```\n\n如果 `s.f()`\
  \ 存在，则对其应用 `g`。否则返回一个空的 `Optional<U>`。\n\n显然，如果你有更多产生 `Optional` 值的方法或 lambda 表达式，你可以重复该过程。你可以通过链式调用\
  \ `flatMap` 构建一个步骤流水线，只有当所有部分都成功时它才会成功。\n\n例如，考虑前节中安全的 `inverse` 方法。假设我们还有一个安全的平方根方法：\n\
  \n```\npublic static Optional<Double> squareRoot(Double x) \n{\n   return x < 0\
  \ ? Optional.empty() : Optional.of(Math.sqrt(x));\n}\n```\n\n那么你可以这样计算 `inverse`\
  \ 的平方根：\n\n```\nOptional<Double> result = inverse(arg).flatMap(x -> squareRoot(x));\n\
  ```\n\n我们可以通过从 `Optional` 开始来让这样的链看起来更规则一些：\n\n```\nOptional<Double> result\n  \
  \ = Optional.of(arg).flatMap(x -> inverse(x)).flatMap(x -> squareRoot(x));\n```\n\
  \n使用方法表达式看起来甚至更整洁：\n\n```\nOptional<Double> result\n   = Optional.of(arg).flatMap(MyMath::inverse).flatMap(MyMath::squareRoot);\n\
  ```\n\n如果 `inverse` 方法或 `squareRoot` 方法任一返回了 `Optional.empty()`，则结果为空。\n\n你已经在 `Stream`\
  \ 接口中看到过 `flatMap` 方法（参见第 1.3 节）。该方法将产生流的方法映射到流的所有元素，然后展平结果流的流。`Optional.flatMap`\
  \ 方法的工作方式相同。通过将产生可选的方法映射到可选值，你得到了一个可选的可选值，然后对其进行展平。\n\n#### `java.util.Optional`\
  \ 8\n\n- `<U> Optional<U> flatMap(Function<? super T,? extends Optional<? extends\
  \ U>> mapper)`\n  如果此 `Optional` 有值，则产生将 `mapper` 应用于该值的的结果；否则产生一个空可选。\n\n### 将\
  \ Optional 转换为 Stream\n\n`stream` 方法将 `Optional<T>` 转换为具有零或一个元素的 `Stream<T>`。当然，为什么不呢，但你为什么需要它呢？\n\
  \n这对于返回 `Optional` 结果的方法变得非常有用。假设你有一个用户 ID 流和一个方法：\n\n```\nOptional<User> lookup(String\
  \ id)\n```\n\n你如何获取用户流并跳过那些无效的 ID？\n\n当然，你可以过滤掉无效的 ID，然后对剩余部分应用 `get`：\n\n```\n\
  Stream<String> ids = . . .\nStream<User> users = ids.map(Users::lookup)\n   .filter(Optional::isPresent)\n\
  \   .map(Optional::get);\n```\n\n但这使用了我们警告过的 `isPresent` 和 `get` 方法。更优雅的方法是调用：\n\
  \n```\nStream<User> users = ids.map(Users::lookup)\n   .flatMap(Optional::stream);\n\
  ```\n\n每次调用 `stream` 都返回一个包含零或一个元素的流。`flatMap` 方法将它们合并。这意味着不存在的用户被简单的丢弃了。\n\n在本节中，我们考虑理想的情况，即我们有一个返回\
  \ `Optional` 值的方法。如今，许多方法在没有有效结果时返回 `null`。假设 `Users.classicLookup(id)` 返回一个 `User`\
  \ 对象或 `null`，而不是 `Optional<User>`。那么你当然可以过滤 `null` 值：\n\n```\nStream<User> users\
  \ = ids.map(Users::classicLookup)\n   .filter(Objects::nonNull);\n```\n\n但如果你倾向于使用\
  \ `flatMap` 方法，可以使用：\n\n```\nStream<User> users = ids.flatMap(\n   id -> Stream.ofNullable(Users.classicLookup(id)));\n\
  ```\n\n或者\n\n```\nStream<User> users = ids.map(Users::classicLookup)\n   .flatMap(Stream::ofNullable);\n\
  ```\n\n调用 `Stream.ofNullable(obj)` 在 `obj` 为 `null` 时产生一个空流，否则产生一个仅包含 `obj` 的流。\n\
  \n示例程序在列表 1.3 中演示了 `Optional` API。\n\noptional/OptionalTest.java\n\n\n\n\n\n```java\n\
  package optional;\n\nimport java.io.*;\nimport java.nio.file.*;\nimport java.util.*;\n\
  \n/**\n * @version 1.02 2019-08-28\n * @author Cay Horstmann\n */\npublic class\
  \ OptionalTest\n{\n   public static void main(String[] args) throws IOException\n\
  \   {\n      String contents = Files.readString(Path.of(\"../gutenberg/alice30.txt\"\
  ));\n      List<String> wordList = List.of(contents.split(\"\\\\PL+\"));\n\n   \
  \   Optional<String> optionalValue = wordList.stream()\n         .filter(s -> s.contains(\"\
  fred\"))\n         .findFirst();\n      System.out.println(optionalValue.orElse(\"\
  No word\") + \" contains fred\");\n\n      Optional<String> optionalString = Optional.empty();\n\
  \      String result = optionalString.orElse(\"N/A\");\n      System.out.println(\"\
  result: \" + result);\n      result = optionalString.orElseGet(() -> Locale.getDefault().getDisplayName());\n\
  \      System.out.println(\"result: \" + result);\n      try\n      {\n        \
  \ result = optionalString.orElseThrow(IllegalStateException::new);\n         System.out.println(\"\
  result: \" + result);\n      }\n      catch (Throwable t)\n      {\n         t.printStackTrace();\n\
  \      }\n\n      optionalValue = wordList.stream()\n         .filter(s -> s.contains(\"\
  red\"))\n         .findFirst();\n      optionalValue.ifPresent(s -> System.out.println(s\
  \ + \" contains red\"));\n\n      var results = new HashSet<String>();\n      optionalValue.ifPresent(results::add);\n\
  \      Optional<Boolean> added = optionalValue.map(results::add);\n      System.out.println(added);\n\
  \n      System.out.println(inverse(4.0).flatMap(OptionalTest::squareRoot));\n  \
  \    System.out.println(inverse(-1.0).flatMap(OptionalTest::squareRoot));\n    \
  \  System.out.println(inverse(0.0).flatMap(OptionalTest::squareRoot));\n      Optional<Double>\
  \ result2 = Optional.of(-4.0)\n         .flatMap(OptionalTest::inverse).flatMap(OptionalTest::squareRoot);\n\
  \      System.out.println(result2);\n   }\n\n   public static Optional<Double> inverse(Double\
  \ x)\n   {\n      return x == 0 ? Optional.empty() : Optional.of(1 / x);\n   }\n\
  \n   public static Optional<Double> squareRoot(Double x)\n   {\n      return x <\
  \ 0 ? Optional.empty() : Optional.of(Math.sqrt(x));\n   }\n}\n```\n\n`java.util.Optional`\
  \ 8\n\n- `<U> Optional<U> flatMap(Function<? super T,Optional<U>> mapper)` 9\n\n\
  产生将 `mapper` 应用于此 `Optional` 值的的结果；如果此 `Optional` 为空，则返回一个空的 `Optional`。\n\n## 收集结果\n\
  \n当你完成流（stream）时，通常想要查看结果。你可以调用 `iterator` 方法，它会产生一个传统的迭代器，你可以用它来访问元素。\n\n或者，你可以调用\
  \ `forEach` 方法对每个元素应用函数：\n\n```\nstream.forEach(System.out::println);\n```\n\n在并行流上，`forEach`\
  \ 方法以任意顺序遍历元素。如果你想按流的顺序处理它们，请调用 `forEachOrdered`。当然，你可能会因此放弃部分或全部并行带来的优势。\n\n但大多数情况下，你可能希望将结果收集到数据结构中。你已经见过\
  \ `toList` 方法，它产生一个流元素的列表。\n\n调用 `toArray` 来获取流元素的数组。\n\n由于无法在运行时创建泛型数组，表达式 `stream.toArray()`\
  \ 返回一个 `Object[]` 数组。如果你想要正确类型的数组，请传入数组构造器：\n\n```\nString[] result = stream.toArray(String[]::new);\n\
  // stream.toArray() 的类型为 Object[]\n```\n\n为了将流元素收集到另一个目标，有一个方便的 `collect` 方法，它接受\
  \ `Collector` 接口的实例。`collector` 是一个累积元素并产生结果的对象。`Collectors` 类为常见的收集器提供了许多工厂方法。在\
  \ Java 16 引入 `toList` 方法之前，你必须使用由 `Collectors.toList()` 产生的收集器：\n\n```\nList<String>\
  \ result = stream.collect(Collectors.toList());\n```\n\n同样，这里是如何将流元素收集到集合（set）中：\n\
  \n```\nSet<String> result = stream.collect(Collectors.toSet());\n```\n\n这些调用会给你一个列表或集合，但你不能做任何进一步的假设。该集合可能是可变的、可序列化的或线程安全的。如果你想控制获取哪种类型的集合，请改用以下调用：\n\
  \n```\nTreeSet<String> result = stream.collect(Collectors.toCollection(TreeSet::new));\n\
  ```\n\n假设你想通过拼接流中的所有字符串来收集它们。你可以调用：\n\n```\nString result = stream.collect(Collectors.joining());\n\
  ```\n\n如果你想在元素之间使用一个分隔符，请将其传递给 `joining` 方法：\n\n```\nString result = stream.collect(Collectors.joining(\"\
  , \"));\n```\n\n如果你的流包含除字符串以外的对象，你需要先将它们转换为字符串，如下所示：\n\n```\nString result = stream.map(Object::toString).collect(Collectors.joining(\"\
  , \"));\n```\n\n如果你想将流的结果简化为和、计数、平均值、最大值或最小值，请使用其中一个 `summarizing`(`Int`|`Long`|`Double`)\
  \ 方法。这些方法接受一个将流对象映射到数字的函数，并产生类型为 (`Int`|`Long`|`Double`) `SummaryStatistics` 的结果，同时计算和、计数、平均值、最大值和最小值。\n\
  \n```java\nIntSummaryStatistics summary = stream.collect(\n   Collectors.summarizingInt(String::length));\n\
  double averageWordLength = summary.getAverage();\ndouble maxWordLength = summary.getMax();\n\
  ```\n\n示例 1.4 中的示例程序展示了如何从流中收集元素。\n\ncollecting/CollectingResults.java\n\n\n\n\n\
  \n```\npackage collecting;\n\nimport java.io.*;\nimport java.nio.file.*;\nimport\
  \ java.util.*;\nimport java.util.stream.*;\n\n/**\n * @version 1.02 2019-08-28\n\
  \ * @author Cay Horstmann\n */\npublic class CollectingResults\n{\n   public static\
  \ Stream<String> noVowels() throws IOException\n   {\n      String contents = Files.readString(Path.of(\"\
  ../gutenberg/alice30.txt\"));\n      List<String> wordList = List.of(contents.split(\"\
  \\\\PL+\"));\n      Stream<String> words = wordList.stream();\n      return words.map(s\
  \ -> s.replaceAll(\"[aeiouAEIOU]\", \"\"));\n   }\n\n   public static <T> void show(String\
  \ label, Set<T> set)\n   {\n      System.out.print(label + \": \" + set.getClass().getName());\n\
  \      System.out.println(\"[\"\n         + set.stream().limit(10).map(Object::toString).collect(Collectors.joining(\"\
  , \")) \n         + \"]\");\n   }\n\n   public static void main(String[] args) throws\
  \ IOException\n   {\n      Iterator<Integer> iter = Stream.iterate(0, n -> n + 1).limit(10).iterator();\n\
  \      while (iter.hasNext())\n         System.out.println(iter.next());\n\n   \
  \   Object[] numbers = Stream.iterate(0, n -> n + 1).limit(10).toArray();\n    \
  \  System.out.println(\"Object array:\" + numbers); \n         // 注意：这是一个 Object[]\
  \ 数组\n\n      try\n      {\n         var number = (Integer) numbers[0]; // OK\n\
  \         System.out.println(\"number: \" + number);\n         System.out.println(\"\
  The following statement throws an exception:\");\n         var numbers2 = (Integer[])\
  \ numbers; // 会抛出异常\n      }\n      catch (ClassCastException e)\n      {\n    \
  \     System.out.println(e);\n      }\n\n      Integer[] numbers3 = Stream.iterate(0,\
  \ n -> n + 1)\n         .limit(10)\n         .toArray(Integer[]::new);\n      System.out.println(\"\
