  \ message, String title, int optionType, int messageType, Icon icon, Object[] options,\
  \ Object default)`\n  显示选项对话框或内部选项对话框。（内部对话框完全渲染在其所有者的帧内）。返回所选选项的索引；如果用户取消了对话框，则返回\
  \ `CLOSED_OPTION`。父组件可以是 `null`。显示在对话框上的消息可以是字符串、图标、组件或它们的数组。参数 `messageType` 是\
  \ `ERROR_MESSAGE`、`INFORMATION_MESSAGE`、`WARNING_MESSAGE`、`QUESTION_MESSAGE` 或 `PLAIN_MESSAGE`\
  \ 之一，而 `optionType` 是 `DEFAULT_OPTION`、`YES_NO_OPTION`、`YES_NO_CANCEL_OPTION` 或\
  \ `OK_CANCEL_OPTION` 之一。参数 `options` 是字符串、图标或组件的数组。\n* `static Object showInputDialog(Component\
  \ parent, Object message, String title, int messageType, Icon icon, Object[] values,\
  \ Object default)`\n* `static String showInputDialog(Component parent, Object message,\
  \ String title, int messageType)`\n* `static String showInputDialog(Component parent,\
  \ Object message)`\n* `static String showInputDialog(Object message)`\n* `static\
  \ String showInputDialog(Component parent, Object message, Object default)` 1.4\n\
  * `static String showInputDialog(Object message, Object default)` 1.4\n* `static\
  \ Object showInternalInputDialog(Component parent, Object message, String title,\
  \ int messageType, Icon icon, Object[] values, Object default)`\n* `static String\
  \ showInternalInputDialog(Component parent, Object message, String title, int messageType)`\n\
  * `static String showInternalInputDialog(Component parent, Object message)`\n  显示输入对话框或内部输入对话框。（内部对话框完全渲染在其所有者的帧内）。返回用户输入的字符串；如果用户取消了对话框，则返回\
  \ `null`。父组件可以是 `null`。显示在对话框上的消息可以是字符串、图标、组件或它们的数组。参数 `messageType` 是 `ERROR_MESSAGE`、`INFORMATION_MESSAGE`、`WARNING_MESSAGE`、`QUESTION_MESSAGE`\
  \ 或 `PLAIN_MESSAGE` 之一。\n\n\n\n\n\n在上一节中，你学习了如何使用 `JOptionPane` 类来显示一个简单的对话框。在本节中，你将看到如何手动创建一个这样的对话框。\n\
  \n图 11.31 显示了一个典型的模态对话框——当用户点击“关于（About）”按钮时显示的的程序信息框。\n\n![Figure](img/dialogtest.jpg)一个“关于”对话框\n\
  \n要实现一个对话框，你需要扩展 `JDialog` 类。这与为应用程序主窗口扩展 `JFrame` 的过程本质是相同的。具体来说：\n\n1. 在对话框的构造函数中，调用父类\
  \ `JDialog` 的构造函数。\n2. 添加对话框的界面界面组件。\n3. 添加事件处理器。\n4. 设置对话框的大小。\n\n当你调用父类构造函数时，需要提供\
  \ `owner frame`（所有者帧）、对话框标题以及 `modality`（模态性）。\n\n所有者帧控制对话框显示的位置。你可以提供 `null` 作为所有者；这样对话框将由一个隐藏的帧所有。\n\
  \n模态性指定了在对话框显示期间，应用程序的哪些窗口会被阻塞。非模态对话框不会阻塞其他窗口。模态对话框会阻塞应用程序的所有其他窗口（对话框的子窗口除外）。对于用户可以随时访问的工具箱，你会使用非模态对话框。如果你想强制用户在继续之前提供所需的信息，则可以使用模态对话框。\n\
  \n以下是对话框的代码：\n\n```java\npublic AboutDialog extends JDialog\n{\n   public AboutDialog(JFrame\
  \ owner)\n   {\n      super(owner, \"About DialogTest\", true);\n      add(new JLabel(\n\
  \         \"<html><h1><i>Core Java</i></h1><hr>By Cay Horstmann</html>\"),\n   \
  \      BorderLayout.CENTER);\n```\n\n```java\n var var panel = new JPanel();\n \
  \     var ok = new JButton(\"OK\");\n\n      ok.addActionListener(event -> setVisible(false));\n\
  \      panel.add(ok);\n      add(panel, BorderLayout.SOUTH);\n      setSize(250,\
  \ 150);\n   }\n}\n```\n\n如你所示，构造函数添加了界面元素——在本例中是标签和按钮。它为按钮添加了处理器并设置了对话框的大小。\n\n\
  要显示对话框，创建一个新的对话框对象并使其可见：\n\n```java\nvar dialog = new AboutDialog(this);\ndialog.setVisible(true);\n\
  ```\n\n实际上，在下方的示例代码中，我们只创建一次对话框，当用户点击“关于”按钮时，我们可以复用它。\n\n```java\nif (dialog ==\
  \ null) // 第一次\n   dialog = new AboutDialog(this);\ndialog.setVisible(true);\n```\n\
  \n当用户点击 OK 按钮时，对话框应该关闭。这在 OK 按钮的事件处理器中处理：\n\n```java\nok.addActionListener(event\
  \ -> setVisible(false));\n```\n\n当用户点击关闭按钮关闭对话框时，对话框也会隐藏。就像 `JFrame` 一样，你可以通过 `setDefaultCloseOperation`\
  \ 方法来覆盖这一行为。\n\n列表 11.11 是测试程序的帧类的代码。列表 11.12 显示了对话框类。\n\ndialog/DialogFrame.java\n\
  \n```java\npackage dialog;\n\nimport javax.swing.JFrame;\nimport javax.swing.JMenu;\n\
  import javax.swing.JMenuBar;\nimport javax.swing.JMenuItem;\n\n/**\n * 一个带有菜单的帧，其\
  \ File->About 操作会显示对话框。\n */\npublic class DialogFrame extends JFrame\n{\n   private\
  \ static final int DEFAULT_WIDTH = 300;\n   private static final int DEFAULT_HEIGHT\
  \ = 200;\n   private AboutDialog dialog;\n\n   public DialogFrame()\n   {\n    \
  \  setSize(DEFAULT_WIDTH, DEFAULT_HEIGHT);\n\n      // 构建 File 菜单\n\n      var menuBar\
  \ = new JMenuBar();\n      setJMenuBar(menuBar);\n      var fileMenu = new JMenu(\"\
  File\");\n      menuBar.add(fileMenu);\n\n      // 添加 About 和 Exit 菜单项\n\n     \
  \ // About 项显示 About 对话框\n\n      var aboutItem = new JMenuItem(\"About\");\n  \
  \    aboutItem.addActionListener(event ->\n         {\n            if (dialog ==\
  \ null) // 第一次\n               dialog = new AboutDialog(DialogFrame.this);\n   \
  \         dialog.setVisible(true); // 弹出对话框\n         });\n      fileMenu.add(aboutItem);\n\
  \n      // Exit 项退出程序\n\n      var exitItem = new JMenuItem(\"Exit\");\n      exitItem.addActionListener(event\
  \ -> System.exit(0));\n      fileMenu.add(exitItem);\n   }\n}\n```\n\ndialog/AboutDialog.java\n\
  \n```java\npackage dialog;\n\nimport java.awt.BorderLayout;\n\nimport javax.swing.JButton;\n\
  import javax.swing.JDialog;\nimport javax.swing.JFrame;\nimport javax.swing.JLabel;\n\
  import javax.swing.JPanel;\n\n/**\n * 示例模态对话框，它显示一条消息并等待用户点击\n * OK 按钮。\n */\npublic\
  \ class AboutDialog extends JDialog\n{\n   public AboutDialog(JFrame owner)\n  \
  \ {\n      super(owner, \"About DialogTest\", true);\n\n      // 添加 HTML 标签到居中中\n\
  \n      add(new JLabel(\n         \"<html><h1><i>Core Java</i></h1><hr>By Cay Horstmann</html>\"\
  ),\n         BorderLayout.CENTER);\n\n      // OK 按钮\n      var panel = new JPanel();\n\
  \      var ok = new JButton(\"OK\");\n\n      ok.addActionListener(event -> setVisible(false));\n\
  \      panel.add(ok);\n      add(panel, BorderLayout.SOUTH);\n      pack();\n  \
  \ }\n}\n```\n\n\n\n\n这种技巧是让 `PasswordChooser` 继承自 `JPanel` 而不是 `JDialog`。在 `showDialog`\
  \ 方法中动态构建 `JDialog` 对象：\n\n```\npublic boolean showDialog(Frame owner, String title)\n\
  {\n   ok = false;\n\n   if (dialog == null || dialog.getOwner() != owner)\n   {\n\
  \      dialog = new JDialog(owner, true);\n      dialog.add(this);\n      dialog.pack();\n\
  \   }\n\n   dialog.setTitle(title);\n   dialog.setVisible(true);\n   return ok;\n\
  }\n```\n\n注意，`owner` 等于 `null` 是安全的。\n\n你可以做得更好。有时候，所有帧（owner frame）并不可直接可用。从任何\
  \ `parent` 组件轻松计算它，如下所示：\n\n```\nFrame owner;\nif (parent instanceof Frame)\n  \
  \ owner = (Frame) parent;\nelse\n   owner = (Frame) SwingUtilities.getAncestorOfClass(Frame.class,\
  \ parent);\n```\n\n我们在示例程序中使用了这个增强功能。`JOptionPane` 类也使用了这种机制。\n\n许多对话框都有默认按钮，如果用户按下触发键（在大多数外观实现中为\
  \ Enter 键），该默认按钮会被选中。默认按钮有特殊的标记，通常带有一个粗轮廓框。\n\n在对话框的根面板（root pane）中设置默认按钮：\n\n```\n\
  dialog.getRootPane().setDefaultButton(okButton);\n```\n\n如果你遵循了在面板中布局对话框的建议，那么你必须小心在将面板封装进对话框之后后再设置默认按钮。面板对话框本身没有根面板。\n\
  \nListing 11.13 是程序的帧类，它阐明了进入和流出对话框的数据流。Listing 11.14 显示了对话框类。\n\n`dataExchange/DataExchangeFrame.java`\n\
  \n```java\npackage dataExchange;\n\nimport java.awt.*;\nimport java.awt.event.*;\n\
  import javax.swing.*;\n\n/**\n * 一个带有菜单的帧，其 File->Connect 动作会显示密码对话框。\n */\npublic\
  \ class DataExchangeFrame extends JFrame\n{\n   public static final int TEXT_ROWS\
  \ = 20;\n   public static final int TEXT_COLUMNS = 40;\n   private PasswordChooser\
  \ dialog = null;\n   private JTextArea textArea;\n\n   public DataExchangeFrame()\n\
  \   {\n      // 构建 File 菜单\n\n      var mbar = new JMenuBar();\n      setJMenuBar(mbar);\n\
  \      var fileMenu = new JMenu(\"File\");\n      mbar.add(fileMenu);\n\n      //\
  \ 添加 Connect 和 Exit 菜单项\n\n      var connectItem = new JMenuItem(\"Connect\");\n\
  \      connectItem.addActionListener(new ConnectAction());\n      fileMenu.add(connectItem);\n\
  \n      // Exit 将退出程序\n\n      var exitItem = new JMenuItem(\"Exit\");\n      exitItem.addActionListener(event\
  \ -> System.exit(0));\n      fileMenu.add(exitItem);\n\n      textArea = new JTextArea(TEXT_ROWS,\
  \ TEXT_COLUMNS);\n      add(new JScrollPane(textArea), BorderLayout.CENTER);\n \
  \     pack();\n   }\n\n   /**\n    * Connect 动作弹出密码对话框。\n    */\n   private class\
  \ ConnectAction implements ActionListener\n   {\n      public void actionPerformed(ActionEvent\
  \ event)\n      {\n         // 如果是第一次，构建对话框\n\n         if (dialog == null) dialog\
  \ = new PasswordChooser();\n\n         // 设置默认值\n         dialog.setUser(new User(\"\
  yourname\", null));\n\n         // 弹出对话框\n         if (dialog.showDialog(DataExchangeFrame.this,\
  \ \"Connect\"))\n         {\n            // 如果接受，获取用户输入\n            User u = dialog.getUser();\n\
  \            textArea.append(\"user name = \" + u.getName());\n         }\n    \
  \  }\n   }\n}\n```\n\n`dataExchange/PasswordChooser.java`\n\n```java\npackage dataExchange;\n\
  \nimport java.awt.*;\nimport java.awt.event.*;\nimport javax.swing.*;\n\n/**\n *\
  \ 一个在对话框中显示的密码选择器。\n */\npublic class PasswordChooser extends JPanel\n{\n   private\
  \ JTextField username;\n   private JPasswordField password;\n   private JButton\
  \ okButton;\n   private boolean ok;\n   private JDialog dialog;\n\n   public PasswordChooser()\n\
  \   {\n      setLayout(new BorderLayout());\n\n      // 构建用户名和密码面板\n\n      var\
  \ panel = new JPanel();\n      panel.setLayout(GridLayout(2, 2));\n      panel.add(new\
  \ JLabel(\"User name:\"));\n      panel.add(username = new JTextField());\n    \
  \  panel.add(new JLabel(\"Password:\"));\n      panel.add(password = new JPasswordField());\n\
  \      add(panel, BorderLayout.CENTER);\n\n      // 创建 Ok 和 Cancel 按钮\n\n      var\
  \ buttonPanel = new JPanel();\n      okButton = new JButton(\"Ok\");\n      okButton.addActionListener(event\
  \ ->\n         {\n            ok = true;\n            dialog.setVisible(false);\n\
  \         });\n\n      var cancelButton = new JButton(\"Cancel\");\n      cancelButton.addActionListener(event\
  \ -> dialog.setVisible(false));\n\n      // 将按钮添加到南部边界\n\n      buttonPanel.add(okButton);\n\
  \      buttonPanel.add(cancelButton);\n      add(buttonPanel, BorderLayout.SOUTH);\n\
  \   }\n\n   /**\n    * 设置对话框默认。\n    * @param u 用户信息\n    */\n   public void setUser(User\
  \ u)\n   {\n      username.setText(u.getName());\n   }\n\n   /**\n    * 获取对话框项。\n\
  \    * @return 代表对话框项的 User 对象\n    */\n   public User getUser()\n   {\n      return\
  \ new User(username.getText(), password.getPassword());\n   }\n\n   /**\n    * 在对话框中显示选择器。\n\
  \    * @param parent 所有帧或 null\n    * @param title 对话框标题\n    */\n   public boolean\
  \ showDialog(Component parent, String title)\n   {\n      ok = false;\n\n      //\
  \ 定位所有帧\n\n      Frame owner = (Frame) SwingUtilities.getAncestorOfClass(Frame.class,\
  \ parent);\n\n      // 如果是第一次或所有者已更改，创建对话框\n\n      if (dialog == null || dialog.getOwner()\
  \ != owner)\n      {\n         dialog = new JDialog(owner, true);\n         dialog.add(this);\n\
  \         dialog.pack();\n         dialog.getRootPane().setDefaultButton(okButton);\n\
  \      }\n\n      // 设置标题并显示对话框\n\n      dialog.setTitle(title);\n      dialog.setVisible(true);\n\
  \      return ok;\n   }\n}\n```\n\n### 文件对话框\n\n在应用程序中，你通常希望打开和保存文件。一个能够显示文件和目录并让用户浏览文件系统的良好的文件对话框编写起来很困难，你绝对不想重新发明轮子。幸运的是，Swing\
  \ 提供了 `JFileChooser` 类，允许你显示与原生应用程序类似的文件对话框。`JFileChooser` 对话框总是模态的。注意 `JFileChooser`\
  \ 类并不是 `JDialog` 的子类。与其调用 `setVisible(true)`，不如调用 `showOpenDialog` 显示用于打开文件的对话框，调用\
  \ `showSaveDialog` 显示用于保存文件的对话框。接受文件的按钮将自动标记为 Open 或 Save。你也可以通过 `showDialog` 方法提供自定义的按钮标签。图\
  \ 11.33 显示了文件选择器对话框的一个示例。\n\n\n\n\n\n![Figure](img/filedialog.jpg)文件选择器对话框\n\n以下是建立文件对话框并获取用户在对话框中选择内容的步骤：\n\
  \n1. 创建一个 `JFileChooser` 对象。与 `JDialog` 类的构造函数不同，你不需要提供父组件。这允许你在多个窗口（frames）中复用文件选择器对话框。\n\
  \   例如：\n   ```\n   var chooser = new JFileChooser();\n   ```\n   复用文件选择器对象是一个好主意，因为\
  \ `JFileChooser` 的构造函数可能非常慢，特别是在 Windows 上当用户映射了许多网络驱动器时。\n\n2. 通过调用 `setCurrentDirectory`\
  \ 方法设置目录。\n   例如，要使用当前工作目录：\n   ```\n   chooser.setCurrentDirectory(new File(\"\
  .\"));\n   ```\n   你需要提供一个 `File` 对象。`File` 对象在第 2 章 中有详细解释。你现在只需要知道构造函数 `File(String\
  \ filename)` 会将文件名或目录名转换为 `File` 对象。\n\n3. 如果你有一个期望用户选择的默认文件名，可以通过 `setSelectedFile`\
  \ 方法提供它：\n   ```\n   chooser.setSelectedFile(new File(filename));\n   ```\n\n4.\
  \ 为了让用户在对话框中选择多个文件，调用 `setMultiSelectionEnabled` 方法。这这完全是可选的，而且并不常见。\n   ```\n \
  \  chooser.setMultiSelectionEnabled(true);\n   ```\n\n5. 如果你想限制对话框中显示的文件类型为特定类型（例如，所有\
  \ `.gif` 扩展的文件），你需要设置一个文件过滤器（file filter）。我们将在本节稍后讨论文件过滤器。\n\n6. 默认情况下，用户使用文件选择器只能选择文件。如果你让用户选择目录，请使用\
  \ `setFileSelectionMode` 方法。使用 `JFileChooser.FILES_ONLY`（默认值）、`JFileChooser.DIRECTORIES_ONLY`\
  \ 或 `JFileChooser.FILES_AND_DIRECTORIES` 进行调用。\n\n7. 通过 `showOpenDialog` 或 `showSaveDialog`\
  \ 方法显示对话框。在这些调用中你必须提供父组件：\n   ```\n   int result = chooser.showOpenDialog(parent);\n\
  \   ```\n   或\n   ```\n   int result = chooser.showSaveDialog(parent);\n   ```\n\
  \   这些调用之间的唯一区别是“确认按钮”的标签——即用户点击以完成文件选择的按钮。你也可以调用 `showDialog` 方法并为确认按钮传递显式文本：\n\
  \   ```\n   int result = chooser.showDialog(parent, \"Select\");\n   ```\n   这些调用在用户确认、取消或关闭文件对话框后才会返回。返回值为\
  \ `JFileChooser.APPROVE_OPTION`、`JFileChooser.CANCEL_OPTION` 或 `JFileChooser.ERROR_OPTION`。\n\
  \n8. 使用 `getSelectedFile()` 或 `getSelectedFiles()` 方法获取选定的文件或多个文件。这些方法返回单个 `File`\
  \ 对象或 `File` 对象数组。如果你只需要文件对象的名称，请调用它的 `getPath` 方法。例如：\n   ```\n   String filename\
  \ = chooser.getSelectedFile().getPath();\n   ```\n\n在大多数情况下，这些步骤都是简单的。使用文件对话框的主要困难在于指定用户应该从中选择的文件子集。例如，假设用户应该选择一个\
  \ GIF 图像文件。那么，文件选择器应该只显示扩展名为 `.gif` 的文件。它还应该给用户提供某种反馈，说明显示的文件属于特定类别，例如“GIF Images”。但情况可能会更复杂。如果用户应该选择一个\
  \ JPEG 图像文件，扩展名可以是 `.jpg` 或 `.jpeg`。文件选择器的设计者提供了一种更优雅的方法，而不是通过编码来处理这些复杂性。\n\n\n\n\
  \n\n示例程序包含了一个简单的文件视图类。当文件匹配文件过滤器时，该类会显示特定的图标。我们使用它来为所有图像文件显示调色板图标。\n\n```\nclass\
  \ FileIconView extends FileView\n{\n   private FileFilter filter;\n   private Icon\
  \ icon;\n\n   public FileIconView(FileFilter aFilter, Icon anIcon)\n   {\n     \
  \ filter = aFilter;\n      icon = anIcon;\n   }\n\n   public Icon getIcon(File f)\n\
  \   {\n      if (!f.isDirectory() && filter.accept(f))\n         return icon;\n\
  \      else return null;\n   }\n}\n```\n\n使用 `setFileView` 方法将此文件视图安装到你的文件选择器中：\n\
  \n```\nchooser.setFileView(new FileIconView(filter,\n   new ImageIcon(\"palette.gif\"\
  )));\n```\n\n文件选择器将在所有通过 `filter` 的文件旁边显示调色板图标，并使用默认文件视图显示所有其他文件。自然地，我们使用了与在文件选择器中设置相同的过滤器。\n\
  \n最后，你可以通过添加 `accessory` 组件来自定义文件对话框。例如，图 11.34 显示了文件列表旁有一个预览配件。该配件显示当前选中文件的缩略图。\n\
  \n![Figure](img/filedialog2.jpg) 带有预览配件的文件对话框\n\n配件可以是任何 Swing 组件。在我们的案例中，我们扩展了\
  \ `JLabel` 类并将其图标设置为图形图像的缩放副本：\n\n```\nclass ImagePreviewer extends JLabel\n{\n\
  \   public ImagePreviewer(JFileChooser chooser)\n   {\n      setPreferredSize(new\
  \ Dimension(100, 100));\n      setBorder(BorderFactory.createEtchedBorder());\n\
  \   }\n\n   public void loadImage(File f)\n   {\n      var icon = new ImageIcon(f.getPath());\n\
  \      if(icon.getIconWidth() > getWidth())\n         icon = new ImageIcon(icon.getImage().getScaledInstance(\n\
  \            getWidth(), -1, Image.SCALE_DEFAULT));\n      setIcon(icon);\n    \
  \  repaint();\n   }\n}\n```\n\n这里面临一个挑战。我们希望在用户选择不同的文件时更新预览图像。文件选择器使用“JavaBeans”机制，在其任何一个属性更改时通知感兴趣的监听器。选中的文件是一个属性，你可以通过安装\
  \ `PropertyChangeListener` 来监控它。以下是捕获通知所需的代码：\n\n```\nchooser.addPropertyChangeListener(event\
  \ ->\n   {\n      if (event.getPropertyName() == JFileChooser.SELECTED_FILE_CHANGED_PROPERTY)\n\
  \      {\n         var newFile = (File) event.getNewValue();\n         // update\
  \ the accessory\n         . . .\n      }\n   });\n```\n\n### `javax.swing.JFileChooser`\
  \ 1.2\n\n*   `JFileChooser()`\n    创建一个文件选择器对话框，可以用于多个帧。\n*   `void setCurrentDirectory(File\
  \ dir)`\n    设置文件对话框的初始目录。\n*   `void setSelectedFile(File file)` \n*   `void setSelectedFiles(File[]\
  \ file)`\n    设置文件对话框的默认文件选择。\n*   `void setMultiSelectionEnabled(boolean b)`\n\
  \    设置或清除多选模式。\n*   `void setFileSelectionMode(int mode)`\n    允许用户仅选择文件（默认）、仅选择目录或同时选择文件和目录。`mode`\
  \ 参数是 `JFileChooser.FILES_ONLY`、`JFileChooser.DIRECTORIES_ONLY` 和 `JFileChooser.FILES_AND_DIRECTORIES`\
  \ 之一。\n*   `int showOpenDialog(Component parent)`\n*   `int showSaveDialog(Component\
  \ parent)`\n*   `int showDialog(Component parent, String approveButtonText)`\n \
  \   显示一个对话框，其中确认按钮标记为“打开”、“保存”或字符串 `approveButtonText`。返回 `APPROVE_OPTION`、`CANCEL_OPTION`（如果用户选择了取消按钮或关闭了对话框）或\
  \ `ERROR_OPTION`（如果发生错误）。\n*   `File getSelectedFile()`\n*   `File[] getSelectedFiles()`\n\
  \    获取用户选择的文件（如果用户未选择任何文件，则返回 `null`）。\n*   `void setFileFilter(FileFilter filter)`\n\
  \    设置文件对话框的文件掩码。所有 `filter.accept` 返回 `true` 的文件都将被显示。同时，将过滤器添加到可选过滤器列表中。\n* \
  \  `void addChoosableFileFilter(FileFilter filter)`\n    将文件过滤器添加到可选过滤器列表中。\n* \
  \  `void setAcceptAllFileFilterUsed(boolean b)`\n    在过滤器组合框中包含或抑制“所有文件”过滤器。\n*\
  \   `void resetChoosableFileFilters()`\n    清除可选过滤器列表。除非显式抑制，否则仅保留“所有文件”过滤器。\n*\
  \   `void setFileView(FileView view)`\n    设置文件视图以提供有关文件选择器显示的文件的信息。\n*   `void\
  \ setAccessory(JComponent component)`\n    设置配件组件。\n\n### `javax.swing.filechooser.FileFilter`\
  \ 1.2\n\n*   `boolean accept(File f)`\n    如果文件选择器应该显示此文件，则返回 `true`。\n*   `String\
  \ getDescription()`\n    返回此文件过滤器的描述——例如 `\"Image files (*.gif,*.jpeg)`\"`\n\n###\
  \ `javax.swing.filechooser.FileNameExtensionFilter` 6\n\n*   `FileNameExtensionFilter(String\
  \ description, String... extensions)`\n    使用给定的描述构造文件过滤器，该过滤器接受所有目录以及所有以点接给定的扩展字符串之一结尾的文件。\n\
  \n### `javax.swing.filechooser.FileView` 1.2\n\n*   `String getName(File f)`\n \
  \   返回文件 `f` 的名称或 `null`。通常，此方法简单返回 `f.getName()`。\n*   `String getDescription(File\
  \ f)`\n    返回文件 `f` 的可读描述或 `null`。例如，如果 `f` 是一个 HTML 文档，此方法可能会返回它的标题。\n*   `String\
  \ getTypeDescription(File f)`\n    返回文件 `f` 类型的可读描述或 `null`。例如，如果 `f` 是一个 HTML 文档，此方法可能会返回字符串\
  \ `\"Hypertext document\"`。\n*   `Icon getIcon(File f)`\n    返回文件 `f` 的图标或 `null`。例如，如果\
  \ `f` 是一个 JPEG 文件，此方法可能会返回缩略图。\n*   `Boolean isTraversable(File f)`\n    如果 `f`\
  \ 是用户可以打开的目录则返回 `TRUE`。如果目录是复合文档，此方法可能会返回 `FALSE`。与所有的 `FileView` 方法一样，此方法可以返回 `null`\
  \ 表示文件选择器应该咨询默认视图。\n\nGUI 和图形的介绍将在下一章继续，该章将涵盖更高级的 Swing 组件和技术。\n\n# 高级 Swing 和图形\n\
  \n在本章中，我们将继续讨论第一卷中的 Swing 用户界面工具包和 AWT 图形。我们关注同时适用于客户端用户界面和服务器端图形及图像生成的技巧。Swing\
  \ 拥有用于渲染表格和树的复杂组件。通过 2D 图形 API，你可以产生任意复杂的矢量艺术。ImageIO API 允许你处理位图像。最后，你可以使用打印 API\
  \ 生成打印输出和 PostScript 文件。\n\n## 表格\n\n`JTable` 组件显示对象的对象的二维网格。表格在界面中很常见，Swing 团队在表格控制上花费了大量精力。表格本质上是复杂的，但——可能比其他\
  \ Swing 类更成功——`JTable` 组件隐藏了大部分复杂性。你通过编写几行代码就可以创建具有丰富行为的全功能表格。你还可以编写更多代码并为你的特定应用程序自定义显示和行为。\n\
  \n在接下来的章节中，我将解释如何制作简单的表格、用户如何与其交互，以及如何进行一些最常见的调整。与其他复杂的 Swing 控件一样，不可能在细节上完全覆盖所有方面。\n\
  \n### 简单表格\n\n\n\n\n\n`JTable` 不存储它自己的数据，而是从 `table model`（表格模型）获取数据。`JTable` 类有一个构造函数，可以将一个对象的二维数组封装到默认模型中。这就是我们在第一个示例中使用的策略；在本章的后后部分中，我们将转向使用表格模型。\n\
  \n图 12.1 显示了一个典型的表格，描述了太阳系行星的属性。（如果一个行星主要由氢和氦组成，则它是 `gaseous`（气态的）。你应该谨慎地对待“颜色”条目——添加该列是因为它在后面的代码示例中会很有用。）\n\
  \n![Figure](img/fig06-05.jpg)一个简单的表格\n\n正如你从列表 12.1 中的代码中所看到的，表格数据是以 `Object` 值的二维数组形式存储的：\n\
  \n```\nObject[][] cells =\n   {\n      { \"Mercury\", 2440.0, 0, false, Color.YELLOW\
  \ },\n      { \"Venus\", 6052.0, 0, false, Color.YELLOW },\n      . . .\n   }\n\
  ```\n\n在这里，我们利用了自动装箱（autoboxing）。第二、第三和第四列的条目会被转换为转换为 `Double`、`Integer` 和 `Boolean`\
  \ 类型的对象。\n\n表格简单地调用每个对象的 `toString` 方法来显示它。这就是为什么颜色显示为 `java.awt.Color[r=. . .,g=.\
  \ . .,b=. . .]`。\n\n在单独的字符串数组中提供列名：\n\n```\nString[] columnNames = { \"Planet\"\
  , \"Radius\", \"Moons\", \"Gaseous\", \"Color\" };\n```\n\n然后，从单元格和列名数组构造一个表格：\n\
  \n```\nvar table = new JTable(cells, columnNames);\n```\n\n你可以按照通常的方法添加滚动条——通过将表格封装在\
  \ `JScrollPane` 中：\n\n```\nvar pane = new JScrollPane(table);\n```\n\n当你滚动表格时，表格表头不会滚出视图。\n\
  \n接下来，点击其中一个列头并向左或向右拖动。观察整个列是如何变为分离状态的（参见图 12.2）。你可以将其放置在不同的位置。这*仅在视图中*重新排列了列。数据模型不受影响。\n\
  \n![Figure](img/fig06-06.jpg)移动列\n\n要 `resize`（调整大小）列宽，只需将光标放在两列之间，直到光标形状变为箭头。然后，将列边界拖到所需的位置（参见图\
  \ 12.3）。\n\n![Figure](img/fig06-07.jpg)调整列大小\n\n用户可以通过点击行中的任意位置来选择行。选中的行会被高亮；你稍后将看到如何获取选择事件。用户还可以通过点击单元格并在其中输入来编辑表格条目。然而，在这个代码示例中，编辑不会更改底层数据。在你的程序中，你应该让单元格变为不可编辑，或者处理单元格编辑事件并更新你的模型。我们将在本节稍后部分讨论这些主题。\n\
  \n最后，点击一个列头。行将自动排序。再次点击，排序顺序将反转。这种行为通过调用以下代码激活：\n\n```\ntable.setAutoCreateRowSorter(true);\n\
  ```\n\n你可以通过调用打印表格：\n\n```\ntable.print();\n```\n\n如果你没有将表格封装到滚动面板中，你需要显式地添加表头：\n\
  \n```\nadd(table.getTableHeader(), BorderLayout.NORTH);\n```\n\ntable/TableTest.java\n\
  \n```java\npackage table;\n\nimport java.awt.*;\nimport java.awt.print.*;\n\nimport\
  \ javax.swing.*;\n\n/**\n * 此程序演示如何显示一个简单的表格。\n * @version 1.14 2018-05-01\n * @author\
  \ Cay Horstmann\n */\npublic class TableTest\n{\n   public static void main(String[]\
  \ args)\n   {\n      EventQueue.invokeLater(() ->\n         {\n            var frame\
  \ = new PlanetTableFrame();\n            frame.setTitle(\"TableTest\");\n      \
  \      frame.setDefaultCloseOperation(JFrame.EXIT_ON_CLOSE);\n            frame.setVisible(true);\n\
  \         });\n   }\n}\n\n/**\n * 此框架包含一个行星数据表格。\n */\nclass PlanetTableFrame extends\
  \ JFrame\n{\n   private String[] columnNames = { \"Planet\", \"Radius\", \"Moons\"\
  , \"Gaseous\", \"Color\" };\n   private Object[][] cells = \n   { \n      { \"Mercury\"\
  , 2440.0, 0, false, Color.YELLOW },\n      { \"Venus\", 6052.0, 0, false, Color.YELLOW\
  \ }, \n      { \"Earth\", 6378.0, 1, false, Color.BLUE },\n      { \"Mars\", 3397.0,\
  \ 2, false, Color.RED }, \n      { \"Jupiter\", 71492.0, 16, true, Color.ORANGE\
  \ },\n      { \"Saturn\", 60268.0, 18, true, Color.ORANGE },\n      { \"Uranus\"\
  , 25559.0, 17, true, Color.BLUE },\n   };\n\n   public PlanetTableFrame()\n   {\n\
  \      var table = new JTable(cells, columnNames);\n      var pane = new JScrollPane(table);\n\
  \      add(pane, BorderLayout.CENTER);\n      add(table.getTableHeader(), BorderLayout.NORTH);\n\
  \      table.setAutoCreateRowSorter(true);\n   }\n}\n```\n\n\n\n\n\n```java\npackage\
  \ tableModel;\n\nimport java.awt.*;\n\nimport javax.swing.*;\nimport javax.swing.table.*;\n\
  \n/**\n * 此程序展示了如何从表格模型构建表格。\n * @version 1.05 2021-09-09\n * @author Cay Horstmann\n\
  \ */\npublic class InvestmentTable\n{\n   public static void main(String[] args)\n\
  \   {\n      EventQueue.invokeLater(() ->\n         {\n            var frame = new\
  \ InvestmentTableFrame();\n            frame.setTitle(\"InvestmentTable\");    \
  \           \n            frame.setDefaultCloseOperation(JFrame.EXIT_ON_CLOSE);\n\
  \            frame.setVisible(true);\n         });\n   }\n}\n\n/**\n * 此框架包含一个投资表格。\n\
  \ */\nclass InvestmentTableFrame extends JFrame\n{\n   public InvestmentTableFrame()\n\
  \   {\n      var model = new InvestmentTableModel(30, 5, 10);\n      var table =\
  \ new JTable(model);\n      add(new JScrollPane(table));\n      pack();\n   }\n\
  }\n\n/**\n * 此表格模型在每次请求时计算单元格条目。表格内容\n * 显示了投资在不同利率下多年份的增长情况。\n */\nclass InvestmentTableModel\
  \ extends AbstractTableModel\n{\n   private static double INITIAL_BALANCE = 100000.0;\n\
  \n   private int years;\n   private int minRate;\n   private int maxRate;\n\n  \
  \ /**\n    * 构造投资表格模型。\n    * @param y 年数\n    * @param r1 要列举的最低利率\n    * @param\
  \ r2 要列举的最高利率\n    */\n   public InvestmentTableModel(int y, int r1, int r2)\n \
  \  {\n      years = y;\n      minRate = r1;\n      maxRate = r2;\n   }\n\n   public\
  \ int getRowCount()\n   {\n      return years;\n   }\n\n   public int getColumnCount()\n\
  \   {\n      return maxRate - minRate + 1;\n   }\n\n   public Object getValueAt(int\
  \ r, int c)\n   {\n      double rate = (c + minRate) / 100.0;\n      int nperiods\
  \ = r;\n      double futureBalance = INITIAL_BALANCE * Math.pow(1 + rate, nperiods);\n\
  \      return \"%.2f\".formatted(futureBalance);\n   }\n\n   public String getColumnName(int\
  \ c)\n   {\n      return (c + minRate) + \"%\";\n   }\n}\n```\n\n`javax.swing.table.TableModel`\
  \ 1.2\n\n- `int getRowCount()`\n- `int getColumnCount()`\n    获取表格模型中的行数和列数。\n\n\
  - `Object getValueAt(int row, int column)`\n    获取指定行和列的值。\n\n- `void setValueAt(Object\
  \ newValue, int row, int column)`\n    在指定的行和列上设置新值。\n\n- `boolean isCellEditable(int\
  \ row, int column)`\n    如果指定行和列的单元格可编辑，则返回 `true`。\n\n- `String getColumnName(int\
  \ column)`\n    获取列标题。\n\n## 操作行和列\n\n在接下来的小节中，你将看到如何操作表格中的行和列。在阅读这些材料时，请记住 Swing\
  \ 表格是非常不对称的——你可以在行和列上执行的操作是不同的。表格组件经过优化，用于显示具有相同结构的行（例如数据库查询的结果），而不是任意的二维对象网格。你将在整个小节中看到这种不对称性。\n\
  \n### 列类\n\n在下一个示例中，我们再次显示了行星数据，但这次我们想让表格提供更多关于列类型的信息。这是通过定义表格模型的方法\n\n```\nClass<?>\
  \ getColumnClass(int columnIndex)\n```\n实现的，该方法返回描述列类型的类。\n\n`JTable` 类使用这些信息来为该类选择合适的渲染器。表\
  \ 12.1 显示了默认的渲染动作。\n\n默认渲染动作\n\n| 类型 | 渲染为 |\n| --- | --- |\n| `Boolean` | 复选框 |\n\
  | `Icon` | 图片 |\n| `Object` | 字符串 |\n\n你可以在 图 12.5 中看到复选框和图片。（感谢 Jim Evins 提供的行星图片！）\n\
  \n![Figure](img/fig06-09.jpg)带有行星数据的表格\n\n要渲染其他类型，你可以安装自定义渲染器——参见 第 12.3。\n\n###\
  \ 访问表格列\n\n`JTable` 类以 `TableColumn` 类型的对象存储关于表格列的信息。`TableColumnModel` 对象管理列。（图\
  \ 12.6 显示了最重要的表格类之间的关系。）如果你不想动态地插入或删除列，你就不会经常使用列模型。列模型最常见的用途仅仅是获取一个 `TableColumn`\
  \ 对象：\n\n```\nint columnIndex = . . .;\nTableColumn column = table.getColumnModel().getColumn(columnIndex);\n\
  ```\n\n![Figure](img/fig06-10.jpg)表格类之间的关系\n\n### 调整列宽\n\n`TableColumn` 类允许你控制调整大小。你可以通过以下方法设置首选、最小和最大宽度：\n\
  \n```\nvoid setPreferredWidth(int width)\nvoid setMinWidth(int width)\nvoid setMaxWidth(int\
  \ width)\n```\n\n`TableColumn` 类还提供了调整大小的开关。使用方法\n\n```\nvoid setResizable(boolean\
  \ resizable)\n```\n来控制是否允许列调整大小。你可以通过使用 `JTable` 类的\n\n```\nvoid setResizeMode(int\
  \ mode)\n```\n设置另一种行为。\n\n调整大小模式\n\n| 模式 | 行为 |\n| --- | --- |\n| `AUTO_RESIZE_OFF`\
  \ | 不调整其他列；改变表格宽度。 |\n| `AUTO_RESIZE_NEXT_COLUMN` | 仅调整下一列。 |\n| `AUTO_RESIZE_SUBSEQUENT_COLUMNS`\
  \ | 等等调整所有列；这是默认行为。 |\n| `AUTO_RESIZE_LAST_COLUMN` | 仅调整最后一列。 |\n| `AUTO_RESIZE_ALL_COLUMNS`\
  \ | 调整表格中的所有列；这不是一个好的选择，因为它阻止了用户将多个列调整到所需的大小。 |\n\n### 调整行高\n\n行的高度直接由 `JTable`\
  \ 类管理。如果你的单元格比默认的高，你可能需要设置行高：\n\n```\ntable.setRowHeight(height);\n```\n\n默认情况下，表格所有行的高度都相同。你可以通过调用设置单个行的高度：\n\
  \n```\ntable.setRowHeight(row, height);\n```\n\n实际行高等于通过这些方法设置的高度减去行边距。默认行边距为 1\
  \ 像素，但你可以通过调用更改它：\n\n```\ntable.setRowMargin(margin);\n```\n\n### 选择行、列和单元格\n\n\
  根据选择模式，用户可以选择表格中的行、列或单个单元格。默认启用行选择。点击单元格内部会选择整行（参见 图 12.5）。调用\n\n```\ntable.setRowSelectionAllowed(false);\n\
  ```\n禁用行选择。\n\n启用行选择时，你可以控制用户允许选择单行、连续一组行或任意一组行。你需要获取选择模型并使用它的 `setSelectionMode`\
  \ 方法：\n\n```\ntable.getSelectionModel().setSelectionMode(mode);\n```\n\n在这里，`mode`\
  \ 是三个值之一：\n\n```\nListSelectionModel.SINGLE_SELECTION\nListSelectionModel.SINGLE_INTERVAL_SELECTION\n\
  ListSelectionModel.MULTIPLE_INTERVAL_SELECTION\n```\n\n\n\n\n同时启用行和列选择等于启用单元格选择。用户随后可以选择单元格范围（参见图\
  \ 12.7）。你也可以通过调用启用该设置：\n\n```\ntable.setCellSelectionEnabled(true);\n```\n\n![Figure](img/fig06-11.jpg)选择单元格范围\n\
  \n运行列表 12.3 中的程序以观察单元格选择的操作。在“选择”菜单中启用行、列或单元格选择，并观察选择行为的变化。\n\n你可以通过调用 `getSelectedRows`\
  \ 和 `getSelectedColumns` 方法找到哪些行和列被选中。这两者都返回一个包含选中项索引的 `int[]` 数组。注意，索引值是表格视图的，而不是底层表格模型的。尝试选择行和列，然后将列拖到不同的位置，并通过点击列标题对行进行排序。使用“打印选择”菜单项查看哪些行和列被报告为已选中。\n\
  \n如果你需要将表格索引值转换为表格模型索引值，请使用 `JTable` 的方法 `convertRowIndexToModel` 和 `convertColumnIndexToModel`。\n\
  \n### 行排序\n\n正如我们在第一个表格示例中看到的，只需调用 `setAutoCreateRowSorter` 方法即可轻松为 `JTable` 添加行排序。然而，为了对排序行为进行更细粒度的控制，可以向\
  \ `JTable` 安装一个 `TableRowSorter<M>` 对象并对其进行自定义。类型参数 `M` 表示表格模型；它需要是 `TableModel`\
  \ 接口的子类型。\n\n```\nvar sorter = new TableRowSorter<TableModel>(model);\ntable.setRowSorter(sorter);\n\
  ```\n\n某些列不应该是可的，例如行星数据中的图像列。通过调用以下代码关闭排序：\n\n```\nsorter.setSortable(IMAGE_COLUMN,\
  \ false);\n```\n\n你可以为每一列安装自定义的比较器。在我们的示例中，我们将对 Color 列中的颜色进行排序，优先考虑蓝色和绿色而非红色。当你点击\
  \ Color 列时，你会发现蓝色行星移动到了表格的底部。这是通过以下调用实现的：\n\n```\nsorter.setComparator(COLOR_COLUMN,\
  \ new Comparator<Color>()\n   {\n      public int compare(Color c1, Color c2)\n\
  \      {\n         int d = c1.getBlue() - c2.getBlue();\n         if (d != 0) return\
  \ d;\n         d = c1.getGreen() - c2.getGreen();\n         if (d != 0) return d;\n\
  \         return c1.getRed() - c2.getRed();\n      }\n   });\n```\n\n如果你没有为列指定比较器，排序顺序将如下所示：\n\
  \n1. 如果列类型为 `String`，则使用 `Collator.getInstance()` 返回的默认排序器。它以适合当前语言环境的方式对字符串排序。（有关语言环境和排序器的更多信息，请参见第\
  \ 7 章\n   {\n      public String toString(TableModel model, int row, int column)\n\
  \      {\n             Object value = model.getValueAt(row, column);\n         \
  \    将 value 转换为字符串并返回\n          }\n   });\n   ```\n\n4. 否则，对单元格值调用 `toString`\
  \ 方法并使用默认排序器对其进行排序。\n\n### 行过滤\n\n除了排序行之外，`TableRowSorter` 还可以选择性地隐藏行——这个过程被称为*过滤*（filtering）。要激活过滤，请设置\
  \ `RowFilter`。例如，要包含包含至少一个月的所有行，请调用：\n\n```\nsorter.setRowFilter(RowFilter.numberFilter(ComparisonType.NOT_EQUAL,\
  \ 0, MOONS_COLUMN));\n```\n\n在这里，我们使用了预定义的数字过滤器。要构造数字过滤器，需要提供：\n\n- 比较类型（`EQUAL`、`NOT_EQUAL`、`AFTER`\
  \ 或 `BEFORE` 之一）。\n- `Number` 类的对象（例如 `Integer` 或 `Double`）。只有与给定的 `Number` 对象具有相同类的对象会被考虑。\n\
  - 零或多个列索引值。如果没有提供索引值，则将搜索所有列。\n\n静态方法 `RowFilter.dateFilter` 以相同的方式构造日期过滤器；你需要提供一个\
  \ `Date` 对象而不是 `Number` 对象。\n\n最后，静态方法 `RowFilter.regexFilter` 构造一个查找匹配正则表达式字符串的过滤器。例如，\n\
  \n```\nsorter.setRowFilter(RowFilter.regexFilter(\".*[^s]$\", PLANET_COLUMN));\n\
  ```\n\n只显示那些名称不以“s”结尾的行星。（有关正则表达式的更多信息，请参见第 2 章,\n   RowFilter.numberFilter(ComparisonType.NOT_EQUAL,\
  \ 0, MOONS_COLUMN))));\n```\n\n### 隐藏和显示列\n\n正如你在上一节中看到的，你可以根据内容或行标识符过滤表格行。隐藏表格列使用使用完全不同的机制。\n\
  \n`JTable` 类的 `removeColumn` 方法从表格视图中移除列。列数据实际上并没有从模型中删除——它们只是在视图中隐藏了。`removeColumn`\
  \ 方法有一个类型为 `TableColumn` 的参数。如果你有列号（例如通过调用 `getSelectedColumns` 获取），你需要向表格模型请求实际的表格列对象：\n\
  \n```\nTableColumnModel columnModel = table.getColumnModel();\nTableColumn column\
  \ = columnModel.getColumn(i);\ntable.removeColumn(column);\n```\n\n如果你记得该列，稍后可以添加回：\n\
  \n```\ntable.addColumn(column);\n```\n\n此方法将列添加到末尾。如果你想让它出现在其他地方，请调用 `moveColumn`\
  \ 方法。\n\n\n\n\n你也可以通过添加一个新的 `TableColumn` 对象来添加与表格模型中列索引对应的新列：\n\n```\ntable.addColumn(new\
  \ TableColumn(modelColumnIndex));\n```\n\n你可以拥有多个表格列来查看模型中的同一列。\n\n位于录 12.3 中的程序演示了行和列的选择与过滤。\n\
