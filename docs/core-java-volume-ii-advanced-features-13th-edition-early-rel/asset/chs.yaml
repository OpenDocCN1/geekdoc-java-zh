  ***\n\n## 字符串参数\n\n接下来，我们来看看如何在原生方法之间传输字符串。字符串在两种语言中非常不同：在 Java 中，它们是 UTF-16 代码点序列，而\
  \ C 字符串是空终止字节序列。JNI 有两组函数用于处理字符串：一组将 Java 字符串转换为“修改 UTF-8”序列，另一组将它们转换为 UTF-16 数组——即\
  \ `jchar` 数组。\n\nUTF-8 和“修改 UTF-8”编码仅对于高于 `0xFFFF` 的字符不同。在标准 UTF-8 编码中，这些字符被编码为\
  \ 4 字节序列。在“修改”编码中，每个字符首先被编码为 UTF-16 编码中的代理对，然后每个代理使用 UTF-8 编码，总共 6 个字节。这很笨拙，但这是一个历史意外——JVM\
  \ 规范编写时 Unicode 仍限于 16 位。\n\n如果你的 C 代码已经使用了 Unicode，你将希望使用第二组转换函数。另一方面，如果你所有的字符串都限制在\
  \ ASCII 字符，可以使用“修改 UTF-8”转换函数。\n\n带有 `String` 参数的原生方法实际上接收名为 `jstring` 的不透明类型的值。返回\
  \ `String` 的原生方法必须返回类型 `jstring` 的值。JNI 函数读取并构造这些 `jstring` 对象。例如，`NewStringUTF`\
  \ 函数根据包含 ASCII 字符或更通用地说包含“修改 UTF-8”编码字节序列的 `char` 数组创建一个新的 `jstring` 对象。\n\n\n\n\
  \n\n```\nJNIEXPORT jstring JNICALL Java_HelloNative_getGreeting(JNIEnv* env, jclass\
  \ cl)\n{\n   jstring jstr;\n   char greeting[] = \"Hello, Native World\\n\";\n \
  \  jstr = (*env)->NewStringUTF(env, greeting);\n   return jstr;\n}\n```\n\n除非另有说明，本章中的所有代码均为\
  \ C 代码。\n\n所有对 JNI 函数的调用都使用 `env` 指针，它是每个本地方法的第一个参数。`env` 指针是一个指向函数指针表的指针（请参阅 图\
  \ 13.2）。因此，你必须在每个 JNI 调用前加上缀 `(*env)->` 以才能实际解引用函数指针。此外，`env` 是每个 JNI 函数的第一个参数。\n\
  \n![Figure](img/fig12-02.jpg) `env` 指针\n\n在 C++ 中访问 JNI 函数更为简单。`JNIEnv` 类的 C++ 版本拥有内联成员函数，可以为你处理函数指针的查找。例如，你可以这样调用\
  \ `NewStringUTF` 函数：\n\n```\njstr = env->NewStringUTF(greeting);\n```\n\n注意，你在调用参数列表中省略了\
  \ `JNIEnv` 指针。\n\n`NewStringUTF` 函数允许你构造一个新的 `jstring`。要读取现有 `jstring` 对象的内容，请使用\
  \ `GetStringUTFChars` 函数。该函数返回一个 `const jbyte*` 指针，指向描述字符字符串的“修改后的 UTF-8”字符。请注意，特定的虚拟机可以选择这种字符编码作为其内部字符串表示，因此你可能会得到一个指向实际\
  \ Java 字符串的字符指针。由于 Java 字符串被认为是不可变的，认真对待 `const` 并不要尝试写入此字符数组是非常重要的。另一方面，如果虚拟机使用\
  \ UTF-16 或 UTF-32 字符作为其内部字符串表示，此函数调用将分配一个新的内存块，并填充“修改后的 UTF-8”等效字符。\n\n虚拟机必须知道你何时结束使用该字符串，以便对其进行垃圾回收（垃圾回收器在单独线程中运行，并可以中断本地方法的执行）。出于因此，你必须调用\
  \ `ReleaseStringUTFChars` 函数。\n\n或者，你可以通过调用 `GetStringRegion` 或 `GetStringUTFRegion`\
  \ 方法提供自己的缓冲区来存放字符串字符。\n\n最后，`GetStringUTFLength` 函数返回字符串转换为“修改后的 UTF-8”编码所需的字符数。\n\
  \n你可以在 [`docs.oracle.com/javase/7/docs/technotes/guides/jni`](https://docs.oracle.com/javase/7/docs/technotes/guides/jni)\
  \ 找到 JNI API。\n\n### 从 C 代码访问 Java 字符串\n\n* `jstring NewStringUTF(JNIEnv* env, const\
  \ char bytes[])`\n  从一个以零字节终止的“修改后的 UTF-8”字节序列返回一个新的 Java 字符串对象，如果无法构造字符串则返回 `NULL`。\n\
  \n* `jsize GetStringUTFLength(JNIEnv* env, jstring string)`\n  返回“修改后的 UTF-8”编码所需的字节数（不计入零字节终止符）。\n\
  \n* `const jbyte* GetStringUTFChars(JNIEnv* env, jstring string, jboolean* isCopy)`\n\
  \  返回一个指向字符串“修改后的 UTF-8”编码的指针，如果无法构造字符数组则返回 `NULL`。该指针在调用 `ReleaseStringUTFChars`\
  \ 之前有效。`isCopy` 指向一个 `jboolean`，如果进行了复制，则填充为 `JNI_TRUE`，否则填充为 `JNI_FALSE`。\n\n*\
  \ `void ReleaseStringUTFChars(JNIEnv* env, jstring string, const jbyte bytes[])`\n\
  \  通知虚拟机本地代码不再需要通过 `bytes`（由 `GetStringUTFChars` 返回的指针）访问 Java 字符串。\n\n* `void GetStringRegion(JNIEnv\
  \ *env, jstring string, jsize start, jsize length, jchar *buffer)`\n  将字符串中的一组 UTF-16\
  \ 双字节拷贝到大小至少为 2 × `length` 的用户提供的缓冲区。\n\n* `void GetStringUTFRegion(JNIEnv *env,\
  \ jstring string, jsize start, jsize length, jbyte *buffer)`\n  将字符串中的一组“修改后的 UTF-8”字节拷贝到用户提供的缓冲区。缓冲区必须足够长以容纳这些字节。在最坏的情况下，将拷贝\
  \ 3 × `length` 字节。\n\n* `jstring NewString(JNIEnv* env, const jchar chars[], jsize\
  \ length)`\n  从 Unicode 字符串返回一个新的 Java 字符串对象，如果无法构造字符串则返回 `NULL`。\n\n* `jsize GetStringLength(JNIEnv*\
  \ env, jstring string)`\n  返回字符串中的字符数。\n\n* `const jchar* GetStringChars(JNIEnv*\
  \ env, jstring string, jboolean* isCopy)`\n  返回一个指向字符串 Unicode 编码的指针，如果无法构造字符数组则返回\
  \ `NULL`。该指针在调用 `ReleaseStringChars` 之前有效。`isCopy` 为 `NULL` 或指向一个 `jboolean`，如果进行了复制，则填充为\
  \ `JNI_TRUE`，否则填充为 `JNI_FALSE`。\n\n* `void ReleaseStringChars(JNIEnv* env, jstring\
  \ string, const jchar chars[])`\n  通知虚拟机本地代码不再需要通过 `chars`（由 `GetStringChars` 返回的指针）访问\
  \ Java 字符串。\n\n\n\n\n```c\n/**\n   @version 1.10 1997-07-01\n   @author Cay Horstmann\n\
  */\n\n#include \"Printf2.h\"\n#include <string.h>\n#include <stdlib.h>\n#include\
  \ <float.h>\n\n/**\n   @param format 一个包含 printf 格式说明符的字符串\n   (例如 \"%8.2f\"）。子字符串\
  \ \"%%\" 将跳过。\n   @return 返回格式说明符的指针（跳过 '%'）\n   如果没有唯一的格式说明符，则返回 NULL\n*/\nchar*\
  \ find_format(const char format[])\n{  \n   char* p;\n   char* q;\n\n   p = strchr(format,\
  \ '%');\n   while (p != NULL && *(p + 1) == '%') /* 跳过 %% */\n      p = strchr(p\
  \ + 2, '%');\n   if (p == NULL) return NULL;\n   /* 现在检查 % 是否是唯一的 */\n   p++;\n\
  \   q = strchr(p, '%');\n   while (q != NULL && *(q + 1) == '%') /* 跳过 %% */\n \
  \     q = strchr(q + 2, '%');\n   if (q != NULL) return NULL; /* % 不唯一 */\n   q\
  \ = p + strspn(p, \" -0+#\"); /* 跳过标志位 */\n   q += strspn(q, \"0123456789\"); /*\
  \ 跳过字段宽度 */\n   if (*q == '.') { q++; q += strspn(q, \"0123456789\"); }\n      /*\
  \ 跳过精度 */\n   if (strchr(\"eEfFgG\", *q) == NULL) return NULL;\n      /* 不是浮点数格式\
  \ */\n   return p;\n}\n\nJNIEXPORT jstring JNICALL Java_Printf2_sprint(JNIEnv* env,\
  \ jclass cl, \n      jstring format, jdouble x)\n{  \n   const char* cformat;\n\
  \   char* fmt;\n   jstring ret;\n\n   cformat = (*env)->GetStringUTFChars(env, format,\
  \ NULL);\n   fmt = find_format(cformat);\n   if (fmt == NULL)\n      ret = format;\n\
  \   else\n   {  \n      char* cret;\n      int width = atoi(fmt);\n      if (width\
  \ == 0) width = DBL_DIG + 10;\n      cret = (char*) malloc(strlen(cformat) + width);\n\
  \      sprintf(cret, cformat, x);\n      ret = (*env)->NewStringUTF(env, cret);\n\
  \      free(cret);\n   }\n   (*env)->ReleaseStringUTFChars(env, format, cformat);\n\
  \   return ret;\n}\n```\n\n在这个函数中，我们选择保持简单的错误处理。如果打印浮点数的格式代码不是 `%w.pc` 形式（其中 `c`\
  \ 是 `e`、`E`、`f`、`g` 或 `G` 之一），我们简单地不对数字进行格式化。稍后我们将向你展示如何让原生方法抛出异常。\n\n## 访问字段\n\n\
  你目前为止看到的所有原生方法都是带有数字和字符串参数的静态方法。我们现在考虑操作对象的原生方法。作为一项练习，我们将以原生形式重新实现在第一卷第 4 章中引入的\
  \ `Employee` 类的一个方法。再次，这通常不是你想要做的，但它确实说明了在需要时如何从原生方法访问字段。\n\n### 访问实例字段\n\n为了查看如何从原生方法访问实例字段，我们将重新实现\
  \ `raiseSalary` 方法。以下是 Java 代码：\n\n```java\npublic void raiseSalary(double byPercent)\n\
  {\n   salary *= 1 + byPercent / 100;\n}\n```\n\n让我们将此方法重写为原生方法。与之前的原生方法示例不同，它不是一个静态方法。运行\
  \ `javac -h` 会得到以下原型定义：\n\n```\nJNIEXPORT void JNICALL Java_Employee_raiseSalary(JNIEnv\
  \ *, jobject, jdouble);\n```\n\n注意第二个参数。它不再是 `jclass` 类型，而是 `jobject` 类型。事实上，它是\
  \ `this` 引用的等效物。静态方法获取类的引用，而非静态方法获取隐式 `this` 参数对象的引用。\n\n现在我们访问隐式参数的 `salary` 字段。在\
  \ Java 1.0 的“原始”Java 到 C 绑定中，这是很容易的——程序员可以直接访问实例字段。然而，直接访问要求所有虚拟机暴露其内部数据布局。出于此原因，JNI\
  \ 要求程序员通过调用特殊的 JNI 函数来获取和设置实例字段的值。\n\n在我们的情况下，我们需要使用 `GetDoubleField` 和 `SetDoubleField`\
  \ 函数，因为 `salary` 的类型是 `double`。还有其他函数——`GetIntField/SetIntField`、`GetObjectField/SetObjectField`\
  \ 等用于其他字段类型。通用语法为：\n\n```\nx = (*env)->GetXxxField(env, this_obj, fieldID);\n(*env)->SetXxxField(env,\
  \ this_obj, fieldID, x);\n```\n\n在这里，`fieldID` 是特殊类型 `jfieldID` 的值，用于标识结构中的字段，`Xxx`\
  \ 代表字段类型。\n\n\n\n\n```java\n/**\n * @version 1.10 1999-11-13\n * @author Cay Horstmann\n\
  \ */\n\npublic class Employee\n{\n   private String name;\n   private double salary;\n\
  \n   public native void raiseSalary(double byPercent);\n\n   public Employee(String\
  \ n, double s)\n   {\n      name = n;\n      salary = s;\n   }\n\n   public void\
  \ print()\n   {\n      System.out.println(name + \" \" + salary);\n   }\n\n   static\n\
  \   {\n      System.loadLibrary(\"Employee\");\n   }\n}\n```\n\n`employee/Employee.c`\n\
  \n```c\n/**\n   @version 1.10 1999-11-13\n   @author Cay Horstmann\n*/\n\n#include\
  \ \"Employee.h\"\n\n#include <stdio.h>\n\nJNIEXPORT void JNICALL Java_Employee_raiseSalary(\n\
  \      JNIEnv* env, jobject this_obj, jdouble byPercent)\n{  \n   /* get the class\
  \ */\n   jclass class_Employee = (*env)->GetObjectClass(env, this_obj);\n\n   /*\
  \ get the field ID */\n   jfieldID id_salary = (*env)->GetFieldID(env, class_Employee,\
  \ \"salary\", \"D\");\n\n   /* get the field value */\n   jdouble salary = (*env)->GetDoubleField(env,\
  \ this_obj, id_salary);\n\n   salary *= 1 + byPercent / 100;\n\n   /* set the field\
  \ value */\n   (*env)->SetDoubleField(env, this_obj, id_salary, salary);\n}\n```\n\
  \n## 访问静态字段\n\n访问静态字段与访问非静态字段类似。使用 `GetStaticFieldID` 和 `GetStatic`Xxx`Field/SetStatic`Xxx`Field`\
  \ 函数，这些函数的作用与其非静态函数几乎相同，但有两个不同：\n\n- 因为你没有对象，所以必须使用 `FindClass` 而不是 `GetObjectClass`\
  \ 来获取类引用。\n- 在访问字段时，你必须提供类而不是实例对象。\n\n例如，这里是你可以获取 `System.out` 引用的方法：\n\n```c\n\
  /* get the class */\njclass class_System = (*env)->FindClass(env, \"java/lang/System\"\
  );\n\n/* get the field ID */\njfieldID id_out = (*env)->GetStaticFieldID(env, class_System,\
  \ \"out\",\n   \"Ljava/io/PrintStream;\");\n\n/* get the field value */\njobject\
  \ obj_out = (*env)->GetStaticObjectField(env, class_System, id_out);\n```\n\n###\
  \ 访问字段\n\n- `jfieldID GetFieldID(JNIEnv *env, jclass cl, const char name[], const\
  \ char fieldSignature[])` 返回类中字段的标识符。\n- `Xxx Get`Xxx`Field(JNIEnv *env, jobject\
  \ obj, jfieldID id)` 返回字段的值。字段类型 `Xxx` 是 `Object`, `Boolean`, `Byte`, `Char`, `Short`,\
  \ `Int`, `Long`, `Float` 或 `Double` 之一。\n- `void Set`Xxx`Field(JNIEnv *env, jobject\
  \ obj, jfieldID id, Xxx value)` 将字段设置为新值。字段类型 `Xxx` 是 `Object`, `Boolean`, `Byte`,\
  \ `Char`, `Short`, `Int`, `Long`, `Float` 或 `Double` 之一。\n- `jfieldID GetStaticFieldID(JNIEnv\
  \ *env, jclass cl, const char name[], const char fieldSignature[])` 返回类中静态字段的标识符。\n\
  - `Xxx GetStatic`Xxx`Field(JNIEnv *env, jclass cl, jfieldID id)` 返回静态字段的值。字段类型 `Xxx`\
  \ 是 `Object`, `Boolean`, `Byte`, `Char`, `Short`, `Int`, `Long`, `Float` 或 `Double`\
  \ 之一。\n- `void SetStatic`Xxx`Field(JNIEnv *env, jclass cl, jfieldID id, Xxx value)`\
  \ 将静态字段设置为新值。字段类型 `Xxx` 是 `Object`, `Boolean`, `Byte`, `Char`, `Short`, `Int`, `Long`,\
  \ `Float` 或 `Double` 之一。\n\n## 签名编码\n\n为了访问实例字段并调用 Java 语言定义的方法，你需要学习数据类型名称和方法签名的“混淆”（mangling）规则。（方法签名描述了方法的参数和返回类型）。以下是编码方案：\n\
  \n| 签名 | 描述 |\n| :--- | :--- |\n| `B` | `byte` |\n| `C` | `char` |\n| `D` | `double`\
  \ |\n| `F` | `float` |\n| `I` | `int` |\n| `J` | `long` |\n| `Lclassname;` | 类类型\
  \ |\n| `S` | `short` |\n| `V` | `void` |\n| `Z` | `boolean` |\n\n要描述数组类型，使用 `[`。例如，字符串数组是\
  \ `[Ljava/lang/String;`。一个 `float[][]` 被混淆为 `[[F`。对于方法的完整签名，在括号内列出参数类型，然后列出返回类型。例如，接收两个整数并返回整数的方法被编码为\
  \ `(II)I`。\n\n## 调用 Java 方法\n\n当然，Java 语言函数可以调用 C 函数——这就是原生方法的的用途。我们能反过来这样做吗？为什么要这样做呢？通常原生方法需要向传递它的对象请求服务。我将首先向你展示如何处理实例方法，然后是静态方法。\n\
  \n### 实例方法\n\n作为从原生代码调用 Java 方法的示例，让我们增强 `Printf` 类并添加类似于 C 函数 `fprintf` 的方法。也就是说，它应该能够在任意\
  \ `PrintWriter` 对象上打印字符串。这里是该方法在 Java 中的定义：\n\n```java\nclass Printf\n{\n   public\
  \ native void fprint(PrintWriter out, String s, double x);\n   . . .\n}\n```\n\n\
  我们将首先将要打印的字符串组造成 `String` 对象 `str`，正如我们在 `sprint` 方法中所做的那样。然后，从实现原生方法的 C 函数中，调用\
  \ `PrintWriter` 类的方法。\n\n你可以通过使用函数调用从 C 调用任何 Java 方法：\n\n```c\n(*env)->CallXxxMethod(env,\
  \ implicit argument, methodID, explicit arguments)\n```\n\n将 `Xxx` 替换为 `Void`、`Int`、`Object`\
  \ 等，取决于方法的返回值。就像访问对象的字段需要 `fieldID` 一样，调用方法需要方法 ID。要获取方法 ID，请调用 JNI 函数 `GetMethodID`\
  \ 并提供类、方法名和方法签名。\n\n\n\n\n\n在我们的示例中，我们想要获取 `PrintWriter` 类中 `print` 方法的 ID。`PrintWriter`\
  \ 类有多个名为 `print` 的重载方法。因此，你还必须提供一个字符串，来描述你想要使用的特定函数的参数和返回值。例如，我们想要使用 `void print(java.lang.String)`。正如前节所述，我们现在必须将该签名“修饰”（mangle）为字符串\
  \ `\"(Ljava/lang/String;)V\"`。\n\n以下是调用该方法的完整代码：\n\n```c\n/* get the class of the\
  \ implicit parameter */\nclass_PrintWriter = (*env)->GetObjectClass(env, out);\n\
  \n/* get the method ID */\nid_print = (*env)->GetMethodID(env, class_PrintWriter,\
  \ \"print\", \"(Ljava/lang/String;)V\");\n\n/* call the method */\n(*env)->CallVoidMethod(env,\
  \ out, id_print, str);\n```\n\nListing 13.14 显示了该测试程序的 Java 代码。`Printf3` 类位于 Listing\
  \ 13.15。Listing 13.16 包含了原生方法 `fprint` 的 C 代码。\n\n数值型方法 ID 和字段 ID 在概念上与反射 API 中的\
  \ `Method` 和 `Field` 对象相似。你可以使用以下函数在它们之间转换：\n\n```c\njobject ToReflectedMethod(JNIEnv*\
  \ env, jclass class, jmethodID methodID);\n   // returns Method object\nmethodID\
  \ FromReflectedMethod(JNIEnv* env, jobject method);\njobject ToReflectedField(JNIEnv*\
  \ env, jclass class, jfieldID fieldID);\n   // returns Field object\nfieldID FromReflectedField(JNIEnv*\
  \ env, jobject field);\n```\n\n### 静态方法\n\n从原生方法调用静态方法与调用实例方法相似。有两个区别：\n\n- 使用 `GetStaticMethodID`\
  \ 和 `CallStaticXxxMethod` 函数\n- 在调用方法时提供类对象，而不是隐式参数对象\n\n为了作为一个示例，让我们从原生方法调用静态方法：\n\
  \n```java\nSystem.getProperty(\"java.class.path\")\n```\n\n该调用的返回值是一个提供当前类路径的字符串。\n\
  \n首先，我们必须找到要使用的类。由于我们没有现成的 `System` 类对象，因此我们使用 `FindClass` 而不是 `GetObjectClass`。\n\
  \n```c\njclass class_System = (*env)->FindClass(env, \"java/lang/System\");\n```\n\
  \n接下来，我们需要静态方法 `getProperty` 的 ID。该方法的编码签名是：\n\n```\n\"(Ljava/lang/String;)Ljava/lang/String;\"\
  \n```\n\n因为其参数和返回值都是字符串。因此，我们如下所示获取方法 ID：\n\n```c\njmethodID id_getProperty = (*env)->GetStaticMethodID(env,\
  \ class_System, \"getProperty\",\n   \"(Ljava/lang/String;)Ljava/lang/String;\"\
  );\n```\n\n最后，我们可以进行调用。注意，类对象被传递给 `CallStaticObjectMethod` 函数。\n\n```c\njobject\
  \ obj_ret = (*env)->CallStaticObjectMethod(env, class_System, id_getProperty,\n\
  \   (*env)->NewStringUTF(env, \"java.class.path\"));\n```\n\n该方法的返回值类型为 `jobject`。如果我们想将其作为字符串处理，必须将其强制转换为\
  \ `jstring`：\n\n```c\njstring str_ret = (jstring) obj_ret;\n```\n\n在 C 中，类型 `jstring`\
  \ 和 `jclass` 以及稍后引入的数组类型在类型上都等同于 `jobject`。因此，在 C 中上述示例的转换并不是严格必要的。但在 C++ 中，这些类型被定义为指向“哑类”的指针，这些类具有正确的继承层次。例如，在\
  \ C++ 中将 `jstring` 赋值给 `jobject` 是合法的，但从 `jobject` 赋值到 `jstring` 则需要强制转换。\n\n###\
  \ 构造函数\n\n原生方法可以通过调用构造函数来创建新的 Java 对象。通过调用 `NewObject` 函数来执行构造函数。\n\n```c\njobject\
  \ obj_new = (*env)->NewObject(env, class, methodID, construction arguments);\n```\n\
  \n你可以通过 `GetMethodID` 函数获取此调用所需的方法 ID，只需指定方法名为 `\"<init>\"` 以及构造函数的编码签名（返回类型为 `void`）。例如，这里是原生方法如何创建一个\
  \ `FileOutputStream` 对象的方法：\n\n```c\nconst char[] fileName = \". . .\";\njstring\
  \ str_fileName = (*env)->NewStringUTF(env, fileName);\njclass class_FileOutputStream\
  \ = (*env)->FindClass(env, \"java/io/FileOutputStream\");\njmethodID id_FileOutputStream\n\
  \   = (*env)->GetMethodID(env, class_FileOutputStream, \"<init>\", \"(Ljava/lang/String;)V\"\
  );\njobject obj_stream\n   = (*env)->NewObject(env, class_FileOutputStream, id_FileOutputStream,\
  \ str_fileName);\n```\n\n注意，构造函数的签名有一个类型为 `java.lang.String` 的参数，且返回类型为 `void`。\n\
  \n### 其他方法调用\n\n可以使用 JNI 函数的几种变体来从原生代码调用 Java 方法。这些函数不像我们已经讨论过的那样重要，但有时很有用。\n\n\
  `CallNonvirtualXxxMethod` 函数接收一个隐式参数、一个方法 ID、一个类对象（必须与隐式参数的父类对应）以及显式参数。该函数调用指定类中的方法版本，从而跳过普通的分发机制。\n\
  \n所有调用函数都有带有后缀“A”和“V”的版本，这些版本通过数组或 `va_list`（如 C 头文件 `stdarg.h` 中定义）来接收显式参数。\n\n\
  \n\n\n\n```c\n/**\n   @version 1.10 1997-07-01\n   @author Cay Horstmann\n*/\n\n\
  #include \"Printf3.h\"\n#include <string.h>\n#include <stdlib.h>\n#include <float.h>\n\
  \n/**\n   @param format 一个包含 printf 格式说明符的字符串\n   （例如 \"%8.2f\"）。将跳过子字符串 \"%%\"\
  。\n   @return 指向格式说明符的指针（跳过 '%'）\n   或者如果没有唯一的格式说明符，则返回 NULL。\n*/\nchar* find_format(const\
  \ char format[])\n{  \n   char* p;\n   char* q;\n\n   p = strchr(format, '%');\n\
  \   while (p != NULL && *(p + 1) == '%') /* 跳过 %% */\n      p = strchr(p + 2, '%');\n\
  \   if (p == NULL) return NULL;\n   /* 现在检查 % 是否为唯一 */\n   p++;\n   q = strchr(p,\
  \ '%');\n   while (q != NULL && *(q + 1) == '%') /* 跳过 %% */\n      q = strchr(q\
  \ + 2, '%');\n   if (q != NULL) return NULL; /* % 不唯一 */\n   q = p + strspn(p, \"\
  \ -0+#\"); /* 跳过标志 */\n   q += strspn(q, \"0123456789\"); /* 跳过字段宽度 */\n   if (*q\
  \ == '.') { q++; q += strspn(q, \"0123456789\"); }\n      /* 跳过精度 */\n   if (strchr(\"\
  eEfFgG\", *q) == NULL) return NULL;\n      /* 不是浮点数格式 */\n   return p;\n}\n\nJNIEXPORT\
  \ void JNICALL Java_Printf3_fprint(JNIEnv* env, jclass cl, \n      jobject out,\
  \ jstring format, jdouble x)\n{  \n   const char* cformat;\n   char* fmt;\n   jstring\
  \ str;\n   jclass class_PrintWriter;\n   jmethodID id_print;\n\n   cformat = (*env)->GetStringUTFChars(env,\
  \ format, NULL);\n   fmt = find_format(cformat);\n   if (fmt == NULL)\n      str\
  \ = format;\n   else\n   {  \n      char* cstr;\n      int width = atoi(fmt);\n\
  \      if (width == 0) width = DBL_DIG + 10;\n      cstr = (char*) malloc(strlen(cformat)\
  \ + width);\n      sprintf(cstr, cformat, x);\n      str = (*env)->NewStringUTF(env,\
  \ cstr);\n      free(cstr);\n   }\n   (*env)->ReleaseStringUTFChars(env, format,\
  \ cformat);\n\n   /* 现在调用 out.print(str) */\n\n   /* 获取类 */\n   class_PrintWriter\
  \ = (*env)->GetObjectClass(env, out);\n\n   /* 获取方法 ID */\n   id_print = (*env)->GetMethodID(env,\
  \ class_PrintWriter, \"print\", \"(Ljava/lang/String;)V\");\n\n   /* 调用方法 */\n \
  \  (*env)->CallVoidMethod(env, out, id_print, str);\n}\n```\n\n## 执行 Java 方法\n\n\
  - `jmethodID GetMethodID(JNIEnv *env, jclass cl, const char name[], const char methodSignature[])`\n\
  \  返回类中某个方法的标识符。\n\n- `Xxx CallXxxMethod(JNIEnv *env, jobject obj, jmethodID id,\
  \ args)`\n\n- `Xxx CallXxxMethodA(JNIEnv *env, jobject obj, jmethodID id, jvalue\
  \ args[])`\n\n- `Xxx CallXxxMethodV(JNIEnv *env, jobject obj, jmethodID id, va_list\
  \ args)`\n  调用一个方法。返回类型 `Xxx` 是 `Object`, `Boolean`, `Byte`, `Char`, `Short`, `Int`,\
  \ `Long`, `Float` 或 `Double` 之一。第一个函数具有可变参数——只需在方法 ID 之后附加方法参数。第二个函数在 `jvalue` 数组中接收方法参数，其中\
  \ `jvalue` 是定义如下联合体：\n\n```c\ntypedef union jvalue\n{\n   jboolean z;\n   jbyte\
  \ b;\n   jchar c;\n   jshort s;\n   jint i;\n   jlong j;\n   jfloat f;\n   jdouble\
  \ d;\n   jobject l;\n} jvalue;\n```\n第三个函数在 C 头文件 `stdarg.h` 中定义的 `va_list` 中接收方法参数。\n\
  \n- `Xxx CallNonvirtualXxxMethod(JNIEnv *env, jobject obj, jclass cl, jmethodID\
  \ id, args)`\n\n- `Xxx CallNonvirtualXxxMethodA(JNIEnv *env, jobject obj, jclass\
  \ cl, jmethodID id, jvalue args[])`\n\n- `Xxx CallNonvirtualXxxMethodV(JNIEnv *env,\
  \ jobject obj, jclass cl, jmethodID id, va_list args)`\n  调用一个方法，绕过动态分发。返回类型 `Xxx`\
  \ 是 `Object`, `Boolean`, `Byte`, `Char`, `Short`, `Int`, `Long`, `Float` 或 `Double`\
  \ 之一。\n\n- `jmethodID GetStaticMethodID(JNIEnv *env, jclass cl, const char name[],\
  \ const char methodSignature[])`\n  返回类中静态方法的标识符。\n\n- `Xxx CallStaticXxxMethod(JNIEnv\
  \ *env, jobject obj, jmethodID id, args)`\n\n- `Xxx CallStaticXxxMethodA(JNIEnv\
  \ *env, jobject obj, jmethodID id, jvalue args[])`\n\n- `Xxx CallStaticXxxMethodV(JNIEnv\
  \ *env, jobject obj, jmethodID id, va_list args)`\n  调用静态方法。返回类型 `Xxx` 是 `Object`,\
  \ `Boolean`, `Byte`, `Char`, `Short`, `Int`, `Long`, `Float` 或 `Double`。\n\n## 访问数组元素\n\
  \n在 C 中，所有数组类型实际上都是 `jobject` 的同义词。但在 C++ 中，它们按照图 1.3 所示的排列。\n\n### 数组长度\n`GetArrayLength`\
  \ 返回数组的长度。\n```c\njarray array = . . .;\njsize length = (*env)->GetArrayLength(env,\
  \ array);\n```\n\n### 对象数组\n要访问对象数组元素，使用 `GetObjectArrayElement` 和 `SetObjectArrayElement`。\n\
  ```c\njobjectArray array = . . .;\nint i, j;\njobject x = (*env)->GetObjectArrayElement(env,\
  \ array, i);\n(*env)->SetObjectArrayElement(env, array, j, x);\n```\n\n### 原始类型数组\n\
  `GetXxxArrayElements` 返回指向数组起始元素的 C 指针。与普通字符串一样，你必须调用相应的 `ReleaseXxxArrayElements`\
  \ 函数告诉虚拟机你不再需要该指针。在这里，类型 `Xxx` 必须是原始类型——即不是 `Object`。你可以直接读写数组元素。但是，由于指针*可能指向一个副本*，你所做的任何更改在调用相应的\
  \ `ReleaseXxxArrayElements` 函数后，保证会反映在原始数组中！\n\n\n\n\n\n```\njdoubleArray array_a\
  \ = . . .;\ndouble scaleFactor = . . .;\ndouble* a = (*env)->GetDoubleArrayElements(env,\
  \ array_a, NULL);\nfor (i = 0; i < (*env)->GetArrayLength(env, array_a); i++)\n\
  \   a[i] = a[i] * scaleFactor;\n(*env)->ReleaseDoubleArrayElements(env, array_a,\
  \ a, 0);\n```\n\n虚拟机是否实际复制数组取决于它如何分配数组以及如何进行垃圾回收。某些“复制型”垃圾回收器会例行移动对象并更新对象引用。这种策略与将数组“固定”（pinning）在特定位置是不兼容的，因为垃圾回收器无法更新原生代码中的指针值。\n\
  \n在 Oracle JVM 的实现中，`boolean` 数组被表示为 32 位字的紧凑数组。`GetBooleanArrayElements` 方法将它们复制到\
  \ `jboolean` 值的解包数组中。\n\n为了访问大数组中的少数元素，可以使用 `GetXxxArrayRegion` 和 `SetXxxArrayRegion`\
  \ 方法，这些方法可以将范围内的元素从 Java 数组复制到 C 数组并反之回来。\n\n你可以使用 `NewXxxArray` 函数在原生方法中创建新的 Java\
  \ 数组。要创建一个新的对象数组，请指定长度、数组元素的类型以及所有条目的初始元素（通常为 `NULL`）。这里是一个示例：\n\n```\njclass class_Employee\
  \ = (*env)->FindClass(env, \"Employee\");\njobjectArray array_e = (*env)->NewObjectArray(env,\
  \ 100, class_Employee, NULL);\n```\n\n基本数据类型的数组更为简单：只需提供数组的长度。\n\n```\njdoubleArray\
  \ array_d = (*env)->NewDoubleArray(env, 100);\n```\n\n该数组将被填充为零。\n\n以下方法被用于操作“直接缓冲区”（direct\
  \ buffers）：\n\n```\njobject NewDirectByteBuffer(JNIEnv* env, void* address, jlong\
  \ capacity)\nvoid* GetDirectBufferAddress(JNIEnv* env, jobject buf)\njlong GetDirectBufferCapacity(JNIEnv*\
  \ env, jobject buf)\n```\n\n直接缓冲区用于 `java.nio` 包，以支持更高效的输入/输出操作，并尽量减少原生数组与 Java\
  \ 数组之间的数据拷贝。\n\n### 操作 Java 数组\n\n* `jsize GetArrayLength(JNIEnv *env, jarray array)`\n\
  \  返回数组中的元素个数。\n\n* `jobject GetObjectArrayElement(JNIEnv *env, jobjectArray array,\
  \ jsize index)`\n  返回数组元素的值。\n\n* `void SetObjectArrayElement(JNIEnv *env, jobjectArray\
  \ array, jsize index, jobject value)`\n  将数组元素设置为新值。\n\n* `Xxx* GetXxxArrayElements(JNIEnv\
  \ *env, jarray array, jboolean* isCopy)`\n  产生一个指向 Java 数组元素的 C 指针。字段类型 `Xxx` 是\
  \ `Boolean`、`Byte`、`Char`、`Short`、`Int`、`Long`、`Float` 或 `Double` 之一。当不再需要该指针时，必须传递给\
  \ `ReleaseXxxArrayElements`。`isCopy` 为 `NULL` 或指向一个 `jboolean`，如果是复制，则填充为 `JNI_TRUE`，否则填充为\
  \ `JNI_FALSE`。\n\n* `void ReleaseXxxArrayElements(JNIEnv *env, jarray array, Xxx\
  \ elems[], jint mode)`\n  通知虚拟机通过 `GetXxxArrayElements` 获取的指针已不再需要。`mode` 为 `0`（在更新数组元素后释放\
  \ `elems` 缓冲区）、`JNI_COMMIT`（在更新数组元素后不释放 `elems` 缓冲区）或 `JNI_ABORT`（在不更新数组元素的情况下释放\
  \ `elems` 缓冲区）。\n\n* `void GetXxxArrayRegion(JNIEnv *env, jarray array, jint start,\
  \ int length, Xxx elems[])`\n  将元素从 Java 数组复制到 C 数组。字段类型 `Xxx` 是 `Boolean`、`Byte`、`Char`、`Short`、`Int`、`Long`、`Float`\
  \ 或 `Double` 之一。\n\n* `void SetXxxArrayRegion(JNIEnv *env, jarray array, jint start,\
  \ jint length, Xxx elems[])`\n  将元素从 C 数组复制到 Java 数组。字段类型 `Xxx` 是 `Boolean`、`Byte`、`Char`、`Short`、`Int`、`Long`、`Float`\
  \ 或 `Double` 之一。\n\n## 处理错误\n\n原生方法对 Java 程序构成了重大的安全风险。C 运行时系统没有针对数组边界错误、通过错误指针进行间接访问等的保护。原生方法的程序员处理所有错误情况以维护\
  \ Java 平台的完整性，这一点尤为重要。特别是当你的原生方法诊断出它无法处理的问题时，它应该向 Java 虚拟机报告此问题。\n\n通常情况下，在这种情况下抛出一个异常。然而，C\
  \ 没有异常。相反，你必须调用 `Throw` 或 `ThrowNew` 函数创建一个新的异常对象。当原生方法退出时，Java 虚拟机会抛出该异常。\n\n要使用\
  \ `Throw` 函数，请调用 `NewObject` 创建 `Throwable` 子类的对象。例如，我们分配一个 `EOFException` 对象并抛出它：\n\
  \n```\njclass class_EOFException = (*env)->FindClass(env, \"java/io/EOFException\"\
  );\njmethodID id_EOFException = (*env)->GetMethodID(env, class_EOFException, \"\
  <init>\", \"()V\");\n/* 获取无参数构造函数 */\njthrowable obj_exc = (*env)->NewObject(env,\
  \ class_EOFException);\n/* 抛出异常 */\n(*env)->Throw(env, obj_exc);\n```\n\n通常更方便的是使用\
  \ `ThrowNew`，它给定一个类和一个修改后的 UTF-8 字节序列来构造异常。\n\n```\n(*env)->ThrowNew(env, (*env)->FindClass(env,\
  \ \"java/io/EOFException\"), \n   \"Unexpected end of file\");\n```\n\n`Throw` 和\
  \ `ThrowNew` 只是发布异常；它们不会中断方法的控制流。因此，每次对 `Throw` 和 `ThrowNew` 的调用都应该紧跟一个 `return`\
  \ 语句。\n\n如果你在 C++ 中实现原生方法，你无法在 C++ 代码中抛出 Java 异常。在 C++ 绑定中，可以实现 C++ 与 Java 之间的异常转换；目前尚未这样做。使用\
  \ `Throw` 或 `ThrowNew` 在原生方法中抛出 Java 异常，并确保你的原生方法不抛出 C++ 异常。\n\n\n\n\n\n最后，为了演示如何在从原生方法调用\
  \ Java 方法时检查异常，我们将字符串发送到流中，一次发送一个字符，并在每次调用后执行 `ExceptionOccurred`。列表 13.17 显示了原生方法的代码，而\
  \ 列表 13.18 显示了包含原生方法的类定义。注意，当调用 `PrintWriter.print` 发生异常时，原生方法并不会立即终止——它首先释放 `cstr`\
  \ 缓冲区。当原生方法返回时，虚拟机再次抛出该异常。列表 13.19 中的测试程序演示了当格式化字符串无效时，原生方法是如何抛出异常的。\n\nprintf4/Printf4.c\n\
  \n```c\n/**\n   @version 1.10 1997-07-01\n   @author Cay Horstmann\n*/\n\n#include\
  \ \"Printf4.h\"\n#include <string.h>\n#include <stdlib.h>\n#include <float.h>\n\n\
  /**\n   @param format a string containing a printf format specifier\n   (such as\
  \ \"%8.2f\"). Substrings \"%%\" are skipped.\n   @return a pointer to the format\
  \ specifier (skipping the '%')\n   or NULL if there wasn't a unique format specifier\n\
  \ */\nchar* find_format(const char format[])\n{  \n   char* p;\n   char* q;\n\n\
  \   p = strchr(format, '%');\n   while (p != NULL && *(p + 1) == '%') /* skip %%\
  \ */\n      p = strchr(p + 2, '%');\n   if (p == NULL) return NULL;\n   /* now check\
  \ that % is unique */\n   p++;\n   q = strchr(p, '%');\n   while (q != NULL && *(q\
  \ + 1) == '%') /* skip %% */\n      q = strchr(q + 2, '%');\n   if (q != NULL) return\
  \ NULL; /* % not unique */\n   q = p + strspn(p, \" -0+#\"); /* skip past flags\
  \ */\n   q += strspn(q, \"0123456789\"); /* skip past field width */\n   if (*q\
  \ == '.') { q++; q += strspn(q, \"0123456789\"); }\n      /* skip past precision\
  \ */\n   if (strchr(\"eEfFgG\", *q) == NULL) return NULL;\n      /* not a floating-point\
  \ format */\n   return p;\n}\n\nJNIEXPORT void JNICALL Java_Printf4_fprint(JNIEnv*\
  \ env, jclass cl, \n   jobject out, jstring format, jdouble x)\n{  \n   const char*\
  \ cformat;\n   char* fmt;\n   jclass class_PrintWriter;\n   jmethodID id_print;\n\
  \   char* cstr;\n   int width;\n   int i;\n\n   if (format == NULL)\n   {  \n  \
  \    (*env)->ThrowNew(env,\n         (*env)->FindClass(env,\n         \"java/lang/NullPointerException\"\
  ),\n         \"Printf4.fprint: format is null\");\n      return;\n   }\n\n   cformat\
  \ = (*env)->GetStringUTFChars(env, format, NULL);\n   fmt = find_format(cformat);\n\
  \n   if (fmt == NULL)\n   {  \n      (*env)->ThrowNew(env,\n         (*env)->FindClass(env,\n\
  \         \"java/lang/IllegalArgumentException\"),\n         \"Printf4.fprint: format\
  \ is invalid\");\n      return;\n   }\n\n   width = atoi(fmt);\n   if (width ==\
  \ 0) width = DBL_DIG + 10;\n   cstr = (char*)malloc(strlen(cformat) + width);\n\n\
  \   if (cstr == NULL)\n   {  \n      (*env)->ThrowNew(env,\n         (*env)->FindClass(env,\
  \ \"java/lang/OutOfMemoryError\"),\n         \"Printf4.fprint: malloc failed\");\n\
  \      return;\n   }\n\n   sprintf(cstr, cformat, x);\n\n   (*env)->ReleaseStringUTFChars(env,\
  \ format, cformat);\n\n   /* now call ps.print(str) */\n\n   /* get the class */\n\
  \   class_PrintWriter = (*env)->GetObjectClass(env, out);\n\n   /* get the method\
  \ ID */\n   id_print = (*env)->GetMethodID(env, class_PrintWriter, \"print\", \"\
  (C)V\");\n\n   /* call the method */\n   for (i = 0; cstr[i] != 0 && !(*env)->ExceptionOccurred(env);\
  \ i++)\n      (*env)->CallVoidMethod(env, out, id_print, cstr[i]);\n\n   free(cstr);\n\
  }\n```\n\nprintf4/Printf4.java\n\n```java\nimport java.io.*;\n\n/**\n * @version\
  \ 1.10 1997-07-01\n * @author Cay Horstmann\n */\nclass Printf4\n{\n   public static\
  \ native void fprint(PrintWriter ps, String format, double x);\n\n   static\n  \
  \ {\n      System.loadLibrary(\"Printf4\");\n   }\n}\n```\n\nprintf4/Printf4Test.java\n\
  \n```java\nimport java.io.*;\n\n/**\n * @version 1.10 1997-07-01\n * @author Cay\
  \ Horstmann\n */\nclass Printf4Test\n{\n   public static void main(String[] args)\n\
  \   {\n      // Test code here\n   }\n}\n```\n\n## Handling Exceptions\n\n* `jint\
  \ ThrowNew(JNIEnv* env, jclass cl, String msg)` 准备抛出一个异常。成功时返回 0，否则返回负值。\n* `jthrowable\
  \ ExceptionOccurred(JNIEnv* env)` 如果存在异常则返回对象，否则返回 `NULL`。\n* `jboolean ExceptionCheck(JNIEnv*\
  \ env)` 如果存在异常则返回 `true`。\n* `void ExceptionClear(JNIEnv* env)` 清除任何挂起的异常。\n\n##\
  \ Using Invocation API\n\n到为止，我们考虑的是 Java 语言程序。假设你在 C++ 中想要嵌入虚拟机。这里是初始化机器所需的最小代码：\n\
  \n```c\nJavaVMOption options[1];\nJavaVMInit vm_args;\nJavaVM *jvm;\nJNIEnv *env;\n\
  \noptions[0].optionString = \"-Djava.classpath=.\";\n\nmemset(&vm_args, 0, sizeof(vm_args));\n\
  vm_args.version = JNI_VERSION_1_2;\nvm_args.nOptions = 1;\nvm_args.options = options;\n\
  \nJNI_CreateVM(&jvm, (void**)env, &vm_args);\n```\n\n`JNI_CreateVM` 调用创建虚拟机并填充指向虚拟机\
  \ `jvm` 和执行环境 `env` 的指针。\n\n你可以提供任意数量的选项，只需增加 `options` 数组的大小和 `vm_args.nOptions`\
  \ 的值。例如，\n\n`options[i].optionString = \"-Djava.compiler=NONE\"` 禁用实时编译器。\n\n当你遇到问题、程序崩溃、拒绝初始化或无法加载类时，开启\
  \ JNI 调试模式。设置选项：\n\n`options[i].optionString = \"-verbose:jni\"`\n\n你会看到大量指示初始化进度的消息。如果没有看到类加载，请检查路径设置。\n\
  \n一旦设置虚拟机，就可以像前面的章节那样调用 Java 方法。只需按照通常的方法使用 `env` 指针即可。\n\n你只需要 `jvm` 指针来调用 API\
  \ 中的其他函数。目前只有四个这样的函数。最重要的一个是终止虚拟机的函数：\n\n```c\n(*jvm)->DestroyJavaVM(jvm);\n```\n\
  \n列表 13.20 中的 C 程序设置了虚拟机并调用了 `Welcome` 类的 `main` 方法，该类在卷 I 的第二章 中讨论过。（在启动调用测试程序之前，请确保已编译\
  \ `Welcome.java` 文件。）\n\ninvocation/InvocationTest.c\n\n\n\n\n```c\n/**\n   @version\
  \ 1.20 2007-10-26\n   @author Cay Horstmann\n*/\n\n#include <jni.h>\n#include <stdlib.h>\n\
  \n#ifdef _WINDOWS\n\n#include <windows.h>\nstatic HINSTANCE loadJVMLibrary(void);\n\
  typedef jint (JNICALL *CreateJavaVM_t)(JavaVM **, void **, JavaVMInitArgs *);\n\n\
  #endif\n\nint main()\n{  \n   JavaVMOption options[2];\n   JavaVMInitArgs vm_args;\n\
  \   JavaVM *jvm;\n   JNIEnv *env;\n   long status;\n\n   jclass class_Welcome;\n\
  \   jclass class_String;\n   jobjectArray args;\n   jmethodID id_main;\n\n#ifdef\
  \ _WINDOWS\n   HINSTANCE hjvmlib;\n   CreateJavaVM_t createJavaVM;\n#endif\n\n \
  \  options[0].optionString = \"-Djava.class.path=.\";\n\n   memset(&vm_args, 0,\
  \ sizeof(vm_args));\n   vm_args.version = JNI_VERSION_1_2;\n   vm_args.nOptions\
  \ = 1;\n   vm_args.options = options;\n\n#ifdef _WINDOWS   \n   hjvmlib = loadJVMLibrary();\n\
  \   createJavaVM = (CreateJavaVM_t) GetProcAddress(hjvmlib, \"JNI_CreateJavaVM\"\
  );\n   status = (*createJavaVM)(&jvm, (void **) &env, &vm_args);\n#else\n   status\
  \ = JNI_CreateJavaVM(&jvm, (void **) &env, &vm_args);\n#endif\n\n   if (status ==\
  \ JNI_ERR)\n   {  \n      fprintf(stderr, \"Error creating VM\\n\");\n      return\
  \ 1;\n   }\n\n   class_Welcome = (*env)->FindClass(env, \"Welcome\");\n   id_main\
  \ = (*env)->GetStaticMethodID(env, class_Welcome, \"main\", \"([Ljava/lang/String;)V\"\
  );\n\n   class_String = (*env)->FindClass(env, \"java/lang/String\");\n   args =\
  \ (*env)->NewObjectArray(env, 0, class_String, NULL);\n   (*env)->CallStaticVoidMethod(env,\
  \ class_Welcome, id_main, args);\n\n   (*jvm)->DestroyJavaVM(jvm);\n\n   return\
  \ 0;\n}\n\n#ifdef _WINDOWS\n\nstatic int GetStringFromRegistry(HKEY key, const char\
  \ *name, char *buf, jint bufsize)\n{\n   DWORD type, size;\n\n   return RegQueryValueEx(key,\
  \ name, 0, &type, 0, &size) == 0\n      && type == REG_SZ\n      && size < (unsigned\
  \ int) bufsize\n      && RegQueryValueEx(key, name, 0, 0, buf, &size) == 0;\n}\n\
  \nstatic void GetPublicJREHome(char *buf, jint bufsize)\n{\n   HKEY key, subkey;\n\
  \   char version[MAX_PATH];\n\n   /* Find the current version of the JRE */\n  \
  \ char *JRE_KEY = \"Software\\\\JavaSoft\\\\Java Runtime Environment\";\n   if (RegOpenKeyEx(HKEY_LOCAL_MACHINE,\
  \ JRE_KEY, 0, KEY_READ, &key) != 0) \n   {\n      fprintf(stderr, \"Error opening\
  \ registry key '%s'\\n\", JRE_KEY);\n      exit(1);\n   }\n\n   if (!GetStringFromRegistry(key,\
  \ \"CurrentVersion\", version, sizeof(version))) \n   {\n      fprintf(stderr, \"\
  Failed reading value of registry key:\\n\\t%s\\\\CurrentVersion\\n\", \n       \
  \  JRE_KEY);\n      RegCloseKey(key);\n      exit(1);\n   }\n\n   /* Find directory\
  \ where the current version is installed. */\n   if (RegOpenKeyEx(key, version,\
  \ 0, KEY_READ, &subkey) != 0) \n   {\n     fprintf(stderr, \"Error opening registry\
  \ key '%s\\\\%s'\\n\", JRE_KEY, version);\n      RegCloseKey(key);\n      exit(1);\n\
  \   }\n\n   if (!GetStringFromRegistry(subkey, \"JavaHome\", buf, bufsize)) \n \
  \  {\n      fprintf(stderr, \"Failed reading value of registry key:\\n\\t%s\\\\\
  %s\\\\JavaHome\\n\", \n         JRE_KEY, version);\n      RegCloseKey(key);\n  \
  \    RegCloseKey(subkey);\n      exit(1);\n   }\n\n   RegCloseKey(key);\n   RegCloseKey(subkey);\n\
  }\n\nstatic HINSTANCE loadJVMLibrary(void)\n{\n   HINSTANCE h1, h2;\n   char msvcdll[MAX_PATH];\n\
  \   char javadll[MAX_PATH];\n   GetPublicJREHome(msvcdll, MAX_PATH);   \n   strcpy(javadll,\
  \ msvcdll);\n   strncat(msvcdll, \"\\\\bin\\\\msvcr71.dll\", MAX_PATH - strlen(msvcdll));\n\
  \   msvcdll[MAX_PATH - 1] = '\\0';\n   strncat(javadll, \"\\\\bin\\\\client\\\\\
  jvm.dll\", MAX_PATH - strlen(javadll));\n   javadll[MAX_PATH - 1] = '\\0';\n\n \
  \  h1 = LoadLibrary(msvcdll);\n   if (h1 == NULL)\n   {\n      fprintf(stderr, \"\
  Error loading msvcdll.dll\\n\");\n      exit(1);\n   }\n\n   h2 = LoadLibrary(javadll);\n\
  \   if (h2 == NULL)\n   {\n      fprintf(stderr, \"Error loading jvm.dll\\n\");\n\
  \      exit(1);\n   }\n\n   return h2;\n}\n\n#endif\n```\n\n## 完整示例：访问注册表\n\n在本节中，我描述了一个完整的示例示例，它涵盖了本章讨论的所有内容：带有字符串、数组和错误处理的原生方法。由于注册表依赖\
  \ Windows，此类程序不可移植。\n\n### Windows 注册表概述\n\nWindows 注册表是一个存储操作系统和应用程序配置的数据仓库。它提供了管理和备份的单一节点。缺点是注册表也是单点故障——如果你搞乱注册表，计算机可能会故障甚至无法启动！\n\
  \n我们不建议使用注册表来存储 Java 程序的配置参数。Preferences API 是更好的解决方案。我们仅使用注册表来演示如何将复杂的 API 封装到类中。\n\
  \n检查注册表的主要工具是*注册编辑器*。由于天真的的用户可能会出错，因此没有启动注册编辑器的图标。相反，请启动 DOS 命令行（或打开“运行”对话框）并输入\
  \ `regedit`。\n\n左侧显示键，它们以树形结构排列。注意每个键都以以下 `HKEY` 节点开头：\n\n```\nHKEY_CLASSES_ROOT\n\
  HKEY_CURRENT_USER\nHKEY_LOCAL_MACHINE\n. . .\n```\n\n右侧显示与特定键相关的名称/值对。例如，如果你安装了\
  \ Java 17，键\n\n```\nHKEY_LOCAL_MACHINE\\Software\\JavaSoft\\Java Runtime Environment\n\
  ```\n\n包含如下名称/值对：\n\n```\nCurrentVersion=\"17.0_10\"\n```\n\n在这种情况下，值是一个字符串。值也可以是整数或字节数组。\n\
  \n### 用于访问注册表的 Java 平台接口\n\n我们创建一个简单的接口以便 Java 代码访问注册表，然后用原生代码实现此接口。该接口仅允许少数注册表操作；为了缩小代码体积，我省略了一些重要的操作，如添加、删除和枚举键。（应该很容易添加剩余的注册表\
  \ API 函数。）\n\n\n\n\n\n即使使用我们提供的有限子集，你仍然可以：\n\n* 列出键中存储的所有名称\n* 读取与名称关联存储的值\n* 设置与名称关联存储的值\n\
  \n以下是封装注册表键的 Java 类：\n\n```java\npublic class Win32RegKey\n{\n   public Win32RegKey(int\
  \ theRoot, String thePath) { . . . }\n   public Enumeration names() { . . . }\n\
  \   public native Object getValue(String name);\n   public native void setValue(String\
  \ name, Object value);\n\n   public static final int HKEY_CLASSES_ROOT = 0×80000000;\n\
  \   public static final int HKEY_CURRENT_USER = 0×80000001;\n   public static final\
  \ int HKEY_LOCAL_MACHINE = 0×80000002;\n   . . .\n}\n```\n\n`names` 方法返回一个包含与键关联存储的所有名称的枚举器。你可以使用熟悉的\
  \ `hasMoreElements/nextElement` 方法来获取它们。`getValue` 方法返回一个对象，可以是字符串、`Integer` 对象或字节数组。`setValue`\
  \ 方法的 `value` 参数也必须是这三种类型之一。\n\n### 作为原生方法实现注册表访问函数\n\n我们需要实现三个操作：\n\n* 获取名称的值\n\
  * 设置名称的值\n* 遍历键的名称\n\n在本章中，你基本上已经掌握了所需的所有工具，例如 Java 字符串与数组与 C 语言数组之间的转换。你还了解了在发生错误时如何抛出\
  \ Java 异常。\n\n两个问题使得这些原生方法比之前的示例更复杂。`getValue` 和 `setValue` 方法处理 `Object` 类型，该类型可以是\
  \ `String`、`Integer` 或 `byte[]` 之一。枚举对象存储了在连续调用 `hasMoreElements` 和 `nextElement`\
  \ 之间的状态。\n\n让我们先看看 `getValue` 方法。该方法（显示在 列表 13.22 中）遵循以下步骤：\n\n1. 打开注册表键。为了读取其值，注册表\
  \ API 要求键必须打开状态。\n2. 查询与名称关联的值的类型和大小。\n3. 将数据读入缓冲区。\n4. 如果类型是 `REG_SZ`（字符串），则调用\
  \ `NewStringUTF` 创建一个带有值数据的新字符串。\n5. 如果类型是 `REG_DWORD`（32 位整数），则调用 `Integer` 构造函数。\n\
  6. 如果类型是 `REG_BINARY`，则调用 `NewByteArray` 创建一个新的字节数组，然后调用 `SetByteArrayRegion` 将值数据拷贝到字节数组。\n\
  7. 如果类型不是这些之一，或者在调用 API 函数时发生错误，则抛出异常并释放迄已获取的所有资源。\n8. 关闭键并返回已创建的对象（`String`、`Integer`\
  \ 或 `byte[]`）。\n\n如你所见，这个例子很好地说明了如何生成不同类型的 Java 对象。\n\n在这个原生方法中，处理通用返回类型并不困难。`jstring`、`jobject`\
  \ 或 `jarray` 引用只需作为 `jobject` 返回。然而，`setValue` 方法接收一个 `Object` 引用，必须确定该 `Object`\
  \ 的确切类型，以便将 `Object` 保存为字符串、整数或字节数组。我们可以通过查询 `value` 对象的类、找到 `java.lang.String`、`java.lang.Integer`\
  \ 和 `byte[]` 的类引用，并与 `IsAssignableFrom` 函数进行比较来此此判断。\n\n如果 `class1` 和 `class2` 是两个类引用，那么调用\n\
  \n```\n(*env)->IsAssignableFrom(env, class1, class2)\n```\n\n当 `class1` 和 `class2`\
  \ 是同一个类，或者 `class1` 是 `class2` 的子类时，返回 `JNI_TRUE`。在任何情况下，指向 `class1` 对象的引用都可以强制转换为\
  \ `class2`。例如，当\n\n```\n(*env)->IsAssignableFrom(env, (*env)->GetObjectClass(env,\
  \ value), \n   (*env)->FindClass(env, \"[B\"))\n```\n\n为 `true` 时，我们知道 `value` 是字节数组。\n\
  \n以下是 `setValue` 方法步骤的概述：\n\n1. 以写打开注册表键。\n2. 找到要写入值的类型。\n3. 如果类型是 `String`，调用 `GetStringUTFChars`\
  \ 获取字符指针。\n4. 如果类型是 `Integer`，调用 `intValue` 方法获取包装对象中存储的整数。\n5. 如果类型是 `byte[]`，调用\
  \ `GetByteArrayElements` 获取字节指针。\n6. 将数据和长度传递给注册表。\n7. 关闭键。\n8. 如果类型是 `String` 或\
  \ `byte[]`，释放指向数据的指针。\n\n最后，让我们转向枚举键的原生方法。这些方法是 `Win32RegKeyNameEnumeration` 类的方法（参见\
  \ 列表 13.21）。当枚举过程开始时，我们必须打开键。在枚举期间，我们必须保留键句柄——即句柄是 `DWORD`（32 位整数），因此它可以存储在 `index`\
  \ 中。当枚举开始时，`index` 设置为 `-1`。让我们遍历支持枚举的原生方法。`hasMoreElements` 方法很简单：\n\n1. 获取 `index`\
  \ 和 `count` 字段。\n2. 如果 `index` 为 `-1`，调用 `startEnumeration`，它打开键、查询计数和长度并初始化 `hkey`、`count`\
  \ 和 `maxsize` 字段。\n3. 如果 `index` 小于 `count`，返回 `JNI_TRUE`；否则返回 `JNI_FALSE`。\n\n\
  `nextElement` 方法需要多做努力：\n\n1. 获取 `index` 和 `count` 字段。\n2. 如果 `index` 为 `-1`，调用\
  \ `startEnumeration`，它打开键、查询计数和长度并初始化 `hkey`、`count` 和 `maxsize` 字段。\n3. 如果 `index`\
  \ 等于 `count`，抛出 `NoSuchElementException`。\n4. 从注册表读取下一个名称。\n5. 增加 `index`。\n6. 如果\
  \ `index` 等于 `count`，关闭键。\n\n在编译之前，记得对 `Win32RegKey` 和 `Win32RegKeyNameEnumeration`\
  \ 运行 `javac -h`。微软编译器的完整命令行为：\n\n```\ncl -I jdk\\include -I jdk\\include\\win32\
  \ -LD Win32RegKey.c advapi32.lib -FeWin32RegKey.dll\n```\n\n使用 Cygwin：\n\n```\n\
  gcc -mno-cygwin -D __int64=\"long long\" -I jdk\\include -I jdk\\include\\win32\
  \ \\\n   -I c:\\cygwin\\usr\\include\\w32api -shared -Wl,--add-stdcall-alias -o\
  \ Win32RegKey.dll\nWin32RegKey.c\n```\n\n由于注册表 API 特定 Windows，此程序无法在其他操作系统运行。列表\
  \ 13.23 显示了一个测试新注册表函数的程序。我们向 `HKEY_CURRENT_USER\\Software\\JavaSoft\\Java Runtime\
  \ Environment` 键添加三个名称/值对、一个字符串、一个整数和一个字节数组。然后我们枚举该键的所有名称并检索它们的值。程序将打印：\n\n```\n\
  Default user=Harry Hacker\nLucky number=13\nSmall primes=2 3 5 7 11 13\n```\n\n\
  虽然向该键添加这些名称/值对可能没有害，但在运行此程序后，你可能想使用注册表编辑器删除它们。\n\nwin32reg/Win32RegKey.java\n\n\n\
  \n\n\n```java\nimport java.util.*;\n\n/**\n * Win32RegKey 对象可用于获取和设置 Windows 注册表中注册表键项的值。\n\
  \ * @version 1.00 1997-07-01\n * @author Cay Horstmann\n */\npublic class Win32RegKey\n\
  {\n   public static final int HKEY_CLASSES_ROOT = 0x80000000;\n   public static\
  \ final int HKEY_CURRENT_USER = 0x80000001;\n   public static final int HKEY_LOCAL_MACHINE\
