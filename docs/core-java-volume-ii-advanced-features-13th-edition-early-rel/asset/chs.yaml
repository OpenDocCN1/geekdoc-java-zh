  \ p);\n\n   public String toString()\n   {\n      return getClass().getName();\n\
  \   }\n/**\n * 创建连接两个点的线。\n */\nclass LineMaker extends ShapeMaker\n{\n   public\
  \ LineMaker()\n   {\n      super(2);\n   }\n\n   public Shape makeShape(Point2D[]\
