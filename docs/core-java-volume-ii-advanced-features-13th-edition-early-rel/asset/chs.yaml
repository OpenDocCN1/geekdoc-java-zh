  \ 978-0-13-53714-9\n\nISBN-10: 0-13-53714-0\n\n# 目录\n\n# 前言\n\n## 致读者\n\n你手中的这本书是《核心\
  \ Java》第十三版的第二卷，已针对 Java 21 进行完全更新。第一卷涵盖了语言的基础特性；本卷涉及专业开发所需的高级主题。与第一卷及之前的版本一样，我们的目标仍然是希望将\
  \ Java 技术应用于实际项目的程序员。\n\n随着 Java 类库的爆炸式增长，要在单书中涵盖专业程序员需要的所有特性是不可能的。因此，本书被分为两卷。\n\
  \n第一卷专注于 Java 语言的核心概念：\n\n* 对象面向编程\n* 反射与代理\n* 接口与内部类\n* 异常处理\n* 泛型编程\n* 集合框架\n\
  * 并发\n* 注解\n* Java 模块系统\n\n第二卷深入探讨了最重要的库。在过去的十二年中，用户界面编程被认为是基础，但现在必须承认它不再如此，并将其移动到第二卷。本书详细讨论了以下主题：\n\
  \n* Stream API\n* 文件处理与正则表达式\n* 数据库\n* XML 处理\n* 脚本与编译 API\n* 国际化\n* 网络编程\n* 图形用户界面设计\n\
  * 图形编程\n* 原生方法\n\n任何书籍一样，错误和不准确不可避免的。如果你在书中发现任何问题，我们非常希望听到它们。当然，我们希望只听到一次。为此，我们在\
  \ `https://horstmann.com/corejava` 建立了一个网站，提供了常见问题解答（FAQ）、错误修复和解决方法。在错误报告网页的末尾（以鼓励你阅读之前的报告）放置了一个表单，可以使用它报告错误或问题，并对未来的版本提出改进建议。\n\
  \n## 本书简介\n\n书中章节大部分情况下是相互独立的。你可以深入研究你最感兴趣的主题，并按照任何顺序阅读章节。\n\n\n\n\n\n在 `Chapter\
  \ 1` 中，你将学习关于 Java 流库的全部知识。该库为数据处理带来了现代化的风格，只需指定你想要的结果而无需详细描述如何获取结果。这使得流库能够专注于最优评估策略，这对于在多核心上并行执行计算特别有优势。\n\
  \n`Chapter 2` 的主题是输入和输出处理（I/O）。在 Java 中，所有的输入和输出都通过输入/输出流来处理。这些流（不要与 `Chapter 1`\
  \ 中的流混淆）允许你以统一的方式处理各种数据源之间的通信，例如文件、网络连接或内存块。我们详细介绍了读取器（reader）和写入器（writer）类，它们让你轻松处理\
  \ Unicode。我们将向你展示当使用对象序列化机制时底层发生了什么，这种机制使得保存和加载对象变得简单方便。然后，我们将进入正则表达式以及文件和路径的操作。在本章中，你会在最近的\
  \ Java 版本中发现欢迎的增强。\n\n`Chapter 3` 涵盖了 XML。我们将向你如何解析 XML 文件、如何生成 XML 以及如何使用 XSL 转换。作为一个实用的示例，我们展示了如何在\
  \ XML 中指定 Swing 表单的布局。我们还讨论了 XPath API，它让在 XML 海洋中捞针变得容易得多。\n\n`Chapter 4` 涵盖了网络\
  \ API。Java 让进行复杂的网络编程变得异常简单。我们将向你展示如何建立到服务器的网络连接、如何实现自己的服务器以及如何建立 HTTP 连接。本章包含了对新的\
  \ HTTP 客户端的介绍。\n\n`Chapter 5` 涵盖了数据库编程。重点是 `JDBC`，即 Java 数据库连接 API，它允许 Java 程序连接到关系型数据库。我们将向你如何使用\
  \ JDBC API 的核心子集编写实用的程序来处理现实的数据库任务。（完整介绍 JDBC API 需要一本几乎和这本书一样大的书。）\n\nJava 在处理日期和时间的库方面有过两次之前的尝试。第三次尝试是\
  \ Java 8 中的神笔。在 `Chapter 6` 中，你将学习如何使用新的日期和时间库来处理日历和时区的复杂性。\n\n`Chapter 7` 讨论了一个我们认为重要性只会不断增加的特性：国际化。Java\
  \ 编程语言是少数从设计初就为了处理 Unicode 的语言之一，但 Java 平台上的国际化支持要远得多。因此，你可以将 Java 应用程序国际化，使其不仅跨越平台，还能跨越国界。例如，我们将展示你如何编写一个可以使用英语、德语或中文的退休计算器。\n\
  \n`Chapter 8` 讨论了脚本和编译器 API，这些 API 允许你的程序调用 JavaScript 或 Groovy 等脚本语言中的代码，并编译 Java\
  \ 代码。\n\n`Chapter 9` 探讨了 Java 安全模型、用户身份验证以及 Java 安全库中的加密函数。你将学习一些重要特性，如消息和代码签名、授权与认证以及加密。我们将使用\
  \ AES 和 RSA 加密算法的示例作为结束。\n\n`Chapter 10` 提供了 GUI 编程的介绍。我将向你展示如何创建窗口、如何在窗口上绘图、如何用几何形状绘图、如何用多种字体格式化文本以及如何显示图像。接下来，你将看到如何编写响应事件（如鼠标点击或按键按下）的代码。\n\
  \n`Chapter 11` 详细讨论了 Swing GUI 工具包。Swing 工具包允许你构建跨平台的图形用户界面。你将学习各种类型的按钮、文本组件、边框、滑块、列表框、菜单和对话框。\n\
  \n`Chapter 12` 包含了高级 Swing 材质，特别是重要但复杂的树和表格组件。我们还涵盖了 Java 2D API，你可以用它来创建真实的图形和特殊效果。当然，现在没有多少程序员需要编写\
  \ Swing 用户界面了，因此我们特别关注对于可在服务器上生成的图像所需的特性。\n\n`Chapter 13` 探讨了原生方法（native methods），它允许你调用为特定机器编写的方法，例如\
  \ Microsoft Windows API。显然，这一特性具有争议性：一旦使用原生方法，Java 的跨平台特性就会消失。尽管如此，每个为特定平台编写 Java\
  \ 应用程序的严肃程序员都需要了解这些技术。当你与 Java 不支持的设备或服务交互时，有时你需要转向目标操作系统的 API。我们将通过向你展示如何从 Java\
  \ 程序访问 Windows 注册表 API 来说明这一点。本章以对“Panama” API 的展望结束，该 API 将在未来的 Java 版本中取代当前的 API。\n\
  \n一如既往，所有章节都已针对最新的 Java 版本进行了完全修订。过时的材料已被删除，并详细介绍了了直到 Java 21 的新 API。\n\n## 约定\n\
