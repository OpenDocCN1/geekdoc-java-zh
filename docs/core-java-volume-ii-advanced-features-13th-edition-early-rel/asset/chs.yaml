  /**\n * 创建位于两个角边界框内的椭圆。\n */\nclass EllipseMaker extends ShapeMaker\n{\n   public\
  \ EllipseMaker()\n   {\n      super(2);\n   }\n\n   public Shape makeShape(Point2D[]\
  \ p)\n   {\n      var s = new Ellipse2D.Double();\n      s.setFrameDiagonal(p[0],\
  \ p[1]);\n      return s;\n   }\n}\n/**\n * 创建位于两个角边界框内的弧，由边界框中心发出的\n * 角度结束。为了显示角度计算的正确性，返回的形状\n\
  \ * 包含了弧、边界框和线。\n */\nclass ArcMaker extends ShapeMaker\n{\n   public ArcMaker()\n\
  \   {\n      super(4);\n   }\n\n   public Shape makeShape(Point2D[] p)\n   {\n \
  \     double centerX = (p[0].getX() + p[1].getX()) / 2;\n      double centerY =\
  \ (p[0].getY() + p[1].getY()) / 2;\n      double width = Math.abs(p[1].getX() -\
  \ p[0].getX());\n      double height = Math.abs(p[1].getY() - p[0].getY());\n\n\
  \      double skewedStartAngle = Math.toDegrees(Math.atan2(-(p[2].getY() - centerY)\
  \ * width,\n         (p[2].getX() - centerX) * height));\n      double skewedEndAngle\
  \ = Math.toDegrees(Math.atan2(-(p[3].getY() - centerY) * width,\n         (p[3].getX()\
  \ - centerX) * height));\n      double skewedAngleDifference = skewedEndAngle -\
  \ skewedStartAngle;\n      if (skewedStartAngle < 0) skewedStartAngle += 360;\n\
  \      if (skewedAngleDifference < 0) skewedAngleDifference += 360;\n\n      var\
  \ s = new Arc2D.Double(0, 0, 0, 0,\n         skewedStartAngle, skewedAngleDifference,\
  \ Arc2D.OPEN);\n      s.setFrameDiagonal(p[0], p[1]);\n\n      var g = new GeneralPath();\n\
  \      g.append(s, false);\n      var r = new Rectangle2D.Double();\n      r.setFrameDiagonal(p[0],\
  \ p[1]);\n      g.append(r, false);\n      var center = new Point2D.Double(centerX,\
  \ centerY);\n      g.append(new Line2D.Double(center, p[2]), false);\n      g.append(new\
  \ Line2D.Double(center, p[3]), false);\n      return g;\n   }\n}\n\n/**\n * 由六个点定义的多边形。\n\
  \ */\nclass PolygonMaker extends ShapeMaker\n{\n   public PolygonMaker()\n   {\n\
  \      super(6);\n   }\n\n   public Shape makeShape(Point2D[] p)\n   {\n      var\
