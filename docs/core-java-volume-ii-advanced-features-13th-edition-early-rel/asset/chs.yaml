  \  Map<Integer, Person> idToPerson = people().collect(\n         Collectors.toMap(Person::id,\
  \ Function.identity()));\n      System.out.println(\"idToPerson: \" + idToPerson.getClass().getName()\n\
  \         + idToPerson);\n\n      idToPerson = people().collect(\n         Collectors.toMap(Person::id,\
  \ Function.identity(), \n            (existingValue, newValue) -> { throw new IllegalStateException();\
  \ }, \n            TreeMap::new));\n      System.out.println(\"idToPerson: \" +\
  \ idToPerson.getClass().getName()\n         + idToPerson);\n\n      Map<String,\
  \ String> languageNames = Locale.availableLocales().collect(\n         Collectors.toMap(\n\
  \            Locale::getDisplayLanguage, \n            l -> l.getDisplayLanguage(l),\
  \ \n            (existingValue, newValue) -> existingValue));\n      System.out.println(\"\
  languageNames: \" + languageNames);\n\n      Map<String, Set<String>> countryLanguageSets\
  \ = Locale.availableLocales().collect(\n         Collectors.toMap(\n           \
  \ Locale::getDisplayCountry,\n            l -> Set.of(l.getDisplayLanguage()),\n\
  \            (a, b) -> \n            { // union of a and b\n               Set<String>\
