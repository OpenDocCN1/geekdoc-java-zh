  \n## 并行流\n\n流使得批量操作并行化变得简单。过程大部分是自动的，但你需要遵循一些规则。首先，你必须有一个并行流。你可以通过 `Collection.parallelStream()`\
  \ 方法从任何集合获取并行流：\n\n```\nStream<String> parallelWords = words.parallelStream();\n\
  ```\n\n此外，`parallel` 方法可以将任何顺序流转换为并行流。\n\n```\nStream<String> parallelWords = Stream.of(wordArray).parallel();\n\
  ```\n\n只要在终端方法执行时流处于并行模式，所有的中间流操作都将是并行化的。\n\n当流操作以并行方式运行时，其意图是返回与串行执行时相同的的结果。确保操作是*无状态的*并且可以按任意顺序执行，这一点非常重要。\n\
  \n这里有一个你不能做的示例。假设你想统计流中所有的短词：\n\n```\nvar shortWords = new int[12];\nwords.parallelStream().forEach(s\
  \ -> { if (s.length() < 12) shortWords[s.length()]++; });\n       错误：竞态条件！\nSystem.out.println(Arrays.toString(shortWords));\n\
  ```\n\n这非常糟糕。如果你多次运行此程序，可能会得到不同的结果——每次运行都如此。正如你在第 10 章 中所看到的，那是*竞态条件*。确保你传递给并行操作的任何函数都可以并行执行是你的责任。为了从并行化中受益，请使用共享的并发\
  \ Map。\n\n\n\n\n```java\nMap<Integer, Long> wordCounts \n   = words.parallelStream()\n\
  \      .collect(\n         groupingByConcurrent(\n            String::length,\n\
  \            counting()));\n```\n\n不要为了加速操作而将所有的流都转换为并行流（parallel streams）。请记住以下问题：\n\
  \n- 并行化具有巨大的开销，这只有在处理非常大的数据集时才会有所收益。\n- 只有当底层数据源可以被有效拆分成多个部分时，并行化流才有意义的。\n- 并行流所使用的线程池可能会因为文件\
  \ I/O 或网络访问等阻塞操作而导致线程饥饿（starvation）。\n\n并行流在处理巨大的内存中数据集合和进行计算密集型处理时，效果最好。\n\n如果你处理一个大文件的每一行，并行化流可能会提高性能。`Files.lines`\
  \ 方法使用内存映射文件来使拆分变得高效。（如果你简单地一次只读取一行，那么你就必须在读取后半部分之前读取文件的前半部分，这样并行化将无法生效。）\n\n如果你在并行流中需要随机数，请从\
  \ `RandomGenerator.SplittableGenerator.of` 工厂方法获取生成器。\n\n默认情况下，并行流使用由 `ForkJoinPool.commonPool`\
  \ 返回的全局 fork-join 池。如果你的操作是非阻塞的，且没有与其他任务共享该池，则没有问题。替换不同的 fork-join 池有一个技巧：在来自该池的线程中执行并行流操作：\n\
  \n```java\nForkJoinPool customPool = . . .;\nresult = customPool.submit(() ->\n\
  \   stream.parallel().map(. . .).collect(. . .)).get();\n```\n\n或者，异步地：\n\n```java\n\
  CompletableFuture.supplyAsync(() -> stream.parallel().map(. . .).collect(. . .),\
  \ customPool)\n   .thenAccept(result -> . . .);\n```\n\n这仅适用于 fork-join 池，不适用于任意的执行器（executors）。\n\
  \n列表 1.8 中的示例程序演示了如何使用并行流。\n\n`parallel/ParallelStreams.java`\n\n```java\npackage\
  \ parallel;\n\nimport static java.util.stream.Collectors.*;\n\nimport java.io.*;\n\
  import java.nio.file.*;\nimport java.util.*;\nimport java.util.stream.*;\n\n/**\n\
  \ * @version 1.02 2019-08-28\n * @author Cay Horstmann\n */\npublic class ParallelStreams\n\
  {\n   public static void main(String[] args) throws IOException\n   {\n      String\
  \ contents = Files.readString(Path.of(\"../gutenberg/alice30.txt\"));\n      List<String>\
  \ wordList = List.of(contents.split(\"\\\\PL+\"));\n\n      // 下面是极其糟糕的代码\n    \
  \  var shortWords = new int[10];\n      wordList.parallelStream().forEach(s -> \n\
  \         {\n            if (s.length() < 10) shortWords[s.length()]++;\n      \
  \   });\n      System.out.println(Arrays.toString(shortWords));\n\n      // 再次尝试——结果可能不同（而且也是的）\n\
  \      Arrays.fill(shortWords, 0);\n      wordList.parallelStream().forEach(s ->\
  \ \n         {\n            if (s.length() < 10) shortWords[s.length()]++;\n   \
  \      });\n      System.out.println(Arrays.toString(shortWords));\n\n      // 补救：分组并计数\n\
  \      Map<Integer, Long> shortWordCounts = wordList.parallelStream()\n        \
  \ .filter(s -> s.length() < 10)\n         .collect(groupingBy(String::length, counting()));\n\
  \n      System.out.println(shortWordCounts);\n\n      // 下游顺序不是确定的\n      Map<Integer,\
  \ List<String>> result = wordList.parallelStream().collect(\n         Collectors.groupingByConcurrent(String::length));\n\
  \n      System.out.println(result.get(14));\n\n      result = wordList.parallelStream().collect(\n\
  \         Collectors.groupingByConcurrent(String::length));\n\n      System.out.println(result.get(14));\n\
  \n      Map<Integer, Long> wordCounts = wordList.parallelStream().collect(\n   \
  \      groupingByConcurrent(String::length, counting()));\n\n      System.out.println(wordCounts);\n\
  \   }\n}\n```\n\n`java.util.stream.BaseStream<T,S extends BaseStream<T,S>>` 8\n\n\
  - `S parallel()`：产生一个与此流具有相同元素的并行流。\n- `S unordered()`：产生一个与此流具有相同元素的无序流。\n\n`java.util.Collection<E>`\
  \ 1\n\n- `Stream<E> parallel()` 8：产生一个与此集合具有相同元素的并行流。\n\n在本章中，我们学习了如何使用流。\n\n下一章将讨论如何读取数据的方式。在本章中，我们将介绍用于输入输出的\
  \ Java 应用程序接口（APIs）。\n\n# 输入输出\n\n在本章中，我们将介绍用于输入输出的 API。\n\n## 输入输出流（Streams）\n\n\
  在 Java API 中，从可以读取字节序列的对象被称为*输入流*（input stream*）。向可以写入字节序列的对象被称为*输出流*（output stream*）。抽象类\
  \ `InputStream` 和 `OutputStream` 是输入输出（I/O）类的基础。这些字节序列的源和目的地通常是文件，也可以是网络连接。为了清晰起见，当我们讨论用于输入输出的流时。\n\
  \n### 读取和字节\n\n`InputStream` 类有一个抽象方法：\n\n```java\nabstract int read()\n```\n\n\
  该方法读取一个字节并返回读取到的字节，如果遇到输入结束，则返回 -1。具体输入类的设计者会重写此方法以提供有用的功能。例如，在 `FileInputStream`\
  \ 类中，此方法从文件中读取一个字节。`System.in` 是一个定义的 `InputStream` 子类对象，允许你从“标准输入”（即控制台或重定向的文件）读取信息。\n\
  \n`InputStream` 有一个非常有用的方法可以读取流的所有字节：\n\n```java\nbyte[] bytes = in.readAllBytes();\n\
  ```\n\n还有读取指定数量字节的方法——参见 API 说明。这些方法调用抽象的 `read` 方法，因此子类只需要重写一个方法。\n\n同样，`OutputStream`\
  \ 类定义了抽象方法：\n\n```java\nabstract void write(int b)\n```\n\n它将一个字节写入输出位置。如果你有一个字节数组，可以一次性写入所有字节：\n\
  \n```java\nbyte[] values = . . .;\nout.write(values);\n```\n\n`transferTo` 方法将输入流中的所有字节传输到输出流：\n\
  \n```java\nin.transferTo(out);\n```\n\n`read` 和 `write` 方法都会*阻塞*，直到字节被实际读取或写入。这意味着如果输入流无法立即访问（通常是因为繁忙的网络连接），当前线程就会阻塞。这使得其他线程在等待输入流再次变得可用时有机会做有用的工作。\n\
  \n`available` 方法让你可以检查当前可读取的字节数。这意味着像下面的代码片段不太可能会阻塞：\n\n\n\n\n\n```\nint bytesAvailable\
  \ = in.available();\nif (bytesAvailable > 0)\n{\n   var data = new byte[bytesAvailable];\n\
  \   in.read(data);\n}\n```\n\n当你完成对输入/输出流的读取或写入后，通过调用 `close` 方法将其关闭。此调用会释放供应有限的操作系统资源。如果应用程序打开了太多的输入/输出流而不关闭它们，系统资源可能会耗尽。关闭输出流还会\
  \ `flushes`（刷新）用于输出流的缓冲区：任何临时存放在缓冲区中以便作为较大的数据包传输的字节都将被发送出去。特别是，如果你不关闭文件，最后一个字节数据包可能永远无法被传输。你也可以使用\
  \ `flush` 方法手动刷新输出内容。\n\n即使输入/输出流类提供了处理原始 `read` 和 `write` 函数的具体实现方法，应用程序程序员也很少使用它们。你感兴趣的数据可能包含数字、字符串和对象，而不是原始字节。\n\
  \n与其处理字节，不如你可以使用许多构建在基础的 `InputStream` 和 `OutputStream` 类之上的输入/输出类之一。\n\n### `java.io.InputStream`\
  \ 1.0\n\n*   `abstract int read()`\n    读取一个字节的数据并返回读取的字节；在输入流末尾返回 `-1`。\n*   `int\
  \ read(byte[] b)`\n    读取到字节数组中，并返回实际读取的字节数，或在输入流末尾返回 `-1`；此方法最多读取 `b.length` 个字节。\n\
  *   `int read(byte[] b, int off, int len)`\n*   `int readNBytes(byte[] b, int off,\
  \ int len)` 9\n    读取最多 `len` 个字节，如果在可用且不阻塞的情况下读取（使用 `read`），或者阻塞直到所有值都被读取完毕（使用\
  \ `readNBytes`）。值被置于 `b` 中，从 `off` 开始。返回实际读取的字节数。\n*   `byte[] readAllBytes()` 9\n\
  \    产生从此流可以读取的所有字节的数组。\n*   `long transferTo(OutputStream out)` 9\n    将所有字节从此输入流传输到给定的输出流，返回传输的字节数。两个流都不会关闭。\n\
  *   `long skip(long n)`\n    尝试跳过输入流中的 `n` 个字节，返回实际跳过的字节数（由于某种原因，可能少于 `n`）。\n* \
  \  `long skipNBytes(long n)` 12\n    跳过输入流中的 `n` 个字节，返回实际跳过的字节数（如果遇到了输入流的末尾，则可能少于\
  \ `n`）。\n*   `int available()`\n    返回可用的字节数，且不阻塞（记住，阻塞意味着当前线程失去了机会）。\n*   `void\
  \ close()`\n    关闭输入流。\n*   `void mark(int readlimit)`\n    在输入流的当前位置放置一个标记（并非所有流都支持此功能）。如果从输入流中读取了超过\
  \ `readlimit` 的字节，则允许流遗忘该标记。\n*   `void reset()`\n    返回到上一个标记处。。随后的 `read` 调用将重新读取这些字节。如果没有当前标记，则输入流不被重位。\n\
  *   `boolean markSupported()`\n    如果输入流支持标记，则返回 `true`。\n*   `static InputStream\
  \ nullInputStream()` 11\n    返回一个没有任何字节的输入流。\n\n### `java.io.OutputStream` 1.0\n\
  \n*   `abstract void write(int n)`\n    写入一个字节的数据。\n*   `void write(byte[] b)`\n\
  *   `void write(byte[] b, int off, int len)`\n    写入数组 `b` 中的所有字节，或从 `off` 开始的 `len`\
  \ 个字节。\n*   `void close()`\n    刷新并关闭输出流。\n*   `void flush()`\n    刷新输出流——即，将任何缓冲数据发送到其目标地。\n\
  *   `static OutputStream nullOutputStream()` 11\n    返回一个丢弃所有字节的输出流。\n\n### 完整的流动物园\
  \ (Complete Stream Zoo)\n\n与 C 语言不同，C 只需要一个 `FILE*` 类型就能良好运行，而 Java 有一整套超过 60 (!)\
  \ 个用于输入输出类和接口。\n\n![Figure](img/fig01-01.jpg)输入和输出流层级![Figure](img/fig01-02.jpg)读取和写入器层级\n\
  \n让我们根据使用方法对输入/输出动物园中的动物进行分类。处理字节和字符的类有独立的层级结构。正如你所看到的，`InputStream` 和 `OutputStream`\
  \ 类允许你读写单个字节和字节数组。这些类构成了 [#ch01fig01] 所示层级的基础。要读写字符串和数字，你需要更有能力的子类。例如，`DataInputStream`\
  \ 和 `DataOutputStream` 允许你以二进制格式读写所有的 Java 原始类型。最后，还有用于特殊任务的输入/输出流；例如 `ZipInputStream`\
  \ 和 `ZipOutputStream` 允许你以熟悉的 ZIP 压缩格式读写文件。\n\n对于 Unicode 文本，可以使用抽象类 `Reader` 和\
  \ `Writer` 的子类（参见 [#ch01fig02]）。`Reader` 和 `Writer` 类的基本方法与 `InputStream` 和 `OutputStream`\
  \ 相似。\n\n```\nabstract int read()\nabstract void write(int c)\n```\n\n`read` 方法返回一个\
  \ UTF-16 码单元（0 到 65535 之间的整数）或在到达文件末尾时返回 `-1`。`write` 方法调用时带有一个 Unicode 码单元。\n\n\
  还有四个额外的接口：`Closeable`、`Flushable`、`Readable` 和 `Appendable`（参见 [#ch1fig03]）。前两个接口非常简单，分别为\n\
  \n```\nvoid close() throws IOException\n```\n\n和\n\n```\nvoid flush()\n```\n\n`InputStream`、`OutputStream`、`Reader`\
  \ 和 `Writer` 都实现了 `Closeable` 接口。\n\n`java.io.Closeable` 接口扩展了 `java.lang.AutoCloseable`\
  \ 接口。因此，你可以对任何 `Closeable` 使用 `try`-with-resources 语句。`Closeable` 的 `close` 方法抛出\
  \ `IOException`，而 `AutoCloseable.close` 可能抛出任何异常。\n\n`OutputStream` 和 `Writer` 实现了\
  \ `Flushable` 接口。\n\n![Figure](img/fig01-03.jpg)Closeable, Flushable, Readable 和\
  \ Appendable 接口\n\n`Readable` 接口有一个方法：\n\n```\nint read(CharBuffer cb)\n```\n\n\
  `CharBuffer` 类具有顺序和随机读写访问。它表示内存缓冲区或内存映射文件（参见第 2.5.2 节）。\n\n`Appendable` 接口有两个用于追加字符和字符序列的方法：\n\
  \n```\nAppendable append(char c)\nAppendable append(CharSequence s)\n```\n\n`CharSequence`\
  \ 接口描述了 `char` 值序列的基本属性。它由 `String`、`CharBuffer`、`StringBuilder` 和 `StringBuffer`\
  \ 实现。\n\n在输入输出类中，只有 `Writer` 实现了 `Appendable`。\n\n### `java.io.Closeable` 5.0\n\n\
  *   `void close()`\n    关闭此 `Closeable`。此方法可能会抛出 `IOException`。\n\n### `java.io.Flushable`\
  \ 5.0\n\n*   `void flush()`\n    刷新此 `Flushable`。\n\n### `java.lang.Readable` 5.0\n\
  \n*   `int read(CharBuffer cb)`\n    尝试将尽可能多的 `char` 值读取到 `cb` 中。返回读取的值个数，如果从此 `Readable`\
  \ 不再有可用值，则返回 `-1`。\n\n### `java.lang.Appendable` 5.0\n\n*   `Appendable append(char\
  \ c)`\n*   `Appendable append(CharSequence cs)`\n    将给定的码单元或给定序列中的所有码单元追加到此 `Appendable`；返回\
  \ `this`。\n\n### `java.lang.CharSequence` 1.4\n\n*   `char charAt(int index)`\n\
  \    返回指定索引处的码单元。\n*   `int length()`\n    返回序列中码单元的个数。\n*   `CharSequence subSequence(int\
  \ startIndex, int endIndex)`\n\n\n\n\n返回一个由从 `startIndex` 到 `endIndex - 1` 存储的代码单元组成的\
  \ `CharSequence`。\n\n*   `String toString()`\n\n返回一个由该序列的单元单元组成的字符串。\n\n## 组合输入/输出流过滤器\n\
  \n`FileInputStream` 和 `FileOutputStream` 为你提供了与磁盘文件关联的输入流和输出流。你需要向构造函数传递文件的文件名或完整路径名。例如：\n\
  \n```\nvar fin = new FileInputStream(\"employee.dat\");\n```\n\n这会寻找一个名为 `employee.dat`\
  \ 的文件。\n\n相对路径从 `working directory`（工作目录）开始。你可以通过调用 `System.getProperty(\"user.dir\"\
  )` 获取此目录。它在虚拟机启动时设置，此之后无法更改。如果你从命令行启动程序，工作目录即为终端中的当前目录。在 IDE 中，你可以在运行配置中设置工作目录。\n\
  \n由于反斜杠 `\\` 是 Java 字符串中的转义字符，因此对于 Windows 风格的路径名，请务必使用 `\\\\`（例如 `C:\\\\Windows\\\
  \\win.ini`）。在 Windows 中，你也可以使用单个正斜杠（`C:/Windows/win.ini`），因为大多数 Windows 文件处理系统调用会将正斜杠解释为文件分隔符。然而，并不建议这样做——Windows\
  \ 系统函数的行为可能会发生变化。相反，对于可移植程序，请使用运行程序所所在平台的文件分隔符字符。它可以通过常量字符串 `java.io.File.separator`\
  \ 来获取。\n\n与抽象的 `InputStream` 和 `OutputStream` 类一样，这些类仅支持在字节级进行读写。也就是说，我们只能从对象 `fin`\
  \ 中读取字节和字节数组。\n\n```\nbyte b = (byte) fin.read();\n```\n\n正如你将在下一节中看到的，如果我们仅有一个\
  \ `DataInputStream`，我们就可以读取数值类型了：\n\n```\nDataInputStream din = . . .;\ndouble x\
  \ = din.readDouble();\n```\n\n但正如 `FileInputStream` 没有读取数值类型的方法一样，`DataInputStream`\
  \ 也没有从文件获取数据的方法。\n\nJava 使用了一种巧妙的机制来分离两种职责。某些输入流（如 `FileInputStream` 和由 `URL` 类的\
  \ `openStream` 方法返回的输入流）可以从文件和其他更奇特的位置检索字节。而其他输入流（如 `DataInputStream`）可以将字节组合成更有用的数据类型。Java\
  \ 程序员必须将两者结合。例如，为了能够从文件中读取数字，首先创建一个 `FileInputStream`，然后将其传递给 `DataInputStream`\
  \ 的构造函数。\n\n```\nvar fin = new FileInputStream(\"employee.dat\");\nvar din = new\
  \ DataInputStream(fin);\ndouble x = din.readDouble();\n```\n\n如果你再次查看 #ch01fig01，你可以看到\
  \ `FilterInputStream` 和 `FilterOutputStream` 类。这些类的子类被用于为处理字节的输入/输出流添加功能。\n\n你可以通过嵌套过滤器来添加多个功能。例如，默认情况下，输入流是不带缓冲的。也就是说，每次调用\
  \ `read` 都会请求操作系统分发另一个字节。请求数据块并将其存储在缓冲区中会更高效。如果你对文件需要缓冲和数据输入方法，请使用下面这个看起来相当“怪兽”的构造函数序列：\n\
  \n```\nvar din = new DataInputStream(\n   new BufferedInputStream(\n      new FileInputStream(\"\
  employee.dat\")));\n```\n\n注意，我们将 `DataInputStream` 放在构造函数链的最后，因为我们想使用 `DataInputStream`\
  \ 的方法，并且我们希望它们使用带缓冲的 `read` 方法。\n\n有时当你将这些流链在一起时，需要跟踪中间的输入流。例如，在读取输入时，你通常需要预读下一个字节，以查看它是否是你预期的值。Java\
  \ 提供了 `PushbackInputStream` 用于此目的。\n\n```\nvar pbin = new PushbackInputStream(\n\
  \   new BufferedInputStream(\n      new FileInputStream(\"employee.dat\")));\n```\n\
  \n现在你可以推测性地读取下一个字节\n\n```\nint b = pbin.read();\n```\n\n并且如果它不是你想要的，就将其推回。\n\n```\n\
  if (b != '<') pbin.unread(b);\n```\n\n`unread` 方法实际上并没有改变流读取字节的源。未退回的字节存储在缓冲区中，并由下一次\
  \ `read` 操作返回。默认情况下，缓冲区长度为 1，但你可以在 `PushbackInputStream` 构造函数中指定更长的缓冲区。\n\n读取和退回是适用于推回输入流的唯一方法。如果你想向前查看并同时读取数字，那么你既需要一个推回输入流引用和一个数据输入流引用。\n\
  \n```\nvar pbin = new PushbackInputStream(\n   new BufferedInputStream(\n      new\
  \ FileInputStream(\"employee.dat\")));\nvar din = new DataInputStream(pbin);\n```\n\
  \n当然，在其他编程语言的输入/输出库中，缓冲和预读等便利功能会自动处理好——因此在 Java 中，诉诸组合流过滤器可能有点麻烦。然而，通过混合匹配过滤器类来构建有用的输入/输出流序列的能力确实赋予了你极大的灵活性。例如，你可以使用下面的输入流序列从压缩的\
  \ ZIP 文件读取数字（参见 #ch01fig04）：\n\n```\nvar zin = new ZipInputStream(new FileInputStream(\"\
  employee.zip\"));\nvar din = new DataInputStream(zin);\n```\n\n![Figure](img/fig01-04.jpg)过滤输入流序列（参见\
  \ 2.2.3 关于 Java 处理 ZIP 文件的更多信息。）\n\n\n\n\n在保存文本字符串时，你需要考虑`character encoding`。在\
  \ Java 内部使用的 UTF-16 编码中，字符串 `\"José\"` 被为 `00 4A 00 6F 00 73 00 E9`（十六进制）。然而，许多程序期望文本文件使用不同的编码。在互联网上常用的\
  \ UTF-8 编码中，该字符串将写为 `4A 6F 73 C3 A9`，前三个字母没有零字节，而 `é` 字符占用两个字节。\n\n`OutputStreamWriter`\
  \ 类将 Unicode 编码单元的输出流转换为字节流。相反，`InputStreamReader` 类将包含字节（指定了某种字符编码的字符）的输入流转换为输出\
  \ Unicode 编码单元的读取器。\n\n从 Java 18 开始，这些类默认使用 `UTF-8` 编码。在 Java 18 之前，或者如果你需要支持某种旧的编码，请在构造函数中指定编码，例如：\n\
  \n```java\nvar in = new InputStreamReader(new FileInputStream(\"data.txt\"), StandardCharsets.UTF_8);\n\
  ```\n\n有关字符编码的更多信息，请参阅第 2.1.8 节。\n\n`Reader` 和 `Writer` 类只有读写单个字符的方法。与流一样，你使用子类来处理字符串和数字。\n\
  \n#### 如何读取文本输入\n\n处理任意文本简单的方法是使用 `Scanner` 类，我们在第一卷中广泛使用了它。你可以从任何输入流构造一个 `Scanner`。\n\
  \n或者，你可以像这样将短文本文件读入字符串：\n\n```java\nString content = Files.readString(path, charset);\n\
  ```\n\n但如果你想将文件作为行的序列，请调用\n\n```java\nList<String> lines = Files.readAllLines(path,\
  \ charset);\n```\n\n如果文件很大，请作为 `Stream<String>` 惰性处理行：\n\n```java\ntry (Stream<String>\
  \ lines = Files.lines(path, charset)) \n{\n   . . .\n}\n```\n\n如果流在获取行时发生 `IOException`，该异常将被封装成\
  \ `UncheckedIOException` 并抛出流操作。这种处理手段是必要的，因为流操作没有声明会抛出任何检查异常。\n\n要从任意输入流读取行，请使用：\n\
  \n```java\nInputStream inputStream = . . .;\ntry (var reader = new BufferedReader(new\
  \ InputStreamReader(inputStream, charset)))\n{\n   Stream<String> lines = reader.lines();\n\
  \   . . .\n}\n```\n\n你也可以使用扫描器来读取 `tokens`——即由分隔符分隔的字符串。默认分隔符是空白字符。你可以将分隔符更改为任何正则表达式。例如，这里是如何配置扫描器使用任何非\
  \ Unicode 字母作为分隔符的。\n\n```java\nScanner in = . . .;\nin.useDelimiter(\"\\\\PL+\"\
  );\n```\n\n该扫描器现在接受由 Unicode 字母组成的令牌。\n\n调用 `next` 方法可以获取下一个令牌：\n\n```java\nwhile\
  \ (in.hasNext())\n{\n   String word = in.next();\n   . . .\n}\n```\n\n或者，你可以获取所有令牌的流：\n\
  \n```java\nStream<String> words = in.tokens();\n```\n\n在遗留代码中，你可能会发现通过反复调用 `BufferedReader`\
  \ 的 `readLine` 方法来读取行的代码。如今，没有理由这样做。\n\n#### 如何写入文本输出\n\n对于文本输出，请使用 `PrintWriter`。该类拥有以文本格式打印字符串和数字的方法。要打印到文件，请通过文件名构造\
  \ `PrintWriter`：\n\n```java\nvar out = new PrintWriter(\"employee.txt\");\n```\n\
  \n奇怪的是，你不能通过 `Path` 构造 `PrintWriter`。\n\n在 Java 18 之前，请确保将字符编码作为第二个参数：\n\n```java\n\
  var out = new PrintWriter(\"employee.txt\", StandardCharsets.UTF_8);\n```\n\n否则，将使用平台编码，使得你的程序行为依赖于主机操作系统的配置。\n\
  \n要写入 `PrintWriter`，使用与与 `System.out` 相同的 `print`、`println` 和 `printf` 方法。你可以使用这些方法打印数字（`int`、`short`、`long`、`float`、`double`）、字符、`boolean`\
  \ 值、字符串和对象。\n\n例如，考虑这段代码：\n\n```java\nString name = \"Harry Hacker\";\ndouble salary\
  \ = 75000;\nout.print(name);\nout.print(' ');\nout.println(salary);\n```\n\n这会将字符\n\
  \n```\nHarry Hacker 75000.0\n```\n\n写入写入器 `out`。这些字符随后被转换为字节并进入文件 `employee.txt`。\n\
  \n`println` 方法为行添加目标系统正确的换行符（Windows 上为 `\"\\r\\n\"`，UNIX 上为 `\"\\n\"`）。这是通过调用 `System.getProperty(\"\
  line.separator\")` 获取的字符串。\n\n如果写入器被设置为 `autoflush mode`，则每当调用 `println` 时，缓冲区中的所有字符都会发送到目标。（打印写入器总是缓冲的）。默认情况下，自动刷新是`不是`启用的。你可以通过\
  \ `PrintWriter(Writer writer, boolean autoFlush)` 构造函数来启用或禁用自动刷新：\n\n```java\nvar\
  \ out = new PrintWriter(\n   new OutputStreamWriter(\n      new FileOutputStream(\"\
  employee.txt\")),\n   true); // autoflush\n```\n\n\n\n\n\n在本节中，我们将讨论一个示例程序，该程序将一个\
  \ `Employee` 记录数组存储在文本文件中。每个记录存储在单独的一行中。实例字段之间通过分隔符隔开。这里使用竖线（`|`）作为分隔符。（冒号（`:`）是另一个流行的选择。有趣的地方在于，每个人使用的分隔符都不同。）自然地，我们暂不考虑如果在保存的字符串中实际上出现了\
  \ `|` 可能会发生什么问题了。\n\n以下是一组示例记录：\n\n```\nHarry Hacker|35500.0|1989-10-01\nCarl Cracker|75000.0|1987-12-15\n\
  Tony Tester|38000.0|1990-03-15\n```\n\n### 写入记录\n写入记录非常简单。由于我们是写入文本文件，因此我们使用 `PrintWriter`\
  \ 类。我们只需写入所有字段，后面跟着一个 `|`，或者对于最后一个字段是一个换行符。这项工作在以下方法中完成：\n\n```\npublic static void\
  \ writeEmployee(PrintWriter out, Employee e)\n{\n   out.println(e.getName() + \"\
  |\" + e.getSalary() + \"|\" + e.getHireDay());\n}\n```\n\n### 读取记录\n要读取记录，我们每次读取一行并分离字段。我们使用\
  \ `scanner` 来读取每一行，然后使用 `String.split` 方法将行拆分成多个标记。\n\n```\npublic static Employee\
  \ readEmployee(Scanner in)\n{\n   String line = in.nextLine();\n   String[] tokens\
  \ = line.split(\"\\\\|\");\n   String name = tokens[0];\n   double salary = Double.parseDouble(tokens[1]);\n\
  \   LocalDate hireDate = LocalDate.parse(tokens[2]);\n   int year = hireDate.getYear();\n\
  \   int month = hireDate.getMonthValue();\n   int day = hireDate.getDayOfMonth();\n\
  \   return new Employee(name, salary, year, month, day);\n}\n```\n\n`split` 方法的参数是一个描述分隔符的正则表达式。我们将在本章末尾详细详细讨论正则表达式。恰好，竖线字符在正则表达式中有特殊含义，因此需要用\
  \ `\\` 字符进行转义。该字符需要被另一个 `\\` 转义，从而产生 `\"\\\\|\"` 表达式。\n\n完整的程序位于 Listing 2.1。静态方法\n\
  \n```\nvoid writeData(Employee[] e, PrintWriter out)\n```\n\n首先写入数组的长度，然后写入每个记录。静态方法\n\
  \n```\nEmployee[] readData(Scanner in)\n```\n\n首先读取数组的长度，然后读取每个记录。事实证明有些棘手：\n\n\
  ```\nint n = in.nextInt();\nin.nextLine(); // 换行符\nvar employees = new Employee[n];\n\
  for (int i = 0; i < n; i++)\n{\n   employees[i] = readEmployee(in);\n}\n```\n\n\
  对 `nextInt` 的调用读取了数组长度但没有没有结尾的换行符。我们必须消耗换行符，以便 `readEmployee` 方法在调用 `nextLine` 方法时获取下一行输入。\n\
  \n`textFile/TextFileTest.java`\n\n```java\npackage textFile;\n\nimport java.io.*;\n\
  import java.time.*;\nimport java.util.*;\n\n/**\n * @version 1.16 2023-08-16\n *\
  \ @author Cay Horstmann\n */\npublic class TextFileTest\n{\n   public static void\
  \ main(String[] args) throws IOException\n   {\n      var staff = new Employee[3];\n\
  \n      staff[0] = new Employee(\"Carl Cracker\", 75000, 1987, 12, 15);\n      staff[1]\
  \ = new Employee(\"Harry Hacker\", 50000, 1989, 10, 1);\n      staff[2] = new Employee(\"\
  Tony Tester\", 40000, 1990, 3, 15);\n\n      // 保存所有员工记录到文件 employee.dat\n     \
  \ try (var out = new PrintWriter(\"employee.dat\"))\n      {\n         writeData(staff,\
  \ out);\n      }\n\n      // 将所有记录检索到一个新数组\n      try (var in = new Scanner(new\
  \ FileInputStream(\"employee.dat\")))\n      {\n         Employee[] newStaff = readData(in);\n\
  \n         // 打印新读取的员工记录\n         for (Employee e : newStaff)\n            System.out.println(e);\n\
  \      }\n   }\n\n   /**\n    * 将数组中的所有员工写入打印输出器。\n    * @param employees 员工数组\n\
  \    * @param out       打印输出器\n    */\n   private static void writeData(Employee[]\
  \ employees, PrintWriter out) throws IOException\n   {\n      // 写入员工数量\n      out.println(employees.length);\n\
  \n      for (Employee e : employees)\n         writeEmployee(out, e);\n   }\n\n\
  \   /**\n    * 从扫描器读取员工数组。\n    * @param in 扫描器\n    * @return 员工数组\n    */\n  \
  \ private static Employee[] readData(Scanner in)\n   {\n      // 检索数组大小\n      int\
  \ n = in.nextInt();\n      in.nextLine(); // 换行符\n\n      var employees = new Employee[n];\n\
  \      for (int i = 0; i < n; i++)\n      {\n         employees[i] = readEmployee(in);\n\
  \      }\n      return employees;\n   }\n\n   /**\n    * 将员工数据写入打印输出器。\n    * @param\
  \ out 打印输出器\n    * @param e 员工\n    */\n   public static void writeEmployee(PrintWriter\
  \ out, Employee e)\n   {\n      out.println(e.getName() + \"|\" + e.getSalary()\
  \ + \"|\" + e.getHireDay());\n   }\n\n   /**\n    * 从扫描器读取员工数据。\n    * @param in\
  \ 扫描器\n    * @return 员工\n    */\n   public static Employee readEmployee(Scanner\
  \ in)\n   {\n      String line = in.nextLine();\n      String[] tokens = line.split(\"\
  \\\\|\");\n      String name = tokens[0];\n      double salary = Double.parseDouble(tokens[1]);\n\
  \      LocalDate hireDate = LocalDate.parse(tokens[2]);\n      int year = hireDate.getYear();\n\
  \      int month = hireDate.getMonthValue();\n      int day = hireDate.getDayOfMonth();\n\
  \      return new Employee(name, salary, year, month, day);\n   }\n}\n```\n\n###\
  \ 编码\n每个 `code point` 是一个 21 位整数。有不同的编码将这些 21 位数字封装成字节。最常见的编码是 `UTF-8`，它将每个 Unicode\
  \ 代码点编码为一个到四个字节的序列。`UTF-8` 的优势在于传统的 ASCII 集合（包含所有英语字符）占用一个字节。\n\n| UTF-8 编码 | |\n\
  | :--- | :--- |\n| `0` 到 `7F` | `0xxxxxxx` |\n| `80` 到 `7FF` | `11xxxxx 10xxxxxx`\
  \ |\n| `800` 到 `FFFF` | `111xxxx 10xxxxxx 10xxxxxx` |\n| `10000` 到 `10FFFF` | `11110xxx\
  \ 10xxxxxx 10xxxxxx 10xxxxxx` |\n\n| UTF-16 编码 | |\n| :--- | :--- |\n| `0` 到 `FFFF`\
  \ | `aaaaaaaa` |\n| `10000` 到 `10FFFF` | `bbbbbbbb aaaaaaaa cccccc`\n\n另一种常见的编码是\
  \ `UTF-16`，它将每个 Unicode 代码点编码为一个或两个 16 位值（见 表 2.2）。这是 Java 字符串使用的编码。实际上，`UTF-16`\
  \ 有两种形式，称为“大端序”和“小端序”。考虑 16 位值 `0x2122`。在大端序格式中，高位字节在前：`0x21` 后面是 `0x22`。在小端序格式中，情况相反：`0x22\
  \ 0x21`。为了指示使用了哪一种，文件可以以“字节顺序标记”（即 16 位数值 `0xFEFF`）开头。读取器可以使用该值来确定字节序，然后将其丢弃。\n\n\
  \n\n\n某些程序（包括 `Microsoft Notepad`）会在 UTF-8 编码文件的开头添加一个字节顺序标记（BOM）。显然，这是没有必要的，因为\
  \ `UTF-8` 中不存在字节顺序问题。但 Unicode 标准允许这样做，甚至建议这是一个很主主意，因为可以几乎完全消除对编码的疑义。在读取 UTF-8 编码文件时，理应将其移除。遗憾的是，`Java`\
  \ 并没有这样做，针对此问题的 bug 报告被关闭为“不修复（will not fix）”。你最好的办法是过滤掉在输入中发现的任何前导 `\\uFEFF`。\n\
  \n除了 UTF 编码外，还有一些适用于特定用户群字符范围的部分编码。例如，`ISO 8859-1` 是一种单字节编码，包含了西欧语言中使用的带重音字符。`Shift-JIS`\
  \ 是用于日语字符的变长编码。许多此类编码仍在使用。\n\n目前没有可靠的方法可以从字节流中自动检测字符编码。有时，编码会在其他地方指定。例如，在读取网页时，检查\
  \ `Content-Type` 头部。\n\n`StandardCharsets` 类具有类型为 `Charset` 的静态变量，对应每个 Java 虚拟机必须支持的字符编码：\n\
  \n```\nStandardCharsets.UTF_8\nStandardCharsets.UTF_16\nStandardCharsets.UTF_16BE\n\
  StandardCharsets.UTF_16LE\nStandardCharsets.ISO_8859_1\nStandardCharsets.US_ASCII\n\
  ```\n\n要获取另一种编码的 `Charset`，请使用静态方法 `forName`：\n\n```\nCharset shiftJIS = Charset.forName(\"\
  Shift-JIS\");\n```\n\n静态方法 `Charset.availableCharsets` 返回所有可用的 `Charset` 实例，这是一个从规范名称到\
  \ `Charset` 对象的映射。\n\n当需要指定字符编码时，请使用 `Charset` 对象。例如，你可以将字节数组转换为字符串：\n\n```\nvar\
  \ str = new String(bytes, StandardCharsets.ISO_8859_1);\n```\n\n许多方法允许你使用字符串而不是\
  \ `Charset` 来指定字符编码。对于标准字符编码，请使用 `StandardCharsets` 常量，这样任何拼写错误都会在编译时被捕获。\n\n在 Java\
  \ 17 之前，使用名称 `\"default\"` 调用 `Charset.forName` 会得到 `StandardCharsets.US_ASCII`。这在很长一段时间内显然是一个坏主意。如今，该调用会导致\
  \ `UnsupportedCharsetException`。\n\n如果你没有指定字符编码，且操作需要在字节和字符串之间进行转换，将选择一个默认值。对于 `java.nio.file`\
  \ 包中的许多方法，该默认值是 UTF-8。但其他方法在未指定字符编码时会使用*默认字符集*。这些包括：\n\n*   `java.io` 读取器和写入类的方法\n\
  *   `String` 类的 `String(byte[])` 构造函数和 `getBytes` 方法\n*   `java.util` 包中的 `Scanner`\
  \ 和 `Formatter`\n*   `java.net` 包中的 `URLEncoder` 和 `URLDecoder`\n\n从 Java 18 开始，默认字符集是\
  \ UTF-8。在 Java 18 之前，默认字符集是*原生编码（native encoding）*，由执行 Java 虚拟机的系统决定。在 Linux 和 Mac\
  \ OS 上，那通常是（但总是）UTF-8。然而，在 Windows 上，原生编码在大多数情况下是如 Windows-1252 这样的旧编码。\n\n在 Java\
  \ 18 之前，Oracle 的 Java 实现有一个系统属性 `file.encoding`，用于覆盖平台默认值。这不是一个官方支持的属性，但仍然被广泛使用。\n\
  \n从 Java 18 开始，该属性已标准化。你可以在命令行上将 `file.encoding` 属性设置为这些值：\n\n*   `COMPAT`（从 Java\
  \ 18 起）：将默认字符集设置为原生编码，并将 `file.encoding` 系统属性设置为其名称。\n*   `UTF-8`：将默认字符集设置为 UTF-8。\n\
  *   另一种字符编码，如 `US-ASCII`：对于某些未指定的旧字符集名称，它可能会将默认字符集设置为指定的那个。\n\n`file.encoding` 属性必须在命令行上设置。通过\
  \ `System.setProperty` 设置不会更新默认字符集。\n\n实际使用的默认字符集由静态方法 `Charset.defaultCharset`\
  \ 返回。从 Java 17 开始，系统属性 `native.encoding` 返回原生编码的名称，无论是否使用。\n\n当你在 Windows 终端启动 Java\
  \ 程序时，`System.out` 和 `System.err` 使用的编码源自终端的“代码页（code page）”，这可能与默认字符集不同。\n\n你最好的办法是使用\
  \ Windows 命令切换到 UTF-8 代码页：\n\n```\nchcp 65001\n```\n\n或者，从 Java 18 开始，你可以在命令行上将系统属性\
  \ `stdout.encoding` 和 `stderr.encoding` 设置为 `UTF-8`。如果终端代码页不是 UTF-8，终端消息可能会乱码。但重定向到文件将正常工作。\n\
  \n这些系统属性的命名可能令人困惑。编码并不适用于 `stdout` 和 `stderr`（它们是字节流），而是适用于 `System.out` 和 `System.err`\
  \ 对象。它们都是 `PrintStream` 的实例，其 `print` 和 `println` 方法需要一个能将字符转换为字节的编码。\n\n要快速查看你当前默认字符集和各种编码的设置，请运行：\n\
  \n```\njava -XshowSettings:encoding\n```\n\n\n\n文本格式对于测试和调试非常方便，因为它易于人类阅读，但它的效率不如二进制格式传输。在接下来的章节中，你将学习如何对二进制数据进行输入和输出。\n\
  \n### `DataInput` 和 `DataOutput` 接口\n\n`DataOutput` 接口定义了以下方法，用于二进制格式写入数字、字符、`boolean`\
  \ 值或字符串：\n\n```\nwriteChars          writeFloat\nwriteByte           writeDouble\n\
  writeInt            writeChar\nwriteShort          writeBoolean\nwriteLong     \
  \      writeUTF\n```\n\n例如，`writeInt` 无论数字位数多少，始终将整数写入 4 字节的二进制量，而 `writeDouble`\
  \ 总是将 `double` 写入 8 字节的二进制量。生成的输出不是人类可读的，但它为每个给定类型的值使用相同的空间，而且回读它会比解析文本更快。\n\n在内存中存储整数和浮点数有两种不同的方法，取决于你正在使用的处理器。假设，你正在处理一个\
  \ 4 字节的 `int`，例如十进制数字 1234，或者十六进制的 4D2（1234 = 4 × 256 + 13 × 16 + 2）。该值可以这样存储：内存中四个字节的第一个字节持有该值的最高有效字节（MSB）：`00\
  \ 00 04 D2`。这就是所谓的大端序（big-endian）。或者，我们可以从最低有效字节（LSB）开始：`D2 04 00 00`。这理所当然地被称为小端序（little-endian）。例如，SPARC\
  \ 使用大端序；Intel 处理器使用小端序。这可能会导致问题。当从 C 或 C++ 文件保存文件时，数据将按照处理器存储的方式精确保存。这使得即使是最简单的数据文件从一个平台移动另一个平台也具有挑战性。在\
  \ Java 中，无论处理器如何，所有值都以大端序方式写入。这使得 Java 数据文件与平台无关。\n\n`writeUTF` 方法使用修改后的 8 位 Unicode\
  \ 转换格式版本写入字符串数据。它不是简单地使用标准的 UTF-8 编码，而是首先将 Unicode 代码单元序列表示为 UTF-16，然后使用 UTF-8 规则对结果进行编码。这种修改后的编码对于代码高于\
  \ `0xFFFF` 的字符是不同的。它用于与在 Unicode 增长到 16 位之前构建的虚拟机向后兼容。\n\n由于没有其他人使用这种 UTF-8 的修改版本，你应该只使用\
  \ `writeUTF` 方法写入目标为 Java 虚拟机的字符串——例如，在生成字节码的程序中。其他用途请使用 `writeChars` 方法。\n\n要回读数据，请使用\
  \ `DataInput` 接口定义的以下方法：\n\n```\nreadInt            readDouble\nreadShort      \
  \    readChar\nreadLong           readBoolean\nreadFloat          readUTF\n```\n\
  \n`DataInputStream` 类实现了 `DataInput` 接口。要从文件读取二进制数据，请将 `DataInputStream` 与类似 `FileInputStream`\
  \ 的字节源结合：\n\n```\nvar in = new DataInputStream(new FileInputStream(\"employee.dat\"\
  ));\n```\n\n同样，要写入二进制数据，请使用实现 `DataOutput` 接口的 `DataOutputStream` 类：\n\n```\nvar\
  \ out = new DataOutputStream(new FileOutputStream(\"employee.dat\"));\n```\n\n####\
  \ java.io.DataInput 1.0\n\n- `boolean readBoolean()`\n- `byte readByte()`\n- `char\
  \ readChar()`\n- `double readDouble()`\n- `float readFloat()`\n- `int readInt()`\n\
  - `long readLong()`\n- `short readShort()`\n  读取给定类型的值。\n- `void readFully(byte[]\
  \ b)`\n  将字节读入数组 `b` 中，阻塞直到所有字节被读取。\n- `void readFully(byte[] b, int off, int len)`\n\
  \  将多达 `len` 字节放入数组 `b` 中，从 `off` 开始，阻塞直到所有字节被读取。\n- `String readUTF()`\n  读取“修改\
  \ UTF-8”格式的字符字符串。\n- `int skipBytes(int n)`\n  跳过 `n` 字节，阻塞直到所有字节被跳过。\n\n#### java.io.DataOutput\
  \ 1.0\n\n- `void writeBoolean(boolean b)`\n- `void writeByte(int b)`\n- `void writeChar(int\
  \ c)`\n- `void writeDouble(double d)`\n- `void writeFloat(float f)`\n- `void writeInt(int\
  \ i)`\n- `void writeLong(long l)`\n- `void writeShort(int s)`\n  写入给定类型的值。\n- `void\
  \ writeChars(String s)`\n  写入字符串中的所有字符。\n- `void writeUTF(String s)`\n  写入“修改 UTF-8”格式的字符字符串。\n\
  \n### 随机访问文件\n\n`RandomAccessFile` 类允许你在文件的任何地方读取或写入数据。磁盘文件是随机访问的，但与网络套接字通信的输入输出流不是。你可以以只读或读写方式打开随机访问文件；通过在构造函数的第二个参数中使用字符串\
  \ `\"r\"`（读取访问）或 `\"rw\"`（读写访问）来指定选项。\n\n```\nvar in = new RandomAccessFile(\"employee.dat\"\
  , \"r\");\nvar out = new RandomAccessFile(\"employee.dat\", \"rw\");\n```\n\n（注：关于随机访问文件的输入文本包含了一些重复/损坏片段，我根据提供的片段整合了核心逻辑。）\n\
  \n\n\n我们将 `writeFixedString` 和 `readFixedString` 方法放在了 `DataIO` 辅助类中。\n\n要写入固定大小的记录，我们只需以二进制形式写入所有字段。\n\
  \n```\nDataIO.writeFixedString(e.getName(), Employee.NAME_SIZE, out);\nout.writeDouble(e.getSalary());\n\
  LocalDate hireDay = e.getHireDay();\nout.writeInt(hireDay.getYear());\nout.writeInt(hireDay.getMonthValue());\n\
  out.writeInt(hireDay.getDayOfMonth());\n```\n\n读回数据同样简单。\n\n```\nString name = DataIO.readFixedString(Employee.NAME_SIZE,\
  \ in);\ndouble salary = in.readDouble();\nint y = in.readInt();\nint m = in.readInt();\n\
  int d = in.readInt();\n```\n\n让我们计算每条记录的大小。我们将为名称字符串使用 40 个字符。因此，每条记录将包含 100 字节：\n\
  \n* 40 个字符 = 80 字节的名称\n* 1 个 `double` = 8 字节的薪水\n* 3 个 `int` = 12 字节的日期\n\n列表 2.2\
  \ 所示程序将三条记录写入数据文件，然后反序从文件中读取它们。要高效地实现这一操作需要随机访问——我们需要先到达最后一条记录。\n\n`randomAccess/RandomAccessTest.java`\n\
  \n```\npackage randomAccess;\n\nimport java.io.*;\nimport java.time.*;\n\n/**\n\
  \ * @version 1.14 2023-10-05\n * @author Cay Horstmann\n */\npublic class RandomAccessTest\n\
  {\n   public static final int NAME_SIZE = 40;\n   public static final int RECORD_SIZE\
  \ = 2 * NAME_SIZE + 8 + 4 + 4 + 4;\n\n   public static void main(String[] args)\
  \ throws IOException\n   {\n      var staff = new Employee[3];\n\n      staff[0]\
  \ = new Employee(\"Carl Cracker\", 75000, 1987, 12, 15);\n      staff[1] = new Employee(\"\
  Harry Hacker\", 50000, 1989, 10, 1);\n      staff[2] = new Employee(\"Tony Tester\"\
  , 40000, 1990, 3, 15);\n\n      try (var out = new DataOutputStream(new FileOutputStream(\"\
  employee.dat\")))\n      {\n         // 将所有员工记录保存文件 employee.dat\n         for (Employee\
  \ e : staff)\n            writeData(out, e);\n      }\n\n      try (var in = new\
  \ RandomAccessFile(\"employee.dat\", \"r\"))\n      {\n         // 将所有记录读入新数组\n\n\
  \         // 计算数组大小\n         int n = (int) (in.length() / RECORD_SIZE);\n     \
  \    var newStaff = new Employee[n];\n\n         // 反序读取员工\n         for (int i\
  \ = 0; i < n; i++)\n         {\n            in.seek((n - 1 - i) * RECORD_SIZE);\n\
  \            newStaff[i] = readData(in);\n         }\n\n         // 打印新读取的员工记录\n\
  \         for (Employee e : newStaff)\n            System.out.println(e);\n    \
  \  }\n   }\n\n   /**\n    * 将员工数据写入数据输出流。\n    * @param out 数据输出流\n    * @param\
  \ e   员工\n    */\n   public static void writeData(DataOutput out, Employee e) throws\
  \ IOException\n   {\n      DataIO.writeFixedString(e.getName(), NAME_SIZE, out);\n\
  \      out.writeDouble(e.getSalary());\n\n      LocalDate hireDay = e.getHireDay();\n\
  \      out.writeInt(hireDay.getYear());\n      out.writeInt(hireDay.getMonthValue());\n\
  \      out.writeInt(hireDay.getDayOfMonth());\n   }\n\n   /**\n    * 从数据输入流读取员工数据。\n\
  \     * @param in 数据输入流\n     * @return 员工\n     */\n   public static Employee readData(DataInput\
  \ in) throws IOException\n   {\n      String name = DataIO.readFixedString(NAME_SIZE,\
  \ in);\n      double salary = in.readDouble();\n      int y = in.readInt();\n  \
  \    int m = in.readInt();\n      int d = in.readInt();\n      return new Employee(name,\
  \ salary, y, m, d);\n   }\n}\n```\n\n`java.io.RandomAccessFile` 1.0\n\n* `RandomAccessFile(String\
  \ file, String mode)`\n* `RandomAccessFile(File file, String mode)`\n  以随机访问模式打开给定文件。`mode`\
  \ 字符串 `\"r\"` 表示只读模式，`\"rw\"` 表示读写模式，`\"rws\"` 表示每次更新都对数据和元数据进行同步磁盘写入的读写模式，`\"rwd\"\
  ` 表示仅对数据进行同步磁盘写入的读写模式。\n* `long getFilePointer()`\n  返回文件指针当前的位置。\n* `void seek(long\
  \ pos)`\n  将文件指针设置为从文件开始 `pos` 字节处。\n* `long length()`\n  返回以字节为单位的文件长度。\n\n###\
  \ ZIP 档\n\nZIP 档以（通常是）压缩格式存储一个或文件。每个 ZIP 档都有一个头部，包含如每个文件名和所使用的压缩方法等信息。在 Java 中，你可以使用\
  \ `ZipInputStream` 读取 ZIP 档。你需要查看存档中的 `entries`。`getNextEntry` 方法返回一个 `ZipEntry`\
  \ 类型的对象。从流中读取，直到当前条目的结束。然后调用 `closeEntry` 读取下一个条目。读取 ZIP 文件的典型代码序列如下：\n\n```\nvar\
  \ zin = new ZipInputStream(new FileInputStream(zipname));\nboolean done = false;\n\
  while (!done)\n{\n   ZipEntry entry = zin.getNextEntry();\n   if (entry == null)\
  \ done = true;\n   else\n   {\n      // 读取 zin 的内容\n      zin.closeEntry();\n  \
  \ }\n}\nzin.close();\n```\n\n写入 ZIP 文件，使用 `ZipOutputStream`。对于你想放入 ZIP 档的每个条目，创建一个\
  \ `ZipEntry` 对象。将文件名传递给 `ZipEntry`。\n\nZIP 输入流是这种能力的很好的例子。当你读取压缩格式存储的数据时，不需要担心数据在请求时被解压。此外，ZIP\
  \ 字节源不需要是文件——它可以来自网络连接。\n\nJAR 文件（我们在第 4 章中讨论过）只是带有特殊条目的 ZIP 文件——带有清单。使用 `JarInputStream`\
  \ 和 `JarOutputStream` 类来读取和写入清单。\n\n第 2.4.8 节 显示了如何在使用特殊 API 的情况下访问 ZIP 档。\n\n\n\
  \n\n### `java.util.zip.ZipEntry` 1.1\n\n* `ZipEntry(String name)`\n  构造一个给定名称的 ZIP\
  \ 条目。\n* `long getCrc()`\n  返回此 `ZipEntry` 的 CRC32 校验和。\n* `String getName()`\n\
  \  返回此条目的名称。\n* `long getSize()`\n  返回此条目的的未压缩大小，如果未压缩大小未知，则返回 `-1`。\n* `boolean\
  \ isDirectory()`\n  如果此条目是目录，则返回 `true`。\n* `void setMethod(int method)`\n  将此条目的的压缩方法设置为\
  \ `DEFLATED` 或 `STORED`。\n* `void setSize(long size)`\n  设置此条目的的大小。仅当压缩方法为 `STORED`\
  \ 时才需要。\n* `void setCrc(long crc)`\n  设置此条目的的 CRC32 校验和。使用 `CRC32` 类计算此校验和。仅当压缩方法为\
  \ `STORED` 时才需要。\n\n### `java.util.zip.ZipFile` 1.1\n\n* `ZipFile(String name)`\n\
  * `ZipFile(File file)`\n* `ZipFile(String name, Charset charset)` 1.7\n* `ZipFile(File\
  \ file, Charset charset)` 1.7\n  根据给名称或 `File` 对象创建一个用于从文件读取的 `ZipFile`。如果提供了 `Charset`，则表示条目名称的编码。否则，假设它们被编码为\
  \ UTF-8。\n* `Enumeration entries()`\n  返回一个 `Enumeration` 对象，用于枚举描述 `ZipFile` 条目的\
  \ `ZipEntry` 对象。\n* `ZipEntry getEntry(String name)`\n  返回与给定名称对应的条目，如果没有此类条目，则返回\
  \ `null`。\n* `InputStream getInputStream(ZipEntry ze)`\n  返回用于给定条目的 `InputStream`。\n\
  * `String getName()`\n  返回此 ZIP 文件的路径。\n\n#### 对象输入输出流与序列化\n\n如果你需要存储相同类型的数据，使用固定长度记录格式是一个很好的选择。然而，你在面向对象的程序中创建的对象很少是同一种类型。例如，你可能有一个名为\
  \ `staff` 的数组，它名义上是 `Employee` 记录数组，但其中包含的对象实际上是如 `Manager` 等子类的实例。\n\n完全可以设计出一种允许你存储此类多态集合的数据格式——但幸运的是，我们不必那样做。Java\
  \ 语言支持一种非常通用的机制，称为**对象序列化**（object serialization），它使得将任何对象写入输出流并在稍后再次读取成为可能。（将在接下来的章节中看到“序列化”一词的来源。）\n\
  \n#### 保存和加载可序列化对象\n\n要保存对象数据，你首先需要打开一个 `ObjectOutputStream` 对象：\n\n```\nvar out\
  \ = new ObjectOutputStream(new FileOutputStream(\"employee.dat\"));\n```\n\n现在，要保存一个对象，只需像下面的代码所示使用\
  \ `ObjectOutputStream` 类的 `writeObject` 方法即可：\n\n```\nvar harry = new Employee(\"\
  Harry Hacker\", 50000, 1989, 10, 1);\nvar boss = new Manager(\"Carl Cracker\", 80000,\
  \ 1987, 12, 15);\nout.writeObject(harry);\nout.writeObject(boss);\n```\n\n要将对象读回，首先获取一个\
  \ `ObjectInputStream` 对象：\n\n```\nvar in = new ObjectInputStream(new FileInputStream(\"\
  employee.dat\"));\n```\n\n然后，按照写入时的相同顺序使用 `readObject` 方法检索对象：\n\n```\nvar e1 =\
  \ (Employee) in.readObject();\nvar e2 = (Employee) in.readObject();\n```\n\n然而，对于你任何想要保存到输出流并从对象输入流中恢复的类，你都需要进行一个更改。该类必须实现\
  \ `Serializable` 接口：\n\n```\nclass Employee implements Serializable { . . . }\n\
  ```\n\n`Serializable` 接口没有方法，因此你不需要以任何方式更改你的类。在这方面，它与我们在第一卷第 6 章中讨论过的 `Cloneable`\
  \ 接口相似。然而，要使一个类可克隆，仍然需要重写 `Object` 类的 `clone` 方法。而要使一个类可序列化，你不需要做其他事情。\n\n你只能使用\
  \ `writeObject/readObject` 方法写入和读取对象。对于基本类型值，请使用如 `writeInt/readInt` 或 `writeDouble/readDouble`\
  \ 等方法。（对象输入输出流类实现了 `DataInput/DataOutput` 接口。）\n\n在后台，`ObjectOutputStream` 会查看对象的所有字段并保存它们的内容。例如，在写入一个\
  \ `Employee` 对象时，名称、日期和薪水字段会被写入输出流中。\n\n然而，有一个重要情况需要考虑：当一个对象作为多个对象状态的一部分被共享时会发生什么？\n\
  \n为了说明这个问题，让我们对 `Manager` 类进行细微修改。假设每个经理都有一个秘书：\n\n```\nclass Manager extends Employee\n\
  {\n   private Employee secretary;\n   . . .\n}\n```\n\n每个 `Manager` 对象现在包含一个指向描述秘书的\
  \ `Employee` 对象的引用。\n\n![图](img/fig01-06.jpg)两个经理共享一个员工\n\n保存这样的对象网络是一项挑战。当然，我们无法保存内存地址。当对象重新加载时，它占据的内存地址可能完全不同。\n\
  \n相反，每个对象在保存时带有一个*序列号*（serial number）——这就是*对象序列化*的名称。以下是算法：\n\n1. 为你遇到的每个对象引用关联一个序列号（如\
  \ #0107 所示）。\n2. 第一次遇到对象引用时，将对象数据保存到输出流。\n3. 如果之前保存过，只需写入“与之前保存的序列号 x 的对象相同”。\n\n\
  读回对象时，过程是反的：\n\n1. 当对象输入流中第一次指定一个对象时，构造它，使用流数据对其初始化，并记住序列号与对象引用之间的关联。\n2. 当遇到“与之前保存的序列号\
  \ x 的对象相同”标签时，检索对象引用。\n\n在本章中，我们将使用序列化将对象集合保存到磁盘文件，并按照我们存储的方式将其检索。另一个非常重要的应用是跨网络连接传输对象集合。原始内存地址在文件中没有意义，当你与不同的处理器通信时，它们也没有意义。通过用序列号代替内存地址，序列化允许对象集合从一台机器传输到另一台机器。\n\
  \n如果序列化类的父类不可序列化，它必须有一个可访问的无参构造函数。考虑这个例子：\n\n```\nclass Person // 不序列化\nclass Employee\
  \ extends Person implements Serializable\n```\n\n当 `Employee` 对象被反序列化时，其实例字段从对象输入流读取，但\
  \ `Person` 实例字段由 `Person` 构造函数设置。\n\n列表 2.3 是一个保存并重新加载 `Employee` 和 `Manager` 对象网络的程序（其中某些对象共享同一个员工作为秘书）。注意，重新加载后秘书对象是唯一的——当\
  \ `newStaff[1]` 涨薪时，这反映现在经理的 `secretary` 字段中。\n\n```java\nserial/ObjectStreamTest.java\n\
  ```\n\n\n\n\n\n```java\npackage serial;\n\nimport java.io.*;\n\n/**\n * @version\
  \ 1.12 2021-09-10\n * @author Cay Horstmann\n */\nclass ObjectStreamTest\n{\n  \
  \ public static void main(String[] args) throws IOException, ClassNotFoundException\n\
  \   {\n      var harry = new Employee(\"Harry Hacker\", 50000, 1989, 10, 1);\n \
  \     var carl = new Manager(\"Carl Cracker\", 80000, 1987, 12, 15);\n      carl.setSecretary(harry);\n\
  \      var tony = new Manager(\"Tony Tester\", 40000, 1990, 3, 15);\n      tony.setSecretary(harry);\n\
  \n      var staff = new Employee[3];\n\n      staff[0] = carl;\n      staff[1] =\
  \ harry;\n      staff[2] = tony;\n\n      // 将所有员工记录保存到文件 employee.ser\n      try\
  \ (var out = new ObjectOutputStream(new FileOutputStream(\"employee.ser\")))\n \
  \     {\n         out.writeObject(staff);\n      }\n\n      try (var in = new ObjectInputStream(new\
  \ FileInputStream(\"employee.ser\")))\n      {\n         // 将所有记录读入新数组\n\n     \
  \    var newStaff = (Employee[]) in.readObject();\n\n         // 提高秘书的工资\n     \
  \    newStaff[1].raiseSalary(10);\n\n         // 输出新读取的员工记录\n         for (Employee\
  \ e : newStaff)\n            System.out.println(e);\n      }\n   }\n}\n```\n\n###\
  \ `java.io.ObjectOutputStream` 1.1\n\n* `ObjectOutputStream(OutputStream out)`\n\
  \  创建一个 `ObjectOutputStream`，以便将对象写入指定的 `OutputStream`。\n\n* `void writeObject(Object\
  \ obj)`\n  将指定的对象写入 `ObjectOutputStream`。此方法保存了对象的类、类的签名以及该类及其超类中任何非静态、非瞬态（non-transient）字段的值。\n\
  \n### `java.io.ObjectInputStream` 1.1\n\n* `ObjectInputStream(InputStream in)`\n\
  \  创建一个 `ObjectInputStream`，以便从指定的 `InputStream` 读回对象信息。\n\n* `Object readObject()`\n\
  \  从 `ObjectInputStream` 读取一个对象。特别是，此方法会读回对象的类、类的签名以及该类及其所有超类中非瞬态和非静态字段的值。它执行反序列化，以便可以恢复多个对象引用。\n\
  \n### 理解对象序列化文件格式\n\n对象序列化将对象数据以特定的文件格式保存。当然，你可以直接使用 `writeObject/readObject` 方法，而无需知道表示文件中对象的精确字节序列。尽管如此，我们发现研究数据格式对于深入了解对象序列化过程非常有帮助。由于细节具有某种技术性，如果你对实现不感兴趣，可以跳过本节。\n\
  \n每个文件都以两个字节的“魔数”开始：\n\n```\nAC ED\n```\n\n随后是对象序列化格式的版本号，目前为：\n\n```\n00 05\n```\n\
  \n（在本节中我们始终使用十六进制数表示字节。）然后，它包含一系列对象，按照它们保存的顺序排列。\n\n字符串对象的保存格式为：\n\n* `74`\n* 两个字节长度\n\
  * “修改后的 UTF-8”格式的字符\n\n例如，字符串“Harry”被保存为：\n\n```\n74 00 05 Harry\n```\n\n当对象被保存时，该对象的类也必须被保存。类描述符具有以下格式：\n\
  \n* `72`\n* 2 字节类名长度\n* 类名\n* 8 字节指纹\n* 1 字节标记\n* 2 字节实例字段描述符计数\n* 实例字段描述符\n* `78`（结束标记）\n\
  * 超类描述符（若无则为 `70`）\n\n指纹通过以规范方式对类、超类、接口、字段类型和方法签名的描述进行排序，然后对该数据应用安全哈希算法版本 1 (`SHA-1`)\
  \ 得到。\n\nSHA-1 为数据块提供一个“指纹”。无论原始数据有多大，该指纹始终是一个 20 字节的数据包。它是通过对数据进行一系列巧妙的位操作创建的，这使得当信息发生任何更改时，指纹都极有可能发生变化。序列化机制仅使用\
  \ `SHA-1` 代码的前八个字节作为类指纹。如果实例字段或方法发生变化，类指纹极有可能发生变化。\n\n在读取对象时，其指纹与类的当前指纹进行比较。如果它们不匹配，意味着类定义在对象写入后发生了变化，并且会生成一个异常。当然，在实践中，类会演进，程序可能需要读取旧版本的对象。我们将在第\
  \ 2.3.7 节 中讨论此。\n\n标记字节由 `java.io.ObjectStreamConstants` 中定义的位掩码组成，见表 2.3。\n\n###\
  \ 位掩码\n\n| 名称 | 值 | 描述 |\n| --- | --- | --- |\n| `SC_WRITE_METHOD` | 1 | 类定义了 `writeObject`\
  \ 方法。 |\n| `SC_SERIALIZABLE` | 2 | 类实现了 `Serializable`。 |\n| `SC_EXTERNALIZABLE`\
  \ | 4 | 类实现了 `Externalizable`。 |\n| `SC_BLOCK_DATA` | 8 | 类定义了块数据。 |\n| `SC_ENUM`\
  \ | 16 | 类是枚举。 |\n\n每个字段描述符的格式为：\n\n* 1 字节类型代码\n* 2 字节字段名长度\n* 字段名\n\n类型代码之一为：\n\
  \n| 代码 | 描述 |\n| --- | --- |\n| `B` | byte |\n| `C` | char |\n| `D` | double |\n\
  | `F` | float |\n| `I` | int |\n| `J` | long |\n| `L` | object |\n| `S` | short\
  \ |\n| `Z` | boolean |\n| `[` | array |\n\n当类型代码为 `L` 时，字段名后跟随字段类型。类和字段名不是字符串字符串，但字段类型使用了稍微不同的编码——即原生方法使用的格式。\n\
  \n这些描述符相当长。如果文件中再次需要*同一个*类描述符，则使用省略形式：\n\n* `71`\n* 4 字节序列号\n\n序列号指向之前的显式类描述符。我们稍后会讨论编号方案。\n\
  \n对象的存储格式为：\n\n* `73`\n* 类描述符\n* 对象数据\n\n例如，以下是 `Employee` 对象实例字段的存储方式：\n\n| 字段\
  \ | 值/数据 |\n| --- | --- |\n| `salary` | `40 E8 6A 00 00 00 00 00` |\n| `hireDay`\
  \ | `73` `71 00 7E 00 08` `77 08 00 00 00 91 19 97 3D 80 78` |\n| `name` | `74 00\
  \ 0C Harry Hacker` |\n\n\n\n\n如你所见，数据文件包含了恢复 `Employee` 对象所需的足够信息。（在本例中，我们将 `hireday`\
  \ 存储为 `Date` 而不是 `LocalDate`，因为 `LocalDate` 类的序列化过程更为复杂。）\n\n正如你刚刚看到的，对象流包含了所有序列化对象的类名、父类名和字段名。对于内部类，某些名称是由编译器合成的，且命名约定可能会在不同的\
  \ Java 实现之间发生变化。如果发生这种情况，反序列化将失败。因此，如果你打算在不同的实现中反序列化内部类，那么序列化内部类存在存在微小的风险。\n\n静态内部类（包括内部枚举和记录类）是安全的序列化的。\n\
  \n### 数组格式\n数组按照以下格式保存：\n\n*   `75`\n*   类描述符（Class descriptor）\n*   4 字节元素个数\n\
  *   元素\n\n类描述符中的数组类名与原生方法使用的格式相同（这与其他类描述符中类名使用的格式略有不同）。在这种格式中，类名以 `L` 开头并以分号 `;`\
  \ 结尾。\n\n例如，一个包含三个 `Employee` 对象的数组开头如下：\n\n| | 描述 |\n| :--- | :--- |\n| `75` |\
  \ 数组 |\n| `72 00 0B [LEmployee;` | 新类，字符串长度，类名 `Employee[]` |\n| `40 05 D6 7E 3B\
  \ BB F2 50 02` | 指纹和标志位 |\n| `00 00` | 实例字段个数 |\n| `78` | 结束标记 |\n| `70` | 无父类 |\n\
  | `00 00 00 03` | 数组项数 |\n\n注意，`Employee` 对象数组的指纹与 `Employee` 类本身的指纹不同。\n\n### 对象序列号\n\
  所有对象（包括数组和字符串）以及所有类描述符在保存到输出文件时都会赋予序列号。这些数字从 `00 7E 00 00` 开始。\n\n我们已经看到任何给定类的完整类描述符只出现一次。后续描述符对其进行引用。例如，在我们之前的示例中，对\
  \ `Date` 类的重复引用被编码为：\n\n```\n71 00 7E 00 08\n```\n\n对象也使用相同的机制。如果写入对之前保存的对象的引用，它将以完全相同的方式保存——即\
  \ `71` 后紧跟序列号。从上下文始终可以清楚地判断特定的序列引用是指类描述符还是对象。\n\n某些类（如 `Date` 类）在不透明的二进制块中存储对象状态，编码为：\n\
  \n*   `77`（短块）或 `7A`（长块）\n*   1 字节或 4 字节块长度\n*   块内容\n*   `78`\n\n最后，空引用（null reference）存储为：\n\
  \n```\n70\n```\n\n### ObjectStreamTest 输出\n这里是前节中 `ObjectStreamTest` 程序带有注释的输出。运行该程序，查看其数据文件\
  \ `employee.ser` 的十六进制转储，并与带注释的列表进行比较。最重要的行位于输出的末尾。它们显示了对之前保存对象的引用。\n\n| | 描述 |\n\
  | :--- | :--- |\n| `AC ED 00 05` | 文件头 |\n| `75` | 数组 `staff`（序列号 #1） |\n| `72 00\
