  \ `Date.valueOf(localDate)` | `date.toLocalDate()` |\n| `LocalTime` ↔︎ `java.sql.Time`\
  \ | `Time.valueOf(localTime)` | `time.toLocalTime()` |\n| `DateTimeFormatter` →\
