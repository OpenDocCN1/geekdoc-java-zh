  \ `MessageFormat` 类，用于格式化带有变量部分的文本。它与 `printf` 方法的格式化类似，但它支持本地化（locale）以及数字和日期格式。我们将在接下来的章节中这一机制。\n\
  \n### 格式化数字和日期\n\n这是一个典型的消息格式字符串：\n\n```\n\"On {2}, a {0} destroyed {1} houses and\
  \ caused {3} of damage.\"\n```\n\n括号中的数字是实际名称和值的占位符。静态方法 `MessageFormat.format`\
  \ 允许你为变量替换值。这是一个“可变参数”（varargs）方法，因此你可以如下所示提供参数：\n\n```\nString msg \n   = MessageFormat.format(\"\
  On {2}, a {0} destroyed {1} houses and caused {3} of damage.\",\n      \"hurricane\"\
  , 99, new GregorianCalendar(1999, 0, 1).getTime(), 10.0E8);\n```\n\n在这个示例中，占位符 `{0}`\
  \ 被替换为 `\"hurricane\"`，`{1}` 被替换为 `99`，依此类推。\n\n我们示例的结果是字符串\n\n```\nOn 1/1/99 12:00\
  \ AM, a hurricane destroyed 99 houses and caused 100,000,000 of damage.\n```\n\n\
  这只是开始，但并不完美。我们不想显示时间“12:00 AM”，并且希望将损失金额以货币值的形式打印。我们实现此点的方法为某些占位符提供可选的格式：\n\n```\n\
  \"On {2,date,long}, a {0} destroyed {1} houses and caused {3,number,currency} of\
  \ damage.\"\n```\n\n这段示例代码输出：\n\n```\nOn January 1, 1999, a hurricane destroyed\
  \ 99 houses and caused $100,000,000 of damage.\n```\n\n通常，占位符索引后面可以紧跟一个 `type`（类型）和一个\
  \ `style`（样式）。用逗号分隔索引、类型和样式。类型可以是任意一种：\n\n```\nnumber\ntime\ndate\nchoice\n```\n\
  \n如果类型是 `number`，那么样式可以是：\n\n```\ninteger\ncurrency\npercent\n```\n\n或者它可以是一个 `DecimalFormat`\
  \ 模式，例如 `$,##0`——可能的格式请参见 第 7.2.2 节。\n\n如果类型是 `time` 或 `date`，那么样式可以是：\n\n```\n\
  short\nmedium\nlong\nfull\n```\n\n或者一个日期格式模式，如 `yyyy-MM-dd`。（可能的格式请参阅 `SimpleDateFormat`\
  \ 类的文档。）\n\n要在消息格式字符串中包含括号，请用单引号将其括起来，例如：`\"A {0} is enclosed in '{' and '}' symbols\"\
  .`。对于文本，最好使用弯曲单引号：`\"{0}’s favorite symbols are braces\"`。但如果你必须使用直单引号，则需要将其双写：\n\
  \n```\nString template = \"<a href=''{0}''>{1}</a>\";\n```\n\n静态 `MessageFormat.format`\
  \ 方法使用当前本地化来格式化值。若要使用任意本地化进行格式化，你需要多花些，因为没有可以使用的“可变参数”方法。你需要将要格式化的值放入一个 `Object[]`\
  \ 数组中，如下所示：\n\n```\nvar formatter = new MessageFormat(pattern, locale);\nString\
  \ message = formatter.format(new Object[] { values });\n```\n\n`java.text.MessageFormat`\
  \ 1.1\n\n*   `MessageFormat(String pattern)`\n*   `MessageFormat(String pattern,\
  \ Locale locale)`\n    使用指定的模式和本地化构造一个消息格式对象。\n\n*   `void applyPattern(String pattern)`\n\
  \    将消息格式对象的模式设置为指定的模式。\n\n*   `void setLocale(Locale locale)`\n*   `Locale getLocale()`\n\
  \    设置或获取用于消息中占位符的本地化。该本地化*仅*用于你通过调用 `applyPattern` 方法设置的后续模式。\n\n*   `static String\
  \ format(String pattern, Object... args)`\n    使用 `args[i]` 作为占位符 `{i}` 的输入来格式化模式字符串。\n\
  \n*   `StringBuffer format(Object args, StringBuffer result, FieldPosition pos)`\n\
  \    格式化此 `MessageFormat` 的模式。`args` 参数必须是一个对象数组。格式化后的字符串追加到 `result` 中，并返回 `result`。如果\
  \ `pos` 等于 `new FieldPosition(MessageFormat.Field.ARGUMENT)`，则其 `beginIndex` 和 `endIndex`\
  \ 属性被设置为替换 `{1}` 占位符的文本的位置。如果你对位置信息感兴趣，请提供 `null`。\n\n`java.text.Format` 1.1\n\n\
  *   `String format(Object obj)`\n    根据此格式器的规则格式化给定对象。此方法调用 `format(obj, new StringBuffer(),\
  \ new FieldPosition(0)).toString()`。\n\n### 选择格式（Choice Formats）\n\n让我们仔细观察上一部分的模式：\n\
