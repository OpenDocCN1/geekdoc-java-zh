  \n`getInstance(int rule)`\n\n`getInstance(int rule, float alpha)`\n\n## Raster Images\n\
  \nJava2D API 允许你创建由线条、曲线和区域组成的图形。然而，对于由像素组成的图像，你需要处理颜色数据。\n\n### 读取器和写入器\n\n`javax.imageio`\
  \ 包包含了读取和写入常用格式的支持，还提供了一个允许第三方为其他格式添加读取器和写入器的框架。GIF、JPEG、PNG、BMP（Windows 位图）和 WBMP（无线位图）格式都是支持。\n\
  \n库的操作非常简单。要加载图像，使用 `ImageIO` 的静态 `read` 方法：\n\n```java\nFile f = ...;\nBufferedImage\
  \ image = ImageIO.read(f);\n```\n\n`ImageIO` 类根据文件类型选择合适的读取器。它可能会根据文件扩展名和文件开头的“魔数”来实现目的。\n\
  \n将图像写入文件同样简单：\n\n```java\nFile f = ...;\nString format = ...;\nImageIO.write(image,\
  \ format, f);\n```\n\n这里的 `format` 字符串是标识图像格式的字符串，例如 `\"JPEG\"` 或 `\"PNG\"`。`ImageIO`\
  \ 类选择合适的写入器并保存文件。\n\n\n\n\n`getImageReadersBySuffix` 和 `getImageReadersByMIMEType`\
  \ 方法会列出匹配文件扩展名或 MIME 类型的读取器。\n\n`ImageIO` 类可能会找到多个都能读取特定图像类型的读取器。在这种情况下，你必须从中选择一个，但并不清楚该如何判断哪一个是最好的。要获取更多关于读取器的详细信息，可以获取其服务提供者接口（SPI）：\n\
  \n```\nImageReaderSpi spi = reader.getOriginatingProvider();\n```\n\n然后你就可以获取厂商名称和版本号：\n\
  \n```\nString vendor = spi.getVendor();\nString version = spi.getVersion();\n```\n\
  \n这些信息可能可以帮助你在多个选项中做出决定——或者你也可以直接向程序用户展示读取器列表并让他们自行选择。目前，我们假设第一个列出的读取器就足够了。\n\n\
  在 Listing 12.20 示例程序中，我们想要找到所有可用读取器的文件后缀名，以便将它们用于文件过滤器。使用静态方法 `ImageIO.getReaderFileSuffixes`\
  \ 来实现此目的：\n\n```\nString[] extensions = ImageIO.getWriterFileSuffixes();\nchooser.setFileFilter(new\
  \ FileNameExtensionFilter(\"Image files\", extensions));\n```\n\n对于保存文件，我们需要更大的努力。我们希望向用户展示一个包含所有支持图像类型的菜单。遗憾的是，`ImageIO`\
  \ 类的 `getWriterFormatNames` 返回的是一个相当奇怪的包含冗余名称列表，例如\n\n```\njpg, BMP, bmp, JPG, jpeg,\
  \ wbmp, png, JPEG, PNG, WBMP, GIF, gif\n```\n\n这并不是人们想要在菜单中展示的内容。我们需要的是一个“首选”格式名称列表。我们为此此目的提供了一个辅助方法\
  \ `getWriterFormats`（参见 Listing 12.20）。我们查找与每个格式名称关联的第一个写入器。然后询问它它的格式名称是什么，希望它能将最流行的格式列在最前面。事实上，对于\
  \ JPEG 写入器，这种方法运行良好——它在其他选项之前列出了 `\"JPEG\"`。（另一方面，PNG 写入器在 `\"PNG\"` 之前列出了小写的 `\"\
  png\"`。我们希望这种行为在未来的某个时候能得到解决。目前，我们强制将所有小写名称转换为大写。）一旦我们选择了一个首选名称，就会从原始集合中删除所有替代名称。持续进行直到所有格式名称都处理完毕。\n\
  \n### 使用多图像读取和写入文件\n\n某些文件——特别是动画 GIF 文件——包含多个图像。`ImageIO` 类的 `read` 方法读取单个图像。要读取多个图像，请将输入源（例如输入流或文件）转换为\
  \ `ImageInputStream`。\n\n```\nInputStream in = . . .;\nImageInputStream imageIn\
  \ = ImageIO.createImageInputStream(in);\n```\n\n然后，将图像输入流绑定到读取器：\n\n```\nreader.setInput(imageIn,\
  \ true);\n```\n\n第二个参数表示输入处于“仅向前向寻”模式。否则，将使用随机访问，通过在读取时对流输入进行缓冲或使用随机文件访问来实现。某些操作需要随机访问。例如，要查找\
  \ GIF 文件中的图像数量，你需要读取整个文件。如果你随后想获取图像，必须再次读取输入。\n\n这种考虑仅在你从流中读取、输入包含多个图像，且图像格式在头信息中没有包含你请求的信息（如图像计数）时才重要。如果你从文件读取，只需使用\n\
  \n```\nFile f = . . .;\nImageInputStream imageIn = ImageIO.createImageInputStream(f);\n\
  reader.setInput(imageIn);\n```\n\n一旦有了读取器，你就可以通过调用来读取输入中的图像：\n\n```\nBufferedImage\
  \ image = reader.read(index);\n```\n\n其中 `index` 是图像索引，从 0 开始。\n\n如果输入处于“仅向前向寻”模式，你继续读取图像，直到\
  \ `read` 方法抛出 `IndexOutOfBoundsException`。否则，你可以调用 `getNumImages` 方法：\n\n```\nint\
  \ n = reader.getNumImages(true);\n```\n\n在这里，参数表示你允许通过搜索输入来确定图像数量。如果输入处于“仅向前向寻”模式，该方法将抛出\
  \ `IllegalStateException`。或者，你可以将“允许搜索”参数设置为 `false`。那么如果无法在不搜索的情况下确定图像数量，`getNumImages`\
  \ 方法将返回 `-1`。在这种情况下，你必须切换到 B 计划并继续读取图像直到获得 `IndexOutOfBoundsException`。\n\n某些文件包含缩略图——用于预览的图像较小版本。你可以通过以下调用获取图像的缩略图数量：\n\
  \n```\nint count = reader.getNumThumbnails(index);\n```\n\n然后获取特定索引：\n\n```\nBufferedImage\
  \ thumbnail = reader.getThumbnail(index, thumbnailIndex);\n```\n\n有时你可能想在实际获取图像之前先获取图像尺寸——特别是当图像巨大或来自缓慢的网络连接时。使用以下调用：\n\
  \n```\nint width = reader.getWidth(index);\nint height = reader.getHeight(index);\n\
  ```\n\n来获取给定索引图像的尺寸。\n\n要写入包含多个图像的文件，首先需要一个 `ImageWriter`。`ImageIO` 类可以列出能够写入特定图像格式的写入器：\n\
  \n```\nString format = . . .;\nImageWriter writer = null;\nIterator<ImageWriter>\
  \ iter = ImageIO.getImageWritersByFormatName(format);\nif (iter.hasNext()) writer\
  \ = iter.next();\n```\n\n接下来，将输出流或文件转换为 `ImageOutputStream` 并将其绑定到写入器。例如：\n\n```\n\
  File f = . . .;\nImageOutputStream imageOut = ImageIO.createImageOutputStream(f);\n\
  writer.setOutput(imageOut);\n```\n\n你必须将每个图像封装成 `IIOImage` 对象。你可以可选地提供缩略图列表和图像元数据（如压缩算法和颜色信息）。在示例中，我们对两者都使用\
  \ `null`；更多信息请参见 API 文档。\n\n```\nvar iioImage = new IIOImage(images[i], null, null);\n\
  ```\n\n写入*第一*张图像使用 `write` 方法：\n\n```\nwriter.write(new IIOImage(images[0], null,\
  \ null));\n```\n\n对于后续图像，使用：\n\n```\nif (writer.canInsertImage(i))\n   writer.writeInsert(i,\
  \ iioImage, null);\n```\n\n第三个参数可以包含 `ImageWriteParam` 对象以设置图像写入细节，如分块和压缩；使用 `null`\
  \ 默认值。\n\n并不是所有文件格式都能处理多图像。在这种情况下，对于 `i > 0`，`canInsertImage` 方法返回 `false`，且只保存单个图像。\n\
  \nListing 12.20 程序允许你加载和保存 Java 库提供读取器和写入器的格式的文件。该程序显示了多个图像（参见 Figure 12.55），但没有显示缩略图。\n\
