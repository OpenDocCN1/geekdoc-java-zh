  )));\n      labelTable.put(80, new JLabel(new ImageIcon(\"king.gif\")));\n     \
  \ labelTable.put(100, new JLabel(new ImageIcon(\"ace.gif\")));\n\n      slider.setLabelTable(labelTable);\n\
  \      addSlider(slider, \"Icon labels\");\n\n      // 添加显示滑块值的文本字段\n\n      textField\
  \ = new JTextField();\n      add(sliderPanel, BorderLayout.CENTER);\n      add(textField,\
  \ BorderLayout.SOUTH);\n      pack();\n   }\n\n   /**\n    * 将滑块添加到滑块面板并关联监听器。\n\
  \    * @param slider 滑块\n    * @param description 滑块描述\n    */\n   public void addSlider(JSlider\
  \ slider, String description)\n   {\n      slider.addChangeListener(listener);\n\
  \      var panel = new JPanel();\n      panel.add(slider);\n      panel.add(new\
  \ JLabel(description));\n      panel.setAlignmentX(Component.LEFT_ALIGNMENT);\n\
  \      var gbc = new GridBagConstraints();\n      gbc.gridy = sliderPanel.getComponentCount();\n\
  \      gbc.anchor = GridBagConstraints.WEST;\n      sliderPanel.add(panel, gbc);\n\
  \   }\n}\n```\n\n`javax.swing.JSlider` 1.2\n\n- `JSlider()`\n- `JSlider(int direction)`\n\
  - `JSlider(int min, int max)`\n- `JSlider(int min, int max, int initialValue)`\n\
  - `JSlider(int direction, int min, int max, int initialValue)`\n\n使用给定方向创建一个滑块并\n\
  \n- `void setPaintTicks(boolean b)`\n- `void setMajorTickSpacing(int spacing)`\n\
  - `void setMinorTickSpacing(int)`\n- `void setSnapToTicks(boolean b)`\n- `void setInverted(boolean\
  \ b)`\n- `void setPaintTrack(boolean b)`\n- `void setPaintLabels(boolean b)`\n-\
  \ `void setLabelTable(Hashtable table)`\n\n## 菜单\n\n本章首先介绍了你可能想要放入窗口的常用组件，例如按钮、文本字段和组合框。Swing\
  \ 同时也支持另一种用户界面类型——在应用程序中常见的下拉菜单。窗口顶部的*菜单栏*包含下拉菜单名称。点击名称会打开*菜单项*和*子菜单*。图 11.17 显示了带有子菜单的典型菜单。\n\
  \n### 构建菜单\n\n构建非常简单。首先，创建一个菜单栏：\n\n```javavar menuBar = new JMenuBar();\n```\n\n\
  菜单栏只是一个组件，你可以将其添加到任何地方。通常，你希望它出现在框架的顶部。你可以使用 `setJMenuBar` 方法将其添加到那里：\n\n```\nframe.setJMenuBar(menuBar);\n\
  ```\n\n对于每个菜单，你创建一个菜单对象：\n\n```java\nvar editMenu = new JMenu(\"编辑\");\n```\n\n\
  将顶层菜单添加到菜单栏中：\n\n```\nmenuBar.add(editMenu);\n```\n\n将菜单项、分隔符和子菜单添加到菜单对象中：\n\n```java\n\
  var pasteItem = new JMenuItem(\"粘贴\");\neditMenu.add(pasteItem);\neditMenu.addSeparator();\n\
  JMenu optionsMenu = . . // 子菜单\neditMenu.add(optionsMenu);\n```\n\n当用户选择菜单项时，会触发动作事件。你需要为每个菜单项安装动作监听器：\n\
  \n```\nActionListener listener = . . .;\npasteItem.addActionListener(listener);\n\
  ```\n\n`JMenu.add(String s)` 方法方便地将菜单项添加到菜单的末尾。例如：\n\n```\neditMenu.add(\"粘贴\");\n\
  ```\n\n`add` 方法返回创建的菜单项，因此你可以捕获它并添加监听器，如下：\n\n```java\nJMenuItem pasteItem = editMenu.add(\"\
  粘贴\");\npasteItem.addActionListener(listener);\n```\n\n\n\n菜单项经常会触发命令，这些命令也可以通过其他用户界面元素（如工具栏按钮）激活。在第\
  \ 10 章中，你已经看到了如何通过 `Action` 对象指定命令。你定义一个实现 `Action` 接口的类（通常通过扩展 `AbstractAction`\
  \ 方便类），在 `AbstractAction` 对象的构造函数中指定菜单项标签，并重写 `actionPerformed` 方法以包含菜单动作处理器。例如：\n\
  \n```\nvar exitAction = new AbstractAction(\"Exit\") // 菜单项文本在此处\n   {\n      public\
  \ void actionPerformed(ActionEvent event)\n      {\n         // 动作代码在此\n       \
  \  System.exit(0);\n      }\n   };\n```\n\n然后，你可以将该动作添加到菜单中：\n\n```\nJMenuItem exitItem\
  \ = fileMenu.add(exitAction);\n```\n\n此命令使用动作名称向菜单中添加一个菜单项。该动作对象成为它的监听器。这仅仅是以下代码的方便快捷方式：\n\
  \n```\nvar exitItem = new JMenuItem(exitAction);\nfileMenu.add(exitItem);\n```\n\
  \n### `javax.swing.JMenu` 1.2\n\n*   `JMenu(String label)`\n    使用给定的标签构造菜单。\n*\
  \   `JMenuItem add(JMenuItem item)`\n    添加一个菜单项（或菜单）。\n*   `JMenuItem add(String\
  \ label)`\n    向此菜单添加一个带有给定标签的菜单项，并返回该项。\n*   `JMenuItem add(Action a)`\n    向此菜单添加一个带有给定动作的菜单项，并返回该项。\n\
  *   `void addSeparator()`\n    向菜单添加一条分隔线。\n*   `JMenuItem insert(JMenuItem menu,\
  \ int index)`\n    在特定索引处向菜单添加一个新菜单项（或子菜单）。\n*   `JMenuItem insert(Action a, int\
  \ index)`\n    在特定索引处添加一个带有给定动作的新菜单项。\n*   `void insertSeparator(int index)`\n \
  \   在菜单中添加一个分隔符。\n*   `void remove(int index)`\n*   `void remove(JMenuItem item)`\n\
  \    从菜单中移除特定项。\n\n### `javax.swing.JMenuItem` 1.2\n\n*   `JMenuItem(String label)`\n\
  \    使用给定的标签构造菜单项。\n*   `JMenuItem(Action a)` 1.3\n    为给定动作构造菜单项。\n\n### `javax.swing.AbstractButton`\
  \ 1.2\n\n*   `void setAction(Action a)` 1.3\n    设置此按钮或菜单项的动作。\n\n### `javax.swing.JFrame`\
  \ 1.2\n\n*   `void setJMenuBar(JMenuBar menubar)`\n    为此框架设置菜单栏。\n\n### 菜单项中的图标\n\
  \n菜单项与按钮非常相似。事实上，`JMenuItem` 类扩展了 `AbstractButton` 类。就像按钮一样，菜单可以只有文本标签、只有图标，或者二者兼有。你可以通过\
  \ `JMenuItem(String, Icon)` 或 `JMenuItem(Icon)` 构造函数指定图标，也可以通过 `JMenuItem` 类继承自\
  \ `AbstractButton` 类的 `setIcon` 方法来设置它。这里有一个示例：\n\n```\nvar cutItem = new JMenuItem(\"\
  Cut\", new ImageIcon(\"cut.gif\"));\n```\n\n在图 11.17 中，你可以看到几个菜单项旁边的图标。默认情况下，菜单项文本放置在图标的右侧。如果你希望文本放置在左侧，请调用\
  \ `JMenuItem` 类继承自 `AbstractButton` 类的 `setHorizontalTextPosition` 方法。例如，调用\n\n\
  ```\ncutItem.setHorizontalTextPosition(SwingConstants.LEFT);\n```\n\n会将菜单项文本移动到图标的左侧。\n\
  \n你也可以为动作添加图标：\n\n```\ncutAction.putValue(Action.SMALL_ICON, new ImageIcon(\"cut.gif\"\
  ));\n```\n\n每当你从动作构造菜单项时，`Action.NAME` 值将成为菜单项的文本，而 `Action.SMALL_ICON` 值将成为图标。\n\
  \n或者，你可以在 `AbstractAction` 构造函数中设置图标：\n\n```\ncutAction = new\n   AbstractAction(\"\
  Cut\", new ImageIcon(\"cut.gif\"))\n      {\n         public void actionPerformed(ActionEvent\
  \ event)\n         {\n            . . .\n         }\n      };\n```\n\n### `javax.swing.JMenuItem`\
  \ 1.2\n\n*   `JMenuItem(String label, Icon icon)`\n    使用给定的标签和图标构造菜单项。\n\n### `javax.swing.AbstractButton`\
  \ 1.2\n\n*   `void setHorizontalTextPosition(int pos)`\n    设置文本相对于图标的水平位置。`pos`\
  \ 参数可以是 `SwingConstants.RIGHT`（文本在图标右侧）或 `SwingConstants.LEFT`。\n\n### `javax.swing.AbstractAction`\
  \ 1.2\n\n*   `AbstractAction(String name, Icon smallIcon)`\n    使用给定的名称和图标构造抽象动作。\n\
  \n### 复选框和单选按钮菜单项\n\n复选框和单选按钮菜单项会在名称旁边显示复选框或单选按钮（参见图 11.17）。当用户选择菜单项时，该项会在选中和未选中之间切换。\n\
  \n除了按钮装饰外，像处理其他项一样处理这些菜单项。例如，这里是创建一个复选框菜单项的方法：\n\n```\nvar readonlyItem = new JCheckBoxMenuItem(\"\
  Read-only\");\n```\n\n单选按钮菜单项的工作方式就像单选按钮。你必须将它们添加到按钮组中。当组中的一个按钮被选中时，其他按钮会自动取消选中。\n\
  \n```\nvar group = new ButtonGroup();\nvar insertItem = JRadioButtonMenuItem(\"\
  Insert\");\ninsertItem.setSelected(true);\nvar overtypeItem = JRadioButtonMenuItem(\"\
  Overtype\");\ngroup.add(insertItem);\ngroup.add(overtypeItem);\n```\n\n对于这些菜单项，你不一定希望在用户选择项时收到通知。相反，你只需使用\
  \ `isSelected` 方法测试项的状态。（当然，你应该将项的引用存储在实例中。）使用 `setSelected` 方法设置状态。\n\n### `javax.swing.JCheckBoxMenuItem`\
  \ 1.2\n\n*   `JCheckBoxMenuItem(String label)`\n    使用给定的标签构造复选框项。\n*   `JCheckBoxMenuItem(String\
  \ label, boolean state)`\n    使用给定的标签和初始状态构造复选框项（`true` 为选中）。\n\n### `javax.swing.JRadioButtonMenuItem`\
  \ 1.2\n\n*   `JRadioButtonMenuItem(String label)`\n    使用给定的标签构造单选按钮菜单项。\n*   `JRadioButtonMenuItem(String\
  \ label, boolean state)`\n    使用给定的标签和初始状态构造单选按钮菜单项（`true` 为选中）。\n\n### `javax.swing.AbstractButton`\
  \ 1.2\n\n*   `boolean isSelected()`\n*   `void setSelected(boolean state)`\n   \
  \ 获取或设置此项的状态（`true` 为选中）。\n\n### 弹出菜单\n\n弹出菜单是不附加到菜单栏而是悬浮在某处的菜单（参见图 11.18）。\n\n\
  ![图](img/menu3.jpg)弹出菜单\n\n像创建普通菜单一样创建弹出菜单，只是弹出菜单没有标题。\n\n```\nvar popup = new JPopupMenu();\n\
  ```\n\n然后，像往常添加你的菜单项：\n\n```\nvar item = new JMenuItem(\"Cut\");\nitem.addActionListener(listener);\n\
  popup.add(item);\n```\n\n与始终位于框架顶部的菜单栏不同，你必须通过 `show` 方法显式显示弹出菜单。指定父组件和字体的位置，使用父组件的坐标系。例如：\n\
  \n```\npopup.show(panel, x, y);\n```\n\n通常，你希望在用户点击特定的鼠标按钮——即所谓的弹出触发时弹出菜单。在 Windows\
  \ 和 Linux 上，弹出触发是非主按钮（通常是右键）。要当用户点击组件时弹出菜单，并使用弹出触发，只需调用方法\n\n```\ncomponent.setComponentPopupMenu(popup);\n\
  ```\n\n在极少数情况下，你可能会将一个组件放在另一个具有弹出菜单的组件内部。子组件可以通过调用以下方法继承父组件的弹出菜单：\n\n```\nchild.setInheritsPopupMenu(true);\n\
  ```\n\n\n\n在组件 `c` 之上显示弹出菜单，其左上角位于 `(x, y)`（在 `c` 的坐标系中）。\n\n*   `boolean isPopupTrigger(MouseEvent\
  \ event)` 1.3\n    如果鼠标事件是弹出菜单的触发器，则返回 `true`。\n\n`java.awt.event.MouseEvent` 1.1\n\
  *   `boolean isPopupTrigger()`\n    如果此鼠标事件是弹出菜单的触发器，则返回 `true`。\n\n`javax.swing.JComponent`\
  \ 1.2\n*   `JPopupMenu getComponentPopupMenu()` 5.0\n*   `void setComponentPopupMenu(JPopupMenu\
  \ popup)` 5.0\n    获取或设置此组件的弹出菜单。\n*   `boolean getInheritsPopupMenu()` 5.0\n* \
  \  `void setInheritsPopupMenu(boolean b)` 5.0\n    获取或设置 `inheritsPopupMenu` 属性。如果该属性被设置且此组件的弹出菜单为\
  \ `null`，它将使用父组件的弹出菜单。\n\n### 键盘助记和加速键\n\n对于经验丰富的用户来说，通过键盘助记符选择菜单项是非常方便的。你可以通过在菜单项构造函数中指定一个助记字母来为菜单项创建键盘助记：\n\
  \n```java\nvar aboutItem = new JMenuItem(\"About\", 'A');\n```\n\n键盘助记会自动显示在菜单中，且助记字母会带有下划线（参见图\
  \ 11.19）。例如，在在上一个示例定义的项中，标签将显示为“ About”，其中字母‘A’ 带有下划线。当菜单显示时，用户只需按下 A 键即可选中该菜单项。（如果助记字母不是菜单字符串的一部分，输入该字母仍然可以选中该项，但助记符不会显示在菜单中。自然地，这种不可见的助记符用处存疑。）\n\
  \n![Figure](img/menu4.jpg)键盘助记\n\n有时，你并不希望为与助记符匹配的菜单项的第一个字母加上下划线。例如，如果你为“另存为”（Save\
  \ As）菜单项设置了助记符“A”，那么下划第二个“A”（Save As）会更有意义。你可以通过调用 `setDisplayedMnemonicIndex` 方法来指定你想要加下划线的字符。\n\
  \n如果你有一个 `Action` 对象，可以将助记符作为 `Action.MNEMONIC_KEY` 键的值添加，如下：\n\n```java\naboutAction.putValue(Action.MNEMONIC_KEY,\
  \ Integer.valueOf('A'));\n```\n\n你只能在菜单项的构造函数中提供助记字母，而不能放在菜单的构造函数中提供。要为菜单附加助记，请调用\
  \ `setMnemonic` 方法：\n\n```java\nvar helpMenu = new JMenu(\"Help\");\nhelpMenu.setMnemonic('H');\n\
  ```\n\n要从菜单栏中选择顶级菜单，请按下 Alt 键配合助记字母。例如，按下 Alt+H 从菜单栏中选择帮助菜单。\n\n键盘助记允许你从当前打开的菜单中选择子菜单或菜单项。相比之下，加速键是键盘快捷键，让你无需打开菜单即可选择菜单项。例如，许多程序将加速键\
  \ Ctrl+O 和 Ctrl+S 绑定到文件菜单中的“打开”和“保存”项。使用 `setAccelerator` 方法为菜单项附加加速键。`setAccelerator`\
  \ 方法接收一个 `Keystroke` 类型的对象。例如，以下调用将加速键 Ctrl+O 绑定到 `openItem` 菜单项：\n\n```java\nopenItem.setAccelerator(KeyStroke.getKeyStroke(\"\
  ctrl O\"));\n```\n\n输入加速键组合会自动选中菜单选项并触发动作事件，就像用户手动选择了该菜单选项一样。\n\n你只能将加速键附加到菜单项，而不能附加到菜单。加速键实际上不会打开菜单。相反，它们会直接触发与菜单关联动作事件。\n\
  \n从概念上讲，向菜单项添加加速键与向 Swing 组件添加加速键的技术相似。然而，当加速键被添加到菜单项时，该按键组合会自动显示在菜单中（参见图 11.20）。\n\
  \n![Figure](img/menu5.jpg)加速键\n\n在 Windows 下，Alt+F4 会关闭窗口。但这不是一个要在 Java 中编写的加速键。它是操作系统定义的快捷键。无论菜单上是否有“关闭”项，此按键组合始终会触发活动窗口的\
  \ `WindowClosing` 事件。\n\n`javax.swing.JMenuItem` 1.2\n*   `JMenuItem(String label,\
  \ int mnemonic)`\n    使用给定的标签和助记符构造菜单项。\n*   `void setAccelerator(KeyStroke k)`\n\
  \    将击键 `k` 设置为此菜单项的加速键。加速键将显示在标签旁边。\n\n`javax.swing.AbstractButton` 1.2\n*   `void\
  \ setMnemonic(int mnemonic)`\n    为按钮设置助记字符。该字符在标签中将带有下划线。\n*   `void setDisplayedMnemonicIndex(int\
  \ index)` 1.4\n    设置按钮文本中要加下划线的字符的索引。如果你不希望助记字符的第一次出现处带有下划线，则请使用此方法。\n\n### 启用和禁用菜单项\n\
  \n有时，特定的菜单项应该只在特定的上下文中被选中。\n\n要启用或禁用菜单项，请使用 `setEnabled` 方法：\n\n```java\nsaveItem.setEnabled(false);\n\
  ```\n\n启用和禁用菜单项有两种策略。每当情况变化时，你都可以对菜单项调用 `setEnabled`。例如，一旦文档被设置为只读模式，你可以找到保存和另存为项并禁用它们。或者，你可以在显示菜单之前禁用项。为了实现，你必须为“菜单选中”事件注册监听器。`javax.swing.event`\
  \ 包定义了 `MenuListener` 接口，包含三个方法：\n\n```java\nvoid menuSelected(MenuEvent event)\n\
  void menuDeselected(MenuEvent event)\nvoid menuCanceled(MenuEvent event)\n```\n\n\
  `menuSelected` 方法在菜单显示*之前*调用。因此它可以用于禁用或启用项。以下代码显示了如何在选择只读复选框菜单项时禁用保存和另存为动作：\n\n\
  ```java\npublic void menuSelected(MenuEvent event)\n{\n   saveAction.setEnabled(!readonlyItem.isSelected());\n\
  \   saveAsAction.setEnabled(!readonlyItem.isSelected());\n}\n```\n\n在显示菜单之前禁用项是一个聪明的想法，但对于也带有加速键的菜单项无效。因为按下加速键时不会打开菜单，所以动作不会被禁用，仍然可以通过加速键触发。\n\
  \n`javax.swing.JMenuItem` 1.2\n*   `void setEnabled(boolean b)`\n    启用或禁用菜单项。\n\
  \n`javax.swing.event.MenuListener` 1.2\n*   `void menuSelected(MenuEvent e)`\n \
  \   在菜单被选中、在打开之前调用。\n*   `void menuDeselected(MenuEvent e)`\n    在菜单被取消选择、在关闭之后调用。\n\
  *   `void menuCanceled(MenuEvent e)`\n    在菜单被取消时调用，例如通过用户点击菜单外部。\n\n列表 11.6 是一个生成一组菜单的示例程序。它展示了在本节中看到的所有功能：嵌套菜单、禁用的菜单项、复选框和单选按钮菜单项、弹出菜单以及键盘助记和加速键。\n\
  \n```java\nmenu/MenuFrame.java\n```\n\n\n\n\n```java\npackage menu;\n\nimport java.awt.event.*;\n\
  import javax.swing.*;\n\n/**\n * 一个带有示例菜单栏的框架。\n */\npublic class MenuFrame extends\
  \ JFrame\n{\n   private static final int DEFAULT_WIDTH = 300;\n   private static\
  \ final int DEFAULT_HEIGHT = 200;\n   private Action saveAction;\n   private Action\
  \ saveAsAction;\n   private JCheckBoxMenuItem readonlyItem;\n\n   /**\n    * 一个将\
  \ action 名称打印到 System.out 的示例 action。\n    */\n   class TestAction extends AbstractAction\n\
  \   {\n      public TestAction(String name)\n      {\n         super(name);\n  \
  \    }\n\n      public void actionPerformed(ActionEvent event)\n      {\n      \
  \   System.out.println(getValue(Action.NAME) + \" selected.\");\n      }\n   }\n\
  \n   public MenuFrame()\n   {\n      setSize(DEFAULT_WIDTH, DEFAULT_HEIGHT);\n\n\
  \      var fileMenu = new JMenu(\"File\");\n      fileMenu.add(new TestAction(\"\
  New\"));\n\n      // 演示加速键\n\n      var openItem = fileMenu.add(new TestAction(\"\
