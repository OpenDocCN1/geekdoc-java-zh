  ## 自定义布局管理器\n\n你可以设计自己的 `LayoutManager` 类来以特殊方式管理组件。作为一个有趣的示例，让我们安排容器中的组件形成一个圆（见图\
  \ 11.29）。\n\n![Figure](img/circlelayouttest.jpg)圆形布局\n\n你的布局管理器必须实现 `LayoutManager`\
  \ 接口。你需要重写以下方法：\n\n```\nvoid addLayoutComponent(String s, Component c)\nvoid removeLayoutComponent(Component\
  \ c)\nDimension preferredLayoutSize(Container parent)\nDimension minimumLayoutSize(Container\
  \ parent)\nvoid layoutContainer(Container parent)\n```\n\n两个方法在组件添加或删除时调用。如果你不保留组件的任何额外信息，可以让它们什么都不做。后两个方法计算布局所需的空间。这些空间通常是相同的。第五个方法执行实际工作并对所有组件调用\
  \ `setBounds`。\n\nAWT 还有另一个接口称为 `LayoutManager2`，需要实现十个方法而不是五个。`LayoutManager2`\
  \ 接口的主要点是允许使用带约束的 `add` 方法。例如，`BorderLayout` 和 `GridBagLayout` 都实现了 `LayoutManager2`\
  \ 接口。\n\n列表 11.9 显示了 `CircleLayout` 管理器的代码，该管理器（尽管这没什么用处）在父容器内沿圆周摆放组件。示例程序的框架类位于列表\
  \ 11.10 中。\n\ncircleLayout/CircleLayout.java\n\n\n\n\n\n```java\npackage circleLayout;\n\
  \nimport java.awt.*;\n\n/**\n * 一种沿圆周布局组件的布局管理器。\n */\npublic class CircleLayout\
  \ implements LayoutManager\n{\n   private int minWidth = 0;\n   private int minHeight\
  \ = 0;\n   private int preferredWidth = 0;\n   private int preferredHeight = 0;\n\
  \   private boolean sizesSet = false;\n   private int maxComponentWidth = 0;\n \
  \  private int maxComponentHeight = 0;\n\n   public void addLayoutComponent(String\
  \ name, Component comp)\n   {\n   }\n\n   public void removeLayoutComponent(Component\
  \ comp)\n   {\n   }\n\n   public void setSizes(Container parent)\n   {\n      if\
  \ (sizesSet) return;\n      int n = parent.getComponentCount();\n\n      preferredWidth\
  \ = 0;\n      preferredHeight = 0;\n      minWidth = 0;\n      minHeight = 0;\n\
  \      maxComponentWidth = 0;\n      maxComponentHeight = 0;\n\n      // 计算组件的最大宽度和高度\n\
  \      //并将首选尺寸设置为所有组件尺寸之和\n      for (int i = 0; i < n; i++)\n      {\n       \
  \  Component c = parent.getComponent(i);\n         if (c.isVisible())\n        \
  \ {\n            Dimension d = c.getPreferredSize();\n            maxComponentWidth\
  \ = Math.max(maxComponentWidth, d.width);\n            maxComponentHeight = Math.max(maxComponentHeight,\
  \ d.height);\n            preferredWidth += d.width;\n            preferredHeight\
  \ += d.height;\n         }\n      }\n      minWidth = preferredWidth / 2;\n    \
  \  minHeight = preferredHeight / 2;\n      sizesSet = true;\n   }\n\n   public Dimension\
  \ preferredLayoutSize(Container parent)\n   {\n      setSizes(parent);\n      Insets\
  \ insets = parent.getInsets();\n      int width = preferredWidth + insets.left +\
  \ insets.right;\n      int height = preferredHeight + insets.top + insets.bottom;\n\
  \      return new Dimension(width, height);\n   }\n\n   public Dimension minimumLayoutSize(Container\
  \ parent)\n   {\n      setSizes(parent);\n      Insets insets = parent.getInsets();\n\
  \      int width = minWidth + insets.left + insets.right;\n      int height = minHeight\
  \ + insets.top + insets.bottom;\n      return new Dimension(width, height);\n  \
  \ }\n\n   public void layoutContainer(Container parent)\n   {\n      setSizes(parent);\n\
  \n      // 计算圆的中心\n\n      Insets insets = parent.getInsets();\n      int containerWidth\
  \ = parent.getSize().width - insets.left - insets.right;\n      int containerHeight\
  \ = parent.getSize().height - insets.top - insets.bottom;\n\n      int xcenter =\
  \ insets.left + containerWidth / 2;\n      int ycenter = insets.top + containerHeight\
  \ / 2;\n\n      // 计算圆的半径\n\n      int xradius = (containerWidth - maxComponentWidth)\
  \ / 2;\n      int yradius = (containerHeight - maxComponentHeight) / 2;\n      int\
  \ radius = Math.min(xradius, yradius);\n\n      // 沿圆周布局组件\n\n      int n = parent.getComponentCount();\n\
  \      for (int i = 0; i < n; i++)\n      {\n         Component c = parent.getComponent(i);\n\
  \         if (c.isVisible())\n         {\n            double angle = 2 * Math.PI\
  \ * i / n;\n\n            // 组件的中心点\n            int x = xcenter + (int) (Math.cos(angle)\
  \ * radius);\n            int y = ycenter + (int) (Math.sin(angle) * radius);\n\n\
  \            // 移动组件使其中心位于 (x, y)\n            // 尺寸为为首选尺寸\n            Dimension\
  \ d = c.getPreferredSize();\n            c.setBounds(x - d.width / 2, y - d.height\
  \ / 2, d.width, d.height);\n         }\n      }\n   }\n}\n```\n\n`circleLayout/CircleLayoutFrame.java`\n\
