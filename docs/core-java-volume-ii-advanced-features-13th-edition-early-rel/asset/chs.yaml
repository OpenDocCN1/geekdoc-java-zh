  \ 和 `MouseMotionHandler`。`MouseHandler` 类继承了 `MouseAdapter` 类，因为它只定义了五个 `MouseListener`\
  \ 方法中的两个。（`MouseAdapter` 类将所有五个方法都定义为什么都不做的空方法。）`MouseMotionHandler` 实现了 `MouseMotionListener`\
  \ 并定义了该接口的两个方法。列表 10.7 是该程序的代码列表。\n\n`mouse/MouseComponent.java`\n\n```java\npackage\
  \ mouse;\n\nimport java.awt.*;\nimport java.awt.event.*;\nimport java.awt.geom.*;\n\
  import java.util.*;\nimport javax.swing.*;\n\n/**\n * 一个具有添加和删除正方形鼠标操作的组件。\n */\n\
  public class MouseComponent extends JComponent\n{\n   private static final int DEFAULT_WIDTH\
  \ = 300;\n   private static final int DEFAULT_HEIGHT = 200;\n\n   private static\
  \ final int SIDELENGTH = 10;\n   private ArrayList<Rectangle2D> squares;\n   private\
  \ Rectangle2D current; // 包含鼠标光标的正方形\n\n   public MouseComponent()\n   {\n     \
  \ squares = new ArrayList<>();\n      current = null;\n\n      addMouseListener(new\
  \ MouseHandler());\n      addMouseMotionListener(new MouseMotionHandler());\n  \
  \ }\n\n   public Dimension getPreferredSize() \n   {\n      return new Dimension(DEFAULT_WIDTH,\
  \ DEFAULT_HEIGHT);\n   }   \n\n   public void paintComponent(Graphics g)\n   {\n\
  \      var g2 = (Graphics2D) g;\n\n      // 画所有正方形\n      for (Rectangle2D r : squares)\n\
  \         g2.draw(r);\n   }\n\n   /**\n    * 包含点的第一个正方形。\n    * @param p 一个点\n \
  \    * @return 包含 p 的第一个正方形\n     */\n   public Rectangle2D find(Point2D p)\n  \
  \ {\n      for (Rectangle2D r : squares)\n      {\n         if (r.contains(p)) return\
  \ r;\n      }\n      return null;\n   }\n\n   /**\n    * 将正方形添加到集合中。\n     * @param\
  \ p 正方形的中心\n     */\n   public void add(Point2D p)\n   {\n      double x = p.getX();\n\
  \      double y = p.getY();\n\n      current = new Rectangle2D.Double(x - SIDELENGTH\
  \ / 2, y - SIDELENGTH / 2,\n         SIDELENGTH, SIDELENGTH);\n      squares.add(current);\n\
  \      repaint();\n   }\n\n   /**\n    * 从集合中移除正方形。\n     * @param s 要移除的正方形\n \
  \    */\n   public void remove(Rectangle2D s)\n   {\n      if (s == null) return;\n\
  \      if (s == current) current = null;\n      squares.remove(s);\n      repaint();\n\
  \   }\n\n   private class MouseHandler extends MouseAdapter\n   {\n      public\
  \ void mousePressed(MouseEvent event)\n      {\n         // 如果光标不在任何正方形内，则添加一个新正方形\n\
  \         current = find(event.getPoint());\n         if (current == null) add(event.getPoint());\n\
  \      }\n\n      public void mouseClicked(MouseEvent event)\n      {\n        \
  \ // 如果双击，则移除当前正方形\n         current = find(event.getPoint());\n         if (current\
  \ != null && event.getClickCount() >= 2) remove(current);\n      }\n   }\n\n   private\
  \ class MouseMotionHandler implements MouseMotionListener\n   {\n      public void\
  \ mouseMoved(MouseEvent event)\n      {\n         // 如果鼠标在矩形内，则将光标设置为十字准\n\n   \
  \      if (find(event.getPoint()) == null) setCursor(Cursor.getDefaultCursor());\n\
  \         else setCursor(Cursor.getPredefinedCursor(Cursor.CROSSHAIR_CURSOR));\n\
  \      }\n\n      public void mouseDragged(MouseEvent event)\n      {\n        \
  \ if (current != null)\n         {\n            int x = event.getX();\n        \
  \    int y = event.getY();\n\n            // 拖动当前矩形使其中心对齐到 (x, y)\n            current.setFrame(x\
  \ - SIDELENGTH / 2, y - SIDELENGTH / 2, SIDELENGTH, SIDELENGTH);\n            repaint();\n\
  \         }\n      }\n   }   \n}\n```\n\n`java.awt.event.MouseEvent` 1.1\n\n* `int\
  \ getX()`\n* `int getY()`\n* `Point getPoint()`\n  返回事件发生点的 `x`（水平）和 `y`（垂直）坐标，该坐标是从事件源组件的左上角测量的。\n\
  * `int getClickCount()`\n  返回与此事件关联的连续鼠标点击次数。（构成“连续”的时间间隔取决于系统。）\n\n`java.awt.Component`\
  \ 1.0\n\n* `public void setCursor(Cursor cursor)` 1.1\n  将光标图像设置为指定的光标。\n\n### AWT\
  \ 事件层级结构\n\n`EventObject` 类有一个子类 `AWTEvent`，它是所有 AWT 事件类的父类。图 10.17 显示了 AWT 事件的继承图。\n\
  \n![Figure](img/08_08.jpg)\nAWT 事件类的继承图\n\n部分 AWT 事件类...（注意：所提供的文本包含一些重复/乱码的句子，但保持了关于层次结构的核心结构）。\n\
  \n`java.awt.event` 包中是最常用的事件类：\n\n* `ActionEvent`（用于按钮点击）\n* `AdjustmentEvent`（用户调整了滚动条）\n\
  * `ItemEvent`（用户进行了选择）\n* `KeyEvent`（按键被按下或释放）\n* `MouseEvent`（鼠标按钮被按下、释放、移动或拖动）\n\
  * `MouseWheelEvent`（鼠标轮被旋转）\n* `FocusEvent`（组件获得焦点或失去焦点）\n* `WindowEvent`（窗口状态改变）\n\
  \n表 10.4 显示了最重要的 AWT 监听接口、事件和事件源。\n\n### 事件处理总结\n\n| 接口 | 方法 | 参数/访问器 | 由什么产生事件\
