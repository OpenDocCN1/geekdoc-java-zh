  \ passwordFile=\"jaas/password.txt\" debug=true;\n```\n\n### 文件摘要：\n- `jaas/SimpleCallbackHandler.java`\n\
  - `jaas/JAASTest.java`\n- `jaas/config`\n\n\n\n\n如前所述，applet 是引发 Java 热潮的起点。在实践中，人们发现尽管他们可以编写动画\
  \ applet（例如著名的“跳动的文本”），但在 JDK 1.0 安全模型下，applet 无法完成许多实用的事情。例如，由于 JDK 1.0 下的 applet\
  \ 受到严格的限制，即使从公司安全的内网中执行 applet 的风险很小，它们在企业内网中也做不了。Sun 公司很快意识到，要让 applet 变得真正有用，用户需要根据\
  \ applet 的来源分配不同级别的安全权限。如果一个 applet 来自受信任的供应商且未被篡改，该 applet 的用户就可以决定是否赋予其更多权限。\n\
  \n为了对一个 applet 给予信任，我们需要知道两点：\n\n* 该 applet 来自何处？\n* 代码在传输过程中是否被损坏了？\n\n在过去的 50\
  \ 年里，数学家和计算机科学家开发了复杂的算法来确保数据的完整性并创建电子签名。`java.security` 包包含了其中许多算法的实现。幸运的是，使用 `java.security`\
  \ 包中的算法时，并不理解底层的数学原理。在接下来的章节中，我将向你展示消息摘要（message digests）如何检测数据文件的变化以及数字签名如何证明签名者的身份。\n\
  \n### 消息摘要\n\n消息摘要是数据块的数字指纹。例如，所谓的 SHA-1（安全哈希算法 #1）可以将任何长度的任意数据块压缩成一个 160 位（20 字节）的序列。就像真实的指纹一样，人们希望两个不同的消息具有相同的\
  \ SHA-1 指纹。当然，这并不可能——只有 2¹⁶⁰ 种 SHA-1 指纹，因此某些消息一定具有相同的指纹。但 2¹⁶⁰ 是一个巨大的数字，碰撞的概率可以忽略不计。微小到什么程度呢？根据詹姆斯·沃尔什在《真实概率：风险如何影响你的日常生活》（Merritt\
  \ Publishing, 1996）中所说，你被雷劈死的概率大约是 30,000 分之一。现在，想想另外九个人——例如你最不喜欢的九位经理或教授。你和他们所有人被雷劈死的概率，高于伪造消息与原始消息具有相同\
  \ SHA-1 指纹的概率。（当然，会有超过十个人（你可能一个都不认识）死于雷劈。然而，我们讨论的是你所选的特定某人被消灭的极小得的可能性。）\n\n消息摘要有两个基本属性：\n\
  \n* 如果数据的某一位或几位位发生了变化，消息摘要也会随之改变。\n* 拥有给定消息的伪造者无法构造出一个与原始消息具有相同摘要的伪消息。\n\n第二个属性同样是一个概率问题。考虑以下这位万富翁父亲留的消息：\n\
  \n> “在我去世后，我的财产应在孩子们之间平分；然而，我的儿子乔将一无所有。”\n\n这条消息（带有最后的换行符）的 SHA-1 指纹为：\n\n```\n\
  12 5F 09 03 E7 31 30 19 2E A6 E7 E4 90 43 84 B4 38 99 8F 67\n```\n\n不不信任的父亲将消息留给了一位律师，将指纹留给了另一位。现在，假设乔贿赂了持有消息的那个律师。他想修改消息，让比尔一无所有。当然，这会将指纹变为一个完全不同的位模式：\n\
  \n```\n7D F6 AB 08 EB 40 EC CD AB 74 ED E9 86 F9 ED 99 D1 45 B1 57\n```\n\n乔能找到其他匹配该指纹的措辞吗？如果他从地球形成起就拥有一十亿台计算机，每台计算机每秒计算百万条消息，他可能还没有找到一条可以替换的消息。\n\
  \n人们设计了许多算法来计算此类消息摘要。其中包括 SHA-1（美国国家标准与技术研究院开发的安全哈希算法）和麻省理工 Ronald Rivest 发明的 MD5\
  \ 算法。这两种算法都以巧妙的方式打乱消息的位。关于这些算法的细节，请参考 William Stallings 写的《Cryptography and Network\
  \ Security, Seventh Edition》（Pearson, 2017）。然而，在这两种算法中都发现了细微的规律，NIST 建议切换到更强的替代方案。Java\
  \ 支持 SHA-2 和 SHA-3 算法集。\n\n`MessageDigest` 类是一个用于创建封装指纹算法对象的工厂。它有一个名为 `getInstance`\
  \ 的静态方法，返回扩展自 `MessageDigest` 类的对象。这意味着 `MessageDigest` 类承担了双重职责：\n\n* 作为工厂类\n*\
  \ 作为所有消息摘要算法的父类\n\n例如，以下是获取可以计算 SHA 指纹对象的方法：\n\n```\nMessageDigest alg = MessageDigest.getInstance(\"\
  SHA-1\");\n```\n\n在获取 `MessageDigest` 对象后，通过反复调用 `update` 方法将消息中的所有字节传递给它。例如，以下代码将文件中的所有字节传递给新创建的\
  \ `alg` 对象以进行指纹提取：\n\n```\nInputStream in = . . .;\nint ch;\nwhile ((ch = in.read())\
  \ != -1)\n   alg.update((byte) ch);\n```\n\n或者，如果你在数组中拥有字节，可以一次性更新整个数组：\n\n```\n\
  byte[] bytes = . .;\nalg.update(bytes);\n```\n\n完成后，调用 `digest` 方法。该方法会根据需要对输入进行填充，执行计算并以字节数组的形式返回摘要。\n\
  \n```\nbyte[] hash = alg.digest();\n```\n\n\n\n使用指定的字节更新摘要。\n\n* `byte[] digest()`\n\
  \  完成哈希计算，返回计算出的摘要，并重置算法对象。\n\n* `void reset()`\n  重置摘要。\n\n### 消息签名\n\n在上一节中，你已经了解了如何计算消息摘要——即原始消息的“指纹”。如果消息被篡改，篡改后消息的指纹将与原始消息的指纹不匹配。如果消息和其指纹分开传输，接收者就可以检查消息是否被篡改过。然而，如果消息和指纹都被截获了，那么修改消息并重新计算指纹是非常容易的事情。。，，消息摘要算法是公开的，它们不需要秘密密钥。在这种情况下，伪造消息和重新计算的指纹的接收者将永远不知道消息已经被篡改过。数字签名解决了这个问题。\n\
  \n为了帮助你理解数字签名的工作原理，让我们来看来自公钥加密（`public key cryptography`）字段的几个概念。公钥加密基于公钥（`public`）和私钥（`private`）对的概念。其核心思想是向世界上的人公开你的公钥。然而，只有你本人持有私钥，妥善保护它且不泄露给他人至关重要。密钥之间是通过数学关系匹配的，尽管这些关系的具体性质对我们来说并不重要。（如果你感兴趣，可以在[应用密码学手册（The\
  \ Handbook of Applied Cryptography）](https://cacr.uwaterloo.ca/hac/)中查阅。）\n\n密钥非常长且复杂。例如，这里有一对匹配的数字签名算法（DSA）公私钥。\n\
  \n\n\n公钥：\n\n```\np: fca682ce8e12caba26efccf7110e526db078b05edecbcd1eb4a208f3ae1617ae01f35b91a47e6df63413c5e12\n\
  ed0899bcd132acd50d99151bdc43ee737592e17\n\nq: 962eddcc369cba8ebb260ee6b6a126d9346e38c5\n\
  \ng: 678471b27a9cf44ee91a49c5147db1a9aaf244f05a434d6486931d2d14271b9e35030b71fd73da179069b32e2\n\
  935630e1c2062354d0da20a6c416e50be794ca4\n\ny: c0b6e67b4ac098eb1a32c5f8c4c1f0e7e6fb9d832532e27d0bdab9ca2d2a8123ce5a8018b8161a760480fadd0\n\
  40b927281ddb22cb9bc4df596d7de4d1b977d50\n```\n\n私钥：\n\n```\np: fca682ce8e12caba26efccf7110e526db078b05edecbcd1eb4a208f3ae1617ae01f35b91a47e6df63413c5e12\n\
  ed0899bcd132acd50d99151bdc43ee737592e17\n\nq: 962eddcc369cba8ebb260ee6b6a126d9346e38c5\n\
  \ng: 678471b27a9cf44ee91a49c5147db1a9aaf244f05a434d6486931d2d14271b9e35030b71fd73da179069b32e2\n\
  935630e1c2062354d0da20a6c416e50be794ca4\n\nx: 146c09f881656cc6c51f27ea6c3a91b85ed1d70a\n\
  ```\n\n人们认为从其中一个密钥计算另一个密钥在实践上是不可能的。也就是说，即使所有人都知道你的公钥，但在你的一生中，无论他们拥有多少计算资源，都无法计算出你的私钥。\n\
  \n可能很难相信从公钥无法计算出私钥——但目前还没有人针对现常用的加密算法找到可以实现此点的算法。如果密钥足够长，暴力破解（简单尝试所有可能的密钥）所需的计算机数量比太阳系中所有原子能构建的计算机还要多，并且运行数千年。当然，不排除有人发明出快得多的密钥计算算法。\n\
  \n\n\n\n某些证书颁发机构会在网站上发布证书指纹。例如，要检查 `var jdk/lib/security/cacerts` 目录下密钥库中的 DigiCert\
  \ 证书，可以使用 `-list` 选项：\n\n```\nkeytool -list -v -keystore jdk/lib/security/cacerts\n\
  ```\n\n该密钥库的密码为 `changeit`。该密钥库中的一个证书是：\n\n```\nOwner: CN=DigiCert Assured ID Root\
  \ G3, OU=www.digicert.com, O=DigiCert Inc, C=US\nIssuer: CN=DigiCert Assured ID\
  \ Root G3, OU=www.digicert.com, O=DigiCert Inc, C=US\nSerial number: ba15afa1ddfa0b54944afcd24a06cec\n\
  Valid from: Thu Aug 01 14:00:00 CEST 2013 until: Fri Jan 15 13:00:00 CET 2038\n\
  Certificate fingerprints:\n         SHA1: F5:17:A2:4F:9A:48:C6:C9:F8:A2:00:26:9F:DC:0F:48:2C:AB:30:89\n\
  \         SHA256: 7E:37:CB:8B:4C:47:09:0C:AB:36:55:1B:A6:F4:5D:B8:40:68:0F:BA:\n\
  \                 16:6A:95:2D:B1:00:71:7F:43:05:3F:C2\n```\n\n你可以通过访问网站 https://www.digicert.com/kb/digicert-root-certificates.htm\
  \ 来检查你的证书是否有效。\n\n一旦 Bob 信任了该证书，就可以将其导入他的密钥库中。\n\n```\nkeytool -importcert -keystore\
  \ bob.jks -alias alice -file alice.cer\n```\n\n永远不要将你不完全信任的证书导入密钥库。一旦证书被密钥密钥库，任何使用该密钥库的程序都会认为该证书可以用于验证签名。\n\
  \n现在 Alice 可以开始向 Bob 发送签名文档了。`jarsigner` 工具用于签名和验证 JAR 文件。Alice 仅需将要签名的文档添加到 JAR\
  \ 文件中。\n\n```\njar cvf document.jar document.txt\n```\n\n然后，她使用 `jarsigner` 工具为文件添加签名。她需要指定密钥库、JAR\
  \ 文件以及要使用的密钥别名。\n\n```\njarsigner -keystore alice.jks document.jar alice\n```\n\n\
  当 Bob 接收到文件时，他使用 `jarsigner` 程序的 `-verify` 选项。\n\n```\njarsigner -verify -keystore\
  \ bob.jks document.jar\n```\n\nBob 不需要指定别名。`jarsigner` 程序会在数字签名中找到密钥所有者的 X.500 名称，并在密钥库中查找匹配的证书。\n\
  \n如果 JAR 文件没有损坏且签名匹配，`jarsigner` 程序将打印：\n\n```\njar verified.\n```\n\n随后是若干个警告，对于这个简单的实验来说，你可以忽略这些警告。否则，程序将显示错误消息。\n\
  \n### 身份验证问题\n\n假设你收到了朋友 Alice 的消息，该消息使用我刚才向你展示的方法用她的私钥签名。你可能已经有了她的公钥，或者你可以向她索要副本或从她的网页上轻松获取。那么，你可以验证该消息确实是由\
  \ Alice 编写的且未被篡改。现在，假设你收到了一个陌生人的消息，他声称代表某著名软件公司，敦促你运行附在消息上的程序。该陌生人甚至给你发了一份他的公钥，以便你验证消息是由他编写的。你检查签名是有效的。这证明了消息是用匹配的私钥签名的，并且没有损坏。\n\
  \n注意：*你仍然不知道消息是谁写的。* 任何人都可以生成一对公私钥，用私钥对消息进行签名，并将签名后的消息和公钥发送给。。确定发送者身份的问题被称为 `身份验证问题`。\n\
  \n解决身份验证问题的常用方法很简单。假设你和你有一位你们都信任的共同熟人。假设陌生人面面了你的熟人，并交了一个装有公钥的磁盘。你的熟人后来与你见面，向你保证他见过那个陌生人，并且那个陌生人确实在那家著名软件公司工作，然后把磁盘交给你（参见图\
  \ 9.5）。这样，你的熟人就为陌生人的真实性担保了书。\n\n![Figure](img/fig09-14.jpg)通过信任的中间人进行身份验证\n\n事实上，你的熟人并不真的需要和你见面。他可以使用他的私钥对陌生人的公钥文件进行签名（参见图\
  \ 9.6）。\n\n![Figure](img/fig09-15.jpg)通过信任的中间人的签名进行身份验证\n\n当你得到公钥文件时，验证你朋友的签名，因为你信任他，所以确信他确实检查过那个陌生人。\n\
  \n（注：原文此处存在大量重复段落，已根据要求完成翻译并保持逻辑）\n\n### 证书签名\n\n在第 9.3.3 节中你见过 Alice 如何使用证书将公钥分给\
  \ Bob。然而，Bob 需要通过验证指纹来确保该证书有效。\n\n假设 Alice 想给她的同事 Cindy 发送签名消息，但 Cindy 不想费精力验证大量的指纹。现在假设有一个\
  \ Cindy 信任的验证实体。在本例中，是 ACME 软件公司的信息资源部门。\n\n该部门运行一个`证书颁发机构（CA）。ACME 所有人的密钥库中都有 CA\
  \ 的公钥，是由一个仔细检查过指纹的系统管理员安装的。CA 对 ACME 员工的密钥进行签名。当他们安装对方的密钥时，密钥库将信任这些密钥，因为它们经过了签名。\n\
  \n可以通过以下方式模拟这一过程。创建一个密钥库 `acmesoft.jks`。生成密钥对并导出公钥：\n\n```\nkeytool -genkeypair\
  \ -keystore acmesoft.jks -keyalg DSA -alias acmeroot\nkeytool -exportcert -keystore\
  \ acmesoft.jks -alias acmeroot -file acmeroot.cer\n```\n\n公钥被导出为“自签名”证书。然后，将其添加到每个员工的密钥库中：\n\
  \n```\nkeytool -importcert -keystore cindy.jks -alias acmeroot -file acmeroot.cer\n\
  ```\n\n\n\n\n\n为了让 Alice 能向 Cindy 以及 ACME Software 的其他所有人发送消息，她需要将自己的证书带到信息资源部门进行签名。遗憾的是，`keytool`\
  \ 程序缺少了这一功能。在书的配套代码中，我提供了一个 `CertificateSigner` 类来填补这一空白。ACME Software 的一名授权工作人员将验证\
  \ Alice 的身份并如下如下生成签名证书：\n\n```\njava CertificateSigner -keystore acmesoft.jks -alias\
  \ acmeroot \\\n   -infile alice.cer -outfile alice_signedby_acmeroot.cer\n```\n\n\
  证书签名程序必须拥有访问 ACME Software 密钥库的权限，且工作人员必须知道密钥库密码。显然，这是一项敏感操作。\n\nAlice 将 `alice_signedby_acmeroot.cer`\
  \ 文件交给 Cindy 以及 ACME Software 的其他任何人。或者，ACME Software 也可以简单地将该文件存储在公司目录中。记住，此文件包含了\
  \ Alice 的公钥，以及 ACME Software 对该密钥确实属于 Alice 的断言。\n\n现在，Cindy 将签名后的证书导入到她的密钥库中：\n\
  \n```\nkeytool -importcert -keystore cindy.jks -alias alice -file alice_signedby_acmeroot.cer\n\
  ```\n\n密钥库验证了该密钥是由密钥库中已存在的受信任根密钥签名的。Cindy *并没有*被要求验证证书指纹。\n\n一旦 Cindy 添加了根证书以及经常向她发送文档的人员，在它们过期之前，她就不需要再次担心证书了。\n\
  \n### 证书请求\n\n在上一节中，我们通过密钥库和 `CertificateSigner` 工具模拟了一个 CA。然而，大多数 CA 运行更复杂的软件来管理证书，并使用略有不同的证书格式。本节将展示与这些软件包进行交互所需的额外步骤。\n\
  \n我们将使用 OpenSSL 软件包作为示例。该软件预装在许多 Linux 系统和 Mac OS X 上，Windows 也有 Cygwin 版本可用。你可以在\
  \ [`www.openssl.org`](https://www.openssl.org) 下载该软件。\n\n要创建一个 CA，请运行 `CA` 脚本。位置取决于你的操作系统。在\
  \ Ubuntu 上，运行：\n\n```\n/usr/lib/ssl/misc/CA.pl -newca\n```\n\n该脚本会在当前目录下创建一个名为 `demoCA`\
  \ 的子目录。该目录包含一个根密钥对以及证书和证书撤销列表的存储空间。\n\n你想要将公钥导入所有员工的 Java 密钥库中，但它是 PEM（隐私增强邮件）格式，而不是密钥库容易接受的\
  \ DER 格式。将 `demoCA/cacert.pem` 文件复制为 `acmeroot.pem` 并用文本编辑器打开该文件。删除此行之前的内容：\n\n\
  ```\n-----BEGIN CERTIFICATE-----\n```\n\n以及此行之后的内容：\n\n```\n-----END CERTIFICATE-----\n\
  ```\n\n现在你可以按照通常的方式将 `acmeroot.pem` 导入到每个密钥库：\n\n```\nkeytool -importcert -keystore\
  \ cindy.jks -alias acmeroot -file acmeroot.pem\n```\n\n`keytool` 似乎不能自己执行这种编辑操作。\n\
  \n要签名 Alice 的公钥，首先生成一个包含 PEM 格式证书的`证书请求`：\n\n```\nkeytool -certreq -keystore alice.jks\
  \ -alias alice -file alice.pem\n```\n\n要签名证书，运行：\n\n```\nopenssl ca -in alice.pem\
  \ -out alice_signedby_acmeroot.pem\n```\n\n与之前一样，从 `alice_signedby_acmeroot.pem`\
  \ 中剪掉 `BEGIN CERTIFICATE`/`END CERTIFICATE` 标记之外的所有内容。然后将其导入 Cindy 的密钥库：\n\n```\n\
  keytool -importcert -keystore cindy.jks -alias alice -file alice_signedby_acmeroot.pem\n\
  ```\n\n要让证书颁发机构签名证书，请遵循类似的步骤：生成证书请求，将其发送给该机构，并导入从他们那里收到的签名文件。\n\n## 代码签名\n\n认证技术的一个常见用途是对可执行程序进行签名。如果你下载了一个程序，你自然会担心它可能造成的破坏。例如，该程序可能被病毒感染。如果你知道代码的来源*并且*知道它自离开源处以来未被篡改，你的安全感会比没有这些知识时高得多。\n\
  \n在本节中，我将向你展示如何对 JAR 文件签名，以及如何配置 Java 来验证签名。这种能力是为 applets 和 Java Web Start 应用设计的。这些已不再是常用的技术，但你可能仍然需要在旧版产品中支持它们。\n\
  \n当 Java 首次发布时，applets 一经加载就会在“沙箱”中运行，权限有限。如果用户想使用可以访问本地文件系统、建立网络连接等的 applet，他们必须显式同意。为了确保\
  \ applet 代码在传输过程中未被篡改，它必须经过数字签名。\n\n这里有一个具体的例子。假设你在浏览互联网时，遇到一个网站提供运行一个来自未知供应商的 applet，前提是你授予它运行该程序的权限（请参见\
  \ 图 9.7）。此类程序是由 Java 运行时信任的证书颁发机构颁发的`软件开发者`证书签名的。弹出的对话框会识别出软件开发者和证书颁发者。现在你需要决定是否授权该程序。\n\
  \n![Figure](img/fig09-17.jpg)启动签名的 applet\n\n有哪些事实可以影响你的决策？这里是你掌握的：\n\n*   Thawte\
  \ 向软件开发者出售了证书。\n*   程序确实是用该证书签名的，且在传输过程中未被修改。\n*   该证书确实是由 Thawte 签名的——通过 `cacerts`\
  \ 文件中的公钥验证。\n\n当然，这些都不能告诉你代码运行是否安全。如果你只知道供应商的名字以及 Thawte 向他们出售软件开发者证书的事实，你能信任这个供应商吗？这种方法毫无意义。\n\
  \n对于内网部署，证书更为可行。管理员可以在本地机器上安装策略文件和证书，这样启动信任的代码就不需要交互。然而，随着安全器的弃用，这种方法不再可行。\n\n##\
  \ 密码哈希\n\n出于明显的安全考虑，不应以明文形式存储密码。相反，应该存储它们的哈希值。当用户登录时，应对用户密码条目也进行哈希处理。如果值匹配，则通过身份验证。\n\
  \n然而，你目前看到的哈希算法并不适用于密码哈希。为了防止暴力破解攻击，哈希机制应该使用多次计算。此外，为了避免预计算密码表，每个密码都应该用随机“盐”值进行修改。\n\
  \nJava 提供了 PBKDF2 算法用于密码哈希。该算法四个参数：\n\n*   持有密码的 `char` 数组\n*   随机盐字节数组\n*   迭代次数\n\
  *   输出的位数长度\n\n带盐的密码不是消息，所以你不需要使用 `MessageDigest` 接口。相反，使用类似这样的 `SecretKeyFactory`：\n\
  \n```\nvar spec = new PBEKeySpec(password, salt, ITERATIONS, 8 * HASH_BYTES);\n\
  SecretKeyFactory skf = SecretKeyFactory.getInstance(\"PBKDF2WithHmacSHA256\");\n\
  byte[] hash = skf.generateSecret(spec).getEncoded();\n```\n\n\n\n\n\nPBE 缩写代表“基于密码的加密”，因为派生的字节也可以用作加密密钥。PBKDF\
  \ 是“基于密码的密钥派生函数”，它将短密码转换为较长的加密密钥。我们对加密本身不感兴趣，只存储生成的字节。对于密码验证，存储盐（salt）也是同样重要的。由于随着处理器性能增强，随着时间推移增加迭代次数是一个良好的做法，因此你也应该存储该值。\n\
  \n在将哈希作为字符串存储时，字节应被编码为十六进制（hex）或更高效地使用 base64 编码：\n\n```\nBase64.Encoder encoder\
  \ = Base64.getEncoder();\nString hashedPassword = ITERATIONS + \"|\" + encoder.encodeToString(salt)\
  \ + \"|\" \n   + encoder.encodeToString(hash);\n```\n\n要验证用户输入的密码，请从存储的哈希中获取迭代次数和盐，并重新计算哈希。\n\
  \n## 加密\n\n到为止，我们讨论了 Java 安全 API 实现的一种重要加密技术——即通过数字签名进行身份验证。安全的另一个重要方面是`加密`。即使经过了身份验证，信息本身也是可见的。数字签名仅验证信息未被更改。相比之下，当信息被加密时，它是不可见的。它只能用匹配的密钥解密。\n\
  \n身份验证对于代码签名来说足够了——不需要隐藏代码。然而，当应用程序传输机信息（如信用卡号和其他个人数据）时，加密是必要的。\n\n过去，专利和出口控制限制了许多公司提供强加密。幸运的是，现在的出口控制已宽松得多，而且重要算法的专利已经过期。如今，Java\
  \ 作为标准库的一部分提供了出色的加密支持。\n\n## 对称密码\n\nJava 加密扩展包含一个 `Cipher` 类，它是所有加密算法的父类。要获取加密对象，请调用\
  \ `getInstance` 方法：\n\n```\nCipher cipher = Cipher.getInstance(algorithmName);\n\
  ```\n\n或者\n\n```\nCipher cipher = Cipher.getInstance(algorithmName, providerName);\n\
  ```\n\nJDK 带有名为 `\"SunJCE\"` 的提供者的加密算法。如果你不指定其他提供者名称，它就是默认提供者。如果你需要 Oracle 不支持的特殊算法，可能需要另一个提供者。\n\
  \n算法名称是一个字符串，例如 `\"AES\"` 或 `\"DES/CBC/PKCS5Padding\"`。\n\n数据加密标准 (DES) 是一种密钥长度为\
  \ 56 位的经典分组密码。如今，DES 算法被认为是过时的，因为可以通过暴力破解来破解。一个更好的替代方案是它的继任者高级加密标准 (AES)。请查看 [`nvlpubs.nist.gov/nistpubs/FIPS/NIST.FIPS.197.pdf`](https://nvlpubs.nist.gov/nistpubs/FIPS/NIST.FIPS.197.pdf)\
  \ 获取 AES 算法的详细描述。我在示例中使用 AES。\n\n一旦你有了加密对象，可以通过设置模式和密钥来初始化它：\n\n```\nint mode =\
  \ . . .;\nKey key = . . .;\ncipher.init(mode, key);\n```\n\n模式有之一：\n\n```\nCipher.ENCRYPT_MODE\n\
  Cipher.DECRYPT_MODE\nCipher.WRAP_MODE\nCipher.UNWRAP_MODE\n```\n\n封装（wrap）和解封装（unwrap）模式是用一个密钥加密另一个密钥——示例请见下一节。\n\
  \n现在你可以反复调用 `update` 方法来加密数据块：\n\n```\nint blockSize = cipher.getBlockSize();\n\
  var inBytes = new byte[blockSize];\n. . . // 读取 inBytes\nint outputSize= cipher.getOutputSize(blockSize);\n\
  var outBytes = new byte[outputSize];\nint outLength = cipher.update(inBytes, 0,\
  \ outputSize, outBytes);\n. . . // 写入 outBytes\n```\n\n完成后，你必须调用一次 `doFinal` 方法。如果有最后的输入数据块可用（少于\
  \ `blockSize` 字节），则调用：\n\n```\noutBytes = cipher.doFinal(inBytes, 0, inLength);\n\
  ```\n\n如果所有输入数据都已加密，则调用：\n\n```\noutBytes = cipher.doFinal();\n```\n\n调用 `doFinal`\
  \ 是为了对最后一个数据块执行`填充`（padding）。考虑 DES 加密算法。它的分组大小为八字节。假设输入数据的最后一个块少于八字节。当然，我们可以用 `0`\
  \ 填充剩余字节，以获得一个八字节的最后一个块并对其加密。但当解密分组时，结果末尾会附加几个 `0` 字节，因此将与原始输入文件略有不同。为了避免这个问题，我们需要一个`填充方案`（padding\
  \ scheme）。一种常用的填充方案是 RSA Security, Inc. 在公钥密码标准 (PKCS) #5 中描述的方案（[`datatracker.ietf.org/doc/html/rfc2898`](https://datatracker.ietf.org/doc/html/rfc2898)）。\n\
  \n在该方案中，最后一个块不是用零填充值填充，而是用等于填充字节数的填充值填充。换句话说，如果 `L` 是最后一个（不完全的）块，它的填充方式如下：\n\n```\n\
  L 01                                if length(L) = 7\nL 02 02                  \
  \           if length(L) = 6\nL 03 03 03                          if length(L) =\
  \ 5\n. . .\nL 07 07 07 07 07 07 07             if length(L) = 1\n```\n（注：原文中填充方案的列表是截断的；我根据提供的片段保持了逻辑）。\n\
  \n### 密钥生成\n\n要进行加密，你需要生成一个密钥。遵循以下步骤：\n\n1. 为你的算法获取一个 `KeyGenerator`。\n2. 使用随机源初始化生成器。如果块长度是可变的，还要指定所需的块长度。\n\
  3. 调用 `generateKey` 方法。\n\n例如，这里是生成 AES 密钥的方法：\n\n```\nKeyGenerator keygen = KeyGenerator.getInstance(\"\
  AES\");\nvar random = new SecureRandom(); // 见下文\nkeygen.init(random);\nKey key\
  \ = keygen.generateKey();\n```\n\n或者，你可以从一组固原始数据产生密钥（可能派生自密码或击键计时）。如下所示构造 `SecretKeySpec`（它实现了\
  \ `SecretKey` 接口）：\n\n```\nbyte[] keyData = . . .; // AES 使用 16 字节\nvar key = new\
  \ SecretKeySpec(keyData, \"AES\");\n```\n\n在生成密钥时，确保使用`真随机`数字。例如，`Random` 类中通过由当前日期和时间种子初始化的普通随机生成器并不随机。假设计算机时钟精确到\
  \ 1/10 秒。那么每天最多有 864,000 个种子。如果攻击者知道密钥发放日期（通常可以从消息日期或证书过期日期推断），生成那天的所有种子是易事。\n\n\
  `SecureRandom` 类生成的随机数比 `Random` 类产生的要安全得多。你仍然需要提供一个种子以便从随机位置开始数字序列。此此最佳方法是从硬件设备（如白噪声生成器）获取随机输入。另一种合理的随机源是让用户在键盘上随意敲击，每次击键贡献一个或两个比特到随机种子。一旦将此类随机位收集到字节数组中，将其传递给\
  \ `setSeed` 方法：\n\n```\nvar random = new SecureRandom();\nvar b = new byte[20];\n\
  // 填充真随机位\nrandom.setSeed(b);\n```\n\n如果你不对随机数生成器建模，它将通过启动线程、让其睡眠并测量它们醒的确精确时间来计算自己的\
  \ 20 字节种子。\n\n这种算法尚未被认为是安全的。过去，依赖于计算机某些组件（如磁盘访问时间）计时的算法已被证明不是完全随机的。\n\n\n\n\n本节末尾的示例程序使用了\
  \ AES 加密算法（参见 Listing 9.12）。Listing 9.13 中的 `crypt` 工具方法将在其他示例中重用。要使用该程序，你首先需要生成一个密钥。运行\n\
  \n``` evenjava aes.AESTest -genkey secret.key\n```\n\n密钥将保存在 `secret.key` 文件中。\n\
  \n现在你可以可以使用命令进行加密：\n\n```\njava aes.AESTest -encrypt plaintextFile encryptedFile\
  \ secret.key\n```\n\n使用以下命令解密：\n\n```\njava aes.AESTest -decrypt encryptedFile decryptedFile\
  \ secret.key\n```\n\n该程序非常直观。`-genkey` 选项产生一个新的密钥并将其序列化到指定文件中。`-encrypt` 和 `-decrypt`\
  \ 选项都会调用同一个 `crypt` 方法，该方法会调用加密算法的 `update` 和 `doFinal` 方法。注意，只要输入块是完整长度，就会调用 `update`\
  \ 方法，而 `doFinal` 方法要么带部分输入块调用（随后进行填充），要么在不带额外数据调用（以生成一个填充块）。\n\n### aes/AESTest.java\n\
  \n```java\npackage aes;\n\nimport java.io.*;\nimport java.security.*;\nimport javax.crypto.*;\n\
  \n/**\n * 此程序测试 AES 加密算法。用法：<br>\n * java aes.AESTest -genkey keyfile<br>\n * java\
  \ aes.AESTest -encrypt plaintext encrypted keyfile<br>\n * java aes.AESTest -decrypt\
  \ encrypted decrypted keyfile<br>\n * @author Cay Horstmann\n * @version 1.02 2018-05-01\n\
  \ */\npublic class AESTest\n{\n   public static void main(String[] args) \n    \
  \     throws IOException, GeneralSecurityException, ClassNotFoundException\n   {\n\
  \      if (args[0].equals(\"-genkey\"))\n      {\n         KeyGenerator keygen =\
  \ KeyGenerator.getInstance(\"AES\");\n         var random = new SecureRandom();\n\
  \         keygen.init(random);\n         SecretKey key = keygen.generateKey();\n\
  \         try (var out = new ObjectOutputStream(new FileOutputStream(args[1])))\n\
  \         {\n            out.writeObject(key);\n         }\n      }\n      else\n\
  \      {\n         int mode;\n         if (args[0].equals(\"-encrypt\")) mode =\
  \ Cipher.ENCRYPT_MODE;\n         else mode = Cipher.DECRYPT_MODE;\n\n         try\
  \ (var keyIn = new ObjectInputStream(new FileInputStream(args[3]));\n          \
  \     var in = new FileInputStream(args[1]);\n               var out = new FileOutputStream(args[2]))\n\
  \         {\n            var key = (Key) keyIn.readObject();\n            Cipher\
  \ cipher = Cipher.getInstance(\"AES\");\n            cipher.init(mode, key);\n \
  \           Util.crypt(in, out, cipher);\n         }\n      }\n   }\n}\n```\n\n\
  ### aes/Util.java\n\n```java\npackage aes;\n\nimport java.io.*;\nimport java.security.*;\n\
  import javax.crypto.*;\n\npublic class Util\n{\n   /**\n    * 使用加密算法转换输入流中的字节，并将转换后的字节\n\
  \    * 发送到输出流。\n    * @param in 输入流\n    * @param out 输出流\n    * @param cipher 用于转换字节的加密算法\n\
  \    */\n   public static void crypt(InputStream in, OutputStream out, Cipher cipher)\
  \ \n         throws IOException, GeneralSecurityException\n   {\n      int blockSize\
  \ = cipher.getBlockSize();\n      int outputSize = cipher.getOutputSize(blockSize);\n\
  \      var inBytes = new byte[blockSize];\n      var outBytes = new byte[outputSize];\n\
  \n      int inLength = 0;\n      boolean done = false;\n      while (!done)\n  \
  \    {\n         inLength = in.read(inBytes);\n         if (inLength == blockSize)\n\
  \         {\n            int outLength = cipher.update(inBytes, 0, blockSize, outBytes);\n\
  \            out.write(outBytes, 0, outLength);\n         }\n         else done\
  \ = true;\n      }\n      if (inLength > 0) outBytes = cipher.doFinal(inBytes, 0,\
  \ inLength);\n      else outBytes = cipher.doFinal();\n      out.write(outBytes);\n\
  \   }\n}\n```\n\n### javax.crypto.Cipher 1.4\n\n* `static Cipher getInstance(String\
  \ algorithmName)`\n* `static Cipher getInstance(String algorithmName, String providerName)`\n\
  \  返回一个实现指定算法的 `Cipher` 对象。如果未提供算法，则抛出 `NoSuchAlgorithmException`。\n* `int getBlockSize()`\n\
  \  返回加密块的大小（字节为单位），如果加密算法不是块加密算法，则返回 `0`。\n* `int getOutputSize(int inputLength)`\n\
  \  返回如果下次输入具有指定的字节数，则所需的输出缓冲区的大小。此方法考虑了加密对象中任何缓冲的字节。\n* `void init(int mode, Key\
  \ key)`\n  初始化加密算法对象。模式为 `ENCRYPT_MODE`、`DECRYPT_MODE`、`WRAP_MODE` 或 `UNWRAP_MODE`\
  \ 之一。\n* `byte[] update(byte[] in)`\n* `byte[] update(byte[] in, int offset, int\
  \ length)`\n* `int update(byte[] in, int offset, int length, byte[] out)`\n  转换一个输入块。前两个方法返回输出。第三个方法返回写入\
  \ `out` 的字节数。\n* `byte[] doFinal()`\n* `byte[] doFinal(byte[] in)`\n* `byte[] doFinal(byte[]\
  \ in, int offset, int length)`\n* `int doFinal(byte[] in, int offset, int length,\
  \ byte[] out)`\n  转换最后一个输入块并刷新该算法对象的缓冲区。前三个方法返回输出。第四个方法返回写入 `out` 的字节数。\n\n### javax.crypto.KeyGenerator\
  \ 1.4\n\n* `static KeyGenerator getInstance(String algorithmName)`\n  返回一个实现指定算法的\
  \ `KeyGenerator` 对象。如果未提供算法，则抛出 `NoSuchAlgorithmException`。\n* `void init(SecureRandom\
  \ random)`\n* `void init(int keySize, SecureRandom random)`\n  初始化密钥生成器。\n* `SecretKey\
  \ generateKey()`\n  生成一个新的密钥。\n\n### javax.crypto.spec.SecretKeySpec 1.4\n\n* `SecretKeySpec(byte[]\
  \ key, String algorithmName)`\n  构造密钥。\n\n### Cipher Streams\n\nJCE 库提供了一组方便的流类，可以自动对流进行解密。例如，以下是将数据加密到文件的方法：\n\
  \n```java\nCipher cipher = . . ++;cipher.init(Cipher.ENCRYPT_MODE, key);\nvar out\
  \ = new CipherOutputStream(new FileOutputStream(outputFileName), cipher);\nvar bytes\
  \ = new byte[BLOCKSIZE];\nint inLength = getData(bytes); // 从源获取数据\nwhile (inLength\
  \ != -1)\n{\n   out.write(bytes, 0, inLength);\n   inLength = getData(bytes); //\
  \ 从源获取更多数据\n}\nout.flush();\n```\n\n同样，你可以使用 `CipherInputStream` 从文件读取并解密数据：\n\n\
  ```java\nCipher cipher = . . ++;\ncipher.init(Cipher.DECRYPT_MODE, key);\nvar in\
  \ = new CipherInputStream(new FileInputStream(inputFileName), cipher);\nvar bytes\
  \ = new byte[BLOCKSIZE];\nint inLength = in.read(bytes);\nwhile (inLength != -1)\n\
  {\n   putData(bytes, inLength); // 将数据放入目的地\n   inLength = in.read(bytes);\n}\n\
  ```\n\n加密流类透明地处理了对 `update` 和 `doFinal` 的调用，这显然是一种便利。\n\n### 公钥加密\n\n\n\n\n\n你在前一节中看到的\
  \ `AES` 算法是一种`对称`加密。加密和解密都使用相同的密钥。对称加密的致命弱点是密钥分发。如果 Alice 向 Bob 发送一条加密消息，Bob 需要使用与\
  \ Alice 相同的密钥。如果 Alice 更改了密钥，她需要向 Bob 发送消息，并通过一个安全通道发送新密钥。但也许她并没有与 Bob 通信的安全通道——这正是她起初要给他的消息进行加密的原因。\n\
  \n公钥加密解决了这个问题。在公钥加密中，Bob 拥有一个由公钥和匹配的私钥组成的密钥对。Bob 可以在任何发布公钥，但他必须严密保护私钥。Alice 只需使用公钥加密发给\
  \ Bob 的消息即可。\n\n实际上，事情并没有那么简单。所有已知的公钥算法都比 `DES` 或 `AES` 等对称密钥算法`慢得多`。使用公钥算法加密大量信息是不现实的。然而，通过将公钥加密与快速对称加密相结合可以很容易解决这个问题，如下：\n\
  \n1. Alice 生成一个随机对称加密密钥。她使用它来加密明文。\n2. Alice 使用 Bob 的公钥加密对称密钥。\n3. Alice 向 Bob 发送加密后的对称密钥和加密后的明文。\n\
  4. Bob 使用他的私钥解密对称密钥。\n5. Bob 使用解密后的对称密钥解密消息。\n\n除了 Bob 之外没人能解密对称密钥，因为只有 Bob 拥有解密的私钥。因此，昂贵的公钥加密仅适用于少量的密钥数据。\n\
  \n最常用的公钥算法是是由 Rivest、Shamir 和 Adleman 发明的 `RSA` 算法。在 2000 年 10 月之前，该算法受分配给 RSA Security,\
  \ Inc. 的专利保护。许可费用并不便宜——通常是 3% 的版税，每年最低支付 50,000 美元。现在该算法已进入公共领域。\n\n要使用 `RSA` 算法，你需要一对公钥/私钥。如下所示使用\
  \ `KeyPairGenerator`：\n\n```\nKeyPairGenerator pairgen = KeyPairGenerator.getInstance(\"\
  RSA\");\nvar random = new SecureRandom();\npairgen.initialize(KEYSIZE, random);\n\
  KeyPair keyPair = pairgen.generateKeyPair();\nKey publicKey = keyPair.getPublic();\n\
  Key privateKey = keyPair.getPrivate();\n```\n\nListing 9.14 中的程序有三个选项。`-genkey`\
  \ 选项产生密钥对。`-encrypt` 选项生成一个 `AES` 密钥并用公钥将其封装（wrap）。\n\n```\nKey key = . . .; //\
  \ 一个 AES 密钥\nKey publicKey = . . .; // 一个 RSA 公钥\nCipher cipher = Cipher.getInstance(\"\
  RSA\");\ncipher.init(Cipher.WRAP_MODE, publicKey);\nbyte[] wrappedKey = cipher.wrap(key);\n\
  ```\n\n它随后生成一个包含以下内容的文件：\n\n* 封装密钥的长度\n* 封装密钥字节\n* 用 `AES` 密钥加密的明文\n\n`-decrypt`\
  \ 选项解密此类文件。要尝试运行程序，首先生成 `RSA` 密钥：\n\n```\njava rsa.RSATest -genkey public.key private.key\n\
  ```\n\n然后加密一个文件：\n\n```\njava rsa.RSATest -encrypt plaintextFile encryptedFile public.key\n\
  ```\n\n最后，解密它并验证解密后的文件是否与明文匹配：\n\n```\njava rsa.RSATest -decrypt encryptedFile decryptedFile\
  \ private.key\n```\n\n`rsa/RSATest.java`\n\n```java\npackage rsa;\n\nimport java.io.*;\n\
  import java.security.*;\nimport javax.crypto.*;\n\n/**\n * 此程序测试 RSA 加密算法。用法:<br>\n\
  \ * java rsa.RSATest -genkey public private<br>\n * java rsa.RSATest -encrypt plaintext\
  \ encrypted public<br>\n * java rsa.RSATest -decrypt encrypted decrypted private<br>\n\
  \ * @author Cay Horstmann\n * @version 1.02 2018-05-01\n */\npublic class RSATest\n\
  {\n   private static final int KEYSIZE = 512;\n\n   public static void main(String[]\
  \ args) \n         throws IOException, GeneralSecurityException, ClassNotFoundException\n\
  \   {\n      if (args[0].equals(\"-genkey\"))\n      {\n         KeyPairGenerator\
  \ pairgen = KeyPairGenerator.getInstance(\"RSA\");\n         var random = new SecureRandom();\n\
  \         pairgen.initialize(KEYSIZE, random);\n         KeyPair keyPair = pairgen.generateKeyPair();\n\
  \         try (var out = new ObjectOutputStream(new FileOutputStream(args[1])))\n\
  \         {\n            out.writeObject(keyPair.getPublic());\n         }\n   \
  \      try (var out = new ObjectOutputStream(new FileOutputStream(args[2])))\n \
  \        {\n            out.writeObject(keyPair.getPrivate());\n         }\n   \
  \   }\n      else if (args[0].equals(\"-encrypt\"))\n      {\n         KeyGenerator\
  \ keygen = KeyGenerator.getInstance(\"AES\");\n         var random = new SecureRandom();\n\
  \         keygen.init(random);\n         SecretKey key = keygen.generateKey();\n\
  \n         // 使用 RSA 公钥封装\n         try (var keyIn = new ObjectInputStream(new FileInputStream(args[3]));\n\
  \               var out = new DataOutputStream(new FileOutputStream(args[2]));\n\
  \               var in = new FileInputStream(args[1]) )\n         {\n          \
  \  var publicKey = (Key) keyIn.readObject();\n            Cipher cipher = Cipher.getInstance(\"\
  RSA\");\n            cipher.init(Cipher.WRAP_MODE, publicKey);\n            byte[]\
  \ wrappedKey = cipher.wrap(key);\n            out.writeInt(wrappedKey.length);\n\
  \            out.write(wrappedKey);\n\n            cipher = Cipher.getInstance(\"\
  AES\");\n            cipher.init(Cipher.ENCRYPT_MODE, key);\n            Util.crypt(in,\
  \ out, cipher);\n         }         \n      }\n      else\n      {\n         try\
  \ (var in = new DataInputStream(new FileInputStream(args[1]));\n               var\
  \ keyIn = new ObjectInputStream(new FileInputStream(args[3]));\n               var\
  \ out = new FileOutputStream(args[2]))\n         {\n            int length = in.readInt();\n\
  \            var wrappedKey = new byte[length];\n            in.read(wrappedKey,\
  \ 0, length);\n\n            // 使用 RSA 私钥解封装\n            var privateKey = (Key)\
  \ keyIn.readObject();\n\n            Cipher cipher = Cipher.getInstance(\"RSA\"\
  );\n            cipher.init(Cipher.UNWRAP_MODE, privateKey);\n            Key key\
  \ = cipher.unwrap(wrappedKey, \"AES\", Cipher.SECRET_KEY);\n\n            cipher\
  \ = Cipher.getInstance(\"AES\");\n            cipher.init(Cipher.DECRYPT_MODE, key);\n\
  \            Util.crypt(in, out, cipher);\n         }\n      }\n   }\n}\n```\n\n\
  \n\n\n当 Java 1.0 引入时，它包含一个名为抽象窗口工具包（AWT）的类库，用于基本的 GUI 编程。基础 AWT 库通过将用户界面元素的创建和行为委托给每个目标平台（Windows、Linux、Macintosh\
  \ 等）上的原生 GUI 工具包来处理这些元素。例如，如果你使用原始 AWT 在 Java 窗口上放置一个文本框，底层的“代理”（peer）文本框实际上会处理文本输入。理论上，生成的程序可以在这些平台的任何一个上运行，并具有目标平台的“外观和感觉”。\n\
  \n这种基于代理的方法对于简单应用程序非常有效，但人们很快发现，要依赖原生用户界面元素来编写一个高质量的可移植图形库是极其困难的。菜单、滚动条和文本字段等用户界面元素在不同平台上的行为存在细微差异。因此，很难通过这种方法为用户提供一致且可预测的体验。此外，某些图形环境（如\
  \ X11/Motif）的用户界面组件并不像 Windows 或 Macintosh 那么丰富。这进一步限制了基于“最小公约数”方法的跨移植库。结果是使用 AWT\
  \ 构建的 GUI 应用看起来并不像原生的 Windows 或 Macintosh 应用那样漂亮，也不具备这些平台用户所期待的功能。更令人沮丧的是，不同平台上的\
  \ AWT 用户界面库存在*不同*的漏洞。开发者抱怨说，他们必须在每个平台上测试自己的应用程序——这种做法被嘲讽性地称为“一次编写，到处调试”。\n\n1996\
  \ 年，Netscape 创建了一个他们称为 IFC（网络基础类）的 GUI 库，它采用了完全不同的方法。用户界面元素（如按钮、菜单等）被*绘制*在空白窗口上。底层窗口系统唯一的功能是提供一种显示窗口并在上面进行绘制的方法。因此，无论程序运行在哪个平台，Netscape\
  \ 的 IFC 控件的外观和行为都是相同的。太阳物系统公司（Sun Microsystems）与 Netscape 合作完善了这种方法，创建了一个代号为“Swing”的用户界面库。Swing\
  \ 作为 Java 1.1 的扩展程序提供，并成为 Java 1.2 标准库的一部分。\n\nSwing 现在是这种非代理的 GUI 工具包的官方名称。\n\n\
  Swing 并不是 AWT 的完全替代品——它是构建在 AWT 架构之上的。Swing 只是为你提供了更强大的用户界面组件。每当你编写 Swing 程序时，你都会使用\
  \ AWT 的基础——特别是事件处理。从现在起，当我说“Swing”时，指的是“绘制”的用户界面类；当我提到“AWT”时，指的是窗口工具包的底层机制，例如事件处理。\n\
  \nSwing 必须努力地绘制用户界面的每一个像素。当 Swing 首次发布时，用户抱怨它很慢。（如果你在树莓派等硬件上运行 Swing 程序，仍然能感受到这个问题。）过了一段时间，桌面电脑变得越来越快了，用户又抱怨\
  \ Swing 很难看——事实上，它已经落后于那些经过动画和华丽效果装饰的原生控件。更令人不安的是，Adobe Flash 被越来越多地用于创建具有更闪耀效果的用户界面，而这些界面完全没有使用原生控件。\n\
  \n2007 年，太阳物系统公司引入了一个完全不同的用户界面工具包，称为 JavaFX，作为 Flash 的竞争对手。它运行在 Java VM 上，但有它自己的编程语言，称为\
  \ JavaFX Script。该语言针对编程动画和华丽效果进行了优化。程序员抱怨需要学习一种新语言，他们成群结队地避开。2011 年，Oracle 发布了新版本\
  \ JavaFX 2.0，它拥有 Java API，不再需要单独的编程语言。从 Java 7 update 6 开始，JavaFX 被包含在 JDK 和 JRE\
  \ 中。然而，这种包含关系从 Java 11 开始停止了。\n\n由于这是一本关于 Java 核心语言和 API 的书，我将专注于使用 Swing 进行用户界面编程。\n\
  \n## 显示帧\n\n顶层窗口（即不包含在另一个窗口内的窗口）在 Java 中被称为*frame*（帧）。AWT 库有一个名为 `Frame` 的类用于处理这种顶层窗口。该类的\
  \ Swing 版本被称为 `JFrame` 并继承了 `Frame` 类。`JFrame` 是少数几个不在画布上绘制的 Swing 组件之一。因此，装饰（按钮、标题栏、图标等）是由用户的窗口系统绘制的，而不是由\
  \ Swing 绘制的。\n\n大多数 Swing 组件类以“J”开头：`JButton`、`JFrame` 等。也有像 `Button` 和 `Frame`\
  \ 之类，但它们是 AWT 组件。如果你不小心漏掉了“J”，你的程序可能仍然编译并运行，但 Swing 和 AWT 组件的混合会导致视觉和行为上的不一致。\n\n\
  ### 创建帧\n\n在本节中，我们将介绍处理 Swing `JFrame` 的最常用方法。列表 10.1 列出了一个在屏幕上显示空帧的简单程序，如图 10.1](#index.xhtml_ch07fig04)\
  \ 所示。\n\n![Figure](img/simpleframetest.jpg)最简单的可见 impleFrame/SimpleFrameTest.java\n\
  \n```\npackage simpleFrame;\n\nimport java.awt.*;\nimport javax.swing.*;\n\n/**\n\
  \ * @version 1.34 2018-04-10\n * @author Cay Horstmann\n */\npublic class SimpleFrameTest\n\
  {\n   public static void main(String[] args)\n   {\n      EventQueue.invokeLater(()\
  \ ->\n         {\n            var frame = new SimpleFrame();\n            frame.setDefaultCloseOperation(JFrame.EXIT_ON_CLOSE);\n\
  \            frame.setVisible(true);\n         });\n   }\n}\n\nclass SimpleFrame\
  \ extends JFrame\n{\n   private static final int DEFAULT_WIDTH = 300;\n   private\
  \ static final int DEFAULT_HEIGHT = 200;\n\n   public SimpleFrame()\n   {\n    \
  \  setSize(DEFAULT_WIDTH, DEFAULT_HEIGHT);\n   }\n}\n```\n\n让我们逐行分析这个程序。\n\nSwing\
  \ 类存放在 `javax.swing` 包中。包名 `java` 表示这是一个 Java 扩展包，而不是核心包。出于历史原因，Swing 被认为是一个扩展。然而，自\
  \ Java 1.2 以来，它在每个 Java 实现中都存在。\n\n默认情况下，帧的大小为 0×0 像素，这对于一个窗口来说是相当没用处的尺寸。我们定义了一个子类\
  \ `SimpleFrame`，其构造函数将大小设置为 300×200 像素。这是 `SimpleFrame` 和 `JFrame` 唯一的区别。\n\n在 `SimpleFrameTest`\
  \ 类的 `main` 方法中，我们构造了一个 `SimpleFrame` 对象并使其可见。\n\n在每个 Swing 程序中，我们需要解决两个技术问题。\n\n\
  首先，所有的 Swing 组件必须从事件分派线程进行配置，该线程是传递鼠标点击和击键等事件给用户界面组件的控制线程。以下代码片段用于在事件分派线程中执行语句：\n\
  \n```\nEventQueue.invokeLater(() ->\n   {\n      statements\n   });\n```\n\n接下来，我们定义当用户关闭应用程序帧时发生什么。对于这个特定的程序，我们希望程序退出。为了选择这种行为，我们使用语句\n\
  \n```\nframe.setDefaultCloseOperation(JFrame.EXIT_ON_CLOSE);\n```\n\n\n\n\n在其他具有多个窗口的程序中，你不希望程序仅仅用户关闭了其中一个窗口就退出。默认情况下，当用户关闭窗口时，该窗口会被隐藏，但程序不会终止。（如果程序在*最后一个*窗口变得不可见时终止，那可能会很好，但并不是\
  \ Swing 的工作方式。）\n\n仅仅构造窗口（frame）并不会自动显示它。窗口在生命周期开始时是不可见的。这为程序员提供了在首次显示窗口之前向窗口中添加组件的机会。要显示窗口，`main`\
  \ 方法会调用窗口的 `setVisible` 方法。\n\n在调度完初始化语句后，`main` 方法就会退出。注意，退出 `main` 并没有终止程序——仅仅是主线程。事件分发线程（event\
  \ dispatch thread）会保持程序运行，直到它通过关闭窗口或调用 `System.exit` 方法被终止。\n\n运行中的程序如图 10.1 所示——它是一个非常无聊的顶层窗口。如如图所示，标题栏和周围的装饰（如调整大小角）是由操作系统绘制的，而不是\
  \ Swing 库。Swing 库负责绘制窗口内部的所有内容。在这个程序中，它只是用默认背景色填充了窗口。\n\n### 窗口属性\n\n`JFrame` 类本身只有少数方法用于更改窗口的外观。当然，通过继承的魔力，大多数处理窗口大小和位置的方法都来自\
  \ `JFrame` 的各种父类。以下是一些最重要的方法：\n\n*   用于设置窗口位置的 `setLocation` 和 `setBounds` 方法。\n\
  *   `setIconImage` 方法，它用于告诉窗口系统应该在标题栏、任务切换器窗口等处显示哪个图标。\n*   `setTitle` 方法，用于更改标题栏中的文本。\n\
  *   `setResizable` 方法，它接收一个 `boolean` 值，用于决定用户是否可以调整窗口的大小。\n\n图 10.2 展示了 `JFrame`\
  \ 类的继承层次结构。\n\n![Figure](img/07_05.jpg)AWT 和 Swing 中窗口和组件类的继承层次结构\n\n正如 API 注释所示，`Component`\
  \ 类（所有 GUI 对象的祖先）和 `Window` 类（`Frame` 类的父类）是你需要查找调整大小和重塑窗口方法的地方。例如，`Component` 类中的\
  \ `setLocation` 方法是重新定位组件的一种方法。如果你调用\n\n```\nsetLocation(x, y)\n```\n\n则左上角将位于向右偏移\
  \ `x` 像素、向下 `y` 像素的位置，其中 `(0, 0)` 是屏幕的左上角。同样，`Component` 中的 `setBounds` 方法允许你一步到位调整组件的大小并移动它的位置（特别是\
  \ `JFrame`），如下：\n\n```\nsetBounds(x, y, width, height)\n```\n\n组件类的许多方法都以 getter/setter\
  \ 对的形式出现，例如 `Frame` 类的以下方法：\n\n```\npublic String getTitle()\npublic void setTitle(String\
  \ title)\n```\n\n这样的一个 getter/setter 对被称为一个*属性*（property）。一个属性有一个名称和一个类型。名称通过将 `get`\
  \ 或 `set` 之后的第一个字母写为小写来获得。例如，`Frame` 类有一个名称为 `title`、类型为 `String` 的属性。\n\n从概念上讲，`title`\
  \ 是窗口的一个属性。当我们设置该属性时，我们期望用户屏幕上的标题发生变化。当我们获取该属性时，我们期望得到我们之前设置的值。\n\n`get`/`set` 约定有一个例外：对于\
  \ `boolean` 属性，getter 以 `is` 开头。例如，以下两个方法定义了 `resizable` 属性：\n\n```\npublic boolean\
  \ isResizable()\npublic void setResizable(boolean resizable)\n```\n\n要确定窗口合适的尺寸，首先查找屏幕尺寸。调用\
  \ `Toolkit` 类的静态方法 `getDefaultToolkit` 来获取 `Toolkit` 对象。（`Toolkit` 类是各种与原生窗口系统接口的方法的聚集地。）然后调用\
  \ `getScreenSize` 方法，它以 `Dimension` 对象的形式返回屏幕尺寸。一个 `Dimension` 对象同时在公共（!）实例变量 `width`\
  \ 和 `height` 中存储宽度和高度。然后你可以使用屏幕尺寸的比例来设置窗口大小。以下是代码：\n\n```\nToolkit kit = Toolkit.getDefaultToolkit();\n\
  Dimension screenSize = kit.getScreenSize();\nint screenWidth = screenSize.width;\n\
  int screenHeight = screenSize.height;\nsetSize(screenWidth / 2, screenHeight / 2);\n\
  ```\n\n你也可以提供窗口图标：\n\n```\nImage img = new ImageIcon(\"icon.gif\").getImage();\n\
  setIconImage(img);\n```\n\n`java.awt.Component` 1.0\n\n*   `boolean isVisible()`\n\
  *   `void setVisible(boolean b)`\n    获取或设置 `visible` 属性。组件初始是可见的，但 `JFrame` 等顶层组件除外。\n\
  *   `void setSize(int width, int height)` 1.1\n    将组件调整为指定的宽度和高度。\n*   `void setLocation(int\
  \ x, int y)` 1.1\n    将组件移动到新位置。如果组件不是顶层的，`x` 和 `y` 坐标将使用容器的坐标。\n*   `void setBounds(int\
  \ x, int y, width, height)` 1.1\n    移动并调整此组件的大小。\n*   `Dimension getSize()` 1.1\n\
  *   `void setSize(Dimension d)` 1.1\n    获取或设置此组件的 `size` 属性。\n\n`java.awt.Frame`\
  \ 1.0\n\n*   `boolean isResizable()`\n*   `void setResizable(boolean b)`\n    获取或设置\
  \ `resizable` 属性。当属性被设置时，用户可以调整窗口的大小。\n*   `String getTitle()`\n*   `void setTitle(String\
  \ s)`\n    获取或设置 `title` 属性，该属性决定窗口标题栏中的文本。\n*   `Image getIconImage()`\n*   `void\
  \ setIconImage(Image image)`\n    获取或设置 `iconImage` 属性，该属性决定窗口的图标。窗口系统可能会将图标作为窗口装饰的一部分或其他位置显示。\n\
  \n`java.awt.Toolkit` 1.0\n\n*   `static Toolkit getDefaultToolkit()`\n    返回此平台的默认工具包。\n\
  *   `Dimension getScreenSize()`\n    获取用户屏幕的尺寸。\n\n`javax.swing.ImageIcon` 1.2\n\
  \n*   `ImageIcon(String filename)`\n    构造一个存储在文件中图标。\n*   `getImage()`\n    获取此图标的图像。\n\
  \n### 在组件中显示信息\n\n在本节中，我将向你展示如何在窗口内显示信息（图 10.3）。\n\n![Figure](img/nothelloworld.jpg)显示信息的窗口\n\
  \n你可以直接在窗口上绘制消息字符串，但这并不被认为是一个好的做法。在 Java 中，窗口设计是作为组件的容器，例如菜单栏和其他用户界面元素。你通常在添加到窗口的另一个组件上绘制。\n\
  \n`JFrame` 的结构异常地复杂。查看图 10.4，它展示了 `JFrame` 的组成。如你所见，`JFrame` 中叠加了四个面板（pane）。根面板、分层面板和玻璃面板对我们没有吸引；它们是组织菜单栏和内容面板以及实现外观效果所需的。Swing\
  \ 程序员最关注的部分是*内容面板*（content pane）。你添加到窗口的任何组件都会被自动放入内容面板中：\n\n```\nComponent c =\
  \ . . .;\nframe.add(c); // 添加到内容面板\n```\n\n![Figure](img/07_07.jpg)JFrame 的内部结构\n\
  \n在我们的案例中，我们想向窗口添加单个组件，并在上面绘制我们的消息。要在组件上绘图，你需要定义一个自 `JComponent` 的类，并在该类中重写 `paintComponent`\
  \ 方法。\n\n\n\n\n`paintComponent` 方法有一个类型为 `Graphics` 的参数。`Graphics` 对象记录了一组用于绘制图像和文本的设置，例如你设置的字体或当前颜色。Java\
  \ 中所有的绘制操作都必须通过 `Graphics` 对象进行。它拥有绘制图形、图像和文本的方法。\n\n以下是如何创建一个可以在上面进行绘图的组件：\n\n\
  ```java\nclass MyComponent extends JComponent\n{\n   public void paintComponent(Graphics\
  \ g)\n   {\n      code for drawing\n   }\n}\n```\n\n每当窗口需要重绘时，无论出于什么原因，事件处理器都会通知组件。这会导致所有组件的\
  \ `paintComponent` 方法被执行。\n\n永远不要自己调用 `paintComponent` 方法。每当应用程序的某部分需要重绘时，该方法会被自动调用，你不应该干预这个自动过程。\n\
  \n什么样的动作会触发这种自动响应？例如，当用户增大窗口尺寸，或最小化然后恢复窗口时，就会发生绘制操作。如果用户弹出的另一个窗口覆盖了现有窗口，然后让覆盖的窗口消失，那么被覆盖的窗口现在就会损坏并需要重新重绘。（图形系统并不保存下方的像素。）当然，当窗口首次显示时，它需要处理指定如何以及在何处绘制初始元素的代码。\n\
  \n如果你需要强制重绘屏幕，请调用 `repaint` 方法而不是 `paintComponent`。`repaint` 方法会导致所有组件都调用 `paintComponent`，并传入一个配置适当的\
  \ `Graphics` 对象。\n\n正如你在上面的代码段所示，`paintComponent` 方法有一个类型为 `Graphics` 的单一参数。在 `Graphics`\
  \ 对象上进行的屏幕测量是以像素为单位的。(0, 0) 坐标表示绘图表面的左上角。\n\n`Graphics` 类有各种绘制方法，而显示文本被认为是一种特殊的绘制。我们的\
  \ `paintComponent` 方法看起来如下：\n\n```java\npublic class NotHelloWorldComponent extends\
  \ JComponent\n{\n   public static final int MESSAGE_X = 75;\n   public static final\
  \ int MESSAGE_Y = 100;\n\n   public void paintComponent(Graphics g)\n   {\n    \
  \  g.drawString(\"Not a Hello, World program\", MESSAGE_X, MESSAGE_Y);\n   }\n \
  \  . . .\n}\n```\n\n最后，组件应该告诉用户它希望自己有多大。重写 `getPreferredSize` 方法并返回一个带有首选宽度和高度的\
  \ `Dimension` 类对象：\n\n```java\npublic class NotHelloWorldComponent extends JComponent\n\
  {\n   private static final int DEFAULT_WIDTH = 300;\n   private static final int\
  \ DEFAULT_HEIGHT = 200;\n   . . .\n   public Dimension getPreferredSize()\n   {\
  \ \n      return new Dimension(DEFAULT_WIDTH, DEFAULT_HEIGHT); \n   }\n}\n```\n\n\
  当你向框架中填充一个或多个组件，并且仅仅想使用它们的首选尺寸时，调用 `pack` 方法而不是 `setSize` 方法：\n\n```java\nclass\
  \ NotHelloWorldFrame extends JFrame\n{\n   public NotHelloWorldFrame()\n   {\n \
  \     add(new NotHelloWorldComponent());\n      pack();\n   }\n}\n```\n\nListing\
  \ 10.2 显示了完整的代码。\n\n`notHelloWorld/NotHelloWorld.java`\n\n```java\npackage notHelloWorld;\n\
  \nimport javax.swing.*;\nimport java.awt.*;\n\n/**\n * @version 1.34 2018-04-10\n\
  \ * @author Cay Horstmann\n */\npublic class NotHelloWorld\n{\n   public static\
  \ void main(String[] args)\n   {\n      EventQueue.invokeLater(() ->\n         {\n\
  \            var frame = new NotHelloWorldFrame();\n            frame.setTitle(\"\
  NotHelloWorld\");\n            frame.setDefaultCloseOperation(JFrame.EXIT_ON_CLOSE);\n\
  \            frame.setVisible(true);\n         });\n   }\n}\n\n/**\n * 一个包含消息面板的框架。\n\
  \ */\nclass NotHelloWorldFrame extends JFrame\n{\n   public NotHelloWorldFrame()\n\
  \   {\n      add(new NotHelloWorldComponent());\n      pack();\n   }\n}\n\n/**\n\
  \ * 一个显示消息的组件。\n */\nclass NotHelloWorldComponent extends JComponent\n{\n   public\
  \ static final int MESSAGE_X = 75;\n   public static final int MESSAGE_Y = 100;\n\
  \n   private static final int DEFAULT_WIDTH = 300;\n   private static final int\
  \ DEFAULT_HEIGHT = 200;\n\n   public void paintComponent(Graphics g)\n   {\n   \
  \   g.drawString(\"Not a Hello, World program\", MESSAGE_X, MESSAGE_Y);\n   }\n\n\
  \   public Dimension getPreferredSize() \n   {  \n      return new Dimension(DEFAULT_WIDTH,\
  \ DEFAULT_HEIGHT); \n   }\n}\n```\n\n`javax.swing.JFrame` 1.2\n\n* `Component add(Component\
  \ c)`\n    将给定的组件添加到此框架的内容面板并返回该组件。\n\n`java.awt.Component` 1.0\n\n* `void repaint()`\n\
  \    导致组件“尽快”进行重绘。\n\n* `Dimension getPreferredSize()`\n    用于重写以返回此组件的首选尺寸的方法。\n\
  \n`javax.swing.JComponent` 1.2\n\n* `void paintComponent(Graphics g)`\n    用于重写以描述你的组件如何如何绘制的方法。\n\
  \n`java.awt.Window` 1.0\n\n* `void pack()`\n    调整此窗口的大小，并考虑其组件的首选尺寸。\n\n### 使用\
  \ 2D 图形\n\n从 Java 1.0 开始，`Graphics` 类拥有了绘制线、矩形、椭圆等的方法。但那些绘制操作非常有限。我们将改用 Java 2D\
  \ 库中的形状类。\n\n要使用此库，你需要获取一个 `Graphics2D` 类的对象。该类是 `Graphics` 类的子类。从 Java 1.2 开始，像\
  \ `paintComponent` 等方法会自动接收一个 `Graphics2D` 类的对象。只需使用强制转换，如下：\n\n```java\npublic\
  \ void paintComponent(Graphics g)\n{\n   Graphics2D g2 = (Graphics2D) g;\n   . .\
  \ .\n}\n```\n\nJava 2D 库以面向对象的方式组织几何形状。特别是，有表示线、矩形和椭圆的类：\n\n```\nLine2D\nRectangle2D\n\
  Ellipse2D\n```\n\n这些类都实现了 `Shape` 接口。Java 2D 库支持更复杂的形状——弧、二次和三次曲线以及通用路径——这些在本章中不会讨论。\n\
  \n要绘制形状，你首先创建一个实现 `Shape` 接口的类的对象，然后调用 `Graphics2D` 类的 `draw` 方法。例如：\n\n```java\n\
  Rectangle2D rect = . . .;\ng2.draw(rect);\n```\n\nJava 2D 库使用浮点坐标而不是整数来表示像素。内部计算使用单精度\
  \ `float` 类型进行。单精度是足够的——毕竟，几何计算的最终目的是在屏幕或打印机上设置像素。只要任何舍入误差保持在一个像素以内，视觉结果就不会受到影响。\n\
  \n然而，对 `float` 值的操作对程序员有时是不方便的，因为 Java 坚持要求在将 `double` 值转换为 `float` 值时必须进行强制转换。例如，考虑以下语句：\n\
  \n```java\nfloat f = 1.2; // 错误--可能丢失精度\n```\n\n该语句无法编译，因为常量 `1.2` 的类型是 `double`，编译器担心会丢失精度。解决办法是在浮点数常量后添加\
  \ `F` 后缀：\n\n```java\nfloat f = 1.2F; // 正确\n```\n\n现在考虑这个语句：\n\n```java\nfloat\
  \ f = r.getWidth(); // 错误\n```\n\n此语句同样无法编译，原因相同。`getWidth` 方法返回一个 `double`。这次的解决办法是提供一个强制转换：\n\
  \n```java\nfloat f = (float) r.getWidth(); // 正确\n```\n\n这些后缀和转换有点麻烦，所以 2D 库的设计者决定为每个形状类提供两个版本：一个带有\
  \ `float` 坐标用于节约资源的程序员，另一个带有 `double` 坐标用于懒惰的人。（在本书中，我们属于第二个阵营，尽可能使用 `double` 坐标）。\n\
  \n\n\n\n库的设计者选择了一种奇奇的机制来封装这些选择。考虑 `Rectangle2D` 类。这是一个抽象类，具有两个具体的子类，这两个子类也是静态嵌套类：\n\
  \n```\nRectangle2D.Float\nRectangle2D.Double\n```\n\n图 10.5 显示了继承图。\n\n![Figure](img/07_08.jpg)2D\
  \ 矩形类\n\n最好忽略这两个具体类是静态内部类的事实——这仅仅是为了避免诸如 `FloatRectangle2D` 和 `DoubleRectangle2D`\
  \ 之类的名称。\n\n当你构造一个 `Rectangle2D.Float` 对象时，你提供 `float` 类型的数字坐标。对于 `Rectangle2D.Double`\
  \ 对象，你提供的 `double` 类型的数字。\n\n```\nvar floatRect = new Rectangle2D.Float(10.0F, 25.0F,\
  \ 22.5F, 20.0F);\nvar doubleRect = new Rectangle2D.Double(10.0, 25.0, 22.5, 20.0);\n\
  ```\n\n构造参数表示矩形的左上角、宽度和高度。\n\n`Rectangle2D` 的方法具有 `double` 类型的参数和返回类型。例如，`getWidth`\
  \ 方法返回一个 `double` 值，即使宽度在 `Rectangle2D.Float` 对象中是存储为 `float` 类型的。\n\n直接使用 `Double`\
  \ 形状类，可以完全避免处理 `float` 值。然而，如果你正在构造成千上万个形状对象，请考虑使用 `Float` 类以节约内存。\n\n我们刚才对 `Rectangle2D`\
  \ 类讨论的结论也适用于其他形状类。此外，还有一个 `Point2D` 类，其子类为 `Point2D.Float` 和 `Point2D.Double`。以下是创建点对象的方法：\n\
  \n```\nvar p = new Point2D.Double(10, 20);\n```\n\n`Rectangle2D` 和 `Ellipse2D` 类都继承自共同父类\
  \ `RectangularShape`。诚然，椭圆不是矩形，但它们有一个*边界矩形*（见图 10.6）。\n\n![Figure](img/07_09.jpg)椭形的边界矩形\n\
  \n`RectangularShape` 类定义了超过 20 个这些形状共同的方法，其中包含如 `getWidth`、`getHeight`、`getCenterX`\
  \ 和 `getCenterY` 等非常有用的方法（但遗憾的是，在本书期间，还没有一个返回 `Point2D` 对象的 `getCenter` 方法）。\n\n\
  最后，来自 Java 1.0 的几个遗留类被整合到了形状类层次结构中。`Rectangle` 和 `Point` 类存储具有整数坐标的矩形和点，它们继承了 `Rectangle2D`\
  \ 和 `Point2D` 类。\n\n图 10.7 显示了形状类之间的关系。然而，省略了 `Double` 和 `Float` 子类。遗留类用灰色填充标记。\n\
  \n![Figure](img/07_10.jpg)形状类之间的关系\n\n`Rectangle2D` 和 `Ellipse2D` 对象的构造很简单。你需要指定：\n\
  \n* 左上角的 *x* 和 *y* 坐标\n* 宽度和高度\n\n对于椭圆，这些指的是边界矩形。例如，\n\n```\nvar e = new Ellipse2D.Double(150,\
  \ 200, 100, 50);\n```\n\n构造了一个由矩形边界的椭圆，该矩形的左上角位于 (150, 200)，宽度为 100，高度为 50。\n\n\
  在构造椭圆时，你通常知道中心、宽度和高度，但不知道边界矩形的顶点（这些顶点甚至不在椭圆上）。`setFrameFromCenter` 方法使用中心点，但它仍然需要四个顶点之一。因此，你通常会按如下构造椭圆：\n\
  \n```\nvar ellipse =\n   new Ellipse2D.Double(centerX - width / 2, centerY - height\
  \ / 2, width, height);\n```\n\n要构造直线，你提供起点和终点，可以是 `Point2D` 对象或数字对：\n\n```\nvar\
  \ line = new Line2D.Double(start, end);\n```\n\n或者\n\n```\nvar line = new Line2D.Double(startX,\
  \ startY, endX, endY);\n```\n\nListing 10.3 中的程序绘制了一个矩形、包含在矩形内的椭圆、矩形的对角线以及一个与矩形中心相同的圆。图\
  \ 10.8 显示了结果。\n\n![Figure](img/drawtest.jpg)绘制几何形状 draw/DrawTest.java\n\n```\npackage\
  \ draw;\n\nimport java.awt.*;\nimport java.awt.geom.*;\nimport javax.swing.*;\n\n\
  /**\n * @version 1.34 2018-04-10\n * @author Cay Horstmann\n */\npublic class DrawTest\n\
  {\n   public static void main(String[] args)\n   {\n      EventQueue.invokeLater(()\
  \ ->\n         {\n            var frame = new DrawFrame();\n            frame.setTitle(\"\
  DrawTest\");\n            frame.setDefaultCloseOperation(JFrame.EXIT_ON_CLOSE);\n\
  \            frame.setVisible(true);\n         });\n   }\n}\n\n/**\n * 包含带有绘制面板的框架。\n\
  \ */\nclass DrawFrame extends JFrame\n{\n   public DrawFrame()\n   {      \n   \
  \   add(new DrawComponent());\n      pack();\n   }\n}\n\n/**\n * 显示矩形和椭圆的组件。\n */\n\
  class DrawComponent extends JComponent\n{\n   private static final int DEFAULT_WIDTH\
  \ = 400;\n   private static final int DEFAULT_HEIGHT = 400;\n\n   public void paintComponent(Graphics\
  \ g)\n   {\n      var g2 = (Graphics2D) g;\n\n      // 绘制矩形\n\n      double leftX\
  \ = 100;\n      double topY = 100;\n      double width = 200;\n      double height\
  \ = 150;\n\n      var rect = new Rectangle2D.Double(leftX, topY, width, height);\n\
  \   }\n}\n```\n\n\n\n`fill` 方法在右侧和底部绘制时少画一个像素。例如，如果你绘制一个 `new Rectangle2D.Double(0,\
  \ 0, 10, 20)`，那么绘制内容将包含 `x` = 10 和 `y` = 20 的像素。如果你填充同一个矩形，这些像素将不会被绘制。\n\n使用 `Color`\
  \ 类定义颜色。`java.awt.Color` 类为以下 13 种标准颜色预定义的常量：\n\n```\nBLACK, BLUE, CYAN, DARK_GRAY,\
  \ GRAY, GREEN, LIGHT_GRAY, \nMAGENTA, ORANGE, PINK, RED, WHITE, YELLOW\n```\n\n\
  你可以通过红、绿、蓝分量创建 `Color` 对象来指定自定义颜色，每个值的值于 `0` 到 `255` 之间：\n\n```\ng2.setPaint(new\
  \ Color(0, 128, 128)); // 一种暗的蓝绿色\ng2.drawString(\"Welcome!\", 75, 125);\n```\n\n\
  除了实色外，你还可以使用实现 `Paint` 接口的类的实例调用 `setPaint`。这允许使用渐变和纹理进行绘制。\n\n要设置组件的背景色，使用 `Component`\
  \ 类的 `setBackground` 方法，该类是 `JComponent` 的父类。\n\n```\nvar component = new MyComponent();\n\
  component.setBackground(Color.PINK);\n```\n\n还有一个 `setForeground` 方法。它指定了用于在组件上绘制的默认颜色。\n\
  \n### `java.awt.Color` 1.0\n\n* `Color(int r, int g, int b)`\n  创建一个具有给定红、绿、蓝分量的颜色对象，分量在\
  \ `0` 到 `255` 之间。\n\n### `java.awt.Graphics2D` 1.2\n\n* `Paint getPaint()`\n* `void\
  \ setPaint(Paint p)`\n  获取或设置此图形上下文的绘制画属性。`Color` 类实现了 `Paint` 接口。因此，你可以使用此方法将绘制画属性设置为实色。\n\
  * `void fill(Shape s)`\n  用当前的绘制画填充形状。\n\n### `java.awt.Component` 1.0\n\n* `Color\
  \ getForeground()`\n* `Color getBackground()`\n* `void setForeground(Color c)`\n\
  * `void setBackground(Color c)`\n  获取或设置前景颜色或背景颜色。\n\n### 使用字体\n\n本章开头的“不是 Hello\
  \ World”程序使用默认字体显示了一个字符串。有时，你可能希望用不同的字体显示文本。你可以通过 `font face name`（字面名称）指定字体。字面名称由\
  \ `font family name`（字体族名称，组成，例如“Helvetica”）和一个可选的后缀（如“Bold”）。例如，字面“Helvetica”和“Helvetica\
  \ Bold”都被视为名为“Helvetica”的字体族的一部分。\n\n要查找特定计算机上可用的字体，请调用 `GraphicsEnvironment` 类的\
  \ `getAvailableFontFamilyNames` 方法。该方法返回一个包含所有可用字体名称的字符串数组。要获取描述用户系统图形环境的 `GraphicsEnvironment`\
  \ 类实例，请使用静态方法 `getLocalGraphicsEnvironment`。以下程序将打印你系统上所有字体的名称：\n\n```java\nimport\
  \ java.awt.*;\n\npublic class ListFonts\n{\n   public static void main(String[]\
  \ args)\n   {\n      String[] fontNames = GraphicsEnvironment\n         .getLocalGraphicsEnvironment()\n\
  \         .getAvailableFontFamilyNames();\n      for (String fontName : fontNames)\n\
  \         System.out.println(fontName);\n   }\n}\n```\n\nAWT 定义了五个 `logical`（逻辑）字体名称：\n\
  \n```\nSansSerif\nSerif\nMonospaced\nDialog\nDialogInput\n```\n\n这些名称始终映射到客户端机器上实际存在的字体。例如，在\
  \ Windows 系统上，`SansSerif` 映射到 Arial。\n\n此外，Oracle JDK 始终包含三个名为“Lucida Sans”、“Lucida\
  \ Bright”和“Lucida Sans Typewriter”的字体族。\n\n要用某种字体绘制字符，必须先创建一个 `Font` 类的对象。指定字面名称、字体样式和点号大小。这是一个构造\
  \ `Font` 对象的示例：\n\n```java\nvar sansbold14 = new Font(\"SansSerif\", Font.BOLD,\
  \ 14);\n```\n\n第三个参数是点号大小。点在排版中通常用于指示字体的大小。每英寸有 72 点。\n\n你可以在 `Font` 构造函数中使用逻辑字体名称代替字面名称。通过将第二个\
  \ `Font` 构造函数参数设置为以下值之一来指定样式（普通、`bold`、`italic` 或 `bold italic`）：\n\n```\nFont.PLAIN\n\
  Font.BOLD\nFont.ITALIC\nFont.BOLD + Font.ITALIC\n```\n\n以下代码将使用你系统上的标准无衬线字体、使用 14\
  \ 点加粗字体来显示字符串“Hello, World!”：\n\n```java\nvar sansbold14 = new Font(\"SansSerif\"\
  , Font.BOLD, 14);\ng2.setFont(sansbold14);\nvar message = \"Hello, World!\";\ng2.drawString(message,\
  \ 75, 100);\n```\n\n接下来，让我们在组件中 `center`（居中）字符串，而不是在任意位置绘制它。我们需要知道字符串以像素为单位的宽高度。这些维度取决于三个因素：\n\
  \n* 使用的字体（在本例中为无衬线体、加粗、14 点）；\n* 字符串本身（在本例中为“Hello, World!”）；\n* 绘制字体的设备（在本例中为用户的屏幕）。\n\
  \n要获取一个代表屏幕设备字体特征的对象，调用 `Graphics2D` 类的 `getFontRenderContext` 方法。它返回一个 `FontRenderContext`\
  \ 类的对象。只需将该对象传递给 `Font` 类的 `getStringBounds` 方法：\n\n```java\nFontRenderContext context\
  \ = g2.getFontRenderContext();\nRectangle2D bounds = sansbold14.getStringBounds(message,\
  \ context);\n```\n\n`getStringBounds` 方法返回一个包含字符串的矩形。\n\n为了解释该矩形的维度，你应该了解一些排版术语（参见图\
  \ 10.9）。`baseline`（基线）是例如字符‘e’停留的虚拟线。`ascent`（升部）是从基线到 `ascender`（上伸部）的距离，例如字母‘b’或‘k’的上部。`descent`（下降部）是从基线到\
  \ `descender`（下部）的距离，例如字母‘p’或‘g’的底部。\n\n![Figure](img/07_12.jpg)排版术语图\n\nLeading（行间距）是一行下降部和下一行升部之间的空间。（该术语源于排字工人用来分隔行的铅条。）字体的\
  \ `height`（高度）是连续基线之间的距离，等于 descent + leading + ascent。\n\n`getStringBounds` 方法返回的矩形宽度是字符串的水平范围。矩形的高度是升部、下降部和平间距之和。矩形的起点位于字符串的基线。矩形的顶部\
  \ `y` 坐标为负值。因此，你可以如下所示获取字符串宽度、高度和升部：\n\n```java\ndouble stringWidth = bounds.getWidth();\n\
  double stringHeight = bounds.getHeight();\ndouble ascent = -bounds.getY();\n```\n\
  \n如果你需要下降部或行间距，请使用 `Font` 类的 `getLineMetrics` 方法。该方法返回一个 `LineMetrics` 类对象，该类拥有获取下降部和行间距的方法：\n\
  \n```java\nLineMetrics metrics = f.getLineMetrics(message, context);\nfloat descent\
  \ = metrics.getDescent();\n```\n\n当你 as 在 `paintComponent` 方法外部计算布局维度时，无法从 `Graphics2D`\
  \ 对象获取字体渲染上下文。相反，调用 `JComponent` 类的 `getFontMetrics` 方法，然后调用 `getFontRenderContext`。\n\
  \n```\nFontRenderContext context = getFontMetrics(f).getFontRenderContext();\n```\n\
  \n为了显示位置是准确的，列表 10.4 中的示例程序将字符串在框架中居中，并绘制基线和边界矩形。图 10.10 显示了屏幕显示。\n\n![Figure](img/fonttest.jpg)绘制基线和字符串边界\
  \ font/FontTest.java\n\n\n\n\n\n```\npackage font;\n\nimport java.awt.*;\nimport\
  \ java.awt.font.*;\nimport java.awt.geom.*;\nimport javax.swing.*;\n\n/**\n * @version\
  \ 1.35 2018-04-10\n * @author Cay Horstmann\n */\npublic class FontTest\n{\n   public\
  \ static void main(String[] args)\n   {\n      EventQueue.invokeLater(() ->\n  \
  \       {\n            var frame = new FontFrame();\n            frame.setTitle(\"\
  FontTest\");\n            frame.setDefaultCloseOperation(JFrame.EXIT_ON_CLOSE);\n\
  \            frame.setVisible(true);\n         });\n   }\n}\n\n/**\n * 一个带有文本消息组件的框架。\n\
  \ */\nclass FontFrame extends JFrame\n{\n   public FontFrame()\n   {      \n   \
  \   add(new FontComponent());\n      pack();\n   }\n}\n\n/**\n * 一个在框中显示居中消息的组件。\n\
  \ */\nclass FontComponent extends JComponent\n{\n   private static final int DEFAULT_WIDTH\
  \ = 300;\n   private static final int DEFAULT_HEIGHT = 200;\n\n   public void paintComponent(Graphics\
  \ g)\n   {\n      var g2 = (Graphics2D) g;\n\n      String message = \"Hello, World!\"\
  ;\n\n      var f = new Font(\"Serif\", Font.BOLD, 36);\n      g2.setFont(f);\n\n\
  \      // 测量消息的大小\n\n      FontRenderContext context = g2.getFontRenderContext();\n\
  \      Rectangle2D bounds = f.getStringBounds(message, context);\n\n      // 设置\
  \ (x,y) = 文本左上角\n\n      double x = (getWidth() - bounds.getWidth()) / 2;\n    \
  \  double y = (getHeight() - bounds.getHeight()) / 2;\n\n      // 将上升高度加到 y 以到达基线\n\
  \n      double ascent = -bounds.getY();\n      double baseY = y + ascent;\n\n  \
  \    // 绘制消息\n\n      g2.drawString(message, (int) x, (int) baseY);\n\n      g2.setPaint(Color.LIGHT_GRAY);\n\
  \n      // 绘制基线\n\n      g2.draw(new Line2D.Double(x, baseY, x + bounds.getWidth(),\
  \ baseY));\n\n      // 绘制外围矩形\n\n      var rect = new Rectangle2D.Double(x, y, bounds.getWidth(),\
  \ bounds.getHeight());\n      g2.draw(rect);\n   }\n\n   public Dimension getPreferredSize()\
  \ \n   { \n      return new Dimension(DEFAULT_WIDTH, DEFAULT_HEIGHT); \n   }\n}\n\
  ```\n\n`java.awt.Font` 1.0\n\n*   `Font(String name, int style, int size)`\n   \
  \ \n    创建一个新的字体对象。字体名称可以是字体脸名称（例如 `\"Helvetica Bold\"`）或逻辑字体名称（例如 `\"Serif\"`、`\"\
  SansSerif\"`）。样式为 `Font.PLAIN`、`Font.BOLD`、`Font.ITALIC` 或 `Font.BOLD + Font.ITALIC`\
  \ 之一。\n\n*   `String getFontName()`\n\n    获取字体脸名称（例如 `\"Helvetica Bold\"`）。\n\n\
  *   `String getFamily()`\n\n    获取字体族名称（例如 `\"Helvetica\"`）。\n\n*   `String getName()`\n\
  \n    如果字体是使用逻辑字体名称创建的，则获取逻辑名称（例如 `\"SansSerif\"`）；否则获取字体脸名称。\n\n*   `Rectangle2D\
  \ getStringBounds(String s, FontRenderContext context)` 1.2\n\n    返回一个包含字符串的矩形。矩形的原点位于基线上。矩形顶部的\
  \ `y` 坐标等于上升高度的负值。矩形的高度等于上升高度、下降高度和行距之和。宽度等于字符串宽度。\n\n*   `LineMetrics getLineMetrics(String\
  \ s, FontRenderContext context)` 1.2\n\n    返回一个行度对象以确定字符串的范围。\n\n`java.awt.font.LineMetrics`\
  \ 1.2\n\n*   `float getAscent()`\n\n    获取字体上升高度（ascent）：从基线到大写字母顶部的距离。\n\n*   `float\
  \ getDescent()`\n\n    获取字体下降高度（descent）：从基线到下降字母底部的距离。\n\n*   `float getLeading()`\n\
  \n    获取行间距（leading）：一行文本底部与下一行文本顶部之间的空间。\n\n*   `float getHeight()`\n\n    获取字体的总高度——文本两个基线之间的距离（下降高度\
  \ + 行间距 + 上升高度）。\n\n`java.awt.Graphics2D` 1.2\n\n*   `FontRenderContext getFontRenderContext()`\n\
  \n    获取一个指定此图形上下字体特征的字体渲染上下文。\n\n*   `void drawString(String str, float x, float\
  \ y)`\n\n    用当前的字体和颜色绘制字符串。\n\n`javax.swing.JComponent` 1.2\n\n*   `FontMetrics\
  \ getFontMetrics(Font f)` 5.0\n\n    获取给定字体的字体度量。`FontMetrics` 类是 `LineMetrics`\
  \ 类的前身。\n\n`java.awt.FontMetrics` 1.0\n\n*   `FontRenderContext getFontRenderContext()`\
  \ 1.2\n\n    获取该字体的字体渲染上下文。\n\n### 显示图像\n\n你可以使用 `ImageIcon` 类从文件读取图像：\n\n```\n\
  Image image = new ImageIcon(filename).getImage();\n```\n\n现在变量 `image` 包含一个封装图像对象的引用。\n\
  \n## 事件处理\n\n任何支持 GUI 的操作系统都会不断监控诸如击键或鼠标点击等事件。这些事件随后会报告给运行的程序。每个程序然后决定对这些事件做些什么（如果需要话）。\n\
  \n### 基础事件处理概念\n\n\n\n\n\n在 Java AWT 中，`event sources`（事件源，如按钮或滚动条）拥有允许你注册 `event\
  \ listeners`（事件监听器）的方法——即执行所需响应的对象。\n\n当事件监听器收到事件通知时，有关事件的信息会被封装在 `event object`（事件对象）中。在\
  \ Java 中，所有事件对象最终派自 `java.util.EventObject` 类。当然，每种事件类型都有相应的子类，例如 `ActionEvent`\
  \ 和 `WindowEvent`。\n\n不同的事件源可以产生不同类型的事件。例如，按钮可以发送 `ActionEvent` 对象，而窗口可以发送 `WindowEvent`\
  \ 对象。\n\n总而言之，这里是 AWT 事件处理工作原理概述：\n\n- 事件监听器是实现 `listener interface`（监听器接口）的类的实例。\n\
  - 事件源是一个可以注册监听器对象并向它们发送事件对象的对象。\n- 当事件发生时，事件会将事件对象发送给所有已注册的监听器。\n- 监听器对象使用事件对象中的信息来确定它们对事件的反应。\n\
  \nFigure 10.12 显示了事件处理类与接口之间的关系。\n\n![Figure](img/08_01.jpg)事件源与监听器之间的关系\n\n这里是一个指定监听器的示例：\n\
  \n```\nActionListener listener = . . .;\nvar button = new JButton(\"OK\");\nbutton.addActionListener(listener);\n\
  ```\n\n现在，每当按钮发生“动作事件”时，`listener` 对象就会收到通知。对于按钮来说，正如你预期的，动作事件就是按钮点击。\n\n要实现 `ActionListener`\
  \ 接口，监听器类必须有一个名为 `actionPerformed` 的方法，该方法接收一个 `ActionEvent` 对象作为参数。\n\n```\nclass\
  \ MyListener implements ActionListener\n{\n   . . .\n   public void actionPerformed(ActionEvent\
  \ event)\n   {\n      // 对按钮点击的响应写在这里\n      . . .\n   }\n}\n```\n\n每当用户点击按钮时，`JButton`\
  \ 对象创建一个 `ActionEvent` 对象并调用 `listener.actionPerformed(event)`，传递该事件对象。像按钮这样的事件源可以有多个监听器。在这种情况下，每当用户点击按钮时，按钮都会调用所有监听器的\
  \ `actionPerformed` 方法。\n\nFigure 10.13 显示了事件源、事件监听器和事件对象之间的交互。\n\n![Figure](img/08_02.jpg)事件通知\n\
  \n### 示例：处理按钮点击\n\n为了熟悉事件委托模型，让我们详细了解响应按钮点击的简单示例所需的所有细节。在这个示例中，我们将展示一个包含三个按钮的面板（panel）。将三个监听器对象作为动作监听器添加到按钮中。\n\
  \n在这种场景下，每当用户点击面板上的任何一个按钮时，关联的监听器对象都会接收一个指示按钮点击的 `ActionEvent`。在我们的示例程序中，监听器对象将更改面板的背景颜色。\n\
  \n在向你展示监听按钮点击的程序之前，我需要解释如何创建按钮以及如何将它们添加到面板中。\n\n要创建一个按钮，请在按钮构造函数中指定标签字符串、图标或两者兼有。这里有两个示例：\n\
  \n```\nvar yellowButton = new JButton(\"Yellow\");\nvar blueButton = new JButton(new\
  \ ImageIcon(\"blue-ball.gif\"));\n```\n\n调用 `add` 方法将按钮添加到面板中：\n\n```\nvar yellowButton\
  \ = new JButton(\"Yellow\");\nvar blueButton = new JButton(\"Blue\");\nvar redButton\
  \ = new JButton(\"Red\");\n\nbuttonPanel.add(yellowButton);\nbuttonPanel.add(blueButton);\n\
  buttonPanel.add(redButton);\n```\n\nFigure 10.14 显示了结果。\n\n![Figure](img/buttontest1.jpg)填满按钮的面板\n\
  \n接下来，我们需要添加监听这些按钮的代码。这需要实现 `ActionListener` 接口的类，正如我刚刚提到的，它包含一个方法：`actionPerformed`，其签名如下：\n\
  \n```\npublic void actionPerformed(ActionEvent event)\n```\n\n使用 `ActionListener`\
  \ 接口的方法在所有情况下都是一致的：`actionPerformed` 方法（它是 `ActionListener` 中唯一的方法）有一个一个 `ActionEvent`\
  \ 类型的对象作为参数。这个事件对象向你提供了有关所发生事件的信息。\n\n当按钮被点击时，我们希望面板的背景颜色更改为特定的颜色。我们将所需的颜色存储在监听器类中。\n\
  \n```\nclass ColorAction implements ActionListener\n{\n   private Color backgroundColor;\n\
  \n   public ColorAction(Color c)\n   {\n      backgroundColor = c;\n   }\n\n   public\
  \ void actionPerformed(ActionEvent event)\n   {\n      // 设置面板背景颜色\n      . . .\n\
  \   }\n}\n```\n\n然后我们为每个颜色构造一个对象，并将这些对象设置为按钮的监听器。\n\n```\nvar yellowAction = new\
  \ ColorAction(Color.YELLOW);\nvar blueAction = new ColorAction(Color.BLUE);\nvar\
  \ redAction = new ColorAction(Color.RED);\n\nyellowButton.addActionListener(yellowAction);\n\
  blueButton.addActionListener(blueAction);\nredButton.addActionListener(redAction);\n\
  ```\n\n例如，如果用户点击标记为“Yellow”的按钮，`yellowAction` 对象的 `actionPerformed` 方法会被调用。它的 `backgroundColor`\
  \ 实例字段被设置为 `Color.YELLOW`，它可以继续设置面板的背景颜色。剩下的问题是：`ColorAction` 对象无法访问 `buttonPanel`\
  \ 变量。你可以通过两种方式解决这个问题：可以在 `ColorAction` 构造函数中存储面板；或者，更方便的方法是将 `ColorAction` 设为 `ButtonFrame`\
  \ 的内部类。这样它的方法就可以自动访问面板了。\n\nListing 10.6 包含了完整的框架类。每当你点击其中一个按钮时，相应的监听器就会更改面板的背景颜色。\n\
  \nbutton/ButtonFrame.java\n\n```\npackage button;\n\nimport java.awt.*;\nimport\
  \ java.awt.event.*;\nimport javax.swing.*;\n\n/**\n * 一个带有按钮面板的框架。\n */\npublic\
  \ class ButtonFrame extends JFrame\n{\n   private JPanel buttonPanel;\n   private\
  \ static final int DEFAULT_WIDTH = 300;\n   private static final int DEFAULT_HEIGHT\
  \ = 200;\n\n   public ButtonFrame()\n   {      \n      setSize(DEFAULT_WIDTH, DEFAULT_HEIGHT);\n\
  \n      // 创建按钮\n      var yellowButton = new JButton(\"Yellow\");\n      var blueButton\
  \ = new JButton(\"Blue\");\n      var redButton = new JButton(\"Red\");\n\n    \
  \  buttonPanel = new JPanel();\n\n      // 将按钮添加到面板\n      buttonPanel.add(yellowButton);\n\
  \      buttonPanel.add(blueButton);\n      buttonPanel.add(redButton);\n\n     \
  \ // 将面板添加到框架\n      add(buttonPanel);\n\n      // 创建按钮动作\n      var yellowAction\
  \ = new ColorAction(Color.YELLOW);\n      var blueAction = new ColorAction(Color.BLUE);\n\
  \      var redAction = new ColorAction(Color.RED);\n\n      // 将动作与按钮关联\n      yellowButton.addActionListener(yellowAction);\n\
  \      blueButton.addActionListener(blueAction);\n      redButton.addActionListener(redAction);\n\
  \   }\n\n   /**\n    * 设置面板背景色的监听器。\n    */\n   private class ColorAction implements\
  \ ActionListener\n   {\n      private Color backgroundColor;\n\n      public ColorAction(Color\
  \ c)\n      {\n         backgroundColor = c;\n      }\n\n      public void actionPerformed(ActionEvent\
  \ event)\n      {\n         buttonPanel.setBackground(backgroundColor);\n      }\n\
  \   }\n}\n```\n\n`javax.swing.JButton` 1.2\n\n*   `JButton(String label)`\n\n* \
  \  `JButton(Icon icon)`\n\n*   `JButton(String label, Icon icon)`\n\n    构造一个按钮。标签字符串可以是纯文本或\
  \ HTML；例如，`\"<html><b>Ok</b></html>\"`。 \n\n`java.awt.Container` 1.0\n\n*   `Component\
  \ add(Component c)`\n\n    将组件 `c` 添加到此容器中。\n\n### 简洁地指定监听器\n\n\n\n\n\n在上一节中，我们为事件监听器定义了一个类，并构造了该类的三个对象。让一个监听器类拥有多个实例并不十分常见。大多数情况下，每个监听器都执行一个独立的操作。在这种情况下，没有必要创建一个单独的类。只需使用\
  \ lambda 表达式即可：\n\n```\nexitButton.addActionListener(event -> System.exit(0));\n\
  ```\n\n现在考虑有多个相关操作的情况，例如上一节中的颜色按钮。在这种情况下，实现一个辅助方法：\n\n```java\npublic void makeButton(String\
  \ name, Color backgroundColor)\n{\n   var button = new JButton(name);\n   buttonPanel.add(button);\n\
  \   button.addActionListener(event ->\n      buttonPanel.setBackground(backgroundColor));\n\
  }\n```\n\n注意，该 lambda 表达式引用了参数变量 `backgroundColor`。\n\n然后我们只需调用：\n\n```\nmakeButton(\"\
  yellow\", Color.YELLOW);\nmakeButton(\"blue\", Color.BLUE);\nmakeButton(\"red\"\
  , Color.RED);\n```\n\n在这里，我们构造了三个监听器对象，每个颜色对应一个，而没有显式地定义类。每当调用一次辅助方法时，它就会创建一个实现\
  \ `ActionListener` 接口的类实例。它的 `actionPerformed` 引用了 `backGroundColor` 值，该值实际上是存储在监听器对象中的。然而，这一切的发生都不需要你显式地定义监听器类、实例变量或设置它们的构造函数。\n\
  \n在旧的代码中，你经常会看到匿名类的使用：\n\n```java\nexitButton.addActionListener(new ActionListener()\n\
  \   {\n      public void actionPerformed(new ActionEvent)\n      {\n         System.exit(0);\n\
  \      }\n   });\n```\n\n当然，这种相当冗长的代码不再需要了。使用 lambda 表达式更加简单清晰。\n\n### 适配器类 (Adapter\
  \ Classes)\n\n并不是所有的事件都像按钮点击那样容易处理。假设你想监控用户尝试关闭主窗口的情况，以便仅在用户同意时才弹出对话框并退出程序。\n\n\
  当用户尝试关闭窗口时，`JFrame` 对象是 `WindowEvent` 的源。如果你想捕获该事件，必须有一个适当的监听器对象，并将其添加到框架的窗口监听器列表中。\n\
  \n```\nWindowListener listener = . . .;\nframe.addWindowListener(listener);\n```\n\
  \n窗口监听器必须是一个实现 `WindowListener` 接口的类的对象。`WindowListener` 接口实际上有七个方法。框架调用这些方法作为窗口可能发生的七种不同事件的响应。这些名称是自言自明的，除了“iconified”（图标化）在\
  \ Windows 下通常被称为“minimized”（最小化）。这里是完整的 `WindowListener` 接口：\n\n```java\npublic\
  \ interface WindowListener\n{\n   void windowOpened(WindowEvent e);\n   void windowClosing(WindowEvent\
  \ e);\n   void windowClosed(WindowEvent e);\n   void windowIconified(WindowEvent\
  \ e);\n   void windowDeiconified(WindowEvent e);\n   void windowActivated(WindowEvent\
  \ e);\n   void windowDeactivated(WindowEvent e);\n}\n```\n\n当然，我们可以定义实现接口的类，在 `windowClosing`\
  \ 方法中添加对 `System.exit(0)` 的调用，并为其他六个方法编写空函数。然而，六六无所事的方法编写代码是没人喜欢的枯燥工作。为了简化这项任务，每个具有多个方法的\
  \ AWT 监听器接口都带有一个配套的*适配器*（adapter）类，该类实现了接口中的所有方法但对它们什么都不做。例如，`WindowAdapter` 类有七个空方法。你扩展这个适配器类来指定对接口中某些（而非所有）事件类型的预期响应。（对于像\
  \ `ActionListener` 这样只有一个方法的接口，不需要适配器类。）\n\n以下是我们如何定义一个重写了 `windowClosing` 方法的窗口监听器：\n\
  \n```java\nclass Terminator extends WindowAdapter\n{\n   public void windowClosing(WindowEvent\
  \ e)\n   {\n      if (user agrees)\n         System.exit(0);\n   }\n}\n```\n\n现在你可以注册一个\
  \ `Terminator` 类型的对象作为事件监听器：\n\n```\nvar listener = new Terminator();\nframe.addWindowListener(listener);\n\
  ```\n\n在如今，人们会将 `WindowListener` 接口的空方法实现为默认方法（default methods）。然而，Swing 发明于默认方法出现之前。\n\
  \n`java.awt.event.WindowListener` 1.1\n\n* `void windowOpened(WindowEvent e)` 在窗口打开后被调用。\n\
  * `void windowClosing(WindowEvent e)` 在用户发出关闭窗口的管理器命令时被调用。注意，只有当调用了 `hide` 或 `dispose`\
  \ 方法时，窗口才会关闭。\n* `void windowClosed(WindowEvent e)` 在窗口关闭后被调用。\n* `void windowIconified(WindowEvent\
  \ e)` 在窗口图标化后被调用。\n* `void windowDeiconified(WindowEvent e)` 在窗口取消图标化后被调用。\n* `void\
  \ windowActivated(WindowEvent e)` 在窗口变为激活后被调用。只有框架或对话框可以是激活的。通常，窗口管理器会对激活窗口进行装饰——例如通过高亮标题栏。\n\
  * `void windowDeactivated(WindowEvent e)` 在窗口变为失效后被调用。\n\n`java.awt.event.WindowStateListener`\
  \ 1.4\n\n* `void windowStateChanged(WindowEvent e)` 在窗口最大化、图标化或恢复尺寸后被调用。\n\n###\
  \ Actions\n\n同一个命令有多种激活方式是常见现象。用户可以通过菜单、按键或工具栏上的按钮来选择某个功能。这在 AWT 事件模型中很容易实现：将所有事件链接到同一个监听器。例如，假设\
  \ `blueAction` 是一个动作监听器，其 `actionPerformed` 方法将背景改为蓝色。你可以将同一个对象作为监听器附加到多个地方：\n\n\
  * 一个标记为“Blue”的工具栏按钮\n* 一个标记为“Blue”的菜单项\n* 一个组合键 Ctrl+B\n\n颜色更改命令现在将以统一的方式处理，无论它是由按钮点击、菜单选择还是按键引起的。\n\
  \nSwing 包提供了一个非常有用的机制来封装命令并将其附加到多个源：`Action` 接口。一个*动作*（action）是一个封装了对象：\n\n* 命令的描述（作为文本字符串和可选图标）；以及\n\
  * 执行命令所需的参数（例如我们示例中请求的颜色）。\n\n`Action` 接口具有以下方法：\n\n```java\nvoid actionPerformed(ActionEvent\
  \ event)\nvoid setEnabled(boolean b)\nboolean isEnabled()\nvoid putValue(String\
  \ key, Object value)\nObject getValue(String key)\nvoid addPropertyChangeListener(PropertyChangeListener\
  \ listener)\nvoid removePropertyChangeListener(PropertyChangeListener listener)\n\
  ```\n\n第一个方法是 `ActionListener` 接口中熟悉的方法；事实上，`Action` 接口扩展了 `ActionListener` 接口。因此，在需要\
  \ `ActionListener` 对象的地方，你都可以使用 `Action` 对象。\n\n接下来两个方法允许你启用或禁用动作，并检查动作当前是否处于启用状态。当动作附加到菜单或工具栏且该动作被禁用时，该选项将变为灰色。\n\
  \n`putValue` 和 `getValue` 方法允许你在动作对象中存储和检索任意的名称/值对。几个重要的预定义字符串，即 `Action.NAME` 和\
  \ `Action.SMALL_ICON`，将动作名称和图标存储到动作对象中：\n\n```\naction.putValue(Action.NAME, \"\
  Blue\");\naction.putValue(Action.SMALL_ICON, new ImageIcon(\"blue-ball.gif\"));\n\
  ```\n\n表 10.1 显示了所有预定义的动作表名称。\n\n预定义动作名称\n\n| Name | Value |\n| --- | --- |\n\n\n\
  \n\n\n| `NAME` | 动作的名称，显示在按钮和菜单项上。 |\n| :--- | :--- |\n| `SMALL_ICON` | 存储小型图标的地方，用于在按钮、菜单项或工具栏显示。\
  \ |\n| `SHORT_DESCRIPTION` | 图标的短描述，显示在工具提示中。 |\n| `LONG_DESCRIPTION` | 图标的详细描述，可能用于在线帮助文档。没有\
  \ Swing 组件使用此值。 |\n| `MNEMONIC_KEY` | 显示在菜单项中的助记缩写。 |\n| `ACCELERATOR_KEY` | 存储快捷键组合键的地方。没有\
  \ Swing 组件使用此值。 |\n| `ACTION_COMMAND_KEY` | 在历史上，曾用于已废弃的 `registerKeyboardAction`\
  \ 方法。 |\n| `DEFAULT` | 潜在通用的全能型属性。没有 Swing 组件使用此值。 |\n\n如果将动作对象添加到菜单或工具栏中，名称和图标将自动获取并显示在菜单项或工具栏按钮中。`SHORT_DESCRIPTION`\
  \ 的值将变为工具提示。\n\n`Action` 接口的最后两个方法允许其他对象（特别是触发动作的菜单或工具栏）在动作对象的属性发生时接收通知。例如，如果一个菜单被设置为动作对象的属性更改监听器，并且随后该动作对象被禁用，则该菜单会被调用并将动作名称设为灰色。\n\
  \n注意 `Action` 是一个 `interface`（接口），而不是类。任何实现此接口的类必须实现我们刚刚讨论的七个方法。幸运的是，热心的人提供了一个 `AbstractAction`\
  \ 类，它实现了除了 `actionPerformed` 之外的所有方法。该类负责存储所有的键/值对并管理属性更改监听器。你只需要扩展 `AbstractAction`\
  \ 并提供一个 `actionPerformed` 方法即可。\n\n让我们构建一个可以执行颜色更改命令的动作对象。我们存储命令的名称、图标和所需的颜色。我们将颜色存储在\
  \ `AbstractAction` 类提供的键/值对表中。下面是 `ColorAction` 类的代码。构造函数设置键/值对，`actionPerformed`\
  \ 方法执行颜色更改动作。\n\n```\npublic class ColorAction extends AbstractAction\n{\n   public\
  \ ColorAction(String name, Icon icon, Color c)\n   {\n      putValue(Action.NAME,\
  \ name);\n      putValue(Action.SMALL_ICON, icon);\n      putValue(\"color\", c);\n\
  \      putValue(Action.SHORT_DESCRIPTION, \"Set panel color to \" + name.toLowerCase());\n\
  \   }\n\n   public void actionPerformed(ActionEvent event)\n   {\n      Color c\
  \ = (Color) getValue(\"color\");\n      buttonPanel.setBackground(c);\n   }\n}\n\
  ```\n\n我们的测试程序创建了该类的三个对象，例如：\n\n```\nvar blueAction = new ColorAction(\"Blue\",\
  \ new ImageIcon(\"blue-ball.gif\"), Color.BLUE);\n```\n\n接下来，我们将此动作与按钮关联。这很容易，因为我们可以使用接收\
  \ `Action` 对象的 `JButton` 构造函数。\n\n```\nvar blueButton = new JButton(blueAction);\n\
  ```\n\n该构造函数从动作中读取名称和图标，将短描述设置为工具提示，并将该动作设置为监听器。你可以在 图 10.15 中看到图标和工具提示。\n\n正如下一章所示，将相同的动作添加到菜单中同样简单。\n\
  \n![Figure](img/actiontest.jpg)按钮显示来自动作对象的图标。\n\n最后，我们想将动作对象与快捷键关联，这样当用户输入键盘命令时就会执行动作。要将动作与快捷键关联，你首先需要生成\
  \ `KeyStroke` 类的对象。这个便利类封装了按键的描述。要生成 `KeyStroke` 对象，不要调用构造函数，而是要使用 `KeyStroke` 类的静态方法\
  \ `getKeyStroke`。\n\n```\nKeyStroke ctrlBKey = KeyStroke.getKeyStroke(\"ctrl B\"\
  );\n```\n\n为了理解下一步，你需要理解 `keyboard focus`（键盘焦点）的概念。用户界面可以有许多按钮、菜单、滚动条和其他组件。当你按下按键时，它会被发送到拥有焦点的组件。该组件通常（但并非总是）在视觉上有所区分。例如，在\
  \ Java 视图外观中，获得焦点的按钮在按钮文字周围有一个细的矩形边框。你可以使用 Tab 键在组件之间移动焦点。当你按下空格键时，获得焦点的按钮会被点击。其他键执行不同的动作；例如，方向键可以移动滚动条。\n\
  \n然而，在我们的情况下，我们不希望将快捷键发送到拥有焦点的组件。否则，每个按钮都需要知道如何处理 Ctrl+Y、Ctrl+B 和 Ctrl+R 键。\n\n\
  这是一个常见问题，Swing 设计者想出了方便的解决方案。每个 `JComponent` 都有三个 `input maps`（输入映射），每个映射将 `KeyStroke`\
  \ 对象映射到关联的动作。三个输入映射对应三个不同的条件（参见 表 10.2）。\n\n### Input Map Conditions\n\n| Flag |\
  \ Invoke Action |\n| --- | --- |\n| `WHEN_FOCUSED` | 当此组件拥有焦点时 |\n| `WHEN_ANCESTOR_OF_FOCUSED_COMPONENT`\
  \ | 当此组件包含拥有焦点的组件时 |\n| `WHEN_IN_FOCUSED_WINDOW` | 当此组件处于焦点窗口内时 |\n\n快捷键处理按以下顺序检查这些映射：\n\
  \n1. 检查焦点组件的 `WHEN_FOCUSED` 映射。如果快捷键存在且对应的动作已启用，则执行该动作并停止处理。\n2. 从焦点组件开始，检查其父组件的\
  \ `WHEN_ANCESTOR_OF_FOCUSED_COMPONENT` 映射。一旦发现带有已启用动作的映射，立即执行该动作并停止处理。\n3. 查看焦点窗口中所有可见且启用的组件，这些组件在\
  \ `WHEN_IN_FOCUSED_WINDOW` 映射中注册了该快捷键。执行该动作。\n\n要从组件获取输入映射，请使用 `getInputMap` 方法。这是一个示例：\n\
  \n```\nInputMap imap = panel.getInputMap(JComponent.WHEN_FOCUSED);\n```\n\n`WHEN_FOCUSED`\
  \ 条件意味着当当前组件拥有键盘焦点时会查询此映射。在我们的情况下，这不是我们想要的映射。其中一个按钮（而不是面板）拥有输入焦点。另外两个映射选择中的任何一个都可以插入颜色更改快捷键。我们在示例中使用了\
  \ `WHEN_ANCESTOR_OF_FOCUSED_COMPONENT`。\n\n\n\n\n总结来说，以下是响应按钮、菜单项或按键击时执行相同操作的步骤：\n\
  \n1.  实现一个继承自 `AbstractAction` 的类。你可能可以在多个相关动作中使用同一个类。\n2.  构造该动作类的对象。\n3.  从动作对象构造按钮或菜单项。构造函数将从动作对象中读取标签文本（label\
  \ text）和图标。\n4.  对于可以通过按键触发的动作，你必须执行额外的步骤。首先，找到窗口的顶层组件，例如包含所有其他组件的面板（panel）。\n5.\
  \  然后，获取顶层组件的 `WHEN_ANCESTOR_OF_FOCUSED_COMPONENT` 输入映射。为所需的按键创建一个 `KeyStroke` 对象。创建一个动作键对象，例如一个描述你动作的字符串。将键对（按键，\
  \ 动作键）添加到输入映射中。\n6.  最后，获取顶层组件的动作映射（action map）。将键对（动作键，动作对象）添加到映射中。\n\n### `javax.swing.Action`\
  \ 1.2\n\n* `boolean isEnabled()`\n* `void setEnabled(boolean b)`\n  获取或设置此动作的 `enabled`\
  \ 属性。\n* `void putValue(String key, Object value)`\n  在动作对象内部放置一个键/值对。键可以是任何字符串，但某些名称具有预定义的含义——参见表\
  \ 10.1。\n* `Object getValue(String key)`\n  返回所存储的名称/值对的值。\n\n### `javax.swing.KeyStroke`\
  \ 1.2\n\n* `static KeyStroke getKeyStroke(String description)`\n  根据人类可读的描述（一组由空格分隔的字符串）构造按键。描述以零或多个修饰符（`shift`,\
  \ `control`, `ctrl`, `meta`, `alt`, `altGraph`）开始，并以字符串 `typed` 结尾，随后紧跟一个单字符的字符串（例如\
  \ `\"typed a\"`），或者一个可选的事件指定符（`pressed` 或 `released`，其中 `pressed` 为默认），随后紧跟一个键码。键码以\
  \ `VK_` 为缀时，应对应于 `KeyEvent` 常量；例如，`\"INSERT\"` 对应于 `KeyEvent.VK_INSERT`。\n\n####\
  \ `javax.swing.JComponent` 1.2\n\n* `ActionMap getActionMap()` 1.3\n  返回将动作映射键（任意对象）与\
  \ `Action` 对象关联的映射。\n* `InputMap getInputMap(int flag)` 1.3\n  获取将按键映射到动作映射键的输入映射。`flag`\
  \ 是表 10.2 中的值之一。\n\n### 鼠标事件\n\n如果你只是想让用户能够点击按钮或菜单，则不需要显式地处理鼠标事件。这些鼠标操作是由用户界面中的各种组件内部处理的。然而，如果你想让用户使用鼠标绘图，你需要捕获鼠标移动、点击和拖动事件。\n\
  \n在本节中，我向你展示一个简单的图形编辑器应用程序，它允许用户在画布上放置、移动和删除正方形（参见图 10.16）。\n\n![Figure](img/mousetest.jpg)一个鼠标测试程序\n\
  \n当用户点击鼠标按钮时，会调用三个监听器方法：当鼠标首次按下时调用 `mousePressed`，当鼠标释放时调用 `mouseReleased`，最后调用\
  \ `mouseClicked`。如果你只对完整的点击感兴趣，可以忽略前两个方法。通过使用 `MouseEvent` 参数上的 `getX` 和 `getY`\
  \ 方法，你可以获取鼠标被点击时鼠标指针的 `x` 和 `y` 坐标。要区分单击、双击和三击（!），请使用 `getCount` 方法。当用户点击鼠标按钮时，会调用三个监听器方法：当鼠标首次按下时调用\
