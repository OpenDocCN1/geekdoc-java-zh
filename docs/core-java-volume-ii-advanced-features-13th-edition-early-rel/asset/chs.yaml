  \n在少数情况下，你可能需要微调序列化机制。可序列化类可以通过定义签名如下的方法，为默认的读写行为添加任何所需的的操作：\n\n```\n@Serial private\
  \ void readObject(ObjectInputStream in)\n      throws IOException, ClassNotFoundException;\n\
  @Serial private void writeObject(ObjectOutputStream out)\n      throws IOException;\n\
  ```\n\n此时，对象头将像通常一样继续写入，但字段不再被自动序列化。相反，将调用这些方法。\n\n注意 `@Serial` 注解。用于微调序列化的方法不属于接口。因此，你不能使用\
  \ `@Override` 注解来让编译器检查方法声明。`@Serial` 注解旨在为序列化方法启用相同的检查。在 Java 21 之前，`javac` 编译器并不进行此类检查，但这在未来可能会发生变化。IntelliJ\
  \ IDE 使用了该注解。\n\n这是一个典型的自定义示例。`java.awt.geom` 包中的许多类（例如 `Point2D.Double`）不是可序列化的。现在，假设你想序列化一个存储了\
  \ `String` 和 `Point2D.Double` 的 `LabeledPoint` 类。首先，你需要将 `Point2D.Double` 字段标记为\
  \ `transient` 以避免出现 `NotSerializableException`。\n\n```\npublic class LabeledPoint\
  \ implements Serializable\n{\n   private String label;\n   private private transient\
  \ Point2D.Double point;\n   . . .\n}\n```\n\n在 `writeObject` 方法中，首先通过调用 `defaultWriteObject`\
  \ 方法写入对象描述和 `String` 字段 `label`。这是 `ObjectOutputStream` 类的一个特殊方法，只能在序列化类的 `writeObject`\
  \ 方法内部调用。然后，我们使用标准的 `DataOutput` 调用写入点坐标。\n\n```\nprivate void writeObject(ObjectOutputStream\
  \ out) throws IOException\n{\n   out.defaultWriteObject();\n   out.writeDouble(point.getX());\n\
  \   out.writeDouble(point.getY());\n}\n```\n\n在 `readObject` 方法中，我们反转该过程：\n\n```\n\
  private void readObject(ObjectInputStream in)\n      throws IOException, ClassNotFoundException\n\
  {\n   in.defaultReadObject();\n   double x = in.readDouble();\n   double y = in.readDouble();\n\
  \   point = new Point2D.Double(x, y);\n}\n```\n\n另一个示例是 `HashSet` 类，它提供了自己的 `readObject`\
  \ 和 `writeObject` 方法。`writeObject` 方法并没有保存哈希表的内部结构，而是简单地保存了容量、负载因子、大小和元素。`readObject`\
  \ 方法读取容量和负载因子，构建一个新表并插入元素。\n\n`readObject` 和 `writeObject` 方法只需要保存和加载它们的数据。它们不关心父类数据或任何其他类信息。\n\
  \n`Date` 类使用了这种方法。它的 `writeObject` 方法保存了自“纪元”（1970 年 1 月 1 日）以的毫秒。缓存日历数据的结构没有被保存。因此，序列化的\
  \ `Date` 实例由一个不透明的数据块组成。\n\n就像构造函数一样，`readObject` 方法操作部分初始化的对象。如果你在 `readObject`\
  \ 内部调用了子类中重写的非 final 方法，它可能会访问未初始化的数据。\n\n如果可序列化类定义了一个字段：\n\n```\n@Serial private\
  \ static final ObjectStreamField[] serialPersistentFields\n```\n\n那么序列化将使用这些字段描述符，而不是非\
  \ transient 非 static 的字段。还有一个 API 可在序列化之前设置字段值，或在反序列化后读取它们。这对于在类演变后保留旧布局非常有用。例如，`BigDecimal`\
  \ 类使用这种机制将其实例序列化为不再反映实例字段的格式。\n\n### `readExternal` 和 `writeExternal` 方法\n\n与其让序列化机制保存和恢复对象数据，类可以定义自己的机制。例如，你可以对数据进行加密，或者使用比序列化格式更高效的格式。\n\
  \n要做到这一点，类必须实现 `Externalizable` 接口。这反过来要求它定义两个方法：\n\n```\npublic void readExternal(ObjectInput\
  \ in)\n      throws IOException, ClassNotFoundException;\npublic void writeExternal(ObjectOutput\
  \ out) throws IOException;\n```\n\n与 `readObject` 和 `writeObject` 方法不同，这些方法完全负责保存和恢复整个对象（包括父类数据）。在写入对象时，序列化机制仅仅在输出流中记录对象的类。在读取外部可化对象时，对象输入流使用无参构造函数创建一个对象，然后调用\
  \ `readExternal` 方法。\n\n在这个示例中，`LabeledPixel` 类扩展了可序列化的 `Point` 类，但它接管了类及其父类的序列化。对象的字段没有存储在标准的序列化格式中。相反，数据被放置在一个不透明的块中。\n\
  \n```\npublic class LabeledPixel extends Point implements Externalizable\n{\n  \
  \ private String label;\n\n   public LabeledPixel() {} // externalizable 类需要\n\n\
  \   public void writeExternal(ObjectOutput out)\n         throws IOException\n \
  \  {\n      out.writeInt((int) getX());\n      out.writeInt((int) getY());\n   \
  \   out.writeUTF(label);\n   }\n\n   public void readExternal(ObjectInput in)\n\
  \         throws IOException, ClassNotFoundException\n   {\n      int x = in.readInt();\n\
  \      int y = in.readInt();\n      setLocation(x, y);\n      label = in.readUTF();\n\
  \   }\n   . . .\n}\n```\n\n`readExternal` 和 `writeExternal` 方法不应该标记 `@Serial`。由于它们定义在\
  \ `Externalizable` 接口中，你可以简单地使用 `@Override`。\n\n与私有的且只能由序列化机制调用的 `readObject` 和\
  \ `writeObject` 方法不同，`readExternal` 和 `writeExternal` 方法是公共的。特别是，`readExternal`\
  \ 允许修改现有对象的状态。\n\n### `readResolve` 和 `writeReplace` 方法\n\n我们认为认为对象只能通过构造函数构造。然而，反序列化的对象并不是构造的。它的字段是从对象流中恢复的。\n\
  \n如果构造函数强制了某些条件，就会出现问题。例如，单例对象可能实现为构造函数只能被调用一次。另一个例子是数据库实体可以构造为从实例池中获取。\n\n你不应该为单例实现自己的机制。如果你需要单例，请创建一个枚举类型，并按照习惯命名为\
  \ `INSTANCE`。\n\n```\npublic enum PersonDatabase {\n   INSTANCE;\n\n   public Person\
  \ findById(int id) { . . . }\n   . . .\n}\n```\n\n这样做有效是因为 `enum` 实例保证能被正确反序列化。\n\
  \n现在假设你处于一种罕见的情况，你想控制每个反序列化实例的标识。例如，假设 `Person` 类希望在反序列化时从数据库恢复其实例。那么你不应该序列化对象本身。相反，请求保存一个代理实例。当恢复时，该代理将定位并构造所需的对象。你的类需要提供一个返回代理对象的\
  \ `writeReplace` 方法：\n\n```java\npublic class Person implements Serializable {\n\
  \   private int id;\n   // 其他字段\n   . . .\n   @Serial private Object writeReplace()\
  \ {\n      return new PersonProxy(id);\n   }\n}\n```\n\n当 `Person` 对象被序列化时，它的任何字段都不会被保存。相反，将调用\
  \ `writeReplace` 方法，其返回值将被序列化并写入流中。\n\n\n\n\n代理类需要实现一个返回 `Person` 实例的 `readResolve`\
  \ 方法：\n\n```java\nclass PersonProxy implements Serializable {\n   private int id;\n\
  \n   public PersonProxy(int id) {\n      this.id = id;\n   }\n\n   @Serial private\
  \ Object readResolve() {\n      return PersonDatabase.INSTANCE.findById(id);\n \
  \  }\n}\n```\n\n当 `readObject` 方法在 `ObjectInputStream` 中发现 `PersonProxy` 时，它会反序列化该代理类，调用其\
  \ `readResolve` 方法并返回结果。\n\n与 `readObject` 和 `writeObject` 方法不同，`readResolve` 和\
  \ `writeReplace` 方法不需要是私有的。\n\n对于枚举（enumerations）和记录（records），不使用 `readObject`/`writeObject`\
  \ 或 `readExternal`/`writeExternal` 方法进行序列化。对于记录（但对于枚举），将使用 `writeReplace` 方法。\n\n\
  ## 版本控制\n\n如果你使用序列化来保存对象，你需要考虑当程序演进时会发生什么。版本 1.1 能读取旧文件吗？仍然在使用 1.0 的用户能读取新版本生成的文件吗？显然，如果对象文件能够处理类的演进，将是理想的。\n\
  \n乍一看，这似乎是不可能的。当类定义发生任何变化时，其 SHA 指纹也会随之改变，而你知道对象输入流将拒绝读取指纹不同的对象。然而，一个类可以声明它与之前的版本是兼容的（`compatible`）。要做到这一点，你必须先获取该类早期（`earlier`）版本的指纹。使用\
  \ JDK 自的独立程序 `serialver` 来获取该数字。例如，运行\n\n```\nserialver serial.Employee\n```\n\n\
  将打印出\n\n```\nserial.Employee: static final long serialVersionUID = 8367346051156850807L;\n\
  ```\n\n该类的所有后续（`later`）版本都必须定义 `serialVersionUID` 常量，其值为与原始版本相同的指纹。\n\n```java\n\
  class Employee implements Serializable // version 1.1\n{\n   . . .\n   @Serial public\
  \ static final long serialVersionUID = 8367346051156850807L;\n}\n```\n\n当类中有一个名为\
  \ `serialVersionUID` 的静态数据成员时，它将不会手动计算指纹，而是使用该值。\n\n一旦该静态数据成员被放置在类中，序列化系统现在愿意读取该类不同版本的对象。\n\
  \n如果仅类的方法发生了变化，读取新的对象数据没有问题。然而，如果实例字段发生了变化，你可能会遇到问题。例如，旧文件对象可能比程序中的对象多或少实例字段，或者实例字段的类型可能不同。在这种情况下，对象输入流会尝试将序列化对象转换为类的当前版本。\n\
  \n对象输入流会将类当前版本的实例字段与序列化对象中的版本字段进行比较。当然，对象输入流只考虑非瞬态（`nontransient`）和非静态（`nonstatic`）实例字段。如果两个字段具有相同的名称但类型不同，对象输入流不会尝试将一种类型转换为另一种——这些对象是不兼容的。如果序列化对象具有当前版本中不存在的实例字段，对象输入流将忽略这些额外数据。如果当前版本具有序列化对象中不存在的实例字段，则新增的字段将被设置为其默认值（对象为\
  \ `null`，数字为 0，布尔值为 `false`）。\n\n这是一个示例。假设我们使用类的原始版本（1.0）在磁盘上保存了许多员工记录。现在我们通过添加一个名为\
  \ `department` 的实例字段将 `Employee` 类更改到 2.0 版本。[ch01fig09] 显示了当将 1.0 对象读取到使用 2.0 对象的程序时会发生什么。`department`\
  \ 字段被设置为 `null` [#ch01fig10] 显示了相反的情况：使用 1.0 对象的程序读取 2.0 对象。额外的 `department` 字段被忽略。\n\
  \n![Figure](img/fig01-09.jpg)读取实例字段较少的对象![Figure](img/fig01-10.jpg)读取实例字段较多的对象\n\
  \n这个过程安全吗？这取决于情况。丢弃实例字段似乎是无害的——接收方仍然拥有它知道如何操作的所有数据。将实例字段设置为 `null` 可能并不那么安全。许多类都努力在所有构造函数中将所有实例字段初始化为非\
  \ `null` 值，这样方法就不需要准备好处理 `null` 数据。这取决于类设计者在 `readObject` 方法中实现额外的代码来修复版本不兼容问题，或确保方法足够健壮以处理\
  \ `null` 数据。\n\n在向类添加 `serialVersionUID` 字段之前，先问问自己为什么要让你的类变为可序列化的。如果序列化仅用于短期持久化（例如应用服务器中的分布式方法调用），则无需担心版本控制和\
  \ `serialVersionUID`。如果你扩展了一个恰好是可序列化的类，但你从未打算持久化它的实例，情况也是如此。如果你的 IDE 给你带来烦人的警告，请更改\
  \ IDE 偏好将其关闭，或添加注解 `@SuppressWarnings(\"serial\")`。这比添加一个可能会忘记更改的 `serialVersionUID`\
  \ 更安全。枚举和记录忽略 `serialVersionUID` 字段。枚举始终有一个为 `0L` 的 `serialVersionUID`。记录可以声明 `serialVersionUID`，但在反序列化时它们并不匹配。\n\
  \n在本节中，你看到了当读取器版本的类具有对象流中不存在的实例字段时会发生什么。在类演进过程中，可能会增加一个父类。这时使用新版本的读取器可能会读取一个未设置父类字段的对象流。默认情况下，这些实例字段被设置为零/`null`\
  \ 值。这可能让父类处于不安全状态。父类可以通过定义初始化方法来防御该问题：\n\n```java\n@Serial private void readObjectNoData()\
  \ throws ObjectStreamException\n```\n\n该方法应该设置与无参构造函数相同的状态，或者抛出 `InvalidObjectException`。它只在异常情况下读取一个包含缺失父类数据的子类实例时被调用。\n\
  \n### 使用序列化进行克隆\n\n序列化机制有一个有趣的用途：它提供了一种克隆对象的简单方法，只要该类是可序列化的。只需将其序列化到输出流，然后将其读回。结果是现有对象的深拷贝。你不需要将对象写入文件——可以使用\
  \ `ByteArrayOutputStream` 将数据保存到字节数组中。\n\n如 [Listing 2.4] 所示，要免费获得 `clone` 方法，只需扩展\
  \ `SerialCloneable` 类即可大功告成。\n\n你应该意识到，这种方法虽然聪明，但通常会比显式构造新对象并拷贝或克隆实例字段的 clone 方法慢得多。\n\
  \n```java\nserialClone/SerialCloneTest.java\n```\n\n\n\n\n\n```java\npackage serialClone;\n\
  \n/**\n * @version 1.23 2024-01-12\n * @author Cay Horstmann\n */\n\nimport java.io.*;\n\
  import java.time.*;\n\npublic class SerialCloneTest\n{\n   public static void main(String[]\
  \ args) throws CloneNotSupportedException\n   {\n      var harry = new Employee(\"\
  Harry Hacker\", 35000, 1989, 10, 1);\n      // clone harry\n      var harry2 = (Employee)\
  \ harry.clone();\n\n      // 改变 harry\n      harry.raiseSalary(10);\n\n      //\
  \ 现在 harry 和克隆体是不同的\n      System.out.println(harry);\n      System.out.println(harry2);\n\
  \   }\n}\n\n/**\n * 使用序列化实现 clone 方法的类。\n */\nclass SerialCloneable implements Cloneable,\
  \ Serializable\n{\n   public Object clone() throws CloneNotSupportedException\n\
  \   {\n      try\n      {\n         // 将对象保存到字节数组\n         var bout = new ByteArrayOutputStream();\n\
  \         try (var out = new ObjectOutputStream(bout))\n         {\n           \
  \ out.writeObject(this);\n         }\n\n         // 从字节数组中读取对象的克隆体\n         var\
  \ bin = new ByteArrayInputStream(bout.toByteArray());\n         try (var in = new\
  \ ObjectInputStream(bin))\n         {            \n            return in.readObject();\n\
  \         }\n      } \n      catch (IOException | ClassNotFoundException e)\n  \
  \    {\n         var e2 = new CloneNotSupportedException();\n         e2.initCause(e);\n\
  \         throw e2;\n      }\n   }\n}\n\n/**\n * 熟悉的 Employee 类，扩展了 SerialCloneable\
  \ 类。\n */\nclass Employee extends SerialCloneable\n{\n   private String name;\n\
  \   private double salary;\n   private LocalDate hireDay;\n\n   public Employee(String\
  \ n, double s, int year, int month, int day)\n   {\n      name = n;\n      salary\
  \ = s;\n      hireDay = LocalDate.of(year, month, day);\n   }\n\n   public String\
  \ getName()\n   {\n      return name;\n   }\n\n   public double getSalary()\n  \
  \ {\n      return salary;\n   }\n\n   public LocalDate getHireDay()\n   {\n    \
  \  return hireDay;\n   }\n\n   /**\n    * 增加此员工的工资。\n    * \n    * @param byPercent\
  \ 加薪的百分比\n    */\n   public void raiseSalary(double byPercent)\n   {\n      double\
  \ raise = salary * byPercent / 100;\n      salary += raise;\n   }\n\n   public String\
  \ toString()\n   {\n      return getClass().getName() + \"[name=\" + name + \",salary=\"\
  \ + salary + \",hireDay=\" + hireDay + \"]\";\n   }\n}\n```\n\n### 反序列化与安全\n\n在可序列化类的反序列化过程中，对象的创建不会调用该类的任何构造函数。即使该类有一个无参数构造函数，也不会被使用。字段值是直接从对象输入流的值中设置的。\n\
  \n对于可序列化的 `records`，反序列化会调用规范构造函数，并将来自对象输入流的组件值传递给它。（结果是 records 中的循环引用将不会被恢复。）\n\
  \n绕过构造函数是一个安全风险。攻击者可以伪造描述无效对象的字节流，而这些对象是永远无法被构造出来的。假设，如果 `Employee` 构造函数在调用时传入负数时会抛出异常。我们可能会认为这意味着没有任何\
  \ `Employee` 对象可以拥有负工资。但是，正如你在上一节中看到的，检查序列化对象的字节流并修改其中某些内容并不困难。通过这种方式，人们可以构造出一个具有负工资的员工的字节流，然后对其进行反序列化。\n\
  \n可序列化类可以可选地实现 `ObjectInputValidation` 接口并定义 `validateObject` 方法来检查其对象是否被正确反序列化。例如，`Employee`\
  \ 类可以检查工资是否为负数：\n\n```java\npublic void validateObject() throws InvalidObjectException\n\
  {\n   System.out.println(\"validateObject\");\n   if (salary < 0)\n      throw new\
  \ InvalidObjectException(\"salary < 0\");\n}\n```\n\n遗憾的是，该方法不会被自动调用。要调用它，你必须提供以下方法：\n\
  \n```java\n@Serial private void readObject(ObjectInputStream in)\n      throws IOException,\
  \ ClassNotFoundException\n{\n   in.registerValidation(this, 0);\n   in.defaultReadObject();\n\
  }\n```\n\n该对象会被调度进行验证，当该对象及其所有依赖对象都加载完毕后，就会调用 `validateObject` 方法。第二个参数允许你指定优先级。优先级较高的验证请求会先执行。\n\
  \n还有其他安全风险。攻击者可以创建消耗足够资源以导致虚拟机崩溃的数据结构。更隐蔽的是，类路径上的任何类都可以被反序列化。黑客在拼凑“getget 链”（gadget\
  \ chains）方面非常阴险，即各种工具类中利用反射的操作序列，最终导致调用如 `Runtime.exec` 并传入任意字符串的方法。\n\n任何通过网络连接从不可信源接收序列化数据的应用程序都容易受到此类攻击。例如，某些服务器会对会话数据序列化，反序列化\
  \ HTTP 会话 cookie 返回的任何数据。\n\n你应该避免反序列化来自不可信源的任意数据的情况。在会话数据的示例中，服务器应该对数据进行签名，仅反序列化具有有效签名的数据。\n\
  \nJEP 290 和 415 提供了*序列化过滤器*（serialization filter）机制来增强应用程序防御此类攻击的能力。过滤器可以查看序列化的类名以及某些指标（流大小、数组大小、引用链）。基于这些数据，可以中止反序列化。\n\
  \n在最简单的情况下，你提供描述有效和无效类的模式。例如，如果你这样启动示例程序：\n\n```bash\njava -DserialFilter='serial.*;java.**;!*'\
  \ ObjectTest\n```\n\n则允许 `serial` 包以及所有以 `java` 开头的类，但不允许其他类。如果不允许 `java.**` 或至少\
  \ `java.util.Date`，反序列化将失败。\n\n你可以将过滤器放入配置文件并在不同的用途中指定过滤器。你也可以实现自己的过滤器。详见 [`docs.oracle.com/en/java/21/core/serialization-filtering.html`](https://docs.oracle.com/en/java/21/core/serialization-filtering.html)。\n\
  \n## 文件操作\n\n你已经学习了如何读写文件。然而，文件管理不仅仅是读写。`Path` 接口和 `Files` 类封装了操作用户系统中所需的功能。例如，`Files`\
  \ 类可以用于删除或重命名文件，或者查找最后修改时间。换句话说，输入输出流类关注文件的内容，而我们这里讨论的类关注磁盘上的文件存储。\n\n`Path` 接口和\
  \ `Files` 类比追溯到 JDK 1.0 的 `File` 类要方便得多。除非与旧代码交互，否则你不应该使用 `File` 类。\n\n### 路径\n\n\
  `Path` 是目录名的序列，可选跟随一个文件名。路径的第一个组件可以是*根组件*，如 `/` 或 `C:\\`。允许的根组件取决于文件系统。以根组件开头的路径是绝对的。否则，它们是相对的。例如，在这里我们构造了一个绝对路径和一个相对路径。对于绝对路径，我们假设了一个类\
  \ Unix 文件系统。\n\n```java\nPath absolute = Path.of(\"/home\", \"harry\");\nPath relative\
  \ = Path.of(\"myprog\", \"conf\", \"user.properties\");\n```\n\n\n\n静态 `Path.of`\
  \ 方法接收一个或多个字符串，并将其与默认文件系统的路径分隔符连接（类 Unix 文件系统使用 `/`，Windows 使用 `\\`）。然后它会解析结果，如果结果在给定的文件系统中不是有效路径，则会抛出\
  \ `InvalidPathException`。结果是一个 `Path` 对象。\n\n`of` 方法可以获取包含多个组件的单个字符串。例如，你可以这样从配置文件读取路径：\n\
  \n```\nString baseDir = props.getProperty(\"base.dir\");\n   // 结果可能是一个类似于 /opt/myprog\
  \ 或 c:\\Program Files\\myprog 的字符串\nPath basePath = Path.of(baseDir); // baseDir\
  \ 包含分隔符是正确的\n```\n\n路径并不对应于实际存在的文件。它仅仅是一个抽象的名称序列。正如你在下一节中看到的，当你想要创建一个文件时，首先创建一个路径，然后调用方法来创建对应的文件。\n\
  \n组合或 `resolve` 路径是非常常见的。调用 `p.resolve(q)` 根据以下规则返回一个路径：\n\n* 如果 `q` 是绝对路径，则结果为\
  \ `q`。\n* 如果 `q` 没有根目录，则通过连接 `p` 和 `q` 获取结果。\n* 否则，结果取决于文件系统的规则。\n\n例如，假设你的应用程序需要相对于从配置文件读取的给定基础目录查找其工作目录，如前面的示例所示。\n\
  \n```\nPath workRelative = Path.of(\"work\");\nPath workPath = basePath.resolve(workRelative);\n\
  ```\n\n`resolve` 方法有一个快捷方法，接受字符串而不是路径：\n\n```\nPath workPath = basePath.resolve(\"\
  work\");\n```\n\n`resolve` 方法不会简化结果。例如，\n\n```\nPath.of(\"/usr/bin\").resolve(\"\
  ../local\")\n```\n\n是一个路径 `/usr/bin/../local`。\n\n有一个便利方法 `resolveSibling`，它可以相对于路径的父目录进行解析，产生一个兄弟路径。例如，如果\
  \ `workPath` 是 `/opt/myapp/work`，调用\n\n```\nPath tempPath = workPath.resolveSibling(\"\
  temp\");\n```\n\n将创建 `/opt/myapp/temp`。\n\n`resolve` 的反向是 `relativize`。调用 `p.relativize(r)`\
  \ 路径 `q`，该路径在与 `p` 解析时产生 `r`。例如，将 `/home/harry` 相对于 `/home/fred/input.txt` 得到 `../fred/input.txt`。在这里，我们假设\
  \ `..` 表示文件系统的父目录。\n\n`normalize` 方法移除任何冗余的 `.` 和 `..` 组件（或文件系统认为冗余的任何内容）。例如，规范化路径\
  \ `/home/harry/../fred/./input.txt` 得到 `/home/fred/input.txt`。\n\n`toAbsolutePath`\
  \ 方法产生给定路径的绝对路径，从根组件开始，例如 `/home/fred/input.txt` 或 `c:\\Users\\fred\\input.txt`。\n\
  \n`Path` 接口有很多拆路径有用方法。此代码示例显示了一些常用的方法：\n\n```\nPath p = Path.of(\"/home\", \"fred\"\
  , \"myprog.properties\");\nPath parent = p.getParent(); // 路径 /home/fred\nPath file\
  \ = p.getFileName(); // 路径 myprog.properties\nPath root = p.getRoot(); // 路径 /\n\
  ```\n\n`getFileName` 方法简单返回给定路径的最后一个组件。如果路径描述的是目录，那么它是目录名而不是文件名。\n\n正如你在第一卷中看到的，你可以从\
  \ `Path` 对象构造一个 `Scanner`：\n\n```\nvar in = new Scanner(Path.of(\"/home/fred/input.txt\"\
  ));\n```\n\n偶尔，你可能需要与使用 `File` 类而不是 `Path` 接口的旧 API 交互。`Path` 接口有一个 `toFile` 方法，而\
  \ `File` 类有一个 `toPath` 方法。\n\n#### `java.nio.file.Path` 7\n\n* `static Path of(String\
  \ first, String... more)` 11\n  通过连接给定的字符串创建一个路径。\n* `Path resolve(Path other)`\n\
  * `Path resolve(String other)`\n  如果 `other` 是绝对的，返回 `other`；否则返回通过连接 `this` 和 `other`\
  \ 获取的路径。\n* `Path resolveSibling(Path other)`\n* `Path resolveSibling(String other)`\n\
  \  如果 `other` 是绝对的，返回 `other`；否则返回通过连接 `this` 的父目录和 `other` 获取的路径。\n* `Path relativize(Path\
  \ other)`\n  返回相对路径，该路径在与 `this` 解析时产生 `other`。\n* `Path normalize()`\n  移除冗余的路径元素，如\
  \ `.` 和 `..`\n* `Path toAbsolutePath()`\n  如果此路径是绝对的，则返回此路径；否则返回相对于工作目录解析的路径。\n\
  * `Path getParent()`\n  返回父目录，如果此路径没有父则返回 `null`。\n* `Path getFileName()`\n  返回此路径的最后一个组件，如果此路径没有组件，则返回\
  \ `null`。\n* `Path getRoot()`\n  返回此路径的根组件，如果此路径没有根组件，则返回 `null`。\n* `toFile()`\n\
  \  从此路径创建一个 `File`。\n\n#### `java.io.File` 1.0\n\n* `Path toPath()` 7\n  从此文件创建一个\
  \ `Path`。\n\n### 读取和写入文件\n\n`Files` 类可以处理常见的文件操作。例如，你可以轻松地将文件内容读取为字节数组、字符串、列表或流：\n\
  \n```\nbyte[] bytes = Files.readAllBytes(path);\nString content = Files.readString(path);\n\
  List<String> lines = Files.readAllLines(path, charset);\nStream<String> lineStream\
  \ = Files.lines(path, charset);\n```\n\n相反，对于写入：\n\n```\nFiles.write(path, bytes);\n\
  Files.write(path, content, charset);\nFiles.write(path, lines, charset);\n```\n\n\
  要追加到给定文件，使用\n\n```\nFiles.write(path, content, charset, StandardOpenOption.APPEND);\n\
  ```\n\n调用\n\n```\nlong pos = Files.mismatch(path1, path2);\n```\n\n产生文件内容不同的第一个字节的位置。将内容写入文件并返回\
  \ `path`。\n\n要获取文件的 MIME 类型（如 `\"text/html\"` 或 `\"image/png\"`），调用\n\n```\nString\
  \ mimeType = Files.probeContentType(path);\n```\n\n具体行为取决于 Java 的实现。每个实现都有一组 `FileTypeDetector`\
  \ 实例，按未指定的顺序尝试。每个检测器可能会检查文件扩展名、操作系统特定的元数据或内容的几个字节。\n\n以下方法允许你使用经典的输入输出流或读取器/写入器进行交互：\n\
  \n```\nInputStream in = Files.newInputStream(path);\nOutputStream out = Files.newOutputStream(path);\n\
  Reader in = Files.newBufferedReader(path, charset);\nWriter out = Files.newBufferedWriter(path,\
  \ charset);\n```\n\n这些便利方法省去了你处理 `FileInputStream`、`FileOutputStream`、`BufferedReader`\
  \ 或 `BufferedWriter` 的麻烦。\n\n### `java.nio.file.Files` 7\n\n* `static byte[] readAllBytes(Path\
  \ path)`\n* `static String readString(Path path, Charset charset)`\n* `static List<String>\
  \ readAllLines(Path path, Charset charset)`\n  读取文件内容。\n* `static Path write(Path\
  \ path, byte[] contents, OpenOption... options)`\n* `static Path write(Path path,\
  \ String contents, Charset charset, OpenOption... options)`\n* `static Path writeString(Path\
  \ path, CharSequence contents, Charset cs, OpenOption... options)` 11\n* `static\
  \ Path write(Path path, Iterable<? extends CharSequence> contents, Charset cs, OpenOption\
  \ options)`\n  将给定内容写入文件并返回 `path`。\n* `static long mismatch(Path path, Path path2)`\
  \ 12\n  返回文件内容不同的第一个字节的位置。\n* `static String probeContentType(Path path)` 12\n \
  \ 返回已安装的文件类型检测器对文件内容的 MIME 类型的最佳猜测，如果无法确定则返回 `null`。\n* `static InputStream newInputStream(Path\
  \ path, OpenOption... options)`\n* `static OutputStream newOutputStream(Path path,\
  \ OpenOption... options)`\n* `static BufferedReader newBufferedReader(Path path,\
  \ Charset charset)`\n* `static BufferedWriter newBufferedWriter(Path path, Charset\
  \ charset, OpenOption... options)`\n  打开文件以读取或写入。\n\n### 创建文件和目录\n\n要创建一个新目录，调用\n\
  \n\n\n\n\n```\nFiles.createDirectory(path);\n```\n\n路径中最后一个组件以外的所有部分都必须已经存在。要同时创建中间目录，请使用\n\
  \n```\nFiles.createDirectories(path);\n```\n\n你可以使用以下方法创建一个空文件：\n\n```\nFiles.createFile(path);\n\
  ```\n\n如果文件已存在，该调用将抛出异常。存在性检查和创建过程是原子的。如果文件不存在，它将在其他其他人进行相同操作之前被创建。\n\n提供了便利方法，用于在指定或系统特定的位置创建临时文件或目录。\n\
  \n```\nPath newPath = Files.createTempFile(dir, prefix, suffix);\nPath newPath =\
  \ Files.createTempFile(prefix, suffix);\nPath newPath = Files.createTempDirectory(dir,\
  \ prefix);\nPath newPath = Files.createTempDirectory(prefix);\n```\n\n在这里，`dir`\
  \ 是一个 `Path`，而 `prefix`/`suffix` 是可能是 `null` 的字符串。例如，调用 `Files.createTempFile(null,\
  \ \".txt\")` 可能会返回类似 `/tmp/1234405522364837194.txt` 的路径。\n\n当你创建文件或目录时，可以指定属性，例如所有者或权限。然而，细节取决于文件系统，我们在这里不会介绍它们。\n\
  \n`java.nio.file.Files` 7\n\n*   `static Path createFile(Path path, FileAttribute<?>...\
  \ attrs)`\n*   `static Path createDirectory(Path path, FileAttribute<?>... attrs)`\n\
  *   `static Path createDirectories(Path path, FileAttribute<?>... attrs)`\n    创建一个文件或目录。`createDirectories`\
  \ 方法会同时创建任何中间目录。\n\n*   `static Path createTempFile(String prefix, String suffix,\
  \ FileAttribute<?>... attrs)`\n*   `static Path createTempFile(Path parentDir, String\
  \ prefix, String suffix, FileAttribute<?>... attrs)`\n*   `static Path createTempDirectory(String\
  \ prefix, FileAttribute<?>... attrs)`\n*   `static Path createTempDirectory(Path\
  \ parentDir, String prefix, FileAttribute<?>... attrs)`\n    在适用于临时文件的位置或给定的父目录中创建临时文件或目录。返回所创建的文件或目录的路径。\n\
  \n### 复制、移动和删除文件\n\n要将文件从一个位置复制到另一个位置，只需调用\n\n```\nFiles.copy(fromPath, toPath);\n\
  ```\n\n如果改为移动文件，请调用\n\n```\nFiles.move(fromPath, toPath);\n```\n\n如果目标存在，则复制或移动将失败。如果你想覆盖已有的目标，请使用\
  \ `REPLACE_EXISTING` 选项。如果你想复制所有文件属性，请使用 `COPY_ATTRIBUTES` 选项。你可以这样同时提供两者：\n\n```\n\
  Files.copy(fromPath, toPath, StandardCopyOption.REPLACE_EXISTING,\n   StandardCopyOption.COPY_ATTRIBUTES);\n\
  ```\n\n你可以指定移动应该是原子的。这样你就能确保要么移动成功完成，要么源文件继续存在。使用 `ATOMIC_MOVE` 选项：\n\n```\nFiles.move(fromPath,\
  \ toPath, StandardCopyOption.ATOMIC_MOVE);\n```\n\n你也可以将输入流复制到 `Path`，这意味着将输入流保存到磁盘。同样，你可以将\
  \ `Path` 复制到输出流。使用以下调用：\n\n```\nFiles.copy(inputStream, toPath);\nFiles.copy(fromPath,\
  \ outputStream);\n```\n\n与对 `copy` 的其他调用一样，你可以根据需要提供复制选项。\n\n最后，要删除文件，只需调用\n\n```\n\
  Files.delete(path);\n```\n\n如果文件不存在，此方法将抛出异常，因此你可能更想要使用\n\n```\nboolean deleted\
  \ = Files.deleteIfExists(path);\n```\n\n删除方法也可以用于删除空目录。\n\n请参见 表 2.9 以获取文件操作可用选项的摘要。\n\
  \n### 文件操作的标准选项\n\n| 选项 | 描述 |\n| --- | --- |\n| `StandardOpenOption`; 与 `newBufferedWriter`,\
  \ `newInputStream`, `newOutputStream`, `write` 使用。 | |\n| `READ` | 以读模式打开。 |\n|\
  \ `WRITE` | 以写模式打开。 |\n| `APPEND` | 如果以写打开，则追加到文件末尾。 |\n| `TRUNCATE_EXISTING` |\
  \ 如果以写打开，则删除现有内容。 |\n| `CREATE_NEW` | 创建新文件，如果存在则失败。 |\n| `CREATE` | 如果不存在，则原子性地创建新文件。\
  \ |\n| `DELETE_ON_CLOSE` | 关闭文件时“尽力”删除文件。 |\n| `SPARSE` | 给文件系统的提示，该文件将是稀疏文件。 |\n\
  | `DSYNC` 或 `SYNC` | 要求对文件数据或数据和元数据的每次更新都同步写入存储设备。 |\n| `StandardCopyOption`; 与\
  \ `copy`, `move` 使用。 | |\n| `ATOMIC_MOVE` | 原子地移动文件。 | |\n| `COPY_ATTRIBUTES` |\
  \ 复制文件属性。 | |\n| `REPLACE_EXISTING` | 如果目标存在则替换。 | |\n| `LinkOption`; 与上述所有方法以及\
  \ `exists`, `isDirectory`, `isRegularFile` 使用。 | |\n| `NOFOLLOW_LINKS` | 不跟随链接。\
  \ |\n| `FileOption`; 与 `find`, `walk`, `walkTree` 使用。 | |\n| `FOLLOW_LINKS` | 跟随符号链接。\
  \ | |\n\n`java.nio.file.Files` 7\n\n*   `static Path copy(Path source, Path target,\
  \ CopyOption... options)`\n*   `static Path move(Path source, Path target, CopyOption...\
  \ options)`\n    将 `source` 复制到 `target`。\n*   `static void copy(InputStream in,\
  \ Path target, CopyOption... options)`\n*   `static void copy(Path source, OutputStream\
  \ out, CopyOption... options)`\n    将 `source` 复制到 `out`。\n*   `static void delete(Path\
  \ path)`\n*   `static boolean deleteIfExists(Path path)`\n    删除指定的文件或目录。\n\n###\
  \ 获取文件信息\n\n以下静态方法返回 `boolean` 值以检查路径的属性：\n\n*   `exists`\n*   `isHidden`\n*   `isReadable`,\
  \ `isWritable`, `isExecutable`\n*   `isRegularFile`, `isDirectory`, `isSymbolicLink`\n\
  \n`size` 方法返回文件的字节数。\n\n```\nlong fileSize = Files.size(path);\n```\n\n`getOwner`\
  \ 方法返回文件的所有者，类型为 `java.nio.file.attribute.UserPrincipal`。\n\n所有文件系统都会报告一组基本属性，由\
  \ `BasicAttributes` 接口封装，与上述信息有部分重叠。基本属性包括：\n\n*   文件的创建、最后访问和最后修改时间，作为 `java.nio.file.attribute.FileTime`\
  \ 实例\n*   该文件是否是普通文件、目录、符号链接或以上都不是\n*   文件大小\n*   文件键——某种特定于文件系统的类对象，可能或无法唯一标识一个文件\n\
  \n要获取这些属性，请调用\n\n\n\n```\nBasicAttributes attributes = Files.readAttributes(path,\
  \ BasicAttributes.class);\n```\n\n如果你知道用户文件系统是符合 POSIX 标准的，你可以改为获取 `PosixFileAttributes`\
  \ 实例：\n\n```\nPosixFileAttributes attributes = Files.readAttributes(path, PosixFileAttributes.class);\n\
  ```\n\n然后你可以找到组所有者以及文件的所有者、组和世界的访问权限。我们不会详述这些细节，因为这些信息中大部分在不同操作系统之间是不可移植的。\n\n`java.nio.file.attribute.BasicFileAttributes`\
  \ 7\n\n*   `FileTime creationTime()`\n*   `FileTime lastAccessTime()`\n\n\n\n\n\n\
  - `FileTime lastModifiedTime()`\n- `boolean isRegularFile()`\n- `boolean isDirectory()`\n\
  - `boolean isSymbolicLink()`\n- `long size()`\n- `Object fileKey()` 获取请求的属性。`java.nio.file.attribute.FileTime`\
  \ 7\n- `Instant toInstant()` 8 返回一个与此 `FileTime` 表示相同时间的 `Instant`。\n\n## 访问目录条目\n\
  \n静态方法 `Files.list` 返回一个读取目录条目的 `Stream<Path>`。该目录是懒性读取的，这使得高效处理包含大量条目的目录变得可能。\n\
  \n由于读取目录涉及需要关闭的系统资源，因此你应该使用 `try` 块：\n\n```java\ntry (Stream<Path> entries = Files.list(pathToDirectory))\
  \ \n{\n   . . .\n}\n```\n\n`list` 方法不会进入子目录。要处理目录的所有后代节点，请改用 `Files.walk` 方法。\n\n\
  ```java\ntry (Stream<Path> entries = Files.walk(pathToRoot)) \n{\n   // 包含所有后代，按深度优先顺序访问\n\
  }\n```\n\n以下是解压后的 `src.zip` 树的遍历示例：\n\n```java\njava/nio\njava/nio/DirectCharBufferU.java\n\
  java/nio/ByteBufferAsShortBufferRL.java\njava/nio/MappedByteBuffer.java\n. . .\n\
  java/nio/ByteBufferAsDoubleBufferB.java\njava/nio/charset\njava/nio/charset/CoderMalfunctionError.java\n\
  java/nio/charset/CharsetDecoder.java\njava/nio/charset/UnsupportedCharsetException.java\n\
  java/nio/charset/spi\njava/nio/charset/spi/CharsetProvider.java\njava/nio/charset/StandardCharsets.java\n\
  java/nio/charset/Charset.java\n. . .\njava/nio/charset/CoderResult.java\njava/nio/HeapFloatBufferR.java\n\
  . . .\n```\n\n你可以看到，每当遍历产生目录时，会在继续处理兄弟节点之前进入它。\n\n你可以通过调用 `Files.walk(pathToRoot,\
  \ depth)` 来限制想要访问的树深度。两个 `walk` 方法都有一个类型为 `FileVisitOption...` 的可变参数参数，但你可以提供的选项只有一个：`FOLLOW_LINKS`\
  \ 用于跟随符号链接。\n\n如果你对 `walk` 返回的路径进行过滤，且你的过滤标准涉及存储在目录中的文件属性，例如 `size`、创建时间或类型（文件、目录、符号链接），则请使用\
  \ `find` 方法代替 `walk`。调用该方法时，传入一个接受路径和 `BasicFileAttributes` 对象的谓词函数。唯一的优势是效率。由于已经在读取目录，这些属性是随手可用的。\n\
  \n这段代码片段使用 `Files.walk` 方法将一个目录复制到另一个：\n\n```java\nFiles.walk(source).forEach(p\
  \ -> \n   {\n      try \n      {\n         Path q = target.resolve(source.relativize(p));\n\
  \         if (Files.isDirectory(p))\n            Files.createDirectory(q);\n   \
  \      else\n            Files.copy(p, q);\n      } \n      catch (IOException e)\
  \ \n      {\n         throw new UncheckedIOException(ex);\n      }\n   });\n```\n\
  \n遗憾的是，你无法轻松地使用 `Files.walk` 方法删除目录树，因为你需要在删除父目录之前删除子目录。下一节将向你展示如何克服这个问题。\n\n如果任何子目录不可读，`Files.walk`\
  \ 方法将抛出异常。如果你只想访问可读的目录，请使用下一节描述的 `walkFileTree` 方法。\n\n## 使用目录流\n\n正如你在上一节中所见的，`Files.walk`\
  \ 方法产生一个遍历目录后代节点的 `Stream<Path>`。有时，你对遍历过程需要更细粒度的控制。在这种情况下，请改用 `Files.newDirectoryStream`\
  \ 对象。它产生一个 `DirectoryStream`。注意，这并不是 `java.util.stream.Stream` 的子接口，而是一个专门为目录遍历设计的接口。它是\
  \ `Iterable` 的子接口，因此你可以在增强型 `for` 循环中使用目录流。以下是用法模式：\n\n```java\ntry (DirectoryStream<Path>\
  \ entries = Files.newDirectoryStream(dir))\n{\n   for (Path entry : entries) \n\
  \      Process entries       \n}\n```\n\n`try`-with-resources 块确保了目录流被正确关闭。\n\n\
  目录条目的访问没有特定的顺序。\n\n你可以使用 glob 模式来过滤文件：\n\n```java\ntry (DirectoryStream<Path> entries\
  \ = Files.newDirectoryStream(dir, \"*.java\"))\n```\n\n表 2.10 显示了所有的 glob 模式。\n\n\
  ### Glob 模式\n\n| 模式 | 说明 | 示例 |\n| --- | --- | --- |\n| `*` | 匹配路径组件的零或多个字符。 | `*.java`\
  \ 匹配当前目录下所有的 Java 文件。 |\n| `**` | 匹配跨目录边界的零或多个字符。 | `**.java` 匹配任何子目录下的所有 Java 文件。\
  \ |\n| `?` | 匹配一个字符。 | `????.java` 匹配所有四个字符（不计扩展名）的 Java 文件。 |\n| `[. . .]` | 匹配字符集。可以使用连字符\
  \ `[0-9]` 和取反 `[!0-9]`。 | `Test[0-9A-F].java` 匹配 `Testx.java`，其中 `x` 是一个十六进制数字。\
  \ |\n| `{. . .}` | 匹配由逗号分隔的备选项。 | `*.{java,class}` 匹配所有的 Java 和类文件。 |\n| `\\` |\
  \ 转义上述任何字符以及 `\\` 本。 | `*\\**` 匹配所有名称中包含 `*` 的文件。 |\n\n如果你在 Windows 上使用 glob 语法，你必须转义*两次*反斜杠——一次是为了\
  \ glob 语法，一次是为了 Java 字符串语法。\n\n如果你想访问目录的所有后代节点，请改用 `walkFileTree` 方法并提供一个类型为 `FileVisitor`\
  \ 的对象。对象会在以下情况收到通知：\n- 当遇到文件时：`FileVisitResult visitFile(T path, BasicFileAttributes\
  \ attrs)`\n- 在处理目录之前：`FileVisitResult preVisitDirectory(T dir, IOException e)`\n\
  - 在处理目录之后：`FileVisitResult postVisitDirectory(T dir, IOException e)`\n- 当尝试访问文件或目录时发生错误（例如尝试在没有相应权限的情况下打开目录）：`FileVisitResult\
  \ visitFailed(T path, IOException e)`\n\n在每种情况下，你都可以指定：\n- 继续访问下一个文件：`FileVisitResult.CONTINUE`\n\
  - 继续遍历，但不访问该目录中的条目：`FileVisitResult.SKIP_SUBTREE`\n- 继续遍历，但不访问该文件的兄弟节点：`FileVisitResult.SKIP_SIBLINGS`\n\
  - 终止遍历：`FileVisitResult.TERMINATE`\n\n如果任何方法抛出异常，遍历也会终止，并且异常将从 `walkFileTree` 方法抛出。`FileVisitor`\
  \ 接口是一个泛型，但你不太可能想要 `FileVisitor` 以外的东西。`walkFileTree` 方法愿意接受 `FileVisitor<? super\
  \ Path>`，但 `Path` 并没有许多超类型。\n\n便利类 `SimpleFileVisitor` 实现了 `FileVisitor` 接口，其简单方法会继续访问或在异常时终止访问。扩展它并根据需要重写方法。\n\
  \n例如，以下是如何打印给定目录的所有子目录：\n\n```java\nFiles.walkFileTree(Path.of(\"/\"), new SimpleFileVisitor<Path>()\n\
  \   {\n      public FileVisitResult preVisitDirectory(Path path, BasicFileAttributes\
  \ attrs) \n            throws IOException\n      {\n         System.out.println(path);\n\
  \         return FileVisitResult.CONTINUE;\n      }\n\n      public FileVisitResult\
  \ postVisitDirectory(Path dir, IOException e) \n      {\n         return FileVisitResult.CONTINUE;\n\
  \      }\n\n      public FileVisitResult visitFileFailed(Path path, IOException\
  \ e) throws IOException\n      {\n         if (e != null) throw e;\n         return\
  \ FileVisitResult.SKIP_SUBTREE;\n      }\n   });\n```\n\n注意我们需要重写 `postVisitDirectory`\
  \ 和 `visitFileFailed`。否则，一旦遇到无权打开的目录或无权访问的文件，访问就会失败。\n\n\n\n\n另外请注意，路径属性是作为参数传递给\
  \ `preVisitDirectory` 和 `visitFile` 方法的。访问器已经必须进行过一次 系统调用来获取属性，因为它需要区分文件和目录。这样，你就不需要再次进行调用了。\n\
  \n`FileVisitor` 接口的其他方法在你需要在进入或离开目录时执行某些工作时非常有用。例如，当你删除一个目录树时，你需要在删除所有文件后删除当前目录。以下是删除目录树的完整代码：\n\
  \n```\n// 删除从 root 开始的目录树\nFiles.walkFileTree(root, new SimpleFileVisitor<Path>()\n\
  \   {\n      public FileVisitResult visitFile(Path file, BasicFileAttributes attrs)\n\
  \            throws IOException\n      {\n         Files.delete(file);\n       \
  \  return FileVisitResult.CONTINUE;\n      }\n\n      public FileVisitResult postVisitDirectory(Path\
  \ dir, IOException e) throws IOException\n      {\n         if (e != null) throw\
  \ e;\n         Files.delete(dir);\n         return FileVisitResult.CONTINUE;\n \
  \     }\n   });\n```\n\n### `java.nio.file.Files` 7\n\n*   `static DirectoryStream<Path>\
  \ newDirectoryStream(Path path)`\n*   `static DirectoryStream<Path> newDirectoryStream(Path\
  \ path, String glob)`\n    获取给定目录中文件和目录的迭代器。第二个方法只接受匹配给定 glob 模式的项。\n*   `static\
  \ Path walkFileTree(Path start, FileVisitor<? super Path> visitor)`\n    遍历给定路径的所有后代节点，并将访问器应用于所有后代节点。\n\
  \n### `java.nio.file.SimpleFileVisitor<T>` 7\n\n*   `static FileVisitResult visitFile(T\
  \ path, BasicFileAttributes attrs)`\n    在访问文件或目录时调用；返回 `CONTINUE`、`SKIP_SUBTREE`、`SKIP_SIBLINGS`\
  \ 或 `TERMINATE` 之一。默认实现什么都不做并继续。\n*   `static FileVisitResult preVisitDirectory(T\
  \ dir, BasicFileAttributes attrs)`\n*   `static FileVisitResult postVisitDirectory(T\
  \ dir, IOException exc)`\n    在访问目录之前之后调用。默认实现什么都不做并继续。但是，如果 `exc` 不为空，则会将其抛出，导致访问以该异常终止。\n\
  *   `static FileVisitResult visitFileFailed(T path, IOException exc)`\n    如果在尝试获取给定文件信息时抛出异常，则会此。默认实现重新抛出异常，导致访问以该异常终止。如果你想继续，请重写该方法。\n\
  \n### ZIP 文件系统\n\n`Paths` 类在默认文件系统中查找路径——即用户本地磁盘上的文件。你也可以拥有其他文件系统。其中一个比较有用的是 ZIP\
  \ 文件系统。如果 `zipname` 是一个 ZIP 文件的名称，那么调用\n\n```\nFileSystem fs = FileSystems.newFileSystem(Path.of(zipname));\n\
  ```\n\n将建立一个包含 ZIP 归档中所有文件的文件系统。如果你知道文件的名称，从该归档中拷贝文件是一件很容易的事：\n\n```\nFiles.copy(fs.getPath(sourceName),\
  \ targetPath);\n```\n\n在这里，`fs.getPath` 是任意文件系统的 `Path.of` 的等价物。\n\n要列出 ZIP 归档中的所有文件，遍历文件树：\n\
  \n```\nFileSystem fs = FileSystems.newFileSystem(Path.of(zipname));\nFiles.walkFileTree(fs.getPath(\"\
  /\"), new SimpleFileVisitor<Path>()\n   {\n      public FileVisitResult visitFile(Path\
  \ file, BasicFileAttributes attrs) \n            throws IOException\n      {   \
  \            \n         System.out.println(file);\n         return FileVisitResult.CONTINUE;\n\
  \      }\n   });\n```\n\n这比 Section 2.2.3 中描述的 API 要好，后者仅为了处理 ZIP 归档就需要一组新类。\n\n\
  ### `java.nio.file.FileSystems` 7\n\n*   `static FileSystem newFileSystem(Path path)`\
  \ 13\n    返回由第一个接受给定路径的文件系统提供者创建的文件系统。默认情况下，有一个 ZIP 文件系统提供者接受名称以 `.zip` 或 `.jar`\
  \ 结尾的文件。\n\n### `java.nio.file.FileSystem` 7\n\n*   `static Path getPath(String\
  \ first, String... more)`\n    通过连接给定字符串创建路径。\n\n## 内存映射文件\n\n大多数操作系统都可以利用虚拟内存实现将文件（或文件的区域）“映射”到内存中。然后就可以像访问内存数组一样访问文件，这比传统的备操作快得多。\n\
  \n### 内存映射文件的性能\n\n在本节结束处，你可以找到一个程序，它使用传统的文件输入和内存映射文件计算文件的 CRC32 校验和。在某机器上，当计算 JDK\
  \ `lib` 目录下的 51MB 文件 `src.zip` 的校验和时，我们得到了 Table 2.11 所示的时间数据。\n\n#### 文件操作计时数据\n\
  \n| 方法 | 时间 |\n| --- | --- |\n| 普通输入流 | 15.1 秒 |\n| 缓冲输入流 | 0.8 秒 |\n| 随机访问文件 |\
  \ 11.9 秒 |\n| 内存映射文件 | 0.2 秒 |\n\n正如你所见，与随机访问相比，内存映射的优势是显著的。\n\n\n\n\n```\nputInt\
  \            putChar\nputLong           putFloat\nputShort          putDouble\n\
  ```\n\n在某个时刻，特别是当通道关闭时，这些更改会被写回文件。\n\nListing 2.5 计算文件的 32 位循环冗余校验和 (CRC32)。该校验和通常被用于判断文件是否已损坏。文件的损坏会极大概率导致校验和发生变化。`java.util.zip`\
  \ 数据包包含一个 `CRC32` 类，它使用以下循环来计算字节序列的校验和：\n\n```\nvar crc = new CRC32();\nwhile (more\
  \ bytes)\n   crc.update(next byte);\nlong checksum = crc.getValue();\n```\n\nCRC\
  \ 计算的细节并不重要。我们只是将其作为一个有用的文件操作的示例。（在实际操作中，你会以较大的块的形式读取和更新数据，而不是一个字节一个字节地处理。这样速度差异就不会那么显著了。）\n\
  \n按如下方式运行程序：\n\n```\njava memoryMap.MemoryMapTest filename\n```\n\n`memoryMap/MemoryMapTest.java`\n\
  \n```java\npackage memoryMap;\n\nimport java.io.*;\nimport java.nio.*;\nimport java.nio.channels.*;\n\
  import java.nio.file.*;\nimport java.util.zip.*;\n\n/**\n * 该程序通过种方式计算文件的 CRC 校验和。<br>\n\
  \ * 使用方法：java memoryMap.MemoryMapTest filename\n * \n * @version 1.03 2018-05-01\n\
  \ * @author Cay Horstmann\n */\npublic class MemoryMapTest\n{\n   public static\
  \ long checksumInputStream(Path filename) throws IOException\n   {\n      try (InputStream\
  \ in = Files.newInputStream(filename))\n      {\n         var crc = new CRC32();\n\
  \         boolean done = false;\n         while (!done)\n         {\n          \
  \  int c = in.read();\n            if (c == -1)\n               done = true;\n \
  \           else\n               crc.update(c);\n         }\n         return crc.getValue();\n\
  \      }\n   }\n\n   public static long checksumBufferedInputStream(Path filename)\
  \ throws IOException\n   {\n      try (var in = new BufferedInputStream(Files.newInputStream(filename)))\n\
  \      {\n         var crc = new CRC32();\n\n         boolean done = false;\n  \
  \       while (!done)\n         {\n            int c = in.read();\n            if\
  \ (c == -1)\n               done = true;\n            else\n               crc.update(c);\n\
  \         }\n         return crc.getValue();\n      }\n   }\n\n   public static\
  \ long checksumRandomAccessFile(Path filename) throws IOException\n   {\n      try\
  \ (var file = new RandomAccessFile(filename.toFile(), \"r\"))\n      {\n       \
  \  long length = file.length();\n         var crc = new CRC32();\n\n         for\
  \ (long p = 0; p < length; p++)\n         {\n            int c = file.readByte();\n\
  \            crc.update(c);\n         }\n         return crc.getValue();\n     \
  \ }\n   }\n\n   public static long checksumMappedFile(Path filename) throws IOException\n\
  \   {\n      try (FileChannel channel = FileChannel.open(filename))\n      {\n \
  \        var crc = new CRC32();\n         int length = (int) channel.size();\n \
  \        MappedByteBuffer buffer = channel.map(FileChannel.MapMode.READ_ONLY, 0,\
  \ length);\n\n         for (int p = 0; p < length; p++)\n         {\n          \
  \  int c = buffer.get(p);\n            crc.update(c);\n         }\n         return\
  \ crc.getValue();\n      }\n   }\n\n   public static void main(String[] args) throws\
  \ IOException\n   {\n      System.out.println(\"Input Stream:\");\n      long start\
  \ = System.nanoTime();\n      Path filename = Path.of(args[0]);\n      long crcValue\
  \ = checksumInputStream(filename);\n      long end = System.nanoTime();\n      System.out.println(Long.toHexString(crcValue));\n\
  \      System.out.printf(\"%.3f seconds%n\", (end - start) * 1E-9);\n\n      System.out.println(\"\
  Buffered Input Stream:\");\n      start = System.nanoTime();\n      crcValue = checksumBufferedInputStream(filename);\n\
  \      end = System.nanoTime();\n      System.out.println(Long.toHexString(crcValue));\n\
  \      System.out.printf(\"%.3f seconds%n\", (end - start) * 1E-9);\n\n      System.out.println(\"\
  Random Access File:\");\n      start = System.nanoTime();\n      crcValue = checksumRandomAccessFile(filename);\n\
  \      end = System.nanoTime();\n      System.out.println(Long.toHexString(crcValue));\n\
  \      System.out.printf(\"%.3f seconds%n\", (end - start) * 1E-9);\n\n      System.out.println(\"\
  Mapped File:\");\n      start = System.nanoTime();\n      crcValue = checksumMappedFile(filename);\n\
  \      end = System.nanoTime();\n      System.out.println(Long.toHexString(crcValue));\n\
  \      System.out.printf(\"%.3f seconds%n\", (end - start) * 1E-9);\n   }\n}\n```\n\
  \n`java.io.FileInputStream` 1.0\n\n* `FileChannel getChannel()` 1.4\n  返回用于访问此输入流的通道。\n\
  \n`java.io.FileOutputStream` 1.0\n\n* `FileChannel getChannel()` 1.4\n  返回用于访问此输出流的通道。\n\
  \n`java.io.RandomAccessFile` 1.0\n\n* `FileChannel getChannel()` 1.4\n  返回用于访问此文件的通道。\n\
