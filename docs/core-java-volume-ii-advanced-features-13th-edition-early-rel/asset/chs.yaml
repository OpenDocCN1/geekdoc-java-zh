  \n\n\n# `java.awt.geom.RoundRectangle2D.Double` 1.2\n\n*   `RoundRectangle2D.Double(double\
  \ x, double y, double width, double height, double arcWidth, double arcHeight)`\n\
  \    根据给定的边界矩和弧尺寸构造一个圆矩形。关于 `arcWidth` 和 `arcHeight` 参数的解释，请参见图 12.34。\n\n## `java.awt.geom.Arc2D.Double`\
  \ 1.2\n\n*   `Arc2D.Double(double x, double y, double w, double h, double startAngle,\
  \ double arcAngle, int type)`\n    根据给定的边界矩、起始角度、弧角和弧类型构造一个弧。`startAngle` 和 `arcAngle`如图图\
  \ 12.35 所示。该类型为 `Arc2D.OPEN`、`Arc2D.PIE` 和 `Arc2D.CHORD` 之一。\n\n## `java.awt.geom.QuadCurve2D.Double`\
  \ 1.2\n\n*   `QuadCurve2D.Double(double x1, double y1, double ctrlx, double ctrly,\
  \ double x2, double y2)`\n    从起点、控制点和终点构造一条二次曲线。\n\n## `java.awt.geom.CubicCurve2D.Double`\
  \ 1.2\n\n*   `CubicCurve2D.Double(double x1, double y1, double ctrlx1, double ctrly1,\
  \ double ctrlx2, double ctrly2, double x2, double y2)`\n    从起点、两个控制点和终点构造一条三次曲线。\n\
  \n## `java.awt.geom.GeneralPath` 1.2\n\n*   `GeneralPath()`\n    构造一个空的通用路径。\n\n\
  ## `java.awt.geom.Path2D.Float` 6\n\n*   `void moveTo(float x, float y)`\n    将\
  \ (`x`, `y`) 设置为*当前点*——即下一个线段的起点。\n*   `void lineTo(float x, float y)`\n*   `void\
  \ quadTo(float ctrlx, float ctrly, float x, float y)`\n*   `void curveTo(float ctrl1x,\
  \ float ctrl1y, float ctrl2x, float ctrl2y, float x, float y)`\n    从当前点到终点 (`x`,\
  \ `y`) 绘制一条直线、二次曲线或三次曲线，并将该终点设为当前点。\n\n## `java.awt.geom.Path2D` 6\n\n*   `void\
  \ append(Shape s, boolean connect)`\n    将给定形状的轮廓添加到通用路径中。如果 `connect` 为 `true`，则用一条直线将通用路径的当前点与所加形状的起点连接起来。\n\
  *   `void closePath()`\n    通过从当前点到路径中的第一个点绘制一条直线来关闭路径。\n\n### 区域 (Areas)\n\n在上一节中，你已经看到如何通过构造由线条和曲线组成的通用路径来指定复杂形状。通过使用足够数量线条和曲线，你可以绘制基本上任何形状。例如，你在屏幕和打印输出上看到的字体字符形状是由线条和二次或三次曲线组成的。\n\
  \n有时，通过由*区域*（如矩形、多边形或椭圆）组合来描述形状更为简单。Java 2D API 支持四种*构造区域几何*操作，可以将两个区域合并为一个新区域。\n\
  \n*   `add`：合并后的区域包含位于第一个或第二个区域中的所有点。\n*   `subtract`：合并后的区域包含位于第一个区域但不在第二个区域中的所有点。\n\
  *   `intersect`：合并后的区域包含同时位于第一个和第二个区域中的所有点。\n*   `exclusiveOr`：合并后的区域包含位于第一个或第二个区域但不在两者之中的所有点。\n\
  \n图 12.40 显示了这些操作。\n\n![Figure](img/fig07-10.jpg)构造区域几何操作\n\n要构造复杂的区域，从一个默认区域对象开始。\n\
  \n```\nvar a = new Area();\n```\n\n然后，将区域与任何形状合并。\n\n```\na.add(new Rectangle2D.Double(.\
  \ . .));\na.subtract(path);\n. . .\n```\n\n`Area` 类实现了 `Shape` 接口。你可以使用 `Graphics2D`\
  \ 类的 `draw` 方法描绘区域的边界，或者使用 `fill` 方法填充内部。\n\n## `java.awt.geom.Area`\n\n*   `void\
  \ add(Area other)`\n*   `void subtract(Area other)`\n*   `void intersect(Area other)`\n\
  *   `void exclusiveOr(Area other)`\n    对此区域和另一个区域执行构造区域几何操作，并将此区域设置为结果。\n\n###\
  \ 描边 (Strokes)\n\n`Graphics2D` 类的 `draw` 操作使用当前选的*笔画 (stroke)* 绘制形状的边界。默认情况下，笔画是\
  \ 1 像素宽的实线。可以通过调用 `setStroke` 方法并提供实现 `Stroke` 接口的类对象来选择不同的笔画。Java 2D API 仅定义了这样一个类，称为\
  \ `BasicStroke`。在本节中，我们将查看 `BasicStroke` 的功能。\n\n\n\n\n该程序与 Listing 12.15 中的程序类似。鼠标监听器记录了你在线段端点的点击，而鼠标移动监听器则监控端点的拖拽操作。一组单选按钮用于让用户选择端点样式（cap\
  \ style）、连接处样式（join style）以及实线或虚线。`StrokePanel` 类的 `paintComponent` 方法构造了一个 `GeneralPath`，它由两条线段组成，这两条线段连接了用户可以用鼠标移动的三个点。然后，它根据用户的选择构造一个\
  \ `BasicStroke`，最后绘制该路径。\n\n`stroke/StrokeTest.java`\n\n```java\npackage stroke;\n\
  \nimport java.awt.*;\nimport java.awt.event.*;\nimport java.awt.geom.*;\nimport\
  \ javax.swing.*;\n\n/**\n * 此程序演示了不同的描边线条类型。\n * @version 1.05 2018-05-01\n * @author\
  \ Cay Horstmann\n */\npublic class StrokeTest\n{\n   public static void main(String[]\
  \ args)\n   {\n      EventQueue.invokeLater(() ->\n         {\n            var frame\
  \ = new StrokeTestFrame();\n            frame.setTitle(\"StrokeTest\");\n      \
  \      frame.setDefaultCloseOperation(JFrame.EXIT_ON_CLOSE);\n            frame.setVisible(true);\n\
  \         });\n   }\n}\n\n/**\n * 此框架允许用户选择端点样式、连接样式和线条样式，\n * 并显示生成的描边结果。\n */\n\
  class StrokeTestFrame extends JFrame\n{\n   private StrokeComponent canvas;\n  \
  \ private JPanel buttonPanel;\n\n   public StrokeTestFrame()\n   {\n      canvas\
  \ = new StrokeComponent();\n      add(canvas, BorderLayout.CENTER);\n\n      buttonPanel\
  \ = new JPanel();\n      buttonPanel.setLayout(new GridLayout(3, 3));\n      add(buttonPanel,\
  \ BorderLayout.NORTH);\n\n      var group1 = new ButtonGroup();\n      makeCapButton(\"\
  Butt Cap\", BasicStroke.CAP_BUTT, group1);\n      makeCapButton(\"Round Cap\", BasicStroke.CAP_ROUND,\
  \ group1);\n      makeCapButton(\"Square Cap\", BasicStroke.CAP_SQUARE, group1);\n\
  \n      var group2 = new ButtonGroup();\n      makeJoinButton(\"Miter Join\", BasicStroke.JOIN_MITER,\
  \ group2);\n      makeJoinButton(\"Bevel Join\", BasicStroke.JOIN_BEVEL, group2);\n\
  \      makeJoinButton(\"Round Join\", BasicStroke.JOIN_ROUND, group2);\n\n     \
  \ var group3 = new ButtonGroup();\n      makeDashButton(\"Solid Line\", false, group3);\n\
  \      makeDashButton(\"Dashed Line\", true, group3);\n   }\n\n   /**\n    * 创建一个单选按钮来改变端点样式。\n\
  \    * @param label 按钮标签\n    * @param style 端点样式\n    * @param group 单选按钮组\n  \
  \  */\n   private void makeCapButton(String label, final int style, ButtonGroup\
  \ group)\n   {\n      // 选择组中的第一个按钮\n      boolean selected = group.getButtonCount()\
  \ == 0;\n      var button = new JRadioButton(label, selected);\n      buttonPanel.add(button);\n\
  \      group.add(button);\n      button.addActionListener(event -> canvas.setCap(style));\n\
  \      pack();\n   }\n\n   /**\n    * 创建一个单选按钮来改变连接样式。\n    * @param label 按钮标签\n\
  \    * @param style 连接样式\n    * @param group 单选按钮组\n    */\n   private void makeJoinButton(String\
  \ label, final int style, ButtonGroup group)\n   {\n      // 选择组中的第一个按钮\n      boolean\
  \ selected = group.getButtonCount() == 0;\n      var button = new JRadioButton(label,\
  \ selected);\n      buttonPanel.add(button);\n      group.add(button);\n      button.addActionListener(event\
  \ -> canvas.setJoin(style));\n   }\n\n   /**\n    * 创建一个单选按钮来设置实线或虚线。\n    * @param\
  \ label 按钮标签\n    * @param style false 为实线，true 为虚线\n    * @param group 单选按钮组\n\
  \    */\n   private void makeDashButton(String label, final boolean style, ButtonGroup\
  \ group)\n   {\n      // 选择组中的第一个按钮\n      boolean selected = group.getButtonCount()\
  \ == 0;\n      var button = new JRadioButton(label, selected);\n      buttonPanel.add(button);\n\
  \      group.add(button);\n      button.addActionListener(event -> canvas.setDash(style));\n\
  \   }\n}\n\n/**\n * 此组件绘制两条连接的线条，使用不同的描边对象，\n * 并允许用户拖拽定义线条的三个点。\n */\nclass StrokeComponent\
  \ extends JComponent\n{\n   private static final Dimension PREFERRED_SIZE = new\
  \ Dimension(400, 400); \n   private static int SIZE = 10;\n\n   private Point2D[]\
  \ points;\n   private int current;\n   private float width;\n   private int cap;\n\
  \   private int join;\n   private boolean dash;\n\n   public StrokeComponent()\n\
  \   {\n      addMouseListener(new MouseAdapter()\n         {\n            public\
  \ void mousePressed(MouseEvent event)\n            {\n               Point p = event.getPoint();\n\
  \               for (int i = 0; i < points.length; i++)\n               {\n    \
  \              double x = points[i].getX() - SIZE / 2;\n                  double\
  \ y = points[i].getY() - SIZE / 2;\n                  Point2D r = new Point2D.Double(x,\
  \ y);\n                  if (r.contains(p))\n                  {\n             \
  \        points[i] = p;\n                  }\n               }\n            }\n\
  \            public void mouseReleased(MouseEvent event)\n            {\n      \
  \         current = -1;\n            }\n            public void mouseDragged(MouseEvent\
  \ event)\n            {\n               Point p = event.getPoint();\n          \
  \     for (int i = 0; i < points.length; i++)\n               {\n              \
  \    double x = points[i].getX() - SIZE / 2;\n                  double y = points[i].getY()\
  \ - SIZE / 2;\n                  Point2D r = new Point2D.Double(x, y);\n       \
  \           if (r.contains(p))\n                  {\n                     points[i]\
  \ = p;\n                  }\n               }\n            }\n         });\n\n \
  \     points = new Point2D[3];\n      width = 8.0F;\n   }\n\n   public void paintComponent(Graphics\
  \ g)\n   {\n      Graphics2D g2 = (Graphics2D) g;\n      GeneralPath path = new\
  \ GeneralPath();\n      path.moveTo(points[0].getX(), points[0].getY());\n     \
  \ path.lineTo(points[1].getX(), points[1].getY());\n      path.lineTo(points[2].getX(),\
  \ points[2].getY());\n      BasicStroke stroke;\n      if (dash)\n      {\n    \
  \     float miterLimit = 10.0F;\n         float[] dashPattern = { 10F };\n     \
  \    float dashPhase = 0;\n         stroke = new BasicStroke(width, cap, join, miterLimit,\
  \ dashPattern, dashPhase);\n      }\n      else\n      {\n         stroke = new\
  \ BasicStroke(width, cap, join);\n      }\n      g2.setStroke(stroke);\n      g2.draw(path);\n\
  \   }\n\n   public void setCap(int c)\n   {\n      cap = c;\n      repaint();\n\
  \   }\n\n   public void setJoin(int j)\n   {\n      join = j;\n      repaint();\n\
  \   }\n\n   public void setDash(boolean d)\n   {\n      dash = d;\n      repaint();\n\
  \   }\n\n   public Dimension getPreferredSize() { return PREFERRED_SIZE; }\n}\n\
  ```\n\n`java.awt.Graphics2D` 1.2\n\n*   `void setStroke(Stroke s)`\n\n    sets the\
  \ stroke of this graphics context to the given object that implements the `Stroke`\
  \ interface.\n\n`java.awt.BasicStroke` 1.2\n\n*   `BasicStroke(float width)`\n\n\
  *   `BasicStroke(float width, int cap, int join)`\n\n*   `BasicStroke(float width,\
  \ int cap, int join, float miterlimit)`\n\n*   `BasicStroke(float width, int cap,\
  \ int join, float miterlimit, float[] dash, float dashPhase)`\n\n    construct a\
  \ stroke object with the given attributes.\n\n    The end cap style is one of `CAP_BUTT`,\
  \ `CAP_ROUND`, and `CAP_SQUARE`.\n\n    The join style is one of `JOIN_BEVEL`, `JOIN_MITER`,\
  \ and `JOIN_ROUND`.\n\n### Paint\n\nWhen you fill a shape, its inside is covered\
  \ with *paint.* Use the `setPaint` method to set the paint style to an object whose\
  \ class implements the `Paint` interface. The Java 2D API provides such classes:\n\
  \n*   The `Color` class implements the `Paint` interface. To fill shapes with a\
  \ solid color, simply call `setPaint` with a `Color` object, such as\n\n\n\n\n\n\
  ```\ng2.setPaint(Color.red);\n```\n\n*   `GradientPaint` 类通过在两个给定的颜色值之间插值来改变颜色（参见图\
  \ 12.45）。\n\n    ![Figure](img/fig07-15.jpg)渐变绘制\n\n*   `TexturePaint` 类通过重复图像来填充区域（参见图\
  \ 12.46）。\n\n    ![Figure](img/fig07-16.jpg)纹理绘制\n\n你可以通过指定两个点以及你在这两个点上所需的颜色来构造一个\
  \ `GradientPaint` 对象。\n\n```\ng2.setPaint(new GradientPaint(p1, Color.RED, p2, Color.YELLOW));\n\
  ```\n\n颜色沿连接两点的点线进行插值。在与该连接线垂直的直线上，颜色保持不变。超出线段端点的点将赋予该端点的颜色。\n\n或者，如果你在调用 `GradientPaint`\
  \ 构造函数时将 `cyclic` 参数设置为 `true`：\n\n```\ng2.setPaint(new GradientPaint(p1, Color.RED,\
  \ p2, Color.YELLOW, true));\n```\n\n那么，颜色变化将循环，并在超出端点后继续变化。\n\n要构造 `TexturePaint`\
  \ 对象，需要指定一个 `BufferedImage` 和一个 `anchor`（锚点）矩形。\n\n```\ng2.setPaint(new TexturePaint(bufferedImage,\
  \ anchorRectangle));\n```\n\n我将在本章后面讨论图像时介绍 `BufferedImage` 类。获取缓冲图像的最简单方法是读取图像文件：\n\
  \n```\nbufferedImage = ImageIO.read(new File(\"blue-ball.gif\"));\n```\n\n锚点矩形在\
  \ `x` 和 `y` 方向上无限扩展，平铺整个坐标平面。图像被缩放以适应锚点，然后复制到每个瓷格中。\n\n### `java.awt.Graphics2D`\
  \ 1.2\n\n*   `void setPaint(Paint s)`\n\n    将此图形上下文的绘制画具设置为实现 `Paint` 接口的给定对象。\n\
  \n### `java.awt.GradientPaint` 1.2\n\n*   `GradientPaint(float x1, float y1, Color\
  \ color1, float x2, float y2, Color color2)`\n*   `GradientPaint(float x1, float\
  \ y1, Color color1, float x2, float y2, Color color2, boolean cyclic)`\n*   `GradientPaint(Point2D\
  \ p1, Color color1, Point2D p2, Color color2)`\n*   `GradientPaint(Point2D p1, Color\
  \ color1, Point2D p2, Color color2, boolean cyclic)`\n\n    构造一个渐变绘制对象，用颜色填充形状，使得起点用\
  \ `color1` 填充，终点用 `color2` 填充，中间的颜色进行线性插值。在连接起点和终点的线垂直的直线上，颜色保持不变。默认情况下，渐变绘制不是循环的——也就是说，超出起点和终点的点将与起点和终点相同的颜色填充。如果渐变绘制是循环的，则颜色将继续插值，首先返回起始点颜色，然后在两个方向上无限重复。\n\
  \n### `java.awt.TexturePaint` 1.2\n\n*   `TexturePaint(BufferedImage texture, Rectangle2D\
  \ anchor)`\n\n    创建一个纹理绘制对象。锚点矩形定义了要绘制空间的平铺方式；它在 `x` 和 `y` 方向上无限重复，纹理图像被缩放以填充每个瓷格。\n\
  \n### 坐标变换\n\n假设你需要画一个对象，例如汽车。根据制造商的规格，你知道它的高度、轴距和总长度。当然，你可以假设每米的像素数，并计算出所有的像素位置。然而，有一种更简单的方法：你可以要求图形上下文为你完成转换。\n\
  \n```\ng2.scale(pixelsPerMeter, pixelsPerMeter);\ng2.draw(new Line2D.Double(coordinates\
  \ in meters)); // 转换为像素并\n                                                   //\
  \ 绘制缩放后的线\n```\n\n`Graphics2D` 类的 `scale` 方法将图形上下文的坐标变换设置为缩放变换。该变换将用户坐标（用户指定的单位）转换为设备坐标（像素）。图\
  \ 12.47 显示了该变换的工作原理。\n\n    ![Figure](img/fig07-17.jpg)用户坐标和设备坐标\n\n坐标变换在实践中非常有用。它们允许你使用方便的坐标值进行工作。图形上下文负责将它们转换为像素的脏累工作。\n\
  \n有四种基本的变换：\n\n*   缩放：从一个固定点放大或缩小所有距离\n*   旋转：绕一个固定中心旋转所有点\n*   平移：按固定量移动所有点\n*\
  \   剪切：保持一条直线固定，并使平行于该线的直线比例“滑动”，其滑动量与到固定线的距离成正比\n\n图 12.48 显示了这四种基本变换如何作用于单位正方形。\n\
  \n    ![Figure](img/fig07-18.jpg)基本变换\n\n`Graphics2D` 类的 `scale`、`rotate`、`translate`\
  \ 和 `shear` 方法将图形上下文的坐标变换设置为这些基本变换之一。\n\n你可以组合变换。例如，你可能想旋转并将其尺寸翻倍；提供旋转和缩放：\n\n```\n\
  g2.rotate(angle);\ng2.scale(2, 2);\n```\n\n在这种情况下，提供变换的顺序并不重要。然而，对于大多数变换，顺序是重要的。例如，考虑以下变换序列：\n\
  \n```\ng2.translate(x, y);\ng2.rotate(angle);\ng2.translate(-x, -y);\n```\n\n最后一个变换（最执行）将点\
  \ (`x`, `y`) 移动到原点。第二个变换绕原点旋转 `angle`。最后的变换将原点移回 (`x`, `y`)。由于绕非原点旋转是一种常见的操作，有一个快捷方法——参见图\
  \ 12.49：\n\n```\ng2.rotate(a, x, y);\n```\n\n    ![Figure](img/fig07-19.jpg)组合变换\n\
  \n如果你了解矩阵理论，可能知道所有的旋转、平移、缩放、剪切及其组合都可以用如下形式的变换矩阵表示：\n\n$\\begin{bmatrix} x_{\\text{new}}\
  \ \\\\ y_{\\text{new}} \\\\ 1 \\end{bmatrix} = \\begin{bmatrix} a & c & e \\\\ b\
  \ & d & f \\\\ 0 & 0 & 1 \\end{bmatrix} \\cdot \\begin{bmatrix} x \\\\ y \\\\ 1\
  \ \\end{bmatrix}$\n\n这种变换被称为仿变换。在 Java 2D API 中，`AffineTransform` 类描述了这种变换。如果你知道特定变换矩阵的组件，可以直接构造它：\n\
  \n```\nvar t = new AffineTransform(a, b, c, d, e, f);\n```\n\n此外，工厂方法 `getRotateInstance`、`getScaleInstance`、`getTranslateInstance`\
  \ 和 `getShearInstance` 用于构造这些变换类型的矩阵。例如，调用\n\n```\nt = AffineTransform.getScaleInstance(2.0F,\
  \ 0.5F);\n```\n\n返回一个对应于矩阵 $\\begin{bmatrix} 2 & 0 & 0 \\\\ 0 & 0.5 & 0 \\\\ 0 &\
  \ 0 & 1 \\end{bmatrix}$ 的变换。\n\n最后，实例方法 `setToRotation`、`setToScale`、`setToTranslation`\
  \ 和 `setToShear` 将变换对象设置为新类型。示例：\n\n```\nt.setToRotation(angle); // 将 t 设置为旋转\n\
  ```\n\n你可以将图形上下文的坐标变换设置为 `AffineTransform` 对象。\n\n```\ng2.setTransform(t); // 替换当前变换\n\
  ```\n\n\n\n\n然而，在实践中，你不应该调用 `setTransform` 操作，因为它会替换图形上下文可能拥有的任何现有变换。例如，用于横模式打印的图形上下文已经包含了一个\
  \ 90 度的旋转变换。如果你调用了 `setTransform`，就会抹掉该旋转。相反，请调用 `transform` 方法。\n\n```\ng2.transform(t);\
  \ // 将当前变换与 t 组合\n```\n\n它将现有的变换与新的 `AffineTransform` 对象组合。\n\n如果你只想临时应用某种变换，请先获取旧的变换，将其与你的新变换组合，最后在完成后恢复旧变换。\n\
  \n```\nAffineTransform oldTransform = g2.getTransform(); // 保存旧变换\ng2.transform(t);\
  \ // 应用临时变换 \n在 g2 上绘制\ng2.setTransform(oldTransform); // 恢复旧变换\n```\n\n#### `java.awt.geom.AffineTransform`\
  \ 1.2\n\n*   `AffineTransform(double a, double b, double c, double d, double e,\
  \ double f)`\n*   `AffineTransform(float a, float b, float c, float d, float e,\
  \ float f)`\n    使用矩阵构造仿变换\n    $\\begin{bmatrix} a & c & e \\\\ b & d & f \\\\\
  \ 0 & 0 & 1 \\end{bmatrix}$\n*   `AffineTransform(double[] m)`\n*   `AffineTransform(float[]\
  \ m)`\n    使用矩阵构造仿变换\n    $\\begin{bmatrix} \\mathtt{\\text{m[0]}} & \\mathtt{\\\
  text{m[2]}} & \\mathtt{\\text{m[4]}} \\\\ \\mathtt{\\text{m[1]}} & \\mathtt{\\text{m[3]}}\
  \ & \\mathtt{\\text{m[5]}} \\\\ 0 & 0 & 1 \\end{bmatrix}$\n*   `static AffineTransform\
  \ getRotateInstance(double a)`\n    绕原点旋转角度 `a`（弧度）。变换矩阵为：\n    $\\begin{bmatrix}\
  \ {\\cos(a)} & {- {\\sin(a)}} & 0 \\\\ {\\sin(a)} & {\\cos(a)} & 0 \\\\ 0 & 0 &\
  \ 1 \\end{bmatrix}$\n    如果 `a` 于 0 和 π / 2 之间，旋转将正 `x` 轴向正 `y` 轴移动。\n*   `static\
  \ AffineTransform getRotateInstance(double a, double x, double y)`\n    绕点 `(x,y)`\
  \ 旋转角度 `a`（弧度）。\n*   `static AffineTransform getScaleInstance(double sx, double\
  \ sy)`\n    创建一个缩放变换，将 `x` 轴缩放 `sx`，将 `y` 轴缩放 `sy`。变换矩阵为：\n    $\\begin{bmatrix}\
  \ {sx} & 0 & 0 \\\\ 0 & {sy} & 0 \\\\ 0 & 0 & 1 \\end{bmatrix}$\n*   `static AffineTransform\
  \ getShearInstance(double shx, double shy)`\n    创建一个剪切变换，将 `x` 轴剪切 `shx`，将 `y`\
  \ 轴剪切 `shy`。变换矩阵为：\n    $\\begin{bmatrix} 1 & {shx} & 0 \\\\ {shy} & 1 & 0 \\\\\
  \ 0 & 0 & 1 \\end{bmatrix}$\n*   `static AffineTransform getTranslateInstance(double\
  \ tx, double ty)`\n    创建一个平移，将 `x` 轴移动 `tx`，将 `y` 轴移动 `ty`。变换矩阵为：\n    $\\begin{bmatrix}\
  \ 1 & 0 & {tx} \\\\ 0 & 1 & {ty} \\\\ 0 & 0 & 1 \\end{bmatrix}$\n*   `void setToRotation(double\
  \ a)`\n*   `void setToRotation(double a, double x, double y)`\n*   `void setToScale(double\
  \ sx, double sy)`\n*   `void setToShear(double sx, double sy)`\n*   `void setToTranslation(double\
  \ tx, double ty)`\n    将此仿变换设置为带有给定参数的基本变换。参阅 `get`Xxx`Instance` 方法以获取基本变换及其参数的说明。\n\
  \n### `java.awt.Graphics2D` 1.2\n\n*   `void setTransform(AffineTransform t)`\n\
  \    用 `t` 替换此图形上下文现有的坐标变换。\n*   `void transform(AffineTransform t)`\n    将此图形上下文现有的坐标变换与\
  \ `t` 组合。\n*   `void rotate(double a)`\n*   `void rotate(double a, double x, double\
  \ y)`\n*   `void scale(double sx, double sy)`\n*   `void shear(double sx, double\
  \ sy)`\n*   `void translate(double tx, double ty)`\n    将此图形上下文现有的坐标变换与带有给定参数的基本变换组合。参阅\
  \ `AffineTransform.get`Xxx`Instance` 方法以获取基本变换及其参数的说明。\n\n##### 裁剪（Clipping）\n\n\
  通过在图形上下文中设置裁剪形状（clipping shape），你可以将所有绘制操作限制在该裁剪形状的内部。\n\n```\ng2.setClip(clipShape);\
  \ // 但见下文\ng2.draw(shape); // 仅绘制落在裁剪形状内的部分\n```\n\n然而，在实践中，你不想调用 `setClip` 操作，因为它会替换图形上下文可能拥有的任何现有裁剪形状。\n\
  \n要获取字符轮廓，你需要字体上下文。使用 `Graphics2D` 类的 `getFontContext` 方法。\n\n```\nFontRenderContext\
  \ context = g2.getFontContext();\n```\n\n接下来，使用字符串、字体和字体渲染上下文创建一个 `TextLayout` 对象：\n\
  \n```\nvar layout = new TextLayout(\"Hello\", font, context);\n```\n\n该文本布局对象描述了由特定字体上下文渲染的字符布局。向\
  \ `getOutline` 提供一个仿变换，以指定你希望轮廓出现的位置。\n\n```\nAffineTransform transform = AffineTransform.getTranslateInstance(0,\
  \ 100);\nShape outline = layout.getOutline(transform);\n```\n\n然后，将轮廓追加到裁剪形状中。\n\
  \n```\nvar clipShape = new GeneralPath();\nclipShape.append(outline, false);\n```\n\
  \n最后，设置裁剪形状并绘制一组线条。这些线条只出现在字符边界内。\n\n```\ng2.setClip(clipShape);\nvar p = new Point2D.Double(0,\
  \ 0);\nfor (int i = 0; i < NLINES; i++)\n{\n   double x = . . .;\n   double y =\
  \ . . .;\n   var q = new Point2D.Double(x, y);\n   g2.draw(new Line2D.Double(p,\
  \ q)); // 线条被裁剪了\n}\n```\n\n\n\n\n在标准的 RGB 色彩模型中，每种颜色都通过其红、绿、蓝分量来描述。然而，描述图像中`transparent`\
  \ 或部分透明的区域也是非常方便的。当你将一个图像叠加到现有绘图上时，透明像素完全不会遮挡其下方的像素，而部分透明像素则会与其下方的像素混合。图 12.51 显示了在图像上叠加一个半透明矩形的效果。你仍然可以看到图像的细节从矩形下方透出来。\n\
  \n![Figure](img/fig07-21.jpg)在图像上叠加一个半透明矩形\n\n在 Java 2D API 中，透明度是通过 `alpha channel`（alpha\
  \ 通道）来描述的。每个像素除了红、绿、蓝颜色分量外，还有一个介于 0（完全透明）和 1（完全不透明）之间的 alpha 值。例如，图 12.51 中的矩形是用具有\
  \ 50% 透明度的淡黄色填充的：\n\n```\nnew Color(0.7F, 0.7F, 0.0F, 0.5F);\n```\n\n现在让我们看看如果叠加两个形状会发生什么。你需要混合或\
  \ `compose` 源像素和目标像素的颜色以及 alpha 值。Porter 和 Duff 是计算机图形学领域的两位研究人员，他们为这种混合过程制定了 12\
  \ 种可能的 `composition rules`（组合规则）。Java 2D API 实现了所有这些规则。在继续下去之前，我想指出，这些规则中只有两个具有实际意义。如果你觉得这些规则深奥或令人困惑，只需使用\
  \ `SRC_OVER` 规则即可。它是 `Graphics2D` 对象的默认规则，并能提供最直观的结果。\n\n这里是规则背后的理论。假设你有一个 alpha\
  \ 值为 `a[S]` 的 `source pixel`（源像素）。在图像中，已经有一个 alpha 值为 `a[D]` 的 `destination pixel`（目标像素）。你想将这两个像素组合。图\
  \ 12.52 中的图表显示了如何设计组合规则。\n\n![Figure](img/fig07-22.jpg)设计组合规则\n\nPorter 和 Duff 将\
  \ alpha 值视为使用该像素颜色的概率。从源的角度来看，有 `a[S]` 的概率它想要使用源颜色，有 1 – `a[S]` 的概率它不在乎。目标的情况也是如此。在组合颜色时，让我们假设这些概率是独立的。那么就有如图\
  \ 12.52 所示的四种情况。如果源想要使用源颜色而目标不在乎，那么让源按其意愿行事似乎是合理的。这就是为什么图表的右上角标记为“S”。该事件发生的概率为 `a[S]`\
  \ · (1 – `a[D]`)。同样，左下角标记为“D”。如果目标和源都想选择自己的颜色，该怎么办？这就是 Porter–Duff 规则派上用场的地方。如果我们决定源更重要，我们也在右下角标记为“S”。那条规则被称为\
  \ `SRC_OVER`。在那条规则中，你以权重 `a[S]` 组合源颜色，并以权重 (1 – `a[S]`) · `a[D]` 组合目标颜色。\n\n视觉效果是源和目标的混合，并优先考虑源。特别是，如果\
  \ `a[S]` 为 1，则完全不考虑目标颜色。如果 `a[S]` 为 0，则源像素是完全透明的，目标颜色保持不变。\n\n其他规则取决于你在概率图的框中放入什么字母。表\
  \ 12.3 和 图 12.53 显示了 Java 2D API 支持的所有规则。图中的图像显示了当一个 alpha 为 0.75 的矩形源区域与 alpha\
  \ 为 1.0 的圆形目标区域组合时，这些规则的结果。\n\n### Porter–Duff 组合规则\n\n| 规则 | 解释 |\n| --- | ---\
  \ |\n| `CLEAR` | 源清除目标。 |\n| `SRC` | 源覆盖目标和空像素。 |\n| `DST` | 源不影响目标。 |\n| `SRC_OVER`\
  \ | 源与目标混合并覆盖空像素。 |\n| `DST_OVER` | 源不影响目标并覆盖空像素。 |\n| `SRC_IN` | 源覆盖目标。 |\n| `SRC_OUT`\
  \ | 源清除目标并覆盖空像素。 |\n| `DST_IN` | 源 alpha 修改目标。 |\n| `DST_OUT` | 源 alpha 补值修改目标。\
  \ |\n| `SRC_ATOP` | 源与目标混合。 |\n| `DST_ATOP` | 源 alpha 修改目标。源覆盖空像素。 |\n| `XOR` |\
  \ 源 alpha 补值修改目标。源覆盖空像素。 |\n\n![Figure](img/fig07-23.jpg)Porter–Duff 组合规则\n\n如你所见，大多数规则并不非常有用。考虑一个极端情况，例如\
  \ `DST_IN` 规则。它完全不考虑源颜色，而是使用源的 alpha 来影响目标。`SRC` 规则具有潜在的用处——它强制使用源颜色，关闭与目标的混合。\n\
  \n使用 `Graphics2D` 类的 `setComposite` 方法来安装实现 `Composite` 接口的类对象。Java 2D API 提供了这样一个类\
  \ `AlphaComposite`，它实现了图 12.53 中的所有 Porter–Duff 规则。\n\n`AlphaComposite` 类的工厂方法 `getInstance`\
  \ 生成一个 `AlphaComposite` 对象。你提供规则和用于源像素的 alpha 值。例如，请考虑以下代码：\n\n```\nint rule = AlphaComposite.SRC_OVER;\n\
  float alpha = 0.5f;\ng2.setComposite(AlphaComposite.getInstance(rule, alpha));\n\
  g2.setPaint(Color.blue);\ng2.fill(rectangle);\n```\n\n矩形随后使用蓝色和 0.5 的 alpha 值进行绘制。由于组合规则是\
  \ `SRC_OVER`，它透明地叠加在现有图像上。\n\nListing 12.17 中的程序允许你探索这些组合规则。从组合框中选择一个规则，并使用滑动条设置\
  \ `AlphaComposite` 对象的 alpha 值。\n\n此外，程序还显示了每个规则的文字描述。注意，这些描述是从组合规则图中计算得出的。例如，第二行的\
  \ `\"DS\"` 代表“与目标混合”。\n\n程序有一个重要的转折：无法保证对应屏幕的图形上下文具有 alpha 通道。（事实上，它通常没有）。当像素存入没有\
  \ alpha 通道的目标时，像素颜色会与 alpha 值相乘，且 alpha 值会被丢弃。现在，几条 Porter–Duff 规则使用了目标的 alpha 值，这意味着目标\
  \ alpha 通道是非常重要的。因此，我们使用带有 ARGB 颜色模型的缓冲图像来组合形状。图像组合完成后，我们将结果图像绘制到屏幕上。\n\n```\nvar\
