  \ 时返回类型 `A` 的数组。这些是终结操作。\n\n* `<R,A> R collect(Collector<? super T,A,R> collector)`\n\
  \n    使用给定的收集器收集流中的元素。`Collectors` 类为许多收集器提供了工厂方法。\n\n`java.util.stream.Collectors`\
  \ 8\n\n* `static <T> Collector<T,?,List<T>> toList()`\n\n* `static <T> Collector<T,?,List<T>>\
  \ toUnmodifiableList()` 10\n\n* `static <T> Collector<T,?,Set<T>> toSet()`\n\n*\
  \ `static <T> Collector<T,?,Set<T>> toUnmodifiableSet()` 10\n\n    产生将元素收集到列表或集合的收集器。\n\
  \n* `static <T,C extends Collection<T>> Collector<T,?,C> toCollection(Supplier<C>\
  \ collectionFactory)`\n\n    产生一个收集到任意集合的收集器。传递构造器引用如 `TreeSet::new`。\n\n* `static\
