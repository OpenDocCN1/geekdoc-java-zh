  \ 8\n\n* `long getCount()`\n\n    返回计数。\n\n* `double getAverage()`\n\n    返回平均值，如果没有元素则返回\
  \ `NaN`。\n\n* `double getMax()`\n\n    返回最大值，如果没有元素则返回正无穷。\n\n* `double getMin()`\n\
  \n    返回最小值，如果没有元素则返回负无穷。\n\n## 将元素收集到 Map\n\n假设你有一个 `Stream<Person>` 并想将元素收集到 map\
  \ 中，以便以后通过 ID 查找。调用 `Collectors.toMap` 并传入两个产生 map 键和值的函数。例如：\n\n```java\npublic\
  \ record Person(int id, String name) {}\n. . .\nMap<Integer, String> idToName =\
  \ people.collect(\n   Collectors.toMap(Person::id, Person::name));\n```\n\n在值应该是元素本身的常见情况下，对第二个函数使用\
  \ `Function.identity()`。\n\n```java\nMap<Integer, Person> idToPerson = people.collect(\n\
  \   Collectors.toMap(Person::id, Function.identity()));\n```\n\n如果如果有多个元素具有相同的键，就会发生冲突，收集器将抛出\
  \ `IllegalStateException`。你可以通过提供第三个函数来覆盖这种行为，该函数根据现有值和新值确定键的值。\n\n在这里，我们构建了一个 map，其中包含可用区域的每种语言，键为其在默认语言中的名称（例如\
  \ `\"German\"`），值为其被本地化后的名称（例如 `\"Deutsch\"`）。\n\n```java\nMap<String, String> languageNames\
  \ = Locale.availableLocales().collect(\n   Collectors.toMap(\n      Locale::getDisplayLanguage,\
  \ \n      loc -> loc.getDisplayLanguage(loc),\n      (existingValue, newValue) ->\
  \ existingValue));\n```\n\n我们不在意同一种语言可能会出现两次（例如，德国和瑞士的德语），所以我们只保留第一个条目。\n\n\n\n\n\
  \n```\nMap<String, Set<String>> countryLanguageSets = Locale.availableLocales().collect(\n\
  \   Collectors.toMap(\n      Locale::getDisplayCountry,\n      l -> Collections.singleton(l.getDisplayLanguage()),\n\
  \      (a, b) ->\n         { // Union of a and b\n            var union = new HashSet<String>(a);\
  \ \n            union.addAll(b);\n            return union;\n         }));\n```\n\
  \n在下一节中，你将看到获取此 map 的简单方法。\n\n如果你想要一个 `TreeMap`，请将构造函数作为第四参数提供。你必须提供一个合并函数。这里是节开头示例之一，现在返回一个\
  \ `TreeMap`：\n\n```\nMap<Integer, Person> idToPerson = people.collect(\n   Collectors.toMap(\n\
  \      Person::id,\n      Function.identity(),\n      (existingValue, newValue)\
  \ -> { throw new IllegalStateException(); },\n      TreeMap::new));\n```\n\n对于每个\
  \ `toMap` 方法都有一个对应的 `toConcurrentMap` 方法，它会产生一个并发 map。在并行集合过程中会使用单个并发 map。当与并行流（parallel\
  \ stream）配合使用时，共享 map 比合并 map 效率更高。注意，元素不再按流的顺序收集，但这通常没有区别。\n\n代码列表 1.5 中的程序提供了将流结果收集到\
  \ map 中的示例。\n\n``collecting/CollectingIntoMaps.java`\n\n```java\npackage collecting;\n\
  \nimport java.io.*;\nimport java.util.*;\nimport java.util.function.*;\nimport java.util.stream.*;\n\
