  ` |\n| `\\Q...\\ \\E` | 引号开始和结束之间的所有内容 | `\\Q(. . .)\\E` 匹配字符串 `(. . .)` |\n| **字符类**\
  \ | | |\n| `[C[1]C[2]...]`, 其中 `C[i]` 是字符、范围 `c-d` 或字符类 | 由 `C[1], C[2], . . .`\
  \ 代表的任何字符 | `[0-9+-]` |\n| `[^...]` | 字符类的补集 | `[^\\d\\s]` |\n| `[...]&&...]` |\
  \ 字符类的交集 | `[\\p{L}&&[^A-Za-z]]` |\n| `\\p{...}`, `\\P{...}` | 预定义的字符类（参见表 2.13）；其补集\
  \ | `\\p{L}` 匹配 Unicode 字母，`\\pL` 也是如此——你可以省略单个字母周围的大括号 |\n| `\\d`, `\\D` | 数字 (`[0-9]`，或在设置了\
  \ `UNICODE_CHARACTER_CLASS` 标志时使用 `\\p{Digit}`）；其补集 | `\\d+` 是数字序列 |\n| `\\w`, `\\\
  W` | 单词字符 (`[a-zA-Z0-9_]`，或在设置了 `UNICODE_CHARACTER_CLASS` 标志时使用 Unicode 单词字符）；其补集\
  \ | |\n| `\\s`, `\\S` | 空格 (` \\n\\r\\t\\f\\x{B}]，或在设置了 `UNICODE_CHARACTER_CLASS`\
  \ 标志时使用 `\\p{IsWhite_Space}`）；其补集 | `\\s*,\\s*` 是由可选空白围绕的逗号 |\n| `\\h`, `\\v`, `\\\
  H`, `\\V` | 水平空白、垂直空白、它们的补集 | |\n| **序列与选择** | | |\n| `XY` | 来自 `X` 的任意字符串，后跟来自\
  \ `Y` 的任意字符串 | `[1-9][0-9]*` 是没有前导零的正数 |\n| `X|Y` | 来自 `X` 或 `Y` 的任意字符串 | `http|ftp`\
  \ |\n| **分组** | | |\n| `(X)` | 捕获 `X` 的匹配 | `([^']*)` 捕获引号文本 |\n| `\\n` | 第 `n`\
  \ 组 | `(['*)` 匹配 `'Fred'` 或非 `\"Fred\"` |\n| `(?<name>X)` | 用给定名称捕获 `X` 的匹配 | `(?<id>[A-Za-z0-9]+)`\
  \ 捕获匹配 `id` |\n| `\\k<name>` | 有名称的组 | `\\k<id>` 匹配组 `id` |\n| `(?:X)` | 使用括号但不捕获\
  \ | `(?:http://(.*))` 在 `://` 之后的匹配项是 `\\1` |\n| `(?i:X)` | 在标志开启或关闭的情况下匹配但不捕获 `X`\
  \ | `(?i:g)` 是不区分大小写的 |\n| 其他 `(...)` | 参见 `Pattern` 文档 | |\n| **量词** | | |\n| `X?`\
  \ | 零或可选的 `X` | `\\+` 是可选的符号 |\n| `X*`, `X+` | 0 个或多个 `X`，1 个或多个 `X` | `[1-9][0-9]+`\
  \ 是整数 |\n| `X{n}`, `X{m,n}` | `n` 次 `X`，`m` 到 `n` 次 `X` | `X{1,3}` 是一次到三次 |\n| `X??`\
  \ | 懒婪的 `X` 量化 | | 贪婪且不回溯的 | 贪婪且不回溯的 `X` |\n| `X++` | 占有性的 `X` 量化 | | 占有且不回溯的 `X`\
  \ |\n| **边界匹配** | | |\n| `^$` | 输入的开始、结束（多行模式下为行的开始、结束） | `^$` 匹配输入或行 `Java` |\n\
  | `\\A \\Z` | 输入的绝对开始、结束（不受多行模式影响） | |\n| `\\b \\B` | 单词边界、非单词边界 | `\\bJava` 匹配单词\
  \ `Java` |\n| `\\b{g}` | 字形簇边界 | 用于 `split` 将字符串分解为字形簇 |\n| `\\R` | Unicode 换行符\
  \ | |\n| `\\G` | 上一个匹配的结束 | |\n\n## 预定义字符类 \\p{...}\n\n| 名称 | 说明 |\n| --- | ---\
  \ |\n| `posixClass` | `posixClass` 是以下之一：`Lower`, `Upper`, `Alpha`, `Digit`, `Alnum`,\
  \ `Punct`, `Graph`, `Print`, `Cntrl`, `XDigit`, `Space`, `ASCII`，解释为 POSIX 或 Unicode\
  \ 类，取决于 `UNICODE_CHARACTER_CLASS` 标志 |\n| `IsScript`, `sc=Script`, `script=Script`\
  \ | `Character.UnicodeScript.forName` 接受的脚本 |\n| `InBlock`, `blk=Block`, `block=Block`\
  \ | `Character.UnicodeBlock.forName` 接受的区块 |\n| `Category`, `InCategory`, `gc=Category`,\
  \ `general_category=Category` | Unicode 通类的双字母名称 |\n| `IsProperty` | `Property`\
  \ 是以下之一：`Alphabetic`, `Ideographic`, `Letter`, `Lowercase`, `Uppercase`, `Titlecase`,\
  \ `Punctuation`, `Control`, `White_Space`, `Digit`, `Hex_Digit`, `Join_Control`,\
  \ `Noncharacter_Code_Point`, `Assigned` |\n| `javaMethod` | 调用方法 `Character.isMethod`（不得被弃用）\
  \ |\n\n### 测试匹配\n\n通常，使用正则表达式有两种方法：你想确定一个字符串是否符合表达式，或者你想在字符串中找到正则表达式的所有匹配项。\n\n\
  在第一种情况下，简单使用静态 `matches` 方法：\n\n```\nString regex = \"-?\\\\d+\";\nCharSequence\
  \ input = . . .;\nif (Pattern.matches(regex, input))\n{\n   . . .\n}\n```\n\n\n\n\
  如果你需要多次使用同一个正则表达式，先将其编译起来会更高效。然后，为每个输入创建一个 `Matcher`：\n\n```\nPattern pattern =\
  \ Pattern.compile(regex);\nMatcher matcher = pattern.matcher(input);\nif (matcher.matches())\
  \ . . .\n```\n\n如果匹配成功，你可以获取被匹配组的位置——请参阅下节。\n\n如果你想测试输入是否*包含*匹配项，请使用 `find` 方法代替\
  \ `match`：\n\n```\nif (matcher.find()) . . .\n```\n\n`find` 和 `match` 方法会改变 `Matcher`\
  \ 对象的状态。如果你只是想知道给定的 `Matcher` 是否已经找到了匹配项，请改用 `hasMatch` 方法。\n\n你可以将模式转换为一个谓词（predicate）：\n\
  \n```\nPattern digits = Pattern.compile(\"[0-9]+\");\nList<String> strings = List.of(\"\
  December\", \"31st\", \"1999\");\nList<String> matchingStrings = strings.stream().filter(digits.asMatchPredicate()).toList();\n\
  \   // [\"1999\"]\n```\n\n结果包含所有匹配该正则表达式的字符串。\n\n使用 `asPredicate` 方法来测试字符串是否包含匹配项：\n\
  \n```\nList<String> sringsContainingMatch = strings.stream().filter(digits.asPredicate()).toList();\n\
  \   // [\"31st\", \"1999\"]\n```\n\n### 在字符串中查找所有匹配项\n\n在本节中，我们考虑正则表达式的另一个常见用例——查找输入中的所有匹配项。使用此循环：\n\
  \n```\nString input = . . .;\nMatcher matcher = pattern.matcher(input);\nwhile (matcher.find())\n\
  {\n   String match = matcher.group();\n   int matchStart = matcher.start();\n  \
  \ int matchEnd = matcher.end();\n   . . .\n}\n```\n\n通过这种方式，你可以依次处理每个匹配项。如代码片段所示，你可以获取匹配到的字符串以及它在输入字符串中的位置。\n\
  \n更优雅的方法是你可以调用 `results` 方法来获取一个 `Stream<MatchResult>`。`MatchResult` 接口拥有 `group`、`start`\
  \ 和 `end` 方法，就像 `Matcher` 一样。（事实上，`Matcher` 类已经实现了该接口）。以下是获取所有匹配项列表的方法：\n\n```\n\
  List<String> matches = pattern.matcher(input)\n   .results()\n   .map(MatchResult::group)\n\
  \   .toList();\n```\n\n如果你在文件中中有数据，可以使用 `Scanner.findAll` 方法来获取 `Stream<MatchResult>`，而无需先将内容读取到字符串。你可以传递一个\
  \ `Pattern` 或模式字符串：\n\n```\nScanner in = new Scanner(path, \"UTF_8\");\nStream<String>\
  \ words = in.findAll(\"\\\\pL+\")\n   .map(MatchResult::group);\n```\n\n[Listing\
  \ 2.7] 展示了这种机制。它定位网页中所有的超链接并将其打印出来。要运行该程序，请在命令行提供一个 URL，例如：\n\n```\njava match.HrefMatch\
  \ https://horstmann.com\n```\n\nmatch/HrefMatch.java\n\n```\npackage match;\n\n\
  import java.io.*;\nimport java.net.*;\nimport java.util.regex.*;\n\n/**\n * 该程序通过匹配描述\
  \ <a href=...> HTML 标签的正则表达式\n * 来显示网页中的所有 URL。按如下方式启动程序<br>\n * java match.HrefMatch\
  \ URL\n * \n * @version 1.05 2023-08-16\n * @author Cay Horstmann\n */\npublic class\
  \ HrefMatch\n{\n   public static void main(String[] args)\n   {\n      try\n   \
  \   {\n         // 从命令行获取 URL 字符串或使用默认值\n         String urlString;\n         if\
  \ (args.length > 0)\n            urlString = args[0];\n         else\n         \
  \   urlString = \"https://openjdk.org/\";\n\n         // 读取 URL 内容\n         InputStream\
  \ in = URI.create(urlString).toURL().openStream();\n         var input = new String(in.readAllBytes());\n\
  \n         // 搜索模式的所有出现\n         String patternString = \"<a\\\\s+href\\\\s*=\\\
  \\s*(\\\"[^\\\"]*\\\"|[^\\\\s>]*)\\\\s*>\";\n         Pattern pattern = Pattern.compile(patternString,\
  \ Pattern.CASE_INSENSITIVE);\n         pattern.matcher(input).results().map(MatchResult::group).forEach(System.out::println);\n\
  \      } catch (IOException | PatternSyntaxException e)\n      {\n         e.printStackTrace();\n\
  \      }\n   }\n}\n```\n\n### 组（Groups）\n\n使用组来提取匹配项的组件是常见的。例如，假设发票中有一行包含项目名称、数量和单价的项目项，如下：\n\
  \n```\nBlackwell Toaster    USD29.95\n```\n\n这是一个为每个组件编写了组的正则表达式：\n\n```\n(\\p{Alnum}+(\\\
  s+\\p{Alnum}+)*)\\s+([A-Z]{3})([0-9.]*)\n```\n\n匹配后，你可以从 matcher 中提取第 `n` 组：\n\n\
  ```\nString contents = matcher.group(n);\n```\n\n组根据其左括号的顺序排序，从 1 开始计数。（组 0 是整个输入）。在这个示例中，这里是拆解输入的方法：\n\
  \n```\nMatcher matcher = pattern.matcher(input);\nif (matcher.matches())\n{\n  \
  \ item = matcher.group(1);\n   currency = matcher.group(3);\n   price = matcher.group(4);\n\
  }\n```\n\n我们对组 2 不感兴趣；它是为了重复而产生的括号。为了更清晰，你可以使用非捕获组：\n\n```\n(\\p{Alnum}+(?:\\s+\\\
  p{Alnum}+)*)\\s+([A-Z]{3})([0-9.]*)\n```\n\n或者，更好的是使用命名组：\n\n```\n(?<item>\\p{Alnum}+(\\\
  s+\\p{Alnum}+)*)\\s+(?<currency>[A-Z]{3})(0-9.]*)\n```\n\n然后，你可以通过名称检索项：\n\n```\n\
  item = matcher.group(\"item\");\n```\n\n通过 `start` 和 `end` 方法，你可以获取组在输入中的位置：\n\n\
  ```\nint itemStart = matcher.start(\"item\");\nint itemEnd = matcher.end(\"item\"\
  );\n```\n\n从 Java 20 开始，`MatchResult` 类也支持命名组。\n\n`namedGroups` 方法产生组名到数字的 `Map<String,\
  \ Integer>`。\n\n当你在重复内部有一个组时（例如示例中的 `(\\s+\\p{Alnum}+)*`），无法获取它的所有匹配项。`group` 方法只产生最后一个匹配，这通常没用。你需要用另一个组来捕获整个表达式。\n\
  \n你可以在正则表达式中添加注释。注释以 `#` 开始并持续到行尾。这在配合文本块时效果特别好：\n\n```\nvar regex = \"\"\"\n([1-9]|1[0-2])\
  \ #小时\n:([0-5][0-9]) #分钟\n[ap]m\"\"\"; \n```\n\n[Listing 2.8] 提示用户输入模式，然后输入要匹配的字符串。它会打印输入是否匹配模式。如果输入匹配且模式包含组，程序将以括号形式打印组边界，例如：\n\
  \n```\n((11):(59))am\n```\n\nregex/RegexTest.java\n\n\n\n\n```java\npackage regex;\n\
  \n/**\n * 此程序测试正则表达式匹配。输入模式和要匹配的字符串，\n * 或按回车键退出。如果模式包含分组，则在匹配结果中显示分组边界。\n * @version\
  \ 1.03 2018-05-01\n * @author Cay Horstmann\n */\n\nimport java.util.*;\nimport\
  \ java.util.regex.*;\n\npublic class RegexTest\n{\n   public static void main(String[]\
  \ args) throws PatternSyntaxException\n   {\n      var in = new Scanner(System.in);\n\
  \      System.out.println(\"Enter pattern: \");\n      String patternString = in.nextLine();\n\
  \n      Pattern pattern = Pattern.compile(patternString);\n\n      while (true)\n\
  \      {\n         System.out.println(\"Enter string to match: \");\n         String\
  \ input = in.nextLine();\n         if (input == null || input.equals(\"\"))\n  \
  \          return;\n         Matcher matcher = pattern.matcher(input);\n       \
  \  if (matcher.matches())\n         {\n            System.out.println(\"Match\"\
  );\n            int g = matcher.groupCount();\n            if (g > 0)\n        \
  \    {\n               for (int i = 0; i < input.length(); i++)\n              \
  \ {\n                  // Print any empty groups\n                  for (int j =\
  \ 1; j <= g; j++)\n                     if (i == matcher.start(j) && i == matcher.end(j))\n\
  \                        System.out.print(\"()\");\n                  // Print (\
  \ for non-empty groups starting here\n                  for (int j = 1; j <= g;\
  \ j++)\n                     if (i == matcher.start(j) && i != matcher.end(j))\n\
  \                        System.out.print(\"(\");\n                  System.out.print(input.charAt(i));\n\
  \                  // Print ) for non-empty groups ending here\n               \
  \   for (int j = 1; j <= g; j++)\n                     if (i + 1 != matcher.start(j)\
  \ && i + 1 == matcher.end(j))\n                        System.out.print(\")\");\n\
  \               }\n               System.out.println();\n            }\n       \
  \  } \n         else\n            System.out.println(\"No match\");\n      }\n \
  \  }\n}\n```\n\n### 分隔符分割\n\n有时，你想要根据匹配的分隔符分割输入并保留其他内容。`Pattern.split` 方法自动完成此任务。你将得到一个字符串数组，其中删除了分隔符：\n\
  \n```\nString input = \"1, 2 , 3,4\";\nPattern commas = Pattern.compile(\"\\\\s*,\\\
  \\s*\");\nString[] tokens = commas.split(input); // [\"1\", \"2\", \"3\", \"4\"\
  ]\n```\n\n如果有许多标记，你可以懒性地获取：\n\n```\nStream<String> tokens = commas.splitAsStream(input);\n\
  ```\n\n要同时捕获分隔符，使用 `splitWithDelimiters` 方法：\n\n```\ntokens = commas.splitWithDelimiters(input,\
  \ -1); // [\"1\", \", \", \"2\", \" , \", \"3\", \",\", \"4\"] \n```\n\n如果第二个参数是正数\
  \ `n`，则分隔模式最多应用 `n - 1` 次，最后一个元素是剩余的字符串。否则，模式将尽可能多次应用。如果限制为 0，末尾的空字符串将被丢弃。\n\n如果你不在意预编译模式或懒性获取，可以直接使用\
  \ `String` 类的 `split` 和 `splitWithDelimiter` 方法：\n\n```\ntokens = input.split(\"\
  \\\\s*,\\\\s*\");\n```\n\n人们很容易忘记 `split` 的参数是一个正则表达式。例如，\n\n```\n\"com.horstmann.corejava\"\
  .split(\".\") \n```\n\n它并不会沿点进行分割。相反，每个字符都是一个分隔符，结果是一个空数组！\n\n你需要在正则表达式中使用反斜杠转义点，因此在字符串字面量中需要两个反斜杠：\n\
  \n```\n\"com.horstmann.corejava\".split(\"\\\\.\") \n```\n\n或者，使用 `Pattern.quote`\
  \ 方法：\n\n```\n\"com.horstmann.corejava\".split(Pattern.quote(\".\"));\n```\n\n如果输入在文件中，请使用扫描器：\n\
  \n```\nScanner in = new Scanner(path, \"UTF_8\");\nin.useDelimiter(\"\\\\s*,\\\\\
  s*\");\nStream<String> tokens = in.tokens();\n```\n\n### 替换匹配\n\n如果你想将正则表达式的所有匹配项替换为字符串，可以在匹配器上调用\
  \ `replaceAll`：\n\n```\nMatcher matcher = commas.matcher(input);\nString result\
  \ = matcher.replaceAll(\",\");\n   // 规范化逗号\n```\n\n或者，如果你不在意预编译，使用 `String` 类的\
  \ `replaceAll` 方法。\n\n```\nString result = input.replaceAll(\"\\\\s*,\\\\s*\", \"\
  ,\");\n```\n\n替换字符串可以包含分组编号 `$n` 或名称 `${name}`。它们将被替换为相应捕获分组的内容。\n\n```\nString\
  \ result = \"3:45\".replaceAll(\n   \"(\\\\d{1,2}):(?<minutes>\\\\d{2})\", \n  \
  \ \"$1 hours and ${minutes} minutes\");\n   // 将结果设置为 \"3 hours and 45 minutes\"\
  \n```\n\n你可以使用 `\\` 在替换字符串中转义 `$` 和 `\\` `，或者你可以调用 `Matcher.quoteReplacement`。\n\
  \n### 标志\n\n几个标志可以改变正则表达式的行为。你可以在编译模式时指定它们：\n\n```\nPattern pattern = Pattern.compile(regex,\
  \ Pattern.CASE_INSENSITIVE | Pattern.UNICODE_CLASS);\n```\n\n或者你可以在模式内部指定它们：\n\n\
  ```\nString regex = \"(?iU:expression)\";\n```\n\n以下是标志：\n\n- `CASE_INSENSITIVE`\
  \ 或 `i`：不区分大小写匹配。默认情况下，此标志仅对 ASCII 字符有效。\n- `UNICODE_CASE` 或 `u`：与 `CASE_INSENSITIVE`\
  \ 配合使用时，使用 Unicode 大小写匹配。\n- `UNICODE_CLASS` 或 `U`：选择 Unicode 类而不是 POSIX。隐含 `UNICODE_CASE`。\n\
  - `MULTILINE` 或 `m`：使 `^` 和 `$` 匹配行尾，而不是整个输入。\n- `UNIX_LINES` 或 `d`：在多行模式下，只有 `'\\\
  n'` 是换行符。\n- `DOTALL` 或 `s`：使 `.` 匹配所有字符，包括换行符。\n- `COMMENTS` 或 `x`：忽略空格和注释（从 `#`\
  \ 到行尾）。\n- `LITERAL`：模式被视为字面量并必须精确匹配，除非可能不区分大小写。\n- `CANON_EQ`：考虑 Unicode 字符的规范等效性。例如，u\
  \ 后跟 ¨（变音符号）可以匹配 ü。\n\n后两个标志无法在正则表达式内部指定。\n\n`java.util.regex.Pattern` 1.4\n\n-\
  \ `static Pattern compile(String expression)`\n- `static Pattern compile(String\
  \ expression, int flags)`：将正则表达式字符串编译为模式对象以便快速处理匹配。`flags` 参数设置了一个或多个 `CASE_INSENSITIVE`、`UNICODE_CASE`、`MULTILINE`、`UNIX_LINES`、`DOTALL`\
  \ 和 `CANON_EQ` 位。\n- `Matcher matcher(CharSequence input)`：返回一个 `matcher` 对象，可以使用它来定位输入中模式的匹配。\n\
  - `String[] split(CharSequence input)`\n- `String[] split(CharSequence input, int\
  \ limit)`\n- `String[] splitWithDelimiters(CharSequence input, int limit)`\n- `Stream<String>\
  \ splitAsStream(CharSequence input)`\n\n\n\n\n将输入字符串拆分为多个标记（tokens），用模式指定分隔符的形式。返回一个标记的数组或流。分隔符不属于标记的一部分。第二种形式具有一个参数\
  \ `limit`，表示生成的字符串最大数量。如果找到了 `limit - 1` 个匹配的分隔符，则返回的数组的最后一个条将包含剩余的未拆分输入。如果 `limit`\
  \ 小于 `0`，则对整个输入进行拆分。如果 `limit` 为 `0`，则末尾的空字符串不会放入返回的数组中。\n\n*   `Map<String, Integer>\
  \ namedGroups()` 20\n\n    产生从组名到组索引的不可变映射。\n\n`java.util.regex.Matcher` 1.4\n\n\
  *   `boolean matches()`\n\n    如果输入匹配模式，则返回 `true`。\n\n*   `boolean lookingAt()`\n\
  \n    如果输入的开头匹配模式，则返回 `true`。\n\n*   `boolean find()`\n\n*   `boolean find(int start)`\n\
  \n    尝试找到下一个匹配项，如果找到了另一个匹配项，则返回 `true`。\n\n*   `boolean hasMatch()` 20\n\n    如果此匹配器由于调用\
  \ `matches` 或 `find` 而位于匹配项上，则为 `true`。\n\n*   `String replaceAll(String replacement)`\n\
  \n*   `String replaceFirst(String replacement)`\n\n    返回通过用替换字符串替换所有匹配（或第一个匹配）从匹配器输入中获取的字符串。替换字符串可以包含对模式组的引用如\
  \ `$n`。使用 `\\$` 来包含 `$` 符号。\n\n*   `static String quoteReplacement(String str)`\
  \ 5.0\n\n    对 `str` 中所有的 `\\` 和 `$` 进行引用。\n\n*   `String replaceAll(Function<MatchResult,String>\
  \ replacer)` 9\n\n    将每个匹配项替换为对 `MatchResult` 应用 `replacer` 函数的结果。\n\n*   `Stream<MatchResult>\
  \ results()` 9\n\n    产生一个所有匹配结果的流。\n\n`java.util.regex.MatchResult` 5.0\n\n*  \
  \ `String group()`\n\n*   `String group(int group)`\n\n*   `String group(String\
  \ name)` 20\n\n    产生匹配的字符串或由给定组匹配的字符串。\n\n*   `int start()`\n\n*   `int end()`\n\
  \n*   `int start(int group)`\n\n*   `int start(String nane)` 20\n\n*   `int end(int\
  \ group)`\n\n*   `int end(String name)` 20\n\n    产生匹配的字符串或由给定组匹配的字符串的起始和结束偏移。\n\
  \n*   `Map<String, Integer> namedGroups()` 20\n\n    产生从组名到底层模式组索引的不可变映射。\n\n`java.util.Scanner`\
  \ 5.0\n\n*   `Stream<MatchResult> findAll(Pattern pattern)` 9\n\n    产生由此扫描器产生的输入中给定模式的所有匹配项的流。\n\
  \n你现在已经了解了如何在 Java 中执行输入输出操作，并对作为“新 I/O”规范一部分的正则表达式包有了概述。在下一章中，我们将转向 XML 数据的处理。\n\
  \n# XML\n\nDon Box 等人编写的书籍 *Essential XML* (Addison-Wesley, 2000) 的序言中曾半开玩笑地提到：“可扩展标记语言（XML）已经取代了\
  \ Java、设计模式和对象技术，成为软件行业解决世界饥饿的方案。”这种炒作早已消失，但正如你在本章中看到的，XML 仍然是一种描述结构化信息的非常有用的技术。XML\
  \ 工具可以轻松处理和转换这些信息。然而，XML 并不是万灵药。你需要特定领域的标准和代码库来有效使用它。此外，XML 远没有让 Java 过时，它与 Java\
  \ 的配合非常好。自 20 世纪 90 年代后期以来，IBM、Apache 等在产生高质量的 XML 处理 Java 库方面发挥了关键作用。许多此类库现在已集成到\
  \ Java 平台中。\n\n本章介绍了 XML 并涵盖了 Java API 的 XML 特性。我们会在此指出何时使用 XML 是合理的——以及何时你必须保留意见，并尝试用老办法解决问题：通过良好的设计和代码。\n\
  \n## 介绍 XML\n\n在 第一卷第 9 章 中，你已经看到使用*属性文件*来描述程序的配置。属性文件包含一组键/值对，例如：\n\n```\nfontname=Times\
  \ Roman\nfontsize=12\nwindowsize=400 200\ncolor=0 50 100\n```\n\n你可以使用 `Properties`\
  \ 类通过单个方法调用来读取此类文件。这是一个很好的功能，但它还不够彻底。在许多情况下，你想要描述的信息比属性文件格式能够舒适处理的具有更多结构。考虑示例中的\
  \ `fontname/fontsize` 条目。如果有一个单一的条目会更面向对象：\n\n```\nfont=Times Roman 12\n```\n\n\
  但这样，解析字体描述就会变得糟糕，因为你必须弄清楚字体名称何时结束、字体大小何时开始。\n\n属性文件具有单一的平级层次结构。你经常可以看到程序员使用这样的键名来绕过该限制：\n\
  \n```\ntitle.fontname=Helvetica\ntitle.fontsize=36\nbody.fontname=Times Roman\n\
  body.fontsize=12\n```\n\n属性文件格式的另一个缺点是要求键必须是唯一的。为了存储一组值，你需要另一种变通方法，如：\n\n```\nitem.1=Times\
  \ Roman\nitem.2=Helvetica\nitem.3=Goudy Old Style\n```\n\nXML 解决了这些问题。它可以层次层次，因此比属性文件更灵活。一个配置\
  \ XML 文件可能如下：\n\n```\n<config>\n   <entry id=\"title\">\n      <name>Helvetica</name>\n\
  \      <size>36</size>\n   </entry>\n   <entry id=\"body\">\n      <name>Times Roman</name>\n\
  \      <size>12</size>\n   </entry>\n   <entry id=\"background\">\n      <color>\n\
  \         <red>0</red>\n         <green>50</green>\n         <blue>100</blue>\n\
  \      </color>\n   </entry>\n</config>\n```\n\nXML 格式允许记录重复元素而无需条件。\n\nXML 文件的格式非常直观。它与\
  \ HTML 文件相似。这有一个原因——XML 和 HTML 都是 SGML 的后代。\n\nSGML 自 70 年代以来一直用于描述复杂文档。它在需要维护的行业取得了成功，特别是航空业。然而，SGML\
  \ 非常复杂，所以它并没有流行。这种复杂性很大源于 SGML 有两个冲突的目标：SGML 希望确保文档按照文档类型规则形成，但也想通过允许快捷方式来简化输入输入。XML\
  \ 被设计为用于互联网的 SGML 简化版本。正如通常情况那样，简单越好，XML 享受了 SGML 长期以来未获得的立即和热烈反响。\n\n你可以在 [`www.xml.com/axml/axml.html`](https://www.xml.com/axml/axml.html)\
  \ 找到 Tim Bray 注释的 XML 标准版本。\n\n尽管 XML 和 HTML 有共同根，它们之间存在重要的区别。\n\n*   与 HTML 不同，XML\
  \ 是大小敏感的。例如`<H1>` 和 `<h1>` 是不同的 XML 标签。\n\n*   在 HTML 中，你可以省略结束标签（如 `</p>` 或 `</li>`），如果从上下文可以判断段落或列表项何时结束。在\
  \ XML 中，你永远不能省略结束标签。\n\n*   在 XML 中，没有匹配结束标签的单标签元素必须以 `/` 结尾，例如 `<img src=\"coffeecup.png\"\
  />`。这样，解析器就知道不需要寻找 `</img>` 标签。\n\n\n\n\n\n*   在 HTML 中，你可以拥有没有值的属性名，例如 `<input\
  \ type=\"radio\" name=\"language\" value=\"Java\" checked>`。在 XML 中，所有属性必须有值，例如\
  \ `checked=\"true\"` 或（哎）`checked=\"checked\"`。\n*   存在针对 HTML 4 和 HTML 5 版本的 XML\
  \ 规范，被称为 XHTML。\n\n## XML 文档的结构\n\nXML 文档应该以头部开头，例如：\n\n```xml\n<?xml version=\"\
  1.0\"?>\n```\n\n或者\n\n```\n<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n```\n\n严格来说，头部是可选的，但强烈建议加上它。\n\
  \n由于 SGML 是为了处理真实文档而创建的，XML 文件被称为 `documents`（文档），尽管其中许多文件描述的是人们通常不会称为文档的数据集。\n\n\
  头部之后可以跟一个 `document type definition`（DTD），例如：\n\n```\n<!DOCTYPE web-app PUBLIC\n\
  \   \"-//Sun Microsystems, Inc.//DTD Web Application 2.2//EN\"\n   \"http://java.sun.com/j2ee/dtds/web-app_2_2.dtd\"\
  >\n```\n\nDTDs 是确保文档正确性的重要机制，但不是强制要求的。我们将在本章稍后讨论它们。\n\n最后，XML 文档的主体包含 `root element`（根元素），它可以包含其他元素。例如：\n\
  \n```\n<?xml version=\"1.0\"?>\n<!DOCTYPE config . . .>\n<config>\n   <entry id=\"\
  title\">\n      <font>\n         <name>Helvetica</name>\n         <size>36</size>\n\
  \      </font>\n   </entry>\n   . . .\n</config>\n```\n\n一个元素可以包含 `child elements`（子元素）、文本或两者兼有。在前面的示例中，`font`\
  \ 元素有两个子元素，`name` 和 `size`。`name` 元素包含文本 `\"Helvetica\"`。\n\n最好的结构是组织你的 XML 文档，使得元素`要么`包含子元素`或者`包含文本。以下是一个你应该避免的示例：\n\
  \n```\n<font>\n   Helvetica\n   <size>36</size>\n</font>\n```\n\n这在 XML 规范中被称为 `mixed\
  \ content`（混合内容）。正如你将在本章后部分看到的，如果你避免混合内容，就可以简化解析。\n\nXML 元素可以包含属性，例如：\n\n```\n<size\
  \ unit=\"pt\">36</size>\n```\n\nXML 设计者之间对于何时使用元素以及何时使用属性存在一些分歧。例如，描述字体时，似乎比下面的方式更简单：\n\
  \n```\n<font name=\"Helvetica\" size=\"36\"/>\n```\n\n```\n<font>\n   <name>Helvetica</name>\n\
  \   <size>36</size>\n</font>\n```\n\n然而，属性的灵活性要小得多。假设你想给大小值添加单位。如果你使用属性，你将不得不把单位添加到属性值中：\n\
  \n```\n<font name=\"Helvetica\" size=\"36 pt\"/>\n```\n\n哎！现在你必须得解析字符串 `\"36 pt\"\
  `，这正是 XML 设计旨在避免的此类麻烦。在 `size` 元素上添加属性要简洁得多：\n\n```\n<font>\n   <name>Helvetica</name>\n\
  \   <size unit=\"pt\">36</size>\n</font>\n```\n\n一个常用的经验法是：属性仅应用于修改对值的解释，而不是用于指定值。如果你发现自己正在讨论某个特定设置是否是对值的修改，那么只需对属性说“不”，并贯穿始终都使用元素即可。在\
  \ HTML 中，属性使用的的规则非常简单：如果它显示在网页上，它就是一个属性。例如，考虑这个超链接：\n\n```\n<a href=\"http://java.sun.com\"\
  >Java Technology</a>\n```\n\n字符串 `Java Technology` 显示在网页上，但链接的 URL 并不是显示页面的一部分。然而，这套规则对于大多数文件来说并不完全有用，因为\
  \ XML 文件中的数据通常不是为了给人类阅读而设计的。元素和文本是 XML 文档的“中流砥”。以下是你可能会遇到的几类内容：\n\n*   `Character\
  \ references`（字符引用）具有 `decimalValue` 或 `hexValue` 形式，表示字符。你可以在 DTD 中定义其他的实体引用。\n\
  *   `Entity references`（实体引用）具有 `name` 形式，具有预定义的含义：小于号、大于号、安培符号、引号和单引号字符。\n*   `CDATA\
  \ sections`（CDATA 节）由 `<![CDATA[` 和 `]]>` 分隔。它们是字符数据的特殊形式。你可以使用它们来包含含有字符的字符串，而不会让它们被解释为标记，例如：\n\
  \n```\n<![CDATA[ < are my favorite ]]>\n```\nCDATA 节不能包含字符串 `]]>`。请谨慎使用此功能！它经常被用作将数据带入\
  \ XML 文档的后门。\n*   `Processing instructions`（处理指令）是处理 XML 文档的应用指令。它们由 `<?` 和 `?>`\
  \ 分隔，例如：\n\n```\n<?xml-stylesheet href=\"style.css\" type=\"text/css\"?>\n```\n\
  每个 XML 文档都以处理指令 version=\"1.0\" 开头。\n*   `Comments`（注释）由 `<!--` 和 `-->` 分隔，例如：\n\
  \n```\n<!-- This is a comment. -->\n```\n\n注释不应包含字符串 `--`。注释应该只包含人类读者的信息。它们永远不应该包含隐藏命令；请使用处理指令。\n\
  \n## 解析 XML 文档\n\n为了处理 XML 文档，你需要对其进行 `parse`（解析）。解析器是一个读取文件、确认文件格式正确、将其拆分为组成元素并允许程序员访问这些元素的程序。Java\
  \ API 提供了两种类型的解析器：\n\n*   Tree parsers（树解析器），例如 Document Object Model（DOM）解析器，它将\
  \ XML 文档读入树结构。\n*   Streaming parsers（流解析器），例如 Simple API for XML（SAX）解析器，它在读取 XML\
  \ 文档时生成事件。\n\nDOM 解析器对于大多数用途更容易使用，因此我们先解释它们。如果你处理的是树结构会消耗大量内存的长文档，或者你只对少数元素感兴趣而不关心它们的上下文，可以考虑使用流解析器。更多信息请参阅第\
  \ 3.7 节。\n\nDOM 解析接口由世界维网联盟（W3C）标准化。`org.w3c.dom` 包包含了如 `Document` 和 `Element` 等接口类型的定义。不同的供应商（如\
  \ Apache 组织和 IBM）编写了实现这些接口的 DOM 解析器。Java XML 处理 API（JAXP）实际上使得接入任何这些解析器都成为可能。但 JDK\
  \ 也带了一个源自 Apache 的 DOM 解析器。\n\n要读取 XML 文档，你需要一个从 `DocumentBuilderFactory` 获取的 `DocumentBuilder`\
  \ 对象，如下：\n\n```\nDocumentBuilderFactory factory = DocumentBuilderFactory.newInstance();\n\
  DocumentBuilder builder = factory.newDocumentBuilder();\n```\n\n现在你可以从文件读取文档：\n\n\
  ```\nFile f = . . .;\nDocument doc = builder.parse(f);\n```\n\n或者，你可以使用 URL：\n\n\
  ```\nURL u = . . .;\nDocument doc = builder.parse(u.toString());\n```\n\n你甚至可以指定任意输入流：\n\
  \n```\nInputStream in = . . .;\nDocument doc = builder.parse(in);\n```\n\n使用输入流作为输入源，解析器将无法定位文档所在的其他文件（例如同一目录下的\
  \ DTD）。你可以安装“实体解析器”来解决此问题。更多信息请参阅 [`www.xml.com/pub/a/2004/03/03/catalogs.html`](https://www.xml.com/pub/a/2004/03/03/catalogs.html)\
  \ 和 [`https://openjdk.org/jeps/268`](https://https://openjdk.org/jeps/268)。\n\n\n\
  \n\n\n`Document` 对象是 XML 文档树结构的在内存中的表示。它由实现 `Node` 接口及其各种子接口的类组成。图 3.1 显示了子接口的继承层次结构。\n\
  \n![Figure](img/fig02-01.jpg)`Node` 接口及其子接口\n\n通过调用 `getDocumentElement` 方法开始分析文档内容。它返回根元素。\n\
  \n```\nElement root = doc.getDocumentElement();\n```\n\n例如，假设你正在处理一个文档：\n\n```xml\n\
  <?xml version=\"1.0\"?>\n<font>\n   . . .\n</font>\n```\n\n那么调用 `getDocumentElement`\
  \ 将返回 `font` 元素。\n\n`getTagName` 方法返回元素的标签名称。在前面的示例中，`root.getTagName()` 返回字符串 `\"\
  font\"`。\n\n要获取一个元素的子节点（可能是子元素、文本、注释或其他节点），请使用 `getChildNodes` 方法。该方法返回一个 `NodeList`\
  \ 类型的集合。该类型在标准 Java 集合之前就已经标准化了，因此它具有不同的访问协议。`item` 方法获取给定索引的项，`getLength` 方法给出项的总数。你可以像这样枚举所有子节点：\n\
  \n```\nNodeList children = root.getChildNodes();\nfor (int i = 0; i < children.getLength();\
  \ i++)\n{\n   Node child = children.item(i);\n   . . .\n}\n```\n\n在分析子节点时要小心。例如，假设你正在处理以下文档：\n\
  \n```xml\n<font>\n   <name>Helvetica</name>\n   <size>36</size>\n</font>\n```\n\n\
  你期望 `font` 元素有两个子节点，但解析器报告了五个：\n\n* `<font>` 和 `<name>` 之间的空白字符\n* `name` 元素\n*\
  \ `</name>` 和 `<size>` 之间的空白字符\n* `size` 元素\n* `</size>` 和 `</font>` 之间的空白字符\n\n\
  图 3.2 显示了 DOM 树。\n\n![Figure](img/fig02-02.jpg)简单的 DOM 树\n\n如果你只期望子元素，可以忽略空白字符：\n\
  \n```\nfor (int i = 0; i < children.getLength(); i++)\n{\n   Node child = children.item(i);\n\
  \   if (child instanceof Element childElement)\n   {\n      . . .\n   }\n}\n```\n\
  \n现在你只看两个标签名为 `name` 和 `size` 的元素。\n\n正如你将在下一节中看到的，如果你的文档有一个 DTD，你可以做得更好。这时解析器会知道哪些元素没有文本节点作为子节点，它可以为你过滤掉空白字符。\n\
  \n在分析 `name` 和 `size` 元素时，你想要检索它们包含的文本字符串。这些文本字符串本身包含类型为 `Text` 的子节点中。你知道这些 `Text`\
  \ 节点是唯一的子节点，因此你可以使用 `getFirstChild` 方法而无需遍历另一个 `NodeList`。然后，使用 `getData` 方法检索存储在\
  \ `Text` 节点中的字符串：\n\n```\nfor (int i = 0; i < children.getLength(); i++)\n{\n  \
  \ Node child = children.item(i);\n   if (child instanceof Element childElement)\n\
  \   {\n      var textNode = (Text) childElement.getFirstChild();\n      String text\
  \ = textNode.getData().strip();\n      if (childElement.getTagName().equals(\"name\"\
  ))\n         name = text;\n      else if (childElement.getTagName().equals(\"size\"\
  ))\n         size = Integer.parseInt(text);\n   }\n}\n```\n\n对 `getData` 方法的返回值调用\
  \ `strip` 是一个好主意。如果 XML 文件的作者将起始标签和结束标签放在不同的行，如下所示：\n\n```xml\n<size>\n   36\n</size>\n\
  ```\n\n那么解析器会将所有的换行符和空格包含文本节点数据中。调用 `strip` 方法可以移除实际数据周围的空白字符。\n\n你还可以使用 `getLastChild`\
  \ 获取最后一个子节点，并使用 `getNextSibling` 获取节点的相邻节点。因此，遍历节点子节点的另一种方法是：\n\n```\nfor (Node\
  \ childNode = element.getFirstChild();\n      childNode != null;\n      childNode\
  \ = childNode.getNextSibling())\n{\n   . . .\n}\n```\n\n要枚举节点的属性，请调用 `getAttributes`\
  \ 方法。它返回一个包含描述属性的 `Node` 对象的 `NamedNodeMap` 对象。你可以像遍历 `NodeList` 一样遍历 `NamedNodeMap`\
  \ 中的节点。然后，调用 `getNodeName` 和 `getNodeValue` 方法获取属性名和属性值。\n\n```\nNamedNodeMap attributes\
  \ = element.getAttributes();\nfor (int i = 0; i < attributes.getLength(); i++)\n\
  {\n   Node attribute = attributes.item(i);\n   String name = attribute.getNodeName();\n\
  \   String value = attribute.getNodeValue();\n   . . .\n}\n```\n\n或者，如果你知道属性名称，可以直接检索对应的值：\n\
  \n```\nString unit = element.getAttribute(\"unit\");\n```\n\n你现在已经了如何分析 DOM 树。列表\
  \ 3.1 中的程序通过将 XML 文档转换为 JSON 格式来应用这些技术。\n\n树形显示清楚地展示了子元素是如何被包含空白和注释的文本包围的。你可以清楚地看到换行符和返回符显示为\
  \ `\\n`。\n\n你不需要熟悉 JSON 就能理解程序是如何与 DOM 树工作的。只需观察以下内容：\n\n* 我们使用 `DocumentBuilder`\
  \ 从文件读取 `Document`。\n* 对于每个元素，我们打印标签名、属性和元素。\n* 对于字符数据，我们生成一个包含数据的字符串。如果数据来自注释，我们添加一个\
  \ `\"Comment: \"` 前缀。\n\n```java\ndom/JSONConverter.java\n```\n\n\n\n\n```java\n\
  package dom;\n\nimport java.io.*;\nimport java.util.*;\n\nimport javax.xml.parsers.*;\n\
  \nimport org.w3c.dom.*;\nimport org.xml.sax.*;\n\n/**\n * 此程序将 XML 文档以 JSON 格式树树显示。\n\
  \ * @version 1.21 2021-05-30\n * @author Cay Horstmann\n */\npublic class JSONConverter\n\
  {\n   public static void main(String[] args) \n         throws SAXException, IOException,\
  \ ParserConfigurationException\n   {\n      String filename;\n      if (args.length\
  \ == 0)\n      {\n         try (var in = new Scanner(System.in))\n         {\n \
  \           System.out.print(\"Input file: \");\n            filename = in.nextLine();\n\
  \         }\n      }\n      else\n         filename = args[0];\n      DocumentBuilderFactory\
  \ factory = DocumentBuilderFactory.newInstance();\n      DocumentBuilder builder\
  \ = factory.newDocumentBuilder();\n\n      Document doc = builder.parse(filename);\n\
  \      Element root = doc.getDocumentElement();\n      System.out.println(convert(root,\
  \ 0));\n   }\n\n   public static StringBuilder convert(Node node, int level)\n \
  \  {\n      if (node instanceof Element elem)\n      {\n         return elementObject(elem,\
  \ level);\n      }\n      else if (node instanceof CharacterData cd)\n      {\n\
  \         return characterString(cd, level);\n      }\n      else \n      {\n  \
  \       return pad(new StringBuilder(), level).append(\n            jsonEscape(node.getClass().getName()));\n\
  \      }\n   }\n\n   private static Map<Character, String> replacements = Map.of('\\\
  b', \"\\\\b\", '\\f', \"\\\\f\", \n      '\\n', \"\\\\n\", '\\r', \"\\\\r\", '\\\
  t', \"\\\\t\", '\"', \"\\\\\\\"\", '\\\\', \"\\\\\\\\\");\n\n   private static StringBuilder\
  \ jsonEscape(String str)\n   {\n      var result = new StringBuilder(\"\\\"\");\n\
  \      for (int i = 0; i < str.length(); i++)\n      {\n         char ch = str.charAt(i);\n\
  \         String replacement = replacements.get(ch);\n         if (replacement ==\
  \ null) result.append(ch);\n         else result.append(replacement);\n      }\n\
  \      result.append(\"\\\"\");\n      return result;\n   }\n\n   private static\
  \ StringBuilder characterString(CharacterData node, int level)\n   {\n      var\
  \ result = new StringBuilder(); \n      StringBuilder data = jsonEscape(node.getData());\n\
  \      if (node instanceof Comment) data.insert(1, \"Comment: \");\n      pad(result,\
  \ level).append(data); \n      return result;\n   }\n\n   private static StringBuilder\
  \ elementObject(Element elem, int level)\n   {\n      var result = new StringBuilder();\n\
  \      pad(result, level).append(\"{\\n\");\n      pad(result, level + 1).append(\"\
  \\\"name\\\": \");\n      result.append(jsonEscape(elem.getTagName()));      \n\
  \      NamedNodeMap attrs = elem.getAttributes();\n      if (attrs.getLength() >\
  \ 0)\n      {\n         pad(result.append(\",\\n\"), level + 1).append(\"\\\"attributes\\\
  \": \");\n         result.append(attributeObject(attrs));\n      }\n      NodeList\
  \ children = elem.getChildNodes();         \n      if (children.getLength() > 0)\n\
  \      {         \n         pad(result.append(\",\\n\"), level + 1).append(\"\\\"\
  children\\\": [\\n\");\n         for (int i = 0; i < children.getLength(); i++)\n\
  \         {\n            if (i > 0) result.append(\",\\n\");\n            result.append(convert(children.item(i),\
  \ level + 2));\n         }\n         result.append(\"\\n\");\n         pad(result,\
  \ level + 1).append(\"]\\n\");\n      }\n      pad(result, level).append(\"}\");\n\
  \      return result;\n   }\n\n   private static StringBuilder pad(StringBuilder\
  \ builder, int level)\n   {\n      for (int i = 0; i < level; i++) builder.append(\"\
  \  \");\n      return builder;\n   }\n\n   private static StringBuilder attributeObject(NamedNodeMap\
  \ attrs)\n   {\n      var result = new StringBuilder(\"{\");\n      for (int i =\
  \ 0; i < attrs.getLength(); i++)\n      {\n         if (i > 0) result.append(\"\
  , \");\n         result.append(jsonEscape(attrs.item(i).getNodeName()));\n     \
  \    result.append(\": \");\n         result.append(jsonEscape(attrs.item(i).getNodeValue()));\n\
  \      }\n      result.append(\"}\");\n      return result;\n   }\n}\n```\n\n`javax.xml.parsers.DocumentBuilderFactory`\
  \ 1.4\n\n* `static DocumentBuilderFactory newInstance()`\n    返回 `DocumentBuilderFactory`\
  \ 类的实例。\n\n* `DocumentBuilder newDocumentBuilder()`\n    返回 `DocumentBuilder` 类的实例。\n\
  \n`javax.xml.parsers.DocumentBuilder`` 1.4\n\n* `Document parse(File f)`\n\n* `Document\
  \ parse(String url)`\n\n* `Document parse(InputStream in)`\n    从给定的文件、URL 或输入流解析\
  \ XML 文档并返回解析后的文档。\n\norg.w3c.dom.Document` 1.4\n\n* `Element getDocumentElement()`\n\
  \    返回文档的根元素。\n\norg.w3c.dom.Element` 1.4\n\n* `String getTagName()`\n    返回元素的名称。\n\
  \n* `String getAttribute(String name)`\n    返回属性的值。\n\norg.w3c.dom.Node` 1.4\n\n\
  * `NodeList getChildNodes()`\n    返回包含所有节点的列表。\n\n* `Node getFirstChild()`\n\n*\
  \ `Node getLastChild()`\n    获取第一个或最后一个节点。\n\n* `Node getNextSibling()`\n\n* `Node\
  \ getPreviousSibling()`\n    获取下一个或上一个兄弟节点。\n\n* `Node getParentNode()`\n    获取节点的父节点。\n\
  \n* `NamedNodeMap getAttributes()`\n    返回包含所有属性的映射。\n\n* `String getNodeName()`\n\
  \    返回节点的名称。\n\n* `String getNodeValue()`\n    返回节点的值。\n\norg.w3c.dom.CharacterData`\
  \ 1.4\n\n* `String getData()`\n    返回存储在节点中的。\n\norg.w3c.dom.NodeList` 1.4\n\n*\
  \ `int getLength()`\n    返回列表中的节点数量。\n\n* `Node item(int index)`\n    返回指定索引的节点。\n\
  \norg.w3c.dom.NamedNodeMap` 1.4\n\n* `int getLength()`\n    返回映射中的节点数量。\n\n* `Node\
  \ item(int index)`\n    返回指定索引的节点。\n\n## 验证 XML 文档\n\n在上一节中，你看到了如何遍历 DOM 文档的树结构。然而，使用这种方法，你必须进行大量的编程和错误检查。不仅要处理元素之间的空白，你还需要检查文档是否包含你预期的节点。例如，假设你正在读取这个元素：\n\
  \n```\n<font>\n   <name>Helvetica</name>\n   <size>36</size>\n</font>\n```\n\n你获取第一个子节点。糟糕……它是一个包含空白\
  \ `\\n ` 的文本节点。你跳过文本节点找到第一个元素节点。然后，你需要检查它的标签名是否为 `\"name\"`，以及它是否有一个 `Text` 类型子节点。你继续处理下一个非空白节点并进行相同的检查。如果文档作者交换了元素的顺序或添加了另一个子元素怎么办？编写所有的错误检查是非常繁琐的——但跳过检查却是鲁莽的。\n\
  \n幸运的是，XML 解析器的主要优势之一是它可以自动验证文档的结构是否正确。这使得解析变得简单得多。例如，如果你知道 `font` 片段通过了验证，你只需获取两个孙子节点，将它们转换为\
  \ `Text` 节点并获取文本数据，而无需任何进一步检查。\n\n要指定文档结构，你可以提供 DTD 或 XML Schema 定义。DTD 或 schema\
  \ 包含了规则，通过指定每个元素的合法的子元素和属性来解释文档应如何形成。例如，一个 DTD 可能包含如下规则：\n\n```dtd\n<!ELEMENT font\
  \ (name,size)>\n```\n\n这条规则表达了 `font` 元素必须包含两个子元素，即 `name` 和 `size` 元素。XML Schema\
  \ 语言以相同的方式表达这一约束：\n\n\n\n```\n<xsd:element name=\"font\">\n   <xsd:sequence>\n \
  \     <xsd:element name=\"name\" type=\"xsd:string\"/>\n      <xsd:element name=\"\
  size\" type=\"xsd:int\"/>\n   </xsd:sequence>\n</xsd:element>\n```\n\nXML Schema\
  \ 比 DTD 能够表达更复杂的验证条件（例如，`size` 元素必须包含一个整数）。与 DTD 语法不同，XML Schema 语法本身使用 XML，如果你需要处理架构文件，这将是一个巨大的优势。\n\
  \n在接下来的节中，我们将详细讨论 DTD，然后简要介绍 XML Schema 支持的基础知识。最后，我们将展示一个完整的应用程序，演示验证如何简化 XML 编程。\n\
  \n### 文档类型定义\n\n提供 DTD 有多种方法。你可以像下面这样将 DTD 包含在 XML 文档中：\n\n```\n<?xml version=\"\
  1.0\"?>\n<!DOCTYPE config [\n   <!ELEMENT config . . .>\n   more rules\n   . . .\n\
  ]>\n<config>\n   . . .\n</config>\n```\n\n如你所见，规则包含在 `DOCTYPE` 声明内部，由 `[. . .]`\
  \ 分隔块内。文档类型必须与根元素的名称匹配，例如我们示例中的 `config`。\n\n在 XML 文档内部提供 DTD 并不常见，因为 DTD 可能会变得非常长。将\
  \ DTD 存储在外部更有意义。`SYSTEM` 声明可以用于此目的。指定一个包含 DTD 的 URL，例如：\n\n```\n<!DOCTYPE config\
  \ SYSTEM \"config.dtd\">\n```\n\n或者\n\n```\n<!DOCTYPE config SYSTEM \"http://myserver.com/config.dtd\"\
  >\n```\n\n如果你对 DTD 使用相对 URL（例如 `\"config.dtd\"`），请为解析器提供一个 `File` 或 `URL` 对象，而不是\
  \ `InputStream`。如果你必须从输入流进行解析，请提供一个实体解析器（entity resolver）（参见下文注释）。\n\n识别已知 DTD 的机制源于\
  \ SGML。以下是一个示例：\n\n```\n<!DOCTYPE web-app\n   PUBLIC \"-//Sun Microsystems, Inc.//DTD\
  \ Web Application 2.2//EN\"\n   \"http://java.sun.com/j2ee/dtds/web-app_2_2.dtd\"\
  >\n```\n\n如果 XML 解析器知道如何通过公共标识符定位 DTD，它就不需要访问 URL。\n\nDTD 的系统标识符 URL 可能实际上无法工作，或者被刻意减慢。后者的示例是\
  \ XHTML 1.0 Strict DTD 的系统标识符，`http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd`。如果你解析一个\
  \ XHTML 文件，DTD 可能需要一两分钟才能提供。\n\n解决方法是使用 `entity resolver`（实体解析器），将公共标识符映射到本地文件。你提供一个实现\
  \ `EntityResolver` 接口并提供 `resolveEntity` 方法的类对象。\n\nXML 目录（XML catalogs）是解析实体的一种便捷机制。提供一个或多个格式如下的目录文件：\n\
  \n```\n<?xml version=\"1.0\"?>\n<!DOCTYPE catalog PUBLIC \"-//OASIS//DTD XML Catalogs\
  \ V1.0//EN\"\n      \"http://www.oasis-open.org/committees/entity/release/1.0/catalog.dtd\"\
  >\n<catalog xmlns=\"urn:oasis:names:tc:entity:xmlns:xml:catalog\" prefer=\"public\"\
  >\n   <public publicId=\". . . .\" uri=\". . .\"/>\n   . . .\n</catalog>\n```\n\n\
  然后像这样构造并安装解析器：\n\n```\nbuilder.setEntityResolver(CatalogManager.catalogResolver(\n\
  \   CatalogFeatures.defaults(), \n   Path.of(\"catalog.xml\").toAbsolutePath().toUri()));\n\
  ```\n\n完整示例请参见 Listing 3.6。\n\n与其在程序中设置目录文件位置，不如你可以在命令行上使用 `javax.xml.catalog.files`\
  \ 属性来指定它们。提供用分号隔开的绝对 `file` 格式的 URL。\n\n现在你已经了解了解析器如何定位 DTD，让我们考虑各种类型的规则。\n\n`ELEMENT`\
  \ 规则规定了元素可以拥有子元素。使用由 #ch02table01 所示组件组成的正则表达式。\n\n### 元素内容规则\n\n| 规则 | 含义 |\n\n\
  | --- | --- |\n| `E` | 0 次或多次 `E` |\n| `E+` | 1 次或多次 `E` |\n| `E?` | 0 次或 1 次 `E`\
  \ |\n| `E[1]|E[2]|...|E[n]` | `E[1]`、`E[2]`、... `E[n]` 中的之一 |\n| `E[1], E[2], ...,\
  \ E[n]` | `E[1]` 后紧跟 `E[2]`、... `E[n]` |\n| `#PCDATA` | 文本 |\n| `(#PCDATA|E[1]|E[2]|...|E[n])`\
  \ | |\n| `ANY` | 任何子元素 |\n| `EMPTY` | 无子元素 |\n\n\n\n\n\n| --- | --- |\n| `#REQUIRED`\
  \ | 属性是的。 |\n| `#IMPLIED` | 属性可选的。 |\n| `A` | 属性可选的；如果未指定，解析器将其报告为 `A`。 |\n| `#FIXED`\
  \ `A` | 属性必须未指定或为 `A`；无论哪种，解析器将其报告为 `A`。 |\n\n以下是两个典型的属性规范：\n\n```xml\n<!ATTLIST\
  \ font style (plain|bold|italic|bold-italic) \"plain\">\n<!ATTLIST size unit CDATA\
  \ #IMPLIED>\n```\n\n第一个规范描述了 `font` 元素的 `style` 属性。它有四个合法的属性值，默认值为 `plain`。第二个规范表示\
  \ `size` 元素的 `unit` 属性可以包含任何字符数据序列。\n\n通常建议使用元素而不是属性来描述数据。因此，字体样式应该是一个独立的元素，例如 `<font><style>plain</style>.\
  \ . .</font>`。然而，对于枚举类型，属性具有不可否认的优势，因为解析器可以验证值是否合法。例如，如果字体样式是一个属性，解析器会检查它是否为四个允许的值之一，并在未给出值时提供默认值。\n\
  \n`CDATA` 属性值的处理与你之前见过的 `#PCDATA` 处理细略有不同，且与 `<![CDATA[. . .]]>` 部分完全无关。属性值首先会被*归一化*——也就是说，解析器会处理字符和实体引用（例如\
  \ `&#233;` 或 `&lt;`），并将空白替换为空格。\n\n`NMTOKEN`（或名称令牌）与 `CDATA` 类似，但不允许大多数非字母数字字符和内部空白，且解析器会移除首尾空白。`NMTOKENS`\
  \ 是一个由空格分隔的名称令牌列表。\n\n`ID` 结构非常有用。`ID` 是一个在文档中必须唯一的名称令牌——解析器会检查唯一性。你将在下一个示例程序中看到它的应用。`IDREF`\
  \ 是对同一文档中存在的 `ID` 的引用，解析器也会对其进行检查。`IDREFS` 是一个由空格分隔的 ID 引用列表。\n\n`ENTITY` 属性值引用一个“未解析的外部实体”。这是\
  \ SGML 的遗留，在实践中很少使用。在 [`https://www.xml.com/axml/axml.html`](https://www.xml.com/axml/axml.html)\
  \ 的带注释 XML 规范中有一个示例。\n\nDTD 还可以定义*实体*，即在解析期间被替换的缩写。你可以在 Firefox 浏览器的用户界面描述中找到使用实体的良好示例。这些描述是以\
  \ XML 格式格式化的，并包含如下实体定义：\n\n```xml\n<!ENTITY back.label \"Back\">\n```\n\n在其他地方，文本可以包含实体引用，例如：\n\
  \n```xml\n<menuitem label=\"&back.label;\"/>\n```\n\n解析器将实体引用替换为替换字符串。为了使应用程序国际化，只需要更改实体定义中的字符串即可。实体的其他用法更为复杂且不常见；详情请参阅\
  \ XML 规范。\n\n到这里 DTD 的介绍就此结束。现在你已经了解了如何使用 DTD，可以配置你的解析器来利用它们了。\n\n首先，告诉文档构建器工厂开启验证：\n\
  \n```java\nfactory.setValidating(true);\n```\n\n此工厂产生的所有构建器都会根据 DTD 验证其输入。验证的最有用益处是忽略元素内容中的空白。例如，考虑以下\
  \ XML 段：\n\n```xml\n<font>\n   <name>Helvetica</name>\n   <size>36</size>\n</font>\n\
  ```\n\n非验证性解析器会报告 `font`、`name` 和 `size` 元素之间的空白，因为它不知道 `font` 的子元素是：\n\n```\n(name,size)\n\
  (#PCDATA,name,size)*\n```\n\n还是\n\n```\nANY\n```\n\n一旦 DTD 规定了子元素为 `(name,size)`，解析器就知道它们之间的空白不是文本。调用：\n\
  \n```java\nfactory.setIgnoringElementContentWhitespace(true);\n```\n\n构建器将停止报告文本节点中的空白。这意味着你现在可以*依赖于*\
  \ `font` 节点有两个子节点的这一了。你不再需要编写一个繁琐的循环：\n\n```java\nfor (int i = 0; i < children.getLength();\
  \ i++)\n{\n   Node child = children.item(i);\n   if (child instanceof Element childElement)\n\
  \   {\n      if (childElement.getTagName().equals(\"name\")) . . .;\n      else\
  \ if (childElement.getTagName().equals(\"size\")) . . .;\n   }\n}\n```\n\n相反，你可以直接访问第一个和第二个子元素：\n\
  \n```java\nvar nameElement = (Element) children.item(0);\nvar sizeElement = (Element)\
  \ children.item(1);\n```\n\n这就是 DTD 如此实用的原因。你不需要在程序中加载大量的规则检查代码——在获取获取文档时，解析器已经完成了这些工作。\n\
  \n当解析器报告错误时，你的应用程序会想要对其进行处理——记录它、显示给用户，或抛出异常以放弃解析。因此，每当你使用验证时都应该安装一个错误处理器。提供一个实现\
  \ `ErrorHandler` 接口的对象。该接口有三个方法：\n\n```java\nvoid warning(SAXParseException e)\n\
  void error(SAXParseException e)\nvoid fatalError(SAXParseException e)\n```\n\n使用\
  \ `DocumentBuilder` 类的 `setErrorHandler` 方法安装错误处理器：\n\n```java\nbuilder.setErrorHandler(handler);\n\
  ```\n\n`javax.xml.parsers.DocumentBuilder` 1.4\n\n*   `void setEntityResolver(EntityResolver\
  \ resolver)`\n    设置解析器以定位 XML 文档中引用的实体。\n\n*   `void setErrorHandler(ErrorHandler\
  \ handler)`\n    设置报告解析过程中出现的错误和警告。\n\n`org.xml.sax.EntityResolver` 1.4\n\n*   `public\
  \ InputSource resolveEntity(String publicID, String systemID)`\n    返回包含所引用数据的输入源，或返回\
  \ `null` 表示此解析器不知道如何解析。`publicID` 参数在未提供公共 ID 时可能为 `null`。\n\n`org.xml.sax.InputSource`\
  \ 1.4\n\n*   `InputSource(InputStream in)`\n*   `InputSource(Reader in)`\n*   `InputSource(String\
  \ systemID)`\n    从流、读取器或系统 ID（通常是相对或绝对 URL）构造输入源。\n\n`org.xml.sax.ErrorHandler`\
  \ 1.4\n\n*   `void fatalError(SAXParseException e)`\n*   `void error(SAXParseException\
  \ e)`\n*   `void warning(SAXParseException e)`\n    重写这些方法以为致命错误、非致命错误和警告提供处理器。\n\
  \n`org.xml.sax.SAXParseException` 1.4\n\n*   `int getLineNumber()`\n*   `int getColumnNumber()`\n\
  \    返回导致异常的已处理输入的结束行号和列号。\n\n`javax.xml.catalog.CatalogManager` 9\n\n*   `static\
  \ CatalogResolver catalogResolver(CatalogFeatures features, URI... uris)`\n    产生一个使用提供的\
  \ URI 目录文件的解析器。此类实现了 `EntityResolver`，以及 StAX、架构验证和 XSL 转换使用的解析器类。\n\n`javax.xml.catalog.CatalogFeatures`\
  \ 9\n\n*   `static CatalogFeatures defaults()`\n    产生一个具有默认设置的实例。\n\n`javax.xml.parsers.DocumentBuilderFactory`\
  \ 1.4\n\n*   `boolean isValidating()`\n*   `void setValidating(boolean value)`\n\
  \    获取或设置工厂的 `validating` 属性。如果设置为 `true`，此工厂生成的解析器将验证其输入。\n\n*   `boolean isIgnoringElementContentWhitespace()`\n\
  *   `void setIgnoringElementContentWhitespace(boolean value)`\n    获取或设置工厂的 `ignoringElementContentWhitespace`\
  \ 属性。如果设置为 `true`，此工厂生成的解析器将忽略没有混合内容（即元素和 `#PCDATA` 的混合）的元素之间的空白。\n\n### XML Schema\n\
  \n\n\n\nXML Schema 比 DTD 语法复杂得多，因此我们只介绍基础知识。欲了解更多信息，我们建议参考 [`www.w3.org/TR/xmlschema-0`](https://www.w3.org/TR/xmlschema-0)\
  \ 上的教程。\n\n要在文档中引用 schema 文件，请为根元素添加属性，例如：\n\n```\n<?xml version=\"1.0\"?>\n<config\
  \ xmlns:xsi=\"http://www.w3.org/2001/XMLSchema-instance\"\n      xsi:noNamespaceSchemaLocation=\"\
  config.xsd\">\n   . . .\n</config>\n```\n\n此声明表示应使用 `config.xsd` schema 文件来验证该文档。如果你的文档使用了命名空间，语法会复杂一些——详情请参见\
  \ XML Schema 教程。（前缀 `xsi` 是一个 `命名空间别名`；更多信息请参见第 3.6 节。）\n\nschema 为每个元素和属性定义了 `type`（类型）。`simple\
  \ type`（简单类型）字符串，可能对其内容有限制。其他所有内容都是 `complex`（复杂）类型。具有简单类型的元素可以没有属性、也没有子元素。否则，它必须具有复杂类型。相反，属性始终具有简单类型。\n\
  \nXML Schema 内置了一些简单类型，包括：\n\n```\nxsd:string\nxsd:int\nxsd:boolean\n```\n\n我们使用前缀\
  \ `xsd:` 来表示 XML Schema 定义命名空间。有些作者使用前缀 `xs:` 代替它。\n\n你可以定义自己的简单类型。例如，这里有一个枚举类型：\n\
  \n```\n<xsd:simpleType name=\"StyleType\">\n   <xsd:restriction base=\"xsd:string\"\
  >\n      <xsd:enumeration value=\"PLAIN\" />\n      <xsd:enumeration value=\"BOLD\"\
  \ />\n      <xsd:enumeration value=\"ITALIC\" />\n      <xsd:enumeration value=\"\
  BOLD_ITALIC\" />\n   </xsd:restriction>\n</xsd:simpleType>\n```\n\n当定义一个元素时，你需要指定它的类型：\n\
  \n```\n<xsd:element name=\"name\" type=\"xsd:string\"/>\n<xsd:element name=\"size\"\
  \ type=\"xsd:int\"/>\n<xsd:element name=\"style\" type=\"StyleType\"/>\n```\n\n\
  类型限制了元素的内容。例如，以下元素：\n\n```\n<size>10</size>\n<style>PLAIN</style>\n```\n\n将通过验证，但以下元素：\n\
  \n```\n<size>default</size>\n<style>SLANTED</style>\n```\n\n将被解析器拒绝。\n\n你可以将类型组合成复杂类型，例如：\n\
  \n```\n<xsd:complexType name=\"FontType\">\n   <xsd:sequence>\n      <xsd:element\
  \ ref=\"name\"/>\n      <xsd:element ref=\"size\"/>\n      <xsd:element ref=\"style\"\
  />\n   </xsd:sequence>\n</xsd:complexType>\n```\n\n`FontType` 是 `name`、`size` 和\
  \ `style` 元素的序列。在这个类型定义中，我们使用 `ref` 属性并引用位于 schema 中其他位置定义。你也可以嵌套定义，如下：\n\n```\n\
  <xsd:complexType name=\"FontType\">\n   <xsd:sequence>\n      <xsd:element name=\"\
  name\" type=\"xsd:string\"/>\n      <xsd:element name=\"size\" type=\"xsd:int\"\
  />\n      <xsd:element name=\"style\">\n         <xsd:simpleType>\n            <xsd:restriction\
  \ base=\"xsd:string\">\n               <xsd:enumeration value=\"PLAIN\" />\n   \
  \            <xsd:enumeration value=\"BOLD\" />\n               <xsd:enumeration\
  \ value=\"ITALIC\" />\n               <xsd:enumeration value=\"BOLD_ITALIC\" />\n\
  \            </xsd:restriction>\n         </xsd:simpleType>\n      </xsd:element>\n\
  \   </xsd:sequence>\n</xsd:complexType>\n```\n\n注意 `style` 元素的 `匿名类型定义`。\n\n`xsd:sequence`\
  \ 结构等同于 DTD 中的连接表示法。`xsd:choice` 结构等同于 `|` 运算符。例如：\n\n```\n<xsd:complexType name=\"\
  contactinfo\">\n   <xsd:choice>\n      <xsd:element ref=\"email\"/>\n      <xsd:element\
  \ ref=\"phone\"/>\n   </xsd:choice>\n</xsd:complexType>\n```\n\n这等同于 DTD 类型 `email|phone`。\n\
  \n要允许元素重复，请使用 `minoccurs` 和 `maxoccurs` 属性。例如，DTD 类型 `item*` 的等价项是：\n\n```\n<xsd:element\
  \ name=\"item\" type=\". . .\" minoccurs=\"0\" maxoccurs=\"unbounded\">\n```\n\n\
  要指定属性，请在 `complexType` 定义中添加 `xsd:attribute` 元素：\n\n```\n<xsd:element name=\"size\"\
  >\n   <xsd:complexType>\n      . . .\n      <xsd:attribute name=\"unit\" type=\"\
  xsd:string\" use=\"optional\" default=\"cm\"/>\n   </xsd:complexType>\n</xsd:element>\n\
  ```\n\n这等同于 DTD 语句：\n\n```\n<!ATTLIST size unit CDATA #IMPLIED \"cm\">\n```\n\n\
  将你 schema 的元素和类型定义包含在 `xsd:schema` 元素内部：\n\n```\n<xsd:schema xmlns:xsd=\"http://www.w3.org/2001/XMLSchema\"\
  >\n   . . .\n</xsd:schema>\n```\n\n使用 schema 解析 XML 文件与解析 DTD 类似，但有以下不同点：\n\n1.\
  \ 即使你不使用命名空间，也需要开启命名空间支持：\n\n    ```java\n    factory.setNamespaceAware(true);\n\
  \    ```\n\n2. 你需要为 schema 准备 factory：\n\n    ```java\n    final String JAXP_SCHEMA\
  \ = \"http://java.sun.com/xml/jaxp/schema\";\n    final String W3C_XML_SCHEMA =\
  \ \"http://www.w3.org/2001/XMLSchema\";\n    factory.setAttribute(JAXP_SCHEMA, W3C_XML_SCHEMA);\n\
  \    ```\n\n\n\n\n```java\npackage read;\n\nimport java.io.*;\nimport java.lang.reflect.*;\n\
  import java.util.*;\n\nimport javax.xml.parsers.*;\n\nimport org.w3c.dom.*;\nimport\
  \ org.xml.sax.*;\n\n/**\n * This program shows how to use an XML file to describe\
  \ Java objects.\n * @version 1.0 2018-04-03\n * @author Cay Horstmann\n */\npublic\
  \ class XMLReadTest\n{\n   public static void main(String[] args) throws ParserConfigurationException,\
  \ \n         SAXException, IOException, ReflectiveOperationException\n   {\n   \
  \   String filename;\n      if (args.length == 0)\n      {\n         try (var in\
  \ = new Scanner(System.in))\n         {\n            System.out.print(\"Input file:\
  \ \");\n            filename = in.nextLine();\n         }\n      }\n      else\n\
  \         filename = args[0];\n\n      DocumentBuilderFactory factory = DocumentBuilderFactory.newInstance();\n\
  \      factory.setValidating(true);\n\n      if (filename.contains(\"-schema\"))\n\
  \      {\n         factory.setNamespaceAware(true);\n         final String JAXP_SCHEMA_LANGUAGE\
  \ = \n               \"http://java.sun.com/xml/jaxp/properties/schemaLanguage\"\
  ;\n         final String W3C_XML_SCHEMA = \"http://www.w3.org/2001/XMLSchema\";\n\
  \         factory.setAttribute(JAXP_SCHEMA_LANGUAGE, W3C_XML_SCHEMA);\n      }\n\
  \n      factory.setIgnoringElementContentWhitespace(true);\n\n      DocumentBuilder\
  \ builder = factory.newDocumentBuilder();\n\n      builder.setErrorHandler(new ErrorHandler()\
  \ \n         {\n            public void warning(SAXParseException e) throws SAXException\
  \ \n            {\n               System.err.println(\"Warning: \" + e.getMessage());\n\
  \            }\n\n            public void error(SAXParseException e) throws SAXException\
  \ \n            {\n               System.err.println(\"Error: \" + e.getMessage());\n\
  \               System.exit(0);\n            }\n\n            public void fatalError(SAXParseException\
  \ e) throws SAXException \n            {\n               System.err.println(\"Fatal\
  \ error: \" + e.getMessage());\n               System.exit(0);   \n            }\n\
  \         });      \n\n      Document doc = builder.parse(filename);\n      Map<String,\
  \ Object> config = parseConfig(doc.getDocumentElement());         \n      System.out.println(config);\n\
  \   }\n\n   private static Map<String, Object> parseConfig(Element e) \n       \
  \  throws ReflectiveOperationException\n   {\n      var result = new HashMap<String,\
  \ Object>();\n      NodeList children = e.getChildNodes();\n      for (int i = 0;\
  \ i < children.getLength(); i++)\n      {\n         var child = (Element) children.item(i);\
  \         \n         String name = child.getAttribute(\"id\");\n         Object\
  \ value = parseObject((Element) child.getFirstChild());\n         result.put(name,\
  \ value);\n      }\n      return result;\n   }\n\n   private static Object parseObject(Element\
  \ e) \n         throws ReflectiveOperationException\n   {\n      String tagName\
  \ = e.getTagName();\n      if (tagName.equals(\"factory\")) return parseFactory(e);\n\
  \      else if (tagName.equals(\"construct\")) return parseConstruct(e);\n     \
  \ else \n      {\n         String childData = ((CharacterData) e.getFirstChild()).getData();\n\
  \         if (tagName.equals(\"int\")) \n            return Integer.valueOf(childData);\n\
  \         else if (tagName.equals(\"boolean\")) \n            return Boolean.valueOf(childData);\n\
  \         else \n            return childData;\n      }\n   }\n\n   private static\
  \ Object parseFactory(Element e) \n         throws ReflectiveOperationException\n\
  \   {\n      String className = e.getAttribute(\"class\");\n      String methodName\
  \ = e.getAttribute(\"method\");\n      Object[] args = parseArgs(e.getChildNodes());\n\
  \      Class<?>[] parameterTypes = getParameterTypes(args);\n      Method method\
  \ = Class.forName(className).getMethod(methodName, parameterTypes);\n      return\
  \ method.invoke(null, args); \n   }\n\n   private static Object parseConstruct(Element\
  \ e) \n         throws ReflectiveOperationException\n   {\n      String className\
  \ = e.getAttribute(\"class\");\n      Object[] args = parseArgs(e.getChildNodes());\n\
  \      Class<?>[] parameterTypes = getParameterTypes(args);\n      Constructor<?>\
  \ constructor = Class.forName(className).getConstructor(parameterTypes);\n     \
  \ return constructor.newInstance(args); \n   }\n\n   private static Object[] parseArgs(NodeList\
  \ elements) \n         throws ReflectiveOperationException\n   {\n      var result\
  \ = new Object[elements.getLength()];\n      for (int i = 0; i < result.length;\
  \ i++)\n         result[i] = parseObject((Element) elements.item(i));\n      return\
  \ result;\n   }\n\n   private static Map<Class<?>, Class<?>> toPrimitive = Map.of(\n\
  \         Integer.class, int.class,\n         Boolean.class, boolean.class);\n\n\
  \   private static Class<?>[] getParameterTypes(Object[] args)\n   {\n      var\
  \ result = new Class<?>[args.length];\n      for (int i = 0; i < result.length;\
  \ i++)\n      {\n         Class<?> cl = args[i].getClass();\n         result[i]\
  \ = toPrimitive.get(cl);\n         if (result[i] == null) result[i] = null;\n  \
  \    }\n   }\n}\n```\n\n\n\n\n\n### 5. 获取其数据。\n\nXPath 可以描述 XML 文档中的一组节点。例如，XPath\n\
  \n```\n/html/body/form\n```\n\n描述了 XHTML 文件中作为 `body` 元素子节点的所有 `form` 元素集合。你可以使用\
  \ `[]` 运算符选择特定的元素：\n\n```\n/html/body/form[1]\n```\n\n是第一个表单。（索引值从 1 开始。）\n\n使用\
  \ `@` 运算符获取属性值。XPath 表达式\n\n```\n/html/body/form[1]/@action\n```\n\n描述第一个表单的 `action`\
  \ 属性。XPath 表达式\n\n```\n/html/body/form/@action\n```\n\n描述所有作为 `body` 元素子节点的所有 `form`\
  \ 元素的 `action` 属性节点。\n\n这里有很多实用的 XPath 函数。例如，\n\n```\ncount(/html/body/form)\n```\n\
  \n返回 `body` 元素的 `form` 子节点的数量。还有更多复杂的 XPath 表达式；请参阅 [`www.w3c.org/TR/xpath`](https://www.w3c.org/TR/xpath)\
  \ 处的规范或 [`www.zvon.org/xxl/XPathTutorial/General/examples.html`](https://www.zvon.org/xxl/XPathTutorial/General/examples.html)\
  \ 处的在线教程。\n\n要评估 XPath 表达式，首先从 `XPathFactory` 创建一个 `XPath` 对象：\n\n```\nXPathFactory\
  \ xpfactory = XPathFactory.newInstance();\npath = xpfactory.newXPath();\n```\n\n\
  然后，调用 `evaluate` 方法来评估 XPath 表达式：\n\n```\nString username = path.evaluate(\"/html/head/title/text()\"\
  , doc);\n```\n\n你可以使用同一个 `XPath` 对象来评估多个表达式。\n\n这种形式的 `evaluate` 方法返回字符串结果。它适用于检索文本，例如前面示例中\
  \ `title` 元素的文本子节点。如果 XPath 表达式产生多个节点，请进行如下调用：\n\n```\nXPathNodes result = path.evaluateExpression(\"\
  /html/body/form\", doc, XPathNodes.class);\n```\n\n`XPathNodes` 类类似于 `NodeList`，但它实现了\
  \ `Iterable` 接口，允许你使用增强的 `for` 循环。\n\n如果结果是单个节点，使用以下调用之一：\n\n```\nNode node = path.evaluateExpression(\"\
  /html/body/form[1]\", doc, Node.class);\nnode = (Node) path.evaluate(\"/html/body/form[1]\"\
  , doc, XPathConstants.NODE);\n```\n\n如果结果是数字，使用：\n\n```\nint count = path.evaluateExpression(\"\
  count(/html/body/form)\", doc, Integer.class);\ncount = ((Number) path.evaluate(\"\
  count(/html/body/form)\", \n      doc, XPathConstants.NUMBER)).intValue();\n```\n\
  \n你不需要从文档根节点开始搜索；你可以从任何节点或节点列表开始。例如，如果你有一个从上一次评估得到的节点，可以调用\n\n\n\n```\nString result\
  \ = path.evaluate(expression, node);\n```\n\n如果你不知道评估 XPath 表达式的结果（可能是因为结果来自用户），则调用：\n\
  \n```\nXPathEvaluationResult<?> result = path.evaluateExpression(expression, doc);\n\
  ```\n\n表达式 `result.type()` 是 `XPathEvaluationResult.XPathResultType` 枚举中的常量之一：\n\
  \n```\nSTRING\nNODESET\nNODE\nNUMBER\nBOOLEAN\n```\n\n调用 `result.value()` 获取值。\n\
  \nListing 3.6 中的程序演示了任意 XPath 表达式的评估。加载一个 XML 文件并输入一个表达式。表达式的结果将被显示。\n\nxpath/XPathTest.java\n\
  \n```java\npackage xpath;\n\nimport java.nio.file.*;\nimport java.util.*;\n\nimport\
  \ javax.xml.catalog.*;\nimport javax.xml.parsers.*;\nimport javax.xml.xpath.*;\n\
  \nimport org.w3c.dom.*;\n\n/**\n * 此程序评估 XPath 表达式。\n * @version 1.1 2018-04-06\n\
  \ * @author Cay Horstmann\n */\npublic class XPathTest\n{\n   public static void\
  \ main(String[] args) throws Exception\n   {            \n      DocumentBuilderFactory\
  \ factory = DocumentBuilderFactory.newInstance();\n      DocumentBuilder builder\
  \ = factory.newDocumentBuilder();\n\n      // 避免解析 XHTML 文件时的延迟——参见 \n      // 3.4.1\
  \ 节中的第一个注释\n      builder.setEntityResolver(CatalogManager.catalogResolver(\n  \
  \          CatalogFeatures.defaults(), \n            Path.of(\"xpath/catalog.xml\"\
  ).toAbsolutePath().toUri()));      \n\n      XPathFactory xpfactory = XPathFactory.newInstance();\n\
  \      XPath path = xpfactory.newXPath();\n      try (var in = new Scanner(System.in))\n\
  \      {\n         String filename;\n         if (args.length == 0)\n         {\n\
  \            System.out.print(\"Input file: \");\n            filename = in.nextLine();\n\
  \         }\n         else\n            filename = args[0];\n\n         Document\
  \ doc = builder.parse(filename);\n         boolean done = false;\n         while\
  \ (!done)\n         {\n            System.out.print(\"XPath expression (empty line\
  \ to exit): \" );\n            String expression = in.nextLine();\n            if\
  \ (expression.strip().isEmpty()) done = true;\n            else\n            {\n\
  \               try\n               {\n                  XPathEvaluationResult<?>\
  \ result \n                        = path.evaluateExpression(expression, doc);\n\
  \                  if (result.type() == XPathEvaluationResult.XPathResultType.NODESET)\n\
  \                  {\n                     for (Node n : (XPathNodes) result.value())\n\
  \                        System.out.println(description(n));\n                 \
  \ }\n                  else if (result.type() == XPathEvaluationResult.XPathResultType.NODE)\n\
  \                     System.out.println((Node) result.value());\n             \
  \     else\n                     System.out.println(result.value());\n         \
  \      } \n               catch (XPathExpressionException e)\n               {\n\
  \                  System.out.println(e.getMessage());\n               }       \
  \        \n            }   \n         }\n      }\n   }\n\n   public static String\
  \ description(Node n)\n   {\n      if (n instanceof Element) return \"Element \"\
  \ + n.getNodeName();\n      else if (n instanceof Attr) return \"Attribute \" +\
  \ n;\n      else return n.toString();\n   }\n}\n```\n\n`javax.xml.xpath.XPathFactory`\
  \ 5.0\n\n* `static XPathFactory newInstance()`\n    返回一个用于创建 `XPath` 对象的 `XPathFactory`\
  \ 实例。\n* `XPath newXpath()`\n    构建用于评估 XPath 表达式的 `XPath` 对象。\n\n`javax.xml.xpath.XPath`\
  \ 5.0\n\n* `String evaluate(String expression, Object startingPoint)`\n    从给定的起始点开始评估表达式。起始点可以是节点或节点列表。如果结果是节点或节点集，返回的字符串由所有文本子节点的数据组成。\n\
  * `Object evaluate(String expression, Object startingPoint, QName resultType)`\n\
  \    从给定的起始点开始评估表达式。起始点可以是节点或节点列表。`resultType` 是 `XPathConstants` 类中的常量 `STRING`、`NODE`、`NODESET`、`NUMBER`\
  \ 或 `BOOLEAN` 之一。返回 `String`、`Node`、`NodeList`、`Number` 或 `Boolean`。\n* `<T> T evaluateExpression(String\
  \ expression, Object item, Class<T> type)` 9\n    评估给定的表达式并将结果作为给定类型的值。\n* `XPathEvaluationResult<?>\
  \ evaluateExpression(String expression, InputSource source)` 9\n    评估给定的表达式。\n\n\
  `javax.xml.xpath.XPathEvaluationResult<T>` 9\n\n* `XPathEvaluationResult.XPathResultType\
  \ type()`\n    返回枚举常量之一 `STRING`、`NODESET`、`NODE`、`NUMBER`、`BOOLEAN`。\n* `T value()`\n\
  \    返回结果值。\n\n### 使用命名空间\n\nJava 语言使用包来避免命名冲突。只要不在同一个包中，程序员可以在不同的类可以使用相同的名称。XML\
  \ 有类似的命名空间机制，用于元素和属性名。\n\n命名空间通过统一资源标识符（URI）来标识。这里是三个示例：\n\n```\nhttp://www.w3.org/2001/XMLSchema\n\
  uuid:1c759aed-b748-475c-ab68-10679700c4f2\nurn:com:books-r-us\n```\n\nHTTP URL 形式最为常见。注意\
  \ URL 仅用作标识字符串，而不是文档的定位符。例如，命名空间标识符\n\n\n\n\n\n```\nhttp://www.horstmann.com/corejava\n\
  http://www.horstmann.com/corejava/index.html\n```\n\n表示 `different` 命名空间（namespaces），尽管\
  \ Web 服务器会为这两个 URL 提供相同的文档。\n\n命名空间 URL 并不一定需要任何文档——XML 解析器不会尝试在相应位置查找任何内容。然而，为了帮助那些遇到可能不熟悉的命名空间的程序员，按照惯例，通常会在该\
  \ URL 处放置一个说明该命名空间目的的文档。例如，如果你将浏览器对到 XML Schema 命名空间的命名空间 URL（`http://www.w3.org/2001/XMLSchema`），你将找到一个描述\
  \ XML Schema 标准的文档。\n\n### 为什么使用 HTTP URL 作为命名空间标识符？\n\n这很容易确保它们的唯一性。如果你选择一个真实的\
  \ URL，那么主机部分的唯一性由域名系统（DNS）提供保证。然后，你的组织可以安排确保该 URL 剩余部分的唯一性。这与 Java 包名中使用反向域名的原理是相同的。\n\
  \n当然，虽然长的命名空间标识符有利于确保唯一性，但你并不希望尽可能地处理长的标识符。在 Java 编程语言中，你使用 `import` 机制来指定包的长名称，然后只使用短类名。在\
  \ XML 中，有一个类似的机制：\n\n```xml\n<element xmlns=\"namespaceURI\">\n   children\n</element>\n\
  ```\n\n该元素及其子元素现在属于给定的命名空间。\n\n子元素可以提供自己的命名空间，例如：\n\n```xml\n<element xmlns=\"namespaceURI1\"\
  >\n   <child xmlns=\"namespaceURI2\">\n      grandchildren\n   </child>\n   more\
  \ children\n</element>\n```\n\n那么第一个子元素和孙子元素属于第二个命名空间。\n\n如果你只需要单个命名空间或者命名空间是自然嵌套的，这种简单的机制运行良好。否则，你可能希望使用在\
  \ Java 中没有对应的第二机制。你可以为命名空间设置 `prefix`（前缀）——你为特定文档选择的短标识符。这是一个典型的例子——XML Schema 文件中的\
  \ `xsd` 前缀：\n\n```xml\n<xsd:schema xmlns:xsd=\"http://www.w3.org/2001/XMLSchema\"\
  >\n   <xsd:element name=\"config\"/>\n   . . .\n</xsd:schema>\n```\n\n属性\n\n```xml\n\
  xmlns:prefix=\"namespaceURI\"\n```\n\n定义了一个命名空间和一个前缀。在我们的示例中，前缀是字符串 `xsd`。因此，`xsd:schema`\
  \ 实际上是指 `http://www.w3.org/2001/XMLSchema` 命名空间下的 `schema`。\n\n只有子元素继承父元素的命名空间。没有显式前缀的属性永远不会命名空间的一部分。考虑这个人为的示例：\n\
  \n```xml\n<configuration xmlns=\"http://www.horstmann.com/corejava\"\n   xmlns:si=\"\
  http://www.bipm.fr/enus/3_SI/si.html\">\n   <size value=\"210\" si:unit=\"mm\"/>\n\
  \   . . .\n</configuration>\n```\n\n在这个示例中，元素 `configuration` 和 `size` 属于 URI 为\
  \ `http://www.horstmann.com/corejava` 的命名空间。属性 `si:unit` 属于 URI 为 `http://www.bipm.fr/enus/3_SI/si.html`\
  \ 的命名空间。然而，属性 `value` 不属于任何命名空间。\n\n你可以控制解析器如何处理命名空间。默认情况下，Java XML API 的 DOM 解析器不是命名空间感知的（namespace-aware）。\n\
  \n要开启命名空间处理，调用 `DocumentBuilderFactory` 的 `setNamespaceAware` 方法：\n\n```java\nDocumentBuilderFactory\
  \ factory = DocumentBuilderFactory.newInstance(); \nfactory.setNamespaceAware(true);\n\
  ```\n\n现在，工厂产生的所有 builder 都支持命名空间。\n\n或者，自 Java 13 起，调用\n\n```java\nDocumentBuilderFactory\
  \ factory = DocumentBuilderFactory.newNSInstance(); \n```\n\n由 builder 创建的每个节点都有三个属性：\n\
  \n*   `qualified name`（限定限定），带前缀由 `getNodeName`、`getTagName` 等返回\n*   namespace\
  \ URI（命名空间 URI），由 `getNamespaceURI` 方法返回\n*   `local name`（本地名），不带前缀或命名空间，由 `getLocalName`\
  \ 方法返回\n\n这里有一个例子。假设解析器看到以下元素：\n\n```xml\n<xsd:schema xmlns:xsd=\"http://www.w3.org/2001/XMLSchema\"\
  >\n```\n\n它随后报告以下内容：\n\n*   Qualified name = `xsd:schema`\n*   Namespace URI = `http://www.w3.org/2001/XMLSchema`\n\
  *   Local name = `schema`\n\n如果关闭命名空间感知，`getNamespaceURI` 和 `getLocalName` 将返回 `null`。\n\
  \n`org.w3c.dom.Node` 1.4\n\n*   `String getLocalName()`\n    返回本地名（不带前缀），如果解析器不是命名空间感知的则返回\
  \ `null`。\n*   `String getNamespaceURI()`\n    返回命名空间 URI，如果节点不是命名空间的一部分或解析器不是命名空间感知的，则返回\
  \ `null`。\n\n`javax.xml.parsers.DocumentBuilderFactory` 1.4\n\n*   `static DocumentBuilderFactory\
  \ newNSInstance()` 13\n    产生一个其 builder 是命名空间感知的工厂。\n*   `boolean isNamespaceAware()`\n\
  *   `void setNamespaceAware(boolean value)`\n    获取或设置工厂的 `namespaceAware` 属性。如果设置为\
  \ `true`，生成的解析器是命名空间感知的。\n\n## 流式解析器 (Streaming Parsers)\n\nDOM 解析器将整个 XML 文档读入树中。对于大多数实际应用，DOM\
  \ 工作良好。然而，如果文档很大且你的处理算法足够简单，它可能是低效的。在这种情况下，你应该使用流式解析器。在后续章节中，我们将讨论两种解析器。SAX 解析器使用回调，而\
  \ StAX 解析器提供迭代器。\n\n### 使用 SAX 解析器\n\nSAX 解析器在解析输入时报告事件，但它不会以任何方式存储文档——构建数据结构取决于事件处理器。当你使用\
  \ SAX 解析器时，你需要一个定义各种解析事件的处理器。`ContentHandler` 接口定义了解析器在解析文档时执行的调方法。以下是最重要的：\n\n\
  *   `startElement` 和 `endElement` 在每次遇到开始标签或结束标签时被调用。\n*   `characters` 在遇到字符数据时被调用。\n\
  *   `startDocument` 和 `endDocument` 分别在文档开始和结束时调用一次。\n\n例如，当解析以下片段时：\n\n```xml\n\
  <font>\n   <name>Helvetica</name>\n   <size units=\"pt\">36</size>\n</font>\n```\n\
  \n解析器会产生以下回调：\n\n1.  `startElement`, element name: `font`\n2.  `startElement`, element\
  \ name: `name`\n3.  `characters`, content: `Helvetica`\n4.  `endElement`, element\
  \ name: `name`\n5.  `startElement`, element name: `size`, attributes: `units=\"\
  pt\"`\n6.  `characters`, content: `36`\n7.  `endElement`, element name: `size`\n\
  8.  `endElement`, element name: `font`\n\n你的处理器需要重写这些方法，并在解析文件时执行你想要的操作。本节末出的程序重写了处理器的\
  \ `startElement` 方法，以检查 HTML 文件中格式为 `<a href=\". .\">` 的链接。这对于实现“网络爬虫”（一种通过跟踪链接访问更多网页的程序）具有潜在用途。\n\
  \nHTML 并不是有效的 XML，且大多数网页偏离正规 XML 远，以至于示例程序无法解析它们。然而，我的网站 `https://horstmann.com`\
  \ 上的页面使用的是 XHTML（一种符合 XML 的 HTML 变体）。你可以使用这些页面来测试示例程序。例如，如果你运行\n\n```\njava sax.SAXTest\
  \ https://horstmann.com/corejava/index.html\n```\n\n你将看到该页面上所有链接的 URL 列表。\n\n\n\n\
  \n示例程序是使用 SAX 的良好示例。我们完全不在乎 `a` 元素出现在什么上下文中，也没有需要存储树形结构。\n\n以下是获取 SAX 解析器的方法：\n\n\
  ```\nSAXParserFactory factory = SAXParserFactory.newInstance();\nSAXParser parser\
  \ = factory.newSAXParser();\n```\n\n你现在可以处理文档了：\n\n```\nparser.parse(source, handler);\n\
  ```\n\n在这里，`source` 可以是一个文件、URL 字符串或输入流。`handler` 属于 `DefaultHandler` 的子类。`DefaultHandler`\
  \ 类为四个接口定义了空操作方法：\n\n```\nContentHandler\nDTDHandler\nEntityResolver\nErrorHandler\n\
  ```\n\n示例程序定义了一个处理器，该处理器重写了 `ContentHandler` 接口的 `startElement` 方法，以监控带有 `href`\
  \ 属性的 `a` 元素：\n\n```\nvar handler = new DefaultHandler()\n   {\n      public void\
  \ startElement(String namespaceURI, String lname, String qname, \n            Attributes\
  \ attrs) throws SAXException\n      {\n         if (lname.equalsIgnoreCase(\"a\"\
  ) && attrs != null)\n         {\n            String href = attrs.getValue(\"href\"\
  );\n            if (href != null) System.out.println(href);\n         }\n      }\n\
  \   };\n```\n\n`startElement` 方法有三个描述元素名称参数。`qname` 参数报告格式为 `prefix:localname` 的限定名。如果开启了命名空间处理，则\
  \ `namespaceURI` 和 `lname` 参数将提供命名空间和本地（未限定）名称。\n\n与 DOM 解析器一样，命名空间处理默认关闭的。要激活命名空间处理，调用工厂类的\
  \ `setNamespaceAware` 方法。或者，从 Java 13 开始，使用 `newNSInstance` 创建一个感知命名空间的工厂：\n\n```\n\
  SAXParserFactory factory = SAXParserFactory.newNSInstance();\nSAXParser saxParser\
  \ = factory.newSAXParser();\n```\n\n在这个程序中，我们处理了另一个常见问题。XHTML 文件以一个包含 DTD 引用的标签开头，解析器将想要加载它。可以理解，W3C\
  \ 并不乐意提供数以亿计的如 `www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd` 这样的文件副本。曾几何时他们完全拒绝了，但在本文写作时，他们正以极其缓慢的速度提供该\
  \ DTD。如果你不需要验证文档，只需调用\n\n```\nfactory.setFeature(\"http://apache.org/xml/features/nonvalidating/load-external-dtd\"\
  , false);\n```\n\nListing 3.7 包含了网络爬虫程序的代码。在本章稍后的部分，你将看到 SAX 的另一个有趣用法。将非 XML 数据源转换为\
  \ XML 的简单方法是报告 XML 解析器会报告的 SAX 事件。详情请参阅 第 3.9 节。\n\nsax/SAXTest.java\n\n```\npackage\
  \ sax;\n\nimport java.io.*;\nimport java.net.*;\nimport javax.xml.parsers.*;\nimport\
  \ org.xml.sax.*;\nimport org.xml.sax.helpers.*;\n\n/**\n * 此程序演示了如何使用 SAX 解析器。程序打印\
  \ XHTML 网页的 \n * 所有超链接。<br>\n * 使用方法: java sax.SAXTest URL\n * @version 1.02 2023-10-24\n\
  \ * @author Cay Horstmann\n */\npublic class SAXTest\n{\n   public static void main(String[]\
  \ args) throws Exception\n   {\n      String url;\n      if (args.length == 0)\n\
  \      {\n         url = \"https://www.w3.org/2010/04/xhtml10-strict.html\";\n \
  \        System.out.println(\"Using \" + url);\n      }\n      else url = args[0];\n\
  \n      var handler = new DefaultHandler()\n         {\n            public void\
  \ startElement(String namespaceURI, String lname, \n                  String qname,\
  \ Attributes attrs)\n            {\n               if (lname.equals(\"a\") && attrs\
  \ != null)\n               {\n                  String href = attrs.getValue(\"\
  href\");\n                  if (href != null) System.out.println(href);\n      \
  \         }\n            }\n         };\n\n      SAXParserFactory factory = SAXParserFactory.newInstance();\n\
  \      factory.setNamespaceAware(true);\n      factory.setFeature(\n         \"\
  http://apache.org/xml/features/nonvalidating/load-external-dtd\", \n         false);\n\
  \      SAXParser saxParser = factory.newSAXParser();\n      InputStream in = new\
  \ URI(url).toURL().openStream();\n      saxParser.parse(in, handler);\n   }\n}\n\
  ```\n\n`javax.xml.parsers.SAXParserFactory` 1.4\n\n- `static SAXParserFactory newInstance()`\n\
  - `static SAXParserFactory newNSInstance()`13\n    返回一个 `SAXParserFactory` 类的实例。第二个方法产生一个感知命名空间的实例。\n\
  - `SAXParser newSAXParser()`\n    返回一个 `SAXParser` 类的实例。\n- `boolean isNamespaceAware()`\n\
  - `void setNamespaceAware(boolean value)`\n    获取或设置工厂的 `namespaceAware` 属性。\n-\
  \ `boolean isValidating()`\n- `void setValidating(boolean value)`\n    获取或设置 `validating`\
  \ 属性。\n\n`javax.xml.parsers.SAXParser` 1.4\n\n- `void startDocument()`\n- `void\
  \ endDocument()`\n- `void startElement(String namespaceURI, String lname, String\
  \ qname, Attributes attrs)`\n- `void endElement(String namespaceURI, String lname,\
  \ String qname)`\n- `void characters(char[] data, int start, int length)`\n\n`org.xml.sax.ContentHandler`\
  \ 1.4\n\n- `void startDocument()`\n- `void endDocument()`\n- `void startElement(String\
  \ namespaceURI, String lname, String qname, Attributes attrs)`\n- `void endElement(String\
  \ namespaceURI, String lname, String qname)`\n- `void characters(char[] data, int\
  \ start, int length)`\n\n`org.xml.sax.DTDHandler` 1.4\n\n- `void startDocument()`\n\
  - `void endDocument()`\n- `void startDTD(String name, String publicId, String systemId)`\n\
  - `void endDTD()`\n\n`org.xml.sax.EntityResolver` 1.4\n\n- `Input resolveEntity(String\
  \ publicId, String systemId)`\n\n`org.xml.sax.ErrorHandler` 1.4\n\n- `void error(SAXParseException\
  \ e) throws SAXException`\n- `void fatalError(SAXParseException e) throws SAXException`\n\
  - `void warning(SAXParseException e) throws SAXException`\n\n`org.xml.sax.Attributes`\
  \ 1.4\n\n- `int getLength()`\n    返回集合中属性的数量。\n- `String getLocalName(int index)`\n\
  \    返回索引属性的本地名称（不限定）。如果节点不是命名空间的一部分，返回空字符串。\n- `String getURI(int index)`\n   \
  \ 返回索引属性的命名空间 URI。如果节点不是命名空间的一部分，返回空字符串。\n- `String getQName(int index)`\n    返回索引属性的限定名（带前缀）。如果节点不是命名空间的一部分，返回空字符串。\n\
  - `String getValue(int index)`\n    根据指定的索引获取属性值。\n- `String getValue(String qname)`\n\
  \    根据限定名获取属性值。\n- `String getValue(String uri, String lname)`\n    根据命名空间 URI\
  \ 和本地名称获取属性值。\n\n### 使用 StAX 解析器\n\nStAX 解析器是一个“拉取解析器”。你不需要安装事件处理器，只需通过此基础循环遍历事件：\n\
  \n```\nInputStream in = url.openStream();\nXMLInputFactory factory = XMLInputFactory.newInstance();\n\
  XMLStreamReader parser = factory.createXMLStreamReader(in);\nwhile (parser.hasNext())\n\
  {\n   int event = parser.next();\n   调用解析器方法获取事件详情\n}\n```\n\n例如，当解析片段时\n\n```xml\n\
  <font>\n   <name>Helvetica</name>\n   <size units=\"pt\">36</size>\n</font>\n```\n\
  \n解析器产生以下事件：\n\n1.  `START_ELEMENT`，元素名称：`font`\n2.  `CHARACTERS`，内容：空格\n3.  `START_ELEMENT`，元素名称：`name`\n\
  4.  `CHARACTERS`，内容：`Helvetica`\n5.  `END_ELEMENT`，元素名称：`name`\n6.  `CHARACTERS`，内容：空格\n\
  7.  `START_ELEMENT`，元素名称：`size`\n8.  `CHARACTERS`，内容：`36`\n9.  `END_ELEMENT`，元素名称：`size`\n\
  10. `CHARACTERS`，内容：空格\n11. `END_ELEMENT`，元素名称：`font`\n\n要分析属性值，请调用 `XMLStreamReader`\
  \ 类的相应方法。例如，\n\n\n\n\n\n```java\nString units = parser.getAttributeValue(null, \"\
  units\");\n```\n\n获取当前元素的 `units` 属性。\n\n默认情况下，启用了命名空间处理。你可以修改工厂来禁用它：\n\n```java\n\
  XMLInputFactory factory = XMLInputFactory.newInstance();\nfactory.setProperty(XMLInputFactory.IS_NAMESPACE_AWARE,\
  \ false);\n```\n\nListing 3.8 包含了使用 StAX 解析器实现的网络爬虫程序代码。如你所见，代码比相应的 SAX 代码更简单，因为你不需要担心事件处理。\n\
  \n`stax/StAXTest.java`\n\n```java\npackage stax;\n\nimport java.io.*;\nimport java.net.*;\n\
  import javax.xml.stream.*;\n\n/**\n * 此程序演示了如何使用 StAX 解析器。该程序打印 XHTML 页面\n * 所有的超链接。\
  \ <br>\n * 使用方法：java stax.StAXTest URL\n * @author Cay Horstmann\n * @version 1.11\
  \ 2023-10-24\n */\npublic class StAXTest\n{\n   public static void main(String[]\
  \ args) throws Exception\n   {\n      String urlString;\n      if (args.length ==\
  \ 0)\n      {\n         urlString = \"http://www.w3c.org\";\n         System.out.println(\"\
  Using \" + urlString);\n      }\n      else urlString = args[0];\n      InputStream\
  \ in = new URI(urlString).toURL().openStream();\n      XMLInputFactory factory =\
  \ XMLInputFactory.newInstance();\n      XMLStreamReader parser = factory.createXMLStreamReader(in);\n\
  \      while (parser.hasNext())\n      {\n         int event = parser.next();\n\
  \         if (event == XMLStreamConstants.START_ELEMENT)\n         {\n         \
  \   if (parser.getLocalName().equals(\"a\")) \n            {\n               String\
  \ href = parser.getAttributeValue(null, \"href\");\n               if (href != null)\n\
  \                  System.out.println(href);               \n            }\n   \
  \      }\n      }\n   }\n}\n```\n\n### `javax.xml.stream.XMLInputFactory` 6\n\n\
  *   `static XMLInputFactory newInstance()`\n    返回 `XMLInputFactory` 类的一个实例。\n\n\
  *   `void setProperty(String name, Object value)`\n    为此工厂设置一个属性，如果该属性不支持或无法设置为给定值，则抛出\
  \ `IllegalArgumentException`。JDK 实现支持以下布尔值属性：\n\n    | 属性 | 描述 |\n    | :--- | :---\
  \ |\n    | `\"javax.xml.stream.isValidating\"` | 当为 `false`（默认）时，不验证文档。规范未要求。 |\n\
  \    | `\"javax.xml.stream.isNamespaceAware\"` | 当为 `true`（默认）时，处理命名空间。规范未要求。 |\n\
  \    | `\"javax.xml.stream.isCoalescing\"` | 当为 `false`（默认）时，不合并相邻字符数据。 |\n    |\
  \ `\"javax.xml.stream.isReplacingEntityReferences\"` | 当为 `true`（默认）时，实体引用被替换并作为字符数据报告。\
  \ |\n    | `\"javax.xml.stream.isSupportingExternalEntities\"` | 当为 `true`（默认）时，解析外部实体。规范未为此属性提供默认值。\
  \ | |    | `\"javax.xml.stream.supportDTD\"` | 当为 `true`（默认）时，DTD 作为事件报告。 |\n\n\
  *   `XMLStreamReader createXMLStreamReader(InputStream in)`\n*   `XMLStreamReader\
  \ createXMLStreamReader(InputStream in, String characterEncoding)`\n*   `XMLStreamReader\
  \ createXMLStreamReader(Reader in)`\n*   `XMLStreamReader createXMLStreamReader(Source\
  \ in)`\n    创建一个从给定的流、读取器或 JAXP 源读取的解析器。\n\n### `javax.xml.stream.XMLStreamReader`\
  \ 6\n\n*   `boolean hasNext()`\n    如果有另一个解析事件，则返回 `true`。\n\n*   `int next()`\n\
  \    将解析器状态设置为下一个解析事件并返回以下常量之一：`START_ELEMENT`、`END_ELEMENT`、`CHARACTERS`、`START_DOCUMENT`、`END_DOCUMENT`、`CDATA`、`COMMENT`、`SPACE`（忽略空白）、`PROCESSING_INSTRUCTION`、`ENTITY_REFERENCE`、`DTD`。\n\
  \n*   `boolean isStartElement()`\n*   `boolean isEndElement()`\n*   `boolean isCharacters()`\n\
  *   `boolean isWhiteSpace()`\n    如果当前事件是起始元素、结束元素、字符数据或空白，则返回 `true`。\n\n*   `QName\
  \ getName()`\n*   `String getLocalName()`\n    在 `START_ELEMENT` 或 `END_ELEMENT`\
  \ 事件中获取元素的名称。\n\n*   `String getText()`\n    返回 `CHARACTERS`、`COMMENT` 或 `CDATA`\
  \ 事件的字符、`ENTITY_REFERENCE` 的替换值，或 `DTD` 的内部子集。\n\n*   `int getAttributeCount()`\n\
  *   `QName getAttributeName(int index)`\n*   `String getAttributeLocalName(int index)`\n\
  *   `String getAttributeValue(int index)`\n    获取属性计数以及属性的名字和值，前提是当前事件是 `START_ELEMENT`。\n\
  \n*   `String getAttributeValue(String namespaceURI, String name)`\n    获取给定名称属性的值，前提是当前事件是\
  \ `START_ELEMENT`。如果 `namespaceURI` 为 `null`，则忽略命名空间。\n\n## 生成 XML\n\n你现在已经了如何写入\
  \ XML。以下章节将讨论输出。\n\n### 不带命名空间的文档\n\n构建 DOM 树需要从一个空文档开始。通过调用 `DocumentBuilder` 的\
  \ `newDocument` 方法可以获取空文档：\n\n```java\nDocument doc = builder.newDocument();\n```\n\
  \n使用 `Document` 类的 `createElement` 方法构造元素：\n\n```java\nElement rootElement = doc.createElement(rootName);\n\
  Element childElement = doc.createElement(childName);\n```\n\n使用 `createTextNode`\
  \ 方法构造文本节点：\n\n```java\nText textNode = doc.createTextNode(textContents);\n```\n\
  \n将根元素添加到文档，并将元素添加到父元素：\n\n```java\ndoc.appendChild(rootElement);\nrootElement.appendChild(childElement);\n\
  childElement.appendChild(textNode);\n```\n\n在构建 DOM 树时，你可能还需要设置元素属性。只需调用 `Element`\
  \ 类的 `setAttribute` 方法即可：\n\n```java\nrootElement.setAttribute(name, value);\n```\n\
  \n### 带命名空间的文档\n\n如果你使用命名空间，创建文档的过程略有不同。\n\n首先，设置工厂以感知命名空间，然后创建构建器：\n\n```java\n\
  DocumentBuilderFactory factory = DocumentBuilderFactory.newInstance();\nfactory.setNamespaceAware(true);\n\
  builder = factory.newDocumentBuilder();\n```\n\n然后使用 `createElementNS` 代替 `createElement`\
  \ 来创建节点：\n\n```java\nElement rootElement = doc.createElementNS(namespace, tagName);\n\
  ```\n\n如果你的节点具有带有命名名前缀的限定名称，则任何 `xmlns` 前缀属性都会自动创建。例如，如果你在 XHTML 中需要 SVG，可以这样构造元素：\n\
  \n```java\nElement svgElement = doc.createElementNS(namespace, \"svg:svg\");\n```\n\
  \n当元素被写入时，它变为：\n\n```xml\n<svg:svg xmlns:svg=\"http://www.w3.org/2000/svg\">\n```\n\
  \n如果你需要设置命名空间元素属性，使用 `Element` 类的 `setAttributeNS` 方法：\n\n```java\nrootElement.setAttributeNS(namespace,\
  \ qualifiedName, value);\n```\n\n### 写入文档\n\n奇怪的是，将 DOM 树写入输出流并不简单。简单的方法是使用扩展样式语言转换（XSLT）API。有关\
  \ XSLT 的更多信息，请参阅 第 3.9 节。\n\n\n\n\n\n我们对文档应用“无操作”转换并捕获其输出。为了在输出中包含 `DOCTYPE` 节点，我们还需要将\
  \ `SYSTEM` 和 `PUBLIC` 标识符设置为输出属性。\n\n```\n// construct the do-nothing transformation\n\
  Transformer t = TransformerFactory.newInstance().newTransformer();\n// set output\
  \ properties to get a DOCTYPE node\nt.setOutputProperty(OutputKeys.DOCTYPE_SYSTEM,\
  \ systemIdentifier);\nt.setOutputProperty(OutputKeys.DOCTYPE_PUBLIC, publicIdentifier);\n\
  // set indentation\nt.setOutputProperty(OutputKeys.INDENT, \"yes\");\nt.setOutputProperty(OutputKeys.METHOD,\
  \ \"xml\");\nt.setOutputProperty(\"{http://xml.apache.org/xslt}indent-amount\",\
  \ \"2\");\n// apply the do-nothing transformation and send the output to a file\n\
  t.transform(new DOMSource(doc), new StreamResult(new FileOutputStream(file)));\n\
  ```\n\n另一种方法是使用 `LSSerializer` 接口。要获取实例，你需要使用以下“魔法咒”：\n\n```\nDOMImplementation\
  \ impl = doc.getImplementation();\nvar implLS = (DOMImplementationLS) impl.getFeature(\"\
  LS\", \"3.0\");\nLSSerializer ser = implLS.createLSSerializer();\n```\n\n如果你需要空格和换行，请设置此标志：\n\
  \n```\nser.getDomConfig().setParameter(\"format-pretty-print\", true);\n```\n\n\
  然后将文档转换为字符串就简单了：\n\n```\nString str = ser.writeToString(doc);\n```\n\n如果你想直接将输出写入文件，则需要一个\
  \ `LSOutput`：\n\n```\nLSOutput out = implLS.createLSOutput();\nout.setEncoding(\"\
  UTF-8\");\nout.setByteStream(Files.newOutputStream(path));\nser.write(doc, out);\n\
  ```\n\n### `javax.xml.parsers.DocumentBuilder` 1.4\n\n* `Document newDocument()`\n\
  \  返回一个空文档。\n\n### `org.w3c.dom.Document` 1.4\n\n* `Element createElement(String\
  \ name)`\n* `Element createElementNS(String uri, String qname)`\n  根据给定名称创建元素。\n\
  * `Text createTextNode(String data)`\n  根据给定数据创建文本节点。\n\n### `org.w3c.dom.Node`\
  \ 1.4\n\n* `Node appendChild(Node child)`\n  将节点添加到此节点的子节点列表中。返回被添加的节点。\n\n### `org.w3c.dom.Element`\
  \ 1.4\n\n* `void setAttribute(String name, String value)`\n* `void setAttributeNS(String\
  \ uri, String qname, String value)`\n  将给定名称的属性设置为给定值。如果限定名具有别名前缀，则 `uri` 不得为 `null`。\n\
  \n### `javax.xml.transform.TransformerFactory` 1.4\n\n* `static TransformerFactory\
  \ newInstance()`\n  返回 `TransformerFactory` 类的实例。\n* `Transformer newTransformer()`\n\
  \  返回一个执行恒等（无操作）转换的 `Transformer` 类的实例。\n\n### `javax.xml.transform.Transformer`\
  \ 1.4\n\n* `void setOutputProperty(String name, String value)`\n  设置输出属性。请参考 [`www.w3.org/TR/xslt#output`](https://www.w3.org/TR/xslt#output)\
  \ 获取标准输出属性列表。这里显示了最实用的属性：\n\n  | `doctype-public` | 在 `DOCTYPE` 声明中使用的公共 ID |\n\
  \  | :--- | :--- |\n  | `doctype-system` | 在 `DOCTYPE` 声明中使用的系统 ID |\n  | `indent`\
  \ | `\"yes\"` 或 `\"no\"` |\n  | `method` | `\"xml\"`、 `\"html\"`、 `\"text\"` 或自定义字符串\
  \ |\n* `void transform(Source from, Result to)`\n  转换 XML 文档。\n\n### `javax.xml.transform.dom.DOMSource`\
  \ 1.4\n\n* `DOMSource(Node n)`\n  从给定节点构建源。通常，`n` 是文档节点。\n\n### `javax.xml.transform.stream.StreamResult`\
  \ 1.4\n\n* `StreamResult(File f)`\n* `StreamResult(OutputStream out)`\n* `StreamResult(Writer\
  \ out)`\n* `StreamResult(String systemID)`\n  从文件、流、写入器或系统 ID（通常是相对或绝对 URL）构建流式结果。\n\
  \n### 使用 StAX 写入 XML 文档\n\n在上一节中，你看到了如何通过写入 DOM 树来生成 XML 文档。如果你对 DOM 树没有其他用途，那么这种方法并不高效。\n\
  \nStAX API 允许直接写入 XML 树。从 `OutputStream` 构建一个 `XMLStreamWriter`：\n\n```\nXMLOutputFactory\
  \ factory = XMLOutputFactory.newInstance();\nXMLStreamWriter writer = factory.createXMLStreamWriter(out);\n\
  ```\n\n要生成 XML 头部，调用：\n\n```\nwriter.writeStartDocument();\n```\n\n然后调用：\n\n```\n\
  writer.writeStartElement(name);\n```\n\n通过调用以下方法添加属性：\n\n```\nwriter.writeAttribute(name,\
  \ value);\n```\n\n现在你可以再次调用 `writeStartElement` 来添加子元素，或者使用以下方法写入字符：\n\n```\nwriter.writeCharacters(text);\n\
  ```\n\n当你写完所有子节点后，调用：\n\n```\nwriter.writeEndElement();\n```\n\n这会导致当前元素关闭。要写入一个没有子元素的元素，请使用：\n\
  \n```\nwriter.writeEmptyElement(name);\n```\n\n最后，在文档末尾调用：\n\n```\nwriter.writeDocument();\n\
  ```\n\n\n\n\n\n```java\npackage write;\n\nimport java.io.*;\nimport java.nio.file.*;\n\
  import java.util.random.*;\n\nimport javax.xml.parsers.*;\nimport javax.xml.stream.*;\n\
  import javax.xml.transform.*;\nimport javax.xml.transform.dom.*;\nimport javax.xml.transform.stream.*;\n\
  \nimport org.w3c.dom.*;\n\n/**\n * 此程序演示了如何写入 XML 文件。它生成 SVG 格式的现代艺术。\n * @version\
  \ 1.14 2023-08-27\n * @author Cay Horstmann\n */\npublic class XMLWriteTest\n{\n\
  \   public static void main(String[] args) throws Exception\n   {\n      Document\
  \ doc = newDrawing(600, 400);\n      writeDocument(doc, \"drawing1.svg\");\n   \
  \   writeNewDrawing(600, 400, \"drawing2.svg\");\n   }\n\n   private static RandomGenerator\
  \ generator = RandomGenerator.getDefault();\n\n   /**\n    * 创建一个新的随机图形。\n    *\
  \ @param drawingWidth 绘图宽度（像素）\n    * @param drawingHeight 绘图高度（像素）\n    * @return\
  \ SVG 文档的 DOM 树\n    */\n   public static Document newDrawing(int drawingWidth,\
  \ int drawingHeight) \n         throws ParserConfigurationException\n   {      \
  \    \n      DocumentBuilderFactory factory = DocumentBuilderFactory.newInstance();\n\
  \      factory.setNamespaceAware(true);\n      DocumentBuilder builder = factory.newDocumentBuilder();\n\
  \      String namespace = \"http://www.w3.org/2000/svg\";\n      Document doc =\
  \ builder.newDocument();\n      Element svgElement = doc.createElementNS(namespace,\
  \ \"svg\");\n      doc.appendChild(svgElement);\n      svgElement.setAttribute(\"\
  width\", \"\" + drawingWidth);\n      svgElement.setAttribute(\"height\", \"\" +\
  \ drawingHeight);\n      int n = 10 + generator.nextInt(20);\n      for (int i =\
  \ 1; i <= n; i++)\n      {\n         int x = generator.nextInt(drawingWidth);\n\
  \         int y = generator.nextInt(drawingHeight);\n         int width = generator.nextInt(drawingWidth\
  \ - x);\n         int height = generator.nextInt(drawingHeight - y);\n         int\
  \ r = generator.nextInt(256);\n         int g = generator.nextInt(256);\n      \
  \   int b = generator.nextInt(256);\n\n         Element rectElement = doc.createElementNS(namespace,\
  \ \"rect\");\n         rectElement.setAttribute(\"x\", \"\" + x);\n         rectElement.setAttribute(\"\
  y\", \"\" + y);\n         rectElement.setAttribute(\"width\", \"\" + width);\n \
  \        rectElement.setAttribute(\"height\", \"\" + height);\n         rectElement.setAttribute(\"\
  fill\", \n            \"#%02x%02x%02x\".formatted(r, g, b));\n         svgElement.appendChild(rectElement);\n\
  \      }\n      return doc;\n   }\n\n   /**\n    * 使用 DOM/XSLT 保存文档。\n    * @param\
  \ doc 要写入的文档\n    * @param filename 目标文件名\n    */\n   public static void writeDocument(Document\
  \ doc, String filename) \n         throws TransformerException, IOException \n \
  \  {\n      Transformer t = TransformerFactory.newInstance().newTransformer();\n\
  \      t.setOutputProperty(OutputKeys.DOCTYPE_SYSTEM,\n            \"http://www.w3.org/TR/2000/CR-SVG-20000802/DTD/svg-20000802.dtd\"\
  );\n      t.setOutputProperty(OutputKeys.DOCTYPE_PUBLIC, \n            \"-//W3C//DTD\
  \ SVG 20000802//EN\");\n      t.setOutputProperty(OutputKeys.INDENT, \"yes\");\n\
  \      t.setOutputProperty(OutputKeys.METHOD, \"xml\");\n      t.setOutputProperty(\"\
  {http://xml.apache.org/xslt}indent-amount\", \"2\");\n      t.transform(new DOMSource(doc),\
  \ new StreamResult(\n            Files.newOutputStream(Path.of(filename))));\n \
  \  }\n\n   /**\n    * 使用 StAX 写入带有随机图形的 SVG 文档。\n    * @param drawingWidth 绘图宽度（像素）\n\
  \    * @param drawingHeight 绘图高度（像素）\n    * @param filename 目标文件名\n    */\n   public\
  \ static void writeNewDrawing(int drawingWidth, int drawingHeight, \n         String\
  \ filename) throws XMLStreamException, IOException\n   {      \n      XMLOutputFactory\
  \ factory = XMLOutputFactory.newInstance();\n      XMLStreamWriter writer = factory.createXMLStreamWriter(\n\
  \            Files.newOutputStream(Path.of(filename)));      \n      writer.writeStartDocument();\n\
  \      writer.writeDTD(\"\"\"\n<!DOCTYPE svg PUBLIC \"-//W3C//DTD SVG 20000802//EN\"\
  \ \n  \"http://www.w3.org/TR/2000/CR-SVG-20000802/DTD/svg-20000802.dtd\">\n\"\"\"\
  );\n      writer.writeStartElement(\"svg\");\n      writer.writeDefaultNamespace(\"\
  http://www.w3.org/2000/svg\");\n      writer.writeAttribute(\"width\", \"\" + drawingWidth);\n\
  \      writer.writeAttribute(\"height\", \"\" + drawingHeight);\n      int n = 10\
  \ + generator.nextInt(20);      \n      for (int i = 1; i <= n; i++)\n      {\n\
  \         int x = generator.nextInt(drawingWidth);\n         int y = generator.nextInt(drawingHeight);\n\
  \         int width = generator.nextInt(drawingWidth - x);\n         int height\
  \ = generator.nextInt(drawingHeight - y);\n         int r = generator.nextInt(256);\n\
  \         int g = generator.nextInt(256);\n         int b = generator.nextInt(256);\n\
  \n         Element rectElement = doc.createElementNS(namespace, \"rect\");\n   \
  \      rectElement.setAttribute(\"x\", \"\" + x);\n         rectElement.setAttribute(\"\
  y\", \"\" + y);\n         rectElement.setAttribute(\"width\", \"\" + width);\n \
  \        rectElement.setAttribute(\"height\", \"\" + height);\n         rectElement.setAttribute(\"\
  fill\", \"#%02x%02x%02x\".formatted(r, g, b));\n         svgElement.appendChild(rectElement);\n\
  \      }\n      writer.writeEndDocument(); // 关闭 svg \n   }\n}\n```\n\n`javax.xml.stream.XMLOutputFactory`\
  \ 6\n\n- `static XMLOutputFactory newInstance()`\n  返回 `XMLOutputFactory` 类的实例。\n\
  \n- `XMLStreamWriter createXMLStreamWriter(OutputStream stream)`\n- `XMLStreamWriter\
  \ createXMLStreamWriter(OutputStream stream, String encoding)`\n- `XMLStreamWriter\
  \ createXMLStreamWriter(Writer writer)`\n- `XMLStreamWriter createXMLStreamWriter(Result\
  \ result)`\n  创建一个写入流、写入器或 JAXP 结果写入器。\n\n`javax.xml.stream.XMLStreamWriter` 6\n\
  \n- `void writeStartDocument()`\n- `void writeStartDocument(String xmlVersion)`\n\
  - `void writeStartDocument(String encoding, String xmlVersion)`\n  在文档顶部写入 XML 指令。注意\
  \ `encoding` 参数仅写入属性，不会设置输出的字符编码。\n\n- `void setDefaultNamespace(String namespaceURI)`\n\
  - `void setPrefix(String prefix, String namespaceURI)`\n  设置默认命名空间或与关联的命名空间。声明适用于当前元素，如果尚未写入元素，则作用于文档根元素。\n\
  \n- `void writeStartElement(String localName)`\n- `void writeStartElement(String\
  \ namespaceURI, String localName)`\n  写入起始标签，用关联的命名空间替换 `namespaceURI`。\n\n- `void\
  \ writeEndElement()`\n  关闭当前元素。\n\n- `void writeEndDocument()`\n  关闭所有打开的元素。\n\n\
  - `void writeEmptyElement(String localName)`\n- `void writeEmptyElement(String namespaceURI,\
  \ String localName)`\n  写入自闭合标签，用关联的命名空间替换 `namespaceURI`。\n\n- `void writeAttribute(String\
  \ localName, String value)`\n- `void writeAttribute(String namespaceURI, String\
  \ localName, String value)`\n  为当前元素写入属性，用关联的命名空间替换 `namespaceURI`。\n\n- `void writeCharacters(String\
  \ text)`\n  写入字符数据。\n\n- `void writeCData(String text)`\n  写入 `CDATA` 块。\n\n- `void\
  \ writeDTD(String dtd)`\n  写入 `dtd` 字符串，假设其包含 `DOCTYPE` 声明。\n\n- `void writeComment(String\
  \ comment)`\n  写入注释。\n\n- `void close()`\n  关闭此写入器。\n\n\n\n\n你需要提供一个 XSLT 样式表，用于描述将\
  \ XML 文档转换为其他格式。XSLT 处理器会读取 XML 文档和样式表，并产生预期的输出（参见图 3.4）。\n\n![Figure](img/fig02-08.jpg)应用\
  \ XSL 转换\n\nXSLT 规范非常复杂，已有专门针对该主题编写的整本书。我们不可能讨论 XSLT 的所有特性，因此我们将通过一个具有代表性的示例。你可以在\
  \ Don Box 等人编写的 **Essential XML** 一书中找到更多信息。XSLT 规范可以在 [`www.w3.org/TR/xslt`](https://www.w3.org/TR/xslt)\
  \ 找到。\n\n假设我们想将包含员工记录的 XML 文件转换为 HTML 文档。考虑以下输入文件：\n\n```\n<staff>\n   <employee>\n\
  \      <name>Carl Cracker</name>\n      <salary>75000.0</salary>\n      <hiredate\
  \ year=\"1987\" month=\"12\" day=\"15\"/>\n   </employee>\n   <employee>\n     \
  \ <name>Harry Hacker</name>\n      <salary>50000.0</salary>\n      <hiredate year=\"\
  1989\" month=\"10\" day=\"1\"/>\n   </employee>\n   <employee>\n      <name>Tony\
  \ Tester</name>\n      <salary>40000.0</salary>\n      <hiredate year=\"1990\" month=\"\
  3\" day=\"15\"/>\n   </employee>\n</staff>\n```\n\n预期的输出是一个 HTML 表格：\n\n```\n<table\
  \ border=\"1\">\n<tr>\n<td>Carl Cracker</td><td>$75000.0</td><td>1987-12-15</td>\n\
  </tr>\n<tr>\n<td>Harry Hacker</td><td>$50000.0</td><td>1989-10-1</td>\n</tr>\n<tr>\n\
  <td>Tony Tester</td><td>$40000.0</td><td>1990-3-15</td>\n</tr>\n</table>\n```\n\n\
  带有转换模板的样式表形式如下：\n\n```xml\n<?xml version=\"1.0\" encoding=\"ISO-8859-1\"?>\n<xsl:stylesheet\n\
  \      xmlns:xsl=\"http://www.w3.org/1999/XSL/Transform\"\n      version=\"1.0\"\
  >\n   <xsl:output method=\"html\"/>\n   template1\n\n   template2\n   . . .\n</xsl:stylesheet>\n\
  ```\n\n在我们的示例中，`xsl:output` 元素将方法指定为 HTML。其他有效的方法设置是 `xml` 和 `text`。\n\n这是一个典型的模板：\n\
  \n```\n<xsl:template match=\"/staff/employee\">\n   <tr><xsl:apply-templates/></tr>\n\
  </xsl:template>\n```\n\n`match` 属性的值是一个 XPath 表达式。该模板规定：每当你在 XPath 集合 `/staff/employee`\
  \ 中遇到一个节点时，执行以下操作：\n\n1. 输出字符串 `<tr>`。\n2. 在处理其子节点时继续应用模板。\n3. 在完成所有子节点的处理后输出字符串\
  \ `</tr>`。\n\n换句话说，此模板在每个员工记录周围生成 HTML 表格行标记。\n\nXSLT 处理器通过检查检查根元素开始处理。每当节点匹配其中一个模板时，它就会应用该模板。（如果匹配多个模板，则使用匹配度最高的一个；详细细节请参阅\
  \ [`www.w3.org/TR/xslt`](https://www.w3.org/TR/xslt) 中的规范）。如果没有匹配的模板，处理器将执行默认操作。对于文本节点，默认是将内容包含在输出中。对于元素，默认操作是不创建输出，而是继续处理子节点。\n\
  \n以下是一个用于转换员工文件中 `name` 节点的模板：\n\n```\n<xsl:template match=\"/staff/employee/name\"\
  >\n   <td><xsl:apply-templates/></td>\n</xsl:template>\n```\n\n如你所见，该模板产生了 `<td>.\
  \ . .</td>` 分隔符，并要求处理器递归地访问 `name` 元素的子节点。它只有一个子节点——文本节点。当处理器访问该节点时，它会输出文本内容（当然，前提是没有其他匹配的模板）。\n\
  \n如果你想将属性值复制到输出中，你需要多花一点精力。这是一个示例：\n\n```\n<xsl:template match=\"/staff/employee/hiredate\"\
  >\n   <td><xsl:value-of select=\"@year\"/>-<xsl:value-of\n   select=\"@month\"/>-<xsl:value-of\
  \ select=\"@day\"/></td>\n</xsl:template>\n```\n\n在处理 `hiredate` 节点时，此模板输出\n\n1.\
  \ 字符串 `<td>`。\n2. `year` 属性的值。\n3. 一个连字符 `-。\n4. `month` 属性的值。\n5. 一个连字符 `-。\n6.\
  \ `day` 属性的值。\n7. 字符串 `</td>`。\n\n`xsl:value-of` 语句计算节点集的字符串值。节点集由 `select` 属性的\
  \ XPath 值指定。在这种情况下，路径相对于当前处理的节点。节点集通过所有节点字符串值的拼接转换为字符串。属性节点的字符串值是其值。文本节点的字符串值是其内容。元素的字符串值是其子节点字符串值的拼接（但不包括其属性）。\n\
  \n列表 3.10 包含了将员工记录 XML 文件转换为 HTML 表格的样式表。\n\n列表 3.11 显示了不同的转换。输入是相同的 XML 文件，输出是熟悉的属性文件格式的纯文本：\n\
  \n```\nemployee.1.name=Carl Cracker\nemployee.1.salary=75000.0\nemployee.1.hiredate=1987-12-15\n\
  employee.2.name=Harry Hacker\nemployee.2.salary=50000.0\nemployee.2.hiredate=1989-10-1\n\
  employee.3.name=Tony Tester\nemployee.3.salary=40000.0\nemployee.3.hiredate=1990-3-15\n\
  ```\n\n\n\n\n\n这是一个将非 XML 遗留数据转换为 XML 的巧妙技巧。当然，大多数 XSLT 应用已经有了 XML 输入数据，你只需要简单地在\
  \ `StreamSource` 上调用 `transform` 方法即可：\n\n```\nt.transform(new StreamSource(file),\
  \ result);\n```\n\n转换结果实现 `Result` 接口的类对象。Java API 提供了三个类：\n\n```\nDOMResult\nSAXResult\n\
  StreamResult\n```\n\n要将结果存储在 DOM 树中，请使用 `DocumentBuilder` 生成一个新的文档节点并将其封装进 `DOMResult`：\n\
  \n```\nDocument doc = builder.newDocument();\nt.transform(source, new DOMResult(doc));\n\
  ```\n\n要将输出保存到文件中，请使用 `StreamResult`：\n\n```\nt.transform(source, new StreamResult(file));\n\
  ```\n\n`Listing 3.12` 包含了源代码。\n\n`transform/makehtml.xsl`\n\n```xml\n<?xml version=\"\
  1.0\" encoding=\"ISO-8859-1\"?>\n\n<xsl:stylesheet \n   xmlns:xsl=\"http://www.w3.org/1999/XSL/Transform\"\
  \ \n   version=\"1.0\">\n\n   <xsl:output method=\"html\"/>\n\n   <xsl:template\
  \ match=\"/staff\">\n      <table border=\"1\"><xsl:apply-templates/></table>\n\
  \   </xsl:template>\n\n   <xsl:template match=\"/staff/employee\">\n      <tr><xsl:apply-templates/></tr>\n\
  \   </xsl:template>\n\n   <xsl:template match=\"/staff/employee/name\">\n      <td><xsl:apply-templates/></td>\n\
  \   </xsl:template>\n\n   <xsl:template match=\"/staff/employee/salary\">\n    \
  \  <td>$<xsl:apply-templates/></td>\n   </xsl:template>\n\n   <xsl:template match=\"\
  /staff/employee/hiredate\">\n      <td><xsl:value-of select=\"@year\"/>-<xsl:value-of\
  \ \n      select=\"@month\"/>-<xsl:value-of select=\"@day\"/></td>\n   </xsl:template>\n\
  \n</xsl:stylesheet>\n```\n\n`transform/makeprop.xsl`\n\n```xml\n<?xml version=\"\
  1.0\"?>\n\n<xsl:stylesheet \n   xmlns:xsl=\"http://www.w3.org/1999/XSL/Transform\"\
  \ \n   version=\"1.0\">\n\n   <xsl:output method=\"text\" omit-xml-declaration=\"\
  yes\"/>\n\n   <xsl:template match=\"/staff/employee\">\nemployee.<xsl:value-of select=\"\
  position()\"\n/>.name=<xsl:value-of select=\"name/text()\"/>\nemployee.<xsl:value-of\
  \ select=\"position()\"\n/>.salary=<xsl:value-of select=\"salary/text()\"/>\nemployee.<xsl:value-of\
  \ select=\"position()\"\n/>.hiredate=<xsl:value-of select=\"hiredate/@year\"\n/>-<xsl:value-of\
  \ select=\"hiredate/@month\"\n/>-<xsl:value-of select=\"hiredate/@day\"/>\n   </xsl:template>\n\
  \n</xsl:stylesheet>\n```\n\n`transform/TransformTest.java`\n\n```java\npackage transform;\n\
  \nimport java.io.*;\nimport java.nio.file.*;\nimport java.util.*;\nimport javax.xml.transform.*;\n\
  import javax.xml.transform.sax.*;\nimport javax.xml.transform.stream.*;\nimport\
  \ org.xml.sax.*;\nimport org.xml.sax.helpers.*;\n\n/**\n * 此程序演示了 XSL 转换。它对一组员工记录进行转换。\n\
  \ * 记录存储在 employee.dat 文件中，并转换为 XML\n * 格式。在命令行上指定样式表，例如<br> \n *    java transform.TransformTest\
  \ transform/makeprop.xsl\n * @version 1.05 2021-09-21\n * @author Cay Horstmann\n\
  \ */\npublic class TransformTest\n{\n   public static void main(String[] args) throws\
  \ Exception\n   {\n      Path path;\n      if (args.length > 0) path = Path.of(args[0]);\n\
  \      else path = Path.of(\"transform\", \"makehtml.xsl\");\n      try (InputStream\
  \ styleIn = Files.newInputStream(path))\n      {\n         var styleSource = new\
  \ StreamSource(styleIn);\n\n         Transformer t = TransformerFactory.newInstance().newTransformer(styleSource);\
  \     \n         t.setOutputProperty(OutputKeys.INDENT, \"yes\");\n         t.setOutputProperty(OutputKeys.METHOD,\
  \ \"xml\");      \n         t.setOutputProperty(\"{http://xml.apache.org/xslt}indent-amount\"\
  , \"2\");\n\n         try (InputStream docIn = Files.newInputStream(Path.of(\"transform\"\
  , \"employee.dat\")))\n         {\n            t.transform(new SAXSource(new EmployeeReader(),\
  \ new InputSource(docIn)), \n               new StreamResult(System.out));\n   \
  \      }\n      }\n   }\n}\n\n/**\n * 此类读取扁平文件 employee.dat 并报告 SAX 解析器事件，\n * 就像在解析一个\
  \ XML 文件一样。\n */\nclass EmployeeReader implements XMLReader\n{\n   private ContentHandler\
  \ handler;\n\n   public void parse(InputSource source) throws IOException, SAXException\n\
  \   {\n      InputStream stream = source.getByteStream();\n      var in = new BufferedReader(new\
  \ InputStreamReader(stream));\n      var atts = new AttributesImpl();\n      //\
  \ ... 实现细节省略\n   }\n}\n```\n\n\n\n\n向此属性集添加一个属性。`lname` 参数是不带前缀的本地名称，而 `qname` 是带前缀的限定名称。`type`\
  \ 参数为 `\"CDATA\"`、`\"ID\"`、`IDREF\"`、`IDREFS\"`、`NMTOKEN\"`、`NMTOKENS\"`、`ENTITY\"\
  `、`ENTITIES\"` 或 `\"NOTATION\"`之一。\n\n- `void clear()`\n  从此属性集中移除所有属性。\n\n本示例结束了我们对\
  \ Java API 中 XML 支持的讨论。现在你应该对 XML 的主要优势有了良好的理解——特别是它的自动化解析和验证，以及其强大的转换机制。当然，只有当你设计好\
  \ XML 格式时，所有这些技术才能为你发挥作用。你需要确保格式足够丰富以表达所有的业务需求，确保它们随时间保持稳定，并且你的业务合作伙伴愿意接受你的 XML\
  \ 文档。这些问题可能比处理解析器、DTD 或转换要挑战性得多。\n\n在下一章中，我们将讨论 Java 平台上的网络编程，从网络套字（sockets）的基础知识开始，然后转向电子邮件和万维网的高级协议。\n\
  \n## 网络编程\n\n本章将从回顾基础网络概念开始，然后编写连接到网络服务的 Java 程序。我们将向你展示网络客户端和服务器是如何实现的。最后，你将看到如何从\
  \ Java 程序发送电子邮件，以及如何从 Web 服务器上获取信息。\n\n## 连接到服务器\n\n在接下来的章节中，你将连接到服务器，首先是手动通过 telnet，然后是通过\
  \ Java 程序。\n\n### 使用 Telnet\n\ntelnet 程序是网络编程的极佳调试工具。你应该能够通过在命令行 shell 中输入 `telnet`\
  \ 来启动它。\n\n在 Windows 中，你需要激活 telnet。进入控制面板，选择“程序”，点击“启用或关闭 Windows 功能”，并勾选 Telnet\
  \ 客户端复选框。Windows 防火墙还会拦截我们在本章使用的不少网络端口；你可能需要管理员账户来解除这些的拦截。\n\n你可能用过 telnet 连接到远程计算机，但你也可以用它与互联网主机提供的其他服务进行通信。这里有一个你可以执行的操作示例。输入：\n\
  \n```\ntelnet time-a.nist.gov 13\n```\n\n如图 4.1 所示，你应该得到类似下面的一行的返回：\n\n```\n57488\
  \ 16-04-10 04:23:00 50 0 0 610.5 UTC(NIST) *\n```\n\n![Figure](img/fig03-01_new.jpg)“时间”服务的输出\n\
  \n发生了什么？你连接到了绝大多数 UNIX 机器持续运行的“时间”服务。你连接的特定服务器由美国国家标准技术研究院（NIST）运行，提供铯原子钟的测量值。（当然，由于网络延迟，报告的时间并不完全准确。）\n\
  \n按照惯，“时间”服务始终绑定在“端口”号 13。\n\n在网络术语中，端口并不是物理设备，而是一种促进服务器与客户端之间通信的抽象（见图 4.2）。\n\n\
  ![Figure](img/fig03-02.jpg)连接到服务器端口的客户端\n\n服务器软件在远程机器上持续运行，等待任何想要与端口 13 通信的网络流量。当远程计算机上的操作系统接收到一个包含连接到端口\
  \ 13 请求的网络包时，它会唤醒监听的服务器进程并建立连接。连接将一直保持，直到被其中一方终止。\n\n当你通过端口 13 与 `time-a.nist.gov`\
  \  telnet 会话时，一段网络软件足以将字符串 `\"time-a.nist.gov\"` 转换为其正确的网际协议（IP）地址 129.6.15.28。随后\
  \ telnet 软件向该地址发送连接请求，请求连接到端口 13。一旦连接建立，远程程序就会返回一行数据并关闭连接。通常情况下，客户端和服务器在其中一方关闭连接之前会进行更广泛的对话。\n\
  \n这里是另一个类似的实验——但稍微有趣一点。输入：\n\n```\ntelnet horstmann.com 80\n```\n\n然后非常仔细地输入以下内容：\n\
  \n```\nGET /index.html HTTP/1.1\nHost: horstmann.com\n空行\n```\n\n也就是说，在最后按两次回车键。\n\
  \n图 4.3 显示了响应。它看起来应该非常熟悉——你得到了一个 HTML 格式的文本页面，即 Cay Horstmann 的主页。\n\n![Figure](img/Capture-Terminal.jpg)使用\
  \ telnet 访问 HTTP 端口\n\n这与你的网络浏览器获取网页时经历的过程完全相同。它使用 HTTP 从服务器请求网页。当然，浏览器显示 HTML 代码的方式更加美观。\n\
  \n当你连接到在同一 IP 地址上托管多个域名的 Web 服务器时，需要 `Host` 键值对。如果服务器只托管一个域名，你可以省略它。\n\n### 使用 Java\
  \ 连接到服务器\n\n我们在列表 4.1 中的第一个网络程序将执行与使用 telnet 相同的操作——连接到端口并打印出它找到的内容。\n\n`socket/SocketTest.java`\n\
  \n```\npackage socket;\n\nimport java.io.*;\nimport java.net.*;\nimport java.util.*;\n\
  \n/**\n * 此程序对科罗拉多州波老的原子钟建立套接字连接，\n * 并打印服务器发送的时间。\n * @version 1.23 2023-08-16\n\
  \ * @author Cay Horstmann\n */\npublic class SocketTest\n{\n   public static void\
  \ main(String[] args) throws IOException\n   {\n      try (var s = new Socket(\"\
  time-a.nist.gov\", 13);\n            var in = new Scanner(s.getInputStream()))\n\
  \      {\n         while (in.hasNextLine())\n         {\n            String line\
  \ = in.nextLine();\n            System.out.println(line);\n         }\n      }\n\
  \   }\n}\n```\n\n这个简单程序的关键语句是：\n\n```\nvar s = new Socket(\"time-a.nist.gov\", 13);\n\
  InputStream inStream = s.getInputStream();\n```\n\n第一行代码开启了一个 `socket`（套接字），这是一种网络抽象，允许数据进入或此程序。我们将远程地址和端口号传递给套接字构造函数。如果连接失败，将抛出\
  \ `UnknownHostException`，它是 `IOException` 的子类。\n\n`java.net.Socket` 中的 `getInputStream`\
  \ 方法返回一个 `InputStream` 对象，你可以像使用其他流一样使用它。如果无法从套接字读取，该方法将抛出 `IOException`。一旦获取了流，此程序只需将每行输入打印到标准输出。这一过程将持续持续到流结束且服务器断开。\n\
  \n此程序仅适用于非常简单的服务器，例如“时间”服务。在更复杂的网络程序中，客户端向服务器发送请求数据，服务器在响应结束后可能不会立即断开。你将在本章的多个示例看到如何实现这种行为。\n\
  \n`Socket` 类非常友好且易用，因为 Java 库隐藏了建立网络连接和跨其传输数据的复杂性。`java.net` 包本质上提供了与处理文件相同的编程接口。\n\
  \n\n\n\n在本本书中，我们只涵盖了传输控制协议（TCP）。Java 平台也支持用户数据报协议（UDP），它可以用于发送数据包（也称为 `datagrams`），其开销远小于\
  \ TCP。缺点是数据包不需要按顺序递送给接收端应用程序，甚至可能被完全丢弃。接收方负责对数据包进行排序，并请求重传丢失的数据包。UDP 非常适用于可以容忍数据包丢失的应用程序——例如音频或视频流或连续测量。\n\
  \n### `java.net.Socket` 1.0\n\n*   `Socket(String host, int port)`\n    构造一个连接到给定主机和端口的\
  \ socket。\n*   `InputStream getgetInputStream()`\n*   `OutputStream getOutputStream()`\n\
  \    获取从 socket 读取数据或向 socket 写入数据的流。\n\n### Socket 超时（Socket Timeouts）\n\n从 socket\
  \ 读取数据会阻塞，直到有可用数据。如果主机不可用，你的应用程序将等待很长时间，你只能听底层操作系统最终超时。\n\n你可以根据你的特定应用决定什么超时值是合理的。然后，调用\
  \ `setSoTimeout` 方法设置超时值（单位毫秒）。\n\n```\nvar s = new Socket(. . .);\ns.setSoTimeout(10000);\
  \ // 10 秒后超时\n```\n\n如果为 socket 设置了超时值，当所有后续的读操作在完成工作之前达到超时时，将抛出 `SocketTimeoutException`。你可以捕获该异常并对超时做出反应。\n\
  \n```\ntry\n{\n   InputStream in = s.getInputStream(); // 从 in 中读取\n   . . .\n}\
  \ \ncatch (SocketTimeoutException e)\n{\n   对超时做出反应\n}\n```\n\n写操作没有超时设置。\n\n还有一个额外的超时问题需要你解决。构造函数\n\
  \n```\nSocket(String host, int port)\n```\n可能会无限阻塞，直到建立与主机的初始连接。\n\n你可以通过先构造一个未连接的\
  \ socket，然后带超时时间连接它来解决这个问题：\n\n```\nvar s = new Socket();\ns.connect(new InetSocketAddress(host,\
  \ port), timeout);\n```\n\n参见第 4.2.4 节 了解如何允许用户随时中断 socket 连接。\n\n### `java.net.Socket`\
  \ 1.0\n\n*   `Socket()` 1.1\n    创建一个尚未连接的 socket。\n*   `void connect(SocketAddress\
  \ address)` 1.4\n    将此 socket 连接到给定地址。\n*   `void connect(SocketAddress address,\
  \ int timeoutInMilliseconds)` 1.4\n    将此 socket 连接到给定地址，或者在时间间隔过期时抛出 `SocketTimeoutException`。\n\
  *   `void setSoTimeout(int timeoutInMilliseconds)` 1.1\n    设置在此 socket 上读请求的阻塞时间。如果在读取时达到超时，将抛出\
  \ `SocketTimeoutException`。\n*   `boolean isConnected()` 1.4\n*   `boolean isClosed()`\
  \ 1.4\n    如果 socket 已连接或关闭，则返回 `true`。\n\n### Internet 地址（Internet Addresses）\n\
  \n通常，你不需要太担心 Internet 地址——即由 4 字节（对于 IPv6，则为 16 字节）组成的数值主机地址，例如 `129.6.15.28`。然而，如果你需要在主机名和\
  \ Internet 地址之间进行转换，可以使用 `InetAddress` 类。\n\n`java.net` 包支持 IPv6 Internet 地址，只要主机操作系统支持即可。\n\
  \n静态方法 `getByName` 返回一个主机的 `InetAddress` 对象。例如，\n\n```\nInetAddress address = InetAddress.getByName(\"\
  time-a.nist.gov\");\n```\n返回一个封装了四个字节序列 `129.6.15.28` 的 `InetAddress` 对象。你可以通过 `getAddress`\
  \ 方法访问这些字节。\n\n```\nbyte[] addressBytes = address.getAddress();\n```\n\n一些流量很大的主机名对应于多个\
  \ Internet 地址，以利于负载均衡。例如，在编写此书时，主机名 `google.com` 对应于十二个不同的 Internet 地址。在访问主机时，会随机选择其中一个。你可以使用\
  \ `getAllByName` 方法获取所有主机。\n\n```\nInetAddress[] addresses = InetAddress.getAllByName(host);\n\
  ```\n\n最后，你有时需要本地主机的地址。如果你简单请求 `localhost` 的地址，你总是会得到本地回环地址 `127.0.0.1`，其他人无法用它连接到你的计算机。相反，使用静态方法\
  \ `getLocalHost` 来获取本地主机的地址。\n\n```\nInetAddress address = InetAddress.getLocalHost();\n\
  ```\n\n列表 4.2 是一个简单的程序，如果你没有指定任何命令行参数，它会打印本地主机的 Internet 地址；如果你在命令行指定了主机名，它将打印另一个主机的所有\
  \ Internet 地址，例如：\n\n```\njava inetAddress.InetAddressTest www.horstmann.com\n```\n\
  \ninetAddress/InetAddressTest.java\n\n```\npackage inetAddress;\n\nimport java.io.*;\n\
  import java.net.*;\n\n/**\n * 此程序演示了 InetAddress 类。提供主机名作为命令行参数，\n * 或不带命令行参数运行以查看本地主机的地址。\n\
  \ * @version 1.0 2012-06-05\n * @author Cay Horstmann\n */\npublic class InetAddressTest\n\
  {\n   public static void main(String[] args) throws IOException\n   {\n      if\
  \ (args.length > 0)\n      {\n         String host = args[0];\n         InetAddress[]\
  \ addresses = InetAddress.getAllByName(host);\n         for (InetAddress a : addresses)\n\
  \            System.out.println(a);\n      }\n      else\n      {\n         InetAddress\
  \ localHostAddress = InetAddress.getLocalHost();\n         System.out.println(localHostAddress);\n\
  \      }\n   }\n}\n```\n\n### `java.net.InetAddress` 1.0\n\n*   `static InetAddress\
  \ getByName(String host)`\n*   `static InetAddress[] getAllByName(String host)`\n\
  \    为给定主机构造 `InetAddress`，或返回所有 Internet 地址数组。\n*   `static InetAddress getLocalHost()`\n\
  \    构造本地主机的 `InetAddress`。\n*   `byte[] getAddress()`\n    返回包含数值地址的字节数组。\n*  \
  \ `String getHostAddress()`\n    返回字符串，例如 `\"129.6.15.28\"`。\n*   `String getHostName()`\n\
  \    返回主机名。\n\n## 实现服务器（Implementing Servers）\n\n现在实现了一个从 Internet 接收数据的基础客户端，让我们编写一个向客户端发送信息的简单服务器。\n\
  \n### 服务器 Socket（Server Sockets）\n\n服务器程序在启动时等待客户端连接到其端口。对于我们的示例程序，我们选择了端口号 8189，它没有被任何标准服务使用。`ServerSocket`\
  \ 类建立了 socket。在我们的情况下，命令\n\n```\nvar s = new ServerSocket(8189);\n```\n建立了一个监控端口\
  \ 8189 的服务器。命令\n\n```\nSocket incoming = s.accept();\n```\n让程序无限等待直到客户端连接该端口。一旦有人通过网络发送正确请求连接此端口，该方法将返回一个表示已建立连接的\
  \ `Socket` 对象。你可以使用此对象获取输入输出流，如下所示：\n\n```\nInputStream inStream = incoming.getInputStream();\n\
  OutputStream outStream = incoming.getOutputStream();\n```\n\n服务器发送到服务器输出流的内容成为客户端的输入，客户端的所有输出都进入服务器输入流。\n\
  \n在本章的所有示例中，我们通过 socket 传输文本。因此，我们将流转换为扫描器和写入器。\n\n```\nvar in = new Scanner(inStream);\n\
  var out = new PrintWriter(new OutputStreamWriter(outStream), true /* autoFlush */);\n\
  ```\n\n让我们给客户端发送问候：\n\n```\nout.println(\"Hello! Enter BYE to exit.\");\n```\n\n\
  当你使用 telnet 连接到端口 8189 的服务器程序时，你将在终端屏幕上看到这个问候。\n\n\n\n在这个简单的服务器中，我们只是逐行读取客户端的输入并将其回显（echo）。这证明了程序接收到了输入。一个实际的服务器显然会根据输入进行计算并返回一个答案。\n\
  \n```\nString line = in.nextLine();\nout.println(\"Echo: \" + line);\nif (line.strip().equals(\"\
  BYE\")) done = true;\n```\n\n最后，我们关闭了传入的套字。\n\n```\nincoming.close();\n```\n\n就是这些了。每一个服务器程序（例如\
  \ HTTP Web 服务器）都会持续执行这个循环：\n\n1. 它通过输入数据流接收客户端的命令（“给我这些信息”）。\n2. 它解码客户端命令。\n3. 它收集客户端请求的信息。\n\
  4. 它通过输出数据流将信息发送给客户端。\n\nListing 4.3 是完整的程序。\n\n`server/EchoServer.java`\n\n```java\n\
  package server;\n\nimport java.io.*;\nimport java.net.*;\nimport java.util.*;\n\n\
  /**\n * 此程序实现了一个简单的服务器，监听端口 8189 \n * 或作为参数提供的端口，并回显所有客户端输入。\n * @version 1.23 2023-08-16\n\
  \ * @author Cay Horstmann\n */\npublic class EchoServer\n{\n   public static void\
  \ main(String[] args) throws IOException\n   {\n      int port = args.length >=\
  \ 1 ? Integer.parseInt(args[0]) : 8189;\n\n      try (var s = new ServerSocket(port);\
  \ // 建立服务器套字\n            Socket incoming = s.accept()) // 等待连接         \n     \
  \ {\n         serve(incoming);\n      }\n   }\n\n   public static void serve(Socket\
  \ incoming) throws IOException\n   {\n      try (var in = new Scanner(incoming.getInputStream());\
  \         \n         var out = new PrintWriter(incoming.getOutputStream(),\n   \
  \         true /* autoFlush */))\n      {\n         out.println( \"Hello! Enter\
  \ BYE to exit.\" );\n\n         // 回显客户端输入\n         boolean done = false;\n   \
  \      while (!done && in.hasNextLine())\n         {  \n            String line\
  \ = in.nextLine();            \n            out.println(\"Echo: \" + line);    \
  \        \n            if (line.strip().equals(\"BYE\"))\n               done =\
  \ true;\n         }\n      }\n   }   \n}\n```\n\n要尝试运行，请编译并运行该程序。然后使用 `telnet` 连接到服务器\
  \ `localhost`（或 IP 地址 `127.0.0.1`）以及端口 `8189`。\n\n如果你直接连接互联网，世界上任何人都可以访问你的回显服务器，只要他们知道你的\
  \ IP 地址和魔法端口号。\n\n当你连接到端口时，你将看到图 4.4 所示的消息：\n\n```\nHello! Enter BYE to exit.\n\
  ```\n\n![Figure](img/fig03-04_alt.jpg)访问回显服务器\n\n输入任何内容并观察输入在屏幕上的回显。输入 `BYE`（全大写字母）断开连接。服务器程序也将终止。\n\
  \n`java.net.ServerSocket` 1.0\n\n* `ServerSocket(int port)`：创建一个监控端口的服务器套字。\n* `Socket\
  \ accept()`：等待连接。该方法会阻塞（即空闲）当前线程，直到连接建立。该方法返回一个 `Socket` 对象，程序通过它与连接的客户端进行通信。\n\
  * `void close()`：关闭服务器套字。\n\n### 服务多个客户端\n\n前一个示例中的简单服务器存在一个问题。假设我们允许多个客户端同时连接到我们的服务器。通常，服务器在服务器计算机上持续运行，来自互联网各地的客户端可能想同时使用它。如果没有对多路连接的支持，任何一个客户端都可以通过长时间连接来垄占服务。我们可以通过线程的魔法做得更好。\n\
  \n每当我们知道程序已建立新的套字连接时——也就是说，每当调用 `accept()` 返回一个套字时——我们都会启动一个新线程来处理服务器与*该*客户端之间的连接。主程序将直接返回并等待下一个连接。为了实现这一点，服务器的主循环必须像这样：\n\
  \n```java\nExecutorService service = Executors.newVirtualThreadPerTaskExecutor();\n\
  while (true)\n{\n   Socket incoming = s.accept();\n   service.submit(() -> serve(incoming));\n\
  }\n```\n\n`serve` 方法包含了与客户端的通信循环：\n\n```java\npublic void serve(Socket incoming)\n\
  {\n   try (var in = new Scanner(incoming.getInputStream());         \n      var\
  \ out = new PrintWriter(incoming.getOutputStream(), \n         true /* autoFlush\
  \ */))\n   {\n      处理输入并发送响应\n   }\n   catch (IOException e)\n   {\n      处理异常\n\
  \   }\n}\n```\n\n当每个连接都启动一个新线程时，多个客户端可以同时连接到服务器。你可以轻松地检查这一点。\n\n1. 编译并运行服务器程序 (Listing\
  \ 4.4)。\n2. 如如图 4.5 所示打开几个 `telnet` 窗口。\n3. 在窗口之间切换并输入命令。注意你可以同时进行通信。\n4. 完成后，切换到窗口并按\
  \ Ctrl+C 杀死它。\n\n![Figure](img/fig03-04_alt.jpg)多个同时通信的 telnet 窗口 threadedEchoServer.java\n\
  \n```java\npackage threaded;\n\nimport java.io.*;\nimport java.net.*;\nimport java.util.*;\n\
  \n/**\n * 此程序实现了一个简单的服务器，监听端口 8189 \n * 或作为参数提供的端口，并回显所有客户端输入。\n * @version 1.24\
  \ 2023-08-16\n * @author Cay Horstmann\n */\npublic class EchoServer\n{\n   public\
  \ static void main(String[] args) throws IOException\n   {\n      int port = args.length\
  \ >= 1 ? Integer.parseInt(args[0]) : 8189;\n\n      try (var s = new ServerSocket(port))\
  \ // 建立服务器套字\n         int i = 1;\n         ExecutorService service = Executors.newVirtualThreadPerTaskExecutor();\n\
  \n         while (true)\n         {\n            Socket incoming = s.accept();\n\
  \            System.out.println(\"Spawning \" + i);\n            service.submit(()\
  \ -> serve(incoming));\n            i++;\n         }\n      }\n\n   public static\
  \ void serve(Socket incoming)\n   {\n      try (var in = new Scanner(incoming.getInputStream());\
  \         \n         var out = new PrintWriter(incoming.getOutputStream(),\n   \
  \         true /* autoFlush */))\n      {\n         out.println( \"Hello! Enter\
  \ BYE to exit.\" );\n\n         // 回显客户端输入\n         boolean done = false;\n   \
  \      while (!done && in.hasNextLine())\n         {  \n            String line\
  \ = in.nextLine();            \n            out.println(\"Echo: \" + line);    \
  \        \n            if (line.strip().equals(\"BYE\"))\n               done =\
  \ true;\n         }\n      }\n      catch (IOException e)\n      {  \n         e.printStackTrace();\n\
  \      }              \n   }\n}\n```\n\n### 半关闭 (Half-Close)\n\n*半关闭*允许套字连接的一端终止输出，同时仍从另一端接收数据。\n\
  \n这是一个典型的情况。假设你向服务器传输数据，但你最初不知道有多少数据。对于文件，你会在数据结束时关闭文件。然而，如果你关闭了套字，你就会立即与服务器断开并且无法读取响应。\n\
  \n半关闭解决了这个问题。你可以关闭套字的输出流，从而向服务器指示请求数据的结束，但保持输入流开启。\n\n客户端端看起来如下：\n\n```java\ntry\
  \ (var socket = new Socket(host, port))\n{\n   var in = new Scanner(socket.getInputStream());\n\
  \   var writer = new PrintWriter(socket.getOutputStream());\n   // 发送请求数据\n   writer.print(.\
  \ . .);\n   writer.flush();\n   socket.shutdownOutput();\n   // 现在套字处于半关闭状态\n  \
  \ // 读取响应数据\n   while (in.hasNextLine())\n   { \n      String line = in.nextLine();\n\
  \      . . . \n   }\n}\n```\n\n服务器端只需读取输入直到到达输入流的结束。然后它发送响应。\n\n\n\n\n当然，这种协议仅适用于一次性服务，例如\
  \ HTTP，在其中客户端连接、发送请求、捕获响应，然后断开连接。\n\n`java.net.Socket` 1.0\n\n*   `void shutdownInput()`\
  \ 1.3\n*   `void shutdownOutput()` 1.3\n    将输入流或输出流设置为“流结束”。\n*   `boolean isInputShutdown()`\
  \ 1.4\n*   `boolean isOutputShutdown()` 1.4\n    如果输入或输出已关闭，则返回 `true`。\n\n### 可中断套接字\
  \ (Interruptible Sockets)\n\n当你连接到套接字时，当前线程会阻塞，直到连接建立或超时。同样地，当你通过套接字读取数据时，当前线程会阻塞，直到操作成功或超时。（写入数据没有超时限制。）\n\
  \n在交互式应用程序中，你希望给用户提供一个选项，用于取消看似没有结果套接字连接。然而，如果平台线程在无响应的套接字上阻塞，你无法通过调用 `interrupt`\
  \ 来解除阻塞。\n\n当使用虚拟线程时，套接字操作是可以中断的，你不需要本节讨论的技巧。\n\n要中断套接字操作，请使用 `java.nio` 包中的 `SocketChannel`\
  \ 功能。按如下方式打开 `SocketChannel`：\n\n```\nSocketChannel channel = SocketChannel.open(new\
  \ InetSocketAddress(host, port));\n```\n\n通道没有关联的流。相反，它拥有 `read` 和 `write` 方法，这些方法利用\
  \ `Buffer` 对象。（有关 NIO 缓冲器的更多信息请参见第 2 章;\n```\n\n要将通道转换为输出流，请使用静态方法 `Channels.newOutputStream`。\n\
  \n```\nOutputStream outStream = Channels.newOutputStream(channel);\n```\n\n这就是你需要的所有操作。每当线程在打开、读取或写入操作期间被中断时，该操作不会阻塞，而是会以异常终止。\n\
  \n列表 4.5 中的程序对比了可中断和阻塞的套接字。服务器发送数字，并在第十个数字后假装卡住。你被问想使用套接字还是通道。你还可以在平台线程和虚拟线程之间进行选择。启动一个客户端线程连接到服务器并打印输出。按回车中断客户端线程。如果你在前十个数字内执行操作，你就可以中断该线程。\n\
  \n然而，如果你使用套接字和平台线程，在前十个数字之后进行中断将无效。阻塞线程会一直阻塞，直到服务器最终关闭连接。解决办法是使用通道或虚拟线程。\n\n`interruptible/InterruptibleSocketTest.java`\n\
  \n```java\npackage interruptible;\n\nimport java.util.*;\nimport java.net.*;\nimport\
  \ java.io.*;\nimport java.nio.channels.*;\n\n/**\n * 此程序演示了如何中断套接字通道。\n * @author\
  \ Cay Horstmann\n * @version 1.1 2023-08-16\n */\npublic class InterruptibleSocketTest\n\
  {\n   public static void main(String[] args)\n   {      \n      Thread.ofPlatform().start(new\
  \ TestServer());\n      Scanner console = new Scanner(System.in);\n      System.out.print(\"\
  Socket or channel? (S/C) \");\n      boolean socket = console.nextLine().equalsIgnoreCase(\"\
  S\");\n      System.out.print(\"Platform or virtual? (P/V) \");\n      boolean platform\
  \ = console.nextLine().equalsIgnoreCase(\"P\");\n      Runnable client = socket\
  \ ? InterruptibleSocketTest::useSocket\n            : InterruptibleSocketTest::useChannel;\n\
  \      Thread clientThread = platform ? Thread.ofPlatform().start(client) \n   \
  \         : Thread.ofVirtual().start(client);\n\n      System.out.print(\"Hit Enter\
  \ to interrupt client\");\n      console.nextLine();\n      clientThread.interrupt();\n\
  \   }\n\n   /**\n    * 使用通道连接到测试服务器。\n    */\n   public static void useChannel()\n\
  \   {\n      System.out.println(\"Channel:\\n\");\n      try (SocketChannel channel\
  \ \n            = SocketChannel.open(new InetSocketAddress(\"localhost\", 8189)))\n\
  \      {\n         Scanner in = new Scanner(channel);\n         while (!Thread.currentThread().isInterrupted())\n\
  \         {\n            System.out.print(\"Reading \");\n            if (in.hasNextLine())\n\
  \            {\n               String line = in.nextLine();\n               System.out.println(line);\n\
  \            }\n         }\n      }\n      catch (IOException e)\n      {\n    \
  \     e.printStackTrace();\n      }\n      finally\n      {\n         System.out.println(\"\
  Channel closed\\n\");\n      }\n   }\n\n   /**\n    * 使用套接字连接到测试服务器。\n    */\n \
  \  public static void useSocket()\n   {\n      System.out.println(\"Socket:\\n\"\
  );\n      try (var sock = new Socket(\"localhost\", 8189))\n      {\n         Scanner\
  \ in = new Scanner(sock.getInputStream());\n         while (!Thread.currentThread().isInterrupted())\n\
  \         {\n            System.out.print(\"Reading \");\n            if (in.hasNextLine())\n\
  \            {\n               String line = in.nextLine();\n               System.out.println(line);\n\
  \            }\n         }\n      }\n      catch (IOException e)\n      {\n    \
  \     e.printStackTrace();\n      }\n      finally\n      {\n         System.out.println(\"\
  Socket closed\\n\");\n      }\n   }\n\n   /**\n    * 一个监听端口 8189 并向客户端发送数字的服务器，\n\
  \    * 模拟在 10 个数字后服务器挂起。\n    */\n   static class TestServer implements Runnable\n\
  \   {\n      public void run()\n      {\n         try (var s = new ServerSocket(8189);\n\
  \            Socket incoming = s.accept())\n         {\n            serve(incoming);\n\
  \         }\n         catch (Exception e)\n         {\n            e.printStackTrace();\n\
  \         }\n         finally\n         {\n            System.out.println(\"Closing\
  \ connection\\n\");\n         }\n      }\n\n      private void serve(Socket incoming)\
  \ throws IOException, InterruptedException\n      {\n         int counter = 0;\n\
  \         try (var out = new PrintWriter(incoming.getOutputStream(),\n         \
  \      true /* autoFlush */))\n         {\n            while (counter < 100)\n \
  \           {\n               counter++;\n               if (counter <= 10) out.println(counter);\n\
  \               Thread.sleep(100);\n            }\n         }\n      }\n   }\n}\n\
  ```\n\n`java.net.InetSocketAddress` 1.4\n\n*   `InetSocketAddress(String hostname,\
  \ int port)`\n    使用指定的主机名和端口构造地址对象，并在构造期间解析主机名。如果无法解析主机名，则该地址对象的 `unresolved` 属性被设置为\
  \ `true`。\n*   `boolean isUnresolved()`\n    如果此地址对象无法解析，则返回 `true`。\n\n`java.nio.channels.SocketChannel`\
  \ 1.4\n\n*   `static SocketChannel open(SocketAddress address)`\n    打开套接字通道并连接到远程地址。\n\
  \n`java.nio.channels.Channels` 1.4\n\n*   `static InputStream newInputStream(ReadableByteChannel\
  \ channel)`\n    构造从给定通道读取的输入流。\n*   `static OutputStream newOutputStream(WritableByteChannel\
  \ channel)`\n    构造写入给定通道的输出流。\n\n### 安全套接字通信 (Secure Socket Communication)\n\n\
  当你在网上实现客户端和服务并交换敏感信息时，你不希望使用明文流量。相反，你应该使用安全的通信机制。安全通信有三个方面：\n\n*   通信是加密的，因此第三方无法读取。\n\
  *   服务器的身份通过数字签名进行验证，由客户端验证该签名。可选情况下，客户端也可以提供数字签名，但这在 Web 应用程序中并不常见。\n\n\n\n\n\n\
  * 传输的数据由发送者进行数字签名并由接收者进行验证，以确保没有第三方修改或替换数据。\n\n`TLS`（传输层安全）协议是安全通信最常用的机制。它是 `SSL`（安全套接层）协议的继任者。\n\
  \n在 Java 中，你使用 `javax.net.ssl` 包中的类来建立安全连接。以下是构造用于安全连接的 socket：\n\n```\nSocketFactory\
  \ factory = SSLSocketFactory.getDefault();\nSocket s = factory.createSocket(host,\
  \ port);\n```\n\n对于安全的服务器 socket，你也使用一个工厂：\n\n```\nServerSocketFactory factory =\
  \ SSLServerSocketFactory.getDefault();\nServerSocket s = factory.createServerSocket(port);\n\
  ```\n\n如果你需要配置客户端或服务器 socket 的安全连接参数，可以将工厂返回的对象强制转换为 `SSLSocket` 或 `SSLServerSocket`：\n\
  \n```\n((SSLServerSocket) s).setNeedClientAuth(true);\n```\n\n客户端和服务器使用共享加密密钥对流量进行加密。然而，它们需要确认彼此是在与对方通信，而不是与“中间人”通信。服务器会提供证书来证明其真实性。该证书需要由客户端已知的证书颁发机构签名。JDK\
  \ 内置了一个已知证书颁发机构列表。你通常会从其中一个获取服务器证书并将其安装在服务器上。然而，为了测试，我们将生成自己的证书。\n\n请参见第 9 章 有关证书以及用于管理它们的\
  \ `keytool` 程序的详细说明。以下是生成证书并将其放入服务器和客户端“密钥库”的命令。\n\n首先，生成服务器证书：\n\n```\nkeytool\
  \ -genkeypair -alias servercert -keyalg RSA -keysize 2048 -sigalg SHA256withRSA\
  \ -keystore server.jks -storepass secret -ext san=ip:127.0.0.1,dns:localhost\n```\n\
  \n此时系统将向你提出若干关于负责服务器的机构的问题。在演示中，你可以将所有问题都留为默认值“unknown”。\n\n接下来，导出证书并将其导入客户端密钥库。\n\
  \n```\nkeytool -exportcert -keystore server.jks -storepass secret -alias servercert\
  \ -rfc -file servercert.pem\nkeytool -import -trustcacerts -file servercert.pem\
  \ -keystore client.jks -storepass secret -keypass secret\n```\n\n在导入未由已知证书颁发机构签名的证书时，系统会询问你是否信任它。回答\
  \ `yes`。\n\n现在启动服务器。你需要指定包含服务器证书的密钥库。\n\n```\njava -Djavax.net.ssl.keyStore=server.jks\
  \ -Djavax.net.ssl.keyStorePassword=secret ssl.EchoServer\n```\n\n然后运行客户端，指定包含客户端所信任证书的密钥库。如果证书是由\
  \ JDK 已知的证书颁发机构签名的，这一步是不需要的。\n\n```\njava -Djavax.net.ssl.trustStore=client.jks\
  \ -Djavax.net.ssl.trustStorePassword=secret ssl.EchoClient\n```\n\n如果出现连接问题，请尝试使用\
  \ `-Djavax.net.debug=ssl` 命令行选项运行客户端。\n\nssl/EchoClient.java\n\n```java\npackage\
  \ ssl;\n\nimport java.io.*;\nimport java.util.*;\n\nimport java.net.*;\nimport javax.net.*;\n\
  import javax.net.ssl.*;\n\n/**\n * 该程序连接到科罗拉州波尔德的原子钟，并打印\n * 服务器发送的时间。\n * @version\
  \ 1.23 2023-08-16\n * @author Cay Horstmann\n */\npublic class EchoClient\n{\n \
  \  public static void main(String[] args) throws IOException\n   {\n      int port\
  \ = args.length >= 1 ? Integer.parseInt(args[0]) : 8189;\n      SocketFactory factory\
  \ = SSLSocketFactory.getDefault();\n      String message = \"\"\"\nHello\nWorld\n\
  BYE\n\"\"\";\n      try (Socket s = factory.createSocket(InetAddress.getLocalHost(),\
  \ port);\n         OutputStream os = s.getOutputStream();\n         var in = new\
  \ Scanner(s.getInputStream()))\n      {\n         os.write(message.getBytes());\n\
  \         os.flush();\n         boolean done = false;\n         while (!done)\n\
  \         {\n            String line = in.nextLine();\n            System.out.println(line);\n\
  \            if (line.equals(\"Echo: BYE\")) done = true;\n         }\n      }\n\
  \   }\n}\n```\n\nssl/EchoServer.java\n\n```java\npackage ssl;\n\nimport java.io.*;\n\
  import java.net.*;\nimport java.util.*;\nimport java.util.concurrent.*;\nimport\
  \ javax.net.*;\nimport javax.net.ssl.*;\n\n/**\n * 该程序实现了一个简单的服务器，监听 8189 端口\n *\
  \ 或作为参数提供的端口，并回显所有客户端输入。\n * @version 1.0 2023-08-16\n * @author Cay Horstmann\n\
  \ */\npublic class EchoServer\n{\n   public static void main(String[] args) throws\
  \ IOException\n   {\n      int port = args.length >= 1 ? Integer.parseInt(args[0])\
  \ : 8189;\n      // 建立服务器 socket\n      ServerSocketFactory factory = SSLServerSocketFactory.getDefault();\n\
  \      try (ServerSocket s = factory.createServerSocket(port))\n      {\n      \
  \   ExecutorService service = Executors.newVirtualThreadPerTaskExecutor();\n\n \
  \        while (true)\n         {\n            // 等待客户端连接\n            Socket incoming\
  \ = s.accept();\n            service.submit(() -> serve(incoming));\n         }\n\
  \      }\n   }\n\n   public static void serve(Socket incoming)\n   {\n      try\
  \ (var in = new Scanner(incoming.getInputStream());         \n         var out =\
  \ new PrintWriter(incoming.getOutputStream(),\n            true /* autoFlush */))\n\
  \      {\n         out.println( \"Hello! Enter BYE to exit.\" );\n\n         //\
  \ 回显客户端输入\n         boolean done = false;\n         while (!done && in.hasNextLine())\n\
  \         {  \n            String line = in.nextLine();            \n          \
  \  out.println(\"Echo: \" + line);            \n            if (line.strip().equals(\"\
  BYE\"))\n               done = true;\n         }\n      }\n      catch (IOException\
  \ e)\n      {  \n         e.printStackTrace();\n      }\n   }\n}\n```\n\n`javax.net.ServerSocketFactory`\
  \ 1.4\n\n* `static ServerSocket createSocket(int port)`\n\n    产生指定端口的服务器 socket。\n\
  \n`javax.net.ssl.SSLServerSocketFactory` 1.4\n\n* `static ServerSocketFactory getDefault()`\n\
  \n    返回一个产生 `SSLServerSocket` 实例的工厂。\n\n`javax.net.ssl.SSLSocketFactory` 1.4\n\n\
  * `static SocketFactory getDefault()`\n\n    返回一个产生 `SSLSocket` 实例的工厂。\n\n`javax.net.SocketFactory`\
  \ 1.4\n\n* `static Socket createSocket(InetAddress host, int port)`\n\n* `static\
  \ Socket createSocket(String host, int port)`\n\n    产生连接指定主机和端口的 socket。\n\n##\
  \ 获取网络数据\n\n要在 Java 程序中访问 Web 服务器，你希望在 socket 连接和 HTTP 请求更高的级别上工作。在后续章节中，我们将讨论 Java\
  \ 库为此目的提供的类。\n\n### URL 和 URI\n\n`java.net` 包在 URL（统一资源定位符）和 URI（统一资源标识符）之间做了有用的区分。\n\
  \nURI 是一个纯语法的构造结构，包含了指定网络资源字符串的各个部分。URL 是 URI 的一种特殊类型，即具有足够的信息来*定位*资源。其他 URI 例如\n\
  \n```\nmailto:cay@horstmann.com\n```\n\n并不是定位符——从该标识符中没有可以定位的数据。这种 URI 被称为 URN（统一资源名称）。\n\
  \n在 Java 库中，`URI` 类没有访问由标识符指定的资源的方法——它的唯一用途是解析。相比之下，`URL` 类可以打开资源的流。由于因此，`URL` 类仅适用于\
  \ Java 库已知如何处理的方案，例如 `http:`、`https:`、`ftp:`、本地文件系统 (`file:`）以及 JAR 文件 (`jar:`)。\n\
  \n你可以从 `URI` 构造 `URL` 对象：\n\n```\nvar url = new URI(urlString).toURL();\n```\n\n\
  \n\n`URL` 类的构造函数在 Java 20 中已被弃用。它们存在各种技术问题，可能导致构造出无效的 URL。相反，应该先构造一个 `URI`，然后如上所示获取\
  \ `URL`。\n\n如果你只是想获取资源的内容，请使用 `URL` 类的 `openStream` 方法。该方法产生一个 `InputStream` 对象。按照通常的方式使用它——例如，构造一个\
  \ `Scanner`：\n\n```\nInputStream inStream = url.openStream();\nvar in = new Scanner(inStream);\n\
  ```\n\n在下一节中，你将看到如何使用 `URLConnection` 类来对连接进行更多的控制。\n\n让我们回到 URI。为了理解为什么解析并非易事，请考虑\
  \ URI 可能有多么复杂。例如，\n\n```\nhttps://google.com?q=Beach+Chalet\nftp://username:password@ftp.yourserver.com/pub/file.txt\n\
  ```\n\nURI 规范规定了这些标识符的组成规则。URI 的语法如下：\n\n```\n[scheme:]schemeSpecificPart[#fragment]\n\
  ```\n\n在这里，括号 `[ ]` 包裹可选部分，而 `:` 和 `#` 则原样包含在标识符中。\n\n如果存在 `scheme:` 部分，该 URI 称为\
  \ `absolute`（绝对）。否则，它被称为 `relative`（相对）。\n\n如果 `schemeSpecificPart` 不以 `/` 开头，则绝对\
  \ URI 是 `opaque`（不透明的），例如\n\n```\nmailto:cay@horstmann.com\n```\n\n所有的绝对不透明 URI\
  \ 和所有的相对 URI 都是 `hierarchical`（分级的）。示例有：\n\n```\nhttp://horstmann.com/index.html\n\
  ../../java/net/Socket.html#Socket()\n```\n\n分级 URI 的 `schemeSpecificPart` 结构为：\n\
  \n```\n[//authority][path][?query]\n```\n\n其中，括号 `[ ]` 再次包裹可选部分。\n\n对于基于服务器的 URI，`authority`\
  \ 部分的形式为：\n\n```\n[user-info@]host[:port]\n```\n\n`port` 必须是一个整数。\n\n标准化 URI 的 RFC\
  \ 2396 还支持一种基于注册表的的机制，其中 `authority` 具有不同的格式，但这并不常见。\n\n`URI` 类的目的之一是解析标识符并将其拆分为各个组件。你可以通过以下方法获取它们：\n\
  \n```\ngetScheme\ngetSchemeSpecificPart\ngetAuthority\ngetUserInfo\ngetHost\ngetPort\n\
  getPath\ngetQuery\ngetFragment\n```\n\n`URI` 类的另一个目的是处理绝对和相对的标识符。如果你有一个绝对 URI，例如\n\
  \n```\nhttps://docs.mycompany.com/api/java/net/ServerSocket.html\n```\n\n以及一个相对\
  \ URI，例如\n\n```\n../../java/net/Socket.html#Socket()\n```\n\n那么你可以将两者合并成一个绝对 URI。\n\
  \n```\nhttps://docs.mycompany.com/api/java/net/Socket.html#Socket()\n```\n\n这个过程被称为相对\
  \ URL 的 `resolving`（解析）。\n\n相反的过程被称为 `relativization`（相对化）。例如，假设你有一个 `base` URI\n\
  \n```\nhttps://docs.mycompany.com/api\n```\n\n以及一个 URI\n\n```\nhttps://docs.mycompany.com/api/java/lang/String.html\n\
  ```\n\n那么相对化后的 URI 是\n\n```\njava/lang/String.html\n```\n\n`URI` 类支持这两种操作：\n\n```\n\
  relative = base.relativize(combined);\ncombined = base.resolve(relative);\n```\n\
  \n### 使用 `URLConnection` 获取信息\n\n如果你想获取有关网络资源的额外信息，应该使用 `URLConnection` 类，它为你提供了比基础\
  \ `URL` 类多多的控制。\n\n在与 `URLConnection` 对象工作时，你必须仔细安排你的步骤。\n\n1.  调用 `URL` 类的 `openConnection`\
  \ 方法来获取 `URLConnection` 对象：\n\n    ```\n    URLConnection connection = url.openConnection();\n\
  \    ```\n\n2.  使用以下方法设置任何请求属性：\n\n    ```\n    setDoInput\nsetDoOutput\nsetIfModifiedSince\n\
  setUseCaches\nsetAllowUserInteraction\nsetRequestProperty\nsetConnectTimeout\nsetReadTimeout\n\
  \    ```\n\n    我们将在本节后面以及 API 注释中讨论这些方法。\n\n3.  通过调用 `connect` 方法连接到远程资源：\n\n \
  \   ```\n    connection.connect();\n    ```\n\n    除了与服务器建立套接连接外，该方法还会查询服务器的头部信息。\n\
  \n4.  连接到服务器后，你可以查询头部信息。两个方法 `getHeaderFieldKey` 和 `getHeaderField` 列出了头部的所有字段。`getHeaderFields`\
  \ 方法获取一个包含头部字段的标准 `Map` 对象。为了方便起见，以下方法查询标准字段：\n\n    ```\n    getContentType\ngetContentLength\n\
  getContentEncoding\ngetDate\ngetExpiration\ngetLastModified\n    ```\n\n5.  最后，你可以访问资源数据。使用\
  \ `getInputStream` 方法获取一个用于读取信息的输入流。（这与 `URL` 类的 `openStream` 方法返回的是同一个输入流。）另一个方法\
  \ `getContent` 在实践中并不好用。`text/plain` 和 `image/gif` 等标准内容类型返回的对象需要 `com.sun` 层次结构中的类进行处理。你可以注册自己的内容处理器，但我们没有在书中讨论这种技术。\n\
  \n一些程序员在使用 `URLConnection` 时会形成错误的心理认知，认为 `getInputStream` 和 `getOutputStream` 方法与\
  \ `Socket` 类的方法相似。但事实并非完全如此。`URLConnection` 类在后台进行了一些魔术——特别是对请求头部的处理。现在让我们详细查看一些\
  \ `URLConnection` 方法。最重要的两个是 `setDoInput` 和 `setDoOutput`。默认情况下，连接产生一个用于从服务器读取的输入流，但没有用于写入的输出流。如果你需要一个输出流（例如为了向服务器发布数据），你需要调用\n\
  \n```\nconnection.setDoOutput(true);\n```\n\n接下来，你可能想要设置一些请求头部。请求头部会随请求一起发送到服务器。这里有一个示例：\n\
  \n```\nGET www.server.com/index.html HTTP/1.0\nReferer: https://somewhere.com/links.html\n\
  Proxy-Connection: Keep-Alive\nUser-Agent: Mozilla/5.0 (X11; U; Linux i686; en-US;\
  \ rv:1.8.1)\nHost: www.server.com\nAccept: text/html, image/gif, image/jpeg, image/png,\
  \ */*\nAccept-Language: en\nAccept-Charset: iso-8859-1,*,utf-8\nCookie: orangemilano=19221887821987\n\
  ```\n\n`setIfModifiedSince` 方法告诉连接你对特定日期之后的数据感兴趣。\n\n最后，你可以使用 `setRequestProperty`\
  \ 方法设置对特定协议意义的键值对。对于 HTTP 请求头部的格式，请参 RFC 2616。这些属性没有良好的文档说明，是在程序员之间口口相传的。例如，如果你想访问一个密码保护的网页，你必须执行以下操作：\n\
  \n1.  将用户名、冒号和密码拼接。\n\n    ```\n    String input = username + \":\" + password;\n\
  \    ```\n\n2.  计算结果字符串的 Base64 编码。（Base64 编码将字节序列编码为可打印 ASCII 字符序列。）\n\n    ```\n\
  \    Base64.Encoder encoder = Base64.getEncoder();\n    String encoding = encoder.encodeToString(input.getBytes());\n\
  \    ```\n\n3.  调用 `setRequestProperty` 方法，名为 `\"Authorization\"`，值为 `\"Basic \"\
  \ + encoding\"。\n\n    ```\n    connection.setRequestProperty(\"Authorization\"\
  , \"Basic \" + encoding);\n    ```\n\n你刚刚看到了如何访问密码保护的网页。要通过 FTP 访问密码保护的文件，请使用完全不同的方法：构造一个如下形式的\
  \ URL\n\n```\nftp://username:password@ftp.yourserver.com/pub/file.txt\n```\n\n\n\
  \n\n一旦你调用了 `connect()` 方法，就可以查询响应头信息了。首先，让我们看看如何枚举所有的响应头字段。该类的实现者认为有必要通过引入另一种迭代协议来表达他们的个性化。通过调用\n\
  \n```\nString key = connection.getHeaderFieldKey(n);\n```\n\n可以获取响应头中的第 `n` 个键名，其中\
  \ `n` 从 `1` 开始！如果 `n` 小于 `1` 或大于头字段字段总数，则返回 `null`。并没有方法可以返回返回字段的数量；你只需要不断调用 `getHeaderFieldKey`\
  \ 直到获取 `null` 为止。同样，调用\n\n```\nString value = connection.getHeaderField(n);\n```\n\
  \n会返回第 `n` 个值。\n\n方法 `getHeaderFields()` 返回的是一个包含所有响应头字段的 `Map`。\n\n```\nMap<String,List<String>>\
  \ headerFields = connection.getHeaderFields();\n```\n\n以下是一个典型 HTTP 请求的响应头字段集：\n\
  \n```\nDate: Wed, 27 Aug 2008 00:15:48 GMT\nServer: Apache/2.2.2 (Unix)\nLast-Modified:\
  \ Sun, 22 Jun 2008 20:53:38 GMT\nAccept-Ranges: bytes\nContent-Length: 4813\nConnection:\
  \ close\nContent-Type: text/html\n```\n\n尽管 `connection.getHeaderFieldKey(0)` 返回\
  \ `null`，但你仍然可以调用 `connection.getHeaderField(0)` 来获取响应状态行（例如 `\"HTTP/1.1 200 OK\"\
  `）。当你调用 `headerFields.get(null)` 时也能获取它。\n\n为了方便起见，有六个方法可以查询最常见的头类型的值，并在适当时将其转换为数值类型。表\
  \ 4.1 展示了这些便利方法。返回类型为 `long` 的方法返回自 GMT 1970 年 1 月 1 日以来的秒数。\n\n### 响应头值的便利方法\n\n\
  | 键名名称 | 方法名 | 返回类型 |\n| --- | --- | --- |\n| `Date` | `getDate` | `long` |\n| `Expires`\
  \ | `getExpiration` | `long` |\n| `Last-Modified` | `getLastModified` | `long` |\n\
  | `Content-Length` | `getContentLength` | `int` |\n| `Content-Type` | `getContentType`\
  \ | `String` |\n| `Content-Encoding` | `getContentEncoding` | `String` |\n\n示例 4.8\
  \ 中的程序允许你对 URL 连接进行实验。运行程序时，在命令行中提供 URL 以及可选的用户名和密码，例如：\n\n```\njava urlConnection.URLConnectionTest\
  \ https://horstmann.com/corejava/secret user password\n```\n\n该程序将打印：\n\n* 头所有的键和值\n\
  * 表 4.1 中六个便利方法的返回值\n* 请求资源的前十行内容\n\nurlConnection/URLConnectionTest.java\n\n```java\n\
  package urlConnection;\n\nimport java.io.*;\nimport java.net.*;\nimport java.util.*;\n\
  \n/**\n * 此程序连接到 URL 并显示响应头数据以及请求数据的\n * 前 10 行。\n * \n * 在命令行中提供 URL 以及可选的用户名和密码（用于\
  \ HTTP 基础认证）。\n * @version 1.13 2023-08-16\n * @author Cay Horstmann\n */\npublic\
  \ class URLConnectionTest\n{\n   public static void main(String[] args)\n   {\n\
  \      try\n      {\n         String urlName;\n         if (args.length > 0) urlName\
  \ = args[0];\n         else urlName = \"http://horstmann.com\";\n\n         var\
  \ url = new URI(urlName).toURL();\n         URLConnection connection = url.openConnection();\n\
  \n         // 如果命令行指定了则设置用户名、密码\n\n         if (args.length > 2)\n         {\n \
  \           String username = args[1];\n            String password = args[2];\n\
  \            String input = username + \":\" + password;\n            Base64.Encoder\
  \ encoder = Base64.getEncoder();\n            String encoding = encoder.encodeToString(input.getBytes());\n\
  \            connection.setRequestProperty(\"Authorization\", \"Basic \" + encoding);\n\
  \         }\n\n         connection.connect();\n\n         // 打印头字段\n\n         Map<String,\
  \ List<String>> headers = connection.getHeaderFields();\n         for (Map.Entry<String,\
  \ List<String>> entry : headers.entrySet())\n         {\n            String key\
  \ = entry.getKey();\n            for (String value : entry.getValue())\n       \
  \        System.out.println(key + \": \" + value);\n         }\n\n         // 打印便利函数\n\
  \n         System.out.println(\"----------\");\n         System.out.println(\"getContentType:\
  \ \" + connection.getContentType());\n         System.out.println(\"getContentLength:\
  \ \" + connection.getContentLength());\n         System.out.println(\"getContentEncoding:\
  \ \" + connection.getContentEncoding());\n         System.out.println(\"getDate:\
  \ \" + connection.getDate());\n         System.out.println(\"getExpiration: \" +\
  \ connection.getExpiration());\n         System.out.println(\"getLastModifed: \"\
  \ + connection.getLastModified());\n         System.out.println(\"----------\");\n\
  \n         String encoding = connection.getContentEncoding();\n      }\n      catch\
  \ (IOException | URISyntaxException e)\n      {\n         e.printStackTrace();\n\
  \      }\n   }\n}\n```\n\n\n\n\n\n* `long getExpiration()`\n* `long getLastModifed()`\n\
  \  获取资源的创建、过期和最后修改日期。这些日期表示自格林尼治时间 1970 年 1 月 1 日午夜起的秒数。\n* `InputStream getInputStream()`\n\
  * `OutputStream getOutputStream()`\n  返回一个用于从资源读取或写入资源的流。\n* `Object getContent()`\n\
  \  选择适当的内容处理器来读取资源数据并转换为对象。除非你安装了自定义的内容处理器，否则此方法对于读取 `text/plain` 或 `image/gif`\
  \ 等标准类型没有用。\n\n### 提交表单数据\n\n在前面的章节中，你已经了解了如何从 Web 服务器读取数据。现在，我们将向你展示你的程序如何将数据发送回\
  \ Web 服务器，以及发送给 Web 服务器调用的程序。\n\n要从 浏览器向 Web 服务器发送信息，用户需要填写一个 `form`，如图 4.6 所示。\n\
  \n![Figure](img/webform.jpg)HTML 表单\n\n当用户点击提交（Submit）按钮时，文本字段中的文本以及任何复选框、单选按钮和其他输入元素的设置将输发送回\
  \ Web 服务器。Web 服务器会调用一个处理用户输入的程序。\n\n许多技术允许 Web 服务器调用程序。其中最著名的包括 Java servlets、JavaServer\
  \ Faces、Microsoft Active Server Pages (ASP) 和通用网关接口 (CGI) 脚本。\n\n服务器端程序处理表单数据并生成另一个\
  \ HTML 页面，Web 服务器将该页面发送回浏览器。这一序列如图 4.7 所示。响应页面可以包含新信息（例如在信息搜索程序中），也可以仅作为确认。Web 浏览器随后会显示响应页面。\n\
  \n![Figure](img/fig03-10.jpg)服务端程序执行期间的数据流\n\n我们在书中并不讨论服务器端程序的实现。我们的兴趣仅仅在于编写与现有服务器端程序进行交互的客户端程序。\n\
  \n当表单数据发送到 Web 服务器时，数据是由 servlet、CGI 脚本还是其他服务器端技术解释的并不重要。客户端以标准格式将数据发送到 Web 服务器，由\
  \ Web 服务器负责将其传递给生成响应的程序。\n\n通常使用两个名为 `GET` 和 `POST` 的命令向 Web 服务器发送信息。\n\n在 `GET`\
  \ 命令中，你只需将查询参数附加到 URL 的末尾即可。URL 的格式如下：\n\n```\nhttps://host/path?query\n```\n\n\
  每个参数的格式为 `name=value`。参数之间通过 `&` 字符分隔。参数值使用 `URL encoding` 方案编码，遵循以下规则：\n\n* 保持字符\
  \ `A` 到 `Z`、`a` 到 `z`、`0` 到 `9` 以及 `. - ~ _` 不变。\n* 将所有空格替换为 `+` 字符。\n* 将所有其他字符编码为\
  \ UTF-8，并使用 `%` 后面跟两个数字十六进制数对每个字节进行编码。\n\n例如，为了传输 *San Francisco, CA*，你使用 `San+Francisco%2c+CA`，因为十六进制数\
  \ `2c` 是字符 `','` 的 UTF-8 编码。\n\n这种编码可以防止任何中间程序破坏空格和其他特殊字符。\n\n在编写本文时，Google Maps\
  \ 网站 ([`www.google.com/maps`](https://www.google.com/maps)) 接收名称为 `q` 和 `hl` 的查询参数，其值是位置查询和响应的人类语言。要获取旧金山\
  \ 1 Market Street 的地图并使用德语响应，请使用以下 URL：\n\n```\nhttps://www.google.com/maps?q=1+Market+Street+San+Francisco&hl=de\n\
  ```\n\n非常长的查询字符串在浏览器中可能并不好看，而且旧版本的浏览器和代理对 `GET` 请求中包含的字符数有限。因此，对于包含大量数据的表单，通常使用\
  \ `POST` 请求。在 `POST` 请求中，你不需要将参数附加到 URL；而是从 `URLConnection` 获取一个输出流，并将键值对写入该输出流。你仍然需要对值进行\
  \ URL 编码并用 `&` 字符分隔它们。\n\n让我们详细查看此过程。要向服务器端程序发布数据，首先建立一个 `URLConnection`：\n\n```\n\
  URL url = new URI(\"https://host/path\").toURL();\nURLConnection connection = url.openConnection();\n\
  ```\n\n然后，调用 `setDoOutput` 方法为输出设置连接：\n\n```\nconnection.setDoOutput(true);\n```\n\
  \n接下来，调用 `getOutputStream` 获取一个可以通过它向服务器发送数据的流。如果你正在向服务器发送文本，将该流封装进 `PrintWriter`\
  \ 是很方便的。\n\n```\nvar out = new PrintWriter(connection.getOutputStream());\n```\n\
  \n现在你已经准备好向服务器发送数据了：\n\n```\nout.print(name1 + \"=\" + URLEncoder.encode(value1,\
  \ StandardCharsets.UTF_8) + \"&\");\nout.print(name2 + \"=\" + URLEncoder.encode(value2,\
  \ StandardCharsets.UTF_8));\n```\n\n关闭输出流：\n\n```\nout.close();\n```\n\n最后，调用 `getInputStream`\
  \ 并读取服务器响应。\n\n静态方法 `URLEncoder.encode` 和 `URLDecoder.decode` 有默认字符集，但它们在 Java 6\
  \ 中已被弃用，因为它们应该始终与 UTF-8 使用。\n\n静态方法 `URLEncoder.encode` 和 `URLDecoder.decode` 有默认字符集，但它们在\
  \ Java 6 中已被弃用，因为它们应该始终与 UTF-8 使用。\n\n\n\n\n当从写入切换到读取响应的任何部分时，会与服务器发生实际交互。`Content-Length`\
  \ 头部被设置为输出的大小。`Content-Type` 头部被设置为 `application/x-www-form-urlencoded`，除非指定了不同的内容类型。头部和数据被发送到服务器。然后读取响应头部和服务器响应，并可以进行查询。在我们的示例程序中，这种切换发生在对`connection.getContentEncoding()`的调用。\n\
  \n读取响应时有一个特殊。如果发生服务器端错误，调用 `connection.getInputStream()` 将抛出 `FileNotFoundException`。然而，服务器仍然会向浏览器发送错误页面（例如随常见的“Error\
  \ 404—page not found”）。要捕获此错误页面，请调用 `getErrorStream` 方法：\n\n```\nInputStream err\
  \ = connection.getErrorStream();\n```\n\n`getErrorStream` 方法以及此程序中的其他几个方法属于 `URLConnection`\
  \ 的子类 `HttpURLConnection`。如果你向以 `http://` 或 `https://` 开头的 URL 发起请求，可以将生成的连接对象强制转换为\
  \ `HttpURLConnection`。\n\n当你向服务器发送 `POST` 数据时，服务器端程序可能会响应一个重定向：一个为了获取实际信息应该调用的不同\
  \ URL。服务器这样做可能是因为信息可用其他地方，或者为了提供一个可以书签的 URL。`HttpURLConnection` 类在大多数情况下可以处理重定向。\n\
  \n如果重定向需要从一个站点发送 cookie 到另一个，可以这样配置全局 cookie 处理器：\n\n```\nCookieHandler.setDefault(new\
  \ CookieManager(null, CookiePolicy.ACCEPT_ALL));\n```\n\n然后 cookie 将被正确包含在重定向中。\n\
  \n尽管重定向通常会自动处理，但在某些情况下你需要手动执行。出于安全原因，不支持 HTTP 和 HTTPS 之间的自动重定向。重定向也因为更微妙的原因而失败。例如，早期版本的邮政服务使用了重定向。记得我们设置了\
  \ `User-Agent` 请求参数，以便邮局不会认为我们通过 Java API 发起了请求。虽然可以在初始请求中将用户代理设置为不同的字符串，该设置在自动重定向中不会使用。相反，自动重定向始终发送一个包含\
  \ `Java` 字样的通用用户代理字符串。\n\n在这种情况下，你可以手动执行重定向。在连接服务器之前，关闭自动重定向：\n\n```\nconnection.setInstanceFollowRedirects(false);\n\
  ```\n\n发送请求后，获取响应码：\n\n```\nint responseCode = connection.getResponseCode();\n```\n\
  \n检查它是否为之一：\n\n```\nHttpURLConnection.HTTP_MOVED_PERM \nHttpURLConnection.HTTP_MOVED_TEMP\n\
  HttpURLConnection.HTTP_SEE_OTHER\n```\n\n在这种情况下，获取 `Location` 响应头部以获得重定向的 URL。然后断开并向新\
  \ URL 建立连接：\n\n```\nString location = connection.getHeaderField(\"Location\");\n\
  if (location != null)\n{\n   URL base = connection.getURL();\n   connection.disconnect();\n\
  \   URL url = base.toURI().resolve(location).toURL();\n   connection = (HttpURLConnection)\
  \ url.openConnection();\n   . . .\n}\n```\n\n此程序演示的技术在任何需要从现有网站查询信息时都非常有用。只需找到你需要发送的参数，然后从回复中剥离\
  \ HTML 标签和其他不需要的信息即可。\n\n`post/PostTest.java`\n\n```java\npackage post;\n\nimport\
  \ java.io.*;\nimport java.net.*;\nimport java.nio.charset.*;\nimport java.nio.file.*;\n\
  import java.util.*;\n\n/**\n * 此程序演示了如何使用 URLConnection 类进行 POST 请求。\n * @version\
  \ 1.44 2023-08-16\n * @author Cay Horstmann\n */\npublic class PostTest\n{\n   public\
  \ static void main(String[] args) throws IOException, URISyntaxException\n   {\n\
  \      String propsFilename = args.length > 0 ? args[0] : \"post/post.properties\"\
  ; \n      var props = new Properties();\n      try (Reader in = Files.newBufferedReader(\n\
  \            Path.of(propsFilename)))\n      {\n         props.load(in);\n     \
  \ }\n      String urlString = props.remove(\"url\").toString();\n      Object userAgent\
  \ = props.remove(\"User-Agent\");\n      Object redirects = props.remove(\"redirects\"\
  );\n      CookieHandler.setDefault(new CookieManager(null, CookiePolicy.ACCEPT_ALL));\n\
  \      String result = doPost(new URI(urlString).toURL(), props, \n         userAgent\
  \ == null ? null : userAgent.toString(), \n         redirects == null ? -1 : Integer.parseInt(redirects.toString()));\n\
  \      System.out.println(result);\n   }   \n\n   /**\n    * 执行一个 HTTP POST。\n \
  \   * @param url 要发送 POST 的 URL\n    * @param nameValuePairs 查询参数\n    * @param\
  \ userAgent 要使用的用户代理，或为 null 使用默认用户代理\n    * @param redirects 要手动跟随的重定向数量，或 -1 表示自动重定向\n\
  \    * @return 从服务器返回的数据\n    * @throws URISyntaxException \n     */\n   public\
  \ static String doPost(URL url, Map<Object, Object> nameValuePairs, String userAgent,\
  \ \n         int redirects) throws IOException, URISyntaxException\n   {       \
  \ \n      var connection = (HttpURLConnection) url.openConnection();\n      if (userAgent\
  \ != null)\n         connection.setRequestProperty(\"User-Agent\", userAgent);\n\
  \n      if (redirects >= 0)\n         connection.setInstanceFollowRedirects(false);\n\
  \n      connection.setDoOutput(true);\n\n      try (var out = new PrintWriter(connection.getOutputStream()))\n\
  \      {\n         boolean first = true;\n         for (Map.Entry<Object, Object>\
  \ pair : nameValuePairs.entrySet())\n         {\n            if (first) first =\
  \ false;\n            else out.print(\"&\");\n            String name = pair.getKey().toString();\n\
  \            String value = pair.getValue().toString();\n            out.print(name);\n\
  \            out.print(\"=\");\n            out.print(URLEncoder.encode(value, StandardCharsets.UTF_8));\n\
  \         }\n      }      \n      String encoding = connection.getContentEncoding();\n\
  \      if (encoding == null) encoding = \"UTF-8\";\n\n      if (redirects > 0)\n\
  \      {\n         int responseCode = connection.getResponseCode();\n         if\
  \ (responseCode == HttpURLConnection.HTTP_MOVED_PERM \n               || responseCode\
  \ == HttpURLConnection.HTTP_MOVED_TEMP\n               || responseCode == HttpURLConnection.HTTP_SEE_OTHER)\
  \ \n         {\n            String location = connection.getHeaderField(\"Location\"\
  );\n            if (location != null)\n            {\n               URL base =\
  \ connection.getURL();\n               connection.disconnect();\n              \
  \ return doPost(base.toURI().resolve(location).toURL(), nameValuePairs, userAgent,\
  \ \n                             redirects - 1);\n            }\n         }\n  \
  \    }\n      else if (redirects == 0)\n      {\n         throw new IOException(\"\
  Too many redirects\");\n      }\n\n      var response = new StringBuilder();\n \
  \     try (var in = new Scanner(connection.getInputStream(), encoding))\n      {\n\
  \         while (in.hasNextLine())\n         {\n            response.append(in.nextLine());\n\
  \            response.append(\"\\n\");\n         }         \n      }\n      catch\
  \ (IOException e)\n      {\n         InputStream err = connection.getErrorStream();\n\
  \         if (err == null) throw e;\n         try (var in = new Scanner(err))\n\
  \         {\n            response.append(in.nextLine());\n            response.append(\"\
  \\n\");\n         }\n      }\n\n      return response.toString();\n   }\n}\n```\n\
  \n`java.net.HttpURLConnection` 1.0\n\n*   `InputStream getErrorStream()`\n\n   \
  \ 返回一个可以读取服务器错误消息的流。\n\n`java.net.URLEncoder` 1.0\n\n*   `static String encode(String\
  \ s, String encoding)` 1.4\n\n\n\n\n\n使用给定的字符编码方案返回字符串 `s` 的 URL 编码形式。（推荐的方案是 `\"\
  UTF-8\"`。）在 URL 编码中，字符 `A`–`Z`、`a`–`z`、`0`–`9`、`- _ . ~` 保持不变。空格被编码为 `+`，所有其他字符均被编码为形式如\
  \ `%XY` 的编码字节序列，其中 `0xXY` 是该字节的十六进制值。\n\n`java.net.URLDecoder` 1.2\n\n- `static\
  \ string decode(String s, String encoding)` 1.4\n  根据给定的字符编码方案返回 URL 编码字符串 `s` 的解码结果。\n\
  \n# HTTP 客户端\n\n`URLConnection` 类在 HTTP 成为 Web 通用协议之前的设计。它提供了许多协议的支持，但对 HTTP 的支持相当繁琐。在决定支持\
  \ HTTP/2 时，很显然提供一个现代的客户端接口比重构现有的 API 更好。`HttpClient` 提供了 HTTP/2 支持，比具有那套相当繁琐阶段的\
  \ `URLConnection` 类更方便的 API。\n\n## `HttpClient` 类\n\n一个 `HttpClient` 可以发送请求并接收响应。你可以通过调用来获取客户端：\n\
  \n```\nHttpClient client = HttpClient.newHttpClient()\n```\n\n或者，如果你需要配置客户端，可以使用构建器\
  \ API，如下：\n\n```\nHttpClient client = HttpClient.newBuilder()\n   .followRedirects(HttpClient.Redirect.ALWAYS)\n\
  \   .build();\n```\n\n也就是说，你获取一个构建器，调用方法来自定义即将构建的条目，然后调用 `build` 方法来完成构建过程。这是构造不可变对象的常用模式。\n\
  \n在选择 HTTP 2 以及控制 Cookie、SSL、代理设置和身份验证方面，有许多高级选项可用。\n\n`HttpClient` 是可关闭的（autocloseable），因此你可以在\
  \ `try`-`with-resources` 语句中声明它。它的 `close` 方法会等待提交的请求完成，然后关闭其连接池。\n\n## `HttpRequest`\
  \ 类和主体发布者 (Body Publishers)\n\n在制定请求时也遵循构建器模式。这里有一个 `GET` 请求：\n\n```\nHttpRequest\
  \ request = HttpRequest.newBuilder()\n   .uri(new URI(urlString))\n   .GET()\n \
  \  .build();\n```\n\nURI 是“统一资源标识符”，在用 HTTP 时，它与 URL 相同。然而，在 Java 中，`URL` 类拥有用于实际打开\
  \ URL 连接的方法，而 `URI` 类只关注语法（方案、主机、端口、路径、查询、片段等）。\n\n对于 `POST` 请求，你需要一个“主体发布者”（body\
  \ publisher）将请求数据转换为正在发布的数据。有针对字符串、字节数组和文件的主体发布者。例如，如果你的请求是 JSON 格式，只需将 JSON 字符串提供给字符串主体发布者。\n\
  \n```\nHttpRequest request = HttpRequest.newBuilder()\n   .uri(new URI(urlString))\n\
  \   .header(\"Content-Type\", \"application/json\")\n   .POST(HttpRequest.BodyPublishers.ofString(jsonString))\n\
  \   .build();\n```\n\n遗憾的是，该 API 不支持常见内容类型所需的格式化。代码列表 4.10 中的示例程序提供了表单数据和文件上传的主体发布者。\n\
  \n在那个程序中，你可以看到如何使用主体发布者发送字符串和文件。文件上传需要同时使用两者，采用 `BodyPublishers.concat` 方法连接多个主体发布者以产生请求主体。\n\
  \n`HttpRequest.Builder` 类也拥有针对不常用的 `PUT`、`DELETE` 和 `HEAD` 请求的构建方法。\n\nJava 16 增加了一个用于过滤现有\
  \ `HttpRequest` 头部构建器。你提供请求和一个接收头部名称和值的函数，该函数对于那些应该保留的头部返回 `true`。例如，在这里我们修改了内容类型：\n\
  \n```\nHttpRequest request2 = HttpRequest.newBuilder(request,\n      (name, value)\
  \ -> !name.equalsIgnoreCase(\"Content-Type\")) // 旧的内容类型\n   .header(\"Content-Type\"\
  , \"application/xml\") // 添加新的内容类型\n   .build();\n```\n\n## `HttpResponse` 接口和主体处理器\
  \ (Body Handlers)\n\n发送请求时，你必须告诉客户端如何处理响应。如果你只需要获取字符串形式的主体，可以使用 `HttpResponse.BodyHandlers.ofString()`\
  \ 发送请求，如下：\n\n```\nHttpResponse<String> response = client.send(request, HttpResponse.BodyHandlers.ofString());\n\
  ```\n\n`HttpResponse` 是一个泛型接口，其类型参数表示响应主体的类型。你可以简单地获取响应主体字符串：\n\n```\nString bodyString\
  \ = response.body();\n```\n\n还有其他响应主体处理器可以将响应获取为字节数组或输入流。`BodyHandlers.ofFile(filePath)`\
  \ 生成一个将响应保存到给定文件的处理器，而 `BodyHandlers.ofFileDownload(directoryPath)` 使用 `Content-Disposition`\
  \ 头部中的文件名将响应保存到给定目录中。最后，从 `BodyHandlers.discarding()` 获取的处理器直接丢弃响应。\n\n处理响应的内容不被视为\
  \ API 的。例如，如果你接收到 JSON 数据，你需要一个 JSON 库来解析内容。\n\n`HttpResponse` 对象还产生状态码和响应头部。\n\n\
  ```\nint status = response.statusCode();\nHttpHeaders responseHeaders = response.headers();\n\
  ```\n\n你可以将 `HttpHeaders` 对象转换为 map：\n\n```\nMap<String, List<String>> headerMap\
  \ = responseHeaders.map();\n```\n\nmap 的值是列表，因为在 HTTP 中，每个键可以有多个值。\n\n如果你只需要特定键的值，并且知道不会有多个值，请调用\
  \ `firstValue` 方法：\n\n```\nOptional<String> lastModified = responseHeaders.firstValue(\"\
  Last-Modified\");\n```\n\n你获取响应值，或者在未提供值时获取一个空的可选。\n\n`HttpHeaders` 类感知到 HTTP 参数的键是不区分大小写的。\n\
  \n## 异步处理\n\n你可以异步处理响应。在构建客户端时，提供一个执行器：\n\n```\nExecutorService executor = Executors.newCachedThreadPool();\n\
  HttpClient client = HttpClient.newBuilder().executor(executor).build();\n```\n\n\
  构建一个请求然后在客户端上调用 `sendAsync` 方法。你接收到一个 `CompletableFuture<HttpResponse<T>>`，其中 `T`\
  \ 是主体处理器的类型。按照第一卷第 10 章 中的描述使用 `CompletableFuture` API：\n\n```\nHttpRequest request\
  \ = HttpRequest.newBuilder().uri(uri).GET().build();\nclient.sendAsync(request,\
  \ HttpResponse.BodyHandlers.ofString())\n   thenAccept(response -> . . .);\n```\n\
  \n要启用 `HttpClient` 的日志，请在 JDK 的 `net.properties` 中添加此行：\n\n```\njdk.httpclient.HttpClient.log=all\n\
  ```\n\n除了 `all` 之外，你可以指定事件类型的逗号分隔列表：\n\n*   `channel`\n\n*   `content`\n\n*   `errors`\n\
  \n*   `frames`，可选后跟一个或多个 `:control`、`:data` `:window` 或 `:all`\n\n*   `headers`\n\
  \n*   `requests`\n\n*   `ssl`\n\n*   `trace`\n\n不要使用任何空格：\n\n```\njdk.httpclient.HttpClient.log=headers,requests,frames:control:data\n\
  ```\n\n然后，将名为 `jdk.httpclient.HttpClient` 的日志器级别设置为 `INFO`，例如通过在 JDK 的 `logging.properties`\
  \ 文件中添加此行：\n\n```\njdk.httpclient.HttpClient.level=INFO\n```\n\n代码列表 4.10 中的程序展示了如何向不同服务发送同步请求。如下运行它：\n\
  \n```\njava httpClient.HttpClientTest form.properties\njava httpClient.HttpClientTest\
  \ fileupload.properties\njava httpClient.HttpClientTest json.properties\n```\n\n\
  \n\n\n\n每次运行时，都会向 CodeCheck 服务发送一个“Hello, World”程序，并显示其运行结果。该服务可以接受表单提交、文件上传和 JSON\
  \ POST 请求。请注意来自 `HttpClient` 的日志输出。\n\n`httpClient/HttpClientTest.java`\n\n```java\n\
