  \   }\n\n   /**\n    * 枚举此对象描述的路径下的所有注册表项名称。\n    * @return 列出所有项名称的枚举器\n    */\n\
  \   public Enumeration<String> names()\n   {\n      return new Win32RegKeyNameEnumeration(root,\
  \ path);\n   }\n\n   static\n   {\n      System.loadLibrary(\"Win32RegKey\");\n\
