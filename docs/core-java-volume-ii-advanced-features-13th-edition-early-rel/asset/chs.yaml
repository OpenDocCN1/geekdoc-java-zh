  \n在前面的节中，你已经看到了如何按国家收集语言。但那个过程有点繁琐。你必须为每个 map 生成单个集合并指定如何合并现有值。对相同键的值分组非常常见，因此分组直接支持这一点。让我们看看按国家分组\
  \ locale 的。首先，形成这个 map：\n\n```java\nMap<String, List<Locale>> countryToales = Locale.availableLocales().collect(\n\
  \   Collectors.groupingBy(Locale::getCountry));\n```\n\n`Locale::getCountry` 就是分类。现在你可以根据国家代码查找所有的\
  \ locale，例如\n\n```java\nList<Locale> swissLocales = countryToales.get(\"CH\");\n\
  // 返回 de_CH, fr_CH, it_CH 以及可能更多\n```\n\n快速复习 locale：每个 locale 有一个语言代码（例如英语的 `en`）和一个国家代码（例如美国的\
  \ `US`）。locale `en_US` 描述美国的英语，而 `en_IE` 是爱尔兰的英语。有些国家有多个 locale。例如，`ga_IE` 是爱尔兰的盖尔语，而且正如前面的示例所示，JDK\
  \ 知道瑞士至少三个 locale。\n\n当分类函数是一个谓词函数（即返回 `boolean` 值的函数）时，流元素会被分区为两个列表：函数返回 `true`\
  \ 的元素和它们的补集。在这种情况下，使用 `partitioningBy` 而不是 `groupingBy` 效率更高。例如，这里我们将所有 locale 分为使用英语的和其他其他的：\n\
  \n```java\nMap<Boolean, List<Locale>> englishAndOtherLocales = Locale.availableLocales().collect(\n\
  \   Collectors.partitioningBy(l -> l.getLanguage().equals(\"en\")));\nList<Locale>\
  \ englishLocales = englishAndOtherLocales.get(true);\n```\n\n如果你调用 `groupingByConcurrent`\
  \ 方法，你会得到一个并发 map，它在与并行流配合时是并发填充的。这与 `toConcurrentMap` 方法完全对应。\n\n\n\n\n\n* `static\
  \ <T> Collector<T,?,Map<Boolean,List<T>>> partitioningBy(Predicate<? super T> predicate)`\n\
  \n产生一个收集器，其产生的 map 键为 `true`/`false`，值为符合/不符合谓词的元素列表。\n\n## 下游收集器 (Downstream Collectors)\n\
  \n`groupingBy` 方法产生一个值为列表的 map。如果你想以某种方式处理这些列表，可以提供一个“下游收集器”（downstream collector）。例如，如果你想要集合而不是列表，可以使用你在上一节中看到的\
  \ `Collectors.toSet` 收集器：\n\n```\nMap<String, Set<Locale>> countryToLocaleSet =\
  \ Locale.availableLocales().collect(\n   groupingBy(Locale::getCountry, toSet()));\n\
  ```\n\n在这个示例中，以及本节剩余的示例中，我假设静态导入了 `java.util.stream.Collectors.*` 以使表达式更易读。\n\n\
  你也可以连续两次 `groupingBy`：\n\n```\nMap<String, Map<String, List<Locale>>> countryAndLanguageToLocale\
  \ =\n   Locale.availableLocales().collect(\n      groupingBy(Locale::getCountry,\n\
  \         groupingBy(Locale::getLanguage)));\n```\n\n然后 `countryAndLanguageToLocale.get(\"\
  IN\").get(\"hi\")` 是印度印地语 locale 的列表。（有几种变体。）\n\n还提供了几个收集器用于将收集到的元素归纳为数字：\n\n* `counting`\
  \ 产生收集到的元素的计数。例如，\n\n```\nMap<String, Long> countryToLocaleCounts = Locale.availableLocales().collect(\n\
  \   groupingBy(Locale::getCountry, counting()));\n```\n\n统计每个国家有多少个 locale。\n\n\
  * `summing(`Int`|`Long`|`Double`)` 和 `averaging(`Int`|`Long`|`Double`)` 将提供的函数应用于下游元素，并产生函数结果的总和或平均值。例如，\n\
  \n```\npublic record City(String name, String state, int population) {}\n. . .\n\
  Map<String, Integer> stateToCityPopulation = cities.collect(\n   groupingBy(City::state,\
  \ averagingInt(City::population)));\n```\n\n计算城市流中每个州的平均人口。\n\n* `maxBy` 和 `minBy`\
  \ 接收一个比较器并产生下游元素的最大值和最小值。例如，\n\n```\nMap<String, Optional<City>> stateToLargestCity\
  \ = cities.collect(\n   groupingBy(City::state,\n          maxBy(Comparator.comparing(City::population))));\n\
  ```\n\n产生每个州最大的城市。\n\n`collectingAndThen` 收集器在收集器之后添加了一个最终处理步骤。例如，如果你想知道有多少个不同的结果，可以先将它们收集到集合中，然后计算大小：\n\
  \n```\nMap<Character, Integer> stringCountsByStartingLetter = strings.collect(\n\
  \   groupingBy(s -> s.charAt(0),\n      collectingAndThen(toSet(), Set::size));\n\
  ```\n\n`mapping` 收集器的作用恰相反。它对每个收集到的元素应用函数并将结果传递给下游收集器。\n\n```\nMap<Character, Set<Integer>>\
  \ stringLengthsByStartingLetter = strings.collect(\n   groupingBy(s -> s.charAt(0),\n\
  \      mapping(String::length, toSet())));\n```\n\n在这里，我们根据字符串的首字母字符进行分组。在每个组内，我们产生长度并将它们收集到集合中。\n\
  \n`mapping` 方法还为上一节中的问题提供了一个更的解决方案——收集一个国家所有语言的集合。\n\n```\nMap<String, Set<String>>\
  \ countryToLanguages = Locale.availableLocales().collect(\n   groupingBy(Locale::getDisplayCountry,\n\
  \      mapping(Locale::getDisplayLanguage,\n         toSet())));\n```\n\n还有一个 `flatMapping`\
  \ 方法，用于返回流的函数。\n\n如果分组或映射函数的返回类型为 `int`、`long` 或 `double`，你可以将元素收集到摘要统计对象中，如第 1.8\
  \ 节所示。例如，\n\n```\nMap<String, IntSummaryStatistics> stateToCityPopulationSummary\
  \ = cities.collect(\n   groupingBy(City::state,\n      summarizingInt(City::population)));\n\
  ```\n\n然后你可以从每个组的摘要统计对象获取函数值的和、计数、平均值、最小值和最大值。\n\n`filtering` 收集器对每个组应用过滤器，例如：\n\
  \n```\nMap<String, Set<City>> largeCitiesByState\n   = cities.collect(\n      groupingBy(City::state,\n\
  \         filtering(c -> c.population() > 500000,\n            toSet())); // 没有大城市的州拥有空集合\n\
  ```\n\n最后，你可以使用 `teeing` 收集器分支到两个下游收集。每当你需要从流中计算多个结果时，这非常有用。假设你想收集城市名称并同时计算它们的平均人口。你无法读取两次流，但\
  \ `teeing` 允许你执行两次计算。指定两个下游收集器和一个合并结果的函数。\n\n```\nrecord Pair<S, T>(S first, T second)\
  \ {}\nPair<List<String>, Double> result = cities.filter(c -> c.state().equals(\"\
  NV\"))\n   .collect(teeing(\n      mapping(City::name, toList()), // 第一个下游收集器\n\
  \      averagingDouble(City::population), // 第二个下游收集器\n      (list, avg) -> new\
  \ Pair(list, avg))); // 合并函数\n```\n\n三个三个 `reducing` 方法用于通用归约，如下一节所述。\n\n组合收集器是非常强大的，但可能会导致非常复杂的表达式。最佳用法是结合\
  \ `groupingBy` 或 `partitioningBy` 来处理“下游”map 值。否则，请直接在流上应用 `map`、`reduce`、`count`、`max`\
  \ 或 `min` 等方法。\n\nListing 1.6 中的示例程序演示了下游收集器。\n\ncollecting/DownstreamCollectors.java\n\
  \n\n\n\n```java\npackage collecting;\n\nimport static java.util.stream.Collectors.*;\n\
  \nimport java.io.*;\nimport java.nio.file.*;\nimport java.util.*;\nimport java.util.stream.*;\n\
  \n/**\n * @version 1.02 2023-10-19\n * @author Cay Horstmann\n */\npublic class\
  \ DownstreamCollectors\n{\n   public record City(String name, String state, int\
  \ population) {}\n\n   public static Stream<City> readCities(String filename) throws\
  \ IOException\n   {\n      return Files.lines(Path.of(filename))\n         .map(l\
  \ -> l.split(\", \"))\n         .map(a -> new City(a[0], a[1], Integer.parseInt(a[2])));\n\
  \   }\n\n   public static void main(String[] args) throws IOException\n   {\n  \
  \    Map<String, Set<Locale>> countryToLocaleSet = Locale.availableLocales().collect(groupingBy(\n\
  \         Locale::getCountry, toSet()));\n      System.out.println(\"countryToLocaleSet:\
  \ \" + countryToLocaleSet);\n\n      Map<String, Map<String, List<Locale>>> countryAndLanguageToLocale\
  \ =\n         Locale.availableLocales().collect(\n            groupingBy(Locale::getCountry,\n\
  \               groupingBy(Locale::getLanguage)));\n      System.out.println(\"\
  Hindi locales in India: \"\n         + countryAndLanguageToLocale.get(\"IN\").get(\"\
  hi\"));\n\n      Map<String, Long> countryToLocaleCounts = Locale.availableLocales().collect(groupingBy(\n\
  \         Locale::getCountry, counting()));\n      System.out.println(\"countryToLocaleCounts:\
  \ \" + countryToLocaleCounts);\n\n      Stream<City> cities = readCities(\"cities.txt\"\
  );\n      Map<String, Integer> stateToCityPopulation = cities.collect(groupingBy(\n\
  \         City::state, summingInt(City::population)));\n      System.out.println(\"\
  stateToCityPopulation: \" + stateToCityPopulation);\n\n      cities = readCities(\"\
  cities.txt\");\n      Map<String, Optional<String>> stateToLongestCityName = cities\n\
  \         .collect(groupingBy(City::state,\n            mapping(City::name, maxBy(Comparator.comparing(String::length)))));\n\
  \      System.out.println(\"stateToLongestCityName: \" + stateToLongestCityName);\n\
  \n      Map<String, Set<String>> countryToLanguages = Locale.availableLocales().collect(groupingBy(\n\
  \         Locale::getDisplayCountry, mapping(Locale::getDisplayLanguage, toSet())));\n\
  \      System.out.println(\"countryToLanguages: \" + countryToLanguages);\n\n  \
  \    cities = readCities(\"cities.txt\");\n      Map<String, IntSummaryStatistics>\
  \ stateToCityPopulationSummary = cities\n         .collect(groupingBy(City::state,\
  \ summarizingInt(City::population)));\n      System.out.println(stateToCityPopulationSummary.get(\"\
  NY\"));\n\n      cities = readCities(\"cities.txt\");\n      Map<String, String>\
  \ stateToCityNames = cities.collect(groupingBy(\n         City::state,\n       \
  \  reducing(\"\", City::name, (s, t) -> s.length() == 0 ? t : s + \", \" + t));\n\
  \n      cities = readCities(\"cities.txt\");\n      stateToCityNames = cities.collect(groupingBy(City::state,\n\
  \         mapping(City::name, joining(\", \"))));\n      System.out.println(\"stateToCityNames:\
  \ \" + stateToCityNames);\n\n      cities = readCities(\"cities.txt\");\n      record\
  \ Pair<S, T>(S first, T second) {}\n      Pair<List<String>, Double> result = cities.filter(c\
  \ -> c.state().equals(\"NV\"))\n         .collect(teeing(\n            mapping(City::name,\
  \ toList()),\n            averagingDouble(City::population),\n            (names,\
  \ avg) -> new Pair<>(names, avg)));\n      System.out.println(result);\n   }\n}\n\
