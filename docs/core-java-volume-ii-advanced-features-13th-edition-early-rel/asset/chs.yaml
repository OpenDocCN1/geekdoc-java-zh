  \      for (int i = 1; i < p.length; i++)\n         s.lineTo((float) p[i].getX(),\
  \ (float) p[i].getY());\n      s.closePath();\n      return s;\n   }\n}\n\n/**\n\
  \ * 由两个端点和一个控制点定义的二次曲线。\n */\nclass QuadCurveMaker extends ShapeMaker\n{\n   public\
