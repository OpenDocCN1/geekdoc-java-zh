  \ (`TWO_SIDED_LONG_EDGE`), `TUMBLE` (`TWO_SIDED_SHORT_EDGE`) | ✓ | ✓ | ✓ |  |\n\n\
  你可以看到，这里有很多属性，其中许多非常专业化。大多数属性的来源是互联网打印协议 1.1 (RFC 2911)。\n\n打印 API 的早期版本引入了 `JobAttributes`\
  \ 和 `PageAttributes` 类，其目的与本节介绍的打印属性相似。这些类现在已经过时。\n\n`javax.print.attribute.Attribute`\
  \ 1.4\n\n* `Class getCategory()`\n  获取此属性的类别。\n* `String getName()`\n  获取此属性的名称。\n\
  \n`javax.print.attribute.AttributeSet` 1.4\n\n* `boolean add(Attribute attr)`\n\
  \  将属性添加到此集合。如果集合具有另一个相同别的属性，则该属性将被给属性替换。如果集合因此操作而变化，则返回 `true`。\n* `Attribute get(Class\
  \ category)`\n  根据指定的类别键检索属性，如果不存在此类属性，则返回 `null`。\n* `boolean remove(Attribute\
  \ attr)`\n* `boolean remove(Class category)`\n  从集合中删除指定的属性或具有指定类别的属性。如果集合因此操作而变化，则返回\
  \ `true`。\n* `Attribute[] toArray()`\n  返回包含此集合中所有属性的数组。\n\n`javax.print.PrintService`\
  \ 1.4\n\n* `PrintServiceAttributeSet getAttributes()`\n  获取此打印服务的属性。\n\n`javax.print.DocPrintJob`\
  \ 1.4\n\n* `PrintJobAttributeSet getAttributes()`\n  获取此打印作业的属性。\n\n你现在已经结束了涵盖高级\
  \ Swing 和 AWT 特性的这一长章节。在最后一章中，我们将转向 Java 编程的另一个方面：在同一机器上与“原生”代码进行交互。\n\n\n\n\n特别是在\
  \ Java 早期，许多人认为使用 C 或 C++ 来加速 Java 程序的关键部分是一个好主意。然而，在实践中，这种做法很少用用。1996 年 JavaOne\
  \ 大会上的一个演示就清楚地展示了这一点。Sun Microsystems 加密库的开发者报告说，用纯 Java 平台实现的加密函数已经绰绰有余。确实，代码的运行速度没有\
  \ C 实现那么快，但事实证明这并不重要。Java 平台的实现速度比网络 I/O 快得多，而这才是真正的瓶颈。\n\n当然，使用原生代码（native code）也有缺点。如果程序的某个部分是用另一种语言编写的，你必须为你想要支持的每个平台提供一个独立的原生库。用\
  \ C 或 C++ 编写的代码无法防止因无效指针使用导致的内存覆盖。编写出能够破坏程序或感染操作系统的原生方法是很容易的。\n\n因此，我建议只在需要时才使用原生代码。特别地，有三个原因使得原生代码可能是一个正确的选择：\n\
  \n*   你的应用程序需要访问 Java 平台无法访问的系统功能或设备。\n*   你在另一种语言中拥有大量经过测试和调试的代码，并且知道如何将它们迁移到所有目标目标平台。\n\
  *   你通过基准测试发现，Java 代码比另一种语言的等效代码慢得多。\n\nJava 平台提供了一个与原生 C 代码交互的 API，称为 Java Native\
  \ Interface（`JNI`）。我们将在本章中讨论 `JNI` 编程。\n\n你也可以使用 C++ 代替 C 来编写原生方法。这有几个优势——类型检查稍微严格，且访问\
  \ `JNI` 函数稍微方便一些。然而，`JNI` 不支持 Java 和 C++ 类之间的任何映射。\n\n正如你将看到的，在 Java 和原生代码之间提供绑定层包含某种程度的繁琐工作。Java\
  \ 17 有一个预览功能，提供了一个访问“外部”函数和内存的 API，这比 `JNI` 方便得多。在本章的末尾，你将领略一下这个 API。\n\n## 从 Java\
  \ 程序中调用 C 函数\n\n假设你有一个 C 函数，它可以执行你喜欢的功能，而且出于某种原因，你不想在 Java 中重新实现它。为了说明起，我们将从一个打印问候语的简单\
  \ C 函数开始。Java 编程语言使用 `native` 关键字来表示原生方法，你显然需要将该方法放在一个类中。结果如列表 13.1 所示。\n\n`native`\
  \ 关键字通知编译器该方法将在外部定义。当然，原生方法不包含任何 Java 代码，且方法头后紧跟着一个终止分号。因此，原生方法的声明看起来类似于抽象方法的声明。\n\
  \nhelloNative/HelloNative.java\n```java\n/**\n * @version 1.11 2007-10-26\n * @author\
  \ Cay Horstmann\n */\nclass HelloNative\n{\n   public static native void greeting();\n\
  }\n```\n为了保持示例简单，请不要使用包（packages）。`native` 关键字通知编译器该方法将在外部定义。当然，原生方法不包含任何 Java 代码，且方法头后紧跟着一个终止分号。因此，原生方法的声明看起来类似于抽象方法的声明。\n\
  \n\n\n\n\n```gcc\ngcc -mno-cygwin -D __int64=\"long long\" -I jdk/include/ -I jdk/include/win32\
  \ \\\n   -shared -Wl,--add-stdcall-alias -o HelloNative.dll HelloNative.c\n```\n\
  \nWindows 版本的头文件 `jni_md.h` 包含类型声明\n\n```c\ntypedef __int64 jlong;\n```\n\n它是针对\
  \ Microsoft 编译器的。如果你使用 GNU 编译器，你可能需要编辑该文件，例如：\n\n```c\n#ifdef __GNUC__\n   typedef\
  \ long long jlong;\n#else\n   typedef __int64 jlong;\n#endif\n```\n\n或者，使用 `-D __int64=\"\
  long long\"` 进行编译，如示例编译器调用所示。\n\n最后，在你的程序中添加对 `System.loadLibrary` 方法的调用。为了确保虚拟机在第一次使用该类之前加载库，请使用静态初始化块，如列表\
  \ 13.4 所示。\n\n图 13.1 给出了原生代码处理的总结。\n\n![Figure](img/fig12-01.jpg)处理原生代码 helloNative/HelloNativeTest.java\n\
  \n```java\n/**\n *  @version 1.11 2007-10-26\n *  @author Cay Horstmann\n */\nclass\
  \ HelloNativeTest\n{  \n   public static void main(String[] args)\n   {\n      HelloNative.greeting();\n\
  \   }\n\n   static\n   {  \n      System.loadLibrary(\"HelloNative\");\n   }\n}\n\
  ```\n\n编译并运行此程序后，终端窗口中将显示消息“Hello, Native World!”。\n\n如果你运行的是 Linux，你必须将当前目录添加到库路径中。可以设置环境变量\
  \ `LD_LIBRARY_PATH`：\n\n```bash\nexport LD_LIBRARY_PATH=.:$LD_LIBRARY_PATH\n```\n\
  \n或者设置系统属性 `java.library.path`：\n\n```bash\njava -Djava.library.path=. HelloNativeTest\n\
  ```\n\n当然，这本身并不特别引人注目。但请记住，这条消息是由 C 语言的 `printf` 命令生成的，而不是由任何 Java 代码生成的。我们已经迈出了跨越这两种语言鸿沟的第一步！\n\
  \n总结，按照以下步骤将原生方法链接到 Java 程序：\n\n1. 在 Java 类中声明一个 native 方法。\n2. 运行 `javac -h` 以获取包含该方法\
  \ C 声明的头文件。\n3. 在 C 中实现该原生方法。\n4. 将代码放入共享库。\n5. 在你的 Java 程序中加载该库。\n\n`java.lang.System`\
  \ 1.0\n\n*   `void loadLibrary(String libname)`\n    加载给定名称的库。库位于库搜索路径中。定位库的确切方法取决于操作系统。\n\
  \n某些原生代码的共享库必须执行某些初始化。你可以将任何初始化代码放入 `JNI_OnLoad` 方法中。同样，当虚拟机（VM）关闭时，如果你提供了它，它将调用\
  \ `JNI_OnUnload` 方法。原型如下：\n\n```c\njint JNI_OnLoad(JavaVM* vm, void* reserved);\n\
  void JNI_OnUnload(JavaVM* vm, void* reserved);\n```\n\n`JNI_OnLoad` 方法需要返回它所需的 VM\
  \ 最小版本，例如 `JNI_VERSION_1_2`。\n\n## 数值参数和返回值\n\n在 C 和 Java 之间传递数字时，你应该理解哪些类型是相互对应的。例如，虽然\
  \ C 确实有名为 `int` 和 `long` 的数据类型，但它们的实现取决于平台。在某些平台上，`int` 是 16 位的数值，而在另一些平台上是 32 位的。在\
  \ Java 平台上，当然，`int` 始终是一个 32 位的整数。由于这个原因，JNI 定义了 `jint`、`jlong` 等类型。\n\n表 13.1 显示了\
  \ Java 类型与 C 类型之间的对应关系。\n\n### Java 类型与 C 类型\n\n| Java 编程语言 | C 编程语言 | 字节 (Bytes)\
  \ |\n| --- | --- | --- |\n| `boolean` | `jboolean` | 1 |\n| `byte` | `jbyte` | 1\
  \ |\n| `char` | `jchar` | 2 |\n| `short` | `jshort` | 2 |\n| `int` | `jint` | 4\
  \ |\n| `long` | `jlong` | 8 |\n| `float` | `jfloat` | 4 |\n| `double` | `jdouble`\
  \ | 8 |\n\n在头文件 `jni.h` 中，这些类型使用 `typedef` 语句声明为目标平台上的等效类型。该头文件还定义了常量 `JNI_FALSE\
  \ = 0` 和 `JNI_TRUE = 1`。\n\n在 Java 5 之前，Java 还没有 C 语言 `printf` 函数的直接对应。在以下示例中，我们将假设你受限于一个旧版本的\
  \ JDK 发布，并决定通过在原生方法中调用 C `printf` 函数来实现相同的功能。\n\n列表 13.5 显示了以下示例，我们将假设你受限于一个旧版本的\
  \ JDK 发布，并决定通过在原生方法中调用 C `printf` 函数来实现相同的功能。\n\n```java\n/**\n *  @version 1.11\
  \ 2007-10-26\n *  @author Cay Horstmann\n */\nclass HelloNativeTest\n{  \n   public\
  \ static void main(String[] args)\n   {\n      HelloNative.greeting();\n   }\n\n\
  \   static\n   {  \n      System.loadLibrary(\"HelloNative\");\n   }\n}\n```\n\n\
  在头文件 `jni.h` 中，这些类型使用 `typedef` 语句声明为目标平台上的等效类型。该头文件还定义了常量 `JNI_FALSE = 0` 和 `JNI_TRUE\
  \ = 1`。\n\n在 Java 5 之前，Java 还没有 C `printf` 函数的直接对应。在以下示例中，我们将假设你受限于一个旧版本的 JDK 发布，并决定通过在原生方法中调用\
