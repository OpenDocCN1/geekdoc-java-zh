  x{7}`), 转义 (`\\x{1B}`), 分页 (`\\x{B}`), 换行 (`\\x{A}`), 回车 (`\\x{D}`), 制表 (`\\x{9}`)\
  \ | `\\n` |\n| `\\cc`, 其中 `c` 属于 `[A-Z]` 或 `@ [ \\ ] ^ _ ?` 之一 | 与字符 `c` 对应的控制字符\
