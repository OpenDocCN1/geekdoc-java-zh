  \n* `static HttpClient newHttpClient()`\n  返回一个默认配置的 `HttpClient`。\n* `static HttpClient.Builder\
  \ newBuilder()`\n  返回用于构建 `HttpClient` 的构建器。\n* `<T> HttpResponse<T> send(HttpRequest\
  \ request, HttpResponse.BodyHandler<T> responseBodyHandler)`\n* `<T> CompletableFuture<HttpResponse<T>>\
  \ sendAsync(HttpRequest request, HttpResponse.BodyHandler<T> responseBodyHandler)`\n\
  \  发送同步或异步请求并使用指定的处理器处理响应体。\n\n`java.net.http.HttpClient.Builder`\n\n* `HttpClient\
  \ build()`\n  返回一个由此构建器配置属性的 `HttpClient`。\n* `HttpClient.Builder followRedirects(HttpClient.Redirect\
  \ policy)`\n  将重定向策略设置为 `HttpClient.Redirect` 枚举中的值 `ALWAYS`、`NEVER` 或 `NORMAL`（仅拒绝从\
  \ HTTPS 到 HTTP 的重定向）之一。\n* `HttpClient.Builder executor(Executor executor)`\n  设置异步请求的执行器。\n\
  \n`java.net.http.HttpRequest`\n\n* `HttpRequest.Builder newBuilder()`\n  返回用于构建\
  \ `HttpRequest` 的构建器。\n* `HttpRequest.Builder newBuilder(HttpRequest request, BiPredicate<String,String>\
  \ filter)`\n  返回一个用于构建与提供的请求相同属性的构建器，但仅包含过滤器接受的标头。\n\n`java.net.http.HttpRequest.Builder`\n\
  \n* `HttpRequest build()`\n  返回一个由此构建器配置属性的 `HttpRequest`。\n* `HttpRequest.Builder\
  \ uri(URI uri)`\n  设置此请求的 URI。\n* `HttpRequest.Builder header(String name, String\
  \ value)`\n\n\n\n\n\n为此请求设置请求头。\n\n* `HttpRequest.Builder.GET()`\n* `HttpRequest.Builder.DELETE()`\n\
  * `HttpRequest.Builder.POST(HttpRequest.BodyPublisher bodyPublisher)`\n* `HttpRequest.Builder.PUT(HttpRequest.BodyPublisher\
  \ bodyPublisher)`\n\n为此请求设置请求方法和请求体。\n\n`java.net.http.HttpResponse<T>` 11\n\n*\
  \ `T body()`\n  返回响应正体。\n* `int statusCode()`\n  返回此响应的状态码。\n* `HttpHeaders headers()`\n\
  \  返回响应头信息。\n\n`java.net.http.HttpHeaders` 11\n\n* `Map<String,List<String>> map()`\n\
  \  返回这些响应头的 `Map`。\n* `Optional<String> firstValue(String name)`\n  如果在这些响应头中存在，则返回给定名称的第一个值。\n\
  \n# 简单的 HTTP 服务器\n\n从 Java 6 开始，JDK 在 `com.sun.net.httpserver` 包中提供了一个简单的 Web 服务器。在\
  \ Java 18 中，JDK 增加了一个命令行工具，用于调用基于该包的静态文件服务器。当时，添加了一些便利类，并且 JEP 408 确认了该包受“官方支持”。该\
  \ Web 服务器用于测试、开发和调试。\n\n## 命令行工具\n\n要启动简单的文件服务器，请使用命令：\n\n```\njwebserver\n```\n\
  \n它会在端口 8000 上提供当前目录及其子目录下的所有文件。当提供文件时，会打印一条消息。你可以通过 `-d` 和 `-p` 更改目录和端口：\n\n```\n\
  jwebserver -d /tmp -p 8189\n```\n\n你还可以通过 `-o` 命令行选项设置消息输出级别。值为 `info`（默认）、`verbose`（详细）和\
  \ `none`（无）。\n\n要停止服务器，按 Ctrl+C 或使用 `kill`/`pkill` 命令。\n\n此服务器仅用于提供文件。它类似于 `python\
  \ -m http.server` 命令。事实上，你也可以通过 `java -m jdk.httpserver` 调用简单的 Java 文件服务器。\n\n##\
  \ HTTP 服务器 API\n\n你可以通过编程方式启动简单的文件服务器：\n\n```java\nimport com.sun.net.httpserver.*;\n\
  . . .\nHttpServer server = SimpleFileServer.createFileServer(new InetSocketAddress(port),\n\
  \   Path.of(\"/tmp\"), OutputLevel.VERBOSE);\nserver.start();\n```\n\n现在你可以以各种方式对其进行自定义。或者，如果你不想提供文件，可以获取一个什么都不执行的服务器：\n\
  \n```java\nHttpServer server = HttpServer.create(new InetSocketAddress(port), 0);\n\
  ```\n\n第二个参数是服务器套接字的积队列长度（backlog）——即等待连接请求的最大数量。如果参数为零，则使用默认值。\n\n你可以设置处理请求的执行器：\n\
  \n```java\nserver.setExecutor(Executors.newVirtualThreadPerTaskExecutor());\n```\n\
  \n为了让服务器执行某些有趣的操作，你需要创建上下文（contexts）。\n\n一个上下文包含：\n\n* 一个 `path`，它必须是请求路径的前缀\n*\
  \ 一个计算响应的 `handler`\n* 一个可以转换请求或响应的 `filters` 列表（参见 第 4.5.4 节）\n\n如果请求匹配了多个上下文，将执行路径最长的那个。例如，在这里为路径\
  \ `/static/` 和 `/` 安装了两个处理器：\n\n```java\nserver.createContext(\"/static/\", SimpleFileHandler.createFileHandler(staticRoot));\n\
  server.createContext(\"/\", HttpHandlers.of(301, Headers.of(\"Location\", \"https://horstmann.com/corejava\"\
  ), \"\"));\n```\n\n注意，你可以利用现有的处理器，例如简单文件服务器的处理器。\n\n静态方法 `HttpHandlers.of` 生成一个返回固定响应的简单处理器。你传递状态码、响应头和响应正体。\n\
  \n静态方法 `HttpHandlers.handleOrElse` 使用 `Predicate<Request>` 在两个处理器之间选择：\n\n```java\n\
  HttpHandler handler = HttpHanders.handleOrElse(request -> request.getRequestMethod().equals(\"\
  GET\"),\n   SimpleFileHandler.createFileHandler(staticRoot).\n   HttpHandlers.of(500,\
  \ Headers.of(), \"Bad request method\"))\n```\n\n对于更复杂的处理器，你需要提供 `HttpHandler` 子类的一个实例。详情请见下一节。\n\
  \n### 处理器 (Handlers)\n\n处理器在它的方法中产生 HTTP 请求的响应：\n\n```java\npublic void handle(HttpExchange\
  \ exchange)\n```\n\n`HttpExchange` 实例持有请求和响应数据。处理器必须按照特定的顺序使用该对象：\n\n1. 读取请求方法、URI\
  \ 和请求头：\n   ```java\n   String method = exchange.getRequestMethod();\n   URI uri\
  \ = exchange.getRequestURI();\n   Headers requestHeaders = exchange.getRequestHeaders();\n\
  \   String userAgent = requestHeaders.getFirst(\"user-agent\");\n   ```\n\n2. 为\
  \ `POST`、`PUT` 和 `PATCH` 请求读取请求体：\n   ```java\n   InputStream in = exchange.getRequestBody();\n\
  \   String body = new String(in.readAllBytes());\n   in.close();\n   ```\n\n3. 设置响应头：\n\
  \   ```java\n   Headers responseHeaders = exchange.getResponseHeaders();\n   responseHeaders.add(\"\
  Content-type\", \"text/plain\");\n   ```\n\n4. 设置状态码和响应正体长度：\n   ```java\n   exchange.sendResponseHeaders(200,\
  \ length);\n   ```\n\n5. 如果有响应正体，则写入：\n   ```java\n   OutputStream responseBody\
  \ = exchange.getResponseBody();\n   responseBody.write(bytes);\n   responseBody.close();\n\
  \   ```\n\n### 过滤器 (Filters)\n\n除了处理器外，上下文还可以有一个过滤器链。过滤器可以修改请求或响应，也可以执行额外工作如日志记录或身份验证。例如，简单的\
  \ Web 服务器使用过滤器来显示请求。\n\n要实现过滤器，请扩展抽象类 `Filter` 并实现两个方法。`description` 方法返回一个描述性字符串。通常，`doFilter`\
  \ 方法如下：\n\n```java\npublic void doFilter(HttpExchange exchange, Filter.Chain chain)\n\
  {\n   请求处理\n   chain.doFilter(exchange);\n   响应处理\n}\n```\n\n通过调用 `chain.doFilter(exchange)`\
  \ 调用剩余的过滤器和处理器。\n\n过滤器可以中止过滤和处理——例如，如果身份验证失败。此时不应该调用 `chain.doFilter(exchange)`，而在\
  \ `exchange` 对象中产生响应。\n\n你可以这样添加过滤器：\n\n```java\ncontext.getFilters().add(filter);\n\
  ```\n\n如你所示，HTTP 服务器 API 有些粗糙且过时。在你自己的代码中，不要提供返回内部可变数据结构的方法，就像 `Context.getFilters`\
  \ 方法所做的那样。\n\n`Filter` 类有三个用于过滤器的静态工厂方法：\n\n```java\npublic Filter beforeHandler(String\
  \ description, Consumer<HttpExchange> operation)\npublic Filter afterHandler(String\
  \ description, Consumer<HttpExchange> operation)\npublic Filter adaptRequest(String\
  \ description, UnaryOperator<Request> requestOperator)\n```\n\n前两个方法将 `exchange`\
  \ 对象（在请求之前或之后）传递给消费者，消费者可以对其进行检查或修改。\n\n第三个方法使得向请求添加请求头变得更加方便：\n\n```java\nFilter\
  \ f = Filter.adaptRequest(\"Adding header\", request -> request.with(headerName,\
  \ List.of(headerValue)));\n```\n\n\n\n\n\n当然，与成熟的 Web 服务器（如 `Tomcat` 或 `Jetty`）相比，这个服务器相当基础。但它是\
  \ `JDK` 的一部分，足以用于原型设计和测试。\n\nListing 4.11 中的程序显示了一个简单的服务器，它以纯文本响应的形式回显所有请求数据。启动它并将浏览器指向\
  \ `http://localhost:8189`，即可查看浏览器的请求头。该服务器也用于观察 Listing 4.10 中程序的表单提交和文件上传请求情况。\n\
  \n`httpServer/EchoServer.java`\n\n```java\npackage httpServer;\n\nimport java.io.IOException;\n\
  import java.io.OutputStream;\nimport java.net.InetSocketAddress;\nimport java.util.concurrent.Executors;\n\
  \nimport com.sun.net.httpserver.*;\n\n/**\n * 此程序实现了一个 HTTP 服务器，它监听 8189 端口 \n *\
  \ 或作为参数提供的端口，并回显所有客户端输入。\n * @version 1.0 2023-11-01\n * @author Cay Horstmann\n\
  \ */\npublic class EchoServer\n{\n   public static void main(String[] args) throws\
  \ IOException\n   {\n      int port = args.length >= 1 ? Integer.parseInt(args[0])\
  \ : 8189;\n      HttpServer server = HttpServer.create(new InetSocketAddress(port),\
  \ 0);\n      server.setExecutor(Executors.newVirtualThreadPerTaskExecutor());\n\
  \      server.createContext(\"/\", HttpHandlers.of(301, Headers.of(\"Location\"\
  , \"https://horstmann.com/corejava\"), \"\"));\n      server.createContext(\"/echo\"\
  , (HttpExchange exchange) -> \n            {\n               var headers = new StringBuilder();\n\
  \               exchange.getRequestHeaders().forEach((k, vs) ->\n              \
  \    vs.forEach(v -> \n                     headers.append(\"%s: %s\\n\".formatted(k,\
  \ v))));\n\n               String requestBody = new String(exchange.getRequestBody().readAllBytes());\n\
  \               String response = \"%s %s\\n%s\\n%s\\n\".formatted(\n          \
  \           exchange.getRequestMethod(), exchange.getRequestURI(), \n          \
  \           headers,\n                     requestBody);\n               byte[]\
  \ responseBytes = response.getBytes();\n\n               exchange.sendResponseHeaders(200,\
  \ responseBytes.length);\n               OutputStream responseBody = exchange.getResponseBody();\n\
  \               responseBody.write(responseBytes);\n               responseBody.close();\n\
  \            }\n         );\n      server.start();\n   }\n}\n```\n\n## 发送电子邮件\n\n\
  过去，通过向邮件服务器的 25 端口（SMTP 端口）建立 socket 连接来编写发送电子邮件的程序非常。简单邮件传输协议（SMTP）描述了电子邮件的格式。一旦连接到服务器，发送邮件头（SMTP\
  \ 格式，很容易生成），然后是邮件正文。\n\n以下是细节：\n\n1. 打开到你宿主机的 socket。\n\n```\nvar s = new Socket(\"\
  mail.yourserver.com\", 25); // 25 是 SMTP\nvar out = new PrintWriter(s.getOutputStream());\n\
  ```\n\n2. 向打印流发送以下信息：\n\n```\nHELO sending host\nMAIL FROM: sender e-mail address\n\
  RCPT TO: recipient e-mail address\nDATA\nSubject: subject\n(blank line)\nmail message\
  \ (any number of lines)\n.\nQUIT\n```\n\nSMTP 规范 (RFC 821) 规定行必须以 `\\r` 后接 `\\n`\
  \ 结束。\n\n过去，SMTP 服务器通常愿意路由任何人的邮件。然而，在如今垃圾邮件泛滥的时代，大多数服务器都内置了检查，仅接受来自其信任的用户或 IP 地址范围的请求。身份验证通常通过安全的\
  \ socket 连接进行。\n\n手动实现这些身份验证方案非常麻烦。相反，我们将向你如何使用 `Jakarta Mail API` 从 Java 程序发送电子邮件。\n\
  \n要使用 `Jakarta Mail API`，你需要设置一些取决于邮件服务器的属性。例如，使用 `GMail` 时，使用：\n\n```\nmail.transport.protocol=smtps\n\
  mail.smtps.auth=true\nmail.smtps.host=smtp.gmail.com\nmail.smtps.user=accountname@gmail.com\n\
  ```\n\n我们的示例程序从属性文件中读取这些内容。\n\n出于安全考虑，我们不将密码放在属性文件中，而是通过提示输入。\n\n对于大多数邮件提供商，你需要生成并使用特殊的应用程序密码，而不是使用你的普通邮件密码。\n\
  \n从属性文件中读取，然后如下所示获取邮件会话：\n\n```\nSession mailSession = Session.getDefaultInstance(props);\n\
  ```\n\n创建一个带有所需的发送者、接收者、主题和邮件正文文本的消息：\n\n```\nvar message = new MimeMessage(mailSession);\n\
  message.setFrom(new InternetAddress(from));\nmessage.addRecipient(RecipientType.TO,\
  \ new InternetAddress(to));\nmessage.setSubject(subject);\nmessage.setText(builder.toString());\n\
  ```\n\n然后发送它：\n\n```\nTransport tr = mailSession.getTransport();\ntr.connect(null,\
  \ password);\ntr.sendMessage(message, message.getAllRecipients());\ntr.close();\n\
  ```\n\nListing 4.12 中的程序读取了这些内容。\n\n\n\n\n\n在本章中，你已经学习了如何用 Java 编写网络客户端和服务器，以及如何从\
  \ Web 服务器获取信息。下一章将介绍数据库连接。你将学习如何使用 `JDBC` API 在 Java 中与关系型数据库进行交互。\n\n# 数据库编程\n\n\
  1996 年，Sun  公司发布了第一版本的 `JDBC` API。该 API 允许程序员连接到数据库，并使用标准结构化查询语言（`SQL`）对其进行查询或更新。（`SQL`\
  \ 通常读作“sequel”，是关系型数据库访问的行业标准。）自此以后，`JDBC` 已成为 Java 库中最常用的 API 之一。\n\n`JDBC` 已经更新了多次。在本书出版时，Java\
  \ 9 包含的 `JDBC` 4.3 版本是最新版本。\n\n在本章中，我将解释 `JDBC` 背后的核心思想。我将向你介绍（或让你重温记忆）`SQL` ——这是一种用于关系型数据库的行业标准结构化查询语言。本章提供了足够的细节和示例，让你能够能够在常见的编程场景中使用\
  \ `JDBC`。\n\n根据 Oracle 的说法，`JDBC` 是一个注册商标术语，而不是 Java Database Connectivity 的缩写。它的命名是为了让人联想起\
  \ `ODBC`，这是一种由微软开创的标准数据库 API，并在此后被并入 `SQL` 标准中。\n\n## JDBC 的设计\n\n从一开始，Java 技术的开发者们就意识到了\
  \ Java 在处理数据库方面的巨大潜力。1995 年，他们开始扩展标准 Java 库，以处理对数据库的 `SQL` 访问。他们最初希望实现的是扩展 Java，以便程序仅使用“纯”Java\
  \ 就能与任何随机数据库进行通信。但他们很快意识到这是一项无法完成的任务：市面上的数据库实在太多了，使用的协议也太多了。此外，尽管数据库供应商都支持 Java\
  \ 为数据库访问提供一种标准的网络协议，但只有当 Java 使用*他们自己的*网络协议时，他们才会支持。\n\n所有数据库供应商和工具供应商达成共识的是：如果\
  \ Java 能提供一个纯 Java 的 `SQL` 访问 API，配合一个驱动程序管理器（driver manager）允许第三方驱动程序连接到特定的数据库，这将非常有用的。数据库供应商可以提供自己的驱动程序插入驱动程序管理器中。这样，就有一种简单的机制可以在驱动程序管理器中注册第三方驱动程序。\n\
  \n这种组织形式遵循了微软 `ODBC` 的成功模型，该模型为数据库访问提供了 C 语言语言接口。`JDBC` 和 `ODBC` 都基于同一个理念：根据 API\
  \ 编写的程序与驱动程序管理器通信，而驱动程序管理器又使用驱动程序与实际数据库通信。\n\n这意味着 `JDBC` API 是大多数程序员唯一需要处理的内容。\n\
  \n### JDBC 驱动程序类型\n\n`JDBC` 规范将驱动程序分为以下几种类型：\n\n*   `type 1 driver`（第 1 型驱动程序）将\
  \ `JDBC` 翻译为 `ODBC`，并依赖 `ODBC` 驱动程序与数据库通信。早期的 Java 版本包含了这样一个驱动程序，即 `JDBC/ODBC bridge`。然而，该桥接器需要部署并正确配置\
  \ `ODBC` 驱动程序。在 `JDBC` 首次发布时，该桥接器对于测试非常方便，但从未打算用于生产环境。目前，已经有了许多更好的驱动程序，且 `JDK` 不再提供\
  \ `JDBC/ODBC bridge`。\n*   `type 2 driver`（第 2 型驱动程序）部分用 Java 编写，部分用原生代码编写；它与数据库的客户端\
  \ API 通信。要使用此类驱动程序，除了安装 Java 库外，你还需要客户端安装某些特定平台的代码。\n*   `type 3 driver`（第 3 型驱动程序）是一个纯\
  \ Java 客户端库，使用与数据库无关的协议将数据库请求发送到服务器组件，由该组件将请求翻译为特定数据库的协议。这简化了部署，因为特定平台的代码仅位于服务器端。\n\
  *   `type 4 driver`（第 4 型驱动程序）是一个纯 Java 库，它直接将 `JDBC` 请求翻译为特定数据库的协议。\n\n`JDBC` 规范可以在\
  \ [`jcp.org/aboutJava/communityprocess/mrel/jsr221/index3.html`](https://jcp.org/aboutJava/communityprocess/mrel/jsr221/index3.html)\
  \ 获取。\n\n大多数数据库供应商都会随其数据库提供 `type 3` 或 `type 4` 驱动程序。此外，许多第三方公司专门生产具有更好标准合规性、更多平台支持、更好性能，或者在某些情况下比数据库供应商提供的驱动程序更具可靠性的驱动程序。\n\
  \n总结来说，`JDBC` 的最终目标是实现以下目标：\n\n*   程序员可以使用 Java 编程语言编写应用程序，使用标准的 `SQL` 语句（甚至是 `SQL`\
  \ 的特殊扩展）访问任何数据库，同时仍然遵循 Java 语言规范。\n*   数据库供应商和数据库工具供应商可以提供低级驱动程序。这样，他们就可以针对特定的产品优化自己的驱动程序。\n\
  \n如果你好奇 Java 为什么不直接采用 `ODBC` 模型，根据 1996 年 JavaOne 大会上给出的理由如下：\n\n*   `ODBC` 很难学习。\n\
  *   `ODBC` 的某些命令带有许多复杂的选项。Java 编程语言的偏好风格是拥有简单且直观的方法，并且方法尽可能多。\n*   `ODBC` 依赖于 `void*`\
  \ 指针和其他 C 语言特性，这些特性在 Java 编程语言中并不自然。\n*   基于 `ODBC` 的解决方案天生比纯 Java 解决方案不安全且难以部署。\n\
  \n### JDBC 的典型用途\n\n传统的客户端/服务器模型在客户端拥有丰富的 GUI，在服务器端拥有数据库（见图 5.1）。在这种模型下，`JDBC` 驱动程序部署在客户端。\n\
  \n![Figure](img/fig04-02.jpg)传统的客户端/服务器应用程序\n\n然而，现在更常见的是三层模型，客户端应用程序不直接调用数据库。相反，它调用服务器上的中间层，由中间层进行数据库查询。三层模型有两个优势：它将*视觉呈现*（在客户端）、*业务逻辑*（在中间层）和原始数据（在数据库）分离开。因此，多个客户端（如\
  \ Java 桌面应用、浏览器或移动应用）可以访问相同的数据和规则。\n\n客户端与中间层之间的通信通常通过 `HTTP` 进行。`JDBC` 管理中间层与后端数据库之间的通信。图\
  \ 5.2 显示了基本架构。\n\n![Figure](img/fig04-03.jpg)三层应用程序\n\n## 结构化查询语言\n\n`JDBC` 允许你使用\
  \ `SQL` 与数据库通信，`SQL` 是几乎所有关系数据库服务器的语言。桌面数据库如 Microsoft Access 具有查询和更新的 GUI，但 `JDBC`\
  \ 专注于服务器数据库，如 `Oracle`、`PostgreSQL`、`MySQL`、`Microsoft SQL Server` 等。\n\n`JDBC`\
  \ 包可以被认为仅仅是通信 `SQL` 语句的 API。我们在本节中简要介绍 `SQL`。如果你以前从未见过 `SQL`，你可能会觉得这些材料不够。如果是这样，请参阅该主题的许多学习资源；我推荐\
  \ Alan Beaulieu 写的《Learning SQL》（O’Reilly, 2009）或在线书籍 [Learn SQL The Hard Way](https://sql.learncodethehardway.org](https://sql.learncodethehardway.org)。\n\
  \n你可以将数据库想象成一组命名的、具有行列的表。每列都有一个*列名*。每行包含一组相关数据。\n\n作为本书的示例数据库，我们使用一组描述经典计算机科学书籍集合的数据库表。\n\
  \n`Authors` 表\n\n| Author_Id | Name | Fname |\n| --- | --- | --- |\n| `ALEX` | `Alexander`\
  \ | `Christopher` |\n\n\n\n\n\n| `BROO` | `Brooks` | `Frederick P.` |\n| `. . .`\
  \ | `. . .` | `. . .` |\n\n### `Books` 表\n\n| Title | ISBN | Publisher_Id | Price\
  \ |\n| --- | --- | --- | --- |\n| `A Guide to the SQL Standard` | `0-201-96426-0`\
  \ | `0201` | `47.95` |\n| `A Pattern Language: Towns, Buildings, Construction` |\
  \ `0-19-501919-9` | `019` | `65.00` |\n| `. . .` | `. . .` | `. . .` | `. . .` |\n\
  \n### `BooksAuthors` 表\n\n| ISBN | Author_Id | Seq_No |\n| --- | --- | --- |\n|\
  \ `0-201-96426-0` | `DATE` | `1` |\n| `0-201-96426-0` | `DARW` | `2` |\n| `0-19-501919-9`\
  \ | `ALEX` | `1` |\n| `. . .` | `. . .` | `. . .` |\n\n### `Publishers` 表\n\n| Publisher_Id\
  \ | Name | URL |\n| --- | --- | --- |\n| `0201` | `Addison-Wesley` | `www.aw-bc.com`\
  \ |\n| `0407` | `John Wiley & Sons` | `www.wiley.com` |\n| `. . .` | `. . .` | `.\
  \ . .` |\n\n图 5.3 显示了 `Books` 表的视图。图 5.4 显示了该表与 `Publishers` 表连接后的结果。`Books` 表和\
  \ `Publishers` 表各包含出版商的标识符。当我们根据出版商代码连接这两张表时，我们得到一个由连接表中的值组成的查询结果。结果中的每一行都包含书籍的信息，以及出版商名称和网页\
  \ URL。注意，出版商名称和 URL 在多行中是重复的，因为我们有多本属于同一出版商的书。\n\n![Figure](img/fig04-04.jpg)包含书籍的示例表![Figure](img/fig04-05.jpg)两个连接在一起的表\n\
  \n连接表的用处是避免数据库表中数据不必要的重复。例如，一个朴素的数据库设计可能会在 `Books` 表中直接包含出版商名称和 URL 列。但这样数据库本身（而不仅仅是查询结果）将会有许多此类条目的重复。如果出版商的网站地址发生变化，所有条目都需要更新。显然，这某种程度上容易出错。在关系模型中，我们将数据分布到多个表中，以确保没有信息出现不必要的重复。例如，每个出版商的\
  \ URL 仅在出版商表中包含一次。如果需要合并信息，则连接这些表。\n\n在图中，你可以看到一个图形化工具来检查和链接表。许多供应商都有工具，通过连接列名并在表单中填写信息以简单的形式表示查询。此类工具通常被称为示例查询（QBE）工具。相比之下，使用\
  \ SQL 的查询是用文本形式编写的，使用 SQL 语法，例如：\n\n```sql\nSELECT Books.Title, Books.Publisher_Id,\
  \ Books.Price, Publishers.Name, Publishers.URL\nFROM Books, Publishers\nWHERE Books.Publisher_Id\
  \ = Publishers.Publisher_Id\n```\n\n在本节的剩余部分，你将学习如何编写此类查询。如果你已经熟悉 SQL，请跳过本节。\n\n\
  按照惯例，SQL 关键字使用大写字母，尽管这并非必须。\n\n`SELECT` 语句非常灵活。你可以仅通过以下查询选择 `Books` 表中的所有行：\n\n\
  ```sql\nSELECT * FROM Books\n```\n\n`FROM` 子句在每个 SQL `SELECT` 语句中都是的。它告诉数据库检查哪些表以查找数据。\n\
  \n你可以选择你需要的列：\n\n```sql\nSELECT ISBN, Price, Title\nFROM Books\n```\n\n你可以使用 `WHERE`\
  \ 子句限制结果中的行：\n\n```sql\nSELECT ISBN, Price, Title\nFROM Books\nWHERE Price <= 29.95\n\
  ```\n\n注意“等号”比较。SQL 使用 `=` 和 `<>` 进行相等性测试，而不是像 Java 编程语言中的 `==` 或 `!=`。\n\n某些数据库供应商支持使用\
  \ `!=` 进行不等性测试。这不是标准 SQL，因此我不建议使用这种用法。\n\n`WHERE` 子句还可以通过 `LIKE` 运算符进行模式匹配。然而，通配符不是通常的\
  \ `*` 和 `?`。使用 `%` 表示零或多个字符，使用下划线 `_` 表示单个字符。例如，\n\n```sql\nSELECT ISBN, Price,\
  \ Title\nFROM Books\nWHERE Title NOT LIKE '%n_x%'\n```\n\n排除标题中包含 Unix 或 Linux 等单词的书。\n\
  \n注意字符串包含在单引号中，而不是双引号。字符串内部的单引号用一对单引号表示。例如，\n\n```sql\nSELECT Title\nFROM Books\n\
  WHERE Title LIKE '%''%'\n\n```所有包含单引号的标题。\n\n你可以从多个表中选择数据：\n\n```sql\nSELECT * FROM\
  \ Books, Publishers\n```\n\n（注：由于原文末尾存在大量重复内容，译文已根据逻辑进行了清理。）\n\n\n\n\n你还必须为你的实验创建一个数据库。我们假设你将其命名为\
  \ `COREJAVA`。创建一个新数据库，或者让你的数据库管理员创建一个具有相应权限的数据库。你需要能够在数据库中创建、更新和删除（drop）表。\n\n如果这是你第一次使用数据库，我建议你使用\
  \ Apache Derby 数据库，你可以在 [`db.apache.org/derby`](https://db.apache.org/derby) 获取。\n\
  \n或者，如果你熟悉 Docker，那么在 docker 镜像中运行 PostgreSQL 非常简单：\n\n```\ndocker pull postgres\n\
  docker run -e POSTGRES_PASSWORD=secret -e POSTGRES_DB=COREJAVA -p 5432:5432 -d postgres\n\
  ```\n\n在编写第一个数据库程序之前，你需要收集一些项目。接下来的章节将介绍这些项目。\n\n### 数据库 URL\n\n在连接到数据库时，你必须使用各种特定数据库的参数，例如主机名、端口号和数据库名称。\n\
  \nJDBC 使用类似于普通 URL 的语法来描述数据源。以下是语法的示例：\n\n```\njdbc:derby://localhost:1527/COREJAVA;create=true\n\
  jdbc:postgresql:COREJAVA\n```\n\n这些 JDBC URL 指定了一个名为 `COREJAVA` 的 Derby 数据库和一个 PostgreSQL\
  \ 数据库。\n\n通用语法是\n\n```\njdbc:subprotocol:other stuff\n```\n\n其中 subprotocol（子协议）用于选择连接数据库的特定驱动程序。\n\
  \n`other stuff` 的格式取决于所使用的子协议。你需要查找供应商的文档以获取特定格式。\n\n### 驱动程序 JAR 文件\n\n你需要获取包含数据库驱动程序的\
  \ JAR 文件。如果你使用 Derby，你需要文件 `derbyclient.jar`。如果使用其他数据库，则你需要找到相应的驱动程序。例如，PostgreSQL\
  \ 驱动程序可以在 [`jdbc.postgresql.org`](https://jdbc.postgresql.org) 获取。\n\n运行访问数据库的程序时，将驱动\
  \ JAR 文件包含类路径。（编译时不需要该 JAR 文件。）\n\n当你从命令行启动程序时，只需使用命令\n\n```\njava -classpath driverJarPath:.\
  \ ProgramName\n```\n\n在 Windows 上，使用分号将当前目录（用字符 `.` 表示）与驱动 JAR 路径隔开。\n\n### 启动数据库\n\
  \n在连接到数据库之前，需要启动数据库服务器。具体细节取决于你的数据库。\n\n对于 Derby 数据库，请遵循以下步骤：\n\n1. 打开命令行 shell\
  \ 并切换到存放数据库文件的目录。\n2. 在 Derby 安装目录中找到 `derbyrun.jar` 文件。我们将包含 `lib/derbyrun.jar`\
  \ 的目录标记为 `derby`。\n3. 运行命令\n\n```\njava -jar derby/lib/derbyrun.jar server start\n\
  ```\n\n4. 双重检查数据库是否正常工作。创建一个包含这些行的 `ij.properties` 文件：\n\n```\nij.driver=org.apache.derby.jdbc.ClientDriver\n\
  ij.protocol=jdbc:derby://localhost:1527/\nij.database=COREJAVA;create=true\n```\n\
  \n从另一个命令行 shell，执行以下命令运行 Derby 的交互式脚本工具（称为 `ij`）：\n\n```\njava -jar derby/lib/derbyrun.jar\
  \ ij -p ij.properties\n```\n\n现在你可以发布诸如如下 SQL 命令\n\n```\nCREATE TABLE Greetings\
  \ (Message VARCHAR(20));\nINSERT INTO Greetings VALUES ('Hello, World!');\nSELECT\
  \ * FROM Greetings;\nDROP TABLE Greetings;\n```\n\n注意，每个命令都必须以分号结束。要退出，输入\n\n```\n\
  EXIT;\n```\n\n5. 当你完成数据库的使用时，使用命令停止服务器\n\n```\njava -jar derby/lib/derbyrun.jar\
  \ server shutdown\n```\n\n如果你使用其他数据库，你需要咨询文档以如何启动和停止你的数据库服务器，以及如何连接它并发布 SQL 命令。\n\
  \n### 连接到数据库\n\n在你的 Java 程序中，所示打开数据库连接：\n\n```\nString url = \"jdbc:postgresql:COREJAVA\"\
  ;\nString username = \"dbuser\";\nString password = \"secret\";\nConnection conn\
  \ = DriverManager.getConnection(url, username, password);\n```\n\n驱动管理器遍历已注册的驱动程序，以寻找可以使用数据库\
  \ URL 中指定的子协议的驱动程序。\n\n`getConnection` 方法返回一个 `Connection` 对象。在接下来的章节中，你将看到如何使用\
  \ `Connection` 对象执行 SQL 语句。\n\n要连接数据库，你需要数据库的用户名和密码。\n\n默认情况下，Derby 允许你使用任何用户名连接，并且不检查密码。每个用户都会生成一组独立的表。默认用户名是\
  \ `app`。\n\nListing 5.1 中的测试程序将这些步骤付诸实践。它从名为 `database.properties` 的文件中加载连接参数并连接到数据库。示例代码提供的\
  \ `database.properties` 文件包含 Derby 数据库的连接信息。如果你使用不同的数据库，将你的特定数据库连接信息放入该文件。这里是连接\
  \ PostgreSQL 数据库的示例：\n\n```\njdbc.drivers=org.postgresql.Driver\njdbc.url=jdbc:postgresql:COREJAVA\n\
  jdbc.username=dbuser\njdbc.password=secret\n```\n\n连接到数据库后，测试程序执行以下 SQL 语句：\n\n\
  ```\nCREATE TABLE Greetings (Message VARCHAR(20))\nINSERT INTO Greetings VALUES\
  \ ('Hello, World!')\nSELECT * FROM Greetings\n```\n\n`SELECT` 语句的结果将被打印出来，你应该看到如下输出\n\
  \n```\nHello, World!\n```\n\n然后通过执行语句删除表\n\n```\nDROP TABLE Greetings\n```\n\n要运行此测试，按前所述启动你的数据库，并如下如下启动程序\n\
  \n```\njava -classpath driverJarPath:. test.TestDB\n```\n\n调试 JDBC 相关问题的方法是启用 JDBC\
  \ 跟踪。调用 `DriverManager.setLogWriter` 方法将跟踪消息发送到 `PrintWriter`。跟踪输出包含 JDBC 活动的详细列表。大多数\
  \ JDBC 驱动实现都提供额外的跟踪机制。例如，对于 Derby，你可以在 JDBC URL 中添加 `traceFile` 选项：`jdbc:derby://localhost:1527/COREJAVA;create=true;traceFile=trace.out`。\n\
  \n自 JDBC 4 以来，驱动 JAR 文件包含一个 `META-INF/services/java.sql.Driver` 的文件，其中包含驱动类的名称。\n\
  \n在极少数使用旧版驱动 JAR 的情况下，你需要找到供应商所使用的 JDBC 驱动类名称。然后可以在命令行上设置 `jdbc.drivers` 属性\n\n\
  ```\njava -Djdbc.drivers=driverClassName ProgramName\n```\n\n```\ntest/TestDB.java\n\
  \n\n\n\n\n```java\npackage test;\n\nimport java.nio.file.*;\nimport java.sql.*;\n\
  import java.io.*;\nimport java.util.*;\n\n/**\n * 此程序测试数据库和 JDBC 驱动程序是否配置正确。\n *\
  \ @version 1.05 2023-08-16\n * @author Cay Horstmann\n */\npublic class TestDB\n\
  {\n   public static void main(String[] args) throws IOException\n   {\n      try\n\
  \      {\n         runTest();\n      }\n      catch (SQLException e)\n      {\n\
  \         for (Throwable t : e)\n            t.printStackTrace();\n      }\n   }\n\
  \n   /**\n    * 通过创建表、添加一个值、显示表内容并删除该表\n    * 来运行测试。\n    */\n   public static void\
  \ runTest() throws SQLException, IOException\n   {\n      try (Connection conn =\
  \ getConnection();\n            Statement stat = conn.createStatement())\n     \
  \ {\n         stat.executeUpdate(\"CREATE TABLE Greetings (Message VARCHAR(20))\"\
  );\n         stat.executeUpdate(\"INSERT INTO Greetings VALUES ('Hello, World!')\"\
  );\n\n         try (ResultSet result = stat.executeQuery(\"SELECT * FROM Greetings\"\
  ))\n         {\n            if (result.next())\n               System.out.println(result.getString(1));\n\
  \         }\n         stat.executeUpdate(\"DROP TABLE Greetings\");\n      }\n \
  \  }\n\n   /**\n    * 从 database.properties 文件指定的指定的属性获取连接。\n    * @return 数据库连接\n\
  \    */\n   public static Connection getConnection() throws SQLException, IOException\n\
  \   {\n      var props = new Properties();\n      try (Reader in = Files.newBufferedReader(Path.of(\"\
  database.properties\")))\n      {\n         props.load(in);\n      }\n      String\
  \ drivers = props.getProperty(\"jdbc.drivers\");\n      if (drivers != null) System.setProperty(\"\
  jdbc.drivers\", drivers);\n      String url = props.getProperty(\"jdbc.url\");\n\
  \      String username = props.getProperty(\"jdbc.username\");\n      String password\
  \ = props.getProperty(\"jdbc.password\");\n\n      return DriverManager.getConnection(url,\
  \ username, password);\n   }\n}\n```\n\n`java.sql.DriverManager` 1.1\n\n- `static\
  \ Connection getConnection(String url, String user, String password)`\n  建立到指定数据库的连接并返回\
  \ `Connection` 对象。\n\n## 使用 JDBC 语句\n\n在接下来的章节中，你将看到如何使用 JDBC `Statement` 来执行 SQL\
  \ 语句、获取结果以及处理错误。然后我们将向你展示一个用于填充数据库的简单程序。\n\n### 执行 SQL 语句\n\n要执行 SQL 语句，首先需要创建一个\
  \ `Statement` 对象。要创建语句对象，请使用从调用 `DriverManager.getConnection` 获取的 `Connection` 对象。\n\
  \n```\nStatement stat = conn.createStatement();\n```\n\n接下来，将你想要执行的语句放入字符串中，例如：\n\
  \n```\nString command = \"\"\"\nUPDATE Books\n   SET Price = Price - 5.00\n   WHERE\
  \ Title NOT LIKE '%Introduction%'\n\"\"\";\n```\n\n然后，调用 `Statement` 接口的 `executeUpdate`\
  \ 方法：\n\n```\nstat.executeUpdate(command);\n```\n\n`executeUpdate` 方法返回受 SQL 语句影响的行数计数，或者对于对于不返回行数的语句返回\
  \ 0。例如，上一个示例中对 `executeUpdate` 的调用返回了价格降低 $5.00 的行数。\n\n`executeUpdate` 方法可以执行诸如\
  \ `INSERT`、`UPDATE` 和 `DELETE` 等操作，以及如 `CREATE TABLE` 和 `DROP TABLE` 这样的数据定义语句。然而，你需要使用\
  \ `executeQuery` 方法来执行 `SELECT` 查询。还有一个通用的 `execute` 语句可以执行任意的 SQL 语句。它通常仅用于用户交互式提供的查询。\n\
  \n当你执行查询时，你对结果感兴趣。`executeQuery` 方法返回一个 `ResultSet` 类型的对象，你可以使用它来逐行遍历结果。\n\n```\n\
  ResultSet rs = stat.executeQuery(\"SELECT * FROM Books\");\n```\n\n分析结果集的基本循环如下：\n\
  \n```\nwhile (rs.next())\n{\n   // 检查结果集中的某行\n}\n```\n\n`ResultSet` 接口的迭代协议与 `java.util.Iterator`\
  \ 接口略有不同。在这里，迭代器被初始化在第一行*之前*的位置。你必须调用一次 `next` 方法将迭代器移动到第一行。此外，它没有 `hasNext` 方法；继续调用\
  \ `next` 直到它返回 `false` 为止。\n\n结果集中行的顺序是完全随机的。除非你特专门使用 `ORDER BY` 子句对其进行排序，否则你不应该赋予行顺序以任何重要性。\n\
  \n在检查单行时，你可能想要字段的内容。大量的访问器方法可以提供这些信息。\n\n```\nString isbn = rs.getString(1);\ndouble\
  \ price = rs.getDouble(\"Price\");\n```\n\n有针对各种类型的访问器，例如 `getString` 和 `getDouble`。每个访问器都有两种形式，一个接收数值参数，另一个接收字符串参数。当你提供数值参数时，你指代具有该数字编号的列。例如，`rs.getString(1)`\
  \ 返回当前行第一列的值。\n\n与数组索引不同，数据库列号从 `1` 开始。\n\n当你提供字符串参数时，你指的是结果集中具有该名称的列。例如，`rs.getString(1)`\
  \ 返回当前行第一列的值（注：此处原文示例可能有误，通常为 `rs.getString(\"name\")`）。使用数值参数效率略高，但字符串参数会让代码更易读。例如，`rs.getDouble(\"\
  Price\")` 获取 `Price` 列的浮点值。\n\n`java.sql.Connection` 1.1\n\n- `Statement createStatement()`\n\
  \  创建一个无参数执行查询和更新的 `Statement` 对象。\n- `void close()`\n  立即关闭当前连接及其创建的 JDBC 资源。\n\
  \n`java.sql.Statement` 1.1\n\n- `ResultSet executeQuery(String sqlQuery)`\n  执行\
  \ SQL 语句并返回一个用于查看结果的 `ResultSet` 对象。\n- `int executeUpdate(String sqlStatement)`\n\
  - `long executeLargeUpdate(String sqlStatement)`\n  执行指定的 `INSERT`、`UPDATE` 或 `DELETE`\
  \ 语句。也执行如 `CREATE TABLE` 等数据定义语句。返回受影响的行数，或者对于无更新计数的语句返回 0。\n- `boolean execute(String\
  \ sqlStatement)`\n  执行指定的 SQL 语句可能会产生多个结果集和更新计数。如果第一个结果是结果集则返回 `true`，如果是更新计数则返回\
  \ `false`。调用 `getResultSet` 或 `getUpdateCount` 来检索第一个结果。\n- `ResultSet getResultSet()`\n\
  \  返回前提查询语句的结果集，如果前提语句没有结果集则返回 `null`。每个执行语句仅调用此方法一次。\n- `int getUpdateCount()`\n\
  - `long getLargeUpdateCount()`\n  返回前提更新语句影响的行数，如果前提语句是无更新计数的语句则返回 -1。每个执行语句仅调用此方法一次。\n\
  - `void close()`\n  关闭此语句及其关联的结果集。\n- `boolean isClosed()`\n  如果此语句已关闭则返回 `true`。\n\
  - `void closeOnCompletion()`\n  导致此语句在其所有结果集关闭后关闭。\n\n`java.sql.ResultSet` 1.1\n\
  \n- `boolean next()`\n  使结果集中的当前行向前移动一行。在最后一行之后返回 `false`。注意你必须调用此方法才能移动到第一行。\n\
  - `Xxx` `get``Xxx``(int columnNumber)`\n\n\n\n\n\n* `Xxx getXxx(String columnLabel)`\n\
  \  (`Xxx` 是一个如 `int`, `double`, `String`, `Date` 等类型)\n* `<T> T getObject(int columnIndex,\
  \ Class<T> type)` 7\n* `<T> T getObject(String columnLabel, Class<T> type)` 7\n\
  * `void updateObject(int columnIndex, Object x, SQLType targetSqlType)` 8\n* `void\
  \ updateObject(String columnLabel, Object x, SQLType targetSqlType)` 8\n  返回或使用给定的列索引或标签更新列的值，并将其转换为指定的类型。列标签是\
  \ SQL `AS` 子句中指定的标签，或者在没有使用 `AS` 时使用列名。\n* `int findColumn(String columnName)`\n\
  \  给出与列名关联的列索引。\n* `void close()`\n  立即关闭当前结果集。\n* `boolean isClosed()` 6\n  如果此语句已关闭，则返回\
  \ `true`。\n\n### 管理连接、语句和结果集\n\n每个 `Connection` 对象都可以创建一个或多个 `Statement` 对象。你可以对同一个\
  \ `Statement` 对象使用多个不相关的命令和查询。然而，一个语句最多有一个打开的结果集。如果你发布了多个查询并并发分析其结果，则你需要多个 `Statement`\
  \ 对象。\n\n但请注意，每个连接的语句数量是有限制的。使用 `DatabaseMetaData` 接口的 `getMaxStatements` 方法可以找出你的\
  \ JDBC 程序支持的并发打开语句的数量。\n\n在实践中，你可能不需要纠结于多个并发的结果集。如果结果集之间是相关的，你应该能够发布一个组合查询并分析单个结果。让数据库组合查询比让\
  \ Java 程序遍历多个结果集要高效得多。\n\n在对 `Statement` 对象上发布新查询或更新之前，请务必完成对任何结果集的处理。之前查询的结果集会自动关闭。\n\
  \n当你完成使用 `ResultSet`、`Statement` 或 `Connection` 时，立即调用 `close` 方法是一个好习惯。这些对象使用了大型数据结构，会耗用数据库服务器的有限资源。\n\
  \n`Statement` 对象的 `close` 方法会关闭任何关联的结果集。同样，`Connection` 类的 `close` 方法会关闭该连接的所有语句。\n\
  \n相反，你可以在 `Statement` 上调用 `closeOnCompletion` 方法，它会在所有结果集都关闭后自动关闭。\n\n如果你的连接是短寿命的，就不必担心关闭语句和结果集。为了确保连接对象不可能保持打开状态，请使用\
  \ `try`-with-resources 语句：\n\n```\ntry (Connection conn = . . .)\n{   \n   Statement\
  \ stat = conn.createStatement();\n   ResultSet result = stat.executeQuery(queryString);\n\
  \   process query result\n}\n```\n\n### 分析 SQL 异常\n\n每个 `SQLException` 都有一个 `SQLException`\
  \ 对象链，可以通过 `getNextException` 方法获取。这个异常链是在每个异常都有的 `Throwable` 对象“原因”链之外的。（有关 Java\
  \ 异常的详情，请参阅 第一卷第 7 章。）需要两个嵌套循环才能完全列出所有这些异常。幸运的是，`SQLException` 类已经增强并实现了 `Iterable<Throwable>`\
  \ 接口。`iterator()` 方法产生一个 `Iterator<Throwable>`，它可以遍历这两个链：它从开始遍历第一个 `SQLException`\
  \ 的原因链。\n\n`SQLException`\n* `SQLException getNextException()`\n  获取链在此链上的下一个异常，或返回\
  \ `null`。\n* `Iterator<Throwable> iterator()`\n  产生一个遍历这两个链的迭代器。\n* `String getSQLState()`\n\
  \  获取状态。\n* `int getErrorCode()`\n  获取错误代码。\n\n`DataTruncation`\n* `boolean getParameter()`\n\
  \  如果截断适用于参数，则返回 `true`；如果适用于列，则返回 `false`。\n* `int getIndex()`\n  返回被截断参数或列的索引。\n\
  * `int getDataSize()`\n  返回应该传输的字节数，如果值未知则返回 `-1`。\n* `int getTransferSize()`\n\
  \  返回实际传输的字节数，如果值未知则返回 `-1`。\n\n### 填充数据库\n\n我们现在准备好编写第一个 JDBC 程序了。诚然，尝试一下之前讨论的一些高级查询会很好，但我们面临一个问题：目前数据库中没有数据。我们需要填充数据库，一种简单的方法是使用一组\
  \ SQL 指令来创建表并向其中插入数据。\n\n具体来说，将在一个简单的程序中使用 JDBC，该程序读取包含 SQL 指令的文件（每行一条指令）并执行它们。\n\
  \n具体来说，程序从如下格式的文本文件中读取数据：\n\n```\nCREATE TABLE Publishers (Publisher_Id VARCHAR(6),\
  \ Name VARCHAR(30), URL VARCHAR(80));\nINSERT INTO Publishers VALUES ('0201', 'Addison-Wesley',\
  \ 'www.aw-bc.com');\nINSERT INTO Publishers VALUES ('0471', 'John Wiley & Sons',\
  \ 'www.wiley.com');\n. . .\n```\n\n列表 5.2 包含了读取并执行 SQL 语句文件的程序代码。你不需要通读代码；只需使用该程序即可填充你的数据库并运行本章剩余部分的示例。\n\
  \n确保你的数据库服务器正在运行，并按照如下方式运行程序：\n\n```bash\njava -classpath driverJarPath:. exec.ExecSQL\
  \ Books.sql\njava -classpath driverJarPath:. exec.ExecSQL Authors.sql\njava -classpath\
  \ driverJarPath:. exec.ExecSQL Publishers.sql\njava -classpath driverJarPath:. exec.ExecSQL\
  \ BooksAuthors.sql\n```\n\n\n\n\n在运行程序之前，请检查 `database.properties` 文件已针对你的环境配置好（参见第\
  \ 5.3.4 节）。\n\n你的数据库可能也有一个直接读取 SQL 文件的工具。例如，使用 Derby，你可以运行：\n\n```\njava -jar derby/lib/derbyrun.jar\
  \ ij -p ij.properties Books.sql\n```\n\n(`ij.properties` 文件在第 5.3.3 节中进行了描述。)\n\n\
  在 `ExecSQL` 命令的数据格式中，我们允许在每行末尾可选的分号，因为大多数数据库工具都期望这种格式。\n\n以下步骤简要描述了 `ExecSQL` 程序：\n\
  \n1. 连接到数据库。`getConnection` 方法读取 `database.properties` 文件中的属性，并将 `jdbc.drivers`\
  \ 属性添加到系统属性中。驱动管理器使用 `jdbc.drivers` 属性加载相应的数据库驱动程序。`getConnection` 方法使用 `jdbc.url`、`jdbc.username`\
  \ 和 `jdbc.password` 属性打开数据库连接。\n2. 打开包含 SQL 语句的文件。如果没有提供文件名，则提示用户在控制台上输入语句。\n3.\
  \ 使用通用的 `execute` 方法执行每条语句。如果它返回 `true`，则该语句有一个结果集。为本书数据库提供的四个 SQL 文件都以 `SELECT\
  \ *` 语句结束，这样你就可以看到数据已成功插入。\n4. 如果存在结果集，则打印结果。由于这是一个通用的结果集，我们需要使用元数据（metadata）来确定结果有多少列。欲需更多信息，请参见第\
  \ 5.8 节。\n5. 如果发生任何 SQL 异常，打印该异常以及其中可能包含任何链异常。\n6. 关闭与数据库的连接。\n\nListing 5.2 显示了程序的代码。\n\
  \nexec/ExecSQL.java\n\n```java\npackage exec;\n\nimport java.io.*;\nimport java.nio.file.*;\n\
  import java.util.*;\nimport java.sql.*;\n\n/**\n * 执行文件中的所有 SQL 语句。按如下方式调用此程序：<br>\n\
  \ * java -classpath driverPath:. ExecSQL commandFile\n * \n * @version 1.35 2023-08-16\n\
  \ * @author Cay Horstmann\n */\nclass ExecSQL\n{\n   public static void main(String[]\
  \ args) throws IOException\n   {\n      try (Scanner in = args.length == 0 ? new\
  \ Scanner(System.in)\n            : new Scanner(Path.of(args[0]));\n         Connection\
  \ conn = getConnection();\n         Statement stat = conn.createStatement())\n \
  \     {\n         while (true)\n         {\n            if (args.length == 0) System.out.println(\"\
  输入命令或输入 EXIT 退出:\");\n\n            if (!in.hasNextLine()) return;\n\n         \
  \   String line = in.nextLine().strip();\n            if (line.equalsIgnoreCase(\"\
  EXIT\")) return;\n            if (line.endsWith(\";\")) // 移除末尾的分号\n           \
  \    line = line.substring(0, line.length() - 1);\n            try\n           \
  \ {\n               boolean isResult = stat.execute(line);\n               if (isResult)\n\
  \               {\n                  try (ResultSet rs = stat.getResultSet())\n\
  \                  {\n                     showResultSet(rs);\n                \
  \  }\n               }\n               else\n               {\n                \
  \  int updateCount = stat.getUpdateCount();\n                  System.out.println(updateCount\
  \ + \" rows updated\");\n               }                   \n            }\n  \
  \          catch (SQLException e)\n            {\n               for (Throwable\
  \ t : e)\n                  t.printStackTrace();\n            }\n         }  \n\
  \      }\n      catch (SQLException e)\n      {\n         for (Throwable t : e)\n\
  \            t.printStackTrace();\n      }\n   }\n\n   /**\n    * 从 database.properties\
  \ 文件指定的属性中获取连接\n    * @return 数据库连接\n    */\n   public static Connection getConnection()\
  \ throws SQLException, IOException\n   {\n      var props = new Properties();\n\
  \      try (Reader in = Files.newBufferedReader(\n            Path.of(\"database.properties\"\
  )))\n      {\n         props.load(in);\n      }\n      String drivers = props.getProperty(\"\
  jdbc.drivers\");\n      if (drivers != null) System.setProperty(\"jdbc.drivers\"\
  , drivers);\n\n      String url = props.getProperty(\"jdbc.url\");\n      String\
  \ username = props.getProperty(\"jdbc.username\");\n      String password = props.getProperty(\"\
  jdbc.password\");\n\n      return DriverManager.getConnection(url, username, password);\n\
  \   }\n\n   /**\n    * 打印结果集。\n    * @param result 要打印的结果集\n    */\n   public static\
  \ void showResultSet(ResultSet result) throws SQLException\n   {\n      ResultSetMetaData\
  \ metaData = result.getMetaData();\n      int columnCount = metaData.getColumnCount();\n\
  \n      for (int i = 1; i <= columnCount; i++)\n      {\n         if (i > 1) System.out.print(\"\
  , \");\n         System.out.print(metaData.getColumnLabel(i));\n      }\n      System.out.println();\n\
  \n      while (result.next())\n      {\n         for (int i = 1; i <= columnCount;\
  \ i++)\n         {\n            if (i > 1) System.out.print(\", \");\n         \
  \   System.out.print(metaData.getColumnLabel(i));\n         }\n      }\n   }\n}\n\
  ```\n\n## 查询执行\n\n在本节中，我们编写了一个针对数据库执行查询的程序。在执行准备语句之前，你必须使用 `set` 方法为主机变量绑定值。\n\n\
  ### 准备语句（Prepared Statements）\n\n与其每次用户启动查询时都构建一个独立的查询，我们可以*准备*带有主机变量的查询并多次使用。这种技术可以提高性能。当数据库执行查询时，它首先计算执行策略。通过准备查询并复用它，你可以确保规划步骤只执行一次。\n\
  \n准备查询中的每个主机变量都用 `?` 表明。如果有多个变量，在设置值时必须跟踪 `?` 的位置。例如，我们的准备查询变为：\n\n```java\nString\
  \ publisherQuery = \"\"\"\nSELECT Books.Price, Books.Title\nFROM Books, Publishers\n\
  WHERE Books.Publisher_Id = Publishers.Publisher_Id AND Publishers.Name = ?\n\"\"\
  \";\nPreparedStatement pstat = conn.prepareStatement(publisherQuery);\n```\n\n在执行准备语句之前，你必须使用\
  \ `set` 方法将主机变量绑定到实际值。与 `ResultSet` 接口的 `get` 方法一样，不同的类型有不同的 `set` 方法。这里我们要为发布者名称设置字符串：\n\
  \n```java\npstat.setString(1, publisher);\n```\n\n第一个参数是我们要设置的主机变量的位置数字。位置 1 表示第一个\
  \ `?`。第二个参数是我们要赋值给主机变量的值。\n\n如果你复用一个已经执行过的准备查询，所有的主机变量将保持绑定状态，除非你通过 `set` 方法更改它们或调用\
  \ `clearParameters` 方法。这意味着你只需要对那些在查询之间发生变化的主机变量调用 `setXxx` 方法。\n\n一旦所有变量都绑定了值，你就可以执行该准备语句：\n\
  \n```java\nResultSet rs = pstat.executeQuery();\n```\n\n\n\n\n通过拼接字符串来手动构建查询既乏味又具有潜在的危险。你必须担心引号等特殊字符——而且，如果你的查询涉及用户输入，你必须防止注入攻击。因此，当查询涉及变量时，请始终使用预编译语句（prepared\
  \ statements）。\n\n价格更新功能是通过 `UPDATE` 语句实现的。注意，我们调用的是 `executeUpdate` 而不是 `executeQuery`，因为\
  \ `UPDATE` 语句不返回结果集。`executeUpdate` 的返回值是受影响行数。\n\n```\nint r = stat.executeUpdate();\n\
  System.out.println(r + \" rows updated\");\n```\n\n关联的 `Connection` 对象关闭后，`PreparedStatement`\
  \ 对象将失效。但许多数据库会自动缓存预编译语句。如果同一个查询被准备了两次，数据库只会重用该查询策略。因此，不必担心调用 `prepareStatement`\
  \ 的开销。\n\n列表简要描述了示例程序的结构：\n\n*   `author` 和 `publisher` 数组通过运行两个查询填充，这两个查询返回数据库中所有的作者和出版者名称。\n\
  *   涉及作者的查询是复杂的。一本书可以有多个作者，因此 `BooksAuthors` 表存储了作者与书之间的对应关系。例如，ISBN 为 `0-201-96426-0`\
  \ 的书有两个代码为 `DATE` 和 `DARW` 的作者。`BooksAuthors` 表包含以下行：\n    ```\n    0-201-96426-0,\
  \ DATE, 1\n    0-201-96426-0, DARW, 2\n    ```\n    以此指示这一事实。第三列列出了作者的顺序。（我们不能仅仅使用表中行的位置，因为关系表中没有固定的行顺序。）因此，查询必须连接\
  \ `Books`、`BooksAuthors` 和 `Authors` 表，将作者名称与用户选择的名称进行比较。\n    ```\n    SELECT Books.Price,\
  \ Books.Title FROM Books, BooksAuthors, Authors, Publishers\n    WHERE Authors.Author_Id\
  \ = BooksAuthors.Author_Id AND BooksAuthors.ISBN = Books.ISBN\n    AND Books.Publisher_Id\
  \ = Publishers.Publisher_Id AND Authors.Name = ? \n    AND Publishers.Name = ?\n\
  \    ```\n    一些 Java 程序员会避免此类复杂的 SQL 语句。一种意料常见但效率极下的变通方法是编写大量的 Java 代码来遍历多个结果集。但数据库执行查询代码的能力远比\
  \ Java 程序要得多——这正是数据库的核心竞争力。一条经验法则是：如果可以用 SQL 完成，就不要在 Java 中完成它。\n*   `changePrices`\
  \ 方法执行一个 `UPDATE` 语句。注意 `UPDATE` 语句的 `WHERE` 子句需要出版者代码，而我们只知道出版者名称。这个问题通过嵌套子查询来解决：\n\
  \    ```\n    UPDATE Books\n    SET Price = Price + ?\n    WHERE Books.Publisher_Id\
  \ = (SELECT Publisher_Id FROM Publishers WHERE Name = ?)\n    ```\n\nListing 5.3\
  \ 是完整的程序代码。\n\n`query/QueryTest.java`\n\n\n\n\n```java\npackage query;\n\nimport\
  \ java.io.*;\nimport java.nio.file.*;\nimport java.sql.*;\nimport java.util.*;\n\
  \n/**\n * 此程序演示了几个复杂的数据库查询。\n * @version 1.33 2023-08-16\n * @author Cay Horstmann\n\
  \ */\npublic class QueryTest\n{\n   private static final String allQuery = \"SELECT\
  \ Books.Price, Books.Title FROM Books\";\n\n   private static final String authorPublisherQuery\
  \ = \"\"\"\nSELECT Books.Price, Books.Title\nFROM Books, BooksAuthors, Authors,\
  \ Publishers\nWHERE Authors.Author_Id = BooksAuthors.Author_Id\n   AND BooksAuthors.ISBN\
  \ = Books.ISBN\n   AND Books.Publisher_Id = Publishers.Publisher_Id\n   AND Authors.Name\
  \ = ?\n   AND Publishers.Name = ?\n\"\"\";\n\n   private static final String authorQuery\
  \ = \"\"\"\nSELECT Books.Price, Books.Title FROM Books, BooksAuthors, Authors\n\
  WHERE Authors.Author_Id = BooksAuthors.Author_Id\" \n   AND BooksAuthors.ISBN =\
  \ Books.ISBN\"\n   AND Authors.Name = ?\n\"\"\";\n\n   private static final String\
  \ publisherQuery = \"\"\"\nSELECT Books.Price, Books.Title FROM Books, Publishers\n\
  WHERE Books.Publisher_Id = Publishers.Publisher_Id \n   AND Publishers.Name = ?\n\
  \"\"\";\n\n   private static final String priceUpdate = \"\"\"\nUPDATE Books SET\
  \ Price = Price + ? \"\nWHERE Books.Publisher_Id =\n   (SELECT Publisher_Id FROM\
  \ Publishers WHERE Name = ?)\n\"\"\";\n\n   private static Scanner in;\n   private\
  \ static ArrayList<String> authors = new ArrayList<>();\n   private static ArrayList<String>\
  \ publishers = new ArrayList<>();\n\n   public static void main(String[] args) throws\
  \ IOException\n   {\n      try (Connection conn = getConnection())\n      {\n  \
  \       in = new Scanner(System.in);\n         authors.add(\"Any\");\n         publishers.add(\"\
  Any\");\n         try (Statement stat = conn.createStatement())\n         {\n  \
  \          // 填充 authors 列表\n            String query = \"SELECT Name FROM Authors\"\
  ;\n            try (ResultSet rs = stat.executeQuery(query))\n            {\n  \
  \             while (rs.next())\n                  authors.add(rs.getString(1));\n\
  \            }\n\n            // 填充 publishers 列表\n            query = \"SELECT\
  \ Name FROM Publishers\";\n            try (ResultSet rs = stat.executeQuery(query))\n\
  \            {\n               while (rs.next())\n                  publishers.add(rs.getString(1));\n\
  \            }\n         }\n         boolean done = false;\n         while (!done)\n\
  \         {\n            System.out.print(\"Q)uery C)hange prices E)xit: \");\n\
  \            String input = in.next().toUpperCase();\n            if (input.equals(\"\
  Q\"))\n               executeQuery(conn);\n            else if (input.equals(\"\
  C\"))\n               changePrices(conn);\n            else \n               done\
  \ = true;\n         }\n      }\n      catch (SQLException e)\n      {\n        \
  \ for (Throwable t : e)\n            System.out.println(t.getMessage());\n     \
  \ }\n   }\n\n   /**\n    * 执行选定的查询。\n    * @param conn 数据库连接\n    */\n   private\
  \ static void executeQuery(Connection conn) throws SQLException\n   {\n      String\
  \ author = select(\"Authors:\", authors);\n      String publisher = select(\"Publishers:\"\
  , publishers);\n      PreparedStatement stat;\n      if (!author.equals(\"Any\"\
  ) && !publisher.equals(\"Any\"))\n      {\n         stat = conn.prepareStatement(authorPublisherQuery);\n\
  \         stat.setString(1, author);\n         stat.setString(2, publisher);\n \
  \     }\n      else if (!author.equals(\"Any\") && publisher.equals(\"Any\"))\n\
  \      {\n          stat = conn.prepareStatement(authorQuery);\n          stat.setString(1,\
  \ author);\n      }\n      else if (author.equals(\"Any\") && !publisher.equals(\"\
  Any\"))\n      {\n          stat = conn.prepareStatement(publisherQuery);\n    \
  \      stat.setString(1, publisher);\n      }\n      else\n         stat = conn.prepareStatement(allQuery);\n\
  \n      try (ResultSet rs = stat.executeQuery())\n      {\n         while (rs.next())\n\
  \            System.out.println(rs.getString(1) + \", \" + rs.getString(2));\n \
  \     }\n   }\n\n   /**\n    * 执行更新语句以更改价格。\n    * @param conn 数据库连接\n    */\n \
  \  public static void changePrices(Connection conn) throws SQLException\n   {\n\
  \      String publisher = select(\"Publishers:\", publishers.subList(1, publishers.size()));\n\
  \      System.out.print(\"Change prices by: \");\n      double priceChange = in.nextDouble();\n\
  \      PreparedStatement stat = conn.prepareStatement(priceUpdate);\n      stat.setDouble(1,\
  \ priceChange);\n      stat.setString(2, publisher);\n      int r = stat.executeUpdate();\n\
  \      System.out.println(r + \" records updated.\");\n   }\n\n   /**\n    * 询问用户选择一个字符串。\n\
  \    * @param prompt 显示的提示符 \n    * @param options 用户可以选择的选项\n    * @return 用户选择的选项\n\
  \    */\n   public static String select(String prompt, List<String> options)\n \
  \  {\n      while (true)\n      {\n         System.out.println(prompt);     \n \
  \        for (int i = 0; i < options.size(); i++)\n            System.out.printf(\"\
  %2d) %s%n\", i + 1, options.get(i));\n         int sel = in.nextInt();\n       \
  \  if (sel > 0 && sel <= options.size())\n            return options.get(sel - 1);\n\
  \      }\n   }\n\n   /**\n    * 从指定的属性获取连接。\n    * @return 连接\n    */\n   public\
  \ static Connection getConnection() throws SQLException\n   {\n      Properties\
  \ props = new Properties();\n      props.setProperty(\"user\", \"root\");\n    \
  \  props.setProperty(\"password\", \"password\");\n      String url = \"jdbc:sqlite:test.db\"\
  ;\n      return DriverManager.getConnection(url, props);\n   }\n}\n```\n\n### 读和写\
  \ LOB\n\n除了数字、字符串和日期外，许多数据库还可以存储大对象（LOB），例如图像或其他数据。在 SQL 中，二进制大对象被称为 BLOB，字符大对象被称为\
  \ CLOB。\n\n取决于应用程序，将大对象存储在数据库中还是文件系统中更好。本节将告诉你在决定使用数据库来实现该目的后该做什么。\n\n要读取 LOB，执行\
  \ `SELECT` 语句并在 `ResultSet` 上调用 `getBlob` 或 `getClob` 方法。你将获得一个 `Blob` 或 `Clob`\
  \ 类型的对象。要从 `Blob` 获取二进制数据，调用 `getBytes` 或 `getBinaryStream`。例如，如果你有一个包含书籍封面的表格，可以这样检索图像：\n\
  \n```java\nPreparedStatement pstat = conn.prepareStatement(\"SELECT Cover FROM BookCovers\
  \ WHERE ISBN=?\");\n. . .\npstat.set(1, isbn);\ntry (ResultSet result = pstat.executeQuery())\n\
  {\n   if (result.next())\n   {\n      Blob coverBlob = result.getBlob(1);\n    \
  \  Image coverImage = ImageIO.read(coverBlob.getBinaryStream());\n   }\n}\n```\n\
  \n同样，如果你检索到一个 `Clob` 对象，可以通过调用 `getSubString` 或 `getCharacterStream` 方法来获取字符数据。\n\
  \n\n\n\n要将 LOB 存入数据库，请在你的 `Connection` 对象上调用 `createBlob` 或 `createClob`，获取 LOB\
  \ 的输出流或写入器，写入数据，并将对象存储在数据库中。例如，以下是存储图像：\n\n```\nBlob coverBlob = connection.createBlob();\n\
  int offset = 0;\nOutputStream out = coverBlob.setBinaryStream(offset);\nImageIO.write(coverImage,\
  \ \"PNG\", out);\nPreparedStatement pstat = conn.prepareStatement(\"INSERT INTO\
  \ Cover VALUES (?, ?)\");\npstat.set(1, isbn);\npstat.set(2, coverBlob);\npstat.executeUpdate();\n\
  ```\n\n### java.sql.ResultSet 1.1\n\n*   `Blob getBlob(int columnIndex)` 1.2\n*\
  \   `Blob getBlob(String columnLabel)` 1.2\n*   `Clob getClob(int columnIndex)`\
  \ 1.2\n*   `Clob getClob(String columnLabel)` 1.2\n    获取指定列的 BLOB 或 CLOB。\n\n###\
  \ java.sql.Blob 1.2\n\n*   `long length()`\n    获取此 BLOB 的长度。\n*   `byte[] getBytes(long\
  \ startPosition, long length)`\n    从此 BLOB 获取给定范围内的数据。\n*   `InputStream getBinaryStream()`\n\
  *   `InputStream getBinaryStream(long startPosition, long length)`\n    返回一个流，用于从此\
  \ BLOB 或给定范围读取数据。\n*   `OutputStream setBinaryStream(long startPosition)` 1.4\n\
  \    返回一个输出流，用于从指定位置开始向此 BLOB 写入数据。\n\n### java.sql.Clob 1.4\n\n*   `long length()`\n\
  \    获取此 CLOB 的字符数。\n*   `String getSubString(long startPosition, long length)`\n\
  \    从此 CLOB 获取给定范围内的字符。\n*   `Reader getCharacterStream()`\n*   `Reader getCharacterStream(long\
  \ startPosition, long length)`\n    返回一个读取器（不是流），用于从此 CLOB 或给定范围读取字符。\n*   `Writer\
  \ setCharacterStream(long startPosition)` 1.4\n    返回一个写入器（不是流），用于从指定位置开始写入此 CLOB。\n\
  \n### java.sql.Connection 1.1\n\n*   `Blob createBlob()` 6\n*   `Clob createClob()`\
  \ 6\n    创建一个空的 BLOB 或 CLOB。\n\n### SQL 转义 (SQL Escapes)\n\n数据库通常支持“转义”语法特性，但使用的是数据库特定的语法变体。JDBC\
  \ 驱动的任务是将转义语法翻译为特定数据库的语法。\n\n以下功能提供了转义：\n\n*   日期和时间字面量\n*   调用标量函数\n*   调用存储过程\n\
  *   外连接\n*   `LIKE` 子句中的转义字符\n\n日期和时间字面量在数据库之间差异巨大。要嵌入日期或时间字面量，请按下方所示 ISO 8601/RFC\
  \ 3339 格式之一指定值，其中毫秒是可选的。驱动将将其转换为原生格式。使用 `d`、`t`、`ts` 分对应 `DATE`、`TIME` 或 `TIMESTAMP`\
  \ 值：\n\n```\n{d '2024-01-24'}\n{t '23:59:59'}\n{ts '2024-01-24 23:59:59.999'}\n\
  ```\n\n`标量函数` 是返回单个值的函数。许多函数在数据库中广泛可用，但名称不同。JDBC 规范提供了标准名称并将其翻译为特定数据库的名称。要调用函数，请按如下嵌入标准函数名和参数：\n\
  \n```\n{fn left(?, 20)}\n{fn user()}\n```\n\n你可以在 JDBC 规范中找到支持的函数名的完整列表。\n\n两个表的\
  \ `外连接` (outer join) 并不要求每个表的行都根据连接条件匹配。例如，该查询：\n\n```\nSELECT * FROM {oj Books\
  \ LEFT OUTER JOIN Publishers \nON Books.Publisher_Id = Publisher.Publisher_Id}\n\
  ```\n\n包含了某些 `Publisher_Id` 在 `Publishers` 表中没有匹配的书籍，并用 `NULL` 值表示不存在匹配。你需要使用 `RIGHT\
  \ OUTER JOIN` 来包含没有匹配书籍的出版商，或者使用 `FULL OUTER JOIN` 返回两者。大多数数据库支持所有形式的外连接，但某些并不支持。`oj`\
  \ 转义允许 JDBC 驱动定位并重写任何不支持的外连接操作。如果你的数据库支持所有形式的外连接，则无需担心此转义符号。\n\n最后，`_` 和 `%` 字符在\
  \ `LIKE` 子句中具有特殊含义——用于匹配单个字符或字符序列。没有标准方法可以字面地使用它们。如果你想匹配所有包含 `_` 的字符串，请使用此结构：\n\n\
  ```\n. . . WHERE ? LIKE %!_% {escape '!'}\n```\n\n在这里我们定义 `!` 为转义字符。组合 `!_` 表示字面上的下划线。\n\
  \n`存储过程` 是在数据库中执行的程序，使用数据库特定的语言编写。要调用存储过程，请使用 `call` 转义。如果过程没有参数，则不需要提供括号。使用 `=`\
  \ 捕获返回值：\n\n```\n{call PROC1(?, ?)}\n{call PROC2}\n{call ? = PROC3(?)}\n```\n\n\
  ### java.sql.CallableStatement\n\n要调用存储过程，使用 `call` 转义。如果过程没有参数，则不需要提供括号。使用 `=`\
  \ 捕获返回值：\n\n```\n{call PROC1(?, ?)}\n{call PROC2}\n{call ? = PROC3(?)}\n```\n\n\
  `java.sql.CallableStatement` (等待，根据文本流进行修正)\n要调用存储过程，使用 `call` 转义。如果过程没有参数，则不需要提供括号。使用\
  \ `=` 捕获返回值：\n\n```\n{call PROC1(?, ?)}\n{call PROC2}\n{call ? = PROC3(?)}\n```\n\
  \n`java.sql.CallableStatement` (等待，文本显示 `CallableStatement` 逻辑)\n要调用存储过程，使用 `call`\
  \ 转义。如果过程没有参数，则不需要提供括号。使用 `=` 捕获返回值：\n\n```\n{call PROC1(?, ?)}\n{call PROC2}\n\
  {call ? = PROC3(?)}\n```\n\n`java.sql.CallableStatement` (等待，文本显示 `CallableStatement`\
  \ 逻辑)\n要调用存储过程，使用 `call` 转义。如果过程没有参数，则不需要提供括号。使用 `=` 捕获返回值：\n\n```\n{call PROC1(?,\
  \ ?)}\n{call PROC2}\n{call ? = PROC3(?)}\n```\n\n`java.sql.CallableStatement` (等待，文本显示\
  \ `CallableStatement` 逻辑)\n要调用存储过程，使用 `call` 转义。如果过程没有参数，则不需要提供括号。使用 `=` 捕获返回值：\n\
  \n```\n{call PROC1(?, ?)}\n{call PROC2}\n{call ? = PROC3(?)}\n```\n\n`java.sql.CallableStatement`\
  \ (等待，根据源文本片段：源文本在此处截断了)*\n\n### 多重结果 (Multiple Results)\n\n一个查询可能会返回多个结果集或更新计数。这发生在执行存储过程或多个\
  \ `SELECT` 语句时。以下是获取所有结果的方法：\n\n1. 使用 `execute` 方法执行语句。\n2. 获取第一个结果集或更新计数。\n3. 重复调用\
  \ `getMoreResults` 方法移动到下一个结果集。\n4. 当没有更多结果集时结束。\n\n以下循环遍历所有结果：\n\n```\nboolean\
  \ isResult = stat.execute(command);\nboolean done = false;\nwhile (!done)\n{\n \
  \  if (isResult)\n   {\n      ResultSet result = stat.getResultSet();\n      对 result\
  \ 进行操作\n   }\n   else\n   {\n      int updateCount = stat.getUpdateCount();\n  \
  \    if (updateCount >= 0)\n         对 updateCount 进行操作\n      else\n         done\
  \ = true;\n   }\n   if (!done) isResult = stat.getMoreResults();\n}\n```\n\n###\
  \ java.sql.Statement 1.1\n\n*   `boolean getMoreResults()`\n*   `boolean getMoreResults(int\
  \ current)` 6\n    获取此语句的下一个结果。`current` 参数是 `CLOSE_CURRENT_RESULT`（默认）、`KEEP_CURRENT_RESULT`\
  \ 或 `CLOSE_ALL_RESULTS` 之一。如果存在结果且是结果集，则返回 `true`。\n\n### 获取自动生成的键 (Retrieving Autogenerated\
  \ Keys)\n\n大多数数据库支持表中行的自动编号机制。遗憾的是，这些机制在供应商之间差异巨大。这些自动数字通常用主键。虽然 JDBC 没有提供生成键的通用解决方案，但它提供了一种高效获取它们的方法。当你向表中插入新行并自动生成键时，可以使用以下代码获取它：\n\
  \n```\nstat.executeUpdate(insertStatement, Statement.RETURN_GENERATED_KEYS);\nResultSet\
  \ rs = stat.getGeneratedKeys();\nif (rs.next())\n{\n   int key = rs.getInt(1);\n\
  \   ...\n}\n```\n\n### java.sql.Statement 1.1\n\n*   `boolean execute(String statement,\
  \ int autogenerated)` 1.4\n*   `int executeUpdate(String statement, int autogenerated)`\
  \ 1.4\n    执行给定的 SQL 语句，如前所述。如果 `autogenerated` 被设置为 `Statement.RETURN_GENERATED_KEYS`\
  \ 且语句是 `INSERT` 语句，则第一列包含自动生成的键。\n\n\n\n\n\n正如你所看到的，`ResultSet` 接口的 `next` 方法会遍历结果集中的行。对于一个需要分析数据的程序来说，这足够了。然而，考虑一个显示表格或查询结果的可视化数据展示（例如图\
  \ 5.4），你通常希望用户能够在结果集中前后移动。在可滚动（scrollable）结果集中，你可以向前向后遍历结果集，甚至跳转到任何位置。\n\n此外，一旦用户看到显示的结果集内容，他们可能会想要编辑它。在可更新（updatable）结果集中，你可以编程更新条目，以便数据库自动更新。我们将在接下来的章节中讨论这些功能。\n\
  \n### 可滚动结果集 (Scrollable Result Sets)\n\n默认情况下，结果集是不可滚动且不可更新的。要从查询获取可滚动的结果集，你必须使用方法获取不同的\
  \ `Statement` 对象：\n\n```\nStatement stat = conn.createStatement(type, concurrency);\n\
  ```\n\n对于预编译语句，使用调用：\n\n```\nPreparedStatement pstat = conn.prepareStatement(command,\
  \ type, concurrency);\n```\n\n`type` 和 `concurrency` 的可能值列在表 5.6 中。你有以下选择：\n\n*\
  \   你是否希望结果集是滚动的？如果不是，使用 `ResultSet.TYPE_FORWARD_ONLY`。\n*   如果结果集是滚动的，你是否希望它反映产生该查询之后发生的数据库更改？（在我们的讨论中，假设可滚动结果集使用了\
  \ `ResultSet.TYPE_SCROLL_INSENSITIVE` 设置。这意味着结果集不会“感知”查询执行后发生的数据库更改。）\n*   你是否希望通过编辑结果集来更新数据库？（详情请见下一节。）\n\
  \n#### `ResultSet` 类型和并发值\n\n| 值 | 解释 |\n| --- | --- |\n| `TYPE_FORWARD_ONLY` |\
  \ 结果集不可滚动（默认）。 |\n| `TYPE_SCROLL_INSENSITIVE` | 结果集可滚动，但对数据库更改不敏感。 |\n| `TYPE_SCROLL_SENSITIVE`\
  \ | 结果集可滚动，且对数据库更改敏感敏感。 |\n| `CONCUR_READ_ONLY` | 结果集不能用于更新数据库（默认）。 |\n| `CONCUR_UPDATABLE`\
  \ | 结果集可以用于更新数据库。 |\n\n例如，如果你只是想能够滚动结果集但不想编辑其数据，请使用：\n\n```\nStatement stat = conn.createStatement(\n\
  \   ResultSet.TYPE_SCROLL_INSENSITIVE, ResultSet.CONCUR_READ_ONLY);\n```\n\n所有通过调用\n\
  \n```\nResultSet rs = stat.executeQuery(query);\n```\n\n返回的结果集现在都是可滚动的。可滚动结果集有一个指示当前位置的游标（cursor）。\n\
  \n并不是所有的数据库驱动程序都支持可滚动或可更新的结果集。（`DatabaseMetaData` 接口的 `supportsResultSetType` 和\
  \ `supportsResultSetConcurrency` 方法将告诉你使用特定驱动程序的特定数据库支持哪些类型和并发模式。）即使数据库支持所有结果集模式，特定的查询也可能无法产生你所请求的所有属性的结果集。（例如，复杂查询的结果集可能是不可更新的。）在这种情况下，`executeQuery`\
  \ 方法会返回一个能力较弱的 `ResultSet`，并向连接对象添加一个 `SQLWarning`。（第 5.4.3 节 显示了如何检索该警告。）或者，你可以使用\
  \ `ResultSet` 接口的 `getType` 和 `getConcurrency` 方法来查找结果集实际具有的模式。如果你不检查结果集的能力并执行不支持的操作（例如在不可滚动的结果集上执行\
  \ `previous`），该操作将抛出 `SQLException`。\n\n滚动非常简单。使用\n\n```\nif (rs.previous()) . ./;\n\
  ```\n\n向后滚动。如果游标位于实际行上，该方法返回 `true`；如果现在位于第一行之前，则返回 `false`。\n\n你可以通过调用将游标向前或向后移动任意行：\n\
  \n```\nrs.relative(n);\n```\n\n如果 `n` 为正数，游标向前移动。如果 `n` 为负数，它向后移动。如果 `n` 为零，调用没有影响。如果你尝试将游标移动到当前行集之外，它将被设置为指向最后一行之后或第一行之前，取决于\
  \ `n` 的符号。此时，该方法返回 `false` 且游标不移动。如果游标位于实际行上，方法返回 `true`。\n\n或者，你可以将游标设置为特定的行号：\n\
  \n```\nrs.absolute(n);\n```\n\n获取当前行号，调用：\n\n```\nint currentRow = rs.getRow();\n\
  ```\n\n结果集的第一行是 `1`。`first`、`last`、`before` 和 `after` 方法会将游标移动到第一行、最后一行、第一行之前或最后一行之后。\n\
  \n最后，`isFirst`、`isLast`、`isBefore` 和 `isAfter` 方法测试游标是否位于这些特殊位置。\n\n使用滚动结果集非常简单。驱动程序会在后台缓存查询数据。\n\
  \n### 可更新结果集 (Updatable Result Sets)\n\n如果你想编辑结果集数据并让更改自动反映到数据库，请创建一个更新的结果集。可更新的结果集不需要是滚动的，但如果你向用户展示数据进行编辑，通常希望允许滚动。\n\
  \n要获取可更新的结果集，如下如下创建语句：\n\n```\nStatement stat = conn.createStatement(\n   ResultSet.TYPE_SCROLL_INSENSITIVE,\
  \ ResultSet.CONCUR_UPDATABLE);\n```\n\n调用 `executeQuery` 返回的结果集就是可更新的。\n\n并不是所有查询都返回可更新的结果集。如果你的查询涉及多个表的连接，结果可能不可更新。然而，如果你的查询仅涉及单个表，或者通过主键连接多个表，那么你应该预期结果集是可更新的。调用\
  \ `ResultSet` 接口的 `getConcurrency` 方法可以确定。\n\n例如，假设你想提高某些书籍的价格，但你没有简单的 `UPDATE`\
  \ 语句标准。那么，你可以遍历所有书籍并根据任意条件更新价格。\n\n```\nString query = \"SELECT * FROM Books\";\n\
  ResultSet rs = stat.executeQuery(query);\nwhile (rs.next())\n{\n   if (. . .)\n\
  \   {\n      double increase = . . .;\n      double price = rs.getDouble(\"Price\"\
  );\n      rs.updateDouble(\"Price\", price + increase);\n      rs.updateRow(); //\
  \ 更新字段后确保调用 updateRow\n   }\n}\n```\n\n对于所有对应 SQL 类型的数据类型都有 `updateXxx` 方法，例如 `updateDouble`、`updateString`\
  \ 等；指定列名称或编号（与 `getXxx` 方法相同），然后是字段的新值。\n\n`updateXxx` 方法仅更改行值，而不是数据库。当你完成某行中的字段更新后，必须调用\
  \ `updateRow` 方法。该方法会将当前行中的所有更新发送到数据库。如果你在调用 `updateRow` 之前移动游标到另一行，该行的更新将从结果集中丢弃，且不会传递到数据库。你也可以调用\
  \ `cancelRowUpdates` 方法来取消当前行的更新。\n\n\n\n\n前面的示例展示了如何修改现有行。如果你想向数据库添加新的一行，首先使用 `moveToInsertRow`\
  \ 方法将游标移动到一个特殊位置，称为 `*insert row（插入行）*`。然后，通过发布 `updateXxx` 指令在插入行位置构建一个新行。完成后，调用\
  \ `insertRow` 方法将新行提交到数据库。完成插入后，调用 `moveToCurrentRow` 将游标移回调用 `moveToInsertRow`\
  \ 之前的位置。这是一个示例：\n\n```\nrs.moveToInsertRow();\nrs.updateString(\"Title\", title);\n\
  rs.updateString(\"ISBN\", isbn);\nrs.updateString(\"Publisher_Id\", pubid);\nrs.updateDouble(\"\
  Price\", price);\nrs.insertRow();\nrs.moveToCurrentRow();\n```\n\n注意，你无法影响新数据添加到结果集或数据库的*位置*。\n\
  \n如果你没有在插入行中指定列值，它将被设为 SQL `NULL`。但是，如果该列具有 `NOT NULL`（非空）约束，则会抛出异常且该行不会被插入。\n\n\
  最后，你可以删除游标所在的行：\n\n```\nrs.deleteRow();\n```\n\n`deleteRow` 方法会立即从结果集和数据库中删除该行。\n\
  \n`ResultSet` 接口的 `updateRow`、`insertRow` 和 `deleteRow` 方法赋予你与执行 `UPDATE`、`INSERT`\
  \ 和 `DELETE` SQL 语句相同的权限。然而，Java 程序员可能会发现，通过结果集操作数据库内容比通过构建 SQL 语句更自然。\n\n如果你不小心，使用可更新的结果集可能会写出效率极低的代码。执行一个\
  \ `UPDATE` 语句比执行查询并遍历结果在途中更改数据要效率*高得多*。可更新的结果集对于那些用户可以进行任意更改的交互式程序是有意义的，但对于大多数程序化的更改，SQL\
  \ `UPDATE` 更为合适。\n\nJDBC 2 对结果集进行了进一步的增强，例如如果数据被另一个并发数据库连接修改了，则具有能够使用最新数据更新结果集的能力。JDBC\
  \ 3 增加了另一项改进，指定了事务提交时结果集的行为。然而，这些高级功能超出了本介绍性章节的范围。更多信息，请参阅由 Maydene Fisher、Jon Ellis\
  \ 和 Jonathan Bruce 编写的*JDBC^™ API Tutorial and Reference, Third Edition*（Addison-Wesley,\
  \ 2003）以及 JDBC 规范。\n\n## java.sql.Connection 1.1\n\n* `Statement createStatement(int\
  \ type, int concurrency)` 1.2\n* `PreparedStatement prepareStatement(String command,\
  \ int type, int concurrency)` 1.2\n  创建一个产生给定类型和并发性结果集的语句或预编译语句。。`type` 参数为常量 `TYPE_FORWARD_ONLY`、`TYPE_SCROLL_INSENSITIVE`\
  \ 或 `TYPE_SCROLL_SENSITIVE`，`concurrency` 是常量 `CONCUR_READ_ONLY` 或 `CONCUR_UPDATABLE`\
  \ 之一，这些都定义在 `ResultSet` 接口中。\n\n## java.sql.ResultSet 1.1\n\n* `int getType()` 1.2\n\
  \  返回此结果集的类型——`TYPE_FORWARD_ONLY`、`TYPE_SCROLL_INSENSITIVE` 或 `TYPE_SCROLL_SENSITIVE`\
  \ 之一。\n* `int getConcurrency()` 1.2\n  返回此结果集的并发设置——`CONCUR_READ_ONLY` 或 `CONCUR_UPDATABLE`\
  \ 之一。\n* `boolean previous()` 1.2\n  将游标移动到上一行。如果游标位于某行上，返回 `true`；如果游标位于第一行之前，则返回\
  \ `false`。\n* `int getRow()` 1.2\n  获取当前行的行号。行从 `1` 开始编号。\n* `boolean absolute(int\
  \ r)` 1.2\n  将游标移动到第 `r` 行。如果游标位于某行上，返回 `true`。\n* `boolean relative(int d)` 1.2\n\
  \  将游标移动 `d` 行。如果 `d` 为负，游标向后移动。如果游标位于某行上，返回 `true`。\n* `boolean first()` 1.2\n\
  * `boolean last()` 1.2\n  将游标移动到第一行或最后一行。如果游标位于某行上，返回 `true`。\n* `void beforeFirst()`\
  \ 1.2\n* `void afterLast()` 1.2\n  将游标移动到第一行之前或最后一行之后。\n* `boolean isFirst()` 1.2\n\
  * `boolean isLast()` 1.2\n  测试游标是否在第一行或最后一行。\n* `boolean isBeforeFirst()` 1.2\n\
  * `boolean isAfterLast()` 1.2\n  测试游标是否在第一行之前或最后一行之后。\n* `void moveToInsertRow()`\
  \ 1.2\n  将游标移动到插入行。插入行是一个用于通过 `updateXxx` 和 `insertRow` 方法插入新数据的特殊行。\n* `void moveToCurrentRow()`\
  \ 1.2\n  将游标从插入行移回调用 `moveToInsertRow` 方法时其占据的行。\n* `void insertRow()` 1.2\n  将插入行的内容插入数据库和结果集。\n\
  * `void deleteRow()` 1.2\n  从结果集和数据库中立即删除该行。\n* `void updateXxx(int column, Xxx\
  \ data)` 1.2\n* `void updateXxx(String columnName, Xxx data)` 1.2\n  (`Xxx` 是如 `int`、`double`、`String`、`Date`\
  \ 等类型）\n  更新结果集中行的字段。\n* `void updateRow()` 1.2\n  将行更新提交到数据库。\n* `void cancelRowUpdates()`\
  \ 1.2\n  取消行更新。\n\n## java.sql.DatabaseMetaData 1.1\n\n* `boolean supportsResultSetType(int\
  \ type)` 1.2\n  如果数据库支持给定类型的类型，返回 `true`；`type` 是 `TYPE_FORWARD_ONLY`、`TYPE_SCROLL_INSENSITIVE`\
  \ 或 `TYPE_SCROLL_SENSITIVE` 之一。\n* `boolean supportsResultSetConcurrency(int type,\
  \ int concurrency)` 1.2\n  如果数据库支持给定类型和并发性的结果集，返回 `true`；`type` 参数是常量 `TYPE_FORWARD_ONLY`、`TYPE_SCROLL_INSENSITIVE`\
  \ 或 `TYPE_SCROLL_SENSITIVE`，`concurrency` 是 `CONCUR_READ_ONLY` 或 `CONCUR_UPDATABLE`。\n\
  \n## Row Sets\n\n滚动结果集功能强大，但它们有一个主要的缺点：你需要在整个交互过程中保持数据库连接。然而，用户可能会离开电脑很长时间，导致连接被占用。这是不好的——连接是稀缺资源。在这种情况下，请使用*行集*。\n\
  \n如果你需要将查询结果移动到应用程序的其他层，或者移动到另一个设备（如手机），行集也是合适的。你永远不想移动结果集——它的数据结构巨大，并且绑定数据库连接。\n\
  \n### 构建行集\n\n`javax.sql.rowset` 包提供了扩展 `RowSet` 接口的以下接口：\n\n* `CachedSet` 允许离线操作。我们将在下一节讨论缓存行集。\n\
  * `WebRowSet` 是可以保存到 XML 文件的缓存行集。该 XML 文件可以移动到 Web 应用的其他层，由另一个 `WebRowSet` 对象打开。\n\
  * `FilteredRowSet` 和 `JoinRowSet` 接口支持行集的轻量级操作，等同于 SQL `SELECT` 和 `JOIN` 操作。这些操作在存储在行集的数据上执行，无需建立数据库连接。\n\
  * `JdbcRowSet` 是 `ResultSet` 的薄封装。它增加了 `RowSet` 接口的有用方法。\n\n要获取缓存行集，调用：\n\n```\n\
  RowSetFactory factory = RowSetProvider.newFactory();\nCachedRowSet crs = factory.createCachedRowSet();\n\
  ```\n\n获取其他行集类型也有类似的方法。\n\n\n\n\n缓存行集（cached row set）包含了结果集中的所有数据。由于 `CachedRowSet`\
  \ 是 `ResultSet` 接口的子接口，你可以像使用 `ResultSet` 一样完全使用缓存行集。缓存行集提供了一项重要优势：你可以关闭连接并继续使用该行集。正如我们在列表\
  \ 5.4 的示例程序中所看到的，这极大地简化了交互式应用程序的实现。每个用户命令只需打开数据库连接、发出查询、将结果放入缓存行集，然后关闭数据库连接即可。\n\
  \n甚至可以修改缓存行集中的数据。当然，这些修改不会立即反映在数据库中；你需要显式地请求来接受积累的更改。随后，`CachedRowSet` 将重新连接到数据库并执行\
  \ SQL 语句以写入积累的更改。\n\n你可以从结果集填充一个 `CachedRowSet`：\n\n```\nResultSet result = . .\
  \ .;\nRowSetFactory factory = RowSetProvider.newFactory();\nCachedRowSet crs = factory.createCachedRowSet();\
  \ \ncrs.populate(result);\nconn.close(); // 现在关闭数据库连接是安全的\n```\n\n或者，你可以让 `CachedRowSet`\
  \ 对象自动建立连接。设置数据库参数：\n\n```\ncrs.setURL(\"jdbc:derby://localhost:1527/COREJAVA\"\
  );\ncrs.setUsername(\"dbuser\");\ncrs.setPassword(\"secret\");\n```\n\n然后设置查询语句和任何参数：\n\
  \n```\ncrs.setCommand(\"SELECT * FROM Books WHERE Publisher_Id = ?\");\ncrs.setString(1,\
  \ publisherId);\n```\n\n最后，用查询结果填充行集：\n\n```\ncrs.execute();\n```\n\n此调用会建立数据库连接、发出查询、填充行集并断开连接。\n\
  \n如果你的查询结果非常大，你可能不想将其全部放入行集中的。毕竟，你的用户可能只会查看几行。在这种情况下，请指定页大小：\n\n```\nCachedRowSet\
  \ crs = . . .;\ncrs.setCommand(command);\ncrs.setPageSize(20);\n. . .\ncrs.execute();\n\
  ```\n\n现在你只会得到 20 行。要获取下一批行，请调用\n\n```\ncrs.nextPage();\n```\n\n你可以使用与用于结果集的相同方法来检查和修改行集。如果你修改了行集内容，必须通过调用将其写回数据库：\n\
  \n```\ncrs.acceptChanges(conn);\n```\n\n或者\n\n```\ncrs.acceptChanges();\n```\n\n\
  第二种调用仅在你为行集配置了连接数据库所需的信息（如 URL、用户名和密码）时才起作用。\n\n在第 5.6.2 节中，你已经看到并非所有结果集都是可更新的。同样，包含复杂查询结果的行集将无法将其更改写回数据库。如果你的行集包含来自单个表的数据，那么通常是安全的。\n\
  \n如果你是从结果集填充行集的，那么行集并不知道要更新的表名。你需要调用 `setTableName` 来设置表名。\n\n如果数据库中的数据在你填充行集后发生了变化，则会产生另一个复杂性。这显然是可能出现问题的迹象，可能导致数据不一致。参考实现会检查原始行集值（即编辑前的值）是否与数据库中的当前值相同。如果是，它们将被替换为编辑后的值；否则，将抛出\
  \ `SyncProviderException` 且任何更改都不会被写入。其他实现可能使用其他的同步策略。\n\n### javax.sql.RowSet 1.4\n\
  \n* `String getURL()`\n* `void setURL(String url)`\n  获取或设置数据库 URL。\n* `String getUsername()`\n\
  * `void setUsername(String username)`\n  获取或设置连接数据库的用户名。\n* `String getPassword()`\n\
  * `void setPassword(String password)`\n  获取或设置连接数据库的密码。\n* `String getCommand()`\n\
  * `void setCommand(String command)`\n  获取或设置用于填充此行集的执行的命令。\n* `void execute()`\n\
  \  通过执行用 `setCommand` 设置的语句来填充此行集。为了让驱动管理器获取连接，必须设置 URL、用户名和密码。\n\n### javax.sql.rowset.CachedRowSet\
  \ 5.0\n\n* `void execute(Connection conn)`\n  通过执行用 `setCommand` 设置的语句来填充此行集。此方法使用给定的连接*并关闭它*。\n\
  * `void populate(ResultSet result)`\n  使用来自给定结果集的数据填充此缓存行集。\n* `String getTableName()`\n\
  * `void setTableName(String tableName)`\n  获取或设置填充此缓存行集的表名。\n* `int getPageSize()`\n\
  * `void setPageSize(int size)`\n  获取或设置页大小。\n* `boolean nextPage()`\n* `boolean\
  \ previousPage()`\n  加载下一页或上一页行。如果存在下一页或上一页，则返回 `true`。\n* `void acceptChanges()`\n\
  * `void acceptChanges(Connection conn)`\n  重新连接到数据库并写入编辑行集产生的更改。如果数据无法写回，可能会抛出 `SyncProviderException`。\n\
  \n### javax.sql.rowset.RowSetProvider 7\n\n* `static RowSetFactory newFactory()`\n\
  \  创建行集工厂。\n\n### javax.sql.rowset.RowSetFactory 7\n\n* `CachedRowSet createCachedRowSet()`\n\
  * `FilteredRowSet createFilteredRowSet()`\n* `JdbcRowSet createJdbcRowSet()`\n*\
  \ `JoinRowSet createJoinRowSet()`\n* `WebRowSet createWebRowSet()`\n  创建指定类型的行集。\n\
  \n## 元数据 (Metadata)\n\n在前面的节中，你已经学习了如何填充、查询和更新数据库表。然而，JDBC 还可以提供关于数据库及其*结构*的附加信息。例如，你可以获取特定数据库的表列表或表的列名和类型。对于实现预定义的数据库业务应用程序来说，这些信息并不有用。毕竟，如果你设计了表，你就知道它们的结构。但是，对于编写适用于任何数据库工具的程序员来说，结构信息极其有用。\n\
  \n在 SQL 中，描述数据库或其部分的数据被称为元数据（以区别于存储在数据库的数据）。你可以获取三种元数据：关于数据库的、关于结果集的以及关于准备语句参数的。\n\
  \n要获取更多关于数据库的信息，从数据库数据库请求 `DatabaseDatabase```Database\n\n```DatabaseDatabase. =\
  \ conn.getMetaDataMetaData``````对象获取此对象。例如，调用\n\n```\nResultSet mrs = meta.getTables(null,\
  \ null, null, new String[] { \"TABLE\" });\n```\n\n返回一个包含数据库所有表信息的结果集。（参见本节末尾的 API\
  \ 注意该方法的其他参数。）\n\n结果集的每行包含数据库中一个表的信息。第三列是表名。（再次参见 API 注意了解其他列。）以下循环收集所有的表名：\n\n\
  ```\nwhile (mrs.next())\n   tableNames.add(mrs.getString(3));\n```\n\n数据库元数据还有第二个重要的用途。数据库是复杂的，SQL\
  \ 标准为变异性留了大量空间。`DatabaseMetaData` 接口中有一百多个方法可以查询数据库，包括具有此类奇特名称的调用：\n\n```\nmeta.supportsCatalogsInPrivilegeDefinitions()\n\
  ```\n\n和\n\n```\nmeta.nullPlusNonNullIsNull()\n```\n\n显然，这些是为具有特殊需求的高级用户准备的——特别是那些需要编写适用于多个数据库的高可移植性代码的人。\n\
  \n\n\n\n\n`DatabaseMetaData` 接口提供了有关数据库的数据。第二个元数据接口 `ResultSetMetaData` 报告了有关结果集的信息。每当你从查询获得结果集时，你都可以查询列数以及每个列的名称、类型和字段宽度。这里有一个典型的循环：\n\
  \n```\nResultSet rs = stat.executeQuery(\"SELECT * FROM \" + tableName);\nResultSetMetaData\
  \ rsmd = rs.getMetaData();\nfor (int i = 1; i <= rsmd.getColumnCount(); i++)\n{\n\
  \   String columnName = rsmd.getColumnLabel(i);\n   int columnWidth = rsmd.getColumnDisplaySize(i);\n\
  \   . . .\n}\n```\n\n如果你有一个预编译语句（prepared statement），你可以获取执行该语句时返回的结果集的元数据：\n\n\
  ```\nPreparedStatement pstat = conn.prepareStatement(. . .);\nResultSetMetaData\
  \ rsmd = pstat.getMetaData();\n```\n\n第三种元数据描述了预编译语句的参数：\n\n```\nParameterMetaData\
  \ pmd = pstat.getParameterMetaData();\nfor (int i = 1; i <= pmd.getParameterCount())\n\
  {\n   System.out.println(pmd.getParameterTypeName(i));\n}\n```\n\n列表 5.4 中的程序使用元数据允许你浏览数据库中的所有表并进行简单的编辑。该程序还阐明了缓存行集（cached\
  \ row set）的使用。\n\n配套代码有一个更美化的 GUI 版本。顶部的组合框显示数据库中的所有表。选择其中一个，框架中心就会填充该表的字段名和第一行的行值，如图图\
  \ 5.6 所示。点击“下一个”（Next）和“上一个”（Previous）可以滚动查看表中的行。你还可以删除一行并编辑 `String` 类型的数值。点击“保存”（Save）按钮将更改保存到数据库。\n\
  \n![Figure](img/fig04-08.jpg) `ViewDB` GUI 应用\n\n示例程序向你展示了如何实现用于任意表的工具。许多数据库和 IDE\
  \ 都带有更复杂的工具来查看和编辑表。如果你倾向于使用独立程序，请查看 DBeaver (`https://dbeaver.io`) 或 SQuirreL (`https://https://squirrelsql.org`)。这些程序可以与任何\
  \ JDBC 数据库配合。\n\n`view/ViewDB2.java`\n\n```java\npackage view;\n\nimport java.io.*;\n\
  import java.nio.file.*;\nimport java.sql.*;\nimport java.util.*;\n\nimport javax.sql.rowset.*;\n\
  \nimport util.*;\n\n/**\n * 此程序使用元数据显示数据库中的任意表。\n * @version 1.0 2023-08-16\n *\
  \ @author Cay Horstmann\n */\npublic class ViewDB2\n{\n   private CachedRowSet crs;\n\
  \   private Scanner console;\n\n   record Column(String label, int width, String\
  \ columnClass) {}\n   private List<Column> columns = new ArrayList<>();\n\n   public\
  \ static void main(String[] args)\n   {\n      new ViewDB2().run();\n   }\n\n  \
  \ public void run()\n   {\n      try (Connection conn = getConnection(readDatabaseProperties()))\n\
  \      {\n         console = new Scanner(System.in);\n         DatabaseMetaData\
  \ meta = conn.getMetaData();\n         var tableNames = new ArrayList<String>();\n\
  \n         try (ResultSet mrs = meta.getTables(null, null, null, new String[] {\
  \ \"TABLE\" }))\n         {\n            while (mrs.next())\n               tableNames.add(mrs.getString(3));\n\
  \         }\n         System.out.println(\"Choose a table\");\n         String selected\
  \ = Choices.choose(console, tableNames);\n         showTable(selected, conn);\n\
  \         executeCommands();         \n         crs.acceptChanges(conn);\n     \
  \ }\n      catch (SQLException e)\n      {\n         for (Throwable t : e)\n   \
  \         t.printStackTrace();\n      }      \n      catch (IOException e)\n   \
  \   {\n         e.printStackTrace();\n      }\n   }      \n\n   /**\n    * 为显示新表准备列列表，并显示第一行。\n\
  \    * @param tableName 要显示的表名\n    * @param conn 数据库连接\n    */\n   public void\
  \ showTable(String tableName, Connection conn) throws SQLException\n   {\n     \
  \ try (Statement stat = conn.createStatement();\n            ResultSet result =\
  \ stat.executeQuery(\"SELECT * FROM \" + tableName))\n      {\n         // 拷贝到缓存行集\n\
  \         RowSetFactory factory = RowSetProvider.newFactory();            \n   \
  \      crs = factory.createCachedRowSet();\n         crs.setTableName(tableName);\n\
  \         crs.populate(result);\n\n         ResultSetMetaData rsmd = result.getMetaData();\n\
  \         for (int i = 1; i <= rsmd.getColumnCount(); i++)\n         {\n       \
  \     columns.add(new Column(rsmd.getColumnLabel(i), \n                  rsmd.getColumnDisplaySize(i),\
  \ \n                  rsmd.getColumnClassName(i)));\n         }\n\n         showNextRow();\n\
  \      }\n   }\n\n   public void executeCommands() throws SQLException\n   {\n \
  \     while (true)\n      {\n         String selection = Choices.choose(console,\
  \ \"Next\", \"Previous\", \"Edit\", \"Delete\", \"Quit\");\n         switch (selection)\n\
  \         {\n            case \"Next\" -> showNextRow();\n            case \"Previous\"\
  \ -> showPreviousRow();\n            case \"Edit\" -> editRow();\n            case\
  \ \"Delete\" -> deleteRow();\n            case \"Quit\" -> return;\n         }\n\
  \      }\n   }\n\n   /**\n    * 将更改的数据更新到行集的当前行。\n    */\n   public void editRow()\
  \ throws SQLException\n   {\n      List<String> editableColumns = columns.stream()\n\
  \            .filter(c -> c.columnClass.equals(\"java.String\"))\n            .map(Column::label)\n\
  \            .toList();\n      System.out.println(\"Choose column\");\n      String\
  \ label = Choices.choose(console, editableColumns);\n      System.out.print(\"New\
  \ value: \");\n      String newValue = console.nextLine();\n      crs.updateString(label,\
  \ newValue);\n      crs.updateRow();\n   }\n\n   /**\n    * 从 database.properties\
  \ 文件中读取属性。\n    */\n   private Properties readDatabaseProperties() throws IOException\n\
  \   {\n      var props = new Properties();\n      try (Reader in = Files.newBufferedReader(Path.of(\"\
  database.properties\")))\n      {\n         props.load(in);\n      }\n      String\
  \ drivers = props.getProperty(\"jdbc.drivers\");\n      if (drivers != null) System.setProperty(\"\
  jdbc.drivers\", drivers);\n      return props;\n   }\n\n   /**\n    * 根据 database.properties\
  \ 文件中指定的属性获取连接。\n    * @return 数据库连接\n    */\n   private Connection getConnection(Properties\
  \ props) throws SQLException\n   {\n      String url = props.getProperty(\"jdbc.url\"\
  );\n      String username = props.getProperty(\"jdbc.username\");\n      String\
  \ password = props.getProperty(\"jdbc.password\");\n\n      return DriverManager.getConnection(url,\
  \ username, password);\n   }\n\n   /**\n    * 通过列的值显示数据库行。\n    */\n   public void\
  \ showRow(ResultSet rs) throws SQLException\n   {\n      for (int i = 1; i <= columns.size();\
  \ i++)\n      {\n         String format = \"%%s [%%ds]%%n\".formatted(columns.get(i\
  \ - 1).label(), i);\n         System.out.printf(format, rs == null ? \"\" : rs.getString(i));\n\
  \      }\n   }\n\n   /**\n    * 移动到下一行行并显示。\n    */\n   public void showNextRow()\
  \ throws SQLException\n   {\n      if (crs == null || crs.isLast()) return;\n  \
  \    crs.next();\n      showRow(crs);\n   }\n\n   /**\n    * 移动到上一行行并显示。\n    */\n\
  \   public void showPreviousRow() throws SQLException\n   {\n      if (crs == null\
  \ || crs.isFirst()) return;\n      crs.previous();\n      showRow(crs);\n   }\n\n\
  \   /**\n    * 删除当前行。\n    */\n   public void deleteRow() throws SQLException \n\
  \   {\n      if (crs == null) return;\n      crs.deleteRow();\n      if (crs.isAfterLast())\n\
  \      {\n         crs = null;\n      }\n      showRow(crs);\n   }\n}\n```\n\n\n\
  \n返回目录中符合模式、表名模式以及类型标准的表表的描述。（`schema` 描述了一组相关的表和访问权限。`catalog` 描述了一个相关的 schema\
  \ 组。这些概念对于构建大型数据库至关重要。）\n\n`catalog` 和 `schemaPattern` 参数可以为 `\"\"` 以检索没有目录或模式的表，或者为\
  \ `null` 以返回无论目录或模式如何的表。\n\n`types` 数组包含要包含的表类型名称。典型类型有 `TABLE`、`VIEW`、`SYSTEM TABLE`、`GLOBAL\
  \ TEMPORARY`、`LOCAL TEMPORARY`、`ALIAS` 和 `SYNONYM`。如果 `types` 为 `null`，则返回所有类型的表。\n\
  \n结果集包含五列，类型均为 `String`。\n\n| 列 | 名称 | 解释 |\n| --- | --- | --- |\n| `1` | `TABLE_CAT`\
  \ | 表目录（可能为 `null`） |\n| `2` | `TABLE_SCHEM` | 表模式（可能为 `null`） |\n| `3` | `TABLE_NAME`\
  \ | 表名 |\n| `4` | `TABLE_TYPE` | 表类型 |\n| `5` | `REMARKS` | 表的注释 |\n\n*   `int getJDBCMajorVersion()`\
  \ 1.4\n*   `int getJDBCMinorVersion()` 1.4\n\n返回建立数据库连接的驱动程序的 JDBC 主版本或次版本号。例如，JDBC\
  \ 4.3 驱动的主版本号为 4，次版本号为 3。\n\n*   `int getMaxConnections()`\n返回允许此数据库的最大并发连接数。\n\n\
  *   `int getMaxStatements()`\n返回每个数据库连接允许的最大并发打开语句数，如果数量不受限制或未知，则返回 `0`。\n\n`java.sql.ResultSet`\
  \ 1.1\n\n*   `ResultSetMetaData getMetaData()`\n返回与当前 `ResultSet` 列相关的元数据。\n\n`java.sql.PreparedStatement`\
  \ 1.1\n\n*   `ResultSetMetaData getMetaData()` 1.2\n返回与执行此语句时返回的结果集相关的元数据。\n*  \
  \ `ParameterMetaData getMetaData()` 1.4\n返回描述此语句参数的元数据。\n\n`java.sql.ResultSetMetaData`\
  \ 1.1\n\n*   `int getColumnCount()`\n返回当前 `ResultSet` 对象中的列数。\n*   `String getColumnName(int\
  \ column)`\n*   `String getColumnLabel(int column)`\n*   `int getColumnDisplaySize(int\
  \ column)`\n返回给定从 1 开始索引的列的名称、建议标题和显示大小。\n\n`java.sql.ParameterMetaData` 1.4\n\n\
  *   `int getParameterCount()`\n返回预编译语句的参数个数。\n*   `int getParameterType(int param)`\n\
  *   `String getParameterTypeName(int param)`\n*   `String getParameterClassName(int\
  \ param)`\n返回给定从 1 开始索引的参数的类型，其形式可以是 `java.sql.Types` 中定义的常量、数据库特定的类型名称，或者是完全限定的\
  \ Java 类名。\n*   `int getParameterMode(int param)`\n返回给定从 1 开始索引的参数的模式，其为静态常量 `parameterModeIn`、`parameterModeOut`、`parameterModeInOut`\
  \ 或 `parameterModeUnknown` 之一。\n*   `int isNullable(int param)`\n返回给定从 1 开始索引的参数的可空性模式，其为静态常量\
  \ `parameterNoNulls`、`parameterNullable` 或 `parameterNullableUnknown` 之一。\n*   `int\
  \ getPrecision(int param)`\n返回给定从 1 开始索引的参数的最大列大小。对于非数值数据类型，这是字符串或字符串表示的长度，或者是二进制数据的字节数。\n\
  *   `int getScale(int param)`\n返回给定从 1 开始索引的参数在小数点后的数字位数，对于非数值数据则返回 0。\n\n## 事务\
  \ (Transactions)\n\n你可以将一组语句组合形成一个 `transaction`（事务）。当一切顺利时，事务可以被 `committed`（提交）——或者，如果其中一个语句发生错误，可以进行\
  \ `rolled back`（回滚），就像这些语句从未发布过一样。\n\n将语句分组为事务的主要原因是 `database integrity`（数据库完整性）。例如，假设我们要从一个银行账户转账到另一个。那么，同时扣除一个账户并增加另一个账户是非常重要的。如果系统在扣除第一个账户后但在增加另一个账户之前失败，则需要撤销扣除操作。\n\
  \n如果你将更新语句分组到一个事务中，该事务要么完全成功并可以 `committed`，要么在中间某个地方失败。在这种情况下，你可以执行 `rollback`（回滚），数据库会自动撤销自上一次提交事务以来发生的所有更新的影响。\n\
  \n### 使用 JDBC 编写事务\n\n默认情况下，数据库连接处于 `autocommit mode`（自动提交模式），每个 SQL 语句在执行后都会立即提交到数据库。一旦语句被提交，你就无法对其进行回滚。关闭此默认设置以便使用事务：\n\
  \n```\nconn.setAutoCommit(false);\n```\n\n按照通常方式创建一个语句对象：\n\n```\nStatement stat\
  \ = conn.createStatement();\n```\n\n任意多次调用 `executeUpdate`：\n\n```\nstat.executeUpdate(command1);\n\
  stat.executeUpdate(command2);\nstat.executeUpdate(command3);\n. . .\n```\n\n如果所有语句都已无错误地执行，调用\
  \ `commit` 方法：\n\n```\nconn.commit();\n```\n\n然而，如果发生错误，调用\n\n```\nconn.rollback();\n\
  ```\n\n然后，自上一次提交以来的所有语句都会自动反转。通常当你的事务被 `SQLException` 中断时，你会签发回滚。\n\n### 存点 (Save\
  \ Points)\n\n对于某些数据库和驱动程序，你可以通过使用 `save points`（保存点）对回滚过程进行更细粒度的控制。创建保存点标记了一个点，你稍后可以返回该点，而无需放弃整个事务。例如：\n\
  \n```\nStatement stat = conn.createStatement(); // 开始事务；rollback() 在此处执行\nstat.executeUpdate(command1);\n\
  Savepoint svpt = conn.setSavepoint(); // 设置保存点；rollback(svpt) 在此处执行\nstat.executeUpdate(command2);\n\
  \nif (. . .) conn.rollback(svpt); // 撤销 command2 的影响\n. . .\nconn.commit();\n```\n\
  \n当你不再需要保存点时，应该释放它：\n\n```\nconn.releaseSavepoint(svpt);\n```\n\n### 批量更新 (Batch\
  \ Updates)\n\n假设一个程序需要执行许多 `INSERT` 语句来填充表。你可以通过使用 `batch update`（批量更新）来提高程序的性能。在批量更新中，一组语句被收集并作为批提交。\n\
  \n使用 `DatabaseMetaData` 接口的 `supportsBatchUpdates` 方法来确定你的数据库是否支持此功能。\n\n批中的语句可以是诸如\
  \ `INSERT`、`UPDATE` 或 `DELETE` 等操作，也可以是数据定义语句如 `CREATE TABLE` 或 `DROP TABLE`。如果在批中添加\
  \ `SELECT` 语句将抛出异常。（从概念上讲，`SELECT` 语句在批中没有意义，因为它返回结果而不更新数据库。）\n\n要执行批处理，首先按通常方式创建一个\
  \ `Statement` 对象：\n\n```\nStatement stat = conn.createStatement();\n```\n\n现在，不再调用\
  \ `executeUpdate`，而是调用 `addBatch` 方法：\n\n```\nString command = \"CREATE TABLE .\
  \ . .\"\nstat.addBatch(command);\n\nwhile (. . .)\n{\n   command = \"INSERT INTO\
  \ . . . VALUES (\" + . . . + \")\";\n   stat.addBatch(command);\n}\n```\n\n最后，提交整个批：\n\
  \n```\nint[] counts = stat.executeBatch();\n```\n\n`executeBatch` 返回所有提交语句的行数数组。\n\
  \n为了对批模式进行正确的错误处理，将批执行视为单个事务。如果批在中间失败，你希望回滚到批开始之前的状态。\n\n首先，关闭自动提交模式，然后收集批、执行批、提交批，最后恢复原始自动提交模式：\n\
  \n\n\n\n\n```java\nboolean autoCommit = conn.getAutoCommit();\nconn.setAutoCommit(false);\n\
  Statement stat = conn.getStatement();\n. . .\n// keep calling stat.addBatch(. .\
  \ .);\n. . .\nstat.executeBatch();\nconn.commit(); conn.setAutoCommit(autoCommit);\n\
  ```\n\n### `java.sql.Connection` 1.1\n\n* `boolean getAutoCommit()`\n* `void setAutoCommit(boolean\
  \ b)`\n  获取或设置此连接的自动提交模式为 `b`。如果自动提交为 `true`，则所有语句在执行完成后立即提交。\n* `void commit()`\n\
  \  提交自上次提交 以来发布的所有语句。\n* `void rollback()`\n  撤销自上次提交 以来发布的所有语句的影响。\n* `Savepoint\
  \ setSavepoint()` 1.4\n* `Savepoint setSavepoint(String name)` 1.4\n  设置未命名或命名的保存点。\n\
  * `void rollback(Savepoint svpt)` 1.4\n  回滚到给定的保存点。\n* `void releaseSavepoint(Savepoint\
  \ svpt)` 1.4\n  释放给定的保存点。\n\n### `java.sql.Savepoint` 1.4\n\n* `int getSavepointId()`\n\
  \  获取此未命名保存点的 ID，如果是命名的保存点，则抛出 `SQLException`。\n* `String getSavepointName()`\n\
  \  获取此保存点的名称，如果是未命名的保存点，则抛出 `SQLException`。\n\n### `java.sql.Statement` 1.1\n\n\
  * `void addBatch(String command)` 1.2\n  将命令添加到此语句的当前命令批中。\n* `int[] executeBatch()`\
  \ 1.2\n* `long[] executeLargeBatch()` 8\n  执行当前批次中的所有命令。返回数组中的每个值对应于批处理语句之一。如果是非负数，则它为行数。如果值为\
  \ `SUCCESS_NO_INFO`，则语句执行成功但没有可用行数。如果为 `EXECUTE_FAILED`，则语句执行失败。\n\n### `java.sql.DatabaseMetaData`\
  \ 1.1\n\n* `boolean supportsBatchUpdates()` 1.2\n  如果驱动支持批更新，则返回 `true`。\n\n###\
  \ Advanced SQL Types\n\n表 5.8 列出了 JDBC 支持的 SQL 数据类型及其在 Java 编程语言中的对应类型。\n\nSQL 数据类型及其对应的\
  \ Java 类型\n\n| SQL 数据类型 | Java 类型 |\n| --- | --- |\n| `INTEGER` 或 `INT` | `int`\
  \ |\n| `SMALLINT` | `short` |\n| `NUMERIC(m,n)`, `DECIMAL(m,n)` 或 `DEC(m,n)` | `java.math.BigDecimal`\
  \ |\n| `FLOAT(n)` | `double` |\n| `REAL` | `float` |\n| `DOUBLE` | `double` |\n\
  | `CHARACTER(n)` 或 `CHAR(n)` | `String` |\n| `VARCHAR(n)`, `LONG VARCHAR` | `String`\
  \ |\n| `BOOLEAN` | `boolean` |\n| `DATE` | `java.sql.Date` |\n| `TIME` | `java.sql.Time`\
  \ |\n| `TIMESTAMP` | `java.sql.Timestamp` |\n| `BLOB` | `java.sql.Blob` |\n| `CLOB`\
  \ | `java.sql.Clob` |\n| `ARRAY` | `java.sql.Array` |\n| `ROWID` | `java.sql.RowId`\
  \ |\n| `NCHAR(n)`, `NVARCHAR(n)`, `LONG NVARCHAR` | `String` |\n| `NCLOB` | `java.sql.NClob`\
  \ |\n| `SQLXML` | `java.sql.SQLXML` |\n\nSQL `ARRAY` 是一个值的序列。例如，在 `Student` 表中，你可以有一个类型为\
  \ `ARRAY OF INTEGER` 的 `Scores` 列。`getArray` 方法返回一个接口类型 `java.sql.Array` 的对象。该接口拥有用于获取数组值的方法。\n\
  \n当您从数据库获取 LOB 或数组时，只有在请求单个值时，才会从数据库中获取实际内容。这是一个实用的性能增强，因为数据可能非常巨大。\n\n某些数据库支持 `ROWID`\
  \ 值，它可以描述行的位置，从而可以非常快速地检索。JDBC 4 引入了 `java.sql.RowId` 接口以及在查询中提供行 ID 并从结果中检索它的方法。\n\
  \n*国家字符字符串*（`NCHAR` 及其变体）使用本地字符编码存储字符串，并使用本地排序规则对它们进行排序。JDBC 4 提供了在查询和结果在 Java `String`\
  \ 对象与国家字符字符串之间转换的方法。\n\n某些数据库可以存储用户定义的结构化类型。JDBC 3 提供了一种机制，用于自动将结构化 SQL 类型映射到 Java\
  \ 对象。\n\n某些数据库为 XML 数据提供原生存储。JDBC 4 引入了 `SQLXML` 接口，它可以在内部 XML 表示与 DOM `Source/Result`\
  \ 接口以及二进制流之间进行调解。详情请参见 `SQLXML` 类的 API 文档。\n\n我们不再进一步讨论这些高级 SQL 类型。您可以在 *JDBC API\
  \ 教程与参考* 和 JDBC 规范中找到关于这些主题的更多信息。\n\n## Web 和企业级连接管理\n\n用户名和登录的管理只是需要特别关注的问题之一。另一个问题涉及建立数据库连接的成本。我们的示例数据库程序使用了两种策略来获取数据库连接。列表\
  \ 5.3 中的 `QueryDB` 程序在程序开始时建立单个数据库连接，并在程序结束时将其关闭。列表 5.4 中的 `ViewDB` 程序在每次需要时打开新连接。\n\
  \n然而，这两种方法都不令人如意。数据库连接是有限的资源。如果用户离开应用程序一段时间，连接不应保持打开状态。相反，为每个查询获取连接并在之后将其关闭的成本是极高的。\n\
  \n解决方案是连接*池化*。这意味着数据库连接没有被物理关闭，而是保留在队列中并被重用。连接池是一项重要的服务，JDBC 规范为实现者提供了该服务的钩子。然而，JDK\
  \ 本身不提供任何实现，数据库供应商通常也不会在其 JDBC 驱动程序中包含实现。相反，Web 容器和应用程序服务器供应商提供了连接池实现。\n\n当 JDBC\
  \ 应用部署在环境中时，`DriverManager` 不再参与。相反，JNDI（Java 命名和目录接口）允许对用户名、密码、数据库名称和 URL 进行集中化管理。属性存储在目录中。在这样的环境中，您可以使用以下代码建立数据库连接：\n\
  \n```java\nvar jndiContext = new InitialContext();\nvar source = (DataSource)jndiContext.lookup(\"\
  java:comp/env/jdbc/corejava\");\nConnection conn = source.getConnection();\n```\n\
  \n`DataSource` 接口定义在 `javax.sql` 标准扩展中。在 Java EE 容器中，您甚至不需要编写 JNDI 查找代码。只需在 `DataSource`\
  \ 字段上使用 `Resource` 注解，当您的应用程序加载时就会设置数据源引用：\n\n```java\n@Resource(name=\"jdbc/corejava\"\
  )\nprivate DataSource source;\n```\n\n当然，数据源需要在某处进行配置。如果您编写在 Tomcat 等 Servlet 容器或\
  \ GlassFish 等应用程序服务器中运行的数据库程序，请将数据库配置（包括 JNDI 名称、JDBC URL、用户名和密码）放在配置文件中，或在管理 GUI\
  \ 中设置它。\n\n\n\n\n使用连接池对程序员来说是完全透明的。通过获取数据源并调用 `getConnection` 从连接池源中获取连接。当你完成连接的使用后，调用\
  \ `close`。这并不会关闭物理连接，而是告诉连接池你已完成使用。连接池通常还会尝试对预编译语句（prepared statements）进行池化。\n\n\
  你现在已经学习了 JDBC 基础知识，并足够足够实现简单的数据库应用程序。然而，正如我们在章开头提到的，数据库是复杂的，许多高级主题超出了本入门章节的范围。如需了解高级\
  \ JDBC 能力的概览，请参考 *JDBC API Tutorial and Reference* 或 JDBC 规范。\n\n在本章中，你学习了如何在 Java\
  \ 中操作关系型数据库。下一章将介绍日期和时间库。\n\n# 日期和时间 API\n\n光阴如隙，我们可以很容易地设置一个起点并以秒为单位向前向后计数。那么为什么处理时间这么困难呢？问题在于人类。如果我们能直接互相说：“在\
  \ 1523793600 见面，不要迟到！”，一切都会变得简单。但我们希望时间与光照和季节相关。这让事情变得复杂起来。Java 1.0 有一个 `Date` 类，从后世看，它是幼稚的，而且在\
  \ Java 1.1 引入 `Calendar` 类时，它的大部分方法都被弃用了。它的 API 并不完美，其实例是可变的，而且无法处理闰秒等问题。第三次是幸运，Java\
  \ 8 中引入的 `java.time` API 弥补了过去的缺陷，并且应该足够我们使用很一段时间。在本章中，你将学习为什么时间计算如此令人烦恼，以及日期和时间\
  \ API 如何解决这些问题。\n\n## 时间线\n\n从历史上看，基本时间单位——秒——源于地球绕其轴轴的旋转。旋转一周有 24 小时或 24 × 60 ×\
  \ 60 = 86400 秒，因此精确定义秒似乎仅仅是一个天文测量的问题。遗憾的是，地球会轻微摇晃，需要更精确的定义。1967 年，根据 133 铯原子的固有属性，推出了与历史定义匹配的新精确秒定义。从那时起，一个原子钟网络维持着官方时间。\n\
  \n官方时间记录者经常会将绝对时间与地球的旋转进行同步。起初，官方秒会被微调，但从 1972 年开始，偶尔会插入“闰秒”（理论上，偶尔可能需要删除一个秒，但这种情况尚未发生）。目前有关于再次更改系统的讨论。显然，闰秒很痛苦，许多计算机系统改为使用“平滑”处理，即在闰秒之前人为地减慢或加速时间，保持每天\
  \ 86,400 秒。这之所以有效，是因为计算机的本地时间并不精确，而且计算机习惯于与外部时间服务同步。\n\nJava 日期和时间 API 规范要求 Java\
  \ 使用以下时间尺度：\n\n- 每天有 86,400 秒\n- 每天正午与官方时间完全匹配\n- 在其他地方以精确定义的方式紧密匹配\n\n这让 Java 具有适应未来官方时间变化的灵活性。\n\
  \n在 Java 中，`Instant` 代表时间线上的一个点。一个称为 *epoch*（纪）的起点被任意设置在 1970 年 1 月 1 日午夜，穿过伦敦格林尼治皇家天文台的子午线上。这与\
  \ UNIX/POSIX 时间使用的约定相同。从该起点开始，时间以每天 86,400 秒为单位向前向后测量，精度达到纳秒。`Instant` 值可以追溯到十亿年前（`Instant.MIN`）。这还不足以表达宇宙的年龄（约\
  \ 135 亿年），但对于所有实际目的已经足够了。毕竟，十亿年前，地球被冰覆盖，居住着今天植物动物的微型祖先。最大值 `Instant.MAX` 是 1,000,000,000\
  \ 年的 12 月 31 日。\n\n静态方法调用 `Instant.now()` 提供当前瞬间。你可以按照通常的方式使用 `equals` 和 `compareTo`\
  \ 方法比较两个 instant，因此你可以将 instant 作为时间戳。\n\n要找出两个 instant 之间的差异，请使用静态方法 `Duration.between`。例如，以下是衡量算法运行时间的方法：\n\
  \n```\nInstant start = Instant.now();\nrunAlgorithm();\nInstant end = Instant.now();\n\
  Duration timeElapsed = Duration.between(start, end);\nlong millis = timeElapsed.toMillis();\n\
  ```\n\n`Duration` 是两个 instant 之间的时间量。你可以通过调用 `toNanos`、`toMillis`、`toSeconds`、`toMinutes`、`toHours`\
  \ 或 `toDays` 获取常规单位的 `Duration` 长度。\n\n在 Java 8 中，你必须调用 `getSeconds` 而不是 `toSeconds`。\n\
  \n如果你需要纳秒精度，请注意溢出。`long` 值可以存储近 300 年的纳秒。如果你的持续时间比那短，只需将其转换为纳秒即可。你可以使用更长的持续时间——`Duration`\
  \ 对象在 `long` 中存储秒数，并在额外的 `int` 中存储纳秒数。`Duration` API 有许多方法（在本节末尾显示），用于进行运算。\n\n\
  例如，如果你想检查一个算法是否比另一个快十倍，你可以计算\n\n```\nDuration timeElapsed2 = Duration.between(start2,\
  \ end2);\nboolean overTenTimesFaster\n   = timeElapsed.multipliedBy(10).minus(timeElapsed2).isNegative();\n\
  ```\n\n这只是为了演示。由于算法不会运行几百年，你可以简单地使用\n\n```\nboolean overTenTimesFaster = timeElapsed.toNanos()\
  \ * 10 < timeElapsed2.toNanos();\n```\n\n`Instant` 和 `Duration` 类是不可变的，且所有方法（如 `multipliedBy`\
  \ 或 `minus`）都会返回新实例。\n\n列表 6.1 中的示例程序使用 `Instant` 和 `Duration` 类进行计时。\n\n该示例程序的方法在实践中太幼稚了，因为它没有处理诸如\
  \ JVM 即时编译器的“预热”等问题。如果你需要比较算法，应该使用专用的基准测试工具，例如 Java Microbenchmark Harness (JMH)。`https://www.oracle.com/technical-resources/articles/java/architect-benchmarking.html`get\
  \ 文章提供了非常有用的建议。\n\n`timeline/Timeline.java`\n\n\n\n\n```java\npackage timeline;\n\
  \n/**\n * @version 1.02 2023-08-27\n * @author Cay Horstmann\n */\n\nimport java.time.*;\n\
  import java.util.*;\nimport java.util.random.*;\nimport java.util.stream.*;\n\n\
  public class Timeline\n{\n   private static RandomGenerator generator = RandomGenerator.getDefault();\n\
  \n   public static void main(String[] args)\n   {\n      Instant start = Instant.now();\n\
  \      runAlgorithm();\n      Instant end = Instant.now();\n      Duration timeElapsed\
  \ = Duration.between(start, end);\n      long millis = timeElapsed.toMillis();\n\
  \      System.out.printf(\"%d milliseconds\\n\", millis);\n\n      Instant start2\
  \ = Instant.now();\n      runAlgorithm2();\n      Instant end2 = Instant.now();\n\
  \      Duration timeElapsed2 = Duration.between(start2, end2);\n      System.out.printf(\"\
  %d milliseconds\\n\", timeElapsed2.toMillis());\n      boolean overTenTimesFaster\
  \ = timeElapsed.multipliedBy(10)\n         .minus(timeElapsed2).isNegative();\n\
  \      System.out.printf(\"The first algorithm is %smore than ten times faster\"\
  ,\n         overTenTimesFaster ? \"\" : \"not \");\n   }\n\n   public static void\
  \ runAlgorithm()\n   {\n      int size = 10;\n      ArrayList<Integer> list = generator.ints().map(i\
  \ -> i % 100).limit(size)\n         .boxed().collect(Collectors.toCollection(ArrayList::new));\n\
  \      Collections.sort(list);\n      System.out.println(list);\n   }\n\n   public\
  \ static void runAlgorithm2()\n   {\n      int size = 10;\n      List<Integer> list\
  \ = generator.ints().map(i -> i % 100).limit(size)\n         .boxed().collect(Collectors.toCollection(ArrayList::new));\n\
  \      while (!IntStream.range(1, list.size())\n            .allMatch(i -> list.get(i\
  \ - 1).compareTo(list.get(i)) <= 0))\n         Collections.shuffle(list);\n    \
  \  System.out.println(list);\n   }\n}\n```\n\n### java.time.Instant 8\n\n* `static\
  \ Instant now()`\n  从最佳可用的系统时钟获取当前时点。\n* `Instant plus(TemporalAmount amountToAdd)`\n\
  * `Instant minus(TemporalAmount amountToSubtract)`\n  返回与此 `Instant` 相隔指定时间的时点。`Duration`\
  \ 和 `Period` 类实现了 `TemporalAmount` 接口。\n* `Instant` (`plus`|`minus`)(`Nanos`|`Millis`|`Seconds`)(long\
  \ number)`\n  返回与此 `Instant` 相隔指定纳秒、毫秒或秒的 `Instant`。\n\n### java.time.Duration 8\n\
  \n* `static Duration of(Nanos|Millis|Seconds|Minutes|Hours|Days)(long number)`\n\
  \  返回指定时间单位的持续时间。\n* `static Duration between(Temporal startInclusive, Temporal\
  \ endExclusive)`\n  返回两个时间点之间的持续时间。`Temporal` 接口由 `Instant` 类以及 `LocalDate`/`LocalTime`\
  \ 和 `ZonedDateTime` 实现。\n* `long toNanos()`\n* `long toMillis()`\n* `long toSeconds()`\n\
  * `long toMinutes()`\n* `long toHours()`\n* `long toDays()`\n  获取此 `Duration` 中的时间单位数量。\n\
  * `int to(Nanos|Millis|Seconds|Minutes|Hours)Part()`\n* `long toDaysPart()`\n  返回指定时间单位在此\
  \ `Duration` 中的部分。例如，在 100 秒的持续时间中，分钟部分为 `1`，秒部分为 `40`。\n* `Duration plus(TemporalAmount\
  \ amountToAdd)`\n* `Duration minus(TemporalAmount amountToSubtract)`\n  返回与此 `Duration`\
  \ 相隔指定时间的持续时间。`Duration` 和 `Period` 类实现了 `TemporalAmount` 接口。\n* `Duration multipliedBy(long\
  \ multiplicand)`\n* `Duration dividedBy(long divisor)`\n* `Duration negated()`\n\
  \  返回通过此 `Duration` 乘以指定数量或 `-1` 得到的持续时间。\n* `boolean isZero()`\n* `boolean isNegative()`\n\
  \  如果此 `Duration` 为零或负数，则返回 `true`。\n* `Duration (plus|minus)(Nanos|Millis|Seconds|Minutes|Hours|Days)(long\
  \ number)`\n  返回通过加或减指定数量的时间单位得到的 `Duration`。\n\n### 本地日期 (Local Dates)\n\n现在让我们从绝对时间转向人类时间。Java\
  \ API 中有两种人类时间：`本地日期/时间 (local date/time)` 和 `带时区时间 (zoned time)`。`本地日期/时间`包含日期和一天中的时间，但没有时区信息。本地日期的示例是\
  \ `1903 年 6 月 14 日`（lambda 算术发明者 Alonzo Church 的生日）。由于该日期既没有一天的时间也没有时区信息，因此它不对应于精确的时间点。相比之下，`1969\
  \ 年 7 月 16 日 09:32:00`（阿波罗 11 号的发射时间）是一个带时区的日期/时间，代表时间轴上的一个精确时点。\n\n在许多计算中不需要时区，在某些情况下，时区甚至会成为障碍。假设你安排每周在\
  \ `10:00` 开会。如果你在上一个带时区时间的基础上增加 `7` 天（即 `7 × 24 × 60 × 60` 秒），并且恰好跨越了夏令时间边界，那么会议将早一小时或晚一小时！\n\
  \n正因如此，API 设计者建议你不要使用带时区的时间，除非你真的想表示绝对时间实例。生日、节假日、日程时间等通常用本地日期或本地时间表示。\n\n`LocalDate`\
  \ 是一个包含年、月、日的日期。要构造一个日期，可以使用 `now` 或 `of` 静态方法：\n\n```java\nLocalDate today = LocalDate.now();\
  \ // 今天的日期\nLocalDate alonzBirthday = LocalDate.of(1903, 6, 14);\nalonzoBirthday\
  \ = LocalDate.of(1903, Month.JUNE, 14); // 使用 Month 枚举\n```\n\n与 `UNIX` 和 `java.util.Date`\
  \ 中不规则的约定（月份从 0 开始，年份从 1900 年计算）不同，在这里你提供的月份是常规数字。或者，你可以使用 `Month` 枚举。\n\n本节末尾的\
  \ API 注释显示了处理 `LocalDate` 对象最常用的方法。例如，“程序员节”是每年的第 256 天。以下是你可以轻松计算的方法：\n\n```java\n\
  LocalDate programmersDay = LocalDate.of(2014, 1, 1).plusDays(255);\n// 9 月 13 日，但在闰年将是\
  \ 9 月 12 日\n```\n\n回想起，两个时点之间的差异是 `Duration`。本地日期的等效物是 `Period`，它表示流逝的年、月或日。你可以调用\
  \ `birthday.plus(Period.ofYears(1))` 来获取明年的生日。当然，你也可以直接调用 `birthday.plusYears(1)`。但在闰年里，`birthday.plus(Period.ofDays(365))`\
  \ 不产生正确的结果。\n\n`until` 方法产生两个本地日期之间的差异。例如，\n\n```java\nindependenceDay.until(christmas)\n\
  ```\n\n产生一个 5 个月 21 天的 `Period`。这实际上并不好用，因为每月的天数不同。要查找天数，请使用\n\n```java\nindependenceDay.until(christmas,\
  \ ChronoUnit.DAYS) // 174 天\n```\n\n`LocalDate` API 中的某些方法可能会创建不存在的日期。例如，在 1 月 31\
  \ 日增加一个月不应产生 2 月 31 日。这些方法没有抛出异常，而是返回月的最后一个有效一天。例如，\n\n```java\nLocalDate.of(2016,\
  \ 1, 31).plusMonths(1)\n```\n\n和\n\n```java\nLocalDate.of(2016, 3, 31).minusMonths(1)\n\
  ```\n\n产生 2016 年 2 月 29 日。\n\n`getDayOfWeek` 返回作为 `DayOfWeek` 枚举值的星期几。`DayOfWeek.MONDAY`\
  \ 的数值为 `1`，`DayOfWeek.SUNDAY` 的值为 `7`。例如，\n\n```java\nLocalDate.of(1900, 1, 1).getDayOfWeek().getValue()\n\
  ```\n\n产生 `1`。`DayOfWeek` 枚举有方便方法 `plus` 和 `minus`，用于计算模 7 的星期几。例如，`DayOfWeek.SATURDAY.plus(3)`\
  \ 产生 `DayOfWeek.TUESDAY`。\n\n\n\n\n\n周末实际上位于周的末。这与 `java.util.Calendar` 不同，后者周日的值为\
  \ `1`，周六的值为 `7`。\n\n实用的 `datesUntil` 方法产生 `LocalDate` 对象的流：\n\n```\nLocalDate start\
  \ = LocalDate.of(2000, 1, 1);\nLocalDate endExclusive = LocalDate.now();\nStream<LocalDate>\
  \ allDays = start.datesUntil(endExclusive);\nStream<LocalDate> firstDaysInMonth\
  \ = start.datesUntil(endExclusive, Period.ofMonths(1));\n```\n\n除了 `LocalDate` 之外，还有\
  \ `MonthDay`、`YearMonth` 和 `Year` 类用于描述部分日期。例如，12 月 25 日（不指定年份）可以表示为 `MonthDay`。\n\
  \nListing 6.2 中的示例程序展示了如何使用 `LocalDate` 类。\n\n`localdates/LocalDates.java`\n\n```java\n\
  package localdates;\n\n/**\n * @version 1.01 2021-09-06\n * @author Cay Horstmann\n\
  \ */\nimport java.time.*;\nimport java.time.temporal.*;\nimport java.util.stream.*;\n\
  \npublic class LocalDates\n{\n   public static void main(String[] args)\n   {\n\
  \      LocalDate today = LocalDate.now(); // 今日日期\n      System.out.println(\"today:\
  \ \" + today);\n\n      LocalDate alonzosBirthday = LocalDate.of(1903, 6, 14);\n\
  \      alonzosBirthday = LocalDate.of(1903, Month.JUNE, 14);\n      // 使用 Month\
  \ 枚举\n      System.out.println(\"alonzosBirthday: \" + alonzosBirthday);\n\n   \
  \   LocalDate programmersDay = LocalDate.of(2018, 1, 1).plusDays(255);\n      //\
  \ 9 月 13 日，但在闰年中是 9 月 12 日\n      System.out.println(\"programmersDay: \" + programmersDay);\n\
  \n      LocalDate independenceDay = LocalDate.of(2018, Month.JULY, 4);\n      LocalDate\
  \ christmas = LocalDate.of(2018, Month.DECEMBER, 25);\n\n      System.out.println(\"\
  Until christmas: \" + independenceDay.until(christmas));\n      System.out.println(\"\
  Until christmas: \"\n         + independenceDay.until(christmas, ChronoUnit.DAYS));\n\
  \n      System.out.println(LocalDate.of(2016, 1, 31).plusMonths(1));\n      System.out.println(LocalDate.of(2016,\
  \ 3, 31).minusMonths(1));\n\n      DayOfWeek startOfLastMillennium = LocalDate.of(1900,\
  \ 1, 1).getDayOfWeek();\n      System.out.println(\"startOfLastMillennium: \" +\
  \ startOfLastMillennium);\n      System.out.println(startOfLastMillennium.getValue());\n\
  \      System.out.println(DayOfWeek.SATURDAY.plus(3));\n\n      LocalDate start\
  \ = LocalDate.of(2000, 1, 1);\n      LocalDate endExclusive = LocalDate.now();\n\
  \      Stream<LocalDate> firstDaysInMonth = start.datesUntil(endExclusive, Period.ofMonths(1));\n\
  \      System.out.println(\"firstDaysInMonth: \" \n         + firstDaysInMonth.toList());\n\
  \   }\n}\n```\n\n`java.time.LocalDate`\n\n*   `static LocalDate now()`\n    获取当前的\
  \ `LocalDate`。\n*   `static LocalDate of(int year, int month, int dayOfMonth)`\n\
  *   `static LocalDate of(int year, Month month, int dayOfMonth)`\n    产生一个给定年份、月份（1\
  \ 到 12 之间的整数或 `Month` 枚举值）和几号（1 到 31 之间）的本地日期。\n*   `LocalDate` (`plus`|`minus`)(`Days`|`Weeks`|`Months`|`Years`)`(long\
  \ number)`\n    产生通过加或减给定的时间单位而得到的 `LocalDate`。\n*   `LocalDate plus(TemporalAmount\
  \ amountToAdd)`\n*   `LocalDate minus(TemporalAmount amountToSubtract)`\n    产生一个与此\
  \ `LocalDate` 相差给定金额的 `LocalDate`。`Duration` 和 `Period` 类实现了 `TemporalAmount` 接口。\n\
  *   `LocalDate withDayOfMonth(int dayOfMonth)`\n*   `LocalDate withDayOfYear(int\
  \ dayOfYear)`\n*   `LocalDate withMonth(int month)`\n*   `LocalDate withYear(int\
  \ year)`\n    返回一个新的 `LocalDate`，其每月几、一年中的几天、月份或年份更改为给定值。\n*   `int getDayOfMonth()`\n\
  \    获取每月几（1 到 31 之间）。\n*   `int getDayOfYear()`\n    获取一年中的第几天（1 到 366 之间）。\n*\
  \   `DayOfWeek getDayOfWeek()`\n    获取星期几，返回 `DayOfWeek` 枚举的值。\n*   `Month getMonth()`\n\
  *   `int getMonthValue()`\n    作为 `Month` 枚举的值获取月份，或 1 到 12 之间的数字。\n*   `int getYear()`\n\
  \    获取年份，范围在 –999,999,999 到 999,999,999 之间。\n*   `int until(TemporalUnit unit)`\n\
  \    计算此日期与另一个日期之间的单位量。\n*   `long until(Temporal end, TemporalUnit unit)`\n   \
  \ 计算此日期与另一个日期之间的单位量。\n*   `boolean isBefore(Temporal other)`\n    如果此日期在另一个日期之前，返回\
  \ `true`。\n*   `boolean isAfter(Temporal other)`\n    如果此日期在另一个日期之后，返回 `true`。\n\
  *   `boolean isSame(Temporal other)`\n    如果此日期与另一个日期相同，返回 `true`。\n*   `Stream<LocalDate>\
  \ datesUntil(Temporal endExclusive)`\n    产生从此日期到结束日期（不包含）的 `LocalDate` 流。\n*  \
  \ `Stream<LocalDate> datesUntil(Temporal endExclusive, Period period)`\n    产生从此日期到结束日期（不包含）且受周期限制的\
  \ `LocalDate` 流。\n\n## 日期调整器\n\n对于调度应用，你经常需要计算某些日期，例如“每个月的第一个周二”。`TemporalAdjusters`\
  \ 类提供了许多常用调整的静态方法。将调整的结果传递给 `with` 方法。例如，可以这样计算每月的第一个周二：\n\n```\nLocalDate firstTuesday\
  \ = LocalDate.of(year, month, 1).with(\n   TemporalAdjusters.nextOrSame(DayOfWeek.TUESDAY));\n\
  ```\n\n一如既往，`with` 方法返回一个新的 `LocalDate` 而不修改原始对象。本节末尾的 API 说明了所有调整器。\n\n你也可以通过实现\
  \ `TemporalAdjuster` 接口创建自己的调整器。这里有一个计算下一个工作日的调整器：\n\n```java\nTemporalAdjuster\
  \ NEXT_WORKDAY = w ->\n   {\n      var result = (LocalDate) w;\n      do\n     \
  \ {\n         result = result.plusDays(1);\n      }\n      while (result.getDayOfWeek().getValue()\
  \ >= 6);\n      return result; \n   };\n\nLocalDate backToWork = today.with(NEXT_WORKDAY);\n\
  ```\n\n注意 lambda 表达式的参数类型为 `Temporal`，必须转换为 `LocalDate`。你可以使用 `ofDateAdjuster` 方法来避免这种转换，该方法接受类型为\
  \ `UnaryOperator<LocalDate>` 的 lambda。\n\n```java\nTemporalAdjuster NEXT_WORKDAY\
  \ = TemporalAdjusters.ofDateAdjuster(w ->\n   {\n      LocalDate result = w; //\
  \ 无需转换\n      do\n      {\n         result = result.plusDays(1);\n      }\n    \
  \  while (result.getDayOfWeek().getValue() >= 6);\n      return result; \n   });\n\
  ```\n\n\n\n\n* `static TemporalAdjuster previous(DayOfWeek dayOfWeek)`\n* `static\
  \ TemporalAdjuster previousOrSame(DayOfWeek dayOfWeek)`\n  返回一个将日期调整到给定星期几的调整器。\n\
  * `static TemporalAdjuster dayOfWeekInMonth(int n, DayOfWeek dayOfWeek)`\n* `static\
  \ TemporalAdjuster lastInMonth(DayOfWeek dayOfWeek)`\n  返回一个将日期调整到该月第 `n` 个或最后一个给定星期几的调整器。\n\
  * `static TemporalAdjuster firstDayOfMonth()`\n* `static TemporalAdjuster firstDayOfNextMonth()`\n\
  * `static TemporalAdjuster firstDayOfYear()`\n* `static TemporalAdjuster firstDayOfNextYear()`\n\
  * `static TemporalAdjuster lastDayOfMonth()`\n* `static TemporalAdjuster lastDayOfYear()`\n\
  \  返回一个将日期调整到给定日期或年份的调整器。\n\n## Local 时间 (Local Time)\n\n`LocalTime` 代表一天中的某个时间，例如\
  \ 15:30:00。你可以通过 `now` 或 `of` 方法创建实例：\n\n```\nLocalTime rightNow = LocalTime.now();\n\
  LocalTime bedtime = LocalTime.of(22, 30); // or LocalTime.of(22, 30, 0)\n```\n\n\
  API 说明显示了本地时间的常用操作。`plus` 和 `minus` 操作会在 24 小时内循环溢出。例如，\n\n```\nLocalTime wakeup\
  \ = bedtime.plusHours(8); // wakeup is 6:30:00\n```\n\n`LocalTime` 不涉及 AM/PM。这种琐事留给格式化器处理——参见第\
  \ 6.6 节。\n\n有一个 `LocalDateTime` 类表示日期和时间。该类适用于存储固定时区中的时间点——例如，课程或活动的时间表。然而，如果你需要进行跨越夏令时的计算，或者需要处理来自不同时区的用户，应该使用我们接下来讨论的\
  \ `ZonedDateTime` 类。\n\n`java.time.LocalTime` 8\n\n* `static LocalTime now()`\n\
  \  获取当前的 `LocalTime`。\n* `static LocalTime of(int hour, int minute)`\n* `static\
  \ LocalTime of(int hour, int minute, int second)`\n* `static LocalTime of(int hour,\
  \ int minute, int second, int nanoOfSecond)`\n  产生具有给定小时（0 到 23 之间）、分钟（0 到 59 之间）和纳秒（0\
  \ 到 999,999,999 之间）的本地时间。\n* `LocalTime` (`plus`|`minus`)(`Hours`|`Minutes`|`Seconds`|`Nanos``(long\
  \ number)`\n  产生通过加或减给定时间单位得到的 `LocalTime`。\n* `LocalTime plus(TemporalAmount amountToAdd)`\n\
  * `LocalTime minus(TemporalAmount amountToSubtract)`\n  返回一个与此 `LocalTime` 相差给定时间的\
  \ `LocalTime`。\n* `LocalTime with`(`Hour`|`Minute`|`Second`|`Nano`)`(int value)`\n\
  \  返回一个小时、分、秒或纳秒更改为给定值的新 `LocalTime`。\n* `int getHour()`\n  获取小时（0 到 23 之间）。\n*\
  \ `int getMinute()`\n* `int getSecond()`\n  获取分或秒（0 到 59 之间）。\n* `int getNano()`\n\
  \  获取纳秒（0 到 999,999,999 之间）。\n* `int toSecondOfDay()`\n* `long toNanoOfDay()`\n\
  \  产生自午夜以来的秒或纳秒。\n* `boolean isBefore(LocalTime other)`\n* `boolean isAfter(LocalTime\
  \ other)`\n  如果此日期在给定日期之前或之后，则返回 `true`。\n\n## 时区时间 (Zoned Time)\n\n时区可能因为它们完全是人类的产物，比地球不规则旋转引起的复杂性更加混乱。在一个理性的世界里，我们都应该遵循格林治的时钟，我们中的一些人会在\
  \ 02:00 吃午饭，另一些人在 22:00 吃。我们的胃会适应的。这在中国实际上是存在的，中国跨越四个标准时区。在其他地方，我们拥有边界不规则且移动的时区，更糟糕的是还有夏令时。\n\
  \n尽管时区对开明的人来说可能看起来反复无常，但它们是生活的现实。当你实现一个日历应用程序时，它需要适用于从一个国家飞往另一个国家的人。当你在纽约 10:00\
  \ 有一个电话会议，但恰好在柏林时，你期望在正确的本地时间收到提醒。\n\n互联网分配编号机构 (IANA) 维护着全球所有已知时区的数据库（[`www.iana.org/time-zones`](https://www.iana.org/time-zones)），该数据库每年更新几次。大部分更新涉及夏令时规则的变更。Java\
  \ 使用 IANA 数据库。\n\n每个时区都有一个 ID，例如 `America/New_York` 或 `Europe/Berlin`。要查找所有可用的时区，调用\
  \ `ZoneId.getAvailableZoneIds`。在写此时，有近 600 个 ID。（此处注：输入文本包含多个重复句子，已进行整合以保持文档质量）。\n\
  \n\n\n```java\npackage zonedTimes;\n\n/**\n * @version 1.0 2016-05-10\n * @author\
  \ Cay Horstmann\n */\n\nimport java.time.*;\n\npublic class ZonedTimes\n{\n   public\
  \ static void main(String[] args)\n   {\n      ZonedDateTime apollo11launch = ZonedDateTime.of(1969,\
  \ 7, 16, 9, 32, 0, 0,\n         ZoneId.of(\"America/New_York\")); // 1969-07-16T09:32-04:00[America/New_York]\n\
  \      System.out.println(\"apollo11launch: \" + apollo11launch);\n\n      Instant\
  \ instant = apollo11launch.toInstant();\n      System.out.println(\"instant: \"\
  \ + instant);\n\n      ZonedDateTime zonedDateTime = instant.atZone(ZoneId.of(\"\
  UTC\"));\n      System.out.println(\"zonedDateTime: \" + zonedDateTime);\n\n   \
  \   ZonedDateTime skipped = ZonedDateTime.of(LocalDate.of(2013, 3, 31),\n      \
  \   LocalTime.of(2, 30), ZoneId.of(\"Europe/Berlin\")); // Constructs March 31 3:30\
  \      \n      System.out.println(\"skipped: \" + skipped);\n\n      ZonedDateTime\
  \ ambiguous = ZonedDateTime.of(\n         LocalDate.of(2013, 10, 27), // End of\
  \ daylight savings time\n         LocalTime.of(2, 30), ZoneId.of(\"Europe/Berlin\"\
  ));\n         // 2013-10-27T02:30+02:00[Europe/Berlin]\n      ZonedDateTime anHourLater\
  \ = ambiguous.plusHours(1);\n         // 2013-10-27T02:30+01:00[Europe/Berlin]\n\
  \      System.out.println(\"ambiguous: \" + ambiguous);\n      System.out.println(\"\
  anHourLater: \" + anHourLater);\n\n      ZonedDateTime meeting = ZonedDateTime.of(LocalDate.of(2013,\
  \ 10, 31),\n         LocalTime.of(14, 30), ZoneId.of(\"America/Los_Angeles\"));\n\
  \      System.out.println(\"meeting: \" + meeting);\n      ZonedDateTime nextMeeting\
  \ = meeting.plus(Duration.ofDays(7));\n         // Caution! Won’t work with daylight\
  \ savings time\n      System.out.println(\"nextMeeting: \" + nextMeeting);\n   \
  \   nextMeeting = meeting.plus(Period.ofDays(7)); // OK\n      System.out.println(\"\
  nextMeeting: \" + nextMeeting);\n   }\n}\n```\n\n### `java.time.ZonedDateTime` 8\n\
  \n* `static ZonedDateTime now()`\n  获取当前的 `ZonedDateTime`。\n\n* `static ZonedDateTime\
  \ of(int year, int month, int dayOfMonth, int hour, int minute, int second, int\
  \ nanoOfSecond, ZoneId zone)`\n\n* `static ZonedDateTime of(LocalDate date, LocalTime\
  \ time, ZoneId zone)`\n\n* `static ZonedDateTime of(LocalDateTime localDateTime,\
  \ ZoneId zone)`\n\n* `static ZonedDateTime ofInstant(Instant instant, ZoneId zone)`\n\
  \  产生一个具有给定参数和时区的 `ZonedDateTime`。\n\n* `ZonedDateTime (`plus`|`minus`)(Days`|`Weeks`|`Months`|`Years`|`Hours`|`Minutes`|`Seconds`|`Nanos`)(long\
  \ number)`\n  产生通过增加或减少给定数量的时间单位得到的 `ZonedDateTime`。\n\n* `ZonedDateTime plus(TemporalAmount\
  \ amountToAdd)`\n\n* `ZonedDateTime minus(TemporalAmount amountToSubtract)`\n  返回一个与此\
  \ `ZonedDateTime` 相差给定金额的 `ZonedDateTime`。\n\n* `ZonedDateTime with(`DayOfMonth`|`DayOfYear`|`Month`|`Year`|`Hour`|`Minute`|`Second`|`Nano`)(int\
  \ value)`\n  返回一个用给定值替换给定时间单位的新 `ZonedDateTime`。\n\n* `ZonedDateTime withZoneSameInstant(ZoneId\
  \ zone)`\n\n* `ZonedDateTime withZoneSameLocal(ZoneId zone)`\n  返回在给定时区中的新 `ZonedDateTime`，表示相同的时区或相同的本地时间。\n\
  \n* `int getDayOfMonth()`\n  获取月份中的几号（1 到 31 之间）。\n\n* `int getDayOfYear()`\n  获取一年中的第几天（1\
  \ 到 366 之间）。\n\n* `DayOfWeek getDayOfWeek()`\n  获取星期几，返回 `DayOfWeek` 枚举的值。\n\n*\
  \ `Month getMonth()`\n\n* `int getMonthValue()`\n  作为 `Month` 枚举的值返回月份，或者作为 1 到\
  \ 12 之间的数字。\n\n* `int getYear()`\n  获取年份，范围在 –999,999,999 到 999,999,999 之间。\n\n\
  * `int getHour()`\n  获取小时（0 到 23 之间）。\n\n* `int getMinute()`\n\n* `int getSecond()`\n\
  \  获取分钟或秒（0 到 59 之间）。\n\n* `int getNano()`\n  获取纳秒（0 到 999,999 之间）。\n\n* `public\
  \ ZoneOffset getOffset()`\n  获取与 UTC 的偏移量。偏移量范围从 –12:00 到 +14:00。某些时区具有分数的偏移量。偏移量会随夏令时变化。\n\
  \n* `LocalDate toLocalDate()`\n\n* `LocalTime toLocalTime()`\n\n* `LocalDateTime\
  \ toLocalDateTime()`\n\n* `Instant toInstant()`\n  产生本地日期、时间、日期/时间或对应的 instant。\n\
  \n* `boolean isBefore(TemporalAccessor other)`\n\n* `boolean isAfter(TemporalAccessor\
  \ other)`\n  如果此日期/时间在给定日期/时间之前，则返回 `true`。\n\n## 格式化与解析\n\n`DateTimeFormatter`\
  \ 类提供了三种格式化来打印日期/时间：\n\n* 预定义的格式化（见表）\n* 特定区域的格式化\n* 带有自定义模式的格式化\n\n要使用标准格式化之一，只需调用其\
  \ `format` 方法：\n\n```java\nString formatted = DateTimeFormatter.ISO_OFFSET_TIME.format(apollo11launch);\n\
  ```\n\n### 预定义格式化\n\n| 格式化 | 说明 | 示例 |\n| :--- | :--- | :--- |\n| `BASIC_ISO_DATE`\
  \ | 年、月、日、无分隔符的偏移量 | `19690716-0400` |\n| `ISO_LOCAL_DATE`, `ISO_LOCAL_TIME`, `ISO_DATE_TIME`\
  \ | 使用分隔符 `-`, `:`, `T` | `1969-07-16`, `09:32:00`, `1969-07-16T09:32:00` |\n| `ISO_OFFSET_DATE`,\
  \ `ISO_OFFSET_TIME`, `ISO_OFFSET_DATE_TIME` |类似于 `ISO_LOCAL_` 但带有偏移量 | `1969-07-16-0400`,\
  \ `09:32:00-0400`, `1969-07-16T09:32:00-0400` |\n| `ISO_ZONED_DATE_TIME` | 带有偏移量和时区\
  \ ID | `1969-07-16T09:32:00-04:00[America/New_York]` |\n| `ISO_INSTANT` | UTC，由\
  \ `Z` 标识时区 ID | `1969-07-16T13:32:00Z` |\n| `ISO_DATE`, `ISO_TIME`, `ISO_DATE_TIME`\
  \ | 类似于 `ISO_OFFSET_` 但时区信息是可选的 | `1969-07-16-04:00`, `09:32:00-04:00`, `1969-07-16T09:32:00-04:00[America/New_York]`\
  \ |\n| `ISO_ORDINAL_DATE` | `LocalDate` 的年份和年中的天 | `1969-197-04:00` |\n| `ISO_WEEK_DATE`\
  \ | `LocalDate` 的年份、周和星期 | `1969-W29-3-04:00` |\n| `RFC_1123_DATE_TIME` | RFC 822\
  \ 标准，RFC 1123 中年份为四位数 | `Wed, 16 Jul 1969 09:32:00 -0400` |\n\n标准格式化主要用于机器可读的时间戳。要向人类读者展示日期和时间，请使用特定区域的格式化。有四种样式：`SHORT`、`MEDIUM`、`LONG`\
  \ 和 `FULL`，适用于日期和时间——见表 6.2。\n\n静态方法 `ofLocalizedDate`、`ofLocalizedTime` 和 `ofLocalizedDateTime`\
  \ 创建此类格式化。例如：\n\n```java\nDateTimeFormatter formatter = DateTimeFormatter.ofLocalizedDateTime(FormatStyle.LONG);\n\
  String formatted = formatter.format(apollo11launch);\n// July 16, 1969 9:32:00 AM\
  \ EDT\n```\n\n这些方法使用默认区域。要更改不同的区域，只需使用 `withLocale` 方法。\n\n```java\nformatted =\
  \ formatter.withLocale(Locale.FRENCH).format(apollo11launch);\n// 16 juillet 1969\
  \ 09:32:00 EDT\n```\n\n`DayOfWeek` 和 `Month` 枚举拥有 `getDisplayName` 方法，用于不同的区域和格式提供星期几和月份的名字。\n\
  \n```java\nfor (DayOfWeek w : DayOfWeek.values())\n   System.out.print(w.getDisplayName(TextStyle.SHORT,\
  \ Locale.ENGLISH) + \" \");\n// Prints Mon Tue Wed Thu Fri Sat Sun\n```\n\n有关区域的更多信息请见第\
  \ 7 章。\n\n### 特定区域格式化样式\n\n| 样式 | 日期 | 时间 |\n| :--- | :--- | :--- |\n| `SHORT` |\
  \ `7/16/69` | `9:32 AM` |\n| `MEDIUM` | `Jul 16, 1969` | `9:32:00 AM` |\n| `LONG`\
  \ | `July 16, 1969` | `9:32:00 AM EDT` |\n| `FULL` | `Wednesday, July 16, 1969`\
  \ | `9:32:00 AM EDT` |\n\n`java.time.format.DateTimeFormatter` 类旨在替代 `java.util.DateFormat`。如果为了向后兼容需要后者的实例，请调用\
  \ `formatter.toFormat()`。\n\n最后，你可以通过指定模式来自定义自己的日期格式。例如，\n\n\n\n\n\n```\nformatter\
  \ = DateTimeFormatter.ofPattern(\"E yyyy-MM-dd HH:mm\");\n```\n\n它将日期格式化为 `Wed 1969-07-16\
  \ 09:32` 格式。每个字母代表不同的时间字段，字母重复的次数根据某些规则选择特定的格式，这些规则非常奥秘，似乎随着时间的推移自然形成的。表 6.3 显示了最常用的模式元素。\n\
  \n### 日期/时间格式常用的格式化符号\n\n| `ChronoField` 或用途 | 示例 |\n| --- | --- |\n| `ERA` | `G`:\
  \ `AD`, `GGGG`: `Anno Domini`, `GGGGG`: `A` |\n| `YEAR_OF_ERA` | `yy`: `69`, `yyyy`:\
  \ `1969` |\n| `MONTH_OF_YEAR` | `M`: `7`, `MM`: `07`, `MMM`: `Jul`, `MMMM`: `July`,\
  \ `MMMMM`: `J` |\n| `DAY_OF_MONTH` | `d`: `6`, `dd`: `06` |\n| `DAY_OF_WEEK` | `e`:\
  \ `3`, `E`: `Wed`, `EEEE`: `Wednesday`, `EEEEE`: `W` |\n| `HOUR_OF_DAY` | `H`: `9`,\
  \ `HH`: `09` |\n| `CLOCK_HOUR_OF_AM_PM` | `h`: `9`, `hh`: `09` |\n| `AMPM_OF_DAY`\
  \ | `a`: `AM` |\n| 天时段（自 Java 16 起） | `B`: `in the evening`, `at night`, `midnight`\
  \ |\n| `MINUTE_OF_HOUR` | `mm`: `02` |\n| `SECOND_OF_MINUTE` | `ss`: `00` |\n| `NANO_OF_SECOND`\
  \ | `nnnnnn`: `000000` |\n| 时区 ID | `VV`: `America/New_York` |\n| 时区名称 | `z`: `EDT`,\
  \ `zzzz`: `Eastern Daylight Time`, `v`: `ET`, `vvvv`: `Eastern Time` |\n| 区域偏移量\
  \ | `x`: `-04`, `xx`: `-0400`, `xxx`: `-04:00`, `XXX`: 相同，但零时使用 `Z` |\n\n注意这些字母的大小写：`M`\
  \ 是月份，`m` 是分钟。你可能需要的是月份中的一天 `d`，而不是一年中的几天 `D`，以及是秒 `s` 而不是秒分之一 `S`。最危险的是，`y` 表示普通年份，但\
  \ `Y` 是“周数年份”，如果 1 月 1 日落在周五、周六或周日，则会有细微不同。\n\n`ofLocalizedPattern` 方法产生一个格式化器，它以特定区域语言的方式组装模式部分，并具有适当的分隔符和部分顺序。例如：\n\
  \n```\nDateTimeFormatter formatter = DateTimeFormatter.ofLocalizedPattern(\"yMMMd\"\
  );\nformatter.withLocale(Locale.US).format(apollo11launch) // Jul 16, 1969\nformatter.withLocale(Locale.GERMANY).format(apollo11launch)\
  \ // 16\\. Juli 1969\nformatter.withLocale(Locale.CHINA).format(apollo11launch)\
  \ // 1969 年 7 月 16 日\n```\n\n你只需要按从大到小的顺序指定部分的符号。不要包含任何分隔符。对于小时，使用 `j` 来表示本地化的 12\
  \ 小时或 24 小时格式：\n\n```\nformatter = DateTimeFormatter.ofLocalizedPattern(\"jm\");\n\
  formatter.withLocale(Locale.US).format(LocalTime.of(23, 59)) // 11:59 pm\nformatter.withLocale(Locale.GERMANY).format(LocalTime.of(23,\
  \ 59)) // 23:59\n```\n\n要从字符串解析日期/时间值，请使用静态的 `parse` 方法之一。例如：\n\n```\nLocalDate\
  \ churchsBirthday = LocalDate.parse(\"1903-06-14\");\nZonedDateTime apollo11launch\
  \ =\n   ZonedDateTime.parse(\"1969-07-16 03:32:00-0400\",\n      DateTimeFormatter.ofPattern(\"\
  yyyy-MM-dd HH:mm:ssxx\"));\n```\n\n第一次调用使用标准的 `ISO_LOCAL_DATE` 格式化器，第二个使用自定义格式化器。\n\
