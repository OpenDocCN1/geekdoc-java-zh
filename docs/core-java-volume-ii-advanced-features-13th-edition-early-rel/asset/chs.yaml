  \ `Printable` 类需要一个`layout algorithm`来计算材料在打印页面上的布局。在开始打印之前，调用该算法来计算分页和页数。你可以保留布局信息，以便在打印过程中方便使用。\n\
  \n你必须防范用户更改页码格式的可能性。如果发生这种情况，你必须重新计算布局，即使你想要打印的信息没有更改。\n\nListing 12.26 显示了如何生成多页打印输出。该程序在多个页面上用大字符打印消息（参见图\
  \ 12.63）。然后你可以裁剪页边并将页面胶在一起，形成一个横幅。\n\n![Figure](img/fig07-35.jpg)横幅\n\n`Banner`\
  \ 类的 `layoutPages` 方法计算布局。我们首先用 72 点字体布局消息字符串。然后计算结果字符串的高度，并将其与页面的可打印高度进行比较。我们从这两个测量值中派出一个比例因子。在打印字符串时，我们按该比例因子对其放大。\n\
  \n为了精确布局你的信息，通常需要访问打印机图形上下文。遗憾的是，在打印实际开始之前没有获取该图形上下文。在我们的示例程序中，我们凑使用屏幕图形上下文，并希望屏幕和打印机的字体指标相匹配。\n\
  \n`Banner` 类的 `getPageCount` 方法首先调用布局方法。然后它放大字符串的宽度并除以每个页面的可打印宽度。商向上舍入到下一个整数，即为页数。\n\
  \n听起来打印横幅可能很困难，因为字符可能会跨多个页面。然而，得益于 Java 2D API 的强大，事实证明完全不是问题。当请求特定页面时，我们只需使用 `Graphics2D`\
  \ 类的 `translate` 方法将字符串的左上角向左移动。然后，设置一个等于当前页面的裁剪矩形（参见图 12.64）。最后，使用布局方法计算出的比例因子对图形上下文进行缩放。\n\
