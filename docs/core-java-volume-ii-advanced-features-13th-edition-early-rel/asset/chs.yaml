  \      double sx = getWidth();\n      double sy = getHeight();\n      if (px / py\
  \ < sx / sy) // 水平居中\n      {\n         scale = sy / py;\n         xoff = 0.5 *\
  \ (sx - px * scale);\n         yoff = 0;\n      }\n      else // 垂直居中\n      {\n\
  \         scale = sx / px;\n         xoff = 0;\n         yoff = 0.5 * (sy - py *\
  \ scale);\n      }\n      g2.translate((float) xoff, (float) yoff);\n      g2.scale((float)\
  \ scale, (float) scale);\n\n      // 绘制页面轮廓（忽略页边距）\n      var page = new Rectangle2D.Double(0,\
  \ 0, px, py);\n      g2.setPaint(Color.white);\n      g2.fill(page);\n      g2.setPaint(Color.black);\n\
  \      g2.draw(page);\n\n      Printable printable = book.getPrintable(currentPage);\n\
  \      try\n      {\n         printable.print(g2, pageFormat, currentPage);\n  \
  \    }\n      catch (PrinterException e)\n      {\n         g2.draw(new Line2D.Double(0,\
  \ 0, px, py));\n         g2.draw(new Line2D.Double(px, 0, 0, py));\n      }\n  \
  \ }\n\n   /**\n    * 按指定的页数翻页。\n    * @param by 翻页的页数。负值向后翻。\n    */\n   public\
  \ void flipPage(int by)\n   {\n      int newPage = currentPage + by;\n      if (0\
  \ <= newPage && newPage < book.getNumberOfPages())\n      {\n         currentPage\
  \ = newPage;\n         repaint();\n      }\n   }\n}\n```\n\n\n\n\n数据本身可以存储在字节或字符源中，例如输入流、URL\
  \ 或数组。`document flavor`（文档格式）描述了数据源和数据类型的组合。`DocFlavor` 类为各种数据源定义了若干个内部类。每个内部类都定义了常量来指定特定的格式。例如，常量\n\
  \n```\nDocFlavor.INPUT_STREAM.GIF\n```\n\n描述了从输入流中读取的 GIF 图像。表 12.4 列出了这些组合。\n\n\
  ## 打印服务的文档格式\n\n| 这里的源 |  数据类型 | MIME 类型 |\n| --- | --- | --- |\n| `INPUT_STREAM`\
  \ | `GIF` | `image/gif` |\n| `URL` | `JPEG` | `image/jpeg` |\n| `BYTE_ARRAY` | `PNG`\
  \ | `image/png` |\n|  | `POSTSCRIPT` | `application/postscript` |\n|  | `PDF` |\
  \ `application/pdf` |\n|  | `TEXT_HTML_HOST` | `text/html` (使用主机编码) |\n|  | `TEXT_HTML_US_ASCII`\
  \ | `text/html; charset=us-ascii` |\n|  | `TEXT_HTML_UTF_8` | `text/html; charset=utf-8`\
  \ |\n|  | `TEXT_HTML_UTF_16` | `text/html; charset=utf-16` |\n|  | `TEXT_HTML_UTF_16LE`\
  \ | `text/html; charset=utf-16le` (小端序) |\n|  | `TEXT_HTML_UTF_16BE` | `text/html;\
  \ charset=utf-16be` (大端序) |\n|  | `TEXT_PLAIN_HOST` | `text/plain` (使用主机编码) |\n\
  |  | `TEXT_PLAIN_US_ASCII` | `text/plain; charset=us-ascii` |\n|  | `TEXT_PLAIN_UTF_8`\
  \ | `text/plain; charset=utf-8` |\n|  | `TEXT_PLAIN_UTF_16` | `text/plain; charset=utf-16`\
  \ |\n|  | `TEXT_PLAIN_UTF_16LE` | `text/plain; charset=utf-16le` (小端序) |\n|  | `TEXT_PLAIN_UTF_16BE`\
  \ | `text/plain; charset=utf-16be` (大端序) |\n|  | `PCL` | `application/vnd.hp-PCL`\
  \ (惠尔士罗普打印机控制语言) |\n|  | `AUTOSENSE` | `application/octet-stream` (原始打印数据) |\n|\
  \ `READER` | `TEXT_HTML` | `text/html; charset=utf-16` |\n| `STRING` | `TEXT_PLAIN`\
  \ | `text/plain; charset=utf-16` |\n| `CHAR_ARRAY` |  |  |\n| `SERVICE_FORMATTED`\
  \ | `PRINTABLE` | N/A |\n|  | `PAGEABLE` | N/A |\n|  | `RENDERABLE_IMAGE` | N/A\
  \ |\n\n假设你想打印位于文件中的 GIF 图像。首先，确定是否存在能够处理该任务的 `print service`（打印服务）。`PrintServiceLookup`\
  \ 类的静态方法 `lookupPrintServices` 返回一个包含可以处理给定文档格式的 `PrintService` 对象数组。\n\n```\nDocFlavor\
  \ flavor = DocFlavor.INPUT_STREAM.GIF;\nPrintService[] services = PrintServiceLookup.lookupPrintServices(flavor,\
  \ null);\n```\n\n`lookupPrintServices` 方法的第二个参数是 `null`，表示我们不想通过指定打印机属性来限制搜索。我们将在下一节中介绍属性。\n\
  \n如果查找结果返回的数组包含多个元素，请从列出的打印服务中选择一个。你可以调用 `PrintService` 类的 `getName` 方法来获取打印机名称并让用户选择。\n\
  \n接下来，从该服务获取一个文档打印作业：\n\n```\nDocPrintJob job = services[i].createPrintJob();\n\
  ```\n\n为了打印，你需要一个实现 `Doc` 接口的对象。Java 库提供了一个 `SimpleDoc` 类来实现此目的。`SimpleDoc` 构造函数需要数据源对象、文档格式以及可选的属性集。例如，\n\
  \n```\nvar in = new FileInputStream(fileName);\nvar doc = new SimpleDoc(in, flavor,\
  \ null);\n```\n\n最后，你就可以准备打印了：\n\n```\njob.print(doc, null);\n```\n\n与之前一样，`null`\
  \ 参数可以被属性集替换。\n\n注意，此打印过程与前面的节完全不同。它没有通过打印对话框进行交互。例如，你可以实现一种服务器端的打印机制，用户通过 Web 表单提交打印作业。\n\
  \n`javax.print.PrintServiceLookup` 1.4\n\n*   `PrintService[] lookupPrintServices(DocFlavor\
  \ flavor, AttributeSet attributes)`\n    查找可以处理给定文档格式和属性的打印服务。如果没有属性需要考虑，`attributes`\
  \ 参数可以为 `null`。\n\n`javax.print.PrintService` 1.4\n\n*   `DocPrintJob createPrintJob()`\n\
  \    为实现 `Doc` 接口的类对象（如 `SimpleDoc`）创建一个打印打印作业。\n\n`javax.print.DocPrintJob` 1.4\n\
  \n*   `void print(Doc doc, PrintRequestAttributeSet attributes)`\n    使用给定的属性打印给定文档。如果不需要打印属性，`attributes`\
  \ 参数可以为 `null`。\n\n`javax.print.SimpleDoc` 1.4\n\n*   `SimpleDoc(Object data, DocFlavor\
  \ flavor, DocAttributeSet attributes)`\n    构造一个可以使用 `DocPrintJob` 打印的 `SimpleDoc`\
  \ 对象。`data` 参数是带有打印数据的对象，例如输入流或 `Printable`。如果不需要属性，`attributes` 参数可以为 `null`。\n\
  \n### 流打印服务\n\n打印服务将打印数据发送到打印机。流打印服务生成相同的打印数据，但将其发送到流中，可能是为了延迟打印或者因为打印数据格式可以被其他程序解释。特别是，如果打印数据格式是\
  \ PostScript，那么将打印数据保存到文件中可能很有用，因为许多程序都可以处理 PostScript 文件。Java 平台包含了流打印服务，可以从图像和\
  \ 2D 图形产生 PostScript 输出。\n\n枚举流打印服务比定位打印服务稍微麻烦一些。你需要打印对象的 `DocFlavor` 以及流输出的 MIME\
  \ 类型。然后你获取一个 `StreamPrintServiceFactory` 工厂数组。\n\n```\nDocFlavor flavor = DocFlavor.SERVICE_FORMATTED.PRINTABLE;\n\
  String mimeType = \"application/postscript\";\nStreamPrintServiceFactory[] factories\
  \ = StreamPrintServiceFactory.lookupStreamServiceFactories(flavor, mimeType);\n\
  ```\n\n`StreamPrintServiceFactory` 类没有可以帮助我们区分任何一个工厂的方法，因此我们取 `factories[0]`。我们带上输出流参数调用\
  \ `getPrintService` 方法以获取 `StreamPrintService` 对象。\n\n```\nvar out = new FileOutputStream(fileName);\n\
  StreamPrintService service = factories[0].getPrintService(out);\n```\n\n`StreamPrintService`\
  \ 类是 `PrintService` 的子类。要产生输出，只需按照上一节的步骤操作。\n\n`javax.print.StreamPrintServiceFactory`\
  \ 1.4\n\n*   `StreamPrintServiceFactory[] lookupStreamServiceFactories(DocFlavor\
  \ flavor, String mimeType)`\n    查找可以打印给定文档格式并产生 MIME 类型输出流的流打印服务工厂。\n\n*   `StreamPrintService\
  \ getPrintService(OutputStream out)`\n    获取将打印输出发送到给定输出流的打印服务。\n\n列表 12.29 中的程序演示了如何使用流打印服务将\
  \ Java 2D 形状打印到 PostScript 文件。你可以将示例绘图代码替换为生成任何 Java 2D 形状的代码，并将形状转换为 PostScript。然后你可以使用外部工具轻松将结果转换为\
  \ PDF 或 EPS。（遗憾的是，Java 不支持直接打印到 PDF。）\n\nprintService/PrintServiceTest.java\n\n\n\
  \n\n\n```java\npackage printService;\n\nimport java.awt.*;\nimport java.awt.font.*;\n\
  import java.awt.geom.*;\nimport java.awt.print.*;\nimport java.io.*;\nimport javax.print.*;\n\
  import javax.print.attribute.*;\n\n/**\n * This program demonstrates the use of\
  \ stream print services. The program prints  \n * Java 2D shapes to a PostScript\
  \ file. If you don't supply a file name on the command\n * line, the output is saved\
  \ to out.ps.   \n * @version 1.0 2018-06-01\n * @author Cay Horstmann\n */\npublic\
  \ class PrintServiceTest\n{\n   // Set your image dimensions here\n   private static\
  \ int IMAGE_WIDTH = 300;\n   private static int IMAGE_HEIGHT = 300;\n\n   public\
  \ static void draw(Graphics2D g2) \n   {\n      // Your drawing instructions go\
  \ here\n      FontRenderContext context = g2.getFontRenderContext();\n      var\
  \ f = new Font(\"Serif\", Font.PLAIN, 72);\n      var clipShape = new GeneralPath();\n\
  \n      var layout = new TextLayout(\"Hello\", f, context);\n      AffineTransform\
  \ transform = AffineTransform.getTranslateInstance(0, 72);\n      Shape outline\
  \ = layout.getOutline(transform);\n      clipShape.append(outline, false);\n\n \
  \     layout = new TextLayout(\"World\", f, context);\n      transform = AffineTransform.getTranslateInstance(0,\
  \ 144);\n      outline = layout.getOutline(transform);\n      clipShape.append(outline,\
  \ false);\n\n      g2.draw(clipShape);\n      g2.clip(clipShape);\n\n      final\
  \ int NLINES = 50;\n      var p = new Point2D.Double(0, 0);\n      for (int i =\
  \ 0; i < NLINES; i++)\n      {\n         double x = (2 * IMAGE_WIDTH * i) / NLINES;\n\
  \         double y = (2 * IMAGE_HEIGHT * (NLINES - 1 - i)) / NLINES;\n         var\
  \ q = new Point2D.Double(x, y);\n          g2.draw(new Line2D.Double(p, q));\n \
  \     }     \n   }   \n\n   public static void main(String[] args) throws IOException,\
  \ PrintException\n   {\n      String fileName = args.length > 0 ? args[0] : \"out.ps\"\
  ;\n      DocFlavor flavor = DocFlavor.SERVICE_FORMATTED.PRINTABLE;\n      String\
  \ mimeType = \"application/postscript\";\n      StreamPrintServiceFactory[] factories\
  \ \n         = StreamPrintServiceFactory.lookupStreamPrintServiceFactories(flavor,\
  \ mimeType);\n      var out = new FileOutputStream(fileName);\n      if (factories.length\
  \ > 0) \n      {\n         PrintService service = factories[0].getPrintService(out);\
  \            \n         var doc = new SimpleDoc(new Printable() \n            {\n\
  \               public int print(Graphics g, PageFormat pf, int page) \n       \
  \        {\n                  if (page >= 1) return Printable.NO_SUCH_PAGE;\n  \
  \                else \n                  {\n                     double sf1 = pf.getImageableWidth()\
  \ / (IMAGE_WIDTH + 1);\n                     double sf2 = pf.getImageableHeight()\
  \ / (IMAGE_HEIGHT + 1);\n                     double s = Math.min(sf1, sf2);\n \
  \                    var g2 = (Graphics2D) g;\n                     g2.translate((pf.getWidth()\
  \ - pf.getImageableWidth()) / 2, \n                        (pf.getHeight() - pf.getImageableHeight())\
  \ / 2);\n                     g2.scale(s, s);\n\n                     draw(g2);\n\
  \                     return Printable.PAGE_EXISTS;\n                  }\n     \
  \          }\n            }, flavor, null);\n         DocPrintJob job = service.createPrintJob();\n\
  \         var attributes = new HashPrintRequestAttributeSet();\n         job.print(doc,\
  \ attributes);\n      } \n      else\n         System.out.println(\"No factories\
  \ for \" + mimeType);\n   }\n}\n```\n\n### 打印属性\n\n打印服务 API 包含了一组复杂的接口和类，用于指定各种属性。属性分为四组重要的类别。前两组指定对打印机的请求。\n\
  \n*   `打印请求属性 (Print request attributes)` 为打印作业中的所有 `doc` 对象请求特定的功能，例如双面打印或纸张尺寸。\n\
  *   `文档属性 (Doc attributes)` 是仅适用于单个 `doc` 对象的请求属性。\n\n另外两组属性包含关于打印机和作业状态的信息。\n\n\
  *   `打印服务属性 (Print service attributes)` 提供有关打印服务的信息，例如打印机的品牌和型号，或打印机当前是否接受作业。\n\
  *   `打印作业属性 (Print job attributes)` 提供有关特定打印作业状态的信息，例如该作业是否已经完成。\n\n为了描述各种属性，有一个\
  \ `Attribute` 接口，包含多个子接口：\n\n```\nPrintRequestAttribute\nDocAttribute\nPrintServiceAttribute\n\
  PrintJobAttribute\nSupportedValuesAttribute\n```\n\n单个属性类实现了这些接口中的一个或多个。例如，`Copies`\
  \ 类对象描述了打印输出的副本数量。该类同时实现了 `PrintRequestAttribute` 和 `PrintJobAttribute` 接口。显然，一个打印请求可以包含对多个副本的请求。相反，打印作业的属性可能是这些副本中实际打印了多少份。这个数字可能会较低，可能是因为打印机的限制，或者是因为打印机缺纸了。\n\
  \n`SupportedValuesAttribute` 表示该属性并不反映实际状态，而是反映服务的范围。例如，`Copies` 类实现了 `SupportedValuesAttribute`，表示打印机支持\
  \ 1 到 99 份副本。\n\n\n\n\n\n```\nTextSyntax\nDateTimeSyntax\nURISyntax\n```\n\n封装一个字符串、日期时间值或\
  \ URI。\n\n最后，许多属性可以取有限数量的值。例如，`PrintQuality` 属性有三个设置：草稿（draft）、普通（normal）和高质量（high）。它们由三个常量表示：\n\
  \n```\nPrintQuality.DRAFT\nPrintQuality.NORMAL\nPrintQuality.HIGH\n```\n\n具有有限数量值的属性类扩展了\
  \ `EnumSyntax` 类，该类提供了许多方便方法，以类型安全的方式设置这些枚举。在使用此类属性时，你无需担心其内部机制。只需将具名值添加到属性集中即可：\n\
  \n```\nattributes.add(PrintQuality.HIGH);\n```\n\n以下是检查属性值的方法：\n\n```\nif (attributes.get(PrintQuality.class)\
  \ == PrintQuality.HIGH)\n   . . .\n```\n\nTable 12.5 列出了打印属性。第二列列出了属性类的超类（例如，`Copies`\
  \ 属性对应 `IntegerSyntax`）或具有有限值集的属性的枚举值集。最后四列表示该属性类是否实现了 `DocAttribute` (D)、`PrintJobAttribute`\
  \ (J)、`PrintRequestAttribute` (R) 和 `PrintServiceAttribute` (S) 接口。\n\n## 打印属性\n\
