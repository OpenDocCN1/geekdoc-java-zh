  \ summarizingInt(ToIntFunction<? super T> mapper)`\n\n    产生一个 `SummaryStatistics`\
  \ 对象，从中获取应用 `mapper`于每个元素的结果的计数、总和、平均值、最大值和最小值。\n\n* `static <T> Collector<T,?,LongStatistics>\
  \ summarizingLong(LongFunction<? super T> mapper)`\n\n    产生计数。\n\n* `static <T>\
