  \      labelTable = new Hashtable<>();\n\n      // 添加卡片图片\n\n      labelTable.put(0,\
  \ new JLabel(new ImageIcon(\"nine.gif\")));\n      labelTable.put(20, new JLabel(new\
  \ ImageIcon(\"ten.gif\")));\n      labelTable.put(40, new JLabel(new ImageIcon(\"\
