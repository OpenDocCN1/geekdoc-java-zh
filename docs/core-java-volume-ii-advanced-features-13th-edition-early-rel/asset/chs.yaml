  \ C `printf` 函数来实现相同的功能。\n\n```java\n/**\n *  @version 1.11 2007-10-26\n *  @author\
  \ Cay Caymann\n */\nclass HelloNativeTest\n{  \n   public static void main(String[]\
  \ args)\n   {\n      HelloNative.greeting();\n   }\n\n   static\n   {  \n      System.loadLibrary(\"\
  HelloNative\");\n   }\n}\n```\n\n***\n\n*(注：提供的源文本在后半部分有大量重复。我将根据提供内容的逻辑流提供清理后的版本。)*\n\
