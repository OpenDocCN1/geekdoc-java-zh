  \ `byte get(int index)`\n  从指定的索引获取一个字节。\n\n* `ByteBuffer put(byte b)`\n  在当前位置写入一个字节，并将位置移动到下一个字节。\n\
  \n* `ByteBuffer put(int index, byte b)`\n  在指定的索引写入一个字节。\n\n* `ByteBuffer get(byte[]\
  \ destination)`\n* `ByteBuffer get(byte[] destination, int offset, int length)`\n\
  \  用缓冲区填充字节数组（或字节数组的区域），并根据读取的字节数移动位置。如果缓冲区中剩余字节不足，则抛出 `UnderflowException`。\n\n\
  * `ByteBuffer put(byte[] source)`\n* `ByteBuffer put(byte[] source, int offset,\
  \ int length)`\n  将字节数组（或字节数组的区域）的所有字节放入缓冲区，并根据写入的字节数移动位置。如果缓冲区空间不足，则抛出 `BufferOverflowException`。\n\
  \n* `Xxx get()`\n* `Xxx get(int index)`\n* `ByteBuffer put(Xxx value)`\n* `ByteBuffer\
  \ put(int index, Xxx value)`\n  获取或写入一个二进制数字。`Xxx` 是 `Int`、`Long`、`Short`、`Char`、`Float`\
  \ 或 `Double`。\n\n* `ByteBuffer order(ByteOrder order)`\n* `ByteOrder order()`\n\
  \  设置或获取字节序。参数 `order` 的值可以是 `BIG_ENDIAN` 或 `LITTLE_ENDIAN`（`ByteOrder` 类常量）。\n\n\
  * `static ByteBuffer allocate(int capacity)`\n  创建一个给定容量的缓冲区。\n\n* `static ByteBuffer\
  \ wrap(byte[] values)`\n  创建一个以给定数组为基础的缓冲区。\n\n* `CharBuffer asCharBuffer()`\n \
  \ 创建一个以此缓冲区为基础的字符缓冲区。对字符缓冲区的更改会反映在此缓冲区，但字符缓冲区有自己的位置、限制和标记。\n\n`java.nio.CharBuffer`\
  \ 1.4\n\n* `char get()`\n* `CharBuffer get(char[] destination)`\n* `CharBuffer get(char[]\
  \ destination, int offset, int length)`\n\n\n\n\n\n获取一个 `char` 值或一个范围的 `char` 值，从从缓冲区的位置开始，并将位置移过已读取的字符。最后两个方法返回\
  \ `this`。\n\n*   `CharBuffer put(char c)`\n*   `CharBuffer put(char[] source)`\n\
  *   `CharBuffer put(char[] source, int offset, int length)`\n*   `CharBuffer put(String\
  \ source)`\n*   `CharBuffer put(CharBuffer source)`\n\n存入一个 `char` 值或一个范围的 `char`\
  \ 值，从缓冲区的位置开始，并将位置移过已写入的字符。从 `CharBuffer` 读取时，将读取所有剩余字符。所有方法都返回 `this`。\n\n### 缓冲区数据结构\n\
  \n当你使用内存映射时，你会创建一个跨越整个文件或你感兴趣的文件区域的单个缓冲区。你也可以使用缓冲区来读写较小的信息块。\n\n在本节中，我们简要描述了 `Buffer`\
  \ 对象的基本操作。缓冲区是一个相同类型值的数组。`Buffer` 类是一个抽象类，其具体的子类有 `ByteBuffer`、`CharBuffer`、`DoubleBuffer`、`FloatBuffer`、`IntBuffer`、`LongBuffer`\
  \ 和 `ShortBuffer`。\n\n`StringBuffer` 类与这些缓冲区无关。\n\n在实践中，你最常用 `ByteBuffer` 和 `CharBuffer`。如\
  \ #ch01fig11 所示，缓冲区具有：\n\n*   一个不会改变的 `capacity`（容量）\n*   用于读取或写入下一个值的 `position`（位置）\n\
  *   一个超出后读写将没有意义的 `limit`（限制）\n*   可选的，用于重复读写操作的 `mark`（标记）\n\n![Figure](img/fig01-11.jpg)\
  \ 缓冲区\n\n这些值满足条件：\n\n`0 ≤ `mark` ≤ `position` ≤ `limit` ≤ `capacity`\n\n缓冲区的主要目的是“填充，然后消费”的循环。开始时，缓冲区的位置为\
  \ 0，限制为容量。通过调用 `put` 或从通道读取来不断填充缓冲区。\n\n当数据耗尽或达到容量时，是时候切换到消费内容了。调用 `flip` 将限制设为当前位置，并将位置设置为\
  \ `0`。\n\n现在通过调用 `get` 或写入通道来继续消费，只要 `remaining` 方法（计算 `limit – position`）产生正值。\n\
  \n当你消费了缓冲区中的所有值时，调用 `compact` 准备再次填充缓冲区。任何未消费的数据都会被复制到缓冲区的开头。位置被设为紧随复制的数据之后，限制被设为容量。\n\
  \n如果你想重新读取缓冲区，请使用 `rewind` 或 `mark`/`reset`（详情参见 API 注释）。\n\n要获取缓冲区，调用静态方法如 `ByteBuffer.allocate`\
  \ 或 `ByteBuffer.wrap`。\n\n此循环使用缓冲区将数据从一个通道传输到另一个通道：\n\n```\nByteBuffer buffer =\
  \ ByteBuffer.allocate(BUFFER_SIZE);\nboolean doneReading = false;\nboolean doneWriting\
  \ = false;\nwhile (!(doneReading && doneWriting))\n{\n   if (sourceChannel.read(buffer)\
  \ == -1) doneReading = true;\n   buffer.flip();\n   destinationChannel.write(buffer);\n\
  \   if (buffer.remaining() == 0) doneWriting = true;   \n   buffer.compact();\n\
  }\n```\n\n`java.nio.Buffer` 1.4\n\n*   `Buffer flip()`\n    在写入后准备此缓冲区进行读取，将限制设为位置并将位置设为\
  \ `0`；返回 `this`。\n*   `Buffer rewind()`\n    通过将位置设为 `0` 并保持限制不变，准备此缓冲区重新读取相同值；返回\
  \ `this`。\n*   `Buffer clear()`\n    通过将位置设为 `0` 并将限制设为容量，准备此缓冲区进行写入；返回 `this`。\n\
  *   `Buffer mark()`\n    将此缓冲区的标记设为位置；返回 `this`。\n*   `Buffer reset()`\n    将此缓冲区的位置设为标记，从而允许被标记的部分再次被读取或写入；返回\
  \ `this`。\n*   `int remaining()`\n    返回剩余的可读或可写值的数量——即 limit 和 position 之间的差。\n\
  \n`java.nio.ByteBuffer` 1.4\n\n*   `Buffer compact()`\n    将任何未消费的字节复制到缓冲区的开头，将位置设为随后的字节，并将限制设为容量；返回\
  \ `this`。\n\n`java.nio.ReadableByteChannel` 1.4\n\n*   `int read(ByteBuffer dst)`\n\
  \    用可用字节填充缓冲区的剩余部分，并返回传输的字节数，如果通道已到达结尾则返回 -1。\n\n`java.nio.WritableByteChannel`\
  \ 1.4\n\n*   `int write(ByteBuffer src)`\n    尝试消费缓冲区中的剩余字节，并返回传输的字节数。\n\n### 文件锁\n\
  \n当多个同时执行的程序需要修改同一个文件时，它们需要以某种方式进行通信，否则文件很容易损坏。文件锁可以解决这个问题。文件锁控制对文件或文件中某个字节范围的访问。\n\
  \n假设你的应用程序保存了一个带有系统级偏好的的文件。如果用户启动了程序的两个实例，可能会发生它们都想要同时写入文件。\n\n要锁定文件，调用 `FileChannel`\
  \ 类的 `lock` 或 `tryLock` 方法。\n\n```\nFileChannel channel = FileChannel.open(path);\n\
  FileLock lock = channel.lock();\n```\n\n或者\n\n```\nFileLock lock = channel.tryLock();\n\
  ```\n\n第一个调用阻塞直到锁可用。第二个调用立即返回，如果锁可用则返回 `null`。\n\n你也可以通过以下方法锁定文件的部分：\n\n```\nFileLock\
  \ lock = channel.lock(start, size, shared);\n```\n\n或者\n\n```\nFileLock lock = channel.tryLock(start,\
  \ size, shared);\n```\n\n`shared` 标志为 `false` 表示锁定文件以读写。为 `true` 表示共享锁，允许多个进程读取文件，但防止任何进程获取排斥锁。并不是所有操作系统都支持共享锁。即使你请求的是共享锁，也可能获得排斥锁。调用\
  \ `FileLock` 类的 `isShared` 方法可以确定你的类型。\n\n如果文件随后增长锁定部分，额外的区域将不会锁定。要锁定所有字节，请使用 `Long.MAX_VALUE`。\n\
  \n完成后务必解锁。一如既往，这最好通过 `try`-resources 语句完成：\n\n```\ntry (FileLock lock = channel.lock())\n\
  {\n   访问被锁的文件或段\n}\n```\n\n请记住文件锁取决于系统。这里是一些需要注意的点：\n\n*   在某些系统（包括 Linux）上，文件锁仅仅是*建议性的*。如果应用程序未能获取锁，它仍然可以写入另一个应用程序当前锁的文件。\n\
  *   在某些系统上，你不能同时锁定一个文件并将其映射到内存中。\n*   文件锁对于 Java 虚拟机是全局的。并发不能不能获取相同文件的锁。如果另一个线程持有相同文件或重叠范围的锁，`lock`\
  \ 和 `tryLock` 方法将抛出 `OverlappingFileLockException`。\n*   在某些系统上，关闭通道会释放底层文件上的所有锁。因此应避免在同一个被锁文件上使用多个通道。\n\
  *   在网络文件系统上锁定文件高度取决于系统，应该尽量避免。\n*   文件锁仅对 Java 程序提供保证。用其他语言编写的程序可能使用不同且不兼容的锁定机制。\n\
  \n\n\n\n\n`Listing 2.6` 中的程序展示了一个简单的文件锁定示例。多个用户想要在一个公共文件中注册他们的密码。程序读取文件，添加用户名和哈希后的密码，然后写入生成的文件。这种更新是原子性的至关重要。否则，如果两个用户同时更新，密码文件可能会损坏。\n\
  \n关于密码哈希的更多信息，请参见`Chapter 9`。这与文件锁定无关，但我不想展示一个保存未哈希密码的示例程序。\n\n该程序展示了文件锁定 API 的局限性。它于\
  \ `FileChannel` API，而该 API 基于字节缓冲区的读取和写入。程序必须将这些字节缓冲区转换为读取器和写入器。\n\n另一种方法是使用 `RandomAccessFile`，它的\
  \ `getChannel()` 方法可以返回该文件的通道。但这同样不方便。你需要将文件读入字节数组，并准备一个字节数组来写入修改后的文件。\n\n`fileLock/FileLockDemo.java`\n\
  \n```java\npackage fileLock;\n\nimport java.io.*;\nimport java.nio.*;\nimport java.nio.channels.*;\n\
  import java.nio.file.*;\nimport java.security.*;\nimport java.security.spec.*;\n\
  import java.util.*;\n\nimport javax.crypto.*;\nimport javax.crypto.spec.*;\n\n/**\n\
  \ * 此程序将用户名和密码写入 passwords.properties 文件。\n * 文件是原子性更新的。在 Linux 上，尝试：\n *    for\
  \ f in $(seq 1 100) ; do (java fileLock.FileLockDemo user$f secret$f &) ; done\n\
  \ * 当所有 Java 进程结束后，passwords.properties 为每个进程都有一个条目。 \n * \n * @version 1.0 2023-10-27\n\
  \ * @author Cay Horstmann\n */\n\npublic class FileLockDemo\n{\n   public static\
  \ void main(String[] args)\n         throws IOException, NoSuchAlgorithmException,\
  \ InvalidKeySpecException\n   {\n      Path path = Path.of(\"password.properties\"\
  );\n      FileChannel channel = FileChannel.open(path, StandardOpenOption.READ,\n\
  \            StandardOpenOption.WRITE, StandardOpenOption.CREATE);\n      try (FileLock\
  \ lock = channel.lock())\n      {\n         // Read bytes from file\n         ByteBuffer\
  \ readBuffer = ByteBuffer.allocate((int) channel.size());\n         channel.read(readBuffer);\n\
  \n         // Read props from bytes\n         Reader in = new StringReader(new String(readBuffer.array()));\n\
  \         Properties props = new Properties();\n         props.load(in);\n\n   \
  \      // Get username, password from args or user input\n         String username;\n\
  \         char[] password;\n         if (args.length >= 2)\n         {\n       \
  \     username = args[0];\n            password = args[1].toCharArray();\n     \
  \    }\n         else\n         {\n            Console console = System.console();\n\
  \            username = console.readLine(\"User name: \");\n            password\
  \ = console.readPassword(\"Password: \");\n         }\n\n         // Hash password\n\
  \         final int ITERATIONS = 210_000;\n         final int SALT_BYTES = 16;\n\
  \         final int HASH_BYTES = 32;\n         SecureRandom random = new SecureRandom();\n\
  \         byte[] salt = new byte[SALT_BYTES];\n         random.nextBytes(salt);\n\
  \n         var spec = new PBEKeySpec(password, salt, ITERATIONS, 8 * HASH_BYTES);\n\
  \         SecretKeyFactory skf = SecretKeyFactory.getInstance(\"PBKDF2WithHmacSHA256\"\
  );\n         byte[] hash = skf.generateSecret(spec).getEncoded();\n         Base64.Encoder\
  \ encoder = Base64.getEncoder();\n\n         // Put username and hashed password\
  \ into props \n         props.put(username, ITERATIONS + \"|\" + encoder.encodeToString(salt)\
  \ + \"|\"\n               + encoder.encodeToString(hash));\n\n         // Write\
  \ props to bytes\n         StringWriter out = new StringWriter();\n         props.store(out,\
  \ null);\n         byte[] outBytes = out.toString().getBytes();\n\n         // Write\
  \ bytes to file \n         channel.truncate(0);\n         ByteBuffer writeBuffer\
  \ = ByteBuffer.wrap(outBytes);\n         channel.write(writeBuffer);\n      }\n\
  \   }\n}\n```\n\n`java.nio.channels.FileChannel` 1.4\n\n* `FileLock lock()`\n  \
  \  对整个文件获取一个排他锁。该方法会阻塞直到获取锁。\n\n* `FileLock tryLock()`\n    对整个文件获取一个排他锁，如果无法获取锁则返回\
  \ `null`。\n\n* `FileLock lock(long position, long size, boolean shared)`\n\n* `FileLock\
  \ tryLock(long position, long size, boolean shared)`\n    在文件的某个区域获取锁。第一个方法阻塞直到获取锁，第二个方法在无法获取锁时返回\
  \ `null`。参数 `shared` 为 `true` 时表示共享锁，为 `false` 表示排他锁。\n\n* `FileChannel truncate(long\
  \ size)`\n    如果文件大于给定的大小，则将其截断到该大小。\n\n`java.nio.channels.FileLock` 1.4\n\n* `void\
  \ close()` 1.7\n    释放此锁。\n\n`java.io.RandomAccessFile` 1.0\n\n* `FileChannel getChannel()`\
  \ 1.4\n    返回此随机访问文件的通道。\n\n## 正则表达式\n\n正则表达式用于指定字符串模式。每当你需要定位匹配特定模式的字符串时，可以使用正则表达式。例如，我们的示例程序之一通过查找模式为\
  \ `<a href=\". . .\">` 的字符串来定位 HTML 文件中的所有超链接。\n\n当然，在指定模式时，`. . .` 表示法并不精确。你需要使用特殊的语法来描述模式，并精确指定哪些字符序列是合法匹配。\n\
  \n在接下来的章节中，我们将介绍 Java API 使用的正则表达式语法，并讨论如何应用正则表达式。\n\n# 正则表达式语法\n\n让我们从一个简单的例子开始。正则表达式\n\
  \n```\n[Jj]ava.+\n```\n\n匹配任何以下形式的字符串：\n\n* 第一个字母是 `J` 或 `j`。\n* 接下来的三个字母是 `ava`。\n\
  * 字符串剩余部分由一个或多个任意字符组成。\n\n例如，字符串 `\"javanese\"` 匹配此正则表达式，但字符串 `\"Core Java\"` 不匹配。\n\
  \n如你所见，你需要了解一些语法才能理解正则表达式的意思。幸运的是，对于大多数用途，几个简单的构造就足够了。\n\n在正则表达式中，字符表示其本身，除非它是以下保留字符\n\
  \n```\n. * ? { | )  ^ $\n```\n\n例如，正则表达式 `Java` 仅匹配字符串 `Java`。\n\n符号 `.` 匹配单个字符。例如，`.a.`\
  \ 匹配 `Java` 和 `data`。\n\n`*` 符号表示前面的构造可以重复 0 次或多次；对于 `+`，则是 1 次或多次。后缀 `?` 表示构造是可选的（0\
  \ 或 1 次）。例如，`be+s?` 匹配 `be`、`bee` 和 `bees`。你可以用 `{ }` 指定其他次数——参见`[Table 2.12`。\n\
  \n`|` 表示可选`.(oo|ee)f` 匹配 `beef` 或 `woof`。注意括号——如果没有，`.oo|eef` 将是 `.oo` 和 `eef` 之间的可选。括号还用于分组——参见`Section\
  \ 2.7.4`。\n\n*字符类* 是括在括号内的字符可选集，例如 `[Jj]`、`[0-9]`、`[a-z]` 或 `[⁰]`。在字符类内部，`-` 表示范围（所有\
  \ Unicode 值落在两个边界之间的字符）。然而，位于字符类开头或末尾的 `-` 表示其本身。`^` 作为字符类的第一个字符表示补集（除指定字符外的所有字符）。\n\
  \n有很多*预定义字符类*，如 `\\d`（数字）或 `\\s`（空格）——参见`Table 2.12`。更复杂的字符类可以使用 `\\p` 语法在`Table\
  \ 2.13` 中描述。例如，`\\p{Sc}` 是 Unicode 货币符号类。\n\n字符 `^` 和 `$` 匹配输入的开始和结束。\n\n\n\n\n\
  如果你需要使用字面上的 `. * + ? { | ( ) [ \\ ^ $`，请在它们前面加上一个反斜杠。在字符类内部，你只需要转义 `[` 和 `\\`，前提是你留意了\
  \ `] - ^` 的位置。例如，`[]^-]` 是一个包含这三个字符的字符类。\n\n如果正则表达式位于字符串字面量中，每个反斜杠都需要用另一个反斜杠来转义。如果你忘记了第二个反斜杠，通常会得到一个错误，因为像\
  \ `\\$` 或 `\\.` 这样的序列在字符串字面量中是非有效的。但如果你想匹配单词边界却不小心使用了 `\\b` 而不是 `\\\\b`，那么就会出现问题：`\\\
  b` 是一个有效的转义序列，表示退格。\n\n你的 IDE 可以帮助你完成这种转义。将正则表达式字符串粘贴到空字符串中，反斜杠就会双倍。\n\n与其使用反斜杠，你可以用\
  \ `\\Q` 和 `\\E` 包围字符串。例如，`\\(\\$0\\.99\\)` 和 `\\Q($0.99)\\E` 都能匹配字符串 `($0.99)`。\n\
  \n如果你有一个字符串可能包含正则表达式语法中的许多特殊字符之一，你可以通过调用 `Parse.quote(str)` 将它们全部转义。这只是简单的将字符串用\
  \ `\\Q` 和 `\\E` 包围，但它处理了 `str` 可能包含 `\\E` 的特殊情况。\n\n# 正则表达式语法\n\n| 表达式 | 说明 | 示例\
  \ |\n| --- | --- | --- |\n| **字符** | | |\n| `c`, 不属于 `. * + ? { &#124; ( ) [ \\\
  \ ^ $` | 字符 `c` | `J` |\n| `.` | 除换行终止符以外的任意字符，或者在设置了 `DOTALL` 标志时的任意字符 | |\n| `\\\
  X` | 任何 Unicode “扩展字形簇”，它被视为一个字符或符号 | |\n| `\\x{``p`}` | 十进制代码为 `p` 的 Unicode 码点\
  \ | `\\x{1D546}` |\n| `\\uhhhh`, `\\xhh`, `\\0o`, `\\0oo`, `\\0ooo` | 具有给定十六进制或进制值的\
