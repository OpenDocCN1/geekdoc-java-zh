  \n### 工具栏 (Toolbars)\n\n工具栏是一个按钮栏，提供了快速访问程序中最常用命令的方法。\n\n工具栏的特殊之处在于你可以将它们移动到其他地方。你可以将工具栏拖动到框架的四个边界之一。当你松开鼠标按钮时，工具栏就会落在新位置。\n\
  \n如果工具栏位于具有边界布局（border layout）的容器中，或者任何支持 `North`、`East`、`South` 和 `West` 约束的布局管理器，拖动功能即可生效。\n\
  \n工具栏甚至可以从框架中分离。分离后的工具栏被包含在自己的框架中。当你关闭包含分离工具栏的框架时，该工具栏会回到原始框架。\n\n工具栏的编写非常简单。向工具栏中添加组件即可：\n\
  \n```\nvar toolbar = new JToolBar();\ntoolbar.add(blueButton);\n```\n\n`JToolBar`\
  \ 类还有一个方法可以添加一个 `Action` 对象。只需像下面这样用 `Action` 对象填充工具栏即可：\n\n```\ntoolbar.add(blueAction);\n\
  ```\n\naction 的小图标将显示在工具栏中。\n\n你可以使用分隔符来区分按钮组：\n\n```\ntoolbar.addSeparator();\n\
  ```\n\n例如，工具栏在第三和第四个按钮之间有一个分隔符。\n\n然后将工具栏添加到框架中：\n\n```\nadd(toolbar, BorderLayout.NORTH);\n\
  ```\n\n你还可以为分离状态的工具栏指定标题：\n\n```\ntoolbar = new JToolBar(titleString);\n```\n\n\
  默认情况下，工具栏是水平的。要让工具栏初始为垂直，请使用：\n\n```\ntoolbar = new JToolBar(SwingConstants.VERTICAL)\n\
  ```\n\n或者\n\n```\ntoolbar = new JToolBar(titleString, SwingConstants.VERTICAL)\n\
  ```\n\n按钮是工具栏中最常见的组件。但工具栏的组件没有限制。例如，你可以向工具栏添加组合框。\n\n### 提示 (Tooltips)\n\n工具栏的一个缺点是用户往往不知道小图标含义。为了解决这个问题，界面设计师发明了提示。当鼠标悬停在按钮上一段时间时，提示就会激活。提示文本显示在一个颜色的矩形中。当用户移动鼠标时，提示就会消失。\n\
  \n在 Swing 中，你可以通过调用 `setToolTipText` 方法为任何 `JComponent` 添加提示：\n\n```\nexitButton.setToolTipText(\"\
  Exit\");\n```\n\n或者，如果你使用 `Action` 对象，则将提示与 `SHORT_DESCRIPTION` 键关联：\n\n```\nexitAction.putValue(Action.SHORT_DESCRIPTION,\
  \ \"Exit\");\n```\n\n#### javax.swing.JToolBar 1.2\n\n* `JToolBar()`\n* `JToolBar(String\
  \ titleString)`\n* `JToolBar(int orientation)`\n* `JToolBar(String titleString,\
  \ int orientation)`\n  根据给定的标题字符串和方向构造工具栏。`orientation` 是 `SwingConstants.HORIZONTAL`（默认）或\
  \ `SwingConstants.VERTICAL` 之一。\n* `JButton add(Action a)`\n  在工具栏内部构造具有名称、图标、短描述和动作回调的新按钮，并将按钮添加到工具栏的末尾。\n\
  * `void addSeparator()`\n  在工具栏末尾添加一个分隔符。\n\n#### javax.swing.JComponent 1.2\n\n\
  * `void setToolTipText(String text)`\n  设置鼠标悬停在组件上时应显示的提示文本。\n\n## 网格布局 (Grid Bag\
  \ Layout)\n\n到目前为止，我们在示例应用程序的用户界面中只使用了边界布局、流式布局和网格布局。对于更复杂的任务，这些是不够的。\n\n\n\n\n\n\
  自 Java 1.0 以来，AWT 就包含了 `grid bag layout`，它以行和列的形式布局组件。行和列的大小是灵活的，组件可以跨越多行多列。这种布局管理器非常灵活，但也非常复杂。仅仅是提到“grid\
  \ bag layout”这几个词，就让 Java 程序员们感到恐惧。\n\n在尝试设计一种能让程序员从 grid bag layout 的暴政中解出来的布局管理器的失败后，Swing\
  \ 的设计者提出了 `box layout`。根据 `BoxLayout` 类的 JDK 文档：“嵌套多个具有不同水平和垂直[sic]组合的面板，可以产生与 `GridBagLayout`\
  \ 类似的效果，而不会具有其复杂性。”然而，由于每个框都是独立布局的，你无法使用 box 布局同时在水平和垂直方向上排列相邻组件。\n\nJava 1.4 出现了另外一种设计\
  \ grid bag layout 替代品的尝试——`spring layout`，你在这里用想象的弹簧来连接容器中的组件。随着容器大小的变化，弹簧会拉伸或收缩，从而调整组件的位置。这听起来既乏味又困惑，事实也如此。spring\
  \ layout 很快就淡出了舞台。\n\nNetBeans IDE 结合了一个布局工具（称为“Matisse”）和一个布局管理器。用户界面设计师使用该工具将组件拖入容器中，并指示哪些组件应该对齐。该工具将设计者的意图翻译成\
  \ `group layout manager` 的指令。这比手动编写布局管理代码要方便得多。\n\n在接下来的章节中，我将介绍 grid bag layout，因为它是常用的，而且仍然是通过程序生成布局代码最简单的机制。我将向你展示一种策略，让在情况下\
  \ grid bag layout 变得相对不痛苦。\n\n### Grid Bag 基础\n\ngrid bag layout 是所有布局管理器的母体。你可以认为\
  \ grid bag layout 是一种没有限制的网格布局。在 grid bag layout 中，行和列可以有可变的大小。你可以合并相邻单元格为更大的组件留出空间。（许多文字处理器以及\
  \ HTML 都为表格提供了类似的功能：你可以从一个网格开始，然后根据需要合并相邻单元格。）组件不需要填充整个单元格区域，你可以指定它们在单元格内的对齐方式。\n\
  \n考虑图 11.27 中的字体选择器。它由以下组件组成：\n\n* 两个用于指定字体和大小的组合框\n* 这两个组合框的标签\n* 两个用于选择粗体和*斜体*的复选框\n\
  * 一个用于示例字符串的文本区域\n\n![Figure](img/gridbaglayouttest.jpg)字体选择器\n\n现在，将容器切割成单元格网格，如图\
  \ 11.28 所示。（行和列的大小不需要相等。）每个复选框跨越两列，文本区域跨越四行。\n\n![Figure](img/09_30.jpg)设计中使用的对话框网格\n\
  \n要向 grid bag 管理器描述布局，请使用以下步骤：\n\n1. 创建一个类型为 `GridBagLayout` 的对象。你不需要告诉它底层网格有多少行和多少列。相反，布局管理器将尝试根据你之后提供的信息来推测。\n\
  2. 将此 `GridBagLayout` 对象设置为组件的布局管理器。\n3. 对于每个组件，创建一个类型为 `GridBagConstraints` 的对象。设置\
  \ `GridBagConstraints` 对象的字段值，以指定组件在 grid bag 内的布局方式。\n4. 最后，通过调用添加每个组件及其约束：\n\n\
  ```\nadd(component, constraints);\n```\n\n这里是所需的代码示例。（我们将在接下来的章节中详细详细介绍各种约束——所以如果你不知道某些约束的作用，请担心。）\n\
  \n```\nvar layout = new GridBagLayout();\npanel.setLayout(layout);\nvar constraints\
  \ = new GridBagConstraints();\nconstraints.weightx = 100;\nconstraints.weighty =\
  \ 100;\nconstraints.gridx = 0;\nconstraints.gridy = 2;\nconstraints.gridwidth =\
  \ 2;\nconstraints.gridheight = 1;\npanel.add(component, constraints);\n```\n\n诀窍在于知道如何设置\
  \ `GridBagConstraints` 对象的状态。我们将在接下来的章节中讨论这个对象。\n\n### `gridx`, `gridy`, `gridwidth`,\
  \ 和 `gridheight` 参数\n\n`gridx`、`gridy`、`gridwidth` 和 `gridheight` 约束定义了组件在网格中的位置。`gridx`\
  \ 和 `gridy` 值指定了要添加组件的左上角的列和行位置。`gridwidth` 和 `gridheight` 值决定了组件占据的列数和行数。\n\n网格坐标从\
  \ `0` 开始。特别是，`gridx = 0` 和 `gridy = 0` 表示左上角。我们示例中的文本区域具有 `gridx = 2`, `gridy =\
  \ 0`，因为它从第 0 行第 2 列（即第三列）开始。它具有 `gridwidth = 1` 和 `gridheight = 4`，因为它跨越了一列和四行。\n\
  \n### 权重字段\n\n你始终需要为 grid bag 布局中的每个区域设置 `weight` 字段（`weightx` 和 `weighty`）。如果你将权重设置为\
  \ `0`，则该区域在那个方向上永远不会超出初始大小进行增长或收缩。在图 11.27 的 grid bag 布局中，我们将标签的 `weightx` 设置为 `0`。这允许标签在调整窗口大小时保持宽度不变。另一方面，如果你将所有区域的权重设置为\
  \ `0`，容器将聚集在中心，而不是伸以填充它。\n\n从概念上说，权重问题的在于权重是行和列的属性，而不是单个单元格的属性。但你需要为单元格指定它们，因为 grid\
  \ bag 没有暴露行和列。行和列权重是通过单元格权重的最大值计算出的。因此，如果你想让某行或某列保持固定大小，则需要将其中所有组件的权重设置为零。\n\n注意，权重并没有给出列列的大小。它们告诉当容器超过其首选大同时，应该分配多少比例的“剩余”空间。这并不直观。我建议将所有权重设置为\
  \ `100`。然后，运行程序查看布局效果。调整对话框查看行和列如何变化。如果你发现某行或某列不应该增长，将其中所有组件的权重设置为零。你可以尝试其他权重值，但通常不值得。\n\
  \n### `fill` 和 `anchor` 参数\n\n如果你不想组件拉伸并填充整个区域，请设置 `fill` 约束。该参数有四种可能：有效值为 `GridBagConstraints.NONE`、`GridBagConstraints.HORIZONTAL`、`GridBagConstraints.VERTICAL`\
  \ 和 `GridBagConstraints.BOTH`。\n\n如果组件没有填充整个区域，你可以通过设置 `anchor` 字段来指定它在区域中的位置。有效值为\
  \ `GridBagConstraints.CENTER`（默认）、`GridBagConstraints.NORTH`、`GridBagConstraints.NORTEAST`、`GridBagConstraints.EAST`\
  \ 等。\n\n### 内边距\n\n你可以通过设置 `GridBagConstraints` 的 `insets` 字段为组件周围提供额外的空白。设置 `Insets`\
  \ 对象的 `left`、`top`、`right` 和 `bottom` 值为你想在组件周围留的空间。这被称为*外边距*。\n\n`ipadx` 和 `ipady`\
  \ 值设置*内边距*。这些值被加到组件的最小宽度和高度上。这确保了组件不会缩小到其最小尺寸。\n\n\n\n\n\nAWT 文档建议，与其将 `gridx` 和\
  \ `gridy` 值设置为绝对位置，不如将它们设置为常量 `GridBagConstraints.RELATIVE`。然后，按照标准顺序将组件添加到 grid\
  \ bag 布局中：从第一行从左到右，然后移动到下一行，依此类推。\n\n你仍然可以通过提供相应的 `gridheight` 和 `gridwidth` 字段来指定跨越的行数和列数。然而，如果组件延伸到最后（last）一行或一列，你不需要指定具体的数字，而是使用常量\
  \ `GridBagConstraints.REMAINDER`。这告诉布局管理器该组件是其所在行中的最后一个组件。\n\n这种方案看起来确实有效。但将实际的布局信息从布局管理器中隐藏，并希望它能重新发现这些信息，听起来确实很笨拙。\n\
  \n### Grid Bag 布局配方（Recipe）\n\n在实践中，以下配方可以使 grid bag 布局变得相对简单易行：\n\n1. 在纸上画出组件的布局图。\n\
  2. 找到一个网格，使得较小的组件各包含在一个单元格内，而较大的组件跨越多个单元格。\n3. 用 0, 1, 2, 3, . . . 为网格的行和列标记。现在你可以读取\
  \ `gridx`、`gridy`、`gridwidth` 和 `gridheight` 值。\n4. 对于每个组件，问自己它是否需要水平或垂直填充其单元格。如果不需要，你希望它如何对齐？这决定了\
  \ `fill` 和 `anchor` 参数。\n5. 将所有权重设置为 `100`。然而，如果你想让某特定行或特定列始终保持默认大小，请将所有属于该行或该列的组件的\
  \ `weightx` 或 `weighty` 设置为 `0`。\n6. 编写代码。仔细双检你的 `GridBagConstraints` 设置。一个错误的约束条件就会破坏你的整个布局。\n\
  7. 编译、运行并享受其中。\n\n### 用于驯服 Grid Bag 约束的辅助类\n\ngrid bag 布局中最机械的部分是编写设置约束的代码。大多数程序员会为此目的编写辅助函数或一个小型辅助类。我在字体对话框示例的完整代码之后展示了这样一个类。该类具有以下特征：\n\
  \n* 它的名字很短：使用 `GBC` 而不是 `GridBagConstraints`。\n* 它继承了 `GridBagConstraints`，因此可以使用较短的名字，例如用于常量的\
  \ `GBC.EAST`。\n* 在添加组件时使用 `GBC` 对象，例如：\n\n```\nadd(component, new GBC(1, 2));\n\
  ```\n\n* 有两个构造函数用于设置最常用的参数：`gridx` 和 `gridy`，或者 `gridx`、`gridy`、`gridwidth` 和 `gridheight`。\n\
  \n```\nadd(component, new GBC(1, 2, 1, 4));\n```\n\n* 对于成对出现的 x/y 字段，提供了方便的设置方法（setters）：\n\
  \n```\nadd(component, new GBC(1, 2).setWeight(100, 100));\n```\n* setter 方法返回 `this`，因此你可以进行链式调用：\n\
  \n```\nadd(component, new GBC(1, 2).setAnchor(GBC.EAST).setWeight(100, 100));\n\
  ```\n\n* `setInsets` 方法为你构建 `Insets` 对象。要获取 1 像素内边距，只需调用\n\n```\n\nadd(component,\
  \ new GBC(1, 2).setAnchor(GBC.EAST).setInsets(1));\n```\n\nListing 11.7 显示了字体对话框示例的帧类。`GBC`\
  \ 辅助类在 Listing 11.8 中。以下是将组件添加到 grid bag 的代码：\n\n```\nadd(faceLabel, new GBC(0,\
  \ 0).setAnchor(GBC.EAST));\nadd(face, new GBC(1, 0).setFill(GBC.HORIZONTAL).setWeight(100,\
  \ 0).setInsets(1));\nadd(sizeLabel, new GBC(0, 1).setAnchor(GBC.EAST));\nadd(size,\
  \ new GBC(1, 1).setFill(GBC.HORIZONTAL).setWeight(100, 0).setInsets(1));\nadd(bold,\
  \ new GBC(0, 2, 2, 1).setAnchor(GBC.CENTER).setWeight(100, 100));\nadd(italic, new\
  \ GBC(0, 3, 2, 1).setAnchor(GBC.CENTER).setWeight(100, 100));\nadd(sample, new GBC(2,\
  \ 0, 1, 4).setFill(GBC.BOTH).setWeight(100, 100));\n```\n\n一旦你理解了 grid bag 约束，这类代码就非常易读和调试。\n\
  \ngridbag/FontFrame.java\n\n```\npackage gridbag;\n\nimport java.awt.Font;\nimport\
  \ java.awt.GridBagLayout;\nimport java.awt.event.ActionListener;\n\nimport javax.swing.BorderFactory;\n\
  import javax.swing.JCheckBox;\nimport javax.swing.JComboBox;\nimport javax.swing.JFrame;\n\
  import javax.swing.JLabel;\nimport javax.swing.JTextArea;\n\n/**\n * 使用 grid bag\
  \ 布局来安排字体选择的帧。\n */\npublic class FontFrame extends JFrame\n{\n   private static\
  \ int TEXT_ROWS = 10;\n   private static int TEXT_COLUMNS = 20;\n\n   private JComboBox\
  \ face;\n   private JComboBox<Integer> size;\n   private JCheckBox bold;\n   private\
  \ JCheckBox italic;\n   private JTextArea sample;\n   private JLabel faceLabel;\n\
  \   private JLabel sizeLabel;\n   private ActionListener listener;\n\n   public\
  \ FontFrame()\n   {\n      var layout = new GridBagLayout();\n      setLayout(layout);\n\
  \n      // 构建组件\n      faceLabel = new JLabel(\"Face: \");\n      face = new JComboBox<>(new\
  \ String[] {\"Serif\", \"SansSerif\", \"Monospaced\", \"Dialog\"});\n\n      sizeLabel\
  \ = new JLabel(\"Size: \");\n      size = new JComboBox<>(new Integer[] {8, 10,\
  \ 12, 15, 18, 24});\n\n      bold = new JCheckBox(\"Bold\");\n\n      italic = new\
  \ JCheckBox(\"Italic\");\n\n      sample = new JTextArea(\"The brown fox jumps over\
  \ the lazy dog\");\n      sample.setEditable(false);\n      sample.setLineWrap(true);\n\
  \      sample.setBorder(BorderFactory.createEtchedBorder());\n\n      // 将组件添加到\
  \ grid bag，使用 GBC\n      add(faceLabel, new GBC(0, 0).setAnchor(GBC.EAST));\n  \
  \    add(face, new GBC(1, 0).setFill(GBC.HORIZONTAL).setWeight(100, 0).setInsets(1));\n\
  \      add(sizeLabel, new GBC(0, 1).setAnchor(GBC.EAST));\n      add(size, new GBC(1,\
