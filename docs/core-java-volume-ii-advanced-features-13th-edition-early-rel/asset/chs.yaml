  \ Operations)\n\n`reduce` 方法是从流中计算值的通用机制。最简单的形式接收一个二元函数并从第一个元素开始持续应用：\n\n```java\n\
  List<Integer> numbers = Arrays.asList(1, 2, 3, 4);\nOptional<Integer> sum = numbers.stream().reduce((a,\
  \ b) -> a + b);\n```\n\n`reduce` 方法返回 `Optional` 是因为如果流为空则没有有效结果。在这种情况下，你可以写为 `reduce(Integer::sum)`：\n\
  \n```java\nList<Integer> numbers = Arrays.asList(1, 2, 3, 4);\nOptional<Integer>\
  \ sum = numbers.stream().reduce(Integer::sum);\n```\n\n通常，存在一个恒等元 `e` 使得 `e op x\
  \ = x`，该元素可以作为计算的起点。例如，0 是加法的恒等元，你可以使用 `reduce` 的第二形式：\n\n```java\nList<Integer>\
  \ numbers = Arrays.asList(1, 2, 3, 4);\nInteger sum = numbers.stream().reduce(0,\
  \ (a, b) -> a + b);\n```\n\n如果流为空则返回恒等值，你不再需要处理 `Optional` 类。\n\n如果你想在并行流中使用归约，操作必须是*结合律的*\
  \ (associative)：以什么顺序组合元素并不重要。在数学符号中，(`x op y`) op z` 必须等于 `x op (y op z)`。非结合律的操作示例是减法。例如，(6\
  \ − 3) − 2 ≠ 6 − (3 − 2)。\n\n\n\n\n首先，你提供一个“累加”函数 `(total, word) -> total + word.length()`。该函数会被多次调用，以形成累加总和。但当计算并行化时，会产生多个此类计算，你需要合并它们的结果。为此，你又提供了第二个函数。完整的调用方式如下：\n\
  \n```\nint result = words.reduce(0, \n   (total, word) -> total + word.length(),\
  \ \n   (total1, total2) -> total1 + total2);\n```\n\n在实践中，你可能不会频繁地使用 `reduce` 方法。通常情况下，将其映射到数字流并使用其任一个方法来计算和、最大值或最小值更为简单。（我们在第\
  \ 1.13 节）中讨论了数字流。）在这个特定的示例中，你可以调用 `words.mapToInt(String::length).sum()`，这既简单又高效，因为不涉及装箱（boxing）。\n\
  \n有些时候 `reduce` 并不足够通用。例如，假设你想将结果收集到一个 `BitSet` 中。如果集合是并行的，你不能将元素直接放入单个 `BitSet`，因为\
  \ `BitSet` 对象不是线程安全的。出于这个原因，你无法使用 `reduce`。每个段都需要从自己的空集合开始，而 `reduce` 只允许你提供一个标识值（identity）。相反，使用三参数形式的\
  \ `collect`。你提供三个函数：\n\n1. 一个 `supplier`，用于构建目标对象的新实例\n2. 一个 `accumulator`，将元素添加到目标中\n\
  3. 一个 `combiner`，将两个目标对象合并为一个\n\n以下是 `collect` 方法处理位集时的工作原理：\n\n```\nBitSet result\
  \ = stream.collect(BitSet::new, BitSet::set, BitSet::or);\n```\n\njava.util.Stream\
