  \ BinaryOperator<T> accumulator)`\n* `<U> U reduce(U identity, BiFunction<U,? super\
  \ T,U> accumulator, BinaryOperator<U> combiner)`\n  使用给定的 `accumulator` 函数形成流中元素的累加总和。如果提供了\
  \ `identity`，则它是第一个被累加的值。如果提供了 `combiner`，它可以用于合并单独累加的各个段的总和。\n* `<R> R collect(Supplier<R>\
