  \ ↔︎ `Instant` | `FileTime.from(instant)` | `fileTime.toInstant()` |\n\n你现在已经知道如何使用日期时间库来处理全球各地的日期时间和。下一章将进一步讨论面向国际受众的编程。你将看到如何格式化程序消息、数字和货币，使其无论客户在何处都能符合他们的习惯。\n\
  \n# 国际化\n\n外世界很大大；我们希望许多居民都能对你的软件感兴趣。毕竟，互联网毫不而易地跨越了国界障碍。另一方面，当你不关注国际受众时，`你` 正在筑起一道障碍。\n\
  \nJava 编程语言是第一个从底层开始设计为支持国际化的语言。从一开始，它就拥有了有效国际化所需的一个核心特性：它对所有字符串都使用 Unicode。Unicode\
  \ 支持使得编写能够操作世界上大多数语言字符串的 Java 程序变得简单。\n\n许多程序员认为，应用程序国际化唯一需要做的就是支持 Unicode 并翻译用户界面中的消息。然而，正如本章所示，程序的国际化远不仅仅是支持\
  \ Unicode。日期、时间、货币、甚至数字在世界不同地区的格式化方式也不相同。你需要一种简单的方法来为不同的语言配置菜单和按钮名称、消息字符串以及键盘快捷键。\n\
  \n在本章中，你将看到如何编写国际化的 Java 程序，以及如何对日期、时间、数字、文本和 GUI 进行本地化。我将向你展示 Java 为编写国际化程序提供的工具。本章将以一个完整的示例结束——一个具有英语、德语和中文界面的退休金计算器。\n\
  \n## 区域 (Locales)\n\n当你观察一个适应国际市场的应用程序时，你注意到的最明显的区别是语言。这种观察对于真正的国际化来说其实有点局限，因为不同国家可能共享相同的语言，但你可能仍然需要做一些工作来让这两个国家的计算机用户都满意。正如奥斯卡·王尔德所说：“如今我们与美国确实拥有一切共同，除了语言。”\n\
  \n### 为什么用区域 (Locales)？\n\n当你提供程序的国际版本时，所有的程序消息都需要翻译成本地语言。然而，仅仅翻译用户界面文本是不够的。还有许多更微妙的差异——例如，数字在英语和德语中的格式化非常不同。数字\n\
  \n> 123,456.78\n\n对于德国用户来说，应该显示为\n\n> 123.456,78\n\n——也就是说，小数点和十进制逗分隔符的作用是反转的。日期的显示上也有类似的差异。在美国，日期（以某种不理性的）显示为月/日/年。德国使用更符合逻辑的日/月/年顺序，而在中国，用法是年/月/日。因此，日期\n\
  \n> 3/22/61\n\n对德国用户应该呈现为\n\n> 22.03.1961\n\n当然，如果月份是显式写出来的，语言上的差异就会变得显而易见。英语的\n\
  \n> March 22, 1961\n\n在德语中应该呈现为\n\n> 22\\. März 1961\n\n或者在中文中\n\n> 1961 年 3 月 22\
  \ 日\n\n`locale` 捕捉了此类本地偏好。每当你展示数字、日期、货币值和其他格式随语言或位置而变化的项目时，你需要使用感知区域的 API。\n\n####\
  \ 指定区域 (Locales)\n\n一个区域由最多五个组件组成：\n\n1. 语言，由两个或三个小写字母指定，如 `en`（英语）、`de`（德语）或 `zh`（中文）。表\
  \ 7.1 显示了常用代码。\n2. 可选的脚本，由首字母大写的四个字母字母指定，如 `Latn`（拉丁）、`Cyrl`（西里尔）或 `Hant`（繁体中文）。这非常有用，因为某些语言（如塞尔维亚语）使用拉丁或西里尔字母书写，而某些中文读者更倾向于繁体字而非简体。\n\
  3. 可选的国家或地区，由两个大写字母或三个数字指定，如 `US`（美国）或 `CH`（瑞士）。表 7.2 显示了常用代码。\n4. 可选的变体，指定方言或拼写规则等杂项特征。变体现在很少使用。以前曾有一个挪威语的“尼诺尔斯语”（Nynorsk）变体，但现在它用不同的语言代码\
  \ `nn` 表示。以前用于日本皇历和泰国数字的变体现在被表示为扩展（见下一项）。\n5. 可选的扩展。扩展描述了对日历（如日本历）、数字（使用泰国数字而非西方阿拉伯数字）等的本地偏好。Unicode\
  \ 标准规定了其中的一些扩展。扩展以 `u-` 开头，例如 `u-thai` 表示使用泰国数字。其他扩展完全任意的。\n\n`locale` 捕捉了此类本地偏好。每当你展示数字、日期、货币值和其他格式随语言或位置而变化的项目时，你需要使用感知区域的\
  \ API。\n\n#### 指定区域 (Locales)\n\n一个区域由最多五个组件组成：\n\n1. 语言，由两个或三个小写字母指定，如 `en`（英语）、`de`（德语）或\
  \ `zh`（中文）。表 7.1 显示了常用代码。\n2. 可选的脚本，由首字母大写的四个字母指定，如 `Latn`（拉丁）、`Cyrl`（西里尔）或 `Hant`（繁体中文）。这非常有用，因为某些语言（如塞尔维亚语）使用拉丁或西里尔字母书写，而某些中文读者更倾向于繁体字而非简体。\n\
  3. 可选的国家或地区，由两个大写字母或三个数字指定，如 `US`（美国）或 `CH`（瑞士）。表 7.2 显示了常用代码。\n4. 可选的变体，指定方言或拼写规则等杂项特征。变体现在很少使用。以前曾有一个挪威语的“尼诺尔斯语”（Nynorsk）变体，但现在它用不同的语言代码\
  \ `nn` 表示。以前用于日本皇历和泰国数字的变体现在被表示为扩展（见下一项）。\n5. 可选的扩展。扩展描述了对日历（如日本历）、数字（使用泰国数字而非西方阿拉伯数字）等的本地偏好。Unicode\
  \ 标准规定了其中的一些扩展。扩展以 `u-` 开头，例如 `u-thai` 表示使用泰国数字。其他扩展完全任意的。\n\n#### 常用 ISO 639-1\
  \ 语言代码\n\n| 语言 | 代码 | 语言 | 代码 |\n| --- | --- | --- | --- |\n| 中文 | `zh` | 意大利语 |\
  \ `it` |\n| 丹语 | `da` | 日语 | `ja` |\n| 荷兰语 | `nl` | 韩语 | `ko` |\n| 英语 | `en` | 挪威语\
  \ | `no` |\n| 法语 | `fr` | 葡萄牙语 | `pt` |\n| 芬兰语 | `fi` | 西班牙语 | `es` |\n| 德语 | `de`\
  \ | 瑞典语 | `sv` |\n| 希腊语 | `el` | 土耳其语 | `tr` |\n\n#### 常用 ISO 3166-1 国家代码\n\n| 国家\
  \ | 代码 | 国家 | 代码 |\n| --- | --- | --- | --- |\n| 奥利利 | `AT` | 日本 | `JP` |\n| 比时\
  \ | `BE` | 韩国 | `KR` |\n| 加拿 | `CA` | 荷兰 | `NL` |\n| 中国 | `CN` | 挪威 | `NO` |\n|\
  \ 丹麦 | `DK` | 葡萄牙 | `PT` |\n| 芬兰 | `FI` | 西班牙 | `ES` |\n| 德国 | `DE` | 瑞典 | `SE`\
  \ |\n| 英国 | `GB` | 瑞士 | `CH` |\n| 希腊 | `GR` | 台湾 | `TW` |\n| 爱尔兰 | `IE` | 土耳其 |\
  \ `TR` |\n| 意大利 | `IT` | 美国 | `US` |\n\n语言和国家的代码似乎有些随机，因为其中一些源自本地语言。德语在德语中是 Deutsch，中文在中文中是\
  \ zhongwen：因此是 `de` 和 `zh`。瑞士是 `CH`，源自拉丁术语 *Confoederatio Helvetica*。\n\n区域由标签描述——即区域元素的连字符连接字符串，例如\
  \ `en-US`。\n\n在德国，你会使用 `de-DE`。瑞士有四种官方语言（德语、法语、意大利语和罗曼什语）。瑞士的德语使用者会想要使用 `de-CH`。该区域使用德语规则，但货币值以瑞士法表示，而非欧元。\n\
  \n如果你只指定语言，例如 `de`，那么该区域无法用于特定的国家问题（如货币）。\n\n你可以像这样从标签字符串构造 `Locale` 对象：\n\n```\n\
  Locale usEnglish = Locale.forLanguageTag(\"en-US\");\n```\n\n\n\n\n\n在仅指定语言或指定语言和国家的常见情况下，你可以使用\
  \ `Locale.of` 工厂方法：\n\n```\nLocale german = Locale.of(\"de\");\nLocale swissGerman\
  \ = Locale.of(\"de\", \"CH\");\n```\n\n`toLanguageTag` 方法产生给定 locale 的语言标签。例如，`Locale.US.toLanguageTag()`\
  \ 返回字符串 `\"en-US\"`。\n\n为了方便起见，系统为不同的国家定义了预定义的 locale 对象：\n\n```\nLocale.CANADA\n\
  Locale.CANADA_FRENCH\nLocale.CHINA\nLocale.FRANCE\nLocale.GERMANY\nLocale.ITALY\n\
  Locale.JAPAN\nLocale.KOREA\nLocale.PRC\nLocale.TAIWAN\nLocale.UK\nLocale.US\n```\n\
  \n许多预定义的 locale 仅指定语言而不指定地区：\n\n```\nLocale.CHINESE\nLocale.ENGLISH\nLocale.FRENCH\n\
  Locale.GERMAN\nLocale.ITALIAN\nLocale.JAPANESE\nLocale.KOREAN\nLocale.SIMPLIFIED_CHINESE\n\
  Locale.TRADITIONAL_CHINESE\n```\n\n`Locale.ROOT` 具有语言中性的规则，这对于机器处理的字符串非常有用。\n\n\
  最后，静态方法 `getAvailableLocales` 返回虚拟机已知的所有 locale 数组。而 `availableLocales` 方法则返回一个流（stream）。\n\
  \n你可以通过 `Locale.getISOLanguages()` 获取所有语言代码，通过 `Locale.getISOCountries()` 获取所有国家代码。\n\
  \n### 默认 Locale\n\n`Locale` 类的静态方法 `getDefault` 初始获取本地操作系统存储的默认 locale。你可以通过调用带有不同\
  \ locale 参数的 `setDefault` 方法来更改默认的 Java locale。\n\n某些操作系统允许用户为显示消息和格式化指定不同的 locale。例如，居住在美国的法语语者可以使用法语菜单，但货币值以美元为单位。\n\
  \n要获取这些偏好设置，请调用：\n\n```\nLocale displayLocale = Locale.getDefault(Locale.Category.DISPLAY);\n\
  Locale formatLocale = Locale.getDefault(Locale.Category.FORMAT);\n```\n\n在 UNIX\
  \ 中，你可以通过设置环境变量 `LC_NUMERIC`、`LC_MONETARY` 和 `LC_TIME` 来为数字、货币和日期指定不同的 locale。Java\
  \ 不会忽略这些设置。\n\n如果你想测试一个仅包含语言和国家设置的 locale，可以在启动程序时在命令行中提供它们。例如，在这里我们将默认 locale 设置为\
  \ `de-CH`：\n\n```\njava -Duser.language=de -Duser.region=CH MyProgram\n```\n\n###\
  \ 显示名称 (Display Names)\n\n一旦你获得了一个 locale，可以用它做什么呢？事实证明并没有什么。`Locale` 类中唯一有用的方法是用于识别语言和国家代码的。最重要的是\
  \ `getDisplayName`。它返回一个描述 locale 的字符串。该字符串不包含晦涩的两个字母代码，而是以可以呈现给用户的形式，例如：\n\n```\n\
  German (Switzerland)\n```\n\n实际上，这里存在一个问题。显示名称是用默认 locale 发布的。这可能并不合适。如果你的用户已经选择了德语作为首语言，你可能希望以德语呈现该字符串。你可以通过将德语\
  \ locale 作为参数传递来实现。代码如下：\n\n```\nLocale locale = Locale.of(\"de\", \"CH\");\nSystem.out.println(locale.getDisplayName(Locale.GERMAN));\n\
  ```\n\n输出为\n\n```\nDeutsch (Schweiz)\n```\n\n这个示例展示了为什么你需要 `Locale` 对象。你将它们传递给感知\
  \ locale 的方法，这些方法会产生呈现给不同位置用户的文本。你将在后续章节中看到许多此类示例。\n\n即使是是将字符串转换为小写或大写这种平凡的操作也可能是特定\
  \ locale 的。例如，在土耳其 locale 中，字母 I 的小写是一个不带点的 ı。试图通过将其存储为小写来归一化字符串的程序在土耳其客户那里神秘地失败了，因为那里\
  \ I 和带点的 i 没有相同的小写版本。始终使用带有 `Locale` 参数的 `toUpperCase` 和 `toLowerCase` 变体是一个好主意。例如，尝试一下：\n\
  \n```\nString command = \"QUIT\".toLowerCase(Locale.of(\"tr\"));\n// 带有不带点的 \"quıt\"\
  \n```\n\n当然，在 `Locale.getDefault()` 返回该 locale 的土耳其，`\"QUIT\".toLowerCase()` 与 `\"\
  quit\"` 不同。\n\n如果你想将英语语言字符串归一化为小写，你应该向 `toLowerCase` 方法传递一个英语 locale。对于语言中性的处理，请使用\
  \ `Locale.ROOT`。\n\n你可以显式地为输入输出操作设置 locale：\n\n*   当从 `Scanner` 读取数字时，可以使用 `useLocale`\
  \ 方法设置其 locale。\n*   `String.format` 和 `PrintWriter.printf` 方法具有带有 `Locale` 参数的重载形式。\n\
  \n`java.util.Locale` 1.1\n\n*   `static Locale.of(String language)` 19\n*   `static\
  \ Locale.of(String language, String country)` 19：使用给定的语言和国家构造 locale。\n*   `static\
  \ Locale forLanguageTag(String languageTag)` 7：构造与给定语言标签对应的 locale。\n*   `static\
  \ Locale getDefault()`：返回默认 locale。\n*   `static void setDefault(Locale newLocale)`：设置默认\
  \ locale。\n*   `String getDisplayName()`：返回一个描述 locale 的名称，用当前 locale 表达。\n*   `String\
  \ getDisplayName(Locale inLocale)`：返回一个描述 locale 的名称，用给定的 locale 表达。\n*   `String\
  \ getLanguage()`：返回语言代码——一个小写的 639 代码。\n*   `String getLanguage(Locale inLocale)`：返回语言名称，用给定的\
  \ locale 表达。\n*   `String getCountry()`：返回国家代码——一个大写的 ISO 3166 代码。\n*   `static\
  \ String[] getISOCountries()`：返回所有两个字母的国家代码。\n*   `static Set<String> getISOCountries(type)`\
  \ 9：获取 2、3 或 4 个字母的国家代码。`type` 是枚举常量 `PART1_ALPHA2`、`PART1_ALPHA3` 和 `PART3` 之一。\n\
  *   `String getCountry()`：返回国家名称，用当前 locale 表达。\n*   `String getCountry(Locale inLocale)`：返回国家名称，用给定的\
  \ locale 表达。\n*   `String toLanguageTag()` 7：返回 IETF BCP 47 语言标签——例如 `\"de-CH\"\
  `。\n*   `String toString()`：返回 locale 的描述，语言和国家之间用下划线分隔（例如 `\"de_CH\"`）。此方法仅用于调试。\n\
  \n## 数字格式化 (Number Formats)\n\n我已经提到数字和货币格式化是高度依赖环境的。Java 库提供了一组可以格式化和解析数值的对象，位于\
  \ `java.text` 包中。\n\n### 格式化数值\n\n通过以下步骤为特定 locale 格式化数字：\n\n1.  获取 locale 对象，如上一节所述。\n\
  2.  使用“工厂方法”获取格式化对象。\n3.  使用该格式化对象进行格式化和解析。\n\n工厂方法是 `NumberFormat` 类的静态方法，带有 `Locale`\
  \ 参数。有三个工厂方法：`getNumberInstance`、`getCurrencyInstance` 和 `getPercentInstance`。这些方法分别返回可以格式化和解析数字、货币金额和百分比的对象。例如，这里是如何用德语格式化货币值：\n\
  \n```\nLocale locale = Locale.GERMANY;\nNumberFormat formatter = NumberFormat.getCurrencyInstance(locale);\n\
  double amount = 123456.78;\nString result = formatter.format(amount);\n```\n\n结果为\n\
  \n123.456,78 €\n\n注意货币符号是 €，并且位于字符串末尾。还要注意小数点和小逗号的反转。\n\nJava 12 增加了“紧凑”格式，有两种样式：短格式（123K）和长格式（123\
  \ thousand）。这里是获取短样式的方法：\n\n```\nformatter = NumberFormat.getCompactNumberInstance(locale,\
  \ NumberFormat.Style.SHORT);\n```\n\n\n\n\n相反，要读取按照特定区域设置（locale）约定输入或存储的数字，请使用\
  \ `parse` 方法。例如，以下代码解析用户在文本框中输入的值。`parse` 方法可以处理小数点、逗号，以及其他语言中的数字。\n\n```\nTextField\
  \ inputField;\n. . .\nNumberFormat formatter = NumberFormat.getNumberInstance();\n\
  // 获取默认区域的数字格式化\nNumber input = formatter.parse(inputField.getText().strip());\n\
  double x = input.doubleValue();\n```\n\n`parse` 的返回类型是抽象类型 `Number`。返回的对象是 `Double`\
  \ 或 `Long` 包装对象，取决于解析出的数字是否为浮点数。如果你不在乎这种区别，可以简单使用 `Number` 类的 `doubleValue` 方法来获取包装后的数字。\n\
  \n类型为 `Number` 的对象不会自动进行拆箱（unboxed）——你不能简单地将 `Number` 对象赋值给原始类型。相反，请使用 `doubleValue`\
  \ 或 `intValue` 方法。\n\n如果数字文本格式不正确，该方法将抛出 `ParseException`。例如，字符串开头的空格是*不*允许的。（调用\
  \ `strip` 来移除它。）然而，字符串中数字后的任何字符都将被简单忽略，因此不会抛出异常。\n\n注意，`getXxxInstance` 工厂方法返回的实例实际上并不是\
  \ `NumberFormat` 类型。`NumberFormat` 类型抽象类，实际的格式化器属于它的子类之一。工厂方法仅知道如何定位属于特定区域的对象。\n\
  \n你可以使用静态方法 `getAvailableLocales` 获取当前支持的区域列表。该方法返回一个包含可以获取数字格式化器对象的区域数组。\n\n你可以使用\
  \ `Scanner` 来读取本地化的整数和浮点数。调用 `useLocale` 方法来设置区域。\n\n书中的配套代码包含一个 GUI 程序，可以让你对数字格式化器进行实验（参见图\
  \ 7.1）。图顶部的组合框包含所有带有数字格式化器的区域。你可以在数字、货币和百分比格式化器之间进行选择。每当你做出另一个选择时，文本框中的数字就会重新格式化。如果你遍历几个区域，就可以对数字或货币值的多种格式化方式有一个良好的印象。你还可以输入一个不同的数字并点击\
  \ Parse 按钮来调用 `parse` 方法，它会尝试解析你输入的内容。如果解析成功，将其传递给 `format` 并显示结果。如果解析失败，文本框中将显示“Parse\
  \ error”消息。\n\n![Figure](img/NumberFormatTest.jpg)`NumberFormatTest` 程序\n\n代码列表\
  \ 7.1 显示了数字格式化浏览器的文本版本，它更容易跟进。\n\n`numberFormat/NumberFormatTest2.java`\n\n```java\n\
  package numberFormat;\n\nimport java.text.*;\nimport java.util.*;\nimport util.*;\n\
  \n/**\n * 此程序演示了不同区域下的数字格式化。\n * @version 2.0 2021-09-22\n * @author Cay Horstmann\n\
  \ */\npublic class NumberFormatTest2\n{\n   public static void main(String[] args)\n\
  \   {\n      Scanner in = new Scanner(System.in);\n      var locales = (Locale[])\
  \ NumberFormat.getAvailableLocales().clone();\n      Arrays.sort(locales, Comparator.comparing(Locale::getDisplayName));\n\
  \      Locale locale = Choices.choose(in, locales, Locale::getDisplayName);\n\n\
  \      var formatters = new LinkedHashMap<NumberFormat, String>();\n      formatters.put(NumberFormat.getNumberInstance(locale),\
  \ \"Number\");\n      formatters.put(NumberFormat.getCompactNumberInstance(locale,\
  \ NumberFormat.Style.SHORT), \"Compact Short\");\n      formatters.put(NumberFormat.getCompactNumberInstance(locale,\
  \ NumberFormat.Style.LONG), \"Compact Long\");\n      formatters.put(NumberFormat.getPercentInstance(locale),\
  \ \"Percent\");\n      formatters.put(NumberFormat.getCurrencyInstance(locale),\
  \ \"Currency\");\n      NumberFormat formatter = Choices.choose(in, formatters);\n\
  \n      String operation = Choices.choose(in, \"Format\", \"Parse\");\n      if\
  \ (operation.equals(\"Format\"))\n      {\n         System.out.print(\"Enter a floating-point\
  \ number to format: \");\n         double number = in.nextDouble();\n         System.out.println(formatter.format(number));\n\
  \      }\n      else\n      {\n         System.out.print(\"Enter a floating-point\
  \ number to parse: \");\n         String text = in.next();\n         try \n    \
  \     {\n            System.out.println(formatter.parse(text));\n         } \n \
  \        catch (ParseException e) \n         {\n            System.out.println(\"\
  ParseException \" + e.getMessage());\n         }\n      }\n   }\n}\n```\n\n`java.text.NumberFormat`\
  \ 1.1\n\n*   `static Locale[] getAvailableLocales()`\n    返回一个 `Locale` 对象数组，这些对象可以获取\
  \ `NumberFormat` 格式化器。\n*   `static NumberFormat getNumberInstance()`\n*   `static\
  \ NumberFormat getNumberInstance(Locale inLocale)`\n*   `static NumberFormat getCurrencyInstance()`\n\
  *   `static NumberFormat getCurrencyInstance(Locale inLocale)`\n*   `static NumberFormat\
  \ getPercentInstance()`\n*   `static NumberFormat getPercentInstance(Locale inLocale)`\n\
  \    返回用于当前区域或给定区域的数字、货币金额或百分比值的格式化器。\n*   `static NumberFormat getCompactNumberInstance()`\n\
  *   `static NumberFormat getCompactNumberInstance(Locale locale, NumberFormat.Style\
  \ formatStyle)`\n    返回当前区域和样式（`SHORT` 或 `LONG`）的紧凑数字格式化器。\n*   `String format(double\
  \ number)`\n*   `String format(long number)`\n    返回格式化给定浮点数或整数的字符串。\n*   `Number\
  \ parse(String source)`\n    解析给定字符串并返回数字，如果输入描述的是浮点数则返回 `Double`，否则返回 `Long`。字符串开头必须包含数字；不允许有领先空格。数字后可以是其他字符，这些字符将被忽略。如果解析失败，则抛出\
  \ `ParseException`。\n*   `void setParseIntegerOnly(boolean value)`\n*   `boolean\
  \ isParseIntegerOnly()`\n    设置或获取标志，指示格式化器是否只解析整数。\n*   `void setGroupingUsed(boolean\
  \ newValue)`\n*   `boolean isGroupingUsed()`\n    设置或获取标志，指示格式化器是否输出并识别分组分隔符（如 `100,000`）。\n\
  *   `void setMinimumIntegerDigits(int newValue)`\n*   `int getMinimumIntegerDigits()`\n\
  *   `void setMaximumIntegerDigits(int newValue)`\n*   `int getMaximumIntegerDigits()`\n\
  *   `void setMinimumFractionDigits(int newValue)`\n*   `int getMinimumFractionDigits()`\n\
  *   `void setMaximumFractionDigits(int newValue)`\n*   `int getMaximumFractionDigits()`\n\
  \    设置或获取数字整数部分或小数部分允许的最大或最小位数。\n\n### `DecimalFormat` 类\n\n在大多数区域中，上一节中看到的 `NumberFormat`\
  \ 工厂方法返回的是 `DecimalFormat` 类的实例。该类描述了世界各地各种格式化变体。你可以修改单个设置，也可以创建一个全新的格式化器。模式语法让这变得更加方便。\n\
  \n模式描述了必需和可选的位数，以及正负数的前缀和后缀。还有一些更少数罕见的设置——参见表 7.3 。\n\n考虑这个示例：\n\n```java\nvar formatter\
  \ = new DecimalFormat(\"0.00;(#)\");\n```\n\n\n\n分号将正部分和可选的负部分隔开。从正部分可以看出，整数部分必须至少有一位数字，小数部分至少有两个数字。这适用于所有数字，无论正负。负数使用会计格式——即使用前缀\
  \ `(` 和后缀 `)`。\n\n前缀或后缀可以包含一个 `¤` 货币符号（U+00A4），用于标明货币符号（符号）应该出现的位置。\n\n如果你需要在前缀或后缀中插入特殊字符，请在它前面加一个单引号。例如，前缀\
  \ `'#` 是字面上的哈希符号，而 `o''clock` 包含一个引号。\n\n## `DecimalFormat` 属性\n\n| 属性名称 | 描述 |\
  \ 模式 |\n| --- | --- | --- |\n| `groupingSize` | 分组的整数数字位数（通常为 3 或 4） | 最后一个 `,`\
  \ 与整数部分结尾之间的数字个数，例如分组大小为 3 时模式为 `#,###`。 |\n| `minimum`/`maximumFractionDigits`\
  \ | 小数部分的最小和最大数字位数 | 在小数部分中使用必需的（`0`）和可选的（`#`）数字：`.00##`。 |\n| `minimumIntegerDigits`\
  \ | 整数部分的最小位数 | 在整数部分中使用必需的（`0`）数字：`000`。 |\n| `maximumIntegerDigits` | 整数的最大位数\
  \ | 使用指数计数法时，整数部分中 `#` 数字的个数，例如 `###,##0.00E0`。否则，无法在模式中设置。 |\n| — | 指数部分的最小位数 |\
  \ 在 `E` 部分使用 `0` 数字：`#.00E00`。 |\n| `multiplier` | 百分比、千分比的倍数 | 使用 `%` 表示 100，使用\
  \ `‰` (U+2030) 表示 1000。 |\n| `positivePrefix`/`Suffix`, `negativePrefix`/`Suffix`\
  \ | 正或负数的前缀和后缀 | 用字面量前缀或后缀包围模式的正或负部分，例如 `+#0.00;(#)` 对正数使用 `+` 前缀且无后缀，并将负数包含在括号中。\
  \ |\n| `decimalSeparatorAlwaysShown` | 如果小数部分为零则显示分隔符，则为 `true` | 无法在模式中设置。 |\n\n\
  数字、分隔符和其他杂数字部分的实际符号取自 `DecimalFormatSymbols` 对象，你也可以自定义该对象。表 7.4 列出了它的属性。\n\n##\
  \ `DecimalFormatSymbol` 属性\n\n| 属性 | 类型 | 描述 |\n| --- | --- | --- |\n| `currencySymbol`\
  \ | `String` | 一个如 `\"$\"` 或 `\"EUR\"` 的字符串，用于前缀或后缀包含 `¤` 货币符号的地方 |\n| `decimalSeparator`,\
  \ `monetaryDecimalSeparator` | `char` | 用于数字或货币值的小数分隔符 |\n| `exponentSeparator`\
  \ | `String` | 指数部分之前的字符串，通常为 `\"E\"` |\n| `groupingSeparator`, `monetaryGroupingSeparator`\
  \ (自 Java 15) | `char` | 用于数字或货币值的分组分隔符 |\n| `infinity`, `naN` | `String` | 用于格式化\
  \ `Double.POSITIVE_INFINITY`、`Double.NEGATIVE_INFINITY` 和 `Double.NaN` 的字符串 |\n\
  | `internationalCurrencySymbol` | `String` | ISO 4217 货币符号——参见第 7.2.3 节 |\n| `minusSign`\
  \ | `char` | 无负数模式时使用的减号 |\n| `percent`, `perMill` | `char` | 用于百分比或千分数的字符 |\n|\
  \ `zeroDigit` | `char` | 数字零的字符。其他数字是随后的九个 Unicode 字符。 |\n\n例如，你想以美国风格显示数字，使用 `,`\
  \ 作为分组分隔符，`..` 作为小数点分隔符，无论本地设置如何。自定义 `DecimalFormatSymbols` 和格式器：\n\n```\nDecimalFormatSymbols\
  \ symbols = new DecimalFormatSymbols(locale);\nsymbols.setGroupingSeparator(',');\n\
  symbols.setDecimalSeparator('.');\nDecimalFormat formatter = (DecimalFormat) NumberFormat.getNumberInstance(locale);\n\
  formatter.setDecimalFormatSymbols(symbols);\n```\n\n### 货币\n\n要格式化货币值，你可以使用 `NumberFormat.getCurrencyInstance`\
  \ 方法。然而，该方法并不灵活——它返回一个单一货币的格式器。假设你为一位美国客户准备一份发票，其中某些金额是美元，另一些是欧元。你不能直接使用两个格式器：\n\
  \n```\nNumberFormat dollarFormatter = NumberFormat.getCurrencyInstance(Locale.US);\n\
  NumberFormat euroFormatter = NumberFormat.getCurrencyInstance(Locale.GERMANY);\n\
  ```\n\n你的发票看起来非常奇怪，某些值显示为 $100,000，另一些显示为 100.000 €。（注意欧元值使用的是小数点，而不是逗号。）\n\n相反，请使用\
  \ `Currency` 类来控制格式器使用的货币。你可以通过将货币标识传递给静态方法 `Currency.getInstance` 来获取 `Currency`\
  \ 对象。然后为每个格式器调用 `setCurrency` 方法。以下是你如何为你的美国客户设置欧元格式器：\n\n```\nNumberFormat euroFormatter\
  \ = NumberFormat.getCurrencyInstance(Locale.US);\neuroFormatter.setCurrency(Currency.getInstance(\"\
  EUR\"));\n```\n\n货币标识符由 ISO 4217 定义。表 7.5 提供了列表。\n\n| 货币 | 标识符 | 代码 |\n| --- | ---\
  \ | --- |\n| 美元 | USD | 840 |\n| 欧元 | EUR | 978 |\n| 英镑 | GBP | 826 |\n| 日元 | JPY\
  \ | 392 |\n| 人民币 | CNY | 156 |\n| 印度卢比 | INR | 356 |\n| 俄罗斯卢布 | RUB | 643 |\n\n\
  ## 日期和时间\n\n格式化日期时，你应该考虑四个本地相关的问题：\n\n* 月份和星期的名称应以本地语言呈现。\n* 年、月、日的顺序将取决于本地偏好。\n\
  * 格里高历可能不是表示日期的本地偏好。\n* 必须考虑位置的时区。\n\n`java.time` 包中的 `DateTimeFormatter` 类处理这些问题。选择表\
  \ 7.6 所示的格式化样式之一。然后，获取格式器：\n\n```\nFormatStyle style = . . .; // 位于 FormatStyle.SHORT,\
  \ FormatStyle.MEDIUM, . . . \nDateTimeFormatter dateFormatter = DateTimeFormatter.ofLocalizedDate(style);\n\
  DateTimeFormatter timeFormatter = DateTimeFormatter.ofLocalizedTime(style);\nDateTimeFormatter\
  \ dateTimeFormatter = DateTimeFormatter.ofLocalizedDateTime(style);\n   // 或 DateTimeFormatter.ofLocalizedDateTime(dateStyle,\
  \ timeStyle)\n```\n\n这些格式器使用当前本地设置。要使用不同的本地设置，请使用 `withLocale` 方法：\n\n```\nDateTimeFormatter\
  \ dateFormatter =\n   DateTimeFormatter.ofLocalizedDate(style).withLocale(locale);\n\
  ```\n\n现在你可以格式化 `LocalDate`、`LocalDateTime`、`LocalTime` 或 `ZonedDateTime`：\n\n```\n\
  ZonedDateTime appointment = . . .;\nString formatted = formatter.format(appointment);\n\
  ```\n\n日期和时间格式化样式\n\n| 样式 | 日期 | 时间 |\n| --- | --- | --- |\n\n\n\n\n| `SHORT` |\
  \ `7/16/69` | `9:32 AM` |\n| `MEDIUM` | `Jul 16, 1969` | `9:32:00 AM` |\n| `LONG`\
  \ | `July 16, 1969` | `9:32:00 AM EDT` 在 `en-US`, `9:32:00 MSZ` 在 `de-DE` (仅适用于\
  \ `ZonedDateTime`) |\n| `FULL` | `Wednesday, July 16, 1969` | `9:32:00 AM EDT` 在\
  \ `en-US`, `9:32 Uhr MSZ` 在 `de-DE` (仅适用于 `ZonedDateTime`) |\n\n在这里我们使用了来自 `java.time`\
  \ 包的 `DateTimeFormatter` 类。还有一个遗留的 `java.text.DateFormatter` 类，它可以与 `Date` 和 `Calendar`\
  \ 对象一起工作。\n\n你可以使用 `LocalDate`、`LocalDateTime`、`LocalTime` 或 `ZonedDateTime` 的任一个静态\
  \ `parse` 方法来解析字符串中的日期或时间：\n\n```\nLocalTime time = LocalTime.parse(\"9:32 AM\"\
  , formatter);\n```\n\n这些方法不适用于解析人类输入，至少在没有预处理的情况下不是。例如，美国的短时间格式器可以解析 `\"9:32 AM\"\
  `，但不能解析 `\"9:32AM\"` 或 `\"9:32 am\"`。\n\n日期格式化器会解析不存在的日期（例如 11 月 月 31 日），并将其调整为该月的最后一天。\n\
  \n有时你只需要显示星期和月份的名称，例如在日历应用程序中。调用 `DayOfWeek` 和 `Month` 枚举的 `getDisplayName` 方法。\n\
  \n```\nfor (Month m : Month.values())\n   System.out.println(m.getDisplayName(textStyle,\
  \ locale));\n```\n\n表 7.7 显示了文本样式。`STANDALONE` 版本用于格式化日期之外。例如，在芬兰语中，一月在日期内部是“tammikuuta”，但单独出现时是“tammikuu”。\n\
  \n### `java.time.format.TextStyle` 枚举的值\n\n| 样式 | 示例 |\n| --- | --- |\n| `FULL`\
  \ / `FULL_STANDALONE` | January |\n| `SHORT` / `SHORT_STANDALONE` | Jan |\n| `NARROW`\
  \ / `NARROW_STANDALONE` | J |\n\n每周的第一天可以是星期六、星期日或星期一，取决于地区（locale）。你可以这样获取：\n\n\
  ```\nDayOfWeek first = WeekFields.of(locale).getFirstDayOfWeek();\n```\n\n列表 7.2\
