  \ */\npublic class CircleLayoutFrame extends JFrame\n{\n   public CircleLayoutFrame()\n\
  \   {\n      setLayout(new CircleLayout());\n      add(new JButton(\"Yellow\"));\n\
  \      add(new JButton(\"Blue\"));\n      add(new JButton(\"Red\"));\n      add(new\
  \ JButton(\"Green\"));\n      add(new JButton(\"Orange\"));\n      add(new JButton(\"\
  Fuchsia\"));\n      add(new JButton(\"Indigo\"));\n      pack();\n   }\n}\n```\n\
  \n`java.awt.LayoutManager` 1.0\n\n* `void addLayoutComponent(String name, Component\
  \ comp)`\n  向布局中添加一个组件。\n* `void removeLayoutComponent(Component comp)`\n  从布局中移除一个组件。\n\
  * `Dimension preferredLayoutSize(Container cont)`\n  返回在该布局下容器的首选尺寸。\n* `Dimension\
  \ minimumLayoutSize(Container cont)`\n  返回在该布局下容器的最小尺寸。\n* `void layoutContainer(Container\
  \ cont)`\n  对容器中的组件进行布局。\n\n## 对话框 (Dialog Boxes)\n\n在 GUI 应用中，你通常希望弹出独立的对话框，以便向用户提供信息或从用户处获取信息。\n\
  \n与大多数窗口系统一样，AWT 区分了*模态*（modal）和*非模态*（modeless）对话框。模态对话框在关闭之前会阻止与其它窗口的交互；非模态对话框则允许在它打开时与其他窗口进行交互。当你需要用户信息才能继续程序时，请使用模态对话框。\n\
  \n## 简单对话框 (Simple Dialogs)\n\n我们从带有单一消息的最简单模态框开始本节。Swing 提供了一个方便的类，无需编写特殊代码即可弹出对话框。接下来，你将看到如何实现更复杂的对话框。最后，将学习如何在对话框中传输数据。\n\
  \n### 选项面板 (Option Panes)\n\nSwing 提供了现成的简单对话框用于询问信息。`JOptionPane` 有四个静态方法可以显示这些简单对话框：\n\
  \n* `showMessageDialog`: 显示消息并等待用户点击确定。\n* `showConfirmDialog`: 显示消息并获取确认（如确定/取消）。\n\
  * `showOptionDialog`: 显示消息并获取选项（通常来自按钮）。\n* `showInputDialog`: 显示消息并获取输入（通常来自输入框或组合框）。\n\
  \n[图 11.30] 显示了一个典型的对话框。如你所示，对话框包含以下组件：\n\n* 图标\n* 消息\n* 一个或多个选项按钮\n\n输入对话框还有一个用于用户输入的额外组件。它可以是一个允许用户输入任意字符串的文本框，也可以是一个用户从中选择一个项的组合框。\n\
  \n这些对话框的精确布局以及标准消息类型的图标选择取决于可扩展的外（look-and-feel）。左侧的图标取决于五种消息类型之一：\n\n```\nERROR_MESSAGE\n\
  INFORMATION_MESSAGE\nWARNING_MESSAGE\nQUESTION_MESSAGE\nPLAIN_MESSAGE\n```\n\n`PLAIN_MESSAGE`\
  \ 类型没有图标。每种对话类型都有方法允许你提供自定义图标替换标准图标。对于每个对话类型，你都可以指定消息。此消息可以是字符串、图标、用户界面组件或任何对象。以下是消息对象的显示方式：\n\
  \n| `String` | 绘制字符串 |\n| `Icon` | 显示图标 |\n| `Component` | 显示组件 |\n| `Object[]`\
  \ | 显示数组中的所有对象，并堆叠在一起 |\n| `Any other object` | 应用 `toString` 并显示生成的字符串 |\n\n我们将通过查看\
  \ `JFileChooser` 来结束对对话框的讨论。\n\n\n\n\n\n当然，提供一个消息字符串是最常见的情况。提供一个 `Component` 则赋予了你极大的灵活性，因为你可以让\
  \ `paintComponent` 方法绘制你想要的任何内容。\n\n底部的按钮取决于对话框类型和 `option type`。调用 `showMessageDialog`\
  \ 和 `showInputDialog` 时，你只会获得一组标准的按钮（分别是 OK 和 OK/Cancel）。调用 `showConfirmDialog`\
  \ 时，你可以从四种选项类型中选择：\n\n```\nDEFAULT_OPTION\nYES_NO_OPTION\nYES_NO_CANCEL_OPTION\n\
  OK_CANCEL_OPTION\n```\n\n通过 `showOptionDialog`，你可以指定一组任意选项。你提供一个对象数组作为选项。每个数组元素的渲染方式如下：\n\
  \n| 类型 | 描述 |\n| :--- | :--- |\n| `String` | 创建一个以该字符串作为标签的按钮 |\n| `Icon` | 创建一个以图标作为标签的按钮\
  \ |\n| `Component` | 显示该组件 |\n| 其他任何对象 | 应用 `toString` 并以生成的字符串作为标签创建按钮 |\n\n这些函数的返回值如下：\n\
  \n| 方法 | 返回值 |\n| :--- | :--- |\n| `showMessageDialog` | 无 |\n| `showConfirmDialog`\
  \ | 表示所选选项的整数 |\n| `showOptionDialog` | 表示所选选项的整数 |\n| `showInputDialog` | 用户提供或选择的字符串\
  \ |\n\n`showConfirmDialog` 和 `showOptionDialog` 返回整数以指示用户选择了哪个按钮。对于选项对话框，这仅仅是所选选项的索引；如果用户关闭了对话框而不是选择选项，则返回\
  \ `CLOSED_OPTION`。对于确认对话框，返回值可以是以下值之一：\n\n```\nOK_OPTION\nCANCEL_OPTION\nYES_OPTION\n\
  NO_OPTION\nCLOSED_OPTION\n```\n\n这听起来像是一组令人困惑的选择，但在实践中非常简单。请遵循以下步骤：\n\n1. 选择对话框类型（消息、确认、选项或输入）。\n\
  2. 选择图标（错误、信息、警告、提问、无或自定义）。\n3. 选择消息（字符串、图标、自定义组件或它们的组合）。\n4. 对于确认对话框，选择选项类型（默认、Yes/No、Yes/No/Cancel\
  \ 或 OK/Cancel）。\n5. 对于选项对话框，选择选项（字符串、图标或自定义组件）以及默认选项。\n6. 对于输入对话框，在文本字段和组合框之间进行选择。\n\
  7. 在 `JOptionPane` API 中找到要调用的相应方法。\n\n例如，假设你想在图 11.30 中显示对话框。该对话框显示消息并请求用户确认或取消。因此，这是一个确认对话框。图标是一个问号图标。消息是一个字符串。选项类型是\
  \ `OK_CANCEL_OPTION`。以下是你将进行的调用：\n\n```\nint selection = JOptionPane.showConfirmDialog(parent,\n\
  \   \"Message\", \"Title\",\n   JOptionPane.OK_CANCEL_OPTION,\n   JOptionPane.QUESTION_MESSAGE);\n\
  if (selection == JOptionPane.OK_OPTION) . . .\n```\n\n消息字符串可以包含换行符 (`'\\n'`)。这样的字符串将多行显示。\n\
  \n`javax.swing.JOptionPane` 1.2\n\n* `static void showMessageDialog(Component parent,\
  \ Object message, String title, int messageType, Icon icon)`\n* `static void showMessageDialog(Component\
