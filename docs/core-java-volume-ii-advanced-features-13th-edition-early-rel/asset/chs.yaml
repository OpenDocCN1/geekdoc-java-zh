  \ 合并两个结果。\n\n## 基本类型流\n\n到目前为止，我们一直在 `Stream<Integer>` 中收集整数，尽管将每个整数封装成包装对象显然是低效的。其他原始类型也是如此——`double`、`float`、`long`、`short`、`char`、`byte`\
  \ 和 `boolean`。流库提供了专门类型 `IntStream`、`LongStream` 和 `DoubleStream`，它们直接存储原始值，而不使用包装类。如果你想存储\
