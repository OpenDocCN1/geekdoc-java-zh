  ## 文本边界\n\n`BreakIterator` 类将文本分割为字符、单词、句子或行。其迭代协议并不优雅：\n\n```\nString s = \"A man.\
  \ A plan. Panama!\";\nBreakIterator iter = BreakIterator.getSentenceInstance(locale);\n\
  iter.setText(s);\nint start = iter.first();\nint end = iter.next();\nwhile (end\
  \ != BreakIterator.DONE) {\n   String segment = s.substring(start, end);\n   start\
  \ = end;\n   end = iter.next();\n   System.out.println(segment);\n}\n```\n\n这些静态方法返回了四种迭代器：\n\
  \n* `getCharacterInstance` 方法产生一个对字形簇（grapheme clusters）的迭代器——即产生可见字符的 Unicode 序列。\n\
  * `getWordInstance` 方法产生一个产生单词或单词分隔符的迭代器。由你来判断每个段的类型。\n* `getSentenceInstance` 方法的迭代器将文本分割为句子。\n\
  * `getLineInstance` 迭代器产生行。\n\n每个方法都有两个版本：一个是不带参数的（使用默认区域设置），另一个是带有 `Locale` 参数的。\n\
  \n与其使用 `BreakIterator` 迭代字形簇，你可以使用正则表达式：\n\n```\nString[] clusters = s.split(\"\\\
  \\b{g}\");\n```\n\n## 文本输入与输出\n\n如你所知，Java 编程语言本身完全基于 Unicode 的。然而，Windows 和 Mac\
  \ OS X 在西欧国家仍然支持遗留的字符编码，例如 Windows-1252 或 Mac Roman，或者台湾的 Big5。因此，通过文本与用户通信并不像想象的那么简单。以下章节将讨论你可能会遇到的复杂情况。\n\
  \n### 文本文件\n\n如今，使用 UTF-8 保存和加载文本文件是最佳选择。但你可能需要处理遗留文件。如果你知道预期的字符编码，可以在读写文本文件时指定它：\n\
  \n```\nCharset windows1252 = Charset.forName(\"Windows-1252\");\nvar out = new PrintWriter(filename,\
  \ windows1252);\n```\n\n若要猜测用户偏好的编码，可以使用源自执行 Java 虚拟机的系统的“原生编码”（native encoding）。从\
  \ Java 18 开始，它的名称是系统属性 `native.encoding` 的值。\n\n在 Java 18 之前，原生编码是默认字符集，你可以通过静态方法\
  \ `Charset.defaultCharset()` 获取它。\n\n### 行结束符\n\n这不是区域设置的问题，而是平台的问题。在 Windows 上，文本文件预期每行末尾使用\
  \ `\\r\\n`，而基于 UNIX 的系统只需要 `\\n` 字符。如今，大多数 Windows 程序可以处理 `\\n`，但旧程序和控制台可能会给用户带来麻烦。\n\
  \n使用 `println` 方法写入的任何行都会被正确终止。唯一的问题是你打印了包含 `\\n` 字符的字符串。它们不会被自动修改为平台结束符。\n\n与其在字符串中使用\
  \ `\\n`，不如使用 `printf` 和 `%n` 格式说明符来产生取决于平台的行结束符。例如，\n\n```\nout.printf(\"Hello%nWorld%n\"\
  );\n```\n\n在 Windows 上产生：\n\n```\nHello\\r\\nWorld\\r\\n\n```\n\n在其他地方产生：\n\n```\n\
  Hello\\nWorld\\n\n```\n\n### 控制台\n\n如果你编写通过 `System.in`/`System.out` 或 `System.console()`\
  \ 与用户通信的程序，就必须面对控制台可能使用与默认字符集不同的字符编码的可能性。这在 Windows 上使用 `cmd` 壳时尤为明显。在 Windows 11\
  \ 美国版中，命令外壳仍使用源自 1982 年 IBM 个人电脑的古老 `IBM437` 编码。`Charset.defaultCharset()` 方法将返回\
  \ `Windows-1252` 字符集，这是完全不同的。例如，欧元符号 € 存在于 `Windows-1252` 中但在 `IBM437` 中不存在。当你调用\n\
  \n```\nSystem.out.println(\"100 €\");\n```\n\n控制台将显示\n\n```\n100 ?\n```\n\n理想情况下，你的用户应该将控制台切换到\
  \ UTF-8。在 Windows 中，命令是：\n\n```\nchcp 65001\n```\n\n从 Java 18 开始，这就足够让 Java 在控制台中使用\
  \ UTF-8。在之前的版本中，还有必要用 `file.encoding` 系统属性设置平台编码：\n\n```\njava -Dfile.encoding=UTF-8\
  \ MyProg\n```\n\n如果你无法让用户更改控制台的字符编码，可以找出它是什么。从 Java 18 开始，系统属性 `stdout.encoding`\
  \ 和 `stderr.encoding` 提供了这些信息。你也可以在命令行更改设置。\n\n只要 `System.console()` 不为 `null`，你调用\
  \ `System.console().charset()`。\n\n如果你通过 `Scanner(System.in)` 获取输入，使用的是默认字符集而不是控制台编码。如果两者不匹配，将无法工作。请使用\
  \ `new Scanner(System.console().reader())`。\n\n### UTF-8 字节序\n\n如前，当可以时使用 UTF-8\
  \ 文件是一个好主意。然而，如果你的应用程序必须读取其他程序创建的 UTF-8 文件，就会遇到另一个潜在问题。在文件开头添加“字节序标记”字符 U+FEFF 是完全合。在\
  \ UTF-16 编码中（每个代码单元是双字节），字节序标记告诉读取器文件使用的是“大端”还是“小端”字节序。UTF-8 是单字节编码，因此不需要指定字节序。但如果文件以\
  \ `0xEF 0xBB 0xBF`（U+FEFF 的 UTF-8 编码）开头，这强烈表明它使用的是 UTF-8。因此，Unicode 标准鼓励这种做法。任何读取器应该忽略初始的字节序标记。\n\
  \n这里只有一个例外。Oracle Java 的实现固地拒绝遵循这一建议，理由是潜在的兼容性问题。这意味着你，程序员，必须完成平台不做的事。当你读取文本文件并在开头遇到\
  \ `U+FEFF` 时，忽略它。\n\n遗憾的是，JDK 实现者没有遵循这一建议。当你向 `javac` 编译器传递一个带有字节序标记的有效 UTF-8 源文件时，编译将失败并报错“illegal\
  \ character: \\65279”。\n\n### 源文件的字符编码\n\n你，程序员需要与 Java 编译器通信——而你通过本地系统上的工具来实现。例如，如果你使用中文或日文版\
  \ Windows，你的 Java 源文件可能是用本地字符编码的。此类源文件是可移植的（只有编译后的类文件是移植的——它们对标识符和字符串使用“修改 UTF-8”编码）。\n\
  \n不可移植的源文件并非理想。如今很容易配置文本编辑器和开发环境为源文件使用 UTF-8。从 Java 18 开始，`javac` 编译器默认期望 UTF-8\
  \ 编码的源文件。在早期版本中，以以下方式运行编译器：\n\n```\njavac -encoding UTF-8 Myfile.java\n```\n\n要编译非\
  \ UTF-8 的遗留源文件，以同样的方式指定编码。\n\n\n\n\n在对应用程序进行本地化时，你可能会面临数量惊人的消息字符串、按钮标签等，所有这些内容都需要翻译。为了使这项任务具有可行性，你需要在外部位置定义这些消息字符串，该位置通常被称为\
  \ `resource`（资源）。执行翻译的人员只需简单编辑资源文件，而无需触碰程序的源代码。\n\n在 Java 中，你可以使用属性文件（property files）来指定字符串资源，并为其他类型的资源实现类。\n\
  \nJava 技术资源与 Windows 或 Macintosh 资源不同。Macintosh 或 Windows 可执行程序将菜单、对话框、图标和消息等资源存储在与程序代码分开的区域中。资源编辑器可以检查并更新这些资源，而不影响程序代码。\n\
  \n第一卷第五章 描述了 JAR 文件资源的概念，通过这种方式，数据文件、声音和图像可以放在 JAR 文件中。`Class` 类的 `getResource`\
  \ 方法可以找到文件、打开它并返回一个指向资源的 URL。通过将你的文件放入 JAR 文件中，你将查找文件的工作交给了类加载器——它已经知道如何定位 JAR 文件中的项。然而，该机制不支持本地化（locale）。\n\
  \n### 定位资源包（Resource Bundles）\n\n在对应用程序进行本地化时，你会生成一组 `resource bundles`（资源包）。每个包都是一个属性文件或一个描述特定本地化项（如消息、标签等）的类。对于每个包，你必须为你想要支持的所有本地化提供版本。\n\
  \n你需要为这些包使用特定的命名约定。例如，特定于德国的资源进入文件 `baseName_de_DE`，而所有德语国家共享的资源进入 `baseName_de`。通常情况下，使用\n\
  \n```\nbaseName_language_country\n```\n\n用于所有特定国家的资源，并使用\n\n```\nbaseName_language\n\
  ```\n\n用于所有特定语言的资源。最后，作为回退方案，你可以将默认值放在没有任何后缀的文件中。\n\n要加载包，请使用命令：\n\n``````\nResourceBundle\
  \ currentResources = ResourceBundle.getBundle(baseName, currentLocale);\n```\n\n\
  `getBundle` 方法尝试加载与当前语言和国家匹配的当前本地化包。如果加载失败，将依次放弃国家和语言。然后对默认本地化应用相同的搜索，最后查询默认包文件。如果该尝试也失败了，该方法将抛出\
  \ `MissingResourceException`。\n\n也就是说，`getBundle` 方法尝试加载以下包：\n\n```\nbaseName_currentLocaleLanguage_currentLocaleCountry\n\
  baseName_currentLocaleLanguage\nbaseName_defaultLocaleLanguage_defaultLocaleCountry\
  \ \nbaseName_defaultLocaleLanguage\nbaseName\n```\n\n一旦 `getBundle` 方法定位了一个包（例如\
  \ `baseName_de_DE`），它仍然会继续寻找 `baseName_de` 和 `baseName`。如果这些包存在，它们将成为 `resource\
  \ hierarchy`（资源层级结构）中 `baseName_de_DE` 包的 `parents`（父级）。之后在查找资源时，如果当前包中查找未成功，则会搜索父级。也就是说，如果不在\
  \ `baseName_de_DE` 中没有找到特定资源，也会查询 `baseName_de` 和 `baseName`。\n\n这显然是一个非常实用的服务——而且如果手动编写程序将非常繁琐。Java\
  \ 编程语言的资源包机制会自动定位与给定本地化最匹配的项。在现有程序中添加越来越多的本地化是很容易的——你只需要创建额外的资源包即可。\n\n如果某个本地化带有脚本或变体，查找过程将复杂得多。详细细节请参见\
  \ `ResourceBundle.Control.getCandidateLocales` 方法的文档。\n\n你不需要将应用程序的所有资源都放在一个包中。你可以为按钮标签准备一个包，为错误消息准备一个包等等。\n\
  \n### 属性文件（Property Files）\n\n字符串国际化非常简单。你将所有字符串放入属性文件中，例如 `MyProgramStrings.properties`。这只是一个文本文件，每行一个键/值对。一个典型的文件看起来如下所示：\n\
  \n```\ncomputeButton=Rechnen\ncolorName=black\ndefaultPaperSize=210×297\n```\n\n\
  然后，按照上一节描述的方法命名你的属性文件，例如：\n\n```\nMyProgramStrings.properties\nMyProgramStrings_en.properties\n\
  MyProgramStrings_de_DE.properties\n```\n\n你可以简单地加载包：\n\n```\nResourceBundle bundle\
  \ = ResourceBundle.getBundle(\"MyProgramStrings\", locale);\n```\n\n要查找特定字符串，调用：\n\
  \n```\nString computeButtonLabel = bundle.getString(\"computeButton\");\n```\n\n\
  属性文件以 UTF-8 编码。\n\n在 Java 9 之前，用于存储属性的文件必须是 ASCII 文件，非 ASCII 字符必须使用 `\\uxxxx` 表示法进行编码。例如，`\"\
  colorName=Grün\"` 必须指定为：\n\n```\ncolorName=Gr\\u00FCn\n```\n\n### 包类（Bundle Classes）\n\
  \n为了提供不是字符串的资源，请定义扩展 `ResourceBundle` 的类。使用标准命名约定命名你的类，例如：\n\n```\nMyProgramResources.java\n\
  MyProgramResources_en.java\nMyProgramResources_de_DE.java\n```\n\n使用与加载属性文件相同的 `getBundle`\
  \ 方法加载该类：\n\n```\nResourceBundle bundle = ResourceBundle.getBundle(\"MyProgramResources\"\
  , locale);\n```\n\n在搜索包时，如果基名称相同，类中的包优先级高于属性文件。每个资源包类实现一个查找表。你需要为想要本地化的设置提供键字符串，并使用该键字符串检索设置。例如：\n\
  \n```\nvar backgroundColor = (Color) bundle.getObject(\"backgroundColor\");\ndouble[]\
  \ paperSize = (double[]) bundle.getObject(\"defaultPaperSize\");\n```\n\n实现资源包最简单的方法是扩展\
  \ `ListResourceBundle` 类。`ListResourceBundle` 让你将所有资源放入对象数组，然后由它完成查找。遵循以下代码结构：\n\
  \n```\npublic class baseName_language_country extends ListResourceBundle\n{\n  \
  \ private static final Object[][] contents =\n   {\n      { key1, value2 },\n  \
  \    { key2, value2 },\n      . . .\n   }\n   public Object[][] getContents() {\
  \ return contents; }\n}\n```\n\n例如：\n\n```\npublic class ProgramResources_de extends\
  \ ListResourceBundle\n{\n   private static final Object[][] contents =\n   {\n \
  \     { \"backgroundColor\", Color.black },\n      { \"defaultPaperSize\", new double[]\
  \ { 210, 297 } }\n   }\n   public Object[][] getContents() { return contents; }\n\
  }  \npublic class ProgramResources_en_US extends ListResourceBundle\n{\n   private\
  \ static final Object[][] contents =\n   {\n      { \"backgroundColor\", Color.blue\
  \ },\n      { \"defaultPaperSize\", new double[] { 216, 279 } }\n   }\n   public\
  \ Object[][] getContents() { return contents; }\n}\n```\n\n纸张尺寸以毫米给出。除了美国和加拿大外，地球上所有国家都使用\
  \ ISO 216 纸张尺寸。更多信息请参见 [`www.cam.ac.uk/~mgk25/iso-paper.html`](https://www.cam.ac.uk/~mgk25/iso-paper.html)。\n\
  \n或者，你的资源包类也可以扩展 `ResourceBundle` 类。这时你需要实现两个方法，用于枚举所有键和查找给定键的值：\n\n```\nEnumeration<String>\
  \ getKeys()\nObject handleGetObject(String key)\n```\n\n`ResourceBundle` 类的 `getObject`\
  \ 方法会调用你提供的 `handleGetObject` 方法。\n\n\n\n\n\n根据给定的名称、指定的语言区域（locale）或默认语言区域及其父类，加载资源包类。如果资源包类位于某个包中，则基类名必须包含完整的包名，例如\
  \ `\"intl.ProgramResources\"`。资源包类必须是 `public` 的，这样 `getBundle` 方法才能访问它们。\n\n* \
  \  `Object getObject(String name)`\n    从资源包或其父类中查找一个对象。\n\n*   `String getString(String\
  \ name)`\n    从资源包或其父类中查找一个对象，并将其强制转换为字符串。\n\n*   `String[] getStringArray(String\
  \ name)`\n    从资源包或其父类中查找一个对象，并将其转换为字符串数组。\n\n*   `Enumeration<String> getKeys()`\n\
  \    返回一个枚举对象，用于枚举此资源包的键。它也会枚举父类资源包中的键。\n\n*   `Object handleGetObject(String key)`\n\
  \    如果你定义了自己的资源查找机制，则应重写此方法以查找与给定键关联的资源。\n\n## 完整示例\n\n在本节中，我们将本章的内容应用于本地化一个退休计算器。该程序计算你为退休储蓄了足够的资金。你输入年龄、每月储蓄的金额等（参见图\
  \ 7.4）。\n\n![Figure](img/fig05-04.jpg)英语版的退休计算器\n\n文本区域和图表显示了每年退休账户的余额。如果数字在你生活的后后期变为负数，且图表中的条形出现在\
  \ `x` 轴下方，你需要做些什么——例如，存更多的钱、推迟退休时间、早点去世，或者年轻得一些。\n\n该退休计算器支持三个语言区域（英语、德语和中文）。以下是国际化的一些亮点：\n\
  \n*   标签、按钮和消息被翻译成了德语和中文。你可以在类 `RetireResources_de` 和 `RetireResources_zh` 类中找到它们。英语被用作备用方案——参见\
  \ `RetireResources` 文件。\n\n*   每当语言区域更改时，我们都会重置标签并重新格式化文本字段的内容。\n\n*   文本字段以本地格式处理数字、货币金额和百分比。\n\
  \n*   计算字段使用 `MessageFormat`。格式字符串存储在每个语言的资源包中。\n\n*   仅仅为了证明这是可行的，我们根据用户选择的语言为条形图使用了不同的颜色。\n\
  \n图 7.5 显示了德语输出。要显示中文字符（如图 7.6 所示），请确保你的 Java 运行时已安装并配置了中文字符。否则，中文将显示为“缺失字符”图标。\n\
  \n列表 7.4 显示了简化文本版本的代码，遗憾的是没有颜色。列表 7.5 是英语字符串的属性文件。本地化后的字符串位于列表 7.6（德语）和列表 7.7（中文）。\n\
  \n![Figure](img/fig05-05.jpg)德语版的退休计算器![Figure](img/fig05-06.jpg)中文版的退休计算器 expire2/Retire.java\n\
  \n```\npackage retire2;\n\nimport java.text.*;\nimport java.util.*;\n\nimport util.Choices;\n\
  \n/**\n * 此程序显示了一个退休计算器。提示信息以英语、德语或中文显示。\n * @version 1.3 2023-11-07\n * @author\
  \ Cay Horstmann\n */\npublic class Retire\n{\n   public static void main(String[]\
  \ args)\n   {\n      // 获取语言区域\n      ResourceBundle bundle = ResourceBundle.getBundle(\"\
  retire.RetireStrings\", Locale.getDefault());      \n      System.out.println(bundle.getString(\"\
  language\"));\n      Scanner in = new Scanner(System.in);\n      Locale[] locales\
  \ = { Locale.US, Locale.CHINA, Locale.GERMANY };\n      Locale currentLocale = Choices.choose(in,\
  \ locales, Locale::getDisplayName);\n\n      bundle = ResourceBundle.getBundle(\"\
  retire.RetireStrings\", currentLocale);      \n\n      // 提示参数\n      System.out.print(bundle.getString(\"\
  savings\") + \": \");\n      double savings = in.nextDouble();\n\n      System.out.print(bundle.getString(\"\
  contributions\") + \": \");\n      double contributions = in.nextDouble();\n\n \
  \     System.out.print(bundle.getString(\"income\") + \": \");\n      double income\
  \ = in.nextDouble();\n\n      System.out.print(bundle.getString(\"currentAge\")\
  \ + \": \");\n      int currentAge = in.nextInt();\n\n      System.out.print(bundle.getString(\"\
  retireAge\") + \": \");\n      int retireAge = in.nextInt();\n\n      System.out.print(bundle.getString(\"\
  deathAge\") + \": \");\n      int deathAge = in.nextInt();\n\n      System.out.print(bundle.getString(\"\
  inflationPercent\") + \": \");\n      double inflationPercent = in.nextDouble();\n\
  \n      System.out.print(bundle.getString(\"investPercent\") + \": \");\n      double\
  \ investPercent = in.nextDouble();\n\n      // 显示值\n      MessageFormat retireMsg\
  \ = new MessageFormat(bundle.getString(\"retire\"));\n      retireMsg.setLocale(currentLocale);\n\
  \n      double balance = savings;\n      for (int year = currentAge; year <= deathAge;\
  \ year++)\n      {\n         balance = (balance + contributions) * (1 + investPercent);\n\
  \         if (year < retireAge) {\n            balance += income;\n         } else\
  \ {\n            balance -= income;\n         }\n         Object[] msgArgs = { year,\
  \ balance };\n         System.out.println(retireMsg.format(msgArgs));\n      }\n\
  \   }\n}\n```\n\nretire2/RetireStrings.properties\n\n```\nlanguage=语言\ncomputeButton=计算\n\
  savings=储蓄\ncontributions=缴款\nincome=收入\ncurrentAge=当前年龄\nretireAge=退休年龄\ndeathAge=寿命\n\
  inflationPercent=通货膨胀率\ninvestPercent=投资收益\nretire=年龄：{0,number} 余额：{1,number}\n\
  ```\n\nretire2/RetireStrings_de.properties\n\n```\nlanguage=Sprache\ncomputeButton=Rechnen\n\
  savings=Vorherige\ncontributions=Jährliche Einzahlung\nincome=Einkommen nach Ruhestand\n\
  currentAge=Jetziges Alter\nretireAge=Ruhestandalter\ndeathAge=Lebenserwartung\n\
  inflationPercent=Inflation\ninvestPercent=Investitionsgewinn\nretire=Alter：{0,number}\
  \ Guthaben：{1,number}\n```\n\nretire2/RetireStrings_zh.properties\n\n```\nlanguage=语言\n\
  computeButton=计算\nsavings=现有\ncontributions=每年存金\nincome=退休收入\ncurrentAge=现龄\nretireAge=退休年龄\n\
  deathAge=预期寿命\ninflationPercent=通货膨胀\ninvestPercent=投资报酬\nretire=年龄：{0,number} 总结：{1,number}\n\
  ```\n\n你已经了解了如何使用 Java 语言的国际化功能。现在你可以使用资源包提供多种语言的翻译，并使用格式化器和比较器处理特定区域的文本。\n\n在下一章中，我们将深入探讨脚本和编译。\n\
  \n# 编译与脚本\n\n本章介绍了两种处理代码的技术。当你想要在应用程序内部编译 Java 代码时，可以使用编译器 API。脚本 API 则允许你调用 JavaScript\
  \ 或 Groovy 等脚本语言的代码。\n\n## 编译器 API\n\n有很多工具需要编译 Java 代码。显然，开发环境和教授 Java 编程的程序位于其中，还有测试和构建自动化工具。另一个例子是\
  \ Jakarta Server Pages（即嵌入了 Java 语句的网页）的处理。\n\n### 调用编译器\n\n调用编译器非常简单。这里是一个示例调用：\n\
  \n```\nJavaCompiler compiler = ToolProvider.getSystemJavaCompiler();\nOutputStream\
  \ outStream = . . .;\nOutputStream errStream = . . .;\nint result = compiler.run(null,\
  \ outStream, errStream,\n   \"-sourcepath\", \"src\", \"Test.java\");\n```\n\n`result`\
  \ 值为 `0` 表示编译成功。\n\n\n\n\n编译器将它的输出和错误消息发送到提供的流中。你可以将这些参数设置为 `null`，在这种情况下，将使用 `System.out`\
  \ 和 `System.err`。`run` 方法的第一个参数是一个输入流。由于编译器不接受控制台输入，你始终可以将其留为 `null`。（`run` 方法继承自泛型\
  \ `javax.tools.Tool` 接口，该接口允许读取输入的工具。）\n\n`run` 方法剩余的参数是你在如果你在命令行调用 `javac` 时会传递给它的参数。这些参数可以是选项或文件名。\n\
  \n### 启动编译任务\n\n你可以通过 `CompilationTask` 对象对编译过程进行更细的控制。如果你想从字符串提供源码、在内存中捕获类文件或处理错误和警告消息，这将非常有用。\n\
  \n要获取 `CompilationTask`，请像上一节一样从一个 `compiler` 对象开始。然后调用：\n\n```\nJavaCompiler.CompilationTask\
  \ task = compiler.getTask(\n   errorWriter, // 如果为 null 则使用 System.err\n   fileManager,\
  \ // 如果为 null 则使用标准文件管理器\n   diagnosticListener, // 如果为 null 则使用 System.err\n  \
  \ options, // 如果没有选项则为 null\n   classes, // 用于注解处理；如果没有则为 null\n   sources);\n```\n\
  \n最后三个参数是 `Iterable` 实例。例如，一组选项可以被指定为：\n\n```\nIterable<String> options = List.of(\"\
  -d\", \"bin\");\n```\n\n`sources` 参数是 `JavaFileObject` 实例的 `Iterable`。如果你想编译磁盘上的文件，请获取一个\
  \ `StandardJavaFileManager` 并调用它的 `getJavaFileObjects` 方法：\n\n```\nStandardJavaFileManager\
  \ stdFileManager = compiler.getStandardFileManager(null, null, null);\nIterable<JavaFileObject>\
  \ sources \n   = stdFileManager.getJavaFileObjectsFromStrings(List.of(\"File1.java\"\
  , \"File2.java\"));\nJavaCompiler.CompilationTask task = compiler.getTask(\n   null,\
  \ null, null, options, null, sources);\n```\n\n`classes` 参数仅用于注解处理。在这种情况下，你还需要带上\
  \ `Processor` 对象的列表调用 `task.processors(annotationProcessors)`。请参阅 第一卷第 11 章 以获取注解处理的示例。\n\
  \n`getTask` 方法返回任务对象，但尚未启动编译过程。`CompilationTask` 类扩展了 `Callable<Boolean>`。你可以将其提交给\
  \ `ExecutorService` 进行并发执行，或者你可以直接进行同步调用：\n\n```\nBoolean result = task.call();\n\
  ```\n\n### 捕获诊断信息\n\n要监听错误消息，请安装一个 `DiagnosticListener`。每当编译器报告警告或错误消息时，监听器就会接收到一个\
  \ `Diagnostic` 对象。`DiagnosticCollector` 类实现了此接口。它简单地收集所有的诊断信息，以便你在编译完成后遍历它们。\n\n\
  ```\nvar collector = new DiagnosticCollector<JavaFileObject>();\ncompiler.getTask(null,\
  \ fileManager, collector, null, null, sources).call();\nfor (Diagnostic<? extends\
  \ JavaFileObject> d : collector.getDiagnostics()) \n{\n   System.out.println(d);\n\
  }\n```\n\n`Diagnostic` 对象包含有关问题位置的信息（包括文件名、行号和列号）以及人类可读的描述。\n\n你也可以在标准文件管理器上安装一个\
  \ `DiagnosticListener`，以防你想捕获关于文件缺失的消息：\n\n```\nStandardJavaFileManager stdFileManager\n\
  \   = compiler.getStandardFileManager(diagnosticsListener, null, null);\n```\n\n\
  ### 从内存读取源文件\n\n如果你动态生成源码，可以使其从内存中进行编译，而无需将文件保存到磁盘。使用此类来持有代码：\n\n```java\npublic\
  \ class StringSource extends SimpleJavaFileObject\n{\n   private String code;\n\n\
  \   StringSource(String name, String code)\n   {\n      super(URI.create(\"string:///\"\
  \ + name.replace(\".\", \"/\") + \".java\"), Kind.SOURCE);\n      this.code = code;\n\
  \    }\n\n   public CharSequence getCharContent(boolean ignoreEncodingErrors)\n\
  \   {\n      return code;\n   }\n}\n```\n\n然后为你的类生成代码，并给编译器提供 `StringSource` 对象的列表：\n\
  \n```\nList<StringSource> sources = List.of(\n   new StringSource(className1, class1CodeString),\n\
  \   new StringSource(className2, class2CodeString),\n   . . .);\ntask = compiler.getTask(null,\
  \ fileManager, diagnosticsListener, null, null, sources);\n```\n\n### 将字节码写入内存\n\
  \n如果你动态编译类，则不需要将类文件保存到磁盘。你可以将它们保存到内存并立即加载它们。\n\n首先，这是一个用于持有字节的类：\n\n```java\npublic\
  \ class ByteArrayClass extends SimpleJavaFileObject\n{\n   private ByteArrayOutputStream\
  \ out;\n\n   ByteArrayClass(String name) \n   {\n      super(URI.create(\"bytes:///\"\
  \ + name.replace(\".\", \"/\") + \".class\"), Kind.CLASS);\n   }\n\n   public byte[]\
  \ getCode() \n   {\n      return out.toByteArray();\n   }\n\n   public OutputStream\
  \ openOutputStream() throws IOException \n   {\n      out = new ByteArrayOutputStream();\n\
  \      return out;\n   }        \n}\n```\n\n接下来，你需要配置文件管理器以使用这些类作为输出：\n\n```\nvar\
  \ classes = new ArrayList<ByteArrayClass>();\nStandardJavaFileManager stdFileManager\n\
  \   = compiler.getStandardFileManager(null, null, null);\nJavaFileManager fileManager\n\
  \   = new ForwardingJavaFileManager<>(stdFileManager)\n      {\n         public\
  \ FileObject getJavaFileOutput(Location location, String className, Kind kind, FileObject\
  \ sibling)\n               throws IOException\n         {\n            if (kind\
  \ == Kind.CLASS)\n            {\n               ByteArrayClass outfile = new ByteArrayClass(className);\n\
  \               classes.add(outfile);\n               return outfile;\n        \
  \    }\n            else return super.getJavaFileOutput(location, className, kind,\
  \ sibling);\n         }\n      };\n```\n\n要加载类，你需要一个加载器（参见 第 9 章）：\n\n```java\n\
  public class ByteArrayClassLoader extends ClassLoader\n{\n   private Iterable<ByteArrayClass>\
  \ classes;\n\n   public ByteArrayClassLoader(Iterable<ByteArrayClass> classes)\n\
  \   {\n      this.classes = classes;\n   }\n\n   public Class<?> findClass(String\
  \ name) throws ClassNotFoundException\n   {\n      for (ByteArrayClass cl : classes)\n\
  \      {\n         if (cl.getName().equals(\"/\" + name.replace(\".\", \"/\") +\
  \ \".class\"))\n         {\n            byte[] bytes = cl.getCode();\n         \
  \   return defineClass(name, bytes, 0, bytes.length);\n         }\n      }\n   \
  \   throw new ClassNotFoundException(name);\n   }\n}\n```\n\n编译完成后，使用该加载器调用 `Class.forName`\
  \ 方法：\n\n```\nByteArrayClassLoader loader = new ByteArrayClassLoader(classes);\n\
  Class<?> cl = Class.forName(className, true, loader);\n```\n\n### 示例：动态 Java 代码生成\n\
  \n在动态 Web 页面的 Jakarta Server Pages (JSP) 技术中，你可以将 HTML 与 Java 代码段混合，例如：\n\n```html\n\
  <p>当前日期和时间是 <b><%= LocalDateTime.now() %></b></p>\n```\n\nJSP 引擎会将 Java 代码动态编译为\
  \ Servlet。在我们的应用程序中，我们使用一个简单的示例并为非常简单的工作表格式生成代码。作者将文本、Java 表达式（在反引号内）和 Java 语句（在三个反引号内）包含在工作表中。工作表被编译为\
  \ Java 类，该类将打印文本和表达式的值并执行 Java 语句。这是一个示例工作表：\n\n```\n你叫什么名字？\n```\n\n```java\nvar\
  \ in = new Scanner(System.in);\nString name = in.nextLine();\n```\n\n```\n你多大了？\n\
  ```\n\n```java\nint age = in.nextInt();\n```\n\n```\n你好，`name`！明年你将是 `age + 1`。\n\
  ```\n\n\n\n这是一个编程笔记本的极简文本版本（[https://docs.jupyter.org/en/latest/#what-is-a-notebook]）。该工作表被翻译为一个类，其\
  \ `main` 方法包含 `print` 语句，用于输出文本和表达式的值。这些语句是原样包含的。可以想象对该程序进行增强，使其能够像真实的编程笔记本一样显示图像和表格。\n\
  \nListing 8.1 程序中的 `buildSource` 方法构建了这些代码并将其放入 `StringSource` 对象中。该对象被传递给 Java\
  \ 编译器。\n\n如前一节所述，我们使用了一个 `ForwardingJavaFileManager`，它会为每个编译后的类构建一个 `ByteArrayClass`\
  \ 对象。这些对象捕获了类编译时生成的类文件。编译完成后，我们使用前一节中的类加载器加载该类并执行其 `main` 方法。\n\n此示例演示了如何使用内存中的源文件和类文件进行动态编译。\n\
  \n`compiler/CompilerTest.java`\n\n```\npackage compiler;\n\nimport java.io.*;\n\
  import java.nio.file.*;\nimport java.util.*;\nimport java.util.List;\n\nimport javax.tools.*;\n\
  import javax.tools.JavaFileObject.*;\n\n/**\n * @version 1.2 2023-08-16\n * @author\
  \ Cay Horstmann\n */\npublic class CompilerTest\n{\n   public static void main(final\
  \ String[] args) \n         throws IOException, ReflectiveOperationException\n \
  \  {\n      JavaCompiler compiler = ToolProvider.getSystemJavaCompiler();\n\n  \
  \    var classFileObjects = new ArrayList<ByteArrayClass>();\n\n      var diagnosticsListener\
  \ = new DiagnosticCollector<JavaFileObject>();\n\n      JavaFileManager fileManager\
  \ = compiler.getStandardFileManager(diagnosticsListener, null, null);\n      fileManager\
  \ = new ForwardingJavaFileManager<>(fileManager)\n         {\n            public\
  \ JavaFileObject getJavaFileForOutput(Location location, \n                  String\
  \ className, Kind kind, FileObject sibling) throws IOException\n            {\n\
  \               if (kind == Kind.CLASS) \n               {\n                  var\
  \ fileObject = new ByteArrayClass(className);\n                  classFileObjects.add(fileObject);\n\
  \                  return fileObject;\n               }\n               else return\
  \ super.getJavaFileForOutput(location, className, kind, sibling);\n            }\n\
  \         };\n\n      String mainClassName = \"compiler.Main\";\n      String worksheetName\
  \ = args.length > 0 ? args[0] : \"compiler/worksheet\";\n\n      StandardJavaFileManager\
  \ stdFileManager = compiler.getStandardFileManager(null, null, null);\n      var\
  \ sources = new ArrayList<JavaFileObject>();\n      for (JavaFileObject file : stdFileManager.getJavaFileObjectsFromStrings(\n\
  \            List.of(mainClassName.replace(\".\",  \"/\") + \".java\")))\n     \
  \    sources.add(file);\n\n      JavaFileObject source = buildSource(mainClassName,\
  \ Path.of(worksheetName));\n      JavaCompiler.CompilationTask task = compiler.getTask(null,\
  \ fileManager, diagnosticsListener, \n         null, null, List.of(source));\n \
  \     Boolean result = task.call();\n\n      for (Diagnostic<? extends JavaFileObject>\
  \ d : diagnosticsListener.getDiagnostics())\n         System.out.println(d.getKind()\
  \ + \": \" + d.getMessage(null));\n      fileManager.close();\n      if (!result)\n\
  \      {\n         System.out.println(\"Compilation failed.\");\n         System.exit(1);\n\
  \      }\n\n      var loader = new ByteArrayClassLoader(classFileObjects);\n   \
  \   Class<?> mainClass = loader.loadClass(mainClassName);\n      mainClass.getMethod(\"\
  main\", String[].class).invoke(null, new Object[] { args });\n   }\n\n   /**\n \
  \   * 构建实现工作表操作的类的源码。\n    * @param className 要构建的类名\n    * @param worksheet 包含工作表指令的文件\n\
  \    * @return 包含在字符串构建器中的源码的文件对象\n    */\n   static JavaFileObject buildSource(String\
  \ className, Path worksheet) \n         throws IOException\n   {\n      var builder\
  \ = new StringBuilder();\n      int n = className.lastIndexOf(\".\");\n      if\
  \ (n >= 0)\n      {\n         String packageName = className.substring(0, n); \n\
  \         className = className.substring(n + 1);\n         builder.append(\"package\
  \ \").append(packageName).append(\";\\n\\n\");\n      }\n      builder.append(\"\
  import java.util.Scanner;\");      \n      builder.append(\"public class \").append(className).append(\"\
  \ {\\n\");\n      builder.append(\"public static void main(String[] args) {\\n\"\
  );\n      boolean verbatim = false;\n      for (String line : Files.readAllLines(worksheet))\n\
  \      {\n         if (line.equals(\"```\")) verbatim = !verbatim;\n\n         else\
  \ if (verbatim) builder.append(line).append(\"\\n\");\n\n         else\n\n     \
  \    {\n            String[] fragments = line.split(\"`\");\n\n            for (int\
  \ i = 0; i < fragments.length; i++)\n            {\n               builder.append(\"\
  System.out.print(\");\n\n               if (i % 2 == 0) \n                  builder.append(\"\
  \\\"\")\n                     .append(fragments[i].replace(\"\\\\\", \"\\\\\\\\\"\
  ).replace(\"\\\"\", \"\\\\\\\"\"))\n                     .append(\"\\\"\");\n\n\
  \               else\n                  builder.append(fragments[i]);\n\n      \
  \         builder.append(\");\\n\");\n\n            }\n\n            builder.append(\"\
  System.out.println()\\n;\");\n\n         }\n\n      }\n\n      builder.append(\"\
  } }\\n\");\n\n      return new StringSource(className, builder.toString());\n\n\
  \   }\n\n}\n```\n\n\n\n\n### javax.tools.Tool 6\n\n*   `int run(InputStream in,\
  \ OutputStream out, OutputStream err, String... arguments)`\n    使用给定的输入、输出、错误流以及给定参数运行工具。成功返回\
  \ `0`，失败则返回非零值。\n\n### javax.tools.JavaCompiler 6\n\n*   `StandardJavaFileManager\
  \ getStandardFileManager(DiagnosticListener<? super JavaFileObject> diagnosticListener,\
  \ Locale locale, Charset charset)`\n    获取此编译器的标准文件管理器。你可以为默认错误报告、语言区域和字符集提供 `null`。\n\
  *   `JavaCompiler.CompilationTask getTask(Writer out, JavaFileManager fileManager,\
  \ DiagnosticListener<? super JavaFileObject> diagnosticListener, Iterable<String>\
  \ options, Iterable<String> classesForAnnotationProcessing, Iterable<? extends JavaFileObject>\
  \ sourceFiles)`\n    获取一个编译任务，调用该任务时将编译给定的源文件。详情见前一节的讨论。\n\n### javax.tools.StandardJavaFileManager\
  \ 6\n\n*   `Iterable<? extends JavaFileObject> getJavaFileObjectsFromStrings(Iterable<String>\
  \ fileNames)`\n*   `Iterable<? extends JavaFileObject> getJavaFileObjectsFromPaths(Collection<?\
  \ extends Path> paths)` 13\n*   `Iterable<? extends JavaFileObject> getJavaFileObjectsFromFiles(Iterable<?\
  \ extends File> files)`\n    将文件名序列或文件序列转换为 `JavaFileObject` 实例序列。\n\n### javax.tools.JavaCompiler.CompilationTask\
  \ 6\n\n*   `Boolean call()`\n    执行编译任务。\n\n### javax.tools.DiagnosticCollector<S>\
  \ 6\n\n*   `DiagnosticCollector()`\n    构造一个空的收集器。\n*   `List<Diagnostic<? extends\
  \ S>> getDiagnostics()`\n    获取收集到的诊断信息。\n\n### javax.tools.Diagnostic<S> 6\n\n\
  *   `S getSource()`\n    获取与此诊断信息相关的源对象。\n*   `Diagnostic.Kind getKind()`\n    获取此诊断信息的类型——`ERROR`、`WARNING`、`MANDATORY_WARNING`、`NOTE`\
  \ 或 `OTHER` 之一。\n*   `String getMessage(Locale locale)`\n    获取描述此诊断信息中抛出问题的消息。默认语言区域传递\
  \ `null`。\n*   `long getLineNumber()`\n*   `long getColumnNumber()`\n    获取此诊断信息中抛出问题的位置。\n\
  \n### javax.tools.SimpleJavaFileObject 6\n\n*   `CharSequence getCharContent(boolean\
  \ ignoreEncodingErrors)`\n    对于代表源文件并产生源代码的文件对象，重写此方法。\n*   `OutputStream openOutputStream()`\n\
  \    对于代表类文件并产生一个可以写入字节码的输出流的文件对象，重写此方法。\n\n### javax.tools.ForwardingJavaFileManager<M\
  \ extends JavaFileManager> 6\n\n*   `protected ForwardingJavaFileManager(M fileManager)`\n\
  \    构造一个 `JavaFileManager`，将所有调用委托给给定的文件管理器。\n*   `FileObject getJavaFileForOutput(JavaFileManager.Location\
  \ location, String className, JavaFileObject.Kind kind, FileObject sibling)`\n \
  \   如果你想替换一个文件对象来写入类文件，请拦截此调用；`kind` 是 `SOURCE`、`CLASS`、`HTML` 或 `OTHER` 之一。\n\n\
  ## Java 平台脚本编程\n\n脚本语言是一种通过在运行时解释程序文本来避免通常的编辑/编译/链接/运行循环的语言。脚本语言具有许多优点：\n\n*   快速周转，鼓励实验\n\
  *   更改运行中程序的行为\n*   允许用户进行自定义\n\n另一方面，大多数脚本语言缺乏有利于编写复杂应用程序的特性，例如强类型、封装和模块化。\n\n\
  因此，将脚本语言和传统语言的优点结合是非常吸引人的。脚本 API 允许你在 Java 平台上这样做。它允许从 Java 程序调用用 JavaScript、Groovy、Ruby\
  \ 甚至是 Scheme 和 Haskell 等冷门语言编写的脚本。例如，Renjin 项目 ([`www.renjin.org`](https://www.renjin.org))\
  \ 提供了 R 编程语言的 Java 实现（R 通常用于统计编程），以及一个脚本 API 的“引擎”。\n\n在寻找你喜欢的语言的兼容实现时，请搜索 JSR 223\
  \ 支持。（Java 规范请求 223 在集成到 Java 之前开发了脚本 API。）\n\nJMeter 性能分析工具 ([`jmeter.apache.org/`](https://jmeter.apache.org/))\
  \ 是一个允许用户使用任何支持 Java 脚本的语言编写脚本的程序示例。Maven 构建工具有一个插件 ([`maven.apache.org/plugins/maven-scripting-plugin/index.html`](https://maven.apache.org/plugins/maven-scripting-plugin/index.html))\
  \ 用于使用任何具有 Java 脚本引擎的语言编写构建步骤。\n\n在接下来的章节中，我将向你展示如何为特定语言选择引擎、如何执行脚本以及如何利用某些脚本引擎提供的高级特性。\n\
  \n### 获取脚本引擎\n\n脚本引擎是一个可以执行特定语言脚本的库。当虚拟机启动时，它会发现可用脚本引擎。要列出它们，请构造一个 `ScriptEngineManager`\
  \ 并调用 `getEngineFactories` 方法。你可以询问每个引擎工厂支持的引擎名称、MIME 类型和文件扩展名。表 8.1 显示了典型值。\n\n\
  本章中的示例使用了 Rhino 脚本引擎，可以在 [`github.com/mozilla/rhino`](https://github.com/mozilla/rhino)\
  \ 获取，它实现了一个旧版本的 JavaScript。\n\n脚本引擎工厂的属性\n\n| 引擎 | 名称 | MIME 类型 | 扩展名 |\n| --- |\
  \ --- | --- | --- |\n| Rhino (JavaScript) | rhino, Rhino, JavaScript, javascript\
  \ | `application/javascript`, `application/ecmascript`, `text/javascript`, `text/ecmascript`\
  \ | `js` |\n| Groovy | groovy | 无 | `groovy` |\n| Renjin | Renjin | `text/x-R` |\
  \ `R`, `r`, `S`, `s` |\n\n通常，你已经知道需要哪个引擎，并且可以通过名称、MIME 类型或扩展名直接请求它。例如：\n\n```\n\
  var manager = new ScriptEngineManager();\n\nScriptEngine engine = manager.getEngineByName(\"\
  rhino\");\n```\n\n你需要在类路径上提供实现脚本引擎的 JAR 文件。\n\nOracle JDK 曾经包含一个名为 Nashorn 的 JavaScript\
  \ 引擎，但它在 Java 15 中已被移除。它可以作为独立项目在 [`github.com/openjdk/nashorn`](https://github.com/openjdk/nashorn)\
  \ 获取。\n\n### javax.script.ScriptEngineManager 6\n\n*   `List<ScriptEngineFactory>\
  \ getEngineFactories()`\n    获取所有发现的引擎工厂列表。\n*   `ScriptEngine getEngineByName(String\
  \ name)`\n*   `ScriptEngine getEngineByExtension(String extension)`\n*   `ScriptEngine\
  \ getEngineByMimeType(String mimeType)`\n    根据指定的名称、脚本扩展名或 MIME 类型获取脚本引擎。\n\n###\
  \ javax.script.ScriptEngineFactory 6\n\n*   `List<String> getNames()`\n*   `List<String>\
  \ getExtensions()`\n*   `List<String> getMimeTypes()`\n    获取此工厂的名称、脚本扩展名和 MIME\
  \ 类型。\n\n### 脚本评估与绑定\n\n一旦有了引擎，你只需调用即可执行脚本：\n\n```\nObject result = engine.eval(scriptString);\n\
  ```\n\n如果脚本存储在文件中，打开一个 `Reader` 并调用\n\n```\nObject result = engine.eval(reader);\n\
  ```\n\n你可以在同一个引擎上调用多个脚本。如果一个脚本定义了变量、函数或类，大多数脚本引擎会保留这些定义供以后使用。例如，\n\n```\nengine.eval(\"\
  n = 1728\");\n\nObject result = engine.eval(\"n + 1\");\n```\n将返回 `1729`。\n\n要确定是否可以在多线程中并发执行脚本，请调用\n\
  \n```\nObject param = factory.getParameter(\"THREADING\");\n```\n\n\n\n\n\n返回值是以下之一：\n\
  \n- `null`：并发执行是不安全的。\n- `\"MULTITHREADED\"`：并发执行是安全的。一个线程的影响可能对另一个线程可见。\n- `\"\
  THREAD-ISOLATED\"`：除了 `\"MULTITHREADED\"` 之外，还为每个线程维护了不同的变量绑定。\n- `\"STATELESS\"\
  `：在 `\"THREAD-ISOLATED\"` 之外，脚本不会更改变量绑定。\n\n你通常希望向引擎添加变量绑定。一个绑定由一个名称和一个关联的 Java\
  \ 对象组成。例如，以下语句：\n\n```\nengine.put(\"k\", 1728);\nObject result = engine.eval(\"\
  k + 1\");\n```\n\n脚本代码从“引擎作用域（engine scope）”的绑定中读取 `k` 的定义。这尤为重要，因为大多数脚本语言都可以访问\
  \ Java 对象，且语法通常比 Java 语法简单。例如：\n\n```\nengine.put(\"d\", LocalDate.now());\nObject\
  \ result = engine.eval(\"d.month\"); // 调用 getMonth\n```\n\n相反，你可以检索由脚本语句绑定的变量：\n\
  \n```\nengine.eval(\"n = 1728\");\nObject result = engine.get(\"n\");\n```\n\n除了引擎作用域，还有一个全局作用域。你添加到\
  \ `ScriptEngineManager` 中的任何绑定对所有引擎都是可见的。\n\n与其将绑定添加到引擎或全局作用域，不如将它们收集在一个类型为 `Bindings`\
  \ 的对象中，并将其传递给 `eval` 方法：\n\n```\nBindings scope = engine.createBindings();\nscope.put(\"\
  d\", LocalDate.now());\nengine.eval(scriptString, scope);\n```\n\n如果一组绑定不应该持续到未来的\
  \ `eval` 方法调用，则这种方法非常有用。\n\n你可能希望拥有引擎和全局作用域之外的作用域。例如，Web 容器可能需要请求作用域和会话作用域。然而，你需要自己实现。你需要编写一个实现\
  \ `ScriptContext` 接口的类来管理作用域集合。每个作用域由一个整数标识，数字较小的作用域应优先搜索。（标准库提供了一个 `SimpleScriptContext`\
  \ 类，但它只持有全局和引擎作用域。）\n\n### javax.script.ScriptEngine\n\n- `Object eval(String script)`\n\
  - `Object eval(Reader reader)`\n- `Object eval(String script, Bindings bindings)`\n\
  - `Object eval(Reader reader, Bindings bindings)`\n  根据字符串或 reader 执行给脚本，受给定的绑定约束。\n\
  - `Object get(String key)`\n- `void put(String key, Object value)`\n  在引擎作用域中获取或放置绑定。\n\
  - `Bindings createBindings()`\n  创建一个适用于此引擎的空 `Bindings` 对象。\n\n### javax.script.ScriptEngineManager\n\
  \n- `Object get(String key)`\n- `void put(String key, Object value)`\n  在全局作用域中获取或放置绑定。\n\
  \n### javax.script.Bindings\n\n- `Object get(String key)`\n- `void put(String key,\
  \ Object value)`\n  向此 `Bindings` 对象所表示的作用域中获取或放置绑定。\n\n### 重定向输入和输出\n\n你可以通过调用脚本上下文的\
  \ `setReader` 和 `setWriter` 方法来重定向脚本的标准输入和输出。例如：\n\n```\nvar writer = new StringWriter();\n\
  engine.getContext().setWriter(new PrintWriter(writer, true));\n```\n\n任何使用 JavaScript\
  \ 的 `print` 或 `println` 函数写入的输出都会被发送到 `writer`。\n\n`setReader` 和 `setWriter` 方法只影响脚本引擎的标准输入和输出源。例如，如果你执行以下\
  \ JavaScript 代码：\n\n```\nprintln(\"Hello\");\njava.lang.System.out.println(\"World\"\
  );\n```\n\n只有第一个输出会被重定向。\n\nRhino 引擎没有标准输入源的概念。调用 `setReader` 没有效果。\n\n### javax.script.ScriptEngine\n\
  \n- `ScriptContext getContext()`\n  获取此引擎的默认脚本上下文。\n\n### javax.script.ScriptContext\n\
  \n- `Reader getReader()`\n- `void setReader(Reader reader)`\n- `Writer getWriter()`\n\
  - `void setWriter(Writer writer)`\n- `Writer getErrorWriter()`\n- `void setErrorWriter(Writer\
  \ writer)`\n  获取或设置用于输入的 reader 用于普通或错误输出的 writer。\n\n### 调用脚本函数和方法\n\n对于某些脚本引擎，你可以直接在\
  \ Java 代码中调用脚本语言函数，而无需评估执行该调用的脚本片段。如果你允许用户使用他们选择的脚本语言实现服务，以便你从 Java 中调用它，这将非常有用。\n\
  \n提供此功能的脚本引擎实现了 `Invocable` 接口。特别是，Rhino 引擎实现了 `Invocable`。\n\n要调用函数，调用 `invokeFunction`\
  \ 方法并传入函数名，然后是函数参数：\n\n```\n// 在 JavaScript 中定义 greet 函数\nengine.eval(\"function\
  \ greet(how, whom) { return how + ', ' + whom + '!' }\");\n// 使用参数 \"Hello\", \"\
  World\" 调用函数\nresult = ((Invocable) engine).invokeFunction(\"greet\", \"Hello\"\
  , \"World\");\n```\n\n如果脚本语言是面向对象的，调用 `invokeMethod`：\n\n```java\n// 在 JavaScript\
  \ 中定义 Greeter 类\nengine.eval(\"\"\"\nfunction Greeter(how) { this.how = how }\n\
  Greeter.prototype.welcome = \n   function (whom) { return this.how + ', ' + whom\
  \ + '!' }\n\"\"\");\n// 实例化\nObject yo = engine.eval(\"new Greeter('Yo')\");\n//\
  \ 在实例上调用 welcome 方法\nresult = ((Invocable) engine).invokeMethod(yo, \"World\");\n\
  ```\n\nRhino 不支持现代的 JavaScript 类语法。有关如何用旧方式在 JavaScript 中定义类的更多信息，请参见 Douglas Crockford\
  \ 写的 *JavaScript—The Good Parts* (O’Reilly, 2008)。\n\n如果脚本引擎没有实现 `Invocable` 接口，你可能仍然能够以独立语言的方式调用方法。`ScriptEngineFactory`\
  \ 接口的 `getMethodCallSyntax` 方法产生一个可以传递给 `eval` 方法的字符串。然而，对于此，所有方法参数必须绑定名称，而 `invokeMethod`\
  \ 可以用任意值调用。\n\n你可以更进一步，要求脚本引擎实现一个 Java 接口。然后你就可以用 Java 方法调用语法调用脚本函数和方法。\n\n细节取决于脚本引擎，但通常你需要为接口的每个方法提供一个函数。例如，考虑一个\
  \ Java 接口：\n\n```java\npublic interface Greeter\n{\n   String welcome(String whom);\n\
  }\n```\n\n如果你在 Rhino 中定义了一个同名的全局函数，你就可以通过此接口调用它：\n\n```java\n// 在 JavaScript 中定义\
  \ welcome 函数\nengine.eval(\"function welcome(whom) { return 'Hello, ' + whom + '!'\
  \ }\");\n// 获取 Java 对象并调用 Java 方法\nGreeter g = ((Invocable) engine).getInterface(Greeter.class);\n\
  result = g.welcome(\"World\");\n```\n\n在面向对象的脚本语言中，你可以通过匹配的 Java 接口访问脚本类。例如，这里是使用\
  \ Java 语法调用 JavaScript `Greeter` 类对象：\n\n```java\nGreeter g = ((Invocable) engine).getInterface(yo,\
  \ Greeter.class);\nresult = g.welcome(\"World\");\n```\n\n\n\n总而言之，如果你想从 Java 调用脚本代码而不必担心脚本语言的语法，那么\
  \ `Invocable` 接口非常有用。\n\n`javax.script.Invocable` 6\n\n*   `Object invokeFunction(String\
  \ name, Object... args)`\n*   `Object invokeMethod(Object thiz, String name, Object...\
  \ args)`\n    使用给定的名称和参数调用指定的函数或方法。\n*   `<T> T getInterface(Class<T> clasz)`\n\
  \    返回给定接口的实现类，通过脚本引擎中的函数实现这些方法。\n*   `<T> T getInterface(Object thiz, Class<T>\
  \ clasz)`\n    返回给定接口的实现类，通过给定对象的方法实现这些方法。\n\n### 编译脚本\n\n某些脚本引擎可以将脚本代码编译为中间形式以便进行高效执行。这些引擎实现了\
  \ `Compilable` 接口。下面的示例了如何编译并评估包含在脚本文件中代码：\n\n```\nif (engine instanceof Compilable\
  \ compilableEngine) {\n   Reader reader = Files.newBufferedReader(path);\n   CompiledScript\
  \ script = compilableEngine.compile(reader);\n   script.eval();\n}\n```\n\n当然，只有当你需要重复执行脚本时，编译脚本才有意义。\n\
  \n`javax.script.Compilable` 6\n\n*   `CompiledScript compile(String script)`\n*\
  \   `CompiledScript compile(Reader reader)`\n    编译由字符串或 reader 提供的脚本。\n\n`javax.script.CompiledScript`\
  \ 6\n\n*   `Object eval()`\n*   `Object eval(Bindings bindings)`\n    评估此脚本。\n\n\
  ### 示例：脚本工作表\n\n查看 Listing 8.2 中的程序，它以与 Section 8.1.6 中示例相同的格式执行工作表。但这一次，代码是用脚本语言编写的，并在程序运行时进行评估。\n\
  \n类路径必须包含一个脚本引擎。如下所示启动程序：\n\n```\njava -classpath .:engineDir/\\* ScriptTest engineName\
  \ sheetFile\n```\n\n例如，\n\n```\njava -classpath .:rhino/\\* script.ScriptTest rhino\
  \ script/sheet\n```\n\n`script/ScriptTest.java`\n\n```\npackage script;\n\nimport\
  \ java.io.*;\nimport java.nio.file.*;\nimport javax.script.*;\n\n/**\n * @version\
  \ 1.1 2023-08-17\n * @author Cay Horstmann\n * \n下载 Rhino 和 Rhino 引擎 JAR 包从 \n\n\
  https://mvnrepository.com/artifact/org.mozilla/rhino\nhttps://mvnrepository.com/artifact/org.mozilla/rhino-engine\n\
  \n将其放入 rhino 目录\n\njavac script/ScriptTest.java\n\njava --classpath .:rhino/\\*\
  \ script.ScriptTest rhino script/sheet\n */\n\npublic class ScriptTest\n{\n   public\
  \ static void main(String[] args) throws ScriptException, IOException\n   {\n  \
  \    var manager = new ScriptEngineManager();\n      String language;\n      if\
  \ (args.length == 0) \n      {\n         System.out.println(\"Available factories:\
  \ \");\n         for (ScriptEngineFactory factory : manager.getEngineFactories())\n\
  \            System.out.println(factory.getEngineName());\n         return;\n  \
  \    }\n      else language = args[0];\n      ScriptEngine engine = manager.getEngineByName(language);\
  \               \n      if (engine == null)\n      {\n         System.err.println(\"\
  No engine for \" + language);\n         System.exit(1);\n      }\n      String sheetName\
  \ = args[1];\n      boolean verbatim = false;\n      var verbatimCode = new StringBuilder();\
  \ \n      for (String line : Files.readAllLines(Path.of(sheetName)))\n      {\n\
  \         if (line.equals(\"```\")) {\n            verbatim = !verbatim;\n     \
  \       if (!verbatim)\n            {\n               engine.eval(verbatimCode.toString());\n\
  \               verbatimCode.delete(0, verbatimCode.length());\n            }\n\
  \         }\n         else if (verbatim) verbatimCode.append(line).append(\"\\n\"\
  );\n         else\n         {\n            String[] fragments = line.split(\"`\"\
  );\n            for (int i = 0; i < fragments.length; i++)\n            {\n    \
  \           System.out.print(i % 2 == 0 ? fragments[i] : engine.eval(fragments[i]));\n\
  \            }\n            System.out.println();\n         }\n      }      \n \
  \  }\n}\n```\n\n## 安全\n\n当 Java 技术首次出现时，人们兴奋的并不是因为一种精良的编程语言，而是因为能够安全地通过 Internet\
  \ 传输 applet（小程序）。显然，只有当接收者能够确定代码不会对其机器造成破坏时，提供可执行的 applet 才有实际意义。因此，安全一直是 Java 技术设计者和用户关注的重点。这意味着与其他语言和系统不同（其他安全通常是事后考虑或作为对入侵的反应而实现的），安全机制是\
  \ Java 技术不可或缺的一部分。\n\n安全架构由三部分组成：\n\n1.  语言和虚拟机设计特性（数组边界检查、不进行未检查的类型转换、无指针算术等）。\n\
  2.  `security manager`（安全管理器），用于控制代码可以的操作（文件访问、网络访问等）。\n3.  代码签名，代码作者可以使用标准加密算法对\
  \ Java 代码进行身份验证。然后，代码用户可以确定究竟是谁创建了代码。\n\n第一部分非常成功。C++ 程序经常受到缓冲区溢出等攻击，但 Java 提供了强大的保护。遗憾的是，另外两个部分表现并不理想。安全管理器非常复杂且攻击面很大。随着\
  \ applet 和 Java Web Start 这两个客户端应用安全交付机制的消亡，安全管理器已被废弃。\n\n在本书的早期版本中，安全管理器和代码签名是本章的重点，但显然不再需要这些内容。我们将首先讨论在加载时检查类文件完整性的类加载器。我将演示该机制如何检测篡改。然后，你将学习用于许多安全操作的身份验证框架和加密算法。\n\
  \n 类加载\n\nJava 编译器将源码转换为虚拟机代码。虚拟机代码存储在以 `.class` 结尾的类文件中。每个类文件包含一个类或接口的定义和实现代码。在下节中，你将看到虚拟机如何加载这些类文件。\n\
  \n 类加载过程\n\n虚拟机只加载执行所需的类文件。例如，假设程序执行从 `MyProgram` 开始。虚拟机执行以下步骤：\n\n1.  虚拟机有一种加载类文件的机制——例如，从磁盘读取文件或从\
  \ Web 请求；它使用该机制加载 `MyProgram` 类文件。\n2.  如果 `MyProgram` 类具有其他类型的字段或超类，也会加载它们的类文件。（加载给定类所依赖的所有类的过程被称为*解析*该类。）\n\
  3.  虚拟机随后开始执行 `main` 方法。\n4.  如果 `main` 方法或 `main` 调用的方法需要额外的类，则会加载这些类。\n\n\n\n\n\
  ```java\njava.base                   \njava.datatransfer           \njava.desktop\
  \                \njava.instrument             \njava.logging                \n\
  java.management             \njava.management.rmi         \njava.naming        \
  \         \njava.prefs                  \njava.rmi                    \njava.security.sasl\n\
  java.xml\n```\n\n以及许多 JDK 内部模块。\n\n没有与启动类加载器（bootstrap class loader）对应的 `ClassLoader`\
  \ 对象。例如：\n\n```\nStringBuilder.class.getClassLoader()\n```\n\n返回 `null`。\n\n在 Java\
  \ 9 之前，Java 平台类位于一个 `rt.jar` 文件中。如今，Java 平台是模块化的，每个平台模块都包含在一个 JMOD 文件中（参见第 卷第 9\
  \ 章）。平台类加载器加载所有未由启动类加载器加载的 Java 平台类。\n\n系统类加载器负责从模块路径（module path）和类路径（class path）加载应用程序类。\n\
  \n在 Java 9 之前，“扩展类加载器”从 `jre/lib/ext` 目录加载“标准扩展”，而“认可标准覆盖”机制提供了一种用新版本覆盖某些平台类（包括\
  \ CORBA 和 XML 实现）的方法。这两种机制已被移除。\n\n### 类加载器的层级结构\n\n类加载器具有父子关系。除了启动类加载器外，每个类加载器都有一个父类加载器。类加载器会给父类加载器机会去加载指定的类，只有在父类加载失败时才会加载该类。例如，当要求系统类加载器加载平台类（例如\
  \ `java.lang.StringBuilder`）时，它首先询问平台类加载器。该加载器首先询问启动类加载器。启动类加载器找到并加载了该类，因此其他其他类加载器都不再继续搜索。\n\
  \n某些程序具有插件架构，代码的某些部分被封装为可选插件。如果插件被封装为 JAR 文件，你可以简单地使用 `URLClassLoader` 实例来加载插件类。\n\
  \n```\nvar url = new URL(\"file:///path/to/plugin.jar\");\nvar pluginLoader = new\
  \ URLClassLoader(new URL[] { url });\nClass<?> cl = pluginLoader.loadClass(\"mypackage.MyClass\"\
  );\n```\n\n由于在 `URLClassLoader` 构造函数中没有指定父类，因此 `pluginLoader` 的父类是系统类加载器。图 9.1 显示了该层级结构。\n\
  \n![Figure](img/fig09-01.jpg)类加载器层级\n\n在 Java 9 之前，系统类加载器是 `URLClassLoader` 的实例。某些程序员使用强制转换来访问\
  \ `getURLs` 方法，或者通过反射调用受保护的 `addURLs` 方法将 JAR 文件添加到类路径中。这现在已不再可行。\n\n大多数时候，你不需要担心类加载器的层级结构。通常，类的加载是因为其他类需要它们，而这个过程对你来说是透明的。\n\
  \n然而，偶尔你需要干预并指定类加载器。考虑以下用例：\n\n* 你的应用程序代码包含一个辅助方法，该方法调用了 `Class.forName(classNameString)`。\n\
  * 该方法是从插件类中调用的。\n* `classNameString` 指定了一个包含在插件 JAR 中的类。\n\n插件的作者希望加载该类。然而，辅助方法的类是由系统类加载器加载的，而\
  \ `Class.forName` 使用的正是该类加载器。插件 JAR 中的类是不可见的。这种现象被称为类加载器反转（classloader inversion）。\n\
  \n为了解决这个问题，辅助方法需要使用正确的类加载器。它可以将类加载器作为参数。或者，它可以要求将正确的类加载器设置为当前线程的上下文类加载器（context\
  \ class loader）。许多框架使用了这种策略（如 JAXP 和 JNDI）。\n\n每个线程都有一个类加载器的引用，称为上下文类加载器。主线程的上下文类加载器是系统类加载器。当创建一个新线程时，它的上下文类加载器被设置为创建线程的上下文类加载器。因此，如果你什么都不做，所有线程的上下文类加载器都将设置为系统类加载器。\n\
  \n然而，你可以通过调用来设置任何类加载器：\n\n```\nThread t = Thread.currentThread();\nt.setContextClassLoader(loader);\n\
  ```\n\n辅助方法随后可以获取上下文类加载器：\n\n```\nThread t = Thread.currentThread();\nClassLoader\
  \ loader = t.getContextClassLoader();\nClass<?> cl = loader.loadClass(className);\n\
  ```\n\n如果你编写了一个按名称加载类的方法，最好让调用者能够选择是传递显式的类加载器还是使用上下文类加载器。不要直接使用方法所在类的类加载器。\n\n###\
  \ 使用类加载器作为命名空间\n\n每个 Java 程序员都知道包名用于消除命名冲突。标准库中有两个名为 `Date` 的类，但它们的真实名称分别是 `java.util.Date`\
  \ 和 `java.sql.Date`。简单名只是为了方便程序员，并且需要包含适当的 `import` 语句。在运行的程序中，所有类名都包含它们的包名。\n\n\
  然而，可能会让你惊讶的是，同一个虚拟机中可以存在具有相同类和包名的不同类。类是由其全名和类加载器定义的。这种技术对于从多个源加载代码有用。例如，应用程序服务器为每个应用程序使用单独的类加载器。图\
  \ 9.2 显示了一个示例。假设应用程序服务器加载了两个不同的程序，每个程序都有一个名为 `Util` 的类。由于每个类都由不同的类加载器加载，这些类是完全不同的，彼此不冲突。\n\
  \n![Figure](img/fig09-02.jpg)两个类加载器加载了同名的不同类。\n\n### 编写自己的类加载器\n\n你可以为特殊目的编写自己的类加载器。这允许你在将字节码传递给虚拟机之前执行自定义检查。例如，你的类加载器可能会拒绝加载未被标记为“已付费”的类。\n\
  \n要编写自己的类加载器，只需扩展 `ClassLoader` 类并重写方法：\n\n```\nfindClass(String className)\n```\n\
  \n`ClassLoader` 父类的 `loadClass` 方法负责处理向父类的委托，并且仅在类尚未被加载且父类加载器无法加载该类时，才调用 `findClass`。\n\
  \n你对该方法的实现必须执行以下操作：\n\n1. 从本地文件系统或其他源加载类的字节码（bytecodes）。\n2. 调用 `ClassLoader` 父类的\
  \ `defineClass` 方法将字节码呈现给虚拟机。\n\n在列表 9.1 的程序中，我们实现了一个加载加密类文件的类加载器。程序询问用户要加载的第一个类名（即包含\
  \ `main` 方法的类）和解密密钥。然后它使用特殊的类加载器加载指定的类并调用 `main` 方法。该类加载器会密指定的类以及它引用的所有非系统类。最后，程序调用加载的类的\
  \ `main` 方法。\n\n\n\n\n当本章首次编写时，美国政府限制强加密方法的出口。因此，我在示例中使用 `Caesar`（凯撒密码）方法，因为它在出口方面显然是合法的。\n\
  \n我们版本的 `Caesar` 密码密钥是一个 1 到 255 之间的数字。要进行解密，只需将该密钥加到每个字节并对 256 取模即可。列清单 9.2 中的\
  \ `Caesar.java` 程序执行了加密操作。\n\n为了不干扰常规类加载器，我们对加密后的类文件使用了不同的扩展名 `.caesar`。\n\n要进行解密，类加载器只需从每个字节中减去密钥。在本书的配套代码中，你会找到四个使用密钥值\
  \ 3（传统选择）加密的类文件。要运行加密后的程序，你需要使用我们在 `ClassLoaderTest` 程序中定义的自定义类加载器。\n\n尝试使用类名 `Calculator`\
  \ 和解密密钥 `3` 运行该程序。会弹出一个计算器。但如果你使用不同的密钥，类加载器将抛出异常。\n\n加密类文件有许多实际用途（当然，前提是你使用了比凯撒密码更强的方法）。没有解密密钥，这些类文件是毫无用的。它们既无法被标准虚拟机执行，也无法轻易反汇编译。\n\
  \n这意味着你可以使用自定义类加载器来验证类的用户身份，或者在允许程序运行之前确保其已支付费用。当然，加密只是自定义类加载器的应用之一。你可以使用其他类型的类加载器来解决其他问题——例如，将类文件存储在数据库中。\n\
  \n`classLoader/ClassLoaderTest.java`\n\n```java\npackage classLoader;\n\nimport\
  \ java.io.*;\nimport java.lang.reflect.*;\nimport java.nio.file.*;\nimport java.util.*;\n\
  \n/**\n * 此程序演示了一个解密类文件的自定义类加载器。\n * @version 1.3 2023-11-12\n * @author Cay Horstmann\n\
  \ */\npublic class ClassLoaderTest\n{\n   public static void main(String[] args)\
  \ throws ReflectiveOperationException\n   {\n      Scanner in = new Scanner(System.in);\n\
  \      System.out.print(\"Class name: \");\n      String className = in.nextLine();\n\
  \      System.out.print(\"Decryption key: \");\n      int decryptionKey = in.nextInt();\n\
  \      var loader = new CryptoClassLoader(decryptionKey);\n      Class<?> c = loader.loadClass(className);\n\
  \      Method m = c.getMethod(\"main\", String[].class);\n      m.invoke(null, (Object)\
  \ new String[] {});\n   }\n}\n\n/**\n * 此类加载器加载加密的类文件。\n */\nclass CryptoClassLoader\
  \ extends ClassLoader\n{\n   private int key;\n\n   /**\n    * 构造一个加密类加载器。\n   \
  \ * @param k 解密密钥\n    */\n   public CryptoClassLoader(int k)\n   {\n      key =\
  \ k;\n   }\n\n   protected Class<?> findClass(String name) throws ClassNotFoundException\n\
  \   {\n      try\n      {\n         byte[] classBytes = loadClassBytes(name);\n\
  \         Class<?> cl = defineClass(name, classBytes, 0, classBytes.length);\n \
  \        if (cl == null) throw new ClassNotFoundException(name);\n         return\
  \ cl;\n      }\n      catch (IOException e)\n      {\n         throw new ClassNotFoundException(name);\n\
  \      }\n   }\n\n   /**\n    * 加载并解密类文件字节。\n    * @param name 类名\n    * @return\
  \ 包含类文件字节的数组\n    */\n   private byte[] loadClassBytes(String name) throws IOException\n\
  \   {\n      String cname = name.replace(\".\", \"/\") + \".caesar\";\n      byte[]\
  \ bytes = Files.readAllBytes(Path.of(cname));\n      for (int i = 0; i < bytes.length;\
  \ i++)\n         bytes[i] = (byte) (bytes[i] - key);\n      return bytes;\n   }\n\
  }\n```\n\n`classLoader/Caesar.java`\n\n```java\npackage classLoader;\n\nimport java.io.*;\n\
  \n/**\n * 使用凯撒密码加密文件。\n * @version 1.03 2023-11-12\n * @author Cay Horstmann\n */\n\
  public class Caesar\n{\n   public static void main(String[] args) throws Exception\n\
  \   {\n      if (args.length != 3)\n      {\n         System.out.println(\"USAGE:\
  \ java classLoader.Caesar in out key\");\n         return;\n      }\n\n      try\
  \ (var in = new FileInputStream(args[0]);\n            var out = new FileOutputStream(args[1]))\n\
  \      {\n         int key = Integer.parseInt(args[2]);\n         boolean done =\
  \ false;\n         while (!done)\n         {\n            int ch = in.read();\n\
  \            if (ch == -1) done = true;\n            else out.write((byte) (ch +\
  \ key));\n         }\n      }\n   }\n}\n```\n\n`java.lang.Class` 1.0\n\n* `ClassLoader\
  \ getClassLoader()`\n\n    获取加载此类的类加载器。\n\n`java.lang.ClassLoader` 1.0\n\n* `ClassLoader\
  \ getParent()` 1.2\n\n    返回父类加载器，如果父类加载器是引导程序类加载器，则返回 `null`。\n\n* `static ClassLoader\
  \ getSystemClassLoader()` 1.2\n\n    获取系统类加载器——即用于加载第一个应用程序的类加载器。\n\n* `protected\
  \ Class findClass(String name)` 1.2\n\n    应由类加载器重写以查找类的字节码。在类名中，使用 `.` 作为包分隔符，且不要使用\
  \ `.class` 后缀。\n\n* `Class defineClass(String name, byte[] byteCode, int offset,\
  \ int length)`\n\n    向虚拟机添加一个新类，其字节码在给定范围内提供。\n\n`java.net.URLClassLoader` 1.2\n\
  \n* `URLClassLoader(URL[] urls)`\n\n* `URLClassLoader(URL[] urls, ClassLoader parent)`\n\
  \n    构造一个从给定 URL 加载类的类加载器。如果 URL 以 `/` 结尾，则假设是一个目录，否则假设它是一个 JAR 文件。\n\n`java.lang.Thread`\
  \ 1.0\n\n* `ClassLoader getContextClassLoader()` 1.2\n\n    获取该线程创建者指定的、在执行此线程时最合理的类加载器。\n\
  \n* `void setContextClassLoader(ClassLoader loader)` 1.2\n\n    设置此线程在加载类时使用的类加载器。如果在启动线程时没有显式设置类加载器，则使用父线程的上下文类加载器。\n\
  \n### 字节码验证\n\n当类加载器将新加载类的字节码提交给虚拟机时，这些字节码首先由*验证器*进行检查。验证器检查指令不会执行明显破坏的操作。除了平台类外，所有类都经过验证。\n\
  \n以下是验证器执行的一些检查：\n\n* 变量在使用前已初始化。\n* 方法调用与对象的类型匹配。\n* 未违反访问私有数据和方法的规则。\n* 局部变量访问在运行时栈范围内。\n\
  * 运行时栈不会溢出。\n\n如果任何一项检查失败，该类被认为已损坏且不会被加载。\n\n\n\n这种严格的验证是一项重要的安全考量。意外错误（例如未初始化的变量）如果不被捕获，可能会很容易造成灾难。更重要的是，在开放广大的互联网世界中，你必须防范那些故意制造恶意影响的程序员。例如，通过修改运行时堆栈上的值或通过向平台对象的私有实例字段中写数据，程序可以突破浏览器的安全系统。\n\
  \n然而，你可能会想，为什么需要一个特殊的验证器来检查所有这些特性呢？毕竟，编译器绝不会允许你生成一个使用了未初始化变量或从另一个类访问私有实例字段的类文件。事实上，编译器为\
  \ Java 编程语言生成的类文件总是通过验证的。但是，类文件中使用的字节码格式有详尽的文档，对于具有汇编编程经验和十六进制编辑器经验的人来说，手动生成一个包含\
  \ Java 虚拟机有效但不安全指令的类文件并非易事。验证器始终在防止被恶意篡改的类文件——而不仅仅检查编译器生成的类文件。\n\n下面是构造这样一个被修改的类文件的示例。我们从\
  \ Listing 9.3 中的程序 `VerifierTest.java` 开始。这是一个调用方法并显示方法结果的简单程序。`fun` 方法本身只是计算 `1\
  \ + 2`。\n\n```\nstatic int fun()\n{\n   int m;\n   int n;\n   m = 1;\n   n = 2;\n\
  \   int r = m + n;\n   return r;\n}\n```\n\n作为一个实验，尝试编译该程序的以下修改版本：\n\n```\nstatic\
  \ int fun()\n{\n   int m = 1;\n   int n;\n   m = 1;\n   m = 2;\n   int r = m + n;\n\
  \   return r;\n}\n```\n\n在这里，`n` 没有被初始化，因此它可以是任何随机值。当然，编译器检测到了这个问题并拒绝编译该程序。要创建一个糟糕的类文件，我们需要多下一点功夫。首先，运行\
  \ `javap` 程序找出编译器是如何翻译 `fun` 方法的。命令\n\n```\njavap -c verifier.VerifierTest\n```\n\
  \n该命令以助记符形式显示类文件中的字节码。\n\n```\nMethod int fun()\n   0 iconst_1\n   1 istore_0\n\
  \   2 iconst_2\n   3 istore_1\n   4 iload_0\n   5 iload_1\n   6 iadd\n   7 istore_2\n\
  \   8 iload_2\n   9 ireturn\n```\n\n使用十六进制编辑器将指令 3 从 `istore_1` 改为 `istore_0`。也就是说，局部变量\
  \ 0（即 `m`）被初始化了两次，而局部变量 1（即 `n`）完全没有初始化。我们需要知道这些指令的十六进制值；这些值可以从 Java 虚拟机规范（[`docs.oracle.com/javase/specs/jvms/se21/html/index.html`](https://docs.oracle.com/javase/specs/jvms/se21/html/index.html））中获取。\n\
  \n```\n0 iconst_1 04\n1 istore_0 3B\n2 iconst_2 05\n3 istore_1 3C\n4 iload_0  1A\n\
  5 iload_1  1B\n6 iadd     60\n7 istore_2 3D\n8 iload_2  1C\n9 ireturn  AC\n```\n\
  \n你可以使用任何十六进制编辑器来执行修改。在图 9.3 中，你看到类文件 `VerifierTest.class` 被加载到 Gnome 十进制编辑器中，`fun`\
  \ 方法的字节码被高亮显示。\n\n![Figure](img/fig09-04.jpg)使用十六进制编辑器修改字节码\n\n将 `3C` 改为 `3B` 并保存类文件。然后尝试运行\
  \ `VerifierTest` 程序。你会得到错误消息：\n\n```\nException in thread \"main\" java.lang.VerifyError:\
  \ (class: VerifierTest, method:fun signature:\n()I) Accessing value from uninitialized\
  \ register 1\n```\n\n这很好——虚拟机检测到了我们的修改。\n\n现在使用 `-noverify`（或 `-Xverify:none`）选项运行程序：\n\
  \n```\njava -noverify verifier.VerifierTest\n```\n\n`fun` 方法返回了一个看似随机的值。这实际上是 `2`\
  \ 加上碰巧存储在变量 `n` 中的值，而 `n` 从未被初始化。\n\n这是一个典型的输出：\n\n```\n1 + 2 == 15102330\n```\n\
  \n`-noverify` 和 `-Xverify:none` 选项已弃用并可能被移除，但在它们可用期间，它们展示了损坏的影响。\n\n`verifier/VerifierTest.java`\n\
  \n```java\npackage verifier;\n\n/**\n * 此应用程序演示了虚拟机的字节码验证器。如果你使用\n * 十六进制编辑器修改类文件，那么虚拟机应该检测到篡改。\n\
  \ * @version 1.10 2018-05-05\n * @author Cay Horstmann\n */\npublic class VerifierTest\n\
  {\n   public static void main(String[] args)\n   {\n      System.out.println(\"\
  1 + 2\");\n   }\n\n   /**\n    * 一个计算的函数\n    * @return 如果未损坏则返回\n    */\n   public\
  \ static int fun()\n   {\n      int m = 1;\n      int n;\n      m = 1;\n      m\
  \ = 2;\n      int r = m + n;\n      return r;\n   }\n}\n```\n\n## 用户身份认证\n\nJava\
  \ 提供了一个名为 Java 认证与授权服务（JAAS）的框架，它提供了访问机制。正如其名称所示，JAAS 包含了认证机制。\n\n这种严格的验证是一项重要的安全考量。我们将讨论以下内容。\n\
  \n### JAAS 框架\n\n从其名称可以看出，JAAS 有两个部分。“认证”部分负责确定程序的身份。“授权”部分与安全管理器相关，我们将不讨论它。\n\n\
  JAAS 是一种可插的 API，将 Java 应用程序与具体的技术隔离。它支持 UNIX 登录、Windows 登录、Kerberos 认证以及基于证书的认证。\n\
  \n这是登录的基本框架：\n\n```java\ntry\n{\n   System.setSecurityManager(new SecurityManager());\n\
  \   var context = new LoginContext(\"Login1\"); // 定义在 JAAS 配置中\n   context.login();\n\
  \   // 获取 Subject\n   Subject subject = context.getSubject();\n   // ...\n   context.logout();\n\
  } catch (LoginException e) // 如果登录失败则抛出\n{\n   e.printStackTrace();\n}\n```\n\n\
  现在 `subject` 表示已认证的个人。\n\n字符串 `\"Login1\"` 在 `LoginContext` 构造器中引用配置中相同的项。这是一个示例配置：\n\
  \n```text\nLogin1\n{\n   com.sun.security.auth.module.UnixLoginModule required;\n\
  \   com.whizzbang.auth.module.RetinaScanModule sufficient=\"true\";\n};\n\nLogin2\n\
  {\n   ...\n};\n\nother\n{\n   ...\n};\n```\n\n模块类名标志可以跟随任意传递给模块构造函数的选项。\n\n特殊名称\
  \ `other` 用于登录上下文不匹配配置中的任何名称时。\n\n当然，JDK 不包含生物识别登录模块。`com.sun.security.auth.module`\
  \ 包中提供了以下模块：\n\n```\nUnixLoginModule\nNTLoginModule\nKrb5LoginModule\nJndiLoginModule\n\
  KeyStoreLoginModule\n```\n\n登录策略由一系列登录模块组成，每个模块标记为 `required`、`sufficient`、`requisite`\
  \ 或 `optional`。这些关键字的含义由算法给出：\n\n1. 按顺序执行模块，直到 `sufficient` 模块成功、`requisite` 模块失败或到达模块列表末尾。\n\
  \n2. 如果所有 `required` 和 `requisite` 模块成功，或者它们一个都没有被执行，如果至少有一个 `sufficient` 或 `optional`\
  \ 模块成功，则认证成功。\n\n登录认证一个 *subject*，该 subject 可以拥有多个 *principal*。principal 描述 subject\
  \ 的某些属性，例如用户名、组 ID 或角色。`com.sun.security.auth.UnixPrincipal` 描述 UNIX 登录名，`UnixNumericGroupPrincipal`\
  \ 可以测试是否属于 UNIX 组。\n\nListing 9.4 中的程序显示当前登录用户的 principal。以如下方式运行程序：\n\n\n\n\n\n\
  ```bash\njava -Djava.security.auth.login.config=auth/jaas.config auth.AuthTest\n\
  ```\n\n`Listing 9.5` 显示登录配置。\n\n在 Windows 上，将 `jaas.config` 中的 `UnixLoginModule`\
  \ 改为 `NTLoginModule`。\n\n`auth/AuthTest.java`\n\n```java\npackage auth;\n\nimport\
  \ java.security.*;\nimport javax.security.auth.*;\nimport javax.security.auth.login.*;\n\
  \n/**\n * 此程序获取有关用户 Unix 登录的信息。\n * @version 1.03 2021-11-29\n * @author Cay Horstmann\n\
  \ */\npublic class AuthTest\n{\n   public static void main(final String[] args)\n\
  \   {\n      try\n      {\n         var context = new LoginContext(\"Login1\");\n\
  \         context.login();\n         System.out.println(\"Authentication successful.\"\
  );\n         Subject subject = context.getSubject();\n         for (Principal p\
  \ : subject.getPrincipals())\n         {\n            System.out.println(p.getClass().getName()\
  \ + \": \" + p.getName());\n         }         \n         context.logout();\n  \
  \    }\n      catch (LoginException e)\n      {\n         System.out.println(\"\
  Authentication failed.\");\n         e.printStackTrace();\n      }\n   }\n}\n```\n\
  \n`auth/jaas.config`\n\n```config\nLogin1 \n{       \n   com.sun.security.auth.module.UnixLoginModule\
  \ required;\n};\n```\n\n`javax.security.auth.login.LoginContext` 1.4\n\n*   `LoginContext(String\
  \ name)`\n    构造登录上下文。`name` 对应 JAAS 配置文件中的登录描述符。\n\n*   `void login()`\n    建立登录，或者在登录失败时抛出\
  \ `LoginException`。调用 JAAS 配置文件中模块的 `login` 方法。\n\n*   `void logout()`\n    注销主体系（subject）。调用\
  \ JAAS 配置文件中模块的 `logout` 方法。\n\n*   `Subject getSubject()`\n    返回已身份验证的主体。\n\n\
  `javax.security.auth.Subject` 1.4\n\n*   `Set<Principal> getPrincipals()`\n    获取该主体的主体（principal）。\n\
  \n`java.security.Principal` 1.1\n\n*   `String getName()`\n    返回该主体的标识名称。\n\n###\
  \ JAAS 登录模块\n\n在本节中，我们将查看一个 JAAS 示例，它将向你展示\n\n*   如何实现自己的登录模块\n*   如何实现基于角色的授权\n\
  \n如果你在数据库中存储登录信息，那么提供自己的登录模块将很有用。\n\n登录模块的一个工作是填充正在进行身份验证的主体的主体（principal set）。如果登录模块支持角色，它会添加描述角色的\
  \ `Principal` 对象。Java 库没有为此为此目的提供类，因此我编写了自己的类（请参见 `Listing 9.6`）。\n\n登录模块在包含如下行的文本文件中查找用户、密码和角色：\n\
  \n```text\nharry|secret|admin\ncarl|guessme|HR\n```\n\n当然，在实际的登录模块中，你会使用数据库而不是文本文件。\n\
  \n（注：原文中存在大量重复的段落和碎片，此处已根据要求进行清理并翻译。）\n\n\n\n\n```java\npackage jaas;\n\nimport\
