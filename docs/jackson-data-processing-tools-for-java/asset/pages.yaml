  md: "# 3. FIRST APPLICATION\n\nBefore going into the details of the Jackson library,\
    \ let us see an application in action.\n\n# Jackson – Example\n\nIn the following\
    \ example, we will create a Student class. Thereafter, we will create a JSON string\
    \ with Student details and deserialize it to Student object and then serialize\
    \ it back to a JSON string.\n\nCreate a Java class file named JacksonTester in\
    \ C:\\>Jackson_WORKSPACE.\n\nFile: JacksonTester.java\n\n```\nimport java.io.IOException;\n\
    import org.codehaus.jackson.JsonParseException;\nimport org.codehaus.jackson.map.JsonMappingException;\n\
    import org.codehaus.jackson.map.ObjectMapper;\nimport org.codehaus.jackson.map.SerializationConfig;\n\
    \npublic class JacksonTester {\n    public static void main(String[] args[]) {\n\
    \        ObjectMapper mapper = new ObjectMapper();\n        String jsonString\
    \ = \"{\\\"name\\\":\\\"Mahesh\\\", \\\"age\\\":21}\";\n\n        // map json\
    \ to student\n        try {\n            Student student = mapper.readValue(jsonString,\
    \ Student.class);\n            System.out.println(student);\n\n            mapper.enable(SerializationConfig.Feature.INDENT_OUTPUT);\n\
    \            jsonString = mapper.writeValueAsString(student);\n            System.out.println(jsonString);\n\
    \n    } catch (JsonParseException e) {\n        e.printStackTrace();\n    }\n\
    ```"
