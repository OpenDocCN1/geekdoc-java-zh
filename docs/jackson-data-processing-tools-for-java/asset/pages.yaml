  md: "# 10. STREAMING API\n\nStreaming API reads and writes JSON content as discrete\
    \ events. JsonParser reads the data, whereas JsonGenerator writes the data.\n\n\
    +   - It is the most powerful approach among the three processing modes Jackson\
    \ supports.\n- It has the lowest overhead and it provides the fastest way to perform\
    \ read/write operations.\n- It is analogous to Stax parser for XML.\n\nIn this\
    \ chapter, we will discuss how to read and write JSON data using Jackson streaming\
    \ APIs. Streaming API works with the concept of token and every details of JSON\
    \ is to be handled carefully. Following are the two classes which we will use\
    \ in this chapter:\n\n+   - JsonGenerator - Write to JSON String.\n- JsonParser\
    \ - Parse JSON String.\n\n# JsonGenerator\n\nJsonGenerator is the base class to\
    \ define public API for writing JSON content. Instances are created using factory\
    \ methods of a JsonFactory instance.\n\n# Class Declaration\n\nFollowing is the\
    \ declaration for org.fasterxml.jackson.JsonGenerator class:\n\n```\npublic abstract\
    \ class JsonGenerator\n  extends Object\n  implements Closeable\n```\n\n# Nested\
    \ Class\n\n| S.N. | Class & Description |\n| 1 | static class JsonGenerator.Feature\
    \ Enumeration that defines all togglable features for generators. |\n\n![](img/abf38b9a96498be10686313ae639d832_58_0.png)"
