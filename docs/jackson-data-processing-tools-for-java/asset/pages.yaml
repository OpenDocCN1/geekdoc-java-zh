  md: '# Jackson


    +   * Click on the ''Environment variables'' button under the ''Advanced'' tab.

    * Alter the ''Path'' variable so that it also contains the path to the Java executable.
    For example, if the path is currently set to ''C:\WINDOWS\SYSTEM32'', then change
    your path to read ''C:\WINDOWS\SYSTEM32;C:\Program Files\java\jdk\bin''


    # Setting up the Path for Windows 95/98/ME


    Assuming you have installed Java in c:\Program Files\java\jdk directory,


    +   * Edit the ''C:\autoexec.bat'' file

    * Add the following line at the end:

    * ''SET PATH=%PATH%%;C:\Program Files\java\jdk\bin''


    # Setting up the Path for Linux, UNIX, Solaris, and FreeBSD


    Environment variable PATH should be set to point to where the Java binaries have
    been installed. Refer to your shell documentation if you have trouble doing this.


    For example, if you use bash as your shell, you need to add the following line
    at the end of your .bashrc: export PATH=/path/to/java:$PATH


    # Popular Java Editors


    To write Java programs, you need a text editor. There are sophisticated IDEs available
    in the market to write Java programs, but for now, you can consider one of the
    following:


    +   * Notepad: On Windows platform, you can use any simple text editor such as
    Notepad (recommended for this tutorial) or TextPad.

    * Netbeans: It is an open-source Java IDE. It can be downloaded from http://www.netbeans.org/index.html.

    * Eclipse: It is also a Java IDE developed by the Eclipse open-source community.
    It can be downloaded from http://www.eclipse.org/


    # Download Jackson Archive


    Download the latest version of Jackson jar file from jackson-all-1.9.0.jar.zip.
    In this tutorial, jackson-1.9.0.jar is downloaded and copied into C:\jackson folder.


