  md: "# 2. ENVIRONMENT SETUP\n\nThis chapter describes how to set up the Jackson\
    \ environment on your system.\n\n# Try-It Online Option\n\nYou do not need to\
    \ set up your own environment to start learning Jackson. We have set up an online\
    \ Java Programming environment online, so that you can compile and execute all\
    \ the available examples online. Feel free to modify any example and check the\
    \ result with different options.\n\nTry the following code example using the Try\
    \ it option available at the top right corner of the sample code on our website:\n\
    \n```\npublic class MyFirstJavaProgram {\n    public static void main(String [args])\
    \ {\n        System.out.println(\"Hello World\");\n    }\n}\n```\n\nFor most of\
    \ the examples given in this tutorial, you will find a Try it option to help you\
    \ learn quickly through practice.\n\n# Local Environment Setup\n\nIf you still\
    \ wish to set up your environment for Java programming language, then this section\
    \ guides you on how to download and set up Java on your machine. Follow the given\
    \ steps to set up the environment.\n\nJava SE is freely available from the link\
    \ Download Java. You can download a version based on your operating system.\n\n\
    Follow the instructions to download Java and run the .exe to install Java on your\
    \ machine. Once you have installed Java, you would need to set the environment\
    \ variables to point to the correct installation directories.\n\n# Setting up\
    \ the Path for Windows 2000/XP\n\nAssuming you have installed Java in c:\\Program\
    \ Files\\java\\jdk directory,\n\n+   - Right-click on 'My Computer'.\n- Select\
    \ 'Properties'.\n\n![](img/abf38b9a96498be10686313ae639d832_7_0.png)"
