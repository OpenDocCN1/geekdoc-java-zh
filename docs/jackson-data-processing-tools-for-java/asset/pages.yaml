  md: '# 9. TREE MODEL


    The Tree Model prepares an in-memory tree representation of a JSON document. It
    is the most flexible approach among the three processing modes that Jackson supports.
    It is quite similar to DOM parser in XML.


    # Create a Tree from JSON


    ObjectMapper provides a pointer to root node of the tree after reading the JSON.
    Root Node can be used to traverse the complete tree. Consider the following code
    snippet to get the root node of a provided JSON String.


    ```

    // create an ObjectMapper instance

    ObjectMapper mapper = new ObjectMapper();

    String jsonString = "\name":"Mahesh Kumar\",\"age":21,\verified":false,\"marks":[100,90,85]"


    // create tree from JSON

    JsonNode rootNode = mapper.readTree(jsonString);

    ```


    # Traversing a Tree


    Get each node using the relative path to the root node while traversing the tree
    and process the data. The following code snippet shows how to traverse a tree,
    provided you have information regarding the root node.


    | JsonNode nameNode = rootNode.path("name");

    System.out.println("Name: " + nameNode.getTextValue());


    JsonNode marksNode = rootNode.path("marks");

    Iterator iterator = marksNode.getElements(); |


    ![](img/abf38b9a96498be10686313ae639d832_49_0.png)'
