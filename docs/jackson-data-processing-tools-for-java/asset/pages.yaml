  md: "# # 1. OVERVIEW\n\nJackson is a simple Java-based library to serialize Java\
    \ objects to JSON and vice versa.\n\n# ## Features of Jackson\n\n+   - **Easy\
    \ to use** – Jackson API provides a high-level facade to simplify commonly used\
    \ use-cases.\n- **No need to create mapping** – Jackson API provides default mapping\
    \ for most of the objects to be serialized.\n- **Performance** – Jackson is quite\
    \ fast, consumes less memory space, and is suitable for large object graphs or\
    \ systems.\n- **Clean JSON** – Jackson creates clean and compact JSON results\
    \ which are easy to read.\n- **No Dependency** – Jackson library does not require\
    \ any other library apart from JDK.\n- **Open Source** – Jackson library is open\
    \ source and free to use.\n\n# ## Process using Jackson\n\nJackson provides three\
    \ different ways to process JSON:\n\n+   - **Streaming API** – It reads and writes\
    \ JSON content as discrete events. JsonParser reads the data,\n  - It is the most\
    \ powerful approach among the three.\n  - It has the lowest overhead and provides\
    \ the fastest way to perform read/write operations.\n  - It is analogous to Stax\
    \ parser for XML.\n- **Tree Model** – It prepares an in-memory tree representation\
    \ of the JSON document. ObjectMapper build tree of JsonNode nodes. It is most\
    \ flexible approach. It is analogous to DOM parser for XML.\n\n![](img/abf38b9a96498be10686313ae639d832_5_0.png)"
  merge: -1
  pgno: 5
- img_proc: true
  md: '+   * Data Binding – It converts JSON to and from Plain Old Java Object (POJO)
    using property accessor or using annotations. ObjectMapper reads/writes JSON for
    both types of data bindings. Data binding is analogous to JAXB parser for XML.
    Data binding is of two types:


    +   * Simple Data Binding – It converts JSON to and from Java Maps, Lists, Strings,
    Numbers, Booleans, and null objects.


    +   * Full Data Binding – It converts JSON to and from any Java type.'
