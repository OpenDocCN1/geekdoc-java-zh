  md: "ObjectMapper is the main actor class of Jackson library. ObjectMapper class\
    \ provides functionalities to convert Java objects to matching JSON constructs\
    \ and vice versa. It uses instances of JsonParser and JsonGenerator for implementing\
    \ actual reading/writing of JSON.\n\n# ObjectMapper – Class Declaration\n\nFollowing\
    \ is the declaration for org.codehaus.jackson.map.ObjectMapper class:\n\n```\n\
    public class ObjectMapper\n    extends ObjectCodec\n    implements Versioned\n\
    ```\n\n# ObjectMapper – Nested Classes\n\n| Sr. No. | Class and Description |\n\
    | 1 | static class ObjectMapper.DefaultTypeResolverBuilder Customized TypeResolverBuilder\
    \ provides type resolver builders with so-called \"default typing\" (see enableDefaultTyping()\
    \ for details). |\n| 2 | static class ObjectMapper.DefaultTyping Enumeration use\
    \ with enableDefaultTyping() to specify what kind of types (classes) default typing\
    \ should be used for. |\n\n# ObjectMapper Class – Constructors\n\n| Sr. No. |\
    \ Constructor and Description |\n| 1 | ObjectMapper() It is the default constructor,\
    \ which constructs the default JsonFactory as necessary. Use SerialProvider as\
    \ its SerializerProvider, and BeanSerializerFactory as its SerializerFactory.\
    \ |\n\n![](img/abf38b9a96498be10686313ae639d832_13_0.png)"
