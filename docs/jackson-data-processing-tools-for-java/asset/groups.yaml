    \nReading JSON using JsonParser ................................................75\n\
    \n# 1. OVERVIEW\n\nJackson is a simple Java-based library to serialize Java objects\
    \ to JSON and vice versa.\n\n## Features of Jackson\n\n- **Easy to use** – Jackson\
    \ API provides a high-level facade to simplify commonly used-cases.\n- **No need\
    \ to create mapping** – Jackson API provides default mapping for most of the objects\
    \ to be serialized.\n- **Performance** – Jackson is quite fast, consumes less\
    \ memory space, and is suitable for large object graphs or systems.\n- **Clean\
    \ JSON** – Jackson creates clean and compact JSON results which are easy to read.\n\
    - **No Dependency** – Jackson library does not require any other library apart\
    \ from JDK.\n- **Open Source** – Jackson library is open source and free to use.\n\
    \n## Process using Jackson\n\nJackson provides three different ways to process\
    \ JSON:\n\n- **Streaming API** – It reads and writes JSON content as discrete\
    \ events. JsonParser reads the data,\n  - It is the most powerful approach among\
    \ the three.\n  - It has the lowest overhead and provides the fastest way to perform\
    \ read/write operations.\n  - It is analogous to Stax parser for XML.\n- **Tree\
    \ Model** – It prepares an in-memory tree representation of the JSON document.\
    \ ObjectMapper build tree of JsonNode nodes. It is most flexible approach. It\
    \ is analogous to DOM parser for XML.\n\n![](img/abf38b9a96498be10686313ae639d832_5_0.png)\n"
  mdcn: "\n\n# JACKSON\n\n用于 Java 的数据处理工具\n\n# tutorialspoint\n## 简单易用学习\n\nwww.tutorialspoint.com\n\
