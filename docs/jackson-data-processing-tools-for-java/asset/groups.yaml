    \ [ name: Mahesh, age: 10 ] |\n\n# #6. DATA BINDING\n\nData Binding API is used\
    \ to convert JSON to and from Plain Old Java Object (POJO) using property accessor\
    \ or using annotations. It is one of two types:\n\n- Simple Data Binding – It\
    \ converts JSON to and from Java Maps, Lists, Strings, Numbers, Booleans, and\
    \ null objects.\n- Full Data Binding – It converts JSON to and from any Java type.\n\
    \nObjectMapper reads/writes JSON for both types of data bindings. Data binding\
    \ is analogous to JAXB parser for XML.\n\nWe will cover simple data binding in\
    \ this chapter. Full data binding is discussed separately in the next chapter.\n\
    \n## Simple Data Binding\n\nSimple data binding refers to mapping of JSON to JAVA\
    \ core data types. The table illustrates the relationship between JSON types versus\
    \ Java types.\n\n| S. No. | JSON Type | Java Type |\n|---|---|---|\n| 1 | object\
    \ | LinkedHashMap<String,Object> |\n| 2 | array | ArrayList<Object> |\n| 3 | string\
    \ | String |\n| 4 | complete number | Integer, Long or BigInteger |\n| 5 | fractional\
    \ number | Double / BigDecimal |\n| 6 | true / false | Boolean |\n| 7 | null |\
    \ null |\n\n## Simple Data Binding – Example\n\nLet us take a simple example to\
    \ understand simple data binding in detail. Here, we'll map Java basic types directly\
    \ to JSON and vice versa.\n\nCreate a Java class named JacksonTester in C:\\Jackson_WORKSPACE.\n\
