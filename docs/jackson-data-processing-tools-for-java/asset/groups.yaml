    \ typedWriter(Class<?> rootType)\n```\n\nDeprecated. Since 1.9, use writerWithType(Class)\
    \ instead.\n\n```java\nObjectWriter typedWriter(JavaType rootType)\n```\n\nDeprecated.\
    \ Since 1.9, use writerWithType(JavaType) instead.\n\n![](img/abf38b9a96498be10686313ae639d832_27_0.png)\n\
    \n## ObjectWriter typedWriter(TypeReference<?> rootType)\n\nDeprecated. Since\
