  - "[PAGE 5]\n\n# # 1. OVERVIEW\n\nJackson is a simple Java-based library to serialize\
    \ Java objects to JSON and vice versa.\n\n# ## Features of Jackson\n\n+   - **Easy\
    \ to use** – Jackson API provides a high-level facade to simplify commonly used\
    \ use-cases.\n- **No need to create mapping** – Jackson API provides default mapping\
    \ for most of the objects to be serialized.\n- **Performance** – Jackson is quite\
    \ fast, consumes less memory space, and is suitable for large object graphs or\
    \ systems.\n- **Clean JSON** – Jackson creates clean and compact JSON results\
    \ which are easy to read.\n- **No Dependency** – Jackson library does not require\
    \ any other library apart from JDK.\n- **Open Source** – Jackson library is open\
    \ source and free to use.\n\n# ## Process using Jackson\n\nJackson provides three\
    \ different ways to process JSON:\n\n+   - **Streaming API** – It reads and writes\
    \ JSON content as discrete events. JsonParser reads the data,\n  - It is the most\
    \ powerful approach among the three.\n  - It has the lowest overhead and provides\
    \ the fastest way to perform read/write operations.\n  - It is analogous to Stax\
    \ parser for XML.\n- **Tree Model** – It prepares an in-memory tree representation\
    \ of the JSON document. ObjectMapper build tree of JsonNode nodes. It is most\
    \ flexible approach. It is analogous to DOM parser for XML.\n\n![](img/abf38b9a96498be10686313ae639d832_5_0.png)"
- md: "\n- Data Binding – It converts JSON to and from Plain Old Java Object (POJO)\
    \ using property accessor or using annotations. ObjectMapper reads/writes JSON\
    \ for both types of data bindings. Data binding is analogous to JAXB parser for\
    \ XML. Data binding is of two types:\n  - Simple Data Binding – It converts JSON\
    \ to and from Java Maps, Lists, Strings, Numbers, Booleans, and null objects.\n\
    \  - Full Data Binding – It converts JSON to and from any Java type.\n\n## 2.\
    \ ENVIRONMENT SETUP\n\nThis chapter describes how to set up the Jackson environment\
    \ on your system.\n\n### Try-It Online Option\n\nYou do not need to set up your\
    \ own environment to start learning Jackson. We have set up an online Java Programming\
    \ environment online, so that you can compile and execute all the available examples\
    \ online. Feel free to modify any example and check the result with different\
    \ options.\n\nTry the following code example using the Try it option available\
    \ at the top right corner of the sample code on our website:\n\n```\npublic class\
    \ MyFirstJavaProgram {\n    public static void main(String[] args) {\n       \
    \ System.out.println(\"Hello World\");\n    }\n}\n```\n\nFor most of the examples\
    \ given in this tutorial, you will find a Try it option to help you learn quickly\
    \ through practice.\n\n### Local Environment Setup\n\nIf you still wish to set\
    \ up your environment for Java programming language, then this section guides\
    \ you on how to download and set up Java on your machine. Follow the given steps\
    \ to set up the environment.\n\nJava SE is freely available from the link Download\
    \ Java. You can download a version based on your operating system.\n\nFollow the\
    \ instructions to download Java and run the .exe to install Java on your machine.\
    \ Once you have installed Java, you would need to set the environment variables\
    \ to point to the correct installation directories.\n\n### Setting up the Path\
    \ for Windows 2000/XP\n\nAssuming you have installed Java in c:\\Program Files\\\
    java\\jdk directory,\n\n- Right-click on 'My Computer'.\n- Select 'Properties'.\n\
    \n![](img/abf38b9a96498be10686313ae639d832_7_0.png)\n\n### Jackson\n\n- Click\
    \ on the 'Environment variables' button under the 'Advanced' tab.\n- Alter the\
    \ 'Path' variable so that it also contains the path to the Java executable. For\
    \ example, if the path is currently set to 'C:\\WINDOWS\\SYSTEM32', then change\
    \ your path to read 'C:\\WINDOWS\\SYSTEM32;C:\\Program Files\\java\\jdk\\bin'\n\
    \n### Setting up the Path for Windows 95/98/ME\n\nAssuming you have installed\
    \ Java in c:\\Program Files\\java\\jdk directory,\n\n- Edit the 'C:\\autoexec.bat'\
    \ file\n- Add the following line at the end:\n- 'SET PATH=%PATH%;C:\\Program Files\\\
    java\\jdk\\bin'\n\n### Setting up the Path for Linux, UNIX, Solaris, and FreeBSD\n\
    \nEnvironment variable PATH should be set to point to where the Java binaries\
    \ have been installed. Refer to your shell documentation if you have trouble doing\
    \ this.\n\nFor example, if you use bash as your shell, you need to add the following\
    \ line at the end of your .bashrc: export PATH=/path/to/java:$PATH\n\n### Popular\
    \ Java Editors\n\nTo write Java programs, you need a text editor. There are sophisticated\
    \ IDEs available in the market to write Java programs, but for now, you can consider\
    \ one of the following:\n\n- Notepad: On Windows platform, you can use any simple\
    \ text editor such as Notepad (recommended for this tutorial) or TextPad.\n- Netbeans:\
    \ It is an open-source Java IDE. It can be downloaded from http://www.netbeans.org/index.html.\n\
    - Eclipse: It is also a Java IDE developed by the Eclipse open-source community.\
    \ It can be downloaded from http://www.eclipse.org/\n\n### Download Jackson Archive\n\
    \nDownload the latest version of Jackson jar file from jackson-all-1.9.0.jar.zip.\
    \ In this tutorial, jackson-1.9.0.jar is downloaded and copied into C:\\jackson\
    \ folder.\n\n![](img/abf38b9a96498be10686313ae639d832_8_0.png)\n\n### Jackson\n\
    \n| OS | Archive name |\n| :--- | :--- |\n| Windows | jackson-all-1.9.0.jar |\n\
    | Linux | jackson-all-1.9.0.jar |\n| Mac | jackson-all-1.9.0.jar |\n\n### Set\
    \ up Jackson Environment\n\nSet the jackson_HOME environment variable to point\
    \ to the base directory location where Jackson jar is stored on your machine.\
    \ Depending on the platform you are working on, the process varies as shown in\
    \ the following table:\n\n| OS | Output |\n| :--- | :--- |\n| Windows | Set the\
    \ environment variable jackson_HOME=C:\\jackson |\n| Linux | export jackson_HOME=/usr/local/jackson\
    \ |\n| Mac | export jackson_HOME=/Library/jackson |\n\n### Set CLSPATH Variable\n\
    \nSet the CLSPATH environment variable to point to the Jackson jar location.\n\
    \n| OS | Output |\n| :--- | :--- |\n| Windows | Set the environment variable CLSPATH\
    \ to %CLASSPATH%;%jackson_HOME%\\jackson-all-1.9.0.jar;;- |\n| Linux | export\
    \ CLSPATH=$CLASSPATH:$jackson_HOME/jackson-all-1.9.0.jar:: |\n| Mac | export CLSPATH=$CLASSPATH:$jackson_HOME/jackson-all-1.9.0.jar::\
    \ |\n\n![](img/abf38b9a96498be10686313ae639d832_9_0.png)\n\n## 3. FIRST APPLICATION\n\
    \nBefore going into the details of Jackson, let us see an application.\n\n###\
    \ Jackson – Example\n\nIn the following example, we will create a Student class.\
    \ Thereafter, we will use Jackson to deserialize JSON string and then serialize\
    \ it back.\n\n```java\nimport com.fasterxml.jackson.databind.ObjectMapper;\nimport\
    \ com.fasterxml.jackson.core.JsonParseException;\nimport com.fasterxml.jackson.databind.JsonMappingException;\n\
    import com.fasterxml.jackson.databind.SerializationFeature;\nimport java.io.IOException;\n\
    \npublic class JacksonTester {\n    public static void main(String[] args) {\n\
    \        ObjectMapper mapper = new ObjectMapper();\n        String jsonString\
    \ = \"{\\\"name\\\":\\\"Mahesh\\\",\\\"age\\\":21}\";\n\n        try {\n     \
    \       Student student = mapper.readValue(jsonString, Student.class);\n     \
    \       System.out.println(student);\n\n            mapper.enable(SerializationFeature.INDENT_OUTPUT);\n\
    \            jsonString = mapper.writeValueAsString(student);\n            System.out.println(jsonString);\n\
    \        } catch (JsonParseException e) {\n            e.printStackTrace();\n\
    \        } catch (JsonMappingException e) {\n            e.printStackTrace();\n\
    \        } catch (IOException e) {\n            e.printStackTrace();\n       \
    \ }\n    }\n}\n\nclass Student {\n    private String name;\n    private int age;\n\
    \n    public Student() {}\n\n    public String getName() {\n        return name;\n\
    \    }\n\n    public void setName(String name) {\n        this.name = name;\n\
    \    }\n\n    public int getAge() {\n        return age;\n    }\n\n    public\
    \ void setAge(int age) {\n        this.age = age;\n    }\n\n    @Override\n  \
    \  public String toString() {\n        return \"Student [ name: \" + name + \"\
    , age: \" + age + \" ]\";\n    }\n}\n```\n\n### Verify the Result\n\nCompile the\
    \ classes using javac:\n\n```\nC:\\Jackson_WORKSPACE javac JacksonTester.java\n\
    ```\n\n![](img/abf38b9a96498be10686313ae639d832_10_0.png)\n\nExecute the JacksonTester\
    \ to see the result:\n\n```\nC:\\Jackson_WORKSPACE>java JacksonTester\n```\n\n\
    ```\nStudent [ name: Mahesh, age: 21 ]\n{\n  \"name\" : \"Mahesh\",\n  \"age\"\
    \ : 21\n}\n```\n\n### Steps to Remember\n\nFollowing are the important steps to\
    \ be considered:\n\n#### Step 1: Create ObjectMapper Object\n\nCreate ObjectMapper\
    \ object. It is a reusable object.\n\n```\nObjectMapper mapper = new ObjectMapper();\n\
    ```\n\n#### Step 2: Deserialialize JSON to Object\n\nUse readValue() method to\
    \ get the Object from the JSON. Pass the JSON string or the source of the JSON\
    \ and the object type as parameters.\n\n```java\n//Object to JSON\nStudent student\
    \ = mapper.readValue(jsonString, Student.class);\n```\n\n#### Step 3: Serialize\
    \ JSON to Object\n\nUse valueAsAsString() method to get the JSON string representation\
    \ of an object.\n\n```java\n//Object to JSON\njsonString = mapper.writeValueAsString(student);\n\
    ```\n\n![](img/abf38b9a96498be10686313ae639d832_12_0.png)\n\n## ObjectMapper\n\
    \nObjectMapper is the main actor class of Jackson library. ObjectMapper class\
    \ provides functionalities to convert Java objects to matching JSON constructs\
    \ and vice versa. It uses instances of JsonParser and JsonGenerator for implementing\
    \ actual reading/writing of JSON.\n\n### ObjectMapper – Class Declaration\n\n\
    Following is the declaration for org.codehaus.jackson.map.ObjectMapper class:\n\
    \n```\npublic class ObjectMapper\n    extends ObjectCodec\n    implements Versioned\n\
    ```\n\n### ObjectMapper – Nested Classes\n\n| Sr. No. | Class and Description\
    \ |\n| :--- | :--- |\n| 1 | static class ObjectMapper.DefaultTypeResolverBuilder\
    \ Customized TypeResolverBuilder provides type resolver builders with so-called\
    \ \"default typing\" (see enableDefaulting() for details). |\n| 2 | static class\
    \ ObjectMapper.DefaultTyping Enumeration use with enableDefaulting() to specify\
    \ what kind of types (classes) default typing should be used for. |\n\n### ObjectMapper\
    \ Class – Constructors\n\n| Sr. No. | Constructor and Description |\n| :--- |\
    \ :--- |\n| 1 | ObjectMapper() It is the default constructor, which constructs\
    \ the default JsonFactory as necessary. Use SerialProvider as its SerializerProvider,\
    \ and BeanSerializerFactory as its SerializerFactory. |\n\n![](img/abf38b9a96498be10686313ae639d832_13_0.png)\n"
  mdcn: "\n\n-   数据绑定 – 它使用属性访问器或注解在 JSON 与简单的旧 Java 对象（POJO）之间进行转换。`ObjectMapper`\
    \ 负责这两种数据绑定的 JSON 读取/写入。数据绑定类似于用于 XML 的 JAXB 解析器。数据绑定分为两种类型：\n    -   简单数据绑定 –\
    \ 它在 JSON 与 Java Maps、Lists、Strings、Numbers、Booleans 和 `null` 对象之间进行转换。\n    -\
    \   全量数据绑定 – 它在 JSON 与任何 Java 类型之间进行转换。\n\n## 2. 环境设置\n\n本章节描述了如何在你的系统上设置 Jackson\
    \ 环境。\n\n### 在线尝试选项\n\n你不需要设置自己的环境就可以开始学习 Jackson。我们已经在网上设置了一个在线 Java 编程环境，这样你就可以在线上编译并执行所有可用的示例。可以随时修改任何示例并使用不同的选项检查结果。\n\
    \n使用我们网站上示例代码右上角的 `Try it` 选项尝试以下代码示例：\n\n```\npublic class MyFirstJavaProgram\
    \ {\n    public static void main(String[] args) {\n        System.out.println(\"\
    Hello World\");\n    }\n}\n```\n\n对于本教程给出的大多数示例，你都会发现一个 `Try it` 选项，帮助你通过实践快速学习。\n\
    \n### 本地环境设置\n\n如果你仍然想为 Java 编程语言设置环境，本节将指导你如何在你的机器上下载并设置 Java。请按照给定的步骤设置环境。\n\
    \n可以通过 [下载 Java](Download Java) 链接免费获取 Java SE。你可以根据你的操作系统下载相应的版本。\n\n按照说明下载 Java\
    \ 并运行 `.exe` 在你的机器上安装 Java。一旦安装了 Java，你就需要设置环境变量以指向正确的安装目录。\n\n### 为 Windows 2000/XP\
    \ 设置路径\n\n假设你已将 Java 安装在 `c:\\Program Files\\java\\jdk` 目录下，\n\n-   右键点击“我的电脑”。\n\
    -   选择“属性”。\n\n![](img/abf38b9a96498be10686313ae639d832_7_0.png)\n\n### Jackson\n\
    \n-   点击“高级”选项卡下的“环境变量”按钮。\n-   修改“Path”变量，使其也包含指向 Java 可执行文件的路径。例如，如果路径当前设置为\
    \ `C:\\WINDOWS\\SYSTEM32`，则将你的路径改为 `C:\\WINDOWS\\SYSTEM32;C:\\Program Files\\\
    java\\jdk\\bin`\n\n### 为 Windows 95/98/ME 设置路径\n\n假设你已将 Java 安装在 `c:\\Program\
    \ Files\\java\\jdk` 目录下，\n\n-   编辑 `C:\\autoexec.bat` 文件\n-   在末尾添加以下行：\n-   `'SET\
    \ PATH=%PATH%;C:\\Program Files\\java\\jdk\\bin'`\n\n### 为 Linux, UNIX, Solaris\
    \ 和 FreeBSD 设置路径\n\n环境变量 `PATH` 应设置为指向 Java 二进制文件安装的位置。如果你在此操作上遇到困难，请参考你的 shell\
    \ 文档。\n\n例如，如果你使用 `bash` 作为你的 shell，你需要在 `.bashrc` 的末尾添加以下行：`export PATH=/path/to/java:$PATH`\n\
    \n### 流行的 Java 编辑器\n\n编写 Java 程序，你需要一个文本编辑器。市场上有很多高级的 IDE 可以编写 Java 程序，但目前你可以考虑以下之一：\n\
    \n-   Notepad（记事本）:在 Windows 平台上，你可以使用任何简单的文本编辑器，如记事本（本教程推荐）或 TextPad。\n-   Netbeans:\
    \ 这是一个开源 Java IDE。可以从 http://www.netbeans.org/index.html 下载。\n-   Eclipse: 它也是一个由\
    \ Eclipse 开源社区开发的 Java IDE。可以从 http://www.eclipse.org/ 下载。\n\n### 下载 Jackson 存档\n\
    \n从 `jackson-all-1.9.0.jar.zip` 下载最新版本的 Jackson jar 文件。在本教程中，`jackson-1.9.0.jar`\
    \ 被下载并复制到 `C:\\jackson` 文件夹。\n\n![](img/abf38b9a96498be10686313ae639d832_8_0.png)\n\
    \n### Jackson\n\n| 操作系统 | 存档名称 |\n| :--- | :--- |\n| Windows | jackson-all-1.9.0.jar\
    \ |\n| Linux | jackson-all-1.9.0.jar |\n| Mac | jackson-all-1.9.0.jar |\n\n###\
    \ 设置 Jackson 环境\n\n设置 `jackson_HOME` 环境变量指向指向机器上存储 Jackson jar 的基础目录。根据你所工作的平台，过程会有所不同，如下表所示：\n\
    \n| 操作系统 | 输出 |\n| :--- | :--- |\n| Windows | 设置环境变量 jackson_HOME=C:\\jackson\
    \ |\n| Linux | export jackson_HOME=/usr/local/jackson |\n| Mac | export jackson_HOME=/Library/jackson\
    \ |\n\n### 设置 CLSPATH 变量\n\n设置 `CLSPATH` 变量指向 Jackson jar 所在的位置。\n\n| 操作系统 | 输出\
    \ |\n| :--- | :--- |\n| Windows | 设置环境变量 CLSPATH=C:\\jackson |\n| Linux | export\
    \ CLSPATH=/usr/local/jackson |\n| Mac | export CLSPATH=/Library/jackson |\n\n\
    ## 3. 应用\n\n在深入研究 Jackson 之前，让我们看看应用程序。\n\n### Jackson – 示例\n\n在本示例中，我们将使用 Jackson\
    \ 来序列化 JSON 并反序列化。\n\n```java\nimport com.fasterxml.jackson.databind.ObjectMapper;\n\
    import com.fasterxml.jackson.core.ParseException;\nimport com.fasterxml.jackson.databind.MappingException;\n\
    import com.fasterxml.jackson.databind.SerializationFeature;\nimport com.fasterxml.jackson.core.Json;\n\
    import java.io.IOException;\n\npublic class JacksonTester {\n    public static\
    \ void main(String[] args) {\n        ObjectMapper mapper = new ObjectMapper();\n\
    \        String jsonString = \"{\\\"name\\\":\\\"Mahesh\\\",\\\"age\\\":21}\"\
    ;\n\n        try {\n            Student student = mapper.readValue(jsonString,\
    \ Student.class);\n            System.out.println(student);\n\n            mapper.enable(SerializationFeature.INDENT_OUTPUT);\n\
    \            jsonString = mapper.writeValueAsString(student);\n            System.out.println(jsonString);\n\
    \        } catch (ParseException e) {\n            e.printStackTrace();\n    \
    \    } catch (MappingException e) {\n            e.printStackTrace();\n      \
    \  } catch (IOException e) {\n            e.printStackTrace();\n        }\n  \
    \  }\n}\n\nclass Student {\n    private String name;\n    private int age;\n\n\
    \    public Student() {}\n\n    public String getName() {\n        return name;\n\
    \    }\n\n    public void setName(String name) {\n        this.name = name;\n\
    \    }\n\n    public int getAge() {\n        return age;\n    }\n\n    public\
    \ void setAge(int age) {\n        this.age = age;\n    }\n\n    @Override\n  \
    \  public String toString() {\n        return \"Student [ name: \" + name + \"\
    , age: \" + age + \" ]\";\n    }\n}\n```\n\n### 验证结果\n\n使用 javac 编译类：\n\n```\n\
    C:\\path> javac JacksonTester.java\n```\n\n运行 JacksonTester 查看结果：\n\n```\nC:\\\
    path> java JacksonTester\n```\n\n```text\nStudent [ name: Mahesh, age: 21 ]\n\
    {\n  \"name\" : \"Mahesh\",\n  \"age\" : 21\n}\n```\n"
