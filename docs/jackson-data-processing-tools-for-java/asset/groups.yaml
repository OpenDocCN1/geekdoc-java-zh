    \ writeValueAsString(Object value)**<br>Method that can be used to serialize any\
    \ Java value as JSON output, as a String. |\n\n## 5. OBJECT SERIALIZATION\n\n\
    To understand object serialization in detail, let us serialize a Java object to\
    \ a JSON file and then read that JSON file to get the object back.\n\n## Object\
    \ Serialization – Example\n\nIn the following example, we will create a Student\
