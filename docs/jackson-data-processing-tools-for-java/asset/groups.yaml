    \n# 1. 概述\n\nJackson 是一个简单的基于 Java 的库，用于将 Java 对象序列化为 JSON 或反之亦然。\n\n## Jackson\
    \ 的特性\n\n- **易用** – Jackson API 提供了一个高级抽象，以简化常用场景。\n- **无需创建映射** – Jackson API\
    \ 为大多数要序列化的对象提供了默认映射。\n- **性能** – Jackson 运行快速，消耗内存空间少，适用于大型对象图或系统。\n- **清晰的 JSON**\
    \ – Jackson 创建的 JSON 结果清晰且紧凑。\n- **无依赖** – Jackson 库 JDK 之外不需要其他库。\n- **开源** –\
    \ Jackson 库是开源且免费使用的。\n\n## 处理 JSON\n\nJackson 提供了三种不同的方式来处理 JSON：\n\n- **流式 API**\
    \ – 它作为离散事件读取和写入 JSON 内容。JsonParser 读取数据，\n   它是三种方法中最强大的。\n   它的开销最小，是执行读写操作最快的方法。\n\
    \   它类似于 XML 的 Stax 解析器。\n- **树模型** – 它为 JSON 文档准备内存中的树表示。ObjectMapper 构建 JsonNode\
    \ 节点组成的树。它是最灵活的方法。它类似于 XML 的 DOM 解析器。\n\n![](img/abf38b9a96498be10686313ae639d832_5_0.png)\n\
