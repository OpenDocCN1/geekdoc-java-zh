  md: '# Afterword


    This book has investigated the nature of the oppression of the people of Java
    by the Japanese military administration. Japanese rule created many economic and
    humanitarian problems despite the fact that the Japanese did not consider the
    Indonesians their enemy, did not fight against them, and that Java did not become
    a battlefield during the war, except for the brief period of the Japanese attack.
    The prevailing view ascribe these problems to brutality and exploitation on the
    part of the Japanese. Many Japanese were indeed brutal and cruel and their deeds
    adversely affected the physical, material and psychological well-being of the
    people of Java. However, the issue of raw violence and direct exploitation is
    only a partial explanation for the magnitude of the problems created by the occupation.
    Many thousands of people felt direct victims to Japanese violence and exploitation
    while millions suffered bitterly under the regime. This study has shown that the
    Japanese oppression took more subtle, complex, and systematic forms than hitherto
    has been believed. Brutality and exploitation took place but there were additional
    dimensions to Japanese rule. First, the war itself created large scale economic
    problems by disrupting international trade and causing serious shortages of certain
    commodities such as textiles, fuel, medicine, and machinery. Second, Japanese
    wartime ideology justified and demanded a “total mobilisation” of human and natural
    resources for the war effort, both in Japan and the occupied territories. Third,
    owing to their lack of knowledge and experience the Japanese were incompetent
    in ruling the occupied territory, and their maladministration caused widespread
    confusion to social and economic life in Java. Finally, maladministration increased
    the estrangement between ruler and ruled.


    The first two points were common to Japan and Java. In both areas Japanese authorities
    tried to create a “total war structure” which was'
