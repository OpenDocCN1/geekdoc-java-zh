    # The Socio-Economic Context


    Any detailed and satisfactory assessment of the impact of change requires a study
    of the subject’s condition before the impact. The Dutch economist J.H. Boeke,
    in his book published in 1942, characterised the vulnerability of the Javanese
    village by noting that “even in normal times the population lives near the minimum
    standard of life, is so completely devoid of all reserves, that any disturbance
    must of necessity produce serious result.” Javanese society indeed proved vulnerable
    to the disturbances which the Japanese occupation caused, but the statement that
    the peasantry was “completely devoid of all reserves” requires qualification.
    Peasant society in Java was highly stratified; some peasants were more wanting
    in resources than others and were more vulnerable to disturbances. We cannot hope
    to understand the impact of the occupation accurately without understanding this
    stratification. This chapter examines the socio-economic conditions in rural Java
    up to October 1943, when the impact of the occupation had not yet been strongly
    felt, paying special attention to distribution of landholding, labour relations,
    the production and distribution of rice, and the incomes and expenditures of village
    households.


