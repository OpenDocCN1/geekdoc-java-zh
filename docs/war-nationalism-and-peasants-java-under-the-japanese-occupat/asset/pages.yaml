    # Work Conditions


    The coercive mobilisation of millions of romusha affected not only the romusha
    themselves, but the entire communities from which they were extracted. Romusha
    suffered from over work, undernourishment, inadequate medical care and accommodation,
    and physical violence. Japanese soldiers were notorious for their violent behaviour,
    particularly the habit of hitting the face with a fist or an open hand. This behaviour
    was strongly resented by the Indonesians because the head is considered to be
    a sacred part of the body. The Japanese authorities soon became aware of the problem,
    and after June 1942, they launched a “Don’t Hit the Natives” campaign, and produced
    many such slogans as, “If you have swung your fist, put it down on your chest.\”51
    The military administration also produced an extremely moralistic and idealistic
    document entitled “Codes of behaviour for the Japanese in Java.\52 Like many other
    campaigns, this failed to produce much effect, and Japanese soldiers'' barbaric
    habits remained unchanged.53 In 1945 the Japanese had to start another campaign
    concerning the treatment of romusha, which included the eradication of hitting.54


    Violence against romusha continued throughout the occupation. Japanese punished
    romusha severely for minor offences such as stealing a portion of food. Existing
    records of physical mostly concern romusha sent overseas. For instance, on Numfur
    off the north coast of West New Guinea, the Japanese decided to behead two Javanese
    romusha. “Many coolies were assembled and forced to witness the execution, with
    a Sundanese called Darma, who was chief foreman at Numfur, came forward and asked
    the permission of the Japanese officer to execute the victims himself, which request
    was granted. The victims had already been severely beaten by Darma with sticks.\55
