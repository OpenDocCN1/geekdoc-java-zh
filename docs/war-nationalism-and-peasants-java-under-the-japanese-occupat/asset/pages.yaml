    the distribution of surplus rice produced in villages in order to avoid war-profite
    and price inflation, and to secure a stable distribution of this staple food.
    In wartime Japan, the government exerted a monopolistic control over the distribution
    of rice surplus. The concept of “surplus” was more straightforward in Japan than
    in Java. Harvesting was done once a year, almost simultaneously throughout Japan,
    in autumn. By the 1920s most villages in Japan had their paddy within their own
    village, kept some for their own consumption, and sold the surplus, if any, to
    the government at the official prices through the semi-governmental agricultural
    cooperative which had a nation-wide network. Husked rice moved from the producers
    to the consumers in a relatively simple manner.


    Rural Japan was also highly stratified, consisting of a relatively small number
    of landlords and a large number of impoverished tenants, but landless agricultural
    labourers were few. Tenant farmers retained part of their harvest for their own
    consumption and supplemented the deficit, usually by wage labour and other employment
    in the off-crop season. Tenant farmers’ lives were meagre in the 1930s and 1940s,
