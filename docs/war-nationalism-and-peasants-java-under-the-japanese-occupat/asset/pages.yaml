    heavily on cash than Javanese peasants generally did. Farmers usually did not
    buy rice. Government control over rice surplus was, therefore, comparatively easy
    in Japan and continued until the 1970s.


    The Japanese occupation authorities, as we shall presently see, attempted to control
    the distribution of rice in Java for a similar purpose and in a similar manner
    as in Japan. However, the concept of “surplus” did not really exist for the Javanese
    village because many villagers had no rice to start with. Rice was a highly marketable
    commodity which circulated in a more complex manner than in Japan. A great part
    of the harvested paddy was sold to brokers, and was partly manually pounded and
    partly machine-milled. The number of rice mills was relatively small in Java,
    but each bought large amounts of paddy from extensive areas, through networks
    of brokers. Therefore, these brokers usually came from outside the village. Harvesting
    throughout the year was a large industry monopolised by Chinese. Rice circulated
    forming many different streams: streams from the countryside to the urban centers
    passing through the hands of the brokers, manual processors, wholesalers, retailers
    and buyers; and even smaller circles passing through villagers and petty traders.


    To exert a unitary government control over this complex flow of rice “surplus”
    was impossible in Java. Occupation authorities nonetheless tried to control part
    of Java’s rice, employing the bureaucrats and the Chinese rice millers. This attempt,
    as we shall see, adversely affected the villagers’ relations with the pangreh
    praja and the Chinese rice dealers, and produced wide-spread confusion and many
    tragedies. One of the causes of the confusion was that the lowest of the bureaucracy,
    village officials, usually constituted the largest rice surplus producing in the
    village. As blackmarket prices for rice became higher than the official after
    1943, the village officials often tried to fill the quotas with other villagers’
    rice and blackmarked their own, in collusion with Chinese rice dealers. The Japanese
    chose the most suitable people as the control agents.


    The village and subdistrict officials also had to decide which villagers send
    to fill the quotas for romusha mobilisation. Villages in Java had large numbers
    of wage labourers with meagre employment opportunities. Moreover, closures or
    reduction in the activity of Dutch estates after the outbreak of the war had exacerbated
    unemployment. A large scale recruitment of labourers was not, ipso facto, a bad
    thing. We shall see in chapter 7, however, that recruitment was coercive, work
    conditions were often bad, and remittance of wages to romusha’s families was not
    carried out smoothly. Because nuclear families were predominant in Java, there
    were many households with only one or two income earners⁴⁵ Removal of one worker
    without a regular wage remittance was a serious blow for many families.'
