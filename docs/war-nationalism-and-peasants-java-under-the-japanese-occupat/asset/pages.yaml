    # The Prevailing View


    The abundant labour in Java became one of the main targets of the Japanese “Total
    Mobilisation” campaigns. The Japanese propagandised that it was everyone''s sacred
    duty to surrender all of one''s energy to support the war effort and that labourers
    were also a kind of soldier who fought by working (perajurit pekerja). For this
    reason they abolished the derogatory term, coolie; and replaced it with the supposedly
    neutral Japanese word, romusha.\¹ The occupation authorities mobilised large numbers
    of labourers for various projects associated with “Defence and Construction.”
    The recruitment of romusha was usually coercive and the work conditions were often
    extremely harsh. Many people who were mobilised, or, in Indonesian, romushan,
    died through maltreatment, disease and undernourishment. Thus the word, romusha,
    quickly came to assume a connotation worse than coolie. The romusha mobilisation,
    together with the forced paddy delivery, constituted the major factors which adversely
    affected the physical, material and psychological welfare of the peasantry of
    Java. Knowledge of the romusha issue is, however, very limited. Historians have
    conducted little research, and have argued among similar lines.\² M.C. Ricklefs’
    account exemplifies the widely accepted view:


    In 1943 the Japanese ordered the recruitment of ‘economic soldiers’ romusha, primarily
    peasants drafted from their villages in Java and put to work as labourers wherever
    the Japanese needed them, as far away as Burma and Siam. It is not known how many
    men were involved, but it was probably at least 200,000 and may have been as many
    as half a million, of whom not more than 70,000 could found alive at the end of
    the war.\³


    Nugroho Notosusanto, to give another example, maintained that romusha “were employed
