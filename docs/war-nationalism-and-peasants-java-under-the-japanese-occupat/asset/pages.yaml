    # Calls for Total Mobilisation through the Nationalists


    # Japanese Expansionism versus Indonesian Nationalism


    While meddling with the bureaucratic apparatus, the Japanese launched the three
    total mobilisation campaigns, beginning in March 1942 and continuing at one year
    intervals: the Triple A Movement (Pergerakan Tiga A), Putera (Pusat Tenaga Rakyat,
    or Concentration of the People’s Energy), and Jawa Hokokai (Java Public Service
    Association). The first two campaigns were, at least ostensibly, led by Indonesian
    nationalists while the last was directly headed by the Japanese. Indonesian nationalism
    and Japanese expansionism were driven by essentially different motivations but
    both opposed Western imperialism, and thus could find common ground for cooperation.
    The Japanese thought that they could use the anticonialism of the Indonesian nationalists
