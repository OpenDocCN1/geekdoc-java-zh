    # The Aim and the Result


    The aims of the labour mobilisation were summarised as “Defence and Construction”
    but we have seen that the “defence” projects carried out by the Army and the Navy
    took less than fifteen per cent of the mobilised labour; the rest was employed
    by the military administration for various construction projects. The rationale
    of the “New Construction” was threefold: to construct Java as a part of the resourceful
    East Asia Co-Prosperity Sphere; to prepare Java as the main supply base in the
    Southwest Pacific theatre of war;¹¹³ and to establish self-sufficiency in rice,
    cotton, castor-oil, coal and contain other items. The military administration
    embarked on the ambitious project of agricultural production increase by extending
    irrigation and drainage systems, clearing forests and wild land, and converting
    land from non-agricultural to agricultural purposes.¹¹¹⁴


    This project was not an isolated experiment in Japanese history. The Japanese
    empire had a similar experience in Taiwan, Korea and Manchukuo. Particularly in
    Taiwan, the Japanese continuously endeavoured to increase agricultural production
    and obtained a remarkable result. Between 1900 and 1940 the area of cereal crop
    in the whole of Java was extended by 76 per cent and production increased by 337
    per cent. For this reason the economists, Carr and Myers, argue that Japan and
    Taiwan have been the only two Asian countries to experience an agricultural revolution
    in the middle of the twentieth century.¹¹¹⁵ The Japanese attempt at agricultural
    production increase in Java needs to be understood in this historical context.


    The project in Java was carried out under the pressing atmosphere of the war.
    For this reason the Japanese attempt was more hasty and drastic in any of the
    other annexed territories. Both the Jakarta authorities and the Residencies formulated
    policies. The newspapers and journals continuously reported these projects, but
    information on concrete plans was classified and policy detail is therefore hard
