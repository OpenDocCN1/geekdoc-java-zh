    # The Method of Recruitment


    Before late 1943 the Japanese recruited unskilled romusha through the local pangreh
    praja on an ad hoc basis, and advertised for skilled workers through the newspapers,
    the radio, and by other means. After the establishment of the network of recruitment
    agencies, the Japanese adopted a system which was similar to that used to regulate
    the delivery of rice. The mobilisation plans were centrally formulated and quotas
    sent down to village heads through the bureaucratic channels. The figure of those
    in the employ of the Japanese in November 1944 on a temporary basis was 938,929,
    including the unpaid labour service; this was 7.5 per cent of "mobilisable work
    force."


    The introduction of this system did not guarantee the immediate commencement of
    efficient recruitment. Co-ordination between Jakarta, the Residencies, and the
    pangreh praja in the recruitment agencies was weak. Shortage of staff at local
    offices was always a problem. There was considerable confusion concerning the
    registration, recruitment, dispatch of romusha, and the provision of food and
    drink for them.37 Also quotes came from above without an adequate appreciation
    of the labour situation in the villages. For instance, an Indonesian adviser to
    the Japanese authorities reported that several women from Kulon Progo, Yogyakarta,
    went to the principality office to lodge a petition seeking male workers for village
    agriculture because so many men from their village had been sent out as romusha
    that there was a great shortage of male workers.38


