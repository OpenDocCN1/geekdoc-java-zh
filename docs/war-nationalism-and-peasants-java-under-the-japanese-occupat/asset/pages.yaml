    In August 1942 the Transport Bureau began, with the assistance of local guides
    and four Dutch engineers, a land survey for the railway to connect Bayah to Saketi.
    After the quick provisional land survey, the military administration officially
    ordered, in October 1942, the commencement of a railway covering the distance
    of 120 kilometres. Some preparatory work such as construction of offices, warehouses,
    bunkhouses, and roads lasted a few months, and the initial land work began in
    the middle of February 1943. The Japanese Ministry of Railways sent 53 railway
    engineers in June 1943, and soon after full-scale construction began.^{140}


    There were a number of difficulties with the construction. The area was a sparsely
    populated out-of-the-place, covered with jungles, swamps, and mountains, infested
    with predators such as tigers, crocodiles, venom snakes and scorpions, and also
    rife with endemic diseases. Moreover, skilled workers and equipment for railway
    construction were almost totally lacking in Java. Under the Netherlands Indies
    administration, the existing railway system in Java had, and been, finished by
    the first decade of the twentieth century, and the equipment, engineers, and experienced
    workers for railway construction concentrated in Sumatra.^{141} A dearth of certain
    materials also proved a serious problem. Cement, for example, was unattainable
    or pulverised bricks *semen merah* (red) cement had to be used.^{142}


    Construction was estimated to require approximately ten years under normal circumstances,
    including three years of land survey. Yet, the opening of the railway was scheduled
    for 1 April 1944, and the opening ceremony actually took place on that date.^{143}
    The Japanese staff involved proudly described it as an extraordinary feat achieved
    under adverse circumstances.^{144}


    To complete the railway as soon as possible, working along the entire route commenced
    between 25,000 and 55,000 labourers daily.^{145} During the rainy season, land
    slides were frequent, and 49 per of the total length suffered from slides. In
    eight places slides occurred repeatedly due to the lack of proper equipment and
    material to stop them, and at four of these places the route had to be changed.


    Unlike the Bayah Mines, for which labour was recruited exclusively from Central
    and East Java,^{146} labour for the railway construction was recruited mainly
