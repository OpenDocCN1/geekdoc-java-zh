    # Shipbuilding in Central Java


    Marine transport was a vital issue during the war. Before the war shipping companies
    of various nationalities operated on the international sea routes to and from
    the Netherlands Indies. Japan’s share of the shipping traffic between the Netherlands
    Indies and other countries was eight per cent in net tonnage in 1940, while about
    half was taken by the Allied countries such as the Netherlands (not including
    the Netherlands Indies) and the United Kingdom.¹163 Most of the ships owned by
    the Allied countries had fled the area before the Japanese attack. Trans-shipment
    of resources from the occupied Southern Regions to Japan was urgently needed,
    but the shipping Japan could mobilise strictly limited. The Japanese needed to
    employ all available steam and motor ships for long distance navigation, so they
    planned to build sailing ships with auxiliary engines for short distance transport.
    In December 1942, Tokyo officially ordered the Southern Regions General Army to
    replace all its ships with locally built wooden boats, except for those which
    could return to Japan for repairs.¹164


    Immediately after the occupation, the Sixteenth Army banned unauthorised inter-island
    trade and passage of people and monopolised inter-island transport.¹165 To achieve
    the maximum mobilisation of ships, it also ordered that all ships with a capacity
    of five tonnes and over, including barges, be registered.¹166


