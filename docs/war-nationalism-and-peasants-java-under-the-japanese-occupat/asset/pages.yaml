  md: '# Tumut Village, Central Java³²


    Tumut village was located 11 kilometres west of the city of Yogyakarta, on a fertile,
    well irrigated coastal plain along the Brogo River. Between 1912 and 1914 irrigation
    channels were cut, funded by the sugar estate in the region, which enabled double
    cropping of rice (Figure 5.2). In Java as a whole, double cropping of rice was
    not common in 1942. In Yogyakarta Principality, the area planted with rice during
    the dry season was no more than 18 per cent of the area under rice during the
    wet season. Double cropping in Tumut not only increased rice production, but the
    rice grown in the dry season fetched high prices due to the strong demand from
    single cropping areas. Therefore the villagers in Tumut reserved large portions
    of the wet crop for their domestic consumption and sold most of their dry season
    crop. Rice carriers carried dry season crop from Tumut to as far as Magelang.
    Improved irrigation, however, also meant significant limitations on the villagers''
    rights over the land because sizable portions to it were leased to the sugar estate
    by virtue of a contract between the estate owner and the Sultan.


    Tumut village consisted of 8 hamlets, 345 households, and 1,719 people. The total
    area of sawah was 112.428 hectares, of housing sites and house gardens 53.697
    hectares, and of that fields 0.495 hectares. All the land belonged in theory to
    the Sultan, but in practice there were diverse forms of landholding (Table 5.10).


    In total half of the sawah in the village was leased to the sugar estate in alternate
    years. By leasing the land the Sultan received a much higher rent than the land
    taxes he could collect from the villagers. When the leased land was not under
    sugar, the estate sublet it to the villagers for rice cultivation. The farmers
    had to pay the estate 50 per cent of the crop of the paddy they harvested on the
    land, as well as some small amounts of money; 71 households grew rice under this
    subcontract. 27 per cent of the sawah was individually occupied and 17.5 per cent


