    respectively in the southern half, while they were 25 per and 75 per respectively
    in the northern half. Reflecting this environmental difference, the composition
    of the peasantry''s staple foods also differed; it was a mixture of 60 cent of
    rice and 40 cent of maize in the southern half while the ratio was the exact reverse
    in the northern half (Table 5.9). The predominant cycle of rice cultivation in
    the southern part of Karangloro produced three crops every two years. Of the 182
    sawah-holding households in Tasikmadu, 124 adopted this pattern; 14 households
    raised one rice crop in the wet season and during the dry season planted the fields
    in maize, peanuts, and sweet potatoes; and 44 farmers adopted a more diversified
    pattern (Figure 5.1).


    Tasikmadu consisted of 5 hamlets, 443 households, and 1,766 inhabitants. All 14
    households drew income from agriculture. The total land area was 226.4 hectares,
    of which 87 per cent was sawah (an average of 0.46 hectares of sawah per agricultural
    household). During the wet season, 95.2 per cent of the sawah was planted with
    rice and the remaining 4.8 per cent with native sugar. The village land consisted
    of three main categories: communal land (69.4 per cent), individually owned land
    (28.2 per cent), and public property such as roads, cemeteries, and a school site
    (2.4 per cent). The communal land was all sawah which had been portioned out to
    villagers in 1854, and after that inherited by the descendants of the occupants.
    Renting and hiring of the allocated land was allowed, but inheritance by subdivision
    was not; buying and selling required the special permission of the Resident. If
    no inheritor, the land was returned to the village, and it was reallocated by
    the village council to one of the villagers who occupied no communal land. There
    was anwritten but clear priority list for this kind of allocation. Part of the
    communal land (5.4 per cent) was set aside for village officials The free officers
    occupied the land as long as they stayed in office, and the official land was
    not allowed to be inherited or sold, but letting and hiring of it was permitted.


    The holders of individually owned land could sell or subdivide this land as they
    wished. These lands were usually subdivided and were inherited generation after
    generation. In many cases, they had already been subdivided into such small pieces
    that further subdivision was impracticable. In that case one inheritor was chosen,
    and the other members of the family received small amounts of cash from the inheritance.
    If the inheritor did not have enough money to pay, as often happened, he had to
    rent out or sell the land in order to pay the other family members who inherited
    no land. Thus the whole family becameless.


