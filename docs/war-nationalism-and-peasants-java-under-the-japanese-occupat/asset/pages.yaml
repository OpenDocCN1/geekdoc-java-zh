    The fact that Java was ruled by foreign enemies magnified, and added an extra
    dimension to, these problems. Because of ignorance and inexperience on the part
    of the Japanese their laws and regulations often proved grossly inappropriate
    for the situation in Java, causing administrative and social disorder. The occupation
    authorities had to modify their regulations frequently and as a consequence, the
    people of Java were more readily strangled and more willing to violate regulations.


    Estrangement between ruler and ruled usually took subtle forms and open conflict
    was infrequent. The elite groups were, at least ostensibly, cooperative with the
    Japanese. This cooperation was, however, very superficial. The basic reason was
    that the Japanese, the Indonesian nationalists, the Muslims and the pangreh praja,
    had very different ulterior ends. These groups, to use the Chinese simile, shared
    the same bed but not the same dream. The ultimate purpose of the Japanese military
