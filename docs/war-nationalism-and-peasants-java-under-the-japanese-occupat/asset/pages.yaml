  md: '# xii


    # FOREWORD


    I visited many libraries and archives in a number of countries. The staff members
    of these institutions were co-operative, friendly, and efficient, contributing
    to making my period of research pleasant. In Japan, I am particularly grateful
    to the following people: Goto Ken''ichi, Kojiya Keijiro, Hagiwara Toshio, Isoaki
    Tadao, Kurasawa Aiko and Nakamura Mitsuo. In the Netherlands Laslo Sliumers kept
    encouraging me through correspondence, and Heather Sutherland and Peter Post introduced
    me to the archives and libraries. In Java, many Indonesians, including former
    whoered me hospitality and related their experiences in Indonesia during the occupation.
    I should like to record my particular thanks to the following individuals and
    their families: Asmuji in Cimanggis, Suning, Bustami H. Itami and Sudomo Onodera
    in Jakarta, Suprarto in Semarang, the late Triminto in Madiun, Akhmad Driyono
    and Sutanjo in Surabaya, Abdul Bakri in Malang, Ibu Arief Nakajima in Batu, Abdul
    Rasid Tanaka in Kalulang, Dwharjo in Sumberpucin, Yoneda Yoshida in Cilacap, Joel
    Zakarias in Salatiga, the late Sarimin Reksodiharjo in Purwokerto, Ibu Urip in
    Pangandarang, and Sukamoto and Hasan Morikage in Bandung.


    Most of all, I thank my friend, critic and wife, Yip Roe Jane, for her she was
    busy with her own research on heart physiology, she read parts of the drafts and
    always listened to my talk on peasants and the war patiently, attentively and
    understanding. I regret that I was not always able to listen to her enthusiastic
    talk on her research as attentively and understanding as she did to mine. Only
    after the completion of my thesis did I gradually come to realise that this imbalance
    in communication was causing severe stress on her. I sincerely apologise.


    After expressing my debt of gratitude and apology to all these people, however,
    I should like to dedicate this work to the numerous Indonesians who suffered and
    died under Japanese rule.'
