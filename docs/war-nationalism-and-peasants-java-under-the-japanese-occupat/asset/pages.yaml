    # Preparation for a New People''s Movement


    After the nationalists'' exalted expectations of forming their own government
    in March 1942, the ban on all political activities caused great frustration among
    Indonesian nationalists, particularly those who were not included in the Triple
    A Movement. Their primary concern was the future political status of Indonesia,
    about which the Japanese refused to make any commitment in the early stages of
    the occupation. The nationalists pestered the Japanese authorities and tried to
    obtain some clarification of the issue.75 After Sukarno''s return, the nationalists''
    restlessness intensified, and the Japanese military administration came to apprehend
    that a continuation of the ban on political activities might provoke the nationalists
    into underground activities.76 The Japanese believed it was safer to let the nationalists
    do something and then control them. Moreover, the Japanese regarded Java as a
    potentially important logistics base in the Southwestern Pacific theatre and therefore
    it was important to secure the willing cooperation of the people of Java.


    Partly to secure the Indonesians'' cooperation, and partly to relieve the smouldering
    discontent among the nationalists, the military administration created two institutions.
    First they established a consultative body called the Committee to Investigate
    Customs and Institutions (Kyukan Seido Chosa Inkai) and then began preparing a
    new people''s movement, launched in March 1943 under the name of Putera.


    The Committee to Investigate Customs and Institutions consisted of ten leading
    Indonesian figures, from politics (Sutarjo, Mohammad Hatta, Sukarno), religion
    (Mas Mansur, Wondoamiseno, Husein Jayadinrating), education (Todung Gung Mulia,
    Purbocaroko, Ki Hajar Dewantara), and law (Supomo), and fourteen Japanese representatives
    from the military administration.77 This institution provided a formal liaison
    between representative Indonesian intellectuals and the Japanese administrative
    staff. Meetings were held three times a month, and thus the Indonesians could
    give vent to the smouldering grievance."78 and the Japanese could improve their
