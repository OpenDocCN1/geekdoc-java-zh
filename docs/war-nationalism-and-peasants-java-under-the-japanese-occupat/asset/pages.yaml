    non-villagers in kind, and the portion for seed, amounted to a total of 13 per
    cent of the harvest. The remaining 32 per cent was the net surplus from the village.
    This surplus did not mean the remnant after consumption and other needs; it meant
    the balance between the amount taken out from the village and the amount villagers
