    After the Japanese attack, the import of coal stopped. In the early months of
    the occupation, the State Railway (S.S.) in Java was still run by Dutch and Indonesian
    personnel, although many railway bridges had been destroyed by the Dutch scorched-earth
    strategy and some Dutch staff had left their jobs. On 1 June 1942 the military
    administration created the General Land Transport Bureau (Rikuyu Sokyoku) and
    charged it with controlling the main means of land transport such as railways,
    buses, trucks, cars, and becan. When the Bureau took over the administration of
    the State Railway as well as the twelve private railway companies which existed
    in Java, the Superintendent of the State Railway, Ader, reported to the Japanese
    that the stocks of fuels were running short and were sufficient for no more than
    ten days'' consumption.¹135


    Before the war, steam locomotives in Java were fuelled with teak in flat areas
    and coal in sloping areas. The ratio was approximately 40 per cent teak and 60
    per cent coal.¹136 Naturally the solution to the fuel issue was to use teak for
    the time and recommence the import of coal as soon as possible. In the prewar
    period the railways consumed 300,000 tonnes of teak per annum. The Bureau calculated
    that 450,000 tonnes of teak were necessary between July and December 1942,¹137
    and immediately dispatched staff to Central and East Java to enquire into the
    possibility of recommending coal imports. Meanwhile, in August, it sent two members
    to Sumatra to enquire. They investigated the conditions of the coal mines, the
    ports and stevedoring in Sumatra, the Seventteenth Army submitted to the Southern
    Regions General Army Headquarters to request coal import from Sumatra to Java.¹138
    Imports were recommenced soon after but the amount had to well below the prewar
    level. In the prewar years, Java imported annually about 800,000 tonnes while
    during the occupation the quantities of coal imports were 150,000 tonnes in 1942,
    200,000 tonnes in 1943, 120,000 tonnes in 1944 and 40,000 tonnes in 1945.¹139


    In July 1942, the military administration in Java began investigating an alternative
    solution to the problem, the establishment of "local self-sufficiency,"¹140 They
    calculated that production of 300,000 tonnes per annum was possible and decided
    to develop mines immediately. At the same time they planned to halve coal consumption
    from prewar levels, the breakdown of reductions being: the railways 230,000 tonnes,
    gas production 80,000 tonnes, industry 14,000 tonnes, and others 3,000 tonnes;
    in total 407,000 tonnes. Imports were expected to be 200,000 tonnes from Sumatra
    and 6,000 tonnes from Borneo. The Bayah mines were expected to be ready by the
    end of March 1944.'
