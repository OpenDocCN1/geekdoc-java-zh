  md: '# Notes


    # Notes to Foreword


    +   1. The subtitles of the following two theses are indicative of this predominant
    historiography: George Sanford specialists, ''The Japanese Occupation of Indonesia:
    Prelude to Independence,'' PhD thesis, Cornell University, 1967 and Rodney de
    Bruijn, ''Indonesië: De Laatste Etappe naar de Vrijheid 1942–1945,'' proeft, Universiteit
    van Amsterdam, 1982.

    2. The existence of Harry J. Benda’s book, *The Crescent and the Rising Sun*,
    might give some Indonesia specialists the impression that Islamic leaders played
    important roles in the Japanese mass mobilisation policies. This impression is
    not correct. Benda analysed the significance of the occupation for the Indonesian
    elite played in the other way round. The role the Islamic elite played in the
    military administration was indeed very restricted. Benda’s book has a number
    of flaws. He often interpreted the events during the occupation ‘in the light
    of later developments.’ Consequently he discussed the relations of the Islamic
    elite with nationalist intellectuals and the bureaucrats as if these three groups
    were contending during the occupation in a similar manner as they did in the 1950s.
    He based his analysis on very restricted sources and the wrong premise that the
    Japanese intentionally adopted the policy of “divide and rule” in order to manipulate
    the Indonesian elites. As acknowledged p. 275, Benda derived this from the Dutch
    Islamic specialist C.A.O. van Nieuhuize rather than his own analysis. There is
    little evidence to support this primate that the Japanese divided the Netherlands
    geographically into three major parts and ruled them as units (The Sixth Army
    ruled Java, the Twenty-Fifth Army Sumatra, and the Navy of the Outer Islands).
    Contrary to Benda’s premise, “unite and mobilise” was, as we shall see, the predominant
    theme of the Japanese policy within Java throughout the occupation. The relationship
    between the Islamic elite and the ordinary people is also very obscure in Benda’s
    book. He simply regarded the peasants as obedient followers of the Islamic leaders,
    constituting a potential “electorate”. See Harry J. Benda, *The Crescent and the
    Rising Sun: Indonesian Islam under the Japanese Occupation 1942–1945*, The Hague,
    1958, p. 156, 170–79, 199, 275 and 289.


