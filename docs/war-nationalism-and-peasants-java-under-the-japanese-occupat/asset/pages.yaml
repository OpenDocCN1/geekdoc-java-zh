    was fundamentally wrong with the military administration.


    Such was the impact of the war and the occupation. How should we assess this period?
    I have brought some light to the nature of Japanese oppression. This light revealed
    one of many aspects of the event. depicted Javanese peasants, primarily, as passive
    victims. They were indeed victims, but we should never forget that they were also
    actors; they interpreted the world in their own way and regulated their actions
    accordingly. I have shown, as all historians do, what happened and why happened.
    Now we must ask a further question: what did it mean to the people? Historians
    have argued that the people’s anger against the Japanese regime constituted the
    driving force behind the social upheaval in Java in the years following the Japanese
    surrender. Our knowledge of this social upheaval, its causes, processes, effects,
    and the exact magnitude is, however, still rather obscure. How widespread was
    “social revolution”? Who fought it? Why did they fight? How did they fight? Did
    the Japanese occupation revolutionise the villagers, or were they mostly silent
    victims? In many places after the Japanese surrender villagers attacked the pangreh
    praja, and the pangreh praja decided to assume, officially,'
  merge: -1
  pgno: 226
- img_proc: true
  md: the supposedly less authoritarian name, pamong praja. Did this change in the
    name (from “the ruler of the realm” to “the tutor of the realm”) mean a change
    in the reality of the situation? Providing answers to these questions requires
    closer investigation into the social, economic and political situation at the
    village level of both the war, and post-war periods. This kind of investigation
    requires extended periods of fieldwork, and in the past few years some studies
    based on such fieldwork have been published.³ These studies have significantly
    improved our understanding of the social dynamics of Java’s countryside during
    the occupation remains largely unexplored. The Japanese introduced a number of
    social organisations such as the youth corps, vigilance corps, women’s associations,
    and neighbourhood associations. They also carried out military and other training.
    How did the organisations and training affect villagers’ daily life, social relations,
    power structure, and their perception of the world and their position in it? My
    initial project, investigation of these questions, was frustrated due to restricted
    access to the field. Therefore, a holistic understanding of the social dynamics
    in Java during the “three periods” still remains to be written.
