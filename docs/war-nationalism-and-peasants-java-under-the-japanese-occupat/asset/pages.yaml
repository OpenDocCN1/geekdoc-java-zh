    a study of the village setting serves two other major purposes. One is to elucidate
    Japanese maladministration. Although this chapter does not directly deal with
    occupation policies and practices, it will, in conjunction with the following
    chapters, reveal that the occupation modelled after those in wartime Japan were
    highly inappropriate for Java with its different socio-economic setting. Javanese
    peasants and their'
