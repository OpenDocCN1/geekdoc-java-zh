    and conducted three mass organisation campaigns at one year intervals. All these
    attempts failed, and contrary to Japanese intention, the campaigns estranged the
    groups from each other. Relations between the pangreh praja and the peasantry,
    and between the pangreh praja and the nationalists, which had never been very
    good, worsened conspicuously during the occupation. Even the relationship between
