    # The Construction of the Neyama Tunnel in East Java


    Neyama is the name of a ridge in the small mountain range along the South Coast
    of East Java, in Kediri. The ridge is 170 metres above sea level, 10 kilometres
    south of the city of Tulungagung, and about 30 kilometres southwest of the city
    of Blitar. This small mountain is now a tourist attraction because of the beautiful
    scenery and the drainage tunnel which goes through the mountain. This tunnel,
    known as Terow Neyama, was built between 1959 and 1961 as part of the Brantas
    River General Development Program undertaken by the Indonesian Ministry of Public
    Works and Power. The actual construction was carried out by two Japanese construction
    companies, Nippon Koei, and Kashima Ketsu, and the budget was taken from the war
    reparation that Japan paid to the Indonesian government. The tunnel is 940 metres
    in length and 7 metres in diameter, draining 500 cubic metres of water per hour
    on average, and at peak flow, up to 500 cubic metres per second into the Indian
    Ocean.¹191


    The Brantas River, 314 kilometres long, is the second longest in Java after the
    Solo River. Its main tributaries run from the central volcanic highland in East
