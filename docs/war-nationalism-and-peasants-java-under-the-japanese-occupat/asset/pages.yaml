    # Spread of the Movement


    In his radio address on 21 April, Samsudin urged listeners all over Java to create
    committees to prepare local branches of the Triple A Movement in their respective
    regions so that on 29 April these committees could, apart from celebrating the
    Japanese emperor''s birthday, stir up the *semangat* (spirit) of the Triple A
    Movement.42 By early June 1942, committees had been created in fifty-eight out
    of seventy-nine Regencies, and enquiries concerning creation of new branches kept
    coming to the managerial board in Jakarta.43 Although the movement was spreading
    quickly, and in some cases enthusiastically, no statutes or rules of the Movement
    had been prepared. The reason Samsudin gave for this lack of adequate preparation
    was that the Triple A Movement was meant to function as the intermediary between
    the occupation government and the people, but the Army was still in the course
    of preparing its administrative structure. For this reason, the Movement could
    not yet assume a definite form.44 Samsudin hoped to establish a formal constitution
    for the Movement (by enlisting the cooperation of Indonesian law specialists)
    as the administrative structure of the occupation government took a definitive
    form.45 Nevertheless, on 18 and 20 of June Samsudin produced two documents which
    stipulated the ideas and the structure of the Movement.46


    Reflecting the indecisive nature of the movement awaiting the formation of the
    occupation government, the local branches were called *Persiapan Cabang Pergerakan
    “Tiga A”* (Preparatory Branches of the “Triple A”) Movement. These branches, however,
    meant to be more than preparatory committees. The executive board of each preparatory
    branch had to have a minimum of twenty-eight members, consisting of the chairperson,
    vice-chairperson, secretary, treasurer, a minimum of three general assistants,
    and one head and two sub-heads of each of seven sections, namely, economic affairs,
    social welfare, youth and sports, education, propaganda, religious affairs, and
    women''s affairs. Each section within the local branches was required to organise
    people in order to work in their respective field. The economic affairs section,
    for example, had to unite, federate, or coordinate all existing organisations
    in the region, such as trading, agricultural, and manufacturing organisations,
    in order to effect the ultimate objective of the movement, namely, co-prosperity.
    By the same token, youth and sports, education, religious affairs, and women''s
    affairs sections had to federate or coordinate existing organisations in their
    respective fields into various corporate bodies called federasi, ikatan, gabungan,
    dan koperasi, and in regions where organisations such as a housewives'' association
    did not exist, to create them.47


    The managerial board in Jakarta encouraged the preparatory branches to establish
    sub-branches at the subdistrict level with the same structure as the preparatory
    branch. Below these sub-branches, village chiefs led'
