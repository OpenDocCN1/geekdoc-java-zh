  md: 'The Japanese occupation was a decisive episode in Indonesian history. For Indonesian
    nationalists it was an opportunity to advance their cause; for many others, particularly
    peasants, meant hardship and often death due to an unprecedented level of oppression
    by the Japanese.


    Such has been the widely accepted view. The author of War, Nationalism and Peasants,
    argues that we have not really understood what war and occupation meant for the
    people of Indonesia. Focusing on events in Java, Shigeru Sato explores the enormous
    human dramas which cannot be explained simply in terms of nationalism and fascism.
    He addresses the totality of Indonesian society: from high politics to the daily
    lives of landless peasants; from the details of local administration in Java to
    the intellectual climate in Japan influencing the Japanese rulers.


    Synthesizing a wide range of source materials both official and non-official,
    written and oral, War, Nationalism and Peasants presents with striking originality
    a coherent and comprehensive interpretation of the Japanese occupation of Java.
    It concludes that the fundamental cause of the Indonesian people''s suffering
    was Japanese misrule through ignorance and incompetence, leading to widespread
    administrative, social and economic disarray.


    This study will be invaluable for students of Asian and Indonesian history who
    seek to understand what World War II meant for people in areas invaded by the
    Japanese. It also provides new insights into the sequences of foreign interferences,
    which are increasingly relevant modern world.'
