  md: '# Foreword


    During the Second World War the Japanese military occupied most parts of the Netherlands
    Indies. If history has watersheds, this period certainly constitutes a major one
    in Indonesian history. Historians have pointed out that the Japanese occupation
    brought about many important political changes: it removed the Dutch colonial
    authorities; the Indonesian nationalists consolidated their political leadership;
    the Japanese promised to grant independence to Indonesia and its preparation was
    almost completed by the end of the occupation; the indigenous defence forces were
    created; the consolidation of Islamic groups progressed to a significant extent;
    and groups of politicised youths emerged. These factors made positive contributions
    to achieving independence and shaping political developments thereafter. Making
    a sharp contrast, however, the occupation caused severe suffering and misery to
    the people in Java. Brutal oppression by the Kenpeitai (Japanese military police),
    coercive recruitment and maltreatment of romusha (labourers), and the forced delivery
    of rice to the military administration were among the most notorious events. The
    abrupt curtailment of international and inter-island trade also caused severe
    shortages of certain commodities such as textiles, which became so severe that
    a considerable proportion of the people had to live in rags or even stark naked.


    The existing literature presents these two aspects as they constituted two separate
    issues. Historians have scrutinised the political events primarily because of
    the significance for the following era, while they paid relatively little attention
    to the humanitarian issues which directly affected those who had to live and die
    during that particular period. When attempts were made to bridge the two aspects,
    they were usually done by questioning who were collaborators of the brutal regime
    (Sukarno?) and who stroved for the political goal in defiance of the Japanese
    (Syahrir?).'
  merge: -1
  pgno: 10
- img_proc: true
  md: '# viii FOREWORD


    Alternatively who were oppressive imperialists (Kenpeitai?) and who were sympathetic
    towards the independence of Indonesia (Maeda)? Initially I hoped to integrate
    the two aspects more tightly with a view to obtaining a holistic understanding
    of social dynamics, the occupation and politics meant for the majority of the
    people and how their experience and behaviour contributed to the shaping of social
    and political changes in the following era. For this purpose I planned to conduct
    interviews in rural Java to investigate how the occupation altered the social
    order and economic situation in Javanese villages and how it affected villagers''
    political consciousness and behaviour, which were in their turn conducive to the
    social and political upheavals in the following era. In June and July 1986 I made
    a short preliminary visit to Java, during which I had an opportunity to meet a
    retired Indonesian government official, Sarimin Reksodiharijo. At his residence
    in a quiet suburb of Purwokerto, Central Java, he related his personal experience
    as follows:


    In the 1930s he was a great fan of Japanese goods and invariably friendly Japanese
    traders. He always had his hair cut by a Japanese barber. In 1941 most Japanese
    traders were repatriated and the year Japanese soldiers came. The three and half
    years of Japanese occupation were a nightmare. The Japanese forced farmers to
    surrender enormous amounts of rice, causing many deaths from starvation. The Japanese
    also forcibly mobilised many millions of people as romusha and sent them overseas.
    Many never returned. Sarimin could not understand why Japanese so gentle and friendly
    before the war could behave so cruelly during the war. However, all the Japanese
    individuals he was closely associated with, including the Kenpeit chief in Pekalongan
    Residency, were pleasant and friendly and paid much attention to humanitarian
    issues. After the war, between 1951 and 1952, Sarimin went to Japan as an Indonesian
    delegate for the negotiation of war reparations. On this occasion he met his old
    Japanese associates. The Japanese received him warmly but Sarimin discovered during
    the negotiation that the Japanese did not have any sense of guilt over what they
    had done in Indonesia during the war and therefore had no intention of repairing
    the enormous damage they had inflicted upon Indonesians. On this point, Sarimin
    again emphasised, with an inquisitive look at me, that he could never understand
    the Japanese.


    The content of Sarimin''s talk was not new to me. I had read many similar accounts
    in books, articles and theses. Nevertheless, I could not give any satisfactory
    answer to Pak Sarimin''s question as to why the Japanese could be so cruel and
    not feel guilty about it. I promised him that I would find the answer through
    my research. Some time after my return from Java, the Indonesian authorities informed
    me that they had rejected my application to conduct interviews in Java. This rejection
    compelled me to modify my research plan to a considerable extent. Close'
  merge: -1
