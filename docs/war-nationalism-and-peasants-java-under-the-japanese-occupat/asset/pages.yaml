  md: '# 268 NOTES to PP. 202–204


    in such villages. The Japanese capitals issued orders and the pangreh below them,
    including Sarimin himself, had to implement these orders in the countryside. The
    basic cause of the tragedy was lack of communication. As we have seen, despite
    the heavy propaganda effort, communication was so poor that no Indonesian understood
    the purpose of the Japanese economic policies. As a consequence, Indonesian intellectuals,
    and by large, supported these harmful policies. Even Prawoto, who inspected Indramayu
    after the rebellions, does not seem to understand the real cause.


    # Notes to Afterword


    +   1. Higashikuni''s talk at a press conference on 28 August 1945. Reported in
    Jawashinbun, 31 August 1945.

    2. On 27 April 1942, the Japanese authorities in Yogyakarta set official prices
    for live-stock according to weight. Prices fluctuated in spite of this regulation.
    The Japanese later discovered that their regulation was impracticable because
    the market places in Yogyakarta had no scales large enough to weigh oxen. Thus
    the newly appointed Secretary-General modified the regulation on 1 August 1942
    (Kan Po, no. 1, p. 28). This was a small but typical example of Japanese regulations.
    Many of the regulations published in Kan Po were partial modifications of previous
    ones.

    3. Frederick, Visions and Heat, 1989; Lucas, One Soul One struggle, 1991; and
