    # Some Salient Features


    Making generalisations about the socio-economic situation of rural Java is notoriously
    difficult. Even within rice-growing villages there were diverse modes of living.
    There were, however, some salient features which are relevant for this study.
    The following four points are particularly important: first, the existence of
    a large landless class within agrarian villages; second, the great importance
    of cash for the village economy and the high degree of commoditization of land
    and its produce; third, the concentration of wealth among village officials; and
    fourth, the presence and activities of Chinese rice dealers (brokers, millers
    and shop owners) in certain villages. These four features were interrelated and
    produced the social fabric of village communities. The existence of a large landless
    peasantry meant that even within the villages where most villagers were engaged
    in rice cultivation, large proportions of the village population received practically
    nothing but money and thus had to buy rice from the local market. Many landed
    farmers also sold the greater part of their harvest without leaving sufficient
    rice for their own consumption. Villagers were, therefore, heavily dependent on
    the market, in terms of both income and expenditure.


