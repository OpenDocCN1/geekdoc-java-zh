    Indonesia selama Pendudukan Jepang). The Ministry of Defense and the Koninklijke
    Macht series of NEFIS intelligence reports in English and Dutch. The materials
    held at the Algemeen Archief were produced primarily after the Japanese surrender
    thus their relevance to the Japanese occupation is, with some important exceptions
    as the Pawrot Report, generally indeed. Waseda University holds Japanese primary
    sources from Nishima Shigetada collected for writing Indonesia ni okeru Nippon
    Gu no Kenkyo (The Nishijima Collection: Materials on the Japanese Military Administration
    in Indonesia). The Institute of Developing Economies holds the materials that
    Kishi Koichi collected for the same purpose as well as his interests (''Kishi
    Koichi Shiriyo Mokoruku''). The Defence Agency in Tokyo holds a wide range of
    materials regarding the military administration in the Southern Regions. A list
    of the materials is held in Nanpo no Gunsei, vol. 2, 53–47. Iwasaki in the Defence
    Agency. The National Debt Library also holds some Japanese manuscripts and published
    items ''Jawa ni okeru Saikin no Beikoku Joshi; Sekidho, Unabara, Jawashurbin and
    Jawa Rikuyu Sokoku Shi. A group of Japanese academics are currently compiling
    Japanese source materials concerning the Japanese military administration in Indonesia
    for publication. Rights holds numerous propaganda and news films that the Japanese
    produced in Japan. Griffith University also holds two excellent propaganda films
    Asia Raya (showing the strength of the Japanese Army) and Indonesia Raya (designed
    to stir up spirit for Indonesian independence, with the national anthem as the
    theme song).


