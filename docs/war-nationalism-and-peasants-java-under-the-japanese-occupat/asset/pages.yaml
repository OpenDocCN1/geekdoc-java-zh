- img_proc: true
  md: '# FOREWORD


    investigation into village politics and so on was no longer possible. Therefore
    the thrust of my study came to focus on the impact of the occupation on the economic
    and physical welfare of the peasantry of Java relying primarily upon archives,
    personal collections, and libraries in Indonesia, Japan, the Netherlands, Australia,
    and the United States.


    I soon discovered that there were many glaring contradictions in the existing
    accounts. For example, some writers have argued that the Javanese took 70 or 80
    per cent of the total rice produced in Java. Evidently, however, the Japanese
    took no rice from Java to Japan during the war. The Japanese population in Java
    was usually less than 0.1 per cent of Java’s population, and the entire Japanese
    population in the whole of Southeast Asia and the Southwest Pacific theatre never
    reached two per cent of it. Therefore a question arose: Why did the Japanese demand
    so much rice, and what did they do with it? Concerning the romusha system, there
    are accounts that the labour mobilisation by the Japanese was so enormous that
    in many villages almost all-bodied male workers were removed and substantial parts
    of rice fields were left unplanted. According to other studies, however, the number
    of romusha sent overseas from Java was probably half a million at most. The serious
    humanitarian plight of as many as half a million people indeed was, statistically,
    no more than one per cent of the total population in Java. Removal of that proportion
    of the work from the reportedly “over-populated” island could not have affected
    agriculture so drastically. What, in reality, had happened?


    The existing literature gives no satisfactory answer to these questions. This
    seemed to me suggest that we had not really understood what the Pacific War and
    the Japanese occupation did to the people of Java, or more broadly what these
    events meant for those in the areas invaded by the Japanese. My research began
    as a puzzle-solving exercise without clear hypotheses. As the research progressed
    I became gradually aware that it was necessary to give a satisfactory answer to
    the above questions in a broader political, social, economic and ideological context,
    comprising both Java and Japan. Thus my exercise evolved into a more systematic
    enquiry into this historical event.


    This book consists of two parts. Part I focuses on the Japanese attempt at creating
    a “total war structure” in Java with a view to enabling maximum mobilisation of
    human and natural resources for their war effort. The Japanese tried to use the
    local elite groups, particularly the bureaucrats, the nationalists and the Islamic
    leaders to this end. Of these groups, the bureaucratic elite played the most important
    and indispensable roles in the military administration and yet has received little
    attention. I therefore dedicate one chapter to how the Japanese tried to rule
    the occupied territory using these administrative corps. The nationalist elite
    has already received scrutiny by other writers. These writers'
  merge: -1
  pgno: 12
- img_proc: true
  md: '# x


    # FOREWORD


    usually analysed the significance of the Japanese occupation for the development
    of the Indonesian nationalist movements and viewed the period as the “prelude
    to independencece” or the “last stage towards freedom.” This approach has contributed
    to our knowledge of the history of Indonesian nationalism but obscured our understanding
    of what the politics meant for the people who lived in that particular time. Therefore
    I examine the role of the nationalists within the Japanese military administration
    particularly their relations with the occupation authorities and the people. The
    Japanese also considered the Islamic leaders potentially important for their military
    administration and therefore initiated reorganisation of Islamic groups and carried
    out indoctrination. Compared with the other elite groups, the role they actually
    played in the formulation and implementation of the occupation policies was particularistic
    and marginal. This book therefore discusses at length the roles of the bureaucratic
    elite and the nationalist intellectuals but only passing reference to Muslim leaders
    when they were involved in the enforcement of rice delivery.


    Since my visit to Sarimin, his question as to why the Japanese could be brutal
    and exploitative became my major concern. Indeed, if I changed my research method,
    this question could constitute the central theme of my research. In an attempt
    to fulfil my promise to Pak Sarimin, Part II examines Japanese policies regarding
    rice and investigates how these policies affected the everyday life of the people
    in Java. The roles of the Indonesian bureaucrats and nationalists were examined
    once in this part against concrete settings of rural Java. Part II, particularly
    the last two chapters, are the core of the book and contains any answer to Pak
    Sarimin’s question. Part I is a backdrop for Part II. The scope of the book is
    necessarily limited due to various restrictions, but I hope that it contributes
    in its own way to our understanding of the relations between the war, politics,
    and the people.


    The Japanese occupation was a transitional period for Indonesia in many senses.
    This poses some technical difficulties for writing. Terminology is one of them.
    Many things that had earned Dutch names in the prewar period were renamed either
    Japanese or Indonesian, some retained their Dutch names for varying periods. The
    Japanese also frequently modified the names and structures of the government institutions
    and offices. For example, the office which controlled distribution of foodstuffs
    within Java changed its name twice. In order to minimise confusion, I have called
    this office simply the Foodstuffs Management Office without indicating the corresponding
    three Japanese names. For the same reason, I have avoided using non-English words
    as much as I thought practicable. I have retained, however, a small number of
    original words for various reasons. Some examples are: particuliere landijen'
  merge: -1
  pgno: 13
- img_proc: true
  md: '# FOREWORD


    (large holdings owned as private properties by non-indigenous people), Rijst Verkoop
    Centrale (Rice Sales Centre established by the Netherlands Indies government after
    1939), romusha (drafted labourers), Jawa Hokai (Java Public Service Association),
    pangreh praja (indigenous bureaucratic elite) and Putera (Concentration of the
    People''s Energy). I have italised foreign words and put English translations
    to them when I have used them for the first time in the body of the book. Thereafter
    I have used them without italicisation or translation. The bibliography and endnotes
    many foreign language sources. Indonesian specialists usually read Indonesian,
    Dutch and some other European languages but not Japanese. To minimise clutter
    without sacrificing intelligibility I have attached translations to Japanese titles
    alone, and in endnotes only when the Japanese sources are cited for the first
    time. Non-specialists can ignore the details about foreign source material.


    Spelling of non-English words was also confusing. I have used the most recent
    spelling in the text and retained the original spelling in direct citations and
    in the references in endnotes and in the bibliography. For Japanese and Chinese
    personal names I have followed their method, that is, the family name comes first,
    followed by the given name. However, for my name on the cover page I have reversed
    the order to avoid initial confusion. For Indonesian authors who have two or more
    names I have put the last name first in the bibliography, although the last name
    is not always the surname. As a rule, I used the word “Javanese” as a geographical
    term comprising the islands of Java and Madras, and I used the term “peasantsants”
    in a broad sense, referring to the people residing in the countryside who did
    not belong to the elite or the ethnic minorities. This term includes male and
    female agriculturists, labourers, small traders, craftspeople, as well as children
    and the elderly.


    This book is based on my doctoral thesis. I am grateful to Griffith University
    for providing me with the opportunity and the financial assistance to carry out
    my study. Robert Crib, R.E. Elson, and Colin Brown supervised me at various stages.
    Anthony Reid, William H. Frederick, Anton Lucas, John Butcher, John Ingles, and
    Keith Feather read the thesis and made useful comments and corrections. In 1991
    I was a research fellow within the Department of Anthropology and Sociology, Monash
    University, the University’s Centre of Southeast Asian Studies provided me with
    an opportunity to present a seminar. On this occasion I received stimulating comments
    from a number of Indonesians, including Susan Blackburn, Herb Feith, Barbara Hatfield,
    John Legge, Ken Young, and Din and Ails Zainuddin. After I modified the thesis
    for publication, Peter Hatfield and Takatsu Tamie read the manuscript, and Diana
    Mainprint read and corrected the proofreads. I owe them all debts of gratitude.'
