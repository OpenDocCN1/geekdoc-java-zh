    Although the contents of the numerous varieties varied, they were basically of
    two kinds: orders to sell certain amounts of paddy to the designated rice-mills
    and restrictions on inter-local transmission of paddy by private hands. Such decrees
    as the ones from Jakarta, Semarang and Kudus, ordered that the sale of paddy must
    be made exclusively to designated mills and banned manual pounding for the purpose
    of sale. This meant that the local authorities attempted to control the entire
    surplus. This kind of order was possible only in the areas which had sufficiently
    large milling capacity.⁵⁴ The compulsory exclusive sale of paddy to designated
    mills included a ban on the export of paddy from the locality. All these decrees,
    therefore, restricted the free flow of paddy. In some places, the authorities
    even banned the transmission of paddy between subdistricts. The block formation
    had two basic purposes: to fulfil the quota set by higher authorities and to fight
    inflation by preventing the outflow of rice.⁵⁵


