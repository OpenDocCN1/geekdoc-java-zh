    1.5, and the tenant farmer 1.5 or 2. In the recent past the landlords had gradually
    become reluctant to till land, and thus the burden on the farmers had become heavier.
    Sew was a relatively new form of tenancy; it was practised on 21.37 per cent of
    tenant lands. In sewa the tenant farmer carried out all the farming. The landlord
    received two thirds of the standard harvest, either in cash or in kind depending
    on the lessor’s preference. The amount for the landlord was fixed and the tenant
    farmer had to take the risk of crop failure. This was not as popular as ceblok
