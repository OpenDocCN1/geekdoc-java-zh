    The idea of controlling rice distribution of rice at fixed prices was not new
    to Java. When the European war broke out the Netherlands Indies government, with
    the intention of securing stable distribution of rice at fixed prices within the
    Netherlands Indies during the period of war, took the decision to become an active
    agent in the distribution of rice. For this purpose it set up the Voedingsmiddelenfonds.
    Under the direction of this body the Rijst Verkoop Centrale (Rice Sales Centre)
    was established in each of the three provinces in Java. The government obliged
    the mills to buy paddy at the official prices and sell processed rice exclusively
    to the Rijst Verkoop Centrale, which in its turn sold rice to the wholesalers
