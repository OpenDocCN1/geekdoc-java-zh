    # Overview


    Imamura declared in his first ordinance that “the Japanese Army shall seek to
    promote the welfare of the people of the East Indies who are of the same race
    and origin as the Japanese and also ensure coexistence and co-prosperity with
    the local inhabitants in conformity with the guiding principles of the cooperative
    defence of Greater East Asia.^223 As the war turned against Japan, the Japanese
    demanded nearly all the mobilisable work force in under the banner of co-prosperity
    and cooperative defence. They employed the mobilised work force for a wide range
    of projects. Given the war situation, some of the projects, such as the development
    of coal mines, shipbuilding, and planting of cotton and jute, perhaps "inevitable"
    as Yamamoto maintained. But many other projects, particularly the agricultural
    production increase campaigns which took up the largest part of the mobilised
    work force, were far from inevitable, and produced very poor results and adverse
    effects on Java’s economy and society. The Japanese wasted enormous amounts of
    Java’s labour and resources in their attempt to create a “New Java” and sacrificed
    many Indonesian lives.


