    many also sold or rented out their sawah and became landless. All these trends
    stimulated a proliferation of money lenders and exacerbated the indebtedness of
    many peasants. In regions close to urban or semi-urban, or on main roads or the
    railways, many landless people took up non-agricultural jobs, as petty trade and
    cottage industry, as full-time or part-time occupations.¹17


    Concentration of landholding and commercialisation of rice was accompanied by
    the emergence of motorised rice-mills. In the early century there were still few
    mills in Java, but their number and capacity increased rapidly, particularly in
    the 1930s. In 1941 there were 547 mills, processing 22 per of the total paddy
    produced in Java.¹18 These mills were almost exclusively owned by Chinese, and
    were distributed unevenly, being concentrated in major rice producing areas like
    Bogor, Jakarta, Cirebon and Malang Residencies.¹19 The mills bought large amounts
    of paddy from areas around them using the improved transport facilities, including
    railways.


    When paddy was sold outside the village in large quantities, it was usually handled
    by Chinese brokers, called tengkul or bakul, who were either employed by the mills,
    worked on a commission basis (for instance, 8 cents per quant of paddy), or bought
    paddy on their own account to be later sold to the mills. It was a common practice
    for a broker to pay farmers in advance for the paddy to be delivered after the
    harvest, or to buy the green paddy still standing in the sawah (ngijon, or green,
    system). In this case the price of paddy was much lower, sometimes only one half
    or third of the sale value of the harvested product in the open market.¹20 In
    the late 1930s and early 1940s many villagers sold the greater part of their paddy
    to the brokers from the local markets according to their needs and capacity. An
    increasingly large proportion of the peasants had become heavily dependent on
    brokers, mill, markets and cash. The situation in pre-invasion Java was thus very
    remote from the picture of self-contained agrarian villages often presented in
    traditional Dutch colonial histories.¹21


