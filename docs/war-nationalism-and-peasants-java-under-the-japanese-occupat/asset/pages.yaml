    # Transformation in Rural Java, 1850–1941


    During the century or so before the Japanese invasion, rural Java had undergone
    considerable changes in many respects. Rice cultivation was no exception. Until
    large mechanical irrigation systems were constructed, it depended largely on river
    systems and natural rainfall. After the midnineteenth century, particularly during
    the last decades of Dutch rule, irrigation systems in Java were greatly improved.
    Between 1880 and 1940 sawah (wet rice fields) in Java almost doubled while all
    land under cultivation expanded nearly four-fold.⁹ By 1940, agricultural fields
    covered 67.8 percent of the total land area of Java and Madura, including the
    particolare landerijen took up 7.6 per cent. Indonesian-owned agricultural fields
    were approximately 8,000,000 hectares in total, consisting of 3,500,000 hectares
    of sawah, 3,000,000 hectares of dry fields, and 1,500,000 hectares of house gardens.
    Large-scale modern irrigation systems supplied water to 1,310,000 hectares of
    sawah, small systems constructed by villagers to 1,400,000 hectares, and the remaining
    790,000 hectares of sawah depended on rainfall.¹⁰ The climate in Java provides
    a clear-cut dry season and rainy season (Graph 5.1). The predominant pattern of
    cultivation was therefore one crop during the rainy season, land preparation before
    November, and harvesting in April and May. The irrigation systems, however, enabled
    double cropping of rice, or three crops in two years in certain areas.


    Expansion of irrigation systems was accompanied by changes in land tenure and
    social stratification. In the early nineteenth century, when the compulsory sugar
    cultivation system was implemented in Java, communal control of land was strong,
    but after the system ended the Netherlands Indies authorities gradually increased
    and protected the peasants'' individual rights over land through a series of decrees
    and ordinances.¹¹ Sawah'
