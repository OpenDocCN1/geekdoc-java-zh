    Tumut village was in the principality of Yogyakarta where the Sultan''s control
    was strong; and Cimahi village was in West Java where communal tenure was marginal
    or non-existent.


    The chosen villages were situated in well irrigated areas, and ratios of sawah
    to total village land areas were much higher than the Java average. The population
    densities were also higher. The Japanese were particularly interested in increasing
    rice production and controlling rice distribution and for this reason they chose
    well-rice growing villages for surveys. In this respect the sample villages were
    not "average" villages, but as well-irrigated rice growing villages they were
    typical, exhibiting different patterns of land tenure, labour arrangements, and
    income distributions found within the Indonesian-owned agricultural land. A microscopic
    examination of these cases will, at least, provide an insight into day-to-day
    life in Java''s countryside in the early 1940s.


    # Tasikmadu Village, East Java25


