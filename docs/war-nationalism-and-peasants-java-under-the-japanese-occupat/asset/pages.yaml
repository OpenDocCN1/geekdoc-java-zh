    # The Problem of Communication


    One important cause of the malfunctioning of the rice procurement system in particular
    was insufficient communication between various levels within the administrative
    machinery. There was much propaganda but very little real understanding and communication
    between the Foodstuffs Management Office, the Residents, pangreh praja, rice dealers,
    and villagers. Without knowing clearly the purpose of the centrally planned rice
    policy, government officials at each level had to implement it. Indeed the Japanese
    did not make sufficient effort to inform the Indonesians of their intentions.
