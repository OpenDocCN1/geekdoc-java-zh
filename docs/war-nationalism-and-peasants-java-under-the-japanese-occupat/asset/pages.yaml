    Without asking for what purpose the occupation government implemented the rice
    procurement system, the Sanyo accepted the Japanese propaganda that rice delivery
    was part of the war effort for which Indonesians had to support. None of the Sanyo
    clearly knew Japanese intentions concerning the purchased rice. However, among
    the Sanyo, there was a near universal consensus that a controlled economy was
    a necessity and that the situation would be improved by tightening control. The
    point of contention was over how to do it. Oto, stated: "in time of war rice should
    be regarded as vital material, just like bullets, and therefore should not be
    subject to the operation of the market. The Government must buy up the rice crop
    in order to arrange regular supplies for the Army and the people."^{88}


    The strongest advocate of tightening control was Mohammad Hatta. He argued as
    follows: "For example, if a village requires 500 quintals a year and production
    is 1,500 quintals, then 500 quintals should be expected [at the beginning], and
    the remaining 1,000 quintals delivered to the government." Hatta maintained that
    the government should buy all the surplus, and that rice should be distributed
    equitably to everyone; in the form of husked rice in the cities and stall paddy
    in the village. He also maintained that there should no longer be free marketing
    of rice. Several Sanyo expressed apprehension about such a radical measure and
    thought it impracticable. A vote was taken and the result was for and seven against:
    the proposal was not adopted.^{90}


    There was, however, a strong feeling that control must be strengthened somehow.
    The Sanyo, all ethnic Indonesians, agreed the Chinese dominance in the rice-milling
    industry had evil effects on the peasantry. They were unanimous that all the mills
    must be nationalised. Sukarjo Wiryopopranoto complained that:


    It looks as if the mills have special protection by the government, government
    itself is the leader of the mills, and the Chinese who run the mills are like
    government agents. The middlemen come to the villages with a feeling that they
    are protected by Nippon, feeling arrogant and behaving provocatively towards the
    villagers. They say that the villagers must obey them and bring paddy to such
    and such place because the millers want to come, want to buy, and for all this
    they use the name of "Nippon."^{91}


