    # The Situation in the First Year


    The Sixteenth Army invaded Java with no particular policies concerning rice. When
    they took over the Netherlands Indies government, however, the Japanese discovered
    that the local economy, including rice distribution, had been disrupted by the
    war. Owing to the scorched-earth strategy of the Dutch, facilities such as bridges,
    railways and sea ports had been destroyed or damaged. As well Indonesians had
    attacked many rice-mills and shops owned by Chinese. Of the 547 rice-mills most
    had suffered varying degrees of damage. As a result by September only 347 mills
    were still in operation.¹ Finance for the mills, which had been previously supplied
    by the Netherlands Indies governmental body, the Voedings-middelfonds (Stuffs
    Funds), stopped, and rice-millers were having difficulty buying and storing rice
    for processing. The supply of jute bags, which had been imported from India in
    the prewar period for rice storage, also stopped, and petrol for rice-mill operation
    became hard to obtain²


    In addition to these problems March was a pre-harvest period when rice stocks
    usually ran short and supply in big cities such as Batavia and Bandung were low.³
    To make the situation worse some rice traders held off selling in anticipation
    of a rise. Thus, at this early stage, complaints and petitions concerning the
    difficulty of buying rice were frequently made to the Japanese authorities. In
    rice-producing villages, in contrast, harvested paddy lay unsold, and rice purchase
    prices accordingly fell⁵ The rehabilitation of the rice economy was therefore
    one of the first tasks of the Japanese military administration in Java.


    To alleviate the situation in the cities the Army released 6,000 tonnes of rice
    from the stocks that were taken over from the Netherlands Indies government. From
    13 March in order to prevent hoarding and speculative activities, it introduced
    a coupon system in the large cities. On 27 March'
