    Yamamoto Moichiro argued that the introduction of the controlled economy had been
    “inevitable” under the war situation. There is some element of truth in his statement
    that the war created enormous problems which the occupation government had to
    confront. In order to investigate to what extent the measures the military administration
    took were “inevitable” and exactly how many Japanese projects affected Java’s
    peasantry, the following sections examine three concrete cases. The first is the
    construction of the railway connecting Saketi station and the Bayah Coal Mines
    in West Java. This project was part of the Japanese effort to establish self-sufficiency
    in fuel within Java and was conducted by the military administration. The second
    is the Army’s shipbuilding project conducted along the north coast of Central
    Java. Marine transport was a vital necessity for both military and civil purposes,
    but the Japanese shipping capacity declined rapidly due to Allied attacks. The
    Army planned to replenish the loss by building wooden boats. The third is the
    construction of a drainage channel in Kediri Residency. This project was initiated
    by the Resident of Kediri, Kihara Enji, to prevent flooding, and to extend agricultural
    fields as a part of the continuing production increase campaigns.


