  md: '# Overview


    The central theme of Japanese politics in the late 1930s and early 1940s was to
    create a “total war structure” in Japan and the occupied territories. The three
    mass mobilisation movements conducted in Java were variations on this theme, which
    took a clearer form after the Japanese War in 1937. The first two movements, which
    began before the war turned decisively against Japan, were little more than propaganda
    although the ideas behind them were grandiose and ambitious. In these movements
    the concept of total mobilisation was vague, without a clear delineation of the
    purpose, or manner, of human and natural resource mobilisation. Therefore, these
    campaigns had little direct impact on the people in Java’s countryside.


    During the latter half of 1943, the occupation authorities attempted a drastic
    strengthening of resource mobilisation under the banner of “defence and construction,”
    and prepared a new mass organisation, Jawa Hokokai. This organisation covered
    practically every household in Java. However, it was structurally non-viable and
    did not succeed in integrating disparate social groupings. On the contrary, it
    often exacerbated the conflicts among them, between the nationalists and the pangreh
    praja on one hand, and between the peasants and the pangreh praja and Chinese
    on the other.


    incompatible in many respects. They had very different functions and ideologies,
    and their spheres of influence were also clearly differentiated, the pangreh praja
    being dominant in the countryside while the nationalists’ influence was numerically
