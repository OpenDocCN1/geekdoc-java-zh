    # The Peasants’ Rebellion in Indramayu Regency


    During the main harvesting season of 1944 the largest rebellion of the occupation
    period took place in one of the major rice producing areas on the north coast
    of West Java, Indramayu Regency. Indramayu was one of four Regencies of the Cirebon
    Residency, the other three being Cirebon, Majalenga and Kuningan. Kurasawa Aiko
    has studied the process of the rebellion in detail.¹⁰³ The first riot broke up
    in Kaplangon village, on the eastern border of the Regency, in April 1944, and
    like a chain reaction the rebellion spread westward, reaching Bugis village on
    the western border of the Regency about two months later. All the riots took place
    within the one harvesting season and within the one Regency. One day in April
    when the main harvesting season had just started, the village officials of Kaplangon
    announced that new regulations had been introduced, and that villagers had to
    surrender all paddy except two gedeng (about 10 kilograms) per household. One
    Friday morning soon after, the subdistrict head came to the village to enforce
    the regulations. The villagers were summoned, all ordered to carry a largeholder’s
    stock to the village hall. Before they finished the task the time for attending
    the Friday worship came. They asked the subdistrict head to stop the work so they
    could go to the mosque, but he insisted on continuing. At this point a heated
    quarrel and skirm developed: two policemen were killed and the subdistrict head
    was struck by stones and fell unconscious, while the village officials all ran
    away from the village. Then the villagers set up a barricade on the main road
    in anticipation of punitive measures.


