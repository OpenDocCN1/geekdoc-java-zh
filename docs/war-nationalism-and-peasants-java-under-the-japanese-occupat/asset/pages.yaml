    # Demise of the Movement


    Despite all these developments, the Triple Movement came to a halt six months
    or so after its inception. Two years later, an editorial of the Japanese-wide
    in Java, Jawashinbun, pointed out five reasons for the Movement’s failure: first,
    its Parindra-centricity; second, ethnic rivalry between Chinese and Indonesians;
    third, conflicts between the nationalists and the bureaucrats; fourth, isolation
    from the military administration; and fifth, its limitation as an ideological
    movement which did not develop into a practical one.^55


    Triple A was not meant to be Parindra’ movement but Parindra members assumed the
    leadership in both the central and branch offices. This caused dissatisfaction
    among the leaders of other political groups. Samsudin hoped to create a Java-wide
    organisation with a structure resembling a government, and for this purpose he
    sought the cooperation of the other prominent figures in Jakarta, but it was not
    until 11 June that he officially contacted them.^56 Those nationalists, or pergerakan
    people, who did not assume leadership roles within the Triple A Movement became
    critical about the fact that the Movement was very different from what the pergerakan
    people wanted, that is, the formation of their own independent state. They were
    also unhappy with the conspicuous Chinese activities and their domination of the
    Movement using their financial superiority over the indigenous population. In
    the countryside the pang praja were influential as “advisers” and caused conflicts
    with the nationalists in the branch offices. According to Miyoshi, the local bureaucrats
    attempted to enhance their positions by using the Movement, and to please the
    occupation authorities they pressed local inhabitants to join it; did not risk
    the danger of being considered uncooperative with the occupation government. This
    recruitment method generated antagonism and grudges among the people.^57 A report
    from the Beppan (the Japanese intelligence service) corroborated that “officials
    coerced the lower classes of the people, and in particular, the lower officials
    there are those who say things as: ‘Since we are your guides and leaders, those
    who do not agree with our ideas, will be reported to the Japanese in order that
    they will be punished. In this way the general public feel afraid of them.’^58


    Some pergerakan leaders were dissatisfied with the Movement approached the Japanese
    authorities and expressed their wish to organise their own movement, excluding
    ethnic minorities.^59 On 9 July Sukarno arrived in Jakarta from his place of exile
    in Sumatra. Soon his influence'
