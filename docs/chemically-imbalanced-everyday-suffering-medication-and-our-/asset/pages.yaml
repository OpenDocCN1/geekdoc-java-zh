    # Subjects Not Objects


    There is a reductionism here, but it is not a biological reduction. In endorsing
    the dimensions of the neurobiological imaginary, the people we interviewed were
    not endorsing some determined picture of themselves, without free or effective
    agency in the world. Again, the opposite. As we saw in chapter 4, they expended
    considerable energy to defeat implications of being determined or different. Much
    like the surveyors of the disengaged and eternal perspective in the sciences and
    philosophy, they did not draw on biology to replace the liberal autonomous sense
    and ideal of self-mastery but further secure them.


    The reduction here is the human person. In psychosocial approaches, the self emerges
    in social interaction and practices, is constituted through ordinary language
    and narrative (teleological and intentional), and is articulated through personal
    engagement on experience and one’s position within a shared symbolic universe.
    Similarly, in the hermeneut approach in the social sciences and philosophy that
    I have been working from, our acts (inner and outer) and our embodiment belong
    to “continuous fabric of being.”¹⁷ Movement toward a richer and more accurate
    understanding of ourselves involves our temporality (our memory and history) and
    the social practices and dialogical relations—with ourselves (internal conversation),
    with others, within a community and a tradition—that have helped to make us who
    we are. Self-elaboration, in this view, is an ethical activity, an effort to see
    ourselves clearly, to gain a full picture of who we are, what moves us, and critically—by
    what standards we live. And this elaboration can serve as a base for the cultivating
    of sociality and solidarity with others.


    Movement toward a richer and more accurate understanding can involve, the help
    of others, and a checking of our interpretations against the facts of our own
    history. It requires reflection, in the sense discussed in chapter 6, on our conduct,
    thoughts, and feelings. Our emotions, the social emotions that involve our relations
    with other people, like shame, remorse, pride, admiration, envy, jealousy, self-contempt,
    disappointment, and guilt, are especially crucial to self-knowledge because they
    are relational to, and in a feedback loop with, what we care about.¹⁸ They concern
    our status and involve subjective compliance and self-worth.'
