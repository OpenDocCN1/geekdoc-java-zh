    While Kristin credits the stimulant with some positive results, it has not made
    the difference she hoped it would. “I guess I used to go through a day,” she says,
    “and imagine that I only worked 50 percent as hard as I could have and that one
    of these days, I was going to go 100 percent and I was just going to be, was just
    going to be great.” On the medication, she pushes herself somewhat, and finds
    that the drug makes her feel smarter and more interested in her class work. But
    there has been no dramatic improvement, and she also finds hard to relax when
    taking it. Sometimes she feels that the medication improves her social interactions,
    making her both more interesting and more interested in those around her. But
    at other times she worries that, socially, she is “just kind of a pain.” The drug
    is helpful, yes, she concludes, but “not like a wonder drug.


    Stories like Kristin’s are not unusual. Tens of millions of people, dealing with
    everyday struggles, have been diagnosed with a mental disorder and are treated
