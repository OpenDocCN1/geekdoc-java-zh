  md: '# 6 / Introduction


    The shortcoming of these books is that they typically fail to attend to the suffering
    of those nondisordered people who turn to doctors for help. They concentrate,
    instead, on the actions of professionals and industry and on larger institutional
    processes and changes that contribute to the redefinition of “human conditions”
    or “normal behavior” in medical terms. They usually stop there, without exploring
    how these patients are actually struggling.¹18 They characterize the concerns
    at stake for people in minimalist terms, as “vague complaints” or “ordinary unhappiness.”
    Or they imply that dissatisfaction with normal life is being directly generated
    by the promotion of disorder categories (“disease mongering,” “selling sickness”)
    and intervention options.¹19 There is a common tendency, for instance, to treat
    pharmaceutical advertising as a highly deceptive practice, fooling people into
    pursuing medications they don''t actually need. Little is said about what individuals’
    experience might stand out to them as distinctive and in need of intervention
    and what might suffer, if any, be involved.²⁰ Little is said about their reasons
    for seeking medicalized approaches and what these approaches are having on them
    and their understanding of themselves.


    In listening to their stories, I sought to understand their needs and purposes—to
    hear what they were saying, not in their words but in what might stand in the
    background informing them. How, for instance, inquired, medical symbolism, neurobiological
    concepts, and pharmaceuticals taken up as social objects or narratives that people
    invoke to make sense of and alter their life trajectories? Despite what one hears,
    the heavy use of prescription psychotropic medications is not a recent phenomenon.
    It goes all the way back to the 1950s, and by the late 1960s, adults were using
    psychotrop at rates comparable to those of today. The crucial change, I found,
    is something different, a shift much quieter and less measurable than drug use.
    It is a change in the terms in which ordinary people imagine self and suffering,
    in “imaginary,” and its causes and its resolution. This change, the subject of
    this book, is the master trend for which I seek a “thick” (theoretical, historical,
    contextual) understanding and assessment.²¹


    Before turning to the new imaginary, I need to spell out in greater what I mean
    by “every suffering” and the “predicaments” that it places people in. I need concepts
    like these, rather than psychiatric terms like “mental disorder,” to make sense
