    # The Interviews


    The interviews, conducted by myself and research assistants, were structured by
    an “interview guide,” one for those on a medication and a slightly different one
    for those who were not. The guides outlined the questions to be asked and possible
    prompts and follow-up questions. Interview guides are preferred in this type of
    research. Structure interviews but also allow participants to tell their story
    and propose new lines of discussion.


    We began each interview by asking the participants to describe the circumstances
    that brought on the “suffering”—actually, what “issue” in ad they were responding
    to—or, in cases where no specific circumstances could be identified, the point
    at which they felt something was wrong. We asked in what terms they described
    the “issue” and then used how it had affected them. We asked if they had sought
    medical, psychotherapeutic or other help, and if so, about their interactions
    with professionals, if a diagnosis had been made or a prescription written, and
    what they learned. We asked their view of the cause of their suffering, sources
    of information they pursued, and whether their understanding changed. We also
    asked whom they had told about the problem and whom they would not tell, and why.
    Next, we asked about what steps they have taken or are trying to ameliorate their
    predicament or rise above it. For the majority (two-thirds of the total), these
    steps included some professional help. And, finally, we asked them about the role
    of personal struggles in life and whether their experience had led them to revise
    the hopes and expectations they have for themselves. The interviews were digitally
    recorded and transcribed for analysis.


    # Interpretive Method


    The interview questions were organized in a sequence that aimed to draw out a
    story. Conventional qualitative methods in sociology involve data analysis in
    terms of concepts, either brought to the research from specific theoretical models
    or from vivo categories that arise inductively from the data itself. This is certainly
    valid, and I drew upon grounded methods that involve the inductive approach. However,
    the emphasis on'
  merge: -1
  pgno: 203
- img_proc: true
  md: 'concepts typically involves breaking up interview data into separate speech
    sequences, comparing them across cases, and then illustrating the resulting patterns
    with brief quotes. The problem is that the quotes lose some of the very context
    that is the point of face-to-face interviews and their advantage over other methods.


    In my analysis, I treated the whole interview as the unit of analysis, looking
    for patterns within each interview and only then comparing these patterns across
    cases. For example, we asked people who had been to a doctor to talk about the
    visit in which they received a diagnosis. Standard approaches would be to compare
    the answers that different participants provided to this question alone. But what
    participants said about doctor what they said about other aspects of their predicament
    and must be interpreted as such. This is what narrative analysis seeks to do—preserve
    context by seeing all of the elements of a story in their relation to each other
    and to meanings in the wider society. Consequently, I first asked what was said
    about the doctor visit related to the story as a whole and only compared it to
    other stories and identified patterns. The writing was therefore organized in
    terms of groups of participants rather than illustrative quotes.'
