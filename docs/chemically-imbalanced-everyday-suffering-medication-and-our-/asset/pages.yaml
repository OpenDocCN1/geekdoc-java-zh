    The move to a biomedical orientation in psychiatry was an effort to place the
    field on a more secure medical footing. The decisive step was to move away from
    the seemingly imprecise and poorly defined world of everyday suffering and mark
    out the specialty in specific disease entities and specific treatments. Compared
    with dynamic psychiatry and the prescribing of the minor tranquilizers, the central
    place of diagnosis represented a new and higher standard, seemingly limiting the
    scope of concern to the treatment of people with reliably classified disorders.¹³
    Further, as disorders increasingly came to be defined as forms of the brain, the
    direction of psychiatric treatment could have been expected to narrow and move
    toward debilitating forms of mental pathology. The many kinds of circumstellar
    demeaning and emotionally stressful experiences treated with drugs Valium in the
    tranquilizer era would seem to have been left out. Not because these experiences
    might not cause pain or hardship or even come to medical attention because no
    pathology was present, and pathology was the appropriate object of medical treatment.¹⁴


    Perhaps for a time they were left out. Prescription for many common psychotropic
    medications, for instance, did in fact drop in the 1980s. Of course, many other
