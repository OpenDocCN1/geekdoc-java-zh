    cation.³ In order to better understand this remarkable and highly publicized phenomenon,
    I and research assistants interviewed eighty people, adults eighteen to sixty-three.⁴
    These participants responded to an advertisement I ran in the Chicago, Baltimore,
    and Boston metropolitan areas, as well as in a central of Virginia that includes
    two small cities, Charlottesville and Harrisburg. The ad asked potential volunteers
    if they struggled with being sad, with anxious in social situations, or with concentration
    and attention problems, and if they would be willing to talk about their experience.
    I chose these three types of distress in America today.⁵ I worded the ad I did
    in order to recruit people like Kristin, with a diagnosis and taking medication,
    as well as people who were coping in other and nonmedical ways. By comparing different
    explanatory accounts and treatment strategies, I sought to better understand what
    was unique to each.


    For a generation, debate has waxed and waned over the expanding number of people
    who are diagnosed with a mental disorder and treated by means of prescription
    drugs. One the psychiatric, insists progress. This, the medical mainstream, asserts
    that the growing incidence of diagnosis and treatment of emotional, behavioral,
    and cognitive problems reflects the high numbers of individuals with debilitating
    mental disorders. The American Psychiatric Association, for instance, claims that
    one in four Americans experiences a mental disorder in any given year. In this
    view, people with pathological conditions are finally getting the help they need.
    All the diagnosing and prescribing are for people who are mentally ill. The same
    idea comes across in the popular press and in some of the best-selling books by
    sufferers, who write of their condition from a psychiatric perspective.


    But mental illness is significant when those diagnosed with emotional and behavioral
    problems do not fall into this category.⁶ We know that the DSM diagnostic thresholds
    for many listed disorders, such as depression, social anxiety disorder, and ADHD,
    are low, open-ended, and fail to account of the context of experience.⁷ Before
    being redefined in the 1960s and 1970s, depression was a relatively rare disorder.⁸
    Social anxiety disorder made its first appearance in the DSM in 1980, was virtually
