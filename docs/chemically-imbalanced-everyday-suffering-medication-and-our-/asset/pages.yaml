    # Suffering in Everyday Life


    With "everyday suffering," I want to introduce a concept that unlike, say, "condition,"
    always references the lived experience of the sufferer and does not imply any
    pathology. It names distress and struggle, the painful reality they constitute,
    and the strong desire to be free of them. And it specifies that this is a type
    of suffering that arises in everyday life. The “everyday,” by dictionary definition,
    means routine or unremarkable. But in the social sciences, including sociology
    and anthropology, and in political and historical writing “from below,” the “everyday”
    refers to the practical and felt experience of ordinary people, and efforts to
    understand it are set against abstract, formal-institutional, and elite-focused
    accounts of social life. Everyday life is the ongoing arena of practical activity
    and relationships guided by implicit, “common-sense” knowledge of the world.23
    It is the set-ting in which selfhood is constituted.24


    Everyday life, as we all know from experience, includes struggle. Especially under
    conditions of disruptions and setbacks of social change, as is in our own time,
    it is subject to disruptions of varying duration and intensity—divorces, job losses,
    moves, children’s struggles, moral dilemmas, crises of faith, illnesses, deaths
    of loved ones, and much more. And no list could capture the possible failures,
    rejections, humiliations, and other troubles that one might have to endure. Difficult
    and often charged experiences, like those reported in this book, interfere with
    the normal routines of life and can lead to suffering. “suffering” is a formidable
    word, and we often prefer to limit its application to accounts of intense physical
    pain or devastating effects of injury, deprivation, or trauma. None of whom I
    interviewed spoke of their experience as “suffering,” Y. I could not find a better
    answer. And it is not uncommon to speak of suffering in broader terms. Commenting
    on the suffering literature, sociologist Iain Wilkinson notes some everyday emotional
    and behavioral ordeals.“We identify suffering,” he writes, “as taking place in
    experiences of bereavement and loss, social isolation, and personal estrangement.”
    It can “comprise feelings of depression, anxiety, guilt, humiliation, boredom,
    and distress.”25


    Along with emotional distress, everyday suffering includes affronts to the self
    and a sense of abnormality. While the capacity of suffering to dis'
