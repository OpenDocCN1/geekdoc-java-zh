    # Conclusion


    What stands out from the interpretive patterns of how everyday suffering is understood
    and addressed is the growing ascendancy of explanations and expectations tied
    to biology and medication at the expense of alternatives. The shift toward a neurobiological
    imaginary is not just observable in the stories of those who have adopted a medicalizing
