  md: '# INTRODUCTION


    Like many of her college peers, Kristin, twenty-one, had experimented with Adderall.
    Her first encounter with the preferred medication for treating attention deficit/hyperactivity
    disorder (ADHD) came at a party, where she met a student who was “just, like,
    like, crazy,” animated and making people laugh. Not long into their conversation,
    he told Kristin that he was taking Adderall. Getting started on it had been easy,
    he explained, because his mother liked “pathologizing everything” and had sent
    him to a psychiatrist to get an evaluation for his trouble focusing in high school.
    After a brief session—“like two minutes,” the young man—the psychiatrist wrote
    a prescription. By his story, Kristin left the thinking they both had the same
    sort of thing. She wanted to try the drug.¹


    She didn''t have to wait. A friend at the party gave her a pill, and soon she
    was feeling so good that she worried she might be experiencing an “artificial
    high.” She quickly got over her reservations, however, and supplied by friends,
    began the medication on a regular basis. She grew convinced that the drug could
    improve her social life and her ability to “get things done.”


    Kristin believed she needed help on fronts. From a relatively fluent home, she
    had done well in high school and then articulated at a selective college known
    for its academic rigor. She anticipated challenging classes and hoped for a vibrant
    social life. After two years, she was disappointed and frustrated. The other students
    were just like Kristin herself—kind of shy, artistic, very smart, but [they] a
    hard time interacting.”She found them unhappy, and the social environment stifling.
    She frequently felt sad and decided to transfer to a college with more of a party-school
    reputation.


    Kristin’s transition to the new environment was rocky: Once classes'
