    # The Neurobiological Imaginary


    From their accounts of the genesis of their suffering and their response to it,
    I found that participants, to varying degrees, conveyed three distinct tendencies
    in the face of a predicament. The first was a tendency to shift from an initial
    or default explanation of suffering in vernacular terms of mental life to an account
    in terms of malfunctioning brain states that mechanistically disturb thought,
    emotion, or behavior. The second was a tendency toward anemic or indifferent attitude
    toward psychotherapy and counseling and a meager investment in any form of help.
    If a professional was needed to ameliorate or rise above a predicament, it was
    a doctor. The third, taking a drug or not, to regard medication as the necessary
    and effective intervention to ease symptoms and address “real” problems. While
    these tendencies are not a package and do not logically imply one another, many
    people expressed all three, a substantial majority at least two, and some one.
    Only a very few expressed none of these.


    This constellation of tendencies reflects the way of imagining that I am calling
    neurobiological. Direct explanation in terms of heredity and the brain is the
    clearest indicator. But views of counseling and the efficacy of medication were
    also revealing for some of those who did not reference brain abnormalities. These
    people seemed to have little confidence or trust in a first-person, qualitative
    language of mental life or imagine their struggles in terms of their inner experience
    or normative conflict. Many conveyed the impression that in their experience there
    was nothing to explore, discover, or confront, and some sought to liberate emotional
    experience from themselves. Like the medicalizing, many contrasted a soft, subjective
    world of talk and therapy with a hard, objective world of medicine and medication.
    They pitted “real” problems against problems that are “in your head,” where “real”
    always seemed to mean somatic and medication the logical intervention.\^22 Some
    helped-seeking because they worried that they might have a doctor might think
