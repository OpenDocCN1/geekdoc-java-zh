    was steadily replaced by an extensive diagnostic language of mental disorders.
    The new language did not, by definition, master the troubles that mind tranquilizers
    were once marked for, such as a relationship bind, trouble adapting to distressing
    circumstances, or an unfilling life situation. It named something you have, an
    internal dysfunction. While many psychiatrists emphasize that mental disorders
    involve a complex interplay between biological and psychosocial factors, they
    also insist that all disorders are inherently neurobiological. Even “the study
    of unconscious processes, motivation, or defenses,” according to one influential
    paper, “is now also in the domain of cognitive neuroscience.”¹¹²⁶


