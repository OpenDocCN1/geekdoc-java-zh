    # Freud and Drugs for the Mind


    While biological theories and somatic treatments date to the beginnings of psychiatry
    as a medical specialty, in the years after World War II, psychoanalytic ideas
    took center stage in the United States. The years from war until the mid-1960s
    constituted a “golden age of popularization” of Freudian thought, and the origins
    of psychological problems were sought in childhood experiences and efforts to
    adapt to environmental stress. Experience during the war was important to this
    ascendancy and its synthesis with the more environmentally oriented and psychosocial
    views of the leading American psychiatrist, Adolf Meyer. Both psychiatric experience
    with stress-related problems and public perception of psychiatric problems were
    very high during the war. Further, many European psychoanalysts fled to the US,
    influencing practice here, while Nazism, not to mention problems with the existing
    somatic treatments, did much to credit biographical explanations of character
    and behavior.


    However, it is important to note that while psychoanalytic and social orientations
    dominated psychiatric theory—shaping, for instance, the first (1952) and second
    (1968) editions of the Diagnostic and Statistical Manual of Mental Disorders—and
    were popular in the academy and media, treatment was more eclectic and pragmatic.
    The number of trained psychoanalysts during this period was fact never large.
    In 1957, during'
