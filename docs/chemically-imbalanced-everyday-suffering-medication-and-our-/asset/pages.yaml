    important role in the diagnostic process. For many of the most common categories,
    the criteria required that they think of the emotional and behavioral problems
    they might struggle with in terms of “symptoms” (and, thus, albeit implicitly,
    in terms of illness), regard regard to their circumstances. Some of this role
    may be similar to what it was in the tranquilizer era, reflecting in that general
