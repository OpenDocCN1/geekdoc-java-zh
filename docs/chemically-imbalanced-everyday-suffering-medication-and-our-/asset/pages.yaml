    They are emergent from situations and provide, in the words of Margaret Archer,
    "commentaries upon our concerns."19 The commentary is an evaluative awareness
    of a situation and its relevance for our desires and attentions, attachments and
    aspirations. To experience an emotion is to perceive a situation as bearing a
    particular import for us and setting the stage for potential action.


    Of course, how we evaluate the situation may be wrong or unwarranted, and so we
    "can be mistaken," to quote Iris Murdoch again, "about what we think and feel."20
    Our feelings may be at odds with our understanding of the circumstances, or we
    may misapply maps to ourselves—such as we feel responsible for things completely
    outside of our control. We may sense an emotion is prohibited and redirect its
    import to something less threatening.21 The fallibility of our emotions is an
    important reason why reflection is necessary. By further consideration, we may
    reject previous interpretations as incomplete or wrong in our effort to elaborate
    a more accurate characterization of what a situation means to us. The new formulation,
    in turn, can and often does, lead to changes in how we feel.


    For participants, this second-order (introspective or dialogic) reflection is
    precisely what the neurobiological interpretation cuts or eliminates. Recasting
    emotions as objectless, as the result of rogue chemicals, neglects reflection
    and understanding and any reassessment of self or circumstances that might have
    followed. Like those who ended psychotherapy after beginning medication, once
    people adopt categories, like depression or SAD, to characterize their emotional
    responses, there is a strong tendency to use the new language to displace reduced
    every emotional vocabulary. In many of their stories, for instance, participants
    reduced every negative feeling to such blanket terms being "depressed" or "anxious."
    These terms are not an alternative way of expressing the emotions they experienced;
    rather, the new terms record and homogenize what they experienced. They bring
    a different reality into being, altering the fields of meaning. Once altered,
    the specific import of participant emotions for self-understanding is undone.
    Their original experience, which would be critical for what was going on, can
