    # Conclusion


    At the heart of everyday suffering is anomalous experience, and participant sense-making
    involved positive steps to negotiate threatening elements and establish right
    order. For many, medical help-seeking and treatment presented a clear danger to
    self-image, whether in disclosure, diagnosis, medicalizing explanation, or medication.
    The threat was not so much from a fear of negative stereotypes as from a gap between
    the goal of viable self and the means to achieve it. To shrink that gap—to neutralize
    the threat of difference—participants shaped definitions and interpretations consistent
    with the positive picture of self toward which they aimed. In most stories, the
    goal that emerges is a picture of themselves as proactive, competent, and especially,
    self-defining.


    This goal comes to light in the values that participants emphasize. They made
    their own decisions, in consultation with others but on their terms and not in
    mere deference to the judgment of medical professionals, family members, or friends.
    They stressed that their remedial actions included personal effort, an application
    or expression of their control. Medication, for instance, was not “magic,” or
    a “quick fix,” or an “easy way out.” They were responsibly engaged in appropriate
    struggle and concerned and vigilant against dependency.


    The desired self also emerges in the background norms and ideals that participant
    evaluations must presuppose. Recall again Jenna and the situation she faced after
    the cheating and breakup with her boyfriend. She says remarkably little about
    her emotions. “Sad,” “crying nothing,” “tired,” and “depressed” are virtually
    the only negative emotion or emotion-words that arose in the entire interview.
    She makes no mention of complex, social emotions such as jealousy, betrayal, anger,
    embarrassment, or resentment that one could reasonably expect her to feel in'
