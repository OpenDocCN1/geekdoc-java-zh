    # Predicaments


    Everyday suffering places people in what I will call a predicament. I use the
    term in the sense given by the political theorist William Connolly: "A predicament
    is a situation lived and left from the inside. It is something you seek to ameliorate
    or rise above." 32 The predicament is the quandary of how to locate events and
    experiences in an explanatory context or account that can provide understanding
    and guide efforts at relief or escape (which might simply mean continuing on in
    the best way one knows). 33 In the interviews, the predicament took the general
    form of "Why can''t I?" questions with respect to specific standards. Like Kristin,
    many people expressed challenges in terms of social performance. They described
    difficulties in group situations, such as at parties, when meeting strangers,
    or when speaking in front of others. Their quandary might be expressed'
