  md: '# APPENDIX


    # Interview Sample


    This is a book about personal experiences of suffering, conveyed to me through
    interviews. In order to recruit participants, I posted advertisements on the internet
    site Craigslist, placed notices in alternative weekly newspapers, and posted flyers
    on college campuses, other public kiosks, and public buildings such as libraries.
    The ads asked potential participants if they struggled with being sad, being anxious
    in social situations, or with concentration and attention problems and whether
    they might be willing to talk about their experience. Because the interviews would
    last two hours and the participant would have to travel to our offices, I offered
    them a fifty-dollar gift card to participate.


    Those who responded to the ad, eighteen and over, called an 800-number and were
    prescreened for eligibility. Exclusion criteria reflected the emphasis on those
    were not suffering from serious mental illness. I did not interview anyone who
    had ever been hospitalized for a psychiatric condition or was taking an antipsychotic
    or other medication normally intended for those with a serious psychiatric condition.
    I did not interview people were suffering from illnesses as bipolar disorder,
    schizophrenia, or PTSD. Overall, because of these criteria, I did not interview
    more than half of all who responded to my ad.


    In recruiting participants, I selected for a purposive sample of the broader American
    public. A purposive sample is not random or representative. Rather, people are
    sought who constitute a diverse sample of the society from which they are drawn
    (in this case, residents of the United States) and whose experience can illuminate
    the key concerns and topics of interest. As noted in the introduction, I recruited
    and interviewed people'
