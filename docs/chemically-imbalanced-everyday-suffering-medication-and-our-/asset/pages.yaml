    As this brief review shows, no single explanatory format or appropriate intervention
    commanded common assent. Still, there were patterns, and they were not random.
    They suggest certain assumptions, certain ways of imagining, that are held in
    common. I begin with the many people who changed their explanation. All shifted
    toward a medicalizing perspective, and I will consider this shift in relation
    to their interaction with clinicians, nonmedical therapists, and medications.
    These interactions reinforce the perspective, but they do not determine it.


