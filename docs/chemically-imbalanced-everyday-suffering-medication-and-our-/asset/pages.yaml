    # Conclusion


    In making sense of their predicament and the direction that moving forward should
    take, most participants, both explicitly and implicitly, measured themselves against
    a package of social norms—of relationship, emotion, or self—that share a strong
    family resemblance to the liberal ideal of autonomous being. Achieving viable
