  trans: "\n`switch` 语句用于根据表达式的值，从多个代码块中执行一个。\n\n#### 示例：\n\n```java\nint day = 3;\n\
    \nswitch (day) {\n    case 1:\n        System.out.println(\"Monday\");\n     \
    \   break;\n    case 2:\n        System.out.println(\"Tuesday\");\n        break;\n\
    \    case 3:\n        System.out.println(\"Wednesday\");\n        break;\n   \
    \ default:\n        System.out.println(\"Invalid day\");\n        break;\n}\n\
    ```\n\n#### 关键点：\n\n* `switch` 表达式必须求值为 `int`、`char`、`String` 或 `enum` 类型的值。\n\
    * 使用 `case` 标签来定义表达式的可能值。\n* `break` 语句防止执行到后续的 `case`（穿透）。\n* 如果没有 `case` 匹配，则执行\
    \ `default` 块。\n\n通过掌握这些条件语句，你可以编写出根据输入或条件动态做出决策的程序，从而对程序行为进行更好的控制。\n\n## 逻辑运算符\n\
    \n逻辑运算符用于组合多个条件或反转条件的逻辑。逻辑操作的结果始终是一个布尔值（`true` 或 `false`）。这些运算符对于 Java 程序中的决策至关重要。\n\
    \n### 逻辑运算符类型\n\n#### 1. 与 (&&)\n\n当两个条件都为 `true` 时，与运算符返回 `true`。如果任何一个条件为 `false`，结果则为\
    \ `false`。\n\n#### 示例：\n\n```java\nint age = 25;\nboolean isAdult = age >= 18\
    \ && age < 60;\nSystem.out.println(isAdult); // 输出: true\n```\n\n#### 关键点：\n\n\
    * 两个条件都求值为 `true` 时，结果才为 `true`。\n* 常用于检查值是否在范围内。\n\n#### 2. 或 (||)\n\n当至少有一个条件为\
    \ `true` 时，或运算符返回 `true`。只有当两个条件都为 `false` 时，结果才为 `false`。\n\n#### 示例：\n\n```java\n\
    boolean hasPermission = true;\nboolean isAdmin = false;\nboolean canAccess = hasPermission\
    \ || isAdmin;\nSystem.out.println(canAccess); // 输出: true\n```\n\n#### 关键点：\n\n\
    * 至少有一个条件求值为 `true` 时，结果才为 `true`。\n* 有助于根据多个标准授予访问权限。\n\n#### 3. 非 (!)\n\n非运算符反反转条件的逻辑。如果条件为\
    \ `true`，则结果变为 `false`，反之亦然。\n\n#### 示例：\n\n```java\nboolean isActive = false;\n\
    System.out.println(!isActive); // 输出: true\n```\n\n#### 关键点：\n\n* 用于否定布尔值或条件。\n\
    * 常应用于循环和条件语句中，以反转逻辑。\n\n#### 组合逻辑运算符\n\n可以组合逻辑运算符来评估复杂的条件。\n\n#### 示例：\n\n```java\n\
    int age = 30;\nboolean hasID = true;\nboolean canEnter = (age >= 18 && age < 60)\
    \ && hasID;\nSystem.out.println(canEnter); // 输出: true\n```\n\n#### 关键点：\n\n*\
    \ 使用括号对条件分组并控制评估顺序。\n* 在组合多个逻辑运算符时，确保清晰性和可读性。\n\n通过有效理解和使用逻辑运算符，你可以在 Java 程序中构建健壮的条件逻辑，实现动态且智能的决策。\n\
    \n## 循环简介 (for, while, do-while)\n\n循环允许你多次执行代码块，使程序更高效并减少冗余。Java 提供了几种类型的循环以适应不同的用例。\n\
    \n![C:\\Users\\anike\\AppData\\Local\\Microsoft\\Windows\\INetCache\\Content.MSO\\\
    989212FD.tmp](img/image_rsrc3A4.jpg)\n\n### 1. for 循环\n\n当提前已知迭代次数时使用 `for` 循环。它由三部分组成：\n\
    \n* 初始化\n* 条件\n* 增/减\n\n#### 语法：\n\n```java\nfor (initialization; condition; increment/decrement)\
    \ {\n    // 要执行的代码\n}\n```\n\n#### 示例：\n\n```java\nfor (int i = 1; i <= 5; i++)\
    \ {\n    System.out.println(\"Iteration: \" + i);\n}\n```\n\n#### 输出：\n\nIteration:\
    \ 1\nIteration: 2\nIteration: 3\nIteration: 4\nIteration: 5\n\n#### 关键点：\n\n*\
    \ 只要条件为 `true`，循环就会运行。\n* `increment` 或 `decrement`语句在每次迭代后更新循环变量。\n\n### 2. while\
    \ 循环\n\n当迭代次数不预先且取决于条件时使用 `while` 循环。\n\n#### 语法：\n\n```java\nwhile (condition)\
    \ {\n    // 要执行的代码\n}\n```\n\n#### 示例：\n\n```java\nint i = 1;\nwhile (i <= 5)\
    \ {\n    System.out.println(\"Iteration: \" + i);\n    i++;\n}\n```\n\n#### 输出：\n\
    \nIteration: 1\nIteration: 2\nIteration: 3\nIteration: 4\nIteration: 5\n\n####\
    \ 关键点：\n\n* 在执行代码块之前检查条件。\n* 如果初始条件为 `false`，循环体将完全不执行。\n\n### 3. do-while 循环\n\
    \n`do-while` 循环与 `while` 循环类似，但它确保无论条件如何，代码块至少执行一次。\n\n#### 语法：\n\n```java\ndo\
    \ {\n    // 要执行的代码\n} while (condition);\n```\n\n#### 示例：\n\n```java\nint i =\
    \ 1;\ndo {\n    System.out.println(\"Iteration: \" + i);\n    i++;\n} while (i\
    \ <= 5);\n```\n\n#### 输出：\n\nIteration: 1\nIteration: 2\nIteration: 3\nIteration:\
    \ 4\nIteration: 5\n\n#### 关键点：\n\n* 在代码块之后检查条件。\n* 适用于循环需要运行一次的情况。\n\n## break\
    \ 和 continue 语句\n\nJava 提供了 `break` 和 `continue` 语句来改变循环的流。\n\n![C:\\Users\\anike\\\
    AppData\\Local\\Microsoft\\Windows\\INetCache\\Content.MSO\\989212FD.tmp](img/image_rsrc3A4.jpg)\n\
    \n### 1. break 语句\n\n`break` 语句用于提前终止循环。执行时，它将控制权转移到循环之后的语句。\n\n#### 语法：\n\n```java\n\
    for (initialization; condition; increment/decrement) {\n    if (conditionBreak)\
    \ {\n        break;\n    }\n}\n```\n\n#### 示例：\n\n```java\nfor (int i = 1; i <=\
    \ 10; i++) {\n    if (i == 5) {\n        break;\n    }\n    System.out.println(\"\
    Iteration: \" + i);\n}\n```\n\n#### 输出：\n\nIteration: 1\nIteration: 2\nIteration:\
    \ 3\nIteration: 4\n\n#### 关键点：\n\n* `break` 语句立即终止循环。\n* 通常用于根据特定条件终止循环。\n\n###\
    \ 2. continue 语句\n\n`continue` 语句用于跳过循环的当前迭代并进入下一次。与 `break` 不同，它不会终止循环。\n\n####\
    \ 语法：\n\n```java\nfor (initialization; condition; increment/decrement) {\n   \
    \ if (conditionSkip) {\n        continue;\n    }\n}\n```\n\n#### 示例：\n\n```java\n\
    for (int i = 1; i <= 5; i++) {\n    if (i == 3) {\n        continue;\n    }\n\
    \    System.out.println(\"Iteration: \" + i);\n}\n```\n\n#### 输出：\n\nIteration:\
    \ 1\nIteration: 2\nIteration: 4\nIteration: 5\n\n#### 关键点：\n\n* `continue` 语句仅跳过当前迭代。\n\
    * 适用于循环中需要避免某些条件的情况。\n\n## 嵌套循环与最佳实践\n\n### 嵌套循环\n\n嵌套循环是指一个循环放在另一个循环内部。它们通常用于处理多维数据或执行更的操作。\n\
    \n#### 示例：\n\n```java\nfor (int i = 1; i <= 3; i++) {\n    for (int j = 1; j <=\
    \ 3; j++) {\n        System.out.println(\"i: \" + i + \", j: \" + j);\n    }\n\
    }\n```\n\n#### 输出：\n\ni: 1, j: 1\ni: 1, j: 2\ni: 1, j: 3\ni: 2, j: 1\ni: 2, j:\
    \ 2\ni: 2, j: 3\ni: 3, j: 1\ni: 3, j: 2\ni: 3, j: 3\n\n#### 关键点：\n\n* 外层循环运行迭代，对于外层循环的每次迭代，内层循环都会完成其所有的迭代。\n\
    * 常用于打印矩阵或处理多维数组等场景。\n"
