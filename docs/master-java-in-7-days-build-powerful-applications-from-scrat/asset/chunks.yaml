    ## Working with Strings


    Strings are sequences of characters and are widely used in Java programming. Strings
    in Java are objects of the  String class and come with a variety of built-in methods
    for manipulation and processing.


    ![C:\Users\anike\AppData\Local\Microsoft\Windows\INetCache\Content.MSO\FF7BAC21.tmp](image_rsrc3A2.jpg)


    ### Creating Strings


    Strings can be created in two ways:


    #### 1\. Using String Literals


    A string literal is a simple and commonly used way to create strings. Strings
    created this way are stored in the string pool for memory efficiency.


    String greeting = "Hello";


    #### 2\. Using the new Keyword


    This approach explicitly creates a new string object in memory.


    String greeting = new String("Hello");


    ### Common String Methods


    Java provides a variety of methods to work with strings. Here are some of the
    most commonly used methods:


    #### 1. length()


    Returns the number of characters in the string.


    String name = "Java";


    System.out.println(name.length()); // Output: 4


    #### 2. chatAt(index)


    Returns the character at the specified index (0-based).


    System.out.println(name.charAt(1)); // Output: a


    #### 3. substring(start, end)


    Extracts a substring from the string. The  start index is inclusive, and the  end
    index is exclusive.


    System.out.println(name.substring(1, 3)); // Output: av


    #### 4. toUpperCase() and toLowerCase()


    Converts the string to upper or lower case.


    System.out.println(name.toUpperCase()); // Output: JAVA


    System.out.println(name.toLowerCase()); // Output: java


    #### 5. concat()


    Concatenates (joins) two strings.


    String welcome = "Hello, ";


    System.out.println(welcome.concat(name)); // Output: Hello, Java


    ### Example Program


    Here’s an example program demonstrating some of the above methods:


    public class StringExample {


    public static void main(String[] args) {


    String greeting = "Hello";


    String language = "Java";


    // Length of the string


    System.out.println("Length: " + greeting.length());


    // Character at index


    System.out.println("Character at index 1: " + greeting.charAt(1));


    // Substring


    System.out.println("Substring: " + greeting.substring(1, 4));


    // Case conversion


    System.out.println("Uppercase: " + language.toUpperCase());


    System.out.println("Lowercase: " + language.toLowerCase());


    // String concatenation


    System.out.println("Greeting: " + greeting.concat(", ").concat(language));


    }


    }


    #### Output:


    Length: 5


    Character at index 1: e


    Substring: ell


    Uppercase: JAVA


    Lowercase: java


    Greeting: Hello, Java


    By understanding and using these string methods, you can efficiently manipulate
    and process textual data in Java programs.


    ## Type Casting and Type Conversion


    Type casting refers to converting a variable from one data type to another. It
    is a fundamental concept in Java and can be categorized into two types: implicit
    (widening) and explicit (narrowing) conversions.


    ### 1\. Implicit Casting (Widening Conversion)


    Implicit casting happens automatically when converting a smaller data type to
    a larger data type. Since there is no risk of data loss, the compiler handles
    it without manual intervention.


    #### Example:


    int num = 10;


    double decimal = num; // Implicit casting


    System.out.println(decimal); // Output: 10.0


    #### Key Points:


    *   Works from smaller to larger data types (e.g.,  byte ->  short ->  int ->  long
    ->  float ->  double).


    *   No data loss or precision issues.


    ### 2\. Explicit Casting (Narrowing Conversion)


    Explicit casting is required when converting a larger data type to a smaller data
    type. This process can result in data loss or precision issues, so it must be
    performed manually using a cast operator.


    #### Example:


    double decimal = 10.5;


    int num = (int) decimal; // Explicit casting


    System.out.println(num); // Output: 10


    #### Key Points:


    *   Works from larger to smaller data types (e.g.,  double ->  float ->  long
    ->  int ->  short ->  byte).


    *   May result in loss of precision or truncation of values.


    ### 3\. Using Wrapper Classes


    Java provides wrapper classes to convert between primitive types and their corresponding
    object types. Wrapper classes also include methods for type conversion.


    #### Common Wrapper Classes:


    *   Integer


    *   Double


    *   Boolean


    *   Character


    #### Example: Converting Strings to Primitives


    String str = "123";


    int num = Integer.parseInt(str); // Converts string to integer


    System.out.println(num + 10); // Output: 133


    #### Example: Converting Primitives to Strings


    int num = 123;


    String str = Integer.toString(num); // Converts integer to string


    System.out.println(str + " is now a string");


    #### Additional Methods:


    *   Double.parseDouble(String) for converting strings to doubles.


    *   Boolean.parseBoolean(String) for converting strings to booleans.


    *   String.valueOf() for converting primitives to strings.


    ### Summary


    By mastering type casting and type conversion in Java, you can:


    *   Safely handle data type conversions in your programs.


    *   Avoid common pitfalls like data loss during narrowing conversions.


    *   Utilize wrapper classes for advanced type manipulations.


    Understanding these core concepts equips you to work with variables, data types,
    and operators more effectively in Java!


