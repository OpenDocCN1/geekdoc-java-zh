    * [1200+ Java 面试题 - 练习测试](https://www.udemy.com/course/java-interview-questions-practice-tests/?referralCode=4C7BD0FD4AAC5AB08A8B)\n\
    \n### 文档与社区：\n\n* `Oracle` 官方 Java 文档：Java 特性和 API 的权威性指南。\n* 加入如 `Stack Overflow`、`Reddit`\
    \ 的 `r/Java` 以及 `Java Discord` 服务器等社区，与学习者和专家互动。\n\n### 应用：\n\n通过这些应用增强你的 Java\
    \ 学习和实践：\n\n* [Java Programs](https://play.google.com/store/apps/details?id=com.aniketjain.javaexamples):\
    \ 探索各种 Java 示例以便快速参考。\n* [Java Programs: 500+ Examples](https://play.google.com/store/apps/details?id=com.aniketjain.javaprograms):\
    \ 访问包含 500 多个 Java 程序的全面集合。\n\n## 最后的鼓励\n\n学习 Java 是对你未来的投资，完成这段基础性旅程是向前的一大步。记住，编程不仅仅是编写代码——它还关乎解决问题、逻辑思考和不断改进。以下是一些需要记在心的指导原则：\n\
    \n* `经常练习`：坚持是精通的关键。每天或每周花时间写代码。\n* `需要时寻求帮助`：遇到挑战时，与社区、论坛或同伴交流。\n* `构建作品集`：展示你的项目以向潜在雇主证明你的技能。\n\
    * `拥抱这段旅程`：编程既需要创造力也需要逻辑。享受构建有意义的事物的过程。\n\n### 前行之路\n\nJava 开发的世界广阔且充满机会。通过奉献、坚持和对学习的热情，你可以取得巨大的成就。无论你的目标是开发应用程序、贡献开源还是追求认证，你所获得的技能都将成为坚实的基础。继续编码，继续探索，永不停成长——你作为\
    \ Java 开发者的旅程才刚刚开始！\n\n# 附录\n\n## Java 查表\n\n此快速参考指南涵盖了基本的 Java 概念、语法和命令。使用此查表来复习知识。\n\
    \n### 数据类型和变量\n\n基本类型：\n\n```java\nint number = 42;\nfloat price = 19.99f;\nchar\
    \ grade = 'A';\nboolean isActive = true;\n```\n\n非基本类型：\n\n```java\nString text\
    \ = \"Hello World!\";\nint[] numbers = {1, 2, 3};\n```\n\n### 控制流\n\nIf-Else:\n\
    \n```java\nif (condition) {\n    // 代码\n} else {\n    // 代码\n}\n```\n\nSwitch:\n\
    \n```java\nswitch (value) {\n    case 1:\n        break;\n    default:\n     \
    \   break;\n}\n```\n\n循环：\n\n```java\nfor (int i = 0; i < 10; i++) {\n    // 代码\n\
    }\n\nwhile (condition) {\n    // 代码\n}\n\ndo {\n    // 代码\n} while (condition);\n\
    ```\n\n### 方法\n\n```java\npublic int add(int a, int b) {\n    return a + b;\n\
    }\n```\n\n### 对象面向编程\n\n类和对象：\n\n```java\npublic class Person {\n    String name;\n\
    \    int age;\n    void introduce() {}\n}\n```\n\n继承：\n\n```java\npublic class\
    \ Animal {\n    void eat() {}\n}\n```\n\n## 练习\n\n### 练习 1：阶乘\n\n编写一个计算给定数字阶的程序。\n\
    \n```java\npublic class Factorial {\n    public static int calculate(int n) {\n\
    \        if (n == 0) {\n            return 1;\n        }\n        return n * calculate(n\
    \ - 1);\n    }\n\n    public static void main(String[] args) {\n        int number\
    \ = 5;\n        System.out.println(\"Factorial of \" + number + \" is: \" + calculate(number));\n\
    \    }\n}\n```\n\n### 练习 2：回文\n\n编写一个程序检查字符串是否为回文。\n\n```java\npublic class Palindrome\
    \ {\n    public static boolean isPalindrome(String str) {\n        String reversed\
    \ = new StringBuilder(str).reverse().toString();\n        return str.equalsIgnoreCase(reversed);\n\
    \    }\n\n    public static void main(String[] args) {\n        String word =\
    \ \"madam\";\n        System.out.println(\"Is \" + word + \" palindrome? \" +\
    \ isPalindrome(word));\n    }\n}\n```\n\n### 练习 3：数组中的最大元素\n\n编写一个程序找到数组中最大的数字。\n\
    \n```java\npublic class LargestElement {\n    public static int findLargest(int[]\
    \ array) {\n        int max = array[0];\n        for (int num : array) {\n   \
    \         if (num > max) {\n                max = num;\n            }\n      \
    \  }\n        return max;\n    }\n\n    public static void main(String[] args)\
    \ {\n        int[] numbers = {1, 3, 7, 2, 5};\n        System.out.println(\"Largest\
    \ number: \" + findLargest(numbers));\n    }\n}\n```\n\n"
