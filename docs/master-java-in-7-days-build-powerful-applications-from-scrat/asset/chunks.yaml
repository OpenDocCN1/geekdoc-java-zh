    \ 包中提供了几个类来高效且有效地处理文件操作。\n\n### 读取文件\n\n`FileReader` 类用于从文件中读取字符流。它逐字符地读取数据，是处理文本文件的理想选择。\n\
    \n#### 示例：\n\n```java\nimport java.io.*;\n\npublic class FileReadExample {\n \
    \   public static void main(String[] args) {\n        try (FileReader reader =\
    \ new FileReader(\"example.txt\")) {\n            int character;\n           \
    \ while ((character = reader.read()) != -1) {\n                System.out.print((char)\
    \ character);\n            }\n        } catch (IOException e) {\n            System.out.println(\"\
    Error reading file: \" + e.getMessage());\n        }\n    }\n}\n```\n\n#### 解释：\n\
    \n* 创建 `FileReader` 对象时以文件名作为其参数。\n* `read()` 方法每次读取一个字符，并在到达文件末时返回 `-1`。\n* `try-with-resources`\
    \ 语句确保 `FileReader` 在使用后自动关闭。\n\n### 写入文件\n\n`FileWriter` 类用于向文件写入字符流。它允许你创建新内容或覆盖现有文件。\n\
    \n#### 示例：\n\n```java\nimport java.io.*;\n\npublic class FileWriteExample {\n\
    \    public static void main(String[] args) {\n        try (FileWriter writer\
    \ = new FileWriter(\"output.txt\")) {\n            writer.write(\"Hello, File\
    \ I/O!\");\n        } catch (IOException e) {\n            System.out.println(\"\
    Error writing to file: \" + e.getMessage());\n        }\n    }\n}\n```\n\n####\
    \ 解释：\n\n* 创建 `FileWriter` 对象时以目标文件名作为其参数。\n* `write()` 方法将指定的字符串写入文件。\n* `try-with-resources`\
    \ 语句确保 `FileWriter` 在使用后自动关闭。\n\n### 关键点：\n\n1. 错误处理：始终使用 `try-catch` 处理异常，以防止文件操作期间发生崩溃。\n\
    2. 资源管理：使用 `try-with-resources` 确保文件流自动关闭。\n3. 字符流与字节流：`FileReader` 和 `FileWriter`\
    \ 类处理字符数据，而 `FileInputStream` 和 `FileOutputStream` 处理原始字节数据。\n\n通过掌握文件读取和写入技术，你可以构建出高效处理数据存储和检索的应用程序。\n\
    \n## 使用 BufferedReader 和 BufferedWriter\n\n缓冲类通过缓冲输入和输出流来提高文件操作的效率。这些类是 `java.io`\
    \ 包的一部分，提供了高效的文本读写性能。\n\n### BufferedReader\n\n`BufferedReader` 类通过缓冲输入流中的字符来高效读取文本。它显著减少了频繁\
    \ I/O 操作的开销。\n\n#### 示例（读取文件）：\n\n```java\nimport java.io.*;\n\npublic class BufferedReaderExample\
    \ {\n    public static void main(String[] args) {\n        try (BufferedReader\
    \ br = new BufferedReader(new FileReader(\"example.txt\"))) {\n            String\
    \ line;\n            while ((line = br.readLine()) != null) {\n              \
    \  System.out.println(line);\n            }\n        } catch (IOException e) {\n\
    \            System.out.println(\"Error: \" + e.getMessage());\n        }\n  \
    \  }\n}\n```\n\n#### 解释：\n\n* `BufferedReader` 对象封装 `FileReader` 进行缓冲，允许使用 `readLine()`\
    \ 方法按行。\n* `try-with-resources` 语句确保 `BufferedReader` 自动关闭。\n\n### BufferedWriter\n\
    \n`BufferedWriter` 类通过缓冲输出流来高效写入文本。这减少了写入操作的次数，提高了写入大量数据时的性能。\n\n#### 示例（写入文件）：\n\
    \n```java\nimport java.io.*;\n\npublic class BufferedWriterExample {\n    public\
    \ static void main(String[] args) {\n        try (BufferedWriter bw = new BufferedWriter(new\
    \ FileWriter(\"output.txt\"))) {\n            bw.write(\"Writing with BufferedWriter.\"\
    );\n        } catch (IOException e) {\n            System.out.println(\"Error:\
    \ \" + e.getMessage());\n        }\n    }\n}\n```\n\n#### 解释：\n\n* `BufferedWriter`\
    \ 对象封装 `FileWriter` 进行字符缓冲。\n* `try-with-resources` 语句确保资源在使用后被关闭。\n\n### 关键点：\n\
    \n1. 性能：缓冲类通过一次处理较大块的数据来减少读写操作的次数。\n2. 资源管理：始终使用 `try-with-resources` 以确保文件流正确关闭。\n\
    \n通过掌握 `BufferedReader` 和 `BufferedWriter` 的使用，你可以更高效地处理文件 I/O 操作，并编写能够无缝管理大型文本数据的程序。\n\
    \n"
- fmt: "\n# Key Concepts\n\n#### 1. Class\nA class acts as a blueprint for creating\
    \ objects. It defines the structure and behavior (attributes and methods) that\
    \ the objects will have.\n\n##### Example:\n```java\npublic class Car {\n    //\
    \ Attributes\n    String brand;\n    String color;\n\n    // Method\n    public\
    \ void start() {\n        System.out.println(\"Car is starting...\");\n    }\n\
    }\n```\n\n#### 2. Object\nAn object is an instance of a class. Objects are used\
    \ to represent and interact with real-world entities.\n\n##### Example:\n```java\n\
    public class Main {\n    public static void main(String[] args) {\n        Car\
    \ myCar = new Car(); // Creating an object of the Car class\n        myCar.brand\
    \ = \"Toyota\";\n        myCar.color = \"Red\";\n        myCar.start(); // Calling\
    \ the start method\n    }\n}\n```\n\n#### 3. Attributes\nAttributes are variables\
    \ within a class that represent the state or properties of an object.\n\n#####\
    \ Example:\n```java\nmyCar.brand = \"Toyota\"; // Setting the brand attribute\n\
    myCar.color = \"Red\";   // Setting the color attribute\n```\n\n#### 4. Methods\n\
    Methods are functions defined within a class that specify the actions an object\
    \ can perform.\n\n##### Example:\n```java\nmyCar.start(); // Invoking the start\
    \ method\n```\n\n# Advantages of OOP\n\n#### 1. Code Reusability\nOOP enables\
    \ code reuse through inheritance, allowing common functionality to be defined\
    \ once and used by multiple classes.\n\n##### Example:\n```java\npublic class\
    \ Vehicle {\n    public void move() {\n        System.out.println(\"Vehicle is\
    \ moving...\");\n    }\n}\n\npublic class Car extends Vehicle {\n    // Inherits\
    \ the move method from Vehicle\n}\n```\n\n#### 2. Modularity\nDivide code into\
    \ smaller, manageable parts, making it easier to debug, test, and maintain.\n\n\
    ##### Example:\nEach class in an OOP design typically represents a single responsibility,\
    \ such as `Car`, `Engine`, or `Driver`.\n\n#### 3. Maintainability\nEncapsulation\
    \ ensures that changes in one part of the code do not affect others, promoting\
    \ better organization and easier updates.\n\n##### Example:\n```java\npublic class\
    \ Account {\n    private double balance; // Encapsulated attribute\n\n    public\
    \ void deposit(double amount) {\n        balance += amount;\n    }\n\n    public\
    \ double getBalance() {\n        return balance;\n    }\n}\n```\n\n#### 4. Scalability\n\
    OOP designs are easily extendable to include new features or components by adding\
    \ new classes or methods.\n\n##### Example:\nAdding new vehicle types like `Truck`\
    \ or `Bike` can be done by extending the `Vehicle` class.\n\nBy mastering OOP\
    \ concepts, you can design systems that are efficient, scalable, and easier to\
    \ understand. These principles form the foundation of modern software development\
    \ and are essential for building robust applications.\n\n# Creating Classes and\
    \ Objects\n\nUnderstanding how to define classes and create objects is the foundation\
    \ of Object-Oriented Programming (OOP). Classes define the blueprint for objects,\
    \ while objects are instances of those classes. This relationship allows developers\
    \ to model real-world entities and their behaviors in a structured way.\n\n###\
    \ Defining a Class\nA class is defined using the `class` keyword, followed by\
    \ its name and body. It contains attributes (variables) and methods (functions)\
    \ that represent the state and behavior of the object.\n\n#### Example: Defining\
    \ a Person Class\n```java\npublic class Person {\n    String name; // Attribute\n\
    \    int age;     // Attribute\n\n    void introduce() { // Method\n        System.out.println(\"\
    Hi, my name is \" + name);\n    }\n}\n```\n\n### Creating Objects\nTo create an\
    \ object, use the `new` keyword, which allocates memory for the object and initializes\
    \ its attributes.\n\n#### Example:\n```java\npublic class Main {\n    public static\
    \ void main(String[] args) {\n        Person person = new Person(); // Creating\
    \ an object\n        person.name = \"Alice\"; // Setting attributes\n        person.age\
    \ = 25;\n        person.introduce(); // Calling a method\n    }\n}\n```\n\n####\
    \ Output:\nHi, my name is Alice\n\n### Example: A Class Representing a Car\n####\
    \ Code:\n```java\npublic class Car {\n    String brand; // Attribute\n    int\
    \ speed;    // Attribute\n\n    void accelerate() { // Method\n        speed +=\
    \ 10;\n        System.out.println(brand + \" is now moving at \" + speed + \"\
    \ km/h\");\n    }\n\n    public static void main(String[] args) {\n        Car\
    \ car = new Car();\n        car.brand = \"Toyota\"; // Setting attributes\n  \
    \      car.speed = 50;\n        car.accelerate(); // Calling a method\n    }\n\
    }\n```\n\n#### Output:\nToyota is now moving at 60 km/h\n\n### Key Points\n1.\
    \ **Classes and Objects Relationship:**\n   - A class is a template, and an object\
    \ is a specific instance of that template.\n2. **Attributes and Methods:**\n \
    \  - Attributes represent the state of an object, and methods define its behavior.\n\
    3. **Initialization:**\n   - Always initialize attributes to meaningful values\
    \ before using them.\n4. **Encapsulation:**\n   - Use access modifiers (like `private`\
    \ or `public`) to control access to attributes and methods, ensuring data integrity.\n\
    \nBy mastering the process of defining classes and creating objects, you unlock\
    \ the ability to design programs that mirror real-world systems. These skills\
    \ form the basis for developing modular, reusable, and maintainable applications.\n\
    \n# Methods and Attributes\n\nIn Object-Oriented Programming, methods and attributes\
    \ define the behavior and state of a class. Together, they provide functionality\
    \ and represent the characteristics of objects.\n\n![C:\\Users\\anike\\AppData\\\
