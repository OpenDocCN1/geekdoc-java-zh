    \nWhile arrays are powerful, their fixed size can sometimes be a limitation. The\
    \ `ArrayList` class in Java provides a dynamic alternative, allowing you to store\
    \ elements without predefining the size. It is part of Java's Collections Framework\
    \ and offers several convenient features for managing collections of data.\n\n\
    ### Declaring an ArrayList\nTo use `ArrayList`, you need to import the `java.util.ArrayList`\
    \ class.\n\n### Example:\n```java\nimport java.util.ArrayList; // Import the ArrayList\
    \ class\npublic class ArrayListExample {\n    public static void main(String[]\
    \ args) {\n        // Declaring an ArrayList of integers\n        ArrayList<Integer>\
    \ numbers = new ArrayList<>();\n        // Adding elements\n        numbers.add(10);\n\
    \        numbers.add(20);\n        numbers.add(30);\n        // Printing the ArrayList\n\
    \        System.out.println(\"ArrayList: \" + numbers);\n    }\n}\n```\n\n####\
    \ Output:\n```\nArrayList: [10, 20, 30]\n```\n\n### Key Features of ArrayList\n\
    \n#### 1. Dynamic Size\nUnlike arrays, an `ArrayList` can grow or shrink as elements\
    \ are added or removed. You don't need to specify a fixed size during declaration.\n\
    \n#### 2. Type Safety\nWith generics, `ArrayList` allows you to specify the type\
    \ of elements it will store, ensuring type safety at compile time.\n\n### Example:\n\
    ```java\nArrayList<String> names = new ArrayList<>();\nnames.add(\"Alice\");\n\
    names.add(\"Bob\");\nSystem.out.println(names); // Outputs: [Alice, Bob]\n```\n\
    \n#### 3. Built-in Methods\nThe `ArrayList` class includes several methods for\
    \ adding, removing, and modifying elements:\n\n##### Common Methods:\n- `add(element)`:\
    \ Adds an element to the end of the list.\n- `add(index, element)`: Inserts an\
    \ element at the specified index.\n- `remove(index)`: Removes the element at the\
    \ specified index.\n- `get(index)`: Retrieves the element at the specified index.\n\
    - `set(index, element)`: Replaces the element at the specified index.\n- `size()`:\
    \ Returns the number of elements in the list.\n\n### Example:\n```java\nArrayList<String>\
    \ fruits = new ArrayList<>();\nfruits.add(\"Apple\");\nfruits.add(\"Banana\");\n\
    fruits.add(\"Cherry\");\nSystem.out.println(\"Original List: \" + fruits);\n//\
    \ Accessing elements\nSystem.out.println(\"First Element: \" + fruits.get(0));\n\
    // Modifying elements\nfruits.set(1, \"Blueberry\");\nSystem.out.println(\"After\
    \ Modification: \" + fruits);\n// Removing an element\nfruits.remove(2);\nSystem.out.println(\"\
    After Removal: \" + fruits);\n// Size of the list\nSystem.out.println(\"Size:\
    \ \" + fruits.size());\n```\n\n#### Output:\n```\nOriginal List: [Apple, Banana,\
    \ Cherry]\nFirst Element: Apple\nAfter Modification: [Apple, Blueberry, Cherry]\n\
    After Removal: [Apple, Blueberry]\nSize: 2\n```\n\nBy using `ArrayList` and other\
    \ classes in Java's Collections Framework, you can efficiently manage and manipulate\
    \ dynamic collections of data, providing more flexibility and functionality than\
    \ traditional arrays.\n\n## Adding, Modifying, and Deleting Elements\nThe `ArrayList`\
    \ class provides several methods for adding, modifying, and deleting elements,\
    \ making it a versatile tool for managing dynamic collections.\n\n![C:\\Users\\\
    anike\\AppData\\Local\\Microsoft\\Windows\\INetCache\\Content.MSO\\1998C57F.tmp](image_rsrc3AA.jpg)\n\
    \n### Adding Elements\nYou can use the `add()` method to insert elements at the\
    \ end of the list or at a specified index.\n\n### Example:\n```java\nimport java.util.ArrayList;\n\
    public class AddExample {\n    public static void main(String[] args) {\n    \
    \    ArrayList<Integer> numbers = new ArrayList<>();\n        // Adding elements\
    \ to the end of the list\n        numbers.add(10);\n        numbers.add(20);\n\
    \        numbers.add(30);\n        // Adding an element at a specific index\n\
    \        numbers.add(1, 15);\n        System.out.println(\"ArrayList: \" + numbers);\n\
    \    }\n}\n```\n\n#### Output:\n```\nArrayList: [10, 15, 20, 30]\n```\n\n### Modifying\
    \ Elements\nThe `set()` method is used to update the value of an existing element\
    \ at a specific index.\n\n### Example:\n```java\nimport java.util.ArrayList;\n\
    public class ModifyExample {\n    public static void main(String[] args) {\n \
    \       ArrayList<Integer> numbers = new ArrayList<>();\n        numbers.add(10);\n\
    \        numbers.add(20);\n        numbers.add(30);\n        // Modifying the\
    \ element at index 1\n        numbers.set(1, 25);\n        System.out.println(\"\
    ArrayList: \" + numbers);\n    }\n}\n```\n\n#### Output:\n```\nArrayList: [10,\
    \ 25, 30]\n```\n\n### Deleting Elements\nThe `remove()` method allows you to delete\
    \ elements from the `ArrayList` by their index or by their value.\n\n### Example:\n\
    ```java\nimport java.util.ArrayList;\npublic class DeleteExample {\n    public\
    \ static void main(String[] args) {\n        ArrayList<Integer> numbers = new\
    \ ArrayList<>();\n        numbers.add(10);\n        numbers.add(20);\n       \
    \ numbers.add(30);\n        // Removing an element by index 1\n        numbers.remove(1);\n\
    \        // Removing an element by value\n        numbers.remove(Integer.valueOf(10));\n\
    \        System.out.println(\"ArrayList: \" + numbers);\n    }\n}\n```\n\n####\
    \ Output:\n```\nArrayList: [30]\n```\n\n### Checking for Elements\nThe `contains()`\
    \ method checks whether a specified element exists in the `ArrayList`. It returns\
    \ a boolean value (`true` or false).\n\n### Example:\n```java\nimport java.util.ArrayList;\n\
    public class CheckExample {\n    public static void main(String[] args) {\n  \
    \      ArrayList<Integer> numbers = new ArrayList<>();\n        numbers.add(10);\n\
    \        numbers.add(20);\n        numbers.add(30);\n        // Checking if the\
    \ ArrayList contains a specific element\n        System.out.println(\"Contains\
    \ 20? \" + numbers.contains(20));\n        System.out.println(\"Contains 40? \"\
    \ + numbers.contains(40));\n    }\n}\n```\n\n#### Output:\n```\nContains 20? true\n\
    Contains 40? false\n```\n"
