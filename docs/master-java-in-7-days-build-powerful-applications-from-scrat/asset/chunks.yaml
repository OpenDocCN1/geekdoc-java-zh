    \n### Methods\nMethods are functions defined within a class that specify the actions\
    \ or behaviors that objects can perform. They are broadly categorized into two\
    \ types:\n\n#### 1. Instance Methods\nInstance methods operate on instance-specific\
    \ data. These methods are invoked on an instance of the class.\n\n#### 2. Static\
    \ Methods\nStatic methods belong to the class rather than any object. They can\
    \ be called directly using the class name and do not require an instance.\n\n\
    #### Example:\n```java\npublic class Calculator {\n    // Instance Method\n  \
    \  int add(int a, int b) {\n        return a + b;\n    }\n\n    // Static Method\n\
    \    static void greet() {\n        System.out.println(\"Welcome to the Calculator\
