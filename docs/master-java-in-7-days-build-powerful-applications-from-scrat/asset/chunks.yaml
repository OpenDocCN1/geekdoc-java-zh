    \n```java\nint age = 18;\nif (age >= 18) {\n    System.out.println(\"You can vote.\"\
    );\n}\n```\n\n#### 关键点：\n\n*   括号内的条件必须求值为布尔值（`true` 或 `false`）。\n*   如果条件为 `false`，则跳过该块。\n\
    \n### 2. `if-else` 语句\n\n`if-else` 语句在条件为 `false` 时提供备代码块。\n\n#### 示例：\n\n```java\n\
    int age = 16;\nif (age >= 18) {\n    System.out.println(\"You can vote.\");\n\
    } else {\n    System.out.println(\"You are not eligible to vote.\");\n}\n```\n\
    \n#### 关键点：\n\n*   `else` 块是可选的。\n*   执行执行一个块：条件为 `true` 时执行 `if` 块，为 `false`\
    \ 时执行 `else` 块。\n\n### 3. `else if` 阶梯\n\n`else if` 语句允许顺序测试多个条件。程序将执行第一个条件为 `true`\
    \ 的块。\n\n#### 示例：\n\n```java\nint marks = 85;\nif (marks >= 90) {\n    System.out.println(\"\
    Grade: A\");\n} else if (marks >= 75) {\n    System.out.println(\"Grade: B\");\n\
    } else if (marks >= 50) {\n    System.out.println(\"Grade: C\");\n} else {\n \
    \   System.out.println(\"Grade: F\");\n}\n```\n\n#### 关键点：\n\n*   可以按顺序评估多个条件。\n\
    *   即使多个条件为 `true`，也只会执行一个块。\n*   如果所有条件都不为 `true`，则执行 `else` 块。\n\n"
- fmt: "\nThe `switch` statement is used to execute one block of code out of many,\
    \ based on the value of an expression.\n\n#### Example:\n\n```java\nint day =\
    \ 3;\n\nswitch (day) {\n    case 1:\n        System.out.println(\"Monday\");\n\
    \        break;\n    case 2:\n        System.out.println(\"Tuesday\");\n     \
    \   break;\n    case 3:\n        System.out.println(\"Wednesday\");\n        break;\n\
    \    default:\n        System.out.println(\"Invalid day\");\n        break;\n\
    }\n```\n\n#### Key Points:\n\n* The `switch` expression must evaluate to a value\
    \ of type `int`, `char`, `String`, or `enum`.\n* Use `case` labels to define possible\
    \ values for the expression.\n* The `break` statement prevents fall-through to\
    \ subsequent cases.\n* The `default` block executes if no `case` matches.\n\n\
    By mastering these conditional statements, you can write programs that make decisions\
    \ dynamically based on input or conditions, enabling greater control over program\
    \ behavior.\n\n## Logical Operators\n\nLogical operators are used to combine multiple\
    \ conditions or invert the logic of a condition. The result of a logical operation\
    \ is always a boolean value (`true` or `false`). These operators are essential\
    \ for decision-making in Java programs.\n\n### Types of Logical Operators\n\n\
    #### 1. AND (&&)\n\nThe AND operator returns `true` if both conditions are `true`.\
    \ If any condition is `false`, the result is `false`.\n\n#### Example:\n\n```java\n\
    int age = 25;\nboolean isAdult = age >= 18 && age < 60;\nSystem.out.println(isAdult);\
    \ // Output: true\n```\n\n#### Key Points:\n\n* Both conditions must evaluate\
    \ to `true` for the result to be `true`.\n* Commonly used to check if a value\
    \ lies within a range.\n\n#### 2. OR (||)\n\nThe OR operator returns `true` if\
    \ at least one condition is `true`. The result is `false` only if both conditions\
    \ are `false`.\n\n#### Example:\n\n```java\nboolean hasPermission = true;\nboolean\
    \ isAdmin = false;\nboolean canAccess = hasPermission || isAdmin;\nSystem.out.println(canAccess);\
    \ // Output: true\n```\n\n#### Key Points:\n\n* At least one condition must evaluate\
    \ to `true` for the result to be `true`.\n* Useful for granting access based on\
    \ multiple criteria.\n\n#### 3. NOT (!)\n\nThe NOT operator inverts the logic\
    \ of a condition. If the condition is `true`, the result becomes `false`, and\
    \ vice versa.\n\n#### Example:\n\n```java\nboolean isActive = false;\nSystem.out.println(!isActive);\
    \ // Output: true\n```\n\n#### Key Points:\n\n* Used to negate a boolean value\
    \ or condition.\n* Commonly applied in loops and conditional statements to reverse\
    \ logic.\n\n### Combined Logical Operators\n\nLogical operators can be combined\
    \ to evaluate complex conditions.\n\n#### Example:\n\n```java\nint age = 30;\n\
    boolean hasID = true;\nboolean canEnter = (age >= 18 && age < 60) && hasID;\n\
    System.out.println(canEnter); // Output: true\n```\n\n#### Key Points:\n\n* Use\
    \ parentheses to group conditions and control evaluation order.\n* Ensure clarity\
    \ and readability when combining multiple logical operators.\n\nBy understanding\
    \ and using logical operators effectively, you can build robust conditional logic\
    \ in your Java programs, enabling dynamic and intelligent decision-making.\n\n\
    ## Introduction to Loops (for, while, do-while)\n\nLoops allow you to repeat a\
    \ block of code multiple times, making your programs more efficient and reducing\
