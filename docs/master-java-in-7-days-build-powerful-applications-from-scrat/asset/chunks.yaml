    on the value of an expression.


    #### Example:


    int day = 3;


    switch (day) {


    case 1:


    System.out.println("Monday");


    break;


    case 2:


    System.out.println("Tuesday");


    break;


    case 3:


    System.out.println("Wednesday");


    break;


    default:


    System.out.println("Invalid day");


    break;


    }


    #### Key Points:


    *   The  switch expression must evaluate to a value of type  int,  char,  String,
    or  enum.


    *   Use  case labels to define possible values for the expression.


    *   The  break statement prevents fall-through to subsequent cases.


    *   The  default block executes if no  case matches.


    By mastering these conditional statements, you can write programs that make decisions
    dynamically based on input or conditions, enabling greater control over program
    behavior.


    ## Logical Operators


    Logical operators are used to combine multiple conditions or invert the logic
    of a condition. The result of a logical operation is always a boolean value (true
    or  false). These operators are essential for decision-making in Java programs.


    ### Types of Logical Operators


    #### 1\. AND (&&)


    The AND operator returns  true if both conditions are  true. If any condition
    is  false, the result is  false.


    ##### Example:


    int age = 25;


    boolean isAdult = age >= 18 && age < 60;


    System.out.println(isAdult); // Output: true


    #### Key Points:


    *   Both conditions must evaluate to  true for the result to be  true.


    *   Commonly used to check if a value lies within a range.


    #### 2\. OR (||)


    The OR operator returns  true if at least one condition is  true. The result is  false
    only if both conditions are  false.


    ##### Example:


    boolean hasPermission = true;


    boolean isAdmin = false;


    boolean canAccess = hasPermission || isAdmin;


    System.out.println(canAccess); // Output: true


    #### Key Points:


    *   At least one condition must evaluate to  true for the result to be  true.


    *   Useful for granting access based on multiple criteria.


    #### 3\. NOT (!)


    The NOT operator inverts the logic of a condition. If the condition is  true,
    the result becomes  false, and vice versa.


    ##### Example:


    boolean isActive = false;


    System.out.println(!isActive); // Output: true


    #### Key Points:


    *   Used to negate a boolean value or condition.


    *   Commonly applied in loops and conditional statements to reverse logic.


    ### Combined Logical Operators


    Logical operators can be combined to evaluate complex conditions.


    ##### Example:


    int age = 30;


    boolean hasID = true;


    boolean canEnter = (age >= 18 && age < 60) && hasID;


    System.out.println(canEnter); // Output: true


    #### Key Points:


    *   Use parentheses to group conditions and control evaluation order.


    *   Ensure clarity and readability when combining multiple logical operators.


    By understanding and using logical operators effectively, you can build robust
    conditional logic in your Java programs, enabling dynamic and intelligent decision-making.


    ## Introduction to Loops (for, while, do-while)


    Loops allow you to repeat a block of code multiple times, making your programs
    more efficient and reducing redundancy. Java provides several types of loops to
    suit different use cases.


    ![C:\Users\anike\AppData\Local\Microsoft\Windows\INetCache\Content.MSO\989212FD.tmp](image_rsrc3A4.jpg)


    ### 1\. for Loop


    The  for loop is used when the number of iterations is known beforehand. It consists
    of three parts:


    *   Initialization


    *   Condition


    *   Increment/Decrement


    #### Syntax:


    for (initialization; condition; increment/decrement) {


    // Code to be executed


    }


    #### Example:


    for (int i = 1; i <= 5; i++) {


    System.out.println("Iteration: " + i);


    }


    #### Output:


    Iteration: 1


    Iteration: 2


    Iteration: 3


    Iteration: 4


    Iteration: 5


    #### Key Points:


    *   The loop runs as long as the condition is  true.


    *   The  increment or  decrement statement updates the loop variable after each
    iteration.


    ### 2\. while Loop


    The  while loop is used when the number of iterations is not predetermined and
    depends on a condition.


    #### Syntax:


    while (condition) {


    // Code to be executed


    }


    #### Example:


    int i = 1;


    while (i <= 5) {


    System.out.println("Iteration: " + i);


    i++;


    }


    #### Output:


    Iteration: 1


    Iteration: 2


    Iteration: 3


    Iteration: 4


    Iteration: 5


    #### Key Points:


    *   The condition is checked before executing the code block.


    *   If the condition is  false initially, the loop body will not execute at all.


    ### 3\. do-while Loop


    The  do-while loop is similar to the  while loop but ensures that the code block
    is executed at least once, regardless of the condition.


    #### Syntax:


    do {


    // Code to be executed


    } while (condition);


    #### Example:


    int i = 1;


    do {


    System.out.println("Iteration: " + i);


    i++;


    } while (i <= 5);


    #### Output:


    Iteration: 1


    Iteration: 2


    Iteration: 3


    Iteration: 4


    Iteration: 5


    #### Key Points:


    *   The condition is checked after the code block executes.


    *   Useful when the loop body needs to run at least once regardless of the condition.


    By understanding and using these loop constructs effectively, you can write concise
    and efficient code to handle repetitive tasks in your Java programs.


    ## Break and Continue Statements


    Java provides  break and  continue statements to alter the normal flow of loops.
    These control flow statements help in efficiently managing iterations based on
    conditions.


    ![C:\Users\anike\AppData\Local\Microsoft\Windows\INetCache\Content.MSO\19B2DB13.tmp](image_rsrc3A5.jpg)


    ### 1\. break Statement


    The  break statement is used to terminate a loop prematurely. When executed, it
    exits the loop immediately and transfers control to the statement following the
    loop.


    #### Syntax:


    for (initialization; condition; increment/decrement) {


    if (conditionToBreak) {


    break; // Exit the loop


    }


    // Code to execute


    }


    #### Example:


    for (int i = 1; i <= 10; i++) {


    if (i == 5) {


    break; // Exit the loop when i equals 5


    }


    System.out.println("Iteration: " + i);


    }


    #### Output:


    Iteration: 1


    Iteration: 2


    Iteration: 3


    Iteration: 4


    #### Key Points:


    *   The  break statement is often used to terminate loops based on a specific
    condition.


    *   It works in both  for,  while, and  do-while loops.


    *   Exiting the loop helps avoid unnecessary iterations.


    ### 2\. continue Statement


    The  continue statement is used to skip the current iteration of a loop and proceed
    to the next one. Unlike  break, it does not exit the loop but jumps directly to
    the next iteration.


    #### Syntax:


    for (initialization; condition; increment/decrement) {


    if (conditionToSkip) {


    continue; // Skip the current iteration


    }


    // Code to execute


    }


    #### Example:


    for (int i = 1; i <= 5; i++) {


    if (i == 3) {


    continue; // Skip the iteration when i equals 3


    }


    System.out.println("Iteration: " + i);


    }


    #### Output:


    Iteration: 1


    Iteration: 2


    Iteration: 4


    Iteration: 5


    #### Key Points:


    *   The  continue statement skips only the current iteration and does not terminate
    the loop.


    *   It is useful when certain conditions need to be avoided within a loop.


    *   Works in  for,  while, and  do-while loops.


    By using  break and  continue statements effectively, you can enhance the logic
    and efficiency of loops in your Java programs.


    ## Nested Loops and Best Practices


    ### Nested Loops


    Nested loops occur when one loop is placed inside another. They are commonly used
    for handling multidimensional data or performing more complex operations.


    #### Example:


    for (int i = 1; i <= 3; i++) {


    for (int j = 1; j <= 3; j++) {


    System.out.println("i: " + i + ", j: " + j);


    }


    }


    #### Output:


    i: 1, j: 1


    i: 1, j: 2


    i: 1, j: 3


    i: 2, j: 1


    i: 2, j: 2


    i: 2, j: 3


    i: 3, j: 1


    i: 3, j: 2


    i: 3, j: 3


    #### Key Points:


    *   The outer loop runs its iterations, and for each iteration of the outer loop,
    the inner loop completes all its iterations.


    *   Commonly used in scenarios like printing matrices or processing multidimensional
    arrays.


    ### Best Practices for Using Loops'
