  trans: "\n\n`length` 属性提供数组的大小，即它能够容纳的元素个数。\n\n### 示例：\n```java\nint[] numbers =\
    \ {10, 20, 30};\nSystem.out.println(numbers.length); // 输出: 3\n```\n\n### 2. 遍历数组\n\
    你可以使用循环来遍历数组并访问其元素。\n\n### 示例：\n```java\nint[] numbers = {10, 20, 30};\nfor (int\
    \ i = 0; i < numbers.length; i++) {\n    System.out.println(numbers[i]);\n}\n\
    ```\n\n#### 输出：\n```\n10\n20\n30\n```\n\n### 3. 复制数组\n`System.arraycopy` 方法允许高效地将元素从一个数组复制到另一个数组。\n\
    \n### 示例：\n```java\nint[] source = {1, 2, 3};\nint[] destination = new int[3];\n\
    System.arraycopy(source, 0, destination, 0, source.length);\nfor (int num : destination)\
    \ {\n    System.out.println(num);\n}\n```\n\n#### 输出：\n```\n1\n2\n3\n```\n\n###\
    \ 4. 查找元素\n要查找一个元素，你可以遍历数组并将每个元素与目标值进行比较。\n\n### 示例：\n```java\nint[] numbers =\
    \ {10, 20, 30};\nint target = 20;\nboolean found = false;\nfor (int num : numbers)\
    \ {\n    if (num == target) {\n        found = true;\n        break;\n    }\n\
    }\nSystem.out.println(found ? \"Element found\" : \"Element not found\");\n```\n\
    \n#### 输出：\n```\nElement found\n```\n\n### 数组操作最佳实践\n1. **正确初始化数组**：始终分配正确的大小以避免出现\
    \ `ArrayIndexOutOfBoundsException`。\n2. **优化遍历**：在不需要索引时，使用增强型 `for` 循环（for-each）来提高代码可读性。\n\
    3. **验证索引**：在访问数组元素之前，确保索引在范围内。\n4. **利用库**：使用 Java 的工具类（如 `Arrays`）来处理排序和搜索等常用操作。\n\
    \n通过理解并练习这些数组操作，你可以有效地处理数据集合，并为在 Java 中处理更高级的数据结构打下坚实的基础。\n\n## ArrayList 与集合简介\n\
    \n![C:\\Users\\anike\\AppData\\Local\\Microsoft\\Windows\\INetCache\\Content.MSO\\\
    1998C57F.tmp](img/image_rsrc3AA.jpg)\n\n虽然数组非常强大，但它们固定的大小有时是一个限制。Java 中的 `ArrayList`\
    \ 类提供了一种动态替代方案，允许你在无需定义大小的情况下存储元素。它是 Java 集合框架（Collections Framework）的一部分，为管理数据集合提供了许多方便的功能。\n\
    \n### 声明 ArrayList\n要使用 `ArrayList`，你需要导入 `java.util.ArrayList` 类。\n\n### 示例：\n\
    ```java\nimport java.util.ArrayList; //  ArrayList 类\npublic class ArrayListExample\
    \ {\n    public static void main(String[] args) {\n        // 声明一个整数类型的 ArrayList\n\
    \        ArrayList<Integer> numbers = new ArrayList<>();\n        // 添加元素\n  \
    \      numbers.add(10);\n        numbers.add(20);\n        numbers.add(30);\n\
    \        // 打印 ArrayList\n        System.out.println(\"ArrayList: \" + numbers);\n\
    \    }\n}\n```\n\n#### 输出：\n```\nArrayList: [10, 20, 30]\n```\n\n### ArrayList\
    \ 的核心特性\n\n#### 1. 动态大小\n与数组不同，`ArrayList` 可以随着元素的添加或删除而增大或缩小。你不需要在声明时指定固定的大小。\n\
    \n#### 2. 类型安全\n通过泛型，`ArrayList` 允许你指定它将存储的元素类型，确保编译时的类型安全。\n\n### 示例：\n```java\n\
    ArrayList<String> names = new ArrayList<>();\nnames.add(\"Alice\");\nnames.add(\"\
    Bob\");\nSystem.out.println(names); // 输出: [Alice, Bob]\n```\n\n#### 3. 内置方法\n\
    `ArrayList` 类包含了几个用于添加、删除和修改元素的方法：\n\n##### 常用方法：\n- `add(element)`：在列表末尾添加一个元素。\n\
    - `add(index, element)`：在指定的索引处插入一个元素。\n- `remove(index)`：删除指定索引处的元素。\n- `get(index)`：获取指定索引处的元素。\n\
    - `set(index, element)`：替换指定索引处的元素。\n- `size()`：返回列表中的元素个数。\n\n### 示例：\n```java\n\
    ArrayList<String> fruits = new ArrayList<>();\nfruits.add(\"Apple\");\nfruits.add(\"\
    Banana\");\nfruits.add(\"Cherry\");\nSystem.out.println(\"Original List: \" +\
    \ fruits);\n// 访问元素\nSystem.out.println(\"First Element: \" + fruits.get(0));\n\
    // 修改元素\nfruits.set(1, \"Blueberry\");\nSystem.out.println(\"After Modification:\
    \ \" + fruits);\n// 删除元素\nfruits.remove(2);\nSystem.out.println(\"After Removal:\
    \ \" + fruits);\n// 列表的大小\nSystem.out.println(\"Size: \" + fruits.size());\n```\n\
    \n#### 输出：\n```\nOriginal List: [Apple, Banana, Cherry]\nFirst Element: Apple\n\
    After Modification: [Apple, Blueberry, Cherry]\nAfter Removal: [Apple, Banana]\n\
    Size: 2\n```\n\n通过理解并练习这些数组操作，你可以有效地处理数据集合，并为在 Java 中处理更高级的数据结构打下坚实的基础。\n\n"
- fmt: "\nEfficient iteration is crucial for managing and processing data stored in\
    \ arrays and collections. Java provides several ways to iterate, each suited for\
    \ different scenarios.\n\n### Using a For Loop\n\nThe traditional `for` loop gives\
    \ you complete control over the iteration process and is commonly used for arrays\
    \ and collections.\n\n#### Example:\n\n```java\nArrayList<Integer> numbers = new\
    \ ArrayList<>();\nnumbers.add(10);\nnumbers.add(20);\nnumbers.add(30);\n\nfor\
    \ (int i = 0; i < numbers.size(); i++) {\n    System.out.println(numbers.get(i));\n\
    }\n```\n\n#### Output:\n\n```\n10\n20\n30\n```\n\n#### Key Points:\n\n*   Provides\
    \ access to the index of each element.\n*   Useful when you need to modify elements\
    \ at specific positions.\n\n### Using a For-Each Loop\n\nThe enhanced `for` loop\
    \ (also called a `for-each loop`) is simpler and more concise. It works with both\
    \ arrays and collections.\n\n#### Example:\n\n```java\nfor (int num : numbers)\
    \ {\n    System.out.println(num);\n}\n```\n\n#### Output:\n\n```\n10\n20\n30\n\
    ```\n\n#### Key Points:\n\n*   Easier to read and write compared to the traditional\
    \ `for` loop.\n*   Does not provide access to the index.\n*   Cannot modify the\
    \ collection directly during iteration.\n\n### Using an Iterator\n\nAn `Iterator`\
    \ allows more control over the iteration process and provides the ability to safely\
    \ remove elements during traversal.\n\n#### Example:\n\n```java\nimport java.util.ArrayList;\n\
    import java.util.Iterator;\n\npublic class IteratorExample {\n    public static\
    \ void main(String[] args) {\n        ArrayList<Integer> numbers = new ArrayList<>();\n\
    \        numbers.add(10);\n        numbers.add(20);\n        numbers.add(30);\n\
    \n        Iterator<Integer> iterator = numbers.iterator();\n        while (iterator.hasNext())\
    \ {\n            int num = iterator.next();\n            if (num == 20) {\n  \
    \              iterator.remove();\n            }\n        }\n        System.out.println(numbers);\
    \ // Outputs: [10, 30]\n    }\n}\n```\n\n#### Output:\n\n```\n[10, 30]\n```\n\n\
    #### Key Points:\n\n*   The `Iterator` interface provides methods like `hasNext()`\
    \ and `next()`.\n*   Safely removes elements without causing `ConcurrentModificationException`.\n\
    \n### Using Streams (Java 8+)\n\nThe `stream()` API introduces a functional programming\
    \ approach for iterating over collections. It supports operations like filtering,\
    \ mapping, and more.\n\n#### Example:\n\n```java\nnumbers.stream().forEach(System.out::println);\n\
    ```\n\n#### Output:\n\n```\n10\n20\n30\n```\n\n#### Key Points:\n\n*   Compact\
    \ and functional approach.\n*   Suitable for applying transformations and processing\
    \ pipelines.\n*   Does not allow modification of the original collection during\
    \ iteration.\n\nBy mastering arrays, collections, and iteration techniques, you\
    \ can efficiently manage and process data. These tools are fundamental for building\
    \ robust and scalable Java applications.\n\n# Day 6: Exception Handling and File\
    \ I/O\n\n## Introduction to Exceptions\n\nIn Java, an exception is an event that\
    \ disrupts the normal flow of a program. Exceptions are typically caused by logical\
    \ errors, invalid user input, or unexpected conditions such as a file not found\
    \ or division by zero. Understanding exceptions and how to handle them is crucial\
    \ for writing robust and error-free programs.\n\n![C:\\Users\\anike\\AppData\\\
    Local\\Microsoft\\Windows\\INetCache\\Content.MSO\\F05F433B.tmp](image_rsrc3AC.jpg)\n\
    \n### Types of Exceptions\n\nJava exceptions are divided into two main categories:\n\
    \n#### 1. Checked Exceptions\n\n*   Definition: These are checked at compile-time.\
    \ The program will not compile unless these exceptions are handled.\n*   Examples:\n\
    \    *   `IOException`: Occurs when there are issues with input/output operations.\n\
    \    *   `SQLException`: Happens during database access errors.\n\n##### Example:\n\
    \n```java\nimport java.io.*;\n\npublic class CheckedExceptionExample {\n    public\
    \ static void main(String[] args) {\n        try {\n            FileReader file\
    \ = new FileReader(\"nonexistentfile.txt\");\n        } catch (IOException e)\
    \ {\n            System.out.println(\"File not found: \" + e.getMessage());\n\
    \        }\n    }\n}\n```\n\n#### 2. Unchecked Exceptions\n\n*   Definition: These\
    \ occur at runtime and are typically caused by programming errors, such as logical\
    \ mistakes or incorrect usage of APIs.\n*   Examples:\n    *   `ArithmeticException`:\
    \ Occurs during illegal arithmetic operations (e.g., division by zero).\n    *\
    \   `NullPointerException`: Thrown when trying to access a null reference.\n \
    \   *   `ArrayIndexOutOfBoundsException`: Happens when an array is accessed with\
    \ an illegal index.\n\n##### Example:\n\n```java\npublic class UncheckedExceptionExample\
    \ {\n    public static void main(String[] args) {\n        try {\n           \
    \ int[] numbers = {1, 2, 3};\n            System.out.println(numbers[5]); // Accessing\
    \ invalid index\n        } catch (ArrayIndexOutOfBoundsException e) {\n      \
    \      System.out.println(\"Invalid index: \" + e.getMessage());\n        }\n\
    \    }\n}\n```\n\n### The Exception Hierarchy\n\nAll exception classes in Java\
    \ inherit from the `Throwable` class. The hierarchy is as follows:\n\n#### Throwable\n\
    \n*   `Error`: Represents serious problems that applications cannot typically\
    \ recover from (e.g., `OutOfMemoryError`, `StackOverflowError`).\n*   `Exception`:\
    \ Represents conditions that applications might want to catch.\n    *   Checked\
    \ Exceptions: Subclasses of `Exception` that must be handled explicitly (e.g.,\
    \ `IOException`, `SQLException`).\n    *   Runtime Exceptions: Subclasses of `RuntimeException`\
    \ that occur at runtime (e.g., `NullPointerException`, `ArithmeticException`).\n\
    \n#### Visual Representation:\n\n```\nThrowable\n|\n+-- Error\n|   +-- OutOfMemoryError\n\
    |   +-- StackOverflowError\n+-- Exception\n|   +-- IOException (Checked)\n|  \
    \ +-- SQLException (Checked)\n|   +-- RuntimeException\n|       +-- NullPointerException\n\
    |       +-- ArithmeticException\n```\n\nBy understanding types and hierarchy of\
    \ exceptions, you can design programs that handle errors gracefully, improving\
    \ their reliability and user experience. Proper exception handling is an essential\
    \ skill for every Java developer.\n\n## Try-Catch-Finally Blocks\n\nThe `try-catch-finally`\
    \ construct is used to handle exceptions and execute cleanup code, ensuring that\
    \ the program can continue running if an error occurs. It provides a structured\
    \ way to catch and respond to exceptions.\n\n### Basic Structure\n\n```java\n\
    try {\n    // Code that may throw an exception\n} catch (ExceptionType e) {\n\
    \    // Code to handle the exception\n} finally {\n    // Optional cleanup code\n\
    }\n```\n\n#### Key Points:\n\n*   `try` block: Contains code that might throw\
    \ an exception.\n*   `catch` block: Handles the specific exception.\n*   `finally`\
    \ block: Executes regardless of whether an exception occurs or not.\n\n### Example:\
    \ Handling Division by Zero\n\n```java\npublic class ExceptionExample {\n    public\
    \ static void main(String[] args) {\n        try {\n            int result = 10\
    \ / 0; // This will throw ArithmeticException\n        } catch (ArithmeticException\
    \ e) {\n            System.out.println(\"Error: Division by zero is not allowed.\"\
    );\n        } finally {\n            System.out.println(\"Execution complete.\"\
    );\n        }\n    }\n}\n```\n\n#### Output:\n\n```\nError: Division by zero is\
    \ not allowed.\nExecution complete.\n```\n\n### The finally Block\n\nThe `finally`\
    \ block always executes, whether an exception occurs or not. It is commonly used\
    \ for resource cleanup, such as closing files, releasing locks, or disconnecting\
    \ from databases.\n\n#### Example: Resource Cleanup\n\n```java\nimport java.io.*;\n\
    \npublic class FileExample {\n    public static void main(String[] args) {\n \
    \       BufferedReader reader = null;\n        try {\n            reader = new\
    \ BufferedReader(new FileReader(\"example.txt\"));\n            System.out.println(reader.readLine());\n\
    \        } catch (IOException e) {\n            System.out.println(\"Error reading\
    \ file: \" + e.getMessage());\n        } finally {\n            try {\n      \
    \          if (reader != null) {\n                    reader.close();\n      \
    \          }\n            } catch (IOException e) {\n                System.out.println(\"\
    Error closing file: \" + e.getMessage());\n            }\n        }\n    }\n}\n\
    ```\n\n#### Output (example):\n\n```\nError reading file: example.txt (No such\
    \ file or directory)\n```\n\n### Multiple Catch Blocks\n\nYou can use multiple\
    \ `catch` blocks to handle different types of exceptions separately.\n\n#### Example:\n\
    \n```java\npublic class MultiCatchExample {\n    public static void main(String[]\
    \ args) {\n        try {\n            int[] numbers = {1, 2, 3};\n           \
    \ System.out.println(numbers[5]); // Throws ArrayIndexOutOfBoundsException\n \
    \       } catch (ArithmeticException e) {\n            System.out.println(\"Arithmetic\
    \ error occurred.\");\n        } catch (ArrayIndexOutOfBoundsException e) {\n\
    \            System.out.println(\"Index out of bounds.\");\n        }\n    }\n\
    }\n```\n"
