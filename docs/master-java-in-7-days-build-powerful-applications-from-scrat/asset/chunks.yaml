    ## Introduction to ArrayLists and Collections


    ![C:\Users\anike\AppData\Local\Microsoft\Windows\INetCache\Content.MSO\1998C57F.tmp](image_rsrc3AA.jpg)


    While arrays are powerful, their fixed size can sometimes be a limitation. The  ArrayList
    class in Java provides a dynamic alternative, allowing you to store elements without
    predefining the size. It is part of Java''s Collections Framework and offers several
    convenient features for managing collections of data.


    ### Declaring an ArrayList


    To use  ArrayList, you need to import the  java.util.ArrayList class.


    #### Example:


    import java.util.ArrayList; // Import the ArrayList class


    public class ArrayListExample {


    public static void main(String[] args) {


    // Declaring an ArrayList of integers


    ArrayList<Integer> numbers = new ArrayList<>();


    // Adding elements


    numbers.add(10);


    numbers.add(20);


    numbers.add(30);


    // Printing the ArrayList


    System.out.println("ArrayList: " + numbers);


    }


    }


    #### Output:


    ArrayList: [10, 20, 30]


    ### Key Features of ArrayList


    #### 1\. Dynamic Size


    Unlike arrays, an  ArrayList can grow or shrink as elements are added or removed.
    You don''t need to specify a fixed size during declaration.


    #### 2\. Type Safety


    With generics,  ArrayList allows you to specify the type of elements it will store,
    ensuring type safety at compile time.


    ##### Example:


    ArrayList<String> names = new ArrayList<>();


    names.add("Alice");


    names.add("Bob");


    System.out.println(names); // Outputs: [Alice, Bob]


    #### 3\. Built-in Methods


    The  ArrayList class includes several methods for adding, removing, and modifying
    elements:


    ##### Common Methods:


    *   add(element): Adds an element to the end of the list.


    *   add(index, element): Inserts an element at the specified index.


    *   remove(index): Removes the element at the specified index.


    *   get(index): Retrieves the element at the specified index.


    *   set(index, element): Replaces the element at the specified index.


    *   size(): Returns the number of elements in the list.


    #### Example:


    ArrayList<String> fruits = new ArrayList<>();


    fruits.add("Apple");


    fruits.add("Banana");


    fruits.add("Cherry");


    System.out.println("Original List: " + fruits);


    // Accessing elements


    System.out.println("First Element: " + fruits.get(0));


    // Modifying elements


    fruits.set(1, "Blueberry");


    System.out.println("After Modification: " + fruits);


    // Removing an element


    fruits.remove(2);


    System.out.println("After Removal: " + fruits);


    // Size of the list


    System.out.println("Size: " + fruits.size());


    #### Output:


    Original List: [Apple, Banana, Cherry]


    First Element: Apple


    After Modification: [Apple, Blueberry, Cherry]


    After Removal: [Apple, Blueberry]


    Size: 2


    By using  ArrayList and other classes in Java''s Collections Framework, you can
    efficiently manage and manipulate dynamic collections of data, providing more
    flexibility and functionality than traditional arrays.


    ## Adding, Modifying, and Deleting Elements


    The  ArrayList class provides several methods for adding, modifying, and deleting
    elements, making it a versatile and powerful tool for managing dynamic collections.


    ![C:\Users\anike\AppData\Local\Microsoft\Windows\INetCache\Content.MSO\69B56AE5.tmp](image_rsrc3AB.jpg)


    ### Adding Elements


    You can use the  add() method to insert elements into an  ArrayList. This method
    allows adding elements either at the end of the list or at a specified index.


    #### Example:


    import java.util.ArrayList;


    public class AddElementsExample {


    public static void main(String[] args) {


    ArrayList<Integer> numbers = new ArrayList<>();


    // Adding elements to the end of the list


    numbers.add(10);


    numbers.add(20);


    // Adding an element at a specific index


    numbers.add(1, 15); // Adds 15 at index 1


    System.out.println("ArrayList after adding elements: " + numbers);


    }


    }


    #### Output:


    ArrayList after adding elements: [10, 15, 20]


    ### Modifying Elements


    The  set() method is used to update an element at a specific index. This allows
    you to change the value of an existing element.


    #### Example:


    public class ModifyElementsExample {


    public static void main(String[] args) {


    ArrayList<Integer> numbers = new ArrayList<>();


    numbers.add(10);


    numbers.add(20);


    numbers.add(30);


    // Modifying the element at index 1


    numbers.set(1, 25); // Updates the second element


    System.out.println("ArrayList after modification: " + numbers);


    }


    }


    #### Output:


    ArrayList after modification: [10, 25, 30]


    ### Deleting Elements


    The  remove() method allows you to delete elements from an  ArrayList. You can
    remove elements by their index or by their value.


    #### Example:


    public class DeleteElementsExample {


    public static void main(String[] args) {


    ArrayList<Integer> numbers = new ArrayList<>();


    numbers.add(10);


    numbers.add(20);


    numbers.add(30);


    // Removing an element by index


    numbers.remove(1); // Removes the element at index 1


    // Removing an element by value


    numbers.remove(Integer.valueOf(10)); // Removes the element with value 10


    System.out.println("ArrayList after deletions: " + numbers);


    }


    }


    #### Output:


    ArrayList after deletions: [30]


    ### Checking for Elements


    The  contains() method checks whether a specified element exists in the  ArrayList.
    It returns a boolean value (true or  false).


    #### Example:


    public class CheckElementsExample {


    public static void main(String[] args) {


    ArrayList<Integer> numbers = new ArrayList<>();


    numbers.add(10);


    numbers.add(20);


    numbers.add(30);


    // Checking if the ArrayList contains a specific element


    System.out.println("Contains 20? " + numbers.contains(20)); // Outputs: true


    System.out.println("Contains 40? " + numbers.contains(40)); // Outputs: false


    }


    }


    #### Output:


    Contains 20? true


    Contains 40? false


    By mastering these operations, you can dynamically manage the contents of your  ArrayList,
    ensuring flexibility and ease of use in your programs. These methods allow you
    to handle data more efficiently, especially when the size or content of the collection
    changes frequently.


