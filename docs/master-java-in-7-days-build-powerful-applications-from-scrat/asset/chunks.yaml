    \    public static int factorial(int n) {\n        if (n == 0) {\n           \
    \ return 1; // Base case\n        }\n        return n * factorial(n - 1); // Recursive\
    \ call\n    }\n    public static void main(String[] args) {\n        System.out.println(\"\
    Factorial of 5: \" + factorial(5));\n    }\n}\n```\n\n#### Output:\nFactorial\
    \ of 5: 120\n\n### Key Components of Recursion\n\n1. **Base Case**:\n   - Stops\
    \ the recursion when a specific condition is met.\n   - Prevents infinite recursion\
    \ by defining the termination point.\n   Example:\n```java\nif (n == 0) {\n  \
    \  return 1;\n}\n```\n\n2. **Recursive Case**:\n   - The part of the method that\
    \ calls itself with a modified argument.\n   - Solves the problem by breaking\
    \ it into smaller subproblems.\n   Example:\n```java\nreturn n * factorial(n -\
    \ 1);\n```\n\n### Best Practices for Recursion\n\n- **Ensure a Well-Defined Base\
    \ Case**:\n  - Avoid infinite recursion by clearly specifying when the method\
    \ should stop.\n- **Use Recursion for Natural Recursive Structures**:\n  - Problems\
