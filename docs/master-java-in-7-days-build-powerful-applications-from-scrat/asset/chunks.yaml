  raw: 'Inheritance allows a class (child) to acquire the properties and methods of
    another class (parent). This promotes code reuse and hierarchical relationships
    between classes.


    #### Example:


    public class Animal {


    void eat() {


    System.out.println("This animal eats food.");


    }


    }


    public class Dog extends Animal {


    void bark() {


    System.out.println("The dog barks.");


    }


    public static void main(String[] args) {


    Dog dog = new Dog();


    dog.eat(); // Inherited method


    dog.bark();


    }


    }


    #### Output:


    This animal eats food.


    The dog barks.


    #### Key Points:


    *   Use the  extends keyword to establish inheritance.


    *   The child class can inherit and use public and protected methods and attributes
    of the parent class.


    *   The child class can also add its own methods and attributes.


    ### Polymorphism


    Polymorphism allows methods to have different implementations based on the object
    that calls them. It can be achieved through method overloading and method overriding.


    #### 1\. Method Overloading


    Method overloading occurs when multiple methods in the same class have the same
    name but different parameter lists.


    ##### Example:


    public class Printer {


    void print(String text) {


    System.out.println(text);


    }


    void print(int number) {


    System.out.println(number);


    }


    public static void main(String[] args) {


    Printer printer = new Printer();


    printer.print("Hello, World!");


    printer.print(42);


    }


    }


    #### Output:


    Hello, World!


    42


    #### Key Points:


    *   Methods with the same name must have different parameter lists (type, number,
    or order).


    *   Overloading improves code readability and usability by allowing methods to
    handle multiple data types or scenarios.


    #### 2\. Method Overriding


    Method overriding occurs when a child class provides a specific implementation
    for a method already defined in the parent class.


    ##### Example:


    public class Parent {


    void display() {


    System.out.println("Parent method");


    }


    }


    public class Child extends Parent {


    @Override


    void display() {


    System.out.println("Child method");


    }


    public static void main(String[] args) {


    Parent obj = new Child();


    obj.display();


    }


    }


    #### Output:


    Child method


    #### Key Points:


    *   Use the  @Override annotation to indicate that a method is being overridden.


    *   The method signature in the child class must match the parent class exactly.


    *   Overriding enables dynamic method dispatch, allowing the runtime object to
    determine the method implementation.


    By mastering inheritance and polymorphism, you can design robust and extensible
    systems. These concepts form the backbone of reusable, flexible, and maintainable
    OOP-based applications.


    ## Encapsulation and Abstraction


    Encapsulation and abstraction are two core principles of Object-Oriented Programming
    (OOP) that enhance security, modularity, and ease of development. These concepts
    ensure that programs are more maintainable, scalable, and robust.


    ![C:\Users\anike\AppData\Local\Microsoft\Windows\INetCache\Content.MSO\8D4F53F3.tmp](image_rsrc3AG.jpg)


    ### Encapsulation


    Encapsulation restricts direct access to an object’s attributes and methods. This
    is achieved using access modifiers (private,  public,  protected) and providing
    controlled access through getter and setter methods.


    #### Example:


    public class BankAccount {


    private double balance; // Private attribute


    // Getter method


    public double getBalance() {


    return balance;


    }


    // Setter method


    public void deposit(double amount) {


    if (amount > 0) {


    balance += amount;


    }


    }


    public static void main(String[] args) {


    BankAccount account = new BankAccount();


    account.deposit(1000);


    System.out.println("Balance: " + account.getBalance());


    }


    }


    #### Output:


    Balance: 1000.0


    #### Key Points:


    *   Access Modifiers: Use  private to restrict direct access to attributes and
    methods.


    *   Getter/Setter Methods: Provide controlled access to attributes, ensuring data
    integrity.


    *   Benefits: Improves security and allows changes to the implementation without
    affecting external code.


    ### Abstraction


    Abstraction hides the implementation details and shows only the essential features.
    This can be achieved using abstract classes and interfaces, which allow developers
    to focus on what an object does rather than how it does it.


    #### 1\. Abstract Classes


    Abstract classes define the blueprint for derived classes and may include both
    abstract (unimplemented) and concrete (implemented) methods.


    ##### Example:


    abstract class Shape {


    abstract void draw(); // Abstract method


    }


    class Circle extends Shape {


    void draw() {


    System.out.println("Drawing a circle");


    }


    public static void main(String[] args) {


    Shape shape = new Circle();


    shape.draw();


    }


    }


    #### Output:


    Drawing a circle


    #### Key Points:


    *   Use the  abstract keyword to define abstract classes and methods.


    *   Abstract methods must be implemented by subclasses.


    *   Cannot create objects of an abstract class directly.


    #### 2. Interfaces


    Interfaces define a contract that implementing classes must fulfill. They allow
    multiple inheritance by enabling a class to implement multiple interfaces.


    ##### Example:


    interface Animal {


    void sound(); // Abstract method


    }


    class Cat implements Animal {


    public void sound() {


    System.out.println("Meow");


    }


    public static void main(String[] args) {


    Animal animal = new Cat();


    animal.sound();


    }


    }


    #### Output:


    Meow


    #### Key Points:


    *   Use the  interface keyword to define interfaces.


    *   All methods in an interface are implicitly  public and  abstract.


    *   Classes use the  implements keyword to adopt an interface.


    *   Interfaces support multiple inheritance, unlike classes.


    By mastering encapsulation and abstraction, you will be able to design scalable
    and maintainable applications, leveraging the full power of Java''s capabilities.
    These concepts are foundational for tackling real-world software development challenges.


    # Final Thoughts


    ## What’s Next After 7 Days?


    Congratulations on completing this seven-day journey through Java! By now, you
    should have a solid foundation in the language, including syntax, data types,
    control flow, methods, object-oriented programming, and much more. This accomplishment
    is commendable, but it’s only the beginning of your exciting journey as a Java
    programmer. The skills you’ve gained lay the groundwork for endless possibilities.
    Here are some suggestions on what to do next to continue your growth:


    ### 1\. Deepen Your Knowledge


    To become proficient in Java, delve deeper into advanced topics and explore the
    full capabilities of the language:


    #### Advanced Topics:


    *   Multithreading and Concurrency: Learn to write efficient, thread-safe code.


    *   Networking: Understand how to build client-server applications.


    *   JavaFX: Create rich graphical user interfaces.


    #### Functional Programming:


    *   Master streams and lambda expressions to handle data efficiently.


    #### Collections Framework:


    *   Dive deeper into maps, sets, and specialized collections like  TreeMap and  LinkedHashMap
    to handle complex data structures.


    ### 2\. Practice Building Projects


    Applying your knowledge through real-world projects is one of the best ways to
    solidify your learning. Start small and scale up as you grow.


    #### Small Projects:


    *   To-Do List Application: Manage tasks with add, edit, and delete functionality.


    *   Simple Calculator: Implement arithmetic operations and error handling.


    *   Command-Line Games: Create engaging games like Tic-Tac-Toe or Hangman.


    #### Larger Projects:


    *   Library Management System: Handle book checkouts, returns, and user records.


    *   E-Commerce Application: Develop a product catalog with a database backend.


    *   Chat Application: Use Java’s networking capabilities to build a real-time
    messaging system.


    ### 3\. Learn About Frameworks and Tools


    Frameworks and tools are essential for building modern, enterprise-grade applications.
