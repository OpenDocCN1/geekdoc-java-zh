    * 配置你的开发环境

    * Java 语法简介

    * 你的第一个 Java 程序

    * 编译与运行 Java 代码

    * 理解错误与调试


    ## 第 2 天：变量、数据类型与运算符

    * 理解变量 (`int`, `float`, `char`, `boolean`, `String`)

    * Java 中的数据类型

    * 基础运算符（算术、比较、逻辑、赋值）

    * 字符串操作

    * 类型转换与类型转换


    ## 第 3 天：控制流与循环

    * 条件语句（`if`, `else if`, `else`, `switch`）

    * 逻辑运算符

    * 循环简介 (`for`, `while`, `do-while`）

    * Break 和 Continue 语句

