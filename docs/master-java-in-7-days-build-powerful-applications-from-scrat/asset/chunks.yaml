    \ e) {\n    System.out.println(\"Error: Division by zero is not allowed.\");\n\
    }\n```\n\nBy embracing debugging as a learning opportunity, you’ll become a more\
    \ confident and capable programmer. Debugging not only helps fix issues but also\
    \ deepens your understanding of Java and programming concepts.\n\n# Day 2: Variables,\
    \ Data Types, and Operators\n\n## Understanding Variables (int, float, char, boolean,\
    \ String)\n\nVariables are the building blocks of any programming language. In\
    \ Java, a variable acts as a container for storing data values. Each variable\
    \ is associated with a specific data type, which determines the kind of value\
    \ it can hold.\n\n![C:\\Users\\anike\\AppData\\Local\\Microsoft\\Windows\\INetCache\\\
    Content.MSO\\E4BE665B.tmp](image_rsrc3A1.jpg)\n\n### Declaring Variables\n\nTo\
    \ declare a variable, you specify its data type followed by its name. Optionally,\
    \ you can assign an initial value during declaration.\n\n#### Examples:\n\nint\
    \ number = 10; // Declaring an integer variable and initializing it with 10.\n\
    float price = 19.99f; // Declaring a float variable.\nchar grade = 'A'; // Declaring\
    \ a character variable.\nboolean isActive = true; // Declaring a boolean variable.\n\
    String name = \"Alice\"; // Declaring a String variable.\n\n#### Key Points:\n\
    \n* The data type defines the kind of value the variable can hold (e.g., `int`\
    \ for integers, `float` for decimal values).\n* Java is a strongly typed language,\
    \ meaning each variable must be declared with a specific data type.\n\n### Types\
    \ of Variables\n\nJava supports three main types of variables:\n\n#### 1. Local\
    \ Variables\n\n* Declared within a method or block.\n* Accessible only within\
