  trans: "\n\n高效迭代对于管理和处理存储在数组和集合中的数据至关重要。Java 提供了多种迭代方法，每种适用于不同的场景。\n\n### 使用 For\
    \ Loop\n\n传统的 `for` 循环让你对迭代过程有完全的控制，通常用于数组和集合。\n\n#### 示例：\n\n```java\nArrayList<Integer>\
    \ numbers = new ArrayList<>();\nnumbers.add(10);\nnumbers.add(20);\nnumbers.add(30);\n\
    \nfor (int i = 0; i < numbers.size(); i++) {\n    System.out.println(numbers.get(i));\n\
    }\n```\n\n#### 输出：\n\n```\n10\n20\n30\n```\n\n#### 关键点：\n\n*   提供了对每个元素索引的。\n\
    *   当需要修改特定位置的元素时非常。\n\n### 使用 For-Each 循环\n\n增强型 `for` 循环（也称为 `for-each 循环`）更简单简洁。它同时适用于数组和集合。\n\
    \n#### 示例：\n\n```java\nfor (int num : numbers) {\n    System.out.println(num);\n\
    }\n```\n\n#### 输出：\n\n```\n10\n20\n30\n```\n\n#### 关键点：\n\n*   与传统的 `for` 循环相比更易读且易写。\n\
    *   不提供索引的。\n*   不能在迭代期间直接修改集合。\n\n### 使用 Iterator\n\n`Iterator` 允许对迭代过程进行更多控制，并在遍历过程中安全地删除元素。\n\
    \n#### 示例：\n\n```java\nimport java.util.ArrayList;\nimport java.util.Iterator;\n\
    \npublic class IteratorExample {\n    public static void main(String[] args) {\n\
    \        ArrayList<Integer> numbers = new ArrayList<>();\n        numbers.add(10);\n\
    \        numbers.add(20);\n        numbers.add(30);\n\n        Iterator<Integer>\
    \ iterator = numbers.iterator();\n        while (iterator.hasNext()) {\n     \
    \       int num = iterator.next();\n            if (num == 20) {\n           \
    \     iterator.remove();\n            }\n        }\n        System.out.println(numbers);\
    \ // 输出: [10, 30]\n    }\n}\n```\n\n#### 输出：\n\n```\n[10, 30]\n```\n\n#### 关键点：\n\
    \n*   `Iterator` 接口提供了 `hasNext()` 和 `next()` 等方法。\n*   安全地移除元素而不引起 `ConcurrentModificationException`。\n\
    \n### 使用 Streams (Java 8+)\n\n`stream()` API 引入了用于迭代集合的函数式编程方法。它支持过滤、映射等操作。\n\n\
    #### 示例：\n\n```java\nnumbers.stream().forEach(System.out::println);\n```\n\n####\
    \ 输出：\n\n```\n10\n20\n30\n```\n\n#### 关键点：\n\n*   紧凑且函数化的。\n*   适用于变换和处理管道。\n\
    *   不允许在迭代期间修改原始集合。\n\n通过掌握数组、集合和迭代技术，你可以高效地管理和处理数据。这些工具是构建健壮且可扩展 Java 应用的基础。\n\
    \n# 第 6 天：异常处理与文件 IO\n\n## 异常简介\n\n在 Java 中，异常是中断程序正常流的事件。异常通常由逻辑错误、无效的用户输入或意外情况（如找不到文件或除以零）引起。理解异常以及如何处理它们对于编写健壮且无错误的程序至关重要。\n\
    \n![C:\\Users\\anike\\AppData\\Local\\Microsoft\\Windows\\INetCache\\Content.MSO\\\
    F05F433B.tmp](img/image_rsrc3AC.jpg)\n\n### 异常类型\n\nJava 异常分为两大类：\n\n#### 1. 检查异常\
    \ (Checked Exceptions)\n\n*   定义：这些在编译时被检查。除非处理这些异常，否则程序无法编译。\n*   示例：\n    *\
    \   `IOException`：当输入输出操作出现问题时发生。\n    *   `SQLException`：在数据库访问错误期间发生。\n\n#####\
    \ 示例：\n\n```java\nimport java.io.*;\n\npublic class CheckedExceptionExample {\n\
    \    public static void main(String[] args) {\n        try {\n            FileReader\
    \ file = new FileReader(\"nonexistentfile.txt\");\n        } catch (IOException\
    \ e) {\n            System.out.println(\"File not found: \" + e.getMessage());\n\
    \        }\n    }\n}\n```\n\n#### 2. 非检查异常 (Unchecked Exceptions)\n\n*   定义：这些在运行时发生，通常由编程错误引起，如逻辑错误或不正确使用\
    \ API。\n*   示例：\n    *   `ArithmeticException`：在非法算术运算期间（例如除以零）发生。\n    *   `NullPointerException`：当尝试访问空引用时抛出。\n\
    \    *   `ArrayIndexOutOfBoundsException`：当用非法索引访问数组时发生。\n\n##### 示例：\n\n```java\n\
    public class UncheckedExceptionExample {\n    public static void main(String[]\
    \ args) {\n        try {\n            int[] numbers = {1, 2, 3};\n           \
    \ System.out.println(numbers[5]); // 访问无效索引\n        } catch (ArrayIndexOutOfBoundsException\
    \ e) {\n            System.out.println(\"Invalid index: \" + e.getMessage());\n\
    \        }\n    }\n}\n```\n\n### 异常层次结构\n\nJava 中所有的异常类都继承自 `Throwable` 类。层次结构如下：\n\
    \n#### Throwable\n\n*   `Error`：代表应用程序通常无法恢复的严重问题（例如 `OutOfMemoryError`、`StackOverflowError`）。\n\
    *   `Exception`：代表应用程序可以处理的条件。\n    *   检查异常：应用程序必须处理的。\n    *   运行时异常：在运行时发生的。\n\
    \n#### 可视化表示：\n\n```\nThrowable\n|\n+-- Error\n|   +-- OutOfMemoryError\n|   +--\
    \ StackOverflowError\n+-- Exception\n|   +-- IOException (Checked)\n|   +-- SQLException\
    \ (Checked)\n|   +-- RuntimeException (Unchecked)\n|       +-- NullPointerException\n\
    |       +-- ArithmeticException\n```\n\n通过理解异常类型和层次结构，你可以设计能够优雅处理异常的程序。\n\n##\
    \ Try-Catch-Finally 块\n\n`try-catch-finally` 结构用于处理异常并确保程序继续运行。\n\n### 基础结构\n\n\
    ```java\ntry {\n    // 可能抛异常的代码\n} catch (ExceptionType) {\n    // 处理异常\n} finally\
    \ {\n    // 清理代码\n}\n```\n\n#### 关键点：\n\n*   `try` 块：可能抛异常的代码。\n*   `catch` 块：处理异常。\n\
    *   `finally` 块：无论是否发生异常都会执行。\n\n### 示例：处理除以零\n\n```java\npublic class ExceptionExample\
    \ {\n    public static void main(String[] args) {\n        try {\n           \
    \ int result = 10 / 0; // 将抛出 ArithmeticException\n        } catch (ArithmeticException\
    \ e) {\n            System.out.println(\"Error: Division by zero.\");\n      \
    \  } finally {\n            System.out.println(\"Execution complete.\");\n   \
    \     }\n    }\n}\n```\n\n#### 输出：\n\n```\nError: Division by zero.\nExecution\
    \ complete.\n```\n\n### finally 块\n\n`finally` 块无论是否发生异常都会执行。它通常用于资源清理，例如关闭文件、释放锁或断开数据库连接。\n\
    \n#### 示例：资源清理\n\n```java\nimport java.io.*;\n\npublic class FileExample {\n \
    \   public static void main(String[] args) {\n        BufferedReader reader =\
    \ null;\n        try {\n            reader = new BufferedReader(new FileReader(\"\
    example.txt\"));\n            System.out.println(reader.readLine());\n       \
    \ } catch (IOException e) {\n            System.out.println(\"Error reading file:\
    \ \" + e.getMessage());\n        } finally {\n            try {\n            \
    \    if (reader != null) {\n                    reader.close();\n            \
    \    }\n            } catch (IOException e) {\n                System.out.println(\"\
    Error closing file: \" + e.getMessage());\n            }\n        }\n    }\n}\n\
    ```\n\n#### 输出（示例）：\n\n```\nError reading file: example.txt (No such file or directory)\n\
    ```\n\n### 多 catch 块\n\n你可以使用多个 `catch` 块来分别处理不同类型的异常。\n\n#### 示例：\n\n```java\n\
    public class MultiCatchExample {\n    public static void main(String[] args) {\n\
    \        try {\n            int[] numbers = {1, 2, 3};\n            System.out.println(numbers[5]);\
    \ // 抛出 ArrayIndexOutOfBoundsException\n        } catch (ArithmeticException e)\
    \ {\n            System.out.println(\"Arithmetic error occurred.\");\n       \
    \ } catch (ArrayIndexOutOfBoundsException e) {\n            System.out.println(\"\
    Index out of bounds.\");\n        }\n    }\n}\n```\n\n"
