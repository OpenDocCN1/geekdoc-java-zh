    \ Person 类\n```java\npublic class Person {\n    String name; // 属性\n    int age;\
    \     // 属性\n\n    void introduce() { // 方法\n        System.out.println(\"Hi,\
    \ my name is \" + name);\n    }\n}\n```\n\n### 创建对象\n使用 `new` 关键字创建对象，它为对象分配内存并初始化其属性。\n\
    \n#### 示例：\n```java\npublic class Main {\n    public static void main(String[]\
    \ args) {\n        Person person = new Person(); // 创建对象\n        person.name\
    \ = \"Alice\"; // 设置属性\n        person.age = 25;\n        person.introduce();\
    \ // 调用方法\n    }\n}\n```\n\n#### 输出：\nHi, my name is Alice\n\n### 示例：代表汽车的类\n\
    #### 代码：\n```java\npublic class Car {\n    String brand; // 属性\n    int speed;\
    \    // 属性\n\n    void accelerate() { // 方法\n        speed += 10;\n        System.out.println(brand\
    \ + \" is now moving at \" + speed + \" km/h\");\n    }\n\n    public static void\
    \ main(String[] args) {\n        Car car = new Car();\n        car.brand = \"\
    Toyota\"; // 设置属性\n        car.speed = 50;\n        car.accelerate(); // 调用方法\n\
    \    }\n}\n```\n\n#### 输出：\nToyota is now moving at 60 km/h\n\n### 关键点\n1. **类与对象的关系：**\n\
    \   - 类是一个模板，而对象是该模板的特定实例。\n2. **属性与方法：**\n   - 属性代表对象的状态，方法定义其行为。\n3. **初始化：**\n\
    \   - 在使用属性之前，始终将其初始化为意义的值。\n4. **封装：**\n   - 使用访问修饰符（如 `private` 或 `public`）控制对属性和方法的访问，确保数据完整性。\n\
    \n通过掌握定义类和创建对象的过程，你获得了设计镜像真实世界系统程序的能力。这些技能是开发模块化、可复用和易维护应用程序的基础。\n\n# 方法和属性\n\n\
    在面向对象编程中，方法和属性定义了类的行为和状态。它们共同提供了功能并代表类的特征。\n\n![方法和属性](https://example.com/methods_attributes.jpg)\n\
    \n### 方法\n方法是定义在类中的函数，规定了对象可以执行的操作。它们大致分为两类：\n\n#### 1. 实例方法\n实例方法操作特定实例的数据。这些方法在类的实例上调用。\n\
    \n#### 2. 静态方法\n静态方法属于类而不是任何对象。它们可以使用类名直接调用，不需要实例。\n\n#### 示例：\n```java\npublic\
    \ class Calculator {\n    // 实例方法\n    int add(int a, int b) {\n        return\
    \ a + b;\n    }\n\n    // 静态方法\n    static void greet() {\n        System.out.println(\"\
    Welcome to the Calculator Program\");\n    }\n\n    public static void main(String[]\
    \ args) {\n        // 调用实例方法\n        Calculator calc = new Calculator();\n  \
    \      int result = calc.add(10, 20);\n        System.out.println(\"Sum: \" +\
    \ result);\n\n        // 调用静态方法\n        greet();\n    }\n}\n```\n\n#### 输出：\n\
    Welcome to the Calculator Program\nSum: 30\n\n#### 关键点：\n- **实例方法：** 操作特定实例的数据，需要对象才能调用。\n\
    - **静态方法：** 不依赖于特定实例的数据，可以使用类名直接调用。\n\n### 属性\n属性是定义在类中的变量，代表对象的状态或特征。它们通常被称为字段或成员变量。\n\
    \n#### this 关键字\n`this` 关键字用于引用当前对象的属性，特别是在当局部变量遮蔽了类属性时。\n\n#### 示例：\n```java\n\
    public class Rectangle {\n    int length, width; // 属性\n\n    // 实例方法\n    void\
    \ setDimensions(int length, int width) {\n        this.length = length; // 指向类属性\n\
    \        this.width = width;\n    }\n\n    int calculateArea() {\n        return\
    \ length * width; // 使用属性计算面积\n    }\n\n    public static void main(String[] args)\
    \ {\n        Rectangle rect = new Rectangle();\n        rect.setDimensions(5,\
    \ 10); // 使用实例方法设置尺寸\n        System.out.println(\"Area: \" + rect.calculateArea());\n\
    \    }\n}\n```\n\n#### 输出：\nArea: 50\n\n通过有效使用方法和属性，你可以设计出既具功能性又有描述性的类，为面向对象编程奠定坚实的基础。\n\
    \n"
- fmt: "\nInheritance allows a class (`child`) to acquire the properties and methods\
    \ of another class (`parent`). This promotes code reuse and hierarchical relationships\
    \ between classes.\n\n#### Example:\n\n```java\npublic class Animal {\n    void\
    \ eat() {\n        System.out.println(\"This animal eats food.\");\n    }\n}\n\
    \npublic class Dog extends Animal {\n    void bark() {\n        System.out.println(\"\
    The dog barks.\");\n    }\n\n    public static void main(String[] args) {\n  \
    \      Dog dog = new Dog();\n        dog.eat(); // Inherited method\n        dog.bark();\n\
    \    }\n}\n```\n\n#### Output:\n\n```\nThis animal eats food.\nThe dog barks.\n\
    ```\n\n#### Key Points:\n\n- Use the `extends` keyword to establish inheritance.\n\
    - The child class can inherit and use `public` and `protected` methods and attributes\
    \ of the parent class.\n- The child class can also add its own methods and attributes.\n\
    \n### Polymorphism\n\nPolymorphism allows methods to have different implementations\
    \ based on the object that calls them. It can be achieved through method overloading\
    \ and method overriding.\n\n### 1. Method Overloading\n\nMethod overloading occurs\
    \ when multiple methods in the same class have the same name but different parameter\
    \ lists.\n\n#### Example:\n\n```java\npublic class Printer {\n    void print(String\
    \ text) {\n        System.out.println(text);\n    }\n    void print(int number)\
    \ {\n        System.out.println(number);\n    }\n\n    public static void main(String[]\
    \ args) {\n        Printer printer = new Printer();\n        printer.print(\"\
    Hello, World!\");\n        printer.print(42);\n    }\n}\n```\n\n#### Output:\n\
    \n```\nHello, World!\n42\n```\n\n#### Key Points:\n\n- Methods with the same name\
    \ must have different parameter lists (type, number, or order).\n- Overloading\
    \ improves code readability and usability by allowing methods to handle multiple\
    \ data types or scenarios.\n\n### 2. Method Overriding\n\nMethod overriding occurs\
    \ when a child class provides a specific implementation for a method already defined\
    \ in the parent class.\n\n#### Example:\n\n```java\npublic class Parent {\n  \
    \  void display() {\n        System.out.println(\"Parent method\");\n    }\n}\n\
    \npublic class Child extends Parent {\n    @Override\n    void display() {\n \
    \       System.out.println(\"Child method\");\n    }\n\n    public static void\
    \ main(String[] args) {\n        Parent obj = new Child();\n        obj.display();\n\
    \    }\n}\n```\n\n#### Output:\n\n```\nChild method\n```\n\n#### Key Points:\n\
    \n- Use the `@Override` annotation to indicate that a method is being overridden.\n\
    - The method signature in the child class must match the parent class exactly.\n\
    - Overriding enables dynamic method dispatch, allowing the runtime object to determine\
    \ the method implementation.\n\nBy mastering inheritance and polymorphism, you\
    \ can design robust and extensible systems. These concepts form the backbone of\
    \ reusable, flexible, and maintainable OOP-based applications.\n\n## Encapsulation\
    \ and Abstraction\n\nEncapsulation and abstraction are two core principles of\
    \ Object-Oriented Programming (OOP) that enhance security, modularity, and ease\
    \ of development. These concepts ensure that programs are more maintainable, scalable,\
    \ and robust.\n\n![C:\\Users\\anike\\AppData\\Local\\Microsoft\\Windows\\INetCache\\\
    Content.MSO\\8D4F53F3.tmp](image_rsrc3AG.jpg)\n\n### Encapsulation\n\nEncapsulation\
    \ restricts direct access to an object’s attributes and methods. This is achieved\
    \ using access modifiers (`private`, `public`, `protected`) and providing controlled\
    \ access through getter and setter methods.\n\n#### Example:\n\n```java\npublic\
    \ class BankAccount {\n    private double balance; // Private attribute\n\n  \
    \  // Getter method\n    public double getBalance() {\n        return balance;\n\
    \    }\n\n    // Setter method\n    public void deposit(double amount) {\n   \
    \     if (amount > 0) {\n            balance += amount;\n        }\n    }\n\n\
    \    public static void main(String[] args) {\n        BankAccount account = new\
    \ BankAccount();\n        account.deposit(1000);\n        System.out.println(\"\
    Balance: \" + account.getBalance());\n    }\n}\n```\n\n#### Output:\n\n```\nBalance:\
    \ 1000.0\n```\n\n#### Key Points:\n\n- Access Modifiers: Use `private` to restrict\
    \ direct access to attributes and methods.\n- Getter/Setter Methods: Provide controlled\
    \ access to attributes, ensuring data integrity.\n- Benefits: Improves security\
    \ and allows changes to the implementation without affecting external code.\n\n\
    ### Abstraction\n\nAbstraction hides the implementation details and shows only\
    \ the essential features. This can be achieved using abstract classes and interfaces,\
    \ which allow developers to focus on what an object does rather than how it does\
    \ it.\n\n### 1. Abstract Classes\n\nAbstract classes define the blueprint for\
    \ derived classes and may include both abstract (unimplemented) and concrete (implemented)\
    \ methods.\n\n#### Example:\n\n```java\nabstract class Shape {\n    abstract void\
    \ draw(); // Abstract method\n}\n\nclass Circle extends Shape {\n    void draw()\
    \ {\n        System.out.println(\"Drawing a circle\");\n    }\n\n    public static\
    \ void main(String[] args) {\n        Shape shape = new Circle();\n        shape.draw();\n\
    \    }\n}\n```\n\n#### Output:\n\n```\nDrawing a circle\n```\n\n#### Key Points:\n\
    \n- Use the `abstract` keyword to define abstract classes and methods.\n- Abstract\
    \ methods must be implemented by subclasses.\n- Cannot create objects of an abstract\
    \ class directly.\n\n### 2. Interfaces\n\nInterfaces define a contract that implementing\
    \ classes must fulfill. They allow multiple inheritance by enabling a class to\
    \ implement multiple interfaces.\n\n#### Example:\n\n```java\ninterface Animal\
    \ {\n    void sound(); // Abstract method\n}\n\nclass Cat implements Animal {\n\
    \    public void sound() {\n        System.out.println(\"Meow\");\n    }\n\n \
    \   public static void main(String[] args) {\n        Animal animal = new Cat();\n\
    \        animal.sound();\n    }\n}\n```\n\n#### Output:\n\n```\nMeow\n```\n\n\
    #### Key Points:\n\n- Use the `interface` keyword to define interfaces.\n- All\
    \ methods in an interface are implicitly `public` and `abstract`.\n- Interfaces\
    \ support multiple inheritance, unlike classes.\n\nBy mastering encapsulation\
    \ and abstraction, you will be able to design scalable and maintainable applications,\
    \ leveraging the power of Java.\n\n# Final Thoughts\n\n## What’s Next After 7\
    \ Days?\n\nCongratulations on completing this seven-day journey through Java!\
    \ By now, you should have a solid foundation in the language, syntax, data types,\
    \ control flow, methods, object-oriented programming, and much more. This accomplishment\
    \ is commendable, but it’s only the beginning of your exciting journey as a Java\
    \ programmer. The skills you’ve gained lay the groundwork for endless possibilities.\
    \ Here are some suggestions on what to do next to continue your growth:\n\n###\
    \ 1. Deepen Your Knowledge\n\nTo become proficient in Java, delve deeper into\
    \ advanced topics and explore the full capabilities of the language:\n\n#### Advanced\
    \ Topics:\n\n- Multithreading and Concurrency: Learn to write efficient, thread-safe\
    \ code.\n- Networking: Understand how to build client-server applications.\n-\
    \ JavaFX: Create rich graphical user interfaces.\n\n#### Functional Programming:\n\
    \n- Master streams and lambda expressions to handle data efficiently.\n\n####\
    \ Collections Framework:\n\n- Dive deeper into maps, sets, and specialized collections\
    \ like `TreeMap` and `LinkedHashMap` to handle complex data.\n\n### 2. Practice\
    \ Building Projects\n\nApplying your knowledge through real-world projects is\
    \ one of the best ways to solidify your learning. Start small and scale up as\
    \ you grow.\n\n#### Small Projects:\n\n- To-Do List Application: Manage tasks\
    \ with add, edit, and delete functionality.\n- Simple Calculator: Implement arithmetic\
    \ operations and error handling.\n- Command-Line Games: Create engaging games\
    \ like Tic-Tac-Toe or Hangman.\n\n#### Larger Projects:\n\n- Library Management\
    \ System: Handle book checkouts, returns, and user records.\n- E-Commerce Application:\
    \ Develop a product catalog with a database backend.\n- Chat Application: Use\
    \ Java’s networking capabilities to build a real-time messaging system.\n\n###\
    \ 3. Learn About Frameworks and Tools\n\nFrameworks and tools are essential for\
    \ building modern, enterprise-grade applications. Familiarize yourself with the\
