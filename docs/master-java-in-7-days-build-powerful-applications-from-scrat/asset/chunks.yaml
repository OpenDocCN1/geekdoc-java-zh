    \ // Calling Instance Method\n        Calculator calc = new Calculator();\n  \
    \      int result = calc.add(10, 20);\n        System.out.println(\"Sum: \" +\
    \ result);\n\n        // Calling Static Method\n        greet();\n    }\n}\n```\n\
    \n#### Output:\nWelcome to the Calculator Program\nSum: 30\n\n#### Key Points:\n\
    - **Instance Methods:** Operate on instance-specific data and require an object\
    \ to be invoked.\n- **Static Methods:** Do not depend on object-specific data\
    \ and can be invoked directly using the class name.\n\n### Attributes\nAttributes\
    \ are variables defined within a class that represent the state or properties\
    \ of an object. They are often referred to as fields or member variables.\n\n\
    #### The this Keyword\nThe `this` keyword is used to refer to the current object’s\
    \ attributes, particularly when local variables shadow class attributes.\n\n####\
    \ Example:\n```java\npublic class Rectangle {\n    int length, width; // Attributes\n\
    \n    // Instance Method\n    void setDimensions(int length, int width) {\n  \
