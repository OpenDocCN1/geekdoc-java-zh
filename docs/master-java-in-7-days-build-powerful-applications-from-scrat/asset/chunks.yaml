    \ | Static Methods | Non-Static Methods |\n| :--- | :--- | :--- |\n| Belongs To\
    \ | Class | Instance |\n| Access | Accessed directly using the class name | Requires\
    \ an object of the class |\n| Access to Members | Cannot access instance variables\
    \ or methods | Can access both static and instance members |\n| Use Case | Utility\
    \ or global operations | Instance-specific behavior |\n| Example Syntax | `ClassName.methodName()`\
    \ | `objectName.methodName()` |\n\nBy understanding when to use static versus\
    \ non-static methods, you can write well-structured and efficient Java programs\
    \ that suit the specific needs of your application.\n\n## Scope (Global, Local,\
    \ Block)\n\nThe scope of a variable defines where it can be accessed or modified\
    \ in a program. Understanding scope is crucial to prevent errors, avoid variable\
    \ conflicts, and maintain clean and readable code.\n\n### 1. Global Scope\n\n\
    Global variables are defined at the class level, outside any methods. They can\
    \ be accessed by all methods within the class.\n\n#### Example:\n```java\npublic\
    \ class Counter {\n    static int count = 0; // Global variable\n    public static\
    \ void increment() {\n        count++;\n    }\n    public static void main(String[]\
    \ args) {\n        increment();\n        System.out.println(\"Count: \" + count);\n\
    \    }\n}\n```\n\n#### Output:\nCount: 1\n\n#### Key Points:\n- Declared outside\
    \ methods but within the class.\n- Typically defined using `static` for class-wide\
    \ accessibility.\n- Can lead to unexpected side effects if not managed carefully.\n\
    \n### 2. Local Scope\n\nLocal variables are declared inside a method or block\
    \ and are accessible only within that method or block. These variables are created\
    \ when the method is called and destroyed when the method exits.\n\n#### Example:\n\
    ```java\npublic class LocalExample {\n    public static void printMessage() {\n\
    \        String message = \"Hello from a local variable!\"; // Local variable\n\
    \        System.out.println(message);\n    }\n    public static void main(String[]\
    \ args) {\n        printMessage();\n    }\n}\n```\n\n#### Output:\nHello from\
    \ a local variable!\n\n#### Key Points:\n- Declared within a method or block.\n\
    - Not accessible outside the method or block.\n- Prevents unintended interference\
    \ with other parts of the program.\n\n### 3. Block Scope\n\nVariables declared\
    \ within a block (enclosed in curly braces `{}`) are accessible only within that\
    \ block. Block scope is often used in control structures like `if`, `for`, or\
    \ `while` loops.\n\n#### Example:\n```java\npublic class BlockScope {\n    public\
    \ static void main(String[] args) {\n        if (true) {\n            int num\
    \ = 42; // Block variable\n            System.out.println(\"Number: \" + num);\n\
    \        }\n        // System.out.println(num); // Error: num is out of scope\
    \ here\n    }\n}\n```\n\n#### Output:\nNumber: 42\n\n#### Key Points:\n- Declared\
    \ within `{}` and accessible only within those braces.\n- Helps limit the variable’s\
    \ visibility to where it is needed.\n- Reduces the risk of accidental modification.\n\
    \nBy understanding the different scopes of variables (global, local, and block),\
    \ you can write safer and more efficient Java programs. Properly scoping variables\
    \ enhances readability, avoids conflicts, and ensures predictable behavior.\n\n\
    ## Recursion in Java\n\nRecursion occurs when a method calls itself to solve a\
    \ smaller instance of a problem. Recursion is a powerful tool for solving problems\
