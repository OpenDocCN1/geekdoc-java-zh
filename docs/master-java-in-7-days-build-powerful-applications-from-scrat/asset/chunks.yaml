    ## Throwing and Catching Exceptions


    Proper handling of exceptions is essential for building robust and maintainable
    programs. In Java, you can throw exceptions manually or catch multiple exceptions
    efficiently.


    ![C:\Users\anike\AppData\Local\Microsoft\Windows\INetCache\Content.MSO\ED0DFC01.tmp](image_rsrc3AD.jpg)


    ### Throwing Exceptions


    You can throw exceptions manually using the  throw keyword. This is useful for
    signaling specific error conditions in your program.


    #### Example:


    public class ThrowExample {


    public static void validateAge(int age) {


    if (age < 18) {


    throw new IllegalArgumentException("Age must be 18 or older.");


    }


    System.out.println("Age is valid.");


    }


    public static void main(String[] args) {


    try {


    validateAge(15);


    } catch (IllegalArgumentException e) {


    System.out.println("Exception: " + e.getMessage());


    }


    }


    }


    #### Output:


    Exception: Age must be 18 or older.


    #### Key Points:


    *   The  throw keyword is used to throw an exception.


    *   Always provide a meaningful message to help identify the cause of the exception.


    *   The method must declare exceptions it throws using the  throws keyword (if
    applicable for checked exceptions).


    ### Catching Multiple Exceptions


    From Java 7 onwards, you can catch multiple exceptions in a single  catch block.
    This reduces code redundancy and improves readability.


    #### Example:


    public class MultiCatchExample {


    public static void main(String[] args) {


    try {


    int[] numbers = {1, 2};


    System.out.println(numbers[5]); // Throws ArrayIndexOutOfBoundsException


    } catch (ArithmeticException | ArrayIndexOutOfBoundsException e) {


    System.out.println("Error: " + e.getMessage());


    }


    }


    }


    #### Output:


    Error: Index 5 out of bounds for length 2


    #### Key Points:


    *   Use the pipe (|) operator to specify multiple exceptions in a single  catch
    block.


    *   The exception variable (e) is shared across all specified exception types.


    *   This approach reduces duplicate code and ensures a cleaner implementation.


    By mastering the concepts of throwing and catching exceptions, you can handle
    error scenarios effectively while keeping your code clean and maintainable. These
    practices are fundamental for building robust Java applications.


    ## Reading and Writing Files


    File I/O (Input/Output) allows a program to interact with files for reading and
    writing data. Java provides several classes in the  java.io package to handle
    file operations efficiently and effectively.


    ### Reading a File


    The  FileReader class is used to read character streams from a file. It reads
    data character by character and is ideal for text files.


    #### Example:


    import java.io.*;


    public class FileReadExample {


    public static void main(String[] args) {


    try (FileReader reader = new FileReader("example.txt")) {


    int character;


    while ((character = reader.read()) != -1) {


    System.out.print((char) character);


    }


    } catch (IOException e) {


    System.out.println("Error reading file: " + e.getMessage());


    }


    }


    }


    #### Explanation:


    *   The  FileReader object is created with the file name as its parameter.


    *   The  read() method reads one character at a time and returns  -1 when the
    end of the file is reached.


    *   The  try-with-resources statement ensures the  FileReader is automatically
    closed after use.


    ### Writing to a File


    The  FileWriter class is used to write character streams to a file. It allows
    you to create or overwrite files with new content.


    #### Example:


    import java.io.*;


    public class FileWriteExample {


    public static void main(String[] args) {


    try (FileWriter writer = new FileWriter("output.txt")) {


    writer.write("Hello, File I/O!");


    } catch (IOException e) {


    System.out.println("Error writing to file: " + e.getMessage());


    }


    }


    }


    #### Explanation:


    *   The  FileWriter object is created with the target file name as its parameter.


    *   The  write() method writes the specified string to the file.


    *   The  try-with-resources statement ensures the  FileWriter is automatically
    closed after use.


    ### Key Points:


    1.  Error Handling: Always handle exceptions using  try-catch to prevent crashes
    during file operations.


    2.  Resource Management: Use  try-with-resources to ensure automatic closing of
    file streams.


    3.  Character vs. Byte Streams: Classes like  FileReader and  FileWriter handle
    character data, while  FileInputStream and  FileOutputStream handle raw byte data.


    By mastering file reading and writing techniques, you can build applications that
    efficiently handle data storage and retrieval.


    ## Working with BufferedReader and BufferedWriter


    Buffered classes improve the efficiency of file operations by buffering input
    and output streams. These classes, part of the  java.io package, provide optimized
    performance for reading and writing text data.


    ### BufferedReader


    The  BufferedReader class reads text efficiently by buffering characters from
    an input stream. It significantly reduces the overhead of frequent I/O operations.


    #### Example: Reading a File


    import java.io.*;


    public class BufferedReaderExample {


    public static void main(String[] args) {


    try (BufferedReader br = new BufferedReader(new FileReader("example.txt"))) {


    String line;


    while ((line = br.readLine()) != null) {


    System.out.println(line);


    }


    } catch (IOException e) {


    System.out.println("Error: " + e.getMessage());


    }


    }


    }


    #### Explanation:


    *   The  BufferedReader object wraps around a  FileReader to buffer characters,
    allowing efficient line-by-line reading with the  readLine() method.


    *   The  try-with-resources ensures that the  BufferedReader is closed automatically.


    ### BufferedWriter


    The  BufferedWriter class writes text efficiently by buffering output to an output
    stream. This reduces the number of I/O operations, improving performance when
    writing large amounts of data.


    #### Example: Writing to a File


    import java.io.*;


    public class BufferedWriterExample {


    public static void main(String[] args) {


    try (BufferedWriter bw = new BufferedWriter(new FileWriter("output.txt"))) {


    bw.write("Writing with BufferedWriter.");


    } catch (IOException e) {


    System.out.println("Error: " + e.getMessage());


    }


    }


    }


    #### Explanation:


    *   The  BufferedWriter object wraps around a  FileWriter to buffer character
    output, reducing the number of write operations.


    *   The  write() method writes text data to the file, and the  try-with-resources
    ensures the resource is closed after usage.


    ### Key Points:


    1.  Performance: Buffered classes reduce the number of read and write operations
    by working with larger chunks of data at a time.


    2.  Resource Management: Always use  try-with-resources to ensure proper closure
    of file streams.


    3.  Line-by-Line Reading: BufferedReader’s readLine() method simplifies reading
    files line by line.


    By mastering the usage of  BufferedReader and  BufferedWriter, you can handle
    file I/O operations more efficiently and write programs capable of managing large
    text data seamlessly. These tools are essential for building robust real-world
    applications.


