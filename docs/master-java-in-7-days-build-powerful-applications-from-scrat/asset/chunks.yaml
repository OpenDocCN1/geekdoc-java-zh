    # Day 4: Methods and Scope


    ## Defining Methods (void and return types)


    A method in Java is a block of code that performs a specific task and can be reused
    multiple times within a program. Methods help in breaking down a program into
    smaller, manageable, and modular parts, improving readability and reusability.


    ![C:\Users\anike\AppData\Local\Microsoft\Windows\INetCache\Content.MSO\DF0ED999.tmp](image_rsrc3A6.jpg)


    ### Void Methods


    Void methods do not return any value. They perform an action, such as printing
    a message or modifying an object, without providing any output.


    #### Example:


    public class Greeting {


    // Void method


    public static void sayHello() {


    System.out.println("Hello, World!");


    }


    public static void main(String[] args) {


    sayHello(); // Calling the method


    }


    }


    #### Output:


    Hello, World!


    #### Key Points:


    *   The  void keyword specifies that the method does not return any value.


    *   Methods are called by their name followed by parentheses  ().


    *   Useful for tasks like printing, modifying objects, or logging information.


    ### Methods with Return Types


    Methods with return types return a value to the calling function. The return type
    can be any valid data type, such as  int,  double,  String, or even custom objects.


    #### Example:


    public class MathOperations {


    // Method with a return type


    public static int addNumbers(int a, int b) {


    return a + b; // Returns the sum of a and b


    }


    public static void main(String[] args) {


    int result = addNumbers(5, 10); // Calling the method and storing the result


    System.out.println("The sum is: " + result);


    }


    }


    #### Output:


    The sum is: 15


    #### Key Points:


    *   The return type specifies the type of value the method will return.


    *   The  return statement is used to return a value from the method.


    *   Methods with return types are useful for computations, fetching values, or
    returning results.


    ### Benefits of Using Methods


    1.  Code Reusability: Write once, use multiple times.


    2.  Modularity: Break down programs into smaller, logical units.


    3.  Improved Readability: Methods help organize code, making it easier to read
    and understand.


    4.  Ease of Maintenance: Errors are easier to locate and fix in modular code.


    By understanding how to define and use methods effectively, you can create clean,
    efficient, and reusable Java programs that follow best practices in software development.


    ## Method Parameters and Return Values


    ### Method Parameters


    Method parameters allow methods to accept input values. These inputs are defined
    within parentheses in the method declaration and provide flexibility to perform
    different tasks based on the input provided.


    #### Example:


    public class Rectangle {


    // Method with parameters


    public static int calculateArea(int length, int width) {


    return length * width;


    }


    public static void main(String[] args) {


    int area = calculateArea(5, 7); // Passing values to the method


    System.out.println("Area: " + area);


    }


    }


    #### Output:


    Area: 35


    #### Key Points:


    *   Parameters are declared within parentheses in the method signature.


    *   The data types of the parameters must match the arguments passed when calling
    the method.


    *   Multiple parameters can be separated by commas.


    ### Return Values


    A method can return a value to the caller. The return type must be specified in
    the method signature. If a method does not return a value, the  void keyword is
    used.


    #### Example 1: Returning a Value


    public class Greeter {


    public static String greetUser(String name) {


    return "Hello, " + name + "!"; // Returning a string


    }


    public static void main(String[] args) {


    String greeting = greetUser("Alice"); // Storing the returned value


    System.out.println(greeting);


    }


    }


    #### Output:


    Hello, Alice!


    #### Example 2: Void Method with Parameters


    public class Printer {


    public static void printMessage(String message) {


    System.out.println(message); // Printing without returning


    }


    public static void main(String[] args) {


    printMessage("Welcome to Java programming!");


    }


    }


    #### Output:


    Welcome to Java programming!


    #### Key Points:


    *   Use the  return keyword to return a value from the method.


    *   The type of the returned value must match the method’s declared return type.


    *   Methods can return any data type, including custom objects and arrays.


    *   Void methods perform actions without returning any value.


    By utilizing method parameters and return values effectively, you can write flexible,
    reusable, and dynamic programs. These concepts are fundamental to creating modular
    and maintainable Java applications.


    ## Static vs Non-Static Methods


    ![C:\Users\anike\AppData\Local\Microsoft\Windows\INetCache\Content.MSO\EF92080F.tmp](image_rsrc3A7.jpg)


