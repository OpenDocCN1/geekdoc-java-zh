    \ // Uses attributes to calculate area\n    }\n\n    public static void main(String[]\
    \ args) {\n        Rectangle rect = new Rectangle();\n        rect.setDimensions(5,\
    \ 10); // Setting dimensions using instance method\n        System.out.println(\"\
    Area: \" + rect.calculateArea());\n    }\n}\n```\n\n#### Output:\nArea: 50\n\n\
    By understanding and utilizing methods and attributes effectively, you can design\
    \ classes that are both functional and descriptive, laying a strong foundation\
    \ for object-oriented programming.\n"
  raw: '### Key Concepts


    #### 1\. Class


    A class acts as a blueprint for creating objects. It defines the structure and
    behavior (attributes and methods) that the objects will have.


    ##### Example:


    public class Car {


    // Attributes


    String brand;


    String color;


    // Method


    public void start() {


    System.out.println("Car is starting...");


    }


    }


    #### 2\. Object


    An object is an instance of a class. Objects are used to represent and interact
    with real-world entities.


    ##### Example:


    public class Main {


    public static void main(String[] args) {


    Car myCar = new Car(); // Creating an object of the Car class


    myCar.brand = "Toyota";


    myCar.color = "Red";


    myCar.start(); // Calling the start method


    }


    }


    #### 3. Attributes


    Attributes are variables within a class that represent the state or properties
    of an object.


    ##### Example:


    myCar.brand = "Toyota"; // Setting the brand attribute


    myCar.color = "Red";   // Setting the color attribute


    #### 4\. Methods


    Methods are functions defined within a class that specify the actions an object
    can perform.


    ##### Example:


    myCar.start(); // Invoking the start method


    ### Advantages of OOP


    #### 1\. Code Reusability


    OOP enables code reuse through inheritance, allowing common functionality to be
    defined once and used by multiple classes.


    ##### Example:


    public class Vehicle {


    public void move() {


    System.out.println("Vehicle is moving...");


    }


    }


    public class Car extends Vehicle {


    // Inherits the move method from Vehicle


    }


    #### 2. Modularity


    Divide code into smaller, manageable parts, making it easier to debug, test, and
    maintain.


    ##### Example:


    Each class in an OOP design typically represents a single responsibility, such
    as  Car,  Engine, or  Driver.


    #### 3. Maintainability


    Encapsulation ensures that changes in one part of the code do not affect others,
    promoting better organization and easier updates.


    ##### Example:


    public class Account {


    private double balance; // Encapsulated attribute


    public void deposit(double amount) {


    balance += amount;


    }


    public double getBalance() {


    return balance;


    }


    }


    #### 4. Scalability


    OOP designs are easily extendable to include new features or components by adding
    new classes or methods.


    ##### Example:


    Adding new vehicle types like  Truck or  Bike can be done by extending the  Vehicle
    class.


    By mastering OOP concepts, you can design systems that are efficient, scalable,
    and easier to understand. These principles form the foundation of modern software
    development and are essential for building robust applications.


    ## Creating Classes and Objects


    Understanding how to define classes and create objects is the foundation of Object-Oriented
    Programming (OOP). Classes define the blueprint for objects, while objects are
    instances of those classes. This relationship allows developers to model real-world
    entities and their behaviors in a structured way.


    ### Defining a Class


    A class is defined using the  class keyword, followed by its name and body. It
    contains attributes (variables) and methods (functions) that represent the state
    and behavior of the object.


    #### Example: Defining a Person Class


    public class Person {


    String name; // Attribute


    int age;    // Attribute


    void introduce() { // Method


    System.out.println("Hi, my name is " + name);


    }


    }


    ### Creating Objects


    To create an object, use the  new keyword, which allocates memory for the object
    and initializes its attributes.


    #### Example:


    public class Main {


    public static void main(String[] args) {


    Person person = new Person(); // Creating an object


    person.name = "Alice"; // Setting attributes


    person.age = 25;


    person.introduce(); // Calling a method


    }


    }


    #### Output:


    Hi, my name is Alice


    ### Example: A Class Representing a Car


    #### Code:


    public class Car {


    String brand; // Attribute


    int speed;   // Attribute


    void accelerate() { // Method


    speed += 10;


    System.out.println(brand + " is now moving at " + speed + " km/h");


    }


    public static void main(String[] args) {


    Car car = new Car();


    car.brand = "Toyota"; // Setting attributes


    car.speed = 50;


    car.accelerate(); // Calling a method


    }


    }


    #### Output:


    Toyota is now moving at 60 km/h


    ### Key Points


    #### 1\. Classes and Objects Relationship:


    *   A class is a template, and an object is a specific instance of that template.


    #### 2\. Attributes and Methods:


    *   Attributes represent the state of an object, and methods define its behavior.


    #### 3. Initialization:


    *   Always initialize attributes to meaningful values before using them.


    #### 4. Encapsulation:


    *   Use access modifiers (like  private or  public) to control access to attributes
    and methods, ensuring data integrity.


    By mastering the process of defining classes and creating objects, you unlock
    the ability to design programs that mirror real-world systems. These skills form
    the basis for developing modular, reusable, and maintainable applications.


    ## Methods and Attributes


    In Object-Oriented Programming, methods and attributes define the behavior and
    state of a class. Together, they provide functionality and represent the characteristics
    of objects.


    ![C:\Users\anike\AppData\Local\Microsoft\Windows\INetCache\Content.MSO\CF6470DD.tmp](image_rsrc3AF.jpg)


    ### Methods


    Methods are functions defined within a class that specify the actions or behaviors
    that objects of the class can perform. They are broadly categorized into two types:


    #### 1\. Instance Methods


    Instance methods operate on the attributes of a specific object. These methods
    are invoked on an instance of the class.


    #### 2\. Static Methods


    Static methods belong to the class rather than any specific object. They can be
    called directly using the class name and do not require creating an instance.


    #### Example:


    public class Calculator {


    // Instance Method


    int add(int a, int b) {


    return a + b;


    }


    // Static Method


    static void greet() {


    System.out.println("Welcome to the Calculator Program");


    }


    public static void main(String[] args) {


    // Calling Instance Method


    Calculator calc = new Calculator();


    int result = calc.add(10, 20);


    System.out.println("Sum: " + result);


    // Calling Static Method


    greet();


    }


    }


    #### Output:


    Welcome to the Calculator Program


    Sum: 30


    #### Key Points:


    *   Instance Methods: Operate on instance-specific data and require an object
    to be invoked.


    *   Static Methods: Do not depend on object-specific data and can be invoked directly
    using the class name.


    ### Attributes


    Attributes are variables defined within a class that represent the state or properties
    of an object. They are often referred to as fields or member variables.


    #### The this Keyword


    The  this keyword is used to refer to the current object’s attributes, particularly
    when local variables shadow class attributes.


    #### Example:


    public class Rectangle {


    int length, width; // Attributes


    // Instance Method


    void setDimensions(int length, int width) {


    this.length = length; // Refers to the class attribute


    this.width = width;


    }


    int calculateArea() {


    return length * width; // Uses attributes to calculate area


    }


    public static void main(String[] args) {


    Rectangle rect = new Rectangle();


    rect.setDimensions(5, 10); // Setting dimensions using instance method


    System.out.println("Area: " + rect.calculateArea());


    }


    }


    #### Output:


    Area: 50


    #### Key Points:


    *   Attributes: Represent the state of an object.


    *   The  this Keyword: Resolves conflicts between local variables and class attributes.


    By understanding and utilizing methods and attributes effectively, you can design
    classes that are both functional and descriptive, laying a strong foundation for
    object-oriented programming.


    ## Inheritance and Polymorphism


    Inheritance and polymorphism are two fundamental concepts of Object-Oriented Programming
    (OOP) that enable code reusability, flexibility, and scalability in application
    design.


