    \n```java\nfor (int i = 1; i <= 10; i++) {\n    if (i == 5) {\n        break;\n\
    \    }\n    System.out.println(\"Iteration: \" + i);\n}\n```\n\n#### Output:\n\
    \nIteration: 1\nIteration: 2\nIteration: 3\nIteration: 4\n\n#### Key Points:\n\
    \n* The `break` statement terminates the loop immediately.\n* It is often used\
