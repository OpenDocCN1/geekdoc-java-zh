    ```

    REVOKE ALL PRIVILEGES, GRANT OPTION FROM user [, user]...

    ```


    It is important to remember that you are required to have the "CREATE USER" or
    the "UPDATE" privilege at "global level" for the mysql database, to be able to
    execute the "REVOKE ALL" statement.


    You will be using the "REVOKE PROXY" clause as shown in the query below, in order
    to revoke proxy users:


    ```

    REVOKE PROXY ON USER user [, user]...

    ```


    A proxy user can be defined as a "valid user in MySQL who can impersonate another
    user". As a result, the proxy user is able to attain all privileges granted to
    the user that it is impersonating.


    The best practice dictates that you should first check what privileges have been
    assigned to the user by executing the syntax below with "SHOW GRANTS" statement,
    prior to withdrawing the user''s privileges:


