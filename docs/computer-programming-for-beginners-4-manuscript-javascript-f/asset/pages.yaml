    # SQL Joins and Union commands


    The most common command used in SQL is the "SELECT" command, which we have already
    used in the exercises mentioned earlier in this book, so now let me give a deep
    dive into the "SQL SELECT" command and various clauses that can be used with it.


    # ## MySQL Select


    You can selectively fetch desired data from tables and views, using the "SELECT"
    statement. As you already know, similar to a spreadsheet, a table comprises of
    rows and columns. You are highly likely to view a subset of columns, a sub-set
    of rows, or a combination of the two. The outcome of the "SELECT" query is known
    as a "result set", which is a list of records comprising the same number of columns
    per record.


    In the picture show below of the "employees table" from the "MySQL sample database",
    the table has 8 columns, namely: "employee number", "Last name", "first name",
    "extension", "email", "office code", "to reports", "job title" and several rows
    of records.


