- img_proc: true
  md: 'A recovery model can be defined as "a database property that controls how transactions
    are logged, whether the transaction log requires and allows backing up, and what
    kinds of restore operations are available". It is a database configuration option
    that specifies the type of backup that can be performed and enables the data to
    be restored or recovered in case of a failure. The 3 types of "SQL Server recovery
    models" are:


    # SIMPLE


    This model has been deemed as the easiest of all the recovery models that exist.
    It offers "full, differential, and file level" backups. However, backup of the
    transaction log is not supported. The log space would be reused whenever the checkpoint
    operation of the SQL Server background process takes place. The log file''s inactive
    part is deleted and made accessible for reuse.


    There is no support for point-in-time and restoration, the secondary read-only
    files can be restored.


    # FULL


    All types of transactions "DDL (Data Definition Language) as well as the DML (Data
    Manipulation Language)" in the transaction log file can be fully registered in
    the "FULL" recovery model. The sequence of logs remains untouched and maintained
    for restoration activities of the database. Unlike the "Simple Recovery Model",
    during the "CHECKPOINT" transaction, the "transaction log" file would not be truncated
    automatically.


    It supports all restoration activities, such as "point-in-time restore, page restore
    and file restore".


    # Bulk Logged


    The "Bulk Logged recovery model" is a unique database configuration option, which
    produces similar outcome as the "FULL recovery model" with the exception of some
    "bulk operations" that can be logged minimally. The "transaction log" file utilizes
    a method called as "minimal logging for bulk operations". The caveat being that
    specific point in time data cannot be restored.'
  merge: -1
  pgno: 451
- img_proc: true
  md: '# “SQL BACK DATABASE” Statement


    The "BACKUP DATABASE" statement can be utilized to generate a full back up of
    a database that already exists on the SQL server, as displayed in the syntax below:


    "BACKUP DATABASE databasename


    TO DISK = ''filepath'';


    # "SQL BACKUP WITH DIFFERENTIAL" Statement


    A "differential backup" is used to selectively back up the sections of the database
    which were altered after the last "full backup of the database", as displayed
    in the syntax below:


    "BACKUP DATABASE databasename


    TO DISK = ''filepath''


    WITH DIFFERENTIAL;


    # Example


    Consider that you have a database called “testDB” and you would like to create
    a full back up of it. To accomplish this, you can use the query below:


    "BACKUP DATABASE testDB


    TO DISK = ''D:\backups\testDB.bak'';


    Now, if you made modifications to the database after running the query above.
    You can use the query below to create a back up of those modifications:


    "BACKUP DATABASE testDB


    TO DISK = ''D:\backups\testDB.bak''


    WITH DIFFERENTIAL;


