  md: '# # Why Javascript?


    Why Learn Javascript?


    Here are a few points to consider:


    It is the programming language of web browsers (all the most important ones support
    it and have it activated by default: Firefox, Chrome, IE, Opera, Safari ...),
    which make it the most popular language on the Internet. There are other options,
    but they require installation and activation through plugins or only work in specific
    browsers.


    There is a real competition between browsers to optimize their engines and provide
    better support for JavaScript and your code to run faster. JavaScript is therefore
    increasingly stable and has better performance.


    It is fully integrated with HTML and CSS. Each plays a definite role in a web
    page: HTML is the markup language to create the structure, CSS is the language
    of styles to configure the presentation and JavaScript provides interactive and
    dynamic behavior.


    It will play an important role, enhancing its performance, with the arrival of
    HTML5 / CSS3


    It is very powerful and expressive, with syntax that keeps similarities with other
    very popular languages, but with particular characteristics.


    Is easy to learn. They have a fast learning curve and require little time investment
    to start using it.


    It is very easy to work with him. You do not need a web server or a special development
    environment. It is interpreted so we don''t have to compile code. We do not need
    to acquire licenses. A text editor (or a code editor that facilitates the task)
    and a browser is all you need. To that, we can add an add-on such as Firebug to
    debug and we are fully equipped with free and free tools.'
