    # Revoking User Privileges


    You will be using the "MySQL REVOKE" statement to revoke the privileges of any
    user account(s). MySQL enables withdrawal of one or more privileges or even all
    of the previously granted privileges of a user account.


    The query below can be used to revoke particular privileges from a user account:


    ```

    REVOKE privilege_type [(column_list)]

    [ priv_type [(column_list)]]...

    ON [object_type] privilege_level

    FROM user [, user]..."

    ```


    In the syntax above, we start by specifying a list of privileges that need to
    be revoked from a user account next to the "REVOKE" keyword. YAs you might recall
    when listing multiple privileges in a statement they must be separated by commas.
    Then we indicate the "privilege level" at which the "ON" clause will be revoking
    these privileges. Lastly we indicate the user account whose privileges will be
    revoked in the "FROM" clause.'
