  md: 'since while Internet Explorer uses JScript, the rest of browsers (Firefox,
    Opera, Safari, Konqueror) use JavaScript.


    # Javascript In Other Environments


    The unparalleled popularity of JavaScript as a web application programming language
    has been extended to other applications and non-web related environments. Tools
    like Adobe Acrobat allow you to include JavaScript code in PDF files. Other Adobe
    tools such as Flash and Flex use ActionScript, a dialect of the same JavaScript
    standard. Photoshop allows you to make small scripts using JavaScript and Java
    version 6 includes a new package (called javax.script) that allows you to integrate
    both languages.'
