    # Granting User Privileges


    As a new user account is created, there are no access privileges afforded to the
    user by default. The "GRANT" statement must be used in order "to grant privileges
    to the user account". The "GRANT" statement syntax is shown below:


    ```

    "GRANT privilege, [privilege],... ON privilege_level

    TO user [IDENTIFIED BY password]

    [REQUIRE tsl_option]

    [WITH [GRANT_OPTION | resource_option]]:"

    ```


    In the syntax above, we start by specifying one or more privileges following the
    "GRANT" clause. Every privilege being granted to the'
