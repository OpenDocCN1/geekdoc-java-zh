  md: 'The "SELECT" query dictates the columns and records that can be fetched from
    the table. For instance, if you would like to display just the "first name", "last
    name", and "job title" of all the employees you selectively desire to see the
    information pertaining to employees with "job title" as "sales rep", then you
    will be able to utilize the "SELECT" query to achieve this.


    Here is a standard syntax for "SELECT" statement:


    ```

    SELECT

    column_1, column_2, ...

    FROM

    table_1

    [INNER | LEFT | RIGHT] JOIN table_2 ON conditions

    WHERE

    conditions

    GROUP BY column_1

    HAVING group_conditions

    ORDER BY offset, length;"

    LIMIT offset, length;"

    ```


    The "SELECT" query above contains various provisions, as described below:


    The "SELECT" clause followed by a list of columns isolated by "comma" or an "asterisk
    (*)" suggests that all columns are to be returned.


    The "FROM" clause defines the table or view from which the data should be queried.


    The "JOIN" clause receives associated data from other tables based on the specified
    join criteria.


    In the "result set", the "WHERE" clause is utilized for selectively filtering
    the rows or records.'
  merge: -1
  pgno: 383
- img_proc: true
  md: 'The "GROUP BY" clause is utilized to selectively group simpler set of records
    and apply "aggregate functions" to each group.


    The "HAVING" clause is used to filter a group based on the "GROUP BY" clause specified
    groups.


    The "ORDER BY" clause can be utilized for specifying a list of columns to be sorted.


    The "LIMIT" clause can be utilized for restricting the number of rows displayed
    upon execution of the command.


    Note that only "SELECT" and "FROM" clauses are necessary to execute the command
    and all other clauses can be used on ad-hoc basis.


    For instance, if you are interested in displaying only the "first name", "last
    name", and "job title" of all employees, you can utilize the syntax below:


    # SELECT


    ```

    lastname, firstname, jobtitle

    ```


    # FROM


    ```

    employees;But if you would like to view all the columns in the “employees" table,
    use the syntax below:

    ```


    ```

    SELECT * FROM employees;

    ```


    In practice, it is recommended to list the columns you would like to view instead
    of using the asterisk (*) command, as the asterisk (*) will return all column
    data, some of which you may not be allowed to use. It will create "non-essential
    I/O disk and network traffic between the MySQL database server and the application".
    If the columns are defined explicitly, then the "result set" becomes simpler to
    predict and handle. Suppose you are using the asterisk (*) and some other user
    modified the table and generated additional columns, you would receive a "result
    set" containing different columns than needed. Moreover, the use of asterisk (*)
    can potentially reveal sensitive data to unauthorized users.'
