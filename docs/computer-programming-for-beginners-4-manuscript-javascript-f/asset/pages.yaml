    Now, let us look at every type of “JOIN” clause in detail!


    # “INNER JOIN”


    The “MySQL INNER JOIN” is used to align “rows” in one table with rows in other
    tables”, so that rows containing columns from the two tables can be queried.


    The “SELECT” statement is not required to contain the “INNER JOIN” clause for
    execution, which appears right next to the “FROM” clause.


    You must indicate the following requirements before using the "INNER JOIN" clause:


    Start with the primary table to be included in the “FROM" clause.


    Then, choose the table you would like to connect to the primary table included
    in the “INNER JOIN" clause, in step 1. Remember theoreticallyically you can join
    one table to multiple tables at the same time. However, it is recommended to restrict
    the number of tables to be joined, to achieve higher performance and efficiency.


    Lastly, the “join condition" or "join predicate" must be defined. Following the
    initial "ON" keyword for the “INNER JOIN", the “join condition" can be indicated.
    The join condition is the rule that'
  merge: -1
  pgno: 393
- img_proc: true
  md: 'dictates further matching of a row in the “primary table” with the records
    from the another table.


    The "INNER JOIN" clause syntax is given below:


    ```

    SELECT column_list

    FROM t1

    INNER JOIN t2 ON join_condition1

    INNER JOIN t3 ON join_condition2

    ...

    WHERE where_conditions;

    ```


    Now, for further simplification of the query above, just assume that you are interested
    in linking only tables “t1” and “t2” using the syntax below:


    ```

    SELECT column_list

    FROM t1

    INNER JOIN t2 ON join_condition;

    ```


    The "INNER JOIN" will compare each row of the "t1" table with every single record
    of the "t2" table to determine whether both of fulfill the defined "join condition".
    Once the "join condition" has been satisfied, the "INNER JOIN" then returns a
    new record, consisting of columns from both "t1" and "t2".


    Note that the records in both "t1" and "t2" need to be merged according to the
    "join condition". If no records from the two tables are identified meeting the
    "join condition", an empty "result set" is returned by the query. The same logic
    applies when more than two tables are joined.


    The Venn diagram in the picture below shows the working of the "INNER JOIN" clause.
    The records in the "result set" are required to be present in both "t1" and "t2"
    as represented by the section overlapping the 2 circles, depicting each table
    respectively.'
