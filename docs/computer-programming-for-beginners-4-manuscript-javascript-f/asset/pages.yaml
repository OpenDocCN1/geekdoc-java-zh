    # Forms


    Programming applications that contain web forms has always been one of the fundamental
    tasks of JavaScript. In fact, one of the main reasons why the JavaScript programming
    language was invented was the need to validate the form data directly in the user''s
    browser. In this way, it was avoided reloading the page when the user made mistakes
    when filling out the forms.


    However, the appearance of AJAX applications has relegated the treatment of forms
    as the main activity of JavaScript. Now, the main use of JavaScript is that of
    asynchronous communications with servers and that of dynamic manipulation of applications.
    In any case, the handling of the forms is still an essential requirement for any
    JavaScript programmer.


    # Basic Properties Of Forms And Elements


    JavaScript has numerous properties and functions that facilitate the programming
    of applications that handle forms. First, when a web page is loaded, the browser
    automatically creates an array called forms and that contains the reference to
    all forms on the page.


    To access the forms array, the document object is used, so document.forms is the
    array that contains all the forms on the page. As it is an array, access to each
    form is done with the same syntax of the arrays. The following instruction accesses
    the first form of the page: document.forms[0];


    In addition to the forms array, the browser automatically creates an array called
    elements for each of the forms on the page. Each array element contains the reference
    to all the elements (text boxes, buttons, drop-down lists, etc.) of that form.
    Using the syntax of the'
