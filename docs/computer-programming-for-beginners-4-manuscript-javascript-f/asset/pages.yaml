    # What you should know about plots


    Identify the best plot type for a given dataset and scenario


    Explain the design practices of certain plots


    Design outstanding, tangible visualizations


    We will describe visualizations in detail and give practical examples,

    such as comparing different stocks over time or comparing the ratings

    for different movies. Starting with comparison plots, which are great

    for comparing multiple variables over time, we will look at their types,

    such as line charts, bar charts, and radar charts. Relation plots are

    handy to show relationships among variables. We will cover scatter

    plots for showing the relationship between two variables, bubble

    plots for three variables, correlograms for variable pairs, and finally,

    heatmaps.


    Composition plots, which are used to visualize variables that are part

    of a whole, as well as pie charts, stacked bar charts, stacked area

    charts, and Venn diagrams are going to be explained. To get a deeper

    insight into the distribution of variables, distribution plots are used. As

    a part of distribution plots, histograms, density plots, box plots, and

    violin plots will be covered. Finally, we will talk about dot maps,

    connection maps, and choropleth maps, which can be categorized into

    geo plots.


    # Comparison Plots


    Comparison plots include charts that are well-suited for comparing

    multiple variables or variables over time. For a comparison among

    items, bar charts (also called column charts) are the best way to go.

    Line charts are great for visualizing variables over time. For a certain

    tperiod (say, less than ten time points), vertical bar charts can be

    used as well. Radar charts or spider plots are great for visualizing

    multiple variables for multiple groups.


