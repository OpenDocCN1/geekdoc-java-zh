  md: '# Database Security and Administration


    MySQL has an integrated advanced access control and privilege system that enables
    generation of extensive access guidelines for user activities and efficiently
    prevent unauthorized users from getting access to the database system.


    There are 2 phases in MySQL access control system for when a user is connected
    to the server:


    **Connection verification:** Every user must have a valid username and password,
    that is connected to the "MySQL database server". Moreover, the host used by the
    user to connect must be the same as the host in the "MySQL grant table".


    **Request verification:** After a link has been effectively created for every
    query executed by the user, MySQL will verify if the user has required privileges
    to run that specific query. MySQL is capable of checking user privileges at database,
    table, and field level.


    The MySQL installer will automatically generate a database called "mysql". The
    "mysql database" is comprised of 5 main grant tables. Using "GRANT" and "REVOKE"
    statements like, these tables can be indirectly manipulated.


    **User:** includes columns for "user accounts" and "global privileges". MySQL
    either accepts or rejects a connection from the host using these tables. A privilege
    given under the "user table" is applicable to all the databases on the "MySQL
    server".


    **Database:** comprises "database level" privileges. MySQL utilizes the "db_table"
    to assess the database that can be used by a user to access and to host the connection.
    A "database level" privilege in the "db_table" is applicable to the particular
    database and all the object available in that database, such as "tables, triggers,
    views, stored procedures", and many more.'
  merge: -1
  pgno: 461
- img_proc: true
  md: '“Table_priv" and "columns_priv": includes the "table level" and "column level"
    privileges. A privilege given in the "table priv" table is applicable to that
    particular table and its columns, on the other hand a privilege given in the "columns
    priv" table is applicable only to a particular column of the table.


    “Procs_priv": includes privileges for "stored functions" and "stored processes".


    MySQL uses the tables listed above to regulate MySQL server privileges. It is
    extremely essential to understand these tables before implementing your dynamic
    access control system.


    # Creating User Accounts


    You are able to indicate in MySQL which user is allowed to connect to the database
    server, but also host the user can use to build that connection. As a result,
    for every user account a "username" and a "host name" in MySQL is generated and
    divided by the "@" character.


    For instance, if an "admin user" is connected from a "localhost" to the "MySQL
    database server", the user account will be named as "admin@localhost". However,
    the "admin_user" is only allowed to connect to the "MySQL database server" using
    a "localhost" or a remote host like "mysqltutorial.org", which ensures that the
    MySQL database server has higher security.


    Moreover, by merging the "username" and "host", various accounts with the same
    name can be configured and still possess the ability to connect from distinct
    hosts while beng given distinct privilegi,


    In the "mysql database" all the user accounts are stored in the "user grant" table.


    # Using “MySQL CREATE USER” statement


    The “CREATE USER” is utilized with the MySQL server to setup new user accounts,
    as shown in the syntax below:'
  merge: -1
  pgno: 462
- img_proc: true
  md: '"CREATE USER user_account IDENTIFIED BY password;"


    In the syntax above, the "CREATE USER" clause is accompanied by the name of the
    user account in "username @ hostname" format.


    In the "IDENTIFIED BY" clause, the user password would be indicated. It is important
    that the password is specified in plain text. Prior to the user account being
    saved in the "user" table, MySQL is required to encrypt the "user password".


    For instance, the "CREATE USER" statement can be utilized as given below, for
    creating a new "user dbadmin", that is connected to the "MySQL database server"
    from "localhost" using user password as "SECRET"


    "CREATE USER dbadmin@localhost


    IDENTIFIED BY ''SECRET";


    If you would like to check the "privileges of a user account", you can run the
    syntax below:


    "SHOW GRANTS FOR dbadmin@localhost";


    ```

    +------------------------------------------------------+

    | Grants for dbadmin@localhost |

    +------------------------------------------------------+

    | GRANT USAGE ON *.* TO `dbadmin`@localhost'' | |

    +------------------------------------------------------+

    ```


    1 row in set (0.00 sec)"


    The * * * in the "result set" above indicates that the "dbadmin user" account
    is allowed to log into the server only and does not have any other access privilege.


    Bear in mind that the portion prior to the dot (.)" is representing the database
    and the portion after the dot (.)" is representing the table, for example, "database.table".


    The "percentage (%)" wildcard can be used as shown in the syntax below for allowing
    a user to create a connection from any host:'
