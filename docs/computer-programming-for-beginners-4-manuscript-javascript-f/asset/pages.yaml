  md: 'In the chapter 4 titled, "SQL Views and Transactions", you will learn the concept
    of "Database View" in SQL, which is simply a virtual table defined using the "SQL
    SELECT" statements with the "SQL JOIN" clause(s). There are a wide variety of
    advantages of using the "Database View" or "SQL View" as explained in this chapter.
    The "CREATE VIEW" statement is explained along with the underlying processing
    algorithms used in MySQL such as, "MERGE", "TABLE" and "UNDEFINED". You will also
    learn how to create a view from another existing view which may or may not include
    a sub query. The concept of "Updatable SQL Views" is also explained with examples
    and hands on exercises, so you can learn how to modify SQL views using "ALTER
    VIEW" and "CREATE REPLACE VIEW" statements. In SQL, transaction is defined as
    "a unit of work that is performed against a database. The different properties
