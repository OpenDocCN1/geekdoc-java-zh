    SQL TRANSACTIONS


    A transaction can be defined as "a unit of work that is performed against a database".
    They are "units or work sequences" that are performed in a "logical order", either
    manually by a user or automatically using by the database program.


    Or simply put, they are "the spread of one or more database modifications". For
    instance, if you create a row, update a row, or delete a row from the table, that
    means you are executing a transaction on that table. To maintain data integrity
    and address database errors, it is essential to regulate these transactions.


    Basically, to execute a transaction, you must group several SQL queries and run
    them at the same time.


    # Properties of Transactions


    The fundamental properties of a transaction can be defined using the acronym "ACID"
    for the properties listed below:


    +   **Atomicity** – guarantees successful completion of all operations grouped
    in the work unit. Or else, at the point of failure, the transaction will be aborted
    and all prior operations will be rolled back to their original state.


    +   **Consistency** – makes sure that when a transaction is properly committed,
    the database states are also correctly updated.


    +   **Isolation** – allows independent and transparent execution of the transactions.


    +   **Durability** – makes sure that in case of a system malfunction, the outcome
    or impact of a committed transaction continues to exist.


    To explain this concept in greater detail, consider the steps below for addition
    of a new sales order in the “MySQL sample database":


    Start by querying the most recent "sales order number" from the "orders" table
    and utilize the next "sales order number" as the new "order number".'
  merge: -1
  pgno: 442
- img_proc: true
  md: 'Then use the "INSERT" clause to add a new "sales order" into the "orders" table.


    Next, retrieve the "sales order number" that was inserted in the previous step.


    Now, "INSERT" the new "sales order items" into the "orderdetails" table containing
    the "sales order numbers".


    At last, to verify the modifications, select data from both "orders" and "orderdetails"
    tables.


    Try to think, how would the sales order data be modified, if even a single steps
    listed here were to fail, for whatever reason. For instance, if the step for inserting
    items of an order to the "orderdetails" table failed, it will result in an "empty
    sales order".


    This is where the "transaction processing" is used as a safety measure. You can
    perform "MySQL transactions" to run a set of operations making sure that the database
    will not be able to contain any partial operations. When working with multiple
    operations concurrently, if even one of the operation fails, a "rollback" can
    be triggered. If there is no failure, all the statements will be "committed" to
    the database.


    # “MySQL Transaction” statements


    MySQL offers statements listed below for controlling the transactions:


    For initiating a transaction, utilize the "START TRANSACTION" statement. The "BEGIN"
    or "BEGIN WORK" statement are same as the "START TRANSACTION".


    For committing the "current transaction" and making the modifications permanent,
    utilize the "COMMIT" statement.


    By using the "ROLLBACK" declaration, you can simply undo the current transaction
    and void its modifications.


    By using the "SET auto-commit" statement, you can deactivate or activate the auto-commit
    mode for the current transaction.'
