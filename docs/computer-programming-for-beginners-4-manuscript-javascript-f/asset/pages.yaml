    # LEFT JOIN


    The "MySQL LEFT JOIN" querying of data from 2 or multiple tables on a database.
    The "SELECT" statement is not required to contain the "LEFT JOIN" clause for execution,
    which appears right next to the "FROM" clause. The principles of "left table"
    and "right table" are implemented when the 2 tables are linked, using the "LEFT
    JOIN" clause.


    Unlike an "INNER JOIN", the LEFT JOIN or LEFT OUTER JOIN will return all records
    in the left table, the records meeting the "join condition" and the records that
    don''t. "NULL" value appears in the "result set" of the columns from the right
    table for rows that do not match the join condition.


    Now, to further simplify this query we will assume that we are interested in linking
    only tables "t1" and "t2" with the "LEFT JOIN" per the syntax below:


    ```

    SELECT

    t1.c1, t1.c2, t2.c1, t2.c2

    FROM

    t1

    LEFT JOIN

    ```'
  merge: -1
  pgno: 399
- img_proc: true
  md: 't2 ON t1.c1 = t2.c1;


    In the syntax above, you are using the "LEFT JOIN" clause to connect the "t1"
    to the "t2", on the basis of a record from the "left table t1" aligning a record
    from the "right table t2" as defined by the "join predicate (t1.c1= t2.c1)", which
    are then included in the "result set".


    If the record in the "left table" has no matching record that aligns with it in
    the "right table", then the record in the "left table" will still be selected
    and joined with a "virtual record" containing "NULL" values from the "right table".


    To put it simply, the "LEFT JOIN" clause enables selection of matching records
    from both the "left and right tables", as well as all records from the "left table
    (t1)", even without aligning records from the "right table (t2)".


    The "Venn diagram" shown in the picture below will help you understand how the
    working of the "LEFT JOIN". The overlapping section of the two circles includes
    records matched from the two tables, and the rest of the portion of the "left
    circle" includes records in the "t1" table with "no corresponding record in the
    t2 table". Therefore, the "result set" will include all records in the "left table".


    ![](img/9b98d008064517b1ee73609c763be0b4_400_0.png)


