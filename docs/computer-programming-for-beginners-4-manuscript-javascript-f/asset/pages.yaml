    # ## Radar Chart


    **Radar charts, also known as spider or web charts,** visualize multiple variables
    with each variable plotted on its own axis, resulting in a polygon. All axes are
    arranged radially, starting at the center with equal distances between one and
    another and have the same scale.


    # ## Uses:


    Radar charts are great for comparing multiple quantitative variables for a single
    group or multiple groups.


