  md: '# A Deep Dive into Data Types


    +   - Numbers


    As mentioned earlier, Python accommodates floating, integer and complex numbers.
    The presence or absence of a decimal point separates integers and floating points.
    For instance, 4 is integer while 4.0 is a floating number.


    On the other hand, complex numbers in Python are denoted as r+tj where j represents
    the real part and t is the virtual part. In this context the function type() is
    used to determine the variable class. The Python function instance() is invoked
    to make a determination of which specific class function originates from.


    # Example


    Start IDLE.


    Navigate to the File Menu and click New Window.


    Type the following:


    number=6


    ```

    print(type(number)) #should output class int

    print(type(6.0)) #should output class float

    complex_num=7+5j

    print(complex_num+5)

    print(isinstance(complex_num, complex)) #should output True

    ```


    Important: Integers in Python can be of infinite length. Floating numbers in Python
    are assumed precise up to fifteen decimal places.


