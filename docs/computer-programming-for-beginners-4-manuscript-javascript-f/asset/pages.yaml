  md: 'primitives create containers that store primitive values, reference types merely
    create locations in memory that store valuable information.


    When a primitive variable is used, it simply delivers the int or double or whatever
    value that is held within that variable. When a reference type is called, it refers
    to an address where information lives. In many cases, this really means nothing
    to you. You print a primitive, it gives you a value. You print a reference, it
    gives you a statement. However, it is useful to recognize the differences between
    primitives and references when they''re being assigned or compared.


    When you assign a variable to a primitive, it''s straightforward: the content
    of the primitive is copied to the other variable. When a reference is assigned,
    the address, not the content, is copied. In the same way, when we compare two
    primitives, the actual content of the variable is being compared. When two strings
    are compared, it''s really the addresses strings refer to that are being compared,
    not the content. This brings us to the idea of immutability.


