    # Finding Array Length


    What if we have an array storing all the usernames for our program, and we want
    to quickly see how many users we have? In this case, we will use the .length()
    method. To get the length of an array, we can access the length field of the array
    object:


    ```

    String[] multitems = new String[5];

    int multitemsLength = multitems.length;

    System.out.println(multitemsLength);

    ```


    This command would print "5". We defined an empty array with five slots that can
    hold the string type. We then defined a new variable of type and named it multitemsLength.
    We filled this variable with the output from the .length method that we used on
    the multitems array, which returns an int. We then printed this value using System.out.println();
    Notice that despite the fact that we never filled the multitems array with any
    values, we can still find the length because even empty arrays must be assigned
    a length when they''re defined.


