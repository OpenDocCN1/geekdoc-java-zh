    # “RIGHT JOIN"


    “RIGHT JOIN” or “RIGHT OUTER JOING” is similar to the “LEFT JOIN” with the only
    difference being the treatment of the tables, which has been reversed from left
    to right. Each record from the "right table (t2)” appears in the "result set"
    with a "RIGHT JOIN". The “NULL” value will be displayed for columns in the "left
    table (t1)” for the records in the “right table without any corresponding rows
    in the left table (t1)”.


    You could utilize the “RIGHT JOIN” clause to link tables “t1” and “t2” as illustrated
    in the syntax below:


    # SELECT


    ```

    *

    FROM t1

    RIGHT JOIN t2 ON join_predicate;

    ```


    In the syntax above, the right table is “t2” and the left table is “t1” and “join_predicate”
    indicated the matching criteria with which records from “t1” will be aligned with
    records from “t2”.


    With the execution of the query above, all the rows from the right table “t2”
    will be displayed in the “result set” and on the basis of the join condition,
    if no match are found for “t2” with the rows of “t1” then “NULL” value will be
    added to those columns from “t1” table.'
