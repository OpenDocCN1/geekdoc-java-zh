    # Structured Query Language


    The "Structured Query Language (SQL)" in context of relational databases is considered
    a standard user and application program interface. In 1986, "SQL" became a standard
    of "American National Standards Institute (ANSI)", and in 1987, it was added to
    the "International Organization for Standardization (ISO)". Since then, the standards
    have been frequently improved and are endorsed by all mainstream commercial relational
    DBMSs (with different extents of compliance).


    The relational model, SQL was one of the initial commercial languages, even though
    it is distinct from the relational structure in certain aspects, according to
    Codd. For instance, SQL allows organization of data rows and columns. The relational
    databases are highly extensible. After the initial database has been created,
    a new category can be easily introduced without needing to alter any current apps.


    # Types of SQL Queries


    Database languages are defined as "special-purpose languages", that enable execution
    of one or more of the tasks listed below and often called as "sublanguages":


    **Data definition language (DDL) –** It is used to define data types including
    their creation, modification, or elimination as well as the relationships among
    them. (As you go through this chapter, you will learn more about this topic)


    **Data manipulation language (DML) –**Only after the database is created and tables
    have been built using DDL commands, the DML commands can be used to manipulate
    the data within these tables and databases. The convenience of using DML commands
    is that they can readily be changed and rolled back if any incorrect modifications
    to the data or its values have been made. The DML commands used to perform specific
    tasks are:'
