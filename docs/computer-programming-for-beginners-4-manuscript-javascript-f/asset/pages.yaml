    # SQL “ALTER” command


    Usage – This command is primarily used to “add a column, remove a column, add
    different data constraints and remove predefined data constraints”.


    Data Constraints – In terms of SQL, “constraints” are nothing but specific rules
    applied to the data in the table. They can be applied at a “column level”, which
    is only applicable to the selected column or at a “table level”, which is applicable
    to all the columns in the table. They “limit” the type of data values that are
    allowed to be added to the table, to ensure the data in the table is accurate
    and reliable. Violating these constraints will abort the command that you are
    trying to execute.


    The data constraints can be added while creating the table (using the “CREATE”
    command) or once the table is generated (utilizing the “ALTER” command).


    The most widely used SQL constraints are:


    “NOT NULL” – It is utilized to make sure that the column always contains a value
    and does not hold a “NULL value”. Meaning, a new record cannot be added or a record
    that already exists cannot be modified, if there are no values added to this column.


    “UNIQUE” – This constraint is used to make that every single data value in a column
    is distinct from one another.


    “PRIMARY KEY” – This constraint is essentially a “combination of NOT NULL and
    UNIQUE” constraints. It serves as a unique identification for each record in the
    table, which is required to contain a data value. Only one “primary key” can be
    indicated for individual tables.


    “FOREIGN KEY” – This constraint serves as a unique identification for a record/row
    existing in a different table that has linked to'
  merge: -1
  pgno: 336
- img_proc: true
  md: 'the table you are working on. This helps in aborting commands that will break
    the link between the two tables i.e. invalid data cannot be added to the “foreign
    key” column as it has to be a value contained in the table that is holding specific
    column.


    “CHECK” - This constraint is used to make sure that all the data values in a column
    meet a specific condition and are limited to a predefined value range. Applying
    “Check” constraint on a column will allow only select values to be added to that
    column. However, applying “Check” constraint on a table will put restrictions
    on the values that can be added in specific columns, on the basis of the values
    defined in other columns of a row.


    “DEFAULT” – It is utilized to set a “default data value” for specific column,
    in case no other value has been specified for that column.


    “INDEX” - This constraint is utilized to “create and retrieve” data values from
    the database at a quick pace, using indexes which are not visible to the users.
    This should only be used for columns that will be searched more frequently than
    the others.


