    # MySQL "ORDER BY"


    When using the "SELECT" statement to query the data, the "result set" will not
    be organized in a particular format. That is where the "ORDER BY" clause can be
    utilized to organize the "result set" as desired. The "ORDER BY" clause will allow
    sorting of the "result set" on the basis of one or more columns as well as sorting
    a number of columns in ascending or descending order.


    Here is the "ORDER BY" clause syntax:


    ```

    SELECT column1, column2...

    FROM tbl

    ORDER BY column1 [ASC|DESC], column2 [ASC|DESC],...;

    ```


