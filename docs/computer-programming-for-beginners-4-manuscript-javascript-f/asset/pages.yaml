  md: '# Chapter 1:

    Getting Ready For Java


    # What is JDK?


    The Java Development Kit (JDK) is used along with the Java Virtual Machine (JVM)
    and the Java Runtime Environment (JRE) to develop Java programs. These technologies
    are distinct yet completely reliant upon each other and it''s important to understand
    the difference between the three. The Java Virtual Machine is what executes programs.
    The Java Runtime Environment is responsible for creating the Java Virtual Machine.
    Finally, the Java Development Kit is what programmers actually interact with in
    order to develop code that is executed by the JVM and JRE.


    # What is NetBeans?


    NetBeans is an Integrated Development Environment (IDE). IDEs allow programmers
    the ease of consolidating the various aspects of developing code. IDEs are useful
    in the ways that they increase productivity through consolidating the actions
    of editing source code, developing executable, and debugging.


    # Installing JDK and NetBeans


    In order to start writing code you''ll need to do two things: download the Java
    Development Kit and the NetBeans IDE. Both of these can be found using a quick
    google search. Download the most recent versions available (at the time of writing
    it should be 12.0.2 for the JDK and 8.0.2 for NetBeans.)'
