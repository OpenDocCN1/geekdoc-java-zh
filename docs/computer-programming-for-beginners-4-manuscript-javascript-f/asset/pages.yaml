    SQL “CREATE VIEW” command


    Usage – This command is primarily used to generate a “virtual view of the tables”
    in the database on the basis of the “result-set” of a SQL command. The view resembles
    an actual database table, in that it also has columns and rows but the data values
    can be called from a single or multiple tables in the database using SQL functions
    “WHERE” and “JOIN”. SQL Views” are used to enhance the structure of the data making
    it more user friendly.


    In SQL, the “WHERE” function is used to selectively filter the data or records
    on the basis of specific conditions. It is a highly versatile function and can
    also be used with other SQL statements including “UPDATE” and “DELETE”.


    Only latest and greatest data will be used for generation of a view!


    Syntax:


    ```

    CREATE VIEW view_name AS

    SELECT column1, column2, ...

    FROM table_name

    WHERE condition;

    ```


    Examples:


    Let’s go back to the database “database_football” and assume you would like to
    view details of the players who are 25 years old.'
