  md: '# # Chapter 1:

    Introduction to SQL and Data Definition Language


    A database could be defined as "an organized collection of information or data,
    which can be stored electronically on a computer system and accessed as needed".
    A Database Management System (DBMS) is defined as "a software that interacts with
    the end users, applications and the database itself to capture and analyze the
    data". "DBMS" is an integrated computer software package enabling users to communicate
    with a number of databases and access to the information stored on the database.
    The DBMS offers multiple features that enable big volumes of data to be entered,
    stored and retrieved as well as offers for managing how the data can be organized.
    Considering this close association, the term "database" is frequently used to
    refer to both databases as well as "DBMS".


    Existing DBMSs provide multiple features to manage and classify a database and
    its information into four primary functional groups as follows:


    **Data definition** – Definitions that represent the organization of data are
    created, modified and eliminated.


    **Update** – Inserting, modifying and deleting the actual data.


    **Retrieval** - Provision of data in a form that can be used directly or processed
    further by other applications. Data collected may be accessible in the same form
    as the one in the database or in a different form, acquired through alteration
    or combination of data sets from various databases.


    **Management** – User registration and tracking, data security enforcement, performance
    tracking, data integrity, competence control, and the recovery of data damaged
    by a certain event, for example, an accidental glitch in the system.'
  merge: -1
