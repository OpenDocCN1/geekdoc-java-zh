  md: '“Insert” – For insertion of new rows in the table.


    “Update” – For modification of the data values contained in the rows of the table.


    “Deletion” – For deletion of selected rows or complete table within the database.


    “Lock” – To define the user access to either “read only” or “read and write” privilege.


    “Merge” – To merge couple of rows within a table.


    “Data control language (DCL)” – As the name indicates, the DCL commands provide
    to pertain to data control problems in a database. DCL commands provide users
    with unique database access permissions and are also used to define user roles
    as applicable. There are two DCL commands that are frequently used:


    “Grant” – To get access permissions to the users.


    “Revoke” – To remove the access permission to the users.


    “Data query language (DQL)” – DQL comprises of a single command that drives data
    selection in SQL. In conjunction with other SQL clauses, the “SELECT” command
    is used for collection and retrieval of data from databases or tables based on
    select user-applied criteria. A “SELECT” statement is used to search for data
    and computing information from table and/or database.


    “Transaction control language (TCL)” – As indicated by its name, TCL administers
    transaction related issues and problems in a database. They are used to restore
    modifications made to the original database or confirm them.


    Roll back implies the modifications “Undo,” and Commit means the modifications
    “Apply.” The 3 main TCL commands available are:


    “Rollback” – Used to “cancel or undo” any updates made in the table or database.'
