  md: 'Line charts are used to display quantitative values over a continuous time
    period and show information as a series. A line chart is ideal for a time series,
    which is connected by straight-line segments.


    The value is placed on the y-axis, while the x-axis is the timescale.


    Uses:


    Line charts are great for comparing multiple variables and visualizing trends
    for both single as well as multiple variables, especially if your dataset has
    many time periods (roughly more than ten).


    For smaller time periods, vertical bar charts might be the better choice.


    The following diagram shows a trend of real-estate prices (in million US dollars)
    for two decades. Line charts are well-suited for showing data trends:


