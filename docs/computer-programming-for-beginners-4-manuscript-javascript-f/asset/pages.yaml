    to the server from any "subdomain" of the "mysqltutorial.org" host, the "percentage
    (%)" wildcard can be used as shown in the syntax below:


    ```

    "CREATE USER mysqladmin@%.mysqltutorial.org"

    ```


    ```

    IDENTIFIED BY ''secret'';",

    ```


    It should also be noted here, that another wildcard "underscore (_)" can be used
    in the "CREATE USER" statement.


    If the host name portion can be omitted from the user account, server will recognize
    it and enable the user to get connected from any host. For instance, the syntax
    below will generate a new remote user account that allows creation of a connection
    to the server from any host:


    ```

    "CREATE USER remote;",

    ```


    To view the privileges given to the "remote" account, you can use the syntax below:


    ```

    "SHOW GRANTS FOR remote;"

    ```


    | +--------------------------------+ |

    | Grants for remote@*.remote@`%'' |

    | +--------------------------------+ |

    | GRANT USAGE ON `.*` TO `remote@`%'' | |

    | +--------------------------------+|


    1 row in set (0.00 sec)


    It is necessary to remember that the single quote ('' '') in the syntax above
    is particularly significant, if the user account has special characters like "underscore"
    or "percentage". .'
