    language" was coined. The concept of DDL required the database schema to be developed
    in a syntax that described the "records, fields and sets of the user data model".
    Subsequently, DDL was considered a subset of "SQL" used to declare tables, columns,
    data types and constraints. The third major revision of SQL called "SQL – 92",
    laid the foundation for "schema manipulation language and schema information tables
    to query schemas". In "SQL – 2003" the data tables were described as "SQL/Schemata".'
