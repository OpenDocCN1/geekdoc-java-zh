  md: '# Chapter 3:

    nThe World of Variables


    We''ve discussed the basic needs of a Java program, classes and methods. We know
    methods contain tasks that are executed by a program in order to tell our computers
    what to do, but what kind of tasks we can execute? We now dive into the kind of
    things you''ll be putting in your methods.


    Let''s say we''re asked to develop a program that will help users find new jobs.
    In order to do this we will at some point need to know some basic facts about
    the person trying to find a job. We''ll need the users name, their age, salary,
    date of birth, employment status, etc. All of these pieces of information will
    need to be stored somewhere within our program. This is the role of variables.
    In Java, variables are named locations in memory, essentially contains that programmers
    use to store values that these values can be called later in the program.


    Variables give context and meaning to the data that is being stored. Without a
    unit associated with it, the number 42 on its own could refer to infinitely many
    things. It could be someone''s age, a weight in pounds or kilograms, it could
    be the number or orders placed, who knows. Without a specified variable we''ll
    never know why the number 42 is important. Examples of names for variables could
    be weightInPounds, or numOrdersPlaced. When naming variables it''s common practice
    to leave no spaces between words and to leave the first word lowercase while all
    following words are capitalized (this is referred to as camelCase). You can technically
    name your variables anything you want, however, the more obvious of a name you
    choose the easier it will be to remember what the variable stores and its purpose.


    In Java, we need to specify the type of information we''re storing. Primitive
    data types are built-in to the Java system and are used to tell the computer what
    type of information is being held by a variable.'
  merge: -1
  pgno: 495
