  md: 'In the chapter 2 titled, “Creating a database using SQL and maintaining data
    integrity”, you will be introduced to “MySQL”, which is a “free and open source
    relational database management system”. There are a variety of user interfaces
    available with “MySQL” servers including “MySQL workbench”, “phpMyAdmin”, “Adminer”,
    “ClusterControl”, “Database workbench”, “DBeaver”, “DBEdit”, “HeidiSQL”, “Sequel
    Pro”, “Toad” among others; which are used by anyone looking to execute SQL queries
    on the MySQL database server. You will be walked through the process of installing
    MySQL on your operating system(s). Since, this is an open and free program you
    can easily download and install it on your system, you can make the best of this
    book and included hands-on exercises and example to effectively learn the SQL
    programming language. You will be learning how to generate a whole database and
    subsequently create tables and insert data into those tables on the “MySQL” server.
    You will also learn the concept of temporary tables, derived tables and how you
    can generate a new table from a table already present in the database.


    In the chapter 3 titled, “SQL Joins and Union commands”, you will be introduced
    to the “SQL SELECT” statement along with the various Data manipulation clauses
    including “ORDER BY”, “WHERE”. The key concept of SQL Joins is presented in detail
    including different “SQL JOIN” functions such as “INNER JOIN”, “LEFT JOIN”, “RIGHT
    JOIN”, “CROSS JOIN” and “SELF JOIN”. The syntaxes of these clauses are explained
    in exquisite detail with the examples and pictures of the result set that you
    can expect to obtain while performing hands-on execution of the examples on your
    MySQL instance. This effort has been made to bolster your understanding and allow
    hands on practice of the SQL programming language. In this chapter, you will also
    learn about the “SQL union” function that is used to collate a number of outputs
    into a single comprehensive result set. The “MySQL UNION” and “MySQL UNION ALL”
    statements are presented in detail along with the distinction between MySQL join
    and union functions.'
