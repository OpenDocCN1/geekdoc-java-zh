    Immutability means that an object''s internal state can be altered. More generally,
    once an immutable object has been created, it will remain the same throughout
    the life of that object. Strings, instance, are immutable. Once a string is declared,
    it''s content cannot be altered. Even methods contained within the String class
    such as replace(), which one assumes would change a string, must be initialized
    under a new string.


