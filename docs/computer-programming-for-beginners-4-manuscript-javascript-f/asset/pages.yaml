    The case is case sensitive: as is the case with the syntax of the XHTML tags and
    elements. However, if an XHTML page is used interchangeably, the page is displayed
    correctly, the only problem being the non-validation of the page. On the other
    hand, if JavaScript is exchanging upper and lower case letters, the script does
    not work.


    The type of the variables is not defined: when creating a variable, it is not
    necessary to indicate the type of data that will be stored. In this way, the same
    variable can store different types of data during script execution.


    It is not necessary to end each sentence with the semicolon character (;); in
    most programming languages, it is mandatory to finish each sentence with the character;
    Although JavaScript does not require you to do so, it is convenient to follow
    the tradition of ending each sentence with the semicolon character ().


    Comments can be included: comments are used to add information in the source code
    of the program. Although the content of the comments is not displayed on the screen,
    it is necessary to take precautions on the information included in the comments.


    JavaScript defines two types of comments: those of a single line and those that
    occupy several lines.


    Example of a single line comment:


    ```

    // below is an alert message "test message";

    ```


    Single line comments are defined by adding two slashes (//) at the beginning of
    the line.


    Example of multi-line comment:


    ```

    /* Multi-line comments are very useful when you need to include enough information
    in comments * / alert("test message");

    ```


    Multiline comments are defined by enclosing the text of the comment between the
    symbols / * and * /'
