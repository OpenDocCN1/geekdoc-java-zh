    # “Processing algorithms”


    The attribute of the algorithm enables you to regulate which mechanism is utilized
    by MySQL to create the “SQL View”. Three algorithms are provided by MySQL, namely:
    “MERGE”, “TEMPTABLE” and “UNDEFINED”.


    To use the “MERGE” algorithm, server will start by combining the incoming query
    with the “SELECT” statement, that will define the “view” into a merged query.
    Subsequently, the merged query is executed by MySQL to retrieve the “result set”.
    The “MERGE” algorithm cannot be used if the “SELECT” statement consists of aggregate
    functions” such as “MIN, MAX, SUM, COUNT, AVG or DISTINCT, GROUP BY, HAVING, LIMIT,
    UNION, UNION ALL, subquery. If the “SELECT” statement does not refer to a table,
    then the “MERGE” algorithm cannot be utilized. In the cases, where the “MERGE”
    algorithm is not permitted, server will instead use the “UNDEFINED” algorithm.
    Please remember that the view resolution is defined as “the combination of input
    query and the query in the view definition into one query”.


    Using the “TEMPTABLE” algorithm, server will start with production of a “temporary
    table” that describes the “SQL View” on the basis of the “SELECT” statement. Subsequently
    any incoming query will be executed against this “temporary table”. The “TEMPTABLE”
    algorithm is lower efficiency than the “MERGE” algorithm because MySQL requires
    generation of a “temporary table” to store the “result set” and will transfer
    the data'
