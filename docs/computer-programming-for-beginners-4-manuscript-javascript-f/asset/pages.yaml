    # Views in MySQL server


    As of the release of MySQL version 5+, it has been supporting database views.
    In MySQL, nearly all characteristics of a "View" conform to the "standard SQL:
    2003".


    MySQL can run queries against the views in couple of ways:


    MySQL can produce a "temporary table" on the basis of the "view definition statement"
    and then execute following queried over this "temporary table".


    MySQL can combine the new queries with the query that defines the "SQL View" into
    a single comprehensive query and then this merged query can be executed.


    MySQL offers versioning capability for all "SQL Views". Whenever a "SQL View"
    is modified or substituted, a clone of the view is backed up in the "arc (archive)
    directory" residing in a particular database folder. The "backup file" is named
    as "view name.frm-00001". If you modify your view again, then MySQL will generate
    a new "backup file" called "view name.frm-00002".


    You can also generate a view based on other views through MySQL, by creating references
    for other views in the "SELECT" statement defining the target "SQL View".


