    # Creating a new database table using "MySQL server"


    You will be using the "MySQL CREATE TABLE" statement to build a new table in a
    database. The "CREATE TABLE" command is considered as one of the most complicated
    statements in SQL. A simple "CREATE TABLE" syntax can be written as below:


