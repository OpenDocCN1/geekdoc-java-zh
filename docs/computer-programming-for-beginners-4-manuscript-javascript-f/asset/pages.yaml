    # “CROSS JOIN”


    The “CROSS JOIN” clause is used to obtain a “Cartesian product”, which is defined
    as a “join of every row of one table to every row of another table”. When the
    “CROSS JOIN” clause is utilized, the “result set” contains all rows from the two
    tables, which are a composite of the record from the “first table” and record
    from the second table. This case exists only when a “common link or column between
    the two tables” that are joined cannot be found.


    The biggest drawback is sheer volume of data, assume each table contains 1,000
    rows, then the "result set" will contain 1,000x 1,000=1,000,000 rows.


    You could utilize the “CROSS JOIN” to join “t1” and “t2” as displayed below:


    ```

    SELECT

    *

    FROM

    T1

    CROSS JOIN

    t2;

    ```


    Unlike the “RIGHT JOIN” and “LEFT JOIN”, the “CROSS JOIN” can be operated without
    using a “join predicate”. Moreover, if the “WHERE” clause is added to the “CROSS
    JOIN” and the two tables “t1” and “t2” have a connection then the “CROSS JOIN”
    will operate as “INNER JOIN”, as displayed in the syntax below:'
