    To verify that all the privileges from the "rfc" user have been revoked, you will
    need to use the query below:


    ```

    "SHOW GRANTS FOR rfc.*;"

    ```


    ```

    "GRANT USAGE ON *.* TO ''rfc''@''%%"

    ```


    Remember, as mentioned in the privileges description table earlier in this book,
    the "USAGE" privilege simply means that the user has no privileges in the server.


    # Resulting impact of the “REVOKE” query


    The impact of "MySQL REVOKE" statement relies primarily on the level of privilege
    granted to the user account, as explained below:


    The modifications made to the "global privileges" will only take effect once the
    user has connected to the MySQL server in a successive session, post the successful
    execution of the "REVOKE" query. The modifications will not be applicable to all
    other users connected to the server, while the "REVOKE" statement is being executed.


    The modifications made to the database privileges are only applicable once a "USE"
    statement has been executed after the execution of the "REVOKE" query.'
