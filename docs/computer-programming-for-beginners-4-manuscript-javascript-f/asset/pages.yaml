  md: '# MySQL SELECT DISTINCT


    You can receive duplicate rows when searching for information from a table. You
    could utilize the "DISTINCT" clause in the "SELECT" query to get rid of these
    redundant rows.


    The "DISTINCT" clause syntax is given below:


    ```

    SELECT DISTINCT

    columns

    FROM

    table_name

    WHERE

    where_conditions;

    ```


    # EXAMPLE


    The syntax below presents an example for the "DISTINCT" clause, used to selectively
    view "unique last names" of the employees from the "employees" table.


    First, you need to display the "last names" of all employees from the "employees"
    tables using the syntax below:


    ```

    SELECT

    last name

    FROM

    employees

    ORDER BY last name;

    ```


    Now to get rid of the repeated last names, use the syntax below:


    ```

    SELECT DISTINCT

    last name

    FROM

    employees

    ORDER BY last name;

    ```'
