  md: '# Chapter 4:

    Strings and Arrays


    # Strings


    So far, we have learned primitive data types, which are the simplest types of
    data with no built-in behavior. Our programs will use Strings, which are sequences
    of characters defined as objects instead of primitives. Objects have built-in
    behavior. Strings are widely used in Java programming. We declare strings in the
    same way we declare any variable; with a type and a name.


    ```

    String example = “Hello World";

    System.out.println(example);

    ```


    Here, we have declared a string with the name “greeting”, and assigned it the
    value Hello World. Now instead of typing Hello World every time you want to print
    it, you can simply reference the greeting string. When printed using System.out.println(),
    this string will print Hello World to our screens.


    # String Methods


    By of how useful strings are for storing information, Java has dedicated an entire
    class to them. This class is crucial for Java programming as it provides an extensive
    library of useful methods to help us perform operations on strings that we will
    use to manipulate data. We will discuss seven of the most useful string methods
    available: length(), concat(), equals(), indexOf(), substring(), toUpperCase(),
    and toLowerCase().


    # length()


    In Java, the length() string method returns, as you may have guessed, the length
    of a string. If we have a named example, then running str.length() would return
    a range of values indicating the amount of characters included within the example
    string.'
