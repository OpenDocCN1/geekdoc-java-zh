    # DERIVED TABLES IN MySQL Server


    A "derived table" can be defined as a "virtual table returned upon execution of
    a SELECT statement. A "derived table" seems to be comparable to a "temporary table",
    however, in the "SELECT" statement it is much easier and quicker to use a "derived
    table" than a "temporary table" as it would not entail additional steps to create
    the "temporary table".


    There is often interchangeable use of the term "derived table" and "subquery".
    When the FROM in "SELECT" query uses a stand-alone "subquery", it is called as
    a "derived table". For example, the syntax below can be used to create a "derived
    table":


    ```

    SELECT

    column_list

    FROM

    (SELECT

    column_list

    FROM

    table_1) derived_table_name

    WHERE derived_table_name.c1 > 0;

    ```


    A "derived table" is required to have an alias, which can be referenced in future
    queries, however, there is no such requirement for a subquery. If there is no
    alias defined for a "derived table", the error message below will be displayed
    by MySQL:


    "Every derived table must have its own alias."'
