    # Arrays


    In the context of Java, an array is an extremely important object. Arrays serve
    as containers to hold a constant number of values of the same data type. When
    we declare an array, memory space is allocated for a specified number of values
    of a specified type. At the time of creation, the length of an array must be declared
    and cannot be changed.


    Imagine that we’re using a program to keep track of the prices of different clothing
    items we want to buy. We would want a list of the prices and a list of the items
    they correspond to. Establishing an array is similar to establishing a typical
    variable.


    ```

    double priceOfClothes;

    ```


    ```

    double[] priceOfClothes;

    ```


    Take a look at the two lines above. The first line declares a variable of type
    double with the name priceOfClothes. We’ve declared variables of this type before
    in chapter 3. The next line, on the other hand, is slightly different. Notice
    the pair of brackets [] next to the data type double. The presence of these brackets
    declares an array, meaning that we have declared an array named pricesOfClothes
    that will contain values of the double data type.


    Now that our array is declared we can do two things: assign values to it directly
    or leave it empty to be filled at a later time. How do we go about doing this?
    To fill your array directly is easy, simply list the values you want to array
    to.


    ```

    double[] pricesOfClothes = {32.29, 15.78, 9.01, 100.28};

    ```


    Our pricesOfClothes array now contains four elements. One of the benefits of arrays
    is that any element within that array, as long as'
