    # Namespace in Python


    When we start the Python interpreter, a namespace containing inbuilt names is
    created as long as the workspace remains active. Inbuilt functions such as print()
    and id() exist throughout the program.


    Built-in Namespace: These are functions, methods, and associated data that immediately
    accessible as soon as the Python interpreter loads and as as such are accessible
    to each instance and area of the workspace.


    Global Namespace: This involves the contents of a module that are accessible throughout
    the module. Modules can have several functions and methods.


    Local Namespace: Mostly for user-defined functions, a local namespace is restricted
    to the particular function and outside the function access is not implicitly possible.


    # Variable Scope


    Even though there might be several unique namespaces specified, it may not be
    possible to access all of the namespaces given because of scope. The concept of
    scope refers to a segment of the program from where we access the namespace directly
    without any prefix. The following are the scope types:


    +   i. Scope containing local names, current function.

    ii. Scope containing global names, the scope of the module.

    iii. Scope containing built-in names of the outermost scope.


