  md: '# Chapter 4:

    SQL Views and Transactions


    A "Database View" in SQL can be defined as a "virtual table" or "logical table"
    described as "SQL SELECT" statement containing join function. As a "Database View"
    is like a table in the database consisting of rows and columns, you will be able
    to easily run queries on it. Many DBMSs, including "MySQL", enable users to modify
    information in the existing tables using "Database View" by meeting certain prerequisites,
    as shown in the picture below.


    A "SQL View" can be deemed since there is no connection between the "SQL View"
    to the physical system. The database system will store "SQL Views" in the form
    on "SELECT" statements using "JOIN" clause. When the information in the table
    is modified, the "SQL View" will also reflect that modification.


    ![](img/9b98d008064517b1ee73609c763be0b4_424_0.png)


    # Pros of using SQL View


    A "SQL View" enables simplification of complicated queries: a "SQL View" is characterized
    by a SQL statement which is associated with'
  merge: -1
  pgno: 424
- img_proc: true
  md: 'multiple tables. To conceal the complexity of the underlying tables from the
    end users and external apps, "SQL View" is extremely helpful. You only need to
    use straightforward "SQL" statements instead of complicated ones with multiple
    "JOIN" clauses using the "SQL View".


    A "SQL View" enables restricted access to information depending on the user requirements.
    Perhaps you would not like all users to be able to query a subset of confidential
    information. In such cases "SQL View" can be used to selectively expose non-sensitive
    information to a targeted set of users.


    The "SQL View" offers an additional layer of safety. Security is a key component
    of every "relational database management system". The "SQL View" ensures "extra
    security" for the DBMS. The "SQL View" enables generation of a "read-only" view
    to display "read-only" information for targeted users. In "read-only view", users
    are able to retrieve data and are not allowed to update any information.


    The "SQL View" is used to enable computed columns. The table in the database is
    not capable of containing computed columns but a "SQL View" can easily contain
    computed column. Assume in the "OrderDetails" table there is "quantityOrder" column
    for the amount of products ordered and "priceEach" column for the price of each
    item. But the "orderDetails" table cannot contain a calculated column storing
    total sales for every product from the order. If it could, the database schema
