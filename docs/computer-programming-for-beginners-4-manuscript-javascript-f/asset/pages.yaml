    and “RAID disk arrays” used for long term storage of the data are called as "database
    servers". If one of the disks fails RAID can be used to recover the data. In a
    heavy volume transaction processing setting, "hardware database accelerators"
    linked to single or multiple servers via the high-speed channel are being utilized.
    Most database applications have DBMS at their core. DBMS may be created with built-in
    network assistance around a custom multi-tasking kernel, but contemporary DBMSs
    typically use a normal operating system to offer the same functionalities.


    As DBMS represent an important market, DBMS requirements are often taken into
    consideration by computers and storage providers in their own production plans.


    "Databases” and “DBMSs” can be grouped by on the basis of following parameters:


    The supported database models, for example, relational or XML databases.


    The variety of computers on they can operate on, for example, “server cluster
    to a mobile device".


    The query language in use, for example, “SQL” or “XQuery”.


    The “internal engineering” which drives the efficiency, scalability, resiliency,
    and safety of the system.


