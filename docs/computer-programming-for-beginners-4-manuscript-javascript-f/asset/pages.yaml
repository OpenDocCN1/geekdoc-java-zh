  md: '# # Chapter 12:

    Data Processing, Analysis, and Visualization


    If you work with data, then Data Visualization is an important part of your daily
    routine. And if you happen to use Python programming language for your analysis,
    you must be overwhelmed by the sheer number of choices available in the form of
    data visualization libraries. There are some libraries like Matplotlib which are
    used for initial exploration but are not so useful for showing complex relationships
    in data. There are some which work well with large datasets while there are still
    others which major focus on 3D renderings. There is not a single visualization
    library that can be considered perfectly the best. There are certain features
    in one that is better than the other and vice versa. In short, there are a lot
    of options, and it is impossible to learn and try them all or maybe, get them
    all to work together. So do we get our job done? PyViz definitely has the answer.


    # ## Understanding Data Processing


    Data processing is the act of changing the nature of data into a form that is
    more useful and desirable. In other words, it is making data more meaningful and
    informative. By applying machine learning algorithms, statistical knowledge, and
    mathematical modeling, one can automate this whole process. The output of this
    whole process can be in any form like tables, graphs, charts, and much more, based
    on the activity done and the requirements of the machine.


    This might appear simple, but for big organizations and companies like Facebook,
    Twitter, UNESCO, and health sector organizations, this whole process has to be
    carried out in a structured way. The diagram below shows some of the steps that
    are followed:'
  merge: -1
  pgno: 294
- img_proc: true
  md: '![](img/9b98d008064517b1ee73609c763be0b4_295_0.png)


    Let''s look in detail at each step:


    # Collection


    The most important step when getting started with Machine Learning is to ensure
    that the data available is of great quality. You can collect data from genuine
    sources such as Kaggle, data.gov.in, and UCI dataset repository. Please see the
    following example, when students are getting ready to take a competitive exam,
    they always find the best resources to use to ensure they attain good results.
    Similarly, accurate and high-quality data will simplify the learning process of
    the model. This means that during the time of testing, the model would output
    the best results.


    A great amount of time, capital, and resources are involved in data collection.
    This means that organizations and researchers have to select the correct type
    of data which they want to implement research.'
  merge: -1
  pgno: 295
- img_proc: true
  md: 'For instance, to work on the Facial Expression Recognition requires a lot of
    images that have different human expressions. A good data will make sure that
    the results of the model are correct and genuine.


    # Preparation


    The data collected can be in raw form. Raw data cannot be directly fed into a
    machine. Instead, something has to be done on the data from a wide array of sources,
    analyzing the datasets, and then building a new data set for additional processing
    and exploration. Preparation can be done manually or automatically and the data
    should be prepared in numerical form to improve the rate of learning of the model.


    # Input


    Sometimes, data already prepared can be in the form which the machine cannot read,
    in this case, it has to be converted into readable form. For conversion to take
    place, it is important for specific algorithm to be present.


    To execute this task, intensive computation and accuracy is required. Please see
    the following example, you can collect data through sources like MNIST, audio
    files, twitter comments, and video clips.


    # Processing


    In this stage, ML techniques and algorithms are required to execute instructions
    generated over a large volume of data with accuracy and better computation.


    # Output


    In this phase, results get procured by the machine in a sensible way such that
    the user can decide to reference it. Output can appear in the form of videos,
    graphs, and reports.


    # Storage


    This is the final stage where the generated output, data model, and any other
    important information are saved for future use.


    # Data Processing in Python'
