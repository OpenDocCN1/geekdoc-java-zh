    # Variables


    The variables in the programming languages follow a logic similar to the variables
    used in other fields such as mathematics. A variable is an element that is used
    to store and reference another value. Thanks to the variables it is possible to
    create "generic programs", that is, programs that always work the same regardless
    of the specific values used.


    In the same way that if in Mathematics the variables did not exist the equations
    and formulas could not be defined, in programming one could not make useful programs
    without the variables. If there were no variables, a program that adds two numbers
    could be written as: result = 3 + 1


    The previous program is so unhelpful it it applies to the case where the first
    number of the sum is 3 and the second number is 1. In any other case, the program
    obtains an incorrect result.


    However, the program can be remade as follows using variables to store and refer
    to each number:


    ```

    number_1 = 3 number_2 = 1

    result = number_1 + number_2

    ```


    Elements number_1 and number_2 are variables that store the values used by the
    program. The result is always calculated based'
