    A value is going to be returned that will be greater than zero, less than zero,
    and have a value that equals zero.


    It is going to be up to you to make sure that the proper value is assigned so
    that the compareTo is returned to the variable. If statements are going to be
    in the code to test and see what the result is going to be.


    But, when two strings are compared, Java is going to compare the hexadecimal values
    instead of the word’s letters. Since both have uppercase letters the A for App
    is going to be used before ape.


    indexOf


    The indexOf is going to locate a character inside of the current string or any
    other string.


    Code


    package prjstrings ;


    public class StringManipulation {


    public static void main (String[] args) {


    char ampersand = ‘ @ ‘ ;


    String email_address = “meme@me.com” ;


    int result ;


    result = email_address.indexOf( ampersand ) ;


    System.out.println(result) ;


    }


    }


    This code is checking to see if the @ symbol is located in the email address that
    was provided. Because of the single quotes it is a char variable. Once the email
    has been set up, you are going to have your result which will be an int variable.
    Therefore, your result is going to be an integer thanks to the indexOf method.


    The position for your ampersand is going to be the result for this code because
    of this line:


    result = email_address.indexOf( ampersand );


    The string that you want searched first is going to come after the dot when you
    specify that you want to use the indexOf method. Between the parentheses is going
    to be where you will have several options. First, you can type in a single character.
    With this, Java will tell you the position of the character in the string before
    it stores the value for the result of the variable.


    When the code is run, the output is going to be four. Since indexOf starts at
    zero like everything else, the ampersand is going to be the fourth character in
    the email string.


    Should the character that you are looking for not exist, then indexOf will give
    you a result of negative one.


    Code


    package prjstrings ;


    public class StringManipulation {


    public static void main(String[] args) {


    char ampersand = ‘ @ ‘ ;


    String email_address = “mememe.com” ;


    int result ;


    result = email_address.indexOf( ampersand ) ;


    if ( result == -1 ) {


    System.out.println( “invalid email address” ) ;


    }


    else {


    System.out.println( “email address is okay” ) ;


    }


    }


    }


    Your result of negative one is going to allow the client to continue.


    IndexOf can also be used to test for multiple characters.


    public static void main (String[] args) {


    String dotcom = “ .com “ ;


    String email_address = “ meme@me.com “ ;


    int result ;


    result = email_address.indexOf( dotcom ) ;


    if (result == -1( {


    System.out.println( “invalid email address” ) ;


    }


    else {


    System.out.println(“email address is okay”) ; 


    }


    }


    While this code looks exactly the same, you are now going to be using the variable
    from the string in order to hold the text that you want to check for instead of
    the char variable.


    With another result of negative one being returned, the text that was searched
    for could not be found in the string that comes before the dot for the indexOf
    method. If it had, then the indexOf would have returned the character that first
    matched what you were searching for.


    In the code listed above, the dot is going to be the seventh character inside
    of the email address whenever you start counting from zero.


    ## Conclusion


    Thank for making it through to the end of Java: Beginner’s Guide to Programming
    Code with Java, let’s hope it was informative and able to provide you with all
    of the tools you need to achieve your goals whatever it may be.


    The next step is to download Java like it was stated in the first chapter and
    to begin writing out your code. Java is going to have a lot of different rules
    that are going to confuse you, however, this is not something that should discourage
    you. In the event that you get confused when you are going through your practice,
    you can always go back and reread what has been written.


    You are bound to mess up, but it is going to happen. Do not worry about any mistakes
    that you make, you can erase them and start over when an error code has been given
    to you. Be patient with your coding abilities because they are not going to be
    spot on the first time. It will take you some time before you are an expert in
    Java or any other language that you decide to learn along the way.


