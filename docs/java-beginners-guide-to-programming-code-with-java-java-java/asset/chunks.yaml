    \n```java\nBoolean client = true;\nif ( client == true) {\n    System.out.println\
    \ (“it’s true”) ;\n}\nelse {\n    System.out.println(“it’s false”) ;\n}\n```\n\
    \n`if` 语句将检查由 `client` 输入的变量是否为 `true`。`else` 将检查它是否为 `false`。你不需要说“else if (\
    \ client == false)”。当某事结果不是 `true` 时，它显然是 `false`。你会使用 `else`，因为对于布尔值来说只有两种选择。\n\
    \n另一个用于条件的的运算符是 `NOT` 运算符，它用于布尔值。\n\n#### 代码\n\n```java\nBoolean client = true\
    \ ;\nif( !client) {\n    System.out.println (“it’s false”) ;\n}\nelse {\n    System.out.println\
    \ (“it’s true”) ;\n}\n```\n\n`NOT` 运算符将位于 `client` 变量之前。这个运算符将使用单个感叹号，但它会落在必须测试的变量之前。代码将进行取反测试，这意味着它不是它实际的样子。\n\
