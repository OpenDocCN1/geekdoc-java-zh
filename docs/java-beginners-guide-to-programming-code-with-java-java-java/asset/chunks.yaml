    The first for loop is going to use the position of the amounts in rows while the\
    \ second loop uses the position based on columns. The first loop is going to be\
    \ the value of `I` which is zero. The code that is nested inside of the loop will\
    \ be used for a different loop. The next loop is going to be evaluated as long\
    \ as the variable of `I` is zero.\n\n## Lists for Arrays\n\nIt is hard to tell\
    \ the exact amount of items that are going to be inside of an array, so it is\
    \ going to be easier for you to use an `ArrayList`. The `ArrayList` is a data\
