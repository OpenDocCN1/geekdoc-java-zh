  trans: "\n\n当这段代码按字母顺序排序时，`a` 不会排在最前面，因为它是小写的。因此，`a` 的值将是 `\\u0061`。大写的 `T` 值将是\
    \ `\\u0054`。\n\n在处理不同文本的字符串时，你可以使用一些方法：\n\n- `toUpperCase`\n- `toLowerCase`\n\
    - `compareTo`\n- `indexOf`\n- `endsWith`, `startsWith`\n- `substring`\n- `equals`\n\
    - `charAt`\n- `trim`\n- `valueOf`\n\nJava 将以直观的方式将文本转换为小写或大写，并将使用内置的 `toUpperCase`\
    \ 和 `toLowerCase` 方法。\n\n```java\npackage prjstrings;\n\npublic class StringManipulation\
    \ {\n    public static void main (String[] args) {\n        String changeCase\
    \ = \"text to change\";\n        String result;\n        result = changeCase.toUpperCase();\n\
    \        System.out.println(result);\n    }\n}\n```\n\n开头的几行告诉了字符串变量在哪里设置的，同时保留了打印之前需要更改的文本。第三行调用了变量的结果。最后，在第四行中，进行了转换。\n\
    \n`result = changeCase.toUpperCase();`\n\n该字符串方法将适用于任何字符串。你只需要在变量后输入一个点，这样你就可以对你的\
    \ `changeCase` 字符串执行各种操作。如果你想让它变成大写，那么就选择它，但请记住大写方法后面应该有一组空括号。\n\n一旦结果完成转换，它将被存储为新的\
    \ `result`。如果你不想存储结果，可以使用此方法：\n\n`System.out.println(changeCase.toUpperCase())`\n\
    \n当你想要执行 `toLowerCase` 时，将使用相同的方法。\n\n### 字符串比较\n\n可以通过十六进制值对字符串进行相互比较。你只需要使用\
    \ `compareTo` 方法即可。\n\n```java\npackage prjstrings;\n\npublic class StringManipulation\
    \ {\n    public static void main (String[] args) {\n        int result;\n    \
    \    String Word1 = \"Ape\";\n        String Word2 = \"App\";\n        result\
    \ = Word1.compareTo(Word2);\n        if (result < 1) {\n            System.out.println(\"\
    Word1 is less than word2\");\n        } else if (result > 0) {\n            System.out.println(\"\
    Word 1 is more than word 2\");\n        } else if (result == 0) {\n          \
    \  System.out.println(\"the same word\");\n        }\n    }\n}\n```\n\n当这两个单词进行比较时，使用了如下语法的\
    \ `compareTo` 方法：\n\n`result = Word1.compareTo(Word2);`\n\n它将返回一个大于零、小于零或等于零的值。\n\
    \n确保分配了正确的值以便将 `compareTo` 的结果返回给变量将取决于你。代码中将包含 `if` 语句来测试并查看结果是什么。\n\n但是，当比较两个字符串时，Java\
    \ 将比较十六进制值而不是单词的字母。由于两者都包含大写字母，`App` 的 `A` 将排在 `ape` 之前。\n\n### indexOf\n\n`indexOf`\
    \ 将在当前字符串或任何其他字符串内部定位字符。\n\n```java\npackage prjstrings;\n\npublic class StringManipulation\
    \ {\n    public static void main (String[] args) {\n        char ampersand = '@';\n\
    \        String email_address = \"meme@me.com\";\n        int result;\n      \
    \  result = email_address.indexOf(ampersand);\n        System.out.println(result);\n\
    \    }\n}\n```\n\n这段代码正在检查提供的电子邮件地址中是否存在 `@` 符号。由于使用了单引号，它是一个 `char` 变量。一旦电子邮件设置好，你将得到\
    \ `result`，它是一个 `int` 变量。因此，得益于 `indexOf` 方法，你的 `result`是一个整数。\n\n由于这一行的存在，你的\
    \ `ampersand` 位置将是这段代码的结果：\n\n`result = email_address.indexOf(ampersand);`\n\n\
    当你指定要使用 `indexOf` 方法时，首先搜索的字符串将出现在点之后。括号之间是你提供多个选项的地方。首先，你可以输入单个字符。通过这种方式，Java\
    \ 在存储变量 `result` 的值之前会告诉你该字符在字符串中的位置。\n\n当代码运行时，输出将是四。由于 `indexOf`像其他所有内容一样从零开始，`ampersand`\
    \ 是电子邮件字符串中的第四个字符。\n\n如果你寻找的字符不存在，那么 `indexOf` 将给你一个负数一的的结果。\n\n```java\npackage\
    \ prjstrings;\n\npublic class StringManipulation {\n    public static void main(String[]\
    \ args) {\n        char ampersand = '@';\n        String email_address = \"mememe.com\"\
    ;\n        int result;\n        result = email_address.indexOf(ampersand);\n \
    \       if (result == -1) {\n            System.out.println(\"invalid email address\"\
    );\n        } else {\n            System.out.println(\"email address is okay\"\
    );\n        }\n    }\n}\n```\n\n你的负数一结果将允许客户端继续。`indexOf` 也可以用于测试多个字符。\n\n```java\n\
    public static void main (String[] args) {\n    String dotcom = \".com\";\n   \
    \ String email_address = \"meme@me.com\";\n    int result;\n    result = email_address.indexOf(dotcom);\n\
    \    if (result == -1) {\n        System.out.println(\"invalid email address\"\
    );\n    } else {\n        System.out.println(\"email address is okay\");\n   \
    \ }\n}\n```\n\n虽然这段代码看起来完全一样，但你现在将使用字符串中的变量来存储要检查的文本，而不是使用 `char` 变量。\n\n由于再次返回了负数一的结果，搜索的文本在\
    \ `indexOf` 方法点之前的字符串中未找到。如果找到了，那么 `indexOf` 将返回第一个匹配你搜索内容的字符。\n\n在上述列的代码中，如果你从零开始计数，点是电子邮件地址中的第七个字符。\n\
    \n## 结\n\n感谢你读完《Java: 初学者 Java 编程代码指南》的最后，希望它对你有帮助，并能够为你提供实现目标（无论目标是什么）所需的所有工具。\n\
    \n下一步是按照第一章所述的方法下载 Java 并开始编写你的代码。\n\n"
