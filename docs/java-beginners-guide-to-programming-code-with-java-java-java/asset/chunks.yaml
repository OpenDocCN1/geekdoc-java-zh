    \ `case` 的关键字，以便他们检查该分支的数值。\n\n`case` 值后面将跟一个冒号。你想要发生什么事情都将发生，但仅在值正确对应的情况下。你想要执行的代码将被执行。在每个\
    \ `switch` 语句的需要 `break` 的情况下，将使用 `break` 单词。\n\n`default` 值将被使用，但它是完全可选的。如果你没有在\
    \ `switch` 语句的其他地方检查你的变量，你可以在变量中包含其他值。\n\n#### 代码\n\n```java\npublic static void\
    \ main(String[] args) {\n    int client = 17;\n    switch ( client ) {\n     \
