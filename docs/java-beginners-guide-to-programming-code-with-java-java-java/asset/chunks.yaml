    \n当你告诉 Java 数组将有多少个位置时，你需要为数组创建一个新对象。\n\n```java\naryNums = new int[ 6 ];\n```\n\
    \n首先，你从数组名称开始，然后是一个等号。在到达数据类型之前，等号前面有一个 `new` 关键字。使用的数据类型后面紧跟着数组的大小。大小会让 Java\
    \ 知道数组需要多少个位置。\n\n如果你更喜欢代码那样显示，也可以将它们写在一行。\n\n```java\nint[ ] aryNums = new int[\
