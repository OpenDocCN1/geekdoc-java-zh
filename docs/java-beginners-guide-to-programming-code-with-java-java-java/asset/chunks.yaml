    Some code has to be run but only in the event that a condition has been met. For
    code, you may want your client to be of a certain age. This is going to be where
    you will control the flow of how the program operates through conditional logic.


    Conditional statements are going to use the word `if` mostly, but there are other
    words that can be used to create conditional statements.


    ### If statement


    The code is going to be executed whenever something happens instead of waiting
    for something else, which is going to be most common when it comes to programming,
    therefore the `if` statement was created.


    An `if` statement is going to look like this:


    ```java

    if ( statement ) {


    }

    ```


    The word `if` is going to be lowercased before your condition is paced in a set
    of brackets. The curly brackets are going to be used to divide the chunks of code.
    This code is going to be executed only in the case that the condition has been
    met.


    ### Code


    ```java

    if( client < 18) {


    }

    ```


    This condition states that if the client is less than 18. Instead of typing it
    all out, a shorthand method is going to be used so that the chunk of code is shorter
    and easier to read.


    ### Code


    ```java

    if( client < 18) {


    // display message


    }

    ```


    Therefore, should the client be over 18, the code set in the two sets of curly
    brackets is going to be jumped over while Java proceeds how it is supposed to.
    Anything that is in the middle of the curly brackets will be carried out only
    if the condition has been met.


    Another shorthand notion is going to be to point the triangle to the right which
    means greater than.


    ### Code


    ```java

    if( client > 18) {


    //display message


    }

    ```


    The code is the exact same except that the condition is going to apply to those
    who are over 18.


    ### If ... else


    Instead of an `if` statement being used, an `if else` statement can be used.


    ```java

    if( condition_to_test) {


    }


    else {


    }

    ```


