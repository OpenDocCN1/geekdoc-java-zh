    \   System.out.println ( aryString[ I ] );\n        }\n    }\n}\n```\n\n## 多维数组\n\
    \n在本章之前讨论过的数组只有单列数据，但你能够设置具有多个列的数组。这些数组被称为多维数组。\n\n```\n0 – 10 – 12 -43 – 11 -\
