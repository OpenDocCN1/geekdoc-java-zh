    # Positioning


    Debt: The First 5,000 Years builds heavily on David Graeber’s previous scholarship
    and the development of his political ideas throughout his scholarly career. It
    also represents a change in Graeber’s scholarly direction, in which he turns away
    from the pure anthropology and ethnography*(field study of a people’s culture
    or society) that characterized his work in most of the 2000s to revisit the economic
    anthropology of his first book, Toward an Anthropological Theory of Value (2001).


    In many ways Debt is a logical extension of Toward an Anthropological Theory of
    Value. Debt uses one of Toward’s core arguments—the inability of the capitalist
    market* to accurately value human actions—as an intellectual backdrop. To underpin
    his analysis of debt, Graeber musters a great deal of evidence from his previous
    works in anthropology and his own research.'
