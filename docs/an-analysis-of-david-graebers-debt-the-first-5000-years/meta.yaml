    大卫·格雷伯，《债务：人类五千年的货币债史》


    ## 领域概述


    经济史是一门年轻的学科，直到20世纪才被公认为是一门学科.^3 但对货币的研究可以追溯到古希腊；哲学家亚里士多德*在公元前350年左右得出结论，货币的出现是为了改进以物易物制度：4
    它是为了让没有相互所需商品的双方进行交易时更便利的“占位符”。18世纪的苏格兰思想家亚当·斯密*在他现代经济学的第一部著作《国富论》（1776年）中支持了这一观点.^5
    20世纪初，这一理论被奥地利学派（一种关注个人理性和行为作为经济主要驱动力的经济学派）的经济学家所采用，特别是奥地利经济学家卡尔·孟格尔。^6 这种货币理论至今仍占据主地位，并支持了这样观点：货币仅仅是人类自然倾向的延伸，正如亚当·斯密所说的，“货易易物交换”。


    另一种货币史理论在20世纪初由德国经济学家乔尔格·弗里德里希·克纳普*提出，并被称为“货币主义”.^7 克纳普提出货币是“法律的产物，8 是一种源于国家试图引导市场活动的信用*形式”。货币符号主义与货币信用理论*密切相关，后者由英国经济学家阿尔弗雷德·米切尔-因内斯*开创，^9，该理论认为货币是信用和债务的形式。货币符号主义和货币信用理论在发展当今主导的经济体系理解（即凯恩斯主义*）方面具有巨大影响^10，这种理解基于总支出是经济中最强大力量的观点。关于货币起源的普遍理解仍然是它是作为以物易物制度的改进而出现的。


    无论货币的起源如何，大多数经济学家认为货币反映了人类相互贸易的自然倾向。


