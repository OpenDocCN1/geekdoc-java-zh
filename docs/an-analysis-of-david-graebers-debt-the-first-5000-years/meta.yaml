  md: '# ABOUT THE AUTHOR OF THE ORIGINAL WORK


    Born in 1961, US anthropologist and activist David Graeber was weaned on leftist
    politics, and declared himself an anarchist at age 16. He became an anthropology
    professor, and his early cultural research in Madagascar exposed him to poverty
    that he saw as caused by pressures to repay excessive government debt. Through
    a combination of activism and scholarship he has devoted much of his career to
    developing an intellectual basis for undermining capitalism. In his 2011 book
    Debt: The First 5,000 Years, Graeber uses the insights of an anthropologist to
    argue that debt plays a toxic role in human relations.


    # ABOUT THE AUTHORS OF THE ANALYSIS


    Sulaiman Hakemy holds an MSc in economic history and development from the London
    School of Economics. A writer and journalist, he has reported on industry, politics,
    and culture for various publications. His background is in the development aid
    and urban planning sectors, specialising in conflict and fragile states. He is
    based in Istanbul and Toronto, and speaks English, French, Spanish, Arabic, Persian,
    and some Urdu.


    # ABOUT MACAT


    # GREAT WORKS FOR CRITICAL THINKING


    Macat is focused on making the ideas of the world’s great thinkers accessible
    and comprehensible to everybody, everywhere, in ways that promote the development
    of enhanced critical thinking skills.


    It works with leading academics from the world''s top universities to produce
    new analyses that focus on the ideas and the impact of the most influential works
    ever written across a wide variety of academic disciplines. Each of the works
    that sit at the heart of its growing library is an enduring example of great thinking.
    But by setting them in context – and looking at the influences that shaped their
    authors, as well as the responses they provoked – Macat encourages readers to
    look at these classics and game-changers with fresh eyes. Readers learn to think,
    engage and challenge their ideas, rather than simply accepting them.'
