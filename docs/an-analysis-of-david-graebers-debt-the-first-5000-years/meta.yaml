    # PEOPLE MENTIONED IN THE TEXT


    **Aristotle (384–322 B.C.E.)** was a Greek philosopher and scientist. He was the
    first person known to theorize on the origins of money, claiming that it arose
    spontaneously as a solution to the inconveniences of barter.


    **Mike Beggs** is a lecturer in political economy at the University of Sydney.


    **Maurice Bloch (b. 1939)** is a British anthropologist and professor at the London
    School of Economics.


    **Jared Diamond (b. 1937)** is an American scientist and geographer. His ideas
    on the path dependency of nations brought influence from the fields of anthropology
    and geography to economic history.


    **Francisco Franco (1892–1975)** was a Spanish general; following the removal
    of the Spanish monarchy in 1931, and the election of a socialist government in
    1936, he participated in a coup that started the Spanish Civil War. He subsequently
    became head of state and ruled as a right-wing dictator.


    **Michael Hardt (b. 1960)** is an American political philosopher. His writings
    on class oppression and globalization have drawn on Graeber’s work regarding debt.


    **Keith Hart (b. 1943)** is a British economic anthropologist. He was a pioneer
    in the development of the idea of the “human economy” and argued that money is
    simultaneously both a form of credit and a commodity.


    **Caroline Humphrey (b. 1943)** is a British anthropologist. She investigated
    the role of barter in human society extensively and found that there is no evidence
    to support the theory that barter preceded the creation of money.'
  - '[PAGE 68]


    Georg Friedrich Knapp (1842–1926) was a German economist. He was the founder of
    the Chartalist school of monetary theory.


    Paul Krugman (b. 1953) was a Nobel Prize-winning American economist. He is a prominent
    supporter of Keynesian economics and an opponent of austerity.


    Karl Marx (1818–1883) was a Prussian political philosopher and economist. He was
    the founder of Marxism and argued that human societies progress through class
    struggle, especially in Capital.


    J. W. Mason is an assistant professor of economics at John Jay College, City University
    of New York.


    Marcel Mauss (1872–1950) was a French sociologist. He is considered a pioneer
    in the discipline of anthropology and is particularly known for his theories on
    gift exchange.


    Carl Menger (1840–1921) was an Austrian economist. He was the founder of the Austrian
    School of economic thought.


    Alfred Mitchell-Innes (1864–1950) was a British economist. He was a proponent
    of the credit theory of money.


    Antonio Negri (b. 1933) is an Italian Marxist political philosopher. He is a prominent
    figure in anti-capitalist activist movements.


    Thomas Piketty (b. 1971) is a French economist. He is best known for his work
    highlighting the propensity of unrestricted capitalism to result in economic and
    social inequality.


    Karl Polanyi (1886–1964) was a Hungarian American economic historian. He was a
    prominent opponent of traditional economic history narratives and argued that
    markets were created and engineered by the state.


    Carmen Reinhart (b. 1955) is a Cuban American economist. She argued in favor of
    austerity measures in response to the 2008 global financial crisis together with
    Kenneth Rogoff.'
  - '[PAGE 69]


    Dani Rodrik (b. 1957) is a Turkish economist and professor at Harvard University.
    He is known for his work in development economics.


    Kenneth Rogoff (b. 1953) is an American economist. He argued in favor of austerity
    measures in response to the 2008 global financial crisis together with Carmen
    Reinh.


    Amartya Sen (b. 1933) is a Bangladeshi economist. He is best known for his work
    on poverty relief and development economics, and has strongly opposed austerity
    measures in response to debt crises.


    Adam Smith (1723–90) was a Scottish philosopher and political economist. He is
    considered the father of the discipline of economics, having written his first
    major work, *The Wealth of Nations.*


    Noah Smith is an assistant professor of finance at Stony Brook University.


    Socrates (469 B.C.E.–399 B.C.E.) was a philosopher in ancient Greece, and considered
    one of the founders of Western philosophy. He is most known for his development
    of the Socratic method, which involves learning through critical discussion.


    Joseph Stieglitz (b. 1943) is an American economist and professor at Columbia
    University. He was chief economist of the World Bank from 1997 to 2000.'
