    1. David Graeber, Debt: The First 5,000 Years (Brooklyn, NY: Melville House, 2001),
    130.

    2. Graeber, Debt, 158.

    3. Graeber, Debt, 130.

    4. Graeber, Debt, 208.

    5. Graeber, Debt, 208.

    6. Graeber, Debt, 391.

    7. Bill Maurer, “David Graeber’s Wunderkammer, Debt: The First 5,000 Years,” Anthropological
    Forum 23, no. 1 (2013): 79.

    8. Graeber, Debt, 57.

    9. Graeber, Debt, 57.

