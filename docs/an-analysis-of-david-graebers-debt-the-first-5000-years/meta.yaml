    \n**托马斯·皮凯蒂（Thomas Piketty，1971年出生）**是一位法国经济学家。他最广为人知的成就是强调了无限制资本主义导致经济和社会不平等的倾向性。\n\
    \n**卡尔·波兰尼（Karl Polanyi，1886–1964年）**是一位匈牙利裔美国经济史学家。他是传统经济史叙述的著名反对者，认为市场是由国家创造和工程设计的。\n\
