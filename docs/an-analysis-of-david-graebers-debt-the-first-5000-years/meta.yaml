    # MODULE 10

    ## THE EVOLVING DEBATE


    # KEY POINTS


    - As a book written for a popular audience, Debt is positioned as a key influence
    in shaping the layman''s views on economics* and the current difficulties of the
    global economic system.

    - Although unique in its approach, Debt is one of a number of books in an emerging
    literature and school of thought highlighting the tendency of capitalism toward
    inequality.

    - Debt presents a historical, moral, and philosophical basis for the idea of debt
    relief, heavily discussed today as a means of alleviating the difficulties of
    global financial crises.


    ### Uses and Problems


    While David Graeber''s Debt: The First 5,000 Years has been hailed its publication
    as an influential work in anthropology* and academia at large, it has found the
    most use in the public sphere.¹¹ This is in line with Graeber''s intentions, as
    he wrote Debt thinking “it would be interesting to write for a broader audience
    and see what kind of impact you can have on the arguments going on.”²


    Owing to the timing of its publication in the wake of the global financial crisis,*
    Debt joins a great deal of literature written with the aim of inspiring debate
    on capitalism. But while other economists and political philosophers are heavily
    critical of the mechanisms of the capitalist system, Debt launches an open attack
    on the the ideologies driving capitalism and on the system itself. Debt’s radicalism
    is currently, perhaps, what prevents the conversion of its popularity into popular
    action.


    > “If we want an alternative to stagnation, impoverishment, and ecological devastation,
    we’re just going to have to figure out a way to unplug the machine and start again.”

    > David Graeber, *Guardian*


    ### Schools of Thought


    Scholars who have played an important role in popularizing the debate on global
    inequality and capitalism include the economists Thomas Piketty* of France, Joseph
    Stiglitz* of the United States, and Dani Rodrik* of Turkey.


    By far the most successful recent book in bridging the divide between academia
    and the public over inequality is Thomas Piketty’s *Capital in the Twenty-First
    Century*. This book does not call for dismantling the capitalist system, but rather,
    for a serious reform of its mechanics so that global systems might redistribute
    enough wealth to undo inequality produced by capitalism.³ Nonetheless, *Capital*
    shares some of Debt’s core features, arguing against the idea that capitalism
    operates on principles of equity. As Knox Peden has written in the *Sydney Review
    of Books*: “Though Piketty and Graeber are temperamentally antipodal [opposites],
    the thematic resonance connecting their works is clear enough.”⁴


    In 2015, Piketty allowed to acknowledge Graeber’s analysis when he called for
    an international conference on debt and the implementation of a new strategy for
    dealing with the European debt crisis:* “Essentially, it consists of three components:
    inflation,* a special tax on private wealth, and debt relief.”⁵


    ### In Current Scholarship


    Brought together by a mutual frustration with inequality, Graeber and Piketty
    have engaged with each other directly on how to move forward the current scholarship
    criticizing capitalism and inequality. The two scholars approach the debate from
    completely different practical viewpoints.


    In Capital, Piketty supports Graeber’s idea that capitalism is a system that,
    in its purest form, cannot help but create injustice: “Capitalism does not contain
    an inherent tendency to civilize itself. If left to its own devices, it can be
    expected to create rates of return on investment so much higher than overall rates
    of economic growth that the only possible result will be transfer more and more
    wealth into the hands of a hereditary elite of investors, to the comparative impover
    of everybody else.”⁶


    In line with his own intellectual background and previous work, Graeber favors
    a revolutionary response to this problem. “Since the 1970s,” he writes, “as any
    significant political threat has receded, things have gone back to their normal
    state: that is, to savage inequalities.” Graeber’s criticism of Pikety is that
    he has nothing against capitalism itself – He just wishes to provide a check on
    capitalism’s tendency to create a useless class of parasitical rentiers* [people
    who live off the profits from investments].” Graeber concludes that total debt
    relief and an “unplugging” of the capitalist system is in order.^⁷


    Pikety’s response has been that Graeber’s solution—to put the burden on creditors—is
    unjust. “The fact is, as I say, that the last creditors are not necessarily the
    ones who should be made to pay.” Pikety has argued. Rather, a progressive tax*
    should be imposed on wealth, according to Pikety, “seems… a more civilized to
    arrive at the same result.^⁸


    # NOTES


    - 1. Hannah Chadeaney Appel, “Finance Is Just Another Word for Other People’s
    Debts: An Interview with David Graeber,” Radical History Review no. 118 (2014):
    168.

    - 2. Appel, “Other People’s Debts,” 168.

    - 3. Thomas Pikety and Arthur Goldhammer, Capital in the Twenty-First Century
    (Cambridge, MA: The Belknap Press of Harvard University Press, 2014).

    - 4. Knoxeden, “The Abstractions of History,” The Sydney Review of Books, July
    22, 2014, http://www.sydneyreviewbooks.com/capital-twenty-first-thomas-pikety/.

    - 5. Gavin Schalliol, “Thomas Pikety: Germany Has Never Repaid Its Debts. It Has
