    ## 模块 7

    成就


    ## 核心要点


    - 大卫·格雷伯对经济学*和资本主义*系统进行了批判性分析，这受到了公众的赞誉，并将经济人类类学*理论引入了公众视野。

    - 格雷伯将这本书定性为一本“思想大书”，而非教科书，并利用世界各地的人类学证据使《债务》一书具有广泛意义。

    - 本书散乱的结构限制了读者跟随格雷伯论点的能力，而且格雷伯没有经济学背景也限制了经济学家认真对待这本书的意愿。


    ## 评估论点


    大卫·格雷伯的《债务：前5000年》试图结合广泛学术学科的资源来改变人们思考经济学的方式。但可以认为，这项任务所需的组织能力在该书中并未完美实现。格雷伯通过两种类型的讨论进行推理：


    - 使用人类历史的直接证据来挑战对经济学的普遍理解

    - 以苏格拉底*式讨论道德问题（即通过与古希腊哲学家苏格拉底相关的提问和回答的方式）。


    他在这些模式之间有些漫无目的地地穿梭，经常将与一个主题相关的道德讨论带入与另一个主题相关的历史描述中。格雷伯大多数章节的开头都是先陈述主题，然后就放弃它。例如，他在第八章的开头说，在整个欧亚*历史中，货币在被视为信贷符号的时期与作为商品（例如黄金）的时期之间来回切换。1
    但很难在随随后的宏大历史讨论中跟上思路；同时，他通过关于暴力和压迫的道德观点混淆了事态。


    > “大卫现在在人类学界已经成了某种崇拜的人物。”

    > 詹姆斯·斯科特（James Scott），耶尔大学政治学与人类学教授


    这本书的无组织性使得人们难以掌握格雷伯的核心观点——即在资本主义下，债务是社会义务的歪曲，被用来证明暴力的合理。必要的论点和信息在这里，但读者需要自己将它们整合在一起。


    ## 背景下的成就


    《债务》在结构上的弱点并未阻止它成为一部著名的非虚构作品。由学者创作的这类“思想大书”曾经（现在仍然）很受欢迎。作为一种体裁，《债务》追随了科学家贾雷德·戴蒙德（Jared
    Diamond*）同样宏大的著作《枪、菌与钢》的足迹。《枪、菌与钢》将地理学*作为一门学科推入了经济历史学者的辩论中，正如格雷伯意图的那样。在1997年出版近20年后，戴蒙德的书对“路径依赖”理论产生了巨大影响——即国家因为地理等预定因素沿着特定路径发展。


    《债务》在出版后的第一年（2011年）是国际畅销书。到为止，尽管人们争议他从证据中得出的结论，没有人挑战书中呈现的历史和人类学证据的真实性。这表明，《债务》在捕捉公众想象力的同时，可能会成为受尊敬的学术著作。


    ## 局限性


    格雷伯打算将全球历史和人类学融入《债务》，并将其应用于人类的普遍经验。在他成功的范围内，他对经济生活的思考不受地理或当前历史时期的限制。格雷伯的人类学背景有助于他接触广泛的读者，因为他的工作本质是理解不同背景人们之间的相似之处和差异。《债务》中的个人主张在穿梭于不同文化时仍保持合理且合逻辑。


    同时，这部作品最大的局限性在于它的标题——一个声称只回顾过去的宣言。这本书将各种见解结合了对资本主义整体的价值判断，这不足以引导任何政策建议，除了提供更多债务减免这一单一建议外。可以认为，这阻碍了《债务》为辩论做出完全具有建设性的贡献。


