    # 术语表


    **无政府主义**（Anarchism）一种主张摧毁政府以建立无国家社会的政治哲学。


    **人类学**（Anthropology）对人类和人类社会的学术研究。


    **紧缩紧政**（Austerity）一组通过削减政府支出和偿还贷款来减少政府预算赤字的经济政策。


    **奥地利学派**（Austrian School）一种经济思想学派，关注个人的理性和行动作为经济活动的主要驱动力。


    **轴心时代**（Axial Age）古代历史上的时期，其特点是人类哲学思想的巨大进步，通常被认为是公元前800年至公元前200年（尽管大卫·格拉伯将其定义为公元前800年至公元前600年）。


    **物物交换**（Barter）直接用商品或服务交换其他商品或服务的做法，而不使用货币。只有当双方都有对方想要的东西时，物物交换才可行。


    **婆罗门经**（Brahmanas）古代印度宗教文献汇集，包含了神话、传说、对仪式的解释以及伴随较老的《吠陀经》的哲学内容。


    **资本主义**（Capitalism）一种贸易、生产和财产在很大程度上完全掌握在私人个人或公司手中的经济系统。


    **货币主义**（Chartalism）一种经济思想学派，认为货币的产生是国家引导市场活动的努力，而非为了实现物物交换而自发产生的。


    **殖民主义**（Colonialism）一个政治实体对另一个领土的强制性获取、定居以及政治或经济控制。


    **商品**（Commodity）可以进行交易、购买或出售的物品。


    **共产主义**（Communism）一种主张生产资料公有和摧毁社会关系结构的政治形态。


    **信用**（Credit）在不立即付款的情况下购买商品或服务的能力，基于卖方对未来会收到付款的信任。


    **货币信用理论**（Credit theory of money）一系列经济思想的汇集，认为货币本质上是信用和债务的形式。


    **20世纪80年代债务危机**（Debt crisis of the 1980s）一场由全球银行向发展中国家政府提供无监管贷款而引发的债务危机，这些国家借入（有时挥霍）了超过其偿还能力的资金。作为回应，全球贸易和发展组织（国际货币基金组织和世界银行）强制了变革，给那些受益于公共福利计划和当地工作的发展中国家的人造成了困难。


    **债务重组**（Debt restructuring）允许债务人重新谈判条款或减少未偿还债务价值的过程。


    **发展中国家**（Developing country）一个工业基础不发达、生活质量相对于其他国家较低的主权国家。


    **经济史**（Economic history）一门研究经济历史和发展的社会科学。


    **经济学**（Economics）一门研究资源稀缺而欲望无限条件下的人类行为和社会系统的社会科学学科。


    **《经济学人》**（The Economist）一份英语周刊杂志，内容涵盖政治和经济事务，于1843年创立于伦敦。


    **民族志**（Ethnography）人类学中的一个子学科，关注人类文化的系统性研究和图表化表示。


    **欧亚大陆**（Eurasia）涵盖欧洲和亚洲大陆的合并陆地。


    **欧洲债务危机**（European debt crisis）欧盟内部的一场持续性债务危机，其中多个成员国无法向私人和公共债权人偿还贷款。


    **欧盟**（European Union）由28个欧洲国家组成的政治和经济联盟。


    **联邦储备委员会**（Federal Reserve）美国中央银行。


    **富布莱学者计划**（Fulbright Fellowship）一种极具竞争力的学金，为美国学生和学者提供在海外进行研究或学习资金。


    **地理学**（Geography）一门关注地球物理特征及其与人类活动关系的学术学科。


    **2008年全球金融危机**（Global financial crisis of 2008）自20世纪30年代大萧条以来最严重的金融危机。该危机由美国住房泡沫破裂引起，导致大规模债务违约，影响了全球的金融机构和市场。


    **全球正义运动**（Global justice movement）一个反对企业全球化的国际社会活动家运动网络。


    **全球化**（Globalization）全球市场、政治和文化之间互联性日益增强的过程。


    **金本位**（Gold standard）一种标准货币的价值基于固定数量黄金的货币体系。


    **非正统经济学**（Heterodox economics）经济学中存在于主流教学之外的理论、实践和思想学派。


    **通货膨胀**（Inflation）经济体内价格上涨和货币购买力下降的现象。


    **跨学科**（Interdisciplinary）借鉴不同学术学科的目标和方法。


    **国际货币基金组织（IMF）**（International Monetary Fund）一个成立于1944 年的国际组织，旨在通过援助国际贸易和在金融或货币危机中提供帮助来促进全球货币合作。


    **凯恩斯经济学**（Keynesian economics）一种经济思想学派，认为短期内一个国家的经济产出受总需求水平的影响。


    **伦敦政治经济学院**（London School of Economics）一英国公立研究大学，专注于社会科学研究，于1895年创立于伦敦。


    **市场**（Market）一种双方买卖商品和服务的经济系统。


    **美索不达米亚**（Mesopotamia）中东一个地区的称呼，大部分位于伊拉克，位于底格里斯河和幼发底河之间。该地区通常被认为是人类文明的发源地。


    **物物交换神话**（Myth of Barter）认为货币是作为解决物物交换不便的方案而自发产生的观点。经济学家们对此深信数世纪，但许多人类学家认为这是不正确的。


    **1979年能源危机**（1979 energy crisis）发生在美国的一场经济事件，由于伊朗政局动荡导致石油供应恐慌，引发价格飙升。


    **占领华尔街**（Occupy Wall Street (OWS)）2011年针对2008年全球金融危机发起的反对经济和社会不平等的全球抗议运动。


    **路径依赖**（Path dependency）发展研究和经济史学科中的一种理论，认为国家的发展基于预设因素，如地理位置或先前的历史。


    **政治经济学**（Political economy）与政治相关的经济学研究。


    **政治学**（Politics）一门关注治理、权力关系和国家的学术学科。


    **原始债务**（Primordial debt）一些社会学家、历史学家和经济学者的理论，认为政府税收是对古代社会、神灵或宇宙债务观念的延伸。


    **累进税**（Progressive tax）税率随收入增加而增加的税收方式。


    **食利者**（Rentier）依靠资本利润（如财产或投资）生活的人或机构。


    **革命**（Revolution）通过（通常是武力手段）推翻现有的治理体系或权威。


    **罗杰瓦**（Rojava）叙利亚北部一个分裂的库尔德准国家。


    **苏格拉底式的**（Socratic）通过问答练习在论证中引导真理。


    **西班牙内战**（Spanish Civil War）1936年至1939年间在西班牙爆发的第二西班牙共和国忠实者与弗朗西斯科·弗朗哥将军的支持者之间的内战。


    **西班牙革命**（Spanish Revolution）1936年西班牙发生的一场社会革命，导致无政府主义原则在西班牙内战期间在该国多个地区得到广泛实施。


    **叙利亚内战**（Syrian Civil War）叙利亚国家政府与各种反叛运动组织之间持续持续的内战。


    **工会**（Union）商人、工人或劳动者的组织，他们聚集在一起为更好的工资或工作条件进行谈判。


    **世界银行**（World Bank）总部位于日内瓦的国际组织，为发展中国家的资本项目提供贷款。


    **世界贸易组织（WTO）**（World Trade Organization）总部位于华盛顿特区的政府间组织，通过……调节全球贸易


