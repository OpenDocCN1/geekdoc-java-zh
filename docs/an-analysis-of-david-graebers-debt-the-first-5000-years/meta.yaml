    # Language and Expression


    Graeber has described Debt: The First 5,000 Years as “the sort of book people-don’t
    write any more: a big book, asking big questions, meant to be read widely and
    spark public debate, but at the same time, without sacrifice of scholarly rigor.8
    This is reflected in the fact that 149 of the book’s 542 pages consist of endnotes
