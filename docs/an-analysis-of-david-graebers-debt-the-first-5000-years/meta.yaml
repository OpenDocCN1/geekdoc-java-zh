    9. Graeber, “Big Question Sorts of Books.”


    ## 模块6

    次要思想


    ## 核心要点


    - 格雷伯认为货币一直是一个流动的概念，既作为信用（credit*）符号或代表，也作为可交易的商品（commodity*，实物，如黄金）。

    - 他通过指出债务与暴力模式相关，为他的论证增加了道德维度，并资本主义（capitalist*）制度的设计是为了帮助富人和权势者利用他人。

    - 格雷伯将人类历史上货币的兴衰与奴隶制的兴衰联系起来，作为货币和债务危险性的极端例子。


    ## 其他思想


    大卫·格雷伯《债务：人类社会的五千年史》中一个重要的次要思想是债务、市场（markets*）与暴力之间的关系。格雷伯通过他的“人类经济”概念探讨了这一点。


    《债务》的主要观点之一是，我们目前的经济系统是不合法的，因为它建立在债务仅仅是一种未完成的非人格交换的观点之上。格雷伯认为，与交换相关的债务是更广泛的个人义务体系的一部分。通过将债务简化为金额并坚持偿还，经济系统使人与人相互异化。


    在《债务》中，格雷伯还认为以债务为中心的现代经济系统实际上是有害的。这意味着这本书不仅是主流经济史（history*）的替代方案，而且彻底的反资本主义。这与格雷伯自身的政治观点（politics*）一致，并为他参与活动运动提供了学术辩护。


    > “关键因素……是货币将道德转化为一种无个人的算术问题——并借此证明在其他时候看起来荒唐的事情合理。”

    David Graeber, *Debt: The First 5,000 Years*


    ## 探索思想


    在《债务》的第六章中，格雷伯引入了“人类经济”的概念，这与熟悉的商业或市场经济不同。根据格雷伯的观点，人类经济主要存在于市场系统之前或之外，并且“主要关注财富的积累，而是关注人类的创造、破坏和重组”。¹
    在这些经济中，“每个人都是独特的，且价值不可估量，因为每个人都是他人关系的独特纽带。”² 人类学证据表明，在人类经济中存在货币，但它并非用于商品和服务的仪式交易。相反，它以仪式化的方式处理无法计算的重大事务。在这些前市场经济中，货币是用来“安排婚姻、确定子女身世、抚慰丧亲者、在案件中寻求原谅、谈判条约——几乎除了贸易的任何事情……”³


    然而，当人们通过暴力脱离他们熟悉的现实时，这一切都发生了变化。正如格雷伯写道，即使在人类经济中，“人类也可以变成交换的对象：最初可能是婚姻中的女性；最终是战争中俘获的奴隶。所有这些关系的共同点是[……⁴
