    # 第10单元

    ## 演变的辩论


    # 核心点


    - 作为一本为大众读者编写的书，《债务》被定位为塑造外行对经济学*观点以及全球经济体系当前困境的关键影响。

    - 尽管方法独特，但《债务》是新兴文献和学派中的众多著作之一，这些著作凸显了资本主义走向不平等的趋势。

    - 《债务》为减债思想提供了历史、道德和哲学基础，该思想在今天被作为缓解全球金融危机困境的手段而受到广泛讨论。


    ### 用途与问题


    虽然大卫·格雷伯的《债务：前五千年》在出版时就被誉为人类学*及整个学术界极有影响力的著作，但它在公共领域发挥了最大的作用.¹¹ 这符合格雷伯的意图，因为他在写《债务》时想，“为更广泛的读者写作将是有趣的，并看看你能对正在进行的争论产生什么样的影响。”²


    由于其出版时机恰逢全球金融危机*之交*，《债务》加入了大量旨在激发对资本主义辩论的文献。但虽然其他经济学家和政治哲学家对资本主义体系的机制持严厉批评态度，《债务》却对驱动资本主义的意识形态以及体系本身发起了公开攻击。《债务》的激进性目前或许是阻止其流行度转化为大众行动的原因。


    > “如果我们想为停滞、贫困和生态破坏寻找替代方案，我们只能找到一种拔掉机器并重新开始的方法。”

    > 大卫·格雷伯，《卫报》


    ### 学派


    在普及全球不不平等和资本主义辩论方面发挥过重要作用的学者包括法国的经济学家托马斯·皮凯（Thomas Piketty*）、美国的约瑟夫·斯蒂利茨（Joseph
    Stiglitz*）和土耳其的丹尼·罗德里克（Dani Rodrik*）。


    到目前为止，在桥接学术界与公众之间不平等差距方面最成功的近期著作是托马斯·皮凯的《二十世纪的资本》。这本书并没有要求拆解资本主义体系，而是要求对其机制进行严肃改革，以便全球系统能够重新分配足够的财富，以消除资本主义产生的不平等³
    尽管如此，《资本》与《债务》共享一些核心特征，都反对资本主义基于公平原则运行的观点。正如诺克斯·佩登（Knox Peden）在《悉尼书评评论》中所写道：“尽管皮凯和格雷伯在性格上是极对立的，但连接他们作品的主题共鸣是清晰的。”⁴


    2015年，皮凯承认了格雷伯的分析，他呼吁召开关于债务的国际会议并实施应对欧洲债务危机的新策略*：“本质上，它由三个部分组成：通胀*、对私人财富的特别税以及减债。”⁵


    ### 在当前学术研究中


    格雷伯和皮凯因对不平等的共同沮丧而聚集，就如何推进批评资本主义和不平等的当前研究进行了直接交流。这两个学者从完全不同的实务观点看待辩论。


    在《资本》中，皮凯支持格雷伯的观点，即资本主义是一个在最纯形式下无法不创造不公的体系：“资本主义并不包含内在的自我文明倾向。如果任其发展，可以预见它产生的投资回报率将远高于整体经济增长率，唯一可能的结果是将越来越多的财富转移到世袭投资者精英手中，使其他所有人都陷入相对贫困之中。”⁶


    根据其自己的知识背景和之前的工作，格雷伯倾向于对这一问题采取革命性的回应。“自20世纪70年代以来，”他写道，“随着任何重大政治威胁的消退，事情已经回到了正常状态：即野蛮的不平等。”格雷伯对皮凯的批评在于，他本身并不反对资本主义——他只是希望抑制资本主义创造一个无用的寄生租阶层*[依靠投资利润生活的人]的倾向。格雷伯得出结论，彻底减债和资本主义体系的“拔插”是在必行的。”⁷


    皮凯的回应是格雷伯的解决方案——将负担放在债权人身上是不公正的。“事实是，正如我所说的，最后的债权人并不一定是应该付钱的人。”皮凯认为道。相反，根据皮凯的观点，对财富征收累进税*，“似乎……是一种文明的方法来获得相同的结果。”⁸


