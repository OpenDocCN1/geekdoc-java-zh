    # "Not only is it money that makes debt possible: money and debt appear on the
    scene at exactly the same time."


    David Graeber, Debt: The First 5,000 Years


    # Exploring the Ideas


    One of the core principles of economics* is that human beings relate to one another
    on the basis of exchange. In Debt, Graeber seeks to disprove this by discrediting
    three supporting “myths.”


    The first, referred to as “the Myth of Barter,”* is the eighteenth-century economist
    Adam Smith’s* notion that money arose to facilitate barter.*“The Myth of Barter
    cannot go away because it is central to the discourse of economics,” Graeber writes.¹1
    But there is, however, no evidence in the historical record nor in anthropological*
    fieldwork to suggest that barter preceded the creation of money, or that it played
    an important role in creating money.^2


    The second myth is that of “primordial debts,”* meaning debts that have always
    existed. According to primordial debt theory:“Governments use taxes to create
    money, and they are able to do so because they become the guardians of the debt
    that all citizens have to one another. This debt is the essence of society itself”^3
    Like barter, primordial debt suggests that simple ways of people interpret their
    relationships as transactions. Graeber rejects primordial debt as a myth that
    claims money itself is a tribute to state power. He cites anthropological evidence
    showing that money not only existed in non-market societies for ritualistic purposes,
    but that even in market societies the function of money was dictated by both the
    state and the market.'
