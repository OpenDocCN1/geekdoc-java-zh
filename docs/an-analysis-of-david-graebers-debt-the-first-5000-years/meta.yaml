    ## SECTION 1 INFLENCES


    ## MODULE 1

    ### THE AUTHOR AND THE HISTORICAL CONTEXT


    ### KEY POINTS


    - David Graeber’s *Debt: The First 5,000 Years* challenges our assumptions about
    modern economic life at a time when the world is rocked with economic crises.

    - Graeber was born in New York 1961 to a family of working-class intellectuals
    who participated in revolutionary and anarchist movements: a revolutionary movement
    is dedicated to the overthrow of an existing political system of governance or
    the authority; anarchism is the political philosophy of government that should
    be abolished altogether.

    - Graeber’s education in anthropology—the systematic study of humanity, especially
    culture and society—was heavily influenced by his conviction, inspired by the
    global debt and energy crises in the 1970s and 1980s, the world is characterized
    by harsh and unequal power dynamics.


    ### Why Read This Text?


    David Graeber’s *Debt: The First 5,000 Years* investigates the history and morality
    of debt with enormous breadth and detail. Published in 2011, the book was written
    in the immediate aftermath of the 2008 global financial crisis, an event caused
    by the collapse of the American housing bubble which resulted in mass defaults
    on debts, affecting financial institutions and markets worldwide, and in the midst
    of the European debt crisis (in which several member states have been unable to
    repay loans to private and public creditors).


    ### “My childhood was full of radical politics”.

    David Graeber, Interview in Radical History Review


    These two crises together have exposed the weakest points of a consumer economy
    based on credit (borrowing) and debt, national economies built on financing debt
    of other nations, and a global economy based on balancing the effects of imports
    and exports between countries. The common thread through all of these layers of
    economic woe makes Graeber’s work extremely relevant for students of the social
    sciences and members of the public alike.


    The author is the first to write a popular book that considers economic questions
    from an anthropological perspective. By introducing this approach in a book written
    for a non-academic audience, Graeber has popularized the idea of taking interdisciplinary
    approaches (approaches that draw on the aims and methods of different academic
    fields) to economic issues. On a more fundamental level, however, Graeber’s book
    seeks to challenge the popular understanding of economics, and to undermine the
    central principles of the social and economic system of capitalism itself (a system
    in which trade and production are held in private hands and exercised for private
    profit). Graeber’s views have been taken up by anti-capitalist intellectuals and
    activists alike, and provide sophisticated and understandable arguments for rethinking
    the capitalist system.


    ### Author’s Life


    David Graeber was born in New York in 1961. The son of working-class intellectuals
    active in labor union circles (organizations of workers founded to guarantee things
    such as fair pay and decent working conditions), he was exposed to leftist politics
    at an early age. Graeber’s mother was a garment worker. His father was affiliated
    with the Young Communist League as a student and later participated in the Spanish
    Revolution and Spanish Civil War of the 1930s, in which supporters of the extreme
    right-wing regime of the military leader Francisco Franco fought a coalition of
    Spanish and international volunteers who wanted to preserve the previous, democratic
    regime.


    Graeber began to declare himself an anarchist at the age of 16,¹ he graduated
    from the State University of New York at Purchase in 1984, then studied anthropology
    as a graduate student at the University of Chicago. While he won a prestigious
    Fulbright Fellowship to conduct ethnographic research into the culture of the
    people of Madagascar, an island nation east of Africa, Graeber received his doctorate
    in anthropology in 1997.


    Graeber’s involvement in political activism began in 1999, when he joined protests
    against the World Trade Organization (WTO) meeting in Seattle. The WTO promotes
    and regulates global trade, and is a symbol of the growing connections among nations
    around the world. Graeber established himself as a vocal figure in the global
    justice movement, an international network of activist groups opposed to capitalism
    and globalization. In 2011, he became an intellectual leader within Occupy Wall
    Street (OWS), an activist group that grew out of a local protest in a park in
    New York City. Among other things, OWS protested debt relief policies that they
    believe unfairly wealthy creditors. Graeber is sometimes credited for coming up
    with the group’s now most famous slogan “We are the 99%.²


    Today, Graeber is a professor of anthropology at the London School of Economics
    and continues to participate in social activism.


    ### Author’s Background


    David Graeber was a teenager in the 1970s, a period bookended by major disruptions
    in the global economic order. In 1971, the United States began a process that
    led to the end of the gold standard, under which the US dollar and other currencies
    had been linked to a fixed amount of gold. In 1979, an energy crisis caused by
    interruptions in the supply of petroleum from the Middle East and faltering economies
    in the West saw fuel prices rise sharply, creating economic hardship throughout
    the economy.


    While Graeber was a university student, the world saw a debt crisis in the 1980s
    triggered by unregulated lending from global banks to governments in developing
    countries that borrowed (and sometimes wasted) more money than they could repay.
    In response, global trade and development organizations—the International Monetary
    Fund (IMF) and the World Bank—forced changes that created hardships for citizens
    of developing countries reliant on suddenly unaffordable public welfare programs
    and local jobs. In exchange for high-interest loans that saved them from default,
    these developing countries had to focus more of their budgets on loan repayment,
    and open their economies to international trade. According to the anthropologist
    Keith Hart, “Graeber’s internationalism was shaped by this wholesale looting”
    of developing countries. ³


    Graeber’s doctoral fieldwork in Madagascar also played a considerable role in
    his politics. His views on economic inequality arose from his research on the
    slave trade, colonialism, and postcolonial power struggles between Madagascar
    and wealthier nations. All of these aspects of Graeber’s background fuel his political
    activism and informed the tone of Debt and his other academic work.


    ### NOTES


