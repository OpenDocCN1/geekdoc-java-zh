    这三个主题中的每一个都揭示了关于债务的重要信息。格雷伯（Graeber）表示，在交换的语言中，债务是一种尚未完成的交易。然而，他也指出，这并不是人类互动的自然方式。最后，格雷伯引用历史证据论证，特别是财务债务是一种人为的观念，它扭曲了社会义务的本质，使其成为市场经济的一部分。


    ## “使债务成为可能的不仅是货币：货币和债务是在同一时刻出现的。”


    大卫·格雷伯，《债务：人类社会的五千年史》


    ## 探索思想


    *经济学*的核心原则之一是，人类基于交换而相互联系在一起。在《债务》一书中，格雷伯试图通过拆穿三个支持这一观点的“神话”来反驳此点。


    第一个被称为“**物物交换神话**（the Myth of Barter）*”，指的是18世纪经济学家**亚当·斯密**（Adam Smith）的观点，即货币的出现是为了促进物物交换。格雷伯写道：“物物交换神话无法消失，因为它是经济学话语的核心。”¹
    然而，在历史记录或人类学*野调查中，并没有证据表明物物交换先于货币的创造，或者它在货币的创造中起过重要作用。²


    第二个神话是“**原始债务**（primordial debts）*”，指的是一直存在的的债务。根据原始债务理论：“政府利用税收来创造货币，他们之所以能够这样做，是因为他们成为了所有公民之间债务的守护者。这种债务是社会本身的本质。”^³
    像物物交换一样，原始债务暗示人们用一种简单的方式将他们之间的关系解读为交易。格雷伯将原始债务斥为一种神话，这种神话声称货币本身是对国家权力的贡品。他引用了人类学证据，证明货币不仅在非市场社会中出于仪式目的存在，而且即使在市场社会中，货币的功能也是由国家和市场共同决定的。


    后一点涉及到第三个神话——即市场和国家是相互独立的。格雷伯认为，事实上，两者“是共同诞生的，并且一直交织在一起”。4 作为记账单位的货币起源于世界上最早的城市文明——公元前3000多年的索不不达米亚*的神庙和宫殿建筑群。在**轴心时代**（Axial
    Age*，一个由于人类哲学思想巨大进步而产生的古代历史时期，通常被认为持续公元前800年至公元前200年），整个欧亚大陆*的扩张性国家开始以硬币形式向士兵发放货币。这些国家的统治者要求公民使用相同的硬币缴纳税款，这迫使公民向士兵出售物资以换取硬币来缴税。市场随之而生。


    正如格雷伯所说，上述神话都“将所有人类关系简化为交换，就好像他们对社会……可以用像生意交易相同的术语来想象。”5 格雷伯试图利用这些神话，并指出交换并不是人类关系中最为自然的负债感。


    格雷伯的第二个主题描述了与交换相关的债务与其他义务之间的区别。格雷伯认为，人们根据以下方式组织他们的义务感：


    - **共产主义**（Communism*）（根据能力和需求相互照顾）

    - **交换**（Exchange）（无私地交易价值相近的物品）

    - **等级制度**（Hierarchy）（下级与上级之间的互动）。人们根据其关系的性质在这些方法之间切换，6，而交换倾向于保留给陌生人。


    最后，格雷伯通过追踪货币性质在历史上的变化论证了债务是人为的。他对欧亚历史进行了详尽的讨论，将其分为四个阶段：


    - **第一个农业帝国时代**（公元前3500—800年；“农业帝国”是以农业为经济基础的政治实体）

    - **轴心时代**（公元前800年—公元600年）

    - **中世纪**（公元600年—1450年）

    - **“大资本主义帝国时代”**（公元1450年至今）。


    根据时代的政治（politics*），7，货币在这些阶段的形式在虚拟货币（信用credit*的符号或表示）和商品货币（commodity*，具有价值的实物，通常是黄金）之间交替。这表明债务本身是一种可以被重新定义的政治发明。


    ## 语言与表达


    格雷伯将《债务：人类社会的五千年史》描述为“这类人们不再写的书：一本大部书，提出宏大的问题，旨在广泛阅读并引发公众辩论，但同时又不牺牲学术的严谨性。8 这体现在书中542页中有149页由脚注和参考文献组成，这一特征在教科书中比在大众读物中常见。


    同时，格雷伯希望《债务》成为“一部易于阅读的作品，用通俗的英语写就，实际上试图挑战常识性的假设。9 以一种杂乱但最终令人愉快的方式，这本书让大众读者进入经济学和哲学领域几个世纪的知识辩论，并提供了从人类学野调查中收集的海量数据。作为一名活动家，格雷伯认为更广泛的公众应该参与债务及其道德影响的讨论，而不仅仅是学者和决策者。


