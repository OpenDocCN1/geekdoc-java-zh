    developing countries reliant on suddenly unaffordable public welfare programs
    and local jobs. In exchange for high-interest loans that saved them from default,
    these developing countries had to focus more of their budgets on loan repayment,
    and open their economies to international trade. According to the anthropologist
    Keith Hart,* “Graeber’s internationalism was shaped by this wholesale looting”
