  md: '# MODULE 5

    MAIN IDEAS


    # KEY POINTS


    +   - David Graeber writes about two key themes in Debt: the origin of money and
    markets,* and the origins of the concept of “debt” itself.

    - According to Graeber, money and markets are tools artificially created to convert
    the social obligations on which human relationships are built into measurable
    “debts” people in a position of power can use to take advantage of others.

    - Debt is written for a popular audience, so while making its arguments it provides
    easily understandable discussions on morality and political philosophy.


    Key Themes


    David Graeber wants to understand whether our current economic system, centered
    on the idea of debt, is truly fair; the title Debt: The First 5,000 Years makes
    it plain that debt will be the central focus of the work. His attempts to answer
