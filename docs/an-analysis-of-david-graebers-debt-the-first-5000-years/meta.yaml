    > “If we want an alternative to stagnation, impoverishment, and ecological devastation,
    we’re just going to have to figure out a way to unplug the machine and start again.”

    David Graeber, *Guardian*


    # Schools of Thought


    Scholars who have played an important role in popularizing the debate on global
    inequality and capitalism include the economists Thomas Piketty* of France, Joseph
    Stiglitz* of the United States, and Dani Rodrik* of Turkey.


    By far the most successful recent book in bridging the divide between academia
    and the public over inequality is Thomas Piketty’s *Capital in the Twenty-First
    Century*. This book does not call for dismantling the capitalist system, but rather,
    for a serious reform of its mechanics so that global systems might redistribute
    enough wealth to undo inequality produced by capitalism.³ Nonetheless, *Capital*
    shares some of Debt’s core features, arguing against the idea that capitalism
    operates on principles of equity. As Knox Peden has written in the *Sydney Review
    of Books*: “Though Piketty and Graeber are temperamentally antipodal [opposites],
    the thematic resonance connecting their works is clear enough.”⁴


    In 2015, Piketty allowed to acknowledge Graeber’s analysis when he called for
    an international conference on debt and the implementation of a new strategy for
    dealing with the European debt crisis:* “Essentially, it consists of three components:
    inflation,* a special tax on private wealth, and debt relief.”⁵


    # In Current Scholarship


    Brought together by a mutual frustration with inequality, Graeber and Piketty
    have engaged with each other directly on how to move forward the current scholarship
    criticizing capitalism and inequality. The two scholars approach the debate from
    completely different practical viewpoints.


    In Capital, Piketty supports Graeber’s idea that capitalism is a system that,
    in its purest form, cannot help but create injustice: “Capitalism does not contain
    an inherent tendency to civilize itself. If left to its own devices, it can be
    expected to create rates of return on investment so much higher than overall rates
    of economic growth that the only possible result will be'
