    # Notice


    The information in this book is designed to orient readers of the work under analysis,
    to elucidate and contextualise its ideas and to aid in the development of critical
    thinking skills. It is not meant to be used, nor should it be used, as a substitute
    for original thinking or in place of original writing or research. References
    and notes are provided for informational purposes and their presence not constitute
    endorsement of the information or opinions therein. This book is presented solely
    for educational purposes. It is on the understanding that the publisher is not
    engaged to provide any scholarly advice. The publisher has made every effort to
