    # THE MACAT LIBRARY


    The Macat Library is a series of unique academic explorations of seminal works
    in the humanities and social sciences – books and papers that have had a significant
    and widely recognised impact on their disciplines. It has been created to serve
    as much more than just a summary of what lies between the covers of a great book.
    It illuminates and explores the influences on, ideas of, and impact of that book.
    Our goal is to offer a learning resource that encourages critical thinking and
    fosters a better, deeper understanding of important ideas.


    Each publication is divided into three Sections: Influences, Ideas, and Impact.
    Each Section has four Modules. These explore every important facet of the work,
    and the responses to it.


    This Section-Module structure makes a Macat Library easy to use, but it has another
    important feature. Because each Macat book is written to the same format, it is
    possible (and encouraged!) to cross-reference multiple Macat books along the same
    lines of inquiry or research. This allows the reader to open up interesting interdisciplinary
    pathways.


    To aid your reading, lists of glossary terms and people mentioned are included
    at the end of this book (these are indicated by an asterisk [*]) – as well as
    a list of works cited.


    Macat has worked with the University of Cambridge to identify the elements of
    critical thinking and understand the ways in which six different skills combine
    to enable effective thinking.


    Three allow us to fully understand a problem; three more give us the tools to
    solve it. Together, these six skills make up the PACIER model of critical thinking.
    They are:


    - ANALYSIS – understanding how an argument is built

    - EVALUATION – exploring the strengths and weaknesses of an argument

    - INTERPRETATION – understanding issues of meaning

    - CREATIVE THINKING – coming up with new ideas and fresh connections

    # PROBLEM-SOLVING – producing strong solutions


    # REASONING – creating strong arguments


    To find out more, visit WWW.MACAT.COM.


    # CRITICAL THINKING AND DEBT: THE FIRST 5,000 YEARS


    Primary critical thinking skill: PROBLEM-SOLVING

    Secondary critical thinking skill: REASONING


    Debt is one of the great subjects of our day, and understanding the way that it
    not only fuels economic growth, but can also be used as a means of generating
    profit and exerting control, is central to grasping the way in which our society
    really works.


    David Graeber’s contribution to this debate is to apply his anthropologists’ training
    to the understanding of a phenomenon often considered purely from an economic
    point of view. In this respect, the book can be considered a fine example of the
    critical thinking skill of problem-solving. Graeber’s main aim is to undermine
    the dominant narrative, which sees debt as the natural – broadly healthy – outcome
    of the development of a modern economic system. He marshals evidence that supports
    alternative possibilities, and suggests that the phenomenon of debt emerged not
    as a result of the introduction of money, but at precisely the same time.


    This in turn allows Graeber to argue against the prevailing notion that economy
    and state are fundamentally separate entities. Rather, he says, “the two were
    born together and have always been intertwined” – debt being a means of enforcing
    elite and state power. For Graeber, this evaluation of the evidence points to
    a strong potential solution: there should be more readiness to write off debt,
    and more public involvement in the debate over debt and its moral implications.


    # ABOUT THE AUTHOR OF THE ORIGINAL WORK


    Born in 1961, US anthropologist and activist David Graeber was weaned on leftist
    politics, and declared himself an anarchist at 16. He became an anthropology professor,
    and his early cultural research in Madagascar exposed him to poverty that he saw
    as caused by pressures to repay government debt. Through a combination of activism
    and scholarship he has devoted much of his career to developing an intellectual
    basis for undermining capitalism. In his 2011 book Debt: The First 5,000 Years,
    Graeber uses the insights of an anthropologist to argue that debt plays a toxic
    role in human relations.


    # ABOUT THE AUTHORS OF THE ANALYSIS


    Sulaiman Hakemy holds an MSc in economic history and development from the London
    School of Economics. A writer and journalist, he has reported on industry, politics,
    and culture for various publications. His background is in the development aid
    and urban planning sectors, specialising in conflict and fragile states. He is
    based in Istanbul and Toronto, and speaks English, French, Spanish, Arabic, Persian,
    and some Urdu.


    # ABOUT MACAT


    # GREAT WORKS FOR CRITICAL THINKING


    Macat is focused on making the ideas of the world’s great thinkers accessible
    and comprehensible to everybody, everywhere, in ways that promote the development
    of enhanced critical thinking skills.


    It works with leading academics from the world''s top universities to produce
    new analyses that focus on the ideas and the impact of the most influential works
    ever written across a wide variety of academic disciplines. Each of the works
    that sit at the heart of its growing library is an enduring example of great thinking.
    But by setting them in context – and looking at the influences that shaped their
    authors, as well as the responses they provoked – Macat encourages readers to
    look at these classics and game-changers with fresh eyes. Readers learn to think,
    engage and challenge their ideas, rather than simply accepting them.

