    > “Anthropology seems a discipline terrified of its own potential.”

    David Graeber, Fragments of an Anarchist Anthropology


    # Integration


    Of Debt’s major themes is the argument that the capitalist system uses debt as
    a mechanism to perpetuate inequality and abuse. This is rooted in Graeber’s doctoral
    fieldwork on the island of Madagascar, where he witnessed first hand the negative
    effects of large amounts of government debt on economy and people. Pressure to
    repay the national debt served as both moral and practical justification for cutting
    social welfare programs and harming quality of life. Later, in 2007, Graeber would
    also publish Lost People: Magic and the Legacy of Slavery in Madagascar. Although
    a purely anthropological work with a narrow focus on Madagascar, it nonetheless
    introduced many of the ideas on slavery, inequality, and debt that serve as secondary
    themes in Debt.¹


    The most direct influence on Debt from within Graeber’s own body of work, however,
    comes from Toward an Anthropological Theory of Value, Graeber’s first book, which
    established him as an anthropologist concerned with the issues of economic theory.
    The book’s basic position is that people and, by extension, their actions are
    the most important “products” of a society.² The implication is that the notion
    that values can be established through market exchange is simply wrong; the basis
    for Graeber’s exploration of debt and human economies in Debt.


    # Significance


    Graeber was already considered one of the greatest anthropologists of his generation
    well before the publication of Debt. His extensive ethnographic work on Madagascar,
    which ranged from his time as a graduate student to his publication of Lost People,
    was highly regarded within his field.³ After the publication of Graeber’s books
    Toward an Anthropological Theory of Value and Fragments of an Anarchist Anthropology,
    the British anthropologist Maurice Bloch* wrote: “Graeber’s writings on anthropological
    theory are outstanding. I consider him the best anthropological theorist of his
    generation from anywhere in the world.”⁴'
