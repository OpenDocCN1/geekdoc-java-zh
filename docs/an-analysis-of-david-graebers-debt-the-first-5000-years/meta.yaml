    - 6. David Graeber, “Savage Capitalism Is Back—And It Will Not Tame It,” *Guardian*,
    May 30, 2014, http://www.theguardian.com/commentisfree/2014/may/30/savage-capitalism-back-radical-challenge.

    - 7. Graeber, "Savage Capitalism."

    - 8. David Graeber and Thomas Piketty, "Soak the Rich: An Exchange on Capital,
    Debt, and the Future,” The Baffler, July 31, 2014, http://thebaffler.com/odds-and-ends/soak-the-rich.


    # MODULE 11

    ## IMPACT AND INFLUENCE TODAY


    # KEY POINTS


    - Debt has become a central work in the global activist community.

    - The work directly challenges policymakers and other members of the international
    economic and governance elite to change the way that they view credit,* debt,
    and the morality of the capitalist* system.

    - The debate between policymakers and economists is still ongoing, although those
    who favor debt relief believe they are gaining ground.


    ### Position


    Debt has become a “must-read” in international activist circles. Public intellectuals
    like Antonio Negri,* the Italian Marxist* sociologist and political philosopher,
    have cited Debt in their activist writings and calls for action. In their 2012
    joint essay Declaration, Negri and American political philosopher Michael Hard*
    state “In contrast to the myth of equal exchange, then, the debtor–creditor relationship
    has the virtue of unmasking the vast inequalities at the foundation of capitalist
    society.” One of listed sources of evidence for this statement is David Graeber’s
    Debt: The First 5,000 Years.

