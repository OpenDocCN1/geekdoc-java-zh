    > “Graeber ... emerged as perhaps the most influential radical political thinker
    of the moment.”

    Kelefa Sanneh, The New Yorker


    # Interaction


    The first translation of Debt was published in Germany, which, as the primary
    creditor of the European debt crisis, is often thought to occupy the moral high
    ground. While Graeber thinks of debt as a social invention that is often used
    to take advantage of others, German thinkers tend to view debt as a moral absolute.
    In Debt, Graeber notes that the German word for “debt,” schuld, is also the word
    for “guilt.” “But at the same time we realize that [debt] is about to destroy
    the European Union,* which is the last thing they want.” Debt was a best seller
    for 11 weeks in Germany, indicating that Graeber’s ideas are gaining acceptance
    there. German voters, it might appear, are increasingly willing to at least discuss
    compromising with debtor nations.


    If Debt can be said to argue against a specific group of people, it is the central
    bankers and policymakers who are responsible for resolving today’s economic crises.
    The book’s success in Germany, where a leading conservative politician praised
    it on the cover of the daily Frankfurter Allgemeine Zeitung,¹ shows that policymakers
    might be following the citizens they serve in acknowledging the book’s arguments.


    # The Continuing Debate


    Graeber has had some success in challenging policymakers through Debt. The chief
    research economist of the International Monetary Fund* reached out to Graeber
    to discuss potential avenues for banking reform.² On the global economic policy-making
    elite, Graeber has said: “While they’re telling everyone, ‘Nothing to see here,
    carry on, carry on,’ in fact those guys are panicking like crazy. You can see
    all clear struggles going on where we don’t really know what is at stake.³³ Within
    the US Federal Reserve,* the central bank of the United States, a growing number
    of people advocate debt relief in the form of mortgage cancellation.⁴ Of course,
    it is difficult to link global economic policy outcomes directly with the writing
    in Debt beyond Graeber’s own accounts, as no policy paper from a global economic
    institution has yet cited Debt in its sources.


    According to Graeber, there are “titanic struggles” occurring between those who
    want radical change and those who do not, but the lack of progress boils down
    to inertia. While fundamental change may not occur, there is an increasing amount
    of sympathy for debt relief in the European debt crisis. “Looking back on this
    moment, we know the debt will be cancelled,” Graeber has said. “Among those taking
    a long-term perspective, everyone agrees on that.”⁵


    # NOTES


    - 1. “Melville House Press Release: Debt: The First 5,000 Years,” November 27,
    2012, http://cdn.mhpbooks.com/2012/12/Debt-PR.pdf.

    - 2. Hannah Chadeayne Appel, “Finance Is Just Another Word for Other People’s
    Debts: An Interview with David Graeber,” Radical History Review, no. 118 (2014):
    171.

    - 3. Appel, “Other People’s Debts,” 171.

    - 4. Appel, “Other People’s Debts,” 171.

    - 5. Appel, “Other People’s Debts,” 173.


    # MODULE 12

    WHERE NEXT?


    # KEY POINTS


    - Debt will be remembered as an important book for anthropologists* because of
    its ability to spark a debate in economics* and economic history* using anthropological
    theory and evidence.

    - Outside of academia, Debt is well positioned to have some influence in policy
    debates because it is accessible to a popular audience.

    - Debt offers an immensely detailed, far-reaching, and critical discussion of
    some of the most fundamental institutions and ideas of capitalism.*


    # Potential


    In terms of style and structure, Debt: The First 5,000 Years resembles both a
    history book and a declaration of belief. Debt also challenges the assumptions
    we have made over the last several hundred years about civilization, history,
    and society. While it provides an alternate view of history, Debt offers almost
    nothing to replace the policy assumptions that it challenges. Instead, the book
    serves as a giant signpost pointing the public and the intellectual community
    in a direction that may be an anarchist* or reformist, but is essentially unknown.


    The book will likely be remembered as a classic in anthropology for its ability
    to unite the reflections and observations of anthropologists on economic life
    and collectively aim them toward a common mission. However, pure economists have
    proven so unwilling to break free from rigid ideas like the Myth of the Barter*
    that Debt will probably remain out of the mainstream, on secondary reading lists
    as an object of curiosity.


    # “You know radical change is coming when they call an anthropologist.”


    David Graeber, Radical History Review


    # Future Directions


    Debt charts a new course for those within academia who are interested in alternatives
    to the traditional understanding of economic history. The book argues that anthropological
    study, rather than the legacy of the economist Adam Smith,* is the best way to
    engage with and interpret economic history. Anthropology has offered rich scholarship
    in “economic anthropology” since the writings of the pioneering sociologist Marcel
    Mauss* in the nineteenth century, but Debt insights have not been accessible to
    non-anthropologists. Because of this, the book makes way for an interdisciplinary*
    academic tradition drawing on the aims and methods of different academic disciplines—that
    can develop a more thorough understanding of money and markets.


    It remains to be seen whether, cross-discipline scholarship will translate into
    policy prescriptions. Economists have dominated policy making for nearly three
    centuries, and while heterodox* ideas—ideas outside of the mainstream—have been
    around in economics for more than a century, they remain on the fringes despite
    evidence that may support their claims.


    Graeber’s book and the ongoing economic climate imply that the various arguments
    against capitalism be converging and getting stronger. David Graeber was invited
    to play an intellectual leadership role in Occup Wall Street.* In the midst of
    the Syrian Civil War* (a conflict in the Middle East fought between those loyal
    to the Syrian President Assad and the rebel opposed to his rule), the Kurdish
    breakaway region of Rojava* has already rejected capitalism, taken steps to return
    to the “human economies” Graeber writes about in Debt, and hosted Graeber himself
    to see anarchist ideas in action.¹¹


    # Summary


    David Graeber’s Debt is a vast work, more than 500 pages, on the origins and meaning
    of debt and money in human society. Published in the wake of the 2008 global financial
    crisis,* the book’s sharp criticism of many of the foundational principles of
    capitalism has found an audience. Debt’s central lesson is that the traditional
    understanding of economics and economic history has hidden the real story of capitalism,
    which is money and debt allow the powerful to take advantage of the weak. War
    and slavery, Graeber argues, were instrumental in creating and shaping the institutions
    that form our modern market economy.


    Debt uses anthropological and historical evidence to argue that money did not
    arise from a natural human tendency toward bartering,*despite the claims of Adam
    Smith and the economists who followed him. In fact, rather than basing their lives
    on cutting deals or profiting off of one another, Graeber argues that pre-market
    and non-market societies operated in the “human economy.” People worked together
    to meet their needs based on complex networks of social obligations shaped by
    their personal relationships, and any barter-like behavior was for strangers who
    lacked mutual trust.


    As rulers and states grew more powerful, however, social obligations gradually
    converted into measurable, impersonal debts, which disrupted human relationships.
    Graeber describes money as the tool used to calculate debts and justify punishments
    for those who owed them. With five millennia of history as evidence, Graeber argues
    that the commercial economy does not reflect human nature, and that it creates
    complex ways for the wealthy to take advantage of the poor. His book declares
    that capitalism itself is far from the fair and equitable system many imagine,
    and that capitalism can be undone.


    # NOTES


    - 1. David Graeber, “Why Is the World Ignoring the Revolutionary Kurds in Syria?”
    *Guardian*, October 8, 2014, http://www.theguardian.com/commentisfree/2014/oct/08/why-world-ignoring-revolutionary-kurds-syria-isis.

