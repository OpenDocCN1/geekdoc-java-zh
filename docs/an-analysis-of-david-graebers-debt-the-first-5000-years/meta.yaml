    # MODULE 11

    IMPACT AND INFLUENCE TODAY


    # KEY POINTS


    +   * Debt has become a central work in the global activist community.\n* The
    work directly challenges policymakers and other members of the international economic
    and governance elite to change the way that they view credit,* debt, and the morality
    of the capitalist* system.

    * The debate between policymakers and economists is still ongoing, although those
    who favor debt relief believe they are gaining ground.


    Position


    Debt has become a “must-read” in international activist circles. Public intellectuals
    like Antonio Negri,* the Italian Marxist* sociologist and political philosopher,
    have cited Debt in their activist writings and calls for action. In their 2012
    joint essay Declaration, Negri and American political philosopher Michael Hard*
    state “In contrast to the myth of equal exchange, then, the debtor–creditor relationship
    has the virtue of unmasking the vast inequalities at the foundation of capitalist
    society.” One of listed sources of evidence for this statement is David Graeber’s
    Debt: The First 5,000 Years.


    Even outside of the community of hardcode anti-capitalist activists, however Debt
    allows the reader to step outside the boundaries of traditional economic thought,
    and instead ask questions about the system as a whole. While questioning the capitalist
    system is an activity as old as capitalism itself, Debt makes the exercise more
    accessible to today’s audience. In a time of global economic turmoil caused by
    personal and national debt, Graeber’s book offers both sympathy and defiance.'
