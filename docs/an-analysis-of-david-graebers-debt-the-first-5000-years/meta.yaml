    # GLOSSARY OF TERMS


    **Anarchism** a political philosophy advocating the destruction of governments
    in favor of stateless societies.


    **Anthropology** the academic study of humanity and human society.


    **Austerity** a set of economic policies intended to reduce government budget
    deficits by cutting government spending and paying back loans.


    **Austrian School** a school of economic thought that focuses on the rationality
    and actions of individuals as the primary forces in an economy.


    **Axial Age** a period of ancient history characterized by great advances in human
    philosophical thought, normally considered as being 800 B.C.E.—200 B.C.E. (although
    defined by David Graeber as 800 B.C.E.—600 B.C.E.).


    **Barter** the practice of trading goods or services directly for other goods
    or services, without exchanging money. Barter is possible only when each party
    has something that the other wants.


    **Brahmanas** a collection of ancient Indian religious scriptures including myths,
    legends, explanations of rituals, and philosophy accompanying older scriptures
    known as the Vedas.


    **Capitalism** an economic system in which trade, production, and property are
    largely or entirely in the hands of private individuals or corporations.


    **Chartalism** the economic school of thought that teaches that money arose from
    states’ efforts to direct market activity rather than spontaneously to enable
    barter.


    **Colonialism** the forced acquisition, settlement, and political or economic
    control of one territory by the political power of another territory.


    **Commodity** an object that can be traded, bought, or sold.


    **Communism** a political ideology advocating common ownership of the means of
    production and the destruction of social relationship structures.


    **Credit** the ability to purchase goods or services without immediate payment,
    based on the seller’s trust that payment will be received at a later time.


    **Credit theory of money** a collection of economic schools of thought that teach
    that money is essentially a form of credit and debt.


    **Debt crisis of the 1980s** a debt crisis triggered by unregulated lending from
