    # MODULE 4

    THE AUTHOR’S CONTRIBUTION


    # KEY POINTS


    +   - Graeber believes we can build an idea of a fairer economic life using anthropological*
    evidence (evidence drawn from the study of human culture and society) comparing
    market* societies (defined by the extent to which trade is conducted for private
    profit) and non-market societies.

    - Graeber’s exploration of debt introduces anthropology into a public debate that
    has largely occurred within the confines of economics* and economic history.*


    Debt summarizes and builds on a century-old body of work known as economic anthropology*
    (the study of the ways in which different human cultures conduct their economic
    affairs).


    # Author’s Aims


    David Graeber has several aims in Debt: The First 5,000 Years. At a basic level,
    he wants to clear up the “profound moral confusion”¹² about what debt actually
    is by building a definition of debt that is free from “the logic of the marketplace.²”


    He wants to advance the discipline of anthropology by injecting insights into
    a discussion usually associated with economic theory and economic history. As
    such, the book practices a kind of intellectual sabotage that systematically undermines
    the work of the eighteenth-century economist Adam Smith* and his descendants,
    and strengthens the position of Graeber’s intellectual forebears in the field
    of economic anthropology along the way.


    At the broadest level, however, Graeber is trying to promote anti-capitalism*
    by means of relevant and serious scholarship without falling'
  - '[PAGE 29]


    back on the outmoded ideas of Karl Marx* or the fringes of leftist extremism.
    Graeber does not make any sweeping policy proposals, other than offering the idea
    of extensive debt relief.³ But he clearly intends to inspire others to create
    solutions once they have set aside their commitment to capitalism.


    > **One of the puzzling things about all the theories on the origins of money
    that we''ve been looking at so far is that they almost completely ignore the evidence
    of anthropology.**


    David Graeber, *Debt: The First 5,000 Years*


    # Approach


    In *Debt*, Graeber does not build arguments on top of preexisting economic theory
    or political philosophy. He seeks only to disprove existing arguments. Graeber
    believes capitalism evolved because of a series of events in world history, and
    is not based on any objective economic truths. Based on this approach, he reveals
    less about debt, morality, and markets by examining economic history in detail.


    Graeber bases his work on evidence, and is through in referencing his sources.
    The sheer size of the time period covered (3500 b.c.c. to the present) forces
    him to trot briskly through historical and anthropological evidence, providing
    his opinions and theories where they are relevant. As a result, the book’s chapters
    are not neatly tied to a central point. Graeber quickly lays out some of his arguments
    at the beginning and provides the evidence to support them as he goes along, making
    other arguments at the end.


    While this would be a problem in an academic paper, the approach works well in
    a book for a popular audience. Graeber values storytelling over technicalities,
    so that the reader finishes with a clear set of ideas and opinions and plenty
    of examples to support them. But it is difficult to stitch all the ideas together
    into a consistent theory.


    # Contribution in Context


    One of *Debt’s* unique contributions is that it combines the various traditions
    in economic anthropology in an effort to disprove the traditional'
  - '[PAGE 30]


    understanding of economics. Graeber pulls together an enormous range of ethnographic*
    (cultural) studies, physical evidence from earlier societies, and anthropological
    theory to conclude that money did not originate from barter* (trade without money)
    and did not arise as a unit of exchange.


    He also supports the school of thought pioneered by the British anthropologist
    Keith Hart,* who said money has always been both a commodity* (something valuable
    in its own right) and a tool for credit,* and debt accounting. Graeber builds
    on Hart’s views by arguing that over history, civilization has swung back and
    forth between credit and commodity forms of money. When Graeber told Hart of this
    claim in person, Hart acknowledged that he had never realized that before.


    Graeber also discusses why money really came about, if not for exchange. He then
    draws moral conclusions from this discussion, arguing that economies have manipulated
    the concepts of credit and debt by using money to enforce power relationships.
    While Graeber does not describe a new anti-capitalist anthropological theory,
    he assembles many of the pieces needed to do so.


    # NOTES


    +   1. David Graeber, Debt: The First 5,000 Years (Brooklyn, NY: Melville House,
    2011), 8.

    2. Graeber, Debt, 90.

    3. Graeber, Debt, 390.'
