    The latter point speaks to the third myth—that the market and the state are independent
    from each other. Graeber argues that, in fact, the two “were born together and
    have always been intertwined.”4 Money as a unit of account originated in the temple
    and palace complexes of the world’s earliest urban civilization, Mesopotamia*
    more than 3,000 years b.c.e. During the Axial Age* (a period of ancient history
    created by great advances in human philosophical thought, normally considered
    to have lasted from 800 b.c.e. to 200 b.c.e.), aggressive states throughout Eurasia*
    to expand began issuing money in the form of coins to soldiers. The rulers of
    these states demanded that citizens pay taxes using the same coins, which forced
    citizens to sell supplies to soldiers in exchange for the coins to pay taxes.
    Markets emerged as a result.


    As Graeber puts, the above myths all “to reduce all human relations to exchange,
    as if they to society ... can be imagined in the same terms as a business deal.”5
    Graeber tries to employ these myths and suggests that exchange is not the most
    natural sense of indebtedness in human relationships.


    Graeber’s second theme describes the differences between exchange-related debt
    and other obligations. Graeber argues that people organize their sense of obligation
    in three ways, based on:


    +   - Communism* (looking out for one another to abilities and needs)

    - Exchange (impersonally trading things of similar value)

    - Hierarchy (interaction between an inferior and superior). People shift between
    these approaches based on the nature of their relationships,6 and exchange tends
    to be reserved for strangers.


