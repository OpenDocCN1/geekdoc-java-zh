    # Other Ideas


    An important secondary idea in David Graeber’s *Debt: The First 5,000 Years* is
    the relationship between debt, markets,* and violence. Graeber explores this through
    his concept of the “human economy.”


    One of the main ideas of *Debt* is that our current economic system is not legitimate
    because it is built on the idea that debt is simply an impersonal exchange that
