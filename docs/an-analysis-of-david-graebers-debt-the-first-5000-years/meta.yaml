    # MODULE 10

    THE EVOLVING DEBATE


    # KEY POINTS


    +   * As a book written for a popular audience, Debt is positioned as a key influence
    in shaping the layman''s views on economics* and the current difficulties of the
    global economic system.

    * Although unique in its approach, Debt is one of a number of books in an emerging
    literature and school of thought highlighting the tendency of capitalism toward
    inequality.

    * Debt presents a historical, moral, and philosophical basis for the idea of debt
    relief, heavily discussed today as a means of alleviating the difficulties of
    global financial crises.


    Uses and Problems


    While David Graeber''s Debt: The First 5,000 Years has been hailed its publication
    as an influential work in anthropology* and academia at large, it has found the
    most use in the public sphere.¹1 This is in line with Graeber''s intentions, as
    he wrote Debt thinking “it would be interesting to write for a broader audience
    and see what kind of impact you can have on the arguments going on.”2


    Owing to the timing of its publication in the wake of the global financial crisis,*
    Debt joins a great deal of literature written with the aim of inspiring debate
    on capitalism. But while other economists and political philosophers are heavily
    critical of the mechanisms of the capitalist system, Debt launches an open attack
    on the ideologies driving capitalism and on the system itself. Debt’s radicalism
    is currently, perhaps, what prevents the conversion of its popularity into popular
    action.'
