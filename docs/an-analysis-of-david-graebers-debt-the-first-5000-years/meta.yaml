    ## 第一模块

    ### 作者与历史背景


    ### 核心要点


    - 大卫·格雷伯伯（David Graeber）的《债务：人类史五千年》在世界正处于经济危机剧烈动荡的时期，对我们关于现代经济生活的假设提出了挑战。

    - 格雷伯伯于 1961 年出生于纽约，出生于一个工人阶级知识分子家庭，其成员曾参与过革命运动和无政府主义运动：革命运动致力于推翻现有的政治治理体系或权威；无政府主义是一种主张应当完全废除政府的政治哲学。

    - 格雷伯伯在人类学（对人类，尤其是文化和社会的系统性研究）方面的教育深受其信念的影响。这种信念受到 20 世纪 70 年代和 80 年代全球债务危机和能源危机的启发，即世界的特征是严酷且不平等的权力动力关系。


    ### 为什么要读这本书？


    大卫·格雷伯伯的《债务：人类史五千年》以极大的广度和细节调查了债务的历史和道德。该书出版于 2011 年，写于 2008 年全球金融危机后的初期——那场危机是由美国住房泡沫破灭引起的，导致了大规模债务违约，影响了全球的金融机构和市场，且正值欧洲债务危机期间（当时其中几个成员国无法偿还给私人和公共债权人的贷款）。


    ### “我的童年充满了激进政治”。

    大卫·格雷伯伯，接受《激进历史评论杂志》采访


    这两场危机共同揭露了基于信贷（借贷）和债务的消费经济、建立在为其他国家融资基础上的国民经济，以及基于国家间进出口平衡的全球经济的弱点。贯穿所有这些经济苦难的共同线索，使得格雷伯伯的作品对于社会科学学生和普通公众来说都极具现实意义。


    作者是第一位从人类学角度思考经济问题的通俗读作家。通过在一部为非学术读者编写的书中引入这种方法，格雷伯伯普及了采用跨学科方法（借鉴不同学术领域的目标和方法）来解决经济问题的理念。然而，在更基础的层面上，格雷伯伯的书试图挑战对经济学的流行理解，并削弱资本主义社会经济体系本身的核心原则（一个贸易和生产由私人掌握并为了私人利润而运作的体系）。格雷伯伯的观点被反资本主义知识分子和活动人士所采用，并为反思资本主义体系提供了复杂且易于理解的论点。


    ### 作者生平


    大卫·格雷伯伯于1961年出生于纽约。作为一个活跃于工会圈（为了保障公平工资和良好工作条件而成立的工人组织）的工人阶级知识分子之子，他很早就接触了左翼政治。格雷伯伯的母亲是一名缝纫工人。他的父亲在学生时代加入了青年共产主义联盟，随后参加了
    20 世纪 30 年代的西班牙革命和西班牙内战；在那场战争中，军事领袖弗朗西斯科·弗朗哥极右翼政权的支持者与想要保留此前民主政权的西班牙本土及国际志愿者组成的联盟进行了战斗。


    格雷伯伯在 16 岁时开始宣布自己是一个无政府主义者¹，他于 1984 年毕业于纽约州立大学普彻分校，随后在芝加哥大学攻读人类学研究生学位。尽管他获得了荣誉的富布莱特学金前往非洲东部岛国马达加斯加的人民进行民族志研究，格雷伯伯仍于1997
    年获得了人类学博士学位。


    格雷伯伯参与政治活动始于1999 年，当时他参加了反对西雅图世界贸易组织（WTO）会议的抗议。WTO 促进并监管全球贸易，是全球各国日益紧密的联系象征。格雷伯伯成为全球正义运动（一个反对资本主义和全球化的国际活动人士团体网络）中的一个发声人物。2011
    年，他成为占领华尔街（OWS）的知识领袖，该小组是由纽约市一个公园的当地抗议活动发展而来的。除其他外，占领华尔街还抗议他们认为不公平有利于富有债权人的债务减免政策。格雷伯伯有时被认为是该小组现今最著名口号“我们是99%”²的提出者。


    今天，格雷伯伯是伦敦政治经济学院的人类学教授，并继续参与社会活动。


    ### 作者背景


    大卫·格雷伯伯在20世纪70 年代是一名青少年，那是一个被全球经济秩序重大动荡所左右的时期。1971 年，美国开始了一个导致金本位制结束的过程，在金本位制下，美元和其他货币与固定数量的黄金挂钩。1979
    年，由中东石油供应中断和西方经济衰软引发的能源危机导致燃料价格飙升，给整个经济造成了经济困境。


    在格雷伯伯读大学期间，世界在20 世纪80 年代经历了一场债务危机，这场危机是由全球银行向发展中国家政府的无监管贷款引发的，这些国家借入（有时浪费了）了超过其偿还能力的资金。作为回应，全球贸易和发展组织——国际货币基金组织（IMF）和世界银行强迫了变革，导致依赖于突然无法负担的公共福利计划和当地工作的发展中国家公民陷入了困境。为了换取他们免于违约的高息贷款，这些发展中国家不得不将更多预算重点用于偿还贷款，并向国际贸易开放其经济。根据人类学家基思·哈特（Keith
    Hart）的说法，“格雷伯伯的国际主义是由这种对发展国家的掠夺所塑造的”。³


    格雷伯伯在马达加斯加的博士野外调查对其他的政治起了相当作用。他对经济不平等的观点源于对奴隶贸易、殖民主义以及马达加斯加与富国家之间后殖民权力斗争的研究。格雷伯伯背景中的所有这些方面都激发了他的政治活动，并影响了《债务》及其其他学术作品的基调。


