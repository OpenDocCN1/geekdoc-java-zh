    Criticism


    Debt: The First 5,000 Years was a controversial book at the time of publication;
    while David Graeber’s ideas have been ignored by most economists, a few have expressed
    opposition or support. Among those who chose to critically engage with Debt, Noah
    Smith* and Mike Beggs* offer the most detailed criticisms.


