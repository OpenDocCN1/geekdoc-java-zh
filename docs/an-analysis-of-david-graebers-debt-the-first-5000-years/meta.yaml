  - '[PAGE 61]


    # GLOSSARY OF TERMS


    **Anarchism** a political philosophy advocating the destruction of governments
    in favor of stateless societies.


    **Anthropology** the academic study of humanity and human society.


    **Austerity** a set of economic policies intended to reduce government budget
    deficits by cutting government spending and paying back loans.


    **Austrian School** a school of economic thought that focuses on the rationality
    and actions of individuals as the primary forces in an economy.


    **Axial Age** a period of ancient history characterized by great advances in human
    philosophical thought, normally considered as being 800 B.C.E.—200 B.C.E. (although
    defined by David Graeber as 800 B.C.E.—600 B.C.E.).


    **Barter** the practice of trading goods or services directly for other goods
    or services, without exchanging money. Barter is possible only when each party
    has something that the other wants.


    **Brahmanas** a collection of ancient Indian religious scriptures including myths,
    legends, explanations of rituals, and philosophy accompanying older scriptures
    known as the Vedas.


    **Capitalism** an economic system in which trade, production, and property are
    largely or entirely in the hands of private individuals or corporations.


    **Chartalism** the economic school of thought that teaches that money arose from
    states’ efforts to direct market activity rather than spontaneously to enable
    barter.'
  - '[PAGE 62]


    Colonialism the forced acquisition, settlement, and political or economic control
    of one territory by the political power of another territory.


    **Commodity** an object that can be traded, bought, or sold.


    **Communism** a political ideology advocating common ownership of the means of
    production and the destruction of social relationship structures.


    **Credit** the ability to purchase goods or services without immediate payment,
    based on the seller’s trust that payment will be received at a later time.


    **Credit theory of money** a collection of economic schools of thought that teach
    that money is essentially a form of credit and debt.


    **Debt crisis of the 1980s** a debt crisis triggered by unregulated lending from
    global banks to governments in developing countries that borrowed (and sometimes
    wasted) more than they could repay. In response, global trade and development
    organizations (the International Monetary Fund and the World Bank) forced changes
    that created hardships for those people in developing countries who benefited
    from public welfare programs and local jobs.


    **Debt restructuring** a process in which a debtor is allowed to renegotiate the
    terms or to reduce the value of repayment for outstanding debt.


    **Developing country** a sovereign state with an underdeveloped industrial base
    and a low quality of life relative to other states.


    **Economic history** a discipline of the social sciences that studies the history
    and development of economies.


    **Economics** a discipline of the social sciences that studies human behavior
    and social systems under conditions of scarce means and unlimited wants.


    **The Economist** an English-language weekly magazine covering political and economic
    affairs, established in London in 1843.'
  - '[PAGE 63]


    **Ethnography** a sub-discipline within anthropology concerned with the systematic
    study and graphical representation of human cultures.


    **Eurasia** the combined landmass encompassing the continents of Europe and Asia.


    **European debt crisis** an ongoing debt crisis within the European Union in which
    several member states have been unable to repay loans to private and public creditors.


    **European Union** a political and economic union of 28 European nations.


    **Federal Reserve** the central bank of the United States of America.


    **Fulbright Fellowship** a highly competitive scholarship offering American students
    and scholars funding to conduct research or studies overseas.


    **Geography** an academic discipline concerned with the study of the physical
    features of the earth and its relationship with human activity.


    **Global financial crisis of 2008** the most serious financial crisis since the
    Great Depression of the 1930s. The crisis was caused by the collapse of the American
    housing bubble and resulted in mass defaults on debts, affecting financial institutions
    and markets worldwide.


    **Global justice movement** a network of international social activist movements
    that oppose corporate globalization.


    **Globalization** the process of increasing interconnectedness among global markets,
    politics, and cultures.


    **Gold standard** a monetary system in which the value of the standard currency
    is based on a fixed quantity of gold.


    **Heterodox economics** theories, practices, and schools of thought within economics
    that exist outside of the mainstream teachings of the discipline.


    **Inflation** an increase in prices and fall in the purchasing power of money
    within an economy.'
  - '[PAGE 64]


    Interdisciplinary drawing on the aims and methods of different academic disciplines.


    International Monetary Fund (IMF) an international organization created in 1944
    to foster global monetary cooperation by assisting international trade and providing
    help in financial or monetary crises.


    Keynesian economics an economic school of thought that teaches that in the short
    run a country''s economic output is influenced by the economy''s level of total
    demand.


    London School of Economics a British public research university focused on the
    study of the social sciences, founded in London in 1895.


    Market an economic system in which parties buy and sell goods and services.


    Mesopotamia the name for the area of the Middle East, much of it in Iraq, lying
    between the Tigris and Euphrates rivers. The region is generally considered to
    be the home of the earliest human civilizations.


    Myth of Barter the idea that money arose spontaneously as a solution to the inconveniences
    of barter. Economists have believed this for centuries, but many anthropologists
    argue that it is not correct.


    1979 energy crisis an economic event that occurred in the United States in which
    there was a panic shortage about the supply of oil as a result of political upheaval
    in Iran, leading to sharply increased prices.


    Occupy Wall Street (OWS) a global protest movement against economic and social
    inequality started in 2011 in response to the 2008 global financial crisis.


    Path dependency a theory within the disciplines of development studies and economic
    history that asserts that states develop based on predetermined factors, such
    as geography or prior history.


    Political economy the study of economics in relation to politics.'
  - '[PAGE 65]


    Politics an academic discipline concerned with the study of governance, power
    relations, and the state.


    Primordial debt a theory among some sociologists, historians, and economists that
    government taxes are an extension of ancient ideas of debt to society, the gods,
    or the cosmos.


    Progressive tax taxation where the tax rate increases as income increases.


    Rentier a person or institution living on profits from capital, such as property
    or investments.


    Revolution the overthrow of a given system of governance or authority, usually
    by forcible means.


    Rojava a breakaway Kurdish proto-state in northern Syria.


    Socratic eliciting truth in an argument through the practice of question and answer.


    Spanish Civil War a civil war fought in Spain between 1936 and 1939 between loyalists
    to the Second Spanish Republic and supporters of General Francisco Franco.


    Spanish Revolution a social revolution in Spain in 1936 that led to the widespread
    implementation of anarchist principles in various parts of the country during
    the Spanish Civil War.


    Syrian Civil War an ongoing civil war in Syria between the national government
    and various rebel movements.


    Union an organization of traders, workers, or laborers who join together to negotiate
    for better salaries or working conditions.


    World Bank an international organization headquartered in Geneva that provides
    loans to developing countries for capital projects.


    World Trade Organization (WTO) an intergovernmental organization headquartered
    in Washington, DC, that regulates global trade by'
