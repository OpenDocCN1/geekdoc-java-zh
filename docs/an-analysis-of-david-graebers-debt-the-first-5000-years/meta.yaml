    债务提出了一个“什么是债务？”的问题。格雷伯在书的最后一段回答道：“债务只是对承诺的歪曲。它是一个被数学和暴力共同污染的承诺。”——6


    ## 被忽视的部分


    格雷伯对原始债务*理论的讨论是他发展最不充分、最被忽视的部分。正如文化人类学家比尔·毛尔（Bill Maurer）所写的：“所有人都被[格雷伯]对原始物交换神话*的批判所吸引。然而，令人疑惑的是，他论点中的核心元素——原始债务神话在很大程度上被忽视了。”——7


    “物交换神话*”认为货币是为了解决物交换不便而自发产生的解决方案；通过测试证据可以接近这一命题的真理。“原始债务”是一个哲学思想，抵制类似的分析；格雷伯写道，我们必须参考的主要来源是写于大约公元前800年的印度印度教传统神圣文献，《婆罗门经》（Brahmanas）中有两段著名的文字强调，我们出生时不仅欠神灵债（需要通过祭祀偿还），还欠圣贤——我们必须通过学习来偿还；欠祖先——我们需要通过生育后代来偿还；最后，“欠人”显然是指全人类——需要通过向陌生人提供招待来偿还。”——8
    原始债务理论者认为这些思想“并非特定知识传统所有，而是对人类思想的本质和历史至关重要。”——9


    正如格雷伯所说，通过思考如何偿还“无限的债务”，我们背负了出生的负担，《婆罗门经》对一个道德问题提供了深刻的反思，而在之前和之后，从未有人能对此给出更好的回答。”10
    尽管格雷伯说他否认原始债务神话，但他自己的替代哲学可以被解读为支持它：“如果有人想为像我们这样的一个个人主义社会寻找伦理，他们最好说：我们都对人类、社会、自然或宇宙背负着无限的债务……但没有人能告诉我们该如何偿还……那么，人类的自由就是我们自己决定如何偿还的能力。”11


