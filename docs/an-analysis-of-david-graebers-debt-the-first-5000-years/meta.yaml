    debt,” Graeber writes, “is thus necessarily a history of money.^2 Studying the
    history of money helps us understand its true function, and gives us a way to
    consider its legitimacy as a basis for economic relations. This is an important
    element of Debt.


    **When economists speak of the origins of money, for example, debt is always something
    of an afterthought ... For almost a century, anthropologists like me have been
    pointing out that there is something very wrong with this picture. The standard
    economic-history version has little to do with anything we observe when we examine
    how economic life is actually conducted.**


    David Graeber, Debt: The First 5,000 Years


    ## Overview of the Field


    Economic history is a young discipline, recognized as such only in the twentieth
    century.^3 But the history of money has been studied as far back as ancient Greece;
    the philosopher Aristotle* concluded around 350 b.c.e. that money arose as means
    to improve the barter system:4 “placeholder” for making bargains more convenient
    for parties without mutually desired goods. The eighteenth-century Scottish thinker
    Adam Smith* supported this in his book in *The Wealth of Nations* (1776), the
    first work of modern economics.^5 In the early twentieth century it was taken
    up by economists of the Austrian School* (a school of economic thought that focuses
    on the rationality and actions of individuals as the primary forces in an economy),
    notably the Austrian economist Carl Menger.*^6 This theory of money remains dominant
    to this day, and supports the idea that money is simply an extension of humanity’s
    natural tendency, as Adam Smith called it, “truck and barter.”


    Another theory of the history of money was put first in the early twentieth century
    by the German economist Georg Friedrich Knapp,* and came to be known as chartalism.^7
    Knapp proposed that money is a “creature of law,8 a form of credit* that originated
    with states’ attempts to direct market activity. Chartalism is closely related
    to the credit theory of money,* pioneered by the British economist Alfred Mitchell-Innes,^9
    which considers money a form of credit and debt. Chartalism and the credit theory
    of money were highly influential^10 in developing today''s dominant understanding
    of an economic system, known as Keynesianism,* based on the idea that total spending
    is the most powerful force in the economy. The common understanding of the origin
    of money continues to be that it emerged as an improvement on the barter system.


    Regardless of the origin of money, most economists believe money reflects a natural
    human tendency for people to trade with each other.


    ## Academic Influences


    By disputing what he called the “Myth of Barter,” David Graeber draws on the work
    of anthropologists before him. Marcel Mauss,* a nineteenth-century French sociologist
    considered to be a pioneer in anthropology, proposed in his book *The Gift* that
    barter was not a natural or necessary method of exchange in human society.$^{11}$
    In “Barter and Economic Disintegration,” the renowned British anthropologist Caroline
    Humphrey* wrote: “No example of a barter economy, pure and simple, has ever been
    described, let alone the emergence from it of money; all available [studies of
    the world''s people] suggests that there has never been such a thing.^12”


    The British anthropologist Keith Hart* has also contributed to the field''s scholarship
    of money. In his 1986 “Heads or Tails? Two Sides of the Coin,” Hart argues that
    money has always been both a commodity (that can be created), and a token of debt.
    Graeber has stated that Hart’s essay was one of the inspirations for Debt.^13.


    Debt also draws on unorthodox theorists like the influential German political
    philosopher Karl Marx,* who in his classic book *Capital* (1867–94)$^{14}$ argued
    that capitalism uses debt to oppress people, and the Hungarian economic historian
    Karl Polanyi,*who in his book *The Great Transformation* (1944) suggested that
    markets are artificial concepts that were entirely created by the power of the
    state.$^{15}$ As a result, Debt draws on a wide variety of academic traditions.


