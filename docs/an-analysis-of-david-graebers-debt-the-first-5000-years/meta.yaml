    在左翼季刊《雅各宾》（Jacobin）上，迈克·贝格斯（Mike Beggs）写道，《债务》是“跨学科*斗争⁵中的另一个动作”。这是一个准确的描述，因为大约世纪以来，人类学和经济学的结论之间一直存在鸿沟。然而，格雷伯（Graeber）阵营与主流之外的经济学家之间存在着明显的合作空间。正如J.
    W. 梅斯森（J. W. Mason）所写的：“承认这需要一些解读，但《债务》的核心主题与凯恩斯之后的非主流经济学*的主题高度和谐。”⁶ 未来的经济学可能会纳入人类学的视角。


    # NOTES


    - 1. Noah Smith, “David Graeber: Debt Is Bad, or Something?, Noahpinion, February
    13, 2013, http://noahpinionblog.blogspot.co.uk/2013/02/david-graeber-is-bad-or-something.html.

