    # 第 8 模块

    作者作品中的地位


    ## 核心要点


    - 格雷伯（Graeber）的整体学术研究集中在更具激性的经济人类学课题上，包括平等、权力动态和革命。

    - 《债务》是格雷伯此前关于价值人类学理论工作的延伸，在这些工作中，他质疑了资本主义体系准确评估人类相互之间贡献的能力。

    - 《债务》的反资本主义性质支持了格雷伯作为一名反叛者的声誉，并为其作为无政府主义者的政治倾向提供了智力上的支持。


    ## 定位


    《债务：人类的前 5000 年》（*Debt: The First 5,000 Years*）很大基于大卫·格雷伯（David Graeber）之前的学术成果及其整个学术生涯中政治思想的发展。它也代表了格雷伯学术方向的转变：他告别了
    21 世纪大部分时期作为特征的纯人类学和民族志（对一个民族文化或社会的实地研究），转而重新审视他的第一本著作《走向价值人类学理论》（*Toward an Anthropological
    Theory of Value*, 2001）中的经济人类学。


    在许多方面，《债务》是《走向价值人类学理论》的逻辑延伸。《债务》将该书的核心论点之一——资本主义市场无法准确评估人类行为——作为其智力背景。为了支持他对债务的分析，格雷伯从他之前的人类学著作和研究中汇集了大量的证据。


    > “人类学似乎是一个对自身的潜力感到恐惧的学科。”

    大卫·格雷伯，《无政府主义人类学节选》（*Fragments of an Anarchist Anthropology*）


    ## 整合


    《债务》的主题之一是：资本主义体系利用债务作为维持不平等和剥削的机制。这根于格雷伯在马达加斯加岛的博士野外调查，在那里他亲眼目睹了巨额债务对经济和人民的负面影响。偿还国债的压力成为削社会福利和损害生活质量的道德和现实理由。后来，在
    2007 年，格雷伯还出版了《迷失的人：马达加斯加魔法与奴隶制的遗产》（*Lost People: Magic and the Legacy of Slavery
    in Madagascar*）。尽管这是一部专注于马达加斯加的纯人类学著作，但它仍然介绍了许多关于奴隶制、不平等和债务的观点，这些是《债务》中的次要主题.¹


    然而，格雷伯自身作品对《债务》最直接的影响来自他的第一本著作《走向价值人类学理论》，这本书确立了他作为一名关注经济理论问题的人类学家的地位。书的基本立场是，人以及扩展出的他们的行为是社会最重要的“产品”。²
    其隐含含义是，认为可以通过市场交换确立价值的观点完全是错误的；这正是格雷伯在《债务》中探索债务和人类经济的基础。


    ## 意义


    在《债务》出版很久以前，格雷伯就已经被认为是他这一代最伟大的人类学家之一。他在马达加斯加进行的广泛民族志工作（从他读研究生时期到出版《迷失的人》）在其领域内备受推崇³。在格雷伯的《走向价值人类学理论》和《无政府主义人类学节选》出版后，英国人类学家莫里士·布洛赫（Maurice
    Bloch）写道：“格雷伯关于人类学理论的著作是杰出的。我认为他是全球范围内他这一代最好的的人类学理论家。”⁴


    格雷伯关于权力关系、等级制度和行动主义的重要人类学写作著作，以《走向价值人类学理论》和《债务：人类的前 5000 年》为边界，将格雷伯定位为人类学家基思·哈特（Keith
    Hart）所说的“不平等社会人类学”中的先驱知识分子。⁵在他所有的作品中，《债务》获得了最多的评论赞誉，赢得了文化人类学协会颁发的贝森图书奖（Bateson
    Book Prize）和激进书商联盟颁发的面包与玫瑰奖（Bread and Roses Award）。


    ## 注释


    1. David Graeber, *Debt: The First 5,000 Years* (Brooklyn, NY: Melville House,
    2011), 4.

    2. David Graeber, *Toward an Anthropological Theory of Value: The False Coin of
    Our Own Dreams* (New York: Palgrave Macmillan, 2001).

    3. Thomas Meaney, “Anarchist Anthropology,” *The New York Times*, December 8,
    2011, http://www.nytimes.com/2011/12/11/books/review/anarchist-anthropology.html.

    4. Maurice Bloch, “Letter from Maurice Bloch, London School of Economics” (2005).

    5. Keith Hart, “In Rousseau’s Footsteps: David Graeber and the Anthropology of
    Unequal Society,” *The Memory Bank*, July 4, 2012, http://theorybank.co.uk/2012/07/04/in-rousseaus-footsteps-david-graeber-and-the-anthropology-of-unequal-society-2/.


    ## 第 3 节

    ## 影响


    # 第 9 模块


    ## 初反应


    ## 核心要点


    - 对《债务》的主要批评是：大卫·格雷伯没有充分理解经济学家内部的辩论，他过于重视经济思想的起源并将其衡量其价值的标准，而且他提出的债务减免建议是不切实际的。

    - 格雷伯及其反对者来自不同的学科（分别为人类学和经济学），这使得双方很难进行实质性的辩论。

    - 格雷伯的思想受到了非主流经济学家的广泛欢迎。


    ## 批评


    《债务：人类的前 5000 年》在出版时是一部充满争议的著作；虽然大卫·格雷伯的思想被大多数经济学家忽视了，但少数人表达了反对或支持。在选择对《债务》进行批判性参与的人中，诺亚·史密斯（Noah
    Smith）和迈克·贝格斯（Mike Beggs）提供的意见最详尽。


    史密斯是石溪大学的金融助理教授，也是一位流行的经济作家，他表示许多经济学家已经意识到信贷先于物物。他认为格雷伯在不理解观点多样性的情况下误导了公众。史密斯还认为，格雷伯针对债务债务提出的债务减免建议将导致贷款人未来不愿贷款，并奖励那些胆于大量贷款的人。


    > “5000年的轶事无法替代真正的政治经济学。”

    迈克·贝格斯，《雅各》


    贝格斯是悉尼大学的政治经济学讲师，他认为《债务》是一个“有价值的贡献”，但反对格雷伯将历史作为破坏经济理论的工具。他写道：“经济学研究的是一个系统，其组成部分的起源可能会误导对功能和动态的判断。糟糕经济学的答案是好的经济学，而不是历史。”³
    与贝格斯相反，经济学家 J. W. 梅森（J. W. Mason）声称，《债务》中与经济相关的“大思想”是合法的。他写道：“《债务》为每一个观点提供了丰富的历史材料，尽管有时理论陈述不够清晰。”⁴


    ## 回应


    格雷伯被他的许多反对者指责为接受任何批评。由于他们不是人类学家，格雷伯的批评者无法反驳他用来否定物物交换神话的人类学证据；他不是经济学家，格雷伯缺乏与迈克·贝格斯等指责他忽视债务危机建设性解决方案的经济学家交流的技术知识。结果是格雷伯和他的批评者都留在了微小的细节上争论，而不是讨论书籍本身的价值或其深远的影响。


