  \ V> c, Class<K> keyType, Class<V> valueType)\nstatic <E> Queue checkedQueue(Queue<E>\
  \ c, Class<E> elementType)\n\nstatic <E> List<E> nCopies(int n, E value)\nstatic\
  \ <E> Set<E> singleton(E value)\nstatic <E> List<E> singletonList(E value)\nstatic\
