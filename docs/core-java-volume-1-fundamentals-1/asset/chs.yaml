  \ 12.5.4 弹出菜单\n\n`pop-up menu` 是一种不附加到菜单栏而是浮动的菜单（参见图 12.20）。\n\n![Image](img/12fig20)\n\
  \n**20 弹出菜单**\n\n像创建普通菜单一样创建弹出菜单，只是弹出菜单没有标题。点击此处查看代码图片\n\n```java\nJPopupMenu popup\
  \ = new JPopupMenu();\n```\n\n然后像往常一样添加菜单项：点击此处查看代码图片\n\n```java\nJMenuItem item\
  \ = new JMenuItem(\"Cut\");\npopup.add(item);\n```\n\n由于弹出菜单不附加到菜单栏，你必须通过 `show`\
  \ 方法显示它：\n\n```java\npopup.show(parent);\n```\n\n***\n\n### javax.swing.JPopupMenu\
  \ **1.2**\n\n• `show(Component c, int x, int y)`\n显示弹出菜单。\n\n![Image](img/683tab01.jpg)\n\
  \n• `boolean isPopup(MouseEvent event)`\n如果事件是弹出触发，则返回 `true`。\n\n***\n\n***\n\n\
  ### java.awt.event.MouseEvent **1.3**\n\n• `boolean isTrigger()`\n如果它是弹出触发，则返回 `true`。\n\
  \n***\n\n***\n\n### javax.swing.JComponent **1.2**\n\n• `JPopupMenu getPopupMenu()`\n\
  • `void setPopupMenu(JPopupMenu popup)`\n获取或设置此组件的弹出菜单。\n\n• `boolean getInherPopupMenu()`\n\
  • `void setInherPopupMenu(boolean b)`\n获取或设置 `inheritsPopupMenu` 属性。\n\n#### 12.5.5\
  \ 键盘快捷键和加速键\n\n对于经验丰富的用户来说，通过键盘快捷键选择菜单项非常方便。你可以通过在菜单项构造函数中指定快捷键字母为菜单项创建键盘快捷键：点击此处查看代码图片\n\
  \n```java\nJMenuItem aboutItem = new JMenuItem(\"About\");\n```\n\n键盘快捷键会在菜单中自动显示，并带有下划线（参见图\
  \ 12.21）。例如，在最后一个示例定义的项中，标签将是带有下划线的“About”。当菜单显示时，用户只需按下 A 键即可选中该菜单项。（如果快捷键不是菜单字符串的一部分，输入它仍然可以选中项，但菜单中不会显示快捷键。显然，这种不可见的快捷键用处不疑。）\n\
  \n![Image](img/12fig21.jpg)\n\n**12.21 键盘快捷键**\n\n有时，你并不希望下划菜单项中匹配快捷键的字母。例如，如果你为“Save\
  \ As”菜单设置了快捷键“A”，那么下划第二个“A”会更合理。你可以通过调用 `setDisplayMnemonicIndex` 方法指定你想下划的字符。\n\
  \n如果你有一个 `Action` 对象，你可以为 `Action.MNEMONIC_KEY` 键添加快捷键，如下：\n\n```java\ncutAction.putValue(Action.MNEMONIC_KEY,\
  \ new Integer('A'));\n```\n\n你只能在菜单项的构造函数中提供快捷键，而不是在菜单的构造函数中。要为菜单附加快捷键，请调用 `setMnemonic`\
  \ 方法：\n\n```java\nJMenu helpMenu = new JMenu(\"Help\");\nhelpMenu.setMnemonic('H');\n\
  ```\n\n从菜单栏选择顶层菜单时，按下 Alt 键配合快捷键字母。例如，按下 Alt+H 可从菜单栏选择帮助菜单。\n\n\n\n\n\n键盘记忆键（mnemonics）允许从当前打开的菜单中选择子菜单或菜单项。相比之下，`accelerators`（加速键）是快捷键，允许你在无需打开菜单的情况下选择菜单项。例如，许多程序为“文件”菜单中的“打开”和“保存”项目绑定了加速键\
  \ `Ctrl+O` 和 `Ctrl+S`。使用 `setAccelerator` 方法可以将加速键绑定到菜单项上。`setAccelerator` 方法接收一个\
  \ `Keystroke` 类型的对象。例如，以下调用将加速键 `Ctrl+O` 绑定到 `openItem` 菜单项：\n\n```\nopenItem.setAccelerator(KeyStroke.getKeyStroke(\"\
  ctrl O\"));\n```\n\n输入加速键组合会自动选择该菜单选项并触发动作事件，就像用户手动选择了该菜单选项一样。\n\n你只能将加速键绑定到菜单项，而不能绑定到菜单。加速键实际上不会打开菜单。相反，它们会直接触发与菜单相关的动作事件。\n\
  \n从概念上讲，向菜单项添加加速键与向 Swing 组件添加加速键的技术是类似的。（我们在第 11 章中讨论过该技术。）然而，当加速键被添加到菜单项时，按键组合会自动显示在菜单中（参见图\
  \ 12.22）。\n\n![Image](img/12fig22.jpg)\n**图 12.22** 加速键\n\n### Note\n在 Windows 下，`Alt+F4`\
  \ 会关闭窗口。这不是一个要在 Java 中编写的加速键。它是操作系统定义的快捷键。无论菜单上是否有“关闭”项目，此键组合始终会触发活动窗口的 `WindowClosing`\
  \ 事件。\n\n### javax.swing.JMenuItem 1.2\n\n- `JMenuItem(String label, int mnemonic)`\n\
  构造一个具有给定标签和记忆键的菜单项。\n\n![Image](img/688tab01.jpg)\n\n- `void setAccelerator(KeyStroke\
  \ k)`\n将击键 `k` 设置为此菜单项的加速键。加速键显示在标签旁边。\n\n### javax.swing.AbstractButton 1.2\n\n\
  - `void setMnemonic(int mnemonic)`\n为按钮设置记忆键字符。该字符将在标签中带有下划线。\n\n- `void setDisplayedMnemonicIndex(int\
  \ index)` 1.4\n设置按钮文本中带有下划线的字符索引。如果你不希望第一个出现的记忆键字符带有下划线，请使用此方法。\n\n### 12.5.6 启用和禁用菜单项\n\
  \n有时，特定的菜单项应该只在某些上下文中被选择。例如，当文档以只读模式打开时，“保存”菜单项就没有意义了。当然，我们可以使用 `JMenu.remove` 方法从菜单中移除该项，但用户会对内容不断变化的菜单感到有些惊讶。相反，禁用那些通向暂时不恰命令的菜单项会更好。被禁用的菜单项显示为灰色，且无法被选择（参见图\
  \ 12.23）。\n\n![Image](img/12fig23.jpg)\n**图 12.23** 禁用的菜单项\n\n要启用或禁用菜单项，使用 `setEnabled`\
  \ 方法：\n\n```\nsaveItem.setEnabled(false);\n```\n\n启用和禁用菜单项有两种策略。每当情况发生变化时，你都可以对相关的菜单项或动作调用\
  \ `setEnabled`。例如，一旦文档被设置为只读模式，你就可以找到“保存”和“另存为”菜单项并禁用它们。或者，你可以在显示菜单之前禁用项。要做到这一点，你必须为“菜单被选中”事件注册一个监听器。`javax.swing.event`\
  \ 包定义了一个 `MenuListener` 接口，包含三个方法：\n\n```\nvoid menuSelected(MenuEvent event)\n\
  void menuDeselected(MenuEvent event)\nvoid menuCanceled(MenuEvent event)\n```\n\n\
  `menuSelected` 方法在菜单显示*之前*被调用。因此，它可以用于禁用或启用菜单项。以下代码显示了每当“只读”复选框菜单项被选中时，如何禁用“保存”和“另存为”动作：\n\
  \n```java\npublic void menuSelected(MenuEvent event)\n{\n  saveAction.setEnabled(!readonlyItem.isSelected());\n\
  \  saveAsAction.setEnabled(!readonlyItem.isSelected());\n}\n```\n\n**Caution**\n\
  显示菜单之前禁用菜单项是一个聪明的主意，但它对于带有加速键的菜单项无效。因为当按下加速键时，菜单永远不会打开，所以动作永远不会被禁用，仍然会被加速键触发。\n\n\
