  \ `PrintWriter`，用于向给定文件名的文件写入数据。\n\n`java.nio.file.Paths` 7\n\n- `static Path get(String\
  \ pathname)` 根据给定的路径名构建一个 `Path`。\n\n## 3.8 控制流\n\nJava 与任何其他编程语言一样，都支持条件语句和循环来确定控制流。我们将从条件语句开始，然后进入循环，最后以有点繁琐的\
  \ `switch` 语句结束，你可以使用它来测试单个表达式的多个值。\n\n**C++ 注意事项**：Java 的控制流结构与 C 和 C++ 中的结构相同，但有几处例外。Java\
  \ 没有 `goto`，但有一个带“标签”的 `break` 版本，你可以用它来跳出嵌套循环（在 C 中，你可能就会使用 `goto`）。最后，还有一种 `for`\
  \ 循环的变体，它在 C 或 C++ 中没有类似的等价物。它类似于 C# 中的 `foreach` 循环。\n\n### 3.8.1 块作用域\n\n在学习控制结构之前，你需要了解更多关于*块（blocks）*的知识。\n\
  \n一个块或复合语句由一组 Java 语句组成，由一对大括号包裹。块定义了变量的作用域。一个块可以*嵌套*在另一个块内部。这里有一个嵌套在 `main` 方法块内部的块：\n\
  \n```java\npublic static void main(String[] args)\n{\n    int n;\n    . ...\n  \
  \  {\n        int k;\n        // ...\n    } // k 仅定义到此处\n}\n```\n\n你不能在两个嵌套的块中声明同名的变量。例如，以下代码是错误的且无法通过编译：\n\
  \n```java\npublic static void main(String[] args)\n{\n    int n;\n    ...\n    {\n\
  \        int k;\n        int n; // 错误--不能在内部块中重新定义 n\n        ...\n    }\n}\n```\n\
  \n**C++ 注意事项**：在 C++ 中，可以在嵌套块内部重新定义变量。内部定义会遮蔽（shadows）外部定义。这可能成为编程错误的根源；因此，Java\
  \ 不允许这样做。\n\n### 3.8.2 条件语句\n\nJava 中的条件语句的形式为：\n`if (condition) statement`\n\n\
  条件必须被圆括号包裹。\n\n在 Java 中，与大多数编程语言一样，你通常希望在单个条件为真时执行多条语句。在这种情况下，使用形式如下的*块语句（block\
  \ statement）*：\n\n```java\n{\n    statement[1]\n    statement[2]\n    . ...\n}\n\
  ```\n\n例如：\n\n```java\nif (yourSales >= target)\n{\n    performance = \"Satisfactory\"\
  ;\n    bonus = 100;\n}\n```\n\n在这段代码中，当 `yourSales` 大于或等于 `target` 时，大括号包裹的所有语句都将被执行。\n\
  \n**图 3.7** `if` 语句的流程图。\n\n**注意**：块（有时称为*复合语句*）允许你在任何原本允许单个（简单）语句的 Java 编程结构中拥有多个（简单）语句。\n\
  \nJava 中更通用的条件语句形式如下：\n`if (condition) statement[1] else statement[2]`\n\n**图 3.8**\
  \ `if/else` 语句的流程图。\n\n例如：\n\n```java\nif (yourSales >= target)\n{\n    performance\
  \ = \"Satisfactory\";\n    bonus = 100 + 0.01 * (yourSales - target);\n}\nelse\n\
  {\n    performance = \"Unsatisfactory\";\n    bonus = 0;\n}\n```\n\n`else` 部分始终是可选的。`else`\
  \ 与最近的 `if` 组合。因此，在语句：\n`if (x <= 0) if (x == 0) sign = 0; else sign = -1;`\n这里的\
  \ `else` 属于第二个 `if`。为了清晰，我们可以使用大括号：\n\n```java\nif (x <= 0) { if (x == 0) sign =\
  \ 0; else sign = -1; }\n```\n\n`else if`（多分支）是很常见的。例如：\n\n```java\nif (yourSales\
  \ >= 2 * target)\n{\n    performance = \"Excellent\";\n    bonus = 1000;\n}\nelse\
  \ if (yourSales >= 1.5 * target)\n{\n    performance = \"Fine\";\n    bonus = 500;\n\
  }\nelse if (yourSales >= target)\n{\n    performance = \"Satisfactory\";\n    bonus\
  \ = 100;\n}\nelse\n{\n    System.out.println(\"You're fired\");\n    bonus = 0;\n\
  }\n```\n\n**图 3.9** `if/else if` 的流程图。\n\n### 3.8.3 循环\n\n`while` 循环在条件为 `true`\
  \ 时执行语句（这可能是一个块）。其通用形式为：\n`while (condition) statement`\n\n`while` 循环在条件为 `false`\
  \ 时将不会执行。\n\n**图 3.10** `while` 语句的流程图。\n\n`Listing 3.3` 中的程序确定了需要多久才能积累特定的金额，假设你每年存入相同的金额，且资金按指定的利率产生收益。\n\
  \n```java\nwhile (balance < goal)\n{\n    balance += payment;\n    double interest\
  \ = balance * interestRate / 100;\n    balance += interest;\n    years++;\n}\nSystem.out.println(years\
  \ + \" years.\");\n```\n\n依赖此程序来规划退休。我们省略了一些如通胀和预期寿命等细节。`while` 循环在顶部进行测试。因此，如果你想确保块至少被执行一次，你需要将测试移动到底部，使用\
  \ `do/while` 循环。它的语法如下：\n`do statement while (condition);`\n\n该循环执行语句（通常是一个块），然后才测试条件。如果为\
  \ `true`，它将重复语句并重新测试条件，依此类推。`Listing 3.4` 中的代码计算了退休账户的新余额，然后询问你是否准备好退休：\n\n```java\n\
  do\n{\n    balance += payment;\n    double interest = balance * interestRate / 100;\n\
  \    balance += interest;\n    year++;\n    // 打印当前余额\n    ...\n    // 询问是否准备好退休并获取输入\n\
  \    ...\n} while (input.equals(\"N\"));\n```\n\n只要用户回答 \"N\"，循环就会重复。这是一个至少进入一次的循环示例，因为用户需要在判断余额是否足够退休之前查看。\n\
  \n**图 3.11** `do/while` 语句的流程图。\n\n**Listing 3.3** `Retirement/Retirement.java`\n\
  \n```java\nimport java.util.*;\n\n/**\n * 此程序演示了 while 循环。\n * @version 1.20 2004-02-10\n\
  \ * @author Cay Horstmann\n */\npublic class Retirement\n{\n    public static void\
  \ main(String[] args)\n    {\n        // 读取输入\n        Scanner in = new Scanner(System.in);\n\
  \        System.out.print(\"你需要多少钱才能退休？ \");\n        double goal = in.nextDouble();\n\
  ```\n\n\n\n\n\n```java\ndouble payment = in.nextDouble();\n\nSystem.out.print(\"\
  Interest rate in %: \");\ndouble interestRate = in.nextDouble();\n\ndouble balance\
  \ = 0;\nint years = 0;\n\n// 当目标尚未达到时，更新账户余额\nwhile (balance < goal)\n{\n    //\
  \ 添加本年的付款和利息\n    balance += payment;\n    double interest = balance * interestRate\
  \ / 100;\n    balance += interest;\n    years++;\n}\n\nSystem.out.println(\"You\
  \ can retire in \" + years + \" years.\");\n```\n\n### 列表 3.4 `Retirement2/Retirement2.java`\n\
  \n点击此处查看代码图片\n\n```java\nimport java.util.*;\n\n/**\n * 此程序演示了 do/while 循环。\n *\
  \ @version 1.20 2004-02-10\n * @author Cay Horstmann\n */\npublic class Retirement2\n\
  {\n    public static void main(String[] args)\n    {\n        Scanner in = new Scanner(System.in);\n\
  \n        System.out.print(\"How much money will you contribute every year? \");\n\
  \        double payment = in.nextDouble();\n\n        System.out.print(\"Interest\
  \ rate in %: \");\n        double interestRate = in.nextDouble();\n\n        double\
  \ balance = 0;\n        int year = 0;\n\n        String input;\n\n        // 当用户尚未准备退休时，更新账户余额\n\
  \        do\n        {\n            // 添加本年的付款和利息\n            balance += payment;\n\
  \            double interest = balance * interestRate / 100;\n            balance\
  \ += interest;\n\n            year++;\n\n            // 打印当前余额\n            System.out.printf(\"\
  After year %d, your balance is %.2f%n\", year, balance);\n\n            // 询问是否准备退休并获取输入\n\
