  \ 编译器会乐意地查看其他文件，只要你告诉它去哪里查看。\n\n在 Java 中，你可以通过显式地命名所有类（如 `java.util.Date`）来完全避免\
  \ `import` 机制。在 C++ 中，你无法避免 `#include` 指令。\n\n`import` 语句唯一的优点是方便。你可以使用比完整包名短的名字来引用类。例如，在执行\
  \ `import java.util.*`（或 `import java.util.Date`）语句后，你可以直接用 `Date` 来引用 `java.util.Date`\
  \ 类。\n\n在 C++ 中，类似于包机制的构造是命名空间功能。将 Java 中的 `package` 和 `import` 语句想象成 C++ 中 `namespace`\
  \ 和 `using` 指令的类比即可。\n\n***\n\n### 4.7.2 静态导入\n\n一种 `import` 语句允许导入静态方法和字段，而不仅仅是类。\n\
  \n例如，如果你添加以下指令：\n\n点击此处查看代码图像\n\n```java\nimport static java.lang.System.*;\n```\n\
  \n将其添加到源文件的顶部，那么你就可以在不需要类名前缀的情况下使用 `System` 类的静态方法和字段：\n\n点击此处查看代码图像\n\n```java\n\
  out.println(\"Goodbye, World!\"); // 即 System.out\nexit(0); // 即 System.exit\n```\n\
  \n你也可以导入特定的方法或字段：\n\n点击此处查看代码图像\n\n```java\nimport static java.lang.System.out;\n\
  ```\n\n在实践中，许多程序员是否想要缩写 `System.out` 或 `System.exit` 令人怀疑。生成的代码看起来没那么清晰。另一方面，\n\n\
  ```java\nsqrt(pow(x, 2) + pow(y, 2))\n```\n\n似乎比以下代码清晰得多：\n\n点击此处查看代码图像\n\n```java\n\
  Math.sqrt(Math.pow(x, 2) + Math.pow(y, 2))\n```\n\n### 4.7.3 将类添加到包中\n\n要将类放在包内部，你必须将包名放在源文件的顶部，位于源代码*之前*。例如，在\
  \ 4.7 中，将类放在包中。\n\n```java\n\n在 C++ 中，你必须使用 `#include` 来包含外部特性的声明，因为 C++ 编译器除了查看正在编译的文件及其显式包含的头文件外，不会查看任何文件。Java\
  \ 编译器会乐意地查看其他文件，只要你告诉它去哪里查看。\n\n在 Java 中，你可以通过显式地命名所有类（如 `java.util.Date`）来完全避免\
  \ `import` 机制。在 C++ 中，你无法避免 `#include` 指令。\n\n`import` 语句唯一的优点是方便。你可以使用比完整包名短的名字来引用类。例如，在执行\
  \ `import java.util.*`（或 `import java.util.Date`）语句后，你可以直接用 `Date` 来引用 `java.util.Date`\
  \ 类。\n\n在 C++ 中，类似于包机制的构造是命名空间功能。将 Java 中的 `package` 和 `import` 语句想象成 C++ 中 `namespace`\
  \ 和 `using` 指令的类比即可。\n\n***\n\n要将类放在包内部，你必须将包名放在源文件的顶部，位于源代码*之前*。例如，在 4.7 中，将类放在包中。\n\
  \n```java\n\n在 C++ 中，你必须使用 `#include` 来包含外部特性的声明，因为 C++ 编译器除了查看正在编译的文件及其显式包含的头文件外，不会查看任何文件。Java\
  \ 编译器会乐意地查看其他文件，只要你告诉它去哪里查看。\n\n在 Java 中，你可以通过显式地命名所有类（如 `java.util.Date`）来完全避免\
  \ `import` 机制。在 C++ 中，你无法避免 `#include` 指令。\n\n`import` 语句唯一的优点是方便。你可以使用比完整包名短的名字来引用类。例如，在执行\
  \ `import java.util.*`（或 `import java.util.Date`）语句后，你可以直接用 `Date` 来引用 `java.util.Date`\
  \ 类。\n\n在 C++ 中，类似于包机制的构造是命名空间功能。将 Java 中的 `package` 和 `import` 语句想象成 C++ 中 `namespace`\
  \ 和 `using` 指令的类比即可。\n\n\n\n\n```java\npublic void raiseSalary(double byPercent)\n\
  {\n    double raise = salary * byPercent / 100;\n    salary += raise;\n}\n```\n\n\
  ### 4.7.4 包作用域\n\n你已经遇到过 `public` 和 `private` 访问修饰符。标记为 `public` 的特性可以被任何类使用。`private`\
  \ 特性只能由定义它的类使用。如果你既没有指定 `public`也没有指定 `private`，该特性（即类、方法或变量）可以被同一个 `package` 包中的所有方法访问。\n\
  \n考虑列表 4.2 中的程序。`Employee` 类没有被定义为 `public` 类。因此，只有与它在同一个包中（在本例中是默认包）的其他类（例如 `EmployeeTest`）才能访问它。对于类来说，这是一个合理的默认值。然而，对于变量来说，这是一个不遗憾的选择。变量必须显式地标记为\
  \ `private`，否则它们将默认为包可见。这无疑破坏了封装性。问题在于，很容易忘记输入 `private` 关键字。这里是 `java.awt` 包中 `Window`\
  \ 类的一个示例，它是 JDK 提供的源码的一部分：\n\n点击此处查看代码图像\n\n```java\npublic class Window extends\
  \ Container\n{\n   String warningString;\n   ...\n}\n```\n\n注意 `warningString` 变量并不是\
  \ `private` 的！这意味着 `java.awt` 包中所有类的方法都可以访问这个变量，并将其设置为它们喜欢的任何值（例如 `\"Trust me!\"\
  `）。实际上，访问这个变量的方法只在 `Window` 类中，因此将该变量设为 `private` 是完全合适的。我们怀疑程序员是在赶写代码时简单地忘记了 `private`\
  \ 修饰符。（为了保护这位内疚，我们不会提到该程序员的名字——你可以自己查看源文件。）\n\n![Image](img/note.jpg) 注意\n\n令人惊讶的是，尽管我们这本书的九个版本中都出了这个问题，但它从未被修复——显然库的实现者们不读《Core\
  \ Java》。不仅如此——随着时间的推移，该类增加了许多新字段，其中大约一半也不是 `private` 的。\n\n这真的是一个问题吗？这取决于情况。默认情况下，包不是封闭的实体。也就是说，任何人都可以向包中添加更多类。当然，怀有恶意的或无知的程序员随后可以添加修改具有包可见性变量的代码。例如，在\
  \ Java 的早期版本中，将另一个类溜入 `java.awt` 包是非常容易的。只需用代码开始类：\n\n```java\npackage java.awt;\n\
  ```\n\n然后，将生成的类文件存放在类路径上某处的 `java/awt` 子目录下，你就获得了对 `java.awt` 包内部的访问权限。通过这种欺骗，可以设置警告字符串（参见图\
  \ 4.9）。\n\n![Image](img/04fig09.jpg)\n\n**图 4.9** 在 applet 窗口更改更改字符串\n\n从 1.2 版本开始，JDK\
  \ 实现者通过改写类加载器，显式禁止加载包名以 `\"java.\"` 开头的自定义类。当然，你自己的类将无法从这种保护中受益。相反，你可以使用另一种机制——*包密封*（package\
  \ sealing）来解决包访问混乱的问题。如果你密封了一个包，就不能再向其添加新类。你将在第 9 章中看到如何生成包含密封包的 JAR 文件。\n\n## 4.8\
  \ 类路径\n\n正如你看到的，类存储在文件系统的子目录下。类的路径必须与包名匹配。\n\n类文件也可以存储在 JAR（Java 归档）文件中。JAR 文件包含压缩格式的多个类文件和子目录，可以节省空间并提高性能。当你程序中使用第三方库时，通常会收到一个或多个需要包含的\
  \ JAR 文件。JDK 也提供了许多 JAR 文件，例如 `jre/lib/rt.jar` 文件，它包含了数千个库类。你将在第 9 章中看到如何创建自己的 JAR\
  \ 文件。\n\n![Image](img/tip.jpg) 提示\n\nJAR 文件使用 ZIP 格式来组织文件和子目录。你可以使用任何 ZIP 工具查看 `rt.jar`\
  \ 和其他 JAR 文件的内容。\n\n要在程序之间共享类，你需要执行以下操作：\n\n**1.** 将你的类文件放在一个目录中，例如 `/home/user/classdir`。注意该目录是包树的*基*目录。如果你添加类\
  \ `com.horstmann.corejava.Employee`，那么 `Employee.class` 必须位于 `/home/user/classdir/com/horstmann/corejava`。\n\
  \n**2.** 将任何 JAR 文件放在一个目录中，例如 `/home/user/archives`。\n\n**3.** 设置*类路径*（class path）。类路径是所有可以包含类文件的位置集合。在\
  \ UNIX 中，类路径上的元素用冒号分隔：\n\n点击此处查看代码图像\n/home/user/classdir:./home/user/archives\n\
  \n在 Windows 中，它们用分号分隔：\n\n点击此处查看代码图像\nc:\\classdir;.\\archives\n\n两种情况下，点表示当前目录。此类路径包含：\n\
  \n- 目录 `/home/user/classdir`\n- 当前目录 (`.`)\n- JAR 文件 `/home/user/archives/archive.jar`\n\
  \n从 Java 6 开始，你可以为 JAR 目录指定通配符，如下：\n\n点击此处查看代码图像\n/home/user/classdir:./home/user/archives/*\n\
  \n或\n\n点击此处查看代码图像\nc:\\classdir;c:\\archives\\*\n\n在 UNIX 中，`*` 必须转义以防止 shell 扩展。代码图像\n\
  `archives` 目录中的所有 JAR 文件（但不包括 `.class` 文件）都包含在此类路径中。运行时库文件（`rt.jar` 以及 `jre/lib`\
  \ 和 `jre/lib/ext` 中的其他 JAR 文件）总是会被搜索；不需要显式包含在类路径中。\n\n![Image](img/caution.jpg)\
  \ 注意\n\n`javac` 编译器始终查找当前目录，但 `java` 虚拟机启动器只有当 `.` 位于类路径中时才会查找当前目录。如果你没有设置类路径，这不是问题——默认类路径由\
  \ `.` 目录组成。但如果你设置了类路径却忘记包含 `.` 目录，你的程序将通过编译，但无法运行。\n\n类路径列出了所有作为查找类*起点*的目录和存档文件。让我们考虑示例类路径：\n\
  \n点击此处查看代码图像\n/home/user/classdir:./home/user/archives/archive.jar\n\n假设虚拟机搜索 `com.horstmann.corejava.Employee`\
  \ 类的类文件。它首先在位于 `jre/lib` 和 `jre/lib/ext` 目录的存档系统类文件中搜索。在那里没有找到，于是转向类路径。然后它查找以下文件：\n\
  \n `/home/user/classdir/com/horstmann/corejava/Employee.class`\n- 从当前目录开始的 `com/horstmann/corejava/Employee.class`\n\
  - `/home/user/archives/archive.jar` 内部的 `com/horstmann/corejava/Employee.class`\n\
  \n编译器查找文件比虚拟机困难。如果你在不指定包的情况下引用一个类，编译器首先需要确定该类所在的包。它咨询所有的 `import` 指令作为该类的可能来源。例如，假设源文件包含以下指令：\n\
  \n点击此处查看代码图像\n```java\nimport java.util.*;\n\nimport com.horstmann.corejava.*;\n\
  ```\n\n\n\n\n源代码引用了一个名为 `Employee` 的类。编译器会尝试寻找 `java.lang.Employee`（因为 `java.lang`\
  \ 包始终会被默认导入）、`java.util.Employee`、`com.horstmann.corejava.Employee` 以及当前包中的 `Employee`。它会在类路径的所有位置中搜索这些类中的*每一个*。如果找到多个类，则会产生编译时错误。（类必须是唯一的，因此\
  \ `import` 语句的顺序并不重要。）\n\n编译器又更进了一步。它会查看*源文件*以确定源文件是否比类文件新。如果是，源文件会自动重新编译。请记住，你只能从其他包导入公共（public）类。一个源文件只能包含一个公共类，且文件名与公有类名必须匹配。因此，编译器可以轻松地定位公有类的源文件。然而，你可以从当前包导入非公共类。这些类可能定义在不同名称的源文件中。如果你从当前包导入一个类，编译器会搜索当前包的*所有*源文件，以确定哪一个定义了该类。\n\
  \n### 4.8.1 设置类路径\n\n最好使用 `-classpath`（或 `-cp`）选项来指定类路径：\n\n点击此处查看代码图像\n\n```\n\
  java -classpath /home/user/classdir:.:/home/user/archives/archive.jar MyProg\n```\n\
  \n或者\n\n点击此处查看代码图像\n\n```\njava -classpath c:\\classdir;.;c:\\archives\\archive.jar\
  \ MyProg\n```\n\n整个命令必须在一行中输入。将这样长的命令行放在 shell 脚本或批处理文件中是一个好主意。\n\n使用 `-classpath`\
  \ 选项是设置类路径的方法。另一种方法是使用 `CLASSPATH` 环境变量。具体取决于你使用的 shell。对于 Bourne Again shell (bash)，请使用命令：\n\
  \n点击此处查看代码图像\n\n```\nexport CLASSPATH=/home/user/classdir:.:/home/user/archives/archive.jar\n\
  ```\n\n对于 Windows shell，使用：\n\n点击此处查看代码图像\n\n```\nset CLASSPATH=c:\\classdir;.;c:\\\
  archives\\archive.jar\n```\n\n类路径将一直有效，直到 shell 退出。\n\n***\n\n![Image](img/caution.jpg)\
  \ 注意\n\n有些人建议永久地设置 `CLASSPATH` 环境变量。这通常是一个坏主意。人们会忘记这个全局设置，并在他们的类没有被正确加载时感到惊讶。一个特别值得指责的例子是\
  \ Apple 在 Windows  QuickTime 安装器。多年来，它全局设置了 `CLASSPATH` 指向它需要的 JAR 文件，但没有将当前目录包含在类路径中。结果导致无数\
  \ Java 程序员在程序编译成功但无法运行时感到抓狂意乱。\n\n***\n\n***\n\n![Image](img/caution.jpg) 注意\n\n\
  有些人建议完全跳过类路径，通过将所有 JAR 文件丢进 `jre/lib/ext` 目录。这确实是糟糕的建议，原因有两个。手动加载其他类的归档在放置于扩展目录时运行时无法正常工作。（有关类加载器的更多信息，请参阅第二卷第\
  \ 9 章。）此外，程序员往往会忘记他们几个月前放置在那里的文件。然后，当类加载器似乎忽略了他们精心设计的类路径时，他们就直了挠头，因为实际上正在从扩展目录加载被遗忘已久的类。\n\
  \n***\n\n## 4.9 文档注释\n\nJDK 包含一个非常有用的工具，称为 `javadoc`，它可以从你的源文件生成 HTML 文档。事实上，我们在第\
  \ 3 章中描述的在线 API 文档仅仅是在标准 Java 库源码上运行 `javadoc` 的结果。\n\n如果你在源代码中添加了以特殊分隔符 `/**` 开头的注释，你也可以轻松地生成看起来专业的文档。这是一个非常好的方法，因为它让你可以将代码和文档维护在同一个地方。如果你将文档放在单独的文件中，那么正如你可能知道的，代码和注释会随着时间的推移而分离。当文档注释与源代码位于同一个文件中时，更新两者并再次运行\
  \ `javadoc` 是一件易事。\n\n### 4.9.1 注释插入\n\n`javadoc` 工具提取以下项目的信息：\n\n• 包 (Packages)\n\
  • 公有类和接口\n• 公有和保护的字段\n• 公有和保护的构造函数和方法\n\n保护的特性在第 5 章中引入，接口在第 6 章中。\n\n你可以（并且应该）为这些特性每一个提供注释。每个注释都放置在其所描述的特性*上方*。注释以\
  \ `/**` 开头并以 `*/` 结束。\n\n每个 `/** . . . */` 文档注释包含*自由格式文本*后面跟着*标签*。标签以 `@` 开头，例如\
  \ `@author` 或 `@param`。\n\n自由格式文本的*第一句子*应该是一个*摘要语句*。`javadoc` 工具会自动生成提取这些句子的摘要页面。\n\
  \n在自由格式文本中，你可以使用 HTML 标记如 `em` 用于强调，`strong` 用于加粗，甚至使用 `img` 来包含图片。你应该避免 `h1` 或\
  \ `hr`，因为它们会干扰文档的格式。对于等宽字体，使用 `{@code ...}` 而不是 `<code>...</code>`。\n\n***\n\n![Image](img/caution.jpg)\
  \ 注意\n\n如果你的注释包含指向其他文件的链接（例如界面组件的图像），将这些文件放在源文件的子目录下，命名为 `doc-files`。`javadoc` 工具会将\
  \ `doc-files` 目录的内容复制到文档目录。你需要 `doc-files/uml.png`。\n\n***\n\n### 4.9.2 类注释\n\n\
  类注释必须放在任何 `import` 语句之后，紧接 `class` 定义之前。\n\n这是一个类注释的示例：\n\n点击此处查看代码图像\n\n```\n/**\n\
  \ * {@code Card} 对象代表一张扑克牌，\n * 如“红桃 Q”。牌有一个花色（方块、红、梅花或黑桃）和一个值（1 = A，2 . . 10,11\
  \ = J，\n * 12 = Q，13 = K）。\n */\npublic class Card\n{\n ...\n}\n```\n\n***\n\n![Image](img/note.jpg)\
  \ 注意\n\n不需要在每一行前面添加 `*`。例如，下面的注释也是同样有效的：\n\n点击此处查看代码图像\n\n```\n/**\nCard 对象代表一张扑克牌，如\n\
  “红桃 Q”。牌有一个花色（方块、红、梅花或黑桃）和一个值（1 = A，2 . . 10,11 = J，\n12 = Q，13 = K）。\n*/\n```\n\
  \n然而，大多数 IDE 会自动提供星号并在换行符变化时重新排列它们。\n\n***\n\n### 4.9.3 方法注释\n\n每个方法注释必须紧接在其所描述的方法之前。除了通用标签外，你还可以使用以下标签：\n\
  \n• `@param` *变量描述*\n\n该标签会在当前方法的“参数”部分添加条目。描述可以跨行并可以使用 HTML 标记。一个方法的所有 `@param`\
  \ 标签必须保持在一起。\n\n• `@return` *描述*\n\n该标签为当前方法添加一个“返回值”部分。描述可以跨行并可以使用 HTML 标记。\n\n\
  • `@throws` *类描述*\n\n该标签添加关于此方法可能会抛出异常的说明。异常是第 10 章的主题。\n\n\n\n\n\n这是一个方法注释的示例：\n\
  \n点击此处查看代码图片\n\n```java\n    /**\n    * 提高员工的工资。\n    * @param byPercent 提高工资的百分比（例如，10\
  \ 表示 10%）\n    * @return 增加的金额\n    */\n  public double raiseSalary(double byPercent)\n\
  \  {\n      double raise = salary * byPercent / 100;\n      salary += raise;\n \
  \     return raise;\n  }\n```\n\n### 4.9.4 字段注释\n\n你只需要对公共字段进行注释——这通常意味着静态常量。例如：\n\
  \n点击此处查看代码图片\n\n```java\n/**\n * “红心”牌花组\n */\npublic static final int HEARTS =\
  \ 1;\n```\n\n### 4.9.5 通用注释\n\n以下标签可以用于类文档注释：\n\n• `@author` `name`\n\n此标签会创建一个“作者”条目。你可以有多个\
  \ `@author` 标签，每个标签对应一个作者。\n\n• `@version` `text`\n\n此标签会创建一个“版本”条目。`text` 可以是对当前版本的任何描述。\n\
  \n以下标签可以用于所有的文档注释：\n\n• `@since` `text`\n\n此标签会创建一个“自”条目。`text` 可以是对引入该特性的版本的任何描述。例如：`@since\
  \ version 1.7.1`\n\n• `@deprecated` `text`\n\n此标签会添加一条注释，说明该类、方法或变量不应再使用。`text`\
  \ 应该建议一个替代方案。例如：\n\n点击此处查看代码图片\n\n```java\n@deprecated 请使用 <code>setVisible(true)</code>\
  \ 代替\n```\n\n你可以使用 `@see` 和 `@link` 标签创建指向 `javadoc` 文档的其他相关部分或外部文档的链接。\n\n• `@see`\
  \ `reference`\n\n此标签在“另另”（see also）部分添加一个超链接。它可以同时用于类和方法。在这里，`reference` 可以是以下内容之一：\n\
  \n`package.class#feature label`\n\n`<a href=\"...\">label</a>`\n\n`\"text\"`\n\n\
  第一种情况是最用的。你提供类、方法或变量的，`javadoc` 会插入一个指向该文档的链接。例如：\n\n点击此处查看代码图片\n\n```java\n@see\
  \ com.horstmann.corejava.Employee#raiseSalary(double)\n```\n\n这将指向 `com.horstmann.corejava.Employee`\
  \ 类中 `raiseSalary(double)` 方法的链接。你可以省略包名，或者同时省略包名和类名。这样，特性将在当前包或类中查找。\n\n注意，你必须使用\
  \ `#` 而不是 `.` 来分隔类与方法或变量名。Java 编译器本身非常擅于猜测 `.` 作为包、子包、类、内部类以及方法和变量之间分隔符的各种含义。但 `javadoc`\
  \ 实用程序并不聪明，所以你必须帮助它。\n\n如果 `@see` 标签后面跟着 `<` 字符，那么你需要指定一个超链接。你可以链接到你喜欢的任何 URL。例如：\n\
  \n点击此处查看代码图片\n\n```java\n@see <a href=\"www.horstmann.com/corejava.html\">The Core\
  \ Java home page</a></a>\n```\n\n在这些每种情况下，你都可以指定一个可选的 `label` 作为链接的锚点。如果你省略了标签，用户将看到目标代码名或\
  \ URL 作为锚点。\n\n如果 `@see` 标签后面跟着 `\"` 字符，则该文本将显示在“另另”部分。例如：\n\n```java\n@see \"Core\
  \ Java 2 volume 2\"\n```\n\n你可以为一个特性添加多个 `@see` 标签，但必须将它们保持在一起。\n\n• 如果你愿意，可以在任何文档注释的任何位置放置指向其他类或方法的链接。在注释的任何位置插入格式如下的特殊标签\n\
  \n点击此处查看代码图片\n\n```java\n{@link package.class#feature label}\n```\n\n特性的描述遵循与 `@see`\
  \ 标签相同的规则。\n\n### 4.9.6 包注释和概述注释\n\n将类、方法和变量注释直接放入 Java 源文件中，并用 `/** . . . */` 文档注释分隔。然而，要生成\
  \ `package` 注释，你需要在每个包目录中添加一个单独的文件。你有两个选择：\n\n1. 提供一个名为 `package.html` 的 HTML 文件。`<body>...</body>`\
  \ 标签之间的所有文本会被提取。\n\n2. 提供一个名为 `package-info.java` 的 Java 文件。该文件必须包含一个用 `/**` 和 `*/`\
  \ 分隔的初始 Javadoc 注释，随后是一个 `package` 语句。不要包含进一步的代码或注释。\n\n你还可以为所有源文件提供一个概述注释。将其放在名为\
  \ `overview.html` 的文件中，位于包含所有源文件的父目录中。`<body>...</body>` 标签之间的所有文本会被提取。当用户从导航栏选择“概述”（Overview）时，将显示此注释。\n\
  \n### 4.9.7 注释提取\n\n在这里，`docDirectory` 是你希望存放 HTML 文件的目录名称。按照以下步骤操作：\n\n1. 切换到包含要文档源文件的目录。如果你有需要文档的嵌套包（例如\
  \ `com.horstmann.corejava`），你必须在包含子目录 `com` 的目录中运行。（如果你提供了 `overview.html` 文件，它就在该目录。）\n\
  \n2. 运行命令\n\n点击此处查看代码图片\n\n```bash\njavadoc -d docDirectory nameOfPackage\n```\n\
  \n针对单个包。或者，运行\n\n点击此处查看代码图片\n\n```bash\njavadoc -d docDirectory nameOfPackage nameOfPackage\n\
  ```\n\n来记录多个包。如果你省略了 `-d docDirectory` 选项，HTML 文件将提取到当前目录。那可能会变得混乱，我们不建议这样做。\n\n\
  `javadoc` 程序可以通过许多命令行选项进行微调。例如，你可以使用 `-author` 和 `-version` 选项在文档中包含 `@author` 和\
  \ `@version` 标签。（默认情况下它们会被省略。）另一个有用的选项是 `-link`，用于链接到标准类。例如，如果你使用\n\n```bash\njavadoc\
  \ -link http://docs.oracle.com/javase/8/api *.java\n```\n\n所有标准类都会自动链接到 Oracle 网站。\n\
  \n如果你使用 `-linksource` 选项，每个源文件将转换为 HTML（没有彩色，但有行号），每个类和方法名将变成链接。\n\n关于更多选项，请参考 `javadoc`\
  \ 实用程序的在线文档：[`docs.oracle.com/javase/8/docs/technotes/guides/javadoc/`](http://docs.oracle.com/javase/8/docs/technotes/guides/javadoc/)。\n\
  \n![图片](img/note.jpg) 注意如果你需要进一步的自定义——例如生成其他 HTML 格式的文档——你可以提供自己的 `doclet` 以生成所需的任何形式的输出。显然，这是一种特殊需求；关于\
  \ doclet，请参考在线文档：[`docs.oracle.com/javase/8/docs/technotes/guides/javadoc/doclet/overview.html`](http://docs.oracle.com/javase/8/docs/technotes/guides/javadoc/doclet/overview.html)。\n\
  \n## 4.10 类设计提示\n\n在不尝试详尽或乏味的情况下，我们希望在本章结束时提供一些提示，使你的类在良好的 OOP 圈中更易接受。\n\n1. *始终保持数据私有。*\n\
  \n\n\n\n这是首要任务；执行任何其他操作都会违反封装性。你可能偶尔需要编写一个访问器（accessor）或修改器（mutator）方法，但将实例字段保持为私有仍然更好。惨痛的经验表明，数据表示可能会改变，但这些数据的使用方式变化频率要低得多。当数据保持为私有时，其表示形式的变化不会影响类的使用者，而且\
  \ Bug 更容易被检测。\n\n### 2. 始终初始化数据。\n\nJava 不会替你初始化局部变量，但它会初始化对象的实例字段。不要依赖默认值，而要显式地初始化所有变量，要么通过提供默认值，要么在所有构造函数中设置默认值。\n\
  \n### 3. 不要在一个类中使用过多的基本类型。\n\n其核心思想是用其他类来替换对基本类型的多次*相关*重复使用。这能让你的类更易于理解和修改。例如，将\
  \ `Customer` 类中的以下实例字段：\n\n```java\nprivate String street;\nprivate String city;\n\
  private String state;\nprivate int zip;\n```\n\n替换为一个名为 `Address` 的新类。这样，你就可以轻松应对地址的变化，例如处理国际地址的需求。\n\
  \n### 4. 并非所有字段都需要单独的字段访问器和修改器。\n\n你可能需要获取和设置员工的工资。但你显然不需要在对象构造后更改入职日期。而且，对象通常拥有你不希望让其他人获取或设置的实例字段，例如\
  \ `Address` 类中用于表示州缩短的数组。\n\n### 5. 拆分职责过多的类。\n\n这个提示显然是模糊的：“过多”显然是一个主人眼中不同（见仁而异）。然而，如果存在明显的方法，可以将一个复杂的类拆分为两个在概念上更简单的类，请务必抓住这个机会。（另一方面，也不要过头；十个每个只有一个方法的类通常是设计过度（overkill）。）\n\
  \n这里有一个糟糕设计的示例：\n\n点击此处查看代码图像\n\n```java\npublic class CardDeck // 糟糕的设计\n{\n  \
  \ private int[] value;\n   private int[] suit;\n   public CardDeck() { . . . }\n\
  \   public void shuffle() { . . . }\n   public int getTopValue() { . . . }\n   public\
  \ int getTopSuit() { . . . }\n   public void draw() { . . . }\n}\n```\n\n这个类实际上实现了两个独立的概念：带有\
  \ `shuffle` 和 `draw` 方法的*扑牌*（deck of cards），以及一个带有检查数值和花色的方法的*牌*（card）。引入一个代表单个牌的\
  \ `Card` 类是有意义的。现在你有两个类，每个类都有自己的职责：\n\n点击此处查看代码图像\n\n```java\npublic class CardDeck\n\
  {\n   private Card[] cards;\n   public CardDeck() { . . . }\n   public void shuffle()\
  \ { . . . }\n   public Card getTop() { . . . }\n   public void draw() { . . . }\n\
  }\n\npublic class Card\n{\n   private int value;\n   private int suit;\n   public\
  \ Card(int aValue, int aSuit) { . . . }\n   public int getValue() { . . . }\n  \
  \ public int getSuit() { . . . }\n}\n```\n\n### 6. 使你的类和方法的名称反映它们的职责。\n\n正如变量应该具有反映其所代表含义的有意义名称一样，类也是如此。（标准库确实包含一些令人存疑的例子，例如描述时间的\
  \ `Date` 类。）\n\n一个良好的约定是，类名应该是名词（`Order`），或者由形容词修饰的名词（`RushOrder`）或动名词（以“-ing”结尾的词，如\
  \ `BillingAddress`）。至于方法，遵循标准约定：访问器方法以小写 `get` (getSalary) 开头，修改器方法使用小写 `set` (setSalary)。\n\
  \n### 7. 优先使用不可变类\n\n`LocalDate` 类以及 `java.time` 包中的其他类都是不可变的——没有方法可以修改对象的状态。与其修改对象，像\
  \ `plusDays` 这样的方法会返回带有修改后状态的新对象。\n\n修改的问题在于，当多个线程尝试同时更新一个对象时，变异可能会并发发生。结果是不可预测的。当类是不可变的，在多个线程之间共享它们的对象是安全的。\n\
  \n因此，在可能的情况下，将类设为不可变是一个好主意。对于表示值的类（如字符串或时间点），这尤为容易。计算可以简单地产生新值，而不是更新现有值。\n\n当然，并非所有类都应该是不可变的。当员工加薪时，让\
  \ `raiseSalary` 方法返回一个新的 `Employee` 对象将很奇怪。\n\n在本章中，我们涵盖了对象和类的基础知识，这些知识使 Java 成为一种“基于对象的”语言。为了\
  \ true 实现真正的面向对象，编程语言还必须支持继承和多态。Java 对这些特性的支持是下一章的主题。\n\n# 第 5 章：继承\n\n* *\n\n本章内容\n\
  \n• 5.1 类、父类和子类\n• 5.2 `Object`: 父类\n• 5.3 Generic 型数组\n• 5.4 对象包装类和自动箱\n• 5.5 变长参数方法\n\
  • 5.6 枚举类\n• 5.7 反射\n• 5.8 继承的设计提示\n\n* *\n\n第 4 章介绍了类和对象。在本章中，你将学习*继承,*这是另一个面向对象编程的核心概念。继承的思想是你可以基于现有类创建新类。当你继承一个现有类时，你可以重用（继承）它的方法，并添加新的方法和字段以适应需求。这种技术在\
  \ Java 编程中至关重要。\n\n本章还涵盖了*反射,*在运行时获取类及其属性的能力。反射是一项强大的功能，但无疑很复杂。由于工具开发者对反射比应用程序程序员更感兴趣，初次阅读时可以跳过该部分。\n\
  \n\n\n\n以下是如何定义一个继承自 `Employee` 类的 `Manager` 类。使用 Java 关键字 `extends` 来表示继承。\n\n\
  点击此处查看代码图片\n\n```java\npublic class Manager extends Employee\n{\n   added methods\
  \ and fields\n}\n```\n\n* * *\n\n![Image](img/note1.jpg) C++ 笔记\n\n继承在 Java 和 C++\
  \ 中非常相似。Java 使用 `extends` 关键字而不是 `:` 符号。Java 中的所有继承都是公共继承；没有类似于 C++ 中私有继承和保护继承的对应特性。\n\
  \n* * *\n\n关键字 `extends` 表示你正在创建一个派生自现有类的新类。现有类被称为超类（`superclass`）、基类（`base class`）或父类（`parent\
  \ class`）。新类被称为子类（`subclass`）、派生类（`derived class`）或子类（`child class`）。虽然 class 和\
  \ subclass 是 Java 程序员最常用的术语，尽管有些程序员更倾向于使用父/子类的比喻，这与“继承”主题也契合得很好。\n\n`Employee` 类是一个超类，但并不是因为它优于其子类或包含更多的功能。*事实上，事实恰恰相反：*\
  \ 子类比其超类具有更多*的功能。例如，正如我们在回顾 `Manager` 类其余代码时将看到的，`Manager` 类封装了更多数据，拥的功能也比其超类 `Employee`\
  \ 多。\n\n* * *\n\n![Image](img/note.jpg) 笔记\n\n前缀 `super` 和 `sub` 源于理论计算机科学和数学中的集合语言。所有员工的集合包含了所有经理的集合，因此被说是经理集合的超集（`superset`）。或者，换句话说，所有经理的集合是所有员工集合的子集（`subset`）。\n\
  \n* * *\n\n我们的 `Manager` 类有一个新字段来存储奖金，并有一个新方法来设置它：\n\n点击此处查看代码图片\n\n```java\npublic\
  \ class Manager extends Employee\n{\n   private double bonus;\n   ...\n   public\
  \ void setBonus(double bonus)\n   {\n      this.bonus = bonus;\n   }\n}\n```\n\n\
  这些方法和字段并没有特殊之处。如果你有一个 `Manager` 对象，你可以直接应用 `setBonus` 方法。\n\n```java\nManager boss\
  \ = . . .;\nboss.setBonus(5000);\n```\n\n当然，如果你有一个 `Employee` 对象，你就无法应用 `setBonus`\
  \ 方法——它没有在 `Employee` 类定义的方法中。\n\n然而，你*可以*对 `Manager` 对象使用诸如 `getName` 和 `getHireDay`\
  \ 等方法。尽管这些方法没有在 `Manager` 类中显式定义，但它们自动继承自 `Employee` 超类。\n\n同样，字段 `name`、`salary`\
  \ 和 `hireDay` 是取自超类的。每个 `Manager` 对象都有四个字段：`name`、`salary`、`hireDay` 和 `bonus`。\n\
  \n在通过扩展超类来定义子类时，你只需要指示子类与超类之间的*差异*。在设计类时，将最通用的方法放在超类中，将更专门的方法放在其子类中。通过将公共功能移动到超类来提取它们是面向对象编程中的常见做法。\n\
  \n### 5.1.2 方法重写\n\n超类中的某些方法并不适用于 `Manager` 子类。特别是，`getSalary` 方法应该返回基本工资和奖金之和。你需要提供新方法来*重写*超类方法：\n\
  \n点击此处查看代码图片\n\n```java\npublic class Manager extends Employee\n{\n   ...\n   public\
  \ double getSalary()\n   {\n      ...\n   }\n   ...\n}\n```\n\n你如何实现这个方法呢？乍看之下，似乎很简单——只需返回\
  \ `salary` 字段和 `bonus` 字段之和：\n\n点击此处查看代码图片\n\n```java\npublic double getSalary()\n\
  {\n   return salary + bonus; // 将不起作用\n}\n```\n\n然而，行是不通的。记住，只有 `Employee` 方法可以直接访问\
  \ `Employee` 类的私有字段。这意味着 `Manager` 类的 `getSalary` 方法无法直接访问 `salary` 字段。如果 `Manager`\
  \ 方法想要访问那些私有字段，它们必须像其他所有方法所做的那样——使用公共接口，在这种情况下使用 `Employee` 类的公共 `getSalary` 方法。\n\
  \n所以，让我们再次尝试。你需要调用 `getSalary` 而不是简单地访问 `salary` 字段：\n\n点击此处查看代码图片\n\n```java\n\
  public double getSalary()\n{\n   double baseSalary = getSalary(); // 仍然不起作用\n  \
  \ return baseSalary + bonus;\n}\n```\n\n问题在于对 `getSalary` 的调用只是调用了*它自己*，导致程序崩溃。我们需要指示我们想要调用\
  \ `Employee` 超类，而不是当前类。你使用特殊的关键字 `super` 来实现。这里是 `getSalary` 的正确版本：\n\n点击此处查看代码图片\n\
  \n```java\npublic double getSalary()\n{\n   double baseSalary = super.getSalary();\n\
  \   return baseSalary + bonus;\n}\n```\n\n### 5.1.3 子类构造函数\n\n为了完成我们的示例，让我们提供一个构造函数。\n\
  \n点击此处查看代码图片\n\n```java\npublic Manager(String name, double salary, int year, int\
  \ month, int day)\n{\n   super(name, salary, year, month, day);\n   bonus = 0;\n\
  }\n```\n\n在这里，关键字 `super` 具有不同的含义。指令 `super(n, s, year, month, day);` 是“调用带有 `n`,\
  \ `s`, `year`, `month` 和 `day` 参数的 `Employee` 超类构造函数”的简写。\n\n由于 `Manager` 构造函数无法访问\
  \ `Employee` 类的私有字段，它必须通过构造函数来初始化它们。使用特殊的 `super` 语法调用构造函数。`super` 调用必须是子类构造函数的第一个语句。如果子类构造函数没有显式调用超类构造函数，则调用超类的无参数构造函数。如果超类没有无参数构造函数且子类构造函数没有显式调用另一个超类构造函数，Java\
  \ 编译器将报告错误。\n\n\n\n\n\n请记住 `this` 关键字有两个含义：表示对隐式参数的引用，以及调用同一类的另一个构造函数。同样，`super`\
  \ 关键字有两个含义：调用父类方法和调用父类构造函数。当用于调用构造函数时，`this` 和 `super` 关键字紧密相关。构造函数的调用只能作为另一个构造函数的第一个语句出现。构造函数参数要么传递给同一类的另一个构造函数（`this`），要么传递给父类的构造函数（`super`）。\n\
  \n***\n\n![Image](img/note1.jpg) C++ 注意\n\n在 C++ 构造中，你不调用 `super`，而是使用初始化列表语法来构造父类。`Manager`\
  \ 构造函数在 C++ 中如下：\n\n点击此处查看图像\n\n```cpp\nManager::Manager(String name, double salary,\
  \ int year, int month, int day) // C++\n: Employee(name, salary, year, month, day)\n\
  {\n    bonus = 0;\n}\n```\n\n***\n\n当你对 `Manager` 对象重定义 `getSalary` 方法后，经理的工资将*自动*加上奖金。\n\
  \n这里是该功能的运行示例。我们创建了一个新经理并设置了经理的奖金：\n\n点击此处查看图像\n\n```java\nManager boss = new Manager(\"\
  Carl Cracker\", 80000, 1987, 12, 15);\nboss.setBonus(5000);\n```\n\n我们创建了一个包含三个员工的数组：\n\
  \n点击此处查看图像\n\n```java\nEmployee[] staff = new Employee[3];\n```\n\n我们向数组中填充了经理经理和员工：\n\
  \n点击此处查看图像\n\n```java\nstaff[0] = boss;\nstaff[1] = new Employee(\"Harry Hacker\"\
  , 50000, 1989, 10, 1);\nstaff[2] = new Employee(\"Tony Tester\", 40000, 1990, 3,\
  \ 15);\n```\n\n我们打印出每个人的工资：\n\n点击此处查看图像\n\n```java\nfor (Employee e : staff)\n \
  \   System.out.println(e.getName() + \" \" + e.getSalary());\n```\n\n此循环打印出以下数据：\n\
  Carl Cracker 85000.0\nHarry Hacker 50000.0\nTommy Tester 40000.0\n\n现在 `staff[1]`\
  \ 和 `staff[2]` 分别打印它们的基本工资，因为它们是 `Employee` 对象。然而，`staff[0]` 是一个 `Manager` 对象，其\
  \ `getSalary` 方法在基本工资基础上增加了奖金。\n\n非常奇，调用\n\n`e.getSalary()` 选出了*正确*的 `getSalary`\
  \ 方法。注意，`e` 的*声明*类型是 `Employee`，但 `e` 所引用对象的*实际*类型可以是 `Employee` 或 `Manager`。\n\n\
  当 `e` 指向一个 `Employee` 对象时，调用 `e.getSalary()` 调用的是 `Employee` 类的 `getSalary` 方法。然而，当\
  \ `e` 指向一个 `Manager` 对象时，调用的是 `Manager` 类的 `getSalary` 方法。虚拟机知道 `e` 所引用对象的实际类型，因此可以调用正确的方法。\n\
  \n对象变量（如变量 `e`）可以引用多个实际类型这一事实被称为*多态*。在运行时自动选择合适的方法被称为*动态绑定*。我们将在本章中详细讨论这两个主题。\n\n\
  ***\n\n![Image](img/note1.jpg) C++ 注意\n\n在 C++ 中，如果你想实现动态绑定，需要将成员函数声明为 `virtual`。在\
  \ Java 中，动态绑定是默认行为；如果你*不*希望某个方法是虚拟的，可以将其标记为 `final`。（我们将在本章稍后讨论 `final` 关键字）。\n\n\
  ***\n\n列表 5.1 包含一个程序，显示了 `Employee` (列表 5.2) 和 `Manager` (列表 5.3) 对象工资计算的差异。\n\n\
  **列表 5.1** `inheritance/ManagerTest.java`\n\n点击此处查看图像\n\n***\n\n```java\n1   package\
  \ inheritance;\n2\n3   /**\n4    * 此程序演示了继承。\n5    * @version 1.21 2004-02-21\n\
  6    * @author Cay Horstmann\n7    */\n8   public class ManagerTest\n9   {\n10 \
  \     public static main(String[] args)\n11      {\n12          // 创建一个 Manager\
  \ 对象\n13          Manager boss = new Manager(\"Carl Cracker\", 80000, 1987, 12,\
  \ 15);\n14          boss.setBonus(5000);\n15\n16          Employee[] staff = new\
  \ Employee[3];\n17\n18          // 向数组填充经理和员工\n19          staff[0] = boss;\n20\
  \          staff[1] = new Employee(\"Harry Hacker\", 50000, 1989, 10, 1);\n21  \
  \        staff[2] = new Employee(\"Tony Tester\", 40000, 1990, 3, 15);\n22\n23 \
  \         // 打印所有员工对象\n24          for (Employee e : staff)\n25              System.out.println(\"\
  name=\" + e.getName() + \",salary=\" + e.getSalary());\n26      }\n27  }\n```\n\n\
  ***\n\n**列表 5.2** `inheritance/Employee.java`\n\n点击此处查看图像\n\n***\n\n```java\n1 \
  \  package inheritance;\n2\n3   import java.time.*;\n4\n5   public class Employee\n\
  6   {\n7      private String name;\n8      private double salary;\n9      private\
  \ LocalDate hireDay;\n10\n11      public Employee(String name, double salary, int\
  \ year, int month, int day)\n12      {\n13          this.name = name;\n14      \
  \    this.salary = salary;\n15          hireDay = LocalDate.of(year, month, day);\n\
  16      }\n17\n18      public String getName()\n19      {\n20          return name;\n\
  21      }\n22\n23      public double getSalary()\n24      {\n25          return\
  \ salary;\n26      }\n27\n28      public LocalDate getHireDay()\n29      {\n30 \
  \         return hireDay;\n31      }\n32\n33      public void raiseSalary(double\
  \ byPercent)\n34      {\n35          double raise = salary * byPercent / 100;\n\
  36          salary += raise;\n37      }\n38  }\n```\n\n***\n\n**列表 5.3** `inheritance/Manager.java`\n\
  \n点击此处查看图像\n\n***\n\n```java\n1   package inheritance;\n2\n3   public class Manager\
  \ extends Employee\n4   {\n5      private double bonus;\n6\n7      /**\n8      \
  \ * @param name 姓名\n9       * @param salary 工资\n10      * @param year 入职年\n11  \
  \    * @param month 入职月\n12      * @param day 入职日\n13      */\n14      public Manager(String\
  \ name, double salary, int year, int month, int day)\n15      {\n16          super(name,\
  \ salary, year, month, day);\n17          bonus = 0;\n18      }\n19\n20      public\
  \ double getSalary()\n21      {\n22          double baseSalary = super.getSalary();\n\
  23          return baseSalary + bonus;\n24      }\n25\n26      public void setBonus(double\
  \ b)\n27      {\n28          bonus = b;\n29      }\n30  }\n```\n\n\n\n\n\n简单的规则可以帮助你判断继承是否是你数据的正确设计。“包含于”（is–a）规则规定，子类的每个对象都是父类的对象。例如，每位经理都是员工。因此，让\
  \ `Manager` 类成为 `Employee` 类的子类是有意义的。自然地，反过来不成立——并不是每个员工都是经理。\n\n制定“包含于”规则的另一种方法是`替换原则`（substitution\
  \ principle）。该原则规定，当程序期望父类对象时，你可以使用子类对象。\n\n例如，你可以将子类对象赋值给父类变量。\n\n点击此处查看代码图片\n\n\
  ```\nEmployee e;\n\ne = new Employee(. . .);  // 期望 Employee 对象\n\ne = new Manager(.\
  \ . .); // OK, 也可以使用 Manager\n```\n\n在 Java 编程语言中，对象变量是`多态的`（polymorphic）。`Employee`\
  \ 类型的变量可以指向 `Employee` 类型的对象，也可以指向 `Employee` 类任何子类的对象（例如 `Manager`、`Executive`、`Secretary`\
  \ 等）。\n\n我们在 Listing 5.1 中利用了这一原则：\n\n点击此处查看代码图片\n\n```\nManager boss = new Manager(.\
  \ . .);\n\nEmployee[] staff = new Employee[3];\n\nstaff[0] = boss;\n```\n\n在这种情况下，变量\
  \ `staff[0]` 和 `boss` 指向同一个对象。然而，编译器认为 `staff[0]` 仅仅是一个 `Employee` 对象。\n\n这意味着你可以调用：\n\
  \n```\nboss.setBonus(5000); // OK\n```\n\n但你不能调用：\n\n点击此处查看代码图片\n\n```\nstaff[0].setBonus(5000);\
  \ // 错误\n```\n\n`staff[0]` 的声明类型是 `Employee`，而 `setBonus` 方法并不是 `Employee` 类的方法。\n\
  \n然而，你不能将父类引用赋值给子类变量。例如，执行如下赋值是不允许：\n\n点击此处查看代码图片\n\n```\nManager m = staff[i];\
  \ // 错误\n```\n\n原因很清楚：并不是所有员工都是经理。如果此赋值成功且 `m` 指向一个不是经理的 `Employee` 对象，那么将来就可以调用\
  \ `m.setBonus(...)`，并会导致运行时错误。\n\n***\n\n![Image](img/caution.jpg) 注意\n\n在 Java\
  \ 中，子类引用数组可以无需经过强制转换就转换为父类引用数组。例如，考虑这个经理的数组：\n\n点击此处查看代码图片\n\n```\nManager[] managers\
  \ = new Manager[10];\n```\n\n将此数组转换为 `Employee[]` 数组是合法的：\n\n点击此处查看代码图片\n\n```\n\
  Employee[] staff = managers; // OK\n```\n\n当然了，“为什么不呢，”你可能会想。毕竟，如果 `managers[i]`\
  \ 是一个 `Manager`，它也是一个 `Employee`。但实际上，正在发生着令人惊讶的事情。请记住，`managers` 和 `staff` 是指向同一个数组的引用。现在考虑以下语句：\n\
  \n点击此处查看代码图片\n\n```\nstaff[0] = new Employee(\"Harry Hacker\", ...);\n```\n\n编译器会乐快地允许这次赋值。但\
  \ `staff[0]` 和 `managers[0]` 是同一个引用，所以看起来我们成功地将一个普通的员工“偷带”进了管理层。这将非常糟糕——调用 `managers[0].setBonus(1000)`\
  \ 将尝试访问一个不存在的实例字段并损坏相邻的内存。\n\n为了确保不会发生此类损坏，所有数组都会记住它们创建时的元素类型，并监控只有兼容的引用被存储在其中。例如，通过\
  \ `new Manager[10]` 创建的数组会记得它是一个经理数组。尝试存储一个 `Employee` 引用会导致 `ArrayStoreException`。\n\
  \n***\n\n### 5.1.6 理解方法调用\n\n确切理解方法调用是如何应用于对象的是非常重要的。假设我们调用了 `x.f(args)`，且隐式参数 `x`\
  \ 被声明为类 `C` 的对象。以下是发生的情况：\n\n**1.** 编译器查看对象的声明类型和方法名。注意，可能有多个同名为 `f` 的方法，但其参数类型不同。例如，可能有一个方法\
  \ `f(int)` 和一个方法 `f(String)`。编译器会列出类 `C` 中所有名为 `f` 的方法，以及 `C` 的父类中所有可访问的名为 `f` 的方法。（父类的私有方法是不可见的。）\n\
  \n现在编译器知道了要调用的方法的所有候选者。\n\n**2.** 接下来，编译器确定方法调用中提供的参数类型。如果在所有名为 `f` 的方法中，有一个唯一方法的参数类型与所提供的参数最匹配，则选择该方法进行调用。这个过程被称为重载解析（overloading\
  \ resolution）。例如，在 `x.f(\"Hello\")` 中，编译器选择了 `f(String)` 而不是 `f(int)`。\n\n***\n\n\
  ![Image](img/note.jpg) 注意\n\n记住方法的名称和参数列表被称为签名（signature）。例如，`f(int)` 和 `f(String)`\
  \ 是同名不同签名的方法。\n\n返回类型不是签名的一部分。然而，当你重写一个方法时，你需要保持返回类型兼容。例如，假设 `Employee` 类有一个方法：\n\
  \n点击此处查看代码图片\n\n```\npublic Employee getBuddy() { ... }\n```\n\n经理永远不会想要一个员工作为伙伴。为了反映这一事实，`Manager`\
  \ 子类可以重写该方法为：\n\n点击此处查看代码图片\n\n```\npublic Manager getBuddy() { ... }\n```\n\n我们说这两个\
  \ `getBuddy` 方法具有协变返回类型。\n\n***\n\n**3.** 如果方法是 `private`、`static`、`final` 或构造函数，那么编译器确切知道要调用哪个方法。（`final`\
  \ 修饰将在下一节解释。）这被称为静态绑定（static binding）。否则，要调用的方法取决于隐式参数的类型，必须在运行时使用动态绑定。\n\n**4.**\
  \ 当程序运行并使用动态绑定调用方法时，虚拟机必须调用适用于 `x` 所指对象的*实际*类型的方法版本。假设实际类型是 `D`，它是 `C` 的子类。如果类 `D`\
  \ 定义了方法 `f(String)`，则调用该方法。如果不是，则搜索 `D` 的父类中的方法 `f(String)`，依此类推。\n\n每次调用方法都执行这种搜索将非常耗时。因此，虚拟机为每个类预计算一个方法表（method\
  \ table），列出所有方法签名和实际要调用的方法。当实际调用方法时，虚拟机只需进行表查找。在我们的示例中，虚拟机咨询类 `D` 的方法表，并查找调用 `f(String)`\
  \ 的方法。该方法可能是 `D.f(String)` 或 `X.f(String)`，其中 `X` 是 `D` 的某个父类。这种场景有一个转折。如果调用是 `super.f(param)`，那么编译器将咨询隐式参数父类的方法表。\n\
  \n\n\n\n\n让我们详细查看代码列表 5.1 中调用 `e.getSalary()` 的这一过程。`e` 的声明类型为 `Employee`。`Employee`\
  \ 类有一个方法，称为 `getSalary`，且没有方法参数。因此，在这种情况下，我们不需要担心重载解析。\n\n`getSalary` 方法既不是 `private`、不是\
  \ `static` 也不是 `final`，因此它是动态绑定的。虚拟机为 `Employee` 和 `Manager` 类生成方法表。`Employee` 表显示所有方法都定义在\
  \ `Employee` 类本身：\n\n点击此处查看代码图像\n\nEmployee:\n\n  `getName() -> Employee.getName()`\n\
  \  `getSalary() -> Employee.getSalary()`\n  `getHireDay() -> Employee.getHireDay()`\n\
  \  `raiseSalary(double) -> Employee.raiseSalary(double)`\n\n实际上，这并不是全部情况——正如你在本章稍后部分将看到的，`Employee`\
  \ 类有一个超类 `Object`，它从那里继承了许多方法。我们暂时忽略 `Object` 方法。\n\n`Manager` 方法表略有不同。它继承了三个方法，重定义了一个方法，并添加了一个方法。\n\
  \n点击此处查看代码图像\n\nManager:\n\n  `getName() -> Employee.getName()`\n  `getSalary()\
  \ -> Manager.getSalary()`\n  `getHireDay() -> Employee.getHireDay()`\n  `raiseSalary(double)\
  \ -> Employee.raiseSalary(double)`\n  `setBonus(double) -> Manager.setBonus(double)`\n\
  \n在运行时，调用 `e.getSalary()` 的解析过程如下：\n\n1. 首先，虚拟机获取 `e` 的实际类型的方法表。这可能是 `Employee`、`Manager`\
  \ 或 `Employee` 的另一个子类的表。\n2. 然后，虚拟机查找 `getSalary()` 签名的定义类。现在它知道要调用哪个方法了。\n3. 最后，虚拟机调用该方法。\n\
  \n动态绑定具有非常重要的属性：它使程序具有扩展性，而无需修改现有代码。假设添加了一个新类 `Executive`，并且变量 `e` 可能指向该类的对象。包含调用\
  \ `e.getSalary()` 的代码不需要重新编译。如果 `e` 恰好指向一个 `Executive` 类型的对象，则会自动调用 `Executive.getSalary()`\
  \ 方法。\n\n***\n\n![Image](img/caution.jpg) 注意\n\n当你重写一个方法时，子类方法的可见性至少要与父类方法相同。特别是如果父类方法是\
  \ `public`，则子类方法也必须声明为 `public`。无意遗漏子类方法的 `public` 修符是一个常见错误。编译器会报错，提示你试图提供更严格的访问权限。\n\
  \n### 5.1.7 防止继承：Final 类和方法\n\n有时，你可能想防止别人从你的某个类创建子类。不能被扩展的类被称为最终类（final classes），你在类定义中使用\
  \ `final` 修饰符来指示这一点。例如，假设我们想防止他人对 `Executive` 类进行子类。只需使用 `final` 修饰符声明该类即可：\n\n\
  点击此处查看代码图像\n\n```java\npublic final class Executive extends Manager\n{\n   ...\n\
  }\n```\n\n你也可以使类中的特定方法变为 `final`。如果你这样做，那么任何子类都不能重写该方法。（`final` 类中的所有方法都自动是 `final`\
  \ 的。）例如：\n\n点击此处查看代码图像\n\n```java\npublic class Employee\n{\n   ...\n   public final\
  \ String getName()\n   {\n      return name;\n   }\n   ...\n}\n```\n\n***\n\n![Image](img/note.jpg)\
  \ 提示\n\n记住，字段也可以声明为 `final`。在对象构造之后，最终字段无法更改。然而，如果一个类被声明为 `final`，只有方法是自动 `final`\
  \ 的，而不是字段。\n\n***\n\n将方法或类设为 `final` 的理由只有一个：确保其语义在子类中不会发生改变。例如，`Calendar` 类的 `getTime`\
  \ 和 `setTime` 方法是 `final` 的。这表明 `Calendar` 类的设计者承担了 `Date` 类与日历状态之间转换的责任。不允许任何子类破坏这种安排。同样，`String`\
  \ 类是一个 `final` 类。这意味着没有人可以定义 `String` 的子类。换句话说，如果你有一个 `String` 引用，你就知道它指的是一个 `String`，且仅此而已。\n\
  \n一些程序员认为，除非你有想要多态的充分理由，否则你应该将所有方法声明为 `final`。事实上，在 C++ 和...（为了简洁，文本已省略）。\n\n###\
  \ 5.1.8 强制转换\n\n回想第 3 章，强制从一种类型转换为另一种类型的过程被称为强制转换（casting）。Java 编程语言对强制转换有特殊的表示。例如，\n\
  \n```java\ndouble x = 3.405;\nint nx = (int) x;\n```\n\n将 `x` 的值转换为整数，舍弃小数部分。\n\n\
  正如你有时需要将浮点数转换为整数一样，你可能需要将对象引用从一个类转换为另一个类。要实际对对象引用进行强制转换，使用与转换数值表达式类似的语法。将目标类名括在括号中，并放置在你想要转换的对象引用之前。例如：\n\
  \n点击此处查看代码图像\n\n```java\nManager boss = (Manager) staff[0];\n```\n\n\n\n\n当你向变量中存储一个值时，编译器会检查你是否承诺得太多。如果你将一个子类引用赋值给父类变量，你承诺的较少，编译器会直接允许你这样做。如果你将一个父类引用赋值给子类变量，你承诺的较多。这时，你必须使用强制类型转换（cast），以便让你的承诺在运行时得到检查。\n\
  \n如果你尝试对继承链进行向下强制转换，并且对对象所包含的内容“撒了谎”，会发生什么呢？\n\n点击此处查看代码图片\n\n```\nManager boss\
  \ = (Manager) staff[1]; // 错误\n```\n\n当程序运行时，Java 运行时系统会注意到被违背的承诺并产生 `ClassCastException`。如果你不捕获该异常，程序就会终止。因此，在尝试强制转换之前确定其是否会成功是一个良好的编程习惯。只需使用\
  \ `instanceof` 运算符即可。例如：\n\n点击此处查看代码图片\n\n```\nif (staff[1] instanceof Manager)\n\
  {\n   boss = (Manager) staff[1];\n   ...\n}\n```\n\n最后，如果强制转换没有可能，编译器将不允许你进行转换。例如，转换\n\
  \n```\nString c = (String) staff[1];\n```\n\n是一个编译错误，因为 `String` 并不是 `Employee`\
  \ 的子类。\n\n### 总结：\n* 你只能在继承层次结构内进行强制转换。\n* 在从父类转换到子类之前，使用 `instanceof` 进行检查。\n\n\
  ***\n\n![Image](img/note.jpg) 注意事项\n\n测试\n\n```\nx instanceof C\n```\n\n如果 `x` 为\
  \ `null`，该测试不会产生异常。它只是返回 `false`。这是合理的：`null` 指向没有任何对象，因此它显然不指向类型为 `C` 的对象。\n\n\
  ***\n\n实际上，通过强制转换转换对象的类型通常不是一个好主意。在我们的示例中，对于大多数用途，你不需要将 `Employee` 对象强制转换为 `Manager`\
  \ 对象。`getSalary` 方法在这两个类的两个对象上都能正常工作。使多态生效的动态绑定会自动定位正确的方法。\n\n进行强制转换的唯一原因是使用一个 类特有的方法，例如\
  \ `setBonus`。如果由于某种原因，你发现自己想在 `Employee` 对象上调用 `setBonus`，请问自己这是否表明父类中存在设计缺陷。重新设计父类并添加\
  \ `setBonus` 方法可能是有意义的。请记住，只需要一个未捕获的 `ClassCastException` 就会终止你的程序。通常，最好尽量减少强制转换和\
  \ `instanceof` 运算符的使用。\n\n***\n\n![Image](img/note1.jpg) C++ 注意事项\n\nJava 使用了 C\
  \ 语言“过去旧时代”的强制转换语法，但它的工作原理类似于 C++ 中安全的 `dynamic_cast` 操作。例如，\n\n点击此处查看代码图片\n\n```\n\
  Manager boss = (Manager) staff[1]; // Java\n```\n\n它等同于\n\n点击此处查看代码图片\n\n```cpp\n\
  Manager* boss = dynamic_cast<Manager*>(staff[1]); // C++\n```\n\n但有一个重要的区别。如果强制转换失败，它不会产生一个空对象，而是抛出一个异常。从这个意义上说，它类似于\
  \ C++ 中引用的强制转换。这非常头疼。在 C++ 中，你可以在一个操作中完成类型测试和类型转换。\n\n点击此处查看代码图片\n\n```cpp\nManager*\
  \ boss = dynamic_cast<Manager*>(staff[1]); // C++\n\nif (boss != NULL) . . .\n```\n\
  \n在 Java 中，你需要结合使用 `instanceof` 运算符和强制转换。\n\n点击此处查看代码图片\n\n```\nif (staff[1] instanceof\
  \ Manager)\n{\n   Manager boss = (Manager) staff[1];\n   ...\n}\n```\n\n### 5.1.9\
  \ 抽象类\n\n随着你向继承体系向上移动，类变得越来越通用，可能也越来越抽象。在某一点，祖先类变得*如此*通用，以你更多地将其看作其他类的基础，而不是一个包含你想使用的特定实例的类。例如，考虑我们\
  \ `Employee` 类层次结构的扩展。员工是人，学生也是人。让我们扩展类层次结构以包含 `Person` 和 `Student` 类。图 5.2 显示了这些类之间的继承关系。\n\
  \n![Image](img/05fig02.jpg)\n\n**图 5.2** `Person` 及其子类的继承图\n\n为什么要费心进行如此层次的抽象？有些属性对每个人都是意义的，例如名字。学生和员工都有名字，引入一个共同的父类让我们可以将\
  \ `getName` 方法提取到继承层次结构中的更高层次。\n\n现在让我们再添加另一个方法 `getDescription`，其目的是返回人的简短描述，例如：\n\
  \n点击此处查看代码图片\n\n* 一个工资为 50 美元的员工\n* 一个主修计算机科学的学生\n\n有些程序员并没有意识到抽象类可以拥有具体方法。你应该总是将通用方法（无论是否是抽象）移动到父类中。\n\
  \n***\n\n抽象方法充当子类中实现方法的占位符。当你扩展一个抽象类时，你有两个选择。你可以留下某些或所有抽象方法未定义；那么你必须将子类标记为抽象。或者你可以定义所有方法，这样子类就不再是抽象的。\n\
  \n例如，我们将定义一个扩展 `Person` 类的 `Student` 类，并实现 `getDescription` 方法。`Student` 类的方法都不是抽象的，因此它不需要被声明为抽象类。\n\
  \n一个类即使没有抽象方法，也可以被声明为 `abstract`。\n\n抽象类不能被实例化。也就是说，如果一个类被声明为 `abstract`，就无法创建该类的对象。例如，表达式\n\
  \n```\nnew Person(\"Vince Vu\")\n```\n\n是一个错误。然而，你可以创建具体子类的对象。\n\n注意你仍然可以创建抽象类的*对象变量*，但这样的变量必须指向非抽象子类的对象。例如：\n\
  \n点击此处查看代码图片\n\n```\nPerson p = new Student(\"Vince Vu\", \"Economics\");\n```\n\
  \n在这里 `p` 是抽象类型 `Person` 的变量，它指向非抽象子类 `Student` 的实例。\n\n\n\n如果一个 C++ 类包含至少一个纯虚函数，那么它就是抽象类。在\
  \ C++ 中，没有特殊的关键字来表示抽象类。\n\n***\n\n让我们定义一个扩展抽象类 `Person` 的具体子类 `Student`：\n\n点击此处查看代码图片\n\
  \n```java\npublic class Student extends Person\n{\n    private String major;\n \
  \   public Student(String name, String major)\n    {\n        super(name);\n   \
  \     this.major = major;\n    }\n    public String getDescription()\n    {\n  \
  \      return \"a student majoring in \" + major;\n    }\n}\n```\n\n`Student` 类定义了\
  \ `getDescription` 方法。因此，`Student` 类中的所有方法都是具体的，该类不再是抽象类。\n\n如 列表 5.4 所示的程序定义了抽象父类\
  \ `Person`（列表 5.5）以及两个具体子类：`Employee`（列表 5.6）和 `Student`（列表 5.7）。我们用员工对象和学生对象填充一个\
  \ `Person` 引用数组：\n\n点击此处查看代码图片\n\n```java\nPerson[] people = new Person[2];\npeople[0]\
  \ = new Employee(. . .);\npeople[1] = new Student(. . .);\n```\n\n然后我们打印这些对象的名称和描述：\n\
  \n点击此处查看代码图片\n\n```java\nfor (Person p : people)\n    System.out.println(p.getName()\
  \ + \", \" + p.getDescription());\n```\n\n有些人人对以下调用感到困惑：\n\n```java\np.getDescription()\n\
  ```\n\n这难道不是对未定义方法的调用吗？请记住，变量 `p` 永远不会引用一个 `Person` 对象，因为无法构造抽象类 `Person` 的对象。变量\
  \ `p` 始终指向具体子类的对象（如 `Employee` 或 `Student`）。对于这些对象，`getDescription` 方法是定义过的。\n\n\
  你是否可以完全从 `Person` 父类中省略抽象方法，而仅在 `Employee` 和 `Student` 子类中定义 `getDescription` 方法呢？如果你这样做，你将无法在变量\
  \ `p` 上调用 `getDescription` 方法。编译器确保你只调用在类中声明的方法。\n\n抽象方法是 Java 编程语言中的一个重要概念。你最常见*接口*内部遇到它们。有关接口的更多信息，请参阅第\
  \ 6 章。\n\n**列表 5.4** `abstractClasses/PersonTest.java`\n\n点击此处查看代码图片\n\n***\n\n\
  ```java\n1   package abstractClasses;\n2\n3   /**\n4    * 此程序演示了抽象类。\n5    * @version\
  \ 1.01 2004-02-21\n6    * @author Cay Horstmann\n7    */\n8   public class PersonTest\n\
  9   {\n10      public static void main(String[] args)\n11      {\n12          Person[]\
  \ people = new Person[2];\n13\n14          //用 Student 和 Employee 对象填充 people 数组\n\
  15          people[0] = new Employee(\"Harry Hacker\", 50000, 1989, 10, 1);\n16\
  \          people[1] = new Student(\"Maria Morris\", \"computer science\");\n17\n\
  18          // 打印所有 Person 对象的名称和描述\n19          for (Person p : people)\n20   \
  \           System.out.println(p.getName() + \", \" + p.getDescription());\n21 \
  \     }\n22  }\n```\n\n**列表 5.5** `abstractClasses/Person.java`\n\n点击此处查看代码图片\n\n\
  ***\n\n```java\n1   package abstractClasses;\n2\n3   public abstract class Person\n\
  4   {\n5      public abstract String getDescription();\n6      private String name;\n\
  7\n8      public Person(String name)\n9      {\n10         this.name = name;\n11\
  \      }\n12\n13      public String getName()\n14      {\n15          return name;\n\
  16      }\n17  }\n```\n\n**列表 5.6** `abstractClasses/Employee.java`\n\n点击此处查看代码图片\n\
  \n***\n\n```java\n1   package abstractClasses;\n2\n3   import java.time.*;\n4\n\
  5   public class Employee extends Person\n6   {\n7      private double salary;\n\
  8      private LocalDate hireDay;\n9\n10     public Employee(String name, double\
  \ salary, int year, int month, int day)\n11      {\n12          super(name);\n13\
  \          this.salary = salary;\n14          hireDay = LocalDate.of(year, month,\
  \ day);\n15      }\n16\n17      public double getSalary()\n18      {\n19       \
  \   return salary;\n20      }\n21\n22      public LocalDate getHireDay()\n23   \
  \       {\n24          return hireDay;\n25      }\n26\n27      public String getDescription()\n\
  28      {\n29          return \"employee with salary of \" + salary;\n30      }\n\
  31  }\n```\n\n**列表 5.7** `abstractClasses/Student.java`\n\n点击此处查看代码图片\n\n***\n\n\
  ```java\n1   package abstractClasses;\n2\n3   public class Student extends Person\n\
  4   {\n5      private String major;\n6\n7      /**\n8       * @param name 学生的姓名\n\
  9       * @param major 学生的专业\n10      */\n11      public Student(String name, String\
  \ major)\n12      {\n13          super(name);\n14          this.major = major;\n\
  15      }\n16\n17      public String getDescription()\n18      {\n19          return\
  \ \"a student majoring in \" + major;\n20      }\n21  }\n```\n\n### 5.1.10 保护访问\n\
  \n如你所知，类中的字段最好被标记为 `private`，而方法通常标记为 `public`。正如我们在本章开头所说，`private` 特征对其他类不可见。\n\
  \n然而，有时你希望将方法限制为子类可见，或者不常见地允许子类访问父类的字段。在这种情况下，你将类特征标记为 `protected`。例如，如果父类 `Employee`\
  \ 将 `hireDay` 字段标记为 `protected` 而不是 `private`，那么 `Manager` 方法就可以访问它。\n\n但是，`Manager`\
  \ 方法只能访问 `Manager` 对象的 `hireDay` ，而不是其他 `Employee` 对象。这种限制是为了防止通过创建子类来滥用 `protected`\
  \ 机制。\n\n在实践中，请谨慎使用保护字段。假设你的类被其他程序员使用，而你在设计时使用了保护字段。在你不知情的情况下，其他程序员可能会继承你的类并开始访问这些字段。在这种情况下，你无法在不影响这些程序员的情况下更改类的实现。这违背了面向对象编程的精神，OOP\
  \ 鼓励数据封装。\n\n保护方法则更为合理。类可以将其方法标记为 `protected`，如果该方法使用起来很复杂。这表明子类（它们按理了解其祖类）可以被信任正确使用该方法，而其他类则不能。\n\
  \n这种方法的很好的例子是 `Object` 类的 `clone` 方法——更多详情请参阅第 6 章。\n\n***\n\n![图片](img/note1.jpg)\
  \ C++ 注意\n\n事实是，Java 中的保护特征不仅对所有子类可见，而且对同一包中的所有其他类可见。这与 C++ 中 `protected` 的含义略有不同，使得\
  \ Java 中的 `protected` 概念比 C++ 中更不安全。\n\n***\n\n以下是 Java 中控制可见性的四种访问修饰符总结：\n\n**1.**\
  \ 仅对类可见（`private`）。\n\n**2.** 对全世界可见（`public`）。\n\n**3.** 对包和所有子类可见（`protected`）。\n\
  \n**4.** 对包可见——（不幸的）默认值。不需要修饰符。\n\n## 5.2 Object：宇宙级父类\n\n\n\n\n`Object` 类是终极祖先——Java\
  \ 中的每一个类都继承自 `Object`。然而，你永远不需要编写：\n\n点击此处查看代码图片\n\n```java\npublic class Employee\
  \ extends Object\n```\n\n如果没有显式提到父类，则终极父类 `Object` 是被理所当然的。由于 Java 中的每个类都继承自 `Object`，因此熟悉\
  \ `Object` 类提供的服务至关重要。我们将在本章中介绍基础方法；对于本文未涵盖的内容，请参阅后续章节或查看在线文档。（`Object` 的几个方法只有在处理并发时才会出现——更多关于线程的信息请参阅第\
  \ 14 节。）\n\n你可以使用 `Object` 类型的变量来引用任何类型的对象：\n\n点击此处查看代码图片\n\n```java\nObject obj\
  \ = new Employee(\"Harry Hacker\", 35000);\n```\n\n当然，`Object` 类型的变量只能作为任意值的通用容器使用。要对该值进行任何特定操作，你需要对原始类型有一定的了解并应用强制类型转换：\n\
  \n```java\nEmployee e = (Employee) obj;\n```\n\n在 Java 中，只有基本类型的值（数字、字符和 `boolean`\
  \ 值）不是对象。\n\n所有数组类型，无论是对象数组还是基本类型数组，都是继承自 `Object` 类的类类型。\n\n点击此处查看代码图片\n\n```java\n\
  Employee[] staff = new Employee[10];\nobj = staff; // OK\nobj = new int[10]; //\
  \ OK\n```\n\n***\n\n![Image](img/note1.jpg) C++ 注意\n\n在 C++ 中没有根类。然而，每个指针都可以转换为\
  \ `void*` 指针。\n\n***\n\n### 5.2.1 equals 方法\n\n`Object` 类中的 `equals` 方法测试一个对象是否被认为另一个另一个相等。`Object`\
  \ 类中实现的 `equals` 方法判断两个对象引用是否相同。这是一个相当合理的默认值——如果两个对象是相同的，它们理应该是相等的。对于许多类来说，不需要其他操作。例如，比较两个\
  \ `PrintStream` 对象的相等性没有意义。然而，你通常会想要实现基于状态的相等性测试，在这种情况下，当两个对象具有相同状态时，它们被认为是相等的。\n\
  \n例如，假设两个员工具有相同的姓名、工资和入职日期，他们就是相等的。（在实际的员工数据库中，比较 ID 会更合理。我们使用这个示例来演示实现 `equals`\
  \ 方法的机制。）\n\n点击此处查看代码图片\n\n```java\npublic class Employee\n{\n    ...\n    public\
  \ boolean equals(Object otherObject)\n    {\n        // 快速测试对象是否相同\n        if (this\
  \ == otherObject) return true;\n        // 如果式参数为 null，必须返回 false\n        if (otherObject\
  \ == null) return false;\n        // 如果类不匹配，它们就不可能相等\n        if (getClass() !=\
  \ otherObject.getClass())\n            return false;\n        // 现在知道 otherObject\
  \ 是一个非空的 Employee\n        Employee other = (Employee) otherObject;\n        //\
  \ 测试字段是否具有相同的值\n        return name.equals(other.name)\n            && salary ==\
  \ other.salary\n            && hireDay.equals(other.hireDay);\n    }\n}\n```\n\n\
  `getClass` 方法返回对象的类——我们将在本章后面部分详细讨论这个方法。在我们的测试中，两个对象只有在属于同一个类时才相等。\n\n***\n\n为了防止\
  \ `name` 或 `hireDay` 为 `null` 的可能，请使用 `Objects.equals` 方法。调用 `Objects.equals(a,\
  \ b)` 在两个参数都为 `null` 时返回 `true`，如果仅一个为 `null` 则返回 `false`，否则调用 `a.equals(b)`。使用该方法，`Employee.equals`\
  \ 方法的最后语句变为：\n\n点击此处查看代码图片\n\n```java\nreturn Objects.equals(name, other.name)\n\
  \    && salary == other.salary\n    && Object.equals(hireDay, other.hireDay);\n\
  ```\n\n***\n\n当你为子类定义 `equals` 方法时，先调用父类的 `equals`。如果该测试没有通过，则对象不相等。如果父类字段相等，你就可以准备比较子类的实例字段了。\n\
  \n点击此处查看代码图片\n\n```java\npublic class Manager extends Employee\n{\n    ...\n   \
  \ public boolean equals(Object otherObject)\n    {\n        if (!super.equals(otherObject))\
  \ return false;\n        Manager other = (Manager) otherObject;\n        return\
  \ bonus == other.bonus;\n    }\n}\n```\n\n### 5.2.2 相等性测试与继承\n\n如果参数属于不同的类，`equals`\
  \ 方法应该如何表现？这直是一个是一个争议领域。在前面的示例中，如果类不匹配，`equals` 方法将返回 `false`。但许多程序员使用 `instanceof`\
  \ 测试：\n\n点击此处查看代码图片\n\n```java\nif (!(otherObject instanceof Employee)) return false;\n\
  ```\n\n这留下了 `otherObject` 可能属于子类的可能性。然而，Java 规范要求 `equals` 方法具有以下属性：\n\n1. **自反性**：对于任何非空引用\
  \ `x`，`x.equals(x)` 返回 `true`。\n2. **对称性**：对于任何引用 `x` 和 `y`，`x.equals(y)` 返回 `true`\
  \ 当且仅当 `y.equals(x)` 返回 `true`。\n3. **传递性**：对于任何引用 `x`、`y` 和 `z`，如果 `x.equals(y)`\
  \ 返回 `true` 且 `y.equals(z)` 返回 `true`，则 `x.equals(z)` 应返回 `true`。\n4. **一致性**：如果\
  \ `x` 和 `y` 所引的对象没有改变，则重复调用 `x.equals(y)` 返回相同的值。\n5. 对于任何非空引用 `x`，`x.equals(null)`\
  \ 应该返回 `false`。\n\n这些规则显然合理。在数据结构中定位元素时，你不会希望库实现者纠结调用 `x.equals(y)` 还是 `y.equals(x)`。\n\
  \n然而，对称规则在参数属于不同类时会产生微妙的影响。考虑一个调用 `e.equals(m)`，其中 `e` 是 `Employee` 对象而 `m` 是 `Manager`\
  \ 对象，它们恰好具有相同的姓名、工资和入职日期。如果 `Employee.equals` 使用 `instanceof` 测试，则调用返回 `true`。但这意味着反向调用\
  \ `m.equals(e)` 也需要返回 `true`——对称规则不允许它返回 `false` 或抛出异常。\n\n这让 `Manager` 类陷入了困境。它的\
  \ `equals` 方法必须愿意与任何 `Employee` 进行比较，而不考虑经理特有的信息！\n\n一些作者记录了 `getClass` 测试是错误的，因为它违背了替换原则。一个经常被引用例子是\
  \ `AbstractSet` 类中的 `equals` 方法，它用于测试两个集合是否具有相同的元素。`AbstractSet` 类有两个具体的子类 `TreeSet`\
  \ 和 `HashSet`，它们在定位元素时使用不同的算法。你真的希望能够比较任何集合，无论它们是如何实现的。\n\n然而，集合的例子相当特殊。将 `AbstractSet.equals`\
  \ 声明为 `final` 是合理的，因为不应该有人重新定义集合相等性的语义。（该方法实际上并不是 `final`。这允许子类为相等性测试实现更高效的算法。）\n\
  \n在我们看来，有两种不同的场景：\n\n• 如果子类可以有自己的相等概念，那么对称性要求迫使你使用 `getClass` 测试。\n\n\n\n\n\n- 如果相等性的定义在父类中已经固定，那么你可以使用\
  \ `instanceof` 测试，并允许不同子类的对象相互相等。\n\n在员工和经理的示例中，当两个对象的字段相匹配时，我们认为它们是相等的。如果我们有两个姓名、工资和入职日期相同，但奖金不同的\
  \ `Manager`（经理）对象，我们希望它们是互不相同的。因此，我们使用了 `getClass` 测试。\n\n但假设我们使用员工 ID 进行相等性测试。这种相等性定义对于所有子类都是合理的。那么我们就可以使用\
  \ `instanceof` 测试，并且我们应该将 `Employee.equals` 声明为 `final`。\n\n***\n\n![Image](img/note.jpg)\
  \ 注意\n\n标准 Java 库包含了超过 150 种 `equals` 方法的实现，这些实现混杂杂章，有使用 `instanceof`、调用 `getClass`、捕获\
  \ `ClassCastException` 或者什么都不做。查看 `java.sql.Timestamp` 类的 API 文档，实现者们有些尴尬地注释道，他们让自己陷入了困境。`Timestamp`\
  \ 类继承自 `java.util.Date`，后者的 `equals` 方法使用了 `instanceof` 测试，而无法重写 `equals` 使其同时具有对称性和准确性。\n\
  \n***\n\n### 以下是编写完美 `equals` 方法的配方：\n\n**1.** 将显式参数命名为 `otherObject`——稍后，你将需要将其转换为另一个变量，并将其命名为\
  \ `other`。\n\n**2.** 测试 `this` 是否意外与 `otherObject` 相同：\n\n点击此处查看代码图片\n\n```\nif\
  \ (this == otherObject) return true;\n```\n\n这条语句仅仅是一种优化。在实践中，这是一种常见的情况。检查标识性比比较字段要快得多。\n\
  \n**3.** 测试 `otherObject` 是否为 `null`，如果是则返回 `false`。这个测试是必须的。\n\n点击此处查看代码图片\n\n\
  ```\nif (otherObject == null) return false;\n```\n\n**4.** 比较 `this` 和 `otherObject`\
  \ 的类。如果 `equals` 的语义可以在子类中发生变化，请使用 `getClass` 测试：\n\n点击此处查看代码图片\n\n如果所有子类都保持相同的语义，你可以使用\
  \ `instanceof` 测试：\n\n点击此处查看代码图片\n\n```\nif (!(otherObject instanceof ClassName))\
  \ return false;\n```\n\n**5.** 将 `otherObject` 强制转换为你的类类型的变量：\n\n点击此处查看代码图片\n\n\
  ```\nClassName other = (ClassName) otherObject\n```\n\n**6.** 现在根据你对相等性的定义比较字段。对于原始类型字段使用\
  \ `==`，对于对象字段使用 `Objects.equals`。如果所有字段都匹配则返回 `true`，否则返回 `false`。\n\n点击此处查看代码图片\n\
  \n```\nreturn field1 == other.field1\n    && Objects.equals(field2, other.field2)\n\
  \    && . . .;\n```\n\n如果你在子类中重定义 `equals`，请包含对 `super.equals(other)` 的调用。\n\n***\n\
  \n![Image](img/tip.jpg) 提示\n\n如果你有数组类型的字段，可以使用静态的 `Arrays.equals` 方法来检查相应的数组元素是否相等。\n\
  \n***\n\n***\n\n![Image](img/caution.jpg) 警告\n\n这是实现 `equals` 方法时的一个常见错误。你能看出问题所在吗？\n\
  \n点击此处查看代码图片\n\n```java\npublic class Employee\n{\n    public boolean equals(Employee\
  \ other)\n    {\n        return other != null\n            && getClass() == other.getClass()\n\
  \            && Objects.equals(name, other.name)\n            && salary == other.salary\n\
  \            && Objects.equals(hireDay, other.hireDay);\n    }\n    ...\n}\n```\n\
  \n该方法将显式参数类型声明为 `Employee`。结果，它没有重写 `Object` 类的 `equals` 方法，而是定义了一个完全无关的方法。\n\n\
  你可以通过为意图重写父类方法的方法标记上 `@Override` 标签来防止此类错误：\n\n点击此处查看代码图片\n\n```java\n@Override\
  \ public boolean equals(Object other)\n```\n\n如果你犯了错误并定义了一个新方法，编译器会报告错误。例如，假设你在\
  \ `Employee` 类中添加了以下声明：\n\n点击此处查看代码图片\n\n```java\n@Override public boolean equals(Object\
  \ other)\n```\n\n将会报错，因为此方法没有重写父类中的任何方法。\n\n### 5.2.3 hashCode 方法\n\n哈希码是一个根据对象派生的整数。哈希码应该是散乱的——如果\
  \ `x` 和 `y` 是不同的对象，那么 `x.hashCode()` 和 `y.hashCode()` 有很大概率是不同的。\n\n`hashCode` 方法在\
  \ `String` 类中定义。它使用以下算法计算哈希：\n\n```java\nint hash = 0;\nfor (int i = 0; i < length();\
  \ i++)\n    hash = 31 * hash + charAt(i);\n```\n\n`hashCode` 方法在 `Object` 类中定义。因此，每个对象都有默认哈希码。考虑这个示例：\n\
  \n```java\nString s = \"Ok\";\nStringBuilder sb = new StringBuilder(s);\nSystem.out.println(s.hashCode()\
  \ + \" \" + sb.hashCode());\n\nString t = new String(\"Ok\");\nStringBuilder tb\
  \ = new StringBuilder(t);\nSystem.out.println(t.hashCode() + \" \" + tb.hashCode());\n\
  ```\n\n![Image](img/05.jpg) String 和 StringBuilder 的哈希码\n\n注意字符串 `s` 和 `t` 具有相同的哈希码，因为对于字符串，哈希码是从内容派生的。StringBuilder\
  \ `sb` 和 `tb` 具有不同的哈希码，因为 `StringBuilder` 类没有定义 `hashCode` 方法，而 `Object` 类中的默认 `hashCode`\
  \ 方法从对象的地址派生哈希码。\n\n如果你重定义了 `equals` 方法，你还需要为可能插入哈希表的对象重定义 `hashCode` 方法。（我们在第 9\
  \ 章中讨论哈希表）。\n\n\n\n\n甚至更好，当你需要组合多个哈希值时，调用 `Objects.hash` 并传入所有值。它会为每个参数调用 `Objects.hashCode`\
  \ 并组合这些值。那么 `Employee.hashCode` 方法就可以简单如下：\n\n点击此处查看代码图像\n\n```java\npublic int\
  \ hashCode()\n{\n   return Objects.hash(name, salary, hireDay);\n}\n```\n\n你对 `equals`\
  \ 和 `hashCode` 的定义必须保持兼容：如果 `x.equals(y)` 为 `true`，那么 `x.hashCode()` 返回的值必须与 `y.hashCode()`\
  \ 相同。例如，如果你定义 `Employee.equals` 来比较员工 ID，那么 `hashCode` 方法需要对 ID 进行哈希，而不是员工姓名或内存地址。\n\
  \n![Image](img/tip.jpg) 提示\n如果你有数组类型的字段，可以使用静态方法 `Arrays.hashCode` 来计算由数组元素哈希值组成的哈希码。\n\
  \n---\n\n### java.lang.Object 1.0\n- `int hashCode()`\n返回此对象的哈希码。哈希码可以是任意整数，正数或负数。相等的对象需要返回相同的哈希码。\n\
  \n---\n\n### java.util.Objects 7\n- `static int hash(Object... objects)`\n返回一个由所有提供的对象的哈希码组合成的哈希码。\n\
  - `static int hashCode(Object a)`\n如果 `a` 为 `null` 则返回 `0`，否则返回 `a.hashCode()`\n\
  \n---\n\n### java.lang.(Integer|Long|Short|Byte|Double|Float|Character|Boolean)\
  \ 1.0\n- `static int hashCode((int|long|short|byte|double|float|char|boolean) value)`\
  \ 返回给定值的哈希码。\n\n---\n\n### java.util.Arrays 1.2\n- `static int hashCode(type[] a)`\
  \ 5.0\n计算数组 `a` 的哈希码，该数组的组件类型可以是 `Object`、`int`、`long`、`short`、`char`、`byte`、`boolean`、`float`\
  \ 或 `double`。\n\n---\n\n### 5.2.4 toString 方法\n`Object` 中的另一个重要方法是 `toString` 方法，它返回一个表示此对象值的字符串。这是一个典型的示例。`Point`\
  \ 类的 `toString` 方法返回如下所示字符串：\n\n`java.awt.Point[x=10,y=20]`\n\n大多数（但不是所有）`toString`\
  \ 方法都遵循这种格式：类名，然后是括方括号中的字段值。以下是 `Employee` 类的 `toString` 方法的实现：\n\n点击此处查看代码图像\n\n\
  ```java\npublic String toString()\n{\n   return \"Employee[name=\" + name\n    \
  \  + \",salary=\" + salary\n      + \",hireDay=\" + hireDay\n      + \"]\";\n}\n\
  ```\n\n实际上，你可以做得更好。不要在 `toString` 方法中硬编码类名，而是调用 `getClass().getName()` 来获取一个包含类名的字符串。\n\
  \n点击此处查看代码图像\n\n```java\npublic String toString()\n{\n   return getClass().getName()\n\
  \      +\"[name=\" + name\n      + \",salary=\" + salary\n      + \",hireDay=\"\
  \ + hireDay\n      + \"]\";\n}\n```\n\n这种 `toString` 方法对子类同样有效。\n\n当然，子类的程序员应该定义它自己的\
  \ `toString` 方法并添加子类的字段。如果父类使用了 `getClass().getName()`，那么子类可以简单地调用 `super.toString()`。例如，这里是\
  \ `Manager` 类的 `toString` 方法：\n\n点击此处查看代码图像\n\n```java\npublic class Manager extends\
  \ Employee\n{\n   ...\n   public String toString()\n   {\n      return super.toString()\n\
  \          +\"[bonus=\" + bonus\n          + \"]\";\n   }\n}\n```\n\n现在一个 `Manager`\
  \ 对象被打印为：\n\n点击此处查看代码图像\n\n`Manager[name=...,salary=...,hireDay=...][bonus=...]`\n\
  \n`toString` 方法无处不在是因为一个重要的原因：每当使用“+”运算符将对象与字符串拼接时，Java 编译器会自动调用 `toString` 方法来获取对象的字符串表示。例如：\n\
  \n点击此处查看代码图像\n\n```java\nPoint p = new Point(10, 20);\nString message = \"The current\
  \ position is \" + p; // 自动调用 p.toString()\n```\n\n![Image](img/tip.jpg) 提示\n与其编写\
  \ `x.toString()`，你可以写 `\"\" + x`。这条语句将空字符串与 `x` 的字符串表示拼接，这恰好就是 `x.toString()`。与\
  \ `toString` 不同，这条语句即使 `x` 是基本类型也同样有效。\n\n如果 `x` 是任何对象且你调用 `System.out.println(x)`，那么\
  \ `println` 方法简单地调用 `x.toString()` 并打印结果字符串。`Object` 类定义的 `toString` 方法用于打印类名和对象的哈希码。例如，调用\
  \ `System.out.println(System.out)` 输出如下：\n\n`java.io.PrintStream@2f64` 警告\n\n`toString`\
  \ 方法非常有用是因为：每当你使用“+”运算符将对象与字符串拼接时，Java 编译器就会自动调用 `toString` 方法来获取对象的字符串表示。例如：\n\n\
  点击此处查看代码图像\n\n```java\nPoint p = new Point(10, 20);\nString message = \"The current\
  \ position is \" + p; // 自动调用 p.toString()\n```\n\n如果 `x` 是任何对象且你调用 `System.out.println(x)`，那么\
  \ `println` 方法简单地调用 `x.toString()` 并打印结果字符串。`Object` 类定义的 `toString` 方法用于打印类名和对象的哈希码。例如，调用\
  \ `System.out.println(System.out)` 输出如下：\n\n`java.io.PrintStream@2f64` 警告\n\n`toString`\
  \ 方法非常有用是因为：每当你使用“+”运算符将对象与字符串拼接时，Java 编译器就会自动调用 `toString` 方法来获取对象的字符串表示。例如：\n\n\
  点击此处查看代码图像\n\n```java\nPoint p = new Point(10, 20);\nString message = \"The current\
  \ position is \" + p; // 自动调用 p.toString()\n```\n\n![Image](img/tip.jpg) 提示\n我们强烈建议为你编写的每个类都添加\
  \ `toString` 方法。你以及使用你类的其他程序员将对这种日志支持表示感谢。\n\n`toString` 方法非常有用是因为：每当你使用“+”运算符将对象与字符串拼接时，Java\
  \ 编译器就会自动调用 `toString` 方法来获取对象的字符串表示。例如：\n\n\n\n\n\n```java\n30          System.out.println(\"\
  boss.toString(): \" + boss);\n31          System.out.println(\"carl.equals(boss):\
  \ \" + carl.equals(boss));\n32          System.out.println(\"alice1.hashCode():\
