  \ `true`。\n\n\n\n\n\n某些应用程序使用了巨大的并发哈希表，其规模大到 `size` 方法因为返回类型 `int` 而不再适用。对于一个拥有超过\
  \ 20 亿条目的映射，该怎么办？Java SE 8 引入了 `mappingCount` 方法，它以 `long` 类型返回大小。\n\n***\n\n集合返回的是弱一致的迭代器。这意味着迭代器可能反映也可能不反映在构造之后所发生的所有修改，但它们不会重复返回同一个值，且不会抛出\
  \ `ConcurrentModificationException`。\n\n***\n\n![Image](img/note.jpg) 备注\n\n相比之下，`java.util`\
  \ 包中集合的迭代器在迭代器构造后集合被修改时，会抛出 `ConcurrentModificationException`。\n\n***\n\n并发哈希表可以高效地支持大量的读取者和固定的写入者。默认情况下，假设最多有\
  \ 16 个并发写入线程。可以有更多的写入线程，但如果有超过 16 个线程同时进行写入，其他线程将会被临时阻塞。你可以在构造函数中指定更高的数字，但你可能不需要这样做。\n\
  \n***\n\n![Image](img/note.jpg) 备注\n\n哈希映射将所有具有相同哈希值的条目放在同一个“桶”中。某些应用程序使用了糟糕的哈希函数，导致所有条目最终落入少数几个桶，严重降低了性能。即使是通常合理的哈希函数，例如\
  \ `String` 类的哈希函数，也出现问题。例如，攻击者可以通过构造大量哈希到相同值的字符串来减慢程序。从 Java SE 8 开始，当键类型实现了 `Comparable`\
  \ 接口时，并发哈希表将桶组织成树而不是列表，保证了 `O(log(n))` 的性能。\n\n***\n\n***\n\n`java.util.concurrent.ConcurrentLinkedQueue<E>`\
  \ **5.0**\n\n• `ConcurrentLinkedQueue<E>()`\n\n构造一个无界的、非阻塞队列，多个线程可以安全地访问。\n\n***\n\
  \n***\n\n`java.util.concurrent.ConcurrentSkipListSet<E>` **6**\n\n• `ConcurrentSkipListSet<E>()`\n\
