  \       if (maxValue == minValue) return;\n        int panelWidth = getWidth();\n\
  \        int panelHeight = getHeight();\n        Font titleFont = new Font(\"SansSerif\"\
  , Font.BOLD, 20);\n        Font labelFont = new Font(\"SansSerif\", Font.PLAIN,\
  \ 10);\n        // 计算标题的范围\n        FontRenderContext context = g2.getFontRenderContext();\n\
  \        Rectangle2D titleBounds = titleFont.getStringBounds(title, context);\n\
  \        double titleWidth = titleBounds.getWidth();\n        double top = titleBounds.getHeight();\n\
  \        // 绘制标题\n        double y = -titleBounds.getY(); // 上升\n        double\
  \ x = (panelWidth - titleWidth) / 2;\n        g2.setFont(titleFont);\n        g2.drawString(title,\
  \ (float) x, (float) y);\n        // 计算柱体标签的范围\n        LineMetrics labelMetrics\
  \ = labelFont.getLineMetrics(\"\", context);\n        double bottom = labelMetrics.getHeight();\n\
  \        y = panelHeight - labelMetrics.getDescent();\n        g2.setFont(labelFont);\n\
  \        // 获取柱体的缩放因子和宽度\n        double scale = (panelHeight - top - bottom) /\
  \ (maxValue - minValue);\n        int barWidth = panelWidth / values.length;\n \
  \       // 绘制柱体\n        for (int i = 0; i < values.length; i++)\n        {\n  \
  \  }\n    }\n}\n```\n\n\n\n\n\n```java\n101    {\n    // get the coordinates of\
  \ the bar rectangle\n    double x1 = i * barWidth + 1;\n    double y1 = top;\n \
  \   double height = values[i] * scale;\n    if (values[i] >= 0)\n        y1 += (maxValue\
  \ - values[i]) * scale;\n    else\n    {\n        y1 += maxValue * scale;\n    \
  \    height = -height;\n    }\n\n    // fill the bar and draw the bar outline\n\
  \    Rectangle2D rect = new Rectangle2D.Double(x1, y1, barWidth - 2, height);\n\
  \    g2.setPaint(Color.RED);\n    g2.fill(rect);\n    g2.setPaint(Color.BLACK);\n\
  \    g2.draw(rect);\n\n    // draw the centered label below the bar\n    Rectangle2D\
  \ labelBounds = labelFont.getStringBounds(names[i], context);\n\n    double labelWidth\
  \ = labelBounds.getWidth();\n    x = x1 + (barWidth - labelWidth) / 2;\n    g2.drawString(names[i],\
  \ (float) x, (float) y);\n}\n}\n```\n\n`java.applet.Applet` **1.0**\n\n* `public\
  \ String getParameter(String name)`\n  获取在加载 applet 的网页中通过 `param` 标签定义的参数值。字符串\
  \ `name` 是区分大小写的。\n\n* `public String getAppletInfo()`\n  许多 applet 作者都会重写此方法，以返回一个包含当前\
  \ applet 作者信息、版本和版权信息的字符串。\n\n* `public String[][] getParameterInfo()`\n  这是一个你可以重写的方法，用于返回此\
  \ applet 支持的 `param` 标签选项数组。每行包含三个条目：参数的名称、类型和描述。这里是一个示例：\n\n  点击此处查看代码图片\n\n\"\
  fps\", \"1–10\", \"每秒帧数\"\n\n\"repeat\", \"boolean\", \"循环图像？\"\n\n\"images\", \"\
  url\", \"包含图片的目录\"\n\n### 13.4.4 访问图像和音频文件\n\nApplet 可以同时处理图像和音频。在我们编写本文时，图像必须是\
  \ GIF、PNG 或 JPEG 格式，音频文件必须是 AU、AIFF、WAV 或 MIDI 格式。支持动态 GIF，并显示动画。\n\n使用相对 URL 指定图像和音频文件的位置。基础\
  \ URL 通常通过调用 `getDocumentBase` 或 `getCodeBase` 方法获取。前者获取包含 applet 的 HTML 页面的 URL，后者获取\
  \ applet 的 `codebase` 属性所指定的 URL。\n\n将基础 URL 和文件位置传递给 `getImage` 或 `getAudioClip`\
  \ 方法。例如：\n\n  点击此处查看代码图片\n\n```java\nImage cat = getImage(getDocumentBase(), \"\
  images/cat.gif\");\nAudioClip meow = getAudioClip(getDocumentBase(), \"audio/meow.au\"\
  );\n```\n\n你已在第 10 章中看到如何显示图像。要播放音频片段，只需调用它的 `play` 方法即可。你也可以在不先加载音频片段的情况下直接调用 `Applet`\
  \ 类的 `play` 方法。\n\n  点击此处查看代码图片\n\n```java\nplay(getDocumentBase(), \"audio/meow.au\"\
  );\n```\n\n`java.applet.Applet` **1.0**\n\n* `URL getDocumentBase()`\n  获取包含 applet\
  \ 的 HTML 页面的 URL。\n\n* `URL getCodeBase()`\n  获取 applet 的 `codebase` 属性所指定的 URL。\n\
  \n* `void play(URL url)`\n  `void play(URL url, String name)`\n  第一种形式使用 `url`。第二种形式使用\
  \ `name`。\n\n* `AudioClip getAudioClip(URL url)`\n  `AudioClip getAudioClip(URL\
  \ url, String name)`\n  第一种形式使用 `url`。第二种形式使用 `name`。\n\n* `Image getImage(URL url)`\n\
  \  `Image getImage(URL url, String name)`\n  第一种形式使用 `url`。第二种形式使用 `name`。\n\n###\
  \ 13.4.5 Applet Context\n\n`AppletContext` 接口提供了 applet 与浏览器交互的方法。applet 可以请求浏览器执行某些操作，例如显示图像或播放音频片段。`AppletContext`\
  \ 接口包含几个方法，我们将在后文中详细讨论。\n\n### 13.4.6 Applet 间的通信\n\n一个网页可以包含多个 applet。如果它们具有 `name`\
  \ 属性，它们就可以相互通信。`getApplet` 方法提供对 applet 的引用。例如：\n\n  点击此处查看代码图片\n\n```html\n<applet\
  \ code=\"Chart.class\" width=\"100\" height=\"100\" name=\"Chart\">\n```这为你提供了一个对\
  \ applet 的引用。只要你为 `Chart` 类提供一个接收新数据并重绘图表的方法，你就可以通过适当的类型转换来调用该方法。\n\n  点击此处查看代码图片\n\
  \n```java\nApplet chart1 = getAppContext().getApplet(\"Chart\");\n((Chart) chart1).setData(3,\
  \ \"Earth\", 9000);\n```\n\n你还可以列出页面上所有的 applet，无论它们是否具有 `name` 属性。`getApplets`\
  \ 方法返回一个枚举。这里是一个打印页面上所有 applet 类名的循环：\n\n  点击此处查看代码图片\n\n```java\nEnumeration<Applet>\
  \ e = getAppContext().getApplets();\nwhile (e.hasMoreElements()) {\n    Applet a\
  \ = e.nextElement();\n    System.out.println(a.\n());\n```\n\napplet 无法与另一个页面上的\
  \ applet 通信。\n\n### 13.4.7 在浏览器中显示项目\n\n访问浏览器的两个区域：状态栏和网页显示区域。两者都使用 `AppletContext`\
  \ 接口的方法。\n\n你可以使用 `showStatus` 方法在浏览器底部的状态栏显示字符串。例如：\n\n  点击此处查看代码图片\n\n```java\n\
  showStatus(\"Loading data ... please wait\");\n```\n\n**提示**：根据我们的经验，`showStatus`\
  \ 的用途有限。浏览器也会使用状态栏，通常情况下它会用类似 `Applet running.` 的闲话覆盖你宝贵的消息。状态栏应用于如 `Loading data\
  \ ... please wait` 之类的提示信息，但不要用于用户不能错过的信息。\n\n你可以通过 `showDocument` 方法告诉浏览器显示另一个网页。有几种实现方法。简单的方法是调用带有一个参数的\
  \ `showDocument`，参数为你想显示的 URL。\n\n```java\nURL u = new URL(\"http://horstmann.com/index.html\"\
  );\ngetAppContext().showDocument(u);\n```\n\n\n\n\n\n此调用的问题在于它会在当前页相同的窗口中打开新网页，从而取代了你的小程序（applet）。要返回你的小程序，用户必须点击浏览器的后退按钮。\n\
  \n你可以通过在调用 `showDocument` 时提供第二个参数来告诉浏览器在另一个窗口中显示文档（参见表 13.2）。如果你提供特殊字符串 `\"_blank\"\
  `，浏览器将打开新窗口显示文档，而不是取代当前文档。更重要的是，如果你利用 HTML 中的帧（frame）功能，可以将一个浏览器窗口拆分为多个帧，每个帧都有一个名称。你可以将小程序放入一个帧，并让它在其他帧中显示文档。我们将在下一节向你展示如何做的示例。\n\
  \n![Image](img/13tab02.jpg)\n\n**表 13.2** `showDocument` 方法\n\n***\n\n![Image](img/note.jpg)\
  \ 注意\n\n小程序查看器不显示网页。在小程序查看器中，`showDocument` 方法会被忽略。\n\n***\n\n***\n\n### `java.applet.Applet`\
  \ **1.2**\n\n- `public AppletContext getAppletContext()` 提供一个指向程序浏览器环境的句柄。在大多数浏览器中，你可以使用此信息控制运行小程序的浏览器。\n\
  - `void showStatus(String msg)` 在浏览器的状态栏中显示指定的字符串。\n\n***\n\n***\n\n### `java.applet.AppletContext`\
  \ **1.0**\n\n- `Enumeration<Applet> getApplets()` 返回相同上下文（即同一页网页）中所有小程序的枚举器（参见第\
  \ 9 章）。\n- `Applet getApplet(String name)` 返回当前上下文中具有给定名称的小程序；如果不存在则返回 `null`。仅搜索当前网页。\n\
  - `void showDocument(URL url)`\n- `void showDocument(URL url, String target)` 在浏览器的帧中显示新网页。在第一种形式中，新页面会取代当前页面。第二种形式使用\
  \ `target` 参数来识别目标帧（参见表 13.2）。\n\n***\n\n### 13.4.8 沙盒\n\n每当代码从远程站点加载并在本地执行时，安全性就变得至关重要。访问网页会自动启动页面上的所有小程序。点击单个链接即可启动一个\
  \ Java Web Start 应用程序。如果访问网页或点击链接就能在用户的计算机上执行任意代码，那么罪犯将轻松地窃取机密、访问财务数据或接管用户的机器来发送垃圾邮件。\n\
  \n为了确保 Java 技术不被用于恶意目的，Java 拥有一套复杂的安全模型，我们将在第二卷中详细讨论。*安全管理器*（security manager）会检查对所有系统资源的访问。默认情况下，它只允许那些无害的操作。要允许额外的操作，用户必须显式批准该小程序或应用程序。\n\
  \n远程代码在所有平台上*可以*做什么呢？显示图像和播放声音、获取用户的按键输入和鼠标点击，以及将用户输入发送回代码加载的主机，这些总是安全的。这些功能足以展示事实数据或与教育程序或游戏进行交互。受限制的执行环境通常被称为“沙盒”。在沙盒中运行的代码不能更改用户的系统或对其进行监视。\n\
  \n特别是，沙盒中的程序具有以下限制：\n\n- 它们*永远不能*运行任何本地可执行程序。\n- 它们不能从本地计算机的文件系统读取或写入。\n- 它们无法获取有关本地计算机的任何信息，除了使用的\
  \ Java 版本和一些无害的操作系统细节外。特别是，沙盒中的代码无法获取用户名、电子邮箱地址等。\n- 远程加载的程序需要用户同意才能与下载它们的服务器以外的任何主机进行通信；该服务器被称为*源主机*（originating\
  \ host）。这条规则通常被称为“远程代码只能拨回家”。该规则保护用户免受可能尝试监视内网资源代码的影响。\n- 所有弹出窗口都带有一个警告消息。此消息是一个安全特性，确保用户不会将窗口误认为是本地应用程序。人们担心，毫无防备的用户可能会访问一个网页，被诱导运行远程代码，然后输入密码或信用卡号，这些信息会被发送回网络服务器。在\
  \ JDK 的早期版本中，该消息非常不详：“不可信任的 Java 小程序窗口”。随后的每个版本都略微淡化了警告：“未身份验证的 Java 小程序窗口”，然后是“警告：Java\
  \ 小程序窗口”。现在，它是一个微小的警告三角形，只有最细心的用户才会注意到。\n\n沙盒概念不再像过去那样具有意义。在过去，任何人都可以部署沙盒代码，只有需要沙盒之外权限的代码才需要数字签名。如今，通过\
  \ Java 插件执行的所有代码，无论是否运行在沙盒中，都必须经过数字签名。\n\n### 13.4.9 签名代码\n\n小程序或 Java Web Start\
  \ 应用程序的 JAR 文件必须经过*数字签名*。签名的 JAR 文件携带有一个证书，指示签名者的身份。加密技术确保了此类证书无法被伪造，并且任何篡改签名文件的尝试都会被检测到。\n\
  \n例如，假设你收到一个由 yWorks GmbH 制作并数字签名的应用程序，该程序使用了由 Thate 发的证书。加密技术确保了此类证书无法被伪造，并且任何篡改签名文件的尝试都会被检测到。\n\
  \n当你收到应用程序时，可以通过图 13.6 确保以下内容：\n\n1. 代码与签名时完全一致，没有被篡改过。\n2. 签名确实来自 yWorks。\n3. 证书确实是由\
  \ Thate 发的。（Java 插件知道如何检查来自 Thate 以及其他证书供应商的证书，也可以安装备用“根证书”。）\n\n![Image](img/13fig06.jpg)\n\
  \n**图 13.6** 安全证书\n\n\n\n\n接下来，你需要决定你想要哪些权限。你可以在沙箱权限（sandbox）和所有权限（all）之间进行选择。创建一个清单文件（参见第\
  \ 13.1.2 节，“清单”，位于第 781 页）。\n\n包含包含 `Permissions: sandbox` 或 `Permissions: all-permissions`\
  \ 行，例如：\n\n```\nManifest-Version: 1.0\nPermissions: all-permissions\n```\n\n运行 `jar`\
  \ 工具：\n\n点击此处查看代码图片\n\n```bash\njar cvfm MyApplet.jar manifest.mf mypackage/*.class\n\
  ```\n\n你的 HTML 文件中的 `applet` 元素应该有一个属性 `archive=\"MyApplet.jar\"`。\n\n最后，对 JAR 文件签名。命令如下：\n\
  \n点击此处查看代码图片\n\n```bash\njarsigner -keystore keystorefile -tsa timestampURL MyApplet.jar\
  \ keyalias\n```\n\n你需要向你的证书颁发者询问时间戳 URL。别名（alias）是由你的证书颁发者指定的。运行命令\n\n点击此处查看代码图片\n\
  \n```bash\nkeytool -keystore keystorefile -list\n```\n\n以找出它是什么。你也可以用 `keytool`\
  \ 命令的 `-changealias` 选项来更改它。（关于 `keytool` 的更多信息，请参见第二卷的第 9 章](#ch09.html_ch09)。）\n\
  \n现在，将签名的 JAR 文件和带有 `applet` 元素的 HTML 文件放置在你的 Web 服务器上。\n\n***\n\n![Image](img/note.jpg)\
  \ 注意\n\n可以非常详细地控制授予 Java 应用程序的权利；我们将在第二卷的第 12 章](#ch12.html_ch12)中讨论这一点。然而，该系统从未以一种对消费者有意义的方式投入使用。Java\
  \ 插件仅提供两种安全级别：沙箱或所有权限。\n\n***\n\n### 13.5 Java Web Start\n\nJava Web Start 是一种通过互联网分发应用程序的技术。Java\
  \ Web Start 具有以下特征：\n\n• 它们通常通过浏览器交付。一旦下载了 Java Web Start 程序，就可以不使用浏览器启动。\n\n• 它们并不位于浏览器窗口内。应用程序显示在自己的框架中，位于浏览器之外。\n\
  \n• 它们不使用浏览器的 Java 实现。浏览器每当加载 Java Web Start 描述符时，简单地启动一个外部应用程序。这与启动 Adobe Acrobat\
  \ 或 RealAudio 等其他辅助程序的机制相同。\n\n•经过数字签名的应用程序可以获得本地机器的任意访问权限。未签名的应用程序运行在“沙箱”中，禁止潜在危险的操作。\n\
  \n#### 13.5.1 分发 Java Web Start \n\n为了通过 Java Web Start 分发应用程序做准备，将其封装在一个或多个 JAR\
  \ 文件中。然后，准备一个 Java 网络启动协议（JNLP）格式的描述文件。将这些文件放在 Web 服务器上。\n\n你还需要确保你的 Web 服务器对扩展名为\
  \ `.jnlp` 的文件报告 MIME 类型 `application/x-java-jnlp-file`（浏览器使用 MIME 类型来确定启动哪个辅助程序。）详情请咨询你的\
  \ Web 服务器文档。\n\n***\n\n![Image](img/tip.jpg) 提示\n\n要尝试 Java Web Start，请从 [`http://jakarta.apache.org/tomcat`](http://jakarta.apache.org/tomcat)\
  \ 安装 Tomcat。Tomcat 是 servlet 和 JSP 页面的容器，它也提供网页。它已预配置为为 JNLP 文件提供正确的 MIME 类型。在以下指令中，我们假设你使用的是\
  \ Tomcat。\n\n***\n\n让我们尝试使用 Java Web Start 来分发第 12 章 中的计算器应用程序。按照以下步骤操作：\n\n**1.**\
  \ 编译程序。\n\n点击此处查看代码图片\n\n```bash\njavac -classpath .:jdk/jre/lib/javaws.jar webstart/*.java\n\
  ```\n\n**2.** 使用命令生成 JAR 文件：\n\n点击此处查看代码图片\n\n```bash\njar cvfe Calculator.jar webstart.Calculator\
  \ webstart/*.class\n```\n\n**3.** 准备带有以下内容的启动文件 `Calculator.jnlp`：\n\n点击此处查看代码图片\n\
  \n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<jnlp spec=\"1.0+\" codebase=\"\
  http://localhost:8080/calculator/\" href=\"Calculator.jnlp\">\n  <information>\n\
  \    <title>Calculator Demo Application</title>\n    <vendor>Cay S. Horstmann</vendor>\n\
  \    <description>A Calculator</description>\n    <offline-allowed/>\n  </information>\n\
  \  <resources>\n    <java version=\"1.6.0+\"/>\n    <jar href=\"Calculator.jar\"\
  />\n  </resources>\n  <application-desc/>\n</jnlp>\n```\n\n（注意版本号必须是 `1.6.0`，而不是\
  \ `6.0`。）\n\n启动文件格式是显而易见的。关于格式，请参见 [www.oracle.com/javawork/javase](http://www.oracle.com/javawork/javase)。\n\
  \n**4.** 将启动文件放在 `tomcat/calculator` 目录下。将以下内容放入 `tomcat/webINF` 目录：\n\n点击此处查看代码图片\n\
  \n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<web-app version=\"2.5\" xmlns=\"\
  http://java.sun.com/xml/ns/javaee\"\n    xmlns:xsi=\"http://www.w3.org/2001/XMLSchema-instance\"\
  \n    xsi:schemaLocation=\"http://java.sun.com/xml/ns/javaee http://java.sun.com/xml/ns/javaee/web-app_2_5.xsd\"\
  >\n```\n\n**5.** 将签名的 JAR 文件和带有 `applet` 元素的 HTML 文件放在你的 Web 服务器上。\n\n**6.** 将浏览器指向\
  \ JNLP 文件。例如，如果你使用 Tomcat，访问 `http://localhost:8080/calculator/jnlp`。如果你的浏览器已配置了\
  \ Java Start，你应该看到 Java Start 的启动窗口（参见图 13.7）。\n\n![Image](img/13fig7.jpg)\n\n**图\
  \ 13.7** 启动 Java Start\n\n如果你的浏览器不知道如何处理 JNLP 文件，它可能会提供将其关联到应用程序的选项。如果是这样，选择 `jdk/bin/javaws`。否则，找出如何将\
  \ MIME 类型 `application/x-java-jnlp-file` 关联到 `javaws`。你也可以尝试重新安装 JDK，它应该会完成。\n\n\
  **7.** 很快计算器就会出现，并带有标记为 Java 应用程序（参见图 13.8）。\n\n![Image](img/13fig8.jpg)\n\n**图\
  \ 13.8** 由 Java Start 分发的计算器\n\n**8.** 当你再次访问 JNLP 文件时，应用程序将从缓存获取。你可以通过 Java 插件面板查看缓存内容（参见图\
  \ 13.9）。在 Windows 中，在 Windows 控制面板查找 Java 插件。在 Linux 下，运行 `jdk/jre/bin/ControlPanel`。\n\
  \n![Image](img/13fig9.jpg)\n\n**图 13.9** 应用程序缓存\n\n***\n\n![Image](img/tip.jpg)\
  \ 提示\n\n如果你在测试 JNLP 配置时不想运行 Web 服务器，可以通过运行以下命令临时覆盖启动文件中的 `codebase` URL：\n\n点击此处查看代码图片\n\
  \n```bash\njavaws -codebase file://programDirectory JNLPfile\n```\n\n例如，在 UNIX 中，你只需从包含\
  \ JNLP 文件的目录下执行此命令：\n\n```bash\njavaws -codebase file://`pwd` Calculator.jnlp\n\
  ```\n\n\n\n当然，你并不希望用户在每次重新运行你的应用程序时都去启动缓存查看器。你可以让安装程序提供安装桌面和菜单快捷方式的选项。在 JNLP 文件中添加这些行：\n\
  \n点击此处查看代码图像\n\n```xml\n<shortcut>\n    <desktop/>\n    <menu submenu=\"Accessories\"\
  />\n</shortcut>\n```\n\n当用户首次下载应用程序时，会显示“桌面集成警告”（参见图 13.10）。\n\n![Image](img/13fig10.jpg)\n\
  \n**图 13.10** 桌面集成警告\n\n你还应该为菜单快捷方式和启动屏幕提供图标。Oracle 建议你提供 32 × 32 和 64 × 64 的像素图标。将图标文件放置在\
  \ Web 服务器上，并与 JNLP 和 JAR 文件放在一起。在 JNLP 文件的 `information` 部分添加这些行：\n\n点击此处查看代码图像\n\
  \n```xml\n<icon href=\"calc_icon32.png\" width=\"32\" height=\"32\" />\n<icon href=\"\
  calc_icon64.png\" width=\"64\" height=\"64\" />\n```\n\n注意，这些图标与应用程序图标无关。如果你想让应用程序拥有图标，需要在\
  \ JAR 文件中添加单独的图标图像，并在帧类上调用 `setIconImage` 方法。（示例请参见列表 13.1）。\n\n### 13.5.2 JNLP\
  \ API\n\n与小程序（applets）相比，Java Web Start 拥有一个用于沙箱应用程序的 API，可以提供实用的服务。JNLP API 允许沙箱应用程序以安全的方式访问本地资源。例如，存在加载和保存文件的服务。应用程序无法查看文件系统也无法指定文件名。相反，会弹出一个文件对话框，由用户选择文件。但在文件对话框弹出之前，用户会收到提醒并必须同意后继续（参见图\
  \ 13.11）。此外，该 API 并没有实际上赋予程序访问 `File` 对象的权限。特别是，应用程序无法发现文件位置。因此，程序员被赋予实现“打开文件”和“保存文件”操作的工具，但尽可能多的系统信息对不可信任的应用程序隐藏的。\n\
  \n![Image](img/13fig11.jpg)\n\n**图 13.11** Java Web Start 安全公告\n\n该 API 提供以下服务：\n\
  \n* 加载和保存文件\n* 访问剪贴板\n* 打印\n* 下载文件\n* 在默认浏览器中显示文档\n* 存储和检索持久化配置信息\n* 确保应用程序只有一个实例在运行\n\
  \n要访问服务，请如下所示使用 `ServiceManager`：\n\n点击此处查看代码图像\n\n```java\nFileSaveService service\
  \ = (FileSaveService) ServiceManager.lookup(\"javax.jnlp.FileSaveService\");\n```\n\
  \n如果服务不可用，此调用将抛出 `UnavailableServiceException`。\n\n***\n\n![Image](img/note.jpg)\
  \ 注意事项\n\n如果你想编译使用 JNLP API 的程序，必须在类路径中包含 `javaws.jar` 文件。该文件包含在 JDK 的 `jre/lib`\
  \ 子目录下。\n\n***\n\n我们现在讨论最有用的 JNLP 服务。要保存文件，需要为文件对话框提供初始路径名和文件扩展名的建议、提供要保存的数据以及建议的文件名。例如：\n\
  \n点击此处查看代码图像\n\n```java\nservice.saveFileDialog(\".\", new String[] { \"txt\" },\
  \ data, \"calc.txt\");\n```\n\n数据必须通过 `InputStream` 传递。这在安排上可能有些复杂。列表 13.6 中的程序使用了以下策略：\n\
  \n1. 它创建一个 `ByteArrayOutputStream` 来容纳要保存的字节流。\n2. 它创建一个 `PrintStream`，将其数据发送到 `ByteArrayOutputStream`。\n\
  3. 它将要保存的信息打印到 `PrintStream` 中。\n4. 它创建一个 `ByteArrayInputStream` 来读取已保存的字节流。\n5.\
  \ 它将该流传递给 `saveFileDialog` 方法。\n\n你将在第二卷的第 1 章中学习更多关于流的知识。现在，你只需略过示例程序中的细节。\n\n\
  要从文件中读取数据，请改用 `FileOpenService`。它的 `openFileDialog` 接收文件对话框的初始路径名和文件扩展名的建议，并返回一个\
  \ `FileContents` 对象。然后可以调用 `getInputStream` 和 `getOutputStream` 方法来读写文件数据。如果用户没有选择文件，`openFileDialog`\
  \ 方法将返回 `null`。\n\n点击此处查看代码图像\n\n```java\nFileOpenService service = (FileOpenService)\
  \ ServiceManager.lookup(\"javax.jnlp.FileOpenService\");\n```\n\n\n\n\nListing 13.6\
  \ 中的程序是计算器程序的简单增强。该计算器有一个虚拟纸带，可以记录所有的计算。你可以保存和加载计算历史。为了演示持久化存储，应用程序允许你设置框架标题。如果你再次运行应用程序，它将从持久化存储中检索你选择的标题（参见图\
  \ 13.13）。\n\n**Listing 13.6** `webstart/CalculatorFrame.java`\n\n点击此处查看代码\n\n```java\n\
  package webstart;\n\nimport java.io.BufferedReader;\nimport java.io.ByteArrayInputStream;\n\
  import java.io.ByteArrayOutputStream;\nimport java.io.FileNotFoundException;\nimport\
  \ java.io.IOException;\nimport java.io.InputStream;\nimport java.io.InputStreamReader;\n\
  import java.io.OutputStream;\nimport java.io.PrintStream;\nimport java.net.MalformedURLException;\n\
