  \n* *\n\n### 示例 5.10 `equals/Manager.java`\n\n点击此处查看代码图片\n\n* *\n\n```java\n1  \
  \  package equals;\n\n2\n\n3    public class Manager extends Employee\n4   {\n5\
  \      private double bonus;\n\n6\n7      public Manager(String name, double salary,\
  \ int year, int month, int day)\n8      {\n9          super(name, salary, year,\
  \ month, day);\n10          bonus = 0;\n11     }\n\n12\n13     public double getSalary()\n\
  14     {\n15          double baseSalary = super.getSalary();\n16          return\
  \ baseSalary + bonus;\n17     }\n\n18\n19     public void setBonus(double bonus)\n\
  20     {\n21          this.bonus = bonus;\n22     }\n\n23\n24     public boolean\
  \ equals(Object otherObject)\n25     {\n26          if (!super.equals(otherObject))\
  \ return false;\n\n27\n28          Manager other = (Manager) otherObject;\n\n29\n\
  30          return bonus == other.bonus;\n31     }\n\n32\n33     public int hashCode()\n\
  34     {\n35          return super.hashCode() + bonus;\n36     }\n\n37\n38     public\
  \ String toString()\n39     {\n40          return super.toString() + \",bonus=\"\
  \ + bonus;\n41     }\n42   }\n```\n\n\n\n\n`ArrayList` 管理一个内部的对象引用数组。最终，该数组的空间会耗尽。这正是数组列表发挥魔力的地方：如果你调用\
  \ `add` 且内部数组已满，数组列表会自动创建一个更大的数组，并将所有对象从较小的数组复制到较大的数组中。\n\n如果你已经知道（或有不错的推测）你想要存储多少个元素，可以在填充数组列表之前调用\
  \ `ensureCapacity` 方法：\n\n```java\nstaff.ensureCapacity(100);\n```\n\n该调用会分配一个可以包含\
  \ 100 个对象的内部数组。然后，前 100 次 `add` 调用将不会涉及任何高开销的重新分配。\n\n你也可以在向 `ArrayList` 构造函数中传递一个初始容量：\n\
  \n点击此处查看代码图像\n\n```java\nArrayList<Employee> staff = new ArrayList<>(100);\n```\n\
  \n* * *\n\n![Image](img/caution.jpg) 注意\n\n像如下所示分配一个数组列表：\n\n点击此处查看代码图像\n\n```java\n\
  new ArrayList<>(100) // 容量为 100\n```\n\n这*并不是*等同于如下分配一个新的数组：\n\n点击此处查看代码图像\n\n```java\n\
  new Employee[100] // 大小为 100\n```\n\n数组列表的容量（capacity）与数组的大小（size）之间存在重要的区别。如果你分配了一个具有\
  \ 100 个条目的数组，那么该数组就有 100 个槽位可以使用。一个容量为 100 个元素的数组列表具有持有 100 个元素的*潜力*（实际上，以额外重新分配为代价，可以超过\
  \ 100 个）但在刚开始，即使在初始构造之后，数组列表一个元素也没有包含。\n\n* * *\n\n`size` 方法返回数组列表中实际的元素数量。例如，\n\
  \n```java\nstaff.size()\n```\n\n返回 `staff` 数组列表中当前的元素数量。这等同于数组 `a` 的\n\n`a.length`\n\
  \n一旦你相当确定数组列表已达到其固定大小，就可以调用 `trimToSize` 方法。该方法会调整内存块的大小，使其恰好使用存储当前元素数量所需的存储空间。垃圾收集器将回收多的内存。\n\
  \n一旦你修剪了数组列表的大小，添加新元素将再次移动该块，这需要时间。只有当你确定不会再向数组列表添加更多元素时，才应该使用 `trimToSize`。\n\n\
  * * *\n\n![Image](img/note1.jpg) C++ 注意\n\n`ArrayList` 类类似于 C++ 的 `vector` 模板。`ArrayList`\
  \ 和 `vector` 都是泛型类型。但 C++ 的 `vector` 模板重载了 `[]` 运算符以便方便地访问元素。Java 没有运算符重载，因此必须使用显式的方法调用来代替。此外，C++\
  \ vectors 是按值复制的。如果 `a` 和 `b` 是两个 vectors，那么赋值 `a = b` 会让 `a` 变成一个与 `b` 长度相同的新 vector，所有元素都从\
  \ `b` 复制到 `a`。在 Java 中，相同的赋值会使 `a` 和 `b` 指向同一个数组列表。\n\n* * *\n\n* * *\n\n`java.util.ArrayList<E>`\
  \ **1.2**\n\n- `ArrayList<E>()` 构建一个空的数组列表。\n- `ArrayList<E>(int initialCapacity)`\
  \ 构建一个具有指定容量的空数组列表。\n\n![Image](img/247tab01.jpg)\n\n- `boolean add(E obj)` 在数组列表末尾追加一个元素。始终返回\
  \ `true`。\n\n![Image](img/247tab02.jpg)\n\n- `int size()` 返回当前存储在数组列表中的元素数量。（当然，这永远不会数组列表的容量。）\n\
  - `void ensureCapacity(int capacity)` 确保数组列表有容量存储给定数量的元素，而不重新分配其内部存储数组。\n\n![Image](img/247tab03.jpg)\n\
  \n- `void trimToSize()` 将数组列表的存储容量缩减到其当前大小。\n\n* * *\n\n### 5.3.1 访问数组列表元素\n\n遗憾的是，天下没有免费的午餐。数组列表提供的自动增长便利性需要更复杂的语法来访问元素。原因是\
  \ `ArrayList` 类并不是 Java 编程语言的一部分；它只是由某人编写并在标准库中提供的工具类。\n\n与其使用简单的 `[]` 语法来访问或更改数组元素，不如使用\
  \ `get` 和 `set` 方法。\n\n例如，要设置第 `i` 个元素，你使用\n\n```java\nstaff.set(i, harry);\n```\n\
  \n这等同于\n\n```java\na[i] = harry;\n```\n\n对于数组 `a`。（与数组一样，索引值从 0 开始。）\n\n* * *\n\n\
  ![Image](img/caution.jpg) 注意\n\n在数组列表的*size* 大于 `i` 之前，不要调用 `list.set(i, x)`。例如，以下代码是错误的：\n\
  \n点击此处查看代码图像\n\n```java\nArrayList<Employee> list = new ArrayList<>(100); // 容量为\
  \ 100\nlist.set(0, new Employee()); // 错误，因为 size 为 0\n``` 大小为 0\n```\n\n千万不要调用\
