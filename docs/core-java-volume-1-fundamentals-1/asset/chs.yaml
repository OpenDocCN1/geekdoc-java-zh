  \ setPaintTrack(boolean b)`\n如果 `b` 为 `true`，则显示滑块运行的轨道。\n\n## 12.5 菜单\n\n在本章的开始，我们介绍了你可能想要放入窗口的最常用组件，例如各种按钮、文本字段和组合框。Swing\
  \ 还支持另一种类型的用户界面元素——在 GUI 应用中常见的下拉菜单。\n\n窗口顶部的 `menu bar`（菜单栏）包含下拉菜单的名称。点击名称将打开包含\
  \ `menu items`（菜单项）和 `submenus`（子菜单）的菜单。当用户点击菜单项时，所有菜单都会关闭并向程序发送消息。图 12.19 显示了一个带有子菜单的典型菜单。\n\
  \n![Image](img/12fig19.jpg)\n\n**图 12.19** 带有子菜单的菜单\n\n### 12.5.1 构建菜单\n\n构建菜单非常简单。首先，创建一个菜单栏：\n\
  \n```java\nJMenuBar menuBar = new JMenuBar();\n```\n\n菜单栏只是一个可以添加到到任何你喜欢的地方的组件。通常情况下，你希望它出现在框架的顶部。你可以使用\
  \ `setJMenuBar` 方法将其添加到那里：\n\n```java\nframe.setJMenuBar(menuBar);\n```\n\n对于每个菜单，你都创建一个菜单对象：\n\
  \n```java\nJMenu editMenu = new JMenu(\"Edit\");\n```\n\n将顶层菜单添加到菜单栏中：\n\n```java\n\
  menuBar.add(editMenu);\n```\n\n向菜单对象添加菜单项、分隔符和子菜单：\n\n```java\nJMenuItem pasteItem\
  \ = new JMenuItem(\"Paste\");\neditMenu.add(pasteItem);\neditMenu.addSeparator();\n\
  JMenu optionsMenu = new JMenu();\neditMenu.add(optionsMenu);\n```\n\n你可以在下面的图 12.19\
  \ 中的 Paste 和 Read-only 菜单项下方看到分隔符。当用户选择一个菜单时，会触发一个动作事件。你需要为每个菜单项安装一个动作监听器：\n\n```java\n\
  ActionListener listener = ...;\npasteItem.addActionListener(listener);\n```\n\n\
  `JMenu.add(String s)` 方法方便地将菜单项添加到菜单的末尾。例如：\n\n```java\neditMenu.add(\"Paste\");\n\
  ```\n\n`add` 方法返回创建的菜单项，因此你可以捕获它并添加监听器，如下所示：\n\n```java\nJMenuItem pasteItem = editMenu.add(\"\
  Paste\");\npasteItem.addActionListener(listener);\n```\n\n通常情况下，菜单项触发的命令也可以通过工具栏按钮等用户界面元素激活。在第\
  \ 11 章中，你学习了如何通过 `Action` 对象指定命令。你定义一个实现 `Action` 接口的类（通常通过扩展 `AbstractAction` 类），在\
  \ `AbstractAction` 构造函数中指定菜单项标签，并重写 `actionPerformed` 方法以持有菜单处理器。例如：\n\n```java\n\
  Action exitAction = new AbstractAction(\"Exit\") // 此处为菜单项文本\n{\n    public void\
  \ actionPerformed(ActionEvent event) {\n        // 此处为动作代码\n        System.exit(0);\n\
  \    }\n};\n```\n\n然后你可以将该动作添加到菜单中：\n\n```java\nJMenuItem exitItem = fileMenu.add(exitAction);\n\
  ```\n\n该命令使用动作名称向菜单添加一个菜单项。动作对象成为其监听器。这仅仅是以下代码的快捷方式：\n\n```java\nJMenuItem exitItem\
  \ = new JMenuItem(exitAction);\nfileMenu.add(exitItem);\n```\n\n### javax.swing.JMenu\
  \ 1.2\n\n- `JMenu(String label)`\n使用给定标签构造菜单。\n- `JMenuItem add(JMenuItem item)`\n\
  添加一个菜单项。\n- `JMenuItem add(String label)`\n添加带有给定标签的菜单项并返回该项。\n- `JMenuItem add(Action\
  \ a)`\n添加带有动作的菜单项并返回该项。\n- `void addSeparator()`\n向菜单添加分隔符。\n- `JMenuItem insert(JMenuItem\
  \ menu, int index)`\n在指定索引处向菜单插入菜单项（或子菜单）。\n- `JMenuItem insert(Action a, int index)`\n\
  在指定索引处插入带有动作的菜单项。\n- `void insertSeparator(int index)`\n在菜单处插入分隔符。\n\n![Image](img/681tab01.jpg)\n\
  \n- `void remove(int index)`\n- `void remove(JMenuItem item)`\n从菜单中移除项。\n\n### javax.swing.JMenuItem\
  \ 1.2\n\n- `JMenuItem(String label)`\n使用给定标签构造菜单项。\n- `JMenuItem(Action a)` 1.3\n\
  为给定动作构造菜单项。\n\n### javax.swing.AbstractButton 1.2\n\n- `void setAction(Action a)`\
  \ 1.3\n为此按钮或菜单项设置动作。\n\n### javax.swing.JFrame 1.2\n\n- `void setJMenuBar(JMenuBar\
  \ menubar)`\n为此框架设置菜单栏。\n\n#### 12.5.2 菜单项中的图标\n\n菜单项与按钮非常相似。事实上，`JMenuItem` 类扩展了\
  \ `AbstractButton` 类。就像按钮一样，可以只有文本标签、只有图标或两者都有。你可以通过 `JMenuItem(String, Icon)` 或\
  \ `JMenuItem(Icon)` 构造函数指定图标，也可以使用 `JMenuItem` 类继承自 `AbstractButton` 类的 `setIcon`\
  \ 方法进行设置。例如：\n\n```java\nJMenuItem cutItem = new JMenuItem(\"Cut\", new ImageIcon(\"\
  cut.gif\"));\n```\n\n在图 12.19 中，你可以看到多个菜单项带有图标。默认情况下，菜单项文本位于图标右侧。如果你希望文本放在左侧，可以调用\
  \ `JMenuItem` 类继承自 `AbstractButton` 类的 `setHorizontalTextPosition` 方法。例如，调用调用\n\n\
  ```java\ncutItem.setHorizontalTextPosition(SwingConstants.LEFT);\n```\n\n会将菜单项文本移动到图标左侧。\n\
  \n你也可以为动作添加图标：\n\n\n\n\n\n```java\ncutAction.putValue(Action.SMALL_ICON, new ImageIcon(\"\
  cut.gif\"));\n```\n\n当你根据 `Action` 构造一个菜单项时，`Action.NAME` 值将成为菜单项的文本，而 `Action.SMALL_ICON`\
  \ 值将成为图标。\n\n或者，你也可以在 `AbstractAction` 构造函数中设置图标：\n\n点击此处查看代码图片\n\n```java\ncutAction\
  \ = new AbstractAction(\"Cut\", new ImageIcon(\"cut.gif\"))\n{\n    public void\
  \ actionPerformed(ActionEvent event)\n    {\n        . . .\n    }\n};\n```\n\n***\n\
  \n### javax.swing.JMenuItem **1.2**\n\n• `JMenuItem(String label, Icon icon)`\n\
  使用给定的标签和图标构造菜单项。\n\n***\n\n***\n\n### javax.swing.AbstractButton **1.2**\n\n• `void\
