  \n#### 14.5.2 竞态条件解释\n\n在上一节中，我们运行了一个多个线程更新银行账户余额的程序。一段时间后，错误出现了，某些资金丢失了或凭空产生。这个问题发生在两个线程同时尝试更新一个账户时。假设两个线程同时执行指令\n\
  \n`accounts[to] += amount;`\n\n问题在于这些不是原子*操作。该指令可能会按以下方式处理：\n\n1. 将 `accounts[to]`\
  \ 加载到寄存器。\n2. 加上 `amount`。\n3. 将结果移回 `accounts[to]`。\n\n现在，假设第一个线程执行步骤 1 和 2，然后被抢占。假设第二个线程醒并更新同一个条目。然后第一个线程恢复并完成步骤\
  \ 3。\n\n该操作覆盖了另一个线程的修改。结果是总和不再正确（参见图 14.4）。\n\n![Image](img/14fig04.jpg)\n\n**图\
  \ 14.4** 线程并发访问\n\n我们的测试程序检测到了这种损坏。（当然，如果线程在执行测试时被中断，会有极小的概率出现误报！）\n\n***\n\n![Image](img/note.jpg)\
