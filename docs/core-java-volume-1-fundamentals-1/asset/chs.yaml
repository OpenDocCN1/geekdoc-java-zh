  ![Image](img/846tab01.jpg)\n\n#### 14.1.1 使用线程为其他任务机会\n\n我们将通过在单独线程中运行移动球的代码，让我们的跳球程序更具响应性。事实上，你将启动多个球，每个球都由它自己的线程移动。此外，AWT\
  \ `event dispatch thread`（事件调度线程）将继续并行运行，处理用户界面事件。由于每个线程都有运行的机会，事件调度线程有机会在球跳动时注意到用户用户点击了\
  \ `Close` 按钮。然后该线程就可以处理“关闭”操作。\n\n我们使用跳球代码作为示例，让你直观地感受到并发的必要性。通常情况下，你需要警惕任何长时间的计算。你的计算很可能是某些框架的一部分，例如\
  \ GUI 或 Web 框架。每当框架调用你的某个方法时，通常期望它能快速返回。如果你需要执行任何耗时很长的任务，你的任务应该并发运行。\n\n以下是在单独线程中运行任务的简易步骤：\n\
  \n1.  将任务代码放入实现 `Runnable` 接口的类的 `run` 方法中。该接口非常简单，只有一个方法：\n```java\npublic interface\
  \ Runnable\n{\n    void run();\n}\n```\n由于 `Runnable` 是一个函数接口，你可以使用 lambda 表达式创建一个实例：\n\
  点击此处查看代码图片\n```java\nRunnable r = () -> { task code };\n```\n2.  从 `Runnable` 构建一个\
  \ `Thread` 对象：\n```java\nThread t = new Thread(r);\n```\n3.  启动线程：\n```java\nt.start();\n\
  ```\n\n为了让我们的跳球程序成为单独线程，我们只需要将动画代码放在 `run` 方法中，然后启动线程：\n点击此处查看代码图片\n```java\nRunnable\
  \ r = () -> {\n    try\n    {\n        for (int i = 1; i <= STEPS; i++)\n      \
  \  {\n            ball.move(comp.getBounds());\n            comp.repaint();\n  \
  \          Thread.sleep(DELAY);\n        }\n    }\n    catch (InterruptedException\
  \ e)\n    {\n    }\n};\n\nThread t = new Thread(r);\nt.start();\n```\n\n再次，我们需要捕获\
  \ `sleep` 方法可能抛出的 `InterruptedException`。我们将在下一节讨论此异常。通常，中断用于请求终止线程。因此，当发生 `InterruptedException`\
  \ 时，我们的 `run` 方法会退出。\n\n每当点击 Start 按钮时，球都在新线程中移动（参见图 14.2）。\n\n![Image](img/14fig02.jpg)\n\
  \n**图 14.2** 运行多个线程\n\n这就是并行任务的全部！本章的剩余部分将介绍如何控制线程之间的交互。\n\n完整代码如列表 14.4。\n\n![Image](img/note.jpg)\
  \ 注意\n\n你可以通过形成 `Thread` 类的子类来定义线程，如下：\n```java\nclass MyThread extends Thread\n\
  {\n    public void run()\n    {\n        task code\n    }\n}\n```\n然后构造子类的对象并调用其\
  \ `start` 方法。然而，这种方法不再被推荐。你应该将要并行运行的任务与运行任务的机制解耦。如果你有很多任务，为每个任务创建一个单独线程的开销太大了。相反，你可以使用线程池——参见第\
  \ 14.9 节“Executors](#ch14a.html_ch14lev1sec9)”，第 920 页。\n\n\n\n\n*不要*调用 `Thread`\
  \ 类的 `run` 方法或 `Runnable` 对象的 `run` 方法。直接调用 `run` 方法仅仅是在*相同*线程中执行任务——不会启动新线程。请调用\
  \ `Thread.start` 方法。它会创建一个新线程来执行 `run` 方法。\n\n***\n\n**列表 14.4** `bounceThread/BounceThread.java`\n\
  \n点击此处查看代码图像\n\n***\n\n```java\npackage bounceThread;\n\nimport java.awt.*;\nimport\
  \ java.awt.event.*;\n\nimport javax.swing.*;\n\n/**\n * 显示动画跳动的小球。\n * @version\
  \ 1.34 2015-06-21\n * @author Cay Horstmann\n */\npublic class BounceThread\n{\n\
  \    public static void main(String[] args)\n    {\n        EventQueue.invokeLater(()\
  \ -> {\n            JFrame frame = new BounceFrame();\n            frame.setTitle(\"\
  BounceThread\");\n            frame.setDefaultCloseOperation(JFrame.EXIT_ON_CLOSE);\n\
  \            frame.setVisible(true);\n        });\n    }\n}\n\n/**\n * 带有面板和按钮的框架。\n\
  \ */\nclass BounceFrame extends JFrame\n{\n    private BallComponent comp;\n   \
  \ public static final int STEPS = 1000;\n    public static final int DELAY = 5;\n\
  \n    /**\n     * 构造带有跳动小球显示组件以及 Start 和 Close 按钮的框架。\n     */\n    public BounceFrame()\n\
  \    {\n        comp = new BallComponent();\n        add(comp, BorderLayout.CENTER);\n\
  \        JPanel buttonPanel = new JPanel();\n        addButton(buttonPanel, \"Start\"\
  , event -> addBall());\n        addButton(buttonPanel, \"Close\", event -> System.exit(0));\n\
  \        add(buttonPanel, BorderLayout.SOUTH);\n        pack();\n    }\n\n    /**\n\
  \     * 向容器添加按钮。\n     * @param c 容器\n     * @param title 按钮标题\n     * @param listener\
  \ 按钮的动作监听器\n     */\n    public void addButton(Container c, String title, ActionListener\
  \ listener)\n    {\n        JButton button = new JButton(title);\n        c.add(button);\n\
  \        button.addActionListener(listener);\n    }\n\n    /**\n     * 向画布添加一个跳动的球并启动一个线程让它跳动。\n\
  \     */\n    public void addBall()\n    {\n        Ball ball = new Ball();\n  \
  \      comp.add(ball);\n        Runnable r = () -> {\n            try {\n      \
  \          for (int i = 1; i <= STEPS; i++) {\n                    ball.move(comp.getBounds());\n\
  \                    comp.repaint();\n                    Thread.sleep(DELAY);\n\
  \                }\n            } catch (InterruptedException e) {\n           \
  \ }\n        };\n        Thread t = new Thread(r);\n        t.start();\n    }\n\
  }\n```\n\n***\n\n`java.lang.Thread`\n\n- `Thread(Runnable target)` 构造一个新线程并调用指定目标的\
  \ `run()` 方法。\n- `void start()` 启动该线程，导致 `run()` 方法被调用。此方法立即返回。新线程并发运行。\n- `void\
  \ run()` 调用关联 `Runnable` 的 `run` 方法。\n\n***\n\n`java.lang.Runnable`\n\n- `void run()`\
  \ 必须被重写，并提供你想要执行的任务的指令。\n\n***\n\n### 14.2 中断线程\n\n线程在它的 `run` 方法返回时终止——通过执行 `return`\
  \ 语句、执行完方法体中的最后一个语句，或者发生了在方法中未被捕获的异常。在 Java 的初始版本中，还有一个 `stop` 方法，另一个线程可以调用它来终止线程。然而，该方法现在已经废弃。我们将在第\
  \ 14.5.15 节“为什么 `stop` 和 `suspend` 方法被废用”中讨论原因，位于第 896 页。\n\n除了废弃 `stop` 方法外，没有办法可以*强制*终止线程。但是可以使用\
  \ `interrupt` 方法来*请求*终止线程。\n\n当在线程上调用 `interrupt` 方法时，该线程的*中断状态*（interrupted status）会被设置。这是一个存在于每个线程中的\
  \ `boolean` 标志。每个线程都应该偶尔检查自己是否被中断。\n\n要确定中断状态是否被设置，首先调用静态方法 `Thread.currentThread`\
  \ 获取当前线程，然后调用 `isInterrupted` 方法：\n\n点击此处查看代码图像\n\n```java\nwhile (!Thread.currentThread().isInterrupted()\
  \ && more work to do)\n{\n    do more work\n}\n```\n\n\n\n\n- 在 `catch` 句中，调用 `Thread.currentThread().interrupt()`\
  \ 来设置中断状态。然后调用者就可以对其进行测试。\n\n点击此处查看代码图像\n\n```java\nvoid mySubTask()\n{\n   . .\
  \ .\n   try { sleep(delay); }\n   catch (InterruptedException e) { Thread.currentThread().interrupt();\
  \ }\n   . . .\n}\n```\n\n- 或者，更好的方法是，在你的方法上标记 `throws InterruptedException` 并丢弃\
  \ `try` 块。这样调用者（或最终的 `run` 方法）就可以捕获该异常。\n\n点击此处查看代码图像\n\n```java\nvoid mySubTask()\
  \ throws InterruptedException\n{\n   . . .\n   sleep(delay);\n   . . .\n}\n```\n\
  \n* *\n\njava.lang.Thread 1.0\n\n- `void interrupt()` 向线程发送中断请求。线程的中断状态被设置为 `true`。如果线程当前正阻塞于\
  \ `sleep` 的调用，则会抛出一个 `InterruptedException`。\n\n- `static boolean interrupted()`\
  \ 测试*当前*线程（即正在执行此指令的线程）是否被中断。注意，这是一个静态方法。该调用具有副作用——它会将当前线程的中断状态重置为 `false`。\n\n\
  - `boolean isInterrupted()` 测试一个线程是否被中断。与 `static interrupted` 方法不同，此调用不会改变线程的中断状态。\n\
  \n- `static Thread currentThread()` 返回代表当前执行线程的 `Thread` 对象。\n\n* *\n\n### 14.3\
  \ 线程状态\n\n线程可以处于六种状态之一：\n\n- 新建 (New)\n- 可运行 (Runnable)\n- 阻塞 (Blocked)\n- 等待 (Waiting)\n\
  - 定时等待 (Timed waiting)\n- 已终止 (Terminated)\n\n这些状态中的每一个将在随后的章节中进行解释。\n\n要确定线程的当前状态，只需调用\
  \ `getState` 方法即可。\n\n#### 14.3.1 新的线程\n\n当你使用 `new` 操作符创建一个线程时——例如，`new Thread(r)`——线程尚未运行。这意味着它处于*新*（new）状态。当线程处于新建状态时，程序尚未开始执行其内部的代码。在线程运行之前，需要完成一些记录性工作。\n\
  \n#### 14.3.2 可运行的线程\n\n一旦调用了 `start` 方法，线程就处于*可运行*（runnable）状态。一个可运行的线程可能正在运行，也可能没有。给线程分配运行时间取决于操作系统。（不过，Java\
  \ 规范并没有将其称为一个独立的状态。运行中的线程仍然处于可运行状态。）\n\n一旦线程开始运行，它并不一定会持续运行。事实上，运行中的线程偶尔暂停是理想的，这样其他线程才有机会运行。线程调度的细节取决于操作系统所提供的服务。抢占式调度系统为每个可运行线程分配一个时间片来执行其任务。当该时间片耗尽时，操作系统会*抢占*该线程并给另一个线程工作的机会（参见图\
  \ 14.4）。在选择下一个线程时，操作系统会考虑线程的*优先级*——更多信息请参阅第 14.4.1 节，“线程优先级](#ch14.html_ch14lev2sec6)”，位于第\
  \ 858 页。\n\n所有现代桌面和服务器操作系统都使用抢占式调度。然而，手机等小型设备可能使用协作式调度。在这样的设备中，线程只有在调用 `yield` 方法或被阻塞或等待时才会失去控制权。\n\
  \n在具有多个处理器的机器上，每个处理器都可以运行一个线程，你可以让多个线程并行运行。当然，如果线程数多于处理器，调度器仍然必须进行时间分片。\n\n始终记住，一个可运行线程在任何时刻可能正在运行，也可能没有运行。（这就是为什么该状态被称为“可运行”而不是“正在运行”。）\n\
  \n#### 14.3.3 阻塞和等待的线程\n\n当线程被阻塞或等待时，它是临时不活跃的。它不执行任何代码并消耗极少的资源。重新激活它取决于线程调度器。细节取决于如何进入不活跃状态。\n\
  \n- 当线程尝试获取当前由另一个线程持有的内部对象锁（不是 `java.util.concurrent` 库中的 `Lock`）时，它会变为*阻塞*状态。（我们在第\
  \ 14.5.3 节，“锁对象](#ch14.html.ch14lev2sec11)”，位于第 868 页讨论锁对象，并在第 14.5.5 节，“`synchronized`\
  \ 关键字](#ch14.html_ch14lev2sec13)”，位于第 878 页讨论内部对象锁）\n\n- 当线程等待通知时，它进入*等待*（waiting）状态。这是通过在第\
  \ 14.5.3 节中调用 `wait` 或 `notify` 实现的。\n\n- 若干方法具有超时功能。调用它们会导致线程进入定时等待状态。该状态一直持续到超时过期或收到通知。具有超时的方法包括\
  \ `sleep`、`wait`、`join` 和 `await`。\n\n点击此处查看代码图像\n\n![图 14.3](img/14fig03.jpg)\n\
  **图 14.3** 线程状态\n\n#### 14.3.4 已终止的线程\n\n线程因两个原因之一终止：\n\n- 因为 `run` 方法正常退出而自然死亡。\n\
  - 因为一个未捕获的异常终止了 `run` 方法而突然死亡。\n\n特别是，你可以通过调用 `stop` 方法来杀死线程。该方法会抛出一个 `ThreadDeath`\
  \ 错误杀死线程。然而，`stop` 方法已被废弃，你不应该在自己的代码中调用它。\n\n### 14.4 线程属性\n\n在后续章节中，我们将讨论线程的各种属性：线程优先级、守护线程、线程组以及未捕获异常的处理器。\n\
  \n#### 14.4.1 线程优先级\n\n在 Java 编程语言中，每个线程都有优先级。默认情况下，线程继承构造它的线程的优先级。你可以使用 `setPriority`\
  \ 方法增加或减少任何线程的优先级。你可以将优先级设置为从 `MIN_PRIORITY`（在 `Thread` 类中定义为 `1`）到 `MAX_PRIORITY`（定义为\
  \ `10`）之间的任何值。`NORM_PRIORITY` 定义为 `5`。\n\n\n\n\n\n当线程调度器有机会选择新线程时，它偏好于优先级更高的线程。然而，线程优先级是`高度依赖于系统的`。当虚拟机依赖于宿主平台的线程实现时，Java\
  \ 线程优先级会被映射到宿主平台的优先级级别，而宿主平台可能有更多或更少的线程优先级级别。\n\n例如，Windows 有七个优先级级别。某些 Java 优先级将映射到相同的操作系统级别。在用于\
  \ Linux 的 Oracle JVM 中，线程优先级被完全忽略了——所有线程具有相同的优先级。\n\n初级程序员有时会过度使用线程优先级。调整优先级的理由很少。你绝对不应该这样设计你的程序结构，使其程序的正确运行依赖于优先级级别。\n\
  \n***\n\n![Image](img/caution.jpg) 注意\n\n如果你确实使用了优先级，应该意识到一个常见的初学者错误。如果你有多个高优先级线程且它们不进入空闲状态，低优先级线程可能`永远`不会执行。每当调度器决定运行新线程时，它都会首先从最高优先线程中进行选择，即使这会导致低优先级线程完全饥饿。\n\
  \n***\n\n***\n\n### `java.lang.Thread` 1.0\n\n- `void setPriority(int newPriority)`\n\
  设置此线程的优先级。优先级必须在 `Thread.MIN_PRIORITY` 和 `Thread.MAX_PRIORITY` 之间。使用 `Thread.NORM_PRIORITY`\
  \ 设置普通优先级。\n\n- `static int MIN_PRIORITY`\n`Thread` 可以拥有的最低优先级。最小优先级值为 `1`。\n\n\
  - `static int NORM_PRIORITY`\n`Thread` 的默认优先级。默认优先级为 `5`。\n\n- `static int MAX_PRIORITY`\n\
  `Thread` 可以拥有的最高优先级。最大优先级值为 `10`。\n\n- `static void yield()`\n导致当前执行的线程让出 CPU。如果有其他优先级至少与此线程优先级相同的可运行线程，它们将在下一个被调度。请注意这是一个静态方法。\n\
  \n***\n\n#### 14.4.2 守护线程\n\n你可以通过调用以下代码将线程转换为`daemon thread`（守护线程）：\n\n```\nt.setDaemon(true);\n\
  ```\n\n这种线程并没有什么“守护”属性。守护线程仅仅是一个除了服务他人之外没有其他角色的线程。例如向其他线程发送定期“定时器滴答”的定时器线程，或者清理过时的缓存条目的线程。当只剩下守护线程时，虚拟机就会退出。如果所有剩余线程都是守护线程，那么保持程序运行就没有意义。\n\
  \n初学者有时会误用守护线程，因为他们不想考虑关闭操作。然而，这可能是危险的。守护线程永远不应该访问持久化资源（如文件或数据库），因为它可以随时终止，甚至是在操作的中间。\n\
  \n***\n\n### `java.lang.Thread` 1.0\n\n- `void setDaemon(boolean isDaemon)`\n将此线程标记为守护线程或用户线程。此方法必须在线程启动之前调用。\n\
  \n***\n\n#### 14.4.3 未捕获异常的处理器\n\n线程的 `run` 方法不能抛出任何检查异常（checked exceptions），但它可以被运行时异常（unchecked\
  \ exception）终止。在这种情况下，线程会死亡。\n\n然而，没有`catch` 子可以传播异常。相反，在线程死亡之前，异常会被传递给未捕获异常的处理器。\n\
  \n该处理器必须属于实现 `Thread.UncaughtExceptionHandler` 接口的类。该接口有一个方法：\n\n点击查看代码图片\n\n```\n\
  void uncaughtException(Thread t, Throwable e)\n```\n\n你可以通过 `setUncaughtExceptionHandler`\
  \ 方法为任何线程安装一个处理器。你也可以使用 `Thread` 类的静态方法 `setDefaultUncaughtExceptionHandler` 为所有线程安装一个默认处理器。替换的处理器可以使用日志\
  \ API 将未捕获异常的报告发送到日志文件中。\n\n如果你没有安装默认处理器，则默认处理器为 `null`。但是，如果你没有为单个线程安装处理器，则处理器是该线程的\
  \ `ThreadGroup` 对象。\n\n***\n\n![Image](img/note.jpg) 注意\n\n线程组是可以一起管理的线程的集合。默认情况下，你创建的所有线程都属于同一个线程组，但也可以建立其他的分组。由于现在有了更好的功能来操作线程集合，我们建议你不要在程序中使用线程组。\n\
  \n***\n\n`ThreadGroup` 类实现了 `Thread.UncaughtExceptionHandler` 接口。它的 `uncaughtException`\
  \ 方法执行以下操作：\n\n1. **如果线程组有父线程组，则调用父线程组的 `uncaughtException` 方法。**\n2. **否则，如果 `Thread.getDefaultUncaughtExceptionHandler`\
  \ 方法返回一个非 `null` 处理器，则调用它。**\n3. **否则，如果 `Throwable` 是 `ThreadDeath` 实例，则什么都不会发生。**\n\
  4. **否则，线程名称和 `Throwable` 的堆栈跟踪将打印在 `System.err` 上。**\n\n这就是你无疑在程序中见过很多次的堆栈跟踪。\n\
  \n***\n\n### `java.lang.Thread` 1.0\n\n- `static void setDefaultUncaughtExceptionHandler(Thread.UncaughtExceptionHandler\
  \ handler)` 5.0\n- `static Thread.UncaughtExceptionHandler getDefaultUncaughtExceptionHandler()`\
  \ 5.0\n设置或获取未捕获异常的默认处理器。\n\n- `void setUncaughtExceptionHandler(Thread.UncaughtExceptionHandler\
  \ handler)` 5.0\n- `Thread.UncaughtExceptionHandler getUncaughtExceptionHandler()`\
  \ 5.0\n设置或获取未捕获异常的处理器。如果未安装处理器，则线程对象就是处理器。\n\n***\n\n### `java.lang.Thread.UncaughtExceptionHandler`\
  \ 5.0\n\n- `void uncaughtException(Thread t, Throwable e)`\n用于在线程因未捕获异常终止时记录自定义报告。\n\
  \n![Image](img/861tab01.jpg)\n\n***\n\n***\n\n### `java.lang.ThreadGroup` 1.0\n\n\
  - `void uncaughtException(Thread t, Throwable e)`\n如果存在父线程组，则调用父线程组的此方法；否则调用 `Thread`\
  \ 类的默认处理器；否则在标准错误流中打印堆栈跟踪。（然而，如果 `e` 是 `ThreadDeath` 对象，则抑制堆栈跟踪。`ThreadDeath` 对象是由已弃的\
  \ `stop` 方法生成的。）\n\n***\n\n### 14.5 同步\n\n在大多数实际的多线程应用程序中，两个或多个线程需要共享数据访问如果两个线程访问同一个对象并各自调用修改对象状态的方法会发生什么？正如你想象的，线程可能会相互干扰。取决于访问数据的顺序，可能会导致对象损坏。这种情况通常被称为*竞态条件*（race\
  \ condition）。\n\n#### 14.5.1 竞态条件的示例\n\n为了防止多个线程损坏共享数据，你必须学习如何*同步访问*。在本节中，你将看到如果不使用同步会发生什么。在下一节中，你将看到如何同步数据访问。\n\
  \n在下一个测试程序中，我们模拟一个拥有多个账户的银行。我们随机生成在这些账户之间移动资金的交易。每个账户有一个线程。每次交易将随机金额从该线程服务的账户移动到另一个随机账户。\n\
  \n模拟代码非常直观。我们有一个 `Bank` 类，其中包含 `transfer` 方法。该方法将某些金额从一个账户转移到另一个账户。（我们还不担心账户余额为）。这是\
  \ `Bank` 类 `transfer` 方法的代码。\n\n```\npublic void transfer(int from, int to, double\
  \ amount)\n```\n\n\n\n\n\n```java\n// CAUTION: unsafe when called from multiple\
  \ threads\n{\n    System.out.print(Thread.currentThread());\n    accounts[from]\
  \ -= amount;\n    System.out.printf(\" %10.2f from %d to %d\", amount, from, to);\n\
  \    accounts[to] += amount;\n    System.out.printf(\" Total Balance: %10.2f%n\"\
  , getTotalBalance());\n}\n```\n\n这里是 `Runnable` 实例的代码。`run` 方法不断地从指定的银行账户中提取资金。在每次迭代中，`run`\
  \ 方法会选取一个随机目标账户和一个随机金额，调用 `bank` 对象的 `transfer` 方法，然后睡眠。\n\n点击此处查看代码图片\n\n```java\n\
  Runnable r = () -> {\n    try {\n        while (true) {\n            int toAccount\
  \ = (int) (bank.size() * Math.random());\n            double amount = MAX_AMOUNT\
  \ * Math.random();\n            bank.transfer(fromAccount, toAccount, amount);\n\
  \            Thread.sleep((int) (DELAY * Math.random()));\n        }\n    } catch\
  \ (InterruptedException e) {\n    }\n};\n```\n\n当此模拟运行时，我们并不知道任何时候任何一个银行账户中有多少钱。但我们知道，所有账户的总金额应该保持不变，因为我们所做的只是将从一个账户转移到另一个账户。\n\
  \n在每笔交易结束时，`transfer` 方法会重新计算总和并将其打印。\n\n该程序永远不会结束。只需按 `Ctrl+C` 杀死程序。\n\n这是一段典型的输出：\n\
  \n点击此处查看代码图片\n\n```text\n. . .\nThread[Thread-11,5,main]    588.48 from 11 to 44\
  \ Total Balance: 100000.00\nThread[Thread-12,5,main]    976.11 from 12 to 22 Total\
  \ Balance: 100000.00\nThread[Thread-14,5,main]    521.51 from 14 to 22 Total Balance:\
  \ 100000.00\nThread[Thread-13,5,main]    359.89 from 13 to 81 Total Balance: 100000.00\n\
  . . .\nThread[Thread-36,5,main]    401.71 from 36 to 73 Total Balance:  99291.06\n\
  Thread[Thread-35,5,main]    691.46 from 35 to 77 Total Balance:  99291.06\nThread[Thread-37,5,main]\
  \      78.64 from 37 to 3 Total Balance:  99291.06\nThread[Thread-34,5,main]   \
  \ 197.11 from 34 to 69 Total Balance:  99291.06\nThread[Thread-36,5,main]     85.96\
  \ from 36 to 4 Total Balance:  99291.06\n. . .\nThread[Thread-4,5,main]Thread[Thread-33,5,main]\
  \       7.31 from 31 to 32 Total Balance:\n99979.24\n      627.50 from 4 to 5 Total\
  \ Balance: 99979.24\n. . .\n```\n\n如你所见，出了非常严重的问题。对于几次交易，银行余额保持在 $100,000，这是 100\
  \ 个每个 $1,000 账户的正确总额。但过段时间后余额发生了轻微变化。当你运行此程序时，错误可能会很快发生，或者余额可能需要很长时间才会变得损坏。这种情况并不令人产生信心，你可能不想把辛苦赚的钱存入这样的银行。\n\
  \n代码列表 14.5 和 14.6 中的程序提供了完整的源代码。看下你是否能发现代码中的问题。我们将在下一节中解开这个谜团。\n\n### 代码列表 14.5\
  \ `unsynch/UnsynBankTest.java`\n点击此处查看图片\n\n```java\npackage unsynch;\n\n/**\n *\
  \ 此程序展示了当多个线程访问数据结构时出现的数据损坏。\n * @version 1.3 2015-06-21\n * @author Cay\n */\n\
  public class UnsynBankTest {\n    public static final int ACCOUNTS = 100;\n    public\
  \ static final double INITIAL_BALANCE = 1000;\n    public static final double MAX_AMOUNT\
  \ = 1000;\n    public static final int DELAY = 10;\n\n    public static void main(String[]\
  \ args) {\n        Bank bank = new Bank(ACCOUNTS, INITIAL_BALANCE);\n        for\
  \ (int i = 0; i < ACCOUNTS; i++) {\n            int fromAccount = i;\n         \
  \   Runnable r = () -> {\n                try {\n                    while (true)\
  \ {\n                        int toAccount = (int) (bank.size() * Math.random());\n\
  \                        double amount = MAX_AMOUNT * Math.random();\n         \
  \               bank.transfer(fromAccount, toAccount, amount);\n               \
  \         Thread.sleep((int) (DELAY * Math.random()));\n                    }\n\
  \                } catch (InterruptedException e) {\n                }\n       \
  \     };\n            Thread t = new Thread(r);\n            t.start();\n      \
  \  }\n    }\n}\n```\n\n### 代码列表 14.6 `unsynch/Bank.java`\n点击此处查看图片\n\n```java\n\
