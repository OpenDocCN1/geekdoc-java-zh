  \ 类来显示简单的对话框。在本节中，你将看到如何手动创建一个这样的对话框。\n\n图 12.38 显示了一个典型的模态对话框——当用户点击“关于（About）”按钮时显示的程序信息框。\n\
  \n![Image](img/12fig38.jpg)\n\n**图 12.38** 一个“关于”对话框\n\n要实现一个对话框，你需要扩展 `JDialog`\
  \ 类。这与为应用程序创建主窗口时扩展 `JFrame` 的过程本质是相同的。具体步骤如下：\n\n1.  在你的对话框构造函数中，调用父类 `JDialog`\
  \ 的构造函数。\n2.  添加对话框的用户界面组件。\n3.  添加事件处理器。\n4.  设置对话框的大小。\n\n当你调用父类构造函数时，你需要提供*所有者框架（owner\
  \ frame）*、对话框标题以及*模态性（modality）*。\n\n所有者框架控制对话框显示的位置。你可以提供 `null` 作为所有者；这样，对话框由一个隐藏的框架所有。\n\
  \n模态性指定了对话框显示期间应用程序的哪些窗口会被阻塞。非模态对话框（modeless dialog）不会阻塞其他窗口。模态对话框（modal dialog）会阻塞应用程序的所有其他窗口（对话框的子窗口除外）。对于用户可以随时访问的工具箱，可以使用非模态对话框。如果你想强制用户在继续操作之前提供所需信息，则应使用模态对话框。\n\
  \n***\n\n![Image](img/note.jpg) 注意\n\n从 Java SE 6 开始，新增了两种模态性类型。文档模态对话框（document-modal\
  \ dialog）会阻塞属于同一个“文档”的所有窗口，更准确地说，会阻塞所有与对话框具有相同无根根窗口的窗口。这解决了帮助系统中的问题。在旧版本中，当模态对话框弹出时，用户无法与帮助窗口进行交互。工具包模态对话框（toolkit-modal\
  \ dialog）会阻塞来自同一个“工具包（toolkit）”的所有窗口。工具包是一个启动多个应用程序的 Java 程序，例如浏览器中的 applet 引擎。关于这些高级问题的更多信息，请参阅\
  \ [`www.oracle.com/technetwork/articles/javase/modality-137604.html`](http://www.oracle.com/technetwork/articles/javase/modality-137604.html)。\n\
  \n***\n\n以下是对话框的代码：\n\n点击此处查看代码图片\n\n```java\npublic class AboutDialog extends JDialog\n\
  {\n    public AboutDialog(JFrame owner)\n    {\n      super(owner, \"About DialogTest\"\
  , true);\n      add(new JLabel(\n          \"<html><h1><i>Core Java</i></h1><hr>By\
  \ Cay Horstmann</html>\"),\n          BorderLayout.CENTER);\n      JPanel panel\
  \ = new JPanel();\n      JButton ok = new JButton(\"OK\");\n      ok.addActionListener(event\
  \ -> setVisible(false));\n      panel.add(ok);\n      add(panel, BorderLayout.SOUTH);\n\
  \      setSize(250, 150);\n    }\n}\n```\n\n如你所示，构造函数添加了用户界面元素——在本例中是标签和按钮。它为按钮添加了处理器并设置了对话框的大小。\n\
  \n要显示对话框，创建一个新的对话框对象并使其可见：\n\n点击此处查看代码图片\n\n```java\nJDialog dialog = new AboutDialog(this);\n\
  dialog.setVisible(true);\n```\n\n实际上，在下方的示例代码中，我们只创建了一次对话框，每用户点击“关于”按钮时都可以重复使用它。\n\
  \n点击此处查看代码图片\n\n```java\nif (dialog == null) // 第一次\n    dialog = new AboutDialog(this);\n\
  dialog.setVisible(true);\n```\n\n当用户点击 OK 按钮时，对话框应该关闭。这在 OK 按钮的事件处理器中处理：\n\n点击此处查看代码图片\n\
  \n```java\nok.addActionListener(event -> setVisible(false));\n```\n\n当用户通过点击关闭按钮关闭对话框时，对话框也会被隐藏。就像\
  \ `JFrame` 一样，你可以通过 `setDefaultCloseOperation` 方法覆盖此行为。\n\n列表 12.17 是测试程序框架类的代码。列表\
  \ 12.18 显示了对话框类。\n\n**列表 12.17** `dialog/DialogFrame.java`\n\n点击此处查看代码图片\n\n***\n\
  \n```java\npackage dialog;\n\nimport javax.swing.JFrame;\nimport javax.swing.JMenu;\n\
  import javax.swing.JMenuBar;\nimport javax.swing.JMenuItem;\n\n/**\n * 一个带有菜单->关于的框架，显示了一个对话框。\n\
  \ */\npublic class DialogFrame extends JFrame\n{\n    private static int DEFAULT_WIDTH\
