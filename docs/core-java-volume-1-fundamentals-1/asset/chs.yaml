  \ 12.24）。\n\n工具栏的特殊之处在于，你可以将它们移动到其他地方。你可以将工具栏拖到框架的四个边界之一（参见图 12.25）。当你释放鼠标按钮时，工具栏将掉落到新位置（参见图\
  \ 12.26）。\n\n如果工具栏位于具有边界布局（border layout）的容器中，或者任何支持 `North`、`East`、`South` 和 `West`\
  \ 约束的布局管理器中，拖拽功能即可生效。\n\n工具栏甚至可以从框架中完全分离。分离后的工具栏被包含在它自己的框架中（参见图 12.27）。当你关闭包含分离工具栏的框架时，工具栏将跳回到原始框架。\n\
  \n工具栏的编程非常简单。向工具栏中添加组件即可：\n\n```java\nJToolBar bar = new JToolBar();\nbar.add(blueButton);\n\
  ```\n\n`JToolBar` 类还有一个方法可以添加 `Action` 对象。只需像这样用 `Action` 对象填充工具栏即可：\n\n```java\n\
  bar.add(blueAction);\n```\n\n动作 的小图标将显示在工具栏中。\n\n你可以使用分隔符分隔按钮组：\n\n```java\nbar.addSeparator();\n\
  ```\n\n例如，图 12.24 中的工具栏在第三个和第四个按钮之间有一个分隔符。\n\n然后，将工具栏添加到框架中：\n\n```java\nadd(bar,\
  \ BorderLayout.NORTH);\n```\n\n你还可以为工具栏指定标题，当工具栏处于分离状态时显示该标题：\n\n```java\nbar =\
  \ new JToolBar(titleString);\n```\n\n默认情况下，工具栏初始为水平方向。要让工具栏从垂直方向开始，请使用\n\n```java\n\
  bar = new JToolBar(SwingConstants.VERTICAL)\n```\n\n或者\n\n```java\nbar = new JToolBar(titleString,\
  \ SwingConstants.VERTICAL)\n```\n\n按钮是工具栏内部最常见的组件。但对你可以添加到工具栏的组件没有限制。例如，你可以向工具栏添加一个组合框（combo\
  \ box）。\n\n### 12.5.8 提示文字（Tooltips）\n\n工具栏的一个缺点是用户往往对工具栏中微小图标的含义感到困惑。为了解决这个问题，用户界面设计师发明了提示文字。当光标悬停在按钮上方时，就会激活提示文字。提示文字显示在一个颜色的矩形内。当用户移动鼠标时，提示文字就会消失。（参见图\
  \ 12.28。）\n\n在 Swing 中，你只需调用 `setToolTipText` 方法即可为任何 `JComponent` 添加提示文字：\n\n```java\n\
  exitButton.setToolTipText(\"Exit\");\n```\n\n或者，如果你使用 `Action` 对象，可以将提示文字与 `SHORT_DESCRIPTION`\
  \ 键关联：\n\n```java\nexitAction.putValue(Action.SHORT_DESCRIPTION, \"Exit\");\n```\n\
  \n列表 2.9 显示了如何将相同的 `Action` 对象添加到菜单和工具栏中。请注意，动作名称将作为菜单项显示在菜单中，而短描述将作为工具栏中的提示文字显示。\n\
  \n```java\npackage toolBar;\n\nimport java.awt.*;\nimport java.awt.event.*;\nimport\
  \ javax.swing.*;\n\n/**\n * 一个带有工具栏和菜单变化的框架。\n */\npublic class ToolFrame extends\
