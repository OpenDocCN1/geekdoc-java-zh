  \ name, Icon smallIcon)`\n使用给定的名称和图标构造一个抽象动作。\n\n***\n\n#### 12.5.3 复选框和单选按钮菜单项\n\
  \n`Checkbox` 和 `radio button` 菜单项会在名称旁边显示一个复选框或单选按钮（参见图 12.19）。当用户选择菜单项时，该项会在选中和未选中之间自动切换。\n\
  \n除了按钮装饰外，像处理其他任何菜单项一样处理这些菜单项。例如，这里是如何创建一个复选框菜单项：\n\n点击此处查看代码图片\n\n```java\nJCheckBoxMenuItem\
  \ readonlyItem = new JCheckBoxMenuItem(\"Read-only\");\noptionsMenu.add(readonlyItem);\n\
  ```\n\n单选按钮菜单项的工作方式与普通单选按钮一样。你必须将它们添加到按钮组（ButtonGroup）中。当组中的一个按钮被选中时，所有其他按钮会自动取消选择。\n\
  \n点击此处查看代码图片\n\n```java\nButtonGroup group = new ButtonGroup();\nJRadioButtonMenuItem\
  \ insertItem = new JRadioButtonMenuItem(\"Insert\");\ninsertItem.setSelected(true);\n\
  JRadioButtonMenuItem overtypeItem = new JRadioButtonMenuItem(\"Overtype\");\ngroup.add(insertItem);\n\
  group.add(overtypeItem);\noptionsMenu.add(insertItem);\noptionsMenu.add(overtypeItem);\n\
  ```\n\n对于这些菜单项，你不一定希望在用户选择该项时收到通知。相反，你可以简单地使用 `isSelected` 方法来测试菜单项的当前状态。（当然，这意味着你应该在实例字段保留该菜单项的引用。）使用\
  \ `setSelected` 方法设置状态。\n\n***\n\n### javax.swing.JCheckBoxMenuItem **1.2**\n\n\
  • `JCheckBoxMenuItem(String label)`\n使用给定的标签构造复选框菜单项。\n\n• `JCheckBoxMenuItem(String\
