  \ `0`。\n- `int gridwidth, gridheight`: 指定单元格的列宽和行高。默认值为 `1`。\n- `double weightx,\
  \ weighty`: 指定单元格的增长能力。默认值为 `0`。\n- `int anchor`: 表示组件在单元格内的对齐方式。你可以选择绝对位置：\n![Image](img/712tab01.jpg)\n\
  或者与其方向无关的等价项：\n![Image](img/712tab02.jpg)\n如果你的应用程序可能需要针对从右到左或从上到下的文本进行本地化，请使用后者。默认值为\
  \ `CENTER`。\n- `int fill`: 指定组件在单元格内的填充行为：`NONE`、`BOTH`、`HORIZONTAL` 或 `VERTICAL`\
  \ 之一。默认值为 `NONE`。\n- `int ipadx, ipady`: 指定组件周围的“内部”内边距。默认值为 0。\n- `Insets insets`:\
  \ 指定沿单元格边界的“外部”内边距。默认无间距。\n- `GridBagConstraints(int gridx, int gridy, int gridwidth,\
  \ int gridheight, double weightx, double weighty, int anchor, int fill, Insets insets,\
  \ int ipadx, int ipady)` 1.2 通过参数中指定的所有字段来构造 `GridBagConstraints`。此构造函数应仅由自动代码生成器使用，因为它会让你的源代码非常难以阅读。\n\
  \n### 12.6.2 Group Layout\n\n在讨论 `GroupLayout` 类的 API 之前，让我们快速查看 NetBeans 中的 Matisse\
