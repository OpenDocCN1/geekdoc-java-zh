  \ { \n            return new Dimension(DEFAULT_WIDTH, DEFAULT_HEIGHT); \n      \
  \  }\n    }\n}\n```\n\n`java.awt.geom.RectangularShape`\n- `getCenterX()`\n- `getCenterY()`\n\
  - `getMinX()`\n- `getMinY()`\n- `getMaxX()`\n- `getMaxY()` 返回包围矩形的中心、最小或最大 `x` 或\
  \ `y` 值。\n- `getWidth()`\n- `getHeight()` 返回包围矩形的宽度或高度。\n- `getX()`\n- `getY()`\
  \ 返回包围矩形左上角的 `x` 或 `y` 坐标。\n\n`java.awt.geom.Rectangle2D.Double`\n- `Rectangle2D.Double(double\
  \ x, double y, double w, double h)` 构建具有给定左上角、宽度和高度的矩形。\n\n`java.awt.geom.Rectangle2D.Float`\n\
  - `Rectangle2D.Float(float x, float y, float w, float h)` 构建具有给定左上角、宽度和高度的矩形。\n\n\
  `java.awt.geom.Ellipse2D.Double`\n- `Ellipse2D.Double(double x, double y, double\
  \ w, double h)` 构造一个包围矩形具有给定左上角、宽度和高度的椭圆。\n\n`java.awt.geom.Point2D.Double`\n- `Point2D.Double(double\
  \ x, double y)` 根据给定坐标构造一个点。\n\n`java.awt.geom.Line2D.Double`\n- `Line2D.Double(Point2D\
  \ start, Point2D end)`\n- `Line2D.Double(double startX, double startY, double endX,\
  \ double endY)` 根据给定的起点和终点构造线。\n\n### 10.6 使用颜色\n\n`Graphics2D` 类的 `setPaint` 方法允许你选择一种颜色，用于图形上下文中后续的所有绘图操作。例如：\n\
  \n点击此处查看代码图像\n\n```java\ng2.setPaint(Color.RED);\ng2.drawString(\"Warning!\", 100,\
  \ 100);\n```\n\n你可以用颜色填充闭合形状（如矩形或椭圆）的内部。只需调用 `fill` 而不是 `draw` 即可：\n\n点击此处查看代码图像\n\
  \n```java\nRectangle2D rect = ...;\ng2.setPaint(Color.RED);\ng2.fill(rect);\n```\n\
  \n填充闭合形状（如矩形或椭圆）的内部。只需调用 `fill` 而不是 `draw` 即可：\n\n\n\n\n将组件的背景色设置为用户桌面上所有窗口使用的默认颜色。（每当窗口重绘时，背景都会被填充。）当你想要绘制用户界面元素并使其颜色与用户桌面上已有的颜色匹配时，使用\
  \ `SystemColor` 类中的颜色特别有用。表 10.1 列出了系统颜色名称及其含义。\n\n![Image](img/10tab01.jpg)![Image](img/10tab01a.jpg)\n\
  \n#### 表 10.1 系统颜色\n\n* * *\n\n`java.awt.Color` **1.0**\n\n• `Color(int r, int g,\
  \ int b)`\n\n创建一个颜色对象。\n\n![Image](img/572tab01.jpg)\n\n* * *\n\n* * *\n\n`java.awt.Graphics`\
  \ **1.0**\n\n• `Color getColor()`\n\n• `void setColor(Color c)`\n\n获取或设置当前颜色。所有后续图形操作都将使用新颜色。\n\
