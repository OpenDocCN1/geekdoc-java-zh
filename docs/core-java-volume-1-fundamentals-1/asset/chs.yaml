  \       pack();\n    }\n}\n```\n\n`java.awt.LayoutManager` 1.0\n\n- `void addLayoutComponent(String\
  \ name, Component comp)` 将一个组件添加到布局中。\n\n![图片](img/728tab01.jpg)\n\n- `void removeLayoutComponent(Component\
  \ comp)` 从布局中移除一个组件。\n- `Dimension preferredLayoutSize(Container cont)` 返回该布局下容器的首选尺寸维度。\n\
  - `Dimension minimumLayoutSize(Container cont)` 返回该布局下容器的最小尺寸维度。\n- `void layoutContainer(Container\
  \ cont)` 布局容器中的组件。\n\n#### 12.6.5 遍历顺序\n\n当你向窗口中添加许多组件时，你来考虑`遍历顺序`。当窗口首次显示时，遍历顺序中的第一个组件具有键盘焦点。每当用户按下一次\
  \ `Tab` 键时，下一个组件就会获得焦点。（记住，拥有键盘焦点的组件可以通过键盘进行操作。例如，按钮在获得焦点时，可以使用空格键进行“点击”。）你可能个人并不在乎使用\
  \ `Tab` 键来遍历一组控件，但有很多用户是这样需要的。其中包括鼠标讨厌者以及无法使用鼠标的人，也许是因为身体残疾，或者因为他们正在通过语音导航用户界面。因此，你需要了解\
  \ Swing 如何处理遍历顺序。\n\n遍历顺序非常简单：首先是从左到右，然后是从上到下。例如，在字体对话框示例中，组件按照以下顺序遍历（参见图 12.35）：\n\
  \n1. **粗体**\n2. **斜体**\n3. **字体**\n4. **下划线**\n5. **删除线**\n\n![图片](img/12fig35.jpg)\n\
  **图 12.35** 遍历顺序\n\n## 12.7 对话框\n\n到为止，我们所有的用户界面组件都出现在创建的框架窗口内部。如果你编写在浏览器中运行的*小程序*，这是最常见的情况。但如果你编写应用程序，通常希望弹出独立的对话框来向用户提供信息或从用户处获取。与大多数窗口系统一样，AWT\
  \ 区分模态（modal）和非模态（modeless）对话框。模态对话框在用户处理它之前，不允许用户与应用程序的其余窗口进行交互。在继续执行之前需要用户信息时，请使用模态对话框。例如，当用户想要读取文件时，应该弹出模态对话框。用户必须指定文件名，程序才能开始读取操作。只有当用户关闭模态对话框后，应用程序才能继续。\n\
  \n非模态对话框的一个例子是工具栏。非模态对话框可以根据需要停留，用户可以根据需要与应用程序窗口和工具栏进行交互。\n\n我们将从简单的对话框开始本节——只有单一信息的模态对话框。Swing\
  \ 有一个方便的 `JOptionPane` 类，可以在无需编写任何特殊对话框代码的情况下放置对话框。接下来，你将看到如何通过实现自己的对话框来编写更复杂的对话框。最后，你将看到如何将数据从应用程序传输到对话框并返回。\n\
  \n通过查看两个标准对话框来结束本节：文件对话框和颜色对话框。文件对话框是复杂的，你绝对需要熟悉 `JFileChooser`——自己写一个将是一个真正的挑战。`JColorChooser`\
  \ 对话框在你需要用户选择颜色时非常有用。\n\n### 12.7.1 选项对话框\n\nSwing 提供了一系列现成的简单对话框，足以向用户询问单一信息。`JOptionPane`\
  \ 有四个静态方法来显示这些简单对话框：\n\n\n\n\n图 12.36 显示了一个典型的对话框。如你所见，该对话框包含以下组件：\n\n* 图标\n* 消息\n\
  * 一个或多个选项按钮\n\n![Image](img/12fig36.jpg)\n\n**图 12.36** 选项对话框\n\n输入对话框包含一个用于用户输入的额外组件。可以是一个用户可以在其中输入任意字符串的文本字段，也可以是一个用户可以从中选择一个项目的组合框。\n\
  \n这些对话框的精确布局以及标准消息类型的图标选择取决于可插入的外观函数（pluggable look-and-feel）。\n\n左侧的图标取决于五种消息类型之一：\n\
  \n* `ERROR_MESSAGE`\n* `INFORMATION_MESSAGE`\n* `WARNING_MESSAGE`\n* `QUESTION_MESSAGE`\n\
  * `PLAIN_MESSAGE`\n\n`PLAIN_MESSAGE` 类型没有图标。每种对话框类型还有一个方法，允许你提供自己的图标来代替。\n\n对于每个对话框类型，你都可以指定一个消息。此消息可以是字符串、图标、用户界面组件或任何对象。以下是消息对象的显示方式：\n\
  \n![Image](img/732tab01.jpg)\n\n你可以通过运行列表 12.15 中的程序来查看这些选项。\n\n当然，提供消息字符串是最常见的情况。提供一个\
  \ `Component` 给你提供了极大的灵活性，因为你可以让 `paintComponent` 方法绘制任何你想要的内容。\n\n底部的按钮取决于对话框类型和选项类型。调用\
  \ `showMessageDialog` 和 `showInputDialog` 时，你只会得到一组标准按钮（分别是 OK 和 OK/Cancel）。调用 `showConfirmDialog`\
  \ 时，你可以从四种选项类型中选择：\n\n* `DEFAULT_OPTION`\n* `YES_NO_OPTION`\n* `YES_NO_CANCEL_OPTION`\n\
  * `OK_CANCEL_OPTION`\n\n使用 `showOptionDialog`，你可以指定任意一组选项。你为选项提供一个对象数组。每个数组元素的渲染方式如下所示：\n\
  \n![Image](img/732tab02.jpg)\n\n这些函数的返回值如下：\n\n![Image](img/732tab03.jpg)\n\n`showConfirmDialog`\
  \ 和 `showOptionDialog` 返回整数以指示用户选择了哪个按钮。对于选项对话框，这仅仅是所选选项的索引；如果用户关闭了对话框而不是选择选项，则返回\
  \ `CLOSED_OPTION`。对于确认对话框，返回值可以是以下之一：\n\n* `OK_OPTION`\n* `CANCEL_OPTION`\n* `YES_OPTION`\n\
  * `NO_OPTION`\n* `CLOSED_OPTION`\n\n这这一切听起来像是一组令人困惑的选择，但在实践中非常简单。遵循以下步骤：\n\n1. **1.**\
  \ 选择对话框类型（消息、确认、选项或输入）。\n2. **2.** 选择图标（错误、信息、警告、问题、无或自定义）。\n3. **3.** 选择消息（字符串、图标、自定义组件或它们的组合）。\n\
  4. **4.** 对于确认对话框，选择选项类型（默认、是/否、是/否/取消或确定/取消）。\n5. **5.** 对于选项对话框，选择选项（字符串、图标或自定义组件）和默认选项。\n\
  6. **6.** 对于输入对话框，在文本字段和组合框之间选择。\n7. **7.** 在 `JOptionPane` API 中找到要调用的相应方法。\n\n\
  例如，假设你想显示图 12.36 中的对话框。该对话框显示消息并请求用户确认或取消。因此，它是一个确认对话框。图标是一个问题图标。消息是一个字符串。选项类型是\
  \ `OK_CANCEL_OPTION`。以下是你将进行的调用：\n\n```java\nint selection = JOptionPane.showConfirmDialog(parent,\n\
  \    \"Message\", \"Title\",\n    JOptionPane.OK_CANCEL_OPTION,\n    JOptionPane.QUESTION_MESSAGE);\n\
  \nif (selection == JOptionPane.OK_OPTION) . . .\n```\n\n![Image](img/tip.jpg) 提示\n\
  \n消息字符串可以包含换行符（`'\\n'`）。此类字符串将以多行形式显示。\n\n列表 12.15 中显示的框架类显示了六个按钮面板（参见图 12.37）。列表\
