  \ hashCode()` 返回此对象的哈希码。哈希码可以是任何整数，正数或负数。`equals` 和 `hashCode` 的定义必须兼容：如果 `x.equals(y)`\
  \ 为 `true`，那么 `x.hashCode()` 必须与 `y.hashCode()` 相同。\n\n### 9.2.4 Tree Sets\n\n`TreeSet`\
  \ 类与哈希集合类似，但增加了一个改进。树形集合是一个排序集合。你可以以任何顺序将元素插入集合中。当你遍历集合时，值将按排序顺序自动呈现。例如，假设你插入了三个字符串，然后访问所有添加的元素：\n\
  \n```java\nSortedSet<String> sorter = new TreeSet<>(); // TreeSet implements SortedSet\n\
