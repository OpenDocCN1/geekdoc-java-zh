  \ g)`\n\n设置控制水平或垂直布局的组。\n\n* `void linkSize(Component... components)`\n* `void linkSize(int\
  \ axis)Size(int axis, Component... component)`\n\n强制使给定的组件具有相同的大小，或在指定的轴向上（`SwingConstants.HORIZONTAL`\
  \ 或 `SwingConstants.VERTICAL` 之一）具有相同的大小。\n\n* `GroupLayout.SequentialGroup createSequentialGroup()`\n\
  \n创建一个按顺序布局其子组件的组。\n\n* `GroupLayout.ParallelGroup createParallelGroup()`\n* `GroupLayout.ParallelGroup\
  \ createParallelGroup(GroupLayout.Alignment align)`\n* `GroupLayout.ParallelGroup\
  \ createParallelGroup(GroupLayout.Alignment align, boolean resizable)`\n\n创建一个并行布局其子组件的组。\n\
  \n![Image](img/722tab01.jpg)\n\n* `boolean getHonorsVisibility()`\n* `void setHonorsVisibility(boolean\
  \ b)`\n\n获取或设置 `honorsVisibility` 属性。当为 `true`（默认值）时，不可见组件不进行布局。当为 `false` 时，它们将像可见一样进行布局。这在你临时隐藏某些组件且不希望布局改变时非常有用。\n\
  \n* `boolean getAutoCreateGaps()`\n* `void setAutoCreateGaps(boolean b)`\n* `boolean\
  \ getAutoCreateContainerGaps()`\n* `void setAutoCreateContainerGaps(boolean b)`\n\
  \n获取并设置 `autoCreateGaps` 和 `autoCreateContainerGaps` 属性。当为 `true` 时，会在组件之间或容器边界处自动添加间隙。默认值是\
  \ `false`。当你手动产生 `GroupLayout` 时，使用 `true` 值非常有用。\n\n### javax.swing.GroupLayout.Group\n\
  \n* `GroupLayout.Group addComponent(Component c)`\n* `GroupLayout.Group addComponent(Component\
  \ c, int minimumSize, int preferredSize, int maximumSize)`\n\n向此组添加组件。大小参数可以是实际的（非负）值，可以是特殊常量\
  \ `GroupLayout.DEFAULT_SIZE` 或 `GroupLayout.PREFERRED_SIZE`。当使用 `DEFAULT_SIZE` 时，会调用组件的\
  \ `getMinimumSize`、`getPreferredSize` 或 `getMaximumSize`。当使用 `PREFERRED_SIZE` 时，会调用组件的\
  \ `getPreferredSize` 方法。\n\n* `GroupLayout.Group addGap(int size)`\n* `GroupLayout.Group\
  \ addGap(int minimumSize, int preferredSize, int maximumSize)`\n\n添加一个给定的固定或灵活大小的间隙。\n\
  \n* `GroupLayout.Group addGroup(GroupLayout.Group g)`\n\n将给定的组添加到此组。\n\n### javax.swing.GroupLayout.ParallelGroup\n\
  \n* `GroupLayout.ParallelGroup addComponent(Component c, GroupLayout.Alignment align)`\n\
  * `GroupLayout.ParallelGroup addComponent(Component c, GroupLayout.Alignment align,\
  \ int minimumSize, int preferredSize, int maximumSize)`\n* `GroupLayout.ParallelGroup\
  \ addGroup(GroupLayout.Group g, GroupLayout.Alignment align)`\n\n使用给定的对齐方式（`BASELINE`、`LEADING`、`TRAILING`\
  \ 或 `CENTER` 之一）向此组添加组件或组。\n\n### javax.swing.GroupLayout.SequentialGroup\n\n* `GroupLayout.SequentialGroup\
  \ addContainerGap()`\n* `GroupLayout.SequentialGroup addContainerGap(int preferredSize,\
  \ int maximumSize)`\n\n添加用于分离组件与容器边缘的间隙。\n\n* `GroupLayout.SequentialGroup addPreferredGap(LayoutStyle.ComponentPlacement\
  \ type)`\n\n添加用于分离组件的间隙。类型为 `LayoutStyle.ComponentPlacement.RELATED` 或 `LayoutStyle.ComponentPlacement.UNRELATED`。\n\
  \n#### 12.6.3 不使用布局管理器\n\n在某些情况下，你可能不想费心使用布局管理器，只想将组件放置在固定位置（有时被称为*绝对定位*）。这对于平台无关的应用程序并不是一个好主意，但用于快速原型设计时并没有大问题。\n\
  \n以下是将组件放置在固定位置的操作方法：\n\n1. 将布局管理器设置为 `null`。\n2. 将你想要的组件添加到容器中。\n3. 指定你想要的位置和大小：\n\
  \n点击此处查看代码图片\n\n```java\nframe.setLayout(null);\nJButton ok = new JButton(\"OK\"\
  );\nframe.add(ok);\nok.setBounds(10, 10, 30, 15);\n```\n\n### java.awt.Component\
  \ 1.0\n\n* `void setBounds(int x, int y, int width, int height)`\n\n移动并调整组件的大小。\n\
  \n![Image](img/724tab01.jpg)\n\n#### 12.6.4 自定义布局管理器\n\n你可以设计自己的 `LayoutManager`\
  \ 类，以特殊方式管理组件。作为一个有趣的例子，让我们把容器中的所有组件排列成一个圆（参见图 12.34）。\n\n![Image](img/12fig34.jpg)\n\
  \n**图 12.34** 圆形布局\n\n你自定义的布局管理器必须实现 `LayoutManager` 接口。你需要重写以下五个方法：\n\n```java\n\
  void addLayoutComponent(String s, Component c);\nvoid removeLayoutComponent(Component\
  \ c);\nDimension preferredLayoutSize(Container parent);\nDimension minimumLayoutSize(Container\
  \ parent);\nvoid layoutContainer(Container parent);\n```\n\n前两个方法在组件添加或删除时被调用。如果你没有保留任何关于组件的信息，可以让它们什么都不做。接下来的两个方法计算组件的最小和首选布局。第五个方法执行实际工作并在所有组件上调用\
  \ `setBounds`\n\n![Image](img/note.jpg) AWT 有第二个接口，称为 `Manager2`，拥有十个方法而不是五个。`Manager2`\
  \ 接口的主要目的是允许带约束的 `add` 方法。例如，`BorderLayout` 和 `GridBagLayout` 实现了 `Manager2` 接口。\n\
  \nListing 2.13 显示了 `CircleLayout` 管理器的代码，它在父容器沿圆形布局组件。示例程序的 frame 类在 Listing 2.14\
  \ 中。\n\n\n\n\n```java\n53      minHeight = preferredHeight / 2;\n54      sizesSet\
  \ = true;\n55  }\n\npublic Dimension preferredLayoutSize(Container parent)\n{\n\
  \    setSizes(parent);\n    Insets insets = parent.getInsets();\n    int width =\
  \ preferredWidth + insets.left + insets.right;\n    int height = preferredHeight\
  \ + insets.top + insets.bottom;\n    return new Dimension(width, height);\n}\n\n\
  public Dimension minimumLayoutSize(Container parent)\n{\n    setSizes(parent);\n\
  \    Insets insets = parent.getInsets();\n    int width = minWidth + insets.left\
  \ + insets.right;\n    int height = minHeight + insets.top + insets.bottom;\n  \
  \  return new Dimension(width, height);\n}\n\npublic void layoutContainer(Container\
  \ parent)\n{\n    setSizes(parent);\n\n    // compute center of the circle\n\n \
  \   Insets insets = parent.getInsets();\n    int containerWidth = parent.getSize().width\
  \ - insets.left - insets.right;\n    int containerHeight = parent.getSize().height\
  \ - insets.top - insets.bottom;\n\n    int xcenter = insets.left + containerWidth\
  \ / 2;\n    int ycenter = insets.top + containerHeight / 2;\n\n    // compute radius\
  \ of the circle\n\n    int xradius = (containerWidth - maxComponentWidth) / 2;\n\
  \    int yradius = (containerHeight - maxComponentHeight) / 2;\n    int radius =\
  \ Math.min(xradius, yradius);\n\n    // lay out components along the circle\n\n\
  \    int n = parent.getComponentCount();\n    for (int i = 0; i < n; i++)\n    {\n\
  \        Component c = parent.getComponent(i);\n        if (c.isVisible())\n   \
  \     {\n            double angle = 2 * Math.PI * i / n;\n            // center\
  \ of component\n            int x = xcenter + (int) (Math.cos(angle) * radius);\n\
  \            int y = ycenter + (int) (Math.sin(angle) * radius);\n\n           \
  \ // move component so that its center is (x, y)\n            // and its size is\
  \ its preferred size\n            Dimension d = c.getPreferredSize();\n        \
  \    c.setBounds(x - d.width / 2, y - d.height / 2, d.width, d.height);\n      \
  \  }\n    }\n}\n```\n\n**列表 12.14** `circleLayout/CircleLayoutFrame.java`\n点击此处查看图片\n\
