  \        dialog.getRootPane().setDefaultButton(okButton);\n        dialog.pack();\n\
  \    }\n\n    // 设置标题并显示对话框\n    dialog.setTitle(title);\n    dialog.setVisible(true);\n\
  \    return ok;\n}\n```\n\n### javax.swing.SwingUtilities **1.2**\n- `Container\
  \ getAncestorOfClass(Class c, Component comp)`\n返回属于给定类或其一个子类的给定组件的最内父容器。\n\n###\
  \ javax.swing.JComponent **1.2**\n- `JRootPane getRootPane()`\n获取包含此组件的根面板（root\
  \ pane），如果该组件没有带有根面板的祖先，则返回 `null`。\n\n### javax.swing.JRootPane **1.2**\n- `void\
  \ setDefaultButton(JButton button)`\n设置此根面板的默认按钮。若要停用默认按钮，请带有 `null` 参数调用此方法。\n\n\
  ### javax.swing.JButton **1.2**\n- `boolean isDefaultButton()`\n如果此按钮是其根面板的默认按钮，则返回\
  \ `true`。\n\n### 12.7.4 文件对话框\n\n在应用程序中，你通常希望能够打开和保存文件。一个能够显示文件和目录并允许用户浏览文件系统的良好的文件对话框很难编写的，而且你绝对不想重复发明它。幸运的是，Swing\
  \ 提供了一个 `JFileChooser` 类，它允许你显示一个与大多数原生应用程序使用的类似的对话框。注意，`JFileChooser` 类并不是 `JDialog`\
  \ 的子类。不要调用 `setVisible(true)`，而应调用 `showOpenDialog` 来显示打开文件的对话框，或调用 `showSaveDialog`\
  \ 来显示保存文件的对话框。接受文件的按钮将将标记为“打开”（Open）或“保存”（Save）。你也可以通过 `showDialog` 方法提供自己的按钮。图\
  \ 12.40 显示了文件选择框的一个示例。\n\n### 图 12.40\n\n以下是建立文件对话框并恢复用户选择内容的步骤：\n\n1. ****创建一个\
  \ `JFileChooser` 对象。** 与 `JDialog` 类的构造函数不同，你不需要提供父组件。这允许你在多个帧之间复用文件选择器对话框。例如：\n\
  ```java\nJFileChooser chooser = new JFileChooser();\n```\n*提示：复用文件选择器对象是一个好主意，因为\
  \ `JFileChooser` 的构造函数可能很慢，特别是在 Windows 上用户有许多映射驱动器时。*\n\n2. **通过调用 `setCurrentDirectory`\
  \ 方法设置目录。** 例如，使用当前目录：\n```java\nchooser.setCurrentDirectory(new File(\".\"));\n\
  ```\n你需要提供一个 `File` 对象。`File` 对象将在第 2 章中详细介绍。你现在只需要知道构造函数 `File(String filename)`\
  \ 会将文件名或目录名转换为 `File` 对象。\n\n3. **如果你有一个预期用户选择的默认文件名，请使用 `setSelectedFile` 方法提供它：**\n\
  ```java\nchooser.setSelectedFile(new File(filename));\n```\n\n4. **为了让使用户能够在对话框中选择多个文件，请调用\
  \ `setSelectionEnabled` 方法。** 当然，这完全是可选的，而且并不总是常见。\n```java\nchooser.setSelectionEnabled(true);\n\
  ```\n\n5. **如果你想限制对话框中显示的文件为特定类型（例如，所有扩展名为 `.gif` 的文件），你需要设置一个文件过滤器。** 我们将在本节的稍后部分讨论文件过滤器。\n\
  \n6. **默认情况下，用户使用文件选择器只能选择文件。** 如果你想让用户选择目录，请使用 `setSelectionMode` 方法。使用 `JFileChooser.FILES_ONLY`（默认值）、`JFileChooser.DIRECTORIES_ONLY`\
  \ 或 `JFileChooser.FILES_AND_DIRECTORIES` 调用它。\n\n7. **通过调用 `showOpenDialog` 或 `showSaveDialog`\
  \ 方法显示对话框。** 在这些调用中你必须提供父组件：\n```java\nint result = chooser.showOpenDialog(parent);\n\
  ```\n或\n```java\nint result = chooser.showSaveDialog(parent);\n```\n这些调用唯一的区别在于“确认按钮”（approve\
  \ button）的标签——用户点击以完成文件选择的按钮。你也可以调用 `showDialog` 方法并为确认按钮传递显式文本：\n```java\nint result\
  \ = chooser.showDialog(parent, \"Select\");\n```\n这些调用仅在用户确认、取消或关闭对话框时返回。返回值为 `JFileChooser.APPROVE_OPTION`、`JFileChooser.CANCEL_OPTION`\
  \ 或 `JFileChooser.ERROR_OPTION`。\n\n8. **通过 `getSelectedFile()` 或 `getSelectedFiles()`\
  \ 方法获取选定的文件或文件。** 这些方法返回单个 `File` 对象或一个 `File` 对象数组。如果你只需要文件对象的路径，调用其 `getPath`\
  \ 方法。例如：\n```java\nString filename = chooser.getSelectedFile().getPath();\n```\n\
  \n在大多数情况下，这些步骤都是简单的。使用文件对话框的主要困难在于指定用户应从中选择的文件子集。例如，假设用户应该选择 GIF 图片文件。那么文件选择器应该只显示扩展名为\
  \ `.gif` 的文件。它还应该给用户某种反馈，说明显示的文件属于特定类别，例如“GIF Images”。但情况可能更复杂。如果用户应该选择 JPEG 图片文件，扩展名可以是\
  \ `.jpg` 或 `.jpeg`。与其使用编码这些复杂情况的方法，文件选择器设计者提供了一种更优雅的机制：要限制显示的文件，请提供扩展抽象类 `javax.swing.filechooser.FileFilter`\
  \ 的对象。文件选择器会将每个文件传递给文件过滤器，并只显示过滤器接受的文件。\n\n在本文编写时，提供了两种这样的子类：接受所有文件的默认过滤器，以及接受具有给定扩展的所有文件的过滤器。然而，编写临时的文件过滤器很容易的。你只需要实现\
  \ `FileFilter` 超类的中的两个抽象方法：\n```java\npublic boolean accept(File f);\n\npublic String\
  \ getDescription();\n```\n\n\n\n\n第一种方法测试文件是否应该被接受。第二种方法返回文件类型的描述，该描述可以在文件选择器对话框中。\n\
  \n***\n\n![Image](img/note.jpg) 注意\n\n`java.io` 包中有一个无关的 `FileFilter` 接口，只有一个方法\
  \ `boolean accept(File f)`。它被用于 `File` 类的 `listFiles` 方法中，用于列出目录中的文件。我们不知道 Swing\
  \ 的设计者为什么没有扩展这个接口——也许 Java 类库现在已经变得如此复杂，以至于即使是 Sun 公司的程序员们也不再熟悉所有的标准类和接口了。\n\n如果你同时导入了\
  \ `java.io` 和 `javax.swing.filechooser` 包，你将需要解决这两个同名类型之间的命名冲突。最简单的解决方法是导入 `javax.swing.filechooser.FileFilter`，而不是\
  \ `javax.swing.filechooser.*`。\n\n***\n\n一旦你拥有了文件过滤器对象，就可以使用 `JFileChooser` 类的 `setFileFilter`\
  \ 方法将其安装到文件选择器对象中：\n\n点击此处查看代码图像\n\n```java\nchooser.setFileFilter(new FileNameExtensionFilter(\"\
  Image files\", \"gif\", \"jpg\"));\n```\n\n你可以通过调用 点击此处查看代码图像 为文件选择器安装多个过滤器：\n\n\
  ```java\nchooser.addChoosableFileFilter(filter1);\nchooser.addChoosableFileFilter(filter2);\n\
  ...\n```\n\n用户从文件对话框底部的组合框中选择一个过滤器。默认情况下，“所有文件”过滤器始终出现在组合框中。这是一个好主意——以防你的程序用户需要选择一个具有非标准扩展名的文件。然而，如果你想抑制“所有文件”过滤器，可以调用\n\
  \n点击此处查看代码图像\n\n```java\nchooser.setAcceptAllFileFilterUsed(false)\n```\n\n***\n\
  \n![Image](img/caution.jpg) 警告\n\n如果你重用同一个文件选择器来加载和保存不同的文件类型，请调用\n\n点击此处查看代码图像\n\
  \n```java\nchooser.resetChoosableFilters()\n```\n\n在添加新过滤器之前清除任何旧的过滤器。\n\n***\n\n\
  最后，你可以通过为文件选择器显示的每个文件提供特殊的图标和文件描述来自定义文件选择器。通过提供一个扩展自 `javax.swing.filechooser` 包中\
  \ `FileView` 类的对象来实现。这绝对是一项高级技术。通常情况下，你不需要提供文件视图——可插件外观（pluggable look-and-feel）会为你提供一个。但如果你想为特殊文件类型显示不同的图标，可以安装你自己的文件视图。你需要扩展\
  \ `FileView` 类并实现五个方法：\n\n点击此处查看代码图像\n\n```java\nIcon getIcon(File f);\nString getName(File\
  \ f);\nString getDescription(File f);\nString getTypeDescription(File f);\nBoolean\
  \ isTraversable(File f);\n```\n\n然后，使用 `setFileView` 方法将你的文件视图安装到文件选择器中。\n\n文件选择器会针对它想要显示的每个文件或目录调用你的方法。如果你的方法对图标、名称或描述返回\
  \ `null`，则文件选择器将查询外观的默认文件视图。这很好，因为这意味着你只需要处理那些你想要进行特殊处理的文件类型。\n\n文件选择器通过调用 `isTraversable`\
  \ 方法来决定当用户点击目录时是否打开它。注意，此方法返回的是一个 `Boolean` 对象，而不是 `boolean` 值！这看起来很诡异，但实际上非常方便——如果你不感兴趣偏离默认文件视图，只需返回\
  \ `null` 即可。文件选择器将查询默认文件视图。换句话说，该方法返回一个 `Boolean` 让你在三个选项之间选择：true (`Boolean.TRUE`)、false\
  \ (`Boolean.FALSE`) 或不关心（`null`）。\n\n示例程序包含一个简单的文件视图类。该类在每当文件匹配文件过滤器时，都会显示特定的图标。我们使用它为所有图像文件显示一个调色板图标。\n\
  \n点击此处查看代码图像\n\n```java\nclass FileIconView extends FileView {\n    private FileFilter\
  \ filter;\n    private Icon icon;\n\n    public FileIconView(FileFilter aFilter,\
  \ Icon anIcon) {\n        filter = aFilter;\n        icon = anIcon;\n    }\n\n \
  \   public Icon getIcon(File f) {\n        if (!f.isDirectory() && filter.accept(f))\n\
  \            return icon;\n        else return null;\n    }\n}\n```\n\n使用 `setFileView`\
  \ 方法将此文件视图安装到你的文件选择器：\n\n点击此处查看代码图像\n\n```java\nchooser.setFileView(new FileIconView(filter,\
  \ icon));\n```\n文件选择器随后将为通过 `filter` 的所有文件显示调色板图标。\n\n***\n\n![Image](img/note.jpg)get\n\
  \n你可以在 JDK 的 `demo/fc` 目录下找到更实用的 `FileView`。\n\n***\n\n最后，你可以通过添加附件来自定义文件对话框。例如，图\
  \ 12.4 显示了文件旁的预览。\n\n![Image](img/caution.jpg)\n\n**12.4** 带附件的文件对话框\n\n附件可以是任何\
  \ Swing 组件。在我们的案例中，我们扩展 `JLabel` 并将其图标设置为缩放后的：\n\n```java\nclass ImagePreviewer\
  \ extends JLabel {\n    public ImagePreviewer(JFileChooser chooser) {\n        setPreferredSize(new\
  \ Dimension(100, 100));\n        setBorder(BorderFactory.createEtchedBorder());\n\
  \    }\n\n    public void loadImage(File f) {\n        ImageIcon icon = new ImageIcon(f);\n\
  \        if (icon.getWidth() > getWidth()) {\n            icon = new ImageIcon(icon.getImage().getScaledInstance(getWidth(),\
  \ -1, Image.SCALE_SMOOTH));\n        }\n        setIcon(icon);\n        repaint();\n\
  \    }\n}\n```\n\n只有一个挑战。我们要在用户选择文件时更新预览图像。文件选择器使用“JavaBeans”机制在属性更改时通知感兴趣的监听器。我们在第\
  \ 11 章中详细详细讨论了这种机制。这是你需要拦截的代码：\n\n点击此处查看代码图像\n\n```java\nchooser.addPropertyChangeListener(event\
  \ -> {\n    if (event.getPropertyName() == JFileChooser.SELECTED_FILE_PROPERTY)\
  \ {\n        File newFile = (File) event.getNewValue();\n        // 更新附件\n    }\n\
  });\n```\n\n在我们的示例程序中，我们将此代码添加到 `ImagePreviewer` 构造函数。列表 12.21 到 12.23 包含了对第 2 章\
  \ 中 `ImageViewer` 程序的修改，其中文件选择器通过自定义视图和预览附件进行了增强。\n\n**列表 12.21** `fileChooser/ImageViewerFrame.java`\n\
  \n点击此处查看代码图像\n\n\n\n\n\n```java\npublic ImageViewerFrame()\n{\n    setSize(DEFAULT_WIDTH,\
  \ DEFAULT_HEIGHT);\n\n    // 设置菜单栏\n    JMenuBar menuBar = new JMenuBar();\n   \
  \ setJMenuBar(menuBar);\n\n    JMenu menu = new JMenu(\"File\");\n    menuBar.add(menu);\n\
  \n    JMenuItem openItem = new JMenuItem(\"Open\");\n    menu.add(openItem);\n \
  \   openItem.addActionListener(event -> {\n        chooser.setCurrentDirectory(new\
  \ File(\".\"));\n\n        // 显示文件选择对话框\n        int result = chooser.showOpenDialog(ImageViewerFrame.this);\n\
  \n        // 如果接受了图像文件，将其将其设置为 label 的图标\n        if (result == JFileChooser.APPROVE_OPTION)\n\
  \        {\n            String name = chooser.getSelectedFile().getPath();\n   \
  \         label.setIcon(new ImageIcon(name));\n            pack();\n        }\n\
  \    });\n\n    JMenuItem exitItem = new JMenuItem(\"Exit\");\n    menu.add(exitItem);\n\
  \    exitItem.addActionListener(event -> System.exit(0));\n\n    // 使用 label 显示图像\n\
  \    label = new JLabel();\n    add(label);\n\n    // 设置文件选择器\n    chooser = new\
  \ JFileChooser();\n\n    // 接受所有以 .jpg, .jpeg, .gif 结尾的图像文件\n    FileFilter filter\
  \ = new FileNameExtensionFilter(\n        \"Image files\", \"jpg\", \"jpeg\", \"\
  gif\");\n    chooser.setFileFilter(filter);\n\n    chooser.setAccessory(new ImagePreviewer(chooser));\n\
  \n    chooser.setFileView(new FileIconView(filter, new ImageIcon(\"palette.gif\"\
  )));\n}\n```\n\n### Listing 12.2 `fileChooser/ImagePreviewer.java`\n\n```java\n\
  package fileChooser;\n\nimport java.awt.*;\nimport java.io.*;\nimport javax.swing.*;\n\
  \n/**\n * 用于预览图像的文件选择器组件。\n */\npublic class ImagePreviewer extends JLabel\n{\n\
  \    /**\n     * 构造 ImagePreviewer。\n     * @param chooser 文件选择器，其属性的变化会触发预览器中图像的变化\n\
  \     */\n    public ImagePreviewer(JFileChooser chooser)\n    {\n        setPreferredSize(new\
  \ Dimension(100, 100));\n        setBorder(BorderFactory.createEtchedBorder());\n\
  \n        chooser.addChangeListener(event -> {\n            if (event.getPropertyName()\
  \ == JFileChooser.SELECTED_FILE_PROPERTY)\n            {\n                // 用户选择了一个新文件\n\
  \                File f = (File) event.getNewValue();\n                if (f ==\
  \ null)\n                {\n                    setIcon(null);\n               \
  \     return;\n                }\n\n                // 将图像读入图标\n               \
  \ ImageIcon icon = new ImageIcon(f.getPath());\n\n                // 如果图标太大无法适应，则进行缩放\n\
  \                if (icon.getIconWidth() > getWidth())\n                    icon\
  \ = new ImageIcon(icon.getImage().getScaledInstance(\n                        getWidth(),\
  \ -1, Image.SCALE_DEFAULT));\n\n                setIcon(icon);\n            }\n\
  \        });\n    }\n}\n```\n\n### Listing 12.23 `fileChooser/FileIconView.java`\n\
  \n```java\npackage fileChooser;\n\nimport java.io.*;\nimport javax.swing.*;\nimport\
  \ javax.swing.filechooser.*;\nimport javax.swing.filechooser.FileFilter;\n\n/**\n\
  \ * 为所有匹配文件过滤器的文件显示图标的文件视图。\n */\npublic class FileIconView extends FileView\n{\n\
  \    private FileFilter filter;\n    private Icon icon;\n\n    /**\n     * 构造 FileIconView。\n\
  \     * @param aFilter 文件过滤器——此过滤器接受的所有文件将将带图标显示。\n     * @param anIcon 与所有接受的文件一起显示的图标。\n\
  \     */\n    public FileIconView(FileFilter aFilter, Icon anIcon)\n    {\n    \
  \    filter = aFilter;\n        icon = anIcon;\n    }\n\n    public Icon getIcon(File\
  \ f)\n    {\n        if (!f.isDirectory() && filter.accept(f)) return icon;\n  \
  \      else return null;\n    }\n}\n```\n\n### javax.swing.JFileChooser\n\n- `JFileChooser()`\
  \ 创建一个可以用于多个帧的文件选择器对话框。\n- `void setCurrentDirectory(File dir)` 设置文件对话框的初始目录。\n\
  - `void setSelectedFile(File file)`\n- `void setSelectedFiles(File[] file)` 设置文件对话框的默认文件选择。\n\
  - `void setMultiSelectionEnabled(boolean b)` 设置或清除多选模式。\n- `void setFileSelectionMode(int\
  \ mode)` 允许用户仅选择文件（默认）、仅选择目录或同时文件和目录。`mode` 参数是 `JFileChooser.FILES_ONLY`、`JFileChooser.DIRECTORIES_ONLY`\
  \ 和 `JFileChooser.FILES_AND_DIRECTORIES` 之一。\n- `int showOpenDialog(Component parent)`\n\
  - `int showSaveDialog(Component parent)`\n- `int showDialog(Component parent, String\
  \ approveButtonText)` 显示对话框，其中确认按钮标记为“Open”、“Save”或 `approveButtonText` 字符串。返回 `APPROVE_OPTION`、`CANCEL_OPTION`（如果用户选择了取消或关闭了对话框）或\
  \ `ERROR_OPTION`（如果发生错误）。\n- `File getSelectedFile()`\n- `File[] getSelectedFiles()`\
  \ 获取用户选择的文件或文件（如果用户没有选择任何文件，则返回 `null`）。\n- `void setFileFilter(FileFilter filter)`\
  \ 设置文件对话框的文件掩码。所有 `filter` 返回 `true` 的文件将被显示。同时，将过滤器添加到可选过滤器列表中。\n- `void addChoosableFileFilter(FileFilter\
  \ filter)` 将过滤器添加到可选过滤器列表中。\n- `void setAcceptAllFilterUsed(boolean b)` 在过滤器组合框中包含或抑制“所有文件”过滤器。\n\
  - `void resetChoosableFilters()` 清除可选过滤器列表。除非显式抑制，否则保留“所有文件”过滤器。\n- `void setFileView(FileView\
  \ view)` 设置文件视图以提供文件选择器显示的文件信息。\n- `void setAccessory(JComponent component)` 设置配件。\n\
  \n### javax.swing.filechooser.FileFilter\n\n- `boolean accept(File f)` 如果文件选择器应该显示此文件，则返回\
  \ `true`。\n- `String getDescription()` 返回此文件过滤器的描述，例如`Image files (*.gif*.jpeg)`。\n\
  \n### javax.swing.filechooser.FileNameExtensionFilter\n\n- `FileNameExtensionFilter(String\
  \ description, String... extensions)` 一个带有描述的文件过滤器，接受所有目录以及所有以点加上扩展名字符串结尾的文件。\n\n\
  ### javax.swing.filechooser.FileView\n\n- `String getName(File f)` 返回文件 `f` 的名称，或返回\
  \ `null`。通常，此方法简单返回 `f.getName()`。\n- `String getDescription(File f)` 返回文件 `f` 的人类可读描述，或返回\
  \ `null`。例如，如果 `f` 是 HTML 文档，此方法可能会返回其标题。\n- `String getTypeDescription(File f)`\
  \ 返回文件 `f` 类型的人类可读描述，或返回 `null`。例如，如果 `f` 是 HTML 文档，此方法可能会返回字符串 `\"Hypertext document\"\
  `。\n- `Icon getIcon(File f)` 返回文件 `f` 的图标，或返回 `null`。例如，如果 `f` 是 JPEG 文件，此方法可能会返回一个缩略图图标。\n\
  - `Boolean isTraversable(File f)` 判断文件 `f` 是否可遍历的。\n\n\n\n\n如果 `f` 是用户可以打开的目录，则返回\
  \ `Boolean.TRUE`。如果目录在概念上是一个复合文档，此方法可能会返回 `Boolean.FALSE`。与所有的 `FileView` 方法一样，此方法可以返回\
  \ `null` 表示文件选择器应该咨询默认视图。\n\n***\n\n### 12.7.5 颜色选择器\n\n正如你在前一节中看到的，高质量的文件选择器是一个复杂的用户界面组件，你绝对不想自己实现它。许多用户界面工具包都提供了其他常用的对话框：选择日期/时间、货币值、字体、颜色等。这样做的好处有两点：程序员可以直接使用高质量的实现，而不需要自己开始开发；而用户可以在这些组件上获得一致的体验。\n\
  \n到此时，`Swing` 仅提供了一个额外的选择器，即 `JColorChooser`（参见图 12.42 至 图 12.44）。使用它让用户选择颜色值。与\
  \ `JFileChooser` 类一样，颜色选择器是一个组件而不是一个对话框，但它拥有方便方法来创建包含颜色选择器组件的对话框。\n\n![Image](img/12fig42.jpg)\n\
  \n**图 12.42** 颜色选择器的色块面板\n\n![Image](img/12fig43.jpg)\n\n**图 12.43** 颜色选择器的 HSB\
  \ 面板\n\n![Image](img/12fig44.jpg)\n\n**图 12.44** 颜色选择器的 RGB 面板\n\n以下是如何显示一个带有颜色选择器的模态对话框：\n\
  \n点击此处查看代码图片\n\n```java\nColor selectedColor = JColorChooser.showDialog(parent,title,\
  \ initialColor);\n```\n\n或者，你也可以显示一个非模态颜色选择器对话框。提供以下内容：\n\n- 一个父组件\n- 对话框标题\n- 一个用于选择模态或非模态对话框的标志\n\
  - 一个颜色选择器\n- OK 和 取消按钮的监听器（如果你不需要监听器，则传入 `null`）\n\n以下是如何创建一个非模态对话框，并在用户点击 OK 按钮时设置背景颜色：\n\
  \n点击此处查看代码图片\n\n```java\nchooser = new JColorChooser();\n\ndialog = JColorChooser.createDialog(\n\
  \    parent,\n    \"Background Color\",\n    false /* not modal */,\n    chooser,\n\
  \    event -> setBackground(chooser.getColor()),\n    null /* no Cancel button listener\
  \ */);\n```\n\n你可以做得更好，给用户颜色选择的即时反馈。为了监控颜色选择，你需要获取选择器的选择模型并添加更改监听器：\n\n点击此处查看代码图片\n\
  \n```java\nchooser.getSelectionModel().addChangeListener(event -> {\n    do something\
  \ with chooser.getColor();\n});\n```\n\n在这种情况下，颜色选择器对话框提供的 OK 和 取消按钮没有意义。你可以直接将颜色选择器组件添加到非模态对话框中：\n\
  \n点击此处查看代码图片\n\n```java\ndialog = new JDialog(parent, false /* not modal */);\n\n\
  dialog.add(chooser);\n\ndialog.pack();\n```\n\nListing 12.24 中的程序显示了三种类型的对话框。如果你点击\
  \ Modal（模态）按钮，你必须在进行其他操作之前选择一种颜色。如果你点击 Modeless（非模态）按钮，你会得到一个非模态对话框，但颜色变化只在你点击对话框上的\
  \ OK 按钮时发生如果你点击 Immediate（即时）按钮，你会得到一个没有按钮的非模态对话框。一旦你在对话框中选择了不同的颜色，面板的背景颜色就会更新。\n\
  \n**Listing 12.24** `colorChooser/ColorChooserPanel.java`\n\n点击此处查看代码图片\n\n***\n\
  \n```java\npackage colorChooser;\n\nimport java.awt.Color;\nimport java.awt.Frame;\n\
  import java.awt.event.ActionEvent;\nimport java.awt.event.ActionListener;\nimport\
  \ javax.swing.JButton;\nimport javax.swing.JColorChooser;\nimport javax.swing.JDialog;\n\
  import javax.swing.JPanel;\n\n/**\n * 一个带有弹出不同类型选择器的按钮面板\n */\npublic class ColorChooserPanel\
  \ extends JPanel {\n    public ColorChooserPanel() {\n        JButton modalButton\
  \ = new JButton(\"Modal\");\n        modalButton.addActionListener(new ModalListener());\n\
  \        add(modalButton);\n\n        JButton modelessButton = new JButton(\"Modeless\"\
  );\n        modelessButton.addActionListener(new ModelessListener());\n        add(modelessButton);\n\
  \n        JButton immediateButton = new JButton(\"Immediate\");\n        immediateButton.addActionListener(new\
  \ ImmediateListener());\n        add(immediateButton);\n    }\n\n    /**\n     *\
  \ 此监听器弹出一个模态选择器\n     */\n    private class ModalListener implements ActionListener\
  \ {\n        public void actionPerformed(ActionEvent event) {\n            Color\
  \ defaultColor = getBackground();\n            Color selected = JColorChooser.showDialog(ColorChooserPanel.this,\
  \ \"Set background\",\n            defaultColor);\n            if (selected != null)\
  \ setBackground(selected);\n        }\n    }\n\n    /**\n     * 此监听器弹出一个非模态选择器。当用户点击\n\
  \     * OK 按钮时，面板颜色改变。\n     */\n    private class ModelessListener implements ActionListener\
  \ {\n        private JDialog dialog;\n        private JColorChooser chooser;\n\n\
  \        public ModelessListener() {\n            chooser = new JColorChooser();\n\
  \            dialog = JColorChooser.createDialog(ColorChooserPanel.this, \"Background\
  \ Color\",\n                false /* not modal */, chooser,\n                event\
  \ -> setBackground(chooser.getColor()),\n                null /* no Cancel button\
  \ listener */);\n        }\n\n        public void actionPerformed(ActionEvent event)\
  \ {\n            chooser.setColor(getBackground());\n            dialog.setVisible(true);\n\
  \        }\n    }\n\n    /**\n     * 此监听器弹出一个非模态选择器。当用户选择新颜色时，面板颜色立即变化。\n     */\n\
  \    private class ImmediateListener implements ActionListener {\n        // (实现细节在源码中截断但保留了结构)\n\
  \    }\n}\n```\n\n***\n\n## 12.8 故障排除 GUI 程序\n\n在下一节中，我们将提供一些 GUI 编程的调试技巧。然后，我们将展示如何使用\
  \ AWT 机器人来自动化 GUI 测试。\n\n#### 12.8.1 调试技巧\n\n\n\n\n\n如果你曾观察过 `Swing` 窗口，并好奇它的设计者是如何让所有组件对齐得如此整齐，你可以窥探其内容。按下\
  \ `Ctrl+Shift+F1` 可以获取层次结构中所有组件的打印输出：\n\n点击此处查看代码图像\n\n```\nFontDialog[frame0,0,0,300x200,layout=java.awt.BorderLayout,...\n\
  \  javax.swing.JRootPane[,4,23,292x173,layout=javax.swing.JRootPane$RootLayout,...\n\
  \    javax.swing.JPanel[null.glassPane,0,0,292x173,hidden,layout=java.awt.FlowLayout,...\n\
  \    javax.swing.JLayeredPane[null.layeredPane,0,0,292x173,...\n      javax.swing.JPanel[null.contentPane,0,0,292x173,layout=java.awt.GridBagLayout,...\n\
  \        javax.swing.JList[,0,0,73x152,alignmentX=null,alignmentY=null,...\n   \
  \       javax.swing.CellRendererPane[,0,0,0x0,hidden]\n            javax.swing.DefaultListCellRenderer$UIResource,-73,-19,0x0,...\n\
  \        javax.swing.JCheckBox,157,13,50x25,layout=javax.swing.OverlayLayout,...\n\
  \        javax.swing.JCheckBox[,156,65,52x25,layout=javax.swing.OverlayLayout,...\n\
  \        javax.swing.JLabel[,114,119,30x17,alignmentX=0.0,alignmentY=null,...\n\
  \        javax.swing.JTextField[,186,117,105x21,alignmentX=null,alignmentY=null,...\n\
  \        javax.swing.JTextField[,0,152,291x21,alignmentX=null,alignmentY=null,...\n\
  ```\n\n如果你设计了自定义的 `Swing` 组件但它显示得正常，你一定会非常喜欢 `Swing 图形调试器`。即使你没有编写自己的组件类，观察组件内容具体是如何绘制的也是很有启发性且趣味性的。要开启\
  \ `Swing` 组件的调试，请使用 `JComponent` 类的 `setDebugGraphicsOptions` 方法。可以使用以下选项：\n\n![图像\n\
  \n我们发现，要让闪烁（flash）选项生效，必须禁用“双重缓冲”（double buffering）——这是 `Swing` 在更新窗口时减少闪烁所使用的策略。开启闪烁选项的魔力咒是：\n\
  \n点击此处查看代码图像\n\n```\nRepaintManager.currentManager(getRootPane()).setDoubleBufferingEnabled(false);\n\
  ((JComponent)getContentPane()).setDebugGraphicsOptions(DebugGraphics.FLASH_OPTION);\n\
  ```\n\n只需将这些行放在 frame 构造函数的末即可。程序运行时，你将看到内容面板以慢动作填充。或者，为了进行更局部的调试，只需为单个组件调用 `setDebugGraphicsOptions`。控制狂热人甚至可以设置闪烁的持续时间、次数和颜色——详情请参阅\
  \ `DebugGraphics` 类的在线文档。\n\n如果你想获取 GUI 应用中生成的每一个 AWT 事件的记录，你可以在每个发射事件的组件中安装监听器。得益于反射机制，这很容易实现自动化。列表\
  \ 12.25 显示了 `EventTracer` 类。\n\n要监视消息，请将想要追踪事件的组件添加到事件追踪器中：\n\n点击此处查看代码图像\n\n```\n\
  EventTracer tracer = new EventTracer();\ntracer.add(frame);\n```\n\n随后你将获得所有事件的文本描述，如图\
  \ 12.45 所示。\n\n**列表 12.25** `eventTracer/EventTracer.java`\n\n点击此处查看代码图像\n\n* *\
  \ *\n\n```java\npackage eventTracer;\n\nimport java.awt.*;\nimport java.beans.*;\n\
  import java.lang.reflect.*;\n\n/**\n * @version 1.31 2004-05-10\n * @author Cay\
  \ Horstmann\n */\npublic class EventTracer {\n  private InvocationHandler handler;\n\
  \n  public EventTracer() {\n    // 用于所有代理的处理器\n    handler = new InvocationHandler()\
  \ {\n      public Object invoke(Object proxy, Method method, Object[] args) {\n\
  \        System.out.println(method + \":\" + args[0]);\n        return null;\n \
  \     }\n    };\n  }\n\n  /**\n   * 为组件及其子类可以监听的所有事件添加追踪器\n   * @param c 一个组件\n\
  \   */\n  public void add(Component c) {\n    try {\n      // 获取组件可以监听的所有事件\n  \
  \    BeanInfo info = Introspector.getBeanInfo(c.getClass());\n      EventSetDescriptor[]\
  \ eventSets = info.getEventSetDescriptors();\n      for (EventSetDescriptor eventSet\
  \ : eventSets) {\n        // ... (逻辑省略，保持代码结构)\n      }\n    } catch (IntrospectionException\
  \ e) {\n      // ...\n    }\n    // ... (后续代码保持原文逻辑)\n  }\n}\n```\n\n**图 12.45**\
  \ `EventTracer` 的工作\n\n#### 12.8.2 让 AWT 执行工作\n\n`Robot` 类可以发送按键和鼠标点击，用于自动化测试用户界面。要获取\
  \ robot，你首先需要获取一个 `GraphicsDevice` 对象。你可以通过以下调用获取默认屏幕设备：\n\n点击此处查看代码图像\n\n```java\n\
  GraphicsEnvironment environment = GraphicsEnvironment.getLocalGraphicsEnvironment();\n\
  GraphicsDevice screen = environment.getDefaultScreenDevice();\n```\n\n然后构造一个 robot：\n\
  \n点击此处查看代码图像\n\n```java\nRobot robot = new Robot(screen);\n```\n\n要发送按键，告诉 robot\
  \ 模拟按下和释放按键：\n\n点击此处查看代码图像\n\n```java\nrobot.keyPress(KeyEvent.VK_TAB);\nrobot.keyRelease(KeyEvent.VK_TAB);\n\
  ```\n\n对于鼠标点击，你首先需要移动鼠标，然后按下并释放：\n\n点击此处查看代码图像\n\n```java\nrobot.mouseMove(x, y);\
  \ // x 和 y 是绝对屏幕坐标\nrobot.mousePress(InputEvent.BUTTON1_MASK);\nrobot.mouseRelease(InputEvent.BUTTON1_MASK);\n\
  ```\n\n其思路是模拟按键和鼠标输入，然后截图查看应用程序的操作是否符合预期。要截图，使用 `createScreenCapture` 方法：\n\n点击此处查看代码图像\n\
  \n```java\nRectangle rect = new Rectangle(x, y, width, height);\nBufferedImage image\
  \ = robot.createScreenCapture(rect);\n```\n\n矩形坐标也相对于绝对屏幕像素。\n\n最后，你通常会在 robot 指令之间添加很小的延迟，以便应用程序能够跟上。使用\
  \ `delay` 方法并给出要延迟的毫秒数。例如：\n\n点击此处查看代码图像\n\n```java\nrobot.delay(1000); // 延迟 1000\
  \ 毫秒\n```\n\n\n\n\n\nListing 12.26 中的程序展示了如何使用机器人。该机器人测试了你在第 11 章中看到的按钮测试程序。首先，按下空格键会激活最左侧的按钮。然后机器人会等待两秒，以便你可以看到它做了什么。延迟之后，机器人会模拟\
  \ `Tab` 键和再次按下空格键来点击下一个按钮。最后，它模拟在第三个按钮上进行鼠标点击。（你可能需要调整程序的 `x` 和 `y` 坐标才能实际按下按钮。）程序通过捕获屏幕并在另一个窗口中显示来结束（参见图\
  \ 12.46）。\n\n![Image](img/12fig46.jpg)\n\n**图 12.46** 使用 AWT 机器人截屏\n\n***\n\n![Image](img/note.jpg)\
  \ 注意\n\n你需要在单独线程中运行机器人，如示例代码所示。关于线程的更多信息，请参阅第 14 章。\n\n***\n\n正如此示例所示，`Robot` 类本身并不适用于方便的用户界面测试。相反，它是一个基础构建模块，可以作为测试工具的基础性部分。专业的测试工具可以捕获、存储和重放用户交互场景，并找到组件的屏幕位置，这样鼠标点击就不需要猜测了。\n\
  \n**代码列表 12.26** `robot/RobotTest.java`\n\n点击此处查看代码图像\n\n***\n\n```java\npackage\
  \ robot;\n\nimport java.awt.*;\nimport java.awt.event.*;\nimport java.awt.image.*;\n\
  import javax.swing.*;\n\n/**\n * @version 1.05 2015-08-20\n * @author Cay Horstmann\n\
  \ */\npublic class RobotTest\n{\n    public static void main(String[] args)\n  \
  \  {\n        EventQueue.invokeLater(() ->\n                {\n                \
  \    // make frame with a button panel\n                ButtonFrame frame = new\
  \ ButtonFrame();\n                    frame.setTitle(\"ButtonTest\");\n        \
  \            frame.setDefaultCloseOperation(JFrame.EXIT_ON_CLOSE);\n           \
  \         frame.setVisible(true);\n                });\n\n        // attach a robot\
  \ to the screen device\n        GraphicsEnvironment environment = GraphicsEnvironment.getLocalGraphicsEnvironment();\n\
  \        GraphicsDevice screen = environment.getDefaultScreenDevice();\n\n     \
  \   try\n        {\n            final Robot robot = new Robot(screen);\n       \
  \     robot.waitForIdle();\n            new Thread()\n            {\n          \
  \      public void run()\n                {\n                    runTest(robot);\n\
  \                };\n            }.start();\n        }\n        catch (AWTException\
  \ e)\n        {\n            e.printStackTrace();\n        }\n    }\n\n    /**\n\
  \     * Runs sample test procedure\n     * @param robot the robot attached to the\
  \ screen device\n     */\n    public static void runTest(Robot robot)\n    {\n \
  \       // simulate space bar press\n        robot.keyPress(' ');\n        robot.keyRelease('\
  \ ');\n\n        // simulate a tab key followed by a space\n        robot.delay(2000);\n\
  \        robot.keyPress(KeyEvent.VK_TAB);\n        robot.keyRelease(KeyEvent.VK_TAB);\n\
  \        robot.keyPress(' ');\n        robot.keyRelease(' ');\n\n        // simulate\
  \ a mouse click over the rightmost button\n        robot.delay(2000);\n        robot.mouseMove(220,\
  \ 40);\n        robot.mousePress(InputEvent.BUTTON1_MASK);\n        robot.mouseRelease(InputEvent.BUTTON1_MASK);\n\
  \n        // capture the screen and show the resulting image\n        robot.delay(2000);\n\
  \        BufferedImage image = robot.createScreenCapture(new Rectangle(0, 0, 400,\
  \ 300));\n\n        ImageFrame frame = new ImageFrame(image);\n        frame.setVisible(true);\n\
  \    }\n}\n\n/**\n * A frame to display a captured image\n */\nclass ImageFrame\
  \ extends JFrame\n{\n    private static final int DEFAULT_WIDTH = 450;\n    private\
  \ static final int DEFAULT_HEIGHT = 350;\n\n    /**\n     * @param image the image\
  \ to display\n     */\n    public ImageFrame(Image image)\n    {\n        setTitle(\"\
  Capture\");\n        setSize(DEFAULT_WIDTH, DEFAULT_HEIGHT);\n        add(new JLabel(new\
  \ ImageIcon(image)));\n    }\n}\n```\n\n\n\n[content]\n\n当你打包应用程序时，你希望给用户提供单个文件，而不是一个充满类文件的目录结构。Java\
  \ 归档（JAR）文件正是为此设计的。JAR 文件可以包含类文件和其他文件类型，例如图像和声音文件。此外，JAR 文件是压缩的，使用了熟悉的 ZIP 压缩格式。\n\
  \n***\n\n![Image](img/tip.jpg) 提示\n\nZIP 格式的替代方案是“pack200”压缩方案，它专门针对更高效地压缩类文件进行了调优。Oracle\
  \ 声称对类文件的压缩率接近 90%。更多信息请参阅 [`http://docs.oracle.com/javase/1.5.0/docs/guide/deployment/deployment-guide/pack200.html`](http://docs.oracle.com/javase/1.5.0/docs/guide/deployment/deployment-guide/pack200.html)\
  \ 。\n\n***\n\n### 13.1.1 创建 JAR 文件\n\n使用 `jar` 工具创建 JAR 文件。（在默认的 JDK 安装中，它位于 `jdk/bin`\
  \ 目录下。）创建新 JAR 文件的常用命令使用以下语法：\n\n点击此处查看代码图像\n\n```bash\njar cvf JARFileName File1\
  \ File2 . . .\n```\n\n例如：\n\n点击此处查看代码图像\n\n```bash\njar cvf CalculatorClasses.jar\
  \ *.class icon.gif\n```\n\n通常情况下，`jar` 命令具有以下格式：\n\n```bash\njar options File1 File2\
  \ ...\n```\n\n表 13.1 列出了 `jar` 程序的所有选项。它们与 UNIX `tar` 命令的选项相似。\n\n![Image](img/13tab01.jpg)\n\
  \n**表 13.1** `jar` 程序选项\n\n你可以将应用程序、程序组件（有时称为“beans”——参见第二卷的第 11 章）和代码库打包成 JAR 文件。例如，JDK\
  \ 的运行时库包含在一个非常大的文件 `rt.jar` 中。\n\n### 13.1.2 清单文件 (Manifest)\n\n除了类文件、图像和其他资源外，每个\
  \ JAR 文件还包含一个描述存档特殊特征的*清单*（manifest）文件。\n\n清单文件名为 `MANIFEST.MF`，位于 JAR 文件中特殊的 `META-INF`\
  \ 子目录下。最合法的清单非常无聊——只是\n\n```text\nManifest-Version: 1.0\n```\n\n复杂的清单可以有更多的条目。清单条目分为若干部分。清单中的第一部分称为*主部分*。它适用于整个\
  \ JAR 文件。随后的条目可以指定命名实体的属性，例如单个文件、包或 URL。这些条目必须以 `Name` 条目开头。各个部分之间用空行隔开。例如：\n\n\
  ```text\nManifest-Version: 1.0\n\n描述此存档的行\n\nName: Woozle.class\n\n描述此文件的行\n\nName:\
  \ com/mycompany/mypkg/\n\n描述此包的行\n```\n\n要编辑清单，将你想要添加到清单中的行放入文本文件中。然后运行\n\n点击此处查看代码图像\n\
  \n```bash\njar cfm JARFileName ManifestFileName . . .\n```\n\n例如，要创建一个带清单的新 JAR\
  \ 文件，运行\n\n点击此处查看代码图像\n\n```bash\njar cfm MyArchive.jar manifest.mf com/mycompany/mypkg/*.class\n\
  ```\n\n要更新现有 JAR 文件的清单，将新增内容放入文本文件并使用如下命令\n\n点击此处查看代码图像\n\n```bash\njar ufm MyArchive.jar\
  \ manifest-additions.mf\n```\n\n***\n\n![Image](img/note.jpg) 注意\n\n关于 JAR 和清单文件格式的更多信息，请参阅\
  \ [`http://docs.oracle.com/javase/8/docs/technotes/guides/jar`](http://docs.oracle.com/javase/8/docs/technotes/guides/jar)。\n\
  \n***\n\n### 13.1.3 可执行 JAR 文件\n\n你可以使用 `jar` 命令的 `e` 选项来指定程序的*入口*（entry point）——即你通常在调用\
  \ `java` 程序启动器时指定的类：\n\n点击此处查看代码图像\n\n```bash\njar cvfe MyProgram.jar com.mycompany.mypkg.MainAppClass\
  \ files to add\n```\n\n或者，你可以在清单中指定程序的*主类*（main class），包括如下形式的语句\n\n点击此处查看代码图像\n\
  \n```text\nMain-Class: com.mycompany.mypkg.MainAppClass\n```\n\n不要为主类名添加 `.class`\
  \ 扩展。\n\n***\n\n![Image](img/caution.jpg) 注意\n\n清单的最后一行必须以换行符结束。否则，清单将无法正确读取。常见的错误是产生一个包含\
  \ `Main-Class` 行但没有行终止符的文本文件。\n\n***\n\n使用任一种方法，用户都可以简单地启动程序：\n\n```bash\njava -jar\
  \ MyProgram.jar\n```\n\n根据操作系统的配置，用户可以这样启动程序：\n\n- 在 Windows 上，`java -jar MyProgram.jar`\n\
  - 在 Solaris 上，`java -jar MyProgram.jar`\n- 在 Mac OS 上，`java -jar MyProgram.jar`\n\
  - 在 OS X 上，`java -jar MyProgram.jar`\n\n### 13.1.4 资源\n\n在 applet 和应用程序中使用的类通常具有关联的数据，例如：\n\
  \n- 图像和声音文件\n- 带有消息字符串的文本文件\n- 带有二进制数据的文件——例如描述地图布局\n\n在 Java 中，这种关联文件被称为*资源*（resource）。\n\
  \n***\n\n![Image](img/note.jpg) 注意\n\n在 Windows 中，“资源”一词有更专门的含义。Windows 资源也包括图像、按钮标签等，但它们被附加到可文件文件并通过编程接口访问。相比之下，Java\
  \ 资源被存储为单独的文件，而不是类文件的一部分。访问和解释资源数据取决于每个程序。\n\n***\n\n例如，考虑一个 `AboutPanel` 类，它显示诸如图\
  \ 13.1 所示的消息。\n\n![Image](img/13fig01.jpg)\n\n**图 13.1** 从 JAR 文件显示资源\n\n当然，面板中的书名和版权年份会在书的下一版本发生变化。为了方便跟踪这一变化，我们将文本放在文件中，而不是将其硬编码为字符串。\n\
  \n但是你应该将 `about.txt` 这样的文件放在哪里呢？当然，将它放在 JAR 文件中与其他程序文件一起是方便的。\n\n类加载器知道如何搜索类文件，直到在类路径、存档或网络服务器上找到它们为止。资源机制为非类文件提供了同样的便利性。以下是必要的步骤：\n\
  \n1. 获取拥有资源的类的 `Class` 对象——例如，`AboutPanel.class`。\n2. 如果资源是图像或音频文件，调用 `getResource(filename)`\
  \ 获取资源位置的 URL。然后使用 `getImage` 或 `getAudioClip` 方法读取它。\n3. 对于图像或音频以外的资源，使用 `getResourceAsStream`\
  \ 方法读取文件中的数据。\n\n[/content]\n\n\n\n\n关键点在于，类加载器记得如何定位该类，因此它随后可以在相同的位置搜索相关的资源。\n\n\
  例如，要使用图像文件 `about.gif` 创建图标，请执行以下操作：\n\n点击此处查看代码图片\n\n```java\nURL url = ResourceTest.class.getResource(\"\
  about.gif\");\n\nImage img = new ImageIcon(url).getImage();\n```\n\n这意味着“在找到 `ResourceTest`\
  \ 类的相同位置定位 `about.gif` 文件”。\n\n要读取文件 `about.txt`，请使用这些命令：\n\n点击此处查看代码图片\n\n```java\n\
  InputStream stream = ResourceTest.class.getResourceAsStream(\"about.txt\");\nScanner\
  \ in = new Scanner(stream, \"UTF-8\");\n```\n\n与其将资源文件放置在与类文件相同的目录中，你也可以将其放在子目录中。然后，你可以使用层级化的资源名称，例如\n\
  \n`data/text/about.txt`\n\n该资源名称相对于相对于加载该资源的类的包进行解释。注意，无论实际存储资源文件的系统上的目录分隔符是什么，你必须始终使用\
  \ `/` 分隔符。例如，在 Windows 文件系统中，资源加载器会自动将 `/` 翻译为 `\\` 分隔符。\n\n以 `/` 开头的资源名称称为绝对资源名称。它的定位方式与包内类的定位方式相同。例如，一个资源\n\
  \n`/corejava/title.txt`\n\n位于 `corejava` 目录中，该目录可能是类路径的子目录、JAR 文件内部，或者对于 applet\
  \ 来说，位于 Web 服务器上。\n\n自动加载文件就是资源加载功能所做的全部工作。没有标准方法来解释资源文件的内容。每个程序必须有自己的方式来解释其资源文件。\n\
  \n资源的常见应用是程序的国际化。依赖于语言的字符串（如消息和用户界面标签）存储在资源文件中，每个语言一个文件。在卷二的第 5 章中讨论的国际化 API 提供了一种用于组织和访问这些本地化文件的标准方法。\n\
  \n列表 13.1\n\n```bash\njavac resource/ResourceTest.java\njar cvfm ResourceTest.jar\
  \ resource/ResourceTest.mf resource/*.class resource/*.gif resource/*.txt\njava\
  \ -jar ResourceTest.jar\n```\n\n将 JAR 文件移动到不同的目录并再次运行它，以检查程序是从 JAR 文件而不是从当前目录读取资源文件。\n\
  \n**列表 13.1** `resource/ResourceTest.java`\n\n点击此处查看代码图片\n\n```java\npackage resource;\n\
  \nimport java.awt.*;\nimport java.io.*;\nimport java.net.*;\nimport java.util.*;\n\
  import javax.swing.*;\n\n/**\n * @version 1.41 2015-06-12\n * @author Cay Horstmann\n\
  \ */\npublic class ResourceTest\n{\n    public static void main(String[] args)\n\
  \    {\n        EventQueue.invokeLater(() -> {\n            JFrame frame = new ResourceTestFrame();\n\
  \            frame.setTitle(\"ResourceTest\");\n            frame.setDefaultCloseOperation(JFrame.EXIT_ON_CLOSE);\n\
  \            frame.setVisible(true);\n        });\n    }\n}\n\n/**\n * 一个加载图像和文本资源的框架。\n\
  \ */\nclass ResourceTestFrame extends JFrame\n{\n    private static final int DEFAULT_WIDTH\
  \ = 300;\n    private static final int DEFAULT_HEIGHT = 300;\n\n    public ResourceTestFrame()\n\
  \    {\n        setSize(DEFAULT_WIDTH, DEFAULT_HEIGHT);\n        URL aboutURL =\
  \ getClass().getResource(\"about.gif\");\n        Image img = new ImageIcon(aboutURL).getImage();\n\
  \        setIconImage(img);\n\n        JTextArea textArea = new JTextArea();\n \
  \       InputStream stream = getClass().getResourceAsStream(\"about.txt\");\n  \
  \      try (Scanner in = new Scanner(stream, \"UTF-8\"))\n        {\n          \
  \  while (in.hasNext())\n                textArea.append(in.nextLine() + \"\\n\"\
  );\n        }\n        add(textArea);\n    }\n}\n```\n\n`java.lang.Class`\n- `URL\
  \ getResource(String name)`\n- `InputStream getResourceAsStream(String name)` 在与类相同的位置查找资源，并返回一个可用于加载资源的\
  \ `URL` 或输入流。如果未找到资源则返回 `null`，因此不会对 I/O 错误抛出异常。\n\n### 13.1.5 密封 (Sealing)\n\n\
  我们在第 4 章中提到，你可以密封一个包以确保其类是可见的。如果你想将包保存到 JAR 文件，通过在 JAR 文件的 manifest 中添加 `Sealed:\
  \ true` 来实现这一点。例如，如果你使用语句\n\n```java\npackage comcompany.util;\n```\n\n为了实现这一点，将\
  \ `comcompany.util` 包保存到 JAR 文件。默认情况下，JAR 文件中的包是不密封的。你可以通过在 JAR 文件的 manifest 中添加\
  \ `Sealed` 行来更改全局默认值，如下所示：\n\n```\nName:comcompany/util/\nSealed: true\nName:comcompany/misc/\n\
  Sealed: false\n```\n\n要密封包，按照 usual 运行 `jar` 命令：\n\n点击此处查看代码图片\n\n```bash\njar cvfm\
  \ MyArchive.jar manifest.mf\n```\n\n### 13.2 偏好的存储\n\n用户通常期望他们的偏好被保存并在下次启动应用程序时恢复。首先，我们将介绍\
  \ Java 传统的简单方法——在属性文件中存储配置。然后转向提供更健壮解决方案的设置 API。\n\n#### 13.2.1 属性映射 (Property Maps)\n\
  \n属性映射是一个存储键值对的数据结构。属性映射通常用于存储配置。属性映射有三个特点：\n\n- 键和值都是字符串。\n- 映射可以从文件中保存并从文件中加载。\n\
  - 有一个默认表。\n\n实现属性映射的 Java 类称为 `Properties`。\n\n属性映射用于指定程序的配置选项，例如：\n\n点击此处查看代码图片\n\
  \n```java\nProperties settings = new Properties();\nsettings.setProperty(\"width\"\
  , \"200\");\nsettings.setProperty(\"title\", \"Hello, World!\");\n```\n\n使用 `store`\
  \ 方法将属性列表保存到文件中。在这里，我们将属性映射保存到 `program.properties` 文件中。第二个参数是包含在文件中的注释。\n\n点击此处查看代码图片\n\
  \n```java\nOutputStream out = new FileOutputStream(\"program.properties\");\nsettings.store(out,\
  \ \"Program Properties\");\n```\n\n示例集给出如下输出：\n\n```\n#Program Properties\n#Mon\
  \ Apr 30 07:22:52 2007\nwidth=200\ntitle=Hello, World!\n```\n\n要从文件中加载属性，使用\n\n\
  点击此处查看代码图片\n\n```java\nInputStream in = new FileInputStream(\"program.properties\"\
  );\nsettings.load(in);\n```\n\n\n\n\n将程序属性存储在用户主目录的子目录下是一种习惯。目录名通常以点（开头——在 UNIX\
  \ 系统上，这种约定表示该目录是对用户隐藏的系统目录。我们的示例程序遵循了这一约定。\n\n要找到用户主目录，你可以调用 `System.getProperties`\
  \ 方法，碰巧，该方法也使用 `Properties` 对象来描述系统信息。主目录的键为 `\"user.home\"`。还有一个方便的方法来读取单个键：\n\n\
  点击此处查看代码图像\n\n```java\nString userDir = System.getProperty(\"user.home\");\n```\n\
  \n为我们的程序属性提供默认值是一个好主意，以防用户手动编辑文件。`Properties` 类有两种提供默认属性的机制。首先，每当你查找字符串的值时，你都可以指定一个默认值，当键不存在时会自动使用该默认值。\n\
  \n点击此处查看代码图像\n\n```java\nString title = settings.getProperty(\"title\", \"Default\
  \ title\");\n```\n\n如果属性映射中存在 `\"title\"` 属性，则 `title` 被赋值为该字符串。否则，`title` 被设置为\
  \ `\"Default title\"`。\n\n如果你觉得在每次调用 `getProperty` 时指定默认值太麻烦了，可以将所有默认值封装在一个二级属性映射中，并在主属性映射的构造函数中提供该映射。\n\
  \n点击此处查看代码图像\n\n```java\nProperties defaultSettings = new Properties();\ndefaultSettings.setProperty(\"\
  width\", \"300\");\ndefaultSettings.setProperty(\"height\", \"200\");\ndefaultSettings.setProperty(\"\
  title\", \"Default title\");\n...\nProperties settings = new Properties(defaultSettings);\n\
  ```\n\n是的，如果你给 `defaultSettings` 构造函数提供另一个属性映射参数，甚至可以为默认值指定默认值，但这通常这样做。\n\nListing\
  \ 13.2 显示了如何使用属性来存储和加载程序状态。程序会记住窗口的位置、大小和标题。你也可以手动编辑主目录下的 `.corejava/program.properties`\
  \ 文件，将程序的外观更改为*你*想要的样子。\n\n***\n\n![Image](img/caution.jpg) 注意\n\n出于历史原因，`Properties`\
  \ 类实现了 `Map<Object, Object>`。因此，你可以使用 `Map` 接口的 `get` 和 `put` 方法。但 `get` 方法返回类型\
  \ `Object`，而 `put` 方法允许你插入任何对象。最好的做法是坚持处理字符串而非对象的 `getProperty` 和 `setProperty`\
  \ 方法。\n\n***\n\n***\n\n![Image](img/note.jpg) Note\n\n属性是不具有层级结构的简单表格。通常会使用如 `window.main.color`、`window.main.title`\
  \ 等键名引入伪层级结构。但 `Properties` 类没有帮助组织此类层次结构的方法。如果你存储复杂的配置信息，应该使用 `Preferences` 类——请参见下一节。\n\
  \n***\n\n**Listing 13.2** `properties/PropertiesTest.java`\n\n点击此处查看代码图像\n\n***\n\
  \n```java\npackage properties;\n\nimport java.awt.EventQueue;\nimport java.awt.event.*;\n\
  import java.io.*;\nimport java.util.Properties;\n\nimport javax.swing.*;\n\n/**\n\
  \ * 一个测试属性的程序。程序会记住窗口的位置、大小\n * 和标题。\n * @version 1.01 2015-06-16\n * @author Cay\
  \ Horstmann\n */\npublic class PropertiesTest\n{\n    public static void main(String[]\
  \ args)\n    {\n        EventQueue.invokeLater(() -> {\n            PropertiesFrame\
  \ frame = new PropertiesFrame();\n            frame.setVisible(true);\n        });\n\
  \    }\n}\n\n/**\n * 一个从属性文件恢复位置和大小并在退出时更新\n *属性的帧。\n */\nclass PropertiesFrame\
  \ extends JFrame\n{\n    private static final int DEFAULT_WIDTH = 300;\n    private\
  \ static final int DEFAULT_HEIGHT = 20;\n\n    private File propertiesFile;\n  \
  \  private Properties settings;\n\n    public PropertiesFrame()\n    {\n       \
  \ // 从获取位置、大小、标题\n        String userDir = System.getProperty(\"user.home\");\n\
  \        File propertiesDir = new File(userDir, \".corejava\");\n        if (!propertiesDir.exists())\
  \ propertiesDir.mkdir();\n        propertiesFile = new File(propertiesDir, \"program.properties\"\
  );\n\n        Properties defaultSettings = new Properties();\n        defaultSettings.setProperty(\"\
  left\", \"0\");\n        defaultSettings.setProperty(\"top\", \"0\");\n        defaultSettings.setProperty(\"\
  width\", \"\" + DEFAULT_WIDTH);\n        defaultSettings.setProperty(\"height\"\
  , \"\" + DEFAULT_HEIGHT);\n        defaultSettings.setProperty(\"title\", \"\");\n\
  \n        settings = new Properties(defaultSettings);\n\n        if (propertiesFile.exists())\n\
  \            try (InputStream in = new FileInputStream(propertiesFile))\n      \
  \      {\n                settings.load(in);\n            }\n            catch (IOException\
  \ ex)\n            {\n                ex.printStackTrace();\n            }\n\n \
  \       int left = Integer.parseInt(settings.getProperty(\"left\"));\n        int\
  \ top = Integer.parseInt(settings.getProperty(\"top\"));\n        int width = Integer.parseInt(settings.getProperty(\"\
  width\"));\n        int height = Integer.parseInt(settings.getProperty(\"height\"\
  ));\n        setBounds(left, top, width, height);\n\n        // 如果没有给出标题，询问用户\n\
  \        String title = settings.getProperty(\"title\");\n        if (title.equals(\"\
  \"))\n            title = JOptionPane.showInputDialog(\"Please supply a frame title:\"\
  );\n        if (title == null) title = \"\";\n        setTitle(title);\n\n     \
  \   addWindowListener(new WindowAdapter()\n        {\n            public void windowClosing(WindowEvent\
  \ event)\n            {\n                settings.setProperty(\"left\", \"\" + getX());\n\
  \                settings.setProperty(\"top\", \"\" + getY());\n               \
  \ settings.setProperty(\"width\", \"\" + getWidth());\n                settings.setProperty(\"\
  height\", \"\" + getHeight());\n                settings.setProperty(\"title\",\
  \ getTitle());\n                try (OutputStream out = new FileOutputStream(propertiesFile))\n\
  \                {\n                    settings.store(out, \"Properties\");\n \
  \               }\n                catch (IOException ex)\n                {\n \
  \                   ex.printStackTrace();\n                }\n                System.exit(0);\n\
  \            }\n        });\n    }\n}\n```\n\n***\n\n### java.util.Properties 1.0\n\
  \n- `Properties()`: 创建空的属性映射。\n- `Properties(Properties defaults)`: 创建带有一组默认值的空属性映射。\n\
  \n![Image](img/792tab01.jpg)\n\n- `String getProperty(String key)`: 获取属性。返回与键关联的字符串；如果键不在表中，则返回默认表中与键关联的字符串；如果键在默认表中也不存在，则返回\
  \ `null`。\n\n![Image](img/792tab02.jpg)\n\n- `String getProperty(String key, String\
  \ defaultValue)`: 获取属性，如果未找到键，则使用默认值。返回与键关联的字符串；如果该键不在表中，则返回默认字符串。\n\n![Image](img/792tab03.jpg)\n\
  \n- `Object setProperty(String key, String value)`: 设置属性。返回给定键之前被设置的值。\n\n![Image](img/792tab04.jpg)\n\
  \n- `void load(InputStream in) throws IOException`: 从输入流加载属性映射。\n\n![Image](img/793tab01.jpg)\n\
  \n\n\n\n\n## `void store(OutputStream out, String header)` **1.2**\n\n将属性映射保存到输出流。\n\
  \n![Image](img/793tab02.jpg)\n\n## java.lang.System **1.0**\n\n### `Properties getProperties()`\n\
  \n检索所有系统属性。应用程序必须具有检索所有属性的权限，否则将抛出安全异常。\n\n### `String getProperty(String key)`\n\
  \n根据给键名检索系统属性。应用程序必须具有检索该属性的权限，否则将抛出安全异常。以下属性始终可以被检索：\n\n`java.version`\n`java.vendor`\n\
  `java.vendor.url`\n`java.class.version`\n`os.name`\n`os.version`\n`os.arch`\n`file.separator`\n\
  `path.separator`\n`line.separator`\n`java.specification.version`\n`java.vm.specification.version`\n\
  `java.vm.specification.vendor`\n`java.vm.specification.name`\n`java.vm.version`\n\
  `java.vm.vendor`\n`java.vm.name`\n\n![Image](img/note.jpg) 注意\n\n你可以在 Java 运行时目录下的\
  \ `security/java.policy` 文件中找到自由访问的系统属性的名称。\n\n## 13.2.2 Preferences API\n\n正如你所看到的，`Preferences`\
  \ 类使得加载和保存配置信息变得简单。然而，使用属性文件有以下缺点：\n\n- 某些操作系统没有“主目录”的概念，导致很难为配置文件找到统一的位置。\n- 配置文件的命名没有标准规范，当用户安装多个\
  \ Java 应用程序时，增加了名称冲突的可能性。\n\n某些操作系统拥有一个配置信息的中央仓库。最为人知的例子是 Microsoft Windows 中的注册表。`Preferences`\
  \ 类以平台无关的方式提供了这样一个中央仓库。在 Windows 中，`Preferences` 类使用注册表存储；在 Linux 中，信息存储在本地文件系统中。对程序员来说，仓库的实现是透明的。\n\
  \n`Preferences` 仓库具有树形结构，带有如 `/com/mycompany/myapp.` 这样的节点路径名。与包名一样，只要程序员以反向域名开头路径，就可以避免名称冲突。事实上，API\
  \ 设计者建议配置节点路径与程序中的包名匹配。\n\n仓库中的每个节点都有一个独立的键值对表，你可以用它存储数字、字符串或字节数组。该 API 未提供存储可序列化对象的规定。API\
  \ 设计者认为序列化格式对于长期存储来说太脆弱了。当然，如果你不同意，可以将序列化对象保存在字节数组中。\n\n为了增加额外的灵活性，存在多个并行的树。每个程序用户拥有一棵树；还有一个额外的树，称为系统树，适用于所有用户通用的设置。`Preferences`\
  \ 类使用操作系统的“当前用户”概念来访问适当的用户树。\n\n要访问树中的节点，从用户根或系统根开始：\n\n点击此处查看代码图像\n\n```\nPreferences\
  \ root = Preferences.userRoot();\n```\n\n或者\n\n点击此处查看代码图像\n\n```\nPreferences root\
  \ = Preferences.systemRoot();\n```\n\n然后访问节点。你可以直接提供节点路径名：\n\n点击此处查看代码图像\n\n```\n\
  Preferences node = root.node(\"/com/mycompany/myapp\");\n```\n\n一个方便的快捷方法可以获取路径名等于类包名的节点。只需获取该类的一个对象并调用\n\
  \n点击此处查看代码图像\n\n```\nPreferences node = Preferences.userNodeForPackage(obj.getClass());\n\
  ```\n\n或者\n\n点击此处查看代码图像\n\n```\nPreferences node = Preferences.systemNodeForPackage(obj.getClass());\n\
  ```\n\n通常，`obj` 将是 `this` 引用。\n\n一旦你拥有了节点，就可以可以使用方法访问键值表：\n\n点击此处查看代码图像\n\n```\n\
  String get(String key, String defval)\nint getInt(String key, int defval)\nlong\
  \ getLong(String key, long defval)\nfloat getFloat(String key, float defval)\ndouble\
  \ getDouble(String key, double defval)\nboolean getBoolean(String key, boolean defval)\n\
  byte[] getByteArray(String key, byte[] defval)\n```\n\n注意，在读取信息时必须指定默认值，以防仓库数据不可用。需要默认值有几个原因：数据可能因为用户从未指定过偏好而缺失；某些资源限制平台可能没有仓库；移动设备可能会临时断开连接。\n\
  \n相反，你可以使用 `put` 方法向仓库写入数据，例如：\n\n```\nput(String key, String value)\nputInt(String\
  \ key, int value)\n```\n\n等等。\n\n你可以使用方法列出节点中存储的所有键：\n\n```\nString[] keys()\n```\n\
  \n目前还没有办法可以找到特定键的值类型。\n\n像 Windows 注册表这样的中央仓库传统上受到两个问题的：\n\n- 它们变成了“垃圾场”，充满了过时信息。\n\
  - 配置数据纠缠在仓库中，使得偏好迁移到新平台变得困难。\n\n`Preferences` 类对第二个问题提供了解决方案。你可以通过调用方法导出子树（或较不常见的单个节点）的偏好：\n\
  \n点击此处查看代码图像\n\n```\nvoid exportSubtree(OutputStream out)\nvoid exportNode(OutputStream\
  \ out)\n```\n\n数据以 XML 格式保存。你可以通过调用以下方法将它们导入另一个仓库：\n\n点击此处查看代码图像\n\n```\nvoid importPreferences(InputStream\
  \ in)\n```\n\n这里是一个示例文件：\n\n点击此处查看代码图像\n\n```xml\n<?xml version=\"1.0\" encoding=\"\
  UTF-8\"?>\n<!DOCTYPE preferences SYSTEM \"http://java.sun.com/dtd/preferences.dtd\"\
  >\n<preferences EXTERNAL_XML_VERSION=\"1.0\">\n  <root type=\"user\">\n    <map/>\n\
  \    <node name=\"com\">\n      <map/>\n      <node name=\"horstmann\">\n      \
  \  <map/>\n        <node name=\"java\">\n          <map>\n            <entry key=\"\
  left\" value=\"1\"/>\n            <entry key=\"top\" value=\"9\"/>\n           \
  \ <entry key=\"width\" value=\"453\"/>\n            <entry key=\"height\" value=\"\
  365\"/>\n            <entry key=\"title\" value=\"Hello, World!\"/>\n          </map>\n\
  \        </node>\n      </node>\n    </node>\n  </root>\n</preferences>\n```\n\n\
  如果你的程序使用了偏好设置，你应该给用户提供导出和导入的机会，这样他们就可以轻松将设置从一台电脑迁移到另一台。13.3 中的程序演示了这种技术。程序只需保存主窗口的位置、大小和标题。调整窗口大小，然后退出并重启应用程序。窗口将像你离开时的一样。\n\
  \n**13.3** `PreferencesTest.java`\n\n点击此处查看代码图像\n\n```java\npackage preferences;\n\
  \nimport java.awt.*;\nimport java.io.*;\nimport java.util.prefs.*;\n\nimport javax.swing.*;\n\
  import javax.swing.filechooser.*;\n\n/**\n * 一个测试偏好设置的程序。程序记录框架\n * 位置、大小和标题。\n\
  \ * @version 1.03 2015-06-12\n * @author Cay Horstmann\n */\npublic class PreferencesTest\n\
  {\n    public static void main(String[] args)\n    {\n        EventQueue.invokeLater(()\
  \ -> {\n            PreferencesFrame frame = new PreferencesFrame();\n         \
  \   frame.setDefaultCloseOperation(JFrame.EXIT_ON_CLOSE);\n            frame.setVisible(true);\n\
  \        });\n    }\n}\n\n```\n\n\n\n\n/**\n * 一个从用户偏好中恢复位置和大小的框架，并在退出时更新偏好。\n */\n\
  ```java\nclass PreferencesFrame extends JFrame\n{\n    private static final int\
  \ DEFAULT_WIDTH = 300;\n    private static final int DEFAULT_HEIGHT = 200;\n   \
  \ private Preferences root = Preferences.userRoot();\n    private Preferences node\
  \ = root.node(\"/com/horstmann/corejava\");\n\n    public PreferencesFrame()\n \
  \   {\n        // 从偏好中获取位置、大小、标题\n        int left = node.getInt(\"left\", 0);\n\
  \        int top = node.getInt(\"top\", 0);\n        int width = node.getInt(\"\
  width\", DEFAULT_WIDTH);\n        int height = node.getInt(\"height\", DEFAULT_HEIGHT);\n\
  \        setBounds(left, top, width, height);\n\n        // 如果没有标题，询问用户\n      \
  \  String title = node.get(\"title\", \"\");\n        if (title.equals(\"\"))\n\
  \            title = JOptionPane.showInputDialog(\"Please supply a frame title:\"\
  );\n        if (title == null) title = \"\";\n        setTitle(title);\n\n     \
  \   // 设置显示 XML 文件的文件选择器\n        final JFileChooser chooser = new JFileChooser();\n\
  \        chooser.setCurrentDirectory(new File(\".\"));\n        chooser.setFileFilter(new\
  \ FileNameExtensionFilter(\"XML files\", \"xml\"));\n\n        // 设置菜单\n       \
  \ JMenuBar menuBar = new JMenuBar();\n        setJMenuBar(menuBar);\n        JMenu\
  \ menu = new JMenu(\"File\");\n        menuBar.add(menu);\n\n        JMenuItem exportItem\
  \ = new JMenuItem(\"Export preferences\");\n        menu.add(exportItem);\n    \
  \    exportItem.addActionListener(event -> {\n            if (chooser.showSaveDialog(PreferencesFrame.this)\
  \ == JFileChooser.APPROVE_OPTION)\n            {\n                try\n        \
  \        {\n                    savePreferences();\n                    OutputStream\
  \ out = new FileOutputStream(chooser.getSelectedFile());\n                    node.exportSubtree(out);\n\
  \                    out.close();\n                }\n                catch (Exception\
  \ e)\n                {\n                    e.printStackTrace();\n            \
  \    }\n            }\n        });\n\n        JMenuItem importItem = new JMenuItem(\"\
  Import preferences\");\n        menu.add(importItem);\n        importItem.addActionListener(event\
  \ -> {\n            if (chooser.showOpenDialog(PreferencesFrame.this) == JFileChooser.APPROVE_OPTION)\n\
  \            {\n                try\n                {\n                    InputStream\
  \ in = new FileInputStream(chooser.getSelectedFile());\n                    Preferences.importPreferences(in);\n\
  \                    in.close();\n                }\n                catch (Exception\
  \ e)\n                {\n                    e.printStackTrace();\n            \
  \    }\n            }\n            savePreferences(); // 逻辑逻辑\n        });\n\n \
  \       JMenuItem exitItem = new JMenuItem(\"Exit\");\n        menu.add(exitItem);\n\
  \        exitItem.addActionListener(event -> {\n            savePreferences();\n\
  \            System.exit(0);\n        });\n    }\n\n    public void savePreferences()\n\
  \    {\n        node.putInt(\"left\", getX());\n        node.putInt(\"top\", getY());\n\
  \        node.putInt(\"width\", getWidth());\n        node.putInt(\"height\", getHeight());\n\
  \        node.put(\"title\", getTitle());\n    }\n}\n```\n\n### java.util.prefs.Preferences\n\
  \n- `Preferences userRoot()` 返回调用程序的根偏好节点。\n- `Preferences systemRoot()` 返回系统范围根偏好节点。\n\
  - `Preferences node(String path)` 返回可以通过给定路径从当前节点到达的节点。如果 `path` 是绝对路径（即以 `/` 开头），则该节点从包含此偏好节点的树根开始定位。如果不存在给定路径的节点，则创建它。\n\
  - `Preferences userNodeForPackage(Class cl)`\n- `Preferences systemNodeForPackage(Class\
  \ cl)` 返回当前用户树或系统树中的一个节点，其绝对路径与类 `cl` 的包名对应。\n- `String[] keys()` 返回所有属于此节点的键。\n\
  - `String get(String key, String defval)`\n- `int getInt(String key, int defval)`\n\
  - `long getLong(String key, long defval)`\n- `float getFloat(String key, float defval)`\n\
  - `double getDouble(String key, double defval)`\n- `boolean getBoolean(String key,\
  \ boolean defval)`\n- `byte[] getByteArray(String key, byte[] defval)` 返回与键关联的值；如果没有与键关联的值、关联值类型不正确或偏好存储库不可用，则返回提供的默认值。\n\
  - `void put(String key, String value)`\n- `void putInt(String key, int value)`\n\
  - `void putLong(String key, long value)`\n- `void putFloat(String key, float value)`\n\
  - `void putDouble(String key, double value)`\n- `void putBoolean(String key, boolean\
  \ value)`\n- `void putByteArray(String key, byte[] value)` 在此节点中存储一个键/值对。\n- `void\
  \ exportSubtree(OutputStream out)` 将此节点及其子节点的偏好写入指定的流。\n- `void exportNode(OutputStream\
  \ out)` 将此节点（但不包括其子节点）的偏好写入指定的流。\n- `void importPreferences(InputStream in)` 导入指定流包含的偏好。\n\
  \n### 13.3 服务加载器 (Service Loaders)\n\n有时你会开发一个具有插件架构的应用程序。有一些平台鼓励这种方法，例如 OSGi ([`osgi.org`](http://osgi.org))，它们被用于开发环境、应用服务器和其他复杂的应用程序。此类平台远超本书的范围，但\
  \ JDK 也提供了一种加载插件的简单机制，我们在此处描述。\n\n通常，在提供插件时，程序希望让插件设计者在实现功能方面具有自由度。提供多个实现供选择也是可能的。`ServiceLoader`\
  \ 类可以方便加载符合公共接口的插件。\n\n定义一个接口（或者如果你喜欢，定义一个父类），包含每个服务的实例应该提供的方法。例如，假设你的服务提供加密。\n\n\
  ```java\npackage serviceLoader;\n\npublic interface Cipher\n{\n    byte[] encrypt(byte[]\
  \ source, byte[] key);\n    byte[] decrypt(byte[] source, byte[] key);\n    int\
  \ strength();\n}\n```\n\n服务提供者提供一个多个实现此服务的类，例如：\n\n```java\npackage serviceLoader.impl;\n\
  \npublic class CaesarCipher implements Cipher\n{\n    public byte[] encrypt(byte[]\
  \ source, byte[] key)\n    {\n        byte[] result = new byte[source.length];\n\
  \        for (int i = 0; i < source.length; i++)\n        {\n            result[i]\
  \ = (byte)(source[i] + key[0]);\n        }\n        return result;\n    }\n\n  \
  \  public byte[] decrypt(byte[] source, byte[] key)\n    {\n        return encrypt(source,\
  \ new byte[] { (byte) -key[0] });\n    }\n\n    public int strength() { return 1;\
  \ }\n}\n```\n\n实现类可以在任何包中，不一定与服务接口在同一个包中。它们每个都必须有一个无参构造函数。\n\n现在，将类名添加到 UTF-8 编码的文本文件中，该文件位于\
  \ `META-INF/services` 目录下，文件名与类的完全限定名匹配。在我们的示例中，文件 `META-INF/services/serviceLoader.Cipher`\
  \ 将包含以下行\n\n\n\n\n\n点击此处查看代码图像\n\n`serviceLoader.impl.CaesarCipher`\n\n在这个示例中，我们提供了一个单一实现类。你也可以提供多个类，并在稍后从中进行选择。\n\
  \n完成这些准备后，程序按如下方式初始化服务加载器：\n\n点击此处查看代码图像\n\n```java\npublic static ServiceLoader<Cipher>\
  \ cipherLoader = ServiceLoader.load(Cipher.class);\n```\n\n这在程序中只需要执行一次。\n\n服务加载器的\
  \ `iterator()` 方法返回一个遍历所有提供的服务实现类的迭代器。（有关迭代器的更多信息，请参阅第 9 章）。最简单的方法是使用增强 `for` 循环来遍历它们。在循环中，选择一个合适的对象来执行服务。\n\
  \n点击此处查看代码图像\n\n```java\npublic static Cipher getCipher(int minStrength)\n{\n  \
  \  for (Cipher cipher : cipherLoader) // 隐式调用 cipherLoader.iterator()\n    {\n \
  \       if (cipher.strength() >= minStrength) return cipher;\n    }\n    return\
  \ null;\n}\n```\n\n* * *\n\n`java.util.ServiceLoader<S>` **1.6**\n\n• `static <S>\
  \ ServiceLoader<S> load(Class<S> service)`\n创建一个服务加载器，用于加载实现给定服务接口的类。\n\n• `Iterator<S>\
  \ iterator()`\n产生一个延迟加载服务类的迭代器。也就是说，每当迭代器移动时就会加载一个类。\n\n* * *\n\n### 13.4 Applets\n\
  \nApplet 是包含在 HTML 页面中的 Java 程序。HTML 页面必须告诉浏览器要加载哪些 applet，以及将每个 applet 放在网页的什么位置。正如你所预期的，使用\
  \ applet 需要的标签必须告诉浏览器从哪里获取类文件，以及 applet 在网页上的定位方式（大小、位置等）。浏览器随后从互联网（或用户机器上的目录）检索类文件并自动运行\
  \ applet。\n\n当 applet 最初被开发时，你必须使用 Sun 的 HotJava 浏览器来查看包含 applet 的网页。自然地，很少用户愿意为了体验一个新网页功能而使用独立的浏览器。当\
  \ Netscape 在其 Navigator 浏览器中包含 Java 虚拟机时，Java applet 变得流行。微软 Internet Explorer 也紧随其后。遗憾的是，Internet\
  \ Explorer 的 Java 支持很快落后，只能与过时的 Java 版本一起，最后被完全弃用。\n\n为了解决这个问题，Sun Microsystems\
  \ 开发了“Java Plug-in”。通过浏览器扩展机制，它插件到各种浏览器中并允许它们通过外部 Java 运行环境执行 Java applet。\n\n多年来，这个解决方案是足够的，applet\
  \ 常被用于教育工具、企业应用和某些游戏。遗憾的是，Sun Microsystems 以及在它终结后的 Oracle 在修复 Java 虚拟机中不断被发现和利用的安全漏洞方面进展很缓慢。由于不安全的\
  \ JVM 会让用户面临真实风险，浏览器制造商增加了使用 Java 的难度。有些阻止了除最新版本以外的所有 Java Plug-in 版本，另一些则停止了对插件架构的支持。Oracle\
  \ 的反应同样令人失望。它开始要求所有 applet 必须经过数字签名（参阅第 13.4.9 节，“签名代码”，位于第 822 页）。\n\n如今，对于开发者来说部署\
  \ Java applet 以及对于用户运行它们都是一项挑战。因此，我们认为接下来的章节将对需要维护旧版 applet 的读者感兴趣。\n\n* * *\n\n\
  ![图像](img/note.jpg) 注意\n\n要在浏览器中运行本章中的 applet，你需要安装当前版本的 Java Plug-in 并确保你的浏览器已与插件连接。为了测试\
  \ applet，你还需要配置插件使其信任本地文件。具体说明请参阅第 2.5 节”，位于第 33 页）。\n\n* * *\n\n#### 13.4.1 一个简单的\
  \ Applet\n\n出于传统起见，让我们写一个 `NotHelloWorld` 程序作为 applet。applet 仅仅是一个扩展了 `java.applet.Applet`\
  \ 类的 Java 类。在书中，我们将使用 Swing 来实现 applet。我们所有的 applet 都将扩展 `JApplet` 类，它是 Swing applet\
  \ 的父类。正如图 13.2 所示，`JApplet` 是普通 `Applet` 类的直接子类。\n\n![图像](img/13fig02.jpg)\n\n**图\
  \ 13.2** Applet 继承图\n\n* * *\n\n![图像](img/note.jpg) 注意\n\n如果你的 applet 包含 Swing 组件，你必须扩展\
  \ `JApplet` 类。在普通的 `Applet` 内部的 Swing 组件无法正确绘制。\n\n* * *\n\n列表 13.4 显示了 applet 的代码。注意这与第\
  \ 10 章的程序是相似的。但由于 applet 位于网页内部，不需要指定类文件。\n\n**列表 13.4** `NotHelloWorld.java`\n\n\
  ```java\npackage applet;\n\nimport java.awt.*;\nimport javax.swing.*;\n\n/**\n *\
  \ @version 12\n * @author Caymann\n */\npublic class NotHelloWorld extends JApplet\n\
  {\n    public void init()\n    {\n        EventQueue.invokeLater(() -> {\n     \
  \       JLabel label = new JLabel(\"Not a World\", SwingConstants.CENTER);\n   \
  \         add(label);\n        });\n    }\n}\n```\n\n* * *\n\n要执行 applet，执行三个步骤：\n\
  \n1. 将 Java 源文件编译为类文件。\n2. 将类封装成 JAR 文件（参阅第 13.1.1 节，“创建 JAR 文件”，位于第 780 页）。\n3.\
  \ 创建一个 HTML 文件告诉浏览器加载哪个类以及 applet 的大小。\n\n这里是该文件的内容：\n\n点击此处查看代码图像\n\n```html\n\
  <applet class=\"applet/NotHelloWorld.class\" archive=\"NotHelloWorld.jar\" width=\"\
  300\" height=\"300\">\n</applet>\n```\n\n在浏览器中查看 applet 之前，使用 JDK 部分的 *applet viewer*\
  \ 程序进行测试是一个好主意。要配合我们的示例使用 applet viewer，输入\n\n点击此处查看代码图像\n\n```bash\nappletviewer\
  \ NotApplet.html\n```\n\n程序的命令行参数是 HTML 文件名，而不是类文件。图 13.3 显示了 applet viewer 显示此\
  \ applet。\n\n![图像](img/13fig03.jpg)\n\n**图 13.3** 在 applet viewer 中查看 applet\n\n\
  applet viewer 适用于第一阶段的测试，但最终你需要在真实的浏览器中运行 applet，以便看到用户看到它们的方式。特别是，applet viewer\
  \ 只显示 applet，而不显示周围的 HTML 文本。如果你的 HTML 文件包含多个 `applet` 标签，applet viewer 会弹出多个窗口。\n\
  \n要正确查看 applet，只需将 HTML 文件加载到浏览器中（参阅图 13.4）。如果 applet 没有显示，你需要安装 Java Plug-in 并允许它加载未签名的本地\
  \ applet，如第 2.5 节\n\n**图 13.4** 在浏览器中查看 applet\n\n\n\n\n如果你对 applet 进行了更改并重新编译，你需要重启浏览器以便加载新的类文件。仅仅刷新\
  \ HTML 页面不会加载新代码。这在调试 applet 时是一件很麻烦的事。你可以通过 `Java console` 避免痛苦的浏览器重启。启动控制台并执行\
  \ `x` 命令，这会清除类加载器缓存。然后你就可以重新加载 HTML 页面，使用新的 applet 代码了。在 Windows 下，在 Windows 控制面板中打开\
  \ Java 插件控制。在 Linux 下，运行 `jcontrol` 并请求显示 Java 控制台。每当加载 applet 时，控制台都会弹出。\n\n***\n\
  \n将图形化 Java 应用程序转换为可以嵌入网页的 applet 是很容易的。本质上，所有的用户界面代码都可以保持不变。以下是具体步骤：\n\n1. 创建一个带有适当标签的\
  \ HTML 页面来加载 applet 代码。\n2. 提供 `JApplet` 类的子类。将该类设置为 `public`。否则，applet 将无法加载。\n\
  3. 移除应用程序中的 `main` 方法。不要为应用程序构建帧窗口（frame window）。你的应用程序将显示在浏览器内部。\n4. 将任何初始化代码从帧窗口构造函数移动到\
  \ applet 的 `init` 方法中。你不需要显式构造 applet 对象——浏览器会为你实例化并调用 `init` 方法。\n5. 移除对 `setSize`\
  \ 的调用；对于 applet，尺寸是通过 HTML 文件中的 `width` 和 `height` 参数设置的。\n6. 移除对 `setDefaultCloseOperation`\
  \ 的调用。applet 不能被关闭；它会在浏览器退出时终止。\n7. 如果应用程序调用了 `setTitle`，请移除对该方法的调用。applet 不能有标题栏。（当然，你可以使用\
  \ HTML 的 `title` 标签为网页本身命名。）\n8. 不要调用 `setVisible(true)`。applet 会自动显示。\n\n***\n\n\
  `java.applet.Applet` **1.0**\n\n- `void init()`：applet 首次加载时被调用。重写此方法并将所有初始化代码放在此处。\n\
  - `void start()`：重写此方法，用于在用户每次访问包含该 applet 的浏览器页面时需要执行的代码。一个典型的操作是重新激活线程。\n- `void\
  \ stop()`：重写此方法，用于在用户每次离开包含该 applet 的浏览器页面时需要执行的代码。一个典型的操作是停用线程。\n- `void destroy()`：重写此方法，用于在用户退出浏览器时需要执行的代码。\n\
  - `void resize(int width, int height)`：请求调整 applet 大。如果这个方法能在网页上运行，这将是一个很好的方法；遗憾的是，它在当前浏览器中不起作用，因为它会干扰页面的布局机制。\n\
  \n***\n\n### 13.4.2 applet HTML 标签及其属性\n\n在最基本的形式下，一个 `applet` 标签示例所示：\n\n点击此处查看代码图像\n\
  \n```html\n<applet code=\"applet/NotHelloWorld.class\" archive=\"NotHelloWorld.jar\"\
  \n       width=\"300\" height=\"100\"></applet>\n```\n\n你可以在 `applet` 标签内使用以下属性：\n\
  \n- `width`, `height`：这些属性是必需的，提供 applet 的宽度和高度（像素）。在 applet 查看器中，这是 applet 的初始\
  \ own。你可以调整 applet 查看器创建的任何窗口。在浏览器中，你无法调整 applet 的 own。你需要很好猜测你的 applet 需要多少空间以便所有用户都能良好显示。\n\
  - `align`：此属性指定 applet 的对齐方式。属性值与 HTML `img` 标签的 `align` 属性相同。\n- `vspace`, `hspace`：这些可选属性指定\
  \ applet 上方和下方（`vspace`）以及左右两侧（`hspace`）的像素数。\n- `code`：此属性提供 applet 类文件名。路径名必须与\
  \ applet 类的包匹配。例如，如果 applet 类在 `com.mycompany` 包中，则属性为 `code=\"com/mycompany/MyApplet.class\"\
  `。允许另一种写法 `code=\"com.mycompany.MyApplet.class\"`。`code` 属性仅指定包含 applet 类的类名。当然，你的\
  \ applet 可能包含其他类文件。一旦浏览器的类加载器加载了包含 applet 的类，它就会意识到需要更多类文件并加载它们。\n- `archive`：此属性列出了包含\
  \ applet 类及其他资源的 JAR 文件或文件。这些文件在 applet 加载之前会从 Web 服务器获取。JAR 文件之间用逗号分隔。例如：\n\n点击此处查看代码图像\n\
  \n```html\n<applet code=\"MyApplet.class\"\n       archive=\"MyClasses.jar,corejava/CoreJavaClasses.jar\"\
  \n       width=\"100\" height=\"150\">\n```\n- `codebase`：此属性是加载 JAR 文件（以及类文件）的\
  \ URL。\n- `object`：此属性指定 applet 状态的文件名。由于没有方法签名 applet，此功能不再好用。\n- `alt`：你可以使用 `alt`\
  \ 属性在 Java 禁用时显示消息。如果浏览器无法处理 applet，它会忽略 `applet` 和 `param` 标签。支持 Java 的浏览器会显示 `<applet>`\
  \ 和 `</applet>` 标签之间的任何文本。例如：\n\n点击此处查看代码图像\n\n```html\n<applet . . alt=\"If you\
  \ activated Java, you would see my applet here\">\n```\n- `name`：脚本编写者可以 applet\
  \ 一个 `name` 属性，用于引用该 applet。要从 JavaScript 访问 applet，你必须先给它命名。\n\n点击此处查看代码图像\n\n\
  ```html\n<applet ... name=\"mine\"></applet>\n```\n\n然后你可以通过 `document.applets.mine`\
  \ 引用该对象。例如：\n\n```javascript\nvar myApplet = document.applets.mine;\n```\n\n然后调用\
  \ applet 方法：\n\n```javascript\nmyApplet.init();\n```\n\n当你想要同一页面上的两个 applet 相互通信时，`name`\
  \ 属性也是至关重要的。为每个 applet 实例指定名称，并将此字符串传递给 `AppletContext` 接口的 `getApplet` 方法。我们将在章后面讨论这种机制，即*applet\
  \ 间通信*（inter-applet communication）。\n\n***\n\n![图像](img/note.jpg) 注意\n\n在 [`www.javaworld.com/javatips/jw-javatip80.html`](http://www.javaworld.com/javatips/jw-javatip80.html)\
  \ 中，Francis Lu 使用 JavaScript 到 Java 的通信解决了一个老问题：如何调整 applet 的 own，使其不受硬编码的 `width`\
  \ 和 `height` 属性的限制。这是 Java 和 JavaScript 集成的良好示例。\n\n***\n\n### 13.4.3 使用参数向 applet\
  \ 传递信息\n\n正如应用程序可以使用命令行信息一样，applet 可以使用嵌入在 HTML 文件中的参数。这是通过名为 `param` 的 HTML 标签以及你定义的属性实现的。例如，假设你想让网页决定\
  \ applet 中使用的字体样式。你可以使用以下 HTML 标签：\n\n点击此处查看代码图像\n\n```html\n<applet code=\"FontParamApplet.class\"\
  \ ...>\n    <param name=\"font\" value=\"Helvetica\"/>\n</applet>\n```\n\n然后你可以使用\
  \ `Applet` 类的 `getParameter` 方法获取参数值。\n\n\n\n\n\n点击此处查看代码图像\n\n```java\npublic class\
  \ FontParamApplet extends JApplet\n{\n    public void init()\n    {\n        String\
  \ fontName = getParameter(\"font\");\n        ...\n    }\n    ...\n}\n```\n\n![Image](img/note.jpg)\
  \ 注意\n\n你只能在 applet 的 `init` 方法中调用 `getParameter` 方法，而不能在构造函数中调用。当 applet 构造函数执行时，参数尚未准备就。由于大多数非复杂\
  \ applet 的布局是由参数决定的，我们建议不要为 applet 提供构造函数。简单地将所有初始化代码放置在 `init` 方法中。\n\n参数始终以字符串的形式返回。如果需要数值类型，你必须将字符串转换为该类型。你可以通过标准方法使用适当的方法（例如\
  \ `Integer` 类的 `parseInt`）来完成此操作。\n\n例如，如果我们想为字体添加一个 `size` 参数，HTML 代码可能如下所示：\n\n\
  点击此处查看代码图像\n\n```html\n<applet code=\"FontParamApplet.class\" ...>\n    <param name=\"\
  font\" value=\"Helvetica\"/>\n    <param name=\"size\" value=\"24\"/>\n</applet>\n\
  ```\n\n接下来的源代码显示了如何读取整数参数：\n\n点击此处查看代码图像\n\n```java\npublic class FontParamApplet\
  \ extends JApplet\n{\n    public void init()\n    {\n        String fontName = getParameter(\"\
  font\");\n        int fontSize = Integer.parseInt(getParameter(\"size\"));\n   \
  \     ...\n    }\n}\n```\n\n![Image](img/note.jpg) 注意\n\n在匹配 `param` 标签中的 `name`\
  \ 属性值与 `getParameter` 方法的参数时，使用的是不区分大小写的比较。\n\n除了确保代码中的参数匹配之外，你还应该检查是否遗漏了 `size`\
  \ 参数。你可以通过一个简单的 `null` 测试来实现这一点。例如：\n\n点击此处查看代码图像\n\n```java\nint fontsize;\nString\
  \ sizeString = getParameter(\"size\");\nif (sizeString == null) fontSize = 12;\n\
  else fontSize = Integer.parseInt(sizeString);\n```\n\n这是一个使用参数绘制柱状图的经典 applet，所示图\
  \ 13.5。\n\n![Image](img/13fig05.jpg)\n\n**图 13.5** 一个图状图 applet\n\n该 applet 从 HTML\
  \ 文件的 `param` 值中获取标签和柱体的高度。以下是图 13.5 HTML 文件的内容：\n\n点击此处查看代码图像\n\n```html\n<applet\
  \ code=\"Chart.class\" width=\"400\" height=\"300\">\n    <param name=\"title\"\
  \ value=\"Diameters of the Planets\"/>\n    <param name=\"values\" value=\"9\"/>\n\
  \    <param name=\"name.1\" value=\"Mercury\"/>\n    <param name=\"name.2\" value=\"\
  Venus\"/>\n    <param name=\"name.3\" value=\"Earth\"/>\n    <param name=\"name.4\"\
  \ value=\"Mars\"/>\n    <param name=\"name.5\" value=\"Jupiter\"/>\n    <param name=\"\
  name.6\" value=\"Saturn\"/>\n    <param name=\"name.7\" value=\"Uranus\"/>\n   \
  \ <param name=\"name.8\" value=\"Neptune\"/>\n    <param name=\"name.9\" value=\"\
  Pluto\"/>\n    <param name=\"value.1\" value=\"3100\"/>\n    <param name=\"value.2\"\
  \ value=\"7500\"/>\n    <param name=\"value.3\" value=\"8000\"/>\n    <param name=\"\
  value.4\" value=\"4200\"/>\n    <param name=\"value.5\" value=\"88000\"/>\n    <param\
  \ name=\"value.6\" value=\"71000\"/>\n    <param name=\"value.7\" value=\"32000\"\
  />\n    <param name=\"value.8\" value=\"30600\"/>\n    <param name=\"value.9\" value=\"\
  1430\"/>\n</applet>\n```\n\n你可以在 applet 中设置一个字符串数组和一个数字数组，但使用参数机制有两个优势。你可以在你的网页上放置多个相同\
  \ applet 的副本，显示不同的图表：只需在页面上放置带有不同参数组的 `applet` 标签即可。此外，你可以更改想要制图的数据。诚然，行星的直径在一段时间内将保持不变，假设你的网页包含一个每周数据图表。由于它是纯文本，更新网页非常容易。而编辑和重新编译\
  \ Java 文件要琐碎得多。事实上，有一些商业级的 JavaBeans 可以制作比我们 applet 更精美的图表。如果你购买了一个，可以将其拖入你的网页中并向其提供参数，而无需知道\
  \ applet 是如何渲染图表的。\n\n列表 13.5 是我们 applet 的源代码。注意，`init` 方法读取参数，而 `paintComponent`\
  \ 方法绘制图表。\n\n**列表 13.5** `chart/Chart.java` 点击此处查看代码图像\n\n```java\npackage chart;\n\
  \nimport java.awt.*;\nimport java.awt.font.*;\nimport java.awt.geom.*;\nimport javax.swing.*;\n\
