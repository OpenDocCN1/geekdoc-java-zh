  \ `main` 方法开始。在 Swing 中，`main` 线程是短寿命。你需要在事件分发线程中构建用户界面，然后退出。在章节前面的部分，我们引入了单线程规则：“不要在事件分发线程以外的线程中接触\
  \ Swing 组件。”在本节中，我们将进一步研究该规则。\n\n单线程规则有几个例外。你可以在任何线程中安全地添加和移除监听器。当然，监听器方法将在事件分发线程中被调用。少数几个\
  \ Swing 方法是线程安全的。它们在 API 文档中特别标记为“此方法是线程安全的，尽管大多数 Swing 方法均不是”。在这些线程安全方法中最有用的是：\n\
  \n- `JTextComponent.setText`\n- `JTextArea.insert`\n- `JTextArea.append`\n- `JTextArea.replaceRange`\n\
  - `JComponent.repaint`\n- `JComponent.revalidate`\n\n从历史上看，单线程规则更为宽松。任何线程都被允许构建组件、设置它们的属性并将其添加到容器中，只要这些组件中没有一个已经实现（realized）。如果一个组件可以接收绘制或验证事件，则它就是已实现的。在对组件调用了\
  \ `setVisible(true)` 或 `pack` 方法之后，或者在组件被添加到一个已经实现的容器之后，就会出现这种情况。\n\n那个版本的单线程规则是非常方便的。它允许你在\
  \ `main` 方法中创建 GUI，然后对应用程序的顶层框架调用 `setVisible(true)`。这不需要在事件分发线程上进行麻烦的 `Runnable`\
  \ 调度。\n\n遗憾的是，某些组件实现者并没有注意原始单线程规则的细微差别。他们在事件分发线程上启动活动，而从未忙于检查组件是否已经实现。例如，如果你在 `JTextComponent`\
  \ 上调用 `setSelectionStart` 或 `setSelectionEnd`，即使组件不可见，也会在事件分发线程中调度光标移动。\n\n本完全可以检测并修复这些问题，但\
  \ Swing 的设计者选择了简单的处理之径。他们规定，从事件分发线程以外的任何线程访问组件永远是不安全的。因此，你需要在事件分发线程中构建用户界面，并使用我们在所有示例程序中见过的\
  \ `EventQueue.invokeLater` 调用。\n\n\n\n\n\n当然，有很多程序并没有那么小心，它们仍然遵循旧版本的单线程规则，在主线程上初始化用户界面。这些程序会带来微小的风险，即某些用户界面的初始化可能会导致事件分发线程上的操作与主线程上的操作发生冲突。正如我们在第\
  \ 10 章中所提到的，你并不希望成为那少数倒霉蛋、遇到麻烦并浪费时间去调试间歇性线程错误的人之一。因此，你应该简单地遵循严格的单线程规则。\n\n你现在已经完成了《核心\
