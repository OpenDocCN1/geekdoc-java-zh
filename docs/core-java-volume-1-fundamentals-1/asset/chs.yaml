  ### 8.2 定义泛型类\n\n`generic class` 是带有一个或多个类型变量类。在本章中，我们将一个简单的 `Pair` 类作为示例。该类允许我们专注于泛型而不受存储细节的分心。这里是泛型\
  \ `Pair` 类的代码：\n\n点击此处查看代码图像\n\n```java\npublic class Pair<T>\n{\n   private T first;\n\
  \   private T second;\n   public Pair() { first = null; second = null; }\n   public\
  \ Pair(T first, T second) { this.first = first; this.second = second; }\n   public\
  \ T getFirst() { return first; }\n   public T getSecond() { return second; }\n \
  \  public void setFirst(T newValue) { first = newValue; }\n   public void setSecond(T\
  \ newValue) { second = newValue; }\n}\n```\n\n`Pair` 类在类名后用角括号 `< >` 引入了类型变量 `T`。泛型类可以有多个类型变量。例如，我们可以为第一个和第二个字段定义不同的类型：\n\
  \n点击此处查看代码图像\n\n```java\npublic class Pair<T, U> { . . . }\n```\n\n类型变量在整个类定义中用于指定方法的返回类型以及字段和局部变量的类型。例如：\n\
