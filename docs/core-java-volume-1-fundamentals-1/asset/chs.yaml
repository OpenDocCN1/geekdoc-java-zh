  \      panel.add(ok);\n      add(panel, BorderLayout.SOUTH);\n      pack();\n  \
  \  }\n}\n```\n\n### 12.7.3 数据交换\n\n弹出对话框最常见的原因是从用户获取信息。你已经学习了如何轻松创建一个对话框对象：给它提供初始数据并调用\
  \ `setVisible(true)` 将对话框显示在屏幕上。现在让我们看看如何在对话框之间传输数据。\n\n考虑图 12.39 中的对话框，它可以用于获取连接某些在线服务所需的用户名和密码。\n\
  \n你的对话框应该提供设置默认数据的方法。例如，示例程序中的 `PasswordChooser` 类有一个方法 `setUser`，用于将默认值填充到相应的字段中：\n\
  \n点击此处查看代码图片\n\n```java\npublic void setUser(User u)\n\n{\n```\n\n\n\n\n```java\n\
  username.setText(u.getName());\n```\n\n一旦设置了默认（如果需要），通过调用 `setVisible(true)` 来显示对话框。此时对话框就会显示。\n\
  \n随后用户填写信息并点击 OK 或 Cancel 按钮。这两个按钮的事件处理器都会调用 `setVisible(false)`，这会终止对 `setVisible(true)`\
  \ 的调用。或者，用户也可以关闭对话框。如果你没有为对话框安装窗口监听器，则应用默认的窗口关闭操作：对话框变为不可见，这也会终止对 `setVisible(true)`\
  \ 的调用。\n\n重要的问题是，`setVisible(true)` 的调用会阻塞直到用户关闭对话框。这使得实现模态对话框变得简单。\n\n你想知道用户是接受还是取消了对话框。我们的示例代码在显示对话框之前将\
  \ `ok` 标志设为 `false`。只有 OK 按钮的事件处理器会将 `ok` 设为 `true`；这就是你从对话框获取用户输入的方法。\n\n***\n\n\
  ![Image](img/note.jpg) 注意\n\n从模态对话框传出数据并不简单。当显示模态对话框时，`setVisible(true)` 的调用不会阻塞，程序在对话框显示期间继续运行。如果用户在模态对话框上选择了项目并然后点击\
  \ OK，对话框需要向程序中的某个监听器发送一个事件。\n\n***\n\n示例程序包含了另一个有用的改进。当你构造 `JDialog` 对象时，你需要指定所有者帧（owner\
  \ frame）。然而，通常你想要用不同的所有者帧显示同一个对话框。最好在*准备好显示对话框时*选择所有者帧，而不是在构造 `PasswordChooser`\
  \ 对象时。\n\n技巧是让 `PasswordChooser` 继承 `JPanel` 而不是 `JDialog`。在 `showDialog` 方法中动态构建\
  \ `JDialog` 对象：\n\n点击此处查看代码图片\n\n```java\npublic boolean showDialog(Frame owner,\
  \ String title)\n{\n    ok = false;\n    if (dialog == null || dialog.getOwner()\
  \ != owner)\n    {\n        dialog = new JDialog(owner, true);\n        dialog.add(this);\n\
  \        dialog.pack();\n    }\n    dialog.setTitle(title);\n    dialog.setVisible(true);\n\
  \    return ok;\n}\n```\n\n注意，`owner` 等于 `null` 是安全的。\n\n你可以做得更好。有时所有者帧并不容易直接获取。从任何\
  \ `parent` 组件计算它应该是容易的，如下所示：\n\n点击此处查看代码图片\n\n```java\nFrame owner;\nif (parent\
  \ instanceof Frame)\n    owner = (Frame) parent;\nelse\n    owner = (Frame) SwingUtilities.getAncestorOfClass(Frame.class,\
  \ parent);\n```\n\n我们在示例程序中使用这种增强功能。`JOptionPane` 类也使用了这种机制。\n\n许多对话框有一个*默认按钮*，如果用户按下触发键（在大多数外观和界面实现中为\
  \ Enter 键），该默认按钮会被自动选中。默认按钮会被特别标记，通常带有粗粗的轮框。\n\n在对话框的*根面板（root pane）*中设置默认按钮：\n\n\
  点击此处查看代码图片\n\n```java\ndialog.getRootPane().setDefaultButton(okButton);\n```\n\n\
  如果你遵循我们在面板中布局对话框的建议，那么你必须小心在将面板封装进对话框之后再设置默认按钮。面板对话框本身没有根面板。\n\nListing 12.19 是程序的帧类，它说明了数据流出对话框的流向。Listing\
  \ 12.20 显示了对话框类。\n\n**Listing 12.19** `dataExchange/DataExchangeFrame.java`\n\n\
  点击此处查看代码图片\n\n***\n\n```java\npackage dataExchange;\n\nimport java.awt.*;\nimport\
  \ java.awt.event.*;\nimport javax.swing.*;\n\n/**\n * 一个带有菜单的帧，其 File->Connect 动作会显示密码对话框。\n\
  \ */\npublic class DataExchangeFrame extends JFrame\n{\n    public static final\
