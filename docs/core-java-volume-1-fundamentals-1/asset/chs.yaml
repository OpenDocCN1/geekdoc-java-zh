  \n- `String formatMessage(LogRecord record)`\n返回记录的本地化且格式化的消息部分。\n\n### 7.6 调试技巧\n\
  \n假设你写好了程序，并通过捕获并正确处理所有异常使其无懈击。然后你运行它，它运行并不正常。现在怎么办？（如果你从未遇到过这个问题，可以跳过本章剩余部分。）\n\
  \n当然，有一个方便且强大的调试器最好。调试器是 Eclipse 和 NetBeans 等专业开发环境的一部分。在本节中，我们为你提供了一些启动调试器之前值得尝试的提示。\n\
  \n**1.** 你可以使用如下代码打印或记录变量的值：\n\n```\nSystem.out.println(\"x=\" + x);\n```\n\n或者\n\
  \n```\nLogger.getGlobal().info(\"x=\" + x);\n```\n\n如果 `x` 是数字，它会被转换为字符串。如果 `x`\
  \ 是一个对象，Java 会调用其 `toString` 方法。要获取隐式参数对象的状态，请打印 `this` 对象的状态。\n\n\n\n\n创建几个对象，调用所有方法，并检查每一个是否都执行了正确的操作。你可以保留所有这些\
  \ `main` 方法，并在每个文件上单独启动 Java 虚拟机来运行测试。当你运行一个 applet（小程序）时，这些 `main` 方法都不会被调用。当你运行一个应用程序时，Java\
  \ 虚拟机只会调用启动类的 `main` 方法。\n\n### 3. 如果你喜欢上面的提示，你应该检查一下 [`http://junit.org`](http://junit.org)\
  \ 中的 JUnit。JUnit 是一个非常流行的单元测试框架，可以让你轻松地组织测试用例集。每当你修改类时运行测试，每当你发现 bug 时就添加另一个测试用例。\n\
  \n### 4. `logging proxy`（日志代理）是子类的一个对象，它可以拦截方法调用、记录日志，然后调用父类。例如，如果你在 `Random` 类的\
  \ `nextDouble` 方法上有问题，可以创建一个匿名子类的实例作为代理对象：\n\n点击此处查看代码图像\n\n```\nRandom generator\
  \ = new\n    Random()\n    {\n      public double nextDouble()\n      {\n      \
  \    double result = super.nextDouble();\n          Logger.getGlobal().info(\"nextDouble:\
  \ \" + result);\n          return result;\n      }\n    };\n```\n\n每当 `nextDouble`\
  \ 方法被调用时，都会生成一条日志消息。要找出是谁调用了该方法，生成堆栈跟踪（stack trace）。\n\n### 5. 你可以通过 `Throwable`\
  \ 类中的 `printStackTrace` 方法从任何异常对象获取堆栈跟踪。以下代码捕获任何异常，打印异常对象和堆栈跟踪，并重新抛出异常以便其找到预期的处理器。\n\
  \n```java\ntry\n{\n   ...\n}\ncatch (Throwable t)\n{\n   t.printStackTrace();\n\
  \   throw t;\n}\n```\n\n你甚至不需要捕获异常就可以生成堆栈跟踪。只需在代码的任何地方插入语句\n\n`Thread.dumpStack();`\n\
  \n即可获取堆栈跟踪。\n\n### 6. 通常，堆栈跟踪显示在 `System.err.`。如果你想记录或显示堆栈跟踪，可以将其捕到一个字符串中：\n\n点击此处查看代码图像\n\
  \n```java\nStringWriter out = new StringWriter();\nnew Throwable().printStackTrace(new\
  \ PrintWriter(out));\nString description = out.toString();\n```\n\n### 7. 将程序错误捕到文件中通常非常方便。然而，错误被发送到\
  \ `System.err` 而不是 `System.out`。因此，你不能简单地通过运行来捕获它们：\n\n`java MyProgram > errors.txt`\n\
  \n相反，将错误流捕获为\n\n\n\n`java MyProgram 2> errors.txt`\n\n要在同一个文件中捕获 `System.err` 和\
  \ `System.out`，请使用\n\n点击此处查看代码图像\n\n```bash\njava MyProgram 1> errors.txt 2>&1\n\
  ```\n\n这在 `bash` 和 Windows shell 中有效。\n\n### 8. 让未捕获异常的堆栈跟踪显示在 `System.err` 中并不是理想的。如果用户意外看到这些消息，会让他们感到困惑，而且当你需要它们时，它们无法用于诊断。更好的方法是将它们记录到文件中。你可以通过静态方法\
  \ `Thread.setDefaultUncaughtExceptionHandler` 来更改未捕获异常的处理器：\n\n点击此处查看代码图像\n\n```java\n\
  Thread.setDefaultUncaughtExceptionHandler(\n    new Thread.UncaughtExceptionHandler()\n\
  \    {\n      public void uncaughtException(Thread t, Throwable e)\n      {\n  \
  \        save information in log file\n      }\n    };\n);\n```\n\n### 9. 要观察类加载过程，请使用\
