  \n#### 14.5.5 synchronized 关键字\n\n在前面的节中，你已经学习了如何使用 `Lock` 和 `Condition` 对象。在继续下去之前，让我们总结一下关于锁和条件的关键点：\n\
  - 锁保护代码段，允许一次只有一个线程执行代码。\n- 锁管理尝试进入受保护代码的线程。\n- 一个锁可以有一个或多个条件对象。\n- 每个条件对象管理已进入受保护区域但无法继续执行的线程。\n\
  \n`Lock` 和 `Condition` 接口为程序员提供了对锁的高粒度控制。然而，在大多数情况下，你不需要那种控制——你可以使用 Java 语言内置的机制。从\
  \ 1.0 版本以来，Java 中的每个对象都有一个内建锁（intrinsic lock）。如果一个方法用 `synchronized` 关键字声明，该对象的锁就会保护整个方法。也就是说，要调用该方法，线程必须获取内建锁。换句话说，\n\
  \n```java\npublic synchronized void method()\n{\n    // 方法体\n}\n```\n\n等同于\n\n```java\n\
  public void method()\n{\n    intrinsicLock.lock();\n    try\n    {\n        // 方法体\n\
  \    }\n    finally { intrinsicLock.unlock(); }\n}\n```\n\n例如，与其使用式锁，我们可以简单地将 `Bank`\
  \ 类的 `transfer` 方法声明为 `synchronized`。内建对象锁只有一个关联条件。`wait` 方法将线程添加到等待集，而 `notifyAll`/`notify`\
  \ 方法则解阻塞线程。换句话说，调用 `wait` 或 `notifyAll` 等同于\n\n```java\nintrinsicCondition.await();\n\
  intrinsicCondition.signalAll();\n```\n\n**注意**：`wait`、`notifyAll` 和 `notify` 方法是\
  \ `Object` 类的 `final` 方法。`Condition` 方法必须命名为 `await`、`signalAll` 和 `signal`，以避免与这些方法冲突。\n\
  \n例如，你可以这样在 Java 中实现 `Bank` 类：\n\n```java\nclass Bank\n{\n    private double[] accounts;\n\
  \    public synchronized void transfer(int from, int to, int amount) throws InterruptedException\n\
  \    {\n        while (accounts[from] < amount)\n            wait(); // 在内建对象锁单一条件上等待\n\
  \        accounts[from] -= amount;\n        accounts[to] += amount;\n        notifyAll();\
  \ // 通知所有等待该条件的线程\n    }\n    public synchronized double getTotalBalance() { . .\
  \ . }\n}\n```\n\n如你所见，使用 `synchronized` 关键字产生的代码简洁得多。当然，为了理解这段代码，你必须知道每个对象都有一个内建锁，并且该锁有一个内建条件。锁管理尝试进入\
  \ `synchronized` 方法的线程。条件管理调用了 `wait` 的线程。\n\n**提示**：`synchronized` 方法相对直接。然而，初学者经常在条件上遇到困扰。在使用\
  \ `wait/notifyAll` 之前，你应该考虑使用第 14.10 节“同步器”（第 934 页）描述的构造之一。\n\n将静态方法声明为 `synchronized`\
  \ 也是合法的。如果调用此类方法，它会获取关联类对象的内建锁。例如，如果 `Bank` 类有一个静态同步方法，那么在调用时，`Bank.class` 对象会被锁定。结果是其他线程无法调用该类或同一类的其他同步静态方法。\n\
  \n内建锁和条件有一些局限性。其中：\n- 你无法中断尝试获取锁的线程。\n- 在尝试获取锁时无法指定超时时间。\n- 一个锁只有一个条件可能会效率低下。\n\n\
  在代码中应该用什么——`Lock` 和 `Condition` 对象还是 `synchronized` 方法？这是我们的建议：\n- 最好既不使用 `Lock`/`Condition`\
  \ 也使用 `synchronized` 关键字。在许多情况下，你可以使用 `java.util.concurrent` 包中的机制之一，它们会为你完成所有的锁操作。例如，在第\
  \ 14.6 节。\n\n\n\n\n```java\n35          System.out.print(Thread.currentThread());\n\
  36          accounts[from] -= amount;\n37          System.out.printf(\" %10.2f from\
  \ %d to %d\", amount, from, to);\n38          accounts[to] += amount;\n39      \
  \    System.out.printf(\" Total Balance: %10.2f%n\", getTotalBalance());\n40   \
  \       notifyAll();\n41      }\n\n/**\n * 获取所有账户余额的总和。\n * @return 总余额\n */\npublic\
  \ synchronized double getTotalBalance()\n{\n    double sum = 0;\n\n    for (double\
  \ a : accounts)\n        sum += a;\n\n    return sum;\n}\n\n/**\n * 获取银行中的账户数量。\n\
  \ * @return 账户数量\n */\npublic int size()\n{\n    return accounts.length;\n}\n}\n\
  ```\n\n`java.lang.Object` 1.0\n\n- `void notifyAll()`\n解除在该对象上调用 `wait` 的线程阻塞。此方法只能在同步方法或同步块内部调用。如果当前线程不是对象锁的所有者，该方法将抛出\
  \ `IllegalMonitorStateException`。\n\n- `void notify()`\n在该对象上调用 `wait` 的线程中随机解除一个线程阻塞。此方法只能在同步方法或同步块内部调用。如果当前线程不是对象锁的所有者，该方法将抛出\
  \ `IllegalMonitorStateException`。\n\n- `void wait()`\n导致线程等待直到其被通知。此方法只能在同步方法或同步块内部调用。如果当前线程不是对象锁的所有者，该方法将抛出\
  \ `IllegalMonitorStateException`。\n\n- `void wait(long millis)`\n- `void wait(long\
  \ millis, int nanos)`\n导致线程等待直到其被通知或指定的时长到为止。这些方法只能在同步方法或同步块内部调用。如果当前线程不是对象锁的所有者，它们将抛出\
  \ `IllegalMonitorStateException`。\n\n![Image](img/882tab01.jpg)\n\n#### 14.5.6 同步块\n\
  \n正如我们刚刚讨论的，每个 Java 对象都拥有一把锁。线程可以通过调用同步方法来获取锁。获取锁的第二种机制是：进入 `synchronized block`（同步块）。当线程进入形式如下的块时：\n\
  \n```java\nsynchronized (obj) // 这是同步块的语法\n{\n    critical section\n}\n```\n\n此时它就获取了\
  \ `obj` 的锁。\n\n你有时会发现“临时（ad hoc）”锁，例如：\n\n```java\npublic class Bank\n{\n   private\
  \ double[] accounts;\n   private Object lock = new Object();\n   . . .\n   public\
  \ void transfer(int from, int to, int amount)\n   {\n       synchronized (lock)\
  \ // 一个临时锁\n       {\n           accounts[from] -= amount;\n```\n\n（注：原文中存在大量重复的示例代码，已根据要求仅保留核心内容并翻译。）\n\
  \n\n\n\n如果你使用 `locks` 来保护可以被多个线程访问的代码，就不会出现这些问题。编译器被要求遵守 `locks`，在需要时刷新本地缓存，并且不恰当地重排指令。细节在\
  \ JSR `133` 开发的 Java 内存模型和线程规范中进行了解释（参见 [`www.jcp.org/en/jsr/detail?id=133`](http://www.jcp.org/en/jsr/detail?id=133)）。该规范的大部分内容非常复杂且具有技术性，但文档也包含许多解释清晰的示例。Brian\
  \ Goetz 编写的一篇更易理解的概述文章可以在 [`www.ibm.com/developerworks/library/j-jtp02244`](http://www.ibm.com/developerworks/library/j-jtp02244)找到。\n\
  \n***\n\n![Image](img/note.jpg) 注意\nBrian Goetz 创造了以下“同步格言”：“如果你写了一个接下来可能被另一个线程读取的变量，或者你读取了一个最近可能被另一个线程写入的变量，你必须使用同步。”\n\
  \n***\n\n`volatile` 关键字为同步实例字段的访问提供了一种无锁机制。如果你将一个字段声明为 `volatile`，那么编译器和虚拟机就会考虑到该字段可能会被另一个线程并发更新。\n\
  \n例如，假设一个对象有一个 `boolean` 标记 `done`，由一个线程设置并在另一个线程查询。正如我们已经讨论的，你可以使用锁：\n\n点击此处查看代码\n\
  \n```java\nprivate boolean done;\n\npublic synchronized boolean isDone() { return\
  \ done; }\n\npublic synchronized void setDone() { done = true; }\n```\n\n或许使用内置对象锁并不是好主意。如果另一个线程锁定了该对象，`isDone`\
  \ 和 `setDone` 方法可能会阻塞。如果存在这种担心，可以为这个变量使用一个单独的锁。但这会变得非常麻烦。\n\n在这种情况下，将字段声明为 `volatile`\
  \ 是合理的：\n\n点击此处查看代码\n\n```java\nprivate volatile boolean done;\n\npublic boolean\
  \ isDone() { return done; }\n\npublic void setDone() { done = true; }\n```\n\n编译器将插入适当的代码，以确保一个线程对\
  \ `done` 变量的变化对于读取该变量的任何其他线程可见的。\n\n***\n\n![Image](img/caution.jpg) 注意\nVolatile\
  \ 变量不提供任何原子性。例如，该方法\n\n点击此处查看代码\n\n```java\npublic void flipDone() { done = !done;\
  \ } // 不是原子的\n```\n\n并不保证能够翻转字段的值。无法保证读取、翻转和写入的过程是不中断的。\n\n***\n\n### 14.5.9 Final\
  \ 变量\n\n正如你在上一节中看到的，除非你使用 `locks` 或 `volatile` 修饰符，否则你无法从多个线程安全地读取字段。\n\n还有一种安全访问共享字段的情况——当它被声明为\
  \ `final` 时。考虑\n\n点击此处查看代码\n\n```java\nfinal Map<String, Double> accounts = new\
  \ HashMap<>();\n```\n\n其他线程在构造函数执行完成后可以看到 `accounts` 变量。\n\n如果不使用 `final`，无法保证其他线程能看到\
  \ `accounts` 的更新值——它们可能都看到 `null`，而不是构造好的 `HashMap`。\n\n当然，在 map 上的操作不是线程安全的。如果多个线程变异并读取\
  \ map，你仍然需要 `locks`。\n\n### 14.5.10 原子类 (Atomics)\n\n只要你执行的是除赋值以外的操作，就可以将共享变量声明为\
  \ `volatile`。\n\n`java.util.concurrent.atomic` 包中有一许多类，它们使用高效的机器级指令在不使用 `locks`\
  \ 的情况下保证其他操作的原子性。例如，`AtomicInteger` 类具有 `incrementAndGet` 和 `decrementAndGet` 方法，可以原子地递增或减少一个整数。例如，你可以安全地生成这样的数字序列：\n\
  \n点击此处查看代码\n\n```java\npublic static AtomicLong nextNumber = new AtomicLong();\n\
  \n// 在某个线程中...\n\nlong id = nextNumber.incrementAndGet();\n```\n\n`incrementAndGet`\
  \ 方法原子地递增 `AtomicLong` 并返回自增后的值。也就是说，获取值、加 1、设置值和产生新值的操作是无法被中断的。即使多个线程并发访问同一个实例，也能保证计算并返回正确的值。\n\
  \n虽然有用于原子地设置、添加和减去值的方法，但如果你想进行更复杂的更新，就必须使用 `compareAndSet` 方法。例如，假设你想跟踪由不同线程观察到的最大值。以下代码不起作用：\n\
  \n点击此处查看代码\n\n```java\npublic static AtomicLong largest = new AtomicLong();\n\n\
  // 在某个线程中...\n\nlargest.set(Math.max(largest.get(), observed)); // 错误--竞态条件！\n```\n\
  \n这种更新不是原子的。相反，计算新值并在循环中使用 `compareAndSet`：\n\n点击此处查看代码\n\n```java\ndo {\n    oldValue\
  \ = largest.get();\n    newValue = Math.max(oldValue, observed);\n} while (!largest.compareAndSet(oldValue,\
  \ newValue));\n```\n\n如果另一个线程也在更新 `largest`，它可能比这个线程更快。那么 `compareAndSet` 将返回 `false`。在这种情况下，循环重试读取更新后的值。最终它会成功。\n\
  \n在 Java 8 中，你不再需要写循环了。相反，你提供一个 lambda 表达式来更新变量，更新会自动完成。在我们的示例中，我们可以调用\n\n点击此处查看代码\n\
  \n```java\nlargest.updateAndGet(x -> Math.max(x, observed));\n```\n\n或者\n\n点击此处查看代码\n\
  \n```java\nlargest.accumulateAndGet(observed, Math::max);\n```\n\n`accumulateAndGet`\
  \ 方法接收一个用于合并原子值和传入参数的二元运算符。还有 `getAndUpdate` 和 `getAndAccumulate` 方法返回旧值。\n\n***\n\
  \n> 注意\n这些方法也为 `AtomicInteger`、`AtomicIntegerArray`、`AtomicIntegerFieldUpdater`、`AtomicLongArray`、`AtomicLongFieldUpdater`、`AtomicReference`、`AtomicReferenceArray`\
  \ 和 `AtomicReferenceFieldUpdater` 提供。\n\n***\n\n当有大量线程访问相同的原子值时，由于乐观更新需要多次重试，性能会下降。Java\
  \ 8 提供了 `LongAdder` 和 `LongAccumulator` 来解决这个问题。`LongAdder` 由多个变量组成，它们的和就是当前值。多个线程可以更新不同的加数，当线程数增加时会自动提供新的加数。这在所有工作完成后才需要和值的情况下是非常高效的。性能提升可能是巨大的。\n\
  \n如果你预见到高竞争，你应该直接使用 `LongAdder` 而不是 `AtomicLong`。方法名略有不同。调用 `increment` 递增计数器或 `add`\
  \ 添加数量，并使用 `sum` 获取总和。\n\n点击此处查看代码\n\n```java\nfinal LongAdder adder = new LongAdder();\n\
  \nfor (. . .) {\n    pool.submit(() -> {\n        while (. . .) {\n            .\
  \ . .\n            if (. . .) adder.increment();\n        }\n    });\n}\n\n. . .\n\
  \nlong total = adder.sum());\n```\n\n\n\n\n当然，`increment` 方法不会返回旧值。这样做会抵消将和拆分为多个加数所带来的效率提升。\n\
  \n* * *\n\n`LongAccumulator` 将这一思想推广到任意的累加操作。在构造函数中，你提供该操作以及它的单位元。要合并新值，请调用 `accumulate`。调用\
  \ `get` 获取当前值。以下效果与 `LongAdder` 相同：\n\n点击此处查看代码图像\n\n```\nLongAccumulator adder\
  \ = new LongAccumulator(Long::sum, 0);\n\n// 在某些线程中...\n\nadder.accumulate(value);\n\
  ```\n\n在内部，累加器拥有变量 `a[1]`、`a[2]`、`. .`、`a[n]`。每个变量初始化为单位元（在我们的示例中为 `0`）。\n\n当调用\
  \ `accumulate` 并传入值 `v` 时，其中一个变量会被原子地更新为 `a[i] = a[i] op v`，其中 `op` 是以中缀形式编写的累加操作。在我们的示例中，调用\
  \ `accumulate` 会为某个 `i` 计算 `a[i] = a[i] + v`。\n\n`get` 的结果是 `a[1] op a[2] op ...\
  \ op a[n]`。在我们的示例中，这就是所有累加器的和，`a[1] + a[2] + ... + a[n]`。\n\n如果你选择不同的操作，可以计算最大或最小值。通常，该操作必须满足结合律和交换律。这意味着最终结果与中间值组合的顺序无关。\n\
  \n还有 `DoubleAdder` 和 `DoubleAccumulator`，它们的工作方式相同，只是处理 `double` 类型的值。\n\n### 14.5.11\
  \ 死锁\n\n锁和条件无法解决多线程中出现的所有问题。考虑以下情况：\n\n1. 账户 1：$200\n2. 账户 2：$300\n3. 线程 1：从账户 1\
  \ 转账 $300 到账户 2\n4. 线程 2：从账户 2 转账 $400 到账户 1\n\n正如图 14.6 所示，线程 1 和 2 显然都被阻塞了。它们都无法继续，因为账户\
  \ 1 和账户 2 的余额不足。\n\n![Image](img/14fig06.jpg)\n\n**图 14.6** 死锁现场\n\n所有线程都可能阻塞，因为每个线程都在等待更多的钱。这种情况被称为死锁。\n\
  \n在我们的程序中，死锁发生的原因很简单。每个转账金额最多为 $1,000。由于有 100 个账户且总金额为 $100,000，任何时候至少有一个账户拥有至少\
  \ $1,000。因此，从该账户取出资金的线程可以继续。\n\n但如果你修改线程的 `run` 方法以移除 $1,000 的交易限制，死锁会迅速发生。尝试一下。将\
  \ `NACCOUNTS` 设置为 `10`。构造每个转账任务，其 `max` 值为 `2 * INITIAL_BALANCE` 并运行程序。程序将运行一段时间后挂起。\n\
  \n* * *\n\n![Image](img/tip.jpg) 提示\n\n当程序挂起时，按下 Ctrl+\\。你会得到一个列出所有线程的线程转储。每个线程都有栈跟踪，告诉它当前阻塞在哪里。或者，按照第\
  \ 7 章中的描述运行 `jconsole` 并查看 Threads 面板（参见图 14.7).\n\n* * *\n\n![Image](img/14fig07.jpg)\n\
  \n**图 14.7** jconsole 中的 Threads 面板\n\n创建死锁的另一种方法是让第 $i$ 个线程负责向第 $i$ 个账户存款，而不是从第\
  \ $i$ 个账户取。在这种情况下，所有线程可能会围攻同一个账户，每个试图从中取出超过余额的钱。尝试一下。在 `SynchBankTest` 程序中，转到 `TransferRunnable`\
  \ 类的 `run` 方法。在调用 `transfer` 时，反转 `fromAccount` 和 `toAccount`。运行程序看它是如何立即死锁的。\n\n\
  另一个容易发生死锁的情况：在 `SynchBankTest` 程序中将 `signalAll` 方法改为 `signal`。你会发现程序最终会挂起。（再次，最好将\
  \ `NACCOUNTS` 设置为 `10` 以更快观察到效果。）与通知所有等待资金增加的线程的 `signalAll` 不同，`signal` 方法只解阻塞一个线程。如果该线程无法继续，所有线程都可能被阻塞。考虑以下正在形成死锁的示例场景：\n\
  \n1. 账户 1：$1,990\n2. 所有其他账户：每个 $990\n3. 线程 1：从账户 1 转账 $995 到账户 2\n4. 所有其他线程：从它们的账户转账\
  \ $995 到另一个账户\n\n显然，除线程 1 外的所有线程都被阻塞了，因为钱不够。（注：此处提供的文本处有重复/混乱，我将保留核心逻辑）。\n\n###\
  \ 14.5.12 线程本地变量\n\n在前面的节中，我们讨论了线程间共享变量的风险。有时，你可以通过使用 `ThreadLocal` 助手为每个线程提供自己的实例来避免共享。例如，`SimpleDateFormat`\
  \ 类不是线程安全的。假设我们有一个静态变量：\n\n```java\npublic static final SimpleDateFormat dateFormat\
  \ = new SimpleDateFormat(\"yyyy-MM-dd\");\n```\n\n（注：输入文本的最后部分高度碎片化/重复，我根据指令格式化了可读部分。）\n\
  \n\n\n重写此方法以提供初始值。默认情况下，此方法返回 `null`。\n\n- `void set(T t)`\n为此线程设置新值。\n\n- `void\
  \ remove()`\n移除此线程的值。\n\n- `static <S> ThreadLocal<S> withInitial(Supplier<? extends\
  \ S> supplier)` **8**\n创建一个线程本地变量，其初始值通过调用给定的 supplier 产生。\n\n***\n\njava.util.concurrent.ThreadLocalRandom\
  \ **7**\n\n- `static ThreadLocalRandom current()`返回一个对于当前线程唯一的 `Random` 类的实例。\n\n\
  ***\n\n### 14.5.13 锁测试与超时\n\n当线程调用 `lock` 方法来获取由另一个线程拥有的锁时，会被无限阻塞。你可以更谨慎地获取锁。`tryLock`\
  \ 方法尝试获取锁，如果成功则返回 `true`。否则，它会立即返回 `false`，线程可以去执行其他事情。\n\n点击此处查看代码图片\n\n```\nif\
  \ (myLock.tryLock())\n{\n   // 现在线程拥有了锁\n   try { . . . }\n   finally { myLock.unlock();\
  \ }\n}\nelse\n  // 执行其他事情\n```\n\n你可以带超时参数调用 `tryLock`，如下所示：\n\n点击此处查看代码图片\n\n```java\n\
  if (myLock.tryLock(100, TimeUnit.MILLISECONDS)) . . .\n```\n\n`TimeUnit` 是一个枚举，其值为\
  \ `SECONDS`、`MILLISECONDS`、`MICROSECONDS` 和 `NANOSECONDS`。\n\n`lock` 方法不能被中断。如果线程在等待获取锁时被中断，该被中断的线程将继续阻塞，直到锁可用。如果发生了死锁，那么\
  \ `lock` 方法将永远不会结束。\n\n然而，如果你带超时参数调用 `tryLock`，当线程在等待期间被中断时，会抛出一个 `InterruptedException`。这显然是一个非常有用的特性，因为它允许程序打破死锁。\n\
  \n你还可以调用 `lockInterruptibly` 方法。它的含义与带无限超时时的 `tryLock` 相同。\n\n当你等待条件（condition）时，也可以提供一个超时时间：\n\
  \n点击此处查看代码图片\n\n```java\nmyCondition.await(100, TimeUnit.MILLISECONDS))\n```\n\n\
  如果另一个线程通过调用 `signalAll` 或 `signal` 激活了此线程，或者超时到达，或者线程被中断，则 `await` 方法返回。\n\n如果等待的线程被中断，`await`\
  \ 方法会抛出 `InterruptedException`。在（可能不太可能的）你宁愿继续等待的情况下，请使用 `awaitUninterruptibly`\
  \ 方法。\n\n***\n\njava.util.concurrent.locks.Lock **5.0**\n\n- `boolean tryLock()`\n\
  尝试在不阻塞获取锁；如果成功则返回 `true`。如果锁可用，即使它具有公平锁策略且有其他线程在等待，此方法也会获取该锁。\n\n- `boolean tryLock(long\
  \ time, TimeUnit unit)`\n尝试获取锁，阻塞时间不超过给定时间；如果成功则返回 `true`。\n\n- `void lockInterruptibly()`\n\
  获取锁，无限阻塞。如果线程被中断，则抛出 `InterruptedException`。\n\n***\n\njava.util.concurrent.locks.Condition\
  \ **5.0**\n\n- `boolean await(long time, TimeUnit unit)`\n进入该条件的等待集，阻塞直到线程从等待集中被移除或过了给定时间。如果方法是因为时间到了而返回，则返回\
  \ `false`，否则返回 `true`。\n\n- `void awaitUninterruptibly()`\n进入该条件的等待集，阻塞直到线程从等待集中被移除。如果线程被中断，此方法不会抛出\
  \ `InterruptedException`。\n\n***\n\n### 14.5.14 读/写锁\n\n`java.util.concurrent.locks`\
  \ 包定义了两个锁类：我们已经讨论过的 `ReentrantLock` 和 `ReentrantReadWriteLock`。当有许多线程从数据结构中读取，而只有少数线程对其进行修改时，后者非常有用。在这种情况下，允许读取者共享访问是合理的。当然，写者必须具有独占访问权限。\n\
  \n使用读/写锁所需的步骤如下：\n\n**1.** 构造一个 `ReentrantReadWriteLock` 对象：\n\n点击此处查看代码图片\n\n```java\n\
  private ReentrantReadWriteLock rwl = new ReentrantReadWriteLock();\n```\n\n**2.**\
  \ 提取读锁和写锁：\n\n点击此处查看代码图片\n\n```java\nprivate Lock readLock = rwl.readLock();\nprivate\
  \ Lock writeLock = rwl.writeLock();\n```\n\n**3.** 在所有访问器中使用读锁：\n\n点击此处查看代码图片\n\n\
  ```java\npublic double getTotalBalance()\n{\n   readLock.lock();\n   try { . . .\
  \ }\n   finally { readLock.unlock(); }\n}\n```\n\n**4.** 在所有修改器中使用写锁：\n\n点击此处查看代码图片\n\
  \n```java\npublic void transfer(...)\n{\n   writeLock.lock();\n   try { . . . }\n\
  \   finally { writeLock.unlock(); }\n}\n```\n\n***\n\njava.util.concurrent.locks.ReentrantReadWriteLock\
  \ **5.0**\n\n- `Lock readLock()`\n获取一个读锁，允许多个读取者并发。\n\n- `Lock writeLock()`\n获取一个写锁，排除读取者。\n\
  \n***\n\n### 14.5.15 为什么 stop 和 suspend 方法被弃用\n\nJava 早期定义了一个 `stop` 方法来直接终止线程，以及\
  \ `suspend` 方法来阻塞线程直到另一个线程调用 `resume`。`stop` 和 `suspend` 方法有一个共同点：它们尝试在没有线程协作的情况下控制线程的行为。\n\
  \n`stop`、`suspend` 和 `resume` 方法已经被弃用。`stop` 方法本质上是不安全的，`suspend` 方法经常会导致死锁。在本节中，你将看到这些方法的问题。\n\
  \n让我们先来看看 `stop` 方法。它会终止所有的方法。当线程被停止时，它会立即释放持有的锁。这会导致对象处于不一致状态。例如，假设一个 `TransferRunnable`\
  \ 在从一个账户转账到另一个账户的过程中、存款之前被停止。现在银行对象损坏了。由于锁已经被释放，这种损坏对于未停止的其他线程是可见的。\n\n当一个线程想要停止另一个线程时，它无法知道何时\
  \ `stop` 方法是安全的，何时会导致对象损坏。因此，该方法被弃用了。当你想要停止一个线程时，应该中断它。被中断的线程可以在安全时停止。\n\n***\n\n\
  ![Image](img/note.jpg) 注意\n\n某些作者声称 `stop` 方法被弃用是因为它会导致对象被停止的线程永久锁定。然而，这种主言并不成立。停止的线程会退出它调过的同步方法——技术上是通过抛出一个\
  \ `ThreadDeath` 异常。作为结果，线程释放了它持有的内部对象锁。\n\n***\n\n接下来，让我们看看 `suspend` 方法的问题所在。这种这种情况在图形用户界面中经常发生。假设我们有一个银行的可视化模拟。一个标记为“暂停”的按钮挂起传输线程，一个标记为“恢复”的按钮恢复它们。\n\
  \n点击此处查看代码图片\n\n```java\npauseButton.addActionListener(event -> {\n   for (int i\
  \ = 0; i < threads.length; i++)\n      threads[i].suspend(); // 不要这样做\n});\n```\n\
  \n\n\n\n```java\nresumeButton.addActionListener(event -> {\n    for (int i = 0;\
  \ i < threads.length; i++)\n        threads[i].resume();\n});\n```\n\n假设有一个 `paintComponent`\
  \ 方法绘制每个账户的图表，并调用 `getBalances` 方法来获取余额数组。\n\n正如你在第 14.11 节中看到的，第 937 页的“线程与 Swing\n\
  \n你现在已经看到了构成 Java 并发编程基础的底层构建块。然而，对于实际编程，你希望避开低级结构。使用由并发专家实现的高级结构要简单得多也安全得多。\n\n\
  许多线程问题可以使用一个或多个队列来优雅且安全地表述。生产者线程向队列中插入元素，消费者线程从中从中提取元素。队列允许你安全地将数据从一个线程传递给另一个线程。例如，考虑我们的银行程序。传输线程不再直接访问\
  \ `bank` 对象，而是将传输对象插入队列中。另一个线程从队列中移除指令。只有该线程可以访问 `bank` 对象的内部。不需要同步（当然，线程安全队列类的实现者必须担心锁和条件，但那不是你的工作）。\n\
  \n*阻塞队列*（blocking queue）会在你在队列满时尝试添加元素或在队列为空时尝试移除元素导致线程阻塞。阻塞队列是协调多个线程工作的有用工具。工作线程定期将中间结果存入阻塞队列。其他工作线程移除中间结果并对其进行修改。队列会自动平衡负载。如果第一组线程运行得比第二组慢，第二组会在等待结果时被阻塞。如果第一组线程运行得快，队列就会一直填充，直到第二组追上进度。表\
  \ 14.1 显示了阻塞队列的方法。\n\n#### 表 14.1 阻塞队列方法\n\n阻塞队列方法分为三类，区别在于它们在队列满或为空时所执行的操作。如果你将队列作为线程管理工具，请使用\
  \ `put` 和 `take` 方法。`add`、`remove` 和 `element` 操作在尝试向满队列添加元素或获取空队列头元素时会抛出异常。当然，在多线程程序中，队列可能在任何时候变满或为空，因此你可能希望使用\
  \ `offer`、`poll` 和 `peek` 方法。这些方法会直接返回一个失败指示，而不是抛出异常。\n\n注意：`poll` 和 `peek` 方法返回\
  \ `null` 以表示失败。因此，向这些队列中插入 `null` 值是非法的。\n\n还有带有超时的 `offer` 和 `poll` 方法变体。例如，以下调用：\n\
  \n```java\nboolean success = q.offer(x, 100, TimeUnit.MILLISECONDS);\n```\n尝试 100\
  \ 毫秒向队列尾部插入一个元素。如果成功，返回 `true`；否则，在超时后返回 `false`。同样，调用：\n\n```java\nObject head\
  \ = q.poll(100, TimeUnit.MILLISECONDS);\n```\n尝试 100 毫秒移除队列头。如果成功，返回头元素；否则，在超时后返回\
  \ `null`。\n\n`put` 方法在队列满时阻塞，`take` 方法在队列为空时阻塞。这些是不带超时的 `offer` 和 `poll` 的等价操作。\n\
  \n`java.util.concurrent` 包提供了多种阻塞队列的变体。默认情况下，`LinkedBlockingQueue` 的容量没有上限，但可以可选地指定最大容量。`LinkedBlockingDeque`\
  \ 是双端版本的。`ArrayBlockingQueue` 使用指定的容量和一个可选的需要公平性（fairness）的参数构造。如果指定了公平性，则等待最长的线程将获得优先对待。一如既往，公平性会带来巨大的性能代价，你只有在问题特别需要时才应该使用它。\n\
  \n`PriorityBlockingQueue` 是优先级队列，而不是先进先出队列。元素按照其优先级顺序移除。队列具有无界容量，但队列为空时检索会阻塞。（有关优先级队列的更多信息请参阅第\
  \ 9 章。\n\n`DelayQueue` 包含了实现了 `Delayed` 接口的对象：\n\n```java\ninterface Delayed extends\
  \ Comparable<Delayed> {\n    long getDelay(TimeUnit unit);\n}\n```\n\n`getDelay`\
  \ 方法返回剩余延迟。负值表示延迟已过去。只有当延迟过去后，才能从 `DelayQueue` 中移除元素。你还需要实现 `compareTo` 方法。`DelayQueue`\
  \ 使用该方法对条目进行排序。\n\nJava SE 7 增加了 `TransferQueue` 接口，允许生产者线程等待消费者准备好接收项。当生产者调用\n\n\
  ```java\nq.transfer(item);\n```\n该调用将阻塞直到另一个线程移除它。`LinkedTransferQueue` 类实现了此接口。\n\
  \n代码列表 14.9](#ch14a.html_ch14list9) 显示了如何使用阻塞队列控制一组线程。程序搜索目录及其子目录中的所有文件，打印包含给定关键字的行。\n\
  \n生产者线程遍历所有子目录下的文件并将其放入阻塞队列。此操作非常快，如果队列没有边界，它将迅速填充文件系统中的文件。\n\n我们还启动了大量的搜索线程。每个搜索线程从队列中取一个文件，打开它，打印所有包含关键字的行，然后取下一个文件。我们使用一种技巧在不再需要进一步工作时终止应用程序。为了信号完成，遍历线程向队列中放入一个虚拟对象。（这类似于行李传送带上贴有“最后一件行李”标签的虚拟箱子。）当搜索线程取出虚拟对象时，它将其放回去并终止。\n\
  \n注意，这里不需要显式的线程同步。在在此应用程序中，我们使用队列数据结构作为同步机制。\n\n\n\n\n\n```java\nimport java.util.*;\n\
