  \ 类型数组列表与原始数组列表之间的兼容性\n\n在你自己的代码中，你总是希望使用类型参数来增加安全性。在本节中，你将看到如何与不使用类型参数的遗留代码进行交互。\n\
  \n假设你有以下遗留类：\n\n点击此处查看代码图像\n\n```java\npublic class EmployeeDB\n{\n    public void\
  \ update(ArrayList list) { ... }\n    public ArrayList find(String query) { ...\
  \ }\n}\n```\n\n你可以在进行任何强制转换的情况下，将类型的数组列表传递给 `update` 方法。\n\n点击此处查看代码图像\n\n```java\n\
  ArrayList<Employee> staff = ...;\nemployeeDB.update(staff);\n```\n\n`staff` 对象被直接传递给\
  \ `update` 方法。\n\n![Image](img/caution.jpg) 注意\n\n尽管你没有从编译器获得任何错误或警告，但这种调用并不是完全安全的。`update`\
  \ 方法可能会向数组列表中添加不是 `Employee` 类型的元素。当获取到这些元素时，就会发生异常。这听起来很可怕，但如果你仔细考虑，这种行为与泛型引入 Java\
  \ 之前的行为完全一致。虚拟机的完整性永远不会受到威胁。在这种情况下，你没有失去安全性，但也无法从编译时检查中获益。\n\n相反，当你将原始 `ArrayList`\
  \ 赋值给类型的 `ArrayList` 时，你会得到一个警告。\n\n点击此处查看代码图像\n\n```java\nArrayList<Employee> result\
  \ = employeeDB.find(query); //产生警告\n```\n\n![Image](img/note.jpg) 注意\n\n要查看警告文本，请使用\
  \ `-Xlint:unchecked` 选项进行编译。\n\n使用强制转换并让警告消失。\n\n点击此处查看代码图像\n\n```java\nArrayList<Employee>\
  \ result = (ArrayList<Employee>) employeeDB.find(query);\n// 产生另一个警告\n```\n\n相反，你会得到一个不同的警告，告诉你强制转换是误导性的。\n\
  \n这是 Java 中泛型类型一个相当遗憾的局限性导致的。为了兼容性，编译器在检查未违反类型规则后，将所有类型的数组列表转换为原始的 `ArrayList` 对象。在运行的程序中，所有的数组列表都是相同的——虚拟机中没有类型参数。因此，强制转换\
  \ `(ArrayList)` 和 `(ArrayList<Employee>)` 执行的是完全相同的运行时检查。\n\n对于这种情况，你无能为力。当你与遗留代码交互时，请研究编译器警告并确保这些警告不是严重的。\n\
  \n一旦你满意了，可以像这样给变量标记上 `@SuppressWarnings(\"unchecked\")`：\n\n点击此处的查看代码图像\n\n```java\n\
  @SuppressWarnings(\"unchecked\")\nArrayList<Employee> result = (ArrayList<Employee>)\
  \ employeeDB.find(query);\n```\n\n## 5.4 包装类与自动装箱\n\n有时，你需要将基本类型转换为对象。包装类有特定的名称：`Integer`、`Long`、`Float`、`Double`、`Short`、`Byte`、`Character`\
  \ 和 `Boolean`。包装类也被称为 wrappers。\n\n假设我们需要一个 `int`。以下功能轻松地向 `ArrayList<>` 添加一个 `int`\
  \ 元素。\n\n```java\nArrayList<Integer> list = new ArrayList<>();\n```\n\n![Image](img/caution.jpg)\
  \ 注意\n\n`ArrayList<Integer>` 的效率远低于 `int[]`，因为每个值都被单独包装在内部。你只有在程序员的便利比效率更重要时才会使用它。\n\
  \n幸运的是，有一个用的功能可以轻松地向 `ArrayList<>` 添加一个 `int` 元素。\n\n```java\nlist.add(3);\n```\n\
  \n这种转换被称为*自动装箱*（autoboxing）。\n\n![Image](img/note.jpg) 注意\n\n你可能认为*自动拆箱*（autounrapping）会更一致，但“箱”这个比喻源自\
  \ C#。\n\n相反，当你将一个 `Integer` 对象赋值给 `int` 值时，它会自动拆箱。也就是说，编译器翻译为\n\n```java\nint n\
  \ = list.get(i);\n```\n\n点击此处查看代码图像\n\n```java\nint n = list.get(i).intValue();\n\
  ```\n\n自动装箱和拆箱甚至适用于算术表达式。例如，你可以对包装引用应用递增运算符：\n\n```java\nInteger n = 3;\nn++;\n\
  ```\n\n编译器会自动插入指令拆箱对象、增加值并重新装箱。\n\n在大多数情况下，你会认为基本类型和它们的包装类是同一的。只有一个点它们有显著不同：标识性。正如你所知，`==`\
  \ 运算符应用于包装对象时仅测试对象是否具有相同的内存位置。因此，比较可能会失败：\n\n```java\nInteger a = 1000;\nInteger\
  \ b = 1000;\nif (a == b) . . .\n```\n\n然而，Java 实现*可能会*根据选择将常用值包装成相同的对象，因此比较可能会成功。这种歧义不是你想要的。解决方法是在比较包装对象时调用\
  \ `equals` 方法。\n\n![Image](img/note.jpg) 注意\n\n自动装箱规范要求 `boolean`、`byte`、`char <=\
  \ 127`、`short` 以及 -128 到 127 之间的 `int` 被包装成固定对象。例如，如果前面的示例中 `a` 和 `b` 被初始化为 `100`，那么比较将成功。\n\
  \n关于自动装箱还有一些微妙之处。首先，由于包装类引用可以为 `null`，自动拆箱可能会抛出 `NullPointerException`：\n\n点击此处查看代码图像\n\
  \n\n\n\n\n```java\nInteger n = null;\nSystem.out.println(2 * n); // 出 NullPointerException\n\
  ```\n\n此外，如果你在条件表达式中混合使用 `Integer` 和 `Double` 类型，那么 `Integer` 值会被拆箱、提升为 `double`，并装箱为\
  \ `Double`：\n\n点击此处查看代码图像\n\n```java\nInteger n = 1;\nDouble x = 2.0;\nSystem.out.println(true\
  \ ? n : x); // 输出 1.0\n```\n\n最后，让我们强调一下，装箱和拆箱是 `compiler` 提供的便利，而不是虚拟机。编译器在生成类的字节码时会插入必要的调用。虚拟机简单地执行这些字节码。\n\
  \n你经常会因为另一个原因看到数字包装类。Java 的设计者发现，包装类是放置某些基本方法的方便地方，例如用于将数字字符串转换为数字的方法。\n\n要将将字符串转换为整数，请使用以下语句：\n\
  \n```java\nint x = Integer.parseInt(s);\n```\n\n这与 `Integer` 对象无关——`parseInt` 是一个静态方法。但\
  \ `Integer` 类是放置它的好地方。\n\nAPI 注释显示了 `Integer` 类的一些更重要的方法。其他数字类也实现了对应的方法。\n\n* *\n\
  \n![Image](img/caution.jpg) 警告\n\n有些人认为包装类可以用于实现可以修改数值参数的方法。然而，这是不对的。回想 第 4 章，编写一个可以递增整数参数的\
  \ Java 方法是不可行的，因为 Java Java 方法的参数总是按值传递的。\n\n点击此处查看代码图像\n\n```java\npublic static\
  \ void triple(int x) // 无法工作\n{\n   x = 3 * x; // 修改了局部变量\n}\n```\n\n我们可以通过使用 `Integer`\
  \ 代替 `int` 来克服这个问题吗？\n\n点击此处查看代码图像\n\n```java\npublic static void triple(Integer\
  \ x) // 无法工作\n{\n   ...\n}\n```\n\n问题在于 `Integer` 对象是**不可变**的：包装器内部包含的信息无法更改。你不能使用这些包装类来创建一个修改数值参数的方法。\n\
  \n如果你确实想写一个用于更改数值参数的方法，你可以使用 `org.omg.CORBA` 包中定义的 `holder` 类型之一：`IntHolder`、`BooleanHolder`\
  \ 等。每个 holder 类型都有一个公共的 (!) 字段 `value`，通过它你可以访问存储的值。\n\n点击此处查看代码图像\n\n```java\n\
  public static void triple(IntHolder x)\n{\n   x.value = 3 * x.value;\n}\n```\n\n\
