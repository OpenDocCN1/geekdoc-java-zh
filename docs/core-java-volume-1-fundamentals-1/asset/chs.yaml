  \ `deque`）允许你高效地在头部和尾部添加或移除元素。不支持在中间添加元素。Java SE 6 引入了 `Deque` 接口。它由 `ArrayDeque`\
  \ 和 `LinkedList` 类实现，这两个类都提供了大小随需要增长的双端队列。在第 14 章中，你将看到有界队列和双端队列。\n\n`java.util.Queue<E>`\
  \ 5.0\n- `boolean add(E element)`\n- `boolean offer(E element)` 将给定元素添加到此双端队列的尾部，如果队列未满则返回\
  \ `true`。如果队列已满，第一个方法抛出 `IllegalStateException`，而第二个方法返回 `false`。\n- `E remove()`\n\
  - `E poll()` 移除并返回队列头部的元素，如果队列不为空。如果队列为空，第一个方法抛出 `NoSuchElementException`，而第二个方法返回\
  \ `null`。\n- `E element()`\n- `E peek()` 返回队列头部的元素但不将其移除，如果队列不为空。如果队列为空，第一个方法抛出\
  \ `NoSuchElementException`，而第二个方法返回 `null`。\n\n`java.util.Deque<E>` 6\n- `void addFirst(E\
  \ element)`\n- `void addLast(E element)`\n- `boolean offerFirst(E element)`\n- `boolean\
  \ offerLast(E element)` 将给定元素添加到此双端队列的头部或尾部。如果队列已满，前两个方法抛出 `IllegalStateException`，而后两个方法返回\
  \ `false`。\n- `E removeFirst()`\n- `E removeLast()`\n- `E pollFirst()`\n- `E pollLast()`\
  \ 移除并返回队列头部的元素，如果队列不为空。如果队列为空，前两个方法抛出 `NoSuchElementException`，而后两个方法返回 `null`。\n\
  - `E getFirst()`\n- `E getLast()`\n- `E peekFirst()`\n- `E peekLast()` 返回队列头部的元素但不将其移除，如果队列不为空。如果队列为空，前两个方法抛出\
  \ `NoSuchElementException`，而后两个方法返回 `null`。\n\n`java.util.ArrayDeque<E>` 6\n- `ArrayDeque()`\n\
  - `ArrayDeque(int initialCapacity)` 构建一个初始容量为 16 或给定初始容量的无界双端队列。\n\n### 9.2.6 优先级队列\n\
  \n优先级队列在元素按任意顺序插入后按排序检索元素。也就是说，每当你调用 `remove` 方法时，都会得到当前优先级队列中的最小元素。然而，优先级队列并没有对所有元素进行排序。如果你遍历元素，它们并不是排序的。优先级队列利用了一种名为堆（heap）的优雅且高效的数据结构。堆是一种自组织的二叉树，其中\
  \ `add` 和 `remove` 操作会导致最小元素向根节点移动，而无需浪费时间对所有元素排序。\n\n就像 `TreeSet` 一样，优先级队列可以包含实现\
  \ `Comparable` 接口类，也可以包含构造函数中提供的 `Comparator` 对象。\n\n优先级队列的一个典型用途是任务调度。每个任务都有一个优先级。任务按随机顺序添加。每当有任务可以启动时，从队列中移除优先级最高的任务。（由于传统上优先级\
  \ 1 是“最高”优先级，因此 `remove` 操作产生最小元素。）\n\nListing 9.5 展示了优先级队列的运行情况。\n\n\n\n\n\n```java\n\
  public class PriorityQueueTest {\n    public static void main(String[] args) {\n\
  \        PriorityQueue<LocalDate> pq = new PriorityQueue<>();\n        pq.add(LocalDate.of(1906,\
  \ 12, 9)); // G. Hopper\n        pq.add(LocalDate.of(1815, 12, 10)); // A. Lovelace\n\
  \        pq.add(LocalDate.of(1903, 12, 3)); // J. von Neumann\n        pq.add(LocalDate.of(1910,\
  \ 6, 22)); // K. Zuse\n\n        System.out.println(\"Iterating over elements...\"\
  );\n        for (LocalDate date : pq)\n            System.out.println(date);\n \
  \       System.out.println(\"Removing elements...\");\n        while (!pq.isEmpty())\n\
  \            System.out.println(pq.remove());\n    }\n}\n```\n\n### java.util.PriorityQueue\
  \ 5.0\n\n- `PriorityQueue()`\n- `PriorityQueue(int initialCapacity)` 构建一个用于存储 `Comparable`\
  \ 对象的优先级队列.\n- `PriorityQueue(int initialCapacity, Comparator<? super E> c)` 构建一个优先级队列，并使用指定的比较器对其元素进行排序.\n\
  \n## 9.3 Maps\n\n集合（Set）是一种允许你快速查找已存在元素的集合。然而，要查找一个元素，你需要拥有该元素的精确拷贝才能找到。这并不是非常常见的查找方式——通常，你拥有某些键信息，并想要查找与与之相关的元素。`map`\
  \ 数据结构正是为了实现这一目的。map 存储键值对（key/value pairs）。如果你提供键，就可以找到对应的值。例如，你可能存储一张员工记录表，其中键是员工\
  \ ID，值是 `Employee` 对象。在接下来的章节中，你将学习如何操作 map。\n\n### 9.3.1 基础 Map 操作\n\nJava 库为 map\
  \ 提供了两种通用的实现：`HashMap` 和 `TreeMap`。这两个类都实现了 `Map` 接口。\n\n哈希映射（hash map）对键进行哈希处理，而树映射（tree\
  \ map）则根据键的顺序将其组织在搜索树中。哈希或比较函数仅应用于键。与键关联的值不会进行哈希处理或比较。\n\n你应该选择哈希映射还是树映射？与集合一样，哈希处理通常快一点，如果你不需要按排序顺序访问键，那么它是首选方案。\n\
  \n以下是设置一个用于存储员工的哈希映射的方法：\n\n```java\nMap<String, Employee> staff = new HashMap<>();\
  \ // HashMap 实现 Map\nEmployee harry = new Employee(\"Harry Hacker\");\nstaff.put(\"\
  987-98-9996\", harry);\n...\n```\n\n每当你向 map 中添加对象时，必须同时提供一个键。在我们的案例中，键是一个字符串，对应的值是一个\
  \ `Employee` 对象。\n\n要检索对象，你必须使用（并记住）该键。\n\n```java\nString id = \"987-98-9996\"\
  ;\ne = staff.get(id); // 获取 harry\n```\n\n如果 map 中没有存储指定特定键键信息，`get` 将返回 `null`。\n\
  \n`null` 返回值可能会带来不便。有时，你有一个良好的默认值，可以用于 map 中不存在的键。这种情况下请使用 `getOrDefault` 方法。\n\n\
  ```java\nMap<String, Integer> scores = ...;\nint score = scores.get(id, 0); // 如果\
  \ id 不存在则获取 0\n```\n\n键必须是唯一的。你不能存储两个具有相同键的值。如果你用相同的键调用两次 `put` 方法，第二个值将替换第一个值。事实上，`put`\
  \ 返回与其键参数关联的先一个值。\n\n`remove` 方法从 map 中删除具有给定键的元素。`size` 方法返回 map 中条目的数量。\n\n遍历\
  \ map 的键和值的简单方法是使用 `forEach` 方法。提供一个接收键和值的 lambda 表达式。该表达式会轮流对 map 中的每个条目进行调用。\n\
  \n```java\nscores.forEach((k, v) -> System.out.println(\"key=\" + k + \", value=\"\
  \ + v));\n```\n\n列表 9.6 演示了 map 的工作原理。我们首先向 map 中添加键/值对。然后，我们从 map 中移除一个键，这也会移除其关联的值。接下来，我们更改与键关联的值，并调用\
  \ `get` 方法来查找值。最后，我们遍历项集（entry set）。\n\n### 列表 9.6 MapTest.java\n\n```java\npackage\
  \ map;\n\nimport java.util.*;\n\n/**\n * 此程序演示了键类型为 String、值类型为 Employee 的 map 用。\n\
  \ * @version 1.11 2012-01-26\n * @author Cay Horstmann\n */\npublic class MapTest\
  \ {\n    public static void main(String[] args) {\n        Map<String, Employee>\
  \ staff = new HashMap<>();\n        staff.put(\"144-25-5464\", new Employee(\"Amy\
  \ Lee\"));\n        staff.put(\"567-24-2546\", new Employee(\"Harry Hacker\"));\n\
  \        staff.put(\"157-62-7935\", new Employee(\"Gary Cooper\"));\n        staff.put(\"\
  456-62-5527\", new Employee(\"Francesca Cruz\"));\n\n        // 打印所有条目\n       \
  \ System.out.println(staff); // 从 map 中移除一个键，这也会移除其关联的值\n        System.out.println(staff.remove(\"\
  567-24-2546\"));\n\n        // 更改与键关联的值，并调用 get 方法查找值\n        staff.put(\"157-62-7935\"\
  , new Employee(\"Gary Miller\"));\n        System.out.println(staff.get(\"157-62-7935\"\
  ));\n\n        // 遍历项集\n        staff.forEach((k, v) -> System.out.println(\"key=\"\
  \ + k + \", value=\" + v));\n    }\n}\n```\n\n### java.util.Map<K, V> 1.2\n\n- `V\
  \ get(Object key)` 获取键关联的值；如果键在 map 中未找到，则返回 `null`。\n- `default V getOrDefault(Object\
  \ key, V defaultValue)` 获取键关联的值；如果键在 map 中未找到，则返回 `defaultValue`。\n- `V put(K key,\
  \ V value)` 将键和值的关联放入 map 中。如果键已存在，新对象将替换之前与键关联的对象。此方法返回键的旧值，如果之前不存在则返回 `null`。实现类可能不允许\
  \ null 键或值。\n- `void putAll(Map<? extends K, ? extends V> entries)` 将指定 map 中的所有条目添加到此\
  \ map 中。\n- `boolean containsKey(Object key)` 如果键在 map 中，则返回 `true`。\n- `boolean\
  \ containsValue(Object value)` 如果值在 map 中，则返回 `true`。\n- `default void forEach(BiConsumer<?\
  \ super K,? super V> action)` 对 map 的所有键/值对应用操作。\n\n### java.util.HashMap<K, V>\
  \ 1.2\n\n- `HashMap()`\n- `HashMap(int initialCapacity)`\n- `HashMap(int initialCapacity,\
  \ float loadFactor)` 构建一个具有指定容量和负载因子的空哈希映射（0.0 到 1.0 之间的数字，决定了哈希表在达到多少百分比填充率时重新哈希到一个更大的表中）。默认负载因子为\
  \ `0.75`。\n\n### java.util.TreeMap<K,V> 1.2\n\n- `TreeMap()` 构建一个实现 `Comparable`\
  \ 接口键的空树映射。\n- `TreeMap(Comparator<? super K> c)` 构建一个树映射，并使用指定的比较器对其键进行排序。\n- `TreeMap(Map<?\
  \ extends K, ? extends V> entries)` 构建一个树映射并添加 map 中的所有条目。\n- `TreeMap(SortedMap<?\
  \ extends K, ? extends V> entries)` 构建一个树映射，添加排序 map 中的所有条目，并使用与给定排序 map 相同的元素比较器。\n\
  \n### java.util.SortedMap<K, V> 1.2\n\n- `Comparator<? super K> comparator()` 返回用于排序键的比较器；如果键通过\
  \ `Comparable` 接口的 `compareTo` 方法比较，则返回 `null`。\n\n\n\n\n\n- `K firstKey()`\n- `K\
  \ lastKey()`\n\n返回 map 中最小或最大的键。\n\n### 9.3.2 更新 Map 条目\n\n处理 map 时棘棘手是更新条目。通常，你会获取与键关联的旧值，更新它，然后将更新后的值放回去。但你必须考虑键第一次出现的特殊情况。考虑使用\
  \ map 来统计单词在文件中出现的次数。当我们看到一个单词时，想要像这样增加计数器：\n\n```\ncounts.put(word, counts.get(word)\
  \ + 1);\n```\n\n这种方法可以工作，但在 `word` 第一次遇到时除外。此时 `get` 会返回 `null`，并发生 `NullPointerException`。\n\
  \n一个简单的解决办法是使用 `getOrDefault` 方法：\n\n```\ncounts.put(word, counts.getOrDefault(word,\
  \ 0) + 1);\n```\n\n另一种方法是先调用 `putIfAbsent` 方法。它只在键之前不存在时才放入值。\n\n```java\ncounts.putIfAbsent(word,\
  \ 0);\ncounts.put(word, counts.get(word) + 1); // 现在我们知道 get 会成功了\n```\n\n但你可以做得更好。`merge`\
  \ 方法简化了这种常用操作。调用\n\n```java\ncounts.merge(word, 1, Integer::sum);\n```\n\n如果键之前不存在，则将\
  \ `word` 与 1 关联；否则，使用 `Integer::sum` 函数将之前的值和 1 结合起来。\n\nAPI 注释描述了更新 map 条目的其他较不常用的方法。\n\
  \n`java.util.Map<K, V>`\n\n- `default V merge(K key, V value, BiFunction<? super\
  \ V,? super V,? extends V> remappingFunction)` 8\n\n如果 `key` 与一个非-`null` 值 `v` 关联，则将函数应用到\
  \ `v` 和 `value` 上，并将 `key` 与结果关联，或者如果结果为 `null`，则移除该键。否则，将 `key` 与 `value` 关联。返回\
  \ `get(key)`。\n\n- `default V compute(K key, BiFunction<? super K,? super V,? extends\
  \ V> remappingFunction)` 8\n\n将函数应用到 `key` 和 `get(key)` 上。将 `key` 与结果关联，或者如果结果为\
  \ `null`，则移除该键。返回 `get(key)`。\n\n- `default V computeIfPresent(K key, BiFunction<?\
  \ super K,? super V,? extends V> remappingFunction)` 8\n\n如果 `key` 与一个非-`null` 值\
  \ `v` 关联，则将函数应用到 `key` 和 `v` 上，并将 `key` 与结果关联，或者如果结果为 `null`，则移除该键。返回 `get(key)`。\n\
  \n- `default V computeIfAbsent(K key, Function<? super K,? extends V> mappingFunction)`\
  \ 8\n\n除非 `key` 与一个非-`null` 值关联，否则将函数应用到 `key` 上。将 `key` 与结果关联，或者如果结果为 `null`，则移除该键。返回\
  \ `get(key)`。\n\n- `default void replaceAll(BiFunction<? super K,? super V,? extends\
  \ V> function)` 8\n\n对所有条目调用该函数。将键与非-`null` 结果关联，并移除结果为 `null` 的键。\n\n### 9.3.3\
  \ Map 视图\n\n集合框架并未将 map 视为集合。（其他数据结构框架将 map 视为键/值对的集合，或视为由键索引的值集合。）然而，你可以获取 map\
  \ 的视图——实现 `Collection` 接口或其一个子接口的对象。共有三种视图：键的集合、值的集合（它不是集合）以及键/值对的集合。键和键/值对形成一个集合，因为\
  \ map 中一个键只能有一个副本。以下方法\n\n```\nSet<K> keySet()\nCollection<V> values()\nSet<Map.Entry<K,\
  \ V>> entrySet()\n```\n\n返回这三个视图。（entry set 的元素是实现 `Map.Entry` 接口的类的对象）。注意 `keySet`\
  \ 不是 `HashSet` 或 `TreeSet`，而是实现 `Set` 接口的类的对象。`Set` 接口扩展了 `Collection` 接口。因此，你可以像使用任何集合一样使用\
  \ `keySet`。例如，你可以遍历 map 的所有键：\n\n```java\nSet<String> keys = map.keySet();\nfor\
  \ (String key : keys)\n{\n    // 做一些事情\n}\n```\n\n如果你想同时查看键和值，可以通过遍历条目来避免查找值。使用以下代码：\n\
  \n```java\nfor (Map.Entry<String, Employee> entry : staff.entrySet())\n{\n    String\
  \ k = entry.getKey();\n    Employee v = entry.getValue();\n    // 做一些事情\n}\n```\n\
  \n**提示**：这曾经是访问所有 map 条目最高效的方法。现在，只需使用 `forEach` 方法即可：\n\n```java\ncounts.forEach((k,\
  \ v) -> {\n    // 做一些事情\n});\n```\n\n如果你在键集视图上调用迭代器的 `remove` 方法，你实际上会从 map 中移除该键及其关联的值。然而，你不能向键集视图中添加元素。在不同时添加值的情况下添加键是没有意义的。如果你尝试调用\
  \ `add` 方法，它会抛出 `UnsupportedOperationException`。entry 集视图也有同样的限制，尽管在概念上添加新的键/值对是有意义的。\n\
  \n`java.util.Map<K, V>`\n\n- `Set<Map.Entry<K, V>> entrySet()` 返回 `Map.Entry` 对象的视图，即\
  \ map 中的键/值对。你可以从该集合移除元素，元素也会从 map 中移除，但你不能添加任何元素。\n\n- `Set<K> keySet()` 返回 map\
  \ 中所有键的集合视图。你可以从该集合移除元素，键及其关联的值也会从 map 中移除，但你不能添加任何元素。\n\n- `Collection<V> values()`\
  \ 返回 map 中所有值的集合视图。你可以从该集合移除元素，移除的值及其键也会从 map 中移除，但你不能添加任何元素。\n\n`java.util.Map.Entry<K,\
  \ V>`\n\n- `K getKey()`\n- `V getValue()`\n\n返回此条目的键或值。\n\n- `V setValue(V newValue)`\
  \ 将关联 map 中的值更改为新值并返回旧值。\n\n### 9.3.4 弱哈希映射\n\n集合类有一些特殊需求的 map 类，我们在本节及后续章节中简要讨论。\n\
  \n`WeakHashMap` 类是为了解决一个有趣的问题设计的。当一个键不再被程序的任何地方使用时，值会发生什么？假设键的最后一个引用已经消失。那么，再也没有可以引用该值对象的方法。但由于程序的任何部分都不再拥有该键，键/值对无法从\
  \ map 中移除。为什么垃圾回收器不能移除它？移除未使用对象不是垃圾回收器的工作吗？\n\n遗憾的是，事实并非如此简单。垃圾回收器追踪活对象。只要 map 对象是活的，它所有的桶都是活的，不会被回收。因此，你的程序应该小心从长寿命\
  \ map 中移除未使用的值。或者，你可以使用 `WeakHashMap`。这种数据结构与垃圾回收器协作，当键的唯一引用是哈希表条目的引用时，移除键/值对。\n\
  \n\n\n\n这是该机制的内部原理。`WeakHashMap` 使用*弱引用*（weak references）来持有键。`WeakReference` 对象持有对另一个对象的引用——在我们的案例中，这是一个哈希表的键。这种类型的对象会被垃圾回收器以特殊方式处理。通常，如果垃圾回收器发现某个对象没有指向它的引用，它就会回收该对象。然而，如果一个对象*仅*通过\
  \ `WeakReference` 可访问，垃圾回收器仍然会回收该对象，但会将指向该对象的弱引用放入队列中。`WeakHashMap` 的操作定期检查该队列，查看是否有新到达的弱引用。队列中出现弱引用意味着该键已不再被任何人使用并已被回收。随后，`WeakHashMap`\
  \ 会移除关联的条目。\n\n### 9.3.5 链接哈希集合与映射\n\n`LinkedHashSet` 和 `LinkedHashMap` 类会记住你插入项的顺序。这样，你就可以避免哈希表中元素顺序看似是随机的。当条目被插入到表中时，它们会被连接数一个双向链表中（参见图\
  \ 9.11）。\n\n![Image](img/09fig11.jpg)\n\n**图 9.11** 链接哈希表\n\n例如，考虑列表 9.6 中的以下映射插入：\n\
  \n```\nMap<String, Employee> staff = new LinkedHashMap<>();\nstaff.put(\"144-25-5464\"\
  , new Employee(\"Amy Lee\"));\nstaff.put(\"567-24-2546\", new Employee(\"Harry Hacker\"\
  ));\nstaff.put(\"157-62-7935\", new Employee(\"Gary Cooper\"));\nstaff.put(\"456-62-5527\"\
  , new Employee(\"Francesca Cruz\"));\n```\n\n然后，`staff.keySet().iterator()` 按照此顺序枚举键：\n\
  \n144-25-5464\n567-24-2546\n157-62-7935\n456-62-5527\n\n而 `staff.values().iterator()`\
  \ 按照此顺序枚举值：\n\nAmy Lee\nHarry Hacker\nGary Cooper\nFrancesca Cruz\n\n链接映射也可以选择使用*访问顺序*（access\
  \ order）而非插入顺序来遍历映射条目。每当你调用 `get` 或 `put` 时，受影响的条目会从其当前位置移除并置于条目链表的*末尾*。（这仅影响条目链表中的位置，而不影响哈希表桶。条目始终留在与键的哈希码对应的桶中。）要构造这样一个哈希映射，请调用\n\
  \n```\nLinkedHashMap<K, V>(initialCapacity, loadFactor, true)\n```\n\n访问顺序对于实现缓存的“最久未使用”策略有用。例如，你可能希望将频繁访问的条目保留在内存中，而从数据库读取访问频率较低的对象。当你不在表中找到某个条目且表已经很满时，你可以获取该表的迭代器并移除它枚举的前几个元素。那些条目就是最近最久未使用的。\n\
  \n你甚至可以自动化该过程。创建一个 `LinkedHashMap` 的子类并重写方法：\n\n```java\nprotected boolean removeEldestEntry(Map.Entry<K,\
  \ V> eldest)\n```\n\n这样，添加新条目时，只要你的方法返回 `true`，`eldest` 条目就会被移除。例如，以下缓存的大小保持在最多\
  \ 100 个元素：\n\n```java\nMap<K, V> cache = new\n    LinkedHashMap<>(128, 0.75F, true)\n\
  \    {\n      protected boolean removeEldestEntry(Map.Entry<K, V> eldest)\n    \
  \  {\n          return size() > 100;\n      }\n    }\n```\n\n或者，你可以根据 `eldest` 条目来决定是否移除它。例如，你可能想要检查与条目一起的时间戳。\n\
  \n### 9.3.6 枚举集合与映射\n\n`EnumSet` 是一种高效的集合实现，元素属于枚举类型（enumerated type）。由于枚举类型的实例数量有限的，`EnumSet`\
  \ 在内部简单地实现为位序列。如果集合中存在对应的值，则该位被开启。\n\n`EnumSet` 类没有公共构造函数。使用静态工厂方法来构造集合：\n\n```java\n\
  enum Weekday { MONDAY, TUESDAY, WEDNESDAY, THURSDAY, FRIDAY, SATURDAY, SUNDAY };\n\
  EnumSet<Weekday> always = EnumSet.allOf(Weekday.class);\nEnumSet<Weekday> never\
  \ = EnumSet.noneOf(Weekday.class);\nEnumSet<Weekday> workday = EnumSet.range(Weekday.MONDAY,\
  \ Weekday.FRIDAY);\nEnumSet<Weekday> mwf = EnumSet.of(Weekday.MONDAY, Weekday.WEDNESDAY,\
  \ Weekday.FRIDAY);\n```\n\n你可以使用 `Set` 接口的常用方法来修改 `EnumSet`。\n\n`EnumMap` 是一种键属于枚举类型的映射。它简单且高效地实现为值的数组。你需要在构造函数中指定键类型：\n\
  \n```java\nEnumMap<Weekday, Employee> personInCharge = new EnumMap<>(Weekday.class);\n\
  ```\n\n***\n\n![Image](img/note.jpg) 注意\n\n在 `EnumSet` 的 API 文档中，你会看到形式奇怪的类型参数 `E\
  \ extends Enum<E>`。这仅仅意味着“`E` 是枚举类型。”所有枚举类型都扩展 `Enum` 类。例如，`Weekday` 扩展 `Enum`。\n\
  \n### 9.3.7 恒等哈希映射\n\n`IdentityHashMap` 有一个非常特殊的用途。在这里，键的哈希值通过内存地址计算。换句话说，即使对象内容相等，也被认为是不同的。该类对于实现对象遍历算法非常有用，例如，你想跟踪哪些对象已经被遍历过。\n\
  \n***\n\n`java.util.WeakHashMap<K, V>`\n`WeakHashMap()`\n`WeakHashMap(int initialCapacity)`\n\
  `WeakHashMap(int initialCapacity, float loadFactor)`\n构造一个指定容量和负载的空哈希映射。\n\n***\n\
  \n`java.util.LinkedHashSet<E>`\n`LinkedHashSet()`\n`LinkedHashSet(int initialCapacity)`\n\
  `LinkedHashSet(int initialCapacity, float loadFactor)`\n构造一个指定容量和负载的空链接哈希集合。\n\n\
  ***\n\n`java.util.LinkedHashMap<K, V>`\n`LinkedHashMap()`\n`LinkedHashMap(int initialCapacity)`\n\
  `LinkedHashMap(int initialCapacity, float loadFactor)`\n`LinkedHashMap(int initialCapacity,\
  \ float loadFactor, boolean accessOrder)`\n构造一个指定容量、负载和排序的空链接哈希映射。`accessOrder`\
  \ 参数为 `true` 表示访问顺序，为 `false` 表示插入顺序。\n`protected boolean removeEldestEntry(Map.Entry<K,\
  \ V> eldest)`\n应该被重写，如果你想移除 `eldest` 条目。`eldest` 参数是正考虑移除的条目。该方法在添加条目后被调用。默认实现返回\
  \ `false`——默认不会移除旧元素。然而，你可以重新定义此方法来选择性地返回 `true`——例如，如果旧元素符合特定条件或映射超过了特定大小。\n\n\
  ***\n\n`java.util.EnumSet<E extends Enum<E>>`\n`static <E extends Enum<E>> EnumSet<E>\
  \ allOf(Class<E> enumType)`\n返回包含给定枚举类型所有值的集合。\n`static <E extends Enum<E>> EnumSet<E>\
  \ noneOf(Class<E> enumType)`\n返回一个能够容枚举类型值的空集合。\n`static <E extends Enum<E>> EnumSet<E>\
  \ range(E from, E to)`\n返回一个包含 `from` 和 `to` 之间（包含边界）所有值的集合。\n`static <E extends\
  \ Enum<E>> EnumSet<E> of(E value)`\n返回一个包含给定值的集合。\n\n\n\n\n- `static <E extends\
  \ Enum<E>> EnumSet<E> of(E value, E... values)` 返回一个包含给定值的集合。\n\n### `java.util.EnumMap<K\
  \ extends Enum<K>, V>` 5.0\n- `EnumMap(Class<K> keyType)` 构建一个空的映射，其键的具有给定的类型。\n\
  \n### `java.util.IdentityHashMap<K, V>` 1.4\n- `IdentityHashMap()`\n- `IdentityHashMap(int\
  \ expectedMaxSize)` 构建一个空的等标识哈希映射，其容量为超过 1.5 × `expectedMaxSize` 的最小 2 的幂次。（`expectedMaxSize`\
  \ 的默认值为 `21`。）\n\n### `java.lang.System` 1.0\n- `static int identityHashCode(Object\
  \ obj)` 1.1 返回与 `Object.hashCode` 计算相同的哈希码（派自对象的内存地址），即使 `obj` 所属的类重新定义了 `hashCode`\
  \ 方法。\n\n## 9.4 视图与包装器（Views and Wrappers）\n\n如果你查看图 9.4 和图 9.5，你可能会认为使用大量的接口和抽象类来实现少量的具体集合类是大多此用。然而，这些图并没有说明全部。通过使用视图，你可以获得实现\
  \ `Collection` 或 `Map` 接口的其他对象。你已经在映射类的 `keySet` 方法中见过这方面的例子。乍一看，该方法似乎创建了一个新集合，用映射中所有的键填充它并返回。但事实并非如此。相反，`keySet`\
  \ 方法返回一个实现 `Set` 接口的类对象，其方法操作原始映射。这样的集合被称为视图（view）。\n\n视图技术在集合框架中有许多实用的应用。我们将在接下来的小节中讨论这些应用。\n\
  \n### 9.4.1 轻量级集合包装器\n\n`Arrays` 类的静态方法 `asList` 返回一个围绕普通 Java 数组的 `List` 包装器。该方法允许你将数组传递给期望列表或集合参数的方法。例如：\n\
  \n```java\nCard[] cardDeck = new Card[52];\n...\nList<Card> cardList = Arrays.asList(cardDeck);\n\
  ```\n\n返回的对象*不是* `ArrayList`。它是一个带有 `get` 和 `set` 方法的视图对象，这些方法访问底层数组。所有会改变数组大小的方法（如关联迭代器的\
  \ `add` 和 `remove` 方法）都会抛出 `UnsupportedOperationException`。\n\n`asList` 方法可以接收变数量的参数。例如：\n\
  \n```java\nList<String> names = Arrays.asList(\"Amy\", \"Bob\", \"Carl\");\n```\n\
  \n方法调用点击此处查看代码图像：\n\n```java\nCollections.nCopies(n, anObject)\n```返回一个实现 `List`\
  \ 接口的不可变对象，并给出一个具有 `n` 个元素的幻象，每个元素显示为 `anObject`。例如，以下调用创建了一个包含 100 个字符串的 `List`全部设置为\
  \ `\"DEFAULT\"`：\n\n```java\nList<String> settings = Collections.nCopies(100, \"\
  DEFAULT\");\n```\n\n存储非常少——该对象只存储一次。这是视图技术的一个巧妙应用。\n\n注意：`Collections` 类包含许多工具方法，其参数或返回值是集合。不要将其与\
  \ `Collection` 接口混淆。\n\n方法调用点击此处查看代码图像：\n\n```java\nCollections.singleton(anObject)\n\
  ```返回一个实现 `Set` 接口的视图对象（与 `nCopies` 不同，后者产生的是 `List`）。返回的对象实现了单元素集合，且没有数据结构带来的开销。`singletonList`\
  \ 和 `singletonMap` 方法的行为类似。同样，对于集合框架中的每个接口，都有方法可以产生空集合、列表、映射等。令人印象深刻的是，集合的类型是推断出来的：\n\
  \n```java\nSet<String> deepThoughts = Collections.emptySet();\n```\n\n### 9.4.2\
  \ 子范围（Subranges）\n\n你可以为许多集合形成子范围视图。例如，假设你有一个列表 `staff` 并想要提取索引 10 到 19 的元素。使用 `subList`\
  \ 方法获取列表子范围的视图：\n\n```java\nList group2 = staff.subList(10, 20);\n```\n\n第一个索引包含边界，第二个索引不包含——就像\
  \ `String` 类中 `substring` 操作的参数一样。你可以对子范围应用任何操作，这些操作会自动反映到整个列表。例如，你可以删除整个子范围：\n\n\
  ```java\ngroup2.clear(); // staff 缩减\n``` 元素会自动从 `staff` 列表中清除，且 `group2` 变为空。对于排序后的集合和映射，你使用排序顺序而不是元素位置来形成子范围。`SortedSet`\
  \ 接口声明了三个方法：\n\n```java\nSortedSet<E> subSet(E from, E to);\nSortedSet<E> headSet(E\
  \ to);\nSortedSet<E> tailSet(E from);\n```\n\n这些方法返回大于或等于 `from` 且严格小于 `to` 的元素子集。对于排序后的映射，类似的方法有：\n\
  \n```java\nSortedMap<K, V> subMap(K from, K to);\nSortedMap<K, V> headMap(K to);\n\
  SortedMap<K, V> tailMap(K from);\n```返回键落在指定范围内的映射视图。`NavigableSet` 接口在 Java 6 中引入对这些子范围操作提供了更多控制。你可以指定边界是否包含：\n\
  \n```java\nNavigableSet<E> subSet(E from, boolean fromInclusive, E to, boolean toInclusive);\n\
  NavigableSet<E> headSet(E to, boolean toInclusive);\nNavigableSet<E> tailSet(E from,\
  \ boolean fromInclusive);\n```\n\n### 9.4.3 不可修改视图（Unmodifiable Views）\n\n`Collections`\
  \ 类拥有产生集合不可修改视图的方法。这些视图为集合增加了运行时检查。如果检测到修改集合，将抛出异常且集合保持不变。\n\n通过八个方法获取不可修改视图：\n\n\
  - `Collections.unmodifiableCollection`\n- `Collections.unmodifiableList`\n- `Collections.unmodifiableSet`\n\
  - `Collections.unmodifiableSortedSet`\n- `Collections.unmodifiableNavigableSet`\n\
  - `Collections.unmodifiableMap`\n- `Collections.unmodifiableSortedMap`\n- `Collections.unmodifiableNavigableMap`\n\
  \n每个方法都定义为基于接口。例如，`Collections.unmodifiableList` 与 `ArrayList`、`LinkedList` 或任何实现\
  \ `List` 接口的类工作。\n\n例如，假设你想让代码的某部分查看但不触碰集合的内容。你可以这样做：\n\n```java\nList<String> staff\
  \ = new LinkedList<>();\n...\nlookAt(Collections.unmodifiableList(staff));\n```\n\
  \n`Collections.unmodifiableList` 方法返回一个实现 `List` 接口的类对象。它的访问器方法从 `staff` 集合检索值。当然，`lookAt`\
  \ 方法可以调用 `List` 接口的所有方法，而不仅仅是访问器。但所有修改器方法（如 `add`）都已重定义为抛出 `UnsupportedOperationException`，而不是将调用转发底层集合。\n\
  \n不可修改视图并没有使集合本身变为不可变。你仍然可以通过原始引用（在本例中为 `staff`）修改集合。你仍然可以对集合的元素调用修改器方法。\n\n\n\n\
  \n视图（views）封装的是 `interface` 而不是实际的集合对象，因此你只能访问接口中定义的方法。例如，`LinkedList` 类具有便利方法 `addFirst`\
  \ 和 `addLast`，这些方法并不属于 `List` 接口的一部分。这些方法无法通过不可修改的视图进行访问。\n\n![Image](img/caution.jpg)\
  \ 注意\n\n`unmodifiableCollection` 方法（以及本节稍后讨论的 `synchronizedCollection` 和 `checkedCollection`\
  \ 方法）返回一个集合，该集合的 `equals` 方法并并不会*调用底层集合的 `equals` 方法。相反，它遗自了 `Object` 类的 `equals`\
  \ 方法，该方法仅测试对象是否相同。如果你将一个集合或列表转换为普通集合，你将无法再次测试内容是否相等。视图之所以以这种方式工作，是因为在层次结构的这一层级，等价性测试并没有明确的定义。视图处理\
  \ `hashCode` 方法的方式也是如此。\n\n然而，`unmodifiableSet` 和 `unmodifiableList` 方法使用了底层集合的\
  \ `equals` 和 `hashCode` 方法。\n\n### 9.4.4 同步视图 (Synchronized Views)\n\n如果你从多个线程访问集合，你需要确保该集合不会被意外破坏。例如，如果一个线程尝试向哈希表添加元素，而另一个线程正在对元素进行重哈（rehashing），这将是灾难性的。\n\
  \n库的设计者没有通过实现线程安全的集合类，而是使用了视图机制来使普通集合线程安全。例如，`Collections` 类中的静态方法 `synchronizedMap`可以将任何\
  \ map 转换为具有同步访问方法的 `Map`：\n\n点击此处查看代码图片\n\n```\nMap<String, Employee> map = Collections.synchronizedMap(new\
  \ HashMap<String, Employee>());\n```\n\n现在你可以从多个线程访问 `map` 对象了。像 `get` 和 `put` 等方法是序列化的——每个方法调用在完全完成之前，另一个线程无法调用另一个方法。我们将在第\
  \ 14 章中详细讨论数据结构同步访问的问题。\n\n### 9.4.5 检查视图 (Checked Views)\n\n检查视图旨在调试泛型类型中可能出现的问题。如第\
  \ 8 章所解释，实际上可以将错误类型的元素“偷入”泛型集合中。例如：\n\n点击此处查看代码图片\n\n```\nArrayList<String> strings\
  \ = new ArrayList<>();\nArrayList rawList = strings; // 仅有警告，不是错误，为了兼容旧代码\nrawList.add(new\
  \ Date()); // 现在 strings 包含一个 Date 对象！\n```\n\n这个错误的 `add` 命令在运行时不会被检测到。相反，当代码的另一部分调用\
  \ `get` 并将结果强制转换为 `String` 时，稍会发生类转换异常（class cast exception）。\n\n检查视图可以检测到此问题。如下所示定义一个安全列表：\n\
  \n点击此处查看代码图片\n\n```\nList<String> safeStrings = Collections.checkedList(strings,\
  \ String.class);\n```\n\n视图的 `add` 方法会检查插入的对象是否属于给定的类，如果不属于，则立即抛出 `ClassCastException`。这样做的好处是错误会在正确的位置报告：\n\
  \n点击此处查看代码图片\n\n```\nArrayList rawList = safeStrings;\nrawList.add(new Date());\
  \ // checked list 抛出一个 ClassCastException\n```\n\n![Image](img/caution.jpg) 注意\n\
  \n检查视图受到虚拟机可以执行的运行时检查。例如，如果你有一个 `ArrayList<Pair<String>>`，你无法防止它插入一个 `Pair<Date>`，因为虚拟机只有一个“原始”的\
  \ `Pair` 类。\n\n### 9.4.6 关于可选操作的说明\n\n视图通常具有某些限制——它可能是只读的，它可能无法更改大小，或者它支持删除但不支持插入（如\
  \ map 的键视图）。如果你尝试不当的操作，限制性视图将抛出 `UnsupportedOperationException`。\n\n在集合和迭代器接口的 API\
  \ 文档中，许多方法被描述为“可选操作（optional operations）”。这似乎与接口的概念相冲突。毕竟，接口的作用难道不是列出类*必须*实现的方法吗？诚然，从理论角度来看，这种安排安排是不满意的。更好的解决方案可能是为只读视图和无法更改集合大小的视图设计独立的接口。然而，这将使接口数量增加三，库的设计者认为这是不可接受的。\n\
  \n你是否应该将“可选”方法的技术扩展到你自己的设计中？我们认为不应该。尽管集合被频繁使用，但实现它们的编码风格对于其他问题领域并不典型。集合类库的设计者必须解决一组特别严酷的冲突需求。用户希望库易于学习、方便使用、完全通用、防呆（idiot-proof），并且像手编写的算法一样高效。同时实现所有这些目标显然是不可能的，即使是接近也可以。但在你自己的编程问题中，你很少遇到如此极端的约束。你应该能够找到不依赖于“可选”接口操作这种极端措施的解决方案。\n\
  \n```java\njava.util.Collections\nstatic <E> Collection unmodifiableCollection(Collection<E>\
  \ c)\nstatic <E> List unmodifiableList(List<E> c)\nstatic <E> Set unmodifiableSet(Set<E>\
  \ c)\nstatic <E> SortedSet unmodifiableSortedSet(SortedSet<E> c)\nstatic <E> NavigableSet\
  \ unmodifiableNavigableSet(NavigableSet<E> c)\nstatic <K, V> Map unmodifiableMap(Map<K,\
  \ V> c)\nstatic <K, V> SortedMap unmodifiableSortedMap(SortedMap<K, V> c)\nstatic\
  \ <K, V> NavigableMap unmodifiableNavigableMap(NavigableMap<K, V> c)\n\nstatic <E>\
  \ Collection synchronizedCollection(Collection<E> c)\nstatic <E> List synchronizedList(List<E>\
  \ c)\nstatic <E> Set synchronizedSet(Set<E> c)\nstatic <E> SortedSet synchronizedSortedSet(SortedSet<E>\
  \ c)\nstatic <E> NavigableSet synchronizedNavigableSet(NavigableSet<E> c)\nstatic\
