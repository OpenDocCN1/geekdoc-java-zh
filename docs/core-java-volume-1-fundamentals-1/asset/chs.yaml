  \ 编程语言自 1.0 版本以来最重大的变化。Java SE 5.0 引入泛型是 1999 年制定的首批 Java 规范请求之一——`JSR 14` 的结果。专家小组花费了大约五年的时间编写规范和测试实现。\n\
  \n泛型类之所以受到欢迎，是因为它们能让你编写出比充斥着 `Object` 变量和强制转换的代码更安全、更易读。泛型对于集合类特别有用，例如无处不在的 `ArrayList`。\n\
  \n泛型类——至少在表面上——与 C++ 的模板（templates）相似。在 C++ 中，在 Java 中一样，模板最初被添加到语言中是为了支持强类型集合。然而，在随后的多年里，人们发现了它的许多其他用途。读完本章后，你可能会在自己的程序中发现\
  \ Java 泛型的新颖用法。\n\n### 8.1 为什么要用泛型编程？\n\n`generic programming` 意味着编写可以为许多不同类型的对象复用的代码。例如，你不想编写单独的类来分别收集\
  \ `String` 和 `File` 对象。你也不必这样做——单一的 `ArrayList` 类就可以收集任何类 对象。这就是泛型编程的一个例子。\n\n实际上，Java\
  \ 在拥有泛型类之前就已经有一个 `ArrayList` 类了。让我们研究一下泛型编程机制是如何演变的，以及这对用户和实现者意味着什么。\n\n#### 8.1.1\
  \ 类型参数的优势\n\n在泛型类添加到 Java 之前，泛型编程是通过 `inheritance`（继承）实现的。`ArrayList` 类简单地维护了一个\
  \ `Object` 引用数组：\n\n点击此处查看代码图像\n\n```java\npublic class ArrayList // 泛型类出现之前\n{\n\
  \   private Object[] elementData;\n   . . .\n   public Object get(int i) { . . .\
  \ }\n   public void add(Object o) { . . . }\n}\n```\n\n这种方法有两个问题。每当你获取值时，都需要进行强制转换：\n\
  \n点击此处查看代码图像\n\n```java\nArrayList files = new ArrayList();\n. . .\nString filename\
  \ = (String) files.get(0);\n```\n\n此外，没有错误检查。你可以添加任何类的值：\n\n```java\nfiles.add(new\
  \ File(\". . .\"));\n```\n\n此调用可以通过编译并运行而不会报错。在其他地方，将 `get` 的结果强制转换为 `String` 将导致错误。\n\
  \n泛型提供了一个更好的解决方案：`type parameters`（类型参数）。`ArrayList` 类现在有了一个类型参数，用于指示元素类型：\n\n点击此处查看代码图像\n\
  \n```java\nArrayList<String> files = new ArrayList<String>();\n```\n\n这使得你的代码更易读。你可以立即看出这个特定的列表包含了\
