  \ `accounts[to] += amount;` 被翻译为以下字节码：\n\n点击此处查看代码图片\n\n```\naload_0\n```\n\n\n\n\
  \n\n```java\ngetfield #2; //Field accounts:D\niload_2\ndup2\ndaload\ndload_3\ndadd\n\
  dastore\n```\n这些代码的含义并不重要。关键在于增量命令是由几条指令组成的，执行这些指令的线程可以在任何指令处被中断。\n\n* *\n\n这种损坏发生的概率有多大？我们通过将打印语句与更新余额的语句交替执行，增加了观察到该问题的概率。\n\
  \n如果你省略打印语句，损坏的风险会降低许多，因为每个线程在再次进入睡眠之前的工作量非常少，调度器不太可能在计算过程中抢占它的执行。然而，损坏的风险并不会完全消失。如果你在负载很重的机器上运行大量线程，即使删除了打印语句，程序仍然会失败。失败可能会在几分钟后、几小时或几天后发生。坦率地说，对于程序员来说，没有什么比每隔几天才出现一次的错误更糟糕的了。\n\
  \n真正的问题是 `transfer` 方法的工作可能会在中途中断。如果我们能确保方法在线程丢失控制权之前运行完成，银行账户对象的状态永远不会被损坏。\n\n\
  ### 14.5.3 锁对象\n\n有两种机制可以保护代码块免受并发访问。Java 语言提供了 `synchronized` 关键字来实现这一目的，Java SE\
  \ 5.0 引入了 `ReentrantLock` 类。`synchronized` 关键字自动提供了一个锁以及相关的“条件（condition）”，这使得对于大多数需要显式锁的情况来说既强大又方便。然而，我们认为在单独查看了锁和条件之后，理解\
  \ `synchronized` 关键字会更容易。`java.util.concurrent` 框架为这些基础机制提供了单独的类，我们在此以及[第 14.5.4\
  \ 节“条件对象”（第 872 页）进行了解释。一旦你理解了这些构建块，我们将在第 14.5.5 节“`synchronized` 关键字”（第 878 页）中介绍\
  \ `synchronized` 关键字。\n\n使用 `ReentrantLock` 保护代码块的基本结构是：\n\n```java\nmyLock.lock();\
  \ // 一个 ReentrantLock 对象\ntry {\n    critical section\n} finally {\n    myLock.unlock();\
  \ // 即使抛出异常也能确保解锁\n}\n```\n\n这种结构保证了一次只有一个线程可以进入临界区域。一旦一个线程锁定了对象，其他线程就无法通过 `lock`\
  \ 语句。当其他线程调用 `lock` 时，它们会被去激活状态，直到第一个线程释放锁对象。\n\n* *\n\n![Image](img/caution.jpg)\
  \ 注意\n\n将 `unlock` 操作封装在 `finally` 子句中至关重要。如果临界区域中的代码抛出异常，必须解锁。否则，其他线程将被永久阻塞。\n\n\
  * *\n\n* *\n\n![Image](img/note.jpg) 备注\n\n当你使用锁时，无法使用 `try-with-resources` 语句。首先，`unlock`\
  \ 方法并不名为 `close`。但即使它被重命名了，`try-with-resources` 语句也无法工作。它的头部期望声明一个新变量。但当你使用锁时，你希望继续使用线程间共享的同一个变量。\n\
  \n* *\n\n让我们使用锁来保护 `Bank` 类的 `transfer` 方法。\n\n```java\npublic class Bank {\n  \
  \  private Lock bankLock = new ReentrantLock(); // ReentrantLock 实现 Lock 接口\n  \
  \  ...\n    public void transfer(int from, int to, int amount) {\n        bankLock.lock();\n\
  \        try {\n            System.out.print(Thread.currentThread());\n        \
  \    accounts[from] -= amount;\n            System.out.printf(\" %10.2f from %d\
  \ to %d\", amount, from, to);\n            accounts[to] += amount;\n           \
  \ System.out.printf(\" Total Balance: %10.2f%n\", getTotalBalance());\n        }\
  \ finally {\n            bankLock.unlock();\n        }\n    }\n}\n```\n\n\n\n\n\n\
  通常，一个线程进入关键区域后，发现自己在条件满足之前无法继续。使用 `condition object`（条件对象）来管理那些已获取锁但无法进行有效工作的线程。在本节中，我们将介绍\
  \ Java 库中条件对象的实现。（由于历史原因，条件对象通常被称为 `condition variables` 条件变量。）\n\n让我们完善一下对银行的模拟。我们不想从一个没有资金的账户转出资金。请注意，我们不能使用如下代码：\n\
  \n```java\nif (bank.getBalance(from) >= amount)\n    bank.transfer(from, to, amount);\n\
  ```\n\n在测试结果成功和调用 `transfer` 之间，当前线程完全可能会被停用。\n\n```java\nif (bank.getBalance(from)\
  \ >= amount)\n    // 线程在此处可能会被激活\n    bank.transfer(from, to, amount);\n```\n\n\
  当线程再次运行时，账户余额可能已经低于提取金额。你必须确保在测试和转移操作之间，没有其他线程可以修改余额。你通过用锁同时保护测试和转移操作来实现这一点：\n\n\
  ```java\npublic void transfer(int from, int to, int amount)\n{\n    bankLock.lock();\n\
  \    try\n    {\n        while (accounts[from] < amount)\n        {\n          \
  \  // wait\n            . . .\n        }\n        // transfer funds\n        . .\
  \ .\n    }\n    finally\n    {\n        bankLock.unlock();\n    }\n}\n```\n\n现在，当账户中钱不足时，我们该怎么办？我们等待直到其他线程增加了资金。但此线程刚刚获得了\
  \ `bankLock` 的独占访问权限，因此其他线程没有机会进行存款。这就是条件对象的用武之场。\n\n一个锁对象可以有一个或多个相关的条件对象。你通过 `newCondition`\
  \ 方法获取条件对象。习惯上会为每个条件对象命名一个能够唤起它所代表条件的名称。例如，在这里我们设置了一个条件对象来代表“资金充足”的条件。\n\n```java\n\
  class Bank\n{\n    private Condition sufficientFunds;\n    . . .\n    public Bank()\n\
  \    {\n        . . .\n        sufficientFunds = bankLock.newCondition();\n    }\n\
  }\n```\n\n如果 `transfer` 方法发现资金不足，它会调用\n\n`sufficientFunds.await();`\n\n当前线程现在被停用并放弃锁。这让另一个线程能够进入，我们希望它能增加账户余额。\n\
  \n等待获取锁的线程与调用了 `await` 的线程之间存在本质区别。一旦线程调用了 `await` 方法，它就会进入该条件的 `wait set`（等待集）。当锁可用时，该线程**不会**被变为可运行状态。相反，它一直保持停用，直到另一个线程在同一个条件上调用了\
  \ `signalAll` 方法。\n\n当另一个线程转账资金后，它应该调用\n\n`sufficientFunds.signalAll();`\n\n此调用会重新激活所有等待该条件的线程。当线程从等待集中被移除时，它们再次变为可运行状态，调度器最终会再次激活它们。届，它们将尝试重新进入对象。一旦锁可用，其中一个线程将获取锁\
  \ `并从它停止的地方继续执行`，并从 `await` 调用中返回。\n\n此时，线程应该再次测试该条件。无法保证该条件现在已经满足——`signalAll`\
  \ 方法仅仅向等待线程发出信号，表示条件此时`可能`已经满足，并且值得再次检查该条件。\n\n***\n\n**注意**：通常情况下，对 `await` 的调用应该位于如下形式的循环内部：\n\
  \n```java\nwhile (!(ok to proceed))\n    condition.await();\n```\n\n***\n\n至关重要的一点是，其他线程最终必须调用\
  \ `signalAll` 方法。当线程调用 `await` 时，它无法重新激活自己。它寄希望于其他线程。如果没有一个线程去重新激活等待的线程，它将永远不再运行。这可能导致糟糕的\
  \ `deadlock`（死锁）情况。如果所有其他线程都被阻塞，而最后一个活跃的线程调用 `await` 而没有解锁其中任何一个，它也会被阻塞。没有线程可以解锁其他线程，程序就会挂起。\n\
  \n什么时候应该调用 `signalAll`？法则是，每当对象的状态发生可能对等待线程有利的变化时，就调用 `signalAll`。例如，每当账户余额变化时，等待线程都应该获得再次检查的机会。在我们的示例中，当我们完成资金转移时，调用\
  \ `signalAll`。\n\n```java\npublic void transfer(int from, int to, int amount)\n\
  {\n    bankLock.lock();\n    try\n    {\n        while (accounts[from] < amount)\n\
  \            sufficientFunds.await();\n        // transfer funds\n        . . .\n\
  \        sufficientFunds.signalAll();\n    }\n    finally\n    {\n        bankLock.unlock();\n\
  \    }\n}\n```\n\n注意，调用 `signalAll` 并会立即激活等待的线程。它只是解除等待线程的阻塞，以便它们在当前线程释放锁后可以竞争进入对象。另一种方法\
  \ `signal` 仅从等待集中随机选择一个线程并解除其阻塞。这比解除所有线程的效率更高，但存在风险。如果随机选中的线程发现它仍然无法继续，它将再次被阻塞。如果没有其他线程再次调用\
  \ `signal`，系统就会发生死锁。\n\n***\n\n**警告**：线程只有在拥有锁的情况下，才能对某个条件调用 `await`、`signalAll`\
  \ 或 `signal`。\n\n***\n\n如果你运行 `Listing 14.7` 中的示例程序，你会发现没有任何问题在发生。总余额将永远保持在 100,000\
  \ 美元。没有任何账户是负余额。（再次，按 `Ctrl+C` 终止程序。）你可能还会注意到程序运行得稍慢——这是你为同步中增加的账目记录付出的代价。\n\n在实践中，正确地使用条件是非常挑战性的。在开始实现你的条件对象之前，你应该考虑使用第\
  \ 934 页第 14.10 节“同步器”中描述的构造之一。\n\n**Listing 14.7** `synch/Bank.java`\n\n```java\n\
