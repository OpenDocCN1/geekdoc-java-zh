  \ String.format(\"Hello, %s. Next year, you'll be %d\", name, age);\n```\n\n为了完整起见，我们简要讨论\
  \ `printf` 方法的日期和时间格式化选项。对于新代码，你应该使用第二卷第 6 章中描述的 `java.time` 包中的方法。但你可能会在遗留代码中遇到\
  \ `Date` 类和相关的格式选项。格式由两个字母组成，以 `t` 开头并以表 3.7 中的字母之一结束；例如：\n\n点击此处查看代码图像\n\n```\n\
  System.out.printf(\"%tc\", new Date());\n```\n\n![Image](img/03tab07.jpg)![Image](img/03tab07a.jpg)\n\
  \n**表 3.7** 日期和时间转换字符\n\n以以下格式打印当前日期和时间\n\nMon Feb 09 18:05:19 PST 2015\n\n正如你在表\
  \ 3.7 所示，某些格式仅产生给定日期的部分——例如，仅日期或仅月份。如果你必须多次提供日期来格式化每个部分，那将有点傻。出于因此，格式字符串可以指定要格式化的参数的\
