  \        }\n        return new Pair(min, max);\n    }\n}\n```\n\n## 6.5 代理（Proxies）\n\
  \n在本章的最后节中，我们将讨论 `proxies`（代理）。你可以使用代理在运行时创建实现给定一组接口的新类。只有当你从编译时还不知道需要实现哪些接口时，代理才是必要的。对于应用程序程序员来说，这种情况并不常见，如果你对高级魔法术感兴趣，可以随时跳过这一节。然而，对于某些系统编程应用程序，代理提供的灵活性可能非常重要。\n\
  \n### 6.5.1 何时使用代理\n\n假设你想构造一个实现一个或多个接口类的对象，而你可能在编译时不知道这些接口的精确性质。这是一个困难的问题。要构造一个实际类，你可以简单地使用\
  \ `newInstance` 方法或使用反射查找构造函数。但你不能实例化接口。你需要在运行中的程序中定义一个新类。\n\n为了解决这个问题，某些程序会生成代码，将其放入文件，调用编译器，然后加载生成的类文件。自然地，这种方法很慢，而且还需要将编译器与程序一起部署。`proxy`\
  \ 机制是一个更好的解决方案。代理类可以在运行时创建全新的类。此类代理类实现了你指定的接口。特别地，代理类具有以下方法：\n\n- 所指定接口要求的所有方法；以及\n\
  - `Object` 类中定义的所有方法（`toString`、`equals` 等）。\n\n然而，你不能在运行时为这些方法定义新代码。相反，你必须提供一个\
  \ `invocation handler`（调用处理器）。调用处理器是任何实现 `InvocationHandler` 接口的类的对象。该接口有一个方法：\n\
  \n点击此处查看代码图像\n\n```java\nObject invoke(Object proxy, Method method, Object[] args)\n\
  ```\n每当对代理对象调用方法时，调用处理器的 `invoke` 方法就会被调用，并带有调用的 `Method` 对象和参数。调用处理器必须弄清楚如何处理该调用。\n\
  \n### 6.5.2 创建代理对象\n\n要创建代理对象，使用 `Proxy` 类的 `newProxyInstance` 方法。该方法有三个参数：\n\n\
  - 一个 `class loader`。作为 Java 安全模型模型的一部分，不同的类加载器可以用于系统类、从互联网下载的类等。我们将在第二卷第 9 章 中讨论类加载器。现在我们指定\
  \ `null` 以使用默认类加载器。\n- 一个 `Class` 对象数组，每个对象对应要实现的接口。\n- 一个调用处理器。\n\n还有两个问题。我们如何定义处理器？我们对生成的代理对象可以做什么？答案显然取决于我们想要用代理解决的问题。代理可以用于许多目的，例如：\n\
  \n- 将方法调用路由到远程服务器\n- 将用户界面事件与运行程序中的操作关联\n- 用于调试的方法跟踪\n\n在示例程序中，我们使用代理和调用处理器来跟踪方法调用。我们定义了一个\
  \ `TraceHandler` 包装类，存储被包装的对象。它的 `invoke` 方法简单地打印要调用的方法名和参数，然后将包装的对象作为隐式参数调用该方法。\n\
  \n点击此处查看代码图像\n\n```java\nclass TraceHandler implements InvocationHandler\n{\n  \
  \  private Object target;\n    public TraceHandler(Object t)\n    {\n        target\
  \ = t;\n    }\n    public Object invoke(Object proxy, Method m, Object[] args)\n\
  \    throws Throwable\n    {\n        // 打印方法名和参数\n        ...\n        // 调用实际方法\n\
  \        return m.invoke(target, args);\n    }\n}\n```\n\n下面是如何构造一个当它的某个方法被调用时触发跟踪行为的代理对象：\n\
  \n```java\nObject value = ...;\n// 构造包装\nInvocationHandler handler = new TraceHandler(value);\n\
  \n// 为一个或多个接口构造代理\nClass[] interfaces = new Class[] { Comparable.class };\nObject\
  \ proxy = Proxy.newProxyInstance(null, interfaces, handler);\n```\n\n现在，每当接口的某个方法在\
  \ `proxy` 上被调用时，方法名和参数都会被打印出来，然后在 `value` 上调用该方法。\n\n\n\n\n\n在列表 6.10 所示的程序中，我们使用代理对象来跟踪二分查找。我们用指向整数\
  \ `1 ... 1000` 的代理对象填充一个数组。然后，我们调用 `Arrays` 类的 `binarySearch` 方法在数组中搜索一个随机整数。最后，我们打印匹配的元素。\n\
  \n点击此处查看代码图像\n\n```java\nObject[] elements = new Object[1000];\n\n// fill elements\
  \ with proxies for the integers 1 . . . 1000\nfor (int i = 0; i < elements.length;\
  \ i++)\n{\n    Integer value = i + 1;\n    elements[i] = Proxy.newProxyInstance(.\
  \ . .); // proxy for value;\n}\n\n// construct a random integer\nInteger key = new\
  \ Random().nextInt(elements.length) + 1;\n\n// search for the key\nint result =\
  \ Arrays.binarySearch(elements, key);\n\n// print match if found\nif (result >=\
  \ 0) System.out.println(elements[result]);\n```\n\n`Integer` 类实现了 `Comparable` 接口。代理对象属于一个在运行时定义的类（它有一个诸如\
  \ `$Proxy0` 的名称）。该类也实现了 `Comparable` 接口。然而，它的 `compareTo` 方法会调用代理对象处理器的 `invoke`\
  \ 方法。\n\n* * *\n\n![图像](img/note.jpg) 注意\n\n正如你在本章稍些部分所看到的，`Integer` 类实际上实现了 `Comparable<Integer>`。但在运行时，所有的泛型类型都会被擦除，代理是使用原始\
  \ `Comparable` 类的类对象构造的。\n\n* * *\n\n`binarySearch` 方法发出的调用如下：\n\n点击此处查看代码图像\n\n\
  ```java\nif (elements[i].compareTo(key) < 0) . . .\n```\n\n由于我们用代理对象填充了数组，因此 `compareTo`\
  \ 的调用会转到 `TraceHandler` 类的 `invoke` 方法。该方法会打印方法名和参数，然后在被包装的 `Integer` 对象上调用 `compareTo`。\n\
  \n最后，在示例程序的末处，我们调用了\n\n点击此处查看代码图像\n\n```java\nSystem.out.println(elements[result]);\n\
  ```\n\n`println` 方法对代理对象调用 `toString`，而该调用也被重定向到了调用处理器。\n\n以下是程序运行的完整轨迹：\n\n```\n\
  500.compareTo(288)\n250.compareTo(288)\n375.compareTo(288)\n312.compareTo(288)\n\
  281.compareTo(288)\n296.compareTo(288)\n288.compareTo(288)\n288.toString()\n```\n\
  \n你可以看到二分查找算法如何通过每一步将搜索范围减半来锁定键。注意，即使 `toString` 方法不属于 `Comparable` 接口，它仍然被代理了——正如你在下一节中看到的，某些\
  \ `Object` 方法总是会被代理的。\n\n**列表 6.10** `proxy/ProxyTest.java`\n\n点击此处查看代码图像\n\n* *\
  \ *\n\n```java\n1    package proxy;\n2\n3    import java.lang.reflect.*;\n4    import\
  \ java.util.*;\n5\n6    /**\n7      * 此程序演示了代理的使用。\n8      * @version 1.00 2000-04-13\n\
  9      * @author Cay Horstmann\n10     */\n11   public class ProxyTest\n12   {\n\
  13      public static void main(String[] args)\n14      {\n15          Object[]\
  \ elements = new Object[1000];\n16\n17          // fill elements with proxies for\
  \ the integers 1 ... 1000\n18          for (int i = 0; i < elements.length; i++)\n\
  19          {\n20              Integer value = i + 1;\n21              InvocationHandler\
  \ handler = new TraceHandler(value);\n22              Object proxy = Proxy.newProxyInstance(null,\
  \ new Class[] { Comparable.class }, handler);\n23              elements[i] = proxy;\n\
  24          }\n25\n26          // construct a integer\n27          Integer key =\
  \ new Random().nextInt(elements.length) + 1;\n28\n29          // search for the\
  \ key\n30          int result = Arrays.binarySearch(elements, key);\n31\n32    \
  \      // match if found\n33          if (result >= 0) System.out.println(elements[result]);\n\
  34      }\n35\n36    /**\n37      * 一个调用处理器，它会打印方法名和参数，然后\n38      * 调用原始方法\n39\
  \      */\n40    class TraceHandler implements InvocationHandler\n41    {\n42  \
  \    private Object target;\n43\n44      /**\n45        * 构造一个 TraceHandler\n46\
  \        * @param t 方法调用的隐式参数\n47        */\n48      public TraceHandler(Object\
  \ t)\n49          target = t;\n50      }\n51\n52      public Object invoke(Object\
  \ proxy, Method m, Object[] args) throws Throwable\n53          System.out.println(\"\
  Invoking \" + m.getName());\n54          if (args != null) {\n55              System.out.print(\"\
  with args: \");\n56              for (int i = 0; i < args.length; i++) {\n57   \
  \               System.out.print(args[i]);\n58                  if (i < args.length\
  \ - 1) System.out.print(\", \");\n59              }\n60              System.out.println();\n\
  61          }\n62          Object result = m.invoke(target, args);\n63         \
  \ System.out.println(\"Returned: \" + result);\n64          return result;\n65 \
  \     }\n66    }\n```\n\n* * *\n\n### 6.5.3 代理类的属性\n\n现在你已经了解了代理类的运作方式，让我们回顾它们的一些属性。记住，代理类是在运行时创建的，就像任何其他类一样。\n\
  \n所有的代理类继承自 `Proxy`。代理类只有一个字段——调用处理器，它存储了执行任务所需的额外数据。例如，当列表 6.10 中我们代理 `Comparable`\
  \ 对象时，`TraceHandler` 包装了这些对象。\n\n代理类重写了 `Object` 类的 `toString`、`equals` 和 `hashCode`\
  \ 方法。与所有代理方法一样，这些方法简单的调用处理器的 `invoke`。`Object` 类的其他方法（如 `clone` 和 `getClass`）没有被重定义。\n\
  \n对于特定的类加载器和有序接口集合，只有一个代理类。也就是说，如果你使用相同的类加载器和接口数组调用两次 `newProxyInstance`将得到相同的对象。你也可以通过\
  \ `getProxyClass` 方法获取该类：\n\n点击此处查看代码图像\n\n```java\nClass proxyClass = Proxy.getProxyClass(null,\
  \ interfaces);\n```\n\n代理类总是 `public` 且 `final`。如果代理类实现的所有接口都是 `public`，则代理类不属于任何特定的包。否则，所有非公共接口必须属于同一个包，代理类也将属于该包。\n\
  \n你可以通过调用 `Proxy` 类的 `isProxyClass` 方法来测试特定的 `Class` 对象是否代表代理类。\n\n* * *\n\n`java.lang.reflect.InvocationHandler`\
  \ (1.3)\n\n`Object invoke(Object proxy, Method method, Object[] args)`\n\n定义此方法以包含当在代理对象上调用方法时想要执行的操作。\n\
  \n* * *\n\n* * *\n\n`java.lang.reflect.Proxy` (1.3)\n\n`static Class<?> getProxyClass(ClassLoader\
  \ loader, Class<?>... interfaces)`\n\n返回实现给定接口的代理类。\n\n`static Object newProxyInstance(ClassLoader\
  \ loader, Class<?>[] interfaces, InvocationHandler handler)`\n\n构造实现给定接口的代理类的实例。所有方法都会调用给定处理器对象的\
  \ `invoke` 方法。\n\n`static boolean isProxyClass(Class<?> cl)`\n\n如果 `cl` 是代理类，则返回\
  \ `true`。\n\n\n\n\n\n这是我们关于 Java 编程语言基础知识的最后一个章节。接口、lambda 表达式和内部类是你会经常遇到的概念。然而，正如我们已经提到的，克隆和代理是主要对库设计者和工具构建者感兴趣的高级技术，而不是应用程序程序员。你现在准备好学习如何在第\
  \ 7 章中处理程序中的异常情况了。\n\n# 第 7 章异常、断言与日志\n\n在本章中\n\n• 7.1 处理错误\n• 7.2 捕获异常\n• 7.3 使用异常的技巧\n\
  • 7.4 使用断言\n• 7.5 日志\n• 7.6 调试技巧\n\n在一个完美的世界里，用户永远不会以错误的格式输入数据，他们选择打开的文件将始终存在，代码永远不会有\
  \ bug。到目前为止，我们展示的代码大多就像我们生活在这样一个完美的世界里一样。现在是时候转向 Java 编程语言用于处理现实世界中错误数据和多 bug 代码的机制了。\n\
  \n遇到错误是不愉快的。如果用户因为编程错误或某些外部情况丢失了在程序运行期间所做的工作，那么该用户可能会永远离开你的程序。至少，你必须：\n\n• 通知用户发生了错误；\n\
  • 保存所有工作；以及\n• 允许用户优雅地退出程序。\n\n对于异常情况，例如可能导致程序崩溃的错误输入数据，Java 使用了一种错误捕获形式，名不虚归，它被称为`exception\
  \ handling`。Java 中的异常处理与 C++ 或 Delphi 类似。本章的第一部分涵盖了 Java 异常。\n\n在测试期间，你需要运行许多检查以确保你的程序执行了正确的操作。但这些检查在测试完成后可能是耗时的，且没必要的。你可以直接移除检查，并在需要额外测试时将它们放回来——但这太麻烦了。本章的第二部分将向你展示如何使用断言机制来选择性地激活检查。\n\
  \n当你的程序执行错误操作时，你并不总是能与用户通信或终止。相反，你可能想记录问题以便以后分析。本章的第三部分讨论了标准的 Java 日志框架。\n\n## 7.1\
  \ 处理错误\n\n假设在 Java 程序运行时发生了一个错误。该错误可能是由包含错误信息的文件、不稳定的网络连接，或者（我们很不想提这一点）使用无效的数组索引，或尝试使用尚未赋值给对象的引用引起的。用户期望程序在发生错误时表现得明智。如果某个操作因为错误而无法完成，程序应该\n\
  \n• 回到安全状态并允许用户执行其他命令；\n• 允许用户保存所有工作并优雅地退出程序。\n\n要做到这一点可能并不容易，因为检测（甚至引起）错误条件的代码通常与可以将数据回滚到安全状态的代码，或可以保存用户工作并愉快退出的代码相隔遥。异常处理的任务是将控制权从错误发生的地方转移到可以处理该情况的错误处理器。为了处理程序中的异常情况，你必须考虑可能发生的错误和问题。你需要考虑哪些类型的问题？\n\
  \n• *用户输入错误。* 除了不可避免的拼写错误外，有些用户喜欢自辟蹊径而不是遵循指示。例如，假设用户请求连接到一个语法上错误的 URL。你的代码应该检查语法，但假设它没有检查。那么网络层将会报错。\n\
  • *设备错误。* 硬件并不总是按照你意愿的方式工作。打印机可能已关闭。网页可能暂时无法访问。设备经常会在任务执行中途失败。例如，打印机可能在打印过程中用完纸。\n\
  • *物理限制。* 磁盘可能会满；你可能会耗尽可用内存。\n• *代码错误。* 某个方法可能执行不正确。例如，它可能提供错误的答案或错误地使用其他方法。计算无效的数组索引、尝试在哈希表中查找不存在的条目，或尝试从空栈中弹出，都是代码错误的示例。\n\
  \n对方法中错误的传统反应是返回一个特殊的错误代码，由调用该的方法进行分析。例如，从文件回读信息的方法通常返回一个 `-1` 文件结束标记，而不是标准字符。这可能是处理许多异常情况的一种有效方法。另一个表示错误状况的常见返回值是\
  \ `null` 引用。\n\n不幸的是，并不总是能够返回错误代码。可能没有明显的方法来区分有效和无效数据。一个返回整数的方法不能简单地返回 `-1` 来表示错误；值\
  \ `-1` 可能是一个完全有效的结果。\n\n相反，正如我们在第 5 章中提到的，如果方法无法以正常方式完成任务，Java 允许每个方法有一个替代退出路径。在这种情况下，方法不返回值。相反，它`throws`\
  \ 一个封装了错误信息的对象。注意，方法会立即退出；它不返回任何值。此外，执行不会在调用方法的代码处恢复；相反，异常处理机制开始寻找可以处理此错误的 `exception\
  \ handler`。\n\n异常有自己的语法并是特殊继承层次的一部分。我们将先介绍语法，然后给出如何有效使用此功能的提示。\n\n### 7.1.1 异常的分类\n\
  \n在 Java 编程语言中，异常对象总是派自 `Throwable` 类的实例。正如你很快看到的，如果 Java 内置的类符合你的需求，你可以创建自己的异常类。\n\
  \n图 7.1 是 Java 异常层次的简化图表。\n\n![Image](img/07fig01.jpg)\n\n**图 7.1** Java 异常层次\n\n\
  注意所有异常都继承自 `Throwable`，但层次结构立即分为两个分支：`Error` 和 `Exception`。\n\nError 层次结构描述了 Java\
  \ 运行时系统内部的错误和资源耗尽情况。你不应该抛出这种类型的对象。如果发生了此类内部错误，除了通知用户并尝试地退出程序外，你做不了什么。这种情况非常罕见。\n\
  \n在进行 Java 编程时，关注 `Exception` 层次结构。`Exception` 层次也分为两个分支：派自 `RuntimeException` 的异常和不派生的异常。通用规则是：`RuntimeException`\
  \ 的发生是因为犯了编程错误。任何其他异常的发生是因为糟糕的事情（例如 I/O 错误）发生在原本良好的程序上。\n\n继承自 `RuntimeException`\
  \ 的异常包括此类问题：\n\n• 类型转换错误\n• 数组越界访问\n• 空指针访问\n\n不继承自 `RuntimeException` 的异常包括\n\n\
  • 尝试读取文件末\n• 尝试打开不存在的文件\n• 尝试为不存在的类的字符串查找 `Class` 对象\n\n\n\n\n\n“如果是一个 `RuntimeException`，那就是你的错”这条规则非常有效。你本可以通过测试数组索引是否超出数组边界，从而避免那个\
  \ `ArrayIndexOutOfBoundsException`。如果你在使用变量之前先检查了它是否为 `null`，那么 `NullPointerException`\
  \ 就不会发生。\n\n那么一个不存在的文件呢？你难道不能先检查文件是否存在，然后再打开它吗？嗯，文件可能在你检查完它的存在性后紧接着被删除了。因此，“存在性”这一概念取决于环境，而不仅仅取决于你的代码。\n\
  \n《Java 语言规范》将任何派自 `Error` 类或 `RuntimeException` 类的异常称为*未检查的*（unchecked）异常。所有所有其他异常都称为*已检查的*（checked）异常。这是我们也采纳的有用术语。编译器会检查你是否为所有已检查异常提供了异常处理器。\n\
  \n***\n\n![Image](img/note.jpg) 备注\n\n`RuntimeException` 这个名字有点让人困惑。当然，我们正在讨论的所有错误都发生在运行时。\n\
  \n***\n\n![Image](img/note1.jpg) C++ 备注\n\n如果你熟悉标准 C++ 库中（局限性得多的）异常层次结构，你现在可能会感到非常困惑。C++\
  \ 有两个基础异常类：`runtime_error` 和 `logic_error`。`logic_error` 类相当于 Java 的 `RuntimeException`，它也表示程序中的逻辑错误。`runtime_error`\
  \ 类是由不可预测问题引起的异常的基类。它等于 Java 中那些不属于 `RuntimeException` 类型的异常。\n\n### 7.1.2 声明已检查异常\n\
  \n当 Java 方法遇到它无法处理的情况时，它可以抛出异常。这个想法很简单：方法不仅会告诉 Java 编译器它可以返回哪些值，*还会告诉编译器可能会发生什么错误。*例如，尝试从文件中读取的代码知道文件可能不存在，或者文件可能是空的。因此，尝试处理文件中信息的代码将需要通知编译器它可能会抛出某种\
  \ `IOException`。\n\n你声明你的方法可以抛出异常的地方是方法的头部；头部会发生变化以反映该方法可以抛出的已检查异常。例如，这里是标准库中 `FileInputStream`\
  \ 类的一个构造函数的声明。（有关输入和输出的更多信息，请参见卷二的第 2 章](#ch02.html_ch02)。）\n\n点击此处查看代码图像\n\n```java\n\
  public FileInputStream(String name) throws FileNotFoundException\n```\n\n该声明表示此构造函数根据\
  \ `String` 参数产生一个 `FileInputStream` 对象，但它*也*可能以特殊的方式出错——通过抛出一个 `FileNotFoundException`。如果发生了这种糟糕的情况，构造函数的调用将不会初始化一个新的\
  \ `FileInputStream` 对象，而是抛出一个 `FileNotFoundException` 类的对象。如果是这样，运行时系统将开始寻找知道处理\
  \ `FileNotFoundException` 对象的异常处理器。\n\n当你编写自己的方法时，你不需要声明你的方法实际上可能抛出的每一个可能的可抛出对象。要理解何时（以及什么）你需要在所写方法的的\
  \ `throws` 子句中声明内容，请记住在以下四种情况的任何一种情况下都会抛出异常：\n\n*   你调用了一个抛出已检查异常的方法——例如，`FileInputStream`\
  \ 构造函数。\n*   你检测到一个错误并使用 `throw` 语句抛出一个已检查异常（我们在下一节中介绍 `throw` 语句）。\n*   你犯了编程错误，例如\
  \ `a[-1] = 0` 导致未检查的异常（在这种情况下是 `ArrayIndexOutOfBoundsException`）。\n*   在虚拟机或运行时库中发生了内部错误。\n\
  \n如果发生了前两种情况的任何一种，你必须告诉使用你方法的程序员关于异常的可能性。为什么呢？任何抛出异常的方法都是一个潜在的死亡陷阱。如果没有处理器捕获该异常，当前执行线程将终止。\n\
  \n与所提供的类中的 Java 方法一样，你在方法头部通过*异常规格*（exception specification）来声明你的方法可能抛出异常。\n\n点击此处查看代码图像\n\
  \n```java\nclass MyAnimation\n{\n    ...\n    public Image loadImage(String s) throws\
  \ IOException\n    {\n        ...\n    }\n}\n```\n\n如果一个方法可能抛出多种已检查异常类型，你必须在头部列出所有的异常类。用逗号将它们隔开，如下例所示：\n\
  \n点击此处查看代码图像\n\n```java\nclass MyAnimation\n{\n    ...\n    public Image loadImage(String\
  \ s) throws FileNotFoundException, EOFException\n    {\n        ...\n    }\n}\n\
  ```\n\n然而，你不需要声明 Java 内部错误——即，继承自 `Error` 的异常。任何代码都可能抛出这些异常，而且它们完全超出了你的控制范围。\n\n\
  同样，你不应该声明继承自 `RuntimeException` 的未检查异常。\n\n点击此处查看代码图像\n\n```java\nclass MyAnimation\n\
  {\n    ...\n    void drawImage(int i) throws ArrayIndexOutOfBoundsException // 糟糕的风格\n\
  \    {\n        ...\n    }\n}\n```\n\n这些运行时错误完全在你的控制之下。如果你如此担心数组索引错误，你应该花时间去修复它们，而不是声明它们可能发生的可能性。\n\
  \n总之，方法必须声明它可能抛出的所有*已检查*异常。未检查异常要么在你的控制之外（`Error`），要么是由你本不允许的情况引起的（`RuntimeException`）。如果你的方法没有如实声明所有已检查异常，编译器将发出错误信息。\n\
  \n当然，正如你已经在许多示例中看到的，与其声明异常，你也可以捕获它。这样异常就不会抛出方法，因此不需要 `throws` 规格。你将在本章后面的部分学习如何决定捕获异常还是让别人捕获。\n\
  \n***\n\n![Image](img/caution.jpg) 注意\n\n如果你覆盖了父类的方法，子类方法声明的已检查异常不能比父类方法泛。（抛出更具体的异常，或者在子类中不抛出任何异常是可以的。）特别是，如果父类方法没有抛出任何异常，子类也不能有。例如，如果你覆盖了\
  \ `JComponent.paintComponent`，你的 `paintComponent` 方法不能抛出任何已检查异常，因为父类方法没有抛出。\n\n\
  ***\n\n当类中的方法声明它抛出一个特定类的实例异常时，它可以抛出该类或其任何子类的异常。例如，`FileInputStream` 构造函数可以声明它抛出\
  \ `IOException`。在这种情况下，你将不知道它是哪种 `IOException`；它可能是普通的 `IOException`，可能是各种子类之一的对象，例如\
  \ `FileNotFoundException`。\n\n\n\n\n此外，在 C++ 中，如果没有给出 `throw` 规范，函数可能会抛出任何异常。在 Java\
  \ 中，没有 `throws` 指定符的方法可能不会抛出任何检查异常（checked exceptions）。\n\n* * *\n\n### 7.1.3 如何抛出异常\n\
  \n现在，假设你的代码发生了一些糟糕的事情。你有一个方法 `readData`，它正在读取一个文件，该文件的头部承诺了\n\nContent-length: 1024\n\
  \n但你在读取 733 个字符后就遇到了文件末尾（EOF）。你可能认为这种情况非常异常，以至于你想抛出一个异常。\n\n你需要决定抛出什么种类型的异常。某种 `IOException`\
  \ 都是一个不错的选择。查阅 Java API 文档，你发现了一个 `EOFException`，描述为“信号在输入过程中意外到达了文件末尾”。完美。以下是抛出它的方法：\n\
  \n```java\nthrow new EOFException();\n```\n\n或者，如果你愿意：\n\n点击此处查看代码图片\n\n```java\n\
  EOFException e = new EOFException();\nthrow e;\n```\n\n以下是它们是如何结合在一起的：\n\n点击此处查看代码图片\n\
  \n```java\nString readData(Scanner in) throws EOFException\n{\n    ...\n    while\
  \ (. . .)\n    {\n        if (!in.hasNext()) // 遇到 EOF\n        {\n            if\
  \ (n < len)\n                throw new EOFException();\n        }\n        ...\n\
  \    }\n  return s;\n}\n```\n\n`EOFException` 有一个接受字符串参数的第二个构造函数。你可以通过更详细地描述异常情况来充分利用它。\n\
  \n点击此处查看代码图片\n\n```java\nString gripe = \"Content-length: \" + len + \", Received:\
  \ \" + n;\nthrow new EOFException(gripe);\n```\n\n你可以看到，如果现有的异常类有一个适用于，抛出异常是非常简单的。在这种情况下：\n\
  \n1. 找到一个合适的异常类。\n2. 创建该类的一个对象。\n3. 抛出它。\n\n一旦方法抛出异常，它就不会返回到调用者。这意味着你不需要担心编写一个默认返回值或错误码。\n\
  \n* * *\n\n![Image](img/note1.jpg) C++ 注意事项\n\n抛出异常在 C++ 和 Java 中是相同的，但有一个细微的区别。在\
  \ Java 中，你只能抛出 `Throwable` 的子类的对象。在 C++ 中，你可以抛出任何类型的值。\n\n* * *\n\n### 7.1.4 创建异常类\n\
  \n你的代码可能会遇到任何标准异常类无法充分描述的问题。在这种情况下，创建你自己的异常类是简单的。只需继承自 `Exception`，或者继承自 `Exception`\
  \ 的子类（如 `IOException`）。惯例是同时提供一个默认构造函数和一个包含详细消息的构造函数。（`Throwable` 超父类的 `toString`\
  \ 方法会返回一个包含该详细消息的字符串，这对调试非常有用。）\n\n点击此处查看代码图片\n\n```java\nclass FileFormatException\
  \ extends IOException\n{\n    public FileFormatException() {}\n    public FileFormatException(String\
  \ gripe)\n    {\n        super(gripe);\n    }\n}\n```\n\n现在你准备好抛出你自己的异常类型了。\n\n\
  点击此处查看代码图片\n\n```java\nString readData(BufferedReader in) throws FileFormatException\n\
  {\n    ...\n    while (. . .)\n    {\n        if (ch == -1) // 遇到 EOF\n        {\n\
  \            if (n < len)\n                throw new FileFormatException();\n  \
  \      }\n        ...\n    }\n    return s;\n}\n```\n\n* * *\n\njava.lang.Throwable\
  \ **1.0**\n\n- `Throwable()` 构建一个没有详细消息的新 `Throwable` 对象。\n- `Throwable(String message)`\
  \ 构建一个带有指定详细消息的新 `Throwable` 对象。按照惯例，所有派生的异常类都支持默认构造函数和带有详细消息的构造函数。\n- `String getMessage()`\
  \ 获取 `Throwable` 对象的详细消息。\n\n* * *\n\n## 7.2 捕获异常\n\n你现在知道如何抛出异常了。这很简单：你抛出它然后忘记它。当然，某些代码必须捕获该异常。捕获异常需要更多的规划。这就是接下来的章节将涵盖的内容。\n\
  \n### 7.2.1 捕获异常\n\n如果发生的异常没有在任何地方捕获，程序将终止。要捕获异常，请设置 `try/catch` 块。`try` 最简单的形式是：\n\
  \n```java\ntry {\n    // 代码\n} catch (Exception e) {\n    // 处理程序\n}\n```\n\n如果\
  \ `try` 块中的任何部分抛出异常，将执行 `catch` 块。\n\n1. 找到一个合适的异常类。\n2. 创建该类的一个对象。\n3. 抛出它。\n\n\
  一旦方法抛出异常，它就不会返回到调用者。这意味着你不需要担心编写一个默认返回值或错误码。\n\n\n\n在 Java 和 C++ 中，捕获异常几乎相同。严格来说，\n\
  \n```java\ncatch (Exception e) // Java\n```\n\n对应的写法是\n\n```cpp\ncatch (Exception&\
  \ e) // C++\n```\n\nJava 中没有 C++ 中 `catch (...)` 的对应物。这在 Java 中并不，因为所有异常都继承自一个公共父类。\n\
  \n### 7.2.2 捕获多个异常\n\n你可以在 `try` 块中捕获多种异常类型，并对每个类型进行不同的处理。如下例所示，为每个类型使用独立的 `catch`\
  \ 子句：\n\n点击查看代码图片\n\n```java\ntry\n{\n    可能抛出异常的代码\n}\ncatch (FileNotFoundException\
  \ e)\n{\n    针对缺失文件的紧急处理\n}\ncatch (UnknownHostException e)\n{\n    针对未知主机的紧急处理\n\
  }\ncatch (IOException e)\n{\n    针对所有其他 I/O 问题的紧急处理\n}\n```\n\n异常对象可能包含有关异常性质的信息。要了解更多关于该对象的信息，可以尝试\
  \ `e.getMessage()` 获取详细的错误信息（如果有），或者使用 `e.getClass().getName()` 获取异常对象的实际类型。\n\n\
  从 Java SE7 开始，你可以在同一个 `catch` 子句中捕获多种异常类型。例如，假设对缺失文件和未知主机的处理操作是相同的。那么你可以合并这些 `catch`\
  \ 子句：\n\n点击查看代码图片\n\n```java\ntry\n{\n    可能抛出异常的代码\n}\ncatch (FileNotFoundException\
  \ | UnknownHostException e)\n{\n    针对缺失文件和未知主机的紧急处理\n}\ncatch (IOException e)\n\
  {\n    针对所有其他 I/O 问题的紧急处理\n}\n```\n\n这一特性仅在捕获互不为子类的异常类型时才需要。\n\n![Image](img/note.jpg)\
  \ 注意事项\n\n当你捕获多个异常时，异常变量是隐式 `final` 的。例如，你不能在子句体中为 `e` 分配不同的值\n\n点击查看代码图片\n\n```java\n\
  catch (FileNotFoundException | UnknownHostException e) { ... }\n```\n\n![Image](img/note.jpg)\
  \ 注意事项\n\n捕获多个异常不仅让你的代码看起来更简单，而且效率更高。生成的字节码包含一个共享 `catch` 子句的单一块。\n\n### 7.2.3 重新抛出和异常链\n\
  \n你可以在 `catch` 子句中抛出异常。通常，当你想要更改异常类型时会这样做。如果你构建了一个供其他程序员使用的子系统，使用一个指示子系统失败的异常类型非常有意义。这种异常类型的一个示例是\
  \ `ServletException`。执行 servlet 的代码可能不想详细地知道发生了什么细微的错误，但它绝对想知道是 servlet 的错。\n\n\
  以下是捕获异常并重新抛出的方法：\n\n点击查看代码图片\n\n```java\ntry\n{\n    访问数据库\n}\ncatch (SQLException\
  \ e)\n{\n    throw new ServletException(\"database error: \" + e.getMessage());\n\
  }\n```\n\n在这里，`ServletException` 是使用异常的消息文本构造的。\n\n然而，更好的做法是将原始异常设置为新异常的“原因”：\n\n\
  点击查看代码图片\n\n```java\ntry\n{\n    访问数据库\n}\ncatch (SQLException e)\n{\n    Throwable\
  \ se = new ServletException(\"database error\");\n    se.initCause(e);\n    throw\
  \ se;\n}\n```\n\n当异常被捕获时，可以检索原始异常：\n\n`Throwable e = se.getCause();`\n\n这种包装技术被高度推荐。它允许你在子系统中抛出高层级异常，而不会丢失原始失败的细节。\n\
  \n![Image](img/tip.jpg) 提示\n\n如果在不允许抛出检查异常的方法中发生了检查异常，这种包装技术也很有用。你可以捕获该检查异常并将其封装为运行时异常。\n\
  \n有时，你只是想记录异常并在不进行任何更改的情况下重新抛出它：\n\n点击查看代码图片\n\n```java\ntry\n{\n    访问数据库\n}\n\
  catch (Exception e)\n{\n    logger.log(level, message, e);\n    throw e;\n}\n```\n\
  \n在 Java SE 7 之前，这种方法存在一个问题。假设代码位于方法内部\n\n点击查看代码图片\n\n`public void updateRecord()\
  \ throws SQLException`\n\nJava 编译器会查看 `catch` 块内部的 `throw` 语句，查看 `e` 的类型，并抱怨该方法可能会抛出任何\
  \ `Exception`，而不仅仅是 `SQLException`。这现在已经改进。\n\n### 7.2.4 finally 子句\n\n当你使用 `try`\
  \ 块时，无论是否捕获异常，`finally` 块都会执行。这对于清理资源非常有用，例如关闭文件或数据库连接。以下示例了 `finally` 子句无论是否发生异常都会执行：\n\
  \n点击查看代码图片\n\n```java\nInputStream in = new FileInputStream();\ntry\n{\n    // 1\n\
  \    可能抛出异常的代码\n    // 2\n}\ncatch (IOException e)\n{\n    // 3\n    显示错误信息\n  \
  \  // 4\n}\nfinally\n{\n    // 5\n    in.close();\n}\n// 6\n```\n\n让我们看看程序执行 `finally`\
  \ 子句的三种情况：\n\n**1.** 代码没有抛出异常。在这种情况下，程序首先执行 `try` 块中的代码。然后执行 `finally` 子句。之后，继续执行\
  \ `finally` 子句之后的语句。换句话说，执行将通过点 1、2、5 和 6。\n\n**2.** 代码抛出了由 `catch` 子句捕获的异常——在本例中是\
  \ `IOException`。对于这种情况，程序执行 `try` 块中的所有代码，直到抛出异常。`try` 块中的剩余代码被跳过。程序随后执行匹配的 `catch`\
  \ 子句，然后执行 `finally` 子句。\n\n如果 `catch` 子句没有抛出异常，程序将执行 `finally` 子句后的第一行。在这种情况下，执行将通过点\
  \ 1、3、4、5 和 6。\n\n如果 `catch` 子句抛出了异常，则该异常将抛回给此方法的调用者，执行将通过点 1、3 和 5。\n\n**3.** 代码抛出了未被任何\
  \ `catch` 子句捕获的异常。在这里，程序执行 `try` 块中的所有代码直到抛出异常。`try` 块中的剩余代码被跳过。然后执行 `finally` 子句中的代码，最后将异常抛回给此方法的调用者。执行将仅通过点\
  \ 1 和 5。\n\n你可以在没有 `catch` 子句的情况下使用 `finally` 子句。例如，考虑以下 `try` 语句：\n\n```java\n\
  InputStream in = ...;\ntry\n{\n```\n\n\n\n\n```java\n    code that might throw exceptions\n\
  }\n\nfinally\n{\n    in.close();\n}\n```\n\n`finally` 子句中的 `in.close()` 语句无论 `try`\
  \ 块中是否遇到异常都会执行。当然，如果遇到了异常，它会被重新抛出，并且必须在另一个 `catch` 子句中捕获。\n\n事实上，正如下面的提示所解释的，我们认为每当你需要关闭资源时，像这样使用\
  \ `finally` 子句是一个非常好的主意。\n\n***\n\n![Image](img/tip.jpg) 提示\n\n我们强烈建议你`decouple`\
  \ `try/catch` 和 `try/finally` 块。这会让你的代码变得远不那么困惑。例如：\n\n点击此处查看代码图片\n\n```java\nInputStream\
  \ in = ...;\n\ntry\n{\n    try\n    {\n        code that might throw exceptions\n\
  \    }\n    finally\n    {\n        in.close();\n    }\n}\ncatch (IOException e)\n\
  {\n    show error message\n}\n```\n\n内部 `try` 块有一个单一的职责：确保输入流被关闭。外部 `try` 块有一个单一的职责：确保错误被报告。这种解决方案不仅更清晰，而且更功能：`finally`\
  \ 子句中的错误也会被报告。\n\n***\n\n***\n\n![Image](img/caution.jpg) 注意\n\n当 `finally` 子句包含\
  \ `return` 语句时，可能会产生意外的结果。假设你通过 `return` 语句退出 `try` 块的中间。在方法返回之前，`finally` 块会被执行。如果\
  \ `finally` 块也包含 `return` 语句，那么它会掩盖原始的返回值。考虑这个刻意的例子：\n\n```java\npublic static int\
  \ f(int n)\n{\n    try\n    {\n        int r = n * n;\n        return r;\n    }\n\
  \    finally\n    {\n        if (n == 2) return 0;\n    }\n}\n```\n\n如果你调用 `f(2)`，则\
  \ `try` 块会计算 `r = 4` 并执行 `return` 语句。然而，`finally` 子句在方法实际返回之前执行，导致方法返回 `0`，忽略了原始的返回值\
  \ `4`。\n\n***\n\n有时 `finally` 子句会给你带来麻烦——特别是当清理方法也可能抛出异常时。假设你想确保在流处理代码遇到异常时关闭一个流（stream）。\n\
  \n点击此处查看代码图片\n\n```java\nInputStream in = ...;\n\ntry\n{\n    code that might throw\
  \ exceptions\n}\nfinally\n{\n    in.close();\n}\n```\n\n现在假设 `try` 块中的代码抛出了除代码调用者感兴趣的\
  \ `IOException` 之外的某种异常。`finally` 块执行并调用了 `close` 方法。该方法本身可以抛出一个 `IOException`！当它发生时，原始异常就会丢失，取而代之的是\
  \ `close` 方法的异常。\n\n这是一个问题，因为第一个异常可能更有价值。如果你想做正确的事并重新抛出原始异常，代码将变得极其繁琐。这里有一种设置方法：\n\
  \n点击此处查看代码图片\n\n```java\nInputStream in = ...;\n\nException ex = null;\n\ntry\n\
  {\n    try\n    {\n        code that might throw exceptions\n    }\n    catch (Exception\
  \ e)\n    {\n        ex = e;\n        throw e;\n    }\n}\nfinally\n{\n    try\n\
  \    {\n        in.close();\n    }\n    catch (Exception e)\n    {\n        if (ex\
  \ == null) throw e;\n    }\n}\n```\n\n幸运的是，Java SE 7 让处理关闭资源变得容易得多，正如你在下一节中看到的。\n\
  \n### 7.2.5 Try-with-Resources 语句\n\nJava SE 7 为这种代码模式提供了一个实用的快捷方式：\n\n```java\n\
  open a resource\ntry\n{\n    work with the resource\n}\nfinally\n{\n    close the\
  \ resource\n}\n```\n\n前提是该资源实现了一个 `AutoCloseable` 接口。该接口有一个单一的方法 `void close() throws\
  \ Exception`。\n\n***\n\n![Image](img/caution.jpg) 注意\n\n还有一个 `Closeable` 接口。它是 `AutoCloseable`\
  \ 的子接口，同样有一个 `close()` 方法。在最简单的变中，try-with-resources 语句的格式为：\n\n```java\ntry (Resource\
  \ res = ...)\n{\n    work with res\n}\n```\n\n当 `try` 块退出时，`res.close()` 会自动调用。这是一个典型的例子，读取所有单词：\n\
  \n点击此处查看代码图片\n\n```java\ntry (Scanner in = new Scanner(System.in)) \n{\n    while\
  \ (in.hasNext())\n    {\n        System.out.println(in.next());\n    }\n}\n```\n\
  \n无论 `try` 块如何退出（正常退出或异常退出），资源都会关闭。你可以指定多个资源：\n\n点击此处查看代码图片\n\n```java\ntry (Scanner\
  \ in = new Scanner(path.to.file);\n     PrintWriter out = new PrintWriter(System.out))\n\
  {\n    while (in.hasNext())\n    {\n        out.println(in.next());\n    }\n}\n\
  ```\n\n资源按照初始化的反顺序关闭。如果在关闭期间抛出了异常，原始异常会被保留，后续异常会被抑制。你可以使用 `getSuppressed()` 方法访问被抑制的异常。\n\
  \n### 7.2.6 分析堆栈元素\n\n堆栈跟踪（stack trace）是执行过程中某一点的方法调用列表。你已经见过堆栈跟踪——当 Java 程序因未捕获的异常终止时会显示。\n\
  \n你可以通过调用 `Throwable` 类的 `printStackTrace` 方法获取堆栈跟踪的文本描述。点击此处查看代码图片\n\n```java\n\
  Throwable t = new Throwable();\nStringWriter out = new StringWriter();\nt.printStackTrace(new\
  \ PrintWriter(out));\nString description = out.toString();\n```\n\n另一种灵活的方法是使用 `getStackTrace`\
  \ 获取 `StackTraceElement` 对象数组，你可以在程序中对其进行分析。点击此处查看代码图片\n\n```java\nThrowable t =\
  \ new Throwable();\nStackTraceElement[] frames = t.getStackTrace();\n\nfor (StackTraceElement\
  \ frame : frames)\n{\n    System.out.println(frame);\n}\n```\n\n`StackTraceElement`\
  \ 类具有获取文件名和行号、以及执行行的类名和方法名的方法。`toString` 方法产生包含所有这些信息的格式化字符串。\n\n静态方法 `Thread.getAllTraces`\
  \ 产生所有线程的堆栈跟踪。这里是使用该方法的方法：点击此处查看代码图片\n\n```java\nMap<Thread, StackTraceElement[]>\
  \ map = Thread.getAllStackTraces();\n\nfor (Thread t : map.keySet())\n{\n    StackTraceElement[]\
  \ frames = map.get(t);\n    analyze frames\n}\n```\n\n关于 `Map` 接口和线程的更多信息，请参见第 9\
  \ 章和第 14 章。\n\n[列表 7.1]打印了一个递归阶乘函数的堆栈跟踪。例如，如果你计算 `factorial(3)`，输出为：\n\n```\nfactorial(3):\n\
  ```\n\n\n\n\n\n```\nStackTraceTest.factorial(StackTraceTest.java:18)\nStackTraceTest.main(StackTraceTest.java:34)\n\
  factorial(2):\nStackTraceTest.factorial(StackTraceTest.java:18)\nStackTraceTest.factorial(StackTraceTest.java:24)\n\
  StackTraceTest.main(StackTraceTest.java:34)\nfactorial(1):\nStackTraceTest.factorial(StackTraceTest.java:18)\n\
  StackTraceTest.factorial(StackTraceTest.java:24)\nStackTraceTest.factorial(StackTraceTest.java:24)\n\
  StackTraceTest.main(StackTraceTest.java:34)\nreturn 1\nreturn 2\nreturn 6\n```\n\
  \nListing 7.1 `stackTrace/StackTraceTest.java`\n\n点击此处查看代码图像\n\n```java\npackage\
  \ stackTrace;\n\nimport java.util.*;\n\n/**\n * 一个显示递归方法调用堆栈轨迹的程序。\n * @version\
  \ 1.01 2004-05-10\n * @author Cay Horstmann\n */\npublic class StackTraceTest\n\
  {\n    /**\n     * 计算数字的阶乘\n     * @param n 一个非负整数\n     * @return n! = 1 * 2 *\
  \ ... * n\n     */\n    public static int factorial(int n)\n    {\n        System.out.println(\"\
  factorial(\" + n + \"):\");\n        Throwable t = new Throwable();\n        StackTraceElement[]\
  \ frames = t.getStackTrace();\n        for (StackTraceElement f : frames)\n    \
  \        System.out.println(f);\n        int r;\n        if (n <= 1) r = 1;\n  \
  \      else r = n * factorial(n - 1);\n        System.out.println(\"return \" +\
  \ r);\n        return r;\n    }\n\n    public static void main(String[] args)\n\
  \    {\n        Scanner in = new Scanner(System.in);\n        System.out.print(\"\
  Enter n: \");\n        int n = in.nextInt();\n        factorial(n);\n    }\n}\n\
  ```\n\n`java.lang.Throwable` 1.0\n- `Throwable(Throwable cause)` 1.4\n- `Throwable(String\
  \ message, Throwable cause)` 1.4 根据给定的原因构造 `Throwable`。\n- `Throwable initCause(Throwable\
  \ cause)` 1.4 为此对象设置原因，如果此对象已经有了原因，则抛出异常。返回 `this`。\n- `Throwable getCause()` 1.4\
  \ 获取被设置为此对象原因的异常对象，如果没有设置原因，则返回 `null`。\n- `StackTraceElement[] getStackTrace()`\
  \ 1.4 获取此对象构造时调用堆栈的轨迹。\n- `void addSuppressed(Throwable t)` 7 向此异常添加一个“被抑制的”异常。这发生在\
  \ try-with-resources 语句中，其中 `t` 是由 `close` 方法抛出的异常。\n- `Throwable[] getSuppressed()`\
  \ 7 获取此异常的所有“被抑制的”异常。通常情况下，这些是在 try-with-resources 语句中由 `close` 方法抛出的异常。\n\n`java.lang.Exception`\
  \ 0.0\n- `Exception(Throwable cause)` 1.4\n- `Exception(String message, Throwable\
  \ cause)` 1.4 根据给定的原因构造 `Exception`。\n\n`java.lang.RuntimeException` 0.0\n- `RuntimeException(Throwable\
  \ cause)` 1.4\n- `RuntimeException(String message, Throwable cause)` 1.4 根据给定的原因构造\
  \ `RuntimeException`。\n\n`java.lang.StackTraceElement` 1.4\n- `String getFileName()`\
  \ 获取包含该元素执行点的源文件名，如果信息不可用，则返回 `null`。\n- `int getLineNumber()` 获取包含该元素执行点的源文件的行号，如果信息不可用，则返回\
  \ `-1`。\n- `String getClassName()` 获取包含该元素执行点的类的全限定名。\n- `String getMethodName()`\
  \ 获取包含该元素执行点的方法名称。构造函数的名称为 `<init>`。静态初始化器的名称为 `<clinit>`。你无法区分具有相同名称的重载方法。\n- `boolean\
  \ isNativeMethod()` 如果该元素的执行点位于原生方法内部，则返回 `true`。\n- `String toString()` 返回一个包含类名、方法名和行号的格式化字符串（如果可用）。\n\
  \n## 7.3 使用异常的技巧\n\n关于异常的正确使用存在某种争议。一些程序员认为所有检查异常（checked exceptions）都是麻烦，而另一些人似乎觉得抛出的异常还不够。我们认为异常（即使是检查异常）有其用处，并为你提供这些正确使用的技巧。\n\
  \n**1. 异常处理不应该替代简单的测试。**\n作为一个例子，我们写了一些代码，尝试 1,000,000 次从空栈中弹出元素。它首先通过检查栈是否为空来执行。\n\
  ```java\nif (!s.empty()) s.pop();\n```\n接下来，无论如何都强制它弹出栈，然后捕获 `EmptyStackException`，它告诉我们不应该这样做。\n\
  ```java\ntry {\n    s.pop();\n} catch (EmptyStackException e) {\n}\n```\n在我们的测试机器上，调用\
  \ `isEmpty` 的版本运行了 646 毫秒。捕获 `EmptyStackException` 的版本运行了 21,739 毫秒。你可以看到，调用 `isEmpty`\
  \ 的版本比捕获 `EmptyStackException` 快得多。其理是：异常仅应用于异常情况。\n\n**2. 不要微管理异常。**\n许多程序员将每个语句都包裹在独立的\
  \ `try` 块中。点击此处查看代码图像\n```java\nPrintStream out;\nStack s;\nfor (i = 0; i < 100;\
  \ i++) {\n    try {\n        n = s.pop();\n    } catch (EmptyStackException e) {\n\
  \        // 栈为空\n    }\n    try {\n        out.writeInt(n);\n    } catch (IOException\
  \ e) {\n        // 写入文件错误\n    }\n}\n```\n这种方法会让你的代码变得非常糟糕。有必要将*整个任务*包裹在 `try` 块中。如果任何一个操作失败，你就可以放弃该任务。点击此处查看代码图像\n\
  ```java\ntry {\n    for (i = 0; i < 100; i++) {\n        n = s.pop();\n        out.writeInt(n);\n\
  \    }\n} catch (IOException e) {\n    // 写入文件错误\n} catch (EmptyStackException e)\
  \ {\n    // 栈为空\n}\n```\n这段代码看起来整洁得多。它履行了异常处理的承诺：*分离*正常处理与错误处理。\n\n**3. 善用异常层级结构。**\n\
  不要仅仅抛出 `RuntimeException`。找到一个合适的子类或创建你自己的。\n不要仅仅捕获 `Throwable`。这会让你的代码难以阅读和维护。\n\
  尊重检查异常和未检查异常之间的区别。检查异常本质上是负担——不要为逻辑错误抛出它们。（例如，反射库在这里就做错了。调用者经常需要捕获它们永远不会发生的异常。）\n\
  不要犹豫将异常转换为更合适的异常。例如，当从文件中解析整数时，捕获 `NumberFormatException` 并将其转换为 `IOException` 的子类或\
  \ `MySubsystemException`。\n\n**4. 不要抑制异常。**\n在 Java 中，存在抑制异常的巨大诱惑。如果你正在编写一个调用可能每百年抛出一次异常的方法，编译器会抱怨，因为你没有在方法的\
  \ `throws` 列表中声明该异常。你不想将其放入 `throws` 列表中，因为那样编译器会对所有调用你方法的方法抱怨。所以你直接把它堵掉：\n点击此处查看代码图像\n\
  ```java\npublic Image loadImage(String s) {\n    try {\n        // 威胁抛出检查异常的代码\n\
  \    }\n}\n```\n\n\n\n\n```java\ncatch (Exception e) {\n} // so so there\n}\n```\n\
  \n现在你的代码将无缝地通过编译。它将正常运行，除非发生异常。在那种情况下，异常将被静默忽略。如果你认为异常至少是重要的，那么你应该努力正确地处理它们。\n\n\
  ### 5. 当你检测到错误时，“严厉的爱”比“溺爱”更有效。\n\n一些程序员担心在检测到错误时抛出异常。也许当方法带有无效参数被调用时，返回一个占位值比抛出异常更好吗？例如，当栈为空时，`Stack.pop`\
  \ 应该返回 `null` 还是抛出一个异常呢？我们认为，在故障发生点抛出一个 `EmptyStackException`，比在稍后的某个时间发生 `NullPointerException`\
  \ 要好。\n\n### 6. 传播异常并不是耻辱的表现。\n\n许多程序员觉得必须捕获所有抛出的异常。如果他们调用一个会抛出异常的方法，例如 `FileInputStream`\
  \ 构造函数或 `readLine` 方法，他们本能地捕获可能生成的异常。通常，传播异常实际上比捕获它更好：\n\n点击此处查看代码图像\n\n```java\n\
  public void readStuff(String filename) throws IOException // 并不是耻辱的表现！\n\n{\n  \
  \  InputStream in = new FileInputStream(filename);\n    ...\n}\n```\n\n高层方法通常具备更好的能力通知用户错误或放弃未执行的命令。\n\
  \n***\n\n![Image](img/note.jpg) 注意\n\n规则 5 和规则 6 可以总结为“早抛出，晚捕获”。\n\n***\n\n## 7.4\
  \ 使用断言（Assertions）\n\n断言是防御性编程中常用的习惯用法。在接下来的章节中，你将学习如何有效地使用它们。\n\n### 7.4.1 断言的概念\n\
  \n假设你确定某个属性已满足，并且在代码中依赖该属性。例如，你可能正在计算：\n\n```java\ndouble y = Math.sqrt(x);\n```\n\
  \n你确定 `x` 不是负数。也许它是另一个不会产生负结果的计算结果，或者它是一个要求调用者仅提供正数的方法的参数。尽管如此，你仍然希望双检，而不是允许出现混淆的“非数字”（not\
  \ a number）浮点值。\n\n断言机制允许你在测试期间插入检查，并在生产代码中自动移除它们。Java 语言有一个关键字 `assert`。它有两种形式：\n\
  \n`assert condition;`\n\n以及\n\n`assert condition : expression;`\n\n这两条语句都会评估 `condition`，如果为\
  \ `false`，则抛出 `AssertionError`。在第二条语句中，`expression` 会被传递给 `AssertionError` 的构造函数并转换为消息字符串。\n\
  \n***\n\n![Image](img/note.jpg) 注意\n\n`expression` 的唯一目的是产生一个消息字符串。`AssertionError`\
  \ 对象并不存储实际值，因此你无法在之后对其进行查询。正如 JDK 文档以一种“家长式的魅力”描述的那样，这样做“会鼓励程序员尝试从断言失败中恢复，这违背了其初衷”。\n\
  \n要断言 `x` 非负数，你可以简单地使用：\n\n`assert x >= 0;`\n\n或者你可以将 `x` 的实际值传递给 `AssertionError`\
  \ 对象，这样就能显示出来。\n\n`assert x >= 0 : x;`\n\n***\n\n![Image](img/note1.jpg) C++ 注意\n\
  \nC 语言的 `assert` 宏将断言条件转换为字符串，如果断言失败则打印该字符串。例如，如果 `assert(x >= 0)` 失败，它会打印 `\"x\
  \ >= 0\"`。在 Java 中，条件不会自动成为错误报告的一部分。如果你想看到它，必须将其作为字符串传递给 `AssertionError` 对象：`assert\
  \ x >= 0 : \"x >= 0\"`。\n\n***\n\n### 7.4.2 断言的启用与禁用\n\n默认情况下，断言是禁用的。通过带有 `-enableassertions`\
  \ 或 `-ea` 参数运行程序来启用它们：\n\n`java -enableassertions MyApp`\n\n注意，你不需要重新编译程序来启用或禁用断言。断言的启用或禁用是类加载器的功能。当断言被禁用时，类加载器会剥离断言代码，以免影响执行速度。\n\
  \n你甚至可以在特定的类或整个包中开启断言。例如：\n\n点击此处查看代码图像\n\n`java -ea:MyClass -ea:com.company.mylib...\
  \ MyApp`\n\n此命令为类 `MyClass` 以及 `com.company.mylib` 包及其子包中的所有类开启断言。`-ea...` 参数开启默认包中所有类的断言。\n\
  \n你也可以使用 `-disableassertions` 或 `-da` 参数禁用某些类和包的断言：\n\n点击此处查看代码图像\n\n`java -ea:...\
  \ -da:MyClass MyApp`\n\n某些类不是由类加载器加载的，而是由虚拟机直接加载。你可以使用这些开关选择性地启用或禁用这些类中的断言。\n\n\
  然而，启用或禁用所有断言的 `-ea` 和 `-da` 开关不适用于没有类加载器的“系统类”。使用 `-enableassertions/-esa` 参数启用系统类的断言。\n\
  \n还可以通过程序控制类加载器的断言状态。请参本节末尾的 API 注释。\n\n### 7.4.3 使用断言进行参数检查\n\nJava 语言提供了三种处理系统故障的机制：\n\
  \n- 抛出异常\n- 日志（Logging）\n- 使用断言\n\n何时应该选择断言？请记住以下点：\n\n- 断言失败旨在致命的、不可恢复的错误。\n- 断言检查仅在开发和测试期间开启。（这有时被幽默地描述为“在岸边时穿着救生衣，一旦在大海上就将其扔掉”）\n\
  \n因此，你不应该使用断言向程序的其他部分传递可恢复的状态，或向程序用户通信问题。断言应仅用于测试期间定位程序错误。\n\n让我们来看一个常见的场景——方法参数检查。应该使用断言来检查非法值或\
  \ `null` 引用吗？要回答这个问题，你需要查看方法的文档。假设你实现了一个排序方法。\n\n点击此处查看代码图像\n\n```java\n/**\n *\
  \ 对指定的数组范围按升序排序。\n * 排序的范围从 fromIndex（包含）延伸到 toIndex（不包含）。\n * @param a 要排序的数组。\n\
  \ * @param fromIndex 要排序的第一个元素（包含）的索引。\n * @param toIndex 要排序的最后一个元素（不包含）的索引。\n\
  \ * @throws IllegalArgumentException 如果 fromIndex > toIndex\n * @throws ArrayIndexOutOfBoundsException\
  \ 如果 fromIndex < 0 或 toIndex > a.length\n */\nstatic void sort(int[] a, int fromIndex,\
  \ int toIndex)\n```\n\n文档指出，当索引值错误时，方法会抛出异常。这种行为是方法与其调用者之间约的一部分。如果你实现了该方法，就必须遵守该约并抛出指示异常。在这种情况下使用断言是不恰当的。\n\
  \n\n\n\n\n你是否应该断言 `a` 不是 `null` 呢？这也不恰当。方法文档对于 `a` 为 `null` 时方法的行为没有做任何说明。调用者有权假设在这种情况下方法将成功返回，而不会抛出断言错误。\n\
  \n然而，假设方法的契约略有不同：\n\n点击此处查看代码图像\n\n@param a` 待排序的数组（不能为 `null`）。\n\n现在，该方法的调用者收到了通知：使用\
  \ `null` 数组调用该方法是非合法的。那么该方法可以从断言开始：\n\n```\nassert a != null;\n```\n\n计算机科学家将这种契约称为`前置条件`（`precondition`）。原始方法对其参数没有前置条件——它承诺在所有情况下都有定义良好的行为。修改后的方法有一个前置条件：即\
  \ `a` 不为 `null`。如果调用者未能满足前置条件，那么规则将失效，方法可以执行任何它想做的操作。事实上，由于有了断言的存在，该方法在被非法调用时，其行为是相当不可预测的。它有时抛出断言错误，有时又抛出空指针异常，取决于其类加载器如何配置。\n\
  \n### 7.4.4 使用断言记录假设\n\n许多程序员使用注释来记录他们的底层假设。考虑下面这个来自 [`http://docs.oracle.com/javase/6/docs/technotes/guides/language/assert.html`](http://docs.oracle.com/javase/6/docs/technotes/guides/language/assert.html)的示例：\n\
  \n```\nif (i % 3 == 0)\n    ...\nelse if (i % 3 == 1)\n    ...\nelse // (i % 3 ==\
  \ 2)\n    ...\n```\n\n在这种情况下，使用断言代替注释会更有意义。\n\n```\nif (i % 3 == 0)\n    ...\nelse\
  \ if (i % 3 == 1)\n    ...\nelse\n{\n    assert i % 3 == 2;\n    ...\n}\n```\n\n\
  当然，彻底地思考这个问题会更有意义。`i % 3` 的可能值有哪些？如果 `i` 是正数，余数必须是 `0`、`1` 或 `2`。如果 `i` 是负数，那么余数可以是\
  \ `-1` 或 `-2`。因此，真正的假设是 `i` 不是负数。一个更好的断言应该是：\n\n```\nassert i >= 0;\n```\n\n在 `if`\
  \ 语句之前。\n\n无论如何，这个示例展示了将断言作为程序员自检的良好用法。如你所见，断言是测试和调试的战术工具。相比之下，日志是程序整个生命周期的战略工具。我们将在下一节中检查日志。\n\
  \n***\n\n**java.lang.ClassLoader 1.0**\n\n• `void setDefaultAssertionStatus(boolean\
  \ b)` 1.4\n启用或禁用由此类加载器加载的所有没有显式类或包断言状态的类的断言。\n\n• `void setClassAssertionStatus(String\
  \ className, boolean b)` 1.4\n启用或禁用给定类及其内部类的断言。\n\n• `void setPackageAssertionStatus(String\
  \ packageName, boolean b)` 1.4\n启用或禁用给定包及其子包中所有类的类的断言。\n\n• `void clearAssertionStatus()`\
  \ 1.4\n移除所有显式的类和包断言状态设置，并禁用此类加载器加载的所有类的断言。\n\n***\n\n## 7.5 日志\n\n每个 Java 程序员都熟悉在有问题的代码中插入\
  \ `System.out.println` 调用以洞察程序行为的过程。当然，一旦你找到了问题的根源，就会移除打印语句，只在下一个问题出现时又把它们放回来。日志\
  \ API 设计旨在解决这个问题。以下是该 API 的主要优势：\n\n• 很容易抑制所有日志记录，或仅抑制低于特定级别的记录，并且同样容易地重新开启它们。\n\
  • 被抑制的日志开销非常低，因此在应用程序中保留日志代码的代价微乎其微。\n• 日志记录可以定向到不同的处理器——例如在控制台中显示、写入文件等。\n• 日志记录器和处理器都可以过滤记录。过滤器可以使用过滤器实现者提供的任何标准丢弃无趣的日志条目。\n\
  • 日志记录可以用不同的方式进行格式化——例如纯文本或 XML。\n• 应用程序可以使用多个日志记录器，使用分级名称，例如 `com.mycompany.myapp`，类似于包名。\n\
  • 默认情况下，日志配置由配置文件控制。应用程序可以需要替换此机制。\n\n### 7.5.1 基础日志\n\n对于简单的日志记录，使用全局日志记录器并调用其\
  \ `info` 方法：\n\n点击此处查看代码图像\n\n```\nLogger.getGlobal().info(\"File->Open menu item\
  \ selected\");\n```\n\n默认情况下，记录打印如下：\n\n点击此处查看代码图像\n\n```\nMay 10, 2013 10:12:15\
  \ PM LoggingImageViewer fileOpen\nINFO: File->Open menu item selected\n```\n\n但如果你调用：\n\
  \n点击此处查看代码图像\n\n```\nLogger.getGlobal().setLevel(Level.OFF);\n```\n\n现在日志被抑制了。\n\
  \n### 7.5.2 高级日志\n\n既然你已经了“入门级日志”，让我们进入工业级日志。在专业应用程序中，你不想将所有日志都记录到一个日志记录器。相反，你可以定义自己的日志记录器。调用\
  \ `getLogger` 方法来创建或检索日志记录器：\n\n```\nprivate static final Logger myLogger = Logger.getLogger(\"\
  com.mycompany\");\n```\n\n***\n\n**提示**\n\n类似于包，日志记录器名称是分级的。事实上，它们比包更具层次性。包之间没有语义关系，但日志记录器共享某些属性。例如，如果你对\
  \ `com` 设置级别，子日志记录器将继承该级别。\n\n有七种日志级别：\n\n• `SEVERE`\n• `WARNING`\n• `INFO`\n• `CONFIG`\n\
  • `FINE`\n• `FINER`\n• `FINEST`\n\n默认情况下，前三个级别会被记录。你可以设置不同的级别——例如：\n\n```\nlogger.setLevel(Level.FINE);\n\
  ```\n\n现在 `FINE` 及其以上的所有级别都会记录。你也可以使用 `Level.ALL` 开启所有级别的日志，或使用 `Level.OFF` 关闭所有日志。\n\
  \n所有级别都有日志方法，例如：\n\n```\nlogger.warning(message);\nlogger.fine(message);\n```\n\n\
  以此此类推。或者，你可以使用 `log` 方法并提供级别，例如：\n\n点击此处查看代码图像\n\n```\nlogger.log(Level.FINE, message);\n\
  ```\n\n***\n\n**提示**\n\n默认日志配置记录所有级别为 `INFO` 或更高的记录。因此，你应该使用 `CONFIG`、`FINE`、`FINER`\
  \ 和 `FINEST` 级别来记录对诊断有用但对用户没有意义的消息。\n\n***\n\n**注意**\n\n如果将级别设置为比 `INFO` 更细的值，还需要更改日志处理器的配置。默认日志处理器抑制\
  \ `INFO` 以下的消息。详情请见下一节。\n\n***\n\n默认日志记录显示包含日志调用的类和方法名，是从调用栈推断出来的。然而，如果虚拟机对执行进行了优化，准确的调用信息可能不可用。你可以使用\
  \ `logp` 方法提供调用类和方法的精确位置。该方法的签名如下：\n\n```\nvoid logp(Level l, String className,\
  \ String methodName, String message)\n```\n\n\n\n\n\n```java\nvoid entering(String\
  \ className, String methodName)\n\nvoid entering(String className, String methodName,\
  \ Object param)\n\nvoid entering(String className, String methodName, Object[] params)\n\
  \nvoid exiting(String className, String methodName)\n\nvoid exiting(String className,\
  \ String methodName, Object result)\n```\n\n例如：\n\n点击此处查看代码图像\n\n```java\nint read(String\
  \ file, String pattern)\n{\n    logger.entering(\"com.mycompany.mylib.Reader\",\
  \ \"read\",\n        new Object[] { file, pattern });\n    ...\n    logger.exiting(\"\
  com.mycompany.mylib.Reader\", \"read\", count);\n    return count;\n}\n```\n\n这些调用会生成级别为\
  \ `FINER` 的日志记录，并以 `ENTRY` 和 `RETURN` 字符串开头。\n\n***\n\n![Image](img/note.jpg) 注意\n\
  \n在未来的某个时刻，带有 `Object[]` 参数的日志方法将被重写以支持可变参数列表（“varargs”）。那时，你将能够进行诸如 `logger.entering(\"\
  com.mycompany.mylib.Reader\", \"read\", file, pattern)` 这样的调用。\n\n***\n\n日志的一个常见用途是记录意外异常。两个便利方法包括在日志记录中包含异常的描述。\n\
  \n点击此处查看代码图像\n\n```java\nvoid throwing(String className, String methodName, Throwable\
  \ t)\n\nvoid log(Level l, String message, Throwable t)\n```\n\n典型的用法如下：\n\n点击此处查看代码图像\n\
  \n```java\nif (...)\n{\n    IOException exception = new IOException(\"...\");\n\
  \    logger.throwing(\"com.mycompany.mylib.Reader\", \"read\", exception);\n   \
  \ throw exception;\n}\n```\n\n以及\n\n点击此处查看代码图像\n\n```java\ntry\n{\n    ...\n}\n\
  catch (IOException e)\n{\n    Logger.getLogger(\"com.mycompany.myapp\").log(Level.WARNING,\
  \ \"Reading image\", e);\n}\n```\n\n`throwing` 调用会记录一条级别为 `FINER` 的记录，其消息以 `THROW`\
  \ 开头。\n\n### 7.5.3 更改 Log Manager 配置\n\n你可以通过编辑配置文件来更改日志系统的各种属性。默认配置文件位于：\n\n`jre/lib/logging.properties`\n\
  \n要使用另一个文件，请在启动应用程序时将 `java.util.logging.config.file` 属性设置为文件位置：\n\n点击此处查看代码图像\n\
  \n```bash\njava -Djava.util.logging.config.file=configFile MainClass\n```\n\n***\n\
  \n![Image](img/caution.jpg) 注意\n\nlog manager 在 VM 启动期间初始化，在 `main` 执行之前。如果你在 `main`\
