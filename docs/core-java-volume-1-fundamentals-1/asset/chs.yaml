  \ 构建一个哈希集合并添加集合中的所有元素。\n- `HashSet(int initialCapacity)` 构建一个指定容量（桶的数量）的空哈希集合。\n\
  - `HashSet(int initialCapacity, float loadFactor)` 构建一个指定容量和负载因子（一个 `0.0` 到 `1.0`\
  \ 之间的数值，决定了哈希表在达到百分之几满时重新哈希到更大的表中）的空哈希集合。\n\n**java.lang.Object** 1.0\n\n- `int\
  \ hashCode()` 返回此对象的哈希码。哈希码可以是任何整数，正数或负数。`equals` 和 `hashCode` 的定义必须兼容：如果 `x.equals(y)`\
  \ 为 `true`，那么 `x.hashCode()` 必须与 `y.hashCode()` 相同。\n\n### 9.2.4 Tree Sets\n\n`TreeSet`\
  \ 类与哈希集合类似，但增加了一个改进。树形集合是一个排序集合。你可以以任何顺序将元素插入集合中。当你遍历集合时，值将按排序顺序自动呈现。例如，假设你插入了三个字符串，然后访问所有添加的元素：\n\
  \n```java\nSortedSet<String> sorter = new TreeSet<>(); // TreeSet implements SortedSet\n\
  sorter.add(\"Bob\");\nsorter.add(\"Amy\");\nsorter.add(\"Carl\");\nfor (String s\
  \ : sorter) System.out.println(s);\n```\n\n然后，值按排序顺序打印：`Amy Carl`。正如该类的命名所示，排序是通过树结构完成的。（当前实现使用了红黑树。有关红黑树的详细描述，请参见\
  \ Thomas Cormen、Charles Leiserson、Ronald Rivest 等人的《算法导论》。）\n\n如果你不在乎集合中元素的顺序，那么你就可以直接使用\
  \ `HashSet`。\n\n![Image](img/caution.jpg) **注意**\n\n在修改集合元素时要小心。如果元素的哈希值发生变化，该元素将不再位于数据结构中的正确位置。\n\
