  blue-ball.gif\"), Color.BLUE);\n        Action yellowAction = new ColorAction(\"\
  Yellow\", new ImageIcon(\"yellow-ball.gif\"),\n            Color.YELLOW);\n    \
  \    Action redAction = new ColorAction(\"Red\", new ImageIcon(\"red-ball.gif\"\
  ), Color.RED);\n        Action exitAction = new AbstractAction(\"Exit\", new ImageIcon(\"\
  exit.gif\")) {\n            public void actionPerformed(ActionEvent event) {\n \
  \               System.exit(0);\n            }\n        };\n        exitAction.putValue(Action.SHORT_DESCRIPTION,\
  \ \"Exit\");\n\n        // 填充工具栏\n        JToolBar bar = new JToolBar();\n     \
  \   bar.add(blueAction);\n        bar.add(yellowAction);\n        bar.add(redAction);\n\
  \        bar.addSeparator();\n        bar.add(exitAction);\n        add(bar, BorderLayout.NORTH);\n\
