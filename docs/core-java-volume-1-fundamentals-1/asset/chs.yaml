  \ : sorter) System.out.println(s);\n```\n\n然后，值按排序顺序打印：`Amy Carl`。正如该类的命名所示，排序是通过树结构完成的。（当前实现使用了红黑树。有关红黑树的详细描述，请参见\
  \ Thomas Cormen、Charles Leiserson、Ronald Rivest 等人的《算法导论》。）\n\n本节末尾的示例程序（Listing\
  \ 9.2）从 `System.in` 读取单词，将它们添加到集合中，最后打印出集合中的前二十个单词。例如，你可以通过命令行壳启动程序，并将《爱丽丝仙游》文本（你可以从\
  \ [`www.gutenberg.org`](http://www.gutenberg.org) 获取）输入程序：\n\n```bash\njava SetTest\
  \ < alice30.txt\n```\n\n程序从输入中读取所有单词并将其添加到哈希集合中。它然后遍历集合中的唯一单词，最后打印出计数。（《爱丽丝仙游记》共有\
  \ 5,909 个唯一单词，包括开头的版权声明。）单词以随机顺序出现。\n\n![Image](img/caution.jpg) **注意**\n\n在修改集合元素时要小心。如果元素的哈希值发生变化，该元素将不再位于数据结构中的正确位置。\n\
