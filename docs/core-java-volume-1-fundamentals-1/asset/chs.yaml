  \ emptyNavigableMap()`\n* `static <T> Enumeration<T> emptyEnumeration()`\n* `static\
  \ <T> Iterator<T> emptyIterator()`\n* `static <T> ListIterator<T> emptyListIterator()`\n\
  \n返回一个空的集合、映射或迭代器。\n\n***\n\n### java.util.Arrays 1.2\n\n* `static <E> List<E> asList(E...\
  \ array)`\n\n返回数组中元素的列表视图，该视图是可以修改的但不可调整大小。\n\n***\n\n### java.util.List<E> 1.2\n\
  \n* `List<E> subList(int firstIncluded, int firstExcluded)`\n\n返回位置范围内元素的列表视图。\n\
  \n***\n\n### java.util.SortedSet<E> 1.2\n\n* `SortedSet<E> subSet(E firstIncluded,\
  \ E firstExcluded)`\n* `SortedSet<E> headSet(E firstExcluded)`\n* `SortedSet<E>\
  \ tailSet(E firstIncluded)`\n\n返回一个范围内元素的视图。\n\n***\n\n### java.util.NavigableSet<E>\
  \ 6\n\n* `NavigableSet<E> subSet(E from, boolean fromIncluded, E to, boolean toIncluded)`\n\
  * `NavigableSet<E> headSet(E to, boolean toIncluded)`\n* `NavigableSet<E> tailSet(E\
  \ from, boolean fromIncluded)`\n\n返回一个范围内元素的视图。`boolean` 标志决定边界是否包含在视图中。\n\n***\n\
  \n### java.util.SortedMap<K, V> 1.2\n\n* `SortedMap<K, V> subMap(K firstIncluded,\
  \ K firstExcluded)`\n* `SortedMap<K, V> headMap(K firstExcluded)`\n* `SortedMap<K,\
  \ V> tailMap(K firstIncluded)`\n\n返回键在范围内的条目的映射视图。\n\n***\n\n### java.util.NavigableMap<K,\
  \ V> 6\n\n* `NavigableMap<K, V> subMap(K from, boolean fromIncluded, K to, boolean\
  \ toIncluded)`\n* `NavigableMap<K, V> headMap(K from, boolean fromIncluded)`\n*\
  \ `NavigableMap<K, V> tailMap(K to, boolean toIncluded)`\n\n返回键在范围内的条目的映射视图。`boolean`\
  \ 标志决定边界是否包含在视图中。\n\n***\n\n## 9.5 算法\n\n泛型集合接口有一个巨大的优势——你只需要实现一次算法。例如，考虑一个计算集合中最大元素的简单算法。传统上，程序员会用循环来实现此类算法。以下是你可以找到数组中最大元素的方法。\n\
  \n点击此处查看代码图片\n\n```\nif (a.length == 0) throw new NoSuchElementException();\n\n\
  T largest = a[0];\n\nfor (int i = 1; i < a.length; i++)\n    if (largest.compareTo(a[i])\
  \ < 0)\n        largest = a[i];\n```\n\n当然，要找到数组列表（ArrayList）的最大值，你写的代码略有不同。\n\n\
  点击此处查看代码图片\n\n```java\nif (v.size() == 0) throw new NoSuchElementException();\n\n\
  T largest = v.get(0);\n\nfor (int i = 1; i < v.size(); i++)\n    if (largest.compareTo(v.get(i))\
  \ < 0)\n        largest = v.get(i);\n```\n\n链表呢？在链表中你无法高效的随机访问，但你可以使用迭代器。\n\n点击此处查看代码图片\n\
  \n```java\nif (l.isEmpty()) throw new NoSuchElementException();\n\nIterator<T> iter\
  \ = l.iterator();\n\nT largest = iter.next();\n\nwhile (iter.hasNext())\n{\n   \
  \ T next = iter.next();\n    if (largest.compareTo(next) < 0)\n        largest =\
  \ next;\n}\n```\n\n这些循环写起来非常冗燥，而且容易出错。是否存在差一错误（off-by-one error）？循环对于空容器是否工作正常？对于只有一个元素的容器又如何？你不想每次都测试和调试这些代码，但你也不想实现一大堆方法，例如这些：\n\
  \n点击此处查看代码图片\n\n```java\nstatic <T extends Comparable> T max(T[] a)\nstatic <T extends\
  \ Comparable> T max(ArrayList<T> v)\nstatic <T extends Comparable> T max(LinkedList<T>\
  \ l)\n```\n\n这就是泛型接口的用处。你只需要编写一次算法，就可以应用于任何实现了该接口的集合。事实上，Java 标准库已经包含了许多有用的算法，如排序、二分查找和一些工具。\n\
  \n#### 9.5.1 排序与洗牌\n\n老程序员有时会怀念他们过去如何使用打孔卡并手动编写排序算法。如今，排序算法是大多数编程语言标准库的一部分，Java\
  \ 也不例外。\n\n`Collections` 类中的 `sort` 方法对实现了 `List` 接口的集合。点击此处查看代码图片\n\n```java\n\
  List<String> staff = new LinkedList<>();\n\n填充集合\nCollections.sort(staff);\n```\n\
  \n该方法假设列表元素实现了 `Comparable` 接口。如果你想以其他方式排序列表，可以使用 `List` 接口的 `sort` 方法并传入一个 `Comparator`\
  \ 对象。以下是如何按薪资对员工列表排序：\n\n点击此处查看代码图片\n\n```java\nstaff.sort(Comparator.comparingDouble(Employee::getSalary));\n\
  ```\n\n如果你想以*降序*排序列表，请使用静态便利方法 `Comparator.reverseOrder()`。它返回一个返回 `b.compareTo(a)`\
  \ 的比较器。例如，\n\n点击此处查看代码图片\n\n```java\nstaff.sort(Comparator.reverseOrder());\n```\n\
  \n将 `staff` 列表中的元素按反序排序，取决于元素类型 `compareTo` 方法给定的顺序。同样地，\n\n```java\nstaff.sort(Comparator.comparingDouble(Employee::getSalary).reversed());\n\
  ```\n\n按薪资降序排序。\n\n你可能好奇 `sort` 方法是如何排序列表的。通常，当你从算法书中看到排序算法时，它是针对数组演示的并使用了随机元素访问。然而，链表的随机访问是低效的。实际上，你可以使用归并排序的形式高效地排序链表。但是，Java\
  \ 编程语言的实现并没有这样做。它简单地将所有元素倒进数组中，排序数组，然后将排序后的序列复制回列表。\n\n\n\n\n`collections` 库中使用的排序算法比\
  \ `QuickSort` 慢一点，后者是通用排序算法的传统选择。然而，它有一个巨大的优势：它是**稳定的**（stable），也就是说，它不会交换相等元素。你为什么要关心相等元素的顺序呢？这里有一个常见的场景。假设你有一个已经按姓名排序的员工列表。现在你按薪水进行排序。薪水相同的员工会发生什么变化？使用稳定排序，按姓名的顺序会被保留。换句话说，结果是一个先按薪水排序、再按姓名排序的列表。\n\
  \n`Collections` 不需要实现它们所有的“可选”方法，因此所有接收集合参数的方法都必须描述何时将集合传递给算法是安全的。例如，你显然不能将 `unmodifiableList`\
  \ 列表传递给 `sort` 算法。你 `可以` 传递什么类型的列表？根据文档，该列表必须是可修改的，但不需要是可以调整大小的。\n\n术语定义如下：\n\n\
  - 如果列表支持 `set` 方法，则该列表是可修改的 (`modifiable`)。\n- 如果列表支持 `add` 和 `remove` 操作，则该列表是可调整大小的\
  \ (`resizable`)。\n\n`Collections` 类有一个算法 `shuffle`，它的作用与排序恰相反——它会随机打乱列表中元素的顺序。例如：\n\
  \n```java\nArrayList<Card> cards = . . .;\nCollections.shuffle(cards);\n```\n\n\
  如果你提供的列表没有实现 `RandomAccess` 接口，`shuffle` 方法会将元素复制到数组中，打乱数组，然后将打乱后的元素复制回列表。\n\n列表\
  \ 9.7 中的程序向一个数组列表填充了 49 个包含数字 1 到 49 的 `Integer` 对象。然后它随机打乱列表，并从打乱后的列表中选取前六个值。最后，它对选定的值进行排序并打印它们。\n\
  \n**列表 9.7** `shuffle/ShuffleTest.java`\n\n点击此处查看代码图像\n\n```java\npackage shuffle;\n\
  \nimport java.util.*;\n\n/**\n * 此程序演示了随机洗牌和排序算法。\n * @version 1.11 2012-01-26\n\
  \ * @author Cay Horstmann\n */\npublic class ShuffleTest {\n    public static void\
  \ main(String[] args) {\n        List<Integer> numbers = new ArrayList<>();\n  \
  \      for (int i = 1; i <= 49; i++)\n            numbers.add(i);\n        Collections.shuffle(numbers);\n\
  \        List<Integer> winningCombination = numbers.subList(0, 6);\n        Collections.sort(winningCombination);\n\
  \        System.out.println(winningCombination);\n    }\n}\n```\n\n### java.util.Collections\
  \ **1.2**\n\n- `static <T extends Comparable<? super T>> void sort(List<T> elements)`\n\
  \  使用稳定排序算法对列表中的元素。该算法保证运行在 `O(n log n)` 时间内，其中 `n` 是列表的长度。\n- `static void shuffle(List<?>\
  \ elements)`\n- `static void shuffle(List<?> elements, Random r)`\n  随机打乱列表中的元素。该算法运行在\
  \ `O(n a(n))` 时间内，其中 `n` 是列表的长度，`a(n)` 是访问元素的平均时间。\n\n### java.util.List<E> **1.2**\n\
  \n- `default void sort(Comparator<? super T> comparator)`\n  使用给定的比较器对此列表排序。\n\n\
  ### java.util.Comparator<T> **1.2**\n\n- `static <T extends Comparable<? super T>>\
  \ Comparator<T> reverseOrder()`\n  产生一个反转 `Comparable` 接口提供的顺序的比较器。\n- `default\
  \ Comparator<T> reversed()`\n  产生一个反转此比较器提供的顺序的比较器。\n\n#### 9.5.2 二分查找\n\n要在数组中查找对象，你通常会访问所有元素直到找到匹配项。然而，如果数组是排序的，你可以查看中间元素，并检查它是否大于你试图查找的元素。如果是，继续在数组的前半部分查找；否则，在后半部分查找。这使得问题减半，你以同样的方式继续。例如，如果数组有\
  \ 1024 个元素，你将在 10 步后定位匹配项（或确认不存在），而线性搜索如果元素存在，则平均需要 512 步，确认不存在则需要 1024 步。\n\n`Collections`\
  \ 类的 `binarySearch` 实现了这种算法。注意，集合必须已经排序，否则算法将返回错误答案。要查找元素，请提供集合（必须实现 `List` 接口——更多信息见下文）和要定位的元素。如果集合不是按\
  \ `Comparable` 接口的 `compareTo` 元素排序的，请提供一个比较器对象。\n\n点击此处查看代码图像\n\n```java\ni = Collections.binarySearch(c,\
  \ element);\ni = Collections.binarySearch(c, element, comparator);\n```\n\n`binarySearch`\
  \ 的非负返回值表示元素的索引。如果值为负数，则 `i` 表示没有匹配的元素。在这种情况下，键应该插入在 `-i - 1` 处。\n\n### java.util.Collections\
  \ **1.2**\n\n- `static <T extends Comparable<? super T>> int binarySearch(List<T>\
  \ elements, T key)`\n- `static <T> int binarySearch(List<T> elements, T key, Comparator<?\
  \ super T> c)`\n  在排序的列表中查找键。如果元素类型实现了 `RandomAccess` 接口，则使用线性搜索，在所有其他情况下使用二分查找。这些方法保证运行在\
  \ `O(a(n) log n)` 时间内，其中 `n` 是列表的长度，`a(n)` 是访问元素的平均时间。方法返回键在列表中的索引，如果键不在列表中，则返回负值\
  \ `i`。在这种情况下，键应该插入在 `-i - 1` 处。\n\n### 9.5.3 简单算法\n\n`Collections` 类包含了一些简单实用的算法。其中包括本节开头的示例——找到集合的最大值。其他的包括从一个列表复制元素到另一个列表、用常量填充容器以及反转列表。\n\
  \n为什么要在标准库中提供这些简单的算法？大多数程序员都可以轻松地用循环实现它们。我们喜欢这些算法，是因为它们为*阅读*代码的程序员提供了便利。当你阅读别人实现的循环时，你必须破解原始程序员的意图。例如，看这个循环：\n\
  \n点击此处查看代码图像\n\n```java\nfor (int i = 0; i < words.size(); i++)\n    if (words.get(i).equals(\"\
  C++\")) words.set(i, \"Java\");\n```\n\n现在将该循环与调用对比\n\n点击此处查看代码图像\n\n```java\nCollections.replaceAll(\"\
  C++\", \"Java\");\n```\n\n当你看到方法调用时，立刻知道代码在做什么。\n\n本节末的 API 注释描述了 `Collections`\
  \ 类中的简单算法。\n\n\n\nJava 8 增加了默认方法 `Collection.removeIf` 和 `List.replaceAll`，它们稍微复杂一点。你提供一个\
  \ lambda 表达式来测试或转换元素。例如，在这里我们移除了所有短单词，并将剩余单词转换为小写：\n\n点击此处查看代码图像\n\n```java\nwords.removeIf(w\
  \ -> w.length() <= 3);\nwords.replaceAll(String::toLowerCase);\n```\n\n* * *\n\n\
  ### `java.util.Collections` `1.2`\n\n• `static <T extends Comparable<? super T>>\
  \ T min(Collection<T> elements)`\n• `static <T extends Comparable<? super T>> T\
  \ max(Collection<T> elements)`\n• `static <T> min(Collection<T> elements, Comparator<?\
  \ super T> c)`\n• `static <T> max(Collection<T> elements, Comparator<? super T>\
  \ c)`\n返回集合中最小或最大的元素。（参数边界为了清晰起见进行了简化。）\n\n• `static <T> void copy(List<? super\
  \ T> to, List<T> from)`\n将源列表的所有元素复制到目标列表的相同位置。目标列表必须与源列表一样长。\n\n• `static <T> void\
  \ fill(List<?> l, T value)`\n将列表的所有位置设置为相同的值。\n\n• `static <T> boolean addAll(Collection<?\
  \ super T> c, T... values)` `5.0`\n将所有值添加到指定的集合，如果集合发生变化，则返回 `true`。\n\n• `static\
  \ <T> boolean replaceAll(List<T> l, T oldValue, T newValue)` `1.4`\n将所有等于 `oldValue`\
  \ 的元素替换为 `newValue`。\n\n• `static int indexOfSubList(List<?> l, List<?> s)` `1.4`\n\
  • `static int lastIndexOfSubList(List<?> l, List<?> s)` `1.4`\n返回 `l` 中第一个或最后一个等于\
  \ `s` 的子列表索引；如果 `l` 没有子列表等于 `s`，则返回 -1。例如，如果 `l` 是 `[s, t, a, r]` 且 `s` 是 `[t, a,\
  \ r]`，则两个方法都返回索引 1。\n\n• `static void swap(List<?> l, int i, int j)` `1.4`\n交换给定偏移处的元素。\n\
  \n• `static void reverse(List<?> l)`\n反转列表元素的顺序。例如，反转列表 `[t, a, r]` 会得到列表 `[r, a,\
  \ t]`。该方法的运行时间为 O(*n*)，其中 *n* 是列表的长度。\n\n• `static void rotate(List<?> l, int d)`\
  \ `1.4`\n旋转列表中的元素，将索引为 `i` 的项移动到位置 `(i + d) % l.size()`。例如，旋转列表 `[t, a, r]` 2 位会得到列表\
  \ `[a, r, t]`。该方法的运行时间为 O(*n*)，其中 *n* 是列表的长度。\n\n• `static int frequency(Collection<?>\
  \ c, Object o)` `5.0`\n返回 `c` 中等于对象 `o` 的元素计数。\n\n• `boolean disjoint(Collection<?>\
  \ c1, Collection<?> c2)` `5.0`\n如果集合之间没有共同元素，则返回 `true`。\n\n* * *\n\n### `java.util.Collection<T>`\
  \ `1.2`\n\n• `default boolean removeIf(Predicate<? super E> filter)` 8\n移除所有匹配的元素。\n\
  \n* * *\n\n### `java.util.List<E>` `1.2`\n\n• `default void replaceAll(UnaryOperator<E>\
  \ op)` 8\n将该操作应用于此列表的所有元素。\n\n#### 9.5.4 批量操作 (Bulk Operations)\n\n有几种操作可以“批量”复制或移除元素。调用\n\
  \n```java\ncoll1.removeAll(coll2);\n```\n移除 `coll1` 中存在于 `coll2` 的所有元素。相反，\n\n```java\n\
  coll1.retainAll(coll2);\n```\n移除 `coll1` 中不在 `coll2` 中的所有元素。这是一个典型的应用。假设你想找到两个集的交集——即两个集合共同拥有的元素。首先，创建一个集合来存储结果。\n\
  \n点击此处查看代码图像\n\n```java\nSet<String> result = new HashSet<>(a);\n```\n这里，我们利用了每个集合都有一个参数为另一个集合的构造函数。现在，使用\
  \ `retainAll` 方法：\n\n```java\nresult.retainAll(b);\n```\n它保留了所有恰好在 `b` 中的元素。你在没有编写循环的情况下形成了交集。\n\
  \n你可以进一步扩展这个想法，对视图（view）应用批量操作。例如，假设你有一个将员工 ID 映射到员工对象的 map，你有一个待离职员工 ID 的集合。\n\n\
  点击此处查看代码图像\n\n```java\nMap<String, Employee> staffMap = . . ++;\nSet<String> terminatedIDs\
  \ = . . ++;\n```\n简单地形成键集并移除所有离职员工的 ID。\n\n点击此处查看代码图像\n\n```java\nstaffMap.keySet().removeAll(terminatedIDs);\n\
  ```\n由于键集是一个视图，元素从 map 中移除。\n\n#### 9.5.5 集合与数组之间的转换\n\nJava API 的大部分内容是在集合框架出现之前设计的。因此，你有时需要在数组和集合之间进行转换。\n\
  \n如果你有一个数组需要转换为集合，`Arrays.asList` 可以满足此目的。例如：\n\n```java\nString[] values = ...;\n\
  List<String> staff = new ArrayList<>(Arrays.asList(values));\n```\n\n从集合获取数组稍微复杂一些。当然，你可以使用\
  \ `toArray` 方法：\n\n```java\nObject[] values = staff.toArray();\n```\n但 `toArray()`\
  \ 返回的结果是 `Object[]`。即使你知道集合包含特定类型的对象，你不能直接进行强制转换：\n\n```java\nString[] values =\
  \ (String[]) staff.toArray(); // 错误！\n```\n`toArray` 返回的数组是 `Object[]` 创建的，你无法更改它的类型。相反，使用\
  \ `toArray` 的变体并给它一个长度为 0 的所需类型数组。\n\n```java\nString[] values = staff.toArray(new\
  \ String[0]);\n```\n返回的数组随后按相同类型创建。\n\n* * *\n\n![图像](img/note.jpg) 注意\n\n你可能会疑惑为什么不能简单地将一个\
  \ `Class` 对象（例如 `String.class`）传递给 `toArray` 方法。然而，该方法承担了双重职责——既可以填充现有数组（只要长度足够），也可以创建一个新数组。\n\
  \n* * *\n\n### 9.5.6 编写自己的算法\n\n如果你编写自己的算法（或者说，任何以集合作为参数的方法），应尽可能与接口工作，而不是具体实现。例如，假设你想用一组项填充\
  \ `JMenu`。在传统上，这种方法可能是这样实现的：\n\n点击此处查看代码图像\n\n```java\nvoid fillMenu(JMenu menu,\
  \ ArrayList<JMenuItem> items)\n{\n    for (JMenuItem item : items)\n        menu.add(item);\n\
  }\n```\n然而，现在限制了调用者——调用者必须提供 `ArrayList`。如果选择恰好在另一个容器中，它们首先需要重新包装。最好接受更通用的集合。\n\n\
  你应该问自己：能够完成工作的最通用接口是什么？在这种情况下，你只需要访问所有元素的能力。这是你如何重写 `fillMenu` 以接受任意类型的集合：\n\n\n\
  \n\n点击此处查看代码图像\n\n```java\nvoid fillMenu(JMenu menu, Collection<JMenuItem> items)\n\
  {\n    for (JMenuItem item : items)\n        menu.add(item);\n}\n```\n\n现在，任何人都可以使用\
  \ `ArrayList` 或 `LinkedList` 调用此方法，甚至可以使用用 `Arrays.asList` 包装的数组。\n\n* *\n\n![图像](img/note.jpg)\
  \ 备注\n\n如果使用集合接口作为方法参数是一个这么好的主意，为什么 Java 库没有更频繁地遵循这一规则呢？例如，`JComboBox` 类有两个构造函数：\n\
  \n```java\nJComboBox(Object[] items)\nJComboBox(Vector<?> items)\n```\n\n其原因仅仅是时机问题。Swing\
  \ 库是在集合库出现之前创建的。\n\n* *\n\n如果你编写了一个*返回集合*的方法，你可能也想返回一个接口而不是类，因为你以后可以改变主意，稍后用不同的集合重新实现该方法。\n\
  \n例如，让我们写一个 `getAllItems` 方法，返回菜单的所有项。\n\n点击此处查看代码图像\n\n```java\nList<JMenuItem>\
  \ getAllItems(JMenu menu)\n{\n    List<JMenuItem> items = new ArrayList<>()\n  \
  \  for (int i = 0; i < menu.getItemCount(); i++)\n        items.add(menu.getItem(i));\n\
  \    return items;\n}\n```\n\n后期，你可能决定不想*复制这些项*，而是仅仅提供它们的一个视图。你可以通过返回一个 `AbstractList`\
  \ 的匿名子类来实现这一点。\n\n点击此处查看代码图像\n\n```java\nList<JMenuItem> getAllItems(final JMenu\
  \ menu)\n{\n    return new\n        AbstractList<>()\n        {\n            public\
  \ JMenuItem get(int i)\n            {\n                return menu.getItem(i);\n\
  \            }\n            public int size()\n            {\n                return\
  \ menu.getItemCount();\n            }\n    };\n}\n```\n\n当然，这是一种高级技术。如果你使用了它，请务必准确地记录支持哪些“可选”操作。在这种情况下，你必须告知调用者返回的对象是一个不可修改的列表。\n\
  \n### 9.6 遗留集合\n\n自 Java 最初发布以来，在集合框架出现之前，就已经存在许多“遗留”容器类。\n\n它们已经集成到集合框架中——参见图 9.12。我们将在后续章节中简要介绍它们。\n\
  \n![图像](img/09fig12.jpg)\n\n**图 9.12** 集合框架中的遗留类\n\n#### 9.6.1 Hashtable 类\n\n经典的\
  \ `Hashtable` 类与 `HashMap` 类的作用相同，并且本质上具有相同的接口。就像 `Vector` 类的方法一样，`Hashtable` 的方法是同步的。如果你不需要与遗留代码兼容，应该使用\
  \ `HashMap`。如果你需要并发访问，请使用 `ConcurrentHashMap`——参见第 14 章。\n\n#### 9.6.2 Enumerations（枚举迭代器）\n\
  \n遗留集合使用 `Enumeration` 接口来遍历元素序列。`Enumeration` 接口有两个方法：`hasMoreElements` 和 `nextElement`。这些与\
  \ `Iterator` 接口的 `hasNext` 和 `next` 方法完全对应。\n\n例如，`Hashtable` 类的 `elements` 方法会产生一个用于枚举表中值的枚举对象：\n\
  \n点击此处查看代码图像\n\n```java\nEnumeration<Employee> e = staff.elements();\nwhile (e.hasMoreElements())\n\
  {\n    Employee e = e.nextElement();\n    ...\n}\n```\n\n你偶尔会遇到一个期望 `enumeration`\
  \ 参数的遗留方法。静态方法 `Collections.enumeration` 会产生一个用于枚举集合中元素的枚举对象。例如：\n\n点击此处查看代码图像\n\
  \n```java\nList<InputStream> streams = ...;\nSequenceInputStream in = new SequenceInputStream(Collections.enumeration(streams));\n\
  // SequenceInputStream 构造函数期望一个 enumeration\n```\n\n* *\n\n![图像](img/note.jpg) 备注\n\
