  \ GUI 来收集用户输入。然而，编写这样的界面所需的工具和技术比我们目前拥有的要多。我们的首要任务是更熟悉 Java 编程语言，因此我们目前先使用简单的控制台进行输入和输出。GUI\
  \ 编程将在第 10 章 到第 12 章介绍。\n\n### 3.7.1 读取输入\n\n你已经看到，只需调用 `System.out.println` 就可以向“标准输出流”（即控制台窗口）打印输出。从“标准输入流”\
  \ `System.in` 读取内容并没有那么简单。要读取控制台输入，你首先需要构造连接到 `System.in` 的 `Scanner`：\n\n点击查看代码图片\n\
  \n```\nScanner in = new Scanner(System.in);\n```\n\n（我们将在第 4 章中详细讨论构造函数和 `new` 运算符。）\n\
  \n现在你可以使用 `Scanner` 类的各种方法来读取输入。例如，`nextLine` 方法读取一行输入。\n\n点击查看代码图片\n\n```\nSystem.out.print(\"\
  What is your name? \");\nString name = in.nextLine();\n```\n\n在这里，我们使用 `nextLine`\
  \ 方法是因为输入可能包含空格。要读取单个单词（由空白分隔），请调用：\n\n```\nString firstName = in.next();\n```\n\
