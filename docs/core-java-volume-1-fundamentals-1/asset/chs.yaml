  \ 5.13 `reflection/ReflectionTest.java`\n\n点击此处查看代码图像\n\n***\n\n```java\npackage\
  \ reflection;\n\nimport java.util.*;\nimport java.lang.reflect.*;\n\n/**\n * 此程序使用反射来打印类的所有特征。\n\
  \ * @version 1.1 2004-02-21\n * @author Cay Horstmann\n */\npublic class ReflectionTest\n\
  {\n    public static void main(String[] args)\n    {\n        // 从命令行参数或用户输入读取类名\n\
