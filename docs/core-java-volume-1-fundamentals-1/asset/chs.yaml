  \        setJMenuBar(menuBar);\n\n        JMenuItem openItem = fileMenu.add(\"Open\"\
  );\n        openItem.addActionListener(event -> open());\n        JMenuItem saveItem\
  \ = fileMenu.add(\"Save\");\n        saveItem.addActionListener(event -> save());\n\
  \n        pack();\n    }\n\n    /**\n     * Gets the title from the persistent store\
  \ or asks the user for the title if there is no prior\n     * entry.\n     */\n\
  \    public void setTitle()\n    {\n        try\n        {\n            String title\
  \ = null;\n\n            BasicService basic = (BasicService) ServiceManager.lookup(\"\
  javax.jnlp.BasicService\");\n            URL codeBase = basic.getCodeBase();\n\n\
  \            PersistenceService service = (PersistenceService) ServiceManager\n\
  \                .lookup(\"javax.jnlp.PersistenceService\");\n            URL key\
  \ = new URL(codeBase, \"title\");\n\n            try\n            {\n          \
  \      FileContents contents = service.get(key);\n                InputStream in\
  \ = contents.getInputStream();\n                BufferedReader reader = new BufferedReader(new\
  \ InputStreamReader(in));\n                title = reader.readLine();\n        \
  \    }\n            catch (FileNotFoundException e)\n            {\n           \
  \     title = JOptionPane.InputDialog(\"Please supply a frame title:\");\n     \
  \           if (title == null) return;\n\n                service.create(key, 100);\n\
  \                FileContents contents = service.get(key);\n                OutputStream\
  \ out = contents.getOutputStream(true);\n                PrintStream printOut =\
  \ new PrintStream(out);\n                printOut.print(title);\n            }\n\
  \            setTitle(title);\n        }\n        catch (UnavailableServiceException\
  \ | IOException e)\n        {\n            JOptionPane.showMessageDialog(this, e);\n\
  \        }\n    }\n\n    /**\n     * Opens a history file and updates the display.\n\
  \     */\n    public void open()\n    {\n        try\n        {\n            FileOpenService\
  \ service = (FileOpenService) ServiceManager\n                .lookup(\"javax.jnlp.FileOpenService\"\
  );\n            FileContents contents = service.openFileDialog(\".\", new String[]\
  \ { \"txt\" });\n\n            JOptionPane.showMessageDialog(this, contents.getName());\n\
  \            if (contents != null)\n            {\n                InputStream in\
  \ = contents.getInputStream();\n                BufferedReader reader = new BufferedReader(new\
  \ InputStreamReader(in));\n                String line;\n                while ((line\
  \ = reader.readLine()) != null)\n                {\n                    panel.append(line);\n\
  \                    panel.append(\"\\n\");\n                }\n            }\n\
  \        }\n        catch (UnavailableServiceException e)\n        {\n         \
