  Color\");\nmenu.add(yellowAction);\nmenu.add(blueAction);\nmenu.add(redAction);\n\
  menu.add(exitAction);\nJMenuBar menuBar = new JMenuBar();\nmenuBar.add(menu);\n\
  setJMenuBar(menuBar);\n}\n\n/**\n * 颜色动作将框架的背景设置为给定的颜色。\n */\nclass ColorAction\
