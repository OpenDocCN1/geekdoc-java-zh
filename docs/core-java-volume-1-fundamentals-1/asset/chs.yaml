  \nActually, here is the translation of the provided text:\n\n[content]\nGeneric\
  \ classes constitute the most significant change in the Java programming language\
  \ since the 1.0 release. The addition of generics to Java SE 5.0 was the result\
  \ of one of the first Java Specification Requests, `JSR 14`, that was formulated\
  \ in 1999. The expert group spent about five years on specifications and test implementations.\n\
  \nGeneric classes are desirable because they let you write code that is safer and\
  \ easier to read.\n\n1. With Feynman's skills, you can understand the knowledge\
  \ points in depth in just `20 min`, and it is memorable and *hard to forget*.\n\n\
  ```\nif (condVar > someVal) {console.log(\"xxx\")}\n```\n\nGeneric classes are—at\
  \ least on the surface—similar to templates in C++. In C++, as in Java, templates\
  \ were first added to the language to support strongly typed collections. However,\
  \ over the years, many other uses were discovered. After reading this chapter, you\
  \ may find novel uses for Java generics in your programs.\n\n### 8.1 Why Generic\
  \ Programming?\n\n`generic programming` means writing code that can be reused for\
  \ objects of many different types. For example, you don’t want to program separate\
  \ classes to collect `String` and `File` objects. And you don’t have to—the single\
  \ class `ArrayList` collects objects of any class. This is one example of generic\
  \ programming.\n\nActually, Java had an `ArrayList` class before it had generic\
  \ classes. Let us investigate how the mechanism for generic programming has evolved,\
  \ and what that means for users and implementors.\n\n#### 8.1.1 The Advantage of\
  \ Type Parameters\n\nBefore generic classes were added to Java, generic programming\
  \ was achieved with `inheritance`. The `ArrayList` class simply maintained an array\
  \ of `Object` references:\n\nClick here to view code image\n\n```java\npublic class\
  \ ArrayList // before generic classes\n{\n   private Object[] elementData;\n   .\
  \ . .\n   public Object get(int i) { . . . }\n   public void add(Object o) { . .\
  \ . }\n}\n```\n\nThis approach has two problems. A cast is necessary whenever you\
  \ retrieve a value:\n\nClick here to view code image\n\n```java\nArrayList files\
  \ = new ArrayList();\n. . .\nString filename = (String) files.get(0);\n```\n\nMoreover,\
  \ there is no error checking. You can add values of any class:\n\n```java\nfiles.add(new\
  \ File(\". . .\"));\n```\n\nThis call compiles and runs without error. Elsewhere,\
  \ casting the result of `get` to a `String` will cause an error.\n\nGenerics offer\
  \ a better solution: `type parameters`. The `ArrayList` class now has a type parameter\
  \ that indicates the element type:\n\nClick here to view code image\n\n```java\n\
  ArrayList<String> files = new ArrayList<String>();\n```\n\nThis makes your code\
  \ easier to read. You can tell right away that this particular array list contains\
  \ `String` objects.\n\n***\n\n![Image](img/note.jpg) Note\n\nAs we already mentioned,\
  \ in Java SE 7 and beyond, you can omit the generic type in the constructor:\n\n\
  Click here to view code image\n\n```java\nArrayList<String> files = new ArrayList<>();\n\
  ```\n\nThe omitted type is inferred from the type of the variable.\n\n***\n\nThe\
  \ compiler can make good use of the type information too. No cast is required for\
  \ calling `get`. The compiler knows that the return type is `String`, not `Object`:\n\
  \nClick here to view code image\n\n```java\nString filename = files.get(0);\n```\n\
  \nThe compiler also knows that the `add` method of an `ArrayList<String>` has a\
  \ parameter of type `String`. That is a lot safer than having an `Object` parameter.\
  \ Now the compiler can check that you don’t add incorrect types.\n\n\n\n\n![Image](img/note.jpg)\
  \ 笔记\n\n使用大写字母表示类型变量并保持简短是一种常见做法。Java 库使用变量 `E` 表示集合的元素类型，使用 `K` 和 `V` 表示表格的键和值类型，并使用\
  \ `T`（以及必要的相邻字母 `U` 和 `S`）表示“任意类型”。\n\n***\n\n你通过为类型变量替换具体类型来`实例化`泛型类型，例如：\n\n`Pair<String>`\n\
  \n你可以将结果认为是一个具有构造函数的普通类：\n\n`Pair<String>()`\n\n`Pair<String>(String, String)`\n\
  \n以及方法：\n\n`String getFirst()`\n\n`String getSecond()`\n\n`void setFirst(String)`\n\
  \n`void setSecond(String)`\n\n换句话说，泛型类充当普通类的工厂。\n\n列表 8.1 中的程序展示了 `Pair` 类的工作。静态方法\
  \ `minmax` 遍历数组并同时计算最小值和最大值。它使用 `Pair` 对象来返回这两个结果。请记住，`compareTo` 方法比较两个字符串：如果字符串相同，则返回\
  \ `0`；如果第一个字符串在字典顺序上于第二个字符串，则返回负整数；否则返回正整数。\n\n***\n\n![Image](img/note1.jpg) C++\
  \ 笔记\n\n从表面上看，Java 的泛型类与 C++ 的模板类相似。唯一明显的区别是 Java 没有特殊的 `template` 关键字。然而，正如你将在整个章节中看到的，由于这两种机制之间存在本质差异。\n\
  \n***\n\n**列表 8.1** `pair1/PairTest1.java`\n\n点击此处查看代码图像\n\n***\n\n```java\npackage\
  \ pair1;\n\n/**\n * @version 1.01 2012-01-26\n * @author Cay Horstmann\n */\npublic\
  \ class PairTest1\n{\n    public static void main(String[] args)\n    {\n      \
  \  String[] words = { \"Mary\", \"had\", \"a\", \"little\", \"lamb\" };\n      \
  \  Pair<String> mm = ArrayAlg.minmax(words);\n        System.out.println(\"min =\
  \ \" + mm.getFirst());\n        System.out.println(\"max = \" + mm.getSecond());\n\
  \    }\n}\n\nclass ArrayAlg\n{\n    /**\n     * 获取字符串数组的最小值和最大值。\n     * @param\
  \ a 一个字符串数组\n     * @return 一个包含最小值和最大值的值对，如果 a 为空或为空则返回 null\n     */\n    public\
  \ static Pair<String> minmax(String[] a)\n    {\n        if (a == null || a.length\
  \ == 0) return null;\n        String min = a[0];\n        String max = a[0];\n \
  \       for (int i = 1; i < a.length; i++)\n        {\n            if (min.compareTo(a[i])\
  \ > 0) min = a[i];\n            if (max.compareTo(a[i]) < 0) max = a[i];\n     \
  \   }\n        return new Pair<>(min, max);\n    }\n}\n```\n\n***\n\n### 8.3 泛型方法\n\
  \n在上一节中，你已经学习了如何定义泛型类。你也可以定义带有类型参数的单个方法。\n\n```java\nclass ArrayAlg\n{\n    public\
  \ static <T> T getMiddle(T[] a)\n    {\n        return a[a.length / 2];\n    }\n\
  }\n```\n\n该方法定义在普通类内部，而不是泛型类内部。然而，它是一个泛型方法，从尖角括号和类型变量可以看出。注意，类型变量插入在修饰符（`public\
  \ static`）之后、返回类型之前。\n\n你可以在普通类内部也可以在泛型类内部定义泛型方法。当你调用泛型方法时，可以在方法名之前放置尖角括号括起来实际类型：\n\
  \n```java\nString middle = ArrayAlg.<String>getMiddle(\"John.\", names);\n```\n\n\
  在这种情况下（实际上在大多数情况下都是），你可以从方法调用中省略 `<String>` 参数。编译器有足够的信息推断你想要的方法。它将 `names` 的类型（即\
  \ `String[]`）与泛型类型 `T[]` 进行匹配，并推导出 `T` 必须是 `String`。也就是说，你只需调用：\n\n```java\nString\
  \ middle = ArrayAlg.getMiddle(\"John.\", names);\n```\n\n```在几乎所有情况下，泛型方法的类型推断都运行得很顺畅。偶尔，编译器会出错，你需要解读错误报告。考虑这个例子：\n\
  \n```java\ndouble middle = ArrayAlg.getMiddle(3.14, 1729, 0);\n```\n\n错误信息用晦涩的术语（随编译器版本不同而异）抱怨道，这段代码有两种解释方式，且都是有效的。简而言之，编译器将参数自动装箱为\
  \ `Double` 和两个 `Integer` 对象，然后它尝试寻找这些类的公共父类型。它实际上找到了两个：`Number` 和 `Comparable` 接口，而后者本身是泛型的。在这种情况下，解决办法是将所有参数都写为\
  \ `double` 值。\n\n***\n\n![Image](img/tip.jpg) 提示\n\n如果你想查看编译器为泛型调用推断出什么类型，Peter\
  \ von Ahé 建议使用这个技巧：故意引入错误并研究产生的错误信息。例如，考虑 `ArrayAlg.getMiddle(\"Hello\", 0)`。你会得到错误报告：\n\
  \n```\nfound: java.lang.Object, java.io.Serializable\n```\n\n用通俗英语说，你可以将结果赋值给 `Object`\
  \ 或 `Serializable`。\n\n***\n\n***\n\n![Image](img/note1.jpg) C++ 笔记\n\n在 C++ 中，将类型参数放在方法名之后。这会导致解析歧义。例如，`g<a,b>(c))`\
  \ 可以意味着“带有 f<a,b>(c) 结果调用 g”，或者“带有两个布尔值 f<a> 和 b)”.\n\n### 8.4 类型变量的边界\n\n有时，类或方法需要对类型变量进行限制。这是一个典型的例子。我们想要计算数组的最小元素：\n\
  \n```java\nclass ArrayAlg\n{\n    public static <T> min(T[] a) // 几乎正确\n    {\n\
  \        if (a == null || a.length == 0) return null;\n        T smallest = a[0];\n\
  \        for (int i = 1; i < a.length; i++)\n            if (smallest.compareTo(a[i])\
  \ > 0) smallest = a[i];\n        return smallest;\n    }\n}\n```\n\n但有一个问题。查看 `min`\
  \ 方法的代码。变量 `smallest` 的类型是 `T`，这意味着它可以是任意类的对象。我们如何知道 `T` 所属的类拥有 `compareTo` 方法呢？\n\
  \n解决方案是将 `T` 限制为实现了 `Comparable` 接口的类——该标准接口包含一个方法 `compareTo`。你可以通过为类型变量 `T` 给出*边界*来实现这一点：\n\
  \n```java\npublic static <T extends Comparable<? super T>> min(T[] a) . . .\n```\n\
  \n实际上，`Comparable` 接口本身是一个泛型类型。现在我们将忽略这种复杂性以及编译器生成的警告。8.8 节通配符类型](#ch08.html_ch08lev1sec8),”位于第\
  \ 442 页讨论了如何正确与 `Comparable` 接口配合类型参数。\n\n现在，泛型 `min` 方法只能用于实现了 `Comparable` 接口的类的数组，例如\
  \ `String`、`LocalDate` 等。使用 `Rectangle` 数组调用 `min` 将导致编译错误，因为 `Rectangle` 类没有实现\
  \ `Comparable`。\n\n\n\n\n你可能会奇怪，为什么在这种情况下我们使用 `extends` 关键字而不是 `implements` 关键字——毕竟，`Comparable`\
  \ 是一个接口。这种写法\n\n`<T extends BoundingType>`\n\n表示 `T` 应该是该边界类型的*子类型*（subtype）。`T`\
  \ 和边界类型都可以是类，也可以是接口。选择 `extends` 关键字是因为它是对子类型概念的合理近似，而且 Java 的设计者并不希望向语言中添加新的关键字（例如\
  \ `sub`）。\n\n一个类型变量或通配符可以有多个边界。例如：\n\n点击此处查看代码图像\n\n`T extends Comparable & Serializable`\n\
  \n边界类型之间使用 ampersand（`&`）分隔，因为逗号被用于分隔类型变量。\n\n与 Java 继承一样，你可以拥有任意数量的接口超类型，但边界中最多只能有一个是类。如果你将一个类作为边界，它它必须是边界列表中的第一个。\n\
  \n在下一个示例程序（代码列表 8.2）中，我们重写了 `minmax` 方法使其变为泛型。该方法计算泛型数组的最小值和最大值，返回一个 `Pair<T>`。\n\
  \n**列表 8.2** `pair2/PairTest2.java`\n\n点击此处查看代码图像\n\n```java\npackage pair2;\n\n\
  import java.time.*;\n\n/**\n * @version 1.02 2015-06-21\n * @author Cay Horstmann\n\
  \ */\npublic class PairTest2\n{\n    public static void main(String[] args)\n  \
  \  {\n        LocalDate[] birthdays =\n            {\n            LocalDate.of(1906,\
  \ 12, 9), // G. Hopper\n            LocalDate.of(1815, 12, 10), // A. Lovelace\n\
  \            LocalDate.of(1903, 12, 3), // J. Neumann\n            LocalDate.of(1910,\
  \ 6, 22), // K. Zuse\n};\n        Pair<LocalDate> mm = ArrayAlg.minmax(birthdays);\n\
  \        System.out.println(\"min = \" + mm.getFirst());\n        System.out.println(\"\
  max = \" + mm.getSecond());\n    }\n}\n\nclass ArrayAlg\n{\n    /**\n     * 获取类型为\
  \ T 的对象数组的最小值和最大值。\n     * @param a 类型为 T 的对象数组\n     * @return 包含最小值和最大值的对，如果 a\
  \ 为空或无效则返回 null\n     */\n    public static <T extends Comparable> Pair<T> minmax(T[]\
  \ a)\n    {\n        if (a == null || a.length == 0) return null;\n        T min\
  \ = a[0];\n        T max = a[0];\n        for (int i = 1; i < a.length; i++)\n \
  \       {\n            if (min.compareTo(a[i]) > 0) min = a[i];\n            if\
  \ (max.compareTo(a[i]) < 0) max = a[i];\n        }\n        return new Pair<>(min,\
  \ max);\n    }\n}\n```\n\n### 8.5 泛型代码与虚拟机\n\n虚拟机并没有泛型类型的对象——所有对象都属于普通类。泛型实现的早期版本甚至能够将使用泛型的程序编译成可以在\
  \ 1.0 虚拟机上执行的类文件！在接下来的章节中，你将看到编译器如何“擦除”（erases）类型参数，以及这一过程对 Java 程序员意味着什么。\n\n####\
  \ 8.5.1 类型擦除\n\n每当你定义一个泛型类型时，系统会自动提供一个对应的*原始*（raw）类型。原始类型的名称就是泛型类型的名称，只是去掉了类型参数。类型变量被*擦除*并被替换为它们的边界类型（对于没有边界的变量，则使用\
  \ `Object`）。\n\n例如，`Pair<T>` 的原始类型所示：\n\n点击此处查看代码图像\n\n```java\npublic class Pair\n\
  {\n    private Object first;\n    private Object second;\n    public Pair(Object\
  \ first, Object second)\n    {\n        this.first = first;\n        this.second\
  \ = second;\n    }\n    public Object getFirst() { return first; }\n    public Object\
  \ getSecond() { return second; }\n    public void setFirst(Object newValue) { first\
  \ = newValue; }\n    public void setSecond(Object newValue) { second = newValue;\
  \ }\n}\n```\n\n由于 `T` 是无边界类型变量，它被简单地替换为 `Object`。结果是一个普通类，就像你在 Java 引入泛型之前可能实现的那样。你的程序可能包含不同类型的\
  \ `Pair`，例如 `Pair<String>` 或 `Pair<LocalDate>`，但擦除将它们都变成了原始的 `Pair` 类型。\n\n![Image](img/note1.jpg)\
  \ C++ 备注\n\n在这方面，Java 泛型与 C++ 模板非常不同。C++ 会为每次实例化产生不同的类型——这种现象被称为“模板膨”（template bloat）。Java\
  \ 则没有此问题。\n\n你可能会想，如果交换边界会怎样：`class Interval<T extends Serializable & Comparable>`。在这种情况下，原始类型将\
  \ `T` 替换为 `Serializable`，编译器会插入到 `Comparable` 的强制转换。为了效率，你应当将标记接口（即没有方法的接口）放在列表的末尾。\n\
  \n原始类型将 `T` 替换为它的边界类型，如果没有边界则替换为 `Object`。例如，`Pair<T>` 没有边界，因此原始类型所示：\n\n点击此处查看代码图像\n\
  \n```java\npublic class Pair\n{\n    private Object first;\n    private Object second;\n\
  }\n```\n\n#### 8.5.2 翻译泛型表达式\n\n当你调用泛型方法时，如果返回类型已被擦除，编译器会插入强制转换。例如，考虑以下序列\n\n点击此处查看代码图像\n\
  \n`Pair<Employee> buddies = . . .`\n\n`Employee buddy = buddies.getFirst();`\n\n\
  `getFirst()` 的擦除返回类型为 `Object`。编译器会自动插入到 `Employee` 的转换。也就是说，编译器将方法调用转换为虚拟指令：\n\
  - 调用原始方法 `Pair.getFirst()`\n- 将返回的 `Object` 转换为 `Employee`\n\n在访问泛型字段时也会插入强制转换。假设\
  \ `Pair` 类的 `first` 和 `second` 字段是公有的。（也许这不是良好的编程风格，但它是合法的 Java。）那么表达式\n\n`Employee\
  \ buddy = buddies.first;`\n\n在生成的代码中也拥有了强制转换。\n\n#### 8.5.3 翻译泛型方法\n\n类型擦除也发生在泛型方法中。程序员通常将如下泛型方法\n\
  \n点击此处查看代码图像\n\n`public static <T extends Comparable> T min(T[] a)` 视为整体，但在擦除后只剩下一个方法：\n\
  \n点击此处查看代码图像\n\n`public static Comparable min(Comparable[] a)`\n\n注意，类型参数 `T` 已擦除，留下了它的边界类型\
  \ `Comparable`。方法的擦除带来了一些复杂性。考虑这个例子：\n\n点击此处查看代码图像\n\n```java\nclass DateInterval\
  \ extends Pair<LocalDate>\n{\n    public void setSecond(LocalDate second)\n    {\n\
  \        if (second.compareTo(getFirst()) >= 0)\n            super.setSecond(second);\n\
  \    }\n    . . .\n}\n```\n\n\n\n日期区间是两个 `LocalDate` 对象的对，我们希望重写这些方法以确保第二个值永远不小于第一个值。该类擦除后变为：\n\
  \n```java\nclass DateInterval extends Pair // 擦除后\n\n{\n   public void setSecond(LocalDate\
  \ second) { . . . }\n   . . .\n}\n```\n\n可能让你惊讶的是，还有一个继承自 `Pair` 的 `setSecond` 方法，即：\n\
  \n```java\npublic void setSecond(Object second)\n```\n\n这显然是不同的方法，因为它的参数类型不同——是\
  \ `Object` 而不是 `LocalDate`。但它*不应该是*不同的。考虑以下这一语句序列：\n\n```java\nDateInterval interval\
  \ = new DateInterval(. . .);\nPair<LocalDate> pair = interval; // OK--赋值给父类\npair.setSecond(aDate);\n\
  ```\n\n我们的预期是对 `setSecond` 的调用是多态的，并调用适当的方法。由于 `pair` 指向一个 `DateInterval` 对象，因此应该调用\
  \ `DateInterval.setSecond`。问题在于类型擦除干扰了多态性。为了解决这个问题，编译器在 `DateInterval` 类中生成了一个*桥接方法*bridge\
  \ method）：\n\n```java\npublic void setSecond(Object second) { setSecond((Date) second);\
  \ }\n```\n\n为了理解为什么这有效，让我们仔细跟踪语句\n\n`pair.setSecond(aDate)` 的执行过程。变量 `pair` 的声明类型为\
  \ `Pair<LocalDate>`，而该类型只有一个名为 `setSecond` 的方法，即 `setSecond(Object)`。虚拟机在 `pair`\
  \ 所指向的对象上调用该方法。该对象的类型是 `DateInterval`。因此，调用了 `DateInterval.setSecond(Object)`。该方法就是合成的桥接方法。它调用了\
  \ `DateInterval.setSecond(Date)`，这正是我们想要的。\n\n桥接方法可能更加奇怪。假设 `DateInterval` 方法也重写了\
  \ `getSecond` 方法：\n\n```java\nclass DateInterval extends Pair<LocalDate>\n\n{\n\
  \   public LocalDate getSecond() { return (Date) super.getSecond().clone(); }\n\
  \   . . .\n}\n```\n\n在 `DateInterval` 类中，有两个 `getSecond` 方法：\n\n```java\nLocalDate\
  \ getSecond() // 定义在 DateInterval 中\nObject getSecond() // 重写 Pair 中定义的方法以调用第一个方法\n\
  ```\n\n你不能像那样写 Java 代码；拥有两个具有相同参数类型的方法是非法的——在这里，没有任何参数。然而，在虚拟机中，参数类型*和返回类型*共同决定了一个方法。因此，编译器可以为两个仅返回类型上不同的方法生成字节码，并且虚拟机将正确处理这种情况。\n\
  \n***\n\n![Image](img/note.jpg) 备注\n\n桥接方法不仅限于泛型。我们之前在第 5 章 中已经提到，在重写另一个方法时，指定更具限制性的返回类型是合法的。例如：\n\
  \n```java\npublic class Employee implements Cloneable\n\n{\n   public Employee clone()\
  \ throws CloneNotSupportedException { . . . }\n}\n```\n\n`Object.clone` 和 `Employee.clone`\
  \ 方法被称为具有*协变返回类型*。\n\n实际上，`Employee` 类有*两个* `clone` 方法：\n\n```java\nEmployee clone()\
  \ // 上文定义\nObject clone() // 合成的的桥接方法，重写了 Object.clone\n```\n\n合成的桥接方法调用了新定义的方法。\n\
  \n***\n\n总结一下，你需要记住关于 Java 泛型转换的这些事实：\n\n- 虚拟机中没有泛型，只有普通的类和方法。\n- 所有的类型参数都被替换为它们的边界（bounds）。\n\
  - 合成桥接方法以保留多态性。\n- 在需要时插入类型转换以保留类型安全。\n\n#### 8.5.4 调用旧代码\n\n在设计 Java 泛型时，一个主要目标是允许泛型与旧代码之间的互操作性。让我们来看一个具体的例子。要设置\
  \ `JSlider` 的标签，你使用方法\n\n```java\nvoid setLabelTable(Dictionary table)\n```\n\n\
  这里，`Dictionary` 是原始类型，因为 `JSlider` 类在 Java 泛型出现之前就已经实现了。然而，当你填充字典时，应该使用泛型类型。\n\n\
  当你将 `Dictionary<Integer, Component>` 传递给 `setLabelTable` 时，编译器会发出警告。\n\n```java\n\
  slider.setLabelTable(labelTable);\n```\n\n在最坏的情况下，你的程序将抛出异常。\n\n\n\n\n\n点击此处查看代码图像\n\
  \n```java\nif (a instanceof Pair<String>) // Error\n```\n\n这只能测试 `a` 是否为任意类型的 `Pair`。对于以下测试也是如此：\n\
  \n点击此处查看代码图像\n\n```java\nif (a instanceof Pair<T>) // Error\n```\n\n或者强制转换：\n\n\
  点击此处查看代码图像\n\n```java\nPair<String> p = (Pair<String>) a; // Warning--仅能测试 a 是否为\
  \ Pair\n```\n\n为了提醒你注意这种风险，当你尝试查询对象是否属于某个泛型类型时，将得到编译器错误（使用 `instanceof`）或警告（使用强制转换）。\n\
  \n出于同样的道理，`getClass` 方法始终返回原始类型（raw type）。例如：\n\n点击此处查看代码图像\n\n```java\nPair<String>\
  \ stringPair = . . .;\n\nPair<Employee> employeePair = . . .;\n\nif (stringPair.getClass()\
  \ == employeePair.getClass()) //它们是相等的\n```\n\n比较的结果为 `true`，因为两次调用 `getClass` 返回的都是\
  \ `Pair.class`。\n\n### 8.6.3 你不能创建参数化类型的数组\n\n你不能实例化参数化泛的数组，例如：\n\n点击此处查看代码图像\n\n\
  ```java\nPair<String>[] table = new Pair<String>[10]; // Error\n```\n\n这有什么问题？在类型擦除后，`table`\
  \ 的类型是 `Pair[]`。你可以将其转换为 `Object[]`：\n\n```java\nObject[] objarray = table;\n```\n\
  \n数组会记住其组件类型，如果你尝试存储一个错误类型的元素，它会抛出 `ArrayStoreException`：\n\n点击此处查看代码图像\n\n```java\n\
  objarray[0] = \"Hello\"; // Error--组件类型是 Pair\n```\n\n但擦除使得这种机制对泛型类型失效。以下赋值：\n\n\
  点击此处查看代码图像\n\n```java\nobjarray[0] = new Pair<Employee>();\n```\n\n将通过数组存储检查，但仍会导致类型错误。由于由于原因，参数化类型的数组是被禁止的。\n\
  \n请注意，只有创建这些数组是被禁止的。你可以声明一个类型为 `Pair<String>[]` 的变量，但不能用 `new Pair<String>[10]`\
  \ 初始化它。\n\n![Image](img/note.jpg) 注意事项\n\n你可以声明通配符类型的数组，然后对其进行强制转换：\n\n点击此处查看代码图像\n\
  \n```java\nPair<String>[] table = (Pair<String>[]) new Pair<?>[10];\n```\n\n结果是不安全的。如果你在\
  \ `table[0]` 中存储一个 `Pair<Employee>`，然后对 `table[0].getFirst()` 调用 `String` 方法，你将得到\
  \ `ClassCastException`。\n\n![Image](img/tip.jpg) 提示\n\n如果你需要收集参数化类型对象，只需使用 `ArrayList`：`ArrayList<Pair<String>>`\
  \ 是安全且有效的。\n\n### 8.6.4 可变参数警告\n\n在上一节中，你看到 Java 不支持泛型类型的数组。在本节中，我们讨论一个相关问题：将泛型类型的实例传递给具有可数量参数的方法。\n\
  \n考虑这个带有可变参数的简单方法：\n\n点击此处查看代码图像\n\n```java\npublic static <T> void addAll(Collection<T>\
  \ coll, T. . . ts)\n{\n    for (t : ts) coll.add(t);\n}\n```\n\n回参数 `ts` 实际上是一个持有所有提供参数的数组。\n\
  \n现在考虑这个调用：\n\n点击此处查看代码图像\n\n```java\nCollection<Pair<String>> table = . . .;\n\n\
  Pair<String> pair1 = . . .;\n\nPair<String> pair2 = . . .;\n\naddAll(table, pair1,\
  \ pair2);\n```\n\n为了调用这个方法，Java 虚拟机必须创建一个 `Pair<String>` 数组，这是违反规则的。然而，规则针对这种情况被放宽了，你只会得到警告而不是错误。\n\
  \n你可以通过两种方式抑制警告。你可以在包含 `addAll` 调用的方法上添加 `@SuppressWarnings(\"unchecked\")` 注解。或者，从\
  \ Java SE 7 开始，你可以对 `addAll` 方法本身使用 `@SafeVarargs` 注解：\n\n点击此处查看代码图像\n\n```java\n\
  @SafeVarargs\npublic static <T> void addAll(Collection<T> coll, T. . . ts)\n```\n\
  \n现在现在可以使用泛型类型调用此方法了。你可以将此注解用于任何仅读取参数数组元素的方法，这被认为是最常见的用例。\n\n![Image](img/note.jpg)\
  \ 注意事项\n\n你可以使用 `@SafeVarargs` 注解来绕过对泛型数组创建的限制，使用此方法：\n\n点击此处查看代码图像\n\n```java\n\
  @SafeVarargs\npublic static <T> void addAll(Collection<T> coll, T. . . ts)\n```\n\
  \n（注：由于原文文本存在大量重复和乱码，已根据逻辑进行清理并翻译核心内容）\n\n\n\n\n\n```java\n@SuppressWarnings(\"\
  unchecked\") public E get(int n) { return (E) elements[n]; }\n\npublic void set(int\
  \ n, E e) { elements[n] = e; } // 不需要强制转换\n}\n```\n\n实际实现并不十分干净：\n\n点击此处查看代码图片\n\
  \n```java\npublic class ArrayList<E>\n{\n   private E[] elements;\n   . . .\n  \
  \ public ArrayList() { elements = (E[]) new Object[10]; }\n}\n```\n\n在这里，强制转换 `E[]`\
  \ 是赤裸裸的谎言，但类型擦除（type erasure）使其无法被检测。\n\n这种技术不适用于我们的 `minmax` 方法，因为我们返回的是 `T[]`\
  \ 数组，如果我们对它的类型撒谎，会导致会导致运行时错误。假设我们这样实现：\n\n点击此处查看代码图片\n\n```java\npublic static <T\
  \ extends Comparable> T[] minmax(T. . . a)\n{\n   Object[] mm = new Object[2];\n\
  \   . . .\n   return (T[]) mm; // 带警告通过编译\n}\n```\n\n调用处：\n\n点击此处查看代码图片\n\n```java\n\
  String[] ss = ArrayAlg.minmax(\"Tom\", \"Dick\", \"Harry\");\n```\n\n编译时没有任何警告。当方法返回时，将\
  \ `Object[]` 引用强制转换为 `Comparable[]`，此时会发生 `ClassCastException`。\n\n在这种情况下，最好的办法是让用户提供一个数组构造函数表达式：\n\
  \n点击此处查看代码图片\n\n```java\nString[] ss = ArrayAlg.minmax(String[]::new, \"Tom\", \"\
  Dick\", \"Harry\");\n```\n\n构造函数表达式 `String::new` 表示一个函数，给定所需的长度，构造相应长度的 `String`\
  \ 数组。\n\n该方法使用该参数来产生正确类型的数组：\n\n点击此处查看代码图片\n\n```java\npublic static <T extends\
  \ Comparable> T[] minmax(IntFunction<T[]> constr, T. . . a)\n{\n   T[] mm = constr.apply(2);\n\
  \   . . .\n}\n```\n\n另一种老旧的方法是反射并调用 `Array.newInstance`：\n\n点击此处查看代码图片\n\n```java\n\
  public static <T extends Comparable> T[] minmax(T. . . a)\n{\n   T[] mm = (T[])\
  \ Array.newInstance(a.getClass().getComponentType(), 2);\n   . . .\n}\n```\n\n`ArrayList`\
  \ 类的 `toArray` 方法就没有那么幸运了。它需要产生 `T[]` 数组，但它没有组件类型。因此，有两种变体：\n\n```java\nObject[]\
  \ toArray()\nT[] toArray(T[] result)\n```\n\n### 8.6.7 类型变量在泛型类的静态上下文中无效\n\n你不能在静态字段或方法中引用类型变量。例如，下面这个巧妙的想法是行不通的：\n\
  \n点击此处查看代码图片\n\n```java\npublic class Singleton<T>\n{\n   private static T singleInstance;\
  \ // 错误\n   public static T getSingleInstance() // 错误\n   {\n      if (singleInstance\
  \ == null) 构建 T 的实例\n      return singleInstance;\n   }\n}\n```\n\n如果可以这样做，程序就可以声明一个\
  \ `Singleton<Random>` 来共享随机数生成器，以及一个 `Singleton<JFileChooser>` 来共享文件选择对话框。但这是行不通的。类型擦除后，只有一个\
  \ `Singleton` 类和一个 `singleInstance` 字段。由于这个原因，带有类型变量的静态字段和方法被直接禁止。\n\n### 8.6.8\
  \ 你不能抛出或捕获泛型类的实例\n\n你既不能抛出也不能捕获泛型类的对象。事实上，泛型类继承 `Throwable` 甚至是不合法的。例如，下面的定义将无法编译：\n\
  \n点击此处查看代码图片\n\n```java\npublic class Problem<T> extends Exception { /* . . . */\
  \ } // 错误--不能继承 Throwable\n```\n\n你不能在 `catch` 子句中使用类型变量。例如，下面的方法将无法编译：\n\n点击此处查看代码图片\n\
  \n```java\npublic static <T extends Throwable> void doWork(Class<T> t)\n{\n   try\n\
  \   {\n      执行工作\n   }\n   catch (T e) // 错误--不能捕获变量\n   {\n      Logger.info(.\
  \ . .)\n   }\n}\n```\n\n然而，在异常规格中使用类型变量是可以接受的。下面的方法是合法的：\n\n点击此处查看代码图片\n\n```java\n\
  public static <T extends Throwable> void doWork(T t) throws T\n{\n   try\n   {\n\
  \      执行工作\n   }\n   catch (Throwable realCause)\n   {\n      t.initCause(realCause);\n\
  \      throw t;\n   }\n\n\n### 8.6.9 你可以破解异常检查\n\nJava 异常处理的基石是你必须为所有检查异常提供处理器。你可以使用泛型来破解这种方案。关键在于这个方法：\n\
  \n点击此处查看代码图片\n\n```java\n@SuppressWarnings(\"unchecked\")\npublic static <T extends\
  \ Throwable> void throwAs(Throwable e) throws T\n{\n   throw (T) e;\n}\n```\n\n\
  假设该方法包含在 `Block` 类中。当你调用\n\n点击此处查看代码图片\n\n`Block.<RuntimeException>throwAs(t)`，编译器将认为\
  \ `t` 变成了一个非检查异常。以下代码将所有异常转换为编译器认为的非检查异常：\n\n点击此处查看代码图片\n\n```java\ntry\n{\n   执行工作\n\
  }\ncatch (Throwable t)\n{\n   Block.<RuntimeException>throwAs(t);\n}\n```\n\n让我们封装在一个抽象类中。用户将重写\
  \ `body` 方法以提供特定的操作。当调用 `toThread` 时，你会得到一个 `Thread` 类对象，其 `run` 方法并不担心检查异常。\n\n\
  点击此处查看代码图片\n\n```java\nabstract class Block\n{\n   abstract void body() throws Exception;\n\
  \   public Thread toThread()\n   {\n      return new Thread()\n      {\n       \
  \  public void run()\n         {\n            try\n            {\n             \
  \  body();\n            }\n            catch (Throwable t)\n            {\n    \
  \           Block.<RuntimeException>throwAs(t);\n            }\n         }\n   \
  \   };\n   }\n   @SuppressWarnings(\"unchecked\")\n   public static <T extends Throwable>\
  \ void throwAs(Throwable e) throws T\n   {\n      throw (T) e;\n   }\n}\n```\n\n\
  例如，这个程序运行了一个抛出检查异常的线程：\n\n点击此处查看代码图片\n\n```java\npublic class Test\n{\n   public\
  \ static void main(String[] args)\n   {\n      new Block()\n      {\n         public\
  \ void body() throws Exception\n         {\n            Scanner in = new Scanner(new\
  \ File(\"ququx\"), \"UTF-8\");\n            while (in.hasNext())\n            {\n\
  \               System.out.println(in.next());\n            }\n         }\n    \
  \  }.toThread().start();\n   }\n}\n```\n\n\n\n\n`boolean equals(String)` // 定义在\
  \ `Pair<T>` 中\n\n`boolean equals(Object)` // 继承自 `Object`\n\n但直觉误导了我们。方法的擦除将\n\n\
  `boolean equals(T)`\n\n变成了\n\n`boolean equals(Object)`\n\n这与 `Object.equals` 方法发生了冲突。\n\
  \n解决办法当然是重命名这个引起冲突的方法。\n\n泛型规范引用了另一个规则：“为了支持通过擦除转换，我们实施了这样一种限制：类或类型变量不能同时是两个接口类型的子类型，而这两个接口是同一个接口的不同参数化形式。”例如，以下代码是非法的：\n\
  \n点击此处查看代码图像\n\n```java\nclass Employee implements Comparable<Employee> { . . .\
  \ }\nclass Manager extends Employee implements Comparable<Manager>\n   { . . . }\
  \ // 错误\n```\n\n`Manager` 将同时实现 `Comparable<Employee>` 和 `Comparable<Manager>`，它们是同一个接口的不同参数化。\n\
  \n这种限制与类型擦除之间的关系并不显而易见。毕竟，非泛型的版本\n\n点击此处查看代码图像\n\n```java\nclass Employee implements\
  \ Comparable { . . . }\nclass Manager extends Employee implements Comparable { .\
  \ . . }\n```\n\n是合法的。原因要微妙得多。这将与合成的桥接方法产生冲突。实现 `Comparable<X>` 的类会获得一个桥接方法\n\n点击此处查看代码图像\n\
  \n```java\npublic int compareTo(Object other) { return compareTo((X) other); }\n\
  ```\n\n你不能拥有不同的类型 `X` 两个这样的方法。\n\n### 8.7 泛型的继承规则\n\n当你处理泛型类时，你需要学习关于继承和子类型的规则。让我们从一个许多程序员认为不符合直觉的情况开始。考虑一个类和它的子类，例如\
  \ `Employee` 和 `Manager`。`Pair<Manager>` 是 `Pair<Employee>` 的子类吗？可能让你惊讶的是，答案是“不是”。例如，以下代码无法编译：\n\
  \n点击此处查看代码图像\n\n```java\nManager[] topHonchos = . . .;\nPair<Employee> result =\
  \ ArrayAlg.minmax(topHonchos); // 错误\n```\n\n`minmax` 方法返回一个 `Pair<Manager>`，而不是\
  \ `Pair<Employee>`，将一个赋值给另一个是非法的。\n\n通常情况下，`Pair<S>` 和 `Pair<T>` 之间*没有*关系，无论 `S`\
  \ 和 `T` 如何相关（参见图 8.1）。\n\n![图像](img/08fig01.jpg)\n\n**图 8.1** pair 类之间没有继承关系\n\n\
  这看起来像是一个残酷的限制，但对于类型安全来说是必要的。假设我们允许将 `Pair<Manager>` 转换为 `Pair<Employee>`。考虑这段代码：\n\
  \n点击此处查看代码图像\n\n```java\nPair<Manager> managerBuddies = new Pair<>(ceo, cfo);\n\
  Pair<Employee> employeeBuddies = managerBuddies; // 非法，但假设它不是\nemployeeBuddies.setFirst(lowlyEmployee);\n\
  ```\n\n显然，最后一条语句是合法的。但 `employeeBuddies` 和 `managerBuddies` 指向*同一个对象*。我们现在成功地将 CFO\
  \ 与一个普通员工配对，这对于 `Pair<Manager>` 来说是不可能的。\n\n***\n\n![图像](img/note.jpg) 注意\n\n你刚刚看到了泛型类型与\
  \ Java 数组之间的重要区别。你可以将 `Manager[]` 数组赋值给类型为 `Employee[]` 的变量：\n\n点击此处查看代码图像\n\n```java\n\
  Manager[] managerBuddies = { ceo, cfo };\nEmployee[] employeeBuddies = managerBuddies;\
  \ // OK\n```\n\n然而，数组带有特殊的保护。如果你尝试将一个普通员工存储到 `employeeBuddies[0]` 中，虚拟机会抛出 `ArrayStoreException`。\n\
  \n***\n\n你始终可以将参数化类型转换为原始类型（raw type）。例如，`Pair<Employee>` 是原始类型 `Pair` 的子类型。这种转换对于与旧留代码交互是必要的。\n\
  \n你能转换为原始类型并导致类型错误吗？遗憾的是，可以。考虑这个例子：\n\n点击此处查看代码图像\n\n```java\nPair<Manager> managerBuddies\
  \ = new Pair<>(ceo, cfo);\nPair rawBuddies = managerBuddies; // OK\nrawBuddies.setFirst(new\
  \ File(\". . .\")); // 仅有编译警告\n```\n\n这听起来很可怕。然而，请记住，你的处境并不比使用旧版本的 Java 时糟。虚拟机的安全性并没有受到威胁。当使用\
  \ `getFirst` 获取外部对象并将其赋值给 `Manager` 变量时，会抛出 `ClassCastException`，就像过去的老日子一样。你只是失去了泛型编程通常提供的额外安全性。\n\
  \n最后，泛型类可以扩展或实现其他泛型类。在这方面，它们与普通类没有区别。例如，`ArrayList<T>` 类实现了接口 `List<T>`。\n\n###\
  \ 8.8 通配符类型\n\n在一段时间内，研究人员发现一种僵化的类型系统非常难用。Java 设计者发明了一种巧妙的（尽管安全的）“逃生口”：*通配符类型*。通配符类型允许类型参数变化。\n\
  \n#### 8.8.1 通配符概念\n\n在通配符类型中，类型参数是变化的。例如，通配符类型\n\n`? extends Employee`\n\n表示任何类型参数为\
  \ `Employee` 子类的 `Pair`。假设你想写一个打印配对的方法，如下所示：\n\n点击此处查看代码图像\n\n```java\npublic static\
  \ void printBuddies(Pair<Employee> p)\n{\n    Employee first = p.getFirst();\n \
  \   Employee second = p.getSecond();\n    System.out.println(first.getName() + \"\
  \ and \" + second.getName() + \" are buddies.\");\n}\n```\n\n正如你在前面的节看到的，你无法将 `Pair<Manager>`\
  \ 传递该方法，这具有限制性。但解决方案很简单——使用通配符类型：\n\n点击此处查看代码图像\n\n```java\npublic static void printBuddies(Pair<?\
  \ extends Employee> p)\n```\n\n`Pair<Manager>` 是 `Pair<? extends Employee>` 的子类型（参见图\
  \ 8.2）。[图 8.2] 显示了这些关系。\n\n**图 8.2** 通配符之间的类型关系\n\n我们能通过 `Pair<? extends Employee>`\
  \ 引用使用通配符来破坏 `Pair<Manager>` 吗？\n\n点击此处查看代码图像\n\n```java\nPair<Manager> managerBuddies\
  \ = new Pair<>(ceo, cfo);\nPair<? extends Employee> wildcardBuddies = managerBuddies;\
  \ // OK\nwildcardBuddies.setFirst(lowlyEmployee); // 编译错误\n```\n\n不存在可能的破坏。对 `setFirst`\
  \ 的调用是一个类型错误。为了看到为什么，让我们仔细观察 `Pair<? extends Employee>`。它的方法看起来如下：\n\n点击此处查看代码图像\n\
  \n```java\n? extends Employee getFirst()\nvoid setFirst(? extends Employee)\n```\n\
  \n这使得无法调用 `setFirst` 方法。编译器只知道它需要 `Employee` 的某个子类型，但不知道是哪种类型。它拒绝传递任何特定类型——毕竟，`?`\
  \ 可能不匹配。\n\n我们在 `getFirst` 上没有这个问题：将 `getFirst` 的返回值赋值给 `Employee` 引用是完全合法的。\n\n\
  这就是有界通配符的关键思想。我们现在有一种方法区分安全的访问方法和不安全的修改器方法。\n\n#### 8.8.2 通配符的上界边界\n\n通配符边界与类型变量边界相似，但它们拥有一种额外的能力——你可以指定一个*上界边界*，如下：\n\
  \n`? super Manager`\n\n\n\n\n\n此通配符被限于 `Manager` 的所有父类。（这非常幸运，现有的 `super` 关键字如此准确地描述了这种关系。）\n\
  \n你为什么要这样做呢？带有父类界限的通配符所提供的行为，与第 8.8 节中“通配符类型”（第 442 页）描述的通配符相反。你可以向方法传递参数，但无法使用返回值。例如，`Pair<?\
  \ super Manager>` 的方法描述如下：\n\n```java\nvoid setFirst(? super Manager)\n? super Manager\
  \ getFirst()\n```\n\n这并不是真正的 Java 语法，但它展示了编译器知道的信息。编译器无法知道 `setFirst` 方法的切类型，因此无法接受类型为\
  \ `Employee` 或 `Object` 的参数调用。只能传递类型为 `Manager` 或其子类（如 `Executive`）的实例。此外，如果你调用\
  \ `getFirst`，无法保证返回对象的类型。你只能将其赋值给 `Object`。\n\n这是一个典型的示例。我们有一个经理数组，并想将奖金最低和最高的经理放入一个\
  \ `Pair` 对象中。什么样的 `Pair` 呢？`Pair<Employee>` 应该是合理的，或者说 `Pair<Object>` 也可以（参见图 8.4）。以下方法将接受任何适当的\
  \ `Pair`：\n\n```java\npublic static void minmaxBonus(Manager[] a, Pair<? super Manager>\
  \ result)\n{\n    if (a.length == 0) return;\n    Manager min = a[0];\n    Manager\
  \ max = a[0];\n    for (int i = 1; i < a.length; i++)\n    {\n        if (min.getBonus()\
  \ > a[i].getBonus()) min = a[i];\n        if (max.getBonus() < a[i].getBonus())\
  \ max = a[i];\n    }\n    result.setFirst(min);\n    result.setSecond(max);\n}\n\
  ```\n\n![Image](img/08fig04.jpg)\n\n**图 8.4** 带有父类界限的通配符\n\n直观地说，带有父类界限的通配符允许你向泛型对象写入，而带有子类界限的通配符允许你从泛型对象读取。\n\
  \n这是父类界限的另一个用途。`Comparable` 接口本身是一个泛型类型。它的声明如下：\n\n```java\npublic interface Comparable<T>\n\
  {\n    public int compareTo(T other);\n}\n```\n\n在这里，类型变量表示参数 `other` 的类型。例如，`String`\
  \ 类实现了 `Comparable<String>`它的 `compareTo` 方法声明为：\n\n```java\npublic int compareTo(String\
  \ other)\n```\n\n这很好——显式参数具有正确的类型。在接口泛型化之前，`other` 是 `Object`，在方法的实现中需要进行强制转换。\n\
  \n既然 `Comparable` 是一个泛型类型，也许我们应该对 `ArrayAlg` 类的 `min` 方法做得更好？我们可以将其声明为：\n\n```java\n\
  public static <T extends Comparable<T>> T min(T[] a)\n```\n\n这看起来比仅仅使用 `T extends\
  \ Comparable` 更彻底，并且对许多类都有效。例如，如果你计算一个 `String` 数组的最小值，那么 `T` 就是类型 `String`，而 `String`\
  \ 是 `Comparable<String>` 的子类。但在处理 `LocalDate` 对象数组时，我们遇到了问题。恰好，`LocalDate` 实现了 `ChronoLocalDate`，而\
  \ `ChronoLocalDate` 扩展 `Comparable<ChronoLocalDate>`。因此，`LocalDate` 实现了 `Comparable<ChronoLocalDate>`\
  \ 但*不是* `Comparable<LocalDate>`。\n\n在这种情况下，父类救了急：\n\n```java\npublic static <T extends\
  \ Comparable<? super T>> T min(T[] a) . . .\n```\n\n现在 `compareTo` 方法的形式为：\n\n```java\n\
  int compareTo(? super T)\n```\n\n它可能声明为接收类型为 `T` 的对象，或者（例如当 `T` 为 `LocalDate` 时）接收\
  \ `T` 的父类。无论如何，将类型为 `T` 的对象传递给 `compareTo` 方法是安全的。\n\n对于初学者来说，`<T extends Comparable<?\
  \ super T>>` 这样的声明看起来令人令畏。这很遗憾。此声明的意图是通过消除不必要的限制来帮助应用程序应用程序开发人员。\n\n\n\n\n在这种情况下，`swapHelper`\
  \ 方法的参数 `T` **捕获了通配符**。目前还该通配符表示什么类型，但它是一个确定的类型，而且当 `T` 表示该类型时，`<T>swapHelper` 的定义是完全合理的。\n\
  \n当然，在这种情况下，我们并没有被迫使用通配符。我们本可以直接实现 `<T> void swap(Pair<T> p)` 作为不带通配符的泛型方法。然而，考虑下面这个例子，通配符类型自然地出现在计算的中间：\n\
  \n点击此处查看代码图像\n\n```java\npublic static void maxminBonus(Manager[] a, Pair<? super\
  \ Manager> result)\n{\n    minmaxBonus(a, result);\n    PairAlg.swap(result); //\
  \ OK--swapHelper 捕获了通配符类型\n}\n```\n\n在这里，通配符捕获机制是无法避免的。\n\n通配符捕获只在非常有限的情况下是合法的。编译器能够保证通配符代表一个单一、确定的类型。例如，`ArrayList<Pair<T>>`\
  \ 中的 `T` 永远无法捕获 `ArrayList<Pair<?>>` 中的通配符。该数组列表可能包含两个 `Pair<?>`，每个的 `?` 都有不同的类型。\n\
  \n列表 8.3 中的测试程序汇总了我们在前面几节中讨论过的各种方法，以便你可以在上下文中看到它们。\n\n**列表 8.3** `pair3/PairTest3.java`\n\
  \n点击此处查看代码图像\n\n***\n\n```java\n1    package pair3;\n2\n3    /**\n4* @version 1.01\
  \ 2012-01-26\n      * @author Cay Horstmann\n6      */\n7    public class PairTest3\n\
  8    {\n9        public static void main(String[] args)\n10     {\n11         Manager\
  \ ceo = new Manager(\"Gus Greedy\", 800000, 2003, 12, 15);\n12         Manager cfo\
  \ = new Manager(\"Sid Sneaky\", 600000, 2003, 12, 15);\n13         Pair<Manager>\
  \ buddies = new Pair<>(ceo, cfo);\n14         printBuddies(buddies);\n15\n16   \
  \      ceo.setBonus(1000000);\n17         cfo.setBonus(500000);\n18         Manager[]\
  \ managers = { ceo, cfo };\n19\n20         Pair<Employee> result = new Pair<>();\n\
  21         minmaxBonus(managers, result);\n22         System.out.println(\"first:\
  \ \" + result.getFirst().getName()\n23             + \", second: \" + result.getSecond().getName());\n\
  24         maxminBonus(managers, result);\n25         System.out.println(\"first:\
  \ \" + result.getFirst().getName()\n26             + \", second: \" + result.getSecond().getName());\n\
  27     }\n28\n29     public static void printBuddies(Pair<? extends Employee> p)\n\
  30     {\n31         Employee first = p.getFirst();\n32         Employee second\
  \ = p.getSecond();\n33         System.out.println(first.getName() + \" and \" +\
  \ second.getName() + \" are buddies.\");\n34     }\n35\n36     public static void\
  \ minBonus(Manager[] a, Pair<? super Manager> result)\n37     {\n38         if (a.length\
  \ == 0) return;\n39         Manager min = a[0];\n40         Manager max = a[0];\n\
  41         for (int i = 1; i < a.length; i++)\n42         {\n43             if (min.getBonus()\
  \ > a[i].getBonus()) min = a[i];\n44             if (max.getBonus() < a[i].getBonus())\
  \ max = a[i];\n45         }\n46         result.setFirst(min);\n47         result.setSecond(max);\n\
  48     }\n49\n50     public static void minminBonus(Manager[] a, Pair<? super Manager>\
  \ result)\n51     {\n52         minminBonus(a, result);\n53         PairAlg.swap(result);\
  \ // OK--swapHelper 捕获了通配符\n54     }\n55     }\n56\n57     class PairAlg\n58   \
  \  {\n59         public static boolean hasNulls(Pair<?> p)\n60         {\n61   \
  \          return p.getFirst() == null || p.getSecond() == null;\n62         }\n\
  63\n64         public static void swap(Pair<?> p) { swapHelper(p); }\n65\n66   \
  \      public static <T> void swapHelper(Pair<T> p)\n67         {\n68          \
  \   T t = p.getFirst();\n69             p.setFirst(p.getSecond());\n70         \
  \    p.setSecond(t);\n71         }\n72     }\n```\n\n***\n\n### 8.9 反射与泛型\n\n反射允许你在运行时分析任意对象。如果对象是泛型类的实例，你无法获得关于泛型类型参数的相关信息，因为它们已经被擦除了。在接下来的章节中，你将学习尽管如此可以通过反射发现关于泛型类的哪些信息。\n\
  \n#### 8.9.1 泛型类\n\n`Class` 类现在是泛型的。例如，`String.class` 实际上是 `Class<String>` 类的一个对象（事实上，是该唯一的对象）。\n\
  \n类型参数是有用的，因为它允许 `Class<T>` 的方法在返回类型上变得更加具体。`Class<T>` 的以下方法利用了类型参数：\n\n点击此处查看代码图像\n\
  \n- `T newInstance()`\n- `T cast(Object obj)`\n- `T[] getEnumConstants()`\n- `Class<?\
  \ super T> getSuperclass()`\n- `Constructor<T> getConstructor(Class... parameterTypes)`\n\
  - `Constructor<T> getDeclaredConstructor(Class... parameterTypes)`\n\n`newInstance`\
  \ 方法返回一个从无参数构造函数获取的类实例。它的返回类型现在可以声明为 `T`，即与被描述的类相同的类型。\n\n`newInstance` 方法返回一个类实例。其返回类型现在可以声明为\
  \ `T`，即与被描述的类相同的类型。\n\n`cast` 方法返回对象，如果它可以转换为类型 `T`，否则抛出 `BadCastException`。\n\n\
  `getEnumConstants()` 方法当 `T` 是枚举类型时返回一个数组，否则返回 `null`。\n\n`getSuperclass()` 返回该类的父类，如果\
  \ `T` 不是一个类则返回 `null`。\n\n`getConstructor(Class... parameterTypes)` 获取给定参数类型的公共构造函数。\n\
  \n`getDeclaredConstructor(Class... parameterTypes)` 获取给定参数类型的声明构造函数。\n\n最后，`getConstructor`\
  \ 和 `getDeclaredConstructor` 方法返回 `Constructor<T>`。\n\n***\n\n`java.lang.Class<T>`\
  \ 1.0\n\n- `T newInstance()` 返回由无参数构造函数创建的实例。\n- `T cast(Object obj)` 如果对象可以转换为类型\
  \ `T` 则返回它，否则抛出 `BadCastException`。\n- `T[] getEnumConstants()` 如果 `T` 是枚举类型则返回数组，否则返回\
  \ `null`。\n- `Class<? super T> getSuperclass()` 返回该类的父类，如果 `T` 不是类则返回 `null`。\n\
  - `Constructor<T> getConstructor(Class... parameterTypes)` 获取给定参数类型的公共构造函数。\n- `Constructor<T>\
  \ getDeclaredConstructor(Class... parameterTypes)` 获取给定参数类型的声明构造函数。\n\n***\n\n`java.lang.reflect.Constructor<T>`\
  \ 1.1\n\n- `T newInstance(Object... parameters)` 返回使用给定参数创建的实例。\n\n***\n\n#### 8.9.2\
  \ 使用 Class<T> 参数进行类型匹配\n\n有时匹配 `Class<T>` 参数的变量是有用的。这里有一个经典的例子：\n\n点击此处查看代码图像\n\n\
  ```java\npublic static <T> Pair<T> makePair(Class<T> c) throws InstantiationException,\
  \ IllegalAccessException\n{\n    return new Pair<>(c.newInstance(), c.newInstance());\n\
  }\n```\n\n如果你调用 `makePair(Employee.class)`，`Employee.class` 是一个 `Class<Employee>`\
  \ 类型的对象。`makePair` 方法的类型参数 `T` 匹配 `Employee`，编译器可以推断出该方法返回 `Pair<Employee>`。\n\n\
  \n\n\n\n- 该泛型方法有一个名为 `T` 的类型参数；\n- 该类型参数有一个本身是泛型类型的子类界限；\n- 该边界类型有一个通配符参数；\n- 通配符参数有一个上类界限；以及\n\
  - 该泛型方法有一个泛型数组参数。\n\n换句话说，你可以重构实现者声明的关于泛型类和方法的所有信息。然而，你将不知道类型参数是如何针对特定对象或方法调用解析的。\n\
  \n为了表示泛型类型声明，请使用 `java.lang.reflect` 包中的 `Type` 接口。该接口有以下子类型：\n\n- `Class` 类，描述具体类型\n\
  - `TypeVariable` 接口，描述类型变量（例如 `T extends Comparable<? super T>`）\n- `WildcardType`\
  \ 接口，描述通配符（例如 `? super T`）\n- `ParameterizedType` 接口，描述泛型类或接口类型（例如 `Comparable<?\
  \ super T>`）\n- `GenericArrayType` 接口，描述泛型数组（例如 `T[]`）\n\n图 8.5 显示了继承层次结构。注意最后四个子类型是接口——虚拟机会实例化实现这些接口的相应类。\n\
  \n![Image](img/08fig05.jpg)\n\n**图 8.5** `Type` 接口及其后代\n\n代码列表 8.4 使用泛型反射 API 打印它发现的关于给定类的信息。如果你使用\
  \ `Pair` 类运行它，将得到此报告：\n\n点击此处查看代码图像\n\n```java\nclass Pair<T> extends java.lang.Object\n\
  \npublic T getFirst()\npublic T getSecond()\n\npublic void setFirst(T)\npublic void\
  \ setSecond(T)\n```\n\n如果你在 `PairTest2` 目录中使用 `ArrayAlg` 运行它，报告将显示以下方法：\n\n点击此处查看代码图像\n\
  \n```java\npublic static <T extends java.lang.Comparable> Pair<T> minmax(T[])\n\
  ```\n\n本节末尾的 API 说明描述了示例程序中使用的方法。\n\n**代码列表 8.4** `genericReflection/GenericReflectionTest.java`\n\
  \n点击此处查看代码图像\n\n```java\npackage genericReflection;\n\nimport java.lang.reflect.*;\n\
  import java.util.*;\n\n/**\n * @version 1.10 2007-05-15\n * @author Cay Horstmann\n\
  \ */\npublic class GenericReflectionTest\n{\n    public static void main(String[]\
  \ args)\n    {\n        // 从命令行参数或用户输入读取类名\n        String name;\n        if (args.length\
  \ > 0) name = args[0];\n        else\n        {\n            try (Scanner in = new\
  \ Scanner(System.in))\n            {\n                System.out.println(\"Enter\
