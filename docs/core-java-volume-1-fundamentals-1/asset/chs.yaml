  - `static boolean isPublic(int modifiers)`\n- `static boolean isStatic(int modifiers)`\n\
  - `static boolean isStrict(int modifiers)`\n- `static boolean isSynchronized(int\
  \ modifiers)`\n- `static boolean isVolatile(int modifiers)`\n测试 `modifiers` 值中对应方法名修饰符的位。\n\
  \n### 5.7.4 使用反射在运行时分析对象\n\n在前面的节中，我们看到了如何找到任何对象的数据字段的名称和类型：\n\n- 获取相应的 `Class`\
  \ 对象。\n- 在 `Class` 对象上调用 `getDeclaredFields`。\n\n在本节中，我们将更进一步，实际上查看字段的内容。当然，当你在编写程序时，如果一个对象的名称和类型是知的，查看其特定字段的内容很容易的。但反射允许你查看在编译时未知的对象的字段。\n\
  \n实现这一点的关键方法是 `Field` 类中的 `get` 方法。如果 `f` 是一个 `Field` 类型的对象（例如，从 `getDeclaredFields`\
  \ 获取的字段），并且 `obj` 是 `f` 字段所属类的实例对象，那么 `f.get(obj)` 返回一个对象，其值是 `obj` 字段的当前值。这些都有一点点抽象，所以让我们过来看一个例子。\n\
  \n```java\nEmployee harry = new Employee(\"Harry Hacker\", 35000, 10, 1, 1989);\n\
  Class cl = harry.getClass();\n// 代表 Employee 的类对象\nField f = cl.getDeclaredField(\"\
  name\");\n// Employee 类的 name 字段\nObject v = f.get(harry);\n// harry 对象 name 字段的值，即\
  \ String 对象 \"Harry Hacker\"\n```\n\n实际上，这段代码存在一个问题。由于 `name` 字段是一个私有字段，`get` 方法将抛出\
  \ `IllegalAccessException`。你只能使用 `get` 来获取可访问字段的值。Java 的安全机制允许你发现对象拥有哪些字段，但除非你拥有访问权限，否则它不会允许你读取这些字段的值。\n\
  \n反射机制的默认行为是尊重 Java 访问控制。然而，如果一个 Java 程序没有被禁止该操作的安全管理器控制，你就可以覆盖访问控制。为了这一点，可以在 `Field`、`Method`\
  \ 或 `Constructor` 对象上调用 `setAccessible` 方法。例如：\n\n```java\nf.setAccessible(true);\
  \ // 现在可以调用 f.get(harry); 了\n```\n\n`setAccessible` 方法是 `AccessibleObject` 类的方法，它是\
  \ `Field`、`Method` 和 `Constructor` 类的公共父类。此功能是为调试器、持久化存储和类似机制提供的。我们稍后会在通用的 `toString`\
  \ 方法中使用它。\n\n`get` 方法还有另一个我们需要处理的问题。`name` 字段是 `String`，因此将值作为 `Object` 返回没有问题。但假设我们想查看\
  \ `salary` 字段。它是一个 `double`，在 Java 中，数字类型不是对象。为了处理这个问题，你可以使用 `Field` 类的 `getDouble`\
  \ 方法，或者调用 `get`，此时反射机制会将字段值封装成相应的包装类——在这种情况下，是 `Double`。\n\n当然，你也可以设置你可以可以获取的值。调用\
  \ `f.set(obj, value)` 将对象 `obj` 中由 `f` 表示的字段设置为新值。\n\n列表 5.14 显示了如何编写一个适用于任何类的通用\
  \ `toString` 方法。它使用 `getDeclaredFields` 获取所有字段。然后它使用 `setAccessible` 简便方法使所有字段都变得可访问。对于每个字段，它获取其名称和值。每个值都通过递归调用\
  \ `toString` 转换为字符串。\n\n通用的 `toString` 方法需要处理一些复杂性。引用循环可能会导致无限递归。因此，`ObjectAnalyzer`\
  \ 会跟踪已经访问过的对象。此外，要查看数组内部，你需要一种不同的方法。你将在下一节中学习细节。\n\n你可以使用这个 `toString` 方法查看任何对象的内部情况。例如，调用：\n\
  \n```java\nArrayList<Integer> squares = new ArrayList<>();\nfor (int i = 1; i <=\
  \ 5; i++) squares.add(i * i);\nSystem.out.println(new ObjectAnalyzer().toString(squares));\n\
  ```\n\n产生打印输出：\n```\njava.util.ArrayList[class java.lang.Object[]{Integer=1, Integer=4,\
  \ Integer=9, Integer=16, Integer=25],null,null,null,null},size=5,Count=5][]\n```\n\
  \n你可以使用这个通用的 `toString` 方法来实现你自己的类的 `toString` 方法，如下所示：\n\n```java\npublic String\
  \ toString()\n{\nreturn ObjectAnalyzer().toString(this);\n}\n```\n这是一个你可能在程序中非常有用的提供\
  \ `toString` 方法的无忧方法。\n\n### Listing 5.14 ObjectTest.java\n```java\npackage objectAnalyzer;\n\
  \nimport java.util.ArrayList;\n\n/**\n * 该程序使用反射观察对象。\n * @version 1.12 2012-01-26\n\
  \ * @author Cay Horstmann\n */\npublic class ObjectTest\n{\n    public static void\
  \ main(String[] args)\n    {\n        ArrayList<Integer> squares = new ArrayList<>();\n\
  \        for (int i = 1; i <= 5; i++)\n            squares.add(i * i);\n       \
  \ System.out.println(new ObjectAnalyzer().toString(squares));\n    }\n}\n```\n\n\
  ### Listing 5.15 ObjectAnalyzer.java\n```java\npackage objectAnalyzer;\n\nimport\
  \ java.lang.reflect.AccessibleObject;\nimport java.lang.reflect.Array;\nimport java.lang.reflect.Field;\n\
  import java.lang.reflect.Modifier;\nimport java.util.ArrayList;\n\npublic class\
  \ ObjectAnalyzer\n{\n    private ArrayList<Object> visited = new ArrayList<>();\n\
  \n    /**\n     * 将对象转换为列所有字段的字符串表示。\n     * @param obj 一个对象\n     * @return 包含对象类名以及所有字段及其值的字符串\n\
  \     */\n    public String toString(Object obj)\n    {\n        if (obj == null)\
  \ return \"null\";\n        if (visited.contains(obj)) return \"...\";\n       \
  \ visited.add(obj);\n        Class cl = obj.getClass();\n        if (cl == String.class)\
  \ return (String) obj;\n        if (cl.isArray())\n        {\n            String\
  \ r = cl.getComponentType() + \"[]\";\n            for (int i = 0; i < Array.getLength(obj);\
  \ i++)\n            {\n                if (i > 0) r += \",\";\n                Object\
  \ val = Array.get(obj, i);\n                if (cl.getComponentType().isPrimitive())\
  \ r += val;\n                else r += toString(val);\n            }\n         \
  \   return r + \"}\";\n        }\n\n        String r = cl.getName();\n        //\
  \ ... (剩余的实现)\n    }\n}\n```\n\n\n\n\n```java\n// inspect the fields of this class\
  \ and all superclasses\ndo\n{\n    r += \"[\";\n    Field[] fields = cl.getDeclaredFields();\n\
  \    AccessibleObject.setAccessible(fields, true);\n    // get the names and values\
  \ of all fields\n    for (Field f : fields)\n    {\n        if (!Modifier.isStatic(f.getModifiers()))\n\
  \        {\n            if (!r.endsWith(\"[\")) r += \",\";\n            r += f.getName()\
  \ + \"=\";\n            try\n            {\n                Class t = f.getType();\n\
  \                Object val = f.get(obj);\n                if (t.isPrimitive())\
  \ r += val;\n                else r += toString(val);\n            }\n         \
  \   catch (Exception e)\n            {\n                e.printStackTrace();\n \
  \           }\n        }\n    }\n    r += \"]\";\n    cl = cl.getSuperclass();\n\
  }\nwhile (cl != null);\n\nreturn r;\n```\n\n### `java.lang.reflect.AccessibleObject`\
  \ \n\n- `void setAccessible(boolean flag)`: 设置此反射对象的访问权限标志。值为 `true` 时表示抑制 Java\
  \ 语言的访问检查，并且可以查询和设置对象的私有属性。\n- `boolean isAccessible()`: 获取此反射对象的访问权限标志。\n- `static\
  \ void setAccessible(AccessibleObject[] array, boolean flag)`: 用于设置对象数组访问权限标志的便利方法。\n\
  \n### `java.lang.Class`\n\n- `Field getField(String name)`: 获取给定名称的公共字段，或包含所有字段的数组。\n\
  - `Field[] getDeclaredFields()`: 获取在该类中声明的给定名称字段，或包含所有字段的数组。\n\n### `java.lang.reflect.Field`\n\
  \n- `Object get(Object obj)`: 对象 `obj` 中由此 `Field` 对象描述的值。\n- `void set(Object obj,\
  \ Object newValue)`: 将对象 `obj` 中由此 `Field` 对象描述的字段设置为新值。\n\n#### 5.7.5 使用反射编写泛型数组\n\
  \n`java.lang.reflect` 包中的 `Array` 类允许你动态创建数组。这被用于例如 `Arrays` 类中 `copyOf` 方法的实现。回想一下该方法如何用于扩展一个已满的数组：\n\
  \n```java\nEmployee[] a = new Employee[100];\na = Arrays.copyOf(a, a.length);\n\
  ```\n\n如何编写这样一个泛型方法呢？`Employee[]` 数组可以转换为 `Object[]` 数组，这很有帮助。这听起来很有前景。这里是第一次尝试：\n\
  \n```java\npublic static Object[] badCopyOf(Object[] a, int newLength) // 没有用\n\
  {\n    Object[] newArray = new Object[newLength];\n    System.arraycopy(a, 0, newArray,\
  \ 0, Math.min(a.length, newLength));\n    return newArray;\n}\n```\n\n然而，实际使用生成的数组时存在问题。此代码返回的数组类型是对象数组（`Object[]`），因为我们使用\
  \ `new Object[newLength]` 这一行创建了数组。对象数组不能强制转换为 `Employee[]` 数组。虚拟机将生成 `ClassCastException`。点在于，正如我们之前提到的，Java\
  \ 数组会记住其条目的类型——即创建它的它的 `new` 表达式中使用的元素类型。将一个 `Employee[]` 临时强制转换为 `Object[]` 数组然后转换回来是合法的，但一个从初作为\
  \ `Object[]` 数组开始的数组永远无法转换为 `Employee[]` 数组。要编写这种泛型数组代码，我们需要能够创建一个与原始数组相同类型的新数组。为此，我们需要\
  \ `java.lang.reflect` 包中 `Array` 类的方法。关键在于 `Array` 类中用于构造新数组的静态方法 `newInstance`。你必须将条目类型和所需的长度作为参数传递给该方法。\n\
  \n```java\nObject newArray = Array.newInstance(componentType, newLength);\n```\n\
  \n为了实际执行这一操作，我们需要获取新数组的长度和组件类型。我们通过调用 `Array.getLength(a)` 获取长度。`Array` 类的静态方法 `getLength`\
  \ 返回数组的长度。获取新数组的组件类型：\n\n1. 首先，获取 `a` 的类对象。\n2. 确认它确实是一个数组。\n3. 使用 `Class` 类的 `getComponentType`\
  \ 方法（仅为代表数组的类对象定义）找到数组的类型。\n\n为什么 `getLength` 是 `Array` 的方法，而 `getComponentType`\
  \ 是 `Class` 的方法？我们不知道——反射方法的分布有时似乎有些随心所欲。这里是代码：\n\n```java\npublic static Object\
  \ goodCopyOf(Object a, int newLength)\n{\n    Class cl = a.getClass();\n    if (!cl.isArray())\
  \ return null;\n    Class componentType = cl.getComponentType();\n    int length\
  \ = Array.getLength(a);\n    Object newArray = Array.newInstance(componentType,\
  \ newLength);\n    System.arraycopy(a, 0, newArray, 0, Math.min(length, newLength));\n\
  \    return newArray;\n}\n```\n\n注意，这个 `copyOf` 方法可以用于扩展任何类型的数组，而不仅仅是对象数组。\n\n```java\n\
  int[] a = { 1, 2, 3, 4, 5 };\na = (int[]) goodCopyOf(a, 10);\n```\n\n### Listing\
  \ 16: CopyTest.java\n\n```java\npackage arrays;\n\nimport java.lang.reflect.*;\n\
  import java.util.*;\n\n/**\n * 此程序演示了反射的使用。\n * @version 1.2-05-4\n * @author Caymann\n\
  \ */\npublic class CopyTest\n{\n    public static void main(String[] args)\n   \
  \ {\n        int[] a = { 1, 2, 3 };\n        a = (int[]) goodCopyOf(a, 10);\n  \
  \      System.out.println(Arrays.toString(a));\n\n        String[] b = { \"Tom\"\
  , \"Dick\", \"Harry\" };\n        b = (String[]) goodCopyOf(b, 10);\n        System.out.println(Arrays.toString(b));\n\
  \n        System.out.println(\"下面的调用将产生异常。\");\n        b = (String[]) badCopyOf(b,\
  \ 10);\n    }\n}\n```\n\n\n\n\n\n```java\n/**\n * type array\n * @return 一个包含 a\
  \ 中所有元素的更大的数组。\n */\npublic static Object goodCopyOf(Object a, int newLength)\n\
  {\n    Class cl = a.getClass();\n    if (!cl.isArray()) return null;\n    Class\
  \ componentType = cl.getComponentType();\n    int length = Array.getLength(a);\n\
  \    Object newArray = Array.newInstance(componentType, newLength);\n    System.arraycopy(a,\
  \ 0, newArray, 0, Math.min(length, newLength));\n    return newArray;\n}\n```\n\n\
  ### java.lang.reflect.Array 1.1\n\n* `static Object get(Object array, int index)`\n\
  * `static xxx getxx(Object array, int index)`\n(`xxx` 是基本类型 `boolean`、`byte`、`char`、`double`、`float`、`int`、`long`\
  \ 或 `short` 之一。)这些方法返回给定数组中指定索引处的值。\n\n* `static void set(Object array, int index,\
  \ Object newValue)`\n* `static setxx(Object array, int index, xxx newValue)`\n(`xxx`\
  \ 是基本类型 `boolean`、`byte`、`char`、`double`、`float`、`int`、`long` 或 `short` 之一。)这些方法将新值存储在给定数组的指定索引处。\n\
  \n* `static int getLength(Object array)`\n返回给定数组的长度。\n\n* `static Object newInstance(Class\
  \ componentType, int length)`\n* `static Object newInstance(Class componentType,\
  \ int[] lengths)`\n返回一个具有给定维度和给定组件类型的新数组。\n\n### 5.7.6 调用任意方法\n\n在 C 和 C++ 中，你可以通过函数指针执行任意函数。从表面上看，Java\
  \ 并没有方法指针——也就是说，没有将方法的位置传递给另一个方法的方法，以便第二个方法稍后调用它。事实上，Java 的设计者曾表示方法指针是危险且容易出错的，而\
  \ Java `interfaces`（将在下一章讨论）是一个更优越的解决方案。然而，反射机制允许你调用任意方法。\n\n![Image](img/note.jpg)\
  \ 注意\n\n在微软在其 Java 衍生语言添加的非标准语言扩展中，J++ 和 C# 包含了另一种方法指针类型，称为 `delegate`，它与在本节中讨论的\
  \ `Method` 类不同。然而，内部类（我们将在下一章介绍）比委托更有实用的结构。\n\n回想一下，你可以使用 `Field` 类的 `get` 方法检查对象的字段。同样，`Method`\
  \ 类有一个 `invoke` 方法，它允许你调用封装在当前 `Method` 对象中的方法。`invoke` 方法的签名如下：\n\n```java\nObject\
  \ invoke(Object obj, Object... args)\n```\n\n第一个参数是隐式参数，剩余的对象提供了显式参数。\n\n对于静态方法，第一个参数是被忽略的——你可以将其设置为\
  \ `null`。\n\n例如，如果 `m1` 代表 `Employee` 类的 `getName` 方法，下面的代码展示了你如何调用它：\n\n```java\n\
  String n = (String) m1.invoke(harry);\n```\n\n如果返回类型是基本类型，`invoke` 方法将返回相应的包装类型。例如，假设\
  \ `m2` 代表 `Employee` 类的 `getSalary` 方法。那么，返回的对象实际上是一个 `Double`，你必须对其进行相应的类型转换。使用自动拆箱将其转换为\
  \ `double`：\n\n```java\ndouble s = (Double) m2.invoke(harry);\n```\n\n你如何获取 `Method`\
  \ 对象？当然，你可以调用 `getDeclaredMethods` 并遍历返回的 `Method` 对象数组，直到找到你想要的方法为止。或者，你可以调用 `Class`\
  \ 类的 `getMethod` 方法。这类似于 `getField` 方法，`getField` 接受一个带有字段名的字符串并返回一个 `Field` 对象。然而，可能存在多个同名的方法，因此你需要小心获取正确的那一个。出于这个原因，还必须提供参数类型。`getMethod`\
  \ 的签名是：\n\n```java\nMethod getMethod(String name, Class... parameterTypes)\n```\n\
  \n例如，这里是你可以获取 `Employee` 类的 `getName` 和 `raiseSalary` 方法的方法指针：\n\n```java\nMethod\
  \ m1 = Employee.class.getMethod(\"getName\");\nMethod m2 = Employee.class.getMethod(\"\
  raiseSalary\", double.class);\n```\n\n现在你已经了解了 `Method` 对象的规则，让我们让它们用起来吧。`Listing\
  \ 5.17` 是一个程序，用于打印数学函数（如 `Math.sqrt` 或 `Math.sin`）的数值表格。输出结果如下：\n\n```\npublic static\
  \ native double java.lang.Math.sqrt(double)\n1.0000 | 1.0000\n2.0000 | 1.4142\n\
  3.0000 | 1.7321\n4.0000 | 2.0000\n5.0000 | 2.2361\n6.0000 | 2.4495\n7.0000 | 2.6458\n\
  8.0000 | 2.8284\n9.0000 | 3.0000\n10.0000 | 3.1623\n```\n\n\n\n\n\n```java\nMethod\
  \ sqrt = Math.class.getMethod(\"sqrt\", double.class);\n\n// print tables of x-\
  \ and y-values\n\nprintTable(1, 10, 10, square);\nprintTable(1, 10, 10, sqrt);\n\
  \n}\n\n/**\n * Returns the square of a number\n * @param x a number\n * @return\
  \ x squared\n */\npublic static double square(double x)\n{\n    return x * x;\n\
  }\n\n/**\n * Prints a table with x- and y-values for a method\n * @param from the\
  \ lower bound for the x-values\n * @param to the upper bound for the x-values\n\
  \ * @param n the number of rows in the table\n * @param f a method with a double\
  \ parameter and double return value\n */\npublic static void printTable(double from,\
  \ double to, int n, Method f)\n{\n    // print out the method as table header\n\
  \    System.out.println(f);\n\n    double dx = (to - from) / (n - 1);\n\n    for\
  \ (double x = from; x <= to; x += dx)\n    {\n        try\n        {\n         \
  \   double y = (Double) f.invoke(null, x);\n            System.out.printf(\"%10.4f\
  \ | %10.4f%n\", x, y);\n        }\n        catch (Exception e)\n        {\n    \
  \        e.printStackTrace();\n        }\n    }\n}\n```\n\njava.lang.reflect.Method\
  \ `1.1`\n\n- `public Object invoke(Object implicitParameter, Object[] explicitParameters)`\n\
  \n调用此对象描述的方法，传递给定的参数并返回方法产生的值。对于静态方法，请将 `null` 作为隐式参数。使用包装类来传递基本类型值。基本类型返回值必须进行拆箱。\n\
  \n### 5.8 继承的设计提示\n\n我们希望在这一章结束时，提供一些我们在使用继承时发现非常有用的提示。\n\n**1. 将公共操作和字段放在父类中。**\n\
  \n这就是为什么我们将 `name` 字段放入 `Person` 类中，而不是在 `Employee` 和 `Student` 类中重复定义它。\n\n**2.\
  \ 不要使用保护 字段。**\n\n有些程序员认为将实例字段定义为 `protected` 是一个好主意，“以防万一”，这样子类在需要时就可以访问它们。然而，`protected`\
  \ 机制并没有提供多少保护，原因有两个。首先，子类的集合是无界的——任何人都可以创建你类的子类，并编写直接访问 `protected` 字段的代码，从而破坏封装。其次，在\
  \ Java 语言中，同一个包中的所有类都可以访问 `protected` 字段，无论它们是否是子类。然而，`protected` 方法可以用于指示那些尚未准备好用于通用且应该在子类中重新定义的方法。\n\
  \n**3. 使用继承来建模“是”关系。**\n\n继承是一种方便的代码节省工具，但有时人们会过度使用它。例如，假设我们需要 `Contractor` 类。承包工有名字和入职日期，但没有工资。相反，他们按小时付费，而且留的时间不够长到可以获得加薪。人们很容易从\
  \ `Employee` 派生出一个 `Contractor` 子类并添加 `hourlyWage` 字段。\n\n```java\npublic class\
  \ Contractor extends Employee\n{\n    private double hourlyWage;\n    ...\n}\n```\n\
  \n这不是一个好主意，因为现在每个承包商对象既有工资又有薪字段。这会在你实现工资单或税表方法时带来无尽的麻烦。你最终编写的代码比你从不使用继承要多得多。承包商与员工的关系没有通过“是”的测试。承包商并不是员工的特例。\n\
  \n**4. 除非所有继承的方法都有意义，否则不要使用继承。**\n\n假设我们想写一个 `Holiday` 类。显然，每个节日都是一天，而天可以表示为 `GregorianCalendar`\
  \ 类的实例，因此我们可以使用继承。\n\n```java\nclass Holiday extends GregorianCalendar { . . }\n\
  ```\n\n遗憾的是，节日的集合在继承的操作下是不封闭的。`GregorianCalendar` 的公共方法之一是 `add`。而 `add` 可以将节日变成非节日：\n\
  \n```java\nHoliday christmas;\nchristmas.add(DAY_OF_MONTH, 12);\n```\n\n因此，在这个例子中使用继承是不合适的。请注意，如果你扩展的是\
  \ `LocalDate`，这个问题就不会出现。因为该类是不可变的，没有哪个方法可以将节日变成非节日。\n\n**5. 在重写方法时不要改变预期的行为。**\n\
  \n替换原则不仅适用于语法，更重要的是适用于行为。当你重写一个方法时，你不应该无理地改变它的行为。编译器无法帮助你——它无法检查你的重定义是否有意义。例如，你可以通过重新定义\
  \ `add` 方法来“修复” `Holiday` 类中 `add` 方法的问题，也许可以什么都不做，或者抛出异常，或者跳转到下一个节日。\n\n然而，这种修复违反了替换原则。以下语句序列：\n\
  \n```java\nint d1 = x.get(Calendar.DAY_OF_MONTH);\nx.add(DAY_OF_MONTH, 1);\nint\
  \ d2 = x.get(Calendar.DAY_OF_MONTH);\nSystem.out.println(d2 - d1);\n```\n\n应该具有预期的行为，无论\
  \ `x` 的类型是 `GregorianCalendar` 还是 `Holiday`。\n\n当然，问题就在于此。合理和不合理的人可以对预期行为进行长时间争论。例如，一些作者认为替换原则要求\
  \ `Manager.equals` 忽略 `bonus` 字段，因为 `Employee.equals` 忽略了它。如果这些讨论是在真空中进行的，它们毫无意义。归根结底，重要的是你在子类中重写方法时不要背离设计的意图。\n\
  \n**6. 使用多态而不是类型信息。**\n\n每当你发现如下形式的代码时：\n\n```java\nif (x is of type 1)\n    action1;\n\
  else if (x is of type 2)\n    action2;\n```\n\n考虑多态。`action[1]` 和 `action[2]` 代表一个共同的概念吗？如果是，让该概念成为两个类型的共同父类或接口的方法。然后，你只需要调用\n\
  \n`x.action();`\n\n并让多态固有的动态分发机制启动正确的操作。使用多态方法或接口实现的代码比使用多个类型测试要容易维护和扩展。\n\n**7.\
  \ 不要过度使用反射。**\n\n反射机制允许通过运行时检测字段和方法来编写具有极大通用性的程序。这种能力对于系统编程有用，但通常不适用于应用程序。反射是脆弱的——使用它时，编译器无法帮助你发现编程错误。任何错误都在运行时发现并导致异常。\n\
  \n你现在已经了解了 Java 如何支持面向对象编程的基础：类、继承和多态。在下一章中，我们将解决两个对于有效使用 Java 至关重要的高级话题：接口和 Lambda\
  \ 表达式。\n\n\n\n\n\n你已经学习了 Java 面向对象编程的基本工具。本章将为你介绍几种常用的高级技术。尽管这些技术并不显而易见，但你将掌握它们来完善你的\
  \ Java 工具箱。\n\n第一种技术称为 `interfaces`（接口），它是描述类应该“做什么”的方法，而不指定它们应该“如何”做。一个类可以 `implement`（实现）一个或多个接口。当需要符合接口时，你可以使用这些实现类的对象。在介绍完接口之后，我们将转向\
  \ `lambda expressions`（Lambda 表达式），这是一种以后某个时刻执行代码块的简洁方式。使用 `lambda expressions`，你可以用优雅且简洁的方式使用回调或变量行为的代码。\n\
  \n然后我们讨论 `inner classes`（内部类）的机制。内部类在技术上有点复杂——它们被定义在其他类内部，其方法可以访问外部类的字段。当你设计一组协作的类时，内部类非常有用。\n\
  \n本章以对 `proxies`（代理）的讨论结束，代理是实现任意接口的对象。代理是一种特殊的结构，用于构建系统级工具。第一次阅读时，你可以安全地跳过该部分。\n\
  \n### 6.1 接口\n\n在接下来的章节中，你将学习 Java 接口以及如何使用它们。你还将发现接口在 Java SE 8 中变得更加强大。\n\n####\
  \ 6.1.1 接口概念\n\n在 Java 编程语言中，接口不是类，而是对想要符合接口的类定义的 `requirements`（要求）。\n\n通常，某些服务的提供者会：“如果你的类符合特定的接口，我就执行该服务。”让我们来看一个例子。`Arrays`\
  \ 类的 `sort` 方法承诺对对象数组进行排序，但有一个条件：对象必须属于实现了 `Comparable` 接口的类。\n\n以下是 `Comparable`\
  \ 接口的样子：\n\n点击查看代码图片\n\n```java\npublic interface Comparable\n{\n   int compareTo(Object\
  \ other);\n}\n```\n\n这意味着任何实现 `Comparable` 接口的类都要求有一个 `compareTo` 方法，且该方法必须接受一个\
  \ `Object` 参数并返回一个整数。\n\n* * *\n\n![Image](img/note.jpg) 注意\n\n从 Java SE 5.0 开始，`Comparable`\
  \ 接口被增强为泛型类型。\n\n点击查看代码图片\n\n```java\npublic interface Comparable<T>\n{\n   int\
  \ compareTo(T other); // 参数类型为 T\n}\n```\n\n例如，实现 `Comparable<Employee>` 的类必须提供一个方法\n\
  \n```java\nint compareTo(Employee other)\n```\n\n你仍然可以使用不带类型参数的“原始” `Comparable`\
  \ 类型。此时，`compareTo` 方法的参数类型为 `Object`，你必须手动将 `compareTo` 方法的该参数强制类型转换为所需的类型。我们会在短时间内这样做，这样你就不需要同时担心两个新概念了。\n\
  \n* * *\n\n接口的所有方法都自动是 `public`（公有））。正由于这个原因，在接口中声明方法时没有必要提供 `public` 关键字。\n\n当然，还有一个接口无法显式写出的额外要求：当在调用\
  \ `x.compareTo(y)` 时，`compareTo` 方法实际上必须能够 `compare` 两个对象，并返回 `x` 或 `y` 哪个更大的指示。如果\
  \ `x` 小于 `y`，该方法应该返回负数；如果它们相等，则返回 0；否则返回正数。\n\n这个特定的接口只有一个方法。有些接口有多个方法。正如你以后将看到的，接口还可以定义常量。然而，更重要的是接口\
  \ `cannot` 提供的内容。接口永远没有实例字段。在 Java SE 8 之前，接口中从没有实现的方法。（正如你在第 6.1.4 节 中看到的，“静态方法](#ch04.html_ch04lev2sec19)”位于第\
  \ 298 页以及第 6.1.5 节 中的“默认方法”位于第 298 页，现在可以在接口中提供简单的方法。当然，这些方法不能引用实例字段——接口没有任何实例字段。）\n\
  \n提供实例字段以及操作这些字段的方法是实现接口的类的任务。你可以将接口 类似于没有实例字段的抽象类。然而，这两个概念之间存在一些差异——我们稍后会详细讨论。\n\
  \n现在假设我们想使用 `Arrays` 类的 `sort` 方法对一个 `Employee` 对象数组进行排序。那么 `Employee` 类必须 `implement`\
  \ `Comparable` 接口。\n\n要让一个类实现接口，你需要执行两个步骤：\n\n**1.** 你声明你的类意图实现给定的接口。\n\n**2.**\
  \ 你为接口中的所有方法提供定义。\n\n要声明一个类实现接口，使用 `implements` 关键字：\n\n点击查看代码图片\n\n```java\nclass\
  \ Employee implements Comparable\n```\n\n当然，现在 `Employee` 类需要提供 `compareTo` 方法。假设我们想按工资比较员工。这里是\
  \ `compareTo` 方法的一个实现：\n\n点击查看代码图片\n\n```java\npublic int compareTo(Object otherObject)\n\
  {\n   Employee other = (Employee) otherObject;\n   return Double.compare(salary,\
  \ other.salary);\n}\n```\n\n在这里，我们使用了静态的 `Double.compare` 方法，如果第一个参数小于第二个参数，它返回负数，如果它们相等则返回\
  \ `0`，否则返回正值。\n\n* * *\n\n![Image](img/caution.jpg) 注意\n\n在接口声明中，`compareTo` 方法没有被声明为\
  \ `public`，因为 `interface` 中的所有方法自动是公有的。然而，在实现接口时，你必须将方法声明为 `public`。否则，编译器会假设该方法具有包可见性——这是\
  \ `class` 的默认权限。编译器随后会抱怨你正试图提供更高的访问权限。\n\n* * *\n\n我们可以通过为泛型 `Comparable` 接口提供类型参数来做得更好：\n\
  \n点击查看代码图片\n\n```java\nclass Employee implements Comparable<Employee>\n{\n   public\
  \ int compareTo(Employee other)\n   {\n      return Double.compare(salary, other.salary);\n\
  \   }\n   ...\n}\n```\n\n注意，`Object` 参数难看的强制转换消失了。\n\n* * *\n\n![Image](img/tip.jpg)\
  \ 提示\n\n`Comparable` 接口的 `compareTo` 方法返回一个整数。如果对象不相等，你返回什么负数或正数并不重要。这种灵活性在比较整数字段时非常有用。例如，假设每个员工都有一个唯一的整数\
  \ `id`，你想按员工 ID 排序。那么你可以简单地返回 `id - other.id`。如果第一个 ID 小于另一个，该值将是某个负值；如果它们相同则返回\
  \ 0；否则返回某个正值。然而，有一个警告：整数范围必须足够小，以便减法不会溢出。如果你知道 ID 不是负数，或者它们的绝对值最多为 `(Integer.MAX_VALUE\
  \ - 1) / 2`，那么就是安全的。否则，调用静态的 `Integer.compare` 方法。\n\n当然，减法技巧并不浮点数。`salary - other.salary`\
  \ 的差在工资接近但并不相同时可能会被舍入为 `0`。调用 `Double.compare(x, y)` 只在 `x < y` 时返回 `-1`，在 `x >\
  \ y` 时返回 `1`。\n\n* * *\n\n* * *\n\n\n\n\n\n`Comparable` 接口的文档建议 `compareTo` 方法应该与\
  \ `equals` 方法兼容。也就是说，恰当 `x.equals(y)` 为真时，`x.compareTo(y)` 应等于 0。Java API 中大多数实现\
  \ `Comparable` 的类都遵循这一建议。一个显著例外是 `BigDecimal`。考虑 `x = new BigDecimal(\"1.0\")` 和\
  \ `y = new BigDecimal(\"1.00\")`。此时 `x.equals(y)` 为 `false`，因为这两个数的精度不同。但 `x.compareTo(y)`\
  \ 等于 0。理想情况下，它不应该是如此，但并没有明显的方法来决定哪一个应该排在前面。\n\n* * *\n\n现在你看到了一个类为了利用排序服务必须做什么——它必须实现一个\
  \ `compareTo` 方法。这非常合理。`sort` 方法确实需要某种方式来比较对象。但为什么 `Employee` 类不能在不实现 `Comparable`\
  \ 接口的情况下直接提供一个 `compareTo` 方法呢？\n\n引入接口的原因是 Java 编程语言是*强类型*的。在调用方法时，编译器需要能够检查该方法是否存在。在\
  \ `sort` 方法的某处会有类似下面的语句：\n\n```\nif (a[i].compareTo(a[j]) > 0)\n{\n    // rearrange\
  \ a[i] and a[j]\n    ...\n}\n```\n\n编译器必须知道 `a[i]` 确实有一个 `compareTo` 方法。如果 `a` 是一个\
  \ `Comparable` 对象的数组，那么该方法的存在性就有保证，因为每个实现 `Comparable` 接口的类都提供该方法。\n\n* * *\n\n\
  ![Image](img/note.jpg) 备注\n\n你可能认为 `Arrays` 类中的 `sort` 方法定义为接受一个 `Comparable[]`\
  \ 数组，这样如果有人用一个元素类型没有实现 `Comparable` 接口的数组调用 `sort`，编译器就会报错。遗憾的是，事实并非如此。`sort` 方法接受一个\
  \ `Object[]` 数组并使用笨拙的强制转换：\n\n点击此处查看代码图片\n\n```java\n// 标准库中使用的方法--不推荐\nif (((Comparable)\
  \ a[i]).compareTo(a[j]) > 0)\n{\n    // rearrange a[i] and a[j]\n    ...\n}\n```\n\
  \n如果 `a[i]` 不属于实现 `Comparable` 接口的类，虚拟机将抛出异常。\n\n* * *\n\n代码列表 6.1 展示了排序 `Employee`\
  \ 类实例数组的完整代码（代码列表 6.2）。\n\n**代码列表 6.1** `interfaces/EmployeeSortTest.java`\n\n点击此处查看代码图片\n\
  \n* * *\n\n```java\n1    package interfaces;\n2\n3    import java.util.*;\n4\n5\
  \    /**\n6      * 此程序演示了 Comparable 接口的使用。\n7      * @version 1.30 2004-02-27\n\
  8      * @author Cay Horstmann\n9      */\n10   public class EmployeeSortTest\n\
  11   {\n12       public static void main(String[] args)\n13       {\n14        \
  \   Employee[] staff = new Employee[3];\n15\n16          staff[0] = new Employee(\"\
  Harry Hacker\", 35000);\n17          staff[1] = new Employee(\"Carl Cracker\", 75000);\n\
  18          staff[2] = new Employee(\"Tony Tester\", 38000);\n19\n20          Arrays.sort(staff);\n\
  21\n22          // 打印所有 Employee 对象的信息\n23          for (Employee e : staff)\n24\
  \              System.out.println(\"name=\" + e.getName() + \",salary=\" + e.getSalary());\n\
  25       }\n26   }\n```\n\n* * *\n\n**代码列表 6.2** `interfaces/Employee.java`\n\n\
  点击此处查看代码图片\n\n* * *\n\n```java\n1    package interfaces;\n2\n3    public class Employee\
  \ implements Comparable<Employee>\n4   {\n5       private String name;\n6      \
  \ private double salary;\n7\n8       public Employee(String name, double salary)\n\
  9       {\n10          this.name = name;\n11          this.salary = salary;\n12\
  \      }\n13\n14      public String getName()\n15      {\n16          return name;\n\
  17      }\n18\n19      public double getSalary()\n20      {\n21          return\
  \ salary;\n22      }\n23\n24      public void raiseSalary(double byPercent)\n25\
  \      {\n26          double raise = salary * byPercent / 100;\n27          salary\
  \ += raise;\n28      }\n29\n30      /**\n31      * 按工资比较员工\n32      * @param other\
  \ 另一个对象\n33      * @return 如果此员工的工资比另一个低，则返回负值；\n34      * 如果工资相同则返回 0，否则返回正值\n\
  35      */\n36      public int compareTo(Employee other)\n37      {\n38        \
  \  return Double.compare(salary, other.salary);\n39      }\n40  }\n```\n\n* * *\n\
  \n`Comparable<T>` 1.0\n`int compareTo(T other)` 与 `other` 比较。如果此对象小于 `other` 则返回负整数，如果相等则返回\
  \ 0，否则返回正整数。\n\n`java.util.Arrays` 1.2\n`static void sort(Object[] a)` 排序数组 `a`\
  \ 中的元素。数组中的所有元素都必须是相互可比较的。\n\n* * *\n\n`java.lang.Integer` 1.0\n`static int compare(int\
  \ x, int y)` 如果 `x < y` 返回负整数，如果 `x == y` 返回 0，否则返回正整数。\n\n* * *\n\n`java.lang.Double`\
  \ 1.0\n`static int compare(double x, double y)` 如果 `x < y` 返回负整数，如果 `x == y` 返回\
  \ 0，否则返回正整数。\n\n* * *\n\n![Image](img/note.jpg) 备注\n\n根据语言标准：“实现者必须确保 `sgn(x.compareTo(y))\
  \ = -sgn(y.compareTo(x))` 对于所有 `x` 和 `y` 成立（这意味着如果 `y.compareTo(x)` 抛出异常，`x.compareTo(y)`\
  \ 也必须抛出异常）。”这里 `sgn` 是数字的符号：如果 `n` 为负则返回 -1，如果 `n` 为 0 则返回 0，如果 `n` 为正则返回 1。通俗地说，如果你反转了\
  \ `compareTo` 的参数，结果的符号（但不一定是实际数值）也随之反转。\n\n与 `equals` 方法一样，当涉及继承时会出现问题。\n\n由于 `Manager`\
  \ 继承自 `Employee`，它实现了 `Comparable<Employee>` 而不是 `Comparable<Manager>`。如果 `Manager`\
  \ 选择重写 `compareTo`，它必须准备好与员工比较。它不能简单地将员工强制转换为经理：\n\n点击此处查看代码图片\n\n```java\nclass\
  \ Manager extends Employee\n{\n    public int compareTo(Employee other)\n    {\n\
  \        Manager otherManager = (Manager) other; // 不行\n        ...\n    }\n}\n\
  ```\n\n这违反了“反对性”规则。如果 `x` 是一个 `Employee` 且 `y` 是一个 `Manager`，那么调用 `x.compareTo(y)`\
  \ 不会抛出异常——它只是作为员工比较 `x` 和 `y`。但反过来，`y.compareTo(x)` 会抛出 `ClassCastException`。\n\n\
  #### 6.1.2 接口的属性\n\n接口不是类。特别是，你永远无法使用 `new` 运算符实例化接口：\n\n点击此处查看代码图片\n\n\n\n\n\n\
  ```java\nx = new Comparable(. . .); // ERROR\n```\n\n然而，尽管你无法构造接口对象，你仍然可以声明接口变量。\n\
  \n```java\nComparable x; // OK\n```\n\n接口变量必须引用实现该接口的类的对象：\n\n点击此处查看代码图片\n\n```java\n\
  x = new Employee(. . .); // 只要 Employee 实现了 Comparable 即可 OK\n```\n\n接下来，就像你使用 `instanceof`\
  \ 来检查对象是否属于特定类一样，你可以使用 `instanceof` 来检查一个对象是否实现了某个接口：\n\n点击此处查看代码图片\n\n```java\n\
  if (anObject instanceof Comparable) { . . . }\n```\n\n就像你可以构建类的层次结构一样，你也可以扩展接口。这允许创建多条接口链，从更具通用性到更具特化性。例如，假设你有一个名为\
  \ `Moveable` 的接口。\n\n点击此处查看代码图片\n\n```java\npublic interface Moveable\n{\n   void\
  \ move(double x, double y);\n}\n```\n\n然后，你可以想象有一个名为 `Powered` 的接口扩展了它：\n\n点击此处查看代码图片\n\
  \n```java\npublic interface Powered extends Moveable\n{\n   double milesPerGallon();\n\
  }\n```\n\n虽然你不能在接口中放置实例字段或静态方法，但你可以在其中提供常量。例如：\n\n点击此处查看代码图片\n\n```java\npublic\
  \ interface Powered extends Moveable\n{\n   double milesPerGallon();\n   double\
  \ SPEED_LIMIT = 95; // 一个 public static final 常量\n}\n```\n\n就像接口中的方法自动是 `public`\
  \ 的一样，字段始终是 `public static final`。\n\n***\n\n![Image](img/note.jpg) 注意\n\n将接口方法标记为\
  \ `public`、将字段标记为 `public static final` 是合法的。一些程序员会这样做，可能是出于习惯或为了更清晰。然而，Java 语言规范建议不要提供冗余的关键字，我们也遵循了这一建议。\n\
  \n***\n\n有些接口只定义常量而没有方法。例如，标准库包含一个名为 `SwingConstants` 的接口，它定义了常量 `NORTH`、`SOUTH`、`HORIZONTAL`\
  \ 等。任何选择实现 `SwingConstants` 接口的类都会继承这些常量。它的方法可以直接引用 `NORTH`，而不是更繁琐的 `SwingConstants.NORTH`。然而，这种对接口的使用似乎相当退化，我们不建议这样做。\n\
  \n虽然每个类只能有一个超类，但类可以实现*多个*接口。这让你在定义类的行为时具有最大的灵活性。例如，Java 编程语言在其内部内置了一个重要的接口，称为 `Cloneable`。（我们将在第\
  \ 6.2.3 节“对象克隆”中详细讨论该接口，位于第 306 页）。如果你的类实现了 `Cloneable`，`Object` 类中的 `clone` 方法将为你的类创建一个精确的副本。如果你同时需要可克隆性和可比较性，只需实现这两个接口即可。使用逗号分隔你想要实现的接口：\n\
  \n点击此处查看代码图片\n\n```java\nclass Employee implements Cloneable, Comparable\n```\n\n\
  ### 6.1.3 接口与抽象类\n\n如果你阅读了第 5 章中关于抽象类的章节，你可能会奇怪为什么 Java 语言的设计者要费心引入接口的概念。为什么 `Comparable`\
  \ 不能简单地是一个抽象类呢：\n\n点击此处查看代码图片\n\n```java\nabstract class Comparable // 为什么不能呢？\n\
  {\n   public abstract compareTo(Object other);\n}\n```\n\n`Employee` 类将扩展这个抽象类并提供\
  \ `compareTo` 方法：\n\n点击此处查看代码图片\n\n```java\nclass Employee extends Comparable //\
  \ 为什么不能呢？\n{\n   public int compareTo(Object other) { . . . }\n}\n```\n\n遗憾的是，使用抽象类来表达通用属性有一个主要问题。一个类只能扩展一个类。假设\
  \ `Employee` 类已经扩展了另一个类，比如 `Person`。那么它就不能扩展第二个类了。\n\n点击此处查看代码图片\n\n```java\nclass\
  \ Employee extends Person, Comparable // 错误\n```\n\n但每个类都可以想要实现任意数量的接口：\n\n点击此处查看代码图片\n\
  \n```java\nclass Employee extends Person implements Comparable // OK\n```\n\n其他编程语言，特别是\
  \ C++，允许类拥有多个超类。这一特征被称为*多重继承*。Java 的设计者选择不支持多重继承，因为这会使语言变得非常复杂（如 C++）或者效率更低（如 Eiffel）。相反，接口提供了多重继承的大部分优势。\n\
  \n***\n\n![Image](img/note1.jpg) 注意\n\nC++ 有多重继承以及随之而来的所有复杂性，例如虚基类、支配规则和强制类型转换。很少有\
  \ C++ 程序员使用多重继承，有些人建议永远不要使用。建议多重继承仅用于“混合（mix-in）”。在混合样式中，主基类描述对象，而附加基类（所谓的 mixins）提供辅助特征。\n\
  \n### 6.1.4 静态方法\n\n从 Java 8 开始，允许向接口中添加静态方法。以前并没有技术原因禁止这样做。它只是违背了接口作为抽象规范的精神。到目前，将静态方法放在工具类是很常见的。在标准库中，你会发现接口与工具类的组合，如\
  \ `Collection`/`Collections` 或 `Path`/`Paths`。看看 `Paths` 类。它只有几个工厂方法。你可以从一系列字符串构造指向文件或目录的路径，例如\
  \ `Paths.get(\"jdk.8\", \"jre\", \"bin\")`。在 Java 中可以将此方法添加到 `Path` 接口：\n\n点击此处查看代码图片\n\
  \n```java\npublic interface Path\n{\n   public static Path get(String first, String...\
  \ more) {\n      return FileSystems.getDefault().getPath(first, more);\n   }\n \
  \  ...\n}\n```\n\n那么 `Paths` 类就不再需要了。\n\nJava 库可能会以这种方式重构，但当你实现自己的接口时，没有理由为工具方法提供单独的辅助类。\n\
  \n### 6.1.5 默认方法\n\n你可以为任何接口方法提供*默认*实现。你必须用 `default` 修饰符标记此类方法。\n\n点击此处查看代码图片\n\
  \n```java\npublic interface Comparable<T>\n{\n   default int compareTo(T other)\
  \ { return 0; }\n   // 默认情况下，元素是相同的\n}\n```\n\n当然，这没什么用，因为每个真实的 `Comparable` 实现都会覆盖这个方法。但在其他情况下，默认方法是有用的。例如，正如你在第\
  \ 11 章中看到的，如果你希望在发生点击时收到通知，你需要实现一个包含五个方法的接口：\n\n点击此处查看代码图片\n\n```java\npublic interface\
  \ MouseListener\n{\n   void mouseClicked(MouseEvent event);\n   void mousePressed(MouseEvent\
  \ event);\n   void mouseReleased(MouseEvent event);\n   void mouseEntered(MouseEvent\
  \ event);\n   void mouseExited(MouseEvent event);\n}\n```\n\n\n\n\n\n大多数情况下，你只关心这些事件类型中的一种或两种。从\
  \ Java SE 8 开始，你可以将所有方法声明为不执行任何操作的默认方法（default methods）。\n\n点击此处查看代码\n\n```java\n\
  public interface MouseListener\n{\n   default void mouseClicked(MouseEvent event)\
  \ {}\n   default void mousePressed(MouseEvent event) {}\n   default void mouseReleased(MouseEvent\
  \ event) {}\n   default void mouseEntered(MouseEvent event) {}\n   default void\
  \ mouseExited(MouseEvent event) {}\n}\n```\n\n这样实现此接口的程序员只需要重写他们真正关心的事件的监听器。\n\n\
  默认方法可以调用其他方法。例如，`Collection` 接口可以定义一个便利方法：\n\n点击此处查看代码\n\n```java\npublic interface\
  \ Collection\n{\n   int size(); // 一个抽象方法\n   default boolean isEmpty()\n   {\n\
  \        return size() == 0;\n   }\n   ...\n}\n```\n\n那么，实现 `Collection` 的程序员就不必担心实现\
  \ `isEmpty` 方法了。\n\n* * *\n\n![Image](img/note.jpg) 注意\n\n在 Java API 中，你会发现许多接口都有对应的类，这些类实现了接口的部分或全部方法，例如\
  \ `Collection/AbstractCollection` 或 `MouseListener/MouseAdapter`。在 Java SE 8 中，这种技术已经过时了。只需实现接口中的方法即可。\n\
  \n* * *\n\n默认方法的一个重要用途是*接口演进*（interface evolution）。以在 Java 中存在了多年的 `Collection`\
  \ 接口为例。假设在很久以前，你提供了一个类：\n\n点击此处查看代码\n\n```java\npublic class Bag implements Collection\n\
  ```\n\n后来，在 Java SE 8 中，接口中添加了一个 `stream` 方法。\n\n假设 `stream` 方法不是默认方法。那么 `Bag` 类将无法编译，因为它没有实现这个新方法。在接口中添加非默认方法并不是*源码兼容的*（source\
  \ compatible）。\n\n但假设假设你没有重新编译该类，而是简单地使用包含该类的旧 JAR 文件。即使缺少该方法，该类仍然可以加载。程序仍然可以构造\
  \ `Bag` 实例，不会发生任何坏事。（向接口添加方法是*二进制兼容的*（binary compatible）。）然而，如果程序对 `Bag` 实例调用 `stream`\
  \ 方法，就会发生 `AbstractMethodError`。\n\n将方法设为 `default` 方法解决了这两个问题。`Bag` 类将再次编译。如果类在没有重新编译的情况下被加载，并在\
  \ `Bag` 实例上调用 `stream` 方法，则会调用 `Collection.stream` 方法。\n\n### 6.1.6 解析默认方法的冲突\n\n\
  如果完全相同的方法在一个接口中被定义为默认方法，然后又作为父类或另一个接口的方法定义，会发生什么？Scala 和 C++ 等语言对解决此类歧义有复杂的规则。幸运的是，Java\
  \ 的规则要简单得多。规则如下：\n\n**1. 超类胜出。** 如果超类提供了一个具体方法，则同名且参数类型相同的默认方法将被直接忽略。\n\n**2. 接口冲突。**\
  \ 如果父接口提供了一个默认方法，而另一个接口提供了相同名称和参数类型的方法（无论是否是默认方法），则你必须通过重写该方法来解决冲突。\n\n让我们来看第二条规则。考虑另一个带有\
  \ `getName` 方法的接口：\n\n点击此处查看代码\n\n```java\ninterface Named\n{\n   default String\
  \ getName() { return getClass().getName() + \"_\" + hashCode(); }\n}\n```\n\n如果你形成一个同时实现这两个接口的类会发生什么？\n\
  \n点击此处查看代码\n\n```java\nclass Student implements Person, Named\n{\n   ...\n}\n```\n\
  \n该类继承了由 `Person` 和 `Named` 接口提供的两个不一致的 `getName` 方法。Java 编译器并没有在其中选择一个，而是报告一个错误，让程序员来解决这个歧义。只需在\
  \ `Student` 类中提供一个 `getName` 方法即可。在该方法中，你可以选择两个冲突方法中的一个，如下：\n\n点击此处查看代码\n\n```java\n\
  class Student implements Person, Named\n{\n   public String getName() { return Person.super.getName();\
  \ }\n   ...\n}\n```\n\n现在假设 `Named` 接口没有为 `getName` 提供默认实现：\n\n```java\ninterface\
  \ Named\n{\n   String getName();\n}\n```\n\n`Student` 类可以继承来自 `Person` 接口的默认方法吗？这可能是合理的，但\
  \ Java 设计者决定倾向于统一性。两个接口如何冲突并不重要。只要至少有一个接口提供了实现，编译器就会报告错误，程序员就必须解决该歧义。\n\n* * *\n\
  \n![Image](img/note.jpg) 注意\n\n当然，如果两个接口都没有为共享方法提供默认实现，那么我们处于 Java 8 之前的状态，并且没有冲突。实现类有两个选择：实现该方法，或者留空不实现。在后一种情况下，该类是抽象的。\n\
  \n* * *\n\n我们刚刚讨论了两个接口之间的命名冲突。现在考虑一个扩展父类并实现接口的类，例如，假设 `Person` 是一个类而 `Named` 是一个接口：\n\
  \n点击此处查看代码\n\n```java\nclass Student extends Person implements Named\n```\n\n在这种情况下，`Student`\
  \ 继承了 `Person` 的 `getName` 方法，无论 `Named` 接口是否为其提供了默认实现都无所谓。这就是“类胜出”规则。“类胜出”规则确保了与\
  \ Java 7 的兼容性。如果你向接口添加默认方法，对之前的代码没有影响。\n\n* * *\n\n![Image](img/caution.jpg) 注意\n\
  \n你永远无法无法重定义 `Object` 类中方法的默认方法。例如，你无法为 `toString` 或 `equals` 定义默认方法，尽管这对于 `List`\
  \ 等接口可能很有吸引力。由于“类胜出”规则，这种方法永远无法通过 `Object.toString` 或 `Object.equals`。\n\n* * *\n\
  \n## 6.2 接口示例\n\n在接下来的三个章节中，我们将提供额外的接口示例，以便你看到它们是如何使用的。\n\n#### 6.2.1 接口与回调\n\n\
  编程中的一种模式是*回调*（callback）模式。在这种模式中，你指定当特定事件发生时应该执行的操作。例如，你可能希望在点击按钮或选择菜单项时执行特定的操作。然而，由于你还没有学习如何实现用户界面，我们将考虑一个类似但更简单的情况。\n\
  \n`javax.swing` 包包含一个 `Timer` 类，它在你希望时间间隔结束时收到通知时非常有用。例如，如果程序的某个部分包含时钟，你可以请求每秒通知一次，以便更新时钟界面。\n\
  \n当你构造定时器时，你设置时间间隔，并告诉它在时间间隔结束时应该做什么。\n\n你如何告诉定时器它应该做什么呢？在许多编程语言中，你提供定时器定期调用的函数名称。然而，Java\
  \ 标准库中的类采用了面向对象的方法。你传递某个类的对象。定时器随后调用该对象上的一个方法。传递对象比传递函数更灵活，因为对象可以携带额外信息。\n\n\n\n\
  \n\n当然，定时器需要知道调用哪种方法。定时器要求你指定一个实现了 `java.awt.event` 包中 `ActionListener` 接口的类对象。这里是该接口：\n\
  \n点击此处查看代码图像\n\n```java\npublic interface ActionListener\n{\n   void actionPerformed(ActionEvent\
  \ event);\n}\n```\n\n当时间间隔结束时，定时器会调用 `actionPerformed` 方法。\n\n假设你想每隔 10 秒打印一次“音调响起，时间是……”的消息，随后是一声“哔”声。你需要定义一个实现\
  \ `ActionListener` 接口的类。然后，你把任何想要执行的语句放在 `actionPerformed` 方法中。\n\n点击此处查看代码图像\n\n\
  ```java\nclass TimePrinter implements ActionListener\n{\n    public void actionPerformed(ActionEvent\
  \ event)\n    {\n        System.out.println(\"At the tone, the time is \" + new\
  \ Date());\n        Toolkit.getDefaultToolkit().beep();\n    }\n}\n```\n\n注意 `actionPerformed`\
  \ 方法的 `ActionEvent` 参数。该参数提供了有关事件的信息，例如产生事件的源对象——更多信息请参见第 11 章。然而，在这个程序中，事件的详细信息并不重要，你可以安全地忽略该参数。\n\
  \n接下来，你构造该类的对象，并将其传递给 `Timer` 构造函数。\n\n点击此处查看代码图像\n\n```java\nActionListener listener\
  \ = new TimePrinter();\nTimer t = new Timer(10000, listener);\n```\n\n`Timer` 构造函数的第一个参数是两次通知之间必须经过间隔，以毫秒为单位。我们希望每\
  \ 10 秒被通知一次。第二个参数是监听器对象。\n\n最后，你启动定时器。\n\n```java\nt.start();\n```\n\n每隔 10 秒，就会显示如下消息：\n\
  \n点击此处查看代码图像\n\nAt the tone the time is Wed Apr 13 23:29:08 PDT 2016\n\n随后是一声“哔”声。\n\
  \n列表 6.3 让定时器及其动作监听器开始工作。定时器启动后，程序会弹出一个消息框，等待用户点击 OK 按钮停止。在程序等待用户期间，当前时间会每隔 10 秒显示一次。\n\
  \n运行程序时请保持耐心。“退出程序？”对话框会立即出现，但第一个定时器消息会在 10 秒后才会显示。\n\n注意，程序除了导入 `javax.swing.*`\
  \ 和 `java.util.*` 之外，还通过类名导入了 `javax.swing.Timer` 类。这消除了 `javax.swing.Timer` 和 `java.util.Timer`\
  \ 之间的歧义，后者是一个用于调度后台任务的无关类。\n\n**列表 6.3** `timer/TimerTest.java`\n\n点击此处查看代码图像\n\n\
  ```java\n 1   package timer;\n 2\n 3   /**\n 4       @version 1.01 2015-05-12\n\
  \ 5       @author Cay Horstmann\n 6   */\n 7\n 8   import java.awt.*;\n 9   import\
  \ java.awt.event.*;\n10   import java.util.*;\n11   import javax.swing.*;\n12  \
  \ import javax.swing.Timer;\n 13   // to resolve conflict with java.util.Timer\n\
  \ 14\n 15   public class TimerTest\n16   {\n 17       public static void main(String[]\
  \ args)\n 18       {\n 19           ActionListener listener = new TimePrinter();\n\
  \ 20\n 21           // construct a timer that calls the listener\n 22          \
  \ // once every 10 seconds\n 23           Timer t = new Timer(10000, listener);\n\
  \ 24           t.start();\n 25\n 26           JOptionPane.showMessageDialog(null,\
  \ \"Quit program?\");\n 27           System.exit(0);\n 28       }\n 29   }\n 30\n\
  \ 31   class TimePrinter implements ActionListener\n 32   {\n 33       public void\
  \ actionPerformed(ActionEvent event)\n 34       {\n 35           System.out.println(\"\
  At the tone, the time is \" + new Date());\n 36           Toolkit.getDefaultToolkit().beep();\n\
  \ 37       }\n 38   }\n```\n\n- `javax.swing.JOptionPane`: `static void showMessageDialog(Component\
  \ parent, Object message)` 显示一个带有消息提示和 OK 按钮的对话框。该对话框相对于 `parent` 组件居中显示。如果 `parent`\
  \ 为 `null`，对话框在屏幕上居中。\n- `javax.swing.Timer`:\n    - `Timer(int interval, ActionListener\
  \ listener)` 构造一个定时器，每隔 `interval` 毫秒通知一次 `listener`。\n    - `void start()` 启动定时器。一旦启动，定时器就会对它的监听器调用\
  \ `actionPerformed`。\n    - `void stop()` 停止定时器。一旦停止，定时器不再对它的监听器调用 `actionPerformed`。\n\
  - `java.awt.Toolkit`:\n    - `static Toolkit getDefaultToolkit()` 获取默认工具包。\n   \
  \ - `void beep()` 发出“哔”声。\n\n### 6.2.2 Comparator 接口\n\n在第 6.1 节中，你已经看到可以使用 `Comparable`\
  \ 接口对数组进行排序。现在我们想按长度对字符串进行排序，而不是按字典序。为了处理这种情况，`Arrays.sort` 方法有一个重载版本——其参数是实现 `Comparator`\
  \ 接口的类。\n\n点击此处查看代码图像\n\n```java\npublic interface Comparator<T>\n{\n   int compare(T\
  \ o1, T o2);\n}\n```\n\n要按比较字符串，定义一个实现 `Comparator` 的类：\n\n点击此处查看代码图像\n\n```java\n\
  class LengthComparator implements Comparator<String>\n{\n    public int compare(String\
  \ first, String second) {\n        return first.length() - second.length();\n  \
  \  }\n}\n```\n\n要实际进行比较，你需要一个实例：\n\n点击此处查看代码图像\n\n```java\nComparator<String> comp\
  \ = new LengthComparator();\nif (comp.compare(words[i], words[j]) > 0) ...\n```\n\
  \n将此调用与 `words[i].compareTo(words[j])` 进行对比。`compare` 方法是在比较对象上调用的，而不是字符串本身。\n\n\
  要排序数组，将一个 `Comparator` 对象传递给 `Arrays.sort` 方法：\n\n点击此处查看代码图像\n\n```java\nString[]\
  \ friends = { \"Peter\", \"Paul\", \"Mary\" };\nArrays.sort(friends, new LengthComparator());\n\
  ```\n\n现在数组变成了 `[\"Paul\", \"Mary\", \"Peter\"]` 或 `[\"Mary\", \"Paul\", \"Peter\"\
  ]`。\n\n你将在第 6.3 节中看到如何通过 Lambda 表达式更轻松地使用 `Comparator`。\n\n### 6.2.3 对象克隆\n\n在本节中，我们讨论了指示类已提供安全\
  \ `clone` 方法的 `Cloneable` 接口。由于克隆并不常见，且细节非常技术化，你可能只想扫一眼这些材料，等到需要时使用。\n\n为了理解什么是克隆，回想当复制持有对象引用的变量时发生了什么。原始变量和副本都是同一个对象的引用（参见图\
  \ 6.1）。这意味着对任何一个变量的更改也会影响另一个。\n\n\n\n\n```java\ncopy.raiseSalary(10); // oops--also\
  \ changed original\n```\n\n![Image](img/06fig01.jpg)\n\n**图 6.1** 拷贝与克隆\n\n如果你希望\
  \ `copy` 是一个新对象，其生命之初与 `original` 相同，但状态可以随时间推移而不同，请使用 `clone` 方法。\n\n点击此处查看代码图像\n\
  \n```java\nEmployee copy = original.clone();\n\ncopy.raiseSalary(10); // OK--original\
  \ unchanged\n```\n\n但事实并非那么简单。`clone` 方法是 `Object` 的一个 `protected` 方法，这意味着你的代码不能直接调用它。只有\
  \ `Employee` 类可以克隆 `Employee` 对象。这种限制是有原因的。思考 `Object` 类是如何实现 `clone` 的。它对对象一无所知，因此它只能进行逐字段的拷贝。如果对象中的所有数据字段都是数字或其他基本类型，那么复制字段就没问题。但如果对象包含对子对象的引用，那么复制字段将给你另一个指向同一个子对象的引用，因此原始对象和克隆对象仍然共享某些信息。\n\
  \n为了可视化这一点，请考虑第 4 章中引入的 `Employee` 类。图 6.2 显示了当你使用 `Object` 类的 `clone` 方法克隆这样一个\
  \ `Employee` 对象时会发生什么。如你所见，默认的克隆操作是“浅”的——它不会克隆被其他对象引用的对象。（图中显示了一个共享的 `Date` 对象。由于很快就会明确的原因，此示例使用了\
  \ `Employee` 类的一个版本，其中入职日期表示为 `Date`。）\n\n![Image](img/06fig02.jpg)\n\n**图 6.2**\
  \ 浅拷贝\n\n浅拷贝重要吗？这取决于情况。如果原始对象和浅拷贝之间共享的子对象是**不可变的**，那么这种共享就是安全的。如果子对象属于不可变类（如 `String`），这种情况确实会发生。另一种，子对象在对象的整个生命周期内可能保持不变，没有变器方法触碰它，也没有方法返回它的引用。\n\
  \n然而，子对象通常是可变的，你必须重新定义 `clone` 方法以进行**深拷贝**，即也克隆子对象。在我们的示例中，`hireDay` 字段是 `Date`，它是可变的，因此它必须被克隆。（出于这个原因，此示例使用了\
  \ `Date` 类型的字段而不是 `LocalDate` 来演示克隆过程。如果 `hireDay` 是不可变类 `LocalDate` 的实例，则不需要进一步的操作。）\n\
  \n对于每个类，你都需要决定：\n\n1. 默认的 `clone` 方法是否足够；\n2. 是否可以通过调用可变子对象的 `clone` 来修复默认的 `clone`\
  \ 方法；以及\n3. 不要尝试 `clone`。\n\n第三选项实际上是默认选项。要选择第一或第二选项，类必须：\n\n1. 实现 `Cloneable` 接口；以及\n\
  2. 使用 `public` 访问修饰符重新定义 `clone` 方法。\n\n***\n\n![Image](img/note.jpg) 注意\n\n`clone`\
  \ 方法在 `Object` 类中被声明为 `protected`，因此你的代码不能简单调用 `anObject.clone()`。但 `protected`\
  \ 方法不是在任何子类中都可以访问吗？每个类不都是 `Object` 的子类吗？幸运的是，受保护访问的规则更为微妙（参见第 5 章）。子类只能调用保护 `clone`\
  \ 方法来克隆它**自己的**对象。你必须将 `clone` 重新定义为 `public`，以便允许任何方法克隆对象。\n\n***\n\n在这种情况下，`Cloneable`\
  \ 接口的出现与接口的正常用法无关。特别是，它**没有**指定 `clone` 方法——该方法是从 `Object` 类继承的。该接口仅作为一个标记，表示类设计者理解克隆过程。对象对克隆是如此偏执，以至于如果一个对象请求克隆但没有实现该接口，它就会产生一个检查异常。\n\
  \n***\n\n![Image](img/note.jpg) 注意\n\n`Cloneable` 接口是 Java 提供的少数**标记接口**（tagging\
  \ interfaces）之一。（有些程序员称之为**标记接口**，marker interfaces。）记得 `Comparable` 等接口的通常目的是确保类实现某个特定方法或一组方法。标记接口没有方法；它的唯一目的是允许在类型查询中使用\
  \ `instanceof`：\n\n点击此处查看代码图像\n\n```java\nif (obj instanceof Cloneable) ...\n```\n\
  \n我们建议不要在你自己的程序中使用标记接口。\n\n***\n\n即使 `clone` 的默认（浅拷贝）实现已经足够，你仍然需要实现 `Cloneable`\
  \ 接口，将 `clone` 重新定义为 `public`，并调用 `super.clone()`。这是一个示例：\n\n点击此处查看代码图像\n\n```java\n\
  class Employee implements Cloneable\n{\n    // raise visibility level to public,\
  \ change return type\n}\n```\n\n***\n\n![Image](img/note.jpg) 注意\n\n`clone` 方法在\
  \ `Object` 类中被声明为 `protected`，因此你的代码不能简单调用 `anObject.clone()`。但 `protected` 方法不是在任何子类中都可以访问吗？每个类不都是\
  \ `Object` 的子类吗？幸运的是，受保护访问的规则更为微妙（参见第 5 章）。子类只能调用保护 `clone` 方法来克隆它**自己的**对象。你必须将\
  \ `clone` 重新定义为 `public`，以便允许任何方法克隆对象。\n\n\n\n\n你是否应该在自己的类中实现 `clone`？如果你的客户端需要进行深拷贝，那么你可能应该这样做。有些作者认为，你应该完全避免使用\
  \ `clone`，而是实现另一个方法来实现相同的目的。我们认同 `clone` 相当相当笨拙，但如果你将这一责任转移给另一个方法，你仍然会遇到相同的问题。无论如何，克隆并没有你想象的那么常见。在标准库中，不到\
  \ 5% 的类实现了 `clone`。\n\nListing 6.4 中的程序克隆了 `Employee` 类的实例（Listing 6.5），然后调用了两个变异器方法。`raiseSalary`\
  \ 方法更改了 `salary` 字段的值，而 `setHireDay` 方法更改了 `hireDay` 字段的状态。这两种变异都不会影响原始对象，因为 `clone`\
  \ 被定义为执行深拷贝。\n\n***\n\n![Image](img/note.jpg) 注意\n\n所有数组类型都有一个公共的 `clone` 方法，而不是保护的。你可以使用它创建一个包含所有元素拷贝的新数组。例如：\n\
  \n点击此处查看代码图片\n\n```java\nint[] luckyNumbers = { 2, 3, 5, 7, 11, 13 };\n\nint[] cloned\
  \ = luckyNumbers.clone();\n\ncloned[5] = 12; // 不改变 luckyNumbers[5]\n```\n\n***\n\
  \n***\n\n![Image](img/note.jpg) 注意\n\n第二卷的第 2 章 展示了克隆对象的另一种机制，使用 Java 的对象序列化功能。该机制容易实现且安全，但效率不高。\n\
  \n***\n\n**Listing 6.4** `clone/CloneTest.java`\n\n点击此处查看代码图片\n\n***\n\n```java\n\
  package clone;\n\n/**\n * 此程序演示了克隆。\n * @version 1.10 2002-07-01\n * @author Cay\
  \ Horstmann\n */\npublic class CloneTest\n{\n    public static void main(String[]\
  \ args)\n    {\n        try\n        {\n            Employee original = new Employee(\"\
  John Q. Public\", 50000);\n            original.setHireDay(2000, 1, 1);\n      \
  \      Employee copy = original.clone();\n            copy.raiseSalary(10);\n  \
  \          copy.setHireDay(2002, 12, 31);\n            System.out.println(\"original=\"\
  \ + original);\n            System.out.println(\"copy=\" + copy);\n        }\n \
  \       catch (CloneNotSupportedException e)\n        {\n            e.printStackTrace();\n\
  \        }\n    }\n}\n```\n\n***\n\n**Listing 6.5** `clone/Employee.java`\n\n点击此处查看代码图片\n\
  \n***\n\n```java\npackage clone;\n\nimport java.util.Date;\nimport java.util.GregorianCalendar;\n\
  \npublic class Employee implements Cloneable\n{\n    private String name;\n    private\
  \ double salary;\n    private Date hireDay;\n\n    public Employee(String name,\
  \ double salary)\n    {\n        this.name = name;\n        this.salary = salary;\n\
  \        hireDay = new Date();\n    }\n\n    public Employee clone() throws CloneNotSupportedException\n\
  \    {\n        // 调用 Object.clone()\n        Employee cloned = (Employee) super.clone();\n\
  \n        // 克隆可变字段\n        cloned.hireDay = (Date) hireDay.clone();\n\n      \
  \  return cloned;\n    }\n\n    /**\n     * 将入职日期设置为指定的日期。\n     * @param year 入职日的年份\n\
  \     * @param month 入职日的月份\n     * @param day 入职日的日期\n     */\n    public void\
  \ setHireDay(int year, int month, int day)\n    {\n        Date newHireDay = new\
  \ GregorianCalendar(year, month - 1, day).getTime();\n\n        // 实例变异示例\n    \
  \    hireDay.setTime(newHireDay.getTime());\n    }\n\n    public void raiseSalary(double\
  \ byPercent)\n    {\n        double raise = salary * byPercent / 100;\n        salary\
  \ += raise;\n    }\n\n    public String toString()\n    {\n        return \"Employee[name=\"\
  \ + name + \",salary=\" + salary + \",hireDay=\" + hireDay + \"]\";\n    }\n}\n\
  ```\n\n***\n\n## 6.3 Lambda 表达式\n\n现在你准备好学习 Lambda 表达式了，这是多年来 Java 语言最令人兴奋的变化。你将看到如何使用简洁语法的\
  \ Lambda 表达式定义代码块，以及如何编写使用 Lambda 表达式的代码。\n\n#### 6.3.1 为什么用 Lambda？\n\nLambda 表达式是一段你可以传递的代码块，以便在稍后执行，执行一次或多次。在进入语法（甚至是那个奇特的名字）之前，让我们退一步，观察我们在\
  \ Java 中何处用过此类代码块。\n\n在第 6.2.1 节中，即第 302 页的“接口与回调”，我们让我们回溯一下，在 Java 中何处用过这样的代码块。\n\
  \n### 6.3.2 Lambda 表达式的语法\n\n再次考虑前一节中的排序示例。我们传递了一段检查一个字符串是否比另一个短的代码。我们计算\n\n点击此处查看代码图片\n\
  \n```java\nfirst.length() - second.length()\n```\n\n\n\n\n\n`first` 和 `second` 是什么？它们都是字符串。Java\
  \ 是一门强类型语言，我们必须对此进行指定：\n\n点击此处查看代码图像\n\n```java\n(String first, String second)\n\
  -> first.length() - second.length()\n```\n\n你刚刚看到了你的第一个 `lambda 表达式`（lambda expression）。这种表达式仅仅是一个代码块，加上对必须传递给代码的任何变量的说明。\n\
  \n为什么叫这个名字？许多年前，在计算机出现之前，逻辑学家阿隆佐·丘奇（Alonzo Church）想要对数学函数什么是“有效可计算的”进行形式化。（有趣的是，已知某些函数是存在的，但没有人知道如何计算它们的值。）他使用希腊字母\
  \ lambda (`λ`）来标记参数。如果他早早知道 Java API，他会写成：\n\n点击此处查看代码图像\n\n```\nλfirst.λsecond.first.length()\
  \ - second.length()\n```\n\n* * *\n\n![Image](img/note.jpg) 注意\n\n为什么用字母 λ？是因为丘奇用光字母表里的其他字母了吗？实际上，古老的《数学原理》（*Principia\
  \ Mathematica*）使用 `^` 变音来表示自由变量，这启发了丘奇使用大写的 lambda `Λ` 作为参数。但最后，他切换到了小写版本。从那时起，带有参数变量的表达式被称为\
  \ lambda 表达式。\n\n* * *\n\n你刚刚看到了 Java 中 lambda 表达式的一种形式：参数、`->` 箭头以及一个表达式。如果代码执行的计算不适合放在单个表达式中，请完全按照你编写方法的方式来编写它：封装在\
  \ `{}` 中，并带有显式的 `return` 语句。例如：\n\n点击此处查看代码图像\n\n```java\n(String first, String\
  \ second) ->\n{\n    if (first.length() < second.length()) return -1;\n    else\
  \ if (first.length() > second.length()) return 1;\n    else return 0;\n}\n```\n\n\
  如果 lambda 表达式没有参数，你仍然需要提供空括号，就像对于无参数的方法一样：\n\n点击此处查看代码图像\n\n```java\n() -> { for\
  \ (int i = 100; i >= 0; i--) System.out.println(i); }\n```\n\n如果 lambda 表达式的参数类型可以被推断，你可以省略它们。例如：\n\
  \n点击此处查看代码图像\n\n```java\nComparator<String> comp\n    = (first, second) // 等于 (String\
  \ first, String second)\n      -> first.length() - second.length();\n```\n\n在这里，编译器可以推出\
  \ `first` 和 `second` 必须是字符串，因为该 lambda 表达式被赋值给一个字符串比较器。（我们将在下一节中详细讨论这种赋值。）\n\n如果方法只有一个类型可推断的参数，你甚至可以省略括号：\n\
  \n点击此处查看代码图像\n\n```java\nActionListener listener = event ->\n    System.out.println(\"\
  The time is \" + new Date());\n    // 代替 (event) -> ... 或 (ActionEvent event) ->\
  \ ...\n```\n\n你永远不需要指定 lambda 表达式的结果类型。它总是从上下文中推断出来的。例如，表达式：\n\n点击此处查看代码图像\n\n```java\n\
  (String first, String second) -> first.length() - second.length()\n```\n\n可以使用在一个期望结果为\
  \ `int` 的上下文中。\n\n* * *\n\n![Image](img/note.jpg) 注意\n\nlambda 表达式在某些分支中返回值而在其他分支中不返回是非法的。例如，`(int\
  \ x) -> { if (x >= 0) return 1; }` 是无效的。\n\n* * *\n\nListing 6.6 中的程序展示了如何使用 lambda\
  \ 表达式作为比较器和动作监听器。\n\n**Listing 6.6** `lambda/LambdaTest.java`\n\n点击此处查看代码图像\n\n\
  * * *\n\n```java\npackage lambda;\n\nimport java.util.*;\nimport javax.swing.*;\n\
  import javax.swing.Timer;\n\n/**\n * 此程序演示了 lambda 表达式的使用。\n * @version 1.0 2015-05-12\n\
  \ * @author Cay Horstmann\n */\npublic class LambdaTest{\n    public static void\
  \ main(String[] args) {\n        String[] planets = new String[] \"Mercury\", \"\
  Venus\", \"Mars\",\n            \"Jupiter\", \"Saturn\", \"Uranus\", \"Neptune\"\
  \ };\n        System.out.println(Arrays.toString(planets));\n        System.out.println(\"\
  Sorted in dictionary order:\");\n        Arrays.sort(planets);\n        System.out.println(Arrays.toString(planets));\n\
  \        System.out.println(\"Sorted by length:\");\n        Arrays.sort(planets,\
  \ (first, second) -> first.length() - second.length());\n        System.out.println(Arrays.toString(planets));\n\
  \n        Timer t = new Timer(1000, event -> {\n            System.out.println(\"\
  The time is \" + new Date());\n            Toolkit.getDefaultToolkit().beep();\n\
  \        });\n        t.start();\n        JOptionPane.showMessageDialog(null, \"\
  Quit?\");\n        System.exit(0);\n    }\n}\n```\n\n* * *\n\n### 6.3.3 泛式接口（Functional\
  \ Interfaces）\n\n正如我们所讨论，Java 中许多接口可以封装代码块，例如 `ActionListener` 或 `Comparator`。lambda\
  \ 与这些接口兼容。\n\n当你期望一个只有一个抽象方法的接口时，这种接口被称为泛式接口。\n\n* * *\n\n![Image](img/note.jpg)\
  \ 注意\n\n你可能会疑惑为什么泛式接口只有一个抽象方法。难道接口中的所有方法都是抽象的吗？实际上，接口一直允许声明 `Object` 类的方法，如 `toString`\
  \ 或 `clone`，而这些声明并没有使方法变为抽象。（请查看 `Comparator` API 的示例。）更重要的是，正如我们在 6.1.5 节 中看到的“默认方法第\
  \ 298 页），在 Java 8 中，接口可以声明非抽象方法。\n\n* * *\n\n为了演示向泛式接口的转换，考虑 `Arrays.sort` 方法。它的第二个参数需要一个\
  \ `Comparator` 实例，这是一个只有一个方法的接口。只需提供一个 lambda：\n\n点击此处查看代码图像\n\n```java\nArrays.sort(words,\
  \ (first, second) -> first.length() - second.length());\n```\n\n在后台，`Arrays.sort`\
  \ 方法接收一个实现了 `Comparator<String>` 的对象。调用该对象的 `compare` 方法就会执行 lambda 表达式体。这些对象和类的管理完全取决于实现，而且它们比传统的内部类要高效得多。最好的想法是将\
  \ lambda 表达式视为函数，而不是对象，并接受它可以被传递给泛式接口。\n\n\n\n\n\n你甚至无法将 lambda 表达式赋值给 `Object`\
  \ 类型的变量——`Object` 不是一个函数式接口。\n\nJava API 在 `java.util.function` 包中定义了许多通用的函数式接口。其中一个接口\
  \ `BiFunction<T, U, R>` 了参数类型为 `T` 和 `U` 并返回类型为 `R` 的函数。你可以将我们的字符串比较 lambda 表达式保存在该类型的变量中\n\
  \n点击此处查看代码图像\n\n```java\nBiFunction<String, String, Integer> comp = (first, second)\
  \ -> first.length() - second.length();\n```\n\n然而，这对你排序没有帮助。并没有一个接受 `BiFunction`\
  \ 的 `Arrays.sort` 方法。如果你以前用过函数式编程语言，可能会觉得这很奇怪。但对于 Java 程序员来说，这非常自然。像 `Comparator`\
  \ 这样的接口有特定的目的，而不仅仅是一个具有给定参数和返回类型的方法。Java SE 8 保留了这种风格。当你想要使用 lambda 表达式执行某些操作时，你仍然希望记住表达式的目的，并为其准备一个特定的函数式接口。\n\
  \n`java.util.function` 包中一个特别用的接口是 `Predicate`：\n\n点击此处查看代码图像\n\n```java\npublic\
  \ interface Predicate<T> {\n    boolean test(T t);\n    // 额外的默认和静态方法\n}\n```\n\n\
  `ArrayList` 类有一个 `removeIf` 方法，其参数是一个 `Predicate`。它专门设计用于传递 lambda 表达式。例如，以下语句可以从数组列表中移除所有\
  \ null 值：\n\n点击此处查看代码图像\n\n```java\nlist.removeIf(e -> e == null);\n```\n\n### 6.3.4\
  \ 方法引用\n\n有时候，已经有一个方法恰好执行你想传递给其他代码的操作。例如，假设你只想在每当定时器事件发生时打印该事件对象。当然，你可以调用\n\n点击此处查看代码图像\n\
  \n```java\nTimer t = new Timer(1000, event -> System.out.println(event));\n```\n\
  \n如果能直接将 `println` 方法传递给 `Timer` 构造函数会更好。以下是实现方法：\n\n点击此处查看代码图像\n\n```java\nTimer\
  \ t = new Timer(1000, System.out::println);\n```\n\n表达式 `System.out::println` 是一个*方法引用*，它等价于\
  \ lambda 表达式 `x -> System.out.println(x)`。\n\n另一个例子，假设你想忽略字母大小写对字符串排序。你可以传递这个方法表达式：\n\
  \n点击此处查看代码图像\n\n```java\nArrays.sort(strings, String::compareToIgnoreCase)\n```\n\
  \n从这些示例中可以看出，`::` 运算符将方法名与对象或类名分开。主要有三种情况：\n\n- `object::`instanceMethod`\n- `Class::`staticMethod`\n\
  - `Class::`instanceMethod`\n\n在前两种情况下，方法引用等价于一个提供方法参数的 lambda 表达式。如前所述，`System.out::println`\
  \ 等价于 `x -> System.out.println(x)`。同样，`Math::pow` 等价于 `(x, y) -> Math.pow(x, y)`。\n\
  \n在第三种情况下，第一个参数变成方法的目标。例如，`String::compareToIgnoreCase` 等同于 `(x, y) -> x.compareToIgnoreCase(y)`。\n\
  \n\n\n![Image](img/note.jpg) 注意\n\n当存在多个同名的重载方法时，编译器将尝试根据上下文你指的是哪一个。例如，`Math.max`\
  \ 方法有两个版本，一个用于整数，一个用于 `double` 值。选择哪一个取决于 `Math::max` 转换到的函数式接口的方法参数。就像 lambda 表达式一样，方法引用并不是孤立存在的。它们总是被转换为函数式接口的实例。\n\
  \n你可以在方法引用中捕获 `this` 参数。例如，`this::equals` 等于 `x -> this.equals(x)`。使用 `super` 也是有效的。方法表达式\n\
  \n`super::instanceMethod`\n\n使用 `this` 作为目标并调用给定方法的父类版本。这里有一个显示机制的虚拟示例：\n\n点击此处查看代码图像\n\
  \n```java\nclass Greeter {\n    public void greet() {\n        System.out.println(\"\
  Hello, world!\");\n    }\n}\n\nclass TimedGreeter extends Greeter {\n    public\
  \ void greet() {\n        Timer t = new Timer(1000, super::greet);\n        t.start();\n\
  \    }\n}\n```\n\n### 6.3.5 构造器引用\n\n构造器引用就像方法引用一样，只是方法名为 `new`。例如，`Person::new`\
  \ 是对 `Person` 构造器的引用。如果有多个构造器，编译器会选择带有 `String` 参数的那个。\n\n数组构造引用对于克服 Java 的局限性非常有用。无法构造泛型类型\
  \ `T` 的数组。表达式 `new T[n]` 是错误的，因为它会被变为 `new Object[n]`。这对库作者来说是一个问题。例如，假设我们需要一个 `Person`\
  \ 对象的数组。`Stream` 接口有一个 `toArray` 方法可以返回 `Object` 数组：\n\n点击此处查看代码图像\n\n```java\n\
  Object[] people = stream.toArray();\n```\n\n但这并不理想。用户想要的是 `Person` 数组而不是 `Object`。流式库通过构造器引用解决了这个问题。将\
  \ `Person[]::new` 传递给 `toArray` 方法：\n\n点击此处查看代码图像\n\n```java\nPerson[] people =\
  \ stream.toArray(Person[]::new);\n```\n\n`toArray` 方法调用此构造器获取正确类型的数组。然后填充并返回该数组。\n\
  \n### 6.3.6 变量范围\n\n通常，你想让 lambda 表达式访问内部方法或类的变量。考虑这个示例：\n\n点击此处查看代码图像\n\n```java\n\
  public static void repeatMessage(String text, int delay) {\n    ActionListener listener\
  \ = event -> {\n        System.out.println(text);\n        Toolkit.getDefaultToolkit().beep();\n\
  \    };\n    new Timer(delay, listener).start();\n}\n```\n\n现在看 lambda 表达式内部的变量\
  \ `text`。注意，该变量*不是*在 lambda 表达式中定义的。相反，它是 `repeatMessage` 方法的参数变量。\n\n\n\n\n\n如果你仔细思考，这里正在发生一些非显而的事情。lambda\
  \ 表达式的代码可能在 `repeatMessage` 返回很久之后仍在运行，此时参数变量已经消失了。`text` 变量是如何保持存在的呢？\n\n为了理解发生了什么，我们需要完善对\
  \ lambda 表达式的理解。lambda 表达式包含三个要素：\n\n1. 一个代码块\n2. 参数\n3. *自由*变量的值，即既不是参数也没有在代码块内部定义的变量\n\
  \n在我们的示例中，lambda 表达式有一个自由变量 `text`。表示该 lambda 表达式的数据结构必须存储自由变量的值，在我们的案例中，就是字符串 `\"\
  Hello\"`。我们称这些值被 lambda 表达式*捕获*（captured）了。（具体如何实现是一个实现细节。例如，可以将 lambda 表达式转换为一个带有单一方法的对象，从而将自由变量的值复制到该对象的实例变量中。）\n\
  \n***\n\n![Image](img/note.jpg) 备注\n\n代码块连同自由变量值在一起的专业术语是*闭包*（closure）。如果有人自豪于他们的语言拥有闭包，请放心，Java\
  \ 也有闭包。在 Java 中，lambda 表达式就是闭包。\n\n***\n\n正如你所看到的，lambda 表达式可以捕获封装作用域内变量的值。在 Java\
  \ 中，为了确保捕获的值是有定义的，有一项重要的限制。在 lambda 表达式中，你只能引用值不会改变的变量。例如，以下代码是非法的：\n\n点击此处查看代码图片\n\
  \n```java\npublic static void countDown(int start, int delay)\n{\n    ActionListener\
  \ listener = event ->\n        {\n            start--; // Error：无法修改被捕获的变量\n   \
  \         System.out.println(start);\n        };\n    new Timer(delay, listener).start();\n\
  }\n```\n\n这种限制是有原因的。当多个动作并发执行时，在 lambda 表达式中修改变量是不安全的。对于目前看到的这类动作，这种情况不会发生，但通常来说，这是一个严重的问题。关于这一重要问题的更多信息，请参阅第\
  \ 14 章。\n\n在 lambda 表达式中引用在外部被修改的变量也是非法的。例如，以下代码是非法的：\n\n点击此处查看代码图片\n\n```java\n\
  public static void repeat(String text, int count)\n{\n    for (int i = 1; i <= count;\
  \ i++)\n    {\n        ActionListener listener = event ->\n            {\n     \
  \           System.out.println(i + \": \" + text);\n                // Error：无法引用发生变化的\
  \ i\n            };\n        new Timer(1000, listener).start();\n    }\n}\n```\n\
  \n规则是，lambda 表达式中任何捕获的变量必须是*有效最终的*（effectively final）。有效最终变量是指在初始化后从没有被赋值过新值的变量。在我们的案例中，`text`\
  \ 始终引用同一个 `String` 对象，捕获它是可以的。然而，`i` 的值被修改了，因此 `i` 不能捕获。\n\nlambda 表达式的主体与*嵌套块相同的作用域*。命名冲突和遮蔽（shadowing）的相同规则适用。在\
  \ lambda 中声明与局部变量同名的参数或局部变量是非法的。\n\n点击此处查看代码图片\n\n```java\nPath first = Paths.get(\"\
  /usr/bin\");\nComparator<String> comp =\n    (first, second) -> first.length() -\
  \ second.length();\n    // Error：变量 first 已定义\n```\n\n在方法内部，你不能有两个同名的局部变量，因此你也不能在\
  \ lambda 表达式中引入此类变量。\n\n当你在 lambda 表达式中使用 `this` 关键字时，你指的是创建该 lambda 的方法的 `this`\
  \ 参数。例如，考虑\n\n点击此处查看代码图片\n\n```java\npublic class Application()\n{\n    public void\
  \ init()\n    {\n        ActionListener listener = event ->\n            {\n   \
  \             System.out.println(i + \": \" + text);\n                //\n     \
  \       };\n        // ...\n    }\n}\n```\n（注：提供的 Application 类文本包含一些乱码/重复片段；我在保持原始代码片段逻辑流的同时清理了结构。）\n\
  \n### 6.3 处理表达式\n\n正如你所看到的，lambda 表达式可以捕获封装作用域内变量的值。在 Java 中，为了确保捕获的值是有定义的，有一项重要的限制。在\
  \ lambda 表达式中，你只能引用值不会改变的变量。\n\n现在让我们让这个示例变得复杂一点。我们想说明它发生的动作。为此，我们需要一个有一个 `int`\
  \ 参数和 `void` 返回值的函数式接口。处理 `int` 值的标准接口是：\n\n```java\npublic interface IntConsumer\n\
  {\n    void accept(int value);\n}\n```\n\n这是改进后的 `repeat` 方法版本：\n\n```java\npublic\
  \ static void repeat(int n, IntConsumer action)\n{\n    for (int i = 0; i < n; i++)\
  \ action.accept(i);\n}\n```\n\n这是调用它的方式：\n\n```java\nrepeat(10, i -> System.out.println(\"\
  倒计时: \" + (9 - i)));\n```\n\n> **提示**\n尽可能使用表 6.1 或表 6.2 中的接口是一个好主意。例如，假设你写了一个方法来处理符合特定标准的文件。有一个旧的接口\
  \ `java.io.FileFilter`，但使用标准的 `Predicate<File>` 更好。\n\n\n\n\n大多数标准函数接口都拥有用于生成或组合函数的非抽象方法。例如，`Predicate.isEqual(a)`\
  \ 等同于 `a::equals`，当 `a` 为 `null` 时它同样有效。它们提供了默认方法 `and`、`or`、`negate` 来组合多个谓词。例如，`Predicate.isEqual(a).or(Predicate.isEqual(b))`\
  \ 等同于 `x -> a.equals(x) || b.equals(x)`。\n\n* * *\n\n* * *\n\n![Image](img/note.jpg)\
  \ 笔记\n\n如果你设计了一个带有一个抽象方法的接口，可以使用 `@FunctionalInterface` 注解对其进行标记。这有两个优点：如果你不小心添加了另一个非抽象方法，编译器会给出错误信息；此外，javadoc\
  \ 页面会包含一条声明，说明你的接口是一个函数接口。\n\n并不是强制要求使用该注解。根据定义，任何具有单个抽象方法的接口都是函数接口。但使用 `@FunctionalInterface`\
  \ 注解是一个好主意。\n\n* * *\n\n### 6.3.8 关于比较器（Comparators）\n\n`Comparator` 接口提供了许多方便的静态方法来创建比较器。这些方法旨在与\
  \ lambda 表达式或方法引用一起使用。\n\n静态方法 `comparing` 接收一个“键提取”函数，该函数将类型 `T` 映射到可比较的类型（如 `String`）。该函数被应用于要比较的对象，然后对返回的键进行比较。例如，假设你有一个\
  \ `Person` 对象的数组。以下是如何按名称对它们进行排序：\n\n点击此处查看代码图片\n\n```\nArrays.sort(people, Comparator.comparing(Person::getName));\n\
  ```\n\n这显然比手动实现一个 `Comparator` 要简单得多。而且代码也更加清晰，因为显而易见我们想按名称来比较人员。\n\n你可以使用 `thenComparing`\
  \ 方法链式调用比较器来处理平局。例如：\n\n点击此处查看代码图片\n\n```\nArrays.sort(people,\n    Comparator.comparing(Person::getLastName)\n\
  \    .thenComparing(Person::getFirstName));\n```\n\n如果两个人的姓氏相同，则使用第二个比较器。\n\n这些方法有几种变体。你可以指定用于\
  \ `comparing` 和 `thenComparing` 方法提取的键的比较器。例如，在这里我们按名字的长度对人员排序：\n\n点击此处查看代码图片\n\n\
  ```\nArrays.sort(people, Comparator.comparing(Person::getName,\n    (s, t) -> Integer.compare(s.length(),\
  \ t.length())));\n```\n\n此外，`comparing` 和 `thenComparing` 方法都有避免对 `int`、`long` 或\
  \ `double` 值装箱的变体。产生上述操作的一种简单方法是：\n\n点击此处查看代码图片\n\n```\nArrays.sort(people, Comparator.comparingInt(p\
  \ -> p.getName().length()));\n```\n\n如果你的键函数可以返回 `null`，那么你会喜欢 `nullsFirst` 和 `nullsLast`\
  \ 适配器。这些静态方法接收一个现有的比较器并修改它，使其在遇到 `null` 值时不会抛出异常，而是将其排在比普通值更或更大。例如，假设当一个人没有中间名时\
  \ `getMiddleName` 返回 `null`。那么你可以使用 `Comparator.comparing(Person::getMiddleName(),\
  \ Comparator.nullsFirst(...))`。\n\n`nullsFirst` 方法需要一个比较器——在这种情况下，是一个比较两个字符串的比较器。`naturalOrder`\
  \ 方法为任何实现 `Comparable` 的类创建一个比较器。我们需要的是 `Comparator.<String>naturalOrder()`。这里是按可能为\
  \ `null` 的中间名排序的完整调用。我使用了 `java.util.Comparator.*` 的静态导入，使表达式更具可读性。注意，`naturalOrder`\
  \ 的类型是推断的。\n\n点击此处查看代码图片\n\n```\nArrays.sort(people, comparing(Person::getMiddleName,\
  \ nullsFirst(naturalOrder())));\n```\n\n静态方法 `reverseOrder` 提供自然顺序的反序。要反转任何比较器，请使用实例方法\
  \ `reversed`。例如，`naturalOrder().reversed()` 等同于 `reverseOrder()`。\n\n## 6.4 内部类\n\
  \n*内部类*是定义在另一个类内部的类。为什么要这样做？有三个原因：\n\n- 内部类方法可以访问其定义作用范围内的数据——包括本应是私有的数据。\n- 内部类可以对同一包中的其他类隐藏。\n\
  - 当你想要在不写大量代码的情况下定义回调函数时，*匿名*内部类非常方便。\n\n我们将把这个相当复杂的话题拆分成几个步骤。\n\n**1.** 从第 331\
  \ 页开始，你将看到一个访问其外部类实例字段的简单内部类。\n\n**2.** 在第 334 页上，我们涵盖了内部类的特殊语法规则。\n\n**3.** 从第\
  \ 335 页开始，我们将深入内部类内部，看看它们是如何运作工作的。\n\n**4.** 从第 339 页开始，我们讨论了可以访问局部变量的内部类。\n\n**5.**\
  \ 从第 342 页开始，我们引入了匿名类并展示它们在 lambda 表达式出现之前是如何被使用的。\n\n**6.** 最后，从第 346 页开始，你将看到静态内部类如何用于辅助类。\n\
  \n* * *\n\n![Image](img/note.jpg) 笔记\n\nC++ 有嵌套类。嵌套类包含在包含它的类的作用范围内。这是一个典型的例子：链表定义了一个用于存储结的类，以及一个用于定义迭代器的类。\n\
  \n点击此处查看代码图片\n\n```cpp\nclass LinkedList\n{\npublic:\n    class Iterator // 嵌套类\n\
  \    {\n        public:\n        void insert(int x);\n        int erase();\n   \
  \     ...\n    };\n    ...\nprivate:\n    class Link // 嵌套类\n    {\n        public:\n\
  \            Link* next;\n        int data;\n    };\n    ...\n};\n```\n\n嵌套是*类*之间的关系，而不是*对象*之间的关系。`LinkedList`\
  \ 对象并不拥有 `Iterator` 或 `Link` 类型的子对象。\n\n### 6.4.1 使用内部类访问对象状态\n\n内部类的语法相当复杂。出于这个原因，我们展示了一个简单但有些刻意的示例，用来演示内部类的用法。我们重构了\
  \ `TimerTest` 示例并提取了 `TalkingClock` 类。\n\n\n\n\n点击此处查看代码图像\n\n```java\npublic class\
  \ TalkingClock\n{\n   private int interval;\n   private boolean beep;\n   public\
  \ TalkingClock(int interval, boolean beep) { ... }\n   public void start() { ...\
  \ }\n   public class TimePrinter implements ActionListener\n      // 一个内部类\n   {\n\
  \      ...\n   }\n}\n```\n\n注意，`TimePrinter` 类现在位于 `TalkingClock` 类内部。这*并不意味着*每个\
  \ `TalkingClock` 实例都有一个 `TimePrinter` 实例字段。正如你将看到的的那样，`TimePrinter` 对象是通过 `TalkingClock`\
  \ 类的方法构造的。\n\n下面是 `TimePrinter` 类的更详细代码。注意 `actionPerformed` 方法在发出蜂鸣声之前会检查 `beep`\
  \ 标志。\n\n点击此处查看代码图像\n\n```java\npublic class TimePrinter implements ActionListener\n\
  {\n   public void actionPerformed(ActionEvent event)\n   {\n      System.out.println(\"\
  At the tone, the time is \" + new Date());\n      if (beep) Toolkit.getDefaultToolkit().beep();\n\
  \   }\n}\n```\n\n发生了一些令人惊讶的事情。`TimePrinter` 类没有名为 `beep` 的实例字段或变量。相反，`beep` 指向创建此\
  \ `TimePrinter` 的 `TalkingClock` 对象的字段。这是非常创新的。传统上，方法可以引用调用该方法的对象的数据字段。内部类方法既可以访问自己的数据字段，也可以访问创建它的外部对象的数据字段。\n\
  \n为了实现这一点，内部类对象总是获得一个指向创建它的对象的隐式引用（请参见图 6.3）。\n\n![图像](img/06fig03.jpg)\n\n**图 6.3**\
  \ 内部类对象拥有指向外部类对象的引用\n\n该引用在内部类的定义中是不可见的。然而，为了阐明这个概念，让我们对外部对象的引用命名为 `outer`。那么 `actionPerformed`\
  \ 方法等同于以下代码：\n\n点击此处查看代码图像\n\n```java\npublic void actionPerformed(ActionEvent event)\n\
  {\n   System.out.println(\"At the tone, the time is \" + new Date());\n   if (outer.beep)\
  \ Toolkit.getDefaultToolkit().beep();\n}\n```\n\n外部类引用是在构造函数中设置的。编译器会修改所有的内部类构造函数，添加一个外部类引用的参数。`TimePrinter`\
  \ 类没有定义构造函数；因此，编译器会合成一个无参数构造函数，生成如下所示的代码：\n\n点击此处查看代码图像\n\n```java\npublic TimePrinter(TalkingClock\
  \ clock) // 自动生成的代码\n{\n   outer = clock;\n}\n```\n\n再次请注意，`outer` 不是 Java 关键字。我们只是使用它来说明内部类涉及的机制。\n\
  \n当在 `start` 方法中构造 `TimePrinter` 对象时，编译器将当前会闹钟的 `this` 引用传递给构造函数：\n\n点击此处查看代码图像\n\
  \n```java\nActionListener listener = new TimePrinter(this); // 自动添加参数\n```\n\n列表\
  \ 6.7 显示了测试内部类的完整程序。再看一遍访问控制。如果 `TimePrinter` 类是一个普通类，它将需要通过 `TalkingClock` 类的公共方法来访问\
  \ `beep` 标志。使用内部类是一种改进。没有提供仅对另一个类感兴趣的访问器。\n\n* * *\n\n![图像](img/note.jpg) 笔记\n\n\
  我们可以将 `TimePrinter` 类声明为 `private`。这样，只有 `TalkingClock` 方法能够构造 `TimePrinter` 对象。只有内部类可以是私有的。普通类始终具有包级或公有级可见性。\n\
  \n* * *\n\n**列表 6.7** `innerClass/InnerClassTest.java`\n\n点击此处查看代码图像\n\n* * *\n\n\
  ```java\n1   package innerClass;\n2\n3   import java.awt.*;\n4   import java.awt.event.*;\n\
  5   import java.util.*;\n6   import javax.swing.*;\n7   import javax.swing.Timer;\n\
  8\n9   /**\n10     * 此程序演示了内部类的用法。\n11     * @version 1.11 2015-05-2\n12     * @author\
  \ Horstmann\n13     */\n14   public class InnerTest\n15   {\n16     public static\
  \ void main(String[] args)\n17     {\n18       TalkingClock clock = new TalkingClock(100,\
  \ true);\n19       clock.start();\n20\n21       // 保持运行，直到用户选择 \"Ok\"\n22      \
  \ JOptionPane.showMessageDialog(null, \"Quit?\");\n23       System.exit(0);\n24\
  \     }\n25   }\n26\n27   /**\n28     * 一个按固定间隔打印时间的闹钟。\n29     */\n30   class TalkingClock\n\
  31   {\n32     private int interval;\n33     private boolean beep;\n34\n35     /**\n\
  36       * 构造闹钟\n37       * @param interval 消息间隔（毫秒）\n38       * @param beep 闹钟是否蜂鸣\n\
  39       */\n40     public TalkingClock(int interval, boolean beep)\n41     {\n\
  42       this.interval = interval;\n43       this.beep = beep;\n44     }\n45\n46\
  \     /**\n47       * 闹钟。\n48       */\n49     public void start()\n50     {\n51\
  \       ActionListener listener = new TimePrinter();\n52       Timer t = new Timer(interval,\
  \ listener);\n53       t.start();\n54     }\n55\n56     public class TimePrinter\
  \ implements ActionListener\n57     {\n58       public void actionPerformed(ActionEvent\
  \ event)\n59       {\n60           System.out.println(\"At the tone, the time is\
  \ \" + new Date());\n61           if (beep) Toolkit.getDefaultToolkit().beep();\n\
  62       }\n63     }\n64   }\n```\n\n* * *\n\n### 6.4.2 内部类的特殊语法\n\n在前面的节中，我们通过命名为\
  \ `outer` 来解释内部类的外部类引用。实际上，外部引用的正确语法要复杂一点。表达式 `OuterClass.this` 指定了外部类引用。例如，你可以这样写\
  \ `TimePrinter` 内部类的 `actionPerformed` 方法：\n\n点击此处查看代码图像\n\n```java\npublic void\
  \ actionPerformed(ActionEvent event)\n{\n   ...\n   if (TalkingClock.this.beep)\
  \ Toolkit.getDefaultToolkit().beep();\n}\n```\n\n相反，你可以更显式地编写内部对象构造函数，使用语法\n\n`outerObject.new`\
  \ `InnerClass(构造参数)`\n\n例如：\n\n点击此处查看代码图像\n\n```java\nActionListener listener =\
  \ this.new TimePrinter();\n```\n\n在这里，新构造的 `TimePrinter` 对象的外部类引用设置为创建内部类的方法的 `this`\
  \ 引用。这是最常见的情况。始终 `this.` 修饰符是冗余的。然而，也可以通过显式命名来将外部类引用设置为另一个对象。例如，由于 `TimePrinter`\
  \ 是一个公共内部类，你可以为任何闹钟构造一个 `TimePrinter`：\n\n点击此处查看代码图像\n\n```java\nTalkingClock jabberer\
  \ = new TalkingClock(1000, true);\nTalkingClock.TimePrinter listener = jabberer.new\
  \ TimePrinter();\n```\n\n注意，当在外部类的作用域之外，我们使用 `OuterClass.InnerClass` 来引用内部类。\n\n\
  \n\n\n\n### 6.4.3 内部类有用吗？必要吗？安全吗？\n\n当内部类在 `Java 1.1` 中引入 Java 语言时，许多程序员认为它们是一项重大新特性，与\
  \ Java “比 C++ 更简单”的哲学格格不入。内部类的语法不可否是复杂的。（在我们在本章稍后学习匿名内部类时，它会变得复杂。）目前并不清楚内部类是如何与语言的其他特性（如访问控制和安全）相互作用的。\n\
  \n通过添加一个优雅且有趣但并非必需的功能，Java 是否已经开启了导致许多其他语言深陷泥潭的毁灭性之路？\n\n虽然我们不尝试完全回答这个问题，但值得注意的是，内部类是`compiler`\
  \ 的现象，而不是虚拟机的现象。内部类被翻译成常规的类文件，并用 `$`（美元符号）分隔外部类和内部类的类名，而虚拟机对它们没有任何特殊知识。\n\n例如，`TalkingClock`\
  \ 类内部的 `TimePrinter` 类被翻译为类文件 `TalkingClock$TimePrinter.class`。要看到这一运行过程，请尝试以下实验：运行第\
  \ 5 章中的 `ReflectionTest` 程序，并给它类 `TalkingClock$TimePrinter` 进行反射。或者，简单地使用 `javap`\
  \ 工具：\n\n```\njavap -private ClassName\n```\n\n* *\n\n![Image](img/note.jpg) 备注\n\
  \n如果你使用 UNIX，请在命令行中提供类名时转义 `$` 字符。也就是说，运行 `ReflectionTest` 或 `javap` 程序如下：\n\n点击此处查看代码图像\n\
  \n```bash\njava reflection.ReflectionTest innerClass.TalkingClock\\$TimePrinter\n\
  ```\n\n或者\n\n点击此处查看代码图像\n\n```bash\njavap -private innerClass.TalkingClock\\$TimePrinter\n\
  ```\n\n* *\n\n你将获得以下输出：\n\n点击此处查看代码图像\n\n```java\npublic class TalkingClock$TimePrinter\n\
  {\n   public TalkingClock$TimePrinter(TalkingClock);\n   public void actionPerformed(java.awt.event.ActionEvent);\n\
  \   final TalkingClock this$0;\n}\n```\n\n你可以清楚地看到，编译器为指向外部类的引用生成了一个额外的实例字段 `this$0`。（`this$0`\
  \ 的名称是编译器合成的——你不能在代码中引用它。）你还可以看到构造函数中的 `TalkingClock` 参数。\n\n如果编译器可以自动完成这种转换，那么你难道不能简单地通过手动来实现相同的机制吗？让我们试一下。我们将\
  \ `TimePrinter` 变成一个常规类，放在 `TalkingClock` 类之外。在构造 `TimePrinter` 对象时，我们将创建该对象的 `this`\
  \ 引用传递给它。\n\n点击此处查看代码图像\n\n```java\nclassclass TalkingClock\n{\n   ...\n   public\
  \ void start()\n   {\n      ActionListener listener = new TimePrinter(this);\n \
  \     Timer t = new Timer(interval, listener);\n      t.start();\n   }\n}\n\nclass\
  \ TimePrinter implements ActionListener\n{\n   private TalkingClock outer;\n   ...\n\
  \   public TimePrinter(TalkingClock clock)\n   {\n      outer = clock;\n   }\n}\n\
  ```\n\n现在让我们来看 `actionPerformed` 方法。它需要访问 `outer.beep`。\n\n点击此处查看代码图像\n\n```java\n\
  if (outer.beep) ... // 错误\n```\n\n在这里我们遇到了一个问题。内部类可以访问外部类的私有数据，但我们的外部 `TimePrinter`\
  \ 类不能。\n\n因此，内部类确实比常规类更强大，因为它们拥有更多的访问权限。\n\n你可能很好奇，如果内部类被翻译成带有奇怪名称的类，它们是如何获得那些额外的访问权限的——虚拟机对它们一无所知。为了解这个谜，让我们再次使用\
  \ `ReflectionTest` 程序来监控 `TalkingClock` 类：\n\n点击此处查看代码图像\n\n```java\nclass TalkingClock\n\
  {\n   private int interval;\n   private boolean beep;\n   public TalkingClock(int,\
  \ boolean);\n   static boolean access$0(TalkingClock);\n   public void start();\n\
  }\n```\n\n注意编译器添加到外部类的静态 `access$0` 方法。它返回作为参数传递的对象的 `beep` 字段。（方法名可能略有，例如 `access$000`，取决于你的编译器。）\n\
  \n内部类方法调用该方法。语句\n\n```java\nif (beep)\n```\n\n在 `TimePrinter` 类的 `actionPerformed`\
  \ 方法中该语句实际上执行了以下调用：\n\n点击此处查看代码图像\n\n```java\nTalkingClock.access$0(outer)\n```\n\
  \n这是一个安全风险吗？你敢肯定是的。\n\n### 6.4.4 局部内部类\n\n如果你仔细查看 `TalkingClock` 示例的代码，你会发现你只需要一次类型\
  \ `TimePrinter` 的名称：即在你创建它的对象时。\n\n在这种情况下，你可以*在方法内部局部定义*该类。\n\n点击此处查看代码图像\n\n```java\n\
  public void start()\n{\n   class TimePrinter implements ActionListener\n   {\n \
  \     public void actionPerformed(ActionEvent event)\n      {\n         System.out.println(\"\
  At the tone, the time is \" + new Date());\n         if (beep) Toolkit.getDefaultToolkit().beep();\n\
  \      }\n   }\n   ActionListener listener = new TimePrinter();\n   Timer t = new\
  \ Timer(interval, listener);\n   t.start();\n}\n```\n\n局部类从不声明访问修饰符（即 `public` 或\
  \ `private`）。它们的作用域始终被限制在声明所在的块中。\n\n局部类有一个巨大的优势：它们对外部世界完全隐藏的——即使是 `TalkingClock`\
  \ 类中的其他代码无法访问它们。\n\n\n\n\n局部类相比其他内部类还有另一个优势。它们不仅可以访问外部类的字段，甚至可以访问局部变量！然而，这些局部变量必须是*有效*\
  \ `final`（effectively `final`）。这意味着，一旦它们被赋值，就永远不能被改变。\n\n这是一个典型的例子。我们将 `interval`\
  \ 和 `beep` 参数从 `TalkingClock` 构造函数移动到 `start` 方法。\n\n点击此处查看代码图片\n\n```java\npublic\
  \ void start(int interval, boolean beep)\n{\n    class TimePrinter implements ActionListener\n\
  \    {\n        public void actionPerformed(ActionEvent event)\n        {\n    \
  \        System.out.println(\"At the tone, the time is \" + new Date());\n     \
  \       if (beep) Toolkit.getDefaultToolkit().beep();\n        }\n    }\n    ActionListener\
  \ listener = new TimePrinter();\n    Timer t = new Timer(interval, listener);\n\
  \    t.start();\n}\n```\n\n注意，`TalkingClock` 类不再需要存储 `beep` 实例字段。它只是引用了 `start`\
  \ 方法的 `beep` 参数变量。\n\n也许这并不应该那么奇怪。毕竟，`if (beep) ...` 这一行最终是在 `start` 方法内部的，所以为什么它不能访问\
  \ `beep` 变量的值呢？\n\n为了看到为什么这里存在一个微妙的问题，让我们更仔细地观察控制流。\n\n1. 调用 `start` 方法。\n2. 通过调用内部类\
  \ `TimePrinter` 的构造函数来初始化对象变量 `listener`。\n3. 将 `listener` 引用传递给 `Timer` 构造函数，启动定时器，`start`\
  \ 方法退出。此时，`start` 方法的 `beep` 参数变量已不再存在。\n4. 一秒后，`actionPerformed` 方法执行 `if (beep)\
  \ ...`。\n\n为了让 `actionPerformed` 方法中的代码能够工作，`TimePrinter` 类必须在 `beep` 参数值消失之前，将\
  \ `beep` 字段作为 `start` 方法的局部变量进行了复制。这确实是发生的情况。在我们的示例中，编译器为该局部内部类合成了名称 `TalkingClock$1TimePrinter`。如果你再次使用\
  \ `ReflectionTest` 程序监控 `TalkingClock$1TimePrinter` 类，你将得到以下输出：\n\n点击此处查看代码图片\n\n\
  ```java\nclass TalkingClock$1TimePrinter\n{\n    TalkingClock$1TimePrinter(TalkingClock,\
  \ boolean);\n    public void actionPerformed(java.awt.event.ActionEvent);\n    final\
  \ boolean val$beep;\n    final TalkingClock this$0;\n}\n```\n\n注意构造函数中的 `boolean`\
  \ 参数和 `val$beep` 实例变量。当创建对象时，值 `beep` 被传递到构造函数并存储在 `val$beep` 字段中。编译器检测到局部变量的访问，为每个变量创建匹配的实例字段，并将局部变量复制到构造函数中，以便初始化实例字段。\n\
  \n从程序员的角度来看，局部变量的访问是非常的。它通过减少你需要显式编写的实例字段，使得你的内部类更加简单。\n\n正如我们已经提到的，局部类的方法只能引用声明为\
  \ `final` 的局部变量。出于这个原因，在我们的示例中 `beep` 参数被声明为 `final`。被声明为 `final` 的局部变量在初始化后不能被修改。因此，可以保证局部变量和局部类内部创建的副本始终具有相同的值。\n\
  \n***\n\n![Image](img/note.jpg) 注意\n\n在 Java SE 8 之前，任何从局部类访问的局部变量都必须声明为 `final`。例如，`start`\
  \ 方法将如下如下声明，以便内部类可以访问 `beep` 参数：\n\n点击此处查看代码图片\n\n```java\npublic void start(int\
  \ interval, final boolean beep)\n```\n\n***\n\n“有效 `final`”的限制有时是不方便的。例如，假设你想更新闭包作用域内的计数器。在这里，我们想要统计在排序过程中\
  \ `compareTo` 方法被调用的次数：\n\n点击此处查看代码图片\n\n```java\nint counter = 0;\nDate[] dates\
  \ = new Date[100];\nfor (int i = 0; i < dates.length; i++)\n    dates[i] = new Date()\n\
  \        {\n            // ... 逻辑\n        }\n```\n\n等待，最后一个示例的源码是片段化且交错的。让我们根据提供的文本重构逻辑：\n\
  \n```java\nint counter = 0;\nDate[] dates = new Date[100];\nfor (int i = 0; i <\
  \ dates.length; i++)\n    dates[i] = new Date()\n        {\n            // 这里是匿名类所在的位置\n\
  \        }\n```\n\n实际上，重新阅读文本，计数器示例的代码是：\n\n```java\nint counter = 0;\nDate[] dates\
  \ = new Date[100];\nfor (int i = 0; i < dates.length; i++)\n    dates[i] = new Date()\n\
  \        {\n            // 文本在此处提供了匿名类的结构\n        }\n```\n\n“有效 `final`”的限制有时是不方便的。例如，假设你想更新闭包作用域内的计数器。在这里，我们想要统计在排序过程中\
  \ `compareTo` 方法被调用的次数：\n\n```java\nint counter = 0;\nDate[] dates = new Date[100];\n\
  for (int i = 0; i < dates.length; i++)\n    dates[i] = new Date()\n        {\n \
  \           // 匿名类逻辑\n        }\n```\n\n（注：提供的最后部分的文本是混乱/交错的。我将根据要求提取核心含义。）\n\n\
  ### 6.4.6 匿名内部类\n\n在使用局部类时，你通常可以更进一步。如果你想创建一个单独的对象，就不需要给类命名。这样的类被称为*匿名内部类*。\n\n\
  （文本继续显示了交错的示例）\n\n这种语法非常晦懂。它的意思是：创建一个实现 `ActionListener` 的类的新对象，其中所需的 `actionPerformed`\
  \ 方法在大括号 `{ }` 内部。\n\n通常情况下，语法为：\n\n点击此处查看代码图片\n\n```java\nnew SuperType(构造参数)\n\
  {\n    // 内部类的方法和数据\n}\n```\n\n在这里，*SuperType* 可以是一个接口，例如 `ActionListener`；那么内部类实现该接口。*SuperType*\
  \ 也可以是一个类；那么内部类扩展该类。\n\n匿名内部类没有构造函数，因为构造函数的名称必须与类名相同，而类没有名称。相反，构造参数是传递给*父类*构造函数的。特别是每当内部类实现接口时，它不能有任何构造参数。然而，你必须提供一组括号，如下：\n\
  \n```java\nnew InterfaceType()\n{\n    // 方法和数据\n}\n```\n\n你必须仔细观察构造一个类的新对象与构造一个扩展该类的匿名内部类对象之间的区别。\n\
  \n点击此处查看代码图片\n\n```java\nPerson queen = new Person(\"Mary\"); // 一个 Person 对象\n\
  Person count = new Person(\"Dracula\") { ... }; // 一个扩展 Person 的内部类对象\n```\n\n如果构造参数列表的右括号后面跟着一个左大括号，那么正在定义一个匿名内部类。\n\
  \n\n\n\n\n代码列表 6.8 包含了带有匿名内部类的闹钟程序的完整源代码。如果你将此程序与 代码列表 6.7 进行比较，你会发现在这种情况下，使用匿名内部类的解决方案要短得多，而且希望通过一些练习，它也能同样易于理解。\n\
  \n多年来，Java 程序员例行地使用匿名内部类作为事件监听器和其他回调。现在，你使用 lambda 表达式会更好。例如，本节开头的 `start` 方法可以用像下面这样的\
  \ lambda 表达式写得更加简洁：\n\n点击此处查看代码图像\n\n```java\npublic void start(int interval, boolean\
  \ beep)\n{\n    Timer t = new Timer(interval, event ->\n        {\n            System.out.println(\"\
  At the tone, the time is \" + new Date());\n            if (beep) Toolkit.getDefaultToolkit().beep();\n\
  \        });\n    t.start();\n}\n```\n\n![Image](img/note.jpg) **注意**\n\n下面的技巧被称为“双括号初始化”，它利用了内部类的语法。假设你想构造一个列表并将其传递给一个方法：\n\
  \n点击此处查看代码图像\n\n```java\nArrayList<String> friends = new ArrayList<>();\nfriends.add(\"\
  Harry\");\nfriends.add(\"Tony\");\ninvite(friends);\n```\n\n如果你不再需要这个列表，那么让它变成匿名会很不错。但这样你又如何添加元素呢？方法如下：\n\
  \n点击此处查看代码图像\n\n```java\ninvite(new ArrayList<String>() {{ add(\"Harry\"); add(\"\
  Tony\"); }});\n```\n\n注意双大括号。外层大括号形成 `ArrayList` 的匿名子类。内层大括号创建了一个对象构造块（参见 第 4 章）。\n\
  \n![Image](img/caution.jpg) **注意**\n\n创建一个几乎与其父类相同但并不完全相同的匿名子类通常是非常方便的。但你需要小心处理\
  \ `equals` 方法。在 第 5 章 中，我们建议你的 `equals` 方法使用测试：\n\n点击此处查看代码图像\n\n```java\nif (getClass()\
  \ != other.getClass()) return false;\n```\n\n匿名子类将通过此测试。\n\n![Image](img/tip.jpg)\
  \ **提示**\n\n当你产生日志或调试信息时，你通常想包含当前类的名称，例如：\n\n点击此处查看代码图像\n\n```java\nSystem.err.println(\"\
  Something awful happened in \" + getClass());\n```\n\n但这在静态方法中会失败。毕竟，对 `getClass`\
  \ 的调用会调用 `this.getClass()`，而静态方法没有 `this`。请使用以下表达式：\n\n点击此处查看代码图像\n\n```java\nnew\
  \ Object(){}.getClass().getEnclosingClass() // 获取静态方法的所在类\n```\n\n在这里，`new Object(){}`\
  \ 创建了一个 `Object` 匿名子类的匿名对象，而 `getEnclosingClass` 获取它的闭层类——即包含该静态方法的类。\n\n**列表 6.8**\
  \ `anonymousInnerClass/AnonymousInnerClassTest.java`\n\n点击此处查看代码图像\n\n```java\n\
  package anonymousInnerClass;\n\nimport java.awt.*;\nimport java.awt.event.*;\nimport\
  \ java.util.*;\nimport javax.swing.*;\nimport javax.swing.Timer;\n\n/**\n * 此程序演示了匿名内部类。\n\
  \ * @version 1.11 2015-05-12\n * @author Cay Horstmann\n */\npublic class AnonymousInnerClassTest\n\
  {\n    public static void main(String[] args)\n    {\n        TalkingClock clock\
  \ = new TalkingClock();\n        clock.start(1000, true);\n\n        // 保持程序运行直到用户选择\
  \ \"Ok\"\n        JOptionPane.showMessageDialog(null, \"Quit?\");\n        System.exit(0);\n\
  \    }\n}\n\n/**\n * 按固定间隔打印时间的闹钟。\n */\nclass TalkingClock\n{\n    /**\n     *\
  \ 启动闹钟。\n     * @param interval 消息之间的间隔（毫秒）\n     * @param beep 如果闹钟应该响铃则为 true\n\
  \     */\n    public void start(int interval, boolean beep)\n    {\n        ActionListener\
  \ listener = new ActionListener()\n        {\n            public void actionPerformed(ActionEvent\
  \ event)\n            {\n                System.out.println(\"At the tone, the time\
  \ is \" + new Date());\n                if (beep) Toolkit.getDefaultToolkit().beep();\n\
  \            }\n        };\n        Timer t = new Timer(interval, listener);\n \
  \       t.start();\n    }\n}\n```\n\n### 6.4.7 静态内部类\n\n偶尔，你只想使用内部类将一个类隐藏在另一个类内部——但你不需要内部类持有指向外部类对象的引用。你可以通过将内部类声明为\
  \ `static` 来抑制该引用的生成。\n\n有时，你可能想要使用内部类仅仅是为了将一个类隐藏在另一个类内部——但你不需要内部类持有指向外部类对象的引用。你可以通过将内部类声明为\
  \ `static` 来抑制该引用的生成。\n\n偶尔，你可能想要使用内部类仅仅是为了将一个类隐藏在另一个类内部——但你不需要内部类持有指向外部类对象的引用。你可以通过将内部类声明为\
  \ `static` 来抑制该引用的生成。\n\n偶尔，你可能想要使用内部类仅仅是为了将一个类隐藏在另一个类内部——但你不需要内部类持有指向外部类对象的引用。你可以通过将内部类声明为\
  \ `static` 来抑制该引用的生成。\n\n偶尔，你可能想要使用内部类仅仅是为了将一个类隐藏在另一个类内部——但你不需要内部类持有指向外部类对象的引用。你可以通过将内部类声明为\
  \ `static` 来抑制该引用的生成。\n\n偶尔，你可能想要使用内部类仅仅是为了将一个类隐藏在另一个类内部——但你不需要内部类持有指向外部类对象的引用。你可以通过将内部类声明为\
  \ `static` 来抑制该引用的生成。\n\n`minmax` 方法可以返回一个 `Pair` 类型的对象。当然，`Pair` 是一个极其常见的名称，在一个大型项目中，很有可能其他程序员也有同样的想法——但他们制作的\
  \ `Pair` 类包含一对字符串。我们可以通过将 `Pair` 设为 `ArrayAlg` 内部的公共内部类来解决这个潜在的名称冲突。这样该类在公共范围内的名称就是\
  \ `ArrayAlg.Pair`：\n\n点击此处查看代码图像\n\n```java\nArrayAlg.Pair p = ArrayAlg.minmax(d);\n\
  ```\n\n然而，与我们之前示例中的内部类不同，我们不希望 `Pair` 对象内部持有任何其他对象的引用。这种引用可以通过将内部类声明为 `static` 来抑制：\n\
  \n```java\nclass ArrayAlg\n{\n    public static class Pair\n    {\n        ...\n\
  \    }\n    ...\n}\n```\n\n当然，只有内部类可以声明为静态。静态内部类与任何其他内部类完全一样，只是静态内部类对象没有指向生成它的外部类对象的引用。在我们示例中，我们必须使用静态内部类，因为内部类对象是在静态方法内部构造的：\n\
  \n点击此处查看代码图像\n\n```java\npublic static Pair minmax(double[] d)\n{\n    ...\n   \
  \ return new Pair(min, max);\n}\n```\n\n方法的调用者使用 `getFirst` 和 `getSecond` 方法来获取答案：\n\
  \n点击此处查看代码图像\n\n```java\nPair p = ArrayAlg.minmax(d);\nSystem.out.println(\"min\
  \ = \" + p.getFirst());\nSystem.out.println(\"max = \" + p.getSecond());\n```\n\n\
