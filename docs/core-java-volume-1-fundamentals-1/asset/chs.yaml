  \n\n点击此处查看代码图像\n\n```java\nLogger logger = Logger.getLogger(\"com.mycompany.myapp\"\
  );\n\nlogger.setLevel(Level.FINE);\n\nlogger.setUseParentHandlers(false);\n\nHandler\
  \ handler = new ConsoleHandler();\n\nhandler.setLevel(Level.FINE);\n\nlogger.addHandler(handler);\n\
  ```\n\n默认情况下，日志器会将记录同时发送到它自己的处理器以及父级的处理器。我们的日志器是根日志器（名称为 `\"\"`）的子类，根日志器会将所有级别为\
  \ `INFO` 及以上的记录发送到控制台。然而，我们不希望重复看到这些记录，因此我们将 `useParentHandlers` 属性设置为 `false`。\n\
  \n若要将日志记录发送到其他地方，请添加另一个处理器。日志 API 为此目的提供了两个有用的处理器：`FileHandler` 和 `SocketHandler`。`SocketHandler`\
  \ 将记录发送到指定的主机和端口。更有趣的是 `FileHandler`，它将记录收集到一个文件中。\n\n你可以简单地将记录发送到默认的文件处理器，如下所示：\n\
  \n点击此处查看代码图像\n\n```java\nFileHandler handler = new FileHandler();\n\nlogger.addHandler(handler);\n\
  ```\n\n记录被发送到用户主目录下的文件 `javan.log`，其中 `n` 是一个使文件保持唯一的数字。如果用户的系统没有用户主目录的概念（例如在 Windows\
  \ 95/98/Me 中），则文件将存储在默认位置（如 `C:\\Windows`）。默认情况下，记录以 XML 格式格式化的。一个典型的日志记录形式如下：\n\
  \n点击此处查看代码图像\n\n```xml\n<record>\n  <date>2002-02-04T07:45:15</date>\n  <millis>1012837515710</millis>\n\
  \  <sequence>1</sequence>\n  <logger>com.mycompany.myapp</logger>\n  <level>INFO</level>\n\
  \  <class>com.mycompany.mylib.Reader</class>\n  <method>read</method>\n  <thread>10</thread>\n\
  \  <message>Reading file corejava.gif</message>\n</record>\n```\n\n你可以通过在日志管理器配置中设置各种参数来修改文件处理器的默认行为（参见表\
  \ 7.1），或使用另一个构造函数（参见本节末尾的 API 说明）。\n\n![图像](img/07tab01.jpg)\n\n**表 7.1** FileHandler\
  \ 配置参数\n\n你可能不想使用默认的日志文件名。因此，你应该使用另一种模式，例如 `%h/myapp.log.`。（请参见表 7.2 获取获取模式变量的说明。）\n\
  \n![图像](img/07tab02.jpg)\n\n**表 7.2** 日志文件模式变量\n\n如果多个应用程序（或同一个应用程序的多个副本）使用同一个日志文件，你应该开启\
  \ `append` 标志。或者，在文件名模式中使用 `%u`，以便每个应用程序都创建一个唯一的日志副本。\n\n开启文件轮转（file rotation）也是一个好主意。日志文件按轮转序列保存，例如\
  \ `myapp.log.0`、`myapp.log.1`、`myapp.log.2` 等。每当文件超过大小限制时，最旧的日志就会被删除，其他文件被重命名，并创建一个生成号为\
  \ `0` 的新文件。\n\n***\n\n![图像](img/tip.jpg) **提示**\n\n许多程序员使用日志作为技术支持人员的辅助。如果程序在环境中运行异常，用户可以发回日志文件进行检查。在这种情况下，你应该开启\
  \ `append` 标志、使用轮转日志，或两者兼顾。\n\n***\n\n你还可以通过扩展 `Handler` 或 `StreamHandler` 类来定义自己的处理器。我们在本节末尾的示例程序中定义了这样一个处理器。该处理器在窗口中显示记录（参见图\
  \ 7.2）。\n\n![图像](img/07fig02.jpg)\n\n**图 7.2** 一个在窗口中显示记录的日志处理器\n\n该处理器扩展了 `StreamHandler`\
  \ 类并安装了一个流，其 `write` 方法将流输出显示在文本区域中。\n\n点击此处查看代码图像\n\n```java\nclass WindowHandler\
  \ extends StreamHandler\n{\n  public WindowHandler()\n  {\n      ...\n      final\
  \ JTextArea output = new JTextArea();\n      setOutputStream(new\n        OutputStream()\n\
  \        {\n          public void write(byte[] b, int off, int len)\n          {\n\
  \            output.append(new String(b, off, len));\n          }\n        });\n\
  \  }\n\n  @Override\n  public void publish(LogRecord record)\n  {\n    super.publish(record);\n\
  \  }\n\n  @Override\n  protected void write(byte[] b, int off, int len)\n  {\n \
  \   // not implemented\n  }\n\n  @Override\n  protected void flush()\n  {\n    //\
  \ not implemented\n  }\n\n  @Override\n  public void close()\n  {\n    // not implemented\n\
  \  }\n}\n```\n\n### 7.5.6 过滤器\n\n默认情况下，记录根据级别进行过滤。每个日志器和处理器都可以有一个可选的过滤器。要定义过滤器，请实现\
  \ `Filter` 接口并定义方法：\n\n```java\nboolean isLoggable(LogRecord record)\n```\n\n分析日志记录，并对于应该包含的记录返回\
  \ `true`。要将过滤器安装到日志器或处理器，只需调用 `setFilter` 方法。注意只有一个。\n\n### 7.5.7 格式化器\n\n`ConsoleHandler`\
  \ 和 `FileHandler` 类以文本和 XML 输出日志记录。然而，你也可以定义自己的格式。你需要扩展 `Formatter` 类并重写方法：\n\n\
  ```java\nString format(LogRecord record)\n```\n\n以你喜欢的任何方式格式化信息并返回生成的字符串。在你的 `format`\
  \ 方法中，你可能希望调用方法：\n\n```java\nString formatMessage(LogRecord record)\n```\n\n该方法格式化记录的消息，替换参数并应用本地化。\n\
  \n许多格式（如 XML）需要环绕格式化记录的头部和尾。要实现这一点，重写方法：\n\n```java\nString getHead(Handler h)\n\
  String getTail(Handler h)\n```\n\n最后，调用 `setFormatter` 方法将格式化器安装到处理器中。\n\n### 7.5.8\
  \ 日志配谱\n\n由于有许多日志选项，很容易忘记基础知识。下面的配谱总结了最常用的操作。\n\n**1.** 对于简单的应用程序，选择一个日志器。给日志器命名为与主应用程序包相同的名称，例如\
  \ `com.mycompany.myprog`。你可以始终通过调用获取日志器：\n\n```java\nLogger logger = Logger.getLogger(\"\
  com.mycompany.myprog\");\n```\n\n为了方便，你可能想为大量日志活动的类添加静态字段：\n\n```java\nprivate static\
  \ final Logger logger = Logger.getLogger(\"com.mycompany.myprog\");\n```\n\n**2.**\
  \ 默认日志配置将所有 `INFO` 以上的消息记录到控制台。用户可以覆盖默认配置，但正如你所见，过程有点复杂。因此，在应用程序中安装一个更合理的默认是一个好主意。\n\
  \n下面的代码确保所有消息都记录到应用程序特定的文件中。将此代码放在应用程序的 `main` 方法中。\n\n点击此处查看代码图像\n\n```java\nif\
  \ (System.getProperty(\"java.util.logging.config.class\") == null)\n```\n\n\n\n\n\
  \n```java\n&& System.getProperty(\"java.util.logging.config.file\") == null)\n{\n\
  \    try\n    {\n        Logger.getLogger(\"\").setLevel(Level.ALL);\n        final\
  \ int LOG_ROTATION_COUNT = 10;\n        Handler handler = new FileHandler(\"%h/myapp.log\"\
  , 0, LOG_ROTATION_COUNT);\n        Logger.getLogger(\"\").addHandler(handler);\n\
  \    }\n    catch (IOException e)\n    {\n        logger.log(Level.SEVERE, \"Can't\
  \ create log file handler\", e);\n    }\n}\n```\n\n### 3. 现在，你已经准备好尽情地记录日志了。请记住，所有级别为\
  \ `INFO`、`WARNING` 和 `SEVERE` 的消息都会显示在控制台上。因此，请为这些级别留给对你的程序用户有意义的消息。`FINE` 级别是记录面向程序员的日志消息的良好选择。\n\
  \n每当你想要调用 `System.out.println` 时，请改为发布日志消息：\n\n点击此处查看代码图片\n\n```java\nlogger.fine(\"\
  File open dialog canceled\");\n```\n\n记录意外异常也是一个好主意。例如：\n\n点击此处查看代码图片\n\n```java\n\
  try\n{\n    ...\n}\ncatch (SomeException e)\n{\n    logger.log(Level.FINE, \"explanation\"\
  , e);\n}\n```\n\n列表 7.2 通过增加一个小技巧展示了这一配方：日志消息也会显示在日志窗口中。\n\n**列表 7.2** `logging/LoggingImageViewer.java`\n\
  \n点击此处查看代码图片\n\n```java\npackage logging;\n\nimport java.awt.*;\nimport java.awt.event.*;\n\
  import java.io.*;\nimport java.util.logging.*;\nimport javax.swing.*;\n\n/**\n *\
  \ 一个记录各种事件的图像查看器程序。\n * @version 1.03 2015-08-20\n * @author Cay Horstmann\n */\n\
  public class LoggingImageViewer\n{\n    public static void main(String[] args)\n\
  \    {\n        if (System.getProperty(\"java.util.logging.config.class\") == null\n\
  \                && System.getProperty(\"java.util.logging.config.file\") == null)\n\
  \        {\n            try\n            {\n                Logger.getLogger(\"\
  com.horstmann.corejava\").setLevel(Level.ALL);\n                final int LOG_ROTATION_COUNT\
  \ = 10;\n                Handler handler = new FileHandler(\"%h/LoggingImageViewer.log\"\
