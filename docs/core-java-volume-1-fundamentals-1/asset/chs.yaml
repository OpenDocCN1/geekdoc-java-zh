  ***\n\n### 3.7.2 格式化输出\n\n你可以使用语句 `System.out.print(x)` 向控制台打印数字 `x`。该命令将打印具有该类型最大数字\
  \ `x`。例如：\n\n```java\ndouble x = 10000.0 / 3.0;\nSystem.out.print(x);\n```\n\n打印\
  \ `3333.333333333335`\n\n如果你想显示美元和分，这就会是一个问题。\n\n在 Java 的早期版本中，格式化数字有点麻烦。幸运的是，Java\
  \ SE 5.0 带回了 C 库中久违的 `printf` 方法。例如，调用\n\n点击查看代码图片\n\n```java\nSystem.out.printf(\"\
  %8.2f\", x);\n```\n\n打印*字段宽度*为 8 个字符且*精度*为 2 个字符的 `x`。也就是说，输出包含一个前导空格和七个字符 3333.33\n\
  \n你可以为 `printf` 提供多个参数。例如：\n\n```java\nSystem.out.printf(\"Hello, %s. Next year,\
  \ you'll be %d\", name, age);\n```\n\n每个以 `%` 字符开头的格式说明符都会被相应的参数替换。结束格式说明符的*转换字符*指示要格式化的值的类型：`f`\
  \ 是浮点数，`s` 是字符串，`d` 是十进制整数。表 3.5 显示了所有的转换字符。\n\n\n\n\n\n此外，你可以指定控制格式化输出外观的 `flags`（标志）。表\
  \ 3.6 显示了标志。例如，逗号标志会添加分组分隔符。即：\n\n点击此处查看代码图像\n\n```\nSystem.out.printf(\"%,.2f\"\
  , 10000.0 / 3.0);\n```\n\n![Image](img/03tab06.jpg)\n\n**表 3.6** `printf` 的标志\n\n\
  打印\n\n3,333.33\n\n你可以使用多个标志，例如使用 `\"%,(.2f\"` 来使用分组分隔符并将负数括在括号内。\n\n* *\n\n![Image](img/note.jpg)\
  \ 备注\n\n你可以使用 `s` 转换符来格式化任意对象。如果任意对象实现了 `Formattable` 接口，则会调用该对象的 `formatTo` 方法。否则，将调用\
  \ `toString` 方法将对象转换为字符串。我们将在 第 5 章 中讨论 `toString` 方法，并在 第 6 章 中讨论接口。\n\n* *\n\n\
