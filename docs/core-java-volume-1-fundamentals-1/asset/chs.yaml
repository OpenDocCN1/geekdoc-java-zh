  // SequenceInputStream 构造函数期望一个 enumeration\n```\n\n\n\n\n将 `i` 位置 1。最后，\n\n```java\n\
  bucketOfBits.clear(i)\n```\n\n将 `i` 位置 0。\n\n![Image](img/note1.jpg) C++ Note\n\n\
  C++ 的 `bitset` 模板与 Java 平台的 `BitSet` 相同的功能。\n\n### java.util.BitSet `1.0`\n\n- `BitSet(int\
  \ initialCapacity)` 构造一个位集。\n- `int length()` 返回位集的“逻辑长度”：`1` 加上最高置 1 位的索引。\n- `boolean\
  \ get(int bit)` 获取一个位的值。\n- `void set(int bit)` 设置一个位。\n- `void clear(int bit)`\
  \ 清空一个位。\n- `void and(BitSet set)` 将此位集与另一个位集进行逻辑与（AND）运算。\n- `void or(BitSet set)`\
  \ 将此位集与另一个位集进行逻辑或（OR）运算。\n- `void xor(BitSet set)` 将此位集与另一个位集进行逻辑异或（XOR）运算。\n- `void\
  \ andNot(BitSet set)` 清空此位集中所有在另一个位集中被置 1 的位。\n\n作为位集使用的示例，我们想向你展示一种寻找素数的“埃拉托尼筛法”（sieve\
  \ of Eratosthenes）算法实现。（素数是指像 2、3 或 5 这样只能被自己和 1 整除的数，而埃拉托尼筛法是最早发现的这些基础构建单元的方法之一。）这并不是一个寻找素数的完美算法，但出于某种原因，它变成了编译器性能的热门基准。（它也不是一个很好的基准，因为它主要测试位操作。）\n\
  \n好吧，我们遵循传统并提供一个实现。这个程序统计 2 到 2,000,000 之间的所有素数。（在这个范围内有 148,933 个素数，所以你可能不想把它们全部打印出来。）\n\
  \n在不涉及程序过多细节的情况下，其思想是遍历一个拥有 200 万位的位集。首先，我们开启所有位。之后，我们关闭所有已知素数倍数的位。经过此过程后剩余的位的位置本身就是素数。Listing\
  \ 9.8 列出了 Java 语言实现的该程序，而 Listing 9.9 是 C++ 代码。\n\n![Image](img/note.jpg) Note\n\
  \n尽管筛法不是一个很好的基准，但我们无法抵制对该算法的两种实现进行计时。以下是在运行 Ubuntu 14.04、配备 8 GB 内存的 2.9-GHz 双核\
  \ ThinkPad 上的计时结果。\n\n- C++ (`g++ 4.6.3`): 390 毫秒\n- Java (`Java SE 8`): 119 毫秒\n\
  \n我们已经在 *Core Java* 的九个版本中运行过这项测试，在最后五个版本中，Java 轻松击败 C++。公平地说，如果调高 C++ 编译器的优化级别，它以\
  \ 33 毫秒的时间超过了 Java。只有当程序运行得足够长以触发 Hotspot 即时编译器（JIT compiler）时，Java 才能与之匹配。\n\n\
  #### Listing 9.8 `sieve/Sieve.java`\n\n点击此处查看代码图像\n\n```java\npackage sieve;\n\n\
  import java.util.*;\n\n/**\n * 此程序运行埃拉托尼筛法基准。它计算所有直到 2,000,000 的素数。\n * @version\
  \ 1.21 2004-08-03\n * @author Cay Horstmann\n */\npublic class Sieve\n{\n    public\
  \ static void main(String[] s)\n    {\n        int n = 2000000;\n        long start\
  \ = System.currentTimeMillis();\n        BitSet b = new BitSet(n + 1);\n       \
  \ int count = 0;\n        int i;\n        for (i = 2; i <= n; i++)\n           \
  \ b.set(i);\n        i = 2;\n        while (i * i <= n)\n        {\n           \
  \ if (b.get(i))\n            {\n                count++;\n                int k\
  \ = 2 * i;\n                while (k <= n)\n                {\n                \
  \    b.clear(k);\n                    k += i;\n                }\n            }\n\
  \            i++;\n        }\n        while (i <= n)\n        {\n            if\
  \ (b.get(i)) count++;\n            i++;\n        }\n        long end = System.currentTimeMillis();\n\
  \        System.out.println(count + \" primes\");\n        System.out.println((end\
  \ - start) + \" milliseconds\");\n    }\n}\n```\n\n#### Listing 9.9 `sieve/sieve.cpp`\n\
  \n点击此处查看代码图像\n\n```cpp\n/**\n * @version 1.21 2004-08-03\n * @author Caymann\n */\n\
  #include <bitset>\n#include <iostream>\n#include <ctime>\n\nusing namespace std;\n\
  \nint main()\n{\n    const int N = 2000000;\n    clock_t cstart = clock();\n\n \
  \   bitset<N + 1> b;\n    int count = 0;\n    int i;\n    for (i = 2; i <= N; i++)\n\
  \        b.set(i);\n    i = 2;\n    while (i * i <= N)\n    {\n        if (b.test(i))\n\
  \        {\n            count++;\n            int k = 2 * i;\n            while\
  \ (k <= N)\n            {\n                b.reset(k);\n                k += i;\n\
  \            }\n        }\n        i++;\n    }\n    while (i <= N)\n    {\n    \
  \    if (b.test(i))\n            count++;\n        i++;\n    }\n\n    clock_t cend\
  \ = clock();\n    double millis = 1000.0 * (cend - cstart) / CLOCKS_PER_SEC;\n\n\
  \    cout << count << \" primes\\n\" << millis << \" milliseconds\\n\";\n\n    return\
  \ 0;\n}\n```\n\n这就是对 Java 框架的介绍。正如你所看到的，Java 提供了大量的类来满足你的编程需求。在下一章中，你将学习如何编写图形用户界面。\n\
  \n# 第 10 章 图形编程\n\n## 本章内容\n\n- 10.1 Introduction Swing\n- 10.2 创建 Frame\n- 10.3\
  \ 定位 Frame\n- 10.4 在组件中显示信息\n- 10.5 使用 2D API\n- 10.6 使用颜色\n- 10.7 使用特殊字体显示文本\n\
  - 10.8 显示图像\n\n到目前为止，你只学会了编写从键盘获取输入、处理并在控制台屏幕上显示结果的程序。这并不是大多数用户想要的。现代程序不是这样工作的，网页页也是如此。本章将带你进入编写图形用户界面（GUI）的\
  \ Java 程序之路。特别是，你将学习如何编写在屏幕上调整窗口大小并定位、显示多种字体文本等程序。\n\n\n\n\n\n基于对等（peer-based）的方法在简单应用程序中效果良好，但很快就会发现，编写一个依赖于原生用户界面元素的、高质量的可移植图形库是极其困难的。像菜单、滚动条和文本字段等用户界面元素在不同平台上的行为可能存在细微差异。因此，通过这种方法很难为用户提供一致且可预测的体验。此外，某些图形环境（如\
  \ X11/Motif）拥有的用户界面组件库并不像 Windows 或 Macintosh 那样丰富。这反过来进一步限制了基于“最小公约数”方法的可移植库。结果，使用\
  \ `AWT` 构建的 GUI 应用程序看起来并不像原生的 Windows 或 Macintosh 应用程序那样漂亮，也不具备这些平台用户所期待的功能。更令人沮丧的是，不同平台上的\
  \ `AWT` 用户界面库存在不同的 Bug。开发者抱怨说，他们必须在每个平台上都测试自己的应用程序——这种做法被嘲讽地称为“一次编写，处处调试”。\n\n1996\
  \ 年，Netscape 创建了一个名为 `IFC`（网络基础类）的 GUI 库，它采用了一种完全不同的方法。用户界面元素（如按钮、菜单等）被绘制在空白窗口上。底层窗口系统所需的功能仅为一种显示窗口和在窗口上进行绘制的方法。因此，Netscape\
  \ 的 `IFC` 组件无论程序运行在哪个平台上，其外观和行为都是相同的。Sun 与 Netscape 合作完善了这种方法，创建了一个代号为“Swing”的用户界面库。`Swing`\
  \ 作为 `Java 1.1` 的扩展被提供，并成为 `Java SE 1.2` 标准库的一部分。\n\n正如杜克·埃林顿（Duke Ellington）所说，“如果没有那种\
  \ Swing 感觉，它就毫无意义（It Don’t Mean a Thing If It Ain’t Got That Swing）”，`Swing` 现在是这种非对等\
  \ GUI 工具包的正式名称。`Swing` 是 `Java Foundation Classes` (`JFC`）的一部分。整个 `JFC` 非常庞大，包含的内容远不止\
  \ `Swing` GUI 工具包；除了 `Swing` 组件外，它还拥有访问性 API、2D API 和拖放 API。\n\n***\n\n![Image](img/note.jpg)\
  \ 备注\n\n`Swing` 并不是 `AWT` 的完全替代品——它是基于 `AWT` 架构构建的。`Swing` 只是为你提供了更强大的用户界面组件。每当你编写\
  \ `Swing` 程序时，你都会使用 `AWT` 的基础——特别是事件处理。从现在起，当我们说“Swing”时，指的是“绘制”的用户界面类；当我们说“AWT”时，指的是窗口工具包的底层机制，例如事件处理。\n\
  \n***\n\n当然，基于 `Swing` 的用户界面元素在用户屏幕上出现的速度会比 `AWT` 使用的对等组件慢一些。根据我们的经验，在任何相当现代的机器上，速度差异都不应该是问题。另一方面，选择\
  \ `Swing` 的理由是压倒性的优势：\n\n* `Swing` 拥有一套丰富且方便的用户界面元素。\n* `Swing` 对底层平台的依赖较少；因此较不容易产生特定平台的\
  \ Bug。\n* `Swing` 提供了跨平台的一致用户体验。\n\n尽管如此，第三个优点也是一个潜在的缺点：如果用户界面元素在所有平台上看起来都一样，那么它们与原生控件看起来不同，因此用户对它们的熟悉程度较低。\n\
  \n`Swing` 以一种非常优雅的方式解决了这个问题。编写 `Swing` 程序的程序员可以为程序赋予特定的“外观和感觉（look-and-feel）”。例如，图\
  \ 10.1 和 10.2 显示了同一个程序在 Windows 和 GTK 外观感觉下的运行情况。\n\n![Image](img/10fig01.jpg)\n\
  \n**图 10.1** `Swing` 的 Windows 外观和感觉\n\n![Image](img/10fig02.jpg)\n\n**图 10.2**\
  \ `Swing` 的 GTK 外观和感觉\n\n此外，Sun 开发了一种名为“Metal”的平台无关的外观，直到营销人员将其重命名为“Java 外观（Java\
  \ look-and-feel）”。然而，大多数程序员继续使用“Metal”术语，我们在书中也会这样做。\n\n有些人批评 `Metal` 过于呆板，因此在 `Java\
  \ SE 5.0` 发布时对其外观进行了更新（参见图 10.3）。现在 `Metal` 外观支持多种主题——颜色和字体的细微变化。默认主题被称为“Ocean（海洋）”。\n\
  \n![Image](img/10fig03.jpg)\n\n**图 10.3** Metal 外观感觉的 Ocean 主题\n\n在 `Java SE 6`\
  \ 中，Sun 改进了对 Windows 和 GTK 原生外观感觉的支持。`Swing` 现在将获取颜色方案自定义，并忠实地渲染那些流行的动态按钮和滚动条。\n\
  \n一种名为 `Nimbus` 的新外观感觉（图 10.4）从 `Java SE 7` 开始提供，但默认不可用。`Nimbus` 使用矢量图而非位图，因此独立于屏幕分辨率。\n\
  \n![Image](img/10fig04.jpg)\n\n**图 10.4** Nimbus 外观感觉\n\n有些用户喜欢他们的 Java 程序使用原生外观感觉，其他人喜欢\
  \ `Metal` 或第三方外观感觉。正如你在第 11 章中将看到的，让用户选择他们喜爱的的外观感觉非常简单。\n\n***\n\n![Image](img/note.jpg)\
  \ 备注\n\n虽然我们在书中没有空间教你如何实现，但 Java 程序员可以扩展现有的外观感觉，甚至设计一个全新的。这是一个涉及指定 Swing 组件如何绘制的繁琐过程。一些开发者已经这样做了，特别是当\
  \ Java 移植到自助终端或手持设备时。访问 [javootoo.com](http://javootoo.com) 可以找到一些有趣的实现。\n\n`Java\
  \ SE 5.0` 引入了一种名为 `Synth` 的外观感觉，使得这个过程变得简单。在 `Synth` 中，你可以通过提供文件和 XML 描述符来定义新的外观感觉，而无需编程。\n\
  \n***\n\n***\n\n![Image](img/tip.jpg) 提示\n\nNapkin 外观感觉 ([`napkinlaf.sourceforge.net`](http://napkinlaf.sourceforge.net))\
  \ 为所有用户界面元素提供了手绘外观。这在你向客户展示原型时非常有用，传达出一个清晰的信息：你给给他们的不是成品。\n\n***\n\n***\n\n![Image](img/note.jpg)\
  \ 备注\n\n大多数 Java 用户界面编程现在使用 Swing 完成，但有一个显著的例外。Eclipse 集成开发环境使用一个名为 `SWT` 的图形库，它与\
  \ `AWT` 相似，映射到各种平台的原生组件。你可以在 [eclipse.org/articles](http://eclipse.org/articles)\
  \ 找到关于 `SWT` 的文章。\n\nOracle 正在开发一种名为 `JavaFX` 的替代技术作为 `Swing` 的替代品。我们书中没有讨论 `JavaFX`。更多信息请参见\
  \ [`docs.oracle.com/javase/8/javafx/get-started-tutorial/jfx-overview.htm`](http://docs.oracle.com/javase/8/javafx/get-started-tutorial/jfx-overview.htm)。\n\
  \n***\n\n本章的剩余部分将向你展示显示窗口和绘制内容的基础知识。\n\n## 10.2 创建窗口\n\n\n\n\n在 Java 中，顶层窗口（即不包含在另一个窗口内的窗口）被称为帧（frame）。AWT\
  \ 库有一个名为 `Frame` 的类用于这种顶层窗口。该类的 Swing 版本被称为 `JFrame`，它继承自 `Frame` 类。`JFrame` 是 Swing\
  \ 组件中少数几个不在画布上绘制的组件之一。因此，装饰性（按钮、标题栏、图标等）是由用户的窗口系统绘制的，而不是由 Swing 绘制的。\n\n* *\n\n\
  ![Image](img/caution.jpg) 注意\n\n大多数 Swing 组件类都以“J”开头：`JButton`、`JFrame` 等。虽然存在诸如\
  \ `Button` 和 `Frame` 这样的类，但它们是 AWT 组件。如果你不小心漏掉了“J”，你的程序可能仍然编译并运行，但 Swing 和 AWT 组件的混合会导致视觉和行为上的不一致。\n\
  \n* *\n\n在本节中，我们将介绍操作 Swing `JFrame` 的最常用方法。列表 10.1 列出了一个简单的程序，该程序在屏幕上显示一个空帧，如图\
  \ 10.5 所示。\n\n![Image](img/10fig05.jpg)\n\n**图 10.5** 最简单的可见帧\n\n**列表 10.1** `simpleframe/SimpleFrameTest.java`\n\
  \n点击此处查看代码图片\n\n* *\n\n```java\npackage simpleFrame;\n\nimport java.awt.*;\nimport\
  \ javax.swing.*;\n\n/**\n * @version 1.33 2015-05-12\n * @author Cay Horstmann\n\
  \ */\npublic class SimpleFrameTest\n{\n    public static void main(String[] args)\n\
  \    {\n        EventQueue.invokeLater(() ->\n        {\n            SimpleFrame\
  \ frame = new SimpleFrame();\n            frame.setDefaultCloseOperation(JFrame.EXIT_ON_CLOSE);\n\
  \            frame.setVisible(true);\n        });\n    }\n}\n\nclass SimpleFrame\
  \ extends JFrame\n{\n    private static final int DEFAULT_WIDTH = 300;\n    private\
  \ static final int DEFAULT_HEIGHT = 200;\n\n    public SimpleFrame()\n    {\n  \
  \      setSize(DEFAULT_WIDTH, DEFAULT_HEIGHT);\n    }\n}\n```\n\n* *\n\n让我们逐行分析这个程序。\n\
  \nSwing 类存放在 `javax.swing` 包中。包名 `java.x` 表示这是一个 Java 扩展包，而不是核心包。出于历史原因，Swing 被认为是一个扩展。然而，自\
  \ 1.2 版本以来，在每个 Java SE 实现中都存在它。\n\n默认情况下，帧的尺寸为非常没有用的 0 × 0 像素。我们定义了一个子类 `SimpleFrame`，其构造函数将尺寸设置为\
  \ 300 × 200 像素。这是 `SimpleFrame` 和 `JFrame` 之间唯一的区别。\n\n在 `SimpleFrameTest` 类的 `main`\
  \ 方法中，我们构造了一个 `SimpleFrame` 对象并使其变为可见。\n\n在每个 Swing 程序中，我们都需要解决两个技术问题。\n\n首先，所有的\
  \ Swing 组件都必须从事件分发线程（event dispatch thread）进行配置，该线程是将鼠标点击和按键输入等事件传递给用户界面组件的控制线程。以下代码段用于在事件分发线程中执行语句：\n\
  \n```java\nEventQueue.invokeLater(() ->\n{\n    statements\n});\n```\n\n我们将在第 14\
  \ 章中讨论细节。\n\n* *\n\n![Image](img/caution.jpg) 注意\n\n大多数 Swing 组件类都以“J”开头：`JButton`、`JFrame`\
  \ 等。虽然存在诸如 `Button` 和 `Frame` 这样的类，但它们是 AWT 组件。如果你不小心漏掉了“J”，你的程序可能仍然编译并运行，但 Swing\
  \ 和 AWT 组件的混合会导致视觉和行为上的不一致。\n\n* *\n\n*(注：由于原文中存在大量重复段落，译文已按要求处理并去除了重复内容。)*\n\n\n\
  \n\n本节的 API 说明列出了我们认为的赋予框架正确外观和感觉的最重要方法。其中一些方法定义在 `JFrame` 类中，另一些方法则来自 `JFrame`\
  \ 的各种超类。在某些情况下，你可能需要搜索 API 文档以查看是否有用于某些特殊用途的方法。遗憾的是，对于继承的方法，这样做有点繁琐。例如，`toFront`\
  \ 方法适用于 `JFrame` 类型的对象，但由于它只是简单地继承自 `Window` 类，因此 `JFrame` 的文档并没有解释它。如果你觉得应该有一个方法来执行某些操作，但在你正在处理的类的文档中没有提到它，请尝试查看该类的各超类方法的\
  \ API 文档。每个 API 页面的顶部都有通往超类的超链接，而继承的方法列在新方法和重写方法的摘要下方。\n\n***\n\n正如 API 注意事项所示，`Component`\
  \ 类（所有 GUI 对象的祖先）和 `Window` 类（`Frame` 类的超类）是你需要查找调整框架大小和形状方法的地方。例如，`Component` 类中的\
  \ `setLocation` 方法是重新定位组件的一种方法。如果你调用\n\n```\nsetLocation(x, y)\n```\n\n左上角将位于向右\
  \ `x` 像素、向下 `y` 像素的位置，其中 `(0, 0)` 是屏幕的左上角。同样，`Component` 中的 `setBounds` 方法允许你一步到位调整组件的大小并重新定位（特别是\
  \ `JFrame`），如下\n\n```\nsetBounds(x, y, width, height)\n```\n\n或者，你可以让窗口系统控制窗口的放置。如果你在显示窗口之前调用\n\
  \n```\nsetLocationByPlatform(true);\n```\n\n窗口系统将选择位置（但不选择大小），通常与上一个窗口有轻微的偏移。\n\n\
  ***\n\n![Image](img/note.jpg) 注意\n\n对于框架而言，`setLocation` 和 `setBounds` 的坐标是相对于整个屏幕的。正如你将在第\
  \ 12 章中看到的那样，对于容器内部的其他组件，测量值是相对于容器的。\n\n***\n\n### 10.3.1 框架属性\n\n组件类的许多方法以 getter/setter\
  \ 对的形式出现，例如 `Frame` 类的以下方法：\n\n```\npublic String getTitle()\npublic void setTitle(String\
  \ title)\n```\n\n这样的 getter/setter 对被称为一个*属性*。一个属性有一个名称和一个类型。名称通过将 `get` 或 `set`\
  \ 之后的第一个字母改为小写来获得。例如，`Frame` 类有一个名称为 `title` 且类型为 `String` 的属性。\n\n从概念上讲，`title`\
  \ 是框架的一个属性。当我们设置该属性时，我们期望标题在用户的屏幕上发生变化。当我们获取该属性时，我们期望得到我们所设置的值。\n\n我们不知道（或不在乎）`Frame`\
  \ 类如何实现这个属性。它可能简单地使用它的对等框架（peer frame）来存储标题。它可能有一个实例字段\n\n```\nprivate String title;\
  \ // 属性不需要\n```\n\n如果该类确实有一个匹配的实例字段，我们不知道（或不在乎）getter 和 setter 方法是如何实现的。它们可能只是读取和写入该实例字段。它们可能做了更多工作，例如在每次每次更改时通知窗口系统。\n\
  \n`get`/`set` 惯例有一个例外：对于 `boolean` 类型的属性，getter 以 `is` 开头。例如，以下两个方法定义了 `locationByPlatform`\
  \ 属性：\n\n```\npublic boolean isLocationByPlatform()\npublic void setLocationByPlatform(boolean\
  \ b)\n```\n\n### 10.3.2 确定良好的框架大小\n\n记住：如果你不显式地为框架设置大小，所有框架将默认为 0  0 像素。为了保持我们的示例程序简单，我们将框架调整为我们认为在大多数显示器上运行尚可的大小。然而，在专业应用程序中，你应该检查用户屏幕的分辨率并编写代码相应调整框架的大小：在低端笔记本电脑屏幕上看起来很好的窗口，在高分辨率屏幕上看起来会像一张邮票。\n\
  \n要查找屏幕大小，请使用以下步骤。调用 `Toolkit` 类的静态方法 `getDefaultToolkit` 来获取 `Toolkit` 对象。（`Toolkit`\
  \ 类是各种与原生窗口系统接口的方法的汇聚地。）然后，调用 `getScreenSize` 方法，该方法作为 `Dimension` 对象返回屏幕大小。`Dimension`\
  \ 对象同时在公共的 (!) 实例变量 `width` 和 `height` 中存储宽度和高度。以下是代码：\n\n```java\nToolkit kit =\
  \ Toolkit.getDefaultToolkit();\nDimension screenSize = kit.getScreenSize();\nint\
  \ screenWidth = screenSize.width;\nint screenHeight = screenSize.height;\n```\n\n\
  我们使用这些值的 50% 作为框架大小，并告诉窗口系统放置框架：\n\n```java\nsetSize(screenWidth / 2, screenHeight\
  \ / 2);\n```\n\n我们还提供图标。`ImageIcon` 类对于加载图像非常方便。以下是它的使用方法：\n\n```\nImage img = new\
  \ ImageIcon(\"icon\").getImage();\nsetIcon(img);\n```\n\n根据你的操作系统，你可以在不同的地方看到图标。例如，在\
  \ Windows 中，图标在左上角，你可以在按 Alt+Tab 的活动任务列表中看到它。\n\n处理框架的一些技巧：\n\n- 如果你的框架包含按钮和文本字段等标准组件，只需调用\
  \ `pack` 将框架调整为包含所有组件的最小大小。你可以通过调用 `setExtendedState(Frame.MAXIMIZED_BOTH)` 最大化框架。\n\
  - 启动应用程序时，记住用户的位置和大小也是好主意。\n- 如果你编写利用多个显示器的应用程序，使用 `GraphicsEnvironment` 和 `GraphicsDevice`\
  \ 类来查找显示器的尺寸。`GraphicsDevice` 类还允许你以全屏模式执行应用程序。\n\n```java\npackage sizedFrame;\n\
  \nimport java.awt.*;\nimport javax.swing.*;\n\n/**\n * @version 1.3 2007-05-12\n\
  \ * @author Cay Horstmann\n */\npublic class SizedTest {\n    public static void\
  \ main(String[] args) {\n        EventQueue.invokeLater(() -> {\n            JFrame\
  \ frame = new SizedFrame();\n            frame.setTitle(\"SizedFrame\");\n     \
  \       frame.setDefaultCloseOperation(JFrame.EXIT_ON_CLOSE);\n            frame.setVisible(true);\n\
  \        });\n    }\n}\n\nclass SizedFrame extends JFrame {\n    public SizedFrame()\
  \ {\n        // get screen dimensions\n        Toolkit kit = Toolkit.getDefaultToolkit();\n\
  \        Dimension screenSize = kit.getScreenSize();\n        int screenWidth =\
  \ screenSize.width;\n        int screenHeight = screenSize.height;\n    }\n}\n```\n\
  \n\n\n\n```java\n// 设置帧宽、高度并让平台选择屏幕位置\nsetSize(screenWidth / 2, screenHeight / 2);\n\
  setLocationByPlatform(true);\n\n// 设置帧图标\nImage img = new ImageIcon(\"icon.gif\"\
  ).getImage();\nsetIconImage(img);\n}\n```\n\n### java.awt.Component 1.0\n\n- `boolean\
  \ isVisible()`\n- `void setVisible(boolean b)`\n获取或设置 `visible` 属性。组件初始是可见的，但 `JFrame`\
  \ 等顶层组件除外。\n- `void setSize(int width, int height)` 1.1\n将组件的大小调整为指定的宽度和高度。\n- `void\
  \ setLocation(int x, int y)` 1.1\n将组件移动到新位置。如果组件不是顶层组件，则 `x` 和 `y` 坐标使用容器的坐标；如果组件是顶层组件（例如\
  \ `JFrame`），则使用屏幕坐标。\n\n- `void setBounds(int x, int y, int width, int height)`\
  \ 1.1\n移动并调整此组件的大小。\n- `Dimension getSize()` 1.1\n- `void setSize(Dimension d)`\
  \ 1.1\n获取或设置此组件的 `size` 属性。\n\n### java.awt.Window 1.0\n\n- `void toFront()`\n将此窗口置在任何其他窗口之上。\n\
  - `void toBack()`\n将此窗口移动到桌面窗口栈的最后，并相应地重新排列所有其他可见窗口。\n- `boolean isLocationByPlatform()`\
  \ 5.0\n- `void setLocationByPlatform(boolean b)` 5.0\n获取或设置 `locationByPlatform`\
  \ 属性。当窗口显示之前设置该属性时，平台将选择合适的位置。\n\n### java.awt.Frame 1.0\n\n- `boolean isResizable()`\n\
  - `void setResizable(boolean b)`\n获取或设置 `resizable` 属性。当设置该属性时，用户可以调整帧的大小。\n- `String\
  \ getTitle()`\n- `void setTitle(String s)`\n获取或设置 `title` 属性，该属性决定帧标题栏中的文本。\n- `Image\
  \ getIconImage()`\n- `void setIconImage(Image image)`\n获取或设置 `iconImage` 属性，该属性决定帧的图标。窗口系统可能会将图标作为帧装饰的一部分或其他位置进行显示。\n\
  - `boolean isUndecorated()` 1.4\n- `void setUndecorated(boolean b)` 1.4\n获取或设置 `undecorated`\
  \ 属性。当设置该属性时，帧将在没有装饰（如标题栏或关闭按钮）的情况下显示。此方法在帧显示之前调用。\n- `int getExtendedState()` 1.4\n\
  - `void setExtendedState(int state)` 1.4\n获取或设置扩展窗口状态。该状态为以下之一：\n- `Frame.NORMAL`\n\
  - `Frame.ICONIFIED`\n- `Frame.MAXIMIZED_HORIZ`\n- `Frame.MAXIMIZED_VERT`\n- `Frame.MAXIMIZED_BOTH`\n\
  \n### java.awt.Toolkit 1.0\n\n- `static Toolkit getDefaultToolkit()`\n返回默认工具包。\n\
  - `Dimension getScreenSize()`\n获取用户屏幕的大小。\n\n### javax.swing.ImageIcon 1.2\n\n-\
  \ `ImageIcon(String filename)`\n构造一个图像存储在文件中的图标。\n- `Image getImage()`\n获取此图标的图像。\n\
  \n### 10.4 在组件中显示信息\n\n在本节中，我们将向你展示如何在帧内部显示信息。例如，我们不再像第 3 章中那样在控制台窗口以文本模式显示“Not\
