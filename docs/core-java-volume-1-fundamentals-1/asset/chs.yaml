  \ 个相同元素的不可变列表，或者是一个单例集合、列表或映射。\n\n* `static <E> List<E> emptyList()`\n* `static\
  \ <T> Set<T> emptySet()`\n* `static <E> SortedSet<E> emptySortedSet()`\n* `static\
