  \ titleString)`\n* `JToolBar(int orientation)`\n* `JToolBar(String titleString,\
  \ int orientation)` 根据给定的标题字符串和方向构造一个工具栏。`orientation` 是 `SwingConstants.HORIZONTAL`（默认值）或\
  \ `SwingConstants.VERTICAL` 之一。\n* `JButton add(Action a)` 根据给定的动作在工具栏内部构造一个具有名称、图标、短描述和动作回调的新按钮，并将该按钮添加到工具栏的末尾。\n\
  * `void addSeparator()` 在工具栏的末尾添加分隔符。\n\n### javax.swing.JComponent 1.2\n\n* `void\
  \ setToolTipText(String text)` 设置当鼠标悬停在组件上时应显示的工具提示文本。\n\n### 12.6 复杂的布局管理\n\n到目前为止，我们在示例应用程序的用户界面中仅使用了边界布局（border\
  \ layout）、流式布局（flow layout）和网格布局（grid layout）。对于更复杂的任务，这些是不够。在本节中，我们将详细讨论高级布局管理。\n\
  \nWindows 程序员可能会奇怪，为什么 Java 要对布局管理器大费周章。毕竟，在 Windows 中，布局管理并不是什么大事；你只需要使用对话框编辑器将组件拖放到对话框表面上，然后使用编辑器工具对齐组件、等间距排列、居中等。如果你在处理一个大型项目，你可能根本不需要担心组件布局——一个熟练的用户界面设计师会为你完成所有这一切。\n\
  \n这种方法的问题在于，如果组件的大小发生变化，则生成的布局必须手动更新。组件的大小为什么会变化呢？当应用程序中的字符串被翻译成外语时，就会发生这种情况。例如，“Cancel”的德语单词是“Abbrechen”。如果一个按钮的设计空间仅足够容纳“Cancel”这个字符串，那么德语版本看起来就会坏掉，字符串会被截断。\n\
  \n为什么按钮不能简单地扩展以适应标签呢？当你在对话框编辑器中拖放按钮时，并没有指示它们应该向哪个方向扩展。在拖放、放置和安排之后，对话框编辑器仅仅记录了每个组件的像素位置和大小。它并不记得*为什么*按这种方式安排组件。\n\
  \nJava 布局管理器是组件布局的一种好得方法。通过布局管理器，布局包含了关于组件之间关系的指令。这在使用了原生用户界面元素的原始 AWT 中尤为重要。在 Motif、Windows\
  \ 和 Macintosh 中，按钮或列表框的大小可能有很大差异，而应用程序或 Applet 也是如此。\n\n#### 12.6.1 网格袋布局 (Grid\
  \ Bag Layout)\n\n网格袋布局是所有布局之母。你可以将网格袋布局理解为没有限制的网格布局。在网格袋布局中，行和列可以具有可变的大小。你可以合并相邻单元格以为更大的组件留出空间。（许多文字处理器以及\
  \ HTML 也为表格提供了类似的功能：你可以从一个网格开始，然后根据需要合并相邻单元格。）组件不需要填充整个单元格，你可以指定它们在单元格内的对齐方式。\n\n\
  \n\n\n\n# 图 12.30 设计中使用的对话框网格\n\n要向网格管理器（grid bag manager）描述布局，请遵循以下步骤：\n\n1. 创建类型为\
  \ `GridBagLayout` 的对象。你不需要告诉它底层网格有多少行多少列。相反，布局管理器将尝试根据你之后提供的信息来推断。\n\n2. 将此 `GridBagLayout`\
  \ 对象设置为组件的布局管理器。\n\n3. 对于每个组件，创建一个类型为 `GridBagConstraints` 的对象。设置 `GridBagConstraints`\
  \ 对象的字段值，以指定组件在网格包中的布局方式。\n\n4. 最后，通过调用 `add(component, constraints);` 带有其约束条件添加每个组件。\n\
  \n以下是所需的代码示例。（我们将在接下来的章节中详细详细介绍各种约束——所以如果你不知道某些约束的作用，请担心。）\n\n点击此处查看代码图像\n\n```\n\
  GridBagLayout layout = new GridBagLayout();\npanel.setLayout(layout);\nGridBagConstraints\
  \ constraints = new GridBagConstraints();\nconstraints.weightx = 100;\nconstraints.weighty\
  \ = 100;\nconstraints.gridx = 0;\nconstraints.gridy = 2;\nconstraints.gridwidth\
  \ = 2;\nconstraints.gridheight = 1;\npanel.add(component, constraints);\n```\n\n\
  诀窍在于知道如何设置 `GridBagConstraints` 对象的状态。我们将在后面的章节中讨论该对象。\n\n## 12.6.1.1 gridx, gridy,\
  \ gridwidth 和 gridheight 参数\n\n`gridx`、`gridy`、`gridwidth` 和 `gridheight` 约束定义了组件在网格中的位置。`gridx`\
  \ 和 `gridy` 值指定了要添加组件左上角的列和行位置。`gridwidth` 和 `gridheight` 值决定了组件占据的列数和行数。\n\n网格坐标从\
  \ `0` 开始。特别是，`gridx = 0` 和 `gridy = 0` 表示左上角。我们示例中的文本区域具有 `gridx = 2`、`gridy = 0`，因为它从第\
  \ 0 行的第 2 列（即第三列）开始。它的 `gridwidth = 1` 且 `gridheight = 4`，因为它跨越了一列和四行。\n\n## 12.6.1.2\
  \ 权重字段\n\n你始终需要为网格布局中的每个区域设置 `weight` 字段（`weightx` 和 `weighty`）。如果你将权重设置为 `0`，则该区域在该方向上永远不会超出初始大小增长或缩小。在图\
  \ 12.29 的网格布局中，我们将标签的 `weightx` 字段设置为 `0`。这允许标签在调整窗口大保持保持宽度。另一方面，如果你将所有区域的权重设置为\
  \ `0`，容器将聚集在其分配区域的中心，而不是扩展填充它。\n\n从概念上讲，权重参数的问题在于权重是行和列的属性，而不是单个单元格。但你需要为单元格指定它们，因为网格布局没有暴露行和列。行和列权重是通过每行或每列中单元格权重的最大值计算得。因此，如果你想让某行或某列保持固定大小，需要将其中所有组件的权重设置为零。\n\
  \n注意，权重实际上并没有给出列的相对大小。它们告诉我们如果容器超过其首选尺寸，应该将多少比例的“剩余”空间分配给每个区域。这并不直观。我们建议你将所有权重设置为\
  \ `100`。然后运行程序并查看布局的外观。调整对话框以查看行和列如何调整。如果你发现某行或某列不应增长，则将其其中所有组件的权重设置为零。你可以尝试其他的权重值，但通常不值得费精力。\n\
  \n## 12.6.1.3 fill 和 anchor 参数\n\n如果你不想让组件拉伸并填充整个区域，请设置 `fill` 约束。该参数有四种可能：有效值为\
  \ `GridBagConstraints.NONE`、`GridBagConstraints.HORIZONTAL`、`GridBagConstraints.VERTICAL`\
  \ 和 `GridBagConstraints.BOTH`。\n\n如果组件没有填充整个区域，你可以通过设置 `anchor` 字段来指定它位于区域的哪个位置。有效值为\
  \ `GridBagConstraints.CENTER`（默认值）、`GridBagConstraints.NORTH`、`GridBagConstraints.NORTHEAST`、`GridBagConstraints.EAST`\
  \ 等。\n\n## 12.6.1.4 内边距 (Padding)\n\n你可以通过设置 `GridBagConstraints` 的 `insets` 字段在组件周围留出额外的空白。设置\
  \ `Insets` 对象的 `left`、`top`、`right` 和 `bottom` 值为你想要在组件周围的空间量。这被称为外部内边距。\n\n`ipadx`\
  \ 和 `ipady` 值设置内部内边距。这些值被加上组件的最小宽度和高度。这确保了组件不会缩小到最小尺寸。\n\n## 12.6.1.5 指定 gridx,\
  \ gridy, gridwidth 和 gridheight 参数的替代方法\n\nAWT 文档建议，与其将 `gridx` 和 `gridy` 值设置为绝对位置，不如将它们设置为常量\
  \ `GridBagConstraints.RELATIVE`。\n\n## 12.6.1.6 用于驯服网格约束的辅助类\n\n网格布局中最麻烦的部分是编写设置约束的代码。大多数程序员为此目的编写了辅助函数或小型辅助类。我们在字体对话框示例的完整代码之后介绍这样一个类。该类具有以下功能：\n\
  \n- 它的名字很短：`GBC` 而不是 `GridBagConstraints`。\n- 它继承自 `GridBagConstraints`，因此你可以使用较短的名称如\
  \ `GBC.EAST` 来表示常量。\n- 在添加组件时使用 `GBC` 对象，例如\n\n```\nadd(component, new GBC(1, 2));\n\
  ```\n\n- 有两个构造函数可以设置最常用的参数：`gridx` 和 `gridy`，或者 `gridx`、`gridy`、`gridwidth` 和 `gridheight`。\n\
  \n\n\n\n\n点击此处查看代码图像\n\n```java\nadd(component, new GBC(1, 2, 1, 4));\n```\n\n*\
  \   对于以 `x`/`y` 成对出现的字段提供了方便的 setter 方法：\n\n点击此处查看代码图像\n\n```java\nadd(component,\
  \ new GBC(1, 2).setWeight(100, 100));\n```\n\n*   setter 方法返回 `this`，因此你可以对其进行链式调用：\n\
  \n点击此处查看代码图像\n\n```java\nadd(component, new GBC(1, 2).setAnchor(GBC.EAST).setWeight(100,\
