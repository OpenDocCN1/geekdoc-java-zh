  \            }\n        }\n\n        try\n        {\n            // 打印类和公共方法的泛型信息\n\
  \            Class<?> cl = Class.forName(name);\n            printClass(cl);\n \
  \           for (Method m : cl.getDeclaredMethods())\n                printMethod(m);\n\
  \        }\n        catch (ClassNotFoundException e)\n        {\n            e.printStackTrace();\n\
  \        }\n    }\n\n    public static void printClass(Class<?> cl)\n    {\n   \
  \     System.out.print(cl);\n        printTypes(cl.getTypeParameters(), \"<\", \"\
  , \"> true);\n        Type sc = cl.getSuperclass();\n        if (sc != null)\n \
  \       {\n            System.out.print(\" extends \");\n            printType(sc,\
  \ false);\n        }\n        printTypes(cl.getGenericInterfaces(), \" implements\
  \ \", \", \"\", false);\n        System.out.println();\n    }\n\n    public static\
  \ void printMethod(Method m)\n    {\n        String name = m.getName();\n      \
  \  System.out.print(Modifier.toString(m.getModifiers()));\n        System.out.print(\"\
  \ \");\n        printTypes(m.getTypeParameters(), \"<\", \", \"> \", true);\n\n\
  \        printType(m.getGenericReturnType(), false);\n        System.out.print(\"\
  \ \");\n        System.out.print(name);\n        System.out.print(\"(\");\n    \
  \    printTypes(m.getGenericParameterTypes(), \"\", \", \"\", false);\n        System.out.println(\"\
  )\");\n    }\n\n    public static void printTypes(Type[] types, String pre, String\
  \ sep, String suf, boolean isDefinition)\n    {\n        if (pre.equals(\" extends\
  \ \") && Arrays.equals(types, new Type[] { Object.class })) return;\n        if\
  \ (types.length > 0) System.out.print(pre);\n        for (int i = 0; i < types.length;\
  \ i++)\n        {\n            if (i > 0) System.out.print(sep);\n            printType(types[i],\
  \ isDefinition);\n        }\n        if (types.length > 0) System.out.print(suf);\n\
  \    }\n\n    public static void printType(Type type, boolean isDefinition)\n  \
  \  {\n        if (type instanceof Class)\n        {\n            Class<?> t = (Class<?>)\
  \ type;\n            System.out.print(t.getName());\n        }\n        else if\
  \ (type instanceof TypeVariable)\n        {\n            TypeVariable<?> t = (TypeVariable<?>)\
  \ type;\n            System.out.print(t.getName());\n            if (isDefinition)\n\
  \                printTypes(t.getBounds(), \" extends \", \" & \", false);\n   \
  \     }\n        else if (type instanceof WildcardType)\n        {\n           \
  \ WildcardType t = (WildcardType) type;\n            System.out.print(\"?\");\n\
  \            printTypes(t.getUpperBounds(), \" extends \", \" & \", false);\n  \
  \          printTypes(t.getLowerBounds(), \" super \", \" & \", false);\n      \
  \  }\n        else if (type instanceof ParameterizedType)\n        {\n         \
  \   ParameterizedType t = (ParameterizedType) type;\n            Type owner = t.getOwnerType();\n\
  \            if (owner != null)\n            {\n                printType(owner,\
  \ false);\n                System.out.print(\".\");\n            }\n           \
  \ printType(t.getRawType(), false);\n            printTypes(t.getActualTypeArguments(),\
  \ \"<\", \", \">\", false);\n        }\n         else if (type instanceof GenericArrayType)\n\
  \        {\n            GenericArrayType t = (GenericArrayType) type;\n        \
  \    System.out.print(\"\");\n            printType(t.getGenericComponentType(),\
  \ isDefinition);\n            System.out.print(\"[]\");\n        }\n    }\n}\n```\n\
  \n\n\n\n\n获取此类型变量的子类（`extends`）边界，如果变量没有子类边界，则返回一个长度为 `0` 的数组。\n\n- `Type[] getLowerBounds()`\n\
  \n获取此类型变量的父类（`super`）边界，如果变量没有父类边界，则返回一个长度为 `0` 的数组。\n\n***\n\n`java.lang.reflect.ParameterizedType`\
  \ **5.0**\n\n- `Type getRawType()`\n获取此泛化类型的原始类型。\n- `Type[] getActualTypeArguments()`\n\
  获取声明此泛化类型时使用的类型参数。\n- `Type getOwnerType()`\n如果是内部类型，则获取其外部类类型；如果这是一个顶级类型，则返回 `null`。\n\
  \n***\n\n`java.lang.reflect.GenericArrayType` **5.0**\n\n- `Type getGenericComponentType()`\n\
  获取声明此数组类型时使用的泛型组件类型。\n\n***\n\n现在你已经知道如何使用泛型类，以及在需要时如何编写自己的泛型类和方法。同样重要的是，你还知道如何解读在\
  \ API 文档和错误信息中可能遇到的泛型类型声明。关于 Java 泛型的所有详尽讨论，请参阅 Angelika Langer 编写的优秀常见（及不常见）问题列表：[`http://angelikalanger.com/GenericsFAQ/JavaGenericsFAQ.html`](http://angelikalanger.com/GenericsFAQ/JavaGenericsFAQ.html)。\n\
  \n在下一章中，你将看到 Java 集合框架如何使用泛型。\n\n# 第 9 章 集合\n\n***\n\n## 本章内容\n\n- 9.1 Java 集合框架\n\
  - 9.2 具体集合\n- 9.3 映射\n- 9.4 视图与包装器\n- 9.5 算法\n- 9.6 遗留集合\n\n***\n\n当你尝试以自然风格实现方法或关注性能时，你所选择的数据结构可能会产生巨大差异。你需要对数千个（甚至数百万个）排序项进行快速搜索吗？你需要在有序序列的中间快速插入和删除元素吗？你需要在键和值之间建立关联吗？\n\
  \n本章将展示 Java 库如何帮助你完成正式编程所需的传统数据结构。在大学的计算机科学课程中，一门名为*数据结构*的课程通常需要一个学期才能完成，而且有很多书籍致力于这个重要主题。我们的涵盖范围与大学课程不同；我们将跳过理论，直接向你展示如何使用标准库中的集合类。\n\
  \n## 9.1 Java 集合框架\n\nJava 的最初版本仅为最实用的数据结构提供了一小部分类：`Vector`、`Stack`、`Hashtable`、`BitSet`\
  \ 以及 `Enumeration` 接口（后者提供了一种访问任意容器中元素的抽象机制）。这无疑是一个明智的选择——开发一个全面的集合类库需要时间和精。。\n\n\
  随着 Java SE 1.2 的出现，设计者认为是时候推出一套完整的数据结构了。他们面临着许多相互冲突的设计挑战。他们希望库既小又易于学习。他们不想要 C++\
  \ 标准模板库（或 STL）的复杂性，但他们想要 STL 开创的“泛型算法”带来的益处。他们希望遗留类能适应新的框架。正如所有集合库的设计者一样，他们必须做出一些艰难的抉，并在过程中产生了一些独特的设计决策。在本节中，我们将探索\
  \ Java 集合框架的基本设计，向你展示如何使用它，并解释一些较有争议的功能背后的原理。\n\n### 9.1.1 分离集合接口与实现\n\n与现代数据结构库很一样，Java\
  \ 集合库将*接口*和*实现*分离。让我们通过一个熟悉的数据结构——*队列*（queue）来看这种分离。\n\n*队列接口*规定你可以在队列的末尾添加元素，从头部删除元素，并查找队列中有多少元素。当你需要收集对象并按“先进先出”的方式检索它们时，可以使用队列（参见图\
  \ 9.1）。\n\n![Image](img/09fig01.jpg)\n\n**图 9.1** 队列\n\n队列接口的最小形式可能如下所示：\n\n点击此处查看代码图像\n\
  \n```java\npublic interface Queue<E> // 标准库中接口的简化的形式\n\n{\n   void add(E element);\n\
  \   E remove();\n   int size();\n}\n```\n\n接口没有告诉你任何关于队列是如何实现的信息。在队列的两种常见实现中，一种使用“循环数组”，另一种使用链表（参见图\
  \ 9.2）。\n\n![Image](img/09fig02.jpg)\n\n**图 9.2** 队列实现 \n\n每个实现都可以由实现 `Queue` 接口的类来表示。\n\
  \n点击此处查看代码图像\n\n```java\npublic class ArrayQueue<E> implements Queue<E> // 不是实际的类\n\
  \n{\n   private int head;\n   private int tail;\n   ArrayQueue(int capacity) { ...\
  \ }\n   public void add(E element) { ... }\n   public E remove() { ... }\n   public\
  \ int size() { ... }\n   private E[] elements;\n}\n```\n\n```java\npublic class\
  \ LinkedListQueue<E> implements Queue<E> // 不是实际的类\n\n{\n   private Link head;\n\
  \   private Link tail;\n   LinkedListQueue() { ... }\n   public void add(E element)\
  \ { ... }\n   public E remove() { ... }\n   public int size() { ... }\n}\n```\n\n\
  ***\n\n![Image](img/note.jpg) 注意\n\nJava 库中实际上并没有名为 `ArrayQueue` 和 `LinkedListQueue`\
  \ 的类。我们使用这些类作为示例，来解释集合接口与实现之间概念上的区别。如果你需要一个循环数组队列，请使用 `ArrayDeque` 类。对于链表队列，直接使用\
  \ `LinkedList` 类即可——它实现了 `Queue` 接口。\n\n***\n\n当你在程序中使用队列时，一旦集合构造完成，你就不需要知道实际使用的是哪种实现。因此，在构造集合时*仅*使用具体类是有合逻辑的。而请使用*接口类型*来持有集合引用。\n\
  \n点击此处查看代码图像\n\n```java\nQueue<Customer> expressLane = new ArrayQueue<>(100);\n\
  expressLane.add(new Customer(\"Harry\"));\n```\n\n通过这种方法，如果你改变了主意，可以轻松地使用不同的实现。你只需要在程序中的一处进行更改——在构造函数调用处。如果你最终发现\
  \ `LinkedListQueue` 是更好的选择，你的代码将变为\n\n点击此处查看代码图像\n\n```java\nQueue<Customer> expressLane\
  \ = new LinkedList<>();\nexpressLane.add(new Customer(\"Harry\"));\n```\n\n为什么选择一种实现而不是另一种？接口对实现的效率一无未字。循环数组比链表稍微高效一些，因此通常是首选的。然而，像往常一样，这是代价的。\n\
  \n循环数组是一个*有界*集合——它有有限的容量。如果你对程序收集的对象数量没有上限限制，那么可能使用链表实现更好。\n\n当你研究 API 文档时，你会发现另一组以\
  \ `Abstract` 开头的类，例如 `AbstractQueue`。这些类是为库的实现者设计的。在（可能不太可能的）事件你想要实现自己的队列类时，扩展 `AbstractQueue`\
  \ 会比实现 `Queue` 接口的所有方法要容易得多。\n\n\n\n\n\n### 9.1.2 集合接口\n\nJava 库中集合类的基础接口是 `Collection`\
  \ 接口。该接口有两个基本方法：\n\n点击此处查看代码图像\n\n```java\npublic interface Collection<E>\n{\n \
  \  boolean add(E element);\n   Iterator<E> iterator();\n   ...\n}\n```\n\n除了这两个方法外，还有其他方法；我们将在稍后讨论它们。\n\
  \n`add` 方法向集合中添加一个元素。如果添加元素确实更改了集合，`add` 方法返回 `true`；如果集合没有变化，则返回 `false`。例如，如果你尝试向一个集合（set）中添加一个对象而该对象已经存在，则\
  \ `add` 请求将不起作用，因为集合会拒绝重复项。\n\n`iterator` 方法返回一个实现 `Iterator` 接口的对象。你可以使用该迭代对象逐个访问集合中的元素。我们将在下一节讨论迭代器。\n\
  \n### 9.1.3 迭代器\n\n`Iterator` 接口有四个方法：\n\n点击此处查看代码图像\n\n```java\npublic interface\
  \ Iterator<E>\n{\n   E next();\n   boolean hasNext();\n   void remove();\n   default\
  \ void forEachRemaining(Consumer<? super E> action);\n}\n```\n\n通过反复调用 `next` 方法，你可以逐个访问集合中的元素。然而，如果你到达集合的末尾，`next`\
  \ 方法将抛出 `NoSuchElementException`。因此，在调用 `next` 之前你需要调用 `hasNext` 方法。如果迭代器对象还有更多元素待访问，该方法将返回\
  \ `true`。如果你想检查集合中的所有元素，可以请求一个迭代器，然后在 `hasNext` 返回 `true` 期间持续调用 `next` 方法。例如：\n\
  \n点击此处查看代码图像\n\n```java\nCollection<String> c = ...;\nIterator<String> iter = c.iterator();\n\
  while (iter.hasNext())\n{\n   String element = iter.next();\n   // 对 element 执行某些操作\n\
  }\n```\n\n你可以用更简洁的“for each”循环来编写这样的循环：\n\n```java\nfor (String element : c)\n{\n\
  \   // 对 element 执行某些操作\n}\n```\n\n编译器简单地将“for each”循环翻译为带有迭代器的循环。\n\n“for each”循环适用于任何实现\
  \ `Iterable` 接口的对象，该接口仅有一个抽象方法：\n\n```java\npublic interface Iterable<E>\n{\n  \
  \ Iterator<E> iterator();\n   ...\n}\n```\n\n`Collection` 接口继承了 `Iterable` 接口。因此，你可以对标准库中的任何集合使用“for\
  \ each”循环。\n\n从 Java SE 8 开始，你甚至不需要编写循环。你可以带有一个消耗元素的 Lambda 表达式调用 `forEachRemaining`\
  \ 方法。该 Lambda 表达式会在迭代器的每个元素上被调用，直到没有剩余元素。\n\n点击此处查看代码图像\n\n```java\niterator.forEachRemaining(element\
  \ -> // 对 element 执行某些操作);\n```\n\n访问元素的顺序取决于集合的类型。如果你遍历一个 `ArrayList`，迭代器从索引 `0`\
  \ 开始，并在每一步中增加索引。然而，如果你访问 `HashSet` 中的元素，你将以本质上随机的顺序获取它们。你可以确保在迭代过程中遇到集合的所有元素，但你无法对它们的顺序做任何假设。这通常对于计算总和或计数匹配等计算来说不是一个问题，因为顺序并不重要。\n\
  \n***\n\n![图像](img/note.jpg) 备注\n\n老手会注意到，`Iterator` 接口的 `next` 和 `hasNext` 方法的作用与\
  \ `Enumeration` 接口的 `nextElement` 和 `hasMoreElements` 方法相同。Java 集合库的设计者本可以选择使用 `Enumeration`\
  \ 接口，但他们不喜欢冗长的方法名，而是引入了一个具有更短方法名的新接口。\n\n***\n\nJava 集合库中的迭代器与其他库中的迭代器之间存在着重要的概念区别。在传统的集合库中（如\
  \ C++ 的标准模板库 STL），迭代器是模仿数组索引建模的。给定这样一个迭代器，你可以查找存储在相应位置的元素，就像如果你有数组索引 `i`，可以查找数组元素\
  \ `a[i]` 一样。查找完成后，你可以将迭代器移动到下一个位置。这与通过调用 `i++` 推进数组索引的操作相同，且不执行查找。然而，Java 迭代器并不是那样工作的。查找和位置变化是紧密耦合的。查找元素的方法是调用\
  \ `next`，而这种查找会推进位置。\n\n相反，将 Java 迭代器想象为处于*元素之间*。当你调用 `next` 时，迭代器会*跳过*下一个元素，并返回它刚刚通过的元素的引用（参见图\
  \ 9.3）。\n\n![图像](img/09fig03.jpg)\n\n**图 9.3** 推进迭代器\n\n***\n\n![图像](img/note.jpg)\
  \ 备注\n\n这是另一个类比。你可以认为 `Iterator.next` 等同于 `InputStream.read`。从流中读取字节会自动“消耗”该字节。下一次调用\
  \ `read` 会消耗该字节。同样，反复调用 `next` 可以让你读取集合中的所有元素。\n\n***\n\n`Iterator` 的 `remove` 方法移除上一次调用\
  \ `next` 返回的元素。在很多情况下这是合理的——你需要在决定应该删除该元素之前先看到它。但如果你想移除特定位置的元素，你仍然需要跳过 `next`。例如，这里是如何从以下集合中移除第一个元素的：\n\
  \n点击此处查看代码图像\n\n```java\nIterator<String> it = c.iterator();\nit.next(); // 跳过第一个元素\n\
  it.remove(); // 现在移除它\n```\n\n更重要的是，`next` 和 `remove` 的调用之间存在依赖关系。如果在没有先调用 `next`\
  \ 的情况下调用 `remove` 是非法的。如果你尝试这样做，将抛出 `IllegalStateException`。\n\n如果你想移除两个相邻的元素，你不能简单地调用\n\
  \n```java\nit.remove();\nit.remove(); // 错误！\n```\n\n相反，你必须先调用 `next` 跳过要移除的元素。\n\
  \n```java\nit.remove();\nit.next();\nit.remove(); // OK\n```\n\n### 9.1.4 泛型工具方法\n\
  \n`Collection` 和 `Iterator` 接口是泛型的，这意味着你可以编写任意集合的工具方法。例如，这里有一个测试集合是否包含给定元素的泛型方法：\n\
  \n点击此处查看代码图像\n\n```java\npublic static <E> boolean contains(Collection<E> c, Object\
  \ obj)\n{\n   for (E element : c)\n      if (element.equals(obj))\n         return\
  \ true;\n   return false;\n}\n```\n\nJava 库的设计者认为某些工具方法非常有用，以至于由库来提供。这样库用户就不需要不断重复造轮子。`contains`\
  \ 方法就是其中一种方法。\n\n事实上，`Collection` 接口声明了许多实现类必须提供的有用方法。其中包括\n\n点击此处查看代码图像\n\n```java\n\
  int size();\nboolean isEmpty();\nboolean contains(Object obj);\nboolean containsAll(Collection<?>\
  \ c);\nboolean equals(Object other);\nboolean addAll(Collection<? extends E> from);\n\
  boolean remove(Object obj);\nboolean removeAll(Collection<?> c);\nvoid clear();\n\
  boolean retainAll(Collection<?> c);\nObject[] toArray();\n<T> T[] toArray(T[] arrayToFill);\n\
  ```\n\n许多方法都是自而易见的；你可以在节末尾的 API 注释中找到完整的文档。\n\n\n\n\n当然，如果每个实现 `Collection` 接口的类都必须提供许多常规方法，那将很麻烦。为了方便实现者的工作，库提供了一个\
  \ `AbstractCollection` 类，它将基础方法 `size` 和 `iterator` 留为抽象，但根据这两个方法实现了这些常规方法。例如：\n\
  \n点击此处查看代码图像\n\n```java\npublic abstract class AbstractCollection<E>\n   implements\
  \ Collection<E>\n{\n   ...\n   public abstract Iterator<E> iterator();\n   public\
  \ boolean contains(Object obj)\n   {\n      for (E element : this) // calls iterator()\n\
  \          if (element.equals(obj))\n              return true;\n      return false;\n\
  \   }\n   ...\n}\n```\n\n具体的集合类现在可以扩展 `AbstractCollection` 类。具体的集合类需要提供一个 `iterator`\
  \ 方法，但 `contains` 方法已经由父类 `AbstractCollection` 处理好了。不过，如果子类有更高效的 `contains` 实现方式，也可以自由地这样做。\n\
  \n在 Java SE 8 中，这种方法有点过时。如果这些方法是 `Collection` 接口的默认方法会更好。但事实并非如此。不过，添加了几个默认方法，其中大多数处理流（我们将在第二卷中讨论）。此外，还有一个非常有用的方法：\n\
  \n点击此处查看代码图像\n\n```java\ndefault boolean removeIf(Predicate<? super E> filter)\n\
  ```\n\n用于删除符合条件的元素。\n\n***\n\njava.util.Collection<E> **1.2**\n\n* `Iterator<E>\
  \ iterator()` 返回一个可以用于访问集合中元素的迭代器。\n* `int size()` 返回当前存储在集合中的元素数量。\n* `boolean\
  \ isEmpty()` 如果此集合不包含任何元素，则返回 `true`。\n* `boolean contains(Object obj)` 如果此集合包含与\
  \ `obj` 相等的，则返回 `true`。\n* `boolean containsAll(Collection<?> other)` 如果此集合包含另一个集合中的所有元素，则返回\
  \ `true`。\n* `boolean add(Object element)` 向集合中添加一个元素。如果集合因为此调用而发生变化，则返回 `true`。\n\
  * `boolean addAll(Collection<? extends E> other)` 将另一个集合中的所有元素添加到此集合中。如果集合因为此调用而发生变化，则返回\
  \ `true`。\n* `boolean remove(Object obj)` 从集合中移除与 `obj` 相等的对象。如果删除了匹配的对象，则返回 `true`。\n\
  * `boolean removeAll(Collection<?> other)` 从此集合中移除另一个集合中的所有元素。如果集合因为此调用而发生变化，则返回\
  \ `true`。\n* `default boolean removeIf(Predicate<? super E> filter)` **8** 移除所有\
  \ `filter` 返回 `true` 的元素。如果集合因为此调用而发生变化，则返回 `true`。\n* `void clear()` 移除集合中的所有元素。\n\
  * `boolean retainAll(Collection<?> other)` 从此集合中不等于另一个集合中任一元素的元素。如果集合因为此调用而发生变化，则返回\
  \ `true`。\n* `Object[] toArray()` 返回集合中对象的数组。\n* `<T> T[] toArray(T[] arrayToFill)`\
  \ 返回集合中对象的数组。如果 `arrayToFill` 长度足够，则用此集合的元素填充它。如果有空间，则追加一个 `null` 元素。否则，将分配一个与 `arrayToFill`\
  \ 相同组件类型且长度与此集合大小相同的新数组并填充。\n\n***\n\njava.util.Iterator<E> **1.2**\n\n* `boolean\
  \ hasNext()` 如果还有另一个元素可以访问，则返回 `true`。\n* `E next()` 返回下一个要访问的对象。如果到达集合末尾，则抛出 `NoSuchElementException`。\n\
  * `void remove()` 移除最后访问的对象。此方法必须紧随元素访问之后调用。如果自上次元素访问以来集合被修改过，此方法将抛出 `IllegalStateException`。\n\
  \n***\n\n### 9.1.5 集合框架中的接口\n\nJava 集合框架为不同类型的集合定义了许多接口，如图 9.4 所示](#ch09.html_ch09fig04)。\n\
  \n![Image](img/09fig04.jpg)\n\n**图 9.4** 集合框架的接口\n\n集合有两个基础接口：`Collection` 和 `Map`。正如你所看到的，你通过方法向集合中插入元素：\n\
  \n```java\nboolean add(E element)\n```\n\n然而，map 存储的是键值对，你使用 `put` 方法插入它们：\n\n```java\n\
  V put(K key, V value)\n```\n\n要从集合中读取元素，可以使用迭代器访问。不过，你可以使用 `get` 方法从 map 中读取值：\n\
  \n```java\nV get(K key)\n```\n\n`List` 是*随机访问*的，因为元素可以通过两种方式访问：通过迭代器或通过整数索引。相比之下，使用迭代器时必须顺序访问。`List`\
  \ 接口定义了几个用于随机访问的方法：\n\n点击此处查看代码图像\n\n```java\nvoid add(int index, E element)\nvoid\
  \ remove(int index)\nE get(int index)\nE set(int index, E element)\n```\n\n`ListIterator`\
  \ 接口是 `Iterator` 的子接口。它定义了一个在迭代器位置之前添加元素的方法：\n\n```java\nvoid add(E element)\n```\n\
  \n坦率，集合框架的这方面设计得并不好。在实践中，有两种有序集合，具有非常不同的性能权衡。由数组支持的有序集合具有快速随机访问，使用带整数索引的 `List`\
  \ 方法是有意义的。相反，链表虽然也是有序的，但随机访问很慢，最好用迭代器进行遍历。\n\n***\n\n![Image](img/note.jpg) 注意\n\
  \n为了避免对链表执行随机访问操作，Java SE 1.4 引入了一个标记接口 `RandomAccess`。该接口没有方法，但你可以用它测试特定集合是否支持随机访问：\n\
  \n点击此处查看代码图像\n\n```java\nif (c instanceof RandomAccess)\n{\n   use random access\
  \ algorithm\n}\nelse\n{\n   use sequential access algorithm\n}\n```\n\n***\n\n`Set`\
  \ 接口与 `Collection` 接口相同，但方法的行为定义更严格。集合的 `add` 方法应该拒绝重复。集合的 `equals` 方法应该定义为使得两个集合具有相同的元素，但不一定具有相同的顺序`hashCode`\
  \ 方法应该定义为使得两个具有相同元素的集合产生相同的哈希码。\n\n如果方法签名相同，为什么要单独定义一个接口呢？从概念上讲，并不是所有集合都是集合。创建一个\
  \ `Set` 接口允许程序员编写只接受集合的方法。\n\n`SortedSet` 和 `SortedMap` 接口暴露了用于排序的比较器对象，并定义了获取集合子视图的方法。我们将在第\
  \ 509 页的第 9.4 节“视图与包装器”中讨论这些。\n\n最后，Java SE 6 引入了 `NavigableSet` 和 `NavigableMap`\
  \ 接口，包含了用于在排序集合和 map 中进行搜索和遍历的额外方法。（理想情况下，这些方法应该直接包含在 `SortedSet` 和 `SortedMap`\
  \ 接口中。）`TreeSet` 和 `TreeMap` 类实现了这些接口。\n\n\n\n表 9.1 展示了 Java 库中的集合，并简要描述了每个集合类的作用。（为了简单起见，我们省略了将在第\
  \ 14 章中讨论的线程安全集合。）表 9.1 中的所有类都实现了 `Collection` 接口，以 `Map` 结尾的类除外。这些类实现了 `Map` 接口。我们将在第\
  \ 497 页的第 9.3 节“Maps”中讨论 map。\n\n![Image](img/09tab01.jpg)\n\n**表 9.1** Java 库中的具体集合\n\
  \n图 9.5 展示了这些类之间的关系。\n\n![Image](img/09fig05.jpg)\n\n**图 9.5** 集合框架中的类\n\n## 9.2.1\
  \ 链表\n\n在书中我们已经使用了数组和它们的动态表兄弟 `ArrayList` 类作为许多示例。然而，数组和数组列表有一个主要的缺点。从数组中间删除元素是非常昂贵的的，因为被删除元素之后的所有数组元素都必须向数组的开头移动（参见图\
  \ 9.6）。在中间插入元素也是如此。\n\n![Image](img/09fig06.jpg)\n\n**图 9.6** 从数组中删除元素\n\n另一个著名的数据结构——*链表*（linked\
  \ list）解决了这个问题。数组在连续的内存位置上存储对象引用，而链表将每个对象存储在单独的*节点*（link）中。每个节点还存储了指向指向序列中下一个节点的引用。在\
  \ Java 编程语言中，所有的链表实际上都是*双向链表*；也就是说，每个节点还存储了指向其前驱节点的引用（参见图 9.7）。\n\n![Image](img/09fig07.jpg)\n\
  \n**图 9.7** 双向链表\n\n从链表的中间删除元素是一个廉价的操作——只需要更新被删除元素周围的节点即可（参见图 9.8）。\n\n![Image](img/09fig08.jpg)\n\
  \n**图 9.8** 从链表删除删除元素\n\n也许你曾经上过数据结构课程，在课程中你学习了如何实现链表。你可能对在链表中删除或添加元素时纠结于节点关系留有糟糕的回忆。如果是这样，你会惊喜地发现，Java\
  \ 集合库提供了一个可供你使用的 `LinkedList` 类。\n\n下面的代码示例添加了三个元素，然后删除了第二个：\n\n点击此处查看代码图像\n\n```\n\
  List<String> staff = new LinkedList<>(); // LinkedList implements List\n\nstaff.add(\"\
  Amy\");\n\nstaff.add(\"Bob\");\n\nstaff.add(\"Carl\");\n\nIterator iter = staff.iterator();\n\
  \nString first = iter.next(); // visit first element\n\nString second = iter.next();\
  \ // visit second element\n\niter.remove(); // remove last visited element\n```\n\
  \n然而，链表和通用集合之间存在着重要的区别。链表是一个*有序集合*，其中对象的顺序非常重要。`LinkedList.add` 方法将对象添加到列表的末尾。但你通常想在列表的中间某个添加对象。这种依赖位置的\
  \ `add` 方法是迭代器（iterator）的职责，因为迭代器描述了集合中的位置。使用迭代器添加元素仅对于具有自然顺序的集合是有意义的。例如，我们在下一节中讨论的*集合*（set）数据类型没有对它的元素施加任何排序。因此，`Iterator`\
  \ 接口中没有 `add` 方法。相反，集合库提供了一个包含 `add` 方法的子接口 `ListIterator`：\n\n点击此处查看代码图像\n\n```\n\
  interface ListIterator<E> extends Iterator<E>\n{\n   void add(E element);\n   .\
  \ . .\n}\n```\n\n与 `Collection.add` 不同，此方法不返回 `boolean` 布尔值——假设 `add` 操作总是会修改列表。\n\
  \n此外，`ListIterator` 接口有两个方法可以让你用于反向遍历列表。\n\n```\nE previous()\n\nboolean hasPrevious()\n\
  ```\n\n与 `next` 方法一样，`previous` 方法返回它跳过的对象。\n\n`LinkedList` 类的 `listIterator` 方法返回一个实现\
  \ `ListIterator` 接口的迭代器对象。\n\n点击此处查看代码图像\n\n```\nListIterator<String> iter = staff.listIterator();\n\
  ```\n\n`add` 方法在迭代器位置*之前*添加新元素。例如，以下代码跳过了链表的第一个元素，并在第二个元素之前添加 `\"Juliet\"`（参见图 9.9）：\n\
  \n点击此处查看代码图像\n\n```\nList<String> staff = new LinkedList<>(); // LinkedList implements\
  \ List\n\nstaff.add(\"Amy\");\n\nstaff.add(\"Bob\");\n\nstaff.add(\"Carl\");\n\n\
  Iterator iter = staff.iterator();\n\nString first = iter.next(); // visit first\
  \ element\n\nString second = iter.next(); // visit second element\n\niter.remove();\
  \ // remove last visited element\n```\n\n\n\n\n为了避免并发修改异常（Concurrent modification\
  \ exceptions），请遵循这一简单规则：你可以为集合附加任意数量的迭代器，只要它们都是只读不写的。或者，你也可以附加一个既能读又能写的单一迭代器。\n\n\
  并发修改的检测是通过一种非常简单的方式实现的。集合会跟踪变异操作（如添加和删除元素）的数量。每个迭代器都会单独记录由*它*负责的变异操作计数。在每个迭代器方法的开头，迭代器只需检查其自身的变异计数是否与集合的计数相等。如果不相等，它将抛出一个\
  \ `ConcurrentModificationException`。\n\n![Image](img/note.jpg) 注意\n\n然而，在并发修改的检测上存在一个奇怪的例外。链表只跟踪列表的*结构性*修改，例如添加和删除链接。`set`\
  \ 方法*不被视为*一种结构性修改。你可以为链表附加多个迭代器，这些迭代器都可以调用 `set` 来更改现有链接的属性。这种能力对于我们在本章节稍后讨论的 `Collections`\
  \ 类中的许多算法是所必需的。\n\n## LinkedList 类\n\n现在你已经看到了 `LinkedList` 类的基本方法。使用 `ListIterator`\
  \ 可以在两个方向上遍历链表的元素，并添加和删除元素。\n\n正如你在上一节中看到的，许多其他操作链表的有用方法已在 `Collection` 接口中声明。这些方法在大部分都在\
  \ `LinkedList` 类的父类 `AbstractCollection` 中实现。例如，`toString` 方法会调用所有元素的 `toString`\
  \ 方法，并生成一个格式为 `[A, B, C]` 的长字符串。这对于调试非常有用。使用 `contains` 方法检查元素是否存在于链表中。例如，如果链表已经包含一个与字符串\
  \ `\"Harry\"` 相等的字符串，调用 `staff.contains(\"Harry\")` 将返回 `true`。\n\n该库还提供了一些从理论角度来看有些“令人存疑”的方法。链表不支持快速的随机访问。如果你想查看链表的第\
  \ *n* 个元素，你必须从开始处并跳过前 *n* – 1 个元素。没有捷径。出于这个原因，程序员通常不会在需要通过整数索引访问元素的情况下使用链表。\n\n\
  尽管如此，`LinkedList` 类提供了一个 `get` 方法，允许你访问特定的元素：\n\n```java\nLinkedList<String> list\
  \ = ...;\nString obj = list.get(n);\n```\n\n当然，这个方法的效率并不高。如果你发现自己在使用它，你可能为你的问题使用了错误的数据结构。\n\
  \n你*永远不要*使用这种幻表的随机访问方法来遍历链表。这段代码\n\n```java\nfor (int i = 0; i < list.size(); i++)\n\
  \    do something with list.get(i);\n```\n\n其效率低得惊人。每当你查找另一个元素时，搜索都会从列表开始重新开始。`LinkedList`\
  \ 对象没有尝试缓存位置信息。\n\n![Image](img/note.jpg) 注意\n\n`get` 方法有一个微小的优化：如果索引至少为 `size()\
  \ / 2`，则对元素的搜索将从列表末尾开始。\n\n列表迭代器接口还有一个方法可以告诉你当前位置的索引。事实上，由于 Java 迭代器在概念上指向元素元素之间，因此它有两个索引方法：`nextIndex`\
  \ 方法返回下一次调用 `next` 将返回的元素的整数索引；`previousIndex` 方法返回下一次调用 `previous` 将返回的元素的索引。当然，它仅仅比\
  \ `nextIndex` 小 1。这些方法是非常高效的——迭代器维护着当前位置的计数。最后，如果你有一个整数索引 `n`，那么 `list.listIterator(n)`\
  \ 返回一个指向索引为 `n` 的元素之前的迭代器。也就是说，调用 `next` 产生的元素与 `list.get(n);` 相同，而获取该迭代器的效率很低。\n\
  \n如果你有一个只有少数元素的链表，你就不必过度担心 `get` 和 `set` 方法的成本。但既然如此，最初为什么要使用链表呢？使用链表的唯一理由是为了降低列表中间插入和删除的成本。如果你只有几个元素，可以直接使用\
  \ `ArrayList`。\n\n我们建议你直接避开所有使用整数索引表示链表位置的方法。如果你想对集合进行随机访问，请使用数组或 `ArrayList`，而不是链表。\n\
  \nListing 9.1 中的程序让链表发挥了用处。它简单地创建了两个列表并将它们合并，然后从第二个列表中删除每个第二个元素，最后测试 `removeAll`\
  \ 方法。我们建议你跟踪程序流并特别注意迭代器。你可能会发现绘制迭代器位置的图会有帮助，像这样：\n\n| ACE |BDFG |\n| A|CE |BDFG\
  \ |\n| AB|CE B|DFG |\n\n注意，调用\n\n```java\nSystem.out.println(a);\n```\n通过调用 `AbstractCollection`\
  \ 中的 `toString` 方法打印链表 `a` 中的所有元素。\n\n### 列表 9.1 linkedList/LinkedListTest.java\n\
  \n```java\npackage linked;\n\nimport java.util.*;\n\n/**\n * 此程序演示了链表上的操作。\n * @version\
  \ 1.1 2012-01-26\n * @author Cay Horst\n */\npublic class LinkedList\n{\n    public\
  \ static void main(String[] args)\n    {\n        List<String> a = new LinkedList<>();\n\
  \        a.add(\"Amy\");\n        a.add(\"Carl\");\n        a.add(\"Erica\");\n\n\
  \        List<String> b = new LinkedList<>();\n        b.add(\"Bob\");\n       \
  \ b.add(\"Doug\");\n        b.add(\"Frances\");\n        b.add(\"Gloria\");\n\n\
  \        // 将 b 中的单词合并到 a\n        ListIterator<String> aIter = a.listIterator();\n\
  \        Iterator<String> bIter = b.iterator();\n\n        while (bIter.hasNext())\n\
  \        {\n            if (aIter.hasNext()) aIter.next();\n            aIter.add(bIter.next());\n\
  \        }\n\n        System.out.println(a);\n\n        // 从 b 中删除每个第二个单词\n    \
  \    bIter = b.iterator();\n        while (bIter.hasNext())\n        {\n       \
  \     bIter.next(); // 跳过一个元素\n            if (bIter.hasNext())\n            {\n\
  \                bIter.next(); // 跳过下一个元素\n                bIter.remove(); // 删除元素\n\
  \            }\n        }\n\n        System.out.println(b);\n\n        // 批量操作：从\
  \ a 中移除 b 的所有单词\n        a.removeAll(b);\n\n        System.out.println(a);\n   \
  \ }\n}\n```\n\n\n\n\n返回与指定元素相第一个出现的位置；如果没有找到匹配的元素，则返回 `-1`。\n\n- `int lastIndexOf(Object\
  \ element)`\n\n返回与指定元素相最后一次出现的位置；如果没有找到匹配的元素，则返回 `-1`。\n\n### java.util.ListIterator<E>\
  \ 1.2\n\n- `void add(E newElement)`\n在当前位置之前添加一个元素。\n- `void set(E newElement)`\n\
  用新元素替换由 `next` 或 `previous` 最近访问的元素。如果自上次调用 `next` 或 `previous` 之后列表结构被修改过，则抛出 `IllegalStateException`。\n\
  - `boolean hasPrevious()`\n如果在反向遍历列表时还有另一个元素可以访问，则返回 `true`。\n- `E previous()`\n\
  返回上一个对象。如果到达列表开头，则抛出 `NoSuchElementException`。\n- `int nextIndex()`\n返回下一次调用 `next`\
  \ 将返回的元素索引。\n- `int previousIndex()`\n返回下一次调用 `previous` 将返回的元素索引。\n\n### java.util.LinkedList<E>\
  \ 1.2\n\n- `LinkedList()`\n构造一个空链表。\n- `LinkedList(Collection<? extends E> elements)`\n\
  构造一个链表并添加集合中的所有元素。\n- `void addFirst(E element)`\n- `void addLast(E element)`\n\
  在列表开头或结尾添加一个元素。\n- `E getFirst()`\n- `E getLast()`\n返回列表开头或结尾的元素。\n- `E removeFirst()`\n\
  - `E removeLast()`\n移除并返回列表开头或结尾的元素。\n\n### 9.2.2 Array Lists\n\n在前面的一节中，你已经看到了\
  \ `List` 接口和实现它的 `LinkedList` 类。`List` 接口描述了一个有序集合，其中元素的位置非常重要。访问元素有两种协议：通过迭代器（iterator）以及通过\
  \ `get` 和 `set` 方法进行随机访问。后者对于链表并不合适，但显然对于数组来说，`get` 和 `set` 非常有意义。集合库提供了熟悉的 `ArrayList`\
  \ 类，它也实现了 `List` 接口。`ArrayList` 封装了一个动态重新分配的对象数组。\n\n![Image](img/note.jpg) 备注\n\
  如果你是一位资深 Java 程序员，可能在任何需要动态数组时都会使用 `Vector` 类。为什么要用 `ArrayList` 而不是 `Vector` 呢？原因很简单：`Vector`\
  \ 类的所有方法都是同步的（synchronized）。从两个线程访问 `Vector` 对象是安全的。但如果你只从单个线程访问 vector（这是大多数情况），你的代码会在同步上浪费一些时间。相比之下，`ArrayList`\
  \ 方法不是同步的。当你不需要同步时，我们建议你使用 `ArrayList` 而不是 `Vector`。\n\n### 9.2.3 Hash Sets\n\n\
  链表和数组允许你指定排列元素的顺序。然而，如果你正在寻找某个元素但不记得它的位置，你就需要访问所有元素直到找到匹配项。如果集合包含很多元素，这可能会非常耗时。如果你不在乎元素的顺序，则有些数据结构可以让你更快地找到元素。缺点是这些数据结构让你无法控制元素出现的顺序。一种快速查找对象的常用数据结构是“hash\
  \ table”（哈希表）。哈希表为每个对象计算一个整数，称为“hash code”（哈希码）。哈希码以某种方式从对象的实例字段派生，最好是使得不同数据的对象产生不同的代码。这里列举由\
  \ `String` 类 `hashCode` 方法产生的一些哈希码示例。\n\n**表 9.2 由 hashCode 方法产生的哈希码**\n如果你定义了的类，你就有责任实现自己的\
  \ `hashCode` 方法——你的实现需要与 `equals` 方法兼容：如果 `a.equals(b)`，那么 `a` 和 `b` 必须具有相同的哈希码。现在重要的是，哈希码可以快速计算，且该计算仅依赖于需要哈希的对象的状态，而不取决于哈希表中的其他对象。在\
  \ Java 中，哈希表被实现为链表数组。每个列表被称为一个 `bucket`（桶）（见图 9.10）。要找到对象在表中的位置，只需计算其哈希码并对桶的总数取模。得到的数字就是存放该元素的桶索引。例如，如果一个对象的哈希码为\
  \ 7628 且有 128 个桶，那么该对象被放在桶 4 中（因为余数 `7628 % 128` 是 4）。也许你很幸运，该桶中没有其他元素。那么你只需将元素插入该桶中。当然，有时你会遇到已经填充的桶。这被称为“hash\
  \ collision”（哈希冲突）。然后，将新对象与桶中的所有对象进行比较，以检查它是否已经存在。如果哈希码分布随机且桶的数量足够大，只需要几次比较。\n\n\
  ![Image](img/09fig10.jpg)\n**图 9.10 一个哈希表**\n\n![Image](img/note.jpg) 备注\n从 Java\
  \ SE 8 开始，当桶满时，它们会从链表变为平衡二叉树。如果哈希函数选择不当导致大量冲突，或者恶意代码试图用许多相同哈希码的值冲刷哈希表，这将提高性能。\n\n\
  如果你想对哈希表的性能有更多控制，可以指定初始桶的数量。桶的数量表示用于收集具有相同哈希值的桶数量。如果向哈希表中插入过多元素，冲突数量就会增加，检索性能也会受到影响。如果你大致知道表中最终会有多少元素，你可以设置桶的数量。通常，你应该将其设置在预期元素数量的\
  \ 75% 到 150% 之间。一些研究人员认为，将桶的数量设置为质数是一个好主意，可以防止键的聚集。然而，这一点的证据并不充分。标准库使用的桶数量是 2 的幂，默认值为\
  \ `16`。你提供的任何表大小值都会被自动四舍入到下一个 2 的幂。\n\n当然，你并不总是知道需要存储多少个元素，或者你的初始猜测可能太低了。如果哈希表太满，就需要进行“rehashed”（重哈希）。要重哈希表，会创建一个具有更多桶的表，将所有元素插入新表，并丢弃原始表。`load\
  \ factor`（负载因子）决定了哈希表何时重哈希。例如，如果负载因子为 `0.75`（默认值）且表已超过 75%，它会自动以双倍的桶进行重哈希。对于大多数应用程序，将负载因子保持在\
  \ `0.75` 是合理的。\n\n哈希表可以实现许多重要的数据结构。其中最简单的是 `set` 类型。set 是一个没有重复元素的集合。set 的 `add`\
  \ 方法首先尝试查找要添加的对象，如果它不存在，则进行添加。\n\n\n\n\nJava 集合库提供了一个 `HashSet` 类，它实现基于哈希表的集合（set）。你通过\
  \ `add` 方法添加元素。`contains` 方法被重写，以实现快速查找，检查元素是否已存在于集合中。它只检查一个桶（bucket）中的元素，而不是集合中的所有元素。\n\
  \n哈希集合迭代器会依次访问所有的桶。由于哈希处理将元素散布在表中，因此它们被访问的顺序似乎是随机的。如果你不在乎集合中元素的顺序，那么你就可以直接使用 `HashSet`。\n\
  \n本节末尾的示例程序（Listing 9.2）从 `System.in` 读取单词，将它们添加到集合中，最后打印出集合中的前二十个单词。例如，你可以通过命令行壳启动程序，并将《爱丽丝仙游游》文本（你可以从\
  \ [`www.gutenberg.org`](http://www.gutenberg.org) 获取）输入程序：\n\n```bash\njava SetTest\
  \ < alice30.txt\n```\n\n程序从输入中读取所有单词并将其添加到哈希集合中。它然后遍历集合中的唯一单词，最后打印出计数。（《爱丽丝仙游游记》共有\
  \ 5,909 个唯一单词，包括开头的版权声明。）单词以随机顺序出现。\n\n![Image](img/caution.jpg) **注意**\n\n在修改集合元素时要小心。如果元素的哈希值发生变化，该元素将不再位于数据结构中的正确位置。\n\
  \n**Listing 9.2** `set/SetTest.java`\n\n点击此处查看代码图像\n\n```java\n1  package set;\n\
