  \ `this == other`，返回零；否则返回正整数。常量的顺序由 `enum` 声明决定。\n\n* * *\n\n## 5.7 反射\n\n反射库为你提供了一个非常强大的工具，可以在运行时检查和操作你的程序。反射\
  \ API 允许你在运行时检查或查询类、接口、字段和方法。它还允许你在运行时实例化新对象并调用方法。\n\n反射 API 位于 `java.lang.reflect`\
  \ 包。该包中的主要类是 `Field`、`Method`、`Constructor` 和 `Proxy`。\n\n反射 API 中最重要的类是 `Class`。Java\
  \ 中的每个类型都有一个关联的 `Class` 对象来描述它。你可以通过几种方式获取任何类型的 `Class` 对象：\n\n- 使用 `.class` 字面量：`Class\
  \ c = String.class;`\n- 使用 `getClass()` 方法：`Class c = obj.getClass();`\n- 使用静态的\
  \ `forName()` 方法：`Class c = Class.forName(\"java.lang.String\");`\n\n一旦获取了 `Class`\
  \ 对象，就可以使用它获取有关该类型的信息，例如它的名称、父类、实现的接口、方法和字段。\n\n### 5.7.1 Class\n\n`Class` 类是反射\
  \ API 的入口点。Java 中的每个类型都有对应的 `Class` 对象。这些对象都是 `java.lang.Class` 类的实例。\n\n`Class`\
  \ 类提供了几个方法来查询类型信息：\n\n- `getName()`：返回类的全名。\n- `getSimpleName()`：返回类的简单名。\n- `getSuperclass()`：返回类的父类。\n\
  - `getInterfaces()`：返回该类实现的接口数组。\n- `getMethods()`：返回类的所有公共方法数组。\n- `getFields()`：返回类的所有公共字段数组。\n\
  \n例如：\n\n```java\nClass c = String.class;\nSystem.out.println(c.getName()); // 输出\
  \ java.lang.String\nSystem.out.println(c.getSimpleName()); // 输出 String\n```\n\n\
  `Class` 类还可以使用 `newInstance()` 方法创建类型的新实例：\n\n```java\nClass c = String.class;\n\
  Object obj = c.newInstance();\n```\n（注意：`newInstance()` 自 Java 9 起已弃用。请使用 `Constructor.newInstance()`。）\n\
  \n#### 5.7.2 Field and Method\n\n`Field` 和 `Method` 类允许你检查类的字段和方法。\n\n`Field` 对象表示类的字段。你可以使用它获取字段的名称、类型，并获取或设置特定实例的值。\n\
  \n```java\nField f = String.class.getField(\"value\");\nSystem.out.println(f.getName());\
  \ // 输出 value\nObject value = f.get(new String(\"hello\")); // 返回内部表示表示\n```\n\n\
  `Method` 对象表示类的方法。你可以使用它获取方法的名称、返回类型、参数类型，并在特定实例上调用该方法。\n\n```java\nMethod m = String.class.getMethod(\"\
  toUpperCase\");\nObject result = m.invoke(new String(\"hello\")); // 返回 \"HELLO\"\
  \n```\n\n* * *\n\n### 5.7.3 Proxy\n\n`Proxy` 类允许你在运行时创建代理对象。这通常用于实现面向切面的编程，例如日志或事务。\n\
  \n```java\nInterface proxy = (Interface) Proxy.newProxyInstance(\n    Interface.class.getClassLoader(),\n\
  \    new Class<?>[]{Interface.class},\n    new InvocationHandler()\n);\n```\n\n\n\
  `Class` 类实际上是一个泛型类。例如，`Employee.class` 的类型是 `Class<Employee>`。我们不打算深究这个问题，因为这会让一个已经抽象的概念变得更加复杂。对于大多数实际用途，你可以忽略类型参数并使用原始的\
  \ `Class` 类型进行操作。有关此此问题的更多信息，请参阅第 8 章。\n\n![Image](img/caution.jpg) 注意事项\n\n由于历史原因，`getName`\
  \ 方法对数组类型返回了某些奇怪的名字：\n\n• `Double[].class.getName()` 返回 `\"[Ljava.lang.Double;\"\
  `。\n• `int[].class.getName()` 返回 `\"I\"`。\n\n虚拟机为每种类型管理一个唯一的 `Class` 对象。因此，你可以使用\
  \ `==` 运算符来比较类对象。例如：\n\n[点击此处查看代码图片\n\n```\nif (e.getClass() == Employee.class)\
  \ . . .\n```\n\n另一个实用的方法是允许你动态创建类的实例。这个方法自然而易见地被称为 `newInstance()`。例如，\n\n```\n\
  e.getClass().newInstance();\n```\n\n创建一个与 `e` 相同类类型的新实例。`newInstance` 方法调用无参数构造函数来初始化新创建的对象。如果类没有无参数构造函数，则会抛出异常。\n\
  \n`forName` 和 `newInstance` 的组合允许你根据存储在字符串中的类名创建对象。\n\n点击此处查看代码图片\n\n```\nString\
  \ s = \"java.util.Random\";\nObject m = Class.forName(s).newInstance();\n```\n\n\
  ![Image](img/note.jpg) 注意\n\n如果你需要为通过这种方式按名称创建的类构造函数提供参数，则不能使用上述语句。相反，你必须使用 `Constructor`\
  \ 类中的 `newInstance` 方法。\n\n![Image](img/note1.jpg) C++ 注意\n\n`newInstance` 方法对应于\
  \ C++ 中的虚拟构造函数（virtual constructor）用法。然而，C++ 中的虚拟构造函数并不是一种语言特性，而是一种需要特殊库支持的用法。`Class`\
  \ 类类似于 C++ 中的 `type_info` 类，而 `getClass` 方法等同于 `typeid` 运算符。不过，Java 的 `Class` 比\
  \ `type_info` 要通用得多。C++ 的 `type_info` 只能显示类型的名称字符串，而无法创建该类型的新对象。\n\n### 5.7.2 异常处理入门\n\
  \n我们在第 7 章中完整涵盖了异常处理，但在此期间你会偶尔遇到可能会抛出异常的方法。\n\n当运行时发生错误时，程序可以“抛出异常”。抛出异常比终止程序更灵活，因为你可以提供一个处理器来“捕获”并处理异常。\n\
  \n如果你不提供处理器，程序仍然会终止并在控制台上打印一条消息，说明异常的类型。你可能已经已经在不小心使用 `null` 引用或越数组边界时看到过异常报告了。\n\
  \n异常有两种类型：未检查异常（unchecked exceptions）和已检查异常（checked exceptions）。对于已检查异常，编译器会检查你是否提供了处理器。然而，许多常见异常（如访问\
  \ `null` 引用）是未检查的。编译器不会检查你是否为这些错误提供了处理器——毕竟，你应该把精力放在避免这些错误上，而不是为它们编写处理器。\n\n但并非所有错误都是可以避免的。尽管你尽了努力仍然可能发生异常，那么编译器就会坚持你提供处理器。`Class.forName`\
  \ 方法就是一个抛出已检查异常的方法示例。在第 7 章中，你将看到几种异常处理策略。现在，我们只向你展示简单的处理器实现。\n\n将可能抛出已检查异常的一个或多个语句放在\
  \ `try` 块中。然后在 `catch` 子句中提供处理器代码。\n\n点击此处查看代码图片\n\n```\ntry\n{\n   可能抛出异常的语句\n\
  }\ncatch (Exception e)\n{\n   处理器操作\n}\n```\n\n这是一个示例：\n\n点击此处查看代码图片\n\n```\ntry\n\
  {\n   String name = . . .; // 获取类名\n   Class cl = Class.forName(name); // 可能抛出异常\n\
  \   对 cl 进行某些操作\n}\ncatch (Exception e)\n{\n   e.printStackTrace();\n}\n```\n\n\
  如果类名不存在，`try` 块中的剩余代码将被跳过，程序进入 `catch` 子句。（在这里，我们使用 `Throwable` 类的 `printStackTrace`\
  \ 方法打印堆栈跟踪。`Throwable` 是 `Exception` 类的父类。）如果 `try` 块中没有任何方法抛出异常，则 `catch` 子句中的处理器代码将被跳过。\n\
  \n你只需要为已检查异常提供异常处理器。找出哪些方法抛出异常很容易。\n\n```\njava.lang.Class\nstatic Class forName(String\
  \ className)\nObject newInstance()\n```\n\n```\njava.lang.reflect.Constructor\n\
  Object newInstance(Object[] args)\n```\n\n![Image](img/265tab01.jpg)\n\n```\njava.lang.Throwable\n\
  void printStackTrace()\n```\n\n### 5.7.3 使用反射分析类\n\n以下是反射机制检查类结构的重要部分的概述。\n\n`java.lang.reflect`\
  \ 包中的 `Field`、`Method` 和 `Constructor` 这三个类分别描述字段、方法和构造函数。这三个类都有一个名为 `getName` 的方法，返回项目的名称。`Field`\
  \ 类有一个 `getType` 方法，返回一个对象（同样是 `Class` 类型），描述字段类型。`Method` 和 `Constructor` 类有报告参数类型的方法，而\
  \ `Method` 类还报告返回类型。这三个类都有一个 `getModifiers` 方法，返回一个整数（某些位开启或关闭），描述所使用的修饰符，如 `public`\
  \ 和 `static`。然后你可以使用 `java.lang.reflect` 中 `Modifier` 类的静态方法来分析 `getModifiers` 返回的整数。使用\
  \ `Modifier` 类中的 `isPublic`、`isPrivate` 或 `isFinal` 方法可以判断方法或构造函数是否为 `public`、`private`\
  \ 或 `final`。你只需要让 `Modifier.toString` 方法处理该整数。\n\n`Class` 类的 `getFields`、`getMethods`\
  \ 和 `getConstructors` 方法返回该类支持的公共字段、方法和构造函数的数组。这包括父类的公共成员。`Class` 类的 `getDeclaredFields`、`getDeclaredMethods`\
  \ 和 `getDeclaredConstructors` 方法返回在该类中声明的所有字段、方法和构造函数的数组。这包括私有的、包有有的受保护的成员，但不包括父类的成员。\n\
  \n列表 5.13 展示了如何打印关于类的所有信息。程序提示你输入类名，并输出该类所有方法和构造函数的签名以及所有实例字段的名称。例如，如果你输入\n\njava.lang.Double\n\
  \n程序打印\n\n\n\n\n\n点击此处查看代码图像\n\n```java\npublic class java.lang.Double extends java.lang.Number\n\
