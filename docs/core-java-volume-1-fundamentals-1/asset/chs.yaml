  ```\n\n### 10.5 使用 2D 形状\n\n从 Java 1.0 开始，`Graphics` 类就有了绘制线条、矩形、椭圆的方法。但那些绘制操作非常有限。例如，你无法改变线条的粗细，也无法旋转形状。\n\
  \nJava SE 1.2 引入了 *Java2D* 库，它实现了一套强大的图形操作。在本章中，我们只查看 Java 2D 高功能的基础知识。\n\n要在 Java\
  \ 2D 库中绘制形状，你需要获取一个 `Graphics2D` 对象。该类是 `Graphics` 类的子类。从 Java 2 开始，诸如 `paintComponent`\
  \ 等方法会自动接收一个 `Graphics2D` 对象。只需进行类型转换，如下：\n\n点击此处查看代码图片\n\n```java\npublic void\
  \ paintComponent(Graphics g)\n{\n   Graphics2D g2 = (Graphics2D) g;\n   ...\n}\n\
  ```\n\nJava 2D 库以面向对象的方式组织几何形状。特别是，有专门的类来表示线条、矩形和椭圆：\n\nLine2D\n\nRectangle2D\n\n\
  Ellipse2D\n\n这些类都实现了 `Shape` 接口。\n\n* * *\n\n![Image](img/note.jpg) 注意\n\nJava 2D\
  \ 库支持更复杂的形状——特别是弧、二次曲线、三次曲线以及通用路径（paths）。更多信息请参阅第二卷的 第 7 章。\n\n* * *\n\n要绘制形状，你首先创建一个实现\
  \ `Shape` 的类对象，然后调用 `Graphics2D` 类的 `draw` 方法。例如：\n\n```java\nRectangle2D rect =\
  \ ...;\ng2.draw(rect);\n```\n\n* * *\n\n![Image](img/note.jpg) 注意\n\n在 Java 2D 库出现之前，程序员使用\
  \ `Graphics` 类的方法（如 `drawRectangle`）来绘制形状。表面上看，旧的方法调用看起来简单一点。但通过使用 Java 2D 库，你保留了选择空间——以后可以使用\
  \ 2D 库提供的许多工具来增强你的绘画。\n\n使用 Java 2D 形状类引入了一些复杂度。与使用整数像素坐标的 1.0 版本方法不同，Java 2D 形状使用浮点坐标。在许多情况下，这是一个巨大的便利，因为它允许你使用你有意义的坐标（如毫米或英寸）来指定形状，然后将其转换为像素。Java\
  \ 2D 库在许多内部浮点计算中使用单精度 `float` 类型。单精度已经足够了——毕竟，几何计算的最终目的是是在屏幕或打印机上设置像素。\n\n\n\n\n\
  然而，操作 `float` 值有时对程序员来说并不够方便，因为 Java 坚持要求在将 `double` 值转换为 `float` 值时必须进行强制类型转换。例如，考虑以下语句：\n\
  \n```java\nfloat f = 1.2; // Error\n```\n\n该语句无法编译，因为常量 `1.2` 的类型是 `double`，而编译器担心精度的丢失。解决办法是在浮点数常量后面加上\
  \ `F` 后缀：\n\n```java\nfloat f = 1.2F; // Ok\n```\n\n现在考虑这条语句：\n\n点击此处查看代码图像\n\n\
  ```java\nRectangle2D r = . . .\n\nfloat f = r.getWidth(); // Error\n```\n\n该语句同样无法编译，原因相同。`getWidth()`\
  \ 方法返回一个 `double`。这次的解决办法是提供一个强制转换：\n\n点击此处查看代码图像\n\n```java\nfloat f = (float)\
  \ r.getWidth(); // OK\n```\n\n这些后缀和强制转换有些麻烦，因此 2D 库的设计者决定为每个形状类提供两个版本：一个带有 `float`\
  \ 坐标供节约内存的程序员使用，另一个带有 `double` 坐标供那些懒惰的程序员使用。（在本书中，我们属于第二阵营，尽可能地使用 `double` 坐标。）\n\
  \n库的设计者选择了一种奇特且起初令人困惑的方法来封装这些选择。考虑 `Rectangle2D` 类。它是一个抽象类，有两个具体的子类，这两个子类也是静态内部类：\n\
  \n- `Rectangle2D.Float`\n- `Rectangle2D.Double`\n\n图 10.9 显示了继承关系。\n\n![Image](img/10fig09.jpg)\n\
  \n**图 10.9** 2D 矩形类\n\n最好忽略这两个具体类是静态内部类这一事实——这仅仅是为了避免诸如 `FloatRectangle2D` 和 `DoubleRectangle2D`\
  \ 这样的名称。（有关静态内部类的更多信息，请参阅第 6 章）。\n\n当你构造一个 `Rectangle2D.Float` 对象时，你提供 `float` 类型的坐标。对于\
  \ `Rectangle2D.Double` 对象，你提供 `double` 类型的坐标。\n\n点击此处查看代码图像\n\n```java\nRectangle2D.Float\
  \ floatRect = new Rectangle2D.Float(10.0F, 25.0F, 22.5F, 20.0F);\n\nRectangle2D.Double\
  \ doubleRect = new Rectangle2D.Double(10.0, 25.0, 22.5, 20.0);\n```\n\n实际上，由于 `Rectangle2D.Float`\
  \ 和 `Rectangle2D.Double` 都自自共同的 `Rectangle2D` 类，且子类方法只是重写了 `Rectangle2D` 父类的方法，因此记住具体的形状类型并没有好处。你可以简单地使用\
  \ `Rectangle2D` 变量来持有矩形引用。\n\n点击此处查看代码图像\n\n```java\nRectangle2D floatRect = new\
  \ Rectangle2D.Float(10.0F, 25.0F, 22.5F, 20.0F);\n\nRectangle2D doubleRect = new\
  \ Rectangle2D.Double(10.0, 25.0, 22.5, 20.0);\n```\n\n也就是说，你只有在构造形状对象时才需要使用那些讨厌的内部类。\n\
  \n构造参数表示矩形的左上角、宽度和高度。\n\n***\n\n![Image](img/note.jpg) 备注\n\n实际上，`Rectangle2D.Float`\
  \ 类有一个没有从 `Rectangle2D` 继承的额外方法——即 `setRect(float x, float y, float h, float w)`。如果你将\
  \ `Rectangle2D.Float` 引用存储在 `Rectangle2D` 变量中，就会丢失该方法。但并不是什么损失——`Rectangle2D` 类有一个带有\
  \ `double` 参数的 `setRect` 方法。\n\n***\n\n`Rectangle2D` 方法使用 `double` 参数和返回值。例如，`getWidth()`\
