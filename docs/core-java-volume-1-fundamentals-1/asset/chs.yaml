  \n* * *\n\n### 10.7 使用特殊字体显示文本\n\n本章开头的“Not a Hello World”程序使用默认字体显示字符串。有时，你可能想用不同的字体显示文本。你可以通过*字体名称*（font\
  \ face name）指定字体。字体名称由*字体族名称*（font family name，如“Helvetica”）和一个可选的后缀（如“Bold”）组成。例如，“Helvetica”和“Helvetica\
  \ Bold”这两个字体都被认为是名为“Helvetica”的字体族的一部分。\n\n要查找特定计算机上可用的字体，请调用 `GraphicsEnvironment`\
  \ 类的 `getAvailableFontFamilyNames` 方法。该方法返回包含所有可用字体名称的字符串数组。要获取描述用户系统图形环境的 `GraphicsEnvironment`\
  \ 类实例，请使用静态方法 `getLocalGraphicsEnvironment`。以下程序打印了系统上所有字体的名称：\n\n点击此处查看代码图片\n\n\
  ```java\nimport java.awt.*;\n\npublic class ListFonts\n{\n   public static void\
  \ main(String[] args)\n   {\n      String[] fontNames = GraphicsEnvironment\n  \
  \        .getLocalGraphicsEnvironment()\n          .getAvailableFontFamilyNames();\n\
  \      for (String fontName : fontNames)\n          System.out.println(fontName);\n\
  \   }\n}\n```\n\n在某个系统上，列表如下：\n\nAbadi MT Condensed Light\nArial\nArial Black\n\
  Arial Narrow\nArioso\nBaskerville\nBinner Gothic\n...\n后面还有约七十个字体。\n\n字体名称可以注册商标，在某些司法管辖区字体设计可以受版权保护。因此，字体的发行通常涉及向字体公司支付版税。当然，就像名香水有廉价仿品一样，品牌字体也有相似字体。例如，Windows\
  \ 自带的 Helvetica 仿品被称为 Arial。\n\n为了建立共同的基准，AWT 定义了五个*逻辑*字体名称：\n\n- SansSerif\n- Serif\n\
  - Monospaced\n- Dialog\n- DialogInput\n\n这些名称始终映射到客户端上实际存在的某些字体。例如，在 Windows 系统上，`SansSerif`\
  \ 映射到 Arial。\n\n此外，Oracle JDK 始终包含三个名为“Lucida Sans”、“Lucida Bright”和“Lucida Sans\
  \ Typewriter”的字体族。\n\n要用某种字体绘制字符，必须先创建一个 `Font` 类的对象。指定字体名称、字体样式和字号。以下是如何构造 `Font`\
  \ 对象的示例：\n\n点击此处查看代码图片\n\n```java\nFont sansbold14 = new Font(\"SansSerif\", Font.BOLD,\
  \ 14);\n```\n\n第三个参数是字号。点（Points）在排版中常用于指示字体大小。每英寸有 72 点。\n\n你可以在 `Font` 构造函数中使用逻辑字体名称代替字体名称。通过设置第二个\
  \ `Font` 构造函数来指定样式（普通、**粗体**、*斜体*或*粗斜体*）：\n\n- `PLAIN`\n- `BOLD`\n- `ITALIC`\n-\
  \ `BOLD_ITALIC`（注：原文写为 \"bold italic\"，但标准 API 是 BOLD_ITALIC；后文跟随：`bold italic`）\n\
  \n\n\n\n要解释该矩形的尺寸，你需要了解一些基础的排版术语（参见图 10.13）。`baseline`（基线）是一条虚线，例如，像“e”这样的字符的底部所在的位置。`ascent`（上行高）是从基线到`ascender`（升部）的距离，升部是“b”或“k”等字母或大写字母的上部。`descent`（下行深）是从基线到`descender`（下降部）的距离，下降像是“p”或“g”等字母的底部。\n\
  \n![Image](img/10fig13.jpg)\n\n**图 10.13** 排版术语图\n\n`Leading`（行距）是上一行的下降部与下一行的上升部之间的空间。（该术语源于排字工人用来分隔行的铅条。）字体的`height`（高度）是两个连续基线之间的距离，等于`descent\
  \ + leading + ascent`。\n\n`getStringBounds` 方法返回的矩形宽度是字符串的水平跨度。矩形的高度是上升高、下降深和行距之和。矩形的原点位于字符串的基线。矩形的顶部\
  \ `y` 坐标为负值。因此，你可以如下所示获取字符串宽度、高度和上升高：\n\n点击此处查看代码图像\n\n```\ndouble stringWidth =\
  \ bounds.getWidth();\ndouble stringHeight = bounds.getHeight();\ndouble ascent =\
  \ -bounds.getY();\n```\n\n如果你需要知道下降深或行距，请使用 `Font` 类的 `getLineMetrics` 方法。该方法返回一个\
  \ `LineMetrics` 类对象，该类拥有获取下降深和行距的方法：\n\n点击此处查看代码图像\n\n```\nLineMetrics metrics =\
  \ f.getLineMetrics(message, context);\nfloat descent = metrics.getDescent();\nfloat\
  \ leading = metrics.getLeading();\n```\n\n以下代码使用了所有信息，将字符串在其周围的组件中居中：\n\n点击此处查看代码图像\n\
  \n```\nFontRenderContext context = g2.getFontRenderContext();\nRectangle2D bounds\
  \ = f.getStringBounds(message, context);\n// (x,y) = top left corner of text\ndouble\
  \ x = (getWidth() - bounds.getWidth()) / 2;\ndouble y = (getHeight() - bounds.getHeight())\
  \ / 2;\n// add ascent to y to reach the baseline\ndouble ascent = -bounds.getY();\n\
  double baseY = y + ascent;\ng2.drawString(message, (int) x, (int) baseY);\n```\n\
  \n为了理解居中原理，请考虑 `getWidth()` 返回的是组件的宽度。该宽度的一部分（即 `bounds.getWidth()`）被消息字符串占据。剩余部分应该等距离分布在两侧。因此，每侧的空白区域是差值的一半。高度也适用同样的原理。\n\
  \n***\n\n![Image](img/note.jpg) 备注\n\n当你在 `paintComponent` 方法之外计算布局尺寸时，无法从 `Graphics2D`\
  \ 对象获取字体渲染上下文。相反，调用 `JComponent` 类的 `getFontMetrics` 方法，然后调用 `getFontRenderContext`。\n\
  \n点击此处查看代码图像\n\n```\nFontRenderContext context = getFontMetrics(f).getFontRenderContext();\n\
  ```\n\n***\n\n为了证明定位是准确的，示例程序还绘制了基线和边界矩形。图 10.14 显示了屏幕显示；列表 10.5 是程序列表。\n\n![Image](img/10fig14.jpg)\n\
  \n**图 10.14** 绘制基线和字符串边界\n\n**列表 10.5** `font/FontTest.java`\n\n点击此处查看代码图像\n\n***\n\
  \n```java\npackage font;\n\nimport java.awt.*;\nimport java.awt.font.*;\nimport\
  \ java.awt.geom.*;\nimport javax.swing.*;\n\n/**\n * @version 1.34 2015-05-12\n\
  \ * @author Cay Horstmann\n */\npublic class FontTest\n{\n    public static void\
  \ main(String[] args)\n    {\n        EventQueue.invokeLater(() ->\n           \
  \ {\n                JFrame frame = new FontFrame();\n                frame.setTitle(\"\
  FontTest\");\n                frame.CloseOperation(JFrame.EXIT_ON_CLOSE);\n    \
  \            frame.setVisible(true);\n            });\n    }\n}\n\n/**\n * 一个带有文本组件的框架\n\
  \ */\nclass FontFrame extends JFrame\n{\n    public FontFrame()\n    {\n       \
  \ add(new FontComponent());\n        pack();\n    }\n}\n\n/**\n * 一个在框中显示居中消息的组件。\n\
  \ */\nclass FontComponent extends JComponent\n{\n    private static final int DEFAULT_WIDTH\
  \ = 300;\n    private static final int DEFAULT_HEIGHT = 200;\n\n    public void\
  \ paintComponent(Graphics g)\n    {\n        Graphics2D g2 = (Graphics2D) g;\n \
  \       String message = \"Hello, World!\";\n        Font f = new Font(\"Serif\"\
  , Font.BOLD, 36);\n        g2.setFont(f);\n        // measure the size of the message\n\
  \        FontRenderContext context = g2.getFontRenderContext();\n        Rectangle2D\
  \ bounds = f.getStringBounds(message, context);\n        // set (x,y) = top left\
  \ corner of text\n        double x = (getWidth() - bounds.getWidth()) / 2;\n   \
  \     double y = (getHeight() - bounds.getHeight()) / 2;\n        // add ascent\
  \ to y to reach the baseline\n        double ascent = -bounds.getY();\n        double\
  \ baseY = y + ascent;\n        // draw the message\n        g2.drawString(message,\
  \ (int) x, (int) baseY);\n        g2.setPaint(Color.LIGHT_GRAY);\n        // draw\
  \ the baseline\n        g2.draw(new Line2D.Double(x, baseY, x + bounds.getWidth(),\
  \ baseY));\n        // draw the enclosing rectangle\n        Rectangle2D rect =\
  \ new Rectangle2D.Double(x, y, bounds.getWidth(), bounds.getHeight());\n       \
  \ g2.draw(rect);\n    }\n\n    public Dimension getPreferredSize() {\n        return\
  \ new Dimension(DEFAULT_WIDTH, DEFAULT_HEIGHT);\n    }\n}\n```\n\n\n\n\n\n- `void\
  \ drawString(String str, int x, int y)`\n使用当前的字体和颜色绘制一个字符串。\n\n![Image](img/581tab02.jpg)\n\
  \n`java.awt.Graphics2D` 1.2\n\n- `FontRenderContext getFontRenderContext()`\n获取一个字体渲染上下文，该上下文指定了此图形上下文中的字体特征。\n\
  \n- `void drawString(String str, float x, float y)`\n使用当前的字体和颜色绘制一个字符串。\n\n![Image](img/582tab01.jpg)\n\
  \n`javax.swing.JComponent` 1.2\n\n- `FontMetrics getFontMetrics(Font f)` 5.0\n获取给定字体的字体量。`FontMetrics`\
  \ 类是 `LineMetrics` 类的前身。\n\n`java.awt.FontMetrics` 1.0\n\n- `FontRenderContext getFontRenderContext()`\
  \ 1.2\n获取该字体的字体渲染上下文。\n\n### 10.8 显示图像\n\n你已经学会了如何通过绘制线条和形状来构建简单的图画。复杂的图像（例如照片）通常是在外部生成的——例如，使用扫描仪或特殊的图像处理软件。正如你在第二卷中看到的，也可以逐像素地生成图像。\n\
  \n一旦图像存储在本地文件或互联网上的某处，你就可以将它们读入 Java 应用程序并显示在 `Graphics` 对象上。读取图像有很多方法。在这里，我们使用了你已经见过的\
  \ `ImageIcon` 类：\n\n点击此处查看代码图像\n\n```\nImage image = new ImageIcon(filename).getImage();\n\
  ```\n\n现在，变量 `image` 包含一个封装图像数据的对象的引用。你可以使用 `Graphics` 类的 `drawImage` 方法来显示图像。\n\
  \n点击此处查看代码图像\n\n```java\npublic void paintComponent(Graphics g)\n{\n    ...\n  \
  \  g.drawImage(image, x, y, null);\n}\n```\n\nListing 10.6 更进一步了一步，使用图形图像对窗口进行*平铺*。结果看起来就像图\
  \ 10.15 所示的屏幕。我们在 `paintComponent` 方法中进行平铺。我们首先在左上角绘制图像的一个副本，然后使用 `copyArea` 调用将其复制到整个窗口：\n\
  \n```java\nfor (int i = 0; i * imageWidth <= getWidth(); i++)\n  for (int j = 0;\
  \ j * imageHeight <= getHeight(); j++)\n    if (i + j > 0)\n      g.copyArea(0,\
  \ 0, imageWidth, imageHeight, i * imageWidth, j * imageHeight);\n```\n\n![Image](img/10fig15.jpg)\n\
  \n**图 10.15** 带有平铺图形图像的窗口\n\nListing 10.6 显示了图像显示程序的完整源代码。\n\n**Listing 10.6** `image/ImageTest.java`\n\
  \n点击此处查看代码图像\n\n```java\npackage image;\n\nimport java.awt.*;\nimport javax.swing.*;\n\
  \n/**\n * @version 1.34 2015-05-12\n * @author Cay Horstmann\n */\npublic class\
  \ ImageTest\n{\n    public static void main(String[] args)\n    {\n        EventQueue.invokeLater(()\
  \ ->\n            {\n                JFrame frame = new ImageFrame();\n        \
  \        frame.setTitle(\"ImageTest\");\n                frame.setDefaultCloseOperation(JFrame.EXIT_ON_CLOSE);\n\
  \                frame.setVisible(true);\n            });\n    }\n}\n\n    /**\n\
  \     * 带有图像组件的框架\n     */\n    class ImageFrame extends JFrame\n    {\n       \
  \ public ImageFrame()\n        {\n            add(new ImageComponent());\n     \
  \       pack();\n        }\n    }\n\n    /**\n     * 显示平铺图像的组件\n     */\n    class\
  \ ImageComponent extends JComponent\n    {\n        private static final int DEFAULT_WIDTH\
  \ = 300;\n        private static final int DEFAULT_HEIGHT = 200;\n\n        private\
  \ Image image;\n\n        public ImageComponent()\n        {\n            image\
  \ = new ImageIcon(\"blue-ball.gif\").getImage();\n        }\n\n        public void\
  \ paintComponent(Graphics g)\n        {\n            if (image == null) return;\n\
  \n            int imageWidth = image.getWidth(this);\n            int imageHeight\
  \ = image.getHeight(this);\n\n            // 在左上角绘制图像\n            g.drawImage(image,\
  \ 0, 0, null);\n\n            // 跨组件平铺图像\n            for (int i = 0; i * imageWidth\
  \ <= getWidth(); i++)\n              for (int j = 0; j * imageHeight <= getHeight();\
  \ j++)\n                if (i + j > 0)\n                  g.copyArea(0, 0, imageWidth,\
  \ imageHeight, i * imageWidth, j * imageHeight);\n        }\n\n        public Dimension\
  \ getPreferredSize() { return new Dimension(DEFAULT_WIDTH, DEFAULT_HEIGHT); }\n\
  \    }\n```\n\n`java.awt.Graphics` 1.0\n\n- `boolean drawImage(Image img, int x,\
  \ int y, ImageObserver)`\n绘制未缩放的图像。\n\n![Image](img/585tab01.jpg)\n\n- `boolean\
  \ drawImage(Image img, int x, int y, ImageObserver)`\n绘制缩放的图像。该系统将图像缩放到给定的区域。\n\n\
  ![Image](img/585tab02.jpg)\n\n- `void copyArea(int x, int y, int width, int height,\
  \ int dx, int dy)`\n复制屏幕的一个区域。\n\n![Image](img/586tab01.jpg)\n\n这结束了对图形编程的介绍。对于更高级的技术，请参考第二卷中关于二维图像处理的讨论。在下一章中，你将学习如何响应用户输入。\n\
  \n# 第 11 章 事件处理\n\n在本章中\n\n- 11.1 事件处理基础\n- 11.2 动作\n- 11.3 鼠标事件\n- 11.4 AWT 事件层次结构\n\
  \n事件处理对于具有图形用户界面的程序是至关重要的。为了实现用户界面，你必须掌握 Java 处理事件的方式。本章解释了 AWT 事件模型的工作原理。你将看到如何从用户界面组件和输入设备获取事件。我们还将展示如何使用*动作*，它们代表了处理事件的一种更有结构的方法。\n\
  \n### 11.1 事件处理基础\n\n任何支持 GUI 的操作系统都会持续监控按键或鼠标点击等事件。操作系统会将这些事件报告给正在运行的程序。每个程序然后决定对这些事件做什么（如果有的话）。在\
  \ Visual Basic 等语言中，事件与代码之间的关系是显而易见的。为每个特定的事件编写代码，并将代码放在通常被称为*事件过程*的地方。例如，一个名为 `HelpButton`\
  \ 的 Visual Basic 按钮关联了一个 `HelpButton_Click` 事件过程。每当点击该按钮时，过程中的代码就会执行。每个 Visual Basic\
  \ GUI 组件响应一组固定的事件，无法更改它响应的事件。\n\n另一方面，如果你使用原生 C 语言进行事件驱动编程，你需要编写代码来不断检查事件队列，查看操作系统正在报告的内容。这通常通过将代码封装在一个带有巨大\
  \ `switch` 语句的循环来实现。这种技术显然很拙劣，而且无论如何写起来都更困难。它的优势在于，你可以响应的事件并不像 Visual Basic 那种极力从程序员面前隐藏事件队列的语言那样有限。\n\
  \n\n\n\n\nJava 编程环境在功能和相应的复杂性方面介于 Visual Basic 和原始 C 语言之间。在 AWT 能够处理的事件范围内，你可以完全控制事件如何从\
  \ `event sources`（事件源，如按钮或滚动条）传输到 `event listeners`（事件监听器）。你可以指定 `any` 对象作为事件监听器——在实践中，你选择一个能够方便地对事件做出相应响应的\
  \ get 即可。这种 `event delegation model` 比 Visual Basic 提供了更大的灵活性，因为在 Visual Basic 中，监听器是预先定义的。\n\
  \n事件源拥有某些方法，允许你向它们注册事件监听器。当源发生事件时，该源会向所有注册了该事件的监听器对象发送该事件的通知。\n\n正如在 Java 这种面向对象的语言中所预期的那样，事件的信息被封装在事件对象中。在\
  \ Java 中，所有事件对象最终都派自 `java.util.EventObject` 类。当然，每种类型的事件都有子类，例如 `ActionEvent` 和\
  \ `WindowEvent`。\n\n不同的事件源可以产生不同类型的事件。例如，按钮可以发送 `ActionEvent` 对象，而窗口可以发送 `WindowEvent`\
  \ 对象。\n\n总结来说，这里是 AWT 事件处理工作原理的概述：\n\n* 监听器对象是一个实现特定接口的类实例，该接口自然地被称为 `listener interface`（监听器接口）。\n\
  * 事件源是一个可以注册监听器对象并向它们发送事件对象的对象。\n* 当事件发生时，事件源会向所有注册的监听器发送事件对象。\n* 监听器对象将使用事件对象中的信息来确定对事件的反应。\n\
  \n图 11.1 显示了事件处理类与接口之间的关系。\n\n![Image](img/11fig01.jpg)\n\n**图 11.1** 事件源与监听器之间的关系\n\
  \n以下是一个指定监听器的示例：\n\n点击此处查看代码图片\n\n```\nActionListener listener = . . .;\n\nJButton\
  \ button = new JButton(\"OK\");\n\nbutton.addActionListener(listener);\n```\n\n\
  现在，每当按钮发生“动作事件”时，`listener` 对象就会收到通知。对于按钮来说，正如你预期的那样，动作事件就是按钮点击。\n\n要实现 `ActionListener`\
  \ 接口，监听器类必须有一个名为 `actionPerformed` 的方法，该方法接收一个 `ActionEvent` 对象作为参数。\n\n点击此处查看代码图片\n\
  \n```\nclass MyListener implements ActionListener\n\n{\n   ...\n\n   public void\
  \ actionPerformed(ActionEvent event)\n   {\n      // 对按钮点击的反应写在这里\n      ...\n \
  \  }\n}\n```\n\n每当用户点击按钮时，`JButton` 对象就会创建一个 `ActionEvent` 对象并调用 `listener.actionPerformed(event)`，传递该事件对象。按钮之类的事件源可以有多个监听器。在这种情况下，每当用户点击按钮时，按钮都会调用所有监听器的\
  \ `actionPerformed` 方法。\n\n图 11.2 显示了事件源、事件监听器和事件对象之间的交互。\n\n![Image](img/11fig02.jpg)\n\
  \n**图 11.2** 事件通知\n\n### 11.1.1 示例：处理按钮点击\n\n为了熟悉事件委托模型，让我们详细介绍一下响应按钮点击这一简单示例所需的所有细节。在这个示例中，我们将展示一个包含三个按钮的面板（panel）。三个监听器对象作为动作监听器被添加到按钮上。\n\
  \n在这种场景下，用户每当点击面板上的任何一个按钮时，关联的监听器对象都会接收到一个指示为按钮点击的 `ActionEvent`。在我们的示例程序中，监听器对象将更改面板的背景颜色。\n\
  \n在向你展示监听按钮点击的程序之前，我们首先需要解释如何创建按钮以及将它们添加到面板中。（有关 GUI 元素的更多信息，请参阅 第 12 章。）\n\n要创建一个按钮，在按钮的构造函数中指定标签字符串、图标或两者。这里有两个示例：\n\
  \n点击此处查看代码图片\n\n```\nJButton yellowButton = new JButton(\"Yellow\");\n\nJButton\
  \ blueButton = new JButton(new ImageIcon(\"blue-ball.gif\"));\n```\n\n调用 `add` 方法将按钮添加到面板中：\n\
  \n点击此处查看代码图片\n\n```\nJButton yellowButton = new JButton(\"Yellow\");\n\nJButton\
  \ blueButton = new JButton(\"Blue\");\n\nJButton redButton = new JButton(\"Red\"\
  );\n\nbuttonPanel.add(yellowButton);\n\nbuttonPanel.add(blueButton);\n\nbuttonPanel.add(redButton);\n\
  ```\n\n图 11.3 显示了结果。\n\n![Image](img/11fig03.jpg)\n\n**图 11.3** 种满按钮的面板\n\n接下来，我们需要添加监听这些按钮的代码。这需要实现\
  \ `ActionListener` 接口的类，正如我们刚刚提到的，该接口有一个方法：`actionPerformed`，其签名看起来如下：\n\n点击此处查看代码图片\n\
  \n```\npublic void actionPerformed(ActionEvent event)\n```\n\n`ActionListener` 接口被用于许多情况：\n\
  \n* 从列表中选择了某项\n* 从菜单中选择了某项\n* 按了 Enter 键\n* 经过了一段时间时间\n\n你将在下一章看到更多细节。当按钮被点击时，我们希望面板的背景颜色变为特定的颜色。我们在监听器类中存储这种颜色。\n\
  \n点击此处查看代码图片\n\n```\nclass ColorAction implements ActionListener\n\n{\n   private\
  \ Color backgroundColor;\n\n   public ColorAction(Color c)\n   {\n      backgroundColor\
  \ = c;\n   }\n\n   public void actionPerformed(ActionEvent event)\n   {\n      //\
  \ 设置面板颜色\n      ...\n   }\n}\n```\n\n然后我们为每种颜色构造一个对象，并将这些对象设置为按钮监听器。\n\n点击此处查看代码图片\n\
  \n```\nColorAction yellowAction = new ColorAction(Color.YELLOW);\n\nColorAction\
  \ blueAction = new ColorAction(Color.BLUE);\n\nColorAction redAction = new ColorAction(Color.RED);\n\
  \nyellowButton.addActionListener(yellowAction);\n\nblueButton.addActionListener(blueAction);\n\
  \nredButton.addActionListener(redAction);\n```\n\n例如，如果用户点击标记为“Yellow”的按钮，`yellowAction`\
  \ 对象的 `actionPerformed` 方法就会被调用。它的 `backgroundColor` 实例字段被设置为 `Color.YELLOW`，现在它可以继续设置面板的背景颜色了。\n\
  \n还剩下一个问题。`ColorAction` 对象无法访问 `buttonPanel` 变量。你可以通过两种方式解决这个问题：将面板存储在 `ColorAction`\
  \ 对象中并在 `ColorAction` 构造函数中设置它；或者更方便地，将 `ColorAction` 变成 `ButtonFrame` 类的内部类。这样它的方法就可以自动访问外部面板。（有关内部类的更多信息，请参阅\
  \ 第 6 章。）\n\n我们采用后一种方法。以下是将 `ColorAction` 类放置在 `ButtonFrame` 类内部的方法：\n\n```\nclass\
  \ ButtonFrame extends JFrame\n\n{\n   private JPanel buttonPanel;\n\n   ...\n\n\
  \   private class ColorAction implements ActionListener\n\n   {\n```\n\n\n\n\n\n\
  ```java\n      private Color backgroundColor;\n\n      ...\n\n      public void\
  \ actionPerformed(ActionEvent event)\n      {\n          buttonPanel.setBackground(backgroundColor);\n\
  \      }\n\n    }\n}\n```\n\n仔细观察 `actionPerformed` 方法。`ColorAction` 类并没有 `buttonPanel`\
  \ 字段。但外层的 `ButtonFrame` 类确实有。\n\n这种情况非常常见。事件监听器对象通常需要执行某些影响其他对象的操作。你通常可以策略性地将监听器类放置在监听器应该修改状态的类内部。\n\
  \n`Listing 11.1` 包含了完整的框架类。每当你点击其中一个按钮时，相应的动作监听器就会改变面板的背景颜色。\n\n**Listing 11.1**\
  \ `button/ButtonFrame.java`\n\n点击此处查看代码图片\n\n***\n\n```java\n1   package button;\n\
  2\n3   import java.awt.*;\n4   import java.awt.event.*;\n5   import javax.swing.*;\n\
  6\n7   /**\n8    * 一个带有按钮面板的框架\n9    */\n10  public class ButtonFrame extends JFrame\n\
  11  {\n12      private JPanel buttonPanel;\n13      private static final int DEFAULT_WIDTH\
  \ = 300;\n14      private static final int DEFAULT_HEIGHT = 200;\n15\n16      public\
  \ ButtonFrame()\n17      {\n18          setSize(DEFAULT_WIDTH, DEFAULT_HEIGHT);\n\
  19\n20          // 创建按钮\n21          JButton yellowButton = new JButton(\"Yellow\"\
  );\n22          JButton blueButton = new JButton(\"Blue\");\n23          JButton\
  \ redButton = new JButton(\"Red\");\n24\n25          buttonPanel = new JPanel();\n\
  26\n27          // 将按钮添加到面板\n28          buttonPanel.add(yellowButton);\n29    \
  \      buttonPanel.add(blueButton);\n30          buttonPanel.add(redButton);\n31\n\
  32          // 将面板添加到框架\n33          add(buttonPanel);\n34\n35          //创建按钮动作\n\
  36          ColorAction yellowAction = new ColorAction(Color.YELLOW);\n37      \
  \    ColorAction blueAction = new ColorAction(Color.BLUE);\n38          ColorAction\
  \ redAction = new ColorAction(Color.RED);\n39\n40          // 将动作与按钮关联\n41     \
  \     yellowButton.addActionListener(yellowAction);\n42          blueButton.addActionListener(blueAction);\n\
  43          redButton.addActionListener(redAction);\n44      }\n45\n46      /**\n\
  47       * 一个设置面板背景色的动作监听器。\n48       */\n49      private class ColorAction implements\
  \ ActionListener\n50      {\n51          private Color backgroundColor;\n52\n53\
  \          public ColorAction(Color c)\n54          {\n55              backgroundColor\
  \ = c;\n56          }\n57\n58          public void actionPerformed(ActionEvent event)\n\
  59          {\n60              buttonPanel.setBackground(backgroundColor);\n61 \
  \         }\n62      }\n63  }\n```\n\n#### 1.12 简洁地指定监听器\n\n在前面的节中，我们为事件监听器对象定义了一个类。最常见的情况是每个监听器执行一个操作。在这种情况下，没有必要单独创建一个类。只需使用\
  \ lambda 表达式即可：`点击此处查看代码图片`\n\n考虑有多个动作的情况，如前一节所示。在这种情况下，实现一个辅助方法：\n\n```java\npublic\
  \ void makeButton(String name, Color backgroundColor)\n{\n    JButton button = new\
  \ JButton(name);\n    buttonPanel.add(button);\n    button.addActionListener(event\
  \ ->\n        buttonPanel.setBackground(backgroundColor)\n    );\n}\n```\n\n然后 lambda\
  \ 表达式引用了变量 `backgroundColor`。`点击此处查看代码图片`\n\n`makeButton(\"yellow\", Color.YELLOW);`\n\
  `makeButton(\"blue\", Color.BLUE);`\n`makeButton(\"red\", Color.RED);`\n\n在旧代码中，你经常会看到匿名类：`点击此处查看代码图片`\n\
  \n```java\nyellowButton.addActionListener(new ActionListener() {\n    public void\
  \ actionPerformed(ActionEvent event) {\n        buttonPanel.setBackground(backgroundColor);\n\
  \    }\n});\n```\n\n当然，这种冗长的代码不再是必要的。使用 lambda 表达式更简单。\n\n有些程序员不习惯内部类或 lambda 表达式，而是让容器本身作为监听器，如下所示：`点击此处查看代码图片`\n\
  \n`yellowButton.addActionListener(this);`\n`blueButton.addActionListener(this);`\n\
  `redButton.addActionListener(this);`\n\n现在这三个按钮不再有独立的监听器了。它们共享同一个监听器——即框架。因此，`actionPerformed`\
  \ 方法必须找出是哪个按钮被点击了。`点击此处查看代码图片`\n\n```java\nclass ButtonFrame extends JFrame implements\
  \ ActionListener {\n    public void actionPerformed(ActionEvent event) {\n     \
  \   Object source = event.getSource();\n        if (source == yellowButton) {\n\
  \            buttonPanel.setBackground(Color.YELLOW);\n        } else if (source\
  \ == blueButton) {\n            buttonPanel.setBackground(Color.BLUE);\n       \
  \ } else if (source == redButton) {\n            buttonPanel.setBackground(Color.RED);\n\
  \        }\n    }\n}\n```\n\n我们不推荐这种策略。\n\n在 lambda 表达式可用之前，还有另一种机制用于指定事件处理程序中包含单个方法调用的事件监听器。例如，假设一个按钮监听器需要执行调用\
  \ `frame.loadData()`。`点击此处查看代码图片`\n\n`EventHandler.create(ActionListener.class,\
  \ frame, \"loadData\")`\n\n这现在仅具有历史意义。有了 lambda 表达式，使用 `event -> frame.loadData();`\
  \ 要容易得多。\n\n`EventHandler` 机制也是低效且容易出错的。它使用反射来调用方法。由于这个原因，`EventHandler.create`\
  \ 调用中的第二个参数必须属于一个*公共*类。否则，反射机制将无法定位并调用目标方法。\n\n\n\n\n\n创建一个实现给定接口的代理类对象。指定的命名方法或接口的所有方法都会对目标对象执行给定的操作。\n\
  \n该操作可以是目标对象的方法名，也可以是属性。如果是属性，则会执行其设置器方法。例如，操作 `\"text\"` 被转换为对 `setText` 方法的调用。\n\
  \n`event` 属性由一个或多个用点分隔的属性名组成。第一个属性从监听器方法的参数读取，第二个属性从结果的对象中读取，依此类推。最终结果成为操作的参数。例如，属性\
  \ `\"source.text\"` 被转换为对 `getSource` 和 `getText` 方法的调用。\n\n***\n\njava.util.EventObject\
  \ 1.1\n\n• `Object getSource()`\n\n返回事件发生对象的引用。\n\n***\n\n### 11.1.3 示例：更改外观（Look-and-Feel）\n\
  \n默认情况下，Swing 程序使用 Metal 插件。有两种方法可以更改为不同的外观。第一种是在 Java 安装目录的 `jre/lib` 子目录下提供一个\
  \ `swing.properties` 文件。在该文件中，将属性 `swing.defaultlaf` 设置为你想要的外观的类名。例如：\n\n点击此处查看代码图像\n\
  \n```\nswing.defaultlaf=com.sun.java.swing.plaf.motif.MotifLookAndFeel\n```\n\n\
  注意，Metal 和 Nimbus 外观位于 `javax.swing` 包中。其他外观的包位于 `com.sun.java` 包中，并且不需要在每个 Java\
  \ 实现中都存在。例如，由于版权原因，Windows 和 Macintosh 外观包仅随 Windows 和 Macintosh  Java Java 环境发布。\n\
  \n***\n\n![Image](img/tip.jpg) 提示\n\n属性文件中以 `#` 字符开头的行会被忽略，因此你可以在 `swing.properties`\
  \ 文件中提供多个外观选择，并通过移动 `#` 符号来选择其中一个：\n\n点击此处查看代码图像\n\n```\n#swing.defaultlaf=javax.swing.plaf.metal.MetalLookAndFeel\n\
  \nswing.defaultlaf=com.sun.java.swing.plaf.motif.MotifLookAndFeel\n\n#swing.defaultlaf=com.sun.java.swing.plaf.windows.WindowsLookAndFeel\n\
  ```\n\n你必须重启程序以通过这种方式切换外观。Swing 程序仅在启动时读取一次 `swing.properties` 文件。\n\n***\n\n第二种方法是动态更改外观。调用静态方法\
  \ `UIManager.setLookAndFeel` 并向其传递你想要的外观类名。然后调用静态方法 `SwingUtilities.updateComponentTreeUI`\
  \ 来刷新整个组件集。你需要向该方法提供一个组件；它会找到所有其他组件。\n\n这是一个展示如何在你的程序中切换到 Motif 外观的示例：\n\n点击此处查看代码图像\n\
  \n```java\nString className = \"com.sun.java.swing.plaf.motif.MotifLookAndFeel\"\
  ;\n\ntry\n{\n    UIManager.setLookAndFeel(className);\n    SwingUtilities.updateComponentTreeUI(frame);\n\
  \    pack();\n}\ncatch(Exception e) { e.printStackTrace(); }\n```\n\n要列出所有已安装的外观实现，请调用\n\
  \n点击此处查看代码图像\n\n```java\nUIManager.LookAndFeelInfo[] infos = UIManager.getInstalledLookAndFeels();\n\
  ```\n\n然后你可以如下获取每个外观的名称和类名\n\n点击此处查看代码图像\n\n```java\nString name = infos[i].getName();\n\
  String className = infos[i].getClassName();\n```\n\n列表 11.2 是一个演示如何切换外观的完整程序（参见图\
  \ 11.4）。该程序与列表 11.1 类似。遵循上一节的建议，我们使用辅助方法 `makeButton` 和 lambda 表达式来指定按钮操作——即切换外观。\n\
  \n点击此处查看代码图像\n\n```java\npublic class PlafFrame extends JFrame\n{\n    ...\n   \
  \ private void makeButton(String name, String className)\n    {\n        JButton\
  \ button = new JButton(name);\n        buttonPanel.add(button);\n        button.addActionListener(event\
  \ -> {\n            ...\n            UIManager.setLookAndFeel(className);\n    \
  \        SwingUtilities.updateComponentTreeUI(this);\n            ...\n        });\n\
  \    }\n}\n```\n\n![Image](img/1fig04.jpg) 图 1.4 切换外观\n\n***\n\n![Image](img/note.jpg)\
  \ 注意 在此书的早期版本中，我们使用内部类来定义此监听器。当时，我们必须小心地向 `SwingUtilities.updateComponentTreeUI`\
  \ 传递 `PlafFrame.this`（而不是内部类的 `this` 引用）：\n\n点击此处查看代码图像\n\n```java\npublic class\
  \ PlafFrame extends JFrame\n{\n    ...\n    private void makeButton(String name,\
  \ String className)\n    {\n        ...\n        button.addActionListener(new ActionListener()\n\
  \        {\n            public void actionPerformed(ActionEvent event)\n       \
  \     {\n                ...\n                SwingUtilities.updateComponentTreeUI(PlafFrame.this);\n\
  \                ...\n            }\n        });\n    }\n}\n```\n\n这个问题在使用 lambda\
  \ 表达式后消失了。在 lambda 表达式内部，`this` 指向外层对象。\n\n***\n\n列表 11.2 `plaf/PlafFrame.java`\n\
  \n点击此处查看代码图像\n\n```java\npackage plaf;\n\nimport javax.swing.JButton;\nimport javax.swing.JFrame;\n\
  import javax.swing.JPanel;\nimport javax.swing.SwingUtilities;\nimport javax.swing.UIManager;\n\
  \n/**\n * 一个带有用于更改外观的面板的框架\n */\npublic class PlafFrame extends JFrame\n{\n    private\
  \ JPanel buttonPanel;\n\n    public PlafFrame()\n    {\n        buttonPanel = new\
  \ JPanel();\n\n        UIManager.LookAndFeelInfo[] infos = UIManager.getInstalledLookAndFeels();\n\
  \        for (UIManager.LookAndFeelInfo info : infos)\n            makeButton(info.getName(),\
  \ info.getClassName());\n\n        add(buttonPanel);\n        pack();\n    }\n\n\
  \    /**\n     * 创建一个按钮来更改可插件的外观。\n     * @param name 按钮名称\n     * @param className\
  \ 外观类名\n     */\n    private void makeButton(String name, String className)\n  \
  \  {\n        // 将按钮添加到面板\n        JButton button = new JButton(name);\n       \
  \ buttonPanel.add(button);\n        // 设置监听器\n        button.addActionListener(event\
  \ -> {\n            // 按钮操作：切换到外观\n            try\n            {\n            \
  \    UIManager.setLookAndFeel(className);\n                SwingUtilities.updateComponentTreeUI(this);\n\
  \            }\n            catch (Exception e)\n            {\n               \
  \ e.printStackTrace();\n            }\n        });\n    }\n}\n```\n\n\n\n\n\n并不是所有的事件都像按钮点击那样容易处理。在非演示性的程序中，你可能希望监控用户尝试关闭主窗框的操作，因为你不希望用户丢失未保存的工作。当用户关闭框架时，你希望弹出一个对话框，并且仅在用户同意后才退出程序。\n\
  \n当用户尝试关闭窗口时，`JFrame` 对象是 `WindowEvent` 的源。如果你想捕获该事件，必须有一个合适的监听器对象，并将其添加到框架的窗口监听列表中。\n\
  \n点击此处查看代码图像\n\n```java\nWindowListener listener = . . .;\nframe.addWindowListener(listener);\n\
  ```\n\n窗口监听器必须是一个实现了 `WindowListener` 接口类的对象。`WindowListener` 接口中实际上有七个方法。框架调用这些方法作为对窗口可能发生的七种不同事件的响应。这些名称是言自自明的，除了在\
  \ Windows 下，“iconified”（图标化）通常被称为“minimized”（最小化）。以下是完整的 `WindowListener` 接口：\n\n\
  点击此处查看代码图像\n\n```java\npublic interface WindowListener\n{\n   void windowOpened(WindowEvent\
  \ e);\n   void windowClosing(WindowEvent e);\n   void windowClosed(WindowEvent e);\n\
  \   void windowIconified(WindowEvent e);\n   void windowDeiconified(WindowEvent\
  \ e);\n   void windowActivated(WindowEvent e);\n   void windowDeactivated(WindowEvent\
  \ e);\n}\n```\n\n* * *\n\n![Image](img/note.jpg) 注意\n\n要找出窗口是否已最大化，请安装一个 `WindowStateListener`\
  \ 并重写 `windowStateChanged` 方法。\n\n* * *\n\n与 Java 中一样，任何实现接口的类都必须实现其所有方法；在这种情况下，这意味着实现所有七个方法。记住，我们只对这七个方法之一感兴趣，即\
  \ `windowClosing` 方法。\n\n当然，我们可以定义一个实现接口的类，在 `windowClosing` 方法中添加对 `System.exit(0)`\
  \ 的调用，并为其他六个方法编写空函数：\n\n点击此处查看代码图像\n\n```java\nclass Terminator implements WindowListener\n\
  {\n   public void windowClosing(WindowEvent e)\n   {\n      if (user agrees)\n \
  \        System.exit(0);\n   }\n   public void windowOpened(WindowEvent e) {}\n\
  \   public void windowClosed(WindowEvent e) {}\n   public void windowIconified(WindowEvent\
  \ e) {}\n   public void windowDeiconified(WindowEvent e) {}\n   public void windowActivated(WindowEvent\
  \ e) {}\n   public void windowDeactivated(WindowEvent e) {}\n}\n```\n\n为六个无所作用的方法编写代码是一种没人喜欢的枯燥重复工作。为了简化这项任务，每个具有多个方法的\
  \ AWT 监听器接口都带有一个配套的适配器类（adapter class），该类实现了接口中的所有方法，但不对它们执行任何操作。例如，`WindowAdapter`\
  \ 类拥有七个空方法。这意味着适配器类自动满足了 Java 对实现相关监听器接口的技术要求。你可以扩展适配器类来指定对接口中某些（但不是所有）事件类型的预期响应。（像\
  \ `ActionListener` 这样只有一个方法的接口是不需要适配器类的。）\n\n让我们利用一下这个窗口适配器。我们可以扩展 `WindowAdapter`\
  \ 类，继承六个空方法，并重写 `windowClosing` 方法：\n\n点击此处查看代码图像\n\n```java\nclass Terminator extends\
  \ WindowAdapter\n{\n   public void windowClosing(WindowEvent e)\n   {\n      if\
  \ (user agrees)\n         System.exit(0);\n   }\n}\n```\n\n现在你可以将一个 `Terminator`\
  \ 类型的对象注册为事件监听器：\n\n点击此处查看代码图像\n\n```java\nWindowListener listener = new Terminator();\n\
  frame.addWindowListener(listener);\n```\n\n每框架生成窗口事件时，它会通过其七个方法之一将事件传递给 `listener`\
  \ 对象（参见图 11.5）。其中六个方法无所作为；`windowClosing` 方法调用 `System.exit(0)`，终止应用程序。\n\n![Image](img/11fig05.jpg)\n\
  \n**图 11.5** 窗口监听器\n\n* * *\n\n![Image](img/caution.jpg) 注意\n\n如果你在扩展适配器类时拼写错了方法名称，编译器不会发现你的错误。例如，如果你在\
  \ `WindowAdapter` 中定义了一个方法 `windowIsClosing`，你将得到八个方法。使用 `@Override` 注解（在第 5 节描述过）来防止这种错误。\n\
  \n* *\n\n创建一个扩展 `WindowAdapter` 的类是一种改进，没有必要给监听器命名。我们可以更进一步：\n\n```java\nframe.addWindowListener(new\
  \ WindowAdapter()\n{\n   @Override\n   public void windowClosing(WindowEvent e)\n\
  \   {\n      if (user agrees)\n         System.exit(0);\n   }\n});\n```\n\n这段代码的作用是：\n\
  - 定义了一个扩展 `WindowAdapter` 的匿名类\n- 在该匿名类中添加了 `windowClosing` 方法\n- 继承了 `WindowAdapter`\
  \ 的剩余空方法\n- 创建了该类的对象\n- 将该对象传递给 `addWindowListener` 方法\n\n再次，匿名类的语法需要一些适应。回报是代码尽可能短。\n\
  \n* * *\n\n![Image](img/note.jpg) 注意\n\n如今，人们会将 `WindowListener` 接口中的空方法实现为默认方法。然而，Swing\
  \ 的发明在默认方法出现很多年前。\n\n* * *\n\n\n\n\n\n同一个命令有多种激活方式是常见现象。用户可以通过菜单、按键或工具栏上的按钮来选择某个功能。在\
  \ AWT 事件模型中这很容易实现：将所有事件链接到同一个监听器。例如，假设 `blueAction` 是一个动作监听器，其 `actionPerformed`\
  \ 方法会将背景颜色更改为蓝色。你可以将同一个对象作为监听器附加到多个事件源：\n\n*   一个标记为“Blue”的工具栏按钮\n*   一个标记为“Blue”的菜单项\n\
  *   一个快捷键 Ctrl+B\n\n现在，颜色更改命令将以统一的方式处理，无论它是是由按钮点击、菜单选择还是按键触发的。\n\nSwing 包提供了一个非常有用的机制来封装命令并将其附加到多个事件源：即\
  \ `Action` 接口。一个*action*（动作）是一个封装了以下内容的对象：\n\n*   命令的描述（作为文本字符串和可选图标）；以及\n*   执行命令所需的参数（例如我们示例中请求的颜色）。\n\
  \n`Action` 接口具有以下方法：\n\n点击此处查看代码图片\n\n```java\nvoid actionPerformed(ActionEvent\
  \ event)\nvoid setEnabled(boolean b)\nboolean isEnabled()\nvoid putValue(String\
  \ key, Object value)\nObject getValue(String key)\nvoid addPropertyChangeListener(PropertyChangeListener\
  \ listener)\nvoid removePropertyChangeListener(PropertyChangeListener listener)\n\
  ```\n\n第一个方法是 `ActionListener` 接口中熟悉的方法；事实上，`Action` 接口扩展了 `ActionListener` 接口。因此，在任何需要\
  \ `ActionListener` 对象的地方你都可以使用 `Action` 对象。\n\n接下来的两个方法允许你启用或禁用动作，并检查动作当前是否启用。当动作附加到菜单或工具栏且动作被禁用时，该选项将变为灰色。\n\
  \n`putValue` 和 `getValue` 方法允许你在动作对象中存储和检索任意的键值对。两个重要的预定义字符串（`Action.NAME` 和 `Action.SMALL_ICON`）可以将动作名称和图标存储到动作对象中：\n\
  \n点击此处查看代码图片\n\n```java\naction.putValue(Action.NAME, \"Blue\");\naction.putValue(Action.SMALL_ICON,\
  \ new ImageIcon(\"blue-ball.gif\"));\n```\n\nTable 11.1 显示了预定义的动作表名称。\n\n![Image](img/11tab01.jpg)\n\
  \n**表 11.1** 预定义动作表名称\n\n如果动作对象被添加到菜单或工具栏，名称和图标将自动检索并显示在菜单项或工具栏按钮中。`SHORT_DESCRIPTION`\
  \ 值将变为工具提示（tooltip）。\n\n`Action` 接口的最后两个方法允许其他对象（特别是触发动作的菜单或工具栏）在动作对象的属性变化时接收通知。例如，如果一个菜单作为动作对象的属性变化监听器，并且随后该动作对象被禁用，则菜单会被调用并可以将动作名称置灰。属性变化监听器（Property\
  \ change listeners）是“JavaBeans”组件模型的一部分的一种通用结构。你可以在第二卷中找到更多关于 beans 及其属性的内容。\n\n\
  注意 `Action` 是一个*接口*而不是类。任何实现此接口的类都必须实现我们讨论的七个方法。幸运的是，一位热心的人提供了一个类 `AbstractAction`，它实现了除了\
  \ `actionPerformed` 之外的所有方法。该类负责存储所有的键值对并管理属性变化监听器。你只需要扩展 `AbstractAction` 并提供一个\
  \ `actionPerformed` 方法即可。\n\n让我们构建构建一个可以执行颜色更改命令的动作对象。我们存储命令的名称、图标和所需的颜色。我们将颜色存储在\
  \ `AbstractAction` 类提供的键值对表中。这里是 `ColorAction` 类的代码。构造函数设置了键值对，而 `actionPerformed`\
  \ 方法执行颜色更改动作。\n\n点击此处查看代码图片\n\n```java\npublic class ColorAction extends AbstractAction\n\
  {\n    public ColorAction(String name, Icon icon, Color c)\n    {\n      putValue(Action.NAME,\
  \ name);\n      putValue(Action.SMALL_ICON, icon);\n      putValue(\"color\", c);\n\
  \      putValue(Action.SHORT_DESCRIPTION, \"Set panel color to \" + name.toLowerCase());\n\
  \    }\n    public void actionPerformed(ActionEvent event)\n    {\n      Color c\
  \ = (Color) getValue(\"color\");\n      buttonPanel.setBackground(c);\n    }\n}\n\
  ```\n\n我们的测试程序创建了该类的三个对象，例如：\n\n点击此处查看代码图片\n\n```java\nAction blueAction = new ColorAction(\"\
  Blue\", new ImageIcon(\"blue-ball.gif\"), Color.BLUE);\n```\n\n接下来，让我们此动作与按钮关联。这很容易，因为我们可以使用接收\
  \ `Action` 对象的 `JButton` 构造函数。\n\n点击此处查看代码图片\n\n```java\nJButton blueButton = new\
  \ JButton(blueAction);\n```\n\n该构造函数从动作中读取名称和图标，将短描述设置为工具提示，并将动作设置为监听器。正如我们在下一章中演示的那样，将动作添加到菜单同样简单。\n\
  \n![Image](img/11fig06.jpg)\n\n**图 11.6** 按钮显示图标\n\n最后，我们希望将动作对象添加到按键上，以便用户输入键盘命令时触发动作。要将动作与按键关联，首先需要生成\
  \ `KeyStroke` 对象。这是一个封装键描述的便利类。要生成 `KeyStroke` 对象，不需要调用构造函数，而是使用 `KeyStroke` 类的静态方法\
  \ `getKeyStroke`。\n\n```java\nKeyStroke ctrlB = KeyStroke.getKeyStroke(\"ctrl B\"\
  );\n```\n\n为了理解下一步，你需要理解*键盘焦点*的概念。界面界面有很多按钮、菜单、滚动条和其他组件。当你按下键时，它会被发送给焦点组件。该组件通常（并非总是）会有视觉区分。例如，在\
  \ Java 外观中，焦点按钮周围有一个细矩形框。你可以使用 Tab 键在组件之间移动焦点。当按下空格键时，焦点按钮会被点击。其他键执行不同的动作；例如，箭头键可以移动滚动条。\n\
  \n然而，在我们的情况下，我们不想将按键发送给焦点组件。否则，每个按钮都需要如何处理 Ctrl+Y、Ctrl+B 和 Ctrl+R。这是一个常见问题，Swing\
  \ 设计者想出了一个方便的解决方案。每个 `JComponent` 都有三个输入映射（input maps），每个将 `KeyStroke` 对象映射到关联的动作。这三个输入映射对应三种不同的条件（参见\
  \ Table 11.2）。\n\nTable 11.2\n\n![Image](img/11tab02.jpg)\n\n**表 11.2** 输入映射条件\n\
  \n1.  `WHEN_FOCUSED`: 焦点组件的 `WHEN_FOCUSED` 映射。如果按键存在，则执行对应的动作。如果动作启用，则停止处理。\n2.\
  \  `WHEN_ANCESTOR_OF_FOCUSED_COMPONENT`: 从焦点组件开始，检查其父组件的 `WHEN_ANCESTOR_OF_FOCUSED_COMPONENT`\
  \ 映射。一旦发现带有按键的映射，立即执行对应的动作。如果动作启用，则停止处理。\n\n\n\n\n\n### 3. 在具有输入焦点的窗口中，查找在 `WHEN_IN_FOCUSED_WINDOW`\
  \ 表中注册了此按键的所有可见且启用的组件。让这些组件（按照按键注册的顺序）有机会执行相应的动作。一旦执行了第一个启用的动作，立即停止处理。如果一个按键出现在多个\
  \ `WHEN_IN_FOCUSED_WINDOW` 表中，这部分过程将会变得脆弱。\n\n要从组件中获取输入映射，请使用 `getInputMap` 方法。例如所示：\n\
  \n点击此处查看代码图片\n\n```\nInputMap imap = panel.getInputMap(JComponent.WHEN_FOCUSED);\n\
  ```\n\n`WHEN_FOCUSED` 条件意味着当当前组件拥有键盘焦点时，会查询此映射。在我们的情况下，这并不是我们想要的映射。拥有输入焦点的是其中一个按钮，而不是面板。另外两个映射选择中的任何一个都可以用于插入颜色更改按键。我们在示例程序中使用了\
  \ `WHEN_ANCESTOR_OF_FOCUSED_COMPONENT`。\n\n`InputMap` 并不会直接将 `KeyStroke` 对象映射到 `Action`\
  \ 对象。相反，它将映射到任意对象，而由 `ActionMap` 类实现的第二个映射则将这些对象映射到动作。这使得在来自不同输入映射的按键之间共享相同的动作变得更容易。\n\
  \n因此，每个组件都有三个输入映射和一个动作映射。为了将它们连接起来，你需要为这些动作命名。以下是将按键绑定到动作的方法：\n\n点击此处查看代码图片\n\n\
  ```\nimap.put(KeyStroke.getKeyStroke(\"ctrl Y\"), \"panel.yellow\");\nActionMap\
  \ amap = panel.getActionMap();\namap.put(\"panel.yellow\", yellowAction);\n```\n\
  \n通常习惯上使用字符串 `\"none\"` 作为无操作动作。这可以让你轻松地禁用一个按键：\n\n点击此处查看代码图片\n\n```\nimap.put(KeyStroke.getKeyStroke(\"\
  ctrl C\"), \"none\");\n```\n\n***\n\n![Image](img/caution.jpg) **注意**\n\nJDK 文档建议使用动作名称作为动作的键。我们认为这并不是好主意。动作名称显示在按钮和菜单项上；因此，它可以根据\
  \ UI 设计师的意愿改变，并可能翻译成多种语言。这种不稳定的字符串是查找键的糟糕选择，因此我们建议你想出独立于显示名称的名称。\n\n***\n\n总结一下，以下是响应按钮、菜单项或按键执行相同动作的步骤：\n\
  \n1.  实现一个继承自 `AbstractAction` 的类。你可能可以使用同一个类来处理多个相关的动作。\n2.  构造动作类的对象。\n3.  从动作对象构造按钮或菜单项。构造函数将从动作对象中读取标签文本和图标。\n\
  4.  对于可以通过按键触发的动作，你必须执行额外的步骤。首先，找到窗口的顶层组件，例如包含所有其他组件的面板。\n5.  然后，获取顶层组件的 `WHEN_ANCESTOR_OF_FOCUSED_COMPONENT`\
  \ 输入映射。为所需的按键创建一个 `KeyStroke` 对象。创建一个动作键对象（例如描述你的动作的字符串）。将该对（按键，动作键）添加到输入映射中。\n\
  6.  最后，获取顶层组件的动作映射。将该对（动作键，动作对象）添加到映射中。\n\n列表 11.3 显示了将按钮和按键映射到动作对象的完整代码。尝试一下——点击按钮以及按下\
  \ Ctrl+Y、Ctrl+B 或 Ctrl+R 都会改变面板颜色。\n\n**列表 11.3** `action/ActionFrame.java`\n\n\
  点击此处查看代码图片\n\n```java\n1  package action;\n2\n3  import java.awt.*;\n4  import java.awt.event.*;\n\
  5  import javax.swing.*;\n6\n7  /**\n8   * 一个带有面板的框架，用于演示颜色更改动作。\n9   */\n10 class\
  \ ActionFrame extends JFrame\n11 {\n12  private JPanel buttonPanel;\n13  private\
  \ static final int DEFAULT_WIDTH = 300;\n14  private static final int DEFAULT_HEIGHT\
  \ = 200;\n15\n16  public ActionFrame()\n17  {\n18    setSize(DEFAULT_WIDTH, DEFAULT_HEIGHT);\n\
  19    buttonPanel = new JPanel();\n20\n21    // 定义动作\n22    Action yellowAction\
  \ = new ColorAction(\"Yellow\", new ImageIcon(\"yellow-ball.gif\"), Color.YELLOW);\n\
  23    Action blueAction = new ColorAction(\"Blue\", new ImageIcon(\"blue-ball.gif\"\
  ), Color.BLUE);\n24    Action redAction = new ColorAction(\"Red\", new ImageIcon(\"\
  red-ball.gif\"), Color.RED);\n25\n26    //为这些动作添加按钮\n27    buttonPanel.add(new JButton(yellowAction));\n\
  28    buttonPanel.add(new JButton(blueAction));\n29    buttonPanel.add(new JButton(redAction));\n\
  30\n31    // 将面板添加到框架\n32    add(buttonPanel);\n33\n34    // 将 Y, B, R 键与名称关联\n\
  35    InputMap imap = buttonPanel.getInputMap(JComponent.WHEN_ANCESTOR_OF_FOCUSED_COMPONENT);\n\
  36    imap.put(KeyStroke.getKeyStroke(\"ctrl Y\"), \"panel.yellow\");\n37    imap.put(KeyStroke.getKeyStroke(\"\
  ctrl B\"), \"panel.blue\");\n38    imap.put(KeyStroke.getKeyStroke(\"ctrl R\"),\
  \ \"panel.red\");\n39\n40    // 将名称与动作关联\n41    ActionMap amap = buttonPanel.getActionMap();\n\
  42    amap.put(\"panel.yellow\", yellowAction);\n43    amap.put(\"panel.blue\",\
  \ blueAction);\n44    amap.put(\"panel.red\", redAction);\n45  }\n46\n47  class\
  \ ColorAction extends AbstractAction\n48  {\n49    /**\n50     * 构造一个颜色动作。\n51 \
  \    * @param name 显示在按钮上的名称\n52     * @param icon 显示在按钮上的图标\n53     * @param c\
  \ 背景颜色\n54     */\n55    public ColorAction(String name, Icon icon, Color c)\n56\
  \    {\n57      putValue(Action.NAME, name);\n58      putValue(Action.SMALL_ICON,\
  \ icon);\n59      putValue(Action.SHORT_DESCRIPTION, \"Set panel color to \" + name.toLowerCase());\n\
  60      putValue(\"color\", c);\n61    }\n62\n63    public void actionPerformed(ActionEvent\
  \ event)\n64    {\n65      Color c = (Color) getValue(\"color\");\n66      buttonPanel.setBackground(c);\n\
  67    }\n68  }\n69}\n```\n\n\n\n\n如果你只是想让用户能够点击按钮或菜单，不需要显式地处理鼠标事件。这些鼠标操作由用户界面中的各种组件在内部处理。然而，如果你想允许用户使用鼠标进行绘图，你就需要捕获鼠标移动、点击和拖动事件。\n\
  \n在本节中，我们将向你展示一个简单的图形编辑器应用程序，它允许用户在画布上放置、移动和擦除正方形（参见图 11.7）。\n\n![Image](img/11fig07.jpg)\n\
  \n**图 11.7** 一个鼠标测试程序\n\n当用户点击鼠标按钮时，会调用三个监听器方法：当鼠标首次按下时调用 `mousePressed`，当鼠标释放时调用\
  \ `mouseReleased`，最后调用 `mouseClicked`。如果你只对完整的点击感兴趣，可以忽略前两个方法。通过使用 `MouseEvent`\
  \ 参数上的 `getX` 和 `getY` 方法，你可以获取鼠标点击时鼠标指针的 `x` 和 `y` 坐标。要区分单击、双击和三击（!），请使用 `getClickCount`\
  \ 方法。\n\n一些用户界面设计师向用户施加鼠标点击和键盘修饰键组合，例如 `Ctrl+Shift+click`。我们认为这种做法是不可取的，但如果你不同意，你会发现检查鼠标按钮和键盘修饰键会非常混乱。\n\
  \n使用位掩码来测试设置了哪些修饰键。在原始 API 中，两个按钮掩码等于两个键盘修饰键掩码，即：\n\n```\nBUTTON2_MASK == ALT_MASK\n\
  BUTTON3_MASK == META_MASK\n```\n\n这样做是为了让单键鼠标的用户可以通过按住修饰键来模拟其他鼠标按钮。然而，从 Java SE\
  \ 1.4 开始，推荐使用不同的方法。现在有了这些掩码：\n\n```\nBUTTON1_DOWN_MASK\nBUTTON2_DOWN_MASK\nBUTTON3_DOWN_MASK\n\
  SHIFT_DOWN_MASK\nCTRL_DOWN_MASK\nALT_DOWN_MASK\nALT_GRAPH_DOWN_MASK\nMETA_DOWN_MASK\n\
  ```\n\n`getModifiersEx` 方法可以准确报告鼠标事件的鼠标按钮和键盘修饰键。\n\n请注意，在 Windows 下，`BUTTON3_DOWN_MASK`\
  \ 测试右键（非主）鼠标按钮。例如，你可以使用下面的代码来检测右鼠标键是否按下：\n\n点击此处查看代码图片\n\n```\nif ((event.getModifiersEx()\
  \ & InputEvent.BUTTON3_DOWN_MASK) != 0)\n    . . . // 右键点击的代码\n```\n\n在我们的示例程序中，我们同时提供了\
  \ `mousePressed` 和 `mouseClicked` 方法。当你点击不在任何已绘制正方形内部的像素时，会添加一个新的正方形。我们在 `mousePressed`\
  \ 方法中实现了这一点，这样用户就能接收到立即反馈，而不需要等到鼠标按钮释放。当用户在现有正方形内部双击时，正方形会被擦除。我们在 `mouseClicked`\
  \ 方法中实现了这一点，因为我们需要点击计数。\n\n点击此处查看代码图片\n\n```java\npublic void mousePressed(MouseEvent\
  \ event)\n{\n    current = find(event.getPoint());\n    if (current == null) //\
  \ 不在正方形内\n        add(event.getPoint());\n}\n\npublic void mouseClicked(MouseEvent\
  \ event)\n{\n    current = find(event.getPoint());\n    if (current != null && event.getClickCount()\
  \ >= 2)\n        remove(current);\n}\n```\n\n当鼠标在窗口上移动时，窗口会接收到持续的鼠标移动事件。注意，有独立的\
  \ `MouseListener` 和 `MouseMotionListener` 接口。这样做是为了效率——当用户移动鼠标时会产生大量的鼠标事件，而一个只关心鼠标点击的监听器就不会被不需要的鼠标移动所干扰。\n\
  \n我们的测试应用程序捕获鼠标移动事件，以便在悬停在正方形上方时将光标变为不同的形状（十字准）。这是通过 `Cursor` 类的 `getPredefinedCursor`\
  \ 方法实现的。表 11.3 列出了与此方法使用的常量，以及这些光标在 Windows 下的样子。\n\n![Image](img/11tab03.jpg)\n\
  \n**表 11.3** 示例光标形状\n\n以下是示例程序中 `MouseMotionListener` 的 `mouseMoved` 方法：\n\n点击此处查看代码图片\n\
  \n```java\npublic void mouseMoved(MouseEvent event)\n{\n    if (find(event.getPoint())\
  \ == null)\n        setCursor(Cursor.getDefaultCursor());\n    else\n        setCursor(Cursor.getPredefinedCursor(Cursor.CROSSHAIR_CURSOR));\n\
  }\n```\n\n***\n\n![Image](img/note.jpg) 注意\n\n你也可以通过使用 `Toolkit` 类中的 `createCustomCursor`\
  \ 方法定义自己的光标类型：\n\n点击此处查看代码图片\n\n```java\nToolkit tk = Toolkit.getDefaultToolkit();\n\
  Image img = tk.getImage(\"dynamite\");\nCursor dynamite = tk.createCustomCursor(img,\
  \ new Point(10, 10), \"dynamite\");\n```\n\n\n\n\n## 11.4 AWT 事件层次结构\n\n```java\n\
  private static final int DEFAULT_WIDTH = 300;\nprivate static final int DEFAULT_HEIGHT\
  \ = 200;\nprivate static final int SIDELENGTH = 10;\nprivate ArrayList<Rectangle2D>\
  \ squares;\nprivate Rectangle2D current; // the square containing the mouse cursor\n\
  \npublic MouseComponent()\n{\n    squares = new ArrayList<>();\n    current = null;\n\
  \n    addMouseListener(new MouseHandler());\n    addMouseMotionListener(new MouseMotionHandler());\n\
  }\n\npublic Dimension getPreferredSize() { return new Dimension(DEFAULT_WIDTH, DEFAULT_HEIGHT);\
  \ }\n\npublic void paintComponent(Graphics g)\n{\n    Graphics2D g2 = (Graphics2D)\
  \ g;\n\n    // draw all squares\n    for (Rectangle2D r : squares)\n        g2.draw(r);\n\
  }\n\n/**\n * Find 第一个包含该点的矩形。\n * @param p 一个点\n * @return 包含 p 的第一个矩形\n */\npublic\
  \ Rectangle2D find(Point2D p)\n{\n    for (Rectangle2D r : squares)\n    {\n   \
  \     if (r.contains(p)) return r;\n    }\n    return null;\n}\n\n/**\n * 将矩形添加到集合中。\n\
  \ * @param p 矩形的中心点\n */\npublic void add(Point2D p)\n{\n    double x = p.getX();\n\
  \    double y = p.getY();\n\n    current = new Rectangle2D.Double(x - SIDELENGTH\
  \ / 2, y - SIDELENGTH / 2, SIDELENGTH,\n        SIDELENGTH);\n    squares.add(current);\n\
  \    repaint();\n}\n\n/**\n * 从集合中移除一个矩形。\n * @param s 要移除的矩形\n */\npublic void\
  \ remove(Rectangle2D s)\n{\n    if (s == null) return;\n    if (s == current) current\
  \ = null;\n    squares.remove(s);\n    repaint();\n}\n\nprivate class MouseHandler\
  \ extends Adapter\n{\n    public void mousePressed(MouseEvent event)\n    {\n  \
  \      // 如果光标不在矩形内部，则添加一个矩形\n        current = find(event.getPoint());\n      \
  \  if (current == null) add(event.getPoint());\n    }\n\n    public void mouseClicked(MouseEvent\
  \ event)\n    {\n        // 如果双击，则移除当前矩形\n        current = find(event.getPoint());\n\
  \        if (current != null && event.getClickCount() >= 2) remove(current);\n \
  \   }\n}\n\nprivate class MouseMotionHandler implements MouseMotionListener\n{\n\
  \    public void mouseMoved(MouseEvent event)\n    {\n        // 如果在矩形内部，则将鼠标光标设置为十字准星\n\
  \        if (find(event.getPoint()) == null) setCursor(Cursor.getDefaultCursor());\n\
  \        else setCursor(Cursor.getPredefinedCursor(Cursor.CROSSHAIR_CURSOR));\n\
  \    }\n\n    public void mouseDragged(MouseEvent event)\n    {\n        if (current\
  \ != null)\n        {\n            int x = event.getX();\n            int y = event.getY();\n\
  \n            // 拖动当前矩形使其中心对齐 (x, y)\n            current.setFrame(x - SIDELENGTH\
  \ / 2, y - SIDELENGTH / 2, SIDELENGTH, SIDELENGTH);\n            repaint();\n  \
  \      }\n    }\n}\n```\n\n## 11.4 AWT 事件层次结构\n\n在让您初步了解事件处理后，我们通过对架构的概述来结束本章。`EventObject`\
  \ 类有一个子类 `AWTEvent`，它是所有事件类的父类。图 11.8 显示了 AWT 事件的继承关系。\n\n**图 11.8 AWT 类的继承图**\n\
  \n某些 AWT 事件对程序员来说没有实际用处。例如，AWT 会将 `PaintEvent` 对象插入事件队列，但这些对象并不会被传递给监听器。Java 程序员通过重写\
  \ `paintComponent` 方法来控制重绘。AWT 还会生成许多仅系统需要的事件，用于为表意语言的输入法、自动测试机器人等提供输入。我们不讨论这些特殊的事件类型。\n\
  \n### 11.4.1 语义事件与低级事件\n\nAWT 在*低级*（low-level）事件和*语义*（semantic）事件之间做了非常有用的区分。语义事件是表达用户正在做什么的事件，例如“点击那个按钮”；`ActionEvent`\
  \ 就是一个语义事件。低级事件是实现这些操作的基础。在点击按钮的情况下，这包括鼠标按下、一系列鼠标移动和鼠标抬起（但仅当鼠标抬起在按钮内部时有效）。同样，调整滚动条是一个语义事件，但拖动鼠标则是一个低级事件。\n\
  \n以下是 `java.awt.event` 包中通常用的语义事件类：\n\n-   `ActionEvent`（用于按钮点击、菜单选择、选择列表项或在文本字段中输入回车）\n\
  -   `AdjustmentEvent`（用户调整了滚动条）\n-   `ItemEvent`（用户从一组复选框或列表项中选择）\n\n常用的有五类低级事件类：\n\
  \n-   `KeyEvent`（按键被按下或释放）\n-   `MouseEvent`（鼠标按钮被按下、释放、移动或拖动）\n-   `MouseWheelEvent`（鼠标轮被旋转）\n\
  -   `FocusEvent`（组件获得焦点或丢失焦点）\n-   `WindowEvent`（窗口状态发生变化）\n\n\n\n\n\n以下接口监听这些事件：\n\
  \n- `ActionListener`\n- `AdjustmentListener`\n- `FocusListener`\n- `ItemListener`\n\
  - `KeyListener`\n- `MouseListener`\n- `MouseMotionListener`\n- `MouseWheelListener`\n\
  - `WindowListener`\n- `WindowFocusListener`\n- `WindowStateListener`\n\n若干 AWT 监听接口（即那些具有多个方法的接口）都带有一个相应的适配器类（adapter\
  \ class），该类实现了接口中的所有方法，但都不执行任何操作。（其他接口每个只有一个方法，因此为这些接口提供适配器类并没有意义。）以下是常用的适配器类：\n\
  \n- `FocusAdapter`\n- `KeyAdapter`\n- `MouseAdapter`\n- `MouseMotionAdapter`\n-\
  \ `WindowAdapter`\n\n`表 11.4` 显示了最重要的 AWT 监听接口、事件和事件源。\n\n`javax.swing.event` 包包含了\
  \ Swing 组件特有的事件。我们将在下一章中介绍其中一些。\n\n![Image](img/11tab04.jpg)![Image](img/11tab04a.jpg)\n\
  \n**表 11.4** 事件处理总结\n\n到此结束我们对 AWT 事件处理的讨论。下一章将向你展示如何组合最常用的 Swing 组件，并详细介绍它们所产生的事件。\n\
  \n# 第 12 章 使用 Swing 构建用户界面组件\n\n***\n\n在本章中\n\n• 12.1 Swing 和模型-视图-控制器设计模式\n- 12.2\
  \ 布局管理简介\n- 12.3 文本输入\n- 12.4 选择组件\n- 12.5 菜单\n- 12.6 复杂的布局管理\n- 12.7 对话框\n- 12.8\
  \ GUI 程序排错\n\n***\n\n上一章主要是为了向你展示如何使用 Java 的事件模型。在这个过程中，你迈了学习如何构建图形用户界面（GUI）的第一步。本章将向你展示构建更全功能\
  \ GUI 所需的最重要工具。\n\n我们首先介绍 Swing 的架构基础。了解“底层”发生了什么对于理解如何有效使用某些更高级的组件非常重要。然后我们将展示如何使用\
  \ Swing 中通常用的用户界面组件，如文本框、单选按钮和菜单。接下来，你将学习如何使用 Java 巧妙的布局管理器功能在窗口中排列这些组件，而取决于特定用户界面的外观（look-and-feel）。最后，你将看到如何在\
  \ Swing 中实现对话框。\n\n本章涵盖了基础 Swing 组件，如文本组件、按钮和滑块。这些是你最频繁需要的本质用户界面组件。我们将在第二卷中介绍高级\
  \ Swing 组件。\n\n## 12.1 Swing 和模型-视图-控制器设计模式\n\n正如之前所言，本章将从对 Swing 组件架构的描述开始。我们首先讨论*设计模式*（design\
  \ patterns）的概念，然后查看极大影响 Swing 框架设计的“模型-视图-控制器”模式。\n\n### 12.1.1 设计模式\n\n在解决问题时，你通常不是从原理开始推导出解决方案。相反，你可能会受到过去经验的指导，或者可能会向其他专家请教哪些方法对他们有效。设计模式是一种以结构化方式呈现这种专业知识的方法。\n\
  \n近年来，软件工程师开始编写此类模式的目录。该领域的先驱深受建筑师克里斯托弗·亚历山大（Christopher Alexander）建筑设计模式的启发。在他的著作《建筑的艺术》（The\
  \ Timeless Way of Building, Oxford University Press, 1979）中，Alexander 提供了一份设计公共和私人居住空间的模式目录。这是一个典型的例子：\n\
  \n**窗边（Window Place）**\n\n大家都喜欢窗边、凸窗以及带有低窗台并配有舒适座椅的大窗户……一个没有这种地方的房间很少让你感到舒适或完全的放松……\n\
  \n如果房间里没有作为“地方”的窗户，房间里的人会在两种力量之间产生挣扎：(1) 他想坐下来感到舒适，以及 (2) 他被光线吸引。\n\n显然，如果舒适的地方——即房间里你最想坐的地方——远离窗户，那么没有办法克服这种冲突……\n\
  \n因此：在任何你白天花费较长时间的房间里，至少让一个窗户变成一个“窗边”（图 12.1）。\n\n![Image](img/12fig01.jpg)\n\n\
  **图 12.1** 窗边\n\nAlexander 目录中的每个模式，以及软件模式目录中的模式，都遵循特定的格式。模式首先描述一个背景，即产生设计问题的情境。然后解释问题，通常表现为一组相互冲突的力量。最后，解决方案展示了一个平衡这些力量的配置。\n\
  \n在“窗边”模式中，背景是你白昼花费较长时间的房间。冲突的力量是你想坐下来感到舒适，以及你被光线吸引。解决方案是造就一个“窗边”。\n\n在“模型-视图-控制器”模式中（我们将在下一节描述），背景是一个展示信息并接收用户输入的用户界面系统。存在多种力量：需要同步更新的多个视觉表示。视觉表示可能会改变——以适应不同的外观标准。交互机制可能会改变——以支持语音命令。解决方案是将责任分配到三个独立的交互组件中：模型、视图和控制器。\n\
  \n模型-视图-控制器模式并不是 AWT 设计中唯一的模式。这里有几个额外的例子：\n\n- 容器和组件是“组合模式”（composite）的例子。\n- 滚动面板是“装饰器”（decorator）。\n\
  - 布局管理器遵循“策略模式”（strategy）。\n\n设计模式的一个重要方面是它们成为了文化的一部分。全世界的程序员在谈论模型-视图-控制器模式或装饰器模式时都能理解你的意思。因此，模式变成了设计问题的高效方式。\n\
  \n你可以在模式运动的基石著作《设计模式：面向对象软件的基础》（Design Patterns—Elements of Reusable Object-Oriented\
  \ Software, Erich Gamma 等, Addison-Wesley, 1995）中找到许多有用模式的正式描述。我们也非常推荐 Frank Buschmann\
  \ 等人的优秀著作《模式系统》（A System of Patterns, John Wiley & Sons, 1996），我们认为这本书不那么经典，但更容易易读。\n\
  \n### 12.1.2 模型-视图-控制器模式\n\n让我们退后一步，思考一下构成用户界面组件（如按钮、复选框、文本框或复杂的树控件）的部分。每个组件都有三个特征：\n\
  \n- 它的*内容*，例如按钮的状态（按下或未），或文本框中的文本\n- 它的*视觉外观*（颜色、大小等）\n- 它的*行为*（对事件的反应）\n\n即使是像按钮这样看似简单的组件，这些特征之间也表现出某种中复杂的交互。显然，按钮的视觉外观取决于外观。Metal\
  \ 按钮看起来与 Windows 或 Motif 按钮不同。此外，外观取决于按钮状态；当按钮被按下时，它需要重绘以看起来不同。状态取决于按钮接收到的事件。当用户在按钮内部按下鼠标时，按钮被按下。\n\
  \n\n\n\n当然，当你在程序中使用按钮时，你只需要将其视为一个 `button`；你不需要过多考虑它的内部工作机制和特性。毕竟，那是实现按钮的程序员需要考虑的工作。然而，实现按钮及所有其他用户界面组件的程序员，有动力对它们进行更深层次的思考，以确保无论生效的是什么外观特性（look-and-feel），它们都能良好运行。\n\
  \n为了实现这一点，Swing 的设计者转向了一种著名的设计模式：`model-view-controller`（模型-视图-控制器）模式。这种模式与其他许多设计模式一样，追溯到我们在第\
  \ 5 章中提到的对象设计原则之一：不要让一个对象承担过多的职责。不要让一个按钮类完成所有工作。相反，让组件的外观与一个对象关联，并将内容存储在`另一个`对象中。模型-视图-控制器（MVC）设计模式教会了如何实现这一点。实现三个独立的类：\n\
  \n* `model`（模型），存储内容\n* `view`（视图），显示内容\n* `controller`（控制器），处理用户输入\n\n该模式精确地规定了这三个对象如何交互。模型存储内容，且`没有用户界面`。对于按钮来说，内容非常简单——只是一小组标志位，用于指示按钮当前是按下还是弹起状态、是激活状态还是非激活状态等。对于文本字段来说，内容就稍微有趣一点。它是一个持有当前文本的字符串对象。这`并不等同`于内容的视图——如果内容大于文本字段，用户只能看到显示的部分文本（参见图\
  \ 12.2）。\n\n![Image](img/12fig02.jpg)\n\n**图 12.2** 文本字段的模型和视图\n\n模型必须实现更改内容以及发现内容是什么的方法。例如，文本模型具有这些方法，用于在当前文本中添加或删除字符，并将当前文本作为字符串返回。再次，请记住，模型是完全非视觉的。绘制模型中存储的数据是视图的工作。\n\
  \n***\n\n![Image](img/note.jpg) Note（注）\n\n“模型（model）”一词可能并不理想，因为我们经常将模型视为抽象概念的表示。汽车和飞机的设计师建立模型来模拟真实的汽车和飞机。但在思考模型-视图-控制器模式时，这种类比真的会误导你。在这一设计模式中，模型存储完整的内容，而视图提供了内容的（完整或不完整）视觉表示。一个更好的类比可能是为艺术家摆姿的模特。观察模型并创建视图取决于艺术家。根据艺术家的不同，该视图可能是正式的肖像画、印象派绘画，或是一幅显示肢体处于奇异扭曲状态的立体素描。\n\
  \n***\n\n模型-视图-控制器模式的优势之一是一个模型可以拥有多个视图，每个视图显示完整内容的不同部分或方面。例如，HTML 编辑器可以提供相同内容的两个`同时`\
  \ 视图：一个 WYSIWYG（所见即所得）视图和一个“原始标签”视图（参见图 12.3）。当模型通过其中一个视图的控制器进行更新时，它会通知所有已关联的视图关于该变化。当视图收到通知时，它们会自动刷新自身。当然，对于像按钮这样简单的用户界面组件，你不会拥有同一个模型的多个视图。\n\
  \n![Image](img/12fig03.jpg)\n\n**图 12.3** 同一个模型的两个独立视图\n\n控制器处理用户输入事件，如鼠标点击和击键。它然后决定是否将这些事件翻译为模型或视图的更改。例如，如果用户在文本框中按下字符键，控制器会调用模型的“插入字符”命令。然后模型告诉视图更新自身。视图永远不知道文本为何发生变化。但如果用户按下光标键，控制器可能会告诉视图滚动。滚动视图对底层文本没有影响，因此模型永远不知道该事件的发生。\n\
  \n图 12.4 显示了模型、视图和控制器对象之间的交互。\n\n![Image](img/12fig04.jpg)\n\n**图 12.4** 模型、视图和控制器对象之间的交互\n\
  \n作为使用 Swing 组件的程序员，你通常不需要考虑模型-视图-控制器架构。每个用户界面组件都有一个包装类（例如 `JButton` 或 `JTextField`），它存储了模型和视图。当你想要查询内容时（例如，文本字段中的文本）时，包装类会询问模型并将答案返回给你。当你想要更改视图时（例如，移动文本字段中的光标位置）时，包装类会将该请求转发给视图。然而，偶尔包装类在转发命令方面做得不够尽力。这时，你就必须要求它检索模型并直接与其进行交互。（你不需要直接与视图交互——那是外观特性代码的工作。）\n\
  \n除了这是正确的做法外，模型-视图-控制器模式对 Swing 设计者来说非常有吸引力，因为它允许他们实现可插拔的外观特性（pluggable look-and-feel）。按钮或文本字段的模型独立于外观特性——但当然，视觉表示完全依赖于用户界面。控制器也可以变化。例如，在语音控制设备中，控制器必须处理与带有鼠标的计算机完全不同的事件。通过将模型与用户界面分离，Swing\
  \ 设计者可以复用模型代码并在运行程序中切换外观特性。\n\n当然，模式仅作为指南而非宗教。没有模式适用于所有情况。例如，你可能会发现很难遵循“窗口”模式来重新安排工位。同样，Swing\
  \ 设计者发现，可插拔外观特性的现实并不总是允许模型-视图-控制器模式的完美实现。模型是容易分离的，每个用户界面组件都有模型类。但视图和控制器的职责并不总是清晰分离，而是分布在多个类中。当然，作为这些类的用户，你无需担心这些。事实上，正如我们指出的，你通常也不需要担心模型——只需使用组件包装类。\n\
  \n### 12.1.3 Swing 按钮的模型-视图-控制器分析\n\n在上一章中，你已经学会了如何使用按钮而无需担心它们的控制器、模型或视图。然而，按钮是最简单的用户界面元素，因此它们是熟悉模型-视图-控制器模式的好地方。对于更复杂的\
  \ Swing 组件，你会遇到类似的类和接口。\n\n对于大多数组件，模型类实现一个以 `Model` 结尾的接口；在这种情况下，接口被称为 `ButtonModel`。实现该接口的类可以定义各种按钮的状态。实际上，按钮并不复杂，Swing\
  \ 库包含一个单一类，名为 `DefaultButtonModel`，它实现了该接口。\n\n\n\n每个 `JButton` 对象都存储一个你可以获取的按钮模型对象（button\
  \ model）。\n\n点击此处查看代码图像\n\n```java\nJButton button = new JButton(\"Blue\");\n\n\
  ButtonModel model = button.getModel();\n```\n\n在实践中，你并不关心这些——按钮状态的细微细节只对绘制它的视图（view）感兴趣。所有重要信息——例如按钮是否启用——都可以从\
  \ `JButton` 类获取。（当然，此时 `JButton` 会会请求它的模型来获取该信息。）\n\n再次查看 `ButtonModel` 接口，看看其中缺少了什么。模型并不存储按钮的标签（label）或图标（icon）。无法通过查看模型来发现按钮表面显示了什么。（实际上，正如你将在第\
  \ 12.4.2 节 中看到的，“单选按钮”在第 660 页 中，设计的纯粹性是给程序员带来痛苦的根源。）\n\n值得注意的是，同一个模型（即 `DefaultButtonModel`）被用于推送按钮、单选按钮、复选框甚至是菜单项。当然，每种类型的按钮都有不同的视图和控制器（controllers）。在使用\
  \ Metal 看起来（look-and-feel）时，`JButton` 使用 `BasicButtonUI` 类作为视图，并使用 `ButtonUIListener`\
  \ 类作为控制器。通常，每个 Swing 组件都有一个以 `UI` 结尾的关联视图对象。但并不是所有的 Swing 组件都有对应的控制器对象。\n\n所以，在阅读了这段关于\
  \ `JButton` 内部工作机制的简短介绍后，你可能会疑惑：`JButton` 到底是什么？它简单地是一个继承自 `JComponent` 的包装类，它持有一个\
  \ `DefaultButtonModel` 对象、一些视图数据（如按钮标签和图标）以及一个负责按钮视图的 `BasicButtonUI` 对象。\n\n##\
  \ 12.2 布局管理简介\n\n在我们继续讨论单个 Swing 组件（如文本字段和单选按钮）之前，我们简要介绍如何在框架（frame）内部排列这些组件。与 Visual\
  \ Basic 不同，JDK 没有内置表单设计器。你需要编写代码来将用户界面组件定位（布局）在你希望它们所在的位置。\n\n当然，如果你有一个支持 Java 的开发环境，它可能会有一个布局工具来自动完成这些部分或全部任务。尽管如此，确切了解“内部”发生了什么是非常重要的，因为即使是这些工具通常也需要手动微调。\n\
  \n让我们从回顾第 11 章中用于按钮更改框架背景颜色的程序开始（参见图 12.5）。\n\n![Image](img/12fig05.jpg)\n\n**图\
  \ 12.5** 带有三个按钮的面板\n\n按钮包含在一个 `JPanel` 对象中，并由流式布局管理器（flow layout manager）管理，这是面板的默认布局管理器。图\
  \ 12.6 显示了当向面板中添加更多按钮时发生的情况。正如你所看到的，当没有更多空间时，会开启新的一行。\n\n![Image](img/12fig06.jpg)\n\
  \n**图 12.6** 由流式布局管理的带有六个按钮的面板\n\n此外，按钮在面板中居中，即使使用户缩放框架也是如此（参见图 12.7）。\n\n![Image](img/12fig07.jpg)\n\
  \n**图 12.7** 更改面板大小会自动重新排列按钮。\n\n通常，组件被放置在容器（containers）内部，由布局管理器决定组件在容器中的位置和大小。\n\
  \n按钮、文本字段和其他用户界面元素继承 `Component` 类。组件可以放置在容器（如面板）中。容器本身可以放在其他容器中，因此 `Container`\
  \ 类继承自 `Component`。图 12.8 显示了 `Component` 的继承层级。\n\n![Image](img/12fig08.jpg)\n\n\
  **图 12.8** `Component` 类的继承层级\n\n***\n\n![Image](img/note.jpg) 注意\n\n遗憾的是，继承层级在两个方面有些不洁。首先，顶层窗口（如\
  \ `JFrame`）是 `Container` 的子类，因此也是 `Component` 的子类，但它们不能被放在其他容器内部。此外，`JComponent`\
  \ 是 `Container` 的子类而不是 `Component`。因此，可以将其他组件添加到 `JButton` 中。（但这些组件将不会显示。）\n\n***\n\
  \n每个容器都有一个默认布局管理器，但你始终可以设置自己的。例如，该语句\n\n点击此处查看代码图像\n\n```java\npanel.setLayout(new\
  \ GridLayout(4, 4));\n```\n\n它使用 `GridLayout` 类将组件布局为四行四列。当你向容器中添加组件时，容器的 `add`\
  \ 方法会将组件和任何放置方向传递给布局管理器。\n\n***\n\n`java.awt.Container` **1.0**\n\n- `void setLayout(LayoutManager\
  \ m)`\n\n设置此容器的布局管理器。\n- `Component add(Component c)`\n\n将组件添加到容器中。\n- `Component\
  \ add(Component c, Object constraints)`\n\n将组件添加到容器中并返回组件。\n\n![Image](img/6401)\n\
  \n***\n\n`java.awt.FlowLayout` **1.0**\n\n- `FlowLayout()`\n\n创建一个新的流式布局。\n- `FlowLayout(int\
  \ align)`\n\n创建一个指定对齐方式的流式布局。\n- `FlowLayout(int align, int hgap, int vgap)`\n\n\
  创建一个指定对齐方式、水平间隙和垂直间隙的流式布局。\n\n![Image](img/6401)\n\n***\n\n### 12.2.1 边界布局 (Border\
  \ Layout)\n\n边界布局管理器是每个 `JFrame` 的默认布局管理器。与完全控制组件位置的流式布局不同，边界布局让你选择放置组件的位置。你可以选择将组件放置在内容区的中心、北、南、东或西（参见图\
  \ 12.9）。\n\n![Image](img/12fig09.jpg)\n\n**图 12.9** 边界布局\n\n例如：\n\n点击此处查看代码图像\n\n\
  ```java\nframe.add(yellowButton, BorderLayout.SOUTH);\n```\n\n边缘组件首先，剩余的可用空间由中心组件占据。当容器调整大同时，边缘组件的尺寸不变，但中心组件会改变大小。通过指定\
  \ `BorderLayout` 类的 `CENTER`、`NORTH`、`SOUTH`、`EAST` 或 `WEST` 来添加组件。并不是所有位置都需要占据。如果不提供任何值，假设为\
  \ `CENTER`。\n\n***\n\n![Image](img/note.jpg) 注意\n\n`BorderLayout` 常量定义为字符串。例如，`BorderLayout.SOUTH`\
  \ 定义为字符串 `\"South\"`。这比使用字符串更安全。如果你误写字符串，例如 `frame.add(component, \"south\")`，编译器不会捕捉该错误。\n\
  \n***\n\n与流式布局不同，边界布局放大所有组件以填充可用空间。（流式布局让每个组件保持其首选大小。）当你添加按钮时这就是问题：\n\n点击此处查看代码图像\n\
  \n```java\nframe.add(yellowButton, BorderLayout.SOUTH);\n```\n\n图 12.10 显示了当你使用上述代码段时发生的情况。按钮已经增长到填充框架的整个南部区域。而且，如果你向南部区域添加另一个按钮，它将取代第一个按钮。\n\
  \n![Image](img/12fig10.jpg)\n\n**图 12.10** 由边界布局管理的单体按钮\n\n为了解决这个问题，请使用额外的面板。例如，查看图\
  \ 12.11。屏幕底部的三个按钮都在一个面板中。该面板被放在内容区的南部区域。\n\n![Image](img/12fig11.jpg)\n\n**图 12.11**\
  \ 放置在框架南部区域的面板**\n\n\n\n要实现此配置，首先创建一个新的 `JPanel` 对象，然后将各个按钮添加到面板中。面板的默认布局管理器是 `FlowLayout`，这对于这种情况来说是一个很好的选择。使用你之前见过的\
  \ `add` 方法将各个按钮添加到面板中。按钮的位置和大小由 `FlowLayout` 管理器控制。这意味着按钮保持在面板内居中，不会扩展以填充整个面板区域。最后，将面板添加到框架的内容窗格中。\n\
  \n点击此处查看代码图像\n\n```java\nJPanel panel = new JPanel();\npanel.add(yellowButton);\n\
  panel.add(blueButton);\npanel.add(redButton);\nframe.add(panel, BorderLayout.SOUTH);\n\
  ```\n\n边框布局（border layout）扩展了面板的大小以填充整个南部区域。\n\n* *\n\njava.awt.BorderLayout **1.0**\n\
  \n- `BorderLayout()`\n- `BorderLayout(int hgap, int vgap)`\n\n构造一个新的 `BorderLayout`。\n\
  \n![Image](img/644tab01.jpg)\n\n* *\n\n### 12.2.2 Grid Layout\n\n网格布局像电子表格一样按行和列排列所有组件。所有组件具有相同的大小。图\
  \ 12.12 中的计算器程序使用网格布局来排列计算器按钮。当你调整窗口大时，按钮会增大或缩小，但所有按钮的大小完全相同。\n\n![Image](img/12fig12.jpg)\n\
  \n**图 12.12** 计算器\n\n在网格布局对象的构造函数中，你可以指定所需的行和列。\n\n点击此处查看代码图像\n\n```java\npanel.setLayout(new\
  \ GridLayout(4, 4));\n```\n\n添加组件，从第一行的第一个项目开始，然后是第一行的第二个项目，依此类推。\n\n```java\npanel.add(new\
  \ JButton(\"1\"));\npanel.add(new JButton(\"2\"));\n```\n\nListing 12.1 显示了计算器程序的面板类。这是一个普通的计算器，而不是在\
  \ Java 教程中异常流行的那种“逆波兰表达式”类型。在这个程序中，我们在将组件添加到框架后调用 `pack` 方法。该方法使用所有组件的首选尺寸（preferred\
  \ sizes）来计算框架的宽度和高度。\n\n当然，很少有应用程序像计算器界面那样具有严格的布局。在实践中，小型网格（通常只有一行或一列）可以用于组织窗口的局部区域。例如，如果你想有一行大小相同的按钮，可以将按钮放在一个由单行网格布局控制的面板内部。\n\
  \n**Listing 12.1** `calculator/CalculatorPanel.java`\n\n点击此处查看代码图像\n\n* *\n\n```java\n\
  package calculator;\n\nimport java.awt.*;\nimport java.awt.event.*;\nimport javax.swing.*;\n\
  \n/**\n * 带有带有计算器按钮和结果显示器的面板。\n */\npublic class CalculatorPanel extends JPanel\n\
  {\n    private JButton display;\n    private JPanel panel;\n    private double result;\n\
  \    private String lastCommand;\n    private boolean start;\n\n    public CalculatorPanel()\n\
  \    {\n        setLayout(new BorderLayout());\n\n        result = 0;\n        lastCommand\
  \ = \"=\";\n        start = true;\n\n        // 添加显示器\n        display = new JButton(\"\
  0\");\n        display.setEnabled(false);\n        add(display, BorderLayout.NORTH);\n\
  \n        ActionListener insert = new InsertAction();\n        ActionListener command\
  \ = new CommandAction();\n        // 在 4x4 网格中添加按钮\n        panel = new JPanel();\n\
  \        panel.setLayout(new GridLayout(4, 4));\n\n        addButton(\"7\", insert);\n\
  \        addButton(\"8\", insert);\n        addButton(\"9\", insert);\n        addButton(\"\
  /\", command);\n\n        addButton(\"4\", insert);\n        addButton(\"5\", insert);\n\
  \        addButton(\"6\", insert);\n        addButton(\"*\", command);\n\n     \
  \   addButton(\"1\", insert);\n        addButton(\"2\", insert);\n        addButton(\"\
  3\", insert);\n        addButton(\"-\", command);\n\n        addButton(\"0\", insert);\n\
  \        addButton(\".\", insert);\n        addButton(\"=\", command);\n       \
  \ addButton(\"+\", command);\n        add(panel, BorderLayout.CENTER);\n    }\n\n\
  \    /**\n     * 将按钮添加到中心面板。\n     * @param label 按钮\n     * @param listener 按钮监听器\n\
  \     */\n    private void addButton(String label, ActionListener listener)\n  \
  \  {\n        JButton button = new JButton(label);\n        button.addActionListener(listener);\n\
  \        panel.add(button);\n    }\n\n    /**\n     * 此操作将按钮字符串插入到文本末尾。\n     */\n\
  \    private class InsertAction implements ActionListener\n    {\n        public\
  \ void actionPerformed(ActionEvent event)\n        {\n            String input =\
  \ event.getActionCommand();\n            if (start)\n            {\n           \
  \     display.setText(\"\");\n                start = false;\n            }\n  \
  \          display.setText(display.getText() + input);\n        }\n    }\n\n   \
  \ /**\n     * 此操作执行按钮动作表示的命令。\n     */\n    private class CommandAction implements\
  \ ActionListener\n    {\n        public void actionPerformed(ActionEvent event)\n\
  \        {\n            String command = event.getActionCommand();\n\n         \
  \   if (start)\n            {\n                if (command.equals(\"-\"))\n    \
  \            {\n                    display.setText(command);\n                \
  \    start = false;\n                }\n                else lastCommand = command;\n\
  \            }\n            else\n            {\n                calculate(Double.parseDouble(display.getText()));\n\
  \                lastCommand = command;\n                start = true;\n       \
  \     }\n        }\n    }\n\n    /**\n     * 执行待处理计算。\n     * @param x 要与先前结果累加的值。\n\
  \     */\n    public void calculate(double x)\n    {\n        if (lastCommand.equals(\"\
  +\")) result += x;\n        else if (lastCommand.equals(\"-\")) result -= x;\n \
  \       else if (lastCommand.equals(\"*\")) result *= x;\n        else if (lastCommand.equals(\"\
  /\")) result /= x;\n        else if (lastCommand.equals(\"=\")) result = x;\n  \
  \      display.setText(\"\" + result);\n    }\n}\n```\n\n\n\n\n\n- `boolean isEditable()`\n\
  - `void setEditable(boolean b)`\n\n获取或设置 `editable` 属性，该属性决定用户是否可以编辑此文本组件的内容。\n\n\
  ***\n\n## 12.3.1 文本字段 (Text Fields)\n\n向窗口添加文本字段的常用方法是将其添加到面板或其他容器中——就像添加按钮一样：\n\
  \n点击此处查看代码图片\n\n```java\nJPanel panel = new JPanel();\nJTextField textField = new\
  \ JTextField(\"Default input\", 20);\npanel.add(textField);\n```\n\n这段代码添加了一个文本字段，并通过通过在其中放置\
  \ `\"Default input\"` 字符串来对其初始化。该构造函数的第二个参数设置了宽度。在这种情况下，宽度为 20 个“列”。遗憾的是，列是一个相当不精确的测量单位。一列是你正在用于文本的字体中一个字符的预期宽度。其想法是，如果你预计输入的内容少于或等于\
  \ `n` 个字符，应该指定 `n` 为列宽。在实践中，这种测量效果并不理想，为了保险起见，你应该在最大输入长度上增加 1 或 2。此外，请记住，列数只是给 AWT\
  \ 的一个提示，用于提供 `preferred` 优先级大小。如果布局管理器需要增大或缩小文本字段，它可以调整其尺寸。你在 `JTextField` 构造函数中设置的宽并不是用户可以输入的字符数量的上限。用户仍然可以输入更长的字符串，但当文本超过字段长度时，输入会滚动。用户往往会发现滚动文本字段令人恼恼，因此你应该给字段的尺寸留得宽裕一些。如果你需要在运行时重置列数，可以使用\
  \ `setColumns` 方法。\n\n***\n\n![Image](img/tip.jpg) 提示\n\n在使用 `setColumns` 方法更改文本框的大小后，调用周围容器的\
  \ `revalidate` 方法。\n\n```java\ntextField.setColumns(10);\npanel.revalidate();\n\
  ```\n\n`revalidate` 方法会重新计算容器内所有组件的大小和布局。在你使用 `revalidate` 方法之后，布局管理器会重新调整容器的大小，文本字段改变后的尺寸将变得是可见的。\n\
  \n`revalidate` 方法属于 `JComponent` 类。它不会立即调整组件的大小，而将其标记为需要调整大小。这种方法避免了当多个组件请求调整大时的重复计算。然而，如果你想重新计算\
  \ `JFrame` 内部的所有组件，你必须调用 `validate` 方法——`JFrame` 并没有继承 `JComponent`。\n\n***\n\n\
  通常情况下，用户在文本字段中输入文本（或编辑现有文本）。这些文本字段通常是空白的。要创建一个空白的文本字段，只需省略作为 `JTextField` 构造函数的字符串参数即可：\n\
  \n点击此处查看代码图片\n\n```java\nJTextField textField = new JTextField(20);\n```\n\n你可以通过使用上一节中提到的父类\
  \ `JTextComponent` 的 `setText` 方法随时更改文本字段的内容。例如：\n\n```java\ntextField.setText(\"\
  Hello!\");\n```\n\n而且，正如上一节中提到的，你可以通过调用 `getText` 方法来获取用户输入了什么。该方法返回用户输入的精确文本。要修剪文本字段数据中任何多余的前导和尾空格，对\
  \ `getText` 的返回值应用 `trim` 方法：\n\n点击此处查看代码图片\n\n```java\nString text = textField.getText().trim();\n\
  ```\n\n要更改用户文本显示的字体，请使用 `setFont` 方法。\n\n***\n\n#### javax.swing.JTextField **1.2**\n\
  \n- `JTextField(int cols)`\n构造一个具有指定列数的空 `JTextField`。\n- `JTextField(String text,\
  \ int cols)`\n构造一个具有初始字符串和指定列数的新 `JTextField`。\n- `int getColumns()`\n- `void setColumns(int\
  \ cols)`\n获取或设置此文本字段应该使用的列数。\n\n***\n\n***\n\n#### javax.swing.JComponent **1.2**\n\
  \n- `void revalidate()`\n导致组件的位置和大小被重新计算。\n- `void setFont(Font f)`\n设置此组件的字体。\n\
  \n***\n\n***\n\n#### java.awt.Component **1.0**\n\n- `void validate()`\n重新计算组件的位置和大小。如果该组件是一个容器，则其内部组件的位置和大小也将重新计算。\n\
  - `Font getFont()`\n获取此组件的字体。\n\n***\n\n### 12.3.2 标签与标签标记 (Labels and Labeling\
  \ Components)\n\n标签是持有文本的组件。它们没有装饰（例如，没有边框）。它们对用户输入没有反应。你可以使用标签来标识组件。例如，与按钮不同，文本字段没有标签来标识它们。要为一个本身不带标识符的组件标记：\n\
  \n1. 构建一个具有正确文本的 `JLabel` 组件。\n2. 将其放置在想要标识的组件足够近的位置，以便用户可以看到该标签标识的是正确的组件。\n\n`JLabel`\
  \ 的构造函数允许你指定初始文本或图标，以及可选的内容的对齐方式。你使用来自 `SwingConstants` 的常量来指定对齐方式。该接口定义了一些有用的常量，如\
  \ `LEFT`、`RIGHT`、`CENTER`、`NORTH`、`EAST` 等。`JLabel` 类是实现此接口的多个类之一。因此，你可以通过如下方式指定右对齐的标签：\n\
  \n点击此处查看代码图片\n\n```java\nJLabel label = new JLabel(\"User name: \", SwingConstants.RIGHT);\n\
  ```\n\n或者\n\n点击此处查看代码图片\n\n```java\nJLabel label = new JLabel(\"User name: \", JLabel.RIGHT);\n\
  ```\n\n`setText` 和 `setIcon` 方法允许你在运行时设置标签的文本和图标。\n\n***\n\n![Image](img/tip.jpg)\
  \ 提示\n\n你可以在按钮、标签和菜单项中使用纯文本和 HTML 文本。我们不建议在按钮中使用 HTML——它会干扰外观和感觉（look-and-feel）。但在标签中使用\
  \ HTML 可能会非常有效。只需将标签字符串用 `<html></html>` 包围起来，如下所示：\n\n点击此处查看代码图片\n\n```java\nlabel\
  \ = new JLabel(\"<html>Required entry:</html>\");\n```\n\n注意，第一个带有 HTML 的标签可能需要一些时间显示，因为必须加载复杂的\
  \ HTML 渲染代码。\n\n***\n\n标签可以像其他组件一样位于容器内部。这意味着你可以使用见过的技术将标签放置在需要的地方。\n\n***\n\n####\
  \ javax.swing.JLabel **1.2**\n\n- `JLabel(String text)`\n- `JLabel(Icon icon)`\n\
  - `JLabel(String text, int align)`\n- `JLabel(String text, Icon icon, int align)`\n\
  构造一个标签。\n\n![Image](img/652tab01.jpg)\n\n- `String getText()`\n- `void setText(String\
  \ text)`\n获取或设置此标签的文本。\n- `Icon getIcon()`\n- `void setIcon(Icon icon)`\n获取或设置此标签的图标。\n\
  \n***\n\n### 12.3.3 密码字段 (Password Fields)\n\n密码字段是一种特殊的文本字段。为了防止旁看到密码，用户输入的字符不会被实际显示。相反，每个输入的字符由一个显示字符表示，通常是星号（`*`）。Swing\
  \ 提供了一个实现此类文本字段的 `JPasswordField` 类。\n\n密码字段是模型-视图控制器架构模式的另一个例子。密码字段使用与文本字段相同的模型来存储数据，但其视图已更改为显示所有字符作为显示字符。\n\
  \n***\n\n#### javax.swing.JPasswordField **1.2**\n\n- `JPasswordField(String text,\
  \ int columns)`\n构造一个新的密码字段。\n- `void setEchoChar(char echo)`\n设置此密码字段的显示字符。这是建议性的；特定的外观和感觉可能会坚持使用它选择的显示字符。值\
  \ `0` 会重置显示字符为默认值。\n- `char[] getPassword()`\n\n\n\n\n返回此密码字段中包含的文本。为了更高的安全性，您应该在使用后覆盖返回的数组的内容。（密码不会以\
  \ `String` 形式返回，因为字符串将一直留在虚拟机中直到被垃圾回收。）\n\n### 12.3.4 文本区域 (Text Areas)\n\n有时，你需要收集超过一行的用户输入。如前所述，你可以使用\
  \ `JTextArea` 组件来实现此目的。当你程序中放置一个文本区域组件时，用户可以输入任意行的文本，使用 Enter 键将它们分隔。每行都以 `'\\n'`\
  \ 结束。图 12.13 显示了一个正在工作中的文本区域。\n\n![Image](img/12fig13.jpg)\n\n**图 12.13** 文本组件\n\
  \n在 `JTextArea` 组件的构造函数中，指定文本区域的行数和列数。例如，\n\n点击此处查看代码图片\n\n```\ntextArea = new JTextArea(8,\
  \ 40); // 8 行，每行 40 列\n```\n\n其中 `columns` 参数的作用与之前一样——为了安全起见，你仍然需要多添加几列。同样，与之前一样，用户并不限于行数和列数；当用户输入内容过多时，文本会自动滚动。你还可以使用\
  \ `setColumns` 方法更改列数，并使用 `setRows` 方法更改行数。这些数字仅表示首选尺寸——布局管理器仍然可以放大或缩小文本区域。\n\n\
  如果文本多于文本区域能够显示的范围，剩余文本将简单地被截裁（clipped）。你可以通过开启自动换行来避免长行被截裁：\n\n点击此处查看代码图片\n\n```\n\
  textArea.setLineWrap(true); // 长行将换行\n```\n\n这种换行仅是一种视觉效果；文档中的文本不会发生改变——不会在文本中自动插入\
  \ `'\\n'` 字符。\n\n### 12.3.5 滚动面板 (Scroll Panes)\n\n在 Swing 中，文本区域不带滚动条。如果你需要滚动条，必须将文本区域放置在滚动面板内部。\n\
  \n点击此处查看代码图片\n\n```\ntextArea = new JTextArea(8, 40);\nJScrollPane scrollPane =\
  \ new JScrollPane(textArea);\n```\n\n滚动面板现在管理文本区域的视图。如果文本多于文本区域能够显示的范围，滚动条会自动出现；当文本被删除且剩余文本适合区域内时，滚动条会再次消失。滚动由滚动面板内部处理——你的程序不需要处理滚动事件。\n\
  \n这是一个适用于任何组件的通用机制，而不仅仅是文本区域。要为组件添加滚动条，请将其放在滚动面板内部。\n\n列表 12.2 展示了各种文本组件。该程序显示了一个文本字段、一个密码字段和一个带滚动条的文本区域。文本字段和密码字段都标有标签。点击“插入（Insert）”可以将字段内容插入到文本区域中。\n\
  \n![Image](img/note.jpg) 事项\n\n`JTextArea` 组件仅显示纯文本，没有特殊字体或格式。要显示格式化后的文本（如 HTML），你可以使用卷二中讨论的\
  \ `JEditorPane` 类。\n\n**列表 12.2** `text/TextComponentFrame.java`\n\n点击此处查看代码图片\n\
  \n```java\npackage text;\n\nimport java.awt.BorderLayout;\nimport java.awt.GridLayout;\n\
  \nimport javax.swing.JButton;\nimport javax.swing.JFrame;\nimport javax.swing.JLabel;\n\
  import javax.swing.JPanel;\nimport javax.swing.JPasswordField;\nimport javax.swing.JScrollPane;\n\
  import javax.swing.JTextArea;\nimport javax.swing.JTextField;\nimport javax.swing.SwingConstants;\n\
  \n/**\n * 带有示例文本组件的框架。\n */\npublic class TextComponentFrame extends JFrame\n{\n\
  \    public static final int TEXTAREA_ROWS = 8;\n    public static final int TEXTAREA_COLUMNS\
  \ = 20;\n\n    public TextComponentFrame()\n    {\n        JTextField textField\
  \ = new JTextField();\n      JPasswordField passwordField = new JPasswordField();\n\
  \n        JPanel northPanel = new JPanel();\n        northPanel.setLayout(new GridLayout(2,\
  \ 2));\n        northPanel.add(new JLabel(\"User name: \", SwingConstants.RIGHT));\n\
  \        northPanel.add(textField);\n        northPanel.add(new JLabel(\"Password:\
  \ \", SwingConstants.RIGHT));\n        northPanel.add(passwordField);\n\n      add(northPanel,\
  \ BorderLayout.NORTH);\n\n      JTextArea textArea = new JTextArea(TEXTAREA_ROWS,\
  \ TEXTAREA_COLUMNS);\n      JScrollPane scrollPane = new JScrollPane(textArea);\n\
  \      add(scrollPane, BorderLayout.CENTER);\n\n      // 添加按钮将文本追加到区域\n      JPanel\
  \ southPanel = new JPanel();\n\n      JButton insertButton = new JButton(\"Insert\"\
  );\n      southPanel.add(insertButton);\n      insertButton.addActionListener(event\
  \ ->\n        textArea.append(\"User name: \" + textField.getText() + \" Password:\
  \ \"\n        + new String(passwordField.getPassword()) + \"\\n\"));\n\n      add(southPanel,\
  \ BorderLayout.SOUTH);\n      pack();\n    }\n}\n```\n\n`javax.swing.JTextArea`\n\
  - `JTextArea()`\n- `JTextArea(int rows, int cols)`\n- `JTextArea(String text, int\
  \ rows, int cols)`构造一个文本区域。\n- `void setColumns(int cols)`告诉文本区域首选的列数。\n- `void\
  \ setRows(int rows)`告诉文本区域首选的行数。\n- `void append(String newText)`将指定的文本追加到文本区域末尾。\n\
  - `void setLineWrap(boolean wrap)`开启或关闭换行。\n- `void setStyleWord(boolean word)`如果`word`为`true`，则在单词边界换行。如果为`false`，则不考虑单词边界换行。\n\
  - `void setTabSize(int c)`每`c` 列设置制表符。注意制表符不会转换为空格，而是与下一个制表位对齐。\n\n`javax.swing.JScrollPane`\n\
  - `JScrollPane(Component c)`创建一个显示组件内容的滚动面板。当组件大于视图时提供滚动条。\n\n## 12.4 选择组件\n\n你现在已经知道如何收集文本输入，但在许多情况下，你更愿意给用户提供有限的选择，而不是让他们在文本组件中输入数据。使用按钮组或项目列表可以告诉用户有哪些选择。（这还为你节省了错误检查的麻烦。）在本节中，你将学习如何复选框、单选按钮、列表和滑动块。\n\
  \n### 12.4.1 复选框 (Checkboxes)\n\n如果你只想收集“是”或“否”输入，请使用复选框组件。复选框带有标识它们的标签。用户可以通过点击框内部来勾选，通过再次点击框内部来取消勾选。当焦点在复选框上时，按下空格键也可以切换勾选状态。\n\
  \n图 12.14 显示了一个带有两个复选框的简单程序，一个用于开启或关闭字体的斜体属性，另一个用于加粗。注意第二个复选框具有焦点，标签周围的矩形所示。每当用户点击一个复选框时，屏幕都会刷新并使用新的字体属性。\n\
  \n**图 12.14** 复选框\n\n复选框旁边需要一个标签来标识其用途。在构造函数中给出标签文本：\n\n```\nbold = new JCheckBox(\"\
  Bold\");\n```\n\n使用 `setSelected` 方法开启或关闭复选框。例如：\n\n```\nbold.setSelected(true);\n\
  ```\n\n使用 `isSelected` 方法获取每个复选框的当前状态。未勾选则为`false`，勾选则为`true`。\n\n\n\n\n当用户点击复选框时，会触发一个动作事件。像往常一样，你为复选框附加一个动作监听器。在我们的程序中，这两个复选框共享同一个动作监听器。\n\
  \n点击此处查看代码图片\n\n```\nActionListener listener = . . .\n\nbold.addActionListener(listener);\n\
  \nitalic.addActionListener(listener);\n```\n\n监听器查询 `bold` 和 `italic` 复选框的状态，并将面板的字体设置为普通、粗体、斜体或粗体加斜体结合。\n\
  \n点击此处查看代码图片\n\n```java\nActionListener listener = event -> {\n    int mode = 0;\n\
  \    if (bold.isSelected()) mode += Font.BOLD;\n    if (italic.isSelected()) mode\
  \ += Font.ITALIC;\n    label.setFont(new Font(Font.SERIF, mode, FONTSIZE));\n};\n\
  ```\n\nListing 12.3 是复选框示例的程序列表。\n\n**Listing 12.3** `checkBox/CheckBoxFrame.java`\n\
  \n点击此处查看代码图片\n\n* *\n\n```java\n1   package checkBox;\n2\n3   import java.awt.*;\n\
  4   import java.awt.event.*;\n5   import javax.swing.*;\n6\n7   /**\n8    * 一个带有示例文本标签和用于选择字体\n\
  9    * 属性的复选框的框架。\n10    */\n11   public class CheckBoxFrame extends JFrame\n12\
  \   {\n13       private JLabel label;\n14       private JCheckBox bold;\n15    \
  \   private JCheckBox italic;\n16       private static final int FONTSIZE = 24;\n\
  17\n18       public CheckBoxFrame()\n19       {\n20          // 添加示例文本标签\n21\n22\
  \          label = new JLabel(\"The quick brown fox jumps over the lazy dog.\");\n\
  23          label.setFont(new Font(\"Serif\", Font.BOLD, FONTSIZE));\n24       \
  \   add(label, BorderLayout.CENTER);\n25\n26          // 此监听器将标签的字体属性\n27      \
  \    // 设置为复选框的状态\n28\n29          ActionListener listener = event -> {\n30    \
  \          int mode = 0;\n31              if (bold.isSelected()) mode += Font.BOLD;\n\
  32              if (italic.isSelected()) mode += Font.ITALIC;\n33              label.setFont(new\
  \ Font(\"Serif\", mode, FONTSIZE));\n34          };\n35\n36          // 添加复选框\n\
  37\n38          JPanel buttonPanel = new JPanel();\n39\n40          bold = new JCheckBox(\"\
  Bold\");\n41          bold.addActionListener(listener);\n42          bold.setSelected(true);\n\
  43          buttonPanel.add(bold);\n44\n45          italic = new JCheckBox(\"Italic\"\
  );\n46          italic.addActionListener(listener);\n47          buttonPanel.add(italic);\n\
  48\n49          add(buttonPanel, BorderLayout.SOUTH);\n50          pack();\n51 \
  \      }\n52   }\n```\n\n* *\n\n`javax.swing.JCheckBox`\n- `JCheckBox(String label)`\n\
  - `JCheckBox(String label, Icon)` 构建一个初始为未选的复选框。\n- `JCheckBox(String label, boolean\
  \ state)` 构建一个具有给定标签和初始状态的复选框。\n- `boolean isSelected()`\n- `void setSelected(boolean\
  \ state)` 获取或设置复选框的选择状态。\n\n* *\n\n### 12.4.2 单选按钮\n\n在上一个示例中，用户可以勾选两个复选框中的一个、两个或都不选。在许多情况下，我们希望用户只选择几个框中的一个。当另一个框被勾选时，之前的框会自动取消勾选。这样一组框通常被称为单选按钮组，因为这些按钮的工作方式类似于收音机选择器。当你按下一个按钮时，被按下的按钮会弹出。图\
  \ 12.15 显示了一个典型的例子。我们允许用户从选项（小、中、大）中选择字体大小——但当然，我们一次只允许选择一种大小。\n\n![Image](img/12fig15.jpg)\n\
  **图 12.15** 单选按钮组\n\n在 Swing 中实现单选按钮组非常简单。对于每组按钮构造一个 `ButtonGroup` 对象。然后，将 `JRadioButton`\
  \ 类型的对象添加到按钮组中。按钮组对象负责在点击新按钮时关闭之前设置的按钮。\n\n点击此处查看代码图片\n\n```java\nButtonGroup group\
  \ = new ButtonGroup();\nJRadioButton smallButton = new JRadioButton(\"Small\", false);\n\
  group.add(smallButton);\nJRadioButton mediumButton = new JRadioButton(\"Medium\"\
  , true);\ngroup.add(mediumButton);\n```\n\n构造函数的第二个参数对于应该被选中的按钮为 `true`，对于所有其他按钮为\
  \ `false`。请注意，按钮组只控制按钮的行为；如果你是为了布局目的而对按钮进行分组，你还需要将它们添加到如 `JPanel` 等容器中。\n\n如果你再次查看图\
  \ 12.14 和 12.15，你会注意到单选按钮的外观与复选框不同。复选框是正方形的，在选中时包含一个选中标记。单选按钮是圆形的，在选中时包含一个圆点。\n\n\
  单选按钮的事件通知机制与任何其他按钮相同。当用户勾选单选按钮时，该按钮产生一个动作事件。在我们的示例程序中，我们定义了一个动作监听器，将字体大小设置为特定值：\n\
  \n点击此处查看代码图片\n\n```java\nActionListener listener = event ->\n    label.setFont(new\
  \ Font(\"Serif\", Font.PLAIN, size));\n```\n\n将此监听器设置与复选框示例进行比较。每个单选按钮都有一个不同的监听器。每个监听器确切知道需要做什么——将字体大小设置为特定值。在复选框中，我们使用了不同的方法：同一个监听器如下\n\
  \n```java\nif (smallButton.isSelected()) size = 8;\nelse if (mediumButton.isSelected())\
  \ size = 12;\n```\n\n然而，我们更倾向于使用独立的动作监听器对象，因为它们将值与按钮绑定得更紧密。\n\n* *\n\n![Image](img/note.jpg)\n\
  **注意** 如果你有一组单选按钮，你已知其中只有一个被选中了。如果能快速查出是哪一个而无需查询组中的所有按钮就好了。`ButtonGroup` 对象控制所有按钮，因此如果该对象能提供被选中按钮的引用将非常方便。事实上，它返回的是附加到按钮的\
  \ `ButtonModel` 引用。遗憾的是，`ButtonModel` 的方法没有很好用。`ButtonModel` 接口继承了 `ItemSelectable`\
  \ 接口的 `getSelectedObjects` 方法，它毫无用处地返回 `null`。`getActionCommand` 方法很有前景，因为单选按钮的“动作命令”是它的文本标签。但模型的动作命令是\
  \ `null`。只有当你使用 `setActionCommand` 方法显式设置所有单选按钮的动作命令时，模型的动作命令值也会被设置。然后你可以通过 `buttonGroup.getSelection().getActionCommand()`\
  \ 获取当前选中按钮的动作命令。\n\n* *\n\nListing 12.4 是用于字体大小选择的让一组单选按钮工作的完整程序。\n\n**Listing 12.4**\
  \ `radioButton/RadioButtonFrame.java`\n\n\n\n\n\n```java\nprivate JLabel label;\n\
  private static final int DEFAULT_SIZE = 36;\n\npublic RadioButtonFrame()\n{\n  \
  \  // 添加示例文本标签\n    label = new JLabel(\"The quick brown fox jumps over the lazy\
  \ dog.\");\n    label.setFont(new Font(\"Serif\", Font.PLAIN, DEFAULT_SIZE));\n\
  \    add(label, BorderLayout.CENTER);\n\n    // 添加单选按钮\n    buttonPanel = new JPanel();\n\
  \    group = new ButtonGroup();\n\n    addRadioButton(\"Small\", 8);\n    addRadioButton(\"\
  Medium\", 12);\n    addRadioButton(\"Large\", 18);\n    addRadioButton(\"Extra large\"\
  , 36);\n\n    add(buttonPanel, BorderLayout.SOUTH);\n    pack();\n}\n\n/**\n * 添加一个单选按钮，设置示例文本的字体大小。\n\
  \ * @param name 显示在按钮上的字符串\n * @param size 该按钮设置的字体大小\n */\npublic void addRadioButton(String\
  \ name, int size)\n{\n    boolean selected = size == DEFAULT_SIZE;\n    JRadioButton\
  \ button = new JRadioButton(name, selected);\n    group.add(button);\n    buttonPanel.add(button);\n\
  \n    // 此监听器设置标签的字体大小\n    ActionListener listener = event -> label.setFont(new\
  \ Font(\"Serif\", Font.PLAIN, size));\n\n    button.addActionListener(listener);\n\
  }\n```\n\n***\n\n***\n\n### javax.swing.JRadioButton 1.2\n- `JRadioButton(String\
  \ label, Icon icon)` 构建一个初始未选中的单选按钮。\n- `JRadioButton(String label, boolean state)`\
  \ 构建一个具有给定标签和初始状态的单选按钮。\n\n### javax.swing.ButtonGroup 1.2\n- `void add(AbstractButton\
  \ b)` 将按钮添加到组中。\n- `ButtonModel getSelection()` 返回所选按钮的模型。\n\n### javax.swing.ButtonModel\
  \ 1.2\n- `String getActionCommand()` 返回此按钮模型的动作命令。\n\n### javax.swing.AbstractButton\
  \ 1.2\n- `void setActionCommand(String s)` 设置此按钮及其模型的动作命令。\n\n### 12.4.3 边界 (Borders)\n\
  如果你在窗口中有多个单选按钮，你可能希望在视觉上指示哪些按钮是一组的。Swing 为此提供了一系列实用的边界。你可以将边界应用于任何扩展自 `JComponent`\
  \ 的组件。最常用的用法是在面板周围放置边界，并在面板中填充其他用户界面元素，例如单选按钮。\n\n你可以选择许多边界，但对所有边界你都需要遵循相同的步骤。\n\
  \n1. 调用 `BorderFactory` 的静态方法来创建边界。你可以从以下样式中选择（参见图 12.16）：\n   - 凹角 (Lowered bevel)\n\
  \   - 凸斜角 (Raised bevel)\n   - 刻蚀 (Etched)\n   - 哑光 (Matte)\n   - 空白（Empty，仅在组件周围留出空间）\n\
  \   ![Image](img/12fig16.jpg) **图 12.16 边界测试**\n2. 如果需要，可以通过将边界传递给 `BorderFactory.createTitledBorder`\
  \ 为你的边界添加标题。\n3. 如果你真的想尝试一下，可以调用 `BorderFactory.createCompoundBorder` 将多个边界组合。\n\
  4. 通过调用 `JComponent` 类的 `setBorder` 方法将生成的边界添加到你的组件中。\n\n例如，这里是如何为面板添加带有标题的刻蚀边界：\n\
  ```java\nBorder etched = BorderFactory.createEtchedBorder();\nBorder titled = BorderFactory.createTitledBorder(etched,\
  \ \"A Title\");\npanel.setBorder(titled);\n```\n运行列表 12.5 中的程序可以了解各种边界的外观。不同的边界在设置宽度和颜色方面有不同的选项；详情请参\
  \ API 注释。真正的边界热爱好者会发现，还有一个 `SoftBevelBorder` 类用于具有圆润角的凹斜角边界，并且 `LineBorder` 也可以具有圆角。你只能通过使用类构造之一来构造这些边界——它们没有对应的\
  \ `BorderFactory` 方法。\n\n**代码列表 2.5** `border/BorderFrame.java`\n```java\npackage\
  \ border;\n\nimport java.awt.*;\nimport javax.swing.*;\nimport javax.swing.border.*;\n\
  \n/**\n * 一个带有单选按钮的框架，用于选择边界样式。\n */\npublic class BorderFrame extends JFrame\n\
  {\n    private JPanel demoPanel;\n    private JPanel buttonPanel;\n    private ButtonGroup\
  \ group;\n\n    public BorderFrame()\n    {\n        demoPanel = new JPanel();\n\
  \        buttonPanel = new JPanel();\n        group = new ButtonGroup();\n\n   \
  \     addRadioButton(\"Lowered bevel\", BorderFactory.createLoweredBevelBorder());\n\
  \        addRadioButton(\"Raised bevel\", BorderFactory.createRaisedBevelBorder());\n\
  \        addRadioButton(\"Etched\", BorderFactory.createEtchedBorder());\n     \
  \   addRadioButton(\"Line\", BorderFactory.createLineBorder(Color.BLUE));\n    \
  \    addRadioButton(\"Matte\", BorderFactory.createMatteBorder(10, 10, 10, 10, Color.BLUE));\n\
  \        addRadioButton(\"Empty\", BorderFactory.createEmptyBorder());\n\n     \
  \   Border etched = BorderFactory.createEtchedBorder();\n        Border titled =\
  \ BorderFactory.createTitledBorder(etched, \"Border types\");\n        buttonPanel.setBorder(titled);\n\
  \n        setLayout(new GridLayout(2, 1));\n        add(buttonPanel);\n        add(demoPanel);\n\
  \        pack();\n    }\n\n    public void addRadioButton(String buttonName, Border\
  \ b)\n    {\n        JRadioButton button = new JRadioButton(buttonName);\n     \
  \   button.addActionListener(event -> demoPanel.setBorder(b));\n        group.add(button);\n\
  \        buttonPanel.add(button);\n    }\n}\n```\n\n***\n\n***\n\n### javax.swing.BorderFactory\
  \ 1.2\n- `static Border createLineBorder(Color color)`\n- `static Border createLineBorder(Color\
  \ color, int thickness)` 创建简单的线条边界。\n- `static MatteBorder createMatteBorder(int\
  \ top, int left, int bottom, int right, Color color)`\n- `static MatteBorder createMatteBorder(int\
  \ top, int left, int bottom, int right, Icon tileIcon)` 创建一个填充颜色或重复图标的厚边界。\n- `static\
  \ Border createEmptyBorder()`\n- `static Border createEmptyBorder(int top, int left,\
  \ int bottom, int right)` 创建一个空边界。\n- `static Border createEtchedBorder()`\n- `static\
  \ Border createEtchedBorder(Color highlight, Color shadow)`\n- `static Border createEtchedBorder(int\
  \ type)`\n- `static Border createEtchedBorder(int type, Color highlight, Color shadow)`\
  \ 创建具有 3D 效果的线条边界。\n- `static Border createBevelBorder(int type)`\n- `static Border\
  \ createBevelBorder(int type, Color highlight, Color shadow)`\n- `static Border\
  \ createLoweredBevelBorder()`\n- `static Border createRaisedBevelBorder()` 创建一种具有凹陷或凸起表面效果的边界。\n\
  - `static TitledBorder createTitledBorder(String title)`\n- `static TitledBorder\
  \ createTitledBorder(Border border)`\n- `static TitledBorder createTitledBorder(Border\
  \ border, String title)`\n- `static TitledBorder createTitledBorder(Border border,\
  \ String title, int justification, int position)`\n- `static TitledBorder createTitledBorder(Border\
  \ border, String title, int justification, int position, Font font)`\n- `static\
  \ TitledBorder createTitledBorder(Border border, String title, int justification,\
  \ int position, Font font, Color color)` 创建具有指定属性的标题边界。\n- `static CompoundBorder\
  \ createCompoundBorder(Border outsideBorder, Border insideBorder)` 将两个边界组合为一个新边界。\n\
  \n\n\n\n\n### javax.swing.border.SoftBevelBorder 1.2\n\n- `SoftBevelBorder(int type)`\n\
  - `SoftBevelBorder(int type, Color highlight, Color shadow)`\n\n创建一个带有圆角的斜角边框。\n\
  \n![Image](img/667tab03.jpg)\n\n### javax.swing.border.LineBorder 1.2\n\n- `public\
  \ LineBorder(Color color, int thickness, boolean roundedCorners)`\n\n创建一个具有给定颜色和厚度的线条框。如果\
  \ `roundedCorners` 为 `true`，则边框具有圆角。\n\n### javax.swing.JComponent 1.2\n\n- `void\
  \ setBorder(Border border)`\n\n设置此组件的边框。\n\n### 12.4.4 组合框 (Combo Boxes)\n\n如果你有多个备选项，单选按钮不是很好的选择，因为它们占据了多的屏幕空间。相反，你可以使用组合框。当用户点击此组件时，会弹出一个选项列表，用户可以从中选择其中一个（参见图\
  \ 12.17）。\n\n![Image](img/12fig17.jpg)\n\n**图 12.17** 组合框\n\n如果下拉列表框被设置为 `editable`（可编辑），你可以像编辑文本字段一样编辑当前选择。因此，此组件被称为*组合框*（combo\
  \ box）——它结合了文本字段的灵性和一组预定义的选项。`JComboBox` 类提供了组合框组件。\n\n从 Java SE 7 开始，`JComboBox`\
  \ 类是一个泛型类。例如，`JComboBox<String>` 存储 `String` 类型的对象，而 `JComboBox<Integer>` 存储整数。\n\
  \n调用 `setEditable` 方法使组合框变为可编辑。请注意，编辑仅影响被选中的项。它不会以任何方式更改选项列表。\n\n你可以通过调用 `getSelectedItem`\
  \ 方法获取当前选择项（如果组合框是可编辑的，该项可能已被编辑过）。然而，对于可编辑的组合框，该项可以是任何类型，取决于接收用户编辑并将结果转换为对象的编辑器。（关于编辑器的讨论，请参见卷二的第\
  \ 6 章）。如果你的组合框不可编辑，你最好调用：\n\n```\ncombo.getItemAt(combo.getSelectedIndex())\n```\n\
  \n这会给你具有正确类型的被选中项。\n\n在示例程序中，用户可以从样式列表（Serif、SansSerif、Monospaced 等）中选择字体样式。用户也可以输入另一种字体。\n\
  \n使用 `addItem` 方法添加选择项。在我们的程序中，`addItem` 只在构造函数中调用，但你可以在随时调用它。\n\n点击此处查看代码图像\n\n\
  ```java\nJComboBox<String> faceCombo = new JComboBox<>();\nfaceCombo.addItem(\"\
  Serif\");\nfaceCombo.addItem(\"SansSerif\");\n// . .\n```\n\n此方法将字符串添加到列表的末尾。你可以使用\
  \ `insertItemAt` 方法在列表的任何位置添加新项：\n\n点击此处查看代码图像\n\n```java\nfaceCombo.insertItemAt(\"\
  Monospaced\", 0); // 在开头添加\n```\n\n你可以添加任何类型的项——组合框会调用每个项的 `toString` 方法来显示它。\n\n\
  如果你需要在运行时删除项，使用 `removeItem` 或 `removeItemAt` 方法，取决于你提供的是要删除的项还是它的位置。\n\n点击此处查看代码图像\n\
  \n```java\nfaceCombo.removeItem(\"Monospaced\");\nfaceCombo.removeItemAt(0); //\
  \ 删除第一项\n```\n\n`removeAllItems` 方法一次性删除所有项。\n\n![Image](img/tip.jpg) 提示\n\n如果你需要向组合框添加大量项，`addItem`\
  \ 方法的性能会很差。相反，构造一个 `DefaultComboBoxModel`，通过调用 `addElement` 填充它，然后调用 `JComboBox`\
  \ 类的 `setModel` 方法。\n\n当用户从组合框中选择一个项时，组合框会生成一个动作事件。要确定选择了哪一个项，在事件参数上调用 `getSource`\
  \ 以获取发送事件的组合框的引用。然后调用 `getSelectedItem` 方法检索当前选择的项。你需要将返回的值强制转换为适当的类型，通常是 `String`。\n\
  \n点击此处查看代码图像\n\n```java\nActionListener listener = event ->\n    label.setFont(new\
  \ Font(\n        faceCombo.getItemAt(faceCombo.setSelectedIndex()),\n        Font.PLAIN,\n\
  \        DEFAULT_SIZE));\n```\n\n列表 12.6 显示了完整的程序。\n\n![Image](img/note.jpg) 备注\n\
  \n如果你想显示一个永久显示的列表而不是下拉列表，请使用 `JList` 组件。我们在卷二的第 6 章中涵盖了 `JList`。\n\n**列表 2.6** `comboBoxFrame.java`\n\
  点击此处查看代码图像\n\n```java\npackage comboBox;\n\nimport java.awt.BorderLayout;\nimport\
  \ java.awt.Font;\nimport javax.swing.JComboBox;\nimport javax.swing.JFrame;\nimport\
  \ javax.swing.JLabel;\nimport javax.swing.JPanel;\n\n/**\n * 带有示例标签的组合框的框架。\n */\n\
  public class ComboBoxFrame extends JFrame {\n    private JComboBox<String> faceCombo;\n\
  \    private JLabel label;\n    private final int DEFAULT_SIZE = 24;\n\n    public\
  \ ComboBoxFrame() {\n        // 添加示例标签\n        label = new JLabel(\"The quick brown\
  \ fox jumps the lazy dog.\");\n        add(label, BorderLayout.CENTER);\n\n    \
  \    // 组合框添加名称\n        faceCombo = new JComboBox<>();\n        faceCombo.addItem(\"\
  Serif\");\n        faceCombo.addItem(\"SansSerif\");\n        faceCombo.addItem(\"\
  Monospaced\");\n        faceCombo.addItem(\"Dialog\");\n\n        // 组合框监听器更改标签字体\n\
  \        faceCombo.addActionListener(event ->\n            label.setFont(new Font(\n\
  \                faceCombo.getItemAt(faceCombo.getSelectedIndex()),\n          \
  \      Font.PLAIN,\n                DEFAULT_SIZE)));\n\n        // 将组合框添加到框架底部的面板\n\
  \        JPanel comboPanel = new JPanel();\n        comboPanel.add(faceCombo);\n\
  \        add(comboPanel, BorderLayout.SOUTH);\n        pack();\n    }\n}\n```\n\n\
  ### javax.swing.JComboBox 1.2\n\n- `boolean isEditable()`\n- `void setEditable(boolean\
  \ b)`\n\n获取或设置此组合框的 `editable` 属性。\n\n- `void addItem(Object item)` 将项添加到列表中。\n\
  - `void insertItemAt(Object item, int index)` 在指定的索引处向列表插入项。\n- `void removeItem(Object\
  \ item)` 从列表中删除项。\n- `void removeItemAt(int index)` 删除索引处的项。\n- `void removeAllItems()`\
  \ 从列表中删除所有项。\n- `Object getSelectedItem()` 返回当前选择的项。\n\n### 12.4.5 滑块 (Sliders)\n\
  \n组合框让用户从离散的值集中进行选择。滑块提供了对连续值的选择——例如，1 到 100 之间的任何数字。\n\n构造滑块最常用的方式如下：\n\n点击此处查看代码图像\n\
  \n```java\nJSlider slider = new JSlider(min, max, initialValue);\n```\n\n如果你省略最小值、最大值初始值，它们将分别初始化为\
  \ `0`、`100` 和 `50`。\n\n或者如果你想让滑块是垂直的，请使用以下构造调用：\n\n点击此处查看代码图像\n\n```java\nJSlider\
  \ slider = new JSlider(SwingConstants.VERTICAL, min, max, initialValue);\n```\n\n\
  这些构造函数创建了一个简单的滑块，例如图 12.18 中顶部的滑块。你将很快看到如何为滑块添加装饰。\n\n![Image](img/12fig18.jpg)\n\
  \n**图 12.18** 滑块\n\n\n\n\n\n当用户滑动滑块时，滑块的 `value` 在最小值和最大值之间移动。当值发生变化时，会向所有更改监听发送一个\
  \ `ChangeEvent`。要接收更改通知，请调用 `addChangeListener` 方法并安装一个实现了功能性 `ChangeListener` 接口的对象。在回调中，获取滑块的值：\n\
  \n点击此处查看代码图片\n\n```java\nChangeListener listener = event -> {\n    JSlider slider\
  \ = (JSlider) event.getSource();\n    int value = slider.getValue();\n    ...\n\
  };\n```\n\n你可以通过显示 `ticks`（刻度）来美化滑块。例如，在示例程序中，第二个滑使用了以下设置：\n\n点击此处查看代码图片\n\n```java\n\
  slider.setMajorTickSpacing(20);\nslider.setMinorTickSpacing(5);\n```\n\n滑块每隔 20\
  \ 个单位有一个大刻度，每隔 5 个单位有一个小刻度。单位指的是滑块的值，而不是像素。\n\n这些指令仅设置了刻度的单位。要让刻度真正出现，请调用\n\n```java\n\
  slider.setPaintTicks(true);\n```\n\n大刻度和小刻度是相互独立的。例如，你可以设置每隔 20 个单位一个大刻度，每隔 7 个单位一个小刻度，但这将给你一个非常混乱的刻度。\n\
  \n你可以强制滑块 `snap to ticks`（吸附到刻度）。当用户在吸附模式下完成拖动时，它会立即移动到最近的刻度。你通过以下调用激活此模式：\n\n```java\n\
  slider.setSnapToTicks(true);\n```\n\n![Image](img/caution.jpg) 注意\n\n“吸附到刻度”的行为并没有想象中那么好。在滑块实际吸附之前，更改监听器仍然报告不对应刻度的数值。如果你点击滑块旁边——此操作通常会让滑块向点击方向移动一点——开启了“吸附到刻度”的滑块不会移动到下一个刻度。\n\
  \n你可以通过调用以下方法为大刻度显示 `tick mark labels`（刻度标签）：\n\n```java\nslider.setPaintLabels(true);\n\
  ```\n\n例如，对于一个范围从 0 到 100 且大刻度间距为 20 的滑块，刻度标记为 0、20、40、60、80 和 100。\n\n你还可以提供其他的刻度标签，例如字符串或图标（见图\
  \ 12.18）。这个过程有点复杂。你需要填充一个键为 `Integer` 类型、值为 `Component` 类型的哈希表。然后调用 `setLabelTable`\
  \ 方法。这些组件被放置在刻度下方。通常使用 `JLabel` 对象。以下是如何将刻度标记为 A、B、C、D、E 和 F：\n\n点击此处查看代码图片\n\n\
  ```java\nHashtable<Integer, Component> labelTable = new Hashtable<Integer, Component>();\n\
  labelTable.put(0, new JLabel(\"A\"));\nlabelTable.put(20, new JLabel(\"B\"));\n\
  . . .\nlabelTable.put(100, new JLabel(\"F\"));\nslider.setLabelTable(labelTable);\n\
  ```\n\n参见第 9 章获取关于哈希表的更多信息。列表 12.7 还显示了一个使用图标作为刻度标签的滑块。\n\n![Image](img/tip.jpg)\
  \ 提示\n\n如果你的刻度或标签没有显示，请双检是否调用了 `setPaintTicks(true)` 和 `setPaintLabels(true)`。\n\
  \n图 12.18 中的第四个滑块没有轨道。要隐藏滑块移动的“轨道”，调用\n\n```java\nslider.setPaintTrack(false);\n\
  ```\n\n第五个滑块通过调用反转了方向：\n\n```java\nslider.setInverted(true);\n```\n\n示例程序通过一组滑块展示了所有这些视觉效果。每个滑块都安装了一个更改监听器，将当前滑块的值置于框架底部的文本字段中。\n\
  \n**列表 12.7** `slider/SliderFrame.java`\n\n点击此处查看代码图片\n\n```java\npackage slider;\n\
  \nimport java.awt.*;\nimport java.util.*;\nimport javax.swing.*;\nimport javax.swing.event.*;\n\
  \n/**\n * 一个包含许多滑块和用于显示滑块值的文本字段的框架。\n */\npublic class SliderFrame extends JFrame\n\
