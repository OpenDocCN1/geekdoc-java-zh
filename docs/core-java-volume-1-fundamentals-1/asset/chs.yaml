  \ 线程与 Swing\n\n***\n\n你可能对多任务处理并不陌生——你的操作系统能够让多个程序似乎在同时运行。例如，你可以在编辑或下载电子邮件的同时进行打印。如今，你可能拥有一台多个\
  \ CPU 的计算机，但并发执行进程的数量并不受限于 CPU 的数量。操作系统为每个进程分配 CPU 时间片，从而产生并行活动的错觉。\n\n多线程程序通过将这一想法进一步降低一层来扩展多任务处理：单个程序似乎在同时执行多个任务。每个任务通常被称为线程（thread），它是控制流（thread\
  \ of control）的缩写。能够同时运行多个线程的程序被称为多线程程序。\n\n那么，多个进程和多个线程之间的区别是什么？本质区别在于，虽然每个进程都有自己的一套变量，但线程共享相同的数据。这听起来有些风险，而且确实如此，正如你将在在本章后面看到的那样。然而，共享变量使得线程之间的通信比进程间通信更高效、更容易编程。此外，在某些操作系统上，线程比进程更“轻量级创建和销毁单个线程的开销比启动新进程要小。\n\
  \n多线程在实践中极其有用。例如，浏览器应该能够同时下载多个图像。Web 服务器需要能够处理并发请求。图形用户界面（GUI）程序有一个单独的线程从宿主操作系统环境中收集用户界面事件。本章将向你展示如何为\
  \ Java 程序添加多线程能力。\n\n提前警告：并发编程可能会变得非常复杂。在本章中，我们涵盖了应用程序程序员可能需要的所有工具。然而，对于更复杂的系统级编程，我们建议你转向更高级的参考资料，例如\
  \ Brian Goetz 等人的《Java 并发编程》（*Java Concurrency in Practice*，Addison-Wesley Professional,\
  \ 2006）。\n\n### 14.1 什么是线程？\n\n让我们先看一个没有使用多线程的程序，结果是导致用户很难用该程序执行多个任务。在剖析它之后，我们将向你展示让这个程序运行单独线程有多简单。这个程序通过不断移动球、检查它是否撞击墙壁、然后重绘来制作一个小跳球动画。（参见图\
  \ 14.1）。\n\n![Image](img/14fig01.jpg)\n\n**图 14.1** 使用线程制作弹球动画\n\n一旦你点击 Start（开始）按钮，程序就会从屏幕左上角发射出一个球，球开始弹跳。Start\
  \ 按钮的处理程序调用了 `addBall` 方法。该方法包含一个运行 1,000 次移动的循环。每次调用 `move` 都会让球移动一小段，如果撞击墙壁则调整方向，并重绘面板。\n\
  \n点击此处查看代码图像\n\n```java\nBall ball = new Ball();\n\npanel.add(ball);\n\nfor (int\
  \ i = 1; i <= STEPS; i++)\n{\n   ball.move(panel.getBounds());\n   panel.paint(panel.getGraphics());\n\
  \   Thread.sleep(DELAY);\n}\n```\n\n调用 `Thread.sleep` 并没有创建一个新线程——`sleep` 是 `Thread`\
  \ 类的一个静态方法，用于指定的毫秒时间内临时停止当前线程的活动。\n\n`sleep` 方法可能会抛出 `InterruptedException`。我们稍后讨论这个异常及其正确处理方法。现在，如果发生此异常，我们简单的终止弹跳。\n\
  \n如果你运行该程序，球会弹跳得很漂亮，但它完全接管了应用程序。如果你在球完成 1,000 次移动之前就厌倦了弹跳并点击了 Close（关闭）按钮，球仍然会弹跳。在球停止弹跳之前，你无法与程序进行交互。\n\
  \n***\n\n![Image](img/note.jpg) 注意\n\n如果你仔细查看本节末尾的代码，你会注意到在\n\n点击此处查看代码图像\n\n```java\n\
  comp.paint(comp.getGraphics())\n```\n\n`BounceFrame` 类的 `addBall` 方法内部的调用。这非常奇怪——通常情况下，你会调用\
  \ `repaint` 并让 AWT 担心获取图形上下文并执行绘制。但如果你尝试在这个程序中调用 `comp.repaint()`，你会发现面板只有在 `addBall`\
  \ 方法返回后才会重绘。\n\n`ball` 继承自 `JPanel`；\n\n***\n\n显然，这个程序的行为很糟糕。当你要求执行一项耗时任务时，你不会希望程序表现出这种行为。毕竟，当你通过网络读取数据时，被困在一个你*真的*想要中断的任务中是很常见的现象。例如，你下载了一张大图，在看到其中一部分后决定不需要或不想再看剩下的部分；你绝对想点击\
  \ Stop（停止）按钮来中断加载。在下一节中，我们将向你展示如何通过在单独的*线程*中运行代码的关键部分来保持用户的控制权。\n\n代码列表 14.1 到 14.3\
  \ 显示了程序的代码。\n\n**列表 14.1** `bounce/Bounce.java`\n\n点击此处查看代码图像\n\n```java\npackage\
