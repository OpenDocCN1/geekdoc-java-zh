  ```\n\n这看起来有点可怕，但幸运的是你不需要编写这些代码。然而，对布局动作的基本了解是有帮助的，这样你就可以发现错误。我们将分析代码的基本结构。本节末尾的\
  \ API 注释详细解释了每个类和方法。\n\n组件通过将它们放入 `GroupLayout.SequentialGroup` 或 `GroupLayout.ParallelGroup`\
  \ 类型的对象中来组织。这些类是 `GroupLayout.Group` 的子类。组可以包含组件、间隙和嵌套组。组类的各种 `add` 方法返回组对象，因此方法调用可以像这样链式：点击此处查看代码图像：\n\
  \n```java\ngroup.addComponent(...).addPreferredGap(...).addComponent(...);\n```\n\
  \n从示例代码可以看出，组布局将水平和垂直布局计算分开来。为了视觉化水平计算，想象组件被扁平化，使其高度为零，如下：\n![Image](img/715fig01.jpg)\n\
  \n有两组并行的组件，对应于（略微简化）代码点击此处查看代码图像：\n\n```java\n.addContainerGap()\n.addGroup(layout.createParallelGroup()\n\
  \    .addGroup(layout.createSequentialGroup()\n        .addComponent(jLabel1)\n\
  \        .addPreferredGap(LayoutStyle.ComponentPlacement.RELATED)\n        .addComponent(jTextField1))\n\
  \    .addGroup(layout.createSequentialGroup()\n        .addComponent(jLabel2)\n\
  \        .addPreferredGap(LayoutStyle.ComponentPlacement.RELATED)\n        .addComponent(jPasswordField)))\n\
  ```\n\n但是等等，这不对。如果标签长度不同，文本字段和密码字段将无法对齐。我们必须告诉 Matisse 我们希望字段对齐。选择两个字段，右键点击并从菜单中选择\
  \ `Align → Column`。同时也对齐标签（参见图 12.32）。\n\n![Image](img/12fig32.jpg)\n**图 12.32**\
  \ 在 Matisse 中对齐标签和文本字段\n\n这大大改变了布局代码点击此处查看代码图像：\n\n```java\n.addGroup(layout.createSequentialGroup()\n\
  \    .addContainerGap()\n    .addGroup(layout.createParallelGroup(GroupLayout.Alignment.LEADING)\n\
  \        .addComponent(jLabel1, GroupLayout.Alignment.TRAILING)\n        .addComponent(jLabel2,\
  \ GroupLayout.Alignment.TRAILING))\n    .addPreferredGap(LayoutStyle.ComponentPlacement.RELATED)\n\
  \    .addGroup(layout.createParallelGroup(GroupLayout.Alignment.LEADING)\n     \
  \   .addComponent(jTextField1)\n        .addComponent(jPasswordField)))\n```\n\n\
  现在标签和字段分别放置在并行组中。第一个组具有 `TRAILING` 对齐方式（当文本方向从左到右时，意味着向右对齐）：\n![Image](img/717fig01.jpg)\n\
  \n\n\n\nMatisse 能够将设计指令转换为嵌套组，这看起来就像魔法一样——但正如亚瑟·C·克拉克所说，任何足够先进的技术与魔法无异。\n\n为了完整性起见，让我们来看垂直计算。现在你应该认为这些组件没有宽度。我们有一个包含两个并行组的顺序组，它们之间由间隙隔开：\n\
  \n![Image](img/717fig02.jpg)\n\n对应的代码是：\n\n点击此处查看代码图像\n\n```java\nlayout.createSequentialGroup()\n\
  \    .addContainerGap()\n    .addGroup(layout.createParallelGroup(GroupLayout.Alignment.BASELINE)\n\
  \        .addComponent(jLabel1)\n        .addComponent(jTextField1))\n    .addPreferredGap(LayoutStyle.ComponentPlacement.RELATED)\n\
  \    .addGroup(layout.createParallelGroup(GroupLayout.Alignment.BASELINE)\n    \
  \    .addComponent(jLabel2)\n        .addComponent(jPasswordField1))\n```\n\n从代码可以看出，组件是根据它们的基线（baselines）对齐的。（基线是组件文本对齐的行线。）\n\
