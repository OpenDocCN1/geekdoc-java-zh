  \ 来重新初始化 log manager。\n\n***\n\n要更改默认日志级别，请编辑配置文件并修改该行：\n\n`.level=INFO`\n\n你可以通过添加如下行来为自己的日志器指定日志级别：\n\
  \n点击此处查看代码图像\n\n`com.mycompany.myapp.level=FINE`\n\n即在日志器名称后附加 `.level` 后缀。\n\n\
