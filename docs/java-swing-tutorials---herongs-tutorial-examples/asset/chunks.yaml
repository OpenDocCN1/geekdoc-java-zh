    \n### setMnemonic() - Setting Keyboard Mnemonics on Menu Items\n\nThis section\
    \ provides a tutorial example on how to use `setMnemonic()` method to associate\
    \ mnemonics to menu items. Mnemonics allows user to interact with menu items using\
    \ keys on keyboard.\n\nAs you can see from the previous section, it is very hard\
    \ to use menu key listeners to catch menu key event to support user typed keys\
    \ on menu items. When one key typed triggers all active menu items to fire menu\
    \ key events.\n\nAnother way to allow users interacting with menu items using\
    \ keyboard keys is to set mnemonics, keyboard keys, to menu items with the `setMnemonic()`\
    \ method. Here is how it works:\n\n1. Assign difference mnemonics, representing\
    \ different keys on the keyboard, to different menu items.\n2. Adding an action\
    \ listener to each menu item.\n3. When a menu item is displayed, the character\
    \ in the menu text that matches the mnemonic will be underscored.\n4. When a key\
    \ is pressed on the keyboard, only the menu item that has the mnemonic matching\
    \ the pressed key will fire an action event.\n\nHere is an example program I wrote\
    \ to test the `setMnemonic()` method:\n\n```java\n /* JMenuItemSetMnemonicTest.java\n\
    \ * Copyright (c) 1997-2018 HerongYang.com. All Rights Reserved.\n */\nimport\
    \ java.awt.event.*;\nimport javax.swing.*;\nimport javax.swing.event.*;\npublic\
    \ class JMenuItemSetMnemonicTest \n   implements ActionListener, MenuKeyListener\
