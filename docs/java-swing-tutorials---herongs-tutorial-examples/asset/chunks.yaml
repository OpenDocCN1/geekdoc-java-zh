  trans: "\n\n* `AWT (Abstract Windows Toolkit)` 是一个 Java 包，即 `java.awt.*`，它允许 Java\
    \ 应用程序操作图形设备并创建 GUI（图形用户界面）。\n* `java.awt.Frame` - 表示一个带有标题和边框的顶层窗口。\n* 你可以重写\
    \ `paint()` 方法在框架或任何组件上绘制图形形。\n* `java.awt.Button` 和 `java.awt.Label` 代表标准的按钮和标签\
    \ GUI 组件。\n* `Button` 在被点击时可以产生动作事件。你可以添加动作监听器（action listeners），用你自己的逻辑来处理动作事件。\n\
    * `TextField` 在按下“Enter”键时也可以产生动作事件。\n* `java.awt.MenuBar`、`java.awt.Menu` 和 `java.awt.MenuItem`\
    \ 可用于菜单系统并添加到框架中。\n\n本章列出的示例程序已 Windows 和 macOS 电脑上通过 `JDK 1.0` 到 `JDK 15` 了测试。\n\
    \nJava Swing 教程 - Herong 的教程示例\n\n∟AWT (Abstract Windows Toolkit)\n\n### 什么是 AWT\
    \ (Abstract Windows Toolkit)\n\n本节介绍了什么是 AWT（抽象窗口工具包）——一个 Java 包，`java.awt.*`，允许\
    \ Java 应用程序操作图形设备并创建 GUI（图形用户界面）。\n\n**什么是 AWT (Abstract Windows Toolkit)？** `AWT`\
    \ 是一个 Java 包，`java.awt.*`，允许 Java 应用程序操作图形设备并创建 GUI（图形用户界面）。\n\n`JDK` 文档提供了 `AWT`\
    \ 的另一种描述：“AWT 包含了所有用于创建用户界面以及绘制图形和图像的类。在 AWT 术语中，按钮或滚动条等用户界面对象被称为组件（component）。`Component`\
    \ 类是所有 AWT 组件的根。请参见 `Component` 以获取关于所有 AWT 组件共享的属性的详细描述。”\n\n`AWT` 包 `java.awt.*`\
    \ 引入于 `JDK 1.0`。随后在 `JDK 1.2` 中，引入了 `Swing` 包 `javax.swing.*`，以提供更丰富的 API 并通过封装层隐藏\
    \ `AWT`。\n\n`AWT` 包包含以下主要类：\n* `java.awt.AWTEvent` - 所有 SWT 事件类的根类。\n* `java.awt.Button`\
    \ - 表示一个带标签的按钮。\n* `java.awt.Canvas` - 表示屏幕上的一个空白矩形区域，应用程序可以在其上绘制，或从该区域捕获来自用户的输入事件。\n\
    * `java.awt.Checkbox` - 表示一个具有“开启”（true）或“关闭”（false）状态的图形组件。\n* `java.awt.Color`\
    \ - 封装默认 sRGB 颜色空间中的颜色。\n* `java.awt.Component` - 可以在显示在屏幕上并与用户交互的图形化表示。\n* `java.awt.Container`\
    \ - 一个可以作为一组包含其他组件的逻辑组件。\n* `java.awt.Desktop` - 允许应用程序与各种桌面功能交互。\n* `java.awt.Dialog`\
    \ - 表示一个带有标题和边框的顶层窗口，通常用于从用户处获取某种形式的输入。\n* `java.awt.Event` - 表示一个带标签的按钮（注：此处原文可能描述误，此处按原文翻译）。\n\
    * `java.awt.FlowLayout` - 将组件按方向流排列，类似于段落中的文本行。\n* `java.awt.Font` - 表示字体，用于以可见的方式渲染文本。\n\
    * `java.awt.Frame` - 表示一个带有标题和边框的顶层窗口。\n* `java.awt.Graphics` - 所有图形上下文的抽象基类，允许应用程序在位于各种设备上实现的组件上以及在离屏图像上进行绘制。\n\
    * `java.awt.GraphicsEnvironment` - 描述特定平台上供 Java(tm) 应用程序使用的 `GraphicsDevice`\
    \ 对象集合和 `Font` 对象集合。\n* `java.awt.GridBagLayout` - 一种灵活的布局管理器，可以垂直、水平或沿基线对齐组件，而不需要组件大小相同。\n\
    * `java.awt.GridLayout` - 一种在矩形网格中布局容器组件的布局管理器。\n* `java.awt.Image` - 作为所有表示图形的类的父类的抽象类。\n\
    * `java.awt.Label` - 用于在容器中放置文本的组件。\n* `java.awt.List` - 向用户提供滚动文本项列表的组件。\n* `java.awt.Menu`\
    \ - 从菜单栏部署的拉式菜单组件。\n* `java.awt.MenuBar` - 封装了平台绑定到框架的菜单栏概念。\n* `java.awt.MenuItem`\
    \ - 与 `MenuBar` 关联的项。\n* `java.awt.MouseInfo` - 提供获取鼠标信息的方法，如鼠标指针位置和鼠标按钮数量。\n\
    * `java.awt.Panel` - 最简单的容器类。\n* `java.awt.Point` - 表示 (x,y) 坐标空间中的一个位置，以整数精度标出。\n\
    * `java.awt.Polygon` - 封装坐标空间内一个闭合二维区域的描述。\n* `java.awt.Rectangle` - 指定坐标空间中的一个区域，由\
    \ `Rectangle` 对象的左上点 (x,y) 围成。\n* `java.awt.Robot` - 用于测试自动化、演示以及需要控制鼠标和键盘的应用程序生成原生系统事件。\n\
    * `java.awt.Scrollbar` - 体现滚动条的熟悉用户界面。\n* `java.awt.ScrollPane` - 实现水平和垂直滚动的容器类。\n\
    * `java.awt.SystemTray` - 代表系统托盘。\n* `java.awt.Taskbar` - 允许 Java 应用程序与任务区域（任务栏等）交互。\n\
    * `java.awt.TextArea` - 显示文本的多行区域。\n* `java.awt.TextField` - 允许编辑单行文本的文本组件。\n\
    * `java.awt.Toolkit` - 所有抽象窗口工具包实现的抽象父类。\n* `java.awt.TrayIcon` - 表示可以添加到系统托盘的托盘图标。\n\
    * `java.awt.Window` - 一个没有边框和菜单栏的顶层窗口。\n\nJava Swing 教程 - Herong 的教程示例\n\n∟AWT\
    \ (Abstract Windows Toolkit)\n\n### HelloAWT.java - 我的第一个 AWT 程序\n\n本节提供了关于如何编写简单\
    \ AWT 程序的教程示例。`HelloAWT.java` 是我的第一个 AWT 程序，显示窗口标题栏显示“Hello world!”的空白窗口。\n\n\
    下面是我的第一个 AWT 程序，`HelloAWT.java`：\n\n```java\nimport java.awt.Frame;\npublic class\
    \ HelloAWT {\n   public static void main(String[] a) {\n      Frame f = new Frame(\"\
    Hello world!\");\n      f.setVisible(true);\n   }\n}\n```\n\n如果你的系统中安装了 `JDK`，你可以在命令行窗口中编译并运行此程序：\n\
    \n```\nherong> javac HelloAWT.java\nherong> java HelloAWT\n```\n\n一旦程序运行，你将看到屏幕上弹出一个小新窗口。如果使用鼠标指针拖动它的边缘使其变大，你可以像图片所示看到标题区域的文本：\n\
    \n![](img/image0194.jpeg)\n\n第一个 AWT - Hello World!\n\n新窗口一直留在屏幕上，直到你在命令行窗口中按下\
    \ `Ctrl-C` 来终止运行的程序。\n\n### 关闭 AWT 框架并终止应用程序\n\n**问题**：我在屏幕上显示了一个框架窗口，当用户从窗口的系统菜单调用关闭命令，或点击窗口系统图标列表中的关闭图标时，我想关闭该框架并终止应用程序。\n\
    \n"
- fmt: "\nSolution: You can create a new window event listener class and add an object\
    \ of this listener class to the `Frame` object. In the new window event listener,\
    \ you can implement your owner version of `windowClosing()` handler method. Of\
    \ course, the quickest way to create a new window event listener class is to extend\
    \ the `WindowAdapter` class.\n\nThe following sample code, `FrameClose.java`,\
    \ shows you how to do this.\n\n```java\n /* FrameClose.java\n * Copyright (c)\
    \ 1997-2018 HerongYang.com. All Rights Reserved.\n */\nimport java.awt.Frame;\n\
    import java.awt.event.WindowAdapter;\nimport java.awt.event.WindowEvent;\npublic\
    \ class FrameClose  {\n   public static void main(String[] a) {\n      Frame f\
    \ = new Frame();\n      f.setTitle(\"Closing Frame with Window Listener\");\n\
    \      f.setBounds(100,50,500,300);\n      f.addWindowListener(new MyWindowListener());\n\
    \      f.setVisible(true);\n   }\n   static class MyWindowListener extends WindowAdapter\
    \ {\n      public void windowClosing(WindowEvent e) {\n         System.exit(0);\n\
    \      }\n   }\n}\n```\n\n[Java Swing Tutorials - Herong's Tutorial Examples](#part0001.xhtml)\n\
    \n∟[AWT (Abstract Windows Toolkit)](#part0100.xhtml)\n\n∟Drawing Graphics - Using\
    \ `paint()` on Frame or Component\n\nThis section provides a tutorial example\
    \ on how to override the `paint()` method in the `javax.awt.Frame` class to draw\
    \ graphics (a rectangle) on the frame window, or override the `paint()` method\
    \ in the `java.awt.Component` class to draw graphics and add the component to\
    \ the frame window.\n\n### Problem: I want to draw some graphics in a frame.\n\
    \n### Solution 1: You can do this very easily by extending Frame class to create\
    \ your own frame class so that you can override the `paint()` method. The The\
    \ `paint()` method provides a `Graphics` object, which will give you utility methods\
    \ to draw various types of graphics. The following sample code, `FramePaint1.java`,\
    \ shows you how to do this.\n\n```java\n /* FramePaint1.java\n * Copyright (c)\
    \ 1997-2018 HerongYang.com. All Rights Reserved.\n */\nimport java.awt.Frame;\n\
    import java.awt.Graphics;\npublic class FramePaint1 {\n   public static void main(String[]\
    \ a) {\n      MyFrame f = new MyFrame();\n      f.setTitle(\"Drawing Graphics\
    \ in a Frame Directly\");\n      f.setBounds(100,50,500,300);\n      f.setVisible(true);\n\
    \   }\n   static class MyFrame extends Frame {\n      public void paint(Graphics\
    \ g) {\n         g.drawRect(20,10,100,60);\n      }\n   }\n}\n```\n\nIf you run\
    \ this example, you will get:\n\n![](Images/image00135.jpeg)\n\nUsing `paint()`\
    \ on Frame\n\nNote 1: The `paint()` method is inherited by `Frame` class from\
    \ the `Component` class. It will be called whenever this component should be painted.\n\
    \nNote 2: If you look at the rectangle displayed on the frame, you will see that\
    \ the origin of the drawing coordinates is located at the top left corner of the\
    \ entire frame, including the title bar.\n\nNote 3: By default, the `paint()`\
    \ method provides transparent background, in JDK 1.4, 1.5 and 1.6. This is why\
    \ you see a Web page showing up in the picture.\n\nNote 4: In JDK 7 and higher,\
    \ the `paint()` method does not provides transparent background.\n\nThis solution\
    \ is not recommended. We don't want to draw graphics in the frame bar area.\n\n\
    ### Solution 2: Obviously, solution 1 is not so ideal, because we are drawing\
    \ on the UI element of the frame itself. To draw graphics only in the content\
    \ area of the frame, we can create a new component with its own `paint()` method\
    \ and add it to the frame. The following sample code, `FramePaint2.java`, shows\
    \ you how to do this.\n\n```java\n /* FramePaint2.java\n * Copyright (c) 1997-2018\
    \ HerongYang.com. All Rights Reserved.\n */\nimport java.awt.Frame;\nimport java.awt.Graphics;\n\
    import java.awt.Component;\npublic class FramePaint2 {\n   public static void\
    \ main(String[] a) {\n      Frame f = new Frame();\n      f.setTitle(\"Drawing\
    \ Graphics in a Frame\"\n         +\" by Adding a Component\");\n      f.setBounds(100,50,500,300);\n\
    \      f.add(new MyComponent());\n      f.setVisible(true);\n   }\n   static class\
    \ MyComponent extends Component {\n      public void paint(Graphics g) {\n   \
    \      g.drawRect(20,10,100,60);\n      }\n   }\n}\n```\n\nIf you run this example,\
    \ you will get:\n\n![](Images/image00195.jpeg)\n\nUsing `paint()` on Component\n\
    \nNote 1: Since no size and location is given to the new added component, it takes\
    \ the entire area of the content pane, which is the entire area of the frame without\
    \ the title bar area.\n\nNote 2: Now the origin of the drawing coordinates is\
    \ at the top left corner of the content pane, much better than solution 1.\n\n\
    [Java Swing Tutorials - Herong's Tutorial Examples](#part0001.xhtml)\n\n∟[AWT\
    \ (Abstract Windows Toolkit)](#part0100.xhtml)\n\n∟Creating Labels with java.awt.Label\n\
    \nThis section provides a tutorial example on how to create a label with the `java.awt.Label`.\n\
    \n**Problem**: I want to create a label with string.\n\n**Solution**: This is\
    \ easy, just instantiate an object of `java.awt.Label`, and add it to any container.\
    \ Here is a sample program show you how to do this:\n\n```java\n /* LabelHello.java\n\
    \ * Copyright (c) 1997-2018 HerongYang.com. All Rights Reserved.\n */\nimport\
    \ java.awt.Frame;\nimport java.awt.Label;\npublic class LabelHello {\n   public\
    \ static void main(String[] a) {\n      Frame f = new Frame(\"LabelHello\");\n\
    \      Label l = new Label(\"Hello!\");\n      f.add(l);\n      f.pack();\n  \
    \    f.setVisible(true);\n   }\n}\n```\n\nIf you run this example, you will get:\n\
    \n![](Images/image00196.jpeg)\n\nAWT Label Test\n\nNote: The `pack()` method causes\
    \ the window to resize to fit its subcomponents.\n\n[Java Swing Tutorials - Herong's\
    \ Tutorial Examples](#part0001.xhtml)\n\n∟[AWT (Abstract Windows Toolkit)](#part0100.xhtml)\n\
    \n∟Creating Buttons with java.awt.Button\n\nThis section provides a tutorial example\
    \ on how to create a button with the `java.awt.Button` class.\n\n**Problem**:\
    \ I want to create a button with text.\n\n**Solution**: Buttons are so easy to\
    \ create with the `java.awt.Button` class. Here is a sample program:\n\n```java\n\
    \ /* ButtonOk.java\n * Copyright (c) 1997-2018 HerongYang.com. All Rights Reserved.\n\
    \ */\nimport java.awt.Frame;\nimport java.awt.Button;\npublic class ButtonOk {\n\
    \   public static void main(String[] a) {\n      Frame f = new Frame(\"OK Button\"\
    );\n      Button b = new Button(\"OK\");\n      f.add(b);\n      f.pack();\n \
    \     f.setVisible(true);\n   }\n}\n```\n\nIf you run this example, you will get:\n\
    \n![](Images/image00197.jpeg)\n\nAWT Button Test\n\nNote: Clicking the OK button\
    \ will trigger no actions, because no event listeners are added to the button\
    \ component.\n\n[Java Swing Tutorials - Herong's Tutorial Examples](#part0001.xhtml)\n\
    \n∟[AWT (Abstract Windows Toolkit)](#part0100.xhtml)\n\n∟AWT Button Action Handler\
    \ at Component Level\n\nThis section provides a tutorial example on how to create\
    \ an AWT button to handle actions by adding the `ActionListener` interface to\
    \ the button component.\n\nOne way to handle button actions is to add an action\
    \ listener to the button object. An action listener is an object of any class\
    \ that implements the `ActionListener` interface.\n\nThe following program shows\
    \ you how to extend the `Button` class to implement the `ActionListener` class:\n\
    \n```java\n /* ButtonAction.java\n * Copyright (c) 1997-2018 HerongYang.com. All\
    \ Rights Reserved.\n */\nimport java.awt.Frame;\nimport java.awt.Button;\nimport\
    \ java.awt.event.ActionEvent;\nimport java.awt.event.ActionListener;\npublic class\
    \ ButtonAction1 {\n   public static void main(String[] a) {\n      Frame f = new\
    \ Frame(\"My AWT Button\");\n      Button b = new MyButton();\n      f.add(b);\n\
    \      f.pack();\n      f.setVisible(true);\n   }\n   private static class MyButton\
    \ extends Button \n      implements ActionListener {\n       String text = \"\
    On\";\n       public MyButton() {\n          super();\n          setLabel(text);\n\
    \          addActionListener(this);\n       }\n       public void actionPerformed(ActionEvent\
    \ e) {\n          if (text.equals(\"On\")) text = \"Off\";\n          else text\
    \ = \"On\"; \n          setLabel(text);\n       }\n   }\n}\n```\n\nIf you run\
    \ this example, you will get:\n\n![](Images/image00198.jpeg)\n\nAWT Button Action\
    \ Handler\n"
