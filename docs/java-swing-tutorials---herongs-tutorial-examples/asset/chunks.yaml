  trans: "\n\n## 解决方案 3\n\n你可以创建一个新的窗口事件监听器类，并将该类的类的对象添加到 `JFrame` 对象中。在新的窗口事件监听器中，你可以实现自定义的\
    \ `windowClosing()` 处理器方法。当然，创建新窗口事件监听类最快的方法是扩展 `WindowAdapter` 类。下面的示例代码 `JFrameClose3.java`\
    \ 展示了如何实现。\n\n```java\n /* JFrameClose3.java\n * Copyright (c) 1997-2018 HerongYang.com.\
    \ All Rights Reserved.\n */\nimport java.awt.event.*;\nimport javax.swing.*;\n\
    public class JFrameClose3  {\n   public static void main(String[] a) {\n     \
    \ JFrame f = new JFrame();\n      f.setTitle(\"Closing Frame with Window Listener\"\
    );\n      f.setBounds(100,50,500,300);\n      f.addWindowListener(new MyWindowListener());\n\
    \      f.setVisible(true);\n   }\n   static class MyWindowListener extends WindowAdapter\
    \ {\n      public void windowClosing(WindowEvent e) {\n         System.exit(0);\n\
    \      }\n   }\n}\n```\n\nJava Swing 教程 - Herong 的教程示例\n\n∟JFrame - 主窗口类\n\n##\
    \ 列出和中断 AWT 线程\n\n本节提供了一个关于如何列出 AWT 线程以及如何使用 `interrupt()` 方法中断 AWT 线程的教程示例。\n\
    \n**问题**：我想知道由 `Swing` 包和 `AWT` 包共创建了多少线程。如果我向所有这些线程发送中断信号，会发生什么？\n\n**解决方案**：这很简单。只需获取当前线程组的所有线程列表，然后一个一个地中断它们。这里有一个示例程序展示如何如何操作：\n\
    \n```java\n /* FrameThreads.java\n * Copyright (c) 1997-2018 HerongYang.com. All\
    \ Rights Reserved.\n */\nimport java.awt.*;\nimport javax.swing.*;\npublic class\
    \ FrameThreads {\n   public static void main(String[] a) {\n      JFrame f = new\
    \ JFrame(\"Frame 1\");\n      f.setBounds(0,0,100,100);\n      f.setVisible(true);\n\
    \      f = new JFrame(\"Frame 2\");\n      f.setBounds(50,50,100,100);\n     \
    \ f.setVisible(true);\n      f = new JFrame(\"Frame 3\");\n      f.setBounds(100,100,100,100);\n\
    \      f.setVisible(true);\n      Thread[] l = new Thread[100];\n      int n =\
    \ Thread.enumerate(l);\n      Thread g = null;\n      for (int i=0; i<n; i++)\
    \ {\n         System.out.println(\"Active thread = \"+l[i].getName());\n     \
    \ }\n      Thread t = Thread.currentThread();\n      for (int i=0; i<n; i++) {\n\
    \         try {\n            Thread.sleep(1000*30);\n         } catch (Exception\
    \ e) {\n            System.out.println(\"Interrupted.\");\n         }\n      \
    \   if (t != l[i]) {\n            System.out.println(\"Interrupting thread = \"\
    \n               +l[i].getName());\n            l[i].interrupt();\n         }\n\
    \      }\n   }\n}\n```\n\n如果你使用 `JDK 1.5 或更高版本` 运行此程序，你将看到屏幕上出现 3 个窗口。每隔 30 秒，我的程序就会向每个线程发送一个中断信号。当中断信号到达“Java2D\
    \ Disposer”线程时，会发生运行时异常并强制应用程序终止。以下列表显示了我程序的输出：\n\n```\n herong> \\Progra~1\\\
    Java\\jdk1.5.0_09\\bin\\java FrameThreads\n\nActive thread = main\nActive thread\
    \ = AWT-Windows\nActive thread = AWT-Shutdown\nActive thread = AWT-EventQueue-0\n\
    Active thread = Java2D Disposer\nInterrupting thread = AWT-Windows\nInterrupting\
    \ thread = AWT-Shutdown\nInterrupting thread = AWT-EventQueue-0\nInterrupting\
    \ thread = Java2D Disposer\nException while removing reference: java.lang.InterruptedException\n\
    java.lang.InterruptedException\n   at java.lang.Object.wait(Native Method)\n \
    \  at java.lang.ref.ReferenceQueue.remove(ReferenceQueue.java:111)\n   at java.lang.ref.ReferenceQueue.remove(ReferenceQueue.java:127)\n\
    \   at sun.java2d.Disposer.run(Disposer.java:100)\n   at java.lang.Thread.run(Thread.java:534)\n\
    AWT blocker activation interrupted:\njava.lang.InterruptedException\n   at java.lang.Object.wait(Native\
    \ Method)\n   at java.lang.Object.wait(Object.java:429)\n   at sun.awt.AWTAutoShutdown.activateBlockerThread(AWTAutoShut...\n\
    \   at sun.awt.AWTAutoShutdown.setToolkitBusy(AWTAutoShutdown.ja...\n   at sun.awt.AWTAutoShutdown.notifyToolkitThreadBusy(AWTAutoSh...\n\
    \   at sun.awt.windows.WToolkit.eventLoop(Native Method)\n   at sun.awt.windows.WToolkit.run(WToolkit.java:534)\n\
    ```\n\n"
- fmt: "\n# Java Swing Tutorials - Herong's Tutorial Examples\n\n## JFrame - Main\
    \ Frame Class\n\n### Displaying Chinese Characters in Frame Title\n\nThis section\
    \ provides a tutorial example on how to display Chinese characters in the title\
    \ bar of a frame window with a given Chinese font.\n\n**Problem**: I want to display\
    \ Chinese characters in the title of a frame window.\n\n**Solution 1**: If you\
    \ are using `JDK` 9 or higher on newer computers, you can include Chinese characters\
    \ in your Java source code and save it in `UTF-8` encoding, which is the default\
    \ behavior of most programming editors. There is no need to specify the `SimSun`\
    \ font name. The system will pick up the default font to support Chinese characters.\
    \ Chinese characters can still be provided in Unicode `/uxxxx` ASCII format. But\
    \ `UTF-8` encoding is a much better option.\n\n```\n /* JFrameChinese2.java\n\
    \ * Copyright (c) 2014-2018 HerongYang.com All Rights Reserved.\n*/\nimport java.awt.*;\n\
    import javax.swing.*;\npublic class JFrameChinese2 {\n   public static void main(String[]\
    \ a) {\n      JFrame f = new JFrame();\n//    f.setFont(new Font(\"SimSun\",Font.PLAIN,\
    \ 12));\n//    f.setTitle(\"Hello world! - \\u7535\\u8111\\u4F60\\u597D\\uFF01\"\
    );\n      f.setTitle(\"Hello world! - 电脑你好！\");\n      f.setBounds(100,50,500,300);\n\
    \      f.setDefaultCloseOperation(JFrame.EXIT_ON_CLOSE);\n      f.setVisible(true);\n\
    \   }\n}\n```\n\n**Solution 2**: If you are still using an older version of `JDK`\
    \ on an older computer, you may have to install Chinese fonts yourself. In my\
    \ sample code listed below, I am using font `SimSun`, which was installed as part\
    \ of the Windows multi-language support. You may also have to enter Chinese characters\
    \ in Java source code in `/uxxxx` ASCII format.\n\n```\n /* JFrameChinese.java\n\
    \ * Copyright (c) 2014-2018 HerongYang.com All Rights Reserved.\n */\nimport java.awt.*;\n\
    import javax.swing.*;\npublic class JFrameChinese {\n   public static void main(String[]\
    \ a) {\n      JFrame f = new JFrame();\n      f.setFont(new Font(\"SimSun\",Font.PLAIN,\
    \ 12));\n      f.setTitle(\"Hello world! - \\u7535\\u8111\\u4F60\\u597D\\uFF01\"\
    );\n      f.setBounds(100,50,500,300);\n      f.setDefaultCloseOperation(JFrame.EXIT_ON_CLOSE);\n\
    \      f.setVisible(true);\n   }\n}\n```\n\nIf you run both examples, you will\
    \ get the same result:\n\n![](Images/image00134.jpeg)\n\n### Chinese Characters\
    \ in Title Bar\n\n**Note 1**: With `JDK` 1.4.1 or lower, the characters are displayed\
    \ as `?`. I don't any way to fix it. If you have any suggestions, please share\
    \ them with me.\n\n**Note 2**: To check if you have `SimSun` font installed or\
    \ not on your Windows computer, you can look for `%windir%\\fonts\\simsun.ttc`\
    \ file in your system directory tree.\n\n## Drawing Graphics - Using paint() on\
    \ Frame\n\nThis section provides a tutorial example on how to override the `paint()`\
    \ method in the `javax.swing.JFrame` class to draw graphics (a rectangle) on the\
    \ frame window. This solution is not recommended.\n\n**Problem**: I want to draw\
    \ some graphics in a frame.\n\n**Solution 1**: You can do this very easily by\
    \ extending `JFrame` class to create your own frame class so that you can override\
    \ the `paint()` method. The `paint()` method provides a `Graphics` object, which\
    \ will give you utility methods to draw various types of graphics. The following\
    \ sample code, `JFramePaint1.java`, shows you how to do this.\n\n```\n /* JFramePaint1.java\n\
    \ * Copyright (c) 1997-2018 HerongYang.com. All Rights Reserved.\n */\nimport\
    \ java.awt.*;\nimport javax.swing.*;\npublic class JFramePaint1 {\n   public static\
    \ void main(String[] a) {\n      MyJFrame f = new MyJFrame();\n      f.setTitle(\"\
    Drawing Graphics in Frames\");\n      f.setBounds(100,50,500,300);\n      f.setDefaultCloseOperation(JFrame.EXIT_ON_CLOSE);\n\
    \      f.setVisible(true);\n   }\n   static class MyJFrame extends JFrame {\n\
    \      public void paint(Graphics g) {\n         g.drawRect(20,10,100,60);\n \
    \     }\n   }\n}\n```\n\nIf you run this example, you will get:\n\n![](Images/image00135.jpeg)\n\
    \n### Using paint() on Frame\n\n**Note 1**: The `paint()` method is inherited\
    \ by `JFrame` class from the `Component` class. It will be called whenever this\
    \ component should be painted.\n\n**Note 2**: If you look at the rectangle displayed\
    \ on the frame, you will see that the origin of the drawing coordinates is located\
    \ at the top left corner of the entire frame, including the title bar.\n\n**Note\
    \ 3**: By default, the `paint()` method provides transparent background.\n\n**Note\
    \ 4**: In `JDK` 7 and higher, the `paint()` method does not provide background.\n\
    \n## Using paint() on Component\n\nThis section provides a tutorial example on\
    \ how to override the `paint()` method in the `javax.swing.JFrame` class to draw\
    \ graphics (a rectangle) on the frame window.\n\n**Problem**: I want to draw some\
    \ graphics in a frame.\n\n**Solution 2**: Solution 1 is still not ideal, because\
    \ we add another component. To draw graphics in the frame area, we create a new\
    \ component and add it to the content pane.\n\n```\n /* JFramePaint2.java\n *\
    \ Copyright (c) 1997-2018 HerongYang.com. All Rights Reserved.\n */\nimport java.awt.*;\n\
    import javax.swing.*;\npublic class JFramePaint2 {\n   public static void main(String[]\
    \ a) {\n      JFrame f = new JFrame();\n      f.setTitle(\"Drawing Graphics in\
    \ Frames\"\n         +\" by Adding Component\");\n      f.setBounds(100,50,500,300);\n\
    \      f.setDefaultCloseOperation(JFrame.EXIT_ON_CLOSE);\n      f.getContentPane().add(new\
    \ MyComponent());\n      f.setVisible(true);\n   }\n   static class MyComponent\
    \ extends JComponent {\n    b  public paint(Graphics g) {\n         g.drawRect(20,10,100,60);\n\
    \      }\n   }\n}\n```\n\nIf you run this example, you will get:\n\n![](Images/image00136.jpeg)\n\
    \n**Note 1**: Since no size and location is given to the new component, it takes\
    \ the entire area of the content pane, which is the entire area of the frame.\n\
    \n**Note 2**: Now the origin of drawing coordinates is at the top left, much better\
    \ than solution 1.\n\n## Using paint() on Content Pane\n\nThis section provides\
    \ a tutorial example on how to override the `paint()` method in the `javax.swing.JFrame`\
    \ class to draw graphics (a rectangle) and use it as the content pane of the frame.\n\
    \n**Problem**: I want to draw some graphics in a frame.\n\n**Solution 3**: Solution\
    \ 2 is still not so perfect. Why do we need to add another component for the drawing?\
    \ Can we draw graphics directly on the content pane? The answer is yes, we can\
    \ draw directly on the content pane. The following sample code, `JFramePaint3.java`,\
    \ shows you how to do this.\n\n```\n /* JFramePaint3.java\n * Copyright (c) 1997-2018\
    \ HerongYang.com. All Rights Reserved.\n */\nimport java.awt.*;\nimport javax.swing.*;\n\
    public class JFramePaint3 {\n   public static void main(String[] a) {\n      JFrame\
    \ f = new JFrame();\n      f.setTitle(\"Drawing Graphics in Frame\"\n        \
    \ +\" by Replacing the Content Pane\");\n      f.setBounds(100,50,500,300);\n\
    \      f.setDefaultCloseOperation(JFrame.EXIT_ON_CLOSE);\n      f.setContentPane(new\
    \ MyComponent());\n      f.setVisible(true);\n   }\n   static class MyComponent\
    \ extends JComponent {\n      public void paint(Graphics g) {\n         g.drawRect(20,10,100,60);\n\
    \      }\n   }\n}\n```\n\nIf you run this example, you will get:\n\n![](Images/image00137.jpeg)\n"
  raw: "[Java Swing Tutorials - Herong's Tutorial Examples](#part0001.xhtml)\n\n∟[JFrame\
    \ - Main Frame Class](#part0016.xhtml)\n\n∟Displaying Chinese Characters in Frame\
    \ Title\n\nThis section provides a tutorial example on how to display Chinese\
    \ characters in the title bar of a frame window with a given Chinese font.\n\n\
    **Problem**: I want to display Chinese characters in the title of a frame window.\n\
    \n**Solution 1**: If you are using JDK 9 or higher on newer computers, you can\
    \ include Chinese characters in your Java source code and save it in UTF-8 encoding,\
    \ which is the default behavior of most programming editors. There is no need\
    \ to specify the \"SimSun\" font name. The system will will pick up the default\
    \ font to support Chinese characters. Chinese characters can still be provided\
    \ in Unicode /uxxxx ASCII format. But UTF-8 encoding is a much better option.\n\
    \n```\n /* JFrameChinese2.java\n * Copyright (c) 2014-2018 HerongYang.com All\
    \ Rights Reserved.\n*/\nimport java.awt.*;\nimport javax.swing.*;\npublic class\
    \ JFrameChinese2 {\n   public static void main(String[] a) {\n      JFrame f =\
    \ new JFrame();\n//    f.setFont(new Font(\"SimSun\",Font.PLAIN, 12));\n//   \
    \ f.setTitle(\"Hello world! - \\u7535\\u8111\\u4F60\\u597D\\uFF01\");\n      f.setTitle(\"\
    Hello world! - 电脑你好！\");\n      f.setBounds(100,50,500,300);\n      f.setDefaultCloseOperation(JFrame.EXIT_ON_CLOSE);\n\
    \      f.setVisible(true);\n   }\n}\n```\n\n**Solution 2**: If you are still using\
    \ an older version of JDK on an older computer, you may have to install Chinese\
    \ fonts yourself. In my sample code listed below, I am using font SimSun, which\
    \ was installed as part of the Windows multi-language support. You may also have\
    \ to enter Chinese characters in Java source code in /uxxxx ASCII format.\n\n\
    ```\n /* JFrameChinese.java\n * Copyright (c) 2014-2018 HerongYang.com All Rights\
    \ Reserved.\n */\nimport java.awt.*;\nimport javax.swing.*;\npublic class JFrameChinese\
    \ {\n   public static void main(String[] a) {\n      JFrame f = new JFrame();\n\
    \      f.setFont(new Font(\"SimSun\",Font.PLAIN, 12));\n      f.setTitle(\"Hello\
    \ world! - \\u7535\\u8111\\u4F60\\u597D\\uFF01\");\n      f.setBounds(100,50,500,300);\n\
    \      f.setDefaultCloseOperation(JFrame.EXIT_ON_CLOSE);\n      f.setVisible(true);\n\
    \   }\n}\n```\n\nIf you run both examples, you will get the same result:\n\n![](Images/image00134.jpeg)\n\
    \nChinese Characters in Title Bar\n\nNote 1: With JDK 1.4.1 or lower, the characters\
    \ are displayed as \"?\". I don't any way to fix it. If you have any suggestions,\
    \ please share them with me.\n\nNote 2: To check if you have SimSun font installed\
    \ or not on your Windows computer, you can look for %windir%\\fonts\\simsun.ttc\
    \ file in your system directory tree.\n\n[Java Swing Tutorials - Herong's Tutorial\
    \ Examples](#part0001.xhtml)\n\n∟[JFrame - Main Frame Class](#part0016.xhtml)\n\
    \n∟Drawing Graphics - Using paint() on Frame\n\nThis section provides a tutorial\
    \ example on how to override the paint() method in the javax.swing.JFrame class\
    \ to draw graphics (a rectangle) on the frame window. This solution is not recommended.\n\
    \n**Problem**: I want to draw some graphics in a frame.\n\n**Solution 1**: You\
    \ can do this very easily by extending JFrame class to create your own frame class\
    \ so that you can override the paint() method. The paint() method provides you\
    \ a Graphics object, which will give you utility methods to draw various types\
    \ of graphics. The following sample code, JFramePaint1.java, shows you how to\
    \ do this.\n\n```\n /* JFramePaint1.java\n * Copyright (c) 1997-2018 HerongYang.com.\
    \ All Rights Reserved.\n */\nimport java.awt.*;\nimport javax.swing.*;\npublic\
    \ class JFramePaint1 {\n   public static void main(String[] a) {\n      MyJFrame\
    \ f = new MyJFrame();\n      f.setTitle(\"Drawing Graphics in Frames\");\n   \
    \   f.setBounds(100,50,500,300);\n      f.setDefaultCloseOperation(JFrame.EXIT_ON_CLOSE);\n\
    \      f.setVisible(true);\n   }\n   static class MyJFrame extends JFrame {\n\
    \      public void paint(Graphics g) {\n         g.drawRect(20,10,100,60);\n \
    \     }\n   }\n}\n```\n\nIf you run this example, you will get:\n\n![](Images/image00135.jpeg)\n\
    \nUsing paint() on Frame\n\nNote 1: The paint() method is inherited by JFrame\
    \ class from the Component class. It will be called whenever this component should\
    \ be painted.\n\nNote 2: If you look at the rectangle displayed on the frame,\
    \ you will see that the origin of the drawing coordinates is located at the top\
    \ left corner of the entire frame, including the title bar.\n\nNote 3: By default,\
    \ the paint() method provides transparent background, in JDK 1.4, 1.5 and 1.6\\\
    . This is why you see a Web page showing up in the picture.\n\nNote 4: In JDK\
    \ 7 and higher, the paint() method does not provides transparent background.\n\
    \nThis solution is not recommended. We don't want to draw graphics in the frame\
    \ bar area.\n\n[Java Swing Tutorials - Herong's Tutorial Examples](#part0001.xhtml)\n\
    \n∟[JFrame - Main Frame Class](#part0016.xhtml)\n\n∟Drawing Graphics - Using paint()\
    \ on Component\n\nThis section provides a tutorial example on how to override\
    \ the paint() method in the javax.swing.Component class to draw graphics (a rectangle)\
    \ and add the component to the content pane of the frame window.\n\n**Problem**:\
    \ I want to draw some graphics in a frame.\n\n**Solution 2**: Obviously, solution\
    \ 1 is not so ideal, because we are drawing on the UI element of the frame itself.\
    \ To draw graphics only in the content area of the frame, we can create a new\
    \ component with its own paint() method and add it to the content pane of the\
    \ frame. The following sample code, JFramePaint2.java, shows you how to do this.\n\
    \n```\n /* JFramePaint2.java\n * Copyright (c) 1997-2018 HerongYang.com. All Rights\
    \ Reserved.\n */\nimport java.awt.*;\nimport javax.swing.*;\npublic class JFramePaint2\
    \ {\n   public static void main(String[] a) {\n      JFrame f = new JFrame();\n\
    \      f.setTitle(\"Drawing Graphics in a Frame\"\n         +\" by Adding a Component\"\
    );\n      f.setBounds(100,50,500,300);\n      f.setDefaultCloseOperation(JFrame.EXIT_ON_CLOSE);\n\
    \      f.getContentPane().add(new MyComponent());\n      f.setVisible(true);\n\
    \   }\n   static class MyComponent extends JComponent {\n    b  public void paint(Graphics\
    \ g) {\n         g.drawRect(20,10,100,60);\n      }\n   }\n}\n```\n\nIf you run\
    \ this example, you will get:\n\n![](Images/image00136.jpeg)\n\nUsing paint()\
    \ on Component\n\nNote 1: Since no size and location is given to the new added\
    \ component, it takes the entire area of the content pane, which is the entire\
    \ area of the frame without the title bar area.\n\nNote 2: Now the origin of the\
    \ drawing coordinates is at the top left corner of the content pane, much better\
    \ than solution 1.\n\n[Java Swing Tutorials - Herong's Tutorial Examples](#part0001.xhtml)\n\
    \n∟[JFrame - Main Frame Class](#part0016.xhtml)\n\n∟Drawing Graphics - Using paint()\
    \ on Content Pane\n\nThis section provides a tutorial example on how to override\
    \ the paint() method in the javax.swing.Component class to draw graphics (a rectangle)\
    \ and use it as the content pane of the frame window.\n\n**Problem**: I want to\
    \ draw some graphics in a frame.\n\n**Solution 3**: Solution 2 is still not so\
    \ perfect. Why do we need to add another component for the drawing? Can we draw\
    \ graphics directly on the content pane? The answer is yes, we can draw directly\
    \ on the content pane. The following sample code, JFramePaint3.java, shows you\
    \ how to do this.\n\n```\n /* JFramePaint3.java\n * Copyright (c) 1997-2018 HerongYang.com.\
    \ All Rights Reserved.\n */\nimport java.awt.*;\nimport javax.swing.*;\npublic\
    \ class JFramePaint3 {\n   public static void main(String[] a) {\n      JFrame\
    \ f = new JFrame();\n      f.setTitle(\"Drawing Graphics in a Frame\"\n      \
    \   +\" by Replacing the Content Pane\");\n      f.setBounds(100,50,500,300);\n\
    \      f.setDefaultCloseOperation(JFrame.EXIT_ON_CLOSE);\n      f.setContentPane(new\
    \ MyComponent());\n      f.setVisible(true);\n   }\n   static class MyComponent\
    \ extends JComponent {\n      public void paint(Graphics g) {\n         g.drawRect(20,10,100,60);\n\
    \      }\n   }\n}\n```\n\nIf you run this example, you will get:\n\n![](Images/image00137.jpeg)\n\
    \nUsing paint() on Content Pane"
