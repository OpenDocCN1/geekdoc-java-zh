    \         + \", \"+e.getKeyText(e.getKeyCode())\n         + \" on \"+item.getText());\n\
    \   }\n   public void menuKeyPressed(MenuKeyEvent e) {\n      MenuElement[] path\
    \ = e.getPath();\n      JMenuItem item = (JMenuItem) path[path.length-1];\n  \
    \    System.out.println(\"Key pressed: \"+e.getKeyChar()\n         + \", \"+e.getKeyText(e.getKeyCode())\n\
    \         + \" on \"+item.getText());\n   }\n   public void menuKeyReleased(MenuKeyEvent\
    \ e) {\n      MenuElement[] path = e.getPath();\n      JMenuItem item = (JMenuItem)\
    \ path[path.length-1];\n      System.out.println(\"Key released: \"+e.getKeyChar()\n\
    \         + \", \"+e.getKeyText(e.getKeyCode())\n         + \" on \"+item.getText());\n\
    \   }\n}\n```\n\n如果你运行此示例，你将看到显示如下菜单栏的框架：\n\n![](img/image065.jpeg)\n\nMenu Listener\
    \ Test\n\n如果你点击“Color”菜单保持打开状态，然后在键盘上输入“b” 键和“Shift” 键，你将在 Java 控制台窗口上看到打印的消息：\n\
    \n```\n State changed: 1 on Sound\nItem clicked: Help\nState changed: 1 on Auto\
    \ save\nItem clicked: Auto save\nState changed: 2 on Sound\nItem clicked: Sound\n\
    State changed: 2 on Auto save\nItem clicked: Auto save\n```\n"
