  trans: "\n\n本节提供了一个教程示例，介绍如何使用 `java.awt.event.ItemListener`（单选按钮和复选框项目监听器接口）来捕获单选按钮菜单项对象的状态改变项目事件。\n\
    \n由于 `JRadioButtonMenuItem` 类是一个特殊的菜单项类，它支持另一个事件监听器 `ItemListener`，这允许你捕获单选按钮的状态改变事件：\n\
    \n`java.awt.event.ItemListener` - 一个 AWT 接口，允许你实现自己的单选按钮状态改变事件处理方法：\n\n- `itemStateChanged(ItemEvent)`\
    \ - 当关联按钮的状态发生改变时调用的事件处理方法。你需要实现此方法来执行你自己的任务。\n\n`java.awt.event.ItemEvent` -\
    \ 一个代表在单选按钮上发生的事件的 AWT 类。该类中最重要的方法是：\n\n- `getStateChange()` - 该方法返回一个整数：如果状态变为“已选中”则返回\
    \ 1，如果状态变为“未选中”则返回 2。\n\n这里有一个我编写的用于测试 `ItemListener` 接口的示例程序：\n\n```java\n /*\
    \ JRadioButtonMenuItemListenerTest.java\n * Copyright (c) 1997-2018 HerongYang.com.\
    \ All Rights Reserved.\n */\nimport java.awt.event.*;\nimport javax.swing.*;\n\
    public class JRadioButtonMenuItemListenerTest {\n   JFrame myFrame = null;\n \
    \  public static void main(String[] a) {\n      (new JRadioButtonMenuItemListenerTest()).test();\n\
    \   }\n   private void test() {\n      myFrame = new JFrame(\"Menu Listener Test\"\
    );\n      myFrame.setDefaultCloseOperation(JFrame.EXIT_ON_CLOSE);\n      myFrame.setBounds(50,50,250,150);\n\
    \      myFrame.setContentPane(new JDesktopPane());\n\n      JMenuBar myMenuBar\
    \ = new JMenuBar();\n      JMenu myMenu = getFileMenu();\n      myMenuBar.add(myMenu);\n\
    \      myMenu = getColorMenu();\n      myMenuBar.add(myMenu);\n\n      MyMenuItem\
    \ myItem = new MyMenuItem(\"Help\");\n      myMenuBar.add(myItem);\n\n      myFrame.setJMenuBar(myMenuBar);\n\
    \      myFrame.setVisible(true);\n   }\n   private JMenu getFileMenu() {\n   \
    \   JMenu myMenu = new JMenu(\"File\");\n      MyMenuItem myItem = new MyMenuItem(\"\
    Open\");\n      myMenu.add(myItem);\n      myItem = new MyMenuItem(\"Close\");\n\
    \      myMenu.add(myItem);\n      myMenu.addSeparator();\n      myItem = new MyMenuItem(\"\
    Exit\");\n      myMenu.add(myItem);\n      return myMenu;\n   }\n   private JMenu\
    \ getColorMenu() {\n      JMenu myMenu = new JMenu(\"Color\");\n      ButtonGroup\
    \ myGroup = new ButtonGroup();\n      MyRadioButtonMenuItem myItem \n        \
    \ = new MyRadioButtonMenuItem(\"Red\");\n      myItem.setSelected(true);\n   \
    \   myGroup.add(myItem);\n      myMenu.add(myItem);\n      myItem = new MyRadioButtonMenuItem(\"\
    Green\");\n      myGroup.add(myItem);\n      myMenu.add(myItem);\n      myItem\
    \ = new MyRadioButtonMenuItem(\"Blue\");\n      myGroup.add(myItem);\n      myMenu.add(myItem);\n\
    \      return myMenu;\n   }\n   private class MyMenuItem extends JMenuItem \n\
    \      implements ActionListener {\n      public MyMenuItem(String text) {\n \
    \        super(text);\n         addActionListener(this);\n      }\n      public\
    \ void actionPerformed(ActionEvent e) {\n         System.out.println(\"Item clicked:\
    \ \"+e.getActionCommand());\n      }\n   }\n   private class MyRadioButtonMenuItem\
    \ extends JRadioButtonMenuItem\n      implements ActionListener, ItemListener\
    \ {\n      public MyRadioButtonMenuItem(String text) {\n         super(text);\n\
    \         addActionListener(this);\n         addItemListener(this);\n      }\n\
    \      public void actionPerformed(ActionEvent e) {\n         System.out.println(\"\
    Item clicked: \"+e.getActionCommand());\n      }\n      public void itemStateChanged(ItemEvent\
    \ e) {\n         System.out.println(\"State changed: \"+e.getStateChange()\n \
    \           +\" on \"+((MyRadioButtonMenuItem) e.getItem()).getText());\n    \
    \  }\n   }\n}\n```\n\n如果你运行这个示例，你将看到显示带有所示菜单栏的窗口：\n\n![](img/image00163.jpeg)\n\
    \n单选按钮菜单项监听器测试\n\n如果你点击“Help”菜单项并点击“Color”菜单中的菜单项，你将看到 Java 控制台窗口上打印了一些消息：\n\n\
    ```\n State changed: 1 on Red\nItem clicked: Help\nItem clicked: Red\nItem clicked:\
    \ Red\nState changed: 2 on Red\nState changed: 1 on Green\nItem clicked: Green\n\
    State changed: 2 on Green\nState changed: 1 on Blue\nItem clicked: Blue\n```\n\
